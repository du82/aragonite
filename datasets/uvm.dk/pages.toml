["https://www.uvm.dk/sitecore/content/global/news/uvm/2025/jan/250206-arbejdet-med-fagfornyelsen-indtraeder-i-ny-fase"]
title = "Arbejdet med Fagfornyelsen indtræder i ny fase | Børne– og Undervisningsministeriet"
full_description = "Som led i Aftale om Folkeskolens Kvalitetsprogram mellem regeringen (S, V og M), LA, KF, RV og DF i marts 2024 blev det besluttet, at folkeskolens nuværende Fælles Mål skal erstattes af slankere og mere enkle lærerplaner for folkeskolens fag. Dette arbejde er kaldt Fagfornyelsen. Børne- og Undervisningsministeriet etablerede i januar 2024 en ekspertgruppe, som skulle komme med anbefalinger til folkeskoleforligskredsen om de nærmere rammer for Fagfornyelsen. Ekspertgruppen afleverede sine anbefalinger i december 2024. Folkeskoleforligskredsen kvitterer for ekspertgruppens store arbejde og bakker op om ekspertgruppens anbefalinger med enkelte justeringer. Dermed er arbejdet med Fagfornyelsen klar til at gå ind i en ny fase, hvor 21 fagudvalg skal lave udkast til fagplaner for alle folkeskolens fag. Forligskredsen har blandt andet præciseret, at folkeskolens formål skal fremgå af alle fags fagplaner. Forligskredsen har i øvrigt præciseret, at de enkelte fagplaner maksimalt på være 7-10 normalsider med undtagelse af danskfaget, som må være op til 12 normalsider. Ligesom forligs-kredsen ønsker, at seksualundervisning, færdselslære og innovation og entreprenørskab fortsat har en plads i skolen. Etablering af rådgivningsgruppe for folkeskolens fagplaner Som led i næste fase af Fagfornyelsen har børne- og undervisningsministeren nedsat en rådgivningsgruppe. Rådgivningsgruppen skal sikre, at intentioner og pejlemærker for Fagfornyelsen videreføres i arbejdet med de enkelte fags fagplaner frem til skoleåret 2027/2028, hvor fagplanerne træder i kraft. Rådgivningsgruppen er en delvis videreførelse af ekspertgruppen. Gruppen består af syv medlemmer, der har viden om og erfaringer med udvikling af folkeskolen og folkeskolens fag. Rådgivningsgruppen består af: Lise Tingleff Nielsen, områdechef for grundskole, Danmarks Eva-lueringsinstitut (formand) Thomas Illum Hansen, forskningschef, UCL Erhvervsakademi og Professionshøjskole Helle Bjerg, skoleleder, Skolen på Grundtvigsvej, Frederiksberg Kommune Peter Staun Kastholm, direktør, Træningsskolens Arbejdsmar-kedsuddannelser Anne Hammer, lærer ved Sejs Skole, Silkeborg. Betina Hollen Tofting, lærer ved Hedegårdsskolen, Brønderslev. Thomas Kaas, ph.d., Professionshøjskolen Absalon, læreruddannelsen Roskilde Derudover etablerer Styrelsen for Undervisning og Kvalitet i samarbejde med rådgivningsgruppen en fagdidaktisk fagplansgruppe, der skal understøtte rådgivningsgruppen og de 21 fagudvalg, der er nedsat til at udarbejde de nye fagplaner. Næste skridt i arbejdet med Fagfornyelsen I næste fase af Fagfornyelsen skal de 21 fagudvalg udarbejde udkast til nye fagplaner. Fagudvalgene vil løbende inddrage viden og erfaringer fra praksis og videnspersoner, der kan bidrage til at kvalificere fagudvalgenes arbejde. Alle grundskoler får mulighed for at arbejde med og gøre sig erfaringer med de nye fagplaner i de kommende to skoleår. Fra skoleåret 2025/2026 inviteres folkeskoler til at deltage i et udviklingsprogram om afprøvning af fagplaner, hvor skolerne kan afprøve og give feedback på foreløbige udkast til fagplanerne. Formålet er at sikre, at fagplanerne udvikles med afsæt i praksis og bliver anvendelige redskaber for lærerene. Mere information om udviklingsprogrammet forventes udmeldt i marts 2025. Folkeskolens nye fagplaner træder i kraft fra skoleåret 2027/2028. Læs mere Læs mere om Aftale om Fagfornyelsen (pdf) Læs ekspertgruppens anbefalinger til Fagfornyelsen (pdf) Se eksempel på formatet for en fagplan (pdf) Læs kommissorium for rådgivningsgruppe for folkeskolens fagplaner (pdf) Læs mere om arbejdet med Fagfornyelsen"
