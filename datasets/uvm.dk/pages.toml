["https://www.uvm.dk/sitecore/content/global/news/uvm/2024/okt/241008-stort-set-alle-unge-skal-have-adgang-til-gymnasiet"]
title = "Stort set alle unge skal have adgang til gymnasiet: Regeringen vil oprette nyt erhvervs- og professionsrettet gymnasium | Børne– og Undervisningsministeriet"
full_description = '''Regeringen ønsker at ændre ungdomsuddannelserne grundlæggende med en omfattende reform. Regeringen foreslår blandt andet at etablere en ny erhvervs- og professionsrettet gymnasieuddannelse (epx) og samtidig skærpe adgangen til de treårige gymnasiale uddannelser hhx og stx ved at hæve karakterkravet til 6,0. Det er regeringens ambition, at størstedelen af alle unge i fremtiden skal tilbydes en gymnasieuddannelse, og at der fremover vil være én tydelig vej efter grundskolen: En gymnasial uddannelse med tre spor. Reformen skal grundlæggende sikre, at alle unge har et attraktivt uddannelsestilbud i nærheden, at alle unge får et par år i et godt og attraktivt socialt ungemiljø, inden de vælger en bestemt uddannelsesretning, og at de unge - uanset valg af ungdomsuddannelse - ikke lukker døre for videre uddannelse senere i livet. Der bliver markant færre unge i de kommende år. I 2035 vil cirka halvdelen af landets kommuner opleve et fald i ungdomsårgangene på ti procent eller mere, og det betyder, at det år for år bliver sværere at drive ungdomsuddannelser i hele landet - særligt uden for de største byer. I dag skal unge tage et valg meget tidligt i livet, som de sjældent er parate til, men som er afgørende for deres videre vej: Valget mellem boglige eller praktiske uddannelser. Det på trods af, at et stigende antal unge i dag søger mod uddannelser med en kombination af det praktiske og teoretiske. Med regeringens udspil får de unge bedre tid til at tænke sig om, og uddannelserne indrettes i højere grad efter de unges ønsker. Regeringens forslag indebærer merudgifter på ca. 2,3 milliarder kroner årligt fra 2030 og frem. Det svarer til et løft på cirka 10 procent i forhold til udgifterne til ungdomsuddannelserne i dag. Derudover foreslår regeringen at afsætte samlet set 4,8 milliarder kroner i 2027-2034, svarende til i gennemsnit cirka 0,6 milliarder kroner årligt i perioden, til engangsinvesteringer i bygninger, værksteder og udstyr til det nye praktiske gymnasium samt omlægning af uddannelses- og institutionslandskabet. Samtidig afsættes der cirka 5 milliarder kroner varigt til at drive epx, når uddannelsen er fuldt indfaset. En ny praktisk gymnasieuddannelse, epx På den nye erhvervs- og professionsrettede gymnasieuddannelse (epx) vil de unge blive mødt af en kombination af praktisk og teoretisk undervisning. Uddannelsen vil tage to år og give adgang til erhvervsuddannelser og være adgangsgivende til erhvervsakademiuddannelserne samt visse professionsbacheloruddannelser som eksempelvis bioanalytiker, radiograf og socialrådgiver. Det bliver muligt at tage en overbygning på et år, der giver generel adgang til de øvrige professionsuddannelser som eksempelvis bygningskonstruktør, folkeskolelærer og sygeplejerske. Derudover giver en udvidet fagpakke på op til 6 måneder adgang til akademiske bacheloruddannelser. Det vil kræve en bestået afgangseksamen fra grundskolen at komme ind på epx. Det kan give op mod 11.500 flere unge adgang til en gymnasieuddannelse. "I dag møder mange unge en lukket dør til gymnasiet. Det er uretfærdigt. Derfor vil regeringen nu åbne døren for en ny erhvervs- og professionsrettet gymnasieuddannelse. Det bliver uden oldtidskundskab og kemi på højniveau. Til gengæld vil der være samarbejde med virksomheder og mere praktisk undervisning. Det kommer til at koste et større milliardbeløb, fordi det skal være absolut topkvalitet. Efter uddannelsen vil de unge både have mulighed for at starte på en erhvervsuddannelse eller studere på en videregående uddannelse,” siger børne- og undervisningsminister Mattias Tesfaye. De fem vigtigste ting, du skal vide om epx 1. Ny erhvervs- og professionsrettet gymnasieuddannelse, epx Regeringen vil oprette en ny erhvervs- og professionsrettet gymnasieuddannelse, epx, med en kombination af praktisk og teoretisk undervisning. Stort set alle unge skal have adgang til gymnasiet - enten på epx, stx, eller hhx. Regeringen arbejder på en løsningsmodel, hvor htx for eksempel integreres helt eller delvist i stx. 2. Alle døre til videre uddannelse er åbne Unges valg må ikke lukke døre for videre uddannelse senere i livet. Epx giver efter to år adgang til erhvervsuddannelserne, erhvervsakademiuddannelser og en række professionsbacheloruddannelser. Tre år på epx giver adgang til alle professionsbacheloruddannelser og med en udvidet fagpakke også adgang til universitetet. 3. Gode sociale ungdomsmiljøer Alle unge skal have mulighed for et par år mere til at blive klogere på, hvad de gerne vil, i et godt socialt miljø med jævnaldrende klassekammerater og studieture, musicals og fester. 4. Bæredygtige gymnasieuddannelser i hele landet Epx skal placeres på eksisterende erhvervsskoler eller gymnasier for at samle de unge og skabe bæredygtige ungdomsuddannelser i hele landet, selv om særligt landområderne er udfordret af faldende ungdomsårgange. 5. Massiv investering i ungdomsuddannelserne Regeringens forslag koster cirka 2,3 milliarder kroner årligt fra 2030 og frem. Det svarer til et løft på cirka 10 procent i forhold til udgifterne i dag. Regeringen vil derudover afsætte 4,8 milliarder kroner samlet set over årene 2027-2034 til implementering af epx og omlægning af uddannelses- og institutionslandskabet. Det er regeringens ambition at etablere den nye uddannelse i alle 87 uddannelsesbyer i landet for at sikre lige adgang for alle unge, uanset hvor i landet de bor. Epx skal placeres på eksisterende erhvervsskoler eller gymnasier. Som led i den kommende reform lægger regeringen desuden op til, at institutioner lægges sammen til større enheder, og at 10. klasse, grundforløbets 1. del på erhvervsuddannelserne, eux og den toårige hf integreres i den nye ungdomsuddannelse. Regeringen arbejder på en løsningsmodel, der adresserer udfordringerne med elevgrundlaget på htx, eventuelt i form af en model, hvor htx helt eller delvist integreres i stx. Det skal sikre, at eleverne bliver samlet på bæredygtige skoler med attraktive faglige og sociale ungdomsmiljøer på trods af de faldende ungdomsårgange. Dette er uddybet i faktaark 1-3. Unge, der begynder på epx, skal vælge linje efter deres faglige interesse eller nysgerrighed. Det kunne for eksempel være linjer som ’Handel og kontor’, ’Velfærd og sikkerhed’ eller ’Håndværk og teknik’. Uanset valg af linje mødes de unge i et fælles ungdomsmiljø. De kan spille bordfodbold, gå i skolens fitnesscenter og møde ind til den samme fælles morgensamling med de andre gymnasieelever på skolen. Når undervisningen er slut, kan de spille musik eller øve i skolens musicalband. De kan mødes i fredagsbaren, til gymnasiefesterne eller til den årlige gallafest. Én vej efter grundskolen: Flere skal have en gymnasial uddannelse Med udspillet foreslår regeringen, at alle unge i fremtiden skal tilbydes en gymnasieuddannelse, uanset om man som ung bagefter ønsker at læse på universitetet, tage en erhvervsuddannelse eller begynde på en erhvervsakademi- eller professionsbacheloruddannelse. Det skal gøre det overskueligt for de unge at træffe et valg og sikre, at alle unge får mulighed for at udskyde deres valg af karrierevej og får almene studieforberedende kompetencer. I det nye uddannelseslandskab skal det almene gymnasium (stx) og handelsgymnasiet (hhx) være for de unge, der ønsker et bogligt højt niveau og er motiverede for at læse videre på en videregående uddannelse. Derfor skærpes karakterkravet på disse uddannelser til 6,0. En skærpelse af karakterkravet vil medføre en fagligt stærkere elevgruppe og kan gøre det muligt at gennemføre disse uddannelser med et højere niveau fra første skoledag. ”Da jeg var teenager, var gymnasiet mest for de boglige unge. I dag søger det store flertal mod gymnasierne. Til gengæld er der forbløffende mange, som ikke bruger deres studenterhue til at læse videre. Med et skærpet adgangskrav ønsker vi, at de meget boglige af gymnasieuddannelserne er for elever, der glæder sig til en skoledag med tunge bøger og lange afleveringer. Det skal være for dem, som efterfølgende ønsker at studere på en videregående uddannelse. Det giver os samtidig mulighed for at sikre et tilstrækkeligt højt bogligt niveau og for eksempel overveje, om flere skal have naturvidenskab eller sprogfag på højniveau i stedet for samfundsfag,” siger børne- og undervisningsminister Mattias Tesfaye. Gode veje til dem, der ikke er klar Unge, der allerede i grundskolen er afklarede om, at de vil søge ind på en erhvervsuddannelse, vil fortsat have mulighed for det. Samtidig får elever, der ikke består folkeskolens afgangseksamen, som noget nyt ret til den forberedende grunduddannelse (fgu). Disse to veje uddybes i nedenstående faktaark 4 og 6. Efterskolerne kan i et nyt uddannelseslandskab tilbyde et 10. skoleår, hvor det faglige indhold minder om indholdet af og kravene til 10. klasse i dag. Dermed bevares et fagligt og attraktivt skoletilbud på efterskoler i skoleåret efter 9. klasse. Det vil dog ikke længere være muligt at aflægge folkeskolens prøver i det 10. skoleår på efterskole og dermed forbedre karaktergennemsnittet af folkeskolens afgangseksamen. Elever, der ikke har bestået folkeskolens afgangseksamen, får mulighed for at aflægge en prøve på efterskolen, der giver adgang til epx. Frie fagskoler får samme mulighed for at tilbyde et tilsvarende fagligt skoleår efter 9. klasse. Unge og voksne, som ikke tager den lige vej i det ordinære uddannelsessystem, eller som senere i livet ønsker at skifte spor, skal have gode og fleksible uddannelsestilbud i et nyt uddannelseslandskab. Hf-enkeltfag erstattes fremover af gymnasiale enkeltfag. Regeringen vil med afsæt i udspillet indkalde partierne i Folketinget til forhandlinger om en reform af ungdomsuddannelserne. Læs mere Læs hele udspillet 'Flere i gymnasiet' (pdf) Note: i forhold til den trykte version af pjecen er en rettelse, hvor ordene “standpunkt eller” er tilføjet fodnote til figur 7 Faktaark 1. Fremtidens gymnasium (pdf) 2. Epx – et erhvervs- og professionsrettet gymnasium (pdf) 3. Et bæredygtigt institutionslandskab (pdf) 4. Nye muligheder i skoleåret efter 9. klasse (pdf) 5. Skærpet karakterkrav til de treårige gymnasiale uddannelser (pdf) 6. Erhvervsuddannelserne i et nyt uddannelseslandskab (pdf) 7. Hf og VUC i nyt uddannelseslandskab (pdf) 8. Økonomi og implementering (pdf) Om reformkommissionens anbefalinger Regeringen bygger med udspillet til en reform af ungdomsuddannelserne videre på anbefalingerne fra Reformkommissionen. Reformkommissionen præsenterede i maj 2023 Nye Reformveje 2, der indeholder anbefalinger om ungdomsuddannelsesområdet. Sigtet med kommissionens anbefalinger var, at der skabes en attraktiv vej gennem uddannelsessystemet for alle unge. Reformkommissionen konkluderede, at der i dag ikke er et ungdomsuddannelsestilbud til de unge, der ønsker noget andet end gymnasiet. Reformkommissionen anbefalede en gennemgribende nytænkning af de uddannelsesmuligheder, som unge møder, når de forlader grundskolen efter 9. klasse. Pressemøde om reform af uddannelseslandskabet'''
