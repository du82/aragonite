["https://www.uvm.dk/dagtilbud/om-dagtilbud/dagpleje"]
title = "Dagpleje | Børne– og Undervisningsministeriet"
description = "Information om kommunal og privat dagpleje"
full_description = "Kommunal dagpleje Kommunal dagpleje drives af kommunen og er et tilbud, hvor børnene bliver passet i hjemligt miljø af en eller flere dagplejere. Kommunen anviser pladser i de enkelte dagplejere. Der kan i den enkelte dagpleje modtages op til 5 børn. Varetages dagplejen af flere personer, kan kommunen beslutte, at der i dagplejen kan modtages op til 10 børn. Privat dagpleje Privat dagpleje er baseret på en aftale mellem den private dagplejer og kommunen. Privat dagpleje er et tilbud, hvor børnene bliver passet i hjemligt miljø af en eller flere dagplejere. Kommunen anviser som udgangspunkt pladser i de private dagplejere. Kommunalbestyrelsen kan beslutte, at den enkelte private dagpleje helt eller delvist selv træffer afgørelse om optagelse i dagplejen. Som det gælder for den kommunale dagpleje, kan der i den enkelte dagpleje modtages op til 5 børn. Varetages dagplejen af flere personer, kan kommunalbestyrelsen beslutte, at der i dagplejen kan modtages op til 10 børn. Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven)"
