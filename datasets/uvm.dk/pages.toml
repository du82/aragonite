["https://www.uvm.dk/folkeskolen/folkeskolens-proever/faglig-forberedelse/tekstopgivelser-og-undervisningsbeskrivelser"]
title = "Tekstopgivelser og undervisningsbeskrivelser | Børne– og Undervisningsministeriet"
description = "Opgivelser og/eller undervisningsbeskrivelser og samarbejdet med censor."
full_description = "Skolen skal lave tekstopgivelser og/eller undervisningsbeskrivelser for hvert hold i de fag, hvor der er en mundtlig og/eller en praktisk-mundtlig prøve. Skolelederen kvalitetssikrer indholdet i tekstopgivelser og/eller undervisningsbeskrivelser, underskriver dem og sender til censor sammen med lodtrækningsmateriale og eventuelle bilag. Almindelige frister for tekstopgivelser i prøvefag Censor skal have tekstopgivelser og/eller undervisningsbeskrivelser senest 14 kalenderdage, før prøven afholdes. Censor har ansvar for at kontakte faglæreren for at drøfte prøveafholdelsen. Skolelederen kan efter behov inddrages i drøftelserne. Særlige frister for tekstopgivelser i valgfag I valgfaget håndværk og design skal censor have modtaget undervisningsbeskrivelse, prøveoplæg og praktiske oplysninger om prøven senest 14 kalenderdage før del A. I valgfaget madkundskab skal censor have modtaget undervisningsbeskrivelse, prøveoplæg og praktiske oplysninger om prøven senest 14 kalenderdage, før eleven trækker prøveoplægget. Læs mere om undervisningsbeskrivelser og prøveoplæg til valgfagene i fagenes prøvevejledninger. Frist for information til elever om opgivelser Eleverne skal informeres om opgivelser, undervisningsbeskrivelser, fordybelsesområder, temaer eller andet forberedelsesmateriale til de mundtlige og praktiske prøver. Eleverne kan ikke trække fordybelsesområde, tema og andet forberedelsesmateriale, hvis de ikke har fået oplyst opgivelserne til de enkelte prøver. Blanketter til tekstopgivelser eller undervisningsbeskrivelser Skolen kan anvende fortrykte blanketter eller udarbejde egne blanketter. De skoler, der anvender et elektronisk elevadministrationssystem, kan bruge elektroniske blanketter. Uanset hvilken form for blanket, skolen anvender, skal den underskrives af skolelederen eller den prøveansvarlige. Blanketterne skal indeholde oplysninger om: prøvefag lærerens navn klassens/holdets betegnelse antal elever dato for prøvens afholdelse censors navn og navnet på censors skole. Relevante oplysninger om de tekster, der opgives til prøven. Hvis censor er statsligt beskikket, skrives der “B” i stedet for navnet på censors skole. Hvis der ikke opgives det samme materiale for alle elever på holdet, skal det fremgå på blanketten, hvordan opgivelserne fordeles for de enkelte elever eller for grupper af elever. Læs mere Læs mere om tekstopgivelser og undervisningsbeskrivelser for de enkelte fag i prøvevejledningerne. Normalside En normalside er på 1.300 bogstaver, uanset teksttype. Andre udtryksformer, herunder billede, lyd og video, opregnes ikke i normalsider. Kun hvis manus til video og film opgives som tekst, udregnes normalsider."
year_published = 2025
