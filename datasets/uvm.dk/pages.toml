["https://www.uvm.dk/dagtilbud/plads-i-dagtilbud/optagelse-i-dagtilbud"]
title = "Optagelse i dagtilbud | Børne– og Undervisningsministeriet"
full_description = "Kommunen skal fastsætte retningslinjerne for optagelse i dagtilbud, herunder for ansøgning om optagelse, ud fra de lokale behov i kommunen. Ved fastsættelse af retningslinjer kan den enkelte kommune inden for pasningsgarantiens rammer tage hensyn til eksempelvis søskende, sammensætning af børnegruppen, dagtilbuddets geografiske placering og børn med særlige behov. Kommunalbestyrelsen kan beslutte, at den enkelte selvejende daginstitution, udliciterede daginstitution, private dagpleje eller puljeordning selv træffer afgørelse om optagelse i institutionen, dagplejen eller puljeordningen. Vente og ønske om optagelse i bestemte dagtilbud Forældre har mulighed for at tilkendegive ønsker om optagelse i konkrete dagtilbud. Kommunalbestyrelsen skal inden for rammerne af retningslinjerne sikre, at forældre, der står på venteliste, og som fortsat er interesseret i pladsen, anvises plads efter anciennitet. Muligheden for at tilkendegive ønsker om optagelse i konkrete dagtilbud gælder også, hvis forældrene ønsker en plads i et dagtilbud i en anden kommune Optagelse og opskrivning Optagelse og opskrivning sker efter den pågældende kommunes retningslinjer. Kontakt kommunen for konkrete oplysninger om optagelse og opskrivning. Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven)"
