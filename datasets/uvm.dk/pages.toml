["https://www.uvm.dk/erhvervsuddannelser"]
title = "Erhvervsuddannelser (eud, euv, eux) | Børne– og Undervisningsministeriet"
description = "Læs mere om erhvervsuddannelser. Erhvervsuddannelserne har tre spor: for unge (eud), for voksne (euv) og som kombination med gymnasial eksamen (eux)."
full_description = "Forside Erhvervsuddannelser Erhvervsuddannelserne skal sikre Danmark dygtige faglærte. De flere end 100 uddannelser giver mulighed for job som faglært eller videreuddannelse. Uddannelser Erhvervsuddannelserne har tre spor: for unge (eud), for voksne (euv) og som kombination med gymnasial eksamen (eux). Adgang og optagelse Få overblik over adgangskravene og hvordan du kan komme i gang med en erhvervsuddannelse. Undervisning og læringsmiljø Tilrettelæggelsen skal tilgodese høj faglighed, forskellige forudsætninger og fællesskab. Oplæring Oplæring i virksomhed, uddannelsesaftaler, muligheder for skoleoplæring og oplæring i udlandet. Prøver og eksamen Samlet overblik over prøver og eksamener på de forskellige niveauer i en erhvervsuddannelse. Skoleudvikling Der er opstillet fire kvalitetsmål for erhvervsuddannelsernes udvikling. Eud-læringskonsulenterne understøtter arbejdet med de fire klare mål. Ansvar og aktører Fordeling af ansvar, procedurer for tilsyn, klager og godkendelse som udbyder af erhvervsuddannelser. Lovgivning og politiske aftaler Find aftaler, love og bekendtgørelser. Aktuelt SOSU-aftale... Læs om aftalen og de 13 initiativer i Aftale om flere social- og sundhedsassistenter og social- og sundhedshjælpere til vores sundhedsvæsen og ældrepleje. Nyhed · 24. februar 2025 Ny måling: Elevernes trivsel på landets ungdomsuddannelser og fgu er fortsat høj Nyhed · 11. februar 2025 Udbudsrunde for AMU-Vests tidligere udbudsgodkendelser Nyhed · 5. december 2024 Erhvervsskolen Rybners overtager midlertidigt udbuddet af uddannelser fra konkursramte AMU-Vest Se flere nyheder"
