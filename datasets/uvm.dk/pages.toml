full_description = "Forside Vejledning og støttemuligheder VIBUS Vidensenhed om børn og unge med særlige behov. Om VIBUS Her kan du læse mere om Vidensenhed for børn og unge med særlige behov, der er nedsat af børne- og undervisningsministeren. Forsøg og udviklingsprojekter VIBUS har igangsat en række forsøg og udviklingsprojekter. Undersøgelser VIBUS har igangsat en række undersøgelser på grundskoleområdet og dagtilbudsområdet. Efterhånden som undersøgelserne afsluttes, vil de resultere i en række analyserapporter såvel som værktøjer mv., som kan anvendes som inspiration for udvikling af praksis. Det sker i VIBUS Oversigt over VIBUS' afholdte og kommende arrangementer og offentliggørelser."
