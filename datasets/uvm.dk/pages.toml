["https://www.uvm.dk/folkeskolen/laering-og-laeringsmiljoe"]
title = "Læring og læringsmiljø | Børne– og Undervisningsministeriet"
description = "Trivsel, inklusion, specialundervisning, tosprogede elever samt varierede og alsidige undervisningsformer."
full_description = "Forside Folkeskolen Læring og læringsmiljø Undervisningen skal varieres, så den tager hensyn til de enkelte elevers behov og forudsætninger. Elevernes motivation, trivsel og faglige udbytte skal styrkes – også når der kræves særlig støtte. Trivsel og undervisningsmiljø Landets folkeskoler skal gennemføre målinger af elevernes trivsel og lave undervisningsmiljøvurderinger. Fraværsregler i folkeskolen Film og fakta om reglerne for fravær i folkeskolen. Materialet findes på både dansk, engelsk, arabisk, polsk, tyrkisk og urdu. Sprogprøver Sprogprøver målrettet elever i folkeskolen og på frie grundskoler. Pædagogisk Læringscenter Fokus på medarbejdernes brug af forskningsbaseret viden, læringsprocesser og resultater og på skolens udviklingsinitiativer. Inklusion Regler om inklusion, støtte til inklusion, supplerende undervisning og faglig støtte. Specialundervisning Særlige hensyn, særlig støtte, specialklasser, specialskoler og specialpædagogisk bistand. Tosprogede Indsatser og fag målrettet tosprogede elever samt lovgivning og publikationer på området. Understøttende undervisning Forskellige måder at lære på, kobling mellem teori og praksis og træning af faglige og personlige færdigheder. Lektiehjælp og faglig fordybelse Faglig træning, faglige udfordringer eller særlige, tilpassede turboforløb skal indgå i tilrettelæggelsen. Bevægelse 45 minutter om dagen - i fagundervisningen, i understøttende undervisning og i samarbejde med foreningslivet. Den åbne skole Inddragelse af det omgivende samfund i form af idrætsforeninger, musik- og billedskoler og ungdomsskolen. Ro og klasseledelse God klasseledelse har indflydelse på både den faglige og den sociale udvikling for eleverne. Anbefalinger om skærmbrug til grundskoler og fritidstilbud Skærmanbefalingerne skal inspirere skoler og fritidsinstitutioner til, hvordan de kan skabe en hverdag med mindre skærmbrug for børnene."
