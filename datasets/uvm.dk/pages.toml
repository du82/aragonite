full_description = "Forside Erhvervsuddannelser Undervisning og læringsmiljø på erhvervsuddannelser Tilrettelæggelse af undervisningen skal tilgodese elevernes forskellige forudsætninger og sikre høj faglighed og sammenhæng mellem skole og oplæring. Læringsmiljøet skal støtte op om elevernes trivsel og motivation. Differentiering Undervisningen skal tilrettelægges i forhold til de enkelte elevers læringsbehov. Læringsmiljø Et godt læringsmiljø bygger på plads til fællesskab og til forskellige forudsætninger. Grundfag, fagbilag og vejledninger Fagbilag og vejledninger til grundfagene og erhvervsrettet andetsprogsdansk. Kobling mellem skole og oplæring God kobling mellem skole og oplæring motiverer eleverne og øger deres læring. Minimumstimetal for lærerstyret undervisning Hver elev skal modtage minimum 26 klokketimers lærerstyret undervisning om ugen. Motion og bevægelse Motion og bevægelse i mindst 45 minutter om dagen i gennemsnit er en del af grundforløbet. Viden og læringsressourcer emu.dk formidler viden, erfaringer og inspiration om læring og it. DM i Skills På DM i Skills viser eud-elever deres talenter og faglighed."
