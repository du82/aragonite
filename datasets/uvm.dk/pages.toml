title = "Viden om dagtilbud på emu.dk | Børne– og Undervisningsministeriet"
full_description = "emu dagtilbud (emu.dk) er en sektion på emu.dk, hvor medarbejdere og ledere i dagtilbud kan finde forløb og gode ideer til aktiviteter og læringsforløb, som kan understøtte arbejdet med den pædagogiske læreplan. emu dagtilbuds formål emu dagtilbud har til formål at formidle best practice og evidensbaseret viden og bidrage med eksempler på alt fra it-understøttede læringsaktiviteter over forskningsartikler til sang- og bevægelsesaktiviteter til det pædagogiske personale. emu dagtilbud er et redskab, der skal være med til at sikre, at det pædagogiske personale får nem adgang til vidensbaserede læringsaktiviteter. Inspiration og redskaber På emu dagtilbud er der blandt andet inspiration til arbejdet med de seks læreplanstemaer, og der er tværgående emner som for eksempel forældreinvolvering. Gå til emu's hjemmeside for tilmelding til nyhedsbrev Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven) Bekendtgørelse om pædagogiske mål og indhold i seks læreplanstemaer (retsinformation.dk)"
