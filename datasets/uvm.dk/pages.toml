["https://www.uvm.dk/sitecore/content/global/news/uvm/2024/dec/101224---ny-undersoegelse-mange-voksne-har-stadig-mangelfulde-faerdigheder-i-laesning-og-regning"]
title = "Ny undersøgelse: Mange voksne har stadig mangelfulde færdigheder i læsning og regning | Børne– og Undervisningsministeriet"
full_description = '''16-65-åriges færdigheder i læsning og regning er generelt forbedret over de seneste ti år, men en stor andel af voksne danskere har stadig et lavt færdighedsniveau i læsning og regning. Det viser resultaterne fra den nye internationale OECD-undersøgelse PIAAC, som sidst blev gennemført i 2011/2012. VIVE og Danmarks Statistik har gennemført PIAAC-undersøgelsen i Danmark, der måler på færdigheder, den enkelte har behov for at anvende i hverdagen. For eksempel om man kan læse og forstå en varedeklaration og bruge tal og regning, når man skal købe maling til sin stue. 18 procent med lavt færdighedsniveau Konkret viser resultaterne, at der ikke er sket nogen ændring i, hvor stor en andel af 16-65-årige, der har et lavt færdighedsniveau. 18 procent af voksne danskere har et lavt færdighedsniveau i læsning, mens det gælder 17 procent i regning. Det svarer til henholdsvis cirka 667.000 og 620.000 personer og er højere andele end i Norge, Sverige og Finland. Det er ofte de samme personer, der har et lavt færdighedsniveau i læsning og regning. I alt har ca. 550.000 voksne både læse- og regnefærdigheder på et lavt niveau. Voksne med færdigheder på et lavt niveau findes i mange forskellige befolkningsgrupper. Dog er 55-65-årige, personer med grundskole som højest gennemførte uddannelse og personer uden for arbejdsstyrken overrepræsenterede i denne gruppe. ”Mange voksne danskere har svært ved at læse og regne. De fleste forsørger sig selv og har et godt liv. Men det kan være en udfordring at gennemskue sin privatøkonomi eller læse en godnathistorie for børnene. Samtidig ved vi, at kravene også stiger på mange arbejdspladser. Voksenuddannelse er derfor en mærkesag for mig. Vi har efterhånden rigtig gode erfaringer med undervisning i dansk, matematik, engelsk og it. Men der bør gennemføres markant mere, end vi gør i dag. Det handler blandt andet om at tilrettelægge undervisningen, så det passer folk, der også har et arbejde og familieliv,” siger børne- og undervisningsminister Mattias Tesfaye. ”Undersøgelsen viser, at vi er på rette vej. Vi har med finanslovsaftalen prioriteret midler til voksne, der har svært ved at læse, skrive og regne. For selv om det går fremad, har en gruppe af den voksne befolkning fortsat store udfordringer. Alle i Danmark skal have mulighed for at tilegne sig de basale færdigheder, der gør, at de kan klare sig i samfundet," siger beskæftigelsesminister Ane Halsboe-Jørgensen. Danmark ligger under andre nordiske lande PIAAC-undersøgelsen viser desuden, at 16-65-åriges gennemsnitlige færdighedsscore siden 2011/12 generelt er forbedret med henholdsvis 9 og 8 point i læsning og regning. Danmark ligger dog stadig på et lavere niveau end andre nordiske lande som Norge, Sverige og Finland. Figur 1 viser 16-65-åriges færdigheder i læsning og regning i de nordiske lande og OECD, 2022/23. Gennemsnitlig score. En stor del af forbedringen i læse- og regnefærdighederne hænger sammen med, at de 16-65-åriges uddannelsesniveau er steget fra 2011/12-2022/23. Det er især danskere i alderen 25-34 år og personer med lang videregående uddannelse, der har forbedret deres færdigheder. I en række andre lande er færdighedsniveauet uændret eller faldet trods et generelt stigende uddannelsesniveau. Danmark og Finland er de eneste blandt de 31 deltagende lande i PIAAC, hvor de 16-65-årige generelt har bedre læsefærdigheder end i 2011/12. I otte lande har de 16-65-årige forbedret regnefærdighederne, heriblandt Danmark, Norge, Sverige og Finland. Fakta om PIAAC Programme for International Assessment of Adult Competencies (PIAAC) er en international OECD-undersøgelse af voksnes basale færdigheder i læsning og regning, som gennemføres hvert tiende år. Undersøgelsen er finansieret af Børne- og Undervisningsministeriet, Beskæftigelsesministeriet, Uddannelses- og Forskningsministeriet, Erhvervsministeriet, Udlændinge- og Integrationsministeriet samt Finansministeriet. PIAAC blev gennemført for første gang i 2011/12, hvor Danmark også deltog. I Danmark deltog ca. 5.000 tilfældigt udvalgte danskere i 2022/23. Ud over test af basale færdigheder består undersøgelsen af et baggrundsspørgeskema. 31 lande deltog i undersøgelsen, herunder Norge, Sverige og Finland. Læs mere om PIAAC Læs hele PIAAC 2022/2023-rapporten (pdf) Læs udvalgte danske resultater fra PIAAC 2022/2023 (pdf) Læs mere baggrund om PIAAC Læs mere om PIAAC på VIVE's hjemmeside (vive.dk) Læs, hvordan du kan få adgang til PIAAC-data'''
