["https://www.uvm.dk/folkeskolen/folkeskolens-proever/bedoemmelse-og-censur/indberetning-af-karakterer"]
title = "Indberetning af karakterer | Børne– og Undervisningsministeriet"
description = "Indberetning af karakterer sker elektronisk umiddelbart efter prøverne."
full_description = "Efter prøvernes afslutning skal skolen indberette elevernes prøvekarakterer til Styrelsen for It og Læring. Indberetningen af karakterer sker i juni for prøver afholdt i maj/juni-terminen og i januar for prøver afholdt i december/januar-terminen (syge- og semesterprøver). Se fristerne her. Indberetningen sker ved elektronisk overførsel af data til Styrelsen for It og Læring fra skolens administrative system (viden.stil.dk) eller ved en manuel indtastning (viden.stil.dk) til Karakterdatabasen. På Styrelsen for It og Lærings vidensbase (viden.stil.dk) kan du læse mere om, hvilke prøvekarakterer som skal indberettes, og hvordan man indberetter prøvekaraktererne. Skolerne modtager forud for karakterindberetningen en meddelelse fra Styrelsen for It og Læring med angivelse af frister og yderligere informationer om indberetningen. Tekniske og praktiske spørgsmål Tekniske og praktiske spørgsmål om indberetning af karakterer kan stilles til supporten for Karakterdatabasen på telefon 70 21 21 54 eller skriftligt. Statistik om karakterer Alle data om karakterer for elever i 8., 9. og 10. klasse kan findes i Undervisningsministeriets Datavarehus. Tallene findes både i form af nøgletalsvisninger, rapporter på lands-, skole- og kommuneniveau samt via en Excel-adgang, hvor du frit kan sammensætte præcist de tal, du skal bruge. I Datavarehuset er det desuden muligt at tilgå en lang række andre data om blandt andet test, fravær og elevtal i grundskolen på både skole, kommune og landsniveau."
