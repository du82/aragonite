koleloven. Rammen for undervisningens indhold er formålsparagraffen, som nævnt øverst på denne side. Enkelte fag eller faggrupper kan på 10. årgang godt have en fremtrædende plads, men aldrig på bekostning af det almene. Kurserne skal tilbydes med henblik på elevernes hele menneskelige udvikling og modning samt deres almene opdragelse og uddannelse. Der skal, som i 8., 9. og 10. klasse, ugentligt undervises mindst 21 timer eksklusiv pauser. Der kan ikke aflægges nogen af folkeskolens prøver i forlængelse af 10. årgang. Læs styrelsens opsamling på tilsyn med 10. årgang (uvm.dk) Hvis et efterskoleophold er anbefalet i en udtalelse fra Pædagogisk Psykologisk Rådgivning (PPR) eller UU-vejledningen i elevens tidligere skolekommune, så kan en elev over 18 år optages. Læs mere Efterskoleforeningen (efterskolerne.dk) Internationale uddannelsesprogrammer i grundskolen'
