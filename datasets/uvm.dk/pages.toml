["https://www.uvm.dk/folkeskolen/folkeskolens-proever/bedoemmelse-og-censur/klager-over-proever"]
title = "Klager over prøver | Børne– og Undervisningsministeriet"
description = "Skolens leder træffer afgørelse om afvisning eller behandling af klagesager."
full_description = "Eleven eller den, der har forældremyndigheden, kan klage skriftligt eller mundtligt til skolens leder over forhold ved folkeskolens prøver. Klagen kan vedrøre prøveforløbet, herunder eksaminators og censors bedømmelse af prøven. Hvis klagen indgives mundtligt, skal skolens leder notere klagens indhold skriftligt og afklare eventuelle uklarheder i klagens indhold. Det anbefales at klagen indgives skriftligt, da det mindsker risikoen for misforståelser i klageprocessen. Fristen for at klage er senest to uger efter, at bedømmelsen eller afgørelsen er meddelt eleven. I beregningen af fristen indgår juli måned ikke. Klager over skriftlige og mundtlige prøver Klager over skriftlige prøver sendes til udtalelse hos den statsligt beskikkede censor, der har bedømt prøvebesvarelsen. Klager over mundtlige prøver sendes til udtalelse hos den eksaminator og den censor, som har bedømt elevens præstation ved prøven. Illustration af proces for klager: Klageproceduren (se illustration) Fold alle ud/ind Klagen afvises eller godtages Skolens leder vurderer, om klagen skal afvises som åbenbart grundløs, eller om der kan være hold i klagen og den dermed godtages. Klagen afvises Hvis skolelederen afviser klagen som åbenbart grundløs, skal afslaget begrundes. Klageren har ret til at få et skriftligt afslag fra skolens leder. Klagen godtages Hvis skolens leder godtager klagen, sendes den straks til bedømmeren ved den skriftlige eller mundtlige prøve. Bedømmerens udtalelse skal være så beskrivende, at skolens leder er i stand til at træffe afgørelse om, hvorvidt klageren skal have medhold, eller om klagen skal afvises. Hvis klagen vedrører karakterfastsættelsen, skal bedømmeren alene angive, hvad der ligger til grund for den karakter, der er givet. Der skal ikke foretages en ny vurdering af elevens prøvebesvarelse eller præstation. Hvis der i forbindelse med klagen opdages en fejl i karakterfastsættelsen, gøres skolelederen opmærksom på dette, hvorefter fejlen kan rettes. Skolens leder skal oplyse bedømmerne om, at deres udtalelse i forbindelse med klagen er omfattet af forvaltningslovens regler om aktindsigt. Frist for bedømmernes udtalelse Bedømmerne skal som udgangspunkt afgive deres udtalelse indenfor en frist på 14 dage. Skolens leder kan bestemme, at bedømmerne kan få en længere frist. I beregningen af fristen indgår juli måned ikke. Hvis bedømmerne først afgiver udtalelser efter sommerferien, bør skolelederen informere klageren om, hvornår en afgørelse kan forventes. Bedømmerens/bedømmernes udtalelse til høring hos klageren Skolelederen sender bedømmeres udtalelser til høring hos klageren, som kan give bemærkninger til udtalelsen inden for en frist på normalt 1 uge. Klageren kan i den forbindelse trække klagen tilbage eller fastholde klagen. Afgørelse: Klagen får ikke medhold Hvis skolens leder ud fra klagens indhold og udtalelserne fra bedømmeren/bedømmerne vurderer, at den oprindeligt fastsatte karakter afspejler elevens præstation, meddeler skolens leder eleven, at der ikke gives medhold i klagen. Afgørelsen skal være begrundet. Klageren har ret til et skriftligt afslag fra skolelederen. Afgørelse: Berettiget tvivl om bedømmelsen Hvis skolelederen afgør, at der, på baggrund af at klagens indhold, udtalelserne fra bedømmeren/bedømmerne og klagerens eventuelle bemærkninger til bedømmernes udtalelser, er tale om berettiget tvivl om bedømmelsen, kan skolelederen træffe afgørelse om ombedømmelse eller omprøve. En anledning til berettiget tvivl om bedømmelsen kan for eksempel være væsentlige proceduremæssige mangler i form af manglende forberedelsestid. Ombedømmelse og omprøve som følge af en klage kan resultere i en lavere karakter. Nedenfor er listet forskellige eksempler, hvor skolelederen kan give klageren medhold på grund af berettiget tvivl. Eksempler på berettiget tvivl ved skriftlige prøver Skolelederen modtager en klage over karakteren ved en skriftlig prøve. Eleven påpeger en række kvaliteter ved opgavebesvarelsen, der sammenholdt med bedømmerens udtalelser giver grundlag for berettiget tvivl om, hvorvidt der er foretaget en korrekt vurdering. Bedømmerens udtalelse, prøvekarakter, og vurderingskriterierne i faget stemmer ikke overens. Bedømmeren har i sin udtalelse ikke forholdt sig konkret til vurderingskriterierne og dermed i hvilken grad eleven har besvaret prøven i forhold til opgaveformuleringen. Eksempler på berettiget tvivl ved mundtlige prøver De to bedømmeres udtalelser til en klage er givet ud fra forskellige fortolkninger af vurderingskriterierne i faget, da de to bedømmere har forskellige opfattelser af, i hvor høj grad eleven har løst den stillede opgave i forhold til opgaveformuleringen. Det fremgår af klagen, at der ved prøven har været mangler i forhold til proceduren. For eksempel at eleven ikke har haft den forberedelsestid, der gælder for prøven. Berettiget tvivl med tilbud ombedømmelse Hvis bedømmerne i deres udtalelser giver udtryk for, at den/de er enige i, at der er tale om en fejl i karaktergivningen, kan skolens leder afgøre, at eleven får den nye karakter. Hvis bedømmere ikke er enige i, at klageren skal have medhold, kan skolens leder alligevel afgøre, at eleven tilbydes at få sin prøve ombedømt. Skolelederens afgørelse skal udelukkende være baseret på klagens indhold sammenholdt med bedømmeres udtalelser. Skolelederen må ikke lade tidligere opnåede resultater, for eksempel standpunktskarakterer, indgå som et element i afgørelsen, herunder at elevens resultat ved prøven ikke afspejler det sædvanlige niveau i faget. Berettiget tvivl med tilbud om omprøve Omprøve betyder, at eleven får tilbudt at tage ny prøve, og at den gamle annulleres. Omprøve kan ske i førstkommende prøvetermin ved skriftlige prøver eller i samme prøvetermin ved mundtlige prøver, hvis det praktisk kan lade sig gøre. Mundtlige prøver Hvis eleven tager imod tilbud om at få sin mundtlige prøve ombedømt, er faglæreren eksaminator. Skolens leder udpeger en ny censor. Hvis skolen ved prøven var tildelt en statsligt beskikket censor, skal skolelederen kontakte Kontor for Prøver, Eksamen og Test. Prøvekontoret udpeger derefter en ny statsligt beskikket censor. Skriftlige prøver Hvis eleven tager imod tilbud om at få sin skriftlige besvarelse ombedømt af en ny bedømmer, skal skolelederen kontakte Kontor for Prøver, Eksamen og Test. Prøvekontoret udpeger derefter en ny statsligt beskikket censor. Karaktergivning ved ombedømmelse og omprøve Ombedømmelse og omprøve, som udspringer af klagesager, kan betyde, at eleven får en lavere karakter end den karakter, der blev klaget over. Det er den nye karakter ved ombedømmelsen eller omprøven, som er den gældende. Når bedømmere har foretaget en ombedømmelse eller en omprøve indberetter de den nye karakter til skolens leder. Bevis Skolens leder eller Kontor for Prøver, Eksamen og Test kan beslutte, at et bevis tilbageholdes, indtil en ombedømmelse eller omprøve er foretaget. Skolelederens afgørelse er den endelige Der kan ikke klages over skolelederens afgørelse eller afgørelser i en konkret klagesag. Regelgrundlag Regelgrundlaget fremgår af prøvebekendtgørelsen, kap.10 og forvaltningsloven. Læs mere Bekendtgørelse om folkeskolens prøver (retsinformation.dk) Bekendtgørelse af forvaltningsloven (retsinformation.dk)"
year_published = 2025
