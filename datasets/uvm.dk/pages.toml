["https://www.uvm.dk/global/news/uvm/2021/jun/210622-eftersyn-af-almen-voksenuddannelse-og-hf-enkeltfag-peger-paa-udfordringer"]
title = "Eftersyn af almen voksenuddannelse og hf-enkeltfag peger på udfordringer | Børne– og Undervisningsministeriet"
full_description = "Hvordan er det gået på almen voksenuddannelse (avu) og hf-enkeltfag, siden VUC-sektorens overgang til statsligt selveje i 2007, og hvilke udfordringer står de to uddannelsestilbud over for i dag? Det har været omdrejningspunktet for et eftersyn, som Børne- og Undervisningsministeriet har gennemført af netop avu og hf-enkeltfag i perioden marts 2019 til april 2021. Eftersynet viser blandt andet, at der de seneste 10 år har været en markant stigning i andelen, der bruger enkeltfagstilbuddene som fuldtidsuddannelse og dermed modtager SU. Eftersynet viser også, at mellem 15 og 30 procent af fuldtidskursisterne har taget fag og modtaget SU i mere end de 2 år, som ellers er normen ifølge SU-reglerne, og at mellem 16 og 20 pcrocent af den samlede kursistgruppe ikke består eller ikke går op til prøve, selvom kurset er fuldført. Derudover viser tal, at fraværet i skoleåret 2018/2019 i gennemsnit lå på 20 procent på avu og 23 procent på hf-enkeltfag. Alt i alt tyder eftersynet på, at der er behov for at se på, hvordan rammerne for kursisternes progression og udbytte af undervisningen kan styrkes, så alle kursister får mest mulig ud af deres forløb på VUC. I forbindelse med implementeringen af Aftale om bedre veje til uddannelse af job blev det i november 2019 aftalt, at der med udgangspunkt i eftersynet af avu og hf-enkeltfag skal fastsættes en øvre grænse for, hvor mange år en kursist kan tage forløb på avu og hf-enkeltfag på fuld tid, og at provenuet herfra skal anvendes til at understøtte studie- og læringsmiljøer for voksne og VUC-sektoren generelt. Ordførerne i FGU-aftalekredsen vil blive indkaldt til drøftelser herom i efteråret 2021. Læs mere Læs hele eftersynet (pdf)"
year_published = 2025
clearnet = "https://www.uvm.dk/global/news/uvm/2021/jun/210622-eftersyn-af-almen-voksenuddannelse-og-hf-enkeltfag-peger-paa-udfordringer"
