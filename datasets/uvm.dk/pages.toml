["https://www.uvm.dk/almen-voksenuddannelse-avu/om-almen-voksenuddannelse"]
title = "Om avu | Børne– og Undervisningsministeriet"
description = "Uddannelsens formål, målgruppe og indhold."
full_description = "AVU giver mulighed for at dygtiggøre sig i et eller flere fag på grundskoleniveau og er rettet mod voksne på 25 år og derover. Læs mere om adgangskrav og tilmelding. Formål Uddannelsen har til formål at styrke voksnes muligheder for videre uddannelse og forudsætninger for aktiv medvirken i et demokratisk samfund. Enkeltfag på forskellige niveauer Undervisningen er tilrettelagt som enkeltfagsundervisning, og det er muligt at tage et eller flere fag ad gangen. Fagene inden for almen voksenuddannelse (avu) dækker både fag på basisniveau, som niveaumæssigt ligger under grundskolens 9. klasse, og fag på niveauerne G, F, E og D. Niveau G svarer til 9. klasse og niveau E til 10. klasse. Det højeste niveau D giver god faglig sammenhæng til hf-uddannelsen. Læs mere Adgangskrav og tilmelding Undervisning og fag Love og regler"
