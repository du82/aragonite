["https://www.uvm.dk/sitecore/content/global/news/uvm/2024/aug/240823-boerne-og-undervisningsministeren-starter-bogklub-med-fokus-paa-kvindelige-forfattere"]
title = "Børne- og undervisningsministeren starter bogklub med fokus på kvindelige forfattere | Børne– og Undervisningsministeriet"
full_description = "Der skal læses flere værker af kvindelige forfattere i landets gymnasier. Det mener børne- og undervisningsminister Mattias Tesfaye. Ministeren vil med indsatsen: ’Vi læser kvinder’ starte en bogklub, hvor han vil invitere gymnasieelever til at læse værker af kvindelige forfattere. Ministeren har derfor bedt ti litteraturinteresserede kendte danskere udvælge et værk af en kvindelig, dansk forfatter til bogklubben, som kan læses og diskuteres ude på gymnasierne. Ministeren vil derudover besøge et gymnasium til en fælles diskussion af et af værkerne og opfordrer samtidigt alle gymnasier landet over til at læse med på ’Læselystdagen’ den 25. november 2024. I dag er der 14 kanonforfattere, det er obligatorisk for gymnasieelever at stifte bekendtskab med, og heraf er kun én kvinde. Bogklubben skal derfor være med til at skabe fokus på dansk litteratur skrevet af kvinder forud for en opdatering af danskfagets litteraturkanon på de gymnasiale uddannelser. ”Når jeg kigger på den nuværende kanonliste, synes jeg, at det ser skævt ud. Den har eksisteret i snart 20 år, og det er svært at forklare, hvorfor kun en enkelt ud af mange fremragende kvindelige, danske forfattere har fået en plads. Men vi kan ikke ændre kanonen fra den ene dag til den anden. Det er et meget grundigt arbejde, som skal ske i samarbejde med de rette personer. Derfor håber jeg, at eleverne ude på gymnasierne har lyst til at læse med, og at vi sammen kan sætte litteratur på dagsordenen i gymnasierne fra dette skoleår – og særligt litteratur af kvinder ”, siger børne- og undervisningsminister Mattias Tesfaye. De medvirkende i bogklubben er: Musiker og rapper Benjamin Hav anbefaler Pow Pow Pow af Christina Hagen Historiker og forfatter Gry Jexen anbefaler Marble af Amalie Smith Forbrugerekspert Anne Glad anbefaler Grundtvig er død af Laura Ringo Sanger Asger Nordtorp Pedersen (Guldimund) anbefaler Tænk ikke på mig af Vilma Sandnes Johansson Tidligere statsminister Helle Thorning-Schmidt anbefaler Den erotiske hamster af Thit Jensen Litteraturkritiker og anmelder Nazila Kivi anbefaler Har døden taget noget fra dig så giv det tilbage af Naja Marie Aidt Filminstruktør Anna Emma Haudal anbefaler Animal af Alexandra Moltke Johansen Filminstruktør Jonas Risvig anbefaler Milo og Molly er ikke kærester af Tone Ottilie Forfatter Caspar Eric anbefaler Alfabet af Inger Christensen Radio- og podcastvært Line Kirsten Nikolajsen anbefaler Samlede digte af Tove Ditlevsen Børne- og undervisningsminister Mattias Tesfaye anbefaler Rødby-Puttgarden af Helle Helle Dansk litteraturs kanon for de gymnasiale uddannelser blev indført i gymnasiet i 2005 og har til formål at sikre, at alle gymnasieelever introduceres for 14 udvalgte forfattere, hvoraf 13 er mænd, og kun en er kvinde. Forfattere i den danske litteraturkanon Den gældende danske litteraturkanon indeholder følgende forfattere, der er kernestof på de gymnasiale uddannelser: Ludvig Holberg Steen St. Blicher Adam Oehlenschläger N.F.S. Grundtvig H.C. Andersen Herman Bang Henrik Pontoppidan Johannes V. Jensen Martin Andersen Nexø Tom Kristensen Karen Blixen Martin A. Hansen Peter Seeberg Klaus Rifbjerg Vi læser kvinder! Bogklubben ’Vi læser kvinder!’ sætter fokus på danske kvindelige forfattere. Som en del af indsatsen er der udarbejdet undervisningsmaterialer målrettet gymnasieeleverne om bogklubbens udvalgte forfatterskaber og værker. Find undervisningsmaterialerne på www.mitcfu.dk Find materialer der fremmer læselysten hos de unge på emu.dk. Indsatsen er et samarbejde mellem Børne- og Undervisningsministeriet og CFU – Center for Undervisningsmidler."
year_published = 2025
