["https://www.uvm.dk/dagtilbud/ministeriets-sprogvurderingsvaerktoejer"]
title = "Ministeriets sprogvurderingsværktøjer | Børne– og Undervisningsministeriet"
description = "Ministeriets har udviklet en r&aelig;kke forskningsbaserede sprogvurderingsv&aelig;rkt&oslash;jer, som it-leverand&oslash;rer kan it-underst&oslash;tte."
full_description = "Til at understøtte arbejdet i kommunerne med lovpligtige sprogvurderinger har ministeriet fået udviklet en række forskningsbaserede sprogvurderingsværktøjer. Ministeriets sprogvurderingsværktøjer skal it-understøttes for at kunne anvendes af kommunerne. Kommuner, der ønsker en it-understøttelse af værktøjerne, skal kontakte de it-leverandører, som tilbyder en it-understøttelse af disse. It-leverandører, som ønsker at it-understøtte ministeriets sprogvurderingsværktøjer, kan finde oplysninger af relevans for dette her, samt kontakte ministeriet med henblik på at få adgang til materialerne. It-leverandører skal være opmærksomme på, at ministeriet kan foretage løbende justeringer af materialerne knyttet til de forskellige værktøjer ud fra de erfaringer, som brugerne gør sig med anvendelse af disse. Desuden skal de være opmærksomme på en mulig efterspørgsel fra centralt hold på indberetning af data om sprog genereret på baggrund af de sprogvurderinger, som foretages i kommunerne. Endelig skal de være opmærksomme på, at persondatalovens regler for behandling af personoplysninger skal iagttages. Sprogvurdering 3-6 Sprogvurdering 3-6 er udviklet for ministeriet med henblik på at understøtte den lovpligtige sprogvurdering af børn i alderen omkring 3 år. Værktøjet kan også anvendes til sprogvurdering af børn i alderen omkring 4 og 5 år samt til den lovpligtige sprogvurdering af børn i 0. klasse. Til værktøjet knytter sig følgende materialer: Sprogvurderingsskemaer til vurdering af børns sprog på individ- og klasseniveau Materialer til brug for sprogvurderingen Forældreskema Vejledning til Sprogvurdering 3-6 Translatefiler Siden frigivelse af materialet til Sprogvurdering 3-6 i 2017 har ministeriet modtaget henvendelser fra brugere af materialet. På baggrund af disse er der i 2019 foretaget en mindre justering af materialet. Læs mere om Sprogvurdering 3-6 år på emu.dk, herunder den justering af materialet, der er foretaget i 2019. Sprogvurdering 2 år Sprogvurdering 2 år er udviklet for ministeriet med henblik på at understøtte den lovpligtige sprogvurdering af børn i alderen omkring 2 år. Værktøjet er udviklet på en sådan måde, at resultater fra sprogvurderinger ved brug af dette kan sammenholdes med resultater fra sprogvurderinger ved brug af Sprogvurdering 3-6. Til værktøjet knytter sig følgende materialer: Registreringsskemaer til de fire delelementer i værktøjet Billedmateriale til delelementet ”receptiv ordforrådstest” Vejledning til materialet inkluderer beskrivelse af baggrundsinformation, forskningskortlægning, normeringsstudie, beskrivelse af udregning af percentilscore og nødvendige funktioner i et it-system Translatefiler For at sikre en korrekt oversættelse af materialerne til en it-understøttelse stiller ministeriet krav om, at it-leverandører i udviklingen af it-understøttelsen skal gør brug af konsulentbistand fra TrygFondens Børneforskningscenter ved Aarhus Universitet med henblik på at afprøve og teste it-understøttelsen. Ministeriet dækker udgiften til konsulentbistand i op til 15 timer frem til udgangen af 2020. Efter 2020 må it-leverandører selv afholde omkostninger til brug af konsulentbistand fra TrygFondens Børneforskningscenter. Ministeriet og TrygFondens Børneforskningscenter påtager sig ikke ved denne ordning noget ansvar i forhold til it-leverandører eller it-leverandørers endelige produkt. Læs mere om Sprogvurdering 2 år på emu.dk. Ny it-understøttelse i regi af ministeriet Børne- og Undervisningsministeriet har udviklet en ny it-løsning til ministeriets egne sprogvurderingsværktøjer Sprogvurdering 2 år og Sprogvurdering 3-6. It-løsningen afløser FKO Sprogvurdering, som blev lukket ultimo 2019. Ligesom FKO Sprogvurdering stilles den nye it-løsning gratis til rådighed for kommuner og dagtilbud, som ønsker at anvende ministeriets sprogvurderingsværktøjer. Ministeriets sprogvurderingsværktøjer vil fortsat kunne tilgås via it-løsninger udviklet af private it-leverandører. Se nedenfor for yderligere oplysninger om ministeriets it-løsning. Læs mere Læs mere om reglerne vedrørende sprogvurdering og sprogstimulering Læs mere om ministeriets sprogvurderingsværktøjer på emu.dk/dagtilbud Læs mere om ministeriets it-løsning til Sprogvurdering 3-6 og Sprogvurdering 2 år (emu.dk)"
year_published = 2025
clearnet = "https://www.uvm.dk/dagtilbud/ministeriets-sprogvurderingsvaerktoejer"
