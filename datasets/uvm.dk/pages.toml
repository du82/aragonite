["https://www.uvm.dk/dagtilbud/om-dagtilbud/daginstitutioner"]
title = "Daginstitutioner | Børne– og Undervisningsministeriet"
description = "<span>Daginstitutioner kan etableres og drives i forskellige former. Efter aftale med kommunen kan daginstitutioner etableres og drives af andre end kommunen.</span>"
full_description = "Kommunale institutioner Kommunale daginstitutioner er kommunalt ejede institutioner såsom vuggestuer, børnehaver og aldersintegrerede daginstitutioner. Daginstitutionerne er målrettet børn i alderen 0 år og indtil skolestart. Forældretaksten for en plads i daginstitutionen må maksimalt udgøre 25 procent af de budgetterede udgifter til pladsen. Selvejende daginstitutioner Selvejende daginstitutioner er institutioner, der drives af private leverandører på baggrund af en indgået driftsaftale med kommunalbestyrelsen. De selvejende daginstitutioner er underlagt et kommunalt tilsyn og modtager tilskud fra kommunen til dækning af institutionens udgifter. Selvejende daginstitutioner er en del af den kommunale forsyning, og kommunen anviser som udgangspunkt pladser i daginstitutionen. Forældretaksten for en plads i daginstitutionen må maksimalt udgøre 25 procent af de budgetterede udgifter til pladsen. Udliciterede daginstitutioner Udliciterede daginstitutioner etableres af private leverandører på baggrund af et kommunalt udbud og drives på baggrund af en driftsaftale med kommunalbestyrelsen. Udliciterede daginstitutioner er underlagt et kommunalt tilsyn og modtager tilskud fra kommunen til dækning af institutionens udgifter. Udliciterede daginstitutioner er en del af den kommunale forsyning, og kommunen anviser som udgangspunkt pladser i daginstitutionen. Forældretaksten for en plads i institutionen må maksimalt udgøre 25 procent af de budgetterede udgifter til pladsen. Privatinstitutioner Privatinstitutioner er daginstitutioner, der drives af private leverandører på baggrund af en godkendelse fra kommunalbestyrelsen. Kommunen kan ikke anvise plads i en privatinstitution. Kommunen yder et tilskud pr. barn, der er optaget i privatinstitutionen. Privatinstitutionen fastsætter selv forældrenes egenbetaling. Privatinstitutioner er underlagt et kommunalt tilsyn. Puljeordninger Puljeordninger kan drives som enten en dagplejelignende eller institutionslignende ordning. Puljeordninger etableres af en privat leverandør, typisk forældre eller en virksomhed, og drives på baggrund af en driftsaftale med kommunalbestyrelsen. Efter den 1. august 2007 kan der ikke indgås aftale om etablering og drift af puljeordninger. Kommunen kan ikke anvise plads i en puljeordning. Kommunen yder et tilskud pr. barn i ordningen. Forældretaksten for en plads i ordningen må maksimalt udgøre 25 procent af udgifterne ved driften af den enkelte puljeordning. Puljeordninger er underlagt et kommunalt tilsyn. Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven)"
