full_description = "Prøvefri efterskoler Eleverne på en skole, der giver undervisning på 8. og 9. klassetrin, skal aflægge folkeskolens afgangseksamen, prøve på 8. klassetrin og 9.-klasseprøver med mindre skolen har valgt at være prøvefri. Desuden kan elever i 10. klasse på en efterskole vælge at indstille sig til folkeskolens prøver. Hvis en efterskole ikke ønsker at tilbyde sine elever folkeskolens prøver, skal skolen senest den 15. juni meddele Styrelsen for Undervisning og Kvalitet, at skolen ikke afholder folkeskolens prøver fra og med det følgende skoleår. Skolen skal også skrive på sin hjemmeside, at den er prøvefri, og den skal orientere forældrene om det. Hvis skolen er prøvefri kan eleverne aflægge folkeskolens prøver som privatister Læs om adgang og optagelse på en gymnasial uddannelse Skoler, der ikke afholder prøve i faget historie En efterskole kan vælge på grundlag af sit værdigrundlag ikke at afholde prøve i historie. Eleverne skal aflægge prøve i et andet fag, der udtrækkes inden for den humanistiske fagblok. Skolen skal senest den 15. juni meddele Styrelsen for Undervisning og Kvalitet, at skolen på ikke afholder prøve i faget historie fra og med det følgende skoleår. Skolen skal desuden skrive på sin hjemmeside, hvis den ikke afholder prøve i faget historie. Skoler, der tidligere har meddelt, at den ikke afholder prøve i faget historie, skal senest den 15. juni meddele Styrelsen for Undervisning og Kvalitet, hvis skolen fra og med det følgende skoleår vil påbegynde at afholde prøve i historie. Skoler, der ikke underviser og afholder prøve i faget kristendomskundskab En efterskole kan vælge på grundlag af sit værdigrundlag ikke at give undervisning og afholde prøve i kristendomskundskab. Eleverne skal aflægge prøve i et andet fag, der udtrækkes inden for den humanistiske fagblok. En efterskole skal senest den 15. juni meddele Styrelsen for Undervisning og Kvalitet, hvis skolen på grund af sit værdigrundlag ikke giver undervisning og afholder prøve i faget kristendomskundskab fra og med det følgende skoleår. Eleverne skal aflægge prøve i et andet fag, der udtrækkes inden for den humanistiske fagblok. Skolen skal desuden skrive på sin hjemmeside, hvis den ikke giver undervisning og afholder prøve i faget kristendomskundskab. Skoler, der tidligere har meddelt, at den ikke giver undervisning og afholder prøve i faget kristendomskundskab, skal senest den 15. juni meddele Styrelsen for Undervisning og Kvalitet, hvis skolen fra og med det følgende skoleår vil påbegynde at give undervisning og afholde prøve i kristendomskundskab. Læs mere Skoler med samlet særligt undervisningstilbud Skoler, der er godkendt med samlet særligt undervisningstilbud, har mulighed for at tilbyde elever alene at gå til de bundne prøver i dansk og de bundne prøver i matematik i 9. klasse. Muligheden gælder både prøveafholdende og prøvefri skoler. Lovforslag L 95 (folketingstidende.dk) 10. klassetrin på efterskole En skole skal, for de elever, der går i 10. klasse, tilbyde prøver i de obligatoriske fag. En skole kan ikke tilbyde nogen af folkeskolens prøver til elever på 10. årgang. Læs mere Overgang til ungdomsuddannelse Folkeskolens prøver"
