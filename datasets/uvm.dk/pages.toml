["https://www.uvm.dk/dagtilbud/plads-i-dagtilbud/tilskud-og-egenbetaling/oekonomisk-fripladstilskud"]
title = "Økonomisk fripladstilskud | Børne– og Undervisningsministeriet"
full_description = "Spørgsmål til økonomisk fripladstilskud Har du spørgsmål om økonomisk fripladstilskud, skal du henvende dig til din kommune (borger.dk) Størrelsen af det økonomiske fripladstilskud er afhængig af forældrenes indtægt. Ministeriet offentliggør hvert år en fripladsskala, som fastlægger indtægtsgrænserne for økonomisk fripladstilskud. Se fripladsskalaen nedenunder. Man skal søge om økonomisk fripladstilskud hos kommunen for at være berettiget til tilskuddet. I det følgende beskrives: Indtægtsgrundlag Opgørelse af husstandsindkomst ved ansøgning Månedlig genberegning Omberegning Årlig efterregulering Fripladsskala Fripladsskala 2025 (pdf) Fripladsskala 2024 (pdf) Fripladsskala 2023 (pdf) Fripladsskala 2022 (pdf) Fripladsskala 2021 (pdf) Fripladsskala 2020 (pdf) Fripladsskala 2019 (pdf) Fripladsskala 2018 (pdf) Fripladsskala 2017 (pdf) Indtægtsgrundlag - Husstandsindkomst Det er husstandsindkomsten, der lægges til grund for kommunalbestyrelsens afgørelse om økonomisk fripladstilskud. Husstandsindkomsten opgøres som: personlig indkomst efter § 3 i personskatteloven med tillæg af positiv nettokapitalindkomst, der anvendes til beregning af indkomstskat efter § 7 i personskatteloven, dog før det deri nævnte grundbeløb og bundfradrag, og aktieindkomst, der beskattes efter § 8 a, stk. 1 og 2, i personskatteloven, bortset fra udbytteindkomst op til kroner 5.000. Husstandsindkomsten for beregning af økonomisk fripladstilskud opgøres pr. måned. Den månedlige husstandsindkomst skal herefter omregnes til en årsindkomst, således at husstandsindkomsten kan aflæses af fripladsskalaen. Den enkelte måneds husstandsindkomst opgøres som summen af følgende to beløb: Månedens indkomst i indkomstregisteret: Summen af husstandsmedlemmernes indkomster, som de indberetningspligtige har indberettet til indkomstregisteret for den pågældende måned. En tolvtedel af øvrige indkomster: En tolvtedel af summen af de husstandsmedlemmernes indkomster i kalenderåret, der ikke fremgår af indkomstregisteret, uanset om indkomstoplysningerne er indberetningspligtige efter lov om et indkomstregister. Her kan der for eksempel være tale om aktieindkomst, positiv nettokapitalindkomst, indkomst fra selvstændig erhvervsvirksomhed eller indkomst, som ikke er skattepligtig her i landet. Reglen om, at indkomster, der alene er registreret som helårsbeløb, fordeles ligeligt over kalenderårets måneder, kan fraviges, hvis det dokumenteres, at indkomsten vedrører en afgrænset periode. I de tilfælde, hvor der i husstandsindkomsten indgår indkomst, som fremgår af indkomstregisteret, men udbetales for flere måneder ad gangen, og indkomsten derfor ikke er periodiseret på månedsbasis i indkomstregisteret, kan kommunen fordele indkomsten på enkelte måneder. Feriepenge, engangsbeløb, m.v. vil skulle indgå i beregningsgrundlaget for den eller de måneder, hvor de fremgår af indkomstregisteret. Faktisk indtægt Det gælder særligt for personer med indkomst fra selvstændig erhvervsvirksomhed, at hvis den faktiske indtægt pr. måned grundet specielle skattetekniske fradrag væsentligt overstiger husstandsindkomsten pr. måned, så skal kommunalbestyrelsen træffe afgørelse om økonomisk fripladstilskud på baggrund af en samlet vurdering af familiens økonomiske forhold. Som specielle skattetekniske fradrag anses blandt andet henlæggelser til investeringsfonde, bygnings- og inventarnedskrivning ud over normal nedskrivning samt underskud på skibsvirksomhed og containeranparter. Beregningsgrundlaget er husstandens samlede indtægt Bor barnet sammen med begge forældre, er det den samlede husstandsindkomst hos forældrene, der skal lægges til grund for vurderingen af, om der kan gives økonomisk fripladstilskud. Bor barnet kun sammen med den ene af forældrene, men er denne gift eller lever i et samlivslignende forhold med en anden person, sker der også en sammenlægning af indtægterne i husstanden. Bor et barn, hvis forældre ikke lever sammen, lige meget hos hver af sine forældre, er det husstandsindkomsten hos den af forældrene, hvor barnet er tilmeldt folkeregistret, der tæller, uanset om forældrene har fælles forældremyndighed. Barnets egne indtægter er uden indflydelse på vurderingen af, om der kan gives økonomisk fripladstilskud. Flere børn i hjemmet Er der hos forældrene eller den forælder, der har retten til dagtilbudspladsen og til fripladstilskuddet, mere end et barn under 18 år i hjemmet, forhøjes fripladsskalaens indtægtsgrænser med 7.000 kroner for hvert barn ud over det første barn. Enlig forsørger En enlig forsørger kan søge om økonomisk fripladstilskud hos kommunen, og ved dokumentation af status som reelt enlig skal kommunen forhøje den enlige forsørgers fripladsgrænser med 72.822 kroner (2025-niveau). Opgørelse af husstandsindkomst ved ansøgning Husstandsindkomsten pr. måned opgøres foreløbigt ved ansøgning på baggrund af borgerens egne oplysninger. Der kræves som udgangspunkt ikke dokumentation for oplysning om de indkomsttyper, som fremgår af indkomstregisteret. For øvrige indkomster kan dokumentation for indkomst udgøres af eksempelvis forskudsopgørelsen, årsopgørelsen eller anden form for dokumentation – for eksempel regnskaber fra virksomheder m.v. På baggrund af ansøgerens oplysninger foretager kommunen en foreløbig opgørelse af månedens husstandsindkomst, som anvendes til at beregne det økonomiske fripladstilskud måned for måned, indtil der sker en eventuel omberegning af tilskuddet. Månedlig genberegning Kommunen indhenter oplysninger om den del af den enkelte måneds husstandsindkomst, som indberettes til indkomstregisteret. Kommunen foretager i den forbindelse en sammenligning af den del af den foreløbigt opgjorte indkomst, som vedrører indkomster i indkomstregisteret, med de faktiske registrerede indkomstoplysninger i registeret. Kommunen foretager en genberegning af den konkrete måneds foreløbige fripladstilskud, hvis indkomstsammenligningen viser en afvigelse på mindst 5 trin på fripladsskalaen. Kommunerne skal efter partshøring herefter hurtigst muligt trække for meget tildelt økonomisk fripladstilskud fra eller lægge for lidt tildelt økonomisk fripladstilskud til den førstkommende opkrævning af forældrebetaling for en plads i et dagtilbud. I de særlige tilfælde, hvor et eventuelt for lidt tildelt økonomisk fripladstilskud skal trækkes fra den førstkommende opkrævning af forældrebetaling, og dette overstiger forældrenes resterende del af betalingen, kan den resterende del af beløbet efterbetales til den eller de forældre, som har retten til tilskuddet. For forældre i privatinstitutioner vil et eventuelt for lidt eller for meget tildelt fripladstilskud skulle tilbagebetales af eller efterbetales direkte til den eller de forældre, der har retten til tilskuddet. Det samme gør sig gældende i de tilfælde, hvor et barn ikke længere er indskrevet i et dagtilbud, fritidshjem eller klubtilbud m.v. Hvis genberegningen medfører, at forældrene ikke har fået tildelt økonomisk fripladstilskud i tre sammenhængende måneder som følge af indkomstændringer, der ikke skyldes ændring af husstandssammensætning, skal forældrene søge om økonomisk fripladstilskud på ny. Hvis ansøgningen indgives inden udgangen af den måned, der følger efter den 3. måned, hvor fripladstilskuddet ikke er tildelt, skal fripladstilskuddet tildeles fra starten af denne måned. Omberegning Det er muligt for forældrene at få omberegnet det økonomiske fripladstilskud, når betingelserne er opfyldt, og borgeren for eksempel ikke ønsker at afvente, at indkomstændringerne fremgår af indkomstregisteret. Hvis månedens husstandsindkomst forventes at falde eller stige udover en udsvingsgrænse på et beløb svarende til fem trin på fripladsskalaen, vil kommunen skulle foretage en ny foreløbig opgørelse af månedens husstandsindkomst og tildele fripladstilskud på baggrund af denne. En indkomstændring, som ligger inden for udsvingsgrænsen, vil ikke medføre omberegning i løbet af året, men vil i stedet indgå ved den endelige opgørelse af de enkelte måneders husstandsindkomst i forbindelse med den årlige efterregulering. Kommunen kan ikke omberegne det økonomiske fripladstilskud alene på baggrund af oplysninger fra indkomstregisteret. Oplysningerne fra indkomstregisteret kan derfor som udgangspunkt kun anvendes bagudrettet i forbindelse med genberegningen eller efterreguleringen. Kommunen kan dog på baggrund af oplysninger fra indkomstregisteret anmode forældrene om yderligere oplysninger med henblik på at fastslå, om fripladstilskuddet skal omberegnes. Der skelnes i reglerne mellem situationer, hvor der sker henholdsvis en nedgang og en forhøjelse af husstandsindkomsten. Omberegning ved nedgang i husstandsindkomsten Hvis der i løbet af året sker en nedgang i husstandsindkomsten, som svarer til mindst fem trin på fripladsskalaen, vil fripladstilskuddet kunne omberegnes, når ændringen er indtrådt. Omberegningen kan dog tidligst ske med virkning fra begyndelsen af den måned, der følger efter ansøgerens meddelelse til kommunen. Det samme gør sig gældende, hvis der i løbet af året sker en forøgelse i antallet af børn i husstanden under 18 år, eller modtageren får status som enlig forsørger. Omberegning ved forhøjelse i husstandsindkomsten Hvis der i løbet af året sker en forhøjelse af husstandsindkomsten, som svarer til mindst fem trin på fripladsskalaen, skal det økonomiske fripladstilskud omberegnes med virkning fra begyndelsen af den måned, der følger nærmest efter ændringens indtræden. Det samme gør sig gældende, hvis der i løbet af året sker en mindskelse af antallet af børn i husstanden under 18 år, eller modtagen ikke længere har status som enlig forsørger. Forældrenes oplysningspligt Forældrene skal til brug for omberegning oplyse kommunen om alle forhold, som har betydning for størrelsen af det økonomiske fripladstilskud. Forældrene har dog ikke pligt til at oplyse om indkomstændringer, medmindre det er oplysninger om indkomst fra selvstændig virksomhed eller oplysninger om indkomster, som ikke er skattepligtige her i landet. Forældrene har fortsat oplysningspligt i forhold til alle andre oplysninger, herunder husstandssammensætning, civilstatus m.v., der kan medføre ændringer i det økonomiske fripladstilskud. Årlig efterregulering I den årlige efterregulering foretages en endelig opgørelse af de enkelte måneders husstandsindkomst, og på grundlag heraf foretages en endelig beregning af de enkelte måneders økonomiske fripladstilskud. Den endelige beregning af den enkelte måneds økonomiske fripladstilskud sammenholdes med det økonomiske fripladstilskud, der hidtil er blevet tildelt for samme måned. Det hidtil tildelte økonomiske fripladstilskud for en måned udgør summen af det foreløbige fripladstilskud for måneden og et eventuelt justeringsbeløb som følge af den efterfølgende genberegning af samme måneds fripladstilskud. Hvis efterreguleringen viser, at der er blevet tildelt enten for lidt eller for meget økonomisk fripladstilskud i de enkelte måneder i løbet af året, skal beløbet enten tilbagebetales af eller efterbetales til forældrene. Efterreguleringen kan gennemføres, når årsopgørelsen fra SKAT foreligger, og sker blandt andet på baggrund af årsopgørelsen og oplysninger fra indkomstregisteret. Afgørelse om efterregulering kan som udgangspunkt ikke genoptages som følge af, at afgørelse om årsopgørelsen fra SKAT genoptages. Afgørelse om efterregulering kan dog genoptages, hvis en genoptagelse af årsopgørelse medfører en ændring af den årlige husstandsindkomst på mindst 25.000 kroner. Hvis afgørelse om årsopgørelse påklages, kan endelig afgørelse om efterregulering ikke træffes, før klagesagen om årsopgørelsen er behandlet. Formålet med efterreguleringen er: At sikre en grundig verificering af de foreløbige tildelinger af økonomisk fripladstilskud på grundlag af den del af de enkelte måneders husstandsindkomst, som skal indberettes til indkomstregisteret. At samle op på ændringer i de enkelte måneders husstandsindkomst, som i løbet af året har ligget under udsvingsgrænsen for omberegning og genberegning. At foretage en endelig opgørelse af de indkomster, som ikke skal indberettes til indkomstregisteret, og som deles ligeligt på årets 12 måneder For mere information om økonomisk fripladstilskud skal du henvende dig til din kommune (borger.dk) Beregning af den årlige fripladsskala Fripladsskalaen blev oprindeligt offentliggjort og opdateret årligt som et bilag til bekendtgørelse om dagtilbud (dagtilbudsbekendtgørelsen). Fripladsskalaen er fra 2023 blevet og vil fremover blive offentliggjort i en særskilt bekendtgørelse, nemlig bekendtgørelse om indtægtsgrænser for økonomisk fripladstilskud i dag-, fritids- og klubtilbud (retsinformation.dk). Denne bekendtgørelse bliver fremadrettet udstedt årligt med de opdaterede indtægtsgrænser for det følgende finansår. Skemaet med de udspecificerede indtægtsgrænser vil ligeledes årligt blive offentliggjort på denne og andre relevante sider på uvm.dk. Indtægtsgrænserne i fripladsskalaen reguleres årligt og metoden bag Fripladsskalaens nedre og øvre indtægtsgrænse reguleres én gang årligt pr. 1. januar med 2,0 pct. Disse 2,0 pct. tillægges eller fratrækkes en tilpasningsprocent for det pågældende finansår. Dette gælder ligeledes for forhøjelsen af fripladsgrænserne for enlige forsørgere, som fremgår i dagtilbudsbekendtgørelsens § 27, stk. 1. Fripladsskalaens regulerede nedre og øvre fripladsgrænser afrundes til nærmeste beløb i kroner deleligt med 100. Den regulerede forhøjelse af fripladsgrænserne for enlige forsørgere afrundes til nærmeste beløb i kroner. Fripladsskalaen er inddelt i 95 indtægtsgrænser, der beregnes ved, at differencen mellem den nedre og øvre indtægtsgrænse i fripladsskalaen deles med 95. Resultatet afrundes til nærmeste beløb i kroner. Ved den første indtægtsstigning, som er regnet fra fripladsskalaens nedre indtægtsgrænse, fastsættes forældrenes betaling til 5 pct. af den tilskudsberettigede forældrebetaling, som er defineret i dagtilbudsbekendtgørelsens §§ 23-26. For hver efterfølgende indtægtsstigning, forhøjes forældrenes betaling med 1 pct. af den tilskudsberettigede forældrebetaling. Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven)"
