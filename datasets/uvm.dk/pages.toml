["https://www.uvm.dk/folkeskolen/folkeskolens-proever/proeveafholdelse/forsendelsesprocedurer"]
title = "Forsendelsesprocedurer | Børne– og Undervisningsministeriet"
description = "Procedurer for forsendelse af elevbesvarelser ved de skriftlige prøver afhænger af prøven."
full_description = "Elevbesvarelser ved de skriftlige prøver bedømmes af en statsligt beskikket censor. Læs mere om bedømmelse og censur ved de skriftlige prøver. Maj/juni 2024 Efter prøverne er afholdt sender skolens administration elevbesvarelser og karakterlister fysisk eller digitalt som sikker post/digital post til den statslig beskikkede censor. Det er vigtigt at bemærke, at elevbesvarelser og karakterlister, der kan henføres til en konkret elev via dennes Uni-login, er en fortrolig personhenførbar oplysning. Sikker forsendelse af elevbesvarelser og karakterlister fra den prøveafholdende skole til den beskikkede censor kan ske på følgende måder: Censor og skole kan indbyrdes aftale, at skolen via sikker mail sender besvarelserne og karakterlisterne til den statslig beskikkede censors private e-boks. Censor kan modtage elevbesvarelserne med fysisk post fx med GLS/UPS/PostNord/DAO. Hvis censor er ansat på en skole, kan skolen give censor adgang til en sikker postkasse via skolens mailleverandør. For censorer, der er registreret med eget firma/virksomhed, vil censor have et CVR-nummer, som kan bruges til at sende elevbesvarelserne sikkert. Du kan finde mere information i censorvejledningen for beskikkede censorer ved folkeskolens prøver (pdf) December/januar 2024-25 Hvis skolen ønsker at sende elevbesvarelserne fysisk, er det skolelederen, der afgør, om de beskikkede censorer skal modtage den originale besvarelse eller en kopi til bedømmelse. Det anbefales, at skolerne med fordel oversender eller gemme en kopi af elevernes besvarelser for at minimere risikoen for, at materiale bortkommer under forsendelsen. Procedurerne med tidsplan er opdelt i to oversigter: Der er to forskellige forsendelsesprocedurer; én når originalbesvarelsen sendes til bedømmelse, og én når det er en kopi af besvarelsen, der sendes til bedømmelse. Original besvarelse sendes til censor Kopi af besvarelse sendes til censor Umiddelbart efter prøvens afholdelse sender skolens administration de originale elevbesvarelser og karakterlister, som sikker post, til den statsligt beskikkede censor. Umiddelbart efter prøvens afholdelse sender skolens administration kopier af elevbesvarelser og karakterlister, som sikker post, til den statsligt beskikkede censor. Hvis skolen sender en kopi af elevbesvarelsen til censor af elevbesvarelser skrevet i hånden, kopieres de, så læsbarheden ikke forringes. Elevbesvarelser, der er skrevet på computer, printes i to eksemplarer. Begge eksemplarer underskrives af den tilsynsførende. Censor retter i perioden frem til: 10. januar 2025 Censor retter i perioden frem til: 14. juni 2024 Censor sender senest: 10. januar 2025 De originale elevbesvarelser og karakterlister retur til skolen som sikker post. Censor sender senest: 14. juni 2024 Skolen og censor aftaler, om kopierne af elevbesvarelserne skal destrueres eller sendes retur til skolen som sikker post. Karakterlister sendes retur til skolen som sikker post eller sikker mail. Spørgsmål og svar - forsendelsesprocedurer Opdateret 20/07 2017 kl. 11:36 Skal skolen sende den originale elevbesvarelse til censor? Skolelederen afgør, om de beskikkede censorer skal have den originale elevbesvarelse eller en kopi. Hvis skolen sender en kopi af elevbesvarelsen til censor, og elevbesvarelser er skrevet i hånden, skal den kopieres, så læsbarheden ikke forringes. Elevbesvarelser, der er skrevet på computer, printes i to eksemplarer. Begge eksemplarer underskrives af eleven, og attesteres af den tilsynsførende, før de sendes. Opdateret 17/02 2017 kl. 13:24 Hvad er sikker post? Sikker post er forsendelser, som har en form for track- and tracenummer, så pakken/brevet kan spores. Sikker post er derfor ikke et almindeligt brev."
year_published = 2025
clearnet = "https://www.uvm.dk/folkeskolen/folkeskolens-proever/proeveafholdelse/forsendelsesprocedurer"
