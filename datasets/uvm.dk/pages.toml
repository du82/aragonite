full_description = "I dagtilbudsloven finder du dagtilbudsområdets formål, regler for optagelse, tilskud og forældrebetaling i dagtilbud – og meget mere. Andre love har også virkning på dagtilbudsområdet, ligesom dagtilbud, som andre offentlige institutioner, er underlagt for eksempel forvaltningsloven og databeskyttelsesloven. Dagtilbudsloven Dagtilbudsloven (retsinformation.dk) Bekendtgørelser Bekendtgørelser indeholder mere detaljerede regler, der udmønter særlige bestemmelser i loven. En bekendtgørelse har altid hjemmel i en lov og henviser derfor altid til loven. På retsinformation.dk vil der for hver lov være et link i venstre side, hvor du kan finde bekendtgørelser, cirkulærer med videre til den pågældende lov eller lovbekendtgørelse. De centrale love og regler på området finder du nedenfor. Bekendtgørelser Bekendtgørelse om opkrævning og regulering af forældrebetaling for en plads i dag-, fritids- og klubtilbud m.v. til børn og unge Nr. 99 af 27/01/2014 (retsinformation.dk) Bekendtgørelse om pædagogiske mål og indhold i seks læreplanstemaer (retsinformation.dk) Bekendtgørelse om dataindberetninger på dagtilbudsområdet (retsinformation.dk)"
