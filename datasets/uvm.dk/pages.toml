["https://www.uvm.dk/erhvervsuddannelser/oplaering/uddannelsesaftaler/om-uddannelsesaftalerne"]
title = "Om uddannelsesaftalerne | Børne– og Undervisningsministeriet"
description = "Du skal lave en uddannelsesaftale med en virksomhed for at komme i praktik. Hvis du ikke kan få en uddannelsesaftale med en virksomhed, kan du komme i skolepraktik."
full_description = "Varighed afhænger af aftale Uddannelsesaftalen indgås mellem dig og en godkendt oplæringsvirksomhed, og aftalen omfatter både skole- og oplæringsperioder på din uddannelse. Uddannelsesaftalen kan omfatte både grundforløb og hovedforløb afhængig af aftale mellem dig og virksomheden. Skolen, hvor du skal følge din uddannelse, kan hjælpe med at tilrettelægge dit uddannelsesforløb ift. skoleperioder og oplæringsperioder og med at fastlægge uddannelsestiden. I publikationen 'Uddannelsesaftaler for erhvervsuddannelser' kan du finde et overblik over de forskellige aftaletyper, der kan indgås mellem en elev og en virksomhed. Her kan du finde Digitale uddannelsesaftaler (lærepladsen.dk) Her kan du finde blanketterne til uddannelsesaftaler Prøvetid/ophævelse af uddannelsesaftale De første tre måneder er prøvetid, hvor aftalen kan ophæves af dig eller din arbejdsgiver uden begrundelse og uden varsel. Herefter er aftalen som udgangspunkt uopsigelig for begge parter. Dog kan aftalen opsiges, hvis du og virksomheden er enige herom – eller aftalen kan ophæves, hvis du eller virksomheden væsentligt misligholder de forpligtelser, der følger af aftalen. Hvis aftalen ændres, ophæves/mistes Hvis der sker ændringer i den indgåede uddannelsesaftale, skal du og virksomheden i samarbejde udfylde og underskrive et tillæg til uddannelsesaftalen senest på dagen, hvor ændringen træder i kraft. Ophæves din uddannelsesaftale af virksomheden eller mister du uddannelsesaftalen på anden vis, for eksempel fordi virksomheden ophører eller går konkurs, skal du indgå en restuddannelsesaftale med en ny virksomhed. Kan du ikke finde en ny virksomhed at indgå en restaftale med, kan du muligvis komme i skoleoplæring. Optagelse til skoleoplæring forudsætter, at din uddannelse udbydes med oplæring, at skolen vurderer, at du har mistet din aftale uforskyldt og at du opfylder EMMA-kriterierne. Læs mere Publikation: Uddannelsesaftaler for erhvervsuddannelser Love og regler for erhvervsuddannelserne Lærepladsen.dk Spørgsmål og svar om uddannelsesaftalerne Fold alle ud/ind Opdateret 19/09 2022 kl. 09:32 Hvor sendes uddannelsesaftalen hen, når elev og virksomhed har underskrevet aftalen? Uddannelsesaftalen sendes til den skole, hvor eleven er optaget på uddannelsen. Skolen registrerer herefter aftalen. Opdateret 19/09 2022 kl. 09:31 Hvem kan hjælpe med at udfylde uddannelsesaftalen? Skolen kan hjælpe med at udfylde uddannelsesaftalen og med at tilrettelægge selve uddannelsesforløbet. Opdateret 19/09 2022 kl. 09:31 Hvilken overenskomst er gældende for min branche? Den gældende overenskomst kan oplyses af enten skolen eller det faglige udvalg for den ønskede uddannelse. Fagforeninger kan også være behjælpelige. Opdateret 19/09 2022 kl. 09:30 Hvor mange gange skal den gældende overenskomst fremgå af uddannelsesaftalens punkt 7 for at opfylde oplysningspligten i forhold til ansættelsesbevisloven? Der skal anføres gældende overenskomst to gange for at opfylde arbejdsgivers oplysningspligt om hhv. løn og øvrige ansættelsesvilkår, jf. ansættelsesbevisloven § 2. Dog kan arbejdsgiver opfylde oplysningspligten på anden vis, for eksempel ved udførlig opremsning af ansættelsesvilkårene. Opdateret 20/09 2022 kl. 13:58 Der er fejl i den digitale blanket til uddannelsesaftaler – hvem kan hjælpe? Har du brug for hjælp til oprettelse af uddannelsesaftale så kontakt erhvervsskolen. Alternativt kan du kontakte supporten for Lærepladsen.dk via supportsag på jira.stil.dk eller telefonisk på tlf. 70 21 21 57. Opdateret 20/09 2022 kl. 13:58 Der er fejl i pdf-blanketten til uddannelsesaftaler – hvem kan hjælpe? Har du brug for hjælp til oprettelse af uddannelsesaftale så kontakt erhvervsskolen. Alternativt kan du kontakte supporten for Lærepladsen.dk via supportsag på jura.stil.dk eller telefonisk på tlf. 70 21 21 57. Opdateret 19/09 2022 kl. 09:27 Skal man bruge den digitale blanket på Lærepladsen.dk eller pdf blanketten på hjemmesiden – eller må man bruge sin egen digitale blanket/pdf blanket? Man må gerne anvende sin egen digitale/pdf-blanket til indgåelse af uddannelsesaftaler. Opdateret 19/09 2022 kl. 09:26 Må man ændre indholdet i en indgået uddannelsesaftale? Nej, aftaleparterne (elev/lærling og virksomhed) skal indgå en tillægsaftale til den oprindelige aftale, når man ændrer i ansættelsesvilkårene. Opdateret 19/09 2022 kl. 09:26 Har elever/lærlinge ret til ferie med løn? For elever med uddannelsesaftale efter lov om erhvervsuddannelser indeholder ferielovens § 9 en særregel, hvorefter en elev/lærling har en særlig ret til betalt ferie, selvom eleven/lærlingen ikke har optjent betalt ferie. Spørgsmål om forståelse af ferieloven skal rettes til Beskæftigelsesministeriet. Til toppen"
year_published = 2025
clearnet = "https://www.uvm.dk/erhvervsuddannelser/oplaering/uddannelsesaftaler/om-uddannelsesaftalerne"
