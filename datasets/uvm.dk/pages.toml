["https://www.uvm.dk/dagtilbud/plads-i-dagtilbud/plads-over-kommunegraenser"]
title = "Plads over kommunegrænser | Børne– og Undervisningsministeriet"
description = "For&aelig;ldre har rettigheder i forbindelse med at bevare en plads eller f&aring; tilbudt en plads i et dagtilbud ved flytning til en anden kommune."
full_description = "Der er forskel på, om forældre vil bevare en plads ved flytning over kommunegrænser, eller om forældre ønsker at få plads i et dagtilbud i en anden kommune. Ret til at bevare dagtilbudsplads ved flytning Alle børn har i forbindelse med flytning til en anden kommune ret til at bevare sin plads i dagtilbuddet i fraflytningskommunen. Et barn, der bevarer en plads i dagtilbud i en anden kommune end opholdskommunen, har ikke ret til oprykning til nyt dagtilbud i den anden kommune, medmindre barnet har plads i en aldersintegreret daginstitution, hvor der er automatisk oprykning fra en vuggestue til en børnehave, og hvor udgangspunktet er, at alle børn oprykkes inden for tilbuddet Mulighed for optagelse i dagtilbud i en anden kommune Børn har efter dagtilbudsloven adgang til at blive optaget i et dagtilbud i en anden kommune end opholdskommunen. For nogle familier kan det give bedre sammenhæng mellem familieliv og arbejde at kunne få sit barn optaget i et dagtilbud i en anden kommune end familiens opholdskommune. Det kan eksempelvis være, fordi familien bor tæt på en kommunegrænse og derfor bor tættere på et dagtilbud i en anden kommune end i familiens opholdskommune. Det samme kan gøre sig gældende for en familie, hvor forældrene arbejder i en anden kommune end deres opholdskommune, og det derfor vil passe bedre ind i familiens hverdag, at barnet også går i dagtilbud i den kommune, hvor forældrene arbejder. Vilkår for optagelse i og tilskud til dagtilbud i en anden kommune Børn, der ønsker en plads i et dagtilbud i en anden kommune, bliver i udgangspunktet skrevet på venteliste på de samme vilkår som kommunens egne børn. Der er muligvis ikke ledige pladser netop i det foretrukne dagtilbud, men ønsker skal tilgodeses ud fra samme regler, som gælder for de forældre, der bor i kommunen. Får barnet en dagtilbudsplads i en anden kommune, skal barnets opholdskommune give tilskud til pladsen. Tilskuddets størrelse fastlægges ud fra egen kommunes udgifts- og serviceniveau. Det er derfor den gennemsnitlige budgetterede bruttodriftsudgift, som egen kommune benytter til at beregne tilskud og egenbetaling for en alderssvarende dagtilbudsplads i kommunen, der skal anvendes, når tilskuddet til en plads i et dagtilbud i en anden kommune skal beregnes. Hvis bruttodriftsudgiften for det benyttede dagtilbud er dyrere end et alderssvarende dagtilbud i forældrenes opholdskommune, skal forældrene selv betale forskellen mellem tilskuddet fra egen kommune og driftsudgifterne pr. plads i det benyttede dagtilbud i anden kommune. Dette kan betyde, at forældrene skal betale en højere forældrebetaling, end de skulle have gjort, hvis barnet havde plads i et dagtilbud i egen kommune. Lukning af venteliste for børn fra andre kommuner Den enkelte kommune kan beslutte at lukke ventelisten for udefrakommende børn til dagtilbud, hvis kapacitetsmæssige hensyn eller væsentlige hensyn til børnene i kommunen gør det nødvendigt. Kommunalbestyrelsen kan kun beslutte at lukke ventelisten for 3 måneder ad gangen. Er en af betingelserne for lukning af ventelisten herefter fortsat opfyldt, kan kommunalbestyrelsen træffe en ny afgørelse om, at der fortsat skal være lukket for optagelse på ventelisten. Kommunalbestyrelsens beslutning om at lukke ventelisten for optagelse af børn fra andre kommuner er først gyldig fra det tidspunkt, hvor kommunalbestyrelsen har indberettet sin beslutning om lukning af ventelisten på www.ventelistelukning.dk For konkrete spørgsmål angående plads over kommunegrænsen skal forældre altid henvende sig til egen kommune og til den kommune, hvori der ønskes en plads (borger.dk) Lovgrundlag Lov om dag-, fritids- og klubtilbud m.v. til børn og unge (dagtilbudsloven) Læs mere Ventelistelukning.dk Borger.dk"
year_published = 2025
