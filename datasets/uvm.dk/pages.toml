["https://www.uvm.dk/sitecore/content/global/news/uvm/2025/feb/250224-ny-maaling-elevernes-trivsel-paa-landets-ungdomsuddannelser-og-fgu-er-fortsat-hoej"]
title = "Ny måling: Elevernes trivsel på landets ungdomsuddannelser og fgu er fortsat høj | Børne– og Undervisningsministeriet"
full_description = "Elevernes trivsel på landets gymnasiale uddannelser, erhvervsuddannelser og den forberede grunduddannelse (fgu) ligger generelt på samme høje niveau som tidligere år. Det viser resultaterne fra elevtrivselsmålingerne for 2024, som Styrelsen for It og Læring netop har offentliggjort. Elevtrivselsmålingen er opgjort på en skala fra 1 til 5, hvor 5 er den bedst mulige trivsel. Konkret viser målingen, at trivslen på gymnasiale uddannelser og erhvervsuddannelser ligger på 4,0 point. Trivslen på disse uddannelser har ligget stabilt på samme niveau i den seneste årrække. På fgu ligger den samlede trivsel på 3,8. Her har den ligget siden 2020, hvor man begyndte at måle trivslen for eleverne på fgu. ”I en tid med meget offentlig debat om unges trivsel er det vigtigt at huske på, at langt de fleste elever har det godt og trives på deres uddannelser. Det gælder selvfølgelig ikke for alle elever. Det er jeg klar over. Der er stadig nogen, der har problemer, og som har brug for hjælp. Det skal vi tage alvorligt og finde gode løsninger på. Derfor ser jeg meget frem til at modtage anbefalingerne fra Trivselskommissionen,” siger børne- og undervisningsminister Mattias Tesfaye. De enkelte indikatorer i trivselsmålingen viser, at på de gymnasiale uddannelser er trivslen lavest for eleverne, når det kommer til ”pres og bekymringer”. Her er gennemsnitsscoren 2,7 på landsplan i 2024. På indikatoren ”mobning” udtrykker eleverne den højeste trivsel med en gennemsnitsscore på 4,6. På erhvervsuddannelserne har eleverne angivet den laveste trivsel, når det kommer til de ”fysiske rammer” med en gennemsnitsscore på 3,7 på landsplan. Her angiver eleverne den højeste trivsel på indikatoren ”velbefindende” med en gennemsnitsscore på 4,3. På fgu er trivslen lavest, når det kommer til ”faglig trivsel”. Her er gennemsnitsscoren 3,7. Indikatoren indeholder spørgsmål om elevernes opfattelse af at trives fagligt og lære nyt på fgu. På indikatorerne ”faglig støtte” og ”fysiske rammer” er gennemsnitsscoren 3,9 i 2024, mens det er på indikatoren ”trivsel uden for skolen” at eleverne udtrykker den højeste trivsel med en gennemsnitsscore på 4,0. I elevtrivselsmålingerne er der desuden blevet spurgt ind til, om eleverne på de tre uddannelsesområder er blevet udsat for uønsket seksuel opmærksomhed. Resultaterne for 2024 viser, at 17 procent på erhvervsuddannelserne og fgu er blevet udsat for uønsket seksuel opmærksomhed af andre elever eller ansatte på skolen det seneste år. På de gymnasiale uddannelser er det 13 procent. På erhvervsuddannelserne og fgu er det en stigning på to procentpoint i forhold til 2023, mens andelen på de gymnasiale uddannelser er uændret ift. 2023. Læs mere Elevtrivsel på de gymnasiale uddannelser (uddannelsesstatistik.dk) Elevtrivsel på erhvervsuddannelserne (uddannelsesstatistik.dk) Elevtrivsel på den forberedende grunduddannelse (uddannelsesstatistik.dk) Om trivselsmålingerne 2024 Trivselsmålingerne på de gymnasiale uddannelser, erhvervsuddannelserne og fgu er årlige nationale målinger med forskellige spørgerammer. Trivselsmålingerne afvikles i perioden 1. november til 31. december."
