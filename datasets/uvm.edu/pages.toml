description = "RestrictionsIneligible Majors: Art Education, Studio ArtOther InformationIn the College of Arts and Sciences (CAS), only one course may overlap between a major and a minor or between two minors.Courses for the minor and/or its pre/co-requisites that are cross-listed in the catalog or schedule of courses under another course prefix may be taken under that other prefix and still count for these requirements.With the approval of the chair/director, courses that applied to the minor in previous years but have since been deactivated may be applied to this year’s minor requirements if they are reactivated.For a bachelor of arts degree, no more than 45 credits in courses with the same departmental prefix may be used toward completion of the 120 credits required for graduation. For a bachelor of science degree, the maximum is 50 credits.At least half of the credits used to complete minor requirements must be taken at the University of Vermont.CurriculumArt Minor Catalogue"
