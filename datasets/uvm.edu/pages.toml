["https://www.uvm.edu/health"]
title = "Center For Health and Wellbeing | The University of Vermont"
description = "The Center for Health and Wellbeing offers a full spectrum of medical, mental health, health promotion, and wellbeing services to keep students healthy, successful, and engaged during their time at UVM. We strive to provide welcoming, individualized, and affirming care."
full_description = "Center For Health and Wellbeing The Center for Health and Wellbeing offers a full spectrum of medical, mental health, health promotion, and wellbeing services to keep students healthy, successful, and engaged during their time at UVM. We strive to provide welcoming, individualized, and affirming care. Services are open to all full-time UVM students, including PhD, masters, undergraduate, medical, and other graduate student programs. They are open to all students who have paid the health fee.ServicesSchedule an appointment (MyWellbeing) Easily access all CHWB services How can we help you? Student Health Services (802) 656-3350, health@uvm.edu 425 Pearl Street M-W,F: 8am-12pm, 1-4:30pm Th: 10am-12pm, 1-4:30pm Counseling and Psychiatry Services (CAPS) (802) 656-3340, health@uvm.edu 146 South Williams St. (Jacobs House) Redstone at Wright Hall 436 S Prospect St. (Patterson Hall) M-F: 8:30am-4pm (walk-in for a Let's Talk appointment) Integrative Wellness Coaching and Nutrition Services (802) 656-3350, health@uvm.edu 425 Pearl St. (UHC) Emergency Care Immediate Danger: 911 UVM and CAPS 24/7: (802) 656-3340 (After-hours and weekends press 2 to speak with an on-call counselor.) First Call 24/7 Suicide/Crisis: (802) 488-7777 Vermont 24/7 Suicide/Crisis Text: Text VT to 741741 HopeWorks 24/7 for Sexual & Relationship Violence: (802)863-1236 After hours, weekend, and holiday care can be accessed by: After Hours Medical CareFor medical advice from triage nurse services, please call 802-656-3350 and follow the phone prompt.UVM Medical Center Urgent Care, 790 College Parkway, Colchester, VT, (802) 847-1170 (not covered by UVM health fee)ClearChoiceMD Urgent Care, 1200 Williston Rd, South Burlington, VT, (802) 347-6274 (not covered by UVM health fee)After Hours Mental Health CareCall (802) 656-3340 and choose voicemail option #2 to reach an on-call counselor outside of normal business hours. Counselors on call are always available to respond to students in crisis, and consult with friends, roommates, faculty, staff, or family members. These calls can be anonymous. Accreditation The Center for Health and Wellbeing is accredited by the Accreditation Association for Ambulatory Health Care (AAAHC). AAAHC defines high national standards for patient and client care, facilities, methodology and value. The accreditation process includes rigorous peer reviews and site visits. Inclusive Excellence Inclusive Excellence at CHWBThe Center for Health and Wellbeing (CHWB) is committed to maintaining healthcare and health promotion experiences that are welcoming, equitable and inclusive to individuals of all identities and backgrounds including, but not limited to, sex, gender, race, sexual orientation, ethnicity, socioeconomic status, religion, and age. Through inclusive excellence CHWB focuses on addressing the ever-present barriers in health, and works with students to find solutions to reduce and remove the numerous barriers that prohibit individuals from full participation in accessing care and their college experience. This approach is aspirational and always a work in progress, and we devote time and energy to hiring staff who support and work toward fulfilling this mission.We work to empower students to be intentional about the ways in which they practice and engage with their well-being in their day to day lives. While there are many factors affecting the ways in which students do this — such as social determinants of health — there are many ways in which students can inform positive decisions and practices that are right for them. These practices, in tandem with connection to the environment, communities around you and planetary health, work to disrupt the systems of power and oppression in the well-being field."
year_published = 2025
