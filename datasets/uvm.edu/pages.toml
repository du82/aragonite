full_description = '''Costs, Financial Aid, and Scholarships We are committed to making UVM affordable and accessible to everyone. Explore Merit-Based ScholarshipsYou've worked hard, and it's time to show us who you are and what makes you stand above the crowd. Merit-based scholarships are awarded for excellence in academics, leadership, geographic location, and a particular field of study. At UVM, we consider all applicants for a variety of merit-based scholarships; no separate application needed! Learn more about merit-based scholarshipsEstimate Your CostsWhat will you pay for college? Chances are, it’s less than you might think. You need to look beyond the “sticker price” to find your net cost. Net cost is the amount you will pay–or fund through loans, payment plans, etc.– after any scholarships, grants, or other gift aid (money that does not need to be repaid) has been applied. Our Net Price Calculator helps estimate your net cost for a UVM education. To use the calculator, be prepared to fill out some academic and family financial info. UVM Net Price CalculatorDiscover Need-Based Financial AidUVM requires both the FAFSA ("Free Application for Federal Student Aid") and the CSS Profile to be considered for need-based aid. Learn about applying for financial aidExplore types of aid 92% of undergraduates receive scholarships or financial aid $175M UVM support awarded to all undergraduates 46% of UVM students from Vermont attend tuition free'''
