full_description = 'Academic Resources Important academic resources Academic Calendars Graduate Degree Programs Office of the Registrar Graduate Catalogue The Graduate Catalogue contains links for Academic and Enrollment Policies, Courses Approved for Graduate Credit, Degree Requirements, and Graduate Faculty. Additional important information Academic regulations and policies Body Academic Regulations: GA (PDF) | GRA (PDF) | GTA (PDF) | Predoctoral Fellows and Trainees (PDF) Academic forms Body Access the following forms via InfoReady: (Chrome, Edge or Firefox recommended browsers)Academic Probation: Exceeded Time Limit for Degree CompletionAcademic Probation: GPAAMP Course UpdateChange of Catalogue Edition RequestChange of Graduate Program RequestCurrency of CreditDefense Committee MembershipExtension to Time Limits for Graduate Degree or Certificate CompletionIncomplete Grade Request: Additional InformationIntent to GraduatePermission to Take 3000/4000 Level Course for Graduate CreditTransfer of CreditVisiting Graduate Student RequestLeave and Withdrawal RequestsLate WithdrawalLeave of AbsenceMedical WithdrawalReactivationGraduate Student Parental Accommodation Request Academic support Body Academic Integrity (PDF)UVM LibrariesGraduate Writing CenterTheses, Dissertations, GraduationTimetable for Thesis/Dissertation Students (PDF)Electronic Thesis and Dissertation Policy (PDF)LaTex Thesis & Dissertation Template and Style Files (contact gradcoll@uvm.edu)Defense Notice Template (Word)Thesis/Dissertation GuidelinesElectronic Thesis and Dissertation Rights and Permissions Form (PDF)Thesis and Dissertation Upload (ProQuest)Thesis/Dissertation Template (Word)Proof of Successful Completion of Comprehensive Exam Form (InfoReady)Defense Committee Membership Form (InfoReady)Intent to Graduate / Commencement Information (InfoReady) Advising and mentoring Body Strong academic advising and developing a supportive network of diverse mentors is critical to every graduate student’s success. The Graduate College champions a culture of mentoring in which graduate students are supported in forging effective mentoring relationships with multiple mentors.Graduate Faculty Roster (opens Graduate Catalogue)Promising Practices in Mentoring: Resources for Graduate Faculty and Graduate StudentsCGS, Great Mentoring in Graduate School: A Quick Start Guide to Proteges (PDF) – a practical, student-oriented perspective; tips on topics such as identifying a mentor, engaging with mentors to develop a professional identity, cultivating networks, serving as mentor to others. Includes self-assessments.CGS, Ph.D. Completion Project: Promising Practices in Mentoring and Advising (PDF)Rackham Graduate School UMichigan, Quick Tips for Promising Practices in Mentoring (PDF)Rackham Graduate School UMichigan, How to Mentor Graduate Students. A Guide for Faculty (2018) (PDF)Rackham Graduate School UMichigan, How to Get the Mentoring You Want: A Guide for Graduate Students (2018) (PDF)Inclusive Mentoring: Effective Graduate Student Mentoring Practices (Brown University)Vanderbilt Center for Teaching - Mentoring Graduate StudentsCenter for the Improvement of Mentored Experiences in ResearchAdvising and Mentoring Resources for Faculty (Brown University)Montgomery, B. L., “Mapping a Mentoring Roadmap and Developing a Supportive Network for Strategic Career Advancement” (2017)Mentoring Graduate Students for a range of professional careers (UM, Humanities focus)National Research Mentoring Networkcurated mentorship playlistDuke University Graduate School’s toolkit for cultivating a culture of mentoringGraduate Student Mentoring Map (PDF)Additional resources provided by the Graduate CollegeProfessional Development and Career PlanningIndividual Development Plan (IDP)Selecting a Defense Examination Committee (PDF)Ombudsperson for Graduate Students Gradnet Body Gradnet is an electronic forum where Graduate students, faculty, and staff discuss issues, research topics, graduate student life and announcements that pertain to you, a member of our Graduate community here at UVM.How to subscribeSubscribing to Gradnet is FREE of charge and all it takes is the obtaining of an Electronic Mail account from Enterprise Technology Services.All you have to do is compose a message to: Listserv@list.uvm.edu; in the message area type "subscribe Gradnet "Your first name" "Your last name".Within a day or two you will be a member of Gradnet and be entitled to all of the privileges that come with it. So, when you come to campus, be sure to join in and tune in. Get connected, join GRADNET.Computer Labs are located in the ground floor of the Waterman building, in Bailey/Howe Library, and throughout campus in labs of specific fields of study. For more information about GRADNET or any other aspect of Graduate Student Life please feel free to contact the Office of the Dean, Graduate College at 656-3160. Graduate student ombudsperson Body The Graduate Student Ombudsperson (“Ombuds”) offers independent, confidential*, informal, and impartial assistance to graduate students on matters affecting their graduate education. The Ombuds addresses issues and challenges students may face in their academic careers at UVM. The Ombuds thus supports the University’s commitment to excellence in graduate education.'
