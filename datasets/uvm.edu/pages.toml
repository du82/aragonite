["https://www.uvm.edu/cess/doe/program/american-sign-language-asl-minor"]
title = "American Sign Language (ASL) Minor | Department of Education | The University of Vermont"
description = "Gain ASL language and cultural competencies while developing a deeper understanding of Deaf experiences through historical, social, and cultural lenses. Our interdisciplinary approach lets students apply linguistic skills and theoretical knowledge toward innovative solutions for problems that perpetuate the marginalization of Deaf people. American Sign Language (ASL) is a complete, complex language akin to other languages such as Spanish, Italian, and Japanese. ASL has been recognized as such by both the Modern Language Association and the American Council on the Teaching of Foreign Languages. The ASL minor is a valuable complement to any declared major in the sciences, social sciences, education, humanities, or the arts. Students who gain ASL competency and cultural knowledge are strong candidates for graduate studies and employment in deaf-related fields.Coursework requirements Before enrolling, we encourage students to take a language placement assessment interview with an ASL faculty member. The assessment determines language proficiency determines what course best fits each student. Students who wish to take the assessment should contact Nicholas Lalanne at Nicholas.Lalanne@uvm.edu to schedule an appointment.ApplyApply for the ASL MinorMeet Our FacultyVisit Faculty Profiles"
