["https://www.uvm.edu/cas/anthropology/program/ba-major-anthropology"]
title = "B.A. With a Major in Anthropology | Department of Anthropology | The University of Vermont"
description = "Studying anthropology can offer you valuable insights into different cultures, societies, and human behaviors. It helps you develop critical thinking skills, cultural awareness, and a deeper understanding of our shared humanity. Whether you're interested in history, archaeology, or sociology, anthropology provides a unique perspective on the world around us.The Bachelor of Arts with major in Anthropology at UVM is flexible enough for you to pursue specialized interests in the discipline. In addition to a more generalized program, concentrations include archaeology and heritage management, as well as the anthropology of global health.Double majors work really well with Anthropology. The subfields of our discipline share borders with many other humanities, social science, and natural science disciplines, and many of our students find that our theories and methods complement and enrich their studies in another discipline."
full_description = "B.A. With a Major in Anthropology Type of Degree B.A. School or College College of Arts and Sciences Area of Study Arts, humanities, social sciences Program Format On-campus, Full-time Apply Program Overview Program Overview Studying anthropology can offer you valuable insights into different cultures, societies, and human behaviors. It helps you develop critical thinking skills, cultural awareness, and a deeper understanding of our shared humanity. Whether you're interested in history, archaeology, or sociology, anthropology provides a unique perspective on the world around us.The Bachelor of Arts with major in Anthropology at UVM is flexible enough for you to pursue specialized interests in the discipline. In addition to a more generalized program, concentrations include archaeology and heritage management, as well as the anthropology of global health.Double majors work really well with Anthropology. The subfields of our discipline share borders with many other humanities, social science, and natural science disciplines, and many of our students find that our theories and methods complement and enrich their studies in another discipline. Concentrations Concentrations Anthropology With a Concentration in Archaeology and Heritage ManagementStudents interested in the study of past human cultures, the preservation and interpretation of archaeological sites and the management of cultural resources will want to consider tailoring their anthropology major major to focus on archaeology and heritage management. We suggest courses that enable you to study major developments in human history, apply archaeological methods to the investigation of specific cultures and regions, and build professional skills surrounding the protection, preservation and interpretation of archaeological cultures, sites, and objects.Anthropology with a Concentration in Archaeology and Heritage Management (PDF)Anthropology With a Concentration in Global HealthIf you are interested in human health and its variation within and across different populations, cultures, and societies, you'll want to consider tailoring your major or minor in anthropology with a focus on global health. We offer a variety of courses centered on biological and cultural anthropology and related to the body and health in varying cultural, social, and environmental settings. These courses are designed for students with an interest in biological anthropology, medical anthropology, diversity and health, and public and global health.Major Concentration in Anthropology of Global Health S2020 (PDF)​Current Global Health Concentration Requirements (PDF)​Old Global Health Concentration Requirements (PDF) Curriculum Curriculum From UVM Catalogue:Anthropology B.A. Requirements Outcomes Outcomes Learning OutcomesUpon completion of the BA degree, students will be able to:Provide an anthropological definition of culture and give examples of how culture shapes human life in diverse ways.Distinguish the ways in which anthropologists examine and analyze human diversity across time and space.Recognize how the four subfields of anthropology (cultural, linguistic, biological, archaeological) differ in focus, methodologies, and conceptual approaches.Demonstrate how an anthropological approach can be applied to a range of complex social issues in diverse settings.Recognize ethical dilemmas in anthropology and ethical principles in research and other practice.Develop and communicate anthropological research questions, access and analyze scholarly literature, and outline appropriate research methods and approaches.Careers in AnthropologyAnthropologyCultural Resource ManagementEducationForensicsHealth (international/public health)International DevelopmentLaw, Criminal JusticeResearchWhere Our Alumni WorkCities and municipalitiesColleges and universitiesElementary and secondary schoolsLaw firmsMedia production companiesMuseums and librariesResearch InstitutesWhere Alumni Attend Graduate SchoolBrandeis UniversityBoston UniversityUniversity of Rhode IslandUniversity of SussexParson's School of Design (New School)University of MaineUniversity of Illinois-Champaign UrbanaThe University of EdinburghBard College Related Programs Anthropology B.S. College of Arts and Sciences program formatFormat: On-campus Anthropology Undergraduate Minor College of Arts and Sciences program formatFormat: On-campus Credit hours to graduate18"
