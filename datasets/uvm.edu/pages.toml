["https://www.uvm.edu/admissions/undergraduate/transfer-students-how-apply"]
title = "How to Apply: Transfer Students | Undergraduate Admissions | The University of Vermont"
description = "UVM welcomes applications from students of diverse backgrounds. Through a holistic admissions review, we select students with potential for academic success who will contribute to our community."
full_description = "How to Apply: Transfer Students UVM welcomes applications from students of diverse backgrounds. Through a holistic admissions review, we select students with potential for academic success who will contribute to our community. The rigor of an applicant’s academic program; grades; and trends in performance are considered. Essays, recommendations, and other evidence of each student’s life experience also assist our evaluation. Admission decisions are made without regard to family financial circumstances.Transfer Students Are: Those who have completed credits at a post-secondary institution after completing high school and wish to complete your degree at UVM.Important Dates and DeadlinesSpring Application Deadline: November 1Fall Application Deadline: June 1 View All Deadlines Apply Through the Common App Apply online today. Apply Through the Coalition App (Scoir) Apply online today Check Your Application Status Already applied to UVM? Sign in to see all of your personalized next steps. Prepare to Apply Required Application Materials Required Application Materials Body Application Options The Common AppCoalition App (Scoir)There is no advantage or disadvantage to using either application format. Application Fee$55 USD (nonrefundable) If you are a student at the Community College of Vermont, your application fee is waived.TranscriptsFinal high school transcript and transcript(s): Contact your High School Guidance office. They can submit your transcript electronically to admissions@uvm.edu.All post-secondary institutions you’ve attended. The registrar’s office at your previous institutions(s) may submit transcripts electronically to collegetranscriptsubmission@uvm.edu.Course Syllabi In certain cases, credits you’ve completed at previous institutions may need a more in-depth evaluation to determine how they will transfer to UVM-equivalent credits. If this is the case, we will need copies of your course syllabi to review whether the content of the course meets the requirements for credit. Start collecting your syllabi as early as possible, in case we need them for your official credit evaluation. (Optional) Letter of RecommendationIf you choose to submit a letter of recommendation, it should be written by a current professor. Entrance Requirements Entrance Requirements Body To be considered for entry to UVM, your previous studies in either high school or college must meet certain minimum requirements. Most successful applicants exceed these minimum requirements.Cumulative grade point average of at least 3.0 in college level coursework. 4 years of English 3 years of mathematics (algebra I, algebra II, geometry, or equivalents)2 years of the same foreign language (American Sign Language meets this requirement) 3 years of natural or physical science, including a laboratory science3 years of social sciences School and College Requirements School and College Requirements Body All transfer applicants apply to one of seven schools or colleges. Some of UVM’s schools, colleges, and programs have additional requirements for all applicants. There are also specific requirements for transfer applicants for the following schools: Grossman School of Business: Must have completed college-level micro or macroeconomics and/or college level calculus College of Engineering and Mathematical Sciences: Must have completed up to pre-calculus and physics College of Nursing and Health Sciences: Must have completed all first-year, non-nursing requirements Questions About Applying? The UVM Admissions transfer team is here to answer your questions and be your guides. Whether it’s deciding if transferring is right for you, or getting help with the nitty-gritty details, book time to chat one-on-one with a transfer coordinator or email Transfer.Apply@uvm.edu. Schedule a Call Ask the Experts Bridget Baldwin Senior Assistant Director of Admissions – International and Transfer Initiatives • Caribbean, Rhode Island Bridget.Baldwin@uvm.edu (802) 656-3514 Molly Witt Senior Associate Director • Europe Molly.Witt@uvm.edu (802) 656-3228 Transfer Resources Learn About Transferring Credits Learn About Transferring from Community College of Vermont (CCV) Request Info About UVM Scholarships for Transfer Students Housing for Transfer Students Visit Campus"
year_published = 2025
