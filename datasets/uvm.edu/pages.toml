["https://www.uvm.edu/cems/ebe/program/undergraduate-certificate-autonomy-and-robotics"]
title = "Undergraduate Certificate in Autonomy and Robotics | Electrical and Biomedical Engineering | The University of Vermont"
description = "Autonomy and robotics are transformative technologies driving innovation across many industries, fostering economic growth and enhancing quality of life. Key sectors include manufacturing (e.g. enhanced production processes and improved precision), transportation (e.g. autonomous vehicles and enhanced traffic control), healthcare (e.g. robotic surgeries and patient care), agriculture (e.g. precision farming and agricultural robotics), defense (e.g. swarms and guidance systems), and energy (e.g. autonomous power systems). In this context, “autonomy” refers to the capability of an engineered system to operate autonomously. Achieving this involves algorithm and software design, which in turn involves concepts from signals and systems, control theory, and artificial intelligence. “Robotics” in this context refers to the design, construction, and operation of robots and machinery to perform tasks, and involves mechanical design, actuator/sensor design, mathematical modeling, and embedded programming.The Undergraduate Certificate in Autonomy and Robotics (UCAR) provides you with a strong foundation in autonomous systems, robotics, and/or artificial intelligence. You will complement your coursework in these areas with experiential learning in our teaching labs. Completion of the program certifies to employers your readiness to begin your career in engineering positions focused on autonomous systems and robotics. Local companies with needs in these areas include Beta Technologies, Global Foundries, Green Mountain Power, Dynapower, Hazelett, Husky, and Rigorous."
full_description = "Undergraduate Certificate in Autonomy and Robotics Type of Degree Undergraduate Certificate School or College College of Engineering and Mathematical Sciences Area of Study Science, technology, engineering and mathematics Program Format On-campus, Full-time Credit hours to graduate A minimum of 15 credit hours Program Overview Program Overview Autonomy and robotics are transformative technologies driving innovation across many industries, fostering economic growth and enhancing quality of life. Key sectors include manufacturing (e.g. enhanced production processes and improved precision), transportation (e.g. autonomous vehicles and enhanced traffic control), healthcare (e.g. robotic surgeries and patient care), agriculture (e.g. precision farming and agricultural robotics), defense (e.g. swarms and guidance systems), and energy (e.g. autonomous power systems). In this context, “autonomy” refers to the capability of an engineered system to operate autonomously. Achieving this involves algorithm and software design, which in turn involves concepts from signals and systems, control theory, and artificial intelligence. “Robotics” in this context refers to the design, construction, and operation of robots and machinery to perform tasks, and involves mechanical design, actuator/sensor design, mathematical modeling, and embedded programming.The Undergraduate Certificate in Autonomy and Robotics (UCAR) provides you with a strong foundation in autonomous systems, robotics, and/or artificial intelligence. You will complement your coursework in these areas with experiential learning in our teaching labs. Completion of the program certifies to employers your readiness to begin your career in engineering positions focused on autonomous systems and robotics. Local companies with needs in these areas include Beta Technologies, Global Foundries, Green Mountain Power, Dynapower, Hazelett, Husky, and Rigorous. Curriculum Curriculum Required Coursework (6 credits):Course NumberTitleCreditsOne of the following:EE 2845 (4 cr), orCMPE 3815 (4 cr), orCS 2830 (3 cr) orME 2XXX (coming) Digital control with embedded systems,Microcontroller systemsEmbedded Programming in CMechatronics3/4One of the following:EE 3515 (4 cr) orME 3320 (3 cr) Control Systems3/4 Preapproved electives (6 credits minimum):Course NumberTitleEE 3530 Digital Signal ProcessingEE 5540Real-time control systemsME 5XXX (coming)Fundamentals of roboticsEE 5550 Autonomy IEE XXXX (coming)Autonomy IIOne ofEE XXXX (coming) orCS 3540 orCS 5540 Machine learning for engineersMachine LearningAdvanced Machine LearningCS 3060Evolutionary RoboticsCredit bearing experience* (3 credits required)Course NumberTitleEE/ME/CS 3991 or equivalentInternshipEE/ME/CS 3995 or equivalentUndergraduate ResearchEE 4200** / ME 4020** or equivalentCapstone Design IIEE/ME 2996 or CS 4996 or equivalentHonors Thesis*topic must be relevant to autonomy and robotics field** by petition only Outcomes Outcomes The learning objectives of the Undergraduate Certificate in Autonomy and Robotics (UCAR) are as follows:Design and assemble circuits with sensors, actuators, and microcontrollers to build, program, and test autonomous systems, including robots.Explain and classify robots and robotic systems.Mathematically model, and design autonomy algorithms for, a wide range of practical systems including DC motors, smart grids, ground and aerial vehicles, and robot manipulators.Use programming languages (e.g., Python, MATLAB) and simulation tools (e.g., ROS, Gazebo) to model, control, and simulate the behavior of autonomous systems.Program microcontrollers to implement and deploy autonomy algorithms."
year_published = 2025
