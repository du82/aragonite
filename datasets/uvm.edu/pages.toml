["https://www.uvm.edu/business/program/master-accountancy"]
title = "Master of Accountancy | Grossman School of Business | The University of Vermont"
description = "Our 30-credit Master of Accountancy (MAcc) program develops fluency with accounting, auditing, taxation, and regulatory issues. We also develop communication and data analytic skills that make our students stand out with employers.Program DistinctionsTop 10% CPA Exam first-time pass rate in 2023 and for 11 of the 12 past years; #3 overall in 2020!100% job placement (5-year average)Satisfies the 150 credit-hour requirement to sit for the CPA examSustainability and Environmental, Social and Governance (ESG) course offeringsProgram STEM designation reflects the technical aspects of the accounting profession andenables our international students the opportunity to gain U.S. work experienceA majority of our MAcc students receive scholarshipsAccreditation and Professional LicensureUVM’s MAcc Program is designed to prepare students to enter the accounting profession and to meet educational requirements to sit for the Uniform Certified Public Accounting Exam (CPA Exam). Beyond academic degree requirements, certain state licensing boards may mandate specific credit hours in accounting, business, or other topics before you can take the CPA Exam. Additionally, some states have specific non-academic criteria, such as background checks, work experience, residency, fingerprinting, etc. to become certified. Therefore, UVM strongly advises you to check the requirements for the state where you plan to take the CPA Exam. You can research this information on the NASBA website.Public Accountancy: Licensure Requirements for each of the 50 states and U.S. protectorates (PDF)"
full_description = "Master of Accountancy Type of Degree M.Acc. School or College Grossman School of Business Area of Study Business and economy Program Format On-campus, Hybrid, Full-time, Part-time Credit hours to graduate 30 credits, 10 courses Apply Inquire A Proven Track Record of CPA Exam Success and Job Placement Program Overview Program Overview Our 30-credit Master of Accountancy (MAcc) program develops fluency with accounting, auditing, taxation, and regulatory issues. We also develop communication and data analytic skills that make our students stand out with employers.Program DistinctionsTop 10% CPA Exam first-time pass rate in 2023 and for 11 of the 12 past years; #3 overall in 2020!100% job placement (5-year average)Satisfies the 150 credit-hour requirement to sit for the CPA examSustainability and Environmental, Social and Governance (ESG) course offeringsProgram STEM designation reflects the technical aspects of the accounting profession andenables our international students the opportunity to gain U.S. work experienceA majority of our MAcc students receive scholarshipsAccreditation and Professional LicensureUVM’s MAcc Program is designed to prepare students to enter the accounting profession and to meet educational requirements to sit for the Uniform Certified Public Accounting Exam (CPA Exam). Beyond academic degree requirements, certain state licensing boards may mandate specific credit hours in accounting, business, or other topics before you can take the CPA Exam. Additionally, some states have specific non-academic criteria, such as background checks, work experience, residency, fingerprinting, etc. to become certified. Therefore, UVM strongly advises you to check the requirements for the state where you plan to take the CPA Exam. You can research this information on the NASBA website.Public Accountancy: Licensure Requirements for each of the 50 states and U.S. protectorates (PDF) Concentrations Concentrations Students may choose to specialize in one area of accounting.Financial reporting and auditingTaxation: compliance and planningSustainability reporting and assurance Curriculum Curriculum Accounting is a dynamic profession. We regularly engage with industry leaders to ensure ourcurriculum is current and sets you up for success. Career fit is also important – working closely with a MAcc advisor, you will individualize your course of study to capitalize on prior professionalexperience and/or coursework on the way to reaching your goals. HighlightsBroad exposure to knowledge and practices across the accounting professionOption of choosing a focus in financial reporting and auditing, taxation, or sustainability and Environmental, Social, and Governance (ESG) reportingProgram STEM designation reflects the inclusion of data analytics and other technologies throughout the curriculumEach MAcc student’s program is geared toward their individual interests and needsThe University of Vermont’s Master of Accountancy Program comprises 10 courses, equaling 30 graduate credit hours including:18 credit hours (6 courses) of accounting, auditing and taxation;3 credit hours (1 course) of CPA law;3 credit hours (1 course) of professional communications; and6 credit hours (2 courses) of graduate-level business courses. Students can substitute additional accounting courses for business courses.Required CoursesBUS 6601 Professional Communications: Addresses different components of professionalcommunications key to accounting career success. Clear business writing, strong interpersonal skills, effective presentation and group meeting communications are emphasized and illustrated in a variety of assignments.BUS 6602 CPA Law: Provides Master of Accountancy students with exposure to the major areas of U.S. law emphasized on the uniform CPA exam.BUS 6690 Accounting Research, Regulation and Ethics - MAcc Capstone: Students researchcurrent financial reporting issues and regulatory requirements. Readings and cases emphasize theethical responsibilities of professional accountants.Accounting ElectivesBUS 5630 Auditing: Examination of auditing theory and practice. Topics include standards, ethics and legal obligations of the profession, audit planning, internal control, audit evidence, and auditor communications.BUS 5635 Fraud Examination: The course covers all of the major methods employees use tocommit occupational fraud. Students learn how and why occupational fraud is committed, howfraudulent conduct can be deterred, and how allegations of fraud should be investigated and resolved.BUS 5641 Corporation Taxation: A survey of the tax consequences for C corporations and their shareholders of womb-to-tomb transactions, which includes formations, acquisitions, divisions, consolidations, and international operations, as well as the reporting of book/tax differences.BUS 5646 Tax Research: Uses various research techniques to analyze federal tax principlesgoverning individuals and business entities and emphasizes the effective communication of technical analyses.BUS 5660 Accounting Information Systems: Examination of how accounting information iscollected, stored and made available to decision makers with an emphasis on internal control implementation.BUS 5990 Data Analytics for Accounting: The course covers managerial statistical tools indescriptive analytics and predictive analytics, including regression, forecasting, risk analysis,simulation, and data mining. Students will learn how to create data-driven visualizations and presentations.BUS 5643 Taxation of Social Enterprises: Explores the balance that organizations try to achieve between the for-profit (business) and nonprofit (charitable) separation of the tax world. BUS 6612 Adv Topics in Corporate Accounting & Reporting: Focuses on accounting for business combinations and developing consolidated financial statements. Includes accounting for foreign currency transactions, foreign subsidiaries, segment, interim, and SEC reporting. Topics vary by offering; periodic offering at intervals that may exceed four years. BUS 6641 Tax and Entrepreneurial Ventures: A study of the tax consequences of usingpartnerships, S corporations, and limited liability companies for business operations, with an examination of the tax aspects of choice-of-entity, operational, and divestment decisions for small and family-owned businesses.BUS 6690 Advanced Special Topics: Advanced courses on topics beyond the scope of existing departmental offerings.Financial ReportingBUS 5615 Advanced Accounting: Focuses on accounting for business combinations anddeveloping consolidated financial statements. Includes accounting for foreign currency transactions,foreign subsidiaries, segment, interim, and SEC reporting.BUS 5620 Advanced Topics in Management Accounting: Emphasizes use of internal and external information in management decision making; includes cost of inventory, business activities,strategic use of information, long-range planning.BUS 5650 Governmental Accounting: This course introduces accounting principles and auditing standards applicable to governmental entities and not-for-profit organizations. Course projectsutilize local government and not-for-profit financial reports and expose students to practicalapplication of governmental accounting requirements.BUS 6670 Accounting & Reporting for ESG: Combines an introduction to financial and managerial accounting and reporting with the most recent standards used by entities worldwide to report on their environmental, social and governance (ESG) activities.BUS 6691 Internship: MAcc credit can be obtained for approved internships and enrollment in internship coursework.Passing the CPA ExamSpecific advice on passing the CPA ExamOther DetailsSustainability Content: Students who are interested in a sustainability focus are encouraged to visit the Certificate of Graduate Study in Sustainable Enterprise course offerings which include descriptions of graduate non-accounting elective courses.The Accounting and Finance Career Fair in September will help you start the full-time jobrecruitment process.Applicants with an undergraduate business degree in a field other than accounting must complete the two corporate financial reporting courses (BUS 3610 and 3611) in addition to the 10 coursesrequired by the MAcc program. BUS 3610 must be completed before starting MAcc classes.Note: Most states require at least one auditing and one taxation course to sit for the CPA exam and become certified as a CPA. Admissions Admissions To be considered by the Graduate Studies Committee, MAcc applicants must meet the following minimum requirements (separate criteria for AMP students):4-year bachelor's degree2.75 (4.0 scale) overall GPAInternational students only: TOEFL of 90 or IELTS of 7.0GMAT or GRE equivalent are not required, but students with lower GPAs and/or foreign university graduates may wish to submit scores to enhance credentialsPrerequisite coursesMicroeconomicsPrinciples of Financial Accounting (Introductory Financial Accounting)Principles of Managerial Accounting (Introductory Managerial Accounting)Corporate Financial Reporting 1 (Intermediate Accounting 1)Corporate Financial Reporting 2 (Intermediate Accounting 2)Students meeting these requirements complete the program in as few as 9 months. Students may apply before all prerequisites are met, but the first four courses above must be completed before officially entering the program.How to ApplyGeneral application requirements are listed below.Complete online applicationApplication Fee Waiver Requests are available to current UVM undergraduate students and other qualified individuals.Submit your personal statementSupply names and emails for three individuals providing references (faculty or professional) Provide transcript(s) with your application (does not need to be official); if admitted, an official transcript will be requiredDocumentation and test scores GMAT and GRE scores are optional (if sent, must come directly from the granting source)TOEFL, IELTS or Duolingo scores are required for non-English speakersApplication Fee WaiverThe University of Vermont’s Graduate College offers a waiver of the $65 application fee for a number of organizations. View additional application fee waiver opportunities offered by the UVM Graduate College. Waiver requests through the Graduate College or MBA program must be submitted before completing an application; no refunds will be given for payment of the application fee. *Current University of Vermont staff, graduate students, and undergraduate students applying to the Accelerated Masters Pathway (AMP) are all eligible for an application fee waiver.DeadlinesDomestic students: rolling admissionInternational students: May 15 for Fall; October 15 for SpringApply early for greater scholarship consideration. Classes are capped at 45 students.For a jump-start, consider taking advantage of condensed summer courses before the start of the fall semester. MAcc tuition and scholarship opportunities Outcomes Outcomes You'll find the majority of UVM MAcc graduates working as assurance and tax associates with Big-4 and other international as well as regional and Vermont accounting firms. Where our alumni work Costs and Funding Costs and Funding MAcc Tuition, Scholarships and Other AssistanceTuition and FeesReview our tuition and fees for the Master of Accountancy program.Note: MAcc students generally enroll in 15 credit hours per semester (full-time applies to 9 or more credits). International students must be full-time in all but the last semester to complete the program.ScholarshipsA majority of MAcc students receive generous scholarships. Both in-state and non-Vermont residents are encouraged to apply early for the opportunity to receive more scholarship funds.Accelerated Master Program (AMP) students with a 3.2 GPA or higher who are non-Vermont residents receive a scholarship to match a comparable Master of Accountancy tuition rate in their home state. AMP students continue to pay their regular UVM tuition rate until the undergraduate degree is complete.Please email the MAcc director to learn more about these opportunities:Grossman and MAcc Director Academic Merit Scholarships are based on GPA, professional promise, GMAT, and TOEFL where applicable. GPA of 3.5 or higher is required for award renewal.Accelerated MAcc students are automatically considered for Grossman Honors Day accounting scholarships.The AICPA offers this Way to CPA scholarships.Graduate student teaching or research assistants may support Grossman School of Business faculty up to five hours per week.Find more about graduate student financial assistance.How to ApplyGeneral application requirements are listed below. Review detailed application instructions. Complete online applicationSubmit your personal statementSupply names and emails for three individuals providing references (faculty or professional) Provide transcript(s) with your application (does not need to be official); if admitted, an official transcript will be requiredDocumentation and test scoresGMAT and GRE scores are optional (if sent, must come directly from the granting source)TOEFL, IELTS or Duolingo scores are required for non-English speakers More More MAcc Faculty and StaffMeet our team!Passing the CPA ExamSpecific advice on passing the CPA Exam. Why MAcc? STEM Designation Program STEM designation reflects the comprehensive data analytics and technology incorporated into the MAcc program and allows our international students to gain work experience in the U.S. after graduating. Experiential Learning MAcc students travel to Cape Cod each year for a service-learning project with Cape Abilities Farm, a non-profit organization that creates an inclusive community for people of all abilities. Accreditation & Professional Licensure Designed to prepare students to enter the accounting profession and to meet educational requirements to sit for the Uniform Certified Public Accounting Exam (CPA Exam). Join Our Contact List Loading.../**/"
