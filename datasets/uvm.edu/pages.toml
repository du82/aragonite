title = "Careers | Human Resources | The University of Vermont"
full_description = "Careers UVM WorksFor people and planetUVM is a premier research institute rooted in discovery, creativity, community, and action. Located in Burlington, we are known for our commitment to sustainability, diversity, and community impact. In a vibrant setting enriched by the surrounding natural landscapes, UVM emphasizes environmental leadership, experiential learning, and innovation, creating solutions that benefit Vermont and beyond.For youUVM is known for its award-winning Employee Wellness program, competitive and comprehensive benefits, and a commitment to your personal and professional growth. Find a job you love in a community where you and your family can thrive. Find a Job Whether you're looking to join the UVM family or are seeking a new opportunity as a current employee, find the right next step in your career and apply with our jobs portal. UVM Jobs Why UVM? A commitment to academic excellence, intellectual freedom, and making an impact is at the center of everything we do. This commitment is brought to life by the work of faculty and staff across a wide range of UVM colleges, departments, offices, centers, programs, and initiatives. Learn more about UVM UVM News A Totally Rewarding Experience UVM's Total Rewards package is comprised of health & welfare benefits, compensation, and the other perks that come with being a UVM employee. It is a key component to why so many employees come to - and stay at - UVM. Total Rewards Wellness in Work and Life UVM is committed to supporting the whole person by fostering a culture of wellbeing, offering flexible work options that adapt to your unique needs, and providing diverse opportunities for personal and professional growth. Employee Wellness Talent Development More ways to engage at UVM A Community Like No Other With a rich array of shared cultural, social, and community-focused resources and opportunities, UVM and Burlington celebrate collaboration, innovation, and shared purpose that lead to big impacts. Office of Engagement Cultural Resource Guide Campus Events Values in Action At UVM, we believe in the transforming power of education and agree to help create and foster an environment where we can discover and reach our true potential. Our Common Ground Our Commitment to Sustainability Our Commitment to Inclusive Excellence Our Commitment to Equal Opportunity and Access Body UVM is an Equal Opportunity Employer. We are committed to fostering an inclusive environment where all individuals are treated with respect and dignity. We celebrate diversity and are dedicated to creating an equitable and accessible workplace. UVM does not discriminate based on race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, veteran status, or any other protected status in our hiring or employment practices.We are committed to providing reasonable accommodations to applicants with disabilities. If you need assistance or accommodation due to a disability during the application or interview process, please contact hrinfo@uvm.edu or (802) 656-3150Find our more about Accessibility and Accommodation at UVM"
