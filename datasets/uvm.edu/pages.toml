["https://www.uvm.edu/cals/ale/program/agroecology-major"]
title = "Agroecology Major | Agriculture, Landscape, and Environment | The University of Vermont"
description = "Agroecology (AGRO) is a degree that provides a foundation in the natural sciences with an emphasis on applying ecological principles to the production of horticulture or agronomic crops. Hands-on courses cover soils, plant pathology, entomology, and integrated farm management.The focus of this program on Agroecology as opposed to simply Agriculture is intentional. The AGRO curriculum includes many typical courses associated with traditional agriculture programs: plant science, introductory horticulture, soil science, entomology, plant pathology, etc. A focus on social, community, and environmental facets of agricultural production and its integration with livelihoods of farmers, farmworkers, consumers, and society is the differentiating component of our program from other institutions. Vermont is a unique living labratory of community-based agriculture and a long history of farm to plate advocacy. UVM with its Food Systems Research Institute and Agreocology Institute is uniquely positioned for students who want to study Agreocology with a focus on the future of farming and food systems.UVM's 97-acre Horticulture Research and Education Center which includes the Catamount Educational Farm gives the program a hands-on and applied focus with multiple opportunities for student to engage in research and get involved with pratical projects."
full_description = "Agroecology Major Type of Degree B.S. School or College College of Agriculture and Life Sciences Area of Study Environment and sustainability Program Format On-campus, Full-time Credit hours to graduate Agroecology core (76 credits) Agroecology integrates ecological principles with social and economic considerations. It focuses on creating landscapes and food systems that are both productive and sustainable, while also promoting the well-being of farmers and their communities. It grows our future. Program Overview Program Overview Agroecology (AGRO) is a degree that provides a foundation in the natural sciences with an emphasis on applying ecological principles to the production of horticulture or agronomic crops. Hands-on courses cover soils, plant pathology, entomology, and integrated farm management.The focus of this program on Agroecology as opposed to simply Agriculture is intentional. The AGRO curriculum includes many typical courses associated with traditional agriculture programs: plant science, introductory horticulture, soil science, entomology, plant pathology, etc. A focus on social, community, and environmental facets of agricultural production and its integration with livelihoods of farmers, farmworkers, consumers, and society is the differentiating component of our program from other institutions. Vermont is a unique living labratory of community-based agriculture and a long history of farm to plate advocacy. UVM with its Food Systems Research Institute and Agreocology Institute is uniquely positioned for students who want to study Agreocology with a focus on the future of farming and food systems.UVM's 97-acre Horticulture Research and Education Center which includes the Catamount Educational Farm gives the program a hands-on and applied focus with multiple opportunities for student to engage in research and get involved with pratical projects. Outcomes Outcomes Upon completion of the B.S. Agroecology Program, students will have skills to:• Effectively communicate clear and concise findings and interpretations of agricultural datasets, both in oral presentations and in written reports• Demonstrate a quantitative and qualitative science perspective applying critical thinking and problem-solving skills to a given problem or issue.• Be able to apply ecological principles to the production and management of horticultural and agronomic crops and have an understanding of plant/soil managed for food, feed, or fiber production.• Gain the ability to critically examine and understand the human dimensions of agriculture and food systems, including social, ethical, political and economic dimensions.The need for graduates trained in fields in agriculture, landscape, and environment is universal across local, state national, and international markets. Food is a universal need; we interact in human-built spaces that must integrate into a natural world, and the study and protection of that earth at a global and local level are paramount to our survival. The disciplines and topics covered across ALE programs have universal appeal and strong demand. Some examples include:• Farm managers are forecasted by the U.S. Bureau of Labor Statistics (BLS) to see a 5% decline in numbers over the next ten years, but increased application of technology and regulatory requirements will demand that more farm managers have increased education. Median annual pay for farmers, ranchers, and other agricultural managers in 2022 was $75,760, which is 40% above all occupations assessed by BLS.• The Vermont Farm to Plate (F2P) Strategic Plan predicts an increase of 5000 farm and food sector jobs in the state by 2030. This proposal supports F2P Priority Strategies to “support educational programs that strengthen the workforce pipeline” and “support and expand existing farm and food educational programming, and convene partners and conduct research to: identify the distinct audiences and goals for various initiatives; determine what types of programming, experiences, or information result in greater levels of behavioral change for those audiences and initiatives; and strategically coordinate efforts.” More More Some reasons to study agroecology:A Growing Field with Global Impact: Agroecology is gaining increasing recognition as a crucial tool in addressing global challenges such as climate change, food security, and poverty. By studying agroecology, you can become part of a growing movement that is transforming the way we produce and consume food.Hands-on Learning and Practical Skills: Our Agroecology program emphasizes hands-on learning experiences, allowing students to gain practical skills in areas such as sustainable farming practices, ecological design, and community food systems.Interdisciplinary Approach: Agroecology integrates knowledge from various scientific disciplines, including ecology, soil science, agricultural economics, and community development. This interdisciplinary approach provides a comprehensive understanding of the complex challenges and opportunities in food systems.Career Opportunities: The demand for skilled agroecologists is increasing worldwide. Graduates of agroecology programs can find employment in a variety of sectors, including sustainable agriculture, food policy, community development, and environmental education.A Passion for Sustainability: If you are passionate about creating a more sustainable and just world, agroecology offers a unique opportunity to make a real difference. By studying agroecology, you can develop the knowledge and skills to contribute to a food system that nourishes people and the planet.A supportive and collaborative learning environment: The UVM Agroecology program fosters a supportive and collaborative learning environment, where students can connect with like-minded individuals and develop strong relationships with faculty and mentors.If you are interested in making a positive impact on the world and creating a more sustainable future, studying agroecology could be an exciting and rewarding path for you."
year_published = 2025
