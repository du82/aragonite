["https://uvm.edu/cals/news/across-fence-celebrates-70-years"]
title = "Across the Fence Celebrates 70 Years"
description = '''Valentine's Day marks a special anniversary for the University of Vermont. Starting on Feb. 14, 1955, UVM Extension has produced "Across the Fence" a daily, noon-time television program. Today that program celebrates 70 years of broadcasting success.'''
full_description = '''Across the Fence Celebrates 70 Years Interview with Producer Keith Silva University News UVM Impact Share February 14, 2025 Valentine's Day marks a special anniversary for the University of Vermont. Starting on Feb. 14, 1955, UVM Extension has produced "Across the Fence" a daily, noon-time television program. Today that program celebrates 70 years of broadcasting success. Across the Fence highlights UVM's research and is an invaluable resource for farmers, gardeners, and everyday Vermonters. The show is the longest-running television show in Vermont. Launched soon after television came to Vermont, the show has been produced for seven decades by UVM Extension in a unique partnership with WCAX Channel 3. It airs weekdays after the noon-time news and weather. When Keith Silva graduated from Norwich University with a degree in communications, he was pleased to find a job in his field quickly. It was the mid-90s, and getting hired to work on a long-running UVM Extension television show seemed like a fortunate first job right out of college. The show had a small staff of only a few full-timers, and so he quickly became involved with nearly every aspect of the production. This provided him with a lot of on-the-job training and a chance to learn multiple aspects of what is required to produce a daily television show. He wrote, he edited, he shot video, and he loved it and so he stayed. Now, 30 years later, Silva was promoted last month to the role of the primary producer of Across the Fence. The future of the show that launched his career now rests on his shoulders. "I don't know if I would say I have a grand vision, but it's about bringing the outside in. It's about connecting people with their friends and neighbors. It's about the fulfillment of our Land Grant Mission and using the resources of the University to help Vermonters, to educate them, and to do the work of Extension." In this video, Keith Silva speaks about his approach to preserving the legacy of Vermont's longest-running television show. Watch the 70th Anniversary broadcast and prior Across the Fence episodes at Across the Fences' YouTube channel. Media Contact Keith Silva Producer Across the Fence, UVM Extension keith.silva@uvm.edu +1 802-656-4305'''
year_published = 2025
clearnet = "https://uvm.edu/cals/news/across-fence-celebrates-70-years"
