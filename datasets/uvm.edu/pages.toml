title = "Visit Options | Undergraduate Admissions | The University of Vermont"
description = "We can't wait to welcome you to UVM!"
full_description = "Visit Options We can't wait to welcome you to UVM! Visit In-Person or Virtually Guided Campus Tour Join us for an info session and student-guided walking tour of central campus. 360° Virtual Tour Explore our campus and get to know UVM wherever you are with this immersive virtual tour. Online Info Sessions Join us for a virtual information session and live Q&A with students. Admitted Students: Join Us on Campus! Admitted Student Visit Days are your chance to learn more about your major, take a tour, talk to current students about their UVM experience. Picture yourself at UVM! Register Now View Schedule Plan Your Visit Directions, Parking, and Lodging Campus Map Self-Guided Walking Tour About Burlington Burlington Cultural Resource Guide Tour Accessibility Admissions Welcome CenterOur Admissions Visit Experience Team is happy to assist you as you explore the University of Vermont and our admissions process. We have a Counselor on Duty available to assist with your questions. Pick up materials, learn about campus, and receive information regarding our admissions events and self-guided tour options. Walk-ins are welcome. HoursMonday through Friday, 8:00AM to 4:30PMSaturday hours varyClosed Sundays and select holidaysLocationThe Dudley H. Davis Center – 3rd floor590 Main Street, Burlington, VTLocated next to the information desk, across from the UVM BookstoreNote: When parking in the Admissions Parking Area, you will enter the Davis Center on the 3rd floor, where the Welcome Center is located.Other Visit OptionsAre you interested in scheduling a special visit to campus? Contact Sarah Fornaby at Sarah.Fornaby@uvm.edu with any questions. Individual VisitsDesigned for any prospective undergraduate student (in grades 10-12), or transfer student, who wants to learn more about a specific major or college/school. Please note individual visits mid-March to May are for admitted students only.→ Individual Visit InfoGroup VisitsGroup tours are available for high schools and organizations bringing 10 or more students. → Group Visit Request FormGroups can request both an Information Session & Campus Tour or they can request a campus tour only.Tours include our student center, several academic buildings, the library, campus housing, and dining facilities.The information session includes a presentation from one of our Admissions Counselors and a Q&A panel with current students.Questions can be sent to Sarah.Fornaby@uvm.eduSample Group Visit Schedule9:30-9:45 a.m. Arrive on Campus 9:50 a.m. Check-In with Admissions Staff 10:00 a.m.-12:00 p.m. Information Session & Campus Tour12:15-1:00 p.m. Lunch in a dining hall1:00 p.m. Depart Campus Email With a Cat→ Email your questions to a current UVM student For general admissions questions or if you need help scheduling a visit, contact us at admissions@uvm.edu or (802) 656-3370 The College Tour The College Tour’s Emmy-nominated and award-winning TV producers visited UVM to film 10 students who shared their stories about what it’s really like to be a Catamount. Watch Now Meet the Vermont Student Assistance CorporationVSAC, Vermont's nonprofit higher education agency, helps students of all ages save, plan and pay for college and career training. Explore VSAC"
