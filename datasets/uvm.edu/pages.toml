cense in all states, though the pathway may differ based on the state where you are seeking licensure. We will guide you through the process.Funding Your DegreeExplore generous financial assistance opportunities: UVM Financial Aid and ScholarshipsAdmissionsApply, Visit, or Request InformationContact UsReach out to our Student Services Office. We would love to hear from you!Email: cessstsv@uvm.eduCall: 802-656-3468Degree Requirements Success After Graduation 98% of graduates in the College of Education and Social Services were employed or continuing their education 6 months after graduating 94.5% of grads were satisfied or very satisfied with their full-time position. 98.5% of grads said their field of employment is somewhat or closely related to their career goals. Related Programs Music Education B.S.MS. College of Education and Social Services, College of Arts and Sciences program formatFormat: On-campus Credit hours to graduate120 credits Early Childhood Education (Birth-Grade 3) B.S.Ed. College of Education and Social Services program formatFormat: On-campus Credit hours to graduate120 credits Elementary Education (Grades K-6) B.S.Ed. College of Education and Social Services program formatFormat: On-campus Credit hours to graduate120 credits Middle Level Education (Grades 5-9) B.S.Ed. College of Education and Social Services program formatFormat: On-campus Credit hours to graduate120 credits Secondary Education (Grades 7-12) B.S.Ed. College of Education and Social Services program formatFormat: On-campus Credit hours to graduate120 credits Special Education (Birth-Age 21) B.S.Ed. College of Education and Social Services program formatFormat: On-campus Credit hours to graduate120 credits Individually Designed B.S.Ed. College of Education and Social Services program formatFormat: On-campus Credit hours to graduate120 credits'''
