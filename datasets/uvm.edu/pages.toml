["https://www.uvm.edu/cems/physics/program/minor-astronomy"]
title = "Minor in Astronomy | Physics | The University of Vermont"
description = 'The UVM physics department offers a wide variety of in-depth, qualitative and quantitative courses designed to intrigue students with the full sweep of astronomical knowledge. Students who choose an astronomy minor start with the Exploring the Cosmos course (ASTR 1400) and then choose from a selection of additional courses on the "Moons and Planets," "Big Bang," "Stars and Galaxies," "Spacecraft in Astronomy,” or more advanced courses such a "Modern Astrophysics," “Cosmology”, and “Relativity.”. Students with a pre-professional interest in astronomy usually pursue the astrophysics track within the physics major.Astronomy Minor in Physics'
full_description = 'Minor in Astronomy Type of Degree Undergraduate Minor School or College College of Engineering and Mathematical Sciences Area of Study Science, technology, engineering and mathematics Program Format On-campus, Full-time Apply Astronomy is a fascinating study for those with a strong interest in the universe, the amazing discoveries being made almost daily by modern astronomers, and the remarkable history of astronomy that goes back to the dawn of human civilization. Program Overview Program Overview The UVM physics department offers a wide variety of in-depth, qualitative and quantitative courses designed to intrigue students with the full sweep of astronomical knowledge. Students who choose an astronomy minor start with the Exploring the Cosmos course (ASTR 1400) and then choose from a selection of additional courses on the "Moons and Planets," "Big Bang," "Stars and Galaxies," "Spacecraft in Astronomy,” or more advanced courses such a "Modern Astrophysics," “Cosmology”, and “Relativity.”. Students with a pre-professional interest in astronomy usually pursue the astrophysics track within the physics major.Astronomy Minor in Physics Related Programs Physics B.A. College of Arts and Sciences program formatFormat: On-campus Credit hours to graduate30 credits in major courses, plus 3 credits in ancillary courses Physics B.S. College of Engineering and Mathematical Sciences program formatFormat: On-campus'
