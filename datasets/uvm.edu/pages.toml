description = "The objective of our Accelerated Master's Program (AMP) in Biochemistry is to provide students both a theoretical and practical knowledge of fundamental biochemical concepts while preparing students for careers in research (academic or industrial) or increasing their competitiveness for additional graduate degrees.Our AMP in Biochemistry is only available to UVM students who have:A minimum cumulative grade point average of 3.2Satisfactory completion of BIOC 3005 & BIOC 3006 before acceptance into the programCompletion of the Graduate College Application formAgreement of a UVM Biochemistry faculty member to serve as AMP advisor (this faculty member should also write one of the three recommendation letters in support of the student's application to the Graduate College).It is anticipated that students will apply for acceptance into the program in the Spring of their Junior year or Fall of their Senior year. Application instructions can be found here."
