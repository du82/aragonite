title = "Art Education B.S. | Department of Education | The University of Vermont"
description = '''Combine your passions to become an accomplished artist and educator. Study and engage in professional art education, studio art, art history, and electives in related subjects. Class sizes are typically small and geared toward individual attention and group interaction. Activate Your Learning in a Vibrant CommunityConnect your learning and refine your skills through community-engaged experiences in a variety of settings. The greater Burlington community is a culturally-rich ecosystem to build your talents and professional relationships in the arts. Experience is the backbone of a strong program. After engaging in multiple practicums, the culminating experience is a full-time student teaching internship in a local school, accompanied by a seminar course to compile your teaching licensure portfolio. Commitment to Your SuccessYour success is our highest priority. Throughout your time with us, you will enjoy ongoing mentoring and support from your advisor, award-winning faculty, staff, and our student services team. You will also develop close and enduring connections with classmates in your cohort and mentors in the field.  "The power of art to change the world lies in its power to change individual lives. It allows us to see others’ perspectives – their unique worlds – in ways common sentences often cannot." – Clemmons Family Farm Arts Learning Advisor Kia'Rae Hanron '20National Accreditation and Teaching Licensure Our graduates find career success in Vermont and around the country. UVM's nationally accredited teacher education programs lead to an endorsement for Vermont licensure that can be used to acquire a license in all states, though the pathway may differ based on the state where you are seeking licensure. We will guide you through the process.Funding Your DegreeExplore generous financial assistance opportunities: UVM Financial Aid and ScholarshipsAdmissionsApply, Visit, or Request InformationContact UsReach out to our Student Services Office. We would love to hear from you!Email: cessstsv@uvm.eduCall: 802-656-3468Degree Requirements'''
