title = "Applied Design Minor | Community Development and Applied Economics | The University of Vermont"
description = "The applied design minor offers the hands-on experience needed to visually communicate a wide range of ideas and information on digital or print media. This minor enhances any student's ability to visually express themselves or results of their work to a desired audience. In addition to becoming proficient in software applications used in design, students participating in this minor learn design strategy and apply their knowledge to real-world projects, campaigns, or organizations.This minor requires 15 credits of coursework in visual communication, design, and digital illustration."
full_description = "Applied Design Minor Type of Degree Undergraduate Minor School or College College of Agriculture and Life Sciences Program Format On-campus, Full-time Program Overview Program Overview The applied design minor offers the hands-on experience needed to visually communicate a wide range of ideas and information on digital or print media. This minor enhances any student's ability to visually express themselves or results of their work to a desired audience. In addition to becoming proficient in software applications used in design, students participating in this minor learn design strategy and apply their knowledge to real-world projects, campaigns, or organizations.This minor requires 15 credits of coursework in visual communication, design, and digital illustration. Curriculum Curriculum View in the Applied Design minor requirements in the UVM catalogue. Restrictions RestrictionsIneligible Majors: Public Communication majors with Communication Design concentration, Community Centered Design majors with an Applied Design Track.More InformationPlease contact the Department of Community Development and Applied Economics' Student Success Team with questions. An advisor can review the Applied Design Minor Program requirements with you and answer your questions.The Community Development and Applied Economics' Student Success Team205 Morrill HallCDAE@uvm.edu"
