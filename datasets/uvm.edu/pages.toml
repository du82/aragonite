["https://www.uvm.edu/ccp/biochemistry-program/program/biochemistry-bs"]
title = "Biochemistry B.S. | Biochemistry Program | The University of Vermont"
description = "Chemistry is often referred to as the “central science” because it ties together the physical, life, and applied sciences. Biochemists study the molecular interactions that guide many processes involved in living organisms. This involves exploring the underlying chemical and physical properties of these organisms, from metabolism and enzyme kinetics to gene transfection and cellular signaling. With recent discoveries describing the molecular basis of life, tremendous opportunities await those students with the right background and training in this field.Biochemistry at UVM is a cross-college program, meaning students can pursue the major as part of UVM's College of Agriculture and Life Sciences (CALS) or College of Arts and Sciences (CAS). By virtue of its interdisciplinary nature, the undergraduate biochemistry program is a collaborative endeavor that brings together the combined expertise of the Biochemistry, Chemistry, and Microbiology and Molecular Genetics departments.The major requirements for the Biochemistry B.S. are the same regardless of college. However, in addition to courses required for completion of a major, each college has its own requirements to ensure graduates have received a well-rounded education. See the requirements of each college below."
full_description = "Biochemistry B.S. Type of Degree B.S. School or College College of Arts and Sciences College of Agriculture and Life Sciences Area of Study Science, technology, engineering and mathematics Program Format On-campus, Full-time Apply Program Overview Program Overview Chemistry is often referred to as the “central science” because it ties together the physical, life, and applied sciences. Biochemists study the molecular interactions that guide many processes involved in living organisms. This involves exploring the underlying chemical and physical properties of these organisms, from metabolism and enzyme kinetics to gene transfection and cellular signaling. With recent discoveries describing the molecular basis of life, tremendous opportunities await those students with the right background and training in this field.Biochemistry at UVM is a cross-college program, meaning students can pursue the major as part of UVM's College of Agriculture and Life Sciences (CALS) or College of Arts and Sciences (CAS). By virtue of its interdisciplinary nature, the undergraduate biochemistry program is a collaborative endeavor that brings together the combined expertise of the Biochemistry, Chemistry, and Microbiology and Molecular Genetics departments.The major requirements for the Biochemistry B.S. are the same regardless of college. However, in addition to courses required for completion of a major, each college has its own requirements to ensure graduates have received a well-rounded education. See the requirements of each college below. Curriculum Curriculum From UVM Catalogue:Biochemistry B.S. Major Requirements Outcomes Outcomes Learning Goals for the Undergraduate Bachelor of Science Degree in Biochemistry.Students will:Demonstrate general knowledge in biochemistry, chemistry, and biology and will be able to apply principles from these disciplines in the solution of qualitative and quantitative biochemical problems.Understand the interplay of observational data, hypotheses, and hypothesis-driven experimentation through application of the scientific method.Become proficient in biochemical laboratory techniques and be able to apply these to practical and current problems in research.Be able to read and critically evaluate biochemical and biochemistry-related literature.Learn to present scientific data clearly and effectively through both written and verbal communication.CareersAnalytical chemistBiomedical scientistBiotechnologistEducatorForensic scientistLaboratory technicianNanotechnologistPharmaceutical chemistPhysicianResearch scientistToxicologistUniversity professorWhere alumni workFred Hutchinson Cancer Research CenterGreen Mountain AntibodiesUMass Medical SchoolUS Department of Energy, Joint Genome InstituteGraduate SchoolsUniversity of Pittsburgh Medical College, Ophthalmic SurgeryUC Santa Cruz Scientific Communication ProgramUC Davis Veterinary SchoolUniversity of Vermont Medical CollegeBoston University College of DentistryHarvard University Medical College, Molecular PharmacologyHarvard University, Biological and Biomedical SciencesCornell University, Biochemistry More More Beyond the classroomMany biochemistry majors get involved in undergraduate research or pre-health experiential learning opportunities. Explore your options! Talk to your advisor!” Related Programs Biochemistry Undergraduate Minor College of Arts and Sciences, College of Agriculture and Life Sciences program formatFormat: On-campus Biochemistry M.S. program formatFormat: On-campus Biochemistry Accelerated Entry into Master's Program program formatFormat: On-campus"
