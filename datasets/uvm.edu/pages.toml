["https://www.uvm.edu/admissions/undergraduate/undergraduate-research"]
title = "Undergraduate Research | Undergraduate Admissions | The University of Vermont"
description = "At UVM, there are always opportunities to do groundbreaking research that helps humankind–as early as your first year. As one of the top 100 public research institutions in the U.S., UVM offers you the chance to actively engage in original research that impacts your community and the world."
full_description = "Undergraduate Research Start answering the world's questions. At UVM, there are always opportunities to do groundbreaking research that helps humankind–as early as your first year. As one of the top 100 public research institutions in the U.S., UVM offers you the chance to actively engage in original research that impacts your community and the world. Endless Discoveries are Waiting to Be Made With mentorship from world-class faculty and support from the Office of Fellowships, Opportunities, & Undergraduate Research (FOUR), your work as an undergrad can earn you a nationally competitive scholarship or fellowship. Explore the FOUR office R1 Top Tier Research University (Carnegie classification) Top 100 Public Research University (National Science Foundation) $300K+ research funding for undergraduates Real Experiences that Spark Passions Chasing a Mystery of Immunity Through the Vermont Center for Immunobiology and Infectious Disease, Remi Savard is helping unpack the biology of how our immune systems fight off a flu infection. The study he’s working on could give medical researchers a new way of understanding human infections and how to help our immune systems. Taking the Summer by Storm(water) As part of the Lake Champlain Sea Grant Scholars Program, civil engineering major Olivia Szumski spent the summer interning with UVM’s Salt Mitigation Task Force, taking water samples and examining them in one of the campus’s state-of-the-art labs. On the Hunt for Avian Malaria Parasites Through a UVM Summer Undergraduate Research Fellowship, Matt Heilbronn is studying how changes in land use have influenced the spillover of avian malaria parasites in the house sparrow. The goal? Understand how to better predict future disease outbreaks. Research Opportunities in UVM’s Schools and Colleges No matter your academic area of interest, research is happening everywhere –and you can be a part of it. College of Engineering and Mathematical Sciences College of Education and Social Services College of Arts and Sciences College of Agriculture and Life Sciences College of Nursing and Health Sciences Rubenstein School of Environment and Natural Resources Grossman School of Business"
