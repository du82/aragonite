["https://www.uvm.edu/business/program/minor-accounting"]
title = "Minor in Accounting | Grossman School of Business | The University of Vermont"
description = "Why Pursue a Minor in Accounting?An accounting background is useful for many career paths. Most obvious are jobs directly related to accounting and finance. However, people in many other careers and in a variety of settings - corporate, small business, or not-for-profit organizations - find an understanding of accounting useful. Due to recent changes in the CPA licensure process, many students are opting to stay at UVM to earn the Masters in Accountancy degree (MAcc). Additional questions regarding the MAcc can be directed to any member of the Accounting faculty.Apply for a Minor in AccountingFirst, check with your Dean's Office to determine if the minor in Accounting is accepted by your School or College and will be possible within your remaining degree requirements. Once you have the prerequisites, complete the Minor Application Form (requires login)."
full_description = "Minor in Accounting Type of Degree Undergraduate Minor School or College Grossman School of Business Area of Study Business and economy Program Format On-campus, Full-time, Part-time Credit hours to graduate 15 credits The University of Vermont Grossman School of Business offers two minors. For the minor in Accounting, students must earn at least a 2.00 cumulative GPA in the Accounting Courses. Program Overview Program Overview Why Pursue a Minor in Accounting?An accounting background is useful for many career paths. Most obvious are jobs directly related to accounting and finance. However, people in many other careers and in a variety of settings - corporate, small business, or not-for-profit organizations - find an understanding of accounting useful. Due to recent changes in the CPA licensure process, many students are opting to stay at UVM to earn the Masters in Accountancy degree (MAcc). Additional questions regarding the MAcc can be directed to any member of the Accounting faculty.Apply for a Minor in AccountingFirst, check with your Dean's Office to determine if the minor in Accounting is accepted by your School or College and will be possible within your remaining degree requirements. Once you have the prerequisites, complete the Minor Application Form (requires login). Curriculum Curriculum Catalog years 2018/2019 - 2022/20233 Required CoursesThe following 3 courses are required and must be completed with a grade C- or higher:BUS 1610- Financial AccountingBUS 2620- Managerial Accounting,BUS 3610 - Corporate Financial Reporting 12 Additional Upper-Level Accounting CoursesPlease see the catalogue for Additional Upper-Level Accounting Course Choices and Minor Rules/Restrictions.Catalog years 2023/20243 Required CoursesThe following 3 courses are required and must be completed with a grade C- or higher:BUS 1610- Financial AccountingBUS 2620- Managerial Accounting,BUS 3610 - Corporate Financial Reporting 12 Additional Upper-Level Accounting CoursesPlease see the catalogue for Additional Upper-Level Accounting Course Choices and Minor Rules/Restrictions. Admissions Admissions Prerequisites for catalog years 2018/2019 - 2022/2023Two prerequisite/co-requisites courses completed with an overall 2.00 GPA or higher and no grade lower than a C-:EC 1400 – Macroeconomics or EC 1450 – MicroeconomicsMATH 1212 or 1234 – Calculus or STAT 1410 – Statistics**For students whose majors require a Statistics course, the following courses are approved as substitutes for STAT 1410: EC 170, NR 2400, PSYS 2002, (formerly PSYS 053) & PSYS 2010 (formerly PSYC 054), STAT 2430Prerequisites for catalog years 2023/2024One prerequisite course completed with an overall 2.00 GPA or higher and no grade lower than a C-:EC 1400 – Macroeconomics or EC 1450 – MicroeconomicsComputer CompetencyStudents are presumed to have basic computer literacy, including a working knowledge of word processing and spreadsheet software. Students lacking this basic knowledge are responsible for attaining it through course work, self-study, tutorials or workshops.Business Administration and Accounting minors are charged a $75/semester Business School Technology fee. This fee covers installation of Microsoft products on your computer (including Windows & Office Professional), 24/7 access to our Computer Labs in Kalkin, free printing, and software & hardware support in Kalkin 234. Outcomes Outcomes Students Interested in the Master of Accountancy (MAcc) DegreeStudents interested in pursuing their CPA and enrollment in the Master of Accountancy degree (MAcc) are required to complete BUS 3611, as one of the upper-level Accounting minor courses. More More A minor in Accounting is one of two business minors available at UVM (the other minor is Business Administration). Please contact the Grossman School of Business Center for Student Success with questions. An advisor can review the Accounting Minor Program with you and answer your questions.The Grossman School of Business Center for Student Success100 Kalkin Hallgsbcss@uvm.edu, (802) 656-4015 Related Programs Accountancy M.Acc. Grossman School of Business program formatFormat: On-campus, Hybrid Credit hours to graduate30 credits, 10 courses"
