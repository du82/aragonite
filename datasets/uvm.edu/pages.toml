["https://uvm.edu/uvmnews/news/university-vermont-army-rotc-best-program-northeast"]
title = "University of Vermont Army ROTC Best Program in the Northeast"
full_description = "show the image caption close caption UVM ROTC students on their way to class. Credit: Bear Cieri/UVM. University of Vermont Army ROTC Best Program in the Northeast Share February 25, 2025 The University of Vermont’s Army Reserve Officer Training Corps (ROTC) program has won the 2023-2024 General Douglas MacArthur Award for Leadership.This is the third time UVM ROTC has won the MacArthur Award in the last ten years.“This is a great honor for this program and our cadets,” said Lt. Col. Travis McCracken, Professor of Military Science, University of Vermont ROTC. “They are exceptional young adults that will undoubtedly go on to achieve great success in the U.S. Army,” said McCracken.The award is given to the best ROTC program in the Northeast region of the U.S. Army Cadet Command (USACC). USACC is comprised of nine separate regions consisting of 275 host programs across the country. The Northeast consists of 42 host universities which include all Ivy League schools and other elite universities.“I’m so proud of these cadets. They work tirelessly to perfect their craft as Army leaders,” said Master Sgt. Aaron Peters, Senior Military Science Instructor, UVM ROTC. “They will be Second Lieutenants soon enough, and I’m proud to say that we have some of the best,” said Peters.Selection for the award is based on achievement of the school’s commissioning mission, Cadet grade-point average, standing on the command’s National Order of Merit List, Cadets’ retention rates, Ranger Challenge competitions, Army training and fitness, as well as the Brigade Commander’s assessment and evaluation of the overall program. UVM ROTC is now a finalist among the other eight regional winners for the best program in the United States.“The University of Vermont is thrilled to see the continued excellence of our ROTC program be recognized. The consistent commitment of our ROTC program to the success of our students is evident in the work ethic they model, the personal discipline they cultivate, the leadership development they offer and the caring community they provide for our students. I could not be prouder!” Interim President Patricia Prelock stated.Col. Allen Kehoe, 2nd Brigade Commander, U.S. Army Cadet Command, will present the award to University of Vermont Interim President, Patricia Prelock. The ceremony will be held on Thursday, April 3rd at 10:00 a.m. at the University of Vermont’s Alumni House, Silver Pavillion, 61 Summit Street, Burlington. RSVPs are not required but appreciated. To RSVP, please contact Valerie Pallotta at Valerie.Pallotta@uvm.edu."
year_published = 2025
