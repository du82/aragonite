["https://www.uvm.edu/aaeo/americans-disabilities-act-ada-and-reasonable-accommodations-employees"]
title = "Americans with Disabilities Act and Reasonable Accommodations | Equal Opportunity | The University of Vermont"
description = "UVM is committed to providing a workplace that is free from unlawful discrimination and is accessible to all individuals in conformity with state and federal laws and an educational atmosphere and experience that is accessible to all qualified students, including students with disabilities."
full_description = "Americans with Disabilities Act and Reasonable Accommodations UVM is committed to providing a workplace that is free from unlawful discrimination and is accessible to all individuals in conformity with state and federal laws and an educational atmosphere and experience that is accessible to all qualified students, including students with disabilities. Reporting ADA Barriers Body The University of Vermont is committed to maintaining an accessible and welcoming environment for individuals with disabilities. The Office of Accessibility Services is available to review concerns about accessibility barriers. Your feedback is critical to helping the University achieve its goal of seamless access.If you have comments, concerns, or complaints about any experience with accessibility at the University, please complete the Accessibility Feedback and Barrier Report Form. The Office of Accessibility Services will review and respond to reports. If there is a grounds, custodial, or facilities barrier that needs immediate attention, contact SOS in Physical Plant at sos@uvm.edu or (802) 656-2560.If there is a facilities barrier in a Residence Hall that needs immediate attention, alert the front desk staff. If it is after 4:30 pm, alert a member of the Residence Education Team. Frequently Asked Questions What is the ADA? Body This federal law prohibits discrimination on the basis of disability in employment, public services, places of public accommodation, and in telecommunications. Who is Protected Under the ADA? Body To receive protection under the ADA, an individual has to meet the legal definition of being a person with a disability.The ADA defines disability as having a substantial physical or mental impairment that significantly impacts a major life activity, having a record of such impairment, or being regarded as an individual who has such an impairment. This can include temporary conditions, if they are significant enough to limit a major life activity.In order to receive protections under the ADA in employment or the classroom, a person must also be a Qualified Individual.A Qualified Individual is someone who has the required background and can perform the essential functions and meet technical standards, with or without reasonable accommodations. What Are UVM's Procedures for Requesting Accommodations? Body Procedure for Employees and Applicants for EmploymentEmployees are encouraged to email contact the ADA/504 Coordinator at Access@uvm.edu or call (802) 656-7753 to inquire about reasonable accommodations. See the Procedural Guidelines for Disability Accommodation for Employees and Applicants for Employment for more details. As of January 2, 2025, the Office of Accessibility Services is assisting with employment accommodations. Procedure for StudentsPlease see university operating procedure for Disability Certification, Accommodation and Support -Students. You may also contact the Office of Accessibility Services via access@uvm.edu or call 802-656-7753 to learn about the procedure for requesting academic and residential accommodations. What should I do if I have concerns about discrimination or bias based on disability? Body The Office of Equal Opportunity is available to provide information and support services to employees who have concerns about discrimination, harassment, or bias involving disability- this includes concerns about reasonable accommodations. Please contact EqualOpportunity@uvm.edu or complete an online reporting form and a staff person will contact you."
year_published = 2025
