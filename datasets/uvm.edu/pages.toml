["https://www.uvm.edu/cas/anthropology/program/anthropology-minor"]
title = "Anthropology Minor | Department of Anthropology | The University of Vermont"
description = "The anthropology minor, like the major program, offers you multiple options to gain a strong grounding in a particular facet of the discipline, without fulfilling the full range of requirements of the major. The minor requires introductory courses from two subfields, to ensure some exposure to more than one subfield. Students will then take electives from their preferred subfield, or from the two subfields represented in the introductory courses they took. An anthropology minor is complementary to many related majors in the College of Arts and Sciences, including history, economics, geography, global studies, religion, and psychology."
full_description = "Anthropology Minor Type of Degree Undergraduate Minor School or College College of Arts and Sciences Area of Study Arts, humanities, social sciences Program Format On-campus, Full-time Credit hours to graduate 18 Program Overview Program Overview The anthropology minor, like the major program, offers you multiple options to gain a strong grounding in a particular facet of the discipline, without fulfilling the full range of requirements of the major. The minor requires introductory courses from two subfields, to ensure some exposure to more than one subfield. Students will then take electives from their preferred subfield, or from the two subfields represented in the introductory courses they took. An anthropology minor is complementary to many related majors in the College of Arts and Sciences, including history, economics, geography, global studies, religion, and psychology. Curriculum Curriculum From UVM Catalogue:Anthropology Minor Requirements Related Programs Anthropology B.A. College of Arts and Sciences program formatFormat: On-campus Anthropology B.S. College of Arts and Sciences program formatFormat: On-campus"
