title = "Undergraduate Admissions | The University of Vermont"
description = "Your journey at the University of Vermont will be unique, tailored to meet your academic, professional, and personal goals. At UVM, you’ll join the ranks of people in every field with the courage, vision, global mindset, and ambition to effect lasting change."
full_description = "Undergraduate Admissions Doing all things with purpose, for people and planet. Your journey at the University of Vermont will be unique, tailored to meet your academic, professional, and personal goals. At UVM, you’ll join the ranks of people in every field with the courage, vision, global mindset, and ambition to effect lasting change. Visit Register for a campus visit or explore our virtual tour. Apply Find out when and how you should apply to UVM. Request Info Stay connected to UVM by joining our mailing list. Academic Experiences, Tailored to Your Path The resources, partnerships, and network of a top-100 research university are yours to tap. With over 100 majors, our fields of study are broad and the intellectual pools are deep. Choose an Area of Study Explore Research Opportunities Our Commitment to Affordability and Access For four consecutive years, UVM's tuition remained the same. For Vermonters, tuition rates have not increased for five years. Our Student Financial Services team is committed to working with families to minimize student debt. Costs and Financial Aid See Yourself Here Picture yourself at UVM, whether on-campus or online. Schedule a campus visit or explore our virtual tour. Visit Options Your UVM Experience Housing and Dining Discover the communities where you'll live, learn, share meals and make lifelong friends. Student Activities From sports and recreation to clubs and organizations, find your people and your passion. Living in Burlington Learn more about everything America's #1 college town has to offer. Video Spotlights Watch Our Stories Ready for Take Off From India to Vermont The Business of Saying Yes Engineering Opportunity Brewing Success The Art of Entrepreneurship Launch Experience"
