["https://www.uvm.edu/cals/asci/program/animal-sciences"]
title = "Animal Sciences | Animal and Veterinary Sciences | The University of Vermont"
description = "Why Animal Science? Animal science students gain perspective on the interconnections between animal, environmental and human health. They work directly with faculty to address real-world challenges—from supporting sustainable food animal production to improving animal health and wellbeing through nutrition, management and disease prevention. We offer a science-based curriculum with customized programs of study aligned with student interests. Popular concentrations include: Pre-veterinary/Pre-professional Science; Zoo, Exotic and Companion Animals; Equine Science; Dairy Science/Management."
full_description = "Animal Sciences Type of Degree B.S., Undergraduate Minor School or College College of Agriculture and Life Sciences Program Format On-campus, Full-time Credit hours to graduate 120 Animal and Veterinary Science is the area of biology that deals with dairy, equine, zoos, exotics and companion animals. Program Overview Program Overview Why Animal Science? Animal science students gain perspective on the interconnections between animal, environmental and human health. They work directly with faculty to address real-world challenges—from supporting sustainable food animal production to improving animal health and wellbeing through nutrition, management and disease prevention. We offer a science-based curriculum with customized programs of study aligned with student interests. Popular concentrations include: Pre-veterinary/Pre-professional Science; Zoo, Exotic and Companion Animals; Equine Science; Dairy Science/Management. Concentrations Concentrations Focus AreasPre-Veterinary/Pre-ProfessionalStudents with this focus area will concentrate on courses relating to the feeding, breeding, health and management of dairy cattle, and also financial and small business management.Zoos, Exotics, and Companion AnimalsThis focus area is designed for students who are primarily interested in zoo, exotic, and companion animals and are interested in transitioning to jobs in these industries after graduation. Learn about studying zoo, exotic and companion animals.Equine ScienceThis focus offers specialized courses on the care, management, breeding, and health of horses. Our goal is to provide students with the mix of science, business and personal skills to succeed with careers in the equine industry. Learn about studying equine science.Dairy ProductionStudents selecting this focus area will concentrate on courses relating to the feeding, breeding, health and management of dairy cattle, and also financial and small business management.All focus areas concentrate on:Science-based curriculum: Program of study includes animal biology, nutrition, genetics, animal health, biology, chemistry, and math, coupled with a liberal education.Undergraduate research and internships: Research opportunities are abundant and students can pursue or develop internships related to animal and veterinary sciences.Hands-on experience: UVM facilities are poised to provide a combination of classroom, barn, and laboratory time.Positive and friendly environment: Students are nurtured to maximize achievements and place themselves in a favorable position for subsequent career development. Curriculum Curriculum Popular CoursesClin Top: Companion Animal MedClin Topics: Livestock MedicineCompanion Animal Care & MgmtZoos Exotics & Endangered SpeciesAdv Top:Zoo,Exotic,Endang SpecDog Training and BehaviorCREAMIntro to the HorseEQUUSHorse Barn Co-opMinorsAnimal and Veterinary Science Minor (UVM Catalogue) Admissions Admissions Animal and Veterinary Sciences B.S. requirements (UVM Catalogue) Outcomes Outcomes Learning OutcomesDemonstrate understanding of animal nutrition, anatomy, physiology, genetics, welfare, reproduction, and health. Apply understanding of animal nutrition, anatomy, physiology, genetics, welfare, reproduction, and health to address challenges in animal care, management, and industries. Effectively explain scientific information about animal science to different audiences through written, oral, and digital means. Recognize and respect diverse cultures and perspectives in regional and global animal systems. CareersAnimal nutritionistBarn ManagerVeterinarianResearchers, lab techniciansEducatorsGamekeepersAnimal trainersEmbryologistGeneticistMeat scientistLawyerMolecular biologistMarine biologistRegulatory affairs specialistScience/technical writerWhere do Alumni work?San Diego Zoo - Senior Zoo KeeperWhite Oak Plantation - Senior ConservationistUniversity of Tennessee - Veterinary Surgeon (Resident in Equine Surgery)San Francisco Bay Bird Observatory - EcologistU.S. Department of AgricultureVermont Department of HealthNational Institute of HealthUnited States Forest ServiceEquine Stable & Tack - ManagerSouthwestern College - Professor and Wild Life BiologistGraduate SchoolsCornell UniversityUniversity of PennsylvaniaTufts UniversityU.C. DavisUniversity of VermontUniversity of WashingtonColorado State UniversityVermont Law School Save on the time and cost of earning an advanced degreeAnimal Science AMP Explore the Path More More What is outstanding about Animal and Veterinary Science at UVM?When studying this discipline at UVM students, with assistance from faculty advisors, develop individualized programs in one of four focus areas that each lead to a B.S. degree. These programs apply to farms, laboratories, zoos, and companion animals; their interaction with human society; and the contribution of animal products, such as milk and meat, to the world food supply.Animal and Veterinary Science is the area of biology that deals with dairy, equine, zoos, exotics and companion animals.UVM Animal and Veterinary Science majors receive a hands-on experience that shapes them to be job-ready at graduation.Beyond the ClassroomClubs and Programs"
