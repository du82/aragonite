["https://www.uvm.edu/business/program/accelerated-macc"]
title = "Accelerated MAcc | Grossman School of Business | The University of Vermont"
description = "The Master of Accountancy provides a means of entry into the public accounting profession and for positions in corporate, government and not-for-profit organizations.  Qualified undergraduate students who plan to earn the Master of Accountancy (M.Acc.) degree may enroll in the Accelerated Master’s Program which enables UVM students to begin working on their master’s degree requirements during their undergraduate study.For current UVM accounting students ONLY."
full_description = "Accelerated MAcc Type of Degree Accelerated Entry into Master's Program School or College Grossman School of Business Area of Study Business and economy Program Format On-campus, Full-time Credit hours to graduate 30 credits, 10 courses Program Overview Program Overview The Master of Accountancy provides a means of entry into the public accounting profession and for positions in corporate, government and not-for-profit organizations. Qualified undergraduate students who plan to earn the Master of Accountancy (M.Acc.) degree may enroll in the Accelerated Master’s Program which enables UVM students to begin working on their master’s degree requirements during their undergraduate study.For current UVM accounting students ONLY. Curriculum Curriculum The accelerated MAcc program allows you to take up to 9 credit hours of MAcc classes while completing an undergraduate degree. To take advantage of this program, work with the MAcc Director to design a program that fulfills all undergraduate requirements (120 hours of undergraduate coursework, and the completion of the Grossman School and concentration requirements) and allows you to add an additional three to nine hours of graduate courses during your senior year. Students pursuing this option will graduate with their BSBA having earned from 123 to 129 credit hours. The graduate credit hours earned as an undergraduate student will appear on both the undergraduate and graduate transcripts. Deadlines Deadlines We recommend you apply by October 15 to be accepted for the spring semester or March 15 to be accepted for the fall semester. Admissions Admissions You can only be part of the accelerated MAcc program if you apply and are accepted into the program. Application ProcessTalk with the MAcc Director Suzanne Lowensohn to ensure you meet the accelerated MAcc requirements and fill out the Permission for Accelerated Entry into Master's Degree form.Ask three faculty members to complete recommendation forms for you. You must have taken at least one 3000-level accounting or finance course with one of the professors.Complete the MAcc application, indicating accelerated MAcc.When registering for senior year spring courses, inform the Graduate Program Coordinator of the course numbers being taken for graduate credit."
year_published = 2025
clearnet = "https://www.uvm.edu/business/program/accelerated-macc"
