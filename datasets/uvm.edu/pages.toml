["https://www.uvm.edu/cas/anthropology/program/bs-major-anthropology"]
title = "B.S. With a Major in Anthropology | Department of Anthropology | The University of Vermont"
description = "Studying anthropology can offer you valuable insights into different cultures, societies, and human behaviors. It helps you develop critical thinking skills, cultural awareness, and a deeper understanding of our shared humanity. Whether you're interested in history, archaeology, or sociology, anthropology provides a unique perspective on the world around us.The Bachelor of Science in Anthropology emphasizes scientific and quantitative approaches to the anthropological study of human diversity and change. It provides advanced training for undergraduates who are interested in careers in archaeology, forensics, health services, or similar fields that rely on scientific methods to analyze human biological and cultural diversity. The degree emphasizes analytical training, including laboratory analysis and field research, quantitative methods, and advanced coursework on data collection, management, and interpretation."
full_description = "B.S. With a Major in Anthropology Type of Degree B.S. School or College College of Arts and Sciences Area of Study Arts, humanities, social sciences Program Format On-campus, Full-time Apply Program Overview Program Overview Studying anthropology can offer you valuable insights into different cultures, societies, and human behaviors. It helps you develop critical thinking skills, cultural awareness, and a deeper understanding of our shared humanity. Whether you're interested in history, archaeology, or sociology, anthropology provides a unique perspective on the world around us.The Bachelor of Science in Anthropology emphasizes scientific and quantitative approaches to the anthropological study of human diversity and change. It provides advanced training for undergraduates who are interested in careers in archaeology, forensics, health services, or similar fields that rely on scientific methods to analyze human biological and cultural diversity. The degree emphasizes analytical training, including laboratory analysis and field research, quantitative methods, and advanced coursework on data collection, management, and interpretation. Curriculum Curriculum From UVM Catalogue:Major Requirements for a B.S. In Anthropology Outcomes Outcomes Upon completion of the BS degree, students will be able to:Provide an anthropological definition of culture and give examples of how culture shapes human life in diverse ways.Distinguish the ways in which anthropologists examine and analyze human diversity across time and space.Recognize how the four subfields of anthropology (cultural, linguistic, biological, archaeological) differ in focus, methodologies, and conceptual approaches.Demonstrate how an anthropological approach can be applied to a range of complex social issues in diverse settings. Recognize ethical dilemmas in anthropology and ethical principles in research and other practice.Develop and communicate anthropological research questions, access and analyze scholarly literature, and outline appropriate research methods and approaches. Employ scientific methodologies to conduct research on anthropological problems across each of the subfields.Careers With a B.S. In Anthropology Anthropology Cultural Resource Management Regulatory Archaeology Education Forensics Health (international/public health) International Development Research Where Our B.S. Alumni Work Contract archaeology firms Cities and municipalities Law enforcement Colleges and universities Elementary and secondary schools Hospitals and health care centers Museums and libraries Research Institutes Related Programs Anthropology B.A. College of Arts and Sciences program formatFormat: On-campus Anthropology Undergraduate Minor College of Arts and Sciences program formatFormat: On-campus Credit hours to graduate18"
