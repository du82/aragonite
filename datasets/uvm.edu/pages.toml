m. Admissions Admissions Full Certificate ProgramMicro Certificate ProgramProfessional Learning Related Programs Food Systems Ph.D. program formatFormat: On-campus Credit hours to graduate75 Food Systems Accelerated Entry into Master's Program College of Agriculture and Life Sciences program formatFormat: On-campus Credit hours to graduate31 Community Development and Applied Economics M.S., Accelerated Entry into Master's Program College of Agriculture and Life Sciences program formatFormat: On-campus Credit hours to graduate36 Plant and Soil Science M.S., Ph.D. College of Agriculture and Life Sciences program formatFormat: On-campus Transdisciplinary Leadership and Creativity for Sustainability Ph.D. Rubenstein School of Environment and Natural Resources program formatFormat: Online Credit hours to graduate75"
