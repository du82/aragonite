title = "Agroecology / Ecological Landscape Planning and Design | Agriculture, Landscape, and Environment | The University of Vermont"
description = "Choosing between our majorsAgroecology integrates environmental science, ecology and communities to grow food in a way that sustains people and the planet. It is a science of collaboration involving working with people wherever agriculture, conservation, and policymaking converge.Ecological Landscape Planning and Design is an art and a science that supports both natural ecosystems and human livelihoods. Landscape designers create multifunctional and sustainable landscapes to improve environmental and social systems across urban to rural settings.Grounded in agricultural and horticultural sciences, each of our curriculums teaches students how to help transform current agri-food and land management systems with the use of ecologically sound and socially just methods.Both bachelors degrees are offered through the Department of Agriculture, Landscape and Environment.Our flexible major offers two  pathways to your career goals. In both majors our students gain an understanding of ecological systems through hands-on coursework, research, internships and engaging with local and global communities.Agroecology MajorChoose Agroecology if your goals are to understand the connections between food production and the environment, work within the farming community, address food insecurity, improve production methods or provide education to communities.Ecological Landscape Planning and Design Major Choose Landscape Design if your goals are to understand multifunctional landscapes, learn conservation methods for land and water resources or provide education to communities.Our programs bring science-based ecological practices to traditional agriculture and land management systems.Growing a Sustainable FutureUVM was one of the first programs in the nation to integrate ecological practices into traditional agriculture.  Discover America's  #1 College TownLife in Burlington, Vermont."
