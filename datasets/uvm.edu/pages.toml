["https://www.uvm.edu/facultysenate"]
title = "Faculty Senate | The University of Vermont"
description = "The administration and the Faculty Senate of the University of Vermont share responsibility for the effective management of the academic affairs of the University. Authority in matters related to the academic mission is vested in the faculty by the Board of Trustees."
full_description = "Faculty Senate Shared governance for the effective management of the academic affairs of the University The administration and the Faculty Senate of the University of Vermont share responsibility for the effective management of the academic affairs of the University. Authority in matters related to the academic mission is vested in the faculty by the Board of Trustees. Faculty Senate Executive Council This authority is exercised in the Faculty Senate by elected senators with voting privileges and by committees authorized to act on their behalf. Meetings of the Faculty Senate are presided over by a President and Vice-President and follow a town-meeting format at which all University faculty members have a voice. The activities of the Senate are overseen by an Executive Council, which sets the agenda for Faculty Senate meetings. Faculty Senate Officers and Executive Council Faculty Senate Meetings The next Faculty Senate meeting is Monday, February 24, 2025, 4:00-5:30 PM, on Teams Faculty Senate Meeting Dates and Materials Elected Senators Senators are elected representatives of their academic units to the Faculty Senate. Senators are responsible for communicating with the faculty I their units about all Faculty Senate actions, as well as bringing information from their units to the attention of the Senate and Senate Committees. Committees of the Faculty Senate There are six standing committees of the Faculty Senate. Standing Committees and subcommittees are established to focus on the major continuing areas of faculty concern. The committees are authorized to act for and in the name of the Senate as specified in the Bylaws. Faculty Senate Constitution and Bylaws Authority in matters related to the academic mission of the University is vested in the faculty by the Board of Trustees. Curricular Resources and Senate Archives The Faculty Senate provides curricular resources to assist faculty seeking guidelines, timelines, and process for curricular proposals.Guidelines, Timelines, and Process for Curricular Proposals (UVM Login Required)The Faculty Senate archive of resolutions from September 2012 to present is available to search in a searchable Master Index (pdf). . To request archived information prior to 2012, please use the Faculty Senate Contact Form.Faculty Senate Contact Form"
year_published = 2025
