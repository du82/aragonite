title = "Academic Programs | The Graduate College | The University of Vermont"
description = "The UVM Graduate College is a gateway to advanced learning, research, and professional practice across dozens of fields of interest – at the master's and doctoral levels and via graduate certificates."
full_description = '''Academic Programs The UVM Graduate College is a gateway to advanced learning, research, and professional practice across dozens of fields of interest – at the master's and doctoral levels and via graduate certificates. Application Deadlines & Requirements Body Application deadlines and requirements vary across our programs. Applying early can improve your chances of being considered for any scholarship, teaching assistantship, or research assistantship opportunities. We greatly look forward to reading your application.In addition to almost 90 graduate degree programs, UVM offers concurrent graduate degrees, interdisciplinary doctoral and accelerated masters programs.Accelerated Entry to Master's Degree Program (AMP) is an early-entry program for UVM undergraduate students. It is not a separate degree.Consult the list below and "Academic Offerings" within the Graduate Catalogue for specific program requirements. Body Click Here to View Current Graduate Academic Program Deadlines to Apply Master's and doctoral programs, A to B Accountancy (M.Acc.) Animal Biosciences (M.S., Ph.D.) Biochemistry (M.S.) Biology (M.S., Ph.D.) Biomedical Engineering (M.S., Ph.D.) Biostatistical Sciences (M.S.) C Cellular, Molecular and Biomedical Sciences (Ph.D.) Chemistry (M.S., Ph.D.) Civil and Environmental Engineering (M.S., Ph.D.) Clinical and Translational Science (M.S., Ph.D.) Communication Sciences and Disorders (M.S.) Community Development and Applied Economics (M.S.) Complex Systems and Data Science (M.S., Ph.D.) Computer Science (M.S., Ph.D.) Counseling (M.S.) Counselor Education and Supervision (Ph.D.) Curriculum and Instruction (M.Ed.) D to G Dietetics (M.S.D.) Educational Leadership and Policy Studies (M.Ed.) Educational Leadership and Policy Studies (Ed.D.) Educational Leadership and Policy Studies (Ph.D.) Electrical Engineering (M.S., Ph.D.) English (M.A.) Field Naturalist: Plant Biology (M.S.) Food Systems (M.S., Ph.D.) Geology (M.S.) Greek and Latin (M.A., M.A.T.) H to L Higher Education and Student Affairs Administration (M.Ed.) Historic Preservation (M.S.) History (M.A.) Interdisciplinary Studies in Education (M.Ed.) Leadership for Sustainability (M.P.S.) M Material Science (M.S., Ph.D.) Mathematical Sciences (M.S., Ph.D.) Mathematics (M.S.T.) Mechanical Engineering (M.S., Ph.D.) Medical Laboratory Science (M.S.) Medical Science (M.S.) Microbiology and Molecular Genetics (M.S.) Middle-Level Eduction (M.A.T.) N to P Natural Resources (M.S., Ph.D.) Neuroscience (Ph.D.) Nursing (M.S., D.N.P.) Nutrition and Food Sciences (M.S.) Occupational Therapy (O.T.D.) Pathology (M.S.) Pharmacology (M.S.) Plant and Soil Science (M.S., Ph.D.) Plant Biology (M.S., Ph.D.) Physical Activity and Wellness Science (M.S.) Physical Therapy (D.P.T.) Physics (M.S., Ph.D.) Psychology: General/Experimental and Clinical (M.A., Ph.D.) Public Administration (M.P.A.) Public Health (M.P.H.) S to T Secondary Education (M.A.T.) Social, Emotional, and Behavioral Health and Inclusive Education (Ph.D.) Social Work (M.S.W.) Special Education (M.Ed.) Statistics (M.S.) Sustainable Development, Policy, Economics and Governance (Ph.D.) Sustainable Innovation (M.B.A.) Transdisciplinary Leadership, Creativity and Sustainability (Ph.D.) Graduate Certificate Programs Agroecology Clinical and Translational Science Community Resilience and Planning Complex Systems and Data Science Ecological Economics Education for Sustainability Greek and Latin Languages Interdisciplinary Study of Disabilities Public Health Resiliency-Based Approaches with Families, Schools, and Communities Sustainable Enterprise Accelerated Entry to Master's Degree Programs, A to B Accountancy Animal Biosciences Biochemistry Biology Biomedical Engineering Biostatistics C to G Chemistry Civil and Environmental Engineering Community Development and Applied Economics Complex Systems and Data Science Computer Science Counseling Curriculum and Instruction: Middle Level or Secondary Education Electrical Engineering Food Systems Greek and Latin H to N Historic Preservation History Material Science Mathematics Mechanical Engineering Medical Laboratory Science Microbiology and Molecular Genetics Natural Resources Nursing Nutrition and Food Sciences P to S Pharmacology Physics Psychology Public Administration Public Health Special Education Statistics The policy of the Graduate College is that admission decisions must be finalized prior to the start of a semester (first day of classes in fall, spring, or summer session), and late admission decisions will not be approved retroactively. Applicants must submit all required materials well in advance of the semester in which they wish to matriculate, so that program faculty and chairs have suitable time to review materials and make admission recommendations to the Graduate College before the semester begins. Admission decisions made after the first day of classes in any semester will be for subsequent semesters.Some programs accept applications even after the usual application deadline, or on a rolling admissions basis, assuming sufficient program capacity. Admission decisions for these programs are subject to the same policy stated above. Contact the program to determine if they will accept a late application, and if time exists to complete the application process prior to the start of the semester.'''
