["https://www.uvm.edu/cas/globalstudies/program/african-studies"]
title = "African Studies | Global and Regional Studies Program | The University of Vermont"
description = "The African Studies Program offers a comprehensive and interdisciplinary minor program pertaining to the histories, people, cultures, environment, literature, and politics of Africa, arguably one of the world's most diverse and complex regions. UVM's small but dedicated Africanists offer a variety of courses exploring aspects of this complex and diverse continent that plays an important role in global economic, ecological, and cultural welfare."
full_description = "African Studies Type of Degree Undergraduate Minor School or College College of Arts and Sciences Area of Study Arts, humanities, social sciences Program Format On-campus, Full-time Apply Program Overview Program Overview The African Studies Program offers a comprehensive and interdisciplinary minor program pertaining to the histories, people, cultures, environment, literature, and politics of Africa, arguably one of the world's most diverse and complex regions. UVM's small but dedicated Africanists offer a variety of courses exploring aspects of this complex and diverse continent that plays an important role in global economic, ecological, and cultural welfare. Curriculum Curriculum Our minor program provides a stimulating blend of courses from disciplines including history, political science, geography, and more. The African studies minor can be paired with whatever major you choose, and it will offer you a skillset, including writing and critical thinking, that can be applied towards any career path. Our minor program consists of 18-course credits, and most of our minor students spend time abroad. Catalogue Requirements for the African Studies Minor. More More Study AbroadMany students declare a minor in African studies after spending a semester or even a year abroad. There are several excellent (and reasonably inexpensive) ways to do this in East, West, or Southern Africa. Many students use data collected on these trips for an African studies minor independent paper.There are a variety of programs in Africa available to UVM students which offer different experiences. Programs range from studying politics at a South African university to working with wildlife in Kenya or Namibia. Depending upon the program, accommodations can include educational institutions, private homes, hostels, or tents. Students may have an opportunity to learn and experience aspects of African culture by living with families such as the Maasai in Tanzania or Xhosa in South Africa. While others may decide to live on campus and become more familiar with the campus culture or stay in nearby apartments. The lengths of the programs are varied as well. Students can study for 3-4 weeks during the summer, spend a semester, or a full year abroad. More about study abroad.AdvisingA key part of your success at UVM will be your relationship with your academic advisor. Think of your advisor as your academic liaison who you can rely on to clarify university policies and requirements, provide support, and navigate your undergraduate journey. As an African studies minor, you will automatically be paired with program director, Vicki Brennan. More about advising.Popular CoursesHST 1410 COLONIALISM AND AFRICACareersAn undergraduate minor in African studies, coupled with a complementary major, prepares students for graduate study in several disciplines in the humanities and social sciences. Alumni also pursue careers in policy analysis, government, research, journalism, business, law, international development and activism in the United States and Africa. Related Programs Global Studies B.A., Undergraduate Minor College of Arts and Sciences program formatFormat: On-campus Canadian Studies Undergraduate Minor College of Arts and Sciences program formatFormat: On-campus European Studies Undergraduate Minor College of Arts and Sciences program formatFormat: On-campus Credit hours to graduate18 credits in minor courses Middle East Studies Undergraduate Minor College of Arts and Sciences program formatFormat: On-campus"
year_published = 2025
clearnet = "https://www.uvm.edu/cas/globalstudies/program/african-studies"
