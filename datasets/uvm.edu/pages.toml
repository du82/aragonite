onal landscapes, learn conservation methods for land and water resources or provide education to communities.Our programs bring science-based ecological practices to traditional agriculture and land management systems.Growing a Sustainable FutureUVM was one of the first programs in the nation to integrate ecological practices into traditional agriculture. Discover America's #1 College TownLife in Burlington, Vermont. Concentrations Concentrations Agroecology Major Course Checklist (pdf)Ecological Landscape Planning and Design Major Course Checklist (pdf) Curriculum Curriculum Popular CoursesIntro to Agroecology, ALE 1210Fundamentals of Soil Science, ALE 2610Permaculture, ALE 2560 Admissions Admissions View the catalogueCALS Requirements Outcomes Outcomes Beyond the ClassroonOur faculty work closely with the agricultural community not only in Vermont, but nationally and internationally. Faculty are both professors and professional researchers, providing rich opportunities for students to engage in research and internships beyond the classroom. UVM students have the opportunity to work in faculty labs, in the field on our research farms and in the community while earning credits, skills and making meaningful connections. Read more about our undergraduate student research experiences.Graduate Employment Rate91% of CALS graduates were employed full-time or continuing their education within 6 months of graduating from UVMCareersBrewery Owner, Hops SpecialistConservationist, Land and WaterEducator, Extension Outreach ProfessionalEnvironmental Technician, Soil and WaterFlower Farm OwnerGreenhouse Operations CoordinatorUrban Landscape DesignerWinemaker, Wine Cellar ManagementWhere Alumni WorkEcoGardens Landscaping, LLC Philadelphia PAErnest & Julio Gallo Wines, CALand Trust Alliance Commission, Saratoga Springs NYLongwood Gardens, Philadelphia PAMother Earth Organics, Portland ORParks and Recreation Department, Burlington VTSelf-employed business owners, breweries, wineries