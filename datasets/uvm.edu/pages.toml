title = "Admitted Students | Undergraduate Admissions | The University of Vermont"
description = "We can't wait to welcome you on campus. And we're here to support you, every step of the way."
full_description = "Admitted Students Let's make it official. We can't wait to welcome you on campus. And we're here to support you, every step of the way. Join Us for Admitted Student Events Admitted Student Visit Days Body Come to campus for an Admitted Student Visit Day. Learn more about your major, take a tour, talk to current students about their UVM experience. Picture yourself at UVM! Please note that due to space restrictions, certain academic colleges may reach capacity before the event reaches total capacity. If you aren’t able to register for the date you’ve selected, we invite you to choose another date that does have capacity in your academic college.Friday, February 14Friday, February 21Friday, March 28 Friday, April 4Friday, April 11Monday, April 14 Friday, April 18 Monday, April 21View ScheduleRegister Now Admitted Student Receptions Body UVM comes to you! Join us in select cities across the U.S. to learn more about UVM and meet other admitted students in your area. Members of the UVM community, including current students, admissions and alumni office staff, and local UVM alumni, will be on hand to answer your questions. Washington, DC | Monday, February 3Philadelphia, PA | Tuesday, February 4New York City, NY | Wednesday, February 5Greater Chicago, IL | Tuesday, March 18San Francisco, CA | Tuesday, March 18Seattle, WA | Wednesday, March 19Minneapolis, MN | Wednesday, March 19Greater Westchester County, NY | Monday, March 24Register Now Joining the Circle Body Joining the Circle is a program focused on the student experience for traditionally underrepresented high school students admitted to UVM, including but not limited to first-generation to college, BIPOC, Hispanic/Latinx, Asian-American, Native American, Multiracial, and low-income students. Joining the Circle, on April 10, is held in conjunction with the Admitted Student Visit Day on April 11. Joining the Circle attendees will be automatically registered for the Admitted Student Visit Day.Register Now Passport to UVM Body Experience UVM in person during a program designed specifically for international students. Students must apply for the program and travel grants are available for those who are selected to participate. Passport to UVM, on April 17, is held in conjunction with the April 18 Admitted Student Visit Day and attendees will be automatically registered for the Admitted Student Visit Day.Apply to Passport Chat with a Cat Body These virtual events are aimed at helping you make your college choice and get any final questions answered! The event will include a student-led panel, where admitted students can submit their questions and our panel of AdvoCats will answer questions live.Wednesday, March 26 at 7:30-8:30p.m. ETRegister NowWednesday, April 23 at 7:30-8:30p.m. ETRegister Now Next Steps Pay Your Acceptance Fee Your Application Status Portal New Student Orientation Join Your Peers on ZeeMee Join UVM's official social media community for admitted students. Download the free ZeeMee app to start meeting your fellow future Catamounts. Search ZeeMee in your app store. Download the App Parent and Family Resources Answering all your questions about what's next. Paying the UVM Acceptance Fee New Student Orientation Student Financial Services Burlington Cultural Resource Guide Transfer Students Review your credit evaluation Learn about housing options International Students Office of International Education (OIE) Pre-Arrival Information Orientation Immigration Scholarships for International Students Veterans Veteran Services VA Benefits at UVM Student Stories The College Tour’s Emmy-nominated and award-winning TV production crew visited UVM to film 10 students who shared their stories about what it’s really like to be a Catamount. Meet the Students"
