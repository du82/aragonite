["https://www.uvm.edu/about-uvm"]
title = "About UVM | The University of Vermont"
description = "UVM is a top research university of ideal size, large enough to offer a breadth of ideas, resources, and opportunities, yet scaled to enable close faculty-student mentorship across all levels of study, from bachelor’s to doctoral programs."
full_description = "About UVM UVM is a top research university of ideal size, large enough to offer a breadth of ideas, resources, and opportunities, yet scaled to enable close faculty-student mentorship across all levels of study, from bachelor’s to doctoral programs. Bold leaders, big ideas Interim President Patty Prelock A strong proponent of the value of public higher education, the President leads UVM with a firm emphasis on its status as the land-grant university for Vermont. Acting Provost Linda Schadler As the university's chief academic officer, the Provost strives to create paths for students and faculty to achieve academic excellence. Mission and Vision At UVM, we are dedicated to creating, evaluating, sharing, and applying knowledge while preparing students to be accountable leaders. Our mission and vision guide us in fostering global engagement, critical thinking, and lifelong ethical learning. A location for every season UVM students’ educational experience and activities are enriched by our location — from the energy and innovation of Burlington to the forests, farms, mountains, and independent spirit of Vermont. Living in Burlington Making an impact on Vermont and beyond We create solutions to improve the world. As Vermont’s land-grant think tank, we are nationally acclaimed for tackling everything from farm viability to environmental growth, and we support commercialization and major job creation in the region through our partnerships and innovation. UVM Facts Office of Engagement UVM Innovations Entrepreneurship UVM Extension Sustainability, our superpower UVM has a long history of environmental and sustainability leadership. It is in our nature, infused in everything we do – from curriculum to research to how we train educators, operate the campus, and conduct business. Office of Sustainability Dimensions of diversity At UVM, our culture of diversity and acceptance results from a campus-wide effort to actively strive for equity for all. Celebrating our diverse and inclusive culture is a priority at the University of Vermont. In fact, UVM holds that diversity and academic excellence are inseparable. Division of Inclusive Excellence Centuries of Excellence, A Legacy of Innovation Chartered in 1791 UVM was established in 1791 as the fifth college in New England (after Harvard, Yale, Dartmouth and Brown). The initials UVM stand for the Latin words Universitas Viridis Montis, or University of the Green Mountains. The phrase appears on the university's official seal as Universitas V. Montis. Foundation and Early Support Much of the initial funding and planning for the university was undertaken by Ira Allen, who is honored as UVM's founder. The citizens of Burlington helped fund the university's first building, and, when fire destroyed it in 1824, also paid for its replacement, the Old Mill building. UVM's Public Status Although it began as a private university, UVM attained quasi-public status with the passage of the Morrill Land-Grant College Act in 1862 and the addition of the State Agricultural College. Today, the university blends the traditions of both a private and public university, drawing 7% (as of 2023). By the numbers 1791 university founded Top 100 Public Research University (National Science Foundation) 459 acres main campus"
