["https://www.uvm.edu/engagement/connect-our-campus-partners"]
title = "Connect with our Campus Partners | Office of Engagement | The University of Vermont"
description = "The Office of Engagement welcomes you to explore ways to connect with the University of Vermont. We work closely with campus partners to carry out our land grant mission. Whether you're looking for an intern, a research expert, professional development, or volunteers, we are eager to explore opportunities."
full_description = '''Connect with our Campus Partners The Office of Engagement welcomes you to explore ways to connect with the University of Vermont. We work closely with campus partners to carry out our land grant mission. Whether you're looking for an intern, a research expert, professional development, or volunteers, we are eager to explore opportunities. The Office of Engagement serves as the "front door" for the University of Vermont. We welcome you in with open arms. Our team works closely with many campus partners to find mutually beneficial opportunities for collaboration between the university and the Vermont community. Our team is ready to assist you in finding the right resources and connections. Office of the Vice President for Research Body Our goal is to translate what we learn or discover at the university into innovations that benefit all facets of society. UVM is home to over 1,200 full-time faculty scholars. From biomedical research to philosophy, from data science to musical composition, our faculty members engage daily in the pursuit of meaningful and impactful research, scholarship and creative work.Learn more about the OVPR UVM Innovations Body UVM Innovations enables new and existing companies to commercialize new technologies that benefit society.We understand successful collaboration is a merger of cultural and intellectual objectives, as well as a reasonable economic expectations. The UVM Innovations team brings together distinguished University of Vermont investigators with world class IP attorneys to transform UVM discoveries into robust intellectual property.Our team of seasoned tech transfer professionals looks forward to working with our commercial partners, established and new, to bring these innovations to market.Learn more about UVM Innovations UVM Career Center Body The Career Center promotes career exploration, readiness and success through education, experience and connections.We do this so that UVM graduates may engage in meaningful work with confidence, courage, and curiosity.At the core of how we approach our work is a deep commitment to be caring, innovative, and integrative, and in constant pursuit of excellence and social justice. In this spirit, we actively support all persons on their individual paths and strive always towards constant learning, comprehensive service, active advocacy, supportive counseling and affirmative hiring. We wholeheartedly embrace our similarities and our differences.Learn more about the UVM Career Center Professional and Continuing Education Body Welcome to Professional and Continuing EducationEvery year, we help thousands of non-traditional students continue their education at the University of Vermont. Through collaborations with UVM’s various colleges and schools, we offer courses and programs to help you explore your options, whether you’re planning a career change, looking for personal enrichment or professional development, or preparing for an undergraduate or advanced degree.Learn about our programs and offerings, then call us and meet with an advisor who can help you map an educational plan based on your background and goals. You can also take part in one of our many community events on campus and around the state. After 100 years, we continue to provide flexible, relevant educational options at all stages of life because we believe the opportunity to learn should never stop.Learn more about Professional and Continuing Education Office of Community-Engaged Learning Body The Community-Engaged Learning Office (CELO) is UVM's home for academic service-learning. Our goal is to help students apply their learning on behalf of the many communities connected to UVM.CELO works to create a community of practice among UVM faculty, students, and community partners built on the high-impact practice of community-engaged learning. Service-learning (SL) and civic-learning (CL) courses work in partnership with hundreds of organizations: nonprofits, local government entities, small businesses, community associations, and more. Students engage in work that benefits a community organization, while faculty provide a structure for accountability to the project or service that helps students learn from their experience. Through this coursework, students prepare for full participation in public life by deploying their academic skills within reciprocal community partnerships that address community-identified priorities.The University of Vermont has a distinguished history of community-engaged teaching and learning. As the alma mater of John Dewey, UVM is deeply invested in this particular high-impact educational practice (Kuh 2008), and has long valued engagement in community and experiential education as key foundations for citizenship. CELO continues this work, helping faculty infuse community engagement into their teaching and scholarship; maintaining relationships with community partners; and supporting pathways for students to engage in communities throughout their time at UVM and beyond.Learn more about CELO Office of Student and Community Relations Body Envisioning An Engaged CommunityThe Office of Student & Community Relations provides resources and support to University of Vermont students as they transition to living off campus. We aim to facilitate communication and build relationships among students and non-students so that they can create healthy, safe, and socially just neighborhoods.Learn more about the Office of Student and Community Relations Center for Disability and Community Inclusion Body Supporting people with disabilities in accessing and thriving in the communities of their choice since 1974.We believe in a future where all people, including people with developmental and other disabilities, are fully included in the communities of their choice. University of Vermont’s Center on Disability and Community Inclusion is Vermont’s University Center for Excellence in Developmental Disabilities Education, Research, and Service. It is one of 67 centers across the country funded by the Developmental Disabilities Assistance and Bill of Rights Act. Every Center has a different expertise and focus. We're excited to tell you about ours.Learn more the Center for Disability and Community Inclusion University Relations Body LocalWe work with Burlington and surrounding communities to address problems of common interest and collaborate on strategic initiatives. We provide resources in lifelong learning, internships, community-based research, athletics, the arts, and many other areas.StateOur office works with the President, Provost, and senior academic, and administrative officers to educate citizens and leaders of Vermont about priorities, programs, and needs of the University. We provide information related to the state legislature and regulatory activity and policies affecting higher education and the university.FederalUniversity Relations seeks opportunities at the national level to advance the goals and the priorities of the university through Congressional or Executive action. We facilitate a comprehensive, University-wide process to identify, prioritize, and communicate key initiatives for federal legislation and funding.Learn more about University Relations'''
