["https://www.uvm.edu/cas/art/program/ba-or-minor-art-history"]
title = "B.A. or Minor in Art History | Program in Art and Art History | The University of Vermont"
description = "The study of the history of art at UVM usually begins with courses surveying the broad range of visual expressions found in cultures around the world. Students are introduced to numerous methodological approaches—contextual, formal, and iconographic—which enable them to understand the richness and layered meanings of works of art. For those who choose to major in this humanities discipline, mastery of a foreign language through the intermediate level, and at least two courses in studio art, provide additional tools useful in responding skillfully to works of art.UVM art history majors have continued their studies in art history at the graduate level and are now teaching at major universities, like Harvard and Stanford, or finding success in professional positions in museums, including the Baltimore Museum of Art, the New Museum, the Barnes Collection, among others, as well as auction houses, publishing and related fields. Still others have combined their studies in art history with postgraduate study in areas such as law or library science and have continued into careers combining these preparations. Some have used the major as a way to sharpen their analytical skills in thinking and creative problem solving and have then gone on to pursue seemingly unrelated careers in fields such as medicine or business. No matter what path they have followed after graduation, most students have commented on the quality of the art history program at UVM noting how it has enriched their lives and sharpened their visual responses to the world around them.Minor in Art HistoryRestrictionsIneligible Major: Art HistoryOther InformationIn the College of Arts and Sciences (CAS), only one course may overlap between a major and a minor or between two minors.Courses for the minor and/or its pre/co-requisites that are cross-listed in the catalog or schedule of courses under another course prefix may be taken under that other prefix and still count for these requirements.With the approval of the chair/director, courses that applied to the minor in previous years but have since been deactivated may be applied to this year’s minor requirements if they are reactivated.For a Bachelor of Arts degree, no more than 45 credits in courses with the same departmental prefix may be used toward completion of the 120 credits required for graduation. For a Bachelor of Science degree, the maximum is 50 credits.At least half of the credits used to complete minor requirements must be taken at the University of Vermont."
full_description = "B.A. or Minor in Art History Type of Degree B.A., Undergraduate Minor School or College College of Arts and Sciences Area of Study Arts, humanities, social sciences Program Format On-campus, Full-time Program Overview Program Overview The study of the history of art at UVM usually begins with courses surveying the broad range of visual expressions found in cultures around the world. Students are introduced to numerous methodological approaches—contextual, formal, and iconographic—which enable them to understand the richness and layered meanings of works of art. For those who choose to major in this humanities discipline, mastery of a foreign language through the intermediate level, and at least two courses in studio art, provide additional tools useful in responding skillfully to works of art.UVM art history majors have continued their studies in art history at the graduate level and are now teaching at major universities, like Harvard and Stanford, or finding success in professional positions in museums, including the Baltimore Museum of Art, the New Museum, the Barnes Collection, among others, as well as auction houses, publishing and related fields. Still others have combined their studies in art history with postgraduate study in areas such as law or library science and have continued into careers combining these preparations. Some have used the major as a way to sharpen their analytical skills in thinking and creative problem solving and have then gone on to pursue seemingly unrelated careers in fields such as medicine or business. No matter what path they have followed after graduation, most students have commented on the quality of the art history program at UVM noting how it has enriched their lives and sharpened their visual responses to the world around them.Minor in Art HistoryRestrictionsIneligible Major: Art HistoryOther InformationIn the College of Arts and Sciences (CAS), only one course may overlap between a major and a minor or between two minors.Courses for the minor and/or its pre/co-requisites that are cross-listed in the catalog or schedule of courses under another course prefix may be taken under that other prefix and still count for these requirements.With the approval of the chair/director, courses that applied to the minor in previous years but have since been deactivated may be applied to this year’s minor requirements if they are reactivated.For a Bachelor of Arts degree, no more than 45 credits in courses with the same departmental prefix may be used toward completion of the 120 credits required for graduation. For a Bachelor of Science degree, the maximum is 50 credits.At least half of the credits used to complete minor requirements must be taken at the University of Vermont. Curriculum Curriculum From UVM Catalogue:Art History B.A. Major RequirementsArt History Minor Requirements Outcomes Outcomes Upon completion of the B.A. in Art History, students will be able to:Identify and utilize fundamental approaches to the analysis and interpretation of art.Recognize and articulate the significance of the major works in the history of art.Read advanced scholarship in the history of art, apply various theoretical frameworks, and incorporate this scholarship into the study a particular work or art historical problem.Demonstrate advanced writing and oral presentation skills through the completion of a substantive research project. The project should include appropriate use of primary and secondary sources, clear and well-organized writing, and the development of an evidence-based argument."
year_published = 2025
