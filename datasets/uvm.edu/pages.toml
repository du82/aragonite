title = "Biochemistry Minor | Biochemistry Program | The University of Vermont"
description = "A minor in Biochemistry will allow for the development of a strong background in chemistry as it relates to biological processes. Biochemists utilize basic chemistry principles to understand the physical and chemical properties of biological organisms. Biochemistry provides students with the opportunity to study the molecular interactions that guide many processes involved in living organisms, including metabolism, enzyme kinetics, forces that guide the binding of biomolecules, and the principles of drug development and design. A minor in biochemistry will support connections with many fields, including biology, agricultural sciences, pharmacology, health sciences, and many others.Minor requirements include 17 credits in organic chemistry and biochemistry classesRestrictionsIneligible Major: Chemistry (B.A., B.S.)Ineligible Minor: Chemistry"
