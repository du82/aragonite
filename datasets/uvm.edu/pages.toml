["https://uvm.edu/admissions/undergraduate/living-burlington"]
title = "Living in Burlington | Undergraduate Admissions | The University of Vermont"
full_description = "Living in Burlington We do city life a little differently. What's it like here? As soon as you set foot here, it’s easy to see why Burlington, Vermont has been ranked as a top college town by the New York Times and HuffPost. It’s a community that cares­ – about supporting local food providers, celebrating the arts, creating a more sustainable future, and preserving what makes the city such a great place to live. With world-class food, entertainment, recreation, and views, this is the perfect home base for your university experience. Schedule a visit Burlington, Vermont is America's #1 College Town Far from the middle of nowhere, Burlington is in the middle of everything.Less than a 2-hour drive from the Bell Center in Montreal, where A-list musicians perform and professional sports teams face off.A 4-hour drive from Boston, a historic and happening cultural center of New England. Connected to hundreds of destinations through the Burlington International Airport.Surrounded by 6+ ski resorts within a 50-mile radius. Students' Perspectives of Burlington and Beyond Access to Job and Internship OpportunitiesThe city’s thriving network of startups, growing mid-stage companies, and big league organizations means you have a wealth of opportunities to explore internships and land career-launching jobs. Here are just a few of the local places our students have interned:Ben & Jerry’sBeta TechnologiesBurtonBurlington Emergency & Veterinary SpecialistsChittenden County Public DefenderDealer.comEating Well MagazineECHO Leahy Center for Lake ChamplainSeventh GenerationVermont State Legislature Top 10 To-DosIt would be almost impossible to list all our favorite things in BTV*, but here are just a few:Shop the Church Street MarketplaceGrab breakfast at the Burlington Farmers Market (Try a scallion pancake from Green Mountain Potstickers)Eat a creemee (That’s Vermont for soft serve; maple is the best flavor)Walk or bike the 8-mile path along Lake ChamplainSee international talent at the Flynn Center for the Performing ArtsVisit the world’s tallest filing cabinetSpend a lake day at Oakledge or North BeachTake in an art exhibit at the Firehouse GalleryExplore Centennial Woods (or drive a bit to hike Mt. Philo)*Why BTV? It's the airport code (and a popular nickname for the city!) Getting Around the CityBurlington’s size makes it easy to get around no matter which mode of transportation you pick.Shuttle: UVM’s free CATS shuttle gets you from A to B on-campus, and provides a safe and convenient connection to downtown.Walk: UVM is just a 10-minute walk to the bustling downtown area. Bus: Green Mountain Transit (GMT) has routes throughout the city and beyond. As a UVM student, you can ride GMT services for free.Bike: Use the Bird Bikeshare app, or bring your own. Resources Schedule a Visit Burlington Cultural Resource Guide Lodging Near UVM"
