["https://www.uvm.edu/ccp/biochemistry-program/program/biochemistry-ms"]
title = "Biochemistry M.S. | Biochemistry Program | The University of Vermont"
description = "Our traditional, two-year Master's program in Biochemistry is a research based program designed for students who need an advanced degree to progress in their workplace. Acceptance into the Master’s Degree (MS) program requires an acceptable undergraduate major in biochemistry, chemistry, or a related field. Though the GRE is not required, it is helpful in making admissions decisions. Our MS Program no longer has a foreign language requirement. For students who do not use English as their primary language, an English as a second language course offered by the University may be required (but will not provide any credits toward the MS degree).To be accepted into the program students must have completed year long courses in: biology, organic chemistry, physical chemistry, and physics. In addition, a quantitative chemistry course and mathematics (preferably through differential and integral calculus). If a physical chemistry course has not been taken previously, a student must take Physical Chemistry (CHEM 2600) in their first year (for which they do not receive credit toward the MS degree).MS students are expected to have contacted a potential advisor and negotiated a potential project prior to submitting their application. It is expected that you will name the potential advisor in your application. At this time the Department has no funds to support a MS student and therefore we are only accepting students who have their own fellowship or can finance the degree program on their own. Application instructions can be found here."
full_description = "Biochemistry M.S. Type of Degree M.S. Area of Study Science, technology, engineering and mathematics Program Format On-campus, Full-time Apply Program Overview Program Overview Our traditional, two-year Master's program in Biochemistry is a research based program designed for students who need an advanced degree to progress in their workplace. Acceptance into the Master’s Degree (MS) program requires an acceptable undergraduate major in biochemistry, chemistry, or a related field. Though the GRE is not required, it is helpful in making admissions decisions. Our MS Program no longer has a foreign language requirement. For students who do not use English as their primary language, an English as a second language course offered by the University may be required (but will not provide any credits toward the MS degree).To be accepted into the program students must have completed year long courses in: biology, organic chemistry, physical chemistry, and physics. In addition, a quantitative chemistry course and mathematics (preferably through differential and integral calculus). If a physical chemistry course has not been taken previously, a student must take Physical Chemistry (CHEM 2600) in their first year (for which they do not receive credit toward the MS degree).MS students are expected to have contacted a potential advisor and negotiated a potential project prior to submitting their application. It is expected that you will name the potential advisor in your application. At this time the Department has no funds to support a MS student and therefore we are only accepting students who have their own fellowship or can finance the degree program on their own. Application instructions can be found here. Curriculum Curriculum From UVM CatalogueBiochemistry M.S. Requirements Related Programs Biochemistry Accelerated Entry into Master's Program program formatFormat: On-campus Biochemistry B.S. College of Arts and Sciences, College of Agriculture and Life Sciences program formatFormat: On-campus Biochemistry Undergraduate Minor College of Arts and Sciences, College of Agriculture and Life Sciences program formatFormat: On-campus"
