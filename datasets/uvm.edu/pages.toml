["https://www.uvm.edu/human-resources/total-rewards"]
title = "Total Rewards | Human Resources | The University of Vermont"
description = "Working at UVM is more than just a paycheck. From health insurance, wellbeing programs, tuition remission, and more, we offer competitive benefits and a compensation package designed to help employees and their families thrive."
full_description = '''Total Rewards Working at UVM is more than just a paycheck. From health insurance, wellbeing programs, tuition remission, and more, we offer competitive benefits and a compensation package designed to help employees and their families thrive. What are your Total Rewards?For a better understanding of the breadth and cost of your benefits - and the investment UVM makes in our employees and their families, Total Rewards statements for the 2024 calendar year are now available in PeopleSoft. Benefit-eligible employees can login to PeopleSoft's Human Resources portal and click on the "Total Rewards Statement" tile to find information detailing the costs UVM paid into benefits including health insurance, retirement savings, and tuition remission, and more.View Total Rewards Statement in PeopleSoft Benefits UVM offers different types of insurance plans to best meet your and your family's needs while preparing for the unexpected. Learn more about our plan options for medical, dental, vision, life, disability, and flexible spending. Classification & Compensation UVM offers competitive pay to attract and retain top talent. We focus on market conditions and prioritize internal equity to ensure fair compensation within higher education and local and national job markets. Retirement Invest in your future wellbeing with UVM's robust retirement benefits, a key part of our total rewards package. Benefits include retirement savings plans and health savings. Thinking about retiring? All you need to know can be found here. Expanded Education Enhance your skills, knowledge, and career path with UVM's support. Our educational benefits include tuition remission, talent development programs, and access to courses and learning platforms at reduced or no cost. Wellness UVM Employee Wellness offers programs and resources to foster a culture of health and wellbeing. Part of the Osher Center for Integrative Health, we're committed to whole-person health through leadership, education, and support. Time off and Leave Time off, leaves, and holidays are a key part of your total rewards. Whether it's a vacation with your family or time to recover from an unexpected event, our offerings are designed to meet the needs of you and your family. Employee Discounts Enjoy the perks of belonging to the UVM community near and far with our expansive employee discounts. Recognition Why is UVM one of the top-performing public universities in the country? The people who power it. We know the faculty, staff, and administrators at UVM show up in big ways for our people and planet, and we celebrate that work and commitment year-round.'''
year_published = 2025
