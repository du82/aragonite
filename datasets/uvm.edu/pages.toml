["https://www.uvm.edu/career"]
title = "Career Center | The University of Vermont"
description = "Each path to career success is unique. UVM can help you find yours. Whoever you are - whatever identities you hold - we are committed to supporting you in finding meaningful and rewarding work."
full_description = "Career Center Connections to People, Opportunities, and Resources Each path to career success is unique. UVM can help you find yours. Whoever you are - whatever identities you hold - we are committed to supporting you in finding meaningful and rewarding work. Drop-by the Career Center Path to Career Success The Path offers a road map of things you can do - plus tips on how to do them - to build your confidence and readiness for a career after graduation. Check it out, and take a CQ, to see what you next step might be. How are you connecting with people, opportunities, and resources? How can we help? Path to Career Success 94% of graduates were employed or continuing their education within six months of graduation 94% of employed graduates reported they are satisfied with their position. 92% of students engage in High Impact Practice (e.g., Service-Learning, Research, Internship, Study Abroad) during their time at UVM Find Your Success with these Quick Links Internships and more... Resumes and more... Experiences Photo Contest Find Your Folks - Join a Career Interest Group! Our Career Interest Groups live on UVM Connect. It's easy to join and get connected to thousands of Catamounts who want to help you discuss career paths and find opportunities. Learn more about Interest Groups on our Networking Page Find Your Interest Group Join Your Network on UVM Connect Partner with Us! Employers Whether you’re seeking interns, part-time staff, or full-time employees, we’ll help you tailor your approach based on your unique recruiting needs. Faculty and Staff You don't have to be a career counselor to help - we're here to help you feel prepared to offer appropriate supports and referrals. Alums Looking to support undergrads or are you in need of support for yourself? We are here for you! More virtual career events."
