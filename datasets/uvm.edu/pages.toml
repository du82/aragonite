["https://www.uvm.edu/engagement"]
title = "Office of Engagement | The University of Vermont"
description = "Researchers, faculty, and students at the University of Vermont are working every day to provide solutions to contemporary challenges. Building upon the University’s land-grant mission, UVM established the Office of Engagement to serve as the university's “front door” for private, public and non-profit entities."
full_description = "Office of Engagement Building partnerships for Vermont's future Researchers, faculty, and students at the University of Vermont are working every day to provide solutions to contemporary challenges. Building upon the University’s land-grant mission, UVM established the Office of Engagement to serve as the university's “front door” for private, public and non-profit entities. UVM: Vermont's land grant institutionWhen Ira Allen chartered and founded the University of Vermont in 1791, he made the astute observation that no state could prosper without educating its citizens. Centuries later, UVM maintains that educating Vermonters and providing service to the state are among our top priorities.Improving the lives of Vermonters and their access to higher education (PDF) Our doors are open. Let's work together. Economic Development UVM is committed to supporting the economic success of the state of Vermont. The Office of Engagement pursues opportunities with partner organization to enhance conditions for productive economic and community development. Workforce Development There is often a gap between the skills of job applicants and the positions that businesses need to fill. We can connect you with training programs that give your workers the skills they need to help you be more competitive in Vermont's job market. Community Connections UVM is an engine for ingenuity and problem-solving. We are dedicated to leveraging university resources to help Vermont businesses reach their full potential. Headlines UVM's Leahy Institute Launches Consortium of Coworking Spaces to Amplify Economic Impact throughout Vermont UVM’s Leahy Institute Awards $2.4M to Advance Vermont Partnerships Community Schools Collaborative Expands Transformative Approach in Vermont UVM’s Leahy Institute Receives $250K from Ford Foundation to Boost Partnerships Across Vermont Celebrating Vermont's Outstanding Educators UVM Launches “Boot Camp” for Town Managers More news from the Office for Engagement Leahy Institute for Rural Partnerships Cultural Resource Guide Student Involvement Data Request Form"
