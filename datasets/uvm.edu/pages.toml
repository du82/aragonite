title = "UVM News | The University of Vermont"
description = "UVM News brings you the University of Vermont’s top stories, showcasing breakthrough research, timely solutions and experts, and news from Vermont’s flagship university."
full_description = "UVM News UVM News brings you the University of Vermont’s top stories, showcasing breakthrough research, timely solutions and experts, and news from Vermont’s flagship university. Featured News University of Vermont Army ROTC Best Program in the Northeast Acting Provost and Senior Vice President Linda S. Schadler Elected to National Academy of Engineering Hidden consequences: UVM researchers investigate the wider impacts of conservation efforts UVM Libraries Announce the Availability of the First Part of Senator Leahy’s Papers Thousands Celebrate UVM Men's Soccer National Champs in Burlington UVM in the News Inside Higher Ed The University of Vermont has been designated as an “R1” research institution, a top-tier ranking by the Carnegie Classification, opening the door to new opportunities for UVM faculty and students. Forbes Greenland’s melting ice sheet could expose new signs of ancient life, says UVM geoscientist Paul Bierman. New York Times Joe Roman, UVM conservation biologist, has a solution to the problem of invasive crabs in New England: put them on the menu. UVM Achieves Prestigious Carnegie R1 Designation, Joining Highest Level of U.S. Research Institutions A transformative moment for the university, a result of decades of investment in cutting-edge research and development, faculty excellence, and academic innovation. Read this story Research and Discovery Nelson Team's Brain Blood Flow Breakthrough Mark Nelson and colleagues have uncovered a novel mechanism that reshapes our understanding of how brain blood flow is regulated.. Earliest Fish-Trapping Facility in Central America Discovered Wetland investigations uncover network of pre-Columbian linear channels and ponds in Belize. From Research Papers to Comic Panels Luis Vivanco has come to realize that, just as the pen is mightier than the sword, so too is the comic often more resonant than the research report. University News and Impact Vermont’s Teacher of the Year Launches Future Educators For Caitlin MacLeod-Bluver, imparting inventive approaches to students who will soon become the next generation of teachers is a driving force in her career. UVM Holds “Boot Camp” for Town Managers The Vermont Local Government Institute certificate program imparts tangible skills, best practices, and sound advice from former town administrators. Update on UVM Commencement 2025 Commencement is a cherished tradition at the University of Vermont. See details on schedule and locations for the events of May 16-18, 2025. Student Success Music Ed Grads Hit All the Right Notes Graduates of UVM’s music education program begin work in their field as finely tuned to teach as the instruments their students are learning to play. Beyond the Data: Storytelling and Science Communication Postdoc Emily Longman launched a new class aimed at teaching student scientists to better communicate their research to people outside the lab. GlobalFoundries Offers CEMS Students New Scholarships GF’s commitment supports students and develops workforce talent in semiconductor design and manufacturing in the region. Explore More News Research and Discovery University News and Impact Student Success Got Sustainability? UVM Researchers Test Ways to Green-Up Dairy Farming Experts for Media Commentary U.S. Politics and Presidential Power Vermont’s Historic Flooding Refugees and Climate Migration Climate Change and Maple Syrup Climate Change and Snow Sports Fall Foliage in New England Strategic Initiatives The UVM Brand: For People and Planet Planetary Health Initiative Amplifying Our Impact"
