title = "Frequently Asked Questions | UX Tools"
description = "Answers to your burning questions about the Design Tools Survey"
full_description = '''Responses are gathered through organic link-sharing. We send out an invitation to take the survey through our newsletter, social channels, and website. We ask designers to share it in their communities and companies, as well. Many respondents find the survey through LinkedIn, Twitter, Reddit, Slack, and other social sharing platforms. Interested in being a sponsor? Reach out to team@uxtools.co. We have lots of sponsorship opportunities, and would love to help you accomplish your goals! Sponsors have absolutely no involvement with the planning or creation of the survey. They do not receive any special treatment when gathering responses (all tools are listed alphabetically). All sponsors support the free and open distribution of the raw Design Tools Survey dataset. Sponsors utilize the Design Tools Survey as a way to support the design tools community, provide funds for UX Tools to continue creating content, and to raise brand awareness. Interested in being a sponsor? Reach out to team@uxtools.co. We have lots of sponsorship opportunities, and would love to help you accomplish your goals! We've tried several different approaches to fairly presenting ratings over the years. We do our best to present the data fairly and in a way that empowers designers to understand the industry and find the tools that are best for them. We divide ratings into two categories: "Highly rated" and "New and noteworthy". A highly rated tool must be used by at least 3% of respondents, or about 100 people. "New and noteworthy" ratings are for all other tools that don't meet this criteria. Ratings can be easily manipulated (especially for less popular tools) when, for example, a company asks all their employees to fill out the survey and give their product a high rating. We think our approach allows designers to fairly interpret the data for themselves.'''
