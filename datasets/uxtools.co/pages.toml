full_description = "You want to analyze a particular feature of the app that you think new users are having a hard time learning and using. You want to gather some information that will help you set the direction for what to do with more substantial qualitative research like journey maps and usability tests. Choose a project management and team collaboration company who will be your imaginary employer for this challenge. Examples include monday.com, taskade.com, clickup.com, basecamp.com, getflow.com, and asana.com. Select a specific feature from your chosen app that you think a new customer could find confusing or difficult to use. This could be something like team task management, project timelines, how the app is generally structured, team communication, or how the mobile app is designed. Create a survey that will allow you to analyze this feature of the app from the perspective of new users and find potential problems. Write the survey questions, perform the survey, and create a report of your findings. Extra Credit: Record the reasoning behind your decisions for each question, how long the survey was, why you picked the tool you used, and how many people you surveyed. When you finish the challenge, post your work on Twitter! Be sure to use the hashtag #uxtoolschallenges and tag our account @uxtoolsco. We'll keep an eye out and repost good examples on a regular basis. We're also building a new community for designers where you'll be able to get even more feedback. See more details. Join 70k+ newsletter subscribers and get a PDF download of all the cards. You'll also stay up to date with weekly lessons and news."
