full_description = "You're a UX designer for a video call company (Zoom is a competitor). You're the only designer on a small team. You and your team have vague, general ideas about who uses your app, but haven't done any real research or gotten into specifics. You need something that will help everyone have a more accurate and empathetic understanding of your users. You want to visualize user attitudes and behaviors, and then have a way to present your findings to your teammates. Choose a specific type of person with a particular reason for using a video calling app. Examples include a young person who wants to keep in touch with their extended family, a salesman who needs to meet with clients, or a remote worker who needs to chat with their teammates. Make an empathy map for the type of user you've selected. You will want to conduct research to inform your empathy map, like interviews, diary studies, or surveys. When you finish the challenge, post your work on Twitter! Be sure to use the hashtag #uxtoolschallenges and tag our account @uxtoolsco. We'll keep an eye out and repost good examples on a regular basis. We're also building a new community for designers where you'll be able to get even more feedback. See more details. Join 70k+ newsletter subscribers and get a PDF download of all the cards. You'll also stay up to date with weekly lessons and news."
