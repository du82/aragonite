title = "UX Challenge – User Interivew | UX Tools"
description = "Do a user interview for a note-taking app."
full_description = "You're a product designer at a startup creating a new note-taking app (competitors are Notion and Evernote). You're in the beginning stages of designing the app. You want to get to know your future users and their current workflows better so you can create a better experience for them. You need to understand things like: What do they use digital notes for? What is their current note-taking process like? Where are the pain points in that process? How do they feel about their current note-taking options? Make a plan for, and carry out, three real user interviews on the subject of digital note-taking. Aim to pull out specific insights that would inform the features and design of a new note-taking app like the one in this challenge. Analyze your findings and put together some recommendations based on what you've learned. When you finish the challenge, post your work on Twitter! Be sure to use the hashtag #uxtoolschallenges and tag our account @uxtoolsco. We'll keep an eye out and repost good examples on a regular basis. We're also building a new community for designers where you'll be able to get even more feedback. See more details. Join 70k+ newsletter subscribers and get a PDF download of all the cards. You'll also stay up to date with weekly lessons and news."
