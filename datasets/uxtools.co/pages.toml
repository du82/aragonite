full_description = "Your team wants to analyze some key tasks that are often performed by new users. You're looking to identify problems and opportunities in the flows for these tasks, and learn a little about the behavior and preferences of new users. Select an online restaurant reservations company who will be your imaginary employer for this challenge. Examples include opentable.com, resy.com, yelp.com, allsetnow.com, and exploretock.com. Perform a usability test with 2–3 participants (people who have never used the product before) on the part of the app where they can set up a new reservation at a restaurant of their choice. To protect their privacy, give them a fake or prepaid credit card number to use during the test, or have them get as far as they can without having to put in a real credit card. Create a report of your findings. When you finish the challenge, post your work on Twitter! Be sure to use the hashtag #uxtoolschallenges and tag our account @uxtoolsco. We'll keep an eye out and repost good examples on a regular basis. We're also building a new community for designers where you'll be able to get even more feedback. See more details. Join 70k+ newsletter subscribers and get a PDF download of all the cards. You'll also stay up to date with weekly lessons and news."
