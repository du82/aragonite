full_description = '''Further insights from interviews with software engineers about how to tactfully handle their UX feedback. Insights from interviews with software engineers about how user research helps them create better experiences. "What an incredible resource you've created! Thank you so much for putting together UX Tools! It's absolutely fantastic! Just wanted to send you warm hugs for your quality work 😄." "I find UX Tools to be very interesting and valuable, I have it pinned on my home screen. I can't help but wonder why I hadn't come across it until recently." "The amount of awesomeness on the UX Tools website is indescribable in words. A song should be created. Or a movie." "Really enjoying all the quality work you guys have been putting out—from the website, articles and this channel. Feeling lucky since I'm pivoting from frontend dev to product design. Cannot wait for more!" "The value you are providing through your website, newsletter and Instagram is absolutely incredible. I have learnt so much from you guys. Thank you so much for everything that you are doing." "I'm a UX teacher (and also a product designer!). Thank you for the resources and the content you create 😄!" After selling my startup in 2015, I worked in Silicon Valley supporting many shapes of work: design teams of one, leading design ops, taking ideas from 0 to 1, scaling teams, and supporting product growth.I woke up one day and realized designers need more apprentice-like education, and UX Tools became my contribution to that belief.My mission is to teach designers how to do their best work in tough conditions and help them evolve their skills as tools, trends, and talent stacks change. Join 70k+ designers who read the UX Tools weekly newsletter. Improve your skills and stay ahead of industry trends and changes in 5 minutes a week.'''
