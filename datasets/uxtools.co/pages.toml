full_description = "Software to create, design, and specify the details of high-fidelity interfaces. This category is the most stable and predictable of all the categories we survey. Respondents seem to use Photoshop and Illustrator secondarily as backup tools for their UI design efforts. These tools didn't gather enough responses to meet our ratings criteria but are still worth checking out. While there's not a lot of AI usage in this category yet, 80% of the 20 respondents who use Uizard as a primary tool are using its AI capabilities. Design ideation is also common in responses. Some responses mentioned using AI to generate wireframes, color palettes, or manipulate screenshots. Respondents don't seem to have any trouble getting their organizations to pay for these tools. Very high adoption rate. The remaining users of Adobe XD are often using it for free—a likely consequence of the pending Adobe acquisition of Figma. The very few respondents who primarily use Photoshop for UI Design are primarily doing so on Windows. Though the sample sizes vary wildly between tools, each tools maintains roughly the same ratio across team sizes (likely as a result of the makeup of team sizes across the industry). We don't think there's any reason to believe that Figma usage is actually falling, and is likely just a fluctuation in our respondent sampling this year. The consistent usage of Photoshop and Illustrator is a testament to how firmmly rooted they are in the industry."
