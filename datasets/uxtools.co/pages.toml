["https://uxtools.co/blog/33-activity-ideas-for-remote-ux-workshops"]
title = "33 Activity Ideas for Remote UX Workshops | UX Tools"
description = "Good group activities are essential in a remote UX workshop. Here are 33 ideas to try in your next meeting, along with tips and recommended tools."
full_description = "33 Activity Ideas for Remote UX Workshops Jordan Bowman · Techniques A good facilitator knows that activities are the building blocks of UX workshops. Getting them right is at the core of creating a workshop that’s worth everyone’s time. Let’s skip all the idle talk about why workshops are important and get straight into a big list of remote-friendly activities. Save this page to reference later when you’re planning your next workshop. Each exercise has a description, an explanation of what circumstances you’d use it in, and a quick tip to make sure things run smoothly. Icebreakers Zombie Cats Pic + Question The Aliens Have Landed Two Truths and a Lie Bucket List Generating Ideas Reverse Brainstorming Postup Storyboarding Crazy 8’s S.C.A.M.P.E.R. Concept Map Roleplay Fishbone Diagram Disney Creative Strategy 4-Up Journey Map Brainwriting Five Why’s T-Chart Processing Ideas Kano Model Dot Voting NUF Test Affinity Diagram How-Now-Wow RICE Impact/Effort Chart Assumption Grid The $100 Test Importance/Urgency Chart Wrap-Up Activities Start, Stop, Continue Playback 4 L’s What? So What? Now What? Quick General Tips for Remote UX Workshops Remote UX Workshop Tools What About You? Icebreakers Icebreakers and team-building activities warm everyone up for the workshop, help them get into the right mindset, create a positive energy, build empathy with teammates, and add context to your everyday work. Zombie Cats Description: Divide into teams. Each team finds two things they have in common and comes up with a team name (like “Zombie Cats”) based on those two things. When to use: You will have teams in your main workshop activities, and you need people to start opening up with conversation and get to know each other. Tip: This can work in any situation, but is particularly helpful when people don’t already know each other well. Pic + Question Description: Set up a board on your online whiteboarding tool with two quadrants for every person. Each participant will fill out their quadrants. In the top one, they’ll put a picture with some kind of category: a random pic from their phone, a photo of something on your desk, etc. In the bottom quadrant, they’ll answer a specific question “What’s something you recently learned?”, “What was your first job?”, “What would be your last meal?”, etc. When to use: Use when you want the participants to get to know each other a bit better and warm up to each other. Tip: Make sure your picture category and question are something anyone can answer and isn’t something that could potentially be uncomfortable. The Aliens Have Landed Description: Tell the group to imagine aliens have landed on Earth and want to learn about your company or product. But since they don’t speak your language, it needs to be explained with five symbols (like emojis) or pictures. Each participant draws or gathers five simple images to communicate with the aliens. Take a minute to look through the images and talk through themes. When to use: Particularly good to use when there are language or cultural differences in the group — everyone can communicate with pictures! Tip: Be sure to explain that the images don’t need to be perfect, and neither does the explanation. Keep it lighthearted. Two Truths and a Lie Description: A popular game that works like this: Each member tells the group three statements about themselves. Everyone else has to guess which of the three statements is a lie. When to use: You want to have fun, get to know everyone, open up some stories that could turn into water cooler chit-chat. Tip: You may want to give participants a heads up before the workshop starts so they can think of statements beforehand. You can use voting features in your online whiteboarding tool to see which statement most people think is the lie. Bucket List Description: Ask people to share one or two big life goals they have. When to use: You have a group that is already familiar with each other, but you want them to open up get to know one another a bit more. Tip: Don’t do this unless you feel like everyone would be comfortable opening up about big life goals. You may want to let them know beforehand that you’ll be asking this question. This is a great way to generate ideas for future team-building activities. Generating Ideas During the main part of the UX workshop, you’ll likely be moving in and out of generating ideas as a group, and then processing those ideas. Use the following activities to prompt participants to think creatively and openly, create an atmosphere that engenders inventiveness, and get the group to pump out lots of on-topic ideas. Reverse Brainstorming Description: Start by either brainstorming problems or with one specific problem you already know exists. Next, instead of thinking about solutions to the problems, think about how they could get even worse. Finally, reverse all these problems into solutions. Evaluate which ideas are feasible. When to use: This is great for making sure solutions are grounded in actual problems, rather than finding problems for your solutions. It’s also fun and can help stimulate creativity when you’re feeling stuck. Tip: This can be useful when you’re dealing with a lot of “We can’t do that” or “That won’t work” in your group. Postup Description: Set a timer, and have all participants write content on sticky notes and post them on the main board. The content can be anything: words, ideas, features, questions, concerns, assumptions, research insights, next steps, etc. When to use: This is a simple, flexible activity that helps you get a bunch of ideas up on the board. You can then discuss and use that as input for a future exercise. Tip: Use time constraints. Ask people to produce a minimum number of sticky notes to make sure everyone gets involved. Explicitly decide beforehand whether people will put their names on the sticky notes. Storyboarding Description: As a group, draw out a specific user scenario or story in sequential panels (like a comic book). This is commonly done in eight panels and participants are given ten minutes to complete the story. The imagery can be very low fidelity (and even use things like emojis) so long as the narrative is communicated. Once the storyboard is complete, analyze it with the whole team and look for key takeaways that affect design decisions. When to use: This technique helps your team visualize the real-life activities of your users, empathize with them, find important moments along their journey, and uncover gaps and problems you can address. Tip: The more research you have to inform this process, the better. Focus on the narrative, not the drawings. Timeboxing forces participants to be okay with capturing ideas imperfectly. Crazy 8’s Description: Everyone gets eight boxes. You set a timer for eight minutes and ask each person to sketch eight quick ideas. Ask everyone to present their top three ideas to the group. When to use: At the beginning stages of ideation. To get your creative juices flowing and generate lots of ideas quickly. Tip: You can repeat this process after people have shared so participants can build off of each others’ ideas. Use a voting tool to decide on which ideas to move forward with. S.C.A.M.P.E.R. Description: Align your team on the concept you’re drumming up ideas for. Brainstorm by working through each letter in the acronym and adding sticky notes to the board: Substitute (What would happen if we swapped X for Y?) Combine (What would happen if we combined X and Y?) Adapt (How could we adapt this to a different context?) Modify (How could we change this to improve results?) Put to Another Use (What other uses might this have?) Eliminate (What could we remove or simplify?) Reverse (How might we rearrange or interchange elements?) When to use: This technique helps you improve ideas by poking at them from different angles. It’s particularly helpful when you have lingering problems and your team is feeling stuck and struggling to come up with fresh ideas. Tip: Try time-boxing each letter and organizing the sticky notes in a mind map structure with the main concept in the center lines pointing to each section surrounding it. Concept Map Description: Similar to a mind map, start with one main goal or concept in a node. Use lines, symbols, colors, images, and words to build out more nodes in a hierarchy. Everyone works together, adds things on their own, and discusses what’s put on the board. When to use: This is good for generating ideas, drawing connections between them, and organizing them into a hierarchical structure. Tip: Many people learn and think better visually than from something like a lengthy essay, and a good concept map plays to these needs. Roleplay Description: Assign people roles and scripts or scenarios, then have them act it out while everyone looks for new insights and ideas. At least one of the people is almost always a user, and you’re usually acting out a specific scenario that is tied to your product or a customer journey. When to use: This forces participants to change how they think about something by helping them see it through someone else’s eyes. This also helps reassess priorities. Tip: Expect people to be uncomfortable, resistant, and awkward at first until they get used to this technique. Reassure people that it’s okay unnatural or silly at first. Try to bring some lightheartedness and fun into the activity. Fishbone Diagram Description: Write a statement that explains exactly what the problem is, including how and when it occurs. Add this to the right side of the diagram, at the fish’s “head”. Figure out broad categories or areas that potential causes of the problem could fall into (no more than ten). Could be things like users, software, communication, and so on. Add these to the ends of the “bones” coming out of the body. Once you have the categories, list out specific, individual causes on the “bones” of the fish under each category. Use these as a basis for diagnosing the root cause of your problem. When to use: You need to diagnose a problem and figure out the root causes. Particularly useful when you don’t have much data available and you can only rely on your team’s experience. Tip: Using the Fishbone Diagram in conjunction with 5 Whys works very well in figuring the real causes of a problem. Disney Creative Strategy Description: This is inspired by Walt Disney’s approach to projects. Divide your board into three sections labeled “the dreamer,” “the realist,” and “the critic.” You’ll take the whole group through each section in the following order that order. Start with the dreaming and imagination section by allowing the team to share lots of ideas with no restrictions or criticism. The goal is to generate many ideas without worrying about how feasible or realistic they are. Next, take on the realist’s approach by thinking more logically and creating an action plan for bringing the ideas to life. Finally, adopt the critic’s mindset by examining your ideas and considering barriers or weaknesses. When to use: This method works when you want to generate ideas and then think through their application in real life. Tip: Make sure you go in the correct order. Consider time-boxing each section so to keep the discussion moving. 4-Up Description: Each person is given four boxes. For four minutes, participants sketch four different wireframes in the boxes for a specific page you’re all working on. There’s no right or wrong — it’s all about quantity, not quality. When to use: At the beginning stages of ideation. You need to generate ideas for general page structure. Also helps reveal what people’s priorities are. Tip: After the initial four minutes is up, you may want to narrow things down. Try using 2-up as a follow-up: two boxes in two minutes; people will start to refine their ideas. You can also group people up and make one wireframe between them, using the best parts from each others’ designs. Or you could use something simple like dot voting. Journey Map Description: Create a journey map together as a team for a specific process or task your users go through. Go through each section of the map one at a time. The more previously completed research you have to back up your decisions, the better. When to use: Use this to build up an understanding of user task or goal that is related to the part of your product that you’re working on. This includes needs, pain points, and opportunities. Tip: If your UX workshop is centered around a specific piece of your product, this method is an excellent way to make the user the focus and build up foundational knowledge that you can refer back to through the entire workshop. It helps if you can base this work on a specific user persona. Note that this technique can also be used as a processing tool for previously-generated ideas. Brainwriting Description: Create columns of sticky notes and add the names of the participants at the top of each column. Introduce the brainstorming concept, set a timer (for something like 2 minutes), and have everyone write their ideas for the concept on the top sticky note. When the timer dings, tell everyone to move to the next column. Start the timer again — this round, participants take the next sticky in the column and add ideas that add to or build upon the ideas above it. Continue like this until everyone has written something in every column. At the end, discuss, vote on, and group the best ideas. When to use: You want to do some quiet group brainstorming, with the ability for individuals to work on their own. This helps every individual be heard, including introverts. Tip: This technique works well in combination with other brainstorming methods like S.C.A.M.P.E.R. Five Why’s Description: Begin with the broadest possible question about why the problem has occurred. Then try to answer it. Take your answer, and ask why that happened. Do this a total of five times and see what the last answer is — that is a key, root cause of your problem and what you should focus your efforts on fixing. When to use: This method is effective for brainstorming the root cause of a problem. Tip: You don’t have to just tackle the last problem — look at other problems you discover along the way and make assignments for looking into fixing those as well. T-Chart Description: Take two ideas or concepts and set up boards for each. The boards should have two quadrants side by side with labels at the top. These labels can be almost anything: pros and cons, facts and opinions, strengths and weaknesses, before and after, then and now, cause and effect, etc. Let your team add sticky notes to each quadrant, one board at a time. Afterward, spot patterns and record new insights. You can also do this with just one idea. When to use: You usually utilize this simple technique to make comparisons between two ideas, or to analyze a single idea. Tip: This technique has a simple structure, but it can help a lot with examining and contrasting concepts. Use e"
