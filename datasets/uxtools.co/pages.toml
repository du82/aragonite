full_description = "Insights from interviews with software engineers about how user research helps them create better experiences. Flexbility and adaptibility are more important than rote processes. Is it ever worth skipping research in your design approach? Lots of new UX research tools are popping up. Which ones can help us make our research more efficient? After conducting research, here are some ways I’ve learned to synthesize it quickly without falling behind. Over the years, I've found a collection of highly-efficient UX research methods that I rely on when I have little time or money. Insightful user research can be expensive. Let's explore how to plan, conduct, synthesize, and document more impactful research. User personas can be controversial and problematic. Is there a way to turn them into a useful resource? There's lots of chatter these days about the importance of user research. But is it worth the effort? Are you intimidated by usability testing? Here are four manageable steps anyone can do to perform a free remote usability test."
