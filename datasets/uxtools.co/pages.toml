title = "UX Challenge – User Persona | UX Tools"
description = "Build a wireframe for a real estate app."
full_description = "You're a UX designer for an online residential real estate company. The website you work on helps renters and buyers find homes, explore neighborhoods, contact agents, and so on (competitors are Zillow and Trulia). This is a young company and you are the first design hire. They have never done user research before. You need to get your bearings and understand the users better. You decide to perform some initial research on the different types of users the website has, and then present these findings to your teammates. Good personas are built off of research, not assumptions. Perform some research with real people who are currently looking (or have looked in the past) for a new home to buy or rent. This can include things like user interviews, diary studies, or surveys. See what personas emerge out of your research (one simple example would be a person who is trying to find an apartment to rent). Pick one and put together a user persona for that type of user using the findings from your research. When you finish the challenge, post your work on Twitter! Be sure to use the hashtag #uxtoolschallenges and tag our account @uxtoolsco. We'll keep an eye out and repost good examples on a regular basis. We're also building a new community for designers where you'll be able to get even more feedback. See more details. Join 70k+ newsletter subscribers and get a PDF download of all the cards. You'll also stay up to date with weekly lessons and news."
