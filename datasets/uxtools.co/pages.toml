full_description = "You were hired as a freelancer to do some user research and design for an airline flight deals website (competitors are Kayak and Expedia). As part of the design process, you need to dive into the user experience of finding and securing a discount flight. You'll be looking for pain points, opportunities, and touch points. Create a journey map for the process of buying an airline flight through a deals app. You'll want to use other research methods such as user interviews or diary studies to gather data. Then you'll use the journey map to show what you've found. Extra Credit: Analyze the map you've made and give two to three specific design recommendations based on the findings. When you finish the challenge, post your work on Twitter! Be sure to use the hashtag #uxtoolschallenges and tag our account @uxtoolsco. We'll keep an eye out and repost good examples on a regular basis. We're also building a new community for designers where you'll be able to get even more feedback. See more details. Join 70k+ newsletter subscribers and get a PDF download of all the cards. You'll also stay up to date with weekly lessons and news."
