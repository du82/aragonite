full_description = '''grommetdocscomponentsstreamline the way you develop appsbuild responsive and accessible mobile-first projects for the web with an easy to use component libraryFollow us on TwitterShare feedback on GitHubChat with us on Slackpart design system, part framework, and all awesomegrommet is a react-based framework that provides accessibility, modularity, responsiveness, and theming in a tidy packageMenuEditConnectDeletemix, match, and make stufftailor composite components with grommet. embrace atomic design methods and build a library that fits your needs.Aaaccessible is being inclusivekeyboard navigation, screen reader tags, and more. grommet provides support for W3c’s WCAG 2.1 spec.Log inGET STARTEDclick mepowerful theming toolstailor the component library to align with your Color, Type, Layout needs. you can even control component interaction.layouts can be more flexiblesupport all the devices! use Flexbox and CSS Grid to provide layouts for all those new phones and widescreen displays.start coding already working on a project, starting fresh, or just want to poke around and see how all this junk works?Start New AppI have an Existing Codebaseand start designingsticker sheets, design patterns, app templates, and icons galore.Grommet DesignerGrommet IconsHello World!don’t take our word for ithere's what our community of designers and developers have to say about grommet@nikmd23Does Material Design feel too "Googly" for you? Check out @grommetux, the OSS UX framework http://bit.ly/1YWH7ea@tomsthoughtfeedAfter two hours of playing with @grommetux, I can confidently say it is the best design tool I have ever used@linghucongGrommet https://grommet.github.io/ great react - redux boilerplate with great user experience@ravishtiwarilooking for Accessible @reactjs UI components, check out https://grommet.github.io @grommetuxgrommet is used by folks at these fine companiesif people from these fine establishments are using it, how can it be bad?but wait there's morewe've been hard at work on making grommet even easier to learn and useGrommet Designerbuild experiences with grommet components; then publish and share your ideas with a simple wysiwg interfaceGrommet Themerwant grommet to look like your brand? plug your details in and share it or import it into to grommet designertry grommetwe want to make grommet the best ui framework on react. so, come for the code and stay for the peeps.componentsdocsGrommet is a PWA. Save it for offline reading.maintained by the core team with the help of our contributors. you can always kick it old school with Grommet v1.'''
