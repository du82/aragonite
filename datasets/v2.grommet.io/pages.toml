f 'date' isn't set, in ISO8601 format.string"2018-10-12"showAdjacentDaysWhether to show the days from the previous and next months.booleantruefalsestring'trim' limits adjacent days shown to rows containing days in the current month."trim"sizeWhat size to make it.stringT-shirt sizing based off the theme or a specific size in px, em, etc."small""medium""large""string"React/DOM PropertiesAt its core, the Calendar component is a regular <div> element. Thus, both DOM and React properties, methods, and events are accessible. To read up on all of the possible DOM attributes and types available for div elements, check out this MDN Web Documents page. To learn more about DOM events and methods, you can read more on the MDN Web Events documentation page.Also, feel free to read about the types of React events available, or see how DOM attributes change in React. Working in tandem with Styled Components, you also have access to the as property.Themecalendar.day.adjacent.colorThe text color to use for dates that are outside of the current month.stringA hex, name, or rgb value."text-xweak"objectAn object with a color for dark and light modes.{ dark: "light-4", light: "dark-3" }calendar.day.hoverAny additional background and color hover style for the Calendar day.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "light-4", light: "dark-3" }calendar.day.selectedAny additional background and color selected style for the Calendar day.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "light-4", light: "dark-3" }calendar.day.selected.font.weightFont weight for the selected date.stringAny browser font-weight definition."normal""bold"number300calendar.day.selected.hoverAny additional background and color hover style for the selected Calendar day.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "light-4", light: "dark-3" }calendar.day.in