 text label.string"18px"text.medium.heightThe line height of the text label.string"24px"button.active.background.colorBackground color when the button is active.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.active.border.colorThe border color when the button is active.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.active.colorLabel color when the button is active.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.active.extendAny additional style for an active Button.stringAny CSS.css`color: 'blue'`function(props) => {}button.active.defaultAdjustments to the default Button style when the Button is active.object{ background: string | object, border: string | object | array, color: string | object, font: { weight: string | number, }, icon: element, padding: { vertical: string, horizontal: string, }, reverse: boolean, extend: any css, }button.active.primaryAdjustments to the primary Button style when the Button is active. Only relevant for themes that have defined a value for button.default.object{ background: string | object, border: string | object | array, color: string | object, font: { weight: string | number, }, icon: element, padding: { vertical: string, horizontal: string, }, reverse: boolean, extend: any css, }button.active.secondaryAdjustments to the secondary Button style when the Button is active. Only relevant for themes that have defined a value for button.default.object{ background: string | object, border: string | object | array, color: string | object, font: { weight: string | number, }, icon: element, padding: { vertical: string, horizontal: string, }, reverse: boolean, extend: any css, }button.badge.container.backgroundThe background of the badge.string"brand"object{ dark: "string", light: "string" } { color: { dark: "string", light: "string" } | "string", dark: bool, image: "string", position: "string", opacity: bool | "string", repeat: "no-repeat" | "repeat", size: "cover" | "contain" | "string" } button.badge.container.extendAny additional styles for the badge.stringAny CSS.css`color: 'blue'`function(props) => {}button.badge.container.padWhen badge has a value, the amount of pad to apply.stringT-shirt sizing based off the theme or a specific size in px, em, etc."small"objectAn object can be specified to distinguish horizontal padding, vertical padding, and padding on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "..." } button.badge.size.mediumThe minimum width and height of the badge when the badge contains a value. If badge is a boolean, the default width and height will be one half of this value.string"24px"button.badge.text.size.mediumThe size of the text that is mapped according to 'button.badge.size.medium'.string"14px"button.border.colorThe color of the border.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.border.radiusThe corner radius.string"18px"button.border.widthThe border width.string"2px"button.colorThe color of the text label.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.default.background.colorThe color of the background for default buttons.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.default.background.opacityThe value used for default button background opacity.string"medium"number0.5button.default.border.colorThe color of the border for default buttons.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.default.colorThe color of the label for default buttons.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.default.directionThe direction of the icon + label.string'row'button.default.font.sizeThe size of the text label for default buttons.string'small'button.default.font.weightThe weight of the text label for default buttons.stringAny browser font-weight definition."normal""bold"number300button.default.extendAny additional style for a default button.stringAny CSS.css`color: 'blue'`function(props) => {}button.default.padding.horizontalThe horizontal padding for a default button.string"22px"button.default.padding.verticalThe vertical padding for a default button.string"4px"button.disabled.colorLabel color when the button is disabled.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }button.disabled.border.colorThe border color when the button is disabled.stringA hex, name, or rgb'''
