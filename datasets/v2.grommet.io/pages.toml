y the index number when using onOrder.booleantruefalsestepHow many items to render at a time.number50React/DOM PropertiesAt its core, the List component is a regular <ol> element. Thus, both DOM and React properties, methods, and events are accessible. To read up on all of the possible DOM attributes and types available for ol elements, check out this MDN Web Documents page. To learn more about DOM events and methods, you can read more on the MDN Web Events documentation page.Also, feel free to read about the types of React events available, or see how DOM attributes change in React. Working in tandem with Styled Components, you also have access to the as property.Themeglobal.hover.backgroundThe background style when hovering over an interactive item.stringA hex, name, or rgb value."active"object{ color: "active", opacity: "medium" }global.hover.colorThe text color when hovering over an interactive item.stringA hex, name, or rgb value."black"objectAn object with a color for dark and light modes.{ dark: "white", light: "black" }list.containerWhen using paginate, any valid Box props for the container surrounding the List and Pagination components.object{ gap: "small" }list.container.extendAny additional style for the container surrounding the List and Pagination components.stringAny CSS.css`color: 'blue'`function(props) => {}list.extendAny additional style for the list.stringAny CSS.css`color: 'blue'`function(props) => {}list.icons.downThe icon to use for the move down button in re-ordable lists.element<FormDown />list.icons.upThe icon to use for the move up button in re-ordable lists.element<FormUp />list.item.backgroundBackground color for list items.string"background"array[string]["background", "background-contrast"]list.item.borderBorder for list items.booleantruefalsestring"horizontal"object { color: "string" | { dark: "string", light: "string" }, side: "horizontal", size: "small" } list.item.disabled.colorFont color when disabled.string"status-disabled"object{ dark: "string", light: "string" }list.item.disabled.cursorCSS cursor type when disabled.string"default"list.item.padPad for list items.booleantruefalsestring"small"object{ horizontal: "medium", vertical: "small" }list.item.extendAny additional style for the list items.stringAny CSS.css`color: 'blue'`function(props) => {}list.primaryKeyobjectPrimary key styling accepts any Text props.{ weight: 'bold' }'''
