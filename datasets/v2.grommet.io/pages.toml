d of the Layer overlay.string"rgba(0, 0, 0, 0.5)"layer.responsiveBreakpointThe actual breakpoint to trigger changes in the border, direction, gap, margin, pad, and round.string"small"layer.zIndexThe stack order of Layer.number20global.breakpointsThe possible breakpoints that could affect border, direction, gap, margin, pad, and round.object { small: { value: 768, borderSize: { xsmall: "1px", small: "2px", medium: "4px", large: "6px", xlarge: "12px" }, edgeSize: { none: "0px", hair: "1px", xxsmall: "2px", xsmall: "3px", small: "6px", medium: "12px", large: "24px", xlarge: "48px" }, size: { xxsmall: "24px", xsmall: "48px", small: "96px", medium: "192px", large: "384px", xlarge: "768px", full: "100%" } }, medium: { value: 1536 }, large: {} }'''
