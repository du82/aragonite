ent Grid.string"a parent grid area name"itemKeyThe key to apply to each item in the List.stringThe property name of a data object."id"function(item) => key-{item.id}itemPropsItem specific background, border, and pad, keyed by data index. The background, border, and pad accept the same values as the same named properties on List.object{ 27: { background: ..., border: ..., pad: ... }}marginThe amount of margin around the component.string"none""xxsmall""xsmall""small""medium""large""xlarge"objectCan be specified to distinguish horizontal margin, vertical margin, and margin on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "..." } onActiveWhen provided, this is called with the index of the item that the user has either moused over or navigated to with their keyboard.function(index) => {}onClickItemWhen supplied, this function will be called with an event object which includes an 'item' property containing the data value associated with the clicked item and an 'index' property containing the index in 'data' of the clicked item. You should not include interactive elements, like Anchor or Button inside 'primaryKey' or 'secondaryKey' as that can cause confusion with overlapping interactive elements.function({ item, index }) => {}onMoreUse this to indicate that 'data' doesn't contain all that it could. It will be called when all of the data items have been rendered. This might be used when the total number of items that could be retrieved is more than you'd want to load into the browser. 'onMore' allows you to lazily fetch more from the server only when needed.function() => {}onOrderUse this to indicate that the user should be allowed to re-order the data items. This cannot be used with 'paginate' or 'onClickItem'. The function will be called with the array of items in their new order when the user moves items via drag and drop or the move up/down controls.function() => {}padItem padding.stringT-shirt sizing based off 