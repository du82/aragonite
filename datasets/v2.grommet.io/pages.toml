e, if the values are [27.35, 9.47], higher coarseness would bound it from 0-50, lower coarseness would bound it from 9-28.number5stepsAffects the stepping of the axis values.array[1, 1]returnsboundsAn array of arrays suitable for use with the Chart bounds property.array[[0, 2], [0, 100]]thicknessA string suitable for use with the Chart thickness property.string"medium"padA string suitable for use with the Chart pad property.string"medium"axesAn array of arrays. The first array is for X axis values. The second array is for Y axis values.array[[0, 1, 2], [0, 50, 100]]The X axis values could be rendered however you like, perhaps with something like:<Box direction="row" justify="between" gap="small"> {axis[0].map(a => <Text color="text-xweak" />)} </Box>'''
