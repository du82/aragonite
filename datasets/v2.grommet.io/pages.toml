full_description = '''grommetdocscomponentsFormFielda single field in a formStorybookCodeSandboxGithubPropsa11yTitleCustom label to be used by screen readers. Should only be provided if FormField has no children. When a11yTitle is provided an aria-label will be added to the element if it has no children.string"a user friendly label for screen readers"componentThe component to insert in the FormField. Grommet will update the form values when this field changes. Any additional properties (such as initial value) you pass to FormField will be forwarded to this component. The component may be custom as long it supports the properties of name, value, onChange (event => {}), while event has either event.value or event.target.value.objectTextAreafunctionprops => <input {...props} />contentPropsAny valid Box property.objectThese properties are applied to the FormField contents container and will override properties from the theme.{}disabledWhether the field should look disabled.booleantruefalseerrorAny error text describing issues with the field's value.string"Text to call attention to an issue with this field"node{<Box>...</Box>}helpAny help text describing how the field works.string"Text to help the user know what is possible"node<Box>...</Box>htmlForThe id of the input element contained in this field.string"input-id"infoAny informational text regarding the field's value.string"Additional information to give the user better context of the FormField."node<Box>...</Box>labelA short label describing the field.string"label"node<Box>...</Box>marginThe amount of margin around the component.string"none""xxsmall""xsmall""small""medium""large""xlarge"objectCan be specified to distinguish horizontal margin, vertical margin, and margin on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "..." } nameThe name of the value data when in a Form and the name of the input field.NOTE: A name must be provided if using FormField's validate prop.string"name"padWhether to add padding to align with the padding of TextInput.booleantruefalserequiredWhether the field is required. If formField.requiredIndicator = true in your theme, passing indicator: false will not display the required indicator for the given field.booleantruefalseobjectrequired={{ indicator: false }}validateValidation rule when used within a grommet Form. Provide an object with a regular expression, a function, or an array of these.NOTE: In order to use validate, a name must first be provided to the FormField.objectAn object with max and (optionally) threshold can be used to implement a character counter. { regexp: regular expression, message: "string" | node, status: "error" | "info" } { max: number, threshold: number, } functionIf a function is provided, it will be called with two arguments, the value for this field and the entire value object. This permits validation to encompass multiple fields. The function should return a string message describing the validation issue, if any, or an object with 'message' and 'status' properties.() => {}array [ { regexp: regular expression, message: "string" | node, status: "error" | "info" }, function ] validateOnWhen to perform validationstring"blur""submit""change"React/DOM PropertiesAt its core, the FormField component is a regular <div> element. Thus, both DOM and React properties, methods, and events are accessible. To read up on all of the possible DOM attributes and types available for div elements, check out this MDN Web Documents page. To learn more about DOM events and methods, you can read more on the MDN Web Events documentation page.Also, feel free to read about the types of React events available, or see how DOM attributes change in React. Working in tandem with Styled Components, you also have access to the as property.ThemeformField.border.colorThe border color.stringA hex, name, or rgb value."border"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }formField.border.error.colorThe border color of the error. Deprecated, use error.border.color instead.stringA hex, name, or rgb value."status-critical"objectAn object with a color for dark and light modes.{ dark: 'white', light: 'status-critical' }formField.border.positionThe border position.string"inner"formField.border.sideThe border side of the FormField.string"bottom"formField.checkBox.padThe CheckBox pad when wrapped in FormField.stringT-shirt sizing based off the theme or a specific size in px, em, etc."none""xxsmall""xsmall""small""medium""large""xlarge""any CSS size"objectAn object can be specified to distinguish horizontal padding, vertical padding, and padding on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "...", start: "...", end: "..." } formField.content.marginThe margin of the FormField content.string"none""xxsmall""xsmall""small""medium""large""xlarge"objectCan be specified to distinguish horizontal margin, vertical margin, and margin on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "..." } formField.content.padThe pad of the FormField content.stringT-shirt sizing based off the theme or a specific size in px, em, etc."none""xxsmall""xsmall""small""medium""large""xlarge""any CSS size"objectAn object can be specified to distinguish horizontal padding, vertical padding, and padding on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "...", start: "...", end: "..." } formField.disabled.background.colorThe color of the FormField background when it is disabled.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }formField.disabled.background.opacityThe opacity of the FormField background when it is disabled.booleantruefalsestring"medium"number0.5formField.disabled.border.colorThe color of the FormField border when it is disabled.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }formField.disabled.label.colorThe color of the FormField label when it is disabled.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }formField.error.background.colorThe color of the FormField background when there is an error.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }formField.error.background.opacityThe opacity of the FormField background when there is an error.booleantruefalsestring"medium"number0.5formField.error.border.colorThe border color of the error.stringA hex, name, or rgb value."status-critical"objectAn object with a color for dark and light modes.{ dark: "white", light: "status-critical" },formField.error.colorThe color of the FormField error.stringA hex, name, or rgb value."status-critical"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" },formField.error.containerAny valid Box props for the container surrounding the error message and icon.object{}formField.error.iconAn icon placed in a row with the error message.element<Icon />formField.error.sizeThe size of the error message to be displayed.string"medium"formField.error.size.xsmallThe size of a 'xsmall' error message.string"12px"formField.error.size.smallThe size of a 'small' error message.string"14px"formField.error.size.mediumThe size of a 'medium' error message.string"18px"formField.error.size.largeThe size of a 'large' error message.string"22px"formField.error.size.xlargeThe size of a 'xlarge' error message.string"26px"formField.info.containerAny valid Box props for the container surrounding the info message and icon.object{}formField.info.iconAn icon placed in a row with the info message.element<Icon />formField.error.marginThe margin used for the FormField error.string"small"object{ vertical: "xsmall", horizontal: "small" }formField.focus.background.colorThe color of the FormField background when it is in focus.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }formField.focus.border.colorThe color of the FormField border when it is in focus.stringA hex, name, or rgb value."brand"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }formField.extendAny additional style for FormField.stringAny CSS.css`color: 'blue'`function(props) => {}formField.help.colorThe color of the FormField help.stringA hex, name, or rgb value."dark-3"objectAn object with a color for dark and light modes.{ dark: "dark-3", light: "dark-3" }formField.help.marginThe margin for the FormField help.string"small"object{ start: "small" }formField.kind.labelAny props of Text that will be applied on the FormField kind label.object { size: 'large', color: 'black', margin: { vertical: "xsmall", } } formField.info.colorThe color of the FormField info.stringA hex, name, or rgb value."text-xweak"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" },formField.info.marginThe margin used for the FormField info.string"small"object{ vertical: "xsmall", horizontal: "small" }formField.labelAny props of Text that will be applied on the FormField label.object { margin: { vertical: "xsmall", horizontal: "small" } } formField.label.marginThe margin for the FormField label.string"small"object{ vertical: "xsmall", horizontal: "small" }formField.label.requiredIndicatorWhether an asterisk (*) indicating that an input is required should be displayed adjacent to the FormField's label.booleanIf using "true", the a11yTitle is automatically applied.truefalseelementIf providing a custom element, for accessibility it is recommended that you include an a11yTitle of "required" to assist screen readers.<Box a11yTitle="required">...