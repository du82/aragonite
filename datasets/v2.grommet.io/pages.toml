ine ends.booleantruefalsesizeThe size of the Chart. 'full' is deprecated as 'fill' is more consistent with how that term is used elsewhere.stringT-shirt sizing based off the theme or a specific size in px, em, etc."xxsmall""xsmall""small""medium""large""xlarge""fill""full""any CSS size"object{"height": "...", "width": "..."}thicknessThe width of the stroke.stringT-shirt sizing based off the theme or a specific size in px, em, etc."none""hair""xsmall""small""medium""large""xlarge""string"number5typeThe visual type of chart.string"bar""line""area""point"valuesArray of value objects describing the data.array'value' is a tuple indicating the coordinate of the value or a triple indicating the x coordinate and a range of two y coordinates. 'label' is a text string describing it. 'onHover' and 'onClick' only work when type='bar'. 'color', 'opacity', and 'thickness' allow bar and point charts to have color variation per-value.[ 10, 20 ][ [10, 20], [20, 30] ] [ { color: "string" | { dark: "string", light: "string" }, label: "string", onClick: function, onHover: function, opacity: "string" | number | boolean, thickness: "string", value: "..." }, ] Themechart.colorColor of the Chart.stringA hex, name, or rgb value."graph-0"objectAn object with a color for dark and light modes.{ dark: "string", light: "string" }chart.extendAny additional style for the Chart.stringAny CSS.css`color: 'blue'`function(props) => {}global.colorsColor options.object { "icon": { "dark": "#f8f8f8", "light": "#666666" }, "active": "rgba(221, 221, 221, 0.5)", "background-back": { "dark": "#33333308", "light": "#EDEDED" }, "background-front": { "dark": "#444444", "light": "#FFFFFF" }, "background-contrast": { "light": "#33333310", "dark": "#FFFFFF18" }, "active-background": "background-contrast", "active-text": "text-strong", "black": "#000000", "border": { "dark": "rgba(255, 255, 255, 0.33)", "light": "rgba(0, 0, 0, 0.33)" }, "brand": "#7D4CDB", "control": { "dark": "graph-0", "light": "brand" }, "focus":