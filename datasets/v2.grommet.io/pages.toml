title = "Button - Grommet"
full_description = '''grommetdocscomponentsButtonStorybookCodeSandboxGithubUsing Grommet for HPE?See Button examples and guidance. A grommet Button is used for anything that looks like a button on the screen. If an href is provided, it will be rendered in the DOM with <a/>. An Anchor component should be used for inline anchors within textual contexts.In May 2020, we enhanced Button to have three kinds, outlined below. In order to maintain backwards compatibility, this approach is only available when the theme being used defines button.default.defaultThe majority of Buttons on the page. Their affordance is primarily driven by their context, in a Nav in a Header or Sidebar, the corner of a tile or card, etc.primaryThe primary call to action. There should typically be at most one primary Button on the screen. In a Form context, it signifies the action bound to the enter key that will submit the form.secondaryWhen there isn’t enough context to indicate its affordance, or when it should call extra attention to itself but isn’t the primary call to action, use a secondary Button. Secondary buttons are only available when the underlying theme being used defines button.default.Propsa11yTitleCustom label to be used by screen readers. When provided, an aria-label will be added to the element.string"a user friendly label for screen readers"activeWhether the button is active.booleantruefalsealignSelfHow to align along the cross axis when contained in a Box or along the column axis when contained in a Grid.string"start""center""end""stretch""baseline"asThe DOM tag or react component to use for the element.stringThe name of a component."div"function() => {}elementA specific element to use, such as a router element like Link from react-router-dom.LinkbadgeAn indicator to show on the top-right of the Button. For accessibility, supplement the badge by adding an a11yTitle to the Button which provides a useful message to screen readers. For example, "2 unread notifications".booleanWhen badge is a boolean, the badge will be a circle with background color 'brand'.truefalseelement<Box>...</Box>numberWhen badge is a number, that number will appear inside the badge.10objectWhen badge is an object, background refers to the background color of the badge, value refers to either the numeric value that appears within the badge or a boolean if background has been defined on the object but no numeric content is desired, and max refers to the max value that can appear inside the badge. For example, if value is 10 and max is 9, the content in the badge will be displayed as 9+. { background: { color: "...", dark: "...", image: "string", position: "string", opacity: "...", repeat: "...", size: "...", light: "string" } max: number, value: "..." } where color could be:"string"{ dark: "string", light: "string" }where dark could be:boolean"string"where opacity could be:booleannumber"weak""medium""strong"where repeat could be:"no-repeat""repeat""string"where size could be:"cover""contain""string"where value could be:booleannumberbusyWhether the button is in a busy state and should display an animation to indicate this.booleantruefalsechildrenFunction that can be called to render the visual representation. When Button has children, it is styled as a plain button.function'disabled', 'hover', and 'focus' can be passed as an argument that would then return a react element.({ disabled, hover, focus }) => {<Box>...</Box>}objectnode<Box>...</Box>colorFill color for primary, label color for plain, border color otherwise. If button.default is defined in the theme, the color prop will fill the background color for primary and secondary button types. Color prop will change the text color for default button.stringA hex, name, or rgb value."control"objectAn object with a color for dark and light modes. { dark: "string", light: "string" }disabledWhether the button is disabled.booleantruefalsefillWhether the button expands to fill all of the available width and/or height.string"horizontal""vertical"booleantruefalsefocusIndicatorWhether when 'plain' it should receive a focus outline.booleantruefalsegapThe amount of spacing between icon and label in the button.stringT-shirt sizing based off the theme or a specific size in px, em, etc."xxsmall""xsmall""small""medium""large""xlarge""string"gridAreaThe name of the area to place this inside a parent Grid.string"a parent grid area name"hoverIndicatorThe hover indicator to apply when the user is mousing over the button. This prop is meant to be used only with plain Buttons.booleantruefalsestring"background"objectAn object defining the background or the background and elevation. { color: "...", dark: "...", image: "string", position: "string", opacity: "...", repeat: "...", size: "...", light: "string" } { background: { color: "...", dark: "...", image: "string", position: "string", opacity: "...", repeat: "...", size: "...", light: "string" }, elevation: "..." } where color could be:"string"{ dark: "string", light: "string" }where dark could be:boolean"string"where opacity could be:booleannumber"weak""medium""strong"where repeat could be:"no-repeat""repeat""string"where size could be:"cover""contain""string"where elevation could be:"none""xsmall""small""medium""large""xlarge""string"hrefIf specified, the button will behave like an anchor tag.string"//my.com/path"iconIcon element to place in the button. For accessibility with screen readers, if using just an icon (no label), add an a11yTitle to the Button that describes the icon.element<Add />justifyHow to align the contents within the button.string"around""between""center""end""evenly""start""stretch"labelLabel text to place in the button.string"label"node<Box>...</Box>marginThe amount of margin around the component.string"none""xxsmall""xsmall""small""medium""large""xlarge"objectCan be specified to distinguish horizontal margin, vertical margin, and margin on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "..." } messagesMessages for a screenreader to announce when the button busy or success state changes.object{ "busy": "button is in a busy state", "success": "button action succeeded" }onClickClick handler. Not setting this property and not specifying a href causes the Button to be disabled.function() => {}padThe amount of padding around the Button contents.stringT-shirt sizing based off the theme or a specific size in px, em, etc."none""xxsmall""xsmall""small""medium""large""xlarge""any CSS size"objectAn object can be specified to distinguish horizontal padding, vertical padding, and padding on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "...", start: "...", end: "..." } plainWhether this is a plain button with no border or pad. Non plain button will show both pad and border. When using the kind button (i.e. button.default on the theme), the usage of plain is deprecated.booleantruefalseprimaryWhether this is a primary button. There should be at most one per page or screen.booleantruefalsereverseWhether an icon and label should be reversed so that the icon is at the end of the anchor.booleantruefalsesecondaryWhether this is a secondary button.booleantruefalsesizeThe possible sizes of Button, that impacts the overall Button padding, border radius, text size and line height. 'size' will not impact any icon related sizing.string"small""medium""large"successWhether the button is in a success state and should display an animation to indicate this.booleantruefalsetargetSpecifies where to display the URL defined in the href property.string"_self""_blank""_parent""_top""string"tiptooltip or a hint when hovering over the button.stringIf the value is a string and no a11yTitle value is provided, tip value will be used for the a11yTitle default value."example tooltip"object { content: node | "string", dropProps: {...} plain: boolean } typeThe type of button. Set the type to submit for the default button on