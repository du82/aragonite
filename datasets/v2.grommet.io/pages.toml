xxsmall""xsmall""small""medium""large""xlarge"objectCan be specified to distinguish horizontal margin, vertical margin, and margin on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "..." } onClickOutsideFunction that will be invoked when the user clicks outside the drop.function() => {}onEscFunction that will be called when the user presses the escape key inside the drop.function() => {}overflowHow to control the overflow inside the drop.string"auto""hidden""scroll""visible""string"object { horizontal: "...", vertical: "..." } plainWhether the drop element should have no background, elevation, margin or round.booleantruefalseresponsiveWhether to dynamically re-place when resized.booleantruefalserestrictFocusWhether focus should be moved to the Drop container if no element within the Drop had autoFocus placed on it.booleantruefalseroundHow much to round the corners.booleantruefalsestring"xsmall""small""medium""large""xlarge""full""string"object { corner: "...", size: "..." } where corner could be:"top""left""bottom""right""top-left""top-right""bottom-left""bottom-right"stretchIf set to true the drop element will be stretched to at least match the width of the target element. The default is true because that is what most uses of Drop want, like Select and Menu.stringIf set to align the width of the drop element will be restricted to the width of the target element."align"booleantruefalsetargetTarget where the drop will be aligned to.objectThis should be a React reference.targetRef.currenttrapFocusTraps keyboard focus inside of drop.booleantruefalseReact/DOM PropertiesAt its core, the Drop component is a regular <div> element. Thus, both DOM and React properties, methods, and events are accessible. To read up on all of the possible DOM attributes and types available for div elements, check out this MDN Web Documents page. To learn more about DOM events and methods, you can read more on the MDN Web Events documentation page.Also, feel free to read about the types of React events available, or see how DOM attributes change in React. Working in tandem with Styled Components, you also have access to the as property.Themedrop.maxHeightThe max height of the Drop container.string"small"global.drop.backgroundThe background color of Drop.stringA hex, name, or rgb value."white"objectAn object with a color for dark and light modes.{ dark: "black", light: "white" }global.drop.border.radiusThe border radius of the Drop container.string"0px"global.drop.extendAny additional style for Drop.stringAny CSS.css`color: 'blue'`function(props) => {}global.drop.intelligentMarginWhether the margin of the Drop should adapt based on the Drop's alignment with respect to its target. Margin will only be applied on the side of the Drop that is adjacent to its target.booleantruefalseglobal.edgeSizeThe possible sizes for the Drop margin.object { none: '0px', hair: '1px', xxsmall: '3px', xsmall: '6px', small: '12px', medium: '24px', large: '48px', xlarge: '96px', responsiveBreakpoint: 'small' } global.drop.elevationElevated height above the underlying context, indicated via a drop shadow.string"small"global.drop.marginThe margin of the drop from the target.string"none""xxsmall""xsmall""small""medium""large""xlarge"objectCan be specified to distinguish horizontal margin, vertical margin, and margin on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "..." } global.drop.shadowSizeDeprecated. Use 'global.drop.elevation' instead.string"small"global.drop.zIndexThe stack order of the Drop.number20'''
