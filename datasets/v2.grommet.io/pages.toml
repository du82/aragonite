full_description = '''grommetdocscomponentsFileInputa control to input one or more filesStorybookGithubUsing Grommet for HPE?See FileInput examples and guidance. PropsconfirmRemoveProvides custom rendering of a confirmation that appears when the user attempts to remove a file or files.functionThe function will be passed an object containing 'onConfirm' and 'onCancel' callbacks. If 'onConfirm' is called, the file will be removed. If 'onCancel' is called, the file will remain.({ onConfirm, onCancel }) => ( <Layer onClickOutside={onCancel} onEsc={onCancel}> <Box> Are you sure you want to delete this file? <Box direction="row" gap="small"> <Button label="Cancel" onClick={onCancel} /> <Button label="Delete file" onClick={onConfirm} /> </Box> </Box> </Layer> )disabledWhether the control is disabled.booleantruefalseidThe id attribute of the input.string"file-input-id"maxSizeSpecifies a file size limit in bytes (binary) for FileInput.number5000messagesCustom messages for FileInput. Used for accessibility by screen readers.object { browse: "browse", dropPrompt: "Drop file here or", dropPromptMultiple: "Drop files here or", files: "files", remove: "remove", removeAll: "remove all", maxFile: "Attach a maximum of {max} files only." } multipleWhether to allow multiple files.booleantruefalseobjectIf an object is supplied, 'aggregageThreshold' indicates the maximum number of individual files to show. Above this, only a single message describing the number of files will be shown. 'max' indicates the maximum number of files that can be added. { aggregateThreshold: number, max: number } nameThe name attribute of the input. This is required when used within a Form.string"name"onChangeFunction that will be called when one or more files are added to or removed from the input.functionThe function will be passed two arguments: the event and an object with key 'files'. The file(s) can be found in event.target.files or by deconstructing files from the second argument. For example: (event, {files}) => {}.({ target: { files } }) => {...}renderFileProvides custom rendering of the file. If not provided, the file's name will be shown.functionThe function will be passed the browser File object as an argument.(file) => { <Text>{file.name}</Text> }React/DOM PropertiesAt its core, the FileInput component is a regular <input> element. Thus, both DOM and React properties, methods, and events are accessible. To read up on all of the possible DOM attributes and types available for input elements, check out this MDN Web Documents page. To learn more about DOM events and methods, you can read more on the MDN Web Events documentation page.Also, feel free to read about the types of React events available, or see how DOM attributes change in React. Working in tandem with Styled Components, you also have access to the as property.Themeglobal.input.font.heightThe line-height of the text.string"normal"global.input.font.sizeThe size of the text.string"18px"global.input.font.weightThe font-weight of the text. This value will only be applied if global.input.weight is undefined.string"bold"number600global.input.weightThis value has been deprecated and replaced by global.input.font.weight.string"bold"number300global.input.paddingThe padding of the text.string"12px"objectAn object specifying padding for different sides of the component. { top: "string", bottom: "string", left: "string", right: "string", horizontal: "string", vertical: "string" }global.input.extendAny additional style for an input.stringAny CSS.css`color: 'blue'`function(props) => {}fileInput.backgroundThe background prop for the container.stringA color or image url."neutral-1""url(//my.com/assets/img.png)"object { color: "neutral-1", dark: true, image: "url(//my.com/assets/img.png)" position: "bottom", opacity: true, repeat: "no-repeat", size: "cover", light: "string" } where opacity could be:"weak""medium""strong"booleannumberwhere position could be:any CSS for background-positionwhere repeat could be:"no-repeat""repeat""string"where size could be:"cover""contain""string"fileInput.borderThe border prop for the container.string"horizontal""vertical""top""bottom""right""left"object { side: "all", size: "small", style: "dashed" } { color: "string" | { dark: "string", light: "string" }, error: { color: "string" | { dark: "string", light: "string" } }, position: "string", side: "string", size: "string", style: "string" } fileInput.dragOver.backgroundBackground to use when dragging over.stringA color or image url."neutral-1""url(//my.com/assets/img.png)"object { color: "neutral-1", dark: true, image: "url(//my.com/assets/img.png)" position: "bottom", opacity: true, repeat: "no-repeat", size: "cover", light: "string" } where opacity could be:"weak""medium""strong"booleannumberwhere position could be:any CSS for background-positionwhere repeat could be:"no-repeat""repeat""string"where size could be:"cover""contain""string"fileInput.dragOver.borderBorder to use when dragging over.string"horizontal""vertical""top""bottom""right""left"object { color: "string" | { dark: "string", light: "string" }, error: { color: "string" | { dark: "string", light: "string" } }, position: "string", side: "string", size: "string", style: "string" } fileInput.dragOver.extendAny additional style for container when dragging over it.stringAny CSS.css`color: 'blue'`function(props) => {}fileInput.extendAny additional style for container.stringAny CSS.css`color: 'blue'`function(props) => {}fileInput.hover.backgroundBackground to use when hovering.stringA color or image url."neutral-1""url(//my.com/assets/img.png)"object { color: "neutral-1", dark: true, image: "url(//my.com/assets/img.png)" position: "bottom", opacity: true, repeat: "no-repeat", size: "cover", light: "string" } where opacity could be:"weak""medium""strong"booleannumberwhere position could be:any CSS for background-positionwhere repeat could be:"no-repeat""repeat""string"where size could be:"cover""contain""string"fileInput.hover.borderBackground to use when hovering.string"horizontal""vertical""top""bottom""right""left"object{ color: "brand" } { color: "string" | { dark: "string", light: "string" }, error: { color: "string" | { dark: "string", light: "string" } }, position: "string", side: "string", size: "string", style: "string" } fileInput.hover.extendAny additional style for container when hovering over it.stringAny CSS.css`color: 'blue'`function(props) => {}fileInput.icons.removeThe icon to use for the control to remove a chosen file.React.Element<FormClose />fileInput.labelThe Text props to use for the file label.object{ margin: "small" }fileInput.messageThe Text props to use for the message shown before a file has been selected.object{ margin: "small" }fileInput.padThe pad prop for the container.stringT-shirt sizing based off the theme or a specific size in px, em, etc."none""xxsmall""xsmall""small""medium""large""xlarge""any CSS size"objectAn object can be specified to distinguish horizontal padding, vertical padding, and padding on a particular side. { vertical: "...", horizontal: "...", top: "...", bottom: "...", left: "...", right: "...", start: "...", end: "..." } fileInput.roundThe round prop for the container.string"xsmall""small""medium""large""xlarge""full""string"object { corner: "...", size: "..." } where corner could be:"top""left""bottom""right""top-left""top-right""bottom-left""bottom-right"'''
