["https://v2.nuxt.com/docs/get-started/installation"]
title = "Nuxt 2 - Installation"
description = "Here, you will find information on setting up and running a Nuxt project in 4 steps."
full_description = '''Table of Contents Table of Contents Online playground Prerequisites Using create-nuxt-app Manual Installation Set up your project Install Nuxt Create your first page Start the project Bonus step Installation Here, you will find information on setting up and running a Nuxt project in 4 steps. Online playground You can play with Nuxt online directly on CodeSandbox or StackBlitz: Play on CodeSandbox Play on StackBlitz Prerequisites node - We recommend you have either 16.x or 14.x installed. A text editor, we recommend VS Code with the Volar extension or WebStorm . A terminal, we recommend using VS Code's integrated terminal or WebStorm terminal . Using create-nuxt-app To get started quickly, you can use create-nuxt-app . Make sure you have installed yarn, npx (included by default with npm v5.2+) or npm (v6.1+). Yarn NPX NPM PNPM Yarnyarn create nuxt-app <project-name> NPXnpx create-nuxt-app <project-name> NPMnpm init nuxt-app <project-name> PNPMpnpm create nuxt-app <project-name> It will ask you some questions (name, Nuxt options, UI framework, TypeScript, linter, testing framework, etc). To find out more about all the options see the create-nuxt-app documentation . Once all questions are answered, it will install all the dependencies. The next step is to navigate to the project folder and launch it: Yarn NPM PNPM Yarncd <project-name> yarn dev NPMcd <project-name> npm run dev PNPMcd <project-name> pnpm dev The application is now running on http://localhost:3000 . Well done! Another way to get started with Nuxt is to use CodeSandbox which is a great way for quickly playing around with Nuxt and/or sharing your code with other people. Manual Installation Creating a Nuxt project from scratch only requires one file and one directory. We will use the terminal to create the directories and files, feel free to create them using your editor of choice. Set up your project Create an empty directory with the name of your project and navigate into it: mkdir <project-name> cd <project-name> Replace <project-name> with the name of your project. Create the package.json file: touch package.json Fill the content of your package.json with: package.json{ "name": "my-app", "scripts": { "dev": "nuxt", "build": "nuxt build", "generate": "nuxt generate", "start": "nuxt start" } } scripts define Nuxt commands that will be launched with the command npm run <command> or yarn <command>. What is a package.json file? The package.json is like the ID card of your project. It contains all the project dependencies and much more. If you don't know what the package.json file is, we highly recommend you to have a quick read on the npm documentation . Install Nuxt Once the package.json has been created, add nuxt to your project via npm or yarn like so below: Yarn NPM PNPM Yarnyarn add nuxt NPMnpm install nuxt PNPMpnpm add nuxt --shamefully-hoist This command will add nuxt as a dependency to your project and add it to your package.json. The node_modules directory will also be created which is where all your installed packages and dependencies are stored. A yarn.lock or package-lock.json is also created which ensures a consistent install and compatible dependencies of your packages installed in your project. Create your first page Nuxt transforms every *.vue file inside the pages directory as a route for the application. Create the pages directory in your project: mkdir pages Then, create an index.vue file in the pages directory: touch pages/index.vue It is important that this page is called index.vue as this will be the default home page Nuxt shows when the application opens. Open the index.vue file in your editor and add the following content: pages/index.vue<template> <h1>Hello world!</h1> </template> Start the project Run your project by typing one of the following commands below in your terminal: Yarn NPM PNPM Yarnyarn dev NPMnpm run dev PNPMpnpm dev We use the dev command when running our application in development mode. The application is now running on http://localhost:3000 . Open it in your browser by clicking the link in your terminal and you should see the text "Hello World" we copied in the previous step. When launching Nuxt in development mode, it will listen for file changes in most directories, so there is no need to restart the application when e.g. adding new pages When you run the dev command it will create a .nuxt folder. This folder should be ignored from version control. You can ignore files by creating a .gitignore file at the root level and adding .nuxt. Bonus step Create a page named fun.vue in the pages directory. Add a <template></template> and include a heading with a funny sentence inside. Then, go to your browser and see your new page on localhost:3000/fun . Creating a directory named more-fun and putting an index.vue file inside it will give the same result as creating a more-fun.vue file. Edit this page on GitHub Updated at Mon, Aug 19, 2024 Sébastien Chopin Nazaré da Piedade Nobu 川音리오 Maciek Palmowski Nestor Vera Daniel Roe Yue Yang Jeronimas Clément Ollivier Alexander Lichter N3-rd Adrien Zaganelli Mag Stefan Huber Olga Bulat Paiva Florian Reuschel Savas Vedova HIJACK Vinícius Alves Kareem Dabbeet Valentín Costa Ryan Skinner Alex Hirzel Ajeet Chaulagain René Eschke Nico Devs Muhammad Naoki Hamada Tom Yann Aufray Anthony Chu Nuzhat Minhaz Lucas Portet Richard Schloss Bobby bpy Antony Konstantinidis Hibariya Jose Seabra Eze Florian Lefebvre Lucas Recoaro Julien SEIXAS'''
