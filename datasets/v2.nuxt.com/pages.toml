["https://v2.nuxt.com"]
title = "Nuxt 2 - The Intuitive Vue Framework"
description = "Build your Vue 2 application with confidence using Nuxt 2. An open source framework making web development simple and powerful."
full_description = "Nuxt development is carried out by passionate developers, but the amount of effort needed to maintain and develop new features is not sustainable without proper financial backing. We are thankful for our sponsors and partners, who help make Nuxt possible. Technology partners offer services that empower Nuxt developers, such as CMS, Hosting, Database, and more. Agency partners are trusted web and consulting agencies that can provide Nuxt development and support for your projects. Discover our list of modules to supercharge your Nuxt project. Created by the Nuxt team and community. See how a real world application is built using the Nuxt stack with the themes built by our partners. With Nuxt version 2.13, the full-static mode has been introduced. In addition, a new command nuxt export was added to pre-render your pages without triggering a webpack build with the goal to separate the rendering and build process. The only issue was that most Nuxt users weren't able to unleash the full potential of the separation... until now. We'll take a tour of Nuxt 3, creating, building and deploying a real, live-coded app to a serverless environment. We'll talk about how changing requirements in today's serverless world require frameworks to change, and how that makes a difference for UX and performance. Nuxt offers a compelling solution and a great ecosystem to help you ship fullstack Vue apps that are performant and SEO friendly. The flexibility to choose between SSR and SSG is icing on the cake. Nuxt has outstanding developer productivity, experience, and performance right out of the gate!There’s so much attention to detail, ensuring teams have everything at their fingertips to productively build all manners of applications. Nuxt is a fantastic choice for teams building a production-grade product on the web. It aims to bake in performance best-practices while maintaining excellent Vue.js DX. Nuxt has been an incredible source of innovation and inspiration for developers and framework authors alike. It’s been amazing to see its growth in web projects of all sizes on the web."
