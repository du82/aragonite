["https://v2.nuxt.com/blog/going-full-static"]
title = "Going Full Static · Nuxt Blog"
description = "Long awaited features for JAMstack fans has been shipped in v2.13: full static export, improved smart prefetching, integrated crawler, faster re-deploy, built-in web server and new target option for config ⚡️"
full_description = '''BlogGoing Full StaticRelease· June 18, 2020Going Full StaticLong awaited features for JAMstack fans has been shipped in v2.13: full static export, improved smart prefetching, integrated crawler, faster re-deploy, built-in web server and new target option for config ⚡️Sebastien Chopin@AtinuxToo long to readUpgrade nuxt to 2.14.0Set target: 'static' in your nuxt.config.jsRun nuxt generateThat's it ✨Bonus: you can run nuxt start to run a local server serving your generated static application.Note: in this video we are using nuxt export which has been deprecated in favor of nuxt generate.Table of ContentsToo long to readTable of ContentsHistoryCurrent issuesNew config option: targetSmarter nuxt generateCrazy fast static applicationsCrawler integratedFaster re-deploySmarter nuxt startPreview modeCommandsWhat to do nextHistoryNuxt had the static generation feature with nuxt generate since v0.3.2 (November 2016), since then we have improved it in multiple ways but never achieved full static generation. Today I am excited to announce that full static export is now possible with Nuxt 2.13.Current issuesnuxt generate is mostly pre-rendering, when you navigate client-side, asyncData and fetch are called, making a request to your API. A lot of users asked to support a "full static" mode, meaning to not call these 2 hooks on navigation, since the next page has been already pre-rendered.Also, the developer experience is not optimal:You have access to req or res on SSR but not when running nuxt generateprocess.static is true only when running nuxt generate, making it slow to develop Nuxt modules or plugins for static generationYou have to specify all your dynamic routes in generate.routes, making it harder since you don't have access to nuxt modules there.You cannot test the SPA fallback in development, the fallback is a client-only version of your Nuxt application that loads when hitting a 404 pagenuxt generate runs nuxt build by default, making it slower to generate your website if only your content changedNote that it was possible to have full static support with nuxt-payload-extractor module but it was more verbose to use and had limitations.New config option: targetTo improve the user experience as well as telling Nuxt that you want to export your application to static hosting, we are introducing a target option in your nuxt.config.js:<script setup> import { ref, computed } from '#imports' const count = ref(1) const double = computed(() => count.value * 2) </script> Full static doesn't work with ssr: 'false' (which is the same as the deprecated mode: 'spa') as this is used for client-side rendering only (Single Page Applications).Running nuxt dev with the static target will improve the developer experience:Remove req & res from contextFallback to client-side rendering on 404, errors and redirects (see SPA fallback)$route.query will always be equal to {} on server-side renderingprocess.static is trueWe are also exposing process.target for modules author to add logic depending on the user target.Smarter nuxt generateNow with v2.14.0, you can use nuxt generate, it will smartly know if it has to build or not.Crazy fast static applicationsnuxt generate with target: 'static' will pre-render all your pages to HTML and save a payload file in order to mock asyncData and fetch on client-side navigation, this means no more HTTP calls to your API on client-side navigation. By extracting the page payload to a js file, it also reduces the HTML size served as well as preloading it (from the in the header) for optimal performance.We also improved the smart prefetching when doing full static, it will also fetch the payloads, making navigation instant 👀Crawler integratedOn top of that, it also has a crawler inside, detecting every relative link and generating it:If you want to exclude a bunch of routes, use the generate.exclude. You can keep using generate.routes to add extra routes that the crawler could not detect.To disable the crawler, set generate.crawler: false in your nuxt.config.jsFaster re-deployBy separating nuxt build and nuxt export, we are opening a new range of improvements: pre-render your pages only if you content has changed, this means: no webpack build → faster re-deployments.Smarter nuxt startOnce you statically generated your Nuxt app into dist/, use nuxt start to start a production HTTP server and serve your static app, supporting SPA Fallback.This command is perfect to locally test your static application before pushing to your favorite static hosting provider.Preview modeWe do support live preview out of the box to keep calling your API:plugins/preview.client.jsexport default async function ({ query, enablePreview }) { if (query.preview) { enablePreview() } } It will automatically refresh the page data (calling nuxtServerInit, asyncData and fetch).When the preview mode is activated, asyncData and fetch original methods will be called.CommandsDepending of the target, you can run these commands.servernuxt dev: Start the development servernuxt build: Bundle your Nuxt application for productionnuxt start: Start the production serverstaticnuxt dev: Start the development server (static aware)nuxt generate: Bundle your Nuxt application for production if needed (static aware) and export your application to static HTML in dist/ directorynuxt start: Serve your production application from dist/What to do nextLearn more about how to move from @nuxtjs/dotenv to runtime config.html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);} ← Back to blog Copy URL Nuxt 2 Static ImprovementsWith Nuxt version 2.13, the full-static mode has been introduced. In addition, a new command nuxt export was added to pre-render your pages without triggering a webpack build with the goal to separate the rendering and build process. The only issue was that most Nuxt users weren't able to unleash the full potential of the separation... until now.Understanding how fetch works in Nuxt 2.12Explore different features of the fetch hook and learn a brand new way to bring data into Nuxt applications.Table of ContentsToo long to readTable of ContentsHistoryCurrent issuesNew config option: targetSmarter nuxt generateCrazy fast static applicationsCrawler integratedFaster re-deploySmarter nuxt startPreview modeCommandsWhat to do nextLinksEdit this article Star on GitHub Become a Sponsor Premium Vue Components for Nuxt applications.'''
