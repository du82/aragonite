["https://v2.nuxt.com/lts"]
title = "Nuxt 2 - Nuxt 2 LTS, EOL & Extended Support"
description = "On December 31st, 2023, Vue 2 will reach End of Life (EOL), and Nuxt 2 will follow in June 2024. Learn more about upgrading to Nuxt 3 or our extended support offer."
full_description = "If you expect to be using Nuxt 2 beyond the EOL (End of Life) date (June 30, 2024), and still need a maintained version that can satisfy security and browser compatibility requirements, make sure to check out HeroDevs’ NES (Never-Ending Support) for Nuxt 2 . On December 31st, 2023, Vue 2 will reach End of Life (EOL), and Nuxt 2 will follow on June 30th, 2024. After that date, Nuxt 2 will continue to be available on the NPM package manager, but will no longer receive updates, such as security and browser compatibility fixes. After that, if you wish to receive updates, please subscribe to HeroDevs’ NES (Never-Ending Support) for Nuxt 2 . Nuxt 3 is the current, latest major version of Nuxt. It provides a better developer experience, better performance, and contains new features that are not present in Nuxt 2, such as Nitro, auto-import and hybrid rendering, Nuxt 3 contains breaking changes that make it incompatible with Nuxt 2, so migration will require a certain level of effort depending on your project. Full details are documented in the Nuxt 3 Migration Guide. Despite the breaking changes, most of Nuxt APIs are shared between the two major versions, so most of your team’s Nuxt 2 knowledge will continue to work in Nuxt 3. In the long run, we also intend to avoid major breaking upgrades like the one between Nuxt 2 and Nuxt 3. Compatibility and ecosystem stability will be our topmost priority for future releases, and new features will be introduced in a way that does not require major migrations. Nuxt 2.x remains a powerful framework with great DX. The main benefits of upgrading are more refined TypeScript support, better performance, hybrid rendering, and access to the Nuxt 3 ecosystem and new features. Ask your team these questions: Is the app stable and working well? Does the app expect innovative features into the future? Is there a pain-point / bottleneck that can only be solved by upgrading? If the app is stable and isn’t experiencing major pain-points caused by Nuxt 2, then upgrading may not be worthwhile."
