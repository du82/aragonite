["https://v2.nuxt.com/ja"]
title = "Nuxt 2 - The Intuitive Vue Framework"
description = "Nuxt を使って信頼ある次世代の Vue.js アプリケーションを構築する Web 開発をシンプルにかつパワフルにするオープンソースフレームワーク"
full_description = "Nuxt は開発者の生産性やエンドユーザーの体験を向上させるための機能が数多く搭載されています。 素早くアプリケーションのコーディングを開始し、Nuxt が面倒を見てくれます。 静的サイト生成とオンデマンドのサーバーレンダリングを切り替えることができます。 SSR に対応した Vue コンポーネントで、任意のソースからコンテンツを取得できます。 メタタグ管理と優れたインデックスに対して速いコンテンツへの到達時間を実現。 コンポーネントを使って、Nuxt はそれらをスマートなコード分割によってインポートします。 160以上による Nuxt モジュールでアプリケーションを拡張し、あなた自身で作成できます。 Nuxt の開発は情熱を持った開発者によって行われています、しかし、新機能のメンテナンスと開発に必要な労力は、適切な資金のサポートなしには持続不可能です。それを可能にしてくれたスポンサーやパートナーの皆様に感謝します。 テクノロジーパートナーは、CMS、ホスティング、データベースなど、Nuxt 開発者を支援するサービスを提供しています。 代理店パートナーはあなたのプロジェクトに Nuxt を使った開発を提供する信頼された Web そして代理店です。 着想から名作まで、ガイドはあなたを Nuxter になるための道に連れて行きます。 Nuxt のコンセプトを理解し、完全な API リファレンスを見つけることができます。 パートナーの Vue School と一緒に Nuxt を学ぶための完全なビデオシリーズをご覧ください。 強力なモジュールを見つけ、お気に入りのプロバイダと統合して、テーマを使ってすぐに始めましょう。 お気に入りのツールの統合を利用して、ワークフローを拡張、自動化することができます。"
