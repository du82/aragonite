["https://v2.nuxt.com/events"]
title = "Nuxt 2 - Events"
description = "Discover and subscribe to future events featuring Nuxt content, and watch previous talks from the core team and the community"
full_description = "Discover and subscribe to future events featuring Nuxt content, and watch previous talks from the core team and the community We'll take a tour of Nuxt 3, creating, building and deploying a real, live-coded app to a serverless environment. We'll talk about how changing requirements in today's serverless world require frameworks to change, and how that makes a difference for UX and performance. In this talk, Pooya recaps how Nuxt works, and gives details about what Nuxt3 brings to the table, including Nitro, Nuxt Kit and the new CLI. Take a sneak peek at the next-generation rendering engine that will power Nuxt 3 and Nuxt 2. Look at how this revolutionises building SSR Vue apps, and what you need to do to use this today. In this session, Alexander builds the fitting frontend for a Strapi CMS backend by leveraging the Composition API and ensure it is performant and fast. Get insights into the world of Vue and Nuxt, useful patterns for the Composition API and possibly some sneak peaks Alexander demonstrates how you can use the composition API in Nuxt starting today, and what benefits it can bring. Debbie covers how to use Nuxt SSG with Hasura, from setting up your endpoint, adding the query to Nuxt to display your data with Apollo and GraphQL, how to setup a hook so that it triggers a deploy of your site on content change as static sites need to be redeployed on content change. Daniel talks to us about how he creates a surprisingly dynamic static site by using Nuxt and Netlify CMS. Dans ce talk à la Jamstack Paris, Sébastien explique tout sur le full static avec Nuxt, et l'utilisation du live preview mode Sebastien demonstrates how to create a web application quickly by using Nuxt and explaining how it works under the hood. Giving you confidence for your next Vue applications. Ever wondered how Nuxt works? Sebastien, creator of Nuxt will explain how the framework works internally. Giving you the knowledge to enjoy the full power of Nuxt and its module ecosystem. A case study on how Debbie and her team built their client's site, what they used and how they made it as performant as possible and were able to deliver better results to their clients and how now they have left the legacy code behind and have fully gone Nuxt."
