on Vue 3, Vite and Nitro. Six months later, we are happy to announce the first release candidate of Nuxt 3, code named “Mount Hope“ 🚀April 12, 2022ReleaseIntroducing Nuxt 3 Beta468 days after the first commit, the Nuxt 3 beta has finally arrived. Discover what's inside and what to expect from it. Yes, it includes Vue 3 and Vite ⚡️October 11, 2021ReleaseNuxt 2 Static ImprovementsWith Nuxt version 2.13, the full-static mode has been introduced. In addition, a new command nuxt export was added to pre-render your pages without triggering a webpack build with the goal to separate the rendering and build process. The only issue was that most Nuxt users weren't able to unleash the full potential of the separation... until now.July 27, 2020ReleaseGoing Full StaticLong awaited features for JAMstack fans has been shipped in v2.13: full static export, improved smart prefetching, integrated crawler, faster re-deploy, built-in web server and new target option for config ⚡️June 18, 2020ReleaseUnderstanding how fetch works in Nuxt 2.12Explore different features of the fetch hook and learn a brand new way to bring data into Nuxt applications.April 6, 2020ReleaseNuxt 2: From Terminal to BrowserHow we changed the developer experience to stop switching between the terminal and browser.June 3, 2019ReleaseIntroducing Smart PrefetchingStarting from Nuxt v2.4.0, Nuxt will automagically prefetch the code-splitted pages linked with a nuxt-link when visible in the viewport by default.January 28, 2019"
