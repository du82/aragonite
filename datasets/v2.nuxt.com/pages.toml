["https://v2.nuxt.com/fr"]
title = "Nuxt 2 - Le framework Vue intuitif"
description = "Construisez votre prochaine application Vue.js en toute confiance avec Nuxt. Un framework open source qui rend le développement web simple et puissant."
full_description = "Nuxt contient de nombreuses fonctionnalités améliorant l'expérience de développement et l'expérience de l'utilisateur final. Récupérez votre contenu depuis n'importe quelle source, dans vos composants Vue, prêts pour un rendu serveur. Nuxt est construit et maintenu par des développeurs passionnés mais il serait impossible de fournir les efforts nécessaires pour développer et maintenir de nouvelles fonctionnalités sans une réelle contribution financière. Nous remercions nos sponsors et partenaires qui rendent cela possible. Les Technology partners offrent des services aux développeurs Nuxt, tels que CMS, hébergement, base de données, et plus encore... Les Agency partners sont des agences web reconnues qui proposent du support et du développement d'applications avec Nuxt. Nuxt a beaucoup de dimensions à explorer, apprenez par l'exemple, intégrez des fournisseurs externes ou commencez plus vite avec un thème. Étendez et automatisez votre flux de travail en utilisant les déploiements pour vos outils préférés. Découvrez la liste des modules pour étendre vos projects Nuxt. Créés par l'équipe de Nuxt et sa communauté Découvrez comment une application du monde réel est construite à l'aide de Nuxt avec les thèmes construits par nos partenaires. With Nuxt version 2.13, the full-static mode has been introduced. In addition, a new command nuxt export was added to pre-render your pages without triggering a webpack build with the goal to separate the rendering and build process. The only issue was that most Nuxt users weren't able to unleash the full potential of the separation... until now. We'll take a tour of Nuxt 3, creating, building and deploying a real, live-coded app to a serverless environment. We'll talk about how changing requirements in today's serverless world require frameworks to change, and how that makes a difference for UX and performance. Nuxt offers a compelling solution and a great ecosystem to help you ship fullstack Vue apps that are performant and SEO friendly. The flexibility to choose between SSR and SSG is icing on the cake."
