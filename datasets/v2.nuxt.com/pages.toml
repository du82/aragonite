["https://v2.nuxt.com/pt"]
title = "Nuxt 2 - A Abstração Intuitiva de Vue 2"
description = "Construamos a nossa aplicação de Vue 2 com confiança usando a Nuxt 2. Uma abstração de código-aberto que torna o desenvolvimento da Web simples e poderoso."
full_description = "A Nuxt é fornecida com muitas funcionalidades para aumentar a produtividade dos programadores e a experiência do utilizador final. Alternar entre a geração de sítios estáticos ou a interpretação do lado do servidor em demanda. Buscar o nosso conteúdo a partir de qualquer fonte nos nossos componentes de Vue, preparado para interpretação do lado do servidor. O desenvolvimento da Nuxt é efetuado por programadores apaixonados, mas a quantidade de esforço necessária para manter e desenvolver novas funcionalidades não é sustentável sem o devido apoio financeiro. Estamos gratos aos nossos patrocinadores e parceiros, que ajudam a tornar a Nuxt possível. Os parceiros tecnológicos oferecem serviços que capacitam os programadores da Nuxt, tais como sistema de gestão de conteúdo, hospedagem, base de dados e muito mais. As agências parceiras são agências da Web e de consultoria de confiança que podem fornecer desenvolvimento e apoio de Nuxt para os projetos. Descobrir os conceitos da Nuxt e encontrar uma referência completa da interface de programação de aplicação. Descobrir módulos poderosos, que integram-se com os nossos provedores favoritos e começar rapidamente com os temas. Estender e automatizar o nosso fluxo de trabalho usando implantações para as nossas ferramentas favoritas. Descobrir a nossa lista de módulos para impulsionar o nosso projeto de Nuxt. Criado pela equipa e comunidade da Nuxt. Ver como uma aplicação realista é criada usando a pilha da Nuxt com os temas criados pelos nossos parceiros. With Nuxt version 2.13, the full-static mode has been introduced. In addition, a new command nuxt export was added to pre-render your pages without triggering a webpack build with the goal to separate the rendering and build process. The only issue was that most Nuxt users weren't able to unleash the full potential of the separation... until now. We'll take a tour of Nuxt 3, creating, building and deploying a real, live-coded app to a serverless environment. We'll talk about how changing requirements in today's serverless world require frameworks to change, and how that makes a difference for UX and performance."
