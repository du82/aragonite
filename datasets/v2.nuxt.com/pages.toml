full_description = "The Nuxt BlogRead the latest news about all Nuxt solutions, from framework announcements to integration tutorials. RSS Subscribe to our newsletterSubscribeReleaseNuxt 3.15Nuxt 3.15 is out - with Vite 6, better HMR and faster performanceDecember 24, 2024ReleaseIntroducing Nuxt Icon v1Discover Nuxt Icon v1 - a modern, versatile, and customizable icon solution for your Nuxt projects.November 25, 2024ReleaseNuxt 3.14Nuxt 3.14 is out - with a new rspack builder, shared folder, and performance enhancements!November 4, 2024ReleaseNuxt 3.13Nuxt 3.13 is out - porting back some of the new features we're building for Nuxt 4!August 22, 2024ReleaseIntroducing Nuxt ScriptsNuxt Scripts provides better performance, privacy, security, and developer experience for third-party scripts.August 20, 2024AnnouncementNuxt 2 End-of-Life (EOL)Nuxt 2 will reach End of Life (EOL) on June 30th, 2024. We've partnered with HeroDevs on offering Never-Ending Support (NES).June 14, 2024ReleaseNuxt 3.12Nuxt 3.12 is out - full of improvements and preparing the way for Nuxt 4!June 10, 2024ArticleRefreshed Nuxt ESLint IntegrationsWe revamped our ESLint integrations to support ESLint v9 with the flat config, as well as a new module with many more capabilities.April 10, 2024ReleaseNuxt: Looking forwardA lot of things have happened for Nuxt over the last year. Sébastien and Daniel share their thoughts on what we've achieved, and where we're going next.March 28, 2024ReleaseNuxt 3.11Nuxt 3.11 is out - with better logging, preview mode, server pages and much more!March 16, 2024ArticleThe Evolution of Shiki v1.0Shiki v1.0 came with many improvements and features - see how Nuxt drives the evolution of Shiki!March 11, 2024ReleaseNuxt 3.10Nuxt 3.10 is out - packed with features and fixes. Here are a few highlights.January 30, 2024ReleaseNuxt 3.9Nuxt 3.9 is out - a Christmas gift from the Nuxt team bringing Vite 5, interactive server components, new composables, a new loading API and more.Decemb