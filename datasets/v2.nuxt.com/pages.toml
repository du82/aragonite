["https://v2.nuxt.com/contribution-guide"]
title = "Nuxt 2 - Contribution Guide"
description = "Any contribution to Nuxt is more than welcome!"
full_description = "A great way to contribute to the project is to send a detailed report when you encounter an issue: Bug report Please make sure to include a reproduction repository or CodeSandBox so that bugs can be reproduced without great efforts. The better a bug can be reproduced, the faster we can start fixing it! However, any significant improvement should be associated to an existing feature request or bug report . Note that both npm and yarn have been seen to miss installing dependencies. To remedy that, you can either delete the node_modules folder in your example app and install again or do a local install of the missing dependencies. If you are adding a dependency, please use yarn add. The yarn.lock file is the source of truth for all Nuxt dependencies. A great PR, whether it includes a bug fix or a new feature, will often include tests. To write great tests, let us explain our test structure: The fixtures (found under tests/fixtures) contain several Nuxt applications. To keep build time as short as possible, we don't build an own Nuxt application per test. Instead, the fixtures are built (yarn test:fixtures) before running the actual unit tests. Please make sure to alter or add a new fixture when submitting a PR to reflect the changes properly (if applicable). Also, don't forget to rebuild a fixture after changing it by running the corresponding test with jest test/fixtures/my-fixture/my-fixture.test.js! The unit tests can be found in tests/unit and will be executed after building the fixtures. A fresh Nuxt server will be used per test so that no shared state (except the initial state from the build step) is present. While working on your PR you will likely want to check if your fixture is set up correctly or debug your current changes. npm link could also (and does, to some extent) work for this, but it has been known to exhibit some issues. That is why we recommend calling yarn nuxt directly to run examples. If you are working on a larger feature, please set up an example app in examples/. This will help greatly in understanding changes and also help Nuxt users to understand the feature you've built in-depth."
