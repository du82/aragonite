title = "Privacy Policy - Valkyrie"
description = "Privacy Policy Valkyrie Investments Inc. and its affiliates (“Valkyrie,” “we,” “us” or “our”) recognizes the […]"
full_description = "Privacy Policy Valkyrie Investments Inc. and its affiliates (“Valkyrie,” “we,” “us” or “our”) recognizes the importance of protecting the privacy of our online visitors. It is our intent to balance our legitimate business interests in collecting and using information received from and about you with your reasonable expectations of privacy. The following privacy policy (“Privacy Policy”) explains how we collect and use personal data from and about you through your interactions with us on this website (the “Website”). “Personal Data” is information that identifies a natural person. When you submit Personal Data to or through the Website, you consent to the collection and processing of your Personal Data as described in this Privacy Policy. By using the Website, you acknowledge we will collect, use, disclose, retain, and otherwise process of your information as described in this Privacy Policy. Please review this Privacy Policy carefully. If you do not agree to any provision of this Privacy Policy or to any modification to this Privacy Policy, please do not use the Website. Personal Information Valkyrie may collect Personal Data from you through the Website when you contact us through the Website’s contact links, including information such as your name, address, email address, phone number, or other information you choose to provide to us. This information is collected and stored electronically when you submit it to us. How Information is Used We may use the information we collect for any of the following purposes: to present our Website and its content to you; to provide you with information, products, or services that you request from us; to communicate with you; for any other purpose with your consent; and as permitted under or required by applicable law. Disclosure of Information We may disclose your Personal Data for any of the following purposes: With Third Party Service Providers Performing Services on Our Behalf. We may disclose your Personal Data to our service providers to perform the functions for which we engage them. For example, we may use third parties to host the Website or assist us in providing functionality on the Website, provide data analysis and Website research, send out email updates about the Website, or remove repetitive information from our user lists. For Legal Purposes. We also may disclose Personal Data that we collect from users as needed to enforce our rights, protect our property or protect the rights, property or safety of others, or as needed to support external auditing, compliance and corporate governance functions. We will disclose Personal Data as we deem necessary to respond to a subpoena, regulation, binding order of a data protection agency, legal process, governmental request or other legal or regulatory process. We may also disclose Personal Data as required to pursue available remedies or limit damages we may sustain. We may also disclose Personal Data to other organizations such as government agencies and law enforcement officials (for example, for tax reporting or under court order), or to other organizations and individuals with your consent (for example, to your attorney or tax professional). With our Affiliates. We may also disclose Personal Data to our affiliates, including Valkyrie Funds LLC, our affiliated SEC Registered Investment Adviser, in order to help perform and market services on our behalf to service you. More information about these affiliate relationships can be found in Valkyrie Funds LLC’s Form ADV Brochure and Part 2A which is available at www.adviserinfo.sec.gov. Changes of Control. We may transfer information, including your Personal Data, in connection with a change of ownership or control by or of us (in each case whether in whole or in part). Valkyrie does not disclose your Personal Data to third parties for those third parties’ marketing purposes. Security Used & Retention of Personal Data Valkyrie uses reasonable security measures designed to prevent unauthorized intrusion to the Website and the alteration, acquisition or misuse of Personal Data, however, we will not be responsible for loss, corruption or unauthorized acquisition or misuse of Personal Data that you provide through the Website that is stored by us, or for any damages resulting from such loss, corruption or unauthorized acquisition or misuse. No data transmission or storage system can be guaranteed to be always secure. Valkyrie will retain your Personal Data for as long as necessary to fulfill the purpose for which it was collected, or as required by applicable laws or regulation. Links to External Websites Our Website contains links to third party websites. Any access to and use of such third-party websites is not governed by this Privacy Policy, but instead is governed by the privacy policies of those third party websites, and we are not responsible for the information practices of such third party websites. Cookies and Similar Technologies We use cookies, web beacons and other technologies to receive and store certain types of information whenever you interact with the Website. We use cookies and other technologies to compile aggregate data about Website traffic and Website interaction so that we can offer better Website experiences and tools in the future. We reserve the right to place a text file called a “cookie” or other tracking device in the browser files of your computer. The cookie itself does not contain information that would personally identify you, although it could enable us to relate your use of the Website to information that you have specifically and knowingly provided to the Website. This may enable us to tailor the Website operation to your needs, likes and dislikes. Most browsers automatically accept cookies, but you can adjust yours to notify you of a cookie placement request, refuse certain cookies or decline cookies completely. We may use third parties to serve our advertisements on other websites. In serving our advertisements, these companies may use cookies and other tracking devices to collect certain information about your visits to other websites (such as browser type), IP address, which page was visited, and time of day). This information may be used to evaluate our online advertising campaigns or to tailor promotions and other marketing messages to you. You may elect to refuse cookies. Please refer to your browser help instructions to learn more about cookies and how to manage their use. We belong to ad networks that may use your browsing activity across participating websites to show you interest-based advertisements on those websites. Please note that some of our third-party service providers may use cookies and similar technologies to support our operations. These entities may be collecting such information in order to provide services to or for us. You should be aware that these third-party services providers may have different privacy policies and information security practices, as such, we encourage you to read the privacy statements provided by other websites before you provide personal data to them. Children Our services are not directed at individuals under the age of 18. We do not knowingly solicit or collect Personal Data from children under the age of 18. If we become aware that a child under 18 has provided us Personal Data, we will delete such data from our files. As a parent or guardian, if you become aware that your child has provided us with Personal Data, please contact us at the email address or telephone number provided at the end of this Privacy Policy and we will delete your child’s Personal Data within a reasonable time. Your Privacy Rights Pursuant to various state laws, you may have the right, subject to certain limitations, to: (i) request access to Personal Data we hold about you; and (ii) request that we delete your Personal Data. You may also have the right request the categories of Personal Data we have collected about you, the categories of sources where we collected such Personal Data, the purpose for such collection, and the third parties (if any) to which we have disclosed such Personal Data. All requests should be made using the contact details set out below. Please note that if you request that your Personal Data be deleted, you may no longer be able to access or use certain parts of the Website. We will respond to your request in writing, or orally if requested, as soon as practicable and in any event not more than within one month after receipt of your request. We may extend this period by 45 days and we will tell you why. We may request proof of identification to verify your request. For more details in relation to your rights, including how to exercise them, please contact us using the contact details set out in the section below. We are committed to providing you with control over your Personal Data. If you exercise any of the rights explained in this Privacy Policy, we will not discriminate against you. Do Not Track Some browsers have “do not track” features that allow you to tell a website not to track you. We do not currently respond to those signals. Consent to Processing of Personal Data in United States The Website is intended for users in the United States. If you are a resident of the European Economic Area (“EEA”), in order to provide our Website and services to you, we may send and store your Personal Data outside of the EEA, including to the United States. Accordingly, your personal information may be transferred outside of the country where you reside or are located, including to countries that may not or do not provide the same level of protection for your personal information. We are committed to protecting the privacy and confidentiality of Personal Data when it is transferred. Where such transfers occur, we take appropriate steps to provide the same level of protection for the processing carried out in any such countries as within the EEA to the extent feasible under applicable law. By using and accessing our Website, users who reside or are located in countries outside of the United States agree and consent to the transfer to storage and processing of Personal Data on servers located outside of the country where they reside, and that the protection of such information may be different than required under the laws of their residence or location. Questions and Changes in Information If you have any questions regarding this Privacy Policy or to request changes to your Personal Data, please email us at [email protected] Last Updated; Notification of Changes This Privacy Policy was last updated on January 12, 2023, and may change from time to time. Any changes to this Privacy Policy will be posted to this page so users are always aware of the Personal Data we collect and how we use it. Accordingly, please refer back to this Privacy Policy frequently as it may change."
