title = "Ear Speakers - Deep Dive - Valve Index® - Upgrade your experience - Valve Corporation"
description = "The Valve Index Ear Speakers have been optimized for the specific experiential goals of virtual reality, which caused their design to diverge in interesting ways from that of typical consumer headphones."
full_description = "Ear Speakers - Research, Design, and Evolution By Emily Ridgway, Valve audio engineer The Valve Index Ear Speakers have been optimized for the specific experiential goals of virtual reality, and this caused their design to diverge in interesting ways from that of typical consumer headphones. Early in our VR experimentation, it became clear that helping a VR user achieve an appropriate suspension of disbelief* required not only a reliance on the narrative, environmental, and emotional methods of traditional games and films, but also an entirely new category of physiological problem solving unique to VR. When we don a headset to play Budget Cuts, we expect VR to make us feel like our body has been transported into an office full of murderous robots rather than simply showing us their environment through a static screen. Our research and playtesting led us to understand that achieving maximum sonic immersion enforced as many requirements on the design of the audio components as it did on the 3D tracking system or on the display panels. We also learned that designing around those requirements meant accepting some interesting tradeoffs, which affected things like the position of the speakers, the weight of the driver, the shape of the driver’s diaphragm, the industrial design of the speaker enclosure, and even the fundamental frequency-response characteristics. *We have called this embodied suspension of disbelief ‘presence’ in other contexts, but that term carries other connotations in the audio world so we won’t use it in the remainder of this Deep Dive article. Both Hardware and Software Convincing audio immersion can only be achieved by relying on both software and hardware domains simultaneously. Knowing where to draw the line between the responsibilities of hardware (audio devices) and software (games, VR experiences) required a holistic consideration of the entire VR audio pipeline - from how VR sound content is created, to how it is output by game engines, to all the ways it can reach the ear. On the software side, game audio engineers and scientists have been working toward creating convincing immersive sound content since the first player-relative panning experiences emerged in the 90’s (Doom, Half-Life, Aureal3D etc). Then, thanks to current generation VR, we’ve seen huge improvements in spatial audio technologies. Binaural rendering and physics based sound simulation plugins such as SteamAudio allow developers to author even greater sonic positional accuracy, physically accurate virtual reverbs, sound occlusion, and propagation all though regular stereo headphones. When considering the optimal listening device for current VR, we leveraged the following knowledge and research in audio software simulations: VR content is mostly delivered in stereo - one left and one right audio channel. These channels can contain embedded binaural and HRTF tonal coloration relative to where the player is looking at any given point in time. Our outer ears, head shape, and facial geometry add a specific tonal signature that helps our brains identify real sound vs imagined sound, as well as the location of sound sources relative to us (behind, above, below, left, right etc.). Mid-high frequency sound fidelity is very important. Binaural simulations rely on subtle changes in tonal coloration (1kH-8kHz) to convey the position of a sound source relative to the player. If a listening device adds its own muffled frequency coloration, this will interfere with the player’s ability to localize sound. Humans in general are very sensitive to sounds within 2kHZ-5kHz range. If the frequency of a virtual sound doesn’t match up to what we expect it to be in reality, then we are more likely to identify the sound as “not real”. This is particularly true if you compare how easy it is to tell if someone’s voice is broadcast through a speaker vs. someone is talking beside you. Low frequency sound fidelity is important. While low frequency content doesn’t occur in nature too often, it absolutely appears regularly in VR and entertainment content (music, rumbles, explosions, gunfire, heartbeats, impacts, magic spells, etc.). Bass is critical to convey a sense of size and scale. It augments the visual immersion of VR and elicits certain emotional cues - danger, awe, isolation, internalization, etc. Therefore, it was important that our listening device maintained a healthy amount of bass response. Why not headphones? Traditional headphones excel at delivering direct, player-relative, stereo sound content straight to each ear. Players can look in any direction in the virtual world, and 3D game engines with sound simulation plugins will output the required stereo signal to convey the correct location of the virtual sound source. This is the reason competitive e-sport players (eg. CS:GO) use headphones instead of front facing speakers - headphones provide more direct spatial sound information. Two output channels (L/R), for two earpieces (L/R), for two ears (L/R) - straightforward. Generally speaking, however, traditional audio devices are rarely designed with sonic immersion as the primary goal. Personal devices such as ear buds, on-ear, and over-ear headphones are optimised for listening to music and entertainment in places where loudspeakers aren’t appropriate and often power requirements are extremely low (eg. cell phones, battery powered devices). The focus is often on sound isolation, power efficiency, noise cancelling, and exaggerated frequency responses. We felt that many of these optimizations might not make as much sense in the context of current room-scale VR, where the general listening environment is a dedicated volume of space (eg. an indoor room with light background ambience), where a tiny amount of sound leakage may be fine. We have access to plenty of power, and frequency responses need to support the assumptions of binaural sound simulations. Headphones and earbuds need to make contact or surround the ear in order to achieve their goals optimally. We saw that this can sometimes work against audio immersion in the following ways: Delivering sound directly into the ear canal bypasses the natural listening process caused by ear and head interacting with real sound waves. Listeners miss out on the tonal sound signature created by the ears, head and personal geometry. This can result in sound appearing as though it’s imagined, or it’s coming from inside one’s head, even if the audio content is highly spatial and physically simulated. We predict that eventually software simulations will take this into account. Ear pressure can get painful and uncomfortable after periods of time, drawing people out of VR presence. Some playtesters reported that the very act of headphones touching the ear signaled to them that any forthcoming sound wasn’t going to be real. Sealing the ear with over-ear headphones can trap heat - making VR headsets feel hotter than the user would in real life, reducing presence. Tonal sound quality of some headphones can interfere with the subtle frequency colorations of binaural simulations. For example,headphones where mid-high frequencies are either exaggerated or muffled will most likely interfere with the subtleties of HRTF filters, resulting in a poor sense of directional sound in games and VR. Why not loudspeakers? We also considered consumer loudspeakers and beam-forming speakers in typical stereo or surround sound setups. Loudspeakers avoid many of the comfort issues associated with headphones and emit sound we can easily perceive as external to our own heads, but they did pose several obstacles to adoption: Existing stereo loudspeaker configurations assume a front-facing orientation, so sound is played back as if one is in an audience, listening to a band on a stage, or watching TV from a couch. This is ok for music and film on a screen, however, VR and stereo game content is output assuming L/R channels are arriving immediately to each side of the listener's head. Common 5.1 and 7.1 surround sound systems restrict playback to a horizontal field, where as VR and game sound content can be virtually positioned anywhere around the listener. Loudspeaker systems can take time and space for the user to set up correctly, creating additional friction for VR setup. Loudspeakers require the player to remain within a small “sweet spot” for accurate spatial playback. VR can sometimes require people to move around in a large space. Loudspeakers can be influenced by the acoustics of the real room, which may conflict with the desired acoustics of the virtual world. Loudspeakers may make a sound feel too far away, contradicting the location of a virtual sound source that might be very close to the players ears. The Idea In reviewing all the tradeoffs above, it became apparent that the optimal solution for VR might be a pair of ultra near-field, full range, off-ear (extra-aural) headphones. Close enough to the ear to mimic player-relative stereo headphones and support the output format of current VR content, but far enough away to allow the ears and head to imprint their own tonal coloration onto the sound, while also addressing comfort and pressure issues. It was this realization combined with inspiration from a childhood memory of being completely sonically immersed while laying between two inward facing hi-fi speakers, that resulted in the first prototypes being created. Our first off-ear speaker prototype The EvolutionThe first prototype was made by taping two small full-range desktop speaker drivers to the side of a skateboard helmet. An old Vive was strapped around the outside of the helmet. The speakers were powered by USB and audio output via the headphone jack on the HTC Vive. This crude prototype did a surprisingly good job at demonstrating the increase in sonic immersion and externalization when we allowed our own ears and head to interpret sound naturally. The feeling of immersion is hard to measure quantitatively, so at this stage we relied on qualitative feedback from colleagues and playtesters to describe the sonic difference between this prototype and a pair of KOSS Porta Pro on-ear headphones while in VR. The responses were significantly enough in favor of the speakers that we felt comfortable proceeding with this design. However, several issues arose: Very limited bass response. Slight variations in speaker positions caused by putting on the helmet differently, or moving around in VR caused the volume, frequency response and sound balance to shift significantly. Weight and size. The speakers were too heavy - (70g each) which was at odds with the greater product goal of making our Headset light and comfortable. This was probably the biggest concern early on. Sound leakage. Experimenting with headphone drivers To address weight concerns we investigated using headphone drivers instead of speaker drivers. While lighter, and more power efficient, they couldn’t deliver enough volume when held away from the ear in free air. Even though we already knew this would be the case, it was interesting to hear the tradeoffs between sound immersion vs. distance away from the ear vs. frequency response and volume. Magnetic planar off-ear headphone concept We wanted to know just how big headphone drivers needed to be in order to start meeting our volume and frequency response requirements in our extra-arual context. We talked with Audeze who developed a pair of magnetic planar extraaural headphones in order to help us find out. The result sounded incredible, however, the weight, size, and cost were not feasible for the production goals of the Valve Index. The first speaker based 'Hummingbirds' We returned to using speaker drivers as a basis for our design moving forward. One of the benefits of early audio R&D at this stage was being able to work independently of the rest of the Valve Index Headset system. With the help of a mechanical engineer we created a stand-alone extra-aural headphone form factor. In this new context, we were able to quickly iterate on bass response, tuning, orientation to the ear, distance from the ear, and A/B test speaker driver evaluations. This prototype was the first 3D printed ear-speaker headphones. Internally we call them “Hummingbirds.” Hummingbirds with small, full-range, traditional piston speakers. These colorful Hummingbirds were created with the goal of evaluating different kinds of small full-range speaker drivers. Up until this point, we had been repurposing entire consumer speaker and headphone systems. Purchasing and evaluating off-the shelf parts required us to start building the basics of the audio subsystem: amps, audio chips, DSP (digital signal processing), and microphones. In parallel, we were getting closer to defining our shipping targets for optimal distance from the ear, rotation, weight, speaker dimensions, and frequency response. The first pair of hummingbirds using BMR drivers from Tectonic We came across BMR (Balance Mode Radiator) speakers during our driver evaluation stage and immediately noticed several positive benefits: They reduced coloration due to speaker mispositioning, were almost within range of our weight target, had great frequency response in high-mid ranges (important for binaural simulations), and were much thinner than traditional speaker drivers. We began working with Tectonic to design a custom driver for use as an off-ear speaker. Internally, concerns were increasing about how much sound ear speakers would leak into the environment, as well as how much sound they might let in. To get a sense of how impactful this might be to customers, we built 20+ hummingbirds and lent them out for colleagues to test at home. No one wanted to return their Hummingbirds (Chet). This was a good sign along with the overwhelmingly positive playtest feedback. Playtesters commented that the benefits of not having anything touching the ear, and the increased sense of sound immersion was offsetting issues caused by external sound coming in and/or internal sound leaking out. We decided to proceed with this design but keep these concerns in mind. Mr. HATS The ProductWe now had a working ear speaker subsystem that was playtesting well and was within the ballpark of our fidelity, cost, and design targets. We began the process of merging the ear speaker design with the Valve Index Headset. Here it became important to start acoustically measuring the performance of our audio subsystem in the context of the headset. Taking accurate measurements allowed us to capture incremental improvements as well as identify issues in the audio subsystem. Initially we used “Mr. HATS”, our dummy head model used for taking frequency response measurements of our ear speakers. Blue tape on the face marks the exact placement of the HMD on the model so early measurements could remain consistent. Frequency response graph of Index BMR drivers in an anechoic chamber To maximize the sound quality, the frequency resp"
