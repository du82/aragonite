["https://www.valvesoftware.com/en/people"]
title = "People at Valve - Valve Corporation"
description = "We make games, Steam, and hardware. Join Us."
full_description = "Boss-free since 1996. We believe that the best product decisions are made by the people who are actually doing the work. We take great pride in hiring top talent from a variety of disciplines and bringing people together with one simple directive: Collaborate and create. Below are some of the people at Valve who do just that. Search Search Art Aaron Barber Aaron got his first taste of creating 3D environments while he was studying engineering at UCLA. He was building VRML websites for the university, and also started designing levels for several internet mods. His level design skills landed him a job at Xatrix Entertainment where he worked on Redneck Rampage, Quake 2, and Kingpin before joining Valve in 1999 to work on Half-Life 2. Contact Ariel Diaz Originally from San Juan, Puerto Rico, Ariel came to Valve after finishing his studies at the Savannah College of Art and Design. As part of Valve's character design team, he is responsible for creating character models, facial expressions, and skeleton deformations. Outside Valve, he pursues traditional art skills such as drawing, painting, and sculpting. Brad Kinley Full-time bellowing sasquatch and animator. Brad came to Valve after working for ILM, Bioware and Capcom. He thought animating Optimus Prime on top of a t-rex would be the peak of his own particular sizzle mountain, but the mountain has continued to sizzle here at Valve. Sizzling mountain animation action. Bram Eulaers Growing up in Belgium, Bram got hooked on game development making levels for Duke Nukem 3D and Half-life at a young age. After getting a start in the games industry working at various companies in the Netherlands and Sweden, he moved to the United States to help create Overwatch at Blizzard Entertainment. With his roots in the modding community, he now feels at home at Valve, where he spends most of his time obsessing over efficient UV layouts. Chris Welch Chris received his Bachelor's of Fine Arts with an emphasis in Animation and Medical Illustration. After working in the Biomedical field for several years as a 3d artist and traditional illustrator, he went on to work in the film industry as a Look/Dev and Texture Artist, working on films such as Avatar. He has now been at Valve as an artist since 2010 working on all things art related, from character design and environment concepting, to video game trailer production. Contact Dan Rosas Paulsen Dan comes from busy Mexico City. Back there he was lead artist for Kerbal Space Program. Before joining Valve he completed a Master's in 3D Animation at the National Centre for Computer Animation in the UK. On his spare time he enjoys composing music and working on his own experimental projects, while getting used to rainy Seattle. Eric Kirchmer At the age of 6, after a chance encounter with the artist Phil Tippett, Eric had the opportunity to view many of the original models following the release of Return of the Jedi, which set him on course to coloring, building, drawing, and creating with any and all materials in his path. If only his younger self would have ever known what would someday follow as a career. In the years as an artist with Valve, Eric has contributed to the visual design of games including Half-Life 2, Team Fortress 2, Dota 2 and other Valve titles. Contact Irving Zhang Irving is an effects artist at Valve. His passion is crafting incredible and memorable gaming experiences for players. His favorite Dota hero is Brewmaster. When he's not in front of a computer, he loves fitness, tennis, and travel. Jason Brashill Jason worked on British comics 2000ad and Judge Dredd Megazine as well as concept art for many games. His free time was spent mostly âenhancingâ (other people’s) property with spray paint. Jason eventually skipped town and now resides near Seattle where he does all manner of arting at Valve and no longer pursues his extra-curricular activities in any way shape or form. Honest. Matt Charlesworth Matt is and Artist and Designer from the UK city of Nottingham. After spending the first 10 years of his career working at studios in the UK and Canada, Matt joined Valve in 2008. He got straight to work crafting character art and for Left 4 Dead 2, Portal 2, Dota 2 and The Lab and has most recently shipped Half-Life: Alyx. Max Aristov Since Max's first computer Iskra-1030 he has been on a mission to only use the latest and greatest computers and software which lead him to working on videogames at GSC Gameworld, Action Forms, Crytek, Raven Software and finally Valve. He works on characters and environments Contact Nick Bizzozero Nick is a 3D generalist at Valve. You may know him from his work on the Risk of Rain series. He has spent most of his life breaking other peoples games and trying to convince his bosses to let people break his. Thiago Vidotto Thiago received his Bachelor's of Architecture and Urban Planning at the University of Sao Paulo - Brazil.He has a passion for learning and started his videogame journey modding Quake back in the 90s. At Valve, he has been working in many different roles like Modeling, Animation, and VFX.In his personal life, he enjoys bladesmithing, racing motorcycles, and transforming his house into a jungle. Contact View Steam Profile Tristan Reidford Tristan earned a degree in transportation design. After a dipping a toe into industrial design, he found his way into making models for games, eventually landing at Valve to help with Half Life 2, Episode 2. Since then He's been delighted to get away with building all sorts of models and art for Portal 2, Left 4 Dead, Team fortress 2, among others. Outside of Valve, Tristan enjoys the decision paralysis that comes from making art and models in the real world where there is no Ctrl Z. Contact Wade Schin Wade has worked in the game industry as an artist since 1998, and for Valve since 2005. In his spare time, he participates in group art shows and experiments with 3d printing and casting. Contact Audio Ethan Geller Ethan Geller mostly works on audio, music and software. He can occasionally be found playing middling jazz-rock at small venues in Seattle. Contact Mike Morasky Morasky's life and career sounds a lot like one of the post-modern audio collages he is so fond of creating. Teenage guitar player in a bar band in Montana; award-winning experimental composer in Tokyo; audio hardware programmer in Silicon Valley; underground art rocker touring the world; 3D animator and director for television; electronic audio collage artist in France and Japan; visual fx artist on The Lord of the Rings and Matrix trilogies; AI animation instructor at an art college. These days, Mike is doing some combination of all these things at Valve. Contact Nathaniel Blue Nathaniel Blue works on The Steam Team and Audio at Valve. He spends most of his time working on Steam features, new business opportunities, and music. He has a variety of experience in the gaming industry, advertising, and the music industry. Ryan Done Ryan Done is a software engineer who works on systems for game audio production and audio processing. He's always looking for an occasion to ride bikes. Tim Larkin As a freelance composer and musician, Tim has done it all. He played trumpet for the likes of Ella Fitzgerald, Sheila E., Lou Rawls, Huey Lewis, James Brown, and Natalie Cole; recorded numerous records, movies, documentaries, and TV shows (including Survivor and Fear Factor 2.0) as a studio musician; created the sound design for The Chubbchubbs!, a 2003 Academy Award winner for Best Animated Short Film; and as Audio Director at Cyan studio for eight years, created the music and sound for the Myst series. Now, he's here at Valve, where he's worked on just about every title the company has shipped. When he's not working, Tim is playing tennis, fly fishing, or commuting back and forth to his home and family in Spokane, WA. Tobin Buttram As a music major, Tobin looked forward to a career in food service. Instead, he spent most of his twenties touring and recording with Robert Fripp and The League of Crafty Guitarists, which led, somehow inevitably, to Microsoft in 1996, where he worked on Interactive Music Architecture (DirectMusic) and as an Audio Director at Microsoft Game Studios, primarily with FASA. Tobin joined Valve in 2008 and is blown away every day that, in addition to doing audio production on some of the coolest projects in the whole wide world, he's allowed to tinker with the audio calls in the game code, and encouraged to learn more about that side of the process every day. Business Development Adam Klaff Adam joined Valve in 2015. He works on the Steam business team. Prior to that, he ran business development for a video startup in Brooklyn, and before that he worked in production on several movies, plays and television projects. Connor Malone Connor joined Valve in 2009 as part of the Support Team. After a few years he joined the Steam Business team to help third-party developers and coordinate promotions. Contact DJ Powers The bulk of my childhood and young adult life revolved around working to become a better golfer. After a mostly unsuccessful playing career, I spent a few years coaching collegiate golf teams and then transitioned indoors to work on the Tiger Woods PGA Tour games at Electronic Arts. During my time at EA, I worked in the EA Partners Group where we helped Valve ship The Orange Box, Left 4 Dead, Left 4 Dead 2 and Portal 2 on console and into retail. I started at Valve in 2010, working as a member of the Business Development Team and focusing on Steam, Partner relationships, Hardware and VR among many other things. Mostly unsuccessful is still a good description of my golf game. Nathaniel Blue Nathaniel Blue works on The Steam Team and Audio at Valve. He spends most of his time working on Steam features, new business opportunities, and music. He has a variety of experience in the gaming industry, advertising, and the music industry. Ria Hu Doing a little bit of everything, everywhere, all at once. Shreya Liu Shreya graduated with a degree in Electrical Engineering from the University of Illinois at Urbana Champaign but got working on strategic business partnerships for Surface while at Microsoft. She used to dream about lightsabers but now she's working on making them a [virtual] reality. Tom Giardino Tom is a graduate of the University of Washington Foster School of Business and a former high school teacher. He has worked at Valve since 2012. Tom spends his days on the Steam Business team. One part of that work is making Steam a better platform for customers to buy and play games. The other part is helping game developers make the most of Steam's tools, features, and opportunities. Contact Customer Support David Underwood David spent seven years in higher education before joining Valve in 2014 to work with Steam Support. His focus is on quality, partner management, and project management. If you need assistance with your Steam account, please create a help request at https://help.steampowered.com. Contact Jared Christen Jared has worked with Steam Support since 2010 and is currently focused on expanding and refining the support operation. If you have feedback for Steam Support or from an interaction that you've had with the team, send it my way using my contact link below. Contact Patricia Zavalza After working in manufacturing for almost a decade focusing on Program and Account Management, Patricia joined the Customer Support team at Valve where she is working on improving the quality of our interactions with our users and partners. Data Science John McDonald John writes high performance code and oversees gradient descents. Prior to joining Valve, he worked at NVIDIA where he developed new techniques to drive GPUs and helped numerous developers optimize their game engines. John got his start in the game industry working on Command & Conquer: Generals. Contact Kristian Miller Kristian studied Economics and Finance at Montana State University before arriving at Valve in 2012. He started on Team Fortress 2, where he worked to better understand player interactions with crates, name tags, and Hats of Undeniable Wealth and Respect. Kristian currently works with the Steam team, where he focuses on platform growth, virtual reality, and development of partners' in-game economies. Contact Matt Rhoten Software nerd who's a little interested in everything else too. View Steam Profile Game Design Alexander Mark Prior to joining Valve, Alex animated in Film and FX for a decade. Ariel Diaz Originally from San Juan, Puerto Rico, Ariel came to Valve after finishing his studies at the Savannah College of Art and Design. As part of Valve's character design team, he is responsible for creating character models, facial expressions, and skeleton deformations. Outside Valve, he pursues traditional art skills such as drawing, painting, and sculpting. Dave Riller Dave started working on games in his spare time back in the days of Doom and Quake. His work caught our eye and we lured him here from the East Coast to work on Half-Life. Eddie Parker Rogue Canadian masquerading as a software engineer, designer, and whatever else they let me get away with. Please note: Valve Employees will never ask you for personal or account information, on Steam or anywhere else. You can safely ignore anyone who claims to have mistakenly reported you - that will not get you banned. If you need help with your Steam account, go to https://help.steampowered.com/. Contact View Steam Profile Greg Cherlin I do level design, game design, and gameplay programming. At Valve I've worked on Team Fortress 2, Left 4 Dead, Portal 2, and Dota 2. Some of my favorite games: Descent, Everquest, StarCraft: Brood War, Slay the Spire, and Valheim. Ido Magal Ido joined Valve in 2001. He's older now. Jake Rodkin Jake is a level and UI designer and still doesn't quite believe it. He helped make Firewatch, The Walking Dead, Sam & Max, and many old websites lost to time. Contact Jeff Lane Jeff joined Valve in 2000. Previously at Sierra On-line working on multiple titles, lastly Swat 3 CQB. Jeff has been a designer and technical artist on many Valve products including Team Fortress, Half-Life 2, Day of Defeat, Left 4 Dead, Portal 2, Team Fortress 2, and VR titles The Lab and Half-Life: Alyx. Contact John Morello John is an animator most of the time. He’s been a gamer since his parents bought their Commodore 64. As a high-schooler he made small Quake mods and became addicted to Team Fortress. After graduating, his brother introduced him to the guys on the Day of Defeat team. They wanted to ship their mod, but they needed animation help. John jumped in. Valve eventually invited John and the rest of the team to continue DoD development at Valve’s offices. At this point, John has worked on nearly every product we've shipped. His TF obsession is over - replaced by an addiction to DotA, and lapping his Ducati at local road courses. Karen P"
