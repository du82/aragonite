["https://valvesoftware.com/about"]
title = "About Us - Valve Corporation"
description = "We make games, Steam, and hardware. Join Us."
full_description = "At Valve we make games, Steam, and hardware. Our games attract millions and define genres. Valve's debut title, Half-Life, was released in 1998. It won more than 50 game of the year awards, and PC Gamer even called it the Best PC Game Ever. Since then, we've released dozens of titles that changed the world. Today, millions of people play our games every day. Half-Life: Alyx Dota Underlords Counter-Strike 2 Dota 2 Artifact Team Fortress 2 Our earlier titles were built on an innovative engine with world-class gameplay as their paramount goal, and praised by critics as games that revitalized or even invented their genres. Half-Life Left 4 Dead Portal Half-Life 2 Left 4 Dead 2 Portal 2 We have some new games in the works, too. A couple have been announced, while others remain top secret. The 2018 International Dota 2 Championships, hosted at Rogers Arena in Vancouver, BC, was enjoyed by millions of concurrent viewers online. Our platform connects players with the world's greatest entertainment. We created Steam in 2003 to serve as a digital content distribution channel, before app stores existed. It's since grown and evolved into a platform for thousands of creators and publishers to deliver content and establish direct relationships with their customers. The Steam Community enables millions of players to do likewise, sharing entertainment and ideas, and making friends. 29,773,318 Steam playersare online now 8,858,568 Steam playersare in-game now Our hardware is a happiness delivery vehicle. We make consumer electronic devices that expand and improve gaming on the PC. Things like the Steam Deck, Valve Index, Steam Controller, and Steam Link. We invented the VR technologies that power the Vive, an interactive VR system brought to market in partnership with HTC. Steam Deck™ is the most powerful, full-featured gaming handheld in the world, allowing players to enjoy their Steam library anywhere. The Valve Index® VR Kit combines visual, audio, and ergonomic innovations to create an industry leading VR experience. Steam Controller and Steam Link, two of Valve’s early hardware projects that enabled untethered PC gaming. Iterate, test, repeat. Just as in software development, we conduct playtests and share prototypes with our partners and players. We follow the results of this work all the way through the manufacturing process to create products people are sure to enjoy. Yes, that first prototype is just barely being held together by gaffer's tape. ﻿ We're just getting started. We make all of this stuff collaboratively in Bellevue, Washington, where we combine the resources and talent of a world-class company with the ethos of a small startup. With an engaged and vocal community of partners and players, our products and our company will continue to change and grow in ways we may never have predicted. Join us, and help inform what's next."
