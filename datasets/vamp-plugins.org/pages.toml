["https://vamp-plugins.org/index.html"]
title = "Vamp Plugins"
description = "Vamp is a system for plugins that extract feature information from audio data."
full_description = "Vamp is an audio processing plugin system for plugins that extract descriptive information from audio data — typically referred to as audio analysis plugins or audio feature extraction plugins. Vamp is a nice API to develop with. Read more and get the SDK here, or visit the Vamp Plugins organisation on Github where development happens and developer documentation lives. Just like an audio effect such as a VST plugin, a Vamp plugin is a binary module that can be loaded by a host application and fed audio data. However, a Vamp plugin does not generate audio output, but some sort of symbolic information instead. Typical things that a Vamp plugin might calculate include the locations of moments such as note onset times, visualisable representations of the audio such as spectrograms, or curve data such as power or fundamental frequency. Read more about the rationale for Vamp."
