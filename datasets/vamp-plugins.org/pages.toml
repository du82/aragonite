full_description = "Vamp Plugin Pack is an installer for a set of Vamp plugins with redistributable licences, built and packaged for Windows, Mac, and Linux. It provides a single download which, when run, checks which plugins you already have on your system, and offers to install any of its bundled plugins that are either not yet installed or else newer than the installed versions. The plugins included are all open source software developed and published by various different authors and institutions: The installer shows more information about each plugin library, including a link to its homepage where it has one. Please refer to the installer and to the plugin libraries themselves for more details about the provenance and use of each plugin. All of the libraries are open source and are redistributable under open-source licences: BSD/MIT, GPL, or AGPL. The entire pack and the installer may be redistributed under the GNU Affero General Public License (AGPL) v3, which is the most restrictive of the set of copyleft licenses in use by the libraries. The source code for the installer, and scripts to pull in the library code and build the whole package, can be found in the repository for this project."
