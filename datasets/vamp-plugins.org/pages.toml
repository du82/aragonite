["https://vamp-plugins.org/news.html"]
title = "Vamp Plugins"
description = "Vamp is a system for plugins that extract feature information from audio data."
full_description = 'Vamp Plugin Pack is an installer for a set of Vamp plugins with redistributable licences, built and packaged for Windows, Mac, and Linux. It provides a single download which, when run, checks which plugins you already have on your system, and offers to install any of its bundled plugins that are either not yet installed or else newer than the installed versions. This release adds a method to PluginWrapper, the host-side base for adapters that modify the processing behaviour of a plugin, that tells it to "disown" the wrapped plugin. The former behaviour, and still the default, is for the wrapper to take ownership of the wrapped plugin. The alternative behaviour makes it easier to mix these classes with some modern C++ styles that use managed pointers. This is a bug-fix release, but it also changes the base supported C++ standard from C++98 to C++11, hence the increase to the minor version rather than point version. For more details, see the changelog at Vamp is a plugin API for audio analysis and feature extraction plugins written in C or C++. Its SDK features an easy-to-use set of C++ classes for plugin and host developers, a reference host implementation, example plugins, and documentation. It is supported across Linux, OS/X, and Windows. A documentation guide to writing plugins using the Vamp SDK can be found at http://www.vamp-plugins.org/guide.pdf. Announcing v1.3 of jVamp, a Java/JNI interface allowing the use of native-code Vamp plugins from host applications written in Java or other JVM languages. This release simplifies the API, removing an unnecessary dispose() call and eliminating a class of native-heap memory leak. Vamp Test Plugin is the equivalent of a TV test signal: it produces a set of very simple static outputs intended to help the authors of Vamp hosts check that they are handling plugin output sample types correctly. This release adds an output which is calculated from the input (to facilitate testing that input blocks are provided correctly) and a frequency-domain version of the same.'
year_published = 2025
clearnet = "https://vamp-plugins.org/news.html"
