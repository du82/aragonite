["http://www.vamp-plugins.org/plugin-doc/vamp-example-plugins.html"]
title = "Vamp Example Plugins: User Documentation"
full_description = "The “vamp-example-plugins” library contains a number of Vamp audio analysis plugins provided as part of the Vamp plugin SDK. These are simple, but sometimes useful, plugins whose source code you are free to study and reuse in any proprietary or non-proprietary plugins of your own without any licensing obligation. System identifier – vamp-example-plugins:amplitudefollower RDF URI – http://vamp-plugins.org/rdf/plugins/vamp-example-plugins#amplitudefollower Links – Back to top of library documentation – Download location – Source code Amplitude Follower tracks and returns the amplitude of the audio signal sample by sample, returning peak values block by block. Attack time (seconds) – The 60dB convergence time for an increase in amplitude. Release time (seconds) – The 60dB convergence time for a decrease in amplitude. For example, if you feed the plugin with a simple step function that jumps from level A to level B, then the output will start off as A, then at the moment of stepping it will start to converge exponentially to B, reaching with 60dB of the actual value within the time specified by the Attack time parameter. Similarly, if the plugin's input then steps down from B to A, the output will start converging at the moment of stepping, reaching within 60dB of the new value within the time specified by the Release time parameter. Amplitude Follower uses a method from the SuperCollider audio processing language. It was implemented as a Vamp plugin by Dan Stowell. System identifier – vamp-example-plugins:fixedtempo RDF URI – http://vamp-plugins.org/rdf/plugins/vamp-example-plugins#fixedtempo Links – Back to top of library documentation – Download location – Source code Simple Fixed Tempo Estimator analyses a fragment of audio and estimates its tempo. It assumes that its input is of fixed tempo, and it analyses only the first (small but configurable number of) seconds before returning a result, discarding all subsequent input. The plugin calculates an overall energy rise function across a series of short frequency-domain input frames, takes the autocorrelation of this function, filters it to stress possible metrical patterns, locates peaks, and converts from autocorrelation lag to the corresponding tempo."
year_published = 2025
clearnet = "http://www.vamp-plugins.org/plugin-doc/vamp-example-plugins.html"
