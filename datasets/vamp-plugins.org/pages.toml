["http://www.vamp-plugins.org/vampy.html"]
title = "VamPy: Vamp Plugins in Python"
description = "Vamp is a system for plugins that extract feature information from audio data."
full_description = "VamPy is a wrapper plugin written by Gyorgy Fazekas that enables you to use Vamp plugins written in Python in any Vamp host. It provides a (nearly) complete wrapper implementation of the Vamp plugin API that can be used to write efficient plugins very easily, taking advantage of the wide range of Python libraries already available for scientific work. To use VamPy, download the VamPy wrapper plugin compiled for your platform, copy it to your Vamp plugin location, and copy any VamPy scripts – some examples are included – into the same place. Then just run your normal Vamp host and you should see the scripts available there. (See How to Install for details of the Vamp plugin installation location on your system.) You will need to make sure you have a compatible version of Python installed: currently this means Python 2.7. Also you are strongly advised to install NumPy, as most plugins use a part of the VamPy interface which depends on it. Pick the relevant Download link for your platform. Note that on Windows, you must use the build (32- or 64-bit) which matches the version of Python you have. If you are using a 32-bit Python build, then you must use the 32-bit VamPy and install it to the 32-bit Vamp plugin location, even if you are doing so on a 64-bit copy of Windows. Although the VamPy wrapper plugin itself is platform-dependent (so you must download the correct one of the plugins listed above!), the Python scripts themselves are portable across platforms. Publishing a VamPy plugin in Python could be the simplest way to make a Vamp plugin available to the world at large. VamPy is licensed under the same liberal terms as the Vamp SDK itself, and you are welcome to take the example code included in the VamPy package and use it to make your own Python plugins for any purpose you wish."
