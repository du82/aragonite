["https://vamp-plugins.org/plugin-doc/qm-vamp-plugins.html"]
title = "QM Vamp Plugins: User Documentation"
full_description = 'The QM Vamp Plugin set is a library of Vamp audio feature extraction plugins developed at the Centre for Digital Music at Queen Mary, University of London. These plugins are provided as a single library file, made available in source and binary form for Windows, OS/X, and Linux via the SoundSoftware code site (see download page). System identifier – vamp:qm-vamp-plugins:qm-onsetdetector RDF URI – http://vamp-plugins.org/rdf/plugins/qm-vamp-plugins#qm-onsetdetector Links – Back to top of library documentation – Download location Note Onset Detector analyses a single channel of audio and estimates the onset times of notes within the music – that is, the times at which notes and other audible events begin. It calculates an onset likelihood function for each spectral frame, and picks peaks in a smoothed version of this function. The plugin is non-causal, returning all results at the end of processing. Onset Detection Function Type – The method used to calculate the onset likelihood function. The most versatile method is the default, "Complex Domain" (see reference, Duxbury et al 2003). "Spectral Difference" may be appropriate for percussive recordings, "Phase Deviation" for non-percussive music, and "Broadband Energy Rise" (see reference, Barry et al 2005) for identifying percussive onsets in mixed music. Onset Detector Sensitivity – Sensitivity level for peak detection in the onset likelihood function. The higher the sensitivity, the more onsets will (rightly or wrongly) be detected. The peak picker does not have a simple threshold level; instead, this parameter controls the required "steepness" of the slopes in the smoothed detection function either side of a peak value, in order for that peak to be accepted as an onset. Adaptive Whitening – This option evens out the temporal and frequency variation in the signal, which can yield improved performance in onset detection, for example in audio with big variations in dynamics. Note Onsets – The detected note onset times, returned as a single feature with timestamp but no value for each detected note.'
year_published = 2025
clearnet = "https://vamp-plugins.org/plugin-doc/qm-vamp-plugins.html"
