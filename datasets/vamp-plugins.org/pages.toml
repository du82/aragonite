full_description = "This page lists plugins made by research groups and developers around the world. It is generated automatically from RDF descriptions published by the plugin authors. ▶ Vamp Plugin Pack — Some of these plugins are also available in the Vamp Plugin Pack, a convenient bundle installer. A Vamp plugin set consists of a single dynamic library file with .dll, .dylib, or .so extension (depending on your platform), plus optionally a category file with .cat extension and an RDF description file with .ttl or .n3 extension. To install a plugin set, copy the plugin's library file and any supplied category or RDF files into your system or personal Vamp plugin location. The plugin file extension and the location to copy into depend on which operating system you are using: You can alternatively set the VAMP_PATH environment variable to override the search path for for Vamp plugins. VAMP_PATH should contain a semicolon-separated (on Windows) or colon-separated (macOS, Linux) list of directory locations. If it is set, it will completely override the standard locations listed above. (N.B. When using 32-bit plugins on 64-bit Windows, some hosts will check for the VAMP_PATH_32 environment variable instead of VAMP_PATH.)"
