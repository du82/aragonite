["https://vanityfair.com/hollywood/story/the-power-and-the-glamour-portfolio-2025"]
title = "The Power & the Glamour: Gwyneth Paltrow, Stephen and Ayesha Curry, Bela Bajaria, and More | Vanity Fair"
description = "Portraits of the artists and visionaries pushing Hollywood forward in times both dark and bright."
full_description = 'FROM THE MAGAZINEMARCH 2025 IssueThe Power & the Glamour: Gwyneth Paltrow, Stephen and Ayesha Curry, Bela Bajaria, and MorePortraits of the artists and visionaries pushing Hollywood forward in times both dark and bright.Photography by Norman Jean RoyStyled by Deborah AfshaniFebruary 14, 2025Michelle Yeoh’s veiled dress by Nina Ricci; sunglasses by Balenciaga; ear clips by Vhernier; skin-care products by Helena Rubinstein.Photograph by Norman Jean Roy; Styled by Deborah Afshani.Save this storySaveSave this storySave<img alt="Gwyneth Paltrow" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-02.jpg" srcSet="https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_120,c_limit/VF0325-VF-March-P&amp;G-02.jpg 120w, https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_240,c_limit/VF0325-VF-March-P&amp;G-02.jpg 240w, https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_320,c_limit/VF0325-VF-March-P&amp;G-02.jpg 320w, https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_640,c_limit/VF0325-VF-March-P&amp;G-02.jpg 640w, https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_960,c_limit/VF0325-VF-March-P&amp;G-02.jpg 960w, https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-02.jpg 1280w, https://media.vanityfair.com/photos/67ab6fb4ba40cc3885f59260/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-02.jpg 1600w" sizes="100vw"/>Gwyneth Paltrow’s corset and shoes by Mugler; cuffs by Tiffany & Co. Elsa Peretti; hair products by Oribe; makeup products by Goop Beauty; nail enamel by Essie. Photograph by Norman Jean Roy; Styled by Deborah Afshani.THE TASTEMAKER: GWYNETH PALTROWA whole generation has grown up since Paltrow won her Oscar for Shakespeare in Love. Now the hugely influential titan of Goop is returning to film in a major (non-Marvel) role for the first time in years, starring in Josh Safdie’s Marty Supreme opposite Timothée Chalamet. It’s a testament to Paltrow’s ability to do anything and everything on her own terms—and look better than the rest of us while doing it.<img alt="Image may contain Stephen Curry Ayesha Curry Couch Furniture People Person Face Head Photography and Portrait" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-04.jpg" srcSet="https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_120,c_limit/VF0325-VF-March-P&amp;G-04.jpg 120w, https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_240,c_limit/VF0325-VF-March-P&amp;G-04.jpg 240w, https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_320,c_limit/VF0325-VF-March-P&amp;G-04.jpg 320w, https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_640,c_limit/VF0325-VF-March-P&amp;G-04.jpg 640w, https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_960,c_limit/VF0325-VF-March-P&amp;G-04.jpg 960w, https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-04.jpg 1280w, https://media.vanityfair.com/photos/67ab6fb23be09a4ca3b55d7f/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-04.jpg 1600w" sizes="100vw"/>Ayesha Curry’s clothing by Saint Laurent by Anthony Vaccarello from Neiman Marcus; sandals by Giuseppe Zanotti; necklace by Tiffany & Co.; bracelet and rings (right hand and left index finger) by Bulgari; makeup products by One/Size; skin-care products by Sweet July Skin. Stephen Curry’s clothing by Tom Ford; pocket square by Charvet; studs and cuff links by David Yurman; watch by Cartier. Photograph by Norman Jean Roy; Styled by Deborah Afshani.THE RENAISSANCE COUPLE: AYESHA & STEPHEN CURRYAyesha’s Sweet July started as a lifestyle brand, built on the heels of her culinary success. It has since expanded to books and film production and opened its first location outside the Bay Area at the Regent Santa Monica. Stephen’s Unanimous Media has a global talent partnership with Comcast NBCUniversal to produce original content. The entrepreneurial spirit was passed down by Ayesha’s mother, and that tenacity inspired Ayesha’s husband when the couple moved up the coast for the Golden State Warriors. “You have more control of your narrative,” Stephen says. “You’re building things that have more meaningful impact and ownership for the long term.” It’s way beyond basketball now.Read More<img alt="Image may contain Michelle Yeoh Face Head Person Photography Portrait Clothing Coat Jacket Adult and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-03b.jpg" srcSet="https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_120,c_limit/VF0325-VF-March-P&amp;G-03b.jpg 120w, https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_240,c_limit/VF0325-VF-March-P&amp;G-03b.jpg 240w, https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_320,c_limit/VF0325-VF-March-P&amp;G-03b.jpg 320w, https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_640,c_limit/VF0325-VF-March-P&amp;G-03b.jpg 640w, https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_960,c_limit/VF0325-VF-March-P&amp;G-03b.jpg 960w, https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-03b.jpg 1280w, https://media.vanityfair.com/photos/67ab6fb651001aeff55fa4f7/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-03b.jpg 1600w" sizes="100vw"/>Michelle Yeoh’s jacket by Balenciaga; sunglasses by Chimi; earrings by Bottega Veneta. Photograph by Norman Jean Roy; Styled by Deborah Afshani.THE ICON: MICHELLE YEOHTwo years ago she made history by becoming the first Asian woman to win an Academy Award for best actress in a leading role. Today she’s captivating audiences as Madame Morrible, the grande dame of Wicked. Yeoh’s genre-smashing career has spanned Hong Kong action films, the Bond franchise, and the hit rom-com Crazy Rich Asians. It’s no wonder she commands every room—and scene—she’s in.<img alt="Image may contain Brice Conrad Photography Face Head Person Portrait Chair Furniture Teen and Sitting" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-07.jpg" srcSet="https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_120,c_limit/VF0325-VF-March-P&amp;G-07.jpg 120w, https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_240,c_limit/VF0325-VF-March-P&amp;G-07.jpg 240w, https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_320,c_limit/VF0325-VF-March-P&amp;G-07.jpg 320w, https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_640,c_limit/VF0325-VF-March-P&amp;G-07.jpg 640w, https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_960,c_limit/VF0325-VF-March-P&amp;G-07.jpg 960w, https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-07.jpg 1280w, https://media.vanityfair.com/photos/67ab6fb3ba40cc3885f5925e/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-07.jpg 1600w" sizes="100vw"/>Jonathan Anderson’s hair products by Davines; grooming products by Dr. Barbara Sturm. Photograph by Norman Jean Roy; Styled by Deborah Afshani.THE SECRET WEAPON: JONATHAN ANDERSONAfter conquering the fashion world with his namesake label and as the creative director of Loewe, Anderson is coming for Hollywood. In 2024 he served as costume designer for Luca Guadagnino’s captivating movies Challengers and Queer, with his I Told Ya T-shirt from the former becoming a social media phenom. Rumors of his continuing ascent abound, so it’s quite possible he’ll be onto a whole new chapter by the time you read this sentence.<img alt="Image may contain Photography Adult Person Camera and Electronics" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-05.jpg" srcSet="https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_120,c_limit/VF0325-VF-March-P&amp;G-05.jpg 120w, https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_240,c_limit/VF0325-VF-March-P&amp;G-05.jpg 240w, https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_320,c_limit/VF0325-VF-March-P&amp;G-05.jpg 320w, https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_640,c_limit/VF0325-VF-March-P&amp;G-05.jpg 640w, https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_960,c_limit/VF0325-VF-March-P&amp;G-05.jpg 960w, https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-05.jpg 1280w, https://media.vanityfair.com/photos/67ab6fb1c8f1c19aac6f9abd/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-05.jpg 1600w" sizes="100vw"/>Foreground: Alex Prager’s jacket by Courrèges from Neiman Marcus; top by Hermès. Background, left: clothing by Prada. Background, center: clothing and scarf by Hermès; boots by Khaite; sunglasses by Jacques Marie Mage. Background, right: clothing by Prada; boots by The Row; sunglasses by Chloé; estate earrings from Lang Antique & Estate Jewelry; ring (right hand) by Bulgari. Hair products by Ro-z; makeup products by Westman Atelier. Photograph by Norman Jean Roy; Styled by Deborah Afshani.THE ILLUSIONIST: ALEX PRAGERFor decades Prager has made photographs so cinematic, they explode off the walls of the gallery and exist as their own mini worlds. Now she’s directing a feature film starring John C. Reilly and Elizabeth Banks. “Because of my long career in art, I am innately tuned in to those in-between moments, those reflections of life, and I can spot emotional truth when it plays out in front of me,” Prager says.<img alt="BELA BAJARIA" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-06.jpg" srcSet="https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_120,c_limit/VF0325-VF-March-P&amp;G-06.jpg 120w, https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_240,c_limit/VF0325-VF-March-P&amp;G-06.jpg 240w, https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_320,c_limit/VF0325-VF-March-P&amp;G-06.jpg 320w, https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_640,c_limit/VF0325-VF-March-P&amp;G-06.jpg 640w, https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_960,c_limit/VF0325-VF-March-P&amp;G-06.jpg 960w, https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-06.jpg 1280w, https://media.vanityfair.com/photos/67ad1a2bd2bfa1d0b7de30ea/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-06.jpg 1600w" sizes="100vw"/>Bela Bajaria’s trench coat by Alaïa from Neiman Marcus; earrings by Tabayer; hair products by Nexxus; nail enamel by Chanel Le Vernis.Photograph by Norman Jean Roy; Styled by Deborah Afshani.THE GREENLIGHT: BELA BAJARIAFollowing a shake-up at Netflix, Bajaria emerged as the chief content officer of the streaming giant, which serves a staggering 283 million subscribers globally. She’s the force driving its expansion into new territories as well as its live events and sports coverage—while simultaneously overseeing all film, scripted TV, documentaries, reality, comedy, and more. When you Netflix and chill, you can thank her and her team.Read More<img alt="Image may contain Issa Rae Back Body Part Person Adult Car Transportation Vehicle Clothing Shorts and Machine" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-11.jpg" srcSet="https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_120,c_limit/VF0325-VF-March-P&amp;G-11.jpg 120w, https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_240,c_limit/VF0325-VF-March-P&amp;G-11.jpg 240w, https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_320,c_limit/VF0325-VF-March-P&amp;G-11.jpg 320w, https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_640,c_limit/VF0325-VF-March-P&amp;G-11.jpg 640w, https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_960,c_limit/VF0325-VF-March-P&amp;G-11.jpg 960w, https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-11.jpg 1280w, https://media.vanityfair.com/photos/67ab6fb151001aeff55fa4f3/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-11.jpg 1600w" sizes="100vw"/>Issa Rae’s clothing by Gucci; earrings, bracelets, and rings (all except left ring finger) by Cartier; hair products by Sienna Naturals; makeup products by Makeup by Mario. Photograph by Norman Jean Roy; Styled by Deborah Afshani.THE POWERHOUSE: ISSA RAEActor, writer, producer, restaurateur, and author, Rae is one of the busiest forces in Hollywood. She currently has a deal at WarnerMedia to produce film and TV, a new restaurant opening in South LA, and a role in the seventh season of Black Mirror. You won’t catch her wasting time—you probably won’t catch her at all.<img alt="Image may contain Computer Computer Hardware Computer Keyboard Electronics Hardware Adult Person and Wristwatch" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_1600%2Cc_limit/VF0325-VF-March-P&amp;G-01.jpg" srcSet="https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_120,c_limit/VF0325-VF-March-P&amp;G-01.jpg 120w, https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_240,c_limit/VF0325-VF-March-P&amp;G-01.jpg 240w, https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_320,c_limit/VF0325-VF-March-P&amp;G-01.jpg 320w, https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_640,c_limit/VF0325-VF-March-P&amp;G-01.jpg 640w, https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_960,c_limit/VF0325-VF-March-P&amp;G-01.jpg 960w, https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_1280,c_limit/VF0325-VF-March-P&amp;G-01.jpg 1280w, https://media.vanityfair.com/photos/67ab6fb5938b3945b7d7f6a4/master/w_1600,c_limit/VF0325-VF-March-P&amp;G-01.jpg 1600w" sizes="100vw"/>Laura Wasser’s belted dress by Alaïa from Neiman Marcus; boots by Giuseppe Zanotti; earrings, ear cuff, and choker by Anita Ko; watch'
