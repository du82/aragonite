title = "When Sean Penn Got Mad at Chris Rock: Recapping the 2005 Oscar Ceremony | Vanity Fair"
description = "Twenty years ago at the Academy Awards, Beyoncé performed three times, Million Dollar Baby reigned supreme, Jamie Foxx charmed the nation, and Sean Penn defended Jude Law."
full_description = 'NostalgiaWhen Sean Penn Got Mad at Chris Rock: Recapping the 2005 Oscar CeremonyTwenty years ago at the Academy Awards, Beyoncé performed three times, Million Dollar Baby reigned supreme, Jamie Foxx charmed the nation, and Sean Penn defended Jude Law.By Richard LawsonFebruary 28, 2025FacebookXEmailSave StoryFrom Getty Images.Save this storySaveSave this storySaveIt’s Sunday, February 27, 2005, and the 77th Academy Awards are a mere excruciating pre-show away from beginning. The stars are taking to the red carpet in front of the Kodak Theater—now known as the Dolby Theater, because no one buys film anymore—in the lead up to this most glamorous of evenings.<img alt="Image may contain Person Book Publication and Art" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_1600%2Cc_limit/1%2520-%2520Countdown.png" srcSet="https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_120,c_limit/1%20-%20Countdown.png 120w, https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_240,c_limit/1%20-%20Countdown.png 240w, https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_320,c_limit/1%20-%20Countdown.png 320w, https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_640,c_limit/1%20-%20Countdown.png 640w, https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_960,c_limit/1%20-%20Countdown.png 960w, https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_1280,c_limit/1%20-%20Countdown.png 1280w, https://media.vanityfair.com/photos/67c0b26d3c3b9576cf0d6849/master/w_1600,c_limit/1%20-%20Countdown.png 1600w" sizes="100vw"/>How is 2005 twenty years ago? Why, there’s young Natalie Portman, nominated for her performance as a tenacious stripper in Closer.<img alt="Image may contain Natalie Portman John Lasseter Fashion Adult Person Photobombing Clothing Dress and Formal Wear" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_1600%2Cc_limit/2%2520-%2520Natalie%2520Carpet.png" srcSet="https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_120,c_limit/2%20-%20Natalie%20Carpet.png 120w, https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_240,c_limit/2%20-%20Natalie%20Carpet.png 240w, https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_320,c_limit/2%20-%20Natalie%20Carpet.png 320w, https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_640,c_limit/2%20-%20Natalie%20Carpet.png 640w, https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_960,c_limit/2%20-%20Natalie%20Carpet.png 960w, https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_1280,c_limit/2%20-%20Natalie%20Carpet.png 1280w, https://media.vanityfair.com/photos/67c0b2aa3c3b9576cf0d684b/master/w_1600,c_limit/2%20-%20Natalie%20Carpet.png 1600w" sizes="100vw"/>“Beat ya to it, Mikey.” There’s young Alan Alda, nominated for his performance as a mysterious Republican in The Aviator.<img alt="Image may contain Alan Alda Head Person Face Adult Accessories Formal Wear Tie Photography Portrait and Crowd" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_1600%2Cc_limit/3%2520-%2520Alda%2520Carpet.png" srcSet="https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_120,c_limit/3%20-%20Alda%20Carpet.png 120w, https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_240,c_limit/3%20-%20Alda%20Carpet.png 240w, https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_320,c_limit/3%20-%20Alda%20Carpet.png 320w, https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_640,c_limit/3%20-%20Alda%20Carpet.png 640w, https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_960,c_limit/3%20-%20Alda%20Carpet.png 960w, https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_1280,c_limit/3%20-%20Alda%20Carpet.png 1280w, https://media.vanityfair.com/photos/67c0b2c01188cd934c93ae68/master/w_1600,c_limit/3%20-%20Alda%20Carpet.png 1600w" sizes="100vw"/>“I’m not the one who peed in jars. That was the other guy.” Hey look, it’s Hilary Swank, already an Oscar winner for Boys Don’t Cry, now nominated for Million Dollar Baby. Do you think she sees Alaska Daily in her future?<img alt="Image may contain Hilary Swank One Fashion Clothing Formal Wear Suit Person Photobombing Adult Tuxedo and Head" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_1600%2Cc_limit/4%2520-%2520Hilary%2520Carpet.png" srcSet="https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_120,c_limit/4%20-%20Hilary%20Carpet.png 120w, https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_240,c_limit/4%20-%20Hilary%20Carpet.png 240w, https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_320,c_limit/4%20-%20Hilary%20Carpet.png 320w, https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_640,c_limit/4%20-%20Hilary%20Carpet.png 640w, https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_960,c_limit/4%20-%20Hilary%20Carpet.png 960w, https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_1280,c_limit/4%20-%20Hilary%20Carpet.png 1280w, https://media.vanityfair.com/photos/67c0b2d0af1c99e55b68d3bc/master/w_1600,c_limit/4%20-%20Hilary%20Carpet.png 1600w" sizes="100vw"/>“Surely Insomnia will be my only Alaska-based project.” Here’s professional model scout Leonardo DiCaprio, nominated for The Aviator, in which he plays a born-rich zillionaire interested in aeronautics and politics who did lots of crazy things. Thank god we don’t have any of those running around today!<img alt="Image may contain Leonardo DiCaprio Face Head Person Photography Portrait Formal Wear Accessories Tie and People" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_1600%2Cc_limit/5%2520-%2520Leo%2520Carpet.png" srcSet="https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_120,c_limit/5%20-%20Leo%20Carpet.png 120w, https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_240,c_limit/5%20-%20Leo%20Carpet.png 240w, https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_320,c_limit/5%20-%20Leo%20Carpet.png 320w, https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_640,c_limit/5%20-%20Leo%20Carpet.png 640w, https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_960,c_limit/5%20-%20Leo%20Carpet.png 960w, https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_1280,c_limit/5%20-%20Leo%20Carpet.png 1280w, https://media.vanityfair.com/photos/67c0b2edc1a75b5d4519f185/master/w_1600,c_limit/5%20-%20Leo%20Carpet.png 1600w" sizes="100vw"/>“I’m the one who peed in jars.” In case you need some context, here are the five features nominated for best picture.<img alt="Image may contain Cloud Nature Outdoors Sky Cumulus Weather Book and Publication" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b303b24b9ad52d6403c0/master/w_1600%2Cc_limit/6%2520-%2520Aviator%2520Nom.png" srcSet="https://media.vanityfair.com/photos/67c0b303b24b9ad52d6403c0/master/w_120,c_limit/6%20-%20Aviator%20Nom.png 120w, https://media.vanityfair.com/photos/67c0b303b24b9ad52d6403c0/master/w_240,c_limit/6%20-%20Aviator%20Nom.png 240w, https://media.vanityfair.com/photos/67c0b303b24b9ad52d6403c0/master/w_320,c_limit/6%20-%20Aviator%20Nom.png 320w, https://media.vanityfair.com/photos/67c0b303b24b9ad52d6403c0/master/w_640,c_limit/6%20-%20Aviator%20Nom.png 640w, https://media.vanityfair.com/p