title = "David Johansen: His Life In Photos | Vanity Fair"
description = "New York Dolls frontman David Johansen, who also performed as “Buster Poindexter,” died Friday at age 75."
full_description = '''ObituaryDavid Johansen: His Life In PhotosThe New York Dolls frontman, who also performed as “Buster Poindexter,” died Friday at age 75.By Eve BateyMarch 1, 2025American singer, songwriter and actor, David Johansen poses for a portrait circa 1980 at The Old Waldorf in San Francisco, California.Joel Selvin/Getty ImagesSave this storySaveSave this storySaveDavid Johansen, the groundbreaking punk musician and tastemaker who shook up fashion's then-rigid gender norms, died on Friday after a Valentine's Day announcement of stage 4 cancer, a brain tumor, and a broken back. He was 75.The vocalist for the influential 1970s-era punk band the New York Dolls hit the mainstream in the 1980s and ‘90s as satire-adjacent lounge act Buster Poindexter; his song “Hot, Hot, Hot” has served as the soundtrack to countless wedding receptions, commercials, and TV shows.According to a message posted by daughter Leah Hennessey to the Sweet Relief musician’s fund, he died on February 28 “peacefully at home, holding the hands of his wife Mara Hennessey and daughter Leah, in the sunlight surrounded by music and flowers.”<img alt="Image may contain David Johansen Jeordie White Tom Hamilton Mark St. John Person People Adult Face and Head" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_1600%2Cc_limit/515351502" srcSet="https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_120,c_limit/515351502 120w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_240,c_limit/515351502 240w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_320,c_limit/515351502 320w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_640,c_limit/515351502 640w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_960,c_limit/515351502 960w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_1280,c_limit/515351502 1280w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ab/master/w_1600,c_limit/515351502 1600w" sizes="100vw"/>The New York Dolls are one of the first rock bands to come out of New York City since Andy Warhol unveiled the Velvet Underground in the mid-1960s. Left to right are: Arthur Kane, Jerry Nolan, David Johansen, Sylvain Sylvain, and Johnny Thunders. Bettmann<img alt="Image may contain Slash David Johansen Kevin Ayers Concert Crowd Person Guitar Musical Instrument and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_1600%2Cc_limit/73998285" srcSet="https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_120,c_limit/73998285 120w, https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_240,c_limit/73998285 240w, https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_320,c_limit/73998285 320w, https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_640,c_limit/73998285 640w, https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_960,c_limit/73998285 960w, https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_1280,c_limit/73998285 1280w, https://media.vanityfair.com/photos/67c34732d684ece5397a75c6/master/w_1600,c_limit/73998285 1600w" sizes="100vw"/>Singer David Johansen, guitarist Johnny Thunders, drummer Jerry Nolan, bassist Arthur Kane, and guitarist Sylvain Sylvain of the rock and roll group 'The New York Dolls' pose for a portrait with host Don Steele on 'The Real Don Steele Show' on KHJ channel 9 on September 8, 1973 in Los Angeles, California. ( Michael Ochs Archives/Getty Images<img alt="Image may contain David Johansen Bruna di Tullio Clothing Hat Face Head Person Photography Portrait and People" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_1600%2Cc_limit/1454049395" srcSet="https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_120,c_limit/1454049395 120w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_240,c_limit/1454049395 240w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_320,c_limit/1454049395 320w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_640,c_limit/1454049395 640w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_960,c_limit/1454049395 960w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_1280,c_limit/1454049395 1280w, https://media.vanityfair.com/photos/67c3473241242ef64d0376ad/master/w_1600,c_limit/1454049395 1600w" sizes="100vw"/>Randy Jones, Paula Ciccone and David Johansen at Limelight, London, England, United Kingdom, circa 1990s. Vinnie Zuffante/Getty ImagesIn a 2002 story for Vanity Fair, music journalist Lisa Robinson wrote that “nearly everyone would agree that in early 1972, when the New York Dolls performed every Tuesday night at the Oscar Wilde Room of the Mercer Arts Center in the Broadway Central Hotel, the 1970s New York rock scene was officially born.”<img alt="Image may contain Myke Scavone NLE Choppa Concert Crowd Person Accessories Belt Guitar and Musical Instrument" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_1600%2Cc_limit/98557032" srcSet="https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_120,c_limit/98557032 120w, https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_240,c_limit/98557032 240w, https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_320,c_limit/98557032 320w, https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_640,c_limit/98557032 640w, https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_960,c_limit/98557032 960w, https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_1280,c_limit/98557032 1280w, https://media.vanityfair.com/photos/67c347320e75aa7f01daa8b8/master/w_1600,c_limit/98557032 1600w" sizes="100vw"/>Sylvain Sylvain David Johansen of New York Dolls performs on stage at KOKO on April 19, 2010 in London, England. Barney Britton<img alt="Image may contain David Johansen Head Person Face Accessories Jewelry Necklace Adult and Electrical Device" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_1600%2Cc_limit/1433015316" srcSet="https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_120,c_limit/1433015316 120w, https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_240,c_limit/1433015316 240w, https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_320,c_limit/1433015316 320w, https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_640,c_limit/1433015316 640w, https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_960,c_limit/1433015316 960w, https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_1280,c_limit/1433015316 1280w, https://media.vanityfair.com/photos/67c34732036d28eb8afcb7c2/master/w_1600,c_limit/1433015316 1600w" sizes="100vw"/>Mara Hennessey and David Johansen speak during a screening of "Personality Crisis: One Night Only" during the 60th New York Film Festival at The Film Society of Lincoln Center, Alice Tully Hall on October 13, 2022 in New York City. Arturo Holmes/Getty Images<img alt="Image may contain David Johansen Tommy Chong Cheech Marin Bob Holman Blazer Clothing Coat Jacket People and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_1600%2Cc_limit/1447950656" srcSet="https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_120,c_limit/1447950656 120w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_240,c_limit/1447950656 240w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_320,c_limit/1447950656 320w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_640,c_limit/1447950656 640w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_960,c_limit/1447950656 960w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_1280,c_limit/1447950656 1280w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084487/master/w_1600,c_limit/1447950656 1600w" sizes="100vw"/>David Johansen, Tommy Chong, Les Paul, Cheech Marin and Adam Clayton attend an event, 10th November 1985. Vinnie Zuffante/Getty Images“When we formed our band, we knew we had the best rock ’n’ roll band,” David Johansen told Robinson in an interview—conducted from Robinson's apartment, with the band clad in “platform wedgies, hotcha green-trimmed sunglasses, sequined hot pants, transparent chiffon blouses, pink denim overalls covered by a dragon-appliquéd apron.”“When the record companies come to see us, I think they get turned on," Johansen said. "Their wives get drunk and start dancing and they go crazy. But then they think about their kids. . .and that’s what stops them. They start thinking about their kids.”<img alt="Image may contain David Johansen Face Head Person Photography Portrait Accessories Jewelry Necklace and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_1600%2Cc_limit/1248973774" srcSet="https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_120,c_limit/1248973774 120w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_240,c_limit/1248973774 240w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_320,c_limit/1248973774 320w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_640,c_limit/1248973774 640w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_960,c_limit/1248973774 960w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_1280,c_limit/1248973774 1280w, https://media.vanityfair.com/photos/67c347323d2bf7c53b084488/master/w_1600,c_limit/1248973774 1600w" sizes="100vw"/>American singer and songwriter David Johansen (right) at a party, circa 1980. Michael Ochs Archives/Getty Images<img alt="Image may contain David Johansen Face Head Person Photography Portrait Couch Furniture Adult Book and Publication" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_1600%2Cc_limit/1273560404" srcSet="https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_120,c_limit/1273560404 120w, https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_240,c_limit/1273560404 240w, https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_320,c_limit/1273560404 320w, https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_640,c_limit/1273560404 640w, https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_960,c_limit/1273560404 960w, https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_1280,c_limit/1273560404 1280w, https://media.vanityfair.com/photos/67c34734f5ec37ce3e29251e/master/w_1600,c_limit/1273560404 1600w" sizes="100vw"/>Singer David Johansen aka Buster Poindexter at the Hyatt Regency Hotel in Minneapolis, Minnesota on May 1, 1989. Jim Steinfeldt/Getty Images<img alt="Image may contain David Johansen Clothing Coat Jacket Face Head Person Photography Portrait Adult and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_1600%2Cc_limit/1285307173" srcSet="https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_120,c_limit/1285307173 120w, https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_240,c_limit/1285307173 240w, https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_320,c_limit/1285307173 320w, https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_640,c_limit/1285307173 640w, https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_960,c_limit/1285307173 960w, https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_1280,c_limit/1285307173 1280w, https://media.vanityfair.com/photos/67c34734ceb06dd250513a9f/master/w_1600,c_limit/1285307173 1600w" sizes="100vw"/>New York Dolls singer David Johansen photographed in London in 2006 Andy Willsher/Getty Images“We knew in our hearts that we were hipper than anybody else. So at least we didn’t have a confidence problem,” Johansen told Robinson in 1978. “What is all this talk about being musically proficient? I mean, I just saw Monterey Pop, and if you look at the Who or Janis Joplin at that stage of their careers, well, we’re just as musically proficient as they were then.”<img alt="Image may contain David Johansen Electrical Device Microphone Accessories Jewelry Ring Adult Person and Performer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c3473435f1e4ac27a0ea63/master/w_1600%2Cc_limit/1250564868" srcSet="https://media.vanityfair.com/photos/67c3473435f1e4ac27a0ea63/master/w_120,c_limit/1250564868 120w, https://media.vanityfair.com/photos/67c3473435f1e4ac27a0ea63/master/w_240,c_limit/1250564868 240w, https://media.vanityfair.com/photos/67c3473435f1e4ac27a0ea63/master/w_320,c_limit/1250564868 320w, https://media.vanityfair.com/photos/67c3473435f1e4ac27a0ea63/master/w_640,c_limit/1250564868 640w, https://media.vanityfair.com/photos/67c3473435f1e4ac27a0ea63/master/w_960,c_limit/1250564868 960w, https://media.vanityfair.com/photos/67c3473435f1e4ac27a0ea63/master/w_1280,c_limit/1250564868 1280w, https://me