["https://vanityfair.com/hollywood/story/wicked-ariana-grande-cynthia-erivo-cover"]
title = "‘Wicked’ Stars Cynthia Erivo and Ariana Grande on Love, Defying Rumors, and Flying High | Vanity Fair"
description = "“We needed real connection,” Erivo says of their friendship, which bloomed just as Grande needed it most: “Tabloids have been trying to destroy me since I was 19.”"
full_description = 'COVER STORYNOVEMBER 2024 IssueWicked Stars Cynthia Erivo and Ariana Grande on Love, Defying Rumors, and Flying High“We needed real connection,” Erivo says of their friendship, which bloomed just as Grande needed it most: “Tabloids have been trying to destroy me since I was 19.”By Chris MurphyPhotography by Norman Jean RoyStyled by Patti WilsonSeptember 30, 2024Cynthia Erivo and Ariana Grande, photographed in Los Angeles on July 31. Erivo’s clothing by Schiaparelli Haute Couture; mask by Lynn Paik; earring by Paumé Los Angeles (right ear) and Maria Tash (all others); nose ring by Messika High Jewelry. Grande’s dress by Schiaparelli Haute Couture; earring by Khaite; ear cuff by Panconesi.Photograph by Norman Jean Roy; Styled by Patti Wilson.Save this storySaveSave this storySave“I’d offer you a seat outside, but I’m scared that the coyote is going to come,” Ariana Grande says sweetly.“Literally an hour ago he just walked right over and jumped over the fence. I was like, Excuse me?” Coyotes can mercilessly attack small dogs, and Grande has two, Toulouse and Myron. “I take Toulouse out to pee, and I’m holding him while he’s pissing in the air,” she tells me, then addresses the coyote, wherever it may roam: “Eat me first!”<img alt="Cynthia Erivo and Ariana Grande photographed for Vanity Fair." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_1600%2Cc_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg" srcSet="https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_120,c_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg 120w, https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_240,c_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg 240w, https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_320,c_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg 320w, https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_640,c_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg 640w, https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_960,c_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg 960w, https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_1280,c_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg 1280w, https://media.vanityfair.com/photos/66f47995ac445769ae8ef8c4/master/w_1600,c_limit/VF1124_DigitalCover_Cynthia_and_Ariana.jpg 1600w" sizes="100vw"/>Erivo’s clothing, hat, belt, and cuffs by Louis Vuitton; boots by Marc Jacobs; hood by Paumé Los Angeles; earring (as septum ring) by Maria Tash. Grande’s dress and shoes by Marc Jacobs; tights by Wolford; jewelry by Swarovski.Photograph by Norman Jean Roy; Styled by Patti Wilson.<img alt="Ariana Grande photographed for Vanity Fair." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_1600%2Cc_limit/VF1124_DigitalCover_Ariana.jpg" srcSet="https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_120,c_limit/VF1124_DigitalCover_Ariana.jpg 120w, https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_240,c_limit/VF1124_DigitalCover_Ariana.jpg 240w, https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_320,c_limit/VF1124_DigitalCover_Ariana.jpg 320w, https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_640,c_limit/VF1124_DigitalCover_Ariana.jpg 640w, https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_960,c_limit/VF1124_DigitalCover_Ariana.jpg 960w, https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_1280,c_limit/VF1124_DigitalCover_Ariana.jpg 1280w, https://media.vanityfair.com/photos/66f47995d8bc47a723ebd995/master/w_1600,c_limit/VF1124_DigitalCover_Ariana.jpg 1600w" sizes="100vw"/>Ariana Grande’s clothing and bow by Chanel Haute Couture; tights by Wolford; earrings by Swarovski.Photograph by Norman Jean Roy; Styled by Patti Wilson.<img alt="Cynthia Erivo photographed for Vanity Fair." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_1600%2Cc_limit/VF1124_DigitalCover_Cynthia.jpg" srcSet="https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_120,c_limit/VF1124_DigitalCover_Cynthia.jpg 120w, https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_240,c_limit/VF1124_DigitalCover_Cynthia.jpg 240w, https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_320,c_limit/VF1124_DigitalCover_Cynthia.jpg 320w, https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_640,c_limit/VF1124_DigitalCover_Cynthia.jpg 640w, https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_960,c_limit/VF1124_DigitalCover_Cynthia.jpg 960w, https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_1280,c_limit/VF1124_DigitalCover_Cynthia.jpg 1280w, https://media.vanityfair.com/photos/66f4799576e05e0860b237c2/master/w_1600,c_limit/VF1124_DigitalCover_Cynthia.jpg 1600w" sizes="100vw"/>Cynthia Erivo’s dress and hat by Louis Vuitton; boots by Marc Jacobs; head wrap by Heather Huey; earring (as septum ring) by Maria Tash; necklace by Bulgari High Jewelry; ring by KerenWolf x Retrofete.Photograph by Norman Jean Roy; Styled by Patti Wilson.We’re standing outside “the tree house,” which is what Grande calls her bungalow tucked away in the Hollywood Hills. Soon we’re joined by Cynthia Erivo, who stars with her in one of the fall’s most anticipated films, Wicked. When she arrives, Toulouse and Myron bound toward her as though they’re greeting an old friend. Inside, Grande starts to make us all tea, but Erivo politely declines, holding up a thermos and taking a sip of her green elixir. “I made my own little matcha,” she says.“I’ve always said that Wicked was the love story between two girls,” says Kristin Chenoweth. “Ariana and Cynthia are going to be a power couple.”A Broadway show based on the novel of the same name by Gregory Maguire, Wicked is a musical prequel to The Wizard of Oz that imagines Elphaba and Glinda as frenemies before Dorothy dropped out of the sky. It premiered in October 2003 and dazzled audiences thanks to a stunning score by Stephen Schwartz and indelible performances by Idina Menzel and Kristin Chenoweth. After two decades in development hell, director Jon M. Chu has delivered a film adaptation that’s so confident in its zaniness, so assured in its world-building, and so defiantly big-budget that it sweeps you away like a house in a tornado. The performances are captivating across the board, but the story rests on Elphaba’s and Glinda’s shoulders. Fortunately they’re portrayed by Erivo, who’s got an Emmy, a Tony, and a Grammy, and Grande, a pop sensation with two Grammys and nine Billboard Hot 100 number one hits.“I’ve always said that Wicked was the love story between two girls,” says Chenoweth. “The three things that I love about it are what I look for in all kinds of art that I do, which is love, forgiveness, and friendship. That’s what Ariana and Cynthia both have, and that’s why they’re going to be a power couple.”Power couple really only scratches the surface.In the original Oz story, the witches are polar opposites. Wicked posits that they’re more alike than they appear—much like Grande and Erivo, who crack up when the latter arrives and they discover they’re dressed in similar outfits. Grande has on a pink Khaite sweater, jeans from Agolde, and Tabis from Maison Margiela. Erivo is wearing Marni jeans, a blue J.Crew oversized cardigan over a Lunya top, and Bottega green sandals. Both have glasses on as well. “We do this every time,” Grande says.But Grande and Erivo move through the world quite differently. The former is bubbly and bright, with a theater kid’s flair for the dramatic and confessional; the latter is kind but more guarded. The dynamic isn’t far from the one their Wicked alter egos share: Grande’s the girlish and gabby Glinda, while Erivo’s the more internal and reserved Elphaba. Even their nails seem in character: Erivo’s are long and green, while Grande sports an almondy pink manicure with French tips.Like the witches they play, they approached the Wicked audition with radically different mindsets. “I didn’t even believe I would be seen,” Erivo says. “I was like, I don’t think this is going to happen, but I love the idea of watching this musical.” Until she booked an audition, she tried to shut out any and all intel about the process. “I kept telling my team, ‘Do not give me any information. I don’t want to know,’ ” she says. “ ‘I don’t want to know who’s gone in. I don’t want to know what people are being asked to do. I don’t want to know anything about it.’ ” And when she finally got in the room? “She embodied this version of Elphaba that I had never seen,” Chu tells me.Grande had been pursuing the role of Glinda since she turned 20 in 2013. “She auditioned many times,” says Chu, recalling how the singer would regularly show up 30 minutes early and circle around in her car until it was time. “I sort of didn’t want to believe that she could do this. It seems almost too easy to say, ‘Oh, Ariana Grande.’ ” But time and again, Grande proved her worth. “Every time she came in, she was the most interesting person,” Chu says. “You just couldn’t take your eyes away.”Ultimately, Grande was arguably too involved in the process. “I knew so many of the people that were going in, and everyone was texting me,” she says. “I was trying my very best to be 100 percent transparent with everyone. Like, ‘This is my tea. This is what I’m singing. I’m going in on the 13th. I love you. Text me after.’ ” She even helped a few people who were less familiar with the material prepare for their auditions by singing with them.Erivo shakes her head in disbelief: “Ari, that’s crazy.”“I know,” Grande says. “I had no boundaries back then.”Erivo sighs: “I’m so glad we know each other now.”They both find performing less unnerving than red carpets. “That is not scary at all,” Grande says. “That’s so lovely and thrilling.” Erivo agrees: “That’s like home.”Grande lights a Diptyque candle, and we gather around her kitchen table to talk Broadway and RuPaul’s Drag Race All Stars, among other things. Both women launched their careers onstage—Grande as a teen in the musical 13 and Erivo earning acclaim as Celie in the 2015 revival of The Color Purple—showing off multi-octave vocal ranges that they’ve worked hard not to squander. Protecting the ability to option up to a mix-belted high G in “I’m Here” (Erivo) or nail the “God Is a Woman” outro (Grande) means avoiding loud places, late nights, and related vices. “We’re the most boring people in the world,” Erivo says. “We’re not party animals.”Even when the pair showed up at the Met Gala in May, they were there to work: Grande had been secretly tapped to perform a seven-song set overseen by Baz Luhrmann, and she asked Erivo to join her for the finale. “That probably was my favorite Met Gala that I’ve been to, and I’ve been to a few,” Erivo says. “I felt really comfortable knowing that we could go and do what we’re really good at.”“It was really fun,” Grande adds. “Those types of events—they used to make me really nervous. Crippling anxiety. I used to be, like, debilitated.”Surely attending a social function and walking a red carpet is easier than performing for hundreds, if not thousands, of people?“That is not scary at all,” Grande says. “That’s so beautiful and lovely and thrilling.”Erivo agrees: “That’s like home.”<img alt="Cynthia Erivo photographed for Vanity Fair." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_1600%2Cc_limit/1124_Wicked-embed-01.jpg" srcSet="https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_120,c_limit/1124_Wicked-embed-01.jpg 120w, https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_240,c_limit/1124_Wicked-embed-01.jpg 240w, https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_320,c_limit/1124_Wicked-embed-01.jpg 320w, https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_640,c_limit/1124_Wicked-embed-01.jpg 640w, https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_960,c_limit/1124_Wicked-embed-01.jpg 960w, https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_1280,c_limit/1124_Wicked-embed-01.jpg 1280w, https://media.vanityfair.com/photos/66f2dda77254259ecee56d6d/master/w_1600,c_limit/1124_Wicked-embed-01.jpg 1600w" sizes="100vw"/>Bodysuit, earrings (pearl), and ring by Dior Haute Couture; headband by Deepa Gurnani; earrings (others and as septum ring) by Maria Tash.Photograph by Norman Jean Roy; Styled by Patti Wilson.PRIDE AND JOYErivo has 15 minutes to get from Hudson Yards to Lincoln Center. Scratch that: The applause from her headlining set at Stonewall Day 2024 goes so long that it’s actually not over until 8:16 p.m. Now she has 14 minutes to get to David Geffen Hall, where she’s performing in a concert version of Stephen Sondheim’s A Little Night Music.It’s the Friday of Pride weekend in New York City, about two weeks after our afternoon in Grande’s tree house. Since then, Erivo’s schedule has been, as she puts it, “insane.” She recently handed out the Tony Award for best musical alongside the original Elphie herself, Menzel, who told Erivo onstage how excited she was to see the movie. “I didn’t know that she was going to say what she said until she said it,” Erivo says. “It meant a lot to me. It was like the Queen Mother knighting you.” Later Angelina Jolie fangirled over her too—“she was so effusive and lovely”—and Erivo surprised herself by letting her proverbial hair down. “Usually I run off and go home. I don’t really get to enjoy the night that much,” she says. “But I stayed out and just had a really good time.”Then it was back to work. Erivo flew to Los Angeles for a show at the Hollywood Bowl, then returned to New York for a single A Little Night Music rehearsal. Just typing it out gives me jet lag.Even when she’s stretched thin, Erivo knows how to treat herself. “She flies so much, but she makes sure that she has the comforts of home,” says her longtime friend Colman Domingo, who’s flown with her. “She pulled out two blankets. She pulled out a humidifier. She pulled out her own kettle for her piping hot water. I was like, What? Apparently I haven’t been traveling well.” Erivo doesn’t drink alcohol. She loves a good cold plunge, has a wellness room in her LA home, and carries a ziplock bag of gummy vitamins everywhere, though after an abnormal blood test, she learned that you can, in fact, take too much vitamin D.Erivo’s also an avid runner who once completed a half-marathon before performing a two-show day on Broadway in The Color Purple. “I run every morning,” she says. “I find that the b'
