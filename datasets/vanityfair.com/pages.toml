title = "Where to Watch 2025’s Oscar-Nominated Movies | Vanity Fair"
description = "Here’s your guide to catching up with 'Anora,' 'Wicked,' and more before the Oscars air on March 2."
full_description = "Awards Insider!Where to Watch 2025’s Oscar-Nominated MoviesHere’s your guide to catching up with Anora, Wicked, and more before the Oscars air on March 2.By Chris Murphy and Savannah WalshJanuary 23, 2025Courtesy of Universal PicturesSave this storySaveSave this storySaveWith nominations for the 2025 Oscars unveiled, awards show devotees now know every title they need to see before the ceremony airs on March 2. Emilia Pérez leads the nominations with 13 total, followed closely by The Brutalist and Wicked, which have 10 nods apiece. Lesser-known titles like I’m Still Here and September 5 also made the cut, alongside some other snubs and surprises for the 97th Academy Awards.Below, an alphabetical cheat sheet for how to catch all of this year’s nominees, including where to stream the Oscar-nominated movies and which titles you can still see in a real-life movie theater.A Complete UnknownAn Oscar-nominated Timothée Chalamet leads this Bob Dylan biopic from Oscar nominee James Mangold, who previously helmed the Academy Award–winning Walk the Line, a 2005 biopic of country superstar Johnny Cash. That crooner also factors into A Complete Unknown, which details Dylan’s origin story as he moves to New York to pursue music in the early 1960s. During his transition from folk to rock music, Chalamet’s Dylan crosses the paths of other lauded musicians including Joan Baez (Oscar nominee Monica Barbaro), Pete Seeger (Oscar nominee Edward Norton), and Woody Guthrie (Scoot McNairy). —Savannah WalshPowered byJustWatchA Different ManWriter-director Aaron Schimberg’s nominated drama was one of two Sebastian Stan films in the Oscars conversation. In this A24 movie, nominated for achievement in hair and makeup, Stan plays Edward, an aspiring actor living with neurofibromatosis who undergoes an experimental procedure in order to reverse his genetic condition. But it’s a chance meeting with Oswald (Adam Pearson, an actor living with neurofibromatosis in real life) that truly upends Edward’s life. —SWPowered byJustWatchA Real PainKieran Culkin seemingly can’t be stopped this awards season. The Succession Emmy winner has picked up a slew of statues for playing Benji, an emotional and irreverent cousin of Jesse Eisenberg’s neurotic David in Eisenberg’s feature film A Real Pain. The film, which follows the once inseparable cousins as they reconnect while on a Holocaust tour through Poland, has earned an Oscar nomination for Culkin in best supporting actor, and scored Eisenberg a nod for best original screenplay as well. If you believe Oscar prognosticators, it’s Culkin’s trophy to lose. —Chris MurphyPowered byJustWatchAlien: RomulusThe ninth movie in Ridley Scott’s franchise, which kicked off with the 1979 original, is directed by Fede Álvarez and stars Priscilla’s Cailee Spaeny alongside Industry’s David Jonsson. But it was the sequel’s visual effects that got recognized by the Academy on nominations morning. —SWPowered byJustWatchAnoraMikey Madison scored her first Oscar nomination for playing Ani (full name: Anora), a sex worker from Brooklyn who falls head over heels for the goofy son of a Russian oligarch (Mark Eydelshteyn). Their whirlwind romance turns from sweet to sour in fellow Oscar nominee Sean Baker’s Palme d’Or–winning dark comedy, starring Madison, Eydelshteyn, and best-supporting-actor-Oscar nominee Yura Borisov. —CMPowered byJustWatchBetter ManBritish singer Robbie Williams goes bananas in this musical biopic about his life, where he’s portrayed as an anthropomorphic chimpanzee. Better Man includes Williams’s biggest hits like “She’s the One” and “Angels,” and also contains a new track, “Forbidden Road,” that the Academy included on its short list for its best-original-song category—but proceeded to disqualify from Oscar consideration after deeming that it “incorporates material from an existing song” not written for the film. Nevertheless, Better Man was able to score an Oscar nod for best visual effects. —CMPowered byJustWatchBlack Box DiariesJapanese journalist and filmmaker Shiori Itō turned the lens back on herself for this Oscar-nominated documentary feature, delving into a decade of footage in pursuit of justice over her own sexual assault case. “I’m happy with what we achieved with this film and it’s what I had to do personally to overcome what happened to me,” Itō told Vanity Fair’s David Canfield back in October. “I’m telling everyone: If you have a trauma, make a film—because it really helps.” —SWPowered byJustWatchThe BrutalistOne of the year’s most nominated films is Brady Corbet’s three-and-a-half-hour epic starring Adrien Brody as László Tóth, a Hungarian architect who comes to America for the biggest job of his career after surviving the Holocaust. This marks Brody’s second Oscar nomination, the first recognition from the Academy since his 2003 win for another Holocaust drama, The Pianist. Brody stars alongside his also nominated costars Felicity Jones as László’s wife Erzsébet, who, after facing her own atrocities during World War II, pushes her husband’s creative aptitude, and Guy Pearce, as charismatic industrialist Harrison Lee Van Buren, who forges a singular bond with László during his employ in the US. —SWPowered byJustWatchConclaveThe buzzy papal succession drama starring Ralph Fiennes, Stanley Tucci, and Isabella Rossellini clearly has God on its side. Conclave has been quietly gaining steam this awards season, taking home the best-screenplay trophy at the Golden Globes and earning the tentpole position of most nominated film at the BAFTAs in the lead-up to Oscar nominations. With eight Oscar nominations under its belt, including nods for Fiennes and Rossellini, many believe that Edward Berger’s meditation on Catholicism and power is a serious threat to win best picture. —CMPowered byJustWatchDune: Part TwoIn addition to a best-picture nod, Denis Villeneuve’s epic sci-fi sequel earned multiple nominations in the craft categories—many of which the first Dune won back in 2021, including best cinematography, sound, visual effects, and production design. —SWPowered byJustWatchElton John: Never Too LateElton John may have said goodbye to touring, but he’s saying hello to his fifth career Oscar nomination and first nomination since 2020 for best original song. John scored a nomination for penning “Never Too Late,” a song featured in the eponymous musical documentary about his life and his 50-year career as he prepared for his final concert in North America at Dodger Stadium. —CMPowered byJustWatchEmilia PérezJacques Audiard’s audacious musical has swept several key Oscar categories after its dominance at the Golden Globes. Actors Karla Sofía Gascón and Zoe Saldaña were recognized for their performances in the operatic Netflix drama about a power-hungry cartel boss (Gascón), who enlists a renowned defense attorney (Saldaña) to help her achieve her desired gender transition. As Emilia transitions, she flees from her former life, with a wife (Selena Gomez) and family left to pick up the pieces. Years later, the consequences of such a deal become evident, illustrated through one surreal musical number after another. —SWPowered byJustWatchFlowFlow, the dialogue-free animated film from Latvian director Gints Zilbalodis, continues to defy the odds. After beating out heavy hitters like Inside Out 2 and The Wild Robot to win best animated film at the Globes, Flow is now nominated at the Oscars for best animated feature. The film, which follows a black cat seeking refuge after its home is devastated by a great flood, has the chance to make history as the first Latvian film to win an Oscar. —CMPowered byJustWatchGladiator IIAlthough its predecessor won five Oscars, including best picture in 2001, Ridley Scott’s hotly anticipated follow-up starring Paul Mescal and Denzel Washington nabbed only a lone nod for achievement in costume design by Janty Yates. —SWPowered byJustWatchI’m Still HereThis biopic from filmmaker Walter Salles, nominated for best picture, international film, and in the lead-actress category, got a needed boost of awards adrenaline with leading lady Fernanda Torres’s Golden Globes win over the likes of Nicole Kidman and Angelina Jolie. Torres became the first Brazilian actress in 25 years to be nominated at the Globes; the last one was her mother and I’m Still Here costar Fernanda Montenegro. Said Torres during her acceptance speech, “This is proof that art can endure through life even in difficult moments.” —SWPowered byJustWatchInside Out 2In Inside Out 2, the follow-up to 2015’s Oscar-winning Inside Out, a teenage Riley is introduced to a whole host of new emotions, like anxiety, envy, embarrassment, and ennui. The animated film, led by Amy Poehler’s Joy, made a killing at the box office, grossing over $1.6 billion worldwide and earning the distinction of highest-grossing animated film of all time. It’s up for best animated feature. —CMPowered byJustWatchKingdom of the Planet of the ApesThe fourth film in the modern Planet of the Apes series, which rebooted with 2011’s Rise of the Planet of the Apes, earned an Oscar nod for best visual effects—as did every film in the franchise since its shrewd reimagining. —SWPowered byJustWatchMariaThe third and final film in director Pablo Larraín’s 20th-century-women trilogy, following Jackie and Spencer, Maria stars Oscar winner Angelina Jolie as famed opera singer Maria Callas in the twilight of her life. While Jolie was once considered competitive in the lead-actress race, she ultimately did not receive a nomination. But Maria wasn’t completely shut out by the Academy—it scored a well-deserved nomination for best cinematography. —CMPowered byJustWatchMemoir of a SnailDirected by Academy Award winner Adam Elliot, Memoir of a Snail is a stop-motion animated film loosely based on Elliot’s childhood in Australia. The film, whose voice actors include Australian actors Sarah Snook, Kodi Smit-McPhee, and Jacki Weaver, premiered at the Annecy International Animation Film Festival, where it took home top honors. —CMPowered byJustWatchNickel BoysA daring and unconventional adaptation of Colson Whitehead’s Pulitzer Prize–winning novel, Nickel Boys uses first-person point of view to viscerally engage its viewers as they step into the shoes of Elwood and Turner—two Black boys sent to Nickel Academy, a Florida reformatory school, in the 1960s. Director RaMell Ross’s singular cinematic vision has earned him a slew of awards, including the Gotham Award for best director and a spot on Vanity Fair’s list of the best performances of 2024. While Ross didn’t crack the best-director top five, his film was recognized by the Academy, earning nominations for adapted screenplay and best picture. —CMPowered byJustWatchNo Other LandHailed as one of the best films of the year by Vanity Fair’s chief critic Richard Lawson, this best-documentary nominee chronicles life on the West Bank, largely before the tragic events of October 7 in the ongoing conflict between Israel and Palestine. The doc is directed by a Palestinian-Israeli collective of four directors—Basel Adra, Yuval Abraham, as well as filmmakers Rachel Szor and Hamdan Ballal. Despite its critical acclaim, it has yet to secure a US distributor. —SWPowered byJustWatchNosferatuThis horror show from Robert Eggers, a remake of the 1922 classic based on Bram Stoker’s Dracula, stars Willem Dafoe, Lily-Rose Depp, Nicholas Hoult, and Bill Skarsgård as the eponymous bloodsucker. The film earned four Oscar nominations in below-the-line categories, including best cinematography, costume design, production design, and achievement in hair and makeup. —SWPowered byJustWatchPorcelain WarA documentary following Russia’s occupation of Ukraine and the ensuing conflict, Porcelain War takes a look at Ukrainian artist-soldiers on and off the battlefield. Directed by Brendan Bellomo and Slava Leontyev, Porcelain War won Sundance’s Grand Jury prize in 2024 and was nominated at both the Directors Guild Awards and the Producers Guild Awards before landing an Oscar nod for best documentary feature. —CMPowered byJustWatchSeptember 5Tim Fehlbaum’s historical drama, which fictionalizes the hostage crisis at the 1972 Munich Olympics as largely told through the ABC Sports newsmen broadcasting the events, scored a nomination for best original screenplay from Fehlbaum, Moritz Binder, and Alex David. German star Leonie Benesch, a translator for the news crew, told VF of the film earlier this year: “Before this, I was a 24-hour news junkie, I could just sit and watch it all. Going inside the sausage factory and seeing how it’s made has altered the way I consume media. It made me question my own personal consumption of particularly violent news. I realized how desensitized I had become.” —SWPowered byJustWatchSing SingA stirring film about the prison industrial system, Sing Sing stars best-actor Oscar nominee Colman Domingo as John “Divine G” Whitfield, a man incarcerated at Sing Sing for a crime he did not commit who is heavily involved in the prison’s Rehabilitation Through the Arts program. Domingo acts opposite a host of formerly incarcerated prisoners, including Clarence Maclin, who missed out on an Oscar nomination for best supporting actor for his work in the film, partly inspired by his own experience incarcerated at Sing Sing. Maclin was, however, included as a nominee in the best-adapted-screenplay category. —CMPowered byJustWatchSoundtrack to a Coup d’EtatOne of the year’s best-documentary-feature nominees hails from Belgian filmmaker Johan Grimonprez, whose honored work investigates the 1961 assassination of Congolese revolutionary Patrice Lumumba. —SWPowered byJustWatchSugarcaneExecutive produced by Lily Gladstone, Sugarcane dives headfirst into the investigation into the abuse and missing children in Canada’s First Nations community after more than 200 unmarked graves were found at the Kamloops Indian Residential School—a segregated boarding school for First Nations youth run by the Catholic Church in Canada. Ahead of the Oscars, directors Emily Kassie and Julian Brave NoiseCat received Sundance’s directing award in 2024, and their film won best documentary from the National Board of Review. —CMPowered byJustWatchThe ApprenticeHas any film ever been so simultaneously relevant and reviled at the time of its Oscar recognition? Despite all reasonable odds, given its difficult road to theatrical distribution ahead of the 2024 presidential election, Briarcliff’s The Apprentice, directed by Ali Abbasi and written by Vanity Fair special correspondent Gabriel Sherman, earned two Academy Award nominations. Sebastian Stan is a first-time nominee for his performance as a young Donald Trump, whose rise in the New York real estate sector can be traced to his mentorship under one Roy Cohn (played by an also nominated Jeremy Strong). In the days before his Golden Globe win for best actor in A Different Man, Stan told Vanity Fair of perceived fatigue around The A"
