description = "Suzy Exposito is an award-winning entertainment journalist raised in Florida and now based in Los Angeles. She currently works as an editor and contributor at the LA Times, and was previously the founding Latin music editor for Rolling Stone. In 2020 she became the first Latina to write a cover story for the legendary rock magazine, which was a groundbreaking profile of the Puerto Rican star Bad Bunny. She later served as an executive consultant on the 2023 Netflix series Neon, a comedy detailing the ins and outs of Miami’s music industry. She was most recently featured in the 2024 Max documentary LOUDER: The Soundtrack of Change, which was produced by Selena Gomez and Stacey Abrams. You can read her writing in Vogue, ELLE, and Nylon."
