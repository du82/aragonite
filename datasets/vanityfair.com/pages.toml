full_description = '''BusinessPoliticsTechnology<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_120,c_limit/mark-zuckerberg-ith.jpg 120w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_240,c_limit/mark-zuckerberg-ith.jpg 240w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_320,c_limit/mark-zuckerberg-ith.jpg 320w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_640,c_limit/mark-zuckerberg-ith.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_120,c_limit/mark-zuckerberg-ith.jpg 120w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_240,c_limit/mark-zuckerberg-ith.jpg 240w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_320,c_limit/mark-zuckerberg-ith.jpg 320w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_640,c_limit/mark-zuckerberg-ith.jpg 640w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_960,c_limit/mark-zuckerberg-ith.jpg 960w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_1280,c_limit/mark-zuckerberg-ith.jpg 1280w, https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_1600,c_limit/mark-zuckerberg-ith.jpg 1600w" sizes="100vw"/><img alt="Zuck Around and Find Out: Mark Zuckerberg and Meta’s MAGA-Masculinity Crisis" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67b5ff0e33bef19270a66295/4:3/w_1600%2Cc_limit/mark-zuckerberg-ith.jpg"/>Inside the HiveZuck Around and Find Out: Mark Zuckerberg and Meta’s MAGA-Masculinity CrisisVanity Fair editors trace the Meta founder’s transformation from a nerdy, hoodie-wearing whiz kid into a GOP power player, and divine whether the newly bro-ey billionaire will be able to swim with the sharks of Trump 2.0.By Jon SkolnikFebruary 19, 2025<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_120,c_limit/VF0225_Scott_Minerd_lede.jpg 120w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_240,c_limit/VF0225_Scott_Minerd_lede.jpg 240w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_320,c_limit/VF0225_Scott_Minerd_lede.jpg 320w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_640,c_limit/VF0225_Scott_Minerd_lede.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_120,c_limit/VF0225_Scott_Minerd_lede.jpg 120w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_240,c_limit/VF0225_Scott_Minerd_lede.jpg 240w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_320,c_limit/VF0225_Scott_Minerd_lede.jpg 320w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_640,c_limit/VF0225_Scott_Minerd_lede.jpg 640w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_960,c_limit/VF0225_Scott_Minerd_lede.jpg 960w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_1280,c_limit/VF0225_Scott_Minerd_lede.jpg 1280w, https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_1600,c_limit/VF0225_Scott_Minerd_lede.jpg 1600w" sizes="25vw"/><img alt="Inside the Fight Over Guggenheim Partners CIO Scott Minerd’s $400 Million Estate" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67912f17e760d06d2534bbc0/1:1/w_1600%2Cc_limit/VF0225_Scott_Minerd_lede.jpg"/>From the MagazineInside the Fight Over Guggenheim Partners CIO Scott Minerd’s $400 Million EstateA brawny bodybuilder with a generous side: The late investor was an atypical Wall Street sage. But at Guggenheim, he oversaw billions for the firm and made millions for himself. His sudden death shocked even those closest to him and spurred infighting over his will.By Dirk Smillie<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_120,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 120w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_240,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 240w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_320,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 320w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_640,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_120,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 120w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_240,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 240w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_320,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 320w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_640,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 640w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_960,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 960w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_1280,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 1280w, https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_1600,c_limit/Jim-VandeHei-and-Mike-Allen.jpg 1600w" sizes="25vw"/><img alt="“We’re Not Hyperventilating”: Behind Axios’s Clinical Approach to Covering Donald Trump’s Second Term" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/6786a48d1bd55a905704ba41/1:1/w_1600%2Cc_limit/Jim-VandeHei-and-Mike-Allen.jpg"/>Media“We’re Not Hyperventilating”: Behind Axios’s Clinical Approach to Covering Donald Trump’s Second TermVanity Fair caught up with cofounders Jim VandeHei and Mike Allen about the state of political media, including a postelection newsroom talent churn, and why “this might be the most electric moment in the history of Washington.”By Natalie Korach<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_120,c_limit/vf124-brady.jpg 120w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_240,c_limit/vf124-brady.jpg 240w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_320,c_limit/vf124-brady.jpg 320w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_640,c_limit/vf124-brady.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_120,c_limit/vf124-brady.jpg 120w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_240,c_limit/vf124-brady.jpg 240w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_320,c_limit/vf124-brady.jpg 320w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_640,c_limit/vf124-brady.jpg 640w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_960,c_limit/vf124-brady.jpg 960w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_1280,c_limit/vf124-brady.jpg 1280w, https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_1600,c_limit/vf124-brady.jpg 1600w" sizes="25vw"/><img alt="Tom Brady’s TV Chops Will Be Put to the Super Bowl Test" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/677da7f993c37c01efd198ca/1:1/w_1600%2Cc_limit/vf124-brady.jpg"/>SportsTom Brady’s TV Chops Will Be Put to the Super Bowl TestAmid persistent speculation about his future, the legendary QB is back as a broadcaster for the playoffs and will cover the big game next month. Despite any prior missteps in the booth, Richard Deitsch says that “what NFL fans will remember will be his call on that Sunday in New Orleans.”By Tom Kludt <source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/676ed24b1