title = "The Hottest Ticket in Town: 31 Years of Vanity Fair’s Oscar Party | Vanity Fair"
description = "Madonna and Mick. Leo and Kate. Matt and Ben. Beyoncé and Jay-Z. Take a trip down memory lane with legends past and present to see how the party got started, took off, and quickly became the toughest door on Hollywood’s biggest night."
full_description = 'Awards SeasonThe Hottest Ticket in Town: 31 Years of Vanity Fair’s Oscar PartyTake a trip down memory lane with legends past and present—movie stars, musicians, fashion icons, athletes, politicians, royalty, and titans of industry alike—to see how VF’s annual Oscar-night bash got started, took off, and quickly became the toughest door on Hollywood’s biggest night.By Chiara Marinai and Britt Hennemuth February 26, 2025Save this storySaveSave this storySaveAt the storied Vanity Fair Oscar Party, as Frank DiGiacomo noted in 2013, “there is no VIP section.” That’s probably what has made the event so alluring, so enviable, and so utterly unbelievable for the past three decades and counting: It’s a single room filled with some of the world’s most notable people, a common denominator for the least common congregation there is.Cast your vote with VF’s Oscar ballotArrowEvery year, the event is attended by starstruck first-time winners, stadium-filling rock stars, models from far-flung locations like Nigeria or Puerto Rico, Hollywood dynasties, European princesses, Super Bowl ring holders, and Olympic medalists. It’s the only place on earth you can find Joni Mitchell having a reflective tête-à-tête with Sarah Paulson, John McEnroe photobombing Snap CEO Evan Spiegel, and a victorious Will Smith rapping along to “Gettin’ Jiggy Wit It” on the dance floor just hours after slapping Chris Rock. The biggest names from every industry you can imagine, mixing under the same roof—for one night only.Before the striped carpet is rolled out for the iconic fête, VF invites you to relive the excitement with these photographs from Vanity Fair Oscar parties past—including outtakes from our photo booth, the Mark Seliger portrait studio, and other intimate glimpses at both Oscar winners and the company they keep.<img alt="Image may contain Ellen Barkin Human Person Clothing Suit Coat Overcoat Apparel Tuxedo and Sharon Stone" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_1600%2Cc_limit/oscar-party-history-94-01.png" srcSet="https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_120,c_limit/oscar-party-history-94-01.png 120w, https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_240,c_limit/oscar-party-history-94-01.png 240w, https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_320,c_limit/oscar-party-history-94-01.png 320w, https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_640,c_limit/oscar-party-history-94-01.png 640w, https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_960,c_limit/oscar-party-history-94-01.png 960w, https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_1280,c_limit/oscar-party-history-94-01.png 1280w, https://media.vanityfair.com/photos/5c68b818ad094f210172f3bb/master/w_1600,c_limit/oscar-party-history-94-01.png 1600w" sizes="100vw"/>Leonardo DiCaprio, Sharon Stone, and Ellen Barkin at Steve Tisch and Vanity Fair’s Oscar-night party at Mortons in 1994. By Dafydd Jones.The ’90sIn 1993, power literary-and-talent agent Irving “Swifty” Lazar—known for holding an exclusive yearly Oscar-viewing dinner and after-party—died at the age of 86. Lazar’s annual soiree had been a staple of Old Hollywood, drawing in society figures and working actors since 1964. So Graydon Carter and producer Steve Tisch decided to step into the ring, cohosting the first VF Oscar Party together in 1994. The event was relatively modest that year, and began with an 100-person dinner held at Mortons steak house on Melrose (the lot now occupied by Cecconi’s) that featured Lee Radziwill, Nancy Reagan, Oliver Stone, Gore Vidal, Gene Hackman, Donald Sutherland, Barry Diller, and Diane von Furstenberg among its seated guests. A hundred more famous figures arrived after the Oscars ceremony, including Robert De Niro, Prince, Anthony Hopkins, Tom Cruise, Nicole Kidman, Liam Neeson, and Natasha Richardson. As the decade continued, the event grew—in 1999, an architect even had to temporarily expand Mortons in order to fit the overflow—and cemented itself as the premiere destination for actors to let loose on Oscar night.<img alt="Image may contain Human Person Anna Nicole Smith Prince Courtney Love and Jane McDonald" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_1600%2Cc_limit/a-oscar-party-history-94-02a.png" srcSet="https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_120,c_limit/a-oscar-party-history-94-02a.png 120w, https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_240,c_limit/a-oscar-party-history-94-02a.png 240w, https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_320,c_limit/a-oscar-party-history-94-02a.png 320w, https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_640,c_limit/a-oscar-party-history-94-02a.png 640w, https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_960,c_limit/a-oscar-party-history-94-02a.png 960w, https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_1280,c_limit/a-oscar-party-history-94-02a.png 1280w, https://media.vanityfair.com/photos/5c68c802ad094f210172f3c1/master/w_1600,c_limit/a-oscar-party-history-94-02a.png 1600w" sizes="100vw"/>Prince entering the party in ’94, lollipop in hand; Courtney Love and Amanda de Cadenet in ’95; and Anna Nicole Smith entering the party in ’94. Top left, by ® Eric Charbonneau/BEImages/Shutterstock; Right and bottom, by Dafydd Jones.<img alt="Image may contain Human Person Clothing Apparel Evening Dress Fashion Gown Robe Collage Advertisement and Poster" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_1600%2Cc_limit/a-oscar-party-history-94-02b.png" srcSet="https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_120,c_limit/a-oscar-party-history-94-02b.png 120w, https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_240,c_limit/a-oscar-party-history-94-02b.png 240w, https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_320,c_limit/a-oscar-party-history-94-02b.png 320w, https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_640,c_limit/a-oscar-party-history-94-02b.png 640w, https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_960,c_limit/a-oscar-party-history-94-02b.png 960w, https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_1280,c_limit/a-oscar-party-history-94-02b.png 1280w, https://media.vanityfair.com/photos/5c68c803ad094f210172f3c3/master/w_1600,c_limit/a-oscar-party-history-94-02b.png 1600w" sizes="100vw"/>Traci Lords and Elisabeth Shue in ’96; Salma Hayek entering the party ’97; Goldie Hawn and Steve Martin share a laugh inside Mortons in ’96. Top, by Dafydd Jones; bottom left, by Joyce Silverstein/REX/Shutterstock, by Alan Berliner/Bei/REX/Shutterstock.<img alt="This image may contain Lauren Holly Human Person Clothing Suit Coat Overcoat Apparel Crowd Tie and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_1600%2Cc_limit/oscar-party-history-94-03.png" srcSet="https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_120,c_limit/oscar-party-history-94-03.png 120w, https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_240,c_limit/oscar-party-history-94-03.png 240w, https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_320,c_limit/oscar-party-history-94-03.png 320w, https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_640,c_limit/oscar-party-history-94-03.png 640w, https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_960,c_limit/oscar-party-history-94-03.png 960w, https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_1280,c_limit/oscar-party-history-94-03.png 1280w, https://media.vanityfair.com/photos/5c68b819fe95f7266c66cb98/master/w_1600,c_limit/oscar-party-history-94-03.png 1600w" sizes="100vw"/>Tom Cruise greeting Cuba Gooding Jr. at the party in 1997. By Dafydd Jones.<img alt="This image may contain Human Person Angela Bassett Clothing Apparel Collage Advertisement Poster Suit and Coat" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_1600%2Cc_limit/a-oscar-party-history-94-04a.png" srcSet="https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_120,c_limit/a-oscar-party-history-94-04a.png 120w, https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_240,c_limit/a-oscar-party-history-94-04a.png 240w, https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_320,c_limit/a-oscar-party-history-94-04a.png 320w, https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_640,c_limit/a-oscar-party-history-94-04a.png 640w, https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_960,c_limit/a-oscar-party-history-94-04a.png 960w, https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_1280,c_limit/a-oscar-party-history-94-04a.png 1280w, https://media.vanityfair.com/photos/5c68c8047859b70720fbc9a7/master/w_1600,c_limit/a-oscar-party-history-94-04a.png 1600w" sizes="100vw"/>Steve Tisch with Elizabeth Hurley and Hugh Grant in 1995; Angela Bassett in ’94; Rosie O’Donnell and Emma Thompson in ’95; and George Clooney in ’94. ® Eric Charbonneau/BEImages (Clooney); ® Berliner Studio/BEImages/Shutterstock (all others).<img alt="Image may contain Human Person Clothing Apparel Advertisement Collage Poster Coat Suit Overcoat and Tie" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_1600%2Cc_limit/b-oscar-party-history-94-04b.png" srcSet="https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_120,c_limit/b-oscar-party-history-94-04b.png 120w, https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_240,c_limit/b-oscar-party-history-94-04b.png 240w, https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_320,c_limit/b-oscar-party-history-94-04b.png 320w, https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_640,c_limit/b-oscar-party-history-94-04b.png 640w, https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_960,c_limit/b-oscar-party-history-94-04b.png 960w, https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_1280,c_limit/b-oscar-party-history-94-04b.png 1280w, https://media.vanityfair.com/photos/5c68ca9c005f7f310e15961a/master/w_1600,c_limit/b-oscar-party-history-94-04b.png 1600w" sizes="100vw"/>Mel Gibson and a bagpiper in ’96 with his two Oscar wins for best picture and best director for Braveheart; a detail of a hedge outside the event; Robert De Niro chatting with Kirk Douglas in ’94; Jodie Foster in 1995. By Dafydd Jones (De Niro and Douglas), By Alan Berliner/Rex/Shuttertsock (all others).<img alt="Image may contain Mick Jagger Coat Suit Clothing Overcoat Apparel Human Person Tuxedo Collage and Advertisement" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_1600%2Cc_limit/a-oscar-party-history-94-05a.png" srcSet="https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_120,c_limit/a-oscar-party-history-94-05a.png 120w, https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_240,c_limit/a-oscar-party-history-94-05a.png 240w, https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_320,c_limit/a-oscar-party-history-94-05a.png 320w, https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_640,c_limit/a-oscar-party-history-94-05a.png 640w, https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_960,c_limit/a-oscar-party-history-94-05a.png 960w, https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_1280,c_limit/a-oscar-party-history-94-05a.png 1280w, https://media.vanityfair.com/photos/5c68c804ad094f210172f3c5/master/w_1600,c_limit/a-oscar-party-history-94-05a.png 1600w" sizes="100vw"/>Mick Jagger, Madonna, and Tony Curtis during the dinner in ’97; Kelly Lynch, John Travolta, and Kelly Preston say hello in ’96. Both by Dafydd Jones.<img alt="Image may contain Darlene Vogel Clothing Apparel Suit Overcoat Coat Human Person Tuxedo Tie and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_1600%2Cc_limit/oscar-party-history-94-05b.png" srcSet="https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_120,c_limit/oscar-party-history-94-05b.png 120w, https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_240,c_limit/oscar-party-history-94-05b.png 240w, https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_320,c_limit/oscar-party-history-94-05b.png 320w, https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_640,c_limit/oscar-party-history-94-05b.png 640w, https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_960,c_limit/oscar-party-history-94-05b.png 960w, https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_1280,c_limit/oscar-party-history-94-05b.png 1280w, https://media.vanityfair.com/photos/5c68b81c3fc1123162a5c918/master/w_1600,c_limit/oscar-party-history-94-05b.png 1600w" sizes="100vw"/>Nicolas Cage with Patricia Arquette at the party—and showing off his Oscar—in 1996. By Dafydd Jones.<img alt="Image may contain Human Person Fashion Coat Clothing Overcoat Apparel Suit Premiere Tom Cruise and Eveni