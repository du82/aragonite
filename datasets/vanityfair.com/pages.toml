["https://vanityfair.com/news/story/inside-the-fbis-lab-leak-investigation"]
title = "Exclusive: Inside the FBI’s Lab Leak Investigation | Vanity Fair"
description = "As bird flu spreads, and Team Trump begins dismantling America’s public health apparatus, a former FBI scientist and investigator speaks out about the evidence that led the bureau to suspect that COVID-19 was sparked by an incident at the Wuhan Institute of Virology."
full_description = 'COVID ORIGINSExclusive: Inside the FBI’s Lab Leak InvestigationAs bird flu spreads, and Team Trump begins dismantling America’s public health apparatus, a former FBI scientist and investigator speaks out about the evidence that led the bureau to suspect that COVID-19 was sparked by an incident at the Wuhan Institute of Virology.By Katherine EbanFebruary 27, 2025FacebookXEmailSave Storyby Chesnot/Getty Images.Save this storySaveSave this storySaveIn the five years since the COVID-19 pandemic erupted in Wuhan, China, a bitter international debate has raged among scientists, politicians, and journalists over the virus’s origin and who is to blame for the more than 7 million deaths it’s caused worldwide.It’s a debate in which legitimate scientific arguments vie for attention with partisan attacks and wild conspiracy theories. But so far, there is no smoking-gun evidence to definitively resolve whether COVID-19 spilled over naturally from animals at a market in Wuhan or whether it resulted from a laboratory accident in the city, where one of the world’s foremost coronavirus research facilities had amassed a vast repository of virus samples.A key part of the puzzle has to do with the conflicting assessments made by US intelligence agencies. The FBI’s “moderate confidence” assessment that a lab origin is more likely is especially notable. The bureau, which built a deep bench of scientific expertise when it led the investigation into the post-9/11 anthrax attacks, reached its conclusion in mid-2021, with the strongest confidence of any intelligence agency, and has not wavered since. But the reason for its assessment has remained unknown.Now, the lead scientist for the bureau’s investigation is speaking out. Microbiologist Jason Bannan served as the senior scientist of the FBI’s forensic response section within the laboratory division for 11 years. He retired in 2022, and he spoke to VF in his capacity as a concerned citizen, not as a representative of the bureau. A portion of the FBI’s analysis is based on classified materials, but over numerous months he shared exclusively with Vanity Fair some of the open-source information that played a strong role in the bureau’s assessment. In December, he was featured in a Wall Street Journal article that enumerated deep divisions within the intelligence community but did not delve into the reasons for the bureau’s assessment.Vanity Fair can now report that FBI scientists closely scrutinized the research activities of a group of graduate students and researchers who worked under Shi Zhengli, the lead coronavirus scientist at the Wuhan Institute of Virology (WIV). For at least three years prior to the pandemic, those scientists performed risky research on a group of viruses that included one of the closest known relatives to SARS-CoV-2, which causes COVID-19. The FBI found that Shi’s researchers, in their publications, were not candid about the inventory of viruses in their possession and the true breadth of their work, which was conducted in labs with a low biosafety level. The intelligence community also determined that, in the autumn of 2019, three of Shi’s researchers fell ill with COVID-like symptoms.WIV scientists, Bannan says, had “thousands of samples in their lab” that they’d collected from bats in Yunnan Province in southern China. The WIV had been researching them “for years,” he says. Among them were viruses closely related to SARS-CoV-2. Intelligence agencies still don’t have a complete picture of which virus samples were housed at the WIV. But the scientists’ “lack of candor” about their inventory, as well as their years of work manipulating coronaviruses to determine the changes necessary to infect humans, added to the circumstantial evidence indicating that the outbreak might have started among the WIV’s researchers. Shi Zhengli and a WIV administrator did not respond to requests for comment.The FBI declined to answer specific questions from Vanity Fair, but said in a statement, “The FBI has long assessed that the origin of the COVID pandemic was likely a laboratory incident in Wuhan. Led by the FBI’s Weapons of Mass Destruction Directorate, work began in early 2020 when FBI experts in such fields as virology, immunology, microbiology, biochemistry, and forensics began examining this issue. FBI agents and analysts studied intelligence and conducted over 200 interviews of more than 80 people since the beginning of the pandemic.”A moderate-confidence assessment does not equal certainty. Nor does it mean that the FBI is correct. Typically, it means that an intelligence agency has information that is “plausible,” with sources that are “proving to be high quality,” but it may need more sources to reach a high-confidence assessment, says Shawn Turner, former public affairs director for the Office of the Director of National Intelligence under President Obama.“We were not asked to prove anything,” says Bannan. “We were asked to make an assessment,” which involves the weighing of evidence. Though he considers a natural origin possible, he says, “To me, there is enough scientific evidence to say it is likely this was a lab incident.”Bannan, a registered Democrat, has a PhD in microbiology, and spent almost 20 years as an FBI scientist. In 2009, he was among the recipients of the FBI Director’s Award for outstanding scientific advancement for his work on the anthrax investigation. He says he decided to come forward for several reasons. One was to counter what he described as inaccurate claims espoused by some proponents of the natural-origin theory, their discrediting of government scientists, and the branding of the lab hypothesis as a right-wing conspiracy theory. He also wanted to counter what he described as the bias toward a natural spillover in the government’s reviews to date, and the sidelining of scientific evidence supporting a laboratory origin.Shi Zhengli emerged as a leading coronavirus researcher in the wake of the 2002 SARS outbreak, which killed 774 people globally and sickened more than 8,000. The outbreak, which originated in Guangdong Province, prompted a surge of research into bat coronaviruses and led China to set up a comprehensive disease surveillance system amid sharp international criticism that it had failed to disclose the illness’s full spread.Shi tracked the origin of the outbreak to horseshoe bats. Her research—some of it funded by the National Institutes of Health through an American nonprofit named EcoHealth Alliance—found some bat viruses that could infect human cells through a protein called the ACE2 receptor.In March 2020, when Bannan was assigned to assist the FBI team investigating COVID-19’s origins, the group confronted an obvious question. How had a bat virus seemingly primed to infect humans arrived in Wuhan in the first place? The bats in question are not believed to be native to Wuhan, and many of the horseshoe bats that Shi studied lived roughly 1,000 miles to the southwest, in Yunnan Province.In the first SARS outbreak, a trail of infected animals that sickened the food workers who handled them pointed to a natural spillover. And in 2019, China’s disease-surveillance system successfully tracked another mysterious illness to a tick-borne virus being carried by animals in markets, including some located in Wuhan.With COVID-19, however, no infected animal has ever been identified, despite an extensive search. As Bannan puts it, “How and where the SARS-CoV-2 virus became well adapted to humans is the question that compels scientists to examine the laboratory origin.”To be sure, many scientists continue to view the lab-leak hypothesis with extreme skepticism. A natural origin is “far more likely,” says Dr. Frederic Bushman, William Maul Measey Professor in Microbiology at the University of Pennsylvania’s Perelman School of Medicine. “We’ve seen zoonotic infections naturally over and over again, and there are tons of background reasons to think of that as the default option.”The WIV team hunted far and wide for bat-coronavirus samples, but one source in particular—an abandoned mine shaft in the mountains of Mojiang County in Yunnan Province—stood out to Bannan and the FBI scientists.In 2012, six miners became gravely ill after shoveling bat guano from the floor of the mine shaft. Their symptoms included cough, fever, and labored breathing. They were treated at the First Affiliated Hospital at the Kunming Medical University in Yunnan’s capital, where a medical student chronicled details of the incident in a thesis.The pulmonologist who consulted on their case was one of China’s top SARS experts. Suspecting a viral SARS infection, Dr. Zhong Nanshan learned that the guano came from rufous horseshoe bats, the same species implicated in the 2002 SARS outbreak. Within months, three of the six miners were dead. The WIV tested their blood samples and found four of them positive for SARS antibodies, according to a separate thesis by a graduate student at China’s Center for Disease Control and Prevention.<img alt="Image may contain Shu Xiuwen Architecture Building Hospital Adult Person Clinic Appliance and Device" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_1600%2Cc_limit/vf225-covid-fbi-002.jpg" srcSet="https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_120,c_limit/vf225-covid-fbi-002.jpg 120w, https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_240,c_limit/vf225-covid-fbi-002.jpg 240w, https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_320,c_limit/vf225-covid-fbi-002.jpg 320w, https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_640,c_limit/vf225-covid-fbi-002.jpg 640w, https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_960,c_limit/vf225-covid-fbi-002.jpg 960w, https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_1280,c_limit/vf225-covid-fbi-002.jpg 1280w, https://media.vanityfair.com/photos/67c0991e1188cd934c93add0/master/w_1600,c_limit/vf225-covid-fbi-002.jpg 1600w" sizes="100vw"/>Shi Zhengli, left, inside the BSL-4 lab at the Wuhan Institute of Virology, 2017.by JOHANNES EISELE/AFP/Getty Images.The mine shaft became a hot spot for studying viral emergence, and the WIV collected numerous samples from there, including one it named Ra4991.Six years later, with SARS-CoV-2 overtaking the world and an army of scientists searching for a progenitor virus, Shi Zhengli and several colleagues published a paper noting that the WIV possessed a viral sample they had named RaTG13, which proved to be 96.2% similar to SARS-CoV-2. That meant RaTG13 was the closest known match at the time to the virus that caused COVID-19.What Shi failed to mention in her paper was that RaTG13 had been renamed. Its original name was Ra4991—the virus from the abandoned mine shaft where three miners likely contracted a fatal illness.As internet sleuths connected the dots between RaTG13 and Ra4991, Shi updated her published work, and tried to explain the omission.Shi contends that RaTG13 is too distant from SARS-CoV-2 to have served as its direct progenitor, and scientists including Bannan agree. But within the FBI, suspicion fell not just on Ra4991, but on the thousands of samples the WIV had been working with, which contained other viruses related to SARS-CoV-2. “Within weeks of China releasing the SARS-CoV-2 sequence, the WIV released RaTG13,” says Bannan. “But they had already known about that family of viruses for years.”The FBI team’s suspicions were also aroused by a paper that Shi and several coauthors published in February 2019. “Geographical Structure of Bat SARS-Related Coronaviruses,” published in the journal Infections, Genetics and Evolution, analyzed the viral strains that had likely contributed to the first SARS outbreak in 2002.More Reporting by Katherine Eban<img alt="Inside the Bungled Bird Flu Response, Where Profits Collide With Public Health" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/6712c832cf3e6c479cd38f2c/master/w_775%2Cc_limit/vf1024-eban-bird-flu-lede.jpg" srcSet="https://media.vanityfair.com/photos/6712c832cf3e6c479cd38f2c/master/w_120,c_limit/vf1024-eban-bird-flu-lede.jpg 120w, https://media.vanityfair.com/photos/6712c832cf3e6c479cd38f2c/master/w_240,c_limit/vf1024-eban-bird-flu-lede.jpg 240w, https://media.vanityfair.com/photos/6712c832cf3e6c479cd38f2c/master/w_320,c_limit/vf1024-eban-bird-flu-lede.jpg 320w, https://media.vanityfair.com/photos/6712c832cf3e6c479cd38f2c/master/w_640,c_limit/vf1024-eban-bird-flu-lede.jpg 640w" sizes="100vw"/>PUBLIC HEALTHInside the Bungled Bird Flu Response, Where Profits Collide With Public HealthBy Katherine Eban<img alt="America’s Food Safety Is Now in the Hands of Don Jr.’s Hunting Buddy" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67bbca6d1e9b65ed8aed86c4/master/w_775%2Cc_limit/vf225-trump-jr-hunting-buddy.png" srcSet="https://media.vanityfair.com/photos/67bbca6d1e9b65ed8aed86c4/master/w_120,c_limit/vf225-trump-jr-hunting-buddy.png 120w, https://media.vanityfair.com/photos/67bbca6d1e9b65ed8aed86c4/master/w_240,c_limit/vf225-trump-jr-hunting-buddy.png 240w, https://media.vanityfair.com/photos/67bbca6d1e9b65ed8aed86c4/master/w_320,c_limit/vf225-trump-jr-hunting-buddy.png 320w, https://media.vanityfair.com/photos/67bbca6d1e9b65ed8aed86c4/master/w_640,c_limit/vf225-trump-jr-hunting-buddy.png 640w" sizes="100vw"/>ONLY THE BEST PEOPLEAmerica’s Food Safety Is Now in the Hands of Don Jr.’s Hunting BuddyBy Katherine Eban<img alt="The Lab-Leak Theory: Inside the Fight to Uncover COVID-19’s Origins" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/60b8022ebe6052a955e5528c/master/w_775%2Cc_limit/VF0721_Covid_Origins_1.jpg" srcSet="https://media.vanityfair.com/photos/60b8022ebe6052a955e5528c/master/w_120,c_limit/VF0721_Covid_Origins_1.jpg 120w, https://media.vanityfair.com/photos/60b8022ebe6052a955e5528c/master/w_240,c_limit/VF0721_Covid_Origins_1.jpg 240w, https://media.vanityfair.com/photos/60b8022ebe6052a955e5528c/master/w_320,c_limit/VF0721_Covid_Origins_1.jpg 320w, https://media.vanityfair.com/photos/60b8022ebe6052a955e5528c/master/w_640,c_limit/VF0721_Covid_Origins_1.jpg 640w" sizes="100vw"/>VIRAL INFLECTIONThe Lab-Leak Theory: Inside the Fight to Uncover COVID-19’s OriginsBy Katherine EbanThe paper concluded that the virus had likely resulted from the recombination of bat coronaviruses from several southern China provinces, including Yunnan. It contained a circular diagram known as a phylogenetic tree, which charted the evolution of three groups of bat viruses that the researchers had analyzed.Among the coauthors were two scientists who had studied under Shi, Yu Ping and Ben Hu.The published study omitted a key part '
