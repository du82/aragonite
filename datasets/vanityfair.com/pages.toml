["https://vanityfair.com/news/story/donald-trumps-cabinet-is-incompetent-worse-its-at-the-whim-of-elon-musk"]
title = "Donald Trump’s Cabinet Is Incompetent. Worse, It’s at the Whim of Elon Musk | Vanity Fair"
description = "The president clearly expects his secretaries to yield to the unelected billionaire, even as they reportedly express private frustrations with his haphazard government cuts."
full_description = "PoliticsDonald Trump’s Cabinet Is Incompetent. Worse, It’s at the Whim of Elon MuskThe president clearly expects his secretaries to yield to the unelected billionaire, even as they reportedly express private frustrations with his haphazard government cuts.By Eric LutzFebruary 27, 2025Washington, DC - February 26 : Elon Musk, Department of Government Efficiency leader, speaks at the first cabinet meeting of President Donald J Trump's second term at the White House on Wednesday, Feb 26, 2025 in Washington, DC. (Photo by Jabin Botsford/The Washington Post via Getty Images)The Washington Post/Getty ImagesSave this storySaveSave this storySaveIf the first Cabinet meeting of Donald Trump’s first term was meant to affirm his own power, the first of his second term on Wednesday was to assert that of Elon Musk, the unelected tech billionaire who has spent the past month dismantling the federal government.No, Trump didn’t go around the room having his secretaries lavish praise on the so-called efficiency czar, as he had his officials do for him back in 2017. (“The greatest privilege of my life,” Mike Pence said at that June 2017 meeting, “is to serve as vice president to the president who’s keeping his word to the American people.”) But the president did make clear to his Cabinet, and to Washington more broadly, that he expected them to yield to Musk as they had to him. “Is anybody unhappy with Elon?” Trump asked his secretaries, as Musk looked on in a black MAGA hat and a tee-shirt that read: TECH SUPPORT. “If you are, we’ll throw him out of here. Is anybody unhappy?”The Cabinet clapped.“Some disagree a little bit,” Trump continued, nodding at the administration officials who instructed their workers not to respond to Musk’s email last week demanding they justify their jobs or be fired. “But I think everyone’s not only happy—they’re thrilled.”When the cameras are rolling, perhaps. But CNN reported Wednesday that some in Trump’s Cabinet have grown frustrated with Musk, particularly following his ultimatum—which caused “some annoyance” among secretaries, in the words of a White House official. The public has seemed more than merely annoyed by the tech tycoon; they’ve expressed their disapproval of his project in polls, and voiced anger over his dramatic, unilateral government cuts at the town halls of Republican lawmakers. Many of those GOP officials have dismissed the public pushback—House Speaker Mike Johnson claimed Wednesday that the angry town halls his members have faced in recent days were filled with “paid protesters”—and continued to support Musk’s power grab. But some have nursed worries, which they’ve back-channeled to the White House and vented about in a closed-door party meeting Wednesday.“It would be better to allow Cabinet secretaries to carefully review their programs and then make surgical, strategic decisions on what programs and people should be cut and then come back to Congress for approval,” Maine Senator Susan Collins, a leader in what we might call the “Concerned Caucus” within the GOP, told the Hill, calling for administration officials to use a scalpel instead of Musk’s “sledgehammer approach.”Of course, that implies Trump’s Cabinet officials are actually capable of responsible stewardship of their departments—something they plainly are not, as the surreal meeting Wednesday underscored. “It’s not unusual,” the conspiracy theorist Health and Human Services Secretary Robert F. Kennedy Jr. said in response to a question about the measles outbreak in Texas that claimed the life of a young child, downplaying the surge of cases of a disease the United States eliminated a quarter century ago. “We have measles outbreaks every year.”The recklessness and extremism is a feature—not a bug—of Trump’s official and unofficial government alike.The difference between Trump’s Cabinet officials and Musk’s DOGE team is that the former is, at least in theory, acting on authority vested in them by the Senate and accountable to the branch that confirmed them; the latter is extralegal, accountable to no one, and seemingly operating on the whims of one man, who is convinced of his own brilliance and superior judgment even as he admits he “accidentally canceled, very briefly” an Ebola prevention initiative as part of his decimation of USAID.“I think we all want Ebola prevention, so we restored Ebola prevention immediately,” Musk told the Cabinet Wednesday, “and there was no interruption”—something officials at the hollowed-out agency have said is not true. “There have been no efforts to ‘turn on’ anything in prevention,” Nidhi Bouri, who served as a top USAID official during the Biden administration, told the Washington Post.This confluence of incompetence, corruption, and unaccountability is a civic outrage and a grave hazard to the public welfare—and if any Republicans are “unhappy with Elon,” unhappy with any of this, they need to do more than wring their hands and murmur about it behind closed doors.More Great Stories From Vanity FairYour Invitation to Vanity Fair’s 2025 Oscar PartySee Our Predictions For Every 2025 Oscar WinnerInside the FBI’s Lab Leak InvestigationElon Musk’s 13 Children and Their Mothers (Whom We Know of)Where to Watch Every 2025 Oscar-Nominated MovieAmerica’s Food Safety Is Now in the Hands of Don Jr.’s Hunting BuddyRepublican Congressmen Are “Scared Shitless” of TrumpThe Education—and Anointment—of Barron TrumpMillie Bobby Brown on Stranger Things, Marriage, and Life on the FarmFrom the Archive: Vanity Fair’s Oscar Party Is the Only Place to Be"
