title = "Michael Wolff at the Door: His New Bombshell Book on Donald Trump and the MAGA Bubble | Vanity Fair"
description = "Vanity Fair editors are joined by the ‘All or Nothing’ author to unpack the rotating cast of loyalists and opportunists who have fallen in and out of the president’s orbit, from Natalie Harp to Jared Kushner to Rupert Murdoch, and divine the fate of MAGA newcomers like Elon Musk."
full_description = "Inside the HiveMichael Wolff at the Door: His New Bombshell Book on Donald Trump and the MAGA BubbleVanity Fair editors are joined by the All or Nothing author to unpack the rotating cast of loyalists and opportunists who have fallen in and out of the president’s orbit, from Natalie Harp to Jared Kushner to Rupert Murdoch, and divine the fate of MAGA newcomers like Elon Musk.By Jon SkolnikFebruary 26, 2025Michael Wolff on June 03, 2019 in New York City.by Jared Siskin / Patrick McMullan / Getty Images.Save this storySaveSave this storySaveMichael Wolff’s dishy account of Donald Trump’s incredible return to power, All or Nothing: How Trump Recaptured America, is already grabbing headlines and drawing rebukes from the president and his allies. On this episode, host Radhika Jones, along with Claire Howorth and Michael Calderone, chat with Wolff about once again infiltrating the inner circle, what to expect from uber-insiders like Elon Musk and Jared Kushner during Trump 2.0, and how, for even the most loyal subjects, working for Trump “ends in tears.”At the heart of Wolff’s page-turner, which VF excerpted last week, is the kooky cast of characters Trump surrounds himself with, many of whom see it as their responsibility to keep the president insulated from reality. During his 2024 campaign, that included Natalie Harp, 33 at the time, and known internally as the “human printer,” whose ostensible job, Wolff reports, was printing out positive news for the then candidate to read about himself. Also in the mix was attorney Boris Epshteyn, who served as a kind of informational gatekeeper to Trump, often placating him with false assurances about his legal quandaries. “These are, I mean, there’s no other way to describe them except as the ultimate ‘yes people,’” Wolff explains. “They are there precisely because they know what he wants to hear…They can surprise him with what he wants to hear to such an extent that he will at times even make fun of them.”Then there are Trumpworld figures like Kushner, who Calderone suggests has seemed “strategic and disciplined” about when—and how often—he engaged publicly. From the beginning, the president’s son-in-law has always been the “only one,” Wolff explains, who’s stayed “in the [Trump] circle, maintaining the relationship, and profiting by it.” Kushner, he goes on, may have stuck around by doing the “things that essentially Trump was not interested in,” like brokering the Abraham Accords. “That gave Jared a kind of carte blanche. And he obviously did arguably a credible job in terms of the diplomacy there.”Howorth, for her part, is especially curious about first lady Melania Trump, who has been notably less visible than she was during Trump 1.0. Still, she notes, “There [Melania] was at the inauguration in the hat that went viral and people are loving her, and you have to think she might mean something more to his public image than any of us give her credit for.” Needless to say, Trump and Melania’s relationship is far from conventional—but what mystifies Wolff is “why the American public doesn’t say, ‘What’s going on? This is not a marriage like any marriage that, um, that we’ve experienced, that we have.” He adds: “Everybody knows she doesn’t—they do not live together. She is not there. She was not there in the first White House. She's not there now. She's not even at Mar-a-Lago.”Speaking of Mar-a-Lago, Wolff recalls visiting the Florida enclave after the publication of his 2018 book Fire and Fury and dining with Donald and Melania Trump: “You go down, he sits with you for two hours monologizing. You don't get a word in edgewise. And then it’s the, he waits for the patio to fill up. And then he goes out, big round of applause. And then he sits at this table, which is in the center.” For the couple, “when she is there, it's like at the wedding table,” he adds. “They’re the bride and groom.”As for Wolff’s new book, Trump has called it “a total FAKE JOB, just like the other JUNK he wrote,” while White House communications director Steven Cheung attacked the author as a “lying sack of s**t” with a “peanut-sized brain.”Yet Trump has always vested great importance in cultivating friendships with the media’s biggest movers and shakers. One among them is Rupert Murdoch, who Jones argues “holds his own power” given his control of outlets like Fox News, The Wall Street Journal, and the New York Post. We saw their relations fray after January 6, when Murdoch “set out to do everything he possibly could to thwart any possibility that Donald Trump would run for president again, including being almost single-handedly responsible for the Ron DeSantis bubble until that failed completely,” Wolff says. “And then because Rupert ultimately is a guy who understands power—you either have it or you don't have it, and there's no in between—he had to make amends to Trump.”Last but not least, we can’t forget a major addition to the MAGA bubble: Elon Musk. The leader of the Department of Government Efficiency has been very active in gutting the federal bureaucracy. But, as Wolff notes, he could eventually get burned by Trump if he flies too close to the sun. “Elon now becomes the perfect foil. If anything goes wrong, it can be blamed on Elon. But the other thing is Trump has gotten himself into a kind of corner here because of the press saying that this is going to end in tears with Elon. So therefore, the press can’t be right. Therefore, Trump has to be willing to accept this,” he says. “So how long does this go on? I mean, it has an end date; we just don’t know what that end date is.”More Great Stories From Vanity FairYour Invitation to Vanity Fair’s 2025 Oscar PartySee Our Predictions For Every 2025 Oscar WinnerAmerica’s Food Safety Is Now in the Hands of Don Jr.’s Hunting BuddyElon Musk’s 13 Children and Their Mothers (Whom We Know of)Republican Congressmen Are “Scared Shitless” of TrumpWhere to Watch Every 2025 Oscar-Nominated MovieThe Education—and Anointment—of Barron TrumpMeet Trump’s Inner Circle of Suck-UpsMillie Bobby Brown on Stranger Things, Marriage, and Life on the FarmFrom the Archive: Vanity Fair’s Oscar Party Is the Only Place to Be"
