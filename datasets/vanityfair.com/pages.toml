full_description = 'AwwwOscar Moms: Movie Stars Who Brought Their Mothers to the Academy AwardsOver the years, movie stars have paid homage to the women responsible for their genetic fortune in the most Hollywood way possible—by bringing their mothers as their Oscar plus-ones. Below revisit a selection of the actors who have escorted their beloved moms— and some dads, too!— on the Academy Award red carpet.By Julie MillerFebruary 25, 2025FacebookXEmailFacebookXEmailBy KMazur/WireImage/Getty Images.1998: Chris Affleck, Ben Affleck, Matt Damon, and Nancy Carlson-Paige<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_120%2Cc_limit/Oscars-mom-1.jpg 120w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_240%2Cc_limit/Oscars-mom-1.jpg 240w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_320%2Cc_limit/Oscars-mom-1.jpg 320w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_640%2Cc_limit/Oscars-mom-1.jpg 640w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_800%2Cc_limit/Oscars-mom-1.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_320%2Cc_limit/Oscars-mom-1.jpg 320w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_640%2Cc_limit/Oscars-mom-1.jpg 640w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_960%2Cc_limit/Oscars-mom-1.jpg 960w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_1280%2Cc_limit/Oscars-mom-1.jpg 1280w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_1600%2Cc_limit/Oscars-mom-1.jpg 1600w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_1920%2Cc_limit/Oscars-mom-1.jpg 1920w, https://media.vanityfair.com/photos/65d8cda174fff1ae99574a91/master/w_2240%2Cc_limit/Oscars-mom-1.jpg 2240w, https://media.vanityfair.com/photos/