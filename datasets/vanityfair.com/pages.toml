title = "How to Watch the 2025 Oscars on Livestream, TV, and More | Vanity Fair"
description = "A guide for how to watch Hollywood’s biggest night, plus what to expect from host Conan O’Brien and the year’s top races."
full_description = 'oscars 2025How to Watch the 2025 Oscars on Livestream, TV, and MoreA guide for how to watch Hollywood’s biggest night, plus what to expect from host Conan O’Brien and the year’s top races.By Savannah WalshFebruary 11, 2025Handout/Getty ImagesSave this storySaveSave this storySaveAwards season’s final destination has arrived. It’s time to watch the 2025 Oscars live—no matter where you roll out your red carpet.The 97th Academy Awards kick off at 7 p.m. on Sunday, March 2, hosted by comedian Conan O’Brien. This year, the ceremony will be broadcast live on ABC and, for the first time ever, simultaneously streamed live on Hulu. It’s been an uncharacteristically crazy awards season with many major races still up in the air. Will Adrien Brody win his second best-actor trophy for The Brutalist, or will 29-year-old Timothée Chalamet win for his performance as Bob Dylan in A Complete Unknown—beating Brody’s record for the youngest best-actor winner in the process? Does best-actress nominee Karla Sofía Gascón’s social media controversy tank Zoe Saldaña’s odds of winning best supporting actress for Emilia Pérez—leaving an opening for Conclave’s Isabella Rossellini or Wicked’s Ariana Grande? And is Anora now poised to win best picture after key victories at the Producers and Directors Guild of America ceremonies? Or will Conclave capitalize on its recent big wins at the BAFTAs and SAG awards and take home the top prize?A guide to Hollywood’s biggest racesArrowAs the world awaits answers, you can prep for Hollywood’s biggest night by watching this year’s Oscar nominees and delving into the controversy surrounding each of the 10 best-picture nominees (surprise, surprise, the Catholics are mad at Conclave). As the stars align for the ceremony—and all the must-see action from the Vanity Fair Oscar Party—here’s how to watch the Oscars 2025 live from the VIP seat in your own home.Where to Watch the 2025 OscarsThe 2025 Oscars air on Sunday, March 2, on ABC. You can catch the ceremony live on TV at your local ABC affiliate, online at abc.com, or through the ABC app by signing in with a participating television provider. (Details on various providers can be located here, as well as a guide for how to watch the Oscars internationally.)If you’ve cut ties with cable, streaming options include Hulu + Live TV, YouTubeTV, AT&T TV, or FuboTV, many of which come with free-trial options. But none of that matters if you’ve subscribed to Hulu, as this year—for the first time ever—the Oscars will simultaneously stream live on Hulu. Prior to the Academy Awards, the official live red-carpet show will air at 6:30 p.m. ET / 3:30 p.m. PT on ABC.Who Is Hosting the 2025 Oscars?“It’s been three years since I stopped doing my late night show, and I’ve been saying yes to things. It’s been this time of yes,” Conan O’Brien told Good Morning America of his decision to emcee the Oscars for the first time. Following Jimmy Kimmel’s two-year stint, O’Brien will take over hosting duties after previously hosting the Emmys twice. He has also hosted the MTV Movie Awards and the White House correspondents’ dinner.What does O’Brien plan to do from the stage? “We polled America. I spent a lot of my own money polling Americans and saying, ‘Would you like to see Conan O’Brien sing and dance?’ Shocking response,” he said. “People don’t want it, which means they’ll probably try and do it. I like to be an irritant. I will say this: If you like close-up magic tricks, you’ll be very happy with my Oscars performance.”Jokes aside, O’Brien shares that the recent Los Angeles wildfires will inevitably influence the broadcast. “LA has just been through this traumatic experience,” he told GMA. “There’s a lot that’s happening nationally that people are very tense about, and it changes day to day. And so my job right now with my writers is to create possibilities.”Who Is Nominated at the 2025 Oscars?Netflix’s Emilia Pérez leads the 2025 Oscar nominations with 13 total, followed closely by The Brutalist and Wicked, which have 10 nods apiece. The best-picture nominees are rounded out by A Complete Unknown, Anora, Conclave, Dune: Part Two, I’m Still Here, Nickel Boys, and The Substance. After best-actress nominee and Emilia Pérez star Karla Sofía Gascón’s social media implosion, it’s unclear how many awards the former front-runner will take home. Emilia Pérez’s faltering might be good news for Brazil’s I’m Still Here, which is nominated for best picture, best international feature, and best actress for star Fernanda Torres. Torres is a dark horse to win best actress but faces stiff competition from Anora’s Mikey Madison, The Substance’s Demi Moore, and Wicked’s Cynthia Erivo. Over in best actor, it’s a two-horse race between Brody and Chalamet, alongside Sing Sing’s Colman Domingo, Conclave’s Ralph Fiennes, and The Apprentice’s Sebastian Stan.The supporting categories are a little more cut and dry with Zoe Saldaña and A Real Pain’s Kieran Culkin taking home most of the major precursor awards in the supporting actress and actor categories. Still, the Emilia Pérez star will have to prevail over Wicked’s Ariana Grande, A Complete Unknown’s Monica Barbaro, The Brutalist’s Felicity Jones, and Conclave’s Rossellini to take home the statue. Culkin is facing up against his former Succession brother Jeremy Strong for his work in The Apprentice, as well as A Complete Unknown’s Edward Norton, Anora’s Yura Borisov, and The Brutalist’s Guy Pearce.Who Won Oscars in 2024?Last year, Oppenheimer took home best picture, and Christopher Nolan took home best director for helming the billion-dollar biopic. Cillian Murphy won best actor for playing the atom bomb inventor J. Robert Oppenheimer in the best-picture winner, while Emma Stone surprised even herself when she won best actress for playing Bella Baxter in Poor Things, taking home the second lead-actress Oscar of her career. Da’Vine Joy Randolph won best supporting actress for her nuanced work as Mary Lamb in The Holdovers, and Robert Downey Jr. took home his first Oscar for best supporting actor for playing Lewis Strauss in Oppenheimer.Who Are the Presenters at the 2025 Oscars?The Academy has announced its first block of presenters for the telecast, beginning with all four of last year’s acting winners. That would be Oppenheimer’s Cillian Murphy, Poor Things’ Emma Stone, Oppenheimer’s Robert Downey Jr., and The Holdovers’ Da’Vine Joy Randolph. As tradition dictates, the previous year’s best-actor winner will present the best-actress honors, and vice versa for the supporting categories, as well.<img alt="Image may contain Nicole Byer Robert Downey Jr. Cillian Murphy Emma Stone Adult Person Wedding and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_1600%2Cc_limit/2066806756" srcSet="https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_120,c_limit/2066806756 120w, https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_240,c_limit/2066806756 240w, https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_320,c_limit/2066806756 320w, https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_640,c_limit/2066806756 640w, https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_960,c_limit/2066806756 960w, https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_1280,c_limit/2066806756 1280w, https://media.vanityfair.com/photos/67ab7a2bd1f25193e64606ef/master/w_1600,c_limit/2066806756 1600w" sizes="100vw"/>Dania Maxwell/Getty ImagesJoining that quartet are a few other past Oscar winners, including Halle Berry, Penélope Cruz, and Whoopi Goldberg. Also on hand to pass out trophies are Scarlett Johansson, June Squibb, Conclave’s John Lithgow, Inside Out 2’s Amy Poehler, A Complete Unknown’s Elle Fanning, and Wicked’s Bowen Yang.Apparently missing from the 2025 Oscars ceremony? The presentation of best-acting honors via the “Fab Five” format of past ceremonies, in which five previous winners from the acting categories each introduced one nominee. According to Variety, this gimmick will be used for best director and some behind-the-scenes awards instead, avoiding any awkwardness around finding a past winner to heap praise upon Gascón amid her fall from grace. Sources did tell the trade publication that it was determined the “Fab Five” format was not going to be used for acting categories prior to the official nominations announcement.Also on the chopping block are live performances of the best-original-song nominees. For a category featuring songs performed by Elton John and Selena Gomez, the Academy has opted to scrap any onstage renditions. As Bill Kramer, CEO of the Academy of Motion Picture Arts and Sciences, and Janet Yang, Academy president, said in a letter to Academy members on Wednesday, January 22: “This year the best original song category presentation will move away from live performances and will be focused on the songwriters. We will celebrate their artistry through personal reflections from the teams who bring these songs to life. All of this, and more, will uncover the stories and inspiration behind this year’s nominees.”Although there won’t be live performances of the best-original-song nominees, there’s plenty of music in store. Oscar nominees Cynthia Erivo and Ariana Grande will reportedly open the show with a medley of numbers from their smash hit movie-musical, Wicked. Blackpink’s Lisa, Raye, and Doja Cat will perform their song “Born Again” live at the ceremony for the first time ever. And Queen Latifah will lead a musical tribute to the late Quincy Jones.What Time Do the 2025 Oscars Start?Following last year’s early start, the 97th annual Academy Awards begin at 7 p.m. ET and 4 p.m. PT on Sunday, March 2, 2025—an hour ahead of ceremonies past. The 2025 telecast will air live from the Dolby Theatre at Ovation Hollywood in Los Angeles.What Happens After The Oscars?The Vanity Fair Oscar party, of course! After the ceremony is over, tune in to Vanity Fair’s Oscar Party livestream, hosted by Tan France, Francesca Scorsese, and Giggly Squad podcast cohosts Hannah Berner and Paige DeSorbo. The VF livestream will be sure to capture all the stars as they make their way to Vanity Fair’s legendary Oscar Party.Listen to Vanity Fair’s Little Gold Men podcast now.More Great Stories From Vanity FairYour Invitation to Vanity Fair’s 2025 Oscar PartySee Our Predictions For Every 2025 Oscar WinnerInside the FBI’s Lab Leak InvestigationElon Musk’s 13 Children and Their Mothers (Whom We Know of)Where to Watch Every 2025 Oscar-Nominated MovieAmerica’s Food Safety Is Now in the Hands of Don Jr.’s Hunting BuddyRepublican Congressmen Are “Scared Shitless” of TrumpThe Education—and Anointment—of Barron TrumpMillie Bobby Brown on Stranger Things, Marriage, and Life on the FarmFrom the Archive: Vanity Fair’s Oscar Party Is the Only Place to Be'
