title = "Oscars Opposition Research: The (Sometimes Silly) Case Against Every Best-Picture Nominee | Vanity Fair"
description = "Awards campaigning isn’t only about convincing voters that your film is good—it’s also about turning them against the competition."
full_description = 'Awards Insider!Oscars Opposition Research: The (Sometimes Silly) Case Against Every Best-Picture NomineeAwards campaigning isn’t only about convincing voters that your film is good—it’s also about turning them against the competition.By Hillary Busis, John Ross, Chris Murphy, Savannah Walsh, David Canfield, Rebecca Ford, and Anthony BreznicanJanuary 30, 2025Courtesy of Netflix.Save this storySaveSave this storySaveRemember Zero Dark Thirty? Kathryn Bigelow’s follow-up to The Hurt Locker was nominated for a healthy five Oscars, including best picture, actress, and original screenplay. But Bigelow’s film walked away from the 2013 ceremony with just one win—for best sound editing, and even that was a rare tie.A guide to Hollywood’s biggest racesArrowPerhaps the movie was bested by Argo because voters simply preferred that film. It probably didn’t hurt, though, that even as it was drawing rave reviews and bushels of awards nominations, Zero Dark Thirty was also being bombarded with criticism about its veracity and execution—so much that the film’s Wikipedia page has a “Controversies” heading with four separate subsections.As Gregg Kilday wrote in The Hollywood Reporter that year, “Welcome to the dark side of awards season. For weeks, filmmakers have been putting their best feet forward, mingling sociably at cocktail parties and patiently answering the same questions over and over again at Q&As. But at the same time, behind the scenes, there’s a different conversation taking place.”Once upon a time, those whisper campaigns flew under the radar for anyone who wasn’t an awards insider. But thanks to social media, now anybody can launch an opposition campaign against an Oscar contender. Read on to see which lines of attack detractors are taking for all the movies up for best picture this year—some of which are decidedly more serious than others.<img alt="Image may contain Flower Plant Rose Accessories Jewelry Necklace Earring Person Adult Head Face and Happy" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_1600%2Cc_limit/AnoraOK.jpeg" srcSet="https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_120,c_limit/AnoraOK.jpeg 120w, https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_240,c_limit/AnoraOK.jpeg 240w, https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_320,c_limit/AnoraOK.jpeg 320w, https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_640,c_limit/AnoraOK.jpeg 640w, https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_960,c_limit/AnoraOK.jpeg 960w, https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_1280,c_limit/AnoraOK.jpeg 1280w, https://media.vanityfair.com/photos/664f3396f2225f97712938ad/master/w_1600,c_limit/AnoraOK.jpeg 1600w" sizes="100vw"/>Neon.AnoraThough Sean Baker’s films have long been beloved by critics, he’s been overlooked by the Academy until now. This year, Anora scored six total nods, including four for Baker himself: best picture, director, original screenplay, and film editing. The film, about a sex worker (Mikey Madison) who marries the son of a Russian oligarch, is a raucous good time with a devastating final scene.Some audiences, however, have taken issue with Baker’s filmography, which is stacked with movies about sex workers. As VF’s own Richard Lawson put it in a larger consideration of Baker’s work, “One also may question whether he—a cis, white, straight, prep-school-educated filmmaker—is the best steward of stories like Tangerine (2015), a dash through the night following two trans sex workers of color as they scramble to keep afloat in Los Angeles. And what of 2012’s Starlet, a mostly prickly-sweet story of a young woman befriending an elderly widow that takes a graphic detour into pornography? What is it that drives Baker toward this subject matter so far outside his own experience? Is it prurience, or altruistic fascination?”Lawson, for the record, concludes in his piece that those “questions become pedantic and fussy in the light of the films themselves.” Baker, too, has addressed the concerns head-on, saying, “My films are often just reactions to what I’m not seeing enough of in film and TV or what I want to see more of. I’m not the first to have an empathetic approach to sex work—definitely, not the first—but I don’t see a lot of it, and it’s few and far between.”Anora also got into hot water last December when Madison said that she declined the filmmakers’ offer to hire an intimacy coordinator for the film’s multiple graphic sex scenes, saying she felt comfortable not using one. Her statement brought up a more general issue surrounding intimacy coordinators: whether it’s appropriate for a director to make them an option for actors, or if they should be mandatory on any film containing scenes that might require one.All this is tied into an even larger issue—how Hollywood feels about sex on film. This season, sexually charged movies like Challengers and Babygirl were completely shut out of the Oscars. Though Anora avoided that fate, the conversation suggests that intimacy is still a touchy subject for some Academy voters. —John Ross<img alt="Image may contain Adrien Brody Clothing Hat Sun Hat Adult Person Head and Face" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_1600%2Cc_limit/the-brutalist-AI.jpg" srcSet="https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_120,c_limit/the-brutalist-AI.jpg 120w, https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_240,c_limit/the-brutalist-AI.jpg 240w, https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_320,c_limit/the-brutalist-AI.jpg 320w, https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_640,c_limit/the-brutalist-AI.jpg 640w, https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_960,c_limit/the-brutalist-AI.jpg 960w, https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_1280,c_limit/the-brutalist-AI.jpg 1280w, https://media.vanityfair.com/photos/6793d5a67d3c650fca844dbd/master/w_1600,c_limit/the-brutalist-AI.jpg 1600w" sizes="100vw"/>Courtesy of A24.The BrutalistFor a moment, The Brutalist seemed to be the rare awards season darling with no skeletons in its closet. Brady Corbet’s highbrow passion project—artfully shot on a shoestring budget with critically acclaimed performances from Adrien Brody, Felicity Jones, and Guy Pearce—skated through the season, picking up awards with little to no backlash. Then The Brutalist’s editor, Dávid Jancsó, gave an interview he probably regrets. While talking to the tech publication RedShark News, he revealed that generative AI was used in small portions of The Brutalist. Cue backlash.According to Jancsó, a Ukrainian software company called Respeecher was used to smooth out Brody’s and Jones’s Hungarian dialogue. “You can do this in Pro Tools yourself, but we had so much dialogue in Hungarian that we really needed to speed up the process. Otherwise, we’d still be in post,” he said. RedShark also reported that the end of The Brutalist features renderings of blueprints and completed buildings also generated by AI. After Jancsó’s remarks began circulating, Corbet released a lengthy statement clarifying and defending the use of AI in The Brutalist. “Adrien and Felicity’s performances are completely their own,” he said, adding that AI was only used to refine aspects of their Hungarian language dialogue for accuracy. Corbet also pushed back on claims that AI was used to generate any of the buildings featured in the film, stating that “all images were hand-drawn by artists.”Despite Corbet’s swift and forceful response, Brutalist detractors may not be satisfied. A large part of Corbet’s campaign for best director, and as a result, the film’s campaign, focuses on the lengths he went to make his three-and-a-half-hour epic about a Hungarian architect embarking on a new life in America, despite a small budget and no studio backing. Corbet has positioned himself as an up-and-coming auteur with an uncompromising vision. The perception that he may have cut corners by using AI, even slightly, is potentially damaging to that narrative—though the film industry’s use of AI is already more ubiquitous than laypeople may realize.Then there’s the fact that—even with an intermission—the film is quite long at three hours and 35 minutes. Even before The Brutalist scored 10 nominations, there were rumblings that some Academy members simply couldn’t get through the movie. Whether that’s a comment on the film, or on those particular Academy members, it could hurt The Brutalist’s chances. —Chris Murphy<img alt="Image may contain Timothe Chalamet Guitar Musical Instrument Performer Person Solo Performance and Teen" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_1600%2Cc_limit/A-Complete-Unknown_Timothee-Chalamet.jpg" srcSet="https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_120,c_limit/A-Complete-Unknown_Timothee-Chalamet.jpg 120w, https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_240,c_limit/A-Complete-Unknown_Timothee-Chalamet.jpg 240w, https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_320,c_limit/A-Complete-Unknown_Timothee-Chalamet.jpg 320w, https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_640,c_limit/A-Complete-Unknown_Timothee-Chalamet.jpg 640w, https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_960,c_limit/A-Complete-Unknown_Timothee-Chalamet.jpg 960w, https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_1280,c_limit/A-Complete-Unknown_Timothee-Chalamet.jpg 1280w, https://media.vanityfair.com/photos/679a90383020c543ccd610d7/master/w_1600,c_limit/A-Complete-Unknown_Timothee-Chalamet.jpg 1600w" sizes="100vw"/>Searchlight Pictures/Everett Collection.A Complete UnknownWith eight Oscar nominations, including best picture, James Mangold’s Bob Dylan biopic overperformed with the Academy, and even secured tacit endorsement from the musician himself ahead of its December release. But the film—which depicts Dylan’s rise, as well as the shock and awe that accompanied his transition away from folk music—hasn’t been met with total adoration. Any retelling of a beloved artist’s story will come with quibbling over what’s fact and what’s fiction. In short: Timelines were condensed, names changed, and no, Dylan didn’t actually perform “The Times They Are A-Changin’” at the Newport Folk Festival.Then there is the matter of leading man Timothée Chalamet, who earned a best-actor nomination for his performance as Dylan—making him the youngest person since James Dean to get two nods in that category. Perhaps it’s the actor’s youth that has some skeptics wondering whether Chalamet truly sang live as Dylan—without any postproduction enhancement—while shooting.A Complete Unknown’s team insists that he did. Mangold said as much at a post-screening Q&A in December: “And he was phenomenal. Not only that, he proved the brilliance of the method.” Others have backed up this account, including the movie’s supervising music editor, Ted Caplan, who said that although Chalamet isn’t shown singing entire songs, each track was filmed “from top to tail.” Chalamet’s guitar coach, Larry Saltzman, told the New York Post he began training with the actor in 2019, and that his pupil took to playing the instrument “immediately.”But unlike the witches of Wicked, no one had actually seen Chalamet sing these songs live—not even in a film featurette where the actor says, “It was important for me to sing and play live.” All of that changed, however, when Chalamet pulled double duty as host and musical guest on Saturday Night Live. As he joked during his monologue, “They’re either really nice for letting me do this, or incredibly mean and this is all a big prank.” By episode’s end, Chalamet had performed soulful renditions of three Dylan deep cuts. Maybe that will quiet the critics. —Savannah Walsh<img alt="Image may contain Ralph Fiennes Dikgang Moseneke Person Priest Adult People Bishop and Wedding" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_1600%2Cc_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg" srcSet="https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_120,c_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg 120w, https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_240,c_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg 240w, https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_320,c_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg 320w, https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_640,c_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg 640w, https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_960,c_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg 960w, https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_1280,c_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg 1280w, https://media.vanityfair.com/photos/671b913d47171d12abc5a955/master/w_1600,c_limit/conclave-01_4230_C_TP_00015_R_rgb.jpg 1600w" sizes="100vw"/>Ralph Fiennes stars as Cardinal Lawrence in Conclave.Courtesy of Focus Features. © 2024 All Rights Reserved.ConclaveConclave has been a critical hit—it has a 93% fresh rating on Rotten Tomatoes—and is beloved by audiences as well. Ralph Fiennes has been praised for delivering some of his best work as a cardinal who begrudgingly oversees the selection of the next pope. Other directors like Coralie Fargeat and Paul Schrader have sung its praises (though filmmaker Edward Berger missed out on a directing nom). The papal thriller—which follows a fictional 72 hours at the Vatican—also earned eight Oscar noms.But a few real-life Catholics have taken issue with the film. Bishop Robert Barron of the Diocese of Winona-Rochester, Minnesota, took to social media to share his thoughts, telling fellow Catholics to avoid the movie at all costs: “Since it checks practically every woke box, I’m sure it will win a boatload of awards, but my advice is to run away from it as fast as you can.” Catholic news outlet Angelus wasn’t a fan either. “The problem here is not that it is full of bias against the Catholic Church. The problem is that it is just plain bad,” wrote Stefano Rebeggiani.Those Catholic critics aren’t the only ones who have been tough on the film’s ending—even Vanity Fair’s own review says that the final twist doesn’t work. And despite a scene-stealing performance from Isabella Rossellini—a brief role that was enough to nab her a supporting-actress Oscar nomination—its female characters are p'
