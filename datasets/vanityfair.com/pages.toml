izes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_120,c_limit/mitch-mcconell.jpg 120w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_240,c_limit/mitch-mcconell.jpg 240w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_320,c_limit/mitch-mcconell.jpg 320w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_640,c_limit/mitch-mcconell.jpg 640w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_960,c_limit/mitch-mcconell.jpg 960w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_1280,c_limit/mitch-mcconell.jpg 1280w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_1600,c_limit/mitch-mcconell.jpg 1600w" sizes="25vw"/><img alt="Mitch McConnell’s Senate Reign Ends With a Whimper" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_1600%2Cc_limit/mitch-mcconell.jpg"/>PoliticsMitch McConnell’s Senate Reign Ends With a WhimperAfter nearly four decades of quietly and shrewdly amassing power, “Old Crow’s” farewell tour has been overshadowed by health hiccups and the chaos of Trump 2.0, with little to no fanfare. “Mitch McConnellism,” as one Kentucky radio host says, “is dead.”By Pablo Manríquez<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_120,c_limit/VF0225_Trump-Musk_Tout.png 120w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_240,c_limit/VF0225_Trump-Musk_Tout.png 240w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_320,c_limit/VF0225_Trump-Musk_Tout.png 320w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_640,c_limit/VF0225_Trump-Musk_Tout.png 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_120,c_limit/VF0225_Trump-Musk_Tout.png 120w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_240,c_limit/VF0225_Trump-Musk_Tout.png 240w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_320,c_limit/VF0225_Trump-Musk_Tout.png 320w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_640,c_limit/VF0225_Trump-Musk_Tout.png 640w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_960,c_limit/VF0225_Trump-Musk_Tout.png 960w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_1280,c_limit/VF0225_Trump-Musk_Tout.png 1280w, https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_1600,c_limit/VF0225_Trump-Musk_Tout.png 1600w" sizes="25vw"/><img alt="Democrats Expect a 2026 Comeback. But Will Free Elections Even Exist?" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0a6dcd546ec627b8aaf1e/1:1/w_1600%2Cc_limit/VF0225_Trump-Musk_Tout.png"/>PoliticsDemocrats Expect a 2026 Comeback. But Will Free Elections Even Exist?Growing anger with the Trump-Musk alliance could signal a 2026 blue wave, but that assumes MAGA won’t mess with elections before then. Unfortunately, they’ve already begun to do so.By Chris Smith<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/67c0abbdc1a75b5d4519f181/1:1/w_120,c_limit/2201570703 120w, https://media.vanityfair.com/photos/67c0abbdc1a75b5d4519f181/1:1/w_240,c_limit/2201570703 240w, https://media.vanityfair.com/photos/67c0abbdc1a75b5d4519f181/1:1/w_320,c_limit/2201570703 320w, https://media.vanityfair.com/photos/67c0abbdc1a75b5d4519f181/1:1/w_640,c_limit/2201570703 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/67c0abbdc1a75b5d4519f181/1:1/w_120,c_limit/2201570703 120w, https://media.vanityfair.com/photos/67c0abbdc1a75b5d4519f181/1:1/w_240,c_limit/2201570703 240w, https://media.vanityfair.com/photos/67c0abbdc1a75b5d4519f18