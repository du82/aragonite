["https://vanityfair.com/hollywood/story/oscars-2025-predictions-for-every-winner"]
title = "Oscars 2025: See Our Predictions for Every Winner | Vanity Fair"
description = "Can ‘Conclave’ stop Anora’s ascent? Will Brody beat Chalamet? Here’s who we think will win at the Academy Awards."
full_description = "Awards Insider!Oscars 2025: See Our Predictions for Every WinnerCan Conclave stop Anora’s ascent? Will Brody beat Chalamet? Here’s who we think will win at the 2025 Academy Awards.By David Canfield, Rebecca Ford, and Richard LawsonFebruary 24, 2025From Everett Collection.Save this storySaveSave this storySaveThe Oscars 2025 will cap off one of the most turbulent awards seasons in recent memory. From unprecedented natural disasters to unprecedented PR crises, from the reemergence of one of our earliest front-runners to the Brazilian wild card that could upend what little conventional wisdom we’ve gathered these last few months, there hasn’t been a moment for things to feel settled. Both lead-acting races feel thrillingly up for grabs—see: Timothée Chalamet denting Adrien Brody’s momentum on Sunday at the SAG Awards, or Demi Moore and Mikey Madison trading major wins all month—while best picture appears close too, with Conclave pulling off an eleventh hour surge that has it nipping at Anora’s clacking heels.Cast Your Vote With VF’s Oscar BallotArrowAll of which is to say that this year, Awards Insider’s experts needed to put a great deal of thought, analysis, and, sure, bravery into predicting almost every Oscar category. Below, we make and explain our final Oscar winner picks. Get ready for some nail-biters.Best PicturePREDICTED WINNER: AnoraThe BrutalistA Complete UnknownConclaveDune: Part TwoEmilia PérezI’m Still HereNickel BoysThe SubstanceWickedFor the majority of this awards season, it seemed that a single Oscar front-runner might never emerge. Each film had its merits, with a few pulling slightly ahead of the pack: The Brutalist was seen as the film that cinephiles would want to support. Conclave was the crowd-pleaser. The Substance was the bold dark horse. A Complete Unknown seemed like a potential late bloomer. When the Oscar nominations were announced, Emilia Pérez became the de facto film to beat due to its impressive haul, even though the movie itself was polarizing for both audiences and voters. And after the Karla Sofía Gascón scandal knocked the movie off its pedestal, the race one again seemed unclear.That is, until the weekend of the PGA and DGA awards—when Anora was named best picture by both Hollywood’s producers and its directors. The film’s momentum has felt unstoppable ever since. Sean Baker’s eighth feature film went on to clean up at the Independent Spirit Awards; its star, Mikey Madison, finally started winning awards as well. But when Conclave came back with wins at BAFTA and the SAG Awards, it became clear that this would remain a two-film race until the very end. Best picture could easily go to either film, making it one of the tightest races we’ve seen in years.But the fact is that Anora, which won the Palme d’Or way back in May, has been simmering this whole time as a crowd-pleasing film that’s both thrilling and heartbreaking, giving viewers exactly what they want out of a movie. Only three films have won both the Palme d’Or and the best-picture Oscar—The Lost Weekend, Marty, and Parasite—and we expect Anora to join their ranks on Sunday. —Rebecca FordBest DirectorPREDICTED WINNER: Anora, Sean BakerThe Brutalist, Brady CorbetA Complete Unknown, James MangoldEmilia Pérez, Jacques AudiardThe Substance, Coralie FargeatFor a while now, this has been a two-man race between Brady Corbet and Sean Baker. There’s much admiration for Corbet, who managed to make a three-and-a-half-hour epic for just $10 million; he has won directing prizes at the Venice International Film Festival, the Golden Globes, and the BAFTA Awards. Baker, meanwhile, won at the DGA Awards. The two filmmakers have a lot in common: Both accept their awards with passionate speeches about independent film, director’s cuts, and protecting the filmmaking experience. But Baker has been an indie darling much longer than Corbet has, and it feels as if the Academy is finally ready to honor him for his work—and for his continued fight for theatrical releases. —R.F.Best ActorPREDICTED WINNER: Adrien Brody, The BrutalistTimothée Chalamet, A Complete UnknownColman Domingo, Sing SingRalph Fiennes, ConclaveSebastian Stan, The ApprenticeBrody has proven a resilient front-runner in this category despite the seeming surge of his toughest competition. Chalamet came on strong as A Complete Unknown overperformed in nominations, and the SAG Awards—where, aside from a nod for Brody, The Brutalist was snubbed entirely—just honored Chalamet with a pivotal win. Ralph Fiennes, meanwhile, had the backing of the year’s BAFTA- and SAG-winning movie, though that failed to translate into a best-actor win with either voting body. Whether or not The Brutalist goes on to win much else, Brody has been a consistent, clear choice among a range of groups, intra-industry or not. Chalamet has proven himself to be a strong challenger. But even so, it feels hard to believe that the Oscars won’t see Brody’s story through. —David CanfieldBest ActressPREDICTED WINNER: Demi Moore, The SubstanceMikey Madison, AnoraCynthia Erivo, WickedKarla Sofía Gascón, Emilia PérezFernanda Torres, I’m Still HereFor the third year in a row, we’re going into Oscar night with a deliciously tight race on our hands. Moore got out to an early lead with her Golden Globe and Critics Choice wins, but the industry’s first big vote—for the BAFTAs, an indicator of where the Academy’s international support lies—broke for Madison, right on the heels of Anora establishing itself as an overall front-runner. That in and of itself is a potent combination to close the deal at the Oscars. But then SAG swung the race back in Moore’s direction. And none of this has been able to factor in the singular candidacy of Fernanda Torres, who won the Golden Globe but wasn’t nominated anywhere else significant—in large part because I’m Still Here wasn’t seen widely enough.This is not the case with the Academy, which made the Brazilian film a best-picture nominee, and the project can claim some of the strongest final-stretch momentum of any contender this year. (I know of many Academy members who watched I’m Still Here in the last week of voting.) Is that enough to push Torres beyond such stiff competition? Based on what SAG has told us, Moore may be too tough to beat. —D.C.Best Supporting ActorPREDICTED WINNER: Kieran Culkin, A Real PainYura Borisov, AnoraEdward Norton, A Complete UnknownGuy Pearce, The BrutalistJeremy Strong, The ApprenticeThis is probably the one sure bet of the acting categories this year, as Kieran Culkin has won pretty much every big award he could have in the lead-up to March 2. No potential spoiler candidate has emerged even where one was perhaps most likely to: with the major critics groups and with the inscrutable, oddball voters at the Golden Globes. One might even argue that Culkin won this prize all the way back in January of last year, when A Real Pain premiered at Sundance and a long, steady, and dauntless campaign began. Is Culkin’s a lead performance? Absolutely. But Searchlight picked the supporting lane for him instead, and the campaign has been rewarded for that choice nearly every step of the way. If we simply must pick an upset possibility, we’ll go with Yura Borisov as part of a major Anora sweep. But that is really unlikely to happen. —Richard LawsonBest Supporting ActressPREDICTED WINNER: Zoe Saldaña, Emilia PérezMonica Barbaro, A Complete UnknownAriana Grande, WickedFelicity Jones, The BrutalistIsabella Rossellini, ConclaveThis awards season started out as smooth sailing for Emilia Pérez’s Zoe Saldaña, beginning with her shared win for best actress at the Cannes Film Festival back in May. When she won the Golden Globe and gave a gracious and emotional speech, it seemed like there was no stopping her. But then the scandal surrounding Emilia Pérez star Karla Sofía Gascón’s offensive social media posts came to light, and it seemed like Saldaña might be collateral damage as the film, already controversial to begin with, fell from the top of most prediction lists. Yet Saldaña also gave a thoughtful response when she needed to, then continued to show up—and continued to win. With Saldaña having nabbed awards at Critics Choice, BAFTA, and this weekend’s SAG Awards, this trophy is hers. —R.F.Best Adapted ScreenplayPREDICTED WINNER: Conclave, screenplay by Peter StraughanA Complete Unknown, screenplay by James Mangold and Jay CocksEmilia Pérez, screenplay by Jacques Audiard; in collaboration with Thomas Bidegain, Léa Mysius, and Nicolas LivecchiNickel Boys, screenplay by RaMell Ross and Joslyn BarnesSing Sing, screenplay by Clint Bentley and Greg Kwedar; story by Clint Bentley, Greg Kwedar, Clarence Maclin, and John “Divine G” WhitfieldPart of me is still holding out hope that Nickel Boys, which won at the WGA Awards, will win here, as this is the film’s only real chance at a trophy. It’s such a bold adaptation, and perhaps voters will want to reward that. But Peter Straughan won at Critics Choice, the Golden Globes, and the BAFTAs—which confirms that his film’s script is much admired across various voting bodies. —R.F.Best Original ScreenplayPREDICTED WINNER: Anora, written by Sean BakerThe Brutalist, written by Brady Corbet and Mona FastvoldA Real Pain, written by Jesse EisenbergSeptember 5, written by Moritz Binder and Tim Fehlbaum; cowritten by Alex DavidThe Substance, written by Coralie FargeatWhen a best-picture winner loses the screenplay race, it’s usually because the movie is a craft-heavy behemoth that cleans up below the line: think Oppenheimer, The Shape of Water, Chicago. So if we’re predicting Anora to win best picture, then shouldn’t this scrappy comedy made for $6 million win for its raucous script as well? I’m sticking to that logic, albeit with great hesitancy: The Substance’s writer-director, Coralie Fargeat, has found great admiration on the trail, and her run started with a screenplay award at Cannes, while Jesse Eisenberg beat both her and Sean Baker at the BAFTAs in an upset win for A Real Pain. (He also won at the Indie Spirit Awards, where his chief Oscar competitors were not nominated.) All of them have a path to win this category. But it’s difficult for me to imagine a wide embrace for Anora that doesn’t include one of its most pivotal attributes. —D.C.Best Documentary FeaturePREDICTED WINNER: No Other LandBlack Box DiariesPorcelain WarSoundtrack to a Coup d’EtatSugarcaneMost of the time, BAFTA foretells the Oscar winner in this category. So it’s a point of concern that No Other Land was nominated by the British Academy but lost—to Super/Man, a film not even nominated at the Oscars. Also, Porcelain War took home the award at the DGAs, where No Other Land was not even nominated. All of this is to say that, while this timely, horrific doc has dominated the critics circuit and gone remarkably far even without US distribution, it hasn’t quite proven its strength with the industry yet. I still believe the film’s searing potency will take it across the finish line, but if it remains too underseen or controversial—in intimately exploring the Israeli occupation of the West Bank—look to Porcelain War, a portrait of Ukrainian artists under threat, or Black Box Diaries, a #MeToo-fueled Japanese memoir, to pull ahead as films with urgent messages of their own. —D.C.Best Animated FeaturePREDICTED WINNER: FlowInside Out 2Memoir of a SnailWallace & Gromit: Vengeance Most FowlThe Wild RobotWe’re a little uncertain in predicting this one. While The Wild Robot is certainly beloved, and was a commercial success, the tiny Latvian film Flow has a strong contingent of supporters and is also nominated in international feature. In 2022 the animated documentary Flee was nominated in the animated, international, and documentary categories but lost in all three. Maybe Flow will similarly prove a bit too inaccessible to eke out a victory here. And Wild Robot’s studio backing means it was able to launch a real campaign. That said, Flow has won at the Golden Globes and the Spirit Awards, which has us thinking that the little Latvian film that could might still have a real shot here. So we’re banking on an upstart upset. —R.L.Best International FeaturePREDICTED WINNER: I’m Still Here, BrazilThe Girl With the Needle, DenmarkEmilia Pérez, FranceThe Seed of the Sacred Fig, GermanyFlow, LatviaUntil recently, Emilia Pérez had this award in the bag—and hey, it still might. The film remains the most nominated movie at this year’s Oscars, and it has continued to dominate this field with other voting bodies, including BAFTA. Yet the scandal that erupted last month around the film’s star, Karla Sofía Gascón, profoundly damaged a campaign that was built on themes of tolerance, inclusivity, and discovery. Moreover, it opened the door for Emilia’s chief rival, I’m Still Here, which was already riding an incredible wave with the Academy—all the way to its own best-picture nomination. It’s undeniable that the Brazilian entry has momentum and passion on its side. I suspect that will be enough for it to eke out the win here, though the race remains close. —D.C.Best CinematographyPREDICTED WINNER: The Brutalist, Lol CrawleyDune: Part Two, Greig FraserEmilia Pérez, Paul GuilhaumeMaria, Ed LachmanNosferatu, Jarin BlaschkeGreig Fraser won this award for the first Dune, while iconic D.P. Ed Lachman remains outrageously overdue for his first Oscar. But neither Dune: Part Two nor Maria has stirred enough excitement in the category to take down the obvious front-runner, The Brutalist. Together with director Brady Corbet, Lol Crawley resurrected the decades-old VistaVision format to create a cinematic epic on a minuscule budget, making every shot feel about 10 times more expensive than it actually was. The story itself is hard to beat, let alone the striking execution. If anyone here is positioned to pull off an upset, it’s probably Maria; Lachman did already pull out a win from the American Society of Cinematographers. But his path is far more complex when it’s not just his guild peers voting. —D.C.Best Costume DesignPREDICTED WINNER: WickedA Complete UnknownConclaveGladiator IINosferatuA well-regarded commercial smash like Wicked tends to pick up trophies in the Oscars’ technical categories. Nosferatu was a smaller-scale hit, but its grand gothic horror likely alienated a good deal of voters. Gladiator II was not enough of a sensation to pick up casual votes here. Conclave is meticulous in all its clerical detail, but probably a bit too programmatic to win. And A Complete Unknown, a surprise nominee here, is maybe too basic. Wicked got to do new flights of fancy while also hearkening back to legendary costumes of old. That’s a winning combination. —R.L.Best EditingPREDICTED WINNER: Conclave, Nick EmersonAnora, Sean BakerThe Brutalist, Dávid JancsóEmilia Pérez, Juliette WelflingWicked, Myron KersteinNone of these nominees have ever won in this category before, and Wicked’s Myron Kerstein and Emilia Pérez’s Juli"
