title = "Monica Barbaro, Anna Sawai, Keke Palmer, and Aaron Pierre Toast Young Hollywood at Vanity Fair and Instagram’s Vanities Party | Vanity Fair"
description = "The annual party at Bar Marmont celebrated the most exciting rising talent of the year."
full_description = 'Oscars 2025Monica Barbaro, Anna Sawai, Keke Palmer, and Aaron Pierre Toast Young Hollywood at Vanity Fair and Instagram’s Vanities PartyThe annual party at Bar Marmont celebrated the most exciting rising talent of the year.By Rebecca FordFebruary 27, 2025Keke PalmerBy Myles Hendrik.Save this storySaveSave this storySaveMonica Barbaro was in the midst of one of the busiest weeks of her life when she arrived at Bar Marmont on Wednesday night to cohost Vanity Fair and Instagram’s Vanities Party, a celebration of the most captivating young talent and their creative accomplishments from the past year. In just the past few days, Barbaro, who is Oscar nominated for playing Joan Baez in A Complete Unknown, attended the SAG Awards, the Oscar nominees dinner, and the annual class photo. “It’s so exciting,” she told Vanity Fair, “but you start to lose your sense of what happened when and who you met—it’s so overstimulating.”<img alt="Image may contain Keke Palmer Monica Barbaro Jetsun Pema People Person Clothing Coat Adult and Groupshot" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_1600%2Cc_limit/Vanities-Party-2025-002.jpg" srcSet="https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_120,c_limit/Vanities-Party-2025-002.jpg 120w, https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_240,c_limit/Vanities-Party-2025-002.jpg 240w, https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_320,c_limit/Vanities-Party-2025-002.jpg 320w, https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_640,c_limit/Vanities-Party-2025-002.jpg 640w, https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_960,c_limit/Vanities-Party-2025-002.jpg 960w, https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_1280,c_limit/Vanities-Party-2025-002.jpg 1280w, https://media.vanityfair.com/photos/67c049ed90cbbc1fde172161/master/w_1600,c_limit/Vanities-Party-2025-002.jpg 1600w" sizes="100vw"/>Monica Barbaro, Keke Palmer, Aaron Pierre and Anna Sawai cohost Vanity Fair and Instagram Celebrate Vanities: A Night for Young Hollywood at Bar Marmont on February 26, 2025, in Los Angeles, California. By Emma McIntyre/Getty Images.Firework contentThis content can also be viewed on the site it originates from.She was still soaking in her experience at the SAG Awards the previous Sunday, when her Complete Unknown costar Timothée Chalamet won the best-actor prize and gave a speech in which he expressed his desire to be “one of the greats.” It was one of the more surprising and divisive acceptance speeches of the night. “I’m enjoying the discourse that it has inspired,” said Barbaro. “I like hearing people talk about it and evaluate it, and connect to it and reject it. It’s just really interesting. It’s enlightening to me to hear people’s opinions.”<img alt="Image may contain Kim Moses Accessories Formal Wear Tie Face Head Person Photography Portrait Adult and Urban" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_1600%2Cc_limit/Vanities-Party-2025-003.jpg" srcSet="https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_120,c_limit/Vanities-Party-2025-003.jpg 120w, https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_240,c_limit/Vanities-Party-2025-003.jpg 240w, https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_320,c_limit/Vanities-Party-2025-003.jpg 320w, https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_640,c_limit/Vanities-Party-2025-003.jpg 640w, https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_960,c_limit/Vanities-Party-2025-003.jpg 960w, https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_1280,c_limit/Vanities-Party-2025-003.jpg 1280w, https://media.vanityfair.com/photos/67c049ed84d82af1b1d9adae/master/w_1600,c_limit/Vanities-Party-2025-003.jpg 1600w" sizes="100vw"/>Maria Bakalova By Myles Hendrik.<img alt="Image may contain Sarah Glendening Aisha Dee Adult Person Photobombing Accessories Jewelry Necklace Head and Face" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_1600%2Cc_limit/Vanities-Party-2025-004.jpg" srcSet="https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_120,c_limit/Vanities-Party-2025-004.jpg 120w, https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_240,c_limit/Vanities-Party-2025-004.jpg 240w, https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_320,c_limit/Vanities-Party-2025-004.jpg 320w, https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_640,c_limit/Vanities-Party-2025-004.jpg 640w, https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_960,c_limit/Vanities-Party-2025-004.jpg 960w, https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_1280,c_limit/Vanities-Party-2025-004.jpg 1280w, https://media.vanityfair.com/photos/67c049ee2b0ef2197dad391d/master/w_1600,c_limit/Vanities-Party-2025-004.jpg 1600w" sizes="100vw"/>Ebony Obsidian, Aisha Dee, and Devin Way By Myles Hendrik.<img alt="Image may contain Monica Barbaro Face Head Person Photography Portrait Adult Accessories Jewelry Ring and Happy" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_1600%2Cc_limit/Vanities-Party-2025-005.jpg" srcSet="https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_120,c_limit/Vanities-Party-2025-005.jpg 120w, https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_240,c_limit/Vanities-Party-2025-005.jpg 240w, https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_320,c_limit/Vanities-Party-2025-005.jpg 320w, https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_640,c_limit/Vanities-Party-2025-005.jpg 640w, https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_960,c_limit/Vanities-Party-2025-005.jpg 960w, https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_1280,c_limit/Vanities-Party-2025-005.jpg 1280w, https://media.vanityfair.com/photos/67c049ee90cbbc1fde172163/master/w_1600,c_limit/Vanities-Party-2025-005.jpg 1600w" sizes="100vw"/>Monica Barbaro By Myles Hendrik.Sunday’s SAG Awards were also a big milestone for Anna Sawai, who served as a cohost for the Vanities party along with Barbaro, Keke Palmer, and Aaron Pierre. The Shōgun star won the award for best lead actress in a drama series, in the final stop on a long journey with the hit FX show. Sawai, who also previously won at the Emmys and the Golden Globes, has been emotional onstage as she’s accepted her awards throughout the season. “I realized that no one was really getting teary, so it felt kind of silly in hindsight,” said Sawai, who was joined at the party by her Shōgun costar Moeka Hoshi. “I think that more than just the award itself, it was the experience that I got and the fact that it wasn’t just my achievement. It was everyone’s hard work. Thinking about that, it made me quite emotional.”<img alt="Image may contain Blouse Clothing Dress Coat Adult Person Face Head Photography Portrait Jacket and Blazer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_1600%2Cc_limit/Vanities-Party-2025-006.jpg" srcSet="https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_120,c_limit/Vanities-Party-2025-006.jpg 120w, https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_240,c_limit/Vanities-Party-2025-006.jpg 240w, https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_320,c_limit/Vanities-Party-2025-006.jpg 320w, https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_640,c_limit/Vanities-Party-2025-006.jpg 640w, https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_960,c_limit/Vanities-Party-2025-006.jpg 960w, https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_1280,c_limit/Vanities-Party-2025-006.jpg 1280w, https://media.vanityfair.com/photos/67c04a0c289a4c0859393ff6/master/w_1600,c_limit/Vanities-Party-2025-006.jpg 1600w" sizes="100vw"/>Marissa Bode and guest By Myles Hendrik.<img alt="Image may contain Addison Timlin Blazer Clothing Coat Jacket Cup Formal Wear Suit Accessories Tie and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_1600%2Cc_limit/Vanities-Party-2025-007.jpg" srcSet="https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_120,c_limit/Vanities-Party-2025-007.jpg 120w, https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_240,c_limit/Vanities-Party-2025-007.jpg 240w, https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_320,c_limit/Vanities-Party-2025-007.jpg 320w, https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_640,c_limit/Vanities-Party-2025-007.jpg 640w, https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_960,c_limit/Vanities-Party-2025-007.jpg 960w, https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_1280,c_limit/Vanities-Party-2025-007.jpg 1280w, https://media.vanityfair.com/photos/67c04a0ce1646dafe5d1d4db/master/w_1600,c_limit/Vanities-Party-2025-007.jpg 1600w" sizes="100vw"/>Lili Reinhart, Jack Martin, Cooper Raiff, and Addison Timlin By Myles Hendrik.<img alt="Image may contain Lucy Hale Courtney Eaton Adult Person Black Hair Hair Clothing Dress Accessories and Jewelry" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_1600%2Cc_limit/Vanities-Party-2025-008.jpg" srcSet="https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_120,c_limit/Vanities-Party-2025-008.jpg 120w, https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_240,c_limit/Vanities-Party-2025-008.jpg 240w, https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_320,c_limit/Vanities-Party-2025-008.jpg 320w, https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_640,c_limit/Vanities-Party-2025-008.jpg 640w, https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_960,c_limit/Vanities-Party-2025-008.jpg 960w, https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_1280,c_limit/Vanities-Party-2025-008.jpg 1280w, https://media.vanityfair.com/photos/67c04a0c90cbbc1fde172165/master/w_1600,c_limit/Vanities-Party-2025-008.jpg 1600w" sizes="100vw"/>Courtney Eaton and Lucy Hale By Myles Hendrik.You couldn’t walk a few steps at the packed party—where guests sipped on Tequila Don Julio and made their way onto the dance floors, where DJs Equal and Devin Lucien did the honors—without spotting great young talents from both the big and small screens. Stars from some of the top films of the past year included My Old Ass’s Maisy Stella, Unstoppable’s Jharrel Jerome, I Saw the TV Glow’s Justice Smith, Saturday Night’s Gabriel LaBelle, Babygirl’s Esther McGregor, and The Apprentice’s Maria Bakalova. Euphoria costars Barbie Ferreira and Lukas Gage arrived together and mingled with other TV breakouts like Yellowjackets’ Liv Hewson, What We Do in the Shadows’ Harvey Guillén, The Handmaid’s Tale’s Madeline Brewer, and Outer Banks’ Chase Stokes.<img alt="Image may contain Noah Centineo Frankie Delgado Dominic Burns People Person Clothing Coat Jacket and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_1600%2Cc_limit/Vanities-Party-2025-009.jpg" srcSet="https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_120,c_limit/Vanities-Party-2025-009.jpg 120w, https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_240,c_limit/Vanities-Party-2025-009.jpg 240w, https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_320,c_limit/Vanities-Party-2025-009.jpg 320w, https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_640,c_limit/Vanities-Party-2025-009.jpg 640w, https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_960,c_limit/Vanities-Party-2025-009.jpg 960w, https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_1280,c_limit/Vanities-Party-2025-009.jpg 1280w, https://media.vanityfair.com/photos/67c04a0d99bc1649471dcbe5/master/w_1600,c_limit/Vanities-Party-2025-009.jpg 1600w" sizes="100vw"/>Michael Gandolfini, Noah Centineo, Kit Connor, and Archie Madekwe By Myles Hendrik.<img alt="Image may contain Alycia DebnamCarey Adult Person Urban Accessories Glasses Wedding Fun and Party" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_1600%2Cc_limit/Vanities-Party-2025-010.jpg" srcSet="https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_120,c_limit/Vanities-Party-2025-010.jpg 120w, https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_240,c_limit/Vanities-Party-2025-010.jpg 240w, https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_320,c_limit/Vanities-Party-2025-010.jpg 320w, https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_640,c_limit/Vanities-Party-2025-010.jpg 640w, https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_960,c_limit/Vanities-Party-2025-010.jpg 960w, https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_1280,c_limit/Vanities-Party-2025-010.jpg 1280w, https://media.vanityfair.com/photos/67c04a11c3e1a95db0ce22c7/master/w_1600,c_limit/Vanities-Party-2025-010.jpg 1600w" sizes="100vw"/>Guest, Owen Thiele, Odessa A’zion, Jordan Firstman, and Alycia Debnam-Carey at the Don Julio minibar By Myles Hendrik.ArrowArrowPierre, who had a busy 2024 in which he played Malcolm X in the miniseries Genius and voiced Mufasa in Disney’s Mufasa: The Lion King, said he sees a through line in what his generation of actors is hoping to accomplish. “We share the sentiment, and that sentiment is committing to excellence, committing to making each project we attach ourselves to the best version of itself, and bringing our very best to each project,” he said. “It is enormously inspiring to be in a class of artists and a class of peers with that energy.”Threads contentThis content can also be viewed on the site it originates from.Palmer, whose comedy One of Them Days opened in theaters in January, said she’s been inspired by many of this year’s Oscar-nominated performances, including Cynthia Erivo’s work in Wicked, along with Margaret Qualley '
