title = "Frequently Asked Questions: VanityFair.com | Vanity Fair"
description = "Frequently Asked Questions: VanityFair.com"
full_description = 'Frequently Asked QuestionsAbout“Our mission at Vanity Fair is to capture the zeitgeist and meet our readers at all intersections of power and influence, from Wall Street to Washington, Silicon Valley to Hollywood, and beyond. In an age where these worlds have become so closely intertwined, we believe that journalism that breaks through the noise and makes a difference is more critical than ever. We pursue this work by telling great stories, creating indelible images, and leading the culture forward.” —Radhika Jones, Editor in ChiefBecoming a SubscriberHow do I subscribe or give a gift subscription?Please visit our subscription page to find the best option for your needs.When will my first issue arrive?You should receive your first issue between three and six weeks after purchasing a print subscription.Check on which issue was mailed to you most recently or report a delivery problem.What does my subscription include?All subscriptions provide unlimited digital access to the website. Print subscribers also receive the print edition of the magazine, published 10 times per year.My subscription included a tote bag. When can I expect it to arrive?The tote ships six to eight weeks after your payment is processed. International orders may take longer to ship, and packages may be delayed at customs. We regret that our staff cannot track tote bags after they enter the postal system.What forms of payment do you accept?We accept Visa, Mastercard, American Express, Discover, and Diners Club cards. We also accept PayPal, Apple Pay, Google Pay, and Amazon Pay. Alternatively, checks can be mailed to Vanity Fair, Customer Service Department, P.O. Box 37714, Boone, IA 50037-0714.Can I get a receipt or confirmation of my subscription, account details, or cancellation?Yes, our staff would be happy to send you a receipt. After subscribing, you can expect to receive a confirmation email within 24 hours. For all other requests, please visit our contact us page.When will I be charged?Credit cards are charged as soon as your order is received. It may take up to three days for the charge to appear on your credit card statement. Before the start of each renewal, you will be emailed a reminder notice summarizing the details of your subscription and the rate that you will be charged.Why do I need to provide a mailing address for a digital subscription?If your subscription included a physical premium, we need your mailing address for delivery purposes.Can I subscribe to Vanity Fair if I live outside the United States?Yes. You can subscribe to Vanity Fair from most countries, although it may take longer to receive print issues in the mail. For assistance, Please visit our contact us page to submit this request.Managing Your SubscriptionI forgot my password. How can I recover it?Go to VanityFair.com and click Sign In (top-right corner of your screen)Enter your email addressClick the link for Help me sign in (under the sign-in fields)If there is a Vanity Fair subscription associated with your email address, we will send you instructions for resetting your password.How do I make changes to my email address or password?Please visit My Account to manage your VanityFair.com account information, including your email address and password.What does it mean to link or verify my subscription? Why is this important?Creating an online account and subscribing to the magazine are independent operations. It is possible to create an online account without being a subscriber, and vice versa. In order to read unlimited articles online as a subscriber, you’ll need to link your subscription to your Vanity Fair account.To link your subscription:Sign In or Create an AccountEnter your account number or subscription number, which can be found in two places: the account summary section of Customer Care and the mailing label of a magazine, if you are a print subscriber.Or, select the link to use your shipping address.If you have trouble linking your subscription, please visit our contact us page to submit this request.I have multiple Vanity Fair accounts. Can I combine them?Yes, our staff would be happy to assist you. Please visit our contact us page.How do I unsubscribe from Vanity Fair?You can cancel your subscription (or a gift subscription) within your online account page. You can also cancel via Customer Care. If you cancel your magazine subscription but are still receiving bills, please note that it takes a few days for a cancellation to become effective. Therefore, if you receive any invoices after you have canceled, please disregard.If I cancel my subscription, when does the cancellation go into effect?For print subscriptions, the cancellation will be processed immediately, though you may receive one to two additional issues after ending your subscription. For digital-only subscriptions, you will retain access until the end of your existing term (no refund), which will not be renewed.How can I receive confirmation of my cancellation?Our staff would be happy to send you a confirmation. Please visit our contact us page to submit this request.How can I cancel my print subscription and keep digital access only?Please visit our contact us page to submit this request.How do I check on when my subscription expires?Magazine and digital-only subscribers can view the expiration date of their subscription (or gift subscription) via the Manage Profile page or by contacting Customer Care.How do I temporarily suspend my subscription?Print subscribers can stop your subscription (or gift subscription) for up to one year, and then resume it, via Customer Care by selecting Manage Subscription, then Suspend Subscription. Digital-only subscribers do not have the option to suspend or pause.If I suspend my print subscription, will I still have access to VanityFair.com?Full access to the website is available only to subscribers, so while your subscription is suspended, you will have limited access.Reading on a Phone, Computer, or TabletWhy should I create an online account?All readers are encouraged to create a free online account, regardless of their subscription status, so you can take advantage of features like saving stories to read later. If you have not done so, please create a free account now.Are all Vanity Fair articles available online?All articles originally published online are available with your subscription at VanityFair.com. You can also explore the magazine archives.The archive consists of the best of Vanity Fair’s past via our archive collections. These curated collections feature the lasting achievements of VF’s most influential contributors—from Annie Leibovitz and Michael Lewis to Christopher Hitchens and Dominick Dunne—as well as the journalistic coups that astonished the world, from Caitlyn Jenner’s public introduction to the unmasking of Deep Throat. Going deeper, you’ll immerse yourself in gripping narratives about lurid scandals, Hollywood glamour, big-business catastrophes, Silicon Valley failures, royal mischief-making, and larger-than-life personalities.Do I need a subscription to access VanityFair.com?If you are not a subscriber, you have limited access to Vanity Fair’s website.Is the magazine available on mobile and tablet devices?Yes. The Vanity Fair app allows you to view the print version of Vanity Fair. If you subscribe directly through the Vanity Fair app, you can read the complete magazine by selecting which issue you are interested in reading. Issues are available to browse and save offline.The Vanity Fair app is available through the App Store. Digital editions of the magazine are available through the Nook bookstore.Why am I no longer receiving new print issues through Amazon?As of March 2023, print issues of Vanity Fair are no longer available for purchase through Amazon. For questions about this change, please call Amazon at 1-888-280-4331 or visit their Digital Services and Device Support page.If you’d like to continue reading Vanity Fair, you can subscribe online or reach out to us at 1-855-241-9378 (if outside the US +1-332-238-4894) or help@vanityfair.comWhy am I no longer receiving new issues on my Kindle?As of March 2023, Vanity Fair is no longer available for purchase through Kindle Newsstand, but any back issues should still be available in the Cloud tab of the Kindle Newsstand. For questions about this change, please call Amazon at 1-888-280-4331 or visit their Digital Services and Device Support page.You can subscribe online or reach out to us at 1-855-241-9378 (if outside the US +1-332-238-4894) or help@vanityfair.com.I purchased a Vanity Fair subscription on my Nook Color Tablet. Does that provide unlimited digital access to Vanity Fair?If you purchased a subscription directly from Barnes & Noble, your access is limited to your Nook Color Tablet. If you have questions, please visit Barnes & Noble’s contact us page.How do I get unlimited access to Vanity Fair on my Nook?If you’re already a subscriber, open the Nook Bookstore.Visit the Vanity Fair page.Order a monthly subscription to begin a 14-day trial. You will not be charged.After submitting your order, check your inbox. You will receive an email with instructions for redeeming your free offer as an active magazine subscriber.How do I get unlimited access to Vanity Fair on my Android phone or tablet?Subscribers can read Vanity Fair on an Android phone or tablet via VanityFair.com. You can also follow Vanity Fair via Google News but will need to sign in to our website to read articles.Do I need a subscription to follow Vanity Fair in Google News?Vanity Fair’s feed is free to follow, though subscribers will need to sign in to our website to read articles.How can I access Vanity Fair articles published on Flipboard?Vanity Fair’s feed is free to follow at https://flipboard.com/@VanityFair. Articles link to VanityFair.com, where subscribers have unlimited access and nonsubscribers have limited access.I purchased a Vanity Fair subscription on Zinio. Does that provide unlimited digital access to Vanity Fair?If you purchased a subscription on Zinio, your access is limited to Zinio. If you have questions, please visit Zinio’s contact us page.How do I sign up for email newsletters?Visit vanityfair.com/newsletter to sign up for any of our offerings, including “Cocktail Hour,” “The Hive,” “HWD Daily,” “Awards Insider,” and more.I signed up for your newsletters. Why am I not receiving them regularly?Please check your junk folder. If the problem persists, please visit our contact us page to submit your request.How do I unsubscribe from a newsletter or marketing email?To unsubscribe from a newsletter, select Unsubscribe at the bottom of the email, or sign in to VanityFair.com and navigate to My Account from the top-right corner. You can manage your newsletter subscriptions at the bottom of your profile.For all marketing emails, select Unsubscribe at the bottom of the email.How can I contact editors or contributors?To provide feedback, please email letters@vf.com.How do I access the Vanity Fair magazine app?Print magazine subscribers can access issues in the Vanity Fair app at no extra charge. Not subscribed to the magazine? You can also purchase single issues within the Vanity Fair app. Digital subscribers can access magazine issues in our online archive.How can I listen to Vanity Fair audio and podcasts?Explore our Podcasts hub, or download episodes, for free, from iTunes and most other platforms.How can I advertise in Vanity Fair?Please visit www.condenast.com/brands/vanity-fair.Digital All AccessWhat is Vanity Fair Digital All Access?The Vanity Fair All Access subscription provides digital access to Vanity Fair, WIRED, Vogue, Architectural Digest, Bon Appétit, and Epicurious.*If selected at an additional cost, The New Yorker access is also included. To add New Yorker access, please contact customer support at 1-855-241-9378.What is included in the Vanity Fair Digital All Access subscription?Unlimited access to Vanity Fair, WIRED, Vogue, Architectural Digest, Bon Appétit, and Epicurious. (If selected at an additional cost, The New Yorker access is also included.)FREE Vanity Fair toteComplete online archive access for most brandsHow much does the Vanity Fair Digital All Access subscription cost?To see our latest offers, visit our order page.How do I sign up for a Vanity Fair Digital All Access subscription?Please visit our order page and select your offer.If I already have a Vanity Fair digital subscription can I upgrade to Digital All Access?Yes, you can upgrade your Vanity Fair subscription to a Digital All Access subscription by contacting customer care via phone at 1-855-241-9378 (if outside the US +1-332-238-4894) or email help@vanityfair.com. All Access is not available for print subscriptions.If I already have a WIRED, Vogue, The New Yorker, Architectural Digest, Bon Appétit, or Epicurious subscription can I change to Digital All Access?Other subscriptions cannot be bundled individually at this time. If you are interested in a Vanity Fair Digital All Access subscription, please contact customer care via phone at 1-855-241-9378(if outside the US +1-332-238-4894) or email help@vanityfair.com for additional assistance.If I cancel my Vanity Fair Digital All Access subscription, can I maintain my WIRED, Vogue, The New Yorker, Architectural Digest, Bon Appétit, and Epicurious access?Canceling your Digital All Access subscription will result in a loss of access to all brands included.Does the Vanity Fair Digital All Access subscription include app access?The New Yorker (iOS and Android) and Epicurious (iOS) apps are included with your Digital All Access subscription.Most Popular<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/67c1e5515d3ef82f0c262913/1:1/w_120,h_350,c_limit/undefined 120w, https://media.vanityfair.com/photos/67c1e5515d3ef82f0c262913/1:1/w_240,h_350,c_limit/undefined 240w, https://media.vanityfair.com/photos/67c1e5515d3ef82f0c262913/1:1/w_320,h_350,c_limit/undefined 320w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.vanityfair.com/photos/67c1e5515d3ef82f0c262913/1:1/w_120,h_350,c_limit/undefined 120w, https://media.vanityfair.com/photos/67c1e5515d3ef82f0c262913/1:1/w_240,h_350,c_limit/undefined 240w, https://media.vanityfair.com/photos/67c1e5515d3ef82f0c262913/1:1/w_320,h_350,c_limit/undefined 320w" sizes="100vw"/><img alt="Here’s Your Printable Oscar Ballot for 2025" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c1e5515d3ef82f0c262913/1:1/w_350%2Ch_350%2Cc_limit/undefined"/>Here’s Your Printable Oscar Ballot for 2025By Chris Murphy<source media="(max-width: 767px)" srcSet="https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_120,h_350,c_limit/undefined 120w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_240,h_350,c_limit/undefined 240w, https://media.vanityfair.com/photos/67c22ac2d8013a69fd212ede/1:1/w_320,h_350,c_limi'
