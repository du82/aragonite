dways%2520Nom.png" srcSet="https://media.vanityfair.com/photos/67c0b360af1c99e55b68d3be/master/w_120,c_limit/10%20-%20Sidways%20Nom.png 120w, https://media.vanityfair.com/photos/67c0b360af1c99e55b68d3be/master/w_240,c_limit/10%20-%20Sidways%20Nom.png 240w, https://media.vanityfair.com/photos/67c0b360af1c99e55b68d3be/master/w_320,c_limit/10%20-%20Sidways%20Nom.png 320w, https://media.vanityfair.com/photos/67c0b360af1c99e55b68d3be/master/w_640,c_limit/10%20-%20Sidways%20Nom.png 640w, https://media.vanityfair.com/photos/67c0b360af1c99e55b68d3be/master/w_960,c_limit/10%20-%20Sidways%20Nom.png 960w, https://media.vanityfair.com/photos/67c0b360af1c99e55b68d3be/master/w_1280,c_limit/10%20-%20Sidways%20Nom.png 1280w, https://media.vanityfair.com/photos/67c0b360af1c99e55b68d3be/master/w_1600,c_limit/10%20-%20Sidways%20Nom.png 1600w" sizes="100vw"/>Shockingly, the only Thomas Haden Church/Virginia Madsen/Sandra Oh best picture nominee to date. The pre-show is hosted by Chris Connelly, Jann Carl, Shaun Robinson, and . . . Oh for the love of god, this guy. He had entirely too much access to Hollywood.<img alt="Image may contain Billy Bush Fashion People Person Crowd Adult and Formal Wear" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_1600%2Cc_limit/11%2520-%2520Billy%2520Carpet.png" srcSet="https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_120,c_limit/11%20-%20Billy%20Carpet.png 120w, https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_240,c_limit/11%20-%20Billy%20Carpet.png 240w, https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_320,c_limit/11%20-%20Billy%20Carpet.png 320w, https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_640,c_limit/11%20-%20Billy%20Carpet.png 640w, https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_960,c_limit/11%20-%20Billy%20Carpet.png 960w, https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_1280,c_limit/11%20-%20Billy%20Carpet.png 1280w, https://media.vanityfair.com/photos/67c0b3741188cd934c93ae6c/master/w_1600,c_limit/11%20-%20Billy%20Carpet.png 1600w" sizes="100vw"/>“Someone get me a bus!” Mr. Bush’s first interview is with Hilary Swank. Billy talks to her like the character she played was a real person. He seems to think Million Dollar Baby was a biopic.<img alt="Image may contain Billy Bush Fashion Adult Person Body Part Hand Accessories Formal Wear Tie and Holding Hands" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.vanityfair.com/photos/67c0b3a4c1a75b5d4519f187/master/w_1600%2Cc_limit/12%2520-%2520Billy%2520Hilary.png" srcSet="https://media.vanityfair.com/photos/67c0b3a4c1a75b5d4519f187/master/w_120,c_limit/12%20-%20Billy%20Hilary.png 120w, https://media.vanityfair.com/photos/67c0b3a4c1a75b5d4519f187/master/w_240,c_limit/12%20-%20Billy%20Hilary.png 240w, https://media.vanityfair.com/photos/67c'
