title = "Here’s Your Printable Oscar Ballot for the 2025 Academy Awards | Vanity Fair"
description = "Don't forget to print out your official Oscar ballot before watching the 97th Academy Awards on Sunday, March 2nd."
full_description = 'Oscars 2025Here’s Your Printable Oscar Ballot for 2025Don’t forget to print out your official Oscar ballot before watching the 97th Academy Awards on Sunday, March 2.By Chris MurphyFebruary 28, 2025NEW YORK - FEBRUARY 25: Overview of Oscar statues on display at "Meet the Oscars" at the Time Warner Center on February 25, 2010 in New York City. (Photo by Andrew H. Walker/Getty Images)Andrew H. Walker/Getty ImagesSave this storySaveSave this storySaveAre you trying to win your Oscars pool? Don’t forget to lock in your official Oscar predictions by using Vanity Fair’s printable Oscar ballot 2025. In a wild and unpredictable Oscar season, it’s more important than ever to follow along.Cast Your Vote With VF’s Oscar BallotArrowOf course, not everything is up in the air. We do know that on Sunday, March 2, the 97th Academy Awards will be held once again at the Dolby Theatre in Los Angeles, with beloved comedian Conan O’Brien hosting the ceremony for the first time ever. Big stars like Harrison Ford, Andrew Garfield, and Samuel L. Jackson have been tapped to present at the ceremony, as well as Rachel Zegler, Margaret Qualley, and Oscar-nominee Zoe Saldaña. There will be feature performances from musical artists like Blackpink’s Lisa, Raye, Doja Cat, and Queen Latifah, leading a tribute for the late Quincey Jones. Wicked fans are in luck, as Oscar nominees Cynthia Erivo and Ariana Grande will reportedly open the show with a medley of numbers from the smash hit movie-musical.But while the performances and presenters may be locked, many of the races are tighter than ever. Will Timothée Chalamet reach greatness and triumph over Adrien Brody for best actor? Will Demi Moore take home a different type of substance and leave the ceremony with an Oscar? And after the implosion of Emilia Pérez, what will win best picture? If you’re not confident in your choices, check out Vanity Fair’s final Oscar predictions for who will reign supreme. And if you are going the more sustainable route this year, Vanity Fair has an interactive digital ballot you can fill out.Print Your 2025 Oscar Ballot HereCelebrate your Oscar pool win by tuning in to Vanity Fair’s Oscar Party livestream, hosted by Tan France, Francesca Scorcese, and Giggly Squad podcast cohosts Hannah Berner and Paige DeSorbo. The live stream will be sure to capture all the stars as they keep Hollywood’s biggest night going at Vanity Fair’s legendary Oscar Party. Until then, best of luck filling out your Oscar ballot. May the biggest movie buff win.This year, in conjunction with our Oscar-week events, Vanity Fair is supporting the efforts of two local organizations helping Angelenos: the Motion Picture & Television Fund and Baby2Baby. We encourage you to donate to these or other charities supporting the city and families.The Ultimate Guide to the 2025 OscarsYour Invitation to Vanity Fair’s 2025 Oscar Party31 Years of Vanity Fair’s Oscar PartyAnd the Nominees Are…The (Sometimes Silly) Case Against Every Best-Picture NomineeSee Our Predictions For Every 2025 Oscar WinnerCast Your Vote With Vanity Fair’s 2025 Oscar BallotWhere to Watch Every 2025 Oscar-Nominated MovieWhy Anora Is Now the Front-Runner for Best PictureThe Best Oscar Dresses of All Time'
