title = "Gene Hackman and Wife Betsy Arakawa's Deaths Deemed “Suspicious” In Search Warrant: “No Obvious Sign of a Gas Leak” | Vanity Fair"
description = 'On Thursday morning, Hackman, his wife, and a dog were all found dead in their Santa Fe home. While no foul play was initially suspected, New Mexico authorities have now deemed their deaths "suspicious enough in nature to require a thorough search and investigation."'
full_description = "Investigations Gene Hackman and Wife Betsy Arakawa’s Deaths Deemed “Suspicious” in Search Warrant: “No Obvious Sign of a Gas Leak”On Wednesday, Hackman, his wife, and a dog were all found dead in their Santa Fe home. While no foul play was initially suspected, New Mexico authorities have now deemed their deaths “suspicious enough in nature to require a thorough search and investigation.”By Chris MurphyFebruary 27, 2025LOS ANGELES - 1986: Actor Gene Hackman and wife Betsy Arakawa pose for a portrait in 1986 in Los Angeles, California. (Photo by Donaldson Collection/Michael Ochs Archives/Getty Images)Donaldson Collection/Getty ImagesSave this storySaveSave this storySaveThe deaths of Oscar-winning actor Gene Hackman and his wife, classical pianist Betsy Arakawa, have been deemed “suspicious,” according to a search warrant affidavit released Thursday morning.The 95-year-old screen icon, his 65-year-old wife, and one of their dogs were all found dead Wednesday at their home in Santa Fe, New Mexico. Initially, the Santa Fe Sheriff’s Office released a statement saying that it did not suspect foul play in their deaths, though a cause of death had yet to be determined. Now, Variety reports that New Mexico authorities has deemed “the circumstances suspicious enough in nature to require a thorough search and investigation.”According to excerpts from the affidavit published by Variety, when the authorities arrived at Hackman’s property, the front door of the residence was “unsecured and opened.”“The deputies observed a healthy dog running loose on the property, another healthy dog near the deceased female, a deceased dog laying 10–15 feet from the deceased female in a closet of the bathroom, the heater being moved, the pill bottle being opened and pills scattered next to the female, the male decedent being located in a separate room of the residence, and no obvious signs of a gas leak,” the affidavit continued.Arakawa’s body, the affidavit reads, “showed obvious signs of death, body decomposition, bloating in her face and mummification in both hands and feet.” Hackman’s body was reportedly found in the mudroom and also showed ”obvious signs of death, similar and consistent with the female decedent.” The deputy on the scene “suspected the male individual had suddenly fallen” prior to his death. An estimated time of death has not been released for either Hackman or Arakawa.Per Variety, the authorities may search the property as well as the furniture, walls, plumbing equipment, and gas lines in or around the property. “Affiant is aware through training and experience individuals exposed to gas leaks (or poisonous gas) can suffer immediate and unexpected death,” reads the affidavit. Hackman’s daughter, Elizabeth Jean Hackman, reportedly told TMZ that the family currently believes that carbon monoxide poisoning may have played a role in the deaths of her father and his wife.A legendary actor, Hackman won two Oscars over the course of his career: best actor for The French Connection (1971) and best supporting actor for Unforgiven (1992). He married Arakawa in 1991 and officially retired from acting in 2004. Since Hackman’s retirement, the couple had been living full time in their Santa Fe home, reportedly built in 2000.This is a developing story.More Great Stories From Vanity FairYour Invitation to Vanity Fair’s 2025 Oscar PartySee Our Predictions For Every 2025 Oscar WinnerInside the FBI’s Lab Leak InvestigationElon Musk’s 13 Children and Their Mothers (Whom We Know of)Where to Watch Every 2025 Oscar-Nominated MovieAmerica’s Food Safety Is Now in the Hands of Don Jr.’s Hunting BuddyRepublican Congressmen Are “Scared Shitless” of TrumpThe Education—and Anointment—of Barron TrumpMillie Bobby Brown on Stranger Things, Marriage, and Life on the FarmFrom the Archive: Vanity Fair’s Oscar Party Is the Only Place to Be"
