["https://vast.ai/article/deploying-oobabooga-for-running-large-language-models"]
title = "Deploying Oobabooga for Running Large Language Models"
description = "An easy, cost-effective method for deploying LLaMa, GPT-J, Pythia and Falcon"
full_description = "In the rapidly evolving world of machine learning, the ability to leverage powerful computing resources on-demand has become crucial. The need to run large language models such as LLaMA, GPT-J, Pythia, and Falcon has grown more pronounced, as these models are increasingly important in various AI applications. However, these models require significant computational power, typically in the form of high-performance graphics processing units (GPUs). Many of the models require 40+ GB of GPU RAM to load the models. Vast offers on-demand GPU rentals, providing users with the raw power needed to run these models. It's known for being the most cost-effective offering on the market, making it an ideal choice for those who are budget-conscious or just starting out with AI and machine learning. Oobabooga is a web user interface (UI) designed specifically for running large language models. It's simple and intuitive to use, requiring no advanced technical skills or extensive prior knowledge of AI and machine learning. In this post, we will guide you through the process of deploying Oobabooga on Vast, showing you just how easy it is to run large language models on a budget. The first step is to sign up for an account on Vast. You will need to add credits before you can rent. Go to the billing page and choose a payment method. Larger language models will require more expensive GPUs, so be sure to add enough credits. Vast rents out Linux Docker instances on-demand. We have a pre-built Oobabooga template that you will need to load. Load the template by clicking on this link. Underneath the Edit image and config options there is a slider which will allocate storage for your instance. Large language models are typically 70+ GB, so make sure to move the slider to 80 GB so your instance will have enough storage to download the model you want to run. Now comes the fun part! Vast is a marketplace of on-demand cloud GPUs. You can easily select a powerful GPU that supports your selected configuration. Many large language models require the absolute best GPU right now. Read about how much GPU RAM your model needs to run. The top of the line GPU is the A100 SMX4 80GB or A100 PCIE 80GB. To ensure your instance will have enough GPU RAM, use the GPU RAM slider in the interface."
