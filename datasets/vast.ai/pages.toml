["https://vast.ai/article/Rental-Types"]
title = "On Demand vs Interruptible Rental Types"
description = "Here at Vast, we offer both on-demand and interruptible rental options"
full_description = "Here at Vast, we offer both on-demand and interruptible rental options. For most users, the on-demand option provides stable access to the GPU rented for the duration of the rental period. However for advanced users who want to save money and can have their job interrupted, interruptibles are an interesting option. On-demand instances have a fixed price set by the host. The advantage of renting on demand is that you have high priority and gain exclusive control over the GPU(s) for the lifetime of the instance. This duration of time is up to the client, but a maximum duration determined by the host appears on the offer card when searching the marketplace. Once the designated time limit expires, the instance is automatically stopped. You can then copy data off of the stopped instance to a new instance or to your local machine. It is best to assume that your instance will be lost once its lifetime expires, but the host does have the option to renew the contract, adding more lifetime to your instance. Reasons not to do so may include taking the machine offline for scheduled maintenance or upgrades. If you need an instance to run for many days or weeks at a time, such as for larger artificial intelligence or machine learning tasks, ensure that the maximum duration exceeds the estimated job completion time. Another best practice is to select a host with a high reliability score. Our interruptible instances use a direct bidding system to determine priority on a continual basis. This sets Vast.ai apart from others in the field. For instance, although AWS spot instances and GCE interruptible instances can similarly be interrupted by on-demand instances, they do not use a direct bidding system and some will terminate interruptible instances after 24 hours. With Vast.ai, clients set a bid price for their instance, and the current highest bid determines the instance that runs; any others are paused. Higher bids are obviously favored to maximize revenue for hosts, but this system can nonetheless reduce clients’ costs by fifty percent or even more in certain use cases."
year_published = 2025
