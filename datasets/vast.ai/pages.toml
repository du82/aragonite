["https://vast.ai/article/nvidia-rtx-5090-out-by-christmas-rumors"]
title = "NVIDIA RTX 5090: Out by Christmas? A Look at the Latest Rumors"
description = "GPU prices continue to increase, but there exists a happy and unexpected middle ground for AI applications."
full_description = "As the year winds down, rumors are intensifying around NVIDIA's highly anticipated GeForce RTX 5090 GPU. Industry insiders are divided on the release date, with some sources suggesting a launch just in time for Christmas, while other reports point to a formal announcement at CES 2025 in the new year. NVIDIA's CEO Jensen Huang will be hosting the keynote at CES on January 6th, 2025 – which could be the perfect opportunity to launch the full trio of GPUs in the 50-series lineup: the RTX 5090, 5080, and 5070. But it's also possible that the 5090 itself will debut in time for last-minute holiday shopping. The exact timing of the RTX 5090 release may be uncertain, but one thing is clear: NVIDIA's next flagship GPU is poised to redefine performance. Let's take a quick look at the speculation around this next-gen graphics powerhouse and its companions in the new lineup! As we explored in a previous blog post, the flagship consumer-grade RTX 5090 is set to dethrone its predecessor, the RTX 4090, with some truly remarkable upgrades. Here's what the various leaks and rumors suggest: The RTX 5090's little siblings in the 50 series are expected to pack a punch as well, balancing performance and cost for those who may want to upgrade without breaking the bank. The RTX 5080 will likely be an excellent option for anyone needing a high-performance GPU without going all-in on the 5090. In fact, it reportedly could be even more powerful than initially expected. Rumors suggest it will feature a 32Gbps memory speed – instead of the previously reported 28Gbps – and a maximum bandwidth of 1024GB/s rather than 896GB/s. If these specs turn out to be true, then the RTX 5080 could outperform the RTX 4090 while also being more power-efficient, making it an exciting contender for high-performance users. To round out the rumored details, the 5080 will reportedly feature a 256-bit memory bus with 16GB of GDDR7 VRAM, around 10,000 CUDA cores, and 400W power consumption. Finally, the RTX 5070 will serve as a mid-range option without the extreme capabilities of the 5090 or 5080. It's rumored to offer a 192-bit memory bus with 12GB of GDDR7 VRAM (to the consternation of some who feel 12GB is surprisingly low), around 6,400 CUDA cores, plus 250W power consumption."
