title = "NVIDIA GeForce RTX 5090: Release Announced"
description = "NVIDIA has officially unveiled the GeForce RTX 5090, the latest in its groundbreaking lineup of GPUs."
full_description = "NVIDIA has officially unveiled the GeForce RTX 5090, the latest in its groundbreaking lineup of GPUs. The release date for this highly anticipated graphics card has been set for January 30, 2025, with availability expected alongside the RTX 5080, while the RTX 5070 Ti and RTX 5070 will follow in February. During his CES keynote yesterday, NVIDIA CEO Jensen Huang introduced the RTX 5090 with a bold claim: the GPU is two times faster than the RTX 4090, thanks to DLSS 4 and the Blackwell architecture. But that's just the beginning. Here are a few of the official specifications for the long-awaited RTX 5090 (see more at the bottom of this page!): In addition to a massive performance boost, the RTX 5090 features a redesigned Founders Edition with two double flow-through fans and a 3D vapor chamber, making it sleek enough to fit into small form factor PCs – a surprising change from the bulky RTX 4090. These specs establish the RTX 5090 as the ultimate tool for gamers, creators, and professionals who demand peak performance. The younger siblings in the 50-series lineup – the RTX 5080, RTX 5070 Ti, and RTX 5070 – will also deliver outstanding capabilities: All three serve as excellent choices for those seeking high performance without committing to the premium price of the flagship model. – which brings us to the cost of these GPUs... The RTX 5090 will debut at $1,999 and will hit shelves on January 30, 2025, alongside the RTX 5080 priced at $999. The RTX 5070 Ti and RTX 5070, priced at $749 and $549 respectively, will launch in February. With this lineup, NVIDIA is offering a range of options to meet different performance needs and budgets. Let's take a look at what else sets the RTX 50-series apart from its predecessors. During his keynote speech, Huang showcased the RTX Blackwell GPUs with an impressive real-time rendering demo that highlighted the latest advancements. The demonstration featured RTX Neural Materials, RTX Neural Faces, text-to-animation capabilities, and DLSS 4 in action."
