full_description = '''« Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Celebrate World Ranger Day 2014 » Jul 14 A home away from home in Lombok, Indonesia Categories: Indonesia, Stories from the Field by mark In our latest vEcotour experience Dr. Helena Baird’s beautiful “home away from home” in Indonesia as she volunteers with vEcotourism’s partner, marine protection organisation JARI “Volunteering in a developing country is more than just the work itself” Helena explains, “it’s an entirely immersive, challenging and uplifting experience. I have almost been in Indonesia for six months now, so thought I’d give you a taste of my “home away from home” here on Lombok. As you’ll see it’s quite beautiful, but it certainly has its quirks…and it couldn’t be more dissimilar to my home in Tasmania!” So click on the image above or map below to start your tour. Find out how Helena is adjusting to living in Indonesia and discover the various residents, human and otherwise, with whom she shares her home. To find out more about JARI, please visit their website www.jari.or.id and Facebook page www.facebook.com/supportingsustainableseas This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); 1 ping Home Quirky Home | Life on Lombok August 9, 2014 at 11:15 am (UTC 0) Link to this comment Reply […] http://www.vecotourism.org/news/ahomefromhome/ […] Leave a Reply Cancel replyYour email address will not be published. Requir