full_description = "Category Archive: Kahuzi-Biega National Park Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William … Continue reading » This post has no tag Leave comment Dec 21 Don’t miss “Gorilla Family & Me” on BBC Two later today! Categories: Africa, BBC, DRC, Eastern Lowland Gorillas, Featured Species, Kahuzi-Biega National Park by mark Wildlife cameraman Gordon Buchanan visits our friend Chimanuka the Silverback in Kahuzi-Biega National Park in the BBC Two series that begins broadcasting today. Accompany Gordon as he attempts to gain the trust of Chimanuka and map the power dynamics at play among these gentle giants. Breaking new ground for vEco, the BBC has linked to our … Continue reading » This post has no tag Leave comment Nov 09 Meet the Chimanuka gorilla family of Kahuzi-Biega National Park, DRC Categories: Africa, DRC, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Kahuzi-Biega National Park, vEcotours by mark Where do the biggest gorillas in the world live? It is well known that gorillas are the largest primate (except for a few very large humans) but we can now take you – virtually – to the only place in the world where you can find the biggest gorilla sub-species, the Eastern Lowland or Grauer’s … Continue reading » This post has no tag Leave comment Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News