["http://www.vecotourism.org/news/get-ready-for-the-kwita-izina-gorilla-naming-celebrations-in-kinigi-rwanda-with-vecotourism-org"]
title = "Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org » Virtual Ecotourism"
full_description = '''« Get up close and personal with wild red colobus monkeys on Zanzibar A home away from home in Lombok, Indonesia » Jun 30 Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Categories: Africa, Conservation Tools, News, Rwanda, Stories from the Field, Team vEco, vEcotours, Volcanoes National Park by mark On 1st July 2014 Rwanda will host the tenth annual ‘Kwita Izina’, a gorilla naming ceremony for each born in the Volcanoes National Park during the year! This year, if you are not able to attend, take a guided virtual tour (vEcotour) with primate expert Ian Redmond during last year’s event when he was given an all-access pass to this unique celebration! “There is so much dismal news in conservation it is wonderful to have something to celebrate! Each year there are a few more mountain gorillas than the year before (the only ape we can say that about) and Rwanda celebrates this success in style at their annual gorilla naming ceremony, the Kwita Izina.” vEcotourism ambassador Ian Redmond explains. Last year I was privileged to be given an access-all-areas pass, so on the occasion of the 10th Kwita Izina this year, if you can’t be in Kinigi in person, join me virtually to share the excitement of this unique event – a cross between Glastonbury, an African folk festival, a political rally and a conservation knees-up!” Join the festivities and start your Kwita Izina experience with Ian by clicking on the image above or the map below! In 2014, 18 baby mountain gorillas will be named and two of them are from the Susa group. You can get up close and personal with the Susa group in our recent vEcotour, guided by Ian Redmond. Click here to start your trek. Kwita Izina 10 is being hosted by Rwanda Development Board (RDB), for more information visit www.rdb.rw/kwitizina This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s);