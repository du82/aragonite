title = "mark » Virtual Ecotourism"
full_description = '''Mark Author's details Name: Mark Laxer Date registered: January 16, 2011 Latest posts Ian Redmond reacts to the WWF Report on Sky News — November 2, 2018 Introducing vEco Labs! — March 13, 2018 vEcotourism at UN CMS CoP12 in the Philippines — November 21, 2017 vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! — September 20, 2017 Marching for an end to the domestic ivory trade in the UK — February 7, 2017 Most commented posts Welcoming Helena Baird to the JARI team — 6 commentsLunch-Break vEcoLive: Meet the Salt-Mining Elephants of Kitum Cave, Kenya! — 6 commentsPresenting vEco’s first blogger: Mark O! — 4 commentsvEco needs Volunteers! — 3 commentsDigital Media & Learning Competition — 2 comments (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Author's posts listings May 09 Last resort: rescuing an orangutan from its natural habitat Categories: Indonesia by mark A recent article from Lucy Radford, Development Officer at Barbary Macaque Awareness & Conservation, provides a moving account of her trek through fragmented forest in Langkat, North Sumatra. Supported by stunning photography from wildlife photographer Andrew Walmsley, Lucy outlines the plight of wildlife that is being squeezed into smaller and smaller areas as oil palm … Continue reading » This post has no tag Leave comment May 06 Introducing Andrina Murrell: getting the word out for vEco Categories: News, Team vEco by mark Hi there vEco followers! My name is Andrina Murrell and I have been tasked with the exciting job of telling the world about vEcotourism and our vision to bring interactive and immersive experiences of wild places to everyone. Having spent several years working within conservation and wild animal welfare (that’s me in Ethiopia in the … Continue reading » This post has no tag 1 comment Apr 29 Welcoming Helena Baird to the JARI team Categories: Indonesia, News, Stories from the Field, Team vEco, vEcotours by mark vEcotourism.org is very happy to welcome experienced marine ecologist and Australian Volunteer for International Development (AVID) volunteer Dr. Helena Baird to the team at JARI, vEco’s partner in Indonesia. With conservation project experience in places as diverse as the Bahamas, Zimbabwe and Antarctica, Helena will be working with JARI to implement marine education opportunities, working … Continue reading » This post has no tag 6 comments Apr 23 vEcotourism needs your help! Categories: Internet Technology, New Media, Team vEco, vEconauts, vEcotours by mark Would you like to get a sneak peek at vEco’s latest and greatest innovations? Become a vEconaut! We need your help to test out the freshest content from vEcotourism.org. As a vEconaut, you will help vEcotourism to ensure it produces the best, bug-free vEcotours, bringing immersive and interactive experiences of amazing places and wildlife around … Continue reading » This post has no tag Leave comment Apr 11 Scrambling up the Albertine Escarpment, Uganda Categories: Africa, Mark O's blog, Uganda, vEcotours by mark Today we are travelling to the Albertine Graben region in the East African Rift Valley. I visited this area to perform an environmental impact assessment (EIA) for the Chinese oil giant, CNOOC, as the Rift Valley is thought to contain large amounts of natural gas and oil. To access the site I had to climb … Continue reading » This post has no tag 1 comment Mar 21 Experience the roar of the magnificent Murchison Falls, Uganda Categories: Africa, Murchison Falls National Park, Uganda by mark In December 2013 I travelled to the remarkable Murchison Falls, also known as Kabalega Falls, in north west Uganda. Located within Uganda’s largest protected area, the Murchison Falls National Park, the area is characterised by green, pristine vegetation scattered with diverse wildlife. You can join me on my travels through this vEcotour; experience the thunderous … Continue reading » Tags: buffalo, elephants, Murchison Falls, Nile, Uganda, vEcotourism, virtual ecotourism Leave comment Mar 06 Creating vEcotours with the Born Free Foundation team Categories: News, Panoramic, Team vEco, vEcotours by mark vEcotourism’s Ian and Matt Redmond were delighted to drop by the offices of their long-standing supporters at the Born Free Foundation in order to provide a hands-on workshop in virtual tour construction. After providing inspirational insights into vEcotourism and its potential, Ian challenged the Born Free team to create a pano of the Born Free … Continue reading » This post has no tag Leave comment Mar 03 Celebrate World Wildlife Day! Categories: News by mark It’s World Wildlife Day! A day to celebrate and raise awareness of the world’s wild fauna and flora. Announced by the UN, the day coincides with the adoption of the Convention on International Trade in Endangered Species of Wild Fauna and Flora (CITES). Andrina Murrell, Communications Director for vEcotourism.org explains, “vEcotourism.org is really pleased to be celebrating … Continue reading » This post has no tag Leave comment Feb 27 Take a walk on the rocky side at Green Point, Canada Categories: North America, Panoramic, vEcotours by mark Canada’s Gros Morne park, on the comparatively sheltered Western coast of Newfoundland, is a geology lover’s paradise and a designated UNESCO natural world heritage site. From precipitous land-locked fjords to the curiously sterile exposed mantle of the Tablelands formation, this is a wild landscape and one that is home to a unique mixture of boreal, … Continue reading » This post has no tag Leave comment Feb 17 vEco’s gift to you: the view of a lifetime! Categories: Africa, Uganda by mark To say thank you for the enthusiastic reception and all the fantastic feedback that vEcotourism.org has recently received, we wanted to give something back! Just like vEco Ambassador Ian Redmond, you too can enjoy the spectacular view over the hills on the southern edge of Bwindi Impenetrable National Park, Uganda. Simply click on the image or links below … Continue reading » This post has no tag Leave comment Older posts « » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Inter