llas, News, Panoramic, Rwanda, vEcotours, Volcanoes National Park by mark Sidle up to one of our world’s greatest living wonders: a group of mighty mountain gorillas browsing and playing in their natural habitat on Mount Karisimbi, Rwanda. Our latest vEcotour features 360 degree images, ambient background sounds, and embedded videos, all captured by our vEco Ambassador and great ape expert, Ian Redmond. Mount Karisimbi, a … Continue reading » This post has no tag 2 comments Feb 04 Mobile Clinic arrival marks a special day for the Kibale Health and Conservation Project, Uganda Categories: Africa, Conservation Tools, Kibale, News, Uganda by mark Today represents a fantastic result for vEcotourism Project Advisors Dr.’s Colin and Lauren Chapman; a long-awaited mobile clinic van for Kibale National Park has finally arrived in Uganda. The Kibale Health and Conservation Project, founded by the couple, works to to provide health care to the local communities surrounding Kibale National Park as well as … Continue reading » This post has no tag Leave comment Jan 17 Palm oil company hit with momentous fine for destruction of key orangutan habitat Categories: Indonesia, News by mark An Indonesian company has been ordered to pay US$30 million to the state for illegally clearing 1,000 hectares (2,500 acres) of the Tripa Peatland Swamp Forest in Aceh province, Sumatra. The historic fine was imposed after PT Kallista Alam was found in breach of Indonesian National Law for the “illegal use of fire to clear … Continue reading » This post has no tag Leave comment Nov 15 Good news for Orangutans! Categories: Conservation Tools, Indonesia, News by mark Thanks in large part to fierce protest on the part of consumers concerned with non-sustainable palm oil, the food giant Ferrero has announced that it will be obtaining 100% of its palm oil from traceable segregated, RSPO-certified sources by the end of 2014, a full year ahead of its previously announced schedule. Ferrero, which manufactures … Continue reading » This post has no tag 2 comments Oct 08 Great Apes Summit Delegates Issue Statement on Palm Oil Categories: Africa, Indonesia, News by mark Meeting this past September in Jackson Hole, Wyoming, the Great Apes Summit Delegates drafted a list of six key action points in the face of the rapid and under-regulated expansion of oil palm plantations across Asia and Africa. The action points target all levels of the oil palm industry, from governments to consumers, in hopes … Continue reading » This post has no tag Leave comment Oct 07 Team Uganda Reunited Categories: Africa, Team vEco, Uganda by mark vEco’s globetrotting ambassador, Ian Redmond (pictured on the right), met up with two of vEco’s most dedicated collaborators this past weekend: Jackson Efitre (center, Lecturer at the Department of Biological Sciences, Makerere University) and Mark Olokotum (left, M.Sc. student at Makerere University and Research Assistant with NaFIRRI-Jinja). The trio then met up with The Gorilla … Continue reading » This post has no tag 1 comment Oct 02 iOS support in the pipeline Categories: Internet Technology, News, vEcotours by mark Apple devotees, fear not. Support for iOS devices is nearly here! While the vEcotour experience will necessarily be slightly different on iPhones and iPads than on PCs and Macs (for example, iOS only allows one sound file to be played at a time), we’re doing our best to ensure that our tours will be worth … Continue reading » This post has no tag Leave comment Oct 01 Four Africans, Indonesians honoured with the GRASP-Ian Redmond Conservation Award Categories: Africa, Indonesia, News, Team vEco by mark Created to encourage innovation, build partnerships, inspire leadership, and offer hope in the field of great ape conservation, the GRASP-Ian Redmond Conservation Award was given to four dedicated individuals September 22nd at the Great Apes Summit in Jackson Hole, USA. The four winners were: Panut Hadisiswoyo from Indonesia, who works to