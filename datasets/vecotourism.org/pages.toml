o Uganda to meet with local people – including virtual ecotourism guides Jackson & Mark O. – and experienced first-hand the struggle and controversy surrounding dangerous animals of conservation importance. Tags: human-wildlife conflict, ishasha, lions, mark laxer Leave comment Nov 20 Digital Media & Learning Competition Categories: Internet Technology, New Media, News by mark The Virtual Ecotourism project has entered the Digital Media & Learning Badges Competition in a bid to win part of a $200,000 grant for the development of a badging system to reward on-line learning that is difficult to assess in other ways. Tags: badges, digitial learning, hastac 2 comments Nov 20 The Monkey Bible Categories: News by mark Chimp-n-Sea’s Virtual Ecotourism project is described in Mark Laxer’s recently released book, The Monkey Bible! Tags: books, chimp-n-sea, mark laxer, virtual ecotourism Leave comment Nov 07 Welcome to the vEcotourism News Site! Categories: Internet Technology, New Media, News by mark The aim of this blog is to keep virtual ecotourists, partner organizations, and curious conservationists updated about the vEcotourism project. It will outline our current work, showcase initial vEcotours as they are developed, link to exciting upcoming technologies, promote conservation projects, host visual media from tours, and serve to keep the vEcotourism community informed and connected. To learn more about … Continue reading » Tags: conservation, New Media, virtual ecotourism Leave comment » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search'''
