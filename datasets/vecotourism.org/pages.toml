full_description = "Category Archive: Mountain Gorillas Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … Continue reading » This post has no tag 2 comments Sep 15 London’s Great Gorilla Run 2017! Categories: Africa, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Mountain Gorillas, Team vEco by Ian Redmond There are fun runs and then there is the GREAT GORILLA RUN — more fun for a good cause than any other event in conservation! At least that is what British comedian and TV naturalist Bill Oddie says. Tomorrow, Saturday 16th September, the 15th Great Gorilla Run will see hundreds of people dressed as gorillas, with … Continue reading » This post has no tag Leave comment Nov 16 Praise for vEcotourism.org from the United Nations’ Great Apes Surival Partnership! Categories: Bonobos, Bornean Orangutans, Chimpanzees, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Internet Technology, Mountain Gorillas, News, Sumatran Orangutans, UN-GRASP by mark Some very kind words about vEco from Doug Cress, Programme Coordinator for the United Nations’ Great Apes Survival Partnership! If you’ve got a VR headset, give apeAPP VR a spin on your Android or Apple smartphone 🙂 http://www.un-grasp.org/vr/ This post has no tag Leave comment May 12 Welcome, BBC Earth Readers! Categories: Africa, Featured Species, Mountain Gorillas, Rwanda, vEcotours by mark Our Ambassador, Ian Redmond, remembers the mountain gorillas that famously interacted with Sir David Attenborough in the landmark television series ‘Life on Earth‘ for a new article for BBC Earth. Ian recalls introducing the BBC film crew to two of the gorilla groups being studied by Dian Fossey, while he was working as her research … Continue reading » Tags: BBC, BBC Earth, David Attenborough, Dian Fossey, Ian Redmond, Life on Earth, Susa, The Karaoke Research Centre Leave comment Oct 13 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 2 Categories: Africa, DRC, Featured Species, Mountain Gorillas, vEcoLive, Virunga National Park by mark Join host Ian Redmond for part two of our virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! This week, we will take you behind-the-scenes of the world’s only orphanage for mountain gorillas, the Senkwekwe Centre, where you will meet André Bauma, one of the heroes … Continue reading » This post has no tag Leave comment Oct 05 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 1 Categories: Africa, DRC, Mountain Gorillas, Rwanda, vEcoLive, Virunga National Park, Volcanoes National Park by mark Join host Ian Redmond on a virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! The tour will trace the story of European interaction with these gentle giants, beginning with the dizzying heights of Mount Sabinyo, pausing in a misty glade to pay our respects at Dian Fossey’s grave, … Continue reading » This post has no tag Leave comment Feb 10 Experience the fascinating world of the Susa gorilla group in Rwanda, guided by great ape expert Ian Redmond Categories: Africa, Featured Species, Mountain Gorillas, News, Panoramic, Rwanda, vEcotours, Volcanoes National Park by mark Sidle up to one of our world’s greatest living wonders: a group of mighty mountain gorillas browsing and playing in their natural habitat on Mount Karisimbi, Rwanda. Our latest vEcotour features 360 degree images, ambient background sounds, and embedded videos, all captured by our vEco Ambassador and great ape expert, Ian Redmond. Mount Karisimbi, a … Continue reading » This post has no tag 2 comments Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
