full_description = "Category Archive: Indonesia Oct 01 Four Africans, Indonesians honoured with the GRASP-Ian Redmond Conservation Award Categories: Africa, Indonesia, News, Team vEco by mark Created to encourage innovation, build partnerships, inspire leadership, and offer hope in the field of great ape conservation, the GRASP-Ian Redmond Conservation Award was given to four dedicated individuals September 22nd at the Great Apes Summit in Jackson Hole, USA. The four winners were: Panut Hadisiswoyo from Indonesia, who works to address human-orangutan conflict issues in … Continue reading » This post has no tag Leave comment Sep 21 Eight new vEcotours to explore! Categories: Africa, Indonesia, vEcotours by mark In a push to give you, the public, a bit more to chew on as we continue to develop the technical side of vEcotourism.org, we’ve put eight new vEcotours online. The new sites range from the lofty heights of Mt Sabinyo in Uganda to deck-level on a fishing boat in Saleh Bay, Indonesia. Click on … Continue reading » This post has no tag Leave comment May 12 Underwater vEcotours on the distant horizon Categories: Indonesia by mark vEcotourism’s parent organisation, Chimp-n-Sea, is proud to announce the addition of a 51′ foot boat, Yosina, to the conservation team. Chimp-n-Sea co-founders Mark Laxer and Sara Lourie recently spent 5 1/2 weeks in Indonesia working with the Jari Foundation, a local NGO, on a plan for marine conservation and local education. Long-term projects may involve … Continue reading » This post has no tag 2 comments » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to