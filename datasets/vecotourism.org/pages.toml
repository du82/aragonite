title = "Salt-Mining Elephants of Mount Elgon » Virtual Ecotourism"
full_description = '''↑ Return to Take A Tour Salt-Mining Elephants of Mount Elgon Our latest vEcotour has more depth than ever, literally! Venture nearly 200m or 650 ft deep into Kitum Cave where you’ll cross paths with the world’s only “Troglodyte Tuskers”! All three species of elephant – the African Savannah Elephant, the African Forest Elephant and the Asian Elephant – are endangered. They are killed for their front teeth for the ivory trade and trophies. Their babies are stolen to be cruelly trained for rides and tourist photos. Their habitat is being destroyed for agriculture, mines, buildings and roads. But if everyone understood how important elephants are to maintaining the ecosystems that sustain us all, perhaps we would value them as the biggest and most important #GardenersoftheForest. Elephants disperse more seeds of more species of tree than any other animal – every day they sow the seeds of the trees of tomorrow, trees that we need to soak up carbon and prevent dangerous climate change; moreover, each elephant produces about one tonne of manure per week enriching the soil; they dig waterholes, create long-distance footpaths and excavate mineral-rich salt-licks that benefit other animals. And on Mount Elgon in Kenya, the world’s only troglodyte tuskers go deep underground… yes, underground, deep into the dark zone of caves, beneath bats roosting overhead, feeling their way with trunk outstretched like a blind person with a cane. To find out why and how, join host Ian Redmond as he guides you through an immersive 360-degree tour of this unique location! Start your tour here! (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d