title = "Experience the fascinating world of the Susa gorilla group in Rwanda, guided by great ape expert Ian Redmond » Virtual Ecotourism"
full_description = '''« Mobile Clinic arrival marks a special day for the Kibale Health and Conservation Project, Uganda Presenting vEco’s first blogger: Mark O! » Feb 10 Experience the fascinating world of the Susa gorilla group in Rwanda, guided by great ape expert Ian Redmond Categories: Africa, Featured Species, Mountain Gorillas, News, Panoramic, Rwanda, vEcotours, Volcanoes National Park by mark Sidle up to one of our world’s greatest living wonders: a group of mighty mountain gorillas browsing and playing in their natural habitat on Mount Karisimbi, Rwanda. Our latest vEcotour features 360 degree images, ambient background sounds, and embedded videos, all captured by our vEco Ambassador and great ape expert, Ian Redmond. Mount Karisimbi, a dormant volcano, is part of the Virunga Mountains which straddle the borders of Rwanda, Uganda and the Democratic Republic of Congo (DRC). Karisimbi is home to diverse wildlife, including a significant population of the critically endangered mountain gorilla, and encompasses a wide variety of vegetation zones including the bamboo forests and hagenia forest which characterise the high-elevation Afromontane regions of central and eastern Africa. Immerse yourself in prime gorilla habitat and, with expert narration from Ian Redmond, experience awesome silverbacks jostling for position, meet the only other nonhuman primate in the National Park and delight in young gorillas frolicking in a bamboo grove. Begin your trek by clicking here or on the image above! To explore two other vEcotours from the same part of the world, click here or select the “Virunga Mountains & Mountain Gorillas” page from the “Take a tour” menu. Lastly, If you would like to keep up with the latest vEcotours and news, make sure you follow us on Twitter as well as on our brand new Facebook page! This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src =