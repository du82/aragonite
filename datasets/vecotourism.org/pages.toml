full_description = "Category Archive: vEcotours Nov 21 vEcotourism at UN CMS CoP12 in the Philippines Categories: Conservation Tools, Elephants, Internet Technology, News, vEcotours by mark Virtual reality experiences of nature were a highlight for some delegates and volunteers at the United Nations Convention on the Conservation of Migratory Species meeting in Manila recently. The 12th Conference of the Parties to the CMS, hosted by the Government of the Philippines, brought together delegates and observers from the 124 signatory countries and … Continue reading » This post has no tag Leave comment Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … Continue reading » This post has no tag 2 comments Dec 01 Virtual field trip with vEcotours Categories: Conservation Tools, vEcotours by mark vEcotours has entered the classroom once again, this time taking children from Walmore Hill Primary School in Gloucestershire, England on a virtual safari. Our ambassador, naturalist Ian Redmond OBE, gave a natural history lesson to pupils, who were encouraged to think about elephants and what it may be like to be one. In a workshop … Continue reading » Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR Leave comment Aug 12 Welcome National Geographic Readers! Categories: Kenya, Mount Elgon National Park, vEcotours by mark vEcotours Ambassador Ian Redmond re-lives the moment he was charged by a four-tonne elephant in a new article for National Geographic. “There is some irony in this – that the person who coined the term ‘elefriends’ should be trampled by a decidedly unfriendly elephant – but I’m pretty sure it wasn’t personal,” Ian jokes, as … Continue reading » This post has no tag 1 comment Aug 08 Teaching school students with vEco virtual reality Categories: Kenya, Mount Elgon National Park, vEcotours by mark Here at vEcotours, we’ve taken our first leap into the classroom, trialling a new “kid’s version” of our Mount Elgon virtual reality tour for a special lesson at Cambridge Elementary School, Vermont. The demo used our new app, which is available for both iOS and Android, with a special new narration, voiced by youngsters Erica and … Continue reading » Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR Leave comment May 12 Welcome, BBC Earth Readers! Categories: Africa, Featured Species, Mountain Gorillas, Rwanda, vEcotours by mark Our Ambassador, Ian Redmond, remembers the mountain gorillas that famously interacted with Sir David Attenborough in the landmark television series ‘Life on Earth‘ for a new article for BBC Earth. Ian recalls introducing the BBC film crew to two of the gorilla groups being studied by Dian Fossey, while he was working as her research … Continue reading » Tags: BBC, BBC Earth, David Attenborough, Dian Fossey, Ian Redmond, Life on Earth, Susa, The Karaoke Research Centre Leave comment May 09 vEco launches VR app in partnership with UNEP-GRASP Categories: Conservation Tools, Internet Technology, News, vEcotours by mark vEcotourism.org is both proud and incredibly excited to be launching our first virtual reality mobile app in partnership with the United Nations Environment Programme – Great Apes Survival Partnership (UNEP-GRASP) and the Ape Alliance: apeAPP VR! The app, which will be available on both Android and iOS smartphones, will offer immersive tours of all great ape … Continue reading » Tags: app, GRASP, great apes, vEco, vEcotours, VR 1 comment Apr 22 Virtual reality natural history — a sign of the future! Categories: Internet Technology, Team vEco, vEcotours by mark What equipment does a naturalist usually need? vEco’s Adviser and Ambassador (and renowned wildlife biologist and conservationist) Ian Redmond suggests a pair of binoculars and a hand lens, but — as he explains in this short video — soon, a virtual reality headset could also be a vital piece of equipment! It’s a positive movement; that … Continue reading » Tags: AR, conservation, eco, equipment, field biologist, gadgets, headset, Ian Redmond, natural history, naturalist, technology, vEco, vEcotourism, vEcotours, Virtual reality, VR Leave comment Nov 09 Meet the Chimanuka gorilla family of Kahuzi-Biega National Park, DRC Categories: Africa, DRC, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Kahuzi-Biega National Park, vEcotours by mark Where do the biggest gorillas in the world live? It is well known that gorillas are the largest primate (except for a few very large humans) but we can now take you – virtually – to the only place in the world where you can find the biggest gorilla sub-species, the Eastern Lowland or Grauer’s … Continue reading » This post has no tag Leave comment Dec 24 Behind the scenes at the world’s only mountain gorilla orphanage Categories: Africa, DRC, vEcotours, Virunga National Park by mark Just in time for Christmas, the vEco team is delighted to bring you this three-panorama virtual tour of the world’s only mountain gorilla orphanage, the Senkwekwe Center located at the headquarters of the Virunga National Park in Rumangabo, Democratic Republic of the Congo. This post has no tag Leave comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
