title = "Announcing Gorilla Safari VR » Virtual Ecotourism"
full_description = '''« Virtual field trip with vEcotours Marching for an end to the domestic ivory trade in the UK » Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William Award for Conservation in Africa, and then we leap over 6000km to join the Easter Lowland Gorilla patriarch, Chimanuka, in his native habitat in Kahuzi-Biega National Park in the Democratic Republic of the Congo. This app works with both phones and tablets and with or without a virtual reality headset. Enjoy your Gorilla Safari! To learn more about John Kahekwa and his community-based conservation initiative, the Pole Pole Foundation, click here. To support Born Free and Pole Pole’s conservation efforts, join Born Free’s Adopt-A-Gorilla program! This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <de