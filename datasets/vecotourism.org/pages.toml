full_description = "Category Archive: Internet Technology Nov 21 vEcotourism at UN CMS CoP12 in the Philippines Categories: Conservation Tools, Elephants, Internet Technology, News, vEcotours by mark Virtual reality experiences of nature were a highlight for some delegates and volunteers at the United Nations Convention on the Conservation of Migratory Species meeting in Manila recently. The 12th Conference of the Parties to the CMS, hosted by the Government of the Philippines, brought together delegates and observers from the 124 signatory countries and … Continue reading » This post has no tag Leave comment Nov 16 Praise for vEcotourism.org from the United Nations’ Great Apes Surival Partnership! Categories: Bonobos, Bornean Orangutans, Chimpanzees, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Internet Technology, Mountain Gorillas, News, Sumatran Orangutans, UN-GRASP by mark Some very kind words about vEco from Doug Cress, Programme Coordinator for the United Nations’ Great Apes Survival Partnership! If you’ve got a VR headset, give apeAPP VR a spin on your Android or Apple smartphone 🙂 http://www.un-grasp.org/vr/ This post has no tag Leave comment May 09 vEco launches VR app in partnership with UNEP-GRASP Categories: Conservation Tools, Internet Technology, News, vEcotours by mark vEcotourism.org is both proud and incredibly excited to be launching our first virtual reality mobile app in partnership with the United Nations Environment Programme – Great Apes Survival Partnership (UNEP-GRASP) and the Ape Alliance: apeAPP VR! The app, which will be available on both Android and iOS smartphones, will offer immersive tours of all great ape … Continue reading » Tags: app, GRASP, great apes, vEco, vEcotours, VR 1 comment Apr 22 Virtual reality natural history — a sign of the future! Categories: Internet Technology, Team vEco, vEcotours by mark What equipment does a naturalist usually need? vEco’s Adviser and Ambassador (and renowned wildlife biologist and conservationist) Ian Redmond suggests a pair of binoculars and a hand lens, but — as he explains in this short video — soon, a virtual reality headset could also be a vital piece of equipment! It’s a positive movement; that … Continue reading » Tags: AR, conservation, eco, equipment, field biologist, gadgets, headset, Ian Redmond, natural history, naturalist, technology, vEco, vEcotourism, vEcotours, Virtual reality, VR Leave comment Mar 16 vEco integrated with UN-GRASP’s new website! Categories: Conservation Tools, Internet Technology, News by mark vEcotourism.org is proud and delighted to announce a major project milestone: we’re now integrated into the United Nations Great Apes Survival Partnership’s (UN-GRASP’s) new website! Click on any of the great ape’s species pages and you can now enjoy virtual tours of each great ape’s habitat while learning about keeping abreast of GRASP’s conservation programs … Continue reading » This post has no tag Leave comment Mar 03 #seriousaboutwildlifecrime Categories: Conservation Tools, Internet Technology, News by mark The theme of this year’s UN World Wildlife Day, on 3rd March, is being #seriousaboutwildlifecrime and the UN-Great Apes Survival Partnership (UN-GRASP) has released a new video, which will be screened at the UN in New York, on the illegal trade in ape infants. This post has no tag Leave comment Apr 23 vEcotourism needs your help! Categories: Internet Technology, New Media, Team vEco, vEconauts, vEcotours by mark Would you like to get a sneak peek at vEco’s latest and greatest innovations? Become a vEconaut! We need your help to test out the freshest content from vEcotourism.org. As a vEconaut, you will help vEcotourism to ensure it produces the best, bug-free vEcotours, bringing immersive and interactive experiences of amazing places and wildlife around … Continue reading » This post has no tag Leave comment Oct 02 iOS support in the pipeline Categories: Internet Technology, News, vEcotours by mark Apple devotees, fear not. Support for iOS devices is nearly here! While the vEcotour experience will necessarily be slightly different on iPhones and iPads than on PCs and Macs (for example, iOS only allows one sound file to be played at a time), we’re doing our best to ensure that our tours will be worth … Continue reading » This post has no tag Leave comment Mar 09 vEco at the Digital Media and Learning Badges Competition Categories: Internet Technology, News, Team vEco by alexandra “Learning happens everywhere and at every age” In this spirit, Virtual Ecotourism participated in the 4th Digital Media and Learning Competition for the first time last week. By recognising and promoting non–traditional learning in the 21st century, this competition brought together designers, entrepreneurs, technologists and educators with leading business and industry organizations to build … Continue reading » This post has no tag 1 comment Feb 28 Virtual Ecotourism gets a makeover Categories: Internet Technology, News by alexandra Over the next weeks vEco will be revamping our logo and site design to improve your interactive experience. We are excited about this evolution and have many stimulating projects in the works for 2012. Watch this space! Tags: New Media, website design Leave comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
