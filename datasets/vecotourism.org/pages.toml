full_description = '''Take A Tour As we continue to develop the vEco technologies and interface, we’ll be producing a series of showcase vEcotours so that our partners and the public can see what we’re working on and provide us with invaluable feedback. (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Global Overview From this global perspective you may explore vEcotours from four continents (and counting!). Every vEcotour features an immersive full-sphere panorama and a voiced introduction. In addition, some of the tours also feature close-up photos, embedded videos and audio, and interviews to enrich the experience. Click on a location pin, or a cluster of pins, to … View page » QENP Transect This is a private development page hosting the raw panoramas for the Queen Elizabeth National Park (and environs) vEcotours, collected by Ian Redmond and Mark Olokotum in July of 2012. There are a total of 57 panos linked here, from Mgahinga in the South to the Kazinga Channel in the North. Locations are approximate. Most … View page » Queen Elizabeth National Park — Craters Tour Welcome to this virtual tour of Queen Elizabeth National Park (QENP) in Southwestern Uganda. QENP is one of the oldest and most scenically beautiful protected areas in Africa. If Uganda is the ‘Pearl of Africa’ (as Sir Winston Churchill once famously quipped), QENP must be the Pearl of Uganda. This huge park lies across the … View page » Salt-Mining Elephants of Mount Elgon Our latest vEcotour has more depth than ever, literally! Venture nearly 200m or 650 ft deep into Kitum Cave where you’ll cross paths with the world’s only “Troglodyte Tuskers”! All three species of elephant – the African Savannah Elephant, the African Forest Elephant and the Asian Elephant – are endangered. They are killed for their … View page » Sumatran Orangutans Welcome! You’re about to embark on a one-of-a-kind virtual tour of one of the most remote, and threatened, habitats on Earth: the home of the critically endangered Sumatran Orangutan. Join us as we visit a jungle feeding platform where ecotourists encounter wild Orangutans, get a first-hand look at the Tripa peat swamps where palm oil … View page » Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar U