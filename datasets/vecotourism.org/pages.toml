full_description = "Category Archive: BBC Dec 21 Don’t miss “Gorilla Family & Me” on BBC Two later today! Categories: Africa, BBC, DRC, Eastern Lowland Gorillas, Featured Species, Kahuzi-Biega National Park by mark Wildlife cameraman Gordon Buchanan visits our friend Chimanuka the Silverback in Kahuzi-Biega National Park in the BBC Two series that begins broadcasting today. Accompany Gordon as he attempts to gain the trust of Chimanuka and map the power dynamics at play among these gentle giants. Breaking new ground for vEco, the BBC has linked to our … Continue reading » This post has no tag Leave comment Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet