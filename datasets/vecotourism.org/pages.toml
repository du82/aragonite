full_description = "Category Archive: Virunga National Park Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … Continue reading » This post has no tag 2 comments Oct 13 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 2 Categories: Africa, DRC, Featured Species, Mountain Gorillas, vEcoLive, Virunga National Park by mark Join host Ian Redmond for part two of our virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! This week, we will take you behind-the-scenes of the world’s only orphanage for mountain gorillas, the Senkwekwe Centre, where you will meet André Bauma, one of the heroes … Continue reading » This post has no tag Leave comment Oct 05 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 1 Categories: Africa, DRC, Mountain Gorillas, Rwanda, vEcoLive, Virunga National Park, Volcanoes National Park by mark Join host Ian Redmond on a virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! The tour will trace the story of European interaction with these gentle giants, beginning with the dizzying heights of Mount Sabinyo, pausing in a misty glade to pay our respects at Dian Fossey’s grave, … Continue reading » This post has no tag Leave comment Dec 24 Behind the scenes at the world’s only mountain gorilla orphanage Categories: Africa, DRC, vEcotours, Virunga National Park by mark Just in time for Christmas, the vEco team is delighted to bring you this three-panorama virtual tour of the world’s only mountain gorilla orphanage, the Senkwekwe Center located at the headquarters of the Virunga National Park in Rumangabo, Democratic Republic of the Congo. This post has no tag Leave comment Dec 24 Don’t miss VIRUNGA, the movie! Categories: Africa, DRC, Stories from the Field, Virunga National Park by Ian Redmond Have you seen the oscar-nominated documentary VIRUNGA yet? You should! It is a film with the tense drama, tear-jerking emotion and spectacular imagery of a Hollywood blockbuster, but it is fact not fiction. It features the courageous men and women (and their families) that protect the Virunga National Park in the Democratic Republic of Congo … Continue reading » This post has no tag Leave comment Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation 