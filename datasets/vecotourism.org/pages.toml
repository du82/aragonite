full_description = '''« Welcome, BBC Earth Readers! Welcome National Geographic Readers! » Aug 08 Teaching school students with vEco virtual reality Categories: Kenya, Mount Elgon National Park, vEcotours by mark Here at vEcotours, we’ve taken our first leap into the classroom, trialling a new “kid’s version” of our Mount Elgon virtual reality tour for a special lesson at Cambridge Elementary School, Vermont. The demo used our new app, which is available for both iOS and Android, with a special new narration, voiced by youngsters Erica and Oliver Laxer. It was a great chance to see what students thought of the Mount Elgon tour. The reaction was, happily, a positive one! We also challenged students to “adopt” some of our tours after summer vacation; to research the locations and the species that live within them and produce a school project to narrate the tours themselves. We’re looking forward to seeing what students at Cambridge Elementary School come up with! Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del