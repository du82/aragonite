full_description = "Category Archive: Team vEco Nov 02 Ian Redmond reacts to the WWF Report on Sky News Categories: News, Team vEco by mark vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s 2018 “Living Planet Report” wherein the venerable conservation organization estimates that the Earth has lost 60% of its vertebrate species abundance in only the last 40 years. Ian called for all people to start looking to species conservation as “enlightened … Continue reading » Tags: WWF Leave comment Sep 20 vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! Categories: Elephants, Featured Species, Team vEco by mark The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, on his recent Animal Hero award from the RSPCA & Daily Mirror. Ian was selected for the “Next Generation” award for his tireless efforts to inspire future generations to safeguard Earth’s natural wonders. Follow this link to read the full … Continue reading » This post has no tag Leave comment Sep 15 London’s Great Gorilla Run 2017! Categories: Africa, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Mountain Gorillas, Team vEco by Ian Redmond There are fun runs and then there is the GREAT GORILLA RUN — more fun for a good cause than any other event in conservation! At least that is what British comedian and TV naturalist Bill Oddie says. Tomorrow, Saturday 16th September, the 15th Great Gorilla Run will see hundreds of people dressed as gorillas, with … Continue reading » This post has no tag Leave comment Apr 22 Virtual reality natural history — a sign of the future! Categories: Internet Technology, Team vEco, vEcotours by mark What equipment does a naturalist usually need? vEco’s Adviser and Ambassador (and renowned wildlife biologist and conservationist) Ian Redmond suggests a pair of binoculars and a hand lens, but — as he explains in this short video — soon, a virtual reality headset could also be a vital piece of equipment! It’s a positive movement; that … Continue reading » Tags: AR, conservation, eco, equipment, field biologist, gadgets, headset, Ian Redmond, natural history, naturalist, technology, vEco, vEcotourism, vEcotours, Virtual reality, VR Leave comment Sep 15 Yosina’s Maiden Voyage Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Witnessing the destruction of the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces by pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing, the Chimp-n-Sea Wildlife Conservation Fund (vEco’s parent organization), and partner JARI had to do something. In 2013, the ‘Yosina’ was purchased with the aim … Continue reading » This post has no tag Leave comment Aug 11 Tusk to Dust: experience the emotion as 3.5 tonnes of ivory are destroyed in Paris, France Categories: News, Team vEco, vEcotours by mark Ahead of World Elephant Day 2014 on August 12th, watch alongside vEcotourism’s ambassador, Ian Redmond, as 3.5 tonnes of illegal ivory tusks are crushed in Paris, France in February 2014. Highlighting the shocking illegal trafficking of ivory which is killing over 30,000 elephants each year, this exceptional event sent a clear message: it is unacceptable to allow … Continue reading » This post has no tag 2 comments Jul 31 Celebrate World Ranger Day 2014 Categories: Africa, News, Stories from the Field, Team vEco by mark World Ranger Day on 31 July celebrates the remarkable men and women who work to protect our endangered wildlife and threatened ecosystems. With the illegal wildlife trade burgeoning, poachers and smugglers are better funded and have more sophisticated weapons. threatening wildlife and rangers alike. An estimated 1,000 rangers have been killed in the last 10 … Continue reading » This post has no tag Leave comment Jun 30 Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Categories: Africa, Conservation Tools, News, Rwanda, Stories from the Field, Team vEco, vEcotours, Volcanoes National Park by mark On 1st July 2014 Rwanda will host the tenth annual ‘Kwita Izina’, a gorilla naming ceremony for each born in the Volcanoes National Park during the year! This year, if you are not able to attend, take a guided virtual tour (vEcotour) with primate expert Ian Redmond during last year’s event when he was given … Continue reading » This post has no tag Leave comment Jun 18 Get up close and personal with wild red colobus monkeys on Zanzibar Categories: Africa, News, Stories from the Field, Tanzania, Team vEco, vEcotours, Zanzibar by mark vEcotourism ambassador Ian Redmond recently touched down on the beautiful island of Zanzibar for a 24-hour whirlwind visit. Trekking through the island Ian encountered various interesting landscapes which vEcotourism will shortly be shaping into a full-fledged multi-pano, multi-hotspot vEcotour. As a taster, we have put together a quick vEcotour of Jozani Forest in Zanzibar’s only … Continue reading » This post has no tag 1 comment Jun 16 Help launch the good ship Yosina and protect threatened Indonesian marine ecosystems Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Encompassing the greatest diversity of coral reefs and fish in the world, the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces serious threats from pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing. Seeing the destruction for themselves, in 2001 the Chimp-n-Sea Wildlife Conservation Fund (vEco’s … Continue reading » This post has no tag 1 comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmo