full_description = '''« vEco launches VR app in partnership with UNEP-GRASP Teaching school students with vEco virtual reality » May 12 Welcome, BBC Earth Readers! Categories: Africa, Featured Species, Mountain Gorillas, Rwanda, vEcotours by mark Our Ambassador, Ian Redmond, remembers the mountain gorillas that famously interacted with Sir David Attenborough in the landmark television series ‘Life on Earth‘ for a new article for BBC Earth. Ian recalls introducing the BBC film crew to two of the gorilla groups being studied by Dian Fossey, while he was working as her research assistant at The Karisoke Research Centre in 1978. Answering the question: “Where are they now?”, BBC Earth explores the lives lived of the gorillas that featured in the now infamous clip. Happily, Poppy, the then two-year-old infant who played alongside David Attenborough, is now an elderly matriarch in the Susa Mountain Gorilla Group, one of the groups habituated for tourist visitors, and one which you can visit, virtually, with vEcotourism.org. at close range on the flanks of Mount Karisimbi. Click on the image above or here to begin the tour! To visit more mountain gorilla sites in the Virunga Volcanoes region, including the remote glade where Dian Fossey lies buried alongside her beloved gorilla friends, please choose a tour from the map below. Tags: BBC, BBC Earth, David Attenborough, Dian Fossey, Ian Redmond, Life on Earth, Susa, The Karaoke Research Centre (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script',