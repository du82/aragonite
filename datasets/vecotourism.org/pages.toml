title = "What would you say if given the chance to talk to the world for 15 minutes? – TEDx talk by Ian Redmond » Virtual Ecotourism"
full_description = '''« Introducing Mark Laxer Helena’s first vEcotour: JARI HQ, Lombok, Indonesia » May 28 What would you say if given the chance to talk to the world for 15 minutes? – TEDx talk by Ian Redmond Categories: Africa, New Media, News, Rwanda, Team vEco, Volcanoes National Park by mark vEcotourism ambassador and great ape expert, Ian Redmond was recently invited to give a TEDx talk at Southampton University. After the event, Ian explained to vEco how he felt about this unique and exciting experience: What would you say if given the chance to talk to the world for 15 minutes? I’ve been a fan of TED talks – with their tag-line ‘ideas worth sharing’ – for some time, so was delighted when I was invited to speak at one of the independently organised TEDx events at Southampton University. The rules were simple but strict – stay on the circular red carpet when speaking, don’t look behind you at the screen and do not exceed 15 minutes! I was last up after an afternoon of outstanding speakers on a variety of topics linked by the theme ‘flourishing in the 21st Century’. Given half a chance, I do like to engage an audience with stories to illustrate my point, but the large digital clock was counting down the seconds in front of me. I had to stay focused, touching on my work with gorillas and elephants but heading for the main take-home message: it is increasingly clear that the health of our planet depends on the ecosystem services provided by tropical forests, and that the health of those forests depends on keystone animal species such as primates and elephants, who prune the trees, create light-gaps, spread tonnes of manure and disperse the seeds that will grow into the trees of tomorrow. Ergo, if you value the forests, then you must protect the gardeners of the forest! I made it to the end with one second to spare! You can watch the complete TEDx talk by Ian Redmond below. As featured in the TEDx talk don’t miss the opportunity to have your own immersive experience with mountain gorillas, expertly guided by Ian Redmond himself, via a vEcotour of the Virunga Mountains here. This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar U