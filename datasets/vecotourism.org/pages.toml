title = "Last resort: rescuing an orangutan from its natural habitat » Virtual Ecotourism"
full_description = '''« Introducing Andrina Murrell: getting the word out for vEco Introducing Mark Laxer » May 09 Last resort: rescuing an orangutan from its natural habitat Categories: Indonesia by mark A recent article from Lucy Radford, Development Officer at Barbary Macaque Awareness & Conservation, provides a moving account of her trek through fragmented forest in Langkat, North Sumatra. Supported by stunning photography from wildlife photographer Andrew Walmsley, Lucy outlines the plight of wildlife that is being squeezed into smaller and smaller areas as oil palm plantations continue to consume habitable forest. So much so that organisations such as the Sumatran Orangutan Society are being forced to relocate orangutans out of forest fragments to safer areas. Travel through the forests of Langkat, North Sumatra with Lucy and Andrew and find out how it is possible for a forest to no longer be a forest. Read the full article here. You can take an immersive and interactive vEcotour in Sumatra with expert guide, Ian Redmond, now by clicking here! This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementB