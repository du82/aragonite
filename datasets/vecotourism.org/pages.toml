full_description = "Category Archive: Uganda Sep 30 vEcoLive: The Elephants of Queen Elizabeth National Park Categories: Africa, Elephants, QENP, Uganda, vEcoLive by mark In the run up to the Global March for Elephants and Rhinos on October 3rd and 4th in a city near YOU (www.march4elephantsandrhinos.org), join us for a virtual tour of the Craters Circuit in QENP, Uganda, with tour host Ian Redmond, to watch elephants and other wildlife. vEcoLive is our ground-breaking experimental platform that allows virtual … Continue reading » This post has no tag Leave comment Aug 12 Crossing paths with a forest elephant on World Elephant Day Categories: Africa, Bwindi Impenetrable National Park, Uganda by mark vEcotourism.org ambassador Ian Redmond recently had the very good fortune to encounter a magnificent forest elephant while trekking to see mountain gorillas in Bwindi Impenetrable National Park, Uganda. In our latest “taster” vEcotour, published to coincide with World Elephant Day, you’ll join Ian as he observes this marvellous creature calmly feeding in his native habitat, … Continue reading » This post has no tag 2 comments Jun 11 vEcotourism engages with Ugandan students at Makerere University Categories: Africa, Murchison Falls National Park, News, Stories from the Field, Team vEco, Uganda, vEcotours by mark Ugandan vEco blogger and photographer, Mark Olokotum (a.k.a. Mark O!), broke new ground this past Friday, June 6th, as he introduced students of the Department of Biological Sciences at Makerere University, Uganda, to the wonders and possibilities of vEcotourism. Introduced by vEco Tour Guide and Content Developer, Jackson Efitre, Mark O dazzled the group with … Continue reading » This post has no tag Leave comment Apr 11 Scrambling up the Albertine Escarpment, Uganda Categories: Africa, Mark O's blog, Uganda, vEcotours by mark Today we are travelling to the Albertine Graben region in the East African Rift Valley. I visited this area to perform an environmental impact assessment (EIA) for the Chinese oil giant, CNOOC, as the Rift Valley is thought to contain large amounts of natural gas and oil. To access the site I had to climb … Continue reading » This post has no tag 1 comment Mar 21 Experience the roar of the magnificent Murchison Falls, Uganda Categories: Africa, Murchison Falls National Park, Uganda by mark In December 2013 I travelled to the remarkable Murchison Falls, also known as Kabalega Falls, in north west Uganda. Located within Uganda’s largest protected area, the Murchison Falls National Park, the area is characterised by green, pristine vegetation scattered with diverse wildlife. You can join me on my travels through this vEcotour; experience the thunderous … Continue reading » Tags: buffalo, elephants, Murchison Falls, Nile, Uganda, vEcotourism, virtual ecotourism Leave comment Feb 17 vEco’s gift to you: the view of a lifetime! Categories: Africa, Uganda by mark To say thank you for the enthusiastic reception and all the fantastic feedback that vEcotourism.org has recently received, we wanted to give something back! Just like vEco Ambassador Ian Redmond, you too can enjoy the spectacular view over the hills on the southern edge of Bwindi Impenetrable National Park, Uganda. Simply click on the image or links below … Continue reading » This post has no tag Leave comment Feb 13 Presenting vEco’s first blogger: Mark O! Categories: Africa, Mark O's blog, News, Stories from the Field, Team vEco, Uganda by mark My name is Mark Olokotum alias Mark O! I am the main photographer and tour guide for apapers.org in Uganda, and will be bringing vEco content from East Africa as well as presenting vEco materials to local communities. I invite you to “Be part of the conversation and conservation”! I hold a BSc in Fisheries and … Continue reading » This post has no tag 4 comments Feb 04 Mobile Clinic arrival marks a special day for the Kibale Health and Conservation Project, Uganda Categories: Africa, Conservation Tools, Kibale, News, Uganda by mark Today represents a fantastic result for vEcotourism Project Advisors Dr.’s Colin and Lauren Chapman; a long-awaited mobile clinic van for Kibale National Park has finally arrived in Uganda. The Kibale Health and Conservation Project, founded by the couple, works to to provide health care to the local communities surrounding Kibale National Park as well as … Continue reading » This post has no tag Leave comment Oct 07 Team Uganda Reunited Categories: Africa, Team vEco, Uganda by mark vEco’s globetrotting ambassador, Ian Redmond (pictured on the right), met up with two of vEco’s most dedicated collaborators this past weekend: Jackson Efitre (center, Lecturer at the Department of Biological Sciences, Makerere University) and Mark Olokotum (left, M.Sc. student at Makerere University and Research Assistant with NaFIRRI-Jinja). The trio then met up with The Gorilla … Continue reading » This post has no tag 1 comment Jul 13 Taking vEcotours to new heights Categories: Africa, Mgahinga National Park, News, Uganda by mark Check out this panoramic photo that’s recently arrived courtesy of our Ugandan team. Showing the dramatic trail to the summit of Mt Sabinyo, where three countries meet (Uganda, Rwanda and the Democratic Republic of Congo, altitude 3,645 metres, 11,959 ft) this was taken on a media-collecting tour of Western Uganda, including Mgahinga National Park and … Continue reading » Tags: Panoramic 1 comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
