full_description = '''Mark Author's details Name: Mark Laxer Date registered: January 16, 2011 Latest posts Ian Redmond reacts to the WWF Report on Sky News — November 2, 2018 Introducing vEco Labs! — March 13, 2018 vEcotourism at UN CMS CoP12 in the Philippines — November 21, 2017 vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! — September 20, 2017 Marching for an end to the domestic ivory trade in the UK — February 7, 2017 Most commented posts Welcoming Helena Baird to the JARI team — 6 commentsLunch-Break vEcoLive: Meet the Salt-Mining Elephants of Kitum Cave, Kenya! — 6 commentsPresenting vEco’s first blogger: Mark O! — 4 commentsvEco needs Volunteers! — 3 commentsDigital Media & Learning Competition — 2 comments (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Author's posts listings Sep 21 Eight new vEcotours to explore! Categories: Africa, Indonesia, vEcotours by mark In a push to give you, the public, a bit more to chew on as we continue to develop the technical side of vEcotourism.org, we’ve put eight new vEcotours online. The new sites range from the lofty heights of Mt Sabinyo in Uganda to deck-level on a fishing boat in Saleh Bay, Indonesia. Click on … Continue reading » This post has no tag Leave comment Jun 04 Podcast: Ian Redmond on Biodiversity and Ecosystems Categories: News, Team vEco by mark vEco ambassador Ian Redmond was a guest of the Voice America internet radio network last week, where he talked about the individual animals that lie behind our concepts of ecosystems and biodiversity for their “Our Wild World” program. You can listen to the full interview here. This post has no tag Leave comment May 12 Underwater vEcotours on the distant horizon Categories: Indonesia by mark vEcotourism’s parent organisation, Chimp-n-Sea, is proud to announce the addition of a 51′ foot boat, Yosina, to the conservation team. Chimp-n-Sea co-founders Mark Laxer and Sara Lourie recently spent 5 1/2 weeks in Indonesia working with the Jari Foundation, a local NGO, on a plan for marine conservation and local education. Long-term projects may involve … Continue reading » This post has no tag 2 comments Jul 13 Taking vEcotours to new heights Categories: Africa, Mgahinga National Park, News, Uganda by mark Check out this panoramic photo that’s recently arrived courtesy of our Ugandan team. Showing the dramatic trail to the summit of Mt Sabinyo, where three countries meet (Uganda, Rwanda and the Democratic Republic of Congo, altitude 3,645 metres, 11,959 ft) this was taken on a media-collecting tour of Western Uganda, including Mgahinga National Park and … Continue reading » Tags: Panoramic 1 comment Jul 10 Ian Redmond: vEco Ambassador! Categories: News, Team vEco by mark We are delighted to announce that the vEcotourism team has expanded to include Ian Redmond, conservationist extraordinaire. With over 30 years of experience in great ape and elephant conservation and an Order of the British Empire in recognition of his achievements, Ian brings considerable skills to the table as well as his infectious good cheer. … Continue reading » This post has no tag 1 comment Feb 20 vEco flys to San Francisco for the final round of the DML competition Categories: Internet Technology, New Media by mark Having successfully advanced through Stage I and Stage II of the Digital Media and Learning Badges for Lifelong Learning Competition, the contest organizers have invited two members of the Virtual Ecotourism team to San Francisco to pitch the project in person! With flowers in our hair, we head to San Francisco for … Continue reading » Tags: badges, digital learning, funding, New Media Leave comment Feb 03 Gorillas and the Mist, now on YouTube! Categories: News by mark The vEcotourism team is pleased to announce the launch of our YouTube channel, which will hosts recordings made by our vEco tour guides in the field, link to amazing videos of the natural world, showcase brilliant conservation projects, bring awareness to environment and wildlife issues, and feature talks by renowned conservation professionals. Our first feature video is a … Continue reading » This post has no tag Leave comment Jan 31 Stage II – Digital Media and Learning Badges Competition Categories: Internet Technology, New Media by mark After winning Stage I of the DML Badges Competition, the virtual ecotourism team decided to take destiny into our own hands and entered our own unique badging system in Stage II of the competition. If we are successful in this stage we will be competing in a live showdown with other winners in San Francisco, USA, … Continue reading » Tags: badges, digital learning, funding, New Media Leave comment Dec 27 DML Badges Competition: Virtual Ecotourism Advances to Stage II! Categories: Internet Technology, New Media, News by mark The team is very proud to announce that the virtual ecotourism project has been chosen, out of over 350 applicants, to advance to Stage Two of the Digital Media and Learning Badges Competition. This means that our content was deemed compelling and original, and capable of evaluating 21st century learning as part of a worldwide badge … Continue reading » Tags: badges, digitial learning, funding, hastac, New Media 1 comment Dec 20 Listen to the waves of Lake Nabugabo Categories: Africa, Conservation Tools, Nabugabo, News, Uganda by mark The vEco team in Uganda has been hard at work collecting images, panoramas, and sounds at our new site on the shores of Lake Nabugabo. Enjoy this panorama near the shore, complete with sampled audio. Tags: conservation, new technology, panoramic photos 1 comment Older posts « » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search'''
