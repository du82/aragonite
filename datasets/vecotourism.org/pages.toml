full_description = "Category Archive: Africa Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … Continue reading » This post has no tag 2 comments Sep 15 London’s Great Gorilla Run 2017! Categories: Africa, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Mountain Gorillas, Team vEco by Ian Redmond There are fun runs and then there is the GREAT GORILLA RUN — more fun for a good cause than any other event in conservation! At least that is what British comedian and TV naturalist Bill Oddie says. Tomorrow, Saturday 16th September, the 15th Great Gorilla Run will see hundreds of people dressed as gorillas, with … Continue reading » This post has no tag Leave comment Feb 07 Marching for an end to the domestic ivory trade in the UK Categories: Africa, Elephants by mark Come along with our vEco Ambassador, Ian Redmond, as he co-presents a petition to end the UK domestic ivory trade to 10 Downing Street. Recorded at the Global March for Elephants and Rhinos in London last year, this 360 video is especially relevant as the UK parliament just discussed this issue yesterday! This post has no tag Leave comment Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William … Continue reading » This post has no tag Leave comment Aug 12 Welcome National Geographic Readers! Categories: Kenya, Mount Elgon National Park, vEcotours by mark vEcotours Ambassador Ian Redmond re-lives the moment he was charged by a four-tonne elephant in a new article for National Geographic. “There is some irony in this – that the person who coined the term ‘elefriends’ should be trampled by a decidedly unfriendly elephant – but I’m pretty sure it wasn’t personal,” Ian jokes, as … Continue reading » This post has no tag 1 comment Aug 08 Teaching school students with vEco virtual reality Categories: Kenya, Mount Elgon National Park, vEcotours by mark Here at vEcotours, we’ve taken our first leap into the classroom, trialling a new “kid’s version” of our Mount Elgon virtual reality tour for a special lesson at Cambridge Elementary School, Vermont. The demo used our new app, which is available for both iOS and Android, with a special new narration, voiced by youngsters Erica and … Continue reading » Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR Leave comment May 12 Welcome, BBC Earth Readers! Categories: Africa, Featured Species, Mountain Gorillas, Rwanda, vEcotours by mark Our Ambassador, Ian Redmond, remembers the mountain gorillas that famously interacted with Sir David Attenborough in the landmark television series ‘Life on Earth‘ for a new article for BBC Earth. Ian recalls introducing the BBC film crew to two of the gorilla groups being studied by Dian Fossey, while he was working as her research … Continue reading » Tags: BBC, BBC Earth, David Attenborough, Dian Fossey, Ian Redmond, Life on Earth, Susa, The Karaoke Research Centre Leave comment Mar 03 Visit the Salt-Mining Elephants of Mount Elgon, Kenya Categories: Africa, Elephants, Featured Species, Kenya, Mount Elgon National Park by mark Our latest vEcotour has more depth than ever, literally! Venture nearly 200m or 650 ft deep into Kitum Cave where you’ll cross paths with the world’s only “Troglodyte Tuskers”! This post has no tag Leave comment Feb 26 Celebrate WORLD WILDLIFE DAY with a guided virtual safari to see elephants… underground! Categories: Africa, Elephants, Kenya, Mount Elgon National Park, vEcoLive by mark Join live tour host Ian Redmond for a multimedia 360-degree virtual reality tour of the world’s only salt-mining elephants! March 3rd is designated by the United Nations as World Wildlife Day. This year, the theme is ELEPHANTS – the largest animals on land. All three species – the African Savannah Elephant, the African Forest Elephant … Continue reading » This post has no tag Leave comment Dec 21 Don’t miss “Gorilla Family & Me” on BBC Two later today! Categories: Africa, BBC, DRC, Eastern Lowland Gorillas, Featured Species, Kahuzi-Biega National Park by mark Wildlife cameraman Gordon Buchanan visits our friend Chimanuka the Silverback in Kahuzi-Biega National Park in the BBC Two series that begins broadcasting today. Accompany Gordon as he attempts to gain the trust of Chimanuka and map the power dynamics at play among these gentle giants. Breaking new ground for vEco, the BBC has linked to our … Continue reading » This post has no tag Leave comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Phil