Elgon National Park, vEcoLive by mark To mark the occasion of World Elephant Day, 2015, please join us on your lunch break when Ian Redmond will provide a vEcoLive tour of Kitum Cave in Mt Elgon National Park, Kenya. Bring your own sandwiches and head to live.vecotourism.org to accompany Ian as he narrates, in real-time, a five-location expedition from the Park’s … Continue reading » Tags: elephants, Ian Redmond 6 comments Mar 16 vEco integrated with UN-GRASP’s new website! Categories: Conservation Tools, Internet Technology, News by mark vEcotourism.org is proud and delighted to announce a major project milestone: we’re now integrated into the United Nations Great Apes Survival Partnership’s (UN-GRASP’s) new website! Click on any of the great ape’s species pages and you can now enjoy virtual tours of each great ape’s habitat while learning about keeping abreast of GRASP’s conservation programs … Continue reading » This post has no tag Leave comment Mar 03 #seriousaboutwildlifecrime Categories: Conservation Tools, Internet Technology, News by mark The theme of this year’s UN World Wildlife Day, on 3rd March, is being #seriousaboutwildlifecrime and the UN-Great Apes Survival Partnership (UN-GRASP) has released a new video, which will be screened at the UN in New York, on the illegal trade in ape infants. This post has no tag Leave comment Dec 24 Behind the scenes at the world’s only mountain gorilla orphanage Categories: Africa, DRC, vEcotours, Virunga National Park by mark Just in time for Christmas, the vEco team is delighted to bring you this three-panorama virtual tour of the world’s only mountain gorilla orphanage, the Senkwekwe Center located at the headquarters of the Virunga National Park in Rumangabo, Democratic Republic of the Congo. This post has no tag Leave comment Sep 21 Talking Climate Change from the summit of Mount Kilimanjaro Categories: Africa, Climate change, Tanzania by mark In this spectacular vEcotour join with me, Ian Redmond, to experience the exhilaration of reaching the nearly 6000m Uhuru peak on Mount Kilimanjaro! I recently took on the epic climb up Mount Kilimanjaro, Tanzania to showcase the impact of climate change on our natural and cultural heritage sites. Joining my concerned climate colleagues Ian Singleton, Andy … Continue reading » Tags: Ian Redmond Leave comment Sep 15 Yosina’s Maiden Voyage Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Witnessing the destruction of the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces by pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing, the Chimp-n-Sea Wildlife Conservation Fund (vEco’s parent organization), and partner JARI had to do something. In 2013, the ‘Yosina’ was purchased with the aim … Continue reading » This post has no tag Leave comment Aug 19 Welcome, Guardian readers! Categories: Conservation Tools, Indonesia, News by mark vEcotourism.org is pleased to welcome readers of The Guardian’s “Notes&Theories” segment, arriving at our site following our mention in the recent piece entitled “Support our red-haired cousins, the orangutans, before it’s too late“. You can join your host, Ian Redmond, OBE, in our unique interactive virtual ecotours of Orangutan habitat and conservation efforts in Sumatra by … Continue reading » This post has no tag Leave comment Aug 12 Crossing paths with a forest elephant on World Elephant Day Categories: Africa, Bwindi Impenetrable National Park, Uganda by mark vEcotourism.org ambassador Ian Redmond recently had the very good fortune to encounter a magnificent forest elephant while trekking to see mountain gorillas in Bwindi Impenetrable National Park, Uganda. In our latest “taster” vEcotour, published to coincide with World Elephant Day, you’ll join Ian as he observes this marvellous creature calmly feeding in his native habitat, … Continue reading » This post has no tag 2 comments Aug 11 Tusk to Dust: experience the emotion as 3.5 tonnes of ivory are destroyed in Paris, France Categories: News, Team vEco, vEcotours by mark Ahead of World Elephant Day 2014 on August 12th, watch alongside vEcotourism’s ambassador, Ian Redmond, as 3.5 tonnes of illegal ivory tusks are crushed in Paris, France in February 2014. Highlighting the shocking illegal trafficking of ivory which is killing over 30,000 elephants each year, this exceptional event sent a clear message: it is unacceptable to allow … Continue reading » This post has no tag 2 comments Older posts « » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Medi