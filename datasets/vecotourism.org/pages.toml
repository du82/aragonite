full_description = "Category Archive: Mount Elgon National Park Aug 12 Welcome National Geographic Readers! Categories: Kenya, Mount Elgon National Park, vEcotours by mark vEcotours Ambassador Ian Redmond re-lives the moment he was charged by a four-tonne elephant in a new article for National Geographic. “There is some irony in this – that the person who coined the term ‘elefriends’ should be trampled by a decidedly unfriendly elephant – but I’m pretty sure it wasn’t personal,” Ian jokes, as … Continue reading » This post has no tag 1 comment Aug 08 Teaching school students with vEco virtual reality Categories: Kenya, Mount Elgon National Park, vEcotours by mark Here at vEcotours, we’ve taken our first leap into the classroom, trialling a new “kid’s version” of our Mount Elgon virtual reality tour for a special lesson at Cambridge Elementary School, Vermont. The demo used our new app, which is available for both iOS and Android, with a special new narration, voiced by youngsters Erica and … Continue reading » Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR Leave comment Mar 03 Visit the Salt-Mining Elephants of Mount Elgon, Kenya Categories: Africa, Elephants, Featured Species, Kenya, Mount Elgon National Park by mark Our latest vEcotour has more depth than ever, literally! Venture nearly 200m or 650 ft deep into Kitum Cave where you’ll cross paths with the world’s only “Troglodyte Tuskers”! This post has no tag Leave comment Feb 26 Celebrate WORLD WILDLIFE DAY with a guided virtual safari to see elephants… underground! Categories: Africa, Elephants, Kenya, Mount Elgon National Park, vEcoLive by mark Join live tour host Ian Redmond for a multimedia 360-degree virtual reality tour of the world’s only salt-mining elephants! March 3rd is designated by the United Nations as World Wildlife Day. This year, the theme is ELEPHANTS – the largest animals on land. All three species – the African Savannah Elephant, the African Forest Elephant … Continue reading » This post has no tag Leave comment Aug 11 Lunch-Break vEcoLive: Meet the Salt-Mining Elephants of Kitum Cave, Kenya! Categories: Africa, Elephants, Featured Species, Kenya, Mount Elgon National Park, vEcoLive by mark To mark the occasion of World Elephant Day, 2015, please join us on your lunch break when Ian Redmond will provide a vEcoLive tour of Kitum Cave in Mt Elgon National Park, Kenya. Bring your own sandwiches and head to live.vecotourism.org to accompany Ian as he narrates, in real-time, a five-location expedition from the Park’s … Continue reading » Tags: elephants, Ian Redmond 6 comments Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bo