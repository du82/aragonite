full_description = "Category Archive: Eastern Lowland Gorillas Sep 15 London’s Great Gorilla Run 2017! Categories: Africa, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Mountain Gorillas, Team vEco by Ian Redmond There are fun runs and then there is the GREAT GORILLA RUN — more fun for a good cause than any other event in conservation! At least that is what British comedian and TV naturalist Bill Oddie says. Tomorrow, Saturday 16th September, the 15th Great Gorilla Run will see hundreds of people dressed as gorillas, with … Continue reading » This post has no tag Leave comment Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William … Continue reading » This post has no tag Leave comment Nov 16 Praise for vEcotourism.org from the United Nations’ Great Apes Surival Partnership! Categories: Bonobos, Bornean Orangutans, Chimpanzees, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Internet Technology, Mountain Gorillas, News, Sumatran Orangutans, UN-GRASP by mark Some very kind words about vEco from Doug Cress, Programme Coordinator for the United Nations’ Great Apes Survival Partnership! If you’ve got a VR headset, give apeAPP VR a spin on your Android or Apple smartphone 🙂 http://www.un-grasp.org/vr/ This post has no tag Leave comment Dec 21 Don’t miss “Gorilla Family & Me” on BBC Two later today! Categories: Africa, BBC, DRC, Eastern Lowland Gorillas, Featured Species, Kahuzi-Biega National Park by mark Wildlife cameraman Gordon Buchanan visits our friend Chimanuka the Silverback in Kahuzi-Biega National Park in the BBC Two series that begins broadcasting today. Accompany Gordon as he attempts to gain the trust of Chimanuka and map the power dynamics at play among these gentle giants. Breaking new ground for vEco, the BBC has linked to our … Continue reading » This post has no tag Leave comment Nov 09 Meet the Chimanuka gorilla family of Kahuzi-Biega National Park, DRC Categories: Africa, DRC, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Kahuzi-Biega National Park, vEcotours by mark Where do the biggest gorillas in the world live? It is well known that gorillas are the largest primate (except for a few very large humans) but we can now take you – virtually – to the only place in the world where you can find the biggest gorilla sub-species, the Eastern Lowland or Grauer’s … Continue reading » This post has no tag Leave comment Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park 