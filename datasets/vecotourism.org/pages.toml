title = "Celebrate World Ranger Day 2014 » Virtual Ecotourism"
full_description = '''« A home away from home in Lombok, Indonesia Tusk to Dust: experience the emotion as 3.5 tonnes of ivory are destroyed in Paris, France » Jul 31 Celebrate World Ranger Day 2014 Categories: Africa, News, Stories from the Field, Team vEco by mark The Institute in Congo for the Conservation of Nature (ICCN) is the government agency of the Democratic Republic of Congo charged with the task of protecting the flora and fauna of the country © Ian Redmond World Ranger Day on 31 July celebrates the remarkable men and women who work to protect our endangered wildlife and threatened ecosystems. With the illegal wildlife trade burgeoning, poachers and smugglers are better funded and have more sophisticated weapons. threatening wildlife and rangers alike. An estimated 1,000 rangers have been killed in the last 10 years according to The Thin Green Line Foundation. No-one at vEcotourism is more familiar with those who protect our natural resources than our ambassador, Ian Redmond: “In recent months I have worked alongside rangers and wardens in Nigeria, Rwanda, Uganda, DRC and Tanzania,” explains Ian, “I’ve seen them arrest a poacher, destroy illegal cattle-herders camps, explore unknown forested valleys, and provide friendly security. They even help tourists visiting mountain gorillas and, as they are this week, assist conservationists looking to climb Mount Kilimanjaro! “So, on World Ranger Day 2014, on our approach to the summit of the world’s highest free-standing mountain and Africa’s highest point, I salute all rangers and wardens for their dedication and courage in protecting our planet’s natural wonders and the ecosystems that sustain us all. They are an inspiration!” Many of the vEcotours featured on this site would not have been possible without the remarkable efforts of rangers. From the protective gorilla guides in Rwanda to viewing a tree-climbing lion in Uganda, rangers have contributed their efforts in each and every tour. Why not celebrate by taking one or two vEcotours here? vEcotourism would like to join Ian in saluting these amazing people and all that they give to protect our natural world. Thank you! From 29 July to 6 April, Ian Redmond is climbing Mount Kilimanjaro in aid of various different organisations. You can support him here and make sure you keep an eye out for the world’s very first virtual ecotour of Mount Kilimanjaro! This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSP