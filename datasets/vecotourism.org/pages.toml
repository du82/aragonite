full_description = "Category Archive: Zanzibar Jun 18 Get up close and personal with wild red colobus monkeys on Zanzibar Categories: Africa, News, Stories from the Field, Tanzania, Team vEco, vEcotours, Zanzibar by mark vEcotourism ambassador Ian Redmond recently touched down on the beautiful island of Zanzibar for a 24-hour whirlwind visit. Trekking through the island Ian encountered various interesting landscapes which vEcotourism will shortly be shaping into a full-fledged multi-pano, multi-hotspot vEcotour. As a taster, we have put together a quick vEcotour of Jozani Forest in Zanzibar’s only … Continue reading » This post has no tag 1 comment Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gori