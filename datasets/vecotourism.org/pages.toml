 Baird’s beautiful “home away from home” in Indonesia as she volunteers with vEcotourism’s partner, marine protection organisation JARI “Volunteering in a developing country is more than just the work itself” Helena explains, “it’s an entirely immersive, challenging and uplifting experience. I have almost been in Indonesia for six … Continue reading » This post has no tag 1 comment Jun 30 Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Categories: Africa, Conservation Tools, News, Rwanda, Stories from the Field, Team vEco, vEcotours, Volcanoes National Park by mark On 1st July 2014 Rwanda will host the tenth annual ‘Kwita Izina’, a gorilla naming ceremony for each born in the Volcanoes National Park during the year! This year, if you are not able to attend, take a guided virtual tour (vEcotour) with primate expert Ian Redmond during last year’s event when he was given … Continue reading » This post has no tag Leave comment Jun 18 Get up close and personal with wild red colobus monkeys on Zanzibar Categories: Africa, News, Stories from the Field, Tanzania, Team vEco, vEcotours, Zanzibar by mark vEcotourism ambassador Ian Redmond recently touched down on the beautiful island of Zanzibar for a 24-hour whirlwind visit. Trekking through the island Ian encountered various interesting landscapes which vEcotourism will shortly be shaping into a full-fledged multi-pano, multi-hotspot vEcotour. As a taster, we have put together a quick vEcotour of Jozani Forest in Zanzibar’s only … Continue reading » This post has no tag 1 comment Jun 16 Help launch the good ship Yosina and protect threatened Indonesian marine ecosystems Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Encompassing the greatest diversity of coral reefs and fish in the world, the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces serious threats from pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing. Seeing the destruction for themselves, in 2001 the Chimp-n-Sea Wildlife Conservation Fund (vEco’s … Continue reading » This post has no tag 1 comment Jun 11 vEcotourism engages with Ugandan students at Makerere University Categories: Africa, Murchison Falls National Park, News, Stories from the Field, Team vEco, Uganda, vEcotours by mark Ugandan vEco blogger and photographer, Mark Olokotum (a.k.a. Mark O!), broke new ground this past Friday, June 6th, as he introduced students of the Department of Biological Sciences at Makerere University, Uganda, to the wonders and possibilities of vEcotourism. Introduced by vEco Tour Guide and Content Developer, Jackson Efitre, Mark O dazzled the group with … Continue reading » This post has no tag Leave comment Jun 05 Explore the world with vEcotourism.org on World Environment Day 2014 Categories: News, vEcotours by mark Set up by the United Nations in 1973, World Environment Day (WED) is celebrated annually on 5 June to encourage worldwide awareness and action for the environment. WED has become an impressive platform from which organisations and individuals alike can do something positive for the environment. “On the 41st World Environment Day, we would like to … Continue reading » This post has no tag Leave comment May 30 Helena’s first vEcotour: JARI HQ, Lombok, Indonesia Categories: Indonesia, News, Stories from the Field, vEcotours by mark vEco is proud to present the first ever vEcotour from JARI volunteer, Dr. Helena Baird! As you will see from the tour Helena is no doubt as talented a panoramic photographer as she is a marine ecologist. “JARI, or “Juang Laut Lestari”, is a small but fiercely motivated locally-run NGO based in Lombok, Indonesia” explains … Continue reading » This post has no tag 1 comment May 28 What would you say if given the chance to talk to the world for 15 minutes? – TEDx talk by Ian Redmond Categories: Africa, New Media, News, Rwanda, Team vEco, Volcanoes National Park by mark vEcotourism ambassador and great ape expert, Ian Redmond was recently invited to give a TEDx talk at Southampton University. After the event, Ian explained to vEco how he felt about this unique and exciting experience: What would you say if given the chance to talk to the world for 15 minutes? I’ve been a fan of TED talks – … Continue reading » This post has no tag Leave comment May 13 Introducing Mark Laxer Categories: News, Team vEco by mark Hi. Mark Laxer here, president of Chimp-n-Sea Wildlife Conservation Fund and director of the vEcotourism project. Welcome to my new blog series! That’s me in the photo in 2010, dressed as a human-ape hybrid. I was promoting my book, The Monkey Bible, that I wrote to encourage religious and scientific communities to work together to … Continue reading » This post has no tag 2 comments Older posts « » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable Nat