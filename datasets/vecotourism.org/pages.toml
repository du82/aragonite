title = "News » Virtual Ecotourism"
full_description = "Category Archive: News Nov 02 Ian Redmond reacts to the WWF Report on Sky News Categories: News, Team vEco by mark vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s 2018 “Living Planet Report” wherein the venerable conservation organization estimates that the Earth has lost 60% of its vertebrate species abundance in only the last 40 years. Ian called for all people to start looking to species conservation as “enlightened … Continue reading » Tags: WWF Leave comment Mar 13 Introducing vEco Labs! Categories: News by mark Now that the vEco team has migrated our core technology over to the Unity development engine, we’re bringing all kinds of innovative 360 features into the fold, like true 3D menu scenes, spatial audio, and in-tour minigames! Because not all of these new features are available as part of a finished tour at this time, … Continue reading » This post has no tag Leave comment Nov 21 vEcotourism at UN CMS CoP12 in the Philippines Categories: Conservation Tools, Elephants, Internet Technology, News, vEcotours by mark Virtual reality experiences of nature were a highlight for some delegates and volunteers at the United Nations Convention on the Conservation of Migratory Species meeting in Manila recently. The 12th Conference of the Parties to the CMS, hosted by the Government of the Philippines, brought together delegates and observers from the 124 signatory countries and … Continue reading » This post has no tag Leave comment Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William … Continue reading » This post has no tag Leave comment Nov 16 Praise for vEcotourism.org from the United Nations’ Great Apes Surival Partnership! Categories: Bonobos, Bornean Orangutans, Chimpanzees, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Internet Technology, Mountain Gorillas, News, Sumatran Orangutans, UN-GRASP by mark Some very kind words about vEco from Doug Cress, Programme Coordinator for the United Nations’ Great Apes Survival Partnership! If you’ve got a VR headset, give apeAPP VR a spin on your Android or Apple smartphone 🙂 http://www.un-grasp.org/vr/ This post has no tag Leave comment Aug 24 Welcome, Members and Fellows of the Royal Geographical Society Categories: News by mark Welcome Members and Fellows of the Royal Geographical Society, and other readers of the September issue of the Geographical Magazine special issue on Extinction! Please find below a selection of links to “virtual ecotours” of species mentioned in Ian Redmond’s article. Salt-Mining Elephants of Mount Elgon, Kenya Susa Mountain Gorilla Group, Mount Karisimbi, Rwanda Chimanuka … Continue reading » This post has no tag Leave comment May 09 vEco launches VR app in partnership with UNEP-GRASP Categories: Conservation Tools, Internet Technology, News, vEcotours by mark vEcotourism.org is both proud and incredibly excited to be launching our first virtual reality mobile app in partnership with the United Nations Environment Programme – Great Apes Survival Partnership (UNEP-GRASP) and the Ape Alliance: apeAPP VR! The app, which will be available on both Android and iOS smartphones, will offer immersive tours of all great ape … Continue reading » Tags: app, GRASP, great apes, vEco, vEcotours, VR 1 comment Mar 16 vEco integrated with UN-GRASP’s new website! Categories: Conservation Tools, Internet Technology, News by mark vEcotourism.org is proud and delighted to announce a major project milestone: we’re now integrated into the United Nations Great Apes Survival Partnership’s (UN-GRASP’s) new website! Click on any of the great ape’s species pages and you can now enjoy virtual tours of each great ape’s habitat while learning about keeping abreast of GRASP’s conservation programs … Continue reading » This post has no tag Leave comment Mar 03 #seriousaboutwildlifecrime Categories: Conservation Tools, Internet Technology, News by mark The theme of this year’s UN World Wildlife Day, on 3rd March, is being #seriousaboutwildlifecrime and the UN-Great Apes Survival Partnership (UN-GRASP) has released a new video, which will be screened at the UN in New York, on the illegal trade in ape infants. This post has no tag Leave comment Sep 15 Yosina’s Maiden Voyage Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Witnessing the destruction of the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces by pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing, the Chimp-n-Sea Wildlife Conservation Fund (vEco’s parent organization), and partner JARI had to do something. In 2013, the ‘Yosina’ was purchased with the aim … Continue reading » This post has no tag Leave comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’