full_description = "Category Archive: Featured Species Dec 21 Don’t miss “Gorilla Family & Me” on BBC Two later today! Categories: Africa, BBC, DRC, Eastern Lowland Gorillas, Featured Species, Kahuzi-Biega National Park by mark Wildlife cameraman Gordon Buchanan visits our friend Chimanuka the Silverback in Kahuzi-Biega National Park in the BBC Two series that begins broadcasting today. Accompany Gordon as he attempts to gain the trust of Chimanuka and map the power dynamics at play among these gentle giants. Breaking new ground for vEco, the BBC has linked to our … Continue reading » This post has no tag Leave comment Nov 09 Meet the Chimanuka gorilla family of Kahuzi-Biega National Park, DRC Categories: Africa, DRC, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Kahuzi-Biega National Park, vEcotours by mark Where do the biggest gorillas in the world live? It is well known that gorillas are the largest primate (except for a few very large humans) but we can now take you – virtually – to the only place in the world where you can find the biggest gorilla sub-species, the Eastern Lowland or Grauer’s … Continue reading » This post has no tag Leave comment Oct 13 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 2 Categories: Africa, DRC, Featured Species, Mountain Gorillas, vEcoLive, Virunga National Park by mark Join host Ian Redmond for part two of our virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! This week, we will take you behind-the-scenes of the world’s only orphanage for mountain gorillas, the Senkwekwe Centre, where you will meet André Bauma, one of the heroes … Continue reading » This post has no tag Leave comment Oct 05 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 1 Categories: Africa, DRC, Mountain Gorillas, Rwanda, vEcoLive, Virunga National Park, Volcanoes National Park by mark Join host Ian Redmond on a virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! The tour will trace the story of European interaction with these gentle giants, beginning with the dizzying heights of Mount Sabinyo, pausing in a misty glade to pay our respects at Dian Fossey’s grave, … Continue reading » This post has no tag Leave comment Sep 30 vEcoLive: The Elephants of Queen Elizabeth National Park Categories: Africa, Elephants, QENP, Uganda, vEcoLive by mark In the run up to the Global March for Elephants and Rhinos on October 3rd and 4th in a city near YOU (www.march4elephantsandrhinos.org), join us for a virtual tour of the Craters Circuit in QENP, Uganda, with tour host Ian Redmond, to watch elephants and other wildlife. vEcoLive is our ground-breaking experimental platform that allows virtual … Continue reading » This post has no tag Leave comment Aug 11 Lunch-Break vEcoLive: Meet the Salt-Mining Elephants of Kitum Cave, Kenya! Categories: Africa, Elephants, Featured Species, Kenya, Mount Elgon National Park, vEcoLive by mark To mark the occasion of World Elephant Day, 2015, please join us on your lunch break when Ian Redmond will provide a vEcoLive tour of Kitum Cave in Mt Elgon National Park, Kenya. Bring your own sandwiches and head to live.vecotourism.org to accompany Ian as he narrates, in real-time, a five-location expedition from the Park’s … Continue reading » Tags: elephants, Ian Redmond 6 comments Feb 10 Experience the fascinating world of the Susa gorilla group in Rwanda, guided by great ape expert Ian Redmond Categories: Africa, Featured Species, Mountain Gorillas, News, Panoramic, Rwanda, vEcotours, Volcanoes National Park by mark Sidle up to one of our world’s greatest living wonders: a group of mighty mountain gorillas browsing and playing in their natural habitat on Mount Karisimbi, Rwanda. Our latest vEcotour features 360 degree images, ambient background sounds, and embedded videos, all captured by our vEco Ambassador and great ape expert, Ian