full_description = '''« Crossing paths with a forest elephant on World Elephant Day Yosina’s Maiden Voyage » Aug 19 Welcome, Guardian readers! Categories: Conservation Tools, Indonesia, News by mark vEcotourism.org is pleased to welcome readers of The Guardian’s “Notes&Theories” segment, arriving at our site following our mention in the recent piece entitled “Support our red-haired cousins, the orangutans, before it’s too late“. You can join your host, Ian Redmond, OBE, in our unique interactive virtual ecotours of Orangutan habitat and conservation efforts in Sumatra by clicking on the links below or by consulting the map of tour locations here. Enjoy! High up in an abandoned Orangutan nest, Tripa palm oil plantation, Aceh province, Indonesia At the off-limits-to-the-public Sumatran Orangtuan Conservation Program (SOCP) quarantine facility in North Sumatra, Indonesia Up close with a rescued Orangutan male at the Bukit Lawang feeding platform, North Sumatra, Indonesia If you’d like to stay in touch with vEcotourism.org, like us on Facebook or follow us on Twitter! This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocum