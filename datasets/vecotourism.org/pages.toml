full_description = "Category Archive: Africa Nov 09 Meet the Chimanuka gorilla family of Kahuzi-Biega National Park, DRC Categories: Africa, DRC, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Kahuzi-Biega National Park, vEcotours by mark Where do the biggest gorillas in the world live? It is well known that gorillas are the largest primate (except for a few very large humans) but we can now take you – virtually – to the only place in the world where you can find the biggest gorilla sub-species, the Eastern Lowland or Grauer’s … Continue reading » This post has no tag Leave comment Oct 13 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 2 Categories: Africa, DRC, Featured Species, Mountain Gorillas, vEcoLive, Virunga National Park by mark Join host Ian Redmond for part two of our virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! This week, we will take you behind-the-scenes of the world’s only orphanage for mountain gorillas, the Senkwekwe Centre, where you will meet André Bauma, one of the heroes … Continue reading » This post has no tag Leave comment Oct 05 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 1 Categories: Africa, DRC, Mountain Gorillas, Rwanda, vEcoLive, Virunga National Park, Volcanoes National Park by mark Join host Ian Redmond on a virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! The tour will trace the story of European interaction with these gentle giants, beginning with the dizzying heights of Mount Sabinyo, pausing in a misty glade to pay our respects at Dian Fossey’s grave, … Continue reading » This post has no tag Leave comment Sep 30 vEcoLive: The Elephants of Queen Elizabeth National Park Categories: Africa, Elephants, QENP, Uganda, vEcoLive by mark In the run up to the Global March for Elephants and Rhinos on October 3rd and 4th in a city near YOU (www.march4elephantsandrhinos.org), join us for a virtual tour of the Craters Circuit in QENP, Uganda, with tour host Ian Redmond, to watch elephants and other wildlife. vEcoLive is our ground-breaking experimental platform that allows virtual … Continue reading » This post has no tag Leave comment Aug 11 Lunch-Break vEcoLive: Meet the Salt-Mining Elephants of Kitum Cave, Kenya! Categories: Africa, Elephants, Featured Species, Kenya, Mount Elgon National Park, vEcoLive by mark To mark the occasion of World Elephant Day, 2015, please join us on your lunch break when Ian Redmond will provide a vEcoLive tour of Kitum Cave in Mt Elgon National Park, Kenya. Bring your own sandwiches and head to live.vecotourism.org to accompany Ian as he narrates, in real-time, a five-location expedition from the Park’s … Continue reading » Tags: elephants, Ian Redmond 6 comments Dec 24 Behind the scenes at the world’s only mountain gorilla orphanage Categories: Africa, DRC, vEcotours, Virunga National Park by mark Just in time for Christmas, the vEco team is delighted to bring you this three-panorama virtual tour of the world’s only mountain gorilla orphanage, the Senkwekwe Center located at the headquarters of the Virunga National Park in Rumangabo, Democratic Republic of the Congo. This post has no tag Leave comment Dec 24 Don’t miss VIRUNGA, the movie! Categories: Africa, DRC, Stories from the Field, Virunga National Park by Ian Redmond Have you seen the oscar-nominated documentary VIRUNGA yet? You should! It is a film with the tense drama, tear-jerking emotion and spectacular imagery of a Hollywood blockbuster, but it is fact not fiction. It features the courageous men and women (and their families) that protect the Virunga National Park in the Democratic Republic of Congo … Continue reading » This post has no tag Leave comment Sep 21 Talking Climate Change from the summit of Mount Kilimanjaro Categories: Africa, Climate change, Tanzania by mark In this spectacular vEcotour join with me, Ian Redmond, to experience the exhilaration of reaching the nearly 6000m Uhuru peak on Mount Kilimanjaro! I recently took on the epic climb up Mount Kilimanjaro, Tanzania to showcase the impact of climate change on our natural and cultural heritage sites. Joining my concerned climate colleagues Ian Singleton, Andy … Continue reading » Tags: Ian Redmond Leave comment Aug 12 Crossing paths with a forest elephant on World Elephant Day Categories: Africa, Bwindi Impenetrable National Park, Uganda by mark vEcotourism.org ambassador Ian Redmond recently had the very good fortune to encounter a magnificent forest elephant while trekking to see mountain gorillas in Bwindi Impenetrable National Park, Uganda. In our latest “taster” vEcotour, published to coincide with World Elephant Day, you’ll join Ian as he observes this marvellous creature calmly feeding in his native habitat, … Continue reading » This post has no tag 2 comments Jul 31 Celebrate World Ranger Day 2014 Categories: Africa, News, Stories from the Field, Team vEco by mark World Ranger Day on 31 July celebrates the remarkable men and women who work to protect our endangered wildlife and threatened ecosystems. With the illegal wildlife trade burgeoning, poachers and smugglers are better funded and have more sophisticated weapons. threatening wildlife and rangers alike. An estimated 1,000 rangers have been killed in the last 10 … Continue reading » This post has no tag Leave comment Older posts « » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality exp