title = "Rwanda » Virtual Ecotourism"
full_description = "Category Archive: Rwanda Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … Continue reading » This post has no tag 2 comments May 12 Welcome, BBC Earth Readers! Categories: Africa, Featured Species, Mountain Gorillas, Rwanda, vEcotours by mark Our Ambassador, Ian Redmond, remembers the mountain gorillas that famously interacted with Sir David Attenborough in the landmark television series ‘Life on Earth‘ for a new article for BBC Earth. Ian recalls introducing the BBC film crew to two of the gorilla groups being studied by Dian Fossey, while he was working as her research … Continue reading » Tags: BBC, BBC Earth, David Attenborough, Dian Fossey, Ian Redmond, Life on Earth, Susa, The Karaoke Research Centre Leave comment Oct 05 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 1 Categories: Africa, DRC, Mountain Gorillas, Rwanda, vEcoLive, Virunga National Park, Volcanoes National Park by mark Join host Ian Redmond on a virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! The tour will trace the story of European interaction with these gentle giants, beginning with the dizzying heights of Mount Sabinyo, pausing in a misty glade to pay our respects at Dian Fossey’s grave, … Continue reading » This post has no tag Leave comment Jun 30 Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Categories: Africa, Conservation Tools, News, Rwanda, Stories from the Field, Team vEco, vEcotours, Volcanoes National Park by mark On 1st July 2014 Rwanda will host the tenth annual ‘Kwita Izina’, a gorilla naming ceremony for each born in the Volcanoes National Park during the year! This year, if you are not able to attend, take a guided virtual tour (vEcotour) with primate expert Ian Redmond during last year’s event when he was given … Continue reading » This post has no tag Leave comment May 28 What would you say if given the chance to talk to the world for 15 minutes? – TEDx talk by Ian Redmond Categories: Africa, New Media, News, Rwanda, Team vEco, Volcanoes National Park by mark vEcotourism ambassador and great ape expert, Ian Redmond was recently invited to give a TEDx talk at Southampton University. After the event, Ian explained to vEco how he felt about this unique and exciting experience: What would you say if given the chance to talk to the world for 15 minutes? I’ve been a fan of TED talks – … Continue reading » This post has no tag Leave comment Feb 10 Experience the fascinating world of the Susa gorilla group in Rwanda, guided by great ape expert Ian Redmond Categories: Africa, Featured Species, Mountain Gorillas, News, Panoramic, Rwanda, vEcotours, Volcanoes National Park by mark Sidle up to one of our world’s greatest living wonders: a group of mighty mountain gorillas browsing and playing in their natural habitat on Mount Karisimbi, Rwanda. Our latest vEcotour features 360 degree images, ambient background sounds, and embedded videos, all captured by our vEco Ambassador and great ape expert, Ian Redmond. Mount Karisimbi, a … Continue reading » This post has no tag 2 comments Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read 