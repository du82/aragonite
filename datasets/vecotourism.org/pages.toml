full_description = "Category Archive: Africa Oct 08 Great Apes Summit Delegates Issue Statement on Palm Oil Categories: Africa, Indonesia, News by mark Meeting this past September in Jackson Hole, Wyoming, the Great Apes Summit Delegates drafted a list of six key action points in the face of the rapid and under-regulated expansion of oil palm plantations across Asia and Africa. The action points target all levels of the oil palm industry, from governments to consumers, in hopes … Continue reading » This post has no tag Leave comment Oct 07 Team Uganda Reunited Categories: Africa, Team vEco, Uganda by mark vEco’s globetrotting ambassador, Ian Redmond (pictured on the right), met up with two of vEco’s most dedicated collaborators this past weekend: Jackson Efitre (center, Lecturer at the Department of Biological Sciences, Makerere University) and Mark Olokotum (left, M.Sc. student at Makerere University and Research Assistant with NaFIRRI-Jinja). The trio then met up with The Gorilla … Continue reading » This post has no tag 1 comment Oct 01 Four Africans, Indonesians honoured with the GRASP-Ian Redmond Conservation Award Categories: Africa, Indonesia, News, Team vEco by mark Created to encourage innovation, build partnerships, inspire leadership, and offer hope in the field of great ape conservation, the GRASP-Ian Redmond Conservation Award was given to four dedicated individuals September 22nd at the Great Apes Summit in Jackson Hole, USA. The four winners were: Panut Hadisiswoyo from Indonesia, who works to address human-orangutan conflict issues in … Continue reading » This post has no tag Leave comment Sep 21 Eight new vEcotours to explore! Categories: Africa, Indonesia, vEcotours by mark In a push to give you, the public, a bit more to chew on as we continue to develop the technical side of vEcotourism.org, we’ve put eight new vEcotours online. The new sites range from the lofty heights of Mt Sabinyo in Uganda to deck-level on a fishing boat in Saleh Bay, Indonesia. Click on … Continue reading » This post has no tag Leave comment Jul 13 Taking vEcotours to new heights Categories: Africa, Mgahinga National Park, News, Uganda by mark Check out this panoramic photo that’s recently arrived courtesy of our Ugandan team. Showing the dramatic trail to the summit of Mt Sabinyo, where three countries meet (Uganda, Rwanda and the Democratic Republic of Congo, altitude 3,645 metres, 11,959 ft) this was taken on a media-collecting tour of Western Uganda, including Mgahinga National Park and … Continue reading » Tags: Panoramic 1 comment Dec 20 Listen to the waves of Lake Nabugabo Categories: Africa, Conservation Tools, Nabugabo, News, Uganda by mark The vEco team in Uganda has been hard at work collecting images, panoramas, and sounds at our new site on the shores of Lake Nabugabo. Enjoy this panorama near the shore, complete with sampled audio. Tags: conservation, new technology, panoramic photos 1 comment » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcano