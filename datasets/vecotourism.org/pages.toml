title = "Tusk to Dust: experience the emotion as 3.5 tonnes of ivory are destroyed in Paris, France » Virtual Ecotourism"
full_description = '''« Celebrate World Ranger Day 2014 Crossing paths with a forest elephant on World Elephant Day » Aug 11 Tusk to Dust: experience the emotion as 3.5 tonnes of ivory are destroyed in Paris, France Categories: News, Team vEco, vEcotours by mark Ahead of World Elephant Day 2014 on August 12th, watch alongside vEcotourism’s ambassador, Ian Redmond, as 3.5 tonnes of illegal ivory tusks are crushed in Paris, France in February 2014. Highlighting the shocking illegal trafficking of ivory which is killing over 30,000 elephants each year, this exceptional event sent a clear message: it is unacceptable to allow this trade to continue. “In the midst of photographing the scene, doing panos and videoing the action, I was suddenly struck by a pang of emotion while watching the tusks carried along the conveyor belt”, explains Ian, “It was a very moving moment to realise this was effectively a mass funeral, respectfully bidding farewell to the last remains of hundreds of elephant-beings.” The crush in Paris followed similar shows of support for halting the ivory trade from Gabon, the Philippines, the USA and China. Immerse yourself in this extraordinary event with our latest virtual tour (vEcotour) and say ‘No!’ to the destructive ivory trade. Click on the image above or map below to start your tour. Read more about the ivory crush and the plight elephants are facing at http://bloodyivory.org/ and http://www.bornfree.org.uk/campaigns/elephants/campaign-action/ivory-trade/ivory-crush-paris/ This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); 2 pings Crossing paths with a forest elephant on World Elephant Day » Virtual Ecotourism August 12, 2014 at 5:31 am (UTC 0) Link to this comment Reply […] « Tusk to Dust: experience the emotion as 3.5 tonnes of ivory are destroyed in Paris, France […] Crossing paths with a forest elephant on World Elephant Day | Chimp-n-Sea August 12, 2014 at 7:38 am (UTC 0) Link to this comment Reply […] Click the image above to start your tour. Make sure you also view Ian’s thought-provoking vEcotour of the Paris ivory crush that took place this past February by clicking through within this taster or by clicking here. […] Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park