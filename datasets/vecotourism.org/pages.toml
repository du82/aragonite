["https://www.vecotourism.org/news/about-vecotourism/meet-the-team"]
title = "The Team » Virtual Ecotourism"
full_description = '''↑ Return to Philosophy The Team Mark Laxer: Vermont USA. Mark–with a degree in literature and computer science from the University of California, San Diego– is passionate about using modern technology and traditional storytelling to share wildlife conservation stories with people around the world. He has written three books, the latest of which can be found, free, here: www.ramatraumatrump.com @marklaxer on twitter, mark.laxer on instagram, Mark Laxer youtube channel, Take Me For A Ride podcast. Ian Redmond: Bristol, UK. Ian Redmond is a wildlife biologist and conservationist, renowned for his work with great apes and elephants. As with his mentor, the late Dr Dian Fossey, the focus of his work shifted in 1978 from research to conservation work, after poachers killed Digit – a famous young silverback – to sell his skull and hands. He established and chairs The Ape Alliance, served as Ambassador for the UN Year of the Gorilla 2009, and was awarded an OBE for services to conservation in 2006. Matt Redmond: London, UK. Matt Redmond studied Physical Geography and Computer Science at Keele University. He is fascinated by the possibilities of emerging web technologies and how they can further environmental education. His other interests include bicycles, travel, linux and juggling. He can be reached at matt (at) vecotourism (dot) org. Erica Laxer: Vermont, US. Erica is helping to conceptualize and develop new tools for kids to learn about wildlife and wild places. Oliver Laxer: Vermont, US. Oliver is helping to conceptualize and develop new tools for kids to learn about wildlife and wild places. – Thanks to those who have helped! – Jay Ploss, Developer and manager, Quebec, Canada. Jay is a brilliant designer and technologist who maps latest hardware and software innovations into 3D virtual reality space in compelling and educational ways. Lauren Chapman: Montreal, Canada. Dr. Lauren Chapman is a nature conservationist and project coordinator for the Kibale Health & Conservation Project. Her research focuses on aquatic ecology and conservation and involves field studies based at the Makerere University Biological Field Station and Fisheries Resources Research Institute in Uganda. Lauren holds a Canada Research Chair in Respiratory Ecology and Aquatic Conservation, and is a lecturer at McGill University in Montreal, Canada and Mackere University in Kampala, Uganda. Colin Chapman: Washington DC, US. Dr. Colin Chapman received his joint Ph.D. in the Departments of Anthropology and Zoology at the University of Alberta. He spent 2 years at McGill and 3 years at Harvard University doing post-doctoral research. Since 1990 he has served as an Honourary lecturer in the Department of Zoology at Makerere University Uganda; and, since 1995, he has been an associate scientist with the Wildlife Conservation Society. Colin also served as a faculty member in Zoology at the University of Florida for 11 years, and returned to McGill in 2004 to take up a professorship in the Department of Anthropology and McGill School of Environment, where he held a Canada Research Chair Tier 1 position in Primate Ecology and Conservation. In 2019, he left McGill and took up a position at George Washington University as being in Washington allows him to be more engaged in conservation globally. It was a great pleasure and honor for him to work with the National Geographic Society for nine years helping to guide their grant giving and program development. In 2018, he became a faculty member at the University of KwaZulu-Natal and College of Life Sciences in Northwest University, Xi’an, China. Colin has had the pleasure to conduct research in Kibale National Park, Uganda, for 30+ years, where he focuses on the roles that disease, nutrition, stress, and climate change play in determining primate abundance, while also exploring how to best to conserve the world’s biodiversity. Tom Richards: Video Editor, Bristol, UK Tom Richards is a naturalist and wildlife filmmaker based in Bristol, having just finished an MA in Wildlife Filmmaking at the University of the West of England. As part of the course there he went to Nigeria to film the pioneering attempted release of 200 drill monkeys, an experience through which he honed a wide skill set including research, shooting and editing. He is currently working on editing footage from Ian Redmond’s visit to Bukit Lawang, Sumatra. Check out more of Tom’s work at his website: www.tomrichardswildlife.com Marta Lupion: Video Editor, Bristol, UK. A Spanish video editor now based in the UK, Marta Lupion is a talented editor, camera operator, and graphic artist. Professional, efficient, and creative, she has been instrumental in producing vEco’s upcoming youth-focused Kahuzi-Biega Gorilla vEcotour. See her online portfolio at http://www.martalupion.com/ or write her at martalupion (at) gmail (dot) com. Warren Tivy: Audio Engineer, Cork, Ireland Warren is a audio engineer, musician, location recordist, and composer working for studios and freelance with qualifications in sound engineering, music technology, location recording, Logic Pro, Final Cut Pro, and Ableton live. Warren has a great love of animals, outdoor adventures and wildlife conservation. “I am proud to be part of a team that does such great work for wildlife.” Visit his website at www.claycastlerecording.ie or reach out to him at hatzt (at) outlook (dot) com. Toby Cresswell: Video Editor, Bristol, UK. Toby brings his background as a natural history, environment, and conservation topic researcher to his new career shooting and editing wildlife film. He’s currently working on footage from Ian Redmond’s encounters with gorillas in the DRC and Uganda. Visit his website at tobyjcresswell.com or contact him at tobyjcresswell (at) gmail (dot) com. Toby Greet: Video Editor, Bristol, UK. Toby Greet is a freelance editor and edit assistant based near Bristol, UK. In addition to his work with wildlife films, he has also built a portfolio of lifestyle, documentary, corporate, and wedding productions. More information and his showreel are available here: www.tobygreet.com Isaac Blanc: Video Editor, Bristol, UK. Isaac Blanc is a fifteen year-old budding screenwriter-cum-indie-filmmaker based in the United Kingdom. His work with vEco has been focused on editing and grading video footage for the Mount Elgon elephant tour and the Congo-Brazzaville ivory-burn tour, where he has distinguished himself in both the quality of his work and his professionalism. While his dream is to be a professional writer/director, he is deeply interested in every stage of the filmmaking process, especially cinematography. His non-vEco work can be seen on Vimeo and Flickr and you can drop him a line at isaacblancfilm@yahoo.com Arthur Kasirye: Web Developer, Kampala, Uganda Kasirye Arthur is a web developer and technology enthusiast based in Kampala, Uganda. He studied at Makerere University Business School with a major in Business Computing. He loves studying and discovering how things work, and when he is off he loves playing chess and virtual games. He can be reached at arthur.k186@gmail.com or follow him on Twitter at @braindventure. (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search'''
