rapher and tour guide for apapers.org in Uganda, and will be bringing vEco content from East Africa as well as presenting vEco materials to local communities. I invite you to “Be part of the conversation and conservation”! I hold a BSc in Fisheries and … Continue reading » This post has no tag 4 comments Oct 07 Team Uganda Reunited Categories: Africa, Team vEco, Uganda by mark vEco’s globetrotting ambassador, Ian Redmond (pictured on the right), met up with two of vEco’s most dedicated collaborators this past weekend: Jackson Efitre (center, Lecturer at the Department of Biological Sciences, Makerere University) and Mark Olokotum (left, M.Sc. student at Makerere University and Research Assistant with NaFIRRI-Jinja). The trio then met up with The Gorilla … Continue reading » This post has no tag 1 comment Oct 01 Four Africans, Indonesians honoured with the GRASP-Ian Redmond Conservation Award Categories: Africa, Indonesia, News, Team vEco by mark Created to encourage innovation, build partnerships, inspire leadership, and offer hope in the field of great ape conservation, the GRASP-Ian Redmond Conservation Award was given to four dedicated individuals September 22nd at the Great Apes Summit in Jackson Hole, USA. The four winners were: Panut Hadisiswoyo from Indonesia, who works to address human-orangutan conflict issues in … Continue reading » This post has no tag Leave comment Older posts « » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some del