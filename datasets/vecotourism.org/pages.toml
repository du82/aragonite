title = "Partners » Virtual Ecotourism"
full_description = '''↑ Return to Philosophy Partners We’ve worked with… Ape Alliance, UK www.4apes.com The Ape Alliance, which started in 1996, is an international coalition of organisations and individuals working for the conservation and welfare of apes. It exists to provide a forum for discussion of issues relating to apes, develop position papers on key issues, lobby collectively for enactment and/or enforcement of legislation to improve the welfare and/or conservation of apes, campaign for greater public awareness of ape issues and increase respect for apes, and facilitate information exchange between member groups and, where appropriate, coordinate activities to maximise their beneficial effect. Born Free Foundation, UK www.bornfree.org.uk As an international wildlife conservation organisation working worldwide to protect animals in their natural habitat, Born Free represents a fitting partner for vEcotourism. Born Free hopes to capture panoramas of the effective wildlife projects they support creating, with vEcotourism’s help, an engaging and informative experience for their supporters based around the world. As Laura Gosset, Programmes Assistant at Born Free explains; ”The potential for vEcotourism is phenomenal, with forseeable uptake for wildlife education, training and of course armchair tourism, giving you a real taste of the jungle from your desk.” Wildlife Conservation Society (WCS), USA www.wcs.org A long-term partner of vEcotourism, WCS supports wildlife and habitat conservation around the world, with roughly 500 projects currently active in 60 countries. The WCS help vEcotourism produce a wonderful vEcotour alongside the Ugandan Wildlife Authority (see A tree-climbing lion, Uganda), most of which will be published in mid-2014. It is hoped that WCS will continue to work alongside vEcotourism using immersive panorama technology to capture other magnificent scenes of the projects that they support. Kibale Health and Conservation Project www.kibale-health-conservation.mcgill.ca/ The Kibale Health and Conservation Project works to provide healthcare to the local communities surrounding Kibale National Park as well as create tangible benefits from the Park to improve community-park relations. Set up by vEcotourism Project Advisors Dr.’s Colin and Lauren Chapman, the project works closely with vEcotourism’s team on the ground in Uganda. The New Nature Foundation, Uganda www.newnaturefoundation.org Managed by The New Nature Foundation since 2009, The Kibale Fuel Wood Project was established in 2006 under the auspices of Chimp-n-Sea Wildlife Conservation Fund. The project works with Ugandans living around Kibale National Park to empower people and facilitate home grown wood and fuel efficient cooking. Why? Kibale National Park, home to the densest population of primates in Africa, as well as elephants, leopards and more, is being cut down for firewood. An extensive public education campaign including the establishment of local natural history museums and traveling movie shows, the project has convinced hundreds of families to start caring more about the park and act to protect it. Sadabe, Madagascar www.sadabe.org SADABE has been collaborating with Chimp-n-Sea and vEcotourism since 2009. Part of vEcotourism’s early interactive vEcotours SADABE vEcotours took place in the Andoakoho region of Mahatsinjo village. Providing a unique experience of the unique Mahatsinjo landscape and its mix of human habitation and rainforest these early tours offered a window into the region’s memorable landscape, wildlife and culture. NaFIRRI, Uganda www.firi.go.ug/ The National Fisheries Resources Research Institute (NaFIRRI) is the Ugandan authority for fisheries, aquaculture and the freshwater environment. The Institute works to develop and disseminate fisheries technologies and information for increased but sustainable fish production; conserve the fisheries genetic resources, water quality and fish habitat; develop and manage the research and relationships with stakeholders in order to enhance the contribution of fisheries research to increased and sustainable fish production and conservation of the natural resource base. Lembaga JARI, Indonesia http://www.chimp-n-sea.org/projects/international-floating-marine-park/ JARI is an NGO based in Lombok, Indonesia. Founded in 1997 its mission is to support sustainable seas through community-based education, research, ecotourism, and integrated coastal management. In 2001, Chimp-n-Sea and JARI founders came up with the idea of an ‘International Floating Marine Park’ to help with this mission. Today this dream is becoming reality with the purchase of a 51ft boat. Called Yosina it will operate in Sumbawa and Lombok and be a base for vEcotours, as well as a platform for research, education and ecotourism. (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror 