full_description = "Category Archive: New Media May 28 What would you say if given the chance to talk to the world for 15 minutes? – TEDx talk by Ian Redmond Categories: Africa, New Media, News, Rwanda, Team vEco, Volcanoes National Park by mark vEcotourism ambassador and great ape expert, Ian Redmond was recently invited to give a TEDx talk at Southampton University. After the event, Ian explained to vEco how he felt about this unique and exciting experience: What would you say if given the chance to talk to the world for 15 minutes? I’ve been a fan of TED talks – … Continue reading » This post has no tag Leave comment Apr 23 vEcotourism needs your help! Categories: Internet Technology, New Media, Team vEco, vEconauts, vEcotours by mark Would you like to get a sneak peek at vEco’s latest and greatest innovations? Become a vEconaut! We need your help to test out the freshest content from vEcotourism.org. As a vEconaut, you will help vEcotourism to ensure it produces the best, bug-free vEcotours, bringing immersive and interactive experiences of amazing places and wildlife around … Continue reading » This post has no tag Leave comment Feb 20 vEco flys to San Francisco for the final round of the DML competition Categories: Internet Technology, New Media by mark Having successfully advanced through Stage I and Stage II of the Digital Media and Learning Badges for Lifelong Learning Competition, the contest organizers have invited two members of the Virtual Ecotourism team to San Francisco to pitch the project in person! With flowers in our hair, we head to San Francisco for … Continue reading » Tags: badges, digital learning, funding, New Media Leave comment Jan 31 Stage II – Digital Media and Learning Badges Competition Categories: Internet Technology, New Media by mark After winning Stage I of the DML Badges Competition, the virtual ecotourism team decided to take destiny into our own hands and entered our own unique badging system in Stage II of the competition. If we are successful in this stage we will be competing in a live showdown with other winners in San Francisco, USA, … Continue reading » Tags: badges, digital learning, funding, New Media Leave comment Dec 27 DML Badges Competition: Virtual Ecotourism Advances to Stage II! Categories: Internet Technology, New Media, News by mark The team is very proud to announce that the virtual ecotourism project has been chosen, out of over 350 applicants, to advance to Stage Two of the Digital Media and Learning Badges Competition. This means that our content was deemed compelling and original, and capable of evaluating 21st century learning as part of a worldwide badge … Continue reading » Tags: badges, digitial learning, funding, hastac, New Media 1 comment Dec 05 Audio & Video Enabled Panoramic Photo Categories: Conservation Tools, New Media by mark The Virtual Ecotourism team has been experimenting with an even more interactive form of 360° panoramic photo. In partnership with the MSc in Biodiversity, Conservation and Management (BCM 2011-2012) at The University of Oxford, we have created an audio and video enabled pano. Tags: conservation, ecosystem services, msc biodiversity, the university of oxford Leave comment Nov 20 Digital Media & Learning Competition Categories: Internet Technology, New Media, News by mark The Virtual Ecotourism project has entered the Digital Media & Learning Badges Competition in a bid to win part of a $200,000 grant for the development of a badging system to reward on-line learning that is difficult to assess in other ways. Tags: badges, digitial learning, hastac 2 comments Nov 07 Welcome to the vEcotourism News Site! Categories: Internet Technology, New Media, News by mark The aim of this blog is to keep virtual ecotourists, partner organizations, and curious conservationists updated about the vEcotourism project. It will outline our current work, showcase initial vEcotours as they are developed, link to exciting upcoming technologies, promote conservation projects, host visual media from tours, and serve to keep the vEcotourism community informed and connected. To learn more about … Continue reading » Tags: conservation, New Media, virtual ecotourism Leave comment Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
