full_description = "Category Archive: Conservation Tools Feb 04 Mobile Clinic arrival marks a special day for the Kibale Health and Conservation Project, Uganda Categories: Africa, Conservation Tools, Kibale, News, Uganda by mark Today represents a fantastic result for vEcotourism Project Advisors Dr.’s Colin and Lauren Chapman; a long-awaited mobile clinic van for Kibale National Park has finally arrived in Uganda. The Kibale Health and Conservation Project, founded by the couple, works to to provide health care to the local communities surrounding Kibale National Park as well as … Continue reading » This post has no tag Leave comment Nov 15 Good news for Orangutans! Categories: Conservation Tools, Indonesia, News by mark Thanks in large part to fierce protest on the part of consumers concerned with non-sustainable palm oil, the food giant Ferrero has announced that it will be obtaining 100% of its palm oil from traceable segregated, RSPO-certified sources by the end of 2014, a full year ahead of its previously announced schedule. Ferrero, which manufactures … Continue reading » This post has no tag 2 comments Dec 20 Listen to the waves of Lake Nabugabo Categories: Africa, Conservation Tools, Nabugabo, News, Uganda by mark The vEco team in Uganda has been hard at work collecting images, panoramas, and sounds at our new site on the shores of Lake Nabugabo. Enjoy this panorama near the shore, complete with sampled audio. Tags: conservation, new technology, panoramic photos 1 comment Dec 05 Audio & Video Enabled Panoramic Photo Categories: Conservation Tools, New Media by mark The Virtual Ecotourism team has been experimenting with an even more interactive form of 360° panoramic photo. In partnership with the MSc in Biodiversity, Conservation and Management (BCM 2011-2012) at The University of Oxford, we have created an audio and video enabled pano. Tags: conservation, ecosystem services, msc biodiversity, the university of oxford Leave comment » Newer posts Welcome t