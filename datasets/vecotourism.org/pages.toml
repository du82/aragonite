full_description = "Category Archive: Africa Jun 30 Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Categories: Africa, Conservation Tools, News, Rwanda, Stories from the Field, Team vEco, vEcotours, Volcanoes National Park by mark On 1st July 2014 Rwanda will host the tenth annual ‘Kwita Izina’, a gorilla naming ceremony for each born in the Volcanoes National Park during the year! This year, if you are not able to attend, take a guided virtual tour (vEcotour) with primate expert Ian Redmond during last year’s event when he was given … Continue reading » This post has no tag Leave comment Jun 18 Get up close and personal with wild red colobus monkeys on Zanzibar Categories: Africa, News, Stories from the Field, Tanzania, Team vEco, vEcotours, Zanzibar by mark vEcotourism ambassador Ian Redmond recently touched down on the beautiful island of Zanzibar for a 24-hour whirlwind visit. Trekking through the island Ian encountered various interesting landscapes which vEcotourism will shortly be shaping into a full-fledged multi-pano, multi-hotspot vEcotour. As a taster, we have put together a quick vEcotour of Jozani Forest in Zanzibar’s only … Continue reading » This post has no tag 1 comment Jun 11 vEcotourism engages with Ugandan students at Makerere University Categories: Africa, Murchison Falls National Park, News, Stories from the Field, Team vEco, Uganda, vEcotours by mark Ugandan vEco blogger and photographer, Mark Olokotum (a.k.a. Mark O!), broke new ground this past Friday, June 6th, as he introduced students of the Department of Biological Sciences at Makerere University, Uganda, to the wonders and possibilities of vEcotourism. Introduced by vEco Tour Guide and Content Developer, Jackson Efitre, Mark O dazzled the group with … Continue reading » This post has no tag Leave comment May 28 What would you say if given the chance to talk to the world for 15 minutes? – TEDx talk by Ian Redmond Categories: Africa, New Media, News, Rwanda, Team vEco, Volcanoes National Park by mark vEcotourism ambassador and great ape expert, Ian Redmond was recently invited to give a TEDx talk at Southampton University. After the event, Ian explained to vEco how he felt about this unique and exciting experience: What would you say if given the chance to talk to the world for 15 minutes? I’ve been a fan of TED talks – … Continue reading » This post has no tag Leave comment Apr 11 Scrambling up the Albertine Escarpment, Uganda Categories: Africa, Mark O's blog, Uganda, vEcotours by mark Today we are travelling to the Albertine Graben region in the East African Rift Valley. I visited this area to perform an environmental impact assessment (EIA) for the Chinese oil giant, CNOOC, as the Rift Valley is thought to contain large amounts of natural gas and oil. To access the site I had to climb … Continue reading » This post has no tag 1 comment Mar 21 Experience the roar of the magnificent Murchison Falls, Uganda Categories: Africa, Murchison Falls National Park, Uganda by mark In December 2013 I travelled to the remarkable Murchison Falls, also known as Kabalega Falls, in north west Uganda. Located within Uganda’s largest protected area, the Murchison Falls National Park, the area is characterised by green, pristine vegetation scattered with diverse wildlife. You can join me on my travels through this vEcotour; experience the thunderous … Continue reading » Tags: buffalo, elephants, Murchison Falls, Nile, Uganda, vEcotourism, virtual ecotourism Leave comment Feb 17 vEco’s gift to you: the view of a lifetime! Categories: Africa, Uganda by mark To say thank you for the enthusiastic reception and all the fantastic feedback that vEcotourism.org has recently received, we wanted to give something back! Just like vEco Ambassador Ian Redmond, you too can enjoy the spectacular view over the hills on the southern edge of Bwindi Impenetrable National Park, Uganda. Simply click on the image or links below … Continue reading » This post has no tag Leave comment Feb 13 Presenting vEco’s first blogger: Mark O! Categories: Africa, Mark O's blog, News, Stories from the Field, Team vEco, Uganda by mark My name is Mark Olokotum alias Mark O! I am the main photographer and tour guide for apapers.org in Uganda, and will be bringing vEco content from East Africa as well as presenting vEco materials to local communities. I invite you to “Be part of the conversation and conservation”! I hold a BSc in Fisheries and … Continue reading » This post has no tag 4 comments Feb 10 Experience the fascinating world of the Susa gorilla group in Rwanda, guided by great ape expert Ian Redmond Categories: Africa, Featured Species, Mountain Gorillas, News, Panoramic, Rwanda, vEcotours, Volcanoes National Park by mark Sidle up to one of our world’s greatest living wonders: a group of mighty mountain gorillas browsing and playing in their natural habitat on Mount Karisimbi, Rwanda. Our latest vEcotour features 360 degree images, ambient background sounds, and embedded videos, all captured by our vEco Ambassador and great ape expert, Ian Redmond. Mount Karisimbi, a … Continue reading » This post has no tag 2 comments Feb 04 Mobile Clinic arrival marks a special day for the Kibale Health and Conservation Project, Uganda Categories: Africa, Conservation Tools, Kibale, News, Uganda by mark Today represents a fantastic result for vEcotourism Project Advisors Dr.’s Colin and Lauren Chapman; a long-awaited mobile clinic van for Kibale National Park has finally arrived in Uganda. The Kibale Health and Conservation Project, founded by the couple, works to to provide health care to the local communities surrounding Kibale National Park as well as … Continue reading » This post has no tag Leave comment Older posts « » Newer posts Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
