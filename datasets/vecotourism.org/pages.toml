full_description = '''↑ Return to Take A Tour Global Overview From this global perspective you may explore vEcotours from four continents (and counting!). Every vEcotour features an immersive full-sphere panorama and a voiced introduction. In addition, some of the tours also feature close-up photos, embedded videos and audio, and interviews to enrich the experience. Click on a location pin, or a cluster of pins, to get started. If you’d like to support some or all of the projects featured in these vEcotours, please consult the following directory: Lola Ya Bonobo Sanctuary (vEcotour) http://www.friendsofbonobos.org Lwiro Primate Sanctuary (vEcotour) http://www.lwiroprimates.org Dian Fossey’s Grave (vEcotour) http://gorillafund.org Tree-Climbing Lions of Ishasha (vEcotour) http://www.wcs.org Great Gorilla Run Popup Shop (vEcotour) http://gorillas.org Mt Sabinyo Gorilla Habitat (vEcotour) http://www.wcs.org Yosina: the Floating Classroom (vEcotour) http://www.chimp-n-sea.org (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); 3 pings #seriousaboutwildlifecrime » Virtual Ecotourism March 3, 2015 at 5:47 pm (UTC 0) Link to this comment Reply […] Take a Tour […] Celebrate World Ranger Day 2014 | Virtual Ecotourism July 11, 2016 at 8:09 am (UTC 0) Link to this comment Reply […] Many of the vEcotours featured on this site would not have been possible without the remarkable efforts of rangers. From the protective gorilla guides in Rwanda to viewing a tree-climbing lion in Uganda, rangers have contributed their efforts in each and every tour. Why not celebrate by taking one or two vEcotours here? […] Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
