full_description = "Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s 2018 “Living Planet Report” wherein the venerable conservation organization estimates that the Earth has lost 60% of its vertebrate species abundance in only the last 40 years. Ian called for all people to start looking to species conservation as “enlightened … View full post Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development engine, we’re bringing all kinds of innovative 360 features into the fold, like true 3D menu scenes, spatial audio, and in-tour minigames! Because not all of these new features are available as part of a finished tour at this time, … View full post vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the United Nations Convention on the Conservation of Migratory Species meeting in Manila recently. The 12th Conference of the Parties to the CMS, hosted by the Government of the Philippines, brought together delegates and observers from the 124 signatory countries and … View full post Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … View full post vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, on his recent Animal Hero award from the RSPCA & Daily Mirror. Ian was selected for the “Next Generation” award for his tireless efforts to inspire future generations to safeguard Earth’s natural wonders. Follow this link to read the full … View full post Ian Redmond reacts to the WWF Report on Sky NewsIntroducing vEco Labs!vEcotourism at UN CMS CoP12 in the PhilippinesHappy World Gorilla Day!vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! Nov 02 Ian Redmond reacts to the WWF Report on Sky News Categories: News, Team vEco by mark vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s 2018 “Living Planet Report” wherein the venerable conservation organization estimates that the Earth has lost 60% of its vertebrate species abundance in only the last 40 years. Ian called for all people to start looking to species conservation as “enlightened self-interest” and encouraged governments to set up programs to divert significant resources towards preserving the biosphere. The full report is available from the WWF, here. Tags: WWF Leave comment Mar 13 Introducing vEco Labs! Categories: News by mark 360 “2.5D” pano with CGI mist accents Now that the vEco team has migrated our core technology over to the Unity development engine, we’re bringing all kinds of innovative 360 features into the fold, like true 3D menu scenes, spatial audio, and in-tour minigames! Because not all of these new features are available as part of a finished tour at this time, we’ve created the vEco Labs app as a way for our users and potential clients to check out what we’re working on. Download the iOS or Android mobile app for free, now! Read the rest of this entry » This post has no tag Leave comment Nov 21 vEcotourism at UN CMS CoP12 in the Philippines Categories: Conservation Tools, Elephants, Internet Technology, News, vEcotours by mark Virtual reality experiences of nature were a highlight for some delegates and volunteers at the United Nations Convention on the Conservation of Migratory Species meeting in Manila recently. The 12th Conference of the Parties to the CMS, hosted by the Government of the Philippines, brought together delegates and observers from the 124 signatory countries and observers from NGOs, IGOs and countries considering whether to sign. vEcotourism.org was there to demonstrate our two published apps and give previews of new ones to come. An enthusiastic team of volunteers brought the booth to life, downloading the apps onto their smartphones and using VR headsets kindly loaned by the Ape Alliance www.4apes.com to take interested delegates on a virtual safari to see the great apes, using ApeAppVR and Gorilla Safari VR. Gorillas are already listed on the CMS appendices and protected by the Gorilla Agreement, a legally binding treaty between the 10 African countries in which they live. At this meeting, chimpanzees were – after some heated debate – also listed, and will now benefit from better cross-border protection where their habitat straddles international borders! Team vEco would like to express gratitude to the CMS Secretariat, the Philippines International Conference Centre and all the volunteers, including: Ana Patricia Sison, Keith Deephy, Paula T. Apulinn, Jex O. Trinanes, Karyz Arboleda, Princess Lim, Frances Tenorio and Thomas Bell. This post has no tag Leave comment Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of the two images from Karisoke to begin your virtual tour. Read the rest of this entry » This post has no tag 2 comments Sep 20 vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! Categories: Elephants, Featured Species, Team vEco by mark The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, on his recent Animal Hero award from the RSPCA & Daily Mirror. Ian was selected for the “Next Generation” award for his tireless efforts to inspire future generations to safeguard Earth’s natural wonders. Follow this link to read the full award text, and check out the video below to hear about Ian’s journey from research to animal advocacy as well as a personal congratulations from Sir David Attenborough. Here’s to many more years of engaging young people all around the world, especially using our very own cutting-edge virtual tour technology! “One of our leading conservationists, Ian has helped make films that have inspired millions and given young people around the world a unique insight into the natural world” – Animal Hero Awards 2017 This post has no tag Leave comment Sep 15 London’s Great Gorilla Run 2017! Categories: Africa, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Mountain Gorillas, Team vEco by Ian Redmond There are fun runs and then there is the GREAT GORILLA RUN — more fun for a good cause than any other event in conservation! At least that is what British comedian and TV naturalist Bill Oddie says. Tomorrow, Saturday 16th September, the 15th Great Gorilla Run will see hundreds of people dressed as gorillas, with fancy dress on top, run for 5 miles (8km) through the heart of London — past St Paul’s Cathedral, the Shard and over Tower Bridge — all to raise funds for the important work of the Gorilla Organization. Two members of Team vEco will be running — so if you can make it to London to cheer them on, come and join the party. If not, click HERE to travel back in time to 2014’s run, and when you’ve seen Bill Oddie and Uri Geller presenting medals and admired the inventiveness of the costumes, please visit the JustGiving pages of the Punk Gorillas or Ian Redmond and chip in a few £,$ or € for the real gorillas (who you can also visit virtually) and the communities living around their forest. Thank you very much. This post has no tag Leave comment Feb 07 Marching for an end to the domestic ivory trade in the UK Categories: Africa, Elephants by mark Come along with our vEco Ambassador, Ian Redmond, as he co-presents a petition to end the UK domestic ivory trade to 10 Downing Street. Recorded at the Global March for Elephants and Rhinos in London last year, this 360 video is especially relevant as the UK parliament just discussed this issue yesterday! This post has no tag Leave comment Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William Award for Conservation in Africa, and then we leap over 6000km to join the Easter Lowland Gorilla patriarch, Chimanuka, in his native habitat in Kahuzi-Biega National Park in the Democratic Republic of the Congo. This app works with both phones and tablets and with or without a virtual reality headset. Enjoy your Gorilla Safari! To learn more about John Kahekwa and his community-based conservation initiative, the Pole Pole Foundation, click here. To support Born Free and Pole Pole’s conservation efforts, join Born Free’s Adopt-A-Gorilla program! This post has no tag Leave comment Dec 01 Virtual field trip with vEcotours Categories: Conservation Tools, vEcotours by mark vEcotours has entered the classroom once again, this time taking children from Walmore Hill Primary School in Gloucestershire, England on a virtual safari. Our ambassador, naturalist Ian Redmond OBE, gave a natural history lesson to pupils, who were encouraged to think about elephants and what it may be like to be one. In a workshop titled: ‘If I’d been born an elephant…’, vEcotourism.org was used to demonstrate the diverse habitats that elephants can live in, and was used to help children see through the eyes of an elephant, in preparation for the rest of the workshop, which included making elephant costumes and role-playing being baby elephants. Mr Stevenson of Walmore Hill Primary School said: “Ian Redmond brought these magnificent animals to life for the children in a fun and educational way. Natural history is an important part of the curriculum and we are privileged to have Ian visit our school and inspire our children with such a vital environmental message.” For more information visit: http://www.blakeneyschool.co.uk/Walmore_Hill/elephants.html Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR Leave comment Nov 16 Praise for vEcotourism.org from the United Nations’ Great Apes Surival Partnership! Categories: Bonobos, Bornean Orangutans, Chimpanzees, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Internet Technology, Mountain Gorillas, News, Sumatran Orangutans, UN-GRASP by mark Some very kind words about vEco from Doug Cress, Programme Coordinator for the United Nations’ Great Apes Survival Partnership! If you’ve got a VR headset, give apeAPP VR a spin on your Android or Apple smartphone 🙂 http://www.un-grasp.org/vr/ This post has no tag Leave comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate 