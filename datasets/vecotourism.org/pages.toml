full_description = "Category Archive: Indonesia Sep 15 Yosina’s Maiden Voyage Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Witnessing the destruction of the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces by pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing, the Chimp-n-Sea Wildlife Conservation Fund (vEco’s parent organization), and partner JARI had to do something. In 2013, the ‘Yosina’ was purchased with the aim … Continue reading » This post has no tag Leave comment Aug 19 Welcome, Guardian readers! Categories: Conservation Tools, Indonesia, News by mark vEcotourism.org is pleased to welcome readers of The Guardian’s “Notes&Theories” segment, arriving at our site following our mention in the recent piece entitled “Support our red-haired cousins, the orangutans, before it’s too late“. You can join your host, Ian Redmond, OBE, in our unique interactive virtual ecotours of Orangutan habitat and conservation efforts in Sumatra by … Continue reading » This post has no tag Leave comment Jul 14 A home away from home in Lombok, Indonesia Categories: Indonesia, Stories from the Field by mark In our latest vEcotour experience Dr. Helena Baird’s beautiful “home away from home” in Indonesia as she volunteers with vEcotourism’s partner, marine protection organisation JARI “Volunteering in a developing country is more than just the work itself” Helena explains, “it’s an entirely immersive, challenging and uplifting experience. I have almost been in Indonesia for six … Continue reading » This post has no tag 1 comment Jun 16 Help launch the good ship Yosina and protect threatened Indonesian marine ecosystems Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Encompassing the greatest diversity of coral reefs and fish in the world, the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces serious threats from pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing. Seeing the destruction for themselves, in 2001 the Chimp-n-Sea Wildlife Conservation Fund (vEco’s … Continue reading » This post has no tag 1 comment May 30 Helena’s first vEcotour: JARI HQ, Lombok, Indonesia Categories: Indonesia, News, Stories from the Field, vEcotours by mark vEco is proud to present the first ever vEcotour from JARI volunteer, Dr. Helena Baird! As you will see from the tour Helena is no doubt as talented a panoramic photographer as she is a marine ecologist. “JARI, or “Juang Laut Lestari”, is a small but fiercely motivated locally-run NGO based in Lombok, Indonesia” explains … Continue reading » This post has no tag 1 comment May 09 Last resort: rescuing an orangutan from its natural habitat Categories: Indonesia by mark A recent article from Lucy Radford, Development Officer at Barbary Macaque Awareness & Conservation, provides a moving account of her trek through fragmented forest in Langkat, North Sumatra. Supported by stunning photography from wildlife photographer Andrew Walmsley, Lucy outlines the plight of wildlife that is being squeezed into smaller and smaller areas as oil palm … Continue reading » This post has no tag Leave comment Apr 29 Welcoming Helena Baird to the JARI team Categories: Indonesia, News, Stories from the Field, Team vEco, vEcotours by mark vEcotourism.org is very happy to welcome experienced marine ecologist and Australian Volunteer for International Development (AVID) volunteer Dr. Helena Baird to the team at JARI, vEco’s partner in Indonesia. With conservation project experience in places as diverse as the Bahamas, Zimbabwe and Antarctica, Helena will be working with JARI to implement marine education opportunities, working … Continue reading » This post has no tag 6 comments Jan 17 Palm oil company hit with momentous fine for destruction of key orangutan habitat Categories: Indonesia, News by mark An Indonesian company has been ordered to pay US$30 million to the state for illegally clearing 1,000 hectares (2,500 acres) of the Tripa Peatland Swamp Forest in Aceh province, Sumatra. The historic fine was imposed after PT Kallista Alam was found in breach of Indonesian National Law for the “illegal use of fire to clear … Continue reading » This post has no tag Leave comment Nov 15 Good news for Orangutans! Categories: Conservation Tools, Indonesia, News by mark Thanks in large part to fierce protest on the part of consumers concerned with non-sustainable palm oil, the food giant Ferrero has announced that it will be obtaining 100% of its palm oil from traceable segregated, RSPO-certified sources by the end of 2014, a full year ahead of its previously announced schedule. Ferrero, which manufactures … Continue reading » This post has no tag 2 comments Oct 08 Great Apes Summit Delegates Issue Statement on Palm Oil Categories: Africa, Indonesia, News by mark Meeting this past September in Jackson Hole, Wyoming, the Great Apes Summit Delegates drafted a list of six key action points in the face of the rapid and under-regulated expansion of oil palm plantations across Asia and Africa. The action points target all levels of the oil palm industry, from governments to consumers, in hopes … Continue reading » This post has no tag Leave comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy