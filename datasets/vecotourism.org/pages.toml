title = "Get Involved! » Virtual Ecotourism"
full_description = '''Get Involved! vEcotourism needs your help! As our project gains momentum, we’ve identified some areas where we could use some help so that the core team can stay focused on their primary tasks of developing the vEco technology. If you’ve got the skills we’re looking for, or know someone who does, please get in touch with Mark Laxer, mark(at)vecotourism(dot)org. As a vEco volunteer, you’ll work alongside our distinguished partners, network with established conservation professionals, and contribute to our shared vision of a planet for all species big and small. Current roles to fill: vEco testers As we integrate new features and experiment with new methods of virtual storytelling, we need feedback on how everything is working across a variety of platforms. Our testers will receive links to “beta” versions of vEco and provide careful feedback on how they perform. Interested? Write to Mark Laxer at mark(at)vecotourism(dot)org with a brief summary of your background and skills along with a list of the equipment you use to access the internet (i.e. iPad 2, Android, PC, Mac). (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reali