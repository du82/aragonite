full_description = "Category Archive: Stories from the Field Dec 24 Don’t miss VIRUNGA, the movie! Categories: Africa, DRC, Stories from the Field, Virunga National Park by Ian Redmond Have you seen the oscar-nominated documentary VIRUNGA yet? You should! It is a film with the tense drama, tear-jerking emotion and spectacular imagery of a Hollywood blockbuster, but it is fact not fiction. It features the courageous men and women (and their families) that protect the Virunga National Park in the Democratic Republic of Congo … Continue reading » This post has no tag Leave comment Sep 15 Yosina’s Maiden Voyage Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Witnessing the destruction of the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces by pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing, the Chimp-n-Sea Wildlife Conservation Fund (vEco’s parent organization), and partner JARI had to do something. In 2013, the ‘Yosina’ was purchased with the aim … Continue reading » This post has no tag Leave comment Jul 31 Celebrate World Ranger Day 2014 Categories: Africa, News, Stories from the Field, Team vEco by mark World Ranger Day on 31 July celebrates the remarkable men and women who work to protect our endangered wildlife and threatened ecosystems. With the illegal wildlife trade burgeoning, poachers and smugglers are better funded and have more sophisticated weapons. threatening wildlife and rangers alike. An estimated 1,000 rangers have been killed in the last 10 … Continue reading » This post has no tag Leave comment Jul 14 A home away from home in Lombok, Indonesia Categories: Indonesia, Stories from the Field by mark In our latest vEcotour experience Dr. Helena Baird’s beautiful “home away from home” in Indonesia as she volunteers with vEcotourism’s partner, marine protection organisation JARI “Volunteering in a developing country is more than just the work itself” Helena explains, “it’s an entirely immersive, challenging and uplifting experience. I have almost been in Indonesia for six … Continue reading » This post has no tag 1 comment Jun 30 Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Categories: Africa, Conservation Tools, News, Rwanda, Stories from the Field, Team vEco, vEcotours, Volcanoes National Park by mark On 1st July 2014 Rwanda will host the tenth annual ‘Kwita Izina’, a gorilla naming ceremony for each born in the Volcanoes National Park during the year! This year, if you are not able to attend, take a guided virtual tour (vEcotour) with primate expert Ian Redmond during last year’s event when he was given … Continue reading » This post has no tag Leave comment Jun 18 Get up close and personal with wild red colobus monkeys on Zanzibar Categories: Africa, News, Stories from the Field, Tanzania, Team vEco, vEcotours, Zanzibar by mark vEcotourism ambassador Ian Redmond recently touched down on the beautiful island of Zanzibar for a 24-hour whirlwind visit. Trekking through the island Ian encountered various interesting landscapes which vEcotourism will shortly be shaping into a full-fledged multi-pano, multi-hotspot vEcotour. As a taster, we have put together a quick vEcotour of Jozani Forest in Zanzibar’s only … Continue reading » This post has no tag 1 comment Jun 16 Help launch the good ship Yosina and protect threatened Indonesian marine ecosystems Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Encompassing the greatest diversity of coral reefs and fish in the world, the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces serious threats from pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing. Seeing the destruction for themselves, in 2001 the Chimp-n-Sea Wildlife Conservation Fund (vEco’s … Continue reading » This post has no tag 1 comment Jun 11 vEcotourism engages with Ugandan students at Makerere University Categories: Africa, Murchison Falls National Park, News, Stories from the Field, Team vEco, Uganda, vEcotours by mark Ugandan vEco blogger and photographer, Mark Olokotum (a.k.a. Mark O!), broke new ground this past Friday, June 6th, as he introduced students of the Department of Biological Sciences at Makerere University, Uganda, to the wonders and possibilities of vEcotourism. Introduced by vEco Tour Guide and Content Developer, Jackson Efitre, Mark O dazzled the group with … Continue reading » This post has no tag Leave comment May 30 Helena’s first vEcotour: JARI HQ, Lombok, Indonesia Categories: Indonesia, News, Stories from the Field, vEcotours by mark vEco is proud to present the first ever vEcotour from JARI volunteer, Dr. Helena Baird! As you will see from the tour Helena is no doubt as talented a panoramic photographer as she is a marine ecologist. “JARI, or “Juang Laut Lestari”, is a small but fiercely motivated locally-run NGO based in Lombok, Indonesia” explains … Continue reading » This post has no tag 1 comment Apr 29 Welcoming Helena Baird to the JARI team Categories: Indonesia, News, Stories from the Field, Team vEco, vEcotours by mark vEcotourism.org is very happy to welcome experienced marine ecologist and Australian Volunteer for International Development (AVID) volunteer Dr. Helena Baird to the team at JARI, vEco’s partner in Indonesia. With conservation project experience in places as diverse as the Bahamas, Zimbabwe and Antarctica, Helena will be working with JARI to implement marine education opportunities, working … Continue reading » This post has no tag 6 comments Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
