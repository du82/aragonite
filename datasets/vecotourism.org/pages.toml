title = "Virunga Mountains & Mountain Gorillas » Virtual Ecotourism"
full_description = '''Virunga Mountains & Mountain Gorillas The Virunga Mountains consist of eight mighty volcanoes (two of them active) that straddle the borders of the Democratic Republic of the Congo, Rwanda, and Uganda. These lofty, often cloud-shrouded peaks are home to the critically endangered Mountain Gorilla, and vEcotourism’s Ian Redmond, OBE, has been among those leading the charge for their protection ever since his days as a research assistant with Dian Fossey on the slopes of Mount Bisoke. Please explore the map below to visit one of the three vEcotour sites we currently have online. You’ll clamber to the misty summit of Mount Sabinyo (site of the “discovery” of the Mountain Gorilla by Europeans), Step into a remote glade where Dian Fossey lies buried alongside her beloved gorilla friends, and join a group of ecotourists as they encounter the Susa Mountain Gorilla Group at close range on the flanks of Mount Karisimbi. Click on any of the green leaf icons to begin your vEcotour. Would you like to learn more about the Virunga Mountains area and what you can do to ensure the survival of the Mountain Gorilla? These links are just what you need! Headed to Virunga? Contact the Rwandan Development Board to organize a Gorilla Trek of your own. http://www.rdb.rw/tourism-and-conservation/gorilla-trekking.html To learn more about Mountain Gorilla conservation or to contribute to the cause, visit the Ape Alliance. http://www.4apes.com/ To view an excellent segment on Rwanda’s Mountain Gorillas, filmed by Carl Gierstorfer and featuring Ian Redmond, go here: http://www.dw.de/gorilla-habitat-in-rwanda/a-6684970 (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); 5 pings Experience the fascinating world of the Susa gorilla group in Rwanda, guided by great ape expert Ian Redmond » Virtual Ecotourism February 10, 2014 at 7:48 am (UTC 0) Link to this comment Reply […] Virunga Mountains & Mountain Gorillas […] Creating vEcotours with the Born Free Foundation team » Virtual Ecotourism March 6, 2014 at 7:38 am (UTC 0) Link to this comment Reply […] Virunga Mountains & Mountain Gorillas […] Visit the home of the Mountain Gorilla! - Gorilla Walker April 9, 2014 at 11:38 pm (UTC 0) Link to this comment Reply […] vEcotourism.org allows you to explore and learn about the home of the Mountain Gorillas with just a click of the mouse. This stunning, interactive, educational system allows you to take a tour with famous Gorilla conservationist Ian Redmond. […] What would you say if given the chance to talk to the world for 15 minutes? – TEDx talk by Ian Redmond » Virtual Ecotourism May 28, 2014 at 7:17 am (UTC 0) Link to this comment Reply […] Virunga Mountains & Mountain Gorillas […] Welcome, BBC Earth Readers! » Virtual Ecotourism May 12, 2016 at 7:09 am (UTC 0) Link to this comment Reply […] Virunga Mountains & Mountain Gorillas […] Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
