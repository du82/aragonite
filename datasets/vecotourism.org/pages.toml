full_description = '''↑ Return to Take A Tour Sumatran Orangutans Welcome! You’re about to embark on a one-of-a-kind virtual tour of one of the most remote, and threatened, habitats on Earth: the home of the critically endangered Sumatran Orangutan. Join us as we visit a jungle feeding platform where ecotourists encounter wild Orangutans, get a first-hand look at the Tripa peat swamps where palm oil plantations are rapidly replacing Orangutan habitat, and get a tour of the off-limits-to-the-public SOCP quarantine facility where you’ll meet some apes with incredible stories of survival. Click on one of the pinned locations below to begin your virtual ecotour! We hope that your virtual ecotour inspires you to take action and get involved – the people working to save endangered species and habitats need all the help they can get. Click on these links to find out what YOU can do: – Visit the Sumatran Orangutan Conservation Programme (SOCP) at their web page or on facebook. – The Sumatran Orangutan Society can be found here and on facebook. – To find a list of organisations working for orangutan conservation and welfare check out the Ape Alliance . – Read a moving account of an orangutan rescue in Sumatra by Lucy Radford here. (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); 4 pings Palm oil company hit with momentous fine for destruction of key orangutan habitat » Virtual Ecotourism January 17, 2014 at 8:06 pm (UTC 0) Link to this comment Reply […] Tour: Sumatran Orangutans […] Last resort: rescuing an orangutan from its natural habitat » Virtual Ecotourism May 9, 2014 at 8:00 am (UTC 0) Link to this comment Reply […] Sumatra’s Orangutans […] Last resort: rescuing an orangutan from its natural habitat | Chimp-n-Sea May 12, 2014 at 7:52 am (UTC 0) Link to this comment Reply […] You can take an immersive and interactive vEcotour, created by vEcotourism.org, in Sumatra with expert guide, Ian Redmond, by clicking here! […] Welcome, Guardian readers! » Virtual Ecotourism August 19, 2014 at 7:26 pm (UTC 0) Link to this comment Reply […] Sumatra’s Orangutans […] Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
