full_description = "Category Archive: Kenya Aug 12 Welcome National Geographic Readers! Categories: Kenya, Mount Elgon National Park, vEcotours by mark vEcotours Ambassador Ian Redmond re-lives the moment he was charged by a four-tonne elephant in a new article for National Geographic. “There is some irony in this – that the person who coined the term ‘elefriends’ should be trampled by a decidedly unfriendly elephant – but I’m pretty sure it wasn’t personal,” Ian jokes, as … Continue reading » This post has no tag 1 comment Aug 08 Teaching school students with vEco virtual reality Categories: Kenya, Mount Elgon National Park, vEcotours by mark Here at vEcotours, we’ve taken our first leap into the classroom, trialling a new “kid’s version” of our Mount Elgon virtual reality tour for a special lesson at Cambridge Elementary School, Vermont. The demo used our new app, which is available for both iOS and Android, with a special new narration, voiced by youngsters Erica and … Continue reading » Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR Leave comment Mar 03 Visit the Salt-Mining Elephants of Mount Elgon, Kenya Categories: Africa, Elephants, Featured Species, Kenya, Mount Elgon National Park by mark Our latest vEcotour has more depth than ever, literally! Venture nearly 200m or 650 ft deep into Kitum Cave where you’ll cross paths with the world’s only “Troglodyte Tuskers”! This post has no tag Leave comment Feb 26 Celebrate WORLD WILDLIFE DAY with a guided virtual safari to see elephants… underground! Categories: Africa, Elephants, Kenya, Mount Elgon National Park, vEcoLive by mark Join live tour host Ian Redmond for a multimedia 360-degree virtual reality tour of the world’s only salt-mining elephants! March 3rd is designated by the United Nations as World Wildlife Day. This year, the theme is ELEPHAN