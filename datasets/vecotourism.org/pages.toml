["https://www.vecotourism.org/news/behind-the-scenes-at-the-worlds-only-mountain-gorilla-orphanage"]
title = "Behind the scenes at the world’s only mountain gorilla orphanage » Virtual Ecotourism"
full_description = '''« Don’t miss VIRUNGA, the movie! #seriousaboutwildlifecrime » Dec 24 Behind the scenes at the world’s only mountain gorilla orphanage Categories: Africa, DRC, vEcotours, Virunga National Park by mark Just in time for Christmas, the vEco team is delighted to bring you this three-panorama virtual tour of the world’s only mountain gorilla orphanage, the Senkwekwe Center located at the headquarters of the Virunga National Park in Rumangabo, Democratic Republic of the Congo. The locations in this tour just happen to be featured at the core of the newly released Oscar-nominated documentary, VIRUNGA. In fact, when our vEco Ambassador, Ian Redmond OBE, recorded the images and videos for this tour the crew for that film were also at the center, and this tour captures the moments just before and during the evacuation (captured on video for this tour) of all expatriates that preceded the approach of the M23 rebel group that set off the dramatic events of VIRUNGA. The tour also features an interview with André Bauma, one of the many park rangers that risked their lives to continue caring for their gorilla charges in spite of civil war, refugee displacements, and armed poachers in addition to marauding rebels, charcoal makers, and illegal oil prospecting. These courageous individuals put their lives on the line every day when they turn up for work, knowing that more than 130 of their colleagues have been killed in action in the past decade. With the release of VIRUNGA, the whole world can marvel at their dedication and their conviction that the future of the Eastern DRC depends on protecting the park as the basis for sustainable development in the surrounding communities. As you proceed through this vEcotour, you’ll visit the orphans’ night quarters, explore their outdoor habitat, take note of some of their unique behaviours, watch the gorillas roughhouse with their keepers, and learn some of the finer points of persuading gorillas to move from one area of the center to another. You’ll also visit the Humba group, a mature mountain gorilla family that lives nearby, and observe these gentle giants in their natural environment. While you’ll there, you’ll also get a behind-the-lens look at the creation of another feature film, The Last of the Great Apes, and learn about the challenges of filming in 3D in mountain gorilla habitat from the Visionquest film crew. This post has no tag (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = "//connect.facebook.net/en_US/all.js#xfbml=1"; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'facebook-jssdk')); Tweet !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs'); Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Message: * You may use these HTML tags and attributes: <a href="" title=""> <abbr title=""> <acronym title=""> <b> <blockquote cite=""> <cite> <code> <del datetime=""> <em> <i> <q cite=""> <s> <strike> <strong> Name: * Email: * Website: Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond rece