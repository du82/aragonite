full_description = "Category Archive: Featured Species Nov 21 vEcotourism at UN CMS CoP12 in the Philippines Categories: Conservation Tools, Elephants, Internet Technology, News, vEcotours by mark Virtual reality experiences of nature were a highlight for some delegates and volunteers at the United Nations Convention on the Conservation of Migratory Species meeting in Manila recently. The 12th Conference of the Parties to the CMS, hosted by the Government of the Philippines, brought together delegates and observers from the 124 signatory countries and … Continue reading » This post has no tag Leave comment Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … Continue reading » This post has no tag 2 comments Sep 20 vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! Categories: Elephants, Featured Species, Team vEco by mark The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, on his recent Animal Hero award from the RSPCA & Daily Mirror. Ian was selected for the “Next Generation” award for his tireless efforts to inspire future generations to safeguard Earth’s natural wonders. Follow this link to read the full … Continue reading » This post has no tag Leave comment Sep 15 London’s Great Gorilla Run 2017! Categories: Africa, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Mountain Gorillas, Team vEco by Ian Redmond There are fun runs and then there is the GREAT GORILLA RUN — more fun for a good cause than any other event in conservation! At least that is what British comedian and TV naturalist Bill Oddie says. Tomorrow, Saturday 16th September, the 15th Great Gorilla Run will see hundreds of people dressed as gorillas, with … Continue reading » This post has no tag Leave comment Feb 07 Marching for an end to the domestic ivory trade in the UK Categories: Africa, Elephants by mark Come along with our vEco Ambassador, Ian Redmond, as he co-presents a petition to end the UK domestic ivory trade to 10 Downing Street. Recorded at the Global March for Elephants and Rhinos in London last year, this 360 video is especially relevant as the UK parliament just discussed this issue yesterday! This post has no tag Leave comment Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William … Continue reading » This post has no tag Leave comment Nov 16 Praise for vEcotourism.org from the United Nations’ Great Apes Surival Partnership! Categories: Bonobos, Bornean Orangutans, Chimpanzees, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Internet Technology, Mountain Gorillas, News, Sumatran Orangutans, UN-GRASP by mark Some very kind words about vEco from Doug Cress, Programme Coordinator for the United Nations’ Great Apes Survival Partnership! If you’ve got a VR headset, give apeAPP VR a spin on your Android or Apple smartphone 🙂 http://www.un-grasp.org/vr/ This post has no tag Leave comment May 12 Welcome, BBC Earth Readers! Categories: Africa, Featured Species, Mountain Gorillas, Rwanda, vEcotours by mark Our Ambassador, Ian Redmond, remembers the