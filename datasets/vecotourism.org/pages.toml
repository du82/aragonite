full_description = "Category Archive: DRC Sep 24 Happy World Gorilla Day! Categories: Africa, Featured Species, Grauer's Gorillas, Mountain Gorillas, Rwanda, vEcotours, Virunga National Park, Volcanoes National Park by Ian Redmond Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. September 24th 2017 has been designated the inaugural World Gorilla Day by the Dian Fossey Gorilla Fund International, to celebrate the 50th Anniversary of Dian Fossey establishing the Karisoke Research Centre on this day in 1967. Click HERE or on either of … Continue reading » This post has no tag 2 comments Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William … Continue reading » This post has no tag Leave comment Dec 21 Don’t miss “Gorilla Family & Me” on BBC Two later today! Categories: Africa, BBC, DRC, Eastern Lowland Gorillas, Featured Species, Kahuzi-Biega National Park by mark Wildlife cameraman Gordon Buchanan visits our friend Chimanuka the Silverback in Kahuzi-Biega National Park in the BBC Two series that begins broadcasting today. Accompany Gordon as he attempts to gain the trust of Chimanuka and map the power dynamics at play among these gentle giants. Breaking new ground for vEco, the BBC has linked to our … Continue reading » This post has no tag Leave comment Nov 09 Meet the Chimanuka gorilla family of Kahuzi-Biega National Park, DRC Categories: Africa, DRC, Eastern Lowland Gorillas, Featured Species, Grauer's Gorillas, Kahuzi-Biega National Park, vEcotours by mark Where do the biggest gorillas in the world live? It is well known that gorillas are the largest primate (except for a few very large humans) but we can now take you – virtually – to the only place in the world where you can find the biggest gorilla sub-species, the Eastern Lowland or Grauer’s … Continue reading » This post has no tag Leave comment Oct 13 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 2 Categories: Africa, DRC, Featured Species, Mountain Gorillas, vEcoLive, Virunga National Park by mark Join host Ian Redmond for part two of our virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! This week, we will take you behind-the-scenes of the world’s only orphanage for mountain gorillas, the Senkwekwe Centre, where you will meet André Bauma, one of the heroes … Continue reading » This post has no tag Leave comment Oct 05 vEcoLive: Mountain Gorillas of the Virunga Volcanoes, Part 1 Categories: Africa, DRC, Mountain Gorillas, Rwanda, vEcoLive, Virunga National Park, Volcanoes National Park by mark Join host Ian Redmond on a virtual voyage through the Virunga Volcanoes of East Africa, spectacular home to half of the world’s Mountain Gorillas! The tour will trace the story of European interaction with these gentle giants, beginning with the dizzying heights of Mount Sabinyo, pausing in a misty glade to pay our respects at Dian Fossey’s grave, … Continue reading » This post has no tag Leave comment Dec 24 Behind the scenes at the world’s only mountain gorilla orphanage Categories: Africa, DRC, vEcotours, Virunga National Park by mark Just in time for Christmas, the vEco team is delighted to bring you this three-panorama virtual tour of the world’s only mountain gorilla orphanage, the Senkwekwe Center located at the headquarters of the Virunga National Park in Rumangabo, Democratic Republic of the Congo. This post has no tag Leave comment Dec 24 Don’t miss VIRUNGA, the movie! Categories: Africa, DRC, Stories from the Field, Virunga National Park by Ian Redmond Have you seen the oscar-nominated documentary VIRUNGA yet? You should! It is a film with the tense drama, tear-jerking emotion and spectacular imagery of a Hollywood blockbuster, but it is fact not fiction. It features the courageous men and women (and their families) that protect the Virunga National Park in the Democratic Republic of Congo … Continue reading » This post has no tag Leave comment Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read more → Introducing vEco Labs! Now that the vEco team has migrated our core technology over to the Unity development Read more → vEcotourism at UN CMS CoP12 in the Philippines Virtual reality experiences of nature were a highlight for some delegates and volunteers at the Read more → Happy World Gorilla Day! Welcome to our new virtual Gorilla safari, launched to coincide with the first ever #WorldGorillaDay. Read more → vEco’s Ian Redmond receives RSPCA-Daily Mirror “Animal Hero” award! The vEco team is both proud and delighted to congratulate our own Ian Redmond, OBE, Read more → Categories Africa DRC Kahuzi-Biega National Park Virunga National Park Kenya Mount Elgon National Park Rwanda Volcanoes National Park Tanzania Zanzibar Uganda Bwindi Impenetrable National Park Kibale Mgahinga National Park Murchison Falls National Park Nabugabo QENP BBC Climate change Conservation Tools Featured Species Bonobos Bornean Orangutans Chimpanzees Eastern Lowland Gorillas Elephants Grauer's Gorillas Mountain Gorillas Sumatran Orangutans Indonesia Internet Technology Mark O's blog New Media News North America Panoramic Stories from the Field Team vEco UN-GRASP vEcoLive vEconauts vEcotours Search"
