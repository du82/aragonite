full_description = "Category Archive: Conservation Tools Nov 21 vEcotourism at UN CMS CoP12 in the Philippines Categories: Conservation Tools, Elephants, Internet Technology, News, vEcotours by mark Virtual reality experiences of nature were a highlight for some delegates and volunteers at the United Nations Convention on the Conservation of Migratory Species meeting in Manila recently. The 12th Conference of the Parties to the CMS, hosted by the Government of the Philippines, brought together delegates and observers from the 124 signatory countries and … Continue reading » This post has no tag Leave comment Dec 23 Announcing Gorilla Safari VR Categories: Africa, Conservation Tools, DRC, Eastern Lowland Gorillas, Grauer's Gorillas, Kahuzi-Biega National Park, News by mark Working with the Born Free Foundation, and in honor of longtime friend and colleague John Kahekwa, we’re very pleased to announce the release of Gorilla Safari VR, our latest vEcotour mobile app for Android and iOS. This one begins at Born Free’s headquarters in England, with Mr. Kahekwa having just received the 2016 Prince William … Continue reading » This post has no tag Leave comment Dec 01 Virtual field trip with vEcotours Categories: Conservation Tools, vEcotours by mark vEcotours has entered the classroom once again, this time taking children from Walmore Hill Primary School in Gloucestershire, England on a virtual safari. Our ambassador, naturalist Ian Redmond OBE, gave a natural history lesson to pupils, who were encouraged to think about elephants and what it may be like to be one. In a workshop … Continue reading » Tags: 360 degree, classroom, conservation, elementary school, elephants, immersive tours, learning, Mount Elgon, primary school, school, school project, teacher, teaching, tech, vEco, vEcotours, Virtual reality, VR Leave comment May 09 vEco launches VR app in partnership with UNEP-GRASP Categories: Conservation Tools, Internet Technology, News, vEcotours by mark vEcotourism.org is both proud and incredibly excited to be launching our first virtual reality mobile app in partnership with the United Nations Environment Programme – Great Apes Survival Partnership (UNEP-GRASP) and the Ape Alliance: apeAPP VR! The app, which will be available on both Android and iOS smartphones, will offer immersive tours of all great ape … Continue reading » Tags: app, GRASP, great apes, vEco, vEcotours, VR 1 comment Mar 16 vEco integrated with UN-GRASP’s new website! Categories: Conservation Tools, Internet Technology, News by mark vEcotourism.org is proud and delighted to announce a major project milestone: we’re now integrated into the United Nations Great Apes Survival Partnership’s (UN-GRASP’s) new website! Click on any of the great ape’s species pages and you can now enjoy virtual tours of each great ape’s habitat while learning about keeping abreast of GRASP’s conservation programs … Continue reading » This post has no tag Leave comment Mar 03 #seriousaboutwildlifecrime Categories: Conservation Tools, Internet Technology, News by mark The theme of this year’s UN World Wildlife Day, on 3rd March, is being #seriousaboutwildlifecrime and the UN-Great Apes Survival Partnership (UN-GRASP) has released a new video, which will be screened at the UN in New York, on the illegal trade in ape infants. This post has no tag Leave comment Sep 15 Yosina’s Maiden Voyage Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Witnessing the destruction of the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces by pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing, the Chimp-n-Sea Wildlife Conservation Fund (vEco’s parent organization), and partner JARI had to do something. In 2013, the ‘Yosina’ was purchased with the aim … Continue reading » This post has no tag Leave comment Aug 19 Welcome, Guardian readers! Categories: Conservation Tools, Indonesia, News by mark vEcotourism.org is pleased to welcome readers of The Guardian’s “Notes&Theories” segment, arriving at our site following our mention in the recent piece entitled “Support our red-haired cousins, the orangutans, before it’s too late“. You can join your host, Ian Redmond, OBE, in our unique interactive virtual ecotours of Orangutan habitat and conservation efforts in Sumatra by … Continue reading » This post has no tag Leave comment Jun 30 Get ready for the Kwita Izina gorilla naming celebrations in Kinigi, Rwanda with vEcotourism.org Categories: Africa, Conservation Tools, News, Rwanda, Stories from the Field, Team vEco, vEcotours, Volcanoes National Park by mark On 1st July 2014 Rwanda will host the tenth annual ‘Kwita Izina’, a gorilla naming ceremony for each born in the Volcanoes National Park during the year! This year, if you are not able to attend, take a guided virtual tour (vEcotour) with primate expert Ian Redmond during last year’s event when he was given … Continue reading » This post has no tag Leave comment Jun 16 Help launch the good ship Yosina and protect threatened Indonesian marine ecosystems Categories: Conservation Tools, Indonesia, News, Stories from the Field, Team vEco by mark Encompassing the greatest diversity of coral reefs and fish in the world, the unique Coral Triangle area between Indonesia, Philippines and Papua New Guinea faces serious threats from pollution, trawling and drift-nets as well as damaging and illegal cyanide and dynamite fishing. Seeing the destruction for themselves, in 2001 the Chimp-n-Sea Wildlife Conservation Fund (vEco’s … Continue reading » This post has no tag 1 comment Older posts « Welcome to vEcotourism.org! We work to connect and empower conservation projects worldwide by integrating state-of-the-art immersive digital technologies with traditional storytelling. Recent Posts Ian Redmond reacts to the WWF Report on Sky News vEco’s own Ian Redmond, OBE, appeared on Sky News today to react to the WWF’s Read 