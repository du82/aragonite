["https://vectorlink.ai/blog/leveraging-llms-and-machine-learning-for-record-matching"]
title = "Leveraging LLMs and Machine Learning for Record Matching - VectorLink.ai"
description = "When currating data sets which relate to entities, whether these be products, people or corporations, we encounter a problem in knowning when one thing is the same as another. This process is variously known as record matching, record linking and entity resolution. In the real world, determination of when two things are the same sometimes […]"
full_description = "When currating data sets which relate to entities, whether these be products, people or corporations, we encounter a problem in knowning when one thing is the same as another. This process is variously known as record matching, record linking and entity resolution. In the real world, determination of when two things are the same sometimes has a very definitive answer. Joe Bloggs may refer to more than one individual, but each of these individuals is unique and unambiguous. When there is a record it should be possible to assign to which of these Joe’s they are referring, at least in principle. Sometimes however, the designation of an entity is more complicated and requires additional logic, for instance when a corporation has subsidiaries. In our discussion we are going to restrict ourselves to the former problem, where the real identity of something has a clear notion. Record matching has been around for a very long time, and therefore has lots of well known approaches. But LLMs (Large Language Models) have enabled some new and surprisingly effective techniques that are often much more robust. Content which would have been difficult or even impossible to match on previously can now be utilised. To demonstrate how LLMs can be leveraged for record matching we are going to use an LLM only solution. In practice, a mixture of approaches improves results, where semantically rich and textual content utilises the LLM and various quantitative, highly structured or temporal properties are matched with other approaches. Yet the pure LLM approach is so effective that for many use-cases we can ignore the more complex solution. Not only does this approach make use of the advanced AI capacities of LLMs, it leverages AI to avoid the quadratic-explosion of possible combinations that is lurking in the matching problem if we have to compare each record against every other. In this example, we’re going to use the ACM / DBLP data-set which matches records across two databases of paper publications. This has the advantage of having a small known sample of exact matches which we can use to train. In many real world cases you will not have such a training set easily avaialble, but we’ll discuss how you can obtain a similar dataset for your problem when we get to training."
author = "Gavin Mendel-Gleason"
year_published = 2024
year_updated = 2024
clearnet = "https://vectorlink.ai/blog/leveraging-llms-and-machine-learning-for-record-matching"
