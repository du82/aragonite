["https://vectorlink.ai/blog/how-to-survive-the-ai-revolution-in-data-management"]
title = "How to survive the AI revolution in Data Management - VectorLink.ai"
description = "Where and how you can automate your data management processes. We explain why it's critical to your business and how to make improvements."
full_description = "At VectorLink.ai we have been performing experiments with LLMs with the aim of automating or improving various data management processes. Specifically we’ve had a lot of success with improving outcomes for difficult record matching problems (see: LLMs and machine learning for record matching, LLM Classifier Bootstrapping, Entity Resolution across human languages). The use of vector embeddings and the language capabilities of LLMs have opened up a huge range of new potential applications, many of which would have been complete science fiction only 10 years ago. This is going to have profound impacts and not only in data management, but also in the nature of IT employment, and society more generally. Profound change is profoundly disruptive, and since luck favours the prepared, we would do well to have a bit of a think about the kinds of changes that will happen. There will be big opportunities, but also grave dangers for companies that do not adapt. So what are these changes and how can businesses be prepared for the disruption? Automation has always been based on essentially the same principle. If you can reduce human time spent on production by employing machinery which is cheaper than that human time, then you have an effective automation. This process has been playing out for over a hundred years and it is the driving motor of growth. It is also the reason that some companies (and even states) win, and others lose. If you can produce something more cheaply, then you make bigger profits and/or you win market share. In many cases, automation will be time saving, causing a reorientation of current jobs and increasing productivity. But some jobs are already vanishing as a result of AI. In the translation industry we are already seeing a profound impact. AI is so good at translation that translation has largely been reduced to the task of post-editing, something which was already present! The translators themselves are not really needed. In our own experiments we have found that generative AI can be very effective at generating training sets by annotation, much in the way that a human would do. In this experiment I wasn’t able to do better than the AI unless I used auxiliary information from the internet (something which will be possible to add to the AI’s arsenal!). The machine is ready to replace me in this thankless task (thank goodness!)."
author = "Gavin Mendel-Gleason"
