["https://verasafe.com/about-us"]
title = "About Us | Meet the VeraSafe Team"
description = "Meet the VeraSafe team: leaders in privacy and data protection services, supporting compliance and building trust across the globe."
full_description = "Work directly with our in-house team of US and European cybersecurity attorneys, IT experts, and project managers. Home About Us About Us Meet our exceptional team of professionals. Meet our exceptional team of professionals. Contact Us Free Consultation For more than a decade VeraSafe has been re-imagining privacy and data protection compliance services. We’re a passionate team of attorneys, privacy professionals, and IT security experts operating from key jurisdictions around the world, namely the USA, the EU, and South Africa. Our mission is to provide our clients with world class advice. Building trust with your audience through privacy compliance is a fundamental need for modern businesses. At VeraSafe, we believe there’s an efficient way to get your business there. We rethink the traditional ways of working, in order to improve the client experience and the quality of our services. We develop and apply a cutting edge legal project management methodology, and continuous process improvements to deliver efficient and user-friendly compliance services. By streamlining the logistics and commonalities between projects, we free our team to create innovative solutions that not only ensure compliance, but make sense for your team, your company, and your industry. Meet Our Team VeraSafe’s impressive roster includes alumni of other top firms, such as Baker McKenzie, Bird & Bird, Deloitte, Jones Day, KPMG, and WilmerHale. We are a close-knit, cohesive team whose passion for privacy law is matched only by our appreciation for the people we work with. It is our true pleasure to help your organization solve your privacy and cybersecurity-related challenges. We encourage you to contact us today. Matthew Joseph CIPP/E, CIPP/US, CIPM, FIP Managing Director Jim Cormier CIPP/E, CIPM, FIP Senior Vice President and Head of Professional Services Kellie du Preez CIPP/E Partner Jim Russell Chief Legal Officer and Chief Strategy Officer Karl Laureau CIPP/E Partner Z