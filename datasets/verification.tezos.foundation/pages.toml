["https://verification.tezos.foundation/privacy_notice"]
title = "Tezos Foundation's KYC/AML"
full_description = 'The Tezos Foundation is committed to protecting the privacy and security of the personal data that is provided to us or collected by us. We process personal data in accordance with the Swiss Data Protection Act ("FADP") and the European Union (EU) General Data Protection Regulation ("GDPR"). This Privacy Policy explains the types of personal data we may collect, how we may use and disclose such data, and your rights in relation to such data. Personal data is any information that relates to an identifiable natural person and includes inter alia name, address, e-mail address and user behaviour. We may provide you with additional privacy notices where we believe that it is appropriate to do so. Those additional notices supplement and should be read together with this Privacy Policy. The Tezos Foundation (CHE-290.597.458), Baarerstrasse 22, 6300 Zug/Switzerland, is responsible for the processing of your personal data (as a “data controller” pursuant to the GDPR). Personal data about you (or your representatives and/or beneficial owners) is collected by our third party service providers that help us conduct the AML/KYC process (described below) as part of our efforts to identify our contributors and their beneficial owners which contributed to the Tezos Foundation in the year 2017. The type of personal data collected includes name, contact details (such as your address, email address and telephone number), address, identification document, and other relevant information which are customary or may be required in the context of an AML/KYC process. We may also collect your email address if you agree to receive information about the Tezos Foundation, such as our newsletter. If you provide information about your representatives and/or beneficial owners, you are responsible for (i) informing any third party individual to whom the personal data relates of the disclosure and use of such data in accordance with this Privacy Policy and (ii) obtaining any necessary consents to such disclosure and use, if required.'
year_published = 2025
clearnet = "https://verification.tezos.foundation/privacy_notice"
