full_description = "The Tezos Foundation requires contributors to its fundraiser to complete this KYC/AML process in order to access their recommended allocations in its proposed genesis block. After an account is registered, the contributor must complete an identity verification process. After a contributor’s identity is verified, that contributor will receive an activation code corresponding to a given public key hash. This activation code will be required in order to access the corresponding public key hash’s allocation in the genesis block."
