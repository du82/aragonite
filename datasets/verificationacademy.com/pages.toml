full_description = "Wednesday, March 5th, 2025 | 8:00 AM PST Upcoming Webinar In this webinar, we will explore essential debug capabilities, and you will learn how to effectively identify and resolve issues in complex testbenches, streamline workflows, and enhance overall verification efficiency. Register Now! Wednesday, March 12th, 2025 | 8:00 AM PST Upcoming Webinar In this webinar, we will be focusing on the usage of SafetyScope at various stages of a safety design cycle: architectural phase, RTL phase and post-synthesis phase. Then we'll demonstrate how to generate an optimized fault list to optimize your fault campaigns. Register Now! Recently published in the Verification Academy Filters Filter By Acceleration Analog Mixed-Signal Assertions CDC Coverage Debug FPGA Verification Formal Verification Functional Safety Low Power Machine Learning Planning & Analysis Python QDS RDC Simulation Standards SystemVerilog UVM UVMF UVMC VHDL 2008 Verification IP VIQ Verification Management Show More Show Less Display 5 Items 10 Items 25 Items Showing All Content Types Article Chapter Conference Cookbook Paper Resource Seminar Session Track Webinar Safety Analysis for Automotive Chips Based on ISO 26262 Functional Safety Mar 12, 2025 Jyothy M Jaganathan Webinar Faster Debug of Complex Testbenches Using Visualizer Debug Mar 05, 2025 Erik Jessen Webinar IC/ASIC Functional Verification Trend Report - 2024 Planning & Analysis Feb 17, 2025 Harry Foster Paper FPGA Functional Verification Trend Report - 2024 Planning & Analysis Feb 17, 2025 Harry Foster Paper 2024 Siemens EDA and Wilson Research Group Functional Verification Study: 7-Part Video Series Planning & Analysis Feb 17, 2025 Harry Foster Track Got Coverage? Coverage Feb 14, 2025 Rich Edelman link DVCon 2025: A Must for Hardware Design and Verification Engineers Standards Feb 12, 2025 Dave Rich link Siemens at DVCon 2025: Don’t Miss the Luncheon and More! Planning & Analysis Feb 11, 2025 Harry Foster link Update from the Standards World: Accellera Approves UVM-MS 1.0 Standard Standards Feb 10, 2025 Dennis Brophy link Breaking the Bottleneck: A Smarter Approach to Semiconductor Verification Planning & Analysis Feb 05, 2025 Harry Foster link New Advanced Verification Academy Course for Master’s-Level Learning SystemVerilog Feb 04, 2025 Harry Foster link Breaking the Bottleneck: Overcoming the Verification Productivity Gap 2.0 Planning & Analysis Jan 31, 2025 Harry Foster Paper Accellera Sessions at DVCon U.S. 2025 Standards Jan 31, 2025 Dennis Brophy link Functional Verification of Digital Logic UVM Jan 10, 2025 Harry Foster Track Verification Process Overview UVM Jan 10, 2025 Harry Foster Session 1–15 of 233 PreviousNext View all recently published content More Discussions in the Forums UVM Dynamic sequence from command line SG_99 Feb 27, 2025 UVM Stopping a UVM Sequence library kkinhal Feb 26, 2025 UVM Reset sequence management : jump and multi phase sequences julien_payen Feb 26, 2025 UVM Synchronization issue with clock in D Flip-Flop Divyadharshini_V Feb 25, 2025 UVM Need a fully workable Uvm_param_vif_config_db.tgz example KevNug Feb 25, 2025 UVM Browse more UVM topics SystemVerilog Assertion coding for a random pattern AK3 Feb 27, 2025 SystemVerilog Overlap between the two asynchronous reset signals Redfoo Feb 27, 2025 SystemVerilog Elements of Array should have a difference greater than 1 LFT Feb 27, 2025 SystemVerilog Register value is updated based on handshake on B Channel AGS91 Feb 27, 2025 SystemVerilog Writing testcases for different frequency NeethuPilakkal Feb 27, 2025 SystemVerilog Browse more SystemVerilog topics Explore learning topics UVMC In today's complex and rapidly evolving world of electronic design and verification, verification engineers are constantly seeking innovative solutions to streamline their processes and improve productivity. One such solution that has gained considerable attention and recognition is UVM Connect. Low Power Low Power verification enables early (RTL) verification of active power management applied to a complex design, to ensure that the power management architecture and behavior are correct and that the design will operate correctly under active power management. Power Aware techniques simplify the verification process through a comprehensive suite of static checkers for checking the consistency of the power management architecture and dynamic checks for automated error detection.Utilizing Low Power standards provide visualization of power management architecture and behavior, coverage data collection, and test plan generation for power states and state transitions. Based on the UPF for specification of active power management, Power Aware integrates well with other UPF-based tools to support multi-tool and multi-vendor low power design and verification flows. Questa Design Solutions Questa Design Solutions is an automated and integrated suite of verification tools for designers to improve initial RTL quality. Design Solutions analyzes code at the design stage to detect bugs early, to improve efficiency, enhance development predictability and ease pressure on schedules. UVM - Universal Verification Methodology The Universal Verification Methodology (UVM) is a powerful framework for designing and verifying complex digital systems, offering significant benefits in terms of reusable and scalable testbenches. UVM promotes reusability by providing a standardized methodology for creating modular, configurable verification components. This modular approach allows engineers to develop testbenches using reusable building blocks, reducing redundancy and saving time.Furthermore, UVM enhances scalability, enabling easy adaptation to changing project requirements. As designs evolve, UVM's hierarchical and flexible architecture simplifies the addition or modification of testbench components, ensuring efficient and maintainable verification environments. Overall, UVM streamlines the verification process, promoting productivity and ensuring robust, adaptable testbenches. Verification IQ Big data is transforming all industries, enabling them to innovate their products more rapidly and improve many aspects of our lives. EDA is powering these transformations. Verification needs to transform in step, so we can predict which test to run next, the root cause of a failure, and what stimulus is required. UVM Framework The Universal Verification Methodology Framework (UVMF) is an advanced and comprehensive toolset that extends the capabilities of UVM, the Universal Verification Methodology. UVMF provides a robust and structured approach to verification, offering a wide range of pre-built components, utilities, and testbenches that accelerate and simplify the verification process.With UVMF's flexible architecture, verification engineers can effortlessly customize and integrate the components into their specific projects, fostering reusability and scalability. By leveraging UVMF, verification teams can significantly reduce development time, enhance collaboration, and ensure the delivery of high-quality, error-free semiconductor designs to meet the ever-increasing demands of the electronics industry. Assertions A verification engineer plays a critical role in the development of complex electronic systems, ensuring that these systems meet the desired functionality and adhere to the design specifications. One powerful tool in the verification engineer's arsenal is the use of assertions. Assertions are statements or properties embedded within the verification environment that help identify design bugs and verify the correctness of the system. Coverage Coverage metrics are crucial in digital design verification for ensuring the functionality, reliability, and quality of complex electronic systems. These metrics quantify the extent to which various aspects of the design have been tested, offering a measure of assurance that the design meets its specifications. Coverage metrics help identify untested or under-tested areas, enabling engineers to focus their efforts effectively, improve test plans, and uncover potential bugs or design flaws. They aid in risk mitigation, reducing the likelihood of costly post-production errors. Moreover, they enhance the overall efficiency of the verification process, making it more cost-effective and enabling faster time-to-market. In a world increasingly reliant on electronics, robust coverage metrics are an indispensable part of the verification process required for delivering safe and reliable digital products. Formal Verification Formal verification is a topic area that encompasses a wide array of formal-based technologies and methodologies, including formal property checking, automatic formal apps, and sequential and logic equivalence verification. By employing mathematical models and logical reasoning, formal solutions scrutinize and validate complex systems, such as hardware circuits with the goal of enhancing reliability and eliminating design flaws. Acceleration Verification is a critical phase in the design and development of digital systems, ensuring their correctness and functionality. Simulation has long been the primary technique used for verification, enabling engineers to model and test designs using software-based models.However, as designs have grown increasingly complex, traditional simulation methods have proven to be insufficient in meeting the demands of modern verification. Particularly with the emergence of hardware/software co-verification requirements. This has led to the emergence of emulation as a more efficient and effective approach that combines simulation with hardware acceleration techniques. Verification Academy Live In these one day seminars, attendees will learn new technologies and techniques that you can adopt today to increase your verification productivity. FPGA Verification FPGA (Field-Programmable Gate Array) verification, including methods like simulation and formal verification, is invaluable for ironing out design issues before deploying hardware in the lab. Simulation allows engineers to comprehensively test the FPGA design under various conditions, helping detect and rectify potential bugs and ensuring functionality. By conducting thorough FPGA verification, costly and time-consuming hardware iterations are minimized, significantly reducing the risk of errors and shortening the time-to-lab phase. This approach ultimately leads to more efficient development, lower expenses, and a faster path to achieving operational hardware. Clock-Domain Crossing Designers increasingly use advanced multi-clock architectures to meet the high-performance and low-power requirements of their chips. An RTL or gate-level simulation of a design that has more than one clock domain does not accurately model the silicon behavior related to the transfer of data between asynchronous clock domains. As a consequence, simulation does not accurately predict silicon functionality, risking show-stopper bug escapes due to metastability.Metastability is a phenomenon that can cause system failures in digital devices when a signal is transferred between circuitry in unrelated or asynchronous clock domains. This topic area focuses on advanced techniques to find clock-domain crossing errors before they escape into silicon. Functional Safety Functional safety verification in digital design and integrated circuit design is crucial for ensuring that electronic systems operate reliably, especially in safety-critical applications like areospace, automotive, medical devices, and industrial control systems. It focuses on identifying and mitigating potential hazards and failures that could lead to catastrophic consequences.By rigorously verifying safety-critical designs, we reduce the risk of system malfunction or failure, safeguarding human lives and valuable assets. This process involves thorough analysis, testing, and adherence to industry standards such as ISO 26262 and DO-254.In a world increasingly dependent on digital technology, functional safety verification is paramount to prevent disasters and maintain trust in electronic systems. Planning, Measurement and Analysis Planning, measurement, and analysis are critical in digital design and verification as they provide a structured approach to ensure the reliability and functionality of complex electronic systems. Planning sets clear objectives and strategies for verification. Metrics offer quantifiable data to assess progress and completeness, helping to identify untested areas. Analysis enables the detection of design flaws and bugs.Together, they enhance efficiency, reduce risks, and accelerate time-to-market, ensuring the final product meets specifications. These processes are indispensable for achieving high-quality, reliable, and compliant digital designs in an increasingly competitive and fast-paced technology landscape. Verification Management Verification is an essential step in the design and development process of complex systems, ensuring that the final product meets the specified requirements and functions as intended. With the increasing complexity of modern systems, the role of verification engineers has become more critical than ever.To streamline and optimize the verification process, verification management techniques have emerged as a valuable approach. In this article, we will explore what verification management is and how verification engineers can leverage this technique to enhance their efficiency and effectiveness. Standards Electronic Design Automation (EDA) standards, including SystemVerilog, VHDL, UVM, UPF, and others, offer significant benefits in the development of electronic systems. These standards provide a common framework and language for designers and verification engineers, facilitating collaboration, improving design quality, and accelerating the design process. They enable the creation of robust, interoperable, and reusable designs, ultimately resulting in more efficient and reliable electronic systems. Machine Learning Machine learning (ML) has emerged as a powerful tool in the field of verification engineering, revolutionizing the way we validate and verify complex systems. Verification engineers are responsible for ensuring that hardware and software systems meet their specifications and perform reliably. In this context, machine learning offers a fresh approach to address challenges and enhance the verification process. VHDL 2008 VHDL (VHSIC Hardware Description Language) is a powerful and widely used hardware description language. Introduced as IEEE 1076-2008, VHDL has become a crucial tool for electronic engineers and researchers, facilitating the design and modeling of digital and analog systems. It allows designers to create both RTL (Register-Transfer Level) and structural representations of desired systems by employing constructs such as processes and variables.VHDL 2008 is the most widely used and supported version of the language, which "
