["https://verse.works/0xtjo"]
title = "0xTjo | Verse"
description = """
Tjo is a visual artist from Quebec whose work explores the complexities of mental health, pure OCD, and psychology. His art delves into personal struggles and experiences, often represented in dark blue spaces that symbolize the obscurity of the mind. Within these spaces, he uses red figures as human archetypes to express universal aspects of the human condition, aiming to evoke emotion and provoke introspection in viewers.

Influenced by the artistic dichotomy between Dionysus and Apollo, Tjo combines techniques like collage, painting, and material destruction to achieve an imperfect balance between subject and form. His work creates a visual dialogue on mental health, self-expression, and the human experience, encouraging reflection and sparking conversation."""
