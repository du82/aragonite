["https://verse.works/tender"]
title = "TENDER | Verse"
description = """
TENDER is a leading curatorial platform and practice for contemporary generative art, growing a new breed of gallery. Aiming to advance generative art as a medium, core practices include artist collaborations, collector activations, and in-person experiences of digital creations. Innovations across these disciplines increasingly show a broader audience what generative (computational, algorithmic, systems-based) art is, and what it can be.

With a practice that supports an open community of exceptional artists, the works that TENDER releases are born from highly collaborative processes that focus on conceptual rigor, originality, and a breadth of beauty. Each project also seeks to achieve new ways of emphasizing a connection with traditional arts media, and fostering memorable ways of experiencing art.

Every TENDER initiative is led by Adam Berninger – an artist, curator, and creative director with a background in creative coding from the early days of Flash. A RISD graduate with a lifelong art practice, and a collector of art across all mediums, Berninger has also created digital experiences and brand platforms for art organizations such as MoMA, Paddle8, UOVO, Isabella Stewart Gardner Museum, Google, Public Art Fund, and more."""
