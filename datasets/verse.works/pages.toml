["https://verse.works/series/tabcorp-labs-by-tabor-robak"]
title = "TABCORP LABS by Tabor Robak | Verse"
description = '''
*TABCORP LAB* is a series of bespoke artworks that emerged from the Broken Printer series, released in 2024. These interactive digital sculptures are embedded within a vibrant video environment enriched with overlaid graphics, generative effects, and original audio.


The works encourage exploration at your own pace—zoom in to uncover intricate details, or zoom out to reveal the broader landscape and what lies beyond.


Building on the themes of Broken Printer, *TABCORP LAB* explores the evolution of printing technology, celebrating its imperfections while also exploring its more futuristic dimensions. During the development of Broken Printer, Tabor reflected on the intersection of creativity and labor, asking, “If art is just labor, am I a broken printer?” This existential question became a driving force for the project, embracing a “work harder, not smarter” ethos. Long hours, trial and error, and persistence produced a wide range of works—some polished and others destined for "recycling."


Through this iterative process, Tabor introduced the *Recycling Program*, treating his practice as a creative lab for refining ideas. This journey ultimately inspired the narrative behind TABCORP LAB: a malfunctioning office printer spiraling out of control, endlessly printing and evolving in complexity. The story sees *TABCORP LABS* stepping in to manage the chaos as the printer transforms—from retro paper-based imagery to advanced digital creations like 3D objects, browser-based environments, and generative overlays.


At the core of this evolution lies *The Materializer*, a conceptual tool allowing collectors to trade three Broken Printer NFTs for new works. These burned pieces are reimagined as dynamic 3D objects and immersive experiences, bridging the nostalgic aesthetics of analog printing with futuristic digital forms.


*TABCORP LABS* also redefines labor in art. Each piece incorporates unique attributes—such as Generation (release order) and Overtime (extra effort)—emphasizing the unseen work behind each creation and linking its value to the time and energy invested.'''
