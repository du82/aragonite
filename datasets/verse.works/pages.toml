["https://verse.works/galerie-met"]
title = "Galerie Met | Verse"
description = "Galerie Met was founded in 2023 in Berlin and represents emerging and established artists of various generations, origins, cultural backgrounds, and sexual orientations. Its program focuses on radical, interdisciplinary, concept-oriented work, especially in the fields of interactive art, video art, installation art, generative art, as well as painting, photography, and sculpture that push traditional boundaries. Galerie Met hosts approximately 7 contemporary art exhibitions, 5 digital art exhibitions, and 1-2 non-art/non-profit exhibitions per year in Berlin. In addition to these, Galerie Met also hosts online art exhibitions in the metaverse, offering people the possibility to enjoy art immersively no matter where they are."
