["https://verse.works/series/level-1-by-tiny-soul"]
title = "level 1️⃣ by tinysoul | Verse"
description = """
*level* 1️⃣ comprises a cast of absurd and surreal characters, that are drawn from the depths of internet culture and meme lore. 

These characters, though often humorous, are imbued with an eerie sense of depth, evoking the strange beauty found in Studio Ghibli's most peculiar stories. They exist in a world where nothing makes complete sense yet everything feels intimately relatable. 

Through the looping GIFs and fragmented visuals, tinysoul gives these figures life, turning fleeting internet memes into permanent characters with their own stories, struggles, and emotional arcs.

In *level* 1️⃣, the absurdity of the digital realm comes alive in characters that oscillate between the hilarious and the haunting. They become scenes that feel like dreamlike, glitchy fragments of a larger narrative—where humor is twisted, and meaning is constantly evolving. Tinysoul invites us to engage with these figures, to see ourselves reflected in their pixelated oddities, and to find new interpretations in the strange, shared world they inhabit."""
