["https://verse.works/0xhaiku"]
title = "0xhaiku | Verse"
description = '''0xhaiku is a conceptual and digital artist exploring the intersections of art and Web3. Initially trained and working as a software developer, he transitioned into art, focusing on themes of “open system art” and “relational art in Web3,” alongside conceptual and poetic expression. In 2023, his work received nominations in the "Conceptual NFT" category on jpg.space through collectors' votes, and he was longlisted for The Lumen Prize Crypto Award. In 2024, his piece "Receipt" was acquired by Fingerprints DAO. Exhibitions include 'Made in Contract', Neort++, 2023; Bright Moments Venice, 2024.'''
