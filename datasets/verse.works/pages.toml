title = "About | Verse"
description = "Buy and sell NFTs from top contemporary artists, curated by leading art world experts."
full_description = "Verse is a marketplace for the world’s best contemporary art NFTs.What are NFTs?A non-fungible token (NFT) is a digital asset secured by cryptography on a blockchain. In essence, they allow us to prove ownership and provenance of digital items.What is Verse?Verse is a platform to collect digital artworks minted as NFTs. Artworks are offered directly from the artists through exhibitions curated by leading art world figures. Collectors can also buy and sell works through a secondary marketplace.How can I pay on Verse?We support credit/debit card payments as well as popular cryptocurrencies. Learn moreWhich blockchain does Verse use?All artworks on Verse are minted on the Ethereum blockchain.Do I need a crypto wallet?Owning a crypto wallet to pay or collect digital artworks on Verse is unnecessary.If you don’t own a crypto wallet, your collected work is stored in our custodial wallet. You can withdraw work from this at any time.What about the environmental impact?Verse uses green blockchains like Ethereum with very low energy consumptions. To put things in perspective, the entire Ethereum network consumes 25x less energy than payment platform PayPal. We have partnered with Offsetra to offset the small volume of carbon emissions we do generate through blockchain transactions.Are there any fees?If you resell an artwork you’ve purchased, a variable artist royalty plus a 2.5% marketplace fee will be automatically deducted from the payment you receive from the buyer. Buyers never pay fees.I’m an artist or curator — how do I get involved?Please visit our artists or galleries page for more information.Subscribe to get the latest on artists, exhibitions and more."
