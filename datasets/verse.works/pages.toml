["https://verse.works/series/among-falling-suns-by-0009"]
title = "Among Falling Suns by 0009 | Verse"
description = """
*Among Falling Suns* is a series of AI-generated animations and stills that explore the energy, movement, and colorful nature of urban night. The city pulses with motion, while time blurs at the edges, capturing the feeling of being fully immersed in a moment that feels infinite yet always slipping away, creating night euphoria.

This series was created from selected generated images using a custom LoRA model and ControlNet. The animations were made with Luma Dream Machine and Kling AI, while music and sound design were generated with Stable Audio and Soundly."""
