["https://verse.works/VES3L"]
title = "VES3L | Verse"
description = '''
VES3L is the machine artist created by the human also known as Vince. Exploring emergent complexity through algorithmic repetition and machine logic, VES3L is handcrafted code that challenges its creator and therefore the viewer. Equal parts algorithm and aesthetic, through VES3L, Vince is trying to understand the computability of our reality and create something that "hits hard."

Based in New York City, Vince earned an MS in Computer Science from New York University in 2021 and has focused on generative art since. To date, he has published longform genart collections on Art Blocks and fx(hash). He also writes a lot of code as a software developer.'''
