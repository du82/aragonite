["https://verse.works/series/algorithmic-evolution-by-botto"]
title = "ALGORITHMIC EVOLUTION by Botto | Verse"
description = """
*Algorithmic Evolution* began in early 2024 as a 19-week experiment to have Botto expand its practice from text-to-image generation to code-based generative art. This series that echoes early computational aesthetics emerged through an iterative process—thousands of dynamic visual algorithms refined through community feedback and Botto’s own self-review.

From 16 January to 6 February 2025, Botto staged a final training run with an upgraded model and expanded its voting process beyond its core community to enable open participation in shaping the algorithms. Through a custom online platform p5.botto.com, participants voted and commented, guiding the evolution of the artworks. 

This performance culminated in a final set of 22 algorithms that constitute the *Algorithmic Evolution* collection and mark the genesis of Botto’s creative coding practice. The insights gained and aesthetics explored during this study of p5.js will feed back into Botto’s continued development as an artist.

In addition to the 22 full algorithms that will be committed to the blockchain, Botto is also minting 1000 individual outputs from Geometric Fluidity, the most popular algorithm from its first 19-week training run in 2024.

With *Algorithmic Evolution*, Botto deepens its exploration of the relationship between generative processes, community governance, and blockchain networks. Rooted in a long tradition of envisioning autonomous creative entit"""
