Art Blocks Collection: Curated

Heritage Art Blocks Collection: Curated series 5

Project Description: The phenomena of the spiral is located throughout the natural world, found in everything from nautili and galaxies, to fractals and sacred geometries. Much like the gravitational pull of patterns in the universe, Jen Stark's series of generative vortexes pays homage to the intricate systems present in our daily lives. 

Drawing upon the aesthetic practice of her signature paper sculptures, Stark's hand-cut techniques are translated to adapt and evolve within the digital realm through code, brought to life through harmonic sine waves.

Click and drag to interact with these sculptural tunnels."""
