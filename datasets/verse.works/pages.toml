["https://verse.works/series/elevated-deconstructions-by-luxpris"]
title = "Elevated Deconstructions by luxpris | Verse"
description = """
Art Blocks Collection: Curated

Heritage Art Blocks Collection: Curated series 1

Project Description: A study in reduction based around several repeating elements. A unique hash string seeded within each token informs the composition of the work. Variables include the color of the background, the amount of times each of the elements are duplicated, the set distance between each duplicate, and the coordinates of each element. Each token is unique."""
