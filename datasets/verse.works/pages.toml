title = "Eileen Isagon Skyers  | Verse"
description = """
Eileen Isagon Skyers is a writer, curator, and artist based in New York. She has nearly a decade of experience contextualizing media art and producing online exhibitions across non-profit and contemporary arts institutions, among them, David Zwirner, Rhizome, and the Whitney Museum of American Art.

Through her extensive directorial experience at web3 organizations including Foundation, Feral File, and Friends with Benefits, Skyers has facilitated high profile partnerships with distinguished collaborators including bitforms gallery, Almine Rech, the Museum of Modern Art, LVMH, Artist Rights Society, and Uniswap.

Her critical writing on digital art and culture has been published in Hyperallergic, Outland, Frieze, Spike, and Dirt, and in printed catalogues including the Net Art Anthology, Pioneer Works' Software for Artist's Day publication, In *Poetic Coalition*, and *Trigger: Gender as a Tool and a Weapon*. Skyers is currently a mentor for NEW INC's Art and Code cohort, and acted as an advisor for The Kitchen’s L.A.B. Research Residency x Simons Foundation x SFPC."""
