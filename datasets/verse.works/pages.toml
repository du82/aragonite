nd encryption.Third-party Website linksOur Website may contain links to third-party Websites. VERSE advises Users to acquaint themselves with third-party’s privacy policies and Terms of Service. VERSE shall not be responsible for the privacy practices or content of such third-party Websites.Duration of the processingVERSE will keep User’s personal information to enable its continued use of the Services described in this Policy and in its Terms of Service, for as long as it is required in order to fulfil the relevant purposes described therein.User’s rights (art. 15-22 GDPR)The User may exercise certain rights with respect to Personal Information processed by the Data Controller. In particular, you have the right to:Be informed about the processing of their Personal Information and to obtain access to such data.Be informed in case of updating/correction/deletion/restriction of Personal Information.Revoke consent at any time. In this case, your Personal Information will be deleted from our files as soon as possible.Limit the processing of your Personal Information.Object, in whole or in part, to the processing of their Personal Information and refuse the automated decision-making process, including profiling, within the limits arising from legal obligations on the storage of Personal Information.Access their Personal Information.Verify and request the rectification of your Personal Information.Obtain the limitation of the processing of their Personal Information.Obtain the deletion (right to be forgotten), updating, rectification and integration of their Personal Information without undue delay.Transfer your Personal Information to another data controller.Lodge a complaint with the supervisory authority for the protection of your Personal Information and/or take legal action.These rights may be exercised in the forms and within the terms of art. 12 GDPR, by means of a specific request in writing accompanied by a photocopy of your ID sent by registered mail with return