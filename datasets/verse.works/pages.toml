 loading...

▓░░░░░░░░░ - 10%

*Colorspace* is a tribute to creating on the computer.
An animated painting with programed brushes, erasers, and accents.
Based on the gestures of classic screensavers and operating system UI elements.

▓▓▓▓░░░░░░ -40%

I was inspired by the file size limits of storing on Ethereum.
Cutting edge technology meets a floppy disc.
It reminded me of my original software tools:
MacPaint, Kid Pix, HyperCard, on a black and white Mac Classic II.
Colliding with a decked out gaming computer, running an arsenal of software, in millions of colors.

▓▓▓▓▓▓░░░░ -60%

I hope *Colorspace* evokes the fun of learning new software,
the trance like state of a late night coding session,
and the anxiety of a HDD failure at a critical deadline.

