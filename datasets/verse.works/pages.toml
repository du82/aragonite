["https://verse.works/addie-wagenknecht"]
title = "Addie Wagenknecht | Verse"
description = """
Addie Wagenknecht's work blends conceptual art with forms of hacking and gestural abstraction. Previous exhibitions include Centre Pompidou, The Istanbul Modern, Whitechapel Gallery and The New Museum NYC - among others. She has collaborated with CERN, Chanel, Whitney Museum of American Art, and Google’s Art Machine Intelligence (AMI) Group. Her work has been featured in numerous books, and magazines, such as TIME, Wall Street Journal, Vanity Fair, Art in America, and The New York Times. 

She holds a Masters degree from the Interactive Telecommunications Program at New York University, and has previously held fellowships at Eyebeam Art + Technology Center in New York City, Culture Lab UK, Institute HyperWerk for Postindustrial Design Basel (CH), and The Frank-Ratchye STUDIO for Creative Inquiry at Carnegie Mellon University."""
