full_description = "Verse is built by a team of art world people and technologists.George CunliffeHead of ProductGeorge brings in key product expertise, having led cross-functional teams across a range of software products spanning property and e-commerce. Before specialising in product he managed the UK arm of a VR creative agency.Javid KarimbayliBackend DeveloperJavid brings years of expertise in scalable backend systems, microservices, and event-driven architectures to Verse. Previously, as Chapter Lead at Azerbaijan’s Innovation and Digital Development Agency. His technical leadership in Golang and seamless system integrations has enhanced large-scale government-citizen engagement.Mimi NguyenAdvisorMimi is a lecturer at Central Saint Martins, University of Arts London where she leads the CSM NFT Lab. Her background is New Media Art, having previously studied at the Berlin University of the Arts (UdK) and Academy of Fine Arts in Warsaw. She now also teaches at Imperial College London, Faculty of Engineering, where she leads Mana Lab - a “Future in Blockchain” PhD research group.Augustinas MalinauskasCo-founderAugustinas holds a PhD in Theoretical Particle Physics from the University of Oxford, and a Masters in Part III Mathematics from the University of Cambridge. He is passionate about ML and coming up with creative solutions for technical problems.Sam BateSenior Product DesignerSam began his career at a reputable multidisciplinary design agency in the UK, and joined Verse following a role at American Express, where he helped align product and design teams to ensure a consistent experience.Holly-Anyetta WrenchMarketing ManagerHolly has a background in art history and computer science. She has published writing on socially engaged art practices, technological developments within the art world, and NFTs as a contemporary avant-garde, and she founded the Contemporary Arts Society in Edinburgh to foster conversation around the role of art in contemporary society.Bakshi IskandarovFrontend DeveloperWith expertise in Next.js, React, and Angular, Bakshi brings a versatile skill set to the team. Passionate about user experience, he is dedicated to crafting accessible and engaging web applications. Baskshi holds a Bachelor's degree in Technology and Design from Azerbaijan State University of Economics (UNEC).Ivan “Lonliboy”Artist RelationsAs a long-time collector with an unparalleled passion for digital art, Ivan brings invaluable experience to the team.Leyla FakhrArtistic DirectorLeyla brings 8 years of curating experience at Tate. She works closely with some of the world’s top artists, galleries, and curators, to bring the very best contemporary digital artworks to Verse.Anna Cristina CaputiOperations ManagerAnna has curated innovative exhibitions with substantial impact, helping institutions to put in place strategies to further engage local communities. While curating shows in both museum and gallery settings, she has helped various organisations streamline operations and planning.Sergy PerovChief Technical OfficerSergy previously designed front-end architecture for Russia's largest e-book marketplace. He has expertise in web information security, and participates in international cyber security competitions.Jamie GourlayCo-founderJamie started and ran a private art dealership for 10 years before Verse, selling works by Picasso, Monet, Koons, and Kusama along the way. He concurrently founded Queen's Fine Art, an art shipper that now counts Christie's, Hauser & Wirth, and Gagosian as clients.Rakhat RakhmetovFrontend LeadRakhat brings over 8 years frontend development experience to Verse. Highly skilled in Angular, Rakhat is also trained in HTML5, CSS3 and Typescript.Daniil BarbashovBackend DeveloperDaniil previously lead a development of a chat automation system that is now used by an extensive range of companies. Last year he came 3rd place in Yandex Cup backend programming contest.Aleksei KarnovBackend DeveloperAleksei was previously Lead Software Engineer at Delivery Club, one of Russia’s fastest-growing startups. He brings extensive experience in implementing water-tight privacy and security processes.Takfai ChanSenior iOS DeveloperFai brings 9 years iOS experience, and has a deep understanding of the NFT tech structure. Fai holds a Master of Science degree in Information Systems Management from City University, Hong Kong.Subscribe to get the latest on artists, exhibitions and more."
