title = "Internal Lullabies for the Disenfranchised by Jess Mac | Verse"
description = """
This collection is a series of short videos made with AI tools that explore the contemporary political climate through morphing imagery of demented clowns and exhausted dolls. These works bring us to internal collective landscapes where hope still exists though the horrors persist. Throughout the collection vintage clowns transform into antique dolls then into dragged out femmes with dripping mascara, as soundscapes shift from disturbing voiceovers to gentle songs with impactful lyrics. These narratives take us on a journey through political transformation; while a genocide rages and capitalist fascism dominates, can we hold onto our humanity?

 
**Each video is created from selected generated images in Midjourney brought to life through AI video programs such as Runway and Kling. Songs were generated through Udio."""
