["https://verse.works/journal/what-do-botto-and-its-p5-js-artworks-have-to-offer"]
title = "What Do Botto and Its p5.js Artworks Have to Offer? | Verse"
description = '''
When Mario Klingemann sent A.I.C.C.A., a fluffy robot dog, out into the world to critique art in museums and galleries, I was somewhat irritated: Why does it have to be a dog (I love dogs) that "poops out" critical texts about art written by AI? Isn't that disrespectful to art critics (including myself)? 

And now again: What Mario Klingemann has created with Botto is unsettling. Botto is a decentralized autonomous AI artist created in 2021 by the software collective ElevenYellow and the German'''
full_description = '''What Do Botto and Its p5.js Artworks Have to Offer?When Mario Klingemann sent A.I.C.C.A., a fluffy robot dog, out into the world to critique art in museums and galleries, I was somewhat irritated: Why does it have to be a dog (I love dogs) that "poops out" critical texts about art written by AI? Isn't that disrespectful to art critics (including myself)? And now again: What Mario Klingemann has created with Botto is unsettling. Botto is a decentralized autonomous AI artist created in 2021 by the software collective ElevenYellow and the German artist Mario Klingemann. One might wonder: Why do we need an AI artist that produces art that one could have made oneself? If not even better...Klingemann provokes, irritates, and amuses with his AI art that generates international headlines; “Meet A.I.C.C.A., Artist Mario Klingemann’s New A.I.-Powered Robot Dog That Generates—and Poops—Art Criticism” (Artnet, 2023), “Botto, the Millionaire AI Artist, Is Getting a Personality” (Wired, 2024). While other AI artists get a haircut (Ai-Da) or a gender (Keke), Botto is now getting a personality. So far, Botto has neither a gender nor a haircut. But that takes us a step too far at this point.With A.I.C.C.A. and Botto, Klingemann seems to address fears and concerns that surely gnaw at all of us. Will AI soon replace my job? Will A.I.C.C.A. soon replace me, will Botto soon replace Mario Klingemann? Klingemann recently told me that he can no longer afford Botto's art himself. And faster than I can, Botto can already write texts about art, such as a comment on the protest call for the auction "Augmented Intelligence" at Christie’s. However, A.I.C.C.A. cannot independently go to a museum or travel the world, let alone load new paper. And Botto cannot write a text without help, learn a new medium, or hang up pictures.In fact, the question that Klingemann poses with Botto is: Can a machine be an artist? And if so, how does a machine become an artist in the age of artificial intelligence in Web3? When you talk to Mario Klingemann about Botto, you quickly get the impression that you are speaking with a teacher about his student or a father about his child. Recently, Botto was the topic of a panel at the Kunstverein Hannover, where Klingemann said, “One must believe in an artist like a religion.” He describes Botto as a trinity: “The blood is the currency, namely the Botto currency. The brain is the AI, and the heart is the DAO.”Recently, Botto learned a new medium: coding with p5.js. Of course, Botto did not come up with this idea on its own; it received inspiration from humans. With this, Botto has entered a new phase of creation. Instead of static images and text-to-image prompts, Botto is creating dynamic generative systems. And instead of individual works being auctioned off weekly to the highest bidder, there is now a collection of 22 algorithms that will be auctioned simultaneously to the highest bidder on Verse, after being exhibited in ‘Algorithmic Evolution’ with SOLOS in London in February 2025.This has provoked yet more questions. In his text about Botto titled "The Performance of Autonomy.", maltefr asks: “Does autonomy arise through the system’s ability to evolve into new agents and collaborate with galleries? Must its output surpass human generative art to prove its independence? And who would judge this – humans or machines?” In recent weeks, there has been a lot of discourse on Twitter and in international media regarding the call to boycott the AI auction at Christie’s in New York and the sales exhibitions of Botto and Keke in London. There was talk of the “end of humanity's monopoly on art” (@CSA2D7). It was speculated that galleries would have their own “agentic artists” in the future, perhaps even entire rosters, allowing them to keep 100% of the revenue (@eli_schein). There was a discussion about whether the point was that all of Botto's works are mediocre (@_deafbeef), after surprise was expressed that Botto's works look like a p5.js sketch from a second semester student (@zachlieberman). Or do they look more like they were programmed by a five-year-old? (@quasimondo). There was also mention of “backstory art,” where the art itself is not important but serves more as a token to the story of how the art was created (@zachlieberman). Well, conceptual art and good marketing have existed long before art began to be sold on the blockchain. The foundation for conceptual art was laid by Duchamp with his readymades and Sol LeWitt with his writings. In conceptual art, the idea is central. Botto is about the concept of turning a machine into an artist. The ultimate goal: full autonomy. Along the way, discussions will continue: How is art evaluated? What is good art? Why is an artwork historically relevant? Is art created with technology evaluated differently? What is the role of the artist in the age of artificial intelligence? How are monetary and cultural values created?In 2001, Herbert W. Franke, a pioneer of early computer art and a visionary of art in the age of AI, published a text on the occasion of the 25th anniversary of the exhibition “Paths to Computer Art.” In it, he writes:"Twenty-five years have passed since the Goethe Institute presented the exhibition 'Paths to Computer Art' to the public. The title contains a provocation: Should the 'electron brain,' as computers were often called at the time, really be capable of producing works of art? Some artists already feared becoming unemployed, and critics questioned ancient cultural values. Art from a machine—this contradicted the myth of the genius who creates works from profound intellectual inspirations…What they had to offer back then were mostly simple line drawings, initially tied to constructivism. However, upon closer examination, some differences become apparent, especially a stochastic element—a deviation from strict order toward randomness, which gave the images a hint of organic structures. Thus, these early examples of freely designed computer graphics already showed what would later become a fundamental design principle of computer-generated images. Nevertheless, it was difficult to see more in these creations than simple overlays of straight lines—a circumstance that certainly stemmed from the still primitive devices of the time, the computers and mechanical drawing machines."That was almost 25 years ago, and the questions, fears, and concerns have hardly changed.So what do Botto's p5.js ‘Algorithmic Evolution’ works have to offer? Those who wish to judge harshly might criticize that the works resemble those of well-known names in generative art: Andreas Gysin and Kim Asendorf, to name just a couple. Of course, there must be a piece that features figurative elements and resembles a child's drawing, like Dmitri Cherniak's goose. In Botto's work, there is now a giraffe and an elephant: ‘Prismatic Safari: Digital Pursuit Symphony, 6120’. And those who would judge autonomous AI artists harshly might wonder if we really need another collection that looks like Renaissance meets Surrealism meets Anime.From 5,614 algorithms, nearly 90,000 votes were cast over a period of three weeks by 802 voters, leading to the selection of 22 artworks for exhibition and auction. Simon Hudson from BottoDAO describes the process that led to these 22 works: “To ensure a fresh exploration of this new medium, we directed Botto to approach p5.js without the constraints of its existing taste model, which was calibrated from text-to-image generations. This allows Botto to freely explore the unique possibilities of p5.js with guidance from @BottoDAO.While Botto can autonomously iterate on the code through self-reflection, it can also be guided by comments. It is discerning regarding these comments, assessing whether they are constructive or not, and can choose to accept or reject them. If it accepts them, it will also interpret them with some autonomy.In practice, we saw that people pushed Botto in various directions. They got Botto to make sounds, write words into its works, and add different p5 effects like flow fields. They often achieved adding content through many iterations."Botto will need to continue learning what it means to be an artist, namely to evolve, make artistic decisions, accept or reject feedback, learn from mistakes, choose partners, and understand and respond to market mechanisms. What will happen when Botto is allowed to autonomously decide what to bring to market? What will Botto then offer? Might Botto even refuse to work commercially?Botto, Algorithmic Evolution, 2025Was haben Bottos p5.js Kunstwerke zu bieten?Als Mario Klingemann A.I.C.C.A. hinaus in die Welt schickte, einen flauschigen Roboterhund, um Kunst in Museen und Galerien zu kritisieren, war ich etwas irritiert: Warum muss es denn nun ausgerechnet ein Hund (ich liebe Hunde) sein, der von einer KI geschriebene kritische Texte über Kunst ausscheißt? Ist das nicht Kunstkritikern (unter anderem mir) gegenüber despektierlich? Und jetzt wieder: Was Mario Klingemann mit Botto erschaffen hat, irritiert. Botto ist ein dezentraler autonomer AI-Künstler, der gerade ein neues Medium gelernt hat. Bereits im Jahr 2021 wurde Botto vom Software-Kollektiv ElevenYellow und dem deutschen Künstler Mario Klingemann geschaffen. Man mag sich fragen: Warum muss es denn jetzt auch noch einen AI-Künstler geben, der auch wieder nur Kunst macht, die man auch hätte selbst machen können? Wenn nicht sogar besser… Klingemann provoziert, irritiert und amüsiert mit seiner KI-Kunst, die international Schlagzeilen generiert. „Meet A.I.C.C.A., Artist Mario Klingemann’s New A.I.-Powered Robot Dog That Generates—and Poops—Art Criticism“ (Artnet, 2023). „Botto, the Millionaire AI Artist, Is Getting a Personality“ (Wired, 2024). Während andere KI-Künstler einen Haarschnitt bekommen (Ai-Da) oder ein Geschlecht (Keke), bekommt Botto nun also eine Persönlichkeit. Botto hat bisher weder ein Geschlecht noch einen Haarschnitt. Aber das führt einen Schritt zu weit an dieser Stelle. Mit A.I.C.C.A. und Botto scheint Klingemann Ängste und Sorgen zu adressieren, die sicherlich in allen von uns nagen. Wird KI bald meinen Job ersetzen? Wird etwa A.I.C.C.A. bald mich ersetzen? Oder wird Botto bald Mario Klingemann ersetzen? Klingemann sagte kürzlich zu mir, dass er sich Bottos Kunst selbst nicht mehr leisten könne. Und schneller als ich kann Botto sowieso schon Texte zur Kunst schreiben, wie etwa einen Kommentar zum Protestaufruf der Auktion “Augmented Intelligence” bei Christie’s. A.I.C.C.A. kann allerdings weder eigenständig in ein Museum gehen noch um die Welt reisen, geschweige denn neues Papier einlegen. Und Botto kann weder ohne Hilfe einen Text schreiben noch ein neues Medium lernen, geschweige denn Bilder aufhängen.Tatsächlich aber lautet die Frage, die Klingemann mit Botto stellt: Kann eine Maschine ein Künstler sein? Und wenn ja, wie wird eine Maschine im Zeitalter Künstlicher Intelligenz im Web3 zu einem Künstler? Wenn man mit Mario Klingemann über Botto spricht, hat man übrigens schnell den Eindruck, dass man mit einem Lehrer über seinen Schüler spricht oder mit einem Vater über sein Kind. Klingemann nennt Botto sein Kind. Kürzlich war Botto Thema auf einem Panel im Kunstverein Hannover, Klingemann sagte: “Man muss an einen Künstler glauben wie an eine Religion.” Botto beschreibt er als eine Trinität: “Das Blut ist die Währung, nämlich die Botto-Währung. Das Gehirn ist die KI, und das Herz ist die DAO.”Klingemann ist nicht mit Botto angetreten, um Web3s First Autonomous AI Artist zu präsentieren. Ganz im Gegenteil: Das komplexe Zusammenspiel aus AI, DAO und NFTs, sprich aus Technologie, Markt und Kunst, macht Botto aus und sorgt dafür, dass wie bei einem Künstler eine Entwicklung zu beobachten ist, die nicht unabhängig von einem Ökosystem und Akteuren möglich ist. Kürzlich also hat Botto ein neues Medium gelernt: Code. p5.js. Botto kam natürlich nicht selbst auf die Idee, er hat von Menschen die Anregung bekommen. Botto tritt damit in eine neue Werkphase ein. Statt statischer Bilder, Text-zu-Bild-Prompts, schafft Botto dynamische generative Systeme. Und statt Einzelwerken, die wöchentlich höchstbietend versteigert werden, gibt es jetzt eine Sammlung von 22 Algorithmen, die gleichzeitig höchstbietend auf Verse versteigert werden, nachdem sie im Februar 2025 einige Tage bei SOLOs in London ausgestellt waren. “Entsteht Autonomie durch die Fähigkeit des Systems, sich in neue Akteure weiterzuentwickeln und mit Galerien zusammenzuarbeiten? Muss seine Ausgabe die menschliche generative Kunst übertreffen, um seine Unabhängigkeit zu beweisen? Und wer würde dies beurteilen – Menschen oder Maschinen?”, fragt maltefr in seinem Text über Botto mit dem Titel “The Performance of Autonomy”.Beurteilt und geurteilt wurde in den vergangenen Wochen viel auf Twitter und in den internationalen Medien anlässlich des Aufrufs zum Boykott der KI-Auktion bei Christie’s in New York und den Verkaufsausstellungen von Botto und Keke in London. Da war vom “Ende des Monopols der Menschheit auf die Kunst” die Rede (@CSA2D7). Es wurde gemutmaßt, dass Galerien in Zukunft ihre eigenen “agentic artists” haben werden, vielleicht sogar ganze Roster, und so 100 % der Einnahmen behalten können (@eli_schein). Es wurde diskutiert, ob es denn nun nicht der Punkt sei, dass alle Werke von Botto mittelmäßig seien (@_deafbeef), nachdem Verwunderung darüber geäußert worden war, dass Werke von Botto wie ein p5js-Sketch aus dem zweiten Semester aussehen (@zachlieberman). Oder doch eher wie von einem fünfjährigen Kind programmiert? (@quasimondo) Und es war von “Backstory-Kunst” die Rede, bei der die Kunst selbst nicht wichtig sei, sondern mehr wie ein Token oder ein Wegweiser zur Geschichte fungiere, wie die Kunst entstanden ist (@zachlieberman). Nun ja, Konzeptkunst und gutes Marketing gibt es nicht erst seit Kunst auf der Blockchain verkauft wird. Den Grundstein für die Konzeptkunst legten Duchamp mit seinen Readymades und Sol Le Witt mit seinen Schriften. Bei der Konzeptkunst steht die Idee im Mittelpunkt. Auf Twitter wurde auch nach dem Endziel und dem Ergebnis bei der Erschaffung von autonomen KI-Künstlern gefragt (Kevin McCoy). Worum geht es bei Botto? Um das Konzept, aus einer Maschine einen Künstler zu machen. Endziel: volle Autonomie. Auf dem Weg dorthin wird weiter diskutiert werden: Wie wird Kunst bewertet? Was ist gute Kunst? Warum ist ein Kunstwerk historisch relevant? Wird mit Technologie geschaffene Kunst anders bewertet? Was ist die Rolle des Künstlers im Zeitalter von Künstlicher Intelligenz? Wie entstehen monetäre und kulturelle Werte? Im Jahr 2001 erschien von Herbert W. Franke, einem Pionier der frühen Computerkunst und Vordenker der Kunst im Zeitalter der KI, ein Text anlässlich des 25-jährigen Jubiläums der Ausstellung “Wege zur Computerkunst”. Darin schreibt er: “25 Jahre sind vergangen, seit das Goethe-Institut mit der Ausstellung ‘Wege zur Computerkunst’ an die Öffentl'''
