time in their engagement with Us. User consents to VERSE’s collection and use of its Personal Information pursuant this Privacy Policy and consents to be subject to the current terms of this document. Please be advised that this document may be updated and or modified pursuant to VERSE’s sole discretion. Therefore, please visit this section frequently. If you are interested in receiving more information, making suggestions or filing complaints regarding this Privacy Policy, you can do so by sending an email to: contact@arttechnologies.coWe recommend that you read this document carefully as it contains information about your rights as a User of the Website.Information we may collectVisiting and consulting the Website does not involve the collection and processing of the User's Personal Information. In addition to navigation data, Personal Information voluntarily provided by the User when interacting with the functions of the Website or requesting to use the services offered on the Website may be processed. In such event, we may collect and process User’s personal and non-personal information. Personal Information is such that can be used to distinctly identify an individual, either directly or indirectly, such as name, date of birth, address, email address, phone number, photo ID, proof of income, credit card details, bank account details, data relating to spouse or children, social security data, etc. Non-personal information is such that does not enable the identification of a specific individual, either directly or indirectly such as, data generated by the devices, applications, tools and protocols used, pages visited, number of clicks, actions taken, duration of sessions, geolocation data that precisely identifies the location, etc. Such Personal Information may leave traces which, when combined with unique identifiers and other information received by the servers, may be used to create profiles of individuals.This data will be collected to the extent necessary for the requested activity and in accordance with Articles 9 and 10 of the GDPR and other provisions of the GDPR.Failure by the Data Subject to provide Personal Information for which there is a legal or contractual obligation, or if it is a necessary requirement for the conclusion of the contract with the Data Controller, will result in the Data Controller being unable to establish or continue the relationship with the Data Subject.The Data Subject who communicates to the Data Controller Personal Information of third parties is directly and exclusively responsible for its origin, collection, processing, communication or dissemination.Purposes and Legal Basis of Personal Information processingWe will collect User’s data with the following purposes:fulfilment of any obligation arising from the pre-contractual or contractual relationship with the Data Subject;to allow the data subject to register with the Website, access and be identified, including via external platforms;to respond to data subject's requests;to allow the User’s use of the services and features on the Website;provide the User with a secure ecosystem as the collection of data is aimed at avoiding fraud and validating the Purchaser’s identity;research and/or statistical analysis on aggregate or anonymous data, without the possibility of identifying the User, aimed at measuring the functioning of the site, measuring traffic and assessing the usability and interest of the site;fulfilment of any obligation provided for by applicable rules;need to ascertain, exercise or defend a right in court or administrative authorities;exercise legitimate interests (for navigation data and cookies);marketing purposes including profiling of the Data Subject (Controller's products and/or services and or third-party products and/or services);detect the exact location of the Data Subject.The legal bases of the Treatment are as follows:Browsing data and anonymous first-party and statistical cookies: processing is necessary for the legitimate interest of the Data Controller;Personal identification data provided by the User: processing is necessary for the performance of a contract to which the data subject is party or for the implementation of pre-contractual measures at the request of the data subject;in some cases, processing is necessary to fulfil our legal or regulatory responsibilities, for example, in the case of reporting to authorities, governmental or regulatory bodies.On the basis of the legitimate interest of the Data Controller, the Website allows interactions with external platforms or social networks whose processing of Personal Information is governed by their respective privacy policies to which please refer. This information - in the absence of a specific consent to the processing for other purposes - is used only to allow the use of the Website and provide the requested information and services.TreatmentThe processing of Personal Information is carried out, within the limits and for the time strictly necessary for the fulfilment of the above-mentioned purposes, by telematic means and recorded in digital format on servers available to the Data Controller.Specific security measures are observed by the Data Controller to prevent the loss, modification or deletion of data, unlawful and/or incorrect use, and unauthorized access or transmission, furthermore, the Data Controller undertakes to adopt further measures necessary to ensure that Personal Information is treated securely and in accordance with the relevant legislation in force.You can help the controller to update and maintain the accuracy of your Personal Information by notifying us of any changes to your Personal Information.Personal Information will be processed exclusively by:Persons authorised by the Data Controller to process Personal Information who have committed themselves to confidentiality or have an appropriate legal obligation of confidentiality;subjects operating independently as separate data controllers