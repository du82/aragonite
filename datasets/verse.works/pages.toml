["https://verse.works/agoria"]
title = "Agoria | Verse"
description = """
Sébastien Devaud, known as Agoria, is a French multidisciplinary artist renowned for his electronic music production and biological generative art. Agoria combines art, music, and science in his work, collaborating with biologists, neuroscientists, and philosophers. He sees NFTs as an opportunity to present scientific publications outside the scientific community.

Agoria has released five albums with both major labels Universal Music and Virgin, as well as indie label PIAS. He was an early contributor to the French electronic music scene, founding his own label, Sapiens, and the Lyon electronic music festival Les Nuits Sonores. It was during his time as a DJ that he became known as Agoria, after ‘Agora,’ meaning ‘meeting place’ in ancient Greek.

In the art world, Agoria has collaborated with Philippe Parreno on art exhibitions and performances at the Armory Park in NYC and Tate Modern’s Turbine Hall in London, and he started his own solo show at Miami Art Basel. His project {Compend-AI}, a visual extension of neuroscience, was nominated for exhibition in Times Square in 2022."""
