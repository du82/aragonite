["https://verse.works/series/anticyclone-by-william-mapan"]
title = "Anticyclone by William Mapan | Verse"
description = '''
Anticyclones are a weather phenomena.
They pierce through darkness to instill peace and calm. Their planetary scale reminds us of how little we are and how powerful they can be. High pressure, rotation, air flow… 

The *Anticyclone* series is an artistic exploration and interpretation of those concepts. The rendering borrows its aesthetics from traditional and organic media like paper and crayons, to lend an analog/archival look.

"Can a computer draw like a human?"
The question is asked and challenged once more through *Anticyclone*.'''
