title = "Finder Files by emilio.jp | Verse"
description = """
*Finder Files* reimagines something we take for granted: windows—those we open, close, and scroll through every day. This series forces us to stop and look, transforming these everyday actions into something poetic, abstract, and reflective. The works turn the desktop into a gateway, a boundary, a mirror—revealing the aesthetics hidden in our digital habits.

A continuation of emilio.jp’s signature work, *Macintosh lab*, *Finder Files* transforms the Mac OS desktop into an artistic medium, challenging the neutrality of technology, exposing how interfaces shape our perception and memories."""
