["https://verse.works/series/phantasmagoria-by-mazin"]
title = "Phantasmagoria by Mazin | Verse"
description = '''
*Phantasmagoria* is a deeply cold and dreamy dark-fantasy world defined by its unique glitch aesthetic. 

Surreal gothscape’s are composed of experimental, grotesque and glyptic architectural elements. 

The series blends AI, generative art, data-bending and glitch techniques to craft a purely digital universe. Mazin envisions himself as a "realm photojournalist" in this vast, enigmatic world, where every detail reveals its own story. In a land overtaken by corruption, purity endures at its roots. Souls persist amid the decay, while majestic structures stand resilient.'''
