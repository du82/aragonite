["https://verse.works/lisson-gallery"]
title = "Lisson Gallery | Verse"
description = """
Lisson Gallery is one of the most influential and longest-running international contemporary art galleries in the world. Today the gallery supports and promotes the work of more than 60 international artists across two spaces in London, two in New York, one in Shanghai and Beijing, as well as a forthcoming gallery in Los Angeles, opening 15 April. Established in 1967 by Nicholas Logsdail, Lisson Gallery pioneered the early careers of important Minimal and Conceptual artists, such as Art & Language, Carl Andre, Daniel Buren, Donald Judd, John Latham, Sol LeWitt, Richard Long and Robert Ryman among many others. It still works with many of these artists as well as others of that generation from Carmen Herrera to the renowned estate of Leon Polk Smith.

In its second decade the gallery introduced significant British sculptors to the public for the first time, including Tony Cragg, Richard Deacon, Anish Kapoor, Shirazeh Houshiary and Julian Opie. Since 2000, the gallery has gone on to represent many more leading international artists such as Marina Abramović, Ai Weiwei, John Akomfrah, Susan Hiller, Tatsuo Miyajima and Sean Scully. It is also responsible for raising the international profile of a younger generation of artists led by Cory Arcangel, Ryan Gander, Van Hanos, Hugh Hayden, Haroon Mirza, Laure Prouvost, Pedro Reyes, Wael Shawky and Cheyney Thompson."""
