["https://verse.works/fellowship"]
title = "Fellowship | Verse"
description = """
Fellowship aims to connect the past and present to shape the future of art. Founded in 2021 by artists, collectors, and Web3 pioneers, the organisation connects the lineage of art’s rich history to break down barriers between the traditional and the new, paving the way for an inspiring and vibrant future.

To date, Fellowship has showcased remarkable collections from pioneering and contemporary artists alike. This includes iconic figures like August Sander, Joel Meyerowitz, László Moholy-Nagy, Guy Bourdin, Gregory Crewdson, and Laurie Simmons. Furthermore, they’ve presented works from emerging and prominent names such as Mauricio Alejo, Christopher Anderson, Jonas Bendiksen, Dmitri Cherniak, John Divola, Tania Franco Klein, Todd Hido, Satellite Lab, Pablo López Luz, Elman Mansimov, Prisca Munkeni Monnier, Roope Rainisto, Simon Raion, Alex Webb, and Yatreda, among others."""
