["https://verse.works/0xdeafbeef"]
title = "0xDEAFBEEF | Verse"
description = """
0xDEAFBEEF is an artist and engineer based in Toronto, Canada. Over the past 20 years, he has been tinkering in diverse areas overlapping art and technology including music, sound recording, computer animation, blacksmithing, and generative art.

He received his BASc in electrical engineering and MSc from the University of Toronto, where he contributed to internationally recognized research in the field of computer animation. As a classically trained musician with a strong background in sound technology, 0xDEAFBEEF brings together all his interests in bespoke art practice, using low-level computer code and a minimal toolset to craft raw information into audiovisual artworks. Generative works adopting blockchain technology as both subject and medium have been a focus since 2021."""
