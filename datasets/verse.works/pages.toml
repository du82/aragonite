["https://verse.works/series/love-letter-to-la-by-0009"]
title = "Love Letter to LA by 0009 | Verse"
description = '''
Reflecting on my years growing up in 1990s Los Angeles, I realize how deeply this time and place shaped the person I am today. That’s why I created this series – it’s my tribute to a daily life that was as unpredictable as it was full of possibility. The culture felt golden, and I felt proud to be part of it. 


Skating across the city back then was a constant journey of discovery. Each spot held its own latent story, waiting to unfold. The streets pulsed with energy, a vibrant mix of cultures and sprawling urban landscapes that set the stage for countless adventures. In these moments I learned resilience, creativity, freedom, friendship, and the power of intersecting subcultures to shape a rich sense of identity. 


This series uses the kind of hyperbole and bravado I felt in those days, to portray stories of my transformation from adolescence to young adulthood. Every piece captures a specific tale from this era, many narrated alongside the individual artworks. They’re about finding my voice and freedom within the chaos, and how those moments became the foundation of who I am. Each one weaves together memories from those early years with the dreams that fueled me during that formative time


Creating this work is not just about nostalgia, but about honoring the spirit of a time that defined me – and continuing to grow through these reflections. This is my love letter to Los Angeles.


—

*Love Letter to LA* \
2024

Artworks sold before December 9, 2024 come with an archival pigment print on Hahnemühle Photo Rag Baryta paper, 20 in. on the long side, signed on Verso. Each corresponding token represents the ownership over the unique original print, to be claimed by the token holder, with shipping at additional cost. Upon resale on the secondary market, the original shall be shipped to the new owner. The receiver of the work will cover shipping costs.'''
