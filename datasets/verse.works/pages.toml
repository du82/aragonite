["https://verse.works/alejandro-campos"]
title = "Alejandro Campos | Verse"
description = """
Alejandro is a Spanish Creative Coder based in Rotterdam, where he currently holds an academic position as a Lecturer at the Department of Architecture, Delft University of Technology. As a scholar, Alejandro specialises in the history of Modern Architecture and the colonial dynamics behind its universalising claims.
 

His generative artworks connect interests on art history, critical theory, classical music, architecture and technology in experimental and unexpected ways, often driven by playful and bright aesthetics. He has released the *Enfantines* (fxhash, 2022) and *Fuga a tientas* (Verse, 2023), showing his love for children drawings. More recently, Alejandro has released series that experiment with the intersection of creative coding and analog techniques, such as *Pensado a mano* (fxhash, 2023), a co-creation experiment that uses hand-drawn inputs, and *Draftwerk* with Anna Beller (Verse, 2023).


Moreover, Alejandro is a practicing architect, co-founder of [arqtistic.com](https://arqtistic.com/), an architecture office based in Valencia and Ontinyent (Spain). Working with a multidisciplinary perspective, the office has developed a wide range of projects, from built designs to research publications, has received prizes in architectural competitions and its work has been exhibited and published."""
