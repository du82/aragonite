["https://verse.works/board"]
title = "Curatorial board | Verse"
description = "Peter Bauman, also known as Monk Antony, is responsible for Le Random's editorial branch, commissioning exclusive content and interviews. He was a founding member of Tender Art and has written for platforms like Right Click Save."
full_description = "Curatorial boardPeter BaumanPeter Bauman, also known as Monk Antony, is responsible for Le Random's editorial branch, commissioning exclusive content and interviews. He was a founding member of Tender Art and has written for platforms like Right Click Save.Brian DroitcourBrian Droitcour is Editor-in-Chief of Outland, a platform dedicated to digital art and emerging technologies. He has contributed to Artforum and previously served as Associate Editor of Art in America.John GerrardJohn Gerrard is a leading artist in the realm of real-time computer graphics, creating virtual worlds. His work has been exhibited at prominent venues like Hayward Gallery, LACMA, and MoMA, and he is represented globally by Pace Gallery.Carmen JuliáCarmen Juliá is the curator at Spike Island Art Centre, overseeing its exhibitions and public programs. She curated Veronica Ryan’s Turner Prize-winning exhibition ‘Along a Spectrum’ and previously worked at Tate Britain.Jo Lawson-TancredJo Lawson-Tancred is a European News Reporter for Artnet News, with bylines in Apollo, The Guardian, and the Financial Times. Her forthcoming book, AI and the Art Market, will be published in November 2024.Melanie LenzMelanie Lenz is the Curator of Digital Art at the Victoria & Albert Museum, specializing in digital arts and culture. She co-curated Chance and Control: Art in the Age of Computers and serves as a judge for the Lumen Prize.Lorna MillsLorna Mills is a Canadian new media artist renowned for her digital animations and GIFs sourced from internet subcultures. Her works critique modern consumption and internet culture, with exhibitions at the Whitney Museum and Hayward Gallery.Clara PehClara Peh is an independent curator and writer focused on the intersections of art, technology, and money, particularly in Asia. She has collaborated with institutions like Art Dubai and published in outlets such as ArtAsiaPacific and Hyperallergic.Andrew RentonAndrew Renton has curated international exhibitions, including the first 'Manifesta' in 1996. He was the founding director of Marlborough Contemporary in London and has advised numerous private collections and institutions, including the British Government Art Collection.Sebastian SanchezSebastian Sanchez is a pioneer in digital art and web3, co-founding the generative art platform ARTXCODE. He also teaches at Columbia University and previously led web3 projects for major brands like Warner Brothers and HBO.Kenny SchachterKenny Schachter is a artist, writer and curator, known for his contributions to Artnet and publications like The Art Newspaper. His mid-career survey took place at the Francisco Carolinum Museum, and he’s represented by Galerie Nagel Draxler in Germany.Katrina SchwarzKatrina Schwarz has curated arts projects in over 30 countries, including major exhibitions like 'David Shrigley: Lose Your Mind' and 'Sarah Lucas: I Scream Daddio' at the Venice Biennale. She currently serves as Curator of Special Projects at Whitechapel Gallery, focusing on the Max Mara Art Prize for Women.Eileen Isagon SkyersEileen Isagon Skyers has worked with major arts institutions like David Zwirner and the Whitney Museum, as well as web3 organizations including Foundation and Feral File. Her writing appears in publications like Frieze, Hyperallergic, and Outland.SsslukeSssluke is an artist and Artistic Director of GrailersDAO, a community that supports generative and blockchain-based artists. GrailersDAO’s members include prominent artists such as Stefano Contiero, Tyler Hobbs, and Emily Xie.Subscribe to get the latest on artists, exhibitions and more."
