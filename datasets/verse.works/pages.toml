["https://verse.works/aa-murakami"]
title = "A.A. Murakami | Verse"
description = '''
A.A. Murakami, a London/Tokyo-based artist duo, are the founders of the Web3 project Floating World. Their sensory installations are an ongoing series of works that follow the tradition of artists emulating nature. In the same way ancient civilizations made structures to chart the passage of the sun or created early cave paintings to depict the natural world, A.A. Murakami pursues an innate human desire to use art to connect with and revere the natural systems on which our existence depends.

They are pioneers in "Ephemeral Tech," using technology to explore the intrinsic drive for creation and evoke both primordial origins and future worlds.

The artists’ work is included in the permanent collections of the Museum of Modern Art, New York; the Centre Pompidou, Paris; and M+, Hong Kong.'''
