["https://verse.works/aaron-penne"]
title = "Aaron Penne | Verse"
description = """
Aaron Penne (b. 1988, United States) is a renowned artist and engineer making generative artwork with code since 2018. His work has been sold at Sotheby’s and Christie’s, and he has shown internationally at galleries and museums such as ZKM Center for Art and Media Karlsruhe Museum, Seattle NFT Museum, CADAF, and Bright Moments Gallery amongst others.

Penne is currently the Director of Engineering at Art Blocks, aiming to help build the future of generative art as a medium. In 2021 he was one of the top 50 artists in the NFT space globally. In 2022, Aaron Penne and his musical collaborator Boreta received the inaugural NFT Award for the Lumen Prize for Art and Technology."""
