full_description = "@media (min-width: 978px) { #tmk--00027IYTm5ofrI + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001M0jj07sG8lM + .kevel-skeleton { display: none; } }Regeringen vil tillade politiet at efterforske i private DNA-databaser Kriminalteknik13. februar kl. 12:002 kommentarer Illustration: Rigspolitiet.Efter at politiet i 2023 fik mulighed for ‘slægtsskabssøgning’ i egne DNA-databaser, er regeringen nu parat til næste skridt. Carsten Bessing Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto Carsten Bessing Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret kontoMed et kommende lovforslag vil regeringen udvide politiets muligheder for såkaldt genetisk slægtskabssøgning, som i 2023 blev tilladt i efterforskningen af grove forbrydelser på baggrund af et borgerforslag stillet af en efterforsker hos politiet. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.2 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 2 Michael Rangård 17. februar kl. 08:45 svarede Henning Kjær [1]Re: SlægtskabsopklaringMan kan fortsætte slægtskabssøgningen for at nogle udenlandske gerningsmænd ikke skal forblive uopdagede. Så kunne vi jo forlange at alle udenlandske mænd afgav en blodprøve ved indrejse i landet, på samme måde som de viser deres pas. Så kan der opbygges er stort register over alle mænd der har besøgt landet.Da en gerningsmand både kan være en mand og en kvinde, hvorfor så begrænse DNA-prøven til alle udenlandske mænd? Vi har allerede en DNA-test på stort set alle danskere (født i Danmark), så hvis bare politiet kunne få adgang til den database, så er vi langt de næste mange generationer...Man kunne starte med en blodprøve på alle der søger ophold i Danmark (asyl, arbejdstilladelse m.m.), for hvorfor begrænse det til fremmede der besøger vores land :)Heldigvis kan man ikke dømmes udelukkende på slægtskabs-DNA, det kræver stadig at den kriminelle bliver dømt ved en domstol. Det kræver beviser og som regel ud over at der er en matchende DNA-prøve... 2 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Henning Kjær 16. februar kl. 13:08SlægtskabsopklaringDet virker urimeligt/uretfærdigt at nogle kriminelle skal risikere afsløring fordi de tilfældigvis er i familie med en nævenyttig slægtsforsker der spreder egne og familiemedlemmers genetiske karakteristika alle vegne rundt i verden til fri afbenyttelse og uden reel kontrol over hvad disse genetiske karakteristika bliver brugt til. For at fjerne den rene tilfældighed ved en afsløring/opklaring og øge opklaringerne kan man også åbne for søgning i alle data fra det Nationale Genom Center og genanalyser eller af alle danskeres hælprøver. Så er der på sigt stor sandsynlighed for at afsløre alle danske kriminelle gerningsmænd til de alvorligste forbrydelser og ikke kun nogle få ekstremt uheldige danske gerningsmænd.Man kan fortsætte slægtskabssøgningen for at nogle udenlandske gerningsmænd ikke skal forblive uopdagede. Så kunne vi jo forlange at alle udenlandske mænd afgav en blodprøve ved indrejse i landet, på samme måde som de viser deres pas. Så kan der opbygges er stort register over alle mænd der har besøgt landet.Hvor meget vil vi acceptere for at afsløre/kriminelle. Hvor meget retfærdighed kræver borgerne, hvad er retfærdighed for de kriminelle. 1 5more_vert insert_linkKopier link"
