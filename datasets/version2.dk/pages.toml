har angiveligt afskåret sig selv fra at få adgang for, på den måde, at isolere sig fra risikoen fra at blive pålagt at skaffe myndighederne adgang. Jeg skal ikke gøre mig klog på effektiviteten eller holdbarheden af sådanne tiltag.Apples CEO Tim Cook har været og kysse Trumps fod for at slippe for den 10% told på varer fra Kina som er blevet indført. Alle Apples devices laves i Kina og USA er Apples største marked-Den slag gunstbevillinger fra Trump kommer ikke uden en omkostning. Vi vil meget snart se opdatering til Apple devices - en opdatering der rummer "sikkerhedsforbedringer". 25 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 7 Jens Find 24. februar kl. 10:44 svarede Carsten Stenberg [5]Re: Alle efterretningstjenster udspionerDet er kun nyttigt at drive sit eget datacenter i den udstrækning at du holder det adskilt fra Internettet. Selv 'airgapping' har sine begrænsninger :-( 9 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 6 Gert Madsen 24. februar kl. 10:32 svarede Carsten Stenberg [5]Re: Alle efterretningstjenster udspionerDet er naivt at tro, at efterretningstjenster i europa skulle være bedre end i USA og KinaUenig.Der er ikke samme pres for at europæiske efterretningstjenester hjælper industrien. 16 7more_vert insert_linkKopier linkSkrevet på Ingeniøren 5 Carsten Stenberg 24. februar kl. 10:22Alle efterretningstjenster udspionerDet er naivt at tro, at efterretningstjenster i europa skulle være bedre end i USA og Kina, så hvis man vil holde på sine forretningshemmeligheder, så er der ikke andre løsninger end at man drive sit eget datacenter. 20 2more_vert insert_linkKopier link 4 Morten Fordsmand 24. februar kl. 10:14Nu er kabelsamarbejdet jo ikke så vigtigtNår det USA'nske regime kan trække din dokumenter og mails direkte fra Office365 eller hvilken sky det nu ligger i. 27 3more_vert insert_linkKopier linkSkrevet på Ingeniøren 3 Søren Koch 24. februar kl. 10:01 svarede Jesper Madsen [2]Re: Den eneste trøst er atKorrekt, men hvilken organisation har også mest computerkraft til rådighed til den slags filtrering (og sansynligvis i realtime)? Hint: Det er ikke Google eller Facebook 7 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 2 Jesper Madsen 24. februar kl. 09:37Den eneste trøst er atDen eneste trøst er at det må være 99,999% ubrugelige data. Det meste skal vel bruges i en kontekst i et bestemt tidsrum. 3 5more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Jens Find 24. februar kl. 08:58Allerede med Snowdens afsløring afAllerede med Snowdens afsløring af kabelsamarbejdet var det klart, at USA spionerer mod alt og alle. Selv den frommeste forståelse af en formodet aftale om, at data vedrørende danske borgere (og interesser), bliver jo latterlig når man betragter det banale faktum, at ethvert kabel har to endepunkter. Et kabel mellem Danmark og Tyskland kan bruges til at spionere mod Tyskland fra den 'danske' ende - og mod Danmark fra den 'tyske'.Begreberne 'spionage' og 'overvågning' er jo blevet udvandet så den blotte indsamling betragtes som nærmest uskadelig. Først ved aktiv søgning i det indsamlede materiale er der - efter en aggressiv tolkning - tale om overvågning.At tech-selskaber indsamler data 'med arme og ben' har været åbenlyst i mange år. Det ligger 'lige til højrebenet' at de - med de herskende politiske vinde in mente - kommer til at dele deres indsamlede data med de myndigheder der finder interesse deri.Enkelte selskaber har givet udtryk for at modsætte sig myndigheders ønske om at tilegne sig deres kunders/brugeres data. F.eks. har Apple givet udtryk for at have udviklet mekanismer der vanskeliggør adgang for alle andre end brugerne selv. Apple har angiveligt afskåret sig selv fra at få adgang for, på den måde, at isolere sig fra risikoen fra at blive pålagt at skaffe myndighederne adgang. Jeg skal ikke gøre mig klog på effektiviteten eller holdbarheden af sådanne tiltag. 36 1more_vert insert_linkKopier linkSkrevet på Ingeniøren'''
