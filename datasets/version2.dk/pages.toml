["https://version2.dk/artikel/kan-du-se-forskel-superbrugsen-og-kvicklys-naeste-tilbudsavis-har-modeller-skabt-af-ai"]
title = "Kan du se forskel? SuperBrugsen og Kvicklys næste tilbudsavis har modeller skabt af AI | Version2"
description = "Her er en side fra Coops næste tilbudsavis. Modellen til venstre er rigtige mennesker, men modellen til højre er skabt af AI. Det er første gang, at den danske supermarkedsgigant bruger AI-modeller."
full_description = '''@media (min-width: 978px) { #tmk--000qtDU2IzN-Co + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001tkoTfmeyP0c + .kevel-skeleton { display: none; } }Kan du se forskel? SuperBrugsen og Kvicklys næste tilbudsavis har modeller skabt af AI Kunstig Intelligens20. februar kl. 09:5416 kommentarer På billederne i tilbudsavisen fra Superbrugsen og Kvickly er modellerne til venstre rigtige mennesker, der er blevet fotograferet på traditionel vis, mens modellen til højre er AI-genereret. Illustration: Coop.Her er en side fra Coops næste tilbudsavis. Modellen til venstre er rigtige mennesker, men modellen til højre er skabt af AI. Det er første gang, at den danske supermarkedsgigant bruger AI-modeller. Christopher Kock Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto Christopher Kock Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret kontoNormalt er SuperBrugsens tilbudsavis ikke noget, der trækker overskrifter.Men den kommende tilbudsavis fra Coops Kvickly og SuperBrugsen er alligevel ret speciel. Her kan man nemlig for første gang se mennesker skabt af AI posere med butikskædernes bluser, cardigans, og kjoler.Artiklen fortsætter efter annoncenDet skriver Coop i en pressemeddelelse. Her står der også, at de AI-genererede modeller optræder side om side med rigtige mennesker af kød og blod, der er fotograferet til samme avis.AI giver Coop mulighed for at præsentere endnu flere varer med modeller, fortæller Heidi Kessler, der er senior marketingschef hos Coop:»For kunderne vil det betyde mere inspirerende tilbudsaviser. Foreløbig er det en test, men vi forventer, at det vil brede sig. Derfor er det afgørende for os, at vi er åbne og transparente omkring brugen,« siger hun i pressemeddelelsen.Det er reklamebureauet Republica, der samarbejder med Coop og skaber de computergenererede personer med deres tøj på. Bureauets driftsdirektør Mette Hassing Christensen mener, at de kan arbejde mere kreativt med AI.Artiklen fortsætter efter annoncenING/TechJobchevron_rightOpret jobannonceTilpas»Hidtil har der været begrænsninger på, hvor kreative løsninger vi kan lave i en tilbudsavis og anden markedsføring, når det kræver locations, modeller, fotografer og makeup-artister for at skabe et billede,« siger hun i pressemeddelelsen.Okay at man ikke kan se forskelHeidi Kessler erkender, at det kan være så godt som umuligt at se forskel på rigtige og computergenererede mennesker.Til Ingeniøren fortæller hun, at hun ikke ser noget problem i, at man ikke kan se forskel. Det vigtigste er, at tøjet ser godt ud, forklarer hun.»Vi ved bare, at tøj sælger bedst, når det er på et levende menneske,« siger hun. Læs ogsåMicrosoft-rapport: Folk bliver dummere af kunstig intelligensDet er dog først nu, at teknologien er blevet så troværdig, at Coop nu tager springet og begynder at bruge det.»Vi ville ikke have gjort det for et halvt år siden,« siger Heidi Kessler.Sender varerne til reklamebureauI pressemeddelelsen fremgår det ikke, hvordan de AI-modeller bliver til. Det løfter Heidi Kessler dog sløret for til Ingeniøren.Artiklen fortsætter efter annoncenCoop sender fysiske udgaver af trøjer, bukser, skjorter og andet tøj til Republica, som tager billeder af tøjet, mens det for eksempel hænger frit på en bøjle.Reklamebureauet forvandler så billederne af tøjet til billeder af realistiske modeller, der har tøjet på, med et program de selv har udviklet. Programmet bygger på AI-værktøjet Krea.ai.Ifølge marketingschefen kan programmet skabe AI-modeller på en specifik måde, der kan tilpasse alt fra køn, alder, hårfarve og etnicitet. Republic behandler bagefter billederne, så de ser så troværdige ud som muligt.Hun fortæller også, at Coop gør meget ud af at gøre modellerne så naturtro som muligt, så man ikke kan se forskel. Alligevel mener hun, at det er vigtigt at være transparent med brugen af AI, hvilket de er ved at skrive i avisen, at der er ‘billeder, der kan være AI-genereret’, lyder det. WebinarAI Act & AnsigtsgenkendelseBrugen af computergenererede modeller er i første omgang kun en test, skriver Coop.Remote video URLEmnerKunstig IntelligensFølgDu skal være logget ind for at følge et emne.Log indOpret kontoErhvervFølgDu skal være logget ind for at følge et emne.Log indOpret konto16 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 16 Morten Steen 21. februar kl. 16:32Varens pasformHvis man skal kunne stole på at tøjet har pasform, burde man bruge en gine (som dem i udstillingsvinduerne). Så kan man "snyde" med hoveder, arme og ben, der hvor de ses.Det er snyd at photoshoppe tøjet. 5 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 15 Morten Kvistgaard 21. februar kl. 11:06... faktisk kunne man jo... faktisk kunne man jo generere hele reklame-katalog'et med AI. Den slags er jo ikke ligefrem "nyskabende" eller kreative. Opskiften er lidt på plads. Et tryk på en knap og så har man de næste 12 måneders kataloger. Så kan butikken derefter selv kigge i kataloget og sige "Wow, vi har smør til 10 kr. i næste uge. Det gør vi så!".Mind-blowing! 3 1more_vert insert_linkKopier link 14 Morten Kvistgaard 21. februar kl. 10:51Hvor meget kvalitetskontrol laver man mon?Gad vide hvor meget kvalitetskontrol man laver på de pågældende billeder? AI'er er jo "gennemsnits-maskiner". Så hvis man får en AI til at rendere en dame med en trøje der "ser ud som denne trøje", så får man jo per definition "ikke den eksakte trøje". Sidder der nogen og studerer billedet af trøjen nøje, for derefter at konkludere om det er en gyldig repræsentation? (Jeg tvivler lidt.)Men fair nok, hvis man blot betragter billederne som "trøje-eye-candy", på linie med mad-billeder, så er det da kanont. 0 0more_vert insert_linkKopier link 13 Mogens Kjær (1000) 21. februar kl. 08:46En sæk kartoflerDer er jo meget sympatisk at ansigtet på AI kvinden er lidt mere hverdagspæn og ikke sådan supermodel-tynd-køn.Men billedet dumper efter min mening med et kæmpe brag. Der er da ingen, som ser det billede og tænker "Ej, den bluse er pæn, den smutter jeg lige ned og henter."Jeg synes det er utroligt kikset, at de har ladet sådan et dårligt billede slippe igennem. Også de anatomiske anomalier. Og så mener jeg vel også at hvert billede skal mærkes. Ikke bare sådan en catch all bagest i bladet. 2 3more_vert insert_linkKopier linkSkrevet på Ingeniøren 12 Ditlev Petersen 20. februar kl. 20:48 svarede Jakob Kastrupsen [11]Re: På billederne i tilbudsavisen framodellenJeg tror, du har ret. 0 0more_vert insert_linkKopier link 11 Jakob Kastrupsen 20. februar kl. 20:29På billederne i tilbudsavisen fraPå billederne i tilbudsavisen fra Superbrugsen og Kvickly er modellerne til venstre rigtige mennesker ...*modellen til venstre et rigtigt menneske 2 0more_vert insert_linkKopier link 10 Allan Olesen 20. februar kl. 20:21Er vi helt sikre på, at de to andre billeder ikke er AI?Jeg har på mange AI-genererede personer bemærket et genkendeligt særpræg ved deres fingre (selv når antallet er rigtigt!). Jeg bilder mig ind, at jeg kan genkende denne fingertype på en af de menneskelige modeller i eksemplet. (Jeg er med vilje meget uspecifik, da jeg jo risikerer at kommentere på en rigtig persons udseende, hvis jeg tager fejl.)Kan det tænkes, at #5 er på rette spor, og at Coop forsøger at teste os ved at fodre os med forkert information om, hvilke billeder der er med menneskelige modeller? 2 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 9 Ditlev Petersen 20. februar kl. 19:24 svarede Mikkel Ekwall [2]Re: Kan I ikke lave etDen AI genererede kvindes højre arm/ærme er da helt ved siden af!Så se på venstre underarm. Det er da et dobbelt knoglebrud. 6 1more_vert insert_linkKopier link 8 Tom Paamand 20. februar kl. 17:10Den opskruede glans er et tydeligt tegn på billig AI...De fleste AI-modeller giver en alt for Disney-agtig kulør, som netop virker kunstig. Det er dog efterhånden svært at skelne, da programmer til fotobehandling nu ofte inddrager AI, så "rigtige" billeder også får påført denne utroværdige glans. 5 0more_vert insert_linkKopier link 7 Claudia Jürgensen 20. februar kl. 16:10Ekstra spild af billig tøjSelv om billederne nogen gange virker photoshoppede har jeg tit alligevel kunne konkludere at tøjet sad skidt og ikke var værd at gå efter eller bestille.Den information forsvinder med de AI generede billeder, dvs det skaber endnu mere ekstra spild.Så giver det mere mening bare at lægge tøjet fladt ned på hvid baggrund og lade folk selv vurdere. Ingen brug af penge til modeller eller IT-folk.Og i sidste ende virker det som en gimmick, der ikke er i COOPs generelle socialansvarlige ånd.Men det passer da virkelig fint sammen med Temukvaliteten, bare til de firedobelte priser.Der er virkelig nogen direktører, der ikke var deres løn værd, siden COOP er kørt så meget i sænk. 10 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 6 Kjeld Flarup Christensen 20. februar kl. 15:50Store online mulighederNu er det så til er papiravis. Men handel er jo gået online.Det vil jo være oplagt at en online tøjforretning lavede præsentationer med modeller af samme etnicitet som kunden selv. Ja man kunne jo gå skridtet videre, og generere med kunden selv som model. Skal vi gætte på hvor mange måneder der går inden vi ser det! 13 1more_vert insert_linkKopier link 5 Jens D Madsen 20. februar kl. 15:08 svarede Kristian P Larsen [3]Re: Stor forskelCoop bør tone helt rent flag og sætte en lille label på hvert AI-generet billede, der fortæller at det er AI. Så kan de vurdere om det bliver modtaget positiv eller negativt af kunderne.Det kunne være sjovt, at sætte dem lidt forkert, og se hvad det medfører. 2 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 4 Jan Ferré 20. februar kl. 14:51AI til reklamer er ikke problemetAI til reklamer er ikke problemet. Problemet er, hvad billederne bruges til.Generelt nærstuderer jeg ikke billeder i en reklameavis. Det er en slags baggrundsunderholdning til tekst/priser. Så om billederne er AI genererede eller om det er levende modeller er ikke så vigtigt for mig.Hvis en undertøjs-leverandør skulle beslutte sig til at bruge en Pia Kjærsgaard-figur som model - så ville jeg udelukke den leverandør uanset om billedet var AI-genereret eller Photoshoppet. Mens at det, hvis det var en anonym skikkelse på samme alder som Pia, kunne være helt fint med sådan et billede. Generelt ved vi jo godt, at vi ikke har figur som modellerne - så reelt er de en avanceret bøjle, der holder tøjet op for os. Og om dette sker med en levende model eller med AI er lidt ligegyldigt for mig som forbruger.Det er til gengæld ikke ligegyldigt for de modeller, der har brug for smør til brødet - eller til sidebenene. 7 1more_vert insert_linkKopier link 3 Kristian P Larsen 20. februar kl. 12:30Stor forskelCoop bør tone helt rent flag og sætte en lille label på hvert AI-generet billede, der fortæller at det er AI. Så kan de vurdere om det bliver modtaget positiv eller negativt af kunderne. Billedgeneratoren vil kunne få alt tøj til at sidde perfekt, og metoden kan helt klart bruges til at sælge tvivlsomme produkter.Selvom man ikke kan se forskel, er der er en verden til forskel på et ægte (omend photoshoppet) billede taget af en fotograf, og så et AI genereret billede. AI-billedet vil altid høre til i laveste discount klasse. 24 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 2 Mikkel Ekwall 20. februar kl. 10:53Kan I ikke lave etKan I ikke lave et svar felt der siger: Ja - men det er jo nemt at se det er AI genereret!Den AI genererede kvindes højre arm/ærme er da helt ved siden af!Så kan man selv bestemme om højre ærme er lavet med dobbelt så meget stof og trøjen er den skæveste model til at klare "kvalitets kontrollen" eller om kvinden åbenbart kun bodybuilder højre arm.Derudover har kvinden også udfordringer med en hængende højre skulder men det lider jeg selv af, så måske det er med vilje?Der er andre proportioner ved kvinden som virker besynderlige, med dem vil jeg udlade at kommenterer her :-) 18 5more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Jesper Madsen 20. februar kl. 10:45Interessant at varene i katalogetInteressant at varene i kataloget aldrig har eksisteret, så er bedraget ved fuldendt.. 5 0more_vert insert_linkKopier linkSkrevet på Ingeniøren'''
