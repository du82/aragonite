["https://version2.dk/feeds"]
title = "RSS-feeds | Version2"
description = "#Nyhedsfeeds (RSS) Version2 tilbyder store dele af sit indhold som RSS-feeds. [Seneste nyheder](https://www.version2.dk/rss) [Seneste blogs](https://www.version2.dk/blogs/rss) [Seneste kommentarer](https://www.version2.dk/debat/rss) #Retningslinjer for brug af Version2's RSS-feeds Teknologiens Mediehus tilbyder en lang række RSS-feeds, hvor de seneste nyheder, job og blog-indlæg kan hentes på et meget specifikt emneniveau. ##Privat brug"
full_description = "RSS-feedsNyhedsfeeds (RSS)Version2 tilbyder store dele af sit indhold som RSS-feeds.Seneste nyhederSeneste blogsSeneste kommentarerRetningslinjer for brug af Version2's RSS-feedsTeknologiens Mediehus tilbyder en lang række RSS-feeds, hvor de seneste nyheder, job og blog-indlæg kan hentes på et meget specifikt emneniveau.Privat brugRSS-feeds stilles frit til rådighed for enkeltpersoners private brug, og du er således velkommen til at lade Version2's nyheder og blog-indlæg indgå i nyhedsoversigter på din pc, mobiltelefon eller lignende.Offentlig brugIndholdet i RSS-feeds er beskyttet af ophavsret, men Teknologiens Mediehus accepterer også, at RSS-feeds indgår i nyhedsoversigter, der er tilgængelige for andre - for eksempel via din virksomheds hjemmeside, intranet eller extranet.Version2 skal i disse tilfælde angives som kilde, og der skal linkes til de enkelte artikler på version2.dk. Det er ikke tilladt at benytte Version2's logo i denne sammenhæng.Ved offentlig brug kræves, at Teknologiens Mediehus forudgående orienteres om anvendelsens art, navn på den ansvarlige samt kontaktoplysninger. Oplysningerne sendes til community@version2.dk.Der må ikke opbygges en database med indholdet fra RSS-feeds, så overskrifter og lignende gemmes længere tilbage i tiden. Kun tekst indeholdt i det aktuelle RSS-feed må offentliggøres.Teknologiens Mediehus forbeholder sig ret til at ændre disse retningslinjer samt i konkrete tilfælde at nægte offentlig brug af RSS-feeds.Seneste nyheder"
