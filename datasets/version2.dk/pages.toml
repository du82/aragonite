full_description = "@media (min-width: 978px) { #tmk--0004DeTLFQ6DnU + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001g98QGvRsrWQ + .kevel-skeleton { display: none; } }Politiet ransager mobiltelefoner med faceID uden kendelser Overvågning14. februar kl. 05:002 kommentarer Illustration: Morten Rasmussen/Biofoto/Ritzau Scanpix.Eksperter kritiserer de manglende klare rammer for, hvad politiet kan tillade sig at gøre, når de får adgang til telefoner. Mats Magnussen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto Lyt til artiklen oplæst af en stemme klonet på Ingeniørens Henrik Heide Mats Magnussen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret kontoHvad gør politiet egentlig med de mobiltelefoner, de beslaglægger?I 2019 fastslog Højesteret, at politiet lovligt kan bruge en borgers fingeraftryk til at åbne en mobiltelefon i forbindelse med en anholdelse. I dag benytter mange dog ansigtsgenkendelse, såsom Face ID, til at låse deres telefon op. Derfor forsøger politiet nu også at få adgang til mistænktes telefoner ved at holde dem op foran deres ansigt. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.2 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 2 Maciej Szeliga 14. februar kl. 09:43Nu kan man bare lade være......med at bruge det der biometri på den måde.Det er kun nok som identifikation men ikke som authorisation - korrekt brug er altså: jeg genkender brugeren men spørger alligevel efter kode. 27 0more_vert insert_linkKopier link 1 Svend Jørgensen 14. februar kl. 09:40UskikI 2019 fastslog Højesteret, at politiet lovligt kan bruge en borgers fingeraftryk til at åbne en mobiltelefon i forbindelse med en anholdelse. I dag benytter mange dog ansigtsgenkendelse, såsom Face ID, til at låse deres telefon op. Derfor forsøger politiet nu også at få adgang til mistænktes telefoner ved at holde dem op foran deres ansigt.Det er det samme som at trænge ind i et privat hjem for at ransage det, noget som politiet skal have en dommerkendelse til, med mindre der er overhængende fare, så er der undtagelser, som faktiske involvere en dommer.De danske borgere kan ikke stole på at danske myndigheder holder sig inden for lovens rammer og det har nedbrydende effekt på vores demokrati. 37 3more_vert insert_linkKopier link"
