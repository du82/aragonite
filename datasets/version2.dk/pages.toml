title = "Norge forbyder brug af Deepseek i Stortinget | Version2"
description = "Du kan modtage notifikationer, når vi udgiver nyt indhold, der interesserer dig, baseret på hvilke interesserer og skribenter du følger.Log ind eller opret en konto for at komme i gang."
full_description = "@media (min-width: 978px) { #tmk--000ICE9YU1bdPA + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--0014hsO9aulvFM + .kevel-skeleton { display: none; } }Norge forbyder brug af Deepseek i Stortinget Databeskyttelse13. februar kl. 10:20 Illustration: Hasan Mrad/Zuma/Ritzau Scanpix.Det norske Stortinget har modtaget en advarselsmail fra Norges nationale sikkerhedsmyndighed (NSM) om brug af Deepseek. Det tager man nu konsekvensen af. person Sebastian Døssing Journalist, Ingeniøren Følg Du skal være logget ind for at følge et emne.Log indOpret konto person Sebastian Døssing Journalist, Ingeniøren Følg Du skal være logget ind for at følge et emne.Log indOpret kontoNorske politikere må ikke længere anvende den kinesiske chatrobot Deepseek.I hvert fald ikke på telefoner, tablets og computere, der har adgang til Stortingets systemer.Artiklen fortsætter efter annoncenDet oplyser Stortingets administration til norske Altinget.Beslutningen kommer efter en mail fra Norges nationale sikkerhedsmyndighed (NSM), der advarer norske virksomheder mod at bruge Deepseek. Den advarsel tager Stortinget seriøst, hvorfor man nu følger trop:»Serviceenheder er en integreret del af organisationens digitale infrastruktur med samme behov for sikkerhed som for eksempel stationære eller bærbare computere. NSM anbefaler på det kraftigste, at norske virksomheder ikke overlader det til den enkelte medarbejder at bestemme, hvilke applikationer der kan downloades på serviceenheder,« lyder det i mailen fra NSM.Stortinget oplyser til Altinget, at forbuddet skal beskytte folks personfølsomme oplysninger.Artiklen fortsætter efter annoncenING/TechJobchevron_rightOpret jobannonceTilpasForbuddet gælder også enheder, som DeepSeek allerede er installeret på, og hvor tjenesten ikke længere vil være tilgængelig.Stortinget er dog ikke er bekendt med sikkerhedsbrud gennem brug af apps, som har adgang til parlamentets systemer.Ingen retningslinjer i DanmarkDet er ikke kun i Norge, at der er en bekymring vedrørende brug af Deepseek. Både Italien og Australien har ligeledes boykottet chatrobotten.Deepseek har skrevet offentligt i sine brugerbetingelser, at hvis man bruger den gratis version, ender brugernes data i Kina. Det er også grunden til, at Australien indtil videre har trykket på stopknappen, fordi det skaber en »uacceptabel risiko for national sikkerhed«. Læs ogsåDansk virksomhed forlod AWS og flyttede alt i tysk cloud: »Det er helt klart under halv pris«»Det er i stigende grad den tilgang, regeringen anvender, når der er spørgsmål om sikkerhed,« har Kieren McCarthy fra cyber intelligence-firmaet Oxford Information Labs tidligere udtalt til BBC.Mens flere lande forbyder Deepseek, har Folketinget ikke udstukket officielle retningslinjer om brug af Deepseek, hvorfor der heller ikke er noget forbud.»Folketingets Administration er opmærksomme på Deepseek og andre apps, som er under mistanke for potentielt at kunne bringe datasikkerheden i fare. Vi støtter os til myndighedernes vurderinger, og vi har for øjeblikket ikke konkret information, som giver anledning til at begrænse folketingsmedlemmernes brug af Deepseek,« har Folketinget oplyst til Ingeniøren.Administrationen har dog oplyst om Deepseek:Artiklen fortsætter efter annoncen»Som med andre digitale tjenester lægger Folketinget vægt på at uddanne brugerne og gøre dem bevidste om teknologiske risici. Derfor har administrationen orienteret bredt om den nye chatbot og de risici, der findes omkring den, samt anbefalet, at man udviser forsigtighed ved brug af appen.«»Disse konkrete initiativer stemmer overens med Folketingets generelle tilgang, hvor vi lægger vægt på en høj bevidsthed hos brugerne om sikker it-adfærd.«For godt og vel en uge siden oplyste Region Hovedstaden til Radio IIII, at de forbyder Deepseek. Efterfølgende fulgte Region Nordjylland og Midtjylland efter.Opdatering: Efter publiceringen af denne artikel har Folketinget meddelt, at man fraråder folketingsmedlemmer, partiansatte og ansatte i Folketinget at anvende Deepseek.Denne artikel Nej fra Folketinget til TikTok: Men Deepseek accepteres af Borgens it-chef Deepseek sender dine data til Kina: Nu reagerer ItalienFokusSchrems II: Den globale cloud-hovedpineEmnerDatabeskyttelseFølgDu skal være logget ind for at følge et emne.Log indOpret kontoIngen kommentarer endnu. Start debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat"
