full_description = '''@media (min-width: 978px) { #tmk--000CIj3SaiVoCY + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001mfjbLGa1yHc + .kevel-skeleton { display: none; } } TophistorieDansk virksomhed forlod AWS og flyttede alt i tysk cloud: »Det er helt klart under halv pris« Digitalisering25. februar kl. 05:0013 kommentarer Orbit Online begyndte at lukke sine servere hos den amerikanske tech-gigant AWS tilbage i 2020. Illustration: Tony Webster/AWS - Amazon Web Services Office in Houston, Texas/Wikimedia Commons.Ustabile forhold mellem EU og USA og en trang til at bevise sig leverandør-uafhængig fik Orbit Online til at skifte fra amerikansk til tysk cloud. I dag sparer direktøren både penge og de frustrationer ved afhængighed af big tech, som plager det offentlige. Louise Olifent Følg Du skal være logget ind for at følge et emne.Log indOpret konto Louise Olifent Følg Du skal være logget ind for at følge et emne.Log indOpret kontoDet danske samfund ville gå i stå uden de amerikanske tech-giganter.Det har kommuner og regioner slået fast flere gange det seneste år og påpeget, at deres dybe afhængighed af tjenester fra virksomheder som Microsoft, Google og Amazon Web Services (AWS) gør det meget svært at holde priserne nede.Det er nemlig en uoverskuelig opgave at skifte til en anden leverandør på eksempelvis cloud eller værktøjer som Word og Outlook, lyder det blandt andet fra kommunale it-chefer. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller p