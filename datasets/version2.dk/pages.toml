["https://version2.dk/holdning/hvordan-bruger-man-100-mia-fornuftigt"]
title = "Hvordan bruger man 100 mia fornuftigt? | Version2"
description = "Der er gang i de store armbevægelse i dansk forsvarspolitik, men ingen vil bruge pengene fornuftigt.Problemet er gammelkendt: Militæret er altid 100% fokuseret på vinde den forrige krig.I særdeleshed bør det mane til eftertanke at Danske regeringer mindst to gange har sendt landet i uføre med store og dumme forsvarsinvesteringer.Første gang var Gorm med alle hans ringborge: De har kostet ham en formue, og der er intet der tyder på at de nogensinde gjorde andet end at spilde hans penge.Lidt ligesom vores nuværende danske forsvar, hvor luftvåbnet ikke kan flyve og søværnet hverken kan sejle el"
full_description = '''@media (min-width: 978px) { #tmk--000lKR1hpvkX8Q + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--0011qGyEyG5ShQ + .kevel-skeleton { display: none; } } Dette indlæg er alene udtryk for skribentens egen holdning. BlogindlægHvordan bruger man 100 mia fornuftigt? Militær24. februar kl. 09:5346 kommentarer Poul-Henning Kamp Følg Du skal være logget ind for at følge et emne.Log indOpret konto Poul-Henning Kamp Følg Du skal være logget ind for at følge et emne.Log indOpret kontoDer er gang i de store armbevægelse i dansk forsvarspolitik, men ingen vil bruge pengene fornuftigt.Problemet er gammelkendt: Militæret er altid 100% fokuseret på vinde den forrige krig.Artiklen fortsætter efter annoncenI særdeleshed bør det mane til eftertanke at Danske regeringer mindst to gange har sendt landet i uføre med store og dumme forsvarsinvesteringer.Første gang var Gorm med alle hans ringborge: De har kostet ham en formue, og der er intet der tyder på at de nogensinde gjorde andet end at spilde hans penge.Lidt ligesom vores nuværende danske forsvar, hvor luftvåbnet ikke kan flyve og søværnet hverken kan sejle eller skyde. Om vi faktisk har en hær når paraderegimenterne er fratrukket er mig ikke klart.Men den suverænt største fejlinvestering var Københavns Befæstning, der målt i BNP er den dyreste forsvarsinstallation nogensinde, i noget land og som stort set stod færdig netop som Englands anvendelse af raketter gjorde den inderligt ligegyldig.Artiklen fortsætter efter annoncenING/TechJobchevron_rightOpret jobannonceTilpasRetfærdigvis skal dog siges at begge disse fejlinvesteringer direkte har givet os ret væsentlige herlighedsværdier i nutiden.Et meget stort problem er at militærfolk nærmest per definition elsker stort dyrt og imponerende isenkram, til trods for, at det i flere hundrede år igen og igen har vist sig at store skibe er meget nemmere at ramme end små skibe.I Ukraine er dette fænomen gået helt over gevind: Gør-det-selv-droner til få tusinde kroner vinder over "rigtigt" militært isenkram der har kostet rigtig mange millioner.Så hvis jeg skulle investere 100 mia i Danmarks fortsatte selvstændighed, ville jeg investere ned i størrelse. Sponseret briefingForsvaret oprustes med 120 milliarder: Få et unikt indblik i en verden af teknologi, ledelse og ansvarI stedet for store fregatter der forsvarer sig imod 1000kr droner med 10mio kr missiler, ville jeg placere en håndfuld små hurtige både i alle landets havne, hver af dem udstyret med et par hundrede skodbillige droner med forskellige velvalgte payloads.At bådene og dronerne kan og skal anvendes også til søredning, oliespild osv. siger sig selv, ligesom bådene også automatisk og i real-tid måler og indrapportere havvandskvaliteten når de sejler.Droner er imidlertid ikke noget værd hvis de ikke kan navigere, så vi skal også have bygget et lokalt dansk radionavigattionssystem, som ikke nemt kan jammes. Heldigvis er Danmark geografisk lille, så det kan klares med en håndfuld HF sendere, nogle billige atomfrekvensnormaler og lidt smart spread-spectrum modulation.Den altafgørende opgave for luftvåbnet er at kunne finde ud af hvad der foregår, f.eks checke om både er skalkeskjul for invasioner, slæber deres ankre eller andre redskaber hen over fiberkabler, lukker olie ud eller på anden vis begår miljøkriminalitet eller ulovligt fiskeri. DIGITAL TECH SUMMITFå tidlig adgang til Digital Tech Summit 2025Det er fint at have nogle få hurtige fly som kan nå frem på ingen tid, udstyret med state-of-the-art sensorer, specielt når nogen falder over bord i rum sø, men det er langt vigtigere at have en masse fly som billigt kan overvåge hvad der foregår på et bestemt sted i timevis og dagevis.Igen er droner helt klart på indkøbssedlen, jeg ville sætte som mål at alle skibe der passerer igennem sund og bælter rutinemæssigt videovervåges fra luften hele vejen, med særligt fokus på forurening og mistænkelig opførsel omkring undersøisk infrastruktur.Føler vi behov for at stoppe et skib, sender vi et par hundrede små billige droner ud som med røde lysdioder laver et STOP skilt i luften foran skibet, fatter de ikke budskabet dropper vi et par advarsels skud foran dem.Og i stedet for at fedte rundt som vi plejer, border vi dem på den mindste mistanke, men vi tager selvfølgelig altid en god kage med til mandskabet som undskyldning for ulejligheden. FRA TECHJOBFind job inden for it-sikkerhed og compliance: Find dit job på TechjobHvad vi skal med en hær har jeg ufatteligt svært ved at se: Danmark har så meget kystlinie at hvis først fremmede styrker får støvlerne i dansk pladder, er det næsten per definition game-over.Men vi skal stadig bruge nogen der hurtigt kan lokalisere og nedkæmpe evt. faldskærmstropper og andre nålestiksoperationer som måtte slippe igennem søværnet. For mig lyder det meget mere som droner og off-road motorcykler end tanks og kanoner ?Sidst men ikke mindst har det i hele min levetid været tydeligt at Genevekonventionens regler om ikke at angribe civilbefolkningen ikke står i vejen for at man destruere den civile infrastruktur.I vores tilfælde vil det primært gå ud over transformatorstationerne. Sponseret briefingCybersikkerhed og NIS2: Hvad betyder det for ledelsen?Den virkelig elegante løsning på det problem ville være at konveretere hele højspændingsnettet til en landsdækkende nedgravet HVDC bus, som lokalt konverteres til vekselstrøm.Det er både et langsigtet og meget dyrt projekt, til gengæld er det en garanteret exportsuccess i fremtiden, så det vil være en god investering at hælde et par milliarder i det om året.Frem for alt ville jeg insistere på, at så meget som muligt af udstyret bliver produceret i Danmark, af danskejerede virksomheder, så der i det mindste er en chance for, at udenlandske aktører ikke bestemmer hvor og hvornår vi må bruge det.Og nej, jeg har ikke nævnt AI med et ord, for det der i særklasse er brug for, er rigtig intelligens./phk Poul-Henning Kamp Softwareudvikling, programmering og it-skepsis genereltEmnerMilitærFølgDu skal være logget ind for at følge et emne.Log indOpret kontoDronerFølgDu skal være logget ind for at følge et emne.Log indOpret konto46 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv Denne artikel er gratis......men det er dyrt at lave god journalistik. Derfor beder vi dig overveje at tegne abonnement på Version2.Digitaliseringen buldrer derudaf, og it-folkene tegner fremtidens Danmark. Derfor er det vigtigere end nogensinde med et kvalificeret bud på, hvordan it bedst kan være med til at udvikle det danske samfund og erhvervsliv.Og der har aldrig været mere akut brug for en kritisk vagthund, der råber op, når der tages forkerte it-beslutninger.Den rolle har Version2 indtaget siden 2006 - og det bliver vi ved med.Log ind og få abonnementING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 46 Jørgen Henningsen 27. februar kl. 17:03 svarede Henning Kjær [45]Re: Det bedste forsvarSkal en krig vindes er det med landstyrker. Luftkrig/luftforsvar alene vinder ikke en krig.Det har du selvfølgelig ret i og derfor skal der selvfølgelig uddannes soldater og produceres isenkram til dem. Ideen med droner er i første omgang ikke at vinde en landkrig, men at undgå krig overhovedet.Samme princip blev iøvrigt brugt i den kolde krig hvor USA opstillede missiler i hobetal i bl.a. Tyskland for at holde russerne i skak. De viste at hvis der blev ballade så var vi klar og kunne smadre deres infrastruktur så let som ingenting. Tilsvarende kan vi anvende droner til hav overvågning.Men igen så kræver det at der er mandskab og skibe på vagt til at gå ud og tage affære hvis der bliver lavet ballade med vores kabler o.a. infrastruktur til søs. 1 1more_vert insert_linkKopier link 45 Henning Kjær 27. februar kl. 14:12Det bedste forsvarDet bedste forsvar er et godt angreb.Meget af skriveriet her går på at vi skal sidde i Danmark og vente på fjenden (Rusland) kommer her.Men jeg tro ikke Russerne kommer her, de er lukket meget ind i Østersøen af Natolande. Ok der er Kaliningrad enklaven inde mellem Polen og Litauen.I tilfælde af krig med Rusland så skal især sø- og luftstyrker ud at møde fjenden over Østersøen sammen med de andres Natolandes sø- og luftstyrker, før russerne når frem.Krigen i Ukraine er mest en landkrig, og der er ingen tegn på at vi få en landkrig i Danmark. Ukraines store svaghed er mangel på overlegenhed i luften, og manglende evne til at føre krigen ind i Rusland. Ukraines krig i Sortehavet er kun nålestiksoperationer uden afgørende betydning for krigen.Hvis Russiske styrker når frem til Nato-lande vil store Natostyrker blive sendt frem for at møde dem. Det gjorde man i 1968 da Russiske styrker gik ind i Tjekkoslovakiet. Dengang blev danske kampvognsstyrker sendt til Tyskland for at møde evt. russiske styrkers indtrængen i Nato. Skal en krig vindes er det med landstyrker. Luftkrig/luftforsvar alene vinder ikke en krig. 1 0more_vert insert_linkKopier link 44 Gert Madsen 26. februar kl. 18:22 svarede Ditlev Petersen [16]Re: RingborgeneDannevirke lige op til 1864 var også et håbløst projekt.Det var jo ikke et projekt.Man havde ladet det forfalde i årtier, om ikke århundreder. Bildt sig selv og hinanden ind at det var brugbart, mens pengene blev festet op i København, ignoreret og udskammet dem, som påpegede at det var ubrugeligt som forsvarsværk.Det minder faktisk meget om det vi har set de sidste 30 år. 6 1more_vert insert_linkKopier link 43 Jørgen Henningsen 26. februar kl. 15:21Produktionen skal til EUIkke mindst er det vigtigt at vi i EU selv kan producere specialiserede kamp droner i massevis. Vi kan ikke regne med at kunne købe standard droner i Kina eller USA.Jeg mistænker faktisk Trump for at destabilisere verden med det motiv, at få gang i sin egen våbenindustri. Begynder vi at købe stort ind i USA, så er den plan jo lykkedes glimrende.Samtidigt er det meget vigtigt at vi på IT- og energifronten bliver uafhængig af USA. Vi skal i gang med at udvikle billige kamp droner i massevis. De skal dels kunne sejles på droneskibe som PHK forslår det, men også stilles op i alle venligt stillede lande langs grænsen til Rusland. Hvis et land angribes, så er vi klar langs hele grænsen.Denne udvikling vil desuden genstarte EU's højteknologiske industri. Det har vi i den grad brug for. 6 1more_vert insert_linkKopier link 42 Svend Jørgensen 26. februar kl. 09:15 svarede Maciej Szeliga [28]Re: Danmark er et lille landDet er de i de Baltiske lande, især hvis fjenden er Rusland... men det er vi næppe i Danmark.Det tror jeg vi er, vi ønsker bare ikke at tale om det. Jeg tror på at danskerne vil kæmpe for deres frihed, når de bliver presset. 5 0more_vert insert_linkKopier link 41 Poul-Henning Kamp 26. februar kl. 08:32 svarede Baldur Norddahl [40]Re: eLoranJeg gider slet ikke bruge tid på Vås-As-A-Service. 9 2more_vert insert_linkKopier link 40 Baldur Norddahl 25. februar kl. 23:56 svarede Baldur Norddahl [38]Re: eLoranJeg undskylder på forhånd for et AI indlæg - men jeg tænker at det kan sætte en bremse i ekspertargumenterne. Selvfølgelig kan eLoran installeres og bruges i Danmark. Her kommer Claude 3.7:Teksten fra debatindlægget ovenover antyder at eLoran ikke kan fungere over land medmindre man befinder sig på et fly. Er dette korrekt?Kan eLoran fungere over land?Nej, det er ikke korrekt at eLoran kun kan fungere over land hvis man befinder sig i et fly. Dette er en overforsimpling af systemets faktiske egenskaber.Hvad debatindlægget korrekt påpeger:Jordoverfladen er det mest udfordrende miljø for eLoran-signaler på grund af:Grænselagseffekter mellem luft og jordForstyrrelser fra ledende objekter (bygninger, master, ledninger)Vekslende jordledningsevneSignalet bliver mere homogent med afstand fra senderenDen egentlige situation for landbaseret brug:Teknisk realiteteLoran kan fungere over land, men med reduceret nøjagtighed sammenlignet med brug over vandModerne eLoran-systemer opnår typisk 10-20 meters nøjagtighed over land, hvilket er tilstrækkeligt til mange anvendelserI områder med særligt udfordrende terræn eller tæt bebyggelse kan nøjagtigheden være dårligereForbedringer i eLoran vs. ældre Loran-CDigitale signalkorrektionerTættere netværk af differentielle referencestationerAvancerede ASF-korrigerende algoritmerBedre modtagerteknologi med støjreduktionPraktiske eksempler på landbaseret brugVejrharde transportruter hvor GPS kan være upålideligBackup-navigation for vej- og jernbanetransportTidssynchronisering for kritisk infrastrukturLandmåling i områder med begrænset udsyn til himlenKonklusionDebatindlægget overdriver vanskelighederne ved landbaseret brug af eLoran. Mens det er korrekt, at præcisionen er højere over vand og i luften, kan moderne eLoran-systemer fungere ganske effektivt over land, særligt når de er designet med tilstrækkelig tæthed af sendere og referencestationer. eLoran er netop udviklet som en forbedring af det ældre Loran-C system for at håndtere disse begrænsninger bedre.De praktiske erfaringer fra testinstallationer i Storbritannien og andre steder har demonstreret, at landbaseret eLoran kan levere brugbar positionsinformation, især når den integreres med andre navigationssystemer i en multi-system-tilgang.Det antydes ligeledes at eLoran ikke kan fungere tættere på senderen end 50 km. Men det forstår jeg ikke. En puls vil blive modtaget selvom man er helt tæt på antennen. Med gode kort og korrigationer bør det være muligt at beregne eventuelle effekter ganske tæt på antennen.Du har ret i din tvivl. Påstanden om at eLoran ikke kan fungere inden for 50 km af senderen er misvisende og repræsenterer en overforsimpling af systemets faktiske egenskaber.Faktisk funktionalitet nær senderenSignalmodtagelseeLoran-pulser kan absolut modtages tæt på senderen - der er ikke nogen "død zone"Signalstyrken er faktisk højere tæt på senderen, hvilket giver bedre signal-støj-forholdFeltets homogenitet vs. brugbarhedDet er korrekt at det elektromagnetiske felt er mindre homogent tæt på senderenMen dette betyder ikke at signalet er ubrugeligt - blot at det kræver mere avanceret korrektionModerne ASF-korrektionerModerne eLoran-systemer anvender digitale terrænmodeller og præcise elektromagnetiske simulationerDetaljerede ASF (Additional Secondary Factor) kort kan skabes selv for områder meget tæt på senderenDifferentielle referencestationer kan levere realtidskorrektioner specifikt for områder nær senderenTekniske udfordringer nær senderenDer er dog særlige hensyn når man opererer tæt på senderen:Geometrisk fortynding af præcision (DOP)Positionsbestemmelse baseret kun på afstand fra én sender giver dårlig geometriDette løses ved at have et netværk af flere sendereNærfeltseffekterInden for '''
