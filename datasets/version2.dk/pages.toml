full_description = "@media (min-width: 978px) { #tmk--000TAzZsa1TztE + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001kabMnUiQwSM + .kevel-skeleton { display: none; } }Kommission: Tag smartphonen fra børnene Undervisning25. februar kl. 10:212 kommentarer Illustration: dolgachov / bigstock.Børn skal være fyldt 13 år, før de bør have en smartphone, lyder budskab fra Trivselskommission. Tania Andersen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto Tania Andersen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret kontoTag smartphone og tablet fra ungerne, og giv dem en simpel telefon i stedet.Det er budskabet fra trivselskommissionen, som er nedsat af regeringen, og hvis opgave er at komme med anbefalinger, der understøtter børn og unges trivsel, myndiggørelse og livsmod. Kommissionen er netop barslet med en række anbefalinger, herunder buddet om smartphones. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.2 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 2 Ditlev Petersen 26. februar kl. 10:59Bivirkning?Hvis børn ikke må have/medtage/bruge smartphones, så vil det fysiske rejsekort og andre gode ting vel fortsætte? Tør man måske håbe. Måske ligefrem et fungerende postvæsen? 11 1more_vert insert_linkKopier link 1 Peter Nielsen 25. februar kl. 18:13Problemet er ikke smartphones iProblemet er ikke smartphones i sig selv; problemet er, hvordan de bliver brugt. For mig er en smartphone et værktøj, ikke et legetøj.Jeg bruger ikke flere timer om dagen på sociale medier, spil og andet fuldstændigt ligegyldigt pis fra min smartphone. Jeg bruger til gengæld flere timer om dagen på at foretage opkald, lave aftaler, skrive mails, dokumentere med fotos taget med telefonen, researche via internettet fra telefonens browser, se how-to-videoer og lignende på YouTube, og så videre, og så videre. For mig er en smartphone et ekstremt praktisk værktøj, ikke et legetøj.Det her handler om, hvordan vi som mennesker, uanset alder, VÆLGER at bruge vores tid. Og så bliver vi alle sammen igen, uanset alder, simpelthen nødt til at forstå, at rigtig mange tjenester, eksempelvis sociale medier og spil, er specifikt konstrueret til at stjæle så meget af vores tid som overhovedet muligt.Vores opmærksomhed er nutidens digitale valuta. 1 7more_vert insert_linkKopier link"
