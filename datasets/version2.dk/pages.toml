title = "Alles Lægehus i dialog med kriminelle: Hackere vil have løsesum for patientdata | Version2"
description = "Du kan modtage notifikationer, når vi udgiver nyt indhold, der interesserer dig, baseret på hvilke interesserer og skribenter du følger.Log ind eller opret en konto for at komme i gang."
full_description = "@media (min-width: 978px) { #tmk--000AJjPNjl6bOY + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001-xV3OXOqrKI + .kevel-skeleton { display: none; } }Alles Lægehus i dialog med kriminelle: Hackere vil have løsesum for patientdata Cyberkriminalitet14. januar kl. 10:357 kommentarer Der har været en dialog med hackerne om det stjålne data fra begyndelsen, erfarer Version2. Illustration: Arthur Cammelbeeck/Ritzau Scanpix.Alles Lægehus er fortsat i dialog med hackerne, der har krævet løsesum for at levere det stjålne materiale tilbage, erfarer Version2. Mats Magnussen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto Artiklen er ældre end 30 dage Mats Magnussen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto12. december sidste år lignede det, at Alles Lægehus var ramt af et it-nedbrud.Herefter fulgte tre uger med radiotavshed, men kort før nytår kunne man læse på lægekoncernens hjemmeside, at situationen var væsentligt mere alvorlig. It-nedbruddet var i virkeligheden et hackerangreb.Hackerne havde fat i personoplysninger, CPR-numre samt oplysninger om, hvorvidt man var KOL- eller diabetespatient. Men Alles Lægehus kunne ikke med sikkerhed sige, om lægejournaler på de 130.000 patienter også var havnet i hænderne på de kriminelle. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan