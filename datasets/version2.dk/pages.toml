full_description = '''@media (min-width: 978px) { #tmk--000erCfVk1S3Js + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001PBOode_CIag + .kevel-skeleton { display: none; } }Kommune droppede Microsoft for tysk Cloud: »Jeg sparer to tredjedele af prisen« Digitalisering20. februar kl. 14:1125 kommentarer Hetzners Data Center Park Falkenstein i Tyskland. Illustration: Hetzner Online GmbH.Cloud-storage ser ud til at blive markant billigere i fremtiden for Kultur og Borgerservice i Aarhus Kommune, der gennem det seneste år har rykket næsten alle sine systemer fra USA til Tyskland. Louise Olifent Følg Du skal være logget ind for at følge et emne.Log indOpret konto Louise Olifent Følg Du skal være logget ind for at følge et emne.Log indOpret kontoPræcis som mange andre danske kommuner, har Aarhus Kommune i årevis følt sig nødsaget til at bruge tjenester fra amerikanske tech-giganter som Microsoft for at drive organisationen.Det offentliges brede afhængighed af big tech har i flere år skabt udfordringer for myndigheder, som føler sig handlingslammet, imens de helt store it-leverandører skruer op for priserne, og dybe integrationer og medarbejderrutiner gør det svært at skifte til alternativer.Det har fået regeringen til at undersøge problemet, dog uden at sætte konkrete løsningsforslag i gang. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.25 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 25 Kjeld Flarup Christensen 25. februar kl. 16:38 svarede Peter Bach Nielsen [23]Re: Sammenligning af æbler og pærerDet handler om infrastruktur og økosystemer. Google er vel de eneste konkurrenter, som har noget tilsvarende. De kan sikkert være et rigtigt godt alternativ til mindre organisationer med mindre komplekse it-miljøer. NextCloud kunne være/blive et alternativ, men det kræver at det får mere vind under vingerne.Jo flere der vælger en Open Source løsning, jo bedre bliver de og endnu flere vil vælge dem. 4 0more_vert insert_linkKopier link 24 Klavs Klavsen 25. februar kl. 10:07 svarede Peter Bach Nielsen [23]Re: Sammenligning af æbler og pærerProblemet er, at vi er stavnsbundet til Microsoft. Der findes ikke enterprise alternativer.Hvad er det præcis man ikke kan med open source? Mener du at hvis man kun benytter sig af open source - så kan man ikke leve op til NIS2, GDPR, ISO 27001:2022, ITIL etc. ? Eller hvad er det præcis som man kun kan med microsoft ?Microsoft AD er bare central brugerstyring - baseret på 2 åbne teknologier kaldet LDAP og Kerberos. Det blev skrevet til Unix først og kan snildt laves vha. open source.f.ex. anvender vi typisk keycloak (open source AD med oauth2) i dag - da den benytter oauth2 standard'en - som er hvad office 365 gør (centraliseret login via https - med multi-factor).Jeg håber du kan uddybe hvori stavnsbindingen består?Umiddelbart virker det som om mange er oplært i hvordan man gør det med microsoft værktøjer - så de ville skulle lære at gøre det med andre værktøjer. På samme måde som Office værktøjerne ville skulle læres, hvordan man gør med Libreoffice som alternativ.Så kan det være at microsoft har "en eller anden god måde at gøre noget på" - som ikke umiddelbart er i open source alternativet man har fundet.. så man enten gøre det på den mere besværlige måde, eller investere i at få lavet en forbedring (evt. sammen med andre brugere - typisk koordineret over deres git hosting / issue styring).Det er klart at når man har opbygget en stor samling af integrationer der kun virker med microsoft office - så har man et efterslæb, der helst skulle re-implementeres for at undgå en masse manuelt arbejde når man skifter til Libreoffice. Der må man jo så se på det med friske øjne og lave en plan. 5 0more_vert insert_linkKopier link 23 Peter Bach Nielsen 25. februar kl. 09:22 svarede Jens Klarskov Jensen [22]Re: Sammenligning af æbler og pærerDet skyldes at Microsofts M365 aftaler til offentlige såvel som private kunder er skruet sådan sammen, at man mere eller mindre er tvunget til at benytte deres cloud.Jeg kender ikke til eksempler, hvor driftscentre tilbyder M365 hosting. De vil heller ikke kunne tilbyde samme infrastruktur og økosystem som Microsoft. f.eks. Microsoft Entra Admin Center, Azure AD osv. som er ved at blive de facto standarder i forhold til integrationer imellem systemer. Og sagen er, at man som kunde allerede har betalt for de ydelser via licensprisen så hvorfor betale ekstra for hosting af servere?Man kan godt drifte servere on prem, de vil dog i højere og højere grad være afhængige af M365 infrastrukturen. Der er helt sikkert fordele ved at have Outlook on prem, men der er helt sikkert også store ulemper. Problemet er, at vi er stavnsbundet til Microsoft. Der findes ikke enterprise alternativer. Det handler ikke kun om en mailklient og en Office-pakke. Det handler om infrastruktur og økosystemer. Google er vel de eneste konkurrenter, som har noget tilsvarende. De kan sikkert være et rigtigt godt alternativ til mindre organisationer med mindre komplekse it-miljøer. Vi bander med god grund over prisstigningerne, som alle softwareleverandører excellerer i. Det er dog lykkedes med den seneste SKI-aftale at holde prisstigningen nede på 15%. Hvilket er flot alt taget i betragtningen. Private kunder må acceptere langt højere prisstigninger, det taler man bare ikke højt om. 0 1more_vert insert_linkKopier link 22 Jens Klarskov Jensen 24. februar kl. 18:26 svarede Peter Bach Nielsen [21]Re: Sammenligning af æbler og pærerJeg tror du måske har ret for et besøg på Truly thrifty cloud hosting - Hetzner Online GmbH viser at man ikke understøtter Windows/Office365 endsige Azure services.Men personligt (som pensioneret software ingeniør) er jeg ikke helt klar over hvorfor det ikke OGSÅ er en tilsvarende begrænset opgave at flytte Mail (Exchange?), Fildeling, Office 365 og Samarbejde til On Premise via f.eks. Azure Stack Hub?Sidstnævnte giver angiveligt fuld Azure funktionalitet, blot på egen On Premise hardware og opfylder vist så umiddelbart, at danske borgeres data ikke lagres i USA hvor NSA og CIA frejdigt kan sniffe?Altså ville en første løsning, hvor man fortsat anvender Microsoft APIer og Services, men flytter services og storage til:- Eget 'datacenter' med korrekte Microsoft Licenser (kræver egen sizing og hardware indkøb, samt en mindre IT afdeling eller erfarne konsulenter)- KMD datacenter med korrekte Microsoft Licenser (Kræver blot betaling/abonnemet til KMD)Min antagelse er at Microsoft er fint tilfreds med at vi kører On Premise eller Azure Privat Cloud eller Azure Stack Hub, for at de dog i fremtiden kan bevare Deres licensindtægter i EU, blot vi betaler de Microsoft licenser, som vores servere og brugere fordrer. (Jeg antager, for at gøre det nemt, at eventuelle Active Directory replikeringer IKKE i sig selv bryder GDPR) Jeg har det personligt fint med at vi er forretningskontrakt afhængige af Microsoft (har selv arbejdet for MSFT i 11 år), blot vi ikke afhænger af Trump & Administration eller gamle Biden President dekreter :-( Over tid kan vi så erstatte Microsoft/Azure//Windows/Office365 løsninger med Linux og Containere etc. (og Kubernetes aht. vores udviklere). 1 0more_vert insert_linkKopier link 21 Peter Bach Nielsen 24. februar kl. 13:37Sammenligning af æbler og pærerArtiklen glemmer at fortælle at Bo Fristed kun har flyttet sine udviklingsservere ud af Azure. Har har ikke flyttet mail, kalender, filer, fildeling, samarbejde osv. ud af Microsoft og ned til Hetzner for, hvad er alternativet? Ud af landets 98 kommuner er det vel kun de 4 største, der har deciderede udviklingsafdelinger, som har behov for decideret devops-miljø. Det er en stor mangel i artiklen. 4 0more_vert insert_linkKopier link 20 Klavs Klavsen 24. februar kl. 10:40 svarede Svend Jørgensen [18]Re: Fedtnår man selv tager ansvar for en større andel af teknologistakke, så kræver det også at man har personer der har viden og tiden til at vedligeholde disse deleProblemet er bare at hvis du rent faktisk har prøvet at overlade stakken til andre - så er det, efter min erfaring - ofte sådan at du får udfordringer hvor du alligevel SKAL have folk med den kompetance, for at få det til fungere for dig - og skal så vente på din leverandørs support.Så snart du alligevel har systemer du skal vedligeholde selv (næsten uundgåeligt), så har du den kompetance in-house - og så er det simpelthen billigere og bedre, at sikre det teams kompetancer og så lade dem håndtere det hele - istedet for at have den spredt ud over support aftaler for hver ting man anvender. 8 0more_vert insert_linkKopier link 19 Jens Frederik Dalsgaard Nielsen 24. februar kl. 10:06 svarede Svend Jørgensen [18]Re: FedtNår du skriver "ingen special indsigt" kan jeg kun læse det som "ingen indsigt"- altså du ved intet om hvad de har gjort. At referere til andre historier giver altså ikke mere indsigt. 7 0more_vert insert_linkKopier link 18 Svend Jørgensen 24. februar kl. 09:24 svarede Jens Frederik Dalsgaard Nielsen [8]Re: FedtSvend. Ved du overhovedet noget ? eller gætter du bare samtidig du ikke tror på det han siger ?? Det er for billigtJeg har ingen special indsigt her, men da David Heinemeier Hansson (DHM) gik on-premise med sit setup, så skulle han trods alt investere i eget fysiske datacenter og dermed også personer der ved hvordan man designer/bygger/indretter sådan et bedst muligt og det samme når man selv tager ansvar for en større andel af teknologistakke, så kræver det også at man har personer der har viden og tiden til at vedligeholde disse dele, fx hvis man tidligere har benyttet MS365 office (SaaS), så skal man selv til at stå for at rulle opdateringer ud og selv have værktøjet til at gøre det og selv fører kontrol på at det nu er sket og selv fremfinde de tal der skal indgå i rapporter på processens effektivitet. 0 1more_vert insert_linkKopier link 17 Maciej Szeliga 22. februar kl. 11:05 svarede Baldur Norddahl [6]Re: FedtHvorfor skal han ansætte folk? Er der da noget magisk i Azure, som Hetzner ikke også kan, og som på en eller anden måde ligefrem sparer stillinger?Det er jo bare den sedvanlige FUD der kommer når folk vil væk fra Microsoft. 15 0more_vert insert_linkKopier link 16 Jesper Utoft 21. februar kl. 21:32 svarede Svend Jørgensen [5]Re: FedtSvend, hvis du ikke stoler på tallet, så prøv at spørge journalisten on de vil høre digitaliserings chefen om lidt flere detaljer om beregningen.Det er sansynligt at der er blevet spurgt om et samlet tal, og så er det jo det man får ;) 1 0more_vert insert_linkKopier link 15 Kjeld Flarup Christensen 21. februar kl. 12:32Office 365Bruger de stadigt office? 10 0more_vert insert_linkKopier link 14 Klavs Klavsen 21. februar kl. 11:37 svarede Simon Marqvarsen [12]Re: FedtSå det kan sagtens lade sig gøre at spare selv ret store beløb selv uden at forlade Azure.Helt bestemt. Man kan også spare meget ved at opsætte auto-skalering, bruge spot-instances hvor man kan (ligesom AWS har - til langt lavere minutpris), kigge på traffic mellem availability zones (da den ikke er gratis hos f.ex. aws. Det er den hos hetzner). 7 0more_vert insert_linkKopier link 13 Klavs Klavsen 21. februar kl. 11:11Managed kubernetes - forbeholdNu skriver de at de savner managed Kubernetes.De er forhåbentlig opmærksomme på at 2 ting:1) Managed kubernetes betyder at du skal sikre dig at du har betalt for den hurtige svartid (hos f.ex. azure) - for ellers kan du godt risikere at vente 24 timer imens dit cluster er nede og du intet kan gøre (det skete f.ex. for en kunde i Azure AKS - hvor de havde 'standard AKS' - og havde et cronjob der startede nye pods - men de holdt op med at exit'e - så hele kubernetes api'et døde da den nåede 22k pods (fordi controllerne er meget små - og der ikke var sat nogen ressource begræsninger op fra AKS side der sikrede imod at dette skete).2) Managed Kubernetes tager sig ikke af sikkerhedsopdateringer eller sikker config af alle de applikationer du alligevel skal have opsat på dit cluster for at lave autoscaling, overvågning osv. Så du skal stadigvæk have styr på din opdateringsprocedure.. og når man har det alligevel - er det IMHO ikke nogen stor gevinst ved et managed Kubernetes (og man skal sikre sig at controllere kan og bliver opskaleret ved behov - istedet for hvad standard AKS f.ex. gør) 6 0more_ve'''
