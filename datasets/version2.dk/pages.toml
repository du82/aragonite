description = "Regeringen er vendt på en tallerken og har valgt at omfatte kommunerne af nye it-sikkerhedsregler fra EU. Men det kan få opgaven med cybersikkerhed til at vokse hos langt flere organisationer end bare kommunerne, mener advokater."
full_description = '''@media (min-width: 978px) { #tmk--000VbRAThyqLXM + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001O2QLi3OsQ6A + .kevel-skeleton { display: none; } } TophistorieEfter måneders tovtrækkeri: Derfor skal kommunerne alligevel leve op til NIS2 NIS217. februar kl. 05:008 kommentarer Torsten Schack Pedersen er minister for samfundssikkerhed og beredskab. Illustration: Ida Marie Odgaard/Ritzau Scanpix.Regeringen er vendt på en tallerken og har valgt at omfatte kommunerne af nye it-sikkerhedsregler fra EU. Men det kan få opgaven med cybersikkerhed til at vokse hos langt flere organisationer end bare kommunerne, mener advokater. Louise Olifent Følg Du skal være logget ind for at følge et emne.Log indOpret konto Louise Olifent Følg Du skal være logget ind for at følge et emne.Log indOpret kontoDer gik et lettelsens suk igennem it-afdelingerne i de danske kommuner 6. februar.Paradoksalt nok skyldtes lettelsen nye regler fra EU. Kommunerne har ellers tidligere været kritiske overfor databeskyttelsesloven GDPR, men udsigten til nye regler på it-sikkerhedsområdet skaber stor begejstring. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, k