["https://version2.dk/artikel/hackerangreb-truer-dansk-produktion-virksomheder-er-under-konstant-bombardement"]
title = "Hackerangreb truer dansk produktion: »Virksomheder er under konstant bombardement« | Version2"
description = "Du kan modtage notifikationer, når vi udgiver nyt indhold, der interesserer dig, baseret på hvilke interesserer og skribenter du følger.Log ind eller opret en konto for at komme i gang."
full_description = '''@media (min-width: 978px) { #tmk--000FXlxx7-T-PI + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001gN0HtdfXwp4 + .kevel-skeleton { display: none; } }Hackerangreb truer dansk produktion: »Virksomheder er under konstant bombardement« It-sikkerhed13. februar kl. 13:201 kommentar Gamle Windows-baserede servere er udbredte i de danske produktionshaller, fordi maskiner holder i mange flere år end kontor-pc’er. Alligevel er det muligt for virksomhederne at sikre deres produktionssystemerne mod hackere, bl.a. ved at inddele netværket i zoner, så man isolerer de sårbare enheder. Illustration: Carsten Ingemann.En glemt VPN-adgang i produktionsnetværket kan koste dyrt. To eksperter peger på de vigtigste sårbarheder over for hackerangreb, som produktionsvirksomheder bør gøre noget ved. Søren Rask Petersen Journalist og redaktionssekretær Følg Du skal være logget ind for at følge et emne.Log indOpret konto Søren Rask Petersen Journalist og redaktionssekretær Følg Du skal være logget ind for at følge et emne.Log indOpret konto‘If it ain’t broke, don’t fix it’ har i mange år været et udbredt devise i danske produktionsvirksomheder, hvor det ikke er usædvanligt, at maskiner og produktionssystemer har levetider på op til 30 år. Ikke blot kan det være svært at skaffe reservedele, f.eks. hvis leverandøren er gået bankerot, men måske styres anlægget via en bedaget Windows 2003-server, fordi ethvert forsøg på opdatering vil indebære en risiko for, at maskinerne går i stå og aldrig kommer i gang igen. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.1 kommentar. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 1 Klavs Klavsen 14. februar kl. 10:08No mans an islandI dag forsøger alle at "løse alt selv". Det er en uoverstigelig opgave - især for mindre virksomheder og det er ikke en realistisk måde at løse ting på.Vi så hvordan små vandværker har meget usikre setups - og står helt alene med at bygge deres setup. Hvorfor er der ikke en "best practice" platform de kan bruge til at bygge deres eget IT setup fra der hjælper dem?IMHO så BURDE industrien samarbejde om at udvikle driftssetup løsninger/frameworks (ligesom man har gjort i Open Source i årtier) - der understøtter de behov virksomhederne har - således at man får ensrettet "måden et givent behov bliver mødt på" - således at man kan dele forbedringer og løsninger i langt højere grad./rant om hvorfor vi tror på den løsning og selv følger den og deler som open source :)(ignorer hvis du føler det er reklame :)Der er hvad vi har valgt at gøre med 2 løsninger, vi har bygget og bruger hos alle vores kunder - og alt vi laver på det, frigives som open source. Vi arbejder med Linux drift (og har lavet LinuxAid.io til det) og Kubernetes drift (og har lavet KubeAid.io til det).Det er designet så man har en samlet struktur, der kan bruges til at styre alt fra serveropsætning, løbende konfiguration, backup, overvågning, restore mm. - centralt vha. gitops (som det kaldes).Det er præcis som alle større firmaer bygger selv - deres egen platform. Vi har bare muligheden for at teste platformen i mod alle kunder der bruger de samme open source løsninger - og får løbende "ny funktionalitet" udviklet og tester og ruller ud til alle kunder (så når 1 kunde betaler os for at lave noget - bliver det frigivet som open source og alle får det).Man kunne tro at det ville være alt for rigidt og infleksibelt - men med 25 års erfaring i branchen, kan jeg konstatere at indenfor Linux og Kubernetes verdenen - så er det de samme løsninger og open source projekter der er brug for - og de er fleksible nok til at understøtte alle de behov vi er stødt på indtil videre.Der er også en kæmpe fordel i at det hele er open source - for ofte kan vi løse "den lille manglende detalje" i en applikation - så den kan understøtte noget nogen har brug for, ved at kode det selv og få det ind i den applikation (submit'e til upstream). Man har friheden til at gøre det og det gør så mange forskellige brugere, så de 2 miljøer er virkelig fleksible og funktionelle.Så hvis man har brug for et Kubernetes setup - så kan starte med vores open source løsning og gøre det selv - men man vil hele tiden få opdateringer af applikationer, forbedret dokumentation osv. osv. fra vores projekt - og kan på den måde spare en masse tid på den løbende udbygning og vedligehold af ens produktions setup. 2 0more_vert insert_linkKopier linkSkrevet på Ingeniøren'''
