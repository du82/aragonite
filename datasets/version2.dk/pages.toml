full_description = "@media (min-width: 978px) { #tmk--000chx8gOuhKJ4 + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001UbNkDh3L9Og + .kevel-skeleton { display: none; } }Kontroversielt lægehus ramt af hackerangreb: Stor it-leverandør involveret Cyberkriminalitet3. januar kl. 05:036 kommentarer Alles Lægehus er blevet ramt af et hackerangreb, men har ikke oplyst deres patienter om det i 21 dage. Illustration: Henning Bagger/Ritzau Scanpix.Lægekoncernen Alles Lægehus blev ramt af et hackerangreb for en måned siden, men har stadig ikke meldt konkret ud om omfanget til deres tusindvis af patienter. Lægehuset begrunder tavsheden med en aktiv politiefterforskning. Mats Magnussen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto Artiklen er ældre end 30 dage Mats Magnussen Journalist Følg Du skal være logget ind for at følge et emne.Log indOpret kontoEt af Danmarks største og vel nok mest omdiskuterede lægehus, Alles Lægehus, blev i starten af december ramt af et hackerangreb, hvor der blev stjålet sundhedsoplysninger om deres 130.000 patienter samt personale. Men først i et opslag fra Alles Lægehus i Hundested 21 dage senere – den 30. december – fortæller koncernen bag, at der var tale om et hackerangreb, som medførte it-nedbrud 9. december. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.6 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 6 Morten Fordsmand 14. januar kl. 14:07 svarede Jens Sørensen [5]Re: Den bliver dyrTjah prøv at læse https://ing.dk/artikel/alles-laegehus-i-dialog-med-kriminelle-hackere-vil-have-loesesum-patientdataDer fremgår det klart at det kan være svært at bestemme hvor meget der er blevet eksfilteret. 0 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 5 Jens Sørensen 3. januar kl. 18:42 svarede Morten Fordsmand [4]Re: Den bliver dyrSå spørgsmålet er om de endnu har fået afklaret hvilke personers data, der har været berørt og i hvilket omfang.Hvis dette skulle være tilfældet, har de mon så haft tilstrækkelige tekniske og organisatoriske foranstaltninger? 4 0more_vert insert_linkKopier link 4 Morten Fordsmand 3. januar kl. 13:47 svarede Søren Rønsberg [3]Re: Den bliver dyrJa, men sagen er jo endnu ikke færdigtoplyst siden de stadigt undersøger.Så spørgsmålet er om de endnu har fået afklaret hvilke personers data, der har været berørt og i hvilket omfang. 2 5more_vert insert_linkKopier linkSkrevet på Ingeniøren 3 Søren Rønsberg 3. januar kl. 13:38 svarede Morten Fordsmand [2]Re: Den bliver dyrMen der er ikke noget krav i GDPR om at pressen løbende skal holdes underrettet om udviklingen i en endnu ikke afsluttet hændelse.Ikke pressen, men alle berørte, jvf. artikel 34:1. Når et brud på persondatasikkerheden sandsynligvis vil indebære en høj risiko for fysiske personers rettigheder og frihedsrettigheder, underretter den dataansvarlige uden unødig forsinkelse den registrerede om bruddet på persondatasikkerheden.2. Underretningen af den registrerede i henhold til denne artikels stk. 1 skal i et klart og forståeligt sprog beskrive karakteren af bruddet på persondatasikkerheden og mindst indeholde de oplysninger og foranstaltninger, der er omhandlet i artikel 33, stk. 3, litra b), c) og d).https://gdpr.dk/databeskyttelsesforordningen/kapitel-4-dataansvarlig-og-databehandler/artikel-34-underretning-om-brud-pa-persondatasikkerheden-til-den-registrerede/ 10 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 2 Morten Fordsmand 3. januar kl. 12:16 svarede Jens Sørensen [1]Re: Den bliver dyrEr du nu også helt sikker på det?Umiddelbart ser det ud til at man har kontaktet såvel som datatilsyn som politi meget hurtigt efter hændelsen er blevet opdaget.Det er ikke forbudt at data bliver kompromiteret, men det er forbudt hvis det sker på grund af en sløset omgang med data og sikkerhed. Men der er ikke noget krav i GDPR om at pressen løbende skal holdes underrettet om udviklingen i en endnu ikke afsluttet hændelse. 8 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Jens Sørensen 3. januar kl. 08:13Den bliver dyrJeg tror at Datatilsynet finder den helt store bødeforlægsblok frem.De vil sikkert gerne vise at Region Syds bødeforlæg er af korrekt størrelse.+At her er der tale om en privat virksomhed som Datatilsynet plejer at give større bødeforlæg end de offentlige. 16 0more_vert insert_linkKopier link"
