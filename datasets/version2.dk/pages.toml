["https://version2.dk/artikel/kameraet-taeller-beboernes-aandedrag-og-forudsiger-sygdom-eller-doed"]
title = "Kameraet indsamler data og forudsiger sygdom eller død hos beboeren | Version2"
description = "KLIK OG HØR OM FREMTIDENS DIGITALE VELFÆRDSTEKNOLOGISom nattevagt på et plejecenter er det nødvendigt at liste rundt op kigge ind til beboerne i løbet af natten. Måske de er blevet syge i løbet af natten, måske de er faldet. Eller de kan være gået bort uden et menneske ved sin side.Og hvis en beboer har brug for et menneske at holde i hånden, kan personalet ikke samtidigt holde øje med demente beboere, der kan gå forvildede omkring.Sådan er det ikke i Næstved. Her registrerer og erindrer den digitale nattevagt øje i form af kamera og sensor hver eneste bevægelse i plejehjemmets værelser."
full_description = '@media (min-width: 978px) { #tmk--000E3AnPdiUVjs + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001t_vsa9SIdLU + .kevel-skeleton { display: none; } } PodcastKameraet indsamler data og forudsiger sygdom eller død hos beboeren Podcast28. februar kl. 05:004 kommentarer Illustration: Teton.ai. Henrik Heide Podcast- og debatredaktør Følg Du skal være logget ind for at følge et emne.Log indOpret konto Henrik Heide Podcast- og debatredaktør Følg Du skal være logget ind for at følge et emne.Log indOpret kontoKLIK OG HØR OM FREMTIDENS DIGITALE VELFÆRDSTEKNOLOGISom nattevagt på et plejecenter er det nødvendigt at liste rundt op kigge ind til beboerne i løbet af natten. Måske de er blevet syge i løbet af natten, måske de er faldet. Eller de kan være gået bort uden et menneske ved sin side.Artiklen fortsætter efter annoncenOg hvis en beboer har brug for et menneske at holde i hånden, kan personalet ikke samtidigt holde øje med demente beboere, der kan gå forvildede omkring.Sådan er det ikke i Næstved. Her registrerer og erindrer den digitale nattevagt øje i form af kamera og sensor hver eneste bevægelse i plejehjemmets værelser. Lige fra en tur på toilettet til brystkassen, der stille hæves og sænkes Kameraet hænger i loftet inde på borgerens stue, men videobillederne omsættes til symbolske tegninger og tekst, før de sendes videre af systemet til nattevagtens skærm. Illustration: Teton.ai. Data samles, og medarbejderne kan nu se hver eneste beboer som en tegneseriefigur på mobilen. Hvor en borger tidligere kunne ligge to timer på gulvet efter et fald, ligger ingen længere end fem minutter. Og hvor det førhen kunne være umuligt at opklare årsagen til faldet hos en dement beboer, kan systemet nu genspille forløbet og dermed opklare årsagen. Illustration: Teton.ai.Systemet har ikke blot nedsat antallet af indlæggelser og forbedret helbredet for beboerne. Det har også medført markant lavere sygdom hos personalet. Alle er således tilfredse, og den eneste kritik har hidtil handlet om, hvorvidt beboerne bliver overvåget. Men den kritik afviser kommunens centerleder for sundhed og ældre Torben Hollmann:Artiklen fortsætter efter annoncenING/TechJobchevron_rightOpret jobannonceTilpas»Vi overvåger ingen borgere. Vi våger over. Når folk siger noget andet, er det fordi de ikke har sat sig ind i, hvordan det virker.«I denne uges Transformator fortæller han, hvordan alle sundhedsdata fra Næstveds borgere samles og analyseres af en algoritme, der lige nu kan sige, om ens sygdom eksempelvis er blevet så forværret, at der skal noget behandling til. Men det er ikke blot den aktuelle sundhedstilstand, der følges. Med alle disse data vil det i fremtiden være muligt at lave predictive analytics:»Om et års tid vil vi kunne stå ude hos en borger, inden de får et hjertestop, hvis vi måtte og ville. Spørgsmålet er, om det er noget vi vil som samfund. Og nej - det ville vi nok ikke, fordi naturen har sin gang. Men vi har så mange data, at vi kan forudse sygdomme, fortæller Torben Hollmann.«Den digitale nattevagt vandt innovationsprisen i 2023 - og meget er sket siden. Hør det hele i Transformator. Torben Hollmann, centerleder Sundhed og Ældre, Næstved Kommune Illustration: Henrik Heide. TRANSFORMATORPodcasten fra Ingeniøren sætter strøm til ugens største nyheder inden for teknologi, forskning og naturvidenskab og analyserer de svingninger, der på godt og ondt transformerer verden.Vært:Henrik HeideMedvirkende:Torben Hollmann, centerchef Sundfed og Ældre i Næstved KommuneAbonnér på Transformator:Følg i iTunesFølg på SpotifyPå mobilen: Søg på Transformator i din podcast-app.På iPhone er podcast-appen indbygget. Har du en Android-telefon, kan du finde podcast-apps i Google Play. F.eks. kan du benytte denne gratis app. Læs ogsåForældet FM bliver fremtidens livlineDenne artikel Nu tæller den digitale nattevagt også beboernes åndedrag Det digitale tilsyn hjælper borgere på plejecenteret til en rolig søvnEmnerPodcastFølgDu skal være logget ind for at følge et emne.Log indOpret kontoUgens UdvalgteFølgDu skal være logget ind for at følge et emne.Log indOpret kontoSundheds-ItFølgDu skal være logget ind for at følge et emne.Log indOpret kontoSundhedsdataFølgDu skal være logget ind for at følge et emne.Log indOpret kontoKommunal sundhedFølgDu skal være logget ind for at følge et emne.Log indOpret kontoIt-projekterFølgDu skal være logget ind for at følge et emne.Log indOpret kontoDataindsamlingFølgDu skal være logget ind for at følge et emne.Log indOpret konto4 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 4 Henning Kjær 1. marts kl. 17:03dø i eget hjem, også aleneHvorfor er det så vigtigt at undgå at "nogen går bort uden et menneske ved sin side". Det er det da mange der gør udenfor plejehjemmene, og nu kan de endda bede om/kræve ikke at blive genoplivet. Jeg kender flere familiemedlemmer der døde alene, uden forudgående alvorlig sygdom. I et tilfælde lå ægtefællen ved siden af i dobbeltsengen uden at opdage noget før om morgenen. I et andet tilfælde var ægtefællen ude at handle mens han døde. 1 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 3 Thomas Corell 28. februar kl. 10:18Genspille forløb, uden overvågning ?»Vi overvåger ingen borgere. ..Altså "overvåger ingen", heller ikke dem der kunne have givet samtykke ?Det hænger ikke sammen med:.. Og hvor det førhen kunne være umuligt at opklare årsagen til faldet hos en dement beboer, kan systemet nu genspille forløbet og dermed opklare årsagen.Hvordan kan man genspille forløbet, uden at der er foretaget en overvågning ? 3 7more_vert insert_linkKopier link 2 Henrik HeidePodcast- og debatredaktør - 28. februar kl. 09:38Podcast- og debatredaktør svarede Jørgen Svendsen [1]Re: En bolig er en boligKære JørgenAlt det er der i projektet taget højde for og bliver overholdt. Hør gerne podcasten, hvor der er svar på de forskellige aspekter.mvh Henrik Heide 9 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Jørgen Svendsen 28. februar kl. 09:18En bolig er en boligLoven er klar her: Om en bolig er et hus, en lejlighed eller et værelse på et plejehjem betyder ikke noget, det er en bolig og kun beboeren kan give lov til at blive overvåget, og det samtykke må ikke være skjult og skal kunne trækkes tilbage.Hvis en borger er gjort umyndig og der er en værger, så er det værgeren der skal give samtykke. 8 1more_vert insert_linkKopier link'
