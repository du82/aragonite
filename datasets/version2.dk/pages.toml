full_description = '@media (min-width: 978px) { #tmk--0008d3vOjMHPSc + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001pHYz5ZMORpU + .kevel-skeleton { display: none; } }Digitaliseringsminister: TikTok-forbud for mindreårige har ingen gang på jorden EU18. februar kl. 13:029 kommentarer Illustration: Emil Helms/Ritzau Scanpix.Et borgerforslag om at forbyde sociale medier for børn under 18 år fejes af bordet af digitaliseringsministeren, der ellers åbent har støttet tanken. Peter Christian Bech-Nielsen Redaktionschef / Tech-korrespondent Følg Du skal være logget ind for at følge et emne.Log indOpret konto Lyt til artiklen oplæst af en stemme klonet på Ingeniørens Henrik Heide Peter Christian Bech-Nielsen Redaktionschef / Tech-korrespondent Følg Du skal være logget ind for at følge et emne.Log indOpret kontoSkærmhad og en generel digital forskrækkelse på vegne af børn og unge har præget den danske debat om sociale medier det seneste år. Og med lægen Imran Rashid i spidsen har en gruppe stillet sig i spidsen for et borgerslag om forbud mod TikTok, Snapchat og Instagram for unge under 18 år.Forslaget nåede på rekordtid de påkrævede 50.000 underskrifter, og digitaliseringsminister Caroline Stage (M) har da også undervejs forsikret forslagsstillerne, at hun »kommer til at presse citronen, så meget som jeg kan inden for de lovgivningsmæssige rammer, der er«. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her.