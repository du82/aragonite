b på Apple Pay: Kunder kan tjene betalinger tilbage Kommunerne mangler ressourcer mod cyberangreb: »Det kan få alvorlige konsekvenser« Danske apps til børn er data-duks: Deler langt færre data end udenlandske Ny kvantechip fra Google løser »nøgleudfordring«: Fra 10 kvadrillioner år til få minutter TDC-nedbrud får telebranchen til at lede efter ny sikkerhedsløsningDenne artikel Teleinfrastruktur i USA ramt af cyberspionage: Metadata på »et stort antal« amerikanere stjålet Softwareleverandør til det offentlige er blevet ramt af omfattende ransomwareangreb Kæmpe softwareleverandør ramt af ransomwareangreb: Starbucks kan ikke udbetale lønEmnerCyberkriminalitetFølgDu skal være logget ind for at følge et emne.Log indOpret konto1 kommentar. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 1 Slettet bruger 9. december 2024 kl. 10:08Interessant. Eller måske snarere ... "interessant!" ForInteressant. Eller måske snarere ... "interessant!"For politikerne i Rumænien vil jo alligevel ikke tage afstand fra valgresultatet! Sikkert for ikke at så tvivl om deres eget demokrati. For hacking kampagerne er jo ikke problemet, men snare hvad data er brugt til!For det egentlige problem er jo påvirkningskampagnerDet helt store problem er at de jo "bare" laver kampagner. Dvs udnytter databranchens persondata til målretning af misinformationskampagner, som så forstærkes af de "personalificerede" newsfeeds som lukker folk inde i osteklokker.Det angives også som en hovedårsag til den store splittelse i USA. Og ligesom politikerne ikke vil så tvivl om valgsystemet, er der heller ikke nogen der (tør?) gå i clinch med vores digitale udvikling. Det er der ellers rigtigt gode grunde til at tage mere kontrol med. Især når alle bare bevidstløst trykker Ja til den sindssygt omfattende målretning Mvh Sigurd 2 0more_vert insert_linkKopier link'
