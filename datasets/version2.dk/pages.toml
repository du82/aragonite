title = "Efter stort angreb: Hackere lækker patientdata fra Alles Lægehus | Version2"
description = "Blandt de stjålne oplysninger er CPR-numre, navne og adresser på tusindvis af danskere. Derudover har hackerne i nogle patienters tilfælde fået adgang til korte notater med graviditets- og sygdomsoplysninger."
full_description = '@media (min-width: 978px) { #tmk--000iagfY9B3QaI + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001CiNzP7cXibk + .kevel-skeleton { display: none; } }Efter stort angreb: Hackere lækker patientdata fra Alles Lægehus It-sikkerhed20. januar kl. 17:059 kommentarer »Vi er meget kede af de gener, som de berørte oplever efter det hackerangreb, som kriminelle har gennemført på vores system,« oplyser Alles Lægehus. Illustration: Arthur Cammelbeeck/Ritzau Scanpix.Blandt de stjålne oplysninger er CPR-numre, navne og adresser på tusindvis af danskere. Derudover har hackerne i nogle patienters tilfælde fået adgang til korte notater med graviditets- og sygdomsoplysninger. Christoffer Elmann Ranhauge Undersøgende journalist Følg Du skal være logget ind for at følge et emne.Log indOpret konto Artiklen er ældre end 30 dage Christoffer Elmann Ranhauge Undersøgende journalist Følg Du skal være logget ind for at følge et emne.Log indOpret kontoDe hackere, der i starten af december trængte ind i systemerne hos Alles Lægehus, har nu offentliggjort oplysninger, som blev stjålet fra lægehus-koncernen i forbindelse med angrebet.»Efter 3 ugers forhandling er lækket her,« skriver hackerne i opslaget på den hjemmeside, som de stjålne data er lagt ud på. PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.9 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 9 Jens Beltofte 23. januar kl. 08:58 svarede Per Jørgensen [8]Re: Mere frustreret over jeg fårMere frustreret over jeg får dette brev, ligesom jeg kan blive frustreret over ingen linker til dette lækkede data eller man navngiver hvor man kan finde det - nu hvor det er frigivet af hackerne og alles lægehus ikke ville betale, så man kan checke ud hvor grælt det egentligt er og hvor meget data de har på mig udover mit CPRJf. DR er data lækket på et lukket hackerforum. Sikkert på darkweb. Men hvis du virkelig fik adgang til det datasæt med ca. 57.000 CPR-numre, og journalnotater m.m. på ca. 14.000 (jf. https://www.dr.dk/nyheder/seneste/it-ekspert-57000-patienter-hos-alle-laegehus-er-ramt-af-hacker-angreb), så skal du virkelig passe på at du ikke selv bevæger dig ind på noget kriminelt. Blot fordi nogen har stjålet og lækket de data, giver det dig ikke ret til at sidde og rode rundt i mange tusinder menneskers dybt personfølsomme oplysninger....Ingen seriøse sikkerhedsfolk eller medier, vil oplyse hvor de har fundet det datasæt, da det åbner op for at rigtig mange har interesse i at snage i de data eller misbruge dem. Skaden er sket, men hvis man offentlige gjorde hvor man har set de lækkede data, vil problemet vokse sig endnu større. 2 0more_vert insert_linkKopier link 8 Per Jørgensen 22. januar kl. 21:03Mere frustreret over jeg fårMere frustreret over jeg får dette brev, ligesom jeg kan blive frustreret over ingen linker til dette lækkede data eller man navngiver hvor man kan finde det - nu hvor det er frigivet af hackerne og alles lægehus ikke ville betale, så man kan checke ud hvor grælt det egentligt er og hvor meget data de har på mig udover mit CPR 0 0more_vert insert_linkKopier link 7 John Tajl 22. januar kl. 17:43 svarede Jens Hubertuson [3]Re: Kreditadvarsel er i hvert faldVil selv gerne vide om mit data er leaked venter spændt på svar 0 0more_vert insert_linkKopier link 6 John Tajl 22. januar kl. 17:42Min dataHvordan finder jeg ud af om der er noget info om mig i det Leakede angreb, jeg er forhåbentlig ikke nød til at downloade hele leaked bare for at prøve at finde mit eget info 0 0more_vert insert_linkKopier link 5 Jens Beltofte 21. januar kl. 19:58Flere detaljer hos DRIT-sikkerhedsspecialist Jan Kaastrup har nu regnet på, hvor mange ud af de 130.000 patienter som er ramt af cyberangrebet.Hans beregninger viser, at datalækket hos Alles Lægehus omfatter 57.000 patienter.Af disse har cirka 14.000 fået lækket journaloplysninger. Herunder oplysninger om henvisninger til sygehuse, sygdomshistorik, eller hvilke typer medicin patienterne fårSe https://www.dr.dk/nyheder/seneste/it-ekspert-57000-patienter-hos-alle-laegehus-er-ramt-af-hacker-angrebSå kan Alles Lægehus godt sende endnu et brev ud til de ramte patienter. Det er så værre end de først antog. 1 0more_vert insert_linkKopier link 4 Jens D Madsen 21. januar kl. 17:48Risiko?I Danmark har Center for Cybersikkerhed under Forsvarets Efterretningstjeneste vurderet, at truslen fra cyberkriminalitet mod den danske sundhedssektor er meget høj.Skal det forstås sådan, at der alene er risko for hacking, hvor der hentes informationer? Eller, er også en høj risiko for, at der manipuleres med informationer?Manipulerede informationer i sundhedssektoren kan være meget alvorlige, og ligefrem medføre fejlindlæggelser, fejlbehandlinger, fejlmedicinering, og mulige dødsfald. Skal det forstås sådan, at der er høj risiko? 2 1more_vert insert_linkKopier link 3 Jens Hubertuson 21. januar kl. 14:42 svarede Jens Hubertuson [2]Re: Kreditadvarsel er i hvert faldJeg kunne i øvrigt godt tænke mig at se de data der er lækket, hvor kan man se dem? Jeg får ingen svar fra dem. 0 0more_vert insert_linkKopier link 2 Jens Hubertuson 21. januar kl. 14:42Kreditadvarsel er i hvert faldKreditadvarsel er i hvert fald bestilt. Hvor bestiller man nyt CPR nummer? Det er skægt, alvoren er så stor og vi kan oprette en kreditadvarsel, som der måske bliver taget højde for. Alt imens der ingen godtgørelse til os, til gengæld får vi en masse besvær. Og måske problemer… 3 0more_vert insert_linkKopier link 1 Peter Nielsen 20. januar kl. 18:08Til dig som læser detteTil dig som læser dette, og som er påvirket af ovenstående, vil jeg bare sige, at jeg føler med dig, og jeg håber, at Datatilsynet både indstiller virksomheden til den størst mulige bøde og politianmelder dem, selvom jeg godt ved, at det ikke ændrer noget for dig personligt, da skaden allerede er sket. Men det kan dog forhåbentlig være et lille plaster på såret for dig. Et lille råd herfra er at se at få dig en såkaldt "kreditadvarsel" registreret hos CPR. Andre gode råd er velkomne som svar. 15 1more_vert insert_linkKopier link'
