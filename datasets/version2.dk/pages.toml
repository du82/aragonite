title = "TekHus"
description = """
Med det daglige nyhedsbrev fra Danmarks stærkeste medie inden for teknologi og videnskab, får du hver morgen og eftermiddag et fagligt overblik og inviteres til levende debat mellem fagfolk. Vi bringer de væsentligste teknologinyheder og går i dybden med de tendenser, der ændrer verden på godt og ondt.

Når du tilmelder dig Ingeniørens Daglige Nyheder tilmeldes du automatisk vores ugentlige nyhedsbrev Ingeniøren Weekend. Du kan til enhver tid afmelde dig nyhedsbrevet på denne side."""
full_description = "Konto exit_to_appLog ind person_addOpret bruger refreshNulstil adgangskode Indhold draftsNyhedsbreve Data thumbs_up_downTransparens drafts Nyhedsbreve Her er en oversigt over nyhedsbreve fra Danmarks stærkeste mediesider inden for teknologi og videnskab. Til din indbakke leverer vi de vigtigste tekniske nyheder, blogs og udtalelser fra eksperter på forskellige områder, videnskabelig debat mellem vores læsere og relevante job, du kan være interesseret i. Fra Ingeniøren Hold dig opdateret med nyheder, debat og job inden for ingeniørvidenskab, teknologi og samfund Ingeniøren daglige nyheder Med det daglige nyhedsbrev fra Danmarks stærkeste medie inden for teknologi og videnskab, får du hver morgen og eftermiddag et fagligt overblik og inviteres til levende debat mellem fagfolk. Vi bringer de væsentligste teknologinyheder og går i dybden med de tendenser, der ændrer verden på godt og ondt. Når du tilmelder dig Ingeniørens Daglige Nyheder tilmeldes du automatisk vores ugentlige nyhedsbrev Ingeniøren Weekend. Du kan til enhver tid afmelde dig nyhedsbrevet på denne side. Ingeniøren Weekend Ingeniøren Weekend opsamler ugens vigtigste historier og debat fra Danmarks stærkeste medie inden for teknologi og videnskab. Tech Weekly (in english) Tech Weekly is Ingeniøren's English-language newsletter, bringing the week's important stories from all Ingeniøren's media sites. In each newsletter, we focus on the trends in the week's news and give the reader the most important from both Ingeniøren, Version2, Radar and our PRO media sites. E-avisen Modtag en mail, når den nyeste e-avis er klar. Automation & Robotter Ingeniøren sætter fokus på nye teknologier inden for automation og robotter, og de muligheder, som den digitale omstilling giver for små og mellemstore virksomheder. Big Green Bliv klogere på de store bevægelser i den grønne omstilling - fra konkurrencevilkår og statsstøtte til grøn brintproduktion, havvind eller CCS. Byggeri Ingeniørens byggerinyhedsbrev sætter fokus på de største historier og den nyeste forskning inden for byggeriet. Elektronik & Tele Bliv opdateret på Ingeniørens og Version2s vigtigste historier om ny teknologi inden for elektronik og tele. Vi skriver om mikrochips, sensorer, satellitter og trådløs teknologi som 5G og wifi. Energi Til dig med særlig interesse for den igangværende energikrise. I nyhedsbrevet samler vi de vigtigste artikler og perspektiver om den nye energivirkelighed. Event Hold øje med de nyeste events, messer og briefings fra Teknologiens Mediehus med Ingeniørens eventnyhedsbrev, som udkommer en gang om måneden. Klima Med Ingeniørens klimanyhedsbrev kan du holde dig opdateret på udviklingen inden for klimaområdet. Vi dækker både de videnskabelige og tekniske facetter af klodens udfordringer og stiller skarpt på, hvordan udviklingen præger og påvirker samfundet, kloden og din hverdag. Miljø Ingeniørens miljønyhedsbrev er for dig med særlig interesse for miljø og natur. Vi stiller skarpt på alt miljøvidenskab, biologi, biodiversitet, naturforvaltning, økologi, bioressourcer, skovbrugsvidenskab og meget mere. Naturvidenskab Vil du følge ny viden, begivenheder og nyheder inden for naturvidenskab, så tilmeld dig Ingeniørens naturvidenskabsnyhedsbrev. Vi dækker alle de naturvidenskabelige områder som rumfart/astronomi, biologi, miljø, matematik, fysik og geologi og gør dig klogere på naturvidenskabelig grundviden og universitets tilbliven. Sundhed Ingeniørens sundhedsnyhedsbrev stiller skarpt fokus på sundhedsteknologi. Vi beskriver forskningen, forklarer resultaterne og stiller kritiske spørgsmål til de politiske beslutninger på sundhedsområdet. Studerende Ugens nyhedsbrev til dig, der er studerende fyldt med studiejobs, ugens vigtigste historier fra hele Ingeniørens univers og ugens podcasts. Strategi & Forretning Strategi & Forretning hjælper dig som leder i dagens teknologisamfund til at navigere i og forstå nye teknologier. Vi giver dig indsigt i, hvordan du implementerer de nødvendige forandringer for at leve op til krav som ESG, NIS2, GDPR og AI Act, ligesom vi følger de vigtige trends indenfor eksempelvis AI, digitalisering og grøn omstilling. Transport Med Ingeniørens transportnyhedsbrev får du en bred dækning af transportområdet. Vi sætter fokus på de vigtigste tendenser, projekter og teknologier. Det gælder dem, der fungerer, og ikke mindst dem, der ikke gør. Fra Version2 De seneste nyheder, blogs, debat og job om IT og digital udvikling Version2 daglige IT-nyheder Version2 er Danmarks seriøse it-medie til dig, der arbejder professionelt med it og vil have uafhængig information af høj faglig kvalitet. Version2’s nyheder og ekspertblogs favner både it-tekniske og -forretningsmæssige problemstillinger inden for informations- og kommunikationsteknologien. Radar ugentligt nyhedsbrev Fordi tech er politisk. I det ugentlige nyhedsbrev undersøger vi tech, digitalisering, privacy, etik, overvågning, algoritmer og techgiganter. AI Vi samler nu AI-nyheder på tværs af vores teknologimedier i et fælles ugentligt nyhedsbrev. Kunstig intelligens udvikler sig lynhurtigt i disse år, og teknologien spås af mange at blive en afgørende faktor i alt fra forsvar til kundeservice i den nære fremtid. Cloud & IT-infrastruktur Hver anden tirsdag kan du blive opdateret med nyheder og viden på de tekniske og forretningsrelaterede nyheder om cloud, data og it-infrastruktur. IT-sikkerhed Bliv opdateret med nyheder og viden om ransomware, IT-sikkerhed, DDoS-angreb, privacy, sikkerhed i skyen og andre aktuelle it-sikkerhedsproblematikker. Spil Kom helt tæt på den danske og udenlandske spilbranche med Version2s spildækning. Vi skriver om alt fra finansiering, branchenyt, privacy og IT-sikkerhed til teknologi og innovation inden for spilbranchen. Fra PRO Teknologinyheder for professionelle. Det meste indhold i PRO-nyhedsbreve kræver abonnement for at læse BuildingTech De to ugentlige nyhedsbreve bringer dig ny viden om teknologiske løsninger, digitalisering, udbud, standarder og rammebetingelser inden for byggeri, renovering og vedligehold. Via cases fra ind- og udland giver vi inspiration til dig, som arbejder professionelt med byggeri. CareTech Nyhedsbrevet fra CareTech udkommer hver onsdag og fredag og omhandler velfærdsteknologiske løsninger. Med fokus på ny teknologi og innovativ implementering dækker vi alt fra høreapparater og robotter til dronebåren IV-medicin, apps og wearables. ComplianceTech Nyhedsbrevet fra ComplianceTech udkommer en gang om ugen, og omhandler både GDPR, cookies, NIS-loven og ISO-standarder. Vi går bagom complianceværktøjerne, analyserer nye afgørelser fra domstole og myndigheder og giver overblikket, når der er ny regulering på vej. DataTech Med det ugentlige nyhedsbrev fra DataTech sætter vi fokus på avanceret anvendelse af data i en stadig mere digitaliseret verden. Vi følger danske virksomheder, kommuner og institutioners arbejde og strategier med at skabe mere værdi ud af data og giver dig inspiration, råd og erfaringer om, hvordan du analyserer og udnytter data samt hvordan du navigerer ansvarligt og effektivt i junglen af love og regler på området. DigiTech DigiTech giver dig to ugentlige nyhedsbreve. Tirsdag og fredag kan du læse nyheder, interviews, tendenshistorier, debatindlæg og se navnenyheder og kalender. Der er fokus på løsninger, tendenser og vidensdeling. EcoTech To gange om ugen udsender EcoTech et nyhedsbrev med artikler og cases om biodiversity og økosystemer rettet mod offentlige myndigheder og virksomheder. GridTech De to ugentlige nyhedsbreve fra GridTech er til dig, som vil holdes opdateret om ny teknologi knyttet til elnettet. Vi sætter fokus på energisektorens omstillingsproces med udgangspunkt i elsystemet og bringer de erfaringer, aktørerne gør sig undervejs. Vi holder dig også orienteret om nye, politiske rammevilkår, der får betydning for den tekniske omstilling ude i systemet. MobilityTech De to ugentlige nyhedsbreve fra MobilityTech bringer dig nyheder om udviklingen med at få byplanlægning, infrastruktur og transport til at spille sammen, og holder dig opdateret på de økonomiske og politiske rammevilkår på området. ResilienceTech ResilienceTech giver dig et ugentligt nyhedsbrev om kritisk infrastruktur med fokus på den faglige vinkel. Hver torsdag kan du læse cases om løsninger, udfordringer med rammevilkår, nyheder om branchen, interviews med fagfolk, tendenshistorier, debatindlæg samt se navnenyheder og kalender. WasteTech WasteTech giver dig 2-3 ugentlige nyhedsbreve. Tirsdag og torsdag kan du læse nyheder, interviews, tendenshistorier, debatindlæg og se navnenyheder og kalender. Hver fredag samler vi op på ugens begivenheder indenfor affald- og genanvendelsessektoren. WaterTech De to ugentlige nyhedsbreve fra WaterTech har fokus på de løsninger, der opstår i samspillet mellem virksomheder, rådgivere, kommuner og forsyninger. Vi har fokus på tendenser, løsninger og rammevilkår, når vi gør klogere på branchefolks erfaringer i hverdagen. Vælg et eller flere nyhedsbreve, du gerne vil modtage eller log ind for at se og administrere dine nyhedsbreve Vælg flere, eller bekræft for at fortsætte Bekræft valg Du er ved at tilmelde dig: Email error Skal være udfyldt Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere. Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere vores brugerbetingelser og privatlivspolitik før du kan fortsætte. Tilbage Tilmeld mig check_circle Succes! Vi har sendt dig en bekræftelsesmail, som du bør modtage inden for et par minutter. Hvis du gerne vil se og administrere dine nyhedsbreve i fremtiden kan du gøre det med en 