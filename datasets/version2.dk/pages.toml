["https://version2.dk/artikel/bbc-tester-ai-til-nyhedsartikler-finder-store-fejl-i-over-halvdelen"]
title = "BBC tester AI til nyhedsartikler: Finder store fejl i over halvdelen | Version2"
description = "Et nyt eksperiment fra BBC afslører alvorlige mangler i AI-genererede nyhedsartikler. I 51 procent af de testede historier fandt de fejl såsom unøjagtigheder, fejlcitater og misvisende fakta."
full_description = '''@media (min-width: 978px) { #tmk--000Cv2U-M79Nqs + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001zSS3cn4bw40 + .kevel-skeleton { display: none; } }BBC tester AI til nyhedsartikler: Finder store fejl i over halvdelen Kunstig Intelligens14. februar kl. 13:4710 kommentarer Illustration: Freepik.Et nyt eksperiment fra BBC afslører alvorlige mangler i AI-genererede nyhedsartikler. I 51 procent af de testede historier fandt de fejl såsom unøjagtigheder, fejlcitater og misvisende fakta. person Rasmus Ourø Lund Følg Du skal være logget ind for at følge et emne.Log indOpret konto person Rasmus Ourø Lund Følg Du skal være logget ind for at følge et emne.Log indOpret kontoKunstig intelligens spiller en stadig større rolle i medielandskabet, hvor sprogmodeller hjælper journalister med at producere, oversætte og redigere artikler hurtigt. Men ifølge BBC’s analyse er AI-genererede nyheds resumer ofte fejlbehæftede, det skriver BBC.‘AI-assistenter kan i øjeblikket ikke stoles på til at levere præcise nyheder, og de risikerer at vildlede modtagerne,’ konkluderer rapporten.MetodeBBC’s AI-team testede fire store sprogmodeller – ChatGPT-4o, Microsoft Copilot Pro, Google Gemini Standard og Perplexity. De præsenterede modellerne for 100 nyhedsrelaterede spørgsmål baseret på populære Google-søgninger fra det seneste år, som de fandt fra Google-trends. Modellerne blev bedt om at lave et nyheds-resume af de udvalgte artikler og med den bestemte instruks om at basere sig på BBC’s nyhedskilder, når det var muligt.Artiklen fortsætter efter annoncenDe i alt 362 AI-genererede svar blev gennemgået af 45 BBC-journalister med ekspertise i emnerne. De vurderede svarene ud fra kriterier som nøjagtighed, upartiskhed, klarhed, kontekst og korrekt kildeangivelse. Resultatet var, at over halvdelen af svarene indeholdt ‘signifikante fejl’.I analysen advarer BBC om, at fejl kan forstærkes af AI’ens troværdighed: ‘Vi ved fra tidligere forskning, at når AI-assistenter citerer betroede medier som BBC, er publikum mere tilbøjelige til at stole på svaret – også selvom det er forkert’.Hvilken AI klarer sig bedst?Skulle man som som journalist være fristet til til at uddelegere ens arbejde til en sprogmodel, så klarede Perplexity sig bedst i testen, den havde kun ‘signifikante problemer’ i 40 procent af tilfældene, mens man måske skal være mere forbeholden over for Googles Gemini, som havde det i 60 procent af tilfældene. Læs ogsåMicrosoft-rapport: Folk bliver dummere af kunstig intelligensDenne artikel AI kan ramme vores kritiske sans: Særligt unge er udsat, viser studie Nyt center for klinisk AI: »Vi har brug for en motorvej fra idé til implementering«EmnerKunstig IntelligensFølgDu skal være logget ind for at følge et emne.Log indOpret konto10 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 10 Nis Schmidt 19. februar kl. 01:07AI er god til opslagRetrieval Augmented Generation giver god anvendelse af AI - sparer mennesketid ved opslag i tekst (manualer, lovsamlinger etc). 1 0more_vert insert_linkKopier link 9 Ebbe Tranberg 18. februar kl. 22:19Da journalister primært interviewer andreDa journalister primært interviewer andre journalister, skal AI naturligvis kun trænes på rene journalistiske artikler. Ekspert: Enten en fast kilde, der pålideligt giver alibi til journalistens agenda (Harry Lahrman, f.eks.), eller en indisk professor i kolonialøkonomi 1 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 8 Karin Mandix 18. februar kl. 18:07 svarede Allan S. K. Frederiksen [7]Re: Logik - datid af "lad gå"Som skrevet står i artiklen: Der er tale om generelle generative AI'er.ChatGPT-4o, Microsoft Copilot Pro, Google Gemini Standard, Perplexity 1 0more_vert insert_linkKopier link 7 Allan S. K. Frederiksen 18. februar kl. 14:06 svarede Nis Schmidt [4]Re: Logik - datid af "lad gå"Det er rimeligt at antage at en generativ AI der skal generere nyhedsartikler, primært er blevet trænet på disse og ikke alt hvad der kan findes på internettet. 0 2more_vert insert_linkKopier link 6 Lone Bech 15. februar kl. 21:34 svarede Bo Christensen [5]Re: Steroid-bæltet..hvorved den gamle slager: "jeg går aldrig til bal uden..." fuldstændigt, forever har ændret karakter. DRs AI-tekster bruger jeg ofte, da folk enten mumler eller speedsnakker og jeg gerne skruer meget ned for lyd. Det er så primært i livestreamning, AI kan være rigtig sjov eller udtalt rainman'et.Da jeg lidt adspredt så statsministerens nytårstale med slutteksten "Så kommer det ikke til at gå helt af helved til!" var jeg 100 på, at det måtte være rainAI eller en spøgefugl ved DR - men nej, den viste sig god nok. 10 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 5 Bo Christensen 15. februar kl. 20:56 svarede Lone Bech [2]Re: Steroid-bæltetSteroid-bæltet er hvad DR's AI-drevne tekstmaskine fik ud af et asteroid-bælteSand historie:På min udmærkede arbejdsplads fik vi sidste år et nyt (påstået AI-drevet) tale-til-tekst system. Jeg må i al tid fremover nu stå som forfatter til en psykologjournal (som man ikke må redigere i) med følgende guldkorn om en klient, der havde været udsat for trusler: "[...] beskriver symptomer konsistent med PTSD efter at have været udsat for trusser med økse". 17 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 4 Nis Schmidt 15. februar kl. 20:49 svarede Jens D Madsen [3]Re: Logik - datid af "lad gå"Så længe at AI optrænes på artikler skrevet af journalister, så vil størstedelen der genereres være vrøvl og usandt.Journalisters materiale udgør en meget LILLE procentdel af, hvad der findes på nettet (WWW); resten er ytringer skrevet af fagfolk, almindelige mennesker, would wannabe forfattere (smiley) og kunstig intelligens (AI, LLM osv.). 7 1more_vert insert_linkKopier link 3 Jens D Madsen 15. februar kl. 18:36LogikSå længe at AI optrænes på artikler skrevet af journalister, så vil størstedelen der genereres være vrøvl og usandt. 5 16more_vert insert_linkKopier linkSkrevet på Ingeniøren 2 Lone Bech 14. februar kl. 20:55Steroid-bælteter hvad DR's AI-drevne tekstmaskine fik ud af et asteroid-bælte (i et indslag om nattehimlen). Når Musk & co. insisterer på at kolonisere Mars og afbureaukratisere den offentlige sektor, kunne der være en eller anden sammenhæng(?) 10 0more_vert insert_linkKopier link 1 Peter Nielsen 14. februar kl. 17:59Når jeg læser sådan nogetNår jeg læser sådan noget her, har jeg brug for at sætte det op mod noget andet, og i dette tilfælde må det være nyhedsartikler, der ikke er lavet af et program, men af et menneske. Så hvor mange procent af de nyhedsartikler, der er skrevet af mennesker, er der fejl i? Det kan ikke være småting ud fra, hvad jeg støder på til daglig. 19 1more_vert insert_linkKopier link'''
