gang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 32 Peter Favrholdt 21. februar kl. 07:52 svarede Steen Secher Schmidt [30]Re: Udvikle selv?Tak for svar. Hvor længe siden?Kan du give eksempler på de problemer du oplevede? 6 0more_vert insert_linkKopier link 31 Kristian Bundgaard Ringgren 20. februar kl. 21:31 svarede Steen Secher Schmidt [30]Re: Udvikle selv?Men hvor store er kravene? Hvad er det, vi laver i sundhedssektoren der er så komplekst? Den nye funktion med at outlook linker til filer i onddrive i stedet for at vedhæfte er en skændsel, og sikkert kun GDPR-compliant nogle måneder endnu. Og burde dem som bruger de advancerede funktioner i excel ikke bare bruge R i stedet for? Godt nok tilsiger min funktion i regionen ikke kompliceret IT, men jeg har rigtigt svært ved ar se, hvilke opgaver officepakken løser godt. 13 0more_vert insert_linkKopier link 30 Steen Secher Schmidt 20. februar kl. 21:10 svarede Peter Favrholdt [25]Re: Udvikle selv?Jo, jeg har brugt LibreOffice, og jeg har supporteret LibreOffice. Det er pivringe. 1 6more_vert insert_linkKopier link 29 Peter Favrholdt 20. februar kl. 21:03 svarede Jakob Kastrupsen [27]Re: Udvikle selv?Du kan åbne og redigere PDF filer med LibreOffice tegneprogrammetn"Draw"... 0 0more_vert insert_linkKopier link 28 Klavs Klavsen 20. februar kl. 21:02 svarede Jakob Kastrupsen [27]Re: Udvikle selv?PDF'er er nu nemme at låse op og redigere i, hvis man vil:selvfølgelig. Men alle har en PDF læser - alle har ikke en office pakke - slet ikke på mobilen. Så en PDF kan bare læses. 4 0more_vert insert_linkKopier link 27 Jakob Kastrupsen 20. februar kl. 20:58 svarede Klavs Klavsen [26]Re: Udvikle selv?og libreoffice kan eksportere til PDF. Det bruger jeg ofte - så kan jeg sende en PDF (dvs. låst) dokument - da men jo ofte ikke har ønsker om at modtageren skal ændre i dokumentet er PDF formatet bare bedre.PDF'er er nu nemme at låse op og redigere i, hvis man vil:https://www.google.com/search?q=edit+locked+pdf+online+free 1 0more_vert insert_linkKopier link 26 Klavs Klavsen 20. februar kl. 20:51 svarede Peter Favrholdt [25]Re: Udvikle selv?Og kriteriet er vel heller ikke om noget er "ordentligt kompatible med MS Office dokumenter".og libreoffice kan eksportere til PDF. Det bruger jeg ofte - så kan jeg sende en PDF (dvs. låst) dokument - da men jo ofte ikke har ønsker om at modtageren skal ændre i dokumentet er PDF formatet bare bedre. 2 0more_vert insert_linkKopier link 25 Peter Favrholdt 20. februar kl. 20:39 svarede Steen Secher Schmidt [24]Re: Udvikle selv?Det lyder ikke som om at du har brugt LibreOffice?Og kriteriet er vel heller ikke om noget er "ordentligt kompatible med MS Office dokumenter".Fordelene ved LibreOffice er mange, udover pris (gratis) og frihed (Open Source) så kan man også sende et link med til folk: "for at kunne åbne dokumentet, så klik her for at installere LibreOffice" (på samme måde som i gamle dage med PDF og Acrobat Reader)... 5 0more_vert insert_linkKopier link 24 Steen Secher Schmidt 20. februar kl. 19:50Udvikle selv?Kunne man for et par milliarder, som Danmarks årsregning lyder på, udvikle et reelt alternativ til MS Word, Excel, PowerPoint, Outlook og en sikrere udgave af Dropbox? Man ville fremover have meget billig Office-kapabilitet i Danmark, og man ville kunne sælge det i hele Europa. Man kunne kopiere UX direkte fra Office-programmerne, så der ikke skulle udvikles nye brugerflader. Man ville kunne spare noget bloat væk. Man ville ikke behøve at kopiere MS’ cloud-funktionalitet, da det meste af det er ubrugeligt, i stykker, uden værdi, og primært lavet for at binde kunderne til Microsoft.Hvorfor ikke LibreOffice eller Googles Office-programmer spørger nogen nok? Fordi de er ringe ift MS Office, og ikke er ordentligt kompatible med MS Office dokumenter. 0 4more_vert insert_linkKopier link 23 Peter Favrholdt 20. februar kl. 11:25 svarede Sune Buhl [22]Re: Mail og kalender er nemMon ikke et par udviklere med hjælp fra AI hurtigt kan lave de tilretninger så det spiller med f.eks. LibreOffice? 1 3more_vert insert_linkKopier link 22 Sune Buhl 20. februar kl. 11:15Mail og kalender er nemMail og kalender er nem at løse. LibreOffice har faktisk været brugt i Region Hovedstaden tidligere (ca. 10 år siden), da man også der ville gøre op med de dyre Microsoft licenser. For den almindelige bruger, der blot laver dokumenter og regneark er skiftet ikke så slemt. Problemet er alle de integrationer med kliniske systemer. Mange af dem understøtter kun Microsoft Office. Uden at vide det præcist er det en meget lang liste af applikationer med afhængigheder, så det er klart at det kan være en kompleks opgave. Men det er bare at komme i gang. 17 0more_vert insert_linkKopier link 21 Maciej Szeliga 20. februar kl. 11:11Der bør også kikkes på IT-strategier......der er kommet en uvane med at skrive producenter ind i IT-strategier som så i realiteten giver carte blanche til at afvise alt andet "fordi det ikke passer ind i strategien". 4 0more_vert insert_linkKopier link 20 Laust Christensen 20. februar kl. 10:19Europæiske alternativerDer er masser af alternativer og jo før de kommer i gang, jo billigere bliver det. MS kommer jo aldrig til at skrue ned for prisen, hvis "vi" ikke kan skrue bissen på.https://european-alternatives.eu/alternatives-tohttps://european-alternatives.eu/categories 10 0more_vert insert_linkKopier link 19 Maciej Szeliga 20. februar kl. 09:57 svarede Peter Favrholdt [16]Re: IT chefer i det offentligeMed erfaring indenfor IT - som er i stand til at "se igennem" de salgstricks de store leverandører bruger.Hæ! Den slags er en mangelvare i DK.Når der endelig er nogen så sætter CEO/CFO sig på dem og giver kun penge til hvad der passer Strategien. 8 0more_vert insert_linkKopier link 18 Klavs Klavsen 20. februar kl. 09:40 svarede Peter Favrholdt [11]Re: LibreOffice og mailOg svjv bedre end OpenOfficeOpenOffice er dødt. Der sker ingen udvikling og der er intet community.Libreoffice er super aktivt og man kan f.ex. i tyskland købe support fra dedikerede firmaer, der hjælper en og laver forbedringer i Libreoffice (og hjælper med at få det integreret i nye Libreoffice releases, så vedligehold overgår til community og alle vinder).Måske er der også danske firmaer der kan det - men man SKAL checke commit historik i libreoffice git træet - har de folk ansat, der fået merget deres arbejde i libreoffice tidligere eller ej? 15 0more_vert insert_linkKopier link 17 Klavs Klavsen 20. februar kl. 09:37 svarede Ditlev Petersen [14]Re: LibreOffice og mailMen hvis dokumenterne er i en slags xml, er det måske ligefrem nemmere?Det er faktisk blevet meget nemmere i Libreoffice takket være det store open source community. Der findes f.ex. python moduler, der gør så du kan indlæse en libreoffice skabelon, udfylde felter fra data og generere et nyt libreoffice eller pdf dokument.Så det kan gøres rimelig fedt - meget nemt. Betydeligt bedre og nemmere at vedligeholde end makroer mm. i office - og du kan finde flere programmører der kan gøre det arbejde. 11 0more_vert insert_linkKopier link 16 Peter Favrholdt 20. februar kl. 09:27 svarede Peter Hansen [13]Re: IT chefer i det offentligeMed erfaring indenfor IT - som er i stand til at "se igennem" de salgstricks de store leverandører bruger. 14 0more_vert insert_linkKopier link 15 Peter Favrholdt 20. februar kl. 09:23 svarede Ditlev Petersen [14]Re: LibreOffice og mailMen hvis dokumenterne er i en slags xml, er det måske ligefrem nemmere?Der kan altså udvikles en hel del nyt "software-lim" for de licens-beløb der nævnes... og gøres det rigtigt er der besparelser i mange år fremover.De "tilretninger" som pt. bruges (f.eks. den skabelon du nævner) - har det offentlige retten til kildekoden? I så fald kan AI sikkert hjælpe med at oversætte til noget bedre/mere generelt - eller i det mindste formulere kravspec+tests ud fra eksisterende kode/tilretninger.Jeg tror den største hindring er de offentlige IT-udbuds princip med at det kun er de helt store leverandører der kan byde ind (krav til omsætning)... hvis man i stedet tillod mindre IT-virksomheder at deltage så vi fik reel konkurrence, så ville prisen falde og kvaliteten stige. 8 0more_vert insert_linkKopier link 14 Ditlev Petersen 20. februar kl. 08:53 svarede Peter Favrholdt [11]Re: LibreOffice og mailEr de offentlige systemer virkeligt så avancerede at LibreOffice ikke kan bruges? Vi havde engang et system, hvor man fra systemet gik ind i en skabelon for at redigere i et worddokument. Jeg arbejdede ikke selv på det system, så jeg kender ikke til detaljerne, men hvis man laver sådan noget, er det nok ikke helt nemt at skifte. Men hvis dokumenterne er i en slags xml, er det måske ligefrem nemmere? 5 0more_vert insert_linkKopier link 13 Peter Hansen 20. februar kl. 08:12IT chefer i det offentligeDet er interessant at IT chefer i det offentlige stort set aldrig har en baggrund indenfor IT. Mette Harbo er for eksempel uddannet som cand.scient.soc. Hun er sikkert fornuftig nok, men måske ville IT i det offentlige fungere bedre hvis man bare en gang i mellem fik ansat en chef, der rent faktisk var uddannet indenfor IT. 22 0more_vert insert_linkKopier link 12 Pernille Tranberg 20. februar kl. 07:23PiloterSuper godt at I holder Stage op på vores konkrete forslag fra techgigant- ekspertgruppen; pilotforsøg i skoler og kommuner for på sigt at arbejde os ud af denne afhængighed som big tech tydeligvis udnytter. Det kræver kæmpe politisk mod at gå i gang med den proces og det håber jeg hun har - og ja ved godt at big tech sikkert modarbejder ethvert forsøg på at bevæge os væk fra dem men der er kun den ene vej for ja det blir ulovligt igen igen at bruge cloud som har juridisk hovedsæde i USA 15 0more_vert insert_linkKopier link 11 Peter Favrholdt 20. februar kl. 06:05LibreOffice og mailLibreOffice er på nogle områder bedre end MS Office. Og svjv bedre end OpenOffice... men LibreOffice nævnes ikke i artiklen?Thunderbird som mail klient er bedre end Outlook. Og ja at køre en mailserver er ikke så svært...Begge dele koster gratis og kører på både Microsoft, MacOS og Linux...Er de offentlige systemer virkeligt så avancerede at LibreOffice ikke kan bruges? 22 0more_vert insert_linkKopier link 10 Nis Schmidt 20. februar kl. 00:06A new and better mouse trapSå kan man f.ex. skifte cloud leverandør NEMT.Citatet er (kun) med her for at illustrere brugen af 4 bogstaver, NEMT - tidens løsen.Alle vil gerne bygge en "ny og bedre mussefælde" ind i deres produkter. Der er talløse eksempler, men kun ét her: StarOffice -> OpenOffice -> LibreOffice. (Google selv historien.) Når en virksomhed bliver stor nok - får mange medarbejdere - vil man gerne holde på dem OG så får man brug for en "mussefælde". For de mange kunder som betaler mange ansatte er det, der gør virksomheden stor.Den letteste måde at implementere en på er, hvis man har adgang til en sky. Så skal man fx lave en "krølle" i pr'''
