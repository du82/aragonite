konsulenthuse der er flasket op med blikket (kompetencerne?) stift rettet mod "monopol" løsningerne. 5 0more_vert insert_linkKopier link 9 Stig Libori 27. februar kl. 13:21Nextcloud HUB 10Kom nu bare over på det eneste realistiske opensource-alternativ: https://nextcloud.com/blog/press_releases/nextcloud-launches-hub-10-breaking-the-myth-of-european-tech-dependency/ 4 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 8 Mads Peter Jensen 27. februar kl. 13:14Jeg har lige overværet enJeg har lige overværet en debat på V2' security konference i Århus. Her fremgår det klart af Favrskov IT chefen Henrik Tang Brix, at Microsofts er "Skide gode".Jeg tror, at så længe der ikke er udskiftning af IT-chefer i kommunerne sker der intet på det område. IT-cheferne er brændt varme på Microsoft. Hvis vi skal videre, så skal der radikale ændringer til. Opensource-samfundet skal ind og have magt til at gennemføre ændringerne, hvis vi skal frigøre os fra Microsoft.Men skal vi frigøre os fra Microsoft. Ja ikke ifølge Microsoft og IT-chefen fra Favrskov, der skal bare være mere samarbejde. Jeg spurgte så Microsoft hvorfor Azure servere er 3 gange så dyre som f.eks Hetzner i Tyskland. Svarret var bare at vi kunne tale bagefter, så kunne vi da finde en god løsning. Men det var helt ved siden af. Pointen var ikke at jeg skulle finde en billig server, Pointen var, at det offentlige i Danmark betaler 3 gange så meget for servere i Azure end hvis de valget andre leverandører.Jeg synes ikke kun det handler om Openoffice/Libreoffice. Det handler generelt om at frigøre sig fra de amerikanske tech-giganter. Alle de amerikanske tech-giganter!Men det er klart at Openoffice også er en del af det. Man hører ofte spørgsmålet: ”Kan man lave integrationer til Openoffice” og svaret er entydigt JA. Derfor er det også beskæmmende når en IT-chef stå på talerstolen vævende siger ”Dem vi spørger siger”: ”Det ved de ikke, vi har aldrig hørt om integrationer i Openoffice.”Jeg vil bare sige, at så er det nok fordi i taler med de forkerte. Og det nok er det største problem. Hvis IT-chefer kiggede ud over Microsoft broderskabets snævre kreds, så ville de opdage, at der er masser af alternative løsninger, som ikke kører Microsoft priser. Og som fremadrettet vil give frihed til at vælge leverandører.Endvidere så vil jeg skyde lidt mere på IT-cheferne. Alle kommuner har fået udviklet systemer og integrationer. Og her undre det mig, at kravet ikke har været, at det skal være opensource. Man betaler et stort it-firma for at udvikle en integration. Og bagefter er det så det IT-firmas ejendom. Vi taler om den offentlige administration, og her må jeg sige, at IT-cheferne ikke får læst det med småt. Selvfølgelig skal offentlig betalt udvikling være offentlig tilgængelig og komme alle til gode. Alt andet berettiger da til den konklusion, at man ikke er opgaven som IT-chef voksen.Jeg vil sige som en sidste kommentar til debatten på V2 security konference i århus. Sjældent har jeg hørt så meget snakken uden om fra IT-chef Henrik Tang Brix og fra Microsoft Rasmus Knappe. Den eneste, der forsøgte at sige noget fornuftigt var Christian Damsgaard Jensen fra Århus universitet. Han påpegede at Microsoft office pakken til Mac og PC ikke arbejder gnidningsfrit sammen. Det burde jo få alle, der betaler Microsoft licenser til at studse og tænke, hvorfor er det lige, at vi skal betale for at Microsofts medarbejdere skal køre i Porsche. 23 1more_vert insert_linkKopier link 7 Nikolaj Sørensen 27. februar kl. 10:58 svarede Jørgen Svendsen [6]Re: Er der nogen der afprøver libreoffice i DK?der er trods alt grænser for hvor meget MS kan presse citronen (kommunerne) før end at de bliver nød til at finde et alternativJeg tror endelig vi er ved at være, der hvor det er for dyrt ikke at overveje et alternativ. Vi har set det med Oracle, der til sidst blev så ublu i deres priser og licensbetingelser at selv det offentlige ville ud. Det ser ud til, at vi også er ved at være der med Microsoft.Det ville være dejligt hvis man var startet for 15 år siden, inden MS begyndte at tage monopol-priser og inden man byggede alle sine arbejdsgange op om integration til Microsoft Office. Men bedre sent end aldrig. 20 1more_vert insert_linkKopier link 6 Jørgen Svendsen 27. februar kl. 10:39 svarede Klavs Klavsen [4]Re: Er der nogen der afprøver libreoffice i DK?Er der virkelig ikke nogen pilot projekter i dette område, der kan finde ud af at arbejde efter open source metoden? (åben deling imens - ikke bagefter)Jeg tror det ikke, desværre, men mod ikke det snart kommer, der er trods alt grænser for hvor meget MS kan presse citronen (kommunerne) før end at de bliver nød til at finde et alternativ. 11 1more_vert insert_linkKopier link 5 Sven Møller Jensen 27. februar kl. 09:26 svarede Jesper Jørgensen [3]Re: Lav en task-force i KLDet kan du have ret i, jeg reagerede mest på Microsoftlicenser generelt. Hvorom alting er, så kunne det stadig være en idé at KL kon ind over så man kunne få en fælles tilgang, også til office applikationerne.Jeg har kigget lidt på Collabora Office, som bygger på Libre Office. Jeg har dog ikke prøvet det 12 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 4 Klavs Klavsen 27. februar kl. 09:26Er der nogen der afprøver libreoffice i DK?Jeg tænker at hvis nu en "test kommune" - åbnede et github, gitlab, gitea eller andet git repo og delte de løsninger de testede af for at erstatte MS office med LibreOffice - så ville der helt sikkert være flere end mig - der var interesseret i at give indspark eller hjælp til at løse problemer med integrationer og andre udfordringer.. og Libreoffice projektet selv ville helt sikkert også gerne høre om det.Er der virkelig ikke nogen pilot projekter i dette område, der kan finde ud af at arbejde efter open source metoden? (åben deling imens - ikke bagefter) 23 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 3 Jesper Jørgensen 27. februar kl. 08:51 svarede Sven Møller Jensen [2]Re: Lav en task-force i KLDenne artikel taler vel mere om bruger licenser til office pakken (Word, outlook osv), hvor de artikler du linker til, er eksempler på hvor de har skiftet Azure ud med andre services. De skal nærmere kigge med tyskland, hvor de har lavet et større skifte for brugerne. Tysk delstat skrotter Windows: Skifter til LibreOffice og Linux | Version2 31 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 2 Sven Møller Jensen 27. februar kl. 08:10Lav en task-force i KLMan kan da håbe at KL hurtigt laver en taskforce og finder ud af hvordan Aarhus har gjort og afdækker faldgruber os. Det ser jo ud til at det kan lade sige gøre relativt smertefrit. Aarhus er dog en stor kommune, så mon ikke mindre også kan https://www.version2.dk/artikel/kommune-droppede-microsoft-tysk-cloud-jeg-sparer-tredjedele-af-prisen https://ing.dk/artikel/dansk-virksomhed-forlod-aws-og-flyttede-alt-i-tysk-cloud-det-er-helt-klart-under-halv-pris 29 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Maciej Szeliga 27. februar kl. 07:28Når priserne skrues op......så finder man en billiger løsning som kan dække opgaven.Det er det som borgerne gør, så det kan kommunerne (og regionerne etc) også.Man har ikke lyst til at gå igang for "tænk hvis det går galt" - så enkelt er det. Afhængigheden sidder primært i hovedet på den afhængige - ikke ulig mange andre afhængigheder. 47 1more_vert insert_linkKopier link'''
