kal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 7 Jens Larsen 20. januar kl. 15:27 svarede Mikkel Kruse Johnsen [6]Re: 10 år?Re: 10 år? Som det fremgår at paragraf § 16 i Journalføringsbekendtgørelsen: https://www.retsinformation.dk/eli/lta/2018/530 så er det mindst 10 år de skal gemmes. Men det fremgår ikke tydeligt hvornår de skal slettes eller om de skal slettes.Nej, og så er det som med finans/øko. data, der mindst skal gemmes i 5 år. Det betyder at lægehuset ikke længere har lovhjemmel til at gennem data, men skal bruge et andet hjemmel. Jeg tænker ikke at et lægehus har lyst til at skrive en lille afhandling om hvorfor de skal gennem data længere (risikovurdering). 0 0more_vert insert_linkKopier link 6 Mikkel Kruse Johnsen 16. januar kl. 07:28 svarede Jens Hubertuson [1]Re: 10 år?Som det fremgår at paragraf § 16 i Journalføringsbekendtgørelsen: https://www.retsinformation.dk/eli/lta/2018/530 så er det mindst 10 år de skal gemmes. Men det fremgår ikke tydeligt hvornår de skal slettes eller om de skal slettes. 4 0more_vert insert_linkKopier link 5 Jens Beltofte 15. januar kl. 09:18 svarede Jens Beltofte [4]Re: 10 år?Lyder som om at Alles Lægehus har overtaget det lægehus du var patient i for over 10 år siden. Ergo har Alles Lægehus ikke styr på slettereglerne.Ups. Hvis jeg nærlæser https://stps.dk/sundhedsfaglig/ansvar-og-retningslinjer/sundhedsfaglig-vejledning/journalfoering/journalopbevaring igen skal de mindst opbevare journal i 10 år. Der fremgår ingen krav til hvor længe de må opbevare data. 9 0more_vert insert_linkKopier link 4 Jens Beltofte 15. januar kl. 09:10 svarede Jens Hubertuson [1]Re: 10 år?Jeg har så fundet ud af at det er fra et gammel lægehus, som er mere end 10 år siden jeg har besøgt.Lyder som om at Alles Lægehus har overtaget det lægehus du var patient i for over 10 år siden. Ergo har Alles Lægehus ikke styr på slettereglerne. 4 1more_vert insert_linkKopier link 3 Jens Beltofte 15. januar kl. 09:09 svarede Jens Larsen [2]Re: 10 år?Ulovligt er noget en dommer tager stilling til, men jo, det er et brud på GDPR reglerne at gemme data længere end hvad nødvendigt er. Uden at jeg kender en lov der siger at data må/skal gemmes i 10 år. Bed de to lægehuse om en redegørelse for hvilke data der er tale om og hvilken hjemmel de har benyttet til at opbevare de data i så lang tid. De bliver nød til at henvise til hvilken lov de bruger som hjemmel og så kan du kontrollere om deres hjemmel er overholdt.Jf. https://stps.dk/sundhedsfaglig/ansvar-og-retningslinjer/sundhedsfaglig-vejledning/journalfoering/journalopbevaring skal lægerne opbevare journalerne i 10 år efter seneste besøg / registreringen i journalen. Hvis en patient skifter læge, skal den tidligere læge stadig gemme data i 10 år. 10 0more_vert insert_linkKopier link 2 Jens Larsen 15. januar kl. 08:52 svarede Jens Hubertuson [1]Re: 10 år?eg er en af ofrene, men har ikke været kunde hos dem i de sidste 10 år. Og som jeg forstår, skal de kun gemme data i 10 år. Jeg har så fundet ud af at det er fra et gammel lægehus, som er mere end 10 år siden jeg har besøgt. Er det så ulovligt opbevaret data?Ulovligt er noget en dommer tager stilling til, men jo, det er et brud på GDPR reglerne at gemme data længere end hvad nødvendigt er. Uden at jeg kender en lov der siger at data må/skal gemmes i 10 år.Bed de to lægehuse om en redegørelse for hvilke data der er tale om og hvilken hjemmel de har benyttet til at opbevare de data i så lang tid. De bliver nød til at henvise til hvilken lov de bruger som hjemmel og så kan du kontrollere om deres hjemmel er overholdt. 7 0more_vert insert_linkKopier link 1 Jens Hubertuson 14. januar kl. 15:1310 år?Jeg er en af ofrene, men har ikke været kunde hos dem i de sidste 10 år. Og som jeg forstår, skal de kun gemme data i 10 år. Jeg har så fundet ud af at det er fra et gammel lægehus, som er mere end 10 år siden jeg har besøgt. Er det så ulovligt opbevaret data? 11 1more_vert insert_linkKopier link"
