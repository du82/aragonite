e betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.8 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 8 Jens Frederik Dalsgaard Nielsen 16. februar kl. 19:19 svarede Kjeld Flarup Christensen [2]Re: AI er nødvendigtkjeld. er det nu rigtig med at det kommer mere information ? jeg synes at medier bliver mere forfærdede med mindre dynamik. ord som raser, kæmpe et eller andet er snart prefix der hver anden sætning som så er i alle e medier 1 1more_vert insert_linkKopier link 7 Peter Nielsen 15. februar kl. 10:27 svarede Nis Schmidt [6]Re: Selvfølgelig er det vigtig videnDet ser umiddelbart ud som om, at vi snakker om to forskellige ting. Jeg snakker om, hvad man siger, og det ser ud som om, du snakker om, hvordan man siger, hvad man siger. Personligt er jeg fuldstændig ligeglad med, hvordan man udtrykker sig; det er indholdet, jeg er interesseret i, eller rettere ikke er interesseret i i forhold til de her kommentarer og indhold på SoMe, jeg snakker om.Og så er jeg heller ikke på SoMe, men det behøver man heller ikke være for at se kommentarer og indhold. 1 2more_vert insert_linkKopier link 6 Nis Schmidt 15. februar kl. 05:23 svarede Peter Nielsen [5]Re: Selvfølgelig er det vigtig videnDerudover mener jeg ikke, at folk skal holde sig tilbage fra at sige noget. Jeg synes ikke, folk skal lægge låg på sig selv.Det mener jeg faktisk heller ikke man skal (folk skal lægge låg på sig selv); jeg mener at hvis man ikke kan udtrykke en fornuftigt kommentar, så er udtryksløshed måske at foretrække. Du har ret i at TMs medier oprindelig var teknologisk fagmedier - det er ihvertfald derfor, jeg stadig er medlem af IDA.Men der er faktisk "debatdeltagere", som udtrykker sig lidt henad SoMe* - også på dette medie - ikke jeg har den store SoMe erfaring - eller nogen overhovedet.[*] SoMe, som fx Facebook - det vist 15+ år siden jeg "opgav" det, efter at have meldt mig ind for at holde kontakt med tidligere kolleger. Nu er jeg "halvhjertet" på LinkedIn af de samme grunde. 0 0more_vert insert_linkKopier link 5 Peter Nielsen 15. februar kl. 01:18 svarede Nis Schmidt [4]Re: Selvfølgelig er det vigtig videnV2 og så videre er ikke et SOME, og kommentarerne og indholdet, jeg taler om, som er på SOME, er grænsende til det retarderede. Det ser man ikke herinde.Derudover mener jeg ikke, at folk skal holde sig tilbage fra at sige noget. Jeg synes ikke, folk skal lægge låg på sig selv. Jeg konstaterer bare, at man ikke skal tilbringe mange sekunder på et eller andet SOME, før man ryster på hovedet. 5 0more_vert insert_linkKopier link 4 Nis Schmidt 15. februar kl. 00:49 svarede Peter Nielsen [3]Re: Selvfølgelig er det vigtig videnFor holy shit, hvor er der bare evig og altid en overflod af deciderede snotdumme kommentarer og indhold, uanset hvor end man retter blikket.TM's medier er ingen undtagelse - selvom de måske bude være det?Det virker nærmest som om, at teknologien bag sociale medier fungerer som en slags forstærker for idioti. Meget bekymrende.Nogle at lighed + ytringsfrihed = ytringspligt; men overset at ytringsfrihed også betyder "retten til at holde kæft" - en ret som alt for få benytter sig af;-) 1 8more_vert insert_linkKopier link 3 Peter Nielsen 14. februar kl. 17:35Selvfølgelig er det vigtig videnSelvfølgelig er det vigtig viden og noget, vi skal være opmærksomme på. Men i min optik ville det være meget bedre, at vi retter fokus på, hvad jeg tror er den største trussel mod menneskets intelligens, og det er sociale medier. For holy shit, hvor er der bare evig og altid en overflod af deciderede snotdumme kommentarer og indhold, uanset hvor end man retter blikket. Det virker nærmest som om, at teknologien bag sociale medier fungerer som en slags forstærker for idioti. Meget bekymrende. 9 0more_vert insert_linkKopier link 2 Kjeld Flarup Christensen 14. februar kl. 15:14AI er nødvendigtDer er i dag så mange informationer vi skal holde styr på i hovedet, at der efterhånden ikke er plads længere. Derfor er AI værktøjer nødvendigt for at aflaste hjernen. Så måske bliver vi "dummere", men vi kan også gå hen og blive mindre stressede. 3 16more_vert insert_linkKopier link 1 Henrik Forsberg 14. februar kl. 13:03Dejlig artikel om et dejligtDejlig artikel om et dejligt forskningsresultat.AI Average Ignorance er mere korrekt hype end AI Artificial Intelligence :-) 6 0more_vert insert_linkKopier link'''
