ønsberg 27. februar kl. 17:36 svarede Henrik W. Sørensen [7]Re: Jeg håber det er enJeg håber det er en fejltolkning at "Med lovforslaget fra februar får vi den forståelse, at alle systemer er omfattet". Det må stadig beror på, at vi som kommuner, får defineret hvad der er samfundskritisk og hvad der ikke er. Det handler ikke om Læsø eller København, men at alle kommuner har nogle meget små gråspurve i deres portefølje og NIS2 er en pæn stor kanon. Jeg tror der en stor del af alle de 5-700 leverandører af it til det offentlige, der får sig et sjok over pludselig at være omfattet af NIS2, hvis den kommentar er rigtig. Og os der skal implementere får nok at gøre med at styre leverandører i stedet for at højne sikkerhed, hvor der er nødvendigt.Hvis dine små IT systemer kører på samme servere/netværk eller PC'er som de kritiske, så er de en mulig sårbarhed. Derfor er de omfattet. Det er endnu værre hvis de "små" leverandører hver har remote support adgang direkte til det fælles net.Men det betyder ikke at det er samme løsning der anvendes til det hele.Hele systemet deles op i celler alt efter kritikalitet og behov for kommunikation. Der skal så etableres de nødvendige firewalls og adgangsbeskyttelser.De ukritiske systemer kan køre i en DMZ og kun have simpel beskyttelse, mens de kritiske systemer kører i hver sin celle og har mere avanceret beskyttelse.Brugerne skal naturligvis kun have adgange til præcis det deres job kræver.Extern adgang skal kun tillades hvis den kan inddæmmes, til det absolut nødvendige. 0 0more_vert insert_linkKopier link 7 Henrik W. Sørensen 27. februar kl. 13:36Jeg håber det er enJeg håber det er en fejltolkning at "Med lovforslaget fra februar får vi den forståelse, at alle systemer er omfattet". Det må stadig beror på, at vi som kommuner, får defineret hvad der er samfundskritisk og hvad der ikke er. Det handler ikke om Læsø eller København, men at alle kommuner har nogle meget små gråspurve i deres portefølje og NIS2 er en pæn stor kanon. Jeg tror der en stor del af alle de 5-700 leverandører af it til det offentlige, der får sig et sjok over pludselig at være omfattet af NIS2, hvis den kommentar er rigtig. Og os der skal implementere får nok at gøre med at styre leverandører i stedet for at højne sikkerhed, hvor der er nødvendigt. 0 0more_vert insert_linkKopier link 6 Klavs Klavsen 21. februar kl. 09:39 svarede Gert Madsen [5]Re: Centraliser arbejdetTing der giver god mening at bygge et system til at håndtere i København, kan fint ligge i et regneark på Læsø.Ja - og så gør de da bare det. Men de systemer de HAR BRUG FOR - men i mindre skala - kan de med fordel dele vedligehold og udgifter med andre der har fælles behov (aka. hvad Open Source gør :) 1 0more_vert insert_linkKopier link 5 Gert Madsen 21. februar kl. 09:36 svarede Klavs Klavsen [4]Re: Centraliser arbejdetkan ligeså vel løses af de samme komponenter, opsat på samme måde.Jo, men de behøver det ikke.Hvis man har 0-1 dranker på Læsø, er der ikke noget behov for IT, for at håndtere det.Ting der giver god mening at bygge et system til at håndtere i København, kan fint ligge i et regneark på Læsø. 0 0more_vert insert_linkKopier link 4 Klavs Klavsen 21. februar kl. 08:38 svarede Gert Madsen [3]Re: Centraliser arbejdetDer er altså stor forskel på behov og fornuft i IT-løsninger på Læsø og i København.Vi tænker nok på forskellige lag. Alt der er under kommunens applikationskode (databaser de benytter, webserver og loadbalancer komponenter, central login mv.) kan ligeså vel løses af de samme komponenter, opsat på samme måde. 90% af driftsarbejdet ligger i dette lag - og sikring af backup, recovery og overvågning af disse. Løser man det på en fælles måde, kan man dele arbejdsopgaven der ligger i at vedligeholde det. Det er det vi gør med vores open source løsning, og det virker for alle vores kunder - de er max 20% forskellige (og der hvor de er forskellige er faktisk altid delt med andre kunder).Derudover vil der være mange applikationer til borgere/medarbejdere - der ligeså vel kunne løses ved at den løsning der virker for København, blev forbedret til også at kunne opsættes til at understøtte læsø's behov. Det ville oftest være langt mere fornuftigt, men kræver selvfølgelig at kommunernes udviklere kan samarbejde. Her er Open Source modellen en god måde at samarbejde på. 0 0more_vert insert_linkKopier link 3 Gert Madsen 20. februar kl. 22:59 svarede Klavs Klavsen [1]Re: Centraliser arbejdet(og ensrettet) deres måde at løse de samme behov på - spares der en MASSE PENGE - fordi vedligehold og løbende forbedringer kan laves centralt og deles af alle.Der er altså stor forskel på behov og fornuft i IT-løsninger på Læsø og i København. 0 0more_vert insert_linkKopier link 2 Henrik P. Stougaard Nielsen 17. februar kl. 21:00Jeg har løbende fulgt medJeg har løbende fulgt med NIS2, før den var færdigbehandlet i EU, fordi jeg var interesseret i, om vi som hostingvirksomhed blev omfattet.Og jeg er enig i, at der aldrig har været tvivl om, at "hele virksomheden" er omfattet, hvis man laver noget, der fremgår på listen. "Delvist omfattet" eksisterer ikke som koncept i NIS2, og jeg ved ikke, hvor det forhv. ministerium havde den fortolkning fra.NIS2 opererer nærmest i sort/hvid: Der er en udtømmende liste over kritiske sektorer og kritisk infrastruktur i lovteksten: Enten er man omfattet, eller også er man ikke omfattet. Man kan ikke være "delvist omfattet". Blot man begiver sig ud i én af de oplistede kritiske funktioner, så er hele virksomheden omfattet af NIS2.Jeg måtte lige læse den del af loven, der dækker over det offentlige, og her må man altså indrømme, at EU for en gangs skyld har været ret klare i spyttet:"regardless of their size, this directive applies to [...] entities, where ... services are provided by [...] a public administration entity, at:central government level --> Statregional level ... --> RegionerMember states may apply this directive to local level --> KommunerDvs. enten er kommunerne omfattet, eller også er de ikke omfattet. Man kan ikke, i et dansk perspektiv, delvist omfatte kommuner. Enten er de helt omfattet, eller slet ikke. 10 0more_vert insert_linkKopier link 1 Klavs Klavsen 17. februar kl. 09:27Centraliser arbejdetSå vi ikke spilder penge på at hver kommune skal genopfinde den dybe tallerken.Dette centrale "IT solutions advisory board" - kunne så samtidigt med at den bygger tilstrækkeligt sikre løsninger, samtidigt inkludere Open Source stille og roligt, så kommunerne får øget deres sikkerhed OG fjernet deres leverandør lockin.Kommunerne skal så kunne få hjælp fra dette "IT solutions advisory board" - til at finde leverandører der kan hjælpe dem med at skifte til disse forbedrede løsninger.Når så alle kommuner har forbedret (og ensrettet) deres måde at løse de samme behov på - spares der en MASSE PENGE - fordi vedligehold og løbende forbedringer kan laves centralt og deles af alle. 20 0more_vert insert_linkKopier link'''
