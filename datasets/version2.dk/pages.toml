["https://version2.dk/artikel/kommunerne-mangler-ressourcer-mod-cyberangreb-det-kan-faa-alvorlige-konsekvenser"]
title = "Kommunerne mangler ressourcer mod cyberangreb: »Det kan få alvorlige konsekvenser« | Version2"
description = "97 procent af de kommunale it-chefer svarer i en rundspørge, at cybertruslen er større eller langt større end kommunens ressourcer til at håndtere den – samtidig opførdrer Kombit-chef til at se på den kommende NIS2-lovgivning."
full_description = '''@media (min-width: 978px) { #tmk--000quylV3i_EiM + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--0019ywU2xDDjSo + .kevel-skeleton { display: none; } }Kommunerne mangler ressourcer mod cyberangreb: »Det kan få alvorlige konsekvenser« It-sikkerhed11. december 2024 kl. 10:3716 kommentarer Administrerende direktør i Kombit Kristian Vengsgaard. Illustration: Kombit.97 procent af de kommunale it-chefer svarer i en rundspørge, at cybertruslen er større eller langt større end kommunens ressourcer til at håndtere den – samtidig opførdrer Kombit-chef til at se på den kommende NIS2-lovgivning. person Lasse Skovgaard Følg Du skal være logget ind for at følge et emne.Log indOpret konto Artiklen er ældre end 30 dage person Lasse Skovgaard Følg Du skal være logget ind for at følge et emne.Log indOpret kontoDer tegner sig et dystert billede af de danske kommuners digitale forsvarslinjer, som for nylig blev ramt af et større DDoS-angreb, skriver Kommunernes Landsforenings (KL) analysemagasin Momentum.Således svarer 97 procent af de kommunale it-chefer i en rundspørge, at cybertruslen er større eller langt større end kommunens ressourcer til at håndtere den.Artiklen fortsætter efter annoncenIt-chefernes svar bør give anledning til bekymring, fortæller professor i cybersikkerhed ved Aalborg Universitet Jens Myrup Pedersen til Momentum.»Kommunerne løser masser af opgaver, som er afhængige af, at der er adgang til it-systemerne. Det kan få alvorlige konsekvenser, hvis et angreb lammer den kommunale it-infrastruktur. Hjemmeplejere, der ikke kan se, hvilken borger de skal besøge, eller ikke kan se i systemet, hvilken medicin borgeren skal have. Så i sidste ende kan det handle om liv og død,« siger han til mediet.Kristian Vengsgaard, der er administrerende direktør i kommunernes it-fællesskab Kombit, advokerer samtidig i et opslag på Linkedin for, at kommunerne skal omfattes på lige fod med staten og regionerne i den kommende NIS2-lovgivning.»Kommunerne står lige nu ude for det nationale cyberforsvar og af det fremlagte NIS2 lovforslag skal det fortsætte. Det er svært at forstå logikken i!,« skriver han blandt andet.Artiklen fortsætter efter annoncenING/TechJobchevron_rightOpret jobannonceTilpasDen pointe er Jacob Herbst, der er forperson for regeringens nationale Cybersikkerhedsråd, enig i.»Helt principielt og konceptuelt giver det slet ingen mening at undlade at omfatte kommunerne som udgangspunkt. Dybest set lægger man fra regeringens side op til, at hegnet skal have forskellig højde, afhængigt af, om det er systemer i stat, region eller kommune, selvom det hele handler om borgernes data i offentlige systemer,« siger han til Momentum. Læs ogsåEfter måneders tovtrækkeri: Derfor skal kommunerne alligevel leve op til NIS2 Efter måneders tovtrækkeri: Derfor skal kommunerne alligevel leve op til NIS2 Ministers nye NIS2-krav: Energisektorens data skal blive i EU allerede fra marts Minister i kovending: Kommuner skal alligevel overholde NIS2 Alles Lægehus-hack breder sig: To andre virksomheder ramtDenne artikel TDC-nedbrud får telebranchen til at lede efter ny sikkerhedsløsning Flere end 85.000 cyberangreb målrettet rumænsk præsidentvalg Teleinfrastruktur i USA ramt af cyberspionage: Metadata på »et stort antal« amerikanere stjåletFokusV2 Security | KBH & AarhusEmnerIt-sikkerhedFølgDu skal være logget ind for at følge et emne.Log indOpret kontoKommunerFølgDu skal være logget ind for at følge et emne.Log indOpret kontoNIS2FølgDu skal være logget ind for at følge et emne.Log indOpret kontoOmtalte virksomhederKombit, Kommunernes Landsforening16 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 16 Sigurd Cairn 12. december 2024 kl. 13:16 svarede Klavs Klavsen [15]Re: Problemet er reelt at kommunerneHelt, helt enig.det andet var også bare for at sige at kommunerne i deres aktuelle situation er nødt til at prioritere benhårdt.Jeg har selv vejledt små og mellemstore kommuner om forskellige ting og er blevet lidt rystet over deres kompetenceniveau (fx at skulle forklare en IT chef hvad en DMZ er), så jeg er HELT og aldeles enig :)Mvh SIgurd 2 0more_vert insert_linkKopier link 15 Klavs Klavsen 12. december 2024 kl. 10:35 svarede Sigurd Cairn [14]Re: Problemet er reelt at kommunerneOg skal man prioritere mellem skimmelsvamp på skoler, manglende pædagoger og hjemmehjælpere her og nu - og at undgå noget der KAN ske - er prioriteringen forståelig. Uklog, men forståelig.Jeg vil mene at problemet mere er at de "forsøger at løse alt selv" - istedet for at samarbejde om at løse et problem alle kommuner har (undtagen København der er stor nok til at have kapaciteten).Men den slags nytænkning kræver selvfølgelig ressourcer.. Derfor jeg tænkte at det måske var nemmere at køre det via KOMBIT samarbejdet - hvis man kan få det til at fungere til "fælles driftsafdeling". De kunne sågar outsource (som de jo gør i dag) - hvis bare de SIKRER at alt drives på kommunens udstyr og uden nogen bindinger - således at det kan gen-udbydes som loven kræver, uden at det bliver vildt dyrt at skifte.Det ville dog kræve en "tæt juridisk aftale" for at sikre det tænker jeg, hvis man outsourcer istedet for "bare" at have sin egen driftsafdeling - som så evt. hyrer ekstern hjælp som relevant. 4 0more_vert insert_linkKopier link 14 Sigurd Cairn 12. december 2024 kl. 10:29 svarede Steffen Friis [4]Re: Problemet er reelt at kommunerneDet er ikke at kommunerne ikke gider, men at de ikke har- og får pengene til alle de opgaver som stat/regeringer lægger over på dem. Og skal man prioritere mellem skimmelsvamp på skoler, manglende pædagoger og hjemmehjælpere her og nu - og at undgå noget der KAN ske - er prioriteringen forståelig. Uklog, men forståelig. 4 0more_vert insert_linkKopier link 13 Sigurd Cairn 12. december 2024 kl. 10:16 svarede Klavs Klavsen [2]Re: Lav et driftssamarbejdeHelt enig 1 0more_vert insert_linkKopier link 12 Peter Binderup 12. december 2024 kl. 10:13 svarede Anders Johansen [10]Re: Problemet er reelt at kommunerneok i den sammenhæng er jeg så enig med Steffen og dermed implicit uening med mig selv :-) 1 0more_vert insert_linkKopier link 11 Klavs Klavsen 12. december 2024 kl. 10:12 svarede Anders Johansen [8]Re: Problemet er reelt at kommunerneDet kan jeg omvendt godt genkende. Jeg har kommuner hvor der end ikke kan bevilges penge til at sikre kommunens eksternt-vendte systemer med noget så simpelt som multi-faktor autentificering.Problemet er at de ikke har råd til at levere ordentlig IT i de fleste kommuner.Samarbejdede man driftsmæssigt - ville ALLE automatisk kunne få langt bedre løsninger, til de samme penge.At opsætte f.ex. keycloak (open source central authentication) - til at sikre 2-factor - og f.ex. Netbird (open source vpn - der understøtter keycloak som auth) - så ville man have simpel medarbejder vpn - uden licensomkostninger.. og drevet vha. f.ex. Puppet (system konfiguration - gitops baseret) - så ville en central afdeling simpelt kunne drive et sådant VPN setup hos hver kommune - hvor over 90% af arbejdet var delt og derfor gavnede alle.Det behøver ikke at være så svært - men kommunerne har svært ved at tiltrække og have råd til at betale lønnen, for de rigtige kompetancer - det ville også blive nemmere når man samlede opgaven. 2 0more_vert insert_linkKopier link 10 Anders Johansen 12. december 2024 kl. 10:10 svarede Peter Binderup [9]Re: Problemet er reelt at kommunerneMen det er altså ikke IT chefen der nødvendigvis er stopklodsen der - det er måske mig der læser det Steffen skriver på en forkert måde.Jeg læser det Steffen skriver som at IT-chefen gerne vil, men at stoppet kommer længere oppefra, typisk af økonomiske årsager. 3 0more_vert insert_linkKopier link 9 Peter Binderup 12. december 2024 kl. 10:07 svarede Anders Johansen [8]Re: Problemet er reelt at kommunerneMen det er altså ikke IT chefen der nødvendigvis er stopklodsen der - det er måske mig der læser det Steffen skriver på en forkert måde. 0 1more_vert insert_linkKopier link 8 Anders Johansen 12. december 2024 kl. 10:02 svarede Peter Binderup [5]Re: Problemet er reelt at kommunerneDet vil jeg da gerne se noget evidens for. For det er da noget af en påstand, og absolut ikke et billede jeg kan genkende fra min færden i kommuneland.Det kan jeg omvendt godt genkende. Jeg har kommuner hvor der end ikke kan bevilges penge til at sikre kommunens eksternt-vendte systemer med noget så simpelt som multi-faktor autentificering. 2 0more_vert insert_linkKopier link 7 Klavs Klavsen 12. december 2024 kl. 08:57 svarede Jesper Frimann [3]Re: Lav et driftssamarbejdeMan kunne jo kalde det kommune data f.eks.LOL. Det kan godt være at det var hvad KMD var engang - inden det blev privatiseret og senere solgt. Det vigtigste er den fulde transparens og intet spild på at "flytte udgifter rundt" eller andet bureaukrati. Så det kommer så tæt på en afdeling som man kan komme - når den skal lave ting for alle kommuner. Det ville samtidigt gøre at de kunne samle deres IT drift i få lokationer (stadig have flere for redundans) - driftet af afdelingen. Alt sammen ville sparre ressourcer, og en samlet større afdeling ville have musklerne til at levere bedre løsninger, og have flere penge til at gøre de enkelte løsninger bedre for alle - da alle bidrager med hvad de ellers før ville have brugt på at få deres egen løsning. Sund fornuft, hvis det udføres rigtigt, hvis du spørger mig :)SIT er "sådan set" bygget på det samme princip - men et bindende krav IMHO må og skal være at de er istand til at gøre det billigere end at kommunerne gjorde det selv.. (og her er det jo altid svært at sætte en pris på højere sikkerhedsniveau ifht. hvad de havde der jo ikke var tilstrækkeligt). Er de ikke det, har de taget nogen forkerte valg - som jeg mener at SIT har (set udefra gennem deres kunders øjne og hvad der har været i pressen).Jeg så helst at ledelsen af den afdeling lå i kommunerne stadigvæk - så det blev holdt tæt på - og ikke bare blev et nyt SIT eller KMD. Her tænker jeg demokratisk ledet virksomhed kunne bidrage til at undgå mange af de faldgruber. aka. en kommunal bestyrelse der direkte arbejder med "product owner" i afdelingen måske? 0 0more_vert insert_linkKopier link 6 Kasper Kristiansen 12. december 2024 kl. 08:56 svarede Klavs Klavsen [2]Re: Lav et driftssamarbejdeKommunerne er igang med at prøve noget lignende: KommuneCERT | Kommunernes fælles cybersikkerhedsenhedMan vil gerne have noget i stil med DCISSund, og så må man se hvor mange opgaver det kan løfte. 2 0more_vert insert_linkKopier link 5 Peter Binderup 12. december 2024 kl. 05:58 svarede Steffen Friis [4]Re: Problemet er reelt at kommunerneDet vil jeg da gerne se noget evidens for. For det er da noget af en påstand, og absolut ikke et billede jeg kan genkende fra min færden i kommuneland. 1 3more_vert insert_linkKopier link 4 Steffen Friis 11. december 2024 kl. 20:43Problemet er reelt at kommunerneProblemet er reelt at kommunerne ofte ikke vil prioriterer IT-sikkerhed. IT-Cheferne vil rigtig gerne have mere moderne og tidssvarende løsninger men når man så efterspørger pengene, får man et nej. Det er simpelthen ikke i top 100 over ting kommunerne generelt gider bruge penge på. 5 1more_vert insert_linkKopier link 3 Jesper Frimann 11. december 2024 kl. 18:40 svarede Klavs Klavsen [2]Re: Lav et driftssamarbejdeDu mener sådan et rigtigt fagligt velfunderet IT selskab?Man kunne jo kalde det kommune data f.eks.//Jesper 2 0more_vert insert_linkKopier link 2 Klavs Klavsen 11. december 2024 kl. 11:30Lav et driftssamarbejdeÆrlig talt BURDE kommunerne indgå i et decideret driftssamarbejde.. måske via KOMBIT (som jo i dag kun driver 'enkelt systemer') - således at mange flere systemer kunne styres af en fælles drift (som er tæt på - så det ikke bliver en service man skal købe som SIT) - men som en fælles afdeling - man kan tage en snak med og som godt selv kan finde ud af at "fordele sol og vind lige ifht. udgiftsfordeling". IMHO ville det give langt flere muskler til at få styr på sikkerheden.Det gør vi en i vores eget firma - og det fungerere faktisk fedt - og firmaer har ikke noget i mod at vi prioriterer opgaver til "fælles fordel" - og kan så fordele udgiften og sikre at alle brugere af den for del i den. Det kræver at man lader den "driftsafdeling" tage ansvaret for hvordan de løser deres opgaver - for så kan de finde løsninger der løser samme opgave for alle - og dermed dele udgifterne og nå langt mere. Det er sådan det lykkedes os at dele optil 90% af opgaverne vi løser for kunder - og vi kan dele det fordi vi også beholder copyright og frigiver alt arbejdet som open source (i modsætning til at fungere som konsulent hvor copyright er kundens).Jeg tilbyder, som altid, gerne kommunen/kombit gratis rådgivning om måder at få sådan en fælles driftsafdeling (som IKKE skal fakturere kommunerne - det klares ved omkostningsdeling bagi) til at fungere - hvis de mener min ekspertise har værdi.Det vil trods alt også gavne mig som borger :)Så lidt nytænkning please.. :) 7 0more_vert insert_linkKopier link 1 Mikkel Larssen 11. december 2024 kl. 11:10Kommunerne er omfattet, blot ikke 100%...Jeg undres lidt når man kan læse at kommunerne ikke er omfattet af NIS2. Mig bekendt, er kommunerne omfattet i forhold til de samfundskritiske ydelser de leverer, eksempelvis sundhedsområdet. Jeg forstår der kan være et ønske om økonomisk støtte til opgaven men det er vel en anden debat? Mange kommuner gør rigtigt meget godt og vil være godt på vej i forhold til at opfylde minimumsforanstaltningerne i direktivet som dansk lovgivning forventes at læne sig op ad. Hvorfor ikke starte med en GAP analyse ude i kommunerne, få kortlagt mulighederne for forbedringer og derefter stille begrundede krav til budgetterne. Lige pt. er modstanden til at starte på opgaven funderet i økonomi frem for at skabe et overblik, risikovurdere behovet for ekstra foranstaltninger og så sætte kroner og øre på de nødvendige investeringer. Uanset hvad er opgaven ikke spildt, så hvorfor ikke starte processen, måske er det hele ikke så skidt/dyrt som nogle tror… 2 0more_vert insert_linkKopier link'''
