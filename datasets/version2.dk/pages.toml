full_description = '''@media (min-width: 978px) { #tmk--000jCZHoJGKBxw + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001mjke1p8NtT0 + .kevel-skeleton { display: none; } } Dette indlæg er alene udtryk for skribentens egen holdning. KommentarGlem Deepseek: Tech-giganterne kæmper for et feudalsamfund med Trump som kejser Big Tech18. februar kl. 11:1120 kommentarer Her ses helt unge Peter Thiel og Elon Musk, mens de arbejdede sammen i PayPal. Illustration: Paul Sakuma/AP/Ritzau Scanpix.Danske virksomheders mest følsomme oplysninger kan ikke tiltros et amerikansk regime, hvor retsordenen er sendt til tælling. Peter Christian Bech-Nielsen Redaktionschef / Tech-korrespondent Følg Du skal være logget ind for at følge et emne.Log indOpret konto Lyt til artiklen oplæst af en stemme klonet på Ingeniørens Henrik Heide Peter Christian Bech-Nielsen Redaktionschef / Tech-korrespondent Følg Du skal være logget ind for at følge et emne.Log indOpret kontoI takt med Donald Trumps tornado af præsidentielle dekreter og Elon Musks datajagt og effektiviseringsmission i den føderale stat, må vi i Europa stille os selv nogle potentielt skæbnesvangre spørgsmål: Hvordan kan vi stole på, at vores offentlige it-systemer bygget med amerikansk cloud og software kan beskytte borgernes og statens mest følsomme data? Kan danske virksomheder regne med, at intellektuel ejendom og kritiske patenter på nogen måde er beskyttet i USA's nye vakkelvorne retsorden? PLUS-abonnement IDA-adgang Gratis adgang i 10 dageTegn et gratis prøveabonnement og få adgang til alt PLUS-indhold på Ing, Version2 og Radar, helt uden binding eller betalingsoplysninger.Få en forlænget erhvervsprøveMed et erhvervsabonnement kan du få en forlænget prøveperiode. Indtast e-mail * remove_circle Indtast venligst din e-mail. Indtast venligst en valid e-mail. Brug venligst en rigtig email adresse. En brugerkonto med denne e-mail findes allerede. Log ind Du accepterer vores abonnementsbetingelser for PLUS, når du tegner et abonnement eller prøveabonnement på PLUS. Læs betingelserne her. Du skal acceptere disse betingelser før du kan fortsætte. Du accepterer Teknologiens Mediehus’ brugerbetingelser og persondatapolitik. Du accepterer derudover følgende kontaktbetingelser: Teknologiens Mediehus må lejlighedsvis kontakte dig om arrangementer, konkurrencer, analyser, nyheder, job, undersøgelser og tilbud via e-mail. I e-mails fra Teknologiens Mediehus kan der forekomme markedsføring fra samarbejdspartnere.Du kan til enhver tid indstille dine kontaktpræferencer, under menupunktet ‘Tilladelser & Services’ på din ING/Profil. Du skal acceptere disse betingelser før du kan fortsætte.Har du allerede et PLUS-abonnement? Log ind eastVelkommen til PLUSDa du er ved at tilmelde dig en gratis prøve beder vi dig hjælpe os med at gøre vores indhold mere relevant for dig, ved at vælge et eller flere emner der interesserer dig. Vælg mindst et emne * Privacy & compliance Cybersikkerhed IT-ledelse Dataindsamling Gaming Udvikling Digitalisering Netværk & IT-infrastruktur AIVælg venligst ét emne før du fortsætter.Du skal vælge en adgangskode til når du fremover skal logge ind på din brugerkonto. Vælg adgangskode * visibility 1 stort bogstav 8 tegn minimum Leave this field blank remove_circleDit medlemskab giver adgangSom medlem af IDA har du gratis adgang til PLUS-indhold, som en del af dit medlemskab. Fortsæt med MitIDA for at aktivere din adgang til indholdet. Fortsæt med MitIDAOplever du problemer med login, så skriv til os på websupport@ing.dkAbonnementsfordelevpn_keyFuld adgang til Ing.dk, Version2 og RadarFuld digital adgang til PLUS-indhold på Ing.dk, Version2 og Radar, tilgængeligt på din computer, tablet og mobil.draftsKuraterede nyhedsbreveDet seneste nye fra branchen, leveret til din indbakke.thumb_upAdgang til debattenDeltag i debatten med andre kloge læsere.20 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 20 Baldur Norddahl 21. februar kl. 09:52 svarede Allan Olesen [18]Re: Hvorfor blackliste deepseek?Kan du uddybe? Sidst jeg så det diskuteret, blev det hævdet, at Deepseek giver anderledes - og efter vestlig opfattelse mere korrekte - svar vedr. kinesiske forhold, når man kører den lokalt:Der er meget få der har en computer der kan køre den rigtige DeepSeek R1. Det kræver omkring 768 GB ram for en 8 bit kvant og selv da er det ekstremt langsomt.Men lidt forvirrende, så har de udgivet en række mindre modeller, som de også kalder DeepSeek R1. Disse modeller er dog slet ikke baseret på samme grundmodel. Den store model er en modificeret DeepSeek V3. De mindre er modificeret Llama og Qwen. Da Llama er amerikansk (det er Meta / Facebook) så er dens bias derefter. Qwen er derimod også kinesisk. Så det afhænger af hvilken præcis model du har downloadet.Måske er ideen ved at de har både Llama og Qwen at du dermed kan vælge hvilket bias du ønsker. I Kina skal man sikkert bruge Qwen.De kalder de mindre modeller for R1 Distilled fordi de er modificeret ved at den rigtige R1 har trænet den mindre model til at tænke ligesom den selv. 4 1more_vert insert_linkKopier link 19 Klavs Klavsen 21. februar kl. 09:42 svarede Allan Olesen [18]Re: Hvorfor blackliste deepseek?Deepseek giver anderledes - og efter vestlig opfattelse mere korrekte - svar vedr. kinesiske forhold, når man kører den lokaltDet vil da være super. Det ændrer ikke på at modellen jo kun ved det, som den er fodret med - og vi ved ikke hvad det er, og det har deepseek forfatterne IKKE delt.Det er en STOR svaghed i alle AI modellerne man kan benytte desværre og derfor IMHO ikke 100% open source.Deepseek er stadig nok den bedste og "mest frie" mulighed der findes for nuværende. 5 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 18 Allan Olesen 21. februar kl. 09:03 svarede Klavs Klavsen [7]Re: Hvorfor blackliste deepseek?Den er stadig bias'ed dog mht. kinesiske spørgsmål mm.Kan du uddybe? Sidst jeg så det diskuteret, blev det hævdet, at Deepseek giver anderledes - og efter vestlig opfattelse mere korrekte - svar vedr. kinesiske forhold, når man kører den lokalt:https://ing.dk/artikel/er-deepseek-bare-en-racistisk-onkel-vi-skal-leve-med#comment-2594637 1 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 17 Klavs Klavsen 21. februar kl. 08:46 svarede Peter Valdemar Mørch [16]Re: Det er op ad bakke for Europa...Mon asiatiske producenter af mobiltelefoner er ok med at levere andre OS end USA kontrolleret Androidøhh hvad? LineageOS er AOSP (dvs. Open Source Android). Xiaomi og andre producenter bygger f.ex. i dag deres EGET OS til deres telefoner - baseret på open source android - og så vedligger de google services (for ellers har de, samme problemer som jeg nævner - og det giver google en magt - de BURDE fratages som jeg også foreslog hvordan man kunne gøre).Jeg kan garantere dig for at hvis den magt blev frataget google (ved at den binding til google services implementation blev gjort ulovlig, så microg (open source udgaven af google services) fungerede med alle apps uden at man skal snyde dem, så ville asiatiske producenter hoppe derover med det samme - eller ihvertfald give brugeren valget - under opsætning.Det er en unfair konkurrence EU desværre ikke har opdaget endnu - og nok fordi den laves under undskyldningen "sikkerhed" - hvorefter google tvinger konstant location tracking af alle brugere mm. ned i halsen på os.Istedet for at spilde tid på google - ville det være langt bedre løst ved bare at KRÆVE at alle apps i EU - SKAL virke med mindst én open source implementation af "eksterne afhængigheder på telefonen" . 4 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 16 Peter Valdemar Mørch 21. februar kl. 08:35 svarede Klavs Klavsen [15]Re: Det er op ad bakke for Europa...Mon asiatiske producenter af mobiltelefoner er ok med at levere andre OS end USA kontrolleret Android? 0 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 15 Klavs Klavsen 19. februar kl. 13:18 svarede Morten Laier [13]Re: Det er op ad bakke for Europa...Alle med en mobiltelefon, måske med undtagelse af en Nokia 3210, er i kløerne på de amerikanske tech-giganterFaktisk ikke. De fleste Android telefoner kan installeres med open source Android distributioner (såsom LineageOS) og MicroG (re-implementation af google services - uden den konstante ping af lokation til google mm.).Det har været super godt i mange år for mig - og med lidt "trælse men nødvendige" hacks, har jeg fået "snydt" så netflix mm. jeg har betalt for virker også. Bank apps mv. virker bare - eneste jeg ikke kunne få til at du - var mcdonalds app (der åbenbart har vildt høje krav til 'telefonens sikkerhedsniveau' - som google vurderer det.Vi BURDE starte med at stille krav om at det var ULOVLIGT at forhindre folk i at benytte ens services(apps) på et open source operativsystem. Det ville gøre det super nemt - og telefoner som FairphoneOS ville helt sikkert så turde begynde at levere "by default" - med en google-fri telefon. 19 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 14 Kristian Glejbøl 19. februar kl. 12:50 svarede Morten Laier [13]Re: Det er op ad bakke for Europa...Kan vi risikere, at de resterende ikke leveres medmindre vi indordner os efter USA i Grønlands-spørgsmålet? Kan vi i samme ombæring risikere, at USA ikke vil levere reservedele til samme fly?Med ham den orange "konge" er alt vel desværre tænkeligt. USA har tabt al troværdighed, Europa må rykke sammen i bussen. Afskriv de skide F35'ere og få indkøbt noget Europæisk hardware (Gripen) fra et land man kan stole på. 28 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 13 Morten Laier 19. februar kl. 12:05Det er op ad bakke for Europa...Tak for en artikel, der giver én noget at tænke over, for hvordan kan vi frigøre os fra tech-giganternes omklamring?Alle med en mobiltelefon, måske med undtagelse af en Nokia 3210, er i kløerne på de amerikanske tech-giganter, så allerede der er vi på halen.Og hvordan skal europæiske lande forholde sig til udveksling af efterretninger med USA? Kan vi stole på deres efterretninger, og kan vi stole på, at det vi leverer til dem, ikke gives videre?Hvordan med vores nye kampfly?Kan vi risikere, at de resterende ikke leveres medmindre vi indordner os efter USA i Grønlands-spørgsmålet?Kan vi i samme ombæring risikere, at USA ikke vil levere reservedele til samme fly?Der er flere ubekendte i ligningen, end jeg har lært at regne med, når det gælder vores fremtidige relationer til USA. 13 1more_vert insert_linkKopier link 12 Claus Bruun 19. februar kl. 11:32 svarede Frithiof Andreas Jensen [10]Re: Ja takDet er en rigtig god kommentar - kan vi overhovede stole på, at vi kan anvende vores dyrt indkøbte amerikanske isenkram autonomt udfra vores egne behov. Jeg tvivler. 14 0more_vert insert_linkKopier link 11 Peter Christian Bech-Nielsen 19. februar kl. 10:00 svarede Jens D Madsen [5]Re: Hvorfor blackliste deepseek?Jeg mener heller ikke, at man skal blackliste Deepseek i bred forstand. Men ministerier og Folketinget er nødt til at være relativt risikoaverse. I en mere almen forstand er det super spændende at eksperimentere med Deepseek, netop fordi det er en åben model med mulighed for at køre den lokalt. Og det indgyder håb i forhold til, at Europa ikke er hægtet helt og aldeles af AI-udviklingen, når en konkurrencedygtig model kan trænes med begrænsede ressourcer og andenrangsmikrochips.Bh. Peter 1 0more_vert insert_linkKopier linkSkrevet på Radar 10 Frithiof Andreas Jensen 19. februar kl. 09:25 svarede Klavs Klavsen [1]Re: Ja takDet samme gælder det millitære isenkram. F-35 kommer med logistik software baseret på et "cloud" system ALIS / ODIN. Det kan jo være sådan at det ikke er muligt at planlægge en F-35 mission imod rusland efter at Elon Musk har haft snitterne i kagen. 21 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 9 Baldur Norddahl 18. februar kl. 20:07 svarede Jens D Madsen [5]Re: Hvorfor blackliste deepseek?Vil ikke være bedre at opsætte en deepseek kopi, der anvender deepseeks åbne kode og data, men som ikke er placeret i Kina, og ikke har noget at gøre med den kinesiske regering?Det kan du og det har mange gjort. Eksempelvis så kører Microsoft deres egen DeepSeek server på Azure. Denne kan danske virksomheder leje sig ind på. Så man har fine muligheder for at bruge DeepSeek uden risiko for at data ender i Kina. Under de nuværende politiske forhold, så ville det dog være endnu finere at finde en server i Europa som er uden for amerikansk kontrol.Men når man taler om at blackliste DeepSeek, så tænkes der ofte på den mobiltelefon app, som mange installere. Jeg vil også være ret betænkelig ved at installere en kinesisk app på min telefon. Så det har jeg undladt, selvom jeg bruge DeepSeek i andre sammenhænge. 23 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 8 Peter Nielsen 18. februar kl. 16:30Donald "in four years, you don'tDonald"in four years, you don't have to vote again we'll have it fixed so good, you're not gonna have to vote"(https://www.youtube.com/results?search_query=in+four+years%2C+you+don%27t+have+to+vote+again+we%27ll+have+it+fixed+so+good%2C+you%27re+not+gonna+have+to+vote)Trump Og for at bevare det afsluttende spørgsmål "Hvem stoler vi på?" vil jeg citere Tony Montana: "Who do I trust? Me!". Men kompromiset må ene og alene være noget, der kommer fra EU og intet andet. PUNKTUM 28 3more_vert insert_linkKopier link 7 Klavs Klavsen 18. februar kl. 15:21 svarede Jens D Madsen [5]Re: Hvorfor blackliste deepseek?Forbyder Deepseek det?Deepseek deler alt fra modellen og softwaren til at køre den som open source - så man kan frit køre deepseek på egne servere (kræver ikke meget) - og firewall'e den så den ikke kan snakke med kina :)Den er stadig bias'ed dog mht. kinesiske spørgsmål mm. - som man kan have meget svært ved at ændre på, uden at bygge en ny model (og skulle have det nødvendige datasæt og computerkraft - som er enorm - selvom den er ~10x mindre end hvad openai skal bruge for at udvikle deres modeller) 20 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 6 Per Holm 18. februar kl. 15:07 svarede Jonas Høgh [4]Re: Dejligt, at I tager bladet fra munden... anklagede Hr. Musk for at sympatisere med en ideologi, vi ofte forbinder med en af Østrigs mest kendte kunstmalere i det tidlige 20. århundrede.Kommer ikke lige i tanker om hvilken kunstmaler det skulle være ...Du tænker vel ikke på en stats- og hjemløs forfatter der lige i sidste øjeblik før kanzler-valget efter at have prøvet sig frem i de fleste andre tyske stater opnåede statsborgerskab i fristaten Braunschweig? 3 8more_vert insert_linkKopier linkSkrevet på Radar 5 Jens D Madsen 18. februar kl. 15:'''
