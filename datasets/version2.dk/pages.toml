ler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 14 Frank Jumppanen Andersen 28. februar kl. 17:54 svarede Kjeld Flarup Christensen [13]Re: Vil Microsoft gøre det?Men kan man frasælge licenserneHvis der er 'lukkede' services i Azure, så kræver det selvfølgelig at MS vil sælge licenser til disse også. Rigtigt mange services fra MS cloud kan du jo vælge at køre on-prem (baseret på egen licens) - og dermed også i private cloud setup hos en udbyder. 0 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 13 Kjeld Flarup Christensen 28. februar kl. 15:20 svarede Frank Jumppanen Andersen [12]Re: Vil Microsoft gøre det?Løsning vil sikkert blive at de frasælger aktiviteter / datacentre så de ikke længere er underlagt Amarikansk kontrolleret lovgivning...Men kan man frasælge licenserne, så de ikke kan lukkes fra USA? 2 0more_vert insert_linkKopier link 12 Frank Jumppanen Andersen 28. februar kl. 11:01 svarede Jørgen Svendsen [11]Re: Vil Microsoft gøre det?så begynder alle andre lande at se skriften på væggen....derfor: Nej - MS lukker ikke DK ned, da det vil være dødsstødet for al deres forretning udenfor USA!Løsning vil sikkert blive at de frasælger aktiviteter / datacentre så de ikke længere er underlagt Amarikansk kontrolleret lovgivning... 10 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 11 Jørgen Svendsen 28. februar kl. 08:29Vil Microsoft gøre det?Ja det vil de. De vil kæmpe i mod, men i sidste ende ser de det amerikanske marked som et vigtigere marked end det europæiske.Microsoft vil gå til domstole mv. for at for sådan en ordre kendt ugyldig, for de ved godt at hvis de gøre det mod ét land, så begynder alle andre lande at se skriften på væggen.Yderligere så kan EU se det som en krigserklæring, os indefryse Microsofts værdier i Europa + evt. andre amerikanske virksomheders værdier. 29 1more_vert insert_linkKopier link 10 Jørgen Svendsen 28. februar kl. 08:22 svarede Jens D Madsen [4]Re: Det er os der skal lukke ned for MicrosoftStaten bør kun bruge krypterede cloudtjenester, hvor cloudtjenesten ikke har adgang til andet end krypterede data. De må ikke have mulighed for adgang til data, eller at kunne udspionere via dem. Er det offentlige data, som alle har adgang til, så kan man til nød godt bruge ukrypterede cloudtjenester. Men ikke til fortrolige oplysninger.Det findes skam allerede, men det betyder at alt hvad der hedder cloud computing bliver irrelevant, det eneste clouden kan bruges til er storage. 8 0more_vert insert_linkKopier link 9 Stig Libori 28. februar kl. 07:38 svarede Jens D Madsen [4]Re: Det er os der skal lukke ned for MicrosoftEtE kryptering er bestemt en god mulighed. Men det er ikke det, det grundlæggende problem handler om. 14 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 8 Jens Frederik Dalsgaard Nielsen 28. februar kl. 07:27 svarede Jens D Madsen [4]Re: Det er os der skal lukke ned for Microsoftom data er krypteret eller ej r er vel ligegyldigt hvis de lukker for adgang til data 23 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 7 Erik Petersen 28. februar kl. 06:34Så lovli som movliEr der ikke forskel på microsoft usa og microsoft Europa?Hvis vi er derude at de lukker for Windows så kan man komme på banen igen efter et besøg på pirate bay, behøver vel ikke være så bekymret for amerikansk lov længere. 0 17more_vert insert_linkKopier linkSkrevet på Ingeniøren 6 Nis Schmidt 28. februar kl. 03:43I tager helt fejl af MSMen det er rigtig god idé IKKE at bruge deres cloud-løsninger (pengemaskiner) - en enkelt filserver kan klare de dovnes/selvfede danskeres backup.Jeg har brugt MS siden MS-DOS 2.0 og Windows 1.0 + (Open)VMS, RSX11M+ m.m., og SV, BSD og 2-3 slags Linux (UNIX). Jeg bliver nok på Windows 10, 11, 12 ... XX (for den platform kan køre de fleste andre) med passende open source pakker (fx LibreOffice, LO), jeg stoppede med MSO allerede ved NT 4.0 fordi office 2.0 var noget rod.Det burde være muligt at porte tilpasninger til LO - internationalt, så man er knap så afhængig af online office - som også har svært med i18n;-). Man har næppe seriøst brug for skyen og de rodede features. 1 15more_vert insert_linkKopier link 5 Allan Dukat 27. februar kl. 21:53Helt forkert!»EU-kommissionen skal beslutte, om det her er en farlig vej. Skal vi ikke få gang i nogle europæiske projekter, så vi kan få noget konkurrence? Jeg mener ikke, at Microsoft skal ud. Men der skal skabes noget konkurrence, for det vil styrke os.«Helt forkert, Microsoft skal ud uanset hvad. I modsat fald så vil Microsoft sænke priserne indtil konkurrenterne er gået falit, hvorefter priserne stiger igen.Microsoft har ikke altid været alene på markedet, men staten, regioner og kommuner har valgt det billigeste, og nu er der ingen konkurrenter tilbage, så derfor ser vi store prisstigninger nu. 44 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 4 Jens D Madsen 27. februar kl. 20:41 svarede Stig Libori [2]Re: Det er os der skal lukke ned for MicrosoftVi skal ud af de amerikanske cloudtjenester, fordi USA udspionerer os via dem. Hvor svært kan det være?Staten bør kun bruge krypterede cloudtjenester, hvor cloudtjenesten ikke har adgang til andet end krypterede data. De må ikke have mulighed for adgang til data, eller at kunne udspionere via dem. Er det offentlige data, som alle har adgang til, så kan man til nød godt bruge ukrypterede cloudtjenester. Men ikke til fortrolige oplysninger. 20 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 3 Jens D Madsen 27. februar kl. 20:18Det offentlige bør anvende flere udbydere samtidigtJeg anvender som eksempel to uafhængige git providers, for at være sikker på, at ikke gøre mig afhængigt af en enkelt. Og jeg mener, at det er meget vigtigt, når man gemmer data i skyen - at altid anvende to uafhængige udbydere, i to forskellige lande, så at f.eks. Trump ikke kan beordre begge på samme tid at lukke for adgangen til Danmark. Det kan være et problem med Microsoft løsninger, at de ikke er udviklet til andet end en udbyder, og man kan ikke sætte dem op til at som standard altid bruge to eller flere. Mit indtryk er, at en kontrakt med Microsoft er en aftale om total Microsoft afhængighed for evig. Og det undrer mig faktisk, at USA selv tør bruge Microsoft. Indenfor hardware området vil det ikke være muligt. Der er krav om, at der skal være konkurenter til f.eks. Intel, der kan levere hvis Intel ikke kan. 21 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 2 Stig Libori 27. februar kl. 19:42Det er os der skal lukke ned for MicrosoftTypisk dansk at tro, at vi ikke kan undvære det. Det lyder som russisk naturgas inden invasionen.Vi skal ud af de amerikanske cloudtjenester, fordi USA udspionerer os via dem. Hvor svært kan det være?Nextcloud er pt. det bedste bud på en vej ud af lortet. Sæt i gang, og gør det hurtigt.Og nej, jeg siger ikke, at det vil være let. Men det skal gøres, og det skal gøres hurtigt. Fordi det gør mindst ondt, hvis vi selv tager styringen. 60 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Maciej Szeliga 27. februar kl. 18:39Lukker en dansk virksomhed......for sine aktiver i et land når folketinget er enige om det ?Vi har nylige eksempler fra danske virksomheder i Rusland... Har Microsoft råd til at blive blacklistet på USA's marked for at holde Danmark kørende ? 28 1more_vert insert_linkKopier linkSkrevet på Ingeniøren"
