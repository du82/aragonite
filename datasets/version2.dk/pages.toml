eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 15 Morten Fordsmand 19. februar kl. 09:48 svarede Henning Kjær [7]Re: Hvis der er et budgetEn anden model erHvis een kvinde kan føde eet barn på ni måneder:Hvor mange børn kan 27 kvinder føde på 3 måneder? 1 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 14 Hans Dybkjær 19. februar kl. 06:02 svarede Henning Kjær [13]Re: Hvis der er et budgetDet er jeg enig i. Dijkstra skrev ret morsomt om det umulige i bare at kyle ekstra folk på i hans Selected Writings (1982). Som det fremgår, så jeg spørgsmålet om de 700 M kr som hvordan anvender vi dem bedst, hvis vi ser det som et budget? Ikke dermed være sagt at 700 M er det rigtige, det kunne også være for meget eller for lidt. Helt sikkert, udvikling og drift kræver vidt forskellige kompetencer.Hvis man laver et program, og udviklerne så går deres vej, er programmet dødt. Det kan hurtigt kræve fx 10 % af udviklingsprisen om året fortsat at holde det levende, at tilpasse det løbende. Vel at mærke hvis man har fat i en række af de oprindelige udviklere. Sætter man nye udviklere på, bliver det hurtigt meget dyrere - essentielt er de nødt til at forstå koden og systemet forfra. "Nye" er her i forhold til projektet, det gælder også meget erfarne udviklere.Pointen er mere at der løbende vil være tilpasning, fejlrettelser og videreudvikling nok til at holde en udviklergruppe beskæftiget. Om den teknisk er placeret hos kunden eller hos en ekstern leverandør, er mindre vigtigt. Det væsentlige er at gruppen er stabil over tid. 4 0more_vert insert_linkKopier link 13 Henning Kjær 19. februar kl. 02:37 svarede Hans Dybkjær [11]Re: Hvis der er et budgetMin forsimpling med Grøftegravningen kommer ind der hvor det postuleres at med en bestemt lang eller kort indsats af mænd/personer kan der forudsættes en løsning, men en mand er ikke en mand, det kræver mænd/kvinder med de rette (mange forskellige) kvalifikationer. Man kan få den tanke at mange store projekter begynder med den forsimpling, at bare vi afsættet et tilfældigt stort antal personer så går det godt indenfor budgettet.Det kan være OK at nogle af projektudviklerne bliver i organisationen, men typisk er udviklere og driftsfolk meget forskellige og ingen kan stavnsbindes. Det er vidt forskellige mennesker (typer og uddannelse) der kan udvikle store komplicerede programmer/industrianlæg og kan/vil køre drift. 4 0more_vert insert_linkKopier link 12 Jan Ferré 18. februar kl. 12:28 svarede Ole Rønn Olsen [10]Re: Når Dina Raabjerg siger atJeg beklager meget, Ole, at jeg finder din kommentar om Open Source forfejlet.Det, Anders Djurså startede tråden med at bemærke, var primært, at udbudsgiveren bør eje den software, udbudsgiveren skal betale for. Og at det skal kunne afvikles på andet end et enkelt firmas maskinel.Reelt kræver det ikke, at det software, der skal være til rådighed, er Open Source. Det kræver, at det software er til at skaffe sig - med eller uden betaling. F.eks. kan et lønsystem udmærket kræve, at der ligger en SAP af en given 'kvalitet' til rådighed. Hvordan man så skaffer denne SAP er ret ligegyldigt. Men det skal naturligvis beregnes med i tilbudsprisen.Ja - det er så rigtigt, som Anders skriver, at hvis udbudsgiver vælger at erklære sin nyudviklede software som Open Source, så er der en stribe fordele ved det. Det hjælper også lidt til at holde tilbudsgiveren i sporet, så der ikke laves en masse ligegyldige funktioner bare for at holde prisen oppe. 4 1more_vert insert_linkKopier link 11 Hans Dybkjær 18. februar kl. 11:12 svarede Henning Kjær [7]Re: Hvis der er et budgetJeg kan ikke se hvor grøftegravningen dukkede op? Jeg læser Lars' indlæg som at hvis der er 700 millioner i budgettet, hvorfor så ikke bruge dem til at udvikle ny "standard" Open Software som kan håndtere det, hvis det ikke findes? Med et antal personer i et antal år som det giver projektmæssig mening. Endda tænke i at have en organisation der ikke bare forsvinder når projektet slutter, sådan som det store konsulentforbrug mange steder resulterer i.Lars har da også ret i at 70 personer/ti år er tættere på fornuft end 700/et år, uden at han derved hænger nogle af tallene op som en realistisk projektplan.Hvis præmissen er alligevel er egenudviklet, kunne OpenSoftware være en fin ting; så kan eksterne også se om de regner rigtigt i lønsystemet. Om resultatet bliver bedre eller billigere end at bruge de store løsninger som allerede findes og som allerede kan håndtere statens overenskomster, kan jeg ikke gennemskue. 5 1more_vert insert_linkKopier link 10 Ole Rønn Olsen 17. februar kl. 13:46Når Dina Raabjerg siger atNår Dina Raabjerg siger at der er løsninger, taler hun af erfaring. Silkeborg Løn og KMD Opus bruges af mange kommuner. KMD har bygget ovenpå SAP.Når det er sagt, så er det jammerligt, at det altid skal ende i at Open Source er løsningen på alt. Pudsigt nok var Dansk-IT ikke imponeret over at regioner og kommuner havde valgt at gå sammen i et udviklingsfællesskab for at udvikle en ESDH-løsning (SBSYS) der passer til danske forhold. 4 2more_vert insert_linkKopier link 9 Anders Djursaa 16. februar kl. 13:07 svarede Jens D Madsen [8]Re: Konfigureret "standardsoftware" stavnsbinder til en leverandJa det kunne opnås med et system vedligeholdt som open source. 10 1more_vert insert_linkKopier link 8 Jens D Madsen 16. februar kl. 13:00 svarede Anders Djursaa [1]Re: Konfigureret "standardsoftware" stavnsbinder til en leverandSelvom staten ejer løsningen, kildekoden, og alle rettighederne, så kunne man måske godt give tilladelse til, at lønsystemet kan anvendes af andre end staten.Hvis staten har behov for komplicerede overenskomster, så kunne erhvervslivet have det samme. Og så kunne der blive en stor efterspørgsel for et lønsystem som statens lønsystem i den private sektor. 2 4more_vert insert_linkKopier linkSkrevet på Ingeniøren 7 Henning Kjær 16. februar kl. 12:38 svarede Lars Visby Sørensen [6]Re: Hvis der er et budgetLars Visby Sørensen.Jamen det er da håbløst. Tror du virkelig det er sådan man organiserer og styrer et stort projekt. Det er ikke grøfter de skal grave efter devisen, når en man kan grave 1 meter grøft/per dag, så kan 700 mand grave 700 m grøft/per dag. Sådan kan man ikke engang organisere/styre grøftegravning.Nej dit regnestykke er ikke muligt 8 2more_vert insert_linkKopier linkSkrevet på Ingeniøren 6 Lars Visby Sørensen 15. februar kl. 22:10Hvis der er et budgetHvis der er et budget på 700 millioner skulle det være muligt at ansætte 700 mand i et år, eller måske bedre 70 mand i 10 år. De kunne få god tid til at leve sig ind i den opgave der skal løses. Hvis den organisation frembragte og vedligeholdte en stabil (opensource?)løsning kunne vi undgå at skulle bruge yderligere (tilsvarende?) ressourcer på nye udbud hvert 3.? år. Men måske det ikke er lovligt at ansætte softwarefolk i det offentlige til at udføre kreativt arbejde, men måske kun projektledere til at skrive kravsspecifikationer? 14 7more_vert insert_linkKopier linkSkrevet på Ingeniøren 5 Frank Jumppanen Andersen 14. februar kl. 14:13Det er jo ejendomsvurderingen og EFI om igen......når reglerne (her - overenskomsterne) er for komplekse / forskellige - så ryd op i reglerne først!Der kan næppe findes nogen gode forklaringer (som ikke bare er historiske) for at statslige overenskomster er så meget sværere end de private. Simplificering!!! 60 4more_vert insert_linkKopier linkSkrevet på Ingeniøren 4 Søren Christian Therkelsen 14. februar kl. 13:57 svarede Morten Fordsmand [3]Re: ChatGPTMin pointe er, hvis ikke du kan beskrive overenskomsten tilsvarende eksemplet nedenfor, hvordan skal et menneske så kunne tolke den entydigt? Og kan du beskrive overenskomsten på denne eller tilsvarende vis, kan du også anvende "standard" software... 8 12more_vert insert_linkKopier link 3 Morten Fordsmand 14. februar kl. 13:49 svarede Søren Christian Therkelsen [2]Re: ChatGPTDette viser at ChatGPT ikke er trænet på statslige overenskomster. 16 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Anders Djursaa 14. februar kl. 13:16Konfigureret "standardsoftware" stavnsbinder til en leverandørPrisen bør beregnes i levetid og ikke kun i anskaffelse - og her er det helt afgørende at staten ejer løsningen (kildekoden og alle rettigheder), at løsningen baseres på open source basissoftware (Database, OS, programmeringssprog, frameworks etc.) og at den efterfølgende service og videreudvikling kan konkurrence-udsættes.Ideelt set bør lønsystemet selv udvikles som open source - så vi alle kan kigge med og byde ind. 42 2more_vert insert_linkKopier link'''
