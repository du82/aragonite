e vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 9 Allan Dukat 23. februar kl. 16:23 svarede Peter Nielsen [8]Re: Sociale medier er det nyeSelvfølgelig har forældre et ansvar, men man skal eddermame være mere end almindelig naiv, hvis man tror, at bare fordi et barns forældre siger til barnet, at det ikke må ryge eller drikke eller være på sociale medier eller noget helt tredje, så betyder det, at barnet gør, hvad forældrene siger.Korrekt, jeg mener heller ikke at katastrofen indtræffer hvis barnet gør noget i smug, men hvis forældrene ikke reagere hvis barnet er beruset eller lugter mistænkeligt af røg. Ligeledes er det nok heller ikke en katastrofe hvis barnet ser noget på Nettet hos kammerat, men selv at give barnet en helt åben smartphone og ret til at bruge den i døgndrift, er dog noget andet.Derudover giver din bekymring om registrering ikke nogen mening overhovedet, da sociale medier er nogle af de allerværste til at registrere og videresende, bogstaveligt talt, i hoved og røv om deres brugere; de ved alt.Jeg har en Google-fri Android, sletter min cookies reglmæsigt, og så er jeg kun på Fediverset :-)LinkedIn har lige ændret sine brugerbetingelser, så det også er blevet en reklameplatform, så den konto har jeg lukket.Der er meget stor forskel på, hvad jeg kan vælge selv at gøre, og hvad jeg bliver tvunget til. MitID er en tvang, og direkte knyttet til mit CPR-nr. Det er fint nok, når det er det offentlige jeg kommunkerer med, for de ved jo alt om mig i forvejen, men det er en uskik, at det skal blandes sammen med min færden på Internettet, da det tilhører privatlivets fred. 2 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 8 Peter Nielsen 21. februar kl. 18:54 svarede Allan Dukat [7]Re: Sociale medier er det nyeSelvfølgelig har forældre et ansvar, men man skal eddermame være mere end almindelig naiv, hvis man tror, at bare fordi et barns forældre siger til barnet, at det ikke må ryge eller drikke eller være på sociale medier eller noget helt tredje, så betyder det, at barnet gør, hvad forældrene siger. Nærmere tværtimod, for så bliver det bare mere spændende. Derfor skal lortet efter min mening også bare helt forbydes for dem. Derudover giver din bekymring om registrering ikke nogen mening overhovedet, da sociale medier er nogle af de allerværste til at registrere og videresende, bogstaveligt talt, i hoved og røv om deres brugere; de ved alt. 2 1more_vert insert_linkKopier link 7 Allan Dukat 21. februar kl. 16:30 svarede Peter Nielsen [2]Re: Sociale medier er det nyeHej Peter, jeg er før blevet misforstået, men mit spørgsmål er altså ment oprigtigt;Du mener altså at den eneste grund til at børn ikke ryger er, at det er forbudt for dem at købe tobak i butikkerne, og forældrene ikke har nogen som helst indflydelse på deres valg?For mig at se, er der meget stor forskel på, at blive aldersverificeret ved visuel inspektion i en butik, når jeg køber øl, og så aldersverificere mig med MitID med hvad det giver af elektroniske spor.Det er grunden til, at jeg ikke handler hos https://www.agoodcase.dk/ !Det er simpelthen ikke i orden, at potentielt, al vores færden på Internettet skal registeres personhenførtbart fordi forældrene fralægger sig ansvaret for at bestemme over deres børn. 2 2more_vert insert_linkKopier linkSkrevet på Radar 6 Peter Nielsen 18. februar kl. 19:37 svarede Jens D Madsen [5]Re: Sociale medier er det nyeJeg skriver om sociale medier, jeg ved ikke, hvorfor du nævner nettet som helhed. Internettet er et fantastisk værktøj, men som med alt muligt andet i denne verden, der engang blev opfundet til et specifikt formål, så kan og vil det blive misbrugt til noget helt tredje, det er kun et spørgsmål om tid. Eksempelvis blev biler skabt til at transportere mennesker, ikke pløje dem ned. 13 3more_vert insert_linkKopier link 5 Jens D Madsen 18. februar kl. 19:26 svarede Peter Nielsen [4]Re: Sociale medier er det nyeHvis ikke sådan noget som angst, depression, lavt selvværd (fordi man sammenligner sig med andre), afhængighed og det at konstant blive udsat for misinformation er skadelig for hjernen, så ved jeg sgu ikke, hvad der så er.Jeg tror personligt ikke, at nettet er skadeligt, i forhold til det, at mange børn udsættes for i virkeligheden, også i en tidlig alder. Vi burde starte med at forbyde folkeskolen... 4 21more_vert insert_linkKopier linkSkrevet på Ingeniøren 4 Peter Nielsen 18. februar kl. 19:23 svarede Jens D Madsen [3]Re: Sociale medier er det nyeHvis ikke sådan noget som angst, depression, lavt selvværd (fordi man sammenligner sig med andre), afhængighed og det at konstant blive udsat for misinformation er skadelig for hjernen, så ved jeg sgu ikke, hvad der så er. 19 2more_vert insert_linkKopier link 3 Jens D Madsen 18. februar kl. 19:13 svarede Peter Nielsen [2]Re: Sociale medier er det nyeTvivler på, at det er skadelig på hjernen. Men, dummer man sig, får man sig måske en lærerig erfaring i en tidlig alder. Ellers, får man den først senere. 4 22more_vert insert_linkKopier linkSkrevet på Ingeniøren 2 Peter Nielsen 18. februar kl. 18:53Sociale medier er det nyeSociale medier er det nye tobak og alkohol, DYBT sundhedsskadeligt, "bare" ikke mod vores lunger og lever, og så videre, men mod vores hjerner. I fremtiden har vi forhåbentlig aldersgrænser på sociale medier, nøjagtig som med tobak og alkohol i dag. Og i fremtiden vil vi højst sandsynligt spørge os selv, hvorfor fanden vi ikke forbød det lort for alle fra starten af, nøjagtigt som vi spørger os selv i dag med tobak og alkohol. 15 6more_vert insert_linkKopier link 1 Allan Dukat 18. februar kl. 13:19Tilbage til startSå er det slået fast, at det er forældrenes ansvar hvilket kommunikationsværktøjer de giver deres børn. Det kan de ikke tørre af på andre. 15 5more_vert insert_linkKopier linkSkrevet på Ingeniøren'
