["https://version2.dk/artikel/efter-norge-nu-fraraader-folketinget-ogsaa-brug-af-deepseek"]
title = "Efter Norge: Nu fraråder Folketinget også brug af Deepseek | Version2"
description = "Du kan modtage notifikationer, når vi udgiver nyt indhold, der interesserer dig, baseret på hvilke interesserer og skribenter du følger.Log ind eller opret en konto for at komme i gang."
full_description = '''@media (min-width: 978px) { #tmk--000JPRjhhzTTOM + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001Lc2J6jYnxI8 + .kevel-skeleton { display: none; } }Efter Norge: Nu fraråder Folketinget også brug af Deepseek Kunstig Intelligens13. februar kl. 13:1510 kommentarer Illustration: Mads Claus Rasmussen/Ritzau Scanpix.Folketinget har taget stilling og truffet en afgørelse om, hvorvidt politikere og ansatte må anvende Deepseek på sine platforme. person Sebastian Døssing Journalist, Ingeniøren Følg Du skal være logget ind for at følge et emne.Log indOpret konto person Sebastian Døssing Journalist, Ingeniøren Følg Du skal være logget ind for at følge et emne.Log indOpret kontoTidligere på dagen valgte Norge at trække en streg i sandet - og nu følger Danmark trop. Herhjemme er det dog en anbefaling, hvor det er et decideret forbud i Norge.Folketingsmedlemmer, partiansatte og ansatte i Folketinget bliver nu frarådet at anvende den kinesiske chatrobot Deepseek på computere, telefoner og tablets, som Folketinget har udleveret.Artiklen fortsætter efter annoncenDet har Folketingets Præsidium besluttet torsdag, skriver Ritzau.Ansatte i Folketinget er blevet orienteret i en mail, som Ritzau har set. Det er et forsigtighedsprincip, som lægger til grund for anbefalingen.Folketinget har ellers tidligere oplyst til Ingeniøren, at der ikke var behov for at indføre restriktioner ved brug af Deepseek. Men nu er meldingen altså en anden.Tidligere har Folketinget også frarådet politikere at benytte TikTok.Artiklen fortsætter efter annoncenING/TechJobchevron_rightOpret jobannonceTilpasDen danske anbefaling om at droppe Deepseek læner sig op af den norske beslutning tidligre på dagen.Her valgte man ikke at indføre en anbefaling, men derimod et forbud om at benytte Deepseek. Det handler om at beskytte folks personfølsomme oplysninger, lød argumentet.Siden Deepseeks indtog på verdensmarkedet er der rejst flere bekymringer om, hvordan chatrobotten behandler de oplysninger, som den får i forbindelse med brug af appen.Det har blandt andet ført til forbud i Norge, Italien og Australien, ligesom Frankrig, Irland, Sydkorea, Belgien og Portugal alle har bedt om undersøgelser, der skal klarlægge, hvordan Kina håndterer den brugerdata, man opbevarer. Læs ogsåMicrosoft-rapport: Folk bliver dummere af kunstig intelligensEmnerKunstig IntelligensFølgDu skal være logget ind for at følge et emne.Log indOpret konto10 kommentarer. Hop til debattenDelFacebookTwitterLinkedInemailE-maillinkKopier linkUdskriv ING/TechJobchevron_rightOpret jobannonceTilpasTophistorier Debatten Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 10 Peter Nielsen 15. februar kl. 00:13 svarede Hans Henrik Hansen [9]Re: Det er nok meget smartJa, men hellere kvalitet frem for kvantitet. 0 0more_vert insert_linkKopier link 9 Hans Henrik Hansen 14. februar kl. 23:35 svarede Peter Nielsen [8]Re: Det er nok meget smart...Hvis det ikke er på dansk, er jeg ikke interesseret, i så fald må der vist gå ret lang tid imellem, at du bliver 'interesseret'!? 😀 0 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 8 Peter Nielsen 14. februar kl. 21:35 svarede keld jacobsen [7]Re: Det er nok meget smartPersonligt har jeg det sådan her:Hvis jeg skal downloade en app, er jeg ikke interesseret.Hvis jeg skal oprette et login, er jeg ikke interesseret.Hvis jeg skal betale et gebyr, er jeg ikke interesseret.Hvis det ikke er på dansk, er jeg ikke interesseret. 1 3more_vert insert_linkKopier link 7 keld jacobsen 14. februar kl. 20:50 svarede Peter Nielsen [6]Re: Det er nok meget smartJeg har så oprettet et login på le chat , nu har google spioneret på mig i 20 år, så hvis jeg kan jævne spillefladen ved at gøre en europæer samme tjeneste, er det vel fair 0 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 6 Peter Nielsen 14. februar kl. 20:08 svarede keld jacobsen [2]Re: Det er nok meget smartNu tjekkede jeg lige le chat ud via www og kunne så se, at man max får 10 beskeder i den anonyme version, og jeg mener, at www-versionen af ChatGPT har noget lignende, så jeg tænkte, at jeg lige ville slå et slag for den her:https://skrivsikkert.dk/chatgpt-dansk/Ingen login nødvendigt og ubegrænset chat.Eventuelt tjek: https://skrivsikkert.dk/privatlivspolitik/ 0 0more_vert insert_linkKopier link 5 Peter Nielsen 14. februar kl. 19:07 svarede keld jacobsen [4]Re: Er der nogle kloge hovederJa, det ville være okay... Bare så længe "motoren" er fra et demokratisk land i EU, og et som vi er allieret med. 0 0more_vert insert_linkKopier link 4 keld jacobsen 14. februar kl. 18:03 svarede Peter Nielsen [3]Re: Er der nogle kloge hovederJa jeg mener også det var en opgave Danmarks radio meget naturligt kunne administrere, for vores licenspenge , de kunne jo bare hoste en af de opensource versioner der er til rådighed.derimod at forsøge at udvikle noget fra bunden , det har folk ikke tålmodighed til vente på ,de features de store som google og apple , har udviklet over årene , vil folk ikke acceptere mangler i en tilvænnings/udskifningsfase. Det vil være som at skifte øl eller tobaksmærke, de fleste vil falde tilbage i hullet. 1 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 3 Peter Nielsen 14. februar kl. 17:45Er der nogle kloge hovederEr der nogle kloge hoveder herinde, der kan forklare mig, hvorfor vi her i landet ikke har en gratis national offentlig pendant til alle de kommercielle fra Google, Microsoft, OpenAI og så videre, som er på dansk til danskere i Danmark og er fodret med danske data? 4 0more_vert insert_linkKopier link 2 keld jacobsen 14. februar kl. 08:13 svarede Mark Lahn Nykjaer [1]Re: Det er nok meget smartPrøv "le chat"fra frankrig ,jeg har ikke erfaring med andre ,så jeg kan ikke sammenligne,men jeg synes den er forrygende ,den forstår og skriver dansk perfekt ,og så er man med til at understøtte en europæisk udvikling. 10 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Mark Lahn Nykjaer 14. februar kl. 07:53Det er nok meget smartDet er nok meget smart at være forsigtig, men med den vej det går i USA den sidste måneds tid, synes jeg man skal passe lige så meget på med Copilot/ChatGPT :( 9 0more_vert insert_linkKopier linkSkrevet på Ingeniøren'''
