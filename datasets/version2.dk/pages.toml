tér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 4 Lars Østergaard 22. februar kl. 14:43Fujitsu - det var daFujitsu - det var da også deres software der i Storbritannien fejlagtigt fik adskillige sub-postmaster'ere idømt fængslesstraffe for bedrageri. Virkelig dårligt software :-( 1 0more_vert insert_linkKopier link 3 Peter Nielsen 19. februar kl. 00:05 svarede Jens Beltofte [2]Re: e-BoksPersonligt er jeg ikke stoppet, for jeg er aldrig begyndt, men jep, det er desideret pinligt taget i betragtning af, at det er skrevet på et tech-medie, og ekstra pinligt, fordi det nu er cirka hele 3 år siden, at e-Boks "mistede" postløsningen. Og det er ikke noget, man behøver antage; det er definitivt sendt med/til/via Digital Post, så længe det er en offentlig myndighed. 1 0more_vert insert_linkKopier link 2 Jens Beltofte 18. februar kl. 21:40e-BoksHvornår stopper vi med at omtale Digital Post som e-Boks? Ja, e-Boks er en af flere visningsklienter til Digital Post, men der stopper det også. Når Frederiksberg Kommune er afsender må man antage at det er sendt til Digital Post. 6 0more_vert insert_linkKopier link 1 Svend Jørgensen 18. februar kl. 08:41Sagen som denne»Sager som denne taler for, at myndigheder løbende evaluerer og forbedrer deres systemer for at minimere risikoen for fejl.En mindre omskrivning vi være på plads, den kunne lyde sådan her:»Sager som denne taler for, at Process Havari Myndigheden undersøger sagen og offentliggøre hvad der gik galt, således at andre kan lære af de fejl som kommunen begik og dermed reducere sandsynligheden for fejlen sker igen. 32 0more_vert insert_linkKopier link'''
