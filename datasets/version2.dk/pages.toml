full_description = '''@media (min-width: 978px) { #tmk--0027USdseF11Vw + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--00300eVX3vBP0g + .kevel-skeleton { display: none; } }DebattenHar du et emne du gerne vil diskutere med andre læsere? Opret din egen debattråd. Seneste debat Vis kommentarindhold4Kameraet indsamler data og forudsiger sygdom eller død hos beboerenSeneste kommentar af Henning Kjær 10 timer 41 minutter sidendø i eget hjem, også aleneHvorfor er det så vigtigt at undgå at "nogen går bort uden et menneske ved sin side". Det er det da mange der gør udenfor plejehjemmene, og nu kan de endda bede om/kræve ikke at blive genoplivet. Jeg kender flere familiemedlemmer der døde alene, uden forudgående alvorlig sygdom. I et tilfælde lå ægtefællen ved siden af i dobbeltsengen uden at opdage noget før om morgenen. I et andet tilfælde var ægtefællen ude at handle mens han døde. keyboard_arrow_down1Netcompany hyrer topembedsfolk på stribe: »Den her type ansættelser udstiller landets svingdørsproblemer«Seneste kommentar af Poul Møller 15 timer 47 minutter sidenMan kan hyre dit og datDet væsentlige er at de aftalte it-systemer bliver afleveret til tiden og den aftalte pris.Det synes ikke rigtigt at være tilfældet, Hvem de så ansætter, tja, de har ikke fået firmaet til at levere produktet til tid og pris.Det er det store problem! keyboard_arrow_down13Kommunernes priser for Microsoft-licenser skyder i vejret: »Prisstigningerne vil presse vores budgetter«Seneste kommentar af Henrik Juul 1 dag 8 timer sidenSkift nu bare til LinuxSkift nu bare til linux og få lavet et custom OS der er brugervenligt til de ansatte... keyboard_arrow_down14Bekymring blandt fagfolk: Lukker Microsoft forbindelsen til Danmark, hvis Trump beordrer det?Seneste kommentar af Frank Jumppanen Andersen 1 dag 9 timer sidenRe: Vil Microsoft gøre det?Men kan man frasælge licenserneHvis der er 'lukkede' services i Azure, så kræver det selvfølgelig at MS vil sælge licenser til disse også. Rigtigt mange services fra MS cloud kan du jo vælge at køre on-prem (baseret på egen licens) - og dermed også i private cloud setup hos en udbyder. keyboard_arrow_down3Apple-whistleblower om Siri-aflytning: Det sker stadigSeneste kommentar af Kjeld Flarup Christensen 1 dag 12 timer sidenRe: Hej KjeldDet betyder, at manGodt at man kan afvise, spørgsmålet er så hvor mange der ved det, og hvad med de telefoner som er installeret før?Samtidig bør man kraftigt overveje, om det er forsvarligt, at indtale personfølsomme oplysninger via Siri generelt. Som jeg forstår problemet her, så ved man ikke, at Siri er blevet aktiveret!Og generelt, så kan der jo være andre apps og telefoner som lytter med uden at man ved det. Også med Android.Og PC'er. Folk sætter gerne et stykke tape over kameraet, men mikrofonen er den som virkeligt kan spionere! keyboard_arrow_down13Ekspert advarer danske virksomheder: Regn med USA spionerer via Google og MicrosoftSeneste kommentar af Agner Fog 1 dag 15 timer sidenEU må tage initiativ tilEU må tage initiativ til at udvikle alternative produkter og tjenester keyboard_arrow_down3Kendt datagidselforhandler pynter sig med lånte fjer: Misbrug af titel og begrænset erfaring med cybersikkerhedSeneste kommentar af Bo Svendsen 2 dage 6 timer sidenEr vi nu på sladderblads-niveau igen?Men hvad er egentlig den relevante begrundelse for at endevende og nedgøre denne Michael Andersen i dette forum, ud over at artiklens forfatter ser ud til at have noget personligt imod ham? keyboard_arrow_down8Efter måneders tovtrækkeri: Derfor skal kommunerne alligevel leve op til NIS2Seneste kommentar af Søren Rønsberg 2 dage 10 timer sidenRe: Jeg håber det er enJeg håber det er en fejltolkning at "Med lovforslaget fra februar får vi den forståelse, at alle systemer er omfattet". Det må stadig beror på, at vi som kommuner, får defineret hvad der er samfundskritisk og hvad der ikke er. Det handler ikke om Læsø eller København, men at alle kommuner har nogle meget små gråspurve i deres portefølje og NIS2 er en pæn stor kanon. Jeg tror der en stor del af alle de 5-700 leverandører af it til det offentlige, der får sig et sjok over pludselig at være omfattet af NIS2, hvis den kommentar er rigtig. Og os der skal implementere får nok at gøre med at styre leverandører i stedet for at højne sikkerhed, hvor der er nødvendigt.Hvis dine små IT systemer kører på samme servere/netværk eller PC'er som de kritiske, så er de en mulig sårbarhed. Derfor er de omfattet. Det er endnu værre hvis de "små" leverandører hver har remote support adgang direkte til det fælles net.Men det betyder ikke at det er samme løsning der anvendes til det hele.Hele systemet deles op i celler alt efter kritikalitet og behov for kommunikation. Der skal så etableres de nødvendige firewalls og adgangsbeskyttelser.De ukritiske systemer kan køre i en DMZ og kun have simpel beskyttelse, mens de kritiske systemer kører i hver sin celle og har mere avanceret beskyttelse.Brugerne skal naturligvis kun have adgange til præcis det deres job kræver.Extern adgang skal kun tillades hvis den kan inddæmmes, til det absolut nødvendige. keyboard_arrow_down46Hvordan bruger man 100 mia fornuftigt?Seneste kommentar af Jørgen Henningsen 2 dage 10 timer sidenRe: Det bedste forsvarSkal en krig vindes er det med landstyrker. Luftkrig/luftforsvar alene vinder ikke en krig.Det har du selvfølgelig ret i og derfor skal der selvfølgelig uddannes soldater og produceres isenkram til dem. Ideen med droner er i første omgang ikke at vinde en landkrig, men at undgå krig overhovedet.Samme princip blev iøvrigt brugt i den kolde krig hvor USA opstillede missiler i hobetal i bl.a. Tyskland for at holde russerne i skak. De viste at hvis der blev ballade så var vi klar og kunne smadre deres infrastruktur så let som ingenting. Tilsvarende kan vi anvende droner til hav overvågning.Men igen så kræver det at der er mandskab og skibe på vagt til at gå ud og tage affære hvis der bliver lavet ballade med vores kabler o.a. infrastruktur til søs. keyboard_arrow_down3Fransk NGO politianmelder Apple for at spionere med SiriSeneste kommentar af Niels Munthe 2 dage 19 timer sidenRe: Hvis I vil have 'slåetDet er ikke den første opdatering der slår siri til... det har de gjort før :) men det er vældig snedigt, for man opdager det jo ikke... keyboard_arrow_down2Kommission: Tag smartphonen fra børneneSeneste kommentar af Ditlev Petersen 3 dage 16 timer sidenBivirkning?Hvis børn ikke må have/medtage/bruge smartphones, så vil det fysiske rejsekort og andre gode ting vel fortsætte? Tør man måske håbe. Måske ligefrem et fungerende postvæsen? keyboard_arrow_down13Dansk virksomhed forlod AWS og flyttede alt i tysk cloud: »Det er helt klart under halv pris«Seneste kommentar af Svend Jørgensen 3 dage 18 timer sidenRe: HetznerOg så var det at jeg lærte at der ikke eksisterer nogen menneskelig support hos Hetzner. Hvis robotten har afvist dig, så er du afvist, game over. Det lykkedes aldrig at blive kunde.Dette er et brud på, som minimum, dansk lovgivning, da du ikke må være genstand for en robots afgørelse, jf. datatilsynet.Mon ikke tyske love minder rigtigt meget om de danske. keyboard_arrow_down25Kommune droppede Microsoft for tysk Cloud: »Jeg sparer to tredjedele af prisen«Seneste kommentar af Kjeld Flarup Christensen 4 dage 11 timer sidenRe: Sammenligning af æbler og pærerDet handler om infrastruktur og økosystemer. Google er vel de eneste konkurrenter, som har noget tilsvarende. De kan sikkert være et rigtigt godt alternativ til mindre organisationer med mindre komplekse it-miljøer. NextCloud kunne være/blive et alternativ, men det kræver at det får mere vind under vingerne.Jo flere der vælger en Open Source løsning, jo bedre bliver de og endnu flere vil vælge dem. keyboard_arrow_down15O3-mini fra OpenAI er ”sygt god”Seneste kommentar af Stefan Gunnersen 4 dage 15 timer sidenRe: Godt gået! - og et par spørgsmålSorry for navnet (ved ikke hvad jeg tænkte på...). Omfanget af arbejdet var også i den størrelsesorden, jeg forestillede mig. Man kan komme langt på en dags arbejde, endda fra sygesengen. Tak for svar! keyboard_arrow_down4Michael forhandlede med Alles Lægehus-hackere. Nu svarer han igen efter hård kritikSeneste kommentar af Bo Svendsen 5 dage 6 timer sidenRe: Tjah det er jo ikkeDu har helt ret i, at (vi) alle kan risikere at blive angrebet af hackere, men så burde Ingeniøren som det fagblad, vi vel stadig forventer, det er, forholde sig til facts og teknik til at undgå og/eller imødegå dette, den slags sladderbladsjournalistik som vi ser her, bliver man jo ikke klogere af. Referencen til EB i#1 er helt relevant - og bliver det desværre stadigt tiere i Vort tidligere så respekterede Fagblad, som vel netop ikke skal ud på fiskeri efter betalende læsere for enhver pris? keyboard_arrow_down28Hvorfor gider piger ikke it?Seneste kommentar af Jens Frederik Dalsgaard Nielsen 6 dage 6 timer sidenRe: Tiderne skifterMan lærer altså bedst hvis man synes det er sjovt og meningsfyldt. Ikke bare for man skal følge slægtens række af læger/præster/ingeniører/landmænd/advokater/...Det er altså ikke sjovt at "vi forventer at du blir landmand" hvis man helre vil noget andet. Der hvor jeg er (AAU ) har vi for år talt op at 25% var mønsterbrydere/brød-sociale-arv. Ikke s ring som vi siger. keyboard_arrow_down9Digitaliseringsminister: TikTok-forbud for mindreårige har ingen gang på jordenSeneste kommentar af Allan Dukat 6 dage 11 timer sidenRe: Sociale medier er det nyeSelvfølgelig har forældre et ansvar, men man skal eddermame være mere end almindelig naiv, hvis man tror, at bare fordi et barns forældre siger til barnet, at det ikke må ryge eller drikke eller være på sociale medier eller noget helt tredje, så betyder det, at barnet gør, hvad forældrene siger.Korrekt, jeg mener heller ikke at katastrofen indtræffer hvis barnet gør noget i smug, men hvis forældrene ikke reagere hvis barnet er beruset eller lugter mistænkeligt af røg. Ligeledes er det nok heller ikke en katastrofe hvis barnet ser noget på Nettet hos kammerat, men selv at give barnet en helt åben smartphone og ret til at bruge den i døgndrift, er dog noget andet.Derudover giver din bekymring om registrering ikke nogen mening overhovedet, da sociale medier er nogle af de allerværste til at registrere og videresende, bogstaveligt talt, i hoved og røv om deres brugere; de ved alt.Jeg har en Google-fri Android, sletter min cookies reglmæsigt, og så er jeg kun på Fediverset :-)LinkedIn har lige ændret sine brugerbetingelser, så det også er blevet en reklameplatform, så den konto har jeg lukket.Der er meget stor forskel på, hvad jeg kan vælge selv at gøre, og hvad jeg bliver tvunget til. MitID er en tvang, og direkte knyttet til mit CPR-nr. Det er fint nok, når det er det offentlige jeg kommunkerer med, for de ved jo alt om mig i forvejen, men det er en uskik, at det skal blandes sammen med min færden på Internettet, da det tilhører privatlivets fred. keyboard_arrow_down3Politiet efterforsker kendt datagidselforhandler for misbrug af beskyttet titelSeneste kommentar af René Nielsen 1 uge 2 timer sidenSvend og Søren - detSvend - det dér, det børnehave. keyboard_arrow_down4Kommune lækker 13-årigs data til tusinder af fremmede: »Sagen er alvorlig«Seneste kommentar af Lars Østergaard 1 uge 13 timer sidenFujitsu - det var daFujitsu - det var da også deres software der i Storbritannien fejlagtigt fik adskillige sub-postmaster'ere idømt fængslesstraffe for bedrageri. Virkelig dårligt software :-( keyboard_arrow_down16Kan du se forskel? SuperBrugsen og Kvicklys næste tilbudsavis har modeller skabt af AISeneste kommentar af Morten Steen 1 uge 1 dag sidenVarens pasformHvis man skal kunne stole på at tøjet har pasform, burde man bruge en gine (som dem i udstillingsvinduerne). Så kan man "snyde" med hoveder, arme og ben, der hvor de ses.Det er snyd at photoshoppe tøjet. keyboard_arrow_down chevron_left Forrige side Forrige Nuværende side 1 Page 2 Page 3 Page 4 Næste side Næste chevron_r