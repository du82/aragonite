n Vær med til at skabe en god debat ved at følge vores debatregler.For at deltage i debatten skal du have en profil med adgang til at læse artiklen. Log ind eller opret en bruger. settingsDebatvisning Sortér efter chevron_right thumb_upBedste wb_sunnyNy historyÆldste Trådet debat Følg denne debat 14 Svend Jørgensen 26. februar kl. 08:47 svarede Baldur Norddahl [6]Re: HetznerOg så var det at jeg lærte at der ikke eksisterer nogen menneskelig support hos Hetzner. Hvis robotten har afvist dig, så er du afvist, game over. Det lykkedes aldrig at blive kunde.Dette er et brud på, som minimum, dansk lovgivning, da du ikke må være genstand for en robots afgørelse, jf. datatilsynet.Mon ikke tyske love minder rigtigt meget om de danske. 8 0more_vert insert_linkKopier link 13 Pernille Tranberg 26. februar kl. 08:13👏Tak for fremragende artikler der viser en anden europæisk vej. Send dem endelig til Caroline Stage og KL hvis de ikke har adgang til dem . 9 0more_vert insert_linkKopier link 12 Stig Libori 25. februar kl. 21:08Nextcloud for de flesteFor de fleste, vil det mest realistiske alternativ til de amerikanske cloudvirksomheder nok være Nextcloud. Rent IT-mæssigt er de GDPR-godkendte (og anbefalet af EU) og det kan nogenlunde det samme som de amerikanske udbydere. Men naturligvis ikke helt det samme, og nogle vil være så låst til eksempelvis Microsoft, at det vil være voldsomt svært at skifte.Men for de fleste bør det kunne lade sig gøre.Ifølge Nextcloud selv: https://nextcloud.com/compare/ 12 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 11 Baldur Norddahl 25. februar kl. 17:53 svarede Frej Jensen [7]Re: HetznerHvad er forholdene hos Azure / AWS / Google ? Microsoft godkendte de samme dokumenter som Hetzner afviser. Mig bekendt har de ikke i deres betingelser, at de kan smide mig ud uden at jeg har gjort mig skyldig i noget.Hetzners anledning til at afvise kunder er fornuftige nok. De skal ikke have spammere og andre svindlere ind på stjålne kreditkort etc. Problemet var at en robots afvisning var endelig og ja, det var der et menneske der skrev. Og at de gør opmærksom på at deres betingelser er at, de kan lukke din virksomhed uden varsel og uden begrundelse. Hvis man kan leve med det, så fair nok. Men hvad er værdien af en SLA under sådanne forhold? Her er teksten fra Hetzner:After reviewing your updated customer information, we have decided to deactivate your account because of some concerns we have regarding this information. Therefore, we have cancelled all your existing products and orders with us.Best regardsYour Hetzner Online TeamPrøv at søge på den tekst. Hvis du først har fået den besked, så er du ude. Du kan ringe til dem, men deres support ved ikke hvorfor og har ikke bemyndigelse til at tilsidesætte beslutningen. Robottens dom er endelig og kan ikke ankes og det er det eneste de kan fortælle dig. 7 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 9 Claus Jepsen 25. februar kl. 12:44Cloud eller SaaS?Taler vi blot om virtuelle server eller SaaS platform, hvor man gør brug af AWS indbyggede funktioner? For det sidste gør det jo svært at flytte. 5 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 8 Klavs Klavsen 25. februar kl. 10:49 svarede Baldur Norddahl [6]Re: HetznerHvis robotten har afvist dig, så er du afvist, game over. Det lykkedes aldrig at blive kunde.Lyder meget underligt. Du skal nok prøve igen med friske øjne.. Jeg aldrig haft problemer - og andre jeg kender har fået en konto på 5 minutter til deres firma.Du kan altid skrive til support@hetzner.com hvis du er kunde - der får du svar fra et menneske :) - vi bruger det stortset kun til når en disk skal udskiftes/hardware probs. 8 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 7 Frej Jensen 25. februar kl. 10:23 svarede Baldur Norddahl [6]Re: HetznerHvad er forholdene hos Azure / AWS / Google ? 10 0more_vert insert_linkKopier link 6 Baldur Norddahl 25. februar kl. 09:58 svarede Rasmus Dyrholm [4]Re: HetznerJeg forsøgte engang for cirka halvanden år siden at oprette en Hetzner konto til min virksomhed. Deres system var tilsyneladende ikke tilfreds med den dokumentation jeg sendte fra CVR. Og så var det at jeg lærte at der ikke eksisterer nogen menneskelig support hos Hetzner. Hvis robotten har afvist dig, så er du afvist, game over. Det lykkedes aldrig at blive kunde.Jeg gætter på at der eksisterer andre forhold for større kontrakter. Men hvis du nærlæser betingelserne for små setups, altså bare en enkelt server etc, så kan de til enhver tid smide dig ud uden varsel. Og hvis det tilmed er en AI der tager sådanne beslutninger, så vil jeg nok også være lidt bekymret for min forretning. Så måske var det meget godt at de tvang mig til at finde en anden løsning. 8 8more_vert insert_linkKopier link 5 Dennis Schafroth 25. februar kl. 09:35Har haft en "bare metal"Har haft en "bare metal" server hos Hetzner i mange og er fuldt tilfreds. Og ja stærkt gået. Nu mangler vi bare resten af dk at gøre sig uafhængig af USA og deres big tech 29 0more_vert insert_linkKopier linkSkrevet på Ingeniøren 4 Rasmus Dyrholm 25. februar kl. 09:12 svarede Kjeld Bülow Thomsen [2]Re: Hetznerhttps://de.trustpilot.com/review/hetzner.comJeg bruger selv Trustpilot en del, men du skal være forsigtig når du bruger det til at sige noget om de store virksomheder (medmindre du mener, at alle store virksomheder er noget skrammel, selvfølgelig). Her er lige et par andre virksomheder, der er de første, jeg lige kunne komme i tanker om:https://de.trustpilot.com/review/www.siemens.comhttps://de.trustpilot.com/review/www.amazon.dehttps://de.trustpilot.com/review/www.bosch.co.ukhttps://de.trustpilot.com/review/www.vestas.com 17 1more_vert insert_linkKopier linkSkrevet på Ingeniøren 3 Frej Jensen 25. februar kl. 09:07 svarede Kjeld Bülow Thomsen [2]Re: HetznerOg der er en logisk forklaring på de mange negative reviews - som også gør sig gældende hos andre hostingudbydere som Leasweb og OVH. Man er mere tilbøjlig til at give negative reviews, og mange af de reviews basere sig på situationer, hvor der er fejlfortolkning på kundeforhold og / eller hvor disse er brudt. Læs eventuelt denne rededit tråd: Why so many bad reviews for Hetzner : r/hetzner 24 0more_vert insert_linkKopier link 2 Kjeld Bülow Thomsen 25. februar kl. 07:23Hetznerhttps://de.trustpilot.com/review/hetzner.com 2 11more_vert insert_linkKopier linkSkrevet på Ingeniøren 1 Maciej Szeliga 25. februar kl. 07:10‘Nu går det simpelthen ikke længere. Vi kan ikke stå inde......for det her'Det er stærkt, bare der var flere der indså det!Det er så godt gået at man stiller sig op og siger det klart. 63 0more_vert insert_linkKopier linkSkrevet på Ingeniøren'''
