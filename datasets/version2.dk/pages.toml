full_description = "@media (min-width: 978px) { #tmk--000MXziLx8dwd8 + .kevel-skeleton { display: none; } }@media (max-width: 977px) { #tmk--001C3kp-MP6NOs + .kevel-skeleton { display: none; } }Alles Lægehus-hack breder sig: To andre virksomheder ramt Cyberkriminalitet7. januar kl. 10:261 kommentar Illustration: Arthur Cammelbeeck/Ritzau Scanpix.Et cyberangreb medførte i midten af december, at patienter og ansatte i WeCare Holding-koncernen fik lækket deres persondata. person Lasse Skovgaard Følg Du skal være logget ind for at følge et emne.Log indOpret konto Artiklen er ældre end 30 dage person Lasse Skovgaard Følg Du skal være logget ind for at følge et emne.Log indOpret kontoOgså de to virksomheder Vikteam og Institut for Mental Sundhed er ifølge DR påvirket af det cyberangreb, der 12. december 2024 ramte lægehuset Alles Lægehus.Det var ifølge Thomas Helt, der er stifter og direktør i WeCare Holding, som er koncernen bag de tre virksomheder, it-leverandøren ITM8, der var hackernes indgang i forbindelse med cyberangrebet. En påstand som ITM8 senere afviste overfor Version2.Artiklen fortsætter efter annoncenAngrebet har resulteret i, at virksomhederne har anmeldt brud på persondatasikkerheden til Datatilsynet. Det er uvist, hvor mange personers data, der er blevet stjålet i angrebet på de tre virksomheder.DR har været i kontakt med flere personer, der er ramt af datalækket, selvom de ikke har været patienter i WeCare Holding-koncernens klinikker. Michelle Møller, der er kommunikationschef for Alles Lægehus, Vikteam og Institut for Mental Sundhed, skriver til DR, at det skyldes, at de som sundhedspersoner er forpligtet ved lov til at opbevare en række patientoplysninger i mindst 10 år.»Det gælder også for borgere, der blot i enkelte tilfælde har kontaktet vores klinikker fx for rådgivning, enkeltstående lægehjælp i forbindelse med en ferie og for patienter, der ikke længere er tilknyttet klinikken,« lyder det fra Michelle Møller. Læs ogsåKendt datagidselforhandler p