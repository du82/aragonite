title = "Mentions légales | Vertigo Forum"
description = "1. Informations légalesLe site « vertigo.ircam.fr » ainsi que tous les éléments le composant et notamment : l’ensemble des textes, les photographies, vidéos et documents sonores sont la propriété de l’Ircam ou d’un tiers dont il a été obtenu les droits d’exploitation. Ils ne peuvent donc être utilisés sans autorisation préalable au titre des dispositions du Code de la propriété intellectuelle."
full_description = '''Titre : App : Model : Id : Fields : Mentions légales Éditer Contenu :<div class="editable-original"> <h3>1. Informations l&eacute;gales</h3> <p>Le site &laquo; vertigo.ircam.fr &raquo; ainsi que tous les &eacute;l&eacute;ments le composant et notamment : l&rsquo;ensemble des textes, les photographies, vid&eacute;os et documents sonores sont la propri&eacute;t&eacute; de l&rsquo;Ircam ou d&rsquo;un tiers dont il a &eacute;t&eacute; obtenu les droits d&rsquo;exploitation. Ils ne peuvent donc &ecirc;tre utilis&eacute;s sans autorisation pr&eacute;alable au titre des dispositions du Code de la propri&eacute;t&eacute; intellectuelle.</p> <p>En cons&eacute;quence, toute repr&eacute;sentation ou reproduction int&eacute;grale ou partielle, toute utilisation, adaptation, transformation, arrangement, de tout ou partie d&rsquo;&oelig;uvres, de signes distinctifs ou de bases de donn&eacute;es, prot&eacute;g&eacute;s par un droit de propri&eacute;t&eacute; intellectuelle de l'Ircam, faite sans son consentement est illicite, et constitue une contrefa&ccedil;on sanctionn&eacute;e p&eacute;nalement selon l&rsquo;article L 122-4 du Code la Propri&eacute;t&eacute; Intellectuelle.</p> <h3>2. Informations techniques</h3> <p>L'Ircam est le propri&eacute;taire et l'h&eacute;bergeur du site internet &laquo; vertigo.ircam.fr &raquo;. Ce site est cr&eacute;&eacute; avec <a href="https://github.com/Ircam-Web/Mezzo" target="_blank">Mezzo</a>,&nbsp;outil de gestion de contenus (CMS) pour les organisations &agrave; workflow complexe.</p> <p><strong>D&eacute;veloppement backend/frontend </strong>Guillaume Pellerin, Ircam<br><strong>Production et gestion du site</strong> Mary Delacour, Ircam</p> <h2>Politique de confidentialit&eacute;</h2> <h3>1. Notre engagement</h3> <p>Afin que vous puissiez visiter notre site en toute tranquillit&eacute;, nous, l&rsquo;Ircam, en tant que responsable du traitement, vous exposons comment nous collectons, traitons et utilisons vos donn&eacute;es personnelles, dans le respect de vos droits.</p> <p>Les donn&eacute;es collect&eacute;es font l'objet d'un traitement informatique et sont destin&eacute;es exclusivement aux services administratifs de l'Ircam. Elles sont n&eacute;cessaires au traitement et &agrave; la gestion des commandes des utilisateurs (achats li&eacute;s &agrave; la billetterie, aux abonnements et inscriptions) ainsi qu&rsquo;aux relations commerciales / de communication entre l&rsquo;Ircam et l&rsquo;utilisateur. Elles permettent &eacute;galement &agrave; l&rsquo;Ircam de mieux conna&icirc;tre les visiteurs du site, d&rsquo;identifier leurs besoins afin d'am&eacute;liorer la qualit&eacute; des services.</p> <p>Votre adresse mail ne sera jamais revendue, ni &eacute;chang&eacute;e. Nous prot&eacute;geons votre vie priv&eacute;e en assurant la protection, la confidentialit&eacute;, la non alt&eacute;ration, la disponibilit&eacute; et la s&eacute;curit&eacute; des donn&eacute;es personnelles que vous nous confiez sur l&rsquo;ensemble de nos canaux de communication.</p> <h3>2. Cat&eacute;gorie de donn&eacute;es personnelles collect&eacute;es et trait&eacute;es</h3> <h4>a. &Agrave; quelles occasions collectons-nous vos donn&eacute;es personnelles ?</h4> <p>Vos donn&eacute;es personnelles peuvent &ecirc;tre recueillies lorsque :</p> <ul> <li>vous effectuez une commande (billetterie, carte Ircam, logiciels, livres)</li> <li>vous vous inscrivez aux actualit&eacute;s de l&rsquo;Ircam</li> <li>vous naviguez sur le site</li> </ul> <h4>b. Donn&eacute;es personnelles que vous communiquez</h4> <p>Certaines informations de donn&eacute;es personnelles sont obligatoires (celles suivies d&rsquo;un ast&eacute;risque) et d&rsquo;autres facultatives comme indiqu&eacute; dans le formulaire.</p> <p>Conform&eacute;ment &agrave; la loi, nous ne collectons en aucun cas les cat&eacute;gories particuli&egrave;res de donn&eacute;es personnelles que sont notamment les donn&eacute;es qui r&eacute;v&egrave;lent l'origine raciale ou ethnique, les opinions politiques, les convictions religieuses ou philosophiques ou l'appartenance syndicale, les donn&eacute;es personnelles g&eacute;n&eacute;tiques, les donn&eacute;es personnelles biom&eacute;triques aux fins d'identifier une personne physique de mani&egrave;re unique, les donn&eacute;es personnelles concernant la sant&eacute; ou les donn&eacute;es personnelles concernant la vie sexuelle ou l'orientation sexuelle d'une personne physique.<br>Ces cat&eacute;gories de donn&eacute;es personnelles particuli&egrave;res ne font jamais l&rsquo;objet d&rsquo;une collecte ou d&rsquo;un traitement par l&rsquo;Ircam.</p> <h4>c. Les cookies</h4> <p>Un &ldquo;cookie&rdquo; ou &ldquo;traceur&rdquo; est un fichier texte qui est plac&eacute; ou stock&eacute; sur votre terminal (ordinateur, tablette ou appareil mobile) lorsque vous visitez un site. Le cookie permet &agrave; un site de vous reconna&icirc;tre, de vous aider &agrave; naviguer de page en page, de fournir des connexions s&eacute;curis&eacute;es et de se souvenir de vos pr&eacute;f&eacute;rences lors de vos prochaines visites.</p> <p>Nous utilisons des cookies pour :</p> <ul> <li>mesurer l'audience et reconstituer les parcours utilisateurs</li> <li>vous permettre de partager nos contenus sur les r&eacute;seaux sociaux</li> </ul> <p>Les informations que vous laissez sur nos serveurs ne sont transmises &agrave; aucun annonceur.</p> <p><strong>Suppression des cookies</strong> <br>L&rsquo;utilisateur peut &agrave; tout moment d&eacute;sactiver les cookies enregistr&eacute;s sur son terminal. Pour cela, il lui suffit de s&eacute;lectionner les param&egrave;tres appropri&eacute;s dans son navigateur. Le blocage de ces cookies par vos soins ne d&eacute;grade en rien votre navigation sur le site et l'acc&egrave;s &agrave; ses contenus.</p> <p><strong>Les diff&eacute;rents types de cookies utilis&eacute;s</strong></p> <ul> <li>Les cookies fonctionnels : ces cookies permettent de m&eacute;moriser vos pr&eacute;f&eacute;rences, vos choix afin de personnaliser votre exp&eacute;rience sur le site.</li> <li>Les cookies de performance et statistiques : ces cookies collectent des informations sur la fa&ccedil;on dont les utilisateurs utilisent le Site (le nombre de visites, le nombre de pages consult&eacute;es, l&rsquo;activit&eacute; des visiteurs) via l&rsquo;outil d&rsquo;analyse Google Analytics. Ces cookies nous permettent &eacute;galement d&rsquo;identifier et de r&eacute;soudre les probl&egrave;mes de fonctionnement du site et de l&rsquo;am&eacute;liorer. Pour en savoir plus, consultez les <a href="http://www.google.com/intl/fr/policies/privacy/" target="_blank">r&egrave;gles de confidentialit&eacute; de Google</a>. <br>Outre le blocage de ces cookies dans le navigateur, vous pouvez d&eacute;sactiver Google Analytics durant la navigation gr&acirc;ce &agrave; un module fourni par Google.</li> <li>Les cookies publicitaires : ces cookies enregistrent des informations pour vous adresser des publicit&eacute;s personnalis&eacute;es et adapt&eacute;es en fonction de vos centres d&rsquo;int&eacute;r&ecirc;ts. Ils nous aident &eacute;galement &agrave; comptabiliser l&rsquo;activit&eacute; de nos espaces publicitaires, &agrave; mesurer l&rsquo;audience, etc&hellip;</li> </ul> <p><strong>Le param&eacute;trage de vos cookies</strong> <br>Pour la gestion des cookies et de vos choix, la configuration de chaque navigateur est diff&eacute;rente. Elle est d&eacute;crite dans le menu d'aide de votre navigateur, qui vous permettra de savoir de quelle mani&egrave;re modifier vos souhaits en mati&egrave;re de cookies. Pour <a href="http://windows.microsoft.com/fr-fr/internet-explorer/delete-manage-cookies#ie=ie-11-win-7" target="_blank">Internet Explorer</a>&trade; ; pour <a href="http://support.apple.com/kb/HT1677?viewlocale=fr_FR" target="_blank">Safari</a>&trade; ; pour <a href="https://support.google.com/chrome/answer/95647?hl=fr&amp;hlrm=en" target="_blank">Chrome</a>&trade; ; pour <a href="http://help.opera.com/Windows/10.20/fr/cookies.html" target="_blank">Firefox</a>&trade; ; pour <a href="http://help.opera.com/Windows/10.20/fr/cookies.html" target="_blank">Opera</a>&trade; .</p> <h4>d. Les balises web</h4> <p>L&rsquo;Ircam utilise des balises web sur certaines pages du site qui permettent de compter le nombre de visiteurs de la page. Ces balises web peuvent &ecirc;tre utilis&eacute;es avec certains de nos partenaires commerciaux, notamment afin de mesurer et am&eacute;liorer l'efficacit&eacute; de certaines publicit&eacute;s. Les informations collect&eacute;es via ces balises web sont anonymes et permettent de conna&icirc;tre la fr&eacute;quentation de certaines pages du site, et ce afin de mieux assister les utilisateurs du site.</p> <h4>e. Les r&eacute;seaux sociaux</h4> <p>Le site utilise des plugins r&eacute;seaux sociaux tels que Facebook, Instagram, Twitter. Par exemple, si l&rsquo;utilisateur est connect&eacute; &agrave; Facebook lors de sa navigation sur le site, Facebook pourra relier sa visite &agrave; son compte utilisateur Facebook m&ecirc;me si l&rsquo;utilisateur n&rsquo;a pas utilis&eacute; le bouton de partage. Si l&rsquo;utilisateur interagit au moyen des plugins, par exemple en cliquant sur le bouton &laquo; Partager &raquo;, les informations correspondantes seront transmises et enregistr&eacute;es sur un serveur de Facebook. Elles seront publi&eacute;es sur le compte Facebook de l&rsquo;utilisateur.</p> <p>L&rsquo;Ircam ne g&egrave;re pas les donn&eacute;es collect&eacute;es par les r&eacute;seaux sociaux via les boutons. L&rsquo;utilisateur devra prendre connaissance de la politique relative &agrave; la protection des donn&eacute;es personnelles publi&eacute;e par les r&eacute;seaux sociaux concern&eacute;s et ce, afin de conna&icirc;tre les modalit&eacute;s de traitement et d&rsquo;utilisation des donn&eacute;es recueillies par ces derniers ainsi que les possibilit&eacute;s de param&eacute;trages dont il dispose pour prot&eacute;ger sa vie priv&eacute;e. Si l&rsquo;utilisateur ne souhaite pas que le r&eacute;seau social relie les informations collect&eacute;es par l&rsquo;interm&eacute;diaire de l&rsquo;Ircam &agrave; son compte utilisateur r&eacute;seau social, il doit se d&eacute;connecter du r&eacute;seau social avant de consulter le site.</p> <h4>f. Les sites d&rsquo;h&eacute;bergement de m&eacute;dias</h4> <p>Nous incluons sur notre site des applications informatiques &eacute;manant de tiers, qui permettent de visualiser des vid&eacute;os. Nous utilisons Youtube comme site d'h&eacute;bergement et de diffusion de vid&eacute;o. Pour plus d'informations, consultez les<a href="https://www.google.fr/intl/fr/policies/privacy/" target="_blank"> r&egrave;gles de confidentialit&eacute; de Google</a>.</p> <p>Nous vous invitons &agrave; consulter les politiques de protection de la vie priv&eacute;e de ce site afin de prendre connaissance des finalit&eacute;s d'utilisation des informations de navigation qu'ils peuvent recueillir.</p> <h3>3. Conditions d'utilisation des donn&eacute;es personnelles</h3> <h4>a. Quelles sont les finalit&eacute;s de la collecte et du traitement de vos donn&eacute;es personnelles ?</h4> <p>Les donn&eacute;es personnelles des utilisateurs ne sont collect&eacute;es et trait&eacute;es que pour les finalit&eacute;s suivantes :</p> <ul> <li>gestion de vos commandes (billetterie, abonnement) et de vos inscriptions &agrave; nos &eacute;v&eacute;nements,</li> <li>r&eacute;solution de tout litige &eacute;ventuel ou toute r&eacute;clamation dans le cadre de nos conditions g&eacute;n&eacute;rales de vente,</li> <li>communication avec les utilisateurs pour vous informer de nos actualit&eacute;s,</li> <li>g&eacute;n&eacute;ration de rapport statistiques sur la base de donn&eacute;es anonymis&eacute;es.</li> </ul> <h4>b. Quelle est la dur&eacute;e de conservation des donn&eacute;es collect&eacute;es ?</h4> <p>Nous conservons vos donn&eacute;es &agrave; caract&egrave;re personnel uniquement le temps n&eacute;cessaire &agrave; la r&eacute;alisation de la finalit&eacute; pour laquelle nous d&eacute;tenons ces donn&eacute;es, afin de r&eacute;pondre &agrave; vos besoins ou pour remplir nos obligations l&eacute;gales.</p> <p>Pour &eacute;tablir la dur&eacute;e de conservation de vos donn&eacute;es, nous appliquons les crit&egrave;res suivants :</p> <ul> <li>Si vous r&eacute;alisez un achat, vos donn&eacute;es sont conserv&eacute;es pour une dur&eacute;e de cinq ans au maximum apr&egrave;s le dernier contact ou la fin de la relation contractuelle.</li> <li>Si vous avez consenti &agrave; recevoir nos actualit&eacute;s, nous conservons vos donn&eacute;es &agrave; caract&egrave;re personnel jusqu&rsquo;&agrave; ce que vous proc&eacute;diez &agrave; votre d&eacute;sinscription ou jusqu&rsquo;&agrave; ce que vous nous demandiez de les supprimer ou &agrave; l&rsquo;issue d&rsquo;une p&eacute;riode d&rsquo;inactivit&eacute; d&eacute;finie conform&eacute;ment aux r&eacute;glementations.</li> <li>Si des cookies sont plac&eacute;s sur votre ordinateur, nous conservons vos donn&eacute;es uniquement le temps n&eacute;cessaire pour atteindre leur finalit&eacute; (par exemple pendant la dur&eacute;e d&rsquo;une session pour les cookies li&eacute;s au panier d&rsquo;achat ou les cookies d&rsquo;identification de session) et pour toute p&eacute;riode d&eacute;finie conform&eacute;ment aux r&eacute;glementations.</li> </ul> <p>Lorsque nous n&rsquo;avons plus besoin d&rsquo;utiliser vos donn&eacute;es &agrave; caract&egrave;re personnel, nous les effa&ccedil;ons de nos syst&egrave;mes et de nos fichiers ou proc&eacute;dons &agrave; leur anonymisation afin qu&rsquo;elles ne permettent plus de vous identifier.</p> <h4>c. Qui a acc&egrave;s &agrave; vos donn&eacute;es ?</h4> <p>Les informations recueillies sont destin&eacute;es exclusivement aux employ&eacute;s autoris&eacute;s des services administratifs, communication, p&eacute;dagogique, commercial, informatique de l'Ircam.</p> <p>Dans le but de mener &agrave; bien nos activit&eacute;s, nous sommes amen&eacute;s &agrave; communiquer vos informations personnelles &agrave; des sous-traitants comme nos prestataires informatiques ou des soci&eacute;t&eacute;s de routage de courrier. L&rsquo;Ircam s&rsquo;engage &agrave; ne communiquer vos informations et Donn&eacute;es Personnelles qu&rsquo;&agrave; des prestataires habilit&eacute;s et de confiance, qui les traitent pour notre compte, selon nos instructions et conform&eacute;ment aux pr&eacute;sentes R&egrave;gles de Confidentialit&eacute; et dans le respect de toute autre mesure appropri&eacute;e de s&eacute;curit&eacute; et de confidentialit&eacute;.</p> <h3>4. Contact pour l'exercice de vos droits</h3> <p>Conform&eacute;ment &agrave; la r&eacute;glementation applicable en mati&egrave;re de protection des donn&eacute;es personnelles, vous pouvez, &agrave; tout moment, exercer vos droits d'acc&egrave;s, de rectification, de suppression des donn&eacute;es v'''
