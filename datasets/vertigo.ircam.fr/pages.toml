title = "Accueil | Vertigo Forum"
full_description = "Forum Vertigo ven 11 mars 2022 - 14h30 - 16h30 Ircam, salle Stravinsky Connecter le vivant Entrée Libre En live Forum Vertigo ven 11 mars 2022 - 17h00 - 19h00 Ircam, salle Stravinsky L'emprise du réseau Entrée Libre En live Connnecter les mondesdu 9 au 11 mars 2022 Forum Vertigo ven 11 mars 2022 - 14h30 - 16h30 Ircam, salle Stravinsky Connecter le vivant Entrée Libre En live Forum Vertigo ven 11 mars 2022 - 17h00 - 19h00 Ircam, salle Stravinsky L'emprise du réseau Entrée Libre En live Prochains lives Voir la suite Forum Vertigo 2022 Connecter les mondesTout est réseau. Quelle est la place du réseau dans la société actuelle, innervée par les réseaux sociaux et la dématérialisation même du réseau devenu virtuel ? Plus que jamais, le réseau, à l’ère de l’Internet, ce « réseau des réseaux », est au cœur des mutations technologiques et des enjeux sociétaux (société de surveillance, omniprésence des réseaux sociaux, atomisation de l’individu, acteur-réseau). Trois journées de symposium réunissant artistes, critiques, philosophes, etc., autour de l’impact et de la signification des réseaux aujourd’hui. Lire la suite Fil Twitter #ircam Voir la suite @AhnTrio Il y a 2 heures, 43 minutes FUN FUN FUN! Can't wait! #ircam #NYU #TaeHonngPark #Gameyon3 #ahn+2 https://t.co/Tsshmadp2W @Ircam Il y a 2 jours, 4 heures 🔥CE SOIR ! 🔥 🔥#GRATUIT ! 🔥 Concert du Cursus #2 Sam 24 sep, 20h @CentrePompidou Créations des compositrices et c… https://t.co/Ua9uAjLoyV Lire la suite"
