full_description = '''Titre : App : Model : Id : Fields : Giulia Lorusso Éditer Compositrice Biographie :<p>Giulia Lorusso &eacute;tudie le piano puis la composition avec Alessandro Solbiati au conservatoire de Milan o&ugrave; elle obtient sa licence en 2014. En 2015, elle &eacute;tudie l'orchestration et l'analyse avec Allain Gaussin, puis elle suit le <a href="https://www.ircam.fr/transmission/formations-superieures/cursus/" target="_blank">Cursus de composition et d'informatique musicale de l'Ircam</a>. La m&ecirc;me ann&eacute;e, elle int&egrave;gre le Conservatoire national sup&eacute;rieur de musique et de danse de Paris en master dans la classe de composition de Fr&eacute;d&eacute;ric Durieux, et les classes de composition &eacute;lectroacoustique de Yan Maresz et Luis Na&oacute;n. Sa musique a &eacute;t&eacute; jou&eacute;e par le Quartetto Prometeo, l'Ensemble Nikel, le Divertimento Ensemble, l'Orchestre Philharmonique de Bruxelles et les solistes de l'Ensemble intercontemporain. Elle est programm&eacute;e dans plusieurs festivals, comme le festival Milano Musica, Manifeste (Ircam, Paris), Tzlil Meudcan Festival (Tel Aviv), Bludenzer Tage zeitgem&auml;&szlig;er Musik, Forum Tactus for young composers (Bruxelles).</p> App : Model : Id : Fields : Giulia Lorusso étudie le piano puis la composition avec Alessandro Solbiati au conservatoire de Milan où elle obtient sa licence en 2014. En 2015, elle étudie l'orchestration et l'analyse avec Allain Gaussin, puis elle suit le Cursus de composition et d'informatique musicale de l'Ircam. La même année, elle intègre le Conservatoire national supérieur de musique et de danse de Paris en master dans la classe de composition de Frédéric Durieux, et les classes de composition électroacoustique de Yan Maresz et Luis Naón. Sa musique a été jouée par le Quartetto Prometeo, l'Ensemble Nikel, le Divertimento Ensemble, l'Orchestre Philharmonique de Bruxelles et les solistes de l'Ensemble intercontemporain. Elle est programmée dans plusieurs festivals, comme le festival Milano Musica, Manifeste (Ircam, Paris), Tzlil Meudcan Festival (Tel Aviv), Bludenzer Tage zeitgemäßer Musik, Forum Tactus for young composers (Bruxelles). Éditer http://brahms.ircam.fr/giulia-lorusso À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Création collaborative'''
