["https://vertigo.ircam.fr/fr/person/jodi/index.html"]
title = "JODI | Vertigo Forum"
full_description = '''Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet Titre : App : Model : Id : Fields : JODI Éditer Collectif artistique Biographie :<p>JODI, <a href="jodi.org" target="_blank">jodi.org</a>, - pionnier du net.art en 1995. Bas&eacute; aux Pays-Bas, JODI a &eacute;t&eacute; parmi les premiers artistes &agrave; &eacute;tudier et &agrave; subvertir les conventions de l'Internet, des programmes informatiques et des jeux vid&eacute;o et informatiques. Ils perturbent radicalement le langage m&ecirc;me de ces syst&egrave;mes, notamment l'esth&eacute;tique visuelle, les &eacute;l&eacute;ments d'interface, les commandes, les erreurs et le code. JODI met en sc&egrave;ne des interventions num&eacute;riques extr&ecirc;mes qui d&eacute;stabilisent la relation entre la technologie informatique et ses utilisateurs en subvertissant nos attentes concernant les fonctionnalit&eacute;s et les conventions des syst&egrave;mes dont nous d&eacute;pendons tous les jours.</p> <p>Leur travail utilise la plus grande vari&eacute;t&eacute; possible de m&eacute;dias et de techniques, des installations, logiciels et sites web aux performances et expositions. Le travail de JODI figure dans la plupart des ouvrages historiques sur l'art num&eacute;rique et m&eacute;diatique et est expos&eacute; dans le monde entier.</p> App : Model : Id : Fields : JODI, jodi.org, - pionnier du net.art en 1995. Basé aux Pays-Bas, JODI a été parmi les premiers artistes à étudier et à subvertir les conventions de l'Internet, des programmes informatiques et des jeux vidéo et informatiques. Ils perturbent radicalement le langage même de ces systèmes, notamment l'esthétique visuelle, les éléments d'interface, les commandes, les erreurs et le code. JODI met en scène des interventions numériques extrêmes qui déstabilisent la relation entre la technologie informatique et ses utilisateurs en subvertissant nos attentes concernant les fonctionnalités et les conventions des systèmes dont nous dépendons tous les jours. Leur travail utilise la plus grande variété possible de médias et de techniques, des installations, logiciels et sites web aux performances et expositions. Le travail de JODI figure dans la plupart des ouvrages historiques sur l'art numérique et médiatique et est exposé dans le monde entier. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet'''
