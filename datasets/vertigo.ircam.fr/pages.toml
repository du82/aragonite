title = "Réseaux et interactions | Vertigo Forum"
description = "Les réseaux numériques, à travers leurs évolutions récentes, sont le support de nouvelles formes artistiques interactives : dispositifs d’interaction collective, performances en ligne, analyse de grands volumes de données. Ces nouvelles situations déplacent les codes de la présentation frontale, de la médiation de l'action collective et des données de l'Internet."
full_description = '''Réseaux et interactions Forum Vertigo jeu 10 mars 2022 , 17h00 - 18h30 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette table ronde en français ou en anglais Contenu :<p>Les r&eacute;seaux num&eacute;riques, &agrave; travers leurs &eacute;volutions r&eacute;centes, sont le support de nouvelles formes artistiques interactives : dispositifs d&rsquo;interaction collective, performances en ligne, analyse de grands volumes de donn&eacute;es. Ces nouvelles situations d&eacute;placent les codes de la pr&eacute;sentation frontale, de la m&eacute;diation de l'action collective et des donn&eacute;es de l'Internet.</p> <p class="wys-highlighted-paragraph">Avec <strong>Caroline Bergvall</strong> artiste<br><strong>Fr&eacute;d&eacute;ric Bevilacqua</strong> directeur de recherche, Ircam<br><strong>Samuel Bianchini</strong> artiste et enseignant-chercheur, EnsadLab<br><strong>Marta Handenawer</strong>* artiste, Domestic data streamers<br>Mod&eacute;ration <strong>Hugues Vinet</strong></p> <p>* Soutenu par <a href="https://mediafutures.eu/" target="_blank">MediaFutures</a> pour la cr&eacute;ation de l'&oelig;uvre <em>730 heures de violence</em></p> <p></p> App : Model : Id : Fields : Les réseaux numériques, à travers leurs évolutions récentes, sont le support de nouvelles formes artistiques interactives : dispositifs d’interaction collective, performances en ligne, analyse de grands volumes de données. Ces nouvelles situations déplacent les codes de la présentation frontale, de la médiation de l'action collective et des données de l'Internet. Avec Caroline Bergvall artisteFrédéric Bevilacqua directeur de recherche, IrcamSamuel Bianchini artiste et enseignant-chercheur, EnsadLabMarta Handenawer* artiste, Domestic data streamersModération Hugues Vinet * Soutenu par MediaFutures pour la création de l'œuvre 730 heures de violence Éditer En live Intervenants Artiste Caroline Bergvall Directeur de recherche Frédéric Bevilacqua Artiste Samuel Bianchini Artiste Marta Handenawer Directeur IMR, Ircam Hugues Vinet'''
