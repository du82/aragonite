["https://vertigo.ircam.fr/fr/person/simon-denny/index.html"]
title = "Simon Denny | Vertigo Forum"
full_description = "Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet Titre : App : Model : Id : Fields : Simon Denny Éditer Artiste Biographie :<p>Simon Denny (n&eacute; en 1982 &agrave; Auckland, Nouvelle-Z&eacute;lande) vit et travaille &agrave; Berlin, en Allemagne. Il r&eacute;alise des expositions qui d&eacute;ballent les implications sociales et politiques de l'industrie technologique et l'essor des m&eacute;dias sociaux, de la culture des startups, des blockchains et des crypto-monnaies, en utilisant une vari&eacute;t&eacute; de m&eacute;dias, notamment l'installation, la sculpture, l'impression et la vid&eacute;o. Il a &eacute;tudi&eacute; &agrave; l'Elam School of Fine Arts de l'universit&eacute; d'Auckland et &agrave; la St&auml;delschule de Francfort-sur-le-Main.</p> <p>Simon Denny a &eacute;t&eacute; le commissaire d'expositions importantes sur les blockchains et l'art, telles que <em>Proof of Stake au Kunstverein de Hambourg</em> (2021) et <em>Proof of Work au Schinkel Pavillon</em>, Berlin (2018). Parmi ses r&eacute;centes expositions personnelles, citons K<em>21- Kunstsammlung Nordrhein-Westfalen</em>, D&uuml;sseldorf (2020) ; le Museum of Old and New Art (Mona), Tasmanie (2019) ; MOCA, Cleveland (2018) ; OCAT, Shenzhen (2017) ; Hammer Museum, Los Angeles (2017) ; WIELS Contemporary Art Centre, Bruxelles (2016) ; Serpentine Galleries, Londres (2015) ; MoMA PS1, New York (2015) ; Portikus, Francfort (2014) MUMOK, Vienne (2013) ; Kunstverein Munich (2013).</p> <p>Il a repr&eacute;sent&eacute; la Nouvelle-Z&eacute;lande &agrave; la 56<sup>e</sup> Biennale de Venise en 2015. Ses &oelig;uvres sont repr&eacute;sent&eacute;es dans des collections institutionnelles, notamment le Kunstsammlung Nordrhein-Westfalen, (D&uuml;sseldorf), le MoMA (New York), le Walker Art Centre (Minneapolis), le Kunsthaus Z&uuml;rich (Zurich), le Sammlung zeitgen&ouml;ssischer Kunst der Bundesrepublik Deutschland (Berlin) et le Museum of New Zealand Te Papa Tongarewa (Wellington).<br>Il a cofond&eacute; le programme de mentorat d'artistes BPA//Berlin Program for Artists et a &eacute;t&eacute; professeur de Time-Based Media &agrave; la Hochschule f&uuml;r bildende K&uuml;nste Hamburg.</p> App : Model : Id : Fields : Simon Denny (né en 1982 à Auckland, Nouvelle-Zélande) vit et travaille à Berlin, en Allemagne. Il réalise des expositions qui déballent les implications sociales et politiques de l'industrie technologique et l'essor des médias sociaux, de la culture des startups, des blockchains et des crypto-monnaies, en utilisant une variété de médias, notamment l'installation, la sculpture, l'impression et la vidéo. Il a étudié à l'Elam School of Fine Arts de l'université d'Auckland et à la Städelschule de Francfort-sur-le-Main. Simon Denny a été le commissaire d'expositions importantes sur les blockchains et l'art, telles que Proof of Stake au Kunstverein de Hambourg (2021) et Proof of Work au Schinkel Pavillon, Berlin (2018). Parmi ses récentes expositions personnelles, citons K21- Kunstsammlung Nordrhein-Westfalen, Düsseldorf (2020) ; le Museum of Old and New Art (Mona), Tasmanie (2019) ; MOCA, Cleveland (2018) ; OCAT, Shenzhen (2017) ; Hammer Museum, Los Angeles (2017) ; WIELS Contemporary Art Centre, Bruxelles (2016) ; Serpentine Galleries, Londres (2015) ; MoMA PS1, New York (2015) ; Portikus, Francfort (2014) MUMOK, Vienne (2013) ; Kunstverein Munich (2013). Il a représenté la Nouvelle-Zélande à la 56e Biennale de Venise en 2015. Ses œuvres sont représentées dans des collections institutionnelles, notamment le Kunstsammlung Nordrhein-Westfalen, (Düsseldorf), le MoMA (New York), le Walker Art Centre (Minneapolis), le Kunsthaus Zürich (Zurich), le Sammlung zeitgenössischer Kunst der Bundesrepublik Deutschland (Berlin) et le Museum of New Zealand Te Papa Tongarewa (Wellington).Il a cofondé le programme de mentorat d'artistes BPA//Berlin Program for Artists et a été professeur de Time-Based Media à la Hochschule für bildende Künste Hamburg. Éditer https://simondenny.net/ À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet"
