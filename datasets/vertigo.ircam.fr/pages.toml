title = "Geert Lovink | Vertigo Forum"
full_description = '''Titre : App : Model : Id : Fields : Geert Lovink Éditer Théoricien Biographie :<p>Geert Lovink est un th&eacute;oricien n&eacute;erlandais des m&eacute;dias, critique de l'Internet et auteur de <em>Uncanny Networks</em> (2002), <em>Dark Fiber</em> (2002), <em>My First Recession</em> (2003), <em>Zero Comments</em> (2007), <em>Networks Without a Cause</em> (2012), <em>Social Media Abyss</em> (2016), O<em>rganisation after Social Media</em> (avec Ned Rossiter, 2018), <em>Sad by Design</em> (2019) et <em>Stuck on the Platform</em> (2022).</p> <p>En 2004, il a fond&eacute; l'<a href="https://networkcultures.org/" target="_blank">Institut des cultures de r&eacute;seau</a> &agrave; l'Universit&eacute; des sciences appliqu&eacute;es d'Amsterdam (HvA). Son centre organise des conf&eacute;rences, des publications et des r&eacute;seaux de recherche tels que Video Vortex (vid&eacute;o en ligne), The Future of Art Criticism et MoneyLab (mod&egrave;les de revenus bas&eacute;s sur Internet dans les arts). Ses projets r&eacute;cents portent sur les exp&eacute;riences de publication num&eacute;rique, la recherche critique sur les m&egrave;mes, les &eacute;v&eacute;nements hybrides participatifs et la pr&eacute;carit&eacute; dans le secteur cr&eacute;atif.</p> <p>En d&eacute;cembre 2021, il a &eacute;t&eacute; nomm&eacute; professeur d'art et de cultures en r&eacute;seau au d&eacute;partement d'histoire de l'art de la facult&eacute; des sciences humaines de l'universit&eacute; d'Amsterdam. La chaire (un jour par semaine jusqu'en septembre 2026) est soutenue par l'Universit&eacute; des sciences appliqu&eacute;es d'Amsterdam.</p> App : Model : Id : Fields : Geert Lovink est un théoricien néerlandais des médias, critique de l'Internet et auteur de Uncanny Networks (2002), Dark Fiber (2002), My First Recession (2003), Zero Comments (2007), Networks Without a Cause (2012), Social Media Abyss (2016), Organisation after Social Media (avec Ned Rossiter, 2018), Sad by Design (2019) et Stuck on the Platform (2022). En 2004, il a fondé l'Institut des cultures de réseau à l'Université des sciences appliquées d'Amsterdam (HvA). Son centre organise des conférences, des publications et des réseaux de recherche tels que Video Vortex (vidéo en ligne), The Future of Art Criticism et MoneyLab (modèles de revenus basés sur Internet dans les arts). Ses projets récents portent sur les expériences de publication numérique, la recherche critique sur les mèmes, les événements hybrides participatifs et la précarité dans le secteur créatif. En décembre 2021, il a été nommé professeur d'art et de cultures en réseau au département d'histoire de l'art de la faculté des sciences humaines de l'université d'Amsterdam. La chaire (un jour par semaine jusqu'en septembre 2026) est soutenue par l'Université des sciences appliquées d'Amsterdam. Éditer https://networkcultures.org/geert/biography/ À découvrir aussi Forum Vertigo Entrée Libre En live vendredi 11 mars Ircam - salle Stravinsky L'emprise du réseau'''
