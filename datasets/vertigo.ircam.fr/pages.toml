["https://vertigo.ircam.fr/fr/agenda/meet-the-forum/detail/index.html"]
title = "Meet the Forum | Vertigo Forum"
description = "Pour cette quatrième édition, venez assister à un après-midi permettant d'avoir une vue d'ensemble des technologies de l'Ircam.  Vous découvrirez les nouvelles technologies de l’Ircam sous la forme d’une introduction destinée aux débutants avec démonstrations et conférences."
full_description = '''Meet the Forum Rencontre mar 22 mars 2022 , 16h00 - 18h00 Ircam, salle StravinskyPlan d'accès Événement en présentiel et retransmis en direct sur la chaine Youtube de l'Ircam. Sous-titre :Un après-midi découverte des technologies de l'Ircam App : Model : Id : Fields : Un après-midi découverte des technologies de l'Ircam Éditer Contenu :<p>Pour cette quatri&egrave;me &eacute;dition, venez assister &agrave; un apr&egrave;s-midi permettant d'avoir une vue d'ensemble des technologies de l'Ircam.&nbsp; Vous d&eacute;couvrirez les nouvelles technologies de l&rsquo;Ircam sous la forme d&rsquo;une introduction destin&eacute;e aux d&eacute;butants avec d&eacute;monstrations et conf&eacute;rences.</p> <h3>Programme</h3> <h5>Pr&eacute;sentation des logiciels TS2, Modalys et de Plugins dans Ableton Live</h5> <p class="wys-highlighted-paragraph">avec <strong>Jean Lochard</strong>, r&eacute;alisateur en informatique musicale<br>Salle Stravinsky</p> <p>TS2 est un logiciel sp&eacute;cialis&eacute; dans le time-stretch et la transposition bas&eacute;s sur le moteur audio SuperVP&trade;. TS2 int&egrave;gre des fonctions classiques&nbsp; d&rsquo;&eacute;diteur audio avec la possibilit&eacute;s de combiner plusieurs sons dans le m&ecirc;me document et d&rsquo;effectuer des fondus. Les param&egrave;tres de transformation (time stretch, transposition, Fonctions de remix, clipping stectrale) peuvent &ecirc;tre pilot&eacute; soit par des courbes d&rsquo;automation soit directement en MIDI. Un module Master permet d&rsquo;ins&eacute;rer vos plugins favoris&nbsp; (VST2, VST3 et AudioUnit) afin de finaliser le r&eacute;sultat sonore.</p> <p>Modalys est un logiciel de synth&egrave;se sonore par mod&egrave;le physique d&eacute;velopp&eacute; &agrave; l&rsquo;Ircam. Il permet la cr&eacute;ation d&rsquo;instruments virtuels en combinant des r&eacute;sonateurs (ressort, cordes, tuyaux, membranes) et des interactions (pinc&eacute;e, frott&eacute;e, souffl&eacute;e)&hellip; Ainsi constitu&eacute;, un instrument Modalys peut &ecirc;tre contr&ocirc;l&eacute; en temps r&eacute;el dans le logiciel Max. Modalys est aussi capable de pr&eacute;voir les vibrations d&rsquo;un objet qu&rsquo;il ne conna&icirc;t pas &agrave; partir de sa forme en 3 dimensions. Il inclus &eacute;galement un contr&ocirc;leur scriptable permettant d&rsquo;ajouter encore plus de r&eacute;alisme &agrave; l&rsquo;&eacute;mulation instrumentale.</p> <p>Le Forum Ircam vous donne l&rsquo;acc&egrave;s &agrave; une s&eacute;rie de plugins Max For Live int&eacute;grant des technologies avanc&eacute;es d&eacute;velopp&eacute;es &agrave; l&rsquo;Ircam et utilisable dans le logiciel Ableton Live. Nous pr&eacute;senterons une partie d&rsquo;entre eux : Cross Synthesis (synth&egrave;ses crois&eacute;es avec SuperVP), Ladder Filter (&eacute;mulation d&rsquo;un filtre moog), Phisical LFOs (utilisation de syst&egrave;mes physique pour piloter les param&egrave;tres de Live).</p> <h5>Dispositif TACT</h5> <p class="wys-highlighted-paragraph">avec<strong> Emmanuelle Zoll, Salom&eacute; Bazin</strong><br>Galerie -2</p> <p>Tact est une &oelig;uvre visuelle et sonore sur &eacute;cran tactile qui propose au public de devenir &agrave; la fois peintre et compositeur, le temps d&rsquo;un voyage dans le paysage environnant. A la crois&eacute;e du design et de l&rsquo;informatique musicale, le dispositif est con&ccedil;u comme une oeuvre ouverte et propose &agrave; un public non expert d&rsquo;interagir avec les propositions sonores et visuelles &eacute;labor&eacute;es par des artistes et des compositeurs professionnels. <br><br>Le projet est encore en phase de prototype : venez tester en exclusivit&eacute; les proposition &laquo; work-in-progress &raquo; de Romain Barth&eacute;l&eacute;my, Fabien Bourlier, Didem Coskunseven et Lundja Medjoub autour les paysages du centre Pompidou.</p> <h5>D&ocirc;me ambisonique : les enjeux d&rsquo;un dispositif de spatialisation sonore</h5> <p class="wys-highlighted-paragraph">avec <strong>Simone Conforti</strong>, r&eacute;alisateur en informatique musicale<br>Studio 1</p> <p>Au travers d&rsquo;un syst&egrave;me de diffusion &laquo; ambisonique &raquo; nous red&eacute;couvrons notre fa&ccedil;on de percevoir le monde. Nous r&eacute;alisons la richesse des processus perceptifs de l&rsquo;audition qui nous fait &laquo; sentir &raquo;, &laquo; entendre &raquo;, &laquo; &eacute;couter &raquo; notre environnement.</p> <p>Entre les mains de cr&eacute;ateurs tel que des compositeurs, il devient un instrument qui, aussi, dessine et virtualise l&rsquo;espace. Des exemples mat&eacute;rialiseront cette technologie de projection sonore et son caract&egrave;re immersif.<br><br></p> App : Model : Id : Fields : Pour cette quatrième édition, venez assister à un après-midi permettant d'avoir une vue d'ensemble des technologies de l'Ircam. Vous découvrirez les nouvelles technologies de l’Ircam sous la forme d’une introduction destinée aux débutants avec démonstrations et conférences. Programme Présentation des logiciels TS2, Modalys et de Plugins dans Ableton Live avec Jean Lochard, réalisateur en informatique musicaleSalle Stravinsky TS2 est un logiciel spécialisé dans le time-stretch et la transposition basés sur le moteur audio SuperVP™. TS2 intègre des fonctions classiques d’éditeur audio avec la possibilités de combiner plusieurs sons dans le même document et d’effectuer des fondus. Les paramètres de transformation (time stretch, transposition, Fonctions de remix, clipping stectrale) peuvent être piloté soit par des courbes d’automation soit directement en MIDI. Un module Master permet d’insérer vos plugins favoris (VST2, VST3 et AudioUnit) afin de finaliser le résultat sonore. Modalys est un logiciel de synthèse sonore par modèle physique développé à l’Ircam. Il permet la création d’instruments virtuels en combinant des résonateurs (ressort, cordes, tuyaux, membranes) et des interactions (pincée, frottée, soufflée)… Ainsi constitué, un instrument Modalys peut être contrôlé en temps réel dans le logiciel Max. Modalys est aussi capable de prévoir les vibrations d’un objet qu’il ne connaît pas à partir de sa forme en 3 dimensions. Il inclus également un contrôleur scriptable permettant d’ajouter encore plus de réalisme à l’émulation instrumentale. Le Forum Ircam vous donne l’accès à une série de plugins Max For Live intégrant des technologies avancées développées à l’Ircam et utilisable dans le logiciel Ableton Live. Nous présenterons une partie d’entre eux : Cross Synthesis (synthèses croisées avec SuperVP), Ladder Filter (émulation d’un filtre moog), Phisical LFOs (utilisation de systèmes physique pour piloter les paramètres de Live). Dispositif TACT avec Emmanuelle Zoll, Salomé BazinGalerie -2 Tact est une œuvre visuelle et sonore sur écran tactile qui propose au public de devenir à la fois peintre et compositeur, le temps d’un voyage dans le paysage environnant. A la croisée du design et de l’informatique musicale, le dispositif est conçu comme une oeuvre ouverte et propose à un public non expert d’interagir avec les propositions sonores et visuelles élaborées par des artistes et des compositeurs professionnels. Le projet est encore en phase de prototype : venez tester en exclusivité les proposition « work-in-progress » de Romain Barthélémy, Fabien Bourlier, Didem Coskunseven et Lundja Medjoub autour les paysages du centre Pompidou. Dôme ambisonique : les enjeux d’un dispositif de spatialisation sonore avec Simone Conforti, réalisateur en informatique musicaleStudio 1 Au travers d’un système de diffusion « ambisonique » nous redécouvrons notre façon de percevoir le monde. Nous réalisons la richesse des processus perceptifs de l’audition qui nous fait « sentir », « entendre », « écouter » notre environnement. Entre les mains de créateurs tel que des compositeurs, il devient un instrument qui, aussi, dessine et virtualise l’espace. Des exemples matérialiseront cette technologie de projection sonore et son caractère immersif. Éditer Le public sera réparti en plusieurs groupes, il est donc indispensable d'arriver à l'heure indiquée. https://forum.ircam.fr/agenda/ateliers-du-forum-paris-2022-meet-the-forum/detail/'''
year_published = 2022
clearnet = "https://vertigo.ircam.fr/fr/agenda/meet-the-forum/detail/index.html"
