["https://vertigo.ircam.fr/fr/person/caroline-bergvall/index.html"]
title = "Caroline Bergvall | Vertigo Forum"
full_description = "Titre : App : Model : Id : Fields : Caroline Bergvall Éditer Artiste Biographie :<p>Caroline Bergvall d'origine fran&ccedil;aise et norv&eacute;gienne vivant &agrave; Londres, est une artiste prim&eacute;e, po&eacute;tesse, &eacute;crivaine, performeuse et consultante en pratiques artistiques. Son travail se nourrit des formes de l&rsquo;art, des m&eacute;dias et des langues. Ses projets comprennent des &oelig;uvres po&eacute;tiques, des pi&egrave;ces audio, des dessins, des installations et des &laquo; live performances &raquo; qui repoussent souvent les limites du langage li&eacute;es &agrave; celui des langages utilis&eacute;s pour des &eacute;v&eacute;nements politiques et historiques difficiles.</p> <p>Ses expositions/commissions incluent entre autres la Tate Modern (Londres), le Hammer Museum (LA), la Fondation Vuitton (Paris), la Fundacio Tapi&egrave;s (Barcelone), le Jewish Museum (Munich) et le Khoj Centre (New Delhi). Parmi ses &oelig;uvres de textes hybrides : la trilogie <em>Meddle English</em> (2005), <em>Drift</em> (2011) et <em>Alisoun Sings</em> (2019).</p> <p>Son cycle de performances sp&eacute;cifiques en cours <em>Sonic Atlas</em> (2016-2022) explore le son, le lieu et les langues multiples en conversation avec des locuteurs de langues minoritaires et victimes de pr&eacute;jug&eacute;s au Royaume-Uni et dans l'Union europ&eacute;enne. Il comprend la performance au lever du soleil Ragadawn, la conf&eacute;rence conversationnelle des oiseaux, l'&eacute;criture collaborative en ligne Night &amp; Refuge et le nocturne Nattsong.</p> <p>Pour ses productions po&eacute;tiques et artistiques, elle a re&ccedil;u le prix Cholmondeley (Royaume-Uni, 2017) et le prix litt&eacute;raire Bernard Heidsieck-Centre Pompidou (Paris, 2017). Ancienne directrice du programme innovant d'&eacute;criture inter-arts au Dartington College, elle a re&ccedil;u des bourses dont la Judith E. Wilson Fellowship, universit&eacute; de Cambridge, Whitechapel Gallery, Gray Melon Collaborative Fellowship, Chicago (2016). Elle est professeur invit&eacute; d'anglais au King's College de Londres et sera Kelly Writers House Fellow &agrave; l'universit&eacute; de Pennsylvanie (mars 2022).</p> App : Model : Id : Fields : Caroline Bergvall d'origine française et norvégienne vivant à Londres, est une artiste primée, poétesse, écrivaine, performeuse et consultante en pratiques artistiques. Son travail se nourrit des formes de l’art, des médias et des langues. Ses projets comprennent des œuvres poétiques, des pièces audio, des dessins, des installations et des « live performances » qui repoussent souvent les limites du langage liées à celui des langages utilisés pour des événements politiques et historiques difficiles. Ses expositions/commissions incluent entre autres la Tate Modern (Londres), le Hammer Museum (LA), la Fondation Vuitton (Paris), la Fundacio Tapiès (Barcelone), le Jewish Museum (Munich) et le Khoj Centre (New Delhi). Parmi ses œuvres de textes hybrides : la trilogie Meddle English (2005), Drift (2011) et Alisoun Sings (2019). Son cycle de performances spécifiques en cours Sonic Atlas (2016-2022) explore le son, le lieu et les langues multiples en conversation avec des locuteurs de langues minoritaires et victimes de préjugés au Royaume-Uni et dans l'Union européenne. Il comprend la performance au lever du soleil Ragadawn, la conférence conversationnelle des oiseaux, l'écriture collaborative en ligne Night & Refuge et le nocturne Nattsong. Pour ses productions poétiques et artistiques, elle a reçu le prix Cholmondeley (Royaume-Uni, 2017) et le prix littéraire Bernard Heidsieck-Centre Pompidou (Paris, 2017). Ancienne directrice du programme innovant d'écriture inter-arts au Dartington College, elle a reçu des bourses dont la Judith E. Wilson Fellowship, université de Cambridge, Whitechapel Gallery, Gray Melon Collaborative Fellowship, Chicago (2016). Elle est professeur invité d'anglais au King's College de Londres et sera Kelly Writers House Fellow à l'université de Pennsylvanie (mars 2022). Éditer https://carolinebergvall.com/ À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Réseaux et interactions"
