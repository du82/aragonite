title = "Jean-Colas Prunier | Vertigo Forum"
full_description = '''Titre : App : Model : Id : Fields : Jean-Colas Prunier Éditer Fondateur de PocketStudio Biographie :<p>Jean-Colas a plus de 25 ans d'exp&eacute;rience dans l'industrie de l'animation et des effets sp&eacute;ciaux num&eacute;riques. Il a travaill&eacute; chez ILM et Weta Digital sur plus de 20 films dont 5 ont re&ccedil;u un Academy Award dans la cat&eacute;gorie des effets sp&eacute;ciaux. Au cours des 5 derni&egrave;res ann&eacute;es, Jean-Colas a travaill&eacute; sur le d&eacute;veloppement de logiciels en temps r&eacute;el pour la production de contenu cin&eacute;matographique. Il est l'un des experts mondiaux en la mati&egrave;re. Il travaille maintenant comme architecte des produits &agrave; <a href="https://www.pocketstudio.io/" target="_blank">PocketStudio</a> et en est &eacute;galement le fondateur de cette soci&eacute;t&eacute;.</p> App : Model : Id : Fields : Jean-Colas a plus de 25 ans d'expérience dans l'industrie de l'animation et des effets spéciaux numériques. Il a travaillé chez ILM et Weta Digital sur plus de 20 films dont 5 ont reçu un Academy Award dans la catégorie des effets spéciaux. Au cours des 5 dernières années, Jean-Colas a travaillé sur le développement de logiciels en temps réel pour la production de contenu cinématographique. Il est l'un des experts mondiaux en la matière. Il travaille maintenant comme architecte des produits à PocketStudio et en est également le fondateur de cette société. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Création collaborative'''
