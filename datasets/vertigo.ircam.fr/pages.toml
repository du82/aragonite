["https://vertigo.ircam.fr/fr/agenda/les-reseaux-a-lere-post-internet/detail/index.html"]
title = "Les réseaux à l'ère post-internet | Vertigo Forum"
description = "Un art en réseau s’est élaboré, issu des mouvances hackers et nourri des pratiques de programmation collaborative à code ouvert. Les médias sociaux sont au cœur des enjeux actuels et les échanges de données permis par les technologies de blockchain ont généré un monde de « multi-utilisateurs » qui pose la question de l’auteur et de l’unicité de l’œuvre. Des satires sociales et politiques font aussi la critique d’un réseau totalisateur et vertical, à la dimension addictive et dépressive, loin de l’utopie émancipatrice du réseau au début de l’ère numérique."
full_description = '''Les réseaux à l'ère post-internet Forum Vertigo jeu 10 mars 2022 , 15h00 - 16h30 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette table ronde en français ou en anglais Contenu :<p>Un art en r&eacute;seau s&rsquo;est &eacute;labor&eacute;, issu des mouvances hackers et nourri des pratiques de programmation collaborative &agrave; code ouvert. Les m&eacute;dias sociaux sont au c&oelig;ur des enjeux actuels et les &eacute;changes de donn&eacute;es permis par les technologies de blockchain ont g&eacute;n&eacute;r&eacute; un monde de &laquo; multi-utilisateurs &raquo; qui pose la question de l&rsquo;auteur et de l&rsquo;unicit&eacute; de l&rsquo;&oelig;uvre. Des satires sociales et politiques font aussi la critique d&rsquo;un r&eacute;seau totalisateur et vertical, &agrave; la dimension addictive et d&eacute;pressive, loin de l&rsquo;utopie &eacute;mancipatrice du r&eacute;seau au d&eacute;but de l&rsquo;&egrave;re num&eacute;rique.</p> <p class="wys-highlighted-paragraph">Avec <strong>Yacine A&iuml;t Kaci</strong> artiste num&eacute;rique, Elyx<br><strong>Simon Denny</strong> artiste et professeur, HFBK Hambourg<br><strong>JODI</strong> collectif artistique<br><strong>Rybn.org</strong> collectif artistique<br>Mod&eacute;ration <strong>Jean-Paul Fourmentraux</strong> professeur, universit&eacute; Aix-Marseille</p> App : Model : Id : Fields : Un art en réseau s’est élaboré, issu des mouvances hackers et nourri des pratiques de programmation collaborative à code ouvert. Les médias sociaux sont au cœur des enjeux actuels et les échanges de données permis par les technologies de blockchain ont généré un monde de « multi-utilisateurs » qui pose la question de l’auteur et de l’unicité de l’œuvre. Des satires sociales et politiques font aussi la critique d’un réseau totalisateur et vertical, à la dimension addictive et dépressive, loin de l’utopie émancipatrice du réseau au début de l’ère numérique. Avec Yacine Aït Kaci artiste numérique, ElyxSimon Denny artiste et professeur, HFBK HambourgJODI collectif artistiqueRybn.org collectif artistiqueModération Jean-Paul Fourmentraux professeur, université Aix-Marseille Éditer Visuel : Impression digitale sur planche du "Milton Bradley’s Game of Life Twists & Turns", spinner et cartes bancaires, structure de rack de serveur, plexiglas découpe laser, pièces de rack de serveur. 72 x 100 x 23 cm Courtesy of the artist and Buchholz Gallery, Berlin/Cologne/New York Photo © Nick Ash En live Intervenants Artiste numérique Yacine Aït Kaci Artiste Simon Denny Collectif artistique JODI Collectif artistique Rybn.org Socio-anthropologue Jean-Paul Fourmentraux'''
