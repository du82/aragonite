["https://vertigo.ircam.fr/fr/edito.html"]
title = "Forum Vertigo « Connecter les mondes » | Vertigo Forum"
description = "Tout est réseau. Quelle est la place du réseau dans la société actuelle, innervée par les réseaux sociaux et la dématérialisation même du réseau devenu virtuel ? Plus que jamais, le réseau, à l’ère de l’Internet, ce « réseau des réseaux », est au cœur des mutations technologiques et des enjeux sociétaux (société de surveillance, omniprésence des réseaux sociaux, atomisation de l’individu, acteur-réseau). Depuis l’irruption de la pandémie Covid-19, la prégnance des réseaux dans la création artistique s’en trouve accrue tant pour les aspects de production que de forme et de diffusion des œuvres. Le premier réseau est aussi celui du vivant, qui relie les espaces entre elles, générateur de nouvelles formes de « connexités »."
full_description = 'Titre : App : Model : Id : Fields : Forum Vertigo « Connecter les mondes » Éditer Contenu :<p>Tout est r&eacute;seau. Quelle est la place du r&eacute;seau dans la soci&eacute;t&eacute; actuelle, innerv&eacute;e par les r&eacute;seaux sociaux et la d&eacute;mat&eacute;rialisation m&ecirc;me du r&eacute;seau devenu virtuel ? Plus que jamais, le r&eacute;seau, &agrave; l&rsquo;&egrave;re de l&rsquo;Internet, ce &laquo; r&eacute;seau des r&eacute;seaux &raquo;, est au c&oelig;ur des mutations technologiques et des enjeux soci&eacute;taux (soci&eacute;t&eacute; de surveillance, omnipr&eacute;sence des r&eacute;seaux sociaux, atomisation de l&rsquo;individu, acteur-r&eacute;seau). Depuis l&rsquo;irruption de la pand&eacute;mie Covid-19, la pr&eacute;gnance des r&eacute;seaux dans la cr&eacute;ation artistique s&rsquo;en trouve accrue tant pour les aspects de production que de forme et de diffusion des &oelig;uvres. Le premier r&eacute;seau est aussi celui du vivant, qui relie les espaces entre elles, g&eacute;n&eacute;rateur de nouvelles formes de &laquo; connexit&eacute;s &raquo;.</p> <p>Autour de l&rsquo;exposition &laquo; R&eacute;seaux-Mondes &raquo;&nbsp; au Centre Pompidou (23 f&eacute;vrier-25 avril 2022), dans le cadre du cycle Mutations / Cr&eacute;ations, trois journ&eacute;es de symposium r&eacute;uniront artistes, critiques,philosophes, etc., autour de l&rsquo;impact et de la signification des r&eacute;seaux aujourd&rsquo;hui.</p> <p class="wys-highlighted-paragraph">Production<strong> Ircam-Centre Pompidou</strong><br>Programmation g&eacute;n&eacute;rale <strong>Frank Madlener</strong> et <strong>Hugues Vinet</strong> (Ircam), <strong>Mathieu Potte-Bonneville</strong> (DCC-Centre Pompidou), <strong>Marie-Ange Brayer</strong> et <strong>Olivier Zeitoun</strong> (Mnam-Cci-Centre Pompidou)<br>Avec le soutien du minist&egrave;re de la Culture, du CNRS</p> App : Model : Id : Fields : Tout est réseau. Quelle est la place du réseau dans la société actuelle, innervée par les réseaux sociaux et la dématérialisation même du réseau devenu virtuel ? Plus que jamais, le réseau, à l’ère de l’Internet, ce « réseau des réseaux », est au cœur des mutations technologiques et des enjeux sociétaux (société de surveillance, omniprésence des réseaux sociaux, atomisation de l’individu, acteur-réseau). Depuis l’irruption de la pandémie Covid-19, la prégnance des réseaux dans la création artistique s’en trouve accrue tant pour les aspects de production que de forme et de diffusion des œuvres. Le premier réseau est aussi celui du vivant, qui relie les espaces entre elles, générateur de nouvelles formes de « connexités ». Autour de l’exposition « Réseaux-Mondes » au Centre Pompidou (23 février-25 avril 2022), dans le cadre du cycle Mutations / Créations, trois journées de symposium réuniront artistes, critiques,philosophes, etc., autour de l’impact et de la signification des réseaux aujourd’hui. Production Ircam-Centre PompidouProgrammation générale Frank Madlener et Hugues Vinet (Ircam), Mathieu Potte-Bonneville (DCC-Centre Pompidou), Marie-Ange Brayer et Olivier Zeitoun (Mnam-Cci-Centre Pompidou)Avec le soutien du ministère de la Culture, du CNRS Éditer'
