["https://vertigo.ircam.fr/fr/person/neri-oxman/index.html"]
title = "Neri Oxman | Vertigo Forum"
full_description = '''Titre : App : Model : Id : Fields : Neri Oxman Éditer Architecte Biographie :<p>Salu&eacute;e comme l'architecte de la nature, Neri Oxman est une designeuse, une cr&eacute;atrice et une chercheuse. Son approche et sa philosophie du design, intitul&eacute;es Material Ecology (&eacute;cologie mat&eacute;rielle), se situent &agrave; l'intersection de la culture et de la nature, appelant &agrave; l'unification du fabriqu&eacute; et du cultiv&eacute; &agrave; travers les &eacute;poques et les esp&egrave;ces.</p> <p>Conceptrice multidisciplinaire, Mme Oxman a fond&eacute; en 2010 le Mediated Matter Group au Massachusetts Institute of Technology, o&ugrave; elle a ouvert la voie &agrave; l'&eacute;cologie mat&eacute;rielle, en fusionnant la technologie et la biologie pour cr&eacute;er des designs conformes aux principes de la durabilit&eacute; &eacute;cologique. <br>Neri Oxman est devenue professeur titulaire au MIT en 2017, o&ugrave; elle a obtenu son doctorat de Design informatique en 2010. Elle a &eacute;galement &eacute;t&eacute; dipl&ocirc;m&eacute;e de l&rsquo;Architectural Association de Londres.</p> <p>Avec plus de 150 publications scientifiques et d&rsquo;inventions, ses &oelig;uvres sont dans des collections de mus&eacute;es internationaux et reconnues par le Word Economic Forum. En 2020, son travail a &eacute;t&eacute; pr&eacute;sent&eacute; dans une exposition monographique au Mus&eacute;e d'art moderne du Centre Pompidou. Parmi les distinctions, Neri Oxman a re&ccedil;u notamment le Cooper Hewitt National Design Award, la Design Innovation Medal, le RIBA Honorary Fellowship et le SFMOMA Contemporary Vision Award.</p> <p>Elle est la fondatrice et la directrice g&eacute;n&eacute;rale d'<a href="https://oxman.com/" target="_blank">OXMAN</a>.</p> <p>Photo : Neri Oxman &copy; photo : Joi Ito</p> App : Model : Id : Fields : Saluée comme l'architecte de la nature, Neri Oxman est une designeuse, une créatrice et une chercheuse. Son approche et sa philosophie du design, intitulées Material Ecology (écologie matérielle), se situent à l'intersection de la culture et de la nature, appelant à l'unification du fabriqué et du cultivé à travers les époques et les espèces. Conceptrice multidisciplinaire, Mme Oxman a fondé en 2010 le Mediated Matter Group au Massachusetts Institute of Technology, où elle a ouvert la voie à l'écologie matérielle, en fusionnant la technologie et la biologie pour créer des designs conformes aux principes de la durabilité écologique. Neri Oxman est devenue professeur titulaire au MIT en 2017, où elle a obtenu son doctorat de Design informatique en 2010. Elle a également été diplômée de l’Architectural Association de Londres. Avec plus de 150 publications scientifiques et d’inventions, ses œuvres sont dans des collections de musées internationaux et reconnues par le Word Economic Forum. En 2020, son travail a été présenté dans une exposition monographique au Musée d'art moderne du Centre Pompidou. Parmi les distinctions, Neri Oxman a reçu notamment le Cooper Hewitt National Design Award, la Design Innovation Medal, le RIBA Honorary Fellowship et le SFMOMA Contemporary Vision Award. Elle est la fondatrice et la directrice générale d'OXMAN. Photo : Neri Oxman © photo : Joi Ito Éditer https://oxman.com/ À découvrir aussi Forum Vertigo Entrée Libre En live vendredi 11 mars Ircam - salle Stravinsky Connecter le vivant'''
