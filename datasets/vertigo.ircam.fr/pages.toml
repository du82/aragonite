["https://vertigo.ircam.fr/fr/person/alexander-r-galloway/index.html"]
title = "Alexander R. Galloway | Vertigo Forum"
full_description = '''Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Keynote « Lire, écrire, exécuter : quelles sont les machines qui déterminent la pensée ? » Titre : App : Model : Id : Fields : Alexander R. Galloway Éditer Auteur Biographie :<p>Alexander R. Galloway (1974) est auteur et professeur au D&eacute;partement des m&eacute;dias, de la culture et de la communication de l'<a href="https://www.nyu.edu/" target="_blank">Universit&eacute; de New York</a>. Il est titulaire d'une licence de l'Universit&eacute; Brown et a obtenu un doctorat en litt&eacute;rature de l'Universit&eacute; Duke en 2001. Galloway est connu pour ses &eacute;crits sur la philosophie, la th&eacute;orie des m&eacute;dias, l'art contemporain, le cin&eacute;ma et les jeux vid&eacute;o, parmi lesquels <em>The Exploit : A theory of Networks avec Eugene Thacker</em> (2007). Il collabore en 2013 avec Eugene Thacker et McKenzie Wark pour l&rsquo;ouvrage <em>Excommunication: Three Inquiries in Media and Mediation</em>.</p> App : Model : Id : Fields : Alexander R. Galloway (1974) est auteur et professeur au Département des médias, de la culture et de la communication de l'Université de New York. Il est titulaire d'une licence de l'Université Brown et a obtenu un doctorat en littérature de l'Université Duke en 2001. Galloway est connu pour ses écrits sur la philosophie, la théorie des médias, l'art contemporain, le cinéma et les jeux vidéo, parmi lesquels The Exploit : A theory of Networks avec Eugene Thacker (2007). Il collabore en 2013 avec Eugene Thacker et McKenzie Wark pour l’ouvrage Excommunication: Three Inquiries in Media and Mediation. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Keynote « Lire, écrire, exécuter : quelles sont les machines qui déterminent la pensée ? »'''
