["https://vertigo.ircam.fr/fr/agenda/lemprise-du-reseau/detail/index.html"]
title = "L'emprise du réseau | Vertigo Forum"
description = "Les réseaux numériques qui émergent au XXIe siècle laissent deviner la censure, la société de surveillance, et se révèlent au cœur de systèmes ubiquitaires, invisibles et mercantiles. Alors que les individus dépendent aujourd’hui entièrement des plateformes technologiques, de quelles nouvelles infrastructures de contrôle serions-nous les cibles ?"
full_description = '''L'emprise du réseau Forum Vertigo ven 11 mars 2022 , 17h00 - 19h00 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette table ronde en français ou en anglais Contenu :<p>Les r&eacute;seaux num&eacute;riques qui &eacute;mergent au XXI<sup>e</sup> si&egrave;cle laissent deviner la censure, la soci&eacute;t&eacute; de surveillance, et se r&eacute;v&egrave;lent au c&oelig;ur de syst&egrave;mes ubiquitaires, invisibles et mercantiles. Alors que les individus d&eacute;pendent aujourd&rsquo;hui enti&egrave;rement des plateformes technologiques, de quelles nouvelles infrastructures de contr&ocirc;le serions-nous les cibles ?</p> <p class="wys-highlighted-paragraph">Avec <strong>Wendy Hui Kyong Chun</strong> autrice et professeur, universit&eacute; Simon Fraser (Canada) <br><strong>Geert Lovink</strong> professeur, universit&eacute; d'Amsterdam<br><strong>Jill Magid</strong> artiste<br><strong>Mika Tajima</strong> artiste<br>Mod&eacute;ration <strong>Yves Citton</strong> auteur et professeur, universit&eacute; Paris 8, directeur d'ArTeC</p> App : Model : Id : Fields : Les réseaux numériques qui émergent au XXIe siècle laissent deviner la censure, la société de surveillance, et se révèlent au cœur de systèmes ubiquitaires, invisibles et mercantiles. Alors que les individus dépendent aujourd’hui entièrement des plateformes technologiques, de quelles nouvelles infrastructures de contrôle serions-nous les cibles ? Avec Wendy Hui Kyong Chun autrice et professeur, université Simon Fraser (Canada) Geert Lovink professeur, université d'AmsterdamJill Magid artisteMika Tajima artisteModération Yves Citton auteur et professeur, université Paris 8, directeur d'ArTeC Éditer Visuel : Programme d’analyse predictif des sentiments personnalisé, moteur de jeu, Alienware VR PC, Twitter API; vidéo, couleur; durée infinie. Dimensions variables. Vue de l'installation. "Mika Tajima: PSYCHO GRAPHICS", Kayne Griffin Corcoran, Los Angeles 2019 © Mika Tajima. Courtesy of the artist, Kayne Griffin Corcoran (Los Angeles), Taro Nasu (Tokyo) En live Intervenants Autrice Wendy Hui Kyong Chun Théoricien Geert Lovink Artiste Jill Magid Artiste Mika Tajima Auteur Yves Citton'''
