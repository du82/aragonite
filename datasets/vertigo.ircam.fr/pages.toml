full_description = '''Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Le réseau : l’un et le multiple Titre : App : Model : Id : Fields : Elizabeth Diller Éditer Artiste Biographie :<p>Elizabeth Diller, de <a href="https://dsrny.com/" target="_blank">Diller Scofidio + Renfro</a> (DS+R). Aux c&ocirc;t&eacute;s de son partenaire Ricardo Scofidio, le travail transgenre d'Elizabeth Diller a &eacute;t&eacute; distingu&eacute; par la liste des &laquo; 100 personnes les plus influentes &raquo; du <em>Time</em> et par la premi&egrave;re bourse de la Fondation MacArthur attribu&eacute;e dans le domaine de l'architecture.</p> <p>En 2020, E. Diller a &eacute;galement &eacute;t&eacute; intronis&eacute;e dans l'ordre des Arts et des Lettres par le ministre fran&ccedil;ais de la Culture. Plus r&eacute;cemment, elle a dirig&eacute; deux projets qui ont remodel&eacute; le paysage culturel de New York : The Shed et l'expansion du MoMA. Elle a co-cr&eacute;&eacute;, dirig&eacute; et produit <em>The Mile-Long Opera</em>, une &oelig;uvre chorale immersive mise en sc&egrave;ne sur la High Line, et a r&eacute;cemment con&ccedil;u la sc&eacute;nographie de Cartier et l'art islamique : <em>In search of modernity</em>, au mus&eacute;e des Arts d&eacute;coratifs de Paris en 2021. Elizabeth Diller est professeur de conception architecturale &agrave; l'universit&eacute; de Princeton</p> App : Model : Id : Fields : Elizabeth Diller, de Diller Scofidio + Renfro (DS+R). Aux côtés de son partenaire Ricardo Scofidio, le travail transgenre d'Elizabeth Diller a été distingué par la liste des « 100 personnes les plus influentes » du Time et par la première bourse de la Fondation MacArthur attribuée dans le domaine de l'architecture. En 2020, E. Diller a également été intronisée dans l'ordre des Arts et des Lettres par le ministre français de la Culture. Plus récemment, elle a dirigé deux projets qui ont remodelé le paysage culturel de New York : The Shed et l'expansion du MoMA. Elle a co-créé, dirigé et produit The Mile-Long Opera, une œuvre chorale immersive mise en scène sur la High Line, et a récemment conçu la scénographie de Cartier et l'art islamique : In search of modernity, au musée des Arts décoratifs de Paris en 2021. Elizabeth Diller est professeur de conception architecturale à l'université de Princeton Éditer https://dsrny.com/ À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Le réseau : l’un et le multiple'''
