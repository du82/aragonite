["https://vertigo.ircam.fr/fr/person/marta-handenawer/index.html"]
title = "Marta Handenawer | Vertigo Forum"
full_description = '''Titre : App : Model : Id : Fields : Marta Handenawer Éditer Artiste Biographie :<p>Directrice de la cr&eacute;ation et de la conception du design, bas&eacute;e &agrave; Barcelone, travail combinant narration, interaction sociale et art &agrave; <a href="https://domesticstreamers.com/" target="_blank">Domestic Data Streamers</a>, o&ugrave; elle s'attache &agrave; repenser la relation entre les gens et l'information. En tant que directrice de l'&eacute;quipe, elle exp&eacute;rimente des pratiques artistiques et des donn&eacute;es pour susciter des projets participatifs qui construisent une communaut&eacute; et g&eacute;n&egrave;rent de l'empathie : parce que le monde ne peut pas &ecirc;tre compris sans des chiffres, mais il ne le sera pas avec les seuls chiffres.</p> <p>Ces derni&egrave;res ann&eacute;es, Marta Handenawer a dirig&eacute; des projets li&eacute;s aux base de donn&eacute;es pour des clients tels que l'Unicef, TED, Oxfam Interm&oacute;n et le Mus&eacute;e du design de Barcelone. Elle est &eacute;galement conf&eacute;renci&egrave;re invit&eacute;e &agrave; ELISAVA (&Eacute;cole de design et d'ing&eacute;nierie de Barcelone) et &agrave; l'IaaC en Espagne.</p> App : Model : Id : Fields : Directrice de la création et de la conception du design, basée à Barcelone, travail combinant narration, interaction sociale et art à Domestic Data Streamers, où elle s'attache à repenser la relation entre les gens et l'information. En tant que directrice de l'équipe, elle expérimente des pratiques artistiques et des données pour susciter des projets participatifs qui construisent une communauté et génèrent de l'empathie : parce que le monde ne peut pas être compris sans des chiffres, mais il ne le sera pas avec les seuls chiffres. Ces dernières années, Marta Handenawer a dirigé des projets liés aux base de données pour des clients tels que l'Unicef, TED, Oxfam Intermón et le Musée du design de Barcelone. Elle est également conférencière invitée à ELISAVA (École de design et d'ingénierie de Barcelone) et à l'IaaC en Espagne. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Réseaux et interactions'''
