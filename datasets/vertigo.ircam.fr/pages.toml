["https://vertigo.ircam.fr/fr/person/jill-magid/index.html"]
title = "Jill Magid | Vertigo Forum"
full_description = "Titre : App : Model : Id : Fields : Jill Magid Éditer Artiste Biographie :<p>Jill Magid est une artiste, &eacute;crivaine et r&eacute;alisatrice am&eacute;ricaine. Son travail interroge les structures de pouvoir &agrave; un niveau intime, explorant les tensions &eacute;motionnelles, philosophiques et l&eacute;gales qui existent entre les institutions et l'agencement individuel. Elle a &eacute;t&eacute; expos&eacute;e en solo notamment &agrave; The Renaissance Society, Chicago ; &agrave; la Tate Modern, Londres ; &agrave; Dia Bridgehampton ; au Museo Universitario de Arte Contempor&aacute;neo, Mexico ; au San Francisco Art Institute ; au Whitney Museum of American Art, New York ; au Berkeley Museum of Art, Californie ; &agrave; la Tate Liverpool ; et &agrave; l'Agence de s&eacute;curit&eacute; et de renseignement des Pays-Bas.</p> <p>Son premier long m&eacute;trage <em>The Proposal</em> (2018), command&eacute; par Field of Vision et distribu&eacute; aux &Eacute;tats-Unis par Oscilloscope Laboratories, a &eacute;t&eacute; pr&eacute;sent&eacute; en avant-premi&egrave;re au Tribeca Film Festival et a re&ccedil;u de nombreux prix prestigieux lors de festivals. Son travail fait partie des collections du Centre Pompidou, du Whitney Museum of American Art, de la Fundacion Jumex et du Walker Art Center, entre autres. Magid a re&ccedil;u une bourse Guggenheim en 2021, une subvention du VIA Art Fund en 2021, une commission d'artiste Creative Time en 2020 et le prix Calder en 2017.</p> App : Model : Id : Fields : Jill Magid est une artiste, écrivaine et réalisatrice américaine. Son travail interroge les structures de pouvoir à un niveau intime, explorant les tensions émotionnelles, philosophiques et légales qui existent entre les institutions et l'agencement individuel. Elle a été exposée en solo notamment à The Renaissance Society, Chicago ; à la Tate Modern, Londres ; à Dia Bridgehampton ; au Museo Universitario de Arte Contemporáneo, Mexico ; au San Francisco Art Institute ; au Whitney Museum of American Art, New York ; au Berkeley Museum of Art, Californie ; à la Tate Liverpool ; et à l'Agence de sécurité et de renseignement des Pays-Bas. Son premier long métrage The Proposal (2018), commandé par Field of Vision et distribué aux États-Unis par Oscilloscope Laboratories, a été présenté en avant-première au Tribeca Film Festival et a reçu de nombreux prix prestigieux lors de festivals. Son travail fait partie des collections du Centre Pompidou, du Whitney Museum of American Art, de la Fundacion Jumex et du Walker Art Center, entre autres. Magid a reçu une bourse Guggenheim en 2021, une subvention du VIA Art Fund en 2021, une commission d'artiste Creative Time en 2020 et le prix Calder en 2017. Éditer http://www.jillmagid.com À découvrir aussi Forum Vertigo Entrée Libre En live vendredi 11 mars Ircam - salle Stravinsky L'emprise du réseau"
