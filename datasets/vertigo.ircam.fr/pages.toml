["https://vertigo.ircam.fr/fr/agenda/keynote-lire-ecrire-executer-quelles-sont-les-machines-qui-determinent-la-pensee/detail/index.html"]
title = "Keynote « Lire, écrire, exécuter : quelles sont les machines qui déterminent la pensée ? » | Vertigo Forum"
description = "Quelles sont les machines qui déterminent la pensée ? Nous pouvons aborder cette question de plusieurs manières. L'approche typique consiste à envisager (ou peut-être même à élaborer) une philosophie des médias. On parle alors d'études ou de théorie des médias, où les artefacts médiatiques sont considérés comme des objets de la pensée. Mais il existe aussi une autre approche, celle du média de la philosophie, où les conditions a priori de la philosophie elles-mêmes occupent le devant de la scène, englobant la pensée comme une sorte d'objet. Car si « les médias déterminent notre situation », comme l'a dit Friedrich Kittler, ainsi qu’il l’a notoirement formulé, n'est-il pas vrai également que les philosophies s’adaptent en fonction des conditions changeantes de la technologie des médias ? Dans cette conférence, nous explorerons une série d’arguments philosophiques venant du domaine des machines et des ordinateurs – le Grundig de Heidegger, le Schreibkugel de Nietzsche, le Macintosh Plus de Derrida, le réseau neuronal de Malabou – comme toile de fond pour un autre type d'enquête, à savoir que nos instruments d'écriture non seulement contribuent à nos pensées, mais que nos pensées elles-mêmes sont aussi des instruments."
full_description = '''Keynote « Lire, écrire, exécuter : quelles sont les machines qui déterminent la pensée ? » Forum Vertigo jeu 10 mars 2022 , 14h30 - 15h00 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette keynote en français ou en anglais Contenu :<p>Quelles sont les machines qui d&eacute;terminent la pens&eacute;e ? Nous pouvons aborder cette question de plusieurs mani&egrave;res. L'approche typique consiste &agrave; envisager (ou peut-&ecirc;tre m&ecirc;me &agrave; &eacute;laborer) une philosophie des m&eacute;dias. On parle alors d'&eacute;tudes ou de th&eacute;orie des m&eacute;dias, o&ugrave; les artefacts m&eacute;diatiques sont consid&eacute;r&eacute;s comme des objets de la pens&eacute;e. Mais il existe aussi une autre approche, celle du m&eacute;dia de la philosophie, o&ugrave; les conditions a priori de la philosophie elles-m&ecirc;mes occupent le devant de la sc&egrave;ne, englobant la pens&eacute;e comme une sorte d'objet. Car si &laquo; les m&eacute;dias d&eacute;terminent notre situation &raquo;, comme l'a dit Friedrich Kittler, ainsi qu&rsquo;il l&rsquo;a notoirement formul&eacute;, n'est-il pas vrai &eacute;galement que les philosophies s&rsquo;adaptent en fonction des conditions changeantes de la technologie des m&eacute;dias ? Dans cette conf&eacute;rence, nous explorerons une s&eacute;rie d&rsquo;arguments philosophiques venant du domaine des machines et des ordinateurs &ndash; le Grundig de Heidegger, le Schreibkugel de Nietzsche, le Macintosh Plus de Derrida, le r&eacute;seau neuronal de Malabou &ndash; comme toile de fond pour un autre type d'enqu&ecirc;te, &agrave; savoir que nos instruments d'&eacute;criture non seulement contribuent &agrave; nos pens&eacute;es, mais que nos pens&eacute;es elles-m&ecirc;mes sont aussi des instruments.</p> <p class="wys-highlighted-paragraph">Avec <strong>Alexander R. Galloway</strong> auteur et professeur au D&eacute;partement des m&eacute;dias, de la culture et de la communication, Universit&eacute; de New York</p> App : Model : Id : Fields : Quelles sont les machines qui déterminent la pensée ? Nous pouvons aborder cette question de plusieurs manières. L'approche typique consiste à envisager (ou peut-être même à élaborer) une philosophie des médias. On parle alors d'études ou de théorie des médias, où les artefacts médiatiques sont considérés comme des objets de la pensée. Mais il existe aussi une autre approche, celle du média de la philosophie, où les conditions a priori de la philosophie elles-mêmes occupent le devant de la scène, englobant la pensée comme une sorte d'objet. Car si « les médias déterminent notre situation », comme l'a dit Friedrich Kittler, ainsi qu’il l’a notoirement formulé, n'est-il pas vrai également que les philosophies s’adaptent en fonction des conditions changeantes de la technologie des médias ? Dans cette conférence, nous explorerons une série d’arguments philosophiques venant du domaine des machines et des ordinateurs – le Grundig de Heidegger, le Schreibkugel de Nietzsche, le Macintosh Plus de Derrida, le réseau neuronal de Malabou – comme toile de fond pour un autre type d'enquête, à savoir que nos instruments d'écriture non seulement contribuent à nos pensées, mais que nos pensées elles-mêmes sont aussi des instruments. Avec Alexander R. Galloway auteur et professeur au Département des médias, de la culture et de la communication, Université de New York Éditer En live Intervenant Auteur Alexander R. Galloway'''
