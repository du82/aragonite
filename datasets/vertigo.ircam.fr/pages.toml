title = "Pierre Musso | Vertigo Forum"
full_description = 'Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Keynote « Critique de la raison et de la ruse du réseau » Titre : App : Model : Id : Fields : Pierre Musso Éditer Chercheur Biographie :<p>Pierre Musso, philosophe de formation, est professeur des universit&eacute;s, docteur d&rsquo;&Eacute;tat en science politique, chercheur &agrave; <a href="https://www.telecom-paris.fr/" target="_blank">T&eacute;l&eacute;com Paris</a>. Il est l&rsquo;auteur de nombreux ouvrages sur les r&eacute;seaux, la philosophie de Saint-Simon et l&rsquo;imaginaire politique et industriel, parmi lesquels <em>Critique des r&eacute;seaux</em> (PUF, 2003), <em>La religion industrielle</em> (Fayard, 2017), <em>Le temps de l&rsquo;&Eacute;tat-Entreprise</em> (Fayard, 2019). Il vient de publier <em>L&rsquo;imaginaire du r&eacute;seau</em> (Manucius, 2022).</p> App : Model : Id : Fields : Pierre Musso, philosophe de formation, est professeur des universités, docteur d’État en science politique, chercheur à Télécom Paris. Il est l’auteur de nombreux ouvrages sur les réseaux, la philosophie de Saint-Simon et l’imaginaire politique et industriel, parmi lesquels Critique des réseaux (PUF, 2003), La religion industrielle (Fayard, 2017), Le temps de l’État-Entreprise (Fayard, 2019). Il vient de publier L’imaginaire du réseau (Manucius, 2022). Éditer À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Keynote « Critique de la raison et de la ruse du réseau »'
