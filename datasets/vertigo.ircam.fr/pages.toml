["https://vertigo.ircam.fr/fr/person/claire-bidart/index.html"]
title = "Claire Bidart | Vertigo Forum"
full_description = '''Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Le réseau : l’un et le multiple Titre : App : Model : Id : Fields : Claire Bidart Éditer Sociologue Biographie :<p>Claire Bidart est n&eacute;e en 1960. Elle est sociologue, directrice de recherche au <a href="https://www.cnrs.fr/fr/page-daccueil" target="_blank">CNRS</a> (LEST, Aix-Marseille Universit&eacute; et CNRS, Aix en Provence). Sa th&egrave;se de doctorat en 1993 portait sur la sociabilit&eacute; et l&rsquo;amiti&eacute;. Elle travaille depuis sur la dynamique des r&eacute;seaux personnels et les parcours de vie.</p> <p>Elle a con&ccedil;u et dirig&eacute; une enqu&ecirc;te longitudinale, le &laquo; Panel de Caen &raquo;, qui a suivi sur vingt ans une population de jeunes qui ont &eacute;t&eacute; r&eacute;interrog&eacute;s tous les trois ans, entre 1995 et 2015. Ses travaux avec Michel Grossetti et Alain Degenne ont abouti &agrave; la publication de l'ouvrage <em>La vie en r&eacute;seau</em> (PUF), ainsi qu'&agrave; divers travaux exploratoires, m&eacute;thodologiques en particulier. Elle a aussi travaill&eacute; sur la jeunesse, les parcours de vie, les temporalit&eacute;s biographiques, les bifurcations, sur l&rsquo;insertion professionnelle, sur le rapport au travail et ses &eacute;volutions, et sur les processus de socialisation plus g&eacute;n&eacute;ralement. Elle pr&eacute;pare un ouvrage collectif sur les r&eacute;seaux personnels et les &eacute;v&eacute;nements biographiques et participe &agrave; une grande enqu&ecirc;te sur le devenir des relations sociales en temps de pand&eacute;mie.</p> App : Model : Id : Fields : Claire Bidart est née en 1960. Elle est sociologue, directrice de recherche au CNRS (LEST, Aix-Marseille Université et CNRS, Aix en Provence). Sa thèse de doctorat en 1993 portait sur la sociabilité et l’amitié. Elle travaille depuis sur la dynamique des réseaux personnels et les parcours de vie. Elle a conçu et dirigé une enquête longitudinale, le « Panel de Caen », qui a suivi sur vingt ans une population de jeunes qui ont été réinterrogés tous les trois ans, entre 1995 et 2015. Ses travaux avec Michel Grossetti et Alain Degenne ont abouti à la publication de l'ouvrage La vie en réseau (PUF), ainsi qu'à divers travaux exploratoires, méthodologiques en particulier. Elle a aussi travaillé sur la jeunesse, les parcours de vie, les temporalités biographiques, les bifurcations, sur l’insertion professionnelle, sur le rapport au travail et ses évolutions, et sur les processus de socialisation plus généralement. Elle prépare un ouvrage collectif sur les réseaux personnels et les événements biographiques et participe à une grande enquête sur le devenir des relations sociales en temps de pandémie. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Le réseau : l’un et le multiple'''
