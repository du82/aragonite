["https://vertigo.ircam.fr/fr/person/lonneke-gordijnralph-nauta/index.html"]
title = "Lonneke Gordijn/Ralph Nauta | Vertigo Forum"
full_description = '''Titre : App : Model : Id : Fields : Lonneke Gordijn/Ralph Nauta Éditer designers Biographie :<p>Les artistes n&eacute;erlandais Lonneke Gordijn (1980) et Ralph Nauta (1978) ont fond&eacute; <a href="https://studiodrift.com/" target="_blank">DRIFT</a> en 2007. Avec une &eacute;quipe pluridisciplinaire de 64 personnes, ils travaillent sur des sculptures, des installations et des performances exp&eacute;rientielles. DRIFT manifeste les ph&eacute;nom&egrave;nes et les propri&eacute;t&eacute;s cach&eacute;es de la nature &agrave; l'aide de la technologie afin d'apprendre des m&eacute;canismes sous-jacents de la Terre et de r&eacute;tablir notre lien avec elle. Avec &agrave; la fois profondeur et simplicit&eacute;, les &oelig;uvres d'art de DRIFT mettent en lumi&egrave;re les parall&egrave;les entre les structures artificielles et naturelles par le biais de processus d&eacute;constructifs, interactifs et innovants. Les artistes soul&egrave;vent des questions fondamentales sur ce qu'est la vie et explorent un sc&eacute;nario positif pour l'avenir. Toutes les &oelig;uvres d'art individuelles ont la capacit&eacute; de transformer les espaces. Les param&egrave;tres confin&eacute;s d'un mus&eacute;e ou d'une galerie ne rendent pas toujours justice &agrave; un ensemble d'&oelig;uvres, qui trouvent plut&ocirc;t leur potentiel dans la sph&egrave;re publique ou dans l'architecture. DRIFT met les gens, l'espace et la nature sur la m&ecirc;me fr&eacute;quence, unissant les publics avec des exp&eacute;riences qui inspirent une reconnexion avec notre plan&egrave;te. DRIFT a r&eacute;alis&eacute; de nombreuses expositions et projets dans le monde entier. Leur travail a &eacute;t&eacute; expos&eacute; au Victoria &amp; Albert Museum (2009, 2015) ; Met Museum (2010) ; Stedelijk Museum (2018) ; UTA Artist Space (2019) ; Garage Museum (2019) ; Mint Museum (2019) ; Biennale di Venezia (2015) ; Pace Gallery (2017) entre autres. Leurs &oelig;uvres font partie des collections permanentes du LACMA, du Rijksmuseum, du SFMOMA, du Stedelijk Museum et du Victoria &amp; Albert Museum. En 2014, Drift a re&ccedil;u le prix Arte Laguna, &agrave; Venise.</p> App : Model : Id : Fields : Les artistes néerlandais Lonneke Gordijn (1980) et Ralph Nauta (1978) ont fondé DRIFT en 2007. Avec une équipe pluridisciplinaire de 64 personnes, ils travaillent sur des sculptures, des installations et des performances expérientielles. DRIFT manifeste les phénomènes et les propriétés cachées de la nature à l'aide de la technologie afin d'apprendre des mécanismes sous-jacents de la Terre et de rétablir notre lien avec elle. Avec à la fois profondeur et simplicité, les œuvres d'art de DRIFT mettent en lumière les parallèles entre les structures artificielles et naturelles par le biais de processus déconstructifs, interactifs et innovants. Les artistes soulèvent des questions fondamentales sur ce qu'est la vie et explorent un scénario positif pour l'avenir. Toutes les œuvres d'art individuelles ont la capacité de transformer les espaces. Les paramètres confinés d'un musée ou d'une galerie ne rendent pas toujours justice à un ensemble d'œuvres, qui trouvent plutôt leur potentiel dans la sphère publique ou dans l'architecture. DRIFT met les gens, l'espace et la nature sur la même fréquence, unissant les publics avec des expériences qui inspirent une reconnexion avec notre planète. DRIFT a réalisé de nombreuses expositions et projets dans le monde entier. Leur travail a été exposé au Victoria & Albert Museum (2009, 2015) ; Met Museum (2010) ; Stedelijk Museum (2018) ; UTA Artist Space (2019) ; Garage Museum (2019) ; Mint Museum (2019) ; Biennale di Venezia (2015) ; Pace Gallery (2017) entre autres. Leurs œuvres font partie des collections permanentes du LACMA, du Rijksmuseum, du SFMOMA, du Stedelijk Museum et du Victoria & Albert Museum. En 2014, Drift a reçu le prix Arte Laguna, à Venise. Éditer https://studiodrift.com/ À découvrir aussi Forum Vertigo Entrée Libre En live vendredi 11 mars Ircam - salle Stravinsky Connecter le vivant'''
