title = "Keynote « Critique de la raison et de la ruse du réseau » | Vertigo Forum"
description = "Aujourd’hui tout est réseau, aussi bien dans la société et ses technologies que dans les imaginaires et l’épistémologie. L’omniprésence et l’omnipotence du réticulé doivent être questionnées à la fois comme concept et comme représentation sociale. La critique de la raison du réseau permet de le définir comme un lien de lieux et un intermonde entre la technique et le corps. La généalogie du concept met en évidence sa plasticité : il a successivement pris dans ses rets le corps vivant, puis la nature et enfin la société. Désormais usé, le concept de réseau se dégrade en une technologie de l’esprit devenue un passe-partout."
full_description = '''Keynote « Critique de la raison et de la ruse du réseau » Forum Vertigo mer 9 mars 2022 , 14h30 - 15h00 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette keynote en français ou en anglais Contenu :<p>Aujourd&rsquo;hui tout est r&eacute;seau, aussi bien dans la soci&eacute;t&eacute; et ses technologies que dans les imaginaires et l&rsquo;&eacute;pist&eacute;mologie. L&rsquo;omnipr&eacute;sence et l&rsquo;omnipotence du r&eacute;ticul&eacute; doivent &ecirc;tre questionn&eacute;es &agrave; la fois comme concept et comme repr&eacute;sentation sociale. La critique de la raison du r&eacute;seau permet de le d&eacute;finir comme un lien de lieux et un intermonde entre la technique et le corps. La g&eacute;n&eacute;alogie du concept met en &eacute;vidence sa plasticit&eacute; : il a successivement pris dans ses rets le corps vivant, puis la nature et enfin la soci&eacute;t&eacute;. D&eacute;sormais us&eacute;, le concept de r&eacute;seau se d&eacute;grade en une technologie de l&rsquo;esprit devenue un passe-partout.</p> <p>La critique de la ruse du r&eacute;seau met au jour l&rsquo;ambivalence de son imaginaire alternant communication et surveillance. L&rsquo;horizontalit&eacute; du R&eacute;seau est souvent oppos&eacute;e &agrave; la verticalit&eacute; de l&rsquo;Arbre pour dessiner le devenir des institutions, voire le futur des soci&eacute;t&eacute;s. Ainsi l&rsquo;imaginaire du r&eacute;seau est-il porteur d&rsquo;une techno-utopie promettant la transformation sociale par la technique, &agrave; commencer par l&rsquo;Internet.</p> <p>La combinaison de la raison et de la ruse du r&eacute;seau, c&rsquo;est-&agrave;-dire le ficelage d&rsquo;un paradigme et d&rsquo;une utopie technologique, fonde le grand r&eacute;cit contemporain du r&eacute;seau que nous avons nomm&eacute; &laquo; la r&eacute;tiologie &raquo;.</p> <p class="wys-highlighted-paragraph">avec <strong>Pierre Musso</strong> chercheur, T&eacute;l&eacute;com Paris</p> App : Model : Id : Fields : Aujourd’hui tout est réseau, aussi bien dans la société et ses technologies que dans les imaginaires et l’épistémologie. L’omniprésence et l’omnipotence du réticulé doivent être questionnées à la fois comme concept et comme représentation sociale. La critique de la raison du réseau permet de le définir comme un lien de lieux et un intermonde entre la technique et le corps. La généalogie du concept met en évidence sa plasticité : il a successivement pris dans ses rets le corps vivant, puis la nature et enfin la société. Désormais usé, le concept de réseau se dégrade en une technologie de l’esprit devenue un passe-partout. La critique de la ruse du réseau met au jour l’ambivalence de son imaginaire alternant communication et surveillance. L’horizontalité du Réseau est souvent opposée à la verticalité de l’Arbre pour dessiner le devenir des institutions, voire le futur des sociétés. Ainsi l’imaginaire du réseau est-il porteur d’une techno-utopie promettant la transformation sociale par la technique, à commencer par l’Internet. La combinaison de la raison et de la ruse du réseau, c’est-à-dire le ficelage d’un paradigme et d’une utopie technologique, fonde le grand récit contemporain du réseau que nous avons nommé « la rétiologie ». avec Pierre Musso chercheur, Télécom Paris Éditer Visuel : Regard de Brian Price sur "Patterns of Life" (2015) de Julien Prévieux. Installation temporaire, laine, colle à chaud / 400 x 220 cm. Blackwood Gallery, Toronto, Canada © Julien Prévieux. Photo © Toni Hafkenscheid En live Intervenant Chercheur Pierre Musso'''
