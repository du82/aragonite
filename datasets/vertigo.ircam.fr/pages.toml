["https://vertigo.ircam.fr/fr/person/yacine-ait-kaci/index.html"]
title = "Yacine Aït Kaci | Vertigo Forum"
full_description = '''Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet Titre : App : Model : Id : Fields : Yacine Aït Kaci Éditer Artiste numérique Biographie :<p>N&eacute; &agrave; Paris en 1973, Yacine A&iuml;t Kaci est un artiste fran&ccedil;ais pionnier des m&eacute;dias interactifs (DVD-ROM du Louvre en 1999, &hellip;) et des arts num&eacute;riques. En 2000, Yacine cr&eacute;e aux c&ocirc;t&eacute;s de Naziha Mestaoui le collectif Electronic Shadow qui ouvre la voie &agrave; l&rsquo;hybridation du r&eacute;el et du virtuel. Electronic Shadow r&eacute;alise de nombreuses installations immersives et spectacles vivants, remporte plusieurs prix internationaux, tels que Ars Electronica (2004), Japan Media Art Festival (2005) et le Laval Virtuel (2004,2005)</p> <p>La d&eacute;cennie suivante, Yacine all&egrave;ge son processus cr&eacute;atif. Il reprend le dessin et cr&eacute;e <a href="https://elyx.noxaka.com/" target="_blank">ELYX</a>, le fait vivre dans la ville gr&acirc;ce &agrave; l&rsquo;&eacute;mergence des r&eacute;seaux sociaux. Le digital street art est n&eacute; et avec lui le fabuleux destin d&rsquo;ELYX. En 2015, ELYX devient le premier et unique Ambassadeur digital des Nations Unies. La m&ecirc;me ann&eacute;e, Yacine est l&rsquo;artiste invit&eacute; de la COP21, et ELYX est &agrave; la table des n&eacute;gociations des Accords de Paris. Le projet artistique devient incontestablement politique. En 2018, il cr&eacute;e avec Adeline Pilon la Fondation &eacute;ponyme qui participera &agrave; endosser les multiples facettes de l&rsquo;artiste entre Art, Innovation, Engagement et Vision&hellip;</p> App : Model : Id : Fields : Né à Paris en 1973, Yacine Aït Kaci est un artiste français pionnier des médias interactifs (DVD-ROM du Louvre en 1999, …) et des arts numériques. En 2000, Yacine crée aux côtés de Naziha Mestaoui le collectif Electronic Shadow qui ouvre la voie à l’hybridation du réel et du virtuel. Electronic Shadow réalise de nombreuses installations immersives et spectacles vivants, remporte plusieurs prix internationaux, tels que Ars Electronica (2004), Japan Media Art Festival (2005) et le Laval Virtuel (2004,2005) La décennie suivante, Yacine allège son processus créatif. Il reprend le dessin et crée ELYX, le fait vivre dans la ville grâce à l’émergence des réseaux sociaux. Le digital street art est né et avec lui le fabuleux destin d’ELYX. En 2015, ELYX devient le premier et unique Ambassadeur digital des Nations Unies. La même année, Yacine est l’artiste invité de la COP21, et ELYX est à la table des négociations des Accords de Paris. Le projet artistique devient incontestablement politique. En 2018, il crée avec Adeline Pilon la Fondation éponyme qui participera à endosser les multiples facettes de l’artiste entre Art, Innovation, Engagement et Vision… Éditer https://elyx.noxaka.com/ À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet'''
