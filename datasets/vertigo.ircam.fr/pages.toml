["https://vertigo.ircam.fr/fr/person/dominique-cardon/index.html"]
title = "Dominique Cardon | Vertigo Forum"
full_description = 'Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Le réseau : l’un et le multiple Titre : App : Model : Id : Fields : Dominique Cardon Éditer Sociologue Biographie :<p>Dominique Cardon est professeur de sociologie &agrave; Sciences Po o&ugrave; il dirige le <a href="https://medialab.sciencespo.fr/" target="_blank">M&eacute;dialab</a>.</p> <p>Ses travaux portent sur les usages d&rsquo;Internet et les transformations de l&rsquo;espace public num&eacute;rique. Ses recherches r&eacute;centes portent sur les r&eacute;seaux sociaux de l&rsquo;Internet, les formes d&rsquo;identit&eacute; en ligne, l&rsquo;autoproduction amateur et l&rsquo;analyse des formes de coop&eacute;ration et de gouvernance dans les grands collectifs en ligne. Il conduit aujourd&rsquo;hui une analyse sociologique des algorithmes permettant d&rsquo;organiser l&rsquo;information sur le web.</p> <p>Il a notamment publi&eacute; <em>La d&eacute;mocratie Internet</em>, Paris, Seuil/La R&eacute;publique des id&eacute;es, 2010, <em>&Agrave; quoi r&ecirc;vent les algorithmes. Nos vies &agrave; l&rsquo;heure des big data</em>, Paris, Seuil/R&eacute;publique des id&eacute;es, 2015 et, avec Jean-Philippe Heurtin, <em>Chor&eacute;graphier la g&eacute;n&eacute;rosit&eacute;. Le T&eacute;l&eacute;thon, le don et la critique</em>, Paris, Economica, 2016.</p> App : Model : Id : Fields : Dominique Cardon est professeur de sociologie à Sciences Po où il dirige le Médialab. Ses travaux portent sur les usages d’Internet et les transformations de l’espace public numérique. Ses recherches récentes portent sur les réseaux sociaux de l’Internet, les formes d’identité en ligne, l’autoproduction amateur et l’analyse des formes de coopération et de gouvernance dans les grands collectifs en ligne. Il conduit aujourd’hui une analyse sociologique des algorithmes permettant d’organiser l’information sur le web. Il a notamment publié La démocratie Internet, Paris, Seuil/La République des idées, 2010, À quoi rêvent les algorithmes. Nos vies à l’heure des big data, Paris, Seuil/République des idées, 2015 et, avec Jean-Philippe Heurtin, Chorégraphier la générosité. Le Téléthon, le don et la critique, Paris, Economica, 2016. Éditer https://medialab.sciencespo.fr/equipe/dominique-cardon/ À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Le réseau : l’un et le multiple'
