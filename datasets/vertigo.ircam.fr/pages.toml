["https://vertigo.ircam.fr/fr/person/jean-paul-fourmentraux/index.html"]
title = "Jean-Paul Fourmentraux | Vertigo Forum"
full_description = "Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet Titre : App : Model : Id : Fields : Jean-Paul Fourmentraux Éditer Socio-anthropologue Biographie :<p>Jean-Paul Fourmentraux, socio-anthropologue (PhD) est professeur de philosophie et sociologie des arts et m&eacute;dias &agrave; l&rsquo;universit&eacute; Aix-Marseille. Il dirige des recherches (HDR Sorbonne) au Centre Norbert Elias (UMR-CNRS 8562) de l&rsquo;&Eacute;cole des hautes &eacute;tudes en sciences sociales (EHESS). Initiateur du programme Art-Science-Soci&eacute;t&eacute; de l'Institut m&eacute;diterran&eacute;en d'&eacute;tudes avanc&eacute;es (IM&eacute;RA), il est &eacute;galement membre de l&rsquo;Association internationale des critiques d&rsquo;art (AICA). Ses travaux interdisciplinaires portent sur les enjeux politiques et anthropologiques des arts et des technologies contemporaines.</p> <p>Il est l&rsquo;auteur des ouvrages <em>Art et internet</em> (CNRS, 2005, r&eacute;&eacute;d. 2010), <em>Artistes de laboratoire</em> (Hermann, 2011), <em>L&rsquo;&oelig;uvre commune</em> (Presses du r&eacute;el, 2012), <em>L&rsquo;&OElig;uvre virale. Net art et culture hacker</em> (La Lettre Vol&eacute;e, 2013), <em>antiDATA, la d&eacute;sob&eacute;issance num&eacute;rique</em> (Presses du r&eacute;el, 2020) et a dirig&eacute; les ouvrages <em>L&rsquo;&Egrave;re post-media</em> (Hermann, 2012), <em>Art et science</em> (CNRS, 2012), <em>Identit&eacute;s num&eacute;riques</em> (CNRS, 2015), <em>Digital Stories</em> (Hermann, 2016), <em>Images interactives</em> (La Lettre Vol&eacute;e, 2017). Dernier ouvrage : <em>antiDATA, la d&eacute;sob&eacute;issance num&eacute;rique</em>.</p> App : Model : Id : Fields : Jean-Paul Fourmentraux, socio-anthropologue (PhD) est professeur de philosophie et sociologie des arts et médias à l’université Aix-Marseille. Il dirige des recherches (HDR Sorbonne) au Centre Norbert Elias (UMR-CNRS 8562) de l’École des hautes études en sciences sociales (EHESS). Initiateur du programme Art-Science-Société de l'Institut méditerranéen d'études avancées (IMéRA), il est également membre de l’Association internationale des critiques d’art (AICA). Ses travaux interdisciplinaires portent sur les enjeux politiques et anthropologiques des arts et des technologies contemporaines. Il est l’auteur des ouvrages Art et internet (CNRS, 2005, rééd. 2010), Artistes de laboratoire (Hermann, 2011), L’œuvre commune (Presses du réel, 2012), L’Œuvre virale. Net art et culture hacker (La Lettre Volée, 2013), antiDATA, la désobéissance numérique (Presses du réel, 2020) et a dirigé les ouvrages L’Ère post-media (Hermann, 2012), Art et science (CNRS, 2012), Identités numériques (CNRS, 2015), Digital Stories (Hermann, 2016), Images interactives (La Lettre Volée, 2017). Dernier ouvrage : antiDATA, la désobéissance numérique. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Les réseaux à l'ère post-internet"
