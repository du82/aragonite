["https://vertigo.ircam.fr/fr/person/andrea-cera/index.html"]
title = "Andrea Cera | Vertigo Forum"
full_description = '''Titre : App : Model : Id : Fields : Andrea Cera Éditer Compositeur Biographie :<p>Andrea Cera (n&eacute; en 1969) est un compositeur &eacute;lectroacoustique et designer sonore italien. Le travail d'Andrea Cera tourne autour de l'hybridation de r&eacute;f&eacute;rences culturelles et explore une forme de design sonore &agrave; basse intrusivit&eacute;. Il collabore avec l'<a href="https://www.stms-lab.fr/" target="_blank">UMR-STMS</a> (Ircam-CNRS-Sorbonne Universit&eacute;), et plus particuli&egrave;rement l'&eacute;quipe <a href="https://www.stms-lab.fr/team/perception-et-design-sonores/" target="_blank">Perception et Design sonores</a> et le centre de recherche Infomus (universit&eacute; de G&ecirc;nes).</p> <p>En 2018, il re&ccedil;oit la nomination &laquo; Better Sound &raquo; dans la cat&eacute;gorie &laquo; Research &amp; Development &raquo; aux International Sound Awards, pour le design sonore du concept car Renault Symbioz.</p> App : Model : Id : Fields : Andrea Cera (né en 1969) est un compositeur électroacoustique et designer sonore italien. Le travail d'Andrea Cera tourne autour de l'hybridation de références culturelles et explore une forme de design sonore à basse intrusivité. Il collabore avec l'UMR-STMS (Ircam-CNRS-Sorbonne Université), et plus particulièrement l'équipe Perception et Design sonores et le centre de recherche Infomus (université de Gênes). En 2018, il reçoit la nomination « Better Sound » dans la catégorie « Research & Development » aux International Sound Awards, pour le design sonore du concept car Renault Symbioz. Éditer https://www.andreacera.info/ À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Création collaborative'''
