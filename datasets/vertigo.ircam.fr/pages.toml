["https://vertigo.ircam.fr/fr/agenda/creation-collaborative/detail/index.html"]
title = "Création collaborative | Vertigo Forum"
full_description = '''Création collaborative Forum Vertigo mer 9 mars 2022 , 17h00 - 18h30 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette table ronde en français ou en anglais Contenu :<p>La dimension collaborative tend &agrave; se g&eacute;n&eacute;raliser dans la cr&eacute;ation, proc&eacute;dant &agrave; la fois de la compl&eacute;mentarit&eacute; des m&eacute;tiers, de la pluridisciplinarit&eacute; des projets et d&rsquo;un renouvellement des processus cr&eacute;atifs &agrave; travers le collectif. En cette p&eacute;riode particuli&egrave;re o&ugrave; le r&eacute;seau concentre une part importante des &eacute;changes, dans quelle mesure et selon quelles modes op&eacute;ratoires soutient-il une production et une cr&eacute;ativit&eacute; collectives ?</p> <p class="wys-highlighted-paragraph">Avec <strong>Andrea Cera</strong> compositeur et sound designer<br><strong>Giulia Lorusso</strong>* compositrice<br><strong>Eric Maestri</strong> compositeur, membre du collectif nu/thing/<br><strong>Jean-Colas Prunier</strong> fondateur de PocketStudio<br><strong>Elio Suhamy</strong> r&eacute;alisateur cin&eacute;ma et enseignant<br>Mod&eacute;ration <strong>Hugues Vinet</strong></p> <p>* Participante &agrave; l&rsquo;Atelier &laquo; Collaboratory Project &raquo; du projet europ&eacute;en Ulysses, subventionn&eacute; par le programme Europe cr&eacute;ative de l&rsquo;Union europ&eacute;e</p> App : Model : Id : Fields : La dimension collaborative tend à se généraliser dans la création, procédant à la fois de la complémentarité des métiers, de la pluridisciplinarité des projets et d’un renouvellement des processus créatifs à travers le collectif. En cette période particulière où le réseau concentre une part importante des échanges, dans quelle mesure et selon quelles modes opératoires soutient-il une production et une créativité collectives ? Avec Andrea Cera compositeur et sound designerGiulia Lorusso* compositriceEric Maestri compositeur, membre du collectif nu/thing/Jean-Colas Prunier fondateur de PocketStudioElio Suhamy réalisateur cinéma et enseignantModération Hugues Vinet * Participante à l’Atelier « Collaboratory Project » du projet européen Ulysses, subventionné par le programme Europe créative de l’Union europée Éditer Visuel : Installation in situ, 2022. Courtesy DRIFT & Carpenters Workshop Gallery. Verre, raccords sur mesure, LEDs, algorythme, senseurs électroniques. Courtesy Carpenters Workshop Gallery © Studio Drift. Photo © Gert-Jan van Rooij, Stedelijk Museum Amsterdam En live Intervenants Compositeur Andrea Cera Compositrice Giulia Lorusso Compositeur Éric Maestri Fondateur de PocketStudio Jean-Colas Prunier Cinéaste Elio Suhamy Directeur IMR, Ircam Hugues Vinet'''
