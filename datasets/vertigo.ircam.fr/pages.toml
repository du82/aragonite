title = "Mika Tajima | Vertigo Forum"
full_description = "Titre : App : Model : Id : Fields : Mika Tajima Éditer Artiste Biographie :<p>Mika Tajima est une artiste dont la pratique mat&eacute;rialise des techniques d&eacute;velopp&eacute;es pour fa&ccedil;onner la physicalit&eacute;, la productivit&eacute; et les d&eacute;sirs du corps humain. Ses sculptures, peintures, vid&eacute;os et installations se concentrent sur l'exp&eacute;rience incarn&eacute;e du contr&ocirc;le ortho-architectonique et de la vie informatique. Des syst&egrave;mes architecturaux au design ergonomique en passant par les donn&eacute;es psychographiques, les &oelig;uvres de Tajima op&egrave;rent dans l'espace entre l'immat&eacute;riel et le tangible pour cr&eacute;er des rencontres exacerb&eacute;es qui ciblent les sens et les &eacute;motions du spectateur, soulignant la dynamique du contr&ocirc;le et de l'agence.</p> <p>Mika Tajima est n&eacute;e &agrave; Los Angeles, CA et vit et travaille &agrave; New York, NY. Elle est titulaire d'une licence en beaux-arts et en &eacute;tudes est-asiatiques du Bryn Mawr College, Bryn Mawr, PA, et d'un MFA de la Columbia University, School of the Arts, New York, NY. Parmi les expositions s&eacute;lectionn&eacute;es, citons : Okayama Art Summit, Okayama, Japon ; &AElig;ther &agrave; Borusan Contemporary, Istanbul, Turquie ; TOUCHLESS, Taro Nasu Gallery, Tokyo, Japon ; Dirty Protests, The Hammer Museum, Los Angeles, CA ; Programmed, Whitney Museum of American Art, New York, NY ; COLORI, Castello di Rivoli et GAM, Turin, Italie ; All Watched Overby Machines of Loving Grace, Palais de Tokyo, Paris, France ; Meridian (Gold), Sculpture Center, New York, NY. Les collections publiques comprennent : Centre Pompidou, Paris, France ; Los Angeles County Museum of Art, Los Angeles, CA ; Hammer Museum, Los Angeles, CA ; San Francisco Museum of Modern Art, San Francisco, CA ; Dallas Museum of Art, Dallas, TX ; Albright-Know Art Gallery, Buffalo, NY ; Hirschhorn Museum and Sculpture Garden, Washington, D.C.</p> App : Model : Id : Fields : Mika Tajima est une artiste dont la pratique matérialise des techniques développées pour façonner la physicalité, la productivité et les désirs du corps humain. Ses sculptures, peintures, vidéos et installations se concentrent sur l'expérience incarnée du contrôle ortho-architectonique et de la vie informatique. Des systèmes architecturaux au design ergonomique en passant par les données psychographiques, les œuvres de Tajima opèrent dans l'espace entre l'immatériel et le tangible pour créer des rencontres exacerbées qui ciblent les sens et les émotions du spectateur, soulignant la dynamique du contrôle et de l'agence. Mika Tajima est née à Los Angeles, CA et vit et travaille à New York, NY. Elle est titulaire d'une licence en beaux-arts et en études est-asiatiques du Bryn Mawr College, Bryn Mawr, PA, et d'un MFA de la Columbia University, School of the Arts, New York, NY. Parmi les expositions sélectionnées, citons : Okayama Art Summit, Okayama, Japon ; Æther à Borusan Contemporary, Istanbul, Turquie ; TOUCHLESS, Taro Nasu Gallery, Tokyo, Japon ; Dirty Protests, The Hammer Museum, Los Angeles, CA ; Programmed, Whitney Museum of American Art, New York, NY ; COLORI, Castello di Rivoli et GAM, Turin, Italie ; All Watched Overby Machines of Loving Grace, Palais de Tokyo, Paris, France ; Meridian (Gold), Sculpture Center, New York, NY. Les collections publiques comprennent : Centre Pompidou, Paris, France ; Los Angeles County Museum of Art, Los Angeles, CA ; Hammer Museum, Los Angeles, CA ; San Francisco Museum of Modern Art, San Francisco, CA ; Dallas Museum of Art, Dallas, TX ; Albright-Know Art Gallery, Buffalo, NY ; Hirschhorn Museum and Sculpture Garden, Washington, D.C. Éditer http://mikatajima.com/ À découvrir aussi Forum Vertigo Entrée Libre En live vendredi 11 mars Ircam - salle Stravinsky L'emprise du réseau"
