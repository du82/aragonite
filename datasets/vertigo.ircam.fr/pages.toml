["https://vertigo.ircam.fr/fr/person/olivier-zeitoun/index.html"]
title = "Olivier Zeitoun | Vertigo Forum"
full_description = 'Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Introduction et présentation de l’exposition « Réseaux-mondes » Titre : App : Model : Id : Fields : Olivier Zeitoun Éditer Attaché de conservation Biographie :<p>Olivier Zeitoun est attach&eacute; de conservation au d&eacute;partement Design et Prospective industrielle du Mus&eacute;e national d&rsquo;art moderne, <a href="https://www.centrepompidou.fr/fr/" target="_blank">Centre Pompidou</a>, &agrave; Paris. Dipl&ocirc;m&eacute; de sciences politiques et de philosophie et histoire de l&rsquo;art, il travaille sur des expositions et acquisitions du mus&eacute;e, contribue &agrave; des catalogues et ouvrages collectifs, et contribue depuis 2017 au cycle Mutations / Cr&eacute;ations, &agrave; travers les expositions &laquo; Imprimer Le Monde &raquo; (2017), &laquo; Coder le Monde &raquo; (2018) ou encore &laquo; La Fabrique du Vivant &raquo; (2019, co-commissariat avec M.-A. Brayer). En 2020, il est commissaire associ&eacute; de &laquo; Design and the Wondrous &raquo;, au Centre Pompidou x West Bund Museum in Shanghai. Enseignant &agrave; l&rsquo;ESAD de Reims, il poursuit &eacute;galement ses recherches en tant que commissaire ind&eacute;pendant. Ses recherches se concentrent sur les enjeux li&eacute;s au champ du num&eacute;rique dans les domaines de l&rsquo;art et du design &agrave; travers des approches transversales.</p> App : Model : Id : Fields : Olivier Zeitoun est attaché de conservation au département Design et Prospective industrielle du Musée national d’art moderne, Centre Pompidou, à Paris. Diplômé de sciences politiques et de philosophie et histoire de l’art, il travaille sur des expositions et acquisitions du musée, contribue à des catalogues et ouvrages collectifs, et contribue depuis 2017 au cycle Mutations / Créations, à travers les expositions « Imprimer Le Monde » (2017), « Coder le Monde » (2018) ou encore « La Fabrique du Vivant » (2019, co-commissariat avec M.-A. Brayer). En 2020, il est commissaire associé de « Design and the Wondrous », au Centre Pompidou x West Bund Museum in Shanghai. Enseignant à l’ESAD de Reims, il poursuit également ses recherches en tant que commissaire indépendant. Ses recherches se concentrent sur les enjeux liés au champ du numérique dans les domaines de l’art et du design à travers des approches transversales. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live vendredi 11 mars Ircam - salle Stravinsky Connecter le vivant Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Introduction et présentation de l’exposition « Réseaux-mondes »'
