["https://vertigo.ircam.fr/fr/person/marie-ange-brayer/index.html"]
title = "Marie-Ange Brayer | Vertigo Forum"
full_description = '''Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Introduction et présentation de l’exposition « Réseaux-mondes » Titre : App : Model : Id : Fields : Marie-Ange Brayer Éditer Conservatrice Biographie :<p>Marie-Ange Brayer est conservatrice, cheffe du service Design et Prospective industrielle, au Mus&eacute;e national d'art moderne, <a href="https://www.centrepompidou.fr/fr/" target="_blank">Centre Pompidou</a>, &agrave; Paris. Docteure en Histoire de l'Art et de l'Architecture (EHESS, Paris), elle a &eacute;t&eacute; pensionnaire en histoire de l'art &agrave; l'Acad&eacute;mie de France, Villa M&eacute;dicis, &agrave; Rome (1994-1996). De 1996 &agrave; 2014, elle a &eacute;t&eacute; directrice du Frac Centre &agrave; Orl&eacute;ans o&ugrave; elle a d&eacute;velopp&eacute; une collection d'architecture exp&eacute;rimentale et cr&eacute;&eacute; le festival d'architecture ArchiLab, avec Fr&eacute;d&eacute;ric Migayrou.</p> <p>En 2002, elle est commissaire, avec B&eacute;atrice Simonot, du Pavillon fran&ccedil;ais de la Biennale d'architecture de Venise. Elle a &eacute;t&eacute; commissaire, au Centre Pompidou, des expositions &laquo; Imprimer le monde &raquo; (Mutations / Cr&eacute;ations, 2017), &laquo; Ross Lovegrove. Convergence &raquo; (2017), &laquo; La Fabrique du Vivant &raquo; (Mutations / Cr&eacute;ations, 2019, avec Olivier Zeitoun) ainsi que de &laquo; Ettore Sottsass, l'objet magique &raquo; (2021). Elle est l'auteur de nombreux articles dans des revues et catalogues sur les rapports entre art, design et architecture ainsi que sur les enjeux du num&eacute;rique dans le design.</p> App : Model : Id : Fields : Marie-Ange Brayer est conservatrice, cheffe du service Design et Prospective industrielle, au Musée national d'art moderne, Centre Pompidou, à Paris. Docteure en Histoire de l'Art et de l'Architecture (EHESS, Paris), elle a été pensionnaire en histoire de l'art à l'Académie de France, Villa Médicis, à Rome (1994-1996). De 1996 à 2014, elle a été directrice du Frac Centre à Orléans où elle a développé une collection d'architecture expérimentale et créé le festival d'architecture ArchiLab, avec Frédéric Migayrou. En 2002, elle est commissaire, avec Béatrice Simonot, du Pavillon français de la Biennale d'architecture de Venise. Elle a été commissaire, au Centre Pompidou, des expositions « Imprimer le monde » (Mutations / Créations, 2017), « Ross Lovegrove. Convergence » (2017), « La Fabrique du Vivant » (Mutations / Créations, 2019, avec Olivier Zeitoun) ainsi que de « Ettore Sottsass, l'objet magique » (2021). Elle est l'auteur de nombreux articles dans des revues et catalogues sur les rapports entre art, design et architecture ainsi que sur les enjeux du numérique dans le design. Éditer https://www.centrepompidou.fr/fr/ À découvrir aussi Forum Vertigo Entrée Libre En live mercredi 9 mars Ircam - salle Stravinsky Introduction et présentation de l’exposition « Réseaux-mondes »'''
