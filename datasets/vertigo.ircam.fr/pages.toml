["https://vertigo.ircam.fr/fr/agenda/reseaux-mondes/detail/index.html"]
title = "« Réseaux-Mondes » | Vertigo Forum"
description = "Exposition collective, « Réseaux-Mondes » réunit une soixantaine d’artistes, architectes et designers qui interrogent la place du réseau dans nos sociétés innervées par les réseaux sociaux et la dématérialisation même du réseau. Plus que jamais, à l’ère d’Internet, le réseau est au cœur des mutations technologiques et des enjeux sociétaux : surveillance, atomisation de l’individu, acteur-réseau, réseau du vivant."
full_description = '''« Réseaux-Mondes » Exposition mer 23 février au lun 25 avril 2022 , 11h00 - 21h00 Centre Pompidou, Galerie 4Plan d'accès Ouvert tous les jours, sauf les mardis. Entrée avec le billet « Musée et Expositions » du Centre Pompidou Contenu :<p>Exposition collective, &laquo; R&eacute;seaux-Mondes &raquo; r&eacute;unit une soixantaine d&rsquo;artistes, architectes et designers qui interrogent la place du r&eacute;seau dans nos soci&eacute;t&eacute;s innerv&eacute;es par les r&eacute;seaux sociaux et la d&eacute;mat&eacute;rialisation m&ecirc;me du r&eacute;seau. Plus que jamais, &agrave; l&rsquo;&egrave;re d&rsquo;Internet, le r&eacute;seau est au c&oelig;ur des mutations technologiques et des enjeux soci&eacute;taux : surveillance, atomisation de l&rsquo;individu, acteur-r&eacute;seau, r&eacute;seau du vivant.</p> <p></p> <p><iframe allowfullscreen="allowfullscreen" height="315" src="https://www.youtube.com/embed/5UJs6X3HQzY" style="display: block; margin-left: auto; margin-right: auto;" title="YouTube video player" width="560"></iframe></p> <p>Tout est-il aujourd&rsquo;hui devenu r&eacute;seau ? De la naissance de la soci&eacute;t&eacute; de l&rsquo;information, dans l&rsquo;apr&egrave;s-guerre, jusqu&rsquo;&agrave; l&rsquo;omnipr&eacute;sence du r&eacute;seau plan&eacute;taire, avec l&rsquo;Internet, le r&eacute;seau tisse partout sa toile, dans l&rsquo;espace et le temps. Au c&oelig;ur des enjeux soci&eacute;taux et des mutations artistiques, celui-ci ne cesse de se d&eacute;multiplier. &Agrave; l&rsquo;heure de la crise environnementale, le premier r&eacute;seau est aussi celui du vivant, o&ugrave; l&rsquo;humain se donne dans une coexistence avec les autres esp&egrave;ces. Une centaine d'&oelig;uvres, des ann&eacute;es 1940 &agrave; aujourd&rsquo;hui, sont ici expos&eacute;es, dont plusieurs con&ccedil;ues sp&eacute;cialement pour l'exposition : certaines r&eacute;activent des r&eacute;seaux disparus, tel que le minitel, alors que d&rsquo;autres sont connect&eacute;es en temps r&eacute;el au r&eacute;seau Internet, aux r&eacute;seaux de cryptomonnaies, ainsi qu&rsquo;&agrave; des plateformes de r&eacute;seaux sociaux, comme Twitter.</p> <p class="wys-highlighted-paragraph">Commissariat <strong>Marie-Ange Brayer</strong> conservatrice, Mus&eacute;e national d'art moderne/Centre de cr&eacute;ation industrielle-Centre Pompidou, cheffe du service Design et prospective industrielle, <strong>Olivier Zeitoun</strong> attach&eacute; de conservation Mus&eacute;e national d'art moderne/Centre de cr&eacute;ation industrielle-Centre Pompidou</p> <h3>&laquo; Făbrĭca &raquo;</h3> <p><strong>Exp&eacute;rience musicale virtuelle</strong> &ndash; <span style="text-decoration: underline;">cr&eacute;ation 2022<br></span>au sein de l'exposition &laquo; R&eacute;seaux-Mondes &raquo;<span style="text-decoration: underline;"><br></span></p> <p>Făbrĭca est un espace musical virtuel dont l&rsquo;univers graphique tri-dimensionnel met en relation d&eacute;roulement musical et mouvements dans l&rsquo;espace. Le public est invit&eacute; &agrave; l&rsquo;explorer librement : en tra&ccedil;ant son propre parcours, chacun compose les relations entre les &eacute;l&eacute;ments sonores et les architectures visuelles et d&eacute;termine ainsi l'&eacute;volution du discours musical.</p> <p class="wys-highlighted-paragraph"><strong>Giulia Lorusso</strong> musique<br>commande de l'Ircam-Centre Pompidou et du GMEM &ndash; Centre national de cr&eacute;ation musicale <br><strong>Benjamin L&eacute;vy</strong> r&eacute;alisation informatique musicale Ircam<br><strong>Giovanni Muzio</strong> design graphique</p> App : Model : Id : Fields : Exposition collective, « Réseaux-Mondes » réunit une soixantaine d’artistes, architectes et designers qui interrogent la place du réseau dans nos sociétés innervées par les réseaux sociaux et la dématérialisation même du réseau. Plus que jamais, à l’ère d’Internet, le réseau est au cœur des mutations technologiques et des enjeux sociétaux : surveillance, atomisation de l’individu, acteur-réseau, réseau du vivant. Tout est-il aujourd’hui devenu réseau ? De la naissance de la société de l’information, dans l’après-guerre, jusqu’à l’omniprésence du réseau planétaire, avec l’Internet, le réseau tisse partout sa toile, dans l’espace et le temps. Au cœur des enjeux sociétaux et des mutations artistiques, celui-ci ne cesse de se démultiplier. À l’heure de la crise environnementale, le premier réseau est aussi celui du vivant, où l’humain se donne dans une coexistence avec les autres espèces. Une centaine d'œuvres, des années 1940 à aujourd’hui, sont ici exposées, dont plusieurs conçues spécialement pour l'exposition : certaines réactivent des réseaux disparus, tel que le minitel, alors que d’autres sont connectées en temps réel au réseau Internet, aux réseaux de cryptomonnaies, ainsi qu’à des plateformes de réseaux sociaux, comme Twitter. Commissariat Marie-Ange Brayer conservatrice, Musée national d'art moderne/Centre de création industrielle-Centre Pompidou, cheffe du service Design et prospective industrielle, Olivier Zeitoun attaché de conservation Musée national d'art moderne/Centre de création industrielle-Centre Pompidou « Făbrĭca » Expérience musicale virtuelle – création 2022au sein de l'exposition « Réseaux-Mondes » Făbrĭca est un espace musical virtuel dont l’univers graphique tri-dimensionnel met en relation déroulement musical et mouvements dans l’espace. Le public est invité à l’explorer librement : en traçant son propre parcours, chacun compose les relations entre les éléments sonores et les architectures visuelles et détermine ainsi l'évolution du discours musical. Giulia Lorusso musiquecommande de l'Ircam-Centre Pompidou et du GMEM – Centre national de création musicale Benjamin Lévy réalisation informatique musicale IrcamGiovanni Muzio design graphique Éditer Exposition : Production Musée national d'art moderne/Centre de création industrielle-Centre Pompidou. « Făbrĭca » : Coproduction Ircam-Centre Pompidou, Ensemble C Barré, GMEM – Centre national de création musicale. Avec le soutien de la Fondation Ernst Von Siemens pour la Musique.'''
year_published = 2022
