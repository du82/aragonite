["https://vertigo.ircam.fr/fr/person/frederic-bevilacqua/index.html"]
title = "Frédéric Bevilacqua | Vertigo Forum"
full_description = '''Titre : App : Model : Id : Fields : Frédéric Bevilacqua Éditer Directeur de recherche Biographie :<p>Directeur de recherche Ircam et responsable de l&rsquo;&eacute;quipe<a href="https://www.stms-lab.fr/team/interaction-son-musique-mouvement/" target="_blank"> Interaction son musique mouvement</a> du laboratoire STMS (Ircam, CNRS, Sorbonne Universit&eacute;), mon travail concerne l&rsquo;interaction gestuelle et l&rsquo;analyse du mouvement pour la musique et le spectacle vivant. Les applications de mes recherches vont des instruments de musique num&eacute;riques &agrave; la r&eacute;&eacute;ducation guid&eacute;e par le son. J&rsquo;ai coordonn&eacute; plusieurs projets comme Interlude sur les nouvelles interfaces pour la musique (Prix ANR du Num&eacute;rique 2013, Prix Guthman 2011 des nouveaux instruments de musique) ou encore le projet ANR Legos sur l&rsquo;apprentissage sensori-moteur dans les syst&egrave;mes interactifs musicaux.</p> <p>Apr&egrave;s des &eacute;tudes scientifique et musicale (Master en physique et doctorat en en optique biom&eacute;dicale de l'EPFL, Berklee College of Music &agrave; Boston), j&rsquo;ai &eacute;t&eacute; chercheur &agrave; l'universit&eacute; de California Irvine (UCI), avant de rejoindre l&rsquo;Ircam en 2003.</p> App : Model : Id : Fields : Directeur de recherche Ircam et responsable de l’équipe Interaction son musique mouvement du laboratoire STMS (Ircam, CNRS, Sorbonne Université), mon travail concerne l’interaction gestuelle et l’analyse du mouvement pour la musique et le spectacle vivant. Les applications de mes recherches vont des instruments de musique numériques à la rééducation guidée par le son. J’ai coordonné plusieurs projets comme Interlude sur les nouvelles interfaces pour la musique (Prix ANR du Numérique 2013, Prix Guthman 2011 des nouveaux instruments de musique) ou encore le projet ANR Legos sur l’apprentissage sensori-moteur dans les systèmes interactifs musicaux. Après des études scientifique et musicale (Master en physique et doctorat en en optique biomédicale de l'EPFL, Berklee College of Music à Boston), j’ai été chercheur à l'université de California Irvine (UCI), avant de rejoindre l’Ircam en 2003. Éditer À découvrir aussi Forum Vertigo Entrée Libre En live jeudi 10 mars Ircam - salle Stravinsky Réseaux et interactions'''
