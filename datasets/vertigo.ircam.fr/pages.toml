full_description = '''Le réseau : l’un et le multiple Forum Vertigo mer 9 mars 2022 , 15h00 - 16h30 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette table ronde en français ou en anglais Contenu :<p>Relier des &eacute;l&eacute;ments sans nier leur diversit&eacute;, d&eacute;crire leurs influences r&eacute;ciproques sans supposer entre eux de hi&eacute;rarchie immuable : la pens&eacute;e du r&eacute;seau semble avoir aujourd&rsquo;hui investi tous les domaines de la pens&eacute;e et de la cr&eacute;ation. Comment comprendre la fortune contemporaine de ce mod&egrave;le dans des champs disciplinaires aussi vari&eacute;s que la philosophie, les sciences sociales ou les pratiques artistique ? &Agrave; quelles circulations historiques et &agrave; quelles n&eacute;cessit&eacute;s conceptuelles cet essaimage ob&eacute;it-il ?</p> <p class="wys-highlighted-paragraph">Avec <strong>Claire Bidart</strong> sociologue, directrice de recherche, CNRS (LEST)<br><strong>Dominique Cardon</strong> professeur de sociologie, directeur du M&eacute;diaLab, Sciences Po<br><strong>Aric Chen</strong> directeur du Het Nieuwe Instituut<br><strong>Elizabeth Diller</strong> (DS+R) artiste, architecte<br><strong>Mathieu Potte-Bonneville</strong> directeur du d&eacute;partement culture et cr&eacute;ation, Centre Pompidou<br>Mod&eacute;ration <strong>Xavier de La Porte</strong> journaliste et producteur</p> App : Model : Id : Fields : Relier des éléments sans nier leur diversité, décrire leurs influences réciproques sans supposer entre eux de hiérarchie immuable : la pensée du réseau semble avoir aujourd’hui investi tous les domaines de la pensée et de la création. Comment comprendre la fortune contemporaine de ce modèle dans des champs disciplinaires aussi variés que la philosophie, les sciences sociales ou les pratiques artistique ? À quelles circulations historiques et à quelles nécessités conceptuelles cet essaimage obéit-il ? Avec Claire Bidart sociologue, directrice de recherche, CNRS (LEST)Dominique Cardon professeur de sociologie, directeur du MédiaLab, Sciences PoAric Chen directeur du Het Nieuwe InstituutElizabeth Diller (DS+R) artiste, architecteMathieu Potte-Bonneville directeur du département culture et création, Centre PompidouModération Xavier de La Porte journaliste et producteur Éditer Visuel : Courtesy de Neri Oxman et The Mediated Matter Group, MIT © The Mediated Matter Group En live Intervenants Sociologue Claire Bidard Sociologue Dominique Cardon Artiste Elizabeth Diller Philosophe Mathieu Potte-Bonneville Journaliste Xavier de La Porte Architecte Aric Chen'''
