full_description = 'Titre : App : Model : Id : Fields : Éric Bapteste Éditer Chercheur Biographie :<p>&Eacute;ric Bapteste est directeur de recherche au <a href="https://www.cnrs.fr/fr/page-daccueil" target="_blank">CNRS</a>, sp&eacute;cialis&eacute; en biologie de l&rsquo;&eacute;volution, codirecteur de l&rsquo;&eacute;quipe Adaptation, Int&eacute;gration, R&eacute;ticulation et Evolution, au sein de l&rsquo;UMR ISYEB, &agrave; Paris. Titulaire d&rsquo;un doctorat en biologie &eacute;volutive et d&rsquo;un doctorat en philosophie de la biologie, il &eacute;tudie l&rsquo;&eacute;volution par des m&eacute;thodes de r&eacute;seaux, et cherche &agrave; comprendre la mise en place et les cons&eacute;quences des diverses interactions, en commen&ccedil;ant par les interactions au niveau mol&eacute;culaire, dont le monde vivant, son organisation et ses propri&eacute;t&eacute;s &eacute;mergent. Pour cela, il collabore volontiers avec des sp&eacute;cialistes de nombreuses disciplines, en particulier des th&eacute;oriciens des graphes et des philosophes des sciences. Il est auteur de trois essais pour adultes sur l&rsquo;&eacute;volution (<em>Tous entrelac&eacute;s ; Les g&egrave;nes voyageurs et Conflits int&eacute;rieurs</em>) et d&rsquo;un livre pour enfant (<em>Tout se transforme !</em>).</p> App : Model : Id : Fields : Éric Bapteste est directeur de recherche au CNRS, spécialisé en biologie de l’évolution, codirecteur de l’équipe Adaptation, Intégration, Réticulation et Evolution, au sein de l’UMR ISYEB, à Paris. Titulaire d’un doctorat en biologie évolutive et d’un doctorat en philosophie de la biologie, il étudie l’évolution par des méthodes de réseaux, et cherche à comprendre la mise en place et les conséquences des diverses interactions, en commençant par les interactions au niveau moléculaire, dont le monde vivant, son organisation et ses propriétés émergent. Pour cela, il collabore volontiers avec des spécialistes de nombreuses disciplines, en particulier des théoriciens des graphes et des philosophes des sciences. Il est auteur de trois essais pour adultes sur l’évolution (Tous entrelacés ; Les gènes voyageurs et Conflits intérieurs) et d’un livre pour enfant (Tout se transforme !). Éditer À découvrir aussi Forum Vertigo Entrée Libre En live vendredi 11 mars Ircam - salle Stravinsky Connecter le vivant'
