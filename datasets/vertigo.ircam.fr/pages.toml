["https://vertigo.ircam.fr/fr/agenda/connecter-le-vivant/detail/index.html"]
title = "Connecter le vivant | Vertigo Forum"
description = "Une nouvelle écologie artistique intègre un principe d’interdépendance et de continuité de toutes les formes du vivant, reliées entre elles. Les technologies sont explorées comme outil de communications inter-espèces, aspirant à connecter des mondes aux limites de la perception humaine. Au cœur de cette « pensée écologique », le réseau est devenu « maillage », vecteur de « l’interconnectivité entre toutes les choses vivantes et non-vivantes » selon les mots de Timothy Morton."
full_description = '''Connecter le vivant Forum Vertigo ven 11 mars 2022 , 14h30 - 16h30 Ircam, salle StravinskyPlan d'accès Entrée libre, dans la limite des places disponibles Entrée Libre En live Suivez le live de cette table ronde en français ou en anglais Contenu :<p>Une nouvelle &eacute;cologie artistique int&egrave;gre un principe d&rsquo;interd&eacute;pendance et de continuit&eacute; de toutes les formes du vivant, reli&eacute;es entre elles. Les technologies sont explor&eacute;es comme outil de communications inter-esp&egrave;ces, aspirant &agrave; connecter des mondes aux limites de la perception humaine. Au c&oelig;ur de cette &laquo; pens&eacute;e &eacute;cologique &raquo;, le r&eacute;seau est devenu &laquo; maillage &raquo;, vecteur de &laquo; l&rsquo;interconnectivit&eacute; entre toutes les choses vivantes et non-vivantes &raquo; selon les mots de Timothy Morton.</p> <p class="wys-highlighted-paragraph">Avec <strong>&Eacute;ric Bapteste</strong> chercheur en biologie &eacute;volutive, CNRS<br><strong>Emmanuele Coccia</strong> professeur associ&eacute;, EHESS <br><strong>Lonneke Gordijn/Ralph Nauta</strong> (DRIFT) designers<br><strong>Neri Oxman</strong> architecte, chercheuse, MIT<br><strong>Jenna Sutela</strong> artiste <br>Mod&eacute;ration <strong>Olivier Zeitoun</strong></p> App : Model : Id : Fields : Une nouvelle écologie artistique intègre un principe d’interdépendance et de continuité de toutes les formes du vivant, reliées entre elles. Les technologies sont explorées comme outil de communications inter-espèces, aspirant à connecter des mondes aux limites de la perception humaine. Au cœur de cette « pensée écologique », le réseau est devenu « maillage », vecteur de « l’interconnectivité entre toutes les choses vivantes et non-vivantes » selon les mots de Timothy Morton. Avec Éric Bapteste chercheur en biologie évolutive, CNRSEmmanuele Coccia professeur associé, EHESS Lonneke Gordijn/Ralph Nauta (DRIFT) designersNeri Oxman architecte, chercheuse, MITJenna Sutela artiste Modération Olivier Zeitoun Éditer Visuel : Jenna Sutela, Nimiia cétiï, 2018. Capture vidéo. Vidéo, couleur, 12 min 2 sec. Courtesy de l'artiste. Photo © Jenna Sutela En live Intervenants Chercheur Éric Bapteste Auteur Emmanuele Coccia designers Lonneke Gordijn/Ralph Nauta Architecte Neri Oxman Artiste Jenna Sutela Attaché de conservation Olivier Zeitoun'''
