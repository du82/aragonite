ild(2n):not(:last-child) { border-right: 3px solid black; } div.speculative-decoding { border: 1px solid black; padding: 1rem; margin-bottom: 2rem; } div.speculative-decoding > span { padding: 2px; margin-right: 2px; border-radius: 5px; white-space: pre-wrap; } div.speculative-decoding > span.draft-token { background-color: rgb(200, 255, 200); } div.speculative-decoding > span.oracle-token { background-color: rgb(200, 200, 255); } p.grammar-gen { white-space: pre-wrap; font-family: monospace; } p.grammar-gen span { background-color: #d2f4d3; } In my last post, we made a transformer by hand. There, we used the classic autoregressive sampler, along the lines of: def generate(prompt: str, tokens_to_generate: int) -> str: tokens = tokenize(prompt) for i in range(tokens_to_generate): next_token = model(tokens) tokens.append(next_token) return detokenize(tokens) This approach to inference is elegant and cuts to the heart of how LLMs work—they're autoregressive, consuming their own output. And for our toy model with merely thousands of parameters, it worked completely fine. Unfortunately, for real models it's far too slow. Why is that, and how can we make it faster? This post is a long and wide-ranging survey of a bunch of different ways to make LLMs go brrrr, from better hardware utilization to clever decoding tricks. It's not completely exhaustive, and isn't the most in-depth treatment of every topic—I'm not an expert on all these things! But hopefully you'll find the information here a useful jumping off point to learn more about the topics you're interested in. (I tried to include links to relevant papers and blog posts where applicable.) Continue reading...'''
