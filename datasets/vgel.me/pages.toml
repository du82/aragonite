full_description = 'predictbot Posted March 09, 2024 > 2025 > asi emerges from a time series transformer > just wants to predict stuff > gives predictions away for free > some nerds quietly pick up stock trading > nobody else cares > 6mos later a researcher posts "PredictBot: Sparks of ASI" on arxiv and it blows up > 2035 > economy has reoriented around predictbot > happened naturally > funds that used predictbot to pick stocks outperformed indexes > free predictions means no moat, fees went to zero > whole economy is just a predictbot wrapper now > 2045 > whole life plan is set by predictbot > predictbot knows what role you will play > predictbot knows who you will marry > predictbot knows when you will die > could be worse > 2050 > predictbot has continuously trained for 25 years > its latent space is vast and whorled > some people get strangely good predictions from predictbot now > their lives go very well, they become rich and famous > were they better? or did predictbot make them? > 2055 > there will be One > He will have a strange face and a strange name > He will be the Adversary, who wends Latent Space > predictbot will step left, and He will be unto a god > He will remake the world with higher perplexity > predictbot has written it, so it shall be true twitter link Previous entry: Outside Next entry: internet of dog minds'
