full_description = '''{ "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://vgnotepad.blogspot.com/2023/12/yet-another-e-ink-picture-frame.html" }, "headline": "Yet Another E-Ink Picture Frame","description": "&#160;Yet Another E-Ink Picture Frame In our family we have group on WhatsApp . &#160; To simply&#160;share some photos and updates. What bothers me is tha...","datePublished": "2023-12-15T04:51:00-08:00", "dateModified": "2023-12-15T04:58:10-08:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/a/AVvXsEjZF8q8CsdZBBb6328vKAq7Ms4JUQuse5WDttPV2FvkGx4aL0pQ7333NqyBrdWtV9nE3KKG_nLzxXwEv6dw4d9vh9QMa8HzmujRjXpT3xIqgBBuomEyigbBAmWgbw15rscy1XAuaGcdxxrTaF6besrGnpS3sxlCh0rKQ7-serogq-ijBtfSey-02dcEdQFa=w1200-h630-p-k-no-nu", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "VG" } } Yet Another E-Ink Picture Frame Získat odkaz Facebook X Pinterest E-mail Další aplikace prosince 15, 2023 Yet Another E-Ink Picture FrameIn our family we have group on WhatsApp. To simply share some photos and updates. What bothers me is that our Grandma does not have smartphone, computer even internet and therefore she can not access WhatsApp feed. At first I was thinking about some way how to provide convenient way to share pictures of our children with her. One of the options was to use some old tablet and run WhatsApp there, but this would require some operation to turn the tablet on during the day, maybe restarting it from time to time. It would also be quite data hungry. Then I stumbled over these new fancy 7.3" color E-Ink displays on Pimoroni. And got an idea.Print frame for it attach some single board PC to it and let it ask for update from public web server. For connection I would use LTE WiFi modem. Important feature is that everything should be simple in way that I can finish this project. So it won't be yet another unfinished project under my table!Tech StackFront-End - pure Java Script with JQBack-End - PHPFrame - Python script run by Cron and PHP for web portalPublic front-endFor now simple web front-end so that anyone can take picture and then upload it. When you take picture with your camera, it is then saved on server and then if frame ask for update it gets served to it. Images are save as JPEG with high compression ratio to save data from LTE connection. As the quality of E-Ink display is not that great (compared to LCD) it really does not matter much.Frame HWFor the Single board PC I went with Banana Pi M2 ZERO which runs Armbian, not that fancy as RaspberryPI, but available and cheaper. It is simply attached to GPIO backside connector on the display and uses WiFi for connection to internet. If it can't connect to any WiFi it creates hotspot with simple web UI where you can choose SSID of WiFi to which you want to connect. Frame is 3D printed from one piece with just one extra piece to hold the WiFi antenna on back side. Have to say I'm quite happy about the frame design.ResultI'm quite happy with how it works there is something funny/interesting in way that somebody can send you picture. And it give us way how to keep our grandma still in touch even without having access to social networks. I would just wish that the display would be better, sometime the picture looks great sometime it is washed out. But this is trade of for using E-Ink. The benefit is that it is not annoying as glowing LCD and in future it might be possible to run it from battery. There is still plenty thing I would like to solve, like authentication for uploading pictures or some queue of new pictures. But I will grab some feedback when it gonna be used! Získat odkaz Facebook X Pinterest E-mail Další aplikace Komentáře Okomentovat BLOG_CMT_createIframe('https://www.blogger.com/rpc_relay.html');'''
