full_description = '''{ "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://vgnotepad.blogspot.com/2021/05/reprogramming-old-sennheiser-skm-3072-u.html" }, "headline": "Reprogramming \"old\" Sennheiser SKM 3072-U - Part 2 - I2C","description": "&#160;Understanding what is going on I2C In the previous step I hooked up my logic analyzer on the I2C to see how the communication inside the mi...","datePublished": "2021-05-10T14:34:00-07:00", "dateModified": "2023-06-19T03:30:32-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhLpa5g5sdGMLTBinv5aeOHZb5uoRADACjuDvICXkQxetDxMI1vhDs5MKGDLsDqZ2FTeCCuc4OORxSZjRHJtuz6NL-VJU3DXSgSLfswm1z8CxInUDD51blABjkCaFb2DykD3QxDfyaI3XSJ/w1200-h630-p-k-no-nu/Capdddddture.PNG", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "VG" } } Reprogramming "old" Sennheiser SKM 3072-U - Part 2 - I2C Získat odkaz Facebook X Pinterest E-mail Další aplikace května 10, 2021 Understanding what is going on I2CIn the previous step I hooked up my logic analyzer on the I2C to see how the communication inside the mic actually looks like. Partially because I want to understand better how to reprogram the microphones EEPROM but also because I'm just curious and want to see what is really going on.After powering up the microphone this is the output from I2C.write to 0x3E ack data: 0xE0 0xC8 0xF0 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 write to 0x3E ack data: 0xE0 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 0x00 write to 0x50 ack data: 0x10 read to 0x50 ack data: 0x11write to 0x51 ack data: 0x1A read to 0x50 ack data: 0xA9write to 0x51 ack data: 0xB3 read to 0x50 ack data: 0x1Fwrite to 0x51 ack data: 0xAE read to 0x50 ack data: 0x03write to 0x51 ack data: 0xAF read to 0x50 ack data: 0x20write to 0x51 ack data: 0xAC read to 0x50 ack data: 0xFCwrite to 0x51 ack data: 0xAD read to 0x50 ack data: 0x5Dwrite to 0x51 ack data: 0xC4 read to 0x50 ack data: 0xFCwrite to 0x51 ack data: 0xC5 read to 0x50 ack data: 0x41write to 0x50 ack data: 0x14 read to 0x50 ack data: 0x00write to 0x50 ack data: 0x11 read to 0x50 ack data: 0x03write to 0x51 ack data: 0x1D read to 0x50 ack data: 0xBBwrite to 0x51 ack data: 0x1E read to 0x50 ack data: 0x99write to 0x51 ack data: 0x1F read to 0x50 ack data: 0x8Cwrite to 0x51 ack data: 0x73 read to 0x50 ack data: 0x78write to 0x51 ack data: 0x74 read to 0x50 ack data: 0x26write to 0x51 ack data: 0x75 read to 0x50 ack data: 0xFEwrite to 0x7F ack data: 0x5D 0x06 0x83 0xF00x370xEF0x88 0x5E 0x260xFC0xE1 0x6Fwrite to 0x3E ack data: 0xE0 0x00 0x00 0x00 0x00 0x00 0x9F 0x00 0x00 0x00 0x00 0x00 write to 0x3E ack data: 0xE0 0x00 0xF0 0x00 0x00 0x00 0xFB 0x00 0x00 0x00 0x00 0x90 write to 0x3E ack data: 0xE0 0x00 0xBF 0x00 0x09 0x00 0x9A 0x00 0x00 0x00 0x00 0xF0 write to 0x3E ack data: 0xE0 0x00 0xAB 0x00 0x0F 0x00 0xBD 0x0F 0x00 0x00 0x00 0x99 write to 0x3E ack data: 0xE0 0x00 0xDA 0x00 0x09 0x00 0x00 0x9B 0xF0 0x00 0x00 0xBF write to 0x3E ack data: 0xE0 0x00 0x0D 0x00 0x9B 0x00 0x7B 0xFA 0xBF 0x00 0x00 0x09 write to 0x3E ack data: 0xE0 0x00 0xF0 0x00 0x00 0x00 0xEF 0x0B 0x00 0x00 0x00 0x2F write to 0x50 ack data: 0x11 0x03 write to 0x50 ack data: 0xB1 read to 0x50 ack data: 0x11write to 0x50 ack data: 0x73 read to 0x50 ack data: 0x79write to 0x50 ack data: 0x74 read to 0x50 ack data: 0x87write to 0x50 ack data: 0x75 read to 0x50 ack data: 0x00write to 0x50 ack data: 0xB1 read to 0x50 ack data: 0x11write to 0x3E ack data: 0xE0 0x00 0xBA 0xFF 0x99 0x00 0xFB 0xDF 0xFA 0xF7 0xBF 0xFF write to 0x50 ack data: 0x73 read to 0x50 ack data: 0x79write to 0x50 ack data: 0x74 read to 0x50 ack data: 0x87write to 0x50 ack data: 0x75 read to 0x50 ack data: 0x00write to 0x50 ack data: 0xB1 read to 0x50 ack data: 0x11write to 0x3E ack data: 0xE0 0x00 0xBA 0xFF 0x99 0x00 0xFB 0xDF 0xFA 0xF7 0xBF 0xFF write to 0x7F ack data: 0x41 0xF00x37write to 0x3E ack data: 0xE0 0x00 0x37 0xFF 0xE3 0x00 0x75 0x61 0x1C 0xF7 0xBF 0x26 write to 0x50 ack data: 0x73 read to 0x50 ack data: 0x79write to 0x50 ack data: 0x74 read to 0x50 ack data: 0x87write to 0x50 ack data: 0x75 read to 0x50 ack data: 0x00write to 0x50 ack data: 0xB1 read to 0x50 ack data: 0x11write to 0x3E ack data: 0xE0 0x00 0xBA 0xFF 0x99 0x00 0xFB 0xDF 0xFA 0xF7 0xBF 0xFF Just like this is not very helpful. But I already know there are 3 devices on the bus. EEPROM, PLL and LCD driver. By little bit of playing around I have found out that 0x3E is display since it I can see it changing in the log as I'm pushing the buttons. It even makes lot of sense since you can see quite huge portions of data sent to the address the display has 6 times 8 segment for displaying numbers, 2 dots, 2 times bar graph for audio and RF 8 segments each, RF labels and BAT label. That means 6*8+2+2*8+2= 68 segments. So I would need around 9 bytes to encode it all, naively speaking. So it actually makes sense. And datasheet for it is nowhere to find and since I don't have to care anyway its enough.There is also mysterious 0x7F which I suspected to be PLL. After looking at the manual I have found out that it need to set on of its inputs LOW in order to accept the data from I2C. So I added next channel to logic analyzer which was hooked to this pin. And started recording.And surely enough the EN pin was low when CPU was communicating with 0x7FThen there is 0x50 and 0x51. This actually confused me a lot on the beginning but after all it can be simply put into the phrase RTFM (Read The F* Manual) well, in this case EEPROM datasheet. It truly is EEPROM as suspected and its address is described in the DS. You can change the address by setting high or low two of its inputs. So in theory you may create array of 4 EEPROM using same chip. But in the mic both E1 and E2 are set low, so the address should be 0x50. Then why 0x51? As clear from the table below, the memory is split into two blocks(halves) and by setting last bit of its address you can choose the block!Even more detail for the communication can be found in the datasheet.And that already looks quite familiar. It actually looks identical to what I can see on the buswrite to 0x51 ack data: 0x1A read to 0x50 ack data: 0xA9Parsed it means: Device 0x50 read data from block 1 of address 0x1A, and response with the data 0xA9. But in which format are the data stored in the EEPROM and how can they be safely modified?More in part 3 geek hacking programming reprogramming Sennheiser SKM 3072 wireless Získat odkaz Facebook X Pinterest E-mail Další aplikace Komentáře Okomentovat BLOG_CMT_createIframe('https://www.blogger.com/rpc_relay.html');'''
