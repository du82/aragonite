full_description = '{ "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://vgnotepad.blogspot.com/2021/06/reprogramming-old-sennheiser-microphone_3.html" }, "headline": "Reprogramming \"old\" Sennheiser Microphone - Part 4 - PLL","description": "&#160;PLL At the beginning when I was looking at the I2C communication I have found out which parts of it talks with PLL, but then I carry on as ...","datePublished": "2021-06-03T03:50:00-07:00", "dateModified": "2024-10-30T05:20:03-07:00","image": { "@type": "ImageObject","url": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiGivKEbEnkIaTKdC5OSIvM1HclKQ1eZnWK6Dn8fNoeowEYNuqSt6yTnFntCJm1_YaVPOo1s-j0Mp9-yMKrfeq8i4v1U8PaEl0cY2mBGOTJj3SPSTGrLgd3_cmki3yi2KuNMSYIkbVrXJbs/w1200-h630-p-k-no-nu/Sennhpll.PNG", "height": 630, "width": 1200},"publisher": { "@type": "Organization", "name": "Blogger", "logo": { "@type": "ImageObject", "url": "https://blogger.googleusercontent.com/img/b/U2hvZWJveA/AVvXsEgfMvYAhAbdHksiBA24JKmb2Tav6K0GviwztID3Cq4VpV96HaJfy0viIu8z1SSw_G9n5FQHZWSRao61M3e58ImahqBtr7LiOUS6m_w59IvDYwjmMcbq3fKW4JSbacqkbxTo8B90dWp0Cese92xfLMPe_tg11g/h60/", "width": 206, "height": 60 } },"author": { "@type": "Person", "name": "VG" } } Reprogramming "old" Sennheiser Microphone - Part 4 - PLL Získat odkaz Facebook X Pinterest E-mail Další aplikace června 03, 2021 PLL At the beginning when I was looking at the I2C communication I have found out which parts of it talks with PLL, but then I carry on as I did not expect it I will need to understand it better and also since I have very vague idea about what PLL actually is. But now I have to find out in order to compute and load proper data for it into the memory. From the microphone schematics I got the basic idea Red line is quite clearly audio input from the AF microphone part. So its the signal that drives the modulation. Green line is HF output that goes to the HF amplifier stage, thats also quite clear Blue line looks like output from PLL that drives the VCO Yellow is line that goes back from the output to the Prescaler which I have found out is fancy word for frequency divider and then into the PLL What I thougth PLL is: IC into which you send some f1 and you will get f2 thats locked to the f1 phase. But looking to the datasheet the working frequency of this PLL is actually quite ... Okomentovat Další informace'
