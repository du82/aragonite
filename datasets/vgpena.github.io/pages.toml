["https://vgpena.github.io/we-rise-2017"]
title = "We RISE 2017: yes please | hey it's violet"
description = "I gave my first tech talk at We RISE's inaugural conference on June 23-24, 2017. Here are my main takeaways from and thoughts on the conference."
full_description = '''We RISE 2017: yes please see you again next year! 7.1.2017 Last week, I spoke at We RISE conf in Atlanta, GA. I'll write a post on that speaking experience, but first I'd like to talk about the conference itself. We RISE is a Women In Tech conference put together by Women Who Code ATL. This year was its debut year and it kicked ass. I've been to talks and conferences with pretty strong social undertones, but this was the first time I'd been to a major event overtly aimed at social issues and progress in tech. The sessions were pretty evenly split between more "typical" tech talks (e.g, intro to Rust) and more socially-oriented ones (e.g., creating an allyship program at your company). No matter the speaker or the subject matter, there was always an undercurrent: let's get more women into and excelling in tech. We RISE was excellent, for many reasons, and I'll try to break them down a bit. To start off with something banal and probably obvious, there were a lot of women there. Women must have made up 95 percent of attendees. I didn't think I would notice, but I did, and it was amazing. I won't dive deeply into this right now, but as a developer who's a woman, I'm used to being in a minority. I've had the good fortune (or maybe instinct) to end up working with respectful, smart, helpful, supportive, amazing people. They just happen to be mostly men. I've never had a boss who wasn't a man. For five years, I worked directly alongside zero women. That spell ended last month, for which I am grateful. With this as my norm, it was subtly mind-blowing to spend two days answering to and speaking with almost exclusively women. My paper was accepted by a woman; I got speaker updates from women; women answered my questions about scheduling. I went to talks given by women and my talk, in turn, was mostly attended by women. I answered womens' questions about WebSockets, read womens' slide decks, and chatted with women about programming, Atlanta, and our careers and ambitions. The talks specifically about social issues were valuable and necessary. It was the tech sessions, however, which got me really excited. A talk can focus completely on tech and yet be an instrument of social progress when it is given in the right context. This was the case at We RISE. Looking around the room at almost exclusively other women, I felt pride to realize that it would be us going back to work on Monday energized, full of connections and ideas, ready to share and talk and create change. There would be a wave of women suggesting techniques, sharing links to new tools, and rounding up parners to work on side projects. (As a sidenote, I realized that the flipside of this is also true -- every time a conference is unwelcoming, exclusive, etc., women and other marginalized groups are taking two hits: not only are they not going to the conference itself but they also are less likely to be showing up at work with new ideas to present, discuss, and implement.) I also met people from all kinds of backgrounds who got into tech for all kinds of reasons. My world mostly consists of under-40s who have worked in tech for many years. They mostly don't have comp sci degrees but they have finished college, are childless, and have had generally stable lives. At We RISE, I met record numbers of people who didn't fit this profile. There were droves of code school students, people entering tech in their 40s, people with children. Their concerns and goals were totally different from mine and those of most of my colleagues. They chose coding bootcamps that worked with their schedules of full-time work and childcare. They applied for jobs not that promised glory or stock options but healthcare and regular hours. Tech from the west coast and NYC tends to be splashy and dramatic. Tech from Atlanta stays out of the headlines and, honestly, it keeps such a low profile that I was surprised that there was a tech conference happening there at all. We RISE reminded me that these people are my compatriots. They're my extended family. And I'm going to work harder to connect with and support all elements of our community. Anyway: We RISE was the best and it's doing some really important things for women and tech and women in tech. If you went, well done! If you didn't, go next year! I had an incredible time and I am so thankful that I had the opportunity to meet rad people, give my first ever talk, and spread some inspiration and knowledge. Stay tuned, lovely people, for a post on my talk itself and lessons learned by a first-time speaker 😘'''
author = "Violet Peña"
year_published = 2025
