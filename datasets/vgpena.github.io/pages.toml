["https://vgpena.github.io/do-you-want-to-build-a-slide-deck"]
title = "Do you want to build a slide deck? | hey it's violet"
description = "Giving a presentation often means building a deck. Here's a comparison of my favorite deck-building tools, including times to use or avoid each of them."
full_description = "Do you want to build a slide deck? Speaker Notes, Vol. 1 2.29.2020 Over the past several years, I’ve given a few conference talks and many less-formal workplace presentations. This means I’ve spent a lot of time writing and editing slide decks. Along the way, I’ve grown to love three deck-building tools: Dropbox Paper, Google Slides, and Keynote. They each have their own strengths and flourish in different settings. Here’s a rundown of these presentation tools based on my preferences and experience. Dropbox Paper The simple one. Technically, you don’t make decks in Paper, but it’s my go-to for for informal presentations. It doesn't have to be a slide deck 🎵 If you hit the Present button on any Paper doc, you get a cleaned-up view of the doc with larger text, no toolbars, etc. The secret sauce here is that horizontal rules in the original doc create slide breaks in Presentation mode. This creates cleaner visuals and transforms a wall of text into something resembling a slide deck. Paper lacks the layout and formatting options of other presentation apps. For informal presentations, this tradeoff is worth it because it frees you up to focus on the writing instead of the visuals. This is great news when you need to work quickly 😅 or when you simply don’t want to sink effort into type, colors, and spacing. Use Paper when… The talk is fairly informal You’re on a super tight deadline Avoid Paper when.. You need a distinctive visual style You need speaker notes Google Slides The collaborative one. Google Slides is my most-used presentation app, and the absolute winner for group work. You can grant different permissions levels; for example, allow anyone at your company to comment but restrict editing to specific individuals. Slides gives you robust drawing and layout features, but is lighter and easier to learn than Keynote. Although Slides is web-based, it has an offline mode which is great for conference settings with unreliable internet. The caveat here is that offline presentations don’t play videos; the first frame shows as a poster image instead. In all situations, the Slides embedded video player feels unpolished as compared with Keynote. Use Slides when… You’re working in a group Avoid Slides when… You want attractive video embedding Keynote The classy one. Keynote is for making an ultra-polished presentation with no compromises. Out of all these tools, Keynote gives you the most control over all aspects of your deck, and you get luxe features such as magic transitions 🤩 and beautiful video embedding. Keynote also includes helpful presenter tools, such as a Rehearsal Mode and a robust Presenter Display during the talk itself. All of this comes with a couple of tradeoffs. Firstly, the learning curve for Keynote is steeper than that of Slides, and even if you’re good with Slides, Keynote won’t necessarily feel familiar. Additionally, group work in Keynote is challenging as compared to Slides. Use Keynote when… You want the most beautiful deck possible You want great video embedding Avoid Keynote when… Working in a group In Conclusion Every presentation is different, and I haven’t found the One True Deck-Builder that I will use for every deck for the rest of my career. In the meantime, I rotate between Dropbox Paper, Google Slides, and Keynote depending on how quickly vs. collaboratively vs. polished I want to work. I hope this comparison has been helpful. Sending you good presentation vibes! PS - Thank you to Ginger for asking me the original question about presentation tools 🙂 PPS - I haven’t used it professionally, so I can’t speak to it here, but I love Prezi. Maybe deserves an Honorable Mention? PPPS - That's right, I got a February 29th publish date in there! Goooo leap years 🥳"
