["https://vhbelvadi-hugo.netlify.app/colophon"]
title = "V.H. Belvadi — Colophon — Venkatram Harish Belvadi"
description = "/ˈkɒləf(ə)n/ <strong>n. sing.</strong> A statement at the end of a book giving information about its authorship and printing."
full_description = "Almost every­thing you need to know about me and my cur­rent work can be found on the homepage or under one of the menu options above. Please feel free to send me an e-mail or con­nect with me on Twit­ter any­time. This website is set in 13/20pt Acumin Pro. It uses three widths of Acumin depending on context and size — text, condensed and extracondensed — all of which were designed by one of my favourite typeface designers Robert Slimbach. Acumin is part of the Adobe Originals series known for their ‘highest standards for aesthetic value, technical quality, and typographic functionality.’What appeals to me about Acumin are its character and readability, with the scale clearly tilting in the latter direction. Jeffrey Zeldman describes Acumin as a ‘robust yet water-neutral sans-serif … sturdy yet self-effacing as a waiter at a great restaurant … A Helvetica for readers.’All fonts are delivered by Adobe. Ever since I switched to a predominantly iPad-based workflow I have found writing for and updating information on this website to be incredibly simple. Since I use the JAM Stack with Hugo, Gitlab and Netlify (see below) the app I use to sync for git is the excellent Working Copy. This maintains repos locally on the iOS Files app.I write almost exclusively on iA Writer on iPad which updates markdown files directly in the iOS Files app, which means it updates my local repo directly with no fuss. A combination of iA Writer and Working Copy means no duplication and perfect synchronisation.Handling images and other assets used to be done first via Google Drive and then, briefly, via Amazon S3; but since April 2020 everything has been migrated to my Gitlab repo. The primary reason for this being the poor workflows afforded by both these storage services on mobile devices. A second reason is that it is easier to make Open Graph and Twitter Cards work with self-hosted images rather than ones sourced from other storage services. Between Working Copy, iOS Files and iA Writer I can run this website in a lightweight manner."
