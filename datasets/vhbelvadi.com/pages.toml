["https://vhbelvadi.com/carrie-by-vocaltype"]
title = "V.H. Belvadi — “Carrie” by VocalType • (Venkatram Harish Belvadi)"
description = "V.H. Belvadi’s personal website and blog"
full_description = "“Carrie” by VocalType From www.vocaltype.co This is one of the most fascinating typefaces I have come across in some time. It is inspired by the banner carried by Carrie Chapman Catt, the political strategist, suffragist and peace activist who led New York’s 1915 suffrage parade. The manner in which it has been drawn as a typeface—of a single weight with no italics—is excellent and retains (or adds?) to it characteristics that make me want to typeset all my pullquotes in it. Another day perhaps. Until then, this is worth spreading around. This is a great example, I think, of society inspiring art quite literally. This is a note: a brief thought or notable piece of information from my commonplace book. For longer writings, please see ‘Essays’."
