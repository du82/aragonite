description = "V.H. Belvadi’s personal website and blog"
full_description = "Guestbook Remember the old days of the web when we had guestbooks? It was a more independent, thoughtful and personal web. It is time to bring that back. Write your note and post it on the wall below; and if you have your own guestbook let me know. Email address .guestbookfield { opacity: 0; position: absolute; top: 0; left: 0; height: 0; width: 0; z-index: -1; } Post it What a gorgeous website. Exactly like reading a book, the allure of flipping through its pages is a joyful—and irresistible—experience. This is design and readability at its finest. Absolutely amazing. Anonymous I love blogs like this one and this one. My favorite part of blogs is that they have a Guest Book. Very nice blog. God bless your hands. İsmail Şevik Thanks for the terrific wrap-up post for the January ‘25 Carnival. Your site is elegant, readable, and clear. And I do so love a guestbook. ARTLUNG (Joe) Thank you for the warning about Kirby’s non-standard YAML front-matter format on your well-documented Colophon page — I was about to migrate, you may have saved me days of work. levelsi Love the website design, strong typography. Really nice to read. Britt I think the previous design of your blog was better. But still, you know. :) İsmail Şevik Oh my, what an exquisite site. I love your mind, and the evident care you invest into your writing and craft. Inspired. foxwizard I recently re-discovered your lovely website and I’ve been digging into it over the last two weeks. And I seem to have caught it just as a redesign launched today. LL Bradford looks great, and GT America is a good choice (though Akkurat looked lovely too). Naz I love your writing V! I am thankful for it. P.S. Your blog’s design is brilliant Shreejith I really like your blog. It has a calming atmosphere. I’ve just discovered this place. I think I’ll be around for a long time. İsmail Şevik Love you website V! Love the design and also your writing. Lot of inspirations for my blog! Rishikesh Sreehari Hi! You have an incredible website, full of interesting things. An interesting personal site is an interesting life. You inspired me with some of the design decisions on my own website. I like your menu, the shortcuts, and the roundrects. Carlos I’ve been a subscriber for over five years now and your writing is something I continue to look forward to. Keep it coming! Brian I can’t remember when or how I stumbled on your blog but it’s been on my reading list ever since. Love your posts, love your style, love that you’re not afraid of exploring different topics, and also love your photos. Definitely need to have you as a guest on P&B at some point! Manu Awesome website, V! Had a great time reading your essays, and look forward to your newsletter too. Stefan"
