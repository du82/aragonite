title = "V.H. Belvadi — Newsletter • (Venkatram Harish Belvadi)"
description = "V.H. Belvadi’s personal website and blog"
full_description = "Newsletter Confluence discusses technology, science and society, and prompts you to think critically about your world. Dispatched fortnightly. Browse the archives Confluence is a free newsletter delivered every fortnight discussing a single topic connecing science, technology and society, drawing on historical and philosophical ideas in a practical manner, intended to make you think critically about your world. I write each issue thoughtfully, independently and after considerable research. No AI or any gimmicks are involved nor will they be in the future (although we will talk about AI from time to time). The interconnections between science, technology, history and society is in fact my academic interest. So you can expect sound, measured, academic and scientific opinions and invitations to discuss issues, not propaganda or hyperbole. Critical thinking is incredibly important today, with social media overflowing with misinformation and overstimulation everywhere on the web. Every issue is written with the express intention of helping you think critically about our world. Issues are only sent out when I have something to say, which means some weeks you might not receive issues at all. More importantly, this means you can be sure you will never receive issues just for the sake of it. I value your time spent reading this newsletter just as I value my own time spent writing it. In a fast-paced, scientifically-minded world, it can be easy to lose track of the bigger picture of what it all means for us as individuals and for our society. This is not a science newsletter. Instead it puts science into a proper social, philosophical, personal, historical and practical perspective. Read a few testimonials from existing subscribers below. (If you’re an existing subscriber, let me know your thoughts too.) Or you can browse past issues in the archives. Interesting stuff ... always makes me think about the world differently, thoughtfully. Bjorn M. The perfect combination of casual banter and rigorous discussion! Céline L. Always introduces me to something new that I quickly realise was really important for me to have known. N. Tsujihara Thought I’d give it a try and it’s been over 8 years now. Says enough. Abhiraj G. It’s not preachy and I like that about Confluence. Zuri S. I thought I knew science ... until I read your newsletter. It really made me start looking at things differently. Dhananjay P. Prioritising quality over regularity is refreshing ... There’s something great to read every time I get your newsletter. Tom B. Perfect companion for a cup of coffee. Makes me think, and does it unpretentiously. Jessica L. Subscribe to my newsletter Confluence is a free newsletter discussing technology, science and society, prompting you to think critically about your world. Dispatched fortnightly. Subscribe Five reasons to subscribe → No. 24 The self-help industry No. 23 The meaning of ‘knowing’ No. 22 Is preservation tantamount to celebration? No. 21 How to use AI to ensure a more human society No. 20 The dark side of philanthropy No. 19 Digital relationships No. 18 Form and content No. 17 Should you do your own research? No. 16 The arctic permafrost has been mapped No. 15 How can we solve the popular science conundrum? No. 14 Stop calling it ‘Barbenheimer’ No. 13 How time could shift the world’s economic balance No. 12 Threads, Bluesky and the great race to monopolise ActivityPub No. 11 Artificial Intelligence has finally learnt enough to end society as we know it No. 10 Countries have stepped into 2023 carrying their COVID-19 baggage with them No. 9 Why is tech starting to look right-wing? No. 8 Dispatch from Rhûn is now Confluence No. 7 Tune out of your default settings No. 6 Getting artsy No. 5 Let’s talk about the year 2040 No. 4 Long-term investments No. 3 Three people you should meet No. 2 Balance is key No. 1 Dispatch from Rhûn"
