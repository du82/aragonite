["https://vhbelvadi.com/a-note-on-my-absence"]
title = "V.H. Belvadi — A note on my absence • (Venkatram Harish Belvadi)"
description = "V.H. Belvadi’s personal website and blog"
full_description = "A note on my absence I think a lot of my readers would agree that I need to stop going AWOL from my website and they would be right. I have been caught up in my climate science research for the past few (rather hectic) months here at the University of Leeds and ended up writing but not polishing or publishing six essays for my website during this period. I hope to publish at least a few of them over the coming months but I want to start off with a contribution to this month’s IndieWeb Carnival within a day or two—we have another fantastic theme this time. I also have a few photographs lined up to add to my Leeds and Ilkley moor exhibits as well as a new Oxford exhibit from a recent conference I attened at Queen’s College. And there are more issues of Confluence and some thoughts on the recent riots here in the UK. Will all that see the light of day? In time. This is a note: a brief thought or notable piece of information from my commonplace book. For longer writings, please see ‘Essays’."
