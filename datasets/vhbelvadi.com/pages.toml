title = "V.H. Belvadi — Blogroll • (Venkatram Harish Belvadi)"
description = "In the ’90s there were blogrolls; it’s time we brought them back"
full_description = "Blogroll In the ’90s there were blogrolls; it’s time we brought them back As Eli Motyca writing for The Debrief puts it, “For some in their 30s and 40s [the IndieWeb is] a recreation of an Internet experience they encountered as teenagers traversing bulletin boards and peeking into small, tightly knit online communities.” A big part of this experience were blogrolls where you would, for no reason other than the fun of it, curate a list of links to other websites that you found interesting. I’m in the younger subset of this group but definitely a part of it. (Runescape is more than just a word to me and I remember Club Penguin.) Anyway, this is my blogroll in alphabetical order. Links are usually to specific pages I found interesting but most of these websites are splendid through and through. Asterisks are for my own reference. While this blogroll was rebuilt around 2023, the ones with asterisks are the nostalgic ones: websites that existed on my original blogroll (only pieces of which I have left thanks to no backups) from the early ’00s even if in some cases their links have been updated or moved over the years. 512 pixels Alastair Johnston Andrew Jaffe* Annie Mueller Asymptotia* Austin Kleon Bryce Wray Carl Barenburg Chris McLeod Cory Dransfeldt Daniel Savage Erika Cule* Fabian Holzer Henrique Dias Hidde de Vries Jan Willem Jasco Jason Velazquez Jeremy Keith Jeremy Cherfas Jim Nielsen John Gruber Kechi Ladapo Kev Quirk Kimberly Hirsh Lars–Christian Levi McG Manuel Moreale Mario Hamann Matt Stein Matthias Ott Melon King Nelson Nick Simonson Nikita Karamov Pete Moore Peter Coles* Peter Woit* P.J. Onori Rodrigo Ghedin Stephen Curry* Steve Ledlow Tracy Durnell Tyler Neylon Yaidel Now these are just the sites I frequent. There are some that are no longer active, like cocktail party physics, another member of my tattered, nostalgic blogroll. I suppose the internet moves on."
