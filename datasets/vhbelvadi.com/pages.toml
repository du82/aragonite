full_description = "Banksy on migration From www.esquire.com On February 24, 1955, Joanne Carole Schieble gave birth to a baby boy who would grow up to become Steve Jobs. Abdulfattah Jandali, a Muslim man who grew up in Syria and met Schieble while studying in America, was the baby’s biological father. After becoming pregnant in Syria, Schieble left for San Francisco, where she could safely have the child out of wedlock and put it up for adoption. In a new powerful piece on a wall in the Calais Jungle–a migrant city in France–the graffiti artist Banksy has captured Jobs’ origin story. The work shows Jobs as an adult with a traveling sack over his shoulder, wearing his iconic blue jeans, black turtleneck, and carrying an early Apple computer. Surrounding the art are the tents of migrants who are attempting to enter the United Kingdom. This is a note: a brief thought or notable piece of information from my commonplace book. For longer writings, please see ‘Essays’."
