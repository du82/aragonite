["https://vhbelvadi.com/ai-crawlers"]
title = "V.H. Belvadi — It’s time AI crawlers are forced to accept terms of use on all websites • (Venkatram Harish Belvadi)"
description = "V.H. Belvadi’s personal website and blog"
full_description = "It’s time AI crawlers are forced to accept terms of use on all websites Earlier today, Mike Morris posted about AI bots—I favour his term “plagiarism bots”—that feed off the content on websites such as this one as part of their language training models. This is theft, plain and simple. He linked to Gergely Nagy’s nginx config that fed The Bee Movie script to plagiarism bots that attempted to crawl his site. This is a terrific idea that more websites should incorporate. And while we’re at it, how about we also show them a prompt to accept our terms of use? This is a note: a brief thought or notable piece of information from my commonplace book. For longer writings, please see ‘Essays’."
