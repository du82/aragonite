["https://vibed.org/docs"]
title = "Documentation - vibe.d"
full_description = '''First, install the DUB package manager to let it handle downloading and building of vibe.d and derived applications. On non-Windows systems, a number of additional dependencies needs to be installed. See the project description on GitHub for details. Manual building (e.g. using RDMD) is a possible alternative, but you have to make sure that external libraries are linked in (such as OpenSSL) and that the import directories for all sub projects of vibe.d (such as vibe-core and vibe-http) are properly set. You can run DUB with the -v switch to see the actual compiler command line if in doubt. This will create a new directory with the given name and creates the basic directory structure that is recommended for vibe.d projects. Running it will start up an HTTP server on port 8080, serving a simple plain-text page. As the next step, you can go ahead and edit the source/app.d file. If you want to publish your project, you should also edit the dub.json/dub.sdl file and properly fill in all fields, including a "license" field. Once you have the project in place, simply run DUB from the project's root directory and it will get all dependencies, compile the application, and run it: The recommended directory structure for a project, which the "dub init" command establishes, is separated into three base folders: The 'views' sub folder is automatically searched for templates instantiated with render. The two templates in the example structure might look like this: This structure makes use of the blocks/extensions feature of the Diet template compiler. For more advanced template features see the Diet template documentation. Finally, the "dub.sdl" (SDLang) lets the vibe.d package manager automatically download and compile dependency libraries. This file will also provide the description that is needed to later put your own library into the public extension registry. DUB also provides support for the original JSON based syntax. The filename to use is "dub.json" in this case: A library of example projects is maintained in the Git repository. Most things not covered in this document can be found there in the form of code: Example projects'''
year_published = 2025
