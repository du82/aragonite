["https://vibed.org/tutorials"]
title = "Tutorials - vibe.d"
full_description = '''This book gives a thorough overview of most aspects of vibe.d. Highly recommended if you want to get familiar with all corners and technical details! Chapter 10, "Taking D Online", of Michael Parker's "Learning D" book contains a detailed introduction to vibe.d of almost 50 pages. In this introduction, it interactively develops a movie database web application. If you want to get a complete picture of the possibilities of the language as well, this is a great choice. Rey Valeza has written the second edition of his web application tutorial, this time expanding more on the database side of things and MySQL in particular. The tutorial, step by step, develops a simple, but complete employee and time managemant application. All layers of development are covered, from database and program logic to HTML templates and bootstrap based CSS styling. This tutorial gives an overview of modern web application (back end) development in D. Step by step, it will make you familiar with all the tools needed. The level of abstraction is kept pragmatic, without going into every detail of the language. There is also a similar tutorial by Charles Smith, using lower level APIs and without a database: WebSocket example This video tutorial goes through the basics of setting up a D environment up to running the first vibe.d based web application. There is also a number of follow-up tutorials that touch other aspects of the D language. Lawrence Aberba has written a small series of blog posts going from a minimal HTTP server application to handling the upload of multiple files. Mihail Strasun (aka Dicebot) has written a series of articles that go through various aspects ranging from environment setup to creating RESTful services. Ilya Yaroshenko has written a general D introductory tutorial that contains a section about web application development with vibe.d This blog post by Kai Nacke explains the steps necessary to build an Ubuntu based Docker image of a vibe.d server application. Presents a short configuration example for how to use Nginx as a reverse proxy in front of a vibe.d application.'''
year_published = 2023
