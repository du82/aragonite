full_description = "May 16, 2015 GPG transition statement You can find this exact same transition statement here: GPG_transition_statement_2015-5-15.txt -----BEGIN PGP SIGNED MESSAGE----- Hash: SHA512 Friday may 15 14:06:36 CEST 2015 For a number of reasons, i've recently set up a new OpenPGP key, and will be transitioning away from my old one. The old key will continue to be valid for some time, but i prefer all future correspondence to come to the new one. I would also like this new key to be re-integrated into the web of trust. This message is signed by both keys to certify the transition. the old key was: pub 2048R/0xE0565E925702AA3A 2012-09-09 [expires: 2017-09-08] Key fingerprint = 4D0A 831A 5223 592B 43F5 FA2F E056 5E92 5702 AA3A And the new key is: pub 4096R/0xA2591E231E251F36 2015-05-13 [expires: 2016-05-12] Key fingerprint = E3C5 114C 0C5B 4C49 BA03 0991 A259 1E23 1E25 1F36 To fetch the full key you can get it with: wget -q -O- https://viccuad.me/assets/publickey.txt | gpg --import - Or, to fetch my new key from a public key server, you can simply do: gpg --keyserver pgp.mit.edu --recv-key 0xA2591E231E251F36 If you already know my old key, you can now verify that the new key is signed by the old one: gpg --check-sigs 0xA2591E231E251F36 If you don't already know my old key, or you just want to be double extra paranoid, you can check the fingerprint against the one above: gpg --fingerprint 0xA2591E231E251F36 If you are satisfied that you've got the right key, and the UIDs match what you expect, I'd appreciate it if you would sign my key: gpg --sign-key 0xA2591E231E251F36 Lastly, if you could upload these signatures, i would appreciate it. You can either send me an e-mail with the new signatures (if you have a functional MTA on your system): gpg --armor --export 0xA2591E231E251F36 | mail -s 'OpenPGP Signatures' me at viccuad.me Or you can just upload the signatures to a public keyserver directly: gpg --keyserver pgp.mit.edu --send-key 0xA2591E231E251F36 Please let me know if there is any trouble, and sorry for the inconvenience. Regards, Víctor Cuadrado Juan -----BEGIN PGP SIGNATURE----- iQEcBAEBCgAGBQJVVei4AAoJEOBWXpJXAqo6fFEH/03LolT+MVzz2ZuKn2qlngeY x/Xj5q0BxNFZ4ZmKCngOBrfGYlTKWLTANcElOIXFxhAOJZKumaZjXL49Ua9dtUCx 271jeWGGbwcXBUdmoXUYyHffe9Y1jskBdkEZH7vr7ME8gSuzyl5V6+7b15uV2SjH Roe50LOHk2Z8LAa307kCdE/k+U4guiU/nal8RY6byhG8ko8X1iQiE0Dj3YVzBnLr QnY59CsHOcNHYAEyPGhBBt2zqVSN3eDKVGLv9yUG1Le1xgVJcKGSYAt1FDuWMSTt qu/q4qtr2ZopOIv4ggOFr8KqEmf1OVscFFA9CecNXAFRDoIxhr3RQQF+6hATLF+J AhwEAQEKAAYFAlVV6LgACgkQolkeIx4lHzZ8UQ//ZyG3QHvR9ZmyTjVXd2nRjpHr g5BdvxAmFGMMkc+bKTUrFy4qjK27LTIebBsM8XNrv58YjCcvAZ/0W7u45s2T1JMU OFRk+iPuU2BUUZZWL14WmydbdTdDBaLsxSWr8ZWhgJP/QkcxtK1Q54Cj5/c2e5aE RD5rf9mMPCXG1Tnf3iQQ+vAYX7izMszxabhSANiICwSd4vo2LEf0bFEqtluZjtkI 6bxYHmFOOTeGokttTZJl4rCg0brc4NnGn6ZCtrtSIomIgJSCl1aJEyKhSVdQX4x7 jLxSCCdlspk1irnQ2LZyHorL84xFnxg11Xq5QXhD7QhLobdjQK7euSHST13mVvKN uEP/cBDLQDeOlMsTz0rhHesVCkggqRn+JlSpnTwwwf/uwFLIZDA345DDt8UsqTe4 GsbttWzQAvs0p3jEUzcoF3XpG7CHrnt3EqFQPoziADA5LXlcZtZqfkERhzyUVCYJ OYQiNMjjK/XZCfYFo4ntfQIao/RoSJEjUEKxyR5jfXCfvrCwbvqDbYrVITjAAFgY 1s/Mrrw9h8UZ+M+Id/Blo/GkGorwQbPkcq+6V8fe/kZy1XcOFeCBNGueY9UsZZC1 K8/bP/OVDlVsPlQiq9uHyyHNozSCoBUA3MDR3S+5fOoHX7Y3aaDr0UmhRFS0bmiF xwkYQ7WiMPlZndj869s= =kGV8 -----END PGP SIGNATURE----- Víctor Cuadrado Juan I'm Víctor Cuadrado Juan, a developer and FOSS enthusiast, in love with Linux. Currently living in Nürnberg, Germany. Feel free to waste your precious time around here, or to contact me."
