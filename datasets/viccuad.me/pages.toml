description = "viccuad blogs here, when he blogs. And mostly about CS things."
full_description = "November 4, 2013 How to learn anything Here’s an amazing TED talk: the first 20 hours: how to learn anything Summing it up It only takes 20 hours to be good at something (that’s like 45 min a day for a month, even leaving some days out). The needed steps are: Deconstruct the skills: practice important things first. Learn enough to self correct: notice when you make a mistake. Remove practice barriers: TV, internet, etc. Practice for at least 20 hours: this removes the practice barrier called “feeling dumb”. Don’t forget: the major barrier to learning something is emotional: we are scared! Víctor Cuadrado Juan I'm Víctor Cuadrado Juan, a developer and FOSS enthusiast, in love with Linux. Currently living in Nürnberg, Germany. Feel free to waste your precious time around here, or to contact me."
