oretical GPIO throughput Compare to 87.1% for I2C Perhaps YJIT handles the SPI control flow or keyword args better? Ruby+YJIT’s throughput is 94.2% of a hypothetical C SPI with equal overhead to I2C Real C overhead may be a bit more, as mentioned above, favoring YJIT I don’t feel the need to write it for real and find out. Maintaining Ruby instead of C is worth the small performance hit, especially when these are likely to be used at far lower data rates than tested. Updated: September 15, 2024 Previous Next"
