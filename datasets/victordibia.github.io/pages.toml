title = "CV | Victor Dibia"
description = "CV and Bio for Victor Dibia | Research Scientist, experienced in Applied ML and HCI"
full_description = "CV A copy of my CV can be downloaded here.This file was last updated on Thu Sep 12 2024.Bio I am currently a Principal Research Software Engineer at the Human-AI eXperiences (HAX) team, Microsoft Research where I focus on Generative AI. My research interests are at the intersection of human-computer interaction (HCI), computational social science, and applied machine learning. My research has been published at conferences such as ACL, EMNLP, AAAI, and CHI and has received multiple best paper awards. My work has also been featured in outlets such as the Wall Street Journal, VentureBeat, CIO here. I am an IEEE Senior member, a Google Certified Professional ( Data Engineer, Cloud Architect ) and currently a Google Developer Expert in Machine Learning.I hold a PhD in Information Systems from City University of Hong Kong (recipient of the HKPFS scholar award by the Hong Kong Research Grants Council). My dissertation studied developer contribution behaviour in software crowdsourcing contests - factors influencing participation, the impact of incentives on participation behaviour and the problem solving process within crowdsourcing contests. Prior to City University, I studied at the Information Networking Institute at Carnegie Mellon University where I earned a Masters degree in Information Networking. I previously worked as a Principal Research Engineer at Cloudera Fast Forward Labs, Research Staff Member at IBM Research, Technical Lead for MIT Global Startup Labs, Researcher at the Innovation Management Lab, Athens Information Technology Athens Greece, and founder/lead developer for a small startup focused on West African markets. In my free time, I enjoy music (some self taught guitar, piano), sports (participated in the Hong Kong Marathon thrice) and exploring art (some drawing, 3d modelling, african mask art). All content on this site are my ideas and do not reflect opinions of my employer. Research Questions My research contributions have sought to address variants of these questions: How do users make decisions as they use technology tools? What are the implications for interface design? See related publications on information systems, hci. How can we be build tools that help non-experts understand machine learning? See publications on machine learning, visualization, education. How can we apply advances in ML in designing better user (read product ) experiences? See publications on machine learning, visualization. -> All Publications Applied ML/Interaction Research I am well versed in several research methodologies - surveys, interviews, lab observation, prototyping, focus groups, usability studies, cognitive walkthrough, usability benchmarking, think-aloud protocol, field testing, wireframes, card sorting, panel data analysis. More recently, I spend time designing and evaluating applications built using Machine Learning. See a list of my projects built using Machine Learning .Development/Engineering I write code. Comfortable with Machine Learning Frameworks (Tensorflow, Sklearn, Numpy, Pandas), OOP languages - Python,Nodejs, Java, C# and Front End Tools - HTLM5, Javascript, CSS. Experienced in rapid prototyping, and product development on web, mobile (Android, Blackberry, Tizen), wearable devices(Android,Tizen).Talks A list of talks I have delivered. November 2024 QCon San Francisco 2024San Francisco, USA. 10 Reasons Your Multi-Agent Workflows Fail and What You Can Do About It Talk Page slides October 2024 CfD Conversations SeriesHybrid (In-person & Virtual). What Can GenAI Really Do for Data Visualization? event December 2023 Ai.dev / Cassandra SummitSan Jose, McEnery Convention Center. AutoGen: NextGen AI Applications via Multi Agent Conversations recording June 2021 Fast Forward LiveOnline. Deep Learning for Automatic Offline Signature Verification recording November 2019 QCON SFSan Francisco, USA. ML in the Browser: Interactive Experiences with Tensorflow.js recording November 2019 Tensorflow World Santa Clara, California USA. Handtrack.js: Building gesture-based interactions in the browser using TensorFlow.js November 2019 Google ML SummitPittsburgh PA, Cambridge, USA. Art + AI : Generating Novel African Mask Art using Generative Adversarial Networks recording September 2019 OReilly Strata Data Conference New York, USA. Handtrack.js: Building gesture-based interactions in the browser using TensorFlow May 2019 !!Con New York, USA. Dance of the Ancestors: I used Neural Networks to Re-imagine African Mask Art !! recording March 2019 NVIDIA GTC San Jose, California, USA. Data2Vis: Automatic Generation of Data Visualizations Using Sequence-to-Sequence Recurrent Neural Networks. recording slides Read the Newsletter. Read and Subscribe Powered by Substack. Privacy Policy. I write a monthly newsletter on Applied AI and HCI. Subscribe to get notified on new posts.Feel free to reach out! Twitter, GitHub, LinkedIn ."
