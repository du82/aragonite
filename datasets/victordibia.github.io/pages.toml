full_description = '''Hi, Victor here. I'm an expert in Applied Machine Learning and HCI. Interested in a consulting session with me? Learn moreI am currently a Principal Research Software Engineer at the Human-AI eXperiences (HAX) team, Microsoft Research where I focus on Generative AI. My research interests are at the intersection of human-computer interaction (HCI), computational social science, and applied machine learning. My research has been published at conferences such as ACL, EMNLP, AAAI, and CHI and has received multiple best paper awards. My work has also been featured in outlets such as the Wall Street Journal, VentureBeat, CIO here. I am an IEEE Senior member, a Google Certified Professional ( Data Engineer, Cloud Architect ) and currently a Google Developer Expert in Machine Learning.I hold a PhD in Information Systems from City University of Hong Kong (recipient of the HKPFS scholar award by the Hong Kong Research Grants Council). My dissertation studied developer contribution behaviour in software crowdsourcing contests - factors influencing participation, the impact of incentives on participation behaviour and the problem solving process within crowdsourcing contests. Prior to City University, I studied at the Information Networking Institute at Carnegie Mellon University where I earned a Masters degree in Information Networking. I previously worked as a Principal Research Engineer at Cloudera Fast Forward Labs, Research Staff Member at IBM Research, Technical Lead for MIT Global Startup Labs, Researcher at the Innovation Management Lab, Athens Information Technology Athens Greece, and founder/lead developer for a small startup focused on West African markets. In my free time, I enjoy music (some self taught guitar, piano), sports (participated in the Hong Kong Marathon thrice) and exploring art (some drawing, 3d modelling, african mask art). All content on this site are my ideas and do not reflect opinions of my employer.Full Bio & CV <picture><so