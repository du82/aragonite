full_description = 'African Mask Art (Art + AI) I have explored some experiments with generating African Mask art with neural networks. This page is a list of curated collections from my experiments. The Ikenga Collection These art pieces are my interpretations of African Mask Art, developed using a two-stage generative adversarial network (GAN). GANs are a class of deep neural networks (a subset of the general field of artificial intelligence) which can be used to model the properties of a given dataset and leverage this knowledge in recreating samples that are distinct but similar to the original dataset. In this collection, I first curate a dataset of African mask art images, representing work dominantly from West, Central and South Africa. Next, a range of experiments are conducted where model parameters are selected and used to train a deep convolutional GAN. The resulting GAN is used to _generate_ a set of novel images. These images are further curated (the pieces below), and a second stage GAN (super resolution) is applied in upsampling the final collection.The title of the collection (ikenga - which translates to place of strength) (and the names of each piece) are drawn from the igbo language of West Africa. <picture><source srcset="/static/aef6b5ead512ef89560cf1d7be5422f2/f836f/13.jpg 200w, /static/aef6b5ead512ef89560cf1d7be5422f2/9dc27/13.jpg 300w" sizes="(max-width: 300px) 100vw, 300px" /><img loading="lazy" sizes="(max-width: 300px) 100vw, 300px" srcset="/static/aef6b5ead512ef89560cf1d7be5422f2/f836f/13.jpg 200w, /static/aef6b5ead512ef89560cf1d7be5422f2/9dc27/13.jpg 300w" src="/static/aef6b5ead512ef89560cf1d7be5422f2/9dc27/13.jpg" alt="Avatar" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>ihu osisi face of wood <picture><source srcset="/static/fe7e04eb17a4e6681b26f2dcdd1ce6de/f836f/22.jpg 200w, /static/fe7e04eb17a4e6681b26f2dcdd1ce6de/9dc27/22.jpg 300w" sizes="(max-width: 300px