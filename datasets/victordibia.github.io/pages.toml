full_description = "October 10th 2024 • 4 min read 10 things I have loved about Microsoft (3 years in!)Today marks my exact 3 year anniversary at Microsoft. Here are 10 things I love about working here.Today (October 10, 2024) marks exactly 3 years since I joined the Human-AI Experiences (HAX) group at Microsoft Research. It easily has been one of the best jobs I have had. Here are some reflections, and 10 things I have loved about working here. A photo from June 2022 during a visit to MSR Redmond. It is also fitting that Microsoft just got voted as the best place to work in 2024 by forbes. Microsoft is voted the best place to work in 2024 by ForbesThis year, the top 10 spots were populated by familiar contenders, but for the first time, Microsoft ranked at No. 1, after landing between No. 2 and No. 4 on every prior annual ranking. To determine the World’s Best Employers 2024, Forbes—in partnership with market research firm Statista—surveyed more than 300,000 employees in over 50 countries who work for multinational corporate groups that employ more than 1,000 workers and operate in at least two of the six continental regions of the world (Africa, Asia, Europe, Latin America and the Caribbean, North America and Oceania) Ten Things that have worked out well! Interesting Projects: I've had the opportunity to work on truly interesting projects, including AutoGen Studio, GitHub Copilot etc. Exceptional Colleagues: Great work environment, with a diverse group of intelligent and collegial people, making collaboration a pleasure. I have learned alot from members of the HAX team! Cross-Team Collaboration: I've had the chance to work closely with teams from other parts of the company, such as collaborating with GitHub folks for the Copilot launch, presenting work on LIDA to product teams from Excel, PowerBi, Purview and supporting cross-company efforts to enable GenAI for Visualization. Open Source Commitment: Microsoft is a significant contributor to open-source software, with projects like VSCode and numerous open source machine learning models on huggingface. This commitment to the developer community has been really refreshing. Being able to also open source my work (LIDA, AutoGen Studio and having it used by a broad community has been a really positive career/work experience. Awesome Bay Area Office: Our Silicon Valley where I sit is great! . See for yourself Microsoft Bay Area Office. Workplace Flexibility: There's considerable flexibility in terms of work location and hours, allowing for a better work-life integration. Hopefully, this continues to be the case. Visionary Leadership: Under Satya Nadella's leadership, Microsoft has undergone a remarkable transformation, fostering innovation and growth. Its a great time to be at Microsoft! Great Benefits: Excellent benefits package that supports employees' well-being and financial security. The best workplace award by Forbes agrees with this! Work-Life Balance: Microsoft promotes a healthy balance between professional and personal life, which is crucial for long-term satisfaction and productivity. This varies by groups and we are a bunch of hard workers at HAX. But we also take time off. Like really take time off. Career Growth Opportunities: There's a clear path for professional development, although, like in any large organization, some networking and self-advocacy are necessary for advancement. I appreciate I can understand the career ladder and what it takes to move up. Note!It should be needless to say, but the above is one individual's experience and a very small data point! The reader is encouraged to seek out multiple perspectives and experiences to form a more complete picture. Even within the same organizations, experiences will vary widely based on the team, manager, and individual circumstances. Conclusion Again, this is just my personal experience. The hope is that it is useful for anyone interested in joining Microsoft/Microsoft Research. Also, all of this is written with the humility of knowing that organisations change, individuals change Interested in more articles like this? Subscribe to get a monthly roundup of new posts and other interesting ideas at the intersection of Applied AI and HCI. Read and Subscribe Powered by Substack. Privacy Policy. ← Previous Next →"
