["https://victorianparis.wordpress.com/2015/06/26/murder-most-horrible-the-bloody-trunk-case"]
title = "Murder Most Horrible: The Bloody Trunk Case | Victorian Paris"
description = "Readers who remember O.J. Simpson’s trial fever will understand the immense frenzy surrounding a famous criminal case. And even that cannot compete with the Bloody Trunk Trial in 1890. Never was there a murder case where a suspect in custody was cheered by the crowd, thrown flowers, blown kisses, exchanged hand-shakes with officials and reporters,…"
full_description = '''Murder Most Horrible: The Bloody Trunk Case June 26, 2015 by Iva P. Readers who remember O.J. Simpson’s trial fever will understand the immense frenzy surrounding a famous criminal case. And even that cannot compete with the Bloody Trunk Trial in 1890. Never was there a murder case where a suspect in custody was cheered by the crowd, thrown flowers, blown kisses, exchanged hand-shakes with officials and reporters, travelled first-class, displayed elegant gowns, and enjoyed gourmet food. The four-foot-eight waif Gabrielle Bompard (21) did all that after admitting she was, indeed, somewhat guilty of murder. Gabrielle Bompard Gabrielle grew up in Northern France, the daughter of a widowed metal dealer. A burden to her father’s live-in mistress, the young girl was dumped into boarding schools and convents where she repeatedly misbehaved until sent packing. Finally, at her father’s request, she was locked up in a correctional institute where she remained until twenty. Once released, she sought fortune in Paris. The little money she brought soon ran out and her path crossed with Michel Eyraud’s. She became his mistress. In his fifties and no longer handsome, Eyraud proudly displayed his youthful paramour in boulevard cafés. Once an army deserter, he spent many years in the Americas until an amnesty allowed him to return to France. He spoke several languages and was an accomplished crook. At the time he met Gabrielle, his bumpy business career was nearing its end. He would soon be accused of fraud unless he found enough money to plug the hole. He turned to Gabrielle for help. The plan was simple: Gabrielle was to lure a rich man to an apartment where they would rob and kill him. As modest as the plan was, its execution was anything but. First, the would-be murderers travelled to London, where they purchased a trunk large enough to accommodate a human body. Next on the shopping list was fabric to sew into a body bag. Then came rope, a pulley, and a silk cord to be used as a noose. Back in Paris, Eyraud hammered the pulley into a crossbeam and installed a curtain across an alcove. This was to hide a chair and the hanging rope. Here, he would wait for the victim. Now, the couple only needed to snare a man known for carrying large sums of money and susceptible to the lure of fair sex. Among their boulevard acquaintances, they chose Toussaint-Augustin Gouffé, who was clearly interested in Gabrielle’s charms. Gouffé was a skirt-chaser extraordinaire. Investigation revealed that during the month before his death, he slept with twenty women. He readily accepted Gabrielle’s invitation to a romantic candle-lit evening. At first, everything proceeded according to plan: Gabrielle, clad in a dressing gown tied with the silk cord, skillfully maneuvered Gouffé onto a chaise longue next to the curtain. Her role was to playfully tie the cord onto a noose and slip it over the victim’s head. Something got wrong at that moment. Gabrielle froze, as she later claimed, and Eyraud brutally took over. In the subsequent struggle, the pulley gave under Gouffé’s weight, who crashed to the floor and had to be strangled by hand. Gabrielle spent a sleepless night alone with the trunk containing Gouffé’s body, while Eyraud retreated to his marital bed. His unsuspecting wife later reported that he snored loudly that night. In the morning, the couple hired a cab and had the trunk transported on a train to Lyons. Once there, they rented another vehicle and drove to a remote place above a river. They dumped the body down the steep embankment. Eyraud destroyed the trunk and disposed of the debris further down the road. Now was the time to start in another country. George Garanger The couple landed in Dover as Monsieur Labordère and his teenage son. The petite Gabrielle, her long hair chopped off, made a convincing boy. Several days later they boarded a transatlantic steamer heading for Canada. They were now known as E.B. Vanaerd, a wealthy businessman, and his daughter Berthe. They travelled from Québec to Montréal, and on to Vancouver, to end up in San Francisco. Along the way they met Georges Garanger, a wealthy Frenchman. Garanger immediately fell under Gabrielle’s spell, which was most convenient as Eyraud needed another victim to fleece and kill. Completely confident in Gabrielle’s obedience, he allowed the pair to travel East, presumably to meet Gabrielle’s aunt and settle an inheritance. He planned to wait for them in New York and to kill Garanger there. It was a fatal error. Gabrielle, tired of Eyraud’s frequent brutality and in love with the handsome Garanger, warned her new lover as soon as they were out of Eyraud’s reach. Instead of going to New York, the two diverted to Canada and from there to Europe. During the voyage, Gabrielle slowly unburdened herself, but Garanger did not fully grasp the reality until they reached Paris. François-Marie Goron, head of the Paris Sûreté Meanwhile, in France, the investigation into Gouffé’s disappearance started without a clue. Weeks later, a decomposed body found near Lyons was connected to the missing man thanks to the intuition of François-Marie Goron, the brilliant head of the Paris Sûreté. Goron did not hesitate to use the press to gather information from any public member willing to cooperate. There was no shortage of interest from a curious public. When the reconstructed bloody trunk was exposed in the Paris morgue for a week’s duration, thousands of people—Frenchmen as well as foreign visitors—patiently waited for hours to catch the sight. Two names were linked to the missing Gouffé: Michel Eyraud and Gabrielle Bompard, both notable by their absence since the victim’s disappearance in July. The big hunt began, first in France, then in England, and on to America. From each destination, the detectives returned with a wealth of information. There was no doubt whatsoever about the couple’s involvement in the Gouffé murder. Long before Gabrielle’s return to France, she and Eyraud became the world’s most wanted criminals. Gabrielle, playing Eyraud’s victim, surrendered herself to the police, the faithful lover Garanger by her side. The press and the public went wild. Perhaps unaware of the severe charges held against her, she thrived on her fame, or rather, infamy. Her every appearance, whether it was a transfer from prison to the Palace of Justice for interrogation, or a trip to the crime sites, drew huge attendance. Her portraits appeared in print, and the most trivial details, from her fashionable attire to the food she ordered, were deemed worthy of public interest. Pleased by so much attention, Gabrielle did her best to charm the crowd. A mug shot of Michel Eyraud Waiting in vain in New York, Eyraud was alerted by American newspapers that a French investigative team was on his heels. Immediately, he fled to Cuba, but his luck ran out. Apprehended in Havana and transported in a cage to France, he knew he was finished. Now that the two criminals were safely locked up, the stage was set for an action-packed trial. Gabrielle pleaded extenuating circumstances. She acted under the influence of hypnosis, she claimed. Eyraud would have none of it. Seething with hatred for her betrayal, he wanted her to share his all-too-certain death sentence. According to him, he never hypnotized Gabrielle; he was actually a lap dog carrying out her orders. However, Gabrielle had an extensive background in hypnotism. Many witnesses reported her ability to fall into deep sleep during hypnotic séances dating back to childhood. Today, we cannot fully understand hypnosis’ status in the 19th century. Not only was it the playground of the idle classes, but it was seriously considered by respected scientists. At the time of the trial, hypnosis was the battleground of two schools. One was led by the neurologist Charcot and his team in Paris, and the opposing School of Nancy headed by Professor Liègeois. “Is it possible that the accused killed under hypnosis and therefore is not responsible for her action?” was the burning question of the trial. “Absolutely not,” thundered the Paris team. “Absolutely yes,” countered the opponents. In the end, it fell to the jury to decide the outcome. The jury knew that by acquitting Gabrielle they would create a dangerous precedent. However, the accused was young and personable. Some extenuating circumstances could be admitted, couldn’t they? Gabrielle Bompard was sentenced to twenty years, of which she served twelve. Michel Eyraud was publicly guillotined soon after the trial. Thus ended the cause celèbre of the Bloody Trunk. Related posts: The Pantin Massacre Saint-Lazare: Women in Prison , BOOKS BY THE SAME AUTHOR: . Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in crime and justice | Tagged 19th century crime, 19th century France, 19th century Paris, bloody trunk case, cause celèbre, Gabrielle Bompart, hypnosis, life in Victorian Paris, Michel Eyraud, the Gouffé case | 6 Comments 6 Responses on July 5, 2015 at 5:47 pm | Reply Murder Most Horrible: The Bloody Trunk Case | Victorian Paris | First Night History […] Originally posted on Victorian Paris. […] LikeLike on November 2, 2015 at 5:17 am | Reply graham64 One of many murder mysteries where the body is stuffed into a trunk. LikeLike on October 1, 2022 at 5:16 pm | Reply The Pantin Massacre | Victorian Paris […] Murder Most Horrible: The Bloody Trunk Case […] LikeLike on February 26, 2025 at 1:13 pm | Reply Iva P. on February 26, 2025 at 9:33 am | Reply Zoe Hi, where are your sources? I’m doing a research project on Gabrielle Bompard. LikeLike on February 26, 2025 at 2:17 pm | Reply Iva P. If you research anything, go to perplexity.ai LikeLike Comments RSS Was this post useful to you? Share your thoughts here. Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); English Español Français Deutsch Português Bahasa Indonesia Other languages.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }E-book (434 pages) Recent Posts Love, Law, and Liberté: The Drama of Divorce in 19th Century France Tuberculosis: When Dying Became Fashionable Princess Mathilde Bonaparte: A Tale of Dogs and Breaking All Norms Brief Guide to 19th-century Paris Literary Landscape From Diligence to High-Speed Trains: Paris to Lille Then and Now Categories Americans in Paris (19) anarchists (2) anecdotes (8) architecture and urbanism (10) arts and literature (19) Belle Epoque (16) books about Paris (2) business (2) Commune (9) crime and justice (14) death (6) demi-monde (6) duels (2) economy (1) entertainment (14) family (6) fashion (22) food and drink (23) french history (2) Guide to Gay Paree 1869 (8) haute couture (1) health (8) history (5) hypnosis (1) important events (8) law (4) lifestyle (7) local customs (35) lodgings (7) manners (14) map (1) markets (8) marriage (5) monuments (4) morality (12) Napoleon III (18) night life (3) paris (2) Paris history (10) people of Paris (34) personalities (15) photography (3) prices (11) prostitution (16) public work and services (5) public works and services (11) Queen Victoria (4) science (3) Second Empire (18) Second Republic (2) shopping (9) sights (8) social life (9) sports (1) Third Republic (17) transport (6) uncategorized (31) workers and servants (11) Delicious, devious, and delightful The Boarding House transports you back to Paris during the enchanting Belle Époque period with a diverse ensemble of players: young and old, servants and socialites, French and foreign, polite and ill-mannered. It’s delicious, devious, and delightful. Iva Polansky writes with a style and authenticity you might wonder if she was there in another life. NEW!.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }One for All Madelon-la-Belle left Paris twenty years ago to escape her damaged reputation. She abandoned her infant daughter, Louise, in the care of her sister. Now she is back, a wealthy widow, and she plans to be a caring mother. Her idea of caring motherhood is to make Louise a high-born heiress. It only needs a little deception.This does not sit well with Louise’s father, Captain d’Artagnan of the Royal Musketeers, who finds Madelon’s plan unsound. He wants to see Louise married as soon as possible, before she becomes a slut like her mother, and has already found a good husband for her. Unfortunately, the formidable Madelon does not agree with d’Artagnan’s choice. A battle of wills ensues, involving d’Artagnan’s long-lost friends, Athos, Porthos, and Aramis. A comedy based on Alexandre Dumas’s classic novel The Three Musketeers. A comedy/screenplay Paperback, 140 pages Rags to Riches in Paris.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Fame and Infamy / Adventures of an American Maid in Paris Otto von Bismarck, German secret police, celebrated French artists and Miss Nelly McKay of Butte, Montana, come together in this lively mystery set in 1870’s Paris. Print or ebook, 410 pages He was right. She was right. Together they were wrong.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }THE WAR OF THE TOLSTOYS Leo Tolstoy’s last days: In 1910, newspapers around the world reported the tribulations of Russia’s most famous writer. The War of the Tolstoys tells it all. Screenplay, 110 pages Passion and Wit and Ménage à Trois ( a true story).widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Our Divine Emilie Two of the brightest minds of the French Enlightenment, Voltaire and Emilie du Châtelet, meet the poet Saint-Lambert in a dangerous liaison. Court intrigue, conspiracy, and betrayal are in abundance in this comedy/drama. (A Screenplay) .widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Email Subscription Enter your email address to subscribe to this blog and receive notifications of new posts by email. Email Address: Sign me up! Pages About Interview with Iva Polansky Mi-Carême: An Explosion of Joy in the Midst of Gloom New Release! Blogroll A Londoner's Diary American Girls Art Club In Paris. . . and Beyond Edwardian Promenade Historical Fiction eBooks Historical Tapestry History and Women Histoy Hack I Prefer Paris Les Musées de Paris London Historian's Blog My Daguerreotype Boyfriend Paris en Images Property Historian Scandalous Women The Quack Doctor The Secret Victorianist The Victorianist The Virtual Victorian Two Nerdy History Girls Unusual Historicals Victorian Era Victorian London Vic'''
