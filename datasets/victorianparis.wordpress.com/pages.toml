["https://victorianparis.wordpress.com/2018/02/23/the-english-courtesan-who-made-a-french-emperor"]
title = "The English Courtesan Who Made a French  Emperor | Victorian Paris"
description = "It takes a lot of effort to become an emperor. First, you have to believe in yourself and your star. This is easy when you are a nephew of Napoleon Bonaparte and the heir to his fallen throne. But you also need endless persistence: the strength to overcome failure, to dust yourself off after…"
full_description = '''The English Courtesan Who Made a French Emperor February 23, 2018 by Iva P. Louis-Napoleon Bonaparte It takes a lot of effort to become an emperor. First, you have to believe in yourself and your star. This is easy when you are a nephew of Napoleon Bonaparte and the heir to his fallen throne. But you also need endless persistence: the strength to overcome failure, to dust yourself off after a hard fall, and to pursue your goal with renewed energy. Next, you need a lack of moral scruples, the ability to handle people and, finally, a serious heap of money. Louis-Napoleon Bonaparte checked off every item on this list except the last one – but as we’ll see, he had a particular talent for finding people who did. When we meet Louis-Napoleon in London, he’s an errant prince with a résumé that would make most career counselors weep. He had staged two attempts at seizing power in France, was exiled to America for the first one (where he demonstrated remarkable skills in spending other people’s money), and imprisoned for life for the second attempt. He has recently escaped from a fortress, where he was supposed to rot, and now he is in London with only his name for capital. He is thirty-eight years old. What would you do at this stage of your life if you had these experiences? You and I would be glad to be alive and free, and we would consider having a quiet career in anything-but-politics. Louis-Napoleon, on the other hand, was incurable and able to function in dire circumstances. In fact, the more dire the circumstances, the more creative his solutions became. Although many unsavory rumors were later fabricated by his enemies, there is sufficient evidence that the prince behaved extremely badly during his American exile where he was sent with fifteen thousand gold francs. Indeed, King Louis-Philippe, then reigning in France, chose to reduce Louis-Napoleon’s first attempt at a coup d’état to a childish prank. He put some hush money in the ambitious youth’s pocket. After all, the Bonapartist feeling in France was still strong, and a political trial could rock the boat. Little did the king know he was essentially funding an ambitious study of New York’s nightlife. Louis-Napoleon, still in his twenties, managed to squander the money on New York’s ladies of negotiable virtue. After being thrown out of three brothels for misbehaving and out of his hotel for “forgetting” to pay, he lodged with a prostitute and proceeded to live off her earnings. If the woman’s clients complained about the price, “Loulou” changed their opinion with his fists. He thus ended in detention for assault and robbery. A skilled lawyer managed to set him free. The same lawyer, after Louis-Napoleon’s ascension to the throne, complained in a newspaper interview that he had never been paid for his effort. One should not, however, form the image of a lazy and brutal sex-addict, or at least not just that. Louis-Napoleon had many intellectual qualities that later helped him govern France. He was attentive and curious, pragmatic, and always willing to learn. During his imprisonment in the fortress of Ham (where he landed after his second coup attempt went as smoothly as a cart on cobblestones), he kept busy producing socioeconomic pamphlets filled with progressive ideas that he realized later in life. He also managed to father two male children with the local washerwoman – proving that even in prison, he could multitask between intellectual and romantic pursuits. In addition to being his most passionate interest, women served as vehicles for his political ideas. Whether they fell in love with his legendary name and title, his romantic charisma, or with the man himself, is difficult to say. Be it as it may, Loulou never lacked a sweetheart willing to sacrifice herself, along with her bank account, for his political success. In London, after his escape from prison, that post was filled by Miss Harriet Howard. Miss Harriet Howard The daughter of a Brighton shoemaker, Harriet, then aged twenty-three, was a beautiful and refined courtesan who amassed a fortune through careful investment of her charms. She laid her wealth at Louis-Napoleon’s feet – a gesture he accepted with the practiced grace of a man who had played this scene before. Being supported by a woman was nothing new for the prince. Harriet dumped her current rich keeper for him and began to earn a fat income from attracting clients to a gambling club. For good measure, she also took in Louis-Napoleon’s two small sons whom he had left behind in France. Thanks to Harriet’s industry, Louis-Napoleon led a comfortable life. Again, he kept busy writing. This time, he corrected his manuscript, The History and the Future of Artillery, and produced a study on an economically profitable canal in Nicaragua. He also kept current on the news from France. On February 26, 1848, he learned of a revolution in Paris. Suddenly, those canal plans would have to wait. The 1848 revolution painted by Alphonse de Lamartine There had been nothing drastically wrong with King Louis-Philippe’s government but, since the First Revolution in 1789, the French people had developed a certain taste for uprising – it was becoming something of a national hobby. This time, some clumsy government actions and a couple of moral scandals resulted in a riot that accidentally turned into a revolution. Not knowing what was wrong, and therefore unable to do something about it, Louis-Philippe gave up with the kind of decisive leadership that characterized his entire reign. While the revolutionary mob ransacked the royal palace of Tuileries, he bought a boat ticket for England. Crossing the Channel in the opposite direction was Prince Louis-Napoleon with Harriet’s fortune. He would need it to finance his candidacy in the first electoral campaign in French history. This time, everything turned out well for the prince. His name worked like magic, and his innovative social and economic ideas spoke for him. He was elected the first president of the Second Republic. He would also be the last one – a detail he thoughtfully neglected to mention in his campaign speeches. At the end of his four-year mandate, he staged his third and successful coup d’état to put the imperial crown on his head under the name of Napoleon III. (His cousin, the uncrowned Napoleon II, died in exile.) The Second Empire would last eighteen prosperous years. Until the next revolution… because some national hobbies are hard to break. Napoleon III (same man, improved wardrobe) And where was Miss Harriet Howard in all this? After financing an enormous electoral campaign, Harriet was often seen in the Prince-President’s company. However, she was never invited to the Elysée Palace where official business took place. The First Lady post was occupied by Louis-Napoleon’s cousin, Princess Mathilde. Still, Harriet kept hoping her lover would carry the imperial crown. Four years later, when no invitation came from the Tuileries Palace, the seat of the newly-formed imperial court, Harriet decided that she would wait no longer. She arrived there uninvited. It was the first, and the last time she appeared publicly in the emperor’s presence. What happened next would have happened anyway, but Harriet’s initiative accelerated the process. The next day, her dear Loulou visited her. This was not unusual as they maintained a warm relationship. However, this time he offered her an official mission to England. He provided her with a list of people to visit. She was tasked with establishing a good relationship between England and France. Thrilled to be named a goodwill ambassador, Harriet agreed to leave at once. When she and her escort reached shore, inclement weather prevented them from boarding their ship. Harriet purchased a newspaper while waiting for the weather to clear. There, she read the announcement of the emperor’s engagement to Eugenie de Montijo. She returned to Paris at once, realizing that her imperial patronage days were ending. Back home, she found her apartment in disorder, with upholstery slashed open and her desk taken apart. All compromising correspondence was missing. In the end, Harriet fared better than the unpaid New York lawyer. She received hereditary title, becoming the Countess de Beauregard, and retired to her country château of the same name. At her request, she continued to care for the washerwoman’s little boys. They also received titles. Nothing says “sorry about the mess” quite like making everyone count. Thus, a former English courtesan ended up mothering two French aristocrats. It was perhaps the most fitting ending possible to this peculiar tale of how a courtesan’s fortune and a man’s ambition transformed a penniless prince into Emperor Napoleon III. Harriet’s château Related posts: Eugenie, the Tragic Empress Loulou and the Zulus: The Life and Death of Napoleon IV Mark Twain on Napoleon III . If you enjoy these posts, support the author by buying her books on Amazon (also avaiable in print): . . Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in Napoleon III, Second Empire, Second Republic, uncategorized | Tagged 19th century France, 19th century Paris, Harriet Howard, Louis Napoleon Bonaparte, Second Empire, Second Republic | 1 Comment One Response on November 28, 2021 at 1:24 pm | Reply Davida I didn’t know much about this period in French history, nor of Napoleon III. He looks like a great opportunist, knew how to use people to his advantage. I always say that anyone who comes after a great man (whatever opinion people may have on Napoleon Bonaparte – he was great), and tries to steal the limelight, will fail miserably. LikeLike Comments RSS Was this post useful to you? Share your thoughts here. Cancel re