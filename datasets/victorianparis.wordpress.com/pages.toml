title = "Paris Morgue in Emile Zola’s Words (warning – gruesome!) | Victorian Paris"
description = "Read  Emile Zola's biography and literary output in Wikipedia The following is a passage in Zola's Therese Raquin (1867): ...Laurent imposed on himself the task of passing each morning by the Morgue, on the way to his office. He had made up his mind to attend to the business himself. Notwithstanding that his heart rose with repugnance,…"
full_description = '''Paris Morgue in Emile Zola’s Words (warning – gruesome!) June 23, 2012 by Iva P. Emile Zola 1860-1902 Read Emile Zola’s biography and literary output in Wikipedia The following is a passage in Zola’s Therese Raquin (1867): …Laurent imposed on himself the task of passing each morning by the Morgue, on the way to his office. He had made up his mind to attend to the business himself. Notwithstanding that his heart rose with repugnance, notwithstanding the shudders that sometimes ran through his frame, for over a week he went and examined the countenance of all the drowned persons extended on the slabs. While some retained their natural condition in the rigidity of death, others seemed like lumps of bleeding and decaying meat. At the back, against the wall, hung some lamentable rags, petticoats and trousers, puckered against the bare plaster. Laurent at first only caught sight of the wan ensemble of stones and walls, spotted with dabs of russet and black formed by the clothes and corpses. A melodious sound of running water broke the silence. Little by little he distinguished the bodies, and went from one to the other. It was only the drowned that interested him. When several human forms were there, swollen and blued by the water, he looked at them eagerly, seeking to recognise Camille. Frequently, the flesh on the faces had gone away by strips, the bones had burst through the mellow skins, the visages were like lumps of boned, boiled beef. Laurent hesitated; he looked at the corpses, endeavouring to discover the lean body of his victim. But all the drowned were stout. He saw enormous stomachs, puffy thighs, and strong round arms. He did not know what to do. He stood there shuddering before those greenish-looking rags, which seemed like mocking him, with their horrible wrinkles. One morning, he was seized with real terror. For some moments, he had been looking at a corpse, taken from the water, that was small in build and atrociously disfigured. The flesh of this drowned person was so soft and broken-up that the running water washing it, carried it away bit by bit. The jet falling on the face, bored a hole to the left of the nose. And, abruptly, the nose became flat, the lips were detached, showing the white teeth. The head of the drowned man burst out laughing… When there were no drowned persons on the back row of slabs, he breathed at ease; his repugnance was not so great. He then became a simple spectator, who took strange pleasure in looking death by violence in the face, in its lugubriously fantastic and grotesque attitudes. This sight amused him, particularly when there were women there displaying their bare bosoms. These nudities, brutally exposed, bloodstained, and in places bored with holes, attracted and detained him. Once he saw a young woman of twenty there, a child of the people, broad and strong, who seemed asleep on the stone. Her fresh, plump, white form displayed the most delicate softness of tint. She was half smiling, with her head slightly inclined on one side. Around her neck she had a black band, which gave her a sort of necklet of shadow. She was a girl who had hanged herself in a fit of love madness. Each morning, while Laurent was there, he heard behind him the coming and going of the public who entered and left. The morgue is a sight within reach of everybody, and one to which passers-by, rich and poor alike, treat themselves. The door stands open, and all are free to enter. There are admirers of the scene who go out of their way so as not to miss one of these performances of death. If the slabs have nothing on them, visitors leave the building disappointed, feeling as if they had been cheated, and murmuring between their teeth; but when they are fairly well occupied, people crowd in front of them and treat themselves to cheap emotions; they express horror, they joke, they applaud or whistle, as at the theatre, and withdraw satisfied, declaring the Morgue a success on that particular day. Laurent soon got to know the public frequenting the place, that mixed and dissimilar public who pity and sneer in common. Workmen looked in on their way to their work, with a loaf of bread and tools under their arms. They considered death droll. Among them were comical companions of the workshops who elicited a smile from the onlookers by making witty remarks about the faces of each corpse. They styled those who had been burnt to death, coalmen; the hanged, the murdered, the drowned, the bodies that had been stabbed or crushed, excited their jeering vivacity, and their voices, which slightly trembled, stammered out comical sentences amid the shuddering silence of the hall. There came persons of small independent means, old men who were thin and shrivelled-up, idlers who entered because they had nothing to do, and who looked at the bodies in a silly manner with the pouts of peaceful, delicate-minded men. Women were there in great numbers: young work-girls, all rosy, with white linen, and clean petticoats, who tripped along briskly from one end of the glazed partition to the other, opening great attentive eyes, as if they were before the dressed shop window of a linendraper. There were also women of the lower orders looking stupefied, and giving themselves lamentable airs; and well-dressed ladies, carelessly dragging their silk gowns along the floor. On a certain occasion Laurent noticed one of the latter standing at a few paces from the glass, and pressing her cambric handkerchief to her nostrils. She wore a delicious grey silk skirt with a large black lace mantle; her face was covered by a veil, and her gloved hands seemed quite small and delicate. Around her hung a gentle perfume of violet. She stood scrutinising a corpse. On a slab a few paces away, was stretched the body of a great, big fellow, a mason who had recently killed himself on the spot by falling from a scaffolding. He had a broad chest, large short muscles, and a white, well-nourished body; death had made a marble statue of him. The lady examined him, turned him round and weighed him, so to say, with her eyes. For a time, she seemed quite absorbed in the contemplation of this man. She raised a corner of her veil for one last look. Then she withdrew… Related posts: The dead of Paris The Guide to Gay Paree 1869 – Part 7: Sightseeing Also read the excellent post by Geri Walton Hanging Out at La Morgue in 19th Century Paris Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in arts and literature, death | Tagged 19th century France, 19th century Paris, Emile Zola, paris morgue | 8 Comments 8 Responses on January 20, 2013 at 10:17 pm | Reply Paris Was Les Miserable’!! « Brains and Eggs […] them suicide cases—were displayed on marble slabs for friends or family to identify. The morgue soon became a fixture for Parisians, with tens or even hundreds of people shuffling into the room to gawk at the dead and […] LikeLike on September 2, 2013 at 9:19 pm | Reply Liz Loveland I am very glad to have found your blog via a search that led me to this post while I was researching my next post for my new blog transcribing a diary I inherited of an American woman who lived in Paris from 1889 to 1890 (http://addiessojourn.wordpress.com/). Not only does this post answer my questions but I look forward to further exploring it. I am going to link to this post in my commentary for my next post, wherein she visits the Paris morgue. (It will probably be posted tomorrow.) Thanks for this interesting post! LikeLike on September 8, 2013 at 5:30 pm | Reply Tuesday, September 17, 1889 | Addie's Sojourn […] the blog Victorian Paris, blogger Iva quotes a lengthy passage about Paris Morgue visits from Emile Zola’s Therese Raquin (1867), including: “The morgue 