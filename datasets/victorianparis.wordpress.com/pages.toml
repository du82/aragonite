full_description = '''The Spectacle of Paris’ Streets December 17, 2018 by Iva P. When one lives in Paris, nothing is as difficult as staying at home. The city contains so many enticing spectacles, free or paid entertainment, that the temptation often becomes the strongest and that one abandons one’s home, attracted as we are by the charm of the street. We do not know what we are going to see, but we are sure we will see something, and that something will be new. Curiosity is so strong in Paris that the trees themselves undergo it and set themselves in motion.” ACROSS PARIS by Crafty So said Crafty, whose real name was Victor Eugène Géruzez (1840 – 1906). This graphic artist, painter, draftsman, and author of literature for youth, authored several picture albums depicting life in Paris in his humorous style. Let’s see how trees moved in Paris (and still do) as well as other spectacles, most of them completely free. Fire! The Aftermath of Fire A Wedding The Omnibus Station Poster Men Taking a Lunch Rest A Runaway Horse A Guided City Tour A Downpour At the Confectioner’s At the Bookseller’s / Food for the Mind Running on Empty Traffic-Stopping Street Hygiene The Suburban Train After Midnight Related post: Events in the Street: Female Duel with Sand-Filled Socks A Traveler’s Bonus: The Most Beautiful Metro Stations in Paris . If you enjoy reading these posts, support the author by purchasing her books on Amazon: . Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in arts and literature, lifestyle, people of Paris, Third Republic | Tagged 19 century Paris, 19th century, 19th century food, 19th century France, Crafty's illustrations, Victor Eugène Géruzez | 2 Comments 2 Responses on December 18, 2018 at 12:18 am | Reply MsBurb Very amusing… but still further proof that I’m a country girl over a city. Human hijinks I can only tolerate for a rare and finite outing; whereas, I live for everday solitude and natural surroundings. I guess people really are city mice or country mice.😊 LikeLiked by 1 person on July 1, 2024 at 10:50 am | Reply Shocked and Delighted: Anglo-Saxons in Parisian Cafés | Victorian Paris […] The Spectacle of Paris’ Streets […] LikeLike Comments RSS Was this post useful to you? Share your thoughts here. Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); English Español Français Deutsch Português Bahasa Indonesia Other languages.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }E-book (434 pages) Recent Posts Love, Law, and Liberté: The Drama of Divorce in 19th Century France Tuberculosis: When Dying Became Fashionable Princess Mathilde Bonaparte: A Tale of Dogs and Breaking All Norms Brief Guide to 19th-century Paris Literary Landscape From Diligence to High-Speed Trains: Paris to Lille Then and Now Categories Americans in Paris (19) anarchists (2) anecdotes (8) architecture and urbanism (10) arts and literature (19) Belle Epoque (16) books about Paris (2) business (2) Commune (9) crime and justice (14) death (6) demi-monde (6) duels (2) economy (1) entertainment (14) family (6) fashion (22) food and drink (23) french history (2) Guide to Gay Paree 1869 (8) haute couture (1) health (8) history (5) hypnosis (1) important events (8) law (4) lifestyle (7) local customs (35) lodgings (7) manners (14) map (1) markets (8) marriage (5) monuments (4) morality (12) Napoleon III (18) night life (3) paris (2) Paris history (10) people of Paris (34) personalities (15) photography (3) prices (11) prostitution (16) public work and services (5) public works and services (11) Queen Victoria (4) science (3) Second Empire (18) Second Republic (2) shopping (9) sights (8) social life (9) sports (1) Third Republic (17) transport (6) uncategorized (31) workers and servants (11) Delicious, devious, and delightful The Boarding House transports you back to Paris during the enchanting Belle Époque period with a diverse ensemble of players: young and old, servants and socialites, French and foreign, polite and ill-mannered. It’s delicious, devious, and delightful. Iva Polansky writes with a style and authenticity you might wonder if she was there in another life. NEW!.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }One for All Madelon-la-Belle left Paris twenty years ago to escape her damaged reputation. She abandoned her infant daughter, Louise, in the care of her sister. Now she is back, a wealthy widow, and she plans to be a caring mother. Her idea of caring motherhood is to make Louise a high-born heiress. It only needs a little deception.This does not sit well with Louise’s father, Captain d’Artagnan of the Royal Musketeers, who finds Madelon’s plan unsound. He wants to see Louise married as soon as possible, before she becomes a slut like her mother, and has already found a good husband for her. Unfortunately, the formidable Madelon does not agree with d’Artagnan’s choice. A battle of wills ensues, involving d’Artagnan’s long-lost friends, Athos, Porthos, and Aramis. A comedy based on Alexandre Dumas’s classic novel The Three Musketeers. A comedy/screenplay Paperback, 140 pages Rags to Riches in Paris.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Fame and Infamy / Adventures of an American Maid in Paris Otto von Bismarck, German secret police, celebrated French artists and Miss Nelly McKay of Butte, Montana, come together in this lively mystery set in 1870’s Paris. Print or ebook, 410 pages He was right. She was right. Together they were wrong.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }THE WAR OF THE TOLSTOYS Leo Tolstoy’s last days: In 1910, newspapers around the world reported the tribulations of Russia’s most famous writer. The War of the Tolstoys tells it all. Screenplay, 110 pages Passion and Wit and Ménage à Trois ( a true story).widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Our Divine Emilie Two of the brightest minds of the French Enlightenment, Voltaire and Emilie du Châtelet, meet the poet Saint-Lambert in a dangerous liaison. Court intrigue, conspiracy, and betrayal are in abundance in this comedy/drama. (A Screenplay) .widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Email Subscription Enter your email address to subscribe to this blog and receive notifications of new posts by email. Email Address: Sign me up! Pages About Interview with Iva Polansky Mi-Carême: An Explosion of Joy in the Midst of Gloom New Release! Blogroll A Londoner's Diary American Girls Art Club In Paris. . . and Beyond Edwardian Promenade Historical Fiction eBooks Historical Tapestry History and Women Histoy Hack I Prefer Paris Les Musées de Paris London Historian's Blog My Daguerreotype Boyfriend Paris en Images Property Historian Scandalous Women The Quack Doctor The Secret Victorianist The Victorianist The Virtual Victorian Two Nerdy History Girls Unusual Historicals Victorian Era Victorian London Victorian London Dictionary Archives Archives Select Month March 2025 February 2025 January 2025 December 2024 November 2024 October 2024 September 2024 August 2024 July 2024 June 2024 May 2024 April 2024 March 2024 February 2024 January 2024 December 2023 November 2023 October 2023 September 2023 August 2023 July 2023 June 2023 May 2023 April 2023 March 2023 February 2023 January 2023 December 2022 November 2022 October 2022 September 2022 August 2022 July 2022 June 2022 April 2022 March 2022 February 2022 Janua