description = "In the bustling streets of 19th century Paris, a transportation revolution was taking shape. As the city grew and modernized, its need for organized public transit became increasingly apparent. The early 1800s marked the beginning of regulated transport in the French capital. No public vehicle could circulate in the city without a special permit. In…"
full_description = '''Crinolines and Impériales: Public Transport in Paris October 15, 2011 by Iva P. “Impériale” omnibus, early 1850s In the bustling streets of 19th century Paris, a transportation revolution was taking shape. As the city grew and modernized, its need for organized public transit became increasingly apparent. The early 1800s marked the beginning of regulated transport in the French capital. No public vehicle could circulate in the city without a special permit. In 1853, the first double-decker buses called impériales appeared in the streets. The upper floor was uncovered and admitted only male passengers as the women’s voluminous crinolines were a dangerous obstacle in climbing the steep steps. The creation of the Compagnie Impériale des voitures de Paris in 1855 merged all existing public transport companies. Twenty-five public transport lines covered 150 km of Parisian streets. In the 1860s there were thirty-one omnibus lines, which served the city’s main thoroughfares from 8 a.m. until midnight. Private cabs, hailed on the street and marked with red numbers, cost 2 francs the hour. Small steamboats known as mouches (flies) or hirondelles (swallows) plied the Seine. The omnibuses were uncomfortable, with the users exposed to all winds. In inclement weather, the ride was very unpleasant. At the back, there was at first a ladder that was later replaced by a more convenient spiral staircase. There were 500 omnibuses and the company stables housed 7000 horses. Above: In 1855 Paris saw faster and larger two-horse omnibuses with 24 seats. Inside seats cost 30 centimes and included a transfer. A seat on the impériale cost 15 centimes, but no transfer was possible. Paris metro The idea of building a metropolitan railway system in Paris emerged in the late 19th century, following London’s example. After years of debate about whether to build elevated or underground lines, the city finally chose the underground option. Construction began in 1898, and the first line opened on July 19, 1900, just in time for the Paris World Exposition. This initial line ran between Porte de Vincennes and Porte Maillot. The architect Hector Guimard designed the distinctive Art Nouveau station entrances that would become iconic symbols of Paris. Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in prices, transport | Tagged 23354b, paris transport history, Victorian travel | 1 Comment One Response on October 27, 2011 at 9:46 am | Reply bpg great article.Love it! LikeLike Comments RSS Was this post useful to you? Share your thoughts here. Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); English Español Français Deutsch Português Bahasa Indonesia Other languages.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }E-book (434 pages) Recent Posts Love, Law, and Liberté: The Drama of Divorce in 19th Century France Tuberculosis: When Dying Became Fashionable Princess Mathilde Bonaparte: A Tale of Dogs and Breaking All Norms Brief Guide to 19th-century Paris Literary Landscape From Diligence to High-Speed Trains: Paris to Lille Then and Now Categories Americans in Paris (19) anarchists (2) anecdotes (8) architecture and urbanism (10) arts and literature (19) Belle Epoque (16) books about Paris (2) business (2) Commune (9) crime and justice (14) death (6) demi-monde (6) duels (2) economy (1) entertainment (14) family (6) fashion (22) food and drink (23) french history (2) Guide to Gay Paree 1869 (8) haute couture (1) health (8) history (5) hypnosis (1) important events (8) law (4) lifestyle (7) local customs (35) lodgings (7) manners (14) map (1) markets (8) marriage (5) monuments (4) morality (12) Na