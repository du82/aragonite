full_description = "Love, Law, and Liberté: The Drama of Divorce in 19th Century France March 1, 2025 by Iva P. . . Picture Paris, 1793: The revolution has upended society, heads are rolling (literally), and something equally shocking is happening in French households – divorce is suddenly legal. Not only legal but downright popular. In fact, in those heady early days of marital freedom, divorce cases in Paris actually outnumbered marriages. Welcome to the roller coaster history of divorce in 19th century France, where marriage rights ping-ponged back and forth like a heated game of tennis. It’s a tale of liberation, restriction, and ultimately, the slow march toward equality that would shape modern France. The Revolutionary Years: Liberty, Equality… Divorce? When the French Revolution swept away the old order in 1792, it didn’t just topple the monarchy – it revolutionized marriage. For the first time in French history, couples could divorce by mutual consent or even cite that most modern-sounding of reasons: incompatibility. The floodgates opened. In Paris alone, 1,300 couples called it quits in 1793, with numbers rising to 1,500 the following year. Parisians, it seemed, had embraced divorce with the same enthusiasm they’d shown for toppling the Bastille. Women, in particular, seized this newfound freedom with both hands. After centuries of being trapped in unhappy marriages, they could finally say “au revoir” to abusive or unsatisfactory spouses. It was a brief golden age of marital equality – but like many revolutionary ideals, it wouldn’t last. Enter Napoleon: The Party’s Over In 1804, Napoleon decided to put his stamp on French family life with his Civil Code, and let’s just say he wasn’t exactly a champion of women’s rights. While divorce remained legal, the grounds became far more restricted. The most glaring change? A spectacular double standard: women could be divorced for simple adultery, while men could only be divorced if they had the audacity to keep their mistress in the family home. Très scandaleux! The numbers tell the story: from those heady revolutionary days of 1,500 divorces a year in Paris, by 1810 the number had plummeted to a mere 100. Napoleon had effectively turned divorce from a right into a luxury. The Great Divorce Drought: 1816-1884 If Napoleon put a damper on divorce, the restored monarchy of 1816 slammed the door shut entirely. Divorce was completely abolished, leaving unhappy couples with only one option: legal separation (séparation de corps). This meant you could live apart, but remarriage was off the table. For 68 years, countless French men and women remained trapped in marital limbo, legally bound to spouses they’d rather forget. Think of it as France’s own “Victorian era” of marriage – proper, rigid, and absolutely miserable for many involved. The Third Republic: Divorce Makes a Comeback Finally, in 1884, like a long-lost lover returning from war, divorce made its grand reentrance into French society. The Third Republic, championing secular values over religious doctrine, reintroduced divorce laws similar to Napoleon’s (minus some of the more outrageous gender inequalities). While this wasn’t quite the return to revolutionary freedom – you still needed specific grounds for divorce rather than just claiming incompatibility – it was a massive relief for countless couples. Feminists like Hubertine Auclert had fought hard for this change, seeing divorce rights as crucial to women’s liberation. The Price of Freedom But let’s talk about the real impact on people’s lives. When divorce was legal, it came with serious consequences, especially for women and children. Property division followed the “community of property” regime, which sounds fair until you realize husbands controlled all property during marriage. Children could even be declared illegitimate after a divorce, affecting their inheritance rights and social status. And yet, despite these challenges, thousands of French citizens chose divorce when it was available. In the words of countless French novels and plays of the era, better a scandalous freedom than a respectable prison. What It All Means The story of divorce in 19th century France isn’t just about marriage – it’s about the broader struggle for individual rights and equality. Each change in divorce law reflected the political climate of its time: revolutionary idealism, Napoleonic control, religious conservatism, and finally, secular republicanism. Today’s French citizens, enjoying their right to divorce without proving fault (introduced in 1975), might look back on these nineteenth-century struggles with amazement. But they owe a debt to those early revolutionaries who first dared to declare that love – and marriage – should be a choice, not a prison. And isn’t that what liberté is all about? , Related posts: Without a Dowry: The Business of Marriage Without a sufficient dowry, the young woman in this painting has no hope of a happy future. Maybe, just maybe, she will marry a widower with six children or an old man in need of a nurse. Until then, genteel poverty is her fate. The newspapers in this picture story play a significant role: mothers assiduously read marriage offers published by individuals or by agencies. The Marriage Market The French, so reputed for love, had a strictly business-like approach to marriage. Men and women were merchandise with a price tag and matrimony was a financial transaction much like any other commercial deal. Wealthy widows purchased titles; young beauties without dowry offered themselves for sale to rich old men. The intention to marry a fortune was expressed candidly in newspaper ads like these: Customize buttons . IF YOU LIKE THESE POSTS, READ MORE BY THE AUTHOR: Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Posted in marriage | Tagged 19th century France, French Revolution, history, france, History of divorce in France, marriage, divorce | 2 Comments » Tuberculosis: When Dying Became Fashionable February 1, 2025 by Iva P. With the Industrial Revolution, two deadly diseases, tuberculosis and syphilis, spread rapidly with devastating consequences for humankind. Unlike syphilis, which carried heavy moral stigma, tuberculosis – paradoxically – gained a degree of cultural acceptance that would seem incomprehensible today. More about it later. Tuberculosis typically affects the lungs (but can impact other body parts), leading to hacking, bloody coughs, debilitating lung pain, severe fatigue and extreme anemia. The disease earned several grimly appropriate names: “The Robber of Youth” due to its high mortality rate among young people, “The Great White Plague” and “The White Death,” referring to the extreme pallor of its victims. It was also known as “Consumption,” describing how the disease seemed to consume its victims from within. No matter the name, tuberculosis’s impact on human populations was staggering. In19th century it claimed one in four adults in both Europe and the United States. Paris, despite its grandeur and ambitious urban renovations, could not escape this worldwide pattern. The city’s population nearly doubled between 1815 and 1850, as peasants flocked to the capital in search of employment. This dramatic demographic shift resulted in severe overcrowding, particularly in working-class neighborhoods. However, tuberculosis claimed its victims in all social classes. Paris’s unique social and cultural landscape would shape its response to the epidemic in its peculiar way. As the victims were often young and beautiful, the disease became perversely fashionable, associated with artistic sensitivity and romantic suffering. The pale, wan appearance of TB sufferers – with their bright eyes and flushed cheeks – became an aesthetic ideal that invaded the world along with Parisian fashion export. Fashionable healthy women would paint themselves to look consumptive using white makeup containing arsenic. Corsets were tightened to achieve that enviable “I can barely breathe” appearance, which, ironically, didn’t help anyone’s respiratory health. Thin and weak was the desirable effect. The fact that tuberculosis was actually lethal seemed to be merely an inconvenient detail in the pursuit of romantic suffering. This “consumptive chic” found it’s way into art and literature. Literary descriptions and artistic representations promoted ethereal weakness and elegant suffering. Writers and artists frequently succumbed to the disease, further cementing its romantic associations. The poet Charles Baudelaire wrote extensively about consumption before his death. Countless novels and operas featured heroines dying beautifully of tuberculosis, most famously Violetta in Verdi’s La Traviatta and Mimi in Puccini’s La Bohème, set in Paris’s Latin Quarter. The medical community tried everything short of magic spells to cure tuberculosis but little had changed since the Ancient Rome. As early as 174 A.D., the renowned Greek physician Galen, serving as personal physician to Roman Emperor Marcus Aurelius, provided one of the first detailed clinical descriptions of tuberculosis. His observations remain remarkably accurate today (primary symptoms: fever, sweating, coughing, and blood-stained sputum). To treat the disease, he recommended fresh air, milk, and sea voyages. These therapeutic approaches would remain influential for nearly two millennia. In the 19th century, the wealthy sought cure at sanitariums in the French countryside or Swiss Alps, while the poor relied on home remedies. Traditional cures included bloodletting (because apparently having less blood was supposed to help), consuming raw meat, inhaling various vapors, or drinking herbal concoctions. Emerging medical approaches, slightly more scientific, still mostly wrong, were cod liver oil administration or deliberately collapsing a lung (because having two working lungs was clearly excessive). Treatments in Paris’ hospitals were limited and often ineffective. The Hospital Laennec, named after the inventor of the stethoscope, became particularly associated with tuberculosis treatment, though its overcrowded wards often served more as places to die than to heal. In 1865, Jean-Antoine Villemin, a French physician, demonstrated that TB was contagious, conducting experiments at the Val-de-Grâce military hospital. However, it wasn’t until 1882 that German scientist Robert Koch identified the bacterium responsible. As understanding of the disease’s contagious nature grew, authorities began implementing public health measures. Baron Haussmann’s renovations of Paris, while primarily aimed at political control and modernization, had the unintended benefit of improving public health by creating wider streets and better ventilation. The city also launched campaigns against spitting in public places and began efforts to improve housing conditions. While we can now look back with a mixture of horror and amusement at some of the Victorian approaches to tuberculosis, the disease’s impact was no laughing matter. The crisis helped establish precedents for public health intervention and the importance of social medicine. Related posts: Syphilis: The Scourge of the Victorian Era Haussmann: The Man Who Transformed Paris IF YOU LIKE THE ARTICLES HERE, READ MORE BY THE SAME AUTHOR: Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Posted in death, fashion, health | Tagged 19th century fashion, 19th century France, 19th century Paris, health, medicine, news, public-health, tuberculosis | Leave a Comment » Princess Mathilde Bonaparte: A Tale of Dogs and Breaking All Norms January 1, 2025 by Iva P. . After Napoleon III, Empress Eugenie, and the Prince Imperial, let’s add yet another profile of a Bonaparte who imprinted their personal style on 19th-century Paris: Princess Mathilde. If you were to design the exemplary French princess of that time, you probably wouldn’t come up with Princess Mathilde Bonaparte. For one thing, she had an unfortunate habit of saying exactly what she thought. This in Parisian high society was about as welcome as bringing a skunk to perfume testing. For another, she smoked cigarettes in public which was shocking for a proper lady. A gifted painter, she exhibited her artwork at the prestigious Paris Salon. This was highly unusual for a woman of her social standing. She also lived openly with her boyfriend while still technically married to someone else. In short, she was splendidly unsuited to her role, which might explain why she was so remarkably good at it. Born in 1820, the daughter of Jerome Bonaparte – then King of Westphalia – Mathilde seemed destined for a properly royal life. At 17, she was engaged to her cousin Louis-Napoleon, who later became Napoleon III. This might have led to her becoming Empress of France, except that Louis-Napoleon inconveniently attempted his second coup d’état just then. Nothing ruins a good engagement quite like your fiancé trying to overthrow the government and failing spectacularly at it. Instead, Mathilde married Count Anatole Demidoff, a Russian aristocrat who turned out to be, putting it mildly, a cad. It was a stormy existence. The marriage reached its dramatic conclusion when Demidoff slapped her in public. He forgot that his wife had high connections across Europe and her mother was Tsar Nicolas I’s first cousin. The crown prince, the future Tsar Alexander II, stepped in to arrange a separation. The terms of the separation announced by the Tribunal in Saint-Petersburg forced Anatole to pay annual alimony of 200,000 French francs. Princess Mathilde Bonaparte in her Studio by Charles Giraud, 1865. By exhibiting her artwork, she positioned herself alongside professional artists, challenging traditional expectations for women, particularly those of her aristocratic background Rather than retiring to a quiet life of embroidery and regret, as a proper aristocratic woman might have done, Mathilde set up shop in Paris at 20 rue de Courcelles. Her home became the sort of salon where you might find Louis Pasteur discussing bacteria over canapés while tripping over one of her many dogs, or Gustave Flaubert defending his latest scandalous novel while sharing an armchair with a particularly entitled poodle. Speaking of dogs, Mathilde’s pets were legendary in Parisian society. If you were invited to her salon – and everyone who was anyone was – you had to accept that her dogs had better social standing than you did. They had free rein of the furniture, and guests were expected to simply work around them. One can only imagine the sight of elegantly dressed"
