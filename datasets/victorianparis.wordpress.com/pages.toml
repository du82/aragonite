title = "Life in the Age of Decay | Victorian Paris"
description = "Abandon all romantic thoughts about horses and think of horse manure. It was a growing problem as large cities grew even larger. Toward the end of the 19th century, horse digestion waste covered the city streets in thick layers. For the city council, it was a headache for which there was no soothing pill. Each day…"
full_description = '''Life in the Age of Decay May 21, 2019 by Iva P. Grand Prix Day by Frederick Childe Hassam Abandon all romantic thoughts about horses and think of horse manure. It was a growing problem as large cities grew even larger. Toward the end of the 19th century, horse digestion waste covered the city streets in thick layers. For the city council, it was a headache for which there was no soothing pill. Each day in Paris, 90,000 horses needed to be fed and their waste disposed of somehow. London and New York experienced an even worse calamity. It was generally thought that the first international conference on urban planning might bring a solution. The year was 1898 and the one-week symposium opened with great pomp in New York, the world’s most dynamically growing city. There were attendees from many capitals around the world. New York’s mayor led the opening speeches at City Hall and journalists competed in speculation about what would be the outcome of the high-level conference. Horse manure was the main subject. But the city planners meeting ended quietly after three days of failure. No solution was found. At the time of the conference, London boasted the first ever underground rail system, but eleven thousand horse-driven taxis still carried people above ground. Horse-drawn buses transported passengers. A standard car, with twenty seats and a pair of horses, worked sixteen hours a day. The animals were not allowed to work for more than four hours, so at least eight horses were needed for one car. In hot weather, fresh horses were needed more frequently. The transport of heavy goods was carried by a stream of freight wagons pulled by four to twelve horses. The London driving force consisted of about 190,000 horses, each producing up to 50 pounds of waste per day. Each day, London’s four-legged population produced about four and a half million pounds of dung. Add to it the hectolitres of horse urine and you cannot be surprised that the turn of the century was called the Age of Decay. A New York newspaper of the time complained that the whole city “is covered with brownish smoking carpet that stinks to high heaven”. On hot days, it was preferable to live behind closed doors and windows. Horses needed hay feed and straw for bedding. Delivery wagons, such as these, were a common sight in the cities. Nobody wanted manure. Farmers had enough of their own. The only people happy about the situation were real estate speculators who purchased cheap parcels of land and converted them into dung depots. There, the heaps of manure reached up to 15 meters which did not help the air quality in the cities. As if that were not enough, there were horse carcasses, each weighing about one thousand pounds. Unscrupulous owners abandoned horses where they died. Their bodies were a paradise for flies and various insects, as well as rats. In New York, about 15,000 carcasses were removed annually from the streets. Hygiene and cleanliness seemed unreachable goals as the conference ended on a gloomy note. The dire prognosis envisaged that, at the current growth rate, in 1930 large cities’ streets would be buried under three meters of manure. No one could imagine cities without horses. And so, burdened with thoughts of a bleak future, the participants left for home after three days. However, as we know, cities eventually did not drown in horse manure. Automobiles and electric tramways saved us in time. Related post: Crinolines and Impériales: Public Transport in Paris . If you enjoy reading these posts, support the author by purchasing her books on Amazon: Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in Belle Epoque, Third Republic, transport | Tagged 19th century, horse transport | 5 Comments 5 Responses on May 21, 2019 at 10:40 pm | Reply MsBurb Only to be drowned in CO2 emissions… maybe, eventually, man will get transportation right. I imagine I’ll witness the effluent-free outcome in my next life.😏 LikeLike on May 28, 2019 at 1:12 am | Reply Monday Links | National Review | Smartguns […] the worst problem large cities had to deal with was horse manure. Slightly related: When San Francisco’s Chinatown Was Quarantined for […] LikeLike on August 14, 2019 at 8:18 am | Reply jes nemo Perfectly sums up a point I was trying to make in conversation recently as to why I’m critical about some historical representations of that era. While I understand the need for creative liberties and to avoid distraction for the audience(as well as practicality) but it’s interesting how people will vehemently argue against this point when it really comes down to common sense. How I usually sum it up, as much as I idealistically believe I ought to have been born 150 years ago(at least) I don’t think I would have managed the smell. Granted, if I was born 150 years ago I wouldn’t have the awareness of current standards, I suppose. As an aside, whenever this blog comes up in a point I’m researching at the time I never fail falling in several hours long hole, at this point rereading posts, but just an enamored as I was my first perusal. LikeLike on August 14, 2019 at 8:15 pm | Reply Iva P. While I’m flattered that you spend your time here, why don’t you consider buying the book where the information organized around different topics? LikeLike on July 7, 2020 at 12:30 pm | Reply The Dangerous Pleasures of Research | A Writer of History […] Life in the Age of Decay – Abandon all romantic thoughts about horse transport! […] LikeLike Comments RSS Was this post useful to you? Share your thoughts here. Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); English Español Français Deutsch Português Bahasa Indonesia Other languages.widget.widget_medi