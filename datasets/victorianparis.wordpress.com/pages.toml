ert in a dangerous liaison. Court intrigue, conspiracy, and betrayal are in abundance in this comedy/drama. (A Screenplay) .widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Email Subscription Enter your email address to subscribe to this blog and receive notifications of new posts by email. Email Address: Sign me up! Pages About Interview with Iva Polansky Mi-Carême: An Explosion of Joy in the Midst of Gloom New Release! Blogroll A Londoner's Diary American Girls Art Club In Paris. . . and Beyond Edwardian Promenade Historical Fiction eBooks Historical Tapestry History and Women Histoy Hack I Prefer Paris Les Musées de Paris London Historian's Blog My Daguerreotype Boyfriend Paris en Images Property Historian Scandalous Women The Quack Doctor The Secret Victorianist The Victorianist The Virtual Victorian Two Nerdy History Girls Unusual Historicals Victorian Era Victorian London Victorian London Dictionary Archives Archives Select Month February '''
