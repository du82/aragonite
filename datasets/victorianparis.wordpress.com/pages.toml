["https://victorianparis.wordpress.com/2016/05/13/slumming-it-in-paris"]
title = "Slumming It in Paris | Victorian Paris"
description = "Tourist traps were not invented yesterday. Parisians got the hang of it very early. One of the tourist attractions in the past was a glimpse of the redoubtable Apaches, the vicious gangs that terrorized Paris. (More about them in The Gangs of Paris.) Like other tourists, the American author and humorist Irvin S. Cobb followed this…"
full_description = '''Slumming It in Paris May 13, 2016 by Iva P. Encounter of the Apaches with the police on the Place de la Bastille Tourist traps were not invented yesterday. Parisians got the hang of it very early. One of the tourist attractions in the past was a glimpse of the redoubtable Apaches, the vicious gangs that terrorized Paris. (More about them in The Gangs of Paris.) Like other tourists, the American author and humorist Irvin S. Cobb followed this fashion of playing with the fire. We first came in contact with his caustic humor in Jacques Takes a Bath where he questions the local hygiene. In the following text, Cobb explores the Paris underground hoping for an adrenaline high in mingling with the Apaches: Knowing from experience that every other American who lands in Paris will crave to observe the Apache while the Apache is in the act of Apaching round, the canny Parisians have provided a line of up-to-date Apache dens within easy walking distance of Montmartre; and hither the guides lead the round-eyed tourist and there introduce him to well-drilled, carefully made-up Apaches and Apachesses engaged in their customary sports and pastimes for as long as he is willing to pay out money for the privilege. Being forewarned of this I naturally desired to see the genuine article. I took steps to achieve that end. Suitably chaperoned by a trio of transplanted Americans who knew a good bit about the Paris underworld I rode over miles of bumpy cobblestones until, about four o’clock in the morning, our taxicab turned into a dim back street opening off one of the big public markets and drew up in front of a grimy establishment rejoicing in the happy and well-chosen name of the Cave of the Innocents. Alighting we passed through a small boozing ken, where a frowzy woman presided over a bar, serving drinks to smocked marketmen, and at the rear descended a steep flight of stone steps. At the foot of the stairs we came on two gendarmes who sat side by side on a wooden bench, having apparently nothing else to do except to caress their goatees and finger their swords. Whether the gendarmes were stationed here to keep the Apaches from preying on the marketmen or the marketmen preying on the Apaches I know not; but having subsequently purchased some fresh fruit in that selfsame market I should say now that if anybody about the premises needed police protection it was the Apaches. My money would be on the marketmen every time. Beyond the couchant gendarmes we traversed a low, winding passage cut out of stone and so came at length to what seemingly had originally been a wine vault, hollowed out far down beneath the foundations of the building. The ceiling was so low that a tall man must stoop to avoid knocking his head off. The place was full of smells that crawled in a couple of hundred years before and had died without the benefit of clergy, and had remained there ever since. For its chief item of furniture the cavern had a wicked old piano, with its lid missing, so that its yellowed teeth showed in a perpetual snarl. I judged some of its important vital organs were missing too – after I heard it played. On the walls were inscribed such words as naughty little boys write on schoolhouse fences in this country, and more examples of this pleasing brand of literature were carved on the white oak benches and the rickety wooden stools. So much for the physical furbishing. By rights—by all the hallowed rules and precedents of the American vaudeville stage!—the denizens of this cozy retreat in the bowels of the earth should have been wearing high-waisted baggy velvet trousers and drinking absinthe out of large flagons, and stabbing one another between the shoulder blades, and ever and anon, in the mystic mazes of dance, playing crack-the-whip with the necks and heels of their adoring lady friends; but such was not found to be the case. In all these essential and traditional regards the assembled Innocents were as poignantly disappointing as the costers of London had proved themselves. According to all the printed information on the subject the London coster wears clothes covered up with pearl buttons and spends his time swapping ready repartee with his Donah or his Dinah. The costers I saw were barren of pearl buttons and silent of speech; and almost invariably they had left their Donahs at home. Similarly, these gentlemen habitués of the Cave of the Innocents wore few or no velvet pants, and guzzled none of the absinthe. Their favorite tipple appeared to be beer; and their female companions snuggled closely beside them. We stayed among them fully twenty minutes, but not a single person was stabbed while we were there. It must have been an off-night for stabbings. Still I judged them to have been genuine exhibits because here, for the first, last and only time in Paris, I found a shop where a stranger ready to spend a little money was not welcomed with vociferous enthusiasm. The paired-off cave-dwellers merely scowled on us as we scourged past them to a vacant bench in a far corner. […] For the sake of the conventions I tried to feel apprehensive of grave peril. It was no use. I felt safe – not exactly comfortable, but perfectly safe. I could not even muster up a spasm of the spine when a member of our party leaned over and whispered in my ear that any one of these gentry roundabout us would cheerfully cut a man’s throat for twenty-five cents. I was surprised though at the moderation of the cost; this was the only cheap thing I had struck in Paris. It was cheaper even than the same job is supposed to be in the district round Chatham Square, on the East Side of New York, where the credulous stranger so frequently is told that he can have a plain murder done for five dollars – or a fancy murder with trimmings, for ten; rate card covering other jobs on application. In America, however, it has been my misfortune that I did not have the right amount handy; and here in Paris I was handicapped by my inability to make change correctly. By now I would not have trusted anyone in Paris to make change for me – not even an Apache. I was sorry for this, for at a quarter a head I should have been glad to engage a troupe of Apaches to kill me about two dollars’ worth of cabdrivers and waiters. For one of the waiters at our hotel I would have been willing to pay as much as fifty cents, provided they killed him very slowly. Because of the reasons named, however, I had to come away without making any deal, and I have always regretted it. Related posts: Jacques Takes a Bath The Gangs of Paris: Les Apaches . If you enjoy these posts, support the author by buying her books on Amazon: Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in Americans in Paris, crime and justice, people of Paris, sights | Tagged 19th century France, 19th century Paris, absinthe, gangs in Paris, Paris Apaches, paris markets, parisians | 2 Comments 2 Responses on May 17, 2016 at 1:40 pm | Reply Slumming It in Paris | Victorian Paris | First Night History […] Source: Slumming It in Paris | Victorian Paris […] LikeLike on September 1, 2023 at 11:36 am | Reply Illustrated Weeklies: Windows into a Bygone Era | Victorian Paris […] Slumming It in Paris […] LikeLike Comments RSS Was this post useful to you? Share your thoughts here. Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); English Español Français Deutsch Português Bahasa Indonesia Other languages.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }E-book (434 pages) Recent Posts Love, Law, and Liberté: The Drama of Divorce in 19th Century France Tuberculosis: When Dying Became Fashionable Princess Mathilde Bon