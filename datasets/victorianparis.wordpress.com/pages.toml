an’s long-lost friends, Athos, Porthos, and Aramis. A comedy based on Alexandre Dumas’s classic novel The Three Musketeers. A comedy/screenplay Paperback, 140 pages Rags to Riches in Paris.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Fame and Infamy / Adventures of an American Maid in Paris Otto von Bismarck, German secret police, celebrated French artists and Miss Nelly McKay of Butte, Montana, come together in this lively mystery set in 1870’s Paris. Print or ebook, 410 pages He was right. She was right. Together they were wrong.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }THE WAR OF THE TOLSTOYS Leo Tolstoy’s last days: In 1910, newspapers around the world reported the tribulations of Russia’s most famous writer. The War of the Tolstoys tells it all. Screenplay, 110 pages Passion and Wit and Ménage à Trois ( a true story).widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Our Divine Emilie Two of the brightest minds of the French Enlightenment, Voltaire and Emilie du Châtelet, meet the poet Saint-Lambert in a dangerous liaison. Court intrigue, conspiracy, and betrayal are in abundance in this comedy/drama. (A Screenplay) .widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Email Subscription Enter your email address to subscribe to this blog and receive notifications of new posts by email. Email Address: Sign me up! Pages About Interview with Iva Polansky Mi-Carême: An Explosion of Joy in the Midst of Gloom New Release! Blogroll A Londoner's Diary American Girls Art Club In Paris. . . and Beyond Edwardian Promenade Historical Fiction eBooks Historical Tapestry History and Women Histoy Hack I Prefer Paris Les Musées de Paris London Historian's Blog My Daguerreotype Boyfriend Paris en Images Property Historian Scan