description = "Among the biggest headaches for the municipal authorities of Paris in the second half of the 19th century was the appearance of brasseries à femmes. Until then, drink and sex were generally served separately. A man, looking for a drink, would come to a café and, should he feel the need for female company, he’d…"
full_description = '''Drink and Prostitution: The Belle Epoque Hooters September 13, 2012 by Iva P. “Come and See Pretty Kittens” – Street advertisement for a brasserie Among the biggest headaches for the municipal authorities of Paris in the second half of the 19th century was the appearance of brasseries à femmes. Until then, drink and sex were generally served separately. A man, looking for a drink, would come to a café and, should he feel the need for female company, he’d make his choice (and an abundant choice it was!) among the streetwalkers, or he’d visit a brothel. In accordance with the law, the staff of the maisons de tolérance were kept under weekly medical supervision and therefore more or less free of venereal disease. However, a brothel license was difficult to obtain. Should any complaints arise, the business would be mercilessly closed by the authorities. This was not the case with public alcohol venues. Traditionally, these employed male waiters, but in the 1860s a few establishments appeared where drink was served by pretty women in seductive garb whose duty was to encourage alcohol consumption by being friendly with patrons. This novel way of serving drinks expanded rapidly not only in Paris but in all large cities across France. By the end of the century, in Paris alone, the brasseries employed between 1,500 and 2,000 waitresses. Although brasserie interiors might appear above reproach, most of them contained rooms for private encounters. With the growth of brasseries à femmes, venereal disease statistics shot up simultaneously. Unlike registered prostitutes, waitresses were not subjected to medical control. As there was no shame attached to entering such an establishment, many patrons, who would hesitate to be seen in a brothel, became victims of both drink and disease. Young men were the most at risk. Students and apprentices saw their future dissolve in drink excess to the chagrin of their parents and teachers. Patrons became attached to the girls. When a successful waitress crossed the river to “remake herself a virginity” on the opposite bank, some of her clients followed her like faithful dogs. Serving in a brasserie was no sinecure. Twelve hours a day in the noisy and smoky atmosphere, where the women were required not only to serve but to sit at the tables and match the patrons drink for a drink, took a heavy toll on their health. Very few lasted more than ten years. The following is a questionnaire filled by an applicant from Marseille seeking a job in Paris: An early brasserie poster, circa 1875 Have you already served in brasseries? Yes, in Lyon and here. Are you young? I’m 24. Pleasant? Like a jewel. Pretty? See my photograph. Flirtatious? With art. I offer, I attract, and I hold. Do you have a good stomach? I have a robust constitution and if I don’t have sobriety, the virtue of a camel, by contrast I possess the stomach of an ostrich used to all kinds of drinks, even adulterated ones. I have, like many of my co-workers, begun to practice fraud and today I can drink without getting drunk. You will hear my voice, you will see my chic and you will appreciate my talent for manipulation. She, no doubt, got the job. Why were these women so keen to apply for a job that damaged their health and morals? The answer, of course, is money. Leaving aside morals, a smart brasserie waitress earned in a day the weekly wages of a factory worker. After many protests, a law put an end to the brasseries à femmes. Except for the owner’s family members, no other female employees were allowed to serve in these establishments. It was also forbidden for a waitress to drink with patrons. Related post: Syphilis: The Scourge of the Victorian Era Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related 