["https://victorianparis.wordpress.com/2020/06/01/could-you-be-a-salonniere"]
title = "Could You Be a Salonnière? | Victorian Paris"
description = "Could you, yourself, become a salonnière? Who knows? Maybe you already have every asset to revive this ancient tradition. Let’s see what it takes:"
full_description = '''Could You Be a Salonnière? June 1, 2020 by Iva P. Giuseppe de Nittis: The Salon of Princess Mathilde, 1883 One of the most significant cultural differences between the Brits and the French was their attitude toward women. The British gentleman suffered women when he could not avoid them and avoided them when he could by seeking refuge in men-only clubs. The Frenchman, on the contrary, did not feel bright unless women were around. He sought them out during his leisure time, and he was keen to converse in their company. Frenchmen were never afraid of clever women, and they allowed them to rule as salonnières. An 18th-century literary salon. The tradition of the Parisian Salon was an old one. It began in the seventeenth century and was largely abandoned during WW1. Salonnières, who hosted these gatherings at home, held power. Political plots were hatched, literary trends were started, scientific discoveries were publicized, and artistic talents were launched under their influence. Could you, yourself, become a salonnière? Who knows? Maybe you already have everything you need to revive this ancient tradition. Let’s see what it takes: You must be a woman. Salons were always run by women. It did not matter whether they were respectable. A courtesan could compete with a princess for the same guests. You must be wealthy. Your home should provide an environment that is conducive to the sophisticated exchange of ideas. A well-run Salon might provide a Wednesday dinner for some thirty seated guests and a Saturday reception for about one hundred. Quality wine was a must. Good food was expected as well. You must have a compliant husband or no husband at all. Very rarely, a husband co-hosts events. The ideal husband would be content with a visit to his mistress and allow his wife to rule the crowd. You must feature a great man. Salons were built around a great man who served as a magnet to attract other desirables. He could be a philosopher, a politician, a music composer, or a famous author. Often, the great man was the salonnière’s lover and her goal was to make him even greater. You must be attentive to new trends and courageous enough to start one. Depending on the type of your salon, you must know what transpires on in politics, culture, or science. You must read the latest novel, meet the latest polar explorer, or recognize the right time to introduce fresh talent. Being courageous enough to start new trends can help your salon stand out and create a competitive edge. You must be a social expert. It is important to be well-informed about your guests and careful not to invite bitter enemies. Knowing the latest gossip is always helpful and having your spies in competing salons is a clever way to stay on top of things. You must be a woman of authority. Your salon, your rules. If the conversation does not go the right way, you stop it politely, but without appeal. It is your choice whether you allow an uncontrolled flow or, on the contrary, whether you choose a subject of conversation and insist that the guests stick within the limits. You must be ready to make it a full-time job. Seeing new trends coming, finding the right guests, sending out invitations, supervising the staff, choosing wines and menus, listening to all relevant gossip, and all the plotting and scheming that goes into it, will take your entire waking time. Related posts: How to Succeed in Paris The Goncourts: Gossip Inc. BOOKS BY THIS AUTHOR: Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in arts and literature, lifestyle, local customs | Tagged history of Paris, salonnières | 9 Comments 9 Responses on June 5, 2020 at 8:00 pm | Reply Could You Be a Salonnière? ~ Iva Polansky | Sue Vincent's Daily Echo […] Continu