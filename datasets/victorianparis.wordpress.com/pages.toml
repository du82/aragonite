title = "Haussmann: The Man Who Transformed Paris | Victorian Paris"
description = 'In 1845, the French social reformer Victor Considerant wrote: "Paris is an immense workshop of putrefaction, where misery, pestilence and sickness work in concert, where sunlight and air rarely penetrate. Paris is a terrible place where plants shrivel and perish, and where, of seven small infants, four die during the course of the year." Indeed, urban reform…'
full_description = '''Haussmann: The Man Who Transformed Paris April 1, 2020 by Iva P. Georges-Eugène Haussmann (1809-1891) In 1845, the French social reformer Victor Considerant wrote: “Paris is an immense workshop of putrefaction, where misery, pestilence and sickness work in concert, where sunlight and air rarely penetrate. Paris is a terrible place where plants shrivel and perish, and where, of seven small infants, four die during the course of the year.” Paris before Haussman Indeed, urban reform was long overdue in Paris. Neglected by the kings, who preferred Versailles, the city was overcrowded and dirty. In the narrow crooked streets, diseases spread quickly as did social unrest. Napoleon I made a few attempts at beautifying and sanitizing the capital but, being too busy with disseminating misery across the European continent, he never really got down to it on a large scale. After the Waterloo defeat, plans for a better capital were shelved and it took his nephew, Napoleon III, to begin the greatest urban project ever achieved. Napoleon III might not have been the greatest warrior–the French still prefer his (in)glorious uncle–but he was a mover and shaker of the practical sort. Paris still benefits from his industry while Napoleon I’s conquests are long gone. Having spent part of his exile in London (see The English Courtesan who Made a French Emperor published here) he brought to France the idea of English urbanism. He found a man with a similar vision and with boundless energy in Haussmann, the Prefect of the Seine. Together, in seventeen years, they made Paris what it is today. Piercing a new boulevard during the Haussmannian transformation Announcing his motto Paris embellished, Paris enlarged, Paris cleaned up, Haussmann didn’t take prisoners in his war against the old. All that was ugly, dirty and disease-ridden became history. He pierced wide avenues and established rules for standardized buildings. He created a square in each district and envisioned dozens of parks, gardens, and woods. He built new churches, bridges, theaters, and railway stations. He enlarged the city from 12 to 20 arrondissements. Underground, Paris got a sophisticated water and sewage system that – to this day – is one of the tourist’s sights of the city. Paris after Haussmann (Place de l’Etoile) The titanic work has always been controversial in view of the methods used to achieve this incredible result. To modify Paris in this way, Haussmann did not hesitate to destroy nearly 18,000 houses that hampered his vision of straight and wide boulevards. He excluded the working classes for whom the new dwellings were unaffordable. Haussmann was finally deposed in 1870, a few months before the fall of Napoleon III and the Second Empire. Notre Dame in 1852 Notre Dame after Haussmann’s intervention Thanks to Napoleon III’s vision and Haussmann’s ruthlessness, Paris is the city we know today. Such a colossal project cannot be achieved without a totalitarian approach and would be impossible to realize in a democracy with its many rules and laws. The Avenue de l’Opéra, one of the new boulevards created by Napoleon III and Haussmann. The new buildings on the boulevards were required to be all of the same height and same basic façade design, and all faced with pale-ochre stone, giving the city a unified look. Related posts: The English Courtesan Who Made a French Emperor The Eiffel Tower Story In the Gallery of Achievers: The Inescapable Sarah Bernhardt If you enjoy reading these posts, support the author by purchasing her books on Amazon: Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in architecture and urbanism, personalities, Second Empire | Tagged 19th century Paris, Baron Haussmann, Napoleon III | Leave a Comment