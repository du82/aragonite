title = "Fashion: How to Look Like a Victorian Gentleman | Victorian Paris"
description = ". The above picture shows fashionable men in the Victorian era. Below are fashionable men walking the street today. The second picture appeared with words of approval in a men's fashion magazine so we know without a doubt that this is what fashion dictates in the 2020s. If you still think those outfits were thrown…"
full_description = '''Fashion: How to Look Like a Victorian Gentleman February 1, 2022 by Iva P. . The above picture shows fashionable men in the Victorian era. Below are fashionable men walking the street today. The second picture appeared with words of approval in a men’s fashion magazine so we know without a doubt that this is what fashion dictates in the 2020s. If you still think those outfits were thrown on in a hurry, you may be wrong. With all probability, great care was taken to choose the right purses. . . So what is the difference between the two pictures? Something is missing in the second one, and the answer is elegance. One can be fashionable but to be elegant, one needs to make an effort. Today’s fashion asks for little or no apparent effort. In fact, if effort is needed, it is to achieve effortlessness. We don’t just dress in jeans. We dress in ripped jeans. . YouTube videos dedicated to ripped jeans show the latest creative tips to achieve a truly personalized look of utter misery . When truly miserable people walked the streets, the attitude toward personal appearance was different. No one wanted to look like a loser and be treated as such. Success started with a good wardrobe. So what did elegant Victorian men wear? Let’s look at the items that composed the image of a gentleman. . A tailored three-piece suit. As the century progressed, colors of jackets and pants dimmed. The vest became the only fancy part of the outfit. It was made of rich brocade or patterned silk. Toward the end of the century, even the vest’s appeareance got gradually tamed until it merged into the suit as all three pieces were made of the same fabric. . A top hat. Although other shapes went in and out of fashion, the pipe hat remained the steady item in a gentleman’s wardrobe well into the next century. It made men look taller and more important. You can still see top hats today at the Queen’s Garden Party or other stylish functions. Top hats can be made collapsible for better transportation. A pipe hat was essential to man’s dignity. Photo circa 1850 . Other essential accessories: A silk tie. Fancy or conservative, it was an expresion of the man’s personality. A watch secured to the vest pocket with a heavy gold or silver chain advertised the man’s prosperity. A pair of gloves. No gentleman would be seen without. A walking stick. A whole industry went extinct when walking sticks went out of fashion. Yet they were useful accessories as they also served as defensive weapons. Some contained a hidden blade. Should the guys from the 2020s photos be wearing a similar outfit, wouldn’t it elevate their dignity a few notches? What do you think? Leave a comment below. Related articles: The Huge Women of the 1850s and 60s Sports Events and Men’s Fashion . Rate this:Share this:Click to share on Twitter (Opens in new window)Click to share on Reddit (Opens in new window)Click to print (Opens in new window)MoreClick to share on LinkedIn (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in fashion | Tagged 19th century men's fashion, victorian fashion | 9 Comments 9 Responses on February 1, 2022 at 8:12 am | Reply adrienne I don’t like the ripped jeans look either, but there is also something faintly ridiculous about the very tall top hats. An interesting post as always. LikeLiked by 1 person on February 1, 2022 at 9:58 pm | Reply Iva P. Well, size did matter, to some. 🙂 LikeLike on February 2, 2022 at 7:50 am | Reply bakerbalham Iva, Another ‘good look’ at the good looking gentlemen. Although ripped jeans are not my thing, at least they are colourful. The Victorians appeared to lack colour and so it made for a dull – if elegant – appearance. Was this dictated by a lack of reliable dyes? Fashions dictate change. So colours came. The comparison with military uniforms might be interesting. In Victorian times uniforms were colourful, reds, and blues, etc. designed as much to help soldiers decide on the field of battle if a person was friend or foe. Today it’s all camouflage. LikeLike on February 2, 2022 at 7:52 pm | Reply Iva P. Hi Bakerbalham! Nice to meet you. The first picture may be misleading and I will think of changing it. It is, indeed, very sober. The last picture, although black and white, represents best the Victorian man, and his outfit is colorful enough. As for the jeans, ripped or not, they are all nearly the same color so they are a uniform of sorts. Around 1850, aniline colors were invented and Victorian women wore never seen before extremely bright colors such as magenta. LikeLike on February 5, 2022 at 1:44 pm | Reply Lee McAulay There’s an element of tribalism at play in all these pictures, which I find interesting. I’m fascinated by dress codes I don’t understand, like the trend amongst urban young men for the very latest in trainers and tracksuits that obviously signal some sort of distinction between groups, but look identical to the rest of us. Heavy metal fans also look similar to the untrained eye, but once you know which parts are distinctive and which are generic it’s quite illuminating. Another example: Tory MP Jacob Rees-Mogg wearing a face mask in the colours of his old school, which matters to some who know that’s the distinction he’s making, but to the rest of us looks like nothing more than a navy mask with thin white stripes. Isn’t there a theory that in Victorian times – especially for visiting cards – you had a photo taken with props that made you look prosperous, although you didn’t own any of them? LikeLiked by 1 person on February 5, 2022 at 7:24 pm | Reply Iva P. Thank you for your interesting comment, Lee. I did not know about the prosperous accessories, but knowing human nature, it is more than probable. LikeLike on August 23, 2022 at 12:24 pm | Reply Mthobisi Magagula Nice post Iva. Very detailed styles and outfits for the gentlemen. I believe that even in this modern age a style like this is relevant for dressing up because its classy and class is eternal🙌 LikeLiked by 1 person on August 23, 2022 at 6:47 pm | Reply Iva P. Thanks, Mthobisi. Don’t miss the next post called The Victorian Gentleman Undressed. LikeLiked by 1 person on August 24, 2022 at 8:51 am Mthobisi Magagula Alright. I will definitely check it out🙏 LikeLike Comments RSS Was this post useful to you? Share your thoughts here. Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); English Español Français Deutsch Português Bahasa Indonesia Other languages.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }E-book (434 pages) Recent Posts Love, Law, and Liberté: The Drama of Divorce in 19th Century France Tuberculosis: When Dying Became Fashionable Princess Mathilde Bonaparte: A Tale of Dogs and Breaking All Norms Brief Guide to 19th-century Paris Literary Landscape From Diligence to High-Speed Trains: Paris to Lille Then and Now Categories Americans in Paris (19) anarchists (2) anecdotes (8) architecture and urbanism (10) arts and literature (19) Belle Epoque (16) books about Paris (2) business (2) Commune (9) crime and justice (14) death (6) demi-monde (6) duels (2) economy (1) entertainment (14) family (6) fashion (22) food and drink (23) french history (2) Guide to Gay Paree 1869 (8) haute couture (1) health (8) history (5) hypnosis (1) important events (8) law (4) lifestyle (7) local customs (35) lodgings (7) manners (14) map (1) markets (8) marriage (5) monuments (4) morality (12) Napoleon III (18) night life (3) paris (2) Paris history (10) people of Paris (34) personalities (15) photography (3) prices (11) prostitution (16) public work and services (5) public works and services (11) Queen Victoria (4) science (3) Second Empire (18) Second Republic (2) shopping (9) sights (8) social life (9) sports (1) Third Republic (17) transport (6) uncategorized (31) workers and servants (11) Delicious, devious, and