title = "General Chuck Yeager Aviation Day – The Chuck Yeager Foundation"
full_description = '''Chuck Yeager Aviation Day International celebration Chuck Yeager Aviation Day is an annual event dedicated to commemorating the life and legacy of Chuck Yeager, the legendary pilot who made history as the first person to break the sound barrier. This day serves as a platform to honor Yeager's extraordinary achievements and inspire youth to explore the world of aviation. Through engaging activities, educational workshops, and inspiring speeches, Chuck Yeager Aviation Day aims to instill a passion for flight and innovation among young people, fostering a new generation of dreamers and trailblazers in aerospace. Saturday, September 28, 2024 • 8am-3pm Open to the public. All welcome to attend! Details Pancake Breakfast, 8-10am Free Young Eagles flights Open cockpit airplane & helicopter display Firetruck & vintage autos display STEM/Aviation activities Drone demos / introductory lesson Flight simulator RC planes Face painting & games Aviation careers education Food and vendors available Speakers include: Brig Gen ANG Chris "Mookie" Walker, Mrs. Chuck Yeager, and maybe more. Sign up for these free opportunities Women in Aviation 1st General Chuck Yeager Chapter First 50 girls to sign up and participate get free book bag, patch, & more. Girls under age 8 may attend, but not signup. GIAD Signups GIAD SIGN UPS Saturday, September 28, 2024 • 8am-3pm GIAD Name of Parent / Legal Guardian * Name of Parent / Legal Guardian First First Last Last Address * Address Address Address City City State/Province AlabamaAlaskaArkansasArizonaCaliforniaColoradoConnecticutDelawareDistrict of ColumbiaFloridaGeorgiaHawaiiIdahoIllinoisIndianaIowaKansasKentuckyLouisianaMaineMarylandMassachusettsMichiganMinnesotaMississippiMissouriMontanaNebraskaNevadaNew HampshireNew JerseyNew MexicoNew YorkNorth CarolinaNorth DakotaOhioOklahomaOregonPennsylvaniaRhode IslandSouth CarolinaSouth DakotaTennesseeTexasUtahVermontVirginiaWashingtonWest VirginiaWisconsinWyoming State/Province Zip/Postal Zip/Postal Email * Phone Name of Child/Teen * Name of Child/Teen First First Last Last Age Group * 15-1811-148-10 Please specify ethnicity * White or CaucasianBlack or African AmericanAsian or Asian AmericanAmerican Indian or Alaska NativeNative Hawaiian or other Pacific IslanderTwo or more ethnicitiesOther/unknown ethnicityPrefer not to say Is this your first GIAD event? * Yes No Submit If you are human, leave this field blank. Sign up for Young Eagles flights separately EAA Chapter 1336 General Chuck Yeager Chapter Flight Signups Nominate an Unsung Hero The ‘Unsung Hero’ program is designed to highlight someone from the Jackson County, WV and surrounding area who has given of themselves to better our community. Submit Nominee Unsung Hero Program The ‘Unsung Hero’ program is designed to highlight someone from the Jackson County, WV and surrounding area who has given of themselves to better our community. Unsung Heroes might include an average citizen who saved a life; a renowned teacher; a community humanitarian; a local firefighter, paramedic, police officer, a retired military member or someone who mentors children or volunteers as a coach or tutor in a youth program. Guidelines for Nominees: Must be at least 21 years old and live in either Jackson County WV, Meigs County OH, Mason County WV. In good physical condition An ‘Unsung Hero’ that has shown courage and leadership in the community People ineligible for the program include but are not limited to, active-duty military members, elected and appointed officials, unit honorary commanders, newscasters, reporters, board of directors or other individuals who have the ability to garner publicity in their own right. Limit one (1) nomination entry per nominee Grand Prize includes: A Hero's airplane ride with a professionally licensed pilot/instructor VIP Lunch 101 Chuck YEAGER-isms: Wit & Wisdom from America’s Hero by New York Times #1 bestselling author Chuck Yeager & his favorite wingman, Victoria: signed by Victoria Yeager VIP Parking Pass Second Prize includes: 101 Chuck YEAGER-isms: Wit & Wisdom from America’s Hero by New York Times #1 bestselling author Chuck Yeager & his favorite wingman, Victoria: signed by Victoria Yeager VIP lunch 1 VIP Parking Pass Dates of Contest: Begins August 15, 2024 at 12:00pm PT and ends September 21, 2024 at 12:00pm PT Winner will be announced September 23, 2024 Link to Nomination Form We're Looking for Volunteers Volunteer Signups Volunteer Signups Volunteer Signups Name * Name First First Last Last Email * Phone Address * Address Address Address City City State/Province AlabamaAlaskaArkansasArizonaCaliforniaColoradoConnecticutDelawareDistrict of ColumbiaFloridaGeorgiaHawaiiIdahoIllinoisIndianaIowaKansasKentuckyLouisianaMaineMarylandMassachusettsMichiganMinnesotaMississippiMissouriMontanaNebraskaNevadaNew HampshireNew JerseyNew MexicoNew YorkNorth CarolinaNorth DakotaOhioOklahomaOregonPennsylvaniaRhode IslandSouth CarolinaSouth DakotaTennesseeTexasUtahVermontVirginiaWashingtonWest VirginiaWisconsinWyoming State/Province Zip/Postal Zip/Postal Submit If you are human, leave this field blank. Location Jackson County Airport-I18 912 Airport Rd Millwood, WV 25262 Millwood, WV is an hour's drive north of Charleston, WV and an hour approximately east of Huntington, WV, just over the state line from Ohio. Event Sponsors ConocoPhillips General Chuck Yeager Legacy Foundation Jackson County Airport Women in Aviation 1st General Chuck Yeager Chapter EAA's Chapter 1336, General Chuck Yeager Chapter West Virginia Air Force & Space Association General Chuck Yeager Chapter A Note from Victoria I hope you'll participate! It's easy and fun! Wherever you are, go fly, do something aviation related such as visit an airport, airport cafe, aviation museum, fly a kite, or simply look up to the skies and honor General Chuck Yeager. Then please post photos of your personal tribute/flight on social media with hashtag #YeagerFest. Please spread the word. Next year, we may have prizes for the best photos or certificates or get aviation museums and airports to have special events around the world or free entrance or.... I'm told the aviation community needs to get more kids involved or we'll have a pilot shortage in 10-15 years. So maybe we have an international Young Eagles event on that day, too - take kids flying. Any and all ideas are welcome! Victoria Yeager'''
