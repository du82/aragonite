["https://victoriayeager.com"]
title = "The Chuck Yeager Foundation – The Official Website of General Chuck Yeager"
description = "Despite a youth in the poverty-stricken backwoods of West Virginia, Yeager became a fighter ace, a legendary test pilot, a leader of men, and an icon for generations, all while doing what he loved: flying."
full_description = '''Honoring the Life and Legacy of Brigadier General Chuck Yeager General Chuck Yeager is one of the greatest aviators that ever lived. His commitment to service, duty, love of his country, his flag are evident in all that he did during active duty and beyond. He was and continues to be a great inspiration and role model. “The fastest man alive,” “the guy with the right stuff,” “Mr. Supersonic,” Charles E. “Chuck” Yeager has been called a lot of things in his 80 years, but none is more fitting than the title, “a true American.” History Despite a youth in the poverty-stricken backwoods of West Virginia, Yeager became a fighter ace, a legendary test pilot, a leader of men, and an icon for generations, all while doing what he loved: flying. More Legacy “The fastest man alive,” “the guy with the right stuff,” “Mr. Supersonic,” Charles E. “Chuck” Yeager has been called a lot of things in his 80 years, but none is more fitting than the title, “a true American.” More Today General Chuck Yeager's commitment to service, duty, love of his country, his flag are evident in all that he did during active duty and beyond. He was and continues to be a great inspiration and role model. More General Chuck Yeager is one of the greatest aviators that ever lived. For millions of people around the world, General Chuck Yeager is the man who best epitomizes the unique blend of qualities that writer Tom Wolfe captured in the title of his 1979 best seller, The Right Stuff. For Wolfe, Yeager stood at the apex of “the ziggurat pyramid of flying" and was “the most righteous of all the possessors of the right stuff.” His is an American story, one that inspires us and teaches us to always look to the skies. Video Archive MOMENTS IN HISTORY watch Photo Gallery ICONS OF AVIATION view Meet Victoria Yeager pilot, author, businesswoman Exciting, inspiring, sometimes humorous stories about Chuck Yeager’s life and death adventures and a few of Victoria’s own Read Bio Book Victoria'''
