["https://victoriayeager.com/victoria-yeager"]
title = "Victoria Yeager – The Chuck Yeager Foundation"
full_description = "Victoria Yeager Flying with Chuck Exciting, inspiring, sometimes humorous stories about Chuck Yeager’s life and death adventures and a few of Victoria’s own Book Victoria Victoria Yeager grew up in Philadelphia, attended Shipley School in Bryn Mawr, PA., then the University of Virginia, with a year in Paris at the Sorbonne, Sorbonne-Nouvelle, and the Institute of Political Science, ultimately graduating from Columbia University with an MBA. From a very young age, she has done volunteer work around the world as well as adventure travel from sailing in Nova Scotia to studying monkeys in Nepal to climbing Mt Kilimanjaro, to attending various U.N. and other international meetings with her mother, including Kenya, South Africa, Denmark, Australia, and Yugoslavia. Her mother, a University of Pennsylvania graduate and psychiatric social worker, consulted around the world on preventing alcoholism and drug abuse and got First Lady Betty Ford to go public with her alcoholism and drug addictions, thus bringing the issue out into the open. Victoria’s travel is eclectic: living with tribes in Africa for short stints to boogie boarding the Zambezi, to getting a human trafficker (who had tried to break her shoulder and had put a gun to her head) put in prison in Southeast Asia, to visiting the Louvre; to afternoon tea at the Ritz or the Savoy in London, to dining with princes, dukes, earls, billionaires (when there weren’t so many), artists, actors and writers. With an MBA from Columbia University, her career has been varied: investment banking, financial/marketing and valuation consulting, acting, writing, producing and directing. She acted in Witness, Blades: Just When You Thought It Was Safe to Putt and other movies, starting at age three on Uncle Pete’s, a kiddie T.V. show in 1961 hosted by character actor Peter Boyle's father. General Chuck Yeager, her late great husband, together for almost 21 years, taught her how to fly, hunt, and fish. With General Yeager, she culled animals in Namibia and South Africa; visited troops in Afghanistan, Kuwait, and Qatar, attended bull races with Prince Malik in Pakistan, fished and climbed mountains in Chile, flew in Australia, fished and explored in Alaska, and more. She is a pilot, author, businesswoman. She continues to do volunteer work, enjoy adventure traveling, flying, playing pickleball, sailing, bodysurfing, horseback riding, and more. Victoria has published two books 101 Chuck YEAGER-isms – Wit & Wisdom from America’s Hero by bestselling author, General Chuck Yeager and his favorite wingman, Victoria CHUCK YEAGER: WHAT A RIDE! – Her Amazing Life with The Original Right Stuff, Chuck Yeager by Victoria Yeager, Chuck Yeager’s favorite co-pilot"
