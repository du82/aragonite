from active life. While he has long been an Air Force icon, the 1979 publication of Tom Wolfe’s best-seller, The Right Stuff, vaulted Yeager into international celebrity... 1975-2021: Living It Up READ MORE Retirement from active duty means anything but retirement from active life. While he has long been an Air Force icon, the 1979 publication of Tom Wolfe’s best-seller, The Right Stuff, vaulted Yeager into international celebrity..."
