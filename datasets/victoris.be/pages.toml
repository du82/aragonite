["https://www.victoris.be/projects/pace"]
title = "PACE - Victoris - Ghent University"
description = "PACE is a tool that quantifies the energetic reserve capacity of the body during exercise to prevent injury, exhaustion, dropout..."
full_description = "PACE A tool that quantifies the energetic reserve capacity of the body during exercise. The project PACE is an algorithm/tool that quantifies the energetic reserve capacity of the body during exercise. Individuals performing exercise obtain real-time feedback on their energetic balance. PACE integrates data registered during training (power output/speed or heart rate) and matches these data to the individual exercise capacity. Background Many recreational cyclists participate in organized events for which they train several weeks in advance. At the moment of the event, they want to reach the finish line (in the best possible time) and to do so, they are forced to perform close to their limits. However, many of these people do not know the physiological limits of their own body, mostly due to a lack of experience in these type of events. Therefore, they often do not know how to pace their ride and unfortunately, this often results in exhaustion before reaching the finish line. Advantages Get to know the physiological limits of your own body Improve the effects of your efforts on the training outcomes Decrease occurrence of overtraining, illness and/or injury Goals Develop the PACE-model and integrate it into a demonstrator to be used in the field. InfographicDownload the infographic of this project DownloadSenior ResearcherProf. Dr. Jan BooneContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} New Sports Science Lab Load monitoring platform SpartaNova – Hylyght Muscle Talent Scan Load More SpartaNova – HylyghtBAS-X"
