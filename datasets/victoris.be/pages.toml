full_description = "It’s Gym Interaction between training load, sleep and immunology The projectFollow-up the training load and sleep patterns of elite gymnasts (High Performance School in Ghent) through an application for smartphone/tablet, which can give immediate feedback towards the coaches. Measuring Immunoglobulin A based on weekly saliva samples, which provides insight in the first line defense mechanism for infections. Providing information to the coaches to optimize the training process, formulating guidelines and suggesting possible interventions to optimize sleep and maintain health to achieve training results. BackgroundExcessive training loads and/or inadequate sleep may make athletes more susceptible to infections of the respiratory tract, leading to deteriorations in performance. This interaction has rarely been measured in elite athletes due to methodological issues (measurement of training load, sleep and immune function). AdvantagesUse of non-invasive techniques only. Results are immediately visible for the coaches who can interfere rapidly in their training programs. Reducing the risk for respiratory infections in elite athletes. GoalsFurther development of the application to generate clean graphs and easy-to-understand output. Broadening the use of the application to different sports. Senior ResearcherProf. Dr. Jan BourgoisContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!import