["https://www.victoris.be/calling-all-entrepreneurs-in-sports-health-tech-join-our-expert-database"]
title = "Calling All Entrepreneurs in Sports & Health Tech: Join Our Expert Database - Victoris - Ghent University"
description = "In the fast-evolving world of sports and health technology, innovation is driven by collaboration between researchers, entrepreneurs, and industry experts. At Victoris, we are committed to advancing science-driven innovation by bridging the gap between academic research and real-world applications. Our goal is to foster collaborations that lead to groundbreaking solutions in sports and health technology...."
full_description = "Calling All Entrepreneurs in Sports & Health Tech: Join Our Expert Database3 days agoMerel VanoverbekeBusiness Developer, Innovation, StartUps In the fast-evolving world of sports and health technology, innovation is driven by collaboration between researchers, entrepreneurs, and industry experts. At Victoris, we are committed to advancing science-driven innovation by bridging the gap between academic research and real-world applications. Our goal is to foster collaborations that lead to groundbreaking solutions in sports and health technology. To accelerate this mission, we are expanding our network of professionals who have experience or a keen interest in entrepreneurship within these sectors. We often receive spontaneous applications and informal messages from individuals eager to contribute their expertise or explore new challenges. At the same time, we regularly seek experts to collaborate on various research and development projects. To make these connections more efficient and impactful, we are building a dedicated database of professionals whom we can reach out to when relevant opportunities arise. Why Join Our Expert Database? By putting yourself on our radar, you will have the opportunity to: Engage in cutting-edge projects within Ghent University and the global sports and health tech ecosystem. Collaborate with like-minded professionals to drive innovation and bring research-based ideas to life. Stay informed about potential opportunities, including partnerships, research collaborations, and entrepreneurial ventures. Good to know: there is no active community building planned as so far. Therefore, we refer to the Sports Tech Research Network which has a more international and broader scope. The idea is mainly to always have a relevant and competent group of people on our radar, which we could contact in case we’re in need for an expert, spin-off co-founder, advisor, or alike. Our scope here is on the entrepreneurial side of things, facilitating the transfer of knowledge through skilled and motivated people who are willing to play an active role within certain projects, early in the process. How to Get Involved If you have a background in sports and health technology entrepreneurship—or simply an interest in contributing your expertise—we invite you to join our network. To express your interest, we encourage you to complete our short survey, which will help us understand your skills, experience, and areas of interest. Your insights and expertise could play a pivotal role in shaping future initiatives. We look forward to the opportunity to collaborate in driving innovation in sports and health technology, ensuring valuable findings don’t just sit on the academic shelf. Join the expert database entrepreneurship, Ghent University, sports techRelated Posts @media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9037 .w-grid-item-h{}.layout_9037 .usg_post_title_1{margin-top:0.6rem!important;margin-bottom:0!important;font-size:1rem!important}.layout_9037 .usg_post_date_1{font-size:0.9rem!important;color:#999999!important} New Quality Framework for Sports Technologies available (open access)23/05/2023 The spin-off story of EXOLIGAMENTZ, the finger-protective sports glove31/01/2023 A multidisciplinary project for injury prevention in horse back riding, HorSize!17/11/2022 Search for: Recent Posts Calling All Entrepreneurs in Sports & Health Tech: Join Our Expert Database SPORSA: Pioneering Technological Advancements for Safer Cycling New spin-off Brailsports is developing an AI platform for optimized sports training Ghent University and Lotto Dstny Renew Collaboration to Innovate Cycling Scientist under the microscope: Thibault Fouquaert on Virtual Sports Categories Artificial Intelligence Biomechanics Business Developer Development Digital Events External Health Tech Injury Prevention Innovation Jobs Medtech Meetup Movement and Sports