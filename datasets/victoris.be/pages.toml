title = "BAS-X - Victoris - Ghent University"
description = "BAS-X wants to get as many people (45+) as possible outdoors spending a basic number of active hours per week by giving them the most suitable running, cycling or walking walking route and many more features!"
full_description = "BAS-X The accessible web browser that provides you with the most suitable cycling, running or walking route and many more features. The project BAS-X aims to allow as many people (45+) as possible to spend a basic number of active hours per week outdoors through the 3 most popular activities: running, cycling and walking. It offers you a suitable route at the starting point of your choice. Whether you’re a cyclist, walker or runner, whether you’re in excellent shape or getting started at improving your physical condition… at any location. There’s no need to install an app or buy an extra device (GPS, wearable…). BAS-X will also “nudge” you in order to convince you to go outside and follow a route on a regular basis. BackgroundAdvantages It offers suitable recreational routes according to your preferences It’s accessible through the browser on your smartphone Map rotation, turn-by-turn instructions and sound instructions are available Weather conditions and sports trends are informed to the users. Users can check their routes in the bucket list Goals BAS-X wants to encourage people to exercise more in an easy and accessible way. InfographicDownload the infographic of this project DownloadSenior ResearcherProf. Dr. Steven VerstocktContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!importan