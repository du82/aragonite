title = "Load monitoring platform - Victoris - Ghent University"
description = "This platform monitors load and helps to prevent overuse injuries in jump-landing sports."
full_description = "Load monitoring platform A platform to monitor load and prevent overuse injuries in jump-landing sports. The projectThis project aims to develop user-friendly techniques for load monitoring in jump-landing sports in collaboration with Volley Vlaanderen. More specifically, personalized training diaries will be documented in an online platform, Panega Sports, to make an accurate estimation of player-specific fluctuations in training load during the entire season in order to continuously monitor load and prevent overuse injuries. To account for individual specific risk factors for developing overuse injuries a jump related biomechanical and physical screening will be performed within the project. BackgroundOveruse injuries are highly reported in sports with repetitive, high-load jump-landing activities (e.g. volleyball and basketball). To tackle these injuries from the start, adequate monitoring of training load (as part of a multifactorial personalized risk assessment) throughout the entire season seems essential to observe player-specific fluctuations in perceived and objective load. Expensive and advanced technology is often used for load monitoring, which makes implementation in a sports context challenging up to this day. In this project, user-friendly personalized training diaries are validated against this technology, and implemented in the context of sports in order to investigate the causal relationship between training load and the development of overuse injuries, with the ultimate goal of injury prevention. Advantages Develop a user-friendly system without advanced technology for load monitoring Get to know the players limits from the perspective of the coach versus player Prevent overuse injuries in jump-landing sports GoalsDevelop adequate load monitoring techniques and integrate it into effective load management strategies in jump-landing sports. Get insight in jump related biomechanical and physical risk factors for overuse injuries Senior ResearcherProf. Dr. Roel De RidderContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Lower Impact Running VENTOUX D-Jogger BAS-X Load More HorSizeCourse"
