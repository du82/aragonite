["https://www.victoris.be/projects/promow"]
title = "ProMoW - Victoris - Ghent University"
description = "Contact us for more information about this project"
full_description = "ProMoW Smart products for mobile wellbeing The projectTETRA-project to create a Flemish network of, and provide support for, integral design processes and prototyping in the field of mobile and smart applications for health and wellbeing. The project will deliver User Centered, Interaction and Product Design guidelines and will provide Technology Selectors that help companies in making the right decisions in terms of hard- and software (e.g. which sensors or actuators (not) to include in my product?). The project wants to help in creating smart products and applications (e.g. integrate IoT technology). It enables a smooth and cost-efficient transition from prototype to final product. BackgroundFlanders already has a very strong health-related ecosystem and economy which is deeply rooted in our culture. In order to sustain this local socio-economic domain, constant innovation is needed and ongoing (see e.g. ProF or ZorgEconomie). On a technical level, Internet-of-things (IoT) and smart devices are becoming more important with a forecasted global economic impact between 2.7 and 6.2 billion US Dollars by 2025. Partners in ProMoW will receive support for integrating IoT in their existing and new products and for developing mobile smart health and wellbeing products. AdvantagesProMoW partners can collaborate in the project through various partnerships, ranging from being a member of the user committee to being full partner and having an Industry Case and two Concept Demonstrators developed. All partners will have access to: the ProMoW knowledge and expertise network a virtual lab (III-Lab, Protolab, DSL-Lab, Sizing Servers) that supports the various steps in the design process an integrated design strategy (IDS) that removes the hurdles for creating smart products and that focusses on user and usage (market & context), interaction (context & technology) and product design (technology & production) ProMoW seminars and workshops GoalsCreate a knowledge and expertise network and develop an integrated design strategy (IDS) that removes the hurdles for working with smart products. Co-create with full partners (big or small) of the project various industry cases and concept demonstrators, using the developed integrated design strategy (IDS). Senior ResearcherProf. Dr. Jelle Saldien Prof. Dr. Steven VerstocktContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} SHAPE SmartLife Exoligamentz Lower Impact Running Load More SmartLifeGet Fit 2 Sport"
