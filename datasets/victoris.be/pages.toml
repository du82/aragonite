title = "Beta-alanine supplementation - Victoris - Ghent University"
description = "Download the infographic of this project"
full_description = "Beta-alanine supplementation Strategies to improve the effectiveness of beta-alanine supplementation The projectResearch on the determinants influencing the loading protocol (e.g. effect of training, meal coingestion) Unravel the involved metabolic pathways in the beta-alanine metabolism BackgroundThe use of dietary supplements in sport is widespread since athletes are continuously searching for strategies to increase performance at the highest level. Chronic oral beta-alanine supplementation is a popular ergogenic strategy in sports as it can increase intracellular carnosine concentration and subsequently improve performance of high-intensity exercises. AdvantagesThe project helps to find better ways to delay fatigue from high-intensity exercise. We gain deeper insight in why Beta-alanine is one of the few dietary supplements that really has performance-enhancing effects in athletes. We build a better understanding about which factors determine the loading process as well as what the mechanisms are by which this has an ergogenic effect (e.g. intramuscular pH buffer and calcium regulation by carnosine). GoalsCreating better guidelines for optimal use of ergogenic supplements Valorization of new findings possibly leading to better products available on the market Performing research and development of new dietary supplements in collaboration with industry InfographicDownload the infographic of this project DownloadSenior ResearcherProf. Dr. Wim DeraveContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity: