["https://www.victoris.be/projects/rewetta-ball"]
title = "Rewetta ball - Victoris - Ghent University"
description = "Automatically detecting highlights during training or competition with captured sports data streams such as heart rate, video streams..."
full_description = "Rewetta ball Rewetta ball The projectThe Rewetta ball is a field hockey ball with a self-wetting mechanism. Instead of extensively watering the entire field, you briefly submerge the ball in water before use. When there is friction with the pitch or interaction with the stick, the ball releases water. The result: there is no more need for a watered hockey field: the ball rolls smoothly and consistently across a dry pitch and barely bounces. Moreover, the ball can handle many conditions, from high temperatures to rainy surfaces. BackgroundProfessional hockey fields require extensive wetting. Millions of litres of water are used annually to irrigate one field, making the sport expensive, unsustainable and inaccessible. That’s why the international field hockey federation FIH aims to switch to dry fields as soon as possible. One water field requires up to 15,000 litres of water per spraying session. This equals millions of litres annually or nearly 5 Olympic-sized swimming pools. And an expensive sprinkler system on top of it. In countries with extreme drought, that makes the sport inaccessible. Moreover, such water consumption is not sustainable in a world of climate change and drinking water scarcity. Professor Dagmar D’hooge of the Department of Materials, Textiles and Chemical Engineering (MaTCh) rose to the challenge of making field hockey more sustainable. He put together a multidisciplinary team with Professor Ludwig Cardon, Stijn Rambour and Mustafa Erkoç to concoct a solution. AdvantagesThere is no more need for a watered hockey field: the Rewetta ball rolls smoothly and consistently across a dry pitch and barely bounces. Moreover, the ball can handle many conditions, from high temperatures to rainy surfaces. Away with expensive sprinkler systems and sky-high water consumption. And even better: the Rewetta ball is sustainable in all aspects: “We aimed for a circular product. Our ball is completely recyclable.” GoalsThe main goal of the Rewetta ball is to make field hockey: more sustainable more accessible less expensive Senior ResearcherProf. Dagmar D’hooge, Prof. Ludwig Cardon, Stijn Rambour and Mustafa ErkoçContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} SPORSA STATS VENTOUX Ghentendon Load More SPORSASTATS"
