title = "Ghentendon - Victoris - Ghent University"
description = "Automatically detecting highlights during training or competition with captured sports data streams such as heart rate, video streams..."
full_description = "Ghentendon Non-invasive Intra-tendinous Pressure Quantification The projectThe ‘IOF ConcepTT’ project Ghentendon aims to validate a non-invasive method for intratendinous pressure quantification. This project entails the construction of a measurement set-up where this novel method is tested for its capacity to determine intratendinous pressure in the Achilles tendon. Results from these tests will be compared with the current golden standard for quantifying intratendinous pressure, which requires needle infiltration into the tendon. BackgroundTendinopathy is a common tendon overuse injury in performance athletes as well as in the working population. It is characterized by pain, swelling and a reduced function of the tendon. Over the past years, increased participation in recreational sports has led to a rising incidence of tendinopathy. Previous work of the involved researchers has shown that excessive intratendinous pressure could be important in the injury mechanism and perpetuation of Achilles tendinopathies. Obtaining quantitative information on this pressure is as such important in the diagnosis, prevention and treatment of tendinopathy. Nowadays, however, (minimally) invasive needle manometers are used for intratendinous pressure measurements, which can only be performed by trained doctors. This needle insertion causes tendon damage, is painful and only results in local point measurements. Moreover, it does not allow for dynamic measurements. A non-invasive device which can determine pressure inside a tendon in both static and dynamic conditions will have a significant added value in different settings. AdvantagesNon-invasive determination of intra-tendinous pressure: gives clinicians the possibility to easily diagnose patients in an early phase of tendinopathy and helps to evaluate the effect of proposed therapy during a follow-up doctor visit aids physiotherapists and patients during the rehabilitation process to finetune the intensity of the therapy provides podiatrists, occupational therapists or sports coaches/trainers valuable information on preventive adjustments to avoid tendinopathies GoalsAfter lab-scale validation of the proposed non-invasive measurement method, the goal is to transform the technique into a device. The purpose is to create a tool that cannot only be used in the context of Achilles tendinopathy but also for other tendinopathies such as golfer’s elbow, tennis elbow, jumper’s knee (patella tendon), etc. Senior ResearcherProf. Dr. ir. Geert Van Steenberge & Prof. Dr. Luc Vanden BosscheContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Rewetta ball HorSize STRADA Team Play Analytics Load More VENTOUXIDRO"
