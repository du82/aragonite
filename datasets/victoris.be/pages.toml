full_description = "InGame Online learning tool for invasion games The projectInGame is an online learning tool for invasion games based on the pedagogical expertise of practitioners and researchers at Ghent University. It currently contains content for basketball and handball. It is used by > 1000 Belgian physical education teachers, students and coaches. BackgroundIn contrast to traditional approaches, InGame uses small sided games to teach skills and tactics simultaneously. This leads to better learning opportunities and greater satisfaction. This instructional approach, however, was not easily accessible in a practical online tool. AdvantagesThe website facilitates teachers’ and trainers’ insights into how to instruct invasion games. It provides specific information on how to adjust the game to the individual capacities of the players using video-clips and exercises. This in-depth and step-by-step approach, implemented into an online platform, is still unique in the field (most of the current available tools only provide sets of individual exercises or games). GoalsThere is a need to elaborate the tool and include contemporary functionalities such as social media, gamification techniques, community building, etc. The content should be translated into English to facilitate global use. Several functionalities such as an assessment tool, homework applications, a mobile version for use on the court, etc. could make it even more innovative and appealing to teachers and trainers. Senior ResearcherProf. Dr. Frederik DeconinckContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_