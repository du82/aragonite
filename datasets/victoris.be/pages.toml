["https://www.victoris.be/projects/lower-impact-running"]
title = "Lower Impact Running - Victoris - Ghent University"
description = "Download the infographic of this project"
full_description = "Lower Impact Running Technology for a healthy running lifestyle The project A measurement device attached to the lower leg registers with high accuracy the impact shock at foot contact. The measured impacts are translated into real-time audio feedback for the runner. The audio feedback uses music to facilitate a self-adapted running style with reduced impact in a pleasant, motivational way. Running speed control is embedded in the solution. Background Distance running is a popular leisure-time physical activity, but many runners encounter overuse injuries. Some injuries are related to high impact loads and lead to demotivation and early dropout. Some current running wearables are able to measure impact loads, but embedded bio-feedback remains an issue. Advantages Real-time feedback The real-time audio feedback allows for immediate adaptation and improvement of the running style. Fewer injuries Reduction of the impact load thanks to an improved running style can lead to fewer injuries and associated demotivation or dropout. Accurate information Precise measurement of the impact load of runners is available in real-time for doctors, coaches, physios, etc. Goals Validation Combined biomechanical gait analysis will provide insights in impact reduction techniques. Follow-up of large cohorts will unravel effects on prevalence of distance running injuries. Product development Focusing on commercial hardware and software development based on the technical proof-of-concept. Go-to-market Defining the best possible route to market and attracting one or more license partners for further commercialization. InfograficDownload the infographic of this project DownloadSenior ResearcherEm. prof. dr. Dirk De ClercqContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns: