["https://www.victoris.be/projects/ercat"]
title = "ERCAT - Victoris - Ghent University"
description = "Contact us for more information about this project"
full_description = "ERCAT European Research Centre for Artificial Turf The projectSince 2008, ERCAT is acknowledged by FIFA to do football field tests all over the world. Since January 2010, ERCAT is also accredited by the International Hockey Federation (FIH) and the International Rugby Board (IRB) for field and lab tests. The most recent knowledge of polymer and fiber technology is applied at ERCAT, which is supported by an extensive set of testing and measuring devices for both laboratory and field tests. ERCAT can also help you with CE marking, because we are accredited for the fire tests. BackgroundArtificial turf is becoming more and more popular as an alternative to natural grass playing surfaces. Know-how on artificial turf testing (e.g. ball-surface and player-surface interaction) has been developed at Ghent University during the past decades. AdvantagesTesting by ERCAT guarantees both the quality of your artificial turf and the playing characteristics of the field. ERCAT can help you with your subbase. The stability and water permeability can be controlled with Prima light weight deflectomer (LWD) or with impulsator for sand and lava based systems. Goals The goal is to increase the amount and improve the quality of evidence based artificial turf testing worldwide. Senior ResearcherProf. Dr. Lieva Van LangenhoveContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_v