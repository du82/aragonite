full_description = "Exoligamentz A new type of athlete finger and hand protection The projectExoligamentz is a finger-protective sports glove which includes distinctive joint protection techniques resulting in a new concept of a functional orthosis. Its unique design strives to restrict abnormal motion while maintaining functional movement of the athlete’s hand. It will function as a possible alternative for the common taping approach which has various limitations. This new type of glove may impact various markets and end-users (e.g. orthopaedic market). However, the focus is on injury prevention in those sports where gripping is often causing finger and hand injuries (e.g. combat sports such as Brazilian Jiu-Jitsu, Judo, etc. and ball sports). BackgroundBuilding upon the design made by student-entrepreneur Ashkan M.H. Joshghani, a unique partnership between Ghent University and the student-entrepreneur has been established for the development of this new, patent protected sports glove. AdvantagesBased on the features of the glove, the advantages can be summarized as follow: Time-saving Re-usable Unrestricted movement Enhanced joint protection GoalsThe goals of this project are threefold: to develop a functioning prototype with proper materials and appropriate production technology to test the biomechanical effects in an easy-to-build test method to validate the findings with end-users and companies InfographicDownload the infographic of this project DownloadSenior ResearcherProf. Lieva Van LangenhoveContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scal