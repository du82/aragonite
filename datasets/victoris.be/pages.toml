["https://www.victoris.be/projects/course"]
title = "Course - Victoris - Ghent University"
description = "This tool detects the potential safety risks of a cycling course so organizers can make targeted safety actions in advance."
full_description = "Course A tool to predict unsafe situations in a cycling race. The project COURSE is a tool that collects unstructured incident tweets from cycling-related Twitter accounts and transforms it into structured data. This data is further enriched with input from cyclists, teams and race commissioners. The data is used in the development of a course evaluation tool for identifying dangerous points on the race parcours. With the help of artificial intelligence, the tool analyzes race info provided by organizers (GoPro footage, gps course files descriptions, etc.). COURSE generates detailed stats/maps that UCI and organizers can use to determine how safe or unsafe certain segments of their races are. Following characteristics are taken into account in the course evaluation: stage hardness, bunch sprint & finish speed prediction, presence of descending lines, roundabouts & traffic furniture, changes in road type & road quality, and more. BackgroundOver the last years, the team of Prof. Steven Verstockt (UGent-imec, IDLab) has been involved in several sports-related projects/proposals to share their expertise on spatio-temporal datacollection, filtering, classification, enrichment, mapping, and visualization. In response to several serious accidents in cycling, the International Cycling Union (UCI) wants to introduce a series of measures to make cycling safer. The UCI is counting on data-driven solutions from the research team at Ghent University through a new dashboard. Advantages Detection: Organizers can detect the potential safety risks of the race course Advise: UCI can advise organizers on what safety measures should be taken. Clean data: A structured dataset is built that indicates the most common causes and the time-space distribution of incidents. Goals Implement: providing support in applying the tool during the preparation of particular race events. Finetune: learn and create smarter algorithms, making it possible to accurately estimate cycling accident risks. Prevent: accidents & injuries Keep riders healthy and safe throughout the full season. InfographicDownload the infographic of this project DownloadSenior ResearcherProf. Dr. Steven VerstocktContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Automatic Bike Fitting System InGame ERCAT 3Druption Load More Load monitoring platformWireless Cycling Network"
