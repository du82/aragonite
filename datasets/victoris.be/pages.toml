full_description = "SPORSA SPORSA (SPORts SAfety) The projectThe SPORSA project aims to enhance safety in race cycling through innovative technology, providing real-time insights, effective communication tools, and advanced analytics to address the sport’s safety challenges. A surge in crashes during recent seasons, some with severe consequences, has emphasized the limitations of traditional safety measures. Rules and subjective judgments—long relied upon by federations—have failed to significantly reduce injury rates, as evidenced by data from ProCyclingStats. Recognizing the need for a transformative approach, the SPORSA project was launched by the Sports Data Science team at IDLab (UGent-imec). BackgroundSPORSA was founded in response to increasing crashes and safety concerns in professional cycling, highlighting the limitations of traditional safety measures. The project was initiated by the Sports Data Science team at IDLab (UGent – imec) to develop data-driven solutions for improving safety during cycling events. Advantages Real-time safety monitoring of peloton dynamics. Accurate live data sharing with various stakeholders, including fans and media. Objective tools for race officials to ensure fair decision-making. Enhanced post-race analytics for teams and media. Compliance with UCI regulations and endorsement by the rider union. Goals To create a prototype system integrating advanced hardware and software for cycling safety. To test and refine the system in real-world conditions. To establish a spin-off company for commercial implementation. To ensure widespread adoption and scalability of SPORSA’s technology, making cycling safer and more transparent. Senior ResearcherProf. Dr. Steven VerstocktContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}