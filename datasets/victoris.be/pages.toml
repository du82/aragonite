["https://www.victoris.be/projects/footbal-shoe-biomechanics"]
title = "Footbal Shoe Biomechanics - Victoris - Ghent University"
description = "Contact us for more information about this project"
full_description = "Footbal Shoe Biomechanics Shoe-surface interactions The projectIn collaboration with an industrial partner, young, experienced national level soccer players were tested while performing cutting maneuvers on artificial turf. A biomechanical analysis consisting of 3D kinematics and ground reaction force measurements was conducted. BackgroundArtificial turf fields are gaining popularity and turf types are constantly evolving. AdvantagesThe interaction between soccer player, soccer shoe and turf type are of specific interest for soccer shoe manufacturers. This project gains insights in possible injury mechanisms and performance differences between soccer players, turf types and shoe types. GoalsTo gain better insights in the interaction between soccer player, soccer shoe and artificial turf type during cutting maneuvers performed with different shoe types, on different types of artificial turf and with different levels of anticipation. A main variable of interest is the generated traction during these cutting maneuvers. Senior ResearcherProf. Dr. Dirk De ClercqContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-siz