["https://www.victoris.be/projects/horsize-2"]
title = "HorSize - Victoris - Ghent University"
description = "Reducing the number of ill-fitting saddles and equitation related injuries in horse and human!"
full_description = "HorSize Data driven saddle adaption for a more sustainable equitation The projectThe project focuses on the co-development of conformational knowledge and measuring tools. By building a database of equine measurements – together with the industry – it will be possible to steer and adapt saddle production to current conformational requirements of equine (sub)populations. Previous research allows for the creation of equine back size charts (‘the back shapes and sizes’ of our horses). In addition, we’re developing tools to correctly measure horses during ‘in the field’ circumstances. By co-developing these tools with the different stakeholders, each group will be provided with practical & reliable measuring options which provide the data they actually need in order to create personalized saddles with an optimal fit for the rider. BackgroundThe equine saddle industry as a whole faces three major challenges: the change in 1) equine conformation has changed following enhanced performance, 2) the need to accommodate for frequent worldwide travel of equids and ‘their humans’ and 3) the call for increased sustainability for both animals, humans and the planet (c.f. Sustainable Development Goals, SDGs). The multidisciplinary ‘sustainable equitation’ research team of FTI-Lab+ (HOGENT) has, therefore, built expertise on ‘in the field’ equine withers measurements & population wide conformational analysis. Together with the stakeholders in the saddle industry (production, fitting, riding, training, (para)veterinary,…) they aim to reduce the number of ill fitting saddles by, firstly, charting the shapes and sizes of modern equine backs and by developing robust, affordable & reliable ‘in the field’ measuring tools adapted to the different stakeholder groups and their needs. The firm belief herein is that it all needs to start from knowing for which back shapes and sizes we need to produce and select saddles. Advantages Size charts to steer production and selection of saddles We will know which saddle shapes and sizes need to be produced to accomodate for the withers of our modern sport horses. This can aid R&D of new saddles and help to make an estimation of the existing saddle types on the market. Reliable ‘in the field’ measurements for different stakeholders Different stakeholders will be able to reliably and affordably measure the withers of their horses to aid in the saddle checking & fitting of their horse(s). Digital communication Digital, standardized communication about equine back sizes between internationally located stakeholders. Goals Advise Advise the industry about which saddles to produce and estimate the market potential of particular saddles (shapes and sizes). Empower Empower different stakeholder groups by providing tools which give them the data they need to evaluate saddle fit for a particular horse, also providing appropriate training to use the tools. Co-create knowledge base for sustainable saddle production An industry-adapted conformational database to allow further saddle development and a ‘internationally usable common language’ for appropriate size-communication based on a scientifically based size chart. Senior ResearcherProf. Dr. Annelies Van den EedeContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} wE-Move STRADA Automatic Bike Fitting System ProMoW Load More STRADALoad monitoring platform"
