["https://www.victoris.be/projects/3druption"]
title = "3Druption - Victoris - Ghent University"
description = "Download the infographic of this project"
full_description = "3Druption Markerless motion capturing for on-the-field use The projectWe developed a solution which combines views from a multi camera setup resulting in 3D images. From this 3D visual hull, relevant information such as presence, position, speed, acceleration and the kinematic model can be derived. This information is then coupled to data analysis tools leading to enriched decision making data for coaching, scouting and refereeing. Examples of our latest work at the Sport Science Laboratory – Jacques Rogge can be found here: https://www.youtube.com/watch?v=PXDeTgEfwjM https://www.youtube.com/watch?v=yMgmM5mw3O8 Hardware: off-the-shelf mid-range IP cameras, calibration tools, a custom designed data processing and storage solution and visualization equipment. The number of cameras depends on the complexity of the scene you want to observe (e.g. amount of people to track, their proximity to one another and the amount of scene occlusion). Software: state-of-the-art FG/BG segmentation algorithms, the visual hull algorithm including occlusion management and analytics tools. BackgroundStatistics on the tracking of players in sports games prove to be very valuable. However, current solutions are very expensive and are not always applicable at game time. Marker based systems can only be used reliably in indoor conditions. Radio based transmitters have a varying reliability depending on the surroundings. Both need to be applied to the person’s body, which is often undesired or impossible. In many sports, wearables at game time are not allowed because of regulations, safety issues or performance-interferencing reasons. AdvantagesMarkerless motion capturing makes wearables redundant while performance analysis is still possible, even at game time. A remarkable aspect of the technology is the intelligent occlusion management. This effectively overcomes interference to the person’s 3D approximation originating from objects blocking the view of the observed person. The latter is often overlooked in current technologies, significantly limiting their use. GoalsThe team is very responsive for innovation and business development feedback. As strong believers in lean innovation, they are convinced that assumptions related to the technology, the market it can possibly be applied in, etc. should be continuously tested with end-users. A possible application of the technology, that the team is working on for the moment, is applying this markerless motion capturing technology in basketball shooting analytics. InfographicDownload the infographic of this project DownloadSenior ResearcherProf. Dr. Peter VeelaertContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Nano4Sports InGame Team Play Analytics Lower Impact Running Load More SpartaNovaSports ID Marathon"
