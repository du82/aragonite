["https://www.victoris.be/projects/idro"]
title = "IDRO - Victoris - Ghent University"
description = "Automatically detecting highlights during training or competition with captured sports data streams such as heart rate, video streams..."
full_description = "IDRO The Use of Non-invasive and Real-time Sweat Lactate Measurements in Sports The projectThis project tries to answer the questions: what can be done with sweat lactate values from non-invasive wearable techin sports practice, how valid are the measurements and how can the IDRO sensor and related app be further developed into a valuable product for consumers? The results of this project will be used to delineate the scope of the sensor, test its practical usability and determine the ideal placement on the body. It will also be relevant for determining further development of the sensor (hardware) and app, the latter displaying the results of the key insights on the screen (software and algorithms). The finished sensor and app can then be used for determining training intensity and tracking and adjusting training load. BackgroundDefining a personalized training program for athletes often remains a challenge as it’s frequently based on indirect measurements. In that sense, the dynamic monitoring of lactate is crucial for athletes and coaches in optimizing individual training programs. However, standard lactate measurement is invasive and non-continuous. Also, there’s a need for someone to handle the blood sampler. Therefore, the main goal of this university-industry project is to demonstrate the applicability of non-invasive and real-time sweat lactate measurements in sports. Advantages Non-invasive Instead of invasive blood measurements, the team wants to develop, fine-tune and validate a non-invasive way of measuring lactate through sweat. Real-time data Based on the response(s) of sweat lactate measurements to changing intensity, algorithms will be developed to calculate individual reference values that can be used to adjust training in real-time. Theories into practice Based on the results, the IDRO sensor (hardware) and app (with algorithms) will be further developed into a commercial science-based product, so it can be widely used in the field. Goals Validating sweat vs blood lactate Research will be done on the evolution of sweat and blood based lactate levels during efforts of different intensities in order to determine whether (and how) sweat lactate measurements can be used during monitoring procedures. Optimizing sensor placement We’ll determine the best placement of the sensor on the body for measuring sweat lactate. This will be done based on sweat production location on the body and end-user comfort when wearing the device. Clarifying the role in thresholds and training zones The use of sweat lactate values in determining thresholds and training zones (and loads) during exercise testing will be investigated as well. Senior ResearcherProf. Dr. Jan BooneContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Beta-alanine supplementation Nano4Sports Rewetta ball BAS-X Load More GhentendonSTRADA"
