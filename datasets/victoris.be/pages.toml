["https://www.victoris.be/projects/automatic-bike-fitting-system"]
title = "Automatic Bike Fitting System - Victoris - Ghent University"
description = "Contact us for more information about this project"
full_description = "Automatic Bike Fitting System Automated data-driven bike fitting using Bioracer Motion Sensing Data The projectTo solve the expert subjectivity problem, and to improve the overall fitting process, we have started a research project to develop a methodology to perform an automated bike fitting based on a novel data-driven decision-making processes. In a first phase, the automated bike fitting system will assist bike-fitters in their fitting process and advise them about the saddle height, fore and aft positioning based on objective features. The final goal of our project is to have a fully autonomous bike fitting system, which can fit a cyclist with sufficient accuracy in a short period of time. BackgroundAn easy to use bike fitting procedure is a must to keep cyclists injury free and motivated. Current bike fitting processes however are very labor intensive and subjective as they are based on the experience of a bike-fitting expert. A bike fit can take up to three hours and is always an interplay between comfort, performance and injury prevention. Every bike fitter has their own vision and own points of attention, hence why the cycling position is based on their prior experience and education. Cycling is a biomechanical movement which indicates that there should be certain features to objectively determine the optimal cycling position. AdvantagesThis project will be revolutionary in the cycling industry as less experience will be needed to properly fit a cyclist on his bike. Bike retailers and big sports enterprises will be able to fit a cyclist on a new bike without knowledge of the human body or biomechanics as the algorithm will guide them through the fitting process. Our system will be easy to use, and more time efficient than current alternatives. The cost will be greatly reduced and more cyclists can be fitted within a short space of time. GoalsThe first goal is to determine the “optimal” cycling position, with the expert features in mind. Afterwards, we want to find new features using machine learning. The end goal is to have a commercially available system that can be used by any bike shop, a system that is easy to use and adds to the existing bike fit experience. Ideally, every cyclist would get a bike fit and ride injury free to enjoy their sport even more. Senior ResearcherProf. Steven VerstocktContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Sports ID Marathon SmartLife Feedback app for bike and running tracks V-observer Load More Lower Impact RunningExoligamentz"
