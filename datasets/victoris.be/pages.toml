full_description = '''Calling All Entrepreneurs in Sports & Health Tech: Join Our Expert Database13/02/2025Merel Vanoverbekeentrepreneurship, Ghent University, sports techRead More New spin-off Brailsports is developing an AI platform for optimized sports training21/10/2024Merel VanoverbekeRead More Victoris, Ghent University consortium in Sports innovation. Creating evidence-based sport products and services. Your partner in sports research and development. We're open to explore possible collaborations with you. We're always open to discuss your R&D challenges in all confidentiality. setREVStartSize({c: 'rev_slider_5_1',rl:[1240,1024,768,480],el:[500],gw:[1140],gh:[500],type:'standard',justify:'',layout:'fullwidth',mh:"0"});if (window.RS_MODULES!==undefined && window.RS_MODULES.modules!==undefined && window.RS_MODULES.modules["revslider51"]!==undefined) {window.RS_MODULES.modules["revslider51"].once = false;window.revapi5 = undefined;if (window.RS_MODULES.checkMinimal!==undefined) window.RS_MODULES.checkMinimal()} Victoris represents more than 40 researchers active in a diversity of sport topics, enabling a multidisciplinary approach to your challenges. The final goal of each member of the consortium is to support athletes in the best possible way by creating products & services based on science. In order to realize this objective, we seek partnerships with companies, start-ups, clubs, federations, government, etc. The mission is to bridge the gap between science and practice by helping people in the creation of products and services that do not yet exist. For a quick answer to all your questions, you can contact sports technology and business developer Kristof De Mey (single point of contact). Why partner with us? Ghent University is at the forefront of sport and rehabilitation research world wide. More than 40 researchers are exploring a wide range of biomechanical parameters, motor learning strategies, training methods, rehabilitation and injury prevention tools, engineering and analytic innovations and nutritional and psychological interventions. Victoris is the ‘single point of contact’ for anyone outside the Ghent University to ask questions regarding upcoming R&D projects, the creation of new sport products or services (B2B and B2C) or any other suggestion related to the transfer of knowledge between academia and the sports sector. So, why partner with us? Quick and direct access to world class expertise and research facilitiesHonest partner for advice & service related to sports and innovationCompetitive advantage in creating products and services that work (evidence based)Big help in project writing and networking on national and international levelsProjects @media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9034 .w-grid-item-h{background:#333333}.layout_9034 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9034 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9034 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9034 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9034 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} SPORSA STATS VENTOUX View our projectsNews @media (max-width:1024px){#us_grid_2{--columns:2!important}}@media (max-width:600px){#us_grid_2{--columns:1!important}}.layout_9717 .w-grid-item-h{background:#ffffff;border-radius:0.3rem;box-shadow:0 0.03rem 0.06rem rgba(0,0,0,0.1),0 0.1rem 0.3rem rgba(0,0,0,0.1);transition-duration:0.3s}.no-touch .layout_9717 .w-grid-item-h:hover{box-shadow:0 0.1rem 0.2rem rgba(0,0,0,0.1),0 0.33rem 1rem rgba(0,0,0,0.15);z-index:4}.layout_9717 .usg_bt