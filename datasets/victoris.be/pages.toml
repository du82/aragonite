["https://www.victoris.be/ghent-university-and-lotto-dstny-renew-collaboration-to-innovate-cycling"]
title = "Ghent University and Lotto Dstny Renew Collaboration to Innovate Cycling - Victoris - Ghent University"
description = "Victoris is a multidisciplinary group of Ghent University (Hospital) researchers and clinical specialists, with a special focus on sports technology and innovation. The consortium facilitates knowledge transfer activities and research collaborations with companies, start-ups, research institutions, clubs, etc. offering unparalleled expertise and access to leading-edge equipment."
full_description = "Ghent University and Lotto Dstny Renew Collaboration to Innovate Cycling4 months agoMerel VanoverbekeInnovation, Partnerships, Projects, Sports Analytics A Four-Year Commitment to Progress Lotto Dstny and Ghent University have solidified their collaboration for another four years, reinforcing their shared goal of driving innovation in cycling. This extension builds on the successes of the last two years, where Ghent University’s PACE team, led by Professor Jan Boone and Dr. Kobe Vermeire, worked closely with the team, with backing from the National Lottery. Pioneering New Technologies Ghent University will continue to provide crucial support to Lotto Dstny’s performance team, focusing on the development of advanced tools and technologies. Among the key initiatives are a data platform for coaches and the testing of new performance-enhancing products, such as cooling vests and portable muscle monitoring devices. Additionally, Ghent University will offer specialized knowledge in metabolic analysis, altitude training, and sweat profiling to help fine-tune rider performance. Science-Driven Approach to Performance Nikolas Maes, performance manager at Lotto Dstny, stressed the importance of integrating scientific research into the team’s day-to-day operations: “By collaborating with Ghent University, we ensure that every innovation or trend is backed by thorough research. Having Kobe Vermeire onboard full-time allows us to continuously assess and apply these scientific insights.” New Talent on Board As part of the ongoing push for professionalization, Viktor Verschaeve will join as an innovation coach, while Wannes Taelmans will focus on aerodynamic testing. Both bring specialized expertise that will further elevate the team’s performance. Targeting the Top of Cycling This renewed partnership underscores the mutual ambition of both Ghent University and Lotto Dstny to remain at the forefront of cycling innovation, with the ultimate goal of competing at the highest level and returning to the World Tour. Picture: FacepeetersArticle source: Lotto Dstny Related Posts @media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9037 .w-grid-item-h{}.layout_9037 .usg_post_title_1{margin-top:0.6rem!important;margin-bottom:0!important;font-size:1rem!important}.layout_9037 .usg_post_date_1{font-size:0.9rem!important;color:#999999!important} No results found. Search for: Recent Posts Calling All Entrepreneurs in Sports & Health Tech: Join Our Expert Database SPORSA: Pioneering Technological Advancements for Safer Cycling New spin-off Brailsports is developing an AI platform for optimized sports training Ghent University and Lotto Dstny Renew Collaboration to Innovate Cycling Scientist under the microscope: Thibault Fouquaert on Virtual Sports Categories Artificial Intelligence Biomechanics Business Developer Development Digital Events External Health Tech Injury Prevention Innovation Jobs Medtech Meetup Movement and Sports Sciences Nutrition Partnerships Physiology Press Projects R&D Rehabilitation Research Sport Pedagogy Sports Analytics Sports Tech Sports Wearables Sportswear SportUp StartUps Talent Tech News Trends Uncategorized Upcoming Events"
