["https://www.victoris.be/projects/d-jogger"]
title = "D-Jogger - Victoris - Ghent University"
description = "Download the infographic of this project"
full_description = "D-Jogger A beat for each step The projectPersonalised and contextualised music selection and playback for walking and running, each beat perfectly aligned with the step. Beats resonate through the body, in sync with the cadence. The D-Jogger system is very adaptable and supports different music alignment strategies for different goals, several cadence sensors and multiple playlists for use in different research fields. The concept of tempo-adaptive music has led to the European project Beathealth, researching the technology on a large scale in ecological settings. BackgroundMusic can help in exercise and sport to enhance physical activity enjoyment, motivation and performance. Synchronized music has been shown to enhance some of these effects, but synchronizing often requires a conscious effort of the participant. Music in rehabilitation is often used as a motivational tool. Some patients may benefit from repetitive stimuli at the right frequency (metronomes). Music at the right tempo shows great potential and automating tempo- and music selection could greatly benefit this population. AdvantagesSubliminal influence on runners’ cadence: manipulate runners into faster or slower cadence – get attracted to the most healthy or efficient cadence – the new continuous power song for runners. Improved running economy: synchronized music could lead to a more efficient and synchronized breathing pattern, lowering energy consumption during workouts. Available for all: automatic synchronisation allows rhythmic insensitive persons and people with walking disabilities to enjoy the benefits of synchronized music. Interactive auditory cueing for e.g. Parkinson patients: increases general gait parameters, such as stride length, cadence and velocity without introducing a double task to synchronize, whilst using familiar and motivating songs. GoalsFurther research and development into human-computer synchronization and entrainment. Finding optimal training and rehabilitation music, both for efficacy and enjoyment. Using the developed technology and expertise in different domains and fields (e.g. SoundBike). The European Beathealth project, based on D-Jogger, continues the fundamental research and tries to make the technology available for rehabilitation centres. InfographicDownload the infographic of this project DownloadSenior ResearcherProf. Dr. Marc LemanContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Feedback app for bike and running tracks Rewetta ball Load monitoring platform SmartLife Load More SHAPEInGame"
