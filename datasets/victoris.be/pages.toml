["https://www.victoris.be/projects/get-fit-2-sport"]
title = "Get Fit 2 Sport - Victoris - Ghent University"
description = "Contact us for more information about this project"
full_description = "Get Fit 2 Sport Primary sports injury prevention in Flemish young sportsmen The projectCommissioned by the Flemish Government, Ghent University develops (in cooperation with Flemish sports actors) the sports injury prevention program “Get Fit 2 Sport”. By means of a so-called “waterfall-system”, with sports trainers and teachers as most important mediators, Get Fit 2 Sport will reach young sportsmen (12-22y) in Flanders. The implementation of Get Fit 2 Sport will be evaluated with the REAIM method. BackgroundAlthough sports is fun and healthy, it often leads to musculoskeletal injuries. The odds of getting injured can be significantly reduced through primary sports injury prevention. It´s important to teach young sportsmen the principles of sports injury prevention. The backbone of the program, already proven by our research to be effective in multi-sports populations, are mainly basic intrinsic strategies making it applicable for all sports. Sportsmen should be autonomously motivated, aided by the concepts of the self-determination theory, to perform injury prevention exercises correctly and continued. AdvantagesSports injury incidences in Flanders will probably be reduced, and this will be evaluated by prospective injury registrations. By means of a gradual built-up (with differentiation for sports discipline and physical level), Get Fit 2 Sport is easily accessible for all young sportsmen. Due to the waterfall-system, this project is sustainable over time. Prospective injury registrations will provide up-to-date information regarding sports injury incidences in young sportsmen in Flanders. GoalsTo create visual material for better dissemination of the project results. To reach all young sportsmen (12-22y) in Flanders, both in organized and non-organized sporting activities. To decrease sports injury incidence in young sportsmen in Flanders. Senior ResearcherProf. Dr. Dirk De ClercqContact us for more information about this project Contact usDiscover our other projects @media (max-width:1280px){#us_grid_1{--columns:3!important}}@media (max-width:1024px){#us_grid_1{--columns:2!important}}@media (max-width:600px){#us_grid_1{--columns:1!important}}.layout_9098 .w-grid-item-h{background:#333333}.layout_9098 .usg_post_image_1{transition-duration:0.35s;transform:scale(1) translate(0%,0%)}.layout_9098 .w-grid-item-h:hover .usg_post_image_1{transform:scale(1.1) translate(0%,0%);opacity:0.1}.layout_9098 .usg_post_image_1{position:absolute!important;top:0!important;right:0!important;bottom:0!important;left:0!important}.layout_9098 .usg_vwrapper_1{position:absolute!important;right:0!important;bottom:0!important;left:0!important;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,30,30,0.8))!important;padding:4rem 2rem 1.5rem 2rem!important}.layout_9098 .usg_post_title_1{font-size:1.2rem!important;color:#ffffff!important} Rewetta ball HorSize ProMoW SmartLife Load More ProMoWSHAPE"
