full_description = "Uses This is a list of my hardware, software, and other things I use regularly. Hardware When I first started coding professionally in 2004, I did all my work on a Dell Inspiron. I think I first switched to a MacBook Pro in 2010, and have not looked back. My desk Uplift Standing Desk V2 + IKEA Gerton beech tabletop UREVO 2 in 1 Under Desk Treadmill 2 x VIVO Dual Monitor desk mount Dell 27” P2719HC LED monitor x 1 ASUS 26” LCD monitor x 2 Apple MacBook M1 Max Pro (14”, 2021) Apple MacBook M2 Pro (14”, 2022) YubiKey 5C Nano Bose QC45 Wireless Noise Canceling headphones Blue Yeticaster USB microphone + Radius III Shockmount & Compass Boom Elgato Facecam Lume Cube Edge LED Desk Light On the go Powerbeats Pro wireless headphones Kindle Paperwhite 2018 Apple Watch Series 8 Ultra Software Every few months, I wipe my laptop and set it up from scratch using my dotfiles. My dotfiles repo contains scripts that uses Homebrew to set up most to all the applications I use. Coding environment Visual Studio Code + Night Owl theme Other applications that are always open Apple Music Chrome Descript Discord Docker Fig iTerm2 KeepingYouAwake - prevents my Mac from going to sleep when I’m making lunch Obsidian Postman Sequel Ace Slack Spectacle - window management WhatsApp My shoes Hoka One One Clifton 7 Mizuno Wave Rider 24 New Balance 680 V6 Altra Torin 4 For more lists like this one, check out uses.tech."
