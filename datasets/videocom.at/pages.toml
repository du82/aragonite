title = "VideoCom Bridge for Zoom | VideoCom Documentation"
description = """
VideoCom Bridge for Zoom # VideoCom Bridge for Zoom makes it very easy to get a clean videofeed of each of your Zoom conference participants.
Export your the video and audio feed of all Zoom conference participants with the commonly used NDI™ protocol to your favorite broadcasting equipment.
Free Trail and Buy Features # Easy to use # No complicated settings. Just start a new bridge and pin the respective participant by searching for their name."""
full_description = "VideoCom Bridge for Zoom # VideoCom Bridge for Zoom makes it very easy to get a clean videofeed of each of your Zoom conference participants. Export your the video and audio feed of all Zoom conference participants with the commonly used NDI™ protocol to your favorite broadcasting equipment. Free Trail and Buy Features # Easy to use # No complicated settings. Just start a new bridge and pin the respective participant by searching for their name. Then just add the NDI™ input to your live streaming software like vMIX, OBS, Tricaster or any other software supporting the NDI™® protocol. Audio support # Combined audio of all speakers and shared media can be send alongside the clean video feed via NDI™. With our interpreter feature, each bridge seamlessly delivers audio in multiple languages. Tally Link # We understand the pitfalls of remote participation – the frustrating delays and the uncertainty of knowing when you’re live. That’s why we crafted the Tally Link System, a state-of-the-art virtual tally light mechanism. With Tally Link, remote talents receive instantaneous, visual cues notifying them of their live status, ensuring flawless transitions and real-time engagement. No more guessing, no more unwarranted pauses – just seamless communication. Remote control # The powerful HTTP API makes it very easy to control and automate your production workflows. Or control VideoCom Bridge with your Elgato Stream Deck via Companion."
