["http://www.videolan.org/press/win8ks.html"]
title = "VideoLAN - Press Release - Windows 8 Fundraiser - VideoLAN"
full_description = 'Today, some VideoLAN team members launched a fundraiser on Kickstarter to support a port to the new User Experience on Windows 8 (aka "Metro") and Windows RT. VLC for Windows is widely used since a few years now and it is by far the dominant platform for VLC according to our user base numbers. Installation numbers are estimated as followed: The current version of VLC is able to run on Windows 8 which was launched last month. However, VLC is currently limited to the desktop experience, which is hidden by default along with other classic applications, behind one of the tiles (interface element of the Start screen). We want to allow users to get access to VLC from the Start screen and Metro experience too. To run in Metro, important parts of VLC need to be re-written or ported and an entirely new interface needs to be created. This is very time-consuming and considering our current Windows design, we need professional designers to adapt the interface to Metro. Additionally, we would like to have it in the hands of our Windows 8 users as soon as possible. Porting VLC to Metro by relying on volunteers during their spare time would take a long time, just as how VLC for Android has. This is why we decided to run this fundraiser. If successful, it will allow two developers to work on this project full time. Donors will get access to a broad range of goodies and users will benefit from quality software. The project is projected to be published early next year. Running a fundraiser is something the VideoLAN project has never done before. While the donations received through the VideoLAN association (a French non-profit organization) allow us to purchase testing devices, attend and prepare conferences, and pay for servers, employing developers on a contract base would be beyond its current capabilities. This Kickstarter program will make it possible to do such contracts. We hope that you like our idea as much as we do and we are looking forward to answer any question you might have.'
year_published = 2012
clearnet = "http://www.videolan.org/press/win8ks.html"
