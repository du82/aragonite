["https://www.videolan.org/videolan/events"]
title = "The events - VideoLAN"
full_description = "2 - 3 November 2024 - VideoLAN Dev Days 2024 This year, multimedia hackers from around the globe met in South Korea for two days of technical talks. With support of the Kwangwoon University, where we had interesting topics, a good weather, moods and drinks. 6 - 7 December 2023 - Open Source Experience VideoLAN was at the 3rd edition of Open Source Experience event in Paris. Among the French Open Source communities of the Open Source Village, we were able to display heavier demos as we didn't had to travel and carry too much this time for this local event. 23 - 24 Sept 2023 - VideoLAN Dev Days 2023 Finally it happened again ! Multimedia communities including VideoLAN, FFmpeg, Kodi and many other high class multimedia hackers were present at our own technical conference. Hours of insteresting talks, hacking and community events including magnet fishing in the Dublin river. 29 - 30 July 2023 - COSCUP 2023 After many years of absence, we were happy to meet all our communities friends from Taïwan and southern asia. COSCUP has grown to a big and more english speaking oriented event now, using FOSDEM as inspiration. Picture credits belongs to the COSCUP photo team. 9 - 12 March 2023 - SCaLE 20x VideoLAN was back at the largest north american open-source and free software conference. 4, 5 February 2023 - FOSDEM After few years of sadness, VideoLAN was happy to meet everyone again at FOSDEM !. Mr Cône was happy to be in Brussels and our wheel spun all day long to give away lots of new special goodies ! 8, 9 November 2022 - Paris Open Source Experience VideoLAN team was on Open Source Experience Paris. (There's no typo, that's exactly 3 years after our last event) 8, 9 November 2019 - Eleventh VideoLAN Dev Days For the eleventh time, people from the VideoLAN community met to gather, work, discuss and build a stronger community in Tokyo. 2, 3 February 2019 - FOSDEM This year again, VideoLAN team will hold a booth in K building at FOSDEM. The prize wheel is back again with lots of new special goodies !"
