["http://www.videolan.org/sa0807.html"]
title = "VideoLAN Security Advisory 0807 - VideoLAN"
full_description = "When parsing the header of an invalid TTA file, an integer overflow might happen causing an heap-based buffer overflow. When parsing a response from an MMS server, an integer overflow might happen causing a stack-based buffer overflow. If successful, a malicious third party could trigger execution of arbitrary code within the context of the VLC media player. However, because the integer overflows will cause an unusually large amount of memory to be read, a page fault is most likely to occur (segmentation fault on Unix systems, general protection fault on Windows), resulting in a termination of the VLC process. Exploitation of this issue requires the user to explicitly open a specially crafted file, or access a malicious MMS server. The user should refrain from opening files from untrusted third parties or accessing untrusted remote sites (or disable the VLC browser plugins), until the patch is applied. VLC media player 0.9.1 addresses these issues. Patches for VLC media player 0.8.6 are available from the official VLC source code repository. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
