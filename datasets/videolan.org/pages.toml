["http://www.videolan.org/security/sa1203.html"]
title = "VideoLAN Security Advisory 1203 - VideoLAN"
full_description = "If successful, a malicious third party could trigger an invalid memory access, leading to a crash of the process of the VLC media player. Because the overflow occurs while reading a buffer, rather than writing, it is believed that this issue cannot lead to arbitrary code execution. The user should refrain from opening files from untrusted third parties or accessing untrusted remote sites (or disable the VLC browser plugins), until the patch is applied. Alternatively, the PNG decoder plugin (libpng_plugin.*) can be removed manually from the VLC plugin installation directory. This will prevent decoding of PNG images. VLC media player 2.0.4 addresses this issue. Patches for older versions are available from the official VLC source code repository 2.0 and 1.1 branches. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
