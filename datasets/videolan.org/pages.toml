["http://www.videolan.org/security/sa0802.html"]
title = "VideoLAN Security Advisory 0802 - VideoLAN"
full_description = "VLC media player's MPEG-4 file format parser (a.k.a. the MP4 demuxer) suffers from an arbitrary memory overwrite vulnerability when using specially crafted (invalid) MP4 input files. If successful, a malicious third party could trigger execution of arbitrary code within the context of the VLC media player, or otherwise crash the player instance. Exploitation of the MP4 demuxer problem requires the user to explicitly open a specially crafted file. The user should refrain from opening files from untrusted third parties or accessing untrusted Web sites (or disable the VLC browser plugins), until the patch is applied. VLC media player 0.8.6e addresses these issues and introduces further usability fixes. The source code patch can be downloaded separately here: vlc-0.8.6-CORE-2008-0130.patch. Felipe Manzano and Anibal Sacco from Core Security Technologies are credited with the discovery of this security issue. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
