["https://www.videolan.org/videolan/partners.html"]
title = "Our partners - VideoLAN"
full_description = "The following is a list of individuals and/or companies experienced with multimedia and VideoLAN solutions. You may contact them for professional services to order. Videolabs is a company founded by VideoLAN members and is the current editor of the VLC mobile applications and one of the largest contributor to VLC. VideoLabs has a large experience on various Open-Source multimedia technologies on most platforms: desktop, server or mobile. VideoLabs can provide multimedia consulting, VLC support, VLC custom development and custom applications for most needs. VideoLabs also edits webservices around multimedia, including recommendation engines and image recognition software. OpenHeadend was founded by VLC co-founder and DVBlast and multicat main developer Christophe Massiot, and provides the broadcast industry with a modular platform allowing video stream reception, processing and recording. It also provides consulting services, and is the working force behind the open source flexible video framework Upipe. M2X is an ICT company that is specialized in using Open Source software for providing solutions to IT problem areas of Networking (wired or wireless), Embedded and Multimedia. M2X provides innovative solutions for these use cases through its experience in developing and integrating Open Source software like VLC and embedded linux in customer products. Such an experience would never have been born without the invaluable cooperation of our partners, on both technical and financial sides: The French ISP Free S.A.S hosts 3 of our servers in one of their datacenters near Paris. Free is also using VLC for their FreePlayer project. Gandi is a one of most popular registar in France and in Europe. Founded in 1999, and based in Paris and in London, it has had a long history of quality, proximity to people and decent prices. Gandi has always cultivated its difference and humanity and supports many projects following the VideoLAN's ideals. Gandi supports VideoLAN by managing their domain names and helping the VideoLAN association in various administrative tasks."
