["http://www.videolan.org/sa0703.html"]
title = "VideoLAN security advisory 0703 - VideoLAN"
full_description = "VLC media player's ActiveX plugin is prone to a recursive plugin release vulnerability when being used within specifically crafted websites. If successful, a malicious third party could use this vulnerability to overwrite memory zones and execute arbitrary code within the context of the VLC media player's ActiveX plugin (i.e. acquire local user privileges on the vulnerable system). Exploitation of this bug requires the user to visit a malicious crafted website using VLC media player's ActiveX plugin. The user may use VLC media player's Mozilla plugin for Mozilla Firefox or Seamonkey, which are not affected by this issue and provide the same features set. This vulnerability was discovered by Ricardo Narvaja (Ricnar) from the Exploit Writers team of Core Security Technologies. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
year_published = 2025
clearnet = "http://www.videolan.org/sa0703.html"
