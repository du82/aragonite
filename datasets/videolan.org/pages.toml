["https://www.videolan.org/support/faq.html"]
title = "Frequently Asked Questions - VideoLAN"
full_description = "Permission is granted to copy, distribute and/or modify this document under the terms of the GNU General Public License as published by the Free Software Foundation; either version 2 of the License, or (at your option) any later version. The text of the license can be found on the GNU website. VideoLAN is a non-profit organization, that produces and distributes free and open source software for video and multimedia purpose, released under Open Source licenses. It started as a student project at the French École Centrale Paris but is now a worldwide project with developers from everywhere and dozens of millions of people using VideoLAN's software. VLC is the official name of VideoLAN's main product, often named VLC. VideoLAN Client is an ancient name of this product. You might either contribute time, material, or money. You don't need to be a programmer to help us. We are also always needing some translators and designers. VideoLAN's developers come from all around the world and english is the only language they can use to communicate together. Although great care is given to the translation of VLC in various languages, maintaining translations of our website costs too much more time than we can afford. This mostly depends on your DVD drive. Testing it is usually the quickest way to find out. The problem is that a lot of newer drives are RPC2 drives these days. Some of these drives don't allow raw access to the drive untill the drive firmware has done a regioncheck. VLC uses libdvdcss and it needs raw access to the DVD drive to crack the encryption key. So with those drives it is impossible to circumvent the region protection. (This goes for all software. You will need to flash your drives firmware, but sometimes there is no alternate firmware available for your drive). On other RPC2 drives that do allow raw access, it might take VLC a long time to crack the key. So just pop the disc in your drive and try it out, while you get a coffee. RPC1 drives should 'always' work regardless of the regioncode."
