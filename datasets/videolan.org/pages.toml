["https://videolan.org/videolan"]
title = "Free Software and Open Source video streaming solution for every OS! - VideoLAN"
full_description = "The VideoLAN project is led by and composed of a team of volunteers who believe in the power of open source to rock the multimedia world. The VideoLAN non-profit organization has a committee and members that are part of the VideoLAN project. VideoLAN hosts many open source projects, related to multimedia, including the famous VLC. Check the list of projects. VideoLAN welcomes all contributions to the project! You can contribute time (development, documentation, packaging, tests, user support, ...), material or even money. See the contribution page for more information. We regularly attend computing events, like FOSDEM (Free-software and Open Source Developers European Meeting). We generally come back with some photos and stories. The project started as a student project at the French École Centrale Paris, in 1996. After a complete rewrite in 1998, it became Open Source, thanks to the agreement of the École Centrale Paris, in 2001. The project started to open up to developers outside of the École. It is now a worldwide project with developers from 40 countries. Since 2009, the project is completely separated from École Centrale Paris, and is driven by an autonomous non-profit organization. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
