["https://videolan.org/vlc/libvlc.html"]
title = "libVLC media player, Open Source video framework for every OS! - VideoLAN"
full_description = "libVLC is the core engine and the interface to the multimedia framework on which VLC media player is based. libVLC is modularized into hundreds of plugins, which may be loaded at runtime. This architecture provides great flexibility to developers (both VLC devs and devs consuming the library). It allows developers to create a wide range of multimedia applications using the VLC features. libVLC is a C library which can be embedded in your own applications. It works with most popular OS platforms, on both mobile and desktop. It is under the LGPL2.1 license. libVLC versioning is inherently tied to the VLC app versioning. The current stable major version of libVLC is version 3, and the preview/development version is version 4. A variety of programming language bindings for libVLC is available to use the library seamlessly in your chosen ecosystem. For matters related to the LibVLC APIs and the various bindings, join our LibVLC bindings Community Discord Server! You can just clone and run the sample and start from there. It is also a good way to learn how to implement and use specific LibVLC features in your applications. Test projects are also good for this. You can find in the following list links to ready-to-run code samples using the various LibVLC bindings. The Good Parts of LibVLC is the first book ever about LibVLC and the VideoLAN community. It presents the VideoLAN non-profit organization and dives deep into the LibVLC native library for developers and its usage on most platforms. This is a technical ebook for programmers and consultants who want to learn more about the LibVLC SDK. The ebook was published in September 2022. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
