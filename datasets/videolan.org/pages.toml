["https://videolan.org/developers/libdca.html"]
title = "libdca - VideoLAN"
full_description = "libdca is a free library for decoding DTS Coherent Acoustics streams. The code is written by Gildas Bazin and was based on the a52dec project. It is released under the terms of the GPL license. The DTS Coherent Acoustics standard (ETSI 102 114 v1.2.1), as published by the ETSI, is available here (look for DTS Coherent Acoustics). Right now, I am concentrating on finishing the implementation of the core part of the specification. The library should however already be quite useable. A few things are still lacking there but they should mainly affect low-bitrate DTS streams which don't seem that common anyway (some of the missing things are: Joint channels coding, Dynamic range, etc… - see the TODO file). None of the extensions (extra channels, 96/192kHz sample rates) have been implemented (and unfortunately the public standard provides only minimal information on them). Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
