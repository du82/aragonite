["http://www.videolan.org/press/2014-1.html"]
title = "Press Release - ConeCoin - VideoLAN"
full_description = '''The multimedia world evolves quickly, new codecs need more and more processing power to achieve higher compression rates with better quality. Yet tablets and smartphones are too small to go to the Ultra-HD level, and some old computers shouldn't be sent to trash just to see High-Quality videos. Seeing that VLC counts dozens of millions of users around the world and that many PC on which it runs have a lot of unused computing power, the VideoLAN Team has finished its work on a distributed codec named "CloudCodet" that could allow our most privileged users to help the other users decode their video. Imagine millions of computers all working together to make multimedia contents available to everyone! As a non-profit organisation, VideoLAN is unable to pay you real money, which is why, following the latest trends, the team is proud to introduce its own electronic money: ConeCoins! Every CPU cycle used to help other people decode their video and audio will be counted as "mining" and will earn you those ConeCoins. We will soon introduce a shop to exchange coins for goodies like T-shirts, mugs, traffic cones and chocolates! If everybody helps, we can make this connected world a more equal one! See you soon on the ConeMarket! Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov.'''
