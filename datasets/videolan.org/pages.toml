["http://www.videolan.org/security/sa1004.html"]
title = "VideoLAN Security Advisory 1004 - VideoLAN"
full_description = "VLC fails to perform sufficient input validation when trying to extract some meta-informations about input media through ID3v2 tags. In the failure case, VLC attempt dereference an invalid memory address, and a crash will ensure. In the failure case, VLC will dereference a memory address within the first page of its process virtual memory. In normal conditions, this will result in a segmentation fault (a general protection fault on Windows), and the process will terminate abruptly. This vulnerability alone is not sufficient for an attacker to execute arbitraty code or otherwise alter the flow of execution other than to crash the process. Exploitation of this issue requires the user to include a file in its playlist or to attempt to open it. The user should refrain from opening files from untrusted third parties or accessing untrusted remote sites (or disable the VLC browser plugins), until the patch is applied. VLC media player 1.1.3 addresses this issue. Patches for VLC media player 1.1.x and 1.0.x are available from the corresponding official VLC source code repositories. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
