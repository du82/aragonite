["http://www.videolan.org/security/sa0811.html"]
title = "VideoLAN Security Advisory 0811 - VideoLAN"
full_description = "When parsing the header of an invalid Real Media file an integer overflow might occur then trigger a heap-based buffer overflow. If successful, a malicious third party could trigger execution of arbitrary code within the context of the VLC media player. The user should refrain from opening files from untrusted third parties or accessing untrusted remote sites (or disable the VLC browser plugins), until the patch is applied. Alternatively, the Real demuxer plugin (libreal_plugin.*) can be removed manually from the VLC plugin installation directory. VLC media player 0.9.8a addresses this issue. Patches for older versions are available from the official VLC source code repository 0.9-bugfix branch. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
