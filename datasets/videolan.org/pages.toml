["https://videolan.org/press/ios34.html"]
title = "VideoLAN - Press Release - VLC for iOS 3.4 - VideoLAN"
full_description = "We have exciting news to share. VLC media player for iPhone, iPod touch, iPad and Apple TV will receive a major update on the App Store today! It will be available free of charge in any country, requires iOS 9.0 or later and runs on iPhone 4S, iPad 2nd generation, 1st generation iPad mini and Apple TV HD or any later device. Besides stability and performance improvements, this update adds support for CarPlay for iOS 14 and later, a new audio playback user interface and several new views for the audio media library including the artists and the albums. This update also adds new options such as bookmarks, customization of the seek duration, a feature allowing to play videos as audio only and the display of the album track numbers in the album view. Finally, Handoff integration allows easy access to the WiFi sharing feature from nearby Macs. As part of continued maintenance of the tvOS port, the Apple Remote's single click mode is now fully supported. Users can now contact the team more easily via the about section of the application through an email! VLC for iOS is fully open-source. Its code is available online and is bi-licensed under both the Mozilla Public License Version 2 as well as the GNU General Public License Version 2 or later. The MPLv2 is applicable for distribution on the App Store. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
