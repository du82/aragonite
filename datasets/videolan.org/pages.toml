["https://videolan.org/projects/dvblast.html"]
title = "DVBlast - Open Source fast DVB/ASI network streamer! - VideoLAN"
full_description = "DVBlast is written to be the core of a custom IRD, CID, or ASI gateway, based on a PC with a Linux-supported card. It is very lightweight and stable, designed for 24/7 operation. DVBlast does not do any kind of processing on the elementary streams, such as transcoding, or remultiplexing. If you were looking for these features, switch to VLC. It does not stream from plain files (have a look at multicat instead). The code is accessible from https://code.videolan.org/videolan/dvblast.git and you can browse the source online. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
