["https://videolan.org/security/sb-vlc3021.html"]
title = "VideoLAN Security Bulletin VLC 3.0.21 - VideoLAN"
full_description = "A denial of service through a potential integer overflow could be triggered with a maliciously crafted mms stream (heap based overflow) If successful, a malicious third party could trigger either a crash of VLC or an arbitratry code execution with the privileges of the target user. While these issues in themselves are most likely to just crash the player, we can't exclude that they could be combined to leak user informations or remotely execute code. ASLR and DEP help reduce the likelyness of code execution, but may be bypassed. The user should refrain from opening mms streams from untrusted third parties (or disable the VLC browser plugins), until the patch is applied. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
