["https://videolan.org/press"]
title = "Press center - VideoLAN"
full_description = "VLC media player for iOS, iPad OS and tvOS version 3.4 2022-05-03 The VideoLAN project and the VideoLAN non-profit are pleased to announce a another large mid cycle release of VLC for iOS, iPadOS and tvOS. More → VideoLAN supports the UNHCR 2022-10-24 VideoLAN is a de-facto pacifist organization and cares about cross-countries cooperations, and believes in the power of knowledge and sharing. War goes against those ideals. As a response Russia's invasion of Ukraine, we decided to financially support the United Nations High Commissioner for Refugees and their work on aiding and protecting forcibly displaced people and communities, in the places where they are necessary. s More → VLC media player for iOS, iPad OS and tvOS version 3.3 2022-03-21 The VideoLAN project and the VideoLAN non-profit are pleased to announce a large mid cycle release of VLC for iOS, iPadOS and tvOS. More → VideoLAN is 20 years old today! 2021-02-01 The VideoLAN project and the VideoLAN non-profit organization are happy to celebrate today the 20th anniversary of the open-sourcing of the project. More → Wikileaks revelations about VLC 2017-03-09 Following the recent revelations from Wikileaks about the use of VLC by the CIA, you can download the official statement from the VideoLAN organization here. More → Announcing VLC for Apple TV 2016-01-12 The VLC team is proud to announce the first port of VLC on the Apple TV! VLC on the Apple TV allows you to get access to all your files and video streams in their native formats without conversions, directly on the new Apple device and your TV. More → VLC media player 2.2.0 released 2015-02-27 VideoLAN and the VLC development teams are proud to publish a major new release of VLC. The 2.2.0 release of VLC media player for the desktop is coordinated, for the first time ever, with releases on iOS, Android (including Android TV), WinRT (Windows RT and x86) and Windows Phone. VLC runs everywhere! More → 2014-1 2014-04-01 Press Release about VLC distributed decoding and conecoin VLC starts a distributed codec and a new currency More →"
