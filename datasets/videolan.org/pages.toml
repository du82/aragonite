full_description = "x262 is a free software library and application for encoding video streams into the MPEG-2 compression format, and is released under the terms of the GNU GPL. x262 is an MPEG-2 encoder based on the best-in-class features of x264. It also has the big advantage that the codec is simple enough for people new to video-compression to get involved. The TODO list can be found here. A mailing list (x264-devel), and IRC (#x264@libera and #x264dev@libera). These are shared with the x264 project so remember to mention x262. Please report any bugs to the mailing list. If it is a crash, then compile x262 with ./configure --enable-debug and follow the ffmpeg bugreporting guidelines. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
