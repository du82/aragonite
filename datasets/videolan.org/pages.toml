["https://videolan.org/security/sb-vlc3019.html"]
title = "VideoLAN Security Bulletin VLC 3.0.19 - VideoLAN"
full_description = "Fix potential arbitrary code execution with system priviledges on uninstallation on Windows (!4292, CVE-2023-46814) If successful, a malicious third party could trigger an execution of an arbitrary binary on uninstallation of VLC with system priviledges. Exploitation of this issue requires the user to explicitly uninstall VLC using the provided uninstaller. The NSIS uninstaller vulnerability was reported by the Lockheed Martin Red Team (!4292, CVE-2023-46814). VLC 3.0.19 also bumps some dependencies, notably zlib and vpx, following the publication of CVE-2022-37434 and CVE-2023-5217. Legal | Report Trademark Abuse VideoLAN, VLC, VLC media player and x264 are trademarks internationally registered by the VideoLAN non-profit organization. VideoLAN software is licensed under various open-source licenses: use and distribution are defined by each software license. Design by Made By Argon. Some icons are licensed under the CC BY-SA 3.0+. The VLC cone icon was designed by Richard Øiestad. Icons for VLMC, DVBlast and x264 designed by Roman Khramov."
