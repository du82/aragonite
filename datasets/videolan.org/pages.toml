description = "We are pleased to release version 3.6.0 of the VLC version for the Android platform.It comes with the new Remote Access feature, a parental control and a lot of fixes. See our Android page."
full_description = '''We are pleased to release version 3.6.0 of the VLC version for the Android platform.It comes with the new Remote Access feature, a parental control and a lot of fixes. See our Android page. VideoLAN and the VLC team are publishing the 3.0.21 release of VLC today, which is the 22nd update to VLC's 3.0 branch: it updates codecs, adds Super Resolution and VQ Enhancement filtering with AMD GPUs, NVIDIA TrueHDR to generate a HDR representation from SDR sources with NVIDIA GPUs and improves playback of numerous formats including improved subtitles rendering notably on macOS with Asian languages. Additional details on the release page. This release also fixes a security issue, which is detailed here. We are happy to announce a major update of VLC for iOS, iPadOS and tvOS adding playback history, A to B playback, Siri integration, support for external subtitles and audio tracks, a way to favorite folders on local network servers, improved CarPlay integration and many small improvements. Today, VideoLAN is publishing the 3.0.20 release of VLC, which is a medium update to VLC's 3.0 branch: it updates codecs, fixes a FLAC quality issue and improves playback of numerous formats including improved subtitles rendering. It also fixes a freeze when using frame-by-frame actions. On macOS, audio layout problems are resolved. Finally, we update the user interface translations and add support for more. Additional details on the release page. This release also fixes two security issues, which are detailed here and there. We are happy to announce a major update of VLC for iOS, iPadOS and tvOS adding a new audio playback interface, CarPlay integration, various improvements to the local media library and iterations to existing features such as WiFi Sharing. Notably, we also added maintenance improvements to the port to tvOS including support for the Apple Remote's single click mode. See the press release for details. How to install Debian on the K230-CanMV, the first commercially available RISC-V board with support for the RISC-V "V" Vector extension.[...]'''
