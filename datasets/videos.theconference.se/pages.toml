title = "Indy Johar – The Need for a Boring Revolution - Video Archive – The Conference by Media Evolution"
description = '''
Indy Johar – The Need for a Boring Revolution      Indy Johar      Dark Matter Laboratories                  From The Conference September 07, 2018            "When we create a precarious society, fear becomes a very powerful political device."In order to build, create and maintain a sustainable future, we need to start a boring revolution. Believing that talking only about the cool parts of science (like AI, new technology and robots) is not going to help us form this revolution. We need to go back to basics. We need to go over things like bureaucracy, governance och the principles of democracy to create trust. Without this trust simple things go wrong. Democratizing the means of production and innovation is all about building towards a counsciousness. We need to empower people in order to form a new type of government. We need to reinvent the concept of governance, and we need to do it now. To have this, as it were, “boring” conversation is really critical.'''
