description = '''
Johanna Koljonen – Closing Remarks      Johanna Koljonen                        From The Conference September 01, 2023            Johanna Koljonen closes 2023's The Conference with a recap how we as participators have tried to move away from oppositional binaries but  also reflects that how these binaries also work as an aid to understand the world. Not only that, we are also able to shift and remix the the meanings of these opposites. Remembering a recent conversation at The Conference where she got to question "what is professionalism?" she suggests that maybe we, when we allows us to be human, discovers a lot useful skills we can use in what we do. If we can celebrate our differences, our personal stories and backgrounds in our work life maybe we also find new perspectives and tools to create the change we wish to see.'''
