["https://videos.theconference.se/dan-shefet-from-shifting-systems"]
title = "Dan Shefet from Shifting Systems - Video Archive – The Conference by Media Evolution"
description = """
Dan Shefet from Shifting Systems      Dan Shefet      Tech & Human Rights Lawyer                  From The Conference September 03, 2024            What connects Leonardo DiCaprio with the Grateful Dead, a 16th century Dutch diplomat, and a tech CEO recently arrested in a French airport. To answer we have to zoom out and look back. Ten years after three days ago, the last decade of the old millennium, revolutionary 1789, and further back still. Where did we come from and where are we going?Dan Shefet is a lawyer, specialising in European law and Human Rights as they apply to tech. Dan highlights the critical junctures where domestic law and fundamental rights intersect, points of conflicts catalysed by the explosive growth of tech and the international high seas of cyberspace. Are social media sites responsible for the content they host? At which point does the right to be forgotten contravene the right to free speech? And what about Leo? Spanning centuries, Dan’s talk demonstrates the necessity of understanding our past in order to answer the questions that shape our future."""
