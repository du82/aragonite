description = '''
Ahd Kamel – Odd Camel from The Magic Kingdom      Ahd Kamel      Filmmaker & actress                  From The Conference September 07, 2018            "I didn’t want to fight for my already god-given right to live."This highly personal talk start with actress and filmmaker Ahd Hassan Kamel telling us about her hometown Riyadh in Saudi Arabia (or, as Ahd calls it, the Magic Kingdom). She walks us through childhood traumas and events that has shaped and changed the course of her life so far, with death and rebirth as two constants. She tells us about being broken down and about trying to put her life back together again. It’s a wonderful feat of storytelling, as well as a testament of how you can break stereotypes and make your mark in the world.'''
