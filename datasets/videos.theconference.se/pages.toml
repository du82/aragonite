["https://videos.theconference.se/jemma-foster-listening-to-and"]
title = "Jemma Foster – Listening to and Dreaming with Plants - Video Archive – The Conference by Media Evolution"
description = """
Jemma Foster – Listening to and Dreaming with Plants      Jemma Foster      Founder of Wild Alchemy Labs / Co-founder of Semantica                  From The Conference September 03, 2024            ”What future will we dream when we dream with plants?”Jemma (she/her) is an artist, writer and curator working with plant intelligence and vibrational medicine. If you wonder what plants sound like – check out this talk. After a guided visualisation, where we imagine going back to a state of being before our human form – we see ourselves as plants. But what is your texture, your aroma – as a plant?Jemma believes we can design futures beyond our perceived limitations if we engage with more-than-human life. Plants make up 87% of life on our planet, so why shouldn’t we listen to them? There is proof that plants have agency, not only intelligence – they are active. By not listening to them we risk abusing them, which will ultimately lead to us abusing ourselves. Jemma encourages you to ask yourself what you're not hearing or seeing. There is so much to learn when we don’t even fully comprehend our own consciousness as humans. When we start to include all forms of life, we begin to see that we have been guilty of ”brain chauvinism” for much too long. It's time to change."""
