["https://videos.theconference.se/john-de-la-parra-decoding-the"]
title = "John De La Parra -  Decoding the Magic and Mystery of our Food - Video Archive – The Conference by Media Evolution"
description = """
John De La Parra -  Decoding the Magic and Mystery of our Food      John De La Parra      Director of the Food Initiative at the Rockefeller Foundation                  From The Conference September 03, 2024            “As we eat food we are consuming things that we don’t even know what’s in there, because they are unknown and we don’t even know where to look for them.”What really makes up the food we eat? Dr. John De La Parra (he/him) invites us to decode the magic and mystery of our food, challenging the conventional ways we understand its composition and impact. He argues there is a deep knowledge often overlooked when we rely solely on the scientific data provided by traditional nutrition labels and composition databases. The reality is that our food contains thousands of complex chemical compounds, each with different properties and effects on our bodies. Plants, he explains, are constantly producing unique compounds as a defense mechanism, many of which have surprising benefits for human health. These secondary metabolites add layers of mystery and magic to what we consume daily.By understanding the complex chemistry of our foods and the effects of agricultural practices, we can create a more just and informed global food system that benefits both health and the environment."""
