Dr. James Beacham – What's outside the universe?      Dr. James Beacham      CERN                  From The Conference August 30, 2019            Dr. James Beacham is a particle physicist searching for answers to the biggest open questions of physics using the largest experiment ever, the Large Hadron Collider at CERN. He hunts for dark matter, gravitons, quantum black holes and dark photons as a member of the ATLAS collaboration, one of the teams that discovered the Higgs boson in 2012. He ended The Conference 2019 with a science class out of this world and a reminder of that to physics – we're all the same."""
