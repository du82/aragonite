["https://videos.theconference.se/dr-katlyn-turner-paradigms-of"]
title = "Dr. Katlyn Turner – Paradigms of Waste, Equity and Consumption  - Video Archive – The Conference by Media Evolution"
description = '''
Dr. Katlyn Turner – Paradigms of Waste, Equity and Consumption       Katlyn Turner      Research Scientist at the MIT Media Lab                   From The Conference September 03, 2024            Katlyn’s talk digs deep into a critical question: "How did we get here?" She challenges us to confront a deeply embedded paradigm—the "Twin Transition" of sustainability and digitalization.She covers three aspects. First, she critiques how we define environmental impact as caused by CO2, ignoring the other serious issues this oversimplified focus creates. It’s a convenient narrative that silences dissenting voices, labeling them "anti-climate."Then she asks, "Who really benefits?" and exposes the power dynamics at play—who’s included, who’s excluded, and who’s left with the waste. And finally she ask, “If we shifted this system to its idealized end state - full “green” and digital transition - what is its vision? She leaves us with a haunting thought: Even if we achieve a full "green" digital utopia, who decides what's acceptable? Sometimes the truth is uncomfortable, and maybe we need to sit with that discomfort, face the complexity, and—most importantly—be honest.'''
