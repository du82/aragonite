description = """
Dr. Daisy Ginsberg – Designing Nature      Dr Alexandra Daisy Ginsberg      Artist                  From The Conference September 07, 2018            “Better is not the same as good, better hasn't an agenda.”What is better? Who’s better? Who decides? The design of living matter can be seen as synthetic biology, a way of engineering biology for a better world. Could synthetic biology create life to save the environment? Daisy Ginsberg guides us through research done into the past to help us see what we value the most in the future. By using synthetic biology we can evoke a feeling of loss. Humans dream about better. But “better” isn’t the same as good and changes all the time. What better do we want?"""
