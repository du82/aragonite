["https://viderationale.blog/2024/05/04/quantum-path-to-the-multiverse"]
title = "Quantum Path to the Multiverse – Vide Rationale"
description = "I am more or less convinced that you and I live in a multiverse. Which means that you live alongside copies of yourself living in parallel realities. Some of them very much identical to you, differing only in trivial details, but some starkly different from you for having made different choices. There are worlds, then,…"
full_description = "May 4, 2024 Quantum Path to the Multiverse I am more or less convinced that you and I live in a multiverse. Which means that you live alongside copies of yourself living in parallel realities. Some of them very much identical to you, differing only in trivial details, but some starkly different from you for having made different choices. There are worlds, then, where you’ve woken up just a second later than you did today, worlds where you became a marine biologist specialising on octopuses, worlds where you’re the sole dictator king of the world, and worlds where you never came to be. This strange conclusion appears almost inevitably by clearly interpreting the mathematical formalism of the best, most accurate scientific theory, that humanity has ever discovered: Quantum Theory. Just like how Einstein’s General Relativity told us that we live in a four dimension space-time continuum that twists and warps near heavy objects, Quantum Theory tells us we live in a collection of parallel realities, each of which keeps branching into never-to-interact-again worlds every time two atoms collide. Admittedly, this is a minority position among physicists. Partly because it sounds insane but partly because of some bad philosophy that infested the minds of the pioneers of quantum theory in the early decades of the 20th century. The mathematical formalism, though complex, was fully comprehensible. But nobody understood what it was saying about the real world. And then, among others, Bohr, Heisenberg, and Pauli enforced a rule of not asking too many questions about the underlying reality claiming that it’s meaningless to speak of such things. Einstein, who didn’t buy any of that nonsense, put up a good fight but eventually lost the debate. The physics community moved on without him, declaring victory and hailing quantum theory as a complete theory in need of no modification. History wrote that Einstein became too old and lost the radical energy with which he discovered relativity and couldn’t cope with this mysterious (but true) new theory. In reality, he was one of the only sane voices. The more popular way of reading the maths called the Copenhagen interpretation is where much of the spookiness of quantum mechanics comes from. It says, for instance, that an isolated electron exists at many places at once, but only when you don’t look at it. When you do look at it, you only ever find it at one particular spot. This view is hard to accept on at least two counts (i) it seems preposterous that the nature of reality radically alters when you, the observer, looks at it, and (ii) what counts as looking (measurement) is never defined clearly The most obvious conclusion was that we’re missing something. What’s really going on when we’re not measuring? And how can something be in many places at once? But these inquiries were fervently shunned. They said the proper role of science is to predict reality and describe what we can say about reality, not to explain what reality actually is. They said the theory does those just fine. This view is still popular today, and it’s disparagingly (and sometimes proudly) called the shut-up-and-calculate interpretation of quantum mechanics. This philosophical (rather than scientific) view of what science can and should say was dogmatically enforced. The obvious objections to the Copenhagen interpretations were dismissed as being illegitimate, for the quantum world, they said, does not admit of reason and logic the way classical objects do. This structurally immunised them from any mode of criticism. It is true that quantum theory is strange. It is indeed not compatible with common sense, but that doesn’t mean it has to read as complete nonsense. It is explicable and the mathematical formulation isn’t a mere tool for prediction, it is a map of the reality. Just a very different kind of reality. The Case of Schrödinger’s Cat To make it visceral just how strange the emerging theory of quantum mechanics was, Erwin Schrödinger devised a clever thought experiment where the weirdness at the microscopic scale escapes into a macroscopic environment. He imagines a cat in a steel chamber along with a small amount of radioactive substance that may or may not decay one of its atoms in the next one hour. If it decays, there’s a contraption that triggers a hammer which shatters a flask of hydrocyanic acid that will kill the cat. According to quantum theory, since we don’t know whether that atom decays or not, it exists in a superposition of decayed and not decayed, and since the chamber is sealed and we can’t see what happens to the cat, the cat too exists in a superposition of being alive and dead. Mind you, it is not that the cat is either alive or dead and that we merely don’t know which one. No, the theory says that the cat is both alive and dead at the same time. That is until we open the box and make a “measurement”, at which point it becomes either alive or dead. And what is it like from the cat’s point of view? Well it simultaneously has a point of view and does not have one; conscious and unconscious at the same time. The purpose of the thought experiment wasn’t to enthral you with this new discovery of how wonderfully strange the quantum world is, it was to call bullshit on this nonsense that was being peddled as a complete theory of reality. Double Slit Experiment Why did they have to come up with such a theory? Well, before there were the theories, we observed quantum phenomenon that defied any classical explanation. On such observation is the double slit experiment of electrons. When you pass a beam of electrons through a small pair of parallel slits, instead of seeing a silhouette of the slits of two distinct bands, you see a series of bands called an interference pattern. This pattern is only observed in waves typically; we see the same pattern when you pass light through these slits, and you can even see it if you drop two pebbles on water. This made people wonder: if the electrons coming out of the two slits interfere with each other then was it some sort of wave? were we mistaken to think they were particles? Astonishingly, when you pass the electron through the slits one by one, such that it can only ever go through a single slit and thus not be able to interfere with anything, it still produces the interference pattern. Not in a single shot — a single shot of electron only creates a single blip on the screen — but the superimposed image of all the blips give you an interference pattern. It’s as though the electron went through both slits at the same time and interfered with itself (strange). To check if it did indeed go through both, you can keep a measuring device near the slits, and it records that it goes through only one of the slits in each try but then lo and behold the interference pattern also disappears! This is utterly weird. It seemed to go through both slits and create an interference pattern but when we check if it indeed went through both slits it just goes through one and the interference pattern also vanishes. What? Sketching the Theory In classical mechanics, a state of a system is defined by it’s position, velocity, and the forces acting on it, and Newton’s laws of motion tell you how it evolves through time. Similarly, in quantum mechanics, you have a wave function which represents the state of a system and Schrödinger equation tells you how it evolves through time. Our trouble starts at the very beginning for we have an equation describing how a function changes with time without knowing what the function maps to in reality. When Schrödinger came up with it he himself thought it was supposed to represent a charge density of sorts. He hoped that electrons would occur as sharply localised highly dense points of charge, so that to a macroscopic observer it would appear as a particle. But when you let the equations unravel in time, such a localised charge would just keep diffusing and spreading everywhere. When you actually tried to measure a quantum system, there was indeed no wave-like object be found. Instead what you saw were particles in a specific location. Repeating the experiment with the same initial set up gives you a different location of the particle every single time. But if you measure again quickly the particle is always in the same spot it was first seen in. It was Max Born who gave the wave function its first interpretation. He said that the square of the wave function gives you the probability of finding an electron at a given point in space. And this wave function collapses when you make a measurement. Given how we’ve just observed wave like behaviour in the interference experiment perhaps a wave function describing the electron might seem like an apt fit, but truth is we have no idea just how it’s supposed to describe the electron. Electrons are point particles; the Schrödinger equation describes a continuous field of probability. How do we bridge these two things? Many Worlds Interpretation There’s a simple way of resolving it: all of the positions of the electrons are real, they are just in separate worlds. This view was first proposed by Hugh Everett in 1956 in his PhD thesis. To describe this better, let’s consider another quantum property called the spin of an electron. It’s okay to imagine it as the literally clock-wise and anti-clockwise rotation of an electron (though that’s strictly not true). One of those is called spin-up and the other spin-down. When you don’t measure the spin, since it’s a quantum property, it exists as as superposition of spin-up and spin-down states. When you make a measurement, you only see either. According to Everett, that just means that in two different worlds you saw spin-up and spin-down separately, and you just happen to be in one of the worlds. Similarly, the cat is both alive and dead at the same time because they’re in separate worlds. Two version of you, in two different universes, each opened the chamber to find a dead cat and an alive cat. The primary mistake, in Copenhagen interpretation, was in thinking that the observer and the apparatus were classical objects to which quantum mechanical properties did not apply. In reality, however, classical properties are mere approximations of quantum properties and everything is ultimately quantum mechanical in nature. It’s just that most of the quantum effects are not perceivable at macro levels; the equations describe macro objects just the same. Indeed, there’s only one wave function that describes the whole universe. But systems inside the universe that are isolated from the rest of the universe can be thought of as having a wave-function of its own. But soon as two such systems interact, it’s new description is given by the combined wave function of the two, and the two systems subsequently evolve together. This is called quantum entanglement. In the case of schrodinger’s cat what really happens is that the moment the atom decays and hits part of the apparatus, it becomes entangled with it, which is itself entangled with the entire rest of the world. The universe splits and in one case the cat is dead and in the other case the cat is alive, by opening the box, you just find out which world you’re in. This notion of becoming entangled with the environment, and consequently losing quantum (wave-like) properties, is called decoherence. Fungible Universes While it explains how wave seems to collapse without adding a separate postulate, there are a few problem with Everett’s interpretation. First, it does not physically explain how it is that, when a world splits into two, there can be different probabilities of finding yourself in one rather than the other. Second, Everettian interpretation still does not speak of what is described by the wave function in physical reality and how it is that electrons (particles) come to have wave-like behaviour. Proponents like Sean Carroll say that the electron is a wave function. At least when not measured. And its dynamic properties like position and velocity come into existence through decoherence. This view is a classic example of confusing the map for the territory; to say that the wave function is the electron is to conflate a mathematical structure with physical reality. In 1985, the physicist David Deutsch made his own brilliant additions to the theory, which in my view finally completes the many worlds interpretation. You are to imagine the multiverse not as collections of separate worlds, like orbs in some meta-space, but worlds that are coinciding with each other. When the universe comes into being, it starts off with an infinite number of coinciding worlds, all alike exactly. More importantly, it’s a collection of fungible worlds — and this fungibility is at the very core of quantum mechanics. Fungibility is a property of a collection of items by which you can’t meaningfully differentiate between different instances of them. An example is money. If you have ten dollars in your bank account and I transfer ten more dollars just for safe-keeping, there’s no sense in asking which ten dollars is mine and which is yours. The same also applies for energy; if I eat some protein and some carbs and gain some energy and then dissipate half of it by working out, it makes no sense to ask where exactly dissipated energy came from. Universes can also be fungible. And when there are multiple copies of fungible universes, it makes no sense to ask which one you are in, just like it makes sense no sense to ask which dollar is yours. When a quantum system like an electron or series of electrons are isolated from the rest of the world, the rest of the world can remain completely identical to each other. If something from the outside interacts with the quantum system, it’ll be affected differently in different universes, and this information will start spreading rapidly since every small interaction creates a chain of causation that ever so slightly affects everything around it. This wave of differentiation spreads very fast — at most at the speed of light. So it’s not that the universe literally splits into multiple universes. All the universes already exists, including an infinite number of fully identical fungible ones. Some of them just become differentiated when differential outcomes of quantum events escape outside of its isolation. And how often does this branching happen? Well, at least every time two atoms collide anywhere in the universe. When two atoms collide, there are multiple outcomes on how it’ll deflect off of each other, and it’s determined quantum mechanically. The different paths after the collision affect everything around it differently and branches the universe. This happens pretty much everywhere all the time, creating a staggeringly large number of branches. So large in fact that pretty much anything you can think of, all the ways in which the world could have been, has happened in some universe. Truth about Electrons Ther"
