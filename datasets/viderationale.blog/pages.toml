["https://viderationale.blog/2023/06/25/my-blogging-principles"]
title = "My Blogging Principles – Vide Rationale"
description = '''Inspired by Julia Evan's post "Blogging principles I use" I also started thinking about how I want to write. So here's the list of principles that I aspire to live up to. Captivating If it's boring or obvious, it doesn't deserve to be a blog post. You're not writing documentation, and you're not writing a…'''
full_description = 'June 25, 2023 My Blogging Principles Inspired by Julia Evan’s post “Blogging principles I use” I also started thinking about how I want to write. So here’s the list of principles that I aspire to live up to. Captivating If it’s boring or obvious, it doesn’t deserve to be a blog post. You’re not writing documentation, and you’re not writing a text book. You’re writing a small self-contained piece of work that captures the reader’s attention so well that they read it all in one go. So my most important principle is that it should be interesting. It should surprise you. Accuracy At least don’t knowingly write things you’re not sure about without qualifying your uncertainty. Don’t confidently say false things. Do the extra work to make sure you can justify every word you write. Beauty Style matter too. A blog is not just a collection of pure medium-less ideas. It’s always served in a language. There’s infinite room for artistic expression here, and this largely determines how your readers feel reading your blog. Making it pleasant and fun to read goes a long way. Clarity This is a non-negotiable point for me. Writing must be clear. There should be no ambiguity whatsoever in your words. If the reader is re-reading your sentences because it didn’t make sense or because it was hard to parse, you’ve failed. It is your job to make sure that there’s little to no delay between them reading it and understanding it, no matter how complex the subject matter is. Writing clearly also forces you to think clearly. It’s just too easy to deceive both yourself and your readers into thinking that you understand what you’re talking about. Don’t fall for it. Jargon-free Readers shouldn’t be left guessing what a particular word means. If you want to introduce jargon, make sure to explain it first. ———— And now, here are some things I don’t care about too much Usefulness Maybe I’ll change my mind about this, but for now, I don’t care that my blog posts are particularly useful. I mostly care that they’re interesting. I know this goes against some popular advices, so time will tell whether I’m going stand by this. Originality This is a high bar. You can’t hope that all your blogs have original ideas, that’s too much pressure. It’ll only serve to cripple you. There’s still value in reading and digesting information from various sources and telling a cohesive story. There’s still value in breaking down and simplifying a confusing concept. There’s still value in explaining a known idea in an interesting and novel way. Of course original ideas are better than all of them, but they’re just hard to come by and it’s not wise to limit yourself like that. The important thing is you write a lot, as much as you can, and original ideas will automatically show up from time to time. And that’s good enough. If you’re an aspiring blogger/essayist/non-fiction writer, and you can’t find a way to start or keep up the momentum, my advice is to just keep writing and stop caring about quality. It doesn’t have to be perfect, and it’s never going to be as brilliant as you imagine it in your head. And it doesn’t matter too. Only thing that matters, for now, is that you get the first million words out of you as fast as you can. You’ll only reach your potential after that. So hurry! And all the best! I hope to read them one day. Related Article: Good Writing, Bad Writing , How To Write Non-Fiction Share this:TwitterFacebookLike Loading… Musing Posted by:Mridul «Previous Post Next Post» Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Recent Posts Don’t Blame Marx for What Stalin Did Quantum Path to the Multiverse How AI can Transform Education AI Will Never Be Conscious How to Make Spectacular Chicken Cutlets Newsletter Type your email… subscribe'
