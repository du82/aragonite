title = "Theory of Information – Vide Rationale"
description = "Today I want to talk about Information. It might not seem like an interesting topic, but I assure you it's worth your attention. I'm trying to pin down exactly what it is. And it's a little more complicated than you might think. We first notice that information appears in many forms. If we look at…"
full_description = 'June 29, 2023 Theory of Information Today I want to talk about Information. It might not seem like an interesting topic, but I assure you it’s worth your attention. I’m trying to pin down exactly what it is. And it’s a little more complicated than you might think. We first notice that information appears in many forms. If we look at protein synthesis in the human body, we see proteins are constructed using information in the DNA strands; your speaker reads information in its input electrical signals and emits music as output; your processor uses the information of images and movies and softwares in your hard-disk to display it on a screen. The same information may be available as a book, or an audio, or as a digital document. It is thus substrate independent. Yet it also always requires some sort of medium. No such thing as pure formless information; it’s always found etched into some physical matter. We also notice the notion of information becomes relevant only when we try to simplify a description or explanation. Any interaction between two systems can be described purely in terms of the physical elements in play; for instance, we might describe the speaker emitting sound purely in terms of the mapping between frequencies, voltages, amplitudes of waves, tone etc. Further, we know that the physics altogether doesn’t care about it. As far as physics is concerned, the behaviours and properties of a system can be fully accounted for using the laws of physics without reference to any notion of Information. Information, then, seems to be just some useful abstraction. Something to aid in our understanding of things, instead of being one of its fundamental constituents. Except (some) physicists do use information in their day job in a more fundamental way. You might know about this phenomenon which Stephen Hawking discovered where all the information in a physical object gets permanently destroyed if it falls into a Black Hole. Well turns out they’re using the term slightly differently. What a physicist means when they say information is the state of a system. If you have a physical system and you knew everything about it, like it’s mass, shape, chemical constituency, electrical charge, etc., such that you given those values you could predict or explain everything about it, these constitute information that’s implicit to the system. Let’s call it Intrinsic Information.Every physical system has Intrinsic Information. It’s the thing that gets destroyed when it falls into a Black Hole. And in addition, they may also contain what I’d more appropriately call Coded Information (which is what I called just “Information” in the beginning). The electrical signals to the speaker both contain Intrinsic Information about its voltage, energy etc. but it also contains Coded Information of the song that it’s transferring. Unlike Intrinsic Information, Coded Information is not an objective quantity. It’s dependent on the thing that’s reading it. For example the transcription process (first step of protein synthesis) considers DNA as a sequence of numbers in base four. We can map each of the molecules of DNA to digits like this: Adenine-0, Guanine-1, Thymine-2, and Cytosine-3. So that a given sequence of DNA strand can be written down as “0132113000121103”. But you could certainly imagine another reader that doesn’t differentiate between Adenine and Guanine, and between Thymine and Cytosine, so that the information becomes a sequence in base two. The same sequence from earlier would now change to “0011001000010001” (we map both “0” and “1” to “0”; “2” and “3” to “1”). The physical matter didn’t change, but the information changed, because the reader changed. Coded Information is thus subjective, reader-dependent. And because of this, pretty much any system can essentially store pretty much any information so long as it has the granularity to actually store them. Which is to say, if you can build a hypothetical reader that can measure the different parts of your system and differentiate between them, you can build a custom idiosyncratic reader that can read pretty much anything out from a particular storage. You can imagine, for example, a digital image composed of many pixels that are either black or white, but without any noticeable patterns emerging from them. It’s just noise. Seemingly there is no meaningful information here. But suppose you had a reader which takes as input all the pixels and its positions, and as an output produces a different image by converting each pixel with custom rules such that the resulting image is that of a black & white apple. Then it’s as though the original image did contain a apple in it; it just needed the right reader to bring it out of it. A different reader could have read an image of a baseball bat out of it. All Coded Information starts off as Intrinsic Information. We get it by a process of discarding irrelevant details and making transformation to them (also known as abstraction). For example, we can start off with the full state of the collection of molecules in the DNA strand (Intrinsic Information), and we abstract out only a base four sequence (Coded Information). We drop details about it’s shape, chemical properties, and the number of quarks in each of its electrons, because for transcription they’re not essential. The infinite richness of Intrinsic Information is slimmed down to the bare-bones that’s relevant for the particular description. And lastly, we see that Intrinsic Information and Coded Information, while being somewhat unrelated on the outset, are nevertheless closely tied together. Coded Information is this subjective, substrate independent, almost not-real thing, which nevertheless appears everywhere in our discourse. And we produce it only through the abstraction of Intrinsic Information, which is something that’s altogether different, something that’s objective and implicitly present in all matter. Yet Intrinsic Information has to be stored as Coded Information before we can do anything with it, including explaining, sharing, or talking about it. Before we (or anything) can start to understand it, it’ll have to take the shape of Coded Information. It is precisely the transfer of Coded Information which we call communication to begin with. In this way, the two types of information are deeply linked. You really can’t appreciate one without the other. Anyways, I’m not sure if all this was at all clear, maybe I will try to articulate it better in a later blog post. Like I said in the beginning, it’s not how it looks, information is pretty complicated. Share this:TwitterFacebookLike Loading… Musing Posted by:Mridul «Previous Post Next Post» Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Recent Posts Don’t Blame Marx for What Stalin Did Quantum Path to the Multiverse How AI can Transform Education AI Will Never Be Conscious How to Make Spectacular Chicken Cutlets Newsletter Type your email… subscribe'
