["https://vidmar.net/blog/nikar-s-helikoterjem-na-servis"]
title = "Nikar s helikopterjem na servis • David Vidmar"
description = """
Pred nekaj dnevi se mi je pripetilo to, česar se ljubitelji elektronskih in digitalnih naprav najbolj bojimo. Moj zvesti modrozobi zvočnik je po letih seljenja iz sobe v sobo, po mnogih potovanjih, zabavah, piknikih in dopustih odigral zadnjo pesem. Po zadnji petkovi pica zabavi se njegova baterija ni več napolnila.
Pričakoval sem, da bo zvočniku sveža baterija vrnila moči, a po dolgem brskanju po spletu se je izkazalo, da ne bo tako enostavno."""
full_description = "Nikar s helikopterjem na servis Objavljeno 2. May 2021 4 minute branja Pred nekaj dnevi se mi je pripetilo to, česar se ljubitelji elektronskih in digitalnih naprav najbolj bojimo. Moj zvesti modrozobi zvočnik je po letih seljenja iz sobe v sobo, po mnogih potovanjih, zabavah, piknikih in dopustih odigral zadnjo pesem. Po zadnji petkovi pica zabavi se njegova baterija ni več napolnila. Pričakoval sem, da bo zvočniku sveža baterija vrnila moči, a po dolgem brskanju po spletu se je izkazalo, da ne bo tako enostavno. Namesto da bi kupil ceneni kitajski nadomestek originalne baterije, ki mogoče ne bi delovala, sem moral narediti nekaj, česar že dolgo nisem. Napravo sem odnesel na servis. Doživetje ob obisku servisa je bilo vse to, česar si ne želimo. Skrite med garažami zgornje Šiške sem obiskal v pravem snežnem metežu, se najprej namučil z iskanjem parkirnega mesta in nato še vhoda. Za pultom me je pričakal možakar, ki mu je bilo težko dvigniti pogled in odpreti usta, da bi povedal več kot besedo, kaj šele, da bi me pozdravil, vsaj ozdraviti ali se celo nasmehnil. Namesto da bi ga prijetna jazz glasba v delavnici do vrha napolnjeni s kakovostnimi avdiofilskimi napravami spravila v dobro voljo, ga očitno vleče nekam drugam. Že ko mi je obljubil, da me bo poklical že čez dan ali dva, da mi pove, kako lahko rešimo zvočnik, mi je bilo jasno, da se to ne bo zgodilo. Diagnozo sem dočakal čez dobra dva tedna, vsake nekaj dni sem ga poklical, da mi je odrecitiral himno serviserjev: »Vas pokličem čez dan, najkasneje dva.« Zvočnika ne bodo popravili, saj se ne izplača, menjava okvarjenih delov bi stala preveč. Menda se je poleg baterije življenja naveličala še neka elektronika, povezana z baterijo. Zdaj me akustično delujoči, a klinično mrtev zvočnik čaka na servisu, da ga odpeljem domov, postavim na oltar odslužene elektronike in ga ob naslednji selitvi vržem proč. Pa ne v navadne smeti, jasno. Praktično hkrati se je, niti ne na drugem koncu sveta, temveč na drugem planetu, dogajala povsem drugačna zgodba. Na Nasinem majhnem helikopterju Ingenuity, ki trenutno čepi nekje v puščavi kraterja Jezero na Marsu, so zaznali napako, ki so jo opazili pri preizkusnem zagonu. Do danes nismo izvedeli, ali gre za napako njegovega strojnega dela ali pa za pravo programsko napako. V nobenem primeru helikopterja ne bo treba vrniti v Nasin laboratorij ali peljati v Šiško na servis. Novo programsko opremo, ki je težave že odpravila, so namestili na daljavo, približno 280 milijonov kilometrov daleč. Precej dlje kot je Šiška, v snegu ali soncu. Vrednost Teslinih delnic ne raste, ker so njihovi avtomobili mehansko kaj posebnega, ampak zato, ker so njihovi avtomobili bolj podobni pametnim telefonom kot passatom. Ne samo zaradi baterije, ki je srce avtomobila, temveč zato, ker jih venomer posodabljajo, pa čeprav so posodobitve včasih precej nesmiselne in dodajajo le nove igrice. A te igrice navdušujejo uporabnike skoraj tako kot »avtopilot«. Applove ure, Googlove telefone in še kakšne naprave naložijo na kontejnerske ladje veliko prej, kot je njihova programska oprema gotova, preizkušena in delujoča. Se bodo že posodobile, ko jih bodo uporabniki prvič registrirali. Kasneje pa bodo dodali še kakšno funkcijo ali dve, na katero ob snovanju strojne opreme niti pomislili niso. Posodobitve pa ne prinašajo samo novih ikon in igric. Pametni ventili na radiatorjih našega družinskega stanovanja so se prejšnjo sezono nadgradili in prinesli možnost tišjega delovanja. Kar tako. To je posebej osrečilo psa, ki zdaj ne skoči več pokonci, ko se ventili zvečer zaprejo. Še pred vsega nekaj leti smo se programskih nadgradenj bali in jih izvajali enkrat letno, ko je bilo podjetje ustavljeno in ostali zaposleni na kolektivnem dopustu. Takrat so sistemci ponosno oznanjali svoj moto »ne nadgradi, dokler deluje«, ki danes velja za slab izgovor za lene računalničarje. Vsa resna podjetja imajo danes povsem drugačno miselnost in zagovarjajo nenehne nadgradnje, ki se izvajajo čim pogosteje. To prinaša več dela, a še več prednosti. Gradijo tudi vojsko navdušenih uporabnikov, ki imamo občutek, da smo pomagali sprogramirati novi iOS in Minecraft in se bomo do smrti kregali, da je najboljši. Veseli nas tudi, da lahko uporabljamo najnovejšo različico prej kot ostali. In če nam hitre nadgradnje niso dovolj, lahko uporabljamo tudi nedokončane različice programske opreme. Microsoft nas vabi, da preizkušamo Okna, Pisarno, Xbox, Edge in mnoge druge programe. Apple več mesecev pred letnim izidom nadgradenj operacijskih sistemov te v ponuja razvijalcem in smrtnikom v preizkus. Na Steamu lahko kupimo (!) igre, ki sploh še niso končane, pravi navdušenci pa vsak teden nadgrajujejo svoj Minecraft strežnik z novim »snapshotom«. To, da se ta sesuva vsake 15 minut, jih skoraj ne moti, saj se sam ponovno zažene in igra teče dalje. Tako, še Windowse »reštartam«, tablico »apgrejdam«, potem pa skočim na Rudnik poslušat, kateri zvočnik bom izbral. Kupil ga bom tako in tako na daljavo. Še dobro, da imam na telefonu in uri zadnjo beto, da me bo telefon prepoznal tudi, ko bom v trgovini na obrazu imel masko. Članek je bil objavljen tudi v reviji Monitor. Photo by Nicolas Lobos on Unsplash. Znački: Mnenje, Monitor"
