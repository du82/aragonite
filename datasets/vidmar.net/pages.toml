V človeški naravi je, da z nostalgijo gledamo na spremembe v preteklosti, a prihodnost si, kljub poplavi poslovnih in tehnoloških vizionarjev ter umetnikov, ki v zgodbah in slikah rišejo prihodnost, težko predstavljamo in jo vedno znova podcenjujemo."""
full_description = "Trgovanje ali šport? Objavljeno 2. Sep 2021 4 minute branja Staršem res ni lahko. Če nas ob pamet ne spravljajo ocene in šola, nas skrbi za zdravje mladine ob pretirani rabi naprav, potem nas doleti še virus, ki je kot ustvarjen, da bodo mladi še več za računalniki ter manj na svežem zraku in z vrstniki. Zdaj pa se zdi, da bi vsi radi še trgovali. V človeški naravi je, da z nostalgijo gledamo na spremembe v preteklosti, a prihodnost si, kljub poplavi poslovnih in tehnoloških vizionarjev ter umetnikov, ki v zgodbah in slikah rišejo prihodnost, težko predstavljamo in jo vedno znova podcenjujemo. Vedno znova pozabljamo, da se vsakič, ko se prihodnost zgodi, ustvarijo nove, drugačne priložnosti, ki pa jih resda spremljajo nove nevarnosti. Za marsikoga je takšna prihodnost tukaj in nekateri jo že živijo. Namesto da bi hodili v službe, kot vsi pošteni in normalni ljudje, izvajajo neke nove oblike dela, ki jim le težko rečemo delo. V mislih imam spletne zvezde Youtuba, Instagrama, Tiktoka ali Twitcha, predvsem tiste, ki »streamajo« svoje dogodivščine med igranjem računalniških iger ali pokra, branjem, plesanjem, ali pa tiste, ki na splet pošiljajo posnetke, ko počnejo kaj manj spodobnega. Mnogi se nad njihovim početjem zgražajo, drugi se pogosto sprašujemo, ali ne bi bilo pametno zapreti službenega prenosnika in se jim raje pridružiti. Če zmorejo oni, zakaj ne bi še mi? Kako težko je sploh lahko? Po zadnji veliki svetovni finančni krizi se je že zdelo, da vlagateljev, predvsem mladih, delnice in drugi finančni instrumenti ne bodo več pritegnili, vsaj ne v takšnem obsegu, kot pred krizo. A tudi na področju investiranja je digitalizacija prinesla nov zagon. Zdaj že večletna norija okrog bitcoina in drugih digitalnih kovančkov je naučila trgovanja novo generacijo in zdaj se ta generacija vlagateljev seli tudi na tradicionalne trge ter spletne platforme. Možnost (skoraj) brezplačnega sodelovanja na finančnem trgu na skrajno enostaven način, s svojega telefona, kupovanje le delčka vrednostnega papirja in brezplačni posli so tista draž, ki je pred zaslone prikovala sveže množice in ustvarila nove milijonarje. In z njimi horde tistih, ki jih skrbi, da bo zares vsakomur dostopno finančno trgovanje pahnilo njihove bližnje še stopnico niže, še bliže propadu. Mogoče bodo kapitalistični finančni trgi res pahnili svet s tečajev, a za to ne bodo krivi najstniki, ki so začeli vlagati svojo težko prihranjeno žepnino. Mnogi opazovalci novih načinov služenja denarja, ki je hkrati zabava, početju nasprotujejo. Največkrat trdijo, da gre preprosto za igro na srečo, in te so škodljive. Kritike navajeni igralci, pardon, vlagatelji, jim odgovarjajo, da delnice, podjetja in kovance prek spleta analizirajo, raziskujejo trge in iščejo skrite diamante ter z njimi služijo. Da se zavarujejo tudi tako, da tveganja razpršijo in da je trgovanje nujno potrebno, da se izniči učinek inflacije. Jasno pa povedo, da svojega početja ne vidijo kot igre na srečo, ampak igro znanja. Nekako tako kot igranje pokra. Debata, ki jo poznamo že desetletja in se ne bo prav kmalu končala. Obe strani imata svoj prav. Pri pogledu s strani pa je mogoče videti še en pogled – pri trgovanju gre za draž izzivanja usode, ki je ravno zato tako zabavno. Če se ga lotimo z glavo, si postavimo primerne cilje, omejitve in se ustrezno zavarujemo, smo pri početju lahko precej varni in mirni. Povsem enako bi lahko zapisali za marsikatero drugo priljubljeno početje, recimo kolesarjenje. Tako na kolesu kot finančni tržnici. Finančno trgovanje se spreminja v šport. In ta že dolgo ni več namenjen samo zdravemu načinu življenja, predvsem je mnogim v zabavo, sprostitev in ventil. Če ga igramo varno, bo peščici prinesel slavo in bogastvo, najbolj nespametnim poškodbo ali bankrot, veliko večino vmes pa zamotil, ko bodo po spletu iskali namige, se na Youtubu poglabljali v poročila in analizirali nove tehnike. Na koncu bodo kdaj slavili in se kdaj jezili, vmes jim bo pa povzročal skrbi. Za nekoga je zabava trgovanje, za drugega pa »investicija« v nekaj tisoč evrov vredno kolo. Takšno, kot ga zares ne potrebuje prav noben amater. Tistih nekaj sekund boljši rezultat na amaterski dirki ne more upravičiti takšnega vložka, a uporabnika osreči in med uporabo prestavi v sanjski svet, stran od dnevnih skrbi. Še huje, trgovalec bo verjetno na koncu nekaj zaslužil, kolesar bo finančno skoraj gotovo vedno v minusu. Nimam pregrešno dragega kolesa, še manj zavidljivega portfelja. A honorarje od mnenj in člankov v Monitorju vedno dajem na prav poseben kupček. Občasno z njimi kupim kaj, česar ne potrebujem, skoraj nikoli to ni »pameten nakup«. Včasih celo prepričam urednika, da bi bilo ta nakup vredno opisati v reviji, in začarani krog je sklenjen. Mimogrede: upam, da bo honorar od tega prispevka prispel še pravočasno, da kupim delnico Appla, še preden izdajo novi MacBook Pro s procesorjem M2. Ti bodo gotovo delnico poslali v nebo! Z dobičkom bi spomladi rad kupil še eno kolo. Članek je bil objavljen tudi v reviji Monitor. Photo by Cedrik Wesche on Unsplash. Znački: Mnenje, Monitor"
