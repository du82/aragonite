["https://vidmar.net/blog/gostilne-pridejo-in-grejo"]
title = "Gostilne pridejo in grejo • David Vidmar"
description = """
Po mnenju nekaterih uporabnikov Twitterja ta od dneva, ko ga je kupil Elon Musk, gori. V resnici je Twitter še vedno dostopen in povsem normalno deluje, uporabniki lahko še vedno objavljamo in beremo vsebine.
Elonov brezkompromisni stil vodenja, del katerega je navidezno transparentno komuniciranje prek tvitov na osebnem računu, nekatere zagrizene uporabnike plaši in straši, spet druge navdušuje. Prvi grozijo z odhodom in razmišljajo o alternativah ter k temu pozivajo še druge, a zgodi se bolj malo."""
full_description = "Gostilne pridejo in grejo Objavljeno 1. Apr 2023 4 minute branja Po mnenju nekaterih uporabnikov Twitterja ta od dneva, ko ga je kupil Elon Musk, gori. V resnici je Twitter še vedno dostopen in povsem normalno deluje, uporabniki lahko še vedno objavljamo in beremo vsebine. Elonov brezkompromisni stil vodenja, del katerega je navidezno transparentno komuniciranje prek tvitov na osebnem računu, nekatere zagrizene uporabnike plaši in straši, spet druge navdušuje. Prvi grozijo z odhodom in razmišljajo o alternativah ter k temu pozivajo še druge, a zgodi se bolj malo. Podobno dogajanje smo v preteklosti videli že večkrat. Odmevne so bile akcije, ki so po Zuckerbergovih incidentih uporabnike prepričevale, naj iz protesta odidejo s Facebooka. Tudi v Sloveniji smo se šli #deleteFacebook, a ob vsaki taki pobudi se je izkazalo, da je šlo za veliko dima, a zelo malo ognja. Uporabnikov je na Facebooku še vedno dovolj, mamice še vedno z veseljem objavljajo slike svojih sončkov z zaključne prireditve glasbene šole, očetje pa zavistno gledajo druge očete na predragih kolesih in si pošiljajo stare šale. Mladine na Facebooku ni, vsako sezono se prestavijo na drugo omrežje, da jim oglaševalci sploh ne utegnejo niti slediti. Po vseh grožnjah in strahovih je Elon Twitterju nedavno zadal dva nekoliko drugačna udarca. Sprva je zelo omejil dostop do vmesnikov API, s katerim lahko do vsebin na omrežju dostopajo računalniški programi. To pomeni, da so nehale delovati bolj ali manj vse neuradne Twitter aplikacije, kot sta Tweetbot in Twitterific na Applovih napravah ali Fenix na Androidu. Te so precej bolj izpiljene in zmogljive kot uradna in imajo zelo zveste uporabnike. Poteza je bila pričakovana, a je vseeno presenetila in razburila uporabnike in razvijalce, saj je Twitter dobesedno čez noč spremenil pravila igre in Twitter elito pustil v šoku. Če je še nekaj dni kazalo, da bi se zaplet utegnil rešiti, so, kot da bi bili dogovorjeni, avtorji najvidnejših aplikacij svoje izdelke ukinili in umaknili iz trgovin z aplikacijami. Nekaj dni kasneje je novi lastnik Twitterja napovedal, da bo API-dostop za (ro)bote, orodja in ostalo programje mogoče uporabljati le ob plačilu. To pomeni, da bodo nehali delovati računi, ki so vsebine objavljali samodejno, denimo novičarski portali in razni ustvarjalci (npr. @PepitoTheCat), nehala bodo delovati analitska orodja, orodja za lažje branje vsebin in še marsikaj. Brez podatkov bodo ostali znanstveniki in drugi raziskovalci. Težava teh dveh potez je, da sta Elon Musk in podjetje Twitter s to potezo ujezila svoje najvidnejše in najvrednejše uporabnike (na Instagramu bi jim rekli influencerji). Tiste tviteraše, ki vsebine ustvarjajo, da jih ostali lahko beremo, lajkamo in retvitamo, tiste, zaradi katerih smo tam sploh ostali. Če izginejo ti, ki jih radi beremo, potem nimamo na Twitterju kaj početi. Ostali bodo le še tisti, ki se prepirajo, žalijo in grozijo. Točno tisti, zaradi katerih se je Twitter znašel v težavah pri oglaševalcih in zaradi katerih se prerekamo o svobodi govora, osebni svobodi in vsem povprek. Gotovo se bodo nekateri zabavni, poučni, smešni in navdihujoči ustvarjalci prestavili kam drugam. Namiguje in nakazuje se, da bi to lahko bilo omrežje Fediverse oziroma Mastodon, a tudi če Mastodonu uspe, da postane splošno uveljavljen in se bodo tja prestavile korporacije, podjetniki, umetniki, ki jim ni mar za razprtije, to ne bo naslednji Twitter. To bo nekaj novega, drugačnega. Stanje na Twitterju me spominja na klasično slovensko zgodbo »o uspehu«. Slišal jo je že vsak, ki ima znanca ali prijatelja, ki mu je uspelo ustvariti uspešno gostilno ali lokal, a prostor ni bil njegov. Skoraj univerzalno se nadaljuje tako, da lastnik prostora opazi, da se dogaja nekaj dobrega, da priljubljenost raste, kuje se dobiček in zasrbijo ga prsti. Sprva dviguje najemnino, ki postane nekakšen davek na uspeh, nato pa v svojem pohlepu oceni, da bi bilo najbolje pobrati čisto vse in si zaželi kar sam postati (uspešen) gostinec. Toda ljudje ne hodimo v gostilne, kavarne, slaščičarne in druge lokale zaradi lastnika. Obiskujemo jih zaradi ostalih gostov in vzdušja, ki ga pričarajo, ko uživajo v hrani, pijači in dobri družbi. Vzdušje z nespametnimi potezami hitro spraviš iz ravnotežja, ostanejo le prazni prostori in napis nad vrati. Ko odidejo gostje in se zamenjajo kuharji in natakarji, lokal nikoli več ne more biti enak. Kaj bomo naredili uporabniki, če se enako zgodi na Twitterju? Bomo odšli na Mastodon? Se spet naročili na RSS-sezname in novičarsko pošto? Ali pa nas bo srečala pamet in bomo namesto visenja na napravah raje manj časa preživeli v digitalni gostilni in večkrat našli čas za skok na kolo ali bližnji hrib? Mogoče celo za čisto pravi bife. Objavljeno tudi v reviji Monitor. Znački: Mnenje, Monitor"
