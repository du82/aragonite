["https://vidmar.net/blog/miti-o-racunalnikih-mac"]
title = "Miti o računalnikih Mac • David Vidmar"
description = """
Če razmišljate, da bi prešli v konkurenčni tabor in Wintel računalnik zamenjali z elegantnim in zmogljivim Macom, je tu nekaj argumentov za in proti. Pridobljenih iz prve roke.
Apple je konec leta 2020 predstavil novo generacijo naprav z lastnim procesorjem M1 z arhitekturo ARM, ki jih je z navdušenjem sprejelo tržišče, navdušili pa so tudi naše uredništvo. Naprave z Applovimi paradnimi procesorji imajo odlične zmogljivosti in zelo nizko porabo energije, hkrati pa je cena osnovnih modelov znosna, če vsaj če jih primerjamo z najboljšimi izdelki s procesorji AMD/Intel/Windows iz sveta PC, oz."""
full_description = "Miti o računalnikih Mac Objavljeno 2. Apr 2023 13 minut branja Če razmišljate, da bi prešli v konkurenčni tabor in Wintel računalnik zamenjali z elegantnim in zmogljivim Macom, je tu nekaj argumentov za in proti. Pridobljenih iz prve roke. Apple je konec leta 2020 predstavil novo generacijo naprav z lastnim procesorjem M1 z arhitekturo ARM, ki jih je z navdušenjem sprejelo tržišče, navdušili pa so tudi naše uredništvo. Naprave z Applovimi paradnimi procesorji imajo odlične zmogljivosti in zelo nizko porabo energije, hkrati pa je cena osnovnih modelov znosna, če vsaj če jih primerjamo z najboljšimi izdelki s procesorji AMD/Intel/Windows iz sveta PC, oz. Wintel. Kako težko je dolgoletnemu uporabniku Microsoftovega operacijskega sistema Windows zamenjati znano okolje in se preseliti v Mac OS? Po enem letu vidimo prednosti, pasti, pa tudi nasvete, ob katerih je bolje le zamahniti z roko. 5 razlogov zakaj z Oken preiti na Mac Glavni razlog, da so Applovi računalniki, še posebej prenosniki, mamljiv nakup, sta že omenjena Applova procesorja M1 in novejši M2. Procesorja omogočata, da so naprave, ki jih poganjata, izjemno hitri in odzivni in da njihova uporaba bolj spominja na uporabo mobilnih telefonov kot računalnikov. Računalnik lahko uporabljamo takoj, brez čakanja na prebujanje, kot smo ga vajeni pri računalnikih PC. Sodobni Maci so izjemno varčni pri rabi energije, z izjemno dolgo avtonomijo in se le malo segrevajo. Modeli prenosnikov Air sploh ne premorejo ventilatorjev za hlajenje, ostali modeli pa ventilatorje zaženejo sila redko, le pod največjimi obremenitvami. V naprave so vgrajene tudi druge odlične komponente. Zasloni so odlični, v visoki ločljivosti, imajo odlično svetilnost in barvno natančnost. Prenosniške tipkovnice so prijetne za tipkanje, z dovolj velikim hodom tipk, da bodo zadovoljila tudi zahtevnejše uporabnike. Vsebujejo velikansko sledilno ploščico, ki je precej bolj natančna in uporabna, kot v večini prenosnikov Wintel. Zelo solidna sta tudi spletna kamera in mikrofon, v modelih Pro pa navdušujejo zvočniki, ki predvajajo glasbo in zvok s presenetljivo močjo in razponom. Nakup prenosnika iz Applove družine izdelkov je seveda posebej mamljiv za vse, ki že uporabljajo drugo jabolčno napravo, najpogosteje je to iPhone. Applov ekosistem omogoča deljenje in sodelovanje naprav, ki mu ni para. Tako lahko na prenosniku opravljate telefonske klice in pošiljate sporočila ter enostavno prenašate podatke med svojimi napravami. Če telefonska aplikacija nima namenske različice za Mac OS, jo lahko na prenosniku poganjate kar kot mobilno ali tablično aplikacijo. Teoretično to z aplikacijami Android zmorejo tudi Windows, toda bolj ali manj le teoretično. Eden izmed glavnih razlogov za uspešnost Applovih naprav je pozornost do podrobnosti, ki jo poskuša posnemati marsikatero podjetje. Izdelki že na pogled in dotik delujejo kakovostno, prestižno in pogosto ekskluzivno. S prenosnikom z jabolkom ste v marsikateri (vendar ne vseh) družbi enostavno »cool«, čeprav vas bodo nekateri morda videli kot vzvišene snobe. Lep primer oblikovalske odličnosti je priključni kabel, ki je pri večini prenosnikov le navaden kabel, pri Applovem prenosniku pa je opremljen z magnetnim priključkom MagSafe, za katerega so občasno na voljo celo programske nadgradnje. Applove naprave so vedno veljale za drage in precenjene. Čeprav so še vedno med dražjimi, se njihova vrednost pokaže v dolgotrajni uporabi, saj so zaradi uporabe kakovostnih komponent uporabne dlje. Naprave, ki so stare več let, se še vedno posodabljajo, so varne in udobne za uporabo in dobro obdržijo ceno. Marsikateri lastnik se lahko pohvali, da ima še vedno uporabi deset ali več let star Applov računalnik. 5 mitov, zakaj je preskok težak Prehod z Oken na Mac ni enostavna reč. Na začetku se zdi, da je prav vse drugače, da je vse slabo. Vendar s pravo pomočjo in nekaj vztrajnosti spoznamo, da je marsikaj drugače, vendar ni nujno, da je slabše ali boljše – je preprosto drugače. Zato ne obupajte prehitro! Mnogi vam bodo rekli, da boste na Macu potrebovali novo programsko opremo. V letu 2023 to večinoma ni res. Na voljo so vsi priljubljeni brskalniki, kot so Chrome, Edge, Firefox in Opera. Ti so na pogled podobni in delujejo enako ali vsaj zelo podobno kot na Windows, zato s prehodom ne bo težav. Na voljo so tudi programi za klepetanje in sestankovanje, kot so MS Teams, Slack in Zoom, in prav vsi po vrsti na sodobnem Macu delujejo enako (ali celo bolj) gladko kot njihove različice na Oknih. Razlog je v tem, da so procesorji M1 in M2 resnično dobri pri poganjanju spletnih programov, tudi kadar tečejo na namizju vsa opisana zbirka je takšna. Na voljo je tudi Microsoftov Office, orodja podjetja Adobe, DropBox, OneDrive in cela paleta Googlovega programja. Če se pri kakšnem specifičnem programu, ki je na voljo samo za Okna, že zaplete, lahko uporabite virtualizacijo operacijskega sistema Windows s programom Parallels ali pa se na daljavo povežete z računalnikom, kjer program teče. Prav tako ni res, da morate zamenjati vse zunanje naprave, kot so tipkovnice, miške, tiskalniki ali celo monitorji. Verjetno boste za priklop obstoječe tipkovnice potrebovali USB razdelilnik (hub), saj boste na Applovih računalnikih zaman iskali »stara« vrata USB-A, vendar to velja za marsikatero sodobno napravo. Brezžične miške je najlažjepriključiti, če uporab ljajo Bluetooth, sicer lahko zagato reši USB hub ali celo monitor ali tipkovnica, ki imata vgrajena dodatna vrata USB. Tudi pri monitorjih ni vse črno, Mac bo sliko prikazal na vsakem, ki ga boste priklopili na vrata HDMI ali USB-C. S sliko utegnete biti manj zadovoljni, če monitor ne bo imel ločljivosti vsaj 4K. Trdovraten mit pravi, da celo datoteke niso združljive! Datoteke, ustvarjenje v Oknih (ali drugem operacijskem sistemu), bodo čisto lepo delovale tudi na Mac OS, ne glede na to, za kakšno vrsto datoteke gre in ali ste jo med računalniki prenesli s ključkom USB, preko oblačne shrambe ali si jo poslali po elektronski pošti ali preko spleta. Če boste datoteke in mape prenesli z Applove strani na Okna, utegnete s seboj prinesti tudi datoteke .DS_Store. Te vsebujejo metapodatke o mapi, zelo podobno kot na Windows imenikih skrita datoteka Desktop.ini. Obe lahko brez skrbi spregledate ali izbrišete, saj nista povezani z vašimi podatki. MMarsikateri uporabnik se Macu raje izogne, saj na njem ne moremo igrati iger. Ta mit le deloma drži. Izdelki neodvisnih izdelovalcev iger, pa tudi tisti iz velikih hiš so na voljo tudi za Applov operacijski sistem in Applove naprave. V okoljih, kot je Steam, lahko preverite, katere vaše igre delujejo le na Windows in katere ne. Res je, da je sodobna igričarska scena zgrajena okrog računalnikov združljivih z Okni, vedno bolj priljubljene pa so storitve, ki ponujajo igranje v oblaku. Te seveda popolnoma zabrišejo mejo med Windows in Mac in delujejo na obeh sistemih identično. 5 težav, s katerimi bo treba živeti Prvi dnevi uporabe Maca in operacijskega sistema MacOS, če ste pred tem leta odpirali Okna, dvoklikali Raziskovalca in prenašali datoteke in besedilo s kombinacijo tipk Copy & Paste, bodo živčna vojna. Za začetek uporabnik, ki je vajen »navadne« tipkovnice, je, da so imena tipk, kjer bi morale biti spreminjevalne tipke Ctrl, Alt in Windows, precej drugačna. Druga razlika pa je ta, da delujejo drugače. Pecejevska tipka Alt na Macu postane tipka ⌥ Option, Ctrl oz. Control se spremeni v ⌘ Command, tipke Windows ni, pojavi pa se ⌃ Control, ki je manj uporabna in je še najbolj podobna desnemu kliku. Marsikdo bo pogrešal tudi tipko Delete, ki je na Applovih tipkovnicah enostavno ni. Njeno funkcijo opravlja kombinacija tipk Fn in vračalke ⌘ Backspace. Manjkajo tudi tipke Page Up, Page Down, Home in End. Namesto teh se bo potrebno navaditi kombinacij smernih tipk in tipke Fn. Obstajajo različni načini, kako si lahko prilagodite delovanje tipk tako, da bodo bolj spominjali na Okna, vendar to pot odsvetujemo. Namesto sprememb se je bolj preprosto sprijazniti z razlikami in se jim prilagoditi. Če boste Maca kupili v Sloveniji, bodo na tipkovnici tudi tipke za priklic slovenskih znakov, a če smo pred leti godrnjali, da nas Apple sploh ne prizna, nas trenutno prizna le na četrtino. Kot pri telefonih, prevoda operacijskega sistema v slovenščino ni, vprašanje, če ga bomo kdaj dočakali. V sistem je sicer vgrajena slovenska tipkovnica, a ima vsaj dve veliki in moteči posebnosti – za vnos afne moramo pritisniti kombinacijo ⌘ Command + ⇧ Shift + 2, še več prilagajanja pa zahteva dejstvo, da je vgrajena slovenska tipkovnica vrste QWERTY namesto QWERTZ, kar pomeni, da sta tipki Y in Z zamenjani. Rešitev te zagate je več – uporabite lahko hrvaški razpored, ki vsebuje opcijo »PC« ali pa namestite eno izmed mnogih nastavitvenih datotek, ki jih je prispevala skupnost uporabnikov. Te izvirajo iz skupnosti jabuk.si in legende slovenskih Apple uporabnikov, Jonasa Ž. Ne glede na izbrano pot vas čaka nekaj prilagajanja, priporočamo pa tudi vodiče za najbolj uporabljene kombinacije tipk … Če boste na Macu uporabljali miško, boste hitro spoznali, da je tudi mišji svet obrnjen na glavo. Smer, v katero drsamo sledilno ploščico in smer, v katero vrstimo kolesce na miški za premikanje vsebine na zaslonu, sta namreč obratna od tiste na Windows, čeprav Apple tej nastavitvi pravi »naravna«. Mislim, da ne poznam nikogar, ki bi se uspel prilagoditi tej nenavadnosti, rešitev zagate pa je sila enostavna namestitev enega izmed mnogih programčkov, na primer Logi Options, MOS ali Mac Mouse Fix, ki omogoča »obratno« delovanje miškinega kolesa, kot je znano vsem uporabnikom Windows. Nekateri izberejo še enostavnejšo, a bolj kontroverzno pot ne uporabljajo miške in jo povsem zamenjajo z drsno ploščico. In trdijo, da so vseeno učinkoviti. Tudi upravljanje z okni je na Macu precej drugačno, če smo navajeni sistema Windows. Namesto bližnjice Alt + Tab lahko na Mac OS uporabimo ⌘ Command + Tab in preklopili bomo lahko na drugo aplikacijo. Ampak pozor, tako ne bomo preklopili na drugo okno aplikacije! Prav ste prebrali, Mac privzeto preklaplja samo med aplikacijami, za preklop med okni ene aplikacije, pa je uporabna nekoliko obskurna kombinacija ⌘ Command + . Veliko sreče pri iskanju te kombinacije tipk na Macovi slovenski tipkovnici. Rešitev je namestitev brezplačnega programčka AltTab, ki prevzame kombinacijo tipko ⌥ Option + Tab in s pritiskom prikliče uporabnikom Oken dobro znan način preklapljanja med okni. Tudi pri zapiranju oken in aplikacij je Mac drugačen. Namesto kombinacije tipke Control ali Alt in F4, na Macu pritisnemo ⌘ Command + W za zapiranje trenutnega okna, ⌘ Command + Q za zapiranje trenutne aplikacije. Težava je, da Macovsko kombinacijo tipk precej lažje pritisniti nenamerno, kar se vam bo gotovo kdaj pripetilo. Če boste pogrešali bližnjice za premikanje in postavitev oken ali pa lepljenje oken z robovom ekrana, lahko namestite namenske programe, kot so Magnet, BetterSnapTool ali Rectangle. Za redne uporabnike Microsoftovega Outlooka imamo dve novici dobro in slabo. Dobra je ta, da je Outlook na voljo tudi za Mac OS, slaba pa ta, da to enostavno ni Outlook, ki ga poznate. Manjkajo mu napredne funkcije, kot so Smart Actions, gumb za hitro pripenjanje datotek in mnoge druge funkcije, ki ste se jih navadili. Vzpodbudno je, da Microsoft razvija modernejšo različico, ki pa je zaenkrat združljiva le s Microsoftovimi poštnimi strežniki Exchange v oblaku, torej znotraj Office 365 oz. Microsoft 365. Verjetno je oskubljena različica Outlooka glavni razlog, zakaj večina podjetij, ki prisega na računalnike Mac, raje uporablja Googlovo pisarno, kot Microsoftovo, saj je uporabniška izkušnja na Macih v primeru Microsoftovega Outlooka resnično slabša. Tudi Microsoftova pisarna, torej predvsem Word in Excel so na Mac OS drugačni od svojih bratrancev na Oknih. Največja nerodnost za vse, ki pišejo besedila v slovenščini, je gotovo ta, da je v Office for Mac Microsoft »pozabil« vključiti slovenski črkovalnik. Drži, da je mogoče namestiti slovar, ki bo težavo nekoliko omilil, a rešitev je polovičarska. Če brez Worda, Excela in drugih pisarniških programov enostavno ne morete, je rešitev (nakup in) namestitev rešitve Parallels, ki bo omogočila, da boste na Macovem drobovju in zaslonu uporabljali programje, ki sicer teče na Windows. Od nedavno Parallels teče tudi na procesorjih M1 in M2. Enostavnejša rešite pa je, da vsaj takrat, ko potrebujete črkovalnik, uporabljate spletno različico Microsoftove pisarne. Če je alternativa Googlova pisarna, ta ideja sploh ni tako nezaslišana. 5 mitov, zakaj je Mac boljši kot PC Zagovornikov jabolčnih naprav, ki so na svoje naprave ponosni, vas bodo v svoje svet vabili tudi z argumenti, ki Applov svet opisujejo kot raj na zemlji. Tako vas bodo prepričali, da je uporabniška izkušnja popolna, da so operacijski sistem in programje vrhunsko oblikovani in da je vse res perfektno. Pa ni. Applov sloves izdelovalca vrhunske opreme temelji na zares odlični strojni opremi, pri programju pa se jim rado zatakne. Tudi MacOS ima hrošče, zastarelo oblikovane kose operacijskega sistema in druge pomanjkljivosti, ki jih je težko razumeti. Poleg tega so, vsaj na področju oblikovanja, uporabniške izkušnje in stabilnosti, Okna v zadnjih letih naredila velikanski korak naprej. Marsikoga jezi, da se Okna spreminjajo, a hkrati se zdi, da so trenutno le bolj sodobno oblikovan MacOS z več naprednimi in uporabniku prijaznimi zmožnostmi. Vsak uporabnik Oken se boji računalniških virusov. Zgodbe in izkušnje iz časov luknjastega programja so preveč strašne in boleče, da bi jih pozabili, pa čeprav je danes za večino zapletov z neželeno programsko opremo kriv uporabnik in ne računalnik. Nekoč je bil glavni argument v prid Applovim napravam podatek, da za MacOS sploh ne obstajajo protivirusni programi, kar danes ne drži več. Tudi na Macu vam lahko izsiljevalski virus zašifrira vse datoteke, če boste sami namestili in pognali zlonameren program. Enako kot v Windows. Tržnica programov na iOS je za Apple izjemno donosna. Po drugi strani v Microsoftovo tržnico programja Windows zaide malokdo. Macova je torej veliko boljša, mar ne? Ne drži, tudi v App Store na MacOS boste našli le del programov, ki bi jih želeli, hkrati pa je ta trgovina polna čudaškega programja, ki se mu je verjetno bolje ogniti. Nekatere programe za Mac OS boste morali prenesti in namestiti sami, za tretje pa bo potrebno pognati celo ukazno vrstico. Za marsikoga je to prednost, spet drugim stres. Vsekakor se upravljanje programskega dela ekosistema na Oknih in MacOS ne razlikuje prav veliko, oba sta svetlobna leta od enostavnosti in priročnosti tržnic mobilnih naprav. Marsikoga pred nakupom Applovega računalnika skrbi asketskost (ali skopuškost?) oblikovalcev pri dodajanju razširitvenih vrat. Drži, marsikatera naprava se zna z Macom povezati brezžično, a v vsakdanjem življenju enostavno ne bo šlo brez razširitve v obliki razdelilnika USB, ki so na voljo v mnogih oblikah in cenovnih razredih. Omogoča"
