["https://vidmar.net/blog/32-razlogov-zakaj-potrebujem-velik-monitor"]
title = "32 razlogov zakaj potrebujem velik monitor • David Vidmar"
description = """
Povsem mogoče je, da v času, ko berete ta članek, delate od doma. Upam, da ne buljite v prenosnik na kuhinjski mizi, ampak da ste si uredili domačo pisarno, kot se šika. Takšno z velikim monitorjem, ki vas bo naredil bolj produktivne, in s takšnim, kot ga vaša družina tudi zasluži.
V domači pisarni sem tik pred spomladanskim obdobjem delal od doma in nadgradil domači računalnik. Predvsem mladež je nad njim navdušena, saj brez težav poganja tudi zahtevnejše igre."""
full_description = "32 razlogov zakaj potrebujem velik monitor Objavljeno 5. Nov 2020 5 minut branja Povsem mogoče je, da v času, ko berete ta članek, delate od doma. Upam, da ne buljite v prenosnik na kuhinjski mizi, ampak da ste si uredili domačo pisarno, kot se šika. Takšno z velikim monitorjem, ki vas bo naredil bolj produktivne, in s takšnim, kot ga vaša družina tudi zasluži. V domači pisarni sem tik pred spomladanskim obdobjem delal od doma in nadgradil domači računalnik. Predvsem mladež je nad njim navdušena, saj brez težav poganja tudi zahtevnejše igre. Za Minecraft (z vsemi modifikacijami tega sveta) bi prisegel, da občasno celo zazeha. A nekaj mu manjka. Pa ne govorim o svetleči tipkovnici in miški ter ohišju z velikimi mavričnimi ventilatorji, o katerih sanja najmlajši. Gotovo nisem edini, ki je seštel ena in ena in začel razmišljati, da bi bil gromozanski, ukrivljen monitor zelo uporaben za delo in šolo od doma, ker na žalost ni prostora za dva zaslona. kot sem ju navajen v službi, pa še ob večerih bi televizija lahko bila prosta, ker bi na njem lahko v miru pogledal kakšen šport ali film (ali odpeljal kakšen krog s Formulo 1). Ko sem pred tedni namignil uredniku, da me zelo zanima kašen preizkus velikega, ukrivljenega in sploh dobrega igračarskega monitorja, sem imel v mislih ravno ta scenarij – kako bi bilo, če bi si na račun dela od doma v družinskem proračunu izboril fond za velik zaslon. Ko je Jure pred vrati uredništva s prstom pokazal na škatlo, me je, iskreno povedano, zaskrbelo. Da je 32-palčni monitor v veliki škatli, sem si predstavljal, a da je v tako veliki, da jo komaj spraviš v nepospravljen prtljažnik karavana, pa vendarle ne. Med vožnjo sem premišljeval, ali mi ga bo sploh uspelo postaviti na svojo veliko mizo, na katero se 24-palčnik prav idealno poda. V uteho mi je bila tudi misel, da je škatla verjetno tako velika, ker je monitor pač ukrivljen in drugače ne more biti. Bo že šlo. Še z nekaj drugimi vrečkami v rokah sem pridrsal z veliko škatlo do stanovanja in kot nalašč srečal tri sosede, ki so mi vsak posebej čestitali za nakup, jaz pa sem hitel razlagati, da nisem tako neodgovoren, da bi si kupil tako igračo in da ga imam samo na testu, saj veste, za Monitor, kjer občasno kaj objavim. Po nasmehu sem vedel, da jim je vse jasno. Po vsem tem sem ga nameraval tisti večer pustiti ob steni predsobe, da ne bo preveč vsega za en dan. Toda otroci so bili preveč navdušeni nad številoma« pikslov krat pikslov« in skoraj toliko »hercev« in celo množico logotipov igračarskih funkcij, ki so se bleščali s škatle v predsobi, da bi zdržali do naslednjega dne. Pogled z razdalje dobrih dvajsetih centimetrov na ukrivljeno površino diagonale 32 palcev, na kateri sveti 3,686.400 svetilnih točk hkrati, je impozanten. Ko mi je končno uspelo razplesti vse kable HDMI, USB, DVI in potem še malo kablov USB in sem lahko z mize končno umaknil stari monitor in kepe prahu za njim, je napočil trenutek za odpiranje škatle, montažo podstavka in strmenje v polprosojne obročke, kul nalepke in mnoge svetleče dodatke, ki so se skrivali v škatli. Večina jih je ostala točno tam, sanjalo se mi ni, kaj naj z njimi. Monitor pa je v vsej svoji veličini žarel (dobesedno, čeprav še ni bil priklopljen na PC!) na Ikeini mizi, ki se je naenkrat zdela zares majhna. Pa težava ni bila širina, česar sem se tega najbolj bal, ampak globina. Tako velik monitor, pa še ukrivljen zraven, ima tudi velik podstavek. In igračarski monitorji imajo ekstravagantne noge, tale moj testni pa je imel tri. Dve sta se lepo raztezali pod monitorjem, tretja, najkrajša, pa je štrlela, kot bi hotela narediti luknjo v knauf steno za mizo. Rezultat ni bil idealen, ampak tudi ne katastrofalen. Na mizi pred njim je bilo še ravno dovolj prostora za tipkovnico. A čisto nič več … Pogled z razdalje dobrih dvajsetih centimetrov na ukrivljeno površino diagonale 32 palcev, na kateri sveti 3,686.400 svetilnih točk hkrati, je impozanten. Slika se v navpični in vodoravni smeri razteza skoraj do roba vidnega polja in počutiš se, kot bi te Okna objemala. Kaj drugega od monitorja z imenom ROG STRIX XG32VQR nisem pričakoval. Da je v brskalniku veliko belega roba, kjer bi bile reklame, če jih ne bi blokiral, je jasno. A da je treba konkretno premakniti pogled navzgor, da lahko oceniš, kam je treba klikniti za preklop v drug zavihek, tega nisem navajen. V igrah pa se zadeva res odlično obnese. Sklepam po tem, ker se je v četrtek zvečer, to je tisti dan pred petkom, ki je pri nas dan za igre, vnel čisto pravi prepir, ki je mejil že na pretep, kdo bo prvi igral na »novem očijevem monitorju« in kdo bo tačas trpel na prenosniku, ki je do pojava monitorja bil najljubša naprava v hiši. Jaz do svoje formule 1 tisti vikend sploh nisem prišel. Sem pa na njem nekaj dni pisal članke, odgovarjal na mejle in plačeval račune. In bil razočaran. Ne da bi z ženo sploh odprl debato, ki bi nedvomno vsebovala vprašanja (z odgovori), kot so: »Zakaj pa rabiš tako velik monitor? Saj sploh nimaš toliko prostora na pisalni mizi!«, »Zakaj pa širokega? A ni že ta, ki ga imaš, dovolj širok?« in nedvomno »Zakaj pa ukrivljen? To je pa takooo grdo!« in za finale »A gamerski monitor rabiš? A da bodo otroci še več za računalnikom?« Tri dni je tako utripal s svojimi premnogimi rdečimi ledicami tam v dnevni sobi, potem pa sem ga pospravil nazaj v škatlo, vrnil v Monitorjev laboratorij in razložil, da ni zame. Da ima super sliko, da je 144 Hz res opazno v igricah pa da ima na prvi pogled sicer kar visoko ločljivost, a da se ta bolje poda 27-palčnemu bratu. Za igre je res krasen, ampak na 32 »colah« je za Outlook, Word, PowerPoint in kodiranje potrebno več pik in vse, kar je manj kot 4K, ni smiseln nakup. Članek sem naslednji večer natipkal ob gledanju v dobri stari, povsem črn in neopazen monitor. Objavljeno tudi v reviji Monitor. Znački: Mnenje, Monitor"
