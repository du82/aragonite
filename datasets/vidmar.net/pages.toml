["https://vidmar.net/blog/avtomobili-so-kot-rocne-ure"]
title = "Avtomobili so kot ročne ure • David Vidmar"
description = """
O tem, kakšno simboliko ima avtomobil in kaj vse nam pomeni, je bilo temeljito raziskano in jasno je, da gre vsaj še pri generaciji, ki ji pripadam in še kakšni za njo, za veliko več kot samo objekt iz železa, aluminija in plastike. A zdi se, kot da nam prihodnost želi te objekte poželenja prepovedati.
Moja generacija je živela za trenutek, ko bomo naredili vozniški izpit in se bomo lahko (legalno) zapeljali na širne ceste domačega mesta, se s prijatelji in prijateljicami odpeljali nekam, kjer ni staršev in kjer nas nihče ne prepozna."""
full_description = "Avtomobili so kot ročne ure Objavljeno 5. Sep 2022 5 minut branja O tem, kakšno simboliko ima avtomobil in kaj vse nam pomeni, je bilo temeljito raziskano in jasno je, da gre vsaj še pri generaciji, ki ji pripadam in še kakšni za njo, za veliko več kot samo objekt iz železa, aluminija in plastike. A zdi se, kot da nam prihodnost želi te objekte poželenja prepovedati. Moja generacija je živela za trenutek, ko bomo naredili vozniški izpit in se bomo lahko (legalno) zapeljali na širne ceste domačega mesta, se s prijatelji in prijateljicami odpeljali nekam, kjer ni staršev in kjer nas nihče ne prepozna. Avto je omogočal, da smo začutili svobodo, ki jo simbolizirajo ceste. Lasten avto je bil znak zrelosti in samostojnosti. Bil je dokaz uspeha. Širša platišča, dober avtoradio s »subwooferjem« v prtljažniku in spretnost pri uporabe ročne zavore za atraktivnejšo premagovanje ovinkov so definirali moškega in nekatere ženske, ki sodijo na družbeni Olimp. Zdaj s(m)o ljubitelji bencinskih in dizelskih hlapov v srednji letih. Vsake toliko si lahko privoščimo nov avto. Ali pa vsaj res lepo ohranjenega, rabljenega iz Nemčije. Namesto vpadljivih platišč, ki krasijo izložbe trgovin z rezervnimi deli, izberemo paket dodatne opreme, ki prinaša večja platišča. Še raje imamo, če je v paketu še malce več zvočnikov, kot bi jih avtomobil nujno potreboval. V prtljažniku ni več prostora za dodatno leseno škatlo za globoke tone, ki tresejo zadnjo šipo. Tja sodijo vrečke iz supermarketa, potovalke, SUP, žar, oprema za veslanje, potapljanje ali kolesarjenje, otroški skiro in čelada, zaboj vina ali piva. Naši avti so imeli dušo, imena in zgodbe. Na družinskih slikah so enakovredni tetam in stricem, prijateljem iz vojske in sošolcem. V njih smo spali, jokali, se zaljubili in ljubili. Zdaj pa se od vsepovsod oglašajo neki čudaki, ki nikoli niso imeli radi avtomobilov in nas prepričujejo, da prihajajo novi časi. Slabši časi. Grozni časi, ko ne bo več bencinskih črpalk, menjavanja olja in žarnic ter gledanja pod pokrov, kaj, za vraga, je ta zvok pri srednjih obratih. O, ne. Ne damo spominov na prvi avto, prvi poljub, prvo morje s »frendi« in prve »totalke«. Tega pa ne! O električnih avtomobilih radi pišejo računalniški novinarji. Tisti, ki so pred mnogimi leti testirali monitorje, miške in tiskalnike. Ko je to postalo dolgočasno, so preklopili na fotoaparate in televizorje. Zdaj ko je skopnelo zanimanje še za te, so se lotili električnih avtomobilov. Nič čudnega – najboljši električni avtomobili so bolj podobni pametnih telefonom kot passatu, sem nekoč zapisal. Računalniki na kolesih so in njihova šibka točka, glavni kriterij pri nakupu in najdražja komponenta je baterija in ne moč in varčnost motorja ali servisni interval. Vsak, ki je poskusil voziti električno vozilo, bo potrdil, da je vožnja enostavno udobna. Hitro se navdušimo nad takojšnjo pripravljenostjo za vožnjo ter zveznim pospeševanjem in večina ne potrebuje več kot nekaj kilometrov, da se odvadi hrupa motorja na notranje izgorevanje. Če dodamo še velikanske zaslone na dotik, vgrajene aplikacije in pospeške, je težko ostati ravnodušen ne glede na to, ali si »gadget freak« ali pa avtomobilski fanatik. Če imaš srečo, da se večinoma voziš na srednje dolge vožnje in imaš celo možnost polnjenja v službi, se električni avto zelo izplača. A kaj, ko te digitalne škatle na štirih kolesih nimajo duše! Sam se ne štejem med navdušence nad avtomobili, čeprav mi vožnja pomeni užitek. Ne berem avto revij, in čeprav avto uporabljam vsak dan, ta ni moj hobi. Novih modelov avtomobilov ne ločim od generacije ali dveh starejših. Ko avto stakne novo prasko ali udrtino, ne čutim njegove bolečine, preračunam le, ali se poškodbo sploh izplača popravljali ali bo pribitek pri zavarovanju prevelik. Avto je zame najprej prevozno sredstvo in potem neizogiben strošek. Verjetno mi je zato lažje sprejeti, da ima avtomobil, ki ga ne poganja bencin ali nafta, temveč elektrika, neverjetno praktično vrednost. Nima duše, a z njim se je res fino peljati po cesti in v miru klepetati, ne ropotati po domači ulici sredi noči in ne razmišljati o naslednji menjavi olja in jermena. Vsi modeli še niso primerni za vožnjo na Rab ali počitnice na Sardiniji, a za pot v službo so idealni. In razvoj se prej pospešuje, kot umirja. Navdušencem nad z mrtvimi dinozavri gnanimi, ropotajočimi in smrdečimi škatlami želim, da jim avtomobilov nihče ne vzame, da bodo še dolgo lahko uživali ob njih. Nekako tako, kot nam nihče ne prepoveduje kupiti in uporabljati analognega fotoaparata, predvajalnika plišča, plazma (katodne?) televizije, stacionarnega telefona ali klasičnega trdega diska. Vse te naprave imajo še vedno pristaše, imajo tudi kakšno prednost, marsikdo jih ima rad in ima na njih lepe spomine, a za praktično vsakodnevno rabo so na voljo boljše naprave in tehnologije. Pred časom sem poslušal slovenski avtomobilski podkast in od voditelja, avtomobilskega zanesenjaka, slišal lepo primerjavo, s katero od tedaj mirim tiste, ki jim električni avtomobili ogrožajo samopodobo. Po njegovem bodo klasični avtomobili nekoč sprejeti tako, kot so danes mehanske ali kvarčne ure. Te kupimo in nosimo za užitek, kot okras in v spomin, za vsakodnevno uporabo pa nam pametna ura nudi neprimerno več. Dodajam, da moramo tudi pametno uro znati uporabljati in se je navaditi – takrat postane nepogrešljiva, pa čeprav ne vedno in povsod. Kot električni avtomobil. Objavljeno tudi v reviji Monitor. Znački: Mnenje, Monitor"
author = "https://facebook.com/DavidVidmar"
