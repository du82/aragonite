["https://vidmar.net/blog/aplikacije-ne-resujejo-sveta"]
title = "(Covid) Aplikacije ne rešujejo sveta • David Vidmar"
description = """
Obljubili so nam aplikacijo za prijavo na cepljenje, ki bo rešila vse težave s tem. V času pričakovanja sem si pripravil prazen prostor za ikono na prvem zaslonu telefona, dobili pa smo le spletni obrazec. Si rs ne zaslužimo nič več?
Ob večini izzivov, afer in sag, ki zadnje mesece pretresajo svet in našo ljubo deželico, ostanem raje tiho. Z znanci in neznanci nočem debatirati o politični krizi doma ali v ZDA, ne o sestavi cepiva, njegovi učinkovitosti in še manj o interesih, ki se skrivajo za raznimi političnimi igrami."""
full_description = "(Covid) Aplikacije ne rešujejo sveta Objavljeno 25. Jun 2021 4 minute branja Obljubili so nam aplikacijo za prijavo na cepljenje, ki bo rešila vse težave s tem. V času pričakovanja sem si pripravil prazen prostor za ikono na prvem zaslonu telefona, dobili pa smo le spletni obrazec. Si rs ne zaslužimo nič več? Ob večini izzivov, afer in sag, ki zadnje mesece pretresajo svet in našo ljubo deželico, ostanem raje tiho. Z znanci in neznanci nočem debatirati o politični krizi doma ali v ZDA, ne o sestavi cepiva, njegovi učinkovitosti in še manj o interesih, ki se skrivajo za raznimi političnimi igrami. Nekdaj sem rad igral strateške igre in v službi velikokrat sestavljam strategije, toda strategije cepljenja ne upam ocenjevati in komentirati, četudi je vsakomur jasno, da ima velikega hrošča. Aplikacije in podatkovne zbirke, migracije, opa, o tem pa nekaj vem! Pa tudi o integracijah, iz teh sem naredil čisto solidno kariero. Zato sem bil prav pošteno nejevoljen, ko sem po vseh novicah o obljubi famozne nove aplikacije, s katero bomo Slovenci rešili kovidno in cepilno krizo, pričakoval mobilno aplikacijo, takšno, ki sodi na prvi zaslon. Spomnim se, da sem se spraševal, zakaj bi bila ravno mobilna aplikacija prava rešitev za zbiranje prijav, a sem zamahnil z roko. Kaj pa jaz vem, jaz sem star, imam preveč računalnikov in prehitro tipkam, da bi razumel, kaj vse zmorejo uporabniki opraviti na telefonu. Če mladina na majhnem in umazanem zaslonu natapka (ne, nisem mislil napisati natipka!) seminarsko nalogo, se bodo pa še na cepljenje prijavili. Če lahko dame kar med malico na telefonu kupijo nove škornje in poletne oblekice, si bodo pa še Astrazeneco naročile, sem se prepričeval. Starejši? Njih smo že precepili, verjetno ne rabijo aplikacije, če jih že ne bodo prijavili otroci in vnuki. A še preden smo zares videli težko pričakovano aplikacijo ali bolje rečeno spletni obrazec, še preden se je strežnik pobral po začetnem navalu, so strokovnjaki že hiteli razlagati, da je tudi spletna aplikacija v resnici aplikacija in da je vse pod kontrolo. Ko pa sem se, za vsak slučaj, še enkrat poskusil prijaviti na cepljenje, mi je postalo jasno, da aplikacije, mobilne ali spletne, enostavno ni. Še manj celovite digitalne rešitve, ki bi lahko pomagala rešiti zagato, v kateri smo se znašli. Pogosta napaka sodobnega poslovodstva je, da poslovni problem poskuša rešiti s tehnologijo. Sodobno oblikovana aplikacija, obvezen poudarek na UX, ščepec oblaka, po vrhu potrosiš malo strojnega učenja, če ne celo umetne inteligence, in letni bonus za posebne dosežke ti ne uide! Pa po objavah na Linkedinu sklepam, da gre natanko tako. Bal sem se, da bomo dobili takšno aplikacijo. Zdaj si želim, da bi dobili vsaj to, ne pa le spletni obrazec. Vsi si lahko prestavljamo, da bi se v dobri spletni in mobilni aplikaciji prijavili z minimalnim vnosom podatkov, saj vse podatke o uporabniku država tako in tako ima. Da bi videl, kdaj in kje sem se prvič prijavil, da bi me ob naslednji prijavi sistem in aplikacija potolažila, da dodatna prijava ni več potrebna. Lahko bi videl lokacijo svoje cepilne točke, stanje čakalne vrste in napoved, kdaj se po trenutno znanih podatkih pričakuje, da bom prišel na vrsto. Enostavno bi lahko dodali še podatka, s katerim cepivom bom cepljen in zakaj je izbrano cepivo (dovolj) dobra izbira zame. Pred cepljenjem in po njem bi lahko dobival sporočila o vseh spremembah pa sveže informacijah in nasvete, kako naj za cepljenje navdušim še koga okrog sebe. In jasno, ob prijavi in ob cepljenju bi dobil kakšno simpatično digitalno nagrado in na vsakem koraku možnost deljenja zgodovinskega trenutka na omrežjih z drugimi, da bi privabili nove uporabnike. Uporabniški vmesniki, aplikacije, če hočete, so pomembni, a so le vrh ledene gore. Pod površino vsake resne »aplikacije« se skriva temen ocean in večina ledene gore. Aplikacijo, program, obrazec ali karkoli že uporablja in vidi uporabnik, je treba ustrezno zamejiti od zaledja. Tehnološko rešitev je nujno uskladiti z delovni procesom, tega je treba ustrezno prilagoditi, pa čeprav je že leta dovolj dober, in integrirati z obstoječimi sistemi, zagotavljati konsistentnost podatkov, ustrezno hitrost in zanesljivost delovanja in tako dalje. Nič ne vem o projektu, a upam si trditi, da projekt prijave na cepljenje ni bil zagnan pred letom dni, ko smo že vsi vedeli, da ga bomo potrebovali. Ni videti, da je zamišljen v več povezanih, a neodvisnih sklopih, kjer en zagotavlja enostaven in prijazen način za prijavo državljanov in drugi omogoča praktičen, varen in skladen način za uporabo medicinskim ekipam, ki izvajajo cepljenje, tretji omogoča analitiko in simulacije tistim, ki sestavljajo strategije. En velik sklop, o katerem raje ne govorimo, pa skriva vse zaledne neprijetnosti. Nadvse si želim, da se motim in da vse to še prihaja. Do takrat bom pa še naprej tuhtal, ali sem si že premislil in ali ne bi bilo kljub vsemu bolje prepustiti tehnološkim velikanom, da dokončno prevzamejo naša življenja in nam v prijetnih ter manj prijetnih trenutkih življenja ponudijo vsaj dobro digitalno izkušnjo. Objavljeno tudi v reviji Monitor. Znački: Mnenje, Monitor"
