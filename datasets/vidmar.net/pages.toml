["https://vidmar.net/blog/pimoroni-keybow-2040"]
title = "Naredi sam - tipkovnica Pimoroni Keybow 2040 • David Vidmar"
description = """
Pimoroni je znan po elektronskih komponentah in izdelkih za navdušence nad elektroniko. Trenutno je eden njegovih zanimivejših izdelkov družina USB-tipkovnic Pimoroni Keybow. Pri nakupu nikar ne spreglejte, da jih boste pred uporabo morali še sestaviti in sprogramirati.
Pimoroni Keybow je družina izdelkov, v kateri sta trenutno dva modela priročnih dodatnih tipkovnic. Prvi ima le tri gumbe, a bolj zanimiva je nekoliko naprednejša tipkovnica s 16 tipkami. Ključna razlika med modeloma ni le v številu tipk."""
full_description = "Naredi sam - tipkovnica Pimoroni Keybow 2040 Objavljeno 4. Sep 2021 3 minute branja Pimoroni je znan po elektronskih komponentah in izdelkih za navdušence nad elektroniko. Trenutno je eden njegovih zanimivejših izdelkov družina USB-tipkovnic Pimoroni Keybow. Pri nakupu nikar ne spreglejte, da jih boste pred uporabo morali še sestaviti in sprogramirati. Pimoroni Keybow je družina izdelkov, v kateri sta trenutno dva modela priročnih dodatnih tipkovnic. Prvi ima le tri gumbe, a bolj zanimiva je nekoliko naprednejša tipkovnica s 16 tipkami. Ključna razlika med modeloma ni le v številu tipk. V škatlici so vse sestavine, potrebne za sestavljanje mehanične tipkovnice. Da bomo sestavili enostavnejši model, bomo morali kupiti še pomnilniško kartico SD in mikroračunalnik Raspberry Pi Zero, natančneje njegovo različico W, ki ima integrirano povezljivost z brezžičnimi omrežji Wi-Fi in bluetooth. Kar seveda predstavlja dodaten strošek in nekaj več dela pri naročanju pravilnih komponent. Večji Pimoroni Keybow 2040 pa vse potrebne komponente že vsebuje, le sestaviti jih je treba v delujočo tipkovnico. Če vas ob misli na kaj takega oblije znoj, se nikar ne ustrašite. Dela s sestavljanjem res ni veliko in opravi ga lahko čisto vsak, saj je v škatli vse, kar boste za sestavljanje potrebovali. Med postopkom lahko sledite pisanim navodilom ali si ogledate video, ki vas bo vodil. Podnožja tipk boste vstavili v zaščitno zgornjo ploščo, jo sestavili z glavno ploščo, ki je hkrati srce naprave, in pod njo privili še zaščitno ploščo. Ko boste nataknili še kapice tipk in napravo povezali z računalnikom prek priloženega kabla USB-C, bo naprava pripravljena za uporabo. No, ne še čisto, treba jo bo še sprogramirati … Srce Keybow 2040 predstavlja mikrokrmilnik RP2040, prvi tako izdelek podjetja Raspberry Pi. Da bo naprava uporabna, bo nanjo, ali bolj natančno na integrirani mikroprocesor RP2040, naložiti še programsko kodo, s katero definiramo, kaj želimo, da tipke počnejo. Poleg tega se lahko poigramo še z barvnimi diodami LED, ki so vgrajene v vsako tipko. RP2040 je procesor, namenjen navdušencem, v primeru tipkovnice Keybow pa je priročno, da lahko poganja takšnim čipom namenjeno različico programskega jezika Python. A tudi ta korak naj vas ne prestraši. Na tipkovnico so prednaloženi vsi potrebni programski vmesniki in knjižnice ter nekaj primerov, kako lahko tipkovnico uporabimo. Več primerov in nadgradnje prednaloženih programčkov lahko najdete na spletišču GitHub. Dodatna tipkovnica lahko marsikomu olajša življenje, saj poenostavi razna zamudna opravila, ki bi jih sicer opravili z miško in s tipkovnico. V igrah lahko zaženemo poljubna zaporedja pritiskov, klikov in premikov. Navdušenci nad snemanjem in predvajanjem igranja računalniških iger lahko v OSB ali sorodnih orodjih poenostavijo začetek in konec snemanja, preklapljanja scen, vklopa in izklopa mikrofonov in podobno. Pisarniški bojevniki lahko dodatne tipke izkoristimo kot priročen način, da v Zoom, Teams ali podobnem orodju vklopimo ali izklopimo mikrofon in kamero. Programerji pa lahko tipke spremenijo v poljubne bližnjice, zagon programov ali pa za hiter vnos kosov kode. Prav vsakdo lahko upravlja predvajanje glasbe, če uporabite privzeti program, ki bo tipke spremenil v medijske bližnjice in tipke za nastavitev glasnosti. Programirali pa ne boste le akcij, ki jih tipke sprožijo ob pritisku, spustu, držanju, ampak tudi vklapljali in izklapljali LED-diode, ki so vgrajene v vsako tipko. Izbirate lahko med različnimi barvami in jakostjo svetlobe ter sestavljate zabavne pa tudi kičaste LED-animacije. Pimoroni 2040 ni samo cenejši streaming deck, je izdelek za sladokusce, za katere dodatna elektronska naprava nima le uporabnosti, ampak so jim tudi užitek sestavljanje, nastavljanje in prilagajanje. Pimoroni 2040 nas ni navdušil le z uporabnostjo, ampak tudi z izjemno kakovostjo izdelave ter drobnimi presenečenji, na katera smo naleteli med sestavljanjem. Članek je bil objavljen tudi v reviji Monitor. Znački: Nasveti, Monitor"
