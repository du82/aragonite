["https://vidmar.net/blog/o-narocninah-in-lupljenju-jabolk"]
title = "O naročninah in lupljenju jabolk • David Vidmar"
description = "V preddigitalnih časih smo imeli doma naročeno Delo. Lahko bi imeli tudi Dnevnik ali Večer, ampak nismo bili ne iz Ljubljane in ne iz Maribora. Pomembno je bilo, da smo vsak dan dobili svoj izvod in s tem sveže novice. Če smo jih brali ali pa ne, smo s tem sporočali sosedom, pa tudi sebi, da smo aktivni člani družbe, da nas zanima dogajanje okrog nas in da smo razgledani."
full_description = "O naročninah in lupljenju jabolk Objavljeno 2. May 2022 5 minut branja V preddigitalnih časih smo imeli doma naročeno Delo. Lahko bi imeli tudi Dnevnik ali Večer, ampak nismo bili ne iz Ljubljane in ne iz Maribora. Pomembno je bilo, da smo vsak dan dobili svoj izvod in s tem sveže novice. Če smo jih brali ali pa ne, smo s tem sporočali sosedom, pa tudi sebi, da smo aktivni člani družbe, da nas zanima dogajanje okrog nas in da smo razgledani. Dnevni časopis ni bil namenjen samo branju. Nujno smo ga potrebovali za lupljenje krompirja in za zaščito pri različnih umazanih ter ustvarjalnih početjih. Še danes mi ni jasno, kako so sosedje v bloku, ki niso imeli naročenega dnevnega časopisja, lahko spomladi očistili šipe svojega stanovanja. Časi so se spreminjali, ponudba se je večala. V osnovni šoli smo najprej naročili revijo Ciciban, v višjih razredih je bil obvezen PIL, takrat še z daljšim imenom. Nadležni prodajalci, ki so trkali na vrata, so nam prodali nekaj metrov tistih temno rdečih knjig, na čeke pa smo kupili še nekaj enciklopedij, ki so izhajale po več let. Največji družinski stres v tistem času ni bil učni uspeh ali družinske finance niti to, kako priti po najhitrejši poti na morje. Iskre so se kresale, ko je bilo treba izbrati knjigo četrtletja v Svetu knjige. Prvih nekaj je še šlo, kakšno četrtletje smo že vnaprej vedeli, kaj bomo kupili. A ko je zmanjkalo idej, je postalo napeto. Da bi se odjavili, nismo niti pomislili. Ne vem, ali se res ni dalo ali se po malomeščansko samo ni spodobilo. Potem je prišla osamosvojitev, v službah in šolah smo dobili dostop do interneta, kar je pomenilo, da smo lahko resetirali naročnine in se zbirateljsko lotili empetrijev in divixov. Ob prihodu čudovitega in čudežnega spleta v domove sploh nismo imeli več časa in volje brati, če je bila sila, smo pač fotokopirali. Časopisi so se samo še kopičili na robovih miz in pultov, vsaj tisti, ki niso končali pod olupki krompirja za nedeljsko kosilo in jabolk za zavitek. Kmalu smo se opogumili in nekega lepega dne ostali brez časopisov, zelenjavo smo lupili samo še na reklamne kataloge. V Silicijevi dolini so, leta za tem, ko je v slovenskih domovih zavela osvoboditev od naročnin, prišli na idejo, da po zobno kremo in britvice ni treba več v samopostrežno trgovino, raje jih pošljejo, ko ugotovijo, da jih kupcu zmanjka. Medtem ko smo se v domovini jezili, kako lahko stane aplikacija en evro, če bi lahko bila brezplačna, so v svetovnem središču digitalizacije izračunali, da mobilna aplikacija za vremensko napoved ne more več stati en sam dolar, da je mnogo bolje, če zanjo zaračunajo dva – vsak mesec! Zdaj, ko smo digitalizirali že skoraj vse, tudi reči, ki jih ne bi bilo treba, me sporočila banke vsak mesec opomnijo, da sem večji suženj naročnin kot kadarkoli prej. Nekaj dolarjev za slike pri Googlu, nekaj drobiža za Applov prostor za »bekap« in dve ali tri aplikacije, ki se sinhronizirajo v oblaku. Kaj pa bomo, saj je samo evro ali dva pa še cela družina lahko dostopa do svojih podatkov kjerkoli. Športa se ne da več gledati na navadni TV, vsak resni navdušenec NBA ali formule 1 si omisli letno naročnino. Netflix in še kakšen Voyo ali HBO morata biti pri hiši, če ne zaradi drugega, pa zato, da najstniki vsaj za kakšen trenutek dvignejo pogled stran od telefona in računalnika. Kaj bo šele, ko enkrat te dni v našo deželo pride Disney+?! Kdo bi še iskal, prenašal, urejal in nalagal datoteke mp3, če se v oblaku dobi vsa glasba z enim dotikom?! In ko teh nekaj evrov na mesec seštejem in pomnožim, me ob končni številki vsakič strese. Pa ne razumite me narobe – ne pravim, da je treba krasti. Ne glasbe, ne filmov, še najmanj programje. Z veseljem kupim, kar redno uporabljam, tudi tistim, ki svoje delo delijo zastonj, redno doniram nekaj evrov. Požrešnost korporacij in finančnega trga nasploh pa imam počasi dovolj! Zdi se, da nisem edini, zato je Netflixova delnica te dni stresla svet financ. Ker število naročnikov ne raste več, niso več perspektivni. Kar čez noč. Kam rasti, če imajo Netflix že praktično vsi? Trg, žal, ne razmišlja tako. Naivno upam, da je ta Netflixov spodrsljaj znanilec neke lepše prihodnosti. Do takrat bom poskušal narediti red po svoje. In se počutiti kot digitalni upornik! Kjer se le da, bom izklopil samodejno podaljševanje naročnine. Če se mi kdaj po(ne)sreči in mi naročnine ne bo uspelo pravočasno plačati, nič ne de, bom že uredil. Ali pa ne. Tudi revije bom odjavil in jih bom kupoval vsak mesec posebej. Tudi če bo nekoliko dražje. Če bom pozabil, pa toliko bolje. Še bolj drznega pa se počutim, ker sem sklenil, da bom vsak mesec odjavil eno naključno naročnino. Počakal bom, da jo bom po izteku zares pogrešal ali da bo nedelovanje opazil kdo drug v družini in skočil v zrak. Mogoče pa se kakšen mesec ne zgodi nič in bom prihranil kakšen evro – dva, pet ali sedem! Dovolj pisanja, poiskati moram kreditno kartico. Slišim, da iz sobe nekdo kriči, da mu ne dela geslo za Voyo, ki sem ga odjavil pred dnevi. Presneto, ravno ko sem prekinil naročnino, je izšla nova sezona tiste kuharske humoristične serije z Zrnecem. Članek je bil objavljen tudi v reviji Monitor. Photo by Mr Cup / Fabien Barral on Unsplash. Znački: Mnenje, Monitor"
