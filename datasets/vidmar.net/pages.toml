["https://vidmar.net/blog/spotify-za-napredne-poslusalce-dodatki-in-orodja"]
title = "Spotify za napredne poslušalce • David Vidmar"
description = """
V mnogih člankih, kjer primerjajo glasbene pretočne servise, ugotavljajo, da občutnih razlik v velikosti glasbenega kataloga ali kakovosti glasbe med njimi ni. Ko pa pride do programskih vmesnikov in orodij, ki so jih ob pomoči teh zgradili uporabniki, je daleč pred vsemi Spotify.
Storitev Spotify že sama po sebi nudi odlično uporabniško izkušnjo, saj nas razvaja z naprednimi zmožnostmi, kot so oddaljeno predvajanje, uporaba povezanih naprav kot daljinskih upravljalnikov za predvajalnik in vgrajena povezava z last."""
full_description = "Spotify za napredne poslušalce Objavljeno 4. Aug 2020 5 minut branja V mnogih člankih, kjer primerjajo glasbene pretočne servise, ugotavljajo, da občutnih razlik v velikosti glasbenega kataloga ali kakovosti glasbe med njimi ni. Ko pa pride do programskih vmesnikov in orodij, ki so jih ob pomoči teh zgradili uporabniki, je daleč pred vsemi Spotify. Storitev Spotify že sama po sebi nudi odlično uporabniško izkušnjo, saj nas razvaja z naprednimi zmožnostmi, kot so oddaljeno predvajanje, uporaba povezanih naprav kot daljinskih upravljalnikov za predvajalnik in vgrajena povezava z last.fm, ki shranjuje zgodovino poslušanja in omogoča njeno analizo. Ne pozabimo na pametne sezname, kot sta Discovery Weekly in Release Radar, ki jih tedensko ustvarijo za vsakega uporabnika. Pred časom so zelo agresivno zakorakali tudi na področje poddaj. Spotify je zaradi enostavnega vgrajevanja v spletne strani prva izbira (no, če zanemarimo Youtube), ko želijo blogerji in uredniki spletnih portalov v spletno stran vgraditi seznam predvajanja ali glasbeni album. Spotify triki Manj znano je, da lahko že v samem programu Spotify sezname predvajanja kopiramo, izvažamo in tako delimo z drugimi uporabniki. Označene pesmi s klasičnimi bližnjicami CTRL+C in CTRL+V kopiramo med seznami ali pa zunaj programa, v elektronsko sporočilo ali članek. Tudi pri iskanju so programerji poskrbeli za napredne uporabnike. Omogočili so, da uporabimo operacije AND, OR in NOT in da natančneje označimo, kaj iščemo, z uporabo značk artist, album, track, year in nekaterih drugih. Tako bo, na primer, iskanje »artist:queen year:1980-1982« poiskalo vse pesmi izvajalca Queen med letoma ‘80 in ‘82. Na računalniku si velja zapomniti še nekaj enostavnih bližnjic na tipkovnici. Presledek bo ustavil ali ponovno zagnal glasbo, kombinacija tipk Ctrl in gor ali dol bo spreminjala glasnost, Ctrl v kombinaciji s tipkama levo ali desno pa preskakovala skladbe. Če to, potem ono Zanimive možnosti ponuja spletišče IFTTT, ki je namenjeno integraciji spletnih storitev. Potem ko z IFTTT povežemo programski vmesnik Spotify, bomo lahko shranjevali pesmi ali jih dodajali na predvajalne sezname. Tako lahko, na primer, izdelamo recept IFTTT, ki bo poskrbel, da se bodo pesmi, ki smo jih všečkali na Youtubu, shranile tudi na izbrani seznam predvajanja na Spotifyju. Drug tip receptov omogoča, da shranjujemo sezname predvajanja. Recimo v Google Docs ali OneNote je to uporabno v primeru generiranih seznamov predvajanja in takšnih, ki se redno spreminjajo. Povezane aplikacije Spotify zna sodelovati tudi z drugimi aplikacijami. Če uporabljate Shazam, se lahko v nastavitvah povežete s Spotifyjem in vsako pesem, ki jo spoznate, shranite tudi v Spotify. Navigacijska aplikacija Waze, ki jo je pred kratkim kupil veliki Google, že dolgo ponuja možnost upravljanja s Spotifyjem tudi med tem, ko uporabljamo navigacijo, in nam na ta način prihrani preklapljanje med aplikacijami, kar je še posebej koristno med vožnjo. Tako Xbox kot Playstation omogočata povezavo s Spotifyjem in predvajanje glasbe med igranjem iger. Tako bo glasba igrala na igralni konzoli, upravljamo pa jo lahko tudi s telefona. Verjetno najbolj priljubljena povezana aplikacija pa je Google Clock. Povezavo lahko uporabimo za to, da nas zbudi priljubljena glasba. Na žalost podobna rešitev za iPhone ne obstaja in zdi se, da se Apple in Spotify v kratkem ne bosta dogovorila, da bi bila tehnično izvedljiva. Čaranje s seznami Omenili smo že, da lahko pesmi enostavno kopiramo med seznami z uporabo klasičnih bližnjic. Za naprednejšo uporabo seznamov predvajanja pa predlagamo nekaj dodatnih orodij. Prvi dve orodji, ki ju omenjamo, so razvili kar pri Spotifyju. Soundtrack Your Ride bo zgradil seznam predvajanja za potovanje. Potreboval bo podatek o potrebni dolžini, zastavil nekaj vprašanj in že bo na voljo povsem vaš seznam predvajanja. Drugo sorodno orodje je Spotify for Pets. Da, prav ste prebrali in res bo zgradil seznam predvajanja za vašega ljubljenčka, seveda na podlagi glasbenega okusa lastnika. Spotify Playlist Generator je eno bolj enostavnih in hkrati uporabnih orodij. Omogoča, da seznam predvajanja sestavimo iz vpisanih naslovov sklad, izvajalcev, Spotify povezav ali pa s preprostimi ukazi najbolj priljubljene pesmi izvajalca, podobne pesmi in izvajalca ali celotnih albumov ter odstranimo podvojene pesmi, jih razvrstimo in še kaj. Izdelek preprosto skopiramo in prilepimo v Spotify. Exportify je še eno sila uporabno in enostavno orodje, s katerim lahko sezname predvajanja izvozimo in shranimo v svoj računalnik. Tudi Spotibot ne bo zahteval posebnega napora, saj potrebuje vpis vsaj enega izvajalca in že bo sestavil predlog sklad za poslušanje na podlagi sorodnih izvajalcev. Seznam bo, seveda, zapisal v seznam v storitvi Spotify. Smarter Playlists je orodje, ki lahko preplete dva seznama predvajanja, odstrani podvojene pesmi in še mnogo več. Primer uporabe je dinamičen seznam predvajanja, ki vsebuje trenutno predvajane hite in glasbo, ki je bila priljubljena pred 10 leti. Spolistr je namenjen naprednejšemu ustvarjanju novih seznamov. Te zna zgraditi iz seznama pesmi ali iz seznamom z Youtuba, SoundClounda ali Reddita. Največ možnosti pa ponuja pri kreiranju seznamov predvajanja iz zgodovine poslušanj na last.fm. Soundiiz bo poskrbel, da bodo seznami usklajeni med različnimi storitvami, ali pa bo pomagal pri prehodu z ene storitve na drugo. Podpira Apple Music, Deezer, Google Music in mnoge druge. Orodje Acrostify je bolj zabavno kot uporabno, saj bo sestavilo seznam predvajanja kot akrostih, torej tako, da bodo prve črke naslovov pesmi v seznamu predstavljale poljubno besedilo. Boil the Frog je lep primer naprednejše skripte, zgrajene z orodjem Echonest, ki bo poiskala povezave med izvajalci in zgradila seznam predvajanja, ki bo vseboval povezane izvajalce in njihove med pesmi. Počasi bo »kuhala žabo« in nas vodila med izvajalcema. Replace the Cover bo pomagal ustvariti naslovno sliko vašega seznama predvajanja v Spotifyjevem oblikovalskem jeziku. Članek je bil objavljen tudi v reviji Monitor. Znački: Nasveti, Monitor"
