["https://vidmar.net/blog/naslednja-stopnja-umetne-inteligence"]
title = "Naslednja stopnja umetne inteligence • David Vidmar"
description = """
Umetna inteligenca se počasi in vztrajno rine v vse pore našega življenja, takšni in drugačni algoritmi nam krojijo vsak dan, pa če se tega zavedamo ali pač ne. Kot kaže, tudi industrija zabave vidi svojo prihodnost v digitalnem svetu.
V San Franciscu se je nedavno odvila konferenca Virtual Beings Summit, namenjena navideznih bitjem oziroma podjetjem in posameznikom, ki jih ustvarjajo in poskušajo tržiti. Tokrat je bila zaradi vsesplošnih omejitev zbiranja in druženja organizirana virtualno, kar je le še bolj zabrisalo meje med tem, kdo je resničen, in povzročalo debate ter ugibanja, koga nadomešča njegova digitalna kopija in kdo je bil ustvarjen povsem digitalno."""
full_description = "Naslednja stopnja umetne inteligence Objavljeno 5. Oct 2020 4 minute branja Umetna inteligenca se počasi in vztrajno rine v vse pore našega življenja, takšni in drugačni algoritmi nam krojijo vsak dan, pa če se tega zavedamo ali pač ne. Kot kaže, tudi industrija zabave vidi svojo prihodnost v digitalnem svetu. V San Franciscu se je nedavno odvila konferenca Virtual Beings Summit, namenjena navideznih bitjem oziroma podjetjem in posameznikom, ki jih ustvarjajo in poskušajo tržiti. Tokrat je bila zaradi vsesplošnih omejitev zbiranja in druženja organizirana virtualno, kar je le še bolj zabrisalo meje med tem, kdo je resničen, in povzročalo debate ter ugibanja, koga nadomešča njegova digitalna kopija in kdo je bil ustvarjen povsem digitalno. Na konferenci so govorili o razvoju novodobnih digitalnih pomočnikov in pomočnic, digitalnih nadomestkih in digitalno ustvarjenih vplivnežih. Prav ste prebrali, poklic vplivneža le ni tako dobra naložba v prihodnost, ko se trenutno mnogim zdi. Da se Japonci in Korejci navdušujejo nad virtualnimi glasbenimi umetniki in predvsem umetnicami, si ni težko predstavljati. Presenetljivejši za marsikoga pa utegne biti podatek, da so ameriška zagonska podjetja povezana z industrijo virtualnih bitij zbrala že blizu polovice milijarde dolarjev zagonskega kapitala, ki ga namenjajo razvoju in promociji svojih kreacij. Mnogi podjetniki in investitorji torej verjamejo, da so navidezna bitja naslednja stopnja digitalnih tehnologij, ki nas bodo navduševale, izpopolnjevale, nam pomagale, se usidrale v naša življenja, in da bomo za to pripravljeni plačevati. Podjetja, kot sta Fable Studios in AI Foundation, ustvarjajo virtualna bitja, ki so lahko ultra realistična ali pa je njihov videz plod domišljije ter so bolj kot ljudem podobna likom iz risank, stripov ali iger. Da so več kot samo liki in da je lahko njihov vpliv primerljiv z resničnimi ljudmi, že danes dokazujejo virtualneži, ki so zvezde na Instagramu in čisto pravi vplivneži. Imajo več milijonov sledilcev, na ta način ustvarjajo modo, okus in nekatere med njimi nekateri oboževalci težko ločijo od pravih bitij. In kar je še pomembneje, zdi se, je sledilcem povsem vseeno, če se navdušujejo nad virtualnimi osebami. Nekateri med njimi niso prav nič inteligentni, gre le za skrbno izdelane podobe, da pozirajo na način, ki je trenutno moden in priljubljen. Če vam ob ogledu Instagram profilov, kot je Lil Miquela zazdi, da se ponovno uresničuje epizoda Black Mirror, niste edini. Mnoga podjetja vidijo uporabo digitalnih osebnosti kot način za večno življenje ali način, da v (virtualno) življenje povrnejo že preminule legende družabnega življenje in zabave. Znanstvenofantastična literatura je polna primerov, kjer to lahko vodi v boljše in lepše življenje, še več pa je zgodb, kjer se zabrišejo meje med resničnim in navideznim, kar pelje v pogubo človeštva. Virtualna bitja in pravi ljudje se že danes lahko družijo v igrah in se celo zabavajo na koncertih pravih umetnikov v navideznih svetovih. Verjetno ste že slišali za koncerte z več milijoni obiskovalcev igri Fortnite. Na že omenjeni konferenci se je okrogla miza dogodila kar v igri Animal Crossing, ki je pred časom obnorela odrasle igralce, predvsem na drugi strani luže. Ali so se kaj pametnega pomenili, je manj pomembno kot to, da so s svojimi opravami in načinom komuniciranja kazali, kakšna naj bi bila prihodnost druženja. Če so podjetja sprejela virtualno druženje prek video klicev, je potopljenost v navidezno resničnost ali navidezno neresničnost lahko le recept za uspeh. Prav enostavno si je predstavljati, da bo trenutna zdravstvena kriza razvoj takšnega načina povezovanja le pospešila in da bo eden izmed naslednjih velikanov Silicijeve doline ponujal virtualni svet, v katerem se bodo odvijale poslovne konference prihodnosti. Če smo ljudje pripravljeni poslušati nekatere trenutne zvezde, ki se pojavljajo samo na spletu, in jim slediti, ni vrag, da ne bo mogoče prodati tudi povsem digitalnih zvezd. Tako so sklenili na omenjeni konferenci in težko oporekam njihovemu sklepu. Predstavljam si, da bo čez nekaj let razvoj prišel tako daleč, da bodo »pravi« vplivneži, filmske zvezde, manekeni in manekenke imeli povsem dostojno konkurenco, ki bo cenejša, bolj ubogljiva in manj muhasta. Predvsem pa bo lahko delala kjerkoli in karkoli bodo njihovi lastniki in upravljalci želeli. Zgoditi se zato utegne, da se bo, prav tako kot internet, pretočni video, spletna plačila in še kakšna tehnologija, brez katere ne moremo več živeti, industrija navideznih digitalnih bitij razvijala ne samo zaradi potreb podjetij in korporacij, ampak predvsem zaradi uporabnosti v pornografski industriji. Objavljeno tudi v reviji Monitor. Znački: Mnenje, Monitor"
author = "https://facebook.com/DavidVidmar"
