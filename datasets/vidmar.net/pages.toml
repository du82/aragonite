["https://vidmar.net/blog/kaj-bo-letos-nosil-bozicek"]
title = "Kaj bo letos nosil Božiček? • David Vidmar"
description = """
Letošnje leto je bilo posebno v skoraj vseh pogledih, kaj ne bi bilo tudi v tem, da se na glavo obračajo seznami želja po novih digitalnih igračkah. Če smo lani sanjali o novih telefonih, so letos na vrhu pisem Božičku tudi drugačna darila. Svet gre torej naprej. A ne za vse enako hitro.
Seznami želja, ki jih pošiljamo Božičku in drugim dobrim možem, so, seveda, velika skrivnost in zato jih ne morem statistično obdelati."""
full_description = "Kaj bo letos nosil Božiček? Objavljeno 20. Dec 2020 5 minut branja Letošnje leto je bilo posebno v skoraj vseh pogledih, kaj ne bi bilo tudi v tem, da se na glavo obračajo seznami želja po novih digitalnih igračkah. Če smo lani sanjali o novih telefonih, so letos na vrhu pisem Božičku tudi drugačna darila. Svet gre torej naprej. A ne za vse enako hitro. Seznami želja, ki jih pošiljamo Božičku in drugim dobrim možem, so, seveda, velika skrivnost in zato jih ne morem statistično obdelati. Mislim, da jih ne more nihče, še umetna inteligenca jim ne more do živega. Pisma niso shranjena v oblaku, temveč na severnem tečaju. Pa si kljub vsemu mislim, da na podlagi slišanega in prebranega ter vsebine tistih pisem, ki jih kot starš, mož, stric in brat vidim, lahko pred začetkom sezone opazim nekaj zelo zanimivih trendov. Pametni telefoni so postali nekaj, kar je samoumevno, in skoraj vsak je dovolj dober, da opravi svoje delo, sploh če je iphone. Tudi počen zaslon ni več razlog, da je čas za menjavo naprave. Raba telefona že dolgo ne pomeni klicanja ali pošiljanja esemesov, ampak je nujen za klepetanje s prijatelji, velikokrat kar eden čez drugega v eni skupini, brskanje po Instagramu za znanci in neznanci ter drsenje po neskončnem morju novega kralja družabnih omrežij, njegovega veličanstva Tiktoka. In na Tiktoku ni tako pomembno, kako žive in tople so barve, kakšna je ostrina, kako lepo je obdelana slika, važno je, kaj je na posnetku. Pa tudi, če je s telefonom posnet zaslon računalnika. Saj kaj bi pa drugega pričakovali od omrežja, ki promovira pokončne posnetke, ki so ločnica med normalnim svetom (beri: starost nad 30 let) in nerazumno mladino. Otroci bi raje kot telefon imeli (»gamerske«) slušalke, (»gamersko«) miško, (»gamersko«) mizo in električni skiro. No, ta je že malo cringe, me popravljajo iz ozadja, čeprav varuje okolje. Če je Božiček bolj radodaren, naj le prinese (»gamerski«) monitor, po možnosti zelo velik in ukrivljen. Nič od tega ni uporabno brez (»gamerskega«) prenosnika in, pozor, »in«, ne »ali«, računalnika. Pa ne za igrice, kje pa! Oba potrebujejo za šolo, pišejo v pismih. In verjetno imajo po svoje prav, saj delo in šola na daljavo ne bosta šla prav kmalu stran. Sumim, da bo Božiček letos prinesel največ (»gamerskih«) slušalk. Boljše so za šolo kot brezžične, ker se bolje sliši in se nikoli ne izpraznijo. Če se že sprašujete, kaj pomeni »gamerski«, najlažje prevedem v jezik staršev kot tak, »ki ima LED-osvetlitev in nenehno spreminja barvo«. Tistim, ki smo zrasli z bež škatlami, se zdi, da bo vijoličasta svetloba v otroški sobi »gamerja« scvrla njegovo mrežnico, roženico in še kakšne druge dele oči. A tega ne moremo dokazati, ker smo nekam založili očala, pa ne vidimo dobro na telefon in se nam zdaj ne da iskati tistega članka, kjer je zadnjič to pisalo. Tudi žena želi nov prenosnik, malo lažji in z večjim zaslonom, da bi lahko v spalnici v miru pogledala kakšno serijo na Netflixu. V nasprotju z željo proizvajalcev televizorjev kupci očitno ne gremo v smer televizije v vsaki sobi. Še tista tanka in ogromna televizija v dnevni sobi, ki jo je Božiček prinesel lani, večkrat sameva. Čeprav je OLED in je njena črna najbolj črna do zdaj, po televiziji tako in tako ni nič pametnega. Youtube se gleda pač na telefonu. Predvsem pa se gleda povsod. Imam idejo! Mogoče nabavimo Xbox ali Playstation, da bo televizija bolje uporabljena! Ali pa ne. In raje počakam še nekaj tednov, da bo dobavljiva »plejstejšn petka«. Ali da me želja mine, kar bo prej. Ker smo sodobni Slovenci, ne moremo živeti brez pametne športne ure. Zanjo in zanj. Tudi za otroke, čeprav nemško ministrstvo pravi, da je to zelo slaba ideja. Vsaj odrasli nujno potrebujemo tako s stotinami športov, čeprav bomo zganjali enega, pa še tega bolj na Facebooku. Ura mora biti športna in hkrati elegantna, da jo lahko nosiš tudi k srajci. Pri sosedih imajo že vsi električna kolesa, da lahko zdaj skupaj hodijo na izlet, pravi žena. Vsakič se še pred izletom skregajo in so v svojih s sponzorji polepljenih kolesarskih dresih Rogljiča in Pogačarja videti res patetično, pravim jaz. A ne smemo zaostajati, kajne? Morda letos ne bo treba kupiti novih smuči, precej slabo kaže s smučarsko sezono, zato je lahko električno kolo dobra naložba. Mogoče pa najdem takega, ki ga bodo lahko nekoč nadgradili tako, da se bo vozilo kar samo! In po tem, ko je Božiček izvedel želje za vsa darila, moram razmisliti še, kaj bi si želel jaz. Je že čas za električni avto? Za na morje še ni uporaben, premalo prtljažnika, a počasi moramo rešiti svet, se že malo mudi. Mogoče kolo ni slaba ideja, ampak tako, da se ne bi videlo, da je električno. Do svojega domačega računalnika me sploh ne spustijo več, a kam naj postavim še enega? Prenosnika nočem, potem me boli vrat. Pa še službenega imam, bi bilo res nesmiselno. Pametni univerzalni daljinec? To je že mimo. Približno tako passe kot oprema za varjenje domačega piva ali dimljenje mesa na balkonu. Vdam sem. Najbolje bo, da v pismo napišem, da želim nekaj bitcoinov, da poskrbim za darila družinskih članov. Zase pa si zaželim nekaj brez USB-A in USB-C, nekaj kar se ne priključi Wi-Fi, ne zahteva plačevanja mesečne naročnine, ne nenehnega kupovanja kablov za polnjenje in nadgradenj vsako leto. Torej copate, dober čaj in nekaj knjig. Potem moram pa res najti ta presneta očala! Objavljeno tudi v reviji Monitor. Znački: Mnenje, Monitor"
