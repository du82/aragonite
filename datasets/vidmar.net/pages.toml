["https://vidmar.net/blog/zacetek-konca"]
title = "Smo na začetku konca tehnološke prevlade? • David Vidmar"
description = """
Tehnološki velikani in njihovo omejevanje dostopa do storitev so tema, s katero se trenutno ukvarjajo mnogi, od politikov, pravnikov do uporabnikov. Če bi velikani ne bili tako veliki in vseobsežni, bi bila zgodba precej enostavna. A žal so veliki. Pa so postali že preveliki?
Facebook, Twitter, Google pa tudi Microsoft, Amazon, Apple in praktično vsa sodobna tehnološka podjetja ponujajo storitve, za katere uporabniki ob pridružitvi sprejmemo pogoje načina uporabe in pravila obnašanja na njihovih platformah."""
full_description = "Smo na začetku konca tehnološke prevlade? Objavljeno 6. Mar 2021 4 minute branja Tehnološki velikani in njihovo omejevanje dostopa do storitev so tema, s katero se trenutno ukvarjajo mnogi, od politikov, pravnikov do uporabnikov. Če bi velikani ne bili tako veliki in vseobsežni, bi bila zgodba precej enostavna. A žal so veliki. Pa so postali že preveliki? Facebook, Twitter, Google pa tudi Microsoft, Amazon, Apple in praktično vsa sodobna tehnološka podjetja ponujajo storitve, za katere uporabniki ob pridružitvi sprejmemo pogoje načina uporabe in pravila obnašanja na njihovih platformah. Ob prijavi le zamahnemo z roko in jim z enim klikom pritrdimo. Dokler se teh pravil držimo, je vse v redu. Če pa jih kršimo, torej se sklenjenega dogovora ne držimo, nam ponudnik lahko odreče gostoljubje in z nami, kot uporabnikom, prekine pogodbo. Enostavno, mar ne? A ta podjetja so tako velika, imajo tako veliko število uporabnikov in toliko vpliva v sodobni družbi, da lahko dostop do njihovih storitev razumemo kot občo človeško pravico. Smo že tako daleč, da je dostop do Facebooka že človekova pravica, enako kot dostop do vode in spleta? V debato o pravici dostopa do omrežij in storitev ter izražanja mnenj na njih se v teh dneh hitro prikradejo tudi misli o svobodi govora. Tehnološki velikani, še posebej tisti, ki upravljajo družabna omrežja, so postali močna družbena in politična sila, ki s svojimi algoritmi določa, kaj in kdaj uporabniki preberemo, in odloča o tem, kdo lahko vsebine sploh objavlja in komu bodo servirane. Tako oblikujejo mnenja posameznikov in posredno lokalno ter svetovno politiko. O tej temi bodo pravniki, politiki, sociologi in drugi družboslovni strokovnjaki v prihodnjih letih gotovo veliko razmišljali in pisali. Verjetno bodo podjetja tudi poskušali omejevati in jim predpisovali, kaj smejo početi in česa ne. Dvomim, da bo takšno početje posebej učinkovito, saj se bodo tako tehnologija kot njihovi uporabniki spreminjali hitreje, kot bo lahko sledila kakršnakoli zakonodaja. Podjetja se bodo prisiljena samoregulirati, preden jih bodo dosegle nacionalne ali širše regulacije, če bodo hotela obdržati uporabnike ali v njihovih očeh (p)ostati sprejemljiva. Tudi ko se upremo uporabniki, kot smo se v preteklih tednih, ko se je zgodil upor proti Facebookovi klepetalni storitvi WhatsApp zaradi objave, kaj vse kanijo početi z našimi sporočili, se ne spremeni prav veliko. Dvigne se oblak prahu, objavljeni so članki s pompoznimi naslovi, nekaj deset tisoč uporabnikov zmagoslavno napove svoj odhod s storitve, a kmalu je vse po starem. Verjamem pa, da je nastopil čas, da uporabniki začnemo razmišljati, kaj bomo naredili, če se bo (brezplačna) zabava na Facebooku, Twitterju, pri Googlu in še kje nekoč za nas končala. Takšno vprašanje se mi poraja tudi zato, ker bo Google po letih brezplačnega shranjevanja fotografij v sredini leta svoje uporabnike stisnil v kot. Brezplačne zabave bo konec, uporabniki pa bomo prisiljeni plačevati mesečno naročnino za shranjevanje fotografij ali pa bomo ostali brez prostora v oblaku. Upadanje rasti števila uporabnikov, manjša rast zaslužkov z oglaševanjem in strožja pravila pri prodaji podatkov pomenijo, da bodo v prihodnje tehnološki velikani za rast zaslužkov morali začeti tudi varčevati. Zastonj shramba fotografij je bila dobro premišljena poslovna poteza, ki je pokosila konkurenco, saj ta ni mogla konkurirati izjemno dobremu izdelku za najboljšo mogočo ceno. Hkrati je nas, uporabnike, spremenila v odvisnike od storitve. Ob ukinitvi se počutimo, kot da nam Google jemlje nekaj, kar nam pripada! Leta in leta nam je dovolil nalagati slike, mnogi niti ne vedo, da se je to dogajalo, zdaj pa nas »izsiljuje«, da za to storitev plačamo. Le kako si drznejo? Zaradi spremembe bodo mnogi pač plačali tisti evro ali dva na mesec, ostali bodo ostali brez varnostne kopije slike. Nekateri, nad tehnologijo navdušena manjšina, pa bo z veliko truda in s težavami iskali spodobno nadomestilo. A mogoče se tudi neodvisni ponudniki zavedajo, da se poraja nova priložnost. Lep primer je Synology, eden največjih ponudnikov naprav NAS, ki hiti s pripravo posodobitve svoje aplikacije Photos, ki po videzu in zmogljivosti zelo močno spominja na Googlov izdelek. Ali to pomeni, da bodo tudi druga podjetja (in posamezniki) spet začela razmišljati o lastni infrastrukturi in storitvah na njej kot o nečem, kar je bolj trajno in manj tvegano kot oblak? Verjetno. Se bo kmalu kaj dramatično spremenilo? Ne verjamem. Še pred morebitnimi korenitimi spremembami v prihodnosti se bodo najuspešnejša tehnološka podjetja, kot že tolikokrat prej, prilagodila razmeram. Skrbno bodo poslušala uporabnike in trg ter hodila po tankem robu, ki pomeni največji zaslužek, in s tem dvig vrednosti (delnic) podjetja, ter vsaj za silo zadovoljne uporabnike, ki se jim ne ljubi ali pa ne znajo poiskati spodobne alternative. Objavljeno tudi v reviji Monitor. Znački: Mnenje, Monitor"
