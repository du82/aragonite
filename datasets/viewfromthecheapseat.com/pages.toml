full_description = "About View from the Cheap Seat My name is Shanine Salmon. I have been going to theatre regularly since 2011 and it has become a major interest. I am open to all sorts of productions (even scary immersive theatre) and now have a great bunch of contributors on the site. In January 2017 View From the Cheap Seat joined My Theatre Mates as a syndicate member. Originally the aim of the blog, when it was founded in April 2016, was to keep a record of my theatre going. I called it View from the Cheap Seat as I often used this term when posting pics of my high, and often terrible seats that had been booked in advance. Over time the seats have got more expensive and the majority of reviews will be press tickets given to us by public relations companies such as Chloe Nelkin, Target Live etc and freelance PRs like Chris Hislop (who gave View from the Cheap Seat its first press ticket back in October 2016). As ever I am open to reviews from those who have paid, and I regularly write about shows that I have paid to see (though I won’t review everything I have paid to see unless inspired) and always link back to the cheapest way an audience member can buy a ticket. If you have any queries or suggestions for improvements I can be contacted on the Contact page or via shanine.salmon@viewfromthecheapseat.com My other interests include working as an extra, the BFI and live comedy. Follow @braintree_ //pagead2.googlesyndication.com/pagead/js/adsbygoogle.js (adsbygoogle = window.adsbygoogle || []).push({google_ad_client: “ca-pub-2918582322113549”,enable_page_level_ads: true}); Like Loading… About Welcome to OnyxPulse, your premier source for all things Health Goth. Here, we blend the edges of technology, fashion, and fitness into a seamless narrative that both inspires and informs. Dive deep into the monochrome world of OnyxPulse, where cutting-edge meets street goth, and explore the pulse of a subculture defined by futurism and style. Categories Article Comment Compe