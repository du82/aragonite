["https://viggy28.dev/article/rds-margin-is-ec2-opportunity"]
title = "Home  | RDS' margin is EC2's opportunity"
description = "Analyzing AWS markup on RDS"
full_description = '''ARTICLES RDS' margin is EC2's opportunity January 20, 2024 - 2 minutes read - 314 words I was writing an article for Infoq on the topic less spoken costs of managed databases and one question that the editor asked is how much margin RDS makes compared to running a Postgres instance on EC2? That intrigued me and honestly, I never did the math so far. I have been using AWS-managed databases since 2016 and I thought what’s a better time to do an analysis of Cloud cost than today ?! I started by comparing instance types between EC2 and RDS. As far as I understand, these are the same VMs (EC2) that are powering RDS. Anyone with the knowledge, correct me if I am wrong. When I saw more than a 100% margin, I wasn’t sure whether I was making any mathematical errors. My instant reaction was perhaps there is some difference in other systems resources. I looked at network performance which is up to 12.5 Gigabit, it’s 4 vCPUs with 16 GiB memory. Same-to-same. My understanding is that the newer generation of instances are generally cheaper. However, that’s where the margins are also higher. So far I analyzed only the instance type. Next, I looked into the storage cost (EBS). These are compared by IOPS, throughput, and no snapshots enabled. Looks like gp3 is an anomaly. I used the AWS cost calculator and it had a few additional notes on that. Certainly, there is operation value adds that RDS provides - automated backup, and failover in the case of AZ (though it’s not an apple-apple comparison). So there is some value added for the markup. However, features like performance insights, and RDS proxy have to be paid separately. Open questions: [1]. What is the difference between a vanilla EC2 instance and an RDS instance? [2]. Is there any free tier in GP3 volume type for RDS? [3]. What’s the markup in GCP and Azure? References: https://instances.vantage.sh/rds/?cost_duration=monthly https://instances.vantage.sh/?cost_duration=monthly https://calculator.aws/#/createCalculator/RDSPostgreSQL https://rbranson.medium.com/rds-pricing-has-more-than-doubled-ef8c3b7e5218 postgres cloud var disqus_config = function () { }; (function() { if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) { document.getElementById('disqus_thread').innerHTML = 'Disqus comments not available by default when the website is previewed locally.'; return; } var d = document, s = d.createElement('script'); s.async = true; s.src = '//' + "viggy28-dev" + '.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus Related Postgres v16 installation issues wrt ICU Postgres at the edge Performance isolation in multi-tenant DB Challenges of Building in-house RDS HAProxy Conference 2022 at Paris pglite Postgres pg_rewind gotcha Citus Data - How it enables distributed postgres Postgres schema migration gotchas Postgres logging Understanding libpq in Postgres, Debian and Go go context Part 2/2: How to set up HAProxy for an active-active postgres databases Part 1/2: How to set up active-active replication in postgres using BDR'''
