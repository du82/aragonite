["https://viggy28.dev/article/postgres-active-active-replication"]
title = "Home  | Part 1/2: How to set up active-active replication in postgres using BDR"
description = "Postgres Active-Active Replication"
full_description = '''ARTICLES Part 1/2: How to set up active-active replication in postgres using BDR April 5, 2019 - 4 minutes read - 762 words Postgres doesn’t support active-active replication natively. As of this writing, we have to rely on 3rd party tools. I decided to go with BDR. I didn’t want to spin up multiple VMs. So, the obvious choice is docker. Make sure you have docker on mac & docker compose. Step1: Running 2 Postgres instances using docker container Thanks to jgiannuzzi, who created a docker image with Postgres and BDR. docker-compose.yml file content version: "3" services: database0: image: jgiannuzzi/postgres-bdr restart: always ports: - 54325:5432 volumes: - /Users/viggy28/tech/docker/volumes/postgres0:/var/lib/postgresql/data environment: POSTGRES_PASSWORD: <replace with your password> database1: image: jgiannuzzi/postgres-bdr restart: always ports: - 54326:5432 volumes: - /Users/viggy28/tech/docker/volumes/postgres1:/var/lib/postgresql/data environment: POSTGRES_PASSWORD: <replace with your password> Note: ports - port forwarding 5432 with 54325 and 54326 volumes - postgresql/data of the container is mounted on postgres0 and postgres1 directory on my local machine names - container names depend on the directory name Create two containers using docker-compose viggy28@Vigneshs-MacBook-Pro postgres0 $ docker-compose -f "docker-compose.yml" up -d --build Starting postgres0_database0_1 ... done Starting postgres0_database1_1 ... done You can verify that the two containers are running using docker ps viggy28@Vigneshs-MacBook-Pro ~ $ docker ps CONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES 0213199e6d0b jgiannuzzi/postgres-bdr "/docker-entrypoint.…" 14 minutes ago Up 9 seconds 0.0.0.0:54326->5432/tcp postgres0_database1_1 beca9adb4b65 jgiannuzzi/postgres-bdr "/docker-entrypoint.…" 14 minutes ago Up 10 seconds 0.0.0.0:54325->5432/tcp postgres0_database0_1 Check you can connect to the database running on both the containers using psql psql -h localhost -U postgres -p 54325 -d postgres psql -h localhost -U postgres -p 54326 -d postgres That’s basically running Postgres using the Docker container. Step2: Setting up active-active replication using BDR Connect to database0 (running on port 54325) psql -h localhost -U postgres -p 54325 -d postgres postgres=# create database bdrdemo; CREATE DATABASE postgres=# \c bdrdemo psql (11.2, server 9.4.17) You are now connected to database "bdrdemo" as user "postgres" bdrdemo=# CREATE EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION bdrdemo=# CREATE EXTENSION IF NOT EXISTS bdr; CREATE EXTENSION bdrdemo=# SELECT bdr.bdr_group_create( local_node_name := 'postgres0_database0_1', node_external_dsn := 'host=postgres0_database0_1 port=5432 dbname=bdrdemo password=replace with your password' ); bdrdemo=# select * from bdr.bdr_nodes; (1 row) Connect to database1 (running on port 54326) psql -h localhost -U postgres -p 54326 -d postgres postgres=# create database bdrdemo; CREATE DATABASE postgres=# \c bdrdemo psql (11.2, server 9.4.17) You are now connected to database "bdrdemo" as user "postgres" bdrdemo=# CREATE EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION bdrdemo=# CREATE EXTENSION IF NOT EXISTS bdr; CREATE EXTENSION bdrdemo=# SELECT bdr.bdr_group_join( local_node_name := 'postgres0_database1_1', node_external_dsn := 'host=postgres0_database1_1 port=5432 dbname=bdrdemo password=replace with your password', join_using_dsn := 'host=postgres0_database0_1 port=5432 dbname=bdrdemo password=replace with your password' ); select * from bdr.bdr_nodes; (2 rows) Note: local_node_name or hostname is the container name Don’t forget to replace your password If you face issue with connectivity, make sure one container can communicate with the other one $ docker exec -it postgres0_database0_1 /bin/bash root@beca9adb4b65:/# ping postgres0_database1_1 64 bytes from 172.20.0.3: icmp_seq=0 ttl=64 time=0.099 ms 64 bytes from 172.20.0.3: icmp_seq=1 ttl=64 time=0.154 ms 64 bytes from 172.20.0.3: icmp_seq=2 ttl=64 time=0.113 ms ^C--- postgres0_database1_1 ping statistics --- 3 packets transmitted, 3 packets received, 0% packet loss Step3: Verifying that data is getting replicated Insert a record on database0 (running on port 54325) viggy28@Vigneshs-MacBook-Pro haproxy $ psql -h localhost -U postgres -p 54325 -d postgres Password for user postgres: psql (11.2, server 9.4.17) Type "help" for help. CREATE TABLE names( user_id serial PRIMARY KEY, username VARCHAR (50) UNIQUE NOT NULL, email VARCHAR (355) UNIQUE NOT NULL ); postgres=# \c bdrdemo psql (11.2, server 9.4.17) You are now connected to database "bdrdemo" as user "postgres". postgres=# insert into names (user_id, username, email) values (1, 'ravichandran', '[email protected]'); INSERT 0 1 Select the data from database1 (running on port 54326) viggy28@Vigneshs-MacBook-Pro haproxy $ psql -h localhost -U postgres -p 54326 -d postgres Password for user postgres: psql (11.2, server 9.4.17) Type "help" for help. postgres=# \l List of databases Name | Owner | Encoding | Collate | Ctype | Access privileges ------------------+----------+----------+------------+------------+----------------------- bdr_supervisordb | postgres | UTF8 | en_US.utf8 | en_US.utf8 | bdrdemo | postgres | UTF8 | en_US.utf8 | en_US.utf8 | postgres | postgres | UTF8 | en_US.utf8 | en_US.utf8 | template0 | postgres | UTF8 | en_US.utf8 | en_US.utf8 | =c/postgres + | | | | | postgres=CTc/postgres template1 | postgres | UTF8 | en_US.utf8 | en_US.utf8 | =c/postgres + | | | | | postgres=CTc/postgres (5 rows) postgres=# \c bdrdemo psql (11.2, server 9.4.17) You are now connected to database "bdrdemo" as user "postgres". bdrdemo=# bdrdemo=# select * from names; user_id | username | email ---------+--------------+--------------------------- 1 | ravichandran | [email protected] (1 row) voila. A simple way to set up active-active replication in Postgres. postgres docker bdr var disqus_config = function () { }; (function() { if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) { document.getElementById('disqus_thread').innerHTML = 'Disqus comments not available by default when the website is previewed locally.'; return; } var d = document, s = d.createElement('script'); s.async = true; s.src = '//' + "viggy28-dev" + '.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus Related How to dockerize a python application'''
