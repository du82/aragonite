["https://viggy28.dev/article/postgres-v16-icu-installation-issue"]
title = "Home  | Postgres v16 installation issues wrt ICU"
description = "ICU library issue on MacOS when installing Postgres v16"
full_description = '''ARTICLES Postgres v16 installation issues wrt ICU November 20, 2023 - 3 minutes read - 447 words I was trying to play with Phil’s pgtam and the first step is that to install Postgres version 16. Sounds fairly innocous. When I ran configure, I was getting the below error: checking for icu-uc icu-i18n... no configure: error: ICU library not found If you have ICU already installed, see config.log for details on the failure. It is possible the compiler isn't looking in the proper directory. Use --without-icu to disable ICU support. Obviously, one solution is to disable ICU support as recommended by the error message. However, that’s an anti-feature as per the Postgres documentation. So, my next question is how to build and install Postgres 16 with ICU support on Mac. FWIW, I have built Postgres multiple times in the past and I haven’t ran into this issue. So, it is likely with version 16. Also, I did a customary Google search and ran into this Stackoverflow answer which mentions something to do with v16. So, I started checking PG16 release log and noticed the below. PostgreSQL 16 improves general support for text collations, which provide rules for how text is sorted. PostgreSQL 16 builds with ICU support by default, determines the default ICU locale from the environment, and allows users to define custom ICU collation rules. That explained why I am noticing the error “NOW” and not in the past. PG16 builds with ICU support by default. I started digging into how to pass the right path to Postgres while building it. A simple grep showed the files I should be playing with. Adding any debug message on configure.ac actually didn’t print anything to my stdout. Probably that’s for another day. [16:25:52] viggy28:postgres git:(v16.1*) $ rg "icu-uc" --files-with-matches * meson.build configure.ac configure config.log In configure, I noticed the following assigned. pkg_cv_ICU_CFLAGS=`$PKG_CONFIG --cflags "icu-uc icu-i18n"` I found the value of PKG_CONFIG to /usr/local/bin/pkg-config. So running /usr/local/bin/pkg-config --cflags "icu-uc icu-i18n" yielded the following error. [16:34:47] viggy28:viggy28.dev git:(article/pg16-installation-icu*) $ /usr/local/bin/pkg-config --cflags "icu-uc icu-i18n" Package icu-uc was not found in the pkg-config search path. Perhaps you should add the directory containing `icu-uc.pc' to the PKG_CONFIG_PATH environment variable No package 'icu-uc' found Package icu-i18n was not found in the pkg-config search path. Perhaps you should add the directory containing `icu-i18n.pc' to the PKG_CONFIG_PATH environment variable No package 'icu-i18n' found A simple find for the file icu-uc.pc resulted in the directory /usr/local/Cellar/icu4c/73.2/lib/pkgconfig/. Setting export PKG_CONFIG_PATH=/usr/local/opt/icu4c/lib/pkgconfig/ and then running configure built the postgres with ICU support. Note: This was an issue with MacOS intel chip. I ran into the same on Arm chip too. To fix this issue the path needs to be modified slighty. It could also be in other directory depends on where icu4c package is installed. export PKG_CONFIG_PATH=/opt/homebrew/Cellar/icu4c/74.2/lib/pkgconfig/ postgres C var disqus_config = function () { }; (function() { if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) { document.getElementById('disqus_thread').innerHTML = 'Disqus comments not available by default when the website is previewed locally.'; return; } var d = document, s = d.createElement('script'); s.async = true; s.src = '//' + "viggy28-dev" + '.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus Related Postgres at the edge Performance isolation in multi-tenant DB Challenges of Building in-house RDS HAProxy Conference 2022 at Paris pglite Postgres pg_rewind gotcha Citus Data - How it enables distributed postgres Postgres schema migration gotchas Postgres logging Understanding libpq in Postgres, Debian and Go go context Part 2/2: How to set up HAProxy for an active-active postgres databases Part 1/2: How to set up active-active replication in postgres using BDR'''
