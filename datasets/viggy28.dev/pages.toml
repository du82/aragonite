full_description = '''TALKS HAProxy Conference 2022 at Paris April 25, 2023 - 1 minutes read - 125 words Abstract This talk explores how Cloudflare uses HAProxy for health checks, load balancing and reading traffic among nodes set up with Postgres streaming replication in hot standby mode. Cloudflare operates multiple Postgres Clusters across four data centers, and all of these clusters are made up of six nodes. During a primary failure, Cloudflare’s high availability system promotes a replica to become a primary, and HAProxy makes sure there is no write traffic between two primaries to avoid a split-brain scenario. The presentation also explores how HAProxy helps improve Cloudflare’s security by encrypting traffic between data centers using SSL, ensuring no traffic across data centers is clear text. Slides for the presentation Recordings of the presentation Link from HAProxy website Blog on Cloudflare about performance isolation postgres var disqus_config = function () { }; (function() { if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) { document.getElementById('disqus_thread').innerHTML = 'Disqus comments not available by default when the website is previewed locally.'; return; } var d = document, s = d.createElement('script'); s.async = true; s.src = '//' + "viggy28-dev" + '.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus Related pglite Postgres pg_rewind gotcha Citus Data - How it enables distributed postgres Postgres schema migration gotchas Postgres logging Understanding libpq in Postgres, Debian and Go go context Part 2/2: How to set up HAProxy for an active-active postgres databases Part 1/2: How to set up active-active replication in postgres using BDR'''
