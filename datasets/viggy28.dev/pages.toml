description = "Functional options in Go"
full_description = '''TIL functional options November 4, 2021 - 1 minutes read - 173 words I saw this pattern of a function taking optional parameters (variadic arguments) and I never understood why they do that until today. There is a bit of a background on why I need to use functional pattern. Let’s say I don’t use functional option. Then, all the arguments need to be passed. Also, difficult to set default values and implement logic for default values. package main import ( "fmt" "log" ) type Config struct { Host string Port uint Visibility bool } type clientOption func(c *Config) error func newConfig(host string, opts ...clientOption) Config { c := Config{ Host: host, } for _, option := range opts { err := option(&c) if err != nil { log.Printf("error %v", err) } } return c } func withPort(port uint) clientOption { return func(c *Config) error { if port > 65000 { return fmt.Errorf("port can't be higher than 65000") } c.Port = port if c.Port == 0 { c.Port = 5432 } return nil } } func main() { c := newConfig("localhost", withPort(100000)) fmt.Println("config: ", c) } go var disqus_config = function () { }; (function() { if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) { document.getElementById('disqus_thread').innerHTML = 'Disqus comments not available by default when the website is previewed locally.'; return; } var d = document, s = d.createElement('script'); s.async = true; s.src = '//' + "viggy28-dev" + '.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus Related Context in go go context'''
