["https://viggy28.dev/article/postgres-schema-migration"]
title = "Home  | Postgres schema migration gotchas"
description = "A living doc on lessons learnt around postgres schema migrations"
full_description = '''ARTICLES Postgres schema migration gotchas June 2, 2022 - 1 minutes read - 144 words Capturing thoughts from https://twitter.com/viggy28/status/1530800893842444289 When you are doing major DML changes, other than locks one more thing to keep in mind is replication lag. Especially if you use your replicas in hot standby mode. When you need to delete most of the records in a massive table, its better to create a new table and just copy the records that you need to preserve. When you need to delete all the records in a massive table, just truncate it instead of deleting them. Don’t run the same migration from multiple sessions or pods. If your tooling is robust it won’t happen in the first place. More nuanced one. If you are using PgBouncer in transaction mode, then the settings you need on session-level won’t be available. For eg. create index. Setting statement_timeout and running create index. Run it directly on Postgres. References: 1. https://postgres.ai/blog/20220525-common-db-schema-change-mistakes postgres migration var disqus_config = function () { }; (function() { if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) { document.getElementById('disqus_thread').innerHTML = 'Disqus comments not available by default when the website is previewed locally.'; return; } var d = document, s = d.createElement('script'); s.async = true; s.src = '//' + "viggy28-dev" + '.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus Related Postgres logging Understanding libpq in Postgres, Debian and Go go context Part 2/2: How to set up HAProxy for an active-active postgres databases Part 1/2: How to set up active-active replication in postgres using BDR'''
