["https://viggy28.dev/article/libpq-postgres-go"]
title = "Home  | Understanding libpq in Postgres, Debian and Go"
description = "My learnings on what is libpq and how's that related to postgres"
full_description = '''ARTICLES Understanding libpq in Postgres, Debian and Go May 5, 2021 - 4 minutes read - 648 words Libpq-Postgres-Go After I started working on Postgres, I have heard this term libpq enough times, but never had a good grasp of it. After digging around this topic for a couple of days, here is my understanding. From the Postgres doc https://www.postgresql.org/docs/9.5/libpq.html, libpq is the C application programmer’s interface to PostgreSQL. libpq is a set of library functions that allow client programs to pass queries to the PostgreSQL backend server and to receive the results of these queries Okay, its an API to Postgres written in C Where is its source code? Its actually in the same repo as Postgres https://github.com/postgres/postgres/tree/master/src/backend/libpq client programs like psql , pg_basebackup etc.. to connect to Postgres libpq is also the underlying engine for several other PostgreSQL application interfaces, including those written for C++, Perl, Python, Tcl and ECPG. I checked python, it looks like psycopg2 is a popular package that’s recommended to connect to Postgres. From the earlier link Psycopg 2 is mostly implemented in C as a libpq wrapper, Going back to libpq documentation, Client programs that use libpq must include the header file libpq-fe.h and must link with the libpq library. Source of the header file: https://github.com/postgres/postgres/blob/master/src/interfaces/libpq/libpq-fe.h Its been a long time since I dealt with C, so I needed a primer on what is header file. @flaviocopes has a good article on this https://flaviocopes.com/c-header-files/ Here is an example of how to include this header file in a C program #include <stdio.h> #include <libpq-fe.h> int main() { int lib_ver = PQlibVersion(); printf("Version of libpq: %d\n", lib_ver); return 0; } Ref: https://zetcode.com/db/postgresqlc/ So far so good, but if you try to run this program likely you will get an error that header file doesn’t exist. Enter libpq-dev - A debian package that provides header files. You can see what are the files that this package contains https://packages.debian.org/stretch/amd64/libpq-dev/filelist At the same time, I stumbled upon another debian package libpq5 wondering what does that does compared to libpq-dev. That got cleared when I installed postgresql-client. It requires libpq5. So, yeah libpq5 is the C API (libpq) that we saw very first of this note. Don’t know why its been named as libpq5 and why not just libpq. libpq-dev is the development package required if you are writing your own client program (like the above example C program) to connect to Postgres. I am mostly writing code in Go these days and while connecting to Postgres I use the package lib/pq along with the standard sql package. I wondered how’s the lib/pq package connects to Postgres. It doesn’t Have any C libpq related library It doesn’t make any system related calls. There is another package go-libpq, which cgo. Basically, it calls the actual libpq functions. db := C.PQconnectdb(params) if C.PQstatus(db) != C.CONNECTION_OK { defer C.PQfinish(db) return nil, errors.New("libpq: connection error " + C.GoString(C.PQerrorMessage(db))) } Also, it imports the libpq-fe.h . Remember the header file that we saw in another example package libpq /* #include <stdlib.h> #include <libpq-fe.h> */ import "C" I posted the question in a forum and I have been told The PostgreSQL wire protocol is openly documented (and not very complex). It can be implemented in an arbitrary language, there is no force to use the “official” C library. As for system calls, a database driver typically needs only to open a TCP connection, read and write from/to it, and close it when work is finished. In Go, this usually done with the Dial() function of the “net” package. The returned type (Conn) has Read(), Write() and Close() methods. There is no need to make direct system calls from a database driver. That made sense, since I did see the Dial() functions and TCP calls in the lib/pq package. Did a G-search and found the wire protocol documentation https://www.postgresql.org/docs/current/protocol.html. As a continuation, I would like to understand the protocol and implement a simple version of this driver (just for fun) one day. postgres c Go var disqus_config = function () { }; (function() { if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) != -1) { document.getElementById('disqus_thread').innerHTML = 'Disqus comments not available by default when the website is previewed locally.'; return; } var d = document, s = d.createElement('script'); s.async = true; s.src = '//' + "viggy28-dev" + '.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> comments powered by Disqus Related go context Part 2/2: How to set up HAProxy for an active-active postgres databases Part 1/2: How to set up active-active replication in postgres using BDR Embedded field in Go all goroutines are asleep - deadlock!'''
