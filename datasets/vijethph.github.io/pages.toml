79;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}} .css-vehe2z{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-vehe2z{font-size:1rem;}}@media screen and (min-width: 768px){.css-vehe2z{font-size:1.25rem;}}.css-z0logh{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}You don't need to multitask. You don't need 24/7 entertainment. Entertainment is what you make it. All those YouTubers don't have much to say that is relevant to you anyway - you're not missing out on anything. Music is best enjoyed in peace and without distractions, you don't need to reduce it to mere background noise. New information is best processed in peace and without distractions. Spamming memes to friends is not quality communication, so you might as well quit it. .css-1loxung{border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;}.css-1loxung p{font-style:italic;}.css-m9jm23{border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;}.css-m9jm23 p{font-style:italic;}.css-m9jm23 p{font-style:italic;} Do one thing at a time. Relax. There is time for everything that's really important and what's not important you can simply ignore. What? You already have work to do, but you're distracted? Internet browsing won't help you there. Go out for a brisk 5-minute walk. Or do 20 pushups if you're at home. Or have a glass of water. Or close your eyes for a minute. Then return to what you were doing before you got distracted. If you're feeling tired, then slow down rather than overloading your brain with even more information. Focus on the little details of what you're doing, if you find yourself stuck and unable to think. Reorganize your desk. Do something, just don't resort to mindless browsing. You know mindless browsing won't feel good, and you know you have other things you want to do that will make you feel good. Do them. Don't browse. You don't have work to do? There is always housework to be done and browsing won't do your chores. Tidy up the house & clean. Throw away things you don't need anymore. Go out shopping for things that you do need right now. Cook. Chores all done? Study to get better at what you're doing. Regardless of what you're doing, there are always new areas to improve in. Need a break from studying? Call friends to meet up, or go out to meet new people. Go have a beer in the bar, even if you don't plan on meeting anyone - just be around people for a while. People suck? Books don't. Read for pleasure. Go visit the library. Write a review for the last book you read. Books are boring? Go to the movies, go to theatre, go to a concert, go to an art gallery or a museum. Or just go out alone for a walk. Rainy day? No money for tickets? Listen to music but don't multitask - focus all your attention on what you're listening to. Heard all your albums a hundred times over? Improve your foreign language skills. Not planning to travel any time soon? Play some guitar. Neighbors complaining? Watch a film or TV series but really watch it - don't be on your phone while you're watching. Nothing good to see? Play something. What? You don't feel like doing anything? Take an actual nap, instead of burning yourself out even more by browsing. Write about your day in your diary (make a diary if you don't have one). Reflect on what happened today. Check what you have coming for tomorrow. Meditate. Take a shower. Relax, man. .css-igtsiw{background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;}.css-1ve732v{background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;} .css-90ntna{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-90ntna{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-90ntna{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-90ntna{font-size:2.25rem;}}.css-1h962gv{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}