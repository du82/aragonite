em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}ಬಯಸಿದ್ದೆಲ್ಲಾ ಸಿಗುವಂತಿದ್ದರೆ ಬಯಕೆಗೆ ಬೆಲೆ ಇರುತ್ತಿರಲಿಲ್ಲ ಅನಿಸಿದ್ದೆಲ್ಲಾ ಹೇಳುವಂತಿದ್ದರೆ ಮೌನಕ್ಕೆ ಅರ್ಥ ಇರುತ್ತಿರಲಿಲ್ಲ ತಪ್ಪುಗಳೇ ಆಗದಿದ್ದರೆ ಹೊಸ ಪ್ರಯತ್ನಪಡುತ್ತಿರಲಿಲ್ಲ ಕಣ್ಣೀರೇ ಬರದಿದ್ದರೆ ನಗುವಿನ ಆನಂದ ತಿಳಿಯುತ್ತಿರಲಿಲ್ಲ ಕಷ್ಟಗಳೇ ಎದುರಾಗದಿದ್ದರೆ ಜೀವನದ ಮೌಲ್ಯ ಗೊತ್ತಾಗುತ್ತಿರಲಿಲ್ಲ ಯೌವನ ಬಂದರೆ ಸಾಲದು, ದುಡಿಯುವ ಮನಸ್ಸು ಬರಬೇಕು ಉದ್ಯೋಗ ಹಿಡಿದರೆ ಸಾಲದು, ಪ್ರಾಮಾಣಿಕ ದುಡಿಮೆ ಬೇಕು ಮದುವೆಯಾದರೆ ಸಾಲದು, ಹೊಂದಾಣಿಕೆಯಿರಬೇಕು ಮನೆ ಕಟ್ಟಿದರೆ ಸಾಲದು, ಮನುಷ್ಯನಾಗಬೇಕು ನೀತಿ ಇದ್ದರೆ ಸಾಲದು, ಜಾತಿ ಬಿಡಬೇಕು .css-igtsiw{background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;}.css-1ve732v{background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;} Sanskrit Quotes अनुगन्तुं सतां वर्त्म कृत्स्नं यदि न शक्यते । स्वल्पमप्यनुगन्तव्यम् मार्गस्थो नावसीदति ॥ न चोरहार्यं न च राजहार्यम् न भ्रातृभाज्यं न च भारकारी । व्यये कृते वर्धत एव नित्यम् विद्याधनं सर्वधनप्रधानम् ॥ सुखस्य दुःखस्य न कोऽपि दाता परो ददातीति कुबुद्धिरेषा । अहं करोमीति वृथाभिमानः स्वकर्मसूत्रग्रथितो हि लोकः ॥ मनीषिणः सन्ति न ते हितैषिणः हितैषिणः सन्ति न ते मनीषिणः । सुहृच्च विद्वानपि दुर्लभो नृणां यथौषधं स्वादु हितं च दुर्लभम् ॥ मनसा चिन्तितं कार्यं वाचा नैव प्रकाशयेत् । मन्त्रवत् रक्षयेत् गूढं कार्ये चापि नियोजयेत् ॥ विषयामिषलोभेन मनः प्रेरयतीन्द्रियम् । तन्निरुन्ध्यात् प्रयत्नेन जिते तस्मिन् जितेन्द्रियः ॥ आलस्यम् हि मनुष्याणाम् शरीरस्थो महान् रिपुः । नास्त्युद्यमसमो बंधुः कुर्वाणो नावसीदति ॥ Credits and Attributions: Sanskrit Text Books Kannada Text Books"
