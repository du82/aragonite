in-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}} A man's brain originally is like a little empty attic, and you have to stock it with such furniture as you choose. A fool takes in all the lumber of every sort that he comes across, so that the knowledge which might be useful to him gets crowded out, or at best is jumbled up with a lot of other things so that he has a difficulty in laying his hands upon it. Now, the skilful workman is very careful indeed as to what he takes into his brain-attic. He will have nothing but the tools which may help him in doing his work, but of these he has a large assortment, and all in the most perfect order. In solving a problem of any sort, the grand thing is to be able to reason backwards. A change of work is the best rest. To a great mind, nothing is little. The ideal reasoner would, when he had once been shown a single fact in all its bearings, deduce from it, not only all the chain of events which led up to it, but also all the results which would follow from it. As Cuvier could correctly describe a whole animal by the contemplation of a single bone, so the observer who has thoroughly understood one link in a series of incidents should be able to accurately state all the other ones, both before and after. To carry the art of solving problems, however, to its highest pitch, it is necessary that the reasoner should be able to utilize all the facts which have come to his knowledge; and this in itself implies a possession of all knowledge, which, even in these days of free education and encyclopedieas, is a somewhat rare accomplishment. A man should keep his little brain-attic stocked with all the furniture that he is likely to use, and the rest he can put away in the lumber room of his library, where he can get it if he wants it. It is an old maxim that when you have excluded / eliminated all which is impossible, whatever remains, however improbable, must be the truth. It is of the highest importance in the art of detection to be able to recognize, out of a number of facts, which are incidental and which vital. Otherwise your energy and attention must be dissipated instead of being concentrated. To the logician, all things should be seen exactly as they are, and to underestimate one's self is as much as a departure from truth as to exaggerate one's own powers. It is not really difficult to construct a series of inferences, each dependent upon its predecessor and each simple in itself. If, after doing so, one simply knocks out all the central inferences and presents one's audience with the starting point and the conclusion, one may produce a startling, though possibly a meretricious, effect. One of the important rules of criminal investigation: one should always look for a possible alternative, and provide against it. The more outre and grotesque an incident is, the more carefully it deserves to be examined, and the very point which appears to complicate a case is, when duly considered and scientifically handled, the one which is most likely to elucidate it. You'll get results by always putting yourself in the other fellow's place, and thinking what you would do yourself; it takes some imagination, but it pays. Mediocrity knows nothing higher than itself; but talent instantly recognizes genius. Crime is common. Logic is rare. Therefore it is upon the logic rather than upon the crime that you should dwell. .css-11bn2j6{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-11bn2j6{font-size:1.5rem;}}@media screen an