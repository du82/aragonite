herit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}Introduction .css-vehe2z{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-vehe2z{font-size:1rem;}}@media screen and (min-width: 768px){.css-vehe2z{font-size:1.25rem;}}.css-z0logh{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}Design patterns are typically split into three categories, and this is called Gamma Categorization. The three categories are: .css-rc057y li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-rc057y li{font-size:1rem;}}@media screen and (min-width: 768px){.css-rc057y li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}} Creational Patterns - deal with the creation (construction) of objects. Explicit (constructor) vs. implicit (DI, reflection, etc.). Wholesale (single statement) vs. piecewise (step-by-step). Structural Patterns - concerned with the structure (e.g., class members). Many patterns are wrappers that mimic the underlying class' interface. They strees the importance of good API design. Behavioural Patterns - they are all different; they do not have a lot in common. They are concerned with algorithms and the assignment of responsibilities between objects. They help objects communicate with each other. .css-11bn2j6{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-11bn2j6{font-size:1.875rem;}}.css-ns8t27{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}Single Responsibility Principle / Separation of Concern If we have a class, the class should have its primary responsibility (whatever it is meant to be doing) and it should not take on other responsibilities. Do not overload objects with too many responsibilities. Antipattern: God object - putting everything into a kitchen sink-like single class. This principle prevents us from creating such God objects. It enforces the idea that a class should have a single reason to change and that change should be somehow related to its primary responsibility. Separation of concerns means different classes handling different, independent tasks / problems. Open/Closed Principle Open for extension, closed for modification. We should be able to extend a class's behavior and add new features without modifying it. We should strive to write code that doesn't have to be modified every time the requirements change. This principle is achieved by using interfaces and abstract classes. We can extend the behavior of a class by writing a new class that implements the same interface or extends the same abstract class. Breaking this principle causes state space explosion. Example: if we have a class that has a lot of if/else statements, we have to test all of the possible combinations of the if/else statements. We can avoid this by using polymorphism and inheritance. Liskov Substitution Principle Objects in a program should be replaceable with instances of their subtypes without altering the correctness of that program. If we have a class A and a class B that extends A, we should be able to replace A with B without breaking the program. If we have an interface that has some sort of a base class, we should be able to add a derived class without breaking the program. This principle is closely related to the Open/Closed Principle. If we have a class A and a class B that extends A, we should be able to extend the behavior of A by writing a new class C that extends B. We should be able to do this without modifying the code of A or B. Interface Segregation Principle Clients should not be forced to depend on methods that they do not use. If we have an interface that has a lot of methods, we should split it into smaller interfaces. This principle is closely related to the Single Responsibility Principle. If we have a class that implements an interface, we should not force the class to implement methods that it does not need. Dependency Inversion Principle High-level modules should not depend on low-level modules. Both should depend on abstractions. Abstractions should not depend on details. Details should depend on abstractions. If we have a class that depends on another class, we should not depend on the concrete implementation of that class. We should depend on an abstraction of that class. This principle is achieved by using interfaces and abstract classes. Builder Pattern Having objects created with 10 or more initializer arguments is not productive. Instead, opt for piecewise construction. Builder provides an API for constructing an object step-by-step. It allows you to produce different types and representations of an object using the same construction code. When piecewise object construction is complicated, provide an API for doing it succinctly. A builder is a separate component for building an object. It can either give builder an initializer or return it via static function. To make builder fluent, return self. Different facets of an object can be built with different builders working in tandem via a base class. Factory Pattern Sometimes object creation logic becomes too convoluted. Initializers are not always descriptive, and they cannot be overloaded with same set of arguments with different names. Wholesale object creation (non-piecewise, unlike Builder) can be outsourced to a separate method (Factory Method) or something that may exist in a separate class (Factory). It is possible to create hierarchy of factories with Abstract Factory. A factory is a component responsible solely for the wholesale (not piecewise) creation of objects. It is essentially the implementation of idea of single responsibility principle or separation of concerns. In most cases a factory is just a separate class which is full of factory methods, not necessarily static ones that allow us to create objects. It can be external or reside inside the object as an inner class. Hierarchies of factories can be used to create related objects. Abstract Factory Pattern Abstract Factory offers the interface for creating a family of related objects, without explicitly specifying their classes. It is a way to encapsulate a group of individual factories that have a common theme without specifying their concrete classes. If we have a hierarchy of types, then we can have a corresponding hierarchy of factories which creates those types. Prototype Pattern An existing (partially or fully constructed) design is a Prototype. We make a copy (clone / deep copy) the prototype and customize it. We make the cloning convenient (e.g., via a Factory). So, a Prototype is a partially or fully initialized object that you copy (clone) and make use of. To implement a prototype, partially construct an object and store it somewhere. Deep copy the prototype and customize the result. A factory provides a convenient API for using prototypes. Singleton Pattern For some components it only makes sense to have one in the system (e.g., database repository, object factory). Example, the constructor call is expensive, which should be done only once, and everyone should be provided with the same instance. We would want to prevent anyone creating additional copies. Need to take care of lazy instantiation and thread safety. All of this can be achieved by making the constructor private and creating a static creation method. Singleton is a component which is instantiated only once. It is achieved by making the constructor private. It is not a good idea to use singletons because they are essentially global variables. They are not testable and they make code tightly coupled. They are essentially a fancy way of creating global variables. Different realizations of Singleton: custom allocator, decorator, metaclass, monostate, etc. Monostate is a variation of the singleton where we put all the state of an object into a static variable, but at the same time we allow people to create new objects, thereby making new instances which all access the same state. Adapter Pattern Adapter allows us to use an existing interface to be used from another interface. It often involves a wrapper with a conversion of interface. It is a construct which adapts an existing interface X to conform to the required interface Y. Implementing an Adapter is easy: determine the API you have and the API you need. Create a component which aggregates (has a reference to, ...) the adaptee. Intermediate representations can pile up: use caching and other optimizations. Bridge Pattern Bridge prevents a 'Cartesian product' complexity explosion. Example: base class ThreadScheduler, derived classes: LinuxThreadScheduler, WindowsThreadScheduler, MacThreadScheduler, etc. We can have a base class ThreadScheduler and a base class ThreadSchedulerImpl. ThreadSchedulerImpl can have derived classes: LinuxThreadSchedulerImpl, WindowsThreadSchedulerImpl, MacThreadSchedulerImpl, etc. ThreadScheduler can have a reference to ThreadSchedulerImpl. This way we can avoid the 'Cartesian product' complexity explosion. Bridge is a mechanism that decouples an interface (hierarchy) from an implementation (hierarchy). It is useful when we have an interface and a different implementation. We can have a base class and a derived class. The base class can have a reference to the derived class. The idea of the bridge is to decouple abstraction from implementation. Both can exist as hierarchies, and there is a bridge between them which is a stronger form of encapsulation. Composite Pattern The goal of the composite design pattern is to tread individual components and groups of objects in a uniform fashion, so to provide an identical interface over both aggregates of components as well as individual components. Objects use other objects' fields/properties/members through inheritance and composition. Some composed and singular objects need similar/ identical behaviors. Composition lets us make compound objects. Composite design pattern is used to treat both single (scalar) and composite objects uniformly. It is a mechanism for treating individual (scalar) objects and compositions of objects in a uniform manner. Python supports iteration with __iter__ and the Iterable ABC. A single object can make itself iterable by yielding self from __iter__. Decorator Pattern It exists so that we can add additional b"
