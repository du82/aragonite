description = "The Feynman Technique is a method of learning that is incredibly effective for deep understanding and information retention."
full_description = ".css-w1q1hj{box-sizing:border-box;margin:0;min-width:0;font-family:inherit;font-weight:700;line-height:1.25;font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.875rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-w1q1hj{font-size:2.25rem;}}@media screen and (min-width: 768px){.css-w1q1hj{font-size:2.25rem;}}@media screen and (min-width: 1024px){.css-w1q1hj{font-size:3rem;}}The Feynman Technique.css-15ce8we{color:var(--theme-ui-colors-secondary);margin-top:1rem;font-size:1rem;}.css-15ce8we a{color:var(--theme-ui-colors-secondary);}@media screen and (min-width: 640px){.css-15ce8we{font-size:1rem;}}@media screen and (min-width: 768px){.css-15ce8we{font-size:1.25rem;}}25.10.2020 — Technique, Memorization, Information — 4 min read.css-1mae7sn{margin-top:4rem;margin-bottom:4rem;}.css-1mae7sn .gatsby-resp-image-wrapper{margin-top:2rem;margin-bottom:2rem;border-radius:4px;box-shadow:rgba(0, 0, 0, 0.1) 0px 16px 16px 0px,rgba(0, 0, 0, 0.1) 0px 8px 8px 0px,rgba(0, 0, 0, 0.1) 0px 4px 4px 0px;}@media screen and (min-width: 640px){.css-1mae7sn .gatsby-resp-image-wrapper{margin-top:2rem;margin-bottom:2rem;}}@media screen and (min-width: 768px){.css-1mae7sn .gatsby-resp-image-wrapper{margin-top:4rem;margin-bottom:4rem;}}.css-1mae7sn .gatsby-resp-image-wrapper .gatsby-resp-image-image{border-radius:4px;}.css-1mae7sn figure{margin:0;}.css-1mae7sn figure img{border-radius:4px;box-shadow:0 10px 15px -3px rgba(0, 0, 0, 0.1),0 4px 6px -2px rgba(0, 0, 0, 0.05);max-width:100%;}.css-vehe2z{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-vehe2z{font-size:1rem;}}@media screen and (min-width: 768px){.css-vehe2z{font-size:1.25rem;}}.css-z0logh{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}The Feynman Technique is a method of learning that is incredibly effective for deep understanding and information retention. How many time have you learned something fast only to forget how to do it weeks later? Maybe it was the Pythagoras theorem, back in high school when you crammed for your math exam. Now when you friend asks you to recite it, all you can do is shrug and say “What the fuck is that? A Harry Potter spell?” The problem was that you never learned the thing properly, you simply stored it in the temporary storage section of your brain. This is how many people go about learning, reciting things only to forget them later. .css-1loxung{border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;}.css-1loxung p{font-style:italic;}.css-m9jm23{border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;}.css-m9jm23 p{font-style:italic;}.css-m9jm23 p{font-style:italic;} There is a big difference between knowledge and wisdom: knowledge is having the information, wisdom is knowing how to use it. The Feynman Technique is a mental model that will help you gain sufficient wisdom in any endeavour. Richard Feynman was a Noble Prize-winning theoretical physicist who was best known for his work in the fields of quantum mechanics, quantum electrodynamics, superfluidity and other groovy shit. To say the least his was a smart dude, he was often called the ‘Great Explainer’ for his uncanny ability to teach complicated principles in layman terms that everybody could understand. Feynman claims that he wasn’t a naturally gifted physicist but managed to make it due to his learning style and hard work. Here is his notorious method for accelerated understanding. .css-11bn2j6{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-11bn2j6{font-size:1.875rem;}}.css-ns8t27{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}Step One: Write the name of a concept that you want to learn about on top of a blank piece of paper. Step Two: Write down an explanation of the concept using plain English. Pretend that you trying to teach it to the slowest person you know or a child. Assume the person has no idea what the hell you are talking about so make sure you cover everything you know simply. Step Three: Read over your explanation and take note of the areas in which you are lacking the sufficient knowledge in order to articulate yourself properly. Take note of these areas and return to your source material until you have a better understanding Use a variety of materials: YouTube videos, books, and experts. Return to step two and simplify further. Note: When you simply you are cutting out the slack, do not remove things that are important for understanding whatever you trying to learn. You are simply trying to be more concise. Step Four: Use the aid of simple analogies, diagrams, metaphors and anything else that can help you commit what you have learned to memory. Come at it from different angles to gain a deeper understanding of the topics. Einstein is often attributed to saying: “If you can’t explain it simply, you don’t understand it well enough” The Feynman Technique will ensure that you understand any subject incredibly well. .css-igtsiw{background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;}.css-1ve732v{background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;background-color:var(--theme-ui-colors-muted);border:0;height:1px;margin:1rem;margin-left:0;margin-right:0;} .css-90ntna{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-90ntna{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-90ntna{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-90ntna{font-size:2.25rem;}}.css-1h962gv{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}What Can You Learn Using The Method? To put it simply you can learn anything with the method from: .css-rc057y li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-rc057y li{font-size:1rem;}}@media screen and (min-width: 768px){.css-rc057y li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}} Computer Programming Calculus Physics Economics Chemistry Mathematics Anything at all! You might have to modify the method slightly for some disciplines but the main underlying principle is what makes the method so effective. Why it works: The Feynman Technique works for many reasons. Often when we are trying to learn new concepts we erroneously assume that we have learned them and understood them when in actuality we haven’t fully grasped the concepts. Feynman once said: “The first principle is that you must not fool yourself and you are the easiest person to fool.” This is the first and most critical mistake that many make when trying to learn new things. Writing what you know and trying to simplify it exposes your gaps in understanding. The second reason it works is through the beauty of neural connections. Think back to 2 weeks ago when you went grocery shopping. Can you remember what you bought or what happened at the shops? Most likely not, your brain does not put much stock into the mundane. Now let’s assume 2 weeks ago you were shopping and you saw three firefighters running towards to deli section. Now that’s a memory you won’t forget, you might remember it for the rest of your life because it was out of the ordinary. The strongest neural connections are always formed with things that are out of the ordinary. This is why you can remember what you were doing when you heard about 9/11 or can vividly recall your first kiss. Now when you are learning and are up to step 4. You are forced to come up with analogies and metaphors to help you understand concepts. This simple process is out of the ordinary and allows your brain to have more stimulus to work with, more checkpoints to return to when you trying to recall a piece of information. Acknowledgements: I .css-1d2wwf6{color:var(--theme-ui-colors-primary);-webkit-text-decoration:none;text-decoration:none;}.css-1d2wwf6:hover{-webkit-text-decoration:underline;text-decoration:underline;}.css-1diwg7s{color:var(--theme-ui-colors-primary);-webkit-text-decoration:none;text-decoration:none;color:var(--theme-ui-colors-primary);-webkit-text-decoration:none;text-decoration:none;}.css-1diwg7s:hover{-webkit-text-decoration:underline;text-decoration:underline;}.css-1diwg7s:hover{-webkit-text-decoration:underline;text-decoration:underline;}(@vijethph) just found this while browsing Reddit, thought it was good, and put up here with some modifications of my own. The original work and credit all go to whoever posted this up on Reddit (I don't know their name). So, I thank them for sharing this valuable material."
