h:4px;margin-left:0;margin-right:0;padding-left:2rem;}.css-m9jm23 p{font-style:italic;}.css-m9jm23 p{font-style:italic;} .css-vehe2z{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-vehe2z{font-size:1rem;}}@media screen and (min-width: 768px){.css-vehe2z{font-size:1.25rem;}}.css-z0logh{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}This post is under work in progress, and hence, isn't complete yet. .css-90ntna{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-90ntna{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-90ntna{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-90ntna{font-size:2.25rem;}}.css-1h962gv{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}Introduction Git is a distributed version control and source code management system, originally created by Linus Torvalds in 2005. Unlike older centralized version control systems such as SVN and CVS, Git is distributed: every developer has the full history of their code repository locally. This makes the initial clone of the repository slower, but subsequent operations such as commit, blame, diff, merge, and log dramatically faster. It does this through a series of snapshots of your project, and it works with those snapshots to provide you with functionality to version and manage your source code. Versioning Concepts Version control is a system that records changes to a file(s), over time. As you modify files, the version control system records and saves each change. This allows you to restore a previous version of your code at any time. .css-11bn2j6{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-11bn2j6{font-size:1.875rem;}}.css-ns8t27{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}Centralized Versioning vs. Distributed Versioning .css-rc057y li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-rc057y li{font-size:1rem;}}@media screen and (min-width: 768px){.css-rc057y li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}} Centralized version control focuses on synchronizing, tracking, and backing up files. Distributed version control focuses on sharing changes. Every change has a unique id. Distributed systems have no defined structure. You could easily have a SVN style, centralized system, with git. Git Architecture Repository - A set of files, directories, historical records, commits, and heads. Imagine it as a source code data structure, with the attribute that each source code “element” gives you access to its revision history, among other things. It holds all of the commits — a snapshot of all your files at a point in time — that have been made. You can access the commit history with the Git log A git repository is comprised of the .git directory & working tree. .git Directory (component of repository) - The .git directory contains all the configurations, logs, branches, HEAD, and more. Detailed List. Working Tree (component of repository) -This is basically the directories and files in your repository. It is often referred to as your working directory. Index (component of .git dir) - The Index is the staging area in git. It’s basically a layer that separates your working tree from the Git repository. This gives developers more power over what gets sent to the Git repository. The index compares the files in the working tree to the files in the repo. When you make a change in the working tree, the index marks the file as modified before it is committed. Commit - A git commit is a snapshot of a set of changes, or manipulations to your Working Tree. For example, if you added 5 files, and removed 2 others, these changes will be contained in a commit (or snapshot). This commit can then be pushed to other repositories, or not! Branch - A branch is essentially a pointer to the last commit you made. As you go on committing, this pointer will automatically update to point to the latest commit. Tag - A tag is a mark on specific point in history. Typically people use this functionality to mark release points (v1.0, and so on). HEAD and head (component of .git dir) - HEAD is a pointer that points to the current branch. A repository only has 1 active HEAD. head is a pointer that points to any commit. A repository can have any number of heads. HEAD branch is the currently 'active' or 'checked out' branch. There can only be one active branch at a time, that is HEAD branch. 99% of the time, 'working' with branches means local branches, of local repository. Remote branches are mainly for synchronizing. Bulk of the actual work happens in local branches. There are two types of Git repositories: remote and local. A remote repository is hosted on a remote, or off-site, server that is shared among multiple team members. A local repository is hosted on a local machine for an individual user. Stages of Git Modified - Changes have been made to a file but file has not been committed to Git Database yet Staged - Marks a modified file to go into your next commit snapshot Committed - Files have been committed to the Git Database The working tree is where you make changes. There you can edit files, add new files, and remove files that are no longer needed. Once a file has been changed in the working tree, it is noted as modified in the index (e.g., the staging area where new commits are prepared) where it sits between the repository and the working tree. Changes made in the working tree are not saved directly to the repository. All changes are first staged in the index and then saved in the repo. Only the files in the index are committed to the repo. Git commands Basic Git Operations git init - Creates an empty Git repository. The Git repository’s settings, stored information, and more is stored in a directory (a folder) named “.git”. git init <directory> creates empty git repo in specified directory. Run with no arguments to initialize the current directory as a git repository git help - To give you quick access to an extremely detailed guide of each command. Or to just give you a quick reminder of some semantics. git clone <repo> - clone repo located at <repo> onto local machine. Original repo can be located on the local filesystem or on a remote machine via HTTP or SSH. By default, git clone will automatically set up a local master branch that tracks the remote master branch it was cloned from. git branch <new-branch-name> - creates a new branch based on your current HEAD branch. Git will assume that new branch will be started based on the current checked out revision. To create a new branch on a different past revision, use git branch <new-branch-name> <previous/past commit hash> (8-letter commit). For new branch, git will include all past commits and files by default. For branch started on specific commit, git will include commits and files from that commit, inclusive. Creating new branches happens only in local repository. Creating branches in remote repository happens by publishing existing local branch. git checkout <other-branch> - switches to a different branch. The current / checked-out branch defines the context of work that is in at the moment. It is where new commits will be created, in that context. It updates all files in the working tree to match the version in the index, or specified tree. .css-ce1lkk{background-color:var(--theme-ui-colors-background);border:none;color:var(--theme-ui-colors-text);cursor:pointer;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";letter-spacing:0.025rem;-webkit-transition:all 0.3s ease-in-out;transition:all 0.3s ease-in-out;position:absolute;right:0;z-index:1;border-radius:0 0 0 0.25rem;padding:0.25rem 0.6rem;}@media screen and (min-width: 640px){.css-ce1lkk{font-size:14px;}}@media screen and (min-width: 768px){.css-ce1lkk{font-size:16px;}}.css-ce1lkk[disabled]{cursor:not-allowed;}.css-ce1lkk:not([disabled]):hover{background-color:var(--theme-ui-colors-primary);color:var(--theme-ui-colors-white);}Copy.css-15vf505{border:0;clip:rect(0, 0, 0, 0);height:1px;margin:-1px;overflow:hidden;padding:0;position:absolute;white-space:nowrap;width:1px;}copy code to clipboard# Checkout a repo - defaults to master branch$ git checkout # Checkout a specified branch$ git checkout branchName # Create a new branch & switch to it# equivalent to "git branch <name>; git checkout <name>"$ git checkout -b newBranch git switch <other-branch> - switches to a different branch. This differs from the checkout command. git branch -m <new-name> - renames the current HEAD branch. To rename a different branch (not the current / checked-out branch), use: Copycopy code to clipboard$ git branch -m <old-branch-name> <new-name>$ git branch # simply lists out all branches in a repository Git doesn't allow to rename remote branches usually. Renaming a remote branch involves deleting the old one and then pushing up and publishing the new one from local repository. First, delete the current / old branch. Then, simply push the new local branch with the correct name. Copycopy code to clipboard$ git push origin --delete <old-branch-name>$ git push -u origin <new-name> git push -u origin <local-branch> - 'uploads' a new branch for the first time. It is not possible to create a new branch on a remote repository, but we can publish an existing local branch on a remote repository, so we can upload what we have locally to the remote server. '-u' flag is used to establish a tracking connection, which eases pushing and pulling later. Copycopy code to clipboard# list existing branches & remotes$ git branch -a # create a new branch$ git branch myNewBranch # delete a branch$ git branch -d myBranch # rename a branch# git branch -m <oldname> <newname>$ git branch -m myBranchName myNewBranchName # edit a branch's description$ git branch myBranchName --edit-description git revert <commit> - create a new commit that undoes all of the changes made in <commit>, then apply it to the current branch. Reve'''
