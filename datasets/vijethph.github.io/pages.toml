ont-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}Introduction .css-vehe2z{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-vehe2z{font-size:1rem;}}@media screen and (min-width: 768px){.css-vehe2z{font-size:1.25rem;}}.css-z0logh{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}Databases are used to store information. We take information from some source and put it in database where it gets persisted in either memory or hard disk and we eventually retrieve that data at some point in time. Database clients are used to connect to databases. SQL is a programming language used to interact with databases. Simple database design process questions: .css-rc057y li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-rc057y li{font-size:1rem;}}@media screen and (min-width: 768px){.css-rc057y li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}} What kind of thing are we storing? What properties does this thing have? What type of data does each of those properties contain? Tables A table is a collection of records that are related to each other. A table is made up of columns and rows. Columns are also called fields and rows are also called records. A table is also called a relation. In relational databases, and flat file databases, a table is a set of data elements (values) using a model of vertical columns (identifiable by name) and horizontal rows, the cell being the unit where a row and column intersect. A table has a specified number of columns, but can have any number of rows. Columns store some information about specific properties of records. Rows represent a single, implicitly structured data item in a table. .css-11bn2j6{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-11bn2j6{font-size:1.875rem;}}.css-ns8t27{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}Creating a table and inserting data .css-ce1lkk{background-color:var(--theme-ui-colors-background);border:none;color:var(--theme-ui-colors-text);cursor:pointer;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";letter-spacing:0.025rem;-webkit-transition:all 0.3s ease-in-out;transition:all 0.3s ease-in-out;position:absolute;right:0;z-index:1;border-radius:0 0 0 0.25rem;padding:0.25rem 0.6rem;}@media screen and (min-width: 640px){.css-ce1lkk{font-size:14px;}}@media screen and (min-width: 768px){.css-ce1lkk{font-size:16px;}}.css-ce1lkk[disabled]{cursor:not-allowed;}.css-ce1lkk:not([disabled]):hover{background-color:var(--theme-ui-colors-primary);color:var(--theme-ui-colors-white);}Copy.css-15vf505{border:0;clip:rect(0, 0, 0, 0);height:1px;margin:-1px;overflow:hidden;padding:0;position:absolute;white-space:nowrap;width:1px;}copy code to clipboard-- Create a table called tablename1, with the two columns shown, for-- the database currently in use. Lots of other options are available-- for how you specify the columns, such as their datatypes.CREATE TABLE tablename1 (fname VARCHAR(20), lname VARCHAR(20)); -- Insert a row of data into the table tablename1. This assumes that the-- table has been defined to accept these values as appropriate for it.INSERT INTO tablename1 VALUES('Richard','Mutt');-- another format: INSERT INTO tablename1 (fname, lname) VALUES('Richard','Mutt'); -- inserting multiple rows:INSERT INTO tablename1 VALUES('Ethan','Hunt'),('Marcel','Duchamp'); SQL statements consist of Keywords, Options, and Identifiers. Keywords are the words that make up the SQL statement, which specify what needs to be done on the database. Options are the words that modify the statement. Identifiers are the names of the things that the statement is acting on. SQL is not just about pulling raw data out of a table, but it can also transform or process data before we retrieve it. For any SQL statement, the database first considers the data source, applies the filter criteria, and then selects and retrieves specified columns from the data source. Retrieving, updating and deleting data from a table Copycopy code to clipboard-- Select all rows and columns from the current database's departments table.-- Default activity is for the interpreter to scroll the results on your screen.SELECT * FROM departments; -- Retrieve all rows from the departments table, but only the dept_no and dept_name columns.-- Splitting up commands across lines is OK.SELECT dept_no, dept_name FROM departments; -- Retrieve all departments columns, but just 5 rows.SELECT * FROM departments LIMIT 5; -- Retrieve dept_name column values from the departments-- table where the dept_name value has the substring 'en'.SELECT dept_name FROM departments WHERE dept_name LIKE '%en%'; -- Retrieve all columns from the departments table where the dept_name-- column starts with an 'S' and has exactly 4 characters after it.SELECT * FROM departments WHERE dept_name LIKE 'S____'; -- Select title values from the titles table but don't show duplicates.SELECT DISTINCT title FROM titles; -- Same as above, but sorted (case-sensitive) by the title values.SELECT DISTINCT title FROM titles ORDER BY title; -- Show the number of rows in the departments table.SELECT COUNT(*) FROM departments; -- Show the number of rows in the departments table that-- have 'en' as a substring of the dept_name value.SELECT COUNT(*) FROM departments WHERE dept_name LIKE '%en%'; -- In tablename1, change the fname value to 'John'-- for all rows that have an lname value of 'Mutt'.UPDATE tablename1 SET fname='John' WHERE lname='Mutt'; -- Delete rows from the tablename1 table-- where the lname value begins with 'M'.DELETE FROM tablename1 WHERE lname LIKE 'M%'; -- Delete all rows from the tablename1 table, leaving the empty table.DELETE FROM tablename1; -- Remove the entire tablename1 table.DROP TABLE tablename1; Table relationships Relationship types between tables: one-to-one, one-to-many, many-to-one, many-to-many. Primary Key - uniquely identifies a record in the table. Each row in every table has one primary key, which never changes. Foreign Key - identifies a record (usually in another table) that a particular row is associated with. The 'many' side of the relationship usually gets the foreign key column. Many rows in the same table can have the same foreign key, which can change if the relationship changes. Copycopy code to clipboard-- Foreign Key exampleCREATE TABLE photos ( id SERIAL PRIMARY KEY, url VARCHAR(200), user_id INTEGER REFERENCES users(id));-- SERIAL datatype in Postgres automatically generates integer values for specified column, starting from 1. Data consistency - the state of the data in a database when all foreign key references are valid. If a foreign key references a primary key that doesn't exist, the data is inconsistent. There are some deletion constraints that can be used in foreign key references: ON DELETE RESTRICT - the default, which prevents deletion of a row if it is referenced by a foreign key in another table and throws an error ON DELETE NO ACTION - same as RESTRICT ON DELETE CASCADE - deletes all rows that reference the deleted row ON DELETE SET NULL - sets the foreign key value to NULL for all rows that reference the deleted row ON DELETE SET DEFAULT - sets the foreign key value to the default value for all rows that reference the deleted row SQL joins Inner join - returns rows that have matching values in both tables involved in the join. The join condition is specified in the WHERE clause. The INNER keyword is optional. It is the default join type. Left outer join - returns all rows from the left table, and the matched rows from the right table. Null values are returned for the right table if there is no match. Right outer join - returns all rows from the right table, and the matched rows from the left table. Null values are returned for the left table if there is no match. Full outer join - returns all rows from both tables, regardless of whether there is a match or not. If there is no match, NULL values are used. Joins - produce values by merging together rows from different related tables. Joins are used most of times when we are asked to find data that involves multiple resources. Aggregation - looks at many rows and calculates a single value. Words like 'sum', 'average', 'maximum', 'minimum', 'count' are used in aggregation. Table order between "FROM" and "JOIN" frequently makes a difference. We must give context if column names collide during joins. Tables can be renamed during joins using the "AS" keyword. Grouping and Aggregation Grouping - divides rows into groups and applies an aggregate function to each group. The GROUP BY clause is used to group rows together. The GROUP BY clause must be after the FROM and WHERE clauses, but before the ORDER BY clause. The GROUP BY clause can group by multiple columns. The GROUP BY clause can also group by column numbers instead of column names. Aggregation - looks at many rows and calculates a single value. Words like 'sum', 'average', 'maximum', 'minimum', 'count' are used in aggregation. The HAVING clause is used to filter groups. The HAVING clause must be after the GROUP BY clause, but before the ORDER BY clause. The HAVING clause can use aggregate functions. The HAVING clause can use column numbers instead of column names. Sorting The ORDER BY clause is used to sort rows. The ORDER BY clause must be after the FROM, WHERE, and GROUP BY clauses, but before the LIMIT clause. The ORDER BY clause can sort by multiple columns, where column specification is considered as prioritization order. The ORDER BY clause can sort by column numbers and expressions as well. LIMIT clause is used to limit the number of rows returned. OFFSET clause is used to skip a specified number of rows before returning the rest. Union and Intersection The UNION operator is used to combine the result-set of two or more SELECT statements. Each SELECT statement within UNION must have the same number of columns. The columns must also have similar data types. The columns in each SELECT statement must also be in the same order. The UNION operator selects only distinct values by default. To allow duplicate values, use the '''
