ont-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.5rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}@media screen and (min-width: 640px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 768px){.css-1h962gv{font-size:1.875rem;}}@media screen and (min-width: 1024px){.css-1h962gv{font-size:2.25rem;}}Introduction .css-vehe2z{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-vehe2z{font-size:1rem;}}@media screen and (min-width: 768px){.css-vehe2z{font-size:1.25rem;}}.css-z0logh{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;word-break:break-word;}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}@media screen and (min-width: 640px){.css-z0logh{font-size:1rem;}}@media screen and (min-width: 768px){.css-z0logh{font-size:1.25rem;}}Go is expressive, concise, clean, and efficient. Its concurrency mechanisms make it easy to write programs that get the most out of multicore and networked machines, while its novel type system enables flexible and modular program construction. Go compiles quickly to machine code yet has the convenience of garbage collection and the power of run-time reflection. It's a fast, statically typed, compiled language. Go is not an object oriented programming language. .css-11bn2j6{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-11bn2j6{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-11bn2j6{font-size:1.875rem;}}.css-ns8t27{font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);font-family:inherit;font-weight:700;line-height:1.25;margin:0;margin-bottom:0.25rem;font-size:1.25rem;margin-top:2rem;color:var(--theme-ui-colors-heading);}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}@media screen and (min-width: 640px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 768px){.css-ns8t27{font-size:1.5rem;}}@media screen and (min-width: 1024px){.css-ns8t27{font-size:1.875rem;}}Basic Commands Running go in terminal provides a list of options. This command is a tool to interact with Go language, which is mainly used to build, compile, test and do other things with Go projects. To run code, use go run filename.go. Some Go CLI commands: .css-rc057y li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-rc057y li{font-size:1rem;}}@media screen and (min-width: 768px){.css-rc057y li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}}.css-15vy6y4 li{font-size:1rem;letter-spacing:-0.003em;line-height:1.625;--baseline-multiplier:0.179;--x-height-multiplier:0.35;}@media screen and (min-width: 640px){.css-15vy6y4 li{font-size:1rem;}}@media screen and (min-width: 768px){.css-15vy6y4 li{font-size:1.25rem;}} go build - Compiles a bunch of Go source code files go run - Compiles and executes one or two files go fmt - Formats all the code in each file in the current directory go install - Compiles and "installs" a package go get - Downloads the raw source code of someone else's package go test - Runs any tests associated with the current project .css-1loxung{border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;}.css-1loxung p{font-style:italic;}.css-m9jm23{border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;border-left-color:var(--theme-ui-colors-primary);border-left-style:solid;border-left-width:4px;margin-left:0;margin-right:0;padding-left:2rem;}.css-m9jm23 p{font-style:italic;}.css-m9jm23 p{font-style:italic;} Reading command-line arguments os.Args is a slice of type string that represents the actual command-line arguments that are provided to the program. The first element in this slice is the temporary file that is created when the program is compiled. Packages In Go, a package, project and a workspace mean the same. A package is a collection of common source code files. Only requirement for every file inside a package: it should declare the package name it belongs to at the very first line. There are 2 types of packages: Executable packages - which generate executable files on compilation that we can run Reusable packages - code used as "helpers". Good place to put reusable logic Package naming convention determines the type of package. Specifically, the name "main" is used to create an executable type package. Running go build for any package which is not named "main" would not produce executable package. In the Go source code files, package main defines a package that can be compiled and then executed. It must have a function called "main" defined within the files. package somename defines a package that can be used as a dependency. import statements are used to access codes in other packages. fmt is a standard library package which is used to print information to the terminal. Package fmt implements formatted I/O with functions analogous to C's printf and scanf. To import multiple packages, use this syntax: import ( "pkg1" "pkg2" ..... ). Variables and Pointers Go variables are always assigned types, which do not change. Different data types in Go are: bool, string, int, float64. Alternative way of declaring variables, where type is initialized - example: somevar := "hello". := is only used for variable initialization. = is used for variable reassignment of values. Declaring string variables example: var card string = "hello". When we create a variable in Go and do not assign any value to it, Go assigns what is referred to as a zero value (in case of a struct, zero values to each struct field). It varies for each type. It is "" for string, 0 for int and float, and false for bool. Type conversion is done in Go by specifying the type to which the value needs to be converted, and the value in parentheses. Slices and Arrays Go has 2 basic data structures for handling lists of elements: array - fixed length list of elements slice - an array that can grow or shrink Both slices and arrays must be declared with a data type, and all elements within them can only have that data type. Slice example: somelist := []string{"hello", "there", "what"}. Adding new element to a slice: cards = append(cards, "oooh"). It does not modify the existing slice; it creates a new slice and returns it. Iterate over elements of a slice: .css-ce1lkk{background-color:var(--theme-ui-colors-background);border:none;color:var(--theme-ui-colors-text);cursor:pointer;font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";letter-spacing:0.025rem;-webkit-transition:all 0.3s ease-in-out;transition:all 0.3s ease-in-out;position:absolute;right:0;z-index:1;border-radius:0 0 0 0.25rem;padding:0.25rem 0.6rem;}@media screen and (min-width: 640px){.css-ce1lkk{font-size:14px;}}@media screen and (min-width: 768px){.css-ce1lkk{font-size:16px;}}.css-ce1lkk[disabled]{cursor:not-allowed;}.css-ce1lkk:not([disabled]):hover{background-color:var(--theme-ui-colors-primary);color:var(--theme-ui-colors-white);}Copy.css-15vf505{border:0;clip:rect(0, 0, 0, 0);height:1px;margin:-1px;overflow:hidden;padding:0;position:absolute;white-space:nowrap;width:1px;}copy code to clipboardfor i,card := range cards { fmt.Println(i, card)} The initialization syntax in for loop: for i, card := range cards {} is used because these variables keep changing fof every iteration. Hence they are freshly initialized. To get a subset of elements from a slice, this syntax is used: arr[i,j] - where i denotes starting index, and j denotes ending index. All elements from i to j-1 are retrieved. In a for loop, we do not need to always get a reference to the element that we are iterating over in some cases. len() is used to get the length of a slice. Example: len(arr) gets the length of slice named arr. Functions and Receivers Functions are declared using func keyword, name of the function and argument list, followed by function body. We can extend a base type in Go and add some functionality to it. Example: type deck []string. The custom type that we declare by extending the base types gives us the ability to create custom functions that only work with that type. A function with a "receiver" is like a method - a function that belongs to an instance. Receiver on a function example: Copycopy code to clipboardtype deck []string func (d deck) print() { for i,card := range d { fmt.Println(i, card) }} In this syntax, any variable of type deck gets access to the print method. The receiver sets up methods on variables that we create. By convention, we usually refer to the receiver with a 1/2 letter abbreviation that matches the type of receiver. To return a value from a function, we must annotate the function with the type of value that is returned, and this is specified after function parantheses. If we have some variable declared that we don't actually have to use, then we can replace it with '_' which tells Go that it is an unused variable. It is possible to return multiple values from a function. Example: func deal (d deck, handSize int) (deck, deck) { }. While returning multiple values from a function, Go expects their types to be annotated in function declaration. Struct It is a data structure in Go which represents collection of different properties that are related together and have a common purpose. To define a struct, declare all the properties that it can contain, and then create a new value of that struct type. Example: Copycopy code to clipboardtype person struct { firstName string lastName string} // initializing variables and updating them (multiple ways)john := person{"John","Wick"}ethan := person{firstName: "Ethan", lastName: "Hunt"}var bruce person // declares a value of type person and assigns it to the variablebruce.firstName = "Bruce" fmt.Printf("%+v", structvar) prints out all different field names and their values from structvar. It is possible to embed a struct within another struct. Example: Copycopy code to clipboardtype contactInfo struct { email string zipCode int} type person struct { name string contact contactInfo // it is also possible to have field name same as type name - example: by just declaring this as: // contactInfo} jim := person{ name: "Jim Halpert", contact: contactInfo{ email: "jim@abc.com", zipCode: 12345, },} jimPointer := &jim // assigns the memory address of the value this variable is pointing atjimPointer.updateName("Jimmy")// alternative: jim.updateName("Jimmy") since Go allows both variables and their pointers to invoke receivers func (p person) print() {} // it is possible to define functions that have receivers with structs as well// but updates on struct do not have any effect in this case, so pointers are used func (pt *person) updateName(newName string){ (*pt).name = newName // *pt - represents the actual value that this memory address is pointing at, and *person represents the pointer type} Pass by value and pass by reference Go is a pass-by-value language, which means Go takes values passed into functions, copy those values and place them in new variables within function scopes. However, this case is different for slices. Go internally creates 2 data structures when a slice is created: 1 - a structure with a pointer to head, capacity and length fields, and 2 - an array. When we pass in a slice to a function, Go re-creates the first data structure, which would stil'''
