["https://viksit.com/blog/decentralized-art-museums-and-nfts"]
title = "Viksit Gaur | MuseumDAO - Decentralized art museums for NFTs"
description = "No description provided by post"
full_description = '''1/A centerpiece of humanity's cultural evolution is our ability to preserve important artifacts like paintings and books in museums and libraries.Our archival techniques, however, haven't kept up with the pace at which we create digital content. 2/With Web 1.0, companies like Yahoo created content and earned money off it.With Web 2.0, people create content and companies like Instagram possess and earn off it by creating walled gardens and "charging" for access. 3/Companies like Youtube and Patreon allow people to create content AND earn off it, but own the underlying systems that facilitate this.Which means that creators legally "own" their content, but don't actually possess it. 4/The sheer volume of photos and videos has fundamentally changed what we perceive as being culturally significant.Creator communities are not "mass culture" but digital connectivity makes them widely accessible. 5/As creators increasingly rely on their content as primary sources of income, it becomes important for them to guard against being "de-platformed" due to political or policy reasons, even if in error. 6/Possessing their content rather than being at the mercy of any one platform is thus important.This is also true for their list of followers. 7/Web 3.0, powered by decentralized crypto networks, is emerging as an excellent solution for creators to possess their content and own their users and be free of platform tyranny. 8/Further, much of this content needs to be permanently archived for purposes of historical cultural record, much in the way we store paintings in museums. 9/Relying on centralized platforms not a good long term solution — the average of a fortune 500 company is 61 years, and their incentives are to shareholders not customers. 10/Blockchains are great to act as systems of record for actions, identities and other metadata, but are not built to store actual content like files and photos. 11/Decentralized, blockchain powered storage systems like Filecoin and Arweave allow for storage of content on their systems, but suffer from one major issue — permanence.'''
