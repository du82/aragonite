["https://viksit.com/blog/the-building-blocks-of-web3"]
title = "Viksit Gaur | The fundamental building blocks of web3"
description = "No description provided by post"
full_description = '''This is the second in a series of threads of "The Product thinkers guide to Web3". Please leave me feedback @viksit on Twitter! 1/ In this thread, we'll build upon WHY web3 matters with the HOW -- what are its building blocks and what is a framework to think about them from a product builder's perspective? 🧵 2/ First, if you haven't read my earlier thread on why blockchains are important for anyone thinking about building web products -- check it out to set context! 1/ A thread on why blockchains are important for anyone thinking about building web based products. 🧵 3/ The internet's organic evolution from an academic communications platform has led it to never natively supporting the capabilities needed for the web apps of today. 4/ For instance, logging into websites, proving ownership of digital assets like videos or images, or even paying a friend for dinner via your phone. 5/ These problems have been repeatedly solved by companies that build web applications, giving them immense power -- and smaller players must now play by their rules or face the risk of being banned from their platforms. 6/ This has stifled a lot of the innovation that the original vision of a decentralized internet imagined. 7/ Web3 creates native building blocks to manage identity, asset ownership and payment that are not controlled by any one corporation or entity, and weaves them into the fabric of the internet itself. 8/ Doing so enables us to port our identities, assets and payments across platforms, and frees us from operating within the walled gardens of large tech companies, which often have misaligned incentives from their customers. 9/ This can enable the creation of new business models that don't rely on big-tech, and result in an explosion of startups -- something that we're seeing already! 10/ (Note that much has been written about how blockchains work from a technical perspective, and is beyond the scope of this thread. Instead, we'll focus on its product elements.) 11/ A blockchain is an auditable, immutable, and decentralized ledger of transactions between multiple entities (eg, people). Each entity has a wallet associated with it, which can hold tokens (eg, bitcoin), and each wallet has a unique identifier — its address.'''
