["https://viksit.com/blog/streaming-browsers-and-future-of-web-apps"]
title = "Viksit Gaur | Streaming browsers and the future of web apps"
description = "No description provided by post"
full_description = "1/ As technology, standards, and incentives evolve, all software applications will eventually move to the web -- with the browser serving as the operating system. We are already almost there today. But there are some challenges. 2/ Software today is written in 2 parts - code that runs on your client (the browser), and code that runs on the cloud (the servers). Because of the way the internet has evolved, a lot of effort is spent in linking the two pieces together, since they're effectively mirroring the data model and functionality. 3/ As client side code has gotten more complex (imagine gmail or figma), it has pushed browsers to do more, and consume more resources on the local computer. And with the fragmentation of web applications, the number of tabs in use has ballooned too. It also means that more and more native OS functionality (like accessing the web cam) will eventually be available to the browser. 4/ What if we we could create a system where this code only had to be written once, on the cloud and streamed, much like how Netflix streams movies? (Assuming of course that it had parity with all the features we expect of such applications? It would have a ton of benefits.) 4a/ The browser would simply become a terminal used to access remote services, and perhaps start to serve more as a container of user data and a way to grant online applications permissions to use it, vs having them collect it by default. 5/ Code would only have to be written once, and deployed without worrying about the client side. This would make things much more secure and packaged. It would mean that app stores would not be as relevant in the long term, since every application would be available simply via a URL. 6/ Since there would be barely (if) any client side code, each website would be very secure, removing the spectre of cross side scripting attacks. 7/ Imagine needing to add on a background image to your camera feed - rather than doing it on the browser like today, the video would simply be sent to one location, filtered, and streamed to whoever needed it without causing any more resource usage on your laptop."
year_published = 2025
