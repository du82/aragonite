["https://viksit.com/blog/W3b-a-look-at-the-new-web3-0"]
title = "Viksit Gaur | The W3b : Thought-storm on the next iteration of the Internet"
description = "No description provided by post"
full_description = "1/ Here’s a thought experiment about the future of the internet. Can we model it as a complex system in the same way we look at human societies and governments in real life? 2/ Humans began as individuals, who had the ability to form progressively larger organizations which became support networks that helped our species achieve the largest throughput from our lives. 3/ Over time, these organizations came to be controlled by those who had a monopoly on resources – wealth, armies and social power, but the members of these organizations didn’t have any say in how they were run. 4/ The concept of democracy was evolved as a system that could distribute social power in order to catalyze the wider involvement of its members in their own social and economic concerns. 5/ While this form of government is not without issues, it highlights a trend – by having an organization with representation by its members who have a say in how its run, we’ve had a wider ranges of stability, and its evolution is controlled in a (somewhat) scalable manner. 6/ As an analog, the internet started out as a decentralized network of computers where all the information was open – anyone could participate by simply putting up a node. 7/ Over time, centralized systems were created because they offered the benefits of an overarching “support network” – making technology and information accessible to their users because most individuals couldn’t do all this heavy lifting and plumbing on their own. 8/ These organizations, whose members can’t really control how they are run or what they make them do – are not that different from erstwhile kingdoms trying to maximize the profit of their sovereigns. 9/ And by virtue of who controls them or who can influence them – imagine wealthy courtiers and banks who financed kings [see game of thrones] – they dictate the price of admission and inclusion 10/ Monetarily of course, they may even be free – but members give up control over their privacy and data to get in. In turn, these organizations become monopolies and act as gatekeepers of the very information and data that belongs to its users."
year_published = 2025
