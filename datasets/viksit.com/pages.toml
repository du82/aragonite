["https://viksit.com/blog/live-lifes-questions"]
title = "Viksit Gaur | Live life's questions"
description = "No description provided by post"
full_description = "Life, as we lead it, is very uncertain. All of the myriad ingredients that constitute our daily existence are nothing but ephemeral experiences, and many wise voices over millennia have spoken about the follies of being too attached to them. As a species though, most humans tend to value what they have lost, what they don’t have, or what they can’t have much more than what they can or do. We tend to become too comfortable in who we are and how we live – be it our ability to take risks, go out of our comfort zone, make new close friends, move across continents, end or begin relationships, or just do what our heart desires most – mostly in the fear of violating established norms and society’s image of us. And just plain inertia. The ability to deal with this uncertainty is arguably one of the most important and yet underdeveloped skills we possess. We tend not to think about how often we require it, and how critical it is to almost every aspect of our lives on a daily basis. One of my favorite quotes is from the German poet Rainer Maria Rilke, who expressed very beautifully in a letter to a young poet, some advice on how to deal with uncertainty, I beg you, to have patience with everything unresolved in your heart and to try to love the questions themselves as if they were locked rooms or books written in a very foreign language. Don’t search for the answers, which could not be given to you now, because you would not be able to live them. And the point is to live everything. Live the questions now. Perhaps then, someday far in the future, you will gradually, without even noticing it, live your way into the answer. How we see life is a choice that we make for ourselves. We can be struck by the overwhelming pain, suffering, poverty, anger and hate that are rampant in our world today and complain about how hard things have become and how we are completely powerless to do anything about it. Or we can find the good in every day things and refuse to be sledgehammered by the reams of bad news that seem to be the staple of the world today – to step up and resolve to do whatever it is that we care for without worrying about the likely or unlikely consequences of our actions."
year_published = 2025
clearnet = "https://viksit.com/blog/live-lifes-questions"
