["https://viksit.com/blog/why-are-blockchains-important-for-product-builders"]
title = "Viksit Gaur | Why are blockchains important for web product builders?"
description = "No description provided by post"
full_description = '''This is the first in a series of threads of "The Product thinkers guide to Web3". Please leave me feedback @viksit on Twitter! 1/ A thread on why blockchains are important for anyone thinking about building web based products. 🧵 1/ A thread on why blockchains are important for anyone thinking about building web based products. 🧵 2/ In 2009, @Bitcoin's blockchain technology successfully solved a fundamental problem in finance — the ability to transfer a digital asset between two peers anywhere in the world in a trusted manner, but without intermediaries like banks. 3/ Why is this problem important to solve? Because a solution to it allows the internet itself to be used to transfer money between people, as opposed to via banks and financial payment networks like SWIFT or ACH. Think email vs a USPS owned "E-Letters" service. 4/ It makes financial transactions more accessible to the unbanked, more transparent for auditors, more secure, and also more efficient — ultimately showing us what a replacement of our 1960s era financial rails can look like. 6/ As Bitcoin grew, so did the demand for doing common financial transactions (like issuing loans) on its blockchain. 7/ However, its single focus as an alternative payments network meant that this was not easily possible — the code needed to facilitate these would have to be written off the blockchain network, removing the very guarantees of trust and security that one would want to use it for. 8/ The @ethereum project was started in 2013 to evolve blockchain technology in a way that would allow any arbitrary financial primitive to be built on top of it, and solve the problem described above. 9/ Ethereum (and a slew of other blockchain projects) offer the ability to run any kind of code on top of them — not just finance — opening up all kinds of applications historically not possible on Bitcoin. 10/ Moreover, by also being open source, community focused, and open access, they allow anyone to build on top of them, compounding the rate of innovation.'''
year_published = 2025
