description = "Universality is in the core of the World Wide Web, so we should embrace it and build experiences that are available to, and accessible by, everyone."
full_description = "AccessibilityUniversality is in the core of the World Wide Web, so we should embrace it and build experiences that are available to, and accessible by, everyone.This experience is independently maintained by myself, Ariel Salminen. I’m committed to providing an experience that is accessible by all people, regard­less of their abilities or tech­nology used. I’m also con­tin­u­ously trying to work towards improving the accessi­bility of this website to ensure I provide equal access to everyone.This work is ongoing and I continue to strive towards my goal of promoting accessibility and meeting the WCAG 2.1 level AA guidelines. While I try to do my best, I can make mistakes just like anyone. If you have feedback or ideas on how I might improve this experience, please let me know.DesignSystemsH a n d c r a f t e d w i t h l o v e i n H e l s i n k i b y A r i e l S a l m i n e n •"
