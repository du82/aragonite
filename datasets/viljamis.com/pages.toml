["https://viljamis.com/2023/leading-successful-product-teams"]
title = "Leading Successful Product Teams | Ariel Salminen"
description = "I’ve been leading various successful design systems teams over the past years and in this post I wanted to share a simple set of fundamental rules we’ve followed. These rules have allowed..."
full_description = "Leading Successful Product TeamsI’ve been leading various successful design systems teams over the past years and in this post I wanted to share a simple set of fundamental rules we’ve followed. These rules have allowed those teams to get to the highest level of productivity while benefiting both the company and the team members.Running a design systems team has some minor differences compared to a more traditional product team setup, but there’s still enough overlap that all of these rules can be considered universal and applied to almost any product team out there.As a caveat though, what might’ve worked for my team in the past, might not work for every team out there. We’ve been operating in a remote first culture so these rules apply in that context.Avoid meetings as much as possible. Instead of having them, communicate asynchronous to each other via tools such as Linear, GitHub, Figma, Slack, and similar.Provide at least three days of focus time per week for designers and developers in the team. There should be no interruptions whatsoever during this time. Let them do their work.Trust your team to make decisions, they’re the experts. Your job is to make sure they know where they’re heading, clear any roadblocks from the way, and protect them from external cruft.Default to openness. The team should be sharing what they’re doing whenever they can. Building things transparently increases visibility and accountability and makes them push towards higher quality.Define just the right amount of process. Too much process and it will slow down your team and their performance, while not enough will create inconsistency.Don’t do team wide standups or sync meetings, except one meeting at the start of every week. Here you can walk through the tasks and discuss how the team feels, what motivates them right now, and if there are any blockers.Use as few tools and platforms as possible to get the work done and stay focused throughout the week.Automate everything you can. The team should value the time of their colleagues, users, and their future selves. Always be proactively looking for ways to automate repetitive tasks.Care for the people who use the product. The whole team is there to make their day-to-day work better and more pleasant through great user experience.Most collaboration and discussion should happen asynchronously, using the previously mentioned tools. This requires clear and thoughtful communication from everyone.When useful, have the team members pair up to solve tough problems. Make sure all decisions are documented.Provide weekly updates to the rest of the organization about progress. What has been worked on, what is being worked on, and what happens next.Create a public roadmap that holds the whole team accountable.Focus on persistent iteration over flashy launches.Don’t be afraid to throw things away.Shipped is better than perfect.Be kind.Special thanks to Dan Cederholm.Get in TouchDoes your team need help? I’m Ariel Salminen, a Design Systems Architect specialized in helping organizations build and maintain design systems. I’m available for both local and remote projects around the world.PublishedMarch 9th, 2023Follow @ArielLinkedInBlueskyPinkskyMastodonGitHubInstagramRSS FeedTwitter / X"
