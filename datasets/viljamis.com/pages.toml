title = "Nordhealth Rebranding | Ariel Salminen"
description = "I’m happy to announce Three Plus Group’s and Finnish Net Solutions’ new name and corporate identity, Nordhealth. The name change is a result of a rebranding that I did for the company..."
full_description = "Nordhealth RebrandingI’m happy to announce Three Plus Group’s and Finnish Net Solutions’ new name and corporate identity, Nordhealth. The name change is a result of a rebranding that I did for the company earlier this year.It’s designed to mirror the growth and transformation of the company into the leading cloud-based provider of software for therapy clinics in the Nordics and veterinary clinics globally.Charles MacBain, Chief Executive Officer at Nordhealth, commented the rebranding:“As we near our 20th anniversary, we decided to rebrand our company to reflect our updated vision, mission and values. Although we have a global footprint, we wanted to pay tribute to our Nordic values which include innovation, creativity, design, sustainability, and equality, which our company strives to embody across the world.”I personally commented the redesign in a recent press release:“Our new brand represents ‘togetherness.’ Two sides working as one. So, on a business level it represents a key driver for us, acquisition. For our customers and end users, it expresses the seamless use of our products to improve productivity and communication.““We bring healthcare professionals closer to their patients. Our brand also defines how our teams work as a strong unshakable unit. On a deeper level, the brand also illustrates a bigger idea, change and innovation in the global healthcare market.”The company rebranding is a start of a bigger design transformation at Nordhealth. Our plan isn’t just to rethink the global brand. The goal is to continue this work and also rethink the design processes and digital products from the ground up and improve their user experience vastly.The rebranding I did included a full redesign of the company’s logo, website, graphics, communications and correspondence. Nordhealth’s new brand assets also included a simplified two color logo, along with a new website that I designed and developed, among with other visual communications tools that utilize simple, bold graphics to convey complex solutions in an understandable way.Get in TouchDoes your team need help? I’m Ariel Salminen, a Design Systems Architect specialized in helping organizations build and maintain design systems. I’m available for both local and remote projects around the world.PublishedApril 15th, 2021Follow @ArielLinkedInBlueskyPinkskyMastodonGitHubInstagramRSS FeedTwitter / X"
