full_description = "Privacy PolicyThis is Ariel S. Design’s privacy policy description in accordance with Section 10 of the Personal Data Act (523/99).ControllerAriel S. DesignVAT Number FI20471221Contact PersonAriel Salmineninfo@arielsalminen.comName of data fileThe customer register of Ariel S. Design.Regular sources of dataThe data file contains information from these sources: the Client is or has been a customer of Ariel S. Design, has had conversations with Ariel S. Design or its representative, or has given their contact information to Ariel S. Design through a contact form on Ariel Salminen’s website.Purpose of processing personal dataPersonal information may be used for the following purposes:Ariel S. Design’s marketing, sales and/or direct marketingInvoicing clientsData file contentThe data file may contain the following information:NameEmail addressPhone numberCompany and job titleCompany address informationData on contact requests and offersData transferThe personal data in the Customer Register is only available to Ariel S. Design, except when Ariel S. Design is using an external service provider to provide a value-added service. However, the information will not be disclosed outside Ariel S. Design or to its partners for personal use, except in matters related to collecting or invoicing, as well as legal requirements.Personal data will not be transferred outside the European Union unless it is necessary to ensure the technical implementation of Ariel S. Design or its partner.Right to verify your informationBased on the Personal Data Act 26 §, users have the right to check what kind of personal data has been collected. The request has to be made in written format and it must be sent to contact person mentioned on this policy. One request per year per user can be processed without any costs.In addition, based on the Personal Data Act 29 §, user has the right to request for modification or removal of any incorrect or outdated personal data. Written request for modifying the data has to be sent to contact person mentioned on this policy.Principles of protecting the data fileAll personal data will remain confidential. Ariel S. Design’s data network and equipment where the file is are protected by the firewall and other required security systems.Right of prohibitionThe Client has the right to prohibit disclosure and handling of its data for direct marketing and other promotional purposes."
