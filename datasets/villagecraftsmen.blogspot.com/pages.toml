["https://villagecraftsmen.blogspot.com/2004/09"]
title = "Ocracoke Island Journal: 09/01/2004 - 10/01/2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''I've traded houses with friends in the mountains of NC, so I will be gone for about two weeks. I will also visit my son and his family (I have three beautiful grandchildren near Asheville), and see my good friend Lou Ann. We will drive over to the National Storytelling Festival in Jonesboro, TN, and then head for the mountains of east Tennessee. We'll hike a couple of days to Mt. LeConte near Gatlinburg and then go back to our friends' home for a few days. So, we'll be without a daily journal until I return home. (Friends staying at my home on Ocracoke declined to write journal entries.) I'm sorry I won't be here to provide a report on hurricane Jeanne, but given it's current track I don't expect much more than rain. Actually it's been beautiful on the island all week. Cool and clear, no bugs, and just delightful. Please check back in a couple of weeks for more news from Ocracoke. At the risk of being one of those grandparents who can't resist showing photos of his grand-younguns, I'll bow to pressure from folks who have asked to see more recent pictures of Lachlan. He is now 7 weeks old. I hope you enjoy them. (To view a larger image, click here.) To view a larger image, click here.) On this date in 1913 Augustus Abner McQuire, a diver on board a Norwegian vessel, died in an accident at sea off of the Outer Banks. He was buried on Ocracoke. Ever since, islanders have periodically reported seeing his ghost (in full diving gear) wandering slowly through the old Howard and British cemeteries. You can read the full story here: http://www.villagecraftsmen.com/news090102.htm. Next time you're on the island walk up British Cemetery Road after dark and look for Old Diver's ghost yourself. Ocockers use the word "some" in a very distinctive way. It means "very" but is used after (not before) an adjective, and is usually (but not always) employed with one or two syllable words. So an Ococker would probably say that he was "cold some," not "very cold." Each word is given equal emphasis (unlike the more common word "lonesome"). Expressions such as "tired some," "fussy some," and "confused some" are common on the island. Occasionally you might even hear something like "Dey Jeeminny Criminny, that's complicated some, that is." So, now you'll understand me when I say that today, like yesterday, is pretty some. That it is, Bucky!'''
