["https://villagecraftsmen.blogspot.com/2004/05"]
title = "Ocracoke Island Journal: 05/01/2004 - 06/01/2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''Overcast skies and cooler temperatures suggest impending rain later today, maybe even thunderstorms. Not too many folks out and about yet this morning, but we're anticipating more people stopping by as the day progresses, especially if a light rain keeps them off the beach! It's hard to believe, but June is almost upon us. Summer vacations have already started, although it won't be until mid-June, after high school graduations, that the season really picks up. The island's next big event is coming up the first weekend in June -- our annual Ocrafolk Festival of Music & Storytelling. If you're on the island, stop by and say hello. On Wednesday, May 26, "Green Tuna" inquired, "I'd be interested to know...how many people have graduated from Ocracoke [School]...ever?" Two weeks from now, on June 13, four seniors will receive their diplomas -- Jimmy Wrobleski, Amara Wollerman, Tucker Payne, and Brandon Lawson. They will make a total of 446 island students who have "walked down the aisle" since the first graduating class in 1931. That's an average of just over 6 seniors each year. Today is another virtually perfect day with sunny skies and temperatures in the 80's. Every now and then I will be sharing a distinctive Ocracoke Island word or expression. Today's word is "fladget." It means a small piece or chunk of something, generally food, as in "Cut me a fladget of meat, please." It can also be used in other ways, as in "I tore a fladget of skin off my finger when I was opening clams." Look for more words in the future. With High School graduations approaching I am reminded of those many T-shirts that list all of the graduating seniors on the back of the shirt. Ocracoke School has a T-shirt that lists every person who has ever graduated from the school! Kevin Cutler reminded me that twice in Ocracoke's history the graduating class consisted of only one senior: Walter Potter Garrish in 1947 and Elmo Murray Fulcher in 1957. In 1946 & 1955 there were no graduates. On May 24, 1921 the schooner "Mary J. Haynie" wrecked on Ocracoke's beach. On today's date, May 25, in 1884 the steamer "Glasbolt" from Scotland wrecked at Ocracoke's South Point. Relatively small portions of a few of the many shipwrecks along our coast can still sometimes be seen on the beach. Most of them are covered by sand but may be exposed after storms and hurricanes. Within the last couple of months some old coins were found on the beach. Metal detectors are illegal in the National Seashore, but keep your eyes open!'''
