["https://villagecraftsmen.blogspot.com/2004/10"]
title = "Ocracoke Island Journal: 10/01/2004 - 11/01/2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''Most of the "Trick or Treaters" avoid Howard Street. I guess it's too spooky. Actually a couple of the mamas of the boys who went on the ghost walk Friday night told me how creepy the boys thought the stories were. I saw two of them tonight. One assured me he wasn't about to walk down Howard Street after dark with all those graveyards along the lane. The other one said he was going to write an expanded version of the Aunt Lorena story, and he'd have all of the dead rise up from their graves and join her on her midnight wanderings. Just something to think about next time you are on the island! Sleep well. There were 6 middle-school-age boys on my ghost walk last night (the girls were off-island on a scouting trip). They looked over their shoulders when I told them about the ghost of Old Diver, and they listened intently when I related how Alice O'Neal had been buried alive. But the best part of all was when we stopped on Howard Street where the former Methodist Episcopal Church, South had once stood. It was dark and quiet. I told them how my great aunt Lorena had been buried in the church yard in 1897. Three years later she was dug up and moved, and the coffin had been opened.......... It was quiet. Earlier the boys had been eager to move along. Now they just stood still, unwilling to continue down the moonlit lane, afraid they might encounter Lorena's wandering ghost. Here's hoping your Halloween weekend is just as creepy! My evening walk on the beach yesterday after work was wonderful. It was great to breathe the salt air and feel the sand between my toes. (I did miss the colorful trees in the midwest, however, and wished Lou Ann could have joined me for my walk along the surf.) Tonight I'll give a ghost/history walk for our local youth group (6th - 8th grades). It will be a shorter version than usual, but I hope the stories will send chills down their spines. There's the ghost of Old Diver, the woman who was buried alive, the ghostly casket that floats along the lane, the murder of 1861, and Aunt Lorena who was dug up only three years after her death (and who now wanders up and down Howard Street in here moldy grave clothes!). Hope you enjoy Halloween whereever you are.'''
