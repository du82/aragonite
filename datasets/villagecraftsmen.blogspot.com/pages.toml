["https://villagecraftsmen.blogspot.com"]
title = "Ocracoke Island Journal"
description = "A Journal of Island History &amp; Culture"
full_description = 'Welcome to the Ocracoke Journal, a blog managed by Village Craftsmen of Ocracoke! For more than twenty years we have been committed to sharing news, history, and stories about our beloved island. Our first Journal entry was published March 3, 2004. For fifteen years we posted five to seven days per week, and the Journal attracted enthusiastic and dedicated readers from all over the United States and around the world. Since about 2018, when we began posting on Facebook, we have only published blog posts a few times each year. Although we will probably not be posting more Journal entries after today, all of our past posts are archived and available for island residents, friends, and researchers. To browse our past entries simply click here, or on any of the links under "Blog Archive" on the right (in web version).In 2000, four years before the Journal, we began publishing our popular on-line Ocracoke Newsletter, mostly longer, more detailed monthly articles about specific island institutions, people, and events. We continue to write and publish these articles most months. On our Facebook page we include a link on the day we publish a new article. Like the Journal posts, these articles contain a wealth of historical and human-interest information about Ocracoke, some of it not available anywhere else. The Newsletters are also archived. From the main Newsletter page you can access any of our articles. They are all provided free, without advertising or pop-up ads. Anyone is welcome to copy, re-post, or otherwise share the posts. Our goal is, and always has been, to share our love of Ocracoke with our friends. We only ask that you credit us as appropriate. We hope you will use our posts and articles to learn more about our fascinating island history, to meet some of our most interesting characters, and to enjoy heart-warming and humorous stories. To go directly to our Ocracoke Newsletter page, click here.Thank you for supporting our work by appreciating the unique community of Ocracoke. Sincerely, Philip Howard'
