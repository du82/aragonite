["https://villagecraftsmen.blogspot.com/2004"]
title = "Ocracoke Island Journal: 2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''Ocracoke is a wonderful place to live. Of course it is. And....it's good to go someplace different now and then. I will be leaving tomorrow and will be gone for the holidays. My good friend Finley will be staying in my home on the island and celebrating the holidays with Jude and other island friends. Village Craftsmen will be filling internet orders regularly (ask my staff....they don't need me here!), and our store on Howard Street will be open December 27 - December 31. If you're planning a Chrismas week trip to the island be sure to stop by and say hello. Village Craftsmen will close for the month of January. All of the Village Craftsmen staff (Dallie, Jude, Jaren, Dale, & Leon) join me in wishing you the Happiest of Holidays. Also, let's all do our part to promote peace & justice for all the world's people in the New Year. I'll be back in early January with daily posts once again. Last week I reported that my friend Lou Ann's son and family (Aaron, Karen, Matthew, & Jonah) came home from an evening with friends to discover their home surrounded by fire trucks. The house burned to the ground and no more than a handful of personal items was recovered. Ocracoke residents joined with family & friends from their home town in Indiana to provide shelter, clothing, toys, and incidentals. For the short term they are being cared for. In a few days they will go to Aaron's brother's home in Florida to work in construction. Several journal readers have asked what they could do to help out. Long term needs are now a priority. When they return to Indiana in the Spring they will be faced with need for housing and major appliances. A church in their hometown has set up a fund to help with these future needs. If you would like to contribute, a donation of any amount would be appreciated. The address is Fairview Missionary Church, 525 East & 200 North, Anglola, IN 46703. Please designate any funds for the "Aaron Homan Family Fund." Thank you to all who expressed their concern and sent wishes and offers of assistance.'''
