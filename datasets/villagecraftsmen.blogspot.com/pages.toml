["https://villagecraftsmen.blogspot.com/2004/08"]
title = "Ocracoke Island Journal: 08/01/2004 - 09/01/2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''......but didn't know who to ask! For a limited time I am offering to answer (if I can, or am willing!) your questions about the island. Surely, you've had questions but didn't know where to go to get answers. History, people, wildlife, politics, geology........ I won't always know the answers, of course, but I'll try to find out for you if I don't know. Just post a comment with your question and I'll answer them in the order I receive them. If I get too many questions I'll just call a halt to it. Looking forward to hearing from you. If you've sent us an email message in the last few days and are expecting a reply, please have patience. Our web site server (through whom we get our messages) has had technical difficulties and our messages have been cached.. We have not received any mail except internet orders (those we can access through a secure web site hosted by our shopping cart provider). Tech support assures us that all messages will be delivered soon. Ocracoke has been breezy today, but there's been no rain since early morning. It is too windy to enjoy the beach, however, so I took my daily walk in the village with my daughter Amy and grandson Lachlan. Everyone agrees he is a cutie. Amy, David, and Lachlan are doing just great. And so is Opa. Schools are mostly back in session now and the island is getting quieter. This afternoon I found a stretch of beach and didn't see a soul for the entire time I was there. I walked and swam and lay in the sun. The clouds were massive and as white as newly fallen snow. It was heaven! No word yet about the search for the Civil War era submarine, Alligator. I believe the Navy research ship leaves soon. But we'll let you know if we hear any exciting news. Tropical storms and hurricanes are in the news again. At this point it doesn't look like they'll be a threat to Ocracoke, but we're watching carefully. In the meanwhile we're just enjoying a gorgeous end of summer and looking forward to one of the best seasons of all, Fall. No, not the Florida kind. This Alligator is green and made of metal. The US Navy's very first submarine was launched May 1, 1862. It was 47' long and 4' 8" at the beam. Invented by Brutus de Villeroi, it first employed 22 crewmen with oars, but was later converted to a screw propeller for propulsion. After several aborted missions the Aligator was bound for South Carolina to participate in the capture of Charleston harbor. On April 2, 1863, during a fierce storm off Cape Hatteras, the submarine, which was being towed by the USS Sumpter, was cut adrift to prevent the sinking of the Sumpter. Early this week the US Navy's Office of Naval Research (on their 108' "Afloat Lab") docked in Silver Lake harbor. In conjunction with the National Oceanic and Atmospheric Administration they have launched a search for the lost Alligator. We've heard no word yet about the mission, but you can follow their progress here: http://sanctuaries.noaa.gov/alligator.'''
