["https://villagecraftsmen.blogspot.com/2004/03"]
title = "Ocracoke Island Journal: 03/01/2004 - 04/01/2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''Late winter winds blowing along the coast washed up a 16 foot long beam from an unfortunate vessel that wrecked on the Outer Banks many years ago. Rusted spikes and shipworm infested wood reminded us of the brave men of the Life Saving Service who risked their lives to rescue 19th century sailors. Yesterday's auction was a huge success! More than 80 people made bids from 1:00 pm until 5:30 pm, and in the process raised more than $4500.00 for the local Fire Department, Preservation Society, Child Care, & Youth Center. The day began warm and sunny, but a cold front blew through in late afternoon. Lou Ann described today's walk on the beach as a portrait in pewter & parchment. Cold winter winds blew sand and surf, making walking arduous. Another community activity today -- our Spring auction. At 11 am the doors of the Community Center will be open for people to browse all the donated merchandise (chairs, tables, tools, toys, household appliances, you name it). Sandwiches, cold drinks and desserts will be on sale. The auction begins at 1 pm and will continue all afternoon. Check back tomorrow to learn how much money was raised and where it goes. Also, on this date in 1891 the schooner "Boreniven" from Spain was stranded on Ocracoke's beach. Evidence of various shipwrecks can still be seen here and there along the surf. Easter North Carolina's National Public Radio station reports this morning that scientists are attempting to free a rare 34 foot long right whale that is entangled in fishing gear off the North Carolina coast. Only about 300 right whales are believed to be in existence. Temperatures are expected to be in the 70's today, under sunny skies. A number of us will be engaged today and tomorrow hauling numerous items (sofas, tables, glassware, toys, small boats, etc.) to the Community Center, in preparation for the upcoming auction on Saturday. It's the perfect day for it. Already the temperature is up to 60 degrees, with sunny skies, and no rain in sight. But, first, it's a walk on the beach! Work can wait an hour or so.'''
