["https://villagecraftsmen.blogspot.com/2004/06"]
title = "Ocracoke Island Journal: 06/01/2004 - 07/01/2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''Tonight, like every Wednesday evening during the summer months, local musicians and storytellers entertain their audience at Deepwater Theater on School Road. The hour and a half performance features fantastic pickin'; a classical violin piece; foot-stomping fiddle tunes; clear, resonant vocals; a traditional story of island life; and/or tall tales about life at sea. Shows begin at 8:00 pm, and if you're planning to attend be sure to arrive at least 15 minutes early. It's not unusual for the Opry to be sold out. Four hundred and nineteen years ago, Sir Walter Raleigh made his second expedition to the North Carolina coast. Under the command of Sir Richard Grenville, and with seven vessels and six hundred men, they were attempting to establish a permanent English colony on the North American continent. In June, 1585 the expedition arrived at Wokokon (Ocracoke) Inlet. Because of pilot error (rather than the usual storm conditions) their flagship, the Tiger, ran aground on June 29. This was the second recorded shipwreck on the North Carolina coast. In spite of the crew's success in preventing the ship from breaking apart, most of the provisions were lost. Almost two weeks later, after repairing the Tiger, the expedition sailed across Pamlico Sound to explore the mainland coast. When the leaders returned to England they had little to say in support of the area. Lieutenant Ralph Lane denounced Wokokon Inlet in particular as a treacherous waterway devoid of reliable harbors. The sun is out as I write, but the sky has been cloudy this morning. It's warm (in the middle 80's) and there is a chance of scattered showers and thunderstorms this afternoon. It's not the best beach day (not the worst either), but it should be good for business. :-) Our quiet Sunday morning was made even nicer when my daughter, Amy, and her husband, David, called and invited Lou Ann and me to have lunch with them at Ocracoke's newest restaurant, "The Flying Mellon." The Flying Mellon is the latest venture of Ocracokers, Michael Schrammel and Suzie Scott, and is located behind O'Neals Tackle shop, and next door to the East Carolina Bank on Highway 12. Our plans for the day are modest -- an hour or so at the beach after lunch (the water temperature is 78 degrees, and the waves have been near-perfect), a walk (probably along the surf), some time later to lie in the hammock and read (or maybe take a nap), and then, in late afternoon, a stroll downtown to sit on the porch of the Community Store and visit with folks who pass by. Hoping your day is every bit as relaxing.'''
