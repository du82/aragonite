["https://villagecraftsmen.blogspot.com/2004/04"]
title = "Ocracoke Island Journal: 04/01/2004 - 05/01/2004"
description = "A Journal of Island History &amp; Culture"
full_description = '''Special Note: I will be unavailable to post any messages until May 2, 2004. Please check back then, and thank you for understanding. Unfortunately I will miss the community cookout sponsored by the North Carolina Center for the Advancement of Teaching (NCCAT), Ocracoke Campus, at 5:30, Monday, April 26. NCCAT's new home is the former Ocracoke Coast Guard Station. We look forward to having this stellar organization as our new neighbor. Another beautiful Spring day for another outdoors community event. This afternoon at 3:30 the Ocracoke Fishing Princess will be crowned. This will be followed at 4:30 by the Parade of Boats & Blessing of the Fleet. Immediately after the ceremony everyone will gather for a pig pickin' and pot luck dinner. The weather couldn't be finer. Yet another beautiful day on the island. Birds are twittering, and temperatures are already in the lower 70's under sunny skies. There is another rental cottage available on Howard Street, "Lawton's," for two people, maximum. For more information, click on the photo below. Today is Earth Day, 2004. Yesterday afternoon, as I walked along the edge of the surf I came across a loon resting on the beach. Because loon's legs are set far back on their bodies to facilitate diving, they are incredibly awkward on land, moving with great difficulty. As a result, I was able to approach to within just a few feet. Even though the loon was still sporting winter plumage, it was a strikingly beautiful bird, and it treated me repeatedly to its distinctive call. In the evening Fiddler Dave & I met at the Pub to listen to two talented musicians from Vermont playing the steel drums. (Steel drum players from Vermont?? Yes, and they were excellent!) Although NC Highway 12 has been repaired and open to all traffic for months, the US Army Corps of Engineers and the NC Department of Transportation are preparing a study of problems associated with storm-induced shoreline damage on Hatteras and Ocracoke Islands. They are hoping to develop a long-term solution to protect the shoreline and the highway on both islands. This afternoon, between 4:00 p.m. and 7:00 p.m. the Corps of Engineers and the NCDOT are hosting an open house and community informational workshop at the Ocracoke School Gymnasium. They are asking for community input, suggestions, and concerns. Today is looking like yet another wonderfully sunny and warm spring day.'''
