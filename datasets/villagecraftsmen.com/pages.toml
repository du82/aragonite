title = "Welcome . . . - Village Craftsmen of Ocracoke Island"
description = "Fine Selection of USA Handmade Crafts"
full_description = "offers an extensive selection of fine quality American-made handcrafts. We feature pottery, jewelry, wooden kitchen utensils, bells, soaps, kaleidoscopes, prints, pewter items, and much more. From a modest beginning in 1970 we have become one of the premier craft galleries on the Outer Banks of North Carolina. Located on historic Howard Street, across from numerous family cemeteries and surrounded by ancient live oaks, Village Craftsmen combines an appreciation for quality handcrafts with an abiding love of island history and culture. The gallery is managed by Amy Howard, daughter of owner, Philip Howard. Village Craftsmen of Ocracoke Island. Welcome to our online gallery. Since 1970 Village Craftsmen has offered an extensive selection of fine quality American made handcrafts. We feature pottery, jewelry, wooden utensils, bells, soaps, kaleidoscopes, prints, pewter items, and much more. Other Info Newsletter Search Search for:"
