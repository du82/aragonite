["https://www.villagecraftsmen.com/ocracoke-info"]
title = "Ocracoke Info - Village Craftsmen of Ocracoke Island"
description = "Ocracoke Island Ocracoke Island is the remotest of a string of barrier islands (The Outer Banks) off the coast of North Carolina.  Accessible only by ferry, private boat, or private airplane, Ocracoke boasts sixteen miles of undeveloped ocean beach as well as one of the most beautiful natural harbors on the East Coast. We offer […]"
full_description = "Ocracoke Island Ocracoke Island is the remotest of a string of barrier islands (The Outer Banks) off the coast of North Carolina. Accessible only by ferry, private boat, or private airplane, Ocracoke boasts sixteen miles of undeveloped ocean beach as well as one of the most beautiful natural harbors on the East Coast. We offer numerous opportunities to enjoy the natural beauty and rich culture of this special place. These include: sailing, swimming, fishing, boating, kayaking, biking, just plain relaxing. Remember, part of the charm of Ocracoke is it’s history of isolation from the mainland. Some of the best things about our island will never be listed on the web. Use your imagination to help you find some of Ocracoke’s hidden treasures. And be sure to take your time and relax. It may take several visits before you begin to discover the truly unique aspects of this enchanting place. Don’t rush! Howard Street Enjoy a relaxing stroll down one of the most charming lanes in the world. Ancient live oak trees, moss-covered wooden fences, historic island homes and numerous family cemeteries make for an experience not to be forgotten. Take time to notice the old cisterns and pitcher pumps that recall a time not too many years ago when Ocracoke was accessible only by daily mailboat and drinking water was rationed carefully. Ocracoke Island Information and Web Sites Ocracoke Navigator provides over two hundred interactive maps, extensive historical content , vintage and contemporary photographs, and other information about Ocracoke Island. It guides visitors to local sites, businesses, and services. It’s like having an Ocracoke Native in your pocket! Ocracoke Island Travel and Tourism Association The official Ocracoke Island web site with general information about Ocracoke including lodging, restaurants, shopping, and things to do. Coastal Guide to Ocracoke North Carolina (Information about lodging, restaurants, things to do.) Ferry Information (Hatteras Inlet, Swan Quarter and Cedar Island Ferries) Ocracoke Current (Online Newspaper) Ocracoke Observer (Online Newspaper) WOVV (Island Radio Station) Ocracoke Preservation Society (History of the village and the island.) Ocracoke Alive (Community nonprofit that produces the Ocrafolk Festival, the Deepwater Theater, the Festival Latino de Ocracoke, and many other community events) Ocracoke Weather Forecast (The latest island weather information) Friends of Portsmouth Island (Information about our southern neighbor, abandoned Portsmouth Island) Other Outer Banks Web Sites: Outer Banks Chamber of Commerce"
