description = "PDF Today all of Eastern North Carolina, and especially the Outer Banks, experienced one of the largest snowfalls in recent history.  Not since 1980 had Ocracoke had this much snow.  At least 7 inches of powder blanketed the island, with drifts waist deep in places.  Skies were gray most of the day as snow fell […]"
full_description = "Blizzard of 2003 By Philip Howard In 2003 Newsletters Posted Jan 23, 2003 PDF Today all of Eastern North Carolina, and especially the Outer Banks, experienced one of the largest snowfalls in recent history. Not since 1980 had Ocracoke had this much snow. At least 7 inches of powder blanketed the island, with drifts waist deep in places. Skies were gray most of the day as snow fell steadily and winds gusted to 25 or 30 mph. Temperatures dropped into the low 20’s causing concern about frozen water pipes. Islanders were thankful that power was interrupted only temporarily. Click on any of the images below to see a larger photo. Images, from top to bottom, left to right: Ocracoke Lighthouse, David Tweedie and Amy Howard in a snowdrift, Howard Street View along Howard Street, View of Silver Lake Harbor Bicycles waiting for summer, School Road, Stuck on the beach Ocracoke Preservation Museum, Icicles, Snowdrift on the dunes Ocracoke Snow Cream Recipe: (This is an old island recipe, but it uses raw eggs, so we are not recommending it!) Ingredients — 4 eggs, 1 can condensed milk, pinch of salt, 4 tblsp. sugar, 1 can of crushed pineapple (or other fruit, drained), 1 large bowl of snow. Separate eggs, beat egg whites till they stand in peaks, add sugar gradually, beat egg yolks till light, add salt, milk, fruit, then fold in egg whites. Add snow last. Serve immediately. Tagged with blizzard, Ocracoke, photographs, recipie, snow, snow on ocracoke Share this: (0) (0) (0) (0) (0) Views: (335)"
