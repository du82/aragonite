["https://www.villagevoice.com/anarchy-in-the-u-s-a"]
title = "Anarchy in the U.S.A. – The GOP Plays a Dangerous Game With Its Far-Right Fringe - The Village Voice"
description = "This article is part of a series—At 250, Who Will America Be?—reporting on threats to American democracy as we approach the nation’s Semiquincentennial, on July 4, 2026. ∼ ∼ ∼   WASHINGTON, D.C. — Behind the Waco and the Whitewater hearings lies a concerted effort on the part of Republican right “revolutionar­ies” to make use of its […]"
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime “Ever since Newt Gingrich turned self-hate into a campaign manifesto last November, the GOP has been conducting a risky affair with the far right” WASHINGTON, D.C. — Behind the Waco and the Whitewater hearings lies a concerted effort on the part of Republican right “revolutionar­ies” to make use of its anarchist fringes. Ever since Newt Gingrich turned self-hate into a campaign manifesto last November, the GOP has been conducting a risky affair with the far right. Now, though, this “we’re crazier than the crazies” stance seems to be backfiring. As the Waco hear­ings have demonstrated, it helps to know a little about the cause you’re supporting. Far from martyring David Koresh’s Branch Davidians and hence elevating the Christian right above law and order, the testimony of one Davidian survivor last week only reinforced the government’s accusations that Koresh was a child abuser. No doubt Republicans, and their NRA sponsors, will have better luck beating up on the ATF and FBI once hearings begin into the 1992 Ruby Ridge raid on the home of white supremacist Randy Weaver, but for the moment they are split on how to play their far right wing. Gingrich continues to indulge the anarchists, just last week weighing in on the favorite wacko topic of who killed Vince Foster. Meanwhile, Helen Chenoweth in the House and Larry Craig in the Senate continue to run wild, attacking the effrontery of federal agents and invoking the specter of the dreaded black helicopters. But last week mainstream con­servatives regained their voice. In the Washington Times, Peter King, Republican congressman from Long Island, wrote in an op-ed, “Why now are some conservatives so willing to turn the presumption against federal law enforcement agen­cies such as the FBI and the Bureau of Alcohol, Tobacco and Firearms? Why was it wrong to call cops ‘pigs’ in the ’60s, but acceptable to call federal agents ‘Nazis’ and ‘jack-booted thugs’ in the ’90s? If it is because gun own­ers are considered to have a status different from blacks and left wing demonstrators, that would be unac­ceptable since principles are immutable and cannot be altered to suit the situation."
author = "James Ridgeway"
