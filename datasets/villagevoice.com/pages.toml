["https://www.villagevoice.com/9-11-witness-to-the-fall-reporting-on-the-coming-dangers"]
title = "9/11: Witness to the Fall – Reporting on the Coming Dangers - The Village Voice"
description = "This article is part of a series—At 250, Who Will America Be?—reporting on threats to American democracy as we approach the nation’s Semiquincentennial, on July 4, 2026. ∼ ∼ ∼ “Get up here. You’re writing,” Don Forst, the Voice’s editor, commanded. I had called him after waiting in line to use a phone booth in Lower […]"
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime Dazed, shaken, guided only by the purpose Don had bestowed on me, I joined the throng trudging up Centre Street. “Get up here. You’re writing,” Don Forst, the Voice’s editor, commanded. I had called him after waiting in line to use a phone booth in Lower Manhattan to tell him what I had just seen: First, as I came up from the subway station at Chambers and Church, a flaming hole at the top of one of the World Trade Towers. And then, the second plane, gliding through a cerulean sky and piercing the other tower. I stood aghast with a small crowd of New Yorkers and wondered at the primal sound that streamed out of us, a collective gasping inhale and wailing exhale louder than the sirens that were already blaring nearby. At first, Don said, “I know. We have the TV on. We’ll do something next week.” It was a Tuesday, and that week’s issue was already at the printing press; it would be loaded onto trucks for distribution in a matter of hours. Then I added, “I have the name and number of a guy with a digital camera who took pictures.” He lived in the neighborhood and had been standing in that scrum on the corner; I had instinctively pulled a reporter’s pad out of my bag and asked for his contact info. We were still half a dozen years away from the first iPhone. There was no such thing as social media. Don told me to hurry to the office. Dazed, shaken, guided only by the purpose Don had bestowed on me, I joined the throng trudging up Centre Street, interviewing along the way some World Trade Center secretaries who hadn’t quite made it in to work before the first plane hit. When I arrived at the Voice, at Cooper Square, Don insisted on pouring me a scotch — I looked ghostly, he said — then set me up at a terminal outside his office and instructed me to write what I saw and heard and felt. He tore out the page from my notebook with the number of the guy with the camera and left me alone. Maybe an hour later, he peered over my shoulder and picked up the phone on the desk where I was working, to call the plant. “Stop the presses,” he told them."
author = "Alisa Solomon"
