["https://www.villagevoice.com/a-freedom-of-choice-revolution-is-roiling-iran"]
title = "A Freedom of Choice Revolution Is Roiling Iran - The Village Voice"
description = "A first person account in the Village Voice about widespread protests in Iran and how the unrest is affecting Iran's despotic leadership."
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime One of my colleagues rushed up to me last week and while struggling to catch her breath, she cried, “Roshanak, Roshanak, the security forces just picked up a few of your students.” I did not know what to do. It was as though my heart had stopped beating. Days have passed and I still have no idea what has happened to those students, who are all studying law, one of whom is among the most promising in the country. Every night I go to sleep anxious about where they are—in solitary confinement? Under torture? What are their families going through? As a woman and a university professor in Iran, I really do not know what my future holds as I am writing this letter. The current Iranian regime feels genuinely threatened by the very people it rules. This is a government under which education in universities has been tainted by dictates of forced loyalty to the leadership and schoolchildren are mandated to look up to the supreme leader as their commander and role model. But many people are no longer listening to those dictates. Let me tell you about the events of these eight weeks. People are full of excitement and enthusiasm. The new generation of Iranian teenagers out in the streets is full of hope. Through the power of resistance, they have discovered themselves and a path to fulfilling their dreams. These young Iranians are unwilling to go back to living in fear. Everything started after the killing of Mahsa Amini on September 16. Her murder outraged many across Iran, especially young women and their families, and set off a wave of protests across the country, with participants going beyond the single-issue grievances or economic concerns that fueled previous protests to instead take aim at the dictatorial rule of Ali Khamenei—officially known as the Supreme Leader of the Islamic Republic of Iran—and his regime. The protests reflect decades-long fury over the denial of basic freedoms. In 1925, Reza Khan, a military officer, forced his way into power in Iran with British backing and crowned himself Reza Shah Pahlavi. He suppressed Iran’s burgeoning constitutional movement, which had aimed to transform Iran into a democratic society. Reza Shah’s dictatorial rule included a heavy-handed hijab ban, in 1936. This compulsory dress code was widely opposed by women who sought the freedom to choose and instilled a sense of disenfranchisement that continued until the monarchy’s demise under his equally despotic son, Mohammad Reza. Women were not the only victims of the Pahlavi dynasty, which also clamped down on Iran’s ethnic groups, such as the Kurds, Baluchis, Lors, and Arabs."
author = "Roshanak Darabi"
year_published = 2022
year_updated = 2023
