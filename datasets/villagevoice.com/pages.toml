["https://www.villagevoice.com/2022-the-year-so-far-in-voice-relaunch-e-editions"]
title = "2022: The Voice Relaunch Continues in Print and these E-Editions - The Village Voice"
description = "The Village Voice re-launch print editions from 2022, including tales of great painters, exuberant musicians and a powerful female boxer."
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime We are, as the saying goes, cursed to live in interesting times—in fact, times reminiscent of the tumultuous and tragic mid-20th century: A dictator has launched an aggressive war in Europe, affecting both Ukrainians and their environment, fascist demagogues spew hate here at home, basic human rights are under attack, and general lunacy reigns. Well, we’ve covered all the above and more in print this past year, and now you can catch up with the e-Editions to see what you’ve missed. In addition to politics, you can take the Wayback Machine to the Village in 1960, read an interview with a mad musician, or check out an overview of one of cinema’s greatest years. It’s all been in print in 2022. As always, we’re 24/7/365 online—and we’ll let you know when the next print edition is coming, sooner rather than later. ❖ NOTE: The advertising disclaimer below does not apply to this article, nor any originating from the Village Voice editorial department, which does not accept paid links. Advertising disclosure: We may receive compensation for some of the links in our stories. Thank you for supporting the Village Voice and our advertisers."
