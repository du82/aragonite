["https://www.villagevoice.com/are-you-ready-for-rapping"]
title = "Buckaroos of the Bugaloo - The Village Voice"
description = "This 1981 article by Barry Michael Cooper from the Village Voice Archive looks at the then-busting out art form of rapping."
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime “These transcontinental urban griots echo the de­spair, pain, and anger of the South Bronx and Harlem (the world's two major rap centers), which a lot of the cool-jerk white liberals and b.s. black bourgeoisie don't want to hear.” Ronnie Ron is a real Smart smarty Yesterday he gave A death preview party But I didn’t wanna go Coulda got upset So I cut Cut Cut him off like a tee vee set Are you “ready for this?” inquire the Funky Four Plus One in “That’s the Joint:” Are you ready for rapping? Many people are, heralding this counter­-polyrhythmic poetic litany as an art form, the “new wave” in black music. Others see it as an ugly fad, disgusting nigger music coming from those wretched “boxes,” aggravated aural assault/vandalism. It’s like the graffiti dilemma — is it art, or is it a nuisance? I think it’s an art form, but maybe I’m biased, because I come from the land of DJ Hollywood (the undisputed champeen of all rappers), Eddie Cheeba (“The Peoples Choice / the award winning voice / Eddie / Cheeba / Cheeba / Chee­-Chee-Chee-Cheeba”), and of course, Kurtis Blow (he’s on the go), to name a few. To paraphrase Kurtis Blowski, “A place called Harlem is my home.” Are you ready for this? Well I just can’t miss, with a beat like this. The beat­ — the beatbeat — the fonky beat is the key to rapping. And that’s what turns a lot of white and black listeners off. The beat is a product of the street and all of its raw, primal, and instinctive energy. These transcontinental urban griots echo the de­spair, pain, and anger of the South Bronx and Harlem (the world’s two major rap centers), which a lot of the cool-jerk white liberals and b.s. black bourgeoisie don’t want to hear. Rapping reminds them that everything is not cool and correct on the home front, like punk rock in England and reggae in the Caribbean. In fact, the “toasting” records of the West Indies are reminiscent of American rap."
