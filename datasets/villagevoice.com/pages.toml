["https://www.villagevoice.com/are-unions-getting-off-their-knees"]
title = "Are Unions Getting Off Their Knees? - The Village Voice"
description = "The Village Voice reports on the upcoming United Auto Workers Union leadership election and also on rising young labor activists."
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime Even as the UAW rank-and-file elects new leaders, Covid-hardened American workers are looking beyond legacy unions. Will Lehman works the night shift on the assembly line at Mack Trucks’ Macungie, Pennsylvania, plant. During the day, he’s running to lead the million-member United Auto Workers union. According to his website, Lehman, an avowed socialist, is building what he calls “a mass movement of the rank-and-file to break the dictatorship of the UAW apparatus and bring power to the shop floor.” At 34, Lehman is the youngest by a generation in the crowded field for president of the UAW, which was once considered a global model of a “progressive” and “squeaky clean” union but over the past few decades became captive to corrupt self-dealing on a breathtaking scale. Of late, the news media has zeroed in on a new generation of grassroots labor organizers, such as Chris Smalls, 34, who organized the independent Amazon Labor Union at the corporate behemoth’s Staten Island JFK8 warehouse. But not much attention has been focused on the generational tensions within established labor unions, which are often dominated by much older leaders who came to power in the 1970s, a time when unions had begun a steep decline. By the end of 2021, after close to two years of a global pandemic that has now killed more than a million Americans, 47 million U.S. workers had walked away from their jobs. A recent Brookings Institute analysis found that “around 16 million working-age (those aged 18 to 65) have long COVID today,” and, “of those, two to four million are out of work due to long COVID.” In February 2022, PBS NewsHour reported, “Among the reasons for the current labor shortage in the U.S. is the exodus of older workers retiring early during the pandemic.” In addition, the still relatively robust job market, despite the Federal Reserve’s hike in interest rates, has offered workers options for changing jobs, and even careers. To grasp the scale of this shift, consider that the mass of Americans who left their current employment is roughly four times the size of the entirety of the 12.5 million membership of the AFL-CIO. Workers now have leverage not seen for decades, and the nation’s unions are scrambling to rise to the challenge. In some cases, such as within the Teamsters and the UAW, those challenges include shedding well-earned reputations for corrupt dealings at the very top of these legacy unions."
author = "Robert Hennelly"
