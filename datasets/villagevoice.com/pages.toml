["https://www.villagevoice.com/artist-musician-terry-allens-life-story-adapted-for-the-page"]
title = "Artist/Musician Terry Allen’s Life Story, Adapted for the Page - The Village Voice"
description = 'The Village Voice looks at the massive new tome covering the life of artist/musician Terry Allen, "Truckload of Art."'
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime ‘Truckload of Art’ indeed: A boundary-smashing talent gets the genre-defying biography he deserves. “What makes us who we are — and how do we know?” That was the final line of an art magazine review I wrote of a Terry Allen exhibition at L.A. Louver in 2004–05. It is also the foundational question thoroughly and evocatively answered in the hefty, literary, and definitive new book Truckload of Art: The Life and Work of Terry Allen – An Authorized Biography, by Brendan Greaves (2024). An acclaimed visual artist and iconoclastic musician with more than one variety of devoted followings, Allen (born 1943) makes work that spans — or rather, manages to simultaneously occupy — the worlds of contemporary art, theater, film, and country music. That mid-aughts exhibition was one of a three-part Los Angeles invasion that saw a multimedia installation at the Santa Monica Museum of Art and a stage play recorded live at the Skirball Center, for an NPR broadcast. I saw it all and wrote about most of it. Same with Allen’s subsequent L.A. Louver shows, in 2011 and 2019 — the latter specifically dedicated to an examination of Allen’s integral, inseparable, embryonically intertwined practices in visual art and alternative country. I’ve interviewed him several times and been to many of Allen’s Panhandle Mystery Band concerts. And yet it wasn’t until I had absorbed this new book’s granular and evocative exegesis of Allen’s ancestry, youth, education, influences, fears, failures, and triumphs — across the decades over which his now signature, interdisciplinary poly-dexterity evolved — that I finally understood how it all comes together. For example, we art writers would often describe a suite of Allen’s neon-fringed assemblage-style sculptures or richly textured, surreal, symbol- and text-strewn drawings as “accompanying the 1971 album Juarez,” or “made at the same time as his new recordings.” My journey to Terry Allen runs through art galleries, but there are a range of music writers who have seen his appeal in reverse — not as a gifted artist who also writes songs but as a beloved, eccentric singer who also makes art. The late great Dave Hickey was the only critic who ever grasped the fullness of all of this and successfully addressed both aspects of Allen’s work equally and as a convincing whole — that is, until now."
author = "Shana Nys Dambrot"
year_published = 2024
year_updated = 2024
