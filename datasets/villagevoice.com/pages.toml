["https://www.villagevoice.com/as-the-ukraine-war-enters-year-four-the-kyiv-zoo-has-found-ways-to-shelter-animals-and-people-during-wartime"]
title = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime - The Village Voice"
description = "On the third anniversary of the Ukraine war the Village Voice looks at the harrowing effects of Russia's attacks on Kyiv's zoo animals."
full_description = "As the Ukraine War Enters Year Four, the Kyiv Zoo Has Found Ways to Shelter Animals – and People – During Wartime Ukrainian zookeepers created a haven for many creatures – from elephants to spiders – and an oasis for citizens of the capital city. When Donald Trump campaigned for re-election in 2024, he promised that on the first day of his presidency he would end the war that Russia, under Vladimir Putin, had launched against Ukraine in 2022. For some Ukrainians that pledge offered a glimmer of hope — that soon their country would be freed from life under constant bombardment. However, as their nation enters the fourth year of the most savage conflict in Europe since WWII, President Trump has attempted to invert history by casting Ukraine as the aggressor and calling its president, Volodymyr Zelenskyy, “A Dictator without Elections,” although Zelenskyy was elected in 2019 in a landslide deemed free and fair by the international community. Elections in the country have been postponed because of the ongoing war, but Zelenskyy retains, according to Ukrainian polls, a 57% approval rating among his fellow citizens. And it’s not only Ukrainians who disagree with Trump’s assertions. His own former vice president, Mike Pence, posted a forceful rebuke of Trump’s lies on X: “Mr. President, Ukraine did not ‘start’ this war. Russia launched an unprovoked and brutal invasion claiming hundreds of thousands of lives. The Road to Peace must be built on the Truth.” Even as Trump continues the process of shifting day to night where the facts about the Ukraine war are concerned, the citizens of that beleaguered country soldier on, taking care of each other as well as some of their most threatened inhabitants — the animals in Kyiv Zoo. In the early days of the invasion, as civilians rushed into the vast maze of underground train stations to shelter from attacks and thousands of others fled the city, the zoo’s animals were vulnerable. No one knew where Russian forces might strike next, as they set their sights on capturing Kyiv."
