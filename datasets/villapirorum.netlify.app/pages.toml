title = "AboutA propos"
description = "AboutA propos"
full_description = "Who the hell am I?Hello!Bonjour !Hallo! my fellow humans! My first name is Antoine (he/him, cool with they), a man of 48 living in France. Born in Toulouse, raised in South West of France with my brother, I studied computer science in Bordeaux then moved and stayed at Paris. WorkI've been working in the video-games development industry! And stil enjoying it! It's been more than 21 years at Cyanide Studio, which is crazy! and more than 15 as company Production Director, which gave me the opportunity to work on great projects with lot of amazing people! FamilyI'm the proud dad of two beautifull and adorable girls (19 and 16)!After a life in South west of France with my brother Thomas and me, my parents got retired and moved to our all time holidays destination, on the west coast: Saint-Palais sur MerMe and my lover and partner in crime are living together just nearby Paris (We have the metro line, so we can say it's Paris!)AfterworkMusic lover : Techno & Psytrance festivals, Rock & Punk Rock concerts! (scheduled events on my now page)Sci-Fi lover : SciFi books, movies and TV shows. (current readings & binging on my now page)Web-Dev lover : Doing web stuff and experimenting it on this site with indie-web tendencies! Web mentionsThese are webmentions via the IndieWeb and webmention.ioNo known mention, yet<p>Loading web mentions relies on JavaScript. Try enabling JavaScript and reloading.</p>URL of your site:"
