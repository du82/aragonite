["https://vim-adventures.com"]
title = "Learn VIM while playing a game - VIM Adventures"
description = '''VIM Adventures is an online game based on VIM's keyboard shortcuts. It's the "Zelda meets text editing" game. So come have some fun and learn some VIM!'''
full_description = '''VIM Adventures is an online game based on VIM's keyboard shortcuts (commands, motions and operators). It's the "Zelda meets text editing" game. It's a puzzle game for practicing and memorizing VIM commands (good old VI is also covered, of course). It's an easy way to learn VIM without a steep learning curve. You play a blinking cursor appearing one day in a semi text based world of Textland inhabited by little people but ruled by bugs. You soon discover that your arrival was foretold by an old prophecy and that you're expected to restore order to the world (in case you didn't make it to level 2 yet...). You start the game with only the ability to move up, down, left, and right. As you progress, you talk to people and collect items and keyboard buttons. Each keyboard button adds to the set of commands you can give the cursor, until you master VIM. You can also perform operations such as login, load and save game and others using the in-game menu at the bottom of the screen. For a complete list of commands you can type in the command line mode, please type ':help :' (without the quotes). These instructions are all you need to know. Hints scattered throughout the game help you and ease the learning process. You can't advance to the next level until you master a skill! The little people of Textland have a lot of helpful tips to share so make sure you talk with each and every one by bumping into them. In addition, every time you pick up a keyboard key, an explanation of what the key does and how it should be used is displayed. This window can be closed using ESC (as any other window in this game) and you can walk through the example using the '+' and '-' keys. You can get help on additional keys using the syntax ':help {char}' by replacing {char} with the character or word you would like to get help on. You can also type a topic such as 'registers' or 'text-objects' to get help on that topic. See below for a full list of possible arguments for the :help command. If you don't remember which keys you collected so far, or need to refresh your memory a little, you can click on the keyboard icon in the in-game menu, or type ':keyboard' to see a keyboard with your current available keys highlighted. Clicking or pressing on a key will show a short description of its function.'''
year_published = 2025
clearnet = "https://vim-adventures.com"
