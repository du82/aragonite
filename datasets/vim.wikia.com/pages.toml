["https://vim.wikia.com/wiki/Vim_Tips_Wiki:New_tips"]
title = "Vim Tips Wiki:New tips | Vim Tips Wiki | Fandom"
description = "Use this page to view new tips, or to discuss the fate of proposed new tips. Use this link if you want to create a new tip. Every few weeks we manually collect a list of the new tips that have..."
full_description = 'Vim Tips Wiki:New tips Sign in to edit History Purge Talk (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Use this page to view new tips, or to discuss the fate of proposed new tips. Use this link if you want to create a new tip. Every few weeks we manually collect a list of the new tips that have been created. Those tips are then discussed, and we decide whether a proposed new tip should be made a permanent tip with a tip id (possibly after some fixing), or whether the tip needs major work or should be merged with an existing tip, or whether the tip should be deleted because the material duplicates other work, or is in some other way unhelpful. There are many defective old tips (please help to fix them!). That makes us keen to only accept new tips when they are complete and helpful, and do not duplicate material that would be better covered in one of the existing tips. Lists of new tips New tips that need to be discussed. 2015 2014 2013 November 2012 (none in December 2012) October 2012 September 2012 August 2012 July 2012 June 2012 May 2012 April 2012 March 2012 February 2012 January 2012 December 2011 November 2011 Discussion on the following has been completed. October 2011 September 2011 August 2011 July 2011 June 2011 (none in May 2011) April 2011 March 2011 February 2011 (none in January 2011) December 2010 November 2010 October 2010 September 2010 August 2010 July 2010 June 2010 May 2010 April 2010 March 2010 February 2010 January 2010 December 2009 November 2009 October 2009 September 2009 August 2009 July 2009 June 2009 May 2009 April 2009 March 2009 February 2009 January 2009 December 2008 November 2008 October 2008 September 2008 August 2008 July 2008 June 2008 May 2008 April 2008 March 2008 February 2008 January 2008 June to December 2007 Listing other pages You can use special pages to list new or all pages. New pages (last 30 days) All pages Both new and all pages allow you to choose the namespace. (Main) means there is no special prefix to the title – this is used for all tips. User refers to pages with prefix User: (each page is created by a user to introduce themselves), and User talk refers to the User_talk: pages associated with each user. Using new or all pages is also useful for listing templates and categories. Community content is available under CC-BY-SA unless otherwise noted.'
