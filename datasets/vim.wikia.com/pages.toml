full_description = '''News Sign in to edit History Purge Talk (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> News (edit)[] satokar.com/viplugin gone? This site hosts a very popular vi plugin for Eclipse, something that is on the vim ToDo list. However, it's been 404 for some time now... an opportunity? JESii7 12:11, 28 April 2009 (UTC) Report Spam. Wikia has good ways to combat spam. One thing we cannot stop right now is creation of spam-pages. Please report such pages, to get a wikia staff member deal with it ASAP. bastl 09:00, 6 September 2007 (UTC) Policies under development. We are currently developing some guidelines for this wiki. If you are interested, have a look at Project:Policy and join the mailing list to discuss. bastl 14:49, 31 July 2007 (UTC) Simple stats for categories. Each category has now a stats subpage, that shows how many tips are/have to be reviewed. Categories using the catinfo template (e.g. Category:Searching) will get a link to the stats for free, others should be edited to use CatInfo. bastl 14:07, 26 July 2007 (UTC) New skin available. On the top right corner, you'll find a try new skin link. The smoke-skin is held in vim-green and provides a powerful feature: rating. Using that we will finally have all the features of http://www.vim.org/tips back, and have some more ... bastl 13:59, 26 July 2007 (UTC) Community discussions at vim-l@wikia.com[] Latest from vim.org[] Announcements Scripts vim@vim.org vim-dev@vim.org Community content is available under CC-BY-SA unless otherwise noted.'''
