full_description = 'in: Pages using DynamicPageList3 parser tag, Browse All tips for C family programming Sign in to edit History Purge Talk (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> All tips for working with programs related to the C language[] A tip intended for use with C++ programs may be useful for programmers working with other languages. A C language programmer could browse the Category:C tips and the Category:C++ tips. However, many tips would be in both category lists (so they would be seen twice). An alternative is to browse the list below which shows any tip that is in a category that may be of interest to a programmer working with C or C++ or C# or Java. For the individual category lists, see: Category:C Category:C++ Category:C sharp Category:Java All tips for C or C++ or C# or Java[] Compile Java with Jikes . . Categories: Compiler | Java | Review | VimTipView a Java Class File using a decompiler . . Categories: Java | VimTipUse grep to get a clickable list of function names . . Categories: C | Review | Searching | VimTipCompile Java with Sun JDK javac . . Categories: Compiler | Java | Review | VimTipComment your code blocks automatically . . Categories: Automated Text Insertion | C | Review | VimTipAdd your function heading with a keystroke . . Categories: Automated Text Insertion | C | Review | VimTipSyntax folding for Java . . Categories: Folding | Java | Todo | VimTipDecompile Java .class files automatically . . Categories: Java | Review | VimTipMake-compile current buffer . . Categories: C | Compiler | Todo | VimTipFunction signature previewer . . Categories: C | Review | VimTipGenerate Java setters and getters automatically . . Categories: Automated Text Insertion | Java | VimTipCopy C++ function declaration into implementation file . . Categories: Automated Text Insertion | C++ | Review | VimTipAuto insert Java class template when editing a new J