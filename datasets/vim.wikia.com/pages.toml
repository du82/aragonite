["https://vim.wikia.com/wiki/VimTip224"]
title = "Shifting blocks visually | Vim Tips Wiki | Fandom"
description = "Programmers often need to adjust indents (the amount of whitespace before the text on a line). This tip shows how it's done. See Indenting source code for related information, including settings that affect indentation. In normal mode, type >> to indent the current line, or << to unindent. Each..."
full_description = '''in: VimTip, Indenting Shifting blocks visually Sign in to edit History Purge Talk (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Tip 224 Printable Monobook Previous Next created 2002 · complexity basic · version 6.0 Programmers often need to adjust indents (the amount of whitespace before the text on a line). This tip shows how it's done. See Indenting source code for related information, including settings that affect indentation. Contents 1 Basic commands 1.1 Basic examples 2 More commands 2.1 More examples 3 Mappings 4 See also 5 References 6 Comments Basic commands[] In normal mode, type >> to indent the current line, or << to unindent. Each command can be used with a count. The operators > and < do the same for motions, text objects and visual selections. For all commands, pressing . repeats the operation. For example, typing 5>>.. shifts five lines to the right, and then repeats the operation twice so that the five lines are shifted three times. In insert mode, Ctrl-T indents the current line, and Ctrl-D unindents. When indenting or unindenting, lines are shifted one 'shiftwidth' to the right or left. Basic examples[] To adjust the indent on three lines: Put the cursor anywhere in the first line. Press V then jj to visually select the three lines. Press > to indent (shift text one 'shiftwidth' to the right), or press < to shift left. Press . to repeat the indent, or u to undo if you have shifted too far. Type gv if you want to reselect the lines (not needed). Alternatively, if you know that you want to adjust three lines, you can simply: Type 3>> to shift right or 3<< to shift left. Or: Type >2j to shift right or <2j to shift left. As mentioned above, the > and < commands combine with arbitrary Vim movements and text objects. For example, >} to indent from the cursor to the next blank line, or <aB to un-indent the current C-like {...} "block" structure. See indent a code block. More commands[] In normal mode, type == to automatically indent the current line according to your indentation settings. This command can be used with a count. The = command does the same, but for motions, text objects and visual selections. To reindent an entire buffer, use gg=G. To reindent many files, the argument list can be used: :args *.c :argdo normal gg=G :wall Or use the buffer list (caution, every buffer will be affected): :bufdo normal gg=G :wall In insert mode, 0 Ctrl-D removes all indentation on the current line, and ^ Ctrl-D does the same, but restores the original level of indentation for this line on the next line. When using 'cindent' or file type based indentation, Ctrl-F reindents the current line, like == in normal mode. The :> and :< commands take a range, and additional > or < can be used. For example, :12,20>>> indents lines 12 to 20 inclusive three times (adding three times 'shiftwidth' of indentation to the specified lines). More examples[] To set the indent on three lines to 12 spaces (or an equivalent mixture of tabs/spaces, depending on 'expandtab'): Put the cursor anywhere in the first line. Press V then jj to visually select the three lines. Type :le 12 then press Enter (abbreviation for :left 12). To remove all indents in a selected region, type :le then press Enter. To apply automatic indentation (this requires suitable indent rules for your file type): Type == to indent the current line. Type a number then == to indent that many lines, starting from the cursor. Press V then move the cursor to select a range of lines, then press = to indent the selection. Mappings[] If you select some lines then press > to indent the lines, the selection is removed. The indentation can be repeated on the same range using ., but if you still want to retain the visual selection after having pressed > or <, you can use these mappings vnoremap > >gv vnoremap < <gv Following is a more elaborate set of mappings (mapping Shift-Tab will probably only work on gvim). In normal mode, press Tab or Shift-Tab to adjust the indent on the current line and position the cursor on the first nonblank character; in insert mode, press Shift-Tab to unindent; in visual mode, press Tab or Shift-Tab to adjust the indent on selected lines. nnoremap <Tab> >>_ nnoremap <S-Tab> <<_ inoremap <S-Tab> <C-D> vnoremap <Tab> >gv vnoremap <S-Tab> <gv An alternative for anyone using :behave mswin, is to select lines by holding down Shift and pressing the cursor down or up arrow keys. However, in select mode, if you press >, the selected text will be replaced with '>'. Instead, you can use Tab to increase the indent, and Shift-Tab to decrease it, with these mappings: vnoremap <Tab> > vnoremap <S-Tab> < In select mode, visual-mode mappings temporarily set visual mode (:help Select-mode-mapping).Also, the select mode will be retained. You could use the following alternative if you want to exit from select mode after pressing Tab or Shift-Tab: vnoremap <Tab> >gV vnoremap <S-Tab> <gV See also[] 597 Indent a code block indenting a code block ({...}) References[] :help gv :help blockwise-visual :help v_b_I :help = Comments[] Where :wall is used, should mention :set hidden. We should have a tip on that so we can just link to it. JohnBeckett 04:33, June 28, 2012 (UTC) in Vi :set ts=4 sw=4 will set the tab space to 4 Categories Categories: VimTip Indenting Community content is available under CC-BY-SA unless otherwise noted.'''
