full_description = '''Vim Tips Wiki:Imported tips Sign in to edit History Purge Talk (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> This wiki was created in June 2007 by importing the tips from http://www.vim.org/tips/ (see notes on the import). Since that time, many tips have been refactored, and new tips have been added (see new tips). This page lists the ids (1 to 1504 inclusive) of the imported tips, showing the original authors. It is likely that author names will be removed from old tips, particularly where a significant amount of editing has occurred on this wiki, and where the author has not been active in the wiki or the wider Vim community for an extended period. The history of each tip records editor activity, and this page records the original authors of the imported tips. Missing tips The following 200 ids are for tips that never existed on vim.org (blunders or spam that was deleted from vim.org): 56 57 59 60 61 157 160 186 392 504 508 540 549 594 657 702 704 728 729 730 788 836 838 854 881 921 980 993 1027 1044 1047 1049 1056 1057 1060 1062 1069 1080 1081 1082 1085 1086 1089 1094 1095 1096 1097 1098 1099 1100 1102 1104 1105 1106 1113 1115 1116 1121 1122 1135 1136 1137 1138 1139 1140 1143 1144 1145 1163 1165 1169 1170 1175 1176 1179 1184 1186 1191 1201 1205 1207 1208 1209 1210 1211 1219 1222 1236 1239 1243 1248 1250 1252 1254 1255 1256 1258 1263 1264 1270 1271 1277 1278 1307 1310 1325 1328 1329 1331 1337 1339 1340 1342 1344 1345 1346 1350 1351 1352 1353 1355 1357 1358 1367 1371 1372 1374 1383 1394 1395 1396 1397 1398 1399 1400 1401 1402 1403 1404 1405 1406 1407 1408 1409 1410 1411 1412 1414 1415 1416 1417 1418 1419 1420 1421 1422 1423 1424 1425 1426 1427 1428 1429 1430 1441 1442 1444 1445 1446 1447 1448 1449 1450 1451 1452 1453 1457 1459 1460 1461 1462 1464 1466 1467 1471 1473 1474 1476 1478 1480 1481 1482 1485 1488 1489 1492 1493 1494 1502 1503 The followin