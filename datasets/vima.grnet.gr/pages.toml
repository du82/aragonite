["https://vima.grnet.gr/about/terms-of-service/en"]
title = "ViMa - Terms of use"
full_description = "The cloud services (hereinafter referred to as “services”) are provided by the Greek Research and Technology Network SA / GRNET SA to the academic and research community, in order to promote academic, educational and research aims. The distributed computing and network resources can be optimized in order to host services or for experimental purposes. ΥCloud Service with end users in the academic and research community which includes the following subsystems: Cyclades, providing Virtual Desktop and pithos+ as a web storage. The services are addressed to the Greek Academic and Research community (students, professors, researchers etc). The services are available to beneficiaries in order to cover their wider educational, research and academic needs. The accounts created by beneficiaries of the services are personal. Distribution of accounts to third parties is prohibited. The direct or indirect use of the services in order to promote any kind of commercial aim is expressly prohibited as well as any use which violates by any means the laws and provisions in force. It is prohibited to use the services in order to send messages and download, publish or distribute content: The malicious use of the services for any kind of electronic attacks aiming to obstruct the use of the services itself or the use of third services, to take advantage of vulnerabilities, to have illegal access to the systems of third parties and to hack personal data is prohibited. More specifically but not exclusively: All of the above is applied and in force solely for the legal content and only on condition that the use and publication of the content does not violate the law. The use and distribution of the content which violates the copyright of third parties violates also the present terms of use. GRNET SA is not in any way responsible nor can control the existence of such rights. Consequently, GRNET SA considers that every user is a holder / owner of the aforesaid rights and guarantees – by accepting the present terms – that he/she has the necessary rights so that the use and publication of the content does not infringe the law and the relevant provisions."
