["https://vima.grnet.gr/about/info/en"]
title = "ViMa - About the service"
full_description = "The ViMa (Virtual Machines) service aims to provide to the educational and academic community access to shared computing and network resources that can be used for production purposes. In particular, the service is addressed to the NOCs of GRNET's constituency or laboratories involved in national and European funded projects and have needs for computing resources. In order to be able to ensure high availability, the service is hosted on multiple computing clusters on more than on Datacenters, while for the safe storage of data an external SAN unit is used. The network infrastructure ensures seamless connection to the backbone network and the commercial internet at very high speeds. The service supports a variety of benefits tailored to the needs of potential users. Users are able to use the IP addresses of their institutions to virtual machines using L2VPN, as well as using IPv6. Requests or clarifications regarding the operation of the service should be submitted to the support GRNET phone at 800-11-47638 or via e-mail to support-at-grnet.gr. To create a virtual machine, the applicant must fill out the form online accepting the terms of service. In order to properly complete the application the applicant needs to submit information for all fields. Specifically, the contact details of the technical and the management personnel should be supplied. It must be stressed that after delivery to the applicant(s), the technical manager is the sole person responsible of management, proper operation and safety of the VM. As described in the terms of use, the purposes served by the virtual machine must be exclusively educational or research. GRNET will not to intervene in the virtual machine nor handle the services provided, however, if spambots or similar activity is reported GRNET holds the right to disable the virtual machine. Next, the applicant must then fill in fields relating to the configuration of the virtual machine. First come the general computational requirements and the network requirements follow."
author = ""
year_published = 2025
