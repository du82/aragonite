["https://vinayak.io/about"]
title = "About - Vinayak Mehta"
full_description = "About Hey there 👋 My name is Vinayak, and I’m a software engineer based in Paris. Before moving here, I lived in Delhi, where I grew up. I enjoy writing useful open-source code and talk about the things I learn. I also enjoy running, climbing, and exploring the world through travel, food, and meeting new people. Let's chat! Towards the end of 2020, I joined June as the first employee, just before we started our Y Combinator batch. We're building the best way to do customer support, and we ship new features, improvements, and fixes every week. I spent the fall of 2020 at the Recurse Center, my favorite programming community. I explored a bit of everything, but the highlight was learning how Python C extensions work and building wheels for Linux, macOS, and Windows. I wrote about what I did every day for 3 months while I was there. Before that, I worked at Grofers (now Blinkit), a quick-commerce service, where I helped establish the data infrastructure. This included building a replication tool to reliably move data to our data warehouse, and a notebook-centric data platform that enabled the data team to train models and build dashboards. During this time, I also organized the PyData Bangalore and Grofers Tech Talks meetups. Before that, I worked at Socialcops (now Atlan), a data intelligence company, where I contributed to building the DISHA dashboard, India's national data platform. This platform integrates data from various ministries, enabling the Indian government to evaluate key schemes and initiatives. I also developed tools to help the data team create products for tracking disease outbreaks in India, monitoring businesses' contributions to achieving the SDGs, and much more."
