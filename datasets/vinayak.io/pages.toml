["https://vinayak.io/2025/01/12/cerfs-volants"]
title = "Cerfs-volants dans le ciel de Delhi - Vinayak Mehta"
description = "Un texte que j'ai écris pour mon cours de français."
full_description = '''Cerfs-volants dans le ciel de Delhi 12 January 2025 · français Tweet J'ai besoin de présenter un exposé sur un sujet peu connu de mon pays dans mon cours de français cette semaine. J'ai choisi comme sujet : le vol des cerfs-volants dans le ciel pour célébrer la fête de l'indépendance à Delhi, d'où je viens. J'ai essayé de faire des recherches mais, j'ai pas trouvé beaucoup d'informations, particulièrement sur wikipedia qui parle de chaque état sauf Delhi (peut-être parce que Delhi n'est pas un état et que ce sujet est peu connu, même en Inde). Donc, j'ai décidé d'écrire ce texte pour contribuer à ce sujet sur l'internet. Profitez-en ! Bonjour à tous. Aujourd'hui, je vais vous parler d'un sujet peu connu de l'Inde... Le Taj Mahal. Je plaisante ! C'est l'une des sept merveilles du monde, donc c'est très connu. En fait, je vais vous parler d'une tradition unique à Delhi, et dans d'autres villes du nord de l'Inde, qui se déroule chaque année le 15 août : le vol de cerfs-volants dans le ciel pour célébrer la fête de l'indépendance. Il y a d'autres fêtes en Inde où on fait voler les cerfs-volants, comme Basant Panchmi et Makar Sakranti, mais aujourd'hui, je vais vous parler de la tradition spécifique de la fête de l'indépendance. Qu'est-ce qu'un cerf-volant ? Le cerf-volant (patang), pour faire simple, c'est un objet qui vole, généralement composé de papier léger fixé sur une armature de bois. Il est contrôlé par un humain en utilisant une ou plusieurs ficelles. Chaque année, à l'occasion de la fête de l'indépendance, il y a beaucoup de cerfs-volants dans le ciel de Delhi, de toutes couleurs, formes et tailles. source Un peu d'histoire Ces cerfs-volants ne sont pas simplement des jouets, ils représentent l'espoir et la liberté. Vous voyez, quand l'Inde était sous le colonialisme britannique, les révolutionnaires utilisaient des cerfs-volants pour envoyer des messages de protestation. Par exemple, quand le Simon Commission a visité l'Inde pour décider comment réformer les anciennes règles du gouvernement britannique, les révolutionnaires ont fait voler des cerfs-volants avec le slogan "Simon Go Back", et les ont fait tomber sur une fête de membres de la commission pour les accueillir. Ainsi, après une longue lutte, l'Inde a gagné son indépendance le 15 août 1947, et on le fête chaque année depuis. source Préparation avant le 15 août Le 15 août est un jour férié en Inde, et quelques jours avant cette date, il y a beaucoup de marchés où vous pouvez acheter des cerfs-volants. Vous avez besoin d'acheter les ficelles aussi, parce que les cerfs-volants ne suffisent pas. Le soir du 14 août, on prépare nos cerfs-volants pour le jour suivant en fixant les ficelles sur l'armature de bois des cerfs-volants, de manière à ce qu'elles ne se détachent pas pendant le vol. source Le jour de la fête Ce jour-là, le matin, il y a une fête de voisins où on hisse le drapeau indien et on chante l'hymne national. On partage ensuite le petit-déjeuner, et on a hâte de commencer à faire voler des cerfs-volants. Je les ai fait voler avec mon père et mes amis, c’était toujours au-dessus du bâtiment où nous habitions. Il est donc essentiel de trouver un endroit approprié, parce qu’il peut être difficile de faire voler un cerf-volant s'il y a des arbres, des grands bâtiments, ou des câbles électriques. Il faut trouver un espace ouvert comme un parc ou la terrasse de vos bâtiments. Comment faire voler un cerf-volant Quand vous êtes prêt, positionnez-vous dos au vent pour utiliser le vent pour faire voler votre cerf-volant. Quand le cerf-volant est en l'air, déroulez (dheel dena) plus de ficelles pour l'aider à monter plus haut. Si vous tirez la ficelle (khinch dena), le cerf-volant vole dans la direction de son nez. Avec cette technique, vous pouvez faire voler votre cerf-volant haut et bas dans le ciel. Cette chanson de Bollywood (ci-dessous), de mon enfance, décrit comment faire voler un cerf-volant. En réalité, il n'y a pas de danse et de costumes ! .embed-container { position: relative; padding-bottom: 56.25%; margin-bottom: 1rem; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } Je pense que faire voler des cerfs-volants enseigne aux enfants les valeurs de la patience, de la concentration, et du travail, parce qu'il ne vole pas très facilement, particulièrement quand il n'y a pas beaucoup de vent, et cela demande beaucoup d'efforts au début. C'est aussi une activité qui renforce les liens entre les générations, parce que c'est une compétence que les parents, en particulier les pères, enseignent à leurs enfants. Je me souviens, quand mon grand-père et mon père m'ont appris à faire voler des cerfs-volants, ça a pris beaucoup de temps, et je ne suis toujours pas aussi bon qu'eux, mais c'était les meilleurs moments de ma vie. Les batailles de cerfs-volants Maintenant, je vais vous parler d'un concept qui rend le vol de cerfs-volants très amusant : les batailles (peche ladana). On peut utiliser n'importe quel type de ficelle pour faire voler nos cerfs-volants, mais ils seront coupés au combat par d'autres cerfs-volants. Donc, on peut utiliser du manja, un type de ficelle recouverte de poudre de verre partout, ce qui la rend très efficace au combat. source Si vous êtes dans une bataille avec un autre cerf-volant, vous avez deux choix. Soit, déroulez la ficelle rapidement, ou tirez la ficelle plusieurs fois. Ça la rend comme un couteau. Si vous coupez le cerf-volant de votre adversaire, vous devez crier "Ai-Bo !" pour attirer leur attention, et pour déclarer votre victoire. C'est très amusant, mais ce n'est pas sans danger. Beaucoup d'humains et oiseaux ont perdu la vie à cause de ce type de ficelle qui est très forte. Donc, il faut utiliser les ficelles normales. Conclusion Bref, le jour de l'indépendance, c'est pas juste pour faire voler des cerfs-volants. C'est le meilleur moment de convivialité inoubliable pour passer du bon temps avec votre famille, vos amis, et votre communauté. Beaucoup de quartiers à Delhi sont très denses, donc vous pouvez voir vos voisins sur leurs terrasses. On joue de la musique sur de gros haut-parleurs, et on partage de bons repas. C'est comme une grande fête. Cette tradition me rappelle l'importance de célébrer la liberté et de transmettre des valeurs aux générations futures. source var disqus_shortname = "vinayakmehta"; var disqus_identifier = "2025/01/12/cerfs-volants/"; var disqus_url = "https://vinayak.io/2025/01/12/cerfs-volants/"; (function () { var dsq = document.createElement("script"); dsq.type = "text/javascript"; dsq.async = true; dsq.src = "//vinayakmehta.disqus.com/embed.js"; ( document.getElementsByTagName("head")[0] || document.getElementsByTagName("body")[0] ).appendChild(dsq); })(); Please enable JavaScript to view the comments.'''
