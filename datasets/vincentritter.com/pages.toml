title = "Signature // Vincent Ritter"
description = "One thing that always gets me is my signature. It’s never the same. I’ve never really tried to create a unique style either."
full_description = "Signature One thing that always gets me is my signature. It’s never the same. I’ve never really tried to create a unique style either. When I got my new passport I decided to wait a little bit before signing it, until I got a little stressed for not having done it. I got my nice pen ready, went and practiced in my notepad. It felt great. All trial runs looking the same. For once I was happy with what I created, and could recreate. So I decided there and then, after 6 goes, to sign my passport. I fucked it up at the first stroke. No resemblance to what I practiced. Probably because I didn’t move my notebook during the trial run. Same context window. Oh well. See you again in 10 years. Maybe one day I’ll get it right... although I kinda like that it’s always different depending on the day. 2025-02-04, 16:11"
