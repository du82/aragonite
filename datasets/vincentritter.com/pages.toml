title = "Waiting // Vincent Ritter"
description = "It’s Monday, plans are plenty, sent some invoices out to start the day."
full_description = "Waiting It’s Monday, plans are plenty, sent some invoices out to start the day. I opened my code editor, did a small change. Phone call, the security guys are coming to replace something on the alarm system. Gotta move the desk, prepare things. They’re here now, but there is a snag. Taking longer than expected. My energy levels are good, but my motivation is out the window. I’m waiting, fully knowing that in an hour I have to leave and pick up the kiddo at school. What’s the point. Will I return to work today? Now I’m just waiting. 2025-02-03, 10:19"
