title = "About // Vincent Ritter"
description = "Dad, husband and software creator, crafting apps for web & handhelds."
full_description = '''Vincent Ritter 👋 About I'm a dad to an amazing kid, husband to the most beautiful wife in the galaxy, and a software creator making web and native applications using Ruby on Rails and React Native. I live in Poland 🇵🇱 I know how to fly aeroplanes commercially and that has been my dream since I can remember (age 5 and up). I spent many years pursuing this and was blind to everything else around me — silly me. Then I got the ticket, and life happened, and now I code for a living — and let me tell you, I am so thankful for what I do. In general I am a calm person and like to make jokes when things get difficult — it's an interesting character flaw that comes at you unexpected. I don't like being pushed around or told what to do, so I might end spectacularly in a fireball one of these days. When I step outside the "technology" bubble — and boy do I (we) need it — I enjoy being with my daughter and wife, walking and generally travelling… and doing absolutely nothing (except the driving). Oh and I absolutely love rollercoasters — so you'll find me riding one if the opportunity arises. This site acts as portal to my past and present self that one day I can look back on, on my steps forward and also missteps along the way. Life isn’t a straight road, so it’s nice to have a space of my own to share and reflect on. Email me and say hello ([email protected]) - Vincent P.S. This is a picture of me, coding, happy... but yet... 😋 Read: Latest: 2025-02-20, 17:16 Blog long form posts and thoughts. About me read more about me. Dev diaries assorted dev blog posts for my projects. Others: Feeds follow me using RSS. Podcasts find my podcast episodes here. Insanely great! 💌 email me 📈'''
