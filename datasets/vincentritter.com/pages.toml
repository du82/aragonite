full_description = "Update — Feb 20th, 2025 Can you believe it, it’s 2025! How time flies. I wanted to keep this short as I’ve been working across all my projects for the past few weeks, and I’ve also been busy with client work — more than usual, which is a good thing! Going into this year, as I already said, I wanted to focus more on Tinylytics. So creativity struck and I made big changes to the look and feel. Have a look and let me know what you think — also includes a new homepage. More to come here of course. Super happy with the way it all turned out, and I regret absolutely nothing, even the 5AM bed times. I also wrote about some extra changes here. Anyway, happy. I am proud of the UFO 🛸 Oh... and I wrote... tests... Tinylytics is getting big and I wanted to make sure that core functionality isn’t breaking when I work — because I usually iterate quickly and get things out the door. That also helped me find some bugs 🐛 Anyway... So I didn’t stop there and worked on new homepages for Sublime Feed, Scribbles and... yes... Shoutouts. Why not go through everything, right? Heaps of fun! ... and I am not done just yet — tip of the iceberg kinda thing. OK, this pretty much sums it up for now — loads of things, yet I have to finish now... we’re going away for a few days and I hope my stuff keeps on humming without me. Oh and if you want to play a little game I made with the help of my computer bits and bleeps digital circuits, tap on the spaceship on the bottom right of the site. (Best on desktop). Have fun! Yep, that’s it. Thanks for reading. Bye for now ✌️❤️ 2025-02-20, 17:16 Mojo JoJo It’s rare, yet I hope it lasts, that I’ve been able to just concentrate on coding the past 2 days. It feels like I managed to work 5 days worth in just under 48 hours. Holding onto this feeling even if I am running on 2 hours of sleep today. Holding off on posting what I’ve shipped today, but real happy with the way it has gone, let's see if a few folks figure it out. Also, yes, some bugs on the way, which I hope are fixed now as there were some big changes across different projects — I like to get stuff out the door and test in production after all (😅). Will I be able to keep the mojo for at least a week? I hope so. 2025-02-10, 19:22"
