full_description = "Mojo JoJo It’s rare, yet I hope it lasts, that I’ve been able to just concentrate on coding the past 2 days. It feels like I managed to work 5 days worth in just under 48 hours. Holding onto this feeling even if I am running on 2 hours of sleep today. Holding off on posting what I’ve shipped today, but real happy with the way it has gone, let's see if a few folks figure it out. Also, yes, some bugs on the way, which I hope are fixed now as there were some big changes across different projects — I like to get stuff out the door and test in production after all (😅). Will I be able to keep the mojo for at least a week? I hope so. 2025-02-10, 19:22"
