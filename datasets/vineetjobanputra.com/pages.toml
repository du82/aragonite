title = "Mushroom and Potato Paprikash - Vineet Jobanputra"
description = "Boring Life Story Not bothered about the life story behind this pizza sauce recipe?  Click here to go straight to the recipe. At the start of lockdown in 2020, my sister and I stopped getting Read more…"
full_description = '''Boring Life Story Not bothered about the life story behind this paprikash recipe? Click here to go straight to the recipe. Ever since watching Captain America: Civil War, I’ve wanted to try paprikash. A tomato-based paprika stew sounds like the perfect winter-warmer dish. Unfortunately (as a vegetarian), traditional paprikash is a chicken dish. I spent ages searching the internet for a tasty-sounding vegetarian version, but it wasn’t until a newsletter I signed up to shared one from the New York Times’ website that me that convinced me to give it a go. Serve with some toasted sourdough for a really satisfying comfort meal. Link to the Original Recipe https://cooking.nytimes.com/recipes/1022763-mushroom-and-potato-paprikash Tweaks I made The original recipe states that you need 2 pounds of mushroom. That’s way too much. My Version of the recipe Ingredients IngredientAmount (metric)Amount (imperial)Vegetable or Sunflower oil56 grams¼ cupCup or chestnut mushrooms750 grams1 ½ poundsMaris Piper (or Yukon Gold) potatoes650-700 grams1 ½ poundsSalt1 pinch1 pinchBlack PepperTo tasteTo tasteButter14 grams1 tablespoonGarlic cloves88Sweet Paprika14 grams2 tablespoonsSmoked Paprika1.15 grams½ teaspoonDry white wine (such as Sauvignon Blanc)60 ml¼ cupVegetable Stock230 ml1 cupCrushed tomatoes400 grams14 ouncesSour Cream240 grams / 237 ml1 cupPlain flour24 grams3 tablespoonsDill4.5 grams (fresh) or 2.10 grams (dried)½ cup (fresh) or 2 teaspoons (dried)Fresh Parsley30 grams½ cup Prep (55 minutes) Prepare the vegetable stock if making it from stock cubesChop mushrooms in half and remove any tough stemsPeel potatoes and chop into 1-inch cubesChop the onionCrush the garlicWarm sour cream to room temperatureIf using fresh dill, chop itChop the parsley Method (55 minutes) Heat the oil in a cooking potParcook the potatoes in salted boiling boiling water for 3-5 minutesAdd half of the mushrooms to the oil, season with salt and brown the mushrooms, stirring until about half-way cooked and most of the liquid from the mushrooms has cooked awayTransfer the first batch of mushrooms to a plateAdd a little more oil if required, then repeat with the remainder of the mushrooms, setting aside once doneReduce the heat to medium-highAdd the butter to the pot, then add onionsOnce the onions have begun to soften, add the garlic and cook until the onion is soft and the garlic is fragrantReduce the heat to lowAdd the sweet and smoked paprikas then stir well to combine the spices with the onionOnce combined, add the wine, increase the heat to medium and scrape up any browned bits at the bottom of the pan / potAdd the vegetable stock, crushed tomatoes, potatoes and mushrooms (along with any liquid that has accumulated from the mushrooms) and stir togetherSeason generously with black pepper, then increase the heat until simmeringCover the pot and cook for 15 minutesUncover the pot and let allow food to continue cooking whilst you follow the next stepCombine the sour cream and flour in a bowlAdd a few ladles of the hot liquid from the pot into the sour cream and flour mixture and mix togetherReduce the heat to low, then add the sour cream mixture and herbs into the potStir well. If it’s too thick, add ½ a cup more water to the stew.Add more salt and pepper to taste if required Categories: Recipes Tags: Captain AmericaHungarian CuisinePaprikashWinter Food 0 Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Name * Email * Website What's on your mind? Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
