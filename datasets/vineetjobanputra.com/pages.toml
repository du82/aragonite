["https://vineetjobanputra.com/2022/01/15/how-to-start-a-new-blog-in-7-easy-steps"]
title = "How to start a new blog in 7 easy steps - Vineet Jobanputra"
description = "“it’s not about what you know, it’s about who you know” My dad always stressed the importance of building relationships.  Whether they were professional, personal or romantic.  As I’ve gone through the last few years, Read more…"
full_description = '''Whether it’s to gain exposure, educate others or share something you are passionate about, blogging is a great way to share content. That said, if you have never done it before, knowing where to start can be pretty daunting. In this post, I’ll be giving you a step-by-step guide on how to start a blog, based on my own, personal experience. Step 1 Spend so much time watching Netflix over the Christmas break that your brain plays their sound logo when you wake up. Step 2 Decide that step 1 isn’t healthy, and you need to find other ways to occupy your time. Whilst reflecting on some of the things you have achieved over the past few years (in 2019 I performed stand up comedy, in 2020 I built an app, and in 2021 I ordered from Deliveroo so many times in one day that my credit card got frozen due to suspected fraud), decide that you want to achieve something with your life in 2022. Step 3 Speak to a friend who recently started his own blog. Take a look at his website and think that it would be a nice achievement if you started your own in 2022. IMPORTANT: During this step, don’t think too much. If you do, you will realise that (a) you’re not a writer, (b) you don’t know what you want to write about and (c) writing a blog isn’t all that much of an achievement anyway. Step 4 Tell your friend that you like his website and that you want to make your own. As any good friend should, he will encourage you to do it. In a moment of impusivity, agree. Before your rational brain kicks in, buy a domain name (I used google domains), get some web hosting (I used RX Host) and set up a landing page for your website (This site is built on WordPress, which created the landing page for me). Step 5 Have all the realisations you would have had if you did Step 3 incorrectly. Step 6 Commit to the idea anyway. At this point, spend the next few days watching videos and reading articles about how to write stories. You are meant to be writing a blog and not stories, but it’s still good to procrastinate. Step 7 Realise that it’s been a while since you agreed to write a blog, and that you actually need to write a blog post. Instead of writing something meaningful or useful, make your first article a satirical, meta post instead. Categories: Blog Tags: BloggingHow ToPersonal 0 Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked * Name * Email * Website What's on your mind? Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
