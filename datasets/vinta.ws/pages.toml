title = "我的朋友都是智障 – 左邊網 on Facebook – 真．他媽的"
description = """
粉絲專頁：真．他媽的
粉絲專頁：後娘砲主義
粉絲專頁：左邊網
 
前陣子花了一點時間研究了 Facebook 的 API，然後替「左邊網」寫了幾個新產品。不是我在說，那個 Facebook Developer Wiki 真的詳細到爆炸（我一直以為 IT 從業人員都不喜歡寫 documents），這是幾個比較有用的頁面：
 

API Methods 
FBML Tags 
FQL Tables 
Javascript SDK
 
我用的是官方的 PHP Client Library，一開始我也不知道該從哪裡下手，就傻乎乎地在 Facebook Developer 註冊了"""
full_description = '我的朋友都是智障 - 左邊網 on Facebook Posted on 2010/03/092010/03/15Author VintaPosted in 在網誌裡鬼扯才是正經事 粉絲專頁：真．他媽的 粉絲專頁：後娘砲主義 粉絲專頁：左邊網 前陣子花了一點時間研究了 Facebook 的 API，然後替「左邊網」寫了幾個新產品。不是我在說，那個 Facebook Developer Wiki 真的詳細到爆炸（我一直以為 IT 從業人員都不喜歡寫 documents），這是幾個比較有用的頁面： API Methods FBML Tags FQL Tables Javascript SDK 我用的是官方的 PHP Client Library，一開始我也不知道該從哪裡下手，就傻乎乎地在 Facebook Developer 註冊了一個新的 app，然後看到那些 Authentication、Canvas 和 Connect 之類的鬼設定時，我就傻住了，撒小？這是撒小啊？這些東西到底是幹什麼用的啊？但是，按了那個 example code 之後，一切都豁然開朗了。 再多的文字說明也比不上一段程式碼範例。 左邊網 Facebook 產品線 我的朋友都是智障 - 在無垠的網路之海中，挖掘出您的朋友們不為人知的秘密 完全不想做正經事 - 無聊的時候可以做的十萬件事 好想主持兒童節目喔 - 取一個讓小朋友喜歡的藝名是成為兒童節目主持人的第一步 那個「我的朋友都是智障」的程式有一個問題，就是按了「喔喔喔，我要再玩一次」的按鈕之後，常常結果只會出現 "Facebook 使用者" 的字串，而不是出現朋友的名字，我是用 fql_query() 去抓朋友清單，有沒有人知道為什麼會這樣？ 寫這些程式的過程中，雖然技術面很基層，只是把 Facebook 定義好的 API 拿來用而已，但是，寫程式是一件很有樂趣的事嘛～ 尤其是寫這種靠北的小程式，我好幾次都被自己想出來的「爛梗」逗得超開心，雖然 debug 的時候就開心不起來了......... 忍不住想要岔題，我幾個禮拜前發現我用 Twitter 的時間已經超過三年了，我自己都覺得超扯，三年耶！高中都要畢業了！我都 tweet 了這麼久了，推數還是沒有超過一萬，那些推了兩、三萬則推的人到底是有多雜唸啊？這三年來我不知道在網路上製造了多少無用的 data，我越來越覺得所謂的 User Generated Content（UGC）大概有九成以上都是垃圾吧。話雖如此，推特對我的意義也不是幾句話就可以說清楚的，除了有許多「回憶」之外，更重要的是認識了不少有趣又怪異的朋友，如果不是推特，我根本不可能認識這些傢伙。畢竟我這麼愛宅在家，而且我好喜歡我的電腦。 這樣算起來，開始寫部落格到現在，也有四、五年了，當初之所以寫起網誌，好像也只是想湊個熱鬧。其實我很喜歡湊熱鬧，每次看到別人在旁邊聊得很開心的時候，我都好想湊過去說「什麼什麼？你們在說什麼？拜託告訴我」，可是這有違我平常的死魚臉形象，所以我好幾次都忍住了，所以事情才會搞成這樣。 因為網誌寫到一半我就跑去晾衣服，所以我忘了接下來要說什麼，我需要一點時間回想一下............... 好了，我想起來了。 花了這麼多的時間在部落格上，半夜不睡覺只是為了寫一篇靠北的網誌，其中一項重要而且樂此不疲的動機是「惡意」。當然，並不像字面上那樣帶有強烈的負面涵義，而是單純地「想要 "冒犯" 某個人、某個族群或某種價值觀」的一股衝動。因為本身個性很糟的關係（這不是自嘲也不是妄自菲薄），總是喜歡隨便取笑別人，說一些不合時宜的玩笑，然後覺得這樣很有趣，即使沒有人真的那麼認為。不過，雖然提到惡意啊諷刺啊之類的理由，但是，說到底，大多數時候做的大部分事情，通常也只是為了好玩而已：自己講的笑話，我自己覺得很好笑啊，不行啊？！ 沒有什麼事情比有趣更重要了。我很喜歡喜劇，即使沒有任何深刻的內涵，即使既低級又愚蠢，我還是喜歡喜劇。就算講了一個爛笑話，也要很逞強地說 ── 幹！超好笑！ P.S. 頁首的「大叔虎」來自推友 @zingyu 的「新年賀圖」，他是我在 Twitter 上相當欣賞的人之一，而且他好宅，有一次我還在推特看到他在考試的時候用手機上網發文到豆瓣上求解答（太酷了）。而且我覺得我越來越親中了，沒辦法，VeryCD、豆瓣、射手網，還有 Google Reader 裡一大堆的大陸博客，這是文化入侵！更別提 PPS 了，那根本就是中國大陸的統戰工具！ Oh No Ono Swim Tagged: BloggingFacebookTwitter左邊網程式碼'
