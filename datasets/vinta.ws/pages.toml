title = "Twitter 推特 是我心樂歌 – 真．他媽的"
description = """
在人類掌握電力以來，最 powerful 的發明無疑是 computer；從 computer 出現到現在，最 wonderful 的發明一定非 Internet 莫屬；而 Internet 普及之後，最 magical 的產物，根本就是 Twitter 了，當然，還有 Google Search ─── 你瞧，身為一位稱職的 CSIE 的學生，總是要把句子裡很多沒有必要（完全沒有必要）的部份換成英文用詞，因為教授都是這麼說話的。
 

我要你們在下禮拜前搞懂怎麼用這個 sensor 傳 data。這是之前你們學長還沒寫完的 code，如果有什麼問題，網路上有很多 document 可以"""
full_description = 'Twitter 推特 是我心樂歌 Posted on 2009/03/152011/05/01Author VintaPosted in 在網誌裡鬼扯才是正經事 在人類掌握電力以來，最 powerful 的發明無疑是 computer；從 computer 出現到現在，最 wonderful 的發明一定非 Internet 莫屬；而 Internet 普及之後，最 magical 的產物，根本就是 Twitter 了，當然，還有 Google Search ─── 你瞧，身為一位稱職的 CSIE 的學生，總是要把句子裡很多沒有必要（完全沒有必要）的部份換成英文用詞，因為教授都是這麼說話的。 我要你們在下禮拜前搞懂怎麼用這個 sensor 傳 data。這是之前你們學長還沒寫完的 code，如果有什麼問題，網路上有很多 document 可以查。第二個 function return 的是 object 不是 address。這個 pointer variable 不能隨便 assign，它才不管你什麼 type，compiler 當然會 error 啊！ 我舉幾個例子好了。 比如說，你正在客廳裡給鋼彈模型上色，卻看到室友的女朋友衣衫不整還滿臉嬌羞地從房間出來上廁所，這時候，你就可以打開自己的 Twitter 頁面，輸入以下的文字： 我好宅喔...... 別人在 "幹" 什麼而我在幹什麼...... 或者，看棒球賽的時候，除了跟朋友一起在電視機前面鬼叫（然後對棒球沒有興趣的室友只好把房門關起來默默地打網誌）或是上 PTT 跟其他鄉民一起靠北之外，你可能也會看到有人在 Twitter 上大喊： 幹你娘！中華隊又被雙殺！啊啊啊！那個韓國人！ 偶爾也能夠看到某某大學的電影社社長因為校方過於繁瑣、官僚以及根本就是刻意刁難的體制作業而在 Twitter 上憤怒地說： 我要去學務處門口演 "幹！不要阻止我！我要打他！我要進去打他！" 的戲碼 # 也不時會看到相當精闢的政治評論： 每次羅文嘉沉潛練功許久再出江湖，一出手就把自己丟下懸崖 然後，再回家沉潛。# 每次看到鬼話新聞的時候就會想 當鄭弘儀坐在我旁邊說「應該不是這樣，你覺得是不是有可能......」的時候 我就大喊「麥靠北啦！幹！」# 如果你是 Twitter 重度上癮的使用者，無時無刻都想 Twitter，你可能會在床上抽事後菸的時候，忍不住把筆電搬來打開 Twitter 的網頁： 哈哈哈 請叫我一夜七次郎～ 他的女朋友可能正在浴室裡用手機 PO 了一則： 唉 好煩...... 我不知道該不該跟男朋友坦承其實我以前是男人 而且還是他小學三年級時候的副班長 我還記得他那時候常常捉弄我 叫我娘娘腔...... 我兩年前才變性完成 我好怕說出事實之後他就不愛我了 我該怎麼辦？ 當然，並不是所有推特的使用者都是那種老是把「幹」這類低俗的字眼掛在嘴邊的沒有教養的不入流的傢伙，Twitter 上有著各式各樣的人，用一個大家比較容易理解的比喻就是像「陳冠希電腦裡的資源回收筒」那樣 ─── 例如，已經開學四天了，我卻連校門都沒踏進過，這時候剛好看見有人推了一則： 明天我一定會去學校的。# 雖然知道一個陌生人今天蹺了一整天的課對於我在學業上的精進並沒有什麼幫助，但是，如同自己不小心睡過頭了沒去上早上的課，醒來已經是下午兩點，內心充滿罪惡感（在心裡深深地懊悔怎麼會這樣），而打開 MSN 一看，問了一堆人，發現大家都沒去上課，這種感覺，就好像得到至聖先師的救贖似地感到好開心。 除此之外，Twitter 上有位「臺灣人, 帥哥, 歌手, 發行過一張專輯, 技術牛人, Twitter RT 腳本作者, StickerAction.com 作者」的推友開發了 TwitThat 的服務，可以很方便地把你正在看的網頁推到 Twitter 上跟其他人分享，所以我們常常可以在推特上看到很多實用的、有趣的、獵奇的網頁。也時常有人提供一些非常具有參考價值的資訊： 在失業率這麼高的狀況下，年輕人應該都回去選村里長。 聽說月薪四萬五。# 看過這些例子之後，我相信大家都已經非常了解 Twitter 究竟是什麼了。但是 Twitter 真的很容易上癮，我有好幾次都有衝動要把它設為首頁...... 剛開始用 Twitter 的人，會發現你的頁面上就只有你一個人在靠北，如果你想要熱鬧一點，就得去 follow 其他人。當你看到某個你有興趣的對象，可能會想要 follow 他，但是又會想說「他又不認識我，這樣突然加他會不會很奇怪？他會不會以為我是他的初戀情人，在網路上看到他，就跑來跟他相認？但是我不是他的初戀情人啊！」妳可能會有這樣的顧慮，我一開始也這樣擔心，但是，反正他放在網路上就是想給別人看的，而且 follow 他又不用花錢，給 follow 一下是會死嗎？ 大部分的人，你 follow 他，他都會 follow back，沒有的話也是人之常情，可能是他瞧不起你，看了你的推特之後，發覺你這個傢伙整天都在說低級的話，沒有營養；或者是你以前得罪過她，把她喝醉酒想要走直線卻掉進糞坑的糗事上傳到 YouTube，你以為已經雨過天晴了，沒想到她還是很恨你。當然，除此之外，也有些是技術問題。例如：有些人把 Twitter 上鎖的話，再去 follow 別人，被 follow 的人常常就看不到了。 畢竟這玩意兒就是要人多才好玩，因為 follow 了不少人，覺得 Twitter 上的怪咖、妖人、亂民很多，而且，就像是交朋友，要相處久了你才會知道原來他（或她）坐過牢、喜歡吃狗肉、有陰陽眼或是晚上都蒙著面去殺富濟貧之類的，推特上真是無奇不有。 Twitter 有一個 Favorites 的功能（俗稱「打星星」），當你看到某位推友說出了令你恍然大悟、醍醐灌頂、豁然開朗、茅塞頓開的金玉良言或警世名句的時候，我們就會按下旁邊的星星按鈕，把它收錄到自己的 Favorites，如下圖： 為了怕大家在這條 Twitter 的「靠北之路」上走得太孤獨，我一定要介紹幾位我的 Favorites 裡的常客，他們或她們都好酷： @21man 大家都在問「許賀凱是誰？」他就是許賀凱！而且他本人比推特上有梗太多了 @bbbmess 我一直以為她是胖妹，還好不是（她跟許賀凱是姐弟，但是風格完全不同） @biblokept 哲學系，他好像對很多東西都很有研究，完全就是不務正業的感覺 @bolimask 他好像很缺工作，拜託誰快點 hire 他 @jsincity 羊駝哥，從其他人的 Favorites 可以看出來，大家都很愛他 @milnjitefunnee 她是低級笑話界的蔣勳，蔣勳很愛談美，她則酷愛談下體 @msvanny 雖然是老朋友了，總是看到 一堆驚嘆號 還是會覺得她很煩 @phiphicake 酷斃了這個人，雖然不常在 Twitter 上看到 ── blog: 哲學哲學雞蛋糕. @qwerr 她之前那段「好氣喔」系列，我覺得超正點的 @retsnimle 我很欣賞他啊 哈哈哈 以下是 Twitter 常用詞： @ ── 如果你有話想對某個特定的帳號說，就 @ 他，例如： Satan 說：@God 我討厭你！ DM ── 就是 Direct Messages，只有接收和發送訊息的雙方才看得到的訊息 RT ── 就是 Retweet，把別人說過的話再推一次，例如： Tom 說：我真是一個笨蛋 John 跟著說：RT: @Tom 我真是一個笨蛋 // 沒錯，你的確是一個笨蛋 推友 ── 就是在推特上認識的朋友 2009.11.25 update! Twitter 最近新增了一個 List 的功能，簡單說就像是建立一個名為「音樂」的資料夾，然後把所有的 mp3 檔案通通丟進去，差別在於丟進去的是推友。 這些是我的 List： @vinta/i-like-them @vinta/they-are-useful 2010.4.17 update! 有一個叫 Favstar 的網站，用 Twitter 帳號登入之後，你可以在上面看到有哪些人把你的哪些推打星。我覺得「打星」可能是 Twitter 最棒的功能了。比起自己的推，其實 Favorites 裡面的東西更應該備份。 Tagged: Twitter網站'
author = ""
