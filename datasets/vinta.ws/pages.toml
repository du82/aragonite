full_description = "你都去哪裡看技術文章？ Posted on 2015-09-012019-10-22Author VintaPosted in Misc 因為前陣子跟朋友們一起弄了一個技術週刊：CodeTengu Weekly 碼天狗週刊，每個禮拜在考慮要放哪些內容的時候，突然覺得：「你都去哪裡看技術文章？」或許也會是個有價值而且實用的主題，所以乾脆就來跟大家分享一下，我覺得不錯的每日資訊來源。 你可以訂閱的週報 五花八門 CodeTengu Weekly - 內容包含 Web 前端後端、Mobile app 開發、DevOps、機器學習 Hacker Newsletter - Hacker News 的每週精華版 码农周刊 - 开发者头条的每週精華版 湾区日报 - 講技術的部分其實不多，大部份說的是創業、管理、UX 之類的主題 程式語言 Pycoders Weekly Python Weekly ImportPython Newsletter Golang Weekly Node Weekly WDRL – Web Development Reading List 資料庫 DB Weekly NoSQL Weekly Redis Weekly DevOps Cron Weekly DevOps Weekly Docker Weekly Docker 周报 Microservice Weekly Web Operations Weekly Machine Learning Artificial Intelligence Weekly Data Science Weekly 你可以瀏覽的網站 如果要推薦值得一看的網站或網誌，說八年都說不完，而且現在大家也都不用 RSS reader 了（真的很可惜，明明就很方便），這裡就只提幾個「內容聚合網站」（news aggregator）。你可以在這些網站上 follow 特定的主題，例如 Python、Golang、Apache Cassandra、Docker 之類的，他們就會自動把相關的文章推送給你，比較特別的是，網站還會根據你的個人喜好和你在 Twitter 上關注的對象來調整推送給你的內容。 Mybridge Right Relevance 我最早用過這一類的服務是 Zite，但是直到它老是推薦「印度一條六公尺的巨蟒（Python）吞食了一個人類小孩」的新聞給我之後，我就把它刪掉了。雖然說 Zite 已經被收購，整合進 Flipboard 裡，但是我已經對它沒信心啦。 2015.09.06 更新： Kaif 稀土掘金 你可以關注的人 以下列出的是許多喜歡在 Twitter 上分享技術文章而且推文頻率又比較高的開發者： 出沒於 Twitter @vinta - 像這樣幽默又率性的 developer 在這個世道也是不多的，大家可以關注一下 @codetengu - 碼天狗的推特帳號 @c9s @caterpillar @dlackty @Evan_Lin @ferrari_tw @fukuball @gslin @honglong0420 @hiroshiyui @hsatac @ihower @ingramchen @jaceju @jserv @kakashiliu @keitheis @lovecankill @othree @pahudnet @ruanyf @saiday @siuying @timdream @tzangms @uranusjr @WanCW @william_yeh @yorkxin @zmx 出沒於 Facebook 陳上進 - 是的，就是這篇文章的作者本人 CodeTengu 碼天狗 - 碼天狗的 Facebook Page Ant Yi-Feng Tzeng Chia-liang Kao Ian Tsai Mosky Liu Will Huang"
