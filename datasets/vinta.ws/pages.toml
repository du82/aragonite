title = "Web 2.0 網路界的鬥戰聖佛：左邊網 – 真．他媽的"
description = """
沒錯，這就叫做「標題殺人法」。
 
 
左邊網
 
i-left.com
 
 
基本上這個網站跟 Web 2.0 完全沒有關係，我只是覺得用了這個名詞感覺會比較厲害。Web 2.0 網站應該有的要素，左邊網完全都沒有，什麼 UGC、Embed、Widget、RSS、Tags、Mashup 之類的鬼，（據說）因為技術問題，通通做不出來。
 
「左邊網」是我的四個大學同學的作品，當然，每個班級裡面總會有幾個出類拔萃、天賦異稟、才華出眾的學生，只不過，比較特別的是，他們是從不同的國家來台灣讀書的外國學生，分別來自非洲的利比亞、印尼的蘇門答臘、南美洲的委內瑞拉與泰國的曼谷。關於他"""
full_description = "Web 2.0 網路界的鬥戰聖佛：左邊網 Posted on 2009/02/142010/08/13Author VintaPosted in 假裝沒有惡意 沒錯，這就叫做「標題殺人法」。 左邊網 i-left.com 基本上這個網站跟 Web 2.0 完全沒有關係，我只是覺得用了這個名詞感覺會比較厲害。Web 2.0 網站應該有的要素，左邊網完全都沒有，什麼 UGC、Embed、Widget、RSS、Tags、Mashup 之類的鬼，（據說）因為技術問題，通通做不出來。 「左邊網」是我的四個大學同學的作品，當然，每個班級裡面總會有幾個出類拔萃、天賦異稟、才華出眾的學生，只不過，比較特別的是，他們是從不同的國家來台灣讀書的外國學生，分別來自非洲的利比亞、印尼的蘇門答臘、南美洲的委內瑞拉與泰國的曼谷。關於他們的資料，在「關於本站」中有詳細的介紹，也有解釋他們為什麼要製作這個網站以及「左邊網」名字的由來（那首歌其實還蠻好聽的，想聽的人可以去 YouTube 找）。另外，因為我跟他們都很熟，所以在網站製作的過程中，我也幫了一點小忙，比如說：在離開他們寢室的時候，順手把門關上，不讓小偷有機會溜進去；把自己不喜歡吃的青椒讓給他們吃，讓他們在台灣也能夠感受到像是在家裡的溫暖，諸如此類的。既然我都幫了他們這麼多忙了，好人做到底，順便就幫他們宣傳一下「左邊網」。 P.S. 可能是因為來台灣之前，他們都在北京學過兩年的中文，所以他們的中文都好到爆炸，除了泰國人 Jeff 之外（他連中文打字都不太行）。而且，他因為暑假要去韓國自助旅行，開始學韓文，最近則是一直在班上揪團，說要找人一起去韓國做「陰莖增大術」...... 真搞不懂泰國人在想什麼。 不過，扯了一堆，「左邊網」究竟是一個什麼樣的網站？ 我必須說：「左邊網是一個工具型網站。」 請不要懷疑，它真的是。 你對你的人生感到迷惘嗎？ 你對你的未來感到茫然嗎？ 你正在生命的十字路口徘徊，不知道該何去何從嗎？ i-Left.com 左邊網 將為您指出人生的方向 ── 左邊！ 「左邊網」立志成為您在人生的徬徨時刻會第一個想到的「工具型網站」。 已開發產品 我的朋友都是智障 聽說他們兩個有心結 把這些技能點滿人生就妥當了 原來我在你們心中是這種人 好無聊喔可是又不想做正事 願望沒實現是因為正念不夠 別老是裝出一副快要死掉的樣子 好想主持兒童節目喔 我在人生的道路上迷失了 人生自古誰無死？ 問世間情為何物？ 這些產品能夠在你面臨到人生中不同的困境與苦惱的時候，例如：人際關係、愛情、工作、死亡，幫助你做出最好的決定（最適合你自己的決定），並且讓你更了解你自己。有這樣一個不可多得的網站，實在是全世界華文網友的福氣呀～ 網站特色 會員系統 ── 請耐心填寫，加入會員之後，有意想不到的驚喜！ 留言板 ── 奧妙之處只有留言過的人才能體會，這一點從眾人的留言中即可看出 搜尋 ── 我相信你用不到這個功能 字很大 ── 左邊網不屑使用那種小不拉機的字型，而是頂天立地的 1.5em！ 字的顏色只有三種 ── 橘色、白色、灰色，這是極簡主義的一大勝利！ 沒有圖片 ── 如果你在網站上看到任何一張圖片，那表示我在說謊 在許多完全不重要的小細節裡搞很多花樣 ── 因為「惡魔在細節裡」 最重要的是「非常實用」── 這是「左邊網」跟那種沒有營養的惡搞網站的最大差異 Tagged: 左邊網無厘頭網站"
