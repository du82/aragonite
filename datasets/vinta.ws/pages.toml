full_description = "關於科幻 Posted on 2011/02/122018/03/26Author VintaPosted in 嚴肅的事情 如果你跟我一樣也是個科幻迷，以下的這些作品你真的不應該錯過。這份清單是從我讀過、看過、玩過的科幻作品裡挑出來的，當然，完全是個人喜好。主要以有中文版的作品為主。 小說 機器人系列 by Isaac Asimov The Caves of Steel 鋼穴 The Naked Sun 裸陽 The Robots of Dawn 曙光中的機器人 Robots and Empire 機器人與帝國 基地三部曲 by Isaac Asimov Foundation 基地 Foundation and Empire 基地與帝國 Second Foundation 第二基地 基地前傳 by Isaac Asimov Prelude to Foundation 基地前奏 Forward the Foundation 基地締造者 基地後傳 by Isaac Asimov Foundation's Edge 基地邊緣 Foundation and Earth 基地與地球 太空漫遊系列 by Arthur Charles Clarke 2001: A Space Odyssey 2001 太空漫遊 2010: Odyssey Two 2010 太空漫遊 2061: Odyssey Three 2061 太空漫遊 3001: The Final Odyssey 3001 太空漫遊 沙丘系列 by Frank Herbert Dune 沙丘魔堡．上 / 沙丘魔堡．下 Dune Messiah 沙丘救世主 Children of Dune 沙丘之子 安德系列 by Orson Scott Card Ender's Game 戰爭遊戲 Speaker for the Dead 死者代言人 Xenocide 外星屠异 銀河便車指南系列 by Douglas Adams The Hitchhiker's Guide to the Galaxy 銀河便車指南 The Restaurant at the End of the Universe 宇宙盡頭的餐廳 Life, the Universe and Everything 生命、宇宙及萬事萬物 So Long, and Thanks for All the Fish 掰掰，謝謝你們的魚啦 Mostly Harmless 大部無害 家畜人鴉俘系列 by 沼正三 家畜人鴉俘 I 家畜人鴉俘 II 家畜人鴉俘 III 海柏利昂詩篇 by Dan Simmons Hyperion 海柏利昂 The Fall of Hyperion 海柏利昂 2 Endymion 安迪密恩 The Rise of Endymion 安迪密恩的觉醒 時間三部曲 by Robert Charles Wilson Spin 時間迴旋 Axis 時間軸 Vortex 時間漩渦 蔓生都會三部曲 by William Gibson Neuromancer 神經喚術士 Count Zero 零伯爵 紅色覺醒系列 by Pierce Brown Red Rising 紅色覺醒 Golden Son 金色同盟 Morning Star 銀色新生 文明系列 by Iain M. Banks The Player of Games 游戏玩家 Use of Weapons 武器浮生录 末日系列 by Charles Stross Singularity Sky 奇点天空 Iron Sunrise 末日奇点 滅亡三部曲 by 張草 北京滅亡 諸神滅亡 明日滅亡 三體系列 by 劉慈欣 三體 三體 II：黑暗森林 三體 III：死神永生 其他 1984 一九八四 by George Orwell Flatland 平面國 by Edwin Abbott Abbott The Gods Themselves 神们自己 by Isaac Asimov 銀河英雄傳說 by 田中芳樹 延伸連結：Vinta Chen’s read books on Goodreads 漫畫 14 歲 by 楳圖一雄 BLAME! by 貳瓶勉 NO GUNS LIFE by カラスマタスク NOiSE by 貳瓶勉 一拳超人 by 村田雄介 來自深淵 by つくしあきひと 充神榜 by 陳某 反烏托邦公職 by 千賀史貴、テルミソ 寄生獸 by 岩明均 寶石之國 by 市川春子 封神演義 by 藤崎龍 岸和田博士．科學的愛情 by 湯尼嶽崎 東京喰種 by 石田翠 深邃美麗的亞細亞 by 鄭問 火星異種 by 貴家悠、橘賢一 