title = "佔領行政院：一位失敗主義者的告白 – 真．他媽的"
description = """
佔領行政院
03/24 殘暴政府行為的真相
 

希望大家用力把這影片分享出去，因為現在打開電視新聞都被剪掉了，只剩下一些和平的警察搬學生畫面，不然就是會進廣告，媒體無所不用其極製作畫面抹黑學生，我們也該把這些真相盡可能分享出去。

 
真正該討論的，是三個關鍵的話題：左右路線、統獨議題、世代階級
 

真正該討論的，是三個關鍵的話題，也是各方人馬參戰的真正理由。但都不是黑島青可以在這個場合公然講出來的，因為一講出來，瞬間就會陷入這三個可以糾結數十年、甚至數百年的意識形態泥淖，分別是...

 
服貿爭議的背後
 

我們再來看一點結構性的問題。國中公民課有專心"""
full_description = "佔領行政院：一位失敗主義者的告白 Posted on 2014/03/242014/04/07Author VintaPosted in 你可能會想知道 佔領行政院 03/24 殘暴政府行為的真相 希望大家用力把這影片分享出去，因為現在打開電視新聞都被剪掉了，只剩下一些和平的警察搬學生畫面，不然就是會進廣告，媒體無所不用其極製作畫面抹黑學生，我們也該把這些真相盡可能分享出去。 真正該討論的，是三個關鍵的話題：左右路線、統獨議題、世代階級 真正該討論的，是三個關鍵的話題，也是各方人馬參戰的真正理由。但都不是黑島青可以在這個場合公然講出來的，因為一講出來，瞬間就會陷入這三個可以糾結數十年、甚至數百年的意識形態泥淖，分別是... 服貿爭議的背後 我們再來看一點結構性的問題。國中公民課有專心上的，都知道我國憲法賦予人民創制及複決權，但課本沒說的是，由於立法院不肯通過實質的法案內容，這兩個權力只是有名無實的裝飾品。立法院擁有至高無上的立法權，立院諸公無論朝野，是誰也不可能將到手的鴨子分送出去，這項結果的嚴重性，就是導致了今天人民要上街頭最大的原因。如果有創制權，林飛帆根本不需要發動衝突，搶發言權，只是冀望朝野立委誰都好，能夠提案、立法；如果有複決權，陳為廷也根本不必冒著自身安危，衝撞體制，只是想表達，我們不同意。 你用警察的暴力催生出了一個浴血奮戰的世代 昨夜的暴力要攻擊的並不只是那些受毒打的人，更重要的是，這場暴力要威嚇那些不在場的觀眾。隨著人們血流滿面的照片四處傳播，恐懼將起。家長們把孩子留在家裡，老師們將呼籲學生們不要出面。為什麼國民黨能以一個少數者的外來政權統治台灣半世紀？並不是反抗的人太少，而是反抗之後，人人自危、人人坐視不管。 我反服貿，鎮暴警察說要我的命 突然，有人叫住我，是所上的同學，他一邊哭一邊發抖，問我：「為什麼會變這樣？」我一直很冷靜，冷靜走到醫護站看傷勢，冷靜走到停車處，冷靜騎車回家，但一走進家門，我就在也無法冷靜了，我想我這一輩子，都無法原諒台灣警察了，我想著前幾天的抗爭活動，我們對警察說辛苦了，幫他們加油拍手，我就好氣好氣，我好不甘心！！！ 為什麼不能衝行政院？ 今日去，就知道會被驅離，但是我想，他們應該不知道會被打得這麼慘。並非基於無知，而是因為他們對這國家的執政者還存有這麼一點信賴：傅斯年說：「你今晚可以驅離學生，但你不能讓他們流血，如果你讓學生流血，我跟你拼命。」所以他們去了，想著一百種可能被驅離的手段。但他們沒料到，是一百零一種：警察根本無差別、一陣暴打。 公民不服從 所謂的「公民不服從」(civil disobedience)，是指社會上的少數人，基於自己的良心以及所學，卻在合法程序下窮盡手段卻依然不能影響政府決策，只好使用違法的方式使社會關注他們的訴求與議題。這個「公民不服從」的概念，是當代自由主義學者幾乎都認可的概念，因為就算是民主自由的制度，也有可能被制度中的當權者破壞，因此我們必須設立一個可以隨時抑止他們的機制。我在此只是想說明，我不否認衝進行政院裡面是違法的，但是不能夠因為違法的行為就否定他們的所有想法與訴求。當然這樣的違法不能是殺人放火，可是如果只是試圖穿越警察、違反社會秩序、手上的剪刀則是為了剪斷拒馬而非攻擊人，其實都不是過當的違法手段。對我而言，這是大人們最應該修正觀念的一件事：並不是只要違法就失去了所有行為的正當性。 也許前往行政院的人一定知道，也是早準備好要迎接這樣的結果，就是被鎮暴驅離。我不是說他們故意要做些被貼標籤的事。而是他們要這樣。也許可以保立法院那邊的抗爭。也許可以讓大家看到鎮暴就是這回事。這樣，大家才真正明白抗爭的本質就是這樣「不文明」，因為這就是所對抗的人，真正的面目。 — Steve Taipei Taiwan (@lovelysteve) March 23, 2014 這個社會用學生的標準來看待政府－－他們壓力很大，做決策沒辦法顧到所有人很正常，也很容易做錯事情 用政府的標準來看待學生－－他們應該理性面對這一切，把事情全盤了解後才有資格發表言論，並且要能做出對所有人最好的決定。 — RA (@BlueNessrA) March 24, 2014 週末原本回台中幫我媽過生日，但是禮拜日晚上一看到佔領行政院的消息後完全沒忍住就搭了高鐵衝上台北，馬上跟同事蔡旻昇一起趕到林森北路與北平東路，就是後來警察第一波鎮壓的地方。原本還半開玩笑的說要不要戴著安全帽去，不然被警棍尻到頭可不是好玩的。一到現場沒多久警察就趁著在場沒有媒體、民眾也越來越少的時候，直接放鎮暴警察出來了。當我親眼看到一個鎮暴警察硬生生的用警棍往一個民眾頭上打的時候，我他媽真的傻了。在場沒有人預料到，警察會這樣發了狂似的毆打一群完全沒有武裝的平民。在一陣推擠之下，被手持盾牌的警察逼退到了人行道上，我又看到兩三個鎮暴警察圍住一個卷縮在地上的民眾，猛踹，像是在踹一條路邊的野狗。 當警察放棄思考，催眠自己「我只是在執行上頭的命令」的時候，他們從來都不是人民的朋友，他們只會把你當成路邊的一條野狗。 眼見北平東路已經被警察佔領，就跟同伴趕往行政院正門，到達之後才發現那裡竟然還是一片園遊會般的詭異光景，後門已經打到頭破血流了，行政院前的廣場卻還在教導大家「等一下警察進行驅離的時候，大家不要抵抗，就地躺下，讓警察把你抬走」，操你媽的後門那些民眾可是連躺下的機會都沒躺就被鎮暴警察打破頭了啊！ 後來跟同伴分頭擠進行政院大樓跟貴賓室之間的通道時，又他媽遇上鎮暴警察。警察跟我們僵持了好一陣子之後，蘇貞昌、謝長廷和幾個立委終於姍姍來遲，當著所有人的面講了一堆屁話之後，因為隊伍後方有警察跟民眾產生衝突，警察拖走了好幾個躺在地上的民眾，立委們被請去調解，而趁著一陣混亂，民眾的隊伍就被兩旁的警察阻斷，我跟同伴好死不死就站在手持盾牌、警棍的警察和我們身後那些躺在地上想要阻止警察前進的民眾之間，又一陣衝突，我跟同伴都被盾牌撞倒在地上，我情急之下抓著盾牌避免也被警棍尻頭，結果還是他媽的命賤被鎮暴警察狂踹了好幾腳，所幸在場的大部分民眾和部分警察還保持著理性，制止了衝突擴大。接著我們繼續跟警察僵持了一陣，突然右前方有個鎮暴警察跟我旁邊的紅衣男起了口角，我擋在他們之間勸架，結果就被那個鎮暴警察扯著領子拉出隊伍了，原本以為會被警棍幹爆，結果似乎是因為這邊通道上到處都是拿著攝影機的媒體，被旁邊的警察亂嗆了幾句之後就被推出行政院了。沒多久怒氣衝衝的同伴也被抓了出來，他比較慘，腰被警棍捅了好幾下，胸口也被警察揍了好幾拳。後來我們兩名傷兵一邊休息養傷，一邊覺得台灣或許有救了，畢竟這個晚上在行政院內外的所有民眾已經向全台灣人送出一個訊息：「當政府背叛人民的時候，我們能夠做的真的不只是靜坐和在立法院內做垃圾分類。」 結果，沒過多久就從 Twitter 上看到警察開始動用鎮暴水柱和催淚瓦斯對付手無寸鐵的人民，接著又在網路上看到那麼多還在電腦前冷嘲熱諷的人，我好不容易對這個國家的未來產生了一絲絲的信心，又他媽被打回原形成為一個絕望的失敗主義者了。 原文 Follow me on Facebook Follow me on Twitter Follow me on GitHub Tagged: 佔領立法院佔領行政院台灣學運政治民主"
