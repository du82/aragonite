full_description = "佔領行政院：一位失敗主義者的告白 Posted on 2014/03/242014/04/07Author VintaPosted in 你可能會想知道 佔領行政院 03/24 殘暴政府行為的真相 希望大家用力把這影片分享出去，因為現在打開電視新聞都被剪掉了，只剩下一些和平的警察搬學生畫面，不然就是會進廣告，媒體無所不用其極製作畫面抹黑學生，我們也該把這些真相盡可能分享出去。 真正該討論的，是三個關鍵的話題：左右路線、統獨議題、世代階級 真正該討論的，是三個關鍵的話題，也是各方人馬參戰的真正理由。但都不是黑島青可以在這個場合公然講出來的，因為一講出來，瞬間就會陷入這三個可以糾結數十年、甚至數百年的意識形態泥淖，分別是... 服貿爭議的背後 我們再來看一點結構性的問題。國中公民課有專心上的，都知道我國憲法賦予人民創制及複決權，但課本沒說的是，由於立法院不肯通過實質的法案內容，這兩個權力只是有名無實的裝飾品。立法院擁有至高無上的立法權，立院諸公無論朝野，是誰也不可能將到手的鴨子分送出去，這項結果的嚴重性，就是導致了今天人民要上街頭最大的原因。如果有創制權，林飛帆根本不需要發動衝突，搶發言權，只是冀望朝野立委誰都好，能夠提案、立法；如果有複決權，陳為廷也根本不必冒著自身安危，衝撞體制，只是想表達，我們不同意。 你用警察的暴力催生出了一個浴血奮戰的世代 昨夜的暴力要攻擊的並不只是那些受毒打的人，更重要的是，這場暴力要威嚇那些不在場的觀眾。隨著人們血流滿面的照片四處傳播，恐懼將起。家長們把孩子留在家裡，老師們將呼籲學生們不要出面。為什麼國民黨能以一個少數者的外來政權統治台灣半世紀？並不是反抗的人太少，而是反抗之後，人人自危、人人坐視不管。 Read More"
