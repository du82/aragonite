title = "誰說現在的年輕人沒有競爭力？ – 真．他媽的"
description = """
前幾天逛書店的時候，發現商業類的書櫃上有一整排的「即戰力」「變革力」「說話力」「交涉力」「行動力」「解決力」「好感力」「拒絕力」，我在養生類的書架上又看到了「生薑力」和「排便力」，宣傳照總是穿著細跟高跟鞋（♥）的知名部落客，最近也出了一本「女王力」，這年頭不冠上一個什麼力好像就沒辦法在社會上走跳了。
 
