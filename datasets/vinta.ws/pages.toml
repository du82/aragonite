title = "ACT – 真．他媽的"
description = "When in doubt, pa chou ching."
full_description = "電玩生涯：PS2 - 動作遊戲 Part 1 Posted on 2009/02/232009/02/23Author VintaPosted in 關於 ACG 那些很宅的東西 到目前為止，我唯一擁有的電玩主機，就是 PS2 了。如果不把國小的時候，一堆小鬼一到下課就拿著自己養的電子怪獸在那邊搖啊搖的（以為這樣會比較容易贏），到處跟別人對戰的「怪獸對打機」算在內的話。我甚至沒有經歷過紅白機、DC 和 PS 的時代，而是直接跳到電腦。 從我國中基測前夕入手 PS2 之後（各位父母千萬不要答應你的小孩在基測前的三個月之內買任何電玩主機啊......），一直到現在，PS2 的遊戲我都只玩動作遊戲，因為也只有動作遊戲是看不懂劇情也可以玩得很爽～ 【真．三國無雙】系列 真．三國無雙 3 是我的第二款 PS2 遊戲（第一款是 A Z.O.E.），也是我玩過的第一款「一夫當關，萬夫莫敵」的無雙類型動作遊戲，我在電腦上幾乎都只玩 RPG 而已，所以第一次玩這種拿著長兵器砍啊砍、武將一直擋啊擋、小兵一直來啊來的遊戲，超．爽．ㄉㄜ～ Read More 電玩生涯：PC Games‧ACT Posted on 2007/05/032013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 PC 平台的動作遊戲我玩的不多（PC 上的動作遊戲好像也蠻少的），尤其是那種我最愛的「戰場動作遊戲」（無雙系列的那種），在 PC 上是寥寥可數...... 也可能是我孤陋寡聞，如果有人知道 PC 平台上有什麼「戰場動作遊戲」的話，推薦幾套吧～ ===== ACT：動作遊戲 ===== 雖然這套遊戲的「動作性」其實不高，但是，說到動作遊戲還是不能不提「俠盜獵車手（Grand Theft Auto）」～ 不過，我也只玩過「俠盜獵車手：罪惡之城（GTA: VC）」和「俠盜獵車手：聖安地列斯（GTA: SA）」而已。 【俠盜獵車手：聖安地列斯（Grand Theft Auto: San Andreas）】 雖然這款遊戲很好玩，但是，其實我到現在都還沒破關...... 我不是指「完成度 100 ％」的那種（我覺得只有瘋子才會想去達成這個目標），我是指「解完所有的劇情任務」的那種破關。我之所以解不完所有的任務，是因為這個遊戲最讓我受不了的：它有太多的 競速型任務 了。我除了是格鬥遊戲界的智障之外，不巧，也剛好是賽車遊戲界的傻屌...... 我超級痛恨跟電腦賽車，每次過彎的時候，明明速度都一樣快，為什麼只有我會掉進水裡啊！？賽車已經很要命了，偏偏這款遊戲還有「開飛機」和「開船」的任務...... 我就是卡在「Freefall」這個劫機的任務，我都玩到快崩潰了，就是追不到那架飛機啊～ 在這個遊戲裡可以幹的事情非常多：「拿衝鋒槍掃射路人」「用狙擊槍到處爆頭」「一個人跟軍隊和坦克車火拼」「所以看得到的交通工具都可以偷來開」「開 F16 飛到高空，再自由落體摔下來」「上健身房（玩家要用鍵盤替主角健身......）練出肌肉」「飆車，然後搞到 FBI 都在後面追你」「用電鋸凌虐路人」「開車對路邊的妓女按喇叭，然後把車開到暗處，開始車震......」「騎腳踏車撞警察」「可以雙手拿槍」「潛到海裡收集貝殼」「改裝車子（可以有 氮氣加速）」「拿火箭筒把直升機轟下來」「拿巨大的陰莖攻擊路人」等等。而且，這是一個沒有「Game Over」的動作遊戲，在遊戲中掛掉的話，也只會被送去醫院，然後沒收身上的武器而已。 這個影片幾乎把 GTA: SA 的精華都秀出來了～ I'm An Asshole. Read More"
