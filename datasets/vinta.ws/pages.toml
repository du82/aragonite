title = "電玩生涯：Online Games – 真．他媽的"
description = """
接續之前的「電玩生涯」系列，RPG、ACT、SRPG、SIM，最後是 Online Games。然後，PC Games 講完，就要開始說說我的 PS2 了～
 
>-------------------------------------------------------------<
 
在我目前為止的人生中，我認真玩過的網路遊戲只有三款，而只有其中一款我會一直一直玩下去。 我不常玩網路遊戲，就是因為它都「玩不完」。單機的遊戲不管劇情再怎麼浩大，終究也是有破關的一天。我每次開始玩一款遊戲，就一定會「上癮」（哪個玩家不是這樣啊？），會發狂似地一直玩下去，完全不想理其他的事"""
full_description = '電玩生涯：Online Games Posted on 2008/05/222013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 接續之前的「電玩生涯」系列，RPG、ACT、SRPG、SIM，最後是 Online Games。然後，PC Games 講完，就要開始說說我的 PS2 了～ >-------------------------------------------------------------< 在我目前為止的人生中，我認真玩過的網路遊戲只有三款，而只有其中一款我會一直一直玩下去。 我不常玩網路遊戲，就是因為它都「玩不完」。單機的遊戲不管劇情再怎麼浩大，終究也是有破關的一天。我每次開始玩一款遊戲，就一定會「上癮」（哪個玩家不是這樣啊？），會發狂似地一直玩下去，完全不想理其他的事，直到破關的那一刻。但是，因為線上遊戲根本就不可能讓我「破關」，我一玩上癮就會停不下來，我的時間就都被綁在電玩上了。 如果一直有個遊戲的捷徑擺在桌面上，而我又還沒把它玩完，那種感覺很難受。 我會一直想去點它...... ====== OLG：線上遊戲 ====== 【夢幻之星 網路版】（Phantasy Star Online, 簡稱：PSO）Ver. 2 這是一款可以單機也可以線上遊玩的「角色扮演動作遊戲」，是從 DC（就是 Dreamcast）移植到 PC 上的。台灣的代理商「第三波」好像已經倒閉了，而 PSO 在台灣的伺服器當然也早就停止服務了，所以，現在已經玩不到線上模式了。不過，即使是當年伺服器還在運行的時候，我也很少上線，大部分都還是在玩「單機模式」── 因為，這樣我才可以用「遊戲修改大師」。 人不修改，天誅地滅 千里之行，始於修改 不修則已，一改驚人 一日不修改，面目可憎 少壯不修改，老大徒傷悲 與其臨淵羨魚，不如退而修改 修一時，風平浪靜；改一步，海闊天空 說到遊戲的內容，我必須說：Phantasy Star Online 是一款「劇情薄弱」「動作單調」「敵人重複」「關卡千篇一律」的「角色扮演動作遊戲」。我甚至覺得，說這款遊戲「沒有劇情」也是不無道理的。一般 RPG 的主角總是需要在大地圖上到處走、跟 NPC 對話、打怪練功，讓玩家一步一步地體驗整個故事。但是，在這款遊戲裡，我們玩家只能經由分散在迷宮各處的「訊息膠囊」來知曉劇情。基本上，所謂的劇情，也只是「紅手鐲．莉可」的調查報告而已。不過，還好遊戲中有不少「任務」可以解，雖然很多任務的內容都很鳥（送情書、找食材），或多或少也有一點雞肋般的劇情補完。 我剛剛有說到 PSO 的另一個缺點，就是「敵人重複」「關卡千篇一律」。因為這款遊戲主要的戰鬥場景其實只有 4 個：森林區、洞窟區、坑道區、遺跡區。雖然每一區都有好幾層，而且每次的地圖都會有變化。但是，不管怎麼玩，殺來殺去都是那幾隻怪，跑來跑去都是那幾個場景。即使破到了 Ultimate 難度，也只是怪物的造型和場景的色調變得更詭異而已，玩久了真的會膩...... 但是，這款遊戲的缺點那麼多，那我幹嘛還玩？因為我犯賤 因為 PSO 最為人稱道的特點是各種五花八門、帥氣又惡搞的武器 ── 光劍（男人的浪漫）、鐮刀、機槍、步槍、散彈槍、火箭炮、武士刀、爪子、拳套、雙刃劍...... 除了一些基本款的武器之外，真正令玩家著迷的，其實是那些「稀有武器」啊～ 想當初我把我的那隻 HUmar（人類男獵人）練到 200 級之後，不幹別的，整天就是在收集那些稀有武器。當然，因為遊戲預設的掉寶率實在是低到見鬼，所以，我就請 Game Master 稍稍微幫了我一點忙～ 因此，攻略本上面的那些稀有武器、防具、道具，甚至是連攻略本都沒提到的，我幾乎都拿來耍過了：聖劍 "拉維斯．卡農"、聖劍 "拉維斯．布雷德"、魔鎌 "誡魂者"、如意棒、聖劍 "雙刃．卡農"（這一把是雙刃劍，就是那種雙頭的光劍，帥爆了～ 而且特殊攻擊是「往前後左右發射衝擊波」）、妖刀 "闇鴉"、幻爪 "波姆之心" 等等；另外一隻 RAcast 就專門負責槍械類的武器：聖槍 "天譴者"（特殊攻擊：以光槍的速度擊發的『聖光術．格蘭茲』）、光釘散射器（用這一把在 Ultimate 難度以下基本上是無敵的 ）、聖光槍、加魯特・米拉、火箭飛拳 等等；至於法師系的武器，因為我不太用 FO 系列的職業，有興趣的人可以在 這裡 看到那些稀有武器～ 我當年玩的「夢幻之星 網路版」是 Ver. 2，而它還有一款續作：Phantasy Star Online Blue Burst（簡稱 PSOBB），不過，PSOBB 只能線上玩（幹！這樣我就不能修改了啊～），但是，看在它好像還新增了不少武器、地圖和怪物，所以，我就去下載來玩了一下，然後，我現在是 Lv 5 的 HUcast。 我承認：我得了一種「玩遊戲不修改會死」的病啊..... 遊戲介紹： PSOBB 非官方網站 梦幻之星在线 梦幻之星：17173.com 网络游戏 【軒轅劍 網路版】 我記得當初「軒轅劍 Online」是跟 RO（仙境傳說）同一個時期推出的，在遊戲上市之前，我還一直掙扎著到底要玩哪一款，不過，秉持著我對國產遊戲的支持，最後我還是選了軒轅劍。因為「軒轅劍」系列一直都是我最愛的國產 RPG，雖然近年來一直都有走下坡的傾向（我對「漢之雲」的評價其實還不錯，只可惜又虎頭蛇尾了......）。 「軒轅劍 Online」我是在國中的時候玩的，那時候應該是「天堂」和「石器時代」的天下。其實我到現在也搞不懂，為什麼我不去玩那些大家都在玩的網路遊戲，而要玩什麼 PSO、軒轅劍網路版，這種在自己的班級、甚至是隔壁班都找不到玩同一款遊戲的人的 Online Game（更不用說還要在同一個伺服器）。 不過，後來我還是不甘寂寞地拉了幾個朋友來玩：我是「天人劍客」，其他人是「天人藥師」「人類武術家」「天人陰陽師」「修羅魔刀客」，雖然我們幾個只有週末的時候才有機會組隊練功：武術家當血牛負責擋怪；藥師就躲在隊伍後頭一邊補血一邊放輔助；陰陽師則站邊邊死命地放攻擊法術；魔刀客就什麼都不用管，傻傻地衝去砍怪；至於劍客，天人族的劍客，他根本是一個處在曖昧不明的定位的職業。肉搏沒有魔刀客強，劍法也沒有陰陽師的法術厲害，而天人又剛好是林黛玉等級的體能，很多重一點的武器、防具都不能拿，除了平常時候可以飄在半空中之外，整個就是一個不知道在幹嘛的職業。 下面這張是碩果僅存的截圖，那個「終極鳥人」就是我創的角色（種族「天人」、職業「劍客」）。因為我受到「主角就一定要拿劍」信仰的洗腦，看到有「劍客」這個聽起來就很帥的職業的時候，完全不管三七二十一，就是硬要選它。而我玩了幾個月之後，「肩上飄著兩把『蓮華劍』還挺帥的」是我對這個職業唯一的心得...... 除了劍客是個很鳥的職業之外，其實我玩這款遊戲玩得還挺 HIGH 的，掛機練功（幹！那時候我用的還是撥接上網啊！）、四處搭訕找人組隊、厚臉皮的跟高手討裝備、傻傻地跑去打「大宇保全」然後被秒殺，而且，我還是完全不靠外掛練到 24 級的啊！對我這個「玩遊戲一定要偷吃步」的人可是一件相當了不起的成就啊（當然，我找不到外掛也是原因之一......）～ 但是，我最後還是毅然決然地把我的角色刪掉了。 因為，我對於「我的天人劍客打殭屍竟然還能打到只剩半條命」這件事實在無法接受。不知道是我技術爛、裝備弱還是等級低，即使是去打等級比我低的怪，被敵人揮個幾下，我竟然就快掛了！？天人的防禦力本來就低了，而且又沒有什麼防具可以穿，單打獨鬥超痛苦的啊～ 我每次看到人類劍客一手拿劍一手拿盾牌，砍怪砍得不亦樂乎的樣子，我心裡就很不平衡啊！另外一點，就是在練功打怪的時候，常常會發生有人「拉火車」的情形。因為在打怪的時候，通常要有人去把聚在一起的怪引幾隻到旁邊，其他人才上去圍毆怪物。但是，就是有些人引怪的技術爛，原本要引一隻，結果卻拉了十幾二十隻怪回來，這就叫「拉火車」。引怪的人為了要把那些怪甩掉，就會到處跑，當然，那些怪通常也會跟著他到處跑。然後，很多無辜的百姓就會被牽連到，原本在旁邊砍猴子砍得很開心，卻突然被不知道從哪裡來的 BOSS 級的怪物秒殺，好不歡樂～ 而且，在這個遊戲裡，死掉是會扣經驗值的。我原本是 24 級，然後一直被火車尾掃到，一直死、一直死、一直死、一直死、一直死，從 24 級死回 23 級，等我又好不容易再練回 24 級之後，又死回 23 級，然後，我就把我的天人劍客刪掉了。 自這款遊戲之後，我也就沒在玩過其他的網路遊戲。當然，以下這一款是例外。 【周公 Online】 你知道全世界最早開發出來、最多人玩，而且，不需要電腦就可以玩的網路遊戲是什麼嗎？天堂（Lineage）？網路創世紀（UO）？無盡的任務（EQ）？魔獸世界（WoW）？還是 Second Life？都不是，而是 ── 周公 Online，上課就登入！ 封測版： 好像就是因為這張出現在「台灣論壇」的圖，因為「上課就登入」這句話實在太靠北了，就被網友拿來惡搞，卻也帶起了一股「兩個字 Online」的風潮，例如： 人生 Online，一受精就登入 國軍 Online，一抽籤就登入 貪污 Online，一當選就登入 正妹 Online，一發卡就登入 新聞 Online，一腦殘就登入 暖化 Online，一呼吸就登入 中國 Online，一黑心就登入 好人 Online，修電腦就登入 遊戲介紹： 周公 Online 更新介紹一覽 - 惡搞萬歲 周公 Online 超詳細介紹 -【盛】情難卻 周公 Online - Uncyclopedia - 