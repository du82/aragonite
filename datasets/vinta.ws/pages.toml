title = "電玩生涯：PC Games‧SIM – 模擬市民 2 – 真．他媽的"
description = """
===== SIM：模擬類型 =====
 
【模擬市民 2】（The Sims 2）
 

 
前作「模擬市民」號稱是史上最暢銷的遊戲之一，而二代也不遑多讓，而且，二代大概是我見過玩法最多樣的遊戲了。模擬市民 2 的玩法，簡單說就是讓你操控一個或多個自創的小人物，然後，幫他過生活。所有日常生活中可以做的事或各種異想天開的詭異動作，在遊戲裡面都有相對應的指令，例如：吃飯、睡覺、聊天、上廁所、洗澡、看電視、聽音樂、打電話、上網、跳舞、讀書、修理電器、下棋、射飛鏢、煮菜、游泳、畫畫、彈鋼琴、玩電動、玩遙控汽車、叫計程車、打架、玩枕頭戰、看星星、擁抱、親吻、嘿咻、生小孩、裸奔、冥想..."""
full_description = '電玩生涯：PC Games‧SIM - 模擬市民 2 Posted on 2008/02/102013/05/09Author VintaPosted in 關於 ACG 那些很宅的東西 ===== SIM：模擬類型 ===== 【模擬市民 2】（The Sims 2） 前作「模擬市民」號稱是史上最暢銷的遊戲之一，而二代也不遑多讓，而且，二代大概是我見過玩法最多樣的遊戲了。模擬市民 2 的玩法，簡單說就是讓你操控一個或多個自創的小人物，然後，幫他過生活。所有日常生活中可以做的事或各種異想天開的詭異動作，在遊戲裡面都有相對應的指令，例如：吃飯、睡覺、聊天、上廁所、洗澡、看電視、聽音樂、打電話、上網、跳舞、讀書、修理電器、下棋、射飛鏢、煮菜、游泳、畫畫、彈鋼琴、玩電動、玩遙控汽車、叫計程車、打架、玩枕頭戰、看星星、擁抱、親吻、嘿咻、生小孩、裸奔、冥想...... 在安裝了各不相同的資料片之後，還可以有：復活死人、加入秘密社團、和自己的大學教授嘿咻、開跑車、唱卡啦 OK、在約會的時候潑別人水、打保齡球、開店、養寵物、創造寵物、做雪人、玩水、捉迷藏、溜冰、旅行、露營、瞬間移動、打太極拳、踢足球、練習芭蕾舞、修汽車...... 除了這些可以主動去執行的技能之外，還有很多的「天災人禍」會隨機發生，就像是：被外星人綁架、家裡遭小偷、發生火災、帳單沒繳而被搬走家裡的東西、修電器的時候被電到、電梯墜落、事業經營不善而破產、小孩離家出走、小孩照顧不好而被社工人員帶走、中暑、凍僵、旅行的途中遇到忍者、海盜...... 而且，遊戲中的模擬市民是會死掉的，他們的死法也是千奇百怪：老死、病死、溺死、餓死、電死、燒死、被蒼蠅髒死、被鬼嚇死、被人造衛星砸死。而模擬市民死後就會變成墓碑、骨灰罈，如果你操控的模擬市民跟死掉的人的關係很惡劣，還會出現「踢墓碑」的指令。除此之外，在晚上的時候，死掉的人還可能會變成鬼魂跑出來嚇人～ 在遊戲中你操控的小人物可以是男人、女人、小孩、青少年、成年、老人、被外星人強暴後生下來的綠色混種人、因為不同死法而有不同顏色的鬼魂、拿著鐮刀飄來飄去的死神。而且，安裝不同的資料片之後，還有新增的人種：復活不完全的殭屍、擁有「咬脖子」這個指令的吸血鬼、沒有壽命限制的機器人、狼人、因為農藥中毒而變種的植物人、大腳怪。 在這款遊戲裡，可以玩的東西真的很多，例如：如果你的模擬市民尿急了，而你硬是不讓他去上廁所，老是叫他去跳舞、下棋，或者是乾脆把家裡的廁所給拆掉，當模擬市民真的憋不住的時候，他就會直接尿在地毯上；個性「邋遢」的模擬市民還可以跑去樹叢中偷尿尿；我在巴哈姆特的精華區看到的：跟死神嘿咻。 而玩模擬市民玩到沒事幹的時候，就會開始想要玩一些很邪惡的玩法，有一次就在家裡開派對，把所有的朋友都找來，還有鄰居、路人也通通把他們找來家裡，把幾個倒楣鬼騙進游泳池裡，其他的人就讓他們留在屋子裡面，然後，進入「建造房屋」的模式，把廁所、浴室、冰箱、床、燈光、窗戶、門、樓梯全都拆掉，接著進入遊戲，然後放著，讓他們自生自滅～ 一堆人擠在一間屋子裡，又沒有廁所、浴室，門被拆掉了，他們也走不出去～ 等你出去吃個飯再回來電腦前看的時候，你只會看到房子裡面的人都死光了，只剩下一個一個的骨灰罈，不是被餓死，就是被髒死，剩下的人也會被之前死掉而變成鬼的人嚇死。如果你回來還看到有人苟活著，新增一個爐子，再指派他去烹飪，煮到一半就停止，這樣一來就很容易發生火災，總之，把苟活下來的那個人也燒死就對了...... 等到所有人都死光，不要存檔，離開遊戲之後，要去拜拜，真是造孽啊～ 除了遊戲中那些正規的玩法之外，一款「上道」的遊戲就是要有各式各樣的「密技」才行：加錢、修除馬賽克、人物不會老、改變人物的身高（輸入的數值太大的話，還會看到畫面只剩一雙腳而已～）、變成禿頭、懷孕時一定生出雙胞胎...... 特殊人種大集合： 不過，如果要真正達到「玩弄」模擬市民的境界的話，單靠遊戲內建的密技是不夠的，這時候，就得靠各種由玩家設計出來的「物件」和「補丁」了。這裡有一篇關於那些下載來的物件和補丁的使用教學：模擬市民 2 下載物件說明總匯。 「物件」就是在遊戲中出現的所有東西：衣服、人物（整個人，或是頭髮、臉、皮膚之類的素材）、寵物、傢俱、建築素材、房子。因為遊戲的設計本來就可以讓玩家自己設計這些物件，想當然爾，一定就會有很多 閒著沒事幹 熱心的玩家製作出很多「自訂物件」放到網路上供人下載（這種人還不少～），幹這事兒的人一多，亂搞的人也會很多，就拿「寵物當家」這個資料片來說，就是會有人做出這種像是從地獄來的 詭異寵物來...... 連「太空戰士 7」的 克勞德 和 賽菲羅斯 也有人做出來～ 不過，這個 賽菲羅斯 感覺很虛...... 而「補丁」則有點類似「修改器」的東西，其中一個好用到爆、功能多到靠北的就是「超能電器」；除此之外還有能夠控制 NPC 的「訪客操縱之鏡」、可以讓模擬市民拿起劍互相決鬥的劍座、會自動補貨的冰箱、顯示小說的寫作進度、按一下就有草裙舞女郎跑出來的衣櫃...... 這些五花八門的物件和補丁是介紹不完的，不過，這些東西我都是從 巴哈姆特電玩資訊站 的「模擬市民大會廳」的 精華區 挖來的（精華區的資訊真的爆多的，又都是中文的，玩這款遊戲的人一定要去那裡觀摩之下才行），不然，就是在 Mod The Sims 2 這個網站找到的，這個網站是我看過資源最豐富的模擬市民的網站了。這裡有「模擬市民達人」收集了一整頁的相關網站～ 不過，我當初玩這個遊戲的時候，最讓我「驚奇」的一點，其實是它有一個「讓玩家在遊戲裡播音樂」的功能，就是可以讓玩家把自己喜歡聽的 .mp3 音樂放到【\我的文件\EA Games\模擬市民 2\Music】這個資料夾，然後，在遊戲中使用「音響」之類的家具時，就可以聽到那些音樂。這個功能看起來好像沒什麼，但是，對於 在一款老外製作的遊戲中聽到劉若英的歌 這件事，其實是一個很詭異又很新鮮的體驗。 遊戲中還有一個「錄影」的功能，就是把遊戲的過程錄製下來，就像用遊戲裡的人物來拍電影一樣。雖然我始終都沒用過這個功能，但是，在網路上廣為流傳的最有名的例子，就是 焱先生 做的那個「模擬市民演唱會」了。 不知道那個 孫中山 用的是不是女人的模組。 因為，他的很多小動作看起來都超娘的啊......... 在遊戲中，同性間的情誼也是可以的～ 不過，我得承認，我最喜歡玩的其實是「蓋房子」的部份～ 玩到後來，每次一開啟遊戲，都會跑去蓋房子，把一間三樓的小別墅蓋得跟雜貨店一樣，裡面什麼鬼東西都有，每次一在網路上找到什麼看起來很屌的傢俱擺設就要塞進那間房子裡，搞得後來每次遊戲載入的時候都超慢的...... 我始終對於能夠蓋出類似「橄欖球場」這種鬼東西的人敬佩不已～ 有些資料片我沒玩過，有興趣的人可以參考下面這兩篇試玩心得： 資料片：度假四季 - 96.02.15 試玩心得 - 伊娃妮與模擬市民 2 的部落格 資料片：玩耍時光 - 97.01.21 試玩心得 - 伊娃妮與模擬市民 2 的部落格 >---------------------------------------------------------< 電玩生涯：PC Games．RPG PC Games．ACT PC Games．SRPG PC Games．SIM Online Games TV Games．PS2 Tagged: PC Games下載電玩電玩生涯'
