["https://vinta.ws/blog/tag/%e8%bb%92%e8%bd%85%e5%8a%8d"]
title = "軒轅劍 – 真．他媽的"
description = "When in doubt, pa chou ching."
full_description = "電玩生涯：Online Games Posted on 2008/05/222013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 接續之前的「電玩生涯」系列，RPG、ACT、SRPG、SIM，最後是 Online Games。然後，PC Games 講完，就要開始說說我的 PS2 了～ >-------------------------------------------------------------< 在我目前為止的人生中，我認真玩過的網路遊戲只有三款，而只有其中一款我會一直一直玩下去。 我不常玩網路遊戲，就是因為它都「玩不完」。單機的遊戲不管劇情再怎麼浩大，終究也是有破關的一天。我每次開始玩一款遊戲，就一定會「上癮」（哪個玩家不是這樣啊？），會發狂似地一直玩下去，完全不想理其他的事，直到破關的那一刻。但是，因為線上遊戲根本就不可能讓我「破關」，我一玩上癮就會停不下來，我的時間就都被綁在電玩上了。 如果一直有個遊戲的捷徑擺在桌面上，而我又還沒把它玩完，那種感覺很難受。 我會一直想去點它...... ====== OLG：線上遊戲 ====== 【夢幻之星 網路版】（Phantasy Star Online, 簡稱：PSO）Ver. 2 這是一款可以單機也可以線上遊玩的「角色扮演動作遊戲」，是從 DC（就是 Dreamcast）移植到 PC 上的。台灣的代理商「第三波」好像已經倒閉了，而 PSO 在台灣的伺服器當然也早就停止服務了，所以，現在已經玩不到線上模式了。不過，即使是當年伺服器還在運行的時候，我也很少上線，大部分都還是在玩「單機模式」── 因為，這樣我才可以用「遊戲修改大師」。 Read More 電玩生涯：PC Games．RPG Posted on 2007/04/272013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 我在寫「讀書與買書的 22 個問題」的時候，寫到一半就很詭異地離題，變成在談電玩...... 所以，乾脆就獨立出一篇來專門談談我從小到大玩過的電玩好了～ 我這輩子玩的第一款電腦遊戲是「超級快打旋風 2」（還是我爸買給我的），是的，是「電腦遊戲」。也大概就是從那時候開始，我注定了這輩子跟格鬥遊戲無緣：我曾經很努力地嘗試過，所以能夠用的角色我都用過了，沒有一隻可以讓我連贏三場以上...... 所以，我從來沒有跟「豪鬼」打過，因為我根本玩不到那麼後面啊～ 而且，每個角色不是都有所謂的「超必殺技」嗎？就拿龍來說，他的超必殺技是「真空波動拳」（就是用出來之後，角色的動作會出現殘影），我敢說，所有角色的超必殺技沒有一個我有按出來過...... 我覺得，我在玩格鬥遊戲的時候跟一個智障沒兩樣。 玩動作遊戲的時候就不會～ ===== RPG：角色扮演 ===== 提到電玩，當然就要從「遊戲類型之王：RPG，角色扮演」開始談了～ RPG 我幾乎都是玩國產的。 雖然很多國外的經典大作也都有中文版的發行，但是，不知道為什麼，我就是比較喜歡玩國產的 RPG 啊～ 不過，現在的國產遊戲真的沒幾套可以玩了，就連「軒轅劍」（四代以後）和「仙劍奇俠傳」（二代以後）出新作的時候，我也都是 含淚 在支持的...... 所幸還有「幻想三國誌」～ 我的第一套 RPG 就是經典到爆的【金庸群俠傳】（單機版的那個）。 [MEDIA=66] Read More"
