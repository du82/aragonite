full_description = "寶島 Online：台灣人的線上遊戲 Posted on 2010/04/012010/11/20Author VintaPosted in 假裝沒有惡意 中華民國 Online 中華台北 Online 福爾摩沙 Online 台澎金馬個別關稅領域 Online 台灣 Online 偏見 Online 【伺服器】 台北伺服器 台北以外都是鄉下伺服器 出了台北就像出國一樣伺服器 我去泰國的次數都比去高雄多伺服器 因為在封測階段收到玩家的反應，以上的伺服器名稱有「台北人本位主義」之嫌，所以遊戲製作小組從善如流，將伺服器名稱做了一番修改。雖然還是有許多台北人玩家要求將「台北伺服器」保留下來，但是遊戲製作小組還是決定不理會他們。 伺服器列表 北部伺服器：滿載 中部伺服器：滿載 南部伺服器：滿載 東部伺服器：沒有人 離島伺服器：尚未建置完成 隨著營運規模的擴大，未來將會增加「北京服務器」「上海服務器」「廣東服務器」「香港服務器」等，服務以「和平」「理性」之名享譽國際的對岸同胞們，畢竟根據「中華民國憲法」，中國大陸的各省都是我們的領土。當大陸同胞在自家村子口的雜貨店看到架子上陳列著一整排的「寶島 Online《言論自由包》」時，說不定包裝上還會印著「台灣不是中國的一個省」。 【系統】 遊戲一開始，玩家在創建角色的時候，會隨機得到不等的「天份點數」（舉例來說：別的玩家可能得到 100 點的天份點數，而你只得到 20 點，這是命），玩家可以依自己的好惡將點數分配到各項數值。 屬性 體能：會影響角色在「日月潭閃擊戰」或「闇夜男根」等體力型任務中的表現 智慧：這項數值關係到如何在正確的時間對夥伴大喊「我們死定了！」 外貌：只要長得好看，就算是智障也能得到愛 社交：如果要選擇「理工系學生」或「工程師」之類的職業，這項屬性不可以太高 創意： 嗯，就是它字面上的意思 道德：部份職業（例如：立法委員、總統） 會限定道德低落的角色才能選擇 運氣：與在「那天晚上我們都喝醉了」等機率型任務中所得到的獎勵息息相關 存在：應該是「存在感」才對，但是為了保持版面的一致性，我只好改成兩個字 性向：在遊戲中，異性戀者被限制無法從事某些職業（例如：服裝設計師） 家世：家世背景的好壞，在遊戲中有著廣泛的影響。不過，玩家無法控制這項屬性 財產：寶島幣，幣值比照新台幣（NTD） 年齡：角色的各項能力數值將會隨著年齡的增長，而有所變化 性格 為了令玩家擁有更真實的遊戲體驗並且創造出具有個人風格的虛擬角色，遊戲製作小組特別研發 Y.F.T.F.（You're Flawed but That's Fine）系統，用來賦予您所創建的人物各式各樣的個性，並且搭配上「自由意志」系統（附註），即使玩家處於離線的狀態，角色仍然會依照所設定的性格繼續在遊戲中活動。 << 附註 >> 自由意志（Free Will）是由印度公司 Antecrist 耗時 24 年才開發出來的跨時代的人工智慧（Artificial Intelligence）系統，有著「Alan Turing 見了也會嚇到尿褲子」的美譽。 以下列出部份 Y.F.T.F. 性格： 卑鄙 下賤 偽善 奸詐 吝嗇 自私 冷漠 惡毒 無恥 貪婪 好色 迂腐 猥瑣 消極 刻薄 膚淺 懦弱 迷信 做作 淫蕩 衝動 懶惰 齷齪 憂鬱 噁心 固執 任性 傲慢 暴力 陰沉 善嫉 孤僻 悲觀 無情 低俗 被虐 多疑 焦慮 妄想 戀物 如果同時擁有兩種以上的缺陷性格，則有可能組合出更高階的「悲劇性格」，例如：同時具備「孤僻」與「陰沉」性格，就有可能得到「社交障礙」；同時擁有「憂鬱」「悲觀」「焦慮」，則有可能獲得「自殺傾向」的悲劇性格。 遊戲中的大多數職業皆必須具備相對應的 Y.F.T.F. 性格才能從事。 人生評語 有鑑於在其他遊戲中，玩家往往需要完成特定的任務或是達成艱難的條件，才會獲得某種自淫式的「成就」或「稱號」。寶島 Online 的遊戲製作小組為了提昇玩家在本遊戲中的遊玩成就感，導入了「人生評語」系統。玩家即使只是做了一個微不足道的動作或是不小心把牛奶翻倒在鍵盤上，都有機會得到人生評語。 遊戲中的人生評語多達 28460 種，因為不想讓網頁右邊的捲軸變得太短，以下僅列舉其中幾項。不過，求知慾旺盛的玩家請不用擔心，關於本遊戲的所有實用的、形而上的、知道之後都過了三天還遲遲不敢相信的資訊，皆收錄在即將發行的攻略本當中。 評語：有錢的男人即使禿頭了還是這麼帥 條件：當財產達到一定的數目 效果：「外貌」和「性吸引力」屬性自動加乘 20% 評語：道德指導員來了！立正！敬禮！ 條件：成為「立法委員」或加入「董氏基金會」和隨便哪個婦女團體 效果：影響立法 評語：智障 條件：「智慧」屬性低於一定數值 效果：獲得進行「任務：他們都笑我，我不要去上學了...... 媽媽」的資格 評語：百人斬！ 條件：在遊戲中殺死 100 個人 效果：獲得進行「任務：另外一種意義的百人斬（淫笑）」的資格 評語：幹我有朋友我超強喔喔喔喔喔喔！！！！！！ 條件：有朋友！！！！！！ 效果：超爆幹帥！！！！！！ 評語：地獄倒楣鬼 條件：「運氣」屬性長時間維持在 -640 以下 效果：被禁止進入遊樂場或開車，因為會引起不必要的傷亡 評語：你嘴巴好臭 條件：完成「女性最常對你說的一句話」任務 效果：自信心 - 25、漱口水數量 + 1 評語：救世主！ 條件：能夠用念力彎曲湯匙 效果：學會特殊技能「子彈時間」 評語：那你就不要玩啊！幹！ 條件：在遊戲中說出「這遊戲爛透了」或「還是魔獸世界比較好玩」等言論 效果：強制登出遊戲 評語：我只是一個 PO 桐郎，呼吸是我唯一的娛樂 條件：隨時隨地，只要向 GM 提出申請即可獲得 效果：當 666 個具有此評語的玩家，在同一個伺服器同時上線，將會引起 「普朗霍夫煞氣場效應」，造成一名 ID 為「寂寞的阿豪最愛打網 球」的玩家被系統刪除帳號 Y.F.T.F. 系統的部份，當玩家收集到一定數量的性格時，也有機會獲得評語： 一想到跟他在同一個伺服器就覺得噁心！ 這種人怎麼不去死一死？ 爛掉啦！我的手碰到他，手要爛掉啦！ 他的內心一定跟外表一樣醜 好宅！好噁心喔！ 為了照顧到刁鑽又犯賤的玩家，本遊戲仍然設計了許多高難度的達成條件： 評語：現代周伯通 條件：開兩台電腦登入，左手、右手同時持滑鼠，操控兩個角色 效果：遊戲中的角色也學會「左右互搏之術」 評語：好久沒看到你咧！[填入角色 ID]，你是去做化療了嗎？ 條件：長達一個月沒有登入遊戲 效果：你可以多讀幾本書 評語：一定要幸福喔～ 條件：在遊戲中找到人生的另一半 效果：開放兩個副本：「外遇」、「紅杏出牆」 人際關係 遊戲中的每個人物（所有玩家的角色和 NPC）之間都會存在至少一種的人際關係，概括性的分成「朋友」「敵人」「親人」「情人」和「陌生人」，每個分類之下還有許多次分類。例如，在「朋友」的範圍內，還細分成： 酒肉朋友 青梅竹馬 紅粉知己 閨中密友 死黨 牌友 室友 教友 暗戀的學長 他還有利用價值 平常不太聯絡但是每次缺錢都會想到他 在網路上幽默風趣，但是現實生活中卻是個無趣的傢伙 為了報殺父之仇才故意接近他，最近卻開始覺得真兇可能另有其人 在我的左腳被友軍的空襲炸斷的時候揹我去找軍醫 蹲苦窯的時候在同一間牢房 莫名其妙參加了 Liar Game 被分在同一組 在神奇寶貝訓練中心認識的擁有黑色神奇寶貝球的男子 性奴隸 如果玩家選擇的是「正妹」之類的職業，還會多出一個人際關係：工具。 評語：你來幫我修電腦好不好？ 條件：在 MSN 收到以上的訊息 效果：自己以為的交往可能性 + 40% 角色的「社交」屬性在人際關係系統中有著舉足輕重的地位，社交值越高，在與他人的關係中越容易取得主導的地位，從人際關係裡獲得的利益也越大。舉個例子，在「校園任務：四眼仔，不想被揍的話，就乖乖幫我寫作業」中，社交值越高的人，作業分數就越高，甚至可能比四眼仔本人的分數還要高。 不過，患有 Social Phobia 的玩家也不用擔心，遊戲中還有一個貼心的設計：社交能力過低的角色，解完「診斷任務：只不過是去看心理醫生而已，我沒有不正常，說不定只是壓力大，對，一定是因為壓力太大」之後，只要結果是「分裂型人格障礙」「迴避型人格障礙」「邊緣型人格障礙」或「多重人格」的任何一種，系統就會開啟「幻想朋友」的功能。玩家可以自由地設定你的幻想朋友的性別、外表、個性等等（可定義項目的多樣性取決於角色的「創意」屬性），甚至可以不是人類，一隻會化骨綿掌的暹羅貓、一台具有反社會人格的吹風機、一個在旋轉的時候看起來特別猥褻的四面體等等。需要注意的是，玩家創造好你的幻想朋友之後，他的一切行為將會由「自由意志」AI 系統來控制，畢竟他是一個「幻想朋友」而不是「幻想傀儡」。 評語：日子過得好好的，為什麼要想不開去談戀愛？ 條件：在「自由戀愛」任務中，徹底失敗 效果：自動獲得「行屍走肉」「力不從心」「孤形隻影」狀態 契約 為了對應「夫妻」「同床異夢」「閃電結婚又閃電離婚」「他不肯認我們的孩子」和「結婚幾十年了，要不是為了孩子，我早就跟你離婚了」等人際關係，遊戲中特別設計了「契約」系統，而且，遊戲製作小組完全尊重多元文化與價值觀，當玩家決定使用「結婚」功能時，同性婚姻和異性婚姻都是可行的。為了因應時代的潮流，除了傳統的一夫一妻制之外，遊戲還內建了「包養」「開放性關係」等契約範本。 寶島 Online 也貼心地照顧到廣大御宅族玩家的需求，三次元的人類你看不上眼嗎？現實生活中根本找不到具有「萌屬性」的女人蘿莉嗎？厭倦了每天中午都在不同的床上醒來的日子嗎？ 遊戲