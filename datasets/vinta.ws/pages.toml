title = "電玩生涯：PC Games‧ACT – 真．他媽的"
description = """
PC 平台的動作遊戲我玩的不多（PC 上的動作遊戲好像也蠻少的），尤其是那種我最愛的「戰場動作遊戲」（無雙系列的那種），在 PC 上是寥寥可數...... 也可能是我孤陋寡聞，如果有人知道 PC 平台上有什麼「戰場動作遊戲」的話，推薦幾套吧～
 
===== ACT：動作遊戲 =====
 
雖然這套遊戲的「動作性」其實不高，但是，說到動作遊戲還是不能不提「俠盜獵車手（Grand Theft Auto）」～ 不過，我也只玩過「俠盜獵車手：罪惡之城（GTA: VC）」和「俠盜獵車手：聖安地列斯（GTA: SA）」而已。
 
【俠盜獵車手：聖安地列斯（Grand Theft Auto:"""
full_description = "電玩生涯：PC Games‧ACT Posted on 2007/05/032013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 PC 平台的動作遊戲我玩的不多（PC 上的動作遊戲好像也蠻少的），尤其是那種我最愛的「戰場動作遊戲」（無雙系列的那種），在 PC 上是寥寥可數...... 也可能是我孤陋寡聞，如果有人知道 PC 平台上有什麼「戰場動作遊戲」的話，推薦幾套吧～ ===== ACT：動作遊戲 ===== 雖然這套遊戲的「動作性」其實不高，但是，說到動作遊戲還是不能不提「俠盜獵車手（Grand Theft Auto）」～ 不過，我也只玩過「俠盜獵車手：罪惡之城（GTA: VC）」和「俠盜獵車手：聖安地列斯（GTA: SA）」而已。 【俠盜獵車手：聖安地列斯（Grand Theft Auto: San Andreas）】 雖然這款遊戲很好玩，但是，其實我到現在都還沒破關...... 我不是指「完成度 100 ％」的那種（我覺得只有瘋子才會想去達成這個目標），我是指「解完所有的劇情任務」的那種破關。我之所以解不完所有的任務，是因為這個遊戲最讓我受不了的：它有太多的 競速型任務 了。我除了是格鬥遊戲界的智障之外，不巧，也剛好是賽車遊戲界的傻屌...... 我超級痛恨跟電腦賽車，每次過彎的時候，明明速度都一樣快，為什麼只有我會掉進水裡啊！？賽車已經很要命了，偏偏這款遊戲還有「開飛機」和「開船」的任務...... 我就是卡在「Freefall」這個劫機的任務，我都玩到快崩潰了，就是追不到那架飛機啊～ 在這個遊戲裡可以幹的事情非常多：「拿衝鋒槍掃射路人」「用狙擊槍到處爆頭」「一個人跟軍隊和坦克車火拼」「所以看得到的交通工具都可以偷來開」「開 F16 飛到高空，再自由落體摔下來」「上健身房（玩家要用鍵盤替主角健身......）練出肌肉」「飆車，然後搞到 FBI 都在後面追你」「用電鋸凌虐路人」「開車對路邊的妓女按喇叭，然後把車開到暗處，開始車震......」「騎腳踏車撞警察」「可以雙手拿槍」「潛到海裡收集貝殼」「改裝車子（可以有 氮氣加速）」「拿火箭筒把直升機轟下來」「拿巨大的陰莖攻擊路人」等等。而且，這是一個沒有「Game Over」的動作遊戲，在遊戲中掛掉的話，也只會被送去醫院，然後沒收身上的武器而已。 這個影片幾乎把 GTA: SA 的精華都秀出來了～ I'm An Asshole. 騎摩托車到處做特技表演也是這款遊戲的一大樂趣。 不過，要搞到像這些神人這樣，這種出神入化的境界終究是要靠天份的...... 還有一點，因為 GTA 的遊戲都會內建密技，玩家只要輸入幾個指令就可以開始一些 莫名奇妙 的功能：變肥、路人都變成你的手下、讓身邊的車輛爆炸、路人會拿火箭筒攻擊你...... 諸如此類的鬼功能（當然也是有很正常的）。我要說的是，不是有個「RIPAZHA（讓車子飛起來）」的密技嗎？開啟這個密技之後，車子加速到一定程度時，它會「浮起來」一段時間，但是，如果和「PPGWJHT（遊戲加速）」這個密技一起用的話，可以 把車子開到天上去 ～ 不過，我覺得 GTA 系列最好玩的地方，其實是那些由玩家開發出來的「模組（Mod）」：我都去 GTAGarage.com 下載。這些外掛模組的種類很多：載具方面，可以下載很多由其他玩家自行設計的交通工具（我看過「閃電霹靂車」和 李麥克的「夥計」......）；武器的話，有「光劍」、「青冥劍」和「大摺扇」之類的，以及 讓火箭筒也能夠使用「雙槍」；人物方面，則可以讓主角換「skin」，例如 變成 007 或是 魔鬼終結者；還有一些「功能性」的外掛（應該叫 修改器），例如 Control Center 這個強到爆的修改器和 Hot Coffee；也有某些模組是整個把遊戲內容改變的那種，我玩過「駭客任務」和「超人」的模組，就是那種可以在天上亂飛和一拳把敵人打飛到五公里外的那種～ 我還裝過一個「瞬間移動」的模組，但是，它有一個很大的問題：如果我原本在高山上，想要瞬移到平地的話，的確是可以瞬移成功，但是，人物的座標位置改變了，地點的高度卻沒有變...... 也就是說，我瞬移到平地之後，高度還是跟在高山上的時候一樣，所以，主角會從一千多公尺的高空掉下來...... 也有玩家會設計出一些神奇的地形或建築，通常都是用來表演特技用的： 雖然這是 GTA: VC 的畫面，但是，我一直就很想要這種「不會摔車」的外掛～ 誰可以告訴我要去哪裡下載啊～ 在 GTA 的世界裡，什麼事都有可能發生...... 我在網路上有看到，有大陸人（3DM 工作室）做出 GTA: SA 的中文化。但是，因為我看它一直都是「公測版 0.9x」，所以想等到正式版的出來再去抓。可惜，那個 3DM 工作室 好像掛掉了，現在都連不上他們的網站，也不知道中文化的進度是怎樣。 當然也就沒辦法從官網下載漢化的檔案了...... 不過，網路上什麼東西找不到呢？ >---------------------------------------------------------< 【臥底神鷹（Total Overdose）】 雖然 GTA: SA 是一款完成度很高又很耐玩的遊戲，曾經讓我廢寢忘食過一段時間，但是，「臥底神鷹」才是我玩過「爽快度」數一數二的動作射擊遊戲啊！GTA: SA 我早就從我的電腦中移除了，惟獨這一款 臥底神鷹，它的捷徑可是一直都在我的桌面上～ 這款遊戲玩起來最爽的地方就是它的「Bullet Time」（這是 英雄本色（Max Payne）裡的說法，因為我忘了這在 臥底神鷹 裡面叫什麼了......），總之就是那個傳說中的 SLOW MOTION（也就是 駭客任務 中，Neo 下腰閃子彈的那一幕）。在遊戲中按下 space 鍵之後，就會開啟這個能力，敵人會變成慢動作，你還可以看到子彈打過來的路徑。重點是，玩家可以使用 SLOW MOTION 做出很多帥到爆的動作：如果在牆邊使出 SLOW MOTION 的話，主角會側身踏上牆壁，來個 360 度的側翻，然後在這個動作的過程中，磅！磅！磅！一槍一槍地爆掉敵人的頭～ 雙槍才是射擊遊戲的王道！ 除了 SLOW MOTION 之外，主角還擁有七種「必殺技」：有一招是對全範圍的敵人做衝鋒槍攻擊的「龍捲風」，我超愛用的；也有一招是模仿鬥牛的「衝撞攻擊」，可以把敵人撞飛出去；而「黃金槍」則有三發子彈，有自動瞄準和一擊必殺的能力；還有一個是像電影「英雄不回頭」裡面的那個「吉他機關槍」～ >---------------------------------------------------------< 【駭客任務：關鍵抉擇（The Matrix: Path of Neo）】 如果可以的話，我想封這款遊戲為 PC 平台上的「動作遊戲之王」啊！ 另外，這款遊戲有「中文版」～ 關鍵抉擇 是我玩過「動作性」最強的動作遊戲（當然，只限於 PC Games），在整個遊戲過程中，玩家可以操控 Neo 做出大概八百多萬種的格鬥技巧～ 對於動作的描寫，文字再怎麼寫也不會有感覺，還是看影片吧！ 這款遊戲的劇情基本上就是把「駭客任務 三部曲」搬出來讓玩家玩過整個故事，不過，並不是每個橋段都會在遊戲中出現，某些沒有武打場面的劇情的話，會直接播電影給你看，而不是讓你玩。 但是，那些電影裡面的經典場面絕對能夠讓玩家玩到，例如： 大廳槍戰： 法國佬的豪宅大混戰 在屋頂跟探員對幹 好多好多史密斯探員...... 駭客任務：關鍵抉擇 也增加了很多「新劇情」（電影裡面沒有的）～ 跟莫菲斯對打的「I known kung fu.」 客棧大戰斧頭幫： 木樁上的火焰大挑戰～ 遊戲製作小組還弄了一個 NG 片段...... 玩過遊戲再來看比較好～ >-------------------------------------------------------------< 電玩生涯：PC Games．RPG PC Games．ACT PC Games．SRPG PC Games．SIM Online Games TV Games．PS2 Tagged: ACTPC Games下載電玩電玩生涯"
