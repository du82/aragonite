full_description = "問卷調查：我的朋友都在發情 Posted on 2007/12/052009/09/21Author VintaPosted in 其實我小時候的志向是成為詩人 問卷描述：難道你就沒有別的話要對我說了嗎？ 填寫期限：在販售迷戀的那段時光裡 一、電話後深切反省症候群 是 否 ﹍ ﹍ 01. 裸露的左手腕著實令我焦慮 ﹍ ﹍ 02. 面對薔薇與太空船的話題會吊詭地感到歡愉 ﹍ ﹍ 03. 失去焦距的憂愁僅僅濃郁了猜忌 ﹍ ﹍ 04. 自白說：因為認識了一名菸草商導致性格異常堅忍 ﹍ ﹍ 05. 親愛的，也因為妳是一個受歡迎的人 ﹍ ﹍ 06. 只要暫緩嫉妒酩酊之後依舊會是一種狂喜 ﹍ ﹍ 07. 雙頰憤憤地好似一枚柳橙 ﹍ ﹍ 08. 非關乎思想的顏色 ﹍ ﹍ 09. 據說咬指甲可以抑制性慾但只適用豐腴的體型 ﹍ ﹍ 10. 結論：任一個持有橘色鑰匙圈的女子皆喜愛正直的男性 ﹍ ﹍ 11. 小路亂狀 ﹍ ﹍ 12. 而我的朋友都在發情 二、瘋狂就是武器 真 假 ﹍ ﹍ 13. 我突然發覺抒情的關鍵在於「ㄋㄧˇ」的隱匿性與擺置 ﹍ ﹍ 14. 帶電的胴體使煩躁的異國商人高雅地說出卡其色的敵意 ﹍ ﹍ 15. 她如此輕快且甜蜜又真誠地說出他左眼裡那些瑣碎的事 ﹍ ﹍ 16. 去你的去妳的去祢的去您的去你的去妳的去祢的去您的 ﹍ ﹍ 17. 跳舞、餵食、迷走機器、大量的填字遊戲與黑色絲襪日 ﹍ ﹍ 18. 樓下那隻白貓總是大聲地說雨天去吃麻辣鍋才是正經事 ﹍ ﹍ 19. 所謂的裝置藝術家就是擊碎大銀色的蘋果並且寫出小篆 ﹍ ﹍ 20. 以我而言並不覺得有什麼事會重要到需要提出來對妳說 ﹍ ﹍ 21. 逮住了嗎？小時候母親的喋喋不休中的具體而微的謀殺 ﹍ ﹍ 22. 捕殺母鯨魚與舊城市文藝社團的悲傷信仰是相對搖擺的 ﹍ ﹍ 23. 我的興趣之一是把兩片抹著很多巧克力醬的白土司吃光 三、我需要一把不容易感到羞愧的指甲剪 對 錯 ﹍ ﹍ 24. 銀河系外的游牧民族都擁有無數個細緻的靈魂，不巧飛碟失事了 ﹍ ﹍ 25. 請假裝什麼事也沒有發生，可汗說：我們只需要交配 四、屍體的歧異性 強 弱 ﹍ ﹍ 26. 麵包店對話錄 ──「老闆，我要一杯綠豆沙。」 五、安娜莉的電音民謠史 六、我們都喜歡在挨餓時說些言不由衷的關於天氣的許多事 Tagged: 現代詩發情"
