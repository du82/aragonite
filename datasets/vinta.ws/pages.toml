title = "PC Games – 真．他媽的"
description = "When in doubt, pa chou ching."
full_description = "電玩生涯：PC Games‧SIM - 模擬市民 2 Posted on 2008/02/102013/05/09Author VintaPosted in 關於 ACG 那些很宅的東西 ===== SIM：模擬類型 ===== 【模擬市民 2】（The Sims 2） 前作「模擬市民」號稱是史上最暢銷的遊戲之一，而二代也不遑多讓，而且，二代大概是我見過玩法最多樣的遊戲了。模擬市民 2 的玩法，簡單說就是讓你操控一個或多個自創的小人物，然後，幫他過生活。所有日常生活中可以做的事或各種異想天開的詭異動作，在遊戲裡面都有相對應的指令，例如：吃飯、睡覺、聊天、上廁所、洗澡、看電視、聽音樂、打電話、上網、跳舞、讀書、修理電器、下棋、射飛鏢、煮菜、游泳、畫畫、彈鋼琴、玩電動、玩遙控汽車、叫計程車、打架、玩枕頭戰、看星星、擁抱、親吻、嘿咻、生小孩、裸奔、冥想...... 在安裝了各不相同的資料片之後，還可以有：復活死人、加入秘密社團、和自己的大學教授嘿咻、開跑車、唱卡啦 OK、在約會的時候潑別人水、打保齡球、開店、養寵物、創造寵物、做雪人、玩水、捉迷藏、溜冰、旅行、露營、瞬間移動、打太極拳、踢足球、練習芭蕾舞、修汽車...... Read More 電玩生涯：PC Games‧SRPG Posted on 2007/07/102013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 我所謂的 SRPG 就是那種「走格子」的回合制策略模擬遊戲（戰棋遊戲）。 我超愛走格子的～ ...... 我知道，上一篇 已經是很久以前的事了～ ===== SRPG：策略角色扮演 ===== 【超時空英雄傳說 2 ～ 復仇魔神】 【超時空英雄傳說 2 外傳 ～ 北方密使】 這個系列的遊戲最出名的除了它的「轉職系統」之外，就是劇情上的「多重路線」：在許多的關卡中，會出現「對話選項」或根據不同的勝利條件使得劇情上出現分歧，進入不同的關卡，就像這個「簡易攻略」。雖然「多重路線」這種東西在現在已經不算什麼了，但是，在 1997 年的那個時代，這可是對台灣玩家（我是在說我自己）的一項衝擊性創舉啊～ 以前玩遊戲都只是照著劇情走，走到那一關就殺光那一關的敵人，很少有能夠讓玩家自己決定關卡走向的，雖然大體的劇情還是差不多，但是走不同的關卡就會遇到不同的敵人，拿到不同的武器、裝備，所以一套遊戲都得玩它個三、四遍才過癮～ 雖然遊戲中有大量的「劍與魔法」的奇幻設定，但是，它的故事背景可是非常「科幻」的（我超愛科幻的）～ 從一代的「震旦星人的高科技戰艦墜毀在科隆多星球」、二代「明錫島的震旦主控室」到外傳的「最後大魔王根本就是外星人」，尤其是外傳，除了那些魔法、騎士、精靈之類的東西之外，應是安插了很多「高科技裝備」，像是「穿甲飛彈」「反引力滑靴」「質子護盔」之類的，敵人手上拿的是弓箭，而我們卻在用「光線槍」轟它，整個就很詭異啊～ Read More"
