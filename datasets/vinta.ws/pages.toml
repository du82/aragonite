title = "電玩生涯：PS2 – 動作遊戲 Part 1 – 真．他媽的"
description = """
到目前為止，我唯一擁有的電玩主機，就是 PS2 了。如果不把國小的時候，一堆小鬼一到下課就拿著自己養的電子怪獸在那邊搖啊搖的（以為這樣會比較容易贏），到處跟別人對戰的「怪獸對打機」算在內的話。我甚至沒有經歷過紅白機、DC 和 PS 的時代，而是直接跳到電腦。
 
從我國中基測前夕入手 PS2 之後（各位父母千萬不要答應你的小孩在基測前的三個月之內買任何電玩主機啊......），一直到現在，PS2 的遊戲我都只玩動作遊戲，因為也只有動作遊戲是看不懂劇情也可以玩得很爽～
 
【真．三國無雙】系列
 

 
真．三國無雙 3 是我的第二款 PS2 遊戲（第一款是 A Z.O.E.），"""
full_description = "電玩生涯：PS2 - 動作遊戲 Part 1 Posted on 2009/02/232009/02/23Author VintaPosted in 關於 ACG 那些很宅的東西 到目前為止，我唯一擁有的電玩主機，就是 PS2 了。如果不把國小的時候，一堆小鬼一到下課就拿著自己養的電子怪獸在那邊搖啊搖的（以為這樣會比較容易贏），到處跟別人對戰的「怪獸對打機」算在內的話。我甚至沒有經歷過紅白機、DC 和 PS 的時代，而是直接跳到電腦。 從我國中基測前夕入手 PS2 之後（各位父母千萬不要答應你的小孩在基測前的三個月之內買任何電玩主機啊......），一直到現在，PS2 的遊戲我都只玩動作遊戲，因為也只有動作遊戲是看不懂劇情也可以玩得很爽～ 【真．三國無雙】系列 真．三國無雙 3 是我的第二款 PS2 遊戲（第一款是 A Z.O.E.），也是我玩過的第一款「一夫當關，萬夫莫敵」的無雙類型動作遊戲，我在電腦上幾乎都只玩 RPG 而已，所以第一次玩這種拿著長兵器砍啊砍、武將一直擋啊擋、小兵一直來啊來的遊戲，超．爽．ㄉㄜ～ 四大勢力（魏蜀吳和其他）中我最愛用的武將分別是甄姬、馬超、周泰、呂布。 呂布，戰神就是戰神，他的 C3 和 C6 好用到爆炸！我閉著眼睛打都可以好幾百斬，一串普攻打完再接 C3 大範圍的攻擊，如果裝上雷玉的話，連續來個四、五次也幾乎不會被小兵摸到，敵人一多，隨隨便便就千人斬了，所以我第一個練滿的角色就是呂布啊！而他唯一的缺點就是無雙技跟他的 C 技比起來遜很多。但是呂布哪需要放無雙啊！？裝個「真空書」就天下無敵了嘛～ [MEDIA=71] P.S. 玩這款遊戲，玩家第一個遇到的最驚險的關卡應該都是「虎牢關之戰」吧？一開始操縱著武器很爛、等級很低、血又很少的關羽殺到虎牢關下的時後，就會看到「喔喔喔！那不就是傳說中的呂布嗎？」然後就提著關刀衝上去了，過了幾分鐘之後，咦？不是要「三英戰呂布」嗎？怎麼劉備跟張飛這麼快就被呂布幹掉了？而我都已經放了好幾回的無雙了，呂布的血為什麼還剩這麼多啊！？然後，我的關羽也掛掉了，搞得我直到把趙雲練滿之前，我都不敢去打呂布了...... 馬超，對於超哥這個角色，在玩家之中總是流傳著一句話「馬上萬人敵，馬下萬人騎」，沒有「絕影」的馬超，跟一個雜魚沒兩樣 ── 但是，騎了馬的馬超，根本就是三國第一猛將啊！「馬上超人」的名號可不是叫假的，馬上的攻擊只有單邊這根本就是作弊！因為騎著馬所以移動速度快，武將如果防禦的話，隨便走一下就可以繞到他背後，不然三角震一下就暈了，然後開始一連串的慘無人道的攻擊，什麼 C2、C6 都不需要，方塊一直按下去就破關了，嘖，除了那個龍頭盔看起來有點矬之外，這個角色簡直是極品～ 周泰，真三三莫名奇妙就多了一個拿「武士刀」的三國武將：周泰，雖然很怪，但是，他的拔刀術砍起人來真的是好帥，再加上他那把刀應該都快比他的身高還要長了，C2 拔刀術連抽的時候，那個鏗鏘有力的收刀入鞘的聲音真的好帥。周泰的無雙技更是恐怖到讓人不禁為這些小兵起了惻隱之心，砍到地老天荒，砍到我都想說「不要這樣，那些小兵好可憐喔」，真的好作弊的一個咖～ 甄姬，之所以愛用這個角色完全就是因為外型實在正點，忍不住會一直用 C3 的女王踢，雖然可以把敵人踢得飛很遠，但是甄姬的攻擊力和範圍實在都小到靠北所以根本不痛，被踢飛的小兵過一會兒又跑回來了，大混戰的時候打得超痛苦的，但是，沒關係，我們對這個角色有愛就夠了。 我覺得三國無雙系列最大的敗筆，在玩了一陣子之後，就會發覺怎麼小兵殺個幾下就沒了？在戰場上大部分的時間都在趕路，四處找人砍，如果選到了移動速度慢的武將，那可真是惡夢。運氣好的話，遇到了大混戰的時候，卻又會常常出現本系列的慣有 BUG：透明人，不知道是 PS2 的性能不好，還是 KOEI 的程式寫太爛，畫面上的雜魚一多，就會有一些小兵變成隱形的，但是他們還是可以攻擊，只是玩家卻看不到他們，然後遊戲就開始 LAG 了...... 不過，因為我除了人生無法腳踏實地之外，玩 game 的時候也不行，如果一款遊戲沒有密技、金手指或是不能修改的話，我真的玩不下去。所以，把幾個愛用的角色練滿之後，我在玩其他人的時候，幾乎都是開「無雙不減」的金手指在玩的，然後，就不得不提「甘寧」了。大家都叫他「甘寧老師」，他其實不強啊我覺得，但是在「無雙不減」的加持下，他的無雙技就非常正點：俗稱「開火車」，這個金手指打下去，真的就是開到地老天荒了，雖然我通常用來趕路比較多，因為我用無雙都打不到人...... 我覺得光榮的「C 技」系統應該成為業界的標準才是，簡單又容易上手，就不知道他們有沒有申請專利？至於另一款「戰國無雙」系列，雖然我也玩過，但是，同樣都是以日本戰國為背景的遊戲，「戰國無雙」完全比不上這一款： 【戰國 BASARA】系列 這一款是 Capcom 的作品，卡普空製作的遊戲我都超愛。例如：大神、惡魔獵人、變身超人 Joe，他們都好棒。而這一款，雖然每次只能帶兩個「固有技」上場這一點始終讓我耿耿於懷，但是，戰國 BASARA 2 絕對是同類型的遊戲中我最愛的一款，原因就是他的人物設定實在是太正點了，每一個角色都不知道在帥個什麼勁，好的人設是一款遊戲的靈魂啊！ 遊戲是以日本的「戰國時代」為背景， 但是，倭寇的歷史干我屁事啊？我都沒提「南京大屠殺」了～ 我最愛的武將當然是「六爪流」的「獨眼龍 伊達政宗」啦！是一個很愛烙英文的崇洋媚外的角色，他裝備了「無限六爪流」之後，刷的一聲把腰間的六把武士刀（沒錯！六把！）拔出來的時候，幹！帥到靠北！而且，他的配音員正是「中井和哉」（就是海賊王裡的索隆啊！），第一次看到過場動畫的時候，你知道他騎著馬對部下們說了什麼嗎？ 是 Are you ready, guys? Let's Party! 啊啊啊～ 撇開他很愛講英文這一點，這個角色真的超好用，裝上了幾個增加攻擊速度的道具之後，伊達政宗根本就不需要固有技（雖然我覺得 PHANTOM DIVE 很好用），他的普攻就已經快到敵人完全沒有還手的餘地了，雖然這個影片看不太出來～ 因為我是先玩過「戰國無雙 2」才開始接觸「戰國 BASARA」系列，跟 KOEI 的樸實無華的人物設定比起來，戰國 BASARA 根本就是來亂的，從人物、道具、武器到劇情，通通都好惡搞，除了反差很大的「明智光秀」，他在戰國無雙是個英姿勃發的上進青年，但是到了 BASARA 之後，簡直是個變態嘛！武器是兩把半長不短的鐮刀，老是一邊很變態又很陰險的笑然後一邊拿鐮刀在小兵身上插來插去的，我都不知道該怎麼說他了。 我第二愛用的角色是「上杉謙信」，在 CAPCOM 的設定之下，是個很酷的「女同性戀」，這一點從動畫就可以看出來了，這一段超惡搞的～ 完全可以理解為什麼 春日 會一直發出很淫穢的叫聲...... 上杉謙信的固有技「神烈」無疑是所有角色中最帥的一招了，再加上她的屬性是「冰」，可以把敵人定住，把長刀拔出來一陣超快速的亂砍，打王超好用的啊！雖然「神速」用來清小兵和趕路兩相宜，打武將的時候，一直繞著砍的拔刀術也很強，但是，因為要一直轉動香菇頭（類比搖桿），長期下來會造成左手大拇指抽筋的隱憂，所以我還是比較喜歡「神烈」。而且，上杉謙信的 BASARA 技的破壞力應該也是數一數二的（最強的是「本多忠勝」的那顆大雷玉吧？），先用「神速」在畫面上掃過一遍之後，再放個 BASARA 技，場上瞬間就沒人了啊！雖然只能在定點攻擊，這一點比較幹，但是，殺傷力真的很高啊我覺得。 最靠北的角色應該就是「本多忠勝」了，在戰國無雙是一個頭上帶著鹿角頭盔的中規中矩的武將，在 BASARA 裡，本多忠勝變成「機器人」了！變成鋼彈了啊！至於「德川家康」就好像大雄，每次一遇到危險就大喊「哆啦 A 夢」的名字...... 雖然每個角色都被設定成不倫不類的樣子，但是，不管在哪個遊戲裡，「織田信長」好像都還是一副「大魔王」的樣子，也都是正太控。而且，織田信長的武器，是帥到爆的「散彈槍」啊！更別提信長的老婆「濃姬」了，她的武器竟然是「雙槍」！ 哈哈哈，大姐頭有沒有這麼帥氣？ 這款遊戲比較糟的地方，這一點到「戰國 BASARA 2 英雄外傳」的時候，還是沒有改善，就是「動畫裡的人物，講話的時候嘴巴都不會動......」，雖然這根本無傷大雅，只要有這些充滿特色的武將，「戰國無雙」系列即使嘴巴會動，還是比不上 BASARA 啊！從人物設定、武器到關卡劇本，尤其是 CAPCOM 的人設真的贏 KOEI 很多，跟無雙系列的中規中矩比起來，戰國 BASARA 充滿帥勁的華麗的惡搞，才是我的菜啊～ 【異世紀機器人大戰】系列 Another Century's Episode 雖然 KOEI 也出了一款「鋼彈無雙」，但是，一點都不好玩啊（我好像一直在罵 KOEI......），我比較喜歡 BANPRESTO 出的 ACE 系列。 基本上，可以把 ACE 想成是無雙版的「超級機器人大戰」，最大的賣點是集合了很多機器人動畫的機器人，在宇宙、地球、月球、火星上跟一大群機器人雜魚對轟，跟三國無雙、戰國 BASARA 這種遊戲最大的不同，就是玩家操控的不再是人類，而是機器人啊！而且，角色移動的範圍也不只限於平面，而是三度空間了（尤其到了宇宙之後）。跟人類不同的是，機器人都有很多大範圍的攻擊招式，我最愛的，當然就是「天使鋼彈」的那招 360 度粒子砲轉轉樂了～ 我對 ACE 系列比較沒有愛的原因，就是裡面出現的很多人物和機體，我都不認識...... 鋼彈只認得 W、G 和 SEED 而已，畢竟也只有鋼彈 W 是我從頭看到尾的，那首 JUST COMMUNICATION 的配樂一出現，我整個人的汗毛都立起來了，感動啊～ 長了羽毛翅膀的「飛翼．零式」是怎麼看怎麼帥，那把雙管光束砲在遊戲裡強到破表，雖然只能發射三發（但是我都開金手指在玩的，所以沒差），從 ACE 2 玩到 ACE 3，我最愛用的機體始終都是 開了武器無限的金手指之後的「飛翼．零式」～ 不過，遊戲裡沒有「次代鋼彈」這一點讓我好惆悵，連「托爾吉斯」都有了，為什麼沒有「次代鋼彈」啊？！ 至於其他機種，除了「蓋特」和「超時空要塞」的機體之外，很多我連名字都叫不出來，所以就不提了，不過，二代的女主角機還蠻好用的（就是那台紅色的）。如果對 ACE 系列裡出現的機器人如數家珍的人，玩起來可能可以很熱血，畢竟連我這個一百多台機體裡，認識的不到 20 台的人，都可以玩得很爽了。這款遊戲的爽快感真的不是無雙系列可以比擬的，駕駛著一台超帥的巨大機器人，在宇宙中用推進器衝來衝去的那種快感，放一下大絕就把整個畫面的小兵都清光了，跟敵方的鋼彈在月球上飛來飛去的纏鬥，不時射幾發根本打不到人的巴爾幹砲，幹！這才是男人的浪漫啊！ 對於那些把電玩視為小孩子的玩意兒的人，你要上哪兒去找這種熱血啊～～～ 最後，雖然跟 PS2 無關，但是，讓我那麼想要一台 XBOX 360 的就是下面這款遊戲，看到她，你怎麼可能會不想玩啊！？雖然中文譯名很鳥...... 不過，鏡頭從跨下來的那一招，真的是很過份啊！ Bayonetta 魔兵驚天錄 Tagged: ACTCAPCOMTV Games電玩電玩生涯"
