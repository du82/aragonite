["https://vinta.ws/blog/317"]
title = "電玩生涯：PC Games．RPG – 真．他媽的"
description = """
我在寫「讀書與買書的 22 個問題」的時候，寫到一半就很詭異地離題，變成在談電玩...... 所以，乾脆就獨立出一篇來專門談談我從小到大玩過的電玩好了～
 
我這輩子玩的第一款電腦遊戲是「超級快打旋風 2」（還是我爸買給我的），是的，是「電腦遊戲」。也大概就是從那時候開始，我注定了這輩子跟格鬥遊戲無緣：我曾經很努力地嘗試過，所以能夠用的角色我都用過了，沒有一隻可以讓我連贏三場以上...... 所以，我從來沒有跟「豪鬼」打過，因為我根本玩不到那麼後面啊～
 
而且，每個角色不是都有所謂的「超必殺技」嗎？就拿龍來說，他的超必殺技是「真空波動拳」（就是用出來之後，角色的動作會出現殘影），我敢"""
full_description = "電玩生涯：PC Games．RPG Posted on 2007/04/272013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 我在寫「讀書與買書的 22 個問題」的時候，寫到一半就很詭異地離題，變成在談電玩...... 所以，乾脆就獨立出一篇來專門談談我從小到大玩過的電玩好了～ 我這輩子玩的第一款電腦遊戲是「超級快打旋風 2」（還是我爸買給我的），是的，是「電腦遊戲」。也大概就是從那時候開始，我注定了這輩子跟格鬥遊戲無緣：我曾經很努力地嘗試過，所以能夠用的角色我都用過了，沒有一隻可以讓我連贏三場以上...... 所以，我從來沒有跟「豪鬼」打過，因為我根本玩不到那麼後面啊～ 而且，每個角色不是都有所謂的「超必殺技」嗎？就拿龍來說，他的超必殺技是「真空波動拳」（就是用出來之後，角色的動作會出現殘影），我敢說，所有角色的超必殺技沒有一個我有按出來過...... 我覺得，我在玩格鬥遊戲的時候跟一個智障沒兩樣。 玩動作遊戲的時候就不會～ ===== RPG：角色扮演 ===== 提到電玩，當然就要從「遊戲類型之王：RPG，角色扮演」開始談了～ RPG 我幾乎都是玩國產的。 雖然很多國外的經典大作也都有中文版的發行，但是，不知道為什麼，我就是比較喜歡玩國產的 RPG 啊～ 不過，現在的國產遊戲真的沒幾套可以玩了，就連「軒轅劍」（四代以後）和「仙劍奇俠傳」（二代以後）出新作的時候，我也都是 含淚 在支持的...... 所幸還有「幻想三國誌」～ 我的第一套 RPG 就是經典到爆的【金庸群俠傳】（單機版的那個）。 [MEDIA=66] 這款遊戲是我玩過自由度最高的國產遊戲（雖然國產遊戲中，有「自由度」這種設定的遊戲也沒幾套......），當然是比不上「俠盜獵車手」，但是，再怎麼說，金庸群俠傳 可是 1996 年就發行的骨灰級遊戲～ 這款遊戲把金庸的「十四部小說：飛雪連天射白鹿‧笑書神俠倚碧鴛」編進同一套遊戲裡，劇情方面，可以去光明頂跟六大門派對幹、上黑木崖一個人單挑東方不敗、到華山參加華山論劍；人物方面，令狐沖、張無忌、段譽、楊過、石破天都可以成為你隊伍裡的一員；武功方面，九陽神功、降龍十八掌、泰山十八盤、玄鐵劍法、北冥神功，幾乎你想的到的金學武功都可以學。更有趣的是，修練 葵花寶典、辟邪劍譜 的時候，遊戲還會問你「修練此書必須先行揮劍自宮，你是否仍要修煉？」然後我就把令狐沖、張無忌、段譽、楊過、石破天、田伯光、胡青牛等人通通抓去自宮了，金庸群俠傳從此改名叫「自宮群俠傳」...... 我問過每個玩過這款遊戲的人，好像都有這樣幹過～ 我到現在還記得，當初因為發現絕情谷的位置（要從黃河進去）而高興的連吃飯的時候都在笑～ 因為我卡關卡了好幾個禮拜，一直在百花谷跟周伯通的蜜蜂說話：「我在絕‧情谷底」，我當然知道小龍女在絕情谷底，可是我不知道絕情谷在哪裡啊！遊戲附贈的那張地圖又沒有把絕情谷的位置標出來...... P.S. 我小時候不知道是哪根 莖 不對了，我做了我這輩子最後悔的事：我把「金庸群俠傳」和攻略本送給我的堂哥（還是表哥之類的）。 後來我想拿回來的時候，不知道該怎麼開口...... 金庸群俠傳 -- 遊戲基地（這裡有很多好東西） >---------------------------------------------------------< 宇峻奧汀 的【 幻想三國誌 2】是我近年來玩過，我最愛的一款國產 RPG 了。 我玩到「奈河橋畔」的時候，都快要哭出來了～ 沒有玩過遊戲的人是不會理解的。 [MEDIA=67] 我當初玩的「幻想三國誌 2」是跟我同學借來的。 但是，破關之後，因為實在是太愛這款遊戲了，我就去買了 精裝版。 還有附一隻玩偶～ 不過，三代都出了很久了，我都還沒買...... 遊戲介紹： 宇峻奧汀 - 幻想三國誌 貳 >---------------------------------------------------------< 【 軒轅劍 3 ～ 雲和山的彼端】是所有 軒轅劍系列 裡，我第一次接觸也最喜歡的作品。 雖然「天之痕」比較受歡迎，不過，我還是比較喜歡「雲和山的彼端」。 [MEDIA=68] 遊戲是從「威尼斯」開始，先後到了大馬士革、西域、石國、天山，最後才在中國結束故事。因為主角是個「西方人」，所以，軒轅劍一直都會有的妖魔鬼怪行列，這次多了「撒旦」的加入（我始終對於「天使」「惡魔」這一類的主題很感興趣～），雖然軒參的故事架構看起來很大（橫越兩大洲、東西方的神祇），可惜，著墨的地方都不多，尤其在中國的部分，應該要有更多的劇情在這裡發生才對啊！賽特千辛萬苦來到中國，晃沒幾個地方，在長安附近砍完撒旦之後，竟然就結尾了...... 雖然我還是覺得軒參應該可以做得更好，但是，我當初（國小六年級）第一次玩這款遊戲的時候，其實是有種「驚艷」的感覺的。除了劇情之外，軒參的完成度其實很高，畫面、操作、道具、法寶的各項系統，在當時都是水準之上的。尤其是遊戲的配樂，我從三代玩到五代，只有三代的配樂是可以一聽到就能夠想到它是出現在哪個劇情。 慧彥在怛羅斯峽谷悲壯犧牲了。 這一段劇情我看到熱淚盈框...... 沒有玩過的人是不會懂的。 詳見：國產遊戲十大經典片段推薦（下） - 文化、評論 - 紫竹劍閣武俠遊戲網 在「幻想三國誌 2」出現之前，軒參一直是我心目中 2D 中文 RPG 的極致之作。 而那個一直深受推崇的「仙劍奇俠傳」，我反而覺得普普而已。雖然去年我才又玩了一次「新仙劍奇俠傳 XP」來重溫一下童年～ 不過，軒轅劍 3 仍然是我目前為止重玩過最多次的一款遊戲：五次。 我之所以比較喜歡軒轅劍是因為我總覺得仙劍的故事老是在那裡情來愛去的，玩久了還挺煩人的。而軒轅劍則比較喜歡把劇情扯向歷史、神話這一類，我對那種參雜真實歷史的劇情設定比較有偏好。再說，軒轅劍的遊戲裡都會有「DOMO 工作室」，而仙劍卻沒有「狂徒工作室」...... P.S. 因為我會把我玩過的遊戲的相關資料都保存起來，像是「存檔」「攻略」「修改器」那一類的東西，長年下來，我的「電玩資料庫」（截圖一、截圖二）其實也有不少東西了～ 遊戲介紹： 軒轅劍參：雲和山的彼端 - Wikipedia 楓舞軒轅 - 軒轅劍參 軒轅疾風網 - 軒轅劍參 >---------------------------------------------------------< 雖然在我的心目中，「遊戲公司最應該拿出來重製不然就乾脆倒掉的遊戲 TOP 5」的第一名不會是【Final Fantasy VII】，而是「金庸群俠傳」。因為 FF7 重製之後還是不太可能會發行中文版...... 但是，靠著對岸的神人們所製作的 中文化，破關之後，我完全可以理解太七在 FF 系列的經典地位。 [MEDIA=69] 有圖有真相，的的確確是「繁體中文化」～ 當然，因為是 1997 年發行的遊戲了（見鬼了，十年前！），所以遊戲的畫面跟現在完完全全不能比，但是，太空戰士 7 可是 Final Fantasy 系列歷年來 銷售量最高 的一款遊戲啊！一個十年前的作品到現在都還陸陸續續有衍生作品出現就知道了（AC：FF7、BC：FF7、CC：FF7、DC：FF7），對 FF 迷來說，七代真的是經典到爆的一個作品～ 不過，我接觸這款遊戲的過程其實是挺坎坷的。大概也是國小的時候，我先是看了「軟體世界」（照片來源）的攻略之後，就興沖沖地跑去買了「Final Fantasy VII PC 國際版」，從拆包裝、翻閱說明書到安裝遊戲，都是非常愉悅而且順利地進行著，直到進入遊戲之後，我才驚覺：「幹！這是英文版的ㄟ！」是的，太七是我這輩子玩的第一套英文版的遊戲。因為當初雜誌上的攻略都是用中文寫的，我也看得很高興，完全忘了其實「遊戲是英文的」這件事...... 雖然我也以「壓根兒就看不懂對話，只玩戰鬥」的方式很克難地玩到了火箭村那裡，但是，因為 RPG 最重要的東西就是『劇情』！，我如果在看不懂劇情的情況下玩完了整款遊戲的話，這樣是會毀了這款遊戲的。所以，我就毅然決然地移除了它，打算等到我將來英文好到能夠不用查字典就看得懂劇情的時候，再來玩它。然後，過了好幾年，在我高二的時候，我終於又把 Final Fantasy VII 安裝到我的電腦上了。不過，不是因為我的英文程度變好了，而是因為有大陸同胞做出了「中文化」...... 我想，只要有玩過太七的人都一定對「Sephiroth（賽菲羅斯）」這個角色印象深刻吧？ 他應該是史上最受歡迎的反派角色了～ 那把長刀，帥‧到‧爆‧啊！ >---------------------------------------------------------< 在國產 RPG 裡面有一款跟 Final Fantasy VII 有點像的遊戲：【墮落天使】。 遊戲裡面有「精靈」（對應於 FF7 的 召喚獸）、「DNA 系統」（對應於 FF7 的 魔石）之類的東西，劇情倒是完全不一樣。我覺得這款遊戲的「召喚召喚獸的動畫」做得蠻不錯的，那個「人造天使 － 凱撒」「北歐主神 － 奧汀」的動畫都很有魄力啊～ 墮落天使是國產遊戲中少見的「科幻類型」的 RPG。 台灣的遊戲公司好像只會做「奇幻」而已...... 另外，這款遊戲是我玩過的唯一一款男主角拿「光劍」當武器的遊戲～ 還有，這款遊戲有內建「密技模式」：不用透過「遊戲修改大師」之類的軟體，遊戲本身就有提供一個介面，可以讓玩家輸入某些指令就能達到修改金錢、物品之類的目的。宇峻科技的「超時空英雄傳說」也有提供「密技模式」，難怪這兩家公司後來會合併～ 遊戲介紹： 奧汀科技 - 墮落天使（官方網站竟然還活著～） >---------------------------------------------------------< 「純武俠 RPG」的經典 ──【俠客英雄傳 3】，這款遊戲幾年前有出了一套重製版「俠客英雄傳 3 XP」。 所謂的「純武俠」就是不能有那些什麼「仙術」「奇術」「魔法」「神仙」「妖魔」「精怪」之類的東西，只能出現武俠小說會出現的名詞。但是會出現「鑄劍」「蠱毒」「挖礦」，為了取得礦石來鑄劍、毒物來下蠱，主角常常得要背著一把劍（通常還是絕世武器），手裡拿著鋤頭，在大地圖上到處挖啊挖的，相當另類的畫面～ 我玩了這套遊戲三遍，我可以很肯定地說，挖礦絕對不可能挖到什麼好東西的，那些「傳說中的名劍」是不會讓你挖礦挖到的...... 但是，每到一個新的地圖，就算我明明知道只能挖出一些垃圾，我還是會有一股想當礦工的衝動～ 玩這套遊戲的時候，我大部分的時間不是在練功，而都是在挖礦...... 這款遊戲除了挖礦之外，最讓人讚賞（？）的部份就是它的戰鬥畫面了。在遊戲的過程中，主角「張知秋」會依序學到下列的武功「潮山斷月劍法」「三歎劍法」「七星追魂步」「臥龍訣」「降龍十八掌」等，這些武功 初期 用起來是長得 這個樣子 的，但是，每一個招式都會隨著等級的提升而出現「殘影」（就像「快打炫風」裡面的「超必殺技」那樣），任何東西只要加上「殘影」就會變得很厲害。而到了遊戲的中後期的時候，主角會自創一套「紫霜劍法」（雖然名字聽起來很虛），就是把之前學過的所有武功串起來而成的新招式（還是很虛），重點是，主角會把所有武功一氣呵成地「表演」過一遍，主角會在懸崖邊上飛來跳去、一下放劍氣、一下揮掌風之類的，總之就是看得很過癮就對了。我每次重玩都是為了看那一段劇情～ 遊戲介紹： 精訊資訊 - 俠客英雄傳 3 XP >---------------------------------------------------------< 【刀劍封魔錄】 【刀劍封魔錄 外傳 ～ 上古傳說】 這兩款遊戲其實差不多，是用同一個系統做出來的兩個「劇情不同」的遊戲，不過「上古傳說」多了一個角色：「戰僧」，就是一個會用符咒的和尚。 這兩款遊戲讓我對所謂的「大陸貨」改觀～ 這是大陸人設計的遊戲，畫面、玩法有點類似「暗黑破壞神 2」，只不過是精簡多了。這款遊戲真正精華的地方在於「連招」──「暗黑風的中國神幻 ARPG 」。只要把各種「功夫技」的先後順序預先安排好，並在其中穿插幾下普通攻擊，然後對著敵人交互按著滑鼠的左右鍵，這樣就可以開始連招了。 這是代理商的宣傳稿裡面的說法： 例如 ，「龍搏」這一招旨在將敵人用氣流沖至空中，呈懸浮狀態，主角便可以利用此時機連擊對方，此招的視覺效果是一條盤旋上升的龍。「乘風」是比較典型的中國武術風格，發招之後，主角將從被攻擊者的身體穿過，動作輕盈矯健，充滿了少林色彩。另一招「奔雷」在發招後會將周圍所有的敵人撞倒，來勢洶湧猶如過江之龍。 直接看影片好了～ 雖然影片中的那個玩家玩得很爛，如果用「紅衣雙刀女」這個角色的話，要打到幾百擊是很容易的事。看完影片應該也可以發覺，玩家所操控的角色常常有事沒事就在那裡喊來喊去的，這也是這款遊戲的特色之一。玩久了之後，其實你會想跟著他喊...... 另一個特色是：「敵人都長得很醜」，大概是這麼醜： 遊戲介紹： 象素軟件 - 刀劍封魔錄 >-------------------------------------------------------------< 電玩生涯：PC Games．RPG PC Games．ACT PC Games．SRPG PC Games．SIM Online Games TV Games．PS2 Tagged: Final FantasyPC GamesRPG下載軒轅劍電玩電玩生涯"
