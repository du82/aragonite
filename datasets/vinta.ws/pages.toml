["https://vinta.ws/blog/650"]
title = "我們需要一種精準的憤怒 – 真．他媽的"
description = """
這次的「你可能會想知道」只有一個主題。
 
佔領立法院
和平理性非暴力就是別有用心的騙術 - 黃花崗雜誌
 

和平理性非暴力的原則，...，這有一定的適用範圍，就是在只動口不動手的君子們之間。有些人主張用這個原則對付屠殺老百姓的暴君和罪犯，不是腦袋進水就是別有用心的騙子。

 
Re: [爆卦] 我想到比攻佔立法院更民主的作法了 - PTT Gossiping 板
 

你們犯的最大的錯誤就是以為秩序就是民主，以為安全就是自由，
  就是因為台灣的民主夠進步，才會發生這樣的運動，
  就是因為台灣的民主還存在著希望，人民才會有勇氣跟動力站出來捍衛自己愛的人。"""
full_description = "我們需要一種精準的憤怒 Posted on 2014/03/202014/06/24Author VintaPosted in 你可能會想知道 這次的「你可能會想知道」只有一個主題。 佔領立法院 和平理性非暴力就是別有用心的騙術 - 黃花崗雜誌 和平理性非暴力的原則，...，這有一定的適用範圍，就是在只動口不動手的君子們之間。有些人主張用這個原則對付屠殺老百姓的暴君和罪犯，不是腦袋進水就是別有用心的騙子。 Re: [爆卦] 我想到比攻佔立法院更民主的作法了 - PTT Gossiping 板 你們犯的最大的錯誤就是以為秩序就是民主，以為安全就是自由， 就是因為台灣的民主夠進步，才會發生這樣的運動， 就是因為台灣的民主還存在著希望，人民才會有勇氣跟動力站出來捍衛自己愛的人。 要打的字太多乾脆寫 Blog 好了: 因為他們從來就不知道.... 這是錯的..... 但事實上，他們對於民主制度的想法其實是....「只要給我選上了，那在任期中我就高興怎樣就怎樣」，說穿了就是中國傳統的「成王敗寇」觀。 抵抗權的必要性與階段性 - 許慶雄の憲法私塾 最能充分說明抵抗權意義的，就是 1793 年法國人權宣言第 35 條： 「當政府侵害人民權利，別無其他任何方法可阻止時，起來抵抗是人民及各種力量中，最神聖不可欠缺的權利及『義務』」。 Re: [新聞] 譚慎格：台灣需回答，要成為中國一部份嗎？- PTT Gossiping 板 道德的沙漠生不出正義的合百。 [爆卦] 換個方向談服貿 - PTT Gossiping 板 檸檬式社會主義：對富人執行社會主義，對窮人執行資本主義。企業要倒時拿全民的錢去救，然而卻對勞動市場實行自由市場機制。 青島東路側外場，主持單位搞成了一個彷彿秩序黨般的溫馨集會。抗議的身體被馴化於嚴格管制的動線中，於是連吶喊的語言都逐漸齊一。大家為什麼如此害怕暴力到把憤怒和慾望都自我閹割掉？這無疑是華人教育的「成功」，才會連可能作為革命後備軍的年輕朋友們，都還要在此展演溫馴、卑恭。不停自我催眠。 — 李明璁 Mingtsung Lee (@Camducklee) March 21, 2014 革命不是靠什麼感動自己感動他人的話語，不是維持秩序愛與和平守規矩，不是仰賴媒體再現或網絡口碑的社會觀感（到底是誰的觀感？），不是要發現自己原來擁有良知熱情是個堂堂正正的好公民，不是乾坐集體想像何時會被警察扛走但我打不還手罵不還口有夠悲壯。革命，必須先革自己僵固身體與缺乏想像的命。 — 李明璁 Mingtsung Lee (@Camducklee) March 21, 2014 1968 年巴黎五月暴動街頭海報：一顆磚頭──「未滿 21 歲，你的選票在此」。這是鋪在巴黎街道的方石磚，68 年暴動，學生挖起許多這種石磚當武器和鎮暴警察對幹。 台灣人最大的問題不是鄉愿、盲從，也不是奴性；而是「抓不到重點」。 每次一有什麼議題出現，永遠就會有人在旁邊扯一些根本就不是重點的事，我們的立法機關已經完全無視程序正義了，卻還有人在鬼扯什麼可是那些學生打破立法院的玻璃？已經有一個彪形大漢衝進你家拎著他的老二往你臉上甩，你卻還在擔心浴室的水龍頭有沒有關？難怪大家總要說「台灣最美的風景是人」了。 Follow me on Facebook Follow me on Twitter Follow me on GitHub Tagged: 中國佔領立法院台灣學運政治民主"
