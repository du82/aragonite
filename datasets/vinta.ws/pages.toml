title = "database migrations – I Failed the Turing Test"
description = "When in doubt, overengineer."
full_description = "Convert utf8 tables to utf8mb4 in MySQL Posted on 2017-01-232019-10-22Author VintaPosted in Database Change Schema # For each database: ALTER DATABASE database_name CHARACTER SET = utf8mb4 COLLATE = utf8mb4_unicode_ci; # For each table: ALTER TABLE table_name CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; # For each column: ALTER TABLE table_name CHANGE column_name column_name VARCHAR(191) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; ALTER TABLE svcomments_svcomment CHANGE comment comment longtext CHARACTER SET utf8mb4 COLLATE utf8_general_ci; SHOW VARIABLES WHERE Variable_name LIKE 'character%' OR Variable_name LIKE 'collation%'; # Don’t blindly copy-paste this! # The exact statement depends on the column type, maximum length, and other properties. # The above line is just an example for a `VARCHAR` column. ref: https://coderwall.com/p/pns4pa/setting-up-unicode-defaults-for-mariadb-or-mysql https://mathiasbynens.be/notes/mysql-utf8mb4 http://stackoverflow.com/questions/766809/whats-the-difference-between-utf8-general-ci-and-utf8-unicode-ci http://dba.stackexchange.com/questions/8239/how-to-easily-convert-utf8-tables-to-utf8mb4-in-mysql-5-5 Application Settings Take a Django project as an example. in settings.py DATABASES = { 'default': { 'ENGINE': 'django.db.backends.mysql', ... 'OPTIONS': { 'charset': 'utf8mb4', }, 'TEST': { 'CHARSET': 'utf8mb4', 'COLLATION': 'utf8mb4_general_ci', }, }, } ref: https://tzangms.com/use-emoji-in-mysql-with-django/ Create a custom migration in Django Posted on 2017-01-232019-10-22Author VintaPosted in Database, Python # create an empty migration file $ ./manage.py makemigrations --empty --name convert_to_utf8mb4 your_app in your_app/migrations/0002_convert_to_utf8mb4.py from __future__ import unicode_literals from django.db import migrations class Migration(migrations.Migration): dependencies = [ ('your_app', '0001_initial'), ] operations = [ migrations.RunSQL( 'ALTER TABLE app_repostarring CHANGE repo_description repo_description VARCHAR(191) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;' ), ] ref: https://docs.djangoproject.com/en/dev/ref/migration-operations/#runsql"
