full_description = '''The Incomplete Guide to Google Kubernetes Engine Posted on 2020-07-262020-10-29Author VintaPosted in DevOps, Web Development Kubernetes is the de facto standard of container orchestration (deploying workloads on distributed systems). Google Kubernetes Engine (GKE) is the managed Kubernetes as a Service provided by Google Cloud Platform. Currently, GKE is still your best choice compares to other managed Kubernetes services, i.e., Azure Container Service (AKS) and Amazon Elastic Container Service for Kubernetes (EKS). ref: https://kubernetes.io/ https://cloud.google.com/kubernetes-engine/ You could find the sample project on GitHub. https://github.com/vinta/simple-project-on-k8s Installation Install gcloud to create Kubernetes clusters on Google Cloud Platform. Install kubectl to interact with any Kubernetes cluster. $ brew install kubernetes-cli # or $ gcloud components install kubectl $ gcloud components update ref: https://cloud.google.com/sdk/docs/ https://kubernetes.io/docs/tasks/tools/install-kubectl/ Some useful tools: fubectl: https://github.com/kubermatic/fubectl k9s: https://github.com/derailed/k9s stern: https://github.com/wercker/stern zsh-kubectl-prompt: https://github.com/superbrothers/zsh-kubectl-prompt Concepts Nodes Cluster: A set of machines, called nodes, that run containerized applications. Node: A single virtual or physical machine that provides hardware resources. Edge Node: The node which is exposed to the Internet. Master Node: The node which is responsible for managing the whole cluster. Objects Pod: A group of tightly related containers. Each pod is like a logical host has its own IP, hostname, and storages. PodPreset: A set of pre-defined configurations can be injected into Pods automatically. Service: A load balancer of a set of Pods which selected by labels, also called Service Discovery. Ingress: A revered proxy acts as an entry point to the cluster, which allows domain-based and path-based routing to different Services. ConfigMap: Key-value configuration data can be mounted into containers or consumed as environment variables. Secret: Similar to ConfigMap but for storing sensitive data only. Volume: A ephemeral file system whose lifetime is the same as the Pod. PersistentVolume: A persistent file system that can be mounted to the cluster, without being associated with any particular node. PersistentVolumeClaim: A binding between a Pod and a PersistentVolume. StorageClass: A storage provisioner which allows users to request storages dynamically. Namespace: The way to partition a single cluster into multiple virtual groups. Controllers ReplicationController: Ensures that a specified number of Pods are always running. ReplicaSet: The next-generation ReplicationController. Deployment: The recommended way to deploy stateless Pods. StatefulSet: Similar to Deployment but provides guarantees about the ordering and unique names of Pods. DaemonSet: Ensures a copy of a Pod is running on every node. Job: Creates Pods that runs to completion (exit with 0). CronJob: A Job which can run at a specific time or run regularly. HorizontalPodAutoscaler: Automatically scales the number of Pods based on CPU and memory utilization or custom metric targets. ref: https://kubernetes.io/docs/concepts/ https://kubernetes.io/docs/reference/glossary/?all=true Setup Google Cloud Accounts Make sure you use the right Google Cloud Platform account. $ gcloud init # or $ gcloud config configurations list $ gcloud config configurations activate default $ gcloud config set project simple-project-198818 $ gcloud config set compute/region asia-east1 $ gcloud config set compute/zone asia-east1-a $ gcloud config list Create Clusters Create a regional cluster in asia-east1 region which has 1 node in each of the asia-east1 zones using --region=asia-east1 --num-nodes=1. By default, a cluster only creates its cluster master and nodes in a single compute zone. # show available OSs and versions of Kubernetes $ gcloud container get-server-config # show available CPU platforms in the desired zone $ gcloud compute zones describe asia-east1-a availableCpuPlatforms: - Intel Skylake - Intel Broadwell - Intel Haswell - Intel Ivy Bridge $ gcloud container clusters create demo \ --cluster-version=1.11.6-gke.6 \ --node-version=1.11.6-gke.6 \ --scopes=gke-default,cloud-platform,storage-full,compute-ro,pubsub,https://www.googleapis.com/auth/cloud_debugger \ --region=asia-east1 \ --num-nodes=1 \ --enable-autoscaling --min-nodes=1 --max-nodes=10 \ --maintenance-window=20:00 \ --machine-type=n1-standard-4 \ --min-cpu-platform="Intel Skylake" \ --enable-ip-alias \ --create-subnetwork="" \ --image-type=UBUNTU \ --node-labels=custom.kubernetes.io/fs-type=xfs $ gcloud container clusters describe demo --region=asia-east1 $ kubectl version Client Version: version.Info{Major:"1", Minor:"13", GitVersion:"v1.13.3", GitCommit:"721bfa751924da8d1680787490c54b9179b1fed0", GitTreeState:"clean", BuildDate:"2019-02-04T04:48:55Z", GoVersion:"go1.11.5", Compiler:"gc", Platform:"darwin/amd64"} Server Version: version.Info{Major:"1", Minor:"11+", GitVersion:"v1.11.5-gke.5", GitCommit:"9aba9c1237d9d2347bef28652b93b1cba3aca6d8", GitTreeState:"clean", BuildDate:"2018-12-11T02:36:50Z", GoVersion:"go1.10.3b4", Compiler:"gc", Platform:"linux/amd64"} $ kubectl get nodes -o wide You can only get a regional cluster by creating a whole new cluster, Google currently won't allow you to turn an existed cluster into a regional one. ref: https://cloud.google.com/sdk/gcloud/reference/container/clusters/create https://cloud.google.com/compute/docs/machine-types https://cloud.google.com/kubernetes-engine/docs/concepts/regional-clusters https://cloud.google.com/kubernetes-engine/docs/how-to/min-cpu-platform https://cloud.google.com/kubernetes-engine/docs/how-to/alias-ips Google Kubernetes Engine clusters running Kubernetes version 1.8+ enable Role-Based Access Control (RBAC) by default. Therefore, you must explicitly provide --enable-legacy-authorization option to disable RBAC. ref: https://cloud.google.com/kubernetes-engine/docs/how-to/role-based-access-control Delete the cluster. After you delete the cluster, you might also need to manually delete persistent disks (under Compute Engine), load balancers (under Network services) and static IPs (under VPC network) which belong to the cluster on Google Cloud Platform Console. $ gcloud container clusters delete demo --region=asia-east1 Create Node Pools Create a cluster with preemptible VMs which are much cheaper than regular instances using --preemptible. You might receive The connection to the server x.x.x.x was refused - did you specify the right host or port? error while upgrading the cluster which includes adding new node pools. $ gcloud container node-pools create n1-standard-4-pre \ --cluster=demo \ --node-version=1.11.6-gke.6 \ --scopes=gke-default,storage-full,compute-ro,pubsub,https://www.googleapis.com/auth/cloud_debugger \ --region=asia-east1 \ --num-nodes=1 \ --enable-autoscaling --min-nodes=1 --max-nodes=10 \ --machine-type=n1-standard-4 \ --min-cpu-platform="Intel Skylake" \ --node-labels=custom.kubernetes.io/scopes-storage-full=true --enable-autorepair \ --preemptible $ gcloud container node-pools list --cluster=demo --region=asia-east1 $ gcloud container operations list ref: https://cloud.google.com/sdk/gcloud/reference/container/node-pools/create https://cloud.google.com/kubernetes-engine/docs/concepts/preemptible-vm https://cloud.google.com/compute/docs/regions-zones/ Build Docker Images You could use Google Cloud Build or any Continuous Integration (CI) service to automatically build Docker images and push them to Google Container Registry. Furthermore, you need to tag your Docker images appropriately with the registry name format: region_name.gcr.io/your_project_id/your_image_name:version. ref: https://cloud.google.com/container-builder/ https://cloud.google.com/container-registry/ An example of cloudbuild.yaml: substitutions: _REPO_NAME: simple-api steps: - id: pull-image name: gcr.io/cloud-builders/docker entrypoint: "/bin/sh" args: [ "-c", "docker pull asia.gcr.io/$PROJECT_ID/$_REPO_NAME:$BRANCH_NAME || true" ] waitFor: [ "-" ] - id: build-image name: gcr.io/cloud-builders/docker args: [ "build", "--cache-from", "asia.gcr.io/$PROJECT_ID/$_REPO_NAME:$BRANCH_NAME", "--label", "git.commit=$SHORT_SHA", "--label", "git.branch=$BRANCH_NAME", "--label", "ci.build-id=$BUILD_ID", "-t", "asia.gcr.io/$PROJECT_ID/$_REPO_NAME:$SHORT_SHA", "simple-api/" ] waitFor: [ "pull-image", ] images: - asia.gcr.io/$PROJECT_ID/$_REPO_NAME:$SHORT_SHA ref: https://cloud.google.com/container-builder/docs/build-config https://cloud.google.com/container-builder/docs/create-custom-build-steps Of course, you could also manually push Docker images to Google Container Registry. $ gcloud auth configure-docker && \ gcloud config set project simple-project-198818 && \ export PROJECT_ID="$(gcloud config get-value project -q)" $ docker build --rm -t asia.gcr.io/${PROJECT_ID}/simple-api:v1 simple-api/ $ gcloud docker -- push asia.gcr.io/${PROJECT_ID}/simple-api:v1 $ gcloud container images list --repository=asia.gcr.io/${PROJECT_ID} ref: https://cloud.google.com/container-registry/docs/pushing-and-pulling Moreover, you should always adopt Multi-Stage builds for your Dockerfiles. FROM python:3.6.8-alpine3.7 AS builder ENV PATH=$PATH:/root/.local/bin ENV PIP_DISABLE_PIP_VERSION_CHECK=1 WORKDIR /usr/src/app/ RUN apk add --no-cache --virtual .build-deps \ build-base \ linux-headers \ openssl-dev \ zlib-dev COPY requirements.txt . RUN pip install --user -r requirements.txt && \ find $(python -m site --user-base) -type f -name "*.pyc" -delete && \ find $(python -m site --user-base) -type f -name "*.pyo" -delete && \ find $(python -m site --user-base) -type d -name "__pycache__" -delete ### FROM python:3.6.8-alpine3.7 ENV PATH=$PATH:/root/.local/bin ENV FLASK_APP=app.py WORKDIR /usr/src/app/ RUN apk add --no-cache --virtual .run-deps \ ca-certificates \ curl \ openssl \ zlib COPY --from=builder /root/.local/ /root/.local/ COPY . . EXPOSE 8000 CMD ["uwsgi", "--ini", "config/uwsgi.ini", "--single-interpreter", "--enable-threads", "--http", ":8000"] ref: https://medium.com/@tonistiigi/advanced-multi-stage-build-patterns-6f741b852fae Create Pods No, you should never create Pods directly which are so-called naked Pods. Use Deployment instead. ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-overview/ Pods have following life cycles (states): Pending Running Succeeded Failed Unknown ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/ Inspect Pods Show information about Pods. $ kubectl get all $ kubectl get deploy $ kubectl get pods $ kubectl get pods -l app=simple-api $ kubectl get pods $ kubectl describe pod simple-api-5bbf4dd4f9-8b4c9 $ kubectl get pod simple-api-5bbf4dd4f9-8b4c9 -o yaml ref: https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#describe https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#get Execute a command in a container. $ kubectl exec -i -t simple-api-5bbf4dd4f9-8b4c9 -- sh ref: https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#exec Tail Pod logs. It is also recommended to use kubetail. $ kubectl logs simple-api-5bbf4dd4f9-8b4c9 -f $ kubectl logs deploy/simple-api -f $ kubectl logs statefulset/mongodb-rs0 -f $ kubetail simple-api $ kubetail simple-worker $ kubetail mongodb-rs0 -c db ref: https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#logs https://github.com/johanhaleby/kubetail List all Pods on a certain node. $ kubectl describe node gke-demo-default-pool-fb33ac26-frkw ... Non-terminated Pods: (7 in total) Namespace Name CPU Requests CPU Limits Memory Requests Memory Limits --------- ---- ------------ ---------- --------------- ------------- default mongodb-rs0-1 2100m (53%) 4 (102%) 4G (30%) 4G (30%) default simple-api-84554476df-w5b5g 500m (25%) 1 (51%) 1G (16%) 1G (16%) default simple-worker-6495b6b74b-rqplv 500m (25%) 1 (51%) 1G (16%) 1G (16%) kube-system fluentd-gcp-v3.0.0-848nq 100m (2%) 0 (0%) 200Mi (1%) 300Mi (2%) kube-system heapster-v1.5.3-6447d67f78-7psb2 138m (3%) 138m (3%) 301856Ki (2%) 301856Ki (2%) kube-system kube-dns-788979dc8f-5zvfk 260m (6%) 0 (0%) 110Mi (0%) 170Mi (1%) kube-system kube-proxy-gke-demo-default-pool-3c058fcf-x7cv 100m (2%) 0 (0%) 0 (0%) 0 (0%) ... $ kubectl get pods --all-namespaces -o wide --sort-by="{.spec.nodeName}" Check resource usage. $ kubectl top pods $ kubectl top nodes ref: https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#top https://kubernetes.io/docs/tasks/debug-application-cluster/ Restart Pods. # you could simply kill Pods which would restart automatically if your Pods are managed by any Deployment $ kubectl delete pods -l app=simple-worker # you could replace a resource by providing a manifest $ kubectl replace --force -f simple-api/ ref: https://stackoverflow.com/questions/40259178/how-to-restart-kubernetes-pods Completely delete resources. $ kubectl delete -f simple-api/ -R $ kubectl delete deploy simple-api $ kubectl delete deploy -l app=simple,role=worker # delete a Pod forcefully $ kubectl delete pod simple-api-668d465985-886h5 --grace-period=0 --force $ kubectl delete deploy simple-api --grace-period=0 --force # delete all resources under a namespace $ kubectl delete daemonsets,deployments,services,statefulset,pvc,pv --all --namespace tick ref: https://kubernetes.io/docs/reference/generated/kubectl/kubectl-commands#delete Create ConfigMaps Create an environment-variable-like ConfigMap. kind: ConfigMap apiVersion: v1 metadata: name: simple-api data: FLASK_ENV: production MONGODB_URL: mongodb://mongodb-rs0-0.mongodb-rs0.default.svc.cluster.local,mongodb-rs0-1.mongodb-rs0.default.svc.cluster.local,mongodb-rs0-3.mongodb-rs0.default.svc.cluster.local/demo?readPreference=secondaryPreferred&maxPoolSize=10 CACHE_URL: redis://redis-cache.default.svc.cluster.local/0 CELERY_BROKER_URL: redis://redis-broker.default.svc.cluster.local/0 CELERY_RESULT_BACKEND: redis://redis-broker.default.svc.cluster.local/1 Load environment variables from a ConfigMap: kind: Deployment apiVersion: apps/v1 metadata: name: simple-api labels: app: simple-api spec: replicas: 1 selector: matchLabels: app: simple-api template: metadata: labels: app: simple-api spec: containers: - name: simple-api image: asia.gcr.io/simple-project-198818/simple-api:4fc4199 command: ["uwsgi", "--ini", "config/uwsgi.ini", "--single-interpreter", "--enable-threads", "--http", ":8000"] envFrom: - configMapRef: name: simple-api ports: - containerPort: 8000 Create a file-like ConfigMap. kind: ConfigMap apiVersion: v1 metadata: name: redis-cache data: redis.conf: |- maxmemory-policy allkeys-lfu appendonly no save "" Mount files from a ConfigMap: kind: Deployment apiVersion: apps/v1 metadata: name: redis-cache labels: app: redis-cache spec: replicas: 1 selector: matchLabels: app: redis-cache template: metadata: lab'''
