full_description = "電玩生涯：PC Games‧SRPG Posted on 2007/07/102013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 我所謂的 SRPG 就是那種「走格子」的回合制策略模擬遊戲（戰棋遊戲）。 我超愛走格子的～ ...... 我知道，上一篇 已經是很久以前的事了～ ===== SRPG：策略角色扮演 ===== 【超時空英雄傳說 2 ～ 復仇魔神】 【超時空英雄傳說 2 外傳 ～ 北方密使】 這個系列的遊戲最出名的除了它的「轉職系統」之外，就是劇情上的「多重路線」：在許多的關卡中，會出現「對話選項」或根據不同的勝利條件使得劇情上出現分歧，進入不同的關卡，就像這個「簡易攻略」。雖然「多重路線」這種東西在現在已經不算什麼了，但是，在 1997 年的那個時代，這可是對台灣玩家（我是在說我自己）的一項衝擊性創舉啊～ 以前玩遊戲都只是照著劇情走，走到那一關就殺光那一關的敵人，很少有能夠讓玩家自己決定關卡走向的，雖然大體的劇情還是差不多，但是走不同的關卡就會遇到不同的敵人，拿到不同的武器、裝備，所以一套遊戲都得玩它個三、四遍才過癮～ 雖然遊戲中有大量的「劍與魔法」的奇幻設定，但是，它的故事背景可是非常「科幻」的（我超愛科幻的）～ 從一代的「震旦星人的高科技戰艦墜毀在科隆多星球」、二代「明錫島的震旦主控室」到外傳的「最後大魔王根本就是外星人」，尤其是外傳，除了那些魔法、騎士、精靈之類的東西之外，應是安插了很多「高科技裝備」，像是「穿甲飛彈」「反引力滑靴」「質子護盔」之類的，敵人手上拿的是弓箭，而我們卻在用「光線槍」轟它，整個就很詭異啊～ 「超時空英雄傳說」系列還有另一個特點，就是「主角的職業一定是劍士」（雖然可以轉職成其他職業）。不過，這一點似乎是國產遊戲的通例，幾乎九成九的國產遊戲的主角的武器都是劍（連之前介紹的有科幻背景的「墮落天使」的主角都是拿劍，還是光劍......），不知道是不是受了武俠小說的「俠客」形象的影響，一定要拿把劍才顯得正氣凜然。所以說，如果你的武器是「金背大砍刀」「宣化板斧」「魚尾雙鋒鉤」這類的鬼玩意兒的話，你這輩子都當不成主角的～ 不過，好像很多國外的遊戲的主角也都是拿劍...... 我在玩這種要操作很多角色的戰棋遊戲時，有一個怪癖，那就是「主角一定要是隊伍裡最強的人」！「超時空英雄傳說」系列的主角（二代：彥清風；外傳：白志超 ）的職業都是 劍士，在《超》的世界裡，劍士雖然會一些很強的劍術，但是，攻擊力通常都不會比戰士高（等級相同的情況下），所以，每次看到 白志超 的攻擊力比 艾文 低的時候，就讓我很不爽，然後拼了命地把 白志超 的等級練得很高，所以當其他人還在第二級職業時，白志超 已經是劍宗了～ 有玩過這兩套遊戲的人一定都知道，最強的劍法不是「霸邪劍法」也不是「雪山飛劍」，而是「乾坤劍法」啊～ 霸邪劍法 雖然是全畫面的招式，但是卻是敵我皆傷，由攻擊力和劍術都高得嚇人的主角使出來，一招就可以讓敵人全死光，但是我方的夥伴也都跟著掛了...... 雪山飛劍 在攻略本中的評價雖然是 A，但是範圍只有 3 x 3 而已，而 乾坤劍法 的威力跟 雪山飛劍 差不多，招式的範圍卻是 9 x 9，主角使出來幾乎都是一擊必殺的，白志超就靠這一招打通關～ 這裡有一代到外傳的故事設定，不過劇情洩漏得很大，點進去前要三思啊～ 至於那個三代「超時空英雄傳說 3 ～ 狂神降世」就不想提了，讓我很失望啊...... 最讓我不能接受的是，三代把 乾坤劍法 改得很弱啊...... 應該說是所有的魔法、招式都被改弱了，玩到最後，幾乎都是在打肉搏戰，魔法什麼的根本派不上用場，三代把招式分散到每個職業的專屬技能裡，是大敗筆啊！所幸後期有超好用的「幻影傭兵」的加入，不然我真的會玩不下去，我破了一次之後就不想再動這款遊戲了...... >---------------------------------------------------------< 【炎龍騎士團 2 ～ 黃金城之謎】 炎龍騎士團 2 是我接觸的第一款 SRPG。跟「超時空英雄傳說」一樣，在「劍與魔法」的包裝下，骨子裡還是科幻啊～ 玩家在一開始看到與女主角 悠妮 一起出現的機器人「蓋亞」的時候，應該就已經明瞭了，以下節錄自 網站 裡的描述： 黃金城原是古代人所創造要防制地面的要塞，後來古代人在一次大戰中因各種最終武器的使用，使得整個世界趨於毀滅，而大多數的古代人都死了，少部分則逃到外太空去了。 而悠妮並不是一個普通的「人」，她是古代人用人類和機械相結合而製造出來的生化合成人，她和最終 BOSS 空魔神並稱為黃金城裏的「中樞」，是這黃金城的兩大指揮官，具有永生的能力。空魔神負責戰鬥方面的事，悠妮則負責行政之事宜。當時古代人開戰時下令黃金城以其最終武器毀滅該地區所有生命體，但稍後似有微弱的訊息通知黃金城終止一切行動並進入睡眠的狀態。 本來一直沉睡著的他們，某日因不名原因而驚醒，發現地表上有了生命的跡象，空魔神執意要按照沉睡前接受的命令，實行「審判之炎」毀滅該地區所有的生命體。悠妮則認為戰爭已經過去了，堅決反對空魔神的做法。在二人爭奪至關重要的電腦單元晶片時，悠妮從黃金城掉落，然後在羅特帝亞王城的後山遇到了索爾。由於落地時強烈的撞擊，悠妮部分線路受損，喪失了記憶。索爾對悠妮一見傾心，便陪伴她展開了一場宏大的冒險之旅。 我超愛這種「古代文明反而是超高科技」的設定，就像漫畫「聖魔之血（目前出到第七集）」「驅魔少年（目前出到第十集）」「風之谷」和「BLAME」，還有一個類似的用「武俠」「神怪」來包裝的科幻漫畫：陳某 的「充神榜（全五冊）」，雖然 充神榜 說是完結篇了，但是，陳某自己都說 充神榜 其實是未完成的作品，希望可以在「火鳳燎原」完結之後繼續畫完 充神榜。 因為我實在太喜歡這部漫畫了，忍不住岔題說一下： 充神榜 的時代背景是設定在「唐朝」（就是西遊記的那個時代），雖然一開始的故事是兩個「道士」在荒涼的客棧中遇到了吸血妖怪，在死了不少無辜的村民之後，真相大白，「鬼獸」「幽都人」「桃都人」的名詞相繼出現，「齊天大聖」乘著「飛碟」（不要懷疑，就是外星人的那個）登場。故事從第二集開始有趣了，一對祖孫從蒙古跋山涉水到「不死樹」神宮求醫，神宮主人名叫「吳剛」，他和踩著飛行器的仙女聯手治好了來求醫的眾人，Blah Blah Blah，那都不是重點，重點是： 幽都人其實是一個擁有先進科技的外星種族（至少能夠進行「星際旅行」），地球是他們的「牧場」，而「龍」則是他們的食物。後來因為地球進入冰河時期，為了節省食物，幽都人把部份的族人的體型縮得很小很小，同時又製造了第二種食物「人」。經過了很久，被改造過的幽都人的外型變得跟人很像，而某些幽都人甚至選擇跟人混種並戒除吸血的天性，是為「桃都人」。三千年前，幽都人在黃河之北發現了租先所遺留的「盤古石」，石內記載：「盤古回歸 ── 族眾需回復龍身始能順利回歸，享受永生之樂。回復龍身必造『鬼獸』，鬼獸需借助『人』身成長，並以人為飼，五年成形自和族眾融合，合身成『原種幽都人』。」 第五集的故事進行到桃都城（桃都人的會隱形的移動堡壘）的現身，在桃都人「比沙門」的幫助下，用「桃都大砲」轟掉了擁有「三千年不敗威名」的「原種幽都人 秦洪海」...... 短短五冊而已，但是過癮到爆啊～ 只可惜陳某自己把這部漫畫腰斬了...... 好了，可以回來說「炎龍騎士團 2」了～ 上面這個圖就是炎二的遊戲畫面，雖然人物都是矮不隆咚的，而且對話時候的「滴滴聲」聽久了其實還挺吵的，但是，戰鬥時的畫面亂有魄力的啊～ 每個角色的攻擊畫面都很讚，我還記得後期會有「武聖」卡里斯（應該是吧？）加入，他的攻擊方式就是一招「龜派氣功」朝敵人打過去，很帥啊～ 不過威力很弱就是了...... 右邊那個拿著劍很豪邁地砍下去的傢伙就是主角「索爾」，應該已經轉職成「英雄」了，不過我也不確定，我玩這款遊戲已經是八百年前的事了，好像還比「金庸群俠傳」早。 寫到這裡，我又忍不住想重玩了～ >---------------------------------------------------------< 【神奇傳說】 這款遊戲是 TGL（日商帝技爺如。好像已經倒掉了，在台灣的分公司還被智冠併下來了......）製作的，雖然 神奇傳說 的發售時間跟上面幾款遊戲差不了幾年，但是，它的畫面的精緻程度卻是國產不能比的啊～ 神奇傳說 當初讓我印象深刻的除了畫面之外，就是「每個角色的攻擊動作會隨著武器的不同而改變」，一開始主角「雷龍」（真的就叫 雷龍）的攻擊可能就只是拿劍劈一下而已，但是到中後期，取得強力的武器之後，還會出現那種跳到空中再一刀砍下來的動作。每個角色還有專屬的魔法，除了那些全範圍的高等屬性魔法之外，我還記得主角有很多招式都是「中看不中用」，他有一個「把整個畫面斬成兩半」的招式，就是連地形什麼的都會被切成兩半，雖然只是招式的特效而已，但是怎麼看怎麼威啊～ 不過敵人還是死不了...... 這個遊戲最「陰險」的地方：在打到最後一關（Stage 25）時，把很弱的魔王「鐵拉保克」擊倒之後，遊戲就結束了。結局動畫、工作人員名單跑完之後，遊戲會讓玩家存檔，然後就自動退出遊戲。嗯，因為我想再回味一下遊戲，所以又進入遊戲，讀取了最後那個「破關存檔」，結果，幹，還有第 26 關啊！？「甌菲莉亞」與「T‧T」來找主角，說是什麼古塔內又出現了不少魔物，和其他夥伴們重新集合之後，又不明不白地在「地獄塔」內打了 25 關。最後在「兒子殺死老爸」的人倫悲劇之下，終於破關了～ 杜勝利 攻略專頁：神奇傳說 劇情攻略 >-------------------------------------------------------------< 電玩生涯：PC Games．RPG PC Games．ACT PC Games．SRPG PC Games．SIM Online Games TV Games．PS2 Tagged: PC Games下載電玩電玩生涯"
