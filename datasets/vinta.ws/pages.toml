full_description = "軟體工程師的鄙視鏈（程序员的鄙视链） Posted on 2014/12/122015/08/18Author VintaPosted in 在網誌裡鬼扯才是正經事 最近這幾年在世界各地突然吹起了一股全民寫程式的風潮，連美國總統歐巴馬都在寫 JavaScript 了，但是身為一介靠寫程式（以及在上班時間胡亂上網）來謀生的 developer（所謂的 developer 就是「軟體工程師」的比較潮的說法），想要提醒那些想學習寫程式的人一件重要的事：慎選你的第一個程式語言。 在軟體工程師（中國叫做「程序員」或「碼農」）的圈子裡，文人相輕的現象可是非常嚴重的，在程式設計的各個領域裡都有著錯綜複雜的「鄙視鍊」。從程式語言、編輯器、平台到 { 是寫在 if 的同一行還是下一行，不同陣營的人都習慣鄙視來鄙視去。而其中「你用什麼程式語言？」更是大家最熱衷的一條鄙視鍊，所以對於剛踏入程式設計領域的初學者來說，萬一程式語言選得不好，可是會一開始就落入鄙視鍊的底層啊。 軟體工程師的鄙視鏈到底有多慘烈、多殘酷呢？ 程式語言篇 懂 Functional Programming 的工程師鄙視老是把設計模式掛在嘴邊的工程師，老是把設計模式掛在嘴邊的工程師鄙視會說「你這樣寫就不 OO 了啊」的工程師，會說「你這樣寫就不 OO 了啊」的工程師鄙視會說「蛤？什麼物件導向？不是把重複的 code 寫成一個 function 就好了嗎？」的工程師，會說「蛤？什麼物件導向？不是把重複的 code 寫成一個 function 就好了嗎？」的工程師鄙視把同一段 code 到處複製貼上的工程師，把同一段 code 到處複製貼上的工程師鄙視 PM。 寫靜態語言的工程師鄙視寫動態語言的工程師。 寫組合語言的工程師鄙視寫 C 語言的工程師，C 語言工程師鄙視 C++ 工程師，C++ 工程師鄙視 Java 和 C# 工程師，Java 工程師和 C# 工程師則互相鄙視，而 C# 工程師又鄙視 Visual Basic 工程師和會把 C# 唸成「C 井」的工程師，會把 C# 唸成「C 井」的工程師則鄙視認為 HTML 是一種程式語言的設計師。 用 Python 3 的工程師鄙視還在用 Python 2 的工程師，用 Python 2 的工程師鄙視遇到 UnicodeEncodeError 的工程師。 寫 iOS 的工程師鄙視寫 Android 的工程師，寫 Android 的工程師鄙視寫 Windows Phone 的工程師。 有 Swift 一年經驗的工程師鄙視有 Objective-C 五年經驗的工程師，寫 Objective-C 的工程師鄙視用 PhoneGap 包裝成 native app 的工程師。 用 React.js 的工程師鄙視用 AngularJS 的工程師，用 AngularJS 的工程師鄙視用 jQuery 的工程師，用 jQuery 的工程師鄙視用 Vanilla JavaScript 的工程師，用 Vanilla JavaScript 的工程師鄙視 IE 的使用者。 會用 debugger 的工程師鄙視用 assert 的工程師，用 assert 的工程師鄙視只會 print() 的工程師；用 console.log() 來 debug 的工程師鄙視用 alert() 來 debug 的工程師。 寫 Ruby on Rails 的工程師鄙視所有使用其他語言的工程師。 什麼？你說 Ruby？Ruby 只是 Ruby on Rails 的一套框架，才不是什麼程式語言呢！ 所有的工程師都鄙視 PHP 工程師。 工具篇 Read More"
