full_description = "問卷調查：我的朋友都在發情 Posted on 2007/12/052009/09/21Author VintaPosted in 其實我小時候的志向是成為詩人 問卷描述：難道你就沒有別的話要對我說了嗎？ 填寫期限：在販售迷戀的那段時光裡 一、電話後深切反省症候群 是 否 ﹍ ﹍ 01. 裸露的左手腕著實令我焦慮 ﹍ ﹍ 02. 面對薔薇與太空船的話題會吊詭地感到歡愉 ﹍ ﹍ 03. 失去焦距的憂愁僅僅濃郁了猜忌 ﹍ ﹍ 04. 自白說：因為認識了一名菸草商導致性格異常堅忍 ﹍ ﹍ 05. 親愛的，也因為妳是一個受歡迎的人 ﹍ ﹍ 06. 只要暫緩嫉妒酩酊之後依舊會是一種狂喜 ﹍ ﹍ 07. 雙頰憤憤地好似一枚柳橙 ﹍ ﹍ 08. 非關乎思想的顏色 ﹍ ﹍ 09. 據說咬指甲可以抑制性慾但只適用豐腴的體型 ﹍ ﹍ 10. 結論：任一個持有橘色鑰匙圈的女子皆喜愛正直的男性 ﹍ ﹍ 11. 小路亂狀 ﹍ ﹍ 12. 而我的朋友都在發情 Read More 神經質以及週末型的自言自語 Posted on 2007/09/202008/11/29Author VintaPosted in 其實我小時候的志向是成為詩人 專輯：神經質以及週末型的自言自語 演唱：偏見鬼 發行：同樣都是吶喊，為什麼妳會在第一個音節上揚？ 製作：少來了你這個裝模作樣的爛屁眼 售價：20 元 【曲目】 CD1 01. 總是每一首歌都寫著愛情、愛情與愛情 02. 無論如何地愉悅怎麼地憂愁也不過就是死掉 03. 速成豁達之術 04. 我想要一台霜淇淋機、濫殺無辜並在她們的屍體上喊著：老子買東西從來沒有殺過價 05. 可以請你們通通都滾開嗎？ 06. 喂！誰告訴你說我喜歡綠色啊！？ 07. 搖滾樂可以改變世界嗎？我們可以試著把麥克風捅進大便裡 08. 密朗特．羅依沙德與他最愛的橘色藥丸。我的初戀情人也自殺了 09. 偶爾也得悲傷一下，才不會突然同理起旁人的卑微 10. 詩人的第一本詩集一定要是自費出版 CD2 Read More"
