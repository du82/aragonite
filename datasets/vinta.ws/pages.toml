full_description = "電玩生涯：PC Games．RPG Posted on 2007/04/272013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 我在寫「讀書與買書的 22 個問題」的時候，寫到一半就很詭異地離題，變成在談電玩...... 所以，乾脆就獨立出一篇來專門談談我從小到大玩過的電玩好了～ 我這輩子玩的第一款電腦遊戲是「超級快打旋風 2」（還是我爸買給我的），是的，是「電腦遊戲」。也大概就是從那時候開始，我注定了這輩子跟格鬥遊戲無緣：我曾經很努力地嘗試過，所以能夠用的角色我都用過了，沒有一隻可以讓我連贏三場以上...... 所以，我從來沒有跟「豪鬼」打過，因為我根本玩不到那麼後面啊～ 而且，每個角色不是都有所謂的「超必殺技」嗎？就拿龍來說，他的超必殺技是「真空波動拳」（就是用出來之後，角色的動作會出現殘影），我敢說，所有角色的超必殺技沒有一個我有按出來過...... 我覺得，我在玩格鬥遊戲的時候跟一個智障沒兩樣。 玩動作遊戲的時候就不會～ ===== RPG：角色扮演 ===== 提到電玩，當然就要從「遊戲類型之王：RPG，角色扮演」開始談了～ RPG 我幾乎都是玩國產的。 雖然很多國外的經典大作也都有中文版的發行，但是，不知道為什麼，我就是比較喜歡玩國產的 RPG 啊～ 不過，現在的國產遊戲真的沒幾套可以玩了，就連「軒轅劍」（四代以後）和「仙劍奇俠傳」（二代以後）出新作的時候，我也都是 含淚 在支持的...... 所幸還有「幻想三國誌」～ 我的第一套 RPG 就是經典到爆的【金庸群俠傳】（單機版的那個）。 [MEDIA=66] Read More"
