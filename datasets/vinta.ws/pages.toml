full_description = "神經質以及週末型的自言自語 Posted on 2007/09/202008/11/29Author VintaPosted in 其實我小時候的志向是成為詩人 專輯：神經質以及週末型的自言自語 演唱：偏見鬼 發行：同樣都是吶喊，為什麼妳會在第一個音節上揚？ 製作：少來了你這個裝模作樣的爛屁眼 售價：20 元 【曲目】 CD1 01. 總是每一首歌都寫著愛情、愛情與愛情 02. 無論如何地愉悅怎麼地憂愁也不過就是死掉 03. 速成豁達之術 04. 我想要一台霜淇淋機、濫殺無辜並在她們的屍體上喊著：老子買東西從來沒有殺過價 05. 可以請你們通通都滾開嗎？ 06. 喂！誰告訴你說我喜歡綠色啊！？ 07. 搖滾樂可以改變世界嗎？我們可以試著把麥克風捅進大便裡 08. 密朗特．羅依沙德與他最愛的橘色藥丸。我的初戀情人也自殺了 09. 偶爾也得悲傷一下，才不會突然同理起旁人的卑微 10. 詩人的第一本詩集一定要是自費出版 CD2 01. 除了活著，你究竟還擅長什麼？ 02. 我並不是在發情 03. 有沒有一種談論存在而不顯得矯情的語調？ 04. 其實我一點都不愛這個國家，而且，我也沒有夢想 05. 完全不好笑呢 06. 我有那麼一些些後悔我沒有寫日記，不過，只有一些些 07. 你為什麼要抽菸？因為我想得肺癌。聽說，喝酒容易臉紅的人也容易得癌症 08. 我目前為止的人生順遂到可怕 09. 為什麼耶和華老是要拿這些瑣碎的事兒來煩我？阿們 10. 對於人生總是總是沒有想法，沒有關係，可以複製再貼上 【筆記】 其實我不是那麼確定我究竟要說些什麼而問題的關鍵似乎也不是我想說些什麼而是有一天我看完恐怖片回家的途中突然覺得我是不是應該說些什麼才不會讓別人覺得我像個笨蛋似地只會傻傻大啖著那碗紅燒牛肉麵呃不過真正令我感到難堪的是沒想到我根本沒有那麼多話想說這是否就代表著我腦子裡其實沒有什麼值得賣弄的事物？吃大便吧我是絕對不可能會承認的我有想過不然乾脆假裝自己其實可以很豁達什麼十年後與宇宙的高度但是我到現在還是覺得是屁話又如果跟那些假掰的知識份子一樣談論著生存、時間、耽溺、死亡以及噢譬如說全球之聲之類的玩意兒或許有人會說那不是什麼玩意兒那是一件正經事但是總的來說如果我們不知道也不想知道如何駕駛直升機那我們又為什麼去了解伊朗的政治屠殺？你信神嗎？嗯那其實也不重要你總會遭遇到你需要信神的處境我是說最近除了開始有找份工作的念頭之外對於所有的言論都被相當認真地看待這件事我其實感到困擾我說你們根本就不懂所謂的幽默感如果沒有惡意就一點都不崇高了我們不可以像好萊塢的製片家一樣總把拯救世界的任務交給一個性生活放蕩的金髮鬼佬所以我也討厭愛上別人當然我得先搞清楚我到底知不知道什麼叫做愛情我曾經在一卷黑色的衛生紙上寫著：我這輩子最自豪的一件事是我從來沒有真正生氣或者是憤怒過喔但是我常常感到不耐煩有人說是因為難堪而引起的則問題又來了究竟我無時無刻在為什麼事什麼人感到難堪呢？其實我每隔五秒鐘就會想對身旁的人大喊「滾開啊」之類的似乎不太有禮貌的句子因為我並不喜愛說話話說我不喜歡的東西還挺多的但是這其實不是我的問題說到底是因為這個世界實在是太無趣了呀就像是不管什麼時候妳問我「你好嗎？」我永遠都只會回答「還好」你難過嗎？還好。你快樂嗎？還好。你喜歡我嗎？還好。噯不要一直問我諸如你以後打算往什麼領域發展之類的鬼問題吼我他媽的現在怎麼可能會知道我以後究竟要幹什麼啊你活了大半輩子難道就能徹底地解決對於生存上的焦慮與行走時的空虛嗎？你到底知不知道你究竟想要一個什麼樣的人生？而且幹我覺得我的台語越講越爛了怎麼辦都是那個糟糕透了的台北害的哼我不得不承認我開始有一點愛上台北這個城市但是始終還是仍舊討厭台北人算了那不重要接著說是其實沒有什麼事是真正重要的比如說成就、高潮、自我認同或是身體健康之類的噢可是那些事情真的一點都不重要嘛當然那也是屁話重點是當我不說話一副若有所思樣子的時候其實我總是在大腸裡咒罵著某個人尤其是去到那種有養貓的餐廳時那幅情景誠然會令我崩潰的我好想養貓喔也只想養貓但是我並不喜歡直耳朵的品種因為我總是不在家所以我媽就把那位來自蘇格蘭的毛茸茸小姐送走了唉我記得有一年的生日願望是「希望植物人先生自己醒來把那些什麼牌子的呼吸器通通拔掉吧」為什麼我會突然提到這個因為現在我身旁一直有兩個小騷貨在談論她們的生日禮物哪然後她們又說起了夢想之類的事兒呿我其實不覺得人生中有什麼事情是一定要去做的就是那些人老是在說的「意義」那種玩意為什麼任何事都得要有意義呢？那你知道你存在的意義嗎？但是我現在遇到了一個窘境：我不知道應該如何做結尾如果真的用了驚嘆號卻又顯得造作總之我覺得那個女人一定擅長於某種修辭法則懂得什麼爵士的粗糙的淡紫色的詩意第一次除了夏小姐之外也有那種瘋狂的依存關係對於過著什麼樣的生活其實不感興趣我只是很喜歡那些綠色的字體即使我買了一個民族風的口罩每次騎車的時候都想著要戴上但是一打開座椅就忘記了而且我尤其擁有兩次在等紅燈時閱讀的經驗不悅地都是關於全球暖化的事如果能在有生之年見着世界末日其實也不全然屬於壞事 有一天 當我看完半夜重播的新聞之後 嗯 我決定了 將來我也要像她那樣死掉 搞了半天 你還是什麼都不懂嘛 Tagged: 人生偏見現代詩"
