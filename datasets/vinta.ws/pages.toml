["https://vinta.ws/blog/536"]
title = "「小確幸」與「大幹八」 – 真．他媽的"
description = """
不知道從什麼時候開始，突然很流行「小確幸」這個說法，有人考證是出自村上春樹的一篇散文（我突然想到，「村上春樹之於文藝青年」是不是類似「李登輝之於台獨份子」？我們可以說「村上春樹就是文青界的李登輝」嗎哈哈哈？），字面上的意思是指生活中那些「微小但確切的幸福」，例如： 
 

在悠閒的週日午後讀了一本好書。
 

貓咪在自己的懷裡睡著了。
 

爸爸、媽媽的一個愛的擁抱。
 

午餐的時候點了一碗貢丸湯，老闆多給了一顆貢丸。
 

在廁所外面撿到了冷豔女上司從包包裡掉出來的 20 段變頻無線跳蛋的遙控器。 
 
不過，如果你他媽的每天都加班到半夜十一點才回家（而且"""
full_description = "「小確幸」與「大幹八」 Posted on 2012/09/212012/09/21Author VintaPosted in 假裝沒有惡意 不知道從什麼時候開始，突然很流行「小確幸」這個說法，有人考證是出自村上春樹的一篇散文（我突然想到，「村上春樹之於文藝青年」是不是類似「李登輝之於台獨份子」？我們可以說「村上春樹就是文青界的李登輝」嗎哈哈哈？），字面上的意思是指生活中那些「微小但確切的幸福」，例如： 在悠閒的週日午後讀了一本好書。 貓咪在自己的懷裡睡著了。 爸爸、媽媽的一個愛的擁抱。 午餐的時候點了一碗貢丸湯，老闆多給了一顆貢丸。 在廁所外面撿到了冷豔女上司從包包裡掉出來的 20 段變頻無線跳蛋的遙控器。 不過，如果你他媽的每天都加班到半夜十一點才回家（而且沒有加班費！），到家後從冰箱拿出昨天沒吃完的披薩放進微波爐加熱，難道你會看著那塊在微波爐裡旋轉的披薩然後忍不住說「唉油好幸福喔」？不會嘛！你只會在陽台一邊抽著菸一邊想著「幹你娘拎北會不會過勞死啊？！」「是不是該找個時間去做健康檢查？可是 Redmine 上面還有一堆票要處理，算了，等一下洗完澡再多解幾個 issues 好了。」 說到底，明明每天遭遇的都不是什麼「微小但確切的幸福」而是「壓力很大只想罵幹你娘的機八人事物」啊！簡稱「大幹八」，那什麼樣的事情叫做大幹八？比如說： 當老闆問你「為什麼今天晚了 10 分鐘才到公司？」的時候，你可能就會在心裡靠北說「幹你怎麼不問我為什麼昨天晚了 2 個小時才下班？！」因為就是有那種每次都在下班前才說要 meeting 的老闆啊！然後開了兩個小時的會議，最後的結論是「你們晚上回去再仔細研究一下，我們明天早上在決定要怎麼做。」如果明天早上才要做決策，那我們剛剛是在開同樂會嗎？！ 再舉幾個例子： 對台灣人來說，馬英九是我們的大幹八。 對馬英九來說，吳敦義是他的大幹八。 對精明的台灣老闆來說，底下的每個任勞任怨的員工都是他的小確幸。 對日擲千金也面不改色談到加薪就面如土色的雇主來說，「上班打卡制，下班責任制」是他們的小確幸。 對過街老鼠人人喊打的台灣年輕人來說，整個社會都是他們的大幹八。 對 iOS 6 的用戶來說，Apple Maps 是他們的大幹八。 對 Samsung 來說，Apple 是它的小確幸。 對記者來說，YouTube 和 PTT 是他們的小確幸。 對艾涅爾來說，魯夫是他的大幹八。 對佛地魔來說，哈利波特是他的大幹八。 對宣稱「HTC 是中國人的品牌」的女企業家來說，iPhone 5 是她的大幹八。而那些可愛的台灣人是她的小確幸。 對剛出社會的上班族來說，女友神色凝重地說月經好幾個禮拜沒來了是大幹八，後來發現其實是因為作息太不正常導致內分泌失調則是小確幸了。 對中國政府來說，網際網路是它的大幹八。而那些「民族主義蠢貨」應該就是它的小確幸了。 最後，希望大家都可以在職場中「絕頂升天」，共勉之。 Tagged: 大幹八小確幸工作"
