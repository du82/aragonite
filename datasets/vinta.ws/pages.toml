title = "專攻「小眾路線」的部落格小貼紙 – 真．他媽的"
description = """
更新日期：2008.9.6

 

如果你的小貼紙無法顯示，請換上新的語法。

 

所謂的「部落格小貼紙」指的是類似這樣的東西 >> 

可能是 很多人 使用的網站 >> 

或許是 很多人 認同的串聯活動 >> 

也可能是 很多人 參與的某種同盟或聯播 >> 

 

但是，上面的這些小貼紙終究都太「大眾化」了。

 

如果你屬於某個更「小眾」的族群的話，比如說：你是「喜歡 69 式的雙性戀者 」、「四十歲了還跟媽媽拿錢」、「從小到大暗戀的女生的座號都是 26」或「小時候蒐集過龍劭華的限量閃卡」這樣的 族群 的話，很可惜，是沒有小貼紙可以"""
full_description = "專攻「小眾路線」的部落格小貼紙 Posted on 2009/09/102019/10/04Author VintaPosted in 假裝沒有惡意 更新日期：2008.9.6 如果你的小貼紙無法顯示，請換上新的語法。 所謂的「部落格小貼紙」指的是類似這樣的東西 >> 可能是 很多人 使用的網站 >> 或許是 很多人 認同的串聯活動 >> 也可能是 很多人 參與的某種同盟或聯播 >> 但是，上面的這些小貼紙終究都太「大眾化」了。 如果你屬於某個更「小眾」的族群的話，比如說：你是「喜歡 69 式的雙性戀者 」、「四十歲了還跟媽媽拿錢」、「從小到大暗戀的女生的座號都是 26」或「小時候蒐集過龍劭華的限量閃卡」這樣的 族群 的話，很可惜，是沒有小貼紙可以貼的！ 但是，別擔心。 要貼小貼紙，我們自己做一個就是了～ 以下就是我所製作的「小眾貼紙」： P.S. 既然都已經決定走「小眾路線」了，小貼紙的大小當然不可以是 80 x 15 這種主流格式，我設計的都是 90 x 20 以上的大小。 我是│雙性戀 → 雙性戀者有福了！你／妳也有小貼紙可以貼了！ 同志│我是零號 同志│我是一號 我有│台中腔 → 我承認，這個的確不算是那麼小眾 我有│痔瘡 我有│先天性海綿體充血不能症 我有│精蟲習慣性死在衛生紙症候群 我愛│小胸部的女人 我愛│白虎 我愛│鱈魚香絲 鍾愛│有乳毛的男人 → 我有乳毛～ 閃卡│我有一九九六年的龍劭華 手相│我的事業線有九公分 → 如果是七公分就不能貼這張小貼紙了...... 童年│我是楊宗緯小學二年級的風紀股長 → 風紀股長專屬，班長、副班長都不能用 鄰居│周杰倫住我家隔壁 → 這是只有周杰倫的鄰居才可以用的小貼紙 痣│上面有長毛 → 我們班就有一個傢伙的痣有長毛，真想叫他去演道士～ 乳頭│粉紅色的 睪丸│籃球一樣大 小弟弟│習慣擺左邊 → 擺右邊的人不能貼 手機號碼之和│36 → 如果手機號碼是 0919506425 手機號碼之和│36 → 那就是 0 + 9 + 1 + 9 + 5 + 0 + 6 + 4 + 2 + 5 = 36 身高│174.3cm → 小眾到不行，要剛剛好是這個身高才可以貼 體重│61.8kg 生辰│21 時 44 分 → 不會比這個更小眾的了 援交│可以走後門 → 不知道為什麼，在我的部落格常常收到 援交少女 的留言 援交│可以走後門 → 有不少人都特地強調她們可以允許客人「走後門」...... 援交│可以走後門 → 這張小貼紙非常適合讓她們貼在自己的部落格上 正妹│請跟我交往 → 每個阿宅都貼一個好了 女王│請蹂躪我 → 在玩 SM 的時候就可以貼這個小貼紙了 台北│正妹太多 → 詳見：我討厭台北的十大原因，那些留言的台北人還真小題大作 自慰│一個人玩大老二 → 當你在打槍的時候，可以貼一個在部落格～ 教授│不要這樣 幹│微積分被當掉了 → 結果，我被當的是「體育」啊～ 夢遺│今天又要洗被單了 閃開│讓專業的來 潮吹│我要加速了 → 有圖有真相，十八禁！ 下面│癢死了 火狐│我偏偏要用 IE 積分│有沒有那麼多東西可以積？ 阿魯巴│蛋蛋的哀傷 梗│跟老二一樣重要 A 片│通通放在 D 槽 → 延伸閱讀：色情廣告信件的標題...... 2007.6.21 UPDATE ! ! ! 真│他媽的 施主│這個問題應該要問你自己 跨領域│大風吹達人 向井│巧克力球 → 他是個 AV 男優，因為 兩顆睪丸黑黑的 而得名...... 加藤鷹│黃金手指 → 身高 180cm，體重 68.0kg，陰莖勃起時長度 17cm...... 周伯通│左右互搏之術 日本人│通通都是變態 → 而且都怪怪的：唄．鼠先輩 三位一體│窄裙‧絲襪‧高跟鞋 2007.7.3 UPDATE ! ! ! 我要去│野台開唱 → 詳見：望「野台開唱」成全，貼紙告白法 我要去│海洋音樂祭 拔出來│不可以射在裡面 王八蛋│不要把車停在我家門口 王八蛋│等到考完才發考古題 這是命│別人無名的好友列表裡，都是正妹 愛台灣│所以我的英文很爛 → 我超愛台灣的 假 ABC│崇洋媚外 真 ABC│有種不要回來台灣 起床│我今天早上又被自己帥醒了 廣告│我的部落格有滿滿的 Google AdSense 快來膜拜我│我是「知名部落客」 → 究竟「誰是知名部落客」？ 老爺別這樣│夫人會看到的 誠實│嘴巴說不要，身體倒是挺老實的嘛 Web 2.0│我是重度使用者 韓蘭嬌│這是我的名字 田英純│這是我的名字 常杏嬌│這是我的名字 甘禮良│這是我的名字 我要成為│上學王 我要成為│按摩王 我要成為│賺錢王 我要成為│重灌王 我要成為│好人王 我要成為│慢跑王 → 竟然真的有人是搜尋了「慢跑王」而來到 這裡 的...... 我