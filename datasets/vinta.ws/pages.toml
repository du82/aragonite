description = "When in doubt, pa chou ching."
full_description = "電玩生涯：PS2 - 動作遊戲 Part 1 Posted on 2009/02/232009/02/23Author VintaPosted in 關於 ACG 那些很宅的東西 到目前為止，我唯一擁有的電玩主機，就是 PS2 了。如果不把國小的時候，一堆小鬼一到下課就拿著自己養的電子怪獸在那邊搖啊搖的（以為這樣會比較容易贏），到處跟別人對戰的「怪獸對打機」算在內的話。我甚至沒有經歷過紅白機、DC 和 PS 的時代，而是直接跳到電腦。 從我國中基測前夕入手 PS2 之後（各位父母千萬不要答應你的小孩在基測前的三個月之內買任何電玩主機啊......），一直到現在，PS2 的遊戲我都只玩動作遊戲，因為也只有動作遊戲是看不懂劇情也可以玩得很爽～ 【真．三國無雙】系列 真．三國無雙 3 是我的第二款 PS2 遊戲（第一款是 A Z.O.E.），也是我玩過的第一款「一夫當關，萬夫莫敵」的無雙類型動作遊戲，我在電腦上幾乎都只玩 RPG 而已，所以第一次玩這種拿著長兵器砍啊砍、武將一直擋啊擋、小兵一直來啊來的遊戲，超．爽．ㄉㄜ～ Read More 電玩生涯：Online Games Posted on 2008/05/222013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 接續之前的「電玩生涯」系列，RPG、ACT、SRPG、SIM，最後是 Online Games。然後，PC Games 講完，就要開始說說我的 PS2 了～ >-------------------------------------------------------------< 在我目前為止的人生中，我認真玩過的網路遊戲只有三款，而只有其中一款我會一直一直玩下去。 我不常玩網路遊戲，就是因為它都「玩不完」。單機的遊戲不管劇情再怎麼浩大，終究也是有破關的一天。我每次開始玩一款遊戲，就一定會「上癮」（哪個玩家不是這樣啊？），會發狂似地一直玩下去，完全不想理其他的事，直到破關的那一刻。但是，因為線上遊戲根本就不可能讓我「破關」，我一玩上癮就會停不下來，我的時間就都被綁在電玩上了。 如果一直有個遊戲的捷徑擺在桌面上，而我又還沒把它玩完，那種感覺很難受。 我會一直想去點它...... ====== OLG：線上遊戲 ====== 【夢幻之星 網路版】（Phantasy Star Online, 簡稱：PSO）Ver. 2 這是一款可以單機也可以線上遊玩的「角色扮演動作遊戲」，是從 DC（就是 Dreamcast）移植到 PC 上的。台灣的代理商「第三波」好像已經倒閉了，而 PSO 在台灣的伺服器當然也早就停止服務了，所以，現在已經玩不到線上模式了。不過，即使是當年伺服器還在運行的時候，我也很少上線，大部分都還是在玩「單機模式」── 因為，這樣我才可以用「遊戲修改大師」。 Read More"
