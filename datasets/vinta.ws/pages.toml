full_description = "電玩生涯：PC Games‧SIM - 模擬市民 2 Posted on 2008/02/102013/05/09Author VintaPosted in 關於 ACG 那些很宅的東西 ===== SIM：模擬類型 ===== 【模擬市民 2】（The Sims 2） 前作「模擬市民」號稱是史上最暢銷的遊戲之一，而二代也不遑多讓，而且，二代大概是我見過玩法最多樣的遊戲了。模擬市民 2 的玩法，簡單說就是讓你操控一個或多個自創的小人物，然後，幫他過生活。所有日常生活中可以做的事或各種異想天開的詭異動作，在遊戲裡面都有相對應的指令，例如：吃飯、睡覺、聊天、上廁所、洗澡、看電視、聽音樂、打電話、上網、跳舞、讀書、修理電器、下棋、射飛鏢、煮菜、游泳、畫畫、彈鋼琴、玩電動、玩遙控汽車、叫計程車、打架、玩枕頭戰、看星星、擁抱、親吻、嘿咻、生小孩、裸奔、冥想...... 在安裝了各不相同的資料片之後，還可以有：復活死人、加入秘密社團、和自己的大學教授嘿咻、開跑車、唱卡啦 OK、在約會的時候潑別人水、打保齡球、開店、養寵物、創造寵物、做雪人、玩水、捉迷藏、溜冰、旅行、露營、瞬間移動、打太極拳、踢足球、練習芭蕾舞、修汽車...... Read More 問卷調查：我的朋友都在發情 Posted on 2007/12/052009/09/21Author VintaPosted in 其實我小時候的志向是成為詩人 問卷描述：難道你就沒有別的話要對我說了嗎？ 填寫期限：在販售迷戀的那段時光裡 一、電話後深切反省症候群 是 否 ﹍ ﹍ 01. 裸露的左手腕著實令我焦慮 ﹍ ﹍ 02. 面對薔薇與太空船的話題會吊詭地感到歡愉 ﹍ ﹍ 03. 失去焦距的憂愁僅僅濃郁了猜忌 ﹍ ﹍ 04. 自白說：因為認識了一名菸草商導致性格異常堅忍 ﹍ ﹍ 05. 親愛的，也因為妳是一個受歡迎的人 ﹍ ﹍ 06. 只要暫緩嫉妒酩酊之後依舊會是一種狂喜 ﹍ ﹍ 07. 雙頰憤憤地好似一枚柳橙 ﹍ ﹍ 08. 非關乎思想的顏色 ﹍ ﹍ 09. 據說咬指甲可以抑制性慾但只適用豐腴的體型 ﹍ ﹍ 10. 結論：任一個持有橘色鑰匙圈的女子皆喜愛正直的男性 ﹍ ﹍ 11. 小路亂狀 ﹍ ﹍ 12. 而我的朋友都在發情 Read More"
