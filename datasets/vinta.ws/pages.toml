一旦發現自己失眠了
就毅然決然爬起床
 
這就叫做【執行力】！！！
 
 
「媽的，我完全不想去上課。」
「聽你這樣一"""
full_description = "誰說現在的年輕人沒有競爭力？ Posted on 2010/01/232010/01/26Author VintaPosted in 假裝沒有惡意 前幾天逛書店的時候，發現商業類的書櫃上有一整排的「即戰力」「變革力」「說話力」「交涉力」「行動力」「解決力」「好感力」「拒絕力」，我在養生類的書架上又看到了「生薑力」和「排便力」，宣傳照總是穿著細跟高跟鞋（♥）的知名部落客，最近也出了一本「女王力」，這年頭不冠上一個什麼力好像就沒辦法在社會上走跳了。 -----------------------------------戀物力 ----------------------------------- 一旦發現自己失眠了 就毅然決然爬起床 這就叫做【執行力】！！！ 「媽的，我完全不想去上課。」 「聽你這樣一講，我也不想去上課了。」 這就叫做【影響力】！！！ 「這門通識好不好過？你上學期不是有修？」 「我整學期只去上了兩次課，期中和期末。」 「然後咧？」 「學期成績 85 分。」 「那我現在就去加簽！」 這就叫做【決策力】！！！ 「要不要去夜唱？」 「幹！走啊！怕你啊？！」 這就叫做【行動力】！！！ 「朱血糕，你負責做第三、四、五章的小抄。」 「楊肉爐，你負責六、七、八章。」 「第九章以後的就交給你了，張魚燒。」 「那你要幹嘛？」 「我去縮印。」 這就叫做【領導力】！！！ （承上段） 「等等，把小抄做得跟考卷一樣大張就不會被發現了。」 「幹！有道理！」 這就叫做【洞察力】！！！ 「聽說吳花果昨天在圖書館的廁所看著微積分的筆記打槍耶！」 「幹！」 「怎麼了？」 「難怪我剛剛跟他借筆記的時候發現有一頁黏住了。」 這就叫做【想像力】！！！ 「幹！大學到底為什麼要用原文書？！」 「可以有效地降低我們的學習效率，畢竟好書值得一讀再讀，好課值得一修再修。」 這就叫做【閱讀力】！！！ 「我女朋友跟我分手了.........」 「真的假的？！」 「她現在跟一個蕾絲邊在一起......」 「哈哈哈哈哈。」（動作顯示為一邊大笑一邊拍他肩） 「我還比不上一根電動雙頭龍......」 「當然啦，人家有兩個頭，你只有一個。而且，你可以七段變速嗎？」 「可是我不用裝電池啊！」 這就叫做【戰鬥力】！！！ 「有地震！」 （動作顯示為正在 Twitter 輸入以上字串） 「趕快跑！」 （動作顯示為一邊大喊一邊衝出家門） 這就叫做【情報力】！！！ 「不要打擾他，他徹底進入假期模式了。」 「他正在完美地演繹一坨爛泥。」 「一不小心還會踩到他。」 這就叫做【專注力】！！！ 「我跟你說教憲法的那個女老師超鬆。」 「你怎麼知道？」 「我上過啊。」 「真的假的？！你上過那個女老師？」 「我是說我上過她的課，然後她的課躺著都可以過。」 這就叫做【表達力】！！！ 有一種傳說中的接話技巧被稱為「順話說」 幾乎可以應付所有的陳述句 「我覺得我好胖喔！」「對啊，妳好胖。」 「剛剛那部電影，超．好．看．！」「真的超好看。」 「人家想吃麻辣鍋」「那妳就去吃啊，又沒人阻止妳。」 「女生都想被人疼......」「妳可以回家找妳阿嬤，妳阿嬤最疼妳了。」 這就叫做【說話力】！！！ 每次講了很爛的笑話都會做困獸之鬥自己硬在最後補上一句「幹！超好笑！」 這就叫做【反省力】！！！ 就算是睡覺也不關電腦 隔天起床只要動一下滑鼠就可以喚醒螢幕 馬上打開 Facebook 這就叫做【即戰力】！！！ 「我的硬碟掛掉了！！！！！」 「裡面有 500GB 的 A 片啊！！！！！」 「你不是資工系的嗎？拜託教我如何救回硬碟！！！！！」 「我給您跪下了！！！！！」 這就叫做【學習力】！！！ 「聽說那個新來的同事是理工科系畢業的。」 「那他一定很宅。」 這就叫做【品牌力】！！！ 「我決定把在學業上遭遇到的所有挫敗都歸咎給作息不正常。」 「不，我覺得問題的關鍵在於『大環境不好』。」 這就叫做【判斷力】！！！ 「你覺得我到底該不該去考研究所？」 「考啊，幹嘛不考？」 「反正你當年也是傻乎乎地因為大家都要讀大學所以才去讀大學。」 「現在傻乎乎地因為大家都去考研究所所以也跟著考研究所，沒什麼不好啊。」 這就叫做【說服力】！！！ 「你在吃什麼？」 「金莎。」 這就叫做【巧克力】！！！！！ 幹 ， 超 好 笑 。 ---------------------------------- 戀物力 ---------------------------------- JY 我們不吃早餐 Tagged: 人生大學生活考試"
