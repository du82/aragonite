description = "When in doubt, pa chou ching."
full_description = "電玩生涯：Online Games Posted on 2008/05/222013/07/23Author VintaPosted in 關於 ACG 那些很宅的東西 接續之前的「電玩生涯」系列，RPG、ACT、SRPG、SIM，最後是 Online Games。然後，PC Games 講完，就要開始說說我的 PS2 了～ >-------------------------------------------------------------< 在我目前為止的人生中，我認真玩過的網路遊戲只有三款，而只有其中一款我會一直一直玩下去。 我不常玩網路遊戲，就是因為它都「玩不完」。單機的遊戲不管劇情再怎麼浩大，終究也是有破關的一天。我每次開始玩一款遊戲，就一定會「上癮」（哪個玩家不是這樣啊？），會發狂似地一直玩下去，完全不想理其他的事，直到破關的那一刻。但是，因為線上遊戲根本就不可能讓我「破關」，我一玩上癮就會停不下來，我的時間就都被綁在電玩上了。 如果一直有個遊戲的捷徑擺在桌面上，而我又還沒把它玩完，那種感覺很難受。 我會一直想去點它...... ====== OLG：線上遊戲 ====== 【夢幻之星 網路版】（Phantasy Star Online, 簡稱：PSO）Ver. 2 這是一款可以單機也可以線上遊玩的「角色扮演動作遊戲」，是從 DC（就是 Dreamcast）移植到 PC 上的。台灣的代理商「第三波」好像已經倒閉了，而 PSO 在台灣的伺服器當然也早就停止服務了，所以，現在已經玩不到線上模式了。不過，即使是當年伺服器還在運行的時候，我也很少上線，大部分都還是在玩「單機模式」── 因為，這樣我才可以用「遊戲修改大師」。 Read More 電玩生涯：PC Games‧SIM - 模擬市民 2 Posted on 2008/02/102013/05/09Author VintaPosted in 關於 ACG 那些很宅的東西 ===== SIM：模擬類型 ===== 【模擬市民 2】（The Sims 2） 前作「模擬市民」號稱是史上最暢銷的遊戲之一，而二代也不遑多讓，而且，二代大概是我見過玩法最多樣的遊戲了。模擬市民 2 的玩法，簡單說就是讓你操控一個或多個自創的小人物，然後，幫他過生活。所有日常生活中可以做的事或各種異想天開的詭異動作，在遊戲裡面都有相對應的指令，例如：吃飯、睡覺、聊天、上廁所、洗澡、看電視、聽音樂、打電話、上網、跳舞、讀書、修理電器、下棋、射飛鏢、煮菜、游泳、畫畫、彈鋼琴、玩電動、玩遙控汽車、叫計程車、打架、玩枕頭戰、看星星、擁抱、親吻、嘿咻、生小孩、裸奔、冥想...... 在安裝了各不相同的資料片之後，還可以有：復活死人、加入秘密社團、和自己的大學教授嘿咻、開跑車、唱卡啦 OK、在約會的時候潑別人水、打保齡球、開店、養寵物、創造寵物、做雪人、玩水、捉迷藏、溜冰、旅行、露營、瞬間移動、打太極拳、踢足球、練習芭蕾舞、修汽車...... Read More"
