["https://viperone.gitbook.io/pentest-everything/everything/everything-active-directory/adcs/esc2"]
title = "ESC2 | Pentest Everything"
full_description = 'ESC2 works on the same core principal as ESC1, where a low privileged user or group has the ability to supply a subjectAltName (SAN) for any other user or machine in Active Directory. in ESC1 attacks the flags for the Extended Key Usage (EKU) need to contain "Client Authentication" to be valid. ESC2 by comparison is where the EKU is set to "Any Purpose" or is void of any usage specifications The attack method for this follows much the same as ESC1 except there is a small variation in the "pre-requisites" Follow the attack process described below. The attack is the same for ESC1 after identifying a vulnerable certificate template. If possible, remove Enrollment rights for low privileges groups such as Domain users and Domain Computers'
