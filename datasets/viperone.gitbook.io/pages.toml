["https://viperone.gitbook.io/pentest-everything/everything/buffer-overflow"]
title = "Buffer Overflow Guide | Pentest Everything"
full_description = '''This following page recreates the steps on the TryHackMe room linked below in order to perform a simple stack based buffer overflow. Configure Mona on the RDP session. Inside Immunity Debugger run the following command in the command box. Once the Python script has started it will crash the immunity debugger after a short amount of time. Make a note of the last bytes sent to Immunity. Run the following command to generate a cyclic pattern of a length 400 bytes longer that the string that crashed the server (change the -l value to this): Reopen the OSCP.exe file in Immunity Debugger and run. Then run the exploit.py file. This will crash the application. We can then run the following command in the Immunity debugger command box. The distance value must match the value we used to create the cyclic value. Mona should produce a log window where we need to view the value of the line EIP contains normal pattern : ... (offset XXXX) Take note of the offset value. In the example below this value is 1978. Then open the exploit.py script and set the value of offset to the value produced by Mona which in this case is 1978. We can also set the 'retn' value to BBBB which converts to hex value of 42424242. Again restart the OSCP.exe file in Immunity Debugger. Then run the exploit.py script again. For the value EIP you should see 42424242 which is BBBB as B has the hex value of '42'. This confirms a buffer overflow would theoretically work. Reset the payload string to an empty string again. We now need to identify bad characters by default the null-byte value "\x00" is excluded. Generate a bytearray file with Mona using the following command. This will save the results of the array to c:\mona\oscp\bytearray.txt. Next use the python script below to generate a list of bad characters. We need to then take the output of the bytearray.py script and set it as the payload value in the exploit.py script. Restart OSCP.exe in Immunity Debugger. Run the exploit and make a note of the value in which the ESP is set to.'''
