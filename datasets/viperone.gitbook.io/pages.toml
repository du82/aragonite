["https://viperone.gitbook.io/pentest-everything/everything/everything-active-directory/adversary-in-the-middle/ldap-relay"]
title = "LDAP Relay | Pentest Everything"
full_description = "LDAP Relay attacks make use of NTLM authentication where an NTLM authentication request is performed and an attacker captures the credentials and relays them to a Domain Controller and leverages this against LDAP. Through means of phishing or placing a malicious file locally from some other method we are able to trick the Domain Administrator user who is currently logged into Admin-PC into browsing to http://10.10.10.6/. Where credentials are requested and the Domain Administrator successfully submits them. ntlmrelayx.py receives the credentials and relays them to the Domain Controller on 10.10.10.10. Successfully giving the user Dave DCSync rights which can be used to dump hashes for the Domain with secretsdump.py. The hashes can then either be taken for password cracking or can be used for authentication. By default Domain Contollers run the WinRM service on port 5985. This can be used alongside Evil-WinRM to authenticate with hashes. Below is a example of the dumped hashed for the Domain Administrator being used for access over WinRM to the Domain Controller DC01. This first example shows the LDAP Relay attack using Intercept-ng on a Windows 10 host. Intercept-ng is started on the system Attacker-PC and an administrator PC 'Admin-PC' is quickly identified. The system is then added to the target list on Intercept-ng. From here Expert mode is then used on Intercept-ng to enable LDAP relay and enter the Domain name as shown below. Then under the MiTM options LDAP relay is checked and the Domain Controller and Gateway fields are populated with the expected information. From here the MiTM attack is started and active sniffing begins. As shown below we are given the Inject URL which is http://Attacker-PC:62222/. Once this Domain Administrator on Admin-PC clicks the malicious link we see Intercept-ng relays the credentials to the Domain Controller and creates a new user called 'cepter'. Over on our Windows Server 2019 Domain Controller we now see the user 'cepter' exists and is a member of the Domain Admins Group."
year_published = 2025
