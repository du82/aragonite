["https://viperone.gitbook.io/pentest-everything/everything/everything-active-directory/access-token-manipultion/token-impersonation"]
title = "Token Impersonation | Pentest Everything"
description = "https://attack.mitre.org/techniques/T1134/001/"
full_description = "EverythingEverything Active Directory and WindowsAccess Token ManipultionToken Impersonationhttps://attack.mitre.org/techniques/T1134/001/Last updated 2 years agoWas this helpful? Adversaries may duplicate then impersonate another user's token to escalate privileges and bypass access controls. An adversary can create a new access token that duplicates an existing token using DuplicateToken(Ex). The token can then be used with ImpersonateLoggedOnUser to allow the calling thread to impersonate a logged on user's security context, or with SetThreadToken to assign the impersonated token to a thread. An adversary may do this when they have a specific, existing process they want to assign the new token to. For example, this may be useful for when the target user has a non-network logon session on the system. URL: https://github.com/S3cur3Th1sSh1t/PowerSharpPack/blob/master/PowerSharpBinaries/Invoke-SharpImpersonation.ps1 In this scenario we will be using Metasploit. This scenario assumes we already have gained shell access on the target system as the user 'Bart.Simpson'. In Metasploit we can load the incognito module with the command load incognito. This will load the modules required to impersonate another users token. Once loaded we can use the help command to show if the module has loaded and what options are available to us. Tokens will persist until a machine has been rebooted. Below I have rebooted the target machine and logged in as the user 'Lisa.Simpson'. I then exploited the machine and viewed available tokens. As we can see we have less available to us now that the machine has been rebooted. Are generally created when a user logs on interactively to the target system. Delegation tokens can be used elsewhere on the network. Impersonation tokens run in an alternative security context to the process that started it. These tokens are generally not used elsewhere on the network. Due to the fact that tokens persist until reboot. Servers and File Servers are a potential treasure troves for tokens."
