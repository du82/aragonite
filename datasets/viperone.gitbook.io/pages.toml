["https://viperone.gitbook.io/pentest-everything/everything/everything-active-directory/adversary-in-the-middle/rdp-mitm"]
title = "RDP MiTM | Pentest Everything"
full_description = "EverythingEverything Active Directory and WindowsAdversary-in-the-Middle🔨RDP MiTMLast updated 2 years agoWas this helpful? Seth is a tool written in Python and Bash to MitM RDP connections by attempting to downgrade the connection in order to extract clear text credentials. It was developed to raise awareness and educate about the importance of properly configured RDP connections in the context of pentests, workshops or talks. The author is Adrian Vollmer (SySS GmbH). All Windows systems are fully updated and running latest versions of Windows Defender with default settings. Then on the Victim-PC the victim initiates an RDP session as part of a routine task to the Domain Controller on 10.10.10.10. Where normally an RDP connection will produce results similar to that of below. Taking note of the extra warnings provided above as opposed to the legitimate request below. Assuming the victim accepts the malicious certificate request the Attacking-PC will receive a Network NTLM hash for the user and the users password in cleartext. The victim user should continue to connect to the destination server and be none the wiser to the attack. If you want to restrict who can access your PC, choose to allow access only with Network Level Authentication (NLA). When you enable this option, users have to authenticate themselves to the network before they can connect to your PC Domain joined computers by default have this option enabled. It would however, be more appropriate to ensure this is enforced through Group Policy. Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security > Require user authentication for remote connections by using Network Level Authentication > Enabled. Whilst the attack can be still be performed to the same effect where a NTLM hash is captured and a password is presented in cleartext this policy will stop the user from finalizing the connection to the intended RDP destination."
