["https://viperone.gitbook.io/pentest-everything/everything/everything-active-directory/adcs/esc1"]
title = "ESC1 | Pentest Everything"
full_description = 'ESC1 is a privilege escalation vulnerability in certificate templates that allows any user with enrollment rights to supply a subjectAltName (SAN) for any other user or machine in Active Directory in the environment from the Certificate Authority (CA) , this allows the requesting user to receive a certificate for the targeted user and in turn, authenticate as them with the received certificate. Given this information, it is possible to abuse the ESC1 attack vector. As our user is a member of Domain Users we can request a certificate for any other user, ideally, a Domain Administrator. Copy the private key and certificate output into a file on a host where OpenSSL is installed. Ensure the file extension is .pem. Take either the Base64 output or certificate file path and use with Rubeus to requests a TGT of the target account. With a TGT for the impersonated user either pass the ticket directly into the current session, or use createnetonly to create a new sacrificial logon session with the impersonated users ticket (preferred) To perform this attack you will need to be running a shell in the context of a domain computer (SYSTEM or TGT in memory for a computer account, or if a local administrator certify will attempt to elevate to SYSTEM). Repeat the steps in the section "Windows Abuse" from the point of requesting the certificate to complete the attack path. The above section "ESC1 - Machine Account" presents an overview for abusing the ESC1 vulnerable template by abusing local administrative or SYSTEM level privileges for the current system to leverage the vulnerability. Another way to leverage this vulnerability for when "Domain Computers" have enrollement rights is by adding a new system to Active Dirctory Powermad can be used to enumerate for and add a new machine account to the domain. Repeat the steps in the section "Windows Abuse" from the point of requesting the certificate to complete the attack path. If a template has enrollment rights for domain computers, a machine account can be used to request a certificate to perform the attack. This requires having a hash or password value for a machine account or if the domains machine account quota is greater than zero, adding a new machine ourselves to complete the attack.'
year_published = 2025
