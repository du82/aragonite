title = "Virtual Coffee Community Events"
description = "See our upcoming events!"
full_description = '''Upcoming EventsMost of our events are members-only. If you'd like to join one of these events, please consider joining Virtual Coffee!Recorded EventsIf you can't join our events live, we got you covered! You can find our Lunch & Learns, Live Streams, Lightning Talks 2022, and lots more, all on our YouTube channel.Monday, March 3, 2025 - 4:00 PM to 4:30 PM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSTech Interview Study GroupWeekly discussion of job search and interview-related topics. Mini mock-interviews, technical topic discussions, job search tips, occasional guest speakers, etc. We are always looking for ideas to help meet your needs! All stages of career and job search welcome. Tuesday, March 4, 2025 - 9:00 AM to 10:00 AM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSVirtual Coffee - Morning CrowdAn hour-long chat with devs at all stages of the journey. You can come to hang out with great people, ask questions or bring up a topic, or just sit back and listen to others talk about tech. Currently open to slack members only. Check announcements for the Join Event button. Every Tuesday at 9AM ET!Tuesday, March 4, 2025 - 7:00 PM to 9:00 PM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSAccountabilibuddies - The QuadThis two-hour event features a breakout room where you and your Accountabilibuddies can participate in 25-minute Pomodoro sessions beginning each half hour. Focus on your goals in the Pomodoro breakout room, or hang out in the main room and live out your undergrad dreams of social supports and approaching deadlines. Hacky sacks will not be provided.Wednesday, March 5, 2025 - 10:00 AM to 12:00 PM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSThe Pack Hunt - Original RecipeJob hunting as a collective: An accountability session exclusively for job hunting. Support each other by being present and sharing your goals, target roles, and resources. Let's collaborate as we apply for jobs, reach out to recruiters, and scroll LinkedIn for leads. "Hunt with the pack! Arwoooo...!!!"Wednesday, March 5, 2025 - 4:00 PM to 4:30 PM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSData Structures and Algorithms (DSA) Office HoursDSA Office Hours is an opportunity to come and ask questions about anywhere you get stuck on this week’s coding problems, or about this week’s topic. Find this week’s DSA topic and coding problems in #tech-interview-study-group. New topic and problems every week!Thursday, March 6, 2025 - 9:00 AM to 11:30 AM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSAccountabilibuddies - The Breakfast ClubYou want to learn that new tool/finish up that blog post/send that job application, but you’re so busy that the day is over before you know it. Join us and add some fun and friendly accountability to your schedule! Drop into our sessions whenever and for however long your schedule allows. No matter the goal, you’ll find encouragement and support alongside your Accountabilibuddies!Thursday, March 6, 2025 - 12:00 PM to 1:00 PM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSVirtual Coffee - Afternoon CrowdAn hour-long chat with devs at all stages of the journey. You can come to hang out with great people, ask questions or bring up a topic, or just sit back and listen to others talk about tech. Currently open to slack members only. Check announcements for the Join Event button. Every Thursday at 12pm ET!Friday, March 7, 2025 - 11:00 AM to 12:00 PM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSFrontend Friday Folks Fighting CSSBattle.devOn Fridays, we solve a new puzzle at CSSBattle.dev. We meet in the #co-working-room for this Coffee Table, and can move our meeting to a breakout room so as not to disturb any co-working VC members. Feel free to join us and learn more about CSS! If you can't make it, be sure to play along on your own and post your answers in Virtual Coffee's CSS Battles Discussion board!Friday, March 7, 2025 - 8:00 PM to 9:00 PM ESTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSFeelings FridayFeelings Friday was started at the Flatiron School coding boot camp by its founders, Avi Flombaum & Adam Enbar, after they noticed burnout among their first cohorts. Join a supportive group where everyone has the opportunity to share what’s on their mind in a safe environment. It's a great way to unwind at the end of the week!Monday, March 10, 2025 - 4:00 PM to 4:30 PM EDTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSTech Interview Study GroupWeekly discussion of job search and interview-related topics. Mini mock-interviews, technical topic discussions, job search tips, occasional guest speakers, etc. We are always looking for ideas to help meet your needs! All stages of career and job search welcome. Tuesday, March 11, 2025 - 9:00 AM to 10:00 AM EDTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSVirtual Coffee - Morning CrowdAn hour-long chat with devs at all stages of the journey. You can come to hang out with great people, ask questions or bring up a topic, or just sit back and listen to others talk about tech. Currently open to slack members only. Check announcements for the Join Event button. Every Tuesday at 9AM ET!Tuesday, March 11, 2025 - 7:00 PM to 9:00 PM EDTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSAccountabilibuddies - The QuadThis two-hour event features a breakout room where you and your Accountabilibuddies can participate in 25-minute Pomodoro sessions beginning each half hour. Focus on your goals in the Pomodoro breakout room, or hang out in the main room and live out your undergrad dreams of social supports and approaching deadlines. Hacky sacks will not be provided.Wednesday, March 12, 2025 - 10:00 AM to 12:00 PM EDTAdd to Calendar:Google CalendarOutlook CalendarDownload ICSThe Pack Hunt - Original RecipeJob hunting as a collective: An accountability session exclusively 