full_description = "vispy.scene.visuals module# The classes in scene.visuals are visuals that may be added to a scenegraph using the methods and properties defined in vispy.scene.Node such as name, visible, parent, children, etc… These classes are automatically generated by mixing vispy.scene.Node with the Visual classes found in vispy.visuals. For developing custom visuals, it is recommended to subclass from vispy.visuals.Visual rather than vispy.scene.Node. class vispy.scene.visuals.Arrow(*args, **kwargs)# Bases: VisualNode, ArrowVisual Arrow visual This class inherits from visuals.ArrowVisual and scene.Node, allowing the visual to be placed inside a scenegraph. A special line visual which can also draw optional arrow heads at the specified vertices. You add an arrow head by specifying two vertices v1 and v2 which represent the arrow body. This visual will draw an arrow head using v2 as center point, and the orientation of the arrow head is automatically determined by calculating the direction vector between v1 and v2. The arrow head can be detached from arrow body. Parameters: posarrayArray of shape (…, 2) or (…, 3) specifying vertex coordinates of arrow body. colorColor, tuple, or arrayThe color to use when drawing the line. If an array is given, it must be of shape (…, 4) and provide one rgba color per vertex. Can also be a colormap name, or appropriate Function. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). width:The width of the line in px. Line widths > 1px are only guaranteed to work when using ‘agg’ method. connectstr or arrayDetermines which vertices are connected by lines. “strip” causes the line to be drawn with each vertex connected to the next. “segments” causes each pair of vertices to draw an independent line segment numpy arrays specify the exact set of segment pairs to connect. methodstrMode to use for drawing. “agg” uses anti-grain geometry to draw nicely antialiased lines with proper joins and endcaps. “gl” uses OpenGL’s built-in line rendering. This is much faster, but produces much lower-quality results and is not guaranteed to obey the requested line width or join/endcap styles. antialiasboolEnables or disables antialiasing. For method=’gl’, this specifies whether to use GL’s line smoothing, which may be unavailable or inconsistent on some platforms. arrowsarrayA (N, 4) or (N, 6) matrix where each row contains the (x, y) or the (x, y, z) coordinates of the first and second vertex of the arrow head. Remember that the second vertex is used as center point for the arrow head, and the first vertex is only used for determining the arrow head orientation. arrow_typestringSpecify the arrow head type, the currently available arrow head types are: stealth curved triangle_30 triangle_60 triangle_90 angle_30 angle_60 angle_90 inhibitor_round arrow_sizefloatSpecify the arrow size arrow_colorColor, tuple, or arrayThe arrow head color. If an array is given, it must be of shape (…, 4) and provide one rgba color per arrow head. Can also be a colormap name, or appropriate Function. class vispy.scene.visuals.Axis(*args, **kwargs)# Bases: VisualNode, AxisVisual Axis visual This class inherits from visuals.AxisVisual and scene.Node, allowing the visual to be placed inside a scenegraph. Parameters: posarrayCo-ordinates of start and end of the axis. domaintupleThe data values at the beginning and end of the axis, used for tick labels. i.e. (5, 10) means the axis starts at 5 and ends at 10. Default is (0, 1). tick_directionarrayThe tick direction to use (in document coordinates). scale_typestrThe type of scale. For now only ‘linear’ is supported. axis_colortupleRGBA values for the axis colour. Default is black. tick_colortupleRGBA values for the tick colours. The colour for the major and minor ticks is currently fixed to be the same. Default is a dark grey. text_colorColorThe color to use for drawing tick and axis labels minor_tick_lengthfloatThe length of minor ticks, in pixels major_tick_lengthfloatThe length of major ticks, in pixels tick_widthfloatLine width for the ticks tick_label_marginfloatMargin between ticks and tick labels tick_font_sizefloatThe font size to use for rendering tick labels. axis_widthfloatLine width for the axis axis_labelstrText to use for the axis label axis_label_marginfloatMargin between ticks and axis labels axis_font_sizefloatThe font size to use for rendering axis labels. font_sizefloatFont size for both the tick and axis labels. If this is set, tick_font_size and axis_font_size are ignored. anchorsiterableA 2-element iterable (tuple, list, etc.) giving the horizontal and vertical alignment of the tick labels. The first element should be one of ‘left’, ‘center’, or ‘right’, and the second element should be one of ‘bottom’, ‘middle’, or ‘top’. If this is not specified, it is determined automatically. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). class vispy.scene.visuals.Box(*args, **kwargs)# Bases: VisualNode, BoxVisual Visual that displays a box. This class inherits from visuals.BoxVisual and scene.Node, allowing the visual to be placed inside a scenegraph. Parameters: widthfloatBox width. heightfloatBox height. depthfloatBox depth. width_segmentsintBox segments count along the width. height_segmentsfloatBox segments count along the height. depth_segmentsfloatBox segments count along the depth. planes: array_likeAny combination of {'-x', '+x', '-y', '+y', '-z', '+z'} Included planes in the box construction. vertex_colorsndarraySame as for MeshVisual class. See create_plane for vertex ordering. face_colorsndarraySame as for MeshVisual class. See create_plane for vertex ordering. colorColorThe Color to use when drawing the cube faces. edge_colortuple or ColorThe Color to use when drawing the cube edges. If None, then no cube edges are drawn. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). class vispy.scene.visuals.ColorBar(*args, **kwargs)# Bases: VisualNode, ColorBarVisual Visual subclass displaying a colorbar This class inherits from visuals.ColorBarVisual and scene.Node, allowing the visual to be placed inside a scenegraph. Parameters: cmapstr | vispy.color.ColorMapEither the name of the ColorMap to be used from the standard set of names (refer to vispy.color.get_colormap), or a custom ColorMap object. The ColorMap is used to apply a gradient on the colorbar. orientation{‘left’, ‘right’, ‘top’, ‘bottom’}The orientation of the colorbar, used for rendering. The orientation can be thought of as the position of the label relative to the color bar. When the orientation is ‘left’ or ‘right’, the colorbar is vertically placed. When it is ‘top’ or ‘bottom’, the colorbar is horizontally placed. ‘top’: the colorbar is horizontal. Color is applied from left to right. Minimum corresponds to left and maximum to right. Label is to the top of the colorbar ‘bottom’: Same as top, except that label is to the bottom of the colorbar ‘left’: the colorbar is vertical. Color is applied from bottom to top. Minimum corresponds to bottom and maximum to top. Label is to the left of the colorbar ‘right’: Same as left, except that the label is placed to the right of the colorbar size(major_axis_length, minor_axis_length)lengths with respect to the major and minor axes. The minor axis is the shorter axis, while the major axis is the longer axis with respect to the orientation For orientations ‘top’ and ‘bottom’, the major axis is along the length. For orientations ‘left’ and ‘right’, the major axis is along the breadth postuple (x, y)Position where the colorbar is to be placed with respect to the center of the colorbar labelstr | vispy.visuals.TextVisualThe label that is to be drawn with the colorbar that provides information about the colorbar. If a TextVisual object then ‘label_color’ is ignored. label_colorstr | vispy.color.ColorThe color of the label and tick labels. This can either be a str as the color’s name or an actual instace of a vipy.color.Color climtuple (min, max)the minimum and maximum values of the data that is given to the colorbar. This is used to draw the scale on the side of the colorbar. border_widthfloat (in px)The width of the border the colormap should have. This measurement is given in pixels border_colorstr | vispy.color.ColorThe color of the border of the colormap. This can either be a str as the color’s name or an actual instace of a vipy.color.Color parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). .. versionchanged:: 0.7Keyword argument label_str renamed to label. class vispy.scene.visuals.ComplexImage(*args, **kwargs)# Bases: VisualNode, ComplexImageVisual ImageVisual subclass displaying a complex-valued image. This class inherits from visuals.ComplexImageVisual and scene.Node, allowing the visual to be placed inside a scenegraph. This class handles complex values by using an rg32f float texture behind the scenes, storing the real component in the “r” value and the imaginary in the “g” value. Parameters: datandarrayComplex valued ImageVisual data. Should be a two dimensional array with a dtype of np.complex64 or np.complex128. complex_modestr The mode used to convert the complex value in each pixel into a scalar: ‘real’: show only the real component. ‘imaginary’: show only the imaginary component. ‘magnitude’: show the magnitude (np.abs) of the complex value. ‘phase’: show the phase (np.angle) of the complex value. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). class vispy.scene.visuals.Compound(*args, **kwargs)# Bases: VisualNode, CompoundVisual Visual consisting entirely of sub-visuals. This class inherits from visuals.CompoundVisual and scene.Node, allowing the visual to be placed inside a scenegraph. To the user, a compound visual behaves exactly like a normal visual–it has a transform system, draw() and bounds() methods, etc. Internally, the compound visual automatically manages proxying these transforms and methods to its sub-visuals. Parameters: subvisualslist of BaseVisual instancesThe list of visuals to be combined in this compound visual. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). class vispy.scene.visuals.Cube(*args, **kwargs)# Bases: VisualNode, CubeVisual Visual that displays a cube or cuboid This class inherits from visuals.CubeVisual and scene.Node, allowing the visual to be placed inside a scenegraph. Parameters: sizefloat or tupleThe size of the cuboid. A float gives a cube, whereas tuples may specify the size of each axis (x, y, z) independently. vertex_colorsndarraySame as for MeshVisual class. See create_cube for vertex ordering. face_colorsndarraySame as for MeshVisual class. See create_cube for vertex ordering. colorColorThe Color to use when drawing the cube faces. edge_colortuple or ColorThe Color to use when drawing the cube edges. If None, then no cube edges are drawn. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). class vispy.scene.visuals.Ellipse(*args, **kwargs)# Bases: VisualNode, EllipseVisual Displays a 2D ellipse This class inherits from visuals.EllipseVisual and scene.Node, allowing the visual to be placed inside a scenegraph. Parameters: centerarrayCenter of the ellipse colorinstance of ColorThe face color to use. border_colorinstance of ColorThe border color to use. border_width: floatThe width of the border in pixels Line widths > 1px are only guaranteed to work when using border_method=’agg’ method. radiusfloat | tuple | list | numpy.ndarrayRadius or radii of the ellipse Defaults to (0.1, 0.1) start_anglefloatStart angle of the ellipse in degrees Defaults to 0. span_anglefloatSpan angle of the ellipse in degrees Defaults to 360. num_segmentsintNumber of segments to be used to draw the ellipse Defaults to 100 parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). **kwargsdictKeyword arguments to pass to PolygonVisual. class vispy.scene.visuals.Graph(*args, **kwargs)# Bases: VisualNode, GraphVisual Visual for displaying graphs or networks. This class inherits from visuals.GraphVisual and scene.Node, allowing the visual to be placed inside a scenegraph. Parameters: adjacency_matarray or sparseThe adjacency matrix of the graph. directedboolWhether the graph is directed or not. If True, then this visual will draw arrows for the directed edges. layoutstrThey layout to use. animateboolWhether or not to animate. line_colorstr or vispy.color.colormap.ColorMapThe color to use for the edges. line_widthnumberThe edge thickness. arrow_typestrThe kind of arrow head to use. See vispy.visuals.ArrowHead for more information. arrow_sizenumberThe size of the arrow head. node_symbolstringThe marker to use for nodes. See vispy.visuals.MarkersVisual for more information. node_sizenumberThe size of the node border_colorstr or vispy.color.colormap.ColorMapThe border color for nodes. face_colorstr or vispy.color.colormap.ColorMapThe face color for nodes. border_widthnumberThe border size for nodes. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). See also ArrowVisual, MarkersVisual class vispy.scene.visuals.GridLines(*args, **kwargs)# Bases: VisualNode, GridLinesVisual Displays regularly spaced grid lines in any coordinate system and at any scale. This class inherits from visuals.GridLinesVisual and scene.Node, allowing the visual to be placed inside a scenegraph. Parameters: scaletupleThe scale factors to apply when determining the spacing of grid lines. colorColorThe base color for grid lines. The final color may have its alpha channel modified. parentNodeThe parent node to assign to this node (optional). namestringA name for this node, used primarily for debugging (optional). class vispy.scene.visuals.GridMesh(*args, **kwargs)# Bases: VisualNode, GridMeshVisual Displays a mesh in a Cartesian grid about x,y,z coordinates. This class inherits from visuals.GridMeshVisual and scene.Node, allowing the visual to be placed inside a scenegraph. This makes it simple to generate a mesh from e.g. the output of numpy.meshgrid. All arguments are optional, though they can be changed individually later with the set_data method. Parameters: xsndarrayA 2d array of x coordinates for the vertices of the mesh. Must have the same dimensions as ys and zs. ysndarrayA 2d array of y coordinates for the vertices of the mesh. Must have the same dimensions as xs and zs. zsndarrayA 2d array of z coordinates for the vertices of the mesh. Must have "
