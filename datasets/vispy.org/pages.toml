hData.set_vertices() vispy.geometry.normals module compact() normals() vispy.geometry.parametric module surface() vispy.geometry.polygon module PolygonData PolygonData.add_vertex() PolygonData.convex_hull PolygonData.edges PolygonData.faces PolygonData.triangulate() PolygonData.vertices vispy.geometry.rect module Rect Rect.bottom Rect.center Rect.contains() Rect.flipped() Rect.height Rect.left Rect.normalized() Rect.padded() Rect.pos Rect.right Rect.size Rect.top Rect.width vispy.geometry.torusknot module TorusKnot TorusKnot.components TorusKnot.first_component TorusKnot.major_radius TorusKnot.minor_radius TorusKnot.num_components TorusKnot.num_points TorusKnot.p TorusKnot.q vispy.geometry.triangulation module Triangulation Triangulation.triangulate() triangulate() Module contents# This module implements classes and methods for handling geometric data. class vispy.geometry.MeshData(vertices=None, faces=None, edges=None, vertex_colors=None, face_colors=None, vertex_values=None)# Bases: object Class for storing and operating on 3D mesh data. Parameters: verticesndarray, shape (Nv, 3)Vertex coordinates. If faces is not specified, then this will instead be interpreted as (Nf, 3, 3) array of coordinates. facesndarray, shape (Nf, 3)Indices into the vertex array. edgesNone[not available yet] vertex_colorsndarray, shape (Nv, 4)Vertex colors. If faces is not specified, this will be interpreted as (Nf, 3, 4) array of colors. face_colorsndarray, shape (Nf, 4)Face colors. vertex_valuesndarray, shape (Nv,)Vertex values. Notes All arguments are optional. The object may contain: list of vertex locations list of edges list of triangles colors per vertex, edge, or tri normals per vertex or tri This class handles conversion between the standard [list of vertices, list of faces] format (suitable for use with glDrawElements) and ‘indexed’ [list of vertices] format (suitable for use with glDrawArrays). It will automatically compute face normal vectors as well as averaged vertex normal vectors. The class attempts to be as efficient as possible in caching conversion results and avoiding unnecessary conversions. get_bounds()# Get the mesh bounds Returns: boundslistA list of tuples of mesh bounds. get_edge_colors()# get_edges(indexed=None)# Edges of the mesh Parameters: indexedstr | NoneIf indexed is None, return (Nf, 3) array of vertex indices, two per edge in the mesh. If indexed is ‘faces’, then return (Nf, 3, 2) array of vertex indices with 3 edges per face, and two vertices per edge. Returns: edgesndarrayThe edges. get_face_colors(indexed=None)# Get the face colors Parameters: indexedstr | NoneIf indexed is None, return (Nf, 4) array of face colors. If indexed==’faces’, then instead return an indexed array (Nf, 3, 4) (note this is just the same array with each color repeated three times). Returns: colorsndarrayThe colors. get_face_normals(indexed=None)# Get face normals Parameters: indexedstr | NoneIf None, return an array (Nf, 3) of normal vectors for each face. If ‘faces’, then instead return an indexed array (Nf, 3, 3) (this is just the same array with each vector copied three times). Returns: normalsndarrayThe normals. get_faces()# Array (Nf, 3) of vertex indices, three per triangular face. If faces have not been computed for this mesh, returns None. get_vertex_colors(indexed=None)# Get vertex colors Parameters: indexedstr | NoneIf None, return an array (Nv, 4) of vertex colors. If indexed==’faces’, then instead return an indexed array (Nf, 3, 4). Returns: colorsndarrayThe vertex colors. get_vertex_faces()# List mapping each vertex index to a list of face indices that use it. get_vertex_normals(indexed=None)# Get vertex normals Parameters: indexedstr | NoneIf None, return an (N, 3) array of normal vectors with one entry per unique vertex in the mesh. If indexed is ‘faces’, then the array will contain three normal vectors per face (and some vertices may be repeated). Returns: normalsndarrayThe normals. get_vertex_values(indexed=None)# Get vertex colors Parameters: indexedstr | NoneIf None, return an array (Nv,) of vertex values. If indexed==’faces’, then instead return an indexed array (Nf, 3). Returns: valuesndarrayThe vertex values. get_vertices(indexed=None)# Get the vertices Parameters: indexedstr | NoneIf Note, return an array (N,3) of the positions of vertices in the mesh. By default, each unique vertex appears only once. If indexed is ‘faces’, then the array will instead contain three vertices per face in the mesh (and a single vertex may appear more than once in the array). Returns: verticesndarrayThe vertices. has_edge_indexed_data()# has_face_color()# Return True if this data set has face color information has_face_indexed_data()# Return True if this object already has vertex positions indexed by face has_vertex_color()# Return True if this data set has vertex color information has_vertex_value()# Return True if this data set has vertex value information is_empty()# Check if any vertices or faces are defined. property n_faces# The number of faces in the mesh property n_vertices# The number of vertices in the mesh reset_normals()# restore(state)# Restore the state of a mesh previously saved using save() Parameters: statedictThe previous state. save()# Serialize this mesh to a string appropriate for disk storage Returns: statedictThe state. set_face_colors(colors, indexed=None)# Set the face color array Parameters: colorsarrayArray of colors. Must have shape (Nf, 4) (indexed by face), or shape (Nf, 3, 4) (face colors indexed by faces). indexedstr | NoneShould be ‘faces’ if colors are indexed by faces. set_faces(faces)# Set the faces Parameters: facesndarray(Nf, 3) array of faces. Each row in the array contains three indices into the vertex array, specifying the three corners of a triangular face. set_vertex_colors(colors, indexed=None)# Set the vertex color array Parameters: colorsarrayArray of colors. Must have shape (Nv, 4) (indexing by vertex) or shape (Nf, 3, 4) (vertices indexed by face). indexedstr | NoneShould be ‘faces’ if colors are indexed by faces. set_vertex_values(values, indexed=None)# Set the vertex value array Parameters: valuesarrayArray of values. Must have shape (Nv,) (indexing by vertex) or shape (Nf, 3) (vertices indexed by face). indexedstr | NoneShould be ‘faces’ if colors are indexed by faces. set_vertices(verts=None, indexed=None, reset_normals=True)# Set the mesh vertices Parameters: vertsndarray | NoneThe array (Nv, 3) of vertex coordinates. indexedstr | NoneIf indexed==’faces’, then the data must have shape (Nf, 3, 3) and is assumed to be already indexed as a list of faces. This will cause any pre-existing normal vectors to be cleared unless reset_normals=False. reset_normalsboolIf True, reset the normals. class vispy.geometry.PolygonData(vertices=None, edges=None, faces=None)# Bases: object Polygon class for data handling Parameters: vertices(Nv, 3) arrayVertex coordinates. If faces is not specified, then this will instead be interpreted as (Nf, 3, 3) array of coordinates. edges(Nv, 2) arrayConstraining edges specified by vertex indices. faces(Nf, 3) arrayIndexes into the vertex array. Notes All arguments are optional. add_vertex(vertex)# Adds given vertex and retriangulates to generate new faces. Parameters: vertexarray-likeThe vertex to add. property convex_hull# Return an array of vertex indexes representing the convex hull. If faces have not been computed for this mesh, the function computes them. If no vertices or faces are specified, the function returns None. property edges# Return an array (Nv, 2) of vertex indices. If no vertices or faces are specified, the function returns None. property faces# Return an array (Nf, 3) of vertex indexes, three per triangular face in the mesh. If faces have not been computed for this mesh, the function computes them. If no vertices or faces are specified, the function returns None. triangulate()# Triangulates the set of vertices and stores the triangles in faces and the convex hull in co