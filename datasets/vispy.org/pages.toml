full_description = "vispy.geometry.generation module# vispy.geometry.generation.create_arrow(rows, cols, radius=0.1, length=1.0, cone_radius=None, cone_length=None)# Create a 3D arrow using a cylinder plus cone Parameters: rowsintNumber of rows. colsintNumber of columns. radiusfloatBase cylinder radius. lengthfloatLength of the arrow. cone_radiusfloat Radius of the cone base.If None, then this defaults to 2x the cylinder radius. cone_lengthfloat Length of the cone.If None, then this defaults to 1/3 of the arrow length. Returns: arrowMeshDataVertices and faces computed for a cone surface. vispy.geometry.generation.create_box(width=1, height=1, depth=1, width_segments=1, height_segments=1, depth_segments=1, planes=None)# Generate vertices & indices for a filled and outlined box. Parameters: widthfloatBox width. heightfloatBox height. depthfloatBox depth. width_segmentsintBox segments count along the width. height_segmentsfloatBox segments count along the height. depth_segmentsfloatBox segments count along the depth. planes: array_likeAny combination of {'-x', '+x', '-y', '+y', '-z', '+z'} Included planes in the box construction. Returns: verticesarrayArray of vertices suitable for use as a VertexBuffer. facesarrayIndices to use to produce a filled box. outlinearrayIndices to use to produce an outline of the box. vispy.geometry.generation.create_cone(cols, radius=1.0, length=1.0)# Create a cone Parameters: colsintNumber of faces. radiusfloatBase cone radius. lengthfloatLength of the cone. Returns: coneMeshDataVertices and faces computed for a cone surface. vispy.geometry.generation.create_cube()# Generate vertices & indices for a filled and outlined cube Returns: verticesarrayArray of vertices suitable for use as a VertexBuffer. filledarrayIndices to use to produce a filled cube. outlinearrayIndices to use to produce an outline of the cube. vispy.geometry.generation.create_cylinder(rows, cols, radius=[1.0, 1.0], length=1.0, offset=False)# Create a cylinder Parameters: rowsintNumber of rows. colsintNumber of columns. radiustuple of floatCylinder radii. lengthfloatLength of the cylinder. offsetboolRotate each row by half a column. Returns: cylinderMeshDataVertices and faces computed for a cylindrical surface. vispy.geometry.generation.create_grid_mesh(xs, ys, zs)# Generate vertices and indices for an implicitly connected mesh. The intention is that this makes it simple to generate a mesh from meshgrid data. Parameters: xsndarrayA 2d array of x coordinates for the vertices of the mesh. Must have the same dimensions as ys and zs. ysndarrayA 2d array of y coordinates for the vertices of the mesh. Must have the same dimensions as xs and zs. zsndarrayA 2d array of z coordinates for the vertices of the mesh. Must have the same dimensions as xs and ys. Returns: verticesndarrayThe array of vertices in the mesh. indicesndarrayThe array of indices for the mesh. vispy.geometry.generation.create_plane(width=1, height=1, width_segments=1, height_segments=1, direction='+z')# Generate vertices & indices for a filled and outlined plane. Parameters: widthfloatPlane width. heightfloatPlane height. width_segmentsintPlane segments count along the width. height_segmentsfloatPlane segments count along the height. direction: unicode{'-x', '+x', '-y', '+y', '-z', '+z'} Direction the plane will be facing. Returns: verticesarrayArray of vertices suitable for use as a VertexBuffer. facesarrayIndices to use to produce a filled plane. outlinearrayIndices to use to produce an outline of the plane. References [1] Cabello, R. (n.d.). PlaneBufferGeometry.js. Retrieved May 12, 2015, from http://git.io/vU1Fh vispy.geometry.generation.create_sphere(rows=10, cols=10, depth=10, radius=1.0, offset=True, subdivisions=3, method='latitude')# Create a sphere Parameters: rowsintNumber of rows (for method=’latitude’ and ‘cube’). colsintNumber of columns (for method=’latitude’ and ‘cube’). depthintNumber of depth segments (for method=’cube’). radiusfloatSphere radius. offsetboolRotate each row by half a column (for method=’latitude’). subdivisionsintNumber of subdivisions to perform (for method=’ico’) methodstrMethod for generating sphere. Accepts ‘latitude’ for latitude- longitude, ‘ico’ for icosahedron, and ‘cube’ for cube based tessellation. Returns: sphereMeshDataVertices and faces computed for a spherical surface."
