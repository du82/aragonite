title = "Simplest Shader Program — VisPy"
full_description = '''Note Go to the end to download the full example code. Simplest Shader Program# import sys from vispy import gloo from vispy import app import numpy as np VERT_SHADER = """ attribute vec2 a_position; uniform float u_size; void main() { gl_Position = vec4(a_position, 0.0, 1.0); gl_PointSize = u_size; } """ FRAG_SHADER = """ void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); } """ class Canvas(app.Canvas): def __init__(self): app.Canvas.__init__(self, keys='interactive') ps = self.pixel_scale self.program = gloo.Program(VERT_SHADER, FRAG_SHADER) data = np.random.uniform(-0.5, 0.5, size=(20, 2)) self.program['a_position'] = data.astype(np.float32) self.program['u_size'] = 20.*ps self.show() def on_resize(self, event): width, height = event.size gloo.set_viewport(0, 0, width, height) def on_draw(self, event): gloo.clear('white') self.program.draw('points') if __name__ == '__main__': canvas = Canvas() if sys.flags.interactive != 1: app.run() Total running time of the script: (0 minutes 0.464 seconds) Download Jupyter notebook: start_shaders.ipynb Download Python source code: start_shaders.py Download zipped: start_shaders.zip Gallery generated by Sphinx-Gallery'''
