full_description = 'Posted on November 1, 2024November 1, 2024 by EditorialOrder the Mobile Journalism textbook for all of your university students BULK ORDERS FOR UNIVERSITIES The University Edition of the Mobile Journalism textbook is now available for universities to bulk purchase for journalism educators and students. This book is the preferred text for professors teaching courses in smartphone video production, mobile journalism, digital marketing, broadcast reporting, and mobile filmmaking. The book is required reading for students in the Singapore University of Social Sciences Digital Marketing program. This digital book is updated every year and has a rich media companion site to support the latest techniques and apps. The book is is distributed as an interactive PDF and is delivered once a purchase order is completed with your institution. Contact us for purchase order information. Mobile Journalism textbook features 200 illustrations, 170 full-color pages and dozens of videos and downloadable resources. This is the #MOJO bible used by journalism teachers everywhere. Order your personalized edition (PDF) to review the content. REVIEWS The ‘Bible of Mobile Journalism.’ Marcela Kunova, Editor, Journalism Co UK Written for reporters, editors, producers, students and media faculty, this ‘MOJO bible’ features 12 chapters on multimedia storytelling, photo journalism, graphics, video editing, live reporting, and all the kit and apps that fuel mobile journalism. From producing audio scripts to vertical video the chapters are richly illustrated with case studies from international broadcasters like the BBC. Mobile Journalism include links to online videos and access to a companion Web site at the Smart Film School, where readers can view and download additional resources Your Name (required) Your Email (required) Subject Your Message Which is larger? 7 or 3? Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); CategoriesNews'
