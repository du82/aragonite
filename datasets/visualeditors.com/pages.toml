title = "About - Visual Editors"
description = 'VISUAL EDITORS is a 501(c)3 non-profit organization founded in 2004. Educational purposeVisual Editors, NFP is a public charity that supports visual journalism literacy and student and professional scholarship with educational opportunities and resources. Develops and embraces scholarship projectsVisual Editors brings non-fiction visual storytellers together. VizEds built the first social network for visual journalists in 2004 … Continue reading "About"'
full_description = "About VISUAL EDITORS is a 501(c)3 non-profit organization founded in 2004. Educational purposeVisual Editors, NFP is a public charity that supports visual journalism literacy and student and professional scholarship with educational opportunities and resources. Develops and embraces scholarship projectsVisual Editors brings non-fiction visual storytellers together. VizEds built the first social network for visual journalists in 2004 that allowed international journalists to share and critique the best in visual reporting. The non-profit partners with journalism foundations, universities and organizations to produce projects that raise professional standards and help make visual journalism practices transparent to lay people. Promotes excellence in visual journalismThe non-profit is donor-funded. Events like the #MojoAwardsprovide opportunities for the public to contribute to our mission to recognize and rewards visual journalism scholarship. Visual Editors is the public charity that produces the Mobile Journalism Awards annual competition and expo to recognize excellence in non-fiction storytelling with smartphones. The event brings the global community of mobile journalists together to share and celebrate the best work being produced each year. Support our mission with a tax deductible contribution today.Visual Editors, NFP is an independent public charity with the IRS tax deductible classifications of 501(c)(3) and 170 (b)(1)(A)(vi). Institutional donors may request a copy of the organization’s 501(c)(3) tax-exempt letter from the IRS and the certificate of good standing issued by the Secretary of State. Visual Editors,NFP is listed in Guidestar. Certificate Visual Editors, NFP is publicly listed in ProPublica and by Dun & Bradstreet"
