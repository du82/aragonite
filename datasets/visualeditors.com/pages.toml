["https://www.visualeditors.com/mojoawards-finalists-for-season-four"]
title = "#MojoAwards: Season 4 winners - Visual Editors"
description = "These #Mojo short films have been selected for the fourth Season of the #MojoAwards - the #MobileJournalism international film festival."
full_description = "Posted on September 22, 2023November 1, 2024 by Editorial#MojoAwards: Season 4 winners The fourth season of the #MojoAwards is complete and three #Mojo films have been selected for the three categories: Best Documentary, Best Mobile Journalism, and Best Crisis Reporting. SEASON 4 WINNERS The Organ BuildersBarbara WeidmannMobile JournalismGermany Water scarcity in Tigherman village, MoroccoAyoub ToumiCrisis ReportingMorocco Beneath the Lonesome SkyeDirector Rob LaytonDocumentaryAustralia AWARDS SHOW Join the Live Awards Show on October 16, 2023 at 7 p.m. Berlin time. REGISTRATION IS FREEhttps://www.smartfilmschool.com/webinar/mobile-journalism-awards-2023/register CATEGORIES Mobile Journalism• An open call for feature stories, news reports, travel stories, and human-interest features that have been shot primarily with smartphones.NOTE: Judges can make several awards from work entered into this category. It all depends upon the variety, originality and quality of the work sent in.• Assets from other small mobile gear like portable mics, GoPros, Drones, 360° and Action Cams is allowed.• English Subtitles (burned in) are mandatory for any non-English scenes. • All aspect ratios are supported (Square, Horizontal, Vertical). Documentary• Non-fiction subject between 3 and 10 minutes in length on any topic. Must be accurately reported with integrity using journalism ethics. Creative approaches to editorial illustration and narrative exposition that push the frontier of the documentary genre forward are certainly welcome. Enter your #UkraineCrisis mojo stories in the Crisis Reporting category.(Photo of Ukraine refugees being welcomed to Berlin by Robb Montgomery) Crisis ReportingEntries may consist of reports, documentaries, live shots, news packages, or human-interest features that have been shot primarily with smartphones. • Stories can be filmed in any location (battlefield, border crossings, homes, in transit, or anywhere necessary to tell the story of the crisis).• Assets from other small mobile gear like portable mics, GoPros, Drones, 360°, and Action Cams is allowed, but material that was clearly produced with the capabilities of larger cameras is ineligible. • English Subtitles (burned in) are mandatory for any non-English scenes. All aspect ratios are supported (Square, Horizontal, Vertical). These awards make a real difference for mobile storytellers and the communities they serve. Global Film Screenings Winning films are screened at international journalism events throughout the year. Winning entries have been screened at the National Press Club (USA), the International Journalism Festival (ITALY), the Global Investigative Journalism Confernece (Sweden) and at U.S. Speaker mobile journalism events in Singapore, Spain, Austria, and Jamaica. Judges are free to make several awards from each open category. Students need not be intimidated to submit their work. In fact, a female student from Mexico was awarded Best Documentary honors in 2021. View Finalists films from all seasons at the Smart Film School. https://www.smartfilmschool.com/courses/mobile-journalism-awards CALL FOR ENTRIES – SEASON 5 https://filmfreeway.com/MobileJournalismAwards CategoriesNews"
