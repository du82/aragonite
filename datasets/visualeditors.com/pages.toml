full_description = "Posted on October 21, 2019July 15, 2021 by EditorialPrizes – Mobile Journalism Awards Prizes are awarded to Mobile Journalism Award winners thanks to gear being donated by some of the top names in the business. In-kind and cash donations to the public charity are accepted year-round to support the #MojoAwards and #MojoWorkshop events. Prize sponsors include Luma-Touch, Røde, Smart Film School, MoonDog Labs, IK Multimedia, Shoulderpod, and Shure. Luma Touch, for example, is providing a new iPad to the winner of the #FinishedOnMobile category. And MoonDog Labs has donates three gift certificates worth $200 each each season for gear sold in their online store. Winners are discovered via a random drawing each month from the early-bird entries. The drawing is conducted at MoondogLab HQ in New York and shared on social media – hashtag #MojoAwards. Røde has donated WirelessGo mics with Go lavs to add to the prize pool. Follow the #MojoAwards hashtag on Twitter for news about the Mobile Journalism Awards. Prizes going out to #MojoAwards Season 2 Winners. Congrats and thanks to sponsors @rodemics and @Shoulderpod for donating #Mojo kit to @vizeds public charity which produces the annual competition. pic.twitter.com/M0WG9duigu— Robb Montgomery (@videojournalist) July 14, 2021 Shoulderpod donates G2 mobile grips to the prize pool and IK multimedia donates iRig MIcPre 2 units. Become a sponsor of the #MojoWorkshop and #MojoAwards annual events. Pages: 1 2 CategoriesUncategorized"
