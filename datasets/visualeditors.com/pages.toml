full_description = "Posted on October 21, 2022November 1, 2024 by Editorial#MojoAwards: Season 3 Winners Best of #MobileJournalism: Meet the Season 3 winners of the #MojoAwards. The winners join host Robb Montgomery for the live screening and awards presentation. Watch the replay of the live #Mojo Awards Show from Berlin. In addition, the best films from the Mobile Journalism Awards competition are also curated in a permanent collection at the Smart Film School. All Finalists will receive a $500 gift certificate from the Smart Film School and gear prizes from the sponsor of the Mobile Journalism Awards. Finalists get cool #Mojo #Gear prizes at #MojoAwards. #MojoAwards 2022 Congratulate these mobile journalists whose work was selected by a jury of six judges to best of Mobile Journalism for 2022. CRISIS REPORTING – Winner Welshpool’s response to the Ukraine crisis David Rhys Williams United Kingdom DOCUMENTARY – Winner The Herald Trevor Locke, Larry Locke United States DOCUMENTARY – Finalist (PAUSE) Marcelo Ignacio Lagreze Chile MOBILE JOURNALISM STORY – Winner Free running on the roofs of Paris Ariane Limozin France MOBILE JOURNALISM STORY – Finalist Rescue Training Kevin Crane Canada Free running on the roofs of Paris The Herald Rescue Training (PAUSE) Ariane Limozin in Paris with her prize for winning Best Mobile Journalism story. Thanks to IK Multimedia for sponsoring the #MojoAwards. Ariane writes that her win earned her the attention of her media group’s big boss who want to promote her as a result. That is a great outcome! Kudos to all the participants in the Mobile Journalism Awards. Entering this competition can sharpen your skills and improve your confidence. Call for Entries for Season 4 of the #Mojo Awards https://filmfreeway.com/MobileJournalismAwards Learn the categories and rules for entering the #MojoAwards CategoriesNews"
