title = "Sponsor #MojoAwards - Visual Editors"
description = 'Sponsors of the Mobile Journalism Awards donate prizes to support the mission of Visual Editors in advancing visual journalism scholarship. The following sponsors support the #MojoAwards.Zacuto, Blackmagic Design, United Nations agency IFAD, Luma-Touch, Røde, Smart Film School, MoonDog Labs, Filmocracy, IK Multimedia, Shoulderpod, and Shure. The Mobile Journalism Awards advance, identify and celebrate the best … Continue reading "Sponsor #MojoAwards"'
full_description = 'Sponsor #MojoAwards Sponsors of the Mobile Journalism Awards donate prizes to support the mission of Visual Editors in advancing visual journalism scholarship. The following sponsors support the #MojoAwards.Zacuto, Blackmagic Design, United Nations agency IFAD, Luma-Touch, Røde, Smart Film School, MoonDog Labs, Filmocracy, IK Multimedia, Shoulderpod, and Shure. Winners also get cool #Mojo #Gear prizes at #MojoAwards. The Mobile Journalism Awards advance, identify and celebrate the best mobile journalism reporting each year. Visual Editors, NFP is a 501(c)(3) public non-profit founded in 2004 to serve visual journalism education. In-kind and cash donations are accepted. COMMON VALUES PROPOSITION Visual Editors, NFP is a public charity and can accept donations of almost any kind. The Mojo Awards is front and center with broadcast journalism educators, international journalists, and news executives at the world’s top media houses. Official sponsors select a focus area to fund. They donate prizes for winners including cash and travel awards, filmmaking gear, vouchers for certificate training, workshops, and scholarships. There are many ways to contribute. Recent winners from Season Five include powerful stories from international broadcasters: Swedish Public Television. ITV News and a prominent filmmaker from Ukraine. #MojoAwards Winners SPONSOR BENEFITS Sponsor support is showcased in screening events at the NABshow, International Journalism Festival, in all media notices and public communications. The International Journalism Festival gives unprecedented exposure to journalists and it is the venue where we screen winning films every year. The festival is always the largest journalist conference in Europe. Its success in 2024 elevated it to the largest in the world, featuring more than 600 speakers across 200 events, and more than 3000 attendees. Organizers conceded attendance was greater than anticipated, and have promised a large venue for the Mobile Journalism Awards ceremony in 2025. The awards have earned the official support of a top United Nations agency — International Fund for Agricultural Development — who joins as an official sponsor of the Awards. IFAD will be hosting a red carpet reception at the Festival following the cinema screening. MojoAward winning films are screened in Perugia at the International Journalism Festival (Photo by Rob Layton) MATCHING GIFTS TO CHARITY As the Mojo Awards program has grown larger and more influential, the logistics and expenses for producing the program have grown significantly. Sponsors agree to match the value of their in-kind donation with an equal dollar value donation to the Visual Editors, NFP charity to offset operating expenses. Donations also support the charity’s Scholarship fund. Sponsors receive a letter from the charity that can be used for claiming tax advantages. No staff, officers, or board members receive a salary from the charity. A GLOBAL COMMUNITY The Mojo Awards sponsorship provides you with a unique platform to showcase your values to the global audience of Mobile Journalism. High quality mobile video journalism is now mainstream, with many of the world’s national broadcasters (eg, the BBC, CBC, ABC) fully committed, having incorporated mojo into their news strategies. From documentary film to investigative and current affairs reporting, Mobile filmmaking is an in-demand skill that is recognized and rewarded by the efforts of the charity and this awards program. The Australian Broadcasting Corporation last year completed a national roll-out of mojo to all ABC regional bureaus (metros in 2022), and is near-complete in its Pacific Island roll out under a federal government scheme with Pacific nations. News Corp’s Digital News Academy in Australia places mojo training as a priority for online video content. The BBC trains British journalists nationally in mojo, and have been ingesting mobile packages into nightly bulletins since at least 2018. CALENDAR Call for entries opens Sept. 14 Deadline is Feb. 14 Finalists announced in March Screening events are in April at NABshow and International Festival of Journalism Winners announced in April Contact the Chair of the mobile Journalism Awards, Robb Montgomery, to request a sponsor deck and discuss your participation. Your Name (required) Your Email (required) Subject Your Message Which is larger? 7 or 3? Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
