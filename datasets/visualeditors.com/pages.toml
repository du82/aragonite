["https://www.visualeditors.com/win-1000-and-a-trip-to-mojo-awards-in-italy-new-category-and-sponsor-for-mobile-journalism"]
title = "Win $1,000 and a trip to #Mojo Awards in Italy - New Category and sponsor for Mobile Journalism - Visual Editors"
description = "Mobile Journalists can win $1,000 cash and a paid trip to the #Mojo Awards event at the International Journalism Festival in Perugia, Italy."
full_description = 'Posted on June 11, 2024November 1, 2024 by EditorialWin $1,000 and a trip to #Mojo Awards in Italy – New Category and sponsor for Mobile Journalism FOR IMMEDIATE RELEASE Mobile Journalists can win $1,000 cash and a paid trip to the #Mojo Awards event at the International Journalism Festival in Perugia, Italy. This prize and the travel award is thanks to a new Category and a new sponsor of Mobile Journalism Awards. Here are the details. RURAL VOICES AWARD This new award will go to the best story (shot on a mobile phone) highlighting rural issues or reporting on the challenges of daily life of people living in rural or remote areas of the world, whether focused on food security, the effects of climate change and challenges of farming, issues around connectivity, access to markets/transport etc., challenges of youth unemployment or other. We are particularly interested in entries from people living in fragile environments and crisis areas. Entries from rural women, youth and people from indigenous communities are particularly welcome. WHO IS THE SPONSOR? The International Fund for Agricultural Development (IFAD) is an international financial institution and a specialized agency of the United Nations dedicated to eradicating poverty and hunger in rural areas of developing countries. IFAD is based in Rome. WHAT IS THE PRIZE? IFAD will offer a cash prize of US$ 1000. IFAD will provide flights and accommodation (up to the value of US$3,000 for the winner to attend, take part and receive their award at a MOJO awards event at the International Journalism Festival in Perugia in April 2025. (Visa situation allowing). If that is not feasible within the time frame, we would arrange a special event in their own country to honor them at one of IFAD’s regional offices and arrange a hybrid meeting with Italy. IFAD will invite the winner to take part in an event/side event at the IFAD Governing Council 2026. (Either in person or virtually) WHY IS THIS IMPORTANT? IFAD works with some of the world’s poorest rural people, many of whom live in remote areas that too often are isolated and overlooked by the rest of the world. Shooting video with a mobile/cellular phone is a relatively cheap, accessible and inclusive way for journalists and filmmakers to tell their stories and in some cases for rural people to tell their own stories themselves. By sponsoring this award IFAD wishes to encourage more people to adopt this form of filmmaking and in turn shine a bigger spotlight on rural communities and the issues they face. HOW TO ENTER Enter Mobile Journalism Awards using the Film Freeway platform. There is a nominal entry fee of US$25 (US$15 for students). WHO IS ELIGIBLE TO ENTER? The entrant needs to be over 18 years of age (as demonstrated by a valid ID). The film needs to be shot on a smart mobile phone by one person/crew and be between 1- 5 minutes in length. The film can be landscape or portrait. The film can be professionally edited (but doesn’t have to be) The film can be in any language but needs to have English subtitles for the entry. The film must have been shot between January 2024 and December 2024. The film must have taken place in one of IFAD’s Member States. Details of our 178 members can be found here. The author/director of the film must have been born or be living in one of IFAD’s Member States. CONTACT PERSONS Robb Montgomery, Chair, Mobile Journalism AwardsMichelle Porter, Video Communications Specialist, International Fund for Agricultural Development (IFAD) Your Name (required) Your Email (required) Subject Your Message Which is larger? 7 or 3? Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); CategoriesNews'
