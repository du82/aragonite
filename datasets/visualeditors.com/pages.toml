full_description = "Posted on September 14, 2023November 1, 2024 by EditorialCALL FOR ENTRIES: Mobile Journalism Awards – Season 5 Press releaseSEPTEMBER 14, 2023 Enter the ‘Academy Awards’ of Mobile Journalism The search is on to find the best mobile stories produced by reporters with smartphones. Winners receive valuable prizes and have their work screened at international festivals. Enter here. CALL FOR ENTRIES https://filmfreeway.com/MobileJournalismAwards Mobile journalists are invited to submit short form videos and films to the #MojoAwards competition. Mobile Journalism Awards Categories• Documentary• Crisis Reporting• Mobile Journalism This is the fifth edition of the Mobile Journalism Awards and the festival attracts entries from international journalists, media students, journalism educators, and others who have a talent for non-fiction storytelling in film. Past winners have included broadcast reporters, student journalists and freelancers. SMALL CAMERAS, BIG STORIES “This competition showcases the best stories and mobile storytellers each year.” “Reporters are telling big stories with small cameras. The judges are amazed at how the quality of the films improves each season.”“By raising the standards for mobile journalism and hosting public screenings, these mobile film awards help journalists increase the impact of their non-fiction storytelling.” Robb MontgomeryChair, Mobile Journalism Awards PRIZES Winning films are screened at the NABShow in Las Vegas and the International Festival of Journalism each April. Each journalist who has a film selected as a finalist will also be awarded a $500 gift certificate from the Smart Film School. Category winners also win mobile filmmaking gear from a prize pool donated by sponsors including: Røde, IK Multimedia, Shoulderpod, and Shure. Winners also get cool #Mojo #Gear prizes at #MojoAwards. Season three winner Arianenne Limozin with her gear prize in Paris. The best stories from this annual competition are curated in a permanent collection at the Smart Film School. A list of previous winners can be found here. JURY The judges for the Mobile Journalism Awards visual journalism professionals and educators from respected journalism institutions. Marta Machado, Thomson Reuters Foundation, London Marcela Kunova, Journalism Co UK Becky Beamer, Photo Journalism Professor, Oslomet University, Norway Robert Stewart, Emeritus Director, E. W. Scripps School of Journalism Kim Fox, Professor, The American University Cairo Jacques Rosselin, Head of the EFJ School of New Journalism, Paris Naila Hamdy, Director, The American University Cairo INTERNATIONAL ENTRIES The #MojoAwards competition receives entries from reporters in United States, India, Brazil, United Kingdom, Mexico, China, Italy, France, Canada, Russian Federation, S. Korea, Egypt, Germany, Iran, Chile, Jordan, Bulgaria, Dominican Republic, Hong Kong, Ireland, Qatar, Sudan, Tunisia, Switzerland, and Israel. FESTIVAL PARTNERS USAE.W. Scripps School of JournalismVisual Editors non-profitBroadcast Educators AssociationNational Association of BroadcastersSociety for News DesignLONDONJournalism co.ukPARISEFJ School of New JournalismCAIROThe American University, Department of Journalism and Mass CommunicationBUENOS AIRESLatin American Congress of Mobile Journalism VISUAL EDITORS The #MojoAwards are a project of Visual Editors, NFP, a Chicago-area 501(c)(3) non profit that supports visual journalism scholarship. CALL FOR ENTRIES https://filmfreeway.com/MobileJournalismAwards CONTACT Robb Montgomery -30- CategoriesUncategorized"
