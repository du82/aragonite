. However, Test-Dev allows for 10 submissions per day. The download page contains links to all VQA v2.0 train/val/test images, questions, and associated annotations (for train/val only). Please specify any and all external data used for training in the "method description" when uploading results to the evaluation server. Results must be submitted to the evaluation server by the challenge deadline. Competitors' algorithms will be evaluated according to the rules described on the evaluation page. Challenge participants with the most successful and innovative methods will be invited to present. Tools and Instructions We provide API support for the VQA annotations and evaluation code. To download the VQA API, please visit our GitHub repository. For an overview of how to use the API, please visit the download page and consult the section entitled VQA API. To obtain API support for COCO images, please visit the COCO download page. To obtain API support for abstract scenes, please visit the GitHub repository. For challenge related questions, please contact visualqa@gmail.com. In case of technical questions related to EvalAI, please post on the VQA Challenge forum. Frequently Asked Questions (FAQ) As a reminder, any submissions before the challenge deadline whose results are made publicly visible on the "Test-Standard" leaderboard OR are submitted to the "Test-Challenge" phase will be enrolled in the challenge. For further clarity, we answer some common questions below: Q: What do I do if I want to make my test-standard results public and participate in the challenge? A: Making your results public (i.e., visible on the leaderboard) on the "Test-Standard" phase implies that you are participating in the challenge. Q: What do I do if I want to make my test-standard results public, but I do not want to participate in the challenge? A: We do not allow for this option. Q: What do I do if I want to participate in the challenge, but I do not want to make my test-standard results public yet? A: Submit to the "Test-Challenge" phase. This phase was created for this scenario. Q: When will I find out my test-challenge accuracies? A: We will reveal challenge results some time after the deadline. Results will first be announced at our Visual Question Answering and Dialog Workshop at CVPR 2019. Q: Can I participate from more than one EvalAI team in the VQA challenge? A: No, you are allowed to participate from one team only. Q: Can I add other members to my EvalAI team? A: Yes. Q: Is the daily/overall submission limit for a user or for a team? A: It is for a team. Organizers Ayush Shrivastava Georgia Tech Karan Desai Georgia Tech Yash Goyal Georgia Tech Aishwarya Agrawal Georgia Tech Dhruv Batra Georgia Tech / Facebook AI Research Devi Parikh Georgia Tech / Facebook AI Research (function(i, s, o, g, r, a, m) { i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function() { (i[r].q = i[r].q || []).push(arguments) }, i[r].l = 1 * new Date(); a = s.createElement(o), m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m) })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga'); ga('create', 'UA-63638588-1', 'auto'); ga('send', 'pageview'); $(document).foundation();'''
