title = "Thank you for downloading Visual Studio - Visual Studio"
description = "C++, C, and assembly language development tools and libraries are available as part of Visual Studio on Windows. You can use C++ in Visual Studio to create anything from simple console to Windows desktop apps, from device drivers and operating system components to cross-platform games for mobile devices, and from small IoT devices to multi-server computing in the Azure cloud."
full_description = '''Thank you for downloading Visual Studio2024-03-26T13:50:30-07:00 Thank you for downloading Visual Studio Your download will start shortly. If your download does not begin, click here to retry var downloadResult = {result: 'skuFailed'} .fill-off-violet button { background-color: #3B2E58!important; color: #fff!important; } a.vscom-btn-wire.fill-off-black { border-color: #191919; color: #191919; } .vs-modern-downloads ul li:before { background: red; display: none; } @media (max-width: 1084px){ .vscom-hero-h3 { min-height: 16rem; } } Getting started New to Visual Studio Install Getting Started Start a tutorial C++ .NET JavaScript/TypeScript Node.js Python Expand your skill by area New to Visual Studio?Learning a new development tool can be overwhelming. Take this step-by-step learning journey at your own pace to successfully create a simple app in any language of your choice. Let’s get started! Install Visual StudioFirst please make sure to open your Visual Studio download and install. You can save installation time and disk space by selecting just the components needed. You can always incrementally add more components later at any time as needed. Getting started with Visual Studio IDETo develop any type of app or learn a language, you’ll be working in the Visual Studio Integrated Development Environment (IDE). Beyond code editing, Visual Studio IDE brings together graphical designers, compilers, code completion tools, source control, extensions and many more features in one place. Watch this short video to get familiar with the IDE and to learn how to use it for basic tasks. You can personalize the Visual Studio IDE in various ways to best support your own development style and requirements. Prefer dark theme? Want to change the layout of windows to your liking? Have favorite keyboard shortcuts? Check out this short video where we walk you through some cool personalization options like themes, fonts, window layout, and custom keyboard shortcuts available in Visual Studio. Start a tutorialRecommended for you C++ C++, C, and assembly language development tools and libraries are available as part of Visual Studio on Windows. You can use C++ in Visual Studio to create anything from simple console to Windows desktop apps, from device drivers and operating system components to cross-platform games for mobile devices, and from small IoT devices to multi-server computing in the Azure cloud. Desktops apps Step by step tutorial Let’s get started with something simple. Begin your learning by creating a console calculator app Additional Guides C++ in Visual Studio .NET Using Visual Studio and .NET, you can develop applications for desktop, web, mobile, games, and IoT. You can write .NET apps in C#, F# or Visual Basic language. Desktop development using .NET Core Watch Learn from .NET Core 101 video playlist Step-by-step tutorial To start simple, create a Windows console app with .NET Core. Also learn how to debug and publish Ready to do more? Here’s another .NET Core step-by-step tutorial to follow along and learn: Windows desktop app Web/Cloud development using ASP.NET Core Watch ASP.NET 101 video series Step by step tutorial Create web app with ASP.NET Core Razor pages Game development using Unity Watch Unity 101 video series. Watch how to code, debug and publish games using Unity and C# Guides Get to know game development in Visual Studio with Unity. Learn more Machine Learning using ML.NET Watch Video series Step-by-step 10 minute tutorial Using ML.NET in Visual Studio train and use your first machine learning model JavaScript/TypeScript Visual Studio provides rich support for JavaScript development, both using JavaScript directly, and also using the TypeScript, an open-source language which builds on JavaScript and is often used in large size web app development. Web application Learn how to create an ASP.NET Core web application using Typescript Additional guides JavaScript and TypeScript in Visual Studio Node.js Visual Studio has built in tools for Node.js which is a platform for building fast and scalable server applications using JavaScript. Node.js is the runtime and npm is the Package Manager for Node.js modules. Learn what makes Visual Studio a powerful node.js development environment. Web/Cloud development with Node.js tools Create a web app in Visual Studio using Node.js tools with Express web app framework React Web UI React is a popular JavaScript library developed by Facebook for building web application user interfaces. Create a simple web app using Node.js tools in Visual Studio with React. Join Node.js Tools for Visual Studio community on GitHub Python Watch Python development in Visual Studio Visual Studio is a powerful IDE for Python language through its built-in Python Development and Data Science workloads. Python is a popular, easy to learn, free to use programming language with many free libraries. In Visual Studio, use Python to build web applications, web services, desktop apps, scripting, and scientific computing. It is used by many universities, scientists, casual, and professional developers alike. Data Science and Analytical applications Step by step tutorial Create your first Python app using interactive development Desktop app Step by step tutorial Desktop app using Python in Visual Studio Additional guides Python in Visual Studio Web applications Step by step tutorial Create a Python web app using Visual Studio with Django Expand your Visual Studio skills by areaReady to do more? Extend your skills with additional learning modules recommended for your learning path DevelopWrite and manage your code using the code editor BuildCompile and build your source code Version ControlShare code using source control technologies such as Git and TFVC. DeployShare your apps and code by using Web Deploy, InstallShield, NuGet, Continuous Integration, and more. ExtendAdd your own functionality to the Visual Studio IDE improve your development experience. DataCreate data apps that connect to any database or service, and anywhere—local or cloud. DebugWrite and manage your code using the code editor Github CopilotWrite code more productively and efficiently with AI-powered code suggestions and chat conversations. DevOpsContinuously build and release your apps in the cloud, and implement Agile practices with Azure DevOps Services. (function ($) { $(document).ready(function () { //menu position var menuPosition = $('.nav-col').offset(); $(window).on('scroll', function () { var height = $(window).scrollTop(); // put menu to fix position if (height > menuPosition.top) { $('.nav-col').addClass('fixed-nav'); $('.nav-col').removeClass('nav-col--fixed-to-bottom'); } else { $('.nav-col').removeClass('fixed-nav'); } //add class to menu if any landing card on screen $('.landing-card').each(function () { if (height >= $(this).offset().top -60) { var id = $(this).attr('id'); $('.nav-list li').removeClass('selected'); $('.nav-list li a[href="#' + id + '"]').parent().addClass('selected'); } }); //if menu touch footer var menu_top = $('.nav-col').offset().top; var footer_top = $('#footerArea').offset().top; var menu_bottom = menu_top + $('.nav-col').height(); var footer_bottom = footer_top + $('#footerArea').height(); if (menu_bottom >= footer_top && menu_top < footer_bottom) { $('.nav-col').removeClass('fixed-nav'); $('.nav-col').addClass('nav-col--fixed-to-bottom'); } }); $(window).keydown(function(e){ if(e.which ==9 || e.keycode==9) { if( $('.nav-col').hasClass('nav-col--fixed-to-bottom')){ $('.nav-col').removeClass('nav-col--fixed-to-bottom'); } } }); dropdown(); // show the tech header when hash tag appear in url var hash = window.location.hash; tech_ids = []; $('.tech-cards .landing-card').each(function () { tech_ids.push('#' + this.id); }); if (hash) { if (tech_ids.indexOf(hash) > -1) { $('.tech-header').removeClass('hide'); $('.tech-header').insertBefore($(hash)); } $('html, body').animate({ scrollTop: $(hash).offset().top - 160 }, 5