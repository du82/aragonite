full_description = '''Visual Studio Subscription Support2025-02-13T13:54:48-08:00 Visual Studio Subscription Support Frequently asked questionsSearch the FAQ to find answers to common support questions about subscriptions, accounts, and billing. Use the buttons on the right to switch between subscriber and administrator. @media screen and (max-width: 600px){ #main .vscom-swimlane { padding: 10px 12px!important; } } .vscom-subscription-tabs .fusion-accordian .fusion-panel { padding: 5px 20px; margin-bottom: 14px; border: 1px solid #757575; background-color: #ffffff; border-radius: 4px; } .fusion-accordian .panel-title a { font-size: 18px !important; padding: 14px 0 !important; } .vscom-toggle.fusion-accordian .panel-body { padding: 10px 10px 10px 32px; } .vscom-subscription-tabs .fusion-accordian .panel-body ul, .vscom-subscription-tabs .fusion-accordian .panel-body ol { padding-left: 20px; padding-bottom: 20px; } .fusion-accordian .panel-title a:hover { color: #191919 !important; } .vscom-toggle.fusion-accordian .panel-title a:hover .fusion-toggle-heading { text-decoration: none; } .fusion-text.vscom-faq-search { display: block; text-align: center; } .faq-input-wrapper { margin-left: auto; max-width: 15rem !important; } .vscom-faq-search .faq-input-wrapper { margin-top: 24px; } #faq-search-input { border: none; border-bottom: 1px solid var(--clr-black); } .faq-radio-wrapper { margin-right: 0px !important; border-bottom: 1px solid #191919; position: relative; } .faq-radio-wrapper ul li { border-bottom: 0px !important; border: 1px solid; padding: 8px; border-top-left-radius: 15px; border-top-right-radius: 15px; line-height: 40px; width: 12rem !important; display: inline-block; margin: auto; position: relative; } .faq-radio-wrapper input[type='radio'], input[type=radio]:not(old)+label:before { position: absolute; height: 0; width: 0; } input[type=radio]:not(old)+label { display: inline-block; margin-left: 0px; padding-left: 0px; line-height: 38px !important; width: 100%; position: relative; } @media (min-width: 700px){ .faq-radio-wrapper ul li { margin-right: 15px !important; } .faq-radio-wrapper ul li { border-width: 1px 1px 0px 1px !important; } .faq-radio-wrapper li.selected { bottom: -1px; position: relative; background: #fff; border-bottom: none !important; } .modern-support-find .vlaunch-link { display: inline-flex; gap: 40px; } } @media (max-width: 600px){ .faq-radio-wrapper ul li { line-height: 30px; width: 8rem !important; } .faq-radio-wrapper ul li.selected { background: #f8f8f8; } .faq-radio-wrapper { border-bottom: none; } .faq-radio-wrapper ul { border-bottom: 1px solid #191919; } .faq-radio-wrapper ul li.selected { bottom: -1px; position: relative; background: #fff; border-bottom: none !important; /*border-bottom-width: 5px; border-bottom-color: #8661c5;*/ } div#topLevelDiv .ui-button { border-bottom: 1px solid #ddd !important; } } @media (max-width: 1084px){ .faq-tab-row{ margin-bottom: 0px !important; } } jQuery(document).ready(function() { $('.faq-radio-wrapper ul li:first').addClass('selected'); $(".faq-radio-wrapper ul li").on('click', function() { $(this).addClass('selected').siblings().removeClass('selected'); }); }); .vscom-faq-search { display: flex; } .faq-input-wrapper { flex: 1 1 50%; } .faq-radio-wrapper { flex: 0 1 auto; margin-right: 1.5rem; } .faq-radio-wrapper ul { list-style: none; margin: 0; padding: 0; } .faq-radio-wrapper li { display: inline; margin-left: 1.25rem; } .faq-radio-wrapper li:first-of-type { margin-left: 0; } .faq-radio-wrapper input { margin-right: 0.25rem; margin-left: 0.5rem; } .faq-radio-wrapper label { width: auto; font-size: 1.125rem; font-weight: 400; } .faq-radio-wrapper input[type='radio'] { width: 0; margin: 0; padding: 0; opacity: 0; } input[type=radio]:not(old)+label { display: inline-block; line-height: 24px; position: relative; } input[type=radio]:not(old)+label:before { content: "\ECCA"; left: 0; top: 2px; position: absolute; width: 0; height: 0; overflow: hidden; font-family: "VSCOMIcons"; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-style: normal; font-variant: normal; font-weight: normal; text-decoration: none; text-transform: none; } input[type=radio]:not(old):focus+label:after { content: ' '; left: 0; right: 0; top: 0; bottom: 0; position: absolute; outline: 1px solid #000; } input[type=radio]:not(old):active+label::before, input[type=radio]:not(old)+label:active::before, input[type=radio]:not(old):checked+label::before { content: "\ECCB"; } input[type=radio]:not(old)+label:hover { cursor: pointer; } input[type=radio]:not(old):checked+label:before { background-position: -46px 0; } .faq-input-wrapper { position: relative; max-width: 35rem; } #faq-search-input { width: 100%; padding: 0.5rem 1rem; height: auto; position: relative; } #faq-search-input { font-size: 0.875rem; color: #323130 !important; } #faq-search-input::placeholder { font-size: 0.875rem; color: #323130 !important; } #faq-search-input:-ms-input-placeholder { font-size: 0.875rem; color: #323130; } .vscom-no-faq-results { display: none; } #faq-clear-button { display: none; } #faq-clear-button .vscom-icon--Clear:before { font-size: 10px; font-weight: 600; } #faq-search-button, #faq-clear-button { position: absolute; right: 2px; top: 2px; bottom: 2px; padding: 4px 12px; background: #FFF; border: 0; font-size: 1rem; color: #323130 !important; } #faq-search-button:hover, #faq-clear-button:hover { background: #F1F1F1; cursor: pointer; } #faq-clear-button .vscom-icon, #faq-search-button .vscom-icon { position: relative; display: flex; } @media screen and (max-width: 800px) { .vscom-buildertabs.vscom-buildertabs--mobile .vscom-buildertabs-button { border-top: 1px solid #C8C6C4; padding: 0.6rem 0; } .vscom-faq-search { flex-direction: column; align-items: center; } .faq-radio-wrapper { order: 1; margin-bottom: 1rem; } .faq-input-wrapper { order: 2; max-width: unset; width: 100%; } } .faq-radio-wrapper, .faq-input-wrapper { margin-top: 10px; } .vscom-search-faq--admins { display: none; } Subscribers Admins Managing Subscription Downloads and Benefits Signing in Purchasing, renewing, canceling and billing Managing Subscription .fusion-accordian #accordion-58904-1 .panel-title a .vscom-icon{color:#979593}.fusion-accordian #accordion-58904-1 .panel-title a .vscom-icon:before{font-size:16px;width:16px}.fusion-accordian #accordion-58904-1 .panel-title a{font-size:24px}#accordion-58904-1 .fusion-toggle-boxed-mode:hover .panel-title a .fusion-toggle-heading,.fusion-accordian #accordion-58904-1 .panel-title a:hover{color:#0078d4} Expand AllCollapse All I'm a new administrator. Where is everything I need to know? The administrator webpage has all your updates, videos and important links. Then, written guidance on being an administrator is in our documentation. How do I manage administrators? If you are a Super Admin you can add or remove other Super Admins or Administrators. Administrators can only add or remove subscribers and will not see the Manage Administrators tab in the Admin Portal. To manage administrators: Select the Manage Administrators tab at the top of the page on manage.visualstudio.com. To add, select Add and type the name and email address of the person you would like to add, select the appropriate agreement from the drop down menu, select the language that they should receive their welcome email in, and select Super Admin. To remove, simply select the person you would like to remove and select Delete. Cloud subscriptions are managed by administrators who are assigned to the Azure subscription used to purchase the cloud subscriptions. The owner of the subscription is automatically assigned as the first administrator. To assign more administrators: Connect to the Azure Portal at portal.azure.com Sign in with the account you used to purchase the Visual Studio Cloud subscriptions. In the left navigation pane, scroll down to Cost Management + Billing. In the My subscriptions list, choose the Azure subscription that you used to make the purchase. Click Access control, which is located near the top of the list in the left navigation pane. Click the Add tab at the top of the page. In the fly-out pane on the right, click on the name of the subscriber you wish to make an administrator. Click on the Role drop-down at the top of the pane, scroll down, and select User Access Administrator. Click Save. Learn more about administration of cloud subscriptions. How do I assign Visual Studio subscriptions? You can assign subscriptions to your end users one at a time, or using the Bulk add feature to quickly and easily upload a larger number of subscribers at a time. To assign subscriptions individually: Select the Manage Subscribers tab at the top of the page on manage.visualstudio.com Select Add and type the name and email address of the user you'd like to assign a subscription to. If your organization is using Azure Active Directory the name field will search to find people in your current directory. You can select from the search results, or add someone manually. If you want the subscriber to have access to software downloads when they sign into the Visual Studio Subscriptions Portal, make sure to leave the downloads toggle enabled in the Download settings section. Complete the Communication Preferences section so that we know what language to send your subscribers assignment email in. If you'd like to add any notes associated with the assignment, please use the Reference selection. Select Add at the bottom of the fly-out panel to complete your subscription assignment. Your subscriber will receive an email and can begin using their Visual Studio subscription immediately (there is no activation needed from your subscriber). To Bulk assign subscriptions: Select the Manage Subscribers tab at the top of the page on manage.visualstudio.com. Select Bulk add, download the Excel template, and save a local copy. All fields are required, with the exception of the Reference field. Ensure that none of the form fields contain commas. Remove spaces before and after form fields. Ensure names do not contain extra spaces between two-part first or last names (for example, if a person has a two-part first name such as 'Maggie May', it should be typed as 'MaggieMay'). Return to manage.visualstudio.com, select Bulk add, and upload your saved copy of the Excel template. When the upload is successful you will see a confirmation page, and your subscriber list populated with your new subscribers. Your subscribers will receive an email and can begin using their Visual Studio subscription immediately (there is no activation needed from your subscribers). Read more information about assigning subscriptions in the Visual Studio Subscriptions Administrator portal to learn more about quickly and easily assigning subscriptions. Learn more about managing Visual Studio subscriptions with GitHub Enterprise. What is the GitHub Enterprise setup process? GitHub Enterprise is set up and managed separately from Visual Studio subscriptions. Following a Visual Studio subscription with GitHub Enterprise purchase, a GitHub Enterprise account setup process is initiated in parallel with (but separate from) establishing an agreement in manage.visualstudio.com. Establishing this GitHub Enterprise account may take some time. After your company has set up a GitHub Enterprise account, subscribers who have been assigned Visual Studio subscriptions with GitHub Enterprise will receive an email from GitHub notifying them that their Visual Studio subscriptions have been linked. After subscribers receive this email, they can reach out to their GitHub organization administrator to receive an invitation to the appropriate organization. Read more about managing Visual Studio subscriptions with GitHub Enterprise. Reference subscriber documentation for additional details on the GitHub Enterprise set up process. What is the difference between a Sign-in email address and a Notification email address? Individuals who are assigned a subscription will receive periodic communications from the Visual Studio team, including an email letting them know they have been assigned a subscription. If these emails should be sent to a separate email address than that which they should sign into the Visual Studio Subscriptions Portal or VS IDE you can add a notification email address when adding a subscriber, or when editing an existing subscriber. I have a new agreement. How do I move my subscribers? You can export your subscribers from your previous agreement and add them to your new agreement using the Bulk add button. Note: your subscribers will receive an email when the new subscription is assigned to them. Learn more about exporting subscribers and using the Bulk add feature. If you have more than 200 subscribers on your previous agreement our support team can assist you. Select Account, Subscription, and Billing Support and select your country/region. Depending on your location, support may be available via email, chat, or phone. Why is the portal not showing the correct number of Visual Studio subscriptions for my agreement? If you're not seeing the correct number of subscriptions for your agreement, you may have the wrong agreement selected in the portal. Click on the drop-down in the top left to see all available agreements. If you are still seeing an incorrect number of subscriptions our support team can assist you. Select Account, Subscription, and Billing Support and select your country/region. Depending on your location, support may be available via email, chat, or phone. How can I select an end date for a subscription? Subscriptions are always assigned using the best available end date. For example, if your agreement has orders with an end date of 6/20/2020 and another one with an end date of 6/20/2021 the first subscription to be assigned from those two available will end on 6/20/2021. If you have a trusted agreement in an overallocated state, the end date will be 3 years from the date the subscription was assigned. Why does my SLP agreement have an end date, and why is it sometimes different for my subscribers? SLP and MPSA agreements don't expire, however our portal currently requires an end date when provisioning the agreement. We currently use an end date of 20+ years in the future for each order under your SLP. If you have multiple orders under your SLP agreement from different days, they will have different end dates. What is the GitHub setup process? GitHub Enterprise is set up and managed separately from Visual Studio subscriptions. Following a Visual Studio subscriptions with GitHub Enterprise purchase, a GitHub Enterprise account setup process is initiated in parallel with (but separate from) establishing an agreement in manage.visualstudio.com. Establishing this GitHub Enterprise account may take some time. After your company has set up a GitHub Enterprise account, subscribers who have been assigned Visual Studio subscriptions with GitHub Enter'''
