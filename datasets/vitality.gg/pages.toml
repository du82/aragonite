["https://vitality.gg/esports/team-vitality-renouvelle-son-roster-de-stars-americaines-sur-teamfight-tactics"]
title = "TEAM VITALITY RENOUVELLE SON ROSTER DE STARS AMERICAINES SUR TEAMFIGHT TACTICS | Team Vitality"
description = "Team Vitality annonce la prolongation de son équipe Teamfight Tactics (TFT), après une année 2024 marquée par de nombreux succès,"
full_description = "Esports TEAM VITALITY RENOUVELLE SON ROSTER DE STARS AMERICAINES SUR TEAMFIGHT TACTICS Team Vitality annonce la prolongation de son équipe Teamfight Tactics (TFT), après une année 2024 marquée par de nombreux succès, dont une place dans le Top 4 de l’Esports World Cup 2024. Le roster américain, composé de Kevin « setsuko » Jiang, Michael « k3soju » Zhang, Jeffrey « Milk » Pan et Kevin « Prestivent » Zou, réunit certains des joueurs et streamers les plus influents de la scène TFT. Leur engagement et leurs performances contribuent à renforcer la présence de Team Vitality en Amérique du Nord et à faire rayonner le club à l’international. Ce renouvellement témoigne de la volonté de Team Vitality de s’imposer durablement sur la scène compétitive mondiale, tout en séduisant de nouveaux fans à travers des compétitions, du streaming et du contenu exclusif. Team Vitality est fière d’annoncer le renouvellement de son équipe Teamfight Tactics (TFT). L’équipe américaine composée de Kevin ‘setsuko’ Jiang, Michael ‘k3soju’ Zhang, Jeffrey ‘Milk’ Pan, et Kevin ‘Prestivent’ Zou va continuer à représenter Team Vitality sur la scène mondiale jusqu’à la fin de l’année 2025. Ce roster témoigne de l’engagement de Team Vitality à construire des relations à long terme avec les meilleurs talents et renforcer son expansion sur la scène esport américaine.TEAM VITALITY A LA CONQUETE DE L’ARENE TFTLe roster s’apprête à vivre une saison intense, marquée par des compétitions majeures. L’équipe prendra part au Riot Games TFT Esports Circuit, le rendez-vous incontournable de la scène. En décembre 2025, elle va également disputer le TFT Open LAN à Paris, berceau de Team Vitality. Un événement clé où les joueurs auront à cœur de démontrer leur talent et d’affirmer leur statut parmi l’élite de la scène TFT devant de nombreux fans ! L’équipe est composée de : Michael ‘k3soju’ Zhang – Michael « k3soju » Zhang est l’un des streamers les plus influents de la scène Teamfight Tactics (TFT) à l’échelle mondiale. Ancien compétiteur sur League of Legends, il s’est imposé comme l’une des figures emblématiques de TFT, aussi bien en tant que joueur qu’en tant que créateur de contenu. Son parcours compétitif est marqué par de nombreuses performances, notamment une deuxième place au Dragonlands: North America Regional Finals, qui lui ouvre les portes de son premier Championnat du Monde. En 2024, il a brillé à l’Esport World Cup, terminant dans le top 4, une performance qui a renforcé sa notoriété à l’international. Au-delà de la compétition, k3soju est l’un des streamers les plus regardés sur Twitch, figurant régulièrement parmi les 10 créateurs les plus suivis. En 2024, avec 224 heures de streaming, il a cumulé plus de 3,3 millions d’heures regardées, rassemblant jusqu’à 23 000 spectateurs en simultané. Fort de 624 000 followers, il continue de faire rayonner TFT et d’animer une communauté passionnée, consolidant ainsi son statut de référence incontournable du jeu. Kevin ‘setsuko’ Jiang – Setsuko est une étoile montante, connue pour son style de jeu rapide et agressif. Son talent unique et sa réflexion stratégique lui ont permis de réaliser plusieurs exploits impressionnants, notamment plusieurs premières places dans les séries 2023 Monsters Attack et Runeterra Reforged de Teamfight Tactics. Plus récemment, il a terminé à la 9e place du TFT Open LAN à Macao et s’est classé dans le top 4 de la 2024 Esports World Cup aux côtés de son équipe. Setsuko est également très suivi sur Twitch avec plus de 188 000 followers. Jeffrey ‘Milk’ Pan – DeliciousMilkGG, Milk Guy, ou simplement Milk, s’est forgé une réputation pour sa maîtrise et son expertise du jeu. Finissant régulièrement dans le top 4, Milk excelle dans l’élaboration de compositions de fin de partie puissantes. Il a remporté plusieurs tournois importants, comme les finales régionales 2022 de Gizmos & Gadgets : NA Regional Finals. Milk a également terminé deuxième de la Magic n’ Mayhem: Americas Golden Spatula et s’est classé dans le Top 4 de l’Esport World Cup en 2024. Au-delà de son succès en tant que joueur professionnel, Milk entretient un contact avec ses fans sur Twitch, avec un public de plus de 160 000 followers. Kevin ‘Prestivent’ Zou – Dernier membre du roster, Prestivent est un joueur respecté dans la communauté Teamfight Tactics et est classé parmi les meilleurs joueurs pour ses prouesses stratégiques et ses performances régulières. Prestivent streame également sur Twitch et possède une communauté de fans de plus de 84 000 followers. Les compétences, le dynamisme et la passion de Prestivent font de lui un joueur clé du roster, apportant à la fois un gameplay de haut niveau et un soutien majeur à son équipe. Avec plus d’un million de fans cumulés sur Twitch, les joueurs de Team Vitality figurent parmi les personnalités les plus influentes de la communauté Teamfight Tactics (TFT). Grâce à leur détermination et leurs performances exceptionnelles, ils incarnent l’excellence et l’esprit de compétition qui définissent Team Vitality. « Je suis fier de représenter Team Vitality pour une année supplémentaire » déclare Michael ‘k3soju’ Zhang, membre du roster TFT pour Team Vitality. « Nous avons beaucoup évolué ensemble, en tant qu’équipe et en tant qu’individus, et nous sommes plus déterminés que jamais. Je suis impatient de voir ce que cette saison nous réserve et je suis incroyablement reconnaissant du soutien des fans. » « Le renouvellement de ce roster témoigne de la capacité de Team Vitality à trouver des profils d’excellence à travers le monde et à les garder. C’est aussi un signal très positif pour notre stratégie d’expansion internationale qui vient nous ancrer encore un peu plus aux Etats-Unis. » annonce Fabien “Neo” Devide co-fondateur et Président de Team Vitality « Nous sommes incroyablement fiers d’être représentés par des joueurs aussi talentueux. Nous espérons qu’ils vont réussir à conserver leur place au sommet et décrocher de nouveaux titres. »CONTINUER LE DÉPLOIEMENT INTERNATIONAL DE TEAM VITALITYEn misant sur ses joueurs phares, en investissant dans leur développement et en leur offrant les ressources nécessaires pour exceller, Team Vitality affirme son engagement à faire grandir des talents de classe mondiale. Cette vision s’inscrit autant dans leur progression individuelle que dans le succès global du club sur la scène internationale. Avec des ambitions d’expansion toujours plus fortes, Team Vitality cherche à atteindre de nouveaux sommets dans l’esport. Cette année, l’organisation s’appuie sur l’audience de son roster Teamfight Tactics (TFT) pour renforcer son lien avec sa communauté nord-américaine, tout en poursuivant son implantation sur de nouveaux marchés mondiaux. Publié le 26/02/2025 Partager cet article Dernières actualités 28/02/2025 TEAM VITALITY ET ALDI PROPOSENT UNE JOURNÉE DE SENSIBILISATION SUR LES FEMMES DANS L’ESPORT 11/02/2025 LE GRAND MAÎTRE D’ÉCHECS INTERNATIONAL MAXIME VACHIER-LAGRAVE REJOINT TEAM VITALITY 09/02/2025 TEAM VITALITY REMPORTE LE VALORANT EMEA KICKOFF 2025 Voir toutes les actualités"
