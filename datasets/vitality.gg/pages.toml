’adresse suivante : https://vitality.gg/fr/donnees-personnelles/ NEWSLETTER Team Vitality pourra adresser aux Utilisateurs inscrits à sa newsletter, par courrier électronique dit de « prospection », des informations leur permettant de mieux connaître le Site, de mieux l’utiliser et de mieux connaître les services proposés. L’Utilisateur aura la possibilité de s’opposer sans frais, hormis ceux liés à la transmission du refus, à l’utilisation à cette fin de ses données à caractère personnel lorsque celles-ci sont recueillies et chaque fois qu’un courrier électronique de prospection lui sera adressé, notamment en cliquant sur le lien de désabonnement présent au bas de chaque newsletter. NON VALIDITÉ PARTIELLE Si l’une quelconque des dispositions des CGU est déclarée nulle ou sans objet au regard d’une disposition législative ou réglementaire en vigueur et/ou d’une décision de justice ayant autorité de la chose jugée, elle sera réputée non écrite et n’entraînera pas la nullité des autres dispositions. DROIT APPLICABLE – LITIGES Les CGU sont régies par la loi française. En cas de contestation éventuelle, les tribunaux du ressort de la cour d’appel de Paris seront seuls compétents pour connaître du litige."
