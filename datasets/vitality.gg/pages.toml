["https://vitality.gg/entreprise/ligue-corpo-2"]
title = "Ligue Corpo | Team Vitality"
description = "La première compétition inter-entreprise amateur officielle en Europe"
full_description = "LA LIGUE CORPO PAR RIOT GAMES ET TEAM VITALITY La première compétition d’esport dédiée aux entreprisesDécouvrez une compétition inédite en Europe organisée par Team Vitality et Riot Games ! Le championnat de la Ligue Corpo rassemble 10 entreprises qui s’affrontent sur League of Legends, le jeu multijoueur le plus populaire au monde. Après 10 mois de compétition intense, une seule entreprise est couronnée championne ! Fédérer vos équipes grâce à l’esport Les joueurs profitent d’une expérience unique dans des conditions similaires à celles des joueurs professionnels. Ces instants sont ainsi des véritables moments de partage entre convivialité et compétition. La Ligue Corpo est plus qu’une simple ligue, c’est une opportunité de fédérer vos collaborateurs et de renforcer leur engagement envers leur entreprise. Pendant 10 mois, les entreprises participantes s’affrontent au cours de 24 soirées de compétition pour gagner des points et gravir les échelons du classement. Chaque match est disputé le lundis entre 19h et 22h. Cerise sur la gâteau, les matchs sont diffusés en direct sur la chaîne Twitch de la Ligue Corpo avec des casteurs professionnels de la scène League of Legends. Gagnez en attractivité auprès d’une audience connectée et engagée Lors de son inscription, chaque entreprise dispose d’un pack de communication personnalisé (couleurs, blason, logo…) qui incarne l’univers inventé par les participants. Les outils de communication sont mis à jour chaque semaine pour assurer une visibilité interne et externe optimale à votre entreprise. De cette façon, l’esport devient un levier d’attractivité clé pour attirer ou fidéliser une audience numérique connectée. Cela peut être aussi un moyen de promouvoir votre entreprise, ses valeurs et créer des liens durables avec vos collaborateurs.On en parle ici ! Développez votre marque employeurPhotoshoot des joueurs OnepointCommuniquez autrementTalk entreprise Ligue Corpo à Viva TechCombattez en équipe !Finale SNCF vs ALTENVivez la victoire !Alten champion du Spring Split Un format clé en main pour chaque profil d’entrepriseLa Ligue Corpo est une solution clé en main idéale pour se démarquer des autres entreprises grâce une communication orchestrée et rythmée. Une communication digitale sur-mesure tout au long de l’année Format : un championnat de 8 à 10 équipes, avec un split de printemps et un split d’automne. Il inclut 24 matchs en saison régulière et des playoffs pour les 6 premiers. Le championnat se terminant par une grande finale entre les 2 équipes vainqueurs. Encadrement : l’organisation se déroule sur un serveur Discord comme dans l’esport. Le tout est encadré par le staff technique de Team Vitality. Communication : la compétition est retransmise sur un compte X et un site internet dédiés. Ce dernier inclut un calendrier et classement tout au long de la compétition. Les matchs décisifs sont retransmis sur la chaîne Twitch de la Ligue Corpo et les replays sont disponibles sur la chaîne YouTube. Welcome Pack : lors de l’inscription, Team Vitality remet 10 maillots de son équipementier hummel personnalisés par équipe. Récompense : le grand vainqueur se voit participer à une expérience exclusive lors d’un événement Riot Games offline en France. Un calendrier de matchs adapté au rythme des collaborateurs et collaboratrices Le second split de cette saison se déroule du 9 septembre 2024 au 9 décembre 2024, avec des matchs organisés chaque lundi et certains mercredis. Pendant les vacances et jours fériés, il n’y a pas de compétition pour garantir l’équilibre des participants et participantes. Rejoignez l'aventure Ligue Corpo SociétéPrénomNomE-mailPhone Prefix - OptionalSélectionnez une  - OptionalVotre demandeSi vous êtes humain, laissez ce champ videEnvoyer Envie de tenter votre chance ? Contactez nous pour nous rejoindre sur la Faille de l’Invocateur : This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply."
