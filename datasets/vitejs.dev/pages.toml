["https://vitejs.dev/changes/this-environment-in-hooks"]
title = "this.environment in Hooks | Vite"
description = "Next Generation Frontend Tooling"
full_description = '''this.environment in Hooks ​FeedbackGive us feedback at Environment API feedback discussionBefore Vite 6, only two environments were available: client and ssr. A single options.ssr plugin hook argument in resolveId, load and transform allowed plugin authors to differentiate between these two environments when processing modules in plugin hooks. In Vite 6, a Vite application can define any number of named environments as needed. We're introducing this.environment in the plugin context to interact with the environment of the current module in hooks.Affect scope: Vite Plugin AuthorsFuture Deprecationthis.environment was introduced in v6.0. The deprecation of options.ssr is planned for v7.0. At that point we'll start recommending migrating your plugins to use the new API. To identify your usage, set future.removePluginHookSsrArgument to "warn" in your vite config.Motivation ​this.environment not only allow the plugin hook implementation to know the current environment name, it also gives access to the environment config options, module graph information, and transform pipeline (environment.config, environment.moduleGraph, environment.transformRequest()). Having the environment instance available in the context allows plugin authors to avoid the dependency of the whole dev server (typically cached at startup through the configureServer hook).Migration Guide ​For the existing plugin to do a quick migration, replace the options.ssr argument with this.environment.name !== 'client' in the resolveId, load and transform hooks:tsimport { Plugin } from 'vite' export function myPlugin(): Plugin { return { name: 'my-plugin', resolveId(id, importer, options) { const isSSR = options.ssr const isSSR = this.environment.name !== 'client' if (isSSR) { // SSR specific logic } else { // Client specific logic } }, } }For a more robust long term implementation, the plugin hook should handle for multiple environments using fine-grained environment options instead of relying on the environment name.'''
