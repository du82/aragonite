["https://vitejs.dev/guide/build"]
title = "Building for Production | Vite"
description = "Next Generation Frontend Tooling"
full_description = '''Building for Production ​When it is time to deploy your app for production, simply run the vite build command. By default, it uses <root>/index.html as the build entry point, and produces an application bundle that is suitable to be served over a static hosting service. Check out the Deploying a Static Site for guides about popular services.Browser Compatibility ​By default, the production bundle assumes support for modern JavaScript, such as native ES Modules, native ESM dynamic import, import.meta, nullish coalescing, and BigInt. The default browser support range is:Chrome >=87Firefox >=78Safari >=14Edge >=88You can specify custom targets via the build.target config option, where the lowest target is es2015. If a lower target is set, Vite will still require these minimum browser support ranges as it relies on native ESM dynamic import, and import.meta:Chrome >=64Firefox >=67Safari >=11.1Edge >=79Note that by default, Vite only handles syntax transforms and does not cover polyfills. You can check out https://cdnjs.cloudflare.com/polyfill/ which automatically generates polyfill bundles based on the user's browser UserAgent string.Legacy browsers can be supported via @vitejs/plugin-legacy, which will automatically generate legacy chunks and corresponding ES language feature polyfills. The legacy chunks are conditionally loaded only in browsers that do not have native ESM support.Public Base Path ​Related: Asset HandlingIf you are deploying your project under a nested public path, simply specify the base config option and all asset paths will be rewritten accordingly. This option can also be specified as a command line flag, e.g. vite build --base=/my/public/path/.JS-imported asset URLs, CSS url() references, and asset references in your .html files are all automatically adjusted to respect this option during build.The exception is when you need to dynamically concatenate URLs on the fly. In this case, you can use the globally injected import.meta.env.BASE_URL variable which will be the public base path. Note this variable is statically replaced during build so it must appear exactly as-is (i.e. import.meta.env['BASE_URL'] won't work).For advanced base path control, check out Advanced Base Options.Relative base ​If you don't know the base path in advance, you may set a relative base path with "base": "./" or "base": "". This will make all generated URLs to be relative to each file.Support for older browsers when using relative basesimport.meta support is required for relative bases. If you need to support browsers that do not support import.meta, you can use the legacy plugin.Customizing the Build ​The build can be customized via various build config options. Specifically, you can directly adjust the underlying Rollup options via build.rollupOptions:vite.config.jsjsexport default defineConfig({ build: { rollupOptions: { // https://rollupjs.org/configuration-options/ }, }, })For example, you can specify multiple Rollup outputs with plugins that are only applied during build.Chunking Strategy ​You can configure how chunks are split using build.rollupOptions.output.manualChunks (see Rollup docs). If you use a framework, refer to their documentation for configuring how chunks are splitted.Load Error Handling ​Vite emits vite:preloadError event when it fails to load dynamic imports. event.payload contains the original import error. If you call event.preventDefault(), the error will not be thrown.jswindow.addEventListener('vite:preloadError', (event) => { window.location.reload() // for example, refresh the page })When a new deployment occurs, the hosting service may delete the assets from previous deployments. As a result, a user who visited your site before the new deployment might encounter an import error. This error happens because the assets running on that user's device are outdated and it tries to import the corresponding old chunk, which is deleted. This event is useful for addressing this situation.Rebuild on Files Changes ​You can enable rollup watcher with vite build --watch. Or, you can directly adjust the underlying WatcherOptions via build.watch:vite.config.jsjsexport default defineConfig({ build: { watch: { // https://rollupjs.org/configuration-options/#watch }, }, })With the --watch flag enabled, changes to the vite.config.js, as well as any files to be bundled, will trigger a rebuild.Multi-Page App ​Suppose you have the following source code structure:├── package.json ├── vite.config.js ├── index.html ├── main.js └── nested ├── index.html └── nested.jsDuring dev, simply navigate or link to /nested/ - it works as expected, just like for a normal static file server.During build, all you need to do is to specify multiple .html files as entry points:vite.config.jsjsimport { dirname, resolve } from 'node:path' import { fileURLToPath } from 'node:url' import { defineConfig } from 'vite' const __dirname = dirname(fileURLToPath(import.meta.url)) export default defineConfig({ build: { rollupOptions: { input: { main: resolve(__dirname, 'index.html'), nested: resolve(__dirname, 'nested/index.html'), }, }, }, })If you specify a different root, remember that __dirname will still be the folder of your vite.config.js file when resolving the input paths. Therefore, you will need to add your root entry to the arguments for resolve.Note that for HTML files, Vite ignores the name given to the entry in the rollupOptions.input object and instead respects the resolved id of the file when generating the HTML asset in the dist folder. This ensures a consistent structure with the way the dev server works.Library Mode ​When you are developing a browser-oriented library, you are likely spending most of the time on a test/demo page that imports your actual library. With Vite, you can use your index.html for that purpose to get the smooth development experience.When it is time to bundle your library for distribution, use the build.lib config option. Make sure to also externalize any dependencies that you do not want to bundle into your library, e.g. vue or react:vite.config.js (single entry)vite.config.js (multiple entries)jsimport { dirname, resolve } from 'node:path' import { fileURLToPath } from 'node:url' import { defineConfig } from 'vite' const __dirname = dirname(fileURLToPath(import.meta.url)) export default defineConfig({ build: { lib: { entry: resolve(__dirname, 'lib/main.js'), name: 'MyLib', // the proper extensions will be added fileName: 'my-lib', }, rollupOptions: { // make sure to externalize deps that shouldn't be bundled // into your library external: ['vue'], output: { // Provide global variables to use in the UMD build // for externalized deps globals: { vue: 'Vue', }, }, }, }, })jsimport { dirname, resolve } from 'node:path' import { fileURLToPath } from 'node:url' import { defineConfig } from 'vite' const __dirname = dirname(fileURLToPath(import.meta.url)) export default defineConfig({ build: { lib: { entry: { 'my-lib': resolve(__dirname, 'lib/main.js'), secondary: resolve(__dirname, 'lib/secondary.js'), }, name: 'MyLib', }, rollupOptions: { // make sure to externalize deps that shouldn't be bundled // into your library external: ['vue'], output: { // Provide global variables to use in the UMD build // for externalized deps globals: { vue: 'Vue', }, }, }, }, })The entry file would contain exports that can be imported by users of your package:lib/main.jsjsimport Foo from './Foo.vue' import Bar from './Bar.vue' export { Foo, Bar }Running vite build with this config uses a Rollup preset that is oriented towards shipping libraries and produces two bundle formats:es and umd (for single entry)es and cjs (for multiple entries)The formats can be configured with the build.lib.formats option.$ vite build building for production... dist/my-lib.js 0.08 kB / gzip: 0.07 kB dist/my-lib.umd.cjs 0.30 kB / gzip: 0.16 kBRecommended package.json for your lib:package.json (single entry)package.json (multiple entries)json{ "name": "my-lib", "type": "module", "files": ["dist"], "main": "./dist/my-lib.umd.cjs", "module": "./dist/my-lib.js", "exports": { ".": { "import": "./dist/my-lib.js", "require": "./dist/my-lib.umd.cjs" } } }json{ "name": "my-lib", "type": "module", "files": ["dist"], "main": "./dist/my-lib.cjs", "module": "./dist/my-lib.js", "exports": { ".": { "import": "./dist/my-lib.js", "require": "./dist/my-lib.cjs" }, "./secondary": { "import": "./dist/secondary.js", "require": "./dist/secondary.cjs" } } }CSS support ​If your library imports any CSS, it will be bundled as a single CSS file besides the built JS files, e.g. dist/my-lib.css. The name defaults to build.lib.fileName, but can also be changed with build.lib.cssFileName.You can export the CSS file in your package.json to be imported by users:json{ "name": "my-lib", "type": "module", "files": ["dist"], "main": "./dist/my-lib.umd.cjs", "module": "./dist/my-lib.js", "exports": { ".": { "import": "./dist/my-lib.js", "require": "./dist/my-lib.umd.cjs" }, "./style.css": "./dist/my-lib.css" } }File ExtensionsIf the package.json does not contain "type": "module", Vite will generate different file extensions for Node.js compatibility. .js will become .mjs and .cjs will become .js.Environment VariablesIn library mode, all import.meta.env.* usage are statically replaced when building for production. However, process.env.* usage are not, so that consumers of your library can dynamically change it. If this is undesirable, you can use define: { 'process.env.NODE_ENV': '"production"' } for example to statically replace them, or use esm-env for better compatibility with bundlers and runtimes.Advanced UsageLibrary mode includes a simple and opinionated configuration for browser-oriented and JS framework libraries. If you are building non-browser libraries, or require advanced build flows, you can use Rollup or esbuild directly.Advanced Base Options ​WARNINGThis feature is experimental. Give Feedback.For advanced use cases, the deployed assets and public files may be in different paths, for example to use different cache strategies. A user may choose to deploy in three different paths:The generated entry HTML files (which may be processed during SSR)The generated hashed assets (JS, CSS, and other file types like images)The copied public filesA single static base isn't enough in these scenarios. Vite provides experimental support for advanced base options during build, using experimental.renderBuiltUrl.tsexperimental: { renderBuiltUrl(filename, { hostType }) { if (hostType === 'js') { return { runtime: `window.__toCdnUrl(${JSON.stringify(filename)})` } } else { return { relative: true } } }, }, If the hashed assets and public files aren't deployed together, options for each group can be defined independently using asset type included in the second context param given to the function.tsexperimental: { renderBuiltUrl(filename, { hostId, hostType, type }) { if (type === 'public') { return 'https://www.domain.com/' + filename } else if (path.extname(hostId) === '.js') { return { runtime: `window.__assetsPath(${JSON.stringify(filename)})` } } else { return 'https://cdn.domain.com/assets/' + filename } }, }, Note that the filename passed is a decoded URL, and if the function returns a URL string, it should also be decoded. Vite will handle the encoding automatically when rendering the URLs. If an object with runtime is returned, encoding should be handled yourself where needed as the runtime code will be rendered as is.'''
