full_description = "Breaking Changes ​List of breaking changes in Vite including API deprecations, removals, and changes. Most of the changes below can be opt-in using the future option in your Vite config.Planned ​These changes are planned for the next major version of Vite. The deprecation or usage warnings will guide you where possible, and we're reaching out to framework, plugin authors, and users to apply these changes.No planned changes yetConsidering ​These changes are being considered and are often experimental APIs that intend to improve upon current usage patterns. As not all changes are listed here, please check out the Experimental Label in Vite GitHub Discussions for the full list.We don't recommend switching to these APIs yet. They are included in Vite to help us gather feedback. Please check these proposals and let us know how they work in your use case in each's linked GitHub Discussions.this.environment in HooksHMR hotUpdate Plugin HookMove to per-environment APIsSSR using ModuleRunner APIShared plugins during buildPast ​The changes below has been done or reverted. They are no longer relevant in the current major version.No past changes yet"
