["https://vitejs.dev/guide/using-plugins"]
title = "Using Plugins | Vite"
description = "Next Generation Frontend Tooling"
full_description = "Using Plugins ​Vite can be extended using plugins, which are based on Rollup's well-designed plugin interface with a few extra Vite-specific options. This means that Vite users can rely on the mature ecosystem of Rollup plugins, while also being able to extend the dev server and SSR functionality as needed.Adding a Plugin ​To use a plugin, it needs to be added to the devDependencies of the project and included in the plugins array in the vite.config.js config file. For example, to provide support for legacy browsers, the official @vitejs/plugin-legacy can be used:$ npm add -D @vitejs/plugin-legacyvite.config.jsjsimport legacy from '@vitejs/plugin-legacy' import { defineConfig } from 'vite' export default defineConfig({ plugins: [ legacy({ targets: ['defaults', 'not IE 11'], }), ], })plugins also accepts presets including several plugins as a single element. This is useful for complex features (like framework integration) that are implemented using several plugins. The array will be flattened internally.Falsy plugins will be ignored, which can be used to easily activate or deactivate plugins.Finding Plugins ​NOTEVite aims to provide out-of-the-box support for common web development patterns. Before searching for a Vite or compatible Rollup plugin, check out the Features Guide. A lot of the cases where a plugin would be needed in a Rollup project are already covered in Vite.Check out the Plugins section for information about official plugins. Community plugins are listed in awesome-vite.You can also find plugins that follow the recommended conventions using a npm search for vite-plugin for Vite plugins or a npm search for rollup-plugin for Rollup plugins.Enforcing Plugin Ordering ​For compatibility with some Rollup plugins, it may be needed to enforce the order of the plugin or only apply at build time. This should be an implementation detail for Vite plugins. You can enforce the position of a plugin with the enforce modifier:pre: invoke plugin before Vite core pluginsdefault: invoke plugin after Vite core pluginspost: invoke plugin after Vite build pluginsvite.config.jsjsimport image from '@rollup/plugin-image' import { defineConfig } from 'vite' export default defineConfig({ plugins: [ { ...image(), enforce: 'pre', }, ], })Check out Plugins API Guide for detailed information.Conditional Application ​By default, plugins are invoked for both serve and build. In cases where a plugin needs to be conditionally applied only during serve or build, use the apply property to only invoke them during 'build' or 'serve':vite.config.jsjsimport typescript2 from 'rollup-plugin-typescript2' import { defineConfig } from 'vite' export default defineConfig({ plugins: [ { ...typescript2(), apply: 'build', }, ], })Building Plugins ​Check out the Plugins API Guide for documentation about creating plugins."
year_published = 2025
