["https://vitejs.dev/changes/shared-plugins-during-build"]
title = "Shared Plugins during Build | Vite"
description = "Next Generation Frontend Tooling"
full_description = "Shared Plugins during Build ​FeedbackGive us feedback at Environment API feedback discussionSee Shared plugins during build.Affect scope: Vite Plugin AuthorsFuture Default Changebuilder.sharedConfigBuild was first introduce in v6.0. You can set it true to check how your plugins work with a shared config. We're looking for feedback about changing the default in a future major once the plugin ecosystem is ready.Motivation ​Align dev and build plugin pipelines.Migration Guide ​To be able to share plugins across environments, plugin state must be keyed by the current environment. A plugin of the following form will count the number of transformed modules across all environments.jsfunction CountTransformedModulesPlugin() { let transformedModules return { name: 'count-transformed-modules', buildStart() { transformedModules = 0 }, transform(id) { transformedModules++ }, buildEnd() { console.log(transformedModules) }, } }If we instead want to count the number of transformed modules for each environment, we need to keep a map:jsfunction PerEnvironmentCountTransformedModulesPlugin() { const state = new Map<Environment, { count: number }>() return { name: 'count-transformed-modules', perEnvironmentStartEndDuringDev: true, buildStart() { state.set(this.environment, { count: 0 }) } transform(id) { state.get(this.environment).count++ }, buildEnd() { console.log(this.environment.name, state.get(this.environment).count) } } }To simplify this pattern, Vite exports a perEnvironmentState helper:jsfunction PerEnvironmentCountTransformedModulesPlugin() { const state = perEnvironmentState<{ count: number }>(() => ({ count: 0 })) return { name: 'count-transformed-modules', perEnvironmentStartEndDuringDev: true, buildStart() { state(this).count = 0 } transform(id) { state(this).count++ }, buildEnd() { console.log(this.environment.name, state(this).count) } } }"
