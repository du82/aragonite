title = "SSR using ModuleRunner API | Vite"
description = "Next Generation Frontend Tooling"
full_description = 'SSR using ModuleRunner API ​FeedbackGive us feedback at Environment API feedback discussionserver.ssrLoadModule has been replaced by importing from a Module Runner.Affect scope: Vite Plugin AuthorsFuture DeprecationModuleRunner was first introduce in v6.0. The deprecation of server.ssrLoadModule is planned for a future major. To identify your usage, set future.removeSsrLoadModule to "warn" in your vite config.Motivation ​The server.ssrLoadModule(url) only allows importing modules in the ssr environment and can only execute the modules in the same process as the Vite dev server. For apps with custom environments, each is associated with a ModuleRunner that may be running in a separate thread or process. To import modules, we now have moduleRunner.import(url).Migration Guide ​Check out the Environment API for Frameworks Guide.'
