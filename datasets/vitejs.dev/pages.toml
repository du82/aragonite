["https://vitejs.dev/guide"]
title = "Getting Started | Vite"
description = "Next Generation Frontend Tooling"
full_description = '''Getting Started ​Overview ​Vite (French word for "quick", pronounced /vit/, like "veet") is a build tool that aims to provide a faster and leaner development experience for modern web projects. It consists of two major parts:A dev server that provides rich feature enhancements over native ES modules, for example extremely fast Hot Module Replacement (HMR).A build command that bundles your code with Rollup, pre-configured to output highly optimized static assets for production.Vite is opinionated and comes with sensible defaults out of the box. Read about what's possible in the Features Guide. Support for frameworks or integration with other tools is possible through Plugins. The Config Section explains how to adapt Vite to your project if needed.Vite is also highly extensible via its Plugin API and JavaScript API with full typing support.You can learn more about the rationale behind the project in the Why Vite section.Browser Support ​During development, Vite sets esnext as the transform target, because we assume a modern browser is used and it supports all of the latest JavaScript and CSS features. This prevents syntax lowering, letting Vite serve modules as close as possible to the original source code.For the production build, by default Vite targets browsers that support modern JavaScript, such as native ES Modules, native ESM dynamic import, import.meta, nullish coalescing, and BigInt. Legacy browsers can be supported via the official @vitejs/plugin-legacy. See the Building for Production section for more details.Trying Vite Online ​You can try Vite online on StackBlitz. It runs the Vite-based build setup directly in the browser, so it is almost identical to the local setup but doesn't require installing anything on your machine. You can navigate to vite.new/{template} to select which framework to use.The supported template presets are:JavaScriptTypeScriptvanillavanilla-tsvuevue-tsreactreact-tspreactpreact-tslitlit-tssveltesvelte-tssolidsolid-tsqwikqwik-tsScaffolding Your First Vite Project ​Compatibility NoteVite requires Node.js version 18+ or 20+. However, some templates require a higher Node.js version to work, please upgrade if your package manager warns about it.npmYarnpnpmBunbash$ npm create vite@latestbash$ yarn create vitebash$ pnpm create vitebash$ bun create viteThen follow the prompts!You can also directly specify the project name and the template you want to use via additional command line options. For example, to scaffold a Vite + Vue project, run:npmYarnpnpmBunbash# npm 7+, extra double-dash is needed: $ npm create vite@latest my-vue-app -- --template vuebash$ yarn create vite my-vue-app --template vuebash$ pnpm create vite my-vue-app --template vuebash$ bun create vite my-vue-app --template vueSee create-vite for more details on each supported template: vanilla, vanilla-ts, vue, vue-ts, react, react-ts, react-swc, react-swc-ts, preact, preact-ts, lit, lit-ts, svelte, svelte-ts, solid, solid-ts, qwik, qwik-ts.You can use . for the project name to scaffold in the current directory.Community Templates ​create-vite is a tool to quickly start a project from a basic template for popular frameworks. Check out Awesome Vite for community maintained templates that include other tools or target different frameworks.For a template at https://github.com/user/project, you can try it out online using https://github.stackblitz.com/user/project (adding .stackblitz after github to the URL of the project).You can also use a tool like degit to scaffold your project with one of the templates. Assuming the project is on GitHub and uses main as the default branch, you can create a local copy using:bashnpx degit user/project#main my-project cd my-project npm install npm run devManual Installation ​In your project, you can install the vite CLI using:npmYarnpnpmBunbash$ npm install -D vitebash$ yarn add -D vitebash$ pnpm add -D vitebash$ bun add -D viteAnd create an index.html file like this:html<p>Hello Vite!</p>Then run the appropriate CLI command in your terminal:npmYarnpnpmBunbash$ npx vitebash$ yarn vitebash$ pnpm vitebash$ bunx viteThe index.html will be served on http://localhost:5173.index.html and Project Root ​One thing you may have noticed is that in a Vite project, index.html is front-and-central instead of being tucked away inside public. This is intentional: during development Vite is a server, and index.html is the entry point to your application.Vite treats index.html as source code and part of the module graph. It resolves <script type="module" src="..."> that references your JavaScript source code. Even inline <script type="module"> and CSS referenced via <link href> also enjoy Vite-specific features. In addition, URLs inside index.html are automatically rebased so there's no need for special %PUBLIC_URL% placeholders.Similar to static http servers, Vite has the concept of a "root directory" which your files are served from. You will see it referenced as <root> throughout the rest of the docs. Absolute URLs in your source code will be resolved using the project root as base, so you can write code as if you are working with a normal static file server (except way more powerful!). Vite is also capable of handling dependencies that resolve to out-of-root file system locations, which makes it usable even in a monorepo-based setup.Vite also supports multi-page apps with multiple .html entry points.Specifying Alternative Root ​Running vite starts the dev server using the current working directory as root. You can specify an alternative root with vite serve some/sub/dir. Note that Vite will also resolve its config file (i.e. vite.config.js) inside the project root, so you'll need to move it if the root is changed.Command Line Interface ​In a project where Vite is installed, you can use the vite binary in your npm scripts, or run it directly with npx vite. Here are the default npm scripts in a scaffolded Vite project:package.jsonjson{ "scripts": { "dev": "vite", // start dev server, aliases: `vite dev`, `vite serve` "build": "vite build", // build for production "preview": "vite preview" // locally preview production build } }You can specify additional CLI options like --port or --open. For a full list of CLI options, run npx vite --help in your project.Learn more about the Command Line InterfaceUsing Unreleased Commits ​If you can't wait for a new release to test the latest features, you can install a specific commit of Vite with https://pkg.pr.new:npmYarnpnpmBunbash$ npm install -D https://pkg.pr.new/vite@SHAbash$ yarn add -D https://pkg.pr.new/vite@SHAbash$ pnpm add -D https://pkg.pr.new/vite@SHAbash$ bun add -D https://pkg.pr.new/vite@SHAReplace SHA with any of Vite's commit SHAs. Note that only commits within the last month will work, as older commit releases are purged.Alternatively, you can also clone the vite repo to your local machine and then build and link it yourself (pnpm is required):bashgit clone https://github.com/vitejs/vite.git cd vite pnpm install cd packages/vite pnpm run build pnpm link --global # use your preferred package manager for this stepThen go to your Vite based project and run pnpm link --global vite (or the package manager that you used to link vite globally). Now restart the development server to ride on the bleeding edge!Dependencies using ViteTo replace the Vite version used by dependencies transitively, you should use npm overrides or pnpm overrides.Community ​If you have questions or need help, reach out to the community at Discord and GitHub Discussions.'''
