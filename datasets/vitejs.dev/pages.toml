["https://vitejs.dev/blog/announcing-vite4-3"]
title = "Vite 4.3 is out! | Vite"
description = "Next Generation Frontend Tooling"
full_description = "Vite 4.3 is out! ​April 20, 2023Quick links:Docs: English, 简体中文, 日本語, Español, PortuguêsVite 4.3 ChangelogPerformance Improvements ​In this minor, we focused on improving the dev server performance. The resolve logic got streamlined, improving hot paths and implementing smarter caching for finding package.json, TS config files, and resolved URL in general.You can read a detailed walkthrough of the performance work done in this blog post by one of Vite Contributors: How we made Vite 4.3 faaaaster 🚀.This sprint resulted in speed improvements across the board compared to Vite 4.2.These are the performance improvements as measured by sapphi-red/performance-compare, which tests an app with 1000 React Components cold and warm dev server startup time as well as HMR times for a root and a leaf component:Vite (babel)Vite 4.2Vite 4.3Improvementdev cold start17249.0ms5132.4ms-70.2%dev warm start6027.8ms4536.1ms-24.7%Root HMR46.8ms26.7ms-42.9%Leaf HMR27.0ms12.9ms-52.2%Vite (swc)Vite 4.2Vite 4.3Improvementdev cold start13552.5ms3201.0ms-76.4%dev warm start4625.5ms2834.4ms-38.7%Root HMR30.5ms24.0ms-21.3%Leaf HMR16.9ms10.0ms-40.8%You can read more information about the benchmark here. Specs and Versions for this performance run:CPU: Ryzen 9 5900X, Memory: DDR4-3600 32GB, SSD: WD Blue SN550 NVME SSDWindows 10 Pro 21H2 19044.2846Node.js 18.16.0Vite and React Plugin versions Vite 4.2 (babel): Vite 4.2.1 + plugin-react 3.1.0Vite 4.3 (babel): Vite 4.3.0 + plugin-react 4.0.0-beta.1Vite 4.2 (swc): Vite 4.2.1 + plugin-react-swc 3.2.0Vite 4.3 (swc): Vite 4.3.0 + plugin-react-swc 3.3.0Early adopters have also reported seeing 1.5x-2x dev startup time improvement on real apps while testing the Vite 4.3 beta. We'd love to know the results for your apps.Profiling ​We'll continue to work on Vite's performance. We're working on an official Benchmark tool for Vite that let us get performance metrics for each Pull Request.And vite-plugin-inspect now has more performance-related features to help you identify which plugins or middlewares are the bottleneck for your applications.Using vite --profile (and then pressing p) once the page loads will save a CPU profile of the dev server startup. You can open them in an app as speedscope to identify performance issues. And you can share your findings with the Vite Team in a Discussion or in Vite's Discord.Next Steps ​We decided to do a single Vite Major this year aligning with the EOL of Node.js 16 in September, dropping support for both Node.js 14 and 16 in it. If you would like to get involved, we started a Vite 5 Discussion to gather early feedback."
