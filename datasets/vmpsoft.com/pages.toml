["https://vmpsoft.com/web-license-manager/user-manual"]
title = "VMProtect Software » Web License Manager » Docs"
description = "Online activation license management is a proven and generally accepted way to register and protect software. A software product today is usually a free-to-try product of a kind. This means anyone can download it and use it without paying money. At the same time, such downloadable version is"
full_description = "What is Online Activation and License Management? Online activation license management is a proven and generally accepted way to register and protect software. A software product today is usually a free-to-try product of a kind. This means anyone can download it and use it without paying money. At the same time, such downloadable version is usually limited – either time limited or limited in its functions. In order to unlock the entire possibilities of a product and to be able to use it beyond the trial period, a user must purchase the software. So let’s say, some user purchases the software. The vendor of the software gets notified about the purchase and now should unlock the full functionality of the product and remove any time restriction it has. How is this done? Time and functional limitations are implemented using some kind of software protection system like VMProtect Ultimate. So the trick is to let this protection system know that the software is now purchased and should work in its full strength. Registration keys (license keys, activation codes) are used for that. Surely, you have seen many of them. Here is how it works. Upon purchase, a user receives his personal registration key. Then, he should enter this key in the application. The application sends an encrypted query to the activation server and passes the registration key to it. The activation server checks if the key is valid, generates a serial number and sends it back to the software. The protection system of the software applies the serial number and finally unlocks certain functions of the application and removes all time limitations. Since every user registers via the activation system, a vendor can manage and control every issued license: limit the number of times a license can be activated, block compromised registration keys, re-send lost keys and so on. At the same time, online activation prevents unauthorized usage of the same license on multiple computers, stealing of the key and other types of frauds. What is VMProtect Web License Manager (WebLM)? Basically, any software vendor can take benefit of using VMProtect Web License Manager. WebLM delivers simple, fast and user-friendly way to embed an online activation system to software, track licenses and installations and manage license keys. Web License Manager or simply WebLM is a full-featured software licensing and activation system. With it you can track online purchases, manage customers and license numbers, and control the number of installations of your programs. WebLM easily integrates to all major e-commerce providers and automates most of routine license management and control tasks – keeping registration information, sending and re-sending license keys, blocking stolen license keys and managing online activations. WebLM works in conjunction with VMProtect Ultimate. The former provides firm and secure protection of your software from attacks, while WebLM simplifies managing and distribution of license keys. Who needs WebLM? Here is a simple questionnaire to see, if you need WebLM: 1. You want to safely keep customer data and be able to refer to them at any time, regardless of the e-commerce provider. 2. You need a web-based activation system to restrict unauthorized installs of your product. 3. You want short, easy-to-type activation codes for your software without jeopardizing its hack-proof capabilities. 4. You want to send license keys to users automatically upon purchase. 5. You need a way to block stolen or compromised license keys. WebLM is all of the above, but if you answered Yes to at least one question, you still want to try it. How it works? Here is a more technical description of how online activation is implemented in VMProtect Ultimate. Whenever a user attempts to activate the software with an activation code the following happens: 1. The software calls VMProtectActivateLicense function. This function compiles and sends a POST request to the activation server containing all parameters specified in the settings of this VMProtect project. It also sends the activation code entered by a user and the hardware ID of the computer. 2. WebLM receives this request and looks for the specified activation code in the database. There can be several possible outcomes depending on whether the code is found or not. a. If the activation code isn’t found in the DB, WebLM returns the ACTIVATION_BAD_CODE error; b. If the code is found, but is blocked, WebLM returns the ACTIVATION_BANNED error to the app. c. If the code is found, but it doesn’t match the product field, WebLM returns the ACTIVATION_BAD_CODE error. Obviously, a user can only activate the product or the product mode he did purchase. So if the hash of licensing parameters doesn’t match the hash of the given product, WebLM returns the ACTIVATION_BAD_CODE error. The hash of licensing parameters is encoded in the activation URL and is send along with other parameters upon activation attempt. 3. Then WebLM checks if the product or the product mode uses hardware id protection. If HWID binding is used, WebLM looks for a previously issued non-blocked license for that HWID. Otherwise, WebLM takes the very first license with no hardware binding. If a suitable license was found here, WebLM returns the corresponding serial number it to the application. 4. On the next step, WebLM calculates the number of available activations as follows: the amount of activations the activation code has minus the number of non-blocked licenses already issued for this activation code. If the result is zero or less, WebLM returns the ACTIVATION_ALREADY_USED error. 5. Next, WebLM checks the expiry date of the activation code. If such date is specified and that date has passed, WebLM returns the ACTIVATION_EXPIRED error. 6. If the number of available activations calculated on the step 4 is greater than zero, WebLM creates a license in accordance with product/mode parameters. The registration name and the e-mail of a customer are taken from the activation URL. 7. Finally, a new license (serial number) is returned back to the application. Installing WebLM WebLM installs on any Unix server with PHP5 and MySQL running. Step 1: Uploading Step 2: Database Access Step 3: Creating an Administrator Step 4: Completing Installation Step 1: Uploading You can upload WebLM via FTP or a file manager in the control panel of your web hosting provider. Create a folder where the Web License Manager will be installed. Upload the unpacked WebLM archive there and then type http://<yourserver>/<directory>/install.php in your browser. For example, if you install WebLM to the weblm folder at www.mysite.com, the URL should be: http://www.mysite.com/weblm/install.php You should see the installation screen like this: If something goes wrong, you’ll see the error message. This means that some of the required software is not found on your server. Please contact us in that case, we’ll try to help. If everything is OK, you just need to click the “Continue” button to begin the installation. Step 2: Database Access The next screen you’ll see is a database access form. There you should enter parameters to access databases on your server. Usually you get this from your hoster or from phpMyAdmin software. The fields are standard, so you shouldn’t have any problems with filling them. Not only does the table prefix parameter distinguish the WebLM tables from other tables in the database, but it also allows you to have several WebLM instances in the same database. In case of multiple WebLM instances, you should choose this parameter carefully or you may override the other instance’s tables. However, this doesn’t matter if you install just a single WebLM instance. After filling the form, click the “Connect” button. If all fields are OK, the “Connect” button changes to “Install Data Tables” indicating the successful connection to the database. Otherwise an error message is shown. Fix the issue it displays and try again. When done, click the “Install Data Tables” button to allow WebLM create all tables it needs. Step 3: Creating an Administrator Now you need to specify a user with Administrator privileges who is allowed to access to the WebLM system. Fill the main user form. Put your name, e-mail and password as you usually do on other sites. Then click the “Create” button. You can change all parameters later, if necessary. Step 4: Completing Installation If everything goes OK, you should see the “That’s all” screen, which means that you have successfully installed WebLM without writing a single line of PHP code or something like this. That’s really cool. Now go to the installation folder and remove the install.php file as suggested on the screen above. We also recommend removing the write permission from the configuration file. This is required due to security reasons. You don’t want others to re-install your system or take access to it by rewriting configuration parameters. So in order to prevent possible losses, take care of the security now. Usually, you can modify file’s permissions in the control panel of your hosting provider. Quick Start Guide So you have just installed Web License Manager as explained here. What now? Below is a very short start guide that helps you to setup everything you need to generate and manage serial numbers. The guide assumes that you use a more or less well-known e-commerce provider and understand how they usually process serial numbers. Are you ready? Login to the WebLM that you have just installed and let’s go! Step 1: Create an Agent Step 2: Create a Product Step 3: Generate a Serial Number Step 4: Setup the Automatic Serial Number Generation Step 1: Create an Agent The first thing you need to do is to create an entry for your agent (e-commerce provider). To do this click the “Add New Agent” link at the left panel. A form shown below appears. Put the name of your e-commerce provider there and then fill in the IP range it uses. This step is required for security reasons. Simply put, you don’t want anyone accessing your activation server, so specify one or more IP ranges here to only allow requests from those IPs. You may ask your e-commerce provider for that range or search their site for it. You should end up with something like this: Alternatively, you can use authorization using login and a password. This section provides more info on that option. Click the “Save” button when done. You should now see the new entry in the list. Step 2: Create a Product The second step is to create or import a product. Product is a set of data required to generate serial numbers. You should create a new product every time you need a new type of serial numbers that are not compatible with any others. For example, if you already have a product “Word” and are about to release the advanced version “Word Pro”, you probably don’t need a new product, as they may share the same set of serial numbers. However, if you are going to release a “Photoshop” – it’s a good idea to create a new product. Creating a New Product Now let’s start from creating a new product from scratch. Click the “Add New Product” link at the left panel. Enter the name of the product. Leave all options with their default values for now: Then click the “Save” button. You should see the new product in the list. Move the mouse to that item and you’ll see the set of actions you may do. We call this a function menu. You need to export that product to use it in VMProtect. Click the “Export” link and save the VMP file to the appropriate place. Now you may use it as a separate licensing data file, keeping the protection stuff in another file. This allows you to sync the online and offline versions easily. Importing Existing Product Another way to add a product is to import the existing VMP file with the licensing data. Again, we suggest splitting the licensing information from the protection data in VMProtect, so you can sync the licensing data easier. Now when you have a good VMP file with the licensing data, click the “Import Project” link at the left panel. Pick the project file and click the “Import” button. After confirming the operation the product will be added to the list. Synchronizing online and offline copies Both methods can be used to synchronize online and offline copies of your VMP file. You should keep offline version up-to-date to be able to block compromised serial numbers. Usually you export the product and replace the local VMP file just before you build the new release. This way all blocked serial numbers become really blocked. Once again, we really suggest to separate protection stuff from the licensing data using a separate VMP file for the licenses. If for any reason you have changed the local version of the VMP file, just import it as a new product. Web License Manager detects that and updates the online version of the project. Step 3: Generate a Serial Number Now we are ready to generate a serial number. For the sake of this guide we’ll do this manually. Normally, serial numbers are generated by a request of your e-commerce provider (agent). However, you may use manual generation of a serial number if you want to give a free license to some one, or provide a serial number for a product review. Click the “Add New License” link at the left panel and you will see the new license form. Pick your product from the very first drop-down list and fill the top set of fields. Like below: Now click the “Save” button to generate a license. Step 4: Setup the Automatic Serial Number Generation At last we’ve come to the most important part – setting up of the automatic serial number generation upon request from your e-commerce provider. Basically, most of e-commerce providers allow vendors to have serial number generators on their own sites. In that case e-commerce provider just calls a vendor-specific URL and passes some parameters such as the customer’s name and e-mail as parameters. Login to your e-commerce provider’s vendor panel and locate the custom keygen URL entry form. You can see how to configure a keygen of several popular e-commerce providers here. Now go to the products list in WebLM and locate the product that we have just created. Move mouse over it and click the “Keygen URL” link: Some most popular e-commerce providers are hardcoded into WebLM, so you may simply copy the URL and paste it to the e-commerce provider’s form opened on the above step. Otherwise, you still should copy the URL, but you may need to adjust the template parameters so that your e-commerce provider can substitute them with the real data. That’s all! Now you place a test order and check if a new license has been added to the list. Licenses The Licenses section of the WebLM control panel displays all licenses (customers) of all your products. By pointing a mouse over a specific line, you can see a function menu. It allows you to edit the license, copy the associated serial number to the clipboard, block the serial number or de"
