title = "VMProtect Software » Web License Manager » Overview"
description = "Protect your software code."
full_description = "With Web License Manager you will have all the sales in one place with as many e-commerce providers as you want. Just set it up on a server and point sales providers to use WebLM serial numbers. Web License Manager allows to make different modes for each product like trials, full-featured and various licensing schemes (home license, business license, enterprise license) having certain functional differences. To generate keys, Web License Manager uses the RSA algorithm which makes it impossible for hackers to create a keygen. Serial numbers can contain lots of information like name and email of the license owner, expiration date, period of free updates, and much more. Any blocked serial number will be denied by new versions of a product. You can setup the Web License Manager to work with your payment processing service, so it calls WebLM at every order. This can be done quite easily as most of the e-commerce providers allows vendors to setup keygens on their sites. Serial numbers can contain lots of information like name and email of the license owner, expiration date, period of free updates, and much more. Any blocked serial number will be denied by new versions of an application. The licensing system also allows to activate time-limited serial numbers and use them for a trial version of an application. This activation method works over the Internet and doesn't store anything on the user computer. Online activation license management is a proven and generally accepted way to register and protect software. Online activation allows vendor to perform a two-step registration process with short activation codes. A vendor can manage and control every issued license: limit the number of times a license can be activated, block compromised registration keys, re-send lost keys and so on. At the same time, online activation prevents unauthorized usage of the same license on multiple computers, stealing of the key and other types of frauds. The only difference between these license types is who owns them. If you are a private developer, choose the Personal license. If you represent a company or plan to use the product in your organization, select the Company license."
