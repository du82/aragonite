title = "VMProtect Software » Privacy Policy"
description = 'Please read this Privacy Policy carefully as you agree to be bound by it while using our websites and products. "VMProtect Software" and "VMProtect" are trading names of Permyakov Ivan Yurievich IP ("we", "our" or "us") registered in Russian'
full_description = 'Please read this Privacy Policy carefully as you agree to be bound by it while using our websites and products. "VMProtect Software" and "VMProtect" are trading names of Permyakov Ivan Yurievich IP ("we", "our" or "us") registered in Russian Federation. If you have any queries relating to our use of your personal information or any other related data protection questions, you can contact us. How Do We Collect Personal Data? Our Website When you visit our website we collect information such as type and version of your browser and operating system, and your IP address; When you use our online tools and services we may use cookies to store your order number and/or preferences; When you place orders we may collect your name, email, phone, address and other information needed to process the order and to reñsend you the order information if needed. Where Do We Store Personal Data? Website Data We store all Personal Data collected via our websites, applications and payment processors on secure servers administered by In-Solve JSC, located in Russian Federation. In-Solve JSC Privacy Policy Emails Our support email is administered by In-Solve JSC. They store some of your Personal Data - including your name and email address on their servers. Read their privacy policy for more information. In-Solve JSC Privacy Policy Forum Password Your password is ciphered (a one-way hash) so that it is secure. However, it is recommended that you do not reuse the same password across a number of different websites. Your password is the means of accessing your account at our forum, so please guard it carefully and under no circumstance will anyone affiliated with us or another third party, legitimately ask you for your password. Payments We use Pay Pro Global to process payments. When you make an order, we redirect you to their websites to process the transaction. They store some of your details as a reference against your transaction in case we need to process a refund or provide support, and for fraud prevention purposes. Read the link below for more information. Pay Pro Global Privacy Policy We do not receive and store your credit card details or any other sensitive financial information about your orders. We do receive and store some Personal Data about your orders including your name, email, address and phone number. This is done for providing better support and for notifying you about license expiration. Sharing Personal Data We will not share your Personal Data with third parties without having obtained your consent. We will only disclose your Personal Data, without your consent or without notice, if required to do so by law or if in good faith we believe that such action is necessary to: Conform to the edicts of the law or comply with legal process served on us; Protect and defend our lawful rights and property; Act in urgent circumstances to protect the personal safety of our customers and the public. Accessing, Changing and Deleting Your Personal Data You can request to obtain details, update or delete the Personal Data we may hold about you by contact us. When contacting us, please quote your name and email address and provide the brief details of the information required or changes you wish to make as this will help us to accurately respond to your request. Please be aware that if you want us to delete your personal data, your account information such as license keys, invoices, ordered products and services, etc will no longer be accessible and cannot be restored so you should ensure that everything is backed up before proceeding. For the protection of all our customers, we will take all reasonable steps to confirm your identity before providing you with details of any Personal Data we may hold about you. Please allow us up to 30 days to respond to all such requests. Cookies Our Cookies There is a number of Cookies that may be stored when you visit our websites. Some are from us and are necessary for certain functions of the websites, and others are from third-party websites. If you wish to deny consent to the placing of the Cookies we request you cease using our websites. Third-Party Cookies There are a few third-party websites that also use Cookies on our behalf. We do not directly control these Cookies. You can check the thirdñparty websites for more information on these. Pay Pro Global Privacy Policy How to File a Complaint? In case you think that your legitimate interests as a data subject are violated, please contact us.'
