["https://vorpus.org/blog/control-c-handling-in-python-and-trio"]
title = "Control-C handling in Python and Trio — njs blog"
full_description = '''Control-C handling in Python and Trio Wed 19 April 2017 Trio is a new asynchronous I/O library for Python, with a focus on usability and correctness – the goal is to make it easy to get things right. One thing well-behaved programs should do is exit cleanly when the user hits control-C. In Python this mostly Just Works without developers having to think about it too much, and as part of trio's focus on usability, we'd like to carry that over: there are few things more annoying than a program that refuses to quit when you hit control-C! But preserving correctness in the face of an interrupt that can happen at literally any moment is not at all trivial. This is a place where trio's two goals interact in a surprisingly interesting way! In this post I'll explore some different options for handling control-C, and explain Trio's solution – with a bonus deep dive into signal handling and some rather obscure corners of CPython's guts. The tl;dr is: if you're writing a program using trio, then control-C should generally Just Work the way you expect from regular Python, i.e., it will raise KeyboardInterrupt somewhere in your code, and this exception then propagates out to unwind your stack, run cleanup handlers, and eventually exit the program. You don't need this article to use trio; you can start with our tutorial and be happy and productive without thinking about control-C ever again. In fact, most developers probably won't even realize that there's anything special happening at all. But if you're curious about how we make the magic go, then read on... Contents: The precedent: control-C in regular Python Option 1: KeyboardInterrupt Option 2: a custom signal handler The dream Prior art Twisted Other async libraries How does the Python interpreter pull it off? How Trio handles control-C How do we know which code should be protected? How do we deliver a KeyboardInterrupt if we can't raise it? What if you want a manual control-C handler? Limitations and potential improvements Issues with handing off from the C-level handler to the Python-level handler Issues with the interaction between KeyboardInterrupt and with blocks yield from and await aren't signal-safe What about PyPy? Conclusion Comments The precedent: control-C in regular Python Before we get into event loops and all that, let's review how things work in regular Python. When you're writing Python code, you have two basic options for handling control-C. Option 1: KeyboardInterrupt The first option is to ignore the issue entirely. By default, the Python interpreter sets things up so that control-C will cause a KeyboardInterrupt exception to materialize at some point in your code, which then propagates out like any other regular exception. This is pretty nice! If your code was accidentally caught in an infinite loop, then it breaks out of that. If you have cleanup code in finally blocks, it gets run. It shows a traceback so you can find that infinite loop. That's the advantage of the KeyboardInterrupt approach: even if you didn't think about control-C at all while you were writing the program, then it still does something that's pretty darn reasonable – say, 99% of the time. The problem is that the other 1% of the time, things break in weird ways. It's extremely difficult to write code that can correctly handle a KeyboardInterrupt anywhere and still guarantee correctness. No-one audits or tests their code for this. And the edge cases are very tricky. For example, suppose you have some code that takes and then releases a lock: lock.acquire() try: do_stuff() # <- do_something_else() # <- control-C anywhere here is safe and_some_more() # <- finally: lock.release() If the user hits control-C anywhere inside the try block, then the resulting KeyboardInterrupt will cause the finally block to run, the lock will be released, and all will be well. But what if we're unlucky? lock.acquire() # <- control-C could happen here try: ... finally: # <- or here lock.release() If a KeyboardInterrupt happens at one of the two points marked above, then sucks to be us: the exception will propagate but our lock will never be released, which means that instead of exiting cleanly we might well get stuck in a deadlock. By moving the acquire inside the try block we could convert the first point into a RuntimeError ("attempt to release an unlocked lock") instead of a deadlock, but this isn't entirely satisfying, and doesn't help with the second point. And there's another possibility: KeyboardInterrupt could be raised inside lock.acquire or lock.release – meaning that we could end up with a lock that was "half-acquired". I'm not sure what that means but it's probably bad. In any case, the point here is to illustrate a more general principle: most Python code has dozens of these kinds of dangerous moments when a KeyboardInterrupt will violate invariants. Our running example uses a lock because trio is a concurrency library, but the same thing applies to open files, database transactions, any kind of multi-step operation that mutates external state... usually you're lucky enough to get away with it, especially since the program usually exits afterwards anyway, but it's basically impossible to know for certain, so if you need 100% reliability then you need a different approach. [1] Option 2: a custom signal handler The problem with KeyboardInterrupt is that it can happen anywhere. If we want to make this manageable, then we need to somehow trim down the number of places where we need to think about control-C. The general strategy here is to register a custom handler for SIGINT that does nothing except set some kind of flag to record that the signal happened. This way we can be pretty confident that the signal handler itself won't interfere with whatever the program was doing when the signal handler ran. And then we have to make sure that our program checks this flag on a regular basis at places where we know how to safely clean up and exit. The best way to think about this is that we set up a "chain of custody" where responsibility for handling the signal gets handed along from tricky low-level code up to higher-level code whose execution context is better-defined: custom signal handler -> our program's main loop sets flag checks flag It's hard to say more than this, though, because the implementation is going to depend a lot on the way each particular program is put together. That's the downside to this approach: making it work at all requires insight into our program's structure and careful attention to detail. If we mess up and don't check the flag for a few seconds (perhaps because we're busy doing something else, or the program is sleeping while waiting for I/O to arrive, or ...), then oops, it takes a few seconds to respond to control-C. To avoid this we may need to invent some kind of mechanism to not just set the flag, but also prod the main loop into checking it in a timely fashion: custom signal handler -> our program's main loop sets flag gets woken up by being poked with stick & pokes main loop with a stick & checks flag Another possibility is that we really mess up and accidentally get stuck in an infinite loop that doesn't check for the flag, and then oops, now control-C just doesn't work at all, which is a really adding insult to injury – we've got a buggy program that's locked and chewing up our CPU, and now we can't even kill it? This is exactly the situation that control-C is supposed to handle! Argh! Super annoying. Bottom line: this is the only viable way to handle interrupts 100% correctly, but getting there requires a lot of work, and if you mess up then you'll actually make things worse. For many programs it's not worth it – we may be better off letting Python do its default thing of raising KeyboardInterrupt and crossing our fingers. The nice thing about Python's approach is that it gives us both options, and lets us pick the trade-offs that work best for each situation. The dream So those are your options in regular Python; what if you're using Trio? In general, Trio tries to make async programming feel similar to regular Python programming, with some minimal extensions added. For example, if we want to call A and then call B we don't write some complicated thing like fut = A(); fut.add_callback(B), we just write A(); B() (maybe with some awaits thrown in). Our model for running concurrent tasks is that spawning a task is similar to calling a function, except that you now you can call several functions at the same time. And – important for our current discussion – this means we can report errors using ordinary exceptions and the usual stack unwinding logic, even when those errors have to cross between different concurrent tasks. For example, a simple web server might have a task tree that looks like: parent task supervising the other tasks │ ├─ task listening for new connections on port 80 │ ├─ task talking to client 1 │ ├─ task talking to client 2 │ ├─ task talking to client 3 ┊ Now suppose we haven't defined any special control-C handling, the user hits control-C, and the second client task receives a KeyboardInterrupt. Then this exception will propagate up the stack inside the "client 2" task – running any cleanup code as it goes. Generally in this kind of server you'd have some sort of catch-all block near the top of the task that catches, logs, and discards most exceptions, because we don't want a typo in some HTML template to take down the whole server. But if our server is well written, this catch-all handler will only catch Exception and not BaseException – this is just a standard Python thing, nothing to do with trio – so it won't catch the KeyboardInterrupt exception, which will eventually hit the top of that task's stack. At this point, it continues to propagate up the task tree, into the supervisor task. When a supervisor sees a child crashing with an exception like this, the default response is to cancel all the other tasks and then re-raise the exception. So now all the other tasks will recieve trio.Cancelled exceptions, clean themselves up, and then the whole thing exits with KeyboardInterrupt. Nice! That's just what we wanted, and we didn't have to think about control-C handling at all when we were writing the code – it just worked. So what this suggests is that trio should provide exactly the same semantics as regular Python: by default control-C triggers a KeyboardInterrupt in your code and then trio's normal exception propagation logic will take care of things, or else you can define a custom handler with some custom cleanup logic if you want to be really careful. Now all we need to do is implement it... but this turns out to be non-trivial, because trio is itself implemented in Python. In our little scenario above, we imagined that KeyboardInterrupt was raised inside the user's code. But if we're unlucky, we might get a KeyboardInterrupt inside trio itself. For example, in trio's core scheduling loop there's a bit of code that picks the next task to run by doing something like: next_task = run_queue.pop() Imagine a KeyboardInterrupt arriving after the call to pop() but before the assignment! Even if we catch the error, we just lost track of this task. That's no good. This is a bit of a theme in trio: a genuinely wonderful thing about Python's async/await design is that it's not bound to any particular event loop or execution model: it's basically just a minimal stack-switching primitive that lets us build our own cooperative threading semantics on top as an ordinary Python library. If Python's async/await looked like C#'s async/await or Javascript's async/await, then libraries like trio and curio couldn't exist, because asyncio would be baked into the language. But... it turns out that trying to extend the Python runtime's core semantics, in Python, is a great way to discover all kinds of interesting edge cases! Can we do better? Prior art Do other async libraries give any useful hints on what to do? Not really, unfortunately. Twisted Twisted by default registers a signal handler for control-C that triggers a clean shutdown of their event loop. This means that control-C won't work if your Twisted program runs away in an infinite loop that never yields to the event loop, and even if does work then any callback chains or coroutines that are in progress will get abruptly abandoned, but it will at least run any registered shutdown callbacks. It's not bad, it can be made to work, but doing so is tricky and there are limitations. Trio's motto is "make it easy to get things right", so we'd like to do better. Other async libraries I also looked at tornado, asyncio, curio, and gevent, but (as of April 2017) they're even less sophisticated than twisted: by default they don't do any special handling for keyboard interrupts at all, so hitting control-C may or may not blow up their event loop internals in a graceless fashion; in particular, any callback chains or coroutines you have running are likely to be abruptly abandoned, with no chance to even run their finally blocks, and it's entirely possible that you'll hit a deadlock or something, who knows. And as an additional wrinkle, at least asyncio has some problems handling control-C on Windows. (Checked with asyncio in CPython 3.6.1; I didn't check the other projects at all.) For example, if you run this program then be prepared to kill it with the task manager or something, because your control-C has no power here: # On Windows this ignores control-C, so be prepared to kill it somehow... import asyncio loop = asyncio.get_event_loop() loop.run_until_complete(asyncio.sleep(99999)) You can implement the Twisted-style behavior on these systems by manually registering your own signal handler that triggers some graceful shutdown logic, but all in all it's not very user friendly, and has the same limitations. (The asyncio developers have even considered making the Twisted-style behavior the default, but are unhappy about the side-effects and haven't reached consensus on a solution.) How does the Python interpreter pull it off? We do have one example of a program that implements the semantics we want: the Python interpreter itself. How does it work? Let's walk through it. Control-C handling starts when the operating system detects a control-C and informs the interpreter. The way it does this is by running whatever signal handler was previously registered to handle the SIGINT signal. Conceptually, this is similar to how signal.signal works, but technically it's very different because signal.signal takes a Python function to be run when a signal arrives, and the operating system APIs only let you register a C function to be run when a signal arrives. (Note that here we're talking about "C" the language – that it uses the same letter as control-C is just a coincidence.) So if you're implementing a Python interpreter, that's your challenge: write a function in C that causes the Python signal handler function to be run. Once y'''
author = "Nathaniel J. Smith"
year_published = 2017
