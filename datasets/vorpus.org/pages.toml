title = "Nathaniel J. Smith:  rERP analysis"
full_description = "rERP/rERF analysis is a technique for using regression to estimate ERP/ERF waveforms from brainwave data recorded using EEG or MEG. Traditional ERP/ERF analysis is designed for comparing categorical conditions (expected/unexpected, attended/unattended, etc.), and runs into problems if you have an experiment with continuous covariates, correlations between your covariates (partial confounding), or present stimuli in quick enough succession to create overlap between their brain responses. rERP/rERF analysis includes ERP/ERF analysis as a special case, but it extends it to handle experiments containing categorical covariates, continuous covariates, or both; partial confounding; non-linear effects; overlapping responses to distinct events; and any combination of the above."
