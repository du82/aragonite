["https://vorpus.org/blog/timeouts-and-cancellation-for-humans"]
title = "Timeouts and cancellation for humans — njs blog"
full_description = '''Timeouts and cancellation for humans Thu 11 January 2018 Your code might be perfect and never fail, but unfortunately the outside world is less reliable. Sometimes, other people's programs crash or freeze. Networks go down; printers catch on fire. Your code needs to be prepared for this: every time you read from the network, attempt to acquire an inter-process lock, or send an HTTP request, there are at least three possibilities you need to think about: It might succeed. It might fail It might hang forever, never succeeding or failing: days pass, leaves fall, winter comes, yet still our request waits, yearning for a response that will never come. The first two are straightforward enough. To handle that last case, though, you need timeouts. Pretty much every place your program interacts with another program or person or system, it needs a timeout, and if you don't have one, that's a latent bug. Let's be honest: if you're like most developers, your code probably has tons of bugs caused by missing timeouts. Mine certainly does. And it's weird – since this need is so ubiqituous, and so fundamental to doing I/O correctly, you'd think that every programming environment would provide easy and robust ways to apply timeouts to arbitrary operations. But... they don't. In fact, most timeout APIs are so tedious and error-prone that it's just not practical for developers to reliably get this right. So don't feel bad – it's not your fault your code has all those timeout bugs, it's the fault of those I/O libraries! But now I'm, uh, writing an I/O library. And not just any I/O library, but one whose whole selling point is that it's obsessed with being easy to use. So I wanted to make sure that in my library – Trio – you can easily and reliably apply timeouts to arbitrary I/O operations. But designing a user-friendly timeout API is a surprisingly tricky task, so in this blog post I'm going to do a deep dive into the landscape of possible designs – and in particular the many precursors that inspired me – and then explain what I came up with, and why I think it's a real improvement on the old state-of-the-art. And finally, I'll discuss how Trio's ideas could be applied more broadly, and in particular, I'll demonstrate a prototype implementation for good old synchronous Python. So – what's so hard about timeout handling? Contents: Simple timeouts don't support abstraction Absolute deadlines are composable (but kinda annoying to use) Cancel tokens Cancel tokens encapsulate cancellation state Cancel tokens are level-triggered and can be scoped to match your program's needs Cancel tokens are unreliable in practice because humans are lazy Cancel scopes: Trio's human-friendly solution for timeouts and cancellation How cancel scopes work Where do we check for cancellation? An escape hatch Cancel scopes and concurrency Summary Who else can benefit from cancel scopes? Synchronous, single-threaded Python asyncio Other languages Now go forth and fix your timeout bugs! Comments Simple timeouts don't support abstraction The simplest and most obvious way to handle timeouts is to go through each potentially-blocking function in your API, and give it a timeout argument. In the Python standard library you'll see this in APIs like threading.Lock.acquire: lock = threading.Lock() # Wait at most 10 seconds for the lock to become available lock.acquire(timeout=10) If you use the socket module for networking, it works the same way, except that the timeout is set on the socket object instead of passed to every call: sock = socket.socket() # Set the timeout once sock.settimeout(10) # Wait at most 10 seconds to establish a connection to the remote host sock.connect(...) # Wait at most 10 seconds for data to arrive from the remote host sock.recv(...) This is a little more convenient than having to remember to pass in explicit timeouts every time (and we'll discuss the convenience issue more below) but it's important to understand that this is a purely cosmetic change. The semantics are the same as we saw with threading.Lock: each method call gets its own separate 10 second timeout. So what's wrong with this? It seems straightforward enough. And if we always wrote code directly against these low level APIs, then it would probably be sufficient. But – programming is about abstraction. Say we want to fetch a file from S3. We might do that with boto3, using S3.Client.get_object. What does S3.Client.get_object do? It makes a series of HTTP requests to the S3 servers, by calling into the requests library for each one. And then each call to requests internally makes a series of calls to the socket module to do the actual network communication [1]. From the user's point of view, these are three different APIs that fetch data from a remote service: s3client.get_object(...) requests.get("https://...") sock.recv(...) Sure, they're at different levels of abstraction, but the whole idea of abstracting away such details is that the user doesn't have to care. So if our plan is to use timeout= arguments everywhere, then we should expect these each to take a timeout= argument: s3client.get_object(..., timeout=10) requests.get("https://...", timeout=10) sock.recv(..., timeout=10) Now here's the problem: if this is how we're doing things, then actually implementing these functions is a pain in the butt. Why? Well, let's take a simplified example. When processing HTTP response, there comes a point when we've seen the Content-Length header, and now we need to read that many bytes to fetch the actual response body. So somewhere inside requests there's a loop like: def read_body(sock, content_length): body = bytearray() while len(body) < content_length: max_to_receive = content_length - len(body) body += sock.recv(max_to_receive) assert len(body) == content_length return body Now we'll modify this loop to add timeout support. We want to be able to say "I'm willing to wait at most 10 seconds to read the response body". But we can't just pass the timeout argument through to recv, because imagine the first call to recv takes 6 seconds – now for our overall operation to complete in 10 seconds, our second recv call has to be given a timeout of 4 seconds. With the timeout= approach, every time we pass between levels of abstraction we need to write some annoying gunk to recalculate timeouts: def read_body(sock, content_length, timeout): read_body_deadline = timeout + time.monotonic() body = bytearray() while len(body) < content_length: max_to_receive = content_length - len(body) recv_timeout = read_body_deadline - time.monotonic() body += sock.recv(max_to_receive, timeout=recv_timeout) assert len(body) == content_length return body (And even this is actually simplified because we're pretending that sock.recv takes a timeout argument – if you wanted to this for real you'd have to call settimeout before every socket method, and then probably use some try/finally thing to set it back or else risk confusing some other part of your program.) In practice, nobody does this – all the higher-level Python libraries I know of that take timeout= arguments, just pass them through unchanged to the lower layers. And this breaks abstraction. For example, here are two popular Python APIs you might use today, and they look like they take similar timeout= arguments: import threading lock = threading.Lock() lock.acquire(timeout=10) import requests requests.get("https://...", timeout=10) But in fact these two timeout= arguments mean totally different things. The first one means "try to acquire the lock, but give up after 10 seconds". The second one means "try to fetch the given URL, but give up if at any point any individual low-level socket operation takes more than 10 seconds". Probably the whole reason you're using requests is that you don't want to think about low-level sockets, but sorry, you have to anyway. In fact it is currently not possible to guarantee that requests.get will return in any finite time: if a malicious or misbehaving server sends at least 1 byte every 10 seconds, then our requests call above will keep resetting its timeout over and over and never return. I don't mean to pick on requests here – this problem is everywhere in Python APIs. I'm using requests as the example because Kenneth Reitz is famous for his obsession with making its API as obvious and intuitive as possible, and this is one of the rare places where he's failed. I think this is the only part of the requests API that gets a big box in the documentation warning you that it's counterintuitive. So like... if even Kenneth Reitz can't get this right, I think we can conclude that "just slap a timeout= argument on it" does not lead to APIs fit for human consumption. Absolute deadlines are composable (but kinda annoying to use) If timeout= arguments don't work, what can we do instead? Well, here's one option that some people advocate. Notice how in our read_body example above, we converted the incoming relative timeout ("10 seconds from the moment I called this function") into an absolute deadline ("when the clock reads 12:01:34.851"), and then converted back before each socket call. This code would get simpler if we wrote the whole API in terms of deadline= arguments, instead of timeout= arguments. This makes things simple for library implementors, because you can just pass the deadline down your abstraction stack: def read_body(sock, content_length, deadline): body = bytearray() while len(body) < content_length: max_to_receive = content_length - len(body) body += sock.recv(max_to_receive, deadline=deadline) assert len(body) == content_length return body # Wait 10 seconds total for the response body to be downloaded deadline = time.monotonic() + 10 read_body(sock, content_length, deadline) (A well-known API that works like this is Go's socket layer.) But this approach also has a downside: it succeeds in moving the annoying bit out of the library internals, and and instead puts it on the person using the API. At the outermost level where timeout policy is being set, your library's users probably want to say something like "give up after 10 seconds", and if all you take is a deadline= argument then they have to do the conversion by hand every time. Or you could have every function take both timeout= and deadline= arguments, but then you need some boilerplate in every function to normalize them, raise an error if both are specified, and so forth. Deadlines are an improvement over raw timeouts, but it feels like there's still some missing abstraction here. Cancel tokens Cancel tokens encapsulate cancellation state Here's the missing abstraction: instead of supporting two different arguments: # What users do: requests.get(..., timeout=...) # What libraries do: requests.get(..., deadline=...) # How we implement it: def get(..., deadline=None, timeout=None): deadline = normalize_deadline(deadline, timeout) ... we can encapsulate the timeout expiration information into an object with a convenience constructor: class Deadline: def __init__(self, deadline): self.deadline = deadline def after(timeout): return Deadline(time.monotonic() + timeout) # Wait 10 seconds total for the URL to be fetched requests.get("https://...", deadline=after(10)) That looks nice and natural for users, but since it uses an absolute deadline internally, it's easy for library implementors too. And once we've gone this far, we might as well make things a bit more abstract. After all, a timeout isn't the only reason you might want to give up on some blocking operation; "give up after 10 seconds have passed" is a special case of "give up after <some arbitrary condition becomes true>". If you were using requests to implement a web browser, you'd want to be able to say "start fetching this URL, but give up when the 'stop' button gets pressed". And libraries mostly treat this Deadline object as totally opaque in any case – they just pass it through to lower-level calls, and trust that eventually some low-level primitives will interpret it appropriately. So instead of thinking of this object as encapsulating a deadline, we can start thinking of it as encapsulating an arbitrary "should we give up now" check. And in honor of its more abstract nature, instead of calling it a Deadline let's call this new thing a CancelToken: # This library is only hypothetical, sorry from cancel_tokens import cancel_after, cancel_on_callback # Returns an opaque CancelToken object that enters the "cancelled" # state after 10 seconds. cancel_token = cancel_after(10) # So this request gives up after 10 seconds requests.get("https://...", cancel_token=cancel_token) # Returns an opaque CancelToken object that enters the "cancelled" # state when the given callback is called. cancel_callback, cancel_token = cancel_on_callback() # Arrange for the callback to be called if someone clicks "stop" stop_button.on_press = cancel_callback # So this request gives up if someone clicks 'stop' requests.get("https://...", cancel_token=cancel_token) So promoting the cancellation condition to a first-class object makes our timeout API easier to use, and at the same time makes it dramatically more powerful: now we can handle not just timeouts, but also arbitrary cancellations, which is a very common requirement when writing concurrent code. (For example, it lets us express things like: "run these two redundant requests in parallel, and as soon as one of them finishes then cancel the other one".) This is a great idea. As far as I know, it originally comes from Joe Duffy's cancellation tokens work in C#, and Go context objects are essentially the same idea. Those folks are pretty smart! In fact, cancel tokens also solve some other problems that show up in traditional cancellation systems. Cancel tokens are level-triggered and can be scoped to match your program's needs In our little tour of timeout and cancellation APIs, we started with timeouts. If you start with cancellation instead, then there's another common pattern you'll see in lots of systems: a method that lets you cancel a single thread (or task, or whatever your framework uses as a thread-equivalent), by waking it up and throwing in some kind of exception. Examples include asyncio's Task.cancel, Curio's Task.cancel, pthread cancellation, Java's Thread.interrupt, C#'s Thread.Interrupt, and so forth. In their honor, I'll call this the "thread interrupt" approach to cancellation. In the thread-interrupt approach, cancellation is a point-in-time event that's directed at a fixed-size entity: one call → one exception in one thread/task. There are two issues here. The problem with scale is fairly obvious: if you have a single function you'd like to call normally but you might need to cancel it, then you have to spawn a new thread/task/whatever just for that: http_thread = spawn_new_thread(requests.get, "https://...") # Arrange that http_thread.interrupt() will be called if someone # clicks the stop button stop_button.on_click = http_thread.interrupt try: http'''
