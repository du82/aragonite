["https://vorpus.org/blog/some-thoughts-on-asynchronous-api-design-in-a-post-asyncawait-world"]
title = "Some thoughts on asynchronous API design in a post-async/await world — njs blog"
full_description = '''Some thoughts on asynchronous API design in a post-async/await world Sat 05 November 2016 I've recently been exploring the exciting new world of asynchronous I/O libraries in Python 3 – specifically asyncio and curio. These two libraries make some different design choices. This is an essay that I wrote to try to explain to myself what those differences are and why I think they matter, and distill some principles for designing event loop APIs and asynchronous libraries in Python. This is a quickly changing area and the ideas here are very much still under development, so this text probably assumes all kinds of background knowledge and possibly that you live inside my head – but maybe you'll find it interesting anyway. I'd love to hear what you think or discuss further. [Update, 2017-03-10: While the text below focuses on Curio, most of the commentary also applies to Trio, which is my new Curio-like library that came out of this blog post.] Contents: The curious effectiveness of curio Callback soup considered harmful Example: a simple proxy server Three examples Example #1: asyncio, with callbacks Example #2: curio, with async/await Example #3: asyncio, with async/await Three bugs Bug #1: backpressure Bug #2: read-side buffering Bug #3: closing time C-c-c-c-causality breaker Who needs causality, really? HTTP servers Websocket servers Other challenges for hybrid APIs Timeouts and cancellation Event loop lifecycle management Getting in touch with your event loop Context passing / task-local storage Implementation complexity Review and summing up: what is "async/await-native" anyway? Open questions ...for async/await-native APIs Orphan tasks Cleanup in generators and async generators ...for the Python asynchronous I/O ecosystem Do you really think everyone's going to abandon callbacks? So should I drop asyncio/twisted/etc. and rewrite everything using curio tomorrow? Should asyncio be "fixed" to have a curio-style async/await-native API? Okay, then should curio switch to using asyncio as a backend? Or what will the story be on cross-event-loop compatibility? I thought asyncio was supposed to be the event loop to end all event loops! Where next? Acknowledgements The curious effectiveness of curio So here's the tentative conclusion that spurred this essay, and which surprised the heck out of me: the more I work with curio, the more plausible it seems that in a few years, asyncio might find itself relegated to becoming one of those stdlib libraries that savvy developers avoid, like urllib2. I'm not saying that the library we'll all be using instead will necessarily be curio, or that asyncio can't possibly find some way to adapt and avoid this fate, or that you should go switch to curio right now – the practicalities of choosing a library are complicated. Let me put it in bold: This is not an essay about curio versus asyncio and which one is "the best". I'll talk a lot about those two libraries, but for present purposes I'm profoundly uninterested in things like which one wins at such-and-such microbenchmark as of which-ever latest release, and I don't have any personal investment in either. The reason I talk about them is because they make good illustrative examples of two very different design strategies. The goal of this essay is to understand the trade-offs between the "curio-style" design strategy versus the "asyncio-style" design strategy. So first, I'll try to articulate a conceptual framework for understanding what these two strategies actually are, and how they differ – this is something I haven't seen discussed elsewhere. Then to make that more concrete, I'll walk through some concrete examples using the two libraries, and see how these underlying design decisions play out in specific real world use cases. It turns out that in these examples, the "curio-style" produces better results; I'll try to pull out the general principles that explain why this happens, and that might give us hints on how to design or improve new APIs for both event loops and for the libraries that use them. Unfortunately, one of the conclusions I come to is that it's hard to see how these advantages could be "retrofitted" to asyncio – but I could be wrong, and at least once we understand them we can have a conversation about how to make Python's async I/O ecosystem as awesome as possible, whatever that ends up looking like; I'll conclude by sketching out some possible directions this could go. Callback soup considered harmful The basic difference between asyncio and curio comes down to their attitude towards Python 3.5's new async/await syntax. But before we talk about the best way to use async/await, lets digress to talk about why async/await even matters. ...Actually I'm going to digress even more then that. Let's start by talking about what programming languages are for. It's easy to forget sometimes just how much work a modern language like Python does to guide and constrain how you put together a program. Like, just for the most basic example, consider how simply juxtaposing two statements f(); g() expresses ordering: you know that g won't start executing until f has finished. Another example – the call stack tracks relationships between callers and callees, allowing us to decompose our program into loosely-coupled subroutines: a function doesn't need to keep track of who called it, it can just say return to fire a value into the void, and the language runtime makes some magic happen so the value and the control flow are delivered simultaneously to the right place. Exception handling defines a systematic, structured way to unwind these decoupled subroutines when something goes wrong; if you think about it this trick of taking the call stack and reusing it as the unwind stack is really quite clever. with blocks build on that by giving us an ergonomic way to pin the lifetime of resources – file handles and so forth – to the dynamic lifetime of these call stacks. Iterators track the state needed to bind control flow to the shape of data. These tools are so fundamental that they disappear into the background – when we're typing out code we don't usually stop to think about all the wacky ways that things could be done differently. Yet these all had to be invented. In functional languages, f(); g() doesn't express ordering. Back in the 1970s, the idea of limiting yourself to using just function calls, loops, and if statements – goto's hamstrung siblings – was *incredibly controversial*. There are great living languages that disagree with Python about lots of the points above. But Python's particular toolkit has been refined over decades, and fits together to provide a powerful scaffolding for structuring our code. ...until you want to do some asynchronous I/O. The traditional way to do this is to have an event loop and use callback-based programming: the event loop keeps a big table of future events that you want to respond to when they happen (e.g., "this socket became readable", "that timer expired"), and for each event you have a corresponding callback. The event loop takes care of checking for events and invoking callbacks, but if you want structure beyond that – like the kind of things we just discussed above: causal sequencing, delegation to and return from subroutines, error unwinding, resource cleanup, iteration – then you get to build that yourself. You can do it, just like you can use goto to build loops and function calls. Frameworks like Twisted and its descendents have invented all kinds of useful strategies for keeping these callbacks organized, like protocols and deferreds / futures and even some kind of exception handling – but these are still a pretty thin layer of structure on top of the underlying unstructured callback soup, and from the perspective of regular Python they're like some other mutant alternative programming language. That's why PEP 492 and async/await are so exciting: they let us take Python's regular toolkit for solving these problems, and start using it in asynchronous code. Which is awesome, because frankly, Twisted, I love you and deferreds are pretty cool, but as abstract languages for describing computation go then real-actual-Python is wayyy better. And with that background, then, I think I can articulate the key difference between asyncio-style event-loop APIs and curio-style event-loop APIs: Asyncio is first and foremost a traditional callback-based API, with async/await layered on top as a supplementary tool. And if you're starting from a callback-oriented base, then this is a great addition: async/await provide a major boost in usability without disrupting the basic framework. Asyncio is what we might call a "hybrid" system: callbacks plus async/await. Curio takes this a step further, and throws out the callback API altogether; it's async/await all the way down. Specifically, it still has an event loop, but instead of managing arbitrary callbacks, it manages async functions; there's exactly one way it can respond when an event fires, and that's by resuming an async call-stack. I'll call this the "async/await-native" approach. The main point I want to argue in this essay – the point of all the examples below – is that if you're using a hybrid API like asyncio, then you can ignore the callback API and write structured async/await code. But, even if you stick to async/await everywhere, the underlying abstractions are leaky, so don't get the full advantages. Your async/await functions are dumplings of local structure floating on top of callback soup, and this has far-reaching implications for the simplicity and correctness of your code. Python's structuring tools were designed to fit together as a system – e.g., exception handling relies on the call stack, and with blocks rely on exception handling – and if you have a mix of structured and unstructured parts, then this creates lots of unnecessary problems, even if you stick to the structured async/await layer of the library. In a curio-style async/await-native API, by contrast, your whole program uses this one consistent set of structuring principles, and this consistency – it turns out – has pervasive benefits. What I'm arguing, in effect, is that asyncio is a victim of its own success: when it was designed, it used the best approach possible; but since then, work inspired by asyncio – like the addition of async/await – has shifted the landscape so that we can do even better, and now asyncio is hamstrung by its earlier commitments. To make that more specific, let's look at some concrete examples. Example: a simple proxy server For our main example, I'll take a simple proxy server, equivalent to socat -u TCP-LISTEN:$LOCAL_PORT TCP:$REMOTE_HOST:$REMOTE_PORT. Specifically, given a local port, a remote host, and a remote port, we want to: Listen for connections on the local port. Accept a single connection. Make a connection to the remote host + port. Copy data from the local port to the remote port. (One way only, to keep things simple.) Exit after all the data has been copied. In addition, I'll follow these rules, to the best of my ability: Readability counts: I'll write each version in as elegant a manner as I can. No cheating: Since this is a toy one-off program, there are things we could get away with that wouldn't fly if this were real, reusable library code – like using global variables, or leaving open sockets dangling to be cleaned up by the kernel when our program exits. To make this more representative of real code, I'll hold myself to those higher standards. Three examples Example #1: asyncio, with callbacks Let's start by showing what this looks like using a traditional callback approach. (The two examples after this will demonstrate curio and asyncio's version of async/await-based APIs, which is what most people will want to use – this first example is to provide context for those.) I'll demonstrate with asyncio's "protocol" API, though the basic design here is inherited almost directly from the immensely influential Twisted (a Twisted version is also available for the curious). Here's the complete code, and then I'll give some commentary on how it works: Download source: asyncio-proxy-protocols.py 1import sys 2from functools import partial 3import traceback 4import asyncio 5 6class OneWayProxySource(asyncio.Protocol): 7 def __init__(self, loop, server_task_container, dest_host, dest_port): 8 self.loop = loop 9 self.server_task = server_task_container[0] 10 self.dest_host = dest_host 11 self.dest_port = dest_port 12 13 def connection_made(self, transport): 14 # Stop listening for new connections 15 self.server_task.cancel() 16 17 # Save our transport 18 self.transport = transport 19 20 # Disable reading until the destination is ready. 21 self.transport.pause_reading() 22 23 # Connect to the destination 24 self.dest_protocol = OneWayProxyDest(self.loop, self.transport) 25 coro = self.loop.create_connection(lambda: self.dest_protocol, 26 self.dest_host, self.dest_port) 27 task = self.loop.create_task(coro) 28 def connection_check_for_failure(fut): 29 exc = fut.exception() 30 if exc is not None: 31 print("Failed to connect:") 32 # This isn't really right -- it doesn't handle exception 33 # chaining etc. I lack the will to worry about it. 34 traceback.print_tb(exc.__traceback__) 35 self.transport.abort() 36 self.loop.stop() 37 task.add_done_callback(connection_check_for_failure) 38 39 def data_received(self, data): 40 self.dest_protocol.send_data(data) 41 42 def connection_lost(self, exc): 43 self.dest_protocol.close() 44 45class OneWayProxyDest(asyncio.Protocol): 46 def __init__(self, loop, source_transport): 47 self.loop = loop 48 self.source_transport = source_transport 49 50 def connection_made(self, transport): 51 self.transport = transport 52 # Okay, now we're ready for data to start flowing 53 self.source_transport.resume_reading() 54 55 def send_data(self, data): 56 self.transport.write(data) 57 58 def close(self): 59 self.transport.write_eof() 60 61 def connection_lost(self, exc): 62 self.source_transport.abort() 63 self.loop.stop() 64 65def main(source_port, dest_host, dest_port): 66 loop = asyncio.get_event_loop() 67 server_task_container = [] 68 coro = loop.create_server( 69 lambda: OneWayProxySource(loop, server_task_container, 70 dest_host, dest_port), 71 "localhost", source_port) 72 server_task = loop.create_task(coro) 73 server_task_container.append(server_task) 74 loop.run_forever() 75 loop.close() 76 77if __name__ == "__main__": 78 try: 79 args = [int(sys.argv[1]), sys.argv[2], int(sys.argv[3])] 80 except Exception: 81 print("Usage: {} SOURCE_PORT DEST_HOST DEST_PORT".format(__file__)) 82 else: 83 main(*args) There's a lot going on here, and the details aren't that important; like I said, this is mostly here to provide context for the next two examples. As a rough outline to get the idea, though: OneWayProxySource manages the incoming connection. When a connection is made (line 13) it first does some bookkeeping, then starts'''
