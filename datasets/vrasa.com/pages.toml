["http://vrasa.com/closeup/archive"]
title = ""
full_description = "Your Closeup bot automates the process of telling fans what you're up to and how they can support you. Make it easier for fans to buy tickets and merch, and more of them will. Artists need to grow their fanbases. Duh. But it's not just a quantity game. You also need to identify your most loyal fans and create a special way to communicate with them. Closeup bots do that for you automatically. Facebook's organic reach has fallen below 6%, which means that savvy artists, influencers, and brands are now using bots to keep their best fans in the loop. They're spending less money on higher engagement: 90% read rates and 20-40% click-through rates. You should be next."
