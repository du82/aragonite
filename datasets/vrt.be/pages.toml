["https://vrt.be/nl/ons-aanbod/radio-1"]
title = "Radio 1 | VRT"
description = "Radio 1 is de actuazender in Vlaanderen die zijn luisteraars prikkelt en inspireert."
full_description = "Home/Ons aanbod/Radio 1Radio 1Radio 1 is de actuazender in Vlaanderen die zijn luisteraars prikkelt en inspireert.Radio 1 is dé actuaradio van de Vlaamse publieke omroep VRT. Radio 1 prikkelt en inspireert de mediagebruiker met nieuwe inzichten. De zender brengt algemeen nieuws en sport, en besteedt veel aandacht aan politiek, cultuur en wetenschap. Hij volgt belangrijke ontwikkelingen in de samenleving op de voet en initieert maatschappelijk debat. Radio 1 zet in op een sterk informatief audio-on-demand aanbod. Het is ook de meest diverse muziekzender van Vlaanderen, met klassieke en hedendaagse pop, veel Vlaamse en Nederlandstalige producties en een mix van andere muziekgenres.De ochtend (KIES24) met Ruth Joos ©VRTRadio 1 is het VRT-merk bij uitstek dat zijn publiek door de brede actualiteit gidst en mensen inspireert met nieuwe ontdekkingen, inzichten en ervaringen. Radio 1 is er voor iedereen in Vlaanderen die benieuwd in het leven staat en de wereld rondom zich wil leren kennen. Het merk speelt in op die behoefte naar méér met een uitgebreid, betrouwbaar en divers nieuwsaanbod: nieuws heet van de naald en uitleg over hoe de zaken in de samenleving echt in elkaar zitten. Radio 1 biedt mogelijkheden om de wereld te ontdekken, om meer te weten, om dieper te begrijpen. Het aanbod van het merk is erop gericht om vanzelfsprekendheden in vraag te stellen en het publiek te verrassen met nieuwe inzichten en straffe verhalen. Betrouwbare gids Radio 1 is een betrouwbare gids die feiten checkt en het nieuws op de voet volgt. Nieuwsbulletins houden de luisteraars de hele dag door op de hoogte van de laatste ontwikkelingen. Het merk staat in het hier en nu en volgt de hartslag van het nieuws op het ritme van de luisteraar. Het rijke en gedifferentieerde nieuwsaanbod wordt gebracht door vaste, herkenbare nieuwspersoonlijkheden. Dankzij een flexibel en open programmaschema kan Radio 1, in samenwerking met VRT NWS, nieuws en informatie altijd in het aanbod integreren. ’s Ochtends zet Radio 1 de agenda, met een breed overzicht van wat die dag van belang is. In het dagelijks programma De ochtend komen sleutelfiguren langs voor de eerste reacties en interviews. Eigen en externe experts zorgen voor analyses en duiding. Wie de ochtend start met Radio 1 begint goed geïnformeerd aan de dag. Ook De wereld vandaag houdt je op de hoogte. De belangrijkste actualiteit van de dag komt er aan bod, gepaard met scherpe interviews en analyses. De programma’s belichten de actualiteit in alle domeinen: politiek, economie, wetenschap, mens en samenleving, technologie, cultuur, welzijn en gezondheid,... Geniet van Radio 1Luister nu opVRT MAXAlles begint bij luisteren Radio 1 is meer dan een actuazender. Het merk is voortdurend verwonderd over wat er rondom ons gebeurt en durft dingen in vraag te stellen. Wetenschappelijke theorieën, menselijke gedragingen, persoonlijke getuigenissen, historische inzichten, lessen uit buurlanden en exotische contreien,… Alles kan programmamakers en luisteraars boeien en inspireren. Radio 1 wil informeren en niet polariseren. Inspireren en niet imponeren. Het merk wil inzicht en een zicht op mogelijke oplossingen bieden, maar laat oordelen aan de kritische luisteraars over. Daardoor is Radio 1 een aangename, empathische en interessante compagnon. Programma’s hebben een sterke identiteit op de radio, in podcastvorm en online omdat ze op een originele en creatieve manier aan de slag gaan met thema’s als zorg, wetenschap, milieu, cultuur, geschiedenis en mens en maatschappij. Andere programma’s focussen dan weer op diepgaande, persoonlijke gesprekken met interessante gasten. Culture Club ©VRTCultuur in het hart Het cultuuraanbod is verankerd in de hele zender. Kunstenaars en artiesten zijn veelgevraagde gasten in de praatprogramma’s. Radio 1 heeft oog voor cultuuractualiteit in de informatieprogramma’s en voor culturele ontdekking en verdieping in vele andere programma’s. De Radio 1-programmamakers zijn fervente boekenlezers. Dat enthousiasme proberen ze over te brengen naar de luisteraars. Boeken zijn vaak een aanleiding voor een gesprek of een item in een programma. Gebeten door de sport Radio 1 biedt als enige radiozender live sportverslaggeving aan. Soms zijn dat integrale wedstrijden, vaak ook flitsen van spannende momenten of finales. Want ook voor sport wil Radio 1 een gids zijn. De analyses en duiding reiken verder dan de wedstrijden alleen. Het merk bericht evenzeer over wat er zich rond het veld en in de bestuurskamers afspeelt. Wielrennen, veldrijden en voetbal: de typische Vlaamse sportliefhebber komt bij Radio 1 ruimschoots aan zijn trekken voor zijn lievelingssporten. Ook kleinere sporten krijgen een plaats op de radio. Radio 1 covert jaarlijks meer dan 45 verschillende sporten. Dat is meer dan welke radiozender ook. Sporza op Radio 1 met Gert Geens en Babette Moons © VRTMuzikale variatie troef Op Radio 1 hoor je het meest gevarieerde muzikale aanbod van alle Vlaamse radiozenders. Er is ruimte voor nieuwe en klassieke pop en rock, maar ook folk, blues, jazz en wereldmuziek. Talent van eigen bodem heeft een streepje voor. Radio 1 heeft ruimschoots aandacht voor nieuwe Belgische releases en geeft lokale artiesten speelgelegenheid op kleinere en grotere podia met de Radio 1-sessies op originele locaties. 15% van de muziek op Radio 1 is Nederlandstalig. De gesmaakte Lage Landenlijst zet die muziek jaarlijks nog eens extra in de kijker. Ook niet-Nederlandstalige muziek uit eigen land krijgt heel wat aandacht. Dat gebeurt doorheen de dag in de playlist, maar ook in programma’s als Belpop en acties als de Belpop 100. Podcast Het uur van de waarheid ©VRTRadio 1 leeft ook online De straffe verhalen van Radio 1 krijgen ook hun plek op de website, en stromen vaak door naar vrtnws.be waar ze een nog breder publiek bereiken.. Naast de enorme populariteit van live radio, is er ook een groeiende belangstelling voor audio on demand. Podcasts worden meer dan ooit opgevraagd en beluisterd. Radio 1 Select biedt de strafste, ontroerendste en belangrijkste verhalen van Radio 1 in korte audiofragmenten aan via radio1.be en de app van Radio 1.Ontdek de podcasts van Radio 1TouchéNieuwe Feiten#weetikveelDe Wereld van SofieGeishaVoorproeversVraag het aan RikaUniversiteit van VlaanderenIemandLeesbaarLuister nu opVRT MAXMeer weten? Lees ook deze artikelsNieuws & informatieRadio 1 zet met nieuw logo en nieuwe huisstijl ook volop in op digitale platformen en veranderend luistergedragMuziekZing Mia Mee: VRT herdenkt Luc De VosProductiesRadio 1 viert 1000ste aflevering van De wereld van SofieMuziek‘Ruimtevaarder’ van Kommil Foo scoort opnieuw eerste plaats in Radio 1 Lage LandenlijstRadio 1-podcast 'Kind van de tornado' onderzoekt allesverwoestende windhoos in OostmalleRadio 1-Podcast 'De 9 levens van Yassine’ duikt in het verhaal van Belgen met Marokkaanse achtergrond'Les yeux de ma mère' van Arno op nummer 1 in de Radio 1 Belpop 100Het wordt geen 'Stille nacht' bij VRT: een kerstaanbod om warm van te wordenVerken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerDuik in het Radio 1-kijkaanbod op VRT MAXOntdek nu opVRT MAXBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
