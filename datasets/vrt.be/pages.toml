title = "Beleid | VRT"
description = "Wat zijn de basisprincipes van het VRT-beleid?We volgen beroepsethische principes, we handelen op een sociaal verantwoorde manier, we zetten in op duurzaamheid, we doen aan maatschappelijk verantwoord ondernemen en we zetten functionele kwaliteit en operationele kwaliteit op de eerste plaats."
full_description = "Home/Over ons/Onze organisatie/BeleidBeleidWat zijn de basisprincipes van het VRT-beleid?We volgen beroepsethische principes, we handelen op een sociaal verantwoorde manier, we zetten in op duurzaamheid, we doen aan maatschappelijk verantwoord ondernemen en we zetten functionele kwaliteit en operationele kwaliteit op de eerste plaats.De functionele kwaliteit is de mate waarin het aanbod inspeelt op de verwachtingen van de mediagebruiker en de operationele kwaliteit is de mate waarin de beoogde producties op een professionele, effectieve en efficiënte manier tot stand komen. Dat kan gemeten worden aan de hand van: bereik, waardering en tevredenheid.BereikDe mate waarin een programma inspeelt op de behoeften van kijkers of luisteraars, is af te leiden uit de mate waarin zij ernaar kijken of luisteren. VRT maakt in de eerste plaats gebruik van de officiële cijfers van het Centrum voor Informatie over de Media (CIM).WaarderingDe kijker en luisteraar die een programma bekeken of beluisterd heeft, heeft er in principe ook een mening over.De waardering voor een productie wordt gemeten bij een panel van mediagebruikers. Daardoor kan VRT een beroep doen op objectieve gegevens.Klachten en meningen van kijkers en luisteraars zijn anderzijds belangrijk om relevante opmerkingen te kennen.TevredenheidDe mediabehoeften verschillen van persoon tot persoon en van moment tot moment. Zo willen veel mensen in de eerste plaats geïnformeerd worden, maar hebben ze op sommige momenten juist behoefte aan ontspanning. De mate waarin de VRT daarmee rekening houdt, bepaalt de tevredenheid van de mediagebruikers.IntegriteitVRT heeft een voorbeeldrol en wil een referentiepunt zijn voor de mediagebruiker. Ze streeft in haar aanbod de hoogste kwaliteit na en hanteert de hoogste ethische en redactionele standaarden. Voor VRT zijn betrouwbaarheid, onpartijdigheid, geloofwaardigheid, diversiteit en integriteit prioritair.Lees meerSociaal Charter voor de mediasectorEind 2013 hebben VRT, andere Vlaamse en regionale omroepen, mediavakbonden, koepelorganisaties, beroepsverenigingen, enkele individuele bedrijven en de minister van Media een Sociaal Charter voor de Audiovisuele Sector ondertekend.Lees meerMaatschappelijk verantwoord ondernemenVRT houdt zich als bedrijf aan een aantal principes inzake maatschappelijk verantwoord ondernemen. Lees meerPublieke meerwaarde VRTVRT focust op publieke meerwaarde en onderscheidt zich zo van de andere mediaspelers in Vlaanderen.Lees meerDuurzaamheidVRT wil als organisatie streven naar duurzaamheid: bij alles wat ze doet zo goed mogelijk rekening houden met de socio-economische en maatschappelijke context en met de impact op ecologie en klimaat. Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
