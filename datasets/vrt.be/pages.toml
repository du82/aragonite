title = "'Black' van Pearl Jam opnieuw op nummer 1 in De tijdloze 100 | VRT"
description = "Voor het tweede jaar op rij staat 'Black' van Pearl Jam helemaal bovenaan in De tijdloze 100. ‘Black’ stond eerder al op die eerste plek van 2015 tot en met ​2020, en ook vorig jaar stond het nummer bovenaan de lijst. Het nummer haalt dus nu voor de achtste keer de gegeerde hoofdprijs binnen. 'Mia' van Gorki en 'The Chain' van Fleetwood Mac vervolledigen de top 3."
full_description = "Home/Over ons/Nieuws over VRT/'Black' van Pearl Jam opnieuw op nummer 1 in De tijdloze 100'Black' van Pearl Jam opnieuw op nummer 1 in De tijdloze 10031 december 2024Voor het tweede jaar op rij staat 'Black' van Pearl Jam helemaal bovenaan in De tijdloze 100. ‘Black’ stond eerder al op die eerste plek van 2015 tot en met ​2020, en ook vorig jaar stond het nummer bovenaan de lijst. Het nummer haalt dus nu voor de achtste keer de gegeerde hoofdprijs binnen. 'Mia' van Gorki en 'The Chain' van Fleetwood Mac vervolledigen de top 3.Maar het was ook een De tijdloze 100 vol verrassingen en wendingen! 2024 was een muzikaal actueel jaar, en dat zie je ook in De tijdloze 100. Zo staan er wel 10 nieuwe artiesten in de lijst. Opvallendste namen zijn Lynyrd Skynyrd (met 'Free Bird'), Eminem (met 'Lose Yourself') en ook popprinses Taylor Swift staat met haar 10 minuten durende 'All Too Well' in de lijst.De nieuwkomers:Nick Cave – Jubilee StreetLynyrd Skynyrd – Free BirdOasis – WonderwallNina Simone – Feeling GoodTaylor Swift - All Too Well (10 Minute Version)Eminem – Lose YourselfNick Cave – O ChildrenPhil Collins – In The Air TonightPrince – Sometimes It Snows in AprilAC/DC - ThunderstruckEindejaarstraditieDit jaar werd De tijdloze 100 al voor de 37ste keer op Studio Brussel uitgezonden. De tijdloze 100 is daarmee de langstlopende en de meest gereputeerde eindejaarslijst in Vlaanderen. Ook voor deze editie was de respons van luisteraars op de stemoproep opnieuw gigantisch. Presentatoren van dienst waren Kirsten Lemaire en Stijn Van De Voorde. Voor Kirsten was het haar eerste keer dat ze De Tijdloze 100 mocht presenteren.Sinds 18 december konden de luisteraars al mee aftellen in De tijdloze countdown met ​ nummers die top honderd net niet haalden. Op 18 december begon de digitale radiozender De Tijdloze met aftellen en vanaf 26 december zond Studio Brussel De tijdloze countdown uit, live vanuit De Kreun in Kortrijk.De Tijdloze was afgelopen week ook live op televisie te volgen op VRT CANVAS en op VRT MAX. Michèle Cuvelier ging samen met Compact Disk Dummy Lennert Coorevits en tijdloze all stars Stijn Van de Voorde, Kirsten Lemaire en Thibault Christiaensen in de talkshow op zoek naar straffe verhalen, onverwachte verbanden en verrassende details die schuilgaan achter tijdloze songs.De tijdloze 100 van 2024Dit zijn de meest opvallendste weetjes uit De tijdloze 100 van 2024:Nick Cave is dit jaar de populairste artiest: de Australische singer-songwriter staat met 4 songs (!) in de lijst, dat zijn er 2 meer dan vorig jaar.Dit jaar zijn er 2 grootste stijgers: Daan met het nummer 'Housewife' stijgt 36 plaatsen. Misschien heeft zijn passage op Rock Werchter en samenwerking met rapper Glints iets mee te maken? Hun samenwerking op het festival werd een van dé zomersingles en stond wekenlang op 1 in De afrekening.Ook het nummer 'Dog Days Are Over' van Florence + The Machine stijgt 38 plaatsen.Er zijn ook weer enkele Tijdloze sterkhouders: Pink Floyd, Dire Straits, Fleetwood Mac en Bruce Springsteen staan elk met 3 nummers in de lijst.België boven, ook in De tijdloze 100! Er staan maar liefst 6 Belgen in de lijst: Gorki, dEUS, Daan, Goose, Arno (solo en met) TC Matic.'Mia' van Gorki springt naar de tweede plek. Het is dit jaar 10 jaar geleden dat Luc De Vos stierf, en dat werd vorige maand nog geëerd met Zing Mia Mee.Nieuw in de top 10: Linkin Park met hun nummer 'In The End'. De band kondigde in 2024 hun comeback aan, en dat wordt ook beloond met een plekje in de top 10 van De tijdloze 100.Ook nieuw in de top 10: Michael Kiwanuka met zijn nummer 'Cold Little Heart'. Na zijn verbluffende passage op Rock Werchter staat hij dit jaar in de top 10.De top 10 van De tijdloze 100 20241Pearl JamBlack2GorkiMia3Fleetwood MacThe Chain4Pink FloydWish You Were Here5Linkin ParkIn The End6QueenBohemian Rhapsody7The CureA Forest8Sinéad O'ConnorTroy9NirvanaSmells Like Teen Spirit10Michael KiwanukaCold Little HeartDe Tijdloze 100 herbeleven?Meer tijdloze muziek hoor je elke dag op digitale radio De Tijdloze via DAB+ en de app van VRT MAX.Niet kapot te krijgenVRT MAXZing Mia MeeHet is dit jaar 10 jaar geleden dat Luc De Vos stierf, en dat werd vorige maand nog geëerd met Zing Mia Mee.Zing Mia Mee opVRT MAXMeer muziek bij VRTMuziekWereldradiodag: echt merci aan alle VRT-radiotoppers!Cultuur | MuziekKlara stelt jong talent voor in vijfde editie van De Twintigers MuziekRed Sebastian gaat voor België naar het Eurovisiesongfestival in Bazel met 'Strobe lights'MuziekAlice Mae, Kaat Van Stralen en Uwase zijn de winnaars van De Nieuwe Lichting 2025MuziekPommelien Thijs en Sylvie Kreusch grote winnaars van de MIA’s 2024MuziekMIA’s 2024: Daphne Agten, Lotte Kopecky, Philippe Geubels en heel wat andere populaire uitreikers maken de winnaars bekendMuziekMia’s Sessies op VRT CanvasMuziekZo klinkt de Week van de Belgische muziek bij VRTDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
