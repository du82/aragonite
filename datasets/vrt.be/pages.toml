description = "Het radioaanbod is te ontvangen met een gewoon radiotoestel met FM-antenne. De frequenties van de VRT-radionetten vind je hier."
full_description = "Home/Ons aanbod/FM-antenneFM-antenneHet radioaanbod is te ontvangen met een gewoon radiotoestel met FM-antenne. De frequenties van de VRT-radionetten vind je hier.Radio 1in Antwerpen op 94.2 MHzin Vlaams-Brabant op 91.7 MHzin Leuven op 98.5 MHzin Limburg op 99.9 MHzin Oost- en West-Vlaanderen op 95.7 MHzRadio2in Antwerpen op 97.5 MHzin Vlaams-Brabant op 93.7 MHzin Leuven op 88.7 MHzin Diest op 92.4 MHzin Limburg op 97.9 MHzin Oost-Vlaanderen op 98.6MHzin Dendermonde, Aalst Temse op 90.7 MHzin het Waasland op 89.8 MHzin West-Vlaanderen op 100.1 MHzKlarain Antwerpen op 96.4 MHzin Vlaams-Brabant op 89.5 MHzin Limburg op 89.9 MHzin Oost-Vlaanderen op 92.0 MHzin West-Vlaanderen op 90.4 MHzMNMin Antwerpen op 89.0 MHzin Brussel op 88.3 MHzin Vlaams-Brabant op 97.0 MHzin Leuven op 94.8 MHzin Limburg op 102.0 MHzin Noord-Limburg op 93.0 MHzin Oost-Vlaanderen op 101.5 MHzin West-Vlaanderen op 101.5 MHzStudio Brusselin Antwerpen op 100.9 MHzin Vlaams-Brabant op 100.6 MHzin Leuven op 88.0 MHzin Limburg op 101.4 MHzin Oost-Vlaanderen op 102.1 MHzin Gent op 94.5 MHzin West-Vlaanderen op 102.1 MHzWat kan je doen om naar jouw voorkeurregio te blijven luisteren?Je kan twee functies instellen:Alternative frequency (AF)Als je te ver buiten jouw provincie rijdt en Radio 2 in goede kwaliteit wenst te horen, dan is het nodig dat je de functie AF terug AAN zet.Regionale functie (REG)Indien op AAN: belet het verspringen naar een andere regionale frequentie van hetzelfde net, de tuner blijft dus op dezelfde frequentie.Lees hiervoor de handleiding van je toestel, vraag je verkoper om uitleg of kijk op de website van de producent.Regionale uitzendingen Radio 2 via DAB+Het is over het ganse Vlaamse grondgebied mogelijk om de 5 regionale omroepen te beluisteren via DAB+.Je kan dus, als je bijvoorbeeld een West-Vlaming in Gent bent, de ochtendpost van Radio 2 West-Vlaanderen beluisteren. Het kan dat zelfs als je in de file op weg naar Brussel staat.Alle regionale radiozenders van Radio2 zijn gratis beschikbaar met DAB+. Je kan je favoriete zender beluisteren in heel Vlaanderen op één en dezelfde frequentie zonder onderweg opnieuw te moeten afstemmen zoals bij FM.Meer informatie over RDSHet Radio Data Systeem of RDS is een communicatiestandaard, waarmee digitale informatie wordt meegestuurd met een FM-radiosignaal. In dit RDS-signaal zit bijvoorbeeld de naam van het station, de frequenties en het soort programma.Met RDS wordt er naar de radio een AF gestuurd. Het radiotoestel kijkt welke frequentie (de huidige of de alternatieve) het sterkste is.Bij verkeersinformatie zendt een radiostation een RDS TA/TP-signaal uit. De ontvanger kan dan bijvoorbeeld de cd-speler even onderbreken en overschakelen naar de verkeersinformatie en schakelt daarna weer terug.StreamingslinksOnze radiostreams zijn ook te beluisteren via andere platformen dan die van VRT. Een aantal mensen doen bijvoorbeeld een beroep op streamingdiensten als TuneIn of vTuner om naar VRT te luisteren. Vaak ook onbewust omdat bepaalde hardware audiosystemen (Sonos, HEOS, Samsung,…) onze radiozenders via deze streamingdiensten aanbieden. Om ook via die diensten te kunnen blijven luisteren, biedt VRT hier een overzicht van de streaming-url’s.Radio 1Radio 1 is de actuazender in Vlaanderen die zijn luisteraars prikkelt en inspireert.Radio2Radio2 biedt houvast, ontspanning en optimisme met praktische tips voor het dagelijkse leven en helpt de luisteraars om de wereld veraf en dichtbij beter te begrijpen.MNMMNM is dé hitradio die helemaal draait om jongeren en hun leefwereld. Met de beste muziek en boeiende content gidst MNM jongeren door alles wat speelt in hun wereldje, van de nieuwste trends tot relevante info die je echt niet wilt missen. MNM is een positief en energiek platform waar je ervaringen kunt delen en je je thuis voelt in een community die inspireert en verbindt!Studio BrusselStudio Brussel is het trendsettende muzikale radiomerk van VRT. Studio Brussel stimuleert een jonge actieve bevolking om creatief en eigenzinnig naar de wereld te kijken, met muziek als motor. Door onderscheidende keuzes en scherpe redactionele reflexen komt de zender tegemoet aan de behoeften van hun kritische en maatschappelijk bewuste community. Studio Brussel is bovendien een katalysator binnen de Vlaamse muzieksector en vervult een muzikale gidsfunctie, aangepast aan de digitale noden van de luisteraar. KlaraKlara is de klassieke radiozender van de Vlaamse publieke omroep VRT. Klara biedt mediagebruikers een vluchtheuvel van rust en schoonheid. Als actieve partner van de cultuur- en muzieksector zet Klara in op de beleving en het genieten van cultuur en klassieke muziek, maar ook van jazz, hedendaagse muziek, film- en wereldmuziek. Klara steunt en organiseert spraakmakende acties en events rond klassieke muziek. Het biedt ook inzicht en verdieping op het gebied van kunst, geschiedenis, muziek en maatschappelijke thema’s. Radio BeneVRT Radio Bene is de digitale radiozender die zorgt voor de tijd van je leven. Met de mooiste evergreens en de beste artiesten van bij ons. Je kan er genieten van de hits van onze gevestigde waarden en je ontdekt nieuw aanstormend muzikaal talent. De TijdlozeHet digitale radiostation De Tijdloze brengt de beste, tijdloze muziek van de afgelopen zestig jaar. Te beluisteren via DAB+ en online via VRT MAX.Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
