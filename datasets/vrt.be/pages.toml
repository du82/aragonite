["https://vrt.be/nl/over-ons/onze-opdracht/resultaten"]
title = "Resultaten | VRT"
description = "Hoe scoren we bij ons publiek? Hier vind je de prestaties van VRT in woorden en cijfers."
full_description = "Home/Over ons/Onze opdracht/ResultatenResultatenHoe scoren we bij ons publiek? Hier vind je de prestaties van VRT in woorden en cijfers.Resultaten van onderzoekVRT-studiedienst doet zelf veel onderzoek en geeft regelmatig de opdracht aan onafhankelijke instellingen om onderzoek te doen. De resultaten van die onderzoeken zijn er op gericht dat VRT haar opdracht met kennis van zaken kan uitvoeren. Van enkele onderzoeken maakt VRT de resultaten publiek bekend. Naast het bereiksonderzoek en het waarderingsonderzoek voert de VRT-studiedienst ook andere mediastudies uit. VRT doet onderzoek naar mediatrends. Zoiets is van strategisch belang. Enkel zo kunnen we onze missie om alle Vlamingen te bereiken waarmaken. Bekijk de onderzoeksresultatenPrijzen en nominatiesOntdek welke prijzen en nominaties we in de wacht sleepten.Lees meerKlachtenrapportVRT-klantendienst en de Nieuwsombudsman brengen elk jaar verslag uit bij de Vlaamse Ombudsman over hun activiteiten.Lees meerJaarverslagVRT legt elk jaar een jaarverslag voor aan het Vlaams Parlement. VRT wist de Vlaming in 2023 meer dan ooit te raken, te informeren en te verbinden. Uit het Jaarverslag 2023 van VRT blijkt dat de publieke omroep op weekbasis liefst 88,9% van alle Vlamingen en 89,4% van alle min-25-jarigen bereikte.Lees meerWist je dat?Hoe meet VRT het gebruik en de waardering van haar aanbod?De studiedienst van VRT monitort voortdurend het gedrag en de behoeften van de mediagebruikers. Dit doet zij aan de hand van de verschillende bereikstudies en van verschillende kwantitatieve en kwalitatieve onderzoeken die peilen naar de waardering en de behoeften van de Vlaming.Lees meerPrijzen en nominatiesKijk-en luistercijfersWaar kan ik kijk-, luister- en surfcijfers vinden?KlachtenrapportDe VRT-klantendienst en de Nieuwsombudsman brengen elk jaar verslag uit bij de Vlaamse Ombudsman over hun activiteiten.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
