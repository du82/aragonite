description = "Voor het gebruik van VRT MAX en een aantal toepassingen op onze websites en apps moet u een VRT-profiel aanmaken. De belangrijkste vragen kunt u hier vinden."
full_description = "Home/VRT-profiel/Vragen over het VRT-profiel zelfVragen over het VRT-profiel zelfVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites en apps moet u een VRT-profiel aanmaken. De belangrijkste vragen kunt u hier vinden.Wat is het VRT-profiel?Met het VRT-profiel kan je aanmelden bij elke website en app van VRT: je hebt dus maar één enkel profiel nodig voor al onze digitale producten! Heel handig. En alle VRT-merken doen mee met het profiel: VRT NWS, VRT MAX, Sporza, VRT 1, VRT Canvas, Radio 1, Radio2, Studio Brussel, MNM, Klara, De Warmste Week, Dagelijkse Kost… Kan ik de VRT-websites en -apps gebruiken zonder VRT-profiel?Uiteraard kan je onze websites en apps bezoeken zonder VRT-profiel. Maar: zodra je iets interactiefs wil doen - zoals een video bekijken, deelnemen aan een wedstrijd of stemming, een reactie doorgeven aan een redactie… - dan moet je wel aanmelden met het VRT-profiel. Uitzondering live kijken: Via VRT MAX kan je wel live kijken zonder aan te melden. Ook bepaalde Ketnet-content is beschikbaar zonder aan te melden Zijn er kosten verbonden aan het VRT-profiel?Nee hoor, aan het VRT-profiel zijn geen kosten verbonden.Wat zijn de voordelen voor mij?Heb je een VRT-profiel? Dan geniet je van volgende voordelen: Optimaal de VRT-merken beleven: Met het VRT-profiel maak je op een betrouwbare en makkelijke manier optimaal en veilig gebruik van al het moois dat onze websites en apps aanbieden: de beste programma’s en video’s bekijken, deelnemen aan alle wedstrijden of stemmingen, een reactie doorgeven aan één van onze redacties… Je gegevens centraal beheren: Je beheert je VRT-profiel op één centrale plaats: je persoonsgegevens, je voorkeuren per VRT-merk, je nieuwsbriefabonnementen… ze staan allemaal mooi bij elkaar en zijn vlot aanpasbaar. Eén adres: het beheersplatform van het VRT-profiel. “Eénmalige aanmelding” en “aangemeld blijven”: Je blijft automatisch aangemeld als je van de ene VRT-website naar de andere gaat, of als je terugkeert naar een eerder bezochte VRT-website. Gedaan met steeds opnieuw aan te moeten melden. Inhoud die écht bij je past: Op basis van je profielgegevens krijg je relevantere inhoud te zien: nieuws uit je eigen regio, verder kijken waar je gebleven was bij je favoriete reeks,… Bij welke VRT-websites en -apps kan ik het VRT-profiel gebruiken?Bij alle websites en apps van VRT, want al onze merken doen mee: VRT NWS, VRT MAX, Sporza, VRT 1, VRT Canvas, Radio 1, Radio2, Studio Brussel, MNM, Klara, De Warmste Week, Dagelijkse Kost… Hoe kan ik zien of een VRT-website/-app het VRT-profiel gebruikt?Als een VRT-website of -app het VRT-profiel gebruikt, dan zie je een aanmeldicoon staan: Websites: Op de desktopversie van onze websites staat het aanmeldicoon bovenaan (links of rechts) het scherm. Op de mobiele versie van onze websites vind je het aanmeldicoon in het mobiel menu. Apps: In de VRT-apps vind je het aanmeldicoon in het mobiel menu. Werkt mijn VRT-profiel nog (volledig) als ik enkel de minimale cookies aanvaard? Absoluut, maak je geen zorgen. Ook als je enkel de minimale cookies aanvaardt op onze websites en in onze apps, dan kan je nog steeds voluit genieten van alle voordelen van het VRT-profiel. Als je meer wil weten over onze cookies, raadpleeg dan zeker de VRT-cookiesverklaring.Wat doet VRT met mijn persoonsgegevens/surfgedrag als ik een VRT-profiel heb? We houden steeds rekening met je privacy als we je gegevens gebruiken. We zijn daar ook heel transparant over. Op basis van je surfgedrag tonen we op bepaalde plaatsen in een website/app relevante(re) inhoud, en de websites en apps die je vaak gebruikt, laten we nog beter aansluiten bij je echte interesses. Daarnaast moeten we ook een aantal gegevens rapporteren aan de Vlaamse overheid en in ons jaarverslag publiceren: hoeveel bezoekers hebben we, bereiken we wel elke Vlaming, wat wordt het vaakst bekeken, gelezen, beluisterd…? Jouw privacy is onze zorg: We hechten veel belang aan je privacy en veiligheid op onze websites en apps. Alle informatie over hoe VRT omgaat met de privacy van haar bezoekers en gebruikers kan je vinden op Mijn privacy. Krijg ik veel communicatie van VRT als ik een profiel heb? Heb je een VRT-profiel, dan ontvang je automatisch onze VRT Update. In deze e-mail staan interessante en relevante kijk-, luister- en leestips uit het ruime en gevarieerde aanbod van VRT. Zo heb je steeds inspiratie om iets (nieuws) te ontdekken: volgens jouw persoonlijke smaak en aangevuld met verrassende ideeën. En je bent meteen op de hoogte van onze nieuwste acties en updates over het VRT-profiel. Deze VRT Update hoort bij onze publieke opdracht: jou activeren, en zo goed en breed mogelijk, inspireren en informeren. Wil je deze updates niet meer ontvangen? Dan kan je je makkelijk uitschrijven via de link onderaan het e-mailbericht. Je bepaalt zelf of je ook nog andere communicaties van ons wil ontvangen zoals nieuwsbrieven, berichten over interessante initiatieven van VRT of één van haar merken. Je kan je toestemmingen voor deze extra communicaties makkelijk beheren in je VRT-profiel. Waarom wordt mijn gsm-nummer gevraagd als ik buiten België het aanbod van VRT MAX of Sporza wil bekijken?VRT heeft helaas niet de rechten om alles overal te laten zien. Toch kan je als inwoner van België in de hele EU, Liechtenstein, Ijsland en Noorwegen met je VRT-profiel het hele aanbod van VRT MAX en Sporza bekijken. We moeten daarvoor wel controleren of je officieel in België woont, want voor sommige programma’s hebben wij enkel de rechten voor België. Die controle doen we door te checken of je een Belgisch gsm-nummer hebt. Dit is kort en simpel. Je geeft je gsm-nummer in en ontvangt van ons een sms met een verificatiecode. Op je scherm wordt dan gevraagd om die code in te geven. Heb je dat gedaan, dan is je geverifieerd gsm-nummer aan je VRT-profiel gekoppeld. Zo eenvoudig is het om te genieten van ons hele aanbod in de hele EU. Ter info: Je kan deze verificatie ook via je Burgerprofiel doen. Zie daarvoor puntje 11: Waarom moet ik mijn nationaliteit bevestigen via ‘Mijn Burgerprofiel’ als ik buiten België VRT MAX of Sporza wil bekijken? Let op: Als je je gsm-nummer uit je VRT-profiel verwijdert, dan zal je de sms-verificatie opnieuw moeten doorlopen als je bepaalde programma’s wil bekijken buiten België. Verander je van nummer? Pas het dan zeker aan via het beheersplatform van het VRT-profiel. Samengevat: Wil je binnen de hele EU (+Liechtenstein, Ijsland en Noorwegen) genieten van het hele aanbod van VRT MAX en Sporza? Koppel dan je Belgisch gsm-nummer aan je VRT-profiel. Goed om te weten: Wil je je Belgisch gsm-nummer liever niet koppelen aan je VRT-profiel? Geen probleem! Misschien is de verificatie via het Burgerprofiel iets meer voor jou. Maar onthou dat voor een deel van ons aanbod een verificatie echt nodig is buiten België. Meer info nodig? Op deze pagina’s vind je uitgebreidere informatie: Welk aanbod van VRT MAX kan ik in het buitenland bekijken? Hoe kan je de VRT in het buitenland volgen? Waarom moet ik mijn nationaliteit bevestigen via ‘Mijn Burgerprofiel’ als ik buiten België VRT MAX of Sporza wil bekijken?Je hebt de Belgische nationaliteit en woont in het buitenland Als je als Belg in het buitenland woont, kan je ook genieten van een deel van ons aanbod op VRT MAX en Sporza. Om jou zoveel mogelijk te kunnen laten genieten, hebben we eenmalig een verificatie van je Belgische nationaliteit nodig. Dit kan je eenvoudig doen door je aan te melden op ‘Mijn Burgerprofiel’ via de Vlaamse Overheid. Je hebt een Belgisch adres en kijkt in de EU Als inwoner van België kan je in heel de EU (+Liechtenstein, Ijsland en Noorwegen) met je VRT-profiel het hele aanbod van VRT MAX en Sporza bekijken. Om je woonplaats in België te bevestigen kan je gebruik maken van ‘Mijn Burgerprofiel’ van de Vlaamse Overheid. Wat doen wij met deze gegevens? We nemen geen persoonsgegevens over vanuit je Burgerprofiel. We controleren enkel bij de Vlaamse Overheid of je de Belgische nationaliteit bezit. Deze bevestiging houden we bij in je VRT-profiel. Je kan je burgerprofiel maar aan één VRT-profiel koppelen. Alle vragen omtrent de werking van ‘Mijn Burgerprofiel’ kunnen gevonden worden op de website van de Vlaamse Overheid omtrent ‘Mijn Burgerprofiel’. Als het aanmelden op het Burgerprofiel niet lukt, raad VRT je aan contact op te nemen met de helpdesk van de Vlaamse Overheid. Dat kan via de website van ‘Mijn Burgerprofiel’. Als je andere problemen ondervindt, kan je steeds contact opnemen met de klantendienst van VRT. Andere vragenHeb je toch nog een andere vraag?De VRT-klantendienst staat altijd tot je dienst!VRT-profiel: veelgestelde vragenVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites moet je een VRT-profiel aanmaken. De belangrijkste gebruiksvoorwaarden en vragen kan je hier vinden.Lees meerVRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.WedstrijdreglementDit wedstrijdreglement bepaalt de algemene regels met betrekking tot de deelnemingsvoorwaarden voor alle wedstrijden die VRT organiseert via haar websites, andere onlinekanalen (zoals YouTube, Facebook, Twitter) of op een andere wijze.Mijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. GebruiksvoorwaardenHieronder vind je de algemene gebruiksvoorwaarden voor de VRT-onlinediensten.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
