["https://vrt.be/nl/over-ons/nieuws-over-vrt/spetterende-optredens-op-het-gala-van-de-gouden-ks"]
title = "Spetterende optredens op het Gala van de Gouden K's | VRT"
description = "Zing mee met CAMILLE, Omdat Het Kan &amp; Average Rob, MAKSIM, Aaron Blommaert en #LikeMeOp zaterdag 25 januari ontvangen de Ketnet-wrappers een hele stoet BV’s, de grootste artiesten en duizenden Ketnetters met hun (groot)ouders in een uitverkocht Sportpaleis. Het Gala van de Gouden K’s is aan zijn twaalfde editie toe en ondertussen een gevestigde waarde in showbizzland. Tijdens deze spetterende awardshow komen we te weten wie of wat het afgelopen jaar in media, showbizz of sport het meest populair was bij Vlaamse kinderen."
full_description = "Home/Over ons/Nieuws over VRT/Spetterende optredens op het Gala van de Gouden K'sSpetterende optredens op het Gala van de Gouden K's24 januari 2025Zing mee met CAMILLE, Omdat Het Kan & Average Rob, MAKSIM, Aaron Blommaert en #LikeMeOp zaterdag 25 januari ontvangen de Ketnet-wrappers een hele stoet BV’s, de grootste artiesten en duizenden Ketnetters met hun (groot)ouders in een uitverkocht Sportpaleis. Het Gala van de Gouden K’s is aan zijn twaalfde editie toe en ondertussen een gevestigde waarde in showbizzland. Tijdens deze spetterende awardshow komen we te weten wie of wat het afgelopen jaar in media, showbizz of sport het meest populair was bij Vlaamse kinderen.Bert De Kock vat post op de rode loper om de outfits van talloze BV’s te checken. Hij mag – als voormalig winnaar – de vier genomineerden in de categorie Outfit van de avond bepalen. Volg zijn avonturen bij Ketnet op VRT MAX en bekijk het verslag van een hele week achter de schermen in Gouden K’s Backstage op zondag.Tijdens het Gala worden awards uitgereikt in 10 categorieën. Wie wint, is de keuze van de Ketnetters. Duizenden kinderen brachten in december hun stem uit via VRT MAX.Het Gala van de Gouden K’s 2024 l zaterdag 25 januari l vanaf 18.30 uur live op KETNET en op VRT MAX l Herhaling op zondag 26 januari om 08.30 uur op KETNET en om 14.35 uur op VRT 1.Volg de voorbereidingen op het Gala van de Gouden K’s én de rode loper vanaf 12 uur op KETNET op VRT MAX.Gouden K’s Backstage l zondag 26 januari om 08.20 uur op KETNET en VRT MAX.Het Gala volgen met VGT? Vanaf woensdag 29 januari om 07.30 uur op KETNET bij VRT MAX en op zaterdag 1 februari om 16.10 uur op KETNET.Populair bij bekend VlaanderenDat het Gala met zijn twaalf edities ondertussen dé populairste awardshow is in showbizzland, blijkt uit de lijst met uitreikers van awards. De Gouden K's worden uitgereikt door niemand minder dan Kassaticket en Wim De Vilder, Sali Haidara en Francisco Schuster, Tik & Tok (Dominique Van Malder en Joris Hessels), Guga Baúl, Bert De Kock, Maureen Vanherberghen, Imea en Andres van GameKeepers, Niels Destadsbader en Celine Van Ouytsel, Aster Nzeyimana en de cast van Waiko.Het Gala van de Gouden K’s 2024 belooft weer een wervelende, spectaculaire show te worden met heel wat straffe optredens. Niemand minder dan Aaron Blommaert, CAMILLE, MAKSIM en Omdat Het Kan & Average Rob trakteren de Ketnetters op een spetterend optreden. Ook de cast van #LikeMe zal voor het eerst optreden in een afgeladen vol Sportpaleis. Ketnet pakt zaterdag uit met een straffe verrassingsact met heel wat bekende gezichten.Wie zijn de genomineerden voor Het Gala van de Gouden K's 2024Ontdek hieronder de genomineerden van het Gala van de Gouden K's 2024. Opvallend: Timon Verbeeck maakt maar liefst kans op drie Gouden K's en ook MAKSIM en Hannah Mae kunnen opnieuw een prijs in de wacht slepen voor 'Ik wil dat je liegt'. Dit jaar werd er een nieuwe categorie toegevoegd, die van beste Teamwork.SongEuropapa van Joost KleinOn Met La Patate van Omdat Het Kan & Average RobOeh La La La van CAMILLEIk Wil Dat Je Liegt van MAKSIM & Hannah MaeArtiestCAMILLERoxy DekkerAaron BlommaertPommelien ThijsFamilieprogrammaThe Masked SingerMiloKamp WaesDe Slimste Mens ter WereldKetnet-sterJelle Mels (Karrewiet)Jean-Romy Manzila (Raad v Soekie, Prank Squad)Ayana Doucouré(Hawa & Adam)Imea Denooze (GameKeepers)Ketnet-programmaOtis-SkateDe FakerKapot GaanDe Raad van SoekieTeamworkCéline Dept gaat viral met Kylian MbappeBert De Kock speelt mee in de nieuwe film van K3Timon Verbeeck en Thomas De Smet verbreken een wereldrecord in Hoe moeilijk kan het zijn?Pommelien Thijs en MEAU brengen samen Het Midden uitOnline SterTimon VerbeeckCéline DeptSteffi MercieElias VerwiltOnline KanaalMaxime & SophieKarrewietDutchtuberRutger & ThomasHeldOmdat Het Kan & Average Rob zorgen voor het supporterslied van de sportzomerRemco Evenepoel wint twee gouden Olympische medaillesTimon Verbeeck verovert de wereldGloria en Bart maken dromen waar in de DroomfabriekOutfitOok de mooiste outfit wordt beloond met een Gouden K. De winnaar wordt tijdens het Gala zelf gekozen.Tijdens de opnames werkt VRT met MobileConnect voor luisterondersteuning voor doven en slechthorenden. Mensen met een hoorapparaat of implantaten kunnen zo de presentaties én optredens glashelder streamen via hun gsm naar hun apparaten. Wil je alles te weten komen over de toegankelijkheid van de Gouden K's? Neem een kijkje op onze informatiepagina over de toegankelijkheid van de Gouden K's.Het Gala van de Gouden K's | zaterdag 25 januari | vanaf 18.30 uur live op Ketnet en op VRT MAX Mis niets van het Gala van de Gouden K'sKijk live op 25 januari vanaf 18:30 uur opVRT MAXLees zeker ookNieuws & informatieSarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapperOver VRTDe Ketnet-kroket komt terug!Over VRTHallo kroket!: de terugkeer van live avontuur op KetnetSport & ontspanningOntdek de genomineerden voor het Gala van de Gouden K'sJongerenGlamour en Noncha zijn verkozen tot Kinderwoord en Tienerwoord van het JaarJongerenBen je noncha of sigma? Of kan je goed yappen? What the skibidi!Over VRTHallo Kroket! Ketnet en Ketnet Junior zitten in een nieuw jasjeDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
