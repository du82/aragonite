["https://vrt.be/nl/over-ons/onze-opdracht/missie-en-waarden"]
title = "Missie en waarden | VRT"
description = "VRT is transparant en rapporteert op een open manier over de uitvoering van haar opdracht. De missie en waarden van VRT werden vastgelegd in de Beheersovereenkomst 2021-2025."
full_description = "Home/Over ons/Onze opdracht/Missie en waardenMissie en waardenVRT is transparant en rapporteert op een open manier over de uitvoering van haar opdracht. De missie en waarden van VRT werden vastgelegd in de Beheersovereenkomst 2021-2025. Kernopdrachten: missie en waarden in de praktijk VRT informeert, inspireert en verbindt alle Vlamingen en draagt zo bij aan de versterking van de Vlaamse samenleving. VRT biedt een kwaliteitsvol en onderscheidend aanbod aan op vlak van informatie, cultuur, educatie, ontspanning en sport. VRT streeft naar een zo groot mogelijke professionaliteit en originaliteit, waarbij ook nieuwe talenten en vernieuwende expressievormen aangeboord worden. Het aanbod is vernieuwend en komt voort uit zowel interne als externe creativiteit. VRT volgt de technologische ontwikkelingen op de voet zodat ze haar programma’s ook via nieuwe mediatoepassingen kan aanbieden. VRT speelt een belangrijke rol in het stimuleren van het brede maatschappelijke debat en heeft een plaats in het leven van alle Vlamingen en dit over generaties heen. Kinderen, jongeren, laaggeletterden, personen met een buitenlandse herkomst en mensen met een handicap zijn groepen waar de publieke omroep extra aandacht voor heeft. VRT wil met haar aanbod alle mediagebruikers bereiken en de Vlaamse samenleving in al zijn verscheidenheid aan bod laten komen. De programma’s dragen bij tot de verdere ontwikkeling van de identiteit en de diversiteit van de Vlaamse cultuur en van een democratische en verdraagzame samenleving. Het programma-aanbod richt zich op een aangepaste manier op bepaalde bevolkings- en leeftijdsgroepen, of specifieke belangstellingssferen van kijkers en luisteraars. De beoogde doelgroepen zijn voldoende ruim en ze worden door de programma’s in kwestie ook bereikt. Met het oog op het relevant zijn voor zoveel mogelijk Vlamingen, streeft VRT naar een breed en algemeen publiek. Ze ambieert op die manier een maatschappelijke impact: het versterken van de democratie, het politiek, sociaal en cultureel burgerschap, én de samenleving door bij te dragen aan een maatschappelijk en pluralistisch debat, de samenleving te documenteren en het stimuleren van de cultuur- en taalbeleving en de Vlaamse identiteit en diversiteit. Daarom streeft zij naar een leidinggevende rol op het gebied van cultuur en onafhankelijke informatie. Naast de kernopdrachten heeft VRT vanuit het omroepdecreet en de beheersovereenkomst een aantal thema's waarrond prioritair wordt gewerkt.Onze thema'sCultuurVRT viert de culturele diversiteit van Vlaanderen via al haar platformen en zoomt als bondgenoot van de cultuursector elke dag opnieuw in op boeken, beeldende en podiumkunsten en film. En dat is lang niet alles: ook architectuur, games, erfgoed, opera en andere disciplines komen aan bod. Diversiteit en inclusie bij VRTVRT is er voor iedereen. Voor alle diversiteit die Vlaanderen rijk is. Daarom streeft VRT naar diversiteit in beeld én achter de schermen zodat iedereen zich herkent in wat we maken. VRT streeft naar inclusie op verschillende vlakken. VRT Diversiteit & Inclusie werkt aan bewustmaking en neemt samen met VRT-medewerkers en programmamakers stappen om actief te werken aan meer diversiteit in het aanbod. Dat gebeurt via advies, ondersteuning en inspiratie. EducatieVRT heeft een breed-educatieve rol. Ze draagt bij tot de mediawijsheid van de Vlaamse mediagebruikers.InnovatieHoe wil je media in de toekomst beleven? Een toekomst waarin nieuwe technologieën heel wat uitdagingen, maar ook kansen met zich meebrengen. Of dat nu over één jaar is of over vijf, VRT is er vandaag al mee bezig. En dat doen we niet alleen. VRT bundelt wereldwijd de krachten met andere partners om je de sterkste verhalen op de beste manier te brengen.MuziekAlle merken van VRT hebben een eigen muziekprofiel, met een rijk muzikaal aanbod dat aansluit bij de verwachtingen van de verschillende doelgroepen. De unieke profielen van de merken passen binnen het overkoepelende muziekbeleid van de publieke omroep.Onafhankelijk nieuws en informatieDe VRT-nieuwsdienst stelt het publieke belang voorop, hanteert een duidelijke journalistieke deontologie en is redactioneel onafhankelijk. Inhoudelijke afwegingen staan voorop bij de selectie en presentatie van nieuws en ander journalistieke content.Sport en ontspanningVRT garandeert een universeel toegankelijk sportaanbod, versterkt sociale cohesie door sportverslaggeving en stimuleert sportparticipatie. TaalHet taalbeleid van de omroep staat in het Taalcharter, een leidraad voor alle VRT-medewerkers. Het beschrijft de rol van VRT als uitdrager van verzorgd, helder en efficiënt taalgebruik. Vlaamse dimensieVRT draagt de Vlaamse identiteit in al haar verscheidenheid uit en laat de diversiteit in de samenleving zien. De publieke omroep draagt bij aan de ondersteuning en versterking van de Vlaamse identiteit. Dat gebeurt vooral door het stimuleren van kwaliteitsvolle producties van eigen bodem, zowel in de audiovisuele, de culturele als in de muzieksector. De Vlaamse verankering komt tot uiting op twee vlakken: het aandeel Vlaamse- en Nederlandstalige muziekproducties op de radionetten en het aandeel Vlaamse producties op de televisienetten. Zingeving en solidariteitVRT weerspiegelt de Vlaamse samenleving in al haar diversiteit. Ze biedt met haar aanbod de Vlaming troost en (h)erkenning met programma’s rond zingeving waar -soms confronterende thema’s- zoals rouw en verlies aan bod komen.VRT neemt als dienstverlenende en publieke organisatie een bijzondere positie in binnen de samenleving. VRT is niet zomaar een mediabedrijf. Ze is een organisatie, een NV van publiek recht, die met een mandaat van de overheid en van alle Vlaamse burgers in alle onafhankelijkheid een maatschappelijke missie waarmaakt. Toekomstgericht en met ambitie werkt VRT iedere dag aan media die er écht toe doen. Wist je dat?VRT iedere vijf jaar een afsprakennota maakt met de overheid genaamd de beheersovereenkomst?De beheersovereenkomst legt de afspraken vast waaraan VRT zich gedurende vijf jaar moet houden in ruil voor financiële middelen van de Vlaamse overheid. Lees er hier alles overUw privacy: AVG (GDPR) bij VRT Tot de openbare opdracht van VRT behoren ook alle activiteiten die rechtstreeks of onrechtstreeks bijdragen tot de uitvoering ervan. Dit houdt eveneens de mogelijkheid in om persoonsgegevens te verwerken die noodzakelijk zijn om haar publieke opdracht uit te voeren. VRT wil een betrouwbare partner zijn voor haar gebruikers, medewerkers, partners en leveranciers door persoonsgegevens op een gepaste manier te verzamelen en te verwerken, en dat op een transparante manier aan te tonen. Lees meer over jouw privacy bij VRT. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
