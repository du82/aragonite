iliteitsbudget voor iedereen’: zo wil regering (openbaar) vervoer aanpakkenNieuwe regering gaat voor grootste investering in defensie sinds het einde van de Koude OorlogStrengere straffen, fatsoenlijke gevangenissen en 1 Brusselse politiezone: zo hoopt nieuwe regering ons land veiliger te makenVan ziektebriefjes tot rookverbod op terrassen: 10 opvallende ingrepen van deze regering rond jouw gezondheidNieuw regeerakkoord voorziet strengste migratiebeleid ooit, vooral voor wie vlucht van oorlogNieuwe regering pakt hoogste uittredingsvergoedingen aan maar snoeit niet in partijfinanciering: "Dit is een mager beestje"Regering belooft hoger nettoloon en dan toch meerwaardebelasting van 10 procent: welke impact heeft de belastinghervorming op jouw portefeuille?Lager pensioen voor wie te vroeg stopt en heel wat ingrepen bij ambtenaren: zo hervormt de nieuwe regering de pensioenenMeer opVRT NWSKIES24 op Radio 1 Betrouwbaarheid als fundamentVRT NWS onderscheidt zich op vlak van betrouwbaarheid. Om die betrouwbaarheid te waarborgen, heeft de nieuwsdienst enkele speerpunten geformuleerd:Inhoudelijke expertiseDe nieuwsdienst investeert in het opbouwen van inhoudelijke expertise. Journalisten krijgen de kans om bepaalde domeinen van de actualiteit gedurende een langere periode intensief te volgen. Zo kunnen ze de nodige achtergrondkennis verwerven en een netwerk van contactpersonen opbouwen.ThemaredactiesBehalve het opbouwen van algemene expertise, focust de nieuwsdienst ook op specifieke domeinen zoals politiek, buitenland, justitie… Die domeinen zijn ondergebracht bij themaredacties, die zo expertise verwerven in de materie. De themaredacties voeden de uitzendredacties met kwalitatieve en betrouwbare informatie, wat het transparanter en helderder maakt om experts naar voren te schuiven op cruciale thema’s.Daarnaast werken journalisten ook meer en meer op thema’s die de Vlamingen bezighouden: klimaat, migratie, gezondheid… Door rekening te houden met wat er leeft in de maatschappij, blijft VRT NWS maatschappelijk relevant en belangrijk in het leven van de Vlamingen. De nieuwsdienst heeft daarbij ook oog voor wat er gebeurt in het buitenland: zowel de grote breaking verhalen als de meer verborgen problemen en vergeten conflicten worden belicht. Checken en dubbelcheckenIn het huidige medialandschap is niet altijd even duidelijk wat juist is, en wat niet. Desinformatie steekt meer dan ooit de kop op en is niet meer weg te denken. VRT NWS wil in die complexe context helderheid scheppen en de juiste versie van de feiten geven. Dat vereist het checken en dubbelchecken van informatie. Wat is waar, en wat niet? Welke mechanismen spelen er? Door dergelijke vragen te stellen kan VRT NWS zijn journalistiek werk blijven verbeteren.Lees meer over beroepsethiek bij VRT NWS.NieuwsOnafhankelijk nieuws en informatieDe VRT-nieuwsdienst stelt het publieke belang voorop, hanteert een duidelijke journalistieke deontologie en is redactioneel onafhankelijk. Inhoudelijke afwegingen staan voorop bij de selectie en presentatie van nieuws en ander journalistieke content.Lees meerNieuwe platformen en digitale voetafdruk VRT NWS is een dynamisch merk. De nieuwsdienst zoekt elke dag naar manieren om de inhoud te verbeteren, zodat het voor iedereen bevattelijker wordt. De manier waarop het nieuws wordt gepresenteerd, moet afgestemd zijn op de behoeften van de doelgroep. Zo zal nieuws op maat van jongeren sneller via Instagram worden aangeboden, via @nws.nws.nws.Nws.nws.nwsNws.nws.nws brengt 7/7 nieuws en duiding op maat van tieners. Het kanaal brengt zowel de actualiteit van de dag, als nieuws dat relevant is voor de doelgroep. Daarnaast geven ze ook meer achtergrondinformatie en duiding bij actuele onderwerpen. Geregeld wordt er ook nepnieuws gefactcheckt en zoomen ze in op maatschappelijk relevante thema’s. Nws.nws.nws heeft een actieve nieuwscommunity. De redactie gaat vaak aan de slag met input van de volgers. Nws.nws.nws trekt wekelijks naar scholen in Vlaanderen en Brussel en gaat er met tieners in gesprek over nieuws. Jongeren kunnen al hun vragen over nieuws en actualiteit stellen. Na afloop van het klasgesprek wordt er een nws@school-quiz gespeeld: drie leerlingen moeten zo snel mogelijk tien bekende koppen uit de actualiteit raden. De klas die het beste scoort, mag als beloning voor één dag de redactie van nws.nws.nws overnemen. Klas op bezoek bij nws.nws.nwsCreatieve celVRT NWS heeft een creatieve cel in het leven geroepen waar video en grafiek naar een hoger niveau worden getild. Dit maakt de nieuwsinhoud visueler en toegankelijker voor het publiek. Op de nieuwsvloer is ook een webstudio en een videobox aanwezig. Met deze hulpmiddelen slaagt VRT NWS erin om snel en toegankelijk nieuws te brengen.Digitale voetafdrukDaarnaast levert VRT NWS voortdurend inspanningen om de digitale voetafdruk van de nieuwsdienst te versterken, en het bereik op de site, app en sociale media te vergroten. Zo heeft VRT NWS een ruim aanbod aan dagelijkse en wekelijkse podcasts die duiding geven bij de actualiteit of thema-podcasts die ingaan op opmerkelijke gebeurtenissen uit de recente geschiedenis. VRT NWS podcastsHet uur van de waarheidOnder ons: crimiHet kwartierDe afspraakBjörn in the USAOnder ons: politiekWaar is zuster Gabrielle?China voorbij de muurHet ontbijtVranckx & BylooLuister naarVRT NWSMeer weten? Lees ook deze artikelsNieuws & informatieBjörn Soenens maakt voor VRT theatertour over AmerikaOver VRTJudit Verstraete nieuwe ombudsvrouw VRT NWSNieuws & informatie'Ciao Rudi': VRT zwaait conflictreporter Rudi Vranckx uit met bijzonder portretNieuws & informatie745.000 Vlamingen volgden 'Amerika kiest' via VRT 1, VRT NWS-site & app telden 2,78 miljoen bezoekenNieuws & informatieVolg de verkiezingen op de voet met 'Amerika kiest' op VRTNieuws & informatieWaarom heeft VRT NWS journalisten in het buitenland? Nieuws & informatieHarde cijfers als wapen tegen desinformatie Nieuws & informatieMeer dan 2 miljoen kijkers voor Verkiezingsmarathon KIES24 op VRT 1Verken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'''
