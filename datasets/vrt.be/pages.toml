full_description = "Home/Over ons/Nieuws over VRT/Wereldradiodag: echt merci aan alle VRT-radiotoppers!Wereldradiodag: echt merci aan alle VRT-radiotoppers!13 februari 2025Het is vandaag Wereldradiodag. Deze dag werd in het leven geroepen door UNESCO/Verenigde Naties om het belang van onafhankelijke radio te benadrukken.Voor VRT betekent het de perfecte kans om al onze radiomakers eens een shout-out van jewelste te geven. Want radio is en blijft een van de populairste platformen waarmee we de Vlaming bereiken. Over alle radionetten heen behaalde VRT een marktaandeel van 54,3% in de periode van januari tot augustus van vorig jaar. Daarmee bevestigt VRT haar prominente rol in het radiolandschap.Meer algemeen luistert dagelijks 67% van alle Vlamingen naar de radio. Op weekbasis is dat zo’n 88%. De gemiddelde Vlaming doet dat per dag een kleine 3 uur lang (166 minuten). Radio is goed voor 69% van de dagelijkse audiotijd. (Bron: CIM Audio Time onderzoek 2025)Zo goed als de helft (49%) van het radioluisteren gebeurt vandaag bovendien via digitale weg (DAB+, het internet, digitale tv). Meer over digitale radio lees je hier.RadioLuister naar je favoriete VRT-radiozenders op VRT MAXMusic maestroKlinken deze artikels ook leuk?Cultuur | MuziekKlara stelt jong talent voor in vijfde editie van De Twintigers MuziekRed Sebastian gaat voor België naar het Eurovisiesongfestival in Bazel met 'Strobe lights'MuziekAlice Mae, Kaat Van Stralen en Uwase zijn de winnaars van De Nieuwe Lichting 2025MuziekPommelien Thijs en Sylvie Kreusch grote winnaars van de MIA’s 2024MuziekMIA’s 2024: Daphne Agten, Lotte Kopecky, Philippe Geubels en heel wat andere populaire uitreikers maken de winnaars bekendMuziekMia’s Sessies op VRT CanvasMuziekZo klinkt de Week van de Belgische muziek bij VRTDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees 