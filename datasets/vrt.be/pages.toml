["https://vrt.be/nl/over-ons/nieuws-over-vrt/sarah-mouhamou-neemt-na-elf-jaar-afscheid-als-ketnet-wrapper"]
title = "Sarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapper | VRT"
description = "Salut Sarah! vanaf maandag 3 maart op Ketnet en VRT MAX&nbsp;Sarah Mouhamou was zojuist te gast bij Hallo Kroket! waar ze aankondigde dat ze in maart afscheid neemt als Ketnet-wrapper. In maart 2014 werd Sarah voorgesteld als Ketnet-wrapper. Nu exact elf jaar later neemt ze afscheid met het Ketnet-programma Salut Sarah!. Een absoluut record want geen enkele andere Ketnet-wrapper was langer te zien bij Ketnet dan Sarah.&nbsp;&nbsp;"
full_description = '''Home/Over ons/Nieuws over VRT/Sarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapperSarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapper05 februari 2025Salut Sarah! vanaf maandag 3 maart op Ketnet en VRT MAX Sarah Mouhamou was zojuist te gast bij Hallo Kroket! waar ze aankondigde dat ze in maart afscheid neemt als Ketnet-wrapper. In maart 2014 werd Sarah voorgesteld als Ketnet-wrapper. Nu exact elf jaar later neemt ze afscheid met het Ketnet-programma Salut Sarah!. Een absoluut record want geen enkele andere Ketnet-wrapper was langer te zien bij Ketnet dan Sarah. "De mooiste jaren van mijn leven waren bij Ketnet. Ik voel me bijzonder dankbaar dat ik samen met de Ketnetters ben kunnen opgroeien. Maar liefst elf jaar lang heb ik deel mogen uitmaken van hun leven en zij van dat van mij. Ik neem met een klein hartje afscheid van het mooiste publiek, maar kan ze met een gerust hart in de handen laten van een nieuwe top generatie wrappers. Ik kijk uit naar heel wat mooie nieuwe projecten die op stapel staan." Sarah MouhamouSalut Sarah!Na elf jaar wrappen neemt Ketnet-wrapper Sarah afscheid van Ketnet en vertrekt ze met haar rugzak op een volgend avontuur. Een rugzak vol Ketnet-herinneringen: van haar allereerste wrap tot het Gala van de Gouden K’s. Tijdens een laatste Ketnet-weekend vult ze haar rugzak verder aan. Dat doet ze samen met vijf Ketnetters die geboren zijn in 2014, het jaar dat zij startte als Ketnet-wrapper. Ze leren elkaar beter kennen, doen zotte opdrachten en blikken terug op Sarah’s mooiste Ketnet-momenten.Op vrijdag 7 maart neemt Ketnet afscheid van Sarah in Hallo Kroket!. Sarah zal in de toekomst nog te zien zijn op Ketnet Junior en werkt de komende maanden aan enkele nieuwe televisieprojecten.Salut Sarah! vanaf 3 maart op Ketnet en VRT MAX. Wie is Sarah Mouhamou?Sarah Mouhamou werd in 2014 voorgesteld als Ketnet-wrapper tijdens het Gala van de Gouden K's. Ze was het gezicht van STIP IT in 2020, 2023 en 2024 en samen met Marijn De Valck was ze Stambos-ambassadeur, een initiatief van Ketnet om kinderen en grootouders te verbinden. Sinds 2020 is Sarah ook te zien als gezicht voor Ketnet Junior waar ze als Sarah knutselt, danst, zingt en vele meer voor de allerkleinsten. In 2024 presenteerde ze voor Kom op tegen kanker het programma De Positivo's waar ze kinderen met kanker een stem gaf. Sarah was ook het gezicht van het STIP IT-programma De Pestbril. Naast Ketnet was Sarah nog te zien in Instaverliefd, De Grote Slijmfilm, Een echte job en nam ze deel aan De Slimste Mens. De afgelopen maanden maakte ze ook deel uit van het WinWin-team op VRT 1. Ketnet op VRT MAXCheck alles van Ketnet op VRT MAXLees zeker ookJongerenVRT MAX kondigt derde seizoen Knokke off aan: "Ja, er komt een vervolg!"JongerenHoe VRT jong mediatalent begeleidt: “360°-media vraagt 360°-ondersteuning” JongerenSpanning, intrige en dramatische wendingen: de eerste aflevering van Knokke off 2 is erJongerenEen scheut durf, een snuifje voyeurisme en veel inzetJongerenGlamour en Noncha zijn verkozen tot Kinderwoord en Tienerwoord van het JaarJongerenBen je noncha of sigma? Of kan je goed yappen? What the skibidi!JongerenKlaar voor Terror Nero? VRT lanceert eerste F.C. De Kampioenen-game in RobloxJongerenVerrassing! Dit zijn de nieuwe Ketnet-wrappersDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'''
