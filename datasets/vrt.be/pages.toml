title = "Routebeschrijving | VRT"
description = "Het omroepgebouw in Brussel is gemakkelijk te bereiken met de auto en met het openbaar vervoer."
full_description = '''Home/Contacteer ons/RoutebeschrijvingRoutebeschrijvingHet omroepgebouw in Brussel is gemakkelijk te bereiken met de auto en met het openbaar vervoer.AdresAuguste Reyerslaan 521043 BrusselMet het openbaar vervoer naar VRTMet eigen vervoer naar VRTToegankelijkheid van de VRT-gebouwenMeer informatie over de fysieke toegankelijkheid van de gebouwenMet het openbaar vervoer naar VRTDienstregelingen vind je op www.nmbs.be, www.delijn.be en www.stib-mivb.beMet de bus, tram of metroVanuit het Noord-stationNeem bus R90, 318 of 410 (De Lijn) richting Leuven tot het Meiserplein. Neem tram 25 (MIVB) richting Boondaal/Buyl tot het Meiserplein.Op loopafstand via haltes Lefrancq aan de Rogierlaan of het Liedtsplein met tram 62 (MIVB) tot het Meiserplein.Vanuit het Centraal-stationNeem bus 63 (MIVB) richting Kerkhof van Brussel tot de Plaskylaan (op de hoek van het Meiserplein).Neem bus 29 (MIVB) richting Hof Ten Berg tot de Plaskylaan-Diamantlaan.Neem metrolijn 1 richting Stokkel tot de halte Montgomery. Je kan daar overstappen op tram 7 of 25 en uitstappen op het Meiserplein.Vanuit Brussel Nationale LuchthavenBuslijn MIVB 12 Brussels Airport (Halte Diamant) of buslijn MIVB 12 ('s avonds en in het weekend)Vanuit as Jette, Laken, Schaarbeek, EvereVanaf het station van Jette, het centrum van Laken en Evere kan je tramlijn 62 (MIVB) nemen tot aan halte Meiserplein. Van daaruit kan je te voet verder naar de Reyerslaan. Deze tram heeft ook twee haltes op loopafstand van het noordstation.Met de trein via halte Meiser (NMBS)De NMBS heeft een stopplaats in de directe omgeving van VRT. Via de Leuvensesteenweg of de Rogierlaan kan je te voet naar het Meiserplein en zo verder naar de Reyerslaan.Vanuit de stations Vilvoorde en AalstS4: Trein Vilvoorde - Aalst met halte Meiser ( deze trein stopt o.a. ook in Groot-Bijgaarden, Dilbeek, Liedekerke, Denderleeuw)Vanuit de stations Mechelen/Vilvoorde en HalleS5: Trein Mechelen - Halle/Edingen met halte Meiser ( deze trein stopt o.a ook in Eppegem, Vilvoorde, Beersel, Huizingen). Deze trein is er ook tijdens het weekend.S7: Trein Mechelen - Halle met halte Meiser (deze trein stopt o.a. ook in Vilvoorde, Eppegem, Hofstade, Beersel en Huizingen)Vanuit de stations Leuven, Kortenberg, ZaventemS9: Trein Landen/Leuven - Eigenbrakel met halte Meiser (deze trein stopt o.a. ook in Tienen, Leuven, Herent, Kortenberg, Zaventem).Met de fietsBrussel staat niet echt bekend als fietsstad. Toch doen het Brussels Hoofdstedlijk Gewest en de gemeenten de laatste jaren inspanningen om het fietsen aangenamer te maken. Er zijn nu fietsrijstroken aan de Reyerslaan en de Lambermontlaan.HuurfietsenVillo heeft zowel staanplaatsen aan de Brusselse hoofdstations als aan het Meiserplein. Voor meer info: http://nl.villo.be/Hoe-werkt-het.Met deelstep, deelmoto of deelfietsBrussel heeft verschillende systemen van elektrische deelsteps, fietsen en motors, die je via een app kunt huren. Met eigen vervoer naar VRTHet Brussels Hoofdstedlijk Gewest is een Lage- Emissiezone. Een aantal voertuigen worden niet toegelaten of hebben een beperkte toegang tot het grondgebied. Alle info op lez.brussels.GPS en routeplannerGPS - Karabiniersplein 1030 Schaarbeek -Coördinaten: 50°51'15"N 04°24'04"E.Waze : https://www.waze.com/location?ll=50.85314088%2C4.40274954&navigate=yes&zoom=17 Laadpalen voor elektrische wagensEr zijn er op de bezoekersparking van VRT, 4 laadpunten voor gebruikers van elektrische voertuigen. Je kan er laden met jouw persoonlijke laadpas.Vanuit Brussel CentrumGa naar de Kleine Brussels Ring (Vijfhoek).Volg die tot de Madoutunnel.Net voor de Madoutunnel verlaat je de Kleine Brusselse Ring en ga naar MadoupleinOp het Madouplein volg richting Leuven en rij de Leuvensesteenweg op.Steek het het Meiserplein over en rij verder op de Leuvensesteenweg.Bij de eerste verkeerslichten sla je rechts af (Jules Lebrunstraat).Bij de rotonde sla je rechts af (Henri Evenepoelstraat).100 m verder ligt de ingang van VRT aan je linkerkant.Het parkeerterrein voor bezoekers is rechts van de ingang.Als je jouw wagen geparkeerd hebt, meld je je aan bij de dienst Ontvangst.Vanuit AntwerpenVia de A12Als je via de A12 komt, rij dan aan het einde van de A12 richting Brussel-Centrum.Volg op het verkeersplein Dikke Linde de richting Van Praet (Chinees Paviljoen/Japanse Toren).Je bent nu op de Van Praetlaan en volgt die tot de Van Praetbrug.Rij bij de tweede verkeerslichten links de Van Praetbrug op en door de Van Praettunnel.Rij rechtdoor via de Lambermontlaan en de Wahislaan tot het Meiserplein.Op het Meiserplein sla je links af en rijd verder via de Leuvensesteenweg.Bij de eerste verkeerslichten sla je rechts af (Jules Lebrunstraat).Bij de rotonde sla je rechts af (Henri Evenepoelstraat).100 m verder ligt de ingang van VRT aan je linkerkant.Het parkeerterrein voor bezoekers is rechts van de ingang.Als je jouw wagen geparkeerd hebt, meldt u zich aan bij de dienst Ontvangst.Via de E19Neem de E19 tot de splitsing Luik/Leuven – Gent/Charleroi (ter hoogte van Machelen).Neem de ring (R0) richting E40 Luik/Leuven (links aanhouden).Op de Ring neem je de afslag 4 Brussel-Luik/Leuven (ter hoogte van Sint-Stevens-Woluwe).Hou uiterst rechts en volg de richting Brussel. Je rijdt de E40 op.Aan het einde van de E40 neem je uiterst rechts de Reyerstunnel richting Meiser.Als je uit de tunnel komt, ga je onmiddellijk naar het rechtse vak. Je ziet het VRT-gebouw nu aan jouw rechterkant.Rij voorbij de toren en sla dan rechts af (het Karabiniersplein).De VRT-ingang ligt 50 m verder aan je rechterkant.Het parkeerterrein voor bezoekers is rechts van de ingang.Als je jouw wagen geparkeerd hebt, meld je je aan bij de dienst Ontvangst.Vanuit GentVia de E40Volg de E40 tot het klaverblad Groot-Bijgaarden.Neem dan de Ring (R0) richting Antwerpen E19/Luik E40.Neem op de Ring afslag 7a Expo/A12 en rij de A12 op.Volg op het verkeersplein Dikke Linde de richting Van Praet (Chinees Paviljoen/Japanse Toren).Je bent nu op de Van Praetlaan en volgt die tot de Van Praetbrug.Rij bij de tweede verkeerslichten links de Van Praetbrug op en door de Van Praettunnel.Rij rechtdoor via de Lambermontlaan en de Wahislaan tot het Meiserplein.Op het Meiserplein sla je links af en rijd verder via de Leuvensesteenweg.Bij de eerste verkeerslichten sla je rechts af (Jules Lebrunstraat).Bij de rotonde sla je rechts af (Henri Evenepoelstraat).100 m verder ligt de ingang van VRT aan je linkerkant.Het parkeerterrein voor bezoekers is rechts van de ingang.Als je jouw wagen geparkeerd hebt, meld je je aan bij de dienst Ontvangst.Vanuit Leuven of LuikVia de E40Neem de E40 richting Brussel.Bij de afslag naar de Ring ga je echtdoor, richting Brussel (je rijdt de Ring niet op).Aan het einde van de E40 neem je uiterst rechts de Reyerstunnel richting Meiser.Als je uit de tunnel komt, ga je onmiddellijk naar het rechtse vak. Je ziet het VRT-gebouw nu aan jerechterkant.Rij voorbij de toren en sla dan rechts af (het Karabiniersplein).De VRT-ingang ligt 50 m verder aan je rechterkant.Het parkeerterrein voor bezoekers is rechts van de ingang.Als je jouw wagen geparkeerd hebt, meld je je aan bij de dienst Ontvangst.Heb je een vraagHeb je een vraag, klacht of suggestie? De kans is groot dat je hier je antwoord vindt. Maar je kan ook altijd ons contactformulier gebruiken en onze medewerkers van de klantendienst staan je graag te woord, elke werkdag tussen 9u en 12u op het nummer 02 741 31 11.Fysieke toegankelijkheid VRT-gebouwHeb je een handicap en wil je graag VRT bezoeken, een opname bijwonen of deelnemen aan één van onze events? Kijk dan op deze pagina wat je kan doen om je bezoek voor te bereiden.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'''
