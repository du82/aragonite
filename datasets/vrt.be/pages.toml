["https://vrt.be/nl/info/privacybeleid"]
title = "VRT-privacybeleid | VRT"
description = "Hallo! Wij vinden het belangrijk dat jij overal en altijd onze diensten kan gebruiken om de beste VRT-content te bekijken, beluisteren, lezen of beleven. Daarnaast verlenen we je graag gepersonaliseerde en interactieve diensten op maat. Om dat te kunnen doen, willen we bepaalde gegevens van jou verzamelen en gebruiken. We leggen je hier uit welke gegevens we precies nodig hebben en wat wij ermee doen."
full_description = "Home/VRT-privacybeleidVRT-privacybeleidInhoudstafelHallo! Wij vinden het belangrijk dat jij overal en altijd onze diensten kan gebruiken om de beste VRT-content te bekijken, beluisteren, lezen of beleven. Daarnaast verlenen we je graag gepersonaliseerde en interactieve diensten op maat. Om dat te kunnen doen, willen we bepaalde gegevens van jou verzamelen en gebruiken. We leggen je hier uit welke gegevens we precies nodig hebben en wat wij ermee doen.Wie is verantwoordelijk voor het verzamelen en gebruiken van mijn gegevens?Wij zijn de Vlaamse Radio- en Televisieomroeporganisatie (of kortweg VRT). Wij zijn een nv van publiek recht, met maatschappelijke zetel te Auguste Reyerslaan 52, 1043 Brussel, ingeschreven in de KBO met nummer 0244.142.664. Deze privacyverklaring geldt voor de persoonsgegevens die wij van jou verzamelen en gebruiken wanneer je onze diensten gebruikt. De verzameling en verwerking van je gegevens zijn onze verantwoordelijkheden. Waarop is deze privacyverklaring van toepassing?Als publieke omroep hebben wij de opdracht je elke dag opnieuw te laten genieten van het best mogelijke aanbod. Wij komen dus dagelijks met jou en andere mediagebruikers in contact. Wij ontmoeten elkaar bijvoorbeeld wanneer je een van onze digitale diensten gebruikt. Dat zijn niet alleen onze websites, maar ook onze (mobiele) applicaties en internetdiensten die toegang geven tot het VRT-aanbod.Je kan niet alleen ons aanbod bekijken, beluisteren of lezen, maar zelf ook onder meer reacties en foto’s delen. Bovendien kan je deelnemen aan wedstrijden of acties. In die gevallen kunnen wij gegevens van jou verzamelen en gebruiken. Dat doen we natuurlijk niet zomaar, maar met een specifiek doel voor ogen. Uiteindelijk willen we onze opdracht als publieke omroep nog beter realiseren.Onder deze privacyverklaring vallen de mediadiensten van de volgende VRT-merken:VRT VRT 1VRT CanvasVRT NWSKetnetKlaraMNMRadio 1Radio2SporzaStudio BrusselDe TijdlozeVRT MAXRadio BeneWaarop is deze privacyverklaring niet van toepassing?Deze privacyverklaring is niet van toepassing wanneer we jouw gegevens gebruiken voor je deelname aan één van onze radio-, televisie- of online programma’s (bijvoorbeeld als je aan een quizprogramma deelneemt). Deze privacyverklaring kan je hier raadplegen.Deze privacyverklaring geldt ook niet wanneer we jouw gegevens voor journalistieke of artistieke doeleinden verwerken. Bijvoorbeeld: als een VRT-journalist op straat een interview van je afneemt, verwerken we je gegevens (zoals je naam) niet op basis van deze privacyverklaring. Meer informatie vind je elders op deze pagina.Waarom verzamelt VRT mijn gegevens en op welke basis?Wij verwerken je gegevens voor de volgende doeleinden:Het leveren van onze (gepersonaliseerde) diensten Wij hebben je gegevens nodig om onze diensten te verlenen zoals voorgeschreven in de beheersovereenkomst met de Vlaamse Overheid. Als je bijvoorbeeld een programma (voor volwassenen) op VRT MAX wil bekijken, moeten wij je leeftijd kennen. Moest je tijdelijk in het buitenland verblijven, dan vraagt de Europese Unie ook om aan te duiden dat je inwoner van België bent om VRT MAX in (andere) Europese landen te gebruiken.Om je hierbij te ondersteunen biedt VRT je een portaal aan waar je je gegevens kan raadplegen en beheren: het VRT-profiel. Met dit profiel kan je je aanmelden bij de VRT-websites en -apps. Door deze centrale registratie hoef je maar eenmaal aan te melden (als je verschillende websites en apps van VRT gebruikt).Hoe levert VRT deze (gepersonaliseerde) diensten en waarom?Een belangrijk onderdeel van onze dienstverlening is om jou een gepersonaliseerde media-ervaring op maat te bieden. Het is als publieke omroep onze taak om jou te activeren, en zo goed en breed mogelijk te inspireren en te informeren. Dit hoort bij onze publieke opdracht en is vastgelegd in de beheersovereenkomst die we met de Vlaamse Overheid hebben afgesloten.De VRT is namelijk niet zomaar een mediabedrijf. Ze is een organisatie, een NV van publiek recht, die met een mandaat van de overheid en van alle Vlaamse burgers in alle onafhankelijkheid een maatschappelijke missie waarmaakt. ONZE PUBLIEKE OPDRACHTDe VRT moet als dienstverlenende en publieke organisatie een bijzondere positie innemen in de samenleving.De VRT biedt een kwaliteitsvol en onderscheidend aanbod aan op vlak van informatie, cultuur, educatie, ontspanning en sport. Dit komt voort uit zowel interne als externe creativiteit en is vernieuwend. De VRT durft creatieve grenzen verleggen. Ze wil met haar aanbod alle mediagebruikers bereiken en de Vlaamse samenleving in al zijn verscheidenheid aan bod laten komen.De VRT speelt een belangrijke rol in het stimuleren van het brede maatschappelijke debat en heeft een plaats in het leven van alle Vlamingen en dit over generaties heen. Kinderen, jongeren, laaggeletterden, personen met een buitenlandse herkomst en mensen met een handicap zijn groepen waar de publieke omroep extra aandacht voor heeft.Met het oog op het relevant zijn voor zoveel mogelijk Vlamingen, streeft de VRT naar een breed bereik. Ze ambieert op die manier een maatschappelijke impact: het versterken van de democratie, het politiek, sociaal en cultureel burgerschap, én de samenleving door bij te dragen aan een maatschappelijk en pluralistisch debat, de samenleving te documenteren en het stimuleren van de cultuur- en taalbeleving en de Vlaamse identiteit en diversiteit.Iedereen bereiken is evenwel geen louter mechanisch proces. Het betekent dat zoveel mogelijk mensen zich moeten kunnen herkennen in en aangesproken voelen door het aanbod van de VRT, dat groepen en generaties in de samenleving verbonden worden, en dat de VRT werkt aan de inhoudelijke en technische toegankelijkheid van haar aanbod. Er is bijzondere aandacht voor het inclusief bereiken van groepen zoals kinderen, jongeren, laaggeletterden en personen met een buitenlandse herkomst. Alleen op deze manier zal de VRT de vooropgesteld maatschappelijke impact kunnen realiseren.De VRT wil haar publieke opdracht zo goed mogelijk waarmaken bij zoveel mogelijk mensen en doet dit dagelijks via een juiste aanbodmix en met een dynamische, doch gefocuste merkenportfolio. Dit is mogelijk door middel van de juiste inzichten in het gebruik van onze diensten. Wij willen je dan ook overal en op elk moment de meest relevante maar ook de leukste programma’s, liedjes, acties en andere VRT-content aanbieden. Door gegevens te gebruiken waaruit je vermoedelijke interesses blijken, kunnen we je ook meer gepersonaliseerde diensten verlenen. Als wij jou kennen, doen wij trouwens het zoekwerk om je te presenteren wat je tof vindt. Ben je een nieuwsjunkie? Of ben je eerder een seriefanaat? Kijk je toch liever naar documentaires? Om jou de beste videovoorstellen te doen, kan VRT MAX bijvoorbeeld je favorieten bewaren. Door aan te melden op onze apps en websites met je VRT-profiel, wordt je media-ervaring verder geoptimaliseerd en gepersonaliseerd. Zo zal je bijvoorbeeld relevant en regionaal nieuws ontvangen aan de hand van je woonplaats, bovenop het algemeen nieuws dat iedereen ontvangt. Een VRT-profiel zal ook onthouden waar je gestopt bent met kijken of luisteren naar onze content. Zo hoef je niet opnieuw te zoeken waar je geëindigd was als je later verder wil kijken naar een programma.Volwassenen kunnen minderjarigen onder de 13 jaar ook toegang geven tot VRT MAX via een kinderprofiel (het zogenaamde Kids profiel). Daarmee krijgen ze content aangeboden die aangepast is aan hun leeftijdsgroep, en kunnen ook zij gebruik maken van de diensten van VRT MAX zoals makkelijk verder kijken en luisteren.Het sturen van de VRT UpdateHeb je een VRT-profiel, dan ontvang je ook automatisch onze VRT Update. In deze e-mail staan interessante en relevante kijk-, luister- en leestips uit het ruime en gevarieerde aanbod van de hele VRT.Zo heb je steeds inspiratie om iets (nieuws) te ontdekken: volgens jouw persoonlijke smaak en aangevuld met verrassende ideeën. En je bent meteen op de hoogte van onze nieuwste acties en updates over onze producten en het VRT-profiel.Deze VRT Update hoort bij onze publieke opdracht: jou activeren, en zo goed en breed mogelijk, inspireren en informeren.Heb je genoeg van onze nieuwtjes? Dan kan je je makkelijk uitschrijven voor onze VRT Update en onze nieuwsbrieven via uitschrijflink onderaan elke e-mail.Wat is smaakverbreding en waarom past VRT dit toe? Smaakverbreding is een specifiek onderdeel van onze opdracht als publieke omroep die hierboven uitvoerig werd beschreven. Tegenwoordig wordt iedereen overspoeld met informatie. De betrouwbaarheid van deze informatie is soms moeilijk in te schatten. Foutief, partieel en ook polariserend nieuws wordt steeds sneller gemaakt en verspreid. Dit wordt versterkt door algoritmes op sociale media die gebruikers vooral meningen uit hun eigen groep voorschotelen. Hierdoor bestaat het risico dat mensen vast komen te zitten in een bubbel van dezelfde meningen. Als onafhankelijke publieke omroep is het onze taak om diverse tegengestelde meningen aan bod te laten komen. Dit gaat echter verder dan enkel onze informatieopdracht. Naast gelijkaardige programma’s waar je eerder al naar keek of luisterde zullen we je ook programma’s voorstellen waardoor je in conatct komt met domeinen (zoals cultuur, informatie of human interest) die je misschien onverwacht toch zullen prikkelen. Kortom: in plaats van filterbubbels te creëren gebruikt VRT publieke omroepalgoritmes om aan smaakverbreding te doen en zodoende haar bijzondere positie in de samenleving kan waarmaken.Welke VRT diensten maken gebruik van het smaakverbreding en hoe werkt het?De smaakverbreding gebeurt enerzijds door manuele curatie: het manueel in de kijker plaatsen van aanbod en (omroepbrede) initiatieven. Anderzijds maakt VRT gebruik van algoritmes om je media-ervaring te optimaliseren.Vanuit onze publieke opdracht passen we het principe van smaakverbreding overal waar mogelijk toe (vb. VRT Update, VRT NWS, …). . Het zogenaamde ‘openbaar omroepalgoritme’ wordt echter enkel gebruikt binnen de context van VRT MAX. Op basis van je profiel, kijkgeschiedenis, favorieten, … krijg je een bepaalde score toegekend. Het algoritme baseert zich louter op het kijkgedrag, niet op persoonlijke kenmerken zoals leeftijd of geslacht.Het model zoekt mediaconsumenten wiens gedrag op elkaar lijkt om zo te voorspellen welke inhoud waarschijnlijk leuk gevonden zal worden. Wanneer je inlogt op VRT MAX krijg je dan programma voorstellen op maat gepresenteerd onder de titel “Voor jou geselecteerd”. De smaakverbreding zal er dus vooral voor zorgen dat je, bovenop de generieke suggesties, een extra invalshoek op onze content zal krijgen.Voor wie meer wil weten:WAAROM DOET VRT AAN SMAAKVERBREDING EN WAT HOUDT HET IN?VRT bevindt zich in een unieke positie: als publieke omroep kan de VRT haar digitale aanbod op een geheel eigen manier interpreteren. Digitaal kan immers heel beperkend ervaren worden, maar niet bij de VRT. Bijvoorbeeld, als je ergens eenmaal naar het wielrennen keek, dan krijg je de dagen daarop vooral wielersuggesties. Dat is niet hoe een wij als publieke omroep met ons aanbod willen omgaan. We hebben daar een mooi woord voor: smaakverbreding. Wie bij ons wielrennen kijkt, zal daarna een voetbalsuggestie krijgen. Vrouwenvoetbal bijvoorbeeld, gevolgd door nog een andere sport en – waarom niet – ook wel een stukje cultuur en politiek. Digitaal staat bij ons dus niet voor vervlakking maar net voor meer keuze. De hersenpan van de Vlaming openzetten, dat blijft ons doel.Vanaf 2022 focuste VRT op het ontwikkelen van een gepaste methodiek om smaak en bijgevolg smaakverbreding te meten. De resulterende metriek ‘smaak’ geeft binnen de context van VRT MAX in een getal weer hoe uniform het consumptiegedrag van een mediaconsument is verdeeld over een vaste groep categorieën: de smaakscore. We delen op basis van de smaakscore en tevens de activiteitsgraad van mediagebruikers onze gebruikers op in 4 gebruiksprofielen. De smaakscore van een gebruiker is 0 wanneer deze enkel aanbod uit één aanbodscategorie consumeert en 100 wanneer diens consumptiegedrag perfect gespreid is over de selectie van alle aanbodscategorieën (wat niet voorkomt).VRT tracht de smaakscore van VRT MAX-gebruikers te verhogen aan de hand van redactionele curatie en geautomatiseerde personalisatie. Voor dat laatste werken we dus algoritmisch. We werken met in-huis ontwikkelde algoritmes om het rijke aanbod op VRT MAX aan haar gebruikers aan te bieden. Smaakverbreding wordt daarbij al tijdens het creatieproces van een algoritme ingebouwd om zo het consumptiegedrag van elke gebruiker beter te verdelen over de verschillende aanbodscategorieën. Eenmaal een algoritme in gebruik wordt genomen, evalueert VRT of het wel degelijk leidt tot een breder consumptiegedrag bij de gebruikers.Vanuit het oogpunt van de gebruiker hebben de smaakverbredende algoritmes die verbonden zijn aan het volledige VRT MAX-aanbod wel degelijk impact. Zo verdubbelde de smaakscore in enkele maanden bij de groep gebruikers die bij de lancering van VRT MAX in september 2022 een lage smaakscore hadden. Voor de periode september-december 2022 (de eerste meetmaanden) was de gemiddelde smaakscore 28,77. De gemiddelde smaakscore was eind 2022, 28,5%. Eind april 2023 steeg de gemiddelde smaakscore naar 34,7%; dat had ook veel te maken met de reeks Het Verhaal van Vlaanderenen gerelateerd aanbod. Eind 2023 was de smaakscore gemiddeld 28,6%. Het is dus belangrijk op te merken dat de smaakscore niet het hele jaar door stabiel is. We leren veel uit de testen die we doen en stellen onze aanpak in functie daarvan bij.Voor VRT NWS werd er in 2023 een smaakdefinitie ontwikkeld zodat de smaakscore voor VRT NWS op een gelijkaardige manier bepaald kan worden.Op termijn wil VRT ook een smaakscore ontwikkelen voor VRT MAX en VRT NWS samen.Deelnemen aan wedstrijden en actiesWanneer je aan een wedstrijd of actie wil deelnemen, hebben we natuurlijk bepaalde gegevens van je nodig. We vragen bijvoorbeeld naar je naam, achternaam en adres om te controleren of de wedstrijd eerlijk verloopt. Bovendien moeten we je kunnen contacteren wanneer je een prijs hebt gewonnen. Om dat te doen, sluiten we een overeenkomst met jou rond je deelname aan de betreffende wedstrijd of actie.Onze nieuwigheden ontdekkenWil je als eerste op de hoogte zijn van onze nieuwe programma’s, acties en wedstrijden? Dan kan je je bijvoorbeeld aanmelden voor nieuwsbrieven van al onze merken. Wij gebruiken je gegevens om de inhoud van die nieuwsbrieven aan jouw interesses en profiel aan te passen. Als je een programma via VRT MAX bekijkt, aan een wedstrijd deelneemt of je inschrijft voor een nieuwsbrief, kunnen wij onthouden wat jij leuk vindt. Wij zullen voor deze nieuwsbrieven wel altijd jouw toestemming vragen. Als je je registreert voor het VRT Profiel word je automatisch op de hoogte gehouden via de VRT Update mail. Het doel van VRT Update mail is jou activeren,"
