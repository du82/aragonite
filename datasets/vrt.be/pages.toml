["https://vrt.be/nl/info/vrt-profiel/vragen-over-beheren-vrt-profiel"]
title = "Vragen over het beheren van een VRT-profiel | VRT"
description = "Voor het gebruik van VRT MAX en een aantal toepassingen op onze websites moet je een VRT-profiel aanmaken. De belangrijkste vragen kan je hier vinden."
full_description = "Home/VRT-profiel/Vragen over het beheren van een VRT-profielVragen over het beheren van een VRT-profielVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites moet je een VRT-profiel aanmaken. De belangrijkste vragen kan je hier vinden. Waar kan ik mijn VRT-profiel beheren?Je profiel beheren is heel eenvoudig: al je persoonsgegevens, toestemmingen en voorkeuren worden op één centrale plaats bewaard. Als je op de aanmeldknop klikt, dan klapt een menu uit: in dat menu klik je op de link “Mijn VRT-profiel”. Je komt dan op het beheersplatform van het VRT-profiel. Je kan ook rechtstreeks naar het volgende adres gaan: https://profiel.vrt.be. Op het beheersplatform heb je volgende mogelijkheden: Mijn gegevens: Je persoons- en contactgegevens bekijken, aanpassen of aanvullen. Of je profiel verwijderen. Beveiliging en koppelingen:Je wachtwoord wijzigen (je krijgt hiervoor een mail), je kidsprofielen beveiligen via een pincode, een overzicht van je gekoppelde social accounts en toestellen waarmee je aangemeld bent. Kidsprofielen Een overzicht van je kidsprofielen Mijn toestemmingen: Je toestemmingen (voorkeuren) beheren (voorbeeld: een VRT-redactie mag mij opbellen) Mijn nieuwsbrieven: Je abonnementen op nieuwsbrieven van VRT-merken bekijken of aanpassen. Toegankelijkheid: Audiodescriptie aan of af zetten voor jezelf en je kidsprofielen. Hoe kan ik mijn e-mailadres aanpassen?Door te navigeren naar de profiel pagina (via https://profiel.vrt.be), kan je via de optie ‘Mijn gegevens’ de e-mailadres wijzigen flow uitvoeren. Via een nieuw schermpje kan je je nieuwe e-mailadres invullen. Bij het bevestigen van dit e-mailadres wordt er nog een kleine controle gedaan over de correctheid van het e-mailadres en wordt er gekeken of dit nieuwe e-mailadres nog niet bestaat in onze gegevensdatabank. Er wordt nadien een mailtje gestuurd naar het oude e-mailadres om te melden dat we de aanvraag tot wijziging goed hebben ontvangen, en we sturen ook een mailtje met een code naar het nieuwe e-mailadres met de vraag om via deze code jouw nieuwe e-mailadres te verifiëren. Na een correcte verificatie kan je met dit nieuwe e-mailadres aanmelden. Kan ik alle (persoons)gegevens die ik eerder doorgaf, weer verwijderen?Nee, je kan niet alle gegevens die je doorgaf, weer verwijderen: ze zijn namelijk nodig voor een goede werking van het VRT-profiel. Volgende persoons- en contactgegevens kan je verwijderen: Je straatnaam en huisnummer Je gsm-nummer* * Opgelet: De verificatie van je Belgisch mobiel telefoonnummer vervalt, alsook de toestemming die je eventueel gaf aan een VRT-redactie om je te mogen opbellen. Wil je al je gegevens wissen dan is het beter om je VRT-profiel te verwijderen. Waar kan ik mijn persoonsgegevens raadplegen/beheren?Je profiel beheren is heel eenvoudig: al je profielgegevens worden op één centrale plaats bewaard.Als je aangemeld bent en op de aanmeldknop klikt, dan klapt er een menu uit: in dat menu klik je op de link “Mijn VRT-profiel”. Je komt dan op het beheersplatform van het VRT-profiel. Je kan ook rechtstreeks naar het volgende adres gaan: https://profiel.vrt.be. Kies daar de optie: “Mijn gegevens”. Waar kan ik de toestemmingen die ik gaf, raadplegen/beheren?Je profiel beheren is heel eenvoudig: al je profielgegevens worden op één centrale plaats bewaard.Als je aangemeld bent en op de aanmeldknop klikt dan klapt er een menu uit: in dat menu klik je op de link “Mijn VRT-profiel”. Je komt dan op het beheersplatform van het VRT-profiel. Je kan ook rechtstreeks naar het volgende adres gaan: https://profiel.vrt.be. Kies daar de optie: “Mijn toestemmingen”. Waar kan ik de nieuwsbrieven waarvoor ik ingeschreven ben, raadplegen/beheren?Je profiel beheren is heel eenvoudig: al je profielgegevens worden op één centrale plaats bewaard. Als je aangemeld bent en op de aanmeldknop klikt dan klapt er een menu uit: in dat menu klik je op de link “Mijn nieuwsbrieven”. Je komt dan op het beheersplatform van het VRT-profiel. Je kan ook rechtstreeks naar het volgende adres gaan: https://profiel.vrt.be. Kies daar de optie: “Nieuwsbrieven”. Hoe kan ik mijn wachtwoord wijzigen?Je wachtwoord wijzigen is heel eenvoudig: al je profielgegevens worden op één centrale plaats bewaard. Als op het aanmeldicoon klikt, dan klapt er een menu uit: in dat menu klik je op de knop “Aanmelden”. Je komt dan op het aanmeldscherm terecht. Klik op de link “Wachtwoord vergeten?”. Vul vervolgens je e-mailadres in: je ontvangt dan een e-mail van ons waarin verdere instructies staan. Kan ik mij in één keer uitschrijven voor alle nieuwsbrieven waarop ik geabonneerd ben?Nee, dat kan helaas niet. Wil je je abonnement op één of meer nieuwsbrieven stopzetten, dan kan je dat wel heel makkelijk binnen hetzelfde scherm doen. Als je aangemeld bent en op de aanmeldknop klikt dan klapt er een menu uit: in dat menu klik je op de link “Nieuwsbrieven”. Je komt dan op het beheersplatform van het VRT-profiel. Je kan ook rechtstreeks naar het volgende adres gaan: https://profiel.vrt.be. Kies daar de optie: “Mijn nieuwsbrieven”. Je kan de nieuwsbrieven filteren. Wil je uitschrijven voor alle nieuwsbrieven, kies dan voor ‘Alle merken’. Als je vervolgens ook aanvinkt dat je de geaccepteerde nieuwsbrieven eerst wil zien (‘Toon geaccepteerde eerst’), dan komen alle nieuwsbrieven waarvoor je ingeschreven bent bovenaan de pagina te staan. Je kan natuurlijk ook nog steeds voor elke nieuwsbrief individueel uitschrijven via de uitschrijflink onderaan de nieuwsbrief zelf. Ik ben mijn wachtwoord vergeten, wat nu?Dat is geen ramp… je kan snel een nieuw wachtwoord instellen voor je VRT-profiel. Je huidig (vergeten) wachtwoord weer opvragen is niet mogelijk, je moet een nieuw wachtwoord kiezen. Als op het aanmeldicoon klikt dan klapt er een menu uit: in dat menu klik je op de knop “Aanmelden”. Je komt dan op het aanmeldscherm terecht. Klik op de link “Wachtwoord vergeten?”. Vul vervolgens je e-mailadres in: je ontvangt dan een e-mail van ons waarin verdere instructies staan. Hoe kan ik mijn VRT-profiel verwijderen?We hopen dat je dit niet zal doen, maar als je toch besloten hebt om je profiel te verwijderen, of per abuis een dubbel profiel hebt aangemaakt en je wil één van beide verwijderen, dan kan dat op deze manier: Als je aangemeld bent en op de aanmeldknop klikt dan klapt er een menu uit: in dat menu klik je op de link “Mijn VRT-profiel”. Je komt dan op het beheersplatform van het VRT-profiel. Je kan ook rechtstreeks naar het volgende adres gaan: https://profiel.vrt.be. Kies daar de optie: “Mijn gegevens”. Op het volgende scherm zie je onderaan de optie “Profiel verwijderen”. Goed om te weten: Binnen het uur nadat je je profiel verwijderd hebt, kan je niet meer aanmelden bij de VRT-websites en -apps. De wettelijke termijn voor het verwijderen van al je profielgegevens is 30 dagen. Na afloop van deze termijn ontvang je van ons een bericht waarin we bevestigen dat al je profielgegevens definitief verwijderd werden. Wat als je je bedenkt? Krijg je spijt na het verwijderen van je profiel: we kunnen een verwijderd profiel helaas niet heractiveren. Je zal dan weer de volledige registratieprocedure moeten doorlopen. Maak je binnen de wettelijke termijn van 30 dagen een nieuw profiel aan, gebruik dan bij voorkeur een ander e-mailadres. Als je toch hetzelfde e-mailadres of hetzelfde socialemedia-account wil gebruiken, contacteer dan onze klantendienst. Zij zullen dan de nodige stappen ondernemen om je verwijderde profiel versneld volledig weg te halen uit onze databank. Waar kan ik terecht als ik problemen heb met het beheren van mijn VRT-profiel?Heb je alle antwoorden gelezen op deze pagina en ondervind je nog steeds problemen met het beheer van je VRT-profiel? Meld je probleem dan aan de VRT-klantendienst. Beschrijf zo duidelijk mogelijk wat er aan de hand is, dan kunnen we je snel en efficiënt verder helpen. VRT-profiel: veelgestelde vragenVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites moet je een VRT-profiel aanmaken. De belangrijkste gebruiksvoorwaarden en vragen kan je hier vinden.Lees meerAndere vragenHeb je toch nog een andere vraag?De VRT-klantendienst staat altijd tot je dienst!VRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.WedstrijdreglementDit wedstrijdreglement bepaalt de algemene regels met betrekking tot de deelnemingsvoorwaarden voor alle wedstrijden die VRT organiseert via haar websites, andere onlinekanalen (zoals YouTube, Facebook, Twitter) of op een andere wijze.Mijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. GebruiksvoorwaardenHieronder vind je de algemene gebruiksvoorwaarden voor de VRT-onlinediensten.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
