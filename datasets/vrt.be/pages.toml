["https://vrt.be/nl/ons-aanbod/toegankelijkheid/fysieke-toegankelijkheid-vrt-gebouw"]
title = "Fysieke toegankelijkheid VRT-gebouw | VRT"
description = "Heb je een handicap en wil je graag VRT bezoeken, een opname bijwonen of deelnemen aan één van onze events? Kijk dan op deze pagina wat je kan doen om je bezoek voor te bereiden."
full_description = "Home/Ons aanbod/Toegankelijkheid/Fysieke toegankelijkheid VRT-gebouwFysieke toegankelijkheid VRT-gebouwHeb je een handicap en wil je graag VRT bezoeken, een opname bijwonen of deelnemen aan één van onze events? Kijk dan op deze pagina wat je kan doen om je bezoek voor te bereiden.VRT Bezoeken met een handicapVRT is er voor iedereen. Ook in het VRT-gebouw willen we dat alle bezoekers zich welkom voelen. Het VRT-gebouw aan de Reyerslaan in Schaarbeek werd in de jaren '60 en '70 van vorige eeuw gebouwd. Toegankelijkheid was toen geen kernzaak. Binnen de architecturale mogelijkheden werden enkele ingrepen gedaan om de toegankelijkheid enigszins te verbeteren. Om je bezoek aan VRT voor te bereiden hebben we enkele suggesties.Bezoek VRTZin om op een fijne manier het leven achter de schermen van ons mediabedrijf te zien? Onze gidsen tonen jou de magie achter ons radio-, tv- en online-aanbod. Check snel hieronder voor alle info!Lees meerVraag naar ondersteuningKom je naar VRT en heb je bepaalde ondersteuning nodig? Meld dit aan degene die je heeft uitgenodigd en informeer hen over je noden. Dat kan gaan over: rolstoeltoegankelijkheid, breedte van deuren, paden, hoogte van tafels,.. De medewerkers zullen in de mate van het mogelijke ondersteuning bieden. Parkeren en taxivervoerBen je in het bezit van een blauwe kaart (bewijs van beperking) en heb je recht op een voorbehouden parking? Er zijn meerdere parkeerplaatsen voor personen met een handicap vlakbij de VRT-ingang. De parkeerkaart voor personen met een handicap is daar verplicht. Laat zeker aan je contactpersoon weten dat je een parkeerplaats nodig hebt. Zij brengen security op de hoogte. Kom je met de taxi? Geef de taxichauffeur de juiste plaats aan om uit te stappen: Voorbij de bareel op de 5-minuten-parking vlak voor de hoofdingang van het omroepcenter. Hier kan je via de helling makkelijk binnen. SanitairEr zijn in het hele gebouw enkele toegankelijke toiletten. Dat zijn toiletten die uitgerust zijn met een deur die breed genoeg is, genoeg draairuimte, een lagere lavabo, een handgreep, enzovoort. Deze toiletten zijn aangeduid met een pictogram. Op het grondplan kan je zien waar de toiletten zijn en welke liften je kan nemen als je een iets bredere (elektrische) rolstoel hebt. VRT Grondplan 2023VRT grondplan 2023pdf229 KBGrondplan VRT 2023AssistentiehondenBlindengeleidehond en andere assistentiedieren zijn wettelijk altijd en overal toegelaten en zijn welkom in de VRT-gebouwen. Rondleidingen op VRTDoor de beperkte toegankelijkheid van het gebouw is het aantal rolstoelgebruikers bij geleide bezoeken beperkt. Meer informatie kan je hier raadplegen.Toegankelijkheid van studio-opnamesWil je graag eens een studio-opname bijwonen op VRT maar twijfel je of dit mogelijk is omwille van specifieke noden rond toegankelijkheid ? Neem zeker contact met ons op, via toegankelijkheid@vrt.be en dan bekijken we samen hoe we je deelname mogelijk kunnen maken.Het nieuwe VRT gebouwOp dit moment wordt er hard aan het nieuwe gebouw van VRT gewerkt, de verhuis zal rond 2027 plaatsvinden. Hier streven we naar het Kwaliteitslabel A++ van de organisatie Inter. Dit belooft veel gebruikerscomfort voor alle bezoekers, medewerkers en klanten met uitgebreide toegankelijkheidsvereisten voor de afwerking en voor alle doelgroepen. Ontdek het nieuwe VRT-huisVRT bouwt een nieuw huis tegen 2026Lees meerNieuw VRT-gebouw krijgt vorm: de officiële eerste steen is gelegd Dit was Open Wervendag op de werf van het nieuwe VRT-huis: “Als je er middenin staat, besef je pas hoe indrukwekkend de site is”VRT toegankelijke events We proberen onze events zo toegankelijk mogelijk te maken voor iedereen. Toch maakt de locatie of aard van het event het ons soms iets moeilijker. Neem zeker een kijkje op onze pagina van toegankelijke events. Daar geven we een overzicht van onze evenementen die het kwaliteitslabel “Toegankelijk Event” van Inter dragen. Was je op één van onze events of programma’s met publiek en heb je suggesties om de toegankelijkheid nog te verbeteren?Laat het ons weten via toegankelijkheid@vrt.be. Op zoek naar informatie over de toegankelijk van VRT-events? Volg deze link: VRT Toegankelijke events. Of wil je meer te weten komen over diversiteit en inclusie bij VRT? Neem dan zeker een kijkje op de pagina: VRT Diversiteit en inclusie.ToegankelijkheidVRT is er voor iedereenVRT wil zo toegankelijk mogelijk zijn voor alle Vlamingen en onderneemt daarom stappen in overleg met de betrokken belangenorganisaties.Lees meerContacteer onsRoutebeschrijvingHet omroepgebouw in Brussel is gemakkelijk te bereiken met de auto en met het openbaar vervoer.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
