["https://vrt.be/nl/over-ons/nieuws-over-vrt/chloe-van-de-klantendienst-beseffen-jullie-niet-dat-de-vlamingen-dit-beu-zijn"]
title = "Chloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’ | VRT"
description = "Woensdag 28 augustus 2024 - Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Chloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’28 augustus 2024Woensdag 28 augustus 2024 - Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 2.654 keer contact opgenomen met onze dienst. Aan het einde van de zomer zijn onze klanten vaak wat milder. Of is het aanbod gewoon wat minder? Hoe dan ook, iedereen bij VRT timmert dan hard aan de weg richting een nieuw radio- en tv-seizoen. En dat geeft ons wat ruimte om stil te staan bij de consumentenzaken die er écht toe doen: het onderbuikgevoel van Vlaanderen. Ik heb er intussen een theorie over. Wanneer iets serieus op de maag van de Vlaming ligt, hoort daar een geijkte uitdrukking bij. “Beseffen jullie wel”, gevolgd door een ergernis waar zichtbaar geen notie van wordt genomen. Hier volgt een bloemlezing. Boeren “Ik erger me mateloos aan het gebruik van het woord ‘boer’ in Thuis. Je mag geen ‘Zwarte Piet’ en ik weet wat niet meer zeggen. Maar als er iets lomps gebeurt, mag je wel ‘boer’ gebruiken. Beseffen jullie wel hoe vernederend dit is voor die mensen die zeer hard werken en instaan voor onze voeding? Zijn jullie complete idioten?” “Ik zag zojuist jullie samenvatting van ALLE STRAFFE REEKSEN die jullie het laatste jaar hebben uitgezonden en de fierheid daarop. Al vele jaren vind ik dat er op jullie zenders te veel misdaad, agressie en ruwheid wordt getoond! Beseffen jullie wel hoe dit de huiskamers binnen komt? Beseffen jullie dat dit inspiratie geeft aan misdadigers en criminelen? Beseffen jullie dat jullie een voedingsbodem creëren om de agressie in België te laten toenemen?” “Bij VRT komen weeral een aantal Franstaligen aan het woord! Beseffen jullie niet dat de Vlamingen dit beu zijn?” “In Classic Klaasje kijkt Klaasje Meijer met leken naar de kandidaten van de Koningin Elisabethwedstrijd. Waarom moeten die leken ‘bekende’ mensen zijn? Beseffen jullie niet dat die ons stilaan de strot uitkomen? De meerwaarde van die mensen is me compleet zoek.” “Wimbledon is begonnen en VRT slaagt erin om zich van den domme te houden en er met geen woord over te reppen tijdens de nieuwsuitzendingen. Koers en voetbal, verder reikt de kennis van de sportdienst niet. Beseffen jullie niet hoeveel tennisliefhebbers er in Vlaanderen zijn?” “Wat is de bedoeling van de berichtgeving in De afspraak? Willen jullie nu echt extreemrechts groot maken? Beseffen jullie wel wat jullie doen? Een wolf in schaapsvacht maken jullie tot held van de dag. Daar is maar 1 woord voor... beneden alle peil!” Wij beseffen inderdaad niet dat “beneden alle peil” als één woord geschreven moet worden. Dat terzijde. Toiletartikel Volgens Van Dale is ‘besef’ een bewustzijn van iets. In het volle besef zijn van z’n verantwoordelijkheid. Wat dat betreft moet de publieke omroep zich verantwoorden tegen de opdrachtgever: de Vlaamse overheid. De verantwoordelijkheden van VRT worden netjes opgesomd in de Beheersovereenkomst. Daarin staat vooralsnog geen melding van het gebruik van het woord ‘boer’, van een limiet op het aantal fictieve criminelen, Franstaligen en BV’s die aan bod komen, van meer aandacht voor tennis en minder voor bepaalde partijen. Maar ik besef dat niet elke Vlaming daarvan op de hoogte is. Tot slot nog deze recente, heikele kwestie over De sportzomer van Radio 1. “Waarom ligt er op de desk van Gert Geens een kam terwijl hij niet direct een dergelijk toiletartikel lijkt nodig te hebben.” Beseffen jullie wel hoe kwetsend dit is voor de kalende presentator? Chloë van de KlantendienstColumnChloë van de klantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
