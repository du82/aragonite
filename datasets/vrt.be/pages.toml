title = "VRT-profiel: hulp bij foutmeldingen | VRT"
description = "Op deze pagina vind je mogelijke oplossingen voor foutmeldingen die voorkomen bij het VRT-profiel."
full_description = 'Home/VRT-profiel/VRT-profiel: hulp bij foutmeldingenVRT-profiel: hulp bij foutmeldingenOp deze pagina vind je mogelijke oplossingen voor foutmeldingen die voorkomen bij het VRT-profiel.Foutmelding: Je gebruikt een verouderde browserHet gebruik van een up-to-date browser is heel belangrijk. Voornamelijk om veiligheidsreden, waarbij een browser veiligheidsproblemen snel aanpakt. Daar de meeste hedendaagse browsers allemaal een automatische update functie hebben, zal je ook steeds van de meest recente versie van een browser gebruik maken. Daarnaast is het ook belangrijk om een recente browser te gebruiken, zodat nieuwe technologieën en functionaliteiten van websites ondersteunt worden in de browser.Daarom gebeurt er bij het gebruik van het VRT-profiel een kleine controle naar welke browser je gebruikt, en of je beter een update doet van je browser, of je eventueel een andere browser kiest. Zodoende zijn we ook zeker dat de functionaliteiten die nodig zijn voor het inloggen of het wijzigen van jouw profiel data wel degelijk uitgevoerd kunnen worden.Oplossing:Om over te stappen naar een meer recentere browser, kan je via deze link jouw keuze maken: https://bestvpn.org/outdatedbrowser/nlOpmerking:Deze controle kan ook Microsoft Edge als verouderd aanduiden, daar er een nieuwe Microsoft Edge versie is die een andere technologie onder de motorkap gebruikt (Microsoft Edge op basis van Chromium), en deze versie wordt maar stelselmatig uitgerold, of dien je zelf manueel te installeren. Dat kan via deze link: https://support.microsoft.com/nl-nl/help/4501095/download-the-new-microsoft-edge-based-on-chromiumFoutmelding bij het wijzigen van mijn paswoord: “Er liep iets mis.”Mogelijke oplossing:Het wijzigen van het paswoord gebeurt best in een incognito of privacy venster van de browser. Dit is een apart venster waarbij geen cookies worden ingeladen. Dit kan als volgt geopend worden in de browser:Paswoord wijzigen flow uitvoeren.Dus klikken op “Paswoord vergeten?”En nu jouw e-mail adres ingeven.Klikken op de knop “Vraag een nieuw paswoord aan”Open jouw mailtoepassing, en zoek de mail van het VRT-profiel om jouw paswoord te wijzigen (kijk ook in de folder voor ongewenste mail).Kopieer de link voor de paswoord wijzigen flow uit de mail.Open een privévenster in jouw browser:Staat hier uitgelegd hoe dat kan: https://computertotaal.nl/artikelen/apps-software/zo-gebruik-je-de-privemodus-van-je-browser-68972/Of door rechts te klikken op je browser icoon en incognito modus of privévenster aan te klikken:De paswoord wijzigen flow uitvoeren. Dan zou je geen fout mogen krijgen.Indien er toch een fout verschijnt, contacteer dan de klantendienst via de link in de foutmelding.Je gsm-nummer wordt geweigerd omdat hij van een online sms-dienst komt.We stellen vast dat je bij het verifiëren van jouw woonplaats via gsm-nummer een nummer gebruikt dat aan een online sms-dienst toebehoort. Dit is juridisch niet toegestaan en daarom wordt dit gsm-nummer geweigerd.Ben je Belg en wil je met je VRT-profiel toch genieten van ons aanbod in het buitenland? Voer dan je geldig en persoonlijk Belgisch gsm-nummer in en rond hiermee je verificatie af, of verifieer je woonplaats of nationaliteit via ‘Mijn Burgerprofiel’ van de Vlaamse Overheid.Heb je toch je eigen gsm-nummer gebruikt of zit je met vragen hierover? Contacteer gerust onze klantendienst via /node/214.De link "paswoord wijzigen " werkt nietMogelijke oorzaken dat de URL niet werkt:de link in de mail is maar 1 uur geldig. Indien buiten deze tijdsperiode de link wordt aangeklikt, werkt de link niet meer.Oplossing: Nieuwe paswoord reset link aanvragen.de link wordt door sommige e-mail clients gewijzigd bij het doorsturen van de link naar een browser (voorbeeld bepaalde versies van Thunderbird).Oplossing: Manueel kopiëren van de link en deze plakken in de browser.Paswoord wijzigen scherm vertoont een fout na invoeren van een nieuw paswoord. Mogelijke fout: “Missing required parameter”Oplossing: Start de paswoord wijzigen flow vanuit de VRT-profiel site: https://profiel.vrt.beFoutmelding: "VRT-profiel vereist dat uw browser cookies aanvaardt. Gelieve deze in uw browser instellingen in te schakelenMogelijke oplossing:Aanvaarden van cookies voor de VRT-profiel site. Dat kan je als volgt doen voor jouw browser:Firefox: https://support.mozilla.org/nl/kb/websites-melden-cookies-geblokkeerd-deblokkerenChrome: https://support.google.com/chrome/answer/95647?co=GENIE.Platform%3DDesktop&hl=nlSafari op Mac: https://support.apple.com/nl-be/guide/safari/sfri11471/macSafari op iPhone of iPad: https://support.apple.com/nl-nl/HT201265 Microsoft Edge: https://support.microsoft.com/nl-be/help/17442/windows-internet-explorer-delete-manage-cookiesHet VRT-profiel kan niet worden geladenMogelijke oplossingen:De instellingen van de browser controleren om javascript terug in te schakelen.Voor Microsoft Internet Explorer:https://support.microsoft.com/nl-nl/help/3135465/how-to-enable-javascript-in-windowsVoor Google Chrome:https://support.google.com/adsense/answer/12654?hl=nlVoor Mozilla Firefox:https://support.mozilla.org/nl/kb/javascript-instellingen-voor-interactieve-webpaginas Ad-blocker blokkeert een belangrijke component die het VRT-profiel gebruikt om in te loggen:Voeg https://login.vrt.be toe als whitelist in de ad-blocker. Indien je BitDefender gebruikt kan je dat op deze plaats aanpassen. Schakel de ad blocker uit en probeer opnieuw.Voeg de VRT-login pagina of de scripts die gebruikt worden op VRT-profiel toe aan de lijst met uitzonderingen voor deze ad blocker. Probeer een andere browser:Mogelijks gebruik je een minder courante browser, en ondersteunt VRT deze browser niet. Probeer dan eens in te loggen via een standaard browser.Inloggen kan via de VRT-profiel website: https://profiel.vrt.be.Lijst met standaardbrowsers kan hier gevonden worden: https://bestvpn.org/outdatedbrowser/nlBij het aanmelden en bevestigen van mijn gegevens op het VRT-profiel zit ik in een loopAls gebruiker log je in via het VRT-profiel, en verifieer je je gegevens. Bij het klikken op de ‘Ga Verder’ knop kom je terug op de login pagina, en dien je opnieuw in te moeten loggen. Ik zit in een loop, ik moet steeds opieuw aanmelden en mijn gegevens bevestigen.Mogelijke oplossing:VRT-profiel maakt gebruik van cookies. Door de vernieuwing van het VRT-profiel kan het zijn dat de oude cookie settings wat roet in het eten gooien bij het aanloggen. Daardoor vragen wij jou om de cookies van VRT-profiel te verwijderen. Dat kan als volgt gebeuren voor jouw browser:Firefox: https://support.mozilla.org/nl/kb/cookies-verwijderen-gegevens-wissen-websites-opgeslagen?redirectlocale=nl&redirectslug=Cookies+verwijderenChrome: https://support.google.com/accounts/answer/61416?co=GENIE.Platform%3DDesktop&hl=nlSafari op Mac: https://support.apple.com/nl-be/guide/safari/sfri11471/macSafari op iPhone of iPad: https://support.apple.com/nl-nl/HT201265 Microsoft Edge: https://support.microsoft.com/nl-be/help/17442/windows-internet-explorer-delete-manage-cookiesVerwijder de cookies van login.vrt.be.Er verschijnen geen inlogveldenMogelijke oplossingen:Bepaalde componenten die binnen het VRT-profiel worden gebruikt, worden geblokkeerd. Zo laten wij de mogelijkheid toe om in te loggen via het sociale netwerk van Google. Maar in voorbeeld China wordt dit geblokkeerd, waardoor de gehele pagina wordt geblokkeerd en het niet mogelijk is om in te loggen.Hiervoor hebben wij geen oplossing.Probeer eens in een browser te navigeren naar volgende URL: https://accounts.vrt.be/Je zou een witte pagina moeten zien. Wanneer er geen fouten getoond worden, zou je moeten kunnen inloggen. Dan ligt de oorzaak elders, en kijk je best naar de oplossingen onder het puntje: “Het VRT-profiel kan niet worden geladen:”"Beperkte" toegang-fout op iOS toestelGebruiker krijgt op een iOS toestel de fout "De toegang tot deze pagina op "login.vrt.be" is beperkt, zodat je deze niet kunt bekijken."Mogelijke oplossing:Het ouderlijk toezicht is niet correct geconfigureerd op het iOS toestel:1. Volg de instructies op : https://support.apple.com/nl-be/HT201304#web-conten2. Pas daar ofwel "Onbeperkte toegang" toe, ofwel (indien niet aanvaardbaar) de volgende configuratie.VRT-profiel: veelgestelde vragenVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites moet je een VRT-profiel aanmaken. De belangrijkste gebruiksvoorwaarden en vragen kan je hier vinden.Lees meerAndere vragenHeb je toch nog een andere vraag?De VRT-klantendienst staat altijd tot je dienst!VRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.WedstrijdreglementDit wedstrijdreglement bepaalt de algemene regels met betrekking tot de deelnemingsvoorwaarden voor alle wedstrijden die VRT organiseert via haar websites, andere onlinekanalen (zoals YouTube, Facebook, Twitter) of op een andere wijze.Mijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. GebruiksvoorwaardenHieronder vind je de algemene gebruiksvoorwaarden voor de VRT-onlinediensten.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'
