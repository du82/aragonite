full_description = "Home/Contacteer ons/Radio2 LimburgRadio2 LimburgAdresLimburgplein 23500 HasseltOp het kruispunt van de Guffenslaan en Sint-Jozefstraat, onder de schuine spiegel van het stadskantoor.Nieuws meldenHeb je iets gezien of aan te kondigen dat nieuwswaardig is? Je kan de regionale redactie bereiken :Meld nieuwsMailadressen van andere programma’s van Radio 2 vind je op radio2.be. vind je niet wat je zoekt? Mail naar info@radio2.beMet het openbaar vervoerVanuit het station wandel je richting centrum. Zodra je de kleine ring bereikt, sla je rechtsaf en volg je de kleine ring tot je ons gebouw bereikt.Dienstregelingen vindt u op www.nmbs.be en www.delijn.beMet de wagenVanuit Antwerpen of Brussel volgt u de E313 Antwerpen - Luik tot afrit 28, Hasselt-Zuid. Bij de verkeerslichten gaat u rechtdoor. Van daaruit kom je op de kleine ring terecht (Groene Boulevard). Die moet je rechts volgen. Aan de linkerkant kom je dan onze redactie tegen, in de oude rijkwachtkazerne. Wil je parkeren, volg dan de pijlen richting Q-parking Twee Torens.Vanaf 2018 naar het centrum van de stadOp 16 november 2018 nam Radio 2 Limburg haar intrek in de rechtervleugel, op het gelijkvloers, van de oude rijkswachtkazerne aan de Guffenslaan in Hasselt. Dat heeft de Raad van Bestuur van de VRT op maandag 27 maart 2017 beslist. Dit monumentale gebouw werd verbouwd en gaat deel uitmaken van het nieuwe Hasseltse stadhuis. De vorige locatie van de radiozender, gelegen langs de Via Media, wordt verkocht.Ontdek het Radio2-aanbodRadio2 biedt houvast, ontspanning en optimisme met praktische tips voor het dagelijkse leven en helpt de luisteraars om de wereld veraf en dichtbij beter te begrijpen.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
