["https://vrt.be/nl/info/gebruiksvoorwaarden"]
title = "Gebruiksvoorwaarden | VRT"
description = "Hieronder vind je de algemene gebruiksvoorwaarden voor de VRT-onlinediensten."
full_description = "Home/GebruiksvoorwaardenGebruiksvoorwaardenHieronder vind je de algemene gebruiksvoorwaarden voor de VRT-onlinediensten.1. Over deze voorwaarden1.1. Waarom moet ik deze algemene voorwaarden lezen?Deze voorwaarden bepalen hoe je de VRT-onlinediensten mag gebruiken om VRT-content te bekijken, te beluisteren, te lezen en/of te (her)gebruiken.Wanneer je de VRT-onlinediensten gebruikt, aanvaard je automatisch en onvoorwaardelijk deze voorwaarden. VRT raadt je aan ze aandachtig te lezen vooraleer je de VRT-onlinediensten verder gebruikt. 1.2. Wat zijn “de VRT-onlinediensten” en “de VRT-content”?De VRT-onlinediensten zijn alle websites, (mobiele) applicaties en internetdiensten die VRT aanbiedt en die toegang geven tot VRT-content. VRT-content is inhoud die VRT via haar VRT-onlinediensten toegankelijk maakt voor het brede publiek. Het gaat onder meer om geluidsfragmenten, video, tekst, foto’s, interactieve toepassingen, programmagegevens, bestanden, software en andere content. 1.3. Wie stelt De VRT-onlinediensten en de VRT-content ter beschikking?De VRT-onlinediensten en de VRT-content worden je ter beschikking gesteld door VRT, NV van publiek recht, met maatschappelijke zetel te A. Reyerslaan 52, 1043 Brussel. In deze voorwaarden wordt naar telkens verwezen naar “VRT”. Voor alle vragen en/of opmerkingen kan je terecht op het hierboven vermelde adres of bij de klantendienst op het e-mailadres Hallo@vrt.be.1.4. Moet ik ook nog andere voorwaarden lezen?VRT raadt je aan ook de privacy- en cookiesverklaring aandachtig te lezen. Daarin staat hoe VRT omgaat met jouw persoonlijke gegevens en welke cookies op de VRT-onlinediensten gebruikt worden.Voor sommige VRT-onlinediensten zijn bijuzondere voorwaarden van toepassing die afzonderlijk vermeld zijn. Die bijzondere voorwaarden gelden samen met deze voorwaarden. Ook de privacy- en cookieverklaring zijn erop van toepassing. Als de teksten elkaar tegenspreken, hebben de bijzondere voorwaarden voorrang.Via de VRT-onlinediensten kan je soms toegang krijgen tot externe websites (bijvoorbeeld door middel van een link) of ermee interageren (bijvoorbeeld sociale media). Deze externe websites hebben eigen algemene gebruiksvoorwaarden die ook van toepassing zijn. VRT heeft geen invloed op deze voorwaarden en zij raadt je aan ook die voorwaarden te lezen. 1.5. Kunnen de voorwaarden veranderen?VRT kan deze voorwaarden, de privacy- en cookiesverklaring en/of de bijzondere voorwaarden op elk moment veranderen. De aangepaste voorwaarden worden bekendgemaakt op de VRT-onlinediensten en gelden vanaf het moment dat ze bekendgemaakt worden. VRT raadt je aan regelmatig na te gaan of er nieuwe voorwaarden van kracht zijn. Onderaan deze pagina staat telkens de datum van de laatste versie vermeld.2. Over de toegang en het gebruik van de VRT-onlinediensten2.1. Hoe kan ik toegang krijgen tot de VRT onlinediensten?De VRT-onlinediensten zijn gratis toegankelijk.Sommige diensten bieden je de mogelijkheid om een VRT-profiel aan te maken. Wanneer je dit doet vraagt VRT je om een aantal persoonlijke gegevens, zoals bijvoorbeeld jouw e-mail, adres, naam, geboortedatum, geslacht en postadres/postcode. Waarom VRT deze gegevens vraagt en hoe ze hiermee omgaat staat beschreven in de privacy- en cookiesverklaring. Voor de toegang tot bepaalde VRT-onlinediensten (vb. voor bepaalde comfortdiensten) kan het aanmaken van een VRT-profiel (o.a. om technische redenen) vereist zijn. Voor het VRT-profiel zal je gebruik moeten maken van een wachtwoord. Je dient een wachtwoord te kiezen dat niet voor de hand liggend en voldoende veilig is. Jouw wachtwoord is persoonlijk en je mag dit niet aan anderen meedelen. Ook dien je zorgvuldig te waken over de geheimhouding ervan. Je bent verantwoordelijk voor de handelingen die met jouw wachtwoord worden gesteld.2.2. Waarvoor mag ik de VRT-onlinediensten (wel en niet) gebruiken?Je mag de VRT-onlinediensten gebruiken voor persoonlijke, niet-commerciële doeleinden, op voorwaarde dat je je houdt aan deze voorwaarden, de toepasselijke wetgeving en de eventueel toepasselijke bijzondere voorwaarden.2.3. Is de VRT-content altijd geschikt voor jong en oud?De VRT-content is voor iedereen toegankelijk, maar kan materiaal bevatten dat niet geschikt is voor een jong publiek. Als je een kind toestaat de VRT-content te bekijken, te beluisteren of te lezen, dan bent je als enige verantwoordelijk om te beslissen of deze content geschikt is voor het kind. Waar relevant en nodig brengt VRT de nodige waarschuwingen aan (bijvoorbeeld door het vertonen van een leeftijdsicoon). VRT vraagt je aandacht aan deze waarschuwingen te besteden.3. Over de rechten op de VRT-onlinediensten en de VRT-content3.1. Wie heeft de rechten op de VRT-onlinediensten en de VRT-content?De VRT-onlinediensten en/of de VRT-content zijn beschermd door intellectuele eigendomsrechten, waaronder auteurs- en naburige rechten, merkenrechten, databankrechten en rechten op computerprogramma’s. Deze rechten zijn eigendom van VRT en/of derde partijen (bijvoorbeeld licentiegevers of -gebruikers).Zonder de voorafgaande toestemming van VRT en/of deze derde partijen mag je daarom de VRT-onlinediensten en/of de VRT-content niet kopiëren, bewerken, publiceren, exploiteren of op een andere manier gebruiken, behalve als dat expliciet is toegestaan door deze algemene voorwaarden.VRT neemt technische beveiligingsmaatregelen om haar rechten en/of die van derde partijen op de VRT-onlinediensten en/of de VRT-content te beschermen. Je mag deze maatregelen niet omzeilen, verwijderen of wijzigen, noch ervoor zorgen dat anderen dat kunnen doen. 4. Over het hergebruik van de VRT-onlinediensten en/of de VRT-content, bijvoorbeeld op mijn eigen website of sociale media (zoals Facebook of Twitter)4.1. Mag ik de VRT-onlinediensten en/of de VRT-content downloaden, kopiëren, op andere websites of platformen publiceren, of op een andere manier hergebruiken?VRT is houder of licentienemer van de rechten (auteursrechten, merkenrechten) op de VRT-content die zij uitzendt en aanbiedt. Je mag dus enkel VRT-content (her)gebruiken wanneer je de toestemming hebt van VRT, of handelt onder een uitzondering uit de auteurswetgeving (zie bv. 4.2 betreffende het “embedden” van content). Wil je bijvoorbeeld een fragment uit een VRT-programma gebruiken op jouw website of sociale media-profiel, dan dien je hiervoor de goedkeuring te verkrijgen van VRT. Dit geldt zowel indien je de VRT-content voor commerciële als niet-commerciële doeleinden wilt gebruiken.VRT neemt technische beveiligingsmaatregelen om de VRT-onlinediensten en/of de VRT-content tegen hergebruik te beschermen. Je mag deze maatregelen niet omzeilen, verwijderen of wijzigen om de VRT-onlinediensten en/of de VRT-content toch te hergebruiken, noch ervoor zorgen dat anderen dat kunnen doen.Het is ook niet toegelaten om de VRT-content geautomatiseerd te (laten) raadplegen, bijvoorbeeld via scripts, spiders en/of bots. VRT heeft altijd het recht om haar toestemming voor het (her)gebruik van haar onlinediensten en/of content in te trekken.Uitzondering voor hergebruik van VRT-content bij deelname aan een VRT-programmaIn het geval je (in eigen naam of in naam van een organisatie, vereniging of politieke partij) deelneemt aan een actua-, debat-, praat- of nieuwsprogramma van VRT, staat VRT het gebruik van VRT-content wel toe voor niet-commerciële doeleinden, op voorwaarde dat je je houdt aan de algemene gebruiksvoorwaarden van VRT, de toepasselijke wetgeving, en de volgende specifieke gebruiksvoorwaarden:Je mag enkel de eigen bijdrage (eigen interview, tussenkomst, etc.) gebruiken, met inbegrip van tussenkomsten van de VRT-presentator/journalist en eventuele andere deelnemers aan het gesprek of debat.Er mag enkel VRT-content gebruikt worden uit video-, klank- en tekstbestanden die door VRT zelf online werden gezet.Er mogen geen foto’s, archiefbeelden, sportbeelden, nieuwsbeelden of muziek verwerkt zitten in de beelden die u gebruikt.Op geen enkel moment mogen de wetgeving en/of rechten van de VRT of derden geschaad worden. Het kan gaan om intellectuele eigendomsrechten (zoals auteursrechten, naburige rechten, merkenrechten) of de privacy van personen.Je mag het materiaal niet gebruiken voor inhoud die in strijd is met de openbare orde of de goede zeden, discriminerend, beledigend, lasterlijk of kwetsend is of op een andere manier inbreuk pleegt op de rechten van anderen.Het originele opzet en de oorspronkelijke context van de VRT-content moeten inhoudelijk behouden blijven. Jouw gebruik mag met andere woorden geen nieuwe uitdrukking of betekenis verlenen aan het origineel.Je mag VRT-content niet gebruiken buiten de context waarin VRT die aan het publiek aanbiedt en/of op zo’n manier dat VRT in diskrediet gebracht wordt, in een slecht daglicht komt te staan of aansprakelijk kan zijn ten opzichte van derde partijen. Nergens mag de foute indruk ontstaan dat VRT geassocieerd is met jou of een derde persoon, product, dienst, content, opinie, geloof of overtuiging of dat VRT die ondersteunt of goedkeurt.Je mag een fragment selecteren uit langere VRT-video-, audio-, of tekstbestanden. Dat fragment moet dan wel als losstaand element gebruikt worden. Je mag met andere woorden geen fragmenten aan elkaar monteren.Je voegt altijd een duidelijke en correcte bronvermelding toe. Een tekst of een titel bijvoegen kan, mits behoud van de context. Het fragment mag ondertiteling krijgen op voorwaarde dat het een letterlijke en objectieve weergave is van wat er in het fragment wordt gezegd of getoond.Het frame van de VRT-content moet in zijn oorspronkelijke staat behouden blijven. Extra grafische elementen toevoegen op en rond het VRT-materiaal is niet toegestaan (bvb. geen overlay, logo’s, banners, kaders rondom).Dit beperkte gebruiksrecht leidt er niet toe dat VRT gehouden is bepaalde VRT-content kosteloos ter beschikking te stellen of het downloaden ervan mogelijk te maken.VRT behoudt zich steeds het recht voor om het gebruik van haar VRT-content alsnog te verbieden, ook al werd dit toegestaan onder dit beperkte gebruiksrecht.4.2. Mag ik hyperlinks of embedded links aanbrengen naar de VRT-onlinediensten en de VRT-content op mijn eigen of andere websites (zoals Facebook of Twitter)?Je mag op uw eigen of op een andere website linken, delen of op een andere manier naar de VRT-onlinediensten en/of de VRT-content verwijzen, maar uitsluitend voor persoonlijke, niet-commerciële doeleinden en als je je houdt aan de andere bepalingen in deze algemene voorwaarden.Een hyperlink kan, op voorwaarde dat wanneer de bezoeker van jouw website op de link klikt, hij of zij naar de betrokken VRT- onlinedienst geleid wordt om de VRT-content te bekijken, beluisteren of te lezen. Het URL-adres van de VRT-onlinedienst moet steeds duidelijk zichtbaar zijn in de link. Niet toegestaan zijn overneming, framing, herpublicatie, bewerking of toevoeging van materiaal dat op de VRT-websites gepubliceerd is.Voor sommige VRT-content zal je de mogelijkheid hebben om deze in te sluiten (embedden) op een andere website of platform. Je mag van deze mogelijkheid gebruik maken voor persoonlijke, niet-commerciële doeleinden en voor zover je hierbij gebruik maakt van de speler (embedeabble player) die je ter beschikking wordt gesteld op de VRT-onlinedienst. Zo blijft de VRT-content steeds voorzien van het VRT-merkteken en wordt de integriteit ervan beschermd. Je mag de speler, de inhoud of enig onderdeel ervan niet wijzigen of verwijderen.4.3. Op welke manier kan ik RSS-datafeeds integreren?Je mag de RSS-datafeeds van de VRT-onlinediensten gebruiken voor persoonlijke, niet-commerciële doeleinden, als je je houdt aan de andere bepalingen in deze algemene voorwaarden. Als u de RSS-datafeeds gebruikt, vermeld je duidelijk VRT als bron en je zorgt voor een link vanuit elke titel naar het overeenstemmende artikel op de betrokken VRT-onlinedienst. Alleen de link zelf van de RSS-datafeeds mag je aanbrengen op jouw website. Je mag geen VRT-content gebruiken die verwerkt is in de RSS-datafeeds.Als je de RSS-feeds van de VRT-onlinediensten op publieke schermen wilt gebruiken, moet je de uitdrukkelijke voorafgaande schriftelijke toestemming van VRT krijgen. Hiervoor kan je contact opnemen met onze klantendienst op het adres vermeld onder punt 1.3.5. Over jouw bijdragen op de VRT-onlinediensten5.1. Kan ik een actieve bijdrage leveren aan een VRT-onlinedienst?VRT biedt je soms de mogelijkheid om eigen bijdragen (zoals video’s, foto’s en tekstberichten) te delen op de VRT-onlinediensten en/of ze erin op te nemen. VRT maakt in dat geval duidelijk hoe je dat kan doen.Je kan ook deelnemen aan discussiefora, chatgroepen of babbelkanalen, of jouw VRT-account koppelen aan jouw account op een socialenetwerksite (zoals Facebook en Twitter). Je kan ook deelnemen aan publieksstemmingen. Zo worden regelmatig bij de samenstelling van hitlijsten publiekstemmingen georganiseerd. Deze publiekstemmingen leveren waardevolle input aan de redactie bij de samenstelling van de finale hitlijst maar zijn niet bepalend voor de finale redactionele keuze van VRT. Voor andere publieksstemmingen (zoals stemmingen over een bepaalde vraag) wordt de publieksstemming wel integraal overgenomen, tenzij VRT vermoedens heeft dat er sprake is van manipulatie van de publieksstemming. In dit laatste geval kan VRT beslissen om de publiekstemming te verwijderen dan wel de resultaten ervan bij te sturen.5.2. Wat zijn de spelregels voor actieve bijdragen aan een VRT-onlinedienst?Jouw bijdrage op de VRT-onlinediensten mag alleen geoorloofde, persoonlijke en niet-commerciële berichten en informatie bevatten. Ze moet ook relevant zijn voor het forum, het kanaal of de groep waaraan je deelneemt. De VRT-onlinediensten staan in het algemeen open voor iedereen die een constructieve bijdrage levert, op beschaafde toon en in een behoorlijk Nederlands.Bij jouw bijdrage moet je een controleerbare voornaam en naam vermelden en een werkend e-mailadres waaruit jouw identiteit kan worden afgeleid. Alleen jouw voornaam, jouw initialen of jouw gebruikersnaam worden gepubliceerd in de dienst(en) van VRT.De persoonsgegevens die je aan VRT verstrekt, kan VRT aan de politiediensten en gerechtelijke autoriteiten doorgeven, bijvoorbeeld als ze onderzoek doen naar ongeoorloofd online gedrag.VRT heeft het recht om jouw bijdrage te weren, onder meer:als ze extremistisch, pornografisch, racistisch, seksistisch of beledigend is;als ze lasterlijk is of oncontroleerbare beschuldigingen of beweringen bevat;als ze gescheld, haatdragende taal, een agressieve toon en/of racistische uitlatingen bevat;als volledige zinnen in hoofdletters zijn geschreven;in het algemeen als ze juridisch of maatschappelijk ongepast wordt bevonden.Een VRT-onlinedienst kan premoderatie gebruiken. Daarbij wordt iedere bijdrage gescreend alvorens ze op het scherm verschijnt. VRT kan jouw bijdrage ook inkorten of aanpassen om operationele of redactionele redenen (zonder evenwel de teneur geweld aan te "
