["https://vrt.be/nl/info/vrt-profiel/vragen-over-aanmaken-vrt-profiel"]
title = "Vragen over het aanmaken van een VRT-profiel | VRT"
description = "Voor het gebruik van VRT MAX en een aantal toepassingen op onze websites en apps moet u een VRT-profiel aanmaken. De belangrijkste vragen kunt u hier vinden."
full_description = "Home/VRT-profiel/Vragen over het aanmaken van een VRT-profielVragen over het aanmaken van een VRT-profiel Voor het gebruik van VRT MAX en een aantal toepassingen op onze websites en apps moet u een VRT-profiel aanmaken. De belangrijkste vragen kunt u hier vinden.Waar kan ik een nieuw profiel aanmaken?Een nieuw profiel aanmaken is heel eenvoudig. Je kan je registreren via het beheersplatform van het VRT-profiel: klik daar op de link “Nog geen VRT-profiel? Registreer hier”. Je kan dit ook doen via elke VRT-website of -app waar je kan aanmelden: klik op het profiel-icoon en vervolgens op “Aanmelden”. Op de aanmeld-pagina klik je op “Nog geen VRT-profiel?” Hoe verloopt de registratieprocedure, welke stappen moet ik doorlopen?We hebben het registratieproces zo eenvoudig mogelijk gemaakt: (max.) 5 eenvoudige stappen en je bent klaar! Je kan registeren: met je e-mailadres met je Facebook-* of Google-account of met je Apple-ID * geen zorgen: we posten niets op je tijdlijn Als je een nieuw profiel aanmaakt met je e-mailadres, dan doorloop je deze stappen: Stap 1: Je vult je e-mailadres in en kiest een veilig wachtwoord. Tips voor een veilg en sterk wachtwoord:Gebruik bij voorkeur een wachtwoordmanager of wachtwoordkluis. Als dat niet kan, hou dan zeker rekening met volgende aanbevelingen: Kies een wachtwoord van minimaal 8 tekens Combineer hoofdletters, kleine letters, cijfers en symbolen Verander regelmatig je wachtwoord Gebruik geen voorspelbaar of voor de hand liggend wachtwoord Stap 2: Je geeft aan dat je akkoord gaat met de gebruiksvoorwaarden en het privacybeleid van de VRT. Stap 3: Je geeft volgende persoonsgegevens door: je voor- en achternaam je gender (je hebt keuze tussen “M”, “V”, “X” of “Zeg ik liever niet”) je geboortedatum je land, postcode en woonplaats Als je op het moment van de registratie meedoet aan een wedstrijd, dan vragen we in stap 3 ook meteen je “straatnaam en huisnummer”. Want als je wint, dan wil je de (hoofd)prijs graag thuis ontvangen. Wil je weten waarom we deze persoonsgegevens vragen? Lees dan zeker het antwoord bij de vraag: Welke (persoons)gegevens moet ik doorgeven, welke zijn verplicht/optioneel, en wat gebeurt ermee?Stap 4: Geef aan of je liever relevante advertenties ziet binnen onze apps en websites, of liever meer generieke advertenties ziet. Stap 5: Je kiest welke communicatie je wil ontvangen: nieuwsbrieven, berichten over interessante initiatieven/acties van de VRT of één van haar merken… Als je op het moment van de registratie meedoet aan een wedstrijd, stemming of actie waarvoor de redactie je (eventueel) graag wil opbellen, dan vragen we in stap 4 of je dat goed vindt. Ga je hiermee akkoord, dan kan je meteen je telefoonnummer invullen. Stap 6: Je ontvangt een e-mail met een bevestigingslink. Je profiel is actief zodra je op de bevestigingslink klikt die je in het e-mailbericht vindt. Heb je geen e-mail van ons ontvangen? Kijk dan eerst even in je map met “ongewenste e-mails”. Heb je hem daar niet gevonden? Klik dan pas op het scherm op de link “Bevestigingsmail opnieuw verzenden” Nog niets ontvangen? Kijk dan of je e-mailadres juist is. Je kan ook een VRT-profiel aanmaken via een sociale media account: we ondersteunen Facebook- en Google-accounts, en de Apple-ID. Klik op de knop van het gewenste socialemediaplatform en de registratie start. Deze registratie verloopt grotendeels op dezelfde manier als bij een e-mailadres. Het grote verschil is dat je minder gegevens zelf moet invullen: een deel van je persoonsgegevens krijgen we automatisch van het gekozen sociale netwerk. Belangrijk: Voor een goede werking van het VRT-profiel is het belangrijk dat we je e-mailadres kennen, naast het ID van je sociale media-account: elk nieuw VRT-profiel moet namelijk via een geldig e-mailadres geverifieerd worden. Binnen de sociale netwerken kan je aangeven om geen e-mailadres te delen met websites/apps die verbonden worden met je sociale media-account. Als je dat zo ingesteld hebt, dan zal het VRT-profiel bij de registratie vragen om een e-mailadres door te geven. Het is mogelijk dat je voor je Apple ID een zogenaamd relay e-mailadres* gebruikt. * Als je ervoor kiest je e-mailadres te verbergen wanneer je een account of profiel aanmaakt voor een app of website waarvoor je ‘Log in met Apple' gebruikt, dan wordt een uniek, willekeurig e-mailadres aangemaakt, zodat je persoonlijke e-mailadres privé blijft. Als dat gebruikt kan worden voor een geldige e-mailverificatie, dan is er niks aan de hand. Maar we zien ook vaak dat dit praktische problemen geeft: door het relay e-mailadres word je als een nieuwe gebruiker beschouwd en lukt de koppeling niet. Kan ik tijdens de registratie mijn gegevens nog aanpassen? Helaas niet. Zodra je naar een volgende registratiestap gaat, dan kan je niet meer terugkeren naar een van de vorige stappen. Heb je ergens per ongeluk een foutje gemaakt? Geen probleem: je kan na de registratie je gegevens makkelijk aanpassen of verbeteren via het beheersplatform van het VRT-profiel. Welke (persoons)gegevens moet ik doorgeven, welke zijn verplicht/optioneel, en wat gebeurt ermee?Tijdens de registratie van een nieuw VRT-profiel vragen we enkele persoonsgegevens en toestemmingen/voorkeuren. Deze persoonsgegevens hebben we ”minimaal nodig”: Je voor- en achternaam: Als we je naam kennen dan kunnen we je persoonlijk aanspreken in de communicatie die je van ons ontvangt. We merken dat dit erg gewaardeerd wordt. Je voor- en achternaam worden nooit gebruikt voor analytische doeleinden: elke vorm van analyse gebeurt op basis van een anoniem profiel. Je geboortedatum: Je moet minstens 13 jaar oud zijn om een VRT-profiel te mogen aanmaken. Ben je nog geen 13 jaar? Dan is er voor jou het Ketprofiel. Bovendien: Je leeftijd is ook belangrijk voor onze analyses in het kader van onze opdracht als openbare omroep. Je postcode / woonplaats (gemeente) / land: Je woonplaats (gemeente) wordt automatisch toegevoegd zodra je je postcode invult. En standaard staat België als land geselecteerd. Uitzendrechten, prijzen naar je kunnen opsturen, een relevant(er) (regionaal) aanbod tonen… allemaal redenen waarom het belangrijk is dat we je woonplaats kennen. Deze toestemmingen/voorkeuren zijn optioneel: Je gender (“M”, “V”, “X” of “Zeg ik liever niet”): Als we je gender kennen, dan kunnen we streven naar een evenwichtig aanbod: we willen graag relevant zijn voor alle Vlamingen. De suggesties die je krijgt, zullen nooit gekozen worden op basis van je gender. Bovendien: Je gender is ook belangrijk voor onze analyses in het kader van onze opdracht als openbare omroep. Deel je jouw gender liever niet met ons? Geen probleem, kies voor “Zeg ik liever niet”. Abonneren op een nieuwsbrief of communicatie van VRT of van een specifiek VRT-merk: Je beslist zelf of je je wil abonneren op onze nieuwbrieven en communicaties. We hopen natuurlijk wel dat je veel van onze interessante en gevarieerde berichten wil ontvangen: dan ben je als allereerste op de hoogte van belangrijke of exclusieve nieuwtjes, aanbodpromoties, enz. Zo ben je altijd snel en correct geïnformeerd. Opgebeld worden door een van onze redacties, bij specifieke acties, wedstrijden en stemmingen of als je een interessante reactie post: Bij een specifieke wedstrijd, stemming of actie wil een redactie je misschien wel opbellen: want het is altijd fijn om in contact te komen met onze kijkers en luisteraars. Het laat de redactie toe om je reactie of meer uitleg te vragen, je mening te kennen … We vragen in dat geval altijd eerst je toestemming. Ga je hiermee akkoord, dan kan je meteen je telefoonnummer doorgeven. Nuttig om te weten: Als je je telefoonnummer doorgeeft, dan betekent dat niet dat we je bij elke wedstrijd, stemming of actie automatisch mogen opbellen. We vragen elke keer vooraf je expliciete toestemming. Dat lijkt ons heel erg logisch… Je telefoonnummer wordt wel bewaard, dan hoef je dat niet herhaaldelijk in te vullen. Waarom wordt mijn straatnaam en huisnummer niet (altijd) gevraagd tijdens de registratie?We vragen je straatnaam en huisnummer enkel als dat echt noodzakelijk is. Als je op het moment van de registratie meedoet aan een wedstrijd, dan vragen we meteen ook je “straatnaam en huisnummer”. Want als je wint dan wil je de (hoofd)prijs graag thuis ontvangen. Doe je pas na de registratie mee aan een wedstrijd, dan worden je “straatnaam en huisnummer” pas gevraagd op het moment van je deelname. Wordt mijn VRT-profiel inactief als ik het lang niet gebruik? Ja, we verwijderen je VRT-profiel en alle bijhorende gegevens als je er lange tijd geen gebruik van maakt. Als je jouw VRT-profiel gedurende 13 maanden niet gebruikt, dan ontvang je van ons een vriendelijk berichtje… om je (weer) warm te maken voor leuke nieuwe video’s, wedstrijden, acties… want we willen dat je niet te veel mist van ons uitstekende aanbod. Gewoon even opnieuw aanmelden, en je VRT-profiel blijft behouden. Als je beslist niet opnieuw aan te melden, dan worden na 14 maanden al je gegevens gewist. Moet ik een Belgisch adres hebben om me te kunnen registeren?Nee, iedereen kan een VRT-profiel aanmaken. Opgelet! Heb je geen Belgisch adres? Dan kan je een groot aantal programma’s en video’s niet bekijken bij VRT MAX en Sporza. Dat heeft te maken met uitzendrechten. Al de rest kan je wel doen met je VRT-profiel: aan wedstrijden of stemmingen deelnemen, reacties posten… Meer informatie in verband met VRT bekijken in het buitenland, vind je op deze pagina.Waar kan ik terecht als ik problemen heb met de registratie?Heb je alle antwoorden gelezen op deze pagina en ondervind je nog steeds problemen met de registratie? Meld je probleem dan aan de VRT-klantendienst. Beschrijf zo duidelijk mogelijk wat er aan de hand is, dan kunnen we je snel en efficiënt verder helpen.Andere vragenHeb je toch nog een andere vraag?De VRT-klantendienst staat altijd tot je dienst!VRT-profiel: veelgestelde vragenVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites moet je een VRT-profiel aanmaken. De belangrijkste gebruiksvoorwaarden/vragen kun je hier vinden.Lees meerVRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.WedstrijdreglementDit wedstrijdreglement bepaalt de algemene regels met betrekking tot de deelnemingsvoorwaarden voor alle wedstrijden die VRT organiseert via haar websites, andere onlinekanalen (zoals YouTube, Facebook, Twitter) of op een andere wijze.Mijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. GebruiksvoorwaardenHieronder vind je de algemene gebruiksvoorwaarden voor de VRT-onlinediensten.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
