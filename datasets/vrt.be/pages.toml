["https://vrt.be/nl/over-ons/nieuws-over-vrt/in-het-spoor-van-vrt-nws-journalist-koen-wauters-wetenschap-toegankelijk-maken-voor-iedereen"]
title = "In het spoor van VRT NWS-journalist Koen Wauters: “Wetenschap toegankelijk maken voor iedereen” | VRT"
description = "Wetenschap is overal: thuis, onderweg, op het werk of zelfs in een pretpark. Of het nu gaat om gezondheid, ruimtevaart of artificiële intelligentie, VRT speelt een cruciale rol in het vertalen van complexe thema’s naar begrijpelijke verhalen voor het brede publiek. Dit engagement wordt extra in de verf gezet met de campagne ‘Wetenschap is overal’, waarmee VRT onder andere het 600-jarig bestaan van KU Leuven mee viert op 15 en 16 februari. Tijdens dit feestweekend brengt VRT wetenschap dichter bij het publiek met live radio-uitzendingen, een interactieve speurtocht en activatiestands vanuit VRT Innovatie. Wetenschapsjournalist Koen Wauters van VRT NWS legt uit hoe hij en zijn collega’s dagelijks werken aan het toegankelijk maken van wetenschap en waarom dat zo belangrijk is.&nbsp;"
full_description = '''Home/Over ons/Nieuws over VRT/In het spoor van VRT NWS-journalist Koen Wauters: “Wetenschap toegankelijk maken voor iedereen”In het spoor van VRT NWS-journalist Koen Wauters: “Wetenschap toegankelijk maken voor iedereen” 11 februari 2025Wetenschap is overal: thuis, onderweg, op het werk of zelfs in een pretpark. Of het nu gaat om gezondheid, ruimtevaart of artificiële intelligentie, VRT speelt een cruciale rol in het vertalen van complexe thema’s naar begrijpelijke verhalen voor het brede publiek. Dit engagement wordt extra in de verf gezet met de campagne ‘Wetenschap is overal’, waarmee VRT onder andere het 600-jarig bestaan van KU Leuven mee viert op 15 en 16 februari. Tijdens dit feestweekend brengt VRT wetenschap dichter bij het publiek met live radio-uitzendingen, een interactieve speurtocht en activatiestands vanuit VRT Innovatie. Wetenschapsjournalist Koen Wauters van VRT NWS legt uit hoe hij en zijn collega’s dagelijks werken aan het toegankelijk maken van wetenschap en waarom dat zo belangrijk is. Vertalen en verhalen “Mijn werk bestaat uit twee grote delen: vertalen en verhalen,” vertelt Koen Wauters. “Wetenschap kan soms behoorlijk ingewikkeld zijn. Onze taak als journalisten is om die complexiteit te doorgronden en de kernboodschap helder over te brengen. Het moet duidelijk en begrijpelijk zijn voor iedereen.” Dit geldt niet alleen voor televisie en radio, maar ook voor de website en sociale media van VRT NWS. Gezondheid is daarbij een thema dat altijd op veel interesse kan rekenen. “Mensen zijn enorm begaan met hun gezondheid en willen betrouwbare informatie,” zegt Wauters. “Bij wetenschapsnieuws ligt dat soms anders. Onderwerpen zoals deeltjesfysica of sterrenkunde kunnen ingewikkeld lijken, maar als je ze goed uitlegt, is er een groot publiek voor te vinden.” Betrouwbare bronnen en samenwerking Bij VRT NWS wordt wetenschapsjournalistiek niet alleen benaderd als een vertaling van academische kennis, maar ook als een manier om desinformatie tegen te gaan. Tijdens de coronapandemie speelde de redactie een belangrijke rol in het ontkrachten van misinformatie rond vaccins en virologie. “We werken nauw samen met de factcheckredactie binnen VRT NWS, zodat we enkel correcte en wetenschappelijk onderbouwde informatie verspreiden,” aldus Wauters. Hoewel VRT NWS, gezien hun onafhankelijkheid als nieuwsmedium, geen structurele samenwerking heeft met universiteiten, worden er regelmatig experts geraadpleegd. “We hebben een goed netwerk van wetenschappers aan verschillende universiteiten. Als er nieuws is, zoeken we de juiste experten op om het verhaal correct en genuanceerd te brengen,” zegt Wauters. Wetenschap is overal VRT viert mee 600 jaar KU LeuvenWetenschap is overal, ook bij VRT. De komende jaren wil VRT nog meer inzetten op wetenschap. Dat doen we via verschillende programma's, evenementen en zoveel meer. Het officiële startschot wordt gegeven op 15 en 16 februari, want dan viert VRT mee het 600-jarig bestaan van KU Leuven. Lees meerVlaanderen op wereldniveau Volgens Wauters onderschatten we vaak hoe hoogstaand wetenschappelijk onderzoek in Vlaanderen en België is. “We hebben in verschillende vakgebieden echte wereldtoppers,” zegt hij. “Het Instituut voor Tropische Geneeskunde in Antwerpen is bijvoorbeeld een wereldautoriteit op het vlak van infectieziekten. Ook rond fertiliteitsonderzoek in Brussel of ruimtevaartonderzoek aan KU Leuven zitten we in de wereldtop.” Dit jaar viert KU Leuven haar 600-jarige bestaan met de campagne ‘Kennis kent geen einde’. Daarbij worden toponderzoekers in de kijker gezet, onder andere via de 600 seconden lezingen. Wauters heeft zelf al meerdere van deze wetenschappers mogen interviewen. “Het is fantastisch om te zien hoe gepassioneerd zij met hun vak bezig zijn en hoe zij ook steeds beter worden in het vertalen van hun expertise naar het brede publiek.” VideoEen groeiende interesse Wetenschap en gezondheid zijn thema’s die steeds prominenter worden bij VRT NWS. Uit recent onderzoek van de studiedienst van VRT blijkt dat het publiek steeds meer vraag heeft naar gezondheidsnieuws. “Dat thema sprong er echt uit,” zegt Wauters. “Mensen willen goed geïnformeerd worden over hun gezondheid en over wetenschappelijke ontwikkelingen die impact hebben op hun leven.” Met een team van gespecialiseerde journalisten blijft VRT NWS inzetten op diepgaande en toegankelijke verslaggeving over wetenschap en gezondheid. Zo zorgt de publieke omroep ervoor dat betrouwbare en relevante informatie voor iedereen beschikbaar blijft. VRT viert mee met KU Leuven: wetenschap voor iedereen In het kader van de campagne ‘Wetenschap is overal’ organiseert VRT samen met KU Leuven een aantal initiatieven om wetenschap toegankelijker te maken: Live radio-uitzendingen: Radio 1, Klara, MNM en Radio2 maken live radio vanuit een glazen huis op het Hooverplein in Leuven. Wetenschap is overal-speurtocht: Een interactieve tocht langs Leuvense campussen, waarbij bezoekers via filmpjes van weervrouw Jacotte Brokken wetenschappelijke vragen kunnen oplossen. Digitale wetenschap: Wie er niet bij kan zijn, kan de vragen van de speurtocht beantwoorden op de VRT MAX-pagina van Ketnet. Innovatieve projecten van VRT: Bezoekers kunnen kennismaken met AI-toepassingen, Vlaamse Gebarentaal leren spellen en ontdekken welk weer het was op hun geboortedag. Met deze initiatieven wil VRT wetenschap dichter bij jong en oud brengen en de nieuwsgierigheid naar wetenschap en innovatie verder aanwakkeren. 600 jaar KU Leuven vormt daarin het startschot van een aantal samenwerkingen en campagnes waarin VRT het voortouw neemt om wetenschap nog meer in de kijker te zetten.Jacotte Brokken: "Wetenschap is van enorm belang. Om ziektes te genezen, om het klimaatprobleem op te lossen, enzoverder. Maar voor veel mensen is wetenschap nog iets onbekends, iets aartsmoeilijks lijkt het wel. Daarom ben ik heel blij dat we met de campagne Wetenschap is Overal vooral ook de fun van wetenschap laten zien. Er is niets zo leuk als nieuwsgierig op zoek gaan naar antwoorden. En ik kijk er al enorm naar uit om dat samen met jullie te doen op 15 en 16 februari in Leuven. "Nieuws & informatieHoe VRT NWS elke dag onafhankelijk nieuws en informatie tot bij jou brengtDe VRT-nieuwsdienst stelt het publieke belang voorop, hanteert een duidelijke journalistieke deontologie en is redactioneel onafhankelijk. Inhoudelijke afwegingen staan voorop bij de selectie en presentatie van nieuws en ander journalistieke content. Lees meerDit vind je ongetwijfeld ook interessantNieuws & informatieRadio 1 zet met nieuw logo en nieuwe huisstijl ook volop in op digitale platformen en veranderend luistergedragNieuws & informatieBjörn Soenens maakt voor VRT theatertour over AmerikaNieuws & informatieSarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapperNieuws & informatieWelke genomineerden maken zaterdag kans op een Kastaar!?Nieuws & informatie70% van de Vlamingen wil meer inzetten op brandpreventieNieuws & informatieDecember 2024: een absolute recordmaand voor VRT MAXNieuws & informatieOntdek alle genomineerden voor de Kastaars! 2024Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'''
