["https://vrt.be/nl/ons-aanbod/studio-brussel"]
title = "Studio Brussel | VRT"
description = "Studio Brussel is het trendsettende muzikale radiomerk van VRT.  Studio Brussel stimuleert een jonge actieve bevolking om creatief en eigenzinnig naar de wereld te kijken, met muziek als motor. Door onderscheidende keuzes en scherpe redactionele reflexen komt de zender tegemoet aan de behoeften van hun kritische en maatschappelijk bewuste community. Studio Brussel is bovendien een katalysator binnen de Vlaamse muzieksector en vervult een muzikale gidsfunctie, aangepast aan de digitale noden van de luisteraar."
full_description = '''Home/Ons aanbod/Studio BrusselStudio BrusselStudio Brussel is het trendsettende muzikale radiomerk van VRT. Studio Brussel stimuleert een jonge actieve bevolking om creatief en eigenzinnig naar de wereld te kijken, met muziek als motor. Door onderscheidende keuzes en scherpe redactionele reflexen komt de zender tegemoet aan de behoeften van hun kritische en maatschappelijk bewuste community. Studio Brussel is bovendien een katalysator binnen de Vlaamse muzieksector en vervult een muzikale gidsfunctie, aangepast aan de digitale noden van de luisteraar. Studio Brussel is het trendsettende muzikale radiomerk van VRT. Studio Brussel stimuleert een jonge actieve bevolking om creatief en eigenzinnig naar de wereld te kijken, met muziek als motor.Door onderscheidende keuzes en scherpe redactionele reflexen komt de zender tegemoet aan de behoeften van hun kritische en maatschappelijk bewuste community.Studio Brussel is bovendien een katalysator binnen de Vlaamse muzieksector en vervult een muzikale gidsfunctie, aangepast aan de digitale noden van de luisteraar.Geniet nu van Studio BrusselLuister live opVRT MAXDigital first als gids door het muziekaanbod Studio Brussel zet zich elke dag actief in om haar basisopdracht te vervullen: luisteraars muzikaal gidsen door het grote aanbod en hen informatie en duiding op maat geven. Dat doet de zender op een digital first-manier. Studio Brussel is namelijk een volwaardig 360°-mediamerk dat al sinds jaar en dag inzet op een sterke digitale aanwezigheid. In de jaren 90 had het als eerste mediamerk een website, experimenteerde het al vroeg met sociale media en zijn ze er nog steeds sterk en zeer succesvol op aanwezig. Studio Brussel onderscheidt zich door continu te innoveren en op originele manieren online content te maken. Studio Brussel is zowel lokaal als internationaal georiënteerd, en engageert zich voor een open, diverse samenleving waar ruimte is voor een positieve, relativerende noot en humor. Het merk draagt originaliteit hoog in het vaandel en geldt binnen VRT als een digitale trendsetter.Sterke community Studio Brussel betrekt haar publiek zoveel mogelijk in alles wat het doet. De sociale betrokkenheid van het merk komt aan bod in verschillende domeinen (cultuur, sport,…), met merkversterkende samenwerkingen en bijhorende live-uitzendingen en evenementen. Studio Brussel zet relevante en inspirerende thema’s op de agenda via radio, maar ook via videoreeksen zoals De Popcast of podcasts zoals Na de rouwstoet en Zware Klap. Het merk is ook een van de drijvende krachten achter De Warmste Week, de grootste solidariteitsbeweging van Vlaanderen.Via eigen evenementen voelt Studio Brussel live de polsslag van zijn publiek en de hele diverse samenleving, bijvoorbeeld via Studio Brussel LIVE LIVE, De 40 uur van Studio Brussel, Het Vroegste Concert of Music@work. Muziek is telkens het bindmiddel bij uitstek.Bovendien staat de zender gekend als dé festivalzender. Hierrond brengt Studio Brussel steeds heel wat festivalliefhebbers samen. Daarom werd er een WhatsApp-community opgericht: 'De eerste rij'. Dé plek om de beste festivalbeelden te delen. Maar ook dé plek om tips uit te wisselen: zowel muzikale - "Welke bands moet ik vandaag checken?" - als praktisch - "Is er eigenlijk een camping op de Lokerse Feesten?" - tips.Life is music Avontuurlijke muziek vormt de grondstof van Studio Brussel. Het aanbod is opvallend gevarieerd, rijk aan genres zoals rock, dance, hiphop en alternatieve pop. Het merk vormt zo een muzikale gids via al zijn kanalen. Zo is er ‘Nieuw in de playlist van Studio Brussel’, gloednieuwe nummers die je via alle Studio Brussel-platformen als eerste kan ontdekken. Het merk geeft binnen het zendschema ook een podium aan zowel opkomende als ervaren artiesten.Studio Brussel is een cruciale katalysator voor de Vlaamse muzieksector. Het merk gaat actief op zoek naar jong, muzikaal talent. Opkomende artiesten en bands krijgen vaak hun eerste airplay op de zender. Via de toonaangevende muziekwedstrijd De Nieuwe Lichting trekt Studio Brussel volop de kaart van beloftevolle artiesten van eigen bodem. De wedstrijd heeft impact als lanceringsplatform: dankzij De Nieuwe Lichting maakt een breed publiek kennis met de muziek van jonge artiesten. Binnen de muziekindustrie wordt een finaleplaats als een kwaliteitslabel beschouwd. Ex-winnaar Tamino won intussen al meerdere MIA’s, Sons en Equal Idiots speelden Rock Werchter plat, en ook finalisten als Brihang en Portland legden dankzij hun deelname een prachtig parcours af.Studio Brussel is de festivalzender bij uitstek. Het merk laat zijn publiek meegenieten van de beste concerten via live-uitzendingen met verslaggeving en interviews op radio, televisie en op VRT MAX. De zender is een graag geziene partner van grote en kleine festivals in Vlaanderen, maar ook van muziekclubs en tal van andere organisaties.Tijdens de eigen Studio Brussel LIVE LIVE shows spelen Belgische en internationaal gerenommeerde artiesten en muziekgroepen op bijzondere locaties. Zo passeerden IDLES, Florence & the Machine, Ben Howard en Elbow al de revue. Daarnaast maakt de zender zelf muziekdocumentaires als De Kempen in Japan, Rock ’n roll high school of Vijftig tinten gras: reeksen met een ontspannende en educatieve kijk op de muziek- en festivalgeschiedenis.Duik in het Studio Brussel kijkaanbod op VRT MAXOntdek nu opVRT MAXMeer weten? Lees ook deze artikelsMuziekAlice Mae, Kaat Van Stralen en Uwase zijn de winnaars van De Nieuwe Lichting 2025MuziekDit zijn de 9 finalisten van De Nieuwe Lichting 2025Muziek'Black' van Pearl Jam opnieuw op nummer 1 in De tijdloze 100Cultuur'Mia': het licht dat altijd blijft schijnenVerken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'''
