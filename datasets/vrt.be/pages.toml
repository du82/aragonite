ttp://icecast.vrtcdn.be/mnm_hits-mid.mp3AAC: http://icecast.vrtcdn.be/mnm_hits.aacKetnetKetnet HitsMP3: http://icecast.vrtcdn.be/ketnetradio-high.mp3 MP3 (met beperkt dataverbruik): http://icecast.vrtcdn.be/ketnetradio-mid.mp3AAC: http://icecast.vrtcdn.be/ketnetradio.aacVRT NWSMP3: http://progressive-audio.vrtcdn.be/content/fixed/11_11niws-snip_hi.mp3MP3 (met beperkt dataverbruik): http://progressive-audio.vrtcdn.be/content/fixed/11_11niws-snip_lo.mp3Het radioaanbod is natuurlijk ook gewoon te ontvangen via een gewoon radiotoestel met FM-antenne. De frequenties van de VRT-radionetten vind je hier.Meer weten over onze radiozenders?Radio 1Radio 1 is de actuazender in Vlaanderen die zijn luisteraars prikkelt en inspireert.Radio2Radio2 biedt houvast, ontspanning en optimisme met praktische tips voor het dagelijkse leven en helpt de luisteraars om de wereld veraf en dichtbij beter te begrijpen.MNMMNM is dé hitradio die helemaal draait om jongeren en hun leefwereld. Met de beste muziek en boeiende content gidst MNM jongeren door alles wat speelt in hun wereldje, van de nieuwste trends tot relevante info die je echt niet wilt missen. MNM is een positief en energiek platform waar je ervaringen kunt delen en je je thuis voelt in een community die inspireert en verbindt!Studio BrusselStudio Brussel is het trendsettende muzikale radiomerk van VRT. Studio Brussel stimuleert een jonge actieve bevolking om creatief en eigenzinnig naar de wereld te kijken, met muziek als motor. Door onderscheidende keuzes en scherpe redactionele reflexen komt de zender tegemoet aan de behoeften van hun kritische en maatschappelijk bewuste community. Studio Brussel is bovendien een katalysator binnen de Vlaamse muzieksector en vervult een muzikale gidsfunctie, aangepast aan de digitale noden van de luisteraar. KlaraKlara is de klassieke radiozender van de Vlaamse publieke omroep VRT. Klara biedt mediagebruikers een vluchtheuvel van rust en schoonheid. Als actieve partner van de cultuur- en muzieksector zet Klara in op de beleving en het genieten van cultuur en klassieke muziek, maar ook van jazz, hedendaagse muziek, film- en wereldmuziek. Klara steunt en organiseert spraakmakende acties en events rond klassieke muziek. Het biedt ook inzicht en verdieping op het gebied van kunst, geschiedenis, muziek en maatschappelijke thema’s. Radio BeneVRT Radio Bene is de digitale radiozender die zorgt voor de tijd van je leven. Met de mooiste evergreens en de beste artiesten van bij ons. Je kan er genieten van de hits van onze gevestigde waarden en je ontdekt nieuw aanstormend muzikaal talent. De TijdlozeHet digitale radiostation De Tijdloze brengt de beste, tijdloze muziek van de afgelopen zestig jaar. Te beluisteren via DAB+ en online via VRT MAX.Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
