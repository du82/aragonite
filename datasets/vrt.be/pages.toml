title = "VRT-contacten | VRT"
description = "Waar kan ik terecht met vragen en suggesties? En waar met persberichten?"
full_description = "Home/Contacteer ons/VRT-contactenVRT-contactenVoor de pers VRT Communicatie Voor woordvoerdersvragen kan je terecht bij woordvoerder@vrt.be. Voor interviews kan je mailen naar interviews@vrt.be. VRT communiceert klantvriendelijk, transparant en professioneel. Lees meer in ons communicatiebeleid. VRT-persberichten De persberichten van VRT zijn te vinden in onze pressroom. Foto- en videoportaal voor de pers VRT stelt foto's en videomateriaal ter beschikking via haar fotoportaal.Het gebruik van fotomateriaal, grafisch materiaal en logo's is niet toegestaan zonder voorafgaande toestemming van VRT, hetzij via e-mail of na ontvangst van een login op het fotoportaal. Het gebruik van de login impliceert dat u instemt met de geldende rechten en gebruiksvoorwaarden. Specifieke VRT-adressenVoor verschillende domeinen heeft VRT specifieke e-mailadressen. Je kan deze gebruiken als je informatie wenst te delen over een omroepthema.Muziek: gerrit.kerremans@vrt.beTaal: vrttaal@vrt.beDiversiteit: diversiteit@vrt.beToegankelijkheid: toegankelijkheid@vrt.be Nieuws te melden? Ben je getuige van een nieuwsfeit of heb je nieuws te melden? Volg dan deze link waar je rechtstreeks nieuws kan melden aan onze VRT NWS redactie.Als je contact wil opnemen met VRT NWS, of een persbericht wilt doorsturen, gelieve dan gebruik te maken van dit mailadres: nieuws@vrt.be.De nieuwsredactie selecteert autonoom uit de vele persberichten de items die zij relevant vindt. Vragen, klachten & felicitatiesSuggesties, vragen, klachten en felicitaties over VRT kan je altijd sturen naar de klantendienst. Voor klachten en berichten over nieuws- en duidingsprogramma’s verwijzen we je door naar dit formulier. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
