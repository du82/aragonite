["https://vrt.be/nl/over-ons/onze-organisatie/beleid/integriteit/leeftijdlabels"]
title = "Leeftijdslabels | VRT"
description = "De Vlaamse mediagroepen gebruiken leeftijdslabels om aan ouders een indicatie te geven of het aanbod geschikt is voor hun kinderen."
full_description = "Home/Over ons/Onze organisatie/Beleid/Integriteit/LeeftijdslabelsLeeftijdslabelsDe Vlaamse mediagroepen gebruiken leeftijdslabels om aan ouders een indicatie te geven of het aanbod geschikt is voor hun kinderen. De Vlaamse mediaorganisaties geven met leeftijdslabels en inhoudelijke pictogrammen aan of het aanbod schadelijk is voor de geestelijke, lichamelijke of morele ontwikkeling van minderjarigen. Kijkers kunnen daarmee beslissen of ze dat aanbod willen (laten) bekijken.Er worden vijf leeftijdscategorieën onderscheiden: AL (alle leeftijden), 6, 10, 12 en 16. In aflopende volgorde van zwaarte zijn de beoordeelde inhoudscategorieën: geweld, angst, seks, verslavende middelen, grof taalgebruik en negatieve beeldvorming.Vanaf 30 september 2024 moet elk nieuw programma dat lineair wordt uitgezonden of digitaal aangeboden, geclassificeerd worden volgens de nieuwe regels. Voor bestaand digitaal aanbod op VRT MAX mogen de oude aanduidingen 12+ en 16+ tijdelijk nog gebruikt worden.Sommige programma’s hoeven niet geclassificeerd te worden: uitzendingen van sportevenementen en sportwedstrijden, journaals en actualiteitenprogramma’s, muziekconcerten, liveprogramma’s op het moment van de uitzending. In zulke programma’s moet wel mondeling gewaarschuwd worden voor mogelijk schadelijke inhoud.Ook lineaire heruitzendingen en digitale herprogrammeringen moeten vanaf 30 september onmiddellijk geclassificeerd worden volgens de nieuwe regels.Series mogen geclassificeerd worden aan de hand van een steekproef. De hoogste scores van de steekproef gelden voor de hele serie. Elk seizoen van een serie moet apart geclassificeerd worden. Als dat nodig is, krijgt een individuele aflevering een hogere leeftijdscategorie.In beeld worden het leeftijdslabel en maximaal twee pictogrammen van inhoudscategorieën getoond, bij de start en na elke onderbreking. Op de detailpagina’s van VRT MAX worden alle inhoudscategorieën vermeld die tot het leeftijdslabel hebben geleid. Het leeftijdslabel AL wordt niet getoond.In trailers worden de pictogrammen getoond die bij het programma horen.Meer informatie over het classificatiesysteem is te vinden op de website van de Vlaamse regelgever: goedgezien.tv.IntegriteitVRT heeft een voorbeeldrol en wil een referentiepunt zijn voor de mediagebruiker. Ze streeft in haar aanbod de hoogste kwaliteit na en hanteert de hoogste ethische en redactionele standaarden. Voor VRT zijn betrouwbaarheid, onpartijdigheid, geloofwaardigheid, diversiteit en integriteit prioritair.Aandacht voor mediawijsheid en digitale inclusieVRT draagt bij tot de mediawijsheid van de Vlaamse mediagebruiker door het thema zowel in het breed-educatieve aanbod als in het educatieve aanbod voor scholen te integreren. Daarbij levert VRT inspanningen om de digitale vaardigheden van de Vlaamse bevolking te versterken en de digitale kloof te overbruggen. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
