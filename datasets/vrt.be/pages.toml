["https://vrt.be/nl/over-ons/onze-opdracht/missie-en-waarden/themas/educatie/vrt-in-de-klas/vrt-en-het-secundair-onderwijs"]
title = "VRT en het secundair onderwijs | VRT"
description = "Met een breed (educatief) aanbod wil VRT jongeren informeren, inspireren en verbinden met de wereld om hen heen. Zo ontwikkelt VRT programma’s en content op maat van jongeren, maar ook lesmateriaal specifiek voor leerlingen secundair onderwijs."
full_description = "Home/Over ons/Onze opdracht/Missie en waarden/Educatie/VRT in de klas/VRT en het secundair onderwijs VRT en het secundair onderwijs Met een breed (educatief) aanbod wil VRT jongeren informeren, inspireren en verbinden met de wereld om hen heen. Zo ontwikkelt VRT programma’s en content op maat van jongeren, maar ook lesmateriaal specifiek voor leerlingen secundair onderwijs. Aanbod voor (en door) jongerenActualiteit en duidingNws.nws.nws is het online nieuwskanaal van VRT NWS dat actualiteit vertaalt en toegankelijk maakt voor jongeren via Instagram, TikTok en op nws.nws.nws.be.Breed aanbod op maatVan programma tot podcast: zowel VRT MAX en MNM als de andere VRT-merken ontwikkelen een gevarieerd aanbod, afgestemd op de interesses en behoeften van jongeren.VRT voor leerkrachten secundair onderwijsEDUboxEDUbox is een kant-en-klaar lespakket voor het secundair onderwijs, gelinkt aan de onderwijsdoelen en gratis beschikbaar in de catalogus. Elke EDUbox behandelt een maatschappelijk relevant onderwerp, zit boordevol expertise, en bevat audiovisueel materiaal en interactieve tools. EDUboxDompel je klas onder in boeiende thema’s zoals lezen, energie, democratie of AI. Ontdek EDUboxKLAARKLAAR is een online videoformat waarin een host, vaak samen met een expert, meer klaarheid biedt rond hete hangijzers uit het (wereld)nieuws. Korte video’s, helder uitgelegd en onmiddellijk inzetbaar in de klas. KLAARBen je op zoek naar meer duiding bij actuele thema’s zoals geld, sexting of kansarmoede? Bekijk KLAARSmartschoolVia Smartschool informeert VRT leerkrachten en leerlingen over het educatieve aanbod. Met een maandelijkse nieuwsbrief en een eigen VRT-pagina met rechtstreekse link naar EDUbox, KLAAR, nws.nws.nws en VRT MAX navigeren Smartschoolgebruikers vlot naar het volledige aanbod van VRT. Het Archief voor Onderwijs Het archief voor onderwijs brengt het rijke VRT-archief tot leven in de klas. Leerkrachten vinden er een uitgebreide selectie aan VRT-fragmenten, geselecteerd voor en door leerkrachten en verpakt in lesklare collecties. Een blik achter de schermenVRT zet haar deuren open voor klasbezoeken. Tijdens een rondleiding met gids ontdekken leerlingen hoe televisieprogramma’s gemaakt worden, wandelen ze rond in de radiostudio’s van Studio Brussel of MNM, bezoeken ze de journaalstudio en presenteren ze zelf het weerbericht in de demostudio. Bezoek VRTMeer voor het secundair onderwijsVRT schenkt ook op andere manieren aandacht aan het secundair onderwijs. Met initiatieven als ‘De Strafste School’ van MNM en VRT MAX-programma's zoals ‘De Juiste Richting’ belicht VRT het onderwijs in al zijn dimensies. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
