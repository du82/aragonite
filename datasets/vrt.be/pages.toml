["https://vrt.be/nl/ons-aanbod/vrt-canvas"]
title = "VRT Canvas | VRT"
description = "VRT Canvas is het tweede televisienet van de Vlaamse publieke omroep VRT. Het brengt compromisloze kwaliteitscontent voor een publiek dat behoefte heeft aan verdieping en uitgedaagd wil worden met nieuwe inzichten. VRT Canvas informeert, inspireert en verbindt de mediagebruikers door middel van een onderscheidend aanbod met verrassende perspectieven en verhalen die mensen raken. Het net focust daarbij op duidingsprogramma’s, documentaires, cultuur en geschiedenis, wetenschap, internationale fictie, satire en sport."
full_description = "Home/Ons aanbod/VRT CanvasVRT Canvas VRT Canvas is het tweede televisienet van de Vlaamse publieke omroep VRT. Het brengt compromisloze kwaliteitscontent voor een publiek dat behoefte heeft aan verdieping en uitgedaagd wil worden met nieuwe inzichten. VRT Canvas informeert, inspireert en verbindt de mediagebruikers door middel van een onderscheidend aanbod met verrassende perspectieven en verhalen die mensen raken. Het net focust daarbij op duidingsprogramma’s, documentaires, cultuur en geschiedenis, wetenschap, internationale fictie, satire en sport.VRT Canvas brengt content die ertoe doet, die het publiek dwingt tot reflectie, die de kostbare tijd waard is. Naar VRT Canvas kijken is een persoonlijke keuze vanuit het verlangen naar content die relevant is, waar en wanneer de kijker zelf wil.De tijd die het publiek doorbrengt met VRT Canvas is kwalitatief. Of het nu gaat om actualiteitsprogramma’s die focussen op wat nu leeft, of documentaires, reportagereeksen en fictie die relevant blijven: VRT Canvas is geen tijdsverspilling. VRT Canvas vertrekt vanuit een grote openheid voor de veelheid aan meningen in de maatschappij. Maatschappelijke thema’s staan centraal om de bespreekbaarheid ervan te stimuleren. Omdat mensen bewust kiezen om naar een bepaald programma te kijken, moet ook het gebruiksgemak daarop afgesteld zijn. Daarom wil VRT Canvas naar de toekomst toe nog meer inzetten op het niet-lineair beschikbaar maken van het aanbod, onder andere via VRT MAX. VRT Canvas biedt duiding en inzicht in de wereld over de mediaplatformen heen: zowel op televisie, als online. VRT Canvas streeft naar kwaliteit op basis van de volgende pijlers: Sterke, vaste actua-afspraken VRT Canvas verzekert sterke, vaste actua-afspraken die verdiepend inzoomen op wat er leeft in de maatschappij en de wereld rondom ons. Het merk brengt live duiding bij wat er gebeurt in zowel binnen- als buitenland. De duidingsprogramma’s Terzake en De afspraak zijn twee essentiële puzzelstukken binnen dat streven: ze leveren onmiddellijke duiding bij de actualiteit van de dag en voeden het publieke debat. Zo sluiten ze nauw aan bij de identiteit van VRT Canvas. Extra Time zorgt voor een wekelijkse analyse en duiding bij voetbal. Naast het nieuwsaanbod van VRT NWS en Sporza biedt De ideale wereld vier keer per week een alternatieve blik op de actualiteit, met de nodige humor en satire.Ella Leyers in De ideale wereldSterke Vlaamse content Vlaamse producties krijgen een prominente plaats in het aanbod. ‘Kwalitatief’ en ‘van eigen bodem’ zijn sleutelwoorden. VRT Canvas brengt een uitgebreid aanbod van programma’s waar je iets van bijleert, van geschiedenis tot economie, wetenschap, muziek, sport en relevante maatschappelijke thema’s. Het merk wil het hele jaar door zoveel mogelijk mensen inspireren met en warm maken voor cultuur. Cultuur zit dan ook verweven in het hele aanbod. VRT Canvas selecteert streng in thema’s, bouwt aan toptitels en werkt met de beste interne en externe makers samen om zijn belofte aan de kijker waar te maken. Ontdek onze Vlaamse identiteitVRT draagt de Vlaamse identiteit in al haar verscheidenheid uit en laat de diversiteit in de samenleving zien. De publieke omroep draagt bij aan de ondersteuning en versterking van de Vlaamse identiteit. Dat gebeurt vooral door het stimuleren van kwaliteitsvolle producties van eigen bodem, zowel in de audiovisuele, de culturele als in de muzieksector. Lees meerSterke internationale aankoop Voor het publiek van VRT Canvas is internationale aankoop geen zwaktebod, maar net een aantrekkelijke propositie. Het merk selecteert het allerbeste aanbod uit de enorme wereldwijde zee aan content. VRT Canvas kiest steevast voor de meest relevante documentaires, fictie of humor die je als kijker moet gezien hebben. Kwaliteit is hier opnieuw de bepalende factor. Naast deze drie pijlers die essentieel zijn om de missie van VRT Canvas waar te maken en die inspelen op de toegenomen concurrentie op content, wil VRT Canvas ook inspelen op de toegenomen concurrentie op curatie. VRT Canvas blinkt uit in relevante, duurzame content. De programma’s van het merk blijven over een jaar even relevant. De VRT Canvas-kijker is een kijker die ook via vele andere internationale platformen kijkt en dus verwacht dat volledige seizoenen van programma’s niet-lineair worden aangeboden, dat er voldoende volume is zodat hij altijd iets kan vinden binnen zijn interesseveld. VRT Canvas is dus een voortrekker in het digitale kijken.Duik in het VRT Canvas aanbod op VRT MAXKijk nu opVRT MAXMeer weten? Lees ook deze artikelsCultuur'Een nacht in het museum': Thomas Vanderveken trakteert vier bekende gasten op een magische nacht in de mooiste musea van ons landProducties'Mobutu's game': een meeslepende reis naar macht, manipulatie en identiteit Nieuws & informatieMobutu's game: een politieke documentaire-thriller over de Congolese dictator Mobutu Sese Seko.Over VRTAangeraden door VRT Canvas: straffe verhalen met durfSport & ontspanning“Het is VRT’s plicht om een programma als ‘Drugs dus’ te maken” Sport & ontspanning'Drugs dus', een nuchtere kijk op geestverruimende shitProducties‘Godvergeten’ wint de FIAT/IFTA Archive Award in de categorie 'Excellence in Archive Production'Jongeren“VRT geeft kinderen een stem en een gezicht”Verken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
