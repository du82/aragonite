["https://vrt.be/nl/bezoek-vrt/haal-het-beste-uit-1-dag-bezoek-vrt-en-het-vlaams-parlement"]
title = "Haal het beste uit 1 dag: bezoek VRT én het Vlaams Parlement | VRT"
description = "Vanaf nu kan je een bezoek aan VRT combineren met een bezoek aan het Vlaams Parlement."
full_description = "Home/Bezoek VRT/Haal het beste uit 1 dag: bezoek VRT én het Vlaams ParlementHaal het beste uit 1 dag: bezoek VRT én het Vlaams ParlementVanaf nu kan je een bezoek aan VRT combineren met een bezoek aan het Vlaams Parlement.In de voormiddag ontdek je hoe we bij de openbare omroep radio, tv én online-content maken: je ziet de journaalstudio zoals je ‘m nog nooit zag, je ziet hoe live-radio wordt gemaakt en je ontdekt unieke verhalen achter de schermen. Alles wordt in goede banen geleid door onze professionele gidsen.'s Middags krijg je een unieke inkijk in de wandelgangen van het Vlaams Parlement. Onze gedreven gidsen nemen je mee op een boeiende tocht. Hier, in het hart van de Vlaamse democratie, leer je meer over de werking van het parlement. De deuren van de commissiezalen gaan voor je open. In de Koepelzaal zindert de laatste stemming misschien nog na. Er is zelfs een kans dat je een van de 124 volksvertegenwoordigers in de gangen kruist.Praktische infoTijdstipDeze gecombineerde rondleiding kan elke maandag en vrijdag geboekt worden voor groepen.Deze gecombineerde rondleiding kan elke 4e zaterdag van de maand geboekt worden door particulieren.De rondleiding op VRT start om 10.30u en duurt 1.5 uur.De rondleiding bij het Vlaams Parlement start om 13.30u.PrijsEen bezoek kost €15 per persoon. Scholen betalen een voordeeltarief van € 10 per deelnemer.Het bezoek aan het Vlaams Parlement is gratis.Opgelet: boek zeker voor het totaal aantal deelnemers, dus inclusief de begeleiders.Boeken kan enkel via de boekingstool en er dient onmiddellijk online betaald te worden. Terugbetaling is niet mogelijk. Extra infoEen groep bestaat uit minimum 12 personen en maximum 75 personen.Particuliere rondleidingen gaan door zodra zich 10 personen hebben ingeschreven.Op weekdagen kan je lunchen in het Bezoekerscentrum van het Vlaams Parlement. Contacteer ons op het nummer 02 552 46 11 voor meer informatie. Op zaterdag is lunchen in het Vlaams Parlement niet mogelijk. De rondleidingen zijn geschikt voor bezoekers vanaf 10 jaar.Per rondleiding kunnen we maximaal 3 rolstoelen toelaten. Voor uitzonderingen kan je contact opnemen met bedrijfsbezoeken@vrt.be of bezoekerscentrum@vlaamsparlement.beEen bedrijfsbezoek kan aangevraagd worden tot uiterlijk 4 weken voor de geplande datum.Boek je ticketsVeel gestelde vragenWat staat er op het programma?10.30 uur Start rondleiding bij VRT12.00 uur Einde rondleiding bij VRT13.00 uur Eigen lunch of broodjeslunch (op voorhand te bestellen) in het Vlaams Parlement13.30 uur Start rondleiding in Vlaams Parlement15.00 uur Einde rondleiding in Vlaams ParlementOp welke dagen kunnen we dit programma boeken?Scholen en groepen zijn welkom op maandag en vrijdag.Individuele bezoekers zijn welkom op de vierde zaterdag van de maand. Hoeveel kost een combi-ticket?Een bezoek aan het Vlaams Parlement is gratis. Op de website van VRT vind je de prijzen voor het bezoek aan VRT.Is VRT makkelijk bereikbaar met het openbaar vervoer?Ja, VRT is makkelijk bereikbaar met het openbaar vervoer.Een uitgebreide wegbeschrijving vindt u hier.Is het Vlaams Parlement makkelijk bereikbaar met het openbaar vervoer?Ja, het Vlaams Parlement is makkelijk bereikbaar met het openbaar vervoer. Het ligt op wandelafstand van het Centraal Station, Brussel.Kunnen we met het openbaar vervoer van VRT naar het Vlaams Parlement reizen?Ja, dat kan. MIVBHalte Meiserplein, bus 63 richting Centraal Station tot aan de halte Drukpers.Halte Opaal, bus 29 richting de Brouckère tot aan halte Drukpers.Raadpleeg de website voor de dienstregeling of download de app.De LijnHalte Schaarbeek, bus 358 Lebrun tot aan halte Sint-Joost-ten-Node Madou.Raadpleeg de website voor de dienstregeling of download de app.Kunnen we wandelen van de VRT naar het Vlaams Parlement?Ja dat kan. Een wandeling duurt 40 minuten. Voorzie voldoende tijd om te lunchen. Wij komen met de wagen, zijn er parkeerplaatsen aan VRT?Door de werken ter voorbereiding van ons nieuwe gebouw is het aantal parkeerplaatsen fel geslonken. Als je een rondleiding plant (of al gepland hebt) hou er dan rekening mee dat je misschien geen plaats vindt op het parkeerterrein van VRT.Komen jullie met de auto?Hou er rekening mee dat het aantal beschikbare plaatsen op de bezoekersparking al ingenomen kan zijn. Speel je liever op safe? Kom dan met het openbaar vervoer of parkeer je auto bv. aan Tour & Taxis en neem van daaruit het openbaar vervoer tot aan VRT.Neem je toch het berekende risico en probeer je nog een plaats te vinden op de bezoekersparking van VRT?Vertrek ruim op tijd en hou er zeker rekening mee dat onze rondleidingen stipt op tijd starten. Voor rondleidingen tijdens het weekend verwachten we geen parkeerproblemen.Wij komen met de wagen, zijn er parkeerplaatsen aan het Vlaams Parlement?De ondergrondse garage van het Vlaams Parlement is om veiligheidsredenen niet toegankelijk voor bezoekers. Maak gebruik van de garages in de buurt:Parking Spectrum, Korte Noordstraat 6, 1000 Brussel, op 300m van het Vlaams ParlementParking Wetstraat, Wetstraat 19, 1040 Brussel, op 500m van het Vlaams ParlementWij komen met de bus, zijn er parkeerplaatsen aan VRT?Dan is er normaalgezien geen probleem, er zijn een aantal parkeerplaatsen voor bussen op de bezoekersparking.Wij komen met de bus, zijn er parkeerplaatsen aan het Vlaams Parlement?Het is toegelaten om voor de deur van het Bezoekerscentrum op- en af te stappen. Parkeren kan helaas niet.Bussen mogen stilstaan en parkeren in de Leuvenseweg, ter hoogte van nummer 44. Er zijn drie plaatsen beschikbaar.Aan het Warandepark, tegenover het Koninklijk Paleis, zijn er ook parkeerplaatsen voor bussen. Nog meer opties vindt u hier.Kunnen we lunchen bij VRT?Neen, dat is helaas niet mogelijk.Kunnen we met de klas lunchen in het Vlaams Parlement?U en uw leerlingen zijn welkom in de Broodjeshoek. Dat is een ruime gezellige refter met vaste tafels en stoelen. Er zijn 72 zitplaatsen. Neem zelf uw broodtrommel mee, wij zorgen voor water, thee en koffie.Als u wil, kan u ook voor de hele klasgroep broodjes bestellen. Interesse in dit aanbod? Stuur een e-mail naar bezoekerscentrum@vlaamsparlement.be.Kunnen rolstoelgebruikers deelnemen aan het programma?Ja, dat kan.Om veiligheidsredenen is het aantal rolstoelgebruikers per gids beperkt tot drie. Zijn er toch meer rolstoelgebruikers, bekijken we graag wat er mogelijk is. Stuur in dat geval een bericht naar bedrijfsbezoeken@vrt.be en bezoekerscentrum@vlaamsparlement.be. Bekijk de andere VRT-rondleidingenBezoek VRTZin om op een fijne manier het leven achter de schermen van ons mediabedrijf te zien? Onze gidsen tonen jou de magie achter ons radio-, tv- en online-aanbod. Check snel hieronder voor alle info!Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
