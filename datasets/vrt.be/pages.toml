["https://vrt.be/nl/over-ons/nieuws-over-vrt/chloe-van-de-klantendienst-sven-de-leijer-mag-uitnodigen-wie-hij-zelf-wil"]
title = "Chloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’ | VRT"
description = "Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Chloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’27 november 2024Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 3.492 keer contact opgenomen met onze dienst. Verschillende mannen voelden zich de afgelopen weken betast in hun mannelijkheid. Een luisteraar van De Wereld Mannendag van Sofie op Radio 1 maakt zich druk over een vrouwelijke genderspecialist.“Wat een bullshit vertelt die allemaal. Gelieve mensen aan het woord te laten die er iets van af weten. Echte mannen, bijvoorbeeld.” Ja, tuurlijk. Alleen échte mannen weten àlles!Een kijker van het VRT 1-programma Hertoginnedal windt zich op over de “vooringenomenheid”” van documentairemaakster Tess Uytterhoeven. “Hoe kan zij als regisseur voeling hebben met ‘mannen’? Ik denk dat je precies weet wat ik daarmee bedoel!’ Nee, ik weet het eerlijk gezegd niet. En een kijker van Blokken heeft last met het nieuwe, vrouwelijke jurylid. “Hopelijk moet zij de man niet vervangen.” Ik zie de krantenkoppen al voor me: vrouw vervangt man! Woedende menigte verzamelt zich voor de bareel van de publieke omroep! Mannen, ze het hebben het toch zwaar, niet?HollandschepassieDaarom dat ik zo blij werd van dit bericht over de VRT 1-quiz Ik heb het u letterlijk juist gezegd. “In de trailer die deze week op VRT vertoond werd, zag ik een dame in lingerie. Deze dame was vroeger huishoudhulp en koos voor een vak als camdame. Deze dame is ook te vinden in seksfilms in de serie Hollandschepassie.” Gevolgd door een link naar een expliciete video op een website die mijn man in zijn favorieten heeft staan. (Ik heb het met m’n eigen ogen gezien, Michel!)De kijker maakt zijn klacht concreet: “Ik stel mij de vraag of het gepast is dat een openbare zender zich hiermee associeert of ermee samenwerkt.” Ik stel mij de vraag hoe snel je een camdame kan herkennen die de volle drie seconden in beeld is geweest. Dat klinkt haast als iemand die er graag mee uitpakt dat hij Vlaamse klassedames in een vingerknip herkent.De dame in lingeriekwestie kwam inderdaad heel even in beeld, wanneer presentator Sven de Leijer een grapje maakte met een van zijn gasten, Philippe Geubels. Maar in de passage schuilt geen structurele samenwerking. Sven de Leijer mag uitnodigen wie hij zelf wil. En ik denk dat mijn man al meer van deze vrouw heeft gezien, dan de gemiddelde VRT 1-kijker.Ik heb het over meer in duurtijd! Wie iets anders dacht, is een viezerik!Klagen bij een vriendinNog even terug naar Ben Crabbé en zijn Blokken, die als vanouds de gemoederen blijven beroeren. Een trouwe kijker schrijft: “Twintig jaar geleden deed ik reeds mijn beklag over het aanhoudend geschraap uit de keel van mijnheer Ben Crabbé. Ik kreeg als antwoord dat hij lichtjes verkouden was. Hij is er niet mee gestopt. Dit is wel een zeer lange verkoudheid.”Ik ben ontroerd van deze vorm van medeleven. Maar toen ik Ben onlangs tegenkwam op restaurant in Antwerpen, durfde ik het toch niet vragen. Sommige tv-iconen blijven zo groots, dat zelfs hun lengte niet kan inboeten tot mijn onder de indruk zijn. Ik wens je wel alle beterschap, Ben!Gelukkig vallen er regelmatig ook complimenten in onze mailbox. Een kijker van VRT Canvas looft de beslissing om opnieuw de volledige eindgeneriek bij films uit te zenden. Een veelgehoorde klacht die in een vorige column ook uitvoerig werd behandeld. Met andere woorden: VRT luistert. Of beter: klagen bij Chloë, is als klagen bij een vriendin!Oesters met gegratineerde pindasausVerder wil een luisteraar van Radio 1 een bloemetje smijten naar Ruth Joos. “Ik wil even laten weten dat ik haar werk - en dat van al haar collega’s - bij Voor de dag echt enorm waardeer. Ik kan niet goed uitleggen wat het hem nu doet, maar ik vind Voor de dag echt steengoede radio.” Voor de dag heet al meer dan een decennium De ochtend, maar toch. Proficiat Ruth en de redactie met de Chloë Complimenten Wisselbeker! Tot slot hekelt een kijker van Dagelijkse kost de sponsoring van een pindakaasmerk. “Jeroen, je ziet dat je sponsor een Hollander is! BAH!” Racisme is iets vies, maar ik ben zelf ook geen fan van pindakaas. Dankzij deze tussenkomst konden we op de valreep nog ‘Oesters met gegratineerde pindasaus’ schrappen voor uitzending.Chloë van de KlantendienstColumnChloë van de KlantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
