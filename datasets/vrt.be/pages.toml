["https://vrt.be/nl/over-ons/nieuws-over-vrt/klara-geeft-in-classical-queers-een-stem-aan-queer-personen-die-de-kunstwereld-kleurden"]
title = "Klara geeft in Classical Queers een stem aan queer personen die de kunstwereld kleurden | VRT"
description = """
Nieuwe Klara-podcast vanaf 29 april te beluisteren op VRT MAX
Maandag 29 april 2024&nbsp;– Voor veel mensen lijkt de kunstwereld vandaag een plek waar openheid en verdraagzaamheid vanzelfsprekend zijn. Dat is echter niet altijd het geval geweest, en zeker niet voor queer personen. Toch zijn er altijd queers geweest die de maatschappelijke normen trotseerden en conventies durfden uitdagen. Klara-presentator&nbsp;Johannes Wirix-Speetjens&nbsp;brengt deze queer kunstenaars tot leven in de nieuwe&nbsp;Klara-podcast&nbsp;Classical Queers.&nbsp;"""
full_description = "Home/Over ons/Nieuws over VRT/Klara geeft in Classical Queers een stem aan queer personen die de kunstwereld kleurden Klara geeft in Classical Queers een stem aan queer personen die de kunstwereld kleurden 08 mei 2024Nieuwe Klara-podcast vanaf 29 april te beluisteren op VRT MAX Maandag 29 april 2024 – Voor veel mensen lijkt de kunstwereld vandaag een plek waar openheid en verdraagzaamheid vanzelfsprekend zijn. Dat is echter niet altijd het geval geweest, en zeker niet voor queer personen. Toch zijn er altijd queers geweest die de maatschappelijke normen trotseerden en conventies durfden uitdagen. Klara-presentator Johannes Wirix-Speetjens brengt deze queer kunstenaars tot leven in de nieuwe Klara-podcast Classical Queers. De reeks gaat in 8 afleveringen dieper in op een vaak moeizaam emancipatieproces. Johannes ontrafelt op een boeiende manier het verband tussen persoonlijke ervaringen van queer kunstenaars en hun werk. Van de prachtige melodieën van Peter Tsjaikovski tot de revolutionaire composities van John Cage. Van Oscar Wilde tot Tom Lanoye, van Ethel Smyth tot Will Ferdy en van Jean-Baptiste Lully tot Freddie Mercury.''Als tiener voelde ik me als queer een alien, afkomstig van een andere planeet. Voor veel mensen lijken queer personen nog steeds uit een andere wereld te komen, terwijl ze van alle tijden zijn. Ik wil daarom weten hoe het zit met al die mensen voor mij, met wie ik geen bloed deel, maar wel een geschiedenis. Queer personen zijn geen ver-van-mijn-bed-show, voor niemand. Ze komen overal voor. Ze liggen op ons nachtkastje en bij ons in bed. Ze zitten in onze oren en staan voor onze neus. Al eeuwenlang. Zonder queer personen geen 'Zwanenmeer', geen 'I Want To Break Free' of 'Kartonnen Dozen'.'' Johannes Wirix-Speetjensqueer VRT-stemmen zoals Sam De Bruyn, Riadh Bahri en Karolien Debecker kruipen in de huid van artiesten als Marcel Proust, Ethel Smyth en Peter Tsjaikovski Voor deze podcast kropen queer VRT-stemmen zoals Sam De Bruyn, Riadh Bahri en Karolien Debecker in de huid van de kunstenaars. Ook Lidewij Nuitten, Ilse Liebens, David Van Ooteghem, Benjamien Schollaert, Xavier Taveirne, Wim De Vilder en Bart Verbeeck (Showbizz Bart) verleenden hun stem aan uiteenlopende persoonlijkheden als Oscar Wilde, prinses Palatine, Casanova of Alan Turing. Het verhaal is nog niet uitverteld Over deze indrukwekkende groep queer personen valt nog veel meer te vertellen. Daarom is sinds vandaag het gelijknamige boek, uitgegeven bij Borgerhoff & Lamberigts, ook verkrijgbaar. In dit werk toont Johannes dat het verleden kleurrijker is dan de verhalen die doorgaans vanuit een eerder heteroseksueel en mannelijk perspectief worden verteld. Hij reist door de eeuwen heen om de queer personen die hem hebben gevormd weer tot leven te brengen. Terwijl het boek nieuwe dimensies aan de verhalen toevoegt, worden de kunstenaars naar aanleiding van de komende Brussels Pride op 18 mei nog eens extra in de verf gezet met een speciale uitzending op Klara en VRT MAX. Tussen 10.00u en 12.00u brengen presentatoren Johannes Wirix-Speetjens & Mark Janssens Classical Queers Live op de radio. Over Johannes Wirix-Speetjens Johannes is als Belg opgegroeid in Haarlem en studeerde drama op het Conservatorium van Antwerpen. Hij is acteur, schrijver en radiomaker bij Klara. Door in Rome te hebben verbleven in het kader van een Erasmus-uitwisseling schrijft en speelt hij ook in het Italiaans. In januari 2020 won hij in Rome de tweede prijs van de Premio Internazionale Lydia Biondi 2019 voor het schrijven en interpreteren van zijn monoloog 'Sono tutti loro'. Deze monoloog bracht hij in 2021 op het theaterfestival voor jonge makers Dominio Pubblico in het Teatro India in Rome. De tekst van zijn eerste voorstelling 'Zonderlingen' werd gepubliceerd bij De Nieuwe Toneelbibliotheek en werd geselecteerd voor Het Theaterfestival. Johannes was ook te zien in voorstellingen van Ontroerend Goed en is vaste gast bij Het Nationale Theater waarin hij te zien was in 'De Eeuw Van Mijn Moeder' en 'Leedvermaak Trilogie' van Eric De Vroedt. In 2023 maakte Johannes zijn filmdebuut op het 80e filmfestival van Venetië. Hij vertolkte een van de hoofdrollen in de openingsfilm 'Comandante' van Edoardo De Angelis en Sandro Veronesi. Daarin spelen ook Johan Heldenbergh en Pierfrancesco Favino mee. Korte inhoud De Klara-podcast Classical Queers neemt de luisteraar mee op een historische verkenning van queerpersonen in kunst en muziek, verdeeld over 8 afleveringen.Classical Queers, vanaf nu te beluisteren op VRT MAX.Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
