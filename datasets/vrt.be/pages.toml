["https://vrt.be/nl/info/privacy"]
title = "Mijn Privacy | VRT"
description = "Bij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig."
full_description = "Home/Mijn PrivacyMijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. Jouw privacy staat centraalDe beste kijk-, luister-, en surfervaringenRelevantieWil je een online programma bekijken, deelnemen aan een wedstrijd of nieuwsbrieven ontvangen? We hebben je gegevens nodig om je die diensten te verlenen. We gebruiken je gegevens ook om ons aanbod te verbeteren.Zonder zaken te verzwijgenTransparantieWe willen open communiceren over wat we met je gegevens doen. We houden je transparant en tijdig op de hoogte van welke gegevens wij precies verzamelen en waarvoor wij ze gebruiken.In een veilige omgevingVeiligheidDe veiligheid van je persoonlijke informatie is belangrijk voor ons. We bewaren je gegevens in een veilige omgeving en werken enkel samen met bedrijven die ons voldoende garanties geven voor de beveiliging van je gegevens.Onder jouw toeziend oogControleJij bent overal en altijd baas over je gegevens. Je kan je persoonlijke informatie inkijken, verbeteren en zo nodig verwijderen.VideoWe vertellen je hoe we jouw gegevens verzamelen en waarom we dat doen. VideoWat zijn cookies eigenlijk en hoe worden ze gebruikt door VRT? Beheer je VRT-profielVRT-privacybeleidHallo! Wij vinden het belangrijk dat jij overal en altijd onze diensten kan gebruiken om de beste VRT-content te bekijken, beluisteren, lezen of beleven. Daarnaast verlenen we je graag gepersonaliseerde en interactieve diensten op maat. Om dat te kunnen doen, willen we bepaalde gegevens van jou verzamelen en gebruiken. We leggen je hier uit welke gegevens we precies nodig hebben en wat wij ermee doen.Privacybeleid bij opnamesHallo! Wanneer je wilt meewerken of deelnemen aan een programma of opnames in het kader van een evenement, project of wedstrijd van VRT, hebben we bepaalde gegevens van jou nodig. We leggen je hier uit welke gegevens we precies van jou verzamelen en gebruiken, en wat wij ermee doen.VRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.Andere vragenHeb je toch nog een andere vraag?De VRT-klantendienst staat altijd tot je dienst!Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
