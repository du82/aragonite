full_description = "Home/Bezoek VRT/VRT NWS rondleidingVRT NWS rondleidingTijdens de VRT NWS-rondleiding loop je letterlijk rond tussen de journalisten. De gids neemt je onder andere mee voor een unieke blik achter de schermen in de journaalstudio en de regiekamer. Daarnaast ontdekt u tijdens de rondleiding hoe VRT NWS werkt en volgt u het hele proces dat schuilgaat achter het maken van nieuws in al zijn vormen (voor radio, televisie en online).Praktische infoTijdstipDe vrtnws-rondleidingen vinden plaats op donderdag om 10.00 uur. Een geleid bezoek aan VRT duurt 1,5 uur.PrijsEen bezoek kost €120 voor de gids + een prijs per persoon afhankelijk van het type bezoek (scholen= 4 € p.p., verenigingen = 9 € p.p. en bedrijven = 18 € p.p.). Boeken kan enkel via het systeem en er dient onmiddellijk online betaald te worden. Terugbetaling is niet mogelijk. Extra infoEen groep bestaat uit minimum 12 personen en maximum 30 personen. De rondleidingen zijn geschikt voor bezoekers vanaf 10 jaar.Per rondleiding kunnen we maximaal 3 rolstoelen toelaten. Voor uitzonderingen neem contact op met bedrijfsbezoeken@vrt.be.Een bedrijfsbezoek kan aangevraagd worden tot uiterlijk 4 weken voor de geplande datum.De studio van Het journaal is niet toegankelijk op vrijdagnamiddag, de Ketnetstudio niet op dinsdag.Boek nuBezoek VRTZin om op een fijne manier het leven achter de schermen van ons mediabedrijf te zien? Onze gidsen tonen jou de magie achter ons radio-, tv- en online-aanbod. Check snel hieronder voor alle info!Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
