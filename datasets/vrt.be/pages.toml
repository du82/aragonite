title = "Toezicht en transparantie | VRT"
description = "VRT wil een transparante en open organisatie zijn. Zij vindt het belangrijk en is het ook verplicht om zich ten aanzien van de Vlaamse Gemeenschap te verantwoorden over wat ze met haar middelen (die voor net iets meer dan de helft uit een overheidsdotatie bestaan) doet."
full_description = "Home/Over ons/Onze opdracht/Toezicht en transparantieToezicht en transparantieVRT wil een transparante en open organisatie zijn. Zij vindt het belangrijk en is het ook verplicht om zich ten aanzien van de Vlaamse Gemeenschap te verantwoorden over wat ze met haar middelen (die voor net iets meer dan de helft uit een overheidsdotatie bestaan) doet. Open en transparante organisatie VRT wil een transparante en open organisatie zijn. Zij vindt het belangrijk en is het ook verplicht om zich ten aanzien van de Vlaamse Gemeenschap te verantwoorden over wat ze met haar middelen (die voor net iets meer dan de helft uit een overheidsdotatie bestaan) doet. Daarom geeft de publieke omroep in principe alle informatie vrij die van hem gevraagd wordt. Tegelijk wenst VRT erop te wijzen dat zij als naamloze vennootschap van publiek recht echter niet alle informatie over haar werking publiek kan maken. Zij moet immers functioneren in een concurrentiële omgeving en kan dus geen gedetailleerde informatie vrijgeven als die haar wezenlijke belangen zou schaden. Dat betekent echter geen vrijgeleide voor het VRT-management. VRT wordt gecontroleerd door verschillende controleorganen op verschillende niveaus. Alle financiële informatie die VRT kan en mag vrijgeven doet zij via haar jaarverslag (zoals kostprijs van de netten, voorraad sport- en filmrechten, en de middelen voor de onafhankelijke producenten). De diverse controleorganen (zoals de Vlaamse Regulator voor de Media, de externe revisor, etc.) bieden aan de Vlaamse Gemeenschap en aan de Vlamingen de garantie dat de VRT handelt in het belang van de goede uitvoering van haar openbare opdracht en conform alle wettelijke bepalingen.VRT moet aan elk controleorgaan de meest ruime informatie geven die dat orgaan nodig heeft om zijn toezicht optimaal te kunnen uitvoeren. De leidende principes van het toezicht zijn vastgelegd in o.a. het Mediadecreet en het Charter Deugdelijk Bestuur van de VRT. De controleorganen brengen, naargelang hun eigenheid en hun opdracht verslag uit over hun bevindingen aan het Auditcomité van VRT, de raad van bestuur, de Vlaamse Regering en het Vlaams Parlement. CommunicatiebeleidVRT communiceert open en transparant over haar programma’s, de diensten die ze verleent en het beleid dat ze hanteert. Dat doet ze op een doordachte en betrouwbare manier op maat van de mediagebruikers, de beleidsmakers, de pers, haar medewerkers en andere belangengroepen. Informatie aan toezichts- en controleorganenVRT geeft elk controleorgaan de meest ruime informatie die dat orgaan nodig heeft om zijn toezicht te kunnen uitvoeren.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
