["https://vrt.be/nl/info/klokkenluidersregeling"]
title = "Klokkenluidersregeling | VRT"
description = "Het Bestuursdecreet van 7 december 2018 voorziet in een procedure voor de melding van inbreuken en de bescherming van melders, gebaseerd op de Europese klokkenluidersrichtlijn. Hier lees je hoe je inbreuken kunt melden en onder welke voorwaarden je als melder bescherming tegen represailles kunt krijgen."
full_description = "Home/KlokkenluidersregelingKlokkenluidersregelingHet Bestuursdecreet van 7 december 2018 voorziet in een procedure voor de melding van inbreuken en de bescherming van melders, gebaseerd op de Europese klokkenluidersrichtlijn. Hier lees je hoe je inbreuken kunt melden en onder welke voorwaarden je als melder bescherming tegen represailles kunt krijgen.Deze publiekstekst geeft algemene informatie over de klokkenluidersregeling en is zo nauwkeurig mogelijk opgesteld, maar behandelt niet alle nuances van het Bestuursdecreet. Voor de precieze bepalingen van de klokkenluidersregeling verwijzen we je naar dat decreet.Welke meldingen?Je kunt een melding over inbreuken doen, gebaseerd op informatie die je vanwege je werkrelatie met VRT hebt verkregen.Een inbreuk is een handeling of nalatigheid die onrechtmatig is of de wetgeving schendt. Je kunt feitelijke of mogelijke inbreuken melden, maar ook pogingen tot het verhullen van inbreuken.Integriteitskwesties of conflicten tussen personen waarin geen wetten worden overtreden, vallen niet onder de klokkenluidersregeling. Dat geldt ook voor klachten over het aanbod van VRT. Daarmee kun je terecht bij de klantendienst van VRT.Wie kan een inbreuk melden?Iedereen die in het kader van een werkrelatie informatie over inbreuken heeft verkregen, kan een melding maken. Het gaat dus om personen die in het kader van hun werk met VRT in contact komen of gekomen zijn, zoals huidige en voormalige personeelsleden, sollicitanten, stagiairs, consultants en leveranciers.Een melding kun je al of niet anoniem maken. Je kunt ook getuigen opgeven en je door derden laten bijstaan.Waar kun je een inbreuk melden?Er zijn veilige meldingskanalen binnen en buiten VRT.De interne meldingskanalen voor VRT zijn Ruud Hendrickx (adviseur zakelijke integriteit), Nico Janssens (hoofd welzijn) en Audit Vlaanderen. Het externe meldingskanaal is de Vlaamse Ombudsdienst, die onafhankelijk van de Vlaamse overheid werkt.Als melder gebruik je bij voorkeur een intern kanaal, als de inbreuk op een doeltreffende manier intern behandeld kan worden en er geen risico op represailles bestaat. Elk kanaal behandelt een melding strikt neutraal en onafhankelijk.Je kunt de informatie ook openbaar bekendmaken, maar je geniet dan alleen onder strikte voorwaarden bescherming tegen represailles of sancties. Gebruik daarom zo veel mogelijk de interne meldingskanalen.Bij Ruud Hendrickx en Nico Janssens kun je ook terecht voor vertrouwelijk advies als je overweegt een melding te maken.Welke bescherming geniet je?Bij elk meldingskanaal kun je kiezen of je je naam bekendmaakt of niet. Maak je je naam bekend, dan wordt je identiteit beschermd.Elk meldingskanaal gebruikt systemen die de vertrouwelijkheid beschermen van je eigen identiteit, de identiteit van anderen die in de melding genoemd worden (zoals betrokkenen, getuigen, derden) en de informatie waaruit je identiteit of die van anderen kan blijken. De informatie is alleen toegankelijk voor de meldingsbehandelaars bij VRT en de medewerkers van Audit Vlaanderen, die je melding ook vertrouwelijk moeten behandelen.Als melder ben je beschermd tegen represailles. Denk daarbij aan negatieve maatregelen die je zouden worden opgelegd als gevolg van je melding. Ook getuigen en personen die je bij het melden hebben bijgestaan, genieten bescherming als zij het slachtoffer van represailles worden. Er geldt omkering van bewijslast wanneer je als melder het slachtoffer van represailles wordt en je melding voldeed aan de voorwaarden van het Bestuursdecreet.Als je informatie openbaar bekendmaakt, geniet je alleen bescherming als je de inbreuk eerst intern of extern gemeld hebt en er geen passende maatregelen genomen zijn binnen drie maanden nadat je melding ontvangen was. Je bent ook beschermd als de gemelde inbreuk een dreigend of reëel gevaar voor het algemene belang vormt of als er bij externe melding risico bestaat op represailles of een inadequate behandeling van de inbreuk.Als melder moet je redelijke gronden hebben om aan te nemen dat wat je meldt juist is, op basis van de informatie waarover je op het moment van de melding beschikt. Meld je opzettelijk of bewust onjuiste of misleidende informatie, dan geniet je geen bescherming en riskeer je een sanctie.Hoe maak je een melding?Je kunt je melding schriftelijk, telefonisch of fysiek richten aan Ruud Hendrickx, Nico Janssens of Audit Vlaanderen. Elke melding aan de meldingskanalen bij VRT wordt ook bezorgd aan Audit Vlaanderen, die kan beslissen dat zij de behandeling van je melding overnemen. Informatie over het rechtstreeks melden van inbreuken bij Audit Vlaanderen vind je hier.Als je je melding per brief wilt versturen, dan vermeld je duidelijk zichtbaar ‘vertrouwelijk’ op de envelop. De brief stuur je naar Meldpunt Klokkenluiders VRT Kamer 9L19 Auguste Reyerslaan 52 1043 BrusselEen e-mail richt je aan klokkenluiden@vrt.be.Je kunt ook telefonisch een melding doen op het nummer 0479 74 11 02 (Ruud Hendrickx) of 0477 18 43 84 (Nico Janssens). Als je ermee instemt, kan het gesprek opgenomen worden of kan er een verslag opgemaakt worden. Je hebt de kans om het verslag te controleren, te corrigeren en voor akkoord te ondertekenen.Je hebt ook het recht om binnen een redelijke termijn een afspraak te krijgen voor een fysieke ontmoeting om je melding te bespreken. Ook in dit geval kan het gesprek met jouw toestemming opgenomen worden of kan er een verslag opgemaakt worden.Heb je al een interne melding gedaan óf meen je dat de inbreuk bij een interne melding niet doeltreffend behandeld kan worden of dat er een risico op represailles bestaat, dan kun je (al of niet anoniem) een melding maken bij de Vlaamse Ombudsdienst.Per post: Leuvenseweg 86, 1000 BrusselPer e-mail: klokkenluiden@vlaamseombudsdienst.beTelefonisch: 02 552 48 48Voor ondersteuning bij het melden van een inbreuk aan de Vlaamse Ombudsdienst kun je, als je dat wilt, terecht bij Isabelle Oyen (isabelle.oyen@vrt.be, 0479 97 17 11).​​​​​​​De Vlaamse Ombudsdienst kan beslissen om je melding niet in behandeling te nemen als de inbreuk van geringe betekenis is of als de melding betrekking heeft op feiten die in een eerdere melding van jou als melder al zijn behandeld en de nieuwe melding geen nieuwe informatie van betekenis bevat.Wat gebeurt er met je melding?Binnen zeven dagen na de dag waarop het meldingskanaal je melding heeft ontvangen en geregistreerd, krijg je een ontvangstmelding, tenzij de melding intussen al afgehandeld is of wanneer je identiteit niet meer beschermd zou zijn door het krijgen van een ontvangstmelding. Je kunt in je melding ook aangeven dat je geen ontvangstmelding wilt krijgen.Het meldingskanaal slaat de volgende gegevens op: de naam, contactgegevens en functie van de melder, de naam en functie van de betrokkene, de inbreuk door de betrokkene, de naam van getuigen, de schriftelijke meldingen en de opname of het schriftelijke verslag van de mondelinge meldingen. Ook de naam van eventuele derden wordt bijgehouden als ook zij het slachtoffer van represailles kunnen worden.Het meldingskanaal onderzoekt de informatie die je hebt verstrekt. Als er een inbreuk wordt vastgesteld, worden er ook maatregelen genomen.Binnen een redelijke termijn krijg je informatie over wat er met je melding gebeurd is. Die termijn bedraagt drie maanden als je een ontvangstmelding hebt gekregen en drie maanden en zeven dagen als er geen ontvangstmelding verstuurd is. Je verneemt welke maatregelen genomen zijn of genomen zullen worden en de redenen daarvoor.De Vlaamse Ombudsdienst heeft maximaal zes maanden om te reageren op je melding.Welke rechten heb je als betrokkene?De persoon over wie de melding gaat (de ‘betrokkene’), heeft recht op geheimhouding van diens identiteit, op een doeltreffende voorziening in rechte en een eerlijk proces, en geniet het vermoeden van onschuld en het recht van verdediging (het recht om gehoord te worden en op toegang tot het dossier).Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
