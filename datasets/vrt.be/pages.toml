["https://vrt.be/nl/info/wedstrijdreglement"]
title = "Wedstrijdreglement | VRT"
description = "Dit wedstrijdreglement bepaalt de algemene regels met betrekking tot de deelnemingsvoorwaarden voor alle wedstrijden die VRT organiseert via haar websites, andere onlinekanalen (zoals YouTube, Facebook, Twitter) of op een andere wijze."
full_description = "Home/WedstrijdreglementWedstrijdreglementDit wedstrijdreglement bepaalt de algemene regels met betrekking tot de deelnemingsvoorwaarden voor alle wedstrijden die VRT organiseert via haar websites, andere onlinekanalen (zoals YouTube, Facebook, Twitter) of op een andere wijze.Als er bij een wedstrijd specifieke voorwaarden van toepassing zijn, dan wordt er bijkomend een bijzonder wedstrijdreglement opgemaakt voor die wedstrijd. De bepalingen van een bijzonder wedstrijdreglement hebben voorrang op andersluidende bepalingen van dit algemene wedstrijdreglement.Algemeen wedstrijdreglementAlgemeen wedstrijdreglement.pdfpdf367 KBWoon een opname bijAltijd al eens in de studio willen zitten tijdens de opname van een show? Schrijf je nu in en we reserveren een zitje speciaal voor jou!Reserveer je zitjeWin win winBij VRT loopt er altijd wel een leuke actie of wedstrijd. Kijk hoe je kan deelnemen en veel succes gewenst! Ik doe meeKom eens op bezoekZin om eens langs te komen bij VRT? Je kan een rondleiding boeken door de studio's, inclusief een bezoekje aan onze beroemde toren. Boek een rondleidingVRT-privacybeleidHallo! Wij vinden het belangrijk dat jij overal en altijd onze diensten kan gebruiken om de beste VRT-content te bekijken, beluisteren, lezen of beleven. Daarnaast verlenen we je graag gepersonaliseerde en interactieve diensten op maat. Om dat te kunnen doen, willen we bepaalde gegevens van jou verzamelen en gebruiken. We leggen je hier uit welke gegevens we precies nodig hebben en wat wij ermee doen.Mijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. VRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
