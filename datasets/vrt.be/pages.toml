full_description = "Home/Ons aanbodOns aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.VRT MAXVRT NWSSporzaKetnetVRT 1VRT CanvasDe TijdlozeKlaraMNMRadio 1Radio2Radio BeneStudio BrusselToegankelijkheid van ons aanbodVRT wil zo toegankelijk mogelijk zijn voor alle Vlamingen en onderneemt daarom stappen in overleg met de betrokken belangenorganisaties.Lees meer over toegankelijkheidRadio luisterenVRT heeft een online radiospeler: VRT MAX. Via VRT MAX kunnen luisteraars hun favoriete VRT-radionetten live en uitgesteld beluisteren, zowel via hun computer en tablet als via hun smartphone. Het radioaanbod is te ontvangen met een gewoon radiotoestel met FM-antenne. De frequenties van de VRT-radionetten vind je hier. VRT zorgt er ook voor dat je radio kan luisteren via de belangrijkste streamingsdiensten.Ontdek ookEDUboxEDUbox is een educatief concept van VRT NWS om jongeren uit het secundair onderwijs te laten kennismaken met een bepaald maatschappelijk thema. EDUbox wil jongeren informeren en hen stimuleren om zelf aan de slag te gaan.VRT Lees meeOntdek het uitgebreide boekenaanbod op VRT.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
