title = "De Tijdloze | VRT"
description = "Het digitale radiostation De Tijdloze brengt de beste, tijdloze muziek van de afgelopen zestig jaar. Te beluisteren via DAB+ en online via VRT MAX."
full_description = "Home/Ons aanbod/De TijdlozeDe TijdlozeHet digitale radiostation De Tijdloze brengt de beste, tijdloze muziek van de afgelopen zestig jaar. Te beluisteren via DAB+ en online via VRT MAX.Sinds 1 november 2022 geniet je altijd en overal van de beste, tijdloze muziek op het digitale radiostation De Tijdloze, te beluisteren via DAB+ en online via VRT MAX. Vertrouwde stemmen gidsen je doorheen zestig jaar popmuziek die ‘niet kapot te krijgen’ is. Sofie Engelen presenteert dagelijks Jouw Tijdloze ochtendradio en Stijn Van de Voorde loodst je door de avondfile. Er zijn specifieke muziekprogramma’s als Easy like Sunday morning, De Tijdloze Dansant en De Tijdloze Jaren 90. Op de laatste dag van het jaar hoor je traditiegetrouw De Tijdloze 100, de langstlopende en meest gereputeerde eindejaarslijst van Vlaanderen met de honderd beste platen aller tijden. Daarnaast is De Tijdloze ook VRT-breed een sterk multimediaal merk met onder andere een reeks televisieprogramma’s op VRT Canvas.Geniet nu van De TijdlozeLuister nu live opVRT MAXDuik in het Tijdloze aanbod op VRT MAXLuister live opVRT MAXMuziek'Black' van Pearl Jam opnieuw op nummer 1 in De tijdloze 100Verken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
