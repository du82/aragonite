["https://vrt.be/nl/over-ons/nieuws-over-vrt/wetenschap-overal-vrt-viert-mee-600-jaar-ku-leuven"]
title = "Wetenschap is overal: VRT viert mee 600 jaar KU Leuven | VRT"
description = "Wetenschap is overal, ook bij VRT. De komende jaren wil VRT nog meer inzetten op wetenschap. Dat doen we via verschillende programma's, evenementen en zoveel meer. Het officiële startschot wordt gegeven op 15 en 16 februari, want dan viert VRT mee het 600-jarig bestaan van KU Leuven. Jacotte Brokken zet mee haar schouders onder de campagne. Ze is niet alleen de weervrouw van VRT, maar ook een wetenschapster in hart en nieren. Als gezicht van de campagne is ze dan ook enorm blij dat VRT&nbsp;​ wetenschap extra in de kijker wil zetten.&nbsp;"
full_description = '''Home/Over ons/Nieuws over VRT/Wetenschap is overal: VRT viert mee 600 jaar KU LeuvenWetenschap is overal: VRT viert mee 600 jaar KU Leuven 07 februari 2025Wetenschap is overal, ook bij VRT. De komende jaren wil VRT nog meer inzetten op wetenschap. Dat doen we via verschillende programma's, evenementen en zoveel meer. Het officiële startschot wordt gegeven op 15 en 16 februari, want dan viert VRT mee het 600-jarig bestaan van KU Leuven. Jacotte Brokken zet mee haar schouders onder de campagne. Ze is niet alleen de weervrouw van VRT, maar ook een wetenschapster in hart en nieren. Als gezicht van de campagne is ze dan ook enorm blij dat VRT ​ wetenschap extra in de kijker wil zetten. Jacotte Brokken: "Wetenschap is van enorm belang. Om ziektes te genezen, om het klimaatprobleem op te lossen, enzoverder. Maar voor veel mensen is wetenschap nog iets onbekends, iets aartsmoeilijks lijkt het wel. Daarom ben ik heel blij dat we met de campagne Wetenschap is Overal vooral ook de fun van wetenschap laten zien. Er is niets zo leuk als nieuwsgierig op zoek gaan naar antwoorden. En ik kijk er al enorm naar uit om dat samen met jullie te doen op 15 en 16 februari in Leuven. "Karen Donders, directeur publieke opdracht, talent en organisatie: “Als publieke omroep wil VRT iedere mediagebruiker informeren en inspireren. En zeker over wetenschap! Wetenschap is alom tegenwoordig, wetenschap is overal. Het is onze ambitie om jong en oud mee te nemen in het verhaal van wetenschap. Daarmee beginnen we in Leuven en van daar gaan we verder doorheen het land en tal van wetenschappelijke disciplines.” KU Leuven bestaat 600 jaar In het weekend van 15 en 16 februari viert KU Leuven haar 600ste verjaardag en VRT viert mee. Dat doen we met live radio vanuit een radiocontainer en een speurtocht voor het hele gezin langs de verschillende campussen van KU Leuven. ​ VideoLuc Sels, rector KU Leuven: "Wetenschap heeft meer impact als ze gedeeld wordt. Bij KU Leuven maken we onze kennis en expertise toegankelijk en zetten we in op brede wetenschapscommunicatie. VRT is daarin een belangrijke partner: met sterke duiding en inspirerende verhalen brengt de publieke omroep wetenschap tot bij iedereen. Onze samenwerking tijdens dit feestweekend onderstreept die gedeelde ambitie. Samen prikkelen we nieuwsgierigheid, versterken we het maatschappelijk debat, inspireren we kritische geesten en bouwen we aan een toekomst waarin wetenschap en vertrouwen hand in hand gaan."Vanop het Hooverplein in Leuven, vlakbij de prachtige universiteitsbibliotheek zullen Klara, Radio 1, MNM en Radio2 er vanuit een glazen huis radio maken. ​ Live radio op zaterdag 15 februari: 10:00 – 12:00: Klara met De liefhebber met Katelijne Boon. Gast is Leen Decin, astrofysicus en hoogleraar sterrenkunde aan KU Leuven. ​ ​ 12:00 – 13:00: Radio 1 met Voorproevers met Annemie Peeters ​ Annemie Peeters ontvangt 3 alumni van de alma mater: Klaas Delrue en Geert Noppe van Yevgueni en de vader van Klaas, Dries Delrue. De drie gasten studeerden pedagogie. Annemie heeft het met hen over de evolutie van de universiteit en de opleidingen. Met Dries Delrue heeft Annemie het ook over Mei '68, de woelige jaren van KU Leuven. Yevgueni ontstond ook, exact 25 jaar geleden, aan de KU Leuven. De band won toen het Interfacultair Songfestival.13:00 – 16:00: MNM Weekend met Fabian Hermans Live radio op zondag 16 februari: ​ 13:00 – 16:00: Radio2 Weekend met Caren Meynen Wetenschap is overal-speurtochtGa zelf op pad als wetenschapper! Weervrouw Jacotte Brokken stippelde een speurtocht uit door Leuven langs de verschillende campussen. Zo kan je onder andere in het museum voor dierkunde op zoek naar het grootste zoogdier ter wereld. Op campus Arenberg kan je het geluid van de zon horen. En in Gasthuisberg kan je leren hoe je levens moet redden. Dat en nog meer leuke ontdekkingen op zaterdag en zondag van 10 tot 16 uur. Jacotte geeft bij iedere vraag via een leuk filmpje uitleg bij het antwoord. ​ Voor wie er niet kan bij zijn, kan de vragen beantwoorden op de VRTMAX-pagina van Ketnet. Alle vragen en antwoorden van Jacotte zijn ook te bekijken op de homepagina vrtmax.be/wetenschapisoveral VRT InnovatieOp zaterdag en zondag van 10 tot 16 uur: Ook VRT zet in op innovatie. Via verschillende activatiestands kan je kennismaken met innovatieve projecten van VRT.AI fake of niet: Van AI of artificiële intelligentie heb je wel al eens gehoord. Je kan dankzij de nieuwste technologie letterlijk alles creëren. Soms is iets dat niet echt is, zo goed gemaakt dat het wel echt lijkt te bestaan. Kan jij zien wat echt is, en wat volledig nagemaakt en dus fake is? ​ Spel je naam in gebarentaal: Mensen die niet goed horen kunnen via gebarentaal toch communiceren met hun omgeving. Wist je trouwens dat ze in andere landen een andere gebarentaal spreken, net zoals ze Frans in Frankrijk praten of Duits in Duitsland? Hier kan je jouw naam leren in Vlaamse Gebarentaal. ​ Ontdek het weerbericht van je verjaardag of geboortedag: Meestal zijn we benieuwd naar het weer dat nog moet komen en wordt het weer voorspeld. Maar hier kan je terug in de tijd om te zien wat voor weer het was toen jij geboren werd. Sneeuw, storm of tropische temperaturen, ontdek het allereerste weerbericht van jouw leven. #LikeMe in Roblox: Stap binnen in de virtuele wereld van Mia en haar vrienden van #LikeMe. Verken bekende plekken zoals het SAK en het hotel van Mia’s ouders in deze interactieve game binnen Roblox. Wil je meer spelen? Ontdek nog meer games van Ketnet op VRT MAX.Wetenschap is overal, ook op VRT MAXOntdek alles over wetenschap op VRT MAXDit moet je zeker ook lezenEducatie | InnovatieNeem een kijkje achter de knoppen in de studio van Knappe koppenEducatie | Jongeren'De campus cup' komt terug!EducatieEDUbox Burgerschap: Van kleine acties tot politiek engagementEducatie | JongerenGloria Monserez neemt afscheid als Ketnet-wrapperJongeren | EducatieSamen studeren op relaxe lofi-beats in Bar Madam? Dat kan!EducatieVRT en Smartschool slaan handen in elkaar EducatieHet EDUbox-aanbod voor first time voters: kieswijsheid in een educatief jasje Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'''
