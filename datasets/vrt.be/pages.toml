["https://vrt.be/nl/over-ons/nieuws-over-vrt/de-twintigers-dit-zijn-de-grote-namen-van-morgen"]
title = "De Twintigers: dit zijn de grote namen van morgen | VRT"
description = """
Klara presenteert jonge talenten in vierde editie van De Twintigers
Maandag 12 februari 2024 – Met veel trots stelt Klara opnieuw tien jonge muzikanten voor in&nbsp;De Twintigers 2024. Het is ondertussen al de vierde editie en ook nu is het duidelijk: Vlaanderen bruist van het talent. Ontdek de toekomst van de klassieke muziek, jazz en global."""
full_description = "Home/Over ons/Nieuws over VRT/De Twintigers: dit zijn de grote namen van morgenDe Twintigers: dit zijn de grote namen van morgen12 februari 2024Klara presenteert jonge talenten in vierde editie van De Twintigers Maandag 12 februari 2024 – Met veel trots stelt Klara opnieuw tien jonge muzikanten voor in De Twintigers 2024. Het is ondertussen al de vierde editie en ook nu is het duidelijk: Vlaanderen bruist van het talent. Ontdek de toekomst van de klassieke muziek, jazz en global.De tien veelbelovende muzikanten zijn tussen 20 en 29 jaar. Met concerten of opnames lieten ze zich al opmerken, maar echt doorgebroken zijn ze nog niet. Daar wil Klara verandering in brengen door hun carrière een flinke duw in de rug te geven. Want het talent, de persoonlijkheid en het potentieel zijn er. Enkele weken geleden bracht Klara de artiesten samen in de Brusselse Jet Studio, de oudste muziekstudio van ons land. Daar waar ooit de Rolling Stones, Edith Piaf en Charles Trenet hun albums opnamen, ontmoeten De Twintigers elkaar nu voor het eerst. Ze praten er over hun successen en passie, twijfels en onzekerheden. Op en naast het podium. Ontdek wie deze nieuwe lichting muzikanten is, vanaf vandaag op VRT MAX.Klara biedt groot podium Tien weken lang staat telkens één Twintiger centraal op Klara. Van maandag 19 februari tot vrijdag 10 mei, behalve tijdens de paasvakantie. Online ​De video’s met de tien jonge talenten in de Jet Studio zijn vanaf nu exclusief te zien op VRT MAX. ​Iedere maandag vind je op VRT MAX ook, in beeld, de hoogtepunten van het concert dat de Twintiger van die week geeft in de legendarische VRT-studio Toots. Dan ontdek je ook welke andere muzikanten mee op het podium staan. Espresso, op maandag tussen 6 en 9 uur ​Sta elke maandagochtend mee op met De Twintigers. Hoe begint deze jonge lichting muzikanten aan de dag? Wie heeft een ochtendhumeur en wie is de vroege vogel? Komt de muzikale inspiratie al bij het ontbijt, of is er eerst een sloot koffie nodig voor ze hun instrument ter hand nemen? Music Matters, van maandag tot donderdag tussen 12 en 14 uur ​Cara Van der Auwera en Olav Grondelaers vragen de jonge muzikanten naar hun sleutelwerk. Welk muziekstuk is bepalend geweest in hun leven en waarom? Laat je boeien door de muziek en het verhaal erachter. De Twintigers, op vrijdag tussen 12 en 14 uur ​Op vrijdag geniet je van een uniek concert van de Twintiger van de week, opgenomen in Studio Toots. Klara-presentator Carlo Siau, zelf in zijn twintiger jaren, gaat op zoek naar de mens achter de muziek. De Twintigers van Klara, editie 2024 Alexander Declercq, piano/klarinet – klassiek ​Vanaf maandag 19 februari op Klara. Het concert hoor je in De Twintigers op vrijdag 23 februari. Veronique De Raedemaeker, viool – klassiek ​Vanaf maandag 26 februari op Klara. Het concert hoor je in De Twintigers op vrijdag 1 maart. Suzan Peeters, accordeon – electronics ​Vanaf maandag 4 maart op Klara. Het concert hoor je in De Twintigers op vrijdag 8 maart. Gert-Jan Dreessen, drums – jazz ​Vanaf maandag 11 maart op Klara. Het concert hoor je in De Twintigers op vrijdag 15 maart. Fleur Strijbos, sopraan – klassiek ​Vanaf maandag 18 maart op Klara. Het concert hoor je in De Twintigers op vrijdag 22 maart. Adia Vanheerentals, sax – jazz ​Vanaf maandag 25 maart op Klara. Het concert hoor je in De Twintigers op vrijdag 29 maart. Nina Vanhoenacker, cello – hedendaags ​Vanaf maandag 15 april op Klara. Het concert hoor je in De Twintigers op vrijdag 19 april. Sterre Decru, mezzosopraan – oude muziek ​Vanaf maandag 22 april op Klara. Het concert hoor je in De Twintigers op vrijdag 26 april. Rutger Mathys, mondharmonica – jazz ​Vanaf maandag 29 april op Klara. Het concert hoor je in De Twintigers op vrijdag 3 mei. Pavel Souvandjiev, viool – global ​Vanaf maandag 6 mei op Klara. Het concert hoor je in De Twintigers op vrijdag 10 mei. De Twintigers | vanaf maandag 19 februari | wekelijks op Klara, in de Klara-app en op VRT MAX. In samenwerking met Sabam for Culture.Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
