full_description = "Home/Bezoek VRT/VRT rondleidingVRT rondleidingNeem een unieke kijk achter de schermen van VRT.Onze gidsen nemen je mee naar de regiekamers en de studio en tonen hoe de verschillende VRT-programma’s gemaakt worden. Tijdens de rondleiding krijg je een deskundige uitleg van welke profielen en technische middelen er nodig zijn om een uitzending voor radio of televisie te maken.Praktische infoTijdstipHet bezoek aan VRT duurt anderhalf uur. Er zijn groepsbezoeken beschikbaar elke weekdag en op zaterdag (behalve in juli en de eerste helft van augustus). De rondleidingen vinden plaats op weekdagen en zaterdagen om 9.45 uur, 11.30 uur en 14.00 uur. Op dinsdag, woensdag en donderdag ook om 18.30 uur. De eerste zaterdag van de maand is er om 10.00 uur en de derde zaterdag van de maand om 14.00 uur, en op woensdag om 18.30 uur een rondleiding waarvoor je je als particulier kunt inschrijven. Een geleid bezoek aan VRT duurt 1,5 uur.PrijsEen bezoek kost €120 voor de gids + een prijs per persoon afhankelijk van het type bezoek (scholen= 4 € p.p., verenigingen = 9 € p.p. en bedrijven = 18 € p.p.).Opgelet: het gaat om het aantal deelnemers, dus inclusief de begeleidersEen individuele rondleiding kost 14 € per persoon (prijs van de gids is reeds inbegrepen). Individuele rondleiding gaan door zodra zich 10 personen hebben ingeschreven Boeken kan enkel via het systeem en er dient onmiddellijk online betaald te worden. Terugbetaling is niet mogelijk. Extra infoEen groep bestaat uit minimum 12 personen en maximum 30 personen. Als er meer dan 30 personen komen, moet er een tweede gids geboekt worden.De rondleidingen zijn geschikt voor bezoekers vanaf 10 jaar.Per rondleiding kunnen we maximaal 3 rolstoelen toelaten. Voor uitzonderingen neem contact op met bedrijfsbezoeken@vrt.be.Een bedrijfsbezoek kan aangevraagd worden tot uiterlijk 4 weken voor de geplande datum.De studio van Het journaal is niet toegankelijk op vrijdagnamiddag, de Ketnetstudio niet op dinsdag.Een groep bestaat uit minimum 12 personen en maximum 30 personen. Als er meer dan 30 personen komen, moet er een tweede gids geboekt worden.De rondleidingen zijn geschikt voor bezoekers vanaf 10 jaar.Per rondleiding kunnen we maximaal 3 rolstoelen toelaten. Voor uitzonderingen neem contact op met bedrijfsbezoeken@vrt.be.Een bedrijfsbezoek kan aangevraagd worden tot uiterlijk 4 weken voor de geplande datum.De studio van Het journaal is niet toegankelijk op vrijdagnamiddag, de Ketnetstudio niet op dinsdag.Je kan deze rondleiding ook volgen met Vlaamse gebarentaal.Boek nuBezoek VRTZin om op een fijne manier het leven achter de schermen van ons mediabedrijf te zien? Onze gidsen tonen jou de magie achter ons radio-, tv- en online-aanbod. Check snel hieronder voor alle info!Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
