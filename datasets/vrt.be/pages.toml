full_description = "Home/Contacteer ons/Radio2 Oost-VlaanderenRadio2 Oost-VlaanderenAdres Martelaarslaan 2329000 GentNieuws meldenHeb je iets gezien of aan te kondigen dat nieuwswaardig is? Je kan de regionale redactie bereiken :Meld nieuws met keuze voor regio Oost – VlaanderenMailadressen van andere programma’s van Radio 2 vind je op radio2.be. vind je niet wat je zoekt? Mail naar info@radio2.be Met het openbaar vervoerVanaf het St.-Pietersstation neem je de tram 4, 21 of 22 en je stapt af aan de derde of vierde halte (Martelaarslaan). Radio 2 Oost-Vlaanderen bevindt zich precies tussen die twee haltes in.Dienstregelingen vind je op www.nmbs.be en www.delijn.beMet de wagenIndien je uit de richtingen Brussel via de E40, Antwerpen via de E17 of Kortrijk via de E17 (voorbij het knooppunt in Zwijnaarde): neem de afrit Gent-Centrum. je houdt rechts aan en rijdt naast het viaduct naar beneden (“andere richtingen”). Sorteer onmiddelijk links voor. Bij de verkeerslichten ga je naar links richting Eeklo en blijf je de richting Eeklo volgen, rechts aanhouden. Na vijf verkeerslichten: zie plan. Voorbij de volgende lichten bevindt zich het Radio 2-gebouw, tegenover de Lieven Bauwensbuilding, schuin tegenover McDonald’s.Indien je uit de richting van de kust via de E40 komt: neem de afrit Gent-West en ga links richting Gent tot op de stadsring. je rijdt die rechts op. Het Radio 2-gebouw bevindt zich aan de linkerkant, 500 meter voorbij de Delhaize.Ontdek het Radio2 aanbodRadio2 biedt houvast, ontspanning en optimisme met praktische tips voor het dagelijkse leven en helpt de luisteraars om de wereld veraf en dichtbij beter te begrijpen.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
