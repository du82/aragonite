["https://vrt.be/nl/over-ons/samenwerking"]
title = "Samenwerkingen VRT | VRT"
description = "Samenwerken met VRT: de strafste verhalen schrijven we niet alleen."
full_description = "Home/Over ons/SamenwerkingSamenwerkingen VRTSamenwerken met VRT: de strafste verhalen schrijven we niet alleen. Welke samenwerkingen heeft VRT?VRT werkt samen met andere organisaties en bedrijven, onder meer op het vlak van informatie, cultuur, muziek, educatie, sport en innovatie. Daarmee creëert de publieke omroep maatschappelijke meerwaarde, zoals gevraagd wordt in de Beheersovereenkomst.In de maanden november en december van 2022 wordt het iconische Wintercircus in Gent de uitvalsbasis voor de uitzendingen over het wereldkampioenschap voetbal in Qatar. De voormalige evenementenhal is helemaal gerenoveerd en klaar om de hotspot te worden voor de VRT-verslaggeving én voor de beleving rond het WK, in Gent en in heel Vlaanderen. De publieke omroep werkt daarvoor nauw samen met de Stad Gent en het Gentse stadsontwikkelingsbedrijf sogent. Maar het gaat ook ruimer dan alleen de locatie voor de uitzendingen. Het is een breed partnerschap waarin ook de toeristische sector, de sociale economie en de provincie Oost-Vlaanderen zijn betrokken. Frederik Delaplace, CEO van VRT: Net als combineert het een traditie van cultuur, amusement en ontspanning met een innovatieve blik op de toekomst. Het Wintercircus is slechts een van de véle voorbeelden van samenwerkingen tussen VRT en derden. Zulke partnerships worden expliciet benadrukt in de Beheersovereenkomst 2021-2025 tussen de Vlaamse Gemeenschap en VRT. Daarin staat te lezen: “VRT doet een beroep op een uitgebreid netwerk van maatschappelijke spelers, elk met hun expertise. Zij zoekt actief de samenwerking op met een diversiteit van partners om haar aanbod nog beter af te stemmen op de Vlaamse samenleving.”In praktijk zijn er twee soorten van samenwerkingen die VRT aangaat: binnen en buiten de mediasector.Samenwerkingen met het medialandschapIn 2022 werkte VRT samen met de twee andere grote omroepen aan een actiedag rond Oekraïne. Er was een gemeenschappelijke benefietshow, radiodag en online-aanbod. De weken voordien liep ook al een gemeenschappelijke spot. Deze samenwerking is te vergelijken met de actie rond de watersnood in 2021. Ook toen nam VRT het initiatief voor een gemeenschappelijke spot.Samenwerkingen binnen de sector kunnen tussen verschillende partners tot stand komen, van andere omroepen tot de schrijvende pers. Zo lopen er afspraken met RTBF (Wallonië), NPO (Nederland), DPG Media, RTL, SBS en regionale omroepen.Voorbeelden:De MIA’s is een co-productie van Eén en Proxiums.Voor de publieksstemming van de Boon (literaire prijs) werkt VRT samen met De Standaard.Rond de Biënnale van Venetië werkte Klara samen met kunstentijdschrift HART-Magazine aan een Biënnale handleiding.Daarnaast wordt er ook met distributeurs als Telenet of Proximus samengewerkt, onder meer voor het produceren en uitzenden van Vlaamse fictiereeksen. Met productiehuizen wordt goed samengewerkt om fictiereeksen in het buitenland te valoriseren. Dat geldt ook voor non-fictie, waarvoor VRT samenwerkt met de producenten en (internationale) distributeurs om financiering en inkomsten uit het buitenland te halen.Sporza is het sterkste sportmerk van Vlaanderen. VRT gaat na of er kan samengewerkt worden met een externe partner om het Sporza-merk groter te maken en de impact ervan te verhogen. Intussen werkt Sporza al samen met DPG Media, Telenet/Play Sports/SBS Belgium en Proximus voor de captatie van bepaalde wedstrijden.Verder is VRT lid van de European Broadcasting Union (EBU), de vereniging van Europese openbare radio- en televisieomroepen en van Public Broadcasters International (PBI), een samenwerkingswerkingsverband van wereldwijde publieke omroepen.En natuurlijk zijn er de samenwerkingen met zo’n 100 externe productiehuizen en 200 facilitaire bedrijven/freelancers. VRT besteedt minimaal 18,25% met een groeipad naar 20% van haar totale inkomsten exclusief ruil, Brussels Philharmonic en herstructureringskosten aan de externe productie. Hiervan gaat op jaarbasis minimaal 500.000 euro naar de externe audiosector.VRT is overtuigd dat een intense samenwerking binnen de mediasector noodzakelijk is om lokaal sterk te staan tegenover internationale spelers. Frederik Delaplace, CEO van VRT: Laat ons samen de verandering in mediagedrag omarmen. Zodat onze lokale media relevant en overeind blijven.CEO VRT roept op tot meer samenwerking binnen de mediasectorFrederik Delaplace, CEO van de VRT, roept op tot meer samenwerking binnende mediasector, om lokaal sterk te staan tegenover internationale spelers. Dat zei hij tijdens een lezing op de UBA Belgian Media Date. “Laat ons samen de verandering in mediagedrag omarmen. Zodat onze lokale media relevant en overeind blijven.Lees meerSamenwerkingen buiten de mediaVRT creëert maatschappelijke meerwaarde door rond zijn aanbod samenwerkingsverbanden op te zetten met zowel publieke als private partners. Deze partnerships realiseren meerwaarde voor de betrokken partners en VRT. De partners zijn financieel stabiel en ondernemen op een maatschappelijk verantwoorde wijze.VRT werkt op tal van vlakken samen met andere organisaties en bedrijven.Cultuur: met tal van cultuurpartners van musea tot cultuurhuizen.Muziek: met Vlaamse artiesten, concertorganisatoren, platenmaatschappijen, muziekuitgeverijen, het Muziekoverleg, beheersvennootschappen (zoals SABAM), belangenverenigingen en steunpunten.Onderwijs: met partners zoals het Departement Onderwijs, de Vlaamse Onderwijsraad en het Agentschap voor Onderwijscommunicatie.Sport: met sportfederaties zoals de volleyballiga, de handbalbond en de basketballiga.Innovatie: met Vlaamse startups, technologische bedrijven,Andere organisaties: zoals Meemoo (archiefinstelling), belangengroepen werkzaam in het diversiteitsveld, ...Wil je samenwerken?VRT MAX staat altijd open voor nieuwe podcastideeën. Heb je een goed idee, dan kan je dat hier voorstellen. We vertellen je wat wij van jou verwachten en wat jij van ons kan verwachten bij het pitchen.Pitch je podcastStaan samenwerkingen de onpartijdigheid van VRT in de weg?VRT heeft een duidelijk richtlijn over samenwerkingsovereenkomsten, die vertrekt vanuit volgende overwegingen:De publiek omroep staat niet boven, maar tussen de Vlamingen en wil veel in contact komen met zijn publiek.Connecteren met de Vlaamse samenleving en de wereld is een opdracht van de publieke omroep.VRT wil stevige banden smeden met het middenveld en met culturele organisaties en zet geregeld samenwerkingen op poten.Samenwerking met diverse partners voor evenementen betekent ook extra uitstraling voor netten en diensten van VRT, het werkt imagoversterkend.Samenwerking mag echter nooit de betrouwbaarheid, geloofwaardigheid en onpartijdigheid van de omroep in gevaar brengen.Als in het kader van een overeenkomst de politieke onpartijdigheid in het gedrang komt, is dat schadelijk voor VRT en haar imago.Meer weten? Lees ook deze artikelsOver VRTSamenwerken met VRT: de strafste verhalen schrijven we niet alleenOver VRT | Sport & ontspanningSporza laat partners profiteren van het succes van het WKSport & ontspanning | Over VRTGeen Sporza Wintercircus zonder samenwerking tussen VRT en Stad GentInnovatie | Over VRT | ProductiesHoe VRT en New8 lokale creativiteit internationaal op de kaart zettenOver VRTVRT en KRO-NCRV starten met opnames van nieuwe dramaserie Badgast op Terschelling Muziek | Over VRT | Diversiteit & inclusieVRT en Inter slaan handen in elkaar voor toegankelijke MuziekzomerCultuur | Over VRT Een Belgisch klassiek gezelschap op de BBC?Educatie | Over VRTMNM JumpJobs biedt jongeren springplank naar een eerste jobParticipatie De Raad van Bestuur heeft in het najaar van 2013 een participatiestrategie goedgekeurd om te investeren in jonge, talentvolle productiehuizen. VRT wil daarmee hun groeipotentieel ondersteunen, duurzame talentontwikkeling mogelijk maken en innovatie in mediaconcepten en -formats stimuleren. Externe productiesDeze pagina bevat praktische informatie voor externe medewerkers of leveranciers zoals productiehuizen en montagehuizen, cameraploegen,...Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
