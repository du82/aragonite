["https://vrt.be/nl/over-ons/onze-opdracht/themas/taal/boeken"]
title = "Ontdek het uitgebreide boekenaanbod op VRT | VRT"
description = "VRT heeft een hart voor boeken. Lezers, jong én oud, op zoek naar boekentips, worden geïnspireerd door het ruime aanbod op radio, televisie en online."
full_description = '''Ontdek het uitgebreide boekenaanbod op VRTRead this! op VRT MAXLeesbaar op VRT MAXOntdek de boeken van de week op VRT NWSOntdek het uitgebreide boekenaanbod op VRTVRT besteedt ruim aandacht aan boeken, met boekenpodcasts zoals Leesbaar en Read This! Bijvoorbeeld, maar ook met de vele besprekingen en interviews met auteurs in programma’s zoals Voorproevers en Touché op Radio 1, Pompidou op Klara, De afspraak en Winteruur op Canvas. Elke week tipt VRT NWS ook De boeken van de week. Voor de allerkleinsten zijn er Sarah leest voor op Ketnet en De voorleesclub op VRT MAX.Jaarlijks roept VRT november uit tot dé boekenmaand waarin het leesvuur extra aangewakkerd wordt met onder meer live-uitzendingen vanop literaire evenementen zoals Boektopia in Kortrijk en andere steden.VRT partner van bloeiende leescultuur VRT ondersteunt de leescultuur in Vlaanderen door samen te werken met partners uit het boekenveld zoals Literatuur Vlaanderen, Iedereen Leest en Boekhandels Vlaanderen. VRT is partner van Vlaanderenleestdag en de Boon literatuurprijzen. VRT brengt ook een reeks programma’s rond lezen in het kader van het Leesoffensief (LOF) van de Vlaamse overheid.VRT biedt de volgende programma’s aan samen met het Leesoffensief:De Young Adult podcast Read This! op MNM en VRT MAX waarin Shania Gooris samen met BookTokker Yasmine Van den Meersch de populaire boeken voor jongeren bespreekt. VRT Voorleesclub: videoreeks met Vlaamse Gebarentaal waarin bekende Voorlezers de mooiste kinderboeken tot leven brengen. De reeks bestaat ook als podcast en komt er in samenwerking met Luisterpuntbibliotheek en Iedereen Leest. Sarah en Sokpop op Ketnet bevordert het klankbewustzijn bij de allerkleinsten: peuters & kleuters. Deze reeks is beschikbaar in video, als luisterverhalen en ook met Vlaamse Gebarentaal. Lezen in de klas met de EDUbox. VRT ontwikkelt specifiek voor het secundair onderwijs lesmateriaal dat leerlingen meer leesbegrip en -motivatie, maar vooral goesting in lezen moet geven. De EDUbox Lezen is een laagdrempelig, verfrissend instrument voor in de klas. VRT werkte hiervoor samen met Iedereen Leest, Canon Cultuur, Het Leesoffensief, Literatuur Vlaanderen, het Vlaams Talenplatform, UA en Odisée Hogeschool. Duik in het VRT MAX boekenaanbodHet uitgebreide VRT-boekenaanbod vind je natuurlijk ook op VRT MAX. Op de boekenpagina Lees Mee vind je een selectie van podcasts, van interviews met auteurs uit een hele reeks verschillende programma’s en van Iedereen Beroemd rubrieken als Dichters van wacht en Het boekenverhoor. Ook de boekenpodcasts Leesbaar en Read this! vind je op VRT MAX, net als luisterverhalen van De voorleesclub en Straffe schrijvers uit het VRT-archief. Lees mee opVRT MAXBoekenpodcasts op VRT MAX Leesbaar met Annelies Moons en Joris Hessels Op zoek naar leestips? In Leesbaar leggen Annelies Moons en Joris Hessels nieuwe boeken op het rooster. Op verzoek wordt de maandelijkse podcast tweewekelijks! Read This! met Shania Goossens Jongerenzender MNM deelt in Read This! de beste young adult-tips. Shania Gooris baant zich een weg door honderden bladzijden, een handvol plottwists en een hoop levenslessen. Dat doet ze samen met BookTokker Yasmine Van den Meersch. Andere boekenpodcasts: De Klara-podcast over de Antwerpse schrijver Maurice Gilliams, De Franse Revolutie met schrijver Johan Op de Beeck, Boem Paukeslag (over Paul van Ostaijen), De sporen van Claus (over Hugo Claus), De vele levens van Gertrude Stein, De Wereld van Wildevrouw met Jeroen Olyslaegers, Hendrik Conscience, Lampo & Lampo (over Hubert Lampo), Leven en lijden van Godfried Bomans, Reve tot leven (over Gerard Reve), Streuvels (over Stijn Streuvels) en Zot van Elsschot (over Willem Elsschot). In de Groen Gebladerte gaat Tom De Cock op bezoek bij debuterende schrijvers. Alle VRT-podcasts vind je op VRT MAXVolg het boekennieuws uit de VRT – programma’s via de VRT Lees mee-nieuwsbrief De nieuwsbrief VRT Lees mee zet elke week voor meer dan dertigduizend lezers het volledige VRT-boekenaanbod nog eens netjes op een rijtje, goed voor massa’s leestips! Meer weten? Lees ook deze artikelsCultuurGoesting in boeken?! "Zien lezen doet lezen"CultuurBoekenwurmen unite! VRT roept november opnieuw uit tot boekenmaandTaalOntdek de shortlist van de Boon en stem op jouw favorietTaalIlja Leonard Pfeijffer, Elvis Peeters en Joke van Leeuwen: dit zijn de 30 kanshebbers op de literatuurprijs de BoonTaalRead this! MNM lanceert tweede seizoen van podcastreeks over boeken met Shania GoorisProducties | TaalHet nieuwe seizoen van 'Leesbaar'CultuurVRT maakt van november weer dé boekenmaandTaalWelke aandacht besteedt VRT aan boeken?'''
