["https://vrt.be/nl/over-ons/onze-opdracht"]
title = "Onze opdracht | VRT"
description = "VRT wil alle Vlamingen informeren, inspireren en verbinden, en zo de Vlaamse samenleving versterken."
full_description = "Home/Over ons/Onze opdrachtOnze opdrachtVRT wil alle Vlamingen informeren, inspireren en verbinden, en zo de Vlaamse samenleving versterken.BeheersovereenkomstDe beheersovereenkomst legt de afspraken vast waaraan VRT zich gedurende vijf jaar moet houden in ruil voor financiële middelen van de Vlaamse overheid. Onze missie en waardenVRT is transparant en rapporteert op een open manier over de uitvoering van haar opdracht. De missie en waarden van VRT werden vastgelegd in de Beheersovereenkomst 2021-2025. Naast de kernopdrachten heeft de VRT vanuit het omroepdecreet en de beheersovereenkomst een aantal thema's waarrond prioritair wordt gewerkt. ResultatenHoe scoren we bij ons publiek? Hier vind je de prestaties van VRT in woorden en cijfers.Toezicht en transparantieVRT wil een transparante en open organisatie zijn. Zij vindt het belangrijk en is het ook verplicht om zich ten aanzien van de Vlaamse Gemeenschap te verantwoorden over wat ze met haar middelen (die voor net iets meer dan de helft uit een overheidsdotatie bestaan) doet. Lees er hier meer overCommunicatiebeleidInformatie controle-organenOnze thema'sCultuurVRT viert de culturele diversiteit van Vlaanderen via al haar platformen en zoomt als bondgenoot van de cultuursector elke dag opnieuw in op boeken, beeldende en podiumkunsten en film. En dat is lang niet alles: ook architectuur, games, erfgoed, opera en andere disciplines komen aan bod. Diversiteit en inclusie bij VRTVRT is er voor iedereen. Voor alle diversiteit die Vlaanderen rijk is. Daarom streeft VRT naar diversiteit in beeld én achter de schermen zodat iedereen zich herkent in wat we maken. VRT streeft naar inclusie op verschillende vlakken. VRT Diversiteit & Inclusie werkt aan bewustmaking en neemt samen met VRT-medewerkers en programmamakers stappen om actief te werken aan meer diversiteit in het aanbod. Dat gebeurt via advies, ondersteuning en inspiratie. EducatieVRT heeft een breed-educatieve rol. Ze draagt bij tot de mediawijsheid van de Vlaamse mediagebruikers.InnovatieHoe wil je media in de toekomst beleven? Een toekomst waarin nieuwe technologieën heel wat uitdagingen, maar ook kansen met zich meebrengen. Of dat nu over één jaar is of over vijf, VRT is er vandaag al mee bezig. En dat doen we niet alleen. VRT bundelt wereldwijd de krachten met andere partners om je de sterkste verhalen op de beste manier te brengen.MuziekAlle merken van VRT hebben een eigen muziekprofiel, met een rijk muzikaal aanbod dat aansluit bij de verwachtingen van de verschillende doelgroepen. De unieke profielen van de merken passen binnen het overkoepelende muziekbeleid van de publieke omroep.Onafhankelijk nieuws en informatieDe VRT-nieuwsdienst stelt het publieke belang voorop, hanteert een duidelijke journalistieke deontologie en is redactioneel onafhankelijk. Inhoudelijke afwegingen staan voorop bij de selectie en presentatie van nieuws en ander journalistieke content.Sport en ontspanningVRT garandeert een universeel toegankelijk sportaanbod, versterkt sociale cohesie door sportverslaggeving en stimuleert sportparticipatie. TaalHet taalbeleid van de omroep staat in het Taalcharter, een leidraad voor alle VRT-medewerkers. Het beschrijft de rol van VRT als uitdrager van verzorgd, helder en efficiënt taalgebruik. Vlaamse dimensieVRT draagt de Vlaamse identiteit in al haar verscheidenheid uit en laat de diversiteit in de samenleving zien. De publieke omroep draagt bij aan de ondersteuning en versterking van de Vlaamse identiteit. Dat gebeurt vooral door het stimuleren van kwaliteitsvolle producties van eigen bodem, zowel in de audiovisuele, de culturele als in de muzieksector. De Vlaamse verankering komt tot uiting op twee vlakken: het aandeel Vlaamse- en Nederlandstalige muziekproducties op de radionetten en het aandeel Vlaamse producties op de televisienetten. Zingeving en solidariteitVRT weerspiegelt de Vlaamse samenleving in al haar diversiteit. Ze biedt met haar aanbod de Vlaming troost en (h)erkenning met programma’s rond zingeving waar -soms confronterende thema’s- zoals rouw en verlies aan bod komen.ResultatenHoe scoren we bij ons publiek? Hier vind je de prestaties van VRT in woorden en cijfers.Ontdek hier meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
