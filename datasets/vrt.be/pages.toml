["https://vrt.be/nl/info/cookies"]
title = "VRT-cookiesverklaring | VRT"
description = "Wij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren."
full_description = "Home/VRT-cookiesverklaringVRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.CookiesWij, de Vlaamse Radio- en Televisieomroeporganisatie (of kortweg VRT), zijn verantwoordelijk voor deze cookiesverklaring (versie 10 november 2022). Wij zijn een nv van publiek recht, met maatschappelijke zetel te Auguste Reyerslaan 52, 1043 Brussel, ingeschreven in de KBO met nummer 0244.142.664.Waarop is deze cookiesverklaring van toepassing?Als publieke omroep komen wij dagelijks in contact met jou als mediagebruiker. Wij ontmoeten elkaar bijvoorbeeld wanneer je een van onze onlinediensten gebruikt. Dat zijn niet alleen onze websites, maar ook onze (mobiele) applicaties en internetdiensten die toegang geven tot ons aanbod. Hiernaar wordt in dit cookiesverklaring verder verwezen met de overkoepelende term ‘(VRT-)onlinedienst’. Voorbeelden van onze onlinediensten zijn VRT MAX, de website van VRT NWS en de app van Studio Brussel. Onder deze cookiesverklaring vallen de VRT-onlinediensten van de volgende VRT-merken: VRT, Eén, Canvas, Radio 1, Radio 2, Klara, Studio Brussel, MNM, VRT MAX, Sporza en VRTNWS. Deze cookiesverklaring kan ook van toepassing zijn op de onlinediensten van andere (sub-)merken van VRT. Dit wordt dan uiteraard steeds als zodanig aangegeven.Wat zijn cookies?Onze onlinediensten maken gebruik van zogenaamde ‘cookies’. Cookies zijn kleine data- of tekstbestanden die op je computer of mobiel apparaat worden geïnstalleerd wanneer je een website bezoekt of een (mobiele) applicatie gebruikt. Cookiebestanden bevatten unieke codes die bijvoorbeeld toelaten dat je browser je herkent tijdens je bezoek aan een onlinedienst. Waar komen cookies vandaan?Op basis van de herkomst van cookies maken wij een onderscheid tussen eerstepartij- en derdepartijcookies.EerstepartijcookiesEerstepartijcookies zijn directe cookies die wijzelf beheren. Ze zijn eigen aan de bezochte of gebruikte VRT-onlinedienst. Het is die onlinedienst die de cookies maakt en plaatst om bijvoorbeeld goed te kunnen functioneren.DerdepartijcookiesDerdepartijcookies zijn cookies die niet wijzelf, maar een derde partij beheert of plaatst. Dat gebeurt tijdens je bezoek of gebruik van een VRT-onlinedienst. Derdepartijcookies zorgen er dus voor dat bepaalde gegevens door je bezoek of gebruik van een VRT-onlinedienst naar derden worden gestuurd. Dat zijn bijvoorbeeld socialemediacookies of cookies van adverteerders, die ervoor zorgen dat je advertenties te zien krijgt. Hoewel wij deze cookies dus niet zelf beheren of plaatsen, doen wij er toch alles aan om de plaatsing ervan door derde partijen via onze platformen zo gecontroleerd mogelijk te laten verlopen. Waarom gebruikt VRT cookies?Wij gebruiken cookies in de eerste plaats om jouw gebruikservaring te verbeteren en onze VRT-onlinediensten beter te laten functioneren. Cookies maken de interactie tussen jou en de VRT-onlinedienst die je bezoekt over het algemeen makkelijker en sneller. Ze helpen je bijvoorbeeld te navigeren tussen de verschillende onderdelen van de betrokken VRT-onlinedienst. Als je daarvoor je toestemming gegeven hebt en we je dankzij een cookie kunnen identificeren, hoef je je niet op sommige van onze onlinediensten opnieuw in te loggen, maar doen we dat automatisch voor jou.Daarnaast gebruiken we cookies om de inhoud van onze websites en (mobiele) applicaties interessanter te maken voor jou. Dat doen we door die inhoud aan te passen aan jouw persoonlijke smaak en behoeften.We gebruiken cookies ook om je surfgedrag in kaart te brengen. Hoe ben je op onze website terechtgekomen? Hoelang heb je onze (mobiele) applicatie gebruikt? Dankzij deze cookies kunnen we data verzamelen die we nodig hebben om bepaalde rapporteringsverplichtingen na te komen. Welke cookies gebruikt VRT en voor welke doeleinden?Er kunnen verschillende soorten cookies via onze diverse onlinediensten worden geplaatst. De cookies kunnen in verschillende categorieën worden opgedeeld, die we hierna voor je opsommen. Onderstaande categorieën van cookies worden zeker niet allemaal tegelijk via al onze websites of (mobiele) applicaties geplaatst. Kijk hieronder voor de gedetailleerde lijst van cookies per categorie. Voor een overzicht van de cookies die door Ads & Data worden gebruikt, klik hier.Lijst van cookies (laatste update: 11/08/2023)vrt_cookies.xlsxexcel spreadsheet41 KBWil je meer weten over de cookies die door VAR worden geplaatst, dan kan je op hun website terecht. Ook in ons cookie-voorkeurenscherm vind je steeds de meest actuele informatie over de verschillende cookies die door VRT of derde partijen worden geplaatst.Zoals je daarin kan lezen gebruikt VRT je gegevens voor de volgende doeleinden:“Informatie op een apparaat opslaan en/of openen”“Gepersonaliseerde advertenties en inhoud, advertentie- en inhoudsmeting, doelgroep inzichten en productontwikkeling”“Precieze geolocatie gegevens en identificatie via het scannen van apparaten”“Functionele, analytische, advertentie- (niet-IAB leveranciers) en socialemediacookies”“Strikt noodzakelijke functionele cookies”“Functionele cookies”“Analytics”“Sociale media”“Beveiliging verzekeren, fraude voorkomen en fouten opsporen”“Technisch leveren van advertenties of content”“Eigenschappen”We hernemen hierna de categorieën van cookies die voor het bereiken van de bovengenoemde doeleinden door VRT en haar partners kunnen worden gebruikt.Ons cookie-voorkeurenscherm laat je toe om, waar mogelijk, te beheren welke cookies en voor welke doeleinden VRT en haar partners deze cookies op je toestel mogen plaatsen. Je kan zo eenvoudig je voorkeuren aan ons kenbaar maken en deze wijzigen wanneer je het anders wilt. VRT maakt hiervoor gebruik van het Transparency & Consent Framework (TCF) van IAB Europe. Meer informatie daarover vind je terug op hun website.Strikt noodzakelijke cookiesStrikt noodzakelijke cookies zijn cookies die nodig zijn om onze onlinediensten op een goede manier te gebruiken. Wij gebruiken deze cookies om onder meer de volgende voordelen te garanderen:Instellingen opslaan voor een optimale videoweergave, zoals de gewenste buffergrootte en de resolutiegegevens van je scherm.Je browserinstellingen uitlezen om onze VRT-onlinediensten optimaal op je beeldscherm te kunnen weergeven.De reclameruimte op onze website technisch zo optimaal mogelijk invullen. Hierdoor kunnen we vermijden dat er steeds dezelfde reclame aan je getoond wordt, of kunnen we mogelijke misbruiken via de reclameruimte ontdekken en aanpakken. Het gaat hier niet om cookies die adverteren op maat toelaten (zie de toelichting over advertentiecookies hierna). Deze cookie wordt enkel om functionele redenen geplaatst op bepaalde VRT-onlinediensten waarop advertenties aan gebruikers worden getoond. De betrokken VRT-onlinedienst gelijkmatig belasten, waardoor die steeds bereikbaar blijft.Je laten reageren in onze VRT-onlinediensten, zoals onze websites en apps.Voor gebruik van deze cookies is geen toestemming vereist en deze kunnen dan ook niet worden uitgeschakeld. Statistische cookiesStatistische cookies verzamelen algemene informatie over de manier waarop onze onlinediensten worden gebruikt. VRT gebruikt statistische cookies om haar publieke opdracht en de rapporteringsverplichtingen die zij daaromtrent heeft, te kunnen vervullen en meten. Aan de hand van de informatie die door statistische cookies wordt ingezameld, kan VRT statistische analyses maken van jouw gebruik van haar VRT-onlinediensten. Hoe ben jij op onze webpagina terechtgekomen? Op welke (mobiele) applicatie breng je de meeste tijd door? Dankzij statistische resultaten kunnen we de structuur, navigatie en inhoud van onze onlinediensten zo gebruiksvriendelijk mogelijk maken en verbeteren. We gebruiken die data ook om te rapporteren over het realiseren van VRT-prestaties die door de beheersovereenkomst aan VRT worden opgelegd en daarvoor de noodzakelijke metingen te doen. Omdat VRT een wettelijke grondslag heeft voor het verzamelen van die informatie, is er voor het gebruik van deze cookies door VRT geen toestemming vereist. Deze cookies kunnen dan ook niet worden uitgeschakeld en worden in onze cookiebanner daarom als strikt noodzakelijke cookies geïdentificeerd. VRT gebruikt hiervoor de analytische systemen van Adobe Analytics en Snowplow.In het kader van haar publieke opdracht staat VRT ook toe dat het CIM, het Centrum voor Informatie over de Media, met behulp van cookies, informatie verzamelt over gebruikers van de pagina’s van VRT met het CIM-logo voor haar internet-studie. CIM gebruikt hiervoor de analytische systemen van Gemius. Voor meer informatie over de activiteiten van CIM in het kader van die studie: klik op het CIM-logo of ga naar http://www.cim.be/media/Internet. Deze cookies kunnen eveneens niet worden uitgeschakeld en worden in onze cookiebanner daarom ook als strikt noodzakelijke cookies geïdentificeerd.Daarnaast kan het voorkomen dat VRT cookies wilt plaatsen om analyses van je surfgedrag te kunnen doen die niet onder haar publieke opdracht vallen. Voor het plaatsen van zulke cookies zal steeds je toestemming worden gevraagd.AdvertentiecookiesAdvertentiecookies kunnen je surfgedrag op onze websites om een advertentieprofiel van je samen te stellen. Dit advertentieprofiel wordt dan gebruikt om je online advertenties te tonen die bij jouw persoonlijke interesses passen.Meer dan een derde van het budget om onze taak van publieke omroep uit te oefenen, zijn ‘eigen’ inkomsten. Reclame is daar een belangrijk onderdeel van. Het is dus mogelijk dat je reclame ziet of hoort wanneer je één van onze diensten gebruikt. Hiervoor doen wij een beroep op de diensten van Ads & Data NV (Harensesteenweg 226, 1800 Vilvoorde, en ingeschreven in de KBO met nummer 0809.309.701). Zij beheren het advertentieprofiel dat wordt gebruikt om je advertenties te tonen die bij jouw interesses passen. Als je bijvoorbeeld op onze Sporza-website naar een voetbal-item hebt gesurft, kan in je advertentieprofiel aangevuld worden dat je in voetbal geïnteresseerd bent. Op die manier kan je merken dat je soms voetbalgerelateerde advertenties te zien krijgt. Met andere woorden: als Ads & Data NV zich een beter idee kan vormen van welke websites je bezoekt of welk type programma’s je bekijkt, dan kunnen ze adverteerders makkelijker aantrekken.Advertentiecookies kunnen enkel gegevens verzamelen die iets over je mediagebruik vertellen. Persoonlijke identificatiegegevens zoals je naam of adres, die je bijvoorbeeld in je VRT-profiel hebt ingevuld, worden hiervoor niet gebruikt. De categorieën van persoonsgegevens die Ads & Data NV op grond van hun samenwerking met ons kan verwerken voor de hierboven vermelde doeleinden zijn: een uniek, maar willekeurig identificatienummer om je te herkennen over verschillende websites en apps heen in voorkomend geval, surf- en/of kijkgedrag op de websites van andere aanbieders van advertentieruimte waarmee Ads & Data NV samenwerkt (vb. interesse in ondernemen)kenmerken op basis van statistische en publieke gegevens (vb. gemiddeld aantal gezinsleden op basis van de wijk van de woonplaats) Ads & Data NV ontvangt enkel gegevens van VRT in een versleutelde vorm (via hashing) en is niet in staat jou rechtstreeks te identificeren. Op grond daarvan kan Ads & Data NV dus jouw gepersonaliseerde gebruikersprofiel en segmenten (vb. sportliefhebber) bouwen als je daar je toestemming voor hebt gegeven. Ads & Data NV gebruikt dit profiel en de segmenten om binnen de digitale advertentieruimte van VRT op geautomatiseerde wijze aangepaste advertenties te tonen. Gegevens worden enkel uitgewisseld tussen VRT en Ads & Data NV, en niet met andere aanbieders van advertentieruimte waarmee Ads & Data NV samenwerkt.We zullen altijd je toestemming vragen om aangepaste advertenties op onze onlinediensten te tonen. Dat doen we via de cookiesinstellingen die op je scherm verschijnen wanneer je een van onze onlinediensten gebruikt. Je kan je toestemming via dezelfde instellingen ook altijd intrekken.Voor een goed begrip: ook al heb je je toestemming niet gegeven, toch zal je nog altijd reclame op onze onlinediensten zien of horen. Die reclame zal dan wellicht alleen minder relevant zijn, omdat ze niet aan jouw vermoedelijke interesses aangepast zal zijn. We laten aan jou dus de keuze of je advertenties al dan niet ‘op maat’ ontvangt.Merk op dat onze partner Ads & Data NV voor verschillende bedrijven de advertentieruimtes op de online platformen verzorgt. Zelfs wanneer je bij ons geen toestemming voor aangepaste reclame hebt gegeven of deze toestemming hebt ingetrokken, kan het zijn dat er bij Ads & Data NV een advertentieprofiel van je bestaat, naar aanleiding van je bezoek op andere derde websites. Lees dan het privacy- en cookiebeleid van Ads & Data NV , of contacteer hen via privacy@adsanddata.be.Voor het invullen van advertentieruimtes werkt VRT ook samen met haar dochteronderneming VAR NV (Tollaan 107, 1932 Zaventem, en ingeschreven in de KBO met nummer 0441.331.984) waarbij ze gebruik maken van advertentiecookies. Wil je meer weten over de activiteiten van VAR, dan kan je op hun website terecht. Je kan daar ook hun privacy- en cookiebeleid raadplegen.AanbevelingscookiesAanbevelingscookies volgen – net als advertentiecookies – je surfgedrag om je gebruikersprofiel samen te stellen. Dat profiel wordt dan gebruikt om je een media-ervaring te bezorgen die bij je interesses past. Deze cookies vertellen ons iets over jouw gebruik van onze onlinediensten, zodat wij meer gerichte aanbevelingen en suggesties kunnen doen. Verder zorgen deze cookies ervoor dat de programma’s die je al hebt bekeken, niet opnieuw als suggestie verschijnen. Zo hopen we je in aanraking te brengen met nieuwe programma's en informatie die je boeiend vindt, en waar je zelf misschien niet meteen aan had gedacht.Voor het gebruik van deze cookies is je toestemming vereist. SocialemediacookiesSocialemediacookies worden gebruikt om de integratie van sociaalnetwerksites op onze websites mogelijk te maken. Onze onlinediensten kunnen ingebedde elementen van derde partijen bevatten. Dat kan gaan om inhoud die bij een andere partij opgeslagen is, maar die op, in of via onze onlinediensten wordt getoond. Verder kan VRT-content door knoppen via sociaalnetwerksites op onze onlinediensten gedeeld worden. Voorbeelden van die sociale media zijn Facebook, YouTube, LinkedIn en Twitter. Die derden kunnen via onze onlinediensten cookies plaatsen om gegevens te verzamelen. Wijzelf hebben geen invloed op wat die sociale media met hun coo"
