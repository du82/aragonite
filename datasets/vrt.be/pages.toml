["https://vrt.be/nl/over-ons/onze-organisatie/geschiedenis"]
title = "Geschiedenis | VRT"
description = "Hier ontdek je alles over de geschiedenis van de Vlaamse publieke omroep. Met archiefbeelden, de historische jaarverslagen en nog veel meer."
full_description = "Home/Over ons/Onze organisatie/GeschiedenisGeschiedenisHier ontdek je alles over de geschiedenis van de Vlaamse publieke omroep. Met archiefbeelden, de historische jaarverslagen en nog veel meer. VRT ArchiefHet VRT-archief biedt een unieke en uitgebreide blik op het leven in Vlaanderen sinds het ontstaan van de omroep. Met zijn rijke collectie audiovisueel materiaal, die zowel analoog als digitaal bewaard wordt, vormt het een onschatbare bron van informatie en inspiratie. Neem een duik in het rijke VRT-archiefGeschiedenis van de omroepDe VRT-gebouwenIn haar geschiedenis was de publieke omroep bouwheer van meerdere gebouwen. Waarvan de 'pakketboot' aan het Flageyplein van Joseph Diongre en het nieuwe nog te bouwen omroepgebouw de meest opvallende zijn. Historiek gedelegeerd bestuurders van de publieke omroepDe Vlaamse publieke omroep had in de loop van zijn geschiedenis verschillende leidende ambtenaren en CEO's. Historische jaarverslagenHier kun je de downloadbare PDF-bestanden van de jaarverslagen van het NIR, de BRT, de BRTN en VRT vinden.Geschiedenis van de publieke omroepOntdek hier een beknopt overzicht van de geschiedenis van de Vlaamse publieke omroep. ArchiefreeksenTijdlijn: clips uit het archiefDuik in meer dan een eeuw aan radio, meer dan zeven decennia televisie en ruim 25 jaar internet. Herbeleef enkele gedenkwaardige momenten in de geschiedenis van de publieke omroep. 90 jaar publieke omroepDe publieke omroep wordt in het academiejaar 2020-2021, 90 jaar oud. De redactie van vrt.be ging langs bij een aantal oudgedienden om hun te vragen hoe belangrijke omroepthema’s in de loop der jaren werden ingevuld. 2022, het jaar van... Op het einde van het jaar maken we een balans op van enkele bijzondere gebeurtenissen die we hebben meegemaakt. Dat is voor de publieke omroep niet anders. 2021, het jaar van... 2021 was het tweede opeenvolgende jaar waarin niets was als tevoren. Covid-19 in delta en omikron-varianten bleven ons leven beheersen.2020, het jaar van... 2020 was een jaar dat we niet snel zullen vergeten. Sinds 13 maart is niets meer zoals ooit tevoren. En toch willen we even terug kijken. Op weg naar het 65e EurovisiesongfestivalNaar aanleiding van de 65e editie van het Eurovisiesongfestival in 2021 dook journalist André Vermeulen voor VRT.be in het rijke VRT-archief. Hij ging er op zoek naar de meest markante preselecties en Belgische inzendingen uit 65 edities van het Eurovisiesongfestival. Herbekijk de reeks hier.Over VRT65 jaar Vlaamse televisieOp 31 oktober vieren we 65 jaar televisie in Vlaanderen. Daarom blikken gedurende zes weken zes programmamakers uit zes verschillende decennia terug op het nieuws en de programma's op hun geboortedag. De reeks is te volgen op de sociale media van het corporate VRT-merk.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
