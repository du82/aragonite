["https://vrt.be/nl/over-ons/nieuws-over-vrt/de-vorstinnen-van-vlaanderen-leading-ladys-in-de-middeleeuwen"]
title = "De vorstinnen van Vlaanderen: leading lady’s in de middeleeuwen | VRT"
description = """
Nieuwe Klara-podcast biedt een andere kijk op de geschiedenis, vanuit de beleving van vrouwen
Maandag 11 december 2023&nbsp;–&nbsp;Vrouwen in de middeleeuwen, die hadden toch niks te zeggen? Gooi dat cliché maar in de vergeetput. Tijd voor een nieuw verhaal, met vrouwen in de hoofdrol! In de&nbsp;11-delige Klara-podcast&nbsp;De vorstinnen van Vlaanderen&nbsp;bekijk je de middeleeuwen eens van een andere kant, met historici&nbsp;Els De Paermentier&nbsp;en&nbsp;Lisa Demets&nbsp;van de&nbsp;Universiteit Gent, en Klara-stem&nbsp;Julie Van Bogaert&nbsp;als nieuwsgierige gids."""
full_description = "Home/Over ons/Nieuws over VRT/De vorstinnen van Vlaanderen: leading lady’s in de middeleeuwenDe vorstinnen van Vlaanderen: leading lady’s in de middeleeuwen11 december 2023Nieuwe Klara-podcast biedt een andere kijk op de geschiedenis, vanuit de beleving van vrouwen Maandag 11 december 2023 – Vrouwen in de middeleeuwen, die hadden toch niks te zeggen? Gooi dat cliché maar in de vergeetput. Tijd voor een nieuw verhaal, met vrouwen in de hoofdrol! In de 11-delige Klara-podcast De vorstinnen van Vlaanderen bekijk je de middeleeuwen eens van een andere kant, met historici Els De Paermentier en Lisa Demets van de Universiteit Gent, en Klara-stem Julie Van Bogaert als nieuwsgierige gids.De vorstinnen van Vlaanderen brengt een alternatieve lezing van de geschiedenis. Geen stereotiepe verhalen over mannen en macht zoals we die traditioneel kennen, maar een historie over vrouwen uit alle lagen van de samenleving, en hoe ze net als mannen hun stempel op de middeleeuwse maatschappij hebben gedrukt en onze geschiedenis mee hebben bepaald. Je kunt De vorstinnen van Vlaanderen nu beluisteren op VRT MAX. Géén passieve marionetten De leading lady’s van het graafschap Vlaanderen hadden wel degelijk iets in de pap te brokken. Van de eigenzinnige koningsdochter Judith in de tijd van de Vikingen tot het Bourgondische powerduo Margaretha en Maria. Meer dan 600 jaar geschiedenis, die kun je pas écht begrijpen wanneer je ook oog hebt voor vrouwen. Vrouwen die regeerden, maar die ook gewoon hobby’s hadden en geen enkel toernooi wilden missen. Middeleeuwse vorstinnen waren géén passieve marionetten die vanuit hun mannelijke entourages werden aangestuurd. Ze vervulden een cruciale rol als hoeksteen van de dynastie, en speelden een zeer actieve rol als plaatsvervangers van hun echtgenoten, als bemiddelaars en alliantievormers achter de schermen, als bouwers van de herinnering aan de vorstelijke dynastie in het collectieve geheugen. Kinderen van hun tijd Het middeleeuwse wereldbeeld verschilde sterk van dat van ons nu, en steunde op overtuigingen en vooroordelen, zéker als het om vrouwen ging. Pas wanneer je je in deze denkwereld verplaatst, wordt het mogelijk om het middeleeuwse gedachtegoed rond ‘man zijn’ of ‘vrouw zijn’ in al zijn nuances te begrijpen. De vorstinnen van Vlaanderen waren vooral kinderen van hun tijd, die meer dan mannen met vooroordelen over hun sekse werden geconfronteerd, en creatiever moesten zijn om zich binnen de beschikbare ruimte die ze hadden te manoeuvreren om hun stempel te drukken en hun graafschappen doorheen moeilijke tijden te loodsen. Meeslepend verhaal dankzij hard werk De vorstinnen van Vlaanderen is een spannend verhaal, maar ook zoveel méér. Zo laten Julie, Els en Lisa hun bronnen uit het verleden zelf aan het woord. Die stemmen zijn dan weer overwegend mannen, want veel van de teksten die overgeleverd zijn uit de middeleeuwen werden door mannen geschreven. Je krijgt ook een kijkje onder de motorkap en ontdekt hoe historici het ‘vuile werk’ doen voordat er überhaupt een verrassend verhaal over het verleden kan verteld worden. Dat komt niet zomaar uit de lucht vallen. Er zit veel en hard werk achter: de zoektocht naar de juiste bronnen, ze dan ook nog ontcijferen en interpreteren én ze tegen elkaar afwegen. De ‘making-of’ is al even boeiend als het verhaal zelf. Geschiedenispodcast over vrouwen door vrouwen Julie Van Bogaert Julie Van Bogaert is radiomaker bij Klara. Op zaterdagmiddag presenteert ze het programma Klara serveert. Wanneer er dan middeleeuwse muziek de revue passeert, smokkelt ze al eens een leuk weetje binnen, over toernooien kijken vanop een gouden balkon of over het middeleeuwse studentenleven. Tijdens de week is Julie namelijk niet door radiocollega’s omgeven, maar door historici, want behalve radiopresentator is ze ook onderzoekscoördinator bij de vakgroep Geschiedenis van de Universiteit Gent. Julie is zelf geen historica, maar germanist, dus toen ze daar begon te werken, ging er een fascinerende wereld open. Diezelfde verwondering wil ze nu delen met de luisteraar in De vorstinnen van Vlaanderen.De podcast is geen aaneenschakeling van biografieën. En we zetten die vrouwen al helemaal niet op een voetstuk. In feite zijn die vorstinnen niet meer dan een lens om naar de middeleeuwse samenleving te kijken, niet alleen naar stereotiep vrouwelijke thema?s zoals anticonceptie of moederschap, maar ook naar domeinen waar ze in de vertrouwde verhalen over geschiedenis meestal worden genegeerd, zoals de kruistochten, opstanden en politieke verdragen. Wanneer je die eens vanuit een ander standpunt benadert, vanuit de beleving van een vrouw, krijg je een totaal andere kijk op dezelfde gebeurtenissen. Dát is geschiedenis. Julie Van BogaertEls De Paermentier Els De Paermentier is hoofddocent aan de vakgroep Geschiedenis van de Universiteit Gent. Ze is gespecialiseerd in middeleeuwse paleografie en oorkondeleer en heeft een bijzondere interesse voor de manier waarop adellijke vrouwen in een door mannen gedomineerde maatschappij macht en invloed uitoefenden. Met De vorstinnen van Vlaanderen hoopt Els bij het brede publiek vooral interesse en verwondering te wekken voor de middeleeuwse denk- en leefwereld, voor de veelzijdigheid van middeleeuwse bronnen en hoe ze te benaderen en voor hoe middeleeuwers in hun denken, handelen en zijn op sommige vlakken verbazend veel gelijkenissen vertoonden met ons, modernelingen. Lisa Demets Lisa Demets is historica aan de Universiteit Gent. Ze is gefascineerd door de relatie tussen literatuur en maatschappij in de Nederlanden tijdens de Bourgondische periode (1384-1482). Ze schreef boeken en artikels over meertaligheid, geschiedschrijving en de positie van de vrouw in de middeleeuwen. Niet alleen het verleden is een mannenbastion, ook de geschiedenis is dat. Geschiedenisprogramma’s en boeken worden nog te vaak over en door mannen gebracht. Een geschiedenispodcast over vrouwen door vrouwen is zelfs in de eenentwintigste eeuw helaas nog steeds een unicum. Lisa was dan ook maar wat blij dat ze aan De vorstinnen van Vlaanderen kon meewerken.De vorstinnen van Vlaanderen | een Klara-podcast in 11 afleveringen | op VRT MAX.Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
