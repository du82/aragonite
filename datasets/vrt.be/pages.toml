full_description = "Home/Ons aanbod/Toegankelijkheid/Websites en apps/ToegankelijkheidsverklaringToegankelijkheidsverklaringBij VRT vinden we het van groot belang dat iedereen, ongeacht eventuele beperkingen, onze producten en diensten zonder problemen kan gebruiken. Daarom is onze nieuwe website vrt.be met zorg ontwikkeld om zoveel mogelijk mensen te bereiken.We realiseren ons echter dat niet alles vanaf de lancering volledig toegankelijk is. Toegankelijkheid blijft voor ons een prioriteit, en we werken aan verdere verbeteringen. We streven ernaar om op termijn het AnySurfer-label te behalen voor vrt.be als erkenning voor deze inspanningen.Lees meer over toegankelijkheid binnen VRT.Heb je vragen of suggesties? Neem dan gerust contact met ons op via toegankelijkheid@vrt.be.ToegankelijkheidVRT wil zo toegankelijk mogelijk zijn voor alle Vlamingen en onderneemt daarom stappen in overleg met de betrokken belangenorganisaties.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
