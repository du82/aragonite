["https://vrt.be/nl/bezoek-vrt/combibezoek-vrt-en-technopolis"]
title = "Combibezoek VRT én Technopolis | VRT"
description = "Elke tweede zaterdag van de maand kan je als particulier VRT én Technopolis bezoeken: slechts 1x boeken aan een voordelig combitarief!"
full_description = "Home/Bezoek VRT/Combibezoek VRT én TechnopolisCombibezoek VRT én TechnopolisElke tweede zaterdag van de maand kan je als particulier VRT én Technopolis bezoeken: slechts 1x boeken aan een voordelig combitarief!In de voormiddag zie je VRT zoals je de publieke omroep nog nooit zag: je komt in onze journaalstudio, brengt een bezoekje aan het FC De Kampioenen-café, ontdekt hoe een ‘green key’ werkt in onze belevingsruimte, staat op de eerste rij terwijl er live radio wordt gemaakt en nog zoveel meer. Onze enthousiaste gidsen nemen jou mee voor een verrassende blik achter de schermen. Neem vrienden of familie mee en maak er een gezellige daguitstap van!In de namiddag kan je dan op eigen houtje naar Technopolis reizen: dé plek waar wetenschap en avontuur elkaar ontmoeten. Hier mag je van alles zelf doén: via talloze interactieve opstellingen ervaar je hoe WOW wetenschap is en duik je in de wondere wereld van technologie in de gloednieuwe expo ON/OFF. Daarnaast zijn er dagelijks demo’s waar je haren van rechtop gaan staan. Letterlijk! En in het weekend en tijdens schoolvakanties is er elke dag een spectaculaire wetenschapsshow.Meer weten: https://www.technopolis.be/Praktische infoTijdstipDit gecombineerd bezoek kan geboekt worden op elke 2e zaterdag van de maand, door particulieren.De rondleiding op VRT start om 10.30u en duurt 1.5 uur.Na de rondleiding op VRT kan je op eigen houtje naar Technopolis rijden: er is dus geen aanvangsuur waaraan je je dient te houden. Technopolis is op zaterdag open tot 17u.PrijsEen bezoek kost €34 per persoon.Je kan enkel boeken via de boekingstool en je dient online te betalen. Terugbetaling is niet mogelijk.Extra infoParticuliere bezoeken gaan door zodra er zich 10 personen hebben ingeschreven.Op VRT kan je niet lunchen, je kan wel iets eten of drinken in het restaurant van Technopolis: Toegankelijkheid en voorzieningen - TechnopolisDe rondleiding bij VRT is geschikt voor kinderen vanaf 10 jaar.Per rondleiding op VRT kunnen we maximaal 3 rolstoelgebruikers toelaten. Voor uitzonderingen kan je mailen naar bedrijfsbezoeken@vrt.be.Een bedrijfsbezoek kan aangevraagd worden tot uiterlijk 4 weken voor de geplande datum.Boek je ticketsBezoek VRTZin om op een fijne manier het leven achter de schermen van ons mediabedrijf te zien? Onze gidsen tonen jou de magie achter ons radio-, tv- en online-aanbod. Check snel hieronder voor alle info!Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
