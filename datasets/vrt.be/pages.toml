["https://vrt.be/nl/over-ons/nieuws-over-vrt/bjorn-soenens-maakt-voor-vrt-theatertour-over-amerika"]
title = "Björn Soenens maakt voor VRT theatertour over Amerika | VRT"
description = "Soenens fileert Amerikaans leven en werken in wervelend verteltheater Allemaal Amerikaans vanaf september ’25.&nbsp;Björn Soenens is terug op Vlaamse bodem gearriveerd. De rasverteller van VRT NWS trekt vanaf de herfst Vlaanderen rond met verhalen over de VS. 8 jaar - twee presidentstermijnen lang - was Soenens de correspondent voor VRT&nbsp;NWS in Amerika. Hij bracht het immense land een stuk dichterbij voor miljoenen Vlamingen en&nbsp;was een permanente bron van informatie en duiding op televisie, radio, online en via de&nbsp;bekroonde podcastreeks ‘Björn in the USA’. Björn schreef ook zes boeken over Amerika, zoals de&nbsp;bestsellers ‘De lengte van een oceaan’ (2020) en ‘De laatste walvis’ (2024). ​"
full_description = "Home/Over ons/Nieuws over VRT/Björn Soenens maakt voor VRT theatertour over AmerikaBjörn Soenens maakt voor VRT theatertour over Amerika10 februari 2025Soenens fileert Amerikaans leven en werken in wervelend verteltheater Allemaal Amerikaans vanaf september ’25. Björn Soenens is terug op Vlaamse bodem gearriveerd. De rasverteller van VRT NWS trekt vanaf de herfst Vlaanderen rond met verhalen over de VS. 8 jaar - twee presidentstermijnen lang - was Soenens de correspondent voor VRT NWS in Amerika. Hij bracht het immense land een stuk dichterbij voor miljoenen Vlamingen en was een permanente bron van informatie en duiding op televisie, radio, online en via de bekroonde podcastreeks ‘Björn in the USA’. Björn schreef ook zes boeken over Amerika, zoals de bestsellers ‘De lengte van een oceaan’ (2020) en ‘De laatste walvis’ (2024). ​Björn Soenens gaat nu het podium op met een schatkamer aan verhalen uit de VS, na bijna een decennium wonen en werken in New York City, en na ruim 100 reportagereizen in bijna alle 50 staten van de VS, van Alaska over Michigan en Tennessee tot Wyoming. ​ ​Björn Soenens werkt al 33 jaar voor de VRT en introduceert met zijn theatertour voor VRT NWS een nieuw journalistiek project waarbij we naar ons publiek toe gaan: live verteld, oog in oog met een breed publiek in de grote Vlaamse theaterzalen. VRT NWS zet zo in op een rechtstreeks contact tussen journalist en mediagebruiker. Zo willen we de verhalen die Soenens nog niet eerder vertelde naar de mensen brengen, met meer tijd voor reflectie.Björn Soenens: Allemaal Amerikaans wordt een wervelende voorstelling: over 8 jaar wild en woest leven en werken in Amerika, de lengte van een oceaan ver weg. ‘Allemaal Amerikaans’ gaat over de gewone Amerikaan, en over legendes en leugens uit de Amerikaanse geschiedenis, ruimer dan de vertrouwde waan-van-de-dag-politiek. ​ ​ Soenens analyseert de Amerikaanse realiteit met persoonlijke observaties, over het echte leven en de schaduwkanten ervan. Hij vertelt over de helden en de schurken van Amerika, die van vroeger én die van nu. Amerika op een andere manier. VRT NWS op een andere manier, en Björn Soenens in een andere gedaante dan op radio, tv of online. Met Allemaal Amerikaans trekt Björn Soenens voor VRT NWS ​ door Vlaanderen, van het Concertgebouw in Brugge tot de Capitole in Gent. Van de Warande in Turnhout, tot Kursaal in Oostende en de Stadsschouwburg in Antwerpen, van het casino Silt in Middelkerke tot De Werf in Aalst. ‘Allemaal Amerikaans’ is voor alle Vlamingen bedoeld.Intussen blijft VRT NWS-journalist Björn Soenens ook geregeld opduiken op radio, tv en online en gaat hij na de theatertour nog meer nieuwe projecten doen voor VRT.Lees zeker ookNieuws & informatieIn het spoor van VRT NWS-journalist Koen Wauters: “Wetenschap toegankelijk maken voor iedereen” Nieuws & informatieRadio 1 zet met nieuw logo en nieuwe huisstijl ook volop in op digitale platformen en veranderend luistergedragNieuws & informatieSarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapperNieuws & informatieWelke genomineerden maken zaterdag kans op een Kastaar!?Nieuws & informatie70% van de Vlamingen wil meer inzetten op brandpreventieNieuws & informatieDecember 2024: een absolute recordmaand voor VRT MAXNieuws & informatieOntdek alle genomineerden voor de Kastaars! 2024Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
