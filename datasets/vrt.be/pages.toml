title = "VRT NWS | VRT"
description = "VRT NWS is de meest betrouwbare bron voor onpartijdig en kwaliteitsvol nieuws in Vlaanderen."
full_description = '''Home/Ons aanbod/VRT NWSVRT NWSVRT NWS is de meest betrouwbare bron voor onpartijdig en kwaliteitsvol nieuws in Vlaanderen.VRT NWS is het nieuws-aanbodsmerk van de Vlaamse publieke omroep VRT. De Vlaming informeren is een essentiële opdracht van de VRT. Vanuit zijn onafhankelijke positie staat VRT NWS garant voor correcte, feitelijke en betrouwbare informatie in tijden waarin de lijn tussen echt en nepnieuws vervaagt. VRT NWS geeft ook duiding, achtergrond en context bij het nieuws, zowel lokaal en nationaal als internationaal. VRT NWS verzorgt een gedifferentieerd en multimediaal nieuwsaanbod via de kanalen van de andere aanbodsmerken van de VRT, zijn eigen mediaplatformen en sociale media.VRT NWS wil de meest relevante nieuwsbron in Vlaanderen zijn en blijven, en elke Vlaming informeren over nieuws van dichtbij en veraf. Om die relevantie te behouden, zet de nieuwsdienst in op verschillende kanalen om zoveel mogelijk doelgroepen in Vlaanderen te bereiken.Onze maatschappij wordt vandaag steeds meer geconfronteerd met een overaanbod aan informatie en desinformatie. VRT NWS wil in die complexe context een garantie zijn op onafhankelijke, betrouwbare en onpartijdige nieuws en duiding, en dit op een toegankelijke manier.VRT NWS wil dicht bij de mensen staan en een vinger aan de pols houden, verhalen brengen die leven in de Vlaamse samenleving en de wereld. Op die manier voelt het publiek zich betrokken en herkennen mensen zich in het aanbod. De nieuwsdienst geeft informatie waar de Vlaming iets aan heeft, die concreet is, zijn dagelijkse leven gemakkelijker maakt en hem een mening helpt te vormen om zo zijn rol te spelen in de samenleving.VRT NWS volgt niet enkel nauwlettend op wat er gebeurt in Vlaanderen en in de wereld. De nieuwsdienst wil ook zelf de nieuwsagenda zetten, met eigen verhalen en onderzoeksjournalistiek. Via diepgaand onderzoek worden zaken onthuld en thema’s die leven in de maatschappij verder onderzocht. Verschillende kanten van het verhaal belichten, juiste informatie geven, een genuanceerde blik werpen op wat er leeft… Zo draagt VRT NWS bij tot het voeden van het debat.Nieuws op maatVRT NWS wil alle Vlamingen voorzien van nieuws en duiding. De nieuwsdienst zorgt er daarbij voor dat de berichtgeving afgestemd is op de flow van de dag en op maat van de doelgroep:De berichtgeving volgt de mediagebruiker doorheen de dag met aangepaste nieuwscontent op de diverse platformen. De informatiebehoefte verschilt immers van moment tot moment. ’s Ochtends word je wakker met het nieuws op de radio, in de auto volgt een update over het verkeer, en ’s avonds stem je af op Het journaal, De afspraak of Terzake voor nieuws en diepgaandere duiding bij de actualiteit. Het nieuws en de duiding worden daarnaast ook aangepast naargelang de doelgroep. Een nieuwsupdate bij Radio 1 zal verschillen van MNM op vlak van gebruikte taal, aangekaarte thema’s… Die differentiatie in toon en vorm is noodzakelijk om zoveel mogelijk verschillende doelgroepen te bereiken. Informeren op maat heeft meer impact dan iedereen hetzelfde voor te schotelen. Hoofdpunten VRT NWSSpoedoverleg vakbonden en directie bpost levert niks op: "Morgen beginnen we opnieuw"Opmerkelijke beelden tonen eerste contact tussen Braziliaanse dorpelingen en inheems stamlid op zoek naar vuurLIVE - "Oekraïne niet uitgenodigd op vredesgesprekken met VS en Rusland in Saudi-Arabië", melden overheidsbronnenCongolese regering bevestigt voor het eerst dat M23-rebellen stad Bukavu bezetten: "Rebellenleider zelfs ingetrokken in kantoor van gouverneur"Buitenlanders mogen 2 jaar lang geen huis kopen in AustraliëFamilie van moeder en dochter die stierven bij aanslag in München: "Gebruik hun dood niet om haat aan te wakkeren"Stefan Goris uit Zutendaal wint WK sledehondenrennen in Noorwegen: "Jaren voor gewerkt"Dodelijke steekpartij in Oostenrijk is "Islamistische aanslag", minister kondigt "massale controles" aan van asielzoekers8 jaar na haar verdwijning in Knokke-Heist, deelt politie nu opsporingsbericht voor Hilde HaersZoeken naar naald in hooiberg: alleen stamceldonatie kan Berrin (8) redden, maar haar roots maken zoektocht moeilijkerUltraloper Karel Sabbe uit Anzegem verpulvert record in Nieuw-ZeelandEerste openlijk homoseksuele imam (57) ter wereld doodgeschoten in Zuid-AfrikaTwee verkoolde lichamen teruggevonden in Woud van ChimayGa ik die pensioenmalus voelen? En is dat rookverbod op terrassen wel echt nodig? Minister Vandenbroucke antwoordt op jouw vragenParket van Brussel na dodelijke schietpartij: "Lijkt afrekening in verband met drugshandel, daders zijn gevlucht in voertuig"1 jaar na de dood van Aleksej Navalny is het verzet tegen de Russische president Poetin zo goed als uitgedoofdKaren Jansen (23) uit Lommel is de nieuwe Miss België: "Ik beloof een miss te zijn die anderen aanvaardt"Oorlogswapens in de Brusselse straten: dit weten we al na de dodelijke schietpartij in AnderlechtKunnen honden kanker opsporen? En kunnen ze angst ruiken? De zin en onzin op een rijTrump onderhandelt met Poetin en dumpt Europa: is dit het einde van de trans-Atlantische verstandhouding?Royals op zondag - Een perfect Zweeds kwartet en een bezoek van koning Charles aan de VS als charmeoffensiefSlachtoffers van valse AI-naaktfoto's getuigen: "Daders beseffen niet hoe vernederend het is"Van winter naar lente in nog geen week tijd: zon en 16 graden tegen vrijdagVan walvisskelet met papieren vliegtuigje in de kop tot grootste bananencollectie ter wereld: 4 zaken die je nog niet wist over 600 jaar KU LeuvenPresident Donald Trump bant persagentschap AP uit Oval Office omdat het Golf van Mexico blijft gebruikenDoel 1 sluit na 50 jaar: einde van een tijdperk, maar mogelijk niet definitief"Oneerlijk en onrechtvaardig": VRT NWS spreekt met Palestijnse boekhandelaar uit Oost-Jeruzalem na inval door Israëlische politie600 jaar KU Leuven, gratis lichtfestival in Brussel of The Phantom: dit zijn onze 5 weekendtipsSchietgeluiden op virale video Anderlecht z