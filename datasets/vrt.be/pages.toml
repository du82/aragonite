title = "VRT in de klas | VRT"
description = "VRT en het onderwijs zijn partners in educatie.&nbsp;Leerkrachten kunnen VRT-programma's gebruiken als lesmateriaal, terwijl leerlingen duiding krijgen bij de actualiteit. En dat op maat van kinderen en jongeren."
full_description = "Home/Over ons/Onze opdracht/Missie en waarden/Educatie/VRT in de klasVRT in de klasVRT en het onderwijs zijn partners in educatie. Leerkrachten kunnen VRT-programma's gebruiken als lesmateriaal, terwijl leerlingen duiding krijgen bij de actualiteit. En dat op maat van kinderen en jongeren.VRT en het kleuter- en lager onderwijsKetnet is hét VRT-merk waar kinderen op avontuur gaan en de wereld om hen heen ontdekken. Ketnet groeit mee met elk kind in Vlaanderen en biedt een gevarieerd, gratis en reclamevrij aanbod op maat van kinderen, zowel via televisie als online. VRT en het secundair onderwijsMet een breed (educatief) aanbod wil VRT jongeren informeren, inspireren en verbinden met de wereld om hen heen. Zo ontwikkelt VRT programma’s en content op maat van jongeren, maar ook lesmateriaal specifiek voor leerlingen secundair onderwijs. VRT en het hoger onderwijsVRT werkt op verschillende vlakken samen met het hoger onderwijs. Zo lopen er projecten samen met onderzoekers van het hoger onderwijs, zorgt VRT voor stageplaatsen voor studenten uit verschillende studierichtingen en worden geregeld experten uit het hoger onderwijs betrokken bij programma’s van VRT. VRT biedt een breed aanbod aan educatieve tools en initiatieven om leerkrachten te ondersteunen in hun lespraktijk en leerlingen te inspireren.VRT zet in op STEM-geletterdheid door de Vlaming te informeren en inspireren, en door kinderen en jongeren warm te maken voor een STEM-opleiding met STEMhelden.KLAAR is een reeks korte video’s waarin actuele en complexe onderwerpen op een toegankelijke manier worden uitgelegd. Deze video's zijn op maat van jongeren en helpen hen om maatschappelijke thema's beter te begrijpen. VRT werkt op verschillende vlakken samen met andere organisaties en bedrijven om zo maatschappelijke meerwaarde te creëren, zoals beschreven in de Beheersovereenkomst. VRT draagt bij tot de mediawijsheid van de Vlaamse mediagebruiker door het thema zowel in het breed-educatieve aanbod als in het educatieve aanbod voor scholen te integreren.Met de EDUbox levert VRT thematische pakketten die educatieve video’s, audiofragmenten en ander digitaal lesmateriaal bevatten. Deze boxen zijn afgestemd op diverse vakken en leeftijdsgroepen en bieden leerkrachten kant-en-klare tools om boeiende lessen te geven.Meer weten? Lees ook deze artikelsEducatieWetenschap is overal: VRT viert mee 600 jaar KU Leuven Educatie | InnovatieNeem een kijkje achter de knoppen in de studio van Knappe koppenEducatie | Jongeren'De campus cup' komt terug!EducatieEDUbox Burgerschap: Van kleine acties tot politiek engagementEducatie | JongerenGloria Monserez neemt afscheid als Ketnet-wrapperJongeren | EducatieSamen studeren op relaxe lofi-beats in Bar Madam? Dat kan!EducatieVRT en Smartschool slaan handen in elkaar EducatieHet EDUbox-aanbod voor first time voters: kieswijsheid in een educatief jasje Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
