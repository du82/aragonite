full_description = "Home/Over ons/Onze organisatieOnze organisatieBeleidWat zijn de basisprincipes van het VRT-beleid?We volgen beroepsethische principes, we handelen op een sociaal verantwoorde manier, we zetten in op duurzaamheid, we doen aan maatschappelijk verantwoord ondernemen en we zetten functionele kwaliteit en operationele kwaliteit op de eerste plaats.FinanciënWat zijn de middelen van VRT? OrganogramWie zit in de VRT-directies en wat doen ze?ReclameregieVoor de werving van reclame en sponsoring steunt VRT op twee reclameregies. Voor de werving van radioreclame en van radio- en televisiesponsoring is dit de Var: een 100% dochteronderneming van de NV VRT. Voor de commercialisering van digitale producten is dit Ads & Data. VRT JobsWil jij werken voor VRT?Werken bij VRT betekent werken bij een dynamisch en innovatief bedrijf. Je komt terecht in een uitdagende werkomgeving, waar heel wat groeimogelijkheden zijn. Of je nu komt als programmamedewerker, video-ingenieur of jurist, bij VRT krijg je alle kansen! Lees meerGeschiedenisHier ontdek je alles over de geschiedenis van de Vlaamse publieke omroep. Met archiefbeelden, de historische jaarverslagen en nog veel meer. Duik in het rijke VRT-archiefContacteer VRTHeb je een vraag, klacht of suggestie voor VRT? De kans is groot dat je op deze pagina je antwoord vindt.Contacteer onsDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
