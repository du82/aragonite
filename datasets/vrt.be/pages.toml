["https://vrt.be/nl/over-ons/nieuws-over-vrt/radio-1-zet-met-nieuw-logo-en-nieuwe-huisstijl-ook-volop-in-op-digitale-platformen-en-veranderend-luistergedrag"]
title = "Radio 1 zet met nieuw logo en nieuwe huisstijl ook volop in op digitale platformen en veranderend luistergedrag | VRT"
full_description = "Home/Over ons/Nieuws over VRT/Radio 1 zet met nieuw logo en nieuwe huisstijl ook volop in op digitale platformen en veranderend luistergedragRadio 1 zet met nieuw logo en nieuwe huisstijl ook volop in op digitale platformen en veranderend luistergedrag11 februari 2025Radio 1 brengt inhoud die je niet wil missenRadio 1 is bij uitstek dé contentradio van VRT. Radio 1 brengt verhalen die je niet mag missen. Informerend tot inspirerend en alles daartussen. De audioplek in Vlaanderen voor binnenlands- en wereldnieuws in actua en duiding, live – sport en verslaggeving, diepgravende ​ gesprekken en opmerkelijke verhalen die je meenemen door de dag.On demand en op maatRadio 1 biedt de rijke content live en lineair aan via FM en DAB+, maar ook steeds meer on demand en op maat van de luisteraar via de onlineplatformen van VRT MAX, VRT NWS en de Radio 1-app. Radio 1 komt daarmee tegemoet aan de behoefte van de luisterende Vlaming.Zo vind je op VRT MAX niet alleen alle podcasts van Radio 1, maar ook een rijk aanbod aan geselecteerde fragmenten met uitgesproken meningen uit de diverse Radio 1-programma's.De audiogebruiker weet de weg naar dit digitaal aanbod van Radio 1 ondertussen ook goed te vinden. Met bijna 800.000 fragmentstarts via de VRT-touchpoints ​ en 1,2 miljoen podcaststarts (op maandbasis, eind 2024) werd de stijgende trend in 2024 duidelijk gezet.Ook binnen het live online radioluisteren doet Radio 1 het zeer goed in bereik. Op VRT MAX en in de radio-apps, maar ook op andere platformen, is Radio 1 het grootste VRT-net. In 2024 kende Radio 1 live, online een groei van 12% tegenover 2023.Nieuwe vormgeving ondersteunt verdere digitale groeiDie digitale groei wil Radio 1 met veel ambitie verder zetten in 2025. Met een nieuw logo en een nieuwe huisstijl sluit Radio 1 aan bij de recente vernieuwing van de VRT-vormgeving en de huisstijlen van de andere VRT-merken. Op die manier wordt de radiozender van VRT net een beetje meer familie van de rest van de publieke omroep. Het blauw-violet kleurenpalet sluit aan bij de tinten van VRT NWS en de krachtige, gestileerde ’1’ staat voor de unieke audioreferentie voor actua, duiding en sport.De nieuwe vormgeving stelt Radio 1 in staat om in een digitale wereld te blijven evolueren. Het logo en de bijhorende huisstijl zijn helemaal gemaakt voor alle digitale platformen die we vandaag en in de toekomst gebruiken.Het nieuwe Radio 1-logo kwam tot stand door een samenwerking tussen VRT en het gerenommeerde internationale bureau Saffron en branding agency Mirror Mirror. De nieuwe stijl is vanaf 11 februari overal te zien: op VRT MAX, VRT NWS, op DAB+, op de Radio 1-app en de socials. ​ En vanaf vandaag ook via een postercampagne in Antwerpen, Leuven en Brussel.Valentijnsweekend ​ op Radio 1Deze 'stomende' content zal het op Valentijnsdag 14 februari ongetwijfeld ook goed doen live én on demand:Valentijn brengt bij Radio 1 verhalen over artiesten die de lakens deelden, romantische liedjesteksten en jouw eigen amoureuze verhalen.In Classic love stories tussen 9 en 11 uur kiezen bekende muzikanten hun favoriete liefdeslied, maar ook jij kan je meest romantische muziek met ons delen. Welk nummer kleeft voor altijd vast aan jouw mooiste liefdesavontuur? Stuur het door via de Radio 1- app of via Radio 1 op VRT MAX.In de Nieuwe feiten valentijnsspecial van 11 tot 13 uur nemen Lieven Vandenhaute en co-host Rika Ponnet allerlei soorten liefde in het vizier. Ben jij een romantische ziel? Of simpelweg geïnteresseerd in menselijke relaties? Naast een hoop boeiende observaties van experten in het vak, worden ook aartsmoeilijke relatiedilemma’s van luisteraars ontrafeld. Als dat je hart niet sneller doet slaan.Wie niet genoeg kan krijgen van romantische liefdesliedjes kan op de Radio 1 Classics stream terecht voor een hele dag 'lovesongs'.Op vrijdag 14 februari wordt de Vlaamse minstreel bij uitstek, Raymond van het Groenewoud, 75 jaar.Radio 1 vierde hem ook bij zijn 60ste en 70ste verjaardag, dus op 75 wordt Raymond extra in de bloemetjes gezet tijdens een exclusieve Radio 1-sessie.Van 18 tot 20 uur blikt Ruth Joos in Raymond 75 van 18 tot 20 uur samen met de artiesten en diverse gasten vooruit op de Radio 1- sessie. ​Om 20 uur kan je de Radio 1- sessie Raymond 75 vanuit de Stadsschouwburg in Brugge live beluisteren. Raymond ontvangt voor zijn verjaardagsconcert Naima Joris, Lara Chedraoui, Merol, Daan, Bert Ostyn (van Absynthe Minded), Meltheads en hoboïst Marcel Ponseele. Op Radio 1, in de Radio 1- app, en via Radio 1 op VRT MAX.600 jaar KU Leuven op Radio 1 - VoorproeversIn het kader van Wetenschap is overal viert VRT mee 600 jaar KU Leuven. Voorproevers staat op 15 februari helemaal in het teken van de viering. ​ Annemie Peeters ontvangt 3 alumni van de alma mater: Klaas Delrue en Geert Noppe van Yevgueni en de vader van Klaas, Dries Delrue. De drie gasten studeerden pedagogie. Annemie heeft het met hen over de evolutie van de universiteit en de opleidingen. Met Dries Delrue heeft Annemie het ook over Mei '68, de woelige jaren van KU Leuven. ​Yevgueni ontstond ook, exact 25 jaar geleden, aan de KU Leuven. De band won toen het Interfacultair Songfestival.De nacht op Radio 1Vanaf vandaag zal Radio 1 tijdens de nacht enkele programma's van de afgelopen dag herhalen. Vanaf middernacht worden De wereld van Sofie (maandag tot donderdag) en Zijn er nog vragen?(vrijdag) herhaald en om 5 uur 's ochtends (dinsdag tot en met vrijdag) krijgen de Nieuwe feiten een tweede run.Producties | Sport & ontspanningGelukkig gescheiden: leve de liefde na de liefdeSport & ontspanningSporza telt af naar het Vlaamse wielervoorjaarMuziekWereldradiodag: echt merci aan alle VRT-radiotoppers!Nieuws & informatieIn het spoor van VRT NWS-journalist Koen Wauters: “Wetenschap toegankelijk maken voor iedereen” Nieuws & informatieBjörn Soenens maakt voor VRT theatertour over AmerikaCultuur | MuziekKlara stelt jong talent voor in vijfde editie van De Twintigers EducatieWetenschap is ove