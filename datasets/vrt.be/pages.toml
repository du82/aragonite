["https://vrt.be/nl/over-ons/nieuws-over-vrt/chloe-van-de-klantendienst-ja-hoe-doet-zon-minister-eigenlijk-haar-behoefte"]
title = "Chloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’ | VRT"
description = "Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Chloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’18 december 2024Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 3.952 keer contact opgenomen met onze dienst. Zo kregen we vragen over Het huis (“Kan Eric Goens eens minder blijven hangen in sensatieonderwerpen zoals de paters bij Arnout Hauben of het seksleven van Ruben Van Gucht?”), over Dagelijkse kost (“Moet er nu altijd een stinkende teen knoflook in? Persoonlijk vind ik het een zeer overgewaardeerde knol.”) en over Hertoginnedal “Die ministers verdienen toch genoeg en dan ga je ze nog wat in de watten leggen met belastinggeld!”. Klagers krijgen een standaardantwoord.BadkamerbusVerschillende kijkers van De Columbus stellen zich vragen over het sanitaire gemak van de gasten van Wim Lybaert. “Ik begrijp dat het niet op tv hoeft getoond te worden, maar hoe gaan de gasten en Wim naar het toilet/douche indien nodig? Volgt er nog een tweede badkamerbus mee?”En deze kijker maakt zich nog meer zorgen. “Sedert jaren zijn wij trouwe kijker en al jaren spookt er een vraag door ons hoofd: waar is het toilet in de Columbus? Wij kunnen ons niet voorstellen dat bijvoorbeeld Hilde Crevits eventjes langs de weg …….”Ja, hoe doet zo’n minister eigenlijk haar behoefte? Want ik kan me vergissen, maar volgens mij heb ik in de lessen biologie geleerd dat de anatomie van hoogwaardigheidsbekleders gelijk is aan die van elke andere mens. Dus, als Hilde Crevits een goed trucje heeft om eventjes langs de weg - puntje, puntje, puntje - dan lijkt me dat volstrekt doenbaar.Dus heb ik de vraag gewoon voorgelegd aan de reisleider zelf. “Heeft de Columbus een wc? En zo nee, ja, waar gaat pakweg Hilde Crevits dan naar toilet?”Zijn antwoord is evenveel zeggend als onbeduidend. “Dat is één van de mysteries van de Columbus!” Hemeltje. Er zijn dus nog méér mysteries! Ik kan alleen maar hopen dat er voor het doen van een boodschap, groot of klein, een eenvoudige doch zinvolle oplossing is. Het ei van Columbus, als het ware. Ziek van muziekDan zijn er nog wat klachten over de manier waarop VRT informatie verspreidt. “Graag wil ik jullie meedelen dat ik mij mateloos erger aan de wijze waarop aan onbewuste beïnvloeding wordt gedaan via het beeld van het weerbericht. Ogenschijnlijk zonder betekenis, stelt deze voorstelling de tweedeling van ons land in de kijker. Ik vind dit ongehoord. We leven toch nog in één land, of heb ik het verkeerd???”U heeft het helemaal bij het rechte eind. Alleen, onze omroep wordt ingericht door de Vlaamse overheid en deels gefinancierd met belastinggeld. Dus moeten we in de eerste plaats alle Vlamingen bedienen, zonder daarmee een waardeoordeel te hechten aan deze zogenaamde tweedeling. Een radioluisteraar wordt er naar eigen zeggen “ziek van” om iedere keer naar de radio te lopen om het volume uit te zetten als er weer een plaatje wordt gedraaid. “Zijn jullie nou echt bang dat mensen weglopen als er geen muziek te horen is?” Volgens mij is dit de eerste keer in de geschiedenis van de omroep dat een luisteraar klaagt over het te weinig aan babbelen.En dan stelden verschillende mensen zich de vraag of het ongeval van Tom Waes wel zoveel aandacht moest krijgen. “Wat is hij meer dan iemand anders dat wij ieder uur moeten geüpdatet worden over zijn toestand?” Of: “Ik vraag ik mij af of dit persoonlijk gegeven en dan vooral zijn gezondheidstoestand dergelijke media-aandacht behoeft.” En ook: “De berichtgeving over het ongeval van Tom Waes voelt echter al van bij aanvang wrang en sensatiegericht.”Het antwoord is simpel. Tom Waes is een publiek figuur, bij ons en zelfs in Nederland. VRT NWS had inderdaad veel aandacht voor het ongeval, maar gebruikte het ongeval ook als aanleiding om het te hebben over botsabsorbeerders, de veiligheid van oudere auto’s in vergelijking met nieuwe, en gevaarlijke verkeerssituaties in de buurt van wegenwerken. Ook die aanpak vinden we verdedigbaar. Zonder het zelf te beseffen, heeft Tom hier een soort BOB-campagne afgetrapt. Wie kan daar tegen zijn?Nuchtere frisheidEn ook Ben Crabbé en zijn Blokken blijven de gemoederen beroeren met opnieuw de voorspelbare klachten. “Waarom draagt Ben Crabbé het vlammetje van De Warmste Week op zijn MOUW en niet op de REVERT van zijn jas zoals iedereen? ALTIJD TEGENDRAADS is deze persoon!” Of deze: “Hoe komt het dat Crabbé altijd zo’n kleine vestjes aan heeft en de kleuren niet bij elkaar passen?” En zijn opmerking over Simon & Garfunkel viel in minstens één verkeerd keelgat. “Hij zal die band maar uitmaken met zijn dwaas na-aapgezang en zijn braakgebaar! Hij moest zich schamen!!!” Uitroepteken, uitroepteken, uitroepteken.Gelukkig vallen er regelmatig ook complimenten in onze mailbox, deze keer aan het adres van Otto-Jan Ham en zijn VRT Canvas-reeks Drugs dus. “Mijn (broodnuchtere sinds 6 maanden) complimenten voor je programma. Je brengt het zo ontwapenend dat de boodschap binnenkomt. Voor mij kwam het binnen als 'goed bezig' en 'ja, ik ben zo dankbaar voor cadeau Nuchtere Frisheid.' Bij mijn omgeving dringt het eindelijk ook door, bij jongeren wat moeilijker (misschien wat jonge nuchtere influencers op toneel voeren). Maar iedereen ziet pas op zijn tijd het licht aan het einde van de tunnel.” Daarom: proficiat Otto-Jan met jouw persoonlijke BOB-campagne en de Chloë Complimenten Wisselbeker!Tot slot vraagt een kijker van VRT NWS journaal waarom Fatma Taspinar “een Star Trek-uniform draagt”. Wees gerust, dat is niet het soort popcultuur-referentie waar ik haar van verdenk.Fijne feesten. En wie rijdt, drinkt niet.Chloë van de KlantendienstColumnChloë van de KlantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
