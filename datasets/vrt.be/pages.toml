["https://vrt.be/nl/ons-aanbod/ketnet"]
title = "Ketnet | VRT"
description = "Ketnet is het 360°-kinderaanbod van de Vlaamse publieke omroep VRT. Ketnet brengt lokale content, interactie en beleving met een unieke meerwaarde, zowel online als op televisie en tijdens events. Ketnet is er voor alle kinderen tot twaalf jaar, met Ketnet Junior als submerk voor kinderen tot zes jaar."
full_description = "Home/Ons aanbod/KetnetKetnetKetnet wil een transmediale beleving aanbieden die mee evolueert met alle kinderen in Vlaanderen en hen helpt om op te groeien tot zelfbewuste adolescenten.Ketnet is het 360°-kinderaanbod van de Vlaamse publieke omroep VRT. Ketnet brengt lokale content, interactie en beleving met een unieke meerwaarde, zowel online als op televisie en tijdens events. Ketnet is er voor alle kinderen tot twaalf jaar, met Ketnet Junior als submerk voor kinderen tot zes jaar. Ketnet verbindt kinderen met elkaar en met hun andere sociale cirkels. Het stimuleert hen om hun plek te vinden en zich te engageren in de samenleving. Ketnet helpt kinderen opgroeien tot zelfbewuste, autonome en gelukkige adolescenten.Ketnet biedt kinderen een wonderlijke wereld vol spel en verbeelding. Het merk zorgt voor een transmediale beleving, die meegroeit met elk kind in Vlaanderen. Het merk creëert een magische kosmos waarin zo goed als alles mogelijk is. Kinderen beleven in deze speeltuin kleine en grote avonturen en leren er op hun eigen tempo bij. De unieke meerwaarde van Ketnet zit vervat in de identiteit van het merk. Kinderen kunnen Ketnet volgen, bekijken en beleven, en dat op een veilige manier. Ketnet is van hier, dichtbij en tastbaar. Elk kind kan Ketnet ontmoeten op evenementen die worden georganiseerd om de beleving van deze magische wereld door te trekken. Zo biedt Ketnet kinderen een relevant en open venster op de wereld.Sinds de oprichting van het merk in 1997 wil Ketnet kinderen tot 12 jaar sterken, aanmoedigen en prikkelen bij hun emotionele en intellectuele ontwikkeling. Ketnet is de grootste supporter van elk kind en wil hen alles geven wat ze nodig hebben om op te groeien.Ketnet evolueert mee met kinderen, zodat ze opgroeien tot zelfbewuste adolescenten. Om dit te verwezenlijken, prikkelt het merk kinderen op maat van hun ontwikkeling, met een gezonde mix van plezier en educatie. Door rekening te houden met ieders vaardigheden en emotionele ontwikkeling slaagt het merk erin om kinderen te raken en reële impact te creëren. Opnames SkateOp maat van elk kindKetnet is er voor alle Vlaamse kinderen tot 12 jaar. Dat is een bijzonder diverse en omvangrijke doelgroep, met kinderen die zich in allerlei verschillende ontwikkelingsfases bevinden.Om relevant te kunnen zijn voor al deze kinderen, zorgt Ketnet dat het aanbod afgestemd is op de verschillende leeftijden, ontwikkelingsfases, behoeften en interesses. Het merk heeft een expert in de ontwikkelingspsychologie in huis en werkt daarnaast ook samen met allerlei experten in uiteenlopende domeinen. Hun kennis en advies wordt door Ketnet omgezet naar een brede waaier van programma’s, projecten en evenementen voor Ketnet Junior (tot 6 jaar) en Ketnet (van 6 tot 12 jaar). Beleef de wereld van KetnetKijk nu opVRT MAXRelevant blijven door een doordachte platformkeuzeHoe kinderen media consumeren, verandert razendsnel. Het is voor Ketnet een constante uitdaging om mee te zijn met die trends en aanwezig te zijn op de platformen waar kinderen zich bevinden. Daarom bouwt Ketnet aan een volwaardig digitaal ecosysteem dat beantwoordt aan het snel veranderende mediagedrag van kinderen.Dat Ketnet verhoogde aandacht geeft aan het digitale aanbod wil natuurlijk niet zeggen dat de lineaire inspanningen in het gedrang komen. Televisie is en blijft een belangrijk medium, waar Ketnet ook volop zal blijven opzetten. Een verbindend, stimulerend en onderscheidend aanbod op maatKetnet heeft vijf kernwaarden geformuleerd die het merk moeten inspireren en stimuleren om zijn opdracht uit te voeren. Ketnet is:verbindend. Het merk zorgt voor betrokkenheid en geeft het gevoel onder vrienden te zijn.stimulerend. Wat Ketnet brengt, is toegankelijk en herkenbaar, en tegelijk uitdagend en grensverleggend. Zo leren kinderen hun mannetje te staan.fascinerend. Bij Ketnet kan je je aan alles verwachten: spanning, grapjes, romantiek en fantasie. Elke dag levert iets nieuws, zodat kinderen kunnen blijven dromen.positief. Doemdenken en pessimisme krijgen geen plek bij Ketnet, ook als het over de hobbels in het leven gaat. Er is altijd duiding, zodat kinderen hoopvol kunnen blijven.ontspannend. Ook kinderen hebben behoefte om te ontsnappen aan hun drukke leven met veel indrukken. Bij Ketnet kunnen ze even lekker achterover zakken en een kleurrijke, grappige en leuke wereld op zich af laten komen. Ketnet in een notendopKetnet verwezenlijkt zijn opdracht door elke dag opnieuw aandacht te schenken aan de volgende zaken:Eigen productiesKetnet zet in op producties van hoge kwaliteit en eigen bodem, zoals #LikeMe, De Raad van Soekie, Skate en GameKeepers. Vlaamse, duurzame fictie krijgt steeds vaker een plaats in het aanbod, en Ketnet gaat alsmaar actiever de rol van coproducent van Vlaamse animatiereeksen op zich nemen.Gala van de Gouden K'sMaatschappelijk relevantKetnet kiest voor maatschappelijk relevante programma’s. De onderwerpen en verhaallijnen weerspiegelen de maatschappij en zijn herkenbaar voor veel kinderen. Verliefd zijn, een ziek familielid, pesten op school of plezier met je vrienden, al deze thema’s zijn uit het leven gegrepen en net daarom zo boeiend.Karrewiet is het programma bij uitstek dat de maatschappelijke actualiteit op de agenda zet. Karrewiet is het kinderjournaal waarin nieuws wordt gebracht op maat van kinderen. Dat nieuws op maat is cruciaal om kinderen op de hoogte te houden van wat er gebeurt in de wereld waar ook zij deel van uitmaken. Wekelijks bereikt Karrewiet zo’n een op de vijf kinderen tot 12 jaar.Meer dan een programmaBeleving krijgt een steeds prominentere plaats in het aanbod. Evenementen zoals de Ketnet Zomertour, Ketnet Halloween, het Gala van de Gouden K’s brengen de wereld van Ketnet tot bij kinderen. Mobiliserende acties zorgen ervoor dat Ketnet actief deel uitmaakt van de leefwereld van kinderen, de sociale cohesie versterkt en het empathisch vermogen stimuleert. Denk bijvoorbeeld aan De Pet op tegen Kanker, Stampen voor vrede en STIP IT!. De getuigenissen en duiding, gekoppeld aan een actie zoals de pet opzetten of vier stippen op hun hand zetten tegen pesten, zorgen ervoor dat kinderen zich leren engageren voor een ander, zich leren verplaatsen in de leefwereld van leeftijdsgenootjes die het moeilijker hebben. Daarin schuilt de meerwaarde van Ketnet. Een greep uit het aanbod van KetnetExtra aanbodVoor kinderen: Ketnet hits is de digitale radiostroom met muziek voor kinderen te beluisteren via VRT MAX.De Ketnet Junior-app biedt Ketnetprogramma’s en -spelletjes voor de allerkleinsten aan. De app is beschikbaar voor tablets en is beschikbaar voor iOS en Android. Gratis!Voor ouders en onderwijs:Op Ketnetvoorouders.be vind je alle info over de Ketnet-evenementen, doe-tips, wedstrijden,… Maar ook heel wat informatie rond mediawijsheid of materiaal om in de klas mee aan de slag te gaan. Of gewoon de laatste Ketnet en Ketnet Junior-nieuwtjes.LespakkettenKetnet ontwikkelt regelmatig lespakketten voor gebruik in het lager onderwijs. Deze pakketten sluiten aan bij de Ketnet-programma's. De lespakketten vind je voortaan hier terug.Ketnet JuniorKetnet Junior is het submerk van Ketnet dat zich richt tot peuters en kleuters in Vlaanderen. Ketnet Junior biedt een gratis en reclamevrije transmediale beleving ‘op maat’ van deze allerkleinsten, met Vlaams lokaal geproduceerde producties en met een uitzonderlijke meerwaarde. Ketnet Junior vertrekt immers steeds vanuit de ontwikkeling van het kind met als doel het een breed spectrum aan ontwikkelingsvaardigheden van peuters en kleuters te stimuleren.Vaste waarden zijn onder andere Tik Tak, Kaatje, Bob de Bouwer, Bumba, Vos en Haas, Sarah, Samson en Marie en Ridder Muis.Ketnet Junior is in de ochtend te vinden op Ketnet en overdag met een herhaling van de programma's op het kanaal van Canvas.Ontdek de magie van Ketnet JuniorKijk nu opVRT MAXOnline Online is Ketnet Junior er altijd en overal, via KetnetJunior.be en via de gratis Ketnet Junior-app voor tablet en smartphone. De app zet in op ‘spelen’ en ‘kijken’ en heeft speciaal voor de ouders een aantal handige toepassingen om het online kijkgemak te verhogen. Een geprogrammeerde stream, waardoor je binnen de app dezelfde ervaring krijgt als op televisie Een playlist van meerdere afleveringen per programma, voor kleuters die maar niet genoeg krijgen van hun favoriete figuren Een timer, waardoor ouders in dialoog met hun kind kunnen bepalen hoe lang de app gebruikt mag worden De mogelijkheid om programma’s vlotter te streamen naar een ander, groter scherm Ketnet Junior heeft ook een eigen kanaal op YouTube. Dit volledig reclamevrije kanaal bevat een uitgebreide bibliotheek van programma’s en muziekvideo’s van Ketnet Junior. Beleving Beleving krijgt een steeds prominentere plaats in het aanbod. Evenementen zoals Ketnet Junior Carnaval en de Tik Tak-expo brengen de wereld van Ketnet Junior tot bij kinderen. Duik in het Ketnet aanbod op VRT MAXKijk nu opVRT MAXGerelateerde nieuwsartikelsNieuws & informatieSarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapperSport & ontspanningSpetterende optredens op het Gala van de Gouden K'sOver VRTDe Ketnet-kroket komt terug!Over VRTHallo kroket!: de terugkeer van live avontuur op KetnetSport & ontspanningOntdek de genomineerden voor het Gala van de Gouden K'sVerken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
