["https://vrt.be/nl/ons-aanbod/sporza"]
title = "Sporza | VRT"
description = "Sporza laat Vlaanderen toe om sportactiviteiten op elk niveau mee te beleven."
full_description = 'Home/Ons aanbod/SporzaSporzaSporza laat Vlaanderen toe om sportactiviteiten op elk niveau mee te beleven. Sporza is het aanbodsmerk voor sport van de Vlaamse publieke omroep VRT. Sporza brengt op een onpartijdige, onafhankelijke en betrouwbare manier sportnieuws, -verslaggeving en –duiding, zowel voor gedreven sportfans als voor gelegenheidsliefhebbers. Sporza zet ook in op sportbeleving. Het maakt van populaire sporten sociale gebeurtenissen en helpt het publiek minder populaire sporten te ontdekken en waarderen. Sporza verzorgt een gedifferentieerd en multimediaal sportaanbod via de kanalen van de andere aanbodsmerken van de VRT, zijn eigen mediaplatformen en sociale media. Sport brengt mensen dichter bij elkaar en zorgt voor een sterk gevoel van verbondenheid. Dat besef heeft de VRT geïnspireerd om een apart sportmerk op te nemen in haar merkenportfolio: Sporza. Sporza is hét Vlaamse sportmerk bij uitstek, voor zowel de rasechte liefhebber als mensen die minder intensief met sport(nieuws) bezig zijn. Iedereen die wil weten wat er zich in de sportwereld afspeelt, vindt in Sporza een betrouwbare partner. In essentie biedt Sporza sportnieuws- en duiding en creëert het merk een rijke beleving bij de (live) verslaggeving van allerlei sporttakken. De expertise van het merk zit vervat in die vakkundige combinatie van nieuws, duiding, beleving en ontspanning van populaire en minder populaire sporten Nieuws in verschillende vormen Het informatieaanbod van Sporza is te vinden op drie platformen: televisie, radio en online. De inspanningen online zijn de laatste jaren opgedreven. Sporza heeft zo zijn positie op sociale media versterkt en zijn aanwezigheid op YouTube verhoogd. Het merk speelt daarnaast ook succesvol in op nieuwe trends. Sportnieuws en -duiding hebben bij Sporza verschillende verschijningsvormen. Enerzijds is er het harde sportnieuws (in journaals, op radio en online), de live verslaggeving en analyses (met aandacht voor verdieping én ontspanining) van verschillende sportwedstrijden en -disciplines. Anderzijds is er ook het minder urgente, ‘zachte’ sportnieuws, bestaande uit advies en ondersteuning bij de productie van documentaires en series die te maken hebben met sport. Meer weten? Lees ook deze artikelsEen driepunter en daar is zowat alles mee gezegd: Luis Vazquez verlost Anderlecht uit zijn lijden in CharleroiLIVE: Minda schenkt Cercle Brugge verdiende gelijkmaker tegen WesterloBlessuregolf bij Anderlecht houdt aan: Dolberg en Edozie liggen weer in de lappenmand"Erin! Of toch niet?": Charleroi ontsnapt in onwaarschijnlijke flipperkast aan knullige goal tegen AnderlechtVal van Lindsay De Vylder verpest ploegkoers in Zolder, België sluit EK baanwielrennen af met 3 medaillesTottenham legt Man. United over de knie in duel der doodzieke topclubsNa zijn eerste assist ook nog zijn 10e goal: Dodi Lukébakio vuurt zichzelf naar dubbele cijfers in SpanjeWat een week voor Rayane Bounida: daags na nieuw contract viert Belgisch toptalent debuut in hoofdmacht van Ajax2 straffe reeksen afgebroken: KV Mechelen kan weer winnen, uitgerekend bij "onklopbaar" UnionEerste koersdag en meteen prijs: niet Arnaud De Lie maar Milan Fretin is de snelste in Almeria"Te weinig kennis of we worden moedwillig benadeeld": Dirk Kuyt neemt arbitrage op de korrelLeider Oostende incasseert stevige tik van Zwolle in BNXT League, achtervolger Kortrijk hijgt in de nekOndanks slechts 8 tv-zeges is seizoen van Pauwels Sauzen geslaagd: "Onze suprematie van paar jaar geleden was erover"Matig Liverpool sleept moeizame zege over de streep tegen verdienstelijke WolvesGent heeft late (lichte) handspenalty nodig om afstand te kunnen nemen van BeerschotGeen hoek te scherp voor doelpuntenmaker Didier Lamkel Ze: "Ik wist dat Mignolet ver uitkomt"Ultieme krul van Tzolis schenkt Club Brugge alsnog een puntje bij STVVKloof van 8 punten op Genk baart Nicky Hayen zorgen: "Mogen niet rekenen op play-offs zoals vorig jaar"OH Leuven pakt gouden degradatiedriepunter dankzij late ommekeer tegen DenderAntwerp heeft weer iets meer zuurstof in de top 6, geen Vanderhaeghe-effect bij KortrijkLees meer opSporzaInspirerende voorbeelden Sportverslaggeving doet meer dan louter informeren. Sport inspireert, geeft mensen voorbeelden om naar op te kijken. Zien sporten, doet sporten. De grote aandacht die uitging naar de successen van Belgische sporters inspireerde heel wat jonge kinderen om zich in te schrijven in sportclubs. Dat illustreert de kracht van sportverslaggeving goed: successen van atleten in de kijker zetten, inspireert mensen om zelf een actievere levensstijl op te nemen. Sporza schenkt daarbij speciale aandacht aan de prestaties van Belgische atleten. Disciplines waarin zij uitblinken, probeert het merk zoveel mogelijk aandacht te geven. In de praktijk lukt dat echter niet altijd. Sporza kan niet alles uitzenden wat het merk zou willen, omdat Sporza niet altijd over de noodzakelijke uitzendrechten beschikt. Verbondenheid centraal Sport brengt mensen samen, en Sporza wil die verbondenheid verder doortrekken door onder meer de interactiviteit met het publiek te stimuleren. Dat gebeurt bij uitstek via sociale media. Diversiteit als speerpunt Diversiteit in al haar verschijningsvormen is een speerpunt in de werking van Sporza. Concreet kan de diversiteit begrepen worden in termen van sportdiversiteit en gender. Sport wordt al eens – ten onrechte – gezien als een mannenwereld. Sporza wil een leidende rol spelen in het veranderen van dat imago. Dat doet het sportmerk onder meer door vrouwelijke voetbalanalisten in te zetten (als eerste in Vlaanderen), meer aandacht te geven aan vrouwensporten en de prestaties van de Belgische vrouwenteams uit te lichten. Sporza probeert daarnaast ook sporten met een kleiner draagvlak (minder beoefenaars of een beperkt publiek) een platform te geven. Zo maken mensen kennis met sporten die minder voor de hand liggen. Gemiddeld komen in Sportweekend en op sporza.be ruim 30 verschillende sportdisciplines aan bod, gaande van voetbal en wielrennen tot gymnastiek, handbal, boksen, zeilen, jumping… Concreet voert Sporza een actief programmeringsbeleid om sporten met een kleiner draagvlak te promoten. Samenvattingen van zulke sportdisciplines worden gekoppeld aan populaire sportevenementen. Sporza zal bijvoorbeeld een verslag over handbal of atletiek brengen voor of na een wielerwedstrijd. Zo bereikt een ‘kleine sport’ veel meer kijkers dan wanneer ze niet in combinatie met die populaire sport zou worden uitgezonden. Ontdek het sportaanbod van SporzaKijk nu opVRT MAXSamenwerkingen met federaties De Sporza-redactie overlegt geregeld met de diverse federaties en organisaties waarvan het merk evenementen bezoekt en/of uitzendt. Zo onderhoudt het merk veelvuldig contact met de voetbalbond en -liga, met andere federaties, met organisatoren van wielerwedstrijden en tennistoernooien, met individuele clubs... Sporza staat die federaties en organisatoren ook bij in de mediagerelateerde kant van hun organisatie en probeert te faciliteren waar mogelijk, rekening houdend met het budgettair kader en sportrechten. Sporza werkt daarnaast ook samen met andere media- en distributiebedrijven, zoals Medialaan en SBS, Eleven Sports, Telenet en Proximus. Die overeenkomsten hebben voornamelijk betrekking op het uitwisselen van sportcontent en archiefbeelden. Dankzij de samenwerkingen staat Sporza als merk sterker in zijn schoenen en kan het merk zijn opdracht beter vervullen. Complexiteit door sportrechten Sporza streeft ernaar om op het huidige niveau minstens even aantrekkelijk en relevant te blijven voor alle sportminnende Vlamingen. Dat is niet altijd evident. De sportwereld is in hoge mate gebonden aan de complexiteit van sportrechten en stijgende financiële impact. Grote internationale spelers kunnen het moeilijker maken om uitzendrechten te verwerven, waardoor Sporza soms beperkt is in zijn werking en niet alles kan uitzenden wat het merk zou willenVerken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerSport en ontspanningVRT garandeert een universeel toegankelijk sportaanbod, versterkt sociale cohesie door sportverslaggeving en stimuleert sportparticipatie. Ontdek de podcasts van SporzaSporza DailyKopman90 minutesVandenbemptExtra TimeWielerclub WattageSporza KoersDat is fussballFichebakSporza RetroMeer op VRT MAXBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid.'
