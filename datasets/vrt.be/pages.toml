["https://vrt.be/nl/over-ons/nieuws-over-vrt/gelukkig-gescheiden-leve-de-liefde-na-de-liefde"]
title = "Gelukkig gescheiden: leve de liefde na de liefde | VRT"
description = "Vanaf donderdag 20 februari presenteert Steven Van Herreweghe het gloednieuwe&nbsp;Gelukkig gescheiden, een spannende en plezierige spelshow waarin 2 exen het tegen elkaar opnemen met als inzet: een droomreis. Klein detail: de kinderen hebben de bestemming gekozen, want wie er ook wint, zij gaan sowieso mee. Ze hebben namelijk een ouder in elk team. Het spel zal bepalen wie mee mag met de kinderen: team mama met haar nieuwe partner, of team papa met zijn nieuwe partner.&nbsp;​"
full_description = "Home/Over ons/Nieuws over VRT/Gelukkig gescheiden: leve de liefde na de liefdeGelukkig gescheiden: leve de liefde na de liefde14 februari 2025Vanaf donderdag 20 februari presenteert Steven Van Herreweghe het gloednieuwe Gelukkig gescheiden, een spannende en plezierige spelshow waarin 2 exen het tegen elkaar opnemen met als inzet: een droomreis. Klein detail: de kinderen hebben de bestemming gekozen, want wie er ook wint, zij gaan sowieso mee. Ze hebben namelijk een ouder in elk team. Het spel zal bepalen wie mee mag met de kinderen: team mama met haar nieuwe partner, of team papa met zijn nieuwe partner. ​Steven heeft ook alle mama’s, papa’s, plusouders en kinderen uitgebreid geïnterviewd. Doorheen het programma delen ze hun verhaal: hoe het was om uit elkaar te gaan, het verdriet en de boosheid die daarbij horen, hoe pakken ze het co-ouderschap aan, hoe was het voor de nieuwe partners om hun plaats te vinden, enzovoort. Dat ze met z’n allen samen een spel spelen in een blinkende tv-studio en zich de plagerijen van Steven laten welgevallen, bewijst dat ze door één deur kunnen, maar uiteraard is dat niet altijd zo geweest. Maar, zo toont Gelukkig gescheiden: na een breuk opnieuw gelukkig zijn en met elkaar overeenkomen ... het is niet evident, maar het kan. Een gedurfde spelshow die naast humor ook hoop en troost biedt; een quiz boordevol ontroering. Podcast Week om weekNaast het televisieprogramma maakte Steven Van Herreweghe ook de podcast Week om week. Daarin delen ‘gelukkig gescheiden’ ex-partners hun ervaringen over hoe ze hun relatie hebben beëindigd en hoe ze nu samen met hun gezinnen verder gaan in hun leven. Ze spreken openhartig over hoe het was om uit elkaar te gaan, het verdriet en de boosheid die daarbij horen, het opbouwen van een nieuwe relatie, het co-ouderschap en hoe het is voor nieuwe partners om hun plaats te vinden. De podcast biedt een frisse kijk op het onderwerp scheiding met getuigenissen van koppels die hebben deelgenomen aan het programma Gelukkig gescheiden.Gelukkig gescheiden is een programma van Panenka. Vanaf 20 februari op VRT MAX en elke donderdag om 20.40 uur op VRT 1.Vanaf donderdag 20 februari op VRT 1 en VRT MAXKijk nu opVRT MAXLees zeker ookMuziekRed Sebastian gaat voor België naar het Eurovisiesongfestival in Bazel met 'Strobe lights'ProductiesMan bijt hond: een inkijk in het dagdagelijkse maar niet alledaagse leven van de VlamingMuziekVan backstage in Vlaanderen tot in Bazel: de weg naar Eurosong 2025 Over VRTOntdek het voorjaar 2025 van VRT 1ProductiesVRT 1 lost eerste namen: deze bekende Vlamingen beklimmen de Kilimanjaro in 'De rugzak'MuziekWie maakt er kans op een MIA?ProductiesOntdek de eerste beelden van nieuwe fictiereeks 'This is not a murder mystery'Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
