["https://vrt.be/nl/over-ons/nieuws-over-vrt/hallo-kroket-de-terugkeer-van-live-avontuur-op-ketnet"]
title = "Hallo kroket!: de terugkeer van live avontuur op Ketnet | VRT"
description = "Na Kingsize live is het bij Ketnet tijd voor een nieuw hoofdstuk. Vanaf maandag 6 januari kunnen de Ketnetters kennismaken met Hallo kroket!. De dagelijkse liveshow zal van maandag tot en met vrijdag te volgen zijn op Ketnet, VRT MAX en YouTube Live. Isabel Kerki, Bram Warlop en Leonard Muylle, eindredacteurs bij Ketnet, en Bart Peeters, aanbodsverantwoordelijke non-fictie, geven ons een antwoord op onze meest prangende vragen over de gloednieuwe liveshow.&nbsp;"
full_description = "Home/Over ons/Nieuws over VRT/Hallo kroket!: de terugkeer van live avontuur op KetnetHallo kroket!: de terugkeer van live avontuur op Ketnet02 januari 2025Na Kingsize live is het bij Ketnet tijd voor een nieuw hoofdstuk. Vanaf maandag 6 januari kunnen de Ketnetters kennismaken met Hallo kroket!. De dagelijkse liveshow zal van maandag tot en met vrijdag te volgen zijn op Ketnet, VRT MAX en YouTube Live. Isabel Kerki, Bram Warlop en Leonard Muylle, eindredacteurs bij Ketnet, en Bart Peeters, aanbodsverantwoordelijke non-fictie, geven ons een antwoord op onze meest prangende vragen over de gloednieuwe liveshow. Het beste van twee werelden“Wat alvast niet verandert, is dat we de doelgroep centraal zetten”, steekt Bart van wal. “De Ketnetters, dat is waar het om draait. Maar hun mediagedrag en -consumptie is wel iets wat gigantisch snel evolueert. Hallo kroket! is een volgende stap in een continue evolutie. In het lineaire tijdperk zaten de Ketnet-wrappers tussen de programma’s met live wraps, en hadden ze daardoor een gidsfunctie. De kinderen geloofden dat de wrappers in de studio woonden, en dat ze daar de meest zotte avonturen beleefden. Vandaag, omwille van de digitale evolutie, bestaan er veel meer platformen. Hierdoor komen de wrappers nu veel meer gefragmenteerd in contact met de Ketnetters. Dat clubhuisgevoel zijn we daardoor ook gaandeweg wat verloren, en dat willen graag met de nieuwe liveshow opnieuw opwekken. Om een cliché te gebruiken: het beste van vroeger en nu gecombineerd.”Inhoudelijk draait het er vooral om om de connectie met de Ketnetters terug te vinden. “De Ketnet-wrappers zullen de kinderen mee op sleeptouw nemen in de Ketnet-wereld. Daarbij wordt er veel aandacht geschonken aan de leuke dingen die we bij Ketnet doen: programma’s, maar ook wedstrijden en evenementen. Via Hallo kroket! willen we tonen dat we trots zijn op het aanbod dat we elke dag kunnen bieden aan ons doelpubliek”, vertelt Leonard. “Langs de andere kant staan we ook open voor de input van de kinderen zelf. Wat leeft er op de speelplaats? Hier steken wij veel van op, waar we dan vervolgens ook weer content rond kunnen maken. De leefwereld van de kinderen staat centraal. Hallo kroket! zal de plek zijn waar al het nieuws over Ketnet en de Ketnetters zich verzamelt. De Ketnetters worden daarnaast ook actief betrokken bij de show. Elke dag wordt er een spel gespeeld met een Ketnetter in de studio of via een videocall.”Live in een digitaal tijdperk Dat een liveshow een uitdaging is, moet je het team van Ketnet niet vertellen. “De keuze om weer live te gaan, brengt de uitdaging met zich mee om ook live publiek aan te trekken”, vertelt Isabel. “Er moet een afspraak gecreëerd worden om op het moment van uitzending te kijken en mee te doen. We merken dat samen met je familie voor de buis zitten weer een trend is. Live televisie maken is een manier om die binding weer te versterken. Het live-aspect is dus erg belangrijk, maar we willen het uitgesteld kijken ook niet uit het oog verliezen. Het is dus ook mogelijk om de show te herbekijken op VRT MAX.”“Dat herbekijken brengt ook meer uitdaging met zich mee dan je zou denken”, vult Bram aan. “Het programma mag namelijk niet frustreren als je uitgesteld kijkt. We willen interactiviteit stimuleren, maar je mag niet het gevoel hebben dat je alles hebt gemist wanneer je niet live kijkt. Dat zou averechts werken. De oplossing daarvoor hebben we gevonden in de vorm van een knop op VRT MAX. Door op de knop te duwen, kan je als Ketnetter aan de redactie laten weten dat je live aan het meekijken bent. Zo krijgen wij ook meteen een overzicht van alle Ketnetters die we zouden kunnen bellen om deel te nemen aan het spel van de dag. We hebben er wel steeds voor gezorgd dat de spellen uitnodigen om mee te spelen, ook als je niet aan de lijn hangt.”De terugkeer van de Ketnet-kroketEr werden al drie spellen op poten gezet om het programma te vullen. “Een eerste spel dat we bedacht hebben, heet Plet de kroket”, vertelt Bram. “Dit zal eruitzien als een lopende band waarop allemaal kroketten liggen. De Ketnetters moeten dan een hamer activeren door hard ‘Plet’ te roepen, zodat de hamer de kroketten plet. Een tweede spel dat we ontwikkeld hebben, is Eentje is geentje. Er zal een krokettenmuur aanwezig zijn in de nieuwe studio, en achter de wazige deurtjes moet de Ketnetter dan twee dezelfde snacks zien te vinden.” “Maar iedereen kijkt natuurlijk het hardst uit naar de terugkeer van de Ketnet-kroket”, vult Bart aan. “Vroeger kon je daarbij niet op voorhand weten welk antwoord het juiste was, en dus uit welk gaatje de kroket zou komen. Dat was puur gokken. Hier en daar natuurlijk wel gestuurd door de Ketnet-wrapper van dienst. Ben je zeker dat je voor het sterretje gaat?” “We willen nu wel meer evolueren, weg van het pure gokspel”, gaat Bram verder. “Het gidsen door de wrappers willen we wel behouden, want dat is nu eenmaal de kracht van de Ketnet-kroket. Maar we zullen nu eerder een Ketnet-vraag stellen waaraan je drie antwoorden kunt koppelen, met één juist antwoord. Weet je het antwoord? Dan weet je uit welk vormpje de kroket zal komen. Weet je het niet? Dan zal de wrapper je alsnog helpen om het juiste vormpje te vinden.”Een thema om je vingers bij af te likkenOok honger gekregen? Dat is geen toeval. “Je hebt ongetwijfeld al gemerkt dat alles in thema avondeten is”, vertelt Leonard. “Dat is een heel bewuste keuze. We zenden namelijk uit om 18u30, en willen graag inspelen op waar de kinderen op dat moment mee bezig zijn. Je huiswerk is net klaar, en je schuift aan tafel met je gezin. Of het avondeten zit er net op. We willen hiermee een signaal geven naar de Ketnetters dat wij op dat moment met hetzelfde bezig zijn. Ook dit is een manier om heel actief in te haken op de leefwereld van de kinderen.” Een nieuwe studio met veel hoekjes en kantjes “De mensen van VRT CRW hebben op korte tijd een prachtige nieuwe studio gebouwd. De oppervlakte blijft hetzelfde, maar het decor is volledig vernieuwd”, vertelt Bram. “De nieuwe studio is veel meer opgedeeld in verschillende hoekjes. Zo zitten er bijvoorbeeld bepaalde spelletjes in het decor ingebouwd, zoals de krokettenmuur. Maar er is ook een podium waar artiesten kunnen komen optreden. En ook de smos blijft bestaan. Dat is iets wat we in Kingsize live heel tof vonden, en wilden we dus behouden. Weliswaar in een nieuw jasje, dat beter aansluit bij het hele thema van Hallo kroket!. Eigenlijk kunnen we in de nieuwe studio alles doen wat we daarvoor konden, en meer.”“Er is ook de mogelijkheid om in de toekomst live vanop locatie uit te zenden via mobiele sets”, vult Isabel aan. “Zo zouden we bijvoorbeeld volgend jaar graag live ter plaatse verslag uitbrengen van De Warmste Koekenbak, in plaats van er een dagelijks magazine van te maken. Met de mobiele sets kunnen we ook live interventies doen, waarbij de wrappers gaan aanbellen bij Ketnetters thuis.”Achter elke sterke show, staat een sterke ploegDe gloednieuwe liveshow maken Isabel, Bram, Leonard en Bart niet alleen. “Ik denk dat je mag stellen dat er puur inhoudelijk elke dag een ploegje van ongeveer vijf personen de uitzending van die dag voor zijn rekening neemt”, vertelt Leonard. “En dan mogen we zeker de technische ploeg niet vergeten”, vult Bram aan. “Die zitten niet bij ons op de redactie, maar doen wel de show draaien. Dat is ook nog eens een ploegje van drie man: camera, klank en een allrounder. En dan natuurlijk ook onze zes Ketnet-wrappers.”“Het verschil met Kingsize live is dat niet alle wrappers presenteerden. Dat zal nu wel het geval zijn. Ze zullen elkaar afwisselen, dus elke dag presenteert één van de zes. We willen weer de indruk wekken dat de wrappers daar samenwonen en waanzinnige dingen beleven”, vertelt Bart. “We willen ook het gevoel geven dat de wrappers helemaal mee zijn met wat er op tv gebeurt”, vult Bram aan. “Ze kennen de verhaallijnen, weten welke aflevering het is, wat er vorige keer gebeurde en hoe spannend het is. Maar ook op de hoogte zijn van wat de kinderen bezighoudt, is een belangrijk aspect daarvan.”VideoHallo Kroket! op Ketnet, VRT MAX en YouTube-LiveKijk opVRT MAXNieuws & informatieSarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapperSport & ontspanningSpetterende optredens op het Gala van de Gouden K'sOver VRTDe Ketnet-kroket komt terug!Sport & ontspanningOntdek de genomineerden voor het Gala van de Gouden K'sJongerenGlamour en Noncha zijn verkozen tot Kinderwoord en Tienerwoord van het JaarJongerenBen je noncha of sigma? Of kan je goed yappen? What the skibidi!Over VRTHallo Kroket! Ketnet en Ketnet Junior zitten in een nieuw jasjeDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
