title = "Participatie | VRT"
description = "De Raad van Bestuur heeft in het najaar van 2013 een participatiestrategie goedgekeurd om te investeren in jonge, talentvolle productiehuizen. VRT wil daarmee hun groeipotentieel ondersteunen, duurzame talentontwikkeling mogelijk maken en innovatie in mediaconcepten en -formats stimuleren."
full_description = "Home/Over ons/Samenwerking/ParticipatieParticipatie De Raad van Bestuur heeft in het najaar van 2013 een participatiestrategie goedgekeurd om te investeren in jonge, talentvolle productiehuizen. VRT wil daarmee hun groeipotentieel ondersteunen, duurzame talentontwikkeling mogelijk maken en innovatie in mediaconcepten en -formats stimuleren. Onze opdracht De participatiestrategie maakt ook deel uit van de hefboomfunctie die de publieke omroep moet vervullen in de Vlaamse audiovisuele sector. De productiehuizen waarin geparticipeerd wordt, kunnen bovendien zonder problemen programma’s voor andere omroepen blijven maken.Participatie in Media-Invest In april 2018 hebben de participatiemaatschappij Vlaanderen (PMV) en VRT samen Media-Invest Vlaanderen opgericht. Beide organisaties bezitten 50% van de aandelen. Media-Invest wil de groei van beloftevolle ondernemingen in de mediasector, gedragen door een goed business plan en een sterk team, financieren en ondersteunen van bij de prille start. Media-Invest wil vooral investeren in de mediatechnologiesector: start-ups of bedrijven die innovatieve technologieën, producten, processen of diensten ontwikkelen en mediacontent-ondernemingen die focussen op storytelling, met een crossmediale aanpak. In het nieuwe fonds brengt VRT haar expertise rond media-innovatie, mediatechnologie en content; en brengt PMV haar kennis over investeringsbeleid, ondernemerschap in Vlaanderen en professionalisering van ondernemingen in.Overige participaties VAR is een 100% dochteronderneming van VRT. Meer informatie over VAR kan je vinden op de webpagina Reclameregie VRT heeft 33.3% van de aandelen van Digitale Radio Vlaanderen CV VRT is historische aandeelhouder van Belga VRT heeft een belang van 49% in de technologische start up Picky BV, het bedrijf achter de website en app van Dagelijkse kost. Samenwerkingen VRTSamenwerken met VRT: de strafste verhalen schrijven we niet alleen. Creative partnershipsReclameregieVoor de werving van reclame en sponsoring steunt VRT op twee reclameregies. Voor de werving van radioreclame en van radio- en televisiesponsoring is dit de Var: een 100% dochteronderneming van de NV VRT. Voor de commercialisering van digitale producten is dit Ads & Data. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
year_published = 2025
