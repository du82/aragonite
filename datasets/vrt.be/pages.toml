["https://vrt.be/nl/ons-aanbod/vrt-max"]
title = "Informatie over strafste aanbod van VRT MAX"
description = "Kijk én luister gratis naar het strafste aanbod van VRT. Van primetime tv-programma's, tot podcasts en live radiostreams. Ontdek het allemaal op VRT MAX, het online streamingplatform van VRT!"
full_description = '''Home/Ons aanbod/VRT MAXVRT MAXKijk én luister gratis naar het strafste aanbod van VRT. Van primetime tv-programma's, tot podcasts en live radiostreams. Ontdek het allemaal op VRT MAX, het online streamingplatform van VRT!De digitale kijk- en luisterbestemming van VRT VRT MAX is de digitale kijk- en luisterbestemming van VRT. Op VRT MAX geniet je van het strafste van alle VRT-merken. En dat altijd en overal. Van de meest snedige en actuele podcasts 's ochtends op je smartphone tijdens het pendelen, tot de meest ontspannende Vlaamse fictie- of docureeks 's avonds op het grote scherm in je luie zetel. Ontdek op Topreeksen en exclusief aanbod Naast Vlaamse en internationale topreeksen, zet VRT MAX ook in op exclusief audio- en videoaanbod voor jongere digitale doelgroepen. Bovenop een prikkelend videoaanbod brengt VRT MAX heel wat straffe podcastreeksen. Niet alleen ontspanning of maatschappelijke topics komen aan bod, maar ook genres zoals true crime en nieuwe formats, zoals shortform audio, hebben een centrale plaats op het platform.Het zotste kijk- en luisteraanbod op VRT MAXGa naarVRT MAXOok archief Geregeld brengt VRT MAX programma's uit het VRT-archief. Dat gebeurt als ze aansluiten bij de programmaschema's van de VRT-zenders of bij gebeurtenissen in de actualiteit.Toegankelijk Met VRT MAX heb je het beste van VRT meteen bij de hand. De app is toegankelijk ingericht voor iedereen en houdt rekening met de context waarin je je bevindt.De programma's met audiodescriptie of met Vlaamse Gebarentaal zijn ook beschikbaar via VRT MAX. De ondertiteling activeer je door op het ondertitelicoon te klikken.Veilig voor kinderenVRT MAX is ook voor kinderen een veilige omgeving. Via het VRT-profiel kan er voor de allerjongsten een profiel op maat worden aangemaakt, zodat ze veilig kunnen rondsurfen in een Ketnet- of Ketnet Junior-zone.MultiplatformVRT MAX is multiplatform uitgebouwd. Dat wil zeggen dat je VRT MAX kan gebruiken in je browser op je laptop, smartphone en tablet. De reeksen casten naar je favoriete toestel lukt via de smart-tv of settopbox van Telenet, Proximus en Orange.Op je smartphoneHet aanbod van VRT MAX is op smartphone en tablet te bekijken, waar en wanneer je maar wil. Dat kan via iOS (iPhone en iPad) en Android. De app is bruikbaar in heel Europa voor inwoners van België (met een Belgisch domicilieadres).Op je tv Naast de website en de mobiele app, is er een tv-app beschikbaar voor Android TV, Apple TV, Samsung TV en LG TV. Ook is de app beschikbaar op de laatste tv-boxen van Proximus, Orange en Telenet.Je kan VRT MAX ook op je tv kijken door te streamen naar je televisie. Dat kan via een Google Chromecast of via Apple AirPlay. De bediening verloopt via de VRT MAX-app op je smartphone en tablet of via de website op je computer. Meer info vind je hier.Via de websiteVRT MAX is ook beschikbaar als website en is raadpleegbaar op de meest voorkomende online platformen in de browser via www.vrtmax.be. InschrijvenOm gratis gebruik te kunnen maken van VRT MAX, hoef je je slechts éénmaal gratis te registreren met een VRT-profiel. Het gebruik is voorbehouden aan mensen met een Belgisch domicilieadres. Zonder aanmelden kan je steeds de live-kanalen van VRT 1, VRT Canvas en Ketnet bekijken, zowel op de site als in de app.Belg in het buitenland?Belgen zonder een Belgisch domicilieadres hebben niet automatisch toegang tot het aanbod van VRT MAX. Om van VRT MAX gebruik te kunnen maken zal je je als Belg eenmalig moeten registreren. Dat doe je door je identiteit in je VRT-profiel te bevestigen via het portaal van de Vlaamse overheid (itsme, e-id). Op die manier kan je ook in het buitenland genieten van al het moois op VRT MAX. Meer weten over VRT MAX in het buitenlandNieuwsbriefBlijf je graag op de hoogte van de nieuwste series en podcasts op VRT MAX? Schrijf je dan in voor de nieuwsbrief. Dat doe je door op de VRT MAX website helemaal onderaan je e-mailadres in te vullen. Heb je nog vragen over VRT MAX? Dan kan je hieronder een antwoord vinden:Wat is VRT MAX?Bij VRT MAX geniet je van de leukste series, podcasts en muziek. En dat allemaal gratis. Wij schetsen even voor je waarom VRT MAX er is voor iedereen.Op VRT MAX kan je online luisteren en kijken naar heel wat VRT-programma’s. Van televisiereeksen en films tot radio-uitzendingen en podcasts. Ben je benieuwd wat er in de wereld gebeurt? Bekijk dan onze nieuwsprogramma’s. Wil je ondersteuning om een programma te begrijpen? Dan is er voor jou audiodescriptie en Vlaamse Gebarentaal. VRT MAX is gratis.Is VRT MAX gratis?VRT MAX kost helemaal niets: met een profiel kan je alles gratis bekijken en beluisteren. Open de app of website, meld je aan met je VRT-profiel en geniet. Let op: als je toch moet betalen of bankgegevens moet doorgeven, neem dan onmiddellijk contact op met onze klantendienst.Profiel op VRT MAXAanmelden en registratieOm VRT MAX te gebruiken, heb je een profiel nodig. Hiermee kijk en luister je naar alles, zelfs als je in het buitenland bent.VRT-profielHoe meld ik me aan op VRT MAX?Kan ik VRT MAX bekijken in het buitenland?KidsprofielJe kan ook een kinderprofiel aanmaken op VRT MAX. Zo krijgen de kleinste kijkertjes een aangepaste selectie programma's en podcasts te zien.Ontdek nu de Ketnet- en Ketnet Juniorzone op VRT MAX. Een veilige plek vol series, verhalen, films en games voor de kleinsten. Maak eerst zelf een profiel aan om een kinderprofiel aan te maken. Zo maak je een kinderprofielt:Klik op het profielicoontjeKlik op ‘extra kind’Vul het profiel van je kind aan met een eigen figuurtje en profielnaam, geschikte programma's en de mogelijkheid om makkelijk verder te kijken en luisteren.Het profiel is klaar! Het kan even duren voordat je het overal in de app ziet.Jonger dan zes? Dan is er Ketnet Junior. Kinderen ouder dan zes komen bij Ketnet terecht. Wil je iets aanpassen? Geen probleem, dat kan via het VRT-profiel van de ouder.Maak een kinderprofiel aanHoe moet ik VRT MAX installeren? Op VRT MAX kan je kijken naar nieuwe afleveringen, mooie films, warme concerten, spannende reeksen en nog veel meer. Vind je je weg niet tussen alle kabels, aansluitingen en smart-tv's? Dan zijn wij er om jou te helpen. Lees hier hoe je VRT MAX moet installeren.Hoe gebruik ik VRT MAX?Hoe haal ik het meeste uit mijn VRT MAX-profiel? Waar kan ik programma’s vinden? Hoe voeg ik iets toe aan mijn lijst? Waarom wordt dit programma me aangeboden? We lijsten het allemaal voor je op!Kan je met je VRT-profiel naar VRT MAX kijken in het buitenland?Om VRT MAX in het buitenland te gebruiken, maak je een VRT-profiel aan. Luisteren naar podcasts en radio kan overal met een stabiele internetverbinding. Voor het bekijken van programma’s moet je in België wonen of de Belgische nationaliteit hebben. Dat kun je bevestigen door je woonplaats of nationaliteit te verifiëren. Volg deze stappen:Klik op het profielicoontje en daarna op ‘mijn gegevens'.Onder het tabblad ‘persoonsgegevens’, klik je op ‘bevestigen’ naast ‘nationaliteit’.Bevestig je nationaliteit via één van de opties.Heb je hulp nodig? Klik op ‘hulp nodig bij het aanmelden?’Belangrijk om te weten:Na het verifiëren van je woonplaats of nationaliteit kan het tot 2 uur duren voordat je extra programma's op andere apparaten (zoals TV of smartphone) kunt bekijken. Om dit te versnellen, kun je je op het betreffende apparaat af- en weer aanmelden.De meeste programma’s zijn beschikbaar (live of uitgesteld) vanuit het buitenland zodra je bent aangemeld, maar sommige series en films zijn alleen beschikbaar in België. Meer informatie en tips: VRT MAX in het buitenlandWat kan ik bekijken op VRT MAX?Op VRT MAX vind je alles van VRT: films, series, documentaires, nieuws, unieke reeksen en podcasts. Ook live radio en bijbehorende beelden zijn beschikbaar, zodat je niets mist.Wat kan je allemaal kijken op VRT MAX?VRT-reeksen: alles wat je ziet op VRT1 of VRT CANVAS vind je op VRT MAX. Zo bekijk je jouw favoriete reeksen op jouw eigen tempo.Extra reeksen: je vindt hier ook extra reeksen. Zo bieden we een uitgebreide mix van buitenlandse fictie, extra afleveringen van je favoriete reeksen, interessante documentaires en nog veel meer.Livestreams: live kijken kan nog steeds met VRT MAX. Je kan eenvoudig televisiekijken via onze livestreams per kanaal. Daarnaast bieden we regelmatig extra livestreams aan voor bepaalde evenementen of wedstrijden.Stiekem tussen de lakens of volume op max in de woonkamer? VRT MAX kan je bekijken op elk toestel. Haal alles uit je tv-avond met onze handleiding.Wat kan ik beluisteren op VRT MAX?VRT MAX is jouw plek voor alles van VRT: films, series, documentaires, nieuws, unieke reeksen en podcasts. Je kunt ook luisteren naar live radio en beeld bij die radio, zodat je nog meer op de eerste rij zit.Wat kan je allemaal luisteren op VRT MAX?Podcasts: Podcasts met je favoriete presentatoren, vertellers en verrassende gasten. Daar hebben wij er veel van! Daarnaast kan je ook genieten van buitengewone reeksen gemaakt door onze noorderburen.Live radio: Via VRT MAX kan je luisteren naar Radio 1, Radio2, MNM, Studio Brussel, Klara en al onze digitale radiozenders. Je kan eenvoudig naar de radio luisteren via onze livestreams per kanaal. Bovendien kan je makkelijk meekijken in de studio.Radioprogramma’s: Een radioprogramma gemist? Geen probleem. Via de kanaalpagina kan je radioprogramma’s herbeluisteren.Je kiest zelf waar en wanneer je podcasts of radio luistert: op je telefoon, televisie of zelfs in de auto.Hoe beluister ik radio op VRT MAX?Hoe gebruik ik VRT MAX als radioluisteraar? Waar kan ik mijn favoriete zender vinden? Hoe herbeluister ik een radioprogramma? Waar vind ik de afspeellijst? We lijsten het allemaal voor je op!Hoe beluister ik een podcast?Zin om je oren te laten genieten van spannende avonturen? Of net bijleren terwijl je andere dingen doet? Klinkt als muziek in de oren? Ideaal. Om alles uit je luisterervaring te halen, helpen we je even op weg.Luister in de auto naar VRT MAXWil je snel de achterbank entertainen voor ruzie #532 losbarst? Of na een vermoeiende dag meteen tot rust komen met een ontspannende podcast? Snel en vooral veilig VRT MAX opstarten is van groot belang in de auto. Het verkeer is al stresserend genoeg.Dus luister ook VRT MAX via Apple CarPlay en Android Auto.Wat heb je nodig?Een autoLiefde voor podcasts en radioJouw mobiel toestel waar de VRT MAX-app op staatiOSWerkt vanaf iOS 13Zet Siri zeker aanControleer of je auto compatibel is met CarPlayAndroidWerkt vanaf Android 8Controleer of je auto compatibel is met AndroidHoe werkt dat allemaal?Zonder kabelHeb je een fancy nieuwe auto, dan kan je draadloos verbinding maken tussen je mobiel toestel en je auto.Voor Apple CarPlay moet jouw auto drie dingen ondersteunen: Apple Carplay, Bluetooth én WiFi.Android Auto heeft een kleinere verlanglijst. Dan heeft jouw auto enkel ondersteuning nodig voor Android Auto en WiFi.Met kabelOndersteunt jouw auto geen draadloze verbinding? Geen probleem, ook met een kabel kan je Apple CarPlay of Android Auto gebruiken.Maak verbinding tussen je mobiel toestel en je auto via een kabeltje (= USB-kabel waar je ook je mobiel toestel mee oplaadt).Steek je kabel in de USB-aansluiting van je auto.Zet de autoradio aan, open VRT MAX en geniet van ons audio-aanbod.Wat kan je beluisteren?Podcasts die je al aan het beluisteren was, in de auto of op mobiel. Luister zonder onderbreking verder.Podcasts die je in 'Mijn lijst' zet.Gouden tip: je kan ze op voorhand al in je lijst zetten, zo ben je de best voorbereide chauffeur ooit.De meest populaire podcasts van het momentAlle radiostreams, 24 in totaalHet meest recente nieuws en verkeerVlaamse Gebarentaal op VRT MAXVRT MAX wil inzetten op toegankelijke content, voor iedereen. Daarom bieden we een deel van onze content aan met Vlaamse Gebarentaal.Je vindt een overzicht van alle programma’s met Vlaamse Gebarentaal via deze link of door ‘VGT’ in te typen in de zoekfunctie.Je krijgt een overzicht van alle programma’s met Vlaamse Gebarentaal. Deze programma’s kan je tot 30 dagen na uitzending te (her)bekijken.Kan ik bij een programma met Vlaamse Gebarentaal ook ondertitels bekijken?Dat kan, maar hou er rekening mee dat de ondertiteling en Vlaamse Gebarentaal niet volledig synchroon zijn. Vlaamse Gebarentaal is een taal met een eigen grammaticale structuur. De tolken maken een culturele en geen letterlijke vertaling. Vlaamse Gebarentaal en Nederlands zijn twee verschillende talen.Meer informatieAudiodescriptie op VRT MAXWat is audiodescriptie?VRT MAX zet in op toegankelijke content voor iedereen. Voor blinde en slechtziende gebruikers bieden we daarom een deel van onze programma's aan met audiodescriptie.Blinde en slechtziende gebruikers missen immers een deel van de (beeld)informatie. Daarom mixen we een extra commentaarstem in de klankband, mooi tussen de dialogen in. Die stem beschrijft wat er precies gebeurt, zonder al te nadrukkelijk aanwezig te zijn. Het geheel vormt een mooi luisterspel, zodat iedereen de gebeurtenissen kan volgen zonder het beeld te zien. Ook voor andere gebruikers kan het helpen om een programma te volgen. Als je staat te strijken bijvoorbeeld, of als je moeite hebt om je te concentreren, dan kan de extra commentaarstem je helpen om beter te kijken, zelfs met je ogen dicht.Hoe kan je programma's met audiodescriptie vinden?Alle programma’s met audiodescriptie kan je vinden via deze link. Je kan ze ook vinden door in de zoekfunctie ‘audiodescriptie’ in te typen.Meer informatieIk heb technische hulp nodigEen technisch probleem? Soms zijn foute cookies of fout opgeslagen VRT MAX-data de oorzaak.Cookies en data wissenAls je nog problemen ondervindt, helpen we je graag verder.Vind je niet wat je zoekt? Wat jammer. We verwijzen je graag door naar de klantendienst.Naar de klantendienstMeer weten? Lees ook deze artikelsJongerenVRT MAX kondigt derde seizoen Knokke off aan: "Ja, er komt een vervolg!"Nieuws & informatieDecember 2024: een absolute recordmaand voor VRT MAXSport