["https://vrt.be/nl/over-ons/nieuws-over-vrt/chloe-van-de-klantendienst-hiermee-de-eerste-en-dat-met-ons-belastinggeld-van-het-seizoen-binnen"]
title = "Chloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’ | VRT"
description = "Dinsdag 24 september 2024 Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Chloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’24 september 2024Dinsdag 24 september 2024 Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 2.708 keer contact opgenomen met onze dienst. “Video Killed the Radio Star” zongen The Buggles in 1979. Toch hebben ze ook 45 jaar na datum nog geen gelijk gekregen. Vooral de heropstart van het reguliere radioaanbod zorgt op alle netten voor de nodige wrevel. Luisteraars van Radio2 veroordelen de “kinderliedjes” die Peter Van de Veire draait in Goeiemorgen morgen!, presentatoren Ann en Daan “die bijna een uur zaagden over boeken kaften” en de “platte taal” van Rob Vanoudenhoven in “De Wait Watchers” (sic). Een klager meent dat hij beter zelf WinWin aan elkaar zou praten. “Ik heb het even gecheckt: dit radioprogramma duurt ongeveer 50 minuten, waaronder 37 minuten muziekjes, 5 minuten nieuws en reclame en de rest Xavietje T. Luister, dat kan ik ook. Goed verdiend, hè, met ons belastinggeld. Ik ben zeker niet jaloers.” Hiermee is de eerste “en dat met ons belastinggeld” van het seizoen binnen. Proficiat, klager! Let me google that for you Deze 14-jarige is willens nillens Radio 1-luisteraar. “Als ik met mijn pa onderweg ben naar het voetbal, zet hij altijd Radio 1 op. Ik vind dit saaie muziek. Wat kunnen jullie hieraan doen? Gelieve anoniem te behandelen.” Ik geef de opmerking door aan de muziekredactie. Intussen kan ik de jonge klager wel de #radio1bingo van Stany Crets op X aanraden. Iets West-Vlaams gevolgd door een Hip Hollands Meisje en dan iets van Spinvis? Dat zijn extra punten!Een liefhebber van Klara hekelt de presentatiestijl van Sander De Keere. “De heer De Keere is uitermate breedsprakerig maar stelt zich op als een schoolmeester en denkt dat hij les aan het geven is.” Een andere luisteraar vindt het lastig dat de namen van praatgasten van De liefhebber niet mee doorkomen in de DAB+-informatie. “Ik zet Klara aan en wil weten wie de persoon is die aan het woord is; met geen mogelijkheid te weten te komen. Is het zo ingewikkeld dat te vermelden? Ik verneem zojuist dat het Erik de Jong is, maar wie die mens is daar heb ik het raden naar.” Let me google that for you! (Het is Spinvis, maar zeg het niet tegen Stany Crets!) Maar zelfs Klara Continuo, onze digitale klassieke zender zònder presentatoren, deelt in de klappen. “Sinds enkele dagen moeten we om het uur de operette ‘Manon (Ich bin eine Frau, die weiß, was sie will)’ beluisteren! Ik word er zat van!” Een manier om niet te snel zat te worden, is van tevoren een limiet bepalen. Om verdere dronkenschap te voorkomen, vraag ik de samenstellers dan ook met deze overdaad rekening te houden. Intussen raad ik de luisteraar aan te ontnuchteren met Espresso. Dertien Kawtars, Sanders of Imanes Een appgebruiker van MNM vindt het “schandalig” dat hij voor een vraag aan de Klantendienst een invulformulier moet invullen. (Dat moet niet, je kan ook mailen naar hallo@vrt.be.) De klacht: “Is het normaal dat ik geen antwoord krijg op de chat van de MNM??” Nu krijgt MNM best veel berichten binnen via de app. Om die allemaal individueel te beantwoorden, hebben we zo’n dertien Kawtars, Sanders of Imanes nodig. Dat zijn leuke mensen, dus prima voor mij. Maar dat krijgt de omroep moeilijk uitgelegd in de begrotingsuitvoering. En dan is er een luisteraar van Studio Brussel die meent dat Joris Brys niet normaal en ontspannen kan praten. “Hij lijkt wel verplicht om de indruk te wekken dat de paus is gestorven.” Nu verdenk ik Studio Brussel er niet van z’n programmatie en toon aan te passen mocht de paus komen te gaan. Maar omdat Franciscus wel degelijk ziek is, verwittig ik alvast de andere netten dat ze in dat geval bij Joris kunnen aankloppen om de boel over te nemen. Grapje van Ben Gelukkig vallen er regelmatig ook complimenten in onze mailbox, deze keer zelfs verschillende aan het adres van Jacotte Brokken over haar podcast Niemand vindt u leuk. “Ik ben echt onder de indruk van de inhoud en de presentatie van deze podcast door Jacotte”, schrijft een luisteraar. Iemand anders: “U hebt me goed/verhelderend verder geholpen met de podcast.” En ook: “Jacotte, je bent een knappe, sterke vrouw!” Daarom, proficiat aan Jacotte en de makers van Niemand vindt u leuk met de Chloë Complimenten Wisselbeker!Tot slot verwelkomt onze dienst ook de terugkeer van Ben Crabbé en zijn Blokken. En al meteen beroeren die de gemoederen. “Als een kandidaat direct na de eerste vraag al het juiste antwoord weet, hoor ik Ben zeggen dat dat zeer goedkoop is voor VRT. Nu is mijn vraag wat kost dan een vraag? En is dat werkelijk zo duur voor VRT??” Maak je geen zorgen over onze begrotingsuitvoering. Het was maar een grapje van Ben. Chloë van de KlantendienstColumnChloë van de klantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
