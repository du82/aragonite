title = "Chloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’ | VRT"
description = "Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Chloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’06 november 2024Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 2.991 keer contact opgenomen met onze dienst. De meest precaire vraag kwam van een kijker van het VRT 1-programma Dwars door de Lage Landen. “Waarom draagt Arnout Hauben altijd een lange jeansbroek? Ook als het 30 graden is?” Mocht pakweg Riadh Bahri een korte broek dragen op televisie, was het kot te klein. Maar goed, Arnout loopt veelal buiten.Ik weet niet waarom - sorry Arnout - maar ik moest hierbij denken aan mijn grootvader. Of het nu vroor of was het een hittegolf, steevast liep hij rond in deux pièces pak, inclusief das. N’importe de gelegenheid. En misschien is die vergelijking niet ver gezocht. Mijn grootvader heeft de Tweede Wereldoorlog meegemaakt, Arnout spreekt over niets anders. Mijn grootvader was nooit thuis, ik verdenk Arnout van hetzelfde. En mijn grootvader lag goed in de markt bij vrouwen van middelbare leeftijd. C’est clair.Ik moet er dus geen tekening bij maken dat mijn man dan weer heel jaloers was dat ik de vraag aan Arnout zelf heb voorgelegd. En de man antwoordde immer beleefd.“Simpel gezegd: een korte broek voelt voor mij te veel aan als vakantie. En als ik onderweg ben, weet ik nooit waar ik terechtkom of met wie ik ga praten. Regelmatig ontmoet ik mensen voor een diepgaand of ‘serieus’ gesprek, dan voel ik me als interviewer wat meer op mijn gemak in een lange broek. Je kan het zien als mijn uniform, mijn betrouwbare reispartner die me altijd goed staat. En hé, misschien speelt het ook een klein beetje mee dat mijn witte benen de zomerzon niet gewend zijn. Niet goed voor de kijkcijfers.” Dames, nu allemaal samen: * smelt *! Oh, en groetjes van mijn moeder, Arnout!Niet met ons belastinggeld spelenEen luisteraar van Boekenfeest op Radio 1 ergerde zich aan een onverklaarbaar geluid. “Wat is verdorie dat verschrikkelijk irritante wekkerlawaai in deze uitzending?! Ik heb mijn radio uitgezet!” Bij nader onderzoek bleek het te gaan over een stunt in de marge van het programma: vanuit de mobiele studio werd de tekst van een gedicht in steen gebeiteld. Kortom, niet het meest aangename noch aangewezen achtergrondgeluid voor een radio-uitzending. Klager krijgt persoonlijke excuses.De stunt van Sander Gillis die met Sander Tegen de Tijd vijf dagen radio maakt zonder enig besef van tijd viel niet bij elke MNM-luisteraar in de smaak. “Is het vandaag 1 april?!! Zou SG niet beter rekken gaan vullen in de Colruyt (het liefst niet in de mijne)? Of anders misschien gaan helpen in een ziekenhuis? Graag niet met ons belastinggeld spelen.” Wel ja, we hebben Sander natuurlijk al tien jaar op Ketnet laten presenteren. Intern verder schuiven zien we nog niet meteen gebeuren. We hebben al een schermgezicht dat in de Colruyt is begonnen. En helpen in een ziekenhuis, da’s een programma op een bevriende zender. Dus voorlopig zit Sander goed. Klager krijgt een standaardantwoord.Iedereen slikt ditEn ook Ben Crabbé en zijn Blokken blijven de gemoederen beroeren. Een kijker is het ‘BEU’ dat de presentator van de katholieke kerk een geliefd doelwit heeft gemaakt. “Neen, wij zijn niet katholiek, wel christenen. Laat Benneke nu eens hetzelfde doen met de Islam? Dat durft hij uiteraard nooit. Gemakkelijk om een instelling te schofferen, zonder enige tegenwerking te mogen verwachten. En iedereen slikt dit.” Persoonlijk denk ik dat VRT al genoeg gedaan heeft om het al dan niet slikken van de kerk aan te kaarten. En uiteraard zijn christenen altijd welkom als kandidaat om “Benneke” van weerwoord te dienen.Verder is de Deep Purple Funclub boos over de foute uitspraak van de familienaam van frontman Ian Gillan (niet Gillian). En een appartementsbewoner vreest dat zijn buren last hebben van Blokken. “De tunes tussenin zijn zoveel luider dan de spraak van Ben en de deelnemers. Telkens moeten wij het geluidsniveau aanpassen om de deelnemers te verstaan, maar de muziektunes te dimmen.” Wij zullen deze situatie ten gronde analyseren. Intussen onze oprechte excuses aan de buren van deze kijker.Gelukkig vallen er regelmatig ook complimenten in onze mailbox, deze keer verschillende aan het adres van Tine Embrechts en haar VRT 1-programma Menopauzia. “Veel bijgeleerd, vooral over mezelf,” schrijft een 63-jarig kijkster. Iemand anders: “het doet een mens z’n hartje zo’n deugd, omdat je er met niemand over kan praten wegens taboe”. En nog iemand: “ik heb tijdens het kijken zitten lachen, instemmend zitten knikken en tegen mijn man zitten porren en zeggen: zie je wel”. Volgens mijn man zeg ik zelf te vaak “zie je wel”, maar hier lijkt het me oprecht gepast. Daarom, proficiat Tine, haar getuigen en de makers met de Chloë Complimenten Wisselbeker! Tot slot heeft een kijker van Iedereen beroemt (sic) moeite met “die twee jonge gasten met hun strijkijzer die eten aan het verprutsen zijn”. Ik heb soms ook moeite met dingen, maar ik ga het vandaag loslaten.Chloë van de KlantendienstColumnChloë van de KlantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
