["https://vrt.be/nl/over-ons/onze-organisatie/reclameregie"]
title = "Reclameregie | VRT"
description = "Voor de werving van reclame en sponsoring steunt VRT op twee reclameregies. Voor de werving van radioreclame en van radio- en televisiesponsoring is dit de Var: een 100% dochteronderneming van de NV VRT. Voor de commercialisering van digitale producten is dit Ads & Data."
full_description = "Home/Over ons/Onze organisatie/ReclameregieReclameregieVoor de werving van reclame en sponsoring steunt VRT op twee reclameregies. Voor de werving van radioreclame en van radio- en televisiesponsoring is dit de Var: een 100% dochteronderneming van de NV VRT. Voor de commercialisering van digitale producten is dit Ads & Data. VarVoor de werving van reclame en sponsoring steunt VRT op Var, haar commerciële regie. Var is een 100% dochteronderneming van VRT.VideoVAR omnichannelMarktindexOp vrijdag 7 januari 2022 heeft de Vlaamse regering het systeem van de marktindex voor de commerciële communicatie (onder andere reclame) op VRT goedgekeurd. Dit is een nieuwe manier om het jaarlijkse reclameplafond voor de publieke omroep te berekenen. Het reclameplafond zal nu deze marktindex volgen. Deze index heeft de Vlaamse overheid ontwikkeld in samenwerking met VRT en de particuliere media. Lees hier de volledige beslissing van de Vlaamse regering over de marktindex.Marktindex PDFMarkt Indexpdf702 KBCommerciële communicatieVRT kan commerciële boodschappen brengen op al haar kanalen en zenders. Uitgesloten zijn wel: reclameboodschappen op de televisiekanalen en commerciële boodschappen rond het nieuws- en kinderaanbod.InkomstenVRT haalt haar inkomsten uit twee bronnen: de overheidsfinanciering en de eigen inkomsten. ProductplaatsingEen limonademerk in beeld bij Thuis, een kruidenmerk te zien bij Dagelijkse kost. Mag dat wel?Participatie De Raad van Bestuur heeft in het najaar van 2013 een participatiestrategie goedgekeurd om te investeren in jonge, talentvolle productiehuizen. VRT wil daarmee hun groeipotentieel ondersteunen, duurzame talentontwikkeling mogelijk maken en innovatie in mediaconcepten en -formats stimuleren. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
