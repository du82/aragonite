title = "Klara | VRT"
description = "Klara is de klassieke radiozender van de Vlaamse publieke omroep VRT. Klara biedt mediagebruikers een vluchtheuvel van rust en schoonheid. Als actieve partner van de cultuur- en muzieksector zet Klara in op de beleving en het genieten van cultuur en klassieke muziek, maar ook van jazz, hedendaagse muziek, film- en wereldmuziek. Klara steunt en organiseert spraakmakende acties en events rond klassieke muziek. Het biedt ook inzicht en verdieping op het gebied van kunst, geschiedenis, muziek en maatschappelijke thema’s."
full_description = "Home/Ons aanbod/KlaraKlaraKlara is de klassieke radiozender van de Vlaamse publieke omroep VRT. Klara biedt mediagebruikers een vluchtheuvel van rust en schoonheid. Als actieve partner van de cultuur- en muzieksector zet Klara in op de beleving en het genieten van cultuur en klassieke muziek, maar ook van jazz, hedendaagse muziek, film- en wereldmuziek. Klara steunt en organiseert spraakmakende acties en events rond klassieke muziek. Het biedt ook inzicht en verdieping op het gebied van kunst, geschiedenis, muziek en maatschappelijke thema’s. Klassiek repertoireKlara wil een zo breed mogelijk publiek laten kennismaken met en genieten van het klassieke repertoire, dat ongeveer 75% van het aanbod uitmaakt. Ook jazz, wereldmuziek, filmmuziek en experimentele muziek krijgen ruim aandacht. De radiozender kiest in verschillende programma’s voor muziek die rust en schoonheid uitdrukt, met aandacht voor diverse componisten, muzikale stromingen en uitvoerders. Zo bestaat een vijfde van het aanbod uit Vlaamse uitvoerders en/of componisten. Om de luisteraars te laten meegenieten van de beste Vlaamse en Europese concerten doet Klara regelmatig captaties en uitzendingen op locatie. Zo brengt Klara live verslag uit van de Koningin Elisabethwedstrijd: twee weken lang kunnen de luisteraars de prestigieuze muziekwedstrijd vanop de eerste rij volgen. Klara stelt ook jaarlijks tien jonge, beloftevolle muzikanten voor in De Twintigers.Koningin Elisabethwedstijd 2024 Katalysator voor cultuur Kunst en cultuur hebben een prominente plaats in het aanbod van Klara. In de eerste plaats wil het merk een katalysator zijn voor cultuurbeleving in Vlaanderen. Het merk houdt zijn luisteraars op de hoogte van actuele culturele evenementen in Vlaanderen en daarbuiten, in het bijzonder tijdens het dagelijkse programma Pompidou. Dat programma staat stil bij verschillende kunstdisciplines en de brede context waarin kunst ontstaat. Daarnaast is er op Klara ruimte voor verdieping op gebied van onder andere filosofie, geschiedenis, economie en politiek. Het programma De Jaren neemt de tijd voor diepgaande gesprekken met interessante gasten. Geniet nu van KlaraLuister live opVRT MAXKlara digitaal Klara investeerde de afgelopen jaren in een uitgebreid digitaal aanbod. Ten eerste promoot Klara het luisteren via VRT MAX. Zo is het merk altijd en overal beschikbaar, en kan je naar klassiek luisteren waar en wanneer je wilt. In die optiek werd ook Klara Continuo uitgerold, een ononderbroken stroom van klassieke muziek. Het merk is daarnaast aanwezig op sociale media om zijn radioaanbod, evenementen en acties in de kijker te zetten en te versterken. Klara beschikt over een rijk podcastaanbod, waaronder bijvoorbeeld De Bourgondiërs, De Franse revolutie, De vorstinnen van Vlaanderen en Classical queers. In de podcast Eerste Hulp Bij Klassiek kiezen Clara De Decker en Sander om beurt een klassiek muziekstuk dat je minstens één keer gehoord moet hebben.Sander De Keere en Clara De Decker in Eerste hulp bij klassiekMeesterlijke podcasts van KlaraStoute schoenenDe Bourgondiërs met Bart Van LooDe krantencommentarenDe Franse RevolutieEerste hulp bij klassiekDe vorstinnen van VlaanderenLeopold IINapoleonHet raadsel Maria CallasDe ZonnekoningOntdek meer opVRT MAXMeer weten? Lees ook deze artikelsCultuur | MuziekKlara stelt jong talent voor in vijfde editie van De Twintigers MuziekVier feest met klassieke muziek Klara geeft in Classical Queers een stem aan queer personen die de kunstwereld kleurden Dag Klara.be, welkom Klara op VRT MAXDe Twintigers: dit zijn de grote namen van morgenAchter de Maestro: Wat het publiek niet ziet Het wordt geen 'Stille nacht' bij VRT: een kerstaanbod om warm van te wordenDe vorstinnen van Vlaanderen: leading lady’s in de middeleeuwenDompel je onder in cultuurVRT viert de culturele diversiteit van Vlaanderen via al haar platformen en zoomt als bondgenoot van de cultuursector elke dag opnieuw in op boeken, beeldende en podiumkunsten en film. En dat is lang niet alles: ook architectuur, games, erfgoed, opera en andere disciplines komen aan bod. Lees meerVerken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerDuik in het Klara-aanbod op VRT MAXOntdek nu opVRT MAXBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
