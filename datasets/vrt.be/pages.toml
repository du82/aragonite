title = "Chloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’ | VRT"
description = "Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Chloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’08 januari 2025Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 2.678 keer contact opgenomen met onze dienst. Een opvallend deel daarvan ontvingen we tijdens de feestdagen, gericht aan onze chef Jeroen Meus.Iemand klaagt dat z’n kalkoen ‘fine champagne’ met verse kroketten en wintergroenten is mislukt. “Ik heb gedaan wat in het recept wordt aangegeven, maar het resultaat is niet om aan te zien. Kan je misschien zeggen welke soort appels je moet gebruiken? Of is er een drukfout in de bereidingswijze geslopen?”Een andere amateurkok wil weten of de vol-au-vent van konijn met kervelpuree goed bewaart. “Ik zou deze maandagavond klaarmaken, om woensdagmiddag op te eten. Mag dit bijna twee dagen op voorhand?”En deze bakker wil zich wagen aan de bosvruchtentaart. “Waarom kloppen hoeveelheden van de ingrediënten beschreven in de instructie NIET met de hoeveelheden vermeld op de website?” Ik begrijp de stress bij het voorbereiden van een feestmaaltijd, maar ik hoop dat mensen beseffen dat Jeroen (noch wij) tijdens de kerstdagen stand-by zitten om kerstflaters te redden met gepersonaliseerd advies. Dat zou budgettair ook niet te verantwoorden zijn binnen de huidige Beheersovereenkomst.Koken is experimenteren, zegt mijn man altijd. En da’s meteen de uitleg wanneer zijn kokkerellen weer faliekant is misgelopen.OntsnappingsgroepEen bijzondere casus bereikte ons uit Ottawa, Canada. Een lokale wielerfan houdt er blijkbaar van de verslaggeving veldrijden bij Sporza. Die volgt hij via de website van ons sportmerk, dankzij een simultane vertaling door Google Translate. Alleen, daar loopt het soms mis.Zo werd ontsnappingsgroep vertaald als “refugees”. Iets wat nog erger wordt in de zin: “ontsnappingsgroep wordt gepakt”. De vluchtelingen worden dan gevangen.Of wanneer Lucinda Brand op kop rijdt, maakt Google ervan: “fire on top”. Gelukkig is Brand geen vluchteling, maar toch.“Ik moest jullie wel schrijven”, aldus de Canadees. “Ik kom niet bij van het lachen!”. En zulke feedback waarderen we. Al ben ik vooral blij dat hij enkel Sporza laat vertalen.Sommige zaken blijven even (on)grappig in het Engels, denk aan “my infra... st... str... structure”, “that dirty sausage twister” of “Tongue, you chicken”.Maar het wordt pas echt absurd als we catchphrases uit Het eiland door de vertaalmachine halen.- “We are sitting with a ring, on a Düsseldorf!”- “I think this is starting to smell like boss fucking!”- “Pain, what is that? That’s just nice with a p!”- “No, but I like warm glasses!”- “Carla, Carla, Carla poo!”- “Fart well!”Klant krijgt een persoonlijk antwoord, maar geen suggesties voor nieuwe VRT-content. Do we want to agree on that?GediskwalificeerdOok Ben Crabbé en zijn Blokken blijven de gemoederen beroeren. Vooral de uitzending van maandag 6 januari dan. Kandidate Judith zette na haar finale-overwinning een reuzenstap achteruit, waardoor ze bijna uit beeld stapte. Ben wist haar tijdig terug te grabbelen, want, kandidaten moeten te allen tijde voor de camera blijven. Dat schrijft het wedstrijdreglement voor.Commotie bij de fans was het gevolg. - “Men zou het reglement moeten toepassen!”- “Ze heeft de spelregels overtreden en moet gediskwalificeerd worden. Eerlijk is eerlijk!”- “Meermaals terug bekeken en effectief, de finaliste was uit beeld. Mvg.”Ik heb het intussen ook meermaals herbekeken, en haar haar blijft in beeld. Bovendien stapte ze uit beeld wanneer ze de finale al gewonnen had. Eens over de meet, is het spel gedaan. Daarom verdenk ik Ben ervan de commotie zelf te hebben opgezocht. Omdat hij weet dat wij van de Klantendienst maar al te graag onze dagelijkse portie Blokken verwerken. Dank je, Ben! Beste wensen voor een klachtenrijk 2025! Gelukkig vallen er regelmatig ook complimenten in onze mailbox, deze keer aan het adres van Onder vuur. “Ik ben zelf rolstoelgebruiker van bij m’n geboorte. Ik heb gestudeerd, gewerkt, ben moeder van twee kinderen... Het is de allereerste keer dat ik een vrouw (Katrien) in een rolstoel op een normale manier zie functioneren. Hele dikke proficiat dus aan de schrijvers van deze rol!” Daarom: proficiat aan alle maker van Onder vuur met de Chloë Complimenten Wisselbeker. De Diversiteitstrofee lonkt!Tot slot een klacht over ‘Knok..off’ op VRT 1. “Ik kijk niet meer, decadenter kan het niet. Nog een beetje meer van dit en jullie kunnen meedoen aan een pornoseriefestival!” Ik pols al eens bij mijn man waar we Knokke Off kunnen inschrijven.Chloë van de KlantendienstColumnChloë van de KlantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
