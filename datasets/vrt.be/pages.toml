["https://vrt.be/nl/vragen"]
title = "Heb je een vraag | VRT"
description = "Heb je een vraag, klacht of suggestie? De kans is groot dat je hier je antwoord vindt. Maar je kan ook altijd ons contactformulier gebruiken en onze medewerkers van de klantendienst staan je graag te woord, elke werkdag tussen 9u en 12u op het nummer 02 741 31 11."
full_description = 'Home/Heb je een vraagHeb je een vraagHeb je een vraag, klacht of suggestie? De kans is groot dat je hier je antwoord vindt. Maar je kan ook altijd ons contactformulier gebruiken en onze medewerkers van de klantendienst staan je graag te woord, elke werkdag tussen 9u en 12u op het nummer 02 741 31 11.Zoek in veelgestelde vragenZoekenFilter de veelgestelde resultatenAlle merkenVRT 1VRTVRT CanvasVRT NWSVRT MAXKetnetKlaraMNMRadio 1Radio 2SporzaStudio BrusselDe TijdlozeRadio BeneAlle onderwerpenVRT-profielCookiesBezoek VRTToegankelijkheidTechnologieVRT ArchiefDe Warmste WeekVRT JobsVRT-profiel"Beperkte" toegang-fout op iOS toestelGebruiker krijgt op een iOS toestel de fout "De toegang tot deze pagina op "login.vrt.be" is beperkt, zodat je deze niet kunt bekijken."Mogelijke oplossing:Het ouderlijk toezicht is niet correct geconfigureerd op het iOS toestel:1. Volg de instructies op : https://support.apple.com/nl-be/HT201304#web-conten2. Pas daar ofwel "Onbeperkte toegang" toe, ofwel (indien niet aanvaardbaar) de volgende configuratie.Bij het aanmelden en bevestigen van mijn gegevens op het VRT-profiel zit ik in een loopAls gebruiker log je in via het VRT-profiel, en verifieer je je gegevens. Bij het klikken op de ‘Ga Verder’ knop kom je terug op de login pagina, en dien je opnieuw in te moeten loggen. Ik zit in een loop, ik moet steeds opieuw aanmelden en mijn gegevens bevestigen.Mogelijke oplossing:VRT-profiel maakt gebruik van cookies. Door de vernieuwing van het VRT-profiel kan het zijn dat de oude cookie settings wat roet in het eten gooien bij het aanloggen. Daardoor vragen wij jou om de cookies van VRT-profiel te verwijderen. Dat kan als volgt gebeuren voor jouw browser:Firefox: https://support.mozilla.org/nl/kb/cookies-verwijderen-gegevens-wissen-websites-opgeslagen?redirectlocale=nl&redirectslug=Cookies+verwijderenChrome: https://support.google.com/accounts/answer/61416?co=GENIE.Platform%3DDesktop&hl=nlSafari op Mac: https://support.apple.com/nl-be/guide/safari/sfri11471/macSafari op iPhone of iPad: https://support.apple.com/nl-nl/HT201265 Microsoft Edge: https://support.microsoft.com/nl-be/help/17442/windows-internet-explorer-delete-manage-cookiesVerwijder de cookies van login.vrt.be.Bij welke VRT-websites en -apps kan ik het VRT-profiel gebruiken?Bij alle websites en apps van VRT, want al onze merken doen mee: VRT NWS, VRT MAX, Sporza, VRT 1, VRT Canvas, Radio 1, Radio2, Studio Brussel, MNM, Klara, De Warmste Week, Dagelijkse Kost… De link "paswoord wijzigen " werkt nietMogelijke oorzaken dat de URL niet werkt:de link in de mail is maar 1 uur geldig. Indien buiten deze tijdsperiode de link wordt aangeklikt, werkt de link niet meer.Oplossing: Nieuwe paswoord reset link aanvragen.de link wordt door sommige e-mail clients gewijzigd bij het doorsturen van de link naar een browser (voorbeeld bepaalde versies van Thunderbird).Oplossing: Manueel kopiëren van de link en deze plakken in de browser.Paswoord wijzigen scherm vertoont een fout na invoeren van een nieuw paswoord. Mogelijke fout: “Missing required parameter”Oplossing: Start de paswoord wijzigen flow vanuit de VRT-profiel site: https://profiel.vrt.beEenmalig inloggen (Single Sign On)SSO stelt jou als eindgebruiker in staat om eenmalig in te loggen op een digitaal VRT product, en dat met je VRT-profiel. Het voordeel van deze functionaliteit is dat met deze authenticatiegegevens ook automatisch op andere producten van VRT kan worden ingelogd met je VRT-profiel, bij bezoek van dat product. Hiervoor dien je dan niet opnieuw de knop ‘Aanmelden’ te gebruiken. Het aanmelden gebeurt automatisch. Voordeel van deze manier van inloggen is dat VRT zijn producten beter op jou kan afstemmen, door bijvoorbeeld direct het correcte regionaal nieuws aan te bieden, je de video of audio fragmenten te tonen die je nog kan afkijken of luisteren, of die fragmenten aanbieden die aansluiten bij jouw interesses, maar die je ook kunnen verheugen met verrassende content. Er verschijnen geen inlogveldenMogelijke oplossingen:Bepaalde componenten die binnen het VRT-profiel worden gebruikt, worden geblokkeerd. Zo laten wij de mogelijkheid toe om in te loggen via het sociale netwerk van Google. Maar in voorbeeld China wordt dit geblokkeerd, waardoor de gehele pagina wordt geblokkeerd en het niet mogelijk is om in te loggen.Hiervoor hebben wij geen oplossing.Probeer eens in een browser te navigeren naar volgende URL: https://accounts.vrt.be/Je zou een witte pagina moeten zien. Wanneer er geen fouten getoond worden, zou je moeten kunnen inloggen. Dan ligt de oorzaak elders, en kijk je best naar de oplossingen onder het puntje: “Het VRT-profiel kan niet worden geladen:”Foutmelding bij het wijzigen van mijn paswoord: “Er liep iets mis.”Mogelijke oplossing:Het wijzigen van het paswoord gebeurt best in een incognito of privacy venster van de browser. Dit is een apart venster waarbij geen cookies worden ingeladen. Dit kan als volgt geopend worden in de browser:Paswoord wijzigen flow uitvoeren.Dus klikken op “Paswoord vergeten?”En nu jouw e-mail adres ingeven.Klikken op de knop “Vraag een nieuw paswoord aan”Open jouw mailtoepassing, en zoek de mail van het VRT-profiel om jouw paswoord te wijzigen (kijk ook in de folder voor ongewenste mail).Kopieer de link voor de paswoord wijzigen flow uit de mail.Open een privévenster in jouw browser:Staat hier uitgelegd hoe dat kan: https://computertotaal.nl/artikelen/apps-software/zo-gebruik-je-de-privemodus-van-je-browser-68972/Of door rechts te klikken op je browser icoon en incognito modus of privévenster aan te klikken:De paswoord wijzigen flow uitvoeren. Dan zou je geen fout mogen krijgen.Indien er toch een fout verschijnt, contacteer dan de klantendienst via de link in de foutmelding.Foutmelding: "VRT-profiel vereist dat uw browser cookies aanvaardt. Gelieve deze in uw browser instellingen in te schakelenMogelijke oplossing:Aanvaarden van cookies voor de VRT-profiel site. Dat kan je als volgt doen voor jouw browser:Firefox: https://support.mozilla.org/nl/kb/websites-melden-cookies-geblokkeerd-deblokkerenChrome: https://support.google.com/chrome/answer/95647?co=GENIE.Platform%3DDesktop&hl=nlSafari op Mac: https://support.apple.com/nl-be/guide/safari/sfri11471/macSafari op iPhone of iPad: https://support.apple.com/nl-nl/HT201265 Microsoft Edge: https://support.microsoft.com/nl-be/help/17442/windows-internet-explorer-delete-manage-cookiesFoutmelding: Je gebruikt een verouderde browserHet gebruik van een up-to-date browser is heel belangrijk. Voornamelijk om veiligheidsreden, waarbij een browser veiligheidsproblemen snel aanpakt. Daar de meeste hedendaagse browsers allemaal een automatische update functie hebben, zal je ook steeds van de meest recente versie van een browser gebruik maken. Daarnaast is het ook belangrijk om een recente browser te gebruiken, zodat nieuwe technologieën en functionaliteiten van websites ondersteunt worden in de browser.Daarom gebeurt er bij het gebruik van het VRT-profiel een kleine controle naar welke browser je gebruikt, en of je beter een update doet van je browser, of je eventueel een andere browser kiest. Zodoende zijn we ook zeker dat de functionaliteiten die nodig zijn voor het inloggen of het wijzigen van jouw profiel data wel degelijk uitgevoerd kunnen worden.Oplossing:Om over te stappen naar een meer recentere browser, kan je via deze link jouw keuze maken: https://bestvpn.org/outdatedbrowser/nlOpmerking:Deze controle kan ook Microsoft Edge als verouderd aanduiden, daar er een nieuwe Microsoft Edge versie is die een andere technologie onder de motorkap gebruikt (Microsoft Edge op basis van Chromium), en deze versie wordt maar stelselmatig uitgerold, of dien je zelf manueel te installeren. Dat kan via deze link: https://support.microsoft.com/nl-nl/help/4501095/download-the-new-microsoft-edge-based-on-chromiumHet VRT-profiel kan niet worden geladenMogelijke oplossingen:De instellingen van de browser controleren om javascript terug in te schakelen.Voor Microsoft Internet Explorer:https://support.microsoft.com/nl-nl/help/3135465/how-to-enable-javascript-in-windowsVoor Google Chrome:https://support.google.com/adsense/answer/12654?hl=nlVoor Mozilla Firefox:https://support.mozilla.org/nl/kb/javascript-instellingen-voor-interactieve-webpaginas Ad-blocker blokkeert een belangrijke component die het VRT-profiel gebruikt om in te loggen:Voeg https://login.vrt.be toe als whitelist in de ad-blocker. Indien je BitDefender gebruikt kan je dat op deze plaats aanpassen. Schakel de ad blocker uit en probeer opnieuw.Voeg de VRT-login pagina of de scripts die gebruikt worden op VRT-profiel toe aan de lijst met uitzonderingen voor deze ad blocker. Probeer een andere browser:Mogelijks gebruik je een minder courante browser, en ondersteunt VRT deze browser niet. Probeer dan eens in te loggen via een standaard browser.Inloggen kan via de VRT-profiel website: https://profiel.vrt.be.Lijst met standaardbrowsers kan hier gevonden worden: https://bestvpn.org/outdatedbrowser/nlHoe kan ik mij aanmelden bij VRT-websites/-apps? Aanmelden met je VRT-profiel is heel eenvoudig. Je doet dit, bij voorkeur, via het aanmeldicoon op een VRT-website of binnen een VRT-app: klik op de knop “Aanmelden” Alternatief kan je je ook aanmelden via het beheersplatform van het VRT-profiel: klik daar op de knop “Meld je aan”. Daarnaast kan het ook zijn dat je automatisch inlogt op de website, door middel van Single Sign On (= SSO of éénmalig aanmelden).Hoe kan ik mijn e-mailadres aanpassen?Door te navigeren naar de profiel pagina (via https://profiel.vrt.be), kan je via de optie ‘Mijn gegevens’ de e-mailadres wijzigen flow uitvoeren. Via een nieuw schermpje kan je je nieuwe e-mailadres invullen. Bij het bevestigen van dit e-mailadres wordt er nog een kleine controle gedaan over de correctheid van het e-mailadres en wordt er gekeken of dit nieuwe e-mailadres nog niet bestaat in onze gegevensdatabank. Er wordt nadien een mailtje gestuurd naar het oude e-mailadres om te melden dat we de aanvraag tot wijziging goed hebben ontvangen, en we sturen ook een mailtje met een code naar het nieuwe e-mailadres met de vraag om via deze code jouw nieuwe e-mailadres te verifiëren. Na een correcte verificatie kan je met dit nieuwe e-mailadres aanmelden. Hoe kan ik mijn VRT-profiel verwijderen?We hopen dat je dit niet zal doen, maar als je toch besloten hebt om je profiel te verwijderen, of per abuis een dubbel profiel hebt aangemaakt en je wil één van beide verwijderen, dan kan dat op deze manier: Als je aangemeld bent en op de aanmeldknop klikt dan klapt er een menu uit: in dat menu klik je op de link “Mijn VRT-profiel”. Je komt dan op het beheersplatform van het VRT-profiel. Je kan ook rechtstreeks naar het volgende adres gaan: https://profiel.vrt.be. Kies daar de optie: “Mijn gegevens”. Op het volgende scherm zie je onderaan de optie “Profiel verwijderen”. Goed om te weten: Binnen het uur nadat je je profiel verwijderd hebt, kan je niet meer aanmelden bij de VRT-websites en -apps. De wettelijke termijn voor het verwijderen van al je profielgegevens is 30 dagen. Na afloop van deze termijn ontvang je van ons een bericht waarin we bevestigen dat al je profielgegevens definitief verwijderd werden. Wat als je je bedenkt? Krijg je spijt na het verwijderen van je profiel: we kunnen een verwijderd profiel helaas niet heractiveren. Je zal dan weer de volledige registratieprocedure moeten doorlopen. Maak je binnen de wettelijke termijn van 30 dagen een nieuw profiel aan, gebruik dan bij voorkeur een ander e-mailadres. Als je toch hetzelfde e-mailadres of hetzelfde socialemedia-account wil gebruiken, contacteer dan onze klantendienst. Zij zullen dan de nodige stappen ondernemen om je verwijderde profiel versneld volledig weg te halen uit onze databank. Hoe kan ik mijn wachtwoord wijzigen?Je wachtwoord wijzigen is heel eenvoudig: al je profielgegevens worden op één centrale plaats bewaard. Als op het aanmeldicoon klikt, dan klapt er een menu uit: in dat menu klik je op de knop “Aanmelden”. Je komt dan op het aanmeldscherm terecht. Klik op de link “Wachtwoord vergeten?”. Vul vervolgens je e-mailadres in: je ontvangt dan een e-mail van ons waarin verdere instructies staan. Hoe kan ik zien of een VRT-website/-app het VRT-profiel gebruikt?Als een VRT-website of -app het VRT-profiel gebruikt, dan zie je een aanmeldicoon staan: Websites: Op de desktopversie van onze websites staat het aanmeldicoon bovenaan (links of rechts) het scherm. Op de mobiele versie van onze websites vind je het aanmeldicoon in het mobiel menu. Apps: In de VRT-apps vind je het aanmeldicoon in het mobiel menu. Hoe verloopt de registratieprocedure, welke stappen moet ik doorlopen?We hebben het registratieproces zo eenvoudig mogelijk gemaakt: (max.) 5 eenvoudige stappen en je bent klaar! Je kan registeren: met je e-mailadres met je Facebook-* of Google-account of met je Apple-ID * geen zorgen: we posten niets op je tijdlijn Als je een nieuw profiel aanmaakt met je e-mailadres, dan doorloop je deze stappen: Stap 1: Je vult je e-mailadres in en kiest een veilig wachtwoord. Tips voor een veilg en sterk wachtwoord:Gebruik bij voorkeur een wachtwoordmanager of wachtwoordkluis. Als dat niet kan, hou dan zeker rekening met volgende aanbevelingen: Kies een wachtwoord van minimaal 8 tekens Combineer hoofdletters, kleine letters, cijfers en symbolen Verander regelmatig je wachtwoord Gebruik geen voorspelbaar of voor de hand liggend wachtwoord Stap 2: Je geeft aan dat je akkoord gaat met de gebruiksvoorwaarden en het privacybeleid van de VRT. Stap 3: Je geeft volgende persoonsgegevens door: je voor- en achternaam je gender (je hebt keuze tussen “M”, “V”, “X” of “Zeg ik liever niet”) je geboortedatum je land, postcode en woonplaats Als je op het moment van de registratie meedoet aan een wedstrijd, dan vragen we in stap 3 ook meteen je “straatnaam en huisnummer”. Want als je wint, dan wil je de (hoofd)prijs graag thuis ontvangen. Wil je weten waarom we deze persoonsgegevens vragen? Lees dan zeker het antwoord bij de vraag: Welke (persoons)gegevens moet ik doorgeven, welke zijn verplicht/optioneel, en wat gebeurt ermee?Stap 4: Geef aan of je liever relevante advertenties ziet binnen onze apps en websites, of liever meer generieke advertenties ziet. Stap 5: Je kiest welke communicatie je wil ontvangen: nieuwsbrieven, berichten over interessante initiatieven/acties van de VRT of één van haar merken… Als je op het moment van de registratie meedoet aan een wedstrijd, stemming of actie waarvoor de redactie je (eventueel) graag wil opbellen, dan vragen we in stap 4 of je dat goed vindt. Ga je hiermee akkoord, dan kan je meteen je telefoonnummer invullen. Stap 6: Je ontvangt een e-mail met een bevestigingslink. Je profiel is actief zodra je op de bevestigingslink klikt die je in het e-mailbericht vindt. Heb je geen e-mail van ons ontvangen? Kijk dan eerst even in je map met “ongewenste e-mails”. Heb je hem daar niet gevonden? Klik dan pas op het scherm '
