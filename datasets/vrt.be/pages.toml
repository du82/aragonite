["https://vrt.be/nl/over-ons/nieuws-over-vrt/sporza-telt-af-naar-het-vlaamse-wielervoorjaar"]
title = "Sporza telt af naar het Vlaamse wielervoorjaar | VRT"
description = "Over ruim twee weken is het zover: het Vlaamse wielervoorjaar gaat van start. De Omloop Het Nieuwsblad en Kuurne-Brussel-Kuurne zorgen traditiegetrouw voor een spectaculair openingsweekend en Sporza zet wielerliefhebbers opnieuw op de eerste rij. De ideale voorbereiding? Wielerclub Wattage, Sporza Wielermanager en de podcast Kopman."
full_description = "Home/Over ons/Nieuws over VRT/Sporza telt af naar het Vlaamse wielervoorjaarSporza telt af naar het Vlaamse wielervoorjaar13 februari 2025Over ruim twee weken is het zover: het Vlaamse wielervoorjaar gaat van start. De Omloop Het Nieuwsblad en Kuurne-Brussel-Kuurne zorgen traditiegetrouw voor een spectaculair openingsweekend en Sporza zet wielerliefhebbers opnieuw op de eerste rij. De ideale voorbereiding? Wielerclub Wattage, Sporza Wielermanager en de podcast Kopman.Het veldritseizoen loopt op zijn laatste benen, maar niet getreurd: op zaterdag 1 maart weerklinkt het startschot van het Vlaamse wielervoorjaar met de Omloop Het Nieuwsblad. Ruben Van Gucht verzorgt samen met Ine Beyen het commentaar bij de vrouwen, Karl Vannieuwkerke en José De Cauwer vormen opnieuw een tandem bij de mannenwedstrijd. Doorheen het wielerseizoen zullen ook Sep Vanmarcke, Sven Vanthourenhout en Jan Bakelants regelmatig de wedstrijden van commentaar voorzien, samen met Karl of Renaat Schotte. Op Radio 1 zijn Christophe Vandegoor en Carl Berteele de vertrouwde stemmen.Op zondag 2 maart staat Kuurne-Brussel-Kuurne op het Sporza-programma en nadien blijven de wedstrijden elkaar in sneltempo opvolgen. Op dinsdag 4 maart is er de Waalse klassieker Le Samyn, op zaterdag 8 maart de Toscaanse grindkoers Strade Bianche, op zondag 9 maart is het weer koers in eigen land met de GP Jean-Pierre Monseré en op diezelfde dag start ook de Franse rittenkoers Parijs-Nice. De wielerploeg van Sporza houdt de benen niet stil met in maart ook nog Nokere Koerse (woensdag 19 maart), de Bredene Koksijde Classic (vrijdag 21 maart), de Classic Brugge-De Panne (woensdag 26 en donderdag 27 maart) en Gent-Wevelgem (zondag 30 maart). Na Dwars door Vlaanderen (woensdag 2 april) is het tijd voor de Ronde van Vlaanderen (zondag 6 april). Traditiegetrouw volgt een week later een nieuw hoogtepunt met Parijs-Roubaix (zaterdag 12 en zondag 13 april).Wielerclub Wattage Na twee succesvolle seizoenen maakt Wielerclub Wattage zich op voor een derde seizoen. Ruben Van Gucht duikt opnieuw samen met Tom Boonen, Jan Bakelants, Mark Uytterhoeven en Dirk De Wolf in de wieleractualiteit. Nieuwe inzichten en straffe verhalen, dat kun je verwachten van deze live-podcast van Sporza. Wielerclub Wattage houdt halt in tien verschillende culturele centra verspreid over heel Vlaanderen. De tickets voor de opnames zijn nagenoeg allemaal de deur uit, maar uiteraard is de podcast ook op de gekende VRT-kanalen te volgen. De eerste opname vindt plaats in Ninove op woensdag 26 februari, de eerste aflevering is woensdagavond vanaf 23 uur te bekijken op VRT Canvas en daarna te bekijken en beluisteren op VRT MAX en Sporza.be.Sporza Wielermanager en podcast Kopman Sporza Wielermanager is stilaan niet meer weg te denken tijdens de klassiekers. Dit jaar is er opnieuw dubbel plezier met een editie voor het vrouwen- en mannenpeloton. Stel je favoriete ploeg samen voor elke wedstrijd, denk strategisch en verdien punten voor de ranglijst. De prijzenkast is heel goed gevuld, de winnaar van het eindklassement mag zelfs met een hoog aangeschreven koersfiets naar huis. In de podcast Kopman staat Tess Elst met haar gasten opnieuw paraat voor goede en minder goede raad. Surf naar wielermanager.sporza.be en stel je ploegen samen.Vive le Vélo - leve de Ronde Vanaf maandag 31 maart bouwt Karl Vannieuwkerke opnieuw op naar de Ronde van Vlaanderen (zondag 6 april) met Vive le Vélo - leve de Ronde. Karls beroemde tafel krijgt een plaatsje in de Vlaamse Ardennen, waar hij dagelijks drie gasten ontvangt. Van maandag tot donderdag delen ze op VRT 1 hun passie voor de koers en 'Vlaanderens mooiste'.Lees zeker ookProducties | Sport & ontspanningGelukkig gescheiden: leve de liefde na de liefdeSport & ontspanningSpetterende optredens op het Gala van de Gouden K'sSport & ontspanningVan oor tot oog: VRT MAX Podcastpalooza pakt uit met twee dagen vol live podcastbeleving in MechelenSport & ontspanning2024, het jaar van een nieuwe groeispurt voor VRT MAXSport & ontspanningOntdek de genomineerden voor het Gala van de Gouden K'sSport & ontspanning“Het is VRT’s plicht om een programma als ‘Drugs dus’ te maken” Sport & ontspanning“Wat je eet is wat je voelt”, ‘De grote boodschap’ over de impact van darmgezondheid Deel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
