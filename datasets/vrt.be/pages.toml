["https://vrt.be/nl/bezoek-vrt"]
title = "Bezoek VRT | VRT"
description = "Zin om op een fijne manier het leven achter de schermen van ons mediabedrijf te zien? Onze gidsen tonen jou de magie achter ons radio-, tv- en online-aanbod. Check snel hieronder voor alle info!"
full_description = "Home/Bezoek VRTBezoek VRTZin om op een fijne manier het leven achter de schermen van ons mediabedrijf te zien? Onze gidsen tonen jou de magie achter ons radio-, tv- en online-aanbod. Check snel hieronder voor alle info!Je kan kiezen uit deze rondleidingen:Rondleiding Kom op tegen KankerTijdens de maanden maart en april 2025 kan je een rondleiding boeken waarvan de opbrengst integraal naar ‘Kom op tegen kanker’ gaat.Meer infoVRT-standaardrondleidingOnze enthousiaste gidsen leggen je uit hoe verschillende VRT-programma’s tot stand komen. Wandel rond in de radiostudio’s van Studio Brussel of MNM, bezoek de journaalstudio, Sporza of Ketnetstudio en presenteer zelf het weerbericht in onze demostudio.Volg deze rondleiding ook met Vlaamse Gebarentaal.Boek nuMeer info?VRT NWS-rondleidingTijdens de VRT NWS- rondleiding ervaar je van dichtbij hoe de VRT journalisten dagelijks nieuws maken en tot bij je brengen.Boek nuMeer info?Combibezoek VRT én TechnopolisIn de voormiddag zie je VRT zoals je de publieke omroep nog nooit zag: je komt in onze journaalstudio, brengt een bezoekje aan het FC De Kampioenen-café, ontdekt hoe een ‘green key’ werkt in onze belevingsruimte, staat op de eerste rij terwijl er live radio wordt gemaakt en nog zoveel meer. Onze enthousiaste gidsen nemen jou mee voor een verrassende blik achter de schermen. Neem vrienden of familie mee en maak er een gezellige daguitstap van!Boek nuMeer info?Combibezoek VRT en Vlaams ParlementHaal het beste uit 1 dag door VRT én het Vlaams Parlement te bezoeken. In de voormiddag ontdek je hoe we bij de openbare omroep radio, tv én online-content maken. 's Middags krijg je een unieke inkijk in de wandelgangen van het Vlaams Parlement.Boek nuMeer info?Individueel bezoek aan VRTOp woensdagavond om 18.30u, de eerste zaterdag van de maand om 10u en de derde zaterdag van de maand om 14u kan je je als individu of met enkele vrienden of familie inschrijven voor een VRT-standaardrondleiding. Een bezoek kost 14 euro en vindt alleen plaats als er minstens 10 deelnemers zich inschrijven. Als er toch minder dan 10 deelnemers zijn, wordt iedereen verwittigd.Boek nuWoon een opname bijAltijd al eens in de studio willen zitten tijdens de opname van een show? Schrijf je nu in en we reserveren een zitje speciaal voor jou!Reserveer je zitjeVideoVeelgestelde vragen over rondleidingenVRT-lespakketten voor je rondleidingOm het bezoek aan VRT met je klas voor te bereiden of uit te breiden, biedt VRT enkele lessenpakketten aan. Meer info?Is het mogelijk om een optie te nemen op een geleid bezoek?Neen, dit is niet mogelijk. Om een vlotte en correcte afhandeling van uw reservatie te garanderen, kunnen we niet werken met opties.Parkeren bij VRTDoor de werken ter voorbereiding van ons nieuwe gebouw is het aantal parkeerplaatsen fel geslonken. Als je een rondleiding plant (of al gepland hebt), hou er dan rekening mee dat je misschien geen plaats vindt op het parkeerterrein van VRT.Bekijk hier de routebeschrijving.Hebben jullie een bus gehuurd?Dan is er normaalgezien geen probleem, er zijn een aantal parkeerplaatsen voor bussen op de bezoekersparking.Komen jullie met de auto?Hou er rekening mee dat het aantal beschikbare plaatsen op de bezoekersparking al ingenomen kan zijn. Speel je liever op safe? Kom dan met het openbaar vervoer of parkeer je auto bv. aan Tour & Taxis en neem van daaruit het openbaar vervoer tot aan VRT.Neem je toch het berekende risico en probeer je nog een plaats te vinden op de bezoekersparking van VRT?Vertrek ruim op tijd en hou er zeker rekening mee dat onze rondleidingen stipt op tijd starten. Voor rondleidingen tijdens het weekend verwachten we geen parkeerproblemen.Is het Vlaams Parlement makkelijk bereikbaar met het openbaar vervoer?Ja, het Vlaams Parlement is makkelijk bereikbaar met het openbaar vervoer. Het ligt op wandelafstand van het Centraal Station, Brussel.Is VRT makkelijk bereikbaar met het openbaar vervoer?Ja, VRT is makkelijk bereikbaar met het openbaar vervoer.Een uitgebreide wegbeschrijving vindt u hier.Kunnen we met het openbaar vervoer van VRT naar het Vlaams Parlement reizen?Ja, dat kan. MIVBHalte Meiserplein, bus 63 richting Centraal Station tot aan de halte Drukpers.Halte Opaal, bus 29 richting de Brouckère tot aan halte Drukpers.Raadpleeg de website voor de dienstregeling of download de app.De LijnHalte Schaarbeek, bus 358 Lebrun tot aan halte Sint-Joost-ten-Node Madou.Raadpleeg de website voor de dienstregeling of download de app.RoutebeschrijvingHet omroepgebouw in Brussel is gemakkelijk te bereiken met de auto en met het openbaar vervoer.Contacteer onsBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
