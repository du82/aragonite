["https://vrt.be/nl/over-ons/nieuws-over-vrt/chloe-van-de-klantendienst-er-zijn-nog-meer-kijkers-die-menen-dat-vrt-afglijdt-richting-de-concullegas"]
title = "Chloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’ | VRT"
description = "Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Chloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’17 oktober 2024Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 2.696 keer contact opgenomen met onze dienst. Een VRT 1-kijker heeft bedenkingen bij het programma Iedereen beroemd. Althans, zo heb ik het toch begrepen. De klacht begint met: “Ik heb ooit het nut van Ideeën beroemd begrepen.” Dus ooit begreep de klager het wel, of moest er nooit staan? “Dit seizoen is het nog slechter, jullie zakken af onder het niveau van Iedereen VTM. Wij zijn geen idioten of peuters.” De programma’s Ideeën beroemd en Iedereen VTM zijn mij niet bekend. Maar om de kijkers van VTM idioten of peuters te noemen? Dat heb ik dan weer “ooit” begrepen.Met welk recht En er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s. Zo liepen er tientallen klachten binnen over een recente ingreep waarbij eindgenerieken niet langer integraal worden uitgezonden.“Net als bij de commerciële stations wordt er zo tijd vrijgemaakt voor reclame voor de eigen programma’s - tot in den treure toe - en commerciële reclame. Is er nog niet genoeg flauwekul op al de andere tv-stations? Moet ook VRT Canvas die weg op?”Een andere klager stelt: “Gaan jullie de VTM achterna? Dit is een misprijzen voor de cinema en iedereen die eraan gewerkt heeft.” Of: “Het is wééral na-apen wat de reclamezenders doen!” En nog iemand: “Dergelijk bruusk stoppen op het einde der film is afgekeken van de commerciële zenders die dit onding sinds altijd toepassen. Niet ons ding.”Verder noemen kijkers de verandering “beschamend”, “irritant”, “onaangenaam”, “onbeleefd”, “ongepast” en “respectloos”. Iemand noemt het “een grote meerwaarde die wegvalt”. “Bovendien staat er in de eindgeneriek ook waar de film is opgenomen en welke muziek erin voorkwam”, vult iemand anders aan. Ook doet het “afbreuk aan het filmplezier”.“Ik denk zelfs dat dit niet mag en kan beboet worden”, meent een klager. Dat kan ik namens onze juridische dienst evenwel ontkennen. Al zou het heruitzenden van de Kampioenenfilms - inclusief aftiteling - wel strafbaar moeten zijn. Maar da’s mijn mening.Het wegvallen van de aftiteling is duidelijk een bezorgdheid bij meerdere kijkers en ik heb die natuurlijk gedeeld met het netmanagement. Zij noemen het een vormelijke keuze, maar sommige klagers nemen dat niet. “Met welk recht onthouden zij ons hiervan?” Goh, met hetzelfde recht dat ze de film in kwestie wel degelijk programmeren.Geef toe: hoeveel mensen lopen de bioscoopzaal niet buiten wanneer de eerste naam over het scherm rolt? Tenzij het een Marvelfilm betreft en het weer reikhalzend uitkijken is naar een weinigzeggende postcredit, natuurlijk. Maar zulke content zenden we dan weer niet uit. Er zit geen verborgen cliffhanger aan het einde van Midsomer Murders. Of aan het einde van zo’n Kampioenenfilm, waaruit blijkt dat het allemaal maar om te lachen was. Een postcredit en disclaimer in één klap!Die goede, oude tijdIntussen blijven Ben Crabbé en zijn Blokken opnieuw de gemoederen beroeren. “Waarom moet het publiek van Blokken altijd roepen en tieren bij elke gelegenheid”, vraagt een kijker zich af. “Het is irritant en stresserend. Tijdens corona was er geen publiek en dat vond ik heel aangenaam.” Haaa, corona! Die goede, oude tijd. Verder wijst een kijker erop dat een braderie geen feestmarkt is en klaagt iemand over de zin “made in Germany”. “Waarom in het Engels?” Omdat Duits te veel aan vroeger doet denken. Gelukkig vallen er regelmatig ook complimenten in onze mailbox, deze keer verschillende aan het adres van de VRT NWS-collega’s. “Dit is geen klacht maar een felicitatie naar aanleiding van de tv-uitzending over en tijdens de gemeenteraadsverkiezingen. Dit vind ik het betere werk. Ik kan mij echter goed voorstellen dat het uitstekende werk van de journalisten alleen maar goed naar voren kan komen dankzij de inzet van alle mensen achter de schermen.” Iemand anders schrijft: “In een tijd waarin de nieuwswereld voortdurend in beweging is, vormt de redactie de ruggengraat van onze democratie.” Tot slot vindt een kijker de verslaggeving “duidelijk, correct, informatief, soms ludiek, kortom zeer goed gebracht”. Daarom, proficiat VRT NWS met de Chloë Complimenten Wisselbeker! Tot slot is er opnieuw een kijker die aanstoot neemt aan een outfit van VRT NWS-anker Riadh Bahri. “Waarom doet die een groen kleedje aan dat echt voor een vrouw is bedoeld?” It’s called fashion, look it up.Chloë van de KlantendienstColumnChloë van de KlantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
