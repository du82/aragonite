["https://vrt.be/nl/info/mijn-privacy/privacybeleid-bij-opnames"]
title = "Privacybeleid bij opnames | VRT"
description = "Hallo! Wanneer je wilt meewerken of deelnemen aan een programma of opnames in het kader van een evenement, project of wedstrijd van VRT, hebben we bepaalde gegevens van jou nodig. We leggen je hier uit welke gegevens we precies van jou verzamelen en gebruiken, en wat wij ermee doen."
full_description = "Home/Mijn Privacy/Privacybeleid bij opnamesPrivacybeleid bij opnamesHallo! Wanneer je wilt meewerken of deelnemen aan een programma of opnames in het kader van een evenement, project of wedstrijd van VRT, hebben we bepaalde gegevens van jou nodig. We leggen je hier uit welke gegevens we precies van jou verzamelen en gebruiken, en wat wij ermee doen.Wie is verantwoordelijk voor het verzamelen en gebruiken van mijn gegevens?Wij zijn de Vlaamse Radio- en Televisieomroeporganisatie (of kortweg VRT). Wij zijn een nv van publiek recht, met maatschappelijke zetel te Auguste Reyerslaan 52, 1043 Brussel, ingeschreven in de KBO met nummer 0244.142.664. Deze privacyverklaring geldt voor de persoonsgegevens die wij van jou verzamelen en gebruiken wanneer je deelneemt aan een van onze programma’s op radio, televisie en/of online, of aan beelden of opnames in het kader van een evenement, project of wedstrijd van VRT. De verzameling en verwerking van je gegevens zijn onze verantwoordelijkheden. Waarop is deze privacyverklaring van toepassing?Deze privacyverklaring is van toepassing wanneer we je gegevens verzamelen en gebruiken voor je (mogelijke) deelname aan een van onze radio-, televisie- of online programma’s of opnames in het kader van een van onze evenementen, projecten of wedstrijden. Dit kan bijvoorbeeld als figurant in een fictiereeks, als deelnemer aan een wedstrijd- of quizprogramma, of als geïnterviewde wanneer een VRT-medewerker op straat een interview van je afneemt. Waarom verzamelt VRT mijn gegevens en op welke basis?Wanneer je wilt deelnemen aan een van onze programma’s of aan opnames in het kader van een van onze evenementen, projecten of wedstrijden, verwerken wij je gegevens voor het produceren en (laten) (her)uitzenden van het programma of de betrokken opnames, of fragmenten daarvan. Dit betekent onder meer dat we je gegevens verzamelen en gebruiken voor de volgende verwerkingsactiviteiten: het selecteren van deelnemers aan het programma of de opnames voor het evenement, het project of de wedstrijd;het produceren van het programma of de opnames in kwestie;het (laten) (her)uitzenden van het integrale programma, de betrokken opnames of fragmenten ervan;het uitvoeren van marketing-, reclame- of promotieactiviteiten voor het programma of het evenement, het project of de wedstrijd in het kader waarvan de opnames werden gemaakt (bijvoorbeeld events, sponsoring en reclame); het (laten) opslaan van het programma of de opnames in archieven;de naleving van wettelijke verplichtingen (bijvoorbeeld fiscale aangifte); en/ofgeschillenbeheer. Door je (mogelijke) deelname aan het programma of de opnames in het kader van het evenement, het project of de wedstrijd, komt er een overeenkomst tot stand tussen jou en VRT. Op basis van deze overeenkomst kan VRT je gegevens verzamelen en gebruiken op de in deze verklaring beschreven manier. Het is belangrijk dat je er je van bewust bent dat heel wat mensen het programma of de opnames zullen kunnen bekijken en/of beluisteren. Indien je bepaalde gegevens niet (correct) verstrekt, kan dit er echter toe leiden dat de uitvoering van een eventuele overeenkomst met VRT niet meer mogelijk is en je dus niet aan het programma kan deelnemen.Voor de verwerking van bepaalde gegevens (bijvoorbeeld gevoelige gegevens met betrekking tot je gezondheid) zal je ons echter toestemming moeten geven, of kan er een wettelijke grondslag bestaan op grond waarvan VRT de gegevens verwerkt.Welke gegevens verzamelt VRT van mij?Ten eerste verzamelen wij identificatiegegevens van jou. Dit kan bijvoorbeeld je naam en contactgegevens zijn. Die informatie krijgen we bijvoorbeeld wanneer je je gegevens rechtstreeks aan ons meedeelt. Je deelt je gegevens onder meer mee wanneer je je inschrijft voor een quizprogramma of je je laat interviewen door een van onze medewerkers op straat.Ten tweede kunnen wij gegevens over je persoonlijke kenmerken verzamelen, indien dit van belang is voor het programma of de opnames in kwestie. Dit kan bijvoorbeeld gaan over je vrijetijdsbesteding of interesses, je beroep of betrekking. Tijdens de productie van het programma of in het kader van het evenement, het project of de wedstrijd zullen ook beeld- of geluidsopnamen van je worden gemaakt. Je beeltenis en/of stem, maar ook, al naargelang het geval, andere fysieke kenmerken, psychische kenmerken, leefgewoonten, woningkenmerken, en dergelijke meer kunnen op die manier gebruikt worden in het kader van het programma en de opnames. Bijzondere categorieën van gegevens, zoals gegevens over je gezondheid, politieke voorkeur en seksuele geaardheid, zullen enkel worden verwerkt wanneer deze door jezelf openbaar worden gemaakt.Van welke bronnen verzamelt VRT mijn gegevens?Wij verzamelen gegevens:Van jou rechtstreeks, bijvoorbeeld wanneer je je inschrijft voor een quizprogramma van VRT.Van derde partijen met wie we samenwerken in het kader van de productie van programma’s of de opnames in het kader van een van onze evenementen, projecten of wedstrijden, zoals bijvoorbeeld productiehuizen, beheerders van castingtools en andere databanken. Wat doet VRT met de gegevens van minderjarigen?Kinderen en minderjarigen zijn kwetsbare individuen. Daarom schenken wij extra aandacht aan hen in het kader van de deelname aan programma’s of andere opnames. Dit doen we onder meer door enkel gegevens van minderjarigen te gebruiken mits hun ouder of voogd akkoord gaat met hun deelname; ook daar zullen we de gegevens van de deelnemende minderjarigen worden verwerkt op grond van de overeenkomst die met de ouder of voogd en VRT tot stand komt. Welke derde partijen kunnen mijn gegevens ontvangen?In het kader van haar programma’s, kan VRT je gegevens o.m. delen met:productiehuizen en hun leveranciers (bijvoorbeeld cameraploegen);media- en distributiekanalen (televisie-omroepen, kranten, websites, radio-omroepen, sociale media, drukkerijen enz.);kijkers;beheerders van castingtools (bijvoorbeeld In The Picture);beheerders van planningbeheer en databanken (bijvoorbeeld DzjinTonik);archiefbanken zoals meemoo het Vlaams Instituut voor Archivering (vroeger VIAA);andere televisiezenders (bijvoorbeeld omdat zij een licentie verkrijgen op het programma);financiële- en verzekeringsinstellingen;externe adviseurs;gerecht en politiediensten; enoverheidsdiensten.Hoe kan ik mijn rechten uitoefenen?Omdat het hier over je gegevens gaat, vinden we het belangrijk dat je je persoonlijke informatie op elk moment kan controleren. Je hebt daarom een aantal rechten, die je overeenkomstig de voorwaarden en modaliteiten van de Europese privacywetgeving kan uitoefenen. Je kan hiervoor onze klantendienst contacteren of de verantwoordelijke producer van het programma waaraan je deelneemt of hebt deelgenomen. We zullen je vraag dan zo snel mogelijk behandelen.Hierbij benadrukken we wel dat je deze rechten niet kan uitoefenen voor de gegevens die in het programma, of in de opnames in het kader van het evenement, het project of de wedstrijd zelf verwerkt zijn, zoals bijvoorbeeld je beeltenis, stem of andere persoonsgegevens die in het programma of de opnames aan bod komen. Als je deelneemt aan onze programma’s of andere opnames zal je de hieronder vermelde rechten dus niet kunnen uitoefenen ten opzichte van de gegevens die in het kader van het programma of de opnames voor het evenement, het project of de wedstrijd zelf gebruikt worden. Eens je hebt deelgenomen zal je dus niet zomaar kunnen terugkomen op de manier waarop je in het programma of de opnames aan bod komt. Deze verklaring doet dus geen afbreuk aan de uitzonderingen die gelden voor verwerkingen voor artistieke en journalistieke doeleinden.Recht op inzage: Je hebt het recht op inzage van je gegevens. Dat wil zeggen dat je kan nagaan welke gegevens wij van jou hebben.Recht op rectificatie: Je hebt het recht op rectificatie van je gegevens. Het zou kunnen dat wij gegevens van jou hebben die niet juist of niet meer juist zijn. Wij vragen je vriendelijk om ons op de hoogte te ·brengen wanneer je persoonsgegevens gewijzigd zijn zodat je gegevens in onze gegevensbanken zo juist en volledig mogelijk zijn.Recht op verwijderen: Als je wilt dat we je gegevens niet langer bewaren of gebruiken, kan je je gegevens bij ons wissen. Wij zijn wel niet altijd verplicht je gegevens te wissen wanneer je dat vraagt. We hoeven dat enkel te doen in de gevallen die door de wet zijn bepaald. Recht op beperking: Je kan ons verzoeken om de verwerking van je gegevens te beperken. In dat geval blijven we je gegevens bewaren, maar zullen we het gebruik ervan inperken. Dat gebeurt bijvoorbeeld wanneer je meent dat je gegevens onjuist zijn en je niet wilt dat we die gegevens nog verwerken totdat ze zijn aangepast. We zijn wel niet altijd verplicht om aan dergelijke verzoeken tegemoet te komen. We hoeven dat enkel te doen in de gevallen die door de wet zijn bepaald.Recht om bezwaar te maken tegen het gebruik van je gegevens: Dat wil zeggen dat je je kan verzetten tegen het verdere gebruik van je gegevens door ons. Je kan dit enkel doen wanneer je grondige redenen hebt die verband houden met je specifieke situatie. Ook hier zijn wij niet altijd verplicht om op een dergelijk verzoek in te gaan.Recht om toestemming in te trekken: wanneer de verwerking op je toestemming gebaseerd is, heb je het recht je toestemming in te trekken. Deze intrekking heeft evenwel geen invloed op het rechtmatig karakter van de verwerking op basis van je toestemming die heeft plaatsgevonden voor de intrekking daarvan.Wanneer je ons een van de bovenstaande vragen stelt, zou het kunnen dat we eerst bijkomende informatie vragen voordat we verdere stappen kunnen nemen. Dat moeten we doen om te controleren of jij wel de juiste persoon bent. Hoelang bewaart VRT mijn gegevens?Al onze programma’s en de gemonteerde opnames in het kader van onze evenementen, projecten of wedstrijden zullen onbeperkt in de tijd worden bewaard in onze archieven en de archieven van meemoo (voorheen het Vlaams Instituut voor Archivering - VIAA). De gegevens die in het programma of de betrokken opname zelf gebruikt worden zullen aldus onbeperkt in de tijd bewaard worden.Andere (persoons)gegevens verbonden aan je deelname aan onze programma’s of andere opnames zullen niet langer bewaard worden dan nodig is voor het vooropgestelde doel. Bij wie kan ik terecht met verdere vragen of eventuele klachten rond privacy?Heb je onze privacyverklaring volledig doorgenomen, maar nog geen antwoord op je vraag gevonden? Stel je vraag in verband met privacy dan via onze klantendienst (klantendienst@vrt.be) of de verantwoordelijke producer van het programma waaraan je hebt deelgenomen. Daar zullen wij je vraag zo snel mogelijk beantwoorden.Wij hopen dat je de volgende e-mailadressen niet snel zal nodig hebben. Maar voor klachten met betrekking tot onze privacyverklaring sturen wij je graag door naar klachtenprocedure@vrt.be, of kan je terecht bij onze Data Protection Officer (DPO), de persoon die waakt over de bescherming van je gegevens bij VRT, via DPO@vrt.be. Als je wil, kan je ook een klacht indienen bij een toezichthoudende autoriteit. In België is dit de Gegevensbeschermingsautoriteit. Meer informatie daarover vind je terug op hun website.Kan deze privacyverklaring veranderen?Deze privacyverklaring kan aangepast worden, als onze afspraken met jou of de geldende wetgeving dat vragen. Natuurlijk laten we je weten wanneer er belangrijke wijzigingen zijn, en je kennisname laten bevestigen indien nodig.Verken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerWoon een opname bijAltijd al eens in de studio willen zitten tijdens de opname van een show? Schrijf je nu in en we reserveren een zitje speciaal voor jou!Mijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
