title = "Ontdek de genomineerden voor het Gala van de Gouden K's | VRT"
description = "Timon Verbeeck genomineerd voor maar liefst drie Gouden K'sZonet zijn in de&nbsp;Gouden K’s stemspecial&nbsp;op Ketnet de genomineerden voor&nbsp;Het Gala van de Gouden K's 2024&nbsp;voorgesteld. Wie er in de prijzen valt ligt helemaal in handen van de Ketnetters zelf.&nbsp;Stemmen op je favorieten kan tot zondagavond 15 december via Ketnet op&nbsp;VRT MAX."
full_description = "Home/Over ons/Nieuws over VRT/Ontdek de genomineerden voor het Gala van de Gouden K'sOntdek de genomineerden voor het Gala van de Gouden K's09 december 2024Timon Verbeeck genomineerd voor maar liefst drie Gouden K'sZonet zijn in de Gouden K’s stemspecial op Ketnet de genomineerden voor Het Gala van de Gouden K's 2024 voorgesteld. Wie er in de prijzen valt ligt helemaal in handen van de Ketnetters zelf. Stemmen op je favorieten kan tot zondagavond 15 december via Ketnet op VRT MAX.Ketnet deelt de awards uit op zaterdag 25 januari 2025, in de grootste zaal van België: het Sportpaleis. Alle Ketnet-wrappers presenteren de show en een heleboel bekende sterren maken de winnaars bekend. Aaron Blommaert tekent alvast present want hij zal optreden. Meer namen worden later bekendgemaakt, maar wat nu al vast staat: het wordt een stevig feestje!Volg Het Gala van de Gouden K's 2024 op zaterdag 25 januari live op Ketnet en VRT MAX vanaf 18.30 uur. Of wees er zelf bij en kom meefeesten in het Sportpaleis. Tickets en info zijn verkrijgbaar via ketnetvoorouders.be.Wie zijn de genomineerden voor Het Gala van de Gouden K's 2024Ontdek hieronder de genomineerden van het Gala van de Gouden K's 2024. Opvallend: Timon Verbeeck maakt maar liefst kans op drie Gouden K's en ook MAKSIM en Hannah Mae kunnen opnieuw een prijs in de wacht slepen voor 'Ik wil dat je liegt'. Dit jaar werd er een nieuwe categorie toegevoegd, die van beste Teamwork.SongEuropapa van Joost KleinOn Met La Patate van Omdat Het Kan & Average RobOeh La La La van CAMILLEIk Wil Dat Je Liegt van MAKSIM & Hannah MaeArtiestCAMILLERoxy DekkerAaron BlommaertPommelien ThijsFamilieprogrammaThe Masked SingerMiloKamp WaesDe Slimste Mens ter WereldKetnet-sterJelle Mels (Karrewiet)Jean-Romy Manzila (Raad v Soekie, Prank Squad)Ayana Doucouré(Hawa & Adam)Imea Denooze (GameKeepers)Ketnet-programmaOtis-SkateDe FakerKapot GaanDe Raad van SoekieTeamworkCéline Dept gaat viral met Kylian MbappeBert De Kock speelt mee in de nieuwe film van K3Timon Verbeeck en Thomas De Smet verbreken een wereldrecord in Hoe moeilijk kan het zijn?Pommelien Thijs en MEAU brengen samen Het Midden uitOnline SterTimon VerbeeckCéline DeptSteffi MercieElias VerwiltOnline KanaalMaxime & SophieKarrewietDutchtuberRutger & ThomasHeldOmdat Het Kan & Average Rob zorgen voor het supporterslied van de sportzomerRemco Evenepoel wint twee gouden Olympische medaillesTimon Verbeeck verovert de wereldGloria en Bart maken dromen waar in de DroomfabriekOutfitOok de mooiste outfit wordt beloond met een Gouden K. De winnaar wordt tijdens het Gala zelf gekozen.Ketnetters kunnen stemmen op hun favorieten via VRT MAX.Wil je de unieke show meemaken in het Sportpaleis? Tickets zijn verkrijgbaar via ketnetvoorouders.be.Tijdens de opnames werkt VRT met MobileConnect voor luisterondersteuning voor doven en slechthorenden. Mensen met een hoorapparaat of implantaten kunnen zo de presentaties én optredens glashelder streamen via hun gsm naar hun apparaten. Wil je alles te weten komen over de toegankelijkheid van de Gouden K's? Neem een kijkje op onze informatiepagina over de toegankelijkheid van de Gouden K's.Het Gala van de Gouden K's | zaterdag 25 januari | vanaf 18.30 uur live op Ketnet en op VRT MAX Lees zeker ookNieuws & informatieSarah Mouhamou neemt na elf jaar afscheid als Ketnet-wrapperSport & ontspanningSpetterende optredens op het Gala van de Gouden K'sOver VRTDe Ketnet-kroket komt terug!Over VRTHallo kroket!: de terugkeer van live avontuur op KetnetJongerenGlamour en Noncha zijn verkozen tot Kinderwoord en Tienerwoord van het JaarJongerenBen je noncha of sigma? Of kan je goed yappen? What the skibidi!Over VRTHallo Kroket! Ketnet en Ketnet Junior zitten in een nieuw jasjeDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
