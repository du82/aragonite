["https://vrt.be/nl/ons-aanbod/vrt-1"]
title = "VRT 1 | VRT"
description = "VRT 1 is het grootste televisienet van de Vlaamse publieke omroep VRT en ook het meest populaire in Vlaanderen. Het is er voor alle Vlamingen  in al hun eigenheid en verscheidenheid. VRT 1 voelt en voedt de hartslag van de Vlaamse samenleving door mediagebruikers te benaderen vanuit een nabijheid en een betrokkenheid. VRT 1 wil het publiek informeren, inspireren en verbinden.  Het brengt nieuws en duiding, human interest, eigen fictie, ontspanning met maatschappelijke meerwaarde en sport."
full_description = "Home/Ons aanbod/VRT 1VRT 1VRT 1 is het grootste televisienet van de Vlaamse publieke omroep VRT en ook het meest populaire in Vlaanderen. Het is er voor alle Vlamingen in al hun eigenheid en verscheidenheid. VRT 1 voelt en voedt de hartslag van de Vlaamse samenleving door mediagebruikers te benaderen vanuit een nabijheid en een betrokkenheid. VRT 1 wil het publiek informeren, inspireren en verbinden. Het brengt nieuws en duiding, human interest, eigen fictie, ontspanning met maatschappelijke meerwaarde en sport. VRT 1 brengt mensen samen met straffe verhalen van hier en ontspannende content van de bovenste plank. De leefwereld van het publiek is de inspiratiebron voor alles wat VRT 1 brengt. Waar zijn de mensen mee bezig, welke zaken doen er echt toe? Zo spreekt het merk dagelijks een breed publiek aan en is VRT 1 relevant voor jong en oud. Kijkers kunnen zich herkennen in de content, en dat levert heel wat voer voor gesprekken. Hierdoor slaagt VRT 1 erin om een breed publiek aan te spreken. Kwalitatieve programma’s met meer dan een miljoen kijkers zijn geen uitzondering. VRT 1 schuwt ook moeilijke thema’s niet. VRT 1 slaagt er met haar series in om het publiek kennis te laten maken met een onbekende wereld, om hun blik op de ander te verruimen. Die combinatie van herkenbare verhalen en prikkelende vernieuwing maakt van VRT 1 een relevant merk: het is geen ‘ver van mijn bed’-show, maar van hier, actueel. Een mix van vertrouwd en verrassend.Pijlers voor de toekomst Om alle Vlamingen te blijven prikkelen met zijn aanbod en in de toekomst zijn missie te blijven waarmaken, hecht VRT 1 veel belang aan de volgende speerpunten: Continuïteit VRT 1 profileert zich als een betrouwbare vriend, een merk waarop de kijker elke dag opnieuw kan rekenen voor straffe content en ontspannende verhalen. Dat dagelijkse engagement is voor VRT 1 heel belangrijk: het is een belofte aan de kijker om niet teleur te stellen. Om die belofte na te komen, is continuïteit cruciaal. Elke dag opnieuw, 365 dagen per jaar, moet VRT 1 er zijn voor zijn kijkers. Dat betekent niet dat het onmogelijk is om in bepaalde periodes gas terug te nemen, VRT 1 volgt hier het ritme van de kijker. De zomervakantie is bijvoorbeeld typisch een periode waarin mensen vaker buiten vertoeven en minder televisie kijken. Bekende schermgezichten en betrouwbare afspraken zijn belangrijk om de continuïteit te waarborgen. VRT 1 investeert in langetermijntrajecten met schermgezichten. Het merk houdt ook vast aan de terugkerende, dagelijkse afspraken. Neem bijvoorbeeld Thuis. Thuis is voor veel fans een ankerpunt, waar mensen hun avond rond plannen. Het is dan ook essentieel dat VRT 1 blijft investeren in dergelijke betrouwbare en vaste waarden.Simone, Sunny en Rosa uit ThuisPremium content Door de komst van andere spelers op de markt is het aanbod sterk toegenomen. De kijker legt de lat steeds hoger. In die context moet VRT 1 elke dag opnieuw bewijzen dat het merk een meerwaarde is door in te zetten op straffe kwalitatieve content. Dat streven komt duidelijk naar voren in het fictieaanbod. VRT 1 heeft een ijzersterke reputatie op vlak van fictie. Verschillende series zijn internationaal bekroond. Fictie spreekt als genre zowel jong als oud aan. Met sterke fictiereeksen kan VRT 1 mensen over generaties heen verbinden. Ook bij het selecteren van fictie houdt VRT 1 rekening met het DNA van het merk. De fictiereeksen zijn in eerste instantie altijd ontspannend, fijn om naar te kijken. De verhalen zijn uit het leven gegrepen, soms herkenbaar en soms verrassend. Ze vertellen iets over de Vlaamse identiteit, houden de kijker een spiegel voor en leren hem naar een andere wereld kijken. Belangrijk is dat de reeksen verbindend zijn. Mensen komen samen om naar fictie te kijken. Vooral de programmatie op zondagavond en Thuis zijn daar zeer sterk in en brengen een groepsgevoel teweeg. In het hier en nu VRT 1 onderscheidt zich van internationale spelers met programma’s die hier gemaakt zijn, dichtbij, herkenbaar, live of dagvers. Het aanbod van VRT 1 bestaat grotendeels uit Vlaamse content. Heel wat programma’s worden ook dagvers gemaakt. Zo kan VRT 1 inspelen op de actualiteit en dat integreren in het aanbod. Iedereen beroemd gaat bijvoorbeeld dagelijks op pad om rubrieken te vullen met actuele content, warme ontmoetingen en verrassende verhalen. Door in te spelen op dat moment toont VRT 1 aan de kijkers dat het merk dicht bij hun leefwereld staat. Wat overdag gebeurt, is ’s avonds een gespreksonderwerp in de talkshow. VRT 1 wil ook naast het televisiescherm ten volle in het nu staan. Via (online) campagnes en evenementen trekt VRT 1 de verhalen door tot het echte leven en wordt er een rijkere beleving gecreëerd.Klikipedia van Iedereen beroemdOok niet-lineair aanwezig Lineair televisiekijken is en blijft populair in Vlaanderen. Voor veel kijkers zijn de lineair uitgezonden programma’s vaste afspraken in hun dag. Toch is er een groeiende groep kijkers die vaker naar het niet-lineaire aanbod grijpt en uitgesteld gaat kijken, waar en wanneer ze zelf willen. VRT 1 gaat mee in die evolutie. Het merk zet zich in om het niet-lineaire aanbod op VRT MAX, YouTube en sociale media uit te breiden. Dat meer mensen op een niet-traditionele manier naar televisie kijken, betekent niet dat het lineaire aanbod moet verdwijnen, integendeel, het is een complementair verhaal. Gespecialiseerde websites Naast de sites van de merken zijn er een aantal gespecialiseerde websites die gekoppeld zijn aan VRT 1: Dagelijkse kost: site met de recepten en tips van Jeroen Meus. Hier kom ik Thuis is de grootste, online fangroep van Thuis. Meer dan drieëndertigduizend fans van het populairste verhaal van Vlaanderen zoeken elkaar dagelijks op om over hun reeks te praten, te fantaseren en emoties te delen. Via het VRT 1-kanaal op VRT MAX kan je alle programma’s van VRT 1 (her)bekijken, waar en wanneer je maar wil. Je vindt hier ook alle podcasts van VRT 1.Nieuwsbrief Wil jij alle nieuwtjes over VRT 1 ontdekken? Je kan je daarvoor inschrijven via VRT-profiel. Ontdek het aanbod van VRT 1Kijk en luister opVRT MAXMeer weten? Lees ook deze artikelsProducties | Sport & ontspanningGelukkig gescheiden: leve de liefde na de liefdeMuziekRed Sebastian gaat voor België naar het Eurovisiesongfestival in Bazel met 'Strobe lights'ProductiesMan bijt hond: een inkijk in het dagdagelijkse maar niet alledaagse leven van de VlamingMuziekVan backstage in Vlaanderen tot in Bazel: de weg naar Eurosong 2025 Over VRTOntdek het voorjaar 2025 van VRT 1ProductiesVRT 1 lost eerste namen: deze bekende Vlamingen beklimmen de Kilimanjaro in 'De rugzak'MuziekWie maakt er kans op een MIA?ProductiesOntdek de eerste beelden van nieuwe fictiereeks 'This is not a murder mystery'Verken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
