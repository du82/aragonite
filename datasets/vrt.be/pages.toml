["https://vrt.be/nl/ons-aanbod/radio-2"]
title = "Radio2 | VRT"
description = "Radio2 is de grootste radiozender van de Vlaamse publieke omroep VRT en ook de meest populaire in Vlaanderen. Radio2 biedt houvast, ontspanning en optimisme met praktische tips voor het dagelijkse leven, veel aandacht voor regionaal nieuws, herkenbare menselijke verhalen uit heel Vlaanderen en een uitgesproken Nederlandstalig muziekaanbod."
full_description = "Home/Ons aanbod/Radio2Radio2Radio2 biedt houvast, ontspanning en optimisme met praktische tips voor het dagelijkse leven en helpt de luisteraars om de wereld veraf en dichtbij beter te begrijpen.Radio2 is de grootste radiozender van de Vlaamse publieke omroep VRT en ook de meest populaire in Vlaanderen. Radio2 is een compagnon die zijn luisteraars door de dag loodst en hen helpt om de wereld veraf en dichtbij te begrijpen. De zender heeft een hoge gebruikswaarde in het dagelijkse leven en is emotioneel nabij. Radio2 voelt en versterkt de polsslag van de Vlaamse samenleving, met veel aandacht voor regionaal nieuws, herkenbare menselijke verhalen uit heel Vlaanderen en een uitgesproken Nederlandstalig muziekaanbod. Radio2 is al jarenlang markleider in Vlaanderen, met een marktaandeel van zo’n 25%. Daarmee bekleedt het merk een vrij unieke positie in Europa en geniet tegelijk de hoogste waardering als radiozender in Vlaanderen. De blijvende populariteit van Radio2 wordt verklaard door de unieke identiteit van het merk. Radio2 is een baken van vertrouwen en helpt de luisteraars doorheen de dag met praktische informatie, ontspannende content, verhalen van dichtbij en een breed scala aan muziek. De zender biedt een genuanceerde kijk op de wereld waarbij aanstekelijk optimisme en een positieve ingesteldheid horen.Elke dag telt voor 2 Luisteren naar Radio2 zorgt voor een win-win. Iedereen is welkom en wordt met warmte en genegenheid onthaald. Radio2 zorgt voor verbondenheid en laat de luisteraars echt kennismaken met Vlaanderen en zijn inwoners. Het aanbod vertrekt vanuit herkenbaarheid en wordt gevormd door sterke, menselijke en persoonlijke verhalen. Een lach en een traan, ernstig waar het moet en met een kwinkslag waar het kan. Die unieke aanpak hoor je al van ‘s ochtends vroeg in Goeiemorgen Morgen! waar Peter Van de Veire de luisteraars wakker maakt en waar Margaux al vroeg op pad gaat door Vlaanderen op zoek naar fijne belevenissen. De Vlaamse samenleving in al haar facetten vormt een onuitputtelijke inspiratiebron. Verschillende programma's maken maatschappelijke thema’s bespreekbaar, zoals de kinderwens van mensen met een mentale beperking en rouwverwerking bij jongeren. Moeilijke kwesties worden niet uit de weg gegaan, en verhalen die leven in Vlaanderen worden op de agenda gezet. In het avondprogramma Radio2 Wijs met Karolien Debecker wordt door luisteraars gediscussieerd en verschillende thema’s worden bespreekbaar gemaakt. Radio2 brengt ook ontspanning en amusement. Programma’s als Radio2 Weekwatchers, De zoete inval of Wijs haken op een bruisende en geïnspireerde manier in op de actualiteit en zorgen voor de nodige dosis humor en relativering. Ontladende momenten en ruimte voor maatschappelijke reflecties, doorspekt met humor: ook dat is Radio2.Geniet nu van Radio2Luister live opVRT MAXGeïnspireerd door het dagelijkse leven Radio2 biedt een handleiding om beter om te kunnen gaan met de informatiestroom die elke dag op luisteraars afkomt. Het merk maakt een relevante selectie en legt ingewikkelde kwesties uit, met aandacht voor de praktische gebruikswaarde. Zo helpt het consumentenprogramma WinWin dagelijks om uiteenlopende problemen met aankopen, geldzaken, ... op te lossen. Xavier Taveirne gaat elke dag aan de slag met een verhaal, vraag, getuigenis of ervaring van een luisteraar. Hij zoekt naar oplossingen, verklaringen en advies, zodat we samen slimmer en sterker worden als consument. Ook op VRT NWS, VRT MAX en andere VRT-merken is WinWin dé rots in de branding voor de consument.Ontdek de podcasts van Radio2Als de muren konden pratenRoyalteaMens erger je nietDe Zoete InvalAlles goed?Peter Van de Veire & De ZandloperDe Rechtvaardige RechtersMysteries van VlaanderenDe RotondeDe SpiegelLuister opVRT MAXBreed muziekaanbod met artiesten van bij ons Het muziekaanbod is een belangrijk onderdeel van wat Radio2 als ontspanningszender brengt. De muziekprogrammering van het merk is zeer gevarieerd, breed toegankelijk en tijdloos, bestaande uit hits en successen uit de populaire genres van de jaren 60 tot vandaag. Radio2 pikt in op tendensen in de popmuziek én kiest ook voor vertrouwde hits allertijden. Op muzikaal vlak breekt Radio2 een lans voor Nederlandstalige en Vlaamse muziek in haar diverse verschijningsvormen. Vlaamse en Nederlandstalige producties eisen een belangrijke plaats op in de speellijsten, wat een unieke sterkte is van het merk. Events zoals Zomerhit en grootste muziekacties zorgen voor extra muziekaanbod op Radio2. Met De Eregalerij eert de zender elk jaar verdienstelijke artiesten en componisten die hebben bijgedragen tot het rijke repertorium van Vlaamse evergreens. Duik in het Radio2-kijkaanbod op VRT MAXOntdek nu opVRT MAXRadio2 aan zeeRadio2 aan zee is een toegankelijk event in samenwerking met VRT. De bekende Radio2-dj's vatten post aan de Belgium Pier in Blankenberge voor acht weken Radio2 aan zee. Dat belooft acht weken lang een muzikaal festijn aan de Belgische Kust met elke weekdag optredens van bekende artiesten. Lees meerMeer weten? Lees ook deze artikelsMuziekGorki verovert met Mia de eerste plaats van de Radio2 Top2000 Aller TijdenOver VRTWinWin wint Wablieft-prijs voor duidelijke taalMuziekPeter Vanlaet schittert in Radio2 EregalerijZingeving & solidariteitRadio2 Dansathon: Peter Van de Veire danst 24 uur tegen kankerMuziekZing Mia Mee: VRT herdenkt Luc De VosMuziekRadio2 zet Peter Verhulst in de bloemetjesMuziekDe Eregalerij eert Yasmine op donderdag 17 oktoberMuziekZing en dans mee met de genomineerden van ZomerhitRegiokantoren van Radio2Radio2 AntwerpenRadio2 Brussel en Vlaams-BrabantRadio2 LimburgRadio2 Oost-VlaanderenRadio2 West-VlaanderenVerken ons aanbodVRT heeft een brede merkenportefeuille waarvoor ze autonoom verantwoordelijk is. De merken focussen in hun aanbod op de publieke opdracht, elk voor hun doelgroep of specifiek domein. Centraal staan informatie, cultuur en educatie.Lees meerBenieuwd naar het reilen en zeilen achter de