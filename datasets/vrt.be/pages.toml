title = "Chloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’ | VRT"
description = "Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen."
full_description = "Home/Over ons/Nieuws over VRT/Chloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Chloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’28 januari 2025Elke dag behandelt de VRT-klantendienst een heleboel vragen, opmerkingen en klachten van het publiek. Chloë van de Klantendienst neemt de verzamelde klachten onder de loep en vat ze op eigenzinnige manier samen.De afgelopen 21 dagen werd er 2.934 keer contact opgenomen met onze dienst. Een eerste klacht gaat niet over een uitzending, maar wel over een uiting van een VRT-gezicht. “Ik lees zojuist in Nina dat de goedlachse en sympathieke Manu Van Acker openlijk toegeeft dat hij zowel glazen als kaarshouders steelt in cafés. Wat een voorbeeld! Gewoon de schaamte voorbij.”De goedlachse Manu heeft me per schriftelijk antwoord verzekerd dat hij dergelijke dingen niet meer doet. “Een jeugdzonde, ach. Wie vrij is van zonde, werpe de eerste steen.”In onze repliek hebben we Manu wel gewezen op zijn ziekelijke kleptomanie. Zo heeft hij een jaar geleden een volledige doos lanyards met een oud VRT-logo meegenomen op onze Klantendienst. Maar, zo verdedigt de dief zich, “die doos stond bij het afval”. Iets wat wij niet ontkennen. Dumpster diving is niet verboden bij de publieke omroep. Er staat hier ergens nog een doos met shiny-floor show ideeën, Manu!Verder geeft ons lachebekje nog toe licht gecharmeerd te zijn. “Mensen lezen écht interviews met mij!” En wij nu ook.Gesmodder en geplakVerschillende kijkers van de VRT 1-reeks Thuis deelden hun uiteenlopende grieven. Iemand wijst erop dat terugkomer Kaat al twee keer dronken aan de toog vertoefde. “Kinderen kijken ook naar dit programma, hé.”Iemand anders hekelt het taalgebruik in de dialogen van “het simplistisch verbond, bij deze Thuis genaamd”. Hij heeft het over uitdrukkingen als “ça va”, “shit” en “what the fuck”. “Dat anglofiel, platvloers riooltaaltje wordt in geen enkel land zo omarmd, zelfs in het Verenigd Koninkrijk niet.” Mijn tienerkinderen bezigen datzelfde riooltaaltje, hoor. Maar ik vraag het voor de zekerheid even na bij de collega’s van EastEnders op BBC One.En voor deze kijker is het genoeg geweest met dat “gesmodder en geplak”. Ik dacht eerst dat het over de netheid ging in Bar Madam, maar de klager maakt het concreter. “En dat altijd tussen twee mensen van hetzelfde geslacht. Tegenwoordig gaan kinderen denken dat dat het normaal is.” Prima, toch? VRT is de publieke omroep voor iedereen in Vlaanderen. We tonen dus de diversiteit van onze maatschappij op een inclusieve manier. Dat wil zeggen: inclusief “gesmodder en geplak” tussen alle mensen.Genoeg SoenensOok Ben Crabbé en zijn Blokken blijven de gemoederen beroeren. Deze keer omdat de uitzending op 20 januari moest wijken voor de inauguratie van Trump! “Dat onnozel schouwspel kan gerust een item zijn in VRT NWS, Terzake of De afspraak, maar je moet er ons niet mee lastigvallen tijdens andere programma’s!” Ik noteer: Ben Crabbé - Donald Trump: 1-0!Gelukkig vallen er regelmatig ook complimenten in onze mailbox, zoals deze aan het adres van uittredend VS-correspondent Björn Soenens. “Hij deed zijn job super, bracht het nieuws uit de VS op een duidelijke, aangename manier en met een mooie, warme stem. Ik ga hem hard missen op televisie.” Wees gerust, er zal nog genoeg Soenens zijn voor iedereen. Intussen, proficiat Björn met de Chloë Complimenten Wisselbeker.Jas van UrbanusDan is er nog deze vraag van een echte fashionista. “Ik ben al lange tijd op zoek naar de jas die Urbanus draagt in Koko Flanel maar kan hem nergens vinden. Hebben jullie soms nog één die jullie kunnen verkopen aan mij? Maat XL zou prima zijn.” BRT was destijds coproducent van deze film. Toch hebben we niet de ganse stock van dit stijlvolle rekwisiet ingekocht. Misschien dat Urbain er zelf nog eentje heeft? Maar ik wil niet gezegd hebben dat hij het in maat XL draagt.In dat kader nog een belangrijk bericht aan HLN-columnist Marnix Peeters: deze historische modefilm is nog tot 11 februari te bekijken op VRT MAX. Daarna maakt Koko Flanel weer plaats voor iets met een groep vedetten die onder luid gekwetter zichzelf tegenkomen.Tot slot nog een klacht over De repair shop. “Waarom komt er op vrijdagavond na Thuis geen ontspannende serie meer op VRT 1? Alsof iemand zin heeft om op deze avond te knutselen?” Van mij mag er op vrijdagavond wat meer gefrutseld worden. Aan mijn man: neem hier acte van, Michel.Chloë van de KlantendienstColumnChloë van de KlantendienstOver VRTChloë van de Klantendienst: ‘Er staat hier ergens nog een doos met shiny-floor show ideeën’Over VRTChloë van de Klantendienst: ‘Het wordt absurd als we deze catchphrases door de vertaalmachine halen’Over VRTChloë van de Klantendienst: ‘Ja, hoe doet zo’n minister eigenlijk haar behoefte?’Over VRTChloë van de Klantendienst: ‘Sven de Leijer mag uitnodigen wie hij zelf wil’Over VRTChloë van de Klantendienst: ‘Mocht Riadh Bahri een korte broek dragen, was het kot te klein’Over VRTChloë van de Klantendienst: ‘Er zijn nog meer kijkers die menen dat VRT ‘afglijdt’ richting de concullega’s’Over VRTChloë van de Klantendienst: ‘Hiermee is de eerste ‘en dat met ons belastinggeld’ van het seizoen binnen’Over VRTChloë van de Klantendienst: ‘Beseffen jullie niet dat de Vlamingen dit beu zijn?’Lees alle columns van ChloëDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
