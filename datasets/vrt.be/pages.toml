["https://vrt.be/nl/info/vrt-profiel/vragen-over-aanmelden-vrt-profiel"]
title = "Vragen over het aanmelden bij een VRT-profiel | VRT"
description = "Voor het gebruik van VRT MAX en een aantal toepassingen op onze websites en apps moet je een VRT-profiel aanmaken. De belangrijkste vragen kan je hier vinden."
full_description = "Home/VRT-profiel/Vragen over het aanmelden bij een VRT-profielVragen over het aanmelden bij een VRT-profielVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites en apps moet je een VRT-profiel aanmaken. De belangrijkste vragen kan je hier vinden.Hoe kan ik mij aanmelden bij VRT-websites/-apps? Aanmelden met je VRT-profiel is heel eenvoudig. Je doet dit, bij voorkeur, via het aanmeldicoon op een VRT-website of binnen een VRT-app: klik op de knop “Aanmelden” Alternatief kan je je ook aanmelden via het beheersplatform van het VRT-profiel: klik daar op de knop “Meld je aan”. Daarnaast kan het ook zijn dat je automatisch inlogt op de website, door middel van Single Sign On (= SSO of éénmalig aanmelden).Eenmalig inloggen (Single Sign On)SSO stelt jou als eindgebruiker in staat om eenmalig in te loggen op een digitaal VRT product, en dat met je VRT-profiel. Het voordeel van deze functionaliteit is dat met deze authenticatiegegevens ook automatisch op andere producten van VRT kan worden ingelogd met je VRT-profiel, bij bezoek van dat product. Hiervoor dien je dan niet opnieuw de knop ‘Aanmelden’ te gebruiken. Het aanmelden gebeurt automatisch. Voordeel van deze manier van inloggen is dat VRT zijn producten beter op jou kan afstemmen, door bijvoorbeeld direct het correcte regionaal nieuws aan te bieden, je de video of audio fragmenten te tonen die je nog kan afkijken of luisteren, of die fragmenten aanbieden die aansluiten bij jouw interesses, maar die je ook kunnen verheugen met verrassende content. Kan ik mijn sociale media-account (Facebook, Google, Apple ID) koppelen aan mijn VRT-profiel?Ja, dat kan zeker. Voorwaarde is wel dat het e-mailadres van je sociale media-account hetzelfde is als het e-mailadres waarmee je eerder een VRT-profiel aanmaakte. Enkel op die manier zijn we zeker zijn dat het over dezelfde persoon gaat en kunnen we de koppeling succesvol uitvoeren. Hoe gaat het precies in zijn werk? Er zijn 2 mogelijkheden: 1. Je hebt eerder een VRT-profiel aangemaakt met je e-mailadres. Je meldt je daarna aan via een sociale media-account. Als het e-mailadres van je sociale media-account hetzelfde is als dat van je VRT-profiel, dan verschijnt het scherm “Je bent een oude bekende”: Vul het e-mailadres en het wachtwoord van je VRT-profiel in om de koppeling tot stand te brengen. Ben je het wachtwoord van je VRT-profiel vergeten? Klik dan op de link “Wachtwoord vergeten”. 2. Je hebt je eerst aangemeld bij het VRT-profiel met je sociale media-account, daarna pas wil je er een e-mailadres aan koppelen (om er ook mee te kunnen aanmelden). In dit geval heb je nog niet eerder een specifiek wachtwoord moeten kiezen voor je VRT-profiel. Klik op de link “Wachtwoord vergeten”: je kan dan een wachtwoord instellen en het e-mailadres wordt gekoppeld aan je sociale media-account. Belangrijk om te weten: Heb je al een VRT-profiel aangemaakt met je e-mailadres dan kan je meerdere sociale media-accounts aan dat profiel koppelen, op voorwaarde dat het e-mailadres hetzelfde is voor al deze accounts. Je kan sociale media-accounts niet onderling koppelen zolang je je niet hebt aangemeld met je e-mailadres bij het VRT-profiel. Moet ik telkens opnieuw aanmelden als ik meerdere VRT-websites/-apps gebruik?Nee, dat hoeft niet meer. De nieuwste versie van het VRT-profiel ondersteunt “SSO” (= “Single Sign on” of “Eénmalig aanmelden”). Op alle websites van VRT die het nieuwe VRT-profiel ondersteunen en aanbieden blijf je automatisch aangemeld. Zolang dat op hetzelfde toestel gebeurt en in dezelfde internetbrowser. Zodra je van browser/toestel verandert, of je schakelt over van een VRT-website naar een VRT-app (of omgekeerd), dan moet je opnieuw eenmalig aanmelden. Je toestemmingen en voorkeuren hoef je niet telkens opnieuw door te geven: ze worden centraal bewaard en elke VRT-website/app herkent ze automatisch bij het aanmelden. Wordt mijn (profiel)foto getoond als ik aangemeld ben? Je (profiel)foto van je sociale media-account wordt niet getoond binnen je VRT-profiel. Ik lees dat SSO (“Single Sign On” / “Eénmalige aanmelding”) gebruikt wordt. Waarom moet ik dan soms toch opnieuw aanmelden?Als je je aanmeldt bij een VRT-website en je komt op een later tijdstip terug naar deze, of een andere VRT-website, dan zal je nog steeds aangemeld zijn. Zolang dat op hetzelfde toestel gebeurt en in dezelfde internetbrowser. Zodra je van browser/toestel verandert, of je schakelt over van een VRT-website naar een VRT-app (of omgekeerd), dan moet je opnieuw eenmalig aanmelden. Wat als het toch fout loopt? Als je merkt dat je toch ongewild afgemeld wordt dan, kan dat volgende oorzaken hebben: Om automatisch aangemeld te kunnen blijven, moet je het plaatsen van cookies in je browser toestaan. Als je de website die je eerder bezocht voor de eerste keer (her)opent in een privé-venster (of incognitovenster) dan zal je browser de cookies niet gebruiken die er eerder werden opgeslagen. Er zullen nieuwe cookies geplaatst en gebruikt worden. Bij het sluiten van dit privévensters zullen deze nieuw geplaatste cookies opnieuw verwijderd worden. Verder is het ook zo dat bij het navigeren in incognito modus of in een privé venster bepaalde functionaliteiten zoals Single Sign On (SSO) niet werken, om dat de browser dan extra privacy regels toepast zoals het blokkeren van cookies van derde partijen. Om deze alsnog vlot te kunnen laten werken zou je het plaatsen van deze derde partijen cookies moeten toelaten. Dat kan in het instellingen menu van de browser bij de 'Beveiliging en privacy' opties. Waar kan ik terecht als ik problemen heb met het aanmelden?Heb je alle antwoorden gelezen op deze pagina en ondervind je nog steeds problemen met het aanmelden? Meld je probleem dan aan de VRT-klantendienst. Beschrijf zo duidelijk mogelijk wat er aan de hand is, dan kunnen we je snel en efficiënt verder helpen. VRT-profiel: veelgestelde vragenVoor het gebruik van VRT MAX en een aantal toepassingen op onze websites moet je een VRT-profiel aanmaken. De belangrijkste gebruiksvoorwaarden en vragen kan je hier vinden.Lees meerAndere vragenHeb je toch nog een andere vraag?De VRT-klantendienst staat altijd tot je dienst!VRT-cookiesverklaringWij vinden het belangrijk dat je altijd en overal onze VRT-content kan bekijken, beluisteren, lezen of beleven. We verlenen je ook graag interactieve diensten op jouw maat. Daarom schuilen er enkele technieken achter onze onlinediensten, zoals cookies en scripts. Die technieken noemen we hierna voor het gemak cookies. In deze cookiesverklaring willen we je duidelijk en eenvoudig uitleggen welke cookies wij of onze partners gebruiken en waarom wij of onze partners dat doen. We vertellen je ook hoe jij die cookies kan controleren.WedstrijdreglementDit wedstrijdreglement bepaalt de algemene regels met betrekking tot de deelnemingsvoorwaarden voor alle wedstrijden die VRT organiseert via haar websites, andere onlinekanalen (zoals YouTube, Facebook, Twitter) of op een andere wijze.Mijn PrivacyBij VRT sta jij centraal. Om je beter te leren kennen en een nog betere service te kunnen bieden, zullen we af en toe persoonlijke gegevens van jou vragen en verzamelen. Maar we gaan daar heel zorgvuldig mee om en waken altijd over jouw privacy. We vertellen je graag hoe we die informatie verzamelen en waarom we dat doen. Je mag er zeker van zijn: alles gebeurt transparant, vlot en veilig. GebruiksvoorwaardenHieronder vind je de algemene gebruiksvoorwaarden voor de VRT-onlinediensten.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
