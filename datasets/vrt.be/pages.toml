["https://vrt.be/nl/ons-aanbod/vrt-max-in-het-buitenland"]
title = "VRT MAX in het buitenland | VRT"
description = "Als Belg in het buitenland VRT MAX gebruiken? Dat kan zeker!"
full_description = "Home/Ons aanbod/VRT in het buitenlandVRT MAX in het buitenlandAls Belg in het buitenland VRT MAX gebruiken? Dat kan zeker!Audio: podcasts en radioOm naar podcasts en livestreams van de radiozenders te luisteren, heb je geen Belgische woonplaats of nationaliteit nodig.Luister mee naar de beste podcastsStoute schoenenAls de muren konden pratenTouchéHet uur van de waarheidNieuwe FeitenOnder ons: crimi22 Minuten Stomme VragenHet kwartierNachtwacht LuisterverhalenRoyalteaMoet je nu horen opVRT MAXVideo: films, series, docu's, livestream...Bevestig je Belgische woonplaats of nationaliteitOm video's te kijken, bevestig je je Belgische woonplaats of nationaliteit. Dit doe je simpelweg door de stappen te volgen.Bevestig hier je Belgische woonplaats of nationaliteitVideo Scenario 1: je hebt een Belgische woonplaats en bevindt je binnen de Europese UnieGelukzak, je kan kijken naar onze livestream en het volledige aanbod van VRT MAX.Mogelijk zijn door bepaalde strenge rechten toch enkele programma's enkel in België te bekijken, maar dat is de uitzondering.Scenario 2: je hebt een Belgische woonplaats en bevindt je buiten de Europese UnieBuiten de Europese Unie kan je kijken naar een aanbod van eigen programma's.Aangekochte programma's, bv. buitenlandse films of docu's, kan je niet bekijken.De livestream van VRT 1, VRT CANVAS en Ketnet is buiten de Europese Unie niet beschikbaar.Deze programma's kan je buiten de EU bekijkenScenario 3: je bent Belg, maar je hebt geen Belgische woonplaatsZonder Belgische woonplaats kan je zowel binnen als buiten de Europese Unie enkel naar een aanbod van eigen programma's kijken, dus geen aangekochte programma's.De livestream van VRT 1, VRT CANVAS en Ketnet is niet beschikbaar.Deze programma's kan je zonder Belgische woonplaats bekijkenScenario 4: je hebt geen Belgische woonplaats of nationaliteitProgramma's bekijken is in het buitenland helaas niet mogelijk als je geen Belgische nationaliteit of woonplaats hebt.Stemmen, meedoen aan wedstrijden, ...Stemmen voor hitlijsten of meedoen aan wedstrijden met een VRT-Profiel kan in het buitenland.Doe mee opLuisteren in de wagenDe apps van VRT MAX en VRT NWS zijn beschikbaar voor Apple CarPlay en Android Auto. Zo luister je onderweg, nog handiger én veiliger, naar alle VRT-radioprogramma's, -podcasts en digitale streams.De car apps zijn ook de ideale reisgezel om in de wagen naar de VRT-radiozenders te blijven luisteren als je de grens over rijdt (gratis roaming binnen de EU).Reizigers zonder compatibele wagen hoeven niets te vrezen. Want naast Radio 1, Radio2, Studio Brussel, MNM en Klara op FM is er ook nog steeds het ruime aanbod van de VRT-merken op DAB+ (inclusief Klara Continuo, MNM Hits, Radio2 Bene Bene en De Tijdloze).Aanbod in Wallonië, Nederland en de grensstrekenIn Wallonië, Nederland en andere grensgebieden met Vlaanderen kan je het VRT-aanbod op meerdere platformen bekijken en beluisteren.VRT-aanbod in Wallonië, Nederland en de grensstrekenIn Wallonië, Nederland en de grensgebieden met Vlaanderen kan je de VRT-radionetten beluisteren:Via internet of satellietDicht bij de grens van Vlaanderen kan je naar de VRT-radionetten luisteren via FM en DAB+.Sommige (kabel)distributeurs in Wallonië en Nederland bieden ook de VRT-radionetten aan.VRT-Televisie kijken in Wallonië en NederlandWie in Wallonië naar de VRT-televisiezenders wil kijken kan dat via:enkele kabelmaatschappijensatelliet met aangepaste installatievia het VRT-aanbod en de videozones van de websitesde apps van de nettenVia VRT MAXWie in Nederland naar de VRT-televisiezenders wil kijken kan dat via:de kabel (de Nederlandse distributeurs)DVB-T (distributeur: KPN-Digitenne)satelliet (distributeurs: Canal Digitaal)kabeldistribiteur Ziggo biedt een beperkt aanbod-op-aanvraag aan via Eén gemist, Canvas gemist en Ketnet gemist.Enkele distributeurs zoals Online NL en Canal Digitaal bieden het VRT-aanbod ook aan in hun TV-apps.via het VRT-internetaanbod: sommige klank- en beeldfragmenten kunnen niet bekeken worden wegens beperkte uitzendrechtenVia VRT MAX voor zover u een Belgische domicilie heeft en op basis daarvan een VRT-profiel aanmaakt.Via de betalende streamingsdienst NLZIETVia satelliet in Europa (betalend aanbod)Belgen in Europa die via satelliet willen kijken en luisteren, kunnen voor het volledige VRT radio- en tv-aanbod terecht bij TV Vlaanderen.Via het internet naar het andere VRT-aanbodDe VRT NWS- website en app, maar ook de VRT radio-apps blijven wereldwijd toegankelijk voor nieuws en duiding.Geoblocking: teksten zijn overal te lezen, sommige klank- en beeldfragmenten waaronder bijna alle sportprogramma’s kunnen niet opgevraagd worden wegens beperkte uitzendrechten. VRT bezit alleen de rechten voor het Belgische grondgebied.VRT-radio beluisteren via het internetOp 1 juli 2021 stopte de doorgifte van het VRT Radio 1 en Radio 2-signaal via satelliet. Vlamingen in het buitenland kunnen het VRT-aanbod beluisteren via de VRT radio-apps voor Android en iOS. Elk VRT-radionet heeft een eigen app. In de apps zijn ook steeds de digitale extensies (non-stop muziekprogramma's die enkel digitaal te beluisteren zijn) beluisterbaar.Via VRT MAX, Radioplayer.be of andere internetradiospelers kan je ook via computer, tablet of smartphone naar de radio luisteren. Onze radiostreams zijn ook te beluisteren via andere platformen dan die van VRT. Een aantal apps en streamingdiensten zoals bv TuneIn bieden onze radiozenders aan via het internet of via uw digitale audio-installatie (zoals bv. Sonos-toestellen).Veelgestelde vragenLuister in de auto naar VRT MAXWil je snel de achterbank entertainen voor ruzie #532 losbarst? Of na een vermoeiende dag meteen tot rust komen met een ontspannende podcast? Snel en vooral veilig VRT MAX opstarten is van groot belang in de auto. Het verkeer is al stresserend genoeg.Dus luister ook VRT MAX via Apple CarPlay en Android Auto.Wat heb je nodig?Een autoLiefde voor podcasts en radioJouw mobiel toestel waar de VRT MAX-app op staatiOSWerkt vanaf iOS 13Zet Siri zeker aanControleer of je auto compatibel is met CarPlayAndroidWerkt vanaf Android 8Controleer of je auto compatibel is met AndroidHoe werkt dat allemaal?Zonder kabelHeb je een fancy nieuwe auto, dan kan je draadloos verbinding maken tussen je mobiel toestel en je auto.Voor Apple CarPlay moet jouw auto drie dingen ondersteunen: Apple Carplay, Bluetooth én WiFi.Android Auto heeft een kleinere verlanglijst. Dan heeft jouw auto enkel ondersteuning nodig voor Android Auto en WiFi.Met kabelOndersteunt jouw auto geen draadloze verbinding? Geen probleem, ook met een kabel kan je Apple CarPlay of Android Auto gebruiken.Maak verbinding tussen je mobiel toestel en je auto via een kabeltje (= USB-kabel waar je ook je mobiel toestel mee oplaadt).Steek je kabel in de USB-aansluiting van je auto.Zet de autoradio aan, open VRT MAX en geniet van ons audio-aanbod.Wat kan je beluisteren?Podcasts die je al aan het beluisteren was, in de auto of op mobiel. Luister zonder onderbreking verder.Podcasts die je in 'Mijn lijst' zet.Gouden tip: je kan ze op voorhand al in je lijst zetten, zo ben je de best voorbereide chauffeur ooit.De meest populaire podcasts van het momentAlle radiostreams, 24 in totaalHet meest recente nieuws en verkeerKan je met je VRT-profiel naar VRT MAX kijken in het buitenland?Om VRT MAX in het buitenland te gebruiken, maak je een VRT-profiel aan. Luisteren naar podcasts en radio kan overal met een stabiele internetverbinding. Voor het bekijken van programma’s moet je in België wonen of de Belgische nationaliteit hebben. Dat kun je bevestigen door je woonplaats of nationaliteit te verifiëren. Volg deze stappen:Klik op het profielicoontje en daarna op ‘mijn gegevens'.Onder het tabblad ‘persoonsgegevens’, klik je op ‘bevestigen’ naast ‘nationaliteit’.Bevestig je nationaliteit via één van de opties.Heb je hulp nodig? Klik op ‘hulp nodig bij het aanmelden?’Belangrijk om te weten:Na het verifiëren van je woonplaats of nationaliteit kan het tot 2 uur duren voordat je extra programma's op andere apparaten (zoals TV of smartphone) kunt bekijken. Om dit te versnellen, kun je je op het betreffende apparaat af- en weer aanmelden.De meeste programma’s zijn beschikbaar (live of uitgesteld) vanuit het buitenland zodra je bent aangemeld, maar sommige series en films zijn alleen beschikbaar in België. Meer informatie en tips: VRT MAX in het buitenlandWaarom wordt mijn gsm-nummer gevraagd als ik buiten België het aanbod van VRT MAX of Sporza wil bekijken?VRT heeft helaas niet de rechten om alles overal te laten zien. Toch kan je als inwoner van België in de hele EU, Liechtenstein, Ijsland en Noorwegen met je VRT-profiel het hele aanbod van VRT MAX en Sporza bekijken. We moeten daarvoor wel controleren of je officieel in België woont, want voor sommige programma’s hebben wij enkel de rechten voor België. Die controle doen we door te checken of je een Belgisch gsm-nummer hebt. Dit is kort en simpel. Je geeft je gsm-nummer in en ontvangt van ons een sms met een verificatiecode. Op je scherm wordt dan gevraagd om die code in te geven. Heb je dat gedaan, dan is je geverifieerd gsm-nummer aan je VRT-profiel gekoppeld. Zo eenvoudig is het om te genieten van ons hele aanbod in de hele EU. Ter info: Je kan deze verificatie ook via je Burgerprofiel doen. Zie daarvoor puntje 11: Waarom moet ik mijn nationaliteit bevestigen via ‘Mijn Burgerprofiel’ als ik buiten België VRT MAX of Sporza wil bekijken? Let op: Als je je gsm-nummer uit je VRT-profiel verwijdert, dan zal je de sms-verificatie opnieuw moeten doorlopen als je bepaalde programma’s wil bekijken buiten België. Verander je van nummer? Pas het dan zeker aan via het beheersplatform van het VRT-profiel. Samengevat: Wil je binnen de hele EU (+Liechtenstein, Ijsland en Noorwegen) genieten van het hele aanbod van VRT MAX en Sporza? Koppel dan je Belgisch gsm-nummer aan je VRT-profiel. Goed om te weten: Wil je je Belgisch gsm-nummer liever niet koppelen aan je VRT-profiel? Geen probleem! Misschien is de verificatie via het Burgerprofiel iets meer voor jou. Maar onthou dat voor een deel van ons aanbod een verificatie echt nodig is buiten België. Meer info nodig? Op deze pagina’s vind je uitgebreidere informatie: Welk aanbod van VRT MAX kan ik in het buitenland bekijken? Hoe kan je de VRT in het buitenland volgen? Waarom moet ik mijn nationaliteit bevestigen via ‘Mijn Burgerprofiel’ als ik buiten België VRT MAX of Sporza wil bekijken?Je hebt de Belgische nationaliteit en woont in het buitenland Als je als Belg in het buitenland woont, kan je ook genieten van een deel van ons aanbod op VRT MAX en Sporza. Om jou zoveel mogelijk te kunnen laten genieten, hebben we eenmalig een verificatie van je Belgische nationaliteit nodig. Dit kan je eenvoudig doen door je aan te melden op ‘Mijn Burgerprofiel’ via de Vlaamse Overheid. Je hebt een Belgisch adres en kijkt in de EU Als inwoner van België kan je in heel de EU (+Liechtenstein, Ijsland en Noorwegen) met je VRT-profiel het hele aanbod van VRT MAX en Sporza bekijken. Om je woonplaats in België te bevestigen kan je gebruik maken van ‘Mijn Burgerprofiel’ van de Vlaamse Overheid. Wat doen wij met deze gegevens? We nemen geen persoonsgegevens over vanuit je Burgerprofiel. We controleren enkel bij de Vlaamse Overheid of je de Belgische nationaliteit bezit. Deze bevestiging houden we bij in je VRT-profiel. Je kan je burgerprofiel maar aan één VRT-profiel koppelen. Alle vragen omtrent de werking van ‘Mijn Burgerprofiel’ kunnen gevonden worden op de website van de Vlaamse Overheid omtrent ‘Mijn Burgerprofiel’. Als het aanmelden op het Burgerprofiel niet lukt, raad VRT je aan contact op te nemen met de helpdesk van de Vlaamse Overheid. Dat kan via de website van ‘Mijn Burgerprofiel’. Als je andere problemen ondervindt, kan je steeds contact opnemen met de klantendienst van VRT. Kan ik in het buitenland programma's bekijken in de Ketnet-app?Je kan niet alle programma’s bekijken in het buitenland. Ketnet heeft niet altijd de rechten van de programma’s om die allemaal over de landsgrenzen heen aan te bieden.Alle programma's van Ketnet en Ketnet Junior plaatsen we ook VRT MAX. U kan zich ook op dat platform aanmelden om een greep uit ons kind- en junioraanbod te bekijken. Voor een overzicht van de programma's die u in het buitenland kunt bekijken, raapleegt u deze webpagina.Wat met BVN?De naam BVN blijft bestaan en verwijst sinds 1 juli 2021 naar het ‘Beste Van NPO’. De zender blijft in een belangrijk deel van de wereld via de satelliet beschikbaar en wereldwijd via www.bvn.tv en via de BVN-app. Voor meer informatie ga naar de pagina van BVN.tv.Heb je nog andere vragen over VRT MAX en vond je niet wat je zocht op deze pagina?Ik heb een andere vraagOns aanbodVRT MAXKijk én luister gratis naar het strafste aanbod van VRT. Van primetime tv-programma's, tot podcasts en live radiostreams. Ontdek het allemaal op VRT MAX, het online streamingplatform van VRT! Meer over VRT MAXBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
