full_description = "Home/Ons aanbod/ToegankelijkheidToegankelijkheidVRT wil zo toegankelijk mogelijk zijn voor alle Vlamingen en onderneemt daarom stappen in overleg met de betrokken belangenorganisaties.Een vijfde van de Vlamingen heeft nood aan toegankelijkheidsdiensten om ons aanbod volwaardig te beleven.Bovendien gebruiken we met z’n allen de media steeds meer ergens onderweg. Of samen in één ruimte op verschillende schermen tegelijk.VRT biedt ook content aangepast aan specifieke noden zoals Vlaamse Gebarentaal en audiodescriptie.VRT heeft een team van vertalers, ondertitelaars, tolken, schrijvers en taalexperten die ervoor zorgen dat ons aanbod voor iedereen, overal en altijd in de beste omstandigheden voorhanden is.VRT MAX zet in op toegankelijke content voor iedereenDankzij audiodescriptie kan iedereen, ook mensen die niet alles kunnen zien wat er zich op het scherm afspeelt, genieten van onze sterke fictiereeksen.Geniet nu van audiodescriptie opVRT MAXToegankelijkheidsdienstenToegankelijke eventsVRT streeft ernaar om haar (publieks)evenementen zo toegankelijk mogelijk te maken voor iedereen.AudiodescriptieVRT wil iedereen laten genieten van sterke fictie op televisie, ook mensen die niet alles kunnen zien wat er zich op het beeldscherm afspeelt.OndertitelingVRT wil haar aanbod via ondertiteling zo toegankelijk mogelijk maken voor zowel horende als slechthorende kijkers.Gesproken ondertitelingMet gesproken ondertiteling worden de ondertitels bij de televisieprogramma's omgezet naar een computerstem die de tekst voorleest.Websites en appsVRT zet zich elke dag in om haar websites en apps zo toegankelijk mogelijk te maken voor een zo breed mogelijk publiek.Fysieke toegankelijkheid VRT-gebouwHeb je een handicap en wil je graag VRT bezoeken, een opname bijwonen of deelnemen aan één van onze events? Kijk dan op deze pagina wat je kan doen om je bezoek voor te bereiden.Taal en ToegankelijkheidTaal voor iedereen begrijpelijk.ProgrammabewerkingDankzij Programmabewerking kan elke kijker genieten van een rijk en gevarieerd aangekocht televisieaanbod. VRT met Vlaamse gebarentaalVRT maakt dagelijks het VRT NWS journaal en Karrewiet toegankelijk met Vlaamse Gebarentaal (VGT). Wekelijks voorzien we ook op zondag een uitgebreid overzicht van de sportactualiteit van de voorbije week met VGT. VideoKorte uitlegvideo respeakingVideoHoe wordt Het journaal met VGT gemaakt?VRT werkt nauw samen met Het Vlaams Gebarentaal Centrum en Inter.Meer weten? Lees ook deze artikelsDiversiteit & inclusieVRT maakt finale van Eurosong 2025 toegankelijk voor doven en slechthorenden Taal | Diversiteit & inclusieHet ABC van VRT met de T van ... Taal: Standaardnederlands is de beste taal om écht iedereen te bereiken Diversiteit & inclusieVRT zet nieuwe stappen voor inclusie van doven en slechthorendenDiversiteit & inclusie | MuziekNiks te zien, maar van alles te belevenDiversiteit & inclusieHet ABC van VRT met de A van ... Audiodescriptie:“Een programma met audiodescriptie kan je zien als een echt luisterspel” Diversiteit & inclusieDag van de Vlaamse Gebarentaal op VRT: “Als je een programma kan verstaan in jouw taal, voel je je gelijkwaardiger” Diversiteit & inclusie | Over VRTVRT met VGT: word lid van onze community op WhatsAppDiversiteit & inclusie | Zingeving & solidariteit | InnovatieLive-ondertiteling met AI maakt De Warmste Week toegankelijkerVeelgestelde vragen over toegankelijkheidIk ervaar een probleem met de toegankelijkheid van een website of app van VRT. Waar kan ik terecht?Als je een probleem ervaart met de toegankelijkheid van onze digitale platformen, neem dan contact op met onze klantendienst.Zeker vermelden:over welke website of app het gaat,welk probleem je ervaarten of je een (technisch) hulpmiddel gebruikt (type hulpmiddel, op welk toestel...)Hoe meer concrete informatie we van jou ontvangen, hoe sneller we het probleem kunnen oplossen. Voor jou en andere gebruikers.Ik heb een vraag over ondertitelingAnderstalige fragmenten worden via open ondertiteling vertaald. Daar hoeft u niets voor te doen. De titels verschijnen op het gewone beeld. De ondertiteling van de Nederlandstalige programma's wordt in principe aangeboden via teletekstondertiteling.Open versus gesloten ondertitelingBij de VRT kunnen televisiekijkers zelf kiezen of ze Nederlandstalige programma’s met ondertiteling bekijken of niet. Nederlands gesproken programma’s die goed verstaanbaar zijn worden immers via teletekstpagina 888 ondertiteld in plaats van via open ondertiteling.Dat betekent niet dat er helemaal geen open ondertitels meer te zien zijn bij Nederlands gesproken programma’s. Als een scène voor de meeste kijkers moeilijk te verstaan is bijvoorbeeld omdat de spreker mompelt wordt ze wel open ondertiteld. Ook wanneer een fragment of programma voor de meeste kijkers niet begrijpelijk is bijvoorbeeld omdat een spreker onversneden dialect spreekt of omdat zijn/haar stem vervormd wordt bij een anonieme getuigenis wordt er open ondertiteld.Uitzendvertraging live programma'sDoor de invoering van uitzendvertraging bij liveprogramma's is ook daar ondertiteling mogelijk. Anderstalige gasten worden zo ondertiteld. Heeft u nog een andere vraag? Contacteer de klantendienst.Hoe komt het dat ondertitels soms te laat op het beeld verschijnen?De meeste tv-programma’s worden vooraf opgenomen. Dat geeft de ondertitelaars de tijd en de mogelijkheid om de ondertitels perfect te synchroniseren met wat er gezegd wordt.Sommige programma’s worden evenwel live of semi-live uitgezonden. Semi-live betekent dat er een kleine delay zit tussen de opname en de uitzending, niet meer dan enkele minuten. Dankzij die delay is het mogelijk om de ondertitels synchroon op het beeld te laten meelopen.Als een (deel van een) programma echt helemaal live wordt uitgezonden, dan moeten ook de ondertitelaars eerst luisteren wat er gezegd wordt voor ze de ondertitels kunnen maken. Dat gebeurt heel snel, met behulp van spraakherkenningssoftware, maar het duurt toch al gauw een tiental seconden voor de ondertitels te zien zijn op het scherm. Een voorbeeld hiervan zijn sportuitzendingen.Hoe krijg ik de ondertitels op mijn tv-scherm of smartphone? Alle providers bieden ondertitels aan. Alleen de manier waarop ze die toegankelijk maken verschilt. Op de tv schakel je de ondertiteling in via de afstandsbediening van Telenet of Proximus. Telenet: Instellingen van de Telenet tv-box Proximus: Ondertitels op je tv-scherm aanzetten Online kun je ook op de videospeler van VRT MAX de ondertiteling inschakelen. Afhankelijk van het soort toestel waarmee je kijkt, kan dat op de volgende manieren: VRT MAX-website op je laptop: Klik op de video en kies voor het CC-symbool rechts onderaan. Druk daarop en de ondertitels verschijnen op je scherm. VRT MAX-app op je smartphone/tablet: Klik op de video en kies voor het CC-symbool rechts onderaan. Druk daarop en de ondertitels verschijnen op je scherm. VRT MAX-app op je smart-tv: Selecteer met de afstandsbediening het CC-symbool links onderaan naast de play-knop. Druk daarop en de ondertitels verschijnen op je scherm. Hoe komt het dat soms letters of hele ondertitels ontbreken?De ondertiteling kan er alleen foutloos uitzien als alle tussenschakels technisch perfect in orde zijn. De VRT kan uiteraard alleen de kwaliteit van het uitgezonden signaal garanderen en dat wordt continu gecontroleerd. Zelf kan u ook een aantal dingen controleren: bijvoorbeeld de internetkwaliteit of kabelaansluiting.Ondertitels zijn soms ook minder volledig als ze live gemaakt worden. In dat geval kan het ook zijn dat de ondertitels niet synchroon lopen met het beeld. In uitzonderlijke gevallen gebeurt het dat er tijdens de live-ondertiteling technische problemen opduiken, waardoor er even geen ondertiteling is. De VRT doet er dan alles aan om die problemen zo snel mogelijk te verhelpen.Is er op de andere Vlaamse zenders ook ondertiteling?De VRT heeft van de Vlaamse overheid via de beheersovereenkomst een duidelijke opdracht gekregen om ondertiteling te voorzien bij 99% van de uitzendingen op VRT1, VRT CANVAS en Ketnet. Met uitzondering van hosting, trailering, commerciële communicatie en muziekprogramma's. De VRT zorgt ook dat het groeiende aanbod op VRT MAX voor minimaal 90% ondertiteld is. Rekening houdend met dezelfde uitzonderingen.Ook VTM en Play voorzien tegenwoordig voor het merendeel van hun programma's ondertiteling. Voor gedetailleerde informatie hierover verwijzen we u naar de diensten van die zenders.Er bestaat ook uitwisseling van ondertitels, vooral met Nederland. De VRT-ondertiteling wordt ook aangeboden bij dvd-versies van heel wat Nederlandstalige films en series.Kan u ook ondertiteling opvragen bij een VGT-uitzending?Ja, dat kan. Hou er echter wel rekening mee dat ondertiteling en Vlaamse Gebarentaal niet volledig synchroon zullen zijn: een tolk moet eerst “uitluisteren” en kan dan pas beginnen omzetten in Vlaamse Gebarentaal, een taal die bovendien ook een andere grammaticale structuur heeft dan het Nederlands. Deze ondertiteling kan u ook makkelijk uitzetten, zo heeft u zelf de keuze. Hoe zet je ondertiteling aan bij je uitzending? Kan je de teletekstondertitels bij een programma opnemen?Als je een programma opneemt met de digicorder, komen de teletekstondertitels automatisch mee. Dat is ook het geval bij uitgesteld kijken. Wat je opneemt is in dat geval niet het VRT-signaal. De vormgeving (lettertype, grootte, kleur, hoogte...) is daardoor anders dan de gewone VRT-stijl.Waarom zijn niet alle programma’s geschikt om te beschrijven?Soms gaat de montage te snel en is er geen tijd om extra beschrijving toe te voegen (zoals bijvoorbeeld in een nieuwsuitzending) of soms is de beschrijving overbodig omdat een personage alles al zegt.Waarom bedekken de ondertitels soms onderschriften?Af en toe melden kijkers dat de teletekstondertitels in het VRT NWS journaal de naam van de geïnterviewden bedekken. De ondertitelredactie bepaalt niet zelf wanneer en of er onderschriften verschijnen. Dat doet de regie van het journaal. De ondertitelredactie probeert wel zoveel mogelijk te anticiperen door ondertitels hoger te plaatsen als er onderschriften gepland worden. Er wordt wel rekening mee gehouden dat de ondertitels zo weinig mogelijk belangrijke info onderaan in beeld bedekken. Een voorbeeld daarvan zijn balsporten (zoals voetbal). Dan verschijnen de ondertitels standaard bovenaan in beeld.Kijkt u uitgesteld of naar een opname? In dat geval kijkt u naar het ondertitelsignaal van de distributeur, niet dat van de VRT. Daardoor staan de ondertitels standaard onderaan in beeld. Ook onze VRT MAX-player kan ondertitels momenteel nog niet hoger in beeld plaatsen. In de toekomst is het wel de bedoeling om die functionaliteit toe te voegen.Wat is gesproken ondertiteling en hoe kan u het gebruiken ?Gesproken ondertiteling heeft als doel de toegankelijkheid van televisieprogramma's te verhogen voor blinden slechtzienden ouderen dyslectici e. a. Omdat een toegankelijk aanbod bieden voor iedereen een van de grondtaken is van de VRT biedt zij uitzendingen met gesproken ondertiteling aan.Bij gesproken ondertiteling worden de teksten van ondertiteling van anderstalige televisieprogramma's doorgezonden in een aparte informatielaag bij het programma. De technologie zet de bestaande tekstuele ondertitelinformatie om in spraak. Via teletekst wordt die tekstuele info naar de dienstenleverancier of eindgebruiker gestuurd. Dit werkt zowel voor open (vertalende) ondertitels als teletekstondertitels. Alleen bij een aantal programma's van de nieuwsdienst (Terzake Zevende dag Volt Reyers laat …) werkt het niet maar ook hier wordt aan gewerkt. .Elk platform van gesproken ondertiteling kan deze info gebruiken. Er zijn momenteel twee technologische platformen met elk hun voor- en nadelen voor de eindgebruiker:De tekst-spraakomzetting gebeurt in een apparaat bij de eindgebruiker (bv. Komfa)De tekst-spraakomzetting gebeurt in een centrale server van de dienstleverancier en de spraak wordt via internet gestreamd naar de eindgebruiker (bv. Integra/Orion Webbox)Distributeurs zouden dit ook kunnen inbouwen in hun settopbox maar volgens ons is daar nog geen initiatief genomen. Dus moet de eindgebruiker zelf een toestel aanschaffen om de gesproken ondertitels te kunnen ontvangen.Er zijn twee modellen:Komfo-box: meer info op komfa-media.eu. De Belgische verdelers van de Komfo-box zijn: optelec.be en kobavision.beOrion webbox: meef info op orionwebbox.org of bij de Belgische verdeler IntegraWordt er letterlijk getolkt?Vlaamse gebarentaal en het Nederlands zijn twee verschillende talen. Er wordt daarom ook vermeden om letterlijk te tolken en zoveel mogelijk als kan een culturele vertaling te maken. Door de opbouw en het snelle spreektempo van de nieuwsprogramma's moeten onze tolken snel vertalen én alle gespecialiseerde en gedetailleerde uitleg omzetten in VGT.Wordt er letterlijk ondertiteld?Sinds augustus 2006 ondertitelen we journaals letterlijk en integraal. Zo krijg je ook in de ondertitels alle informatie mee en sluiten de titels perfect aan bij wat er gezegd wordt. Dat maakt ondertiteling duidelijker en makkelijker om te volgen.Letterlijke ondertiteling heeft wel als gevolg dat niet alle ondertitels even lang op het scherm blijven. Bij snel sprekende journalisten heb je minder tijd om de ondertitels te lezen dan bij traag sprekende journalisten. Maar omdat correcte en volledige informatie bij journaals belangrijk is voor de doelgroep, blijven we vasthouden aan letterlijke ondertiteling.Bij liveprogramma's of -interventies is integraal en/of letterlijk ondertitelen nagenoeg onmogelijk. Toch doen we er alles aan om zo volledig mogelijk te zijn, onder meer door het gebruik van spraakherkenningssoftware. Daarmee kunnen we heel snel en nauwkeurig ondertitelen, maar helemaal letterlijk zal het nooit zijn.Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
