["https://vrt.be/nl/over-ons/nieuws-over-vrt/het-wordt-geen-stille-nacht-bij-vrt-een-kerstaanbod-om-warm-van-te-worden"]
title = "Het wordt geen 'Stille nacht' bij VRT: een kerstaanbod om warm van te worden | VRT"
description = "Donderdag 7 december 2023 -&nbsp;Het wordt winter en de dagen worden korter, maar bij VRT is er tal van tv-, radio- en online aanbod om je deze kerstvakantie aan te verwarmen."
full_description = "Home/Over ons/Nieuws over VRT/Het wordt geen 'Stille nacht' bij VRT: een kerstaanbod om warm van te wordenHet wordt geen 'Stille nacht' bij VRT: een kerstaanbod om warm van te worden28 december 2023Donderdag 7 december 2023 - Het wordt winter en de dagen worden korter, maar bij VRT is er tal van tv-, radio- en online aanbod om je deze kerstvakantie aan te verwarmen.Van kookinspiratie met het nationale kerstmenu in Dagelijkse kost tot Sven de Leijer die Vrede op aarde brengt. Van het Jaaroverzicht van VRT NWS tot de komische terugblik op 2023 van Kamal Kharmach. VRT zorgt deze kerstvakantie ook voor straffe muziekverhalen in De tijdloze en viert met jou oudjaar samen met Queen en David Bowie. Geen kerstfeest zonder Slingers en kroketten (Radio 1) en de beste kersthits in Radio2 Kerst50. Later is het genieten van het nieuwjaarsconcert van Wiener Philharmoniker op Klara. Natuurlijk worden de blokkende studenten niet vergeten met onder andere MNM blok party. En voor de allerkleinsten staan Ketnet en Ketnet Junior op post. All I want for Christmas? Is VRT! VRT 1 Switch Zowel presentatrice Fien Germijns als haar Switch-studio blinken als nooit tevoren voor de quiz zonder punten, maar wel mét bekende Vlamingen. Drie weken lang nemen elke week vijf bekende koppen het tegen elkaar op. Wie op het einde van de aflevering op nummer één staat, speelt de finale en kan 1.000 euro winnen voor het goede doel. Tijdens De Warmste Week nemen Gloria Monserez, Manu Vanacker, Sven De Leijer, Maïmouna Badjie en Hakim Chatar het tegen elkaar op. Tijdens de eerste week van de kerstvakantie is het de beurt aan Joris Brys, Otto-Jan Ham, Niels Destadsbader, Nona 't Jolle en Eva Kamanda, zij spelen voor een zelfgekozen goed doel. Net als Eva De Roo, Elodie Gabias, Lou Miller, Tine Embrechts en Bart Cannaerts in de laatste week van de kerstvakantie. Switch: elke weekdag vanaf maandag 18 december rond 19.45 uur op VRT 1 en VRT MAX. Dagelijkse kost - het nationale kerstmenu Jeroen Meus houdt zijn jaarlijkse traditie in ere. Vanaf maandag 18 december tot en met vrijdag 22 december geeft hij het beste van zichzelf voor het veertiende nationale kerstmenu van Dagelijkse kost. Van hapje tot dessert bokst hij een geweldig lekker feestmenu in elkaar, met elke dag een uitdagend maar haalbaar kerstrecept. Benieuwd wat er in de feestelijk uitgedoste keuken van Dagelijkse kost uit de potten getoverd zal worden? Wij geven je alvast een voorsmaakje: Maandag 18 december: Krabsla met avocado-komkommercoulis, gegratineerde mosselen met pastis en filodeegpakketjes met geitenkaas en vijgen. Jeroen start het Nationale Kerstmenu 2023 met drie eenvoudige maar feestelijke hapjes: krabsla, gegratineerde mosselen en filodeegpakketjes met geitenkaas. De start hebben we alvast niet gemist! Dinsdag 19 december: Carpaccio van gerookte heilbot met tartaar van knolselder en appel. Het voorgerecht is dit jaar een carpaccio van gerookte heilbot met een frisse tartaar van knolselder en appel. Om het geheel wat volheid te geven, serveert Jeroen er een vinaigrette op basis van gebrande boter bij. De kappertjes zorgen voor extra punch. Woensdag 20 december: Romige soep van zoete aardappel, dumplings van scampi en limoenbladolie. Als tussengerecht serveert Jeroen een zijdezachte soep van zoete aardappel en kokos met dumplings en een frisse limoenolie. De deegkussentjes zijn gevuld met tartaar van scampi. Er kruipt een beetje werk in, maar het is zo leuk om te maken! En het resultaat mag er ook wezen. Donderdag 21 december: Hertengebraad Grand Veneur met verse kroketten en witloof. Jeroen gaat voor zijn Nationale Kerstmenu aan de slag met een Franse oerklassieker: hertengebraad 'Grand Veneur'. De term slaat op de wildsaus op basis van rode wijn, rode bessengelei en cognac. Maak er verse kroketten en veel groentegarnituur bij, en je feestmaal is een feit! Vrijdag 22 december: Red Velvet swiss roll met Noorderkrieken, witte chocolade en slagroom. Het toetje is de kers op de taart van het Nationale Kerstmenu. Ziet deze rolcake er niet fantastisch uit? Het is ook nog eens verrassend simpel. De rolbiscuit is gevuld met mascarponeroom en een lichte pudding met Noorderkrieken. Gewoon maken en scoren! Veel tijd om te bekomen van dat royale kerstdiner krijgt Jeroen niet. Ook de rest van de kerstvakantie staat volledig in het teken van lekker eten in goed gezelschap. Twee weken lang brengt hij degelijke, winterse kost die warmte brengt op de koudste dagen van het jaar. Dagelijkse kost, het nationale kerstmenu: vanaf maandag 18 december een hele week lang om 18.15 uur op VRT 1. Vrede op aarde Geen kerstvakantie zonder het warme dekentje van Vrede op aarde. Vanaf zondag 24 december ontvangt Sven de Leijer opnieuw tal van bekende gasten in zijn gezellige studio. Sven blikt samen met die gasten op zijn onnavolgbare manier terug op het voorbije jaar. Wat was het beste, meest bizarre, grappigste of ontroerendste van 2023? Onder andere Matteo Simoni, Kristel Verbeke, Koen Wauters, Linde Merckpoel, Aaron Blommaert, Jacotte Brokken, Wim De Vilder, Pommelien Thijs, Thibaut Courtois, Natalia, Luca Brecel en Gloria Monserez komen langs. Geen Vrede op aarde zonder de prestigieuze Vrede op aarde-awards in de chalet in de Ardennen. En dus ook niet zonder de vakkundige jury. Sven en gastvrouw Soe Nsuki ontvangen in de chalet Fien Germijns, Tom Waes, Kathleen Cools, Nathalie Meskens, Sepideh Sedaghatnia, Amir Bachrouri, Dominique Persoone en Martin Heylen, onder leiding van juryvoorzitter Jan Peumans. Welke personen, gebeurtenissen en thema’s van 2023 verdienen een speciale award? Onder andere voor Feest van het jaar, Sportpersoonlijkheid van het jaar, Nederlandstalige hit van het jaar, Wetstraatrel van het jaar, Comeback van het jaar en Royaltynieuws van het jaar deelt de vakkundige jury een prijs uit. Naast dat debatteren, en uiteraard ook wat feestvieren en lekker eten, duikt de jury ook op in chaletversies van programma’s als Interview met de geschiedenis, De Verhulstjes, Het Hoge Noorden, Los het op, De wekker van StuBru en Het swingpaleis. Wat dat precies wordt, ontdekt de kijker in Vrede op aarde tijdens de kerstvakantie op VRT 1. Chalet challenges op VRT MAX Op VRT MAX krijgen de kijkers dan weer een heerlijke extra portie van de jury in de Chalet challenges. Alle juryleden krijgen in de chalet een bijzondere uitdaging van Soe en moeten die tussen het debatteren en degusteren door ongemerkt tot een goed einde brengen. Als dat lukt, krijgen ze een gepersonaliseerde Vrede op aarde-award. Wie van hen slaagt in hun opzet en mag naar huis met een trofee? Op oudejaarsavond zorgt Vrede op aarde voor een feestelijk aftelmoment net voor middernacht. In de studio luidt Pommelien Thijs het nieuwe jaar muzikaal in, en komen ook Bockie De Repper en Riadh Bahri langs bij Sven. Vrede op aarde: vanaf zondag 24 december elke avond op VRT 1 en VRT MAX (het uitzenduur is afhankelijk van de datum); Chalet challenges: vanaf woensdagavond 27 december volledig te bekijken op VRT MAX. Eindejaarsconference Kamal Kharmach: Mag ik even? 2023 Met zijn eindejaarsconference Mag ik even? 2023 neemt Kamal Kharmach, ondertussen voor de vijfde keer, het voorbije jaar onder de loep. Kamal laat zijn komisch licht schijnen op de actuele gebeurtenissen. 2023 bleek een tumultueus jaar te zijn, met de nodige perikelen op het politieke toneel. Kamal tovert nieuwjaarsavond om tot een hilarische avond vol actuele grappen en scherpe opmerkingen om terug te blikken op 2023. Mag ik even? 2023: op maandag 1 januari 2024 om 21.30 uur op VRT 1 en VRT MAX. VRT NWS Het jaaroverzicht: 2023, het jaar van water en vuur 2023 was het jaar waarin we onze weerman Frank Deboosere uitzwaaiden. En het jaar waarin we overspoeld werden door slecht nieuws over het weer en over de klimaatverandering. Water en vuur. Het lijkt het nieuwe normaal. Bij ons kwakkelt de zomer, terwijl in Griekenland bossen in vuur en vlam opgaan. Daarna genieten we van een onverwachte Indian Summer, maar een paar weken later staat de Westhoek blank. Natuurrampen kosten het leven aan tienduizenden mensen. Door aardbevingen in Turkije, Syrië en Marokko. Door de overstromingen van storm Daniël in Libië. Ook leiders en hun burgers staan als water en vuur tegenover mekaar. Israeli tegen Palestijnen. Oekraïners tegen Russen. Gelukkig is het vuur ook het symbool van het menselijk vernuft. We gaan weer naar de maan. En artificiële Intelligentie kan ons leven misschien makkelijker maken. En hoe heerlijk was het om vurig te supporteren voor de Belgian Cats op het Europees kampioenschap basketbal. Of voor Gustaph op het Eurovisiesongfestival. 2023, het jaar van water en vuur. Het jaaroverzicht van VRT NWS gepresenteerd door Wim De Vilder: op woensdag 27 december om 20.55 uur op VRT 1 en VRT MAX. VRT CANVAS VRT CANVAS neemt je de laatste dagen van 2023 op roadtrip naar de hoogtepunten van de pop- en rockmuziek en luidt het nieuwe jaar in met vlijmscherpe humor van mediarechter Xander De Rycke. De tijdloze op VRT CANVAS Tussen kerst en nieuwjaar telt VRT CANVAS, samen met Studio Brussel, af naar De tijdloze 100. De talkshow De tijdloze wordt live uitgezonden vanuit muziekcentrum Track te Kortrijk. Drie dagen lang gaat Michèle Cuvelier op zoek naar straffe verhalen, onverwachte verbanden en verrassende details achter tijdloze songs. Ze strikt hiervoor pop-en rockkenner Bent Van Looy, Compact Disk Dummy Lennert Coorevits en tal van bekende en minder bekende muziekliefhebbers. Bent Van Looy leidt ons naar bijzondere bomen doorheen het tijdloze bos en volgt in elke aflevering een mythisch tijdloos spoor in het kleine Vlaanderen. Hoe kwam Tina Turner in een bescheiden Zelzaatse discotheek terecht en welke bekende Vlaming mocht haar daar van nabij bewonderen? Waarom miste een Kempens festival met Pink Floyd op de affiche zijn afspraak met de geschiedenis en welk Belgisch popmonument maakte hun optreden van op de eerste rij mee? En hoe kwamen The Rolling Stones op de schoot van Nonkel Bob en Tante Terry terecht… Lennert Coorevits gaat telkens op zoek naar een rode draad doorheen tijdloze nummers - over genres en decennia heen - en probeert ze met zijn verrassende muzikale inzichten nóg tijdlozer te maken? ​ Brusselse rapgod Zwangere Guy, zangeres Eefje De Visser, Vive La Fête-jubilarissen Danny Mommens en Els Pynoo, Dj-fenomeen Amber Broos, schrijfster Delphine Lecompte, ​ Bazart-zanger Mathieu Terryn en ‘Taylor Swift-professor’ aan de Universiteit van Gent, Elly McCausland zijn alvast van de partij. Bovendien laat een panel vol muzikale toppers zich gewillig onderwerpen aan een spervuur van Tijdloze vragen en dilemma’s: Bart Peeters, Sietse Willems (Meltheads), Helena Mayorga Paredes (Mayorga), Brent Vanneste (Stake), Faisal Chatar, Leonie Gysel (Arsenal) en Noémie Wolfs bekennen kleur. Elke aflevering wordt afgesloten met een quiz. Een goed excuus om de kijker met nog een paar fijne weetjes de avond in te sturen. Dit jaar gaat VRT CANVAS live met De tijdloze op de site van muziekcentrum Track in ​ Kortrijk, aansluitend bij het evenement van radiozender Studio Brussel. Muziekfans die graag een uitzending willen bijwonen van De tijdloze kunnen zich inschrijven via vrtmax.be/doemee. De tijdloze op VRT CANVAS: van woensdag 28 tot en met vrijdag 30 december om 20.30 uur op VRT CANVAS en VRT MAX. De tijdloze nacht Op oudejaarsavond brengt De tijdloze nacht een bloemlezing van de beste rockdocumentaires en concertfilms. Tijdloze boegbeeld Michèle Cuvelier leidt in. Queen: Days of our lives ​ toont het leven en werk van de rockband Queen in de jaren 70, ‘80 en later. De concertfilm Hungarian Rhapsody: Queen live in Budapest covert het optreden van de rockband Queen in het Népstadion in Boedapest op 27 juli 1986. Pink Floyd: The story of Wish you were here is een documentaire uit 2012 over het tot stand komen van het album Wish you were here uit 1975; David Bowie: Ziggy Stardust and the Spiders from Mars is een Britse documentaire en concertfilm uit 1979 door D. A. Pennebaker met de beelden van het laatste Ziggy Stardust- concert in het Hammersmith Odeon in London op 3 juli 1973. In Pearl Jam twenty, de ​ Amerikaanse documentaire van regisseur Cameron Crowe, ​ volgen we de groep Pearl Jam van juni 2010 tot april 2011. De docu schetst de geschiedenis van de band nadat Mother Love Bone in Pearl Jam transformeerde, hun gevecht met Ticketmaster en de tragedie tijdens het Roskilde Festival in 2000. De tijdloze nacht: oudejaarsavond tussen 20.00 en 2.00 uur op VRT CANVAS. Xander houdt het voor bekeken 2023 Belangrijker dan de Kastaars, scherper dan de kaaklijn van Viktor Verhulst en luider dan Fien Germijns. The First Avenger van de mediakritiek komt eindelijk weer uit het ijs om te roepen vanachter zijn bak. Het is een enge wereld geweest zonder Xander De Rycke. Vlaamse films hebben weer succes, de weerman van VRT is met pensioen en Niels Destadsbader is vervangen door iemand die zichzelf Metejoor noemt. Om nog maar te zwijgen van de zender die gekaapt werd door Gert en James, die zangwedstrijd in carnavalskledij en Tom Waes die met ons belastinggeld op een patattenveld klaagt over geschiedenis. Maar geen zorgen, uw beste vriend is terug met de enige eindejaarsconference die ertoe doet. Xander De Rycke houdt het voor bekeken 2023: op vrijdag 5 januari om 21.10 uur op VRT CANVAS en VRT MAX. Ketnet Zin in een onvergetelijke kerstvakantie vol plezier en avontuur? Dan is de gratis doe-expo Ketnet aan zee in Knokke-Heist de ultieme bestemming voor jou en je hele familie. Stap in de wereld van Ketnet en doe mee aan tal van coole Ketnet-activiteiten: presenteer zelf het Karrewiet-journaal, bereid je voor op Het Gala van de Gouden K’s, speel mee met het Kingsize Live-bordspel en nog veel meer. Ontmoet ook jouw favoriete Ketnet-wrapper en dans mee met verschillende muzikale acts. Reserveer vlug je gratis tickets op heldenplein.be. Meer info vind je ook op ketnetvoorouders.be. Ketnet aan zee: van zaterdag 23 december tot en met zondag 7 januari op het Heldenplein in Knokke-Heist. In Plopsaland De Panne kan je van dinsdag 26 tot en met zaterdag 30 december naar Ketnet kerst. Ontmoet er de cast van #LikeMe voor de allerlaatste keer, neem een foto met 3Hz en Nachtwacht en zing en dans mee met De KetnetBand. In Plopsa Indoor Hasselt en Plopsa Station Antwerp vier je kerst met Bumba. Meer info op ketnetvoorouders.be. Ketnet kerst: van dinsdag 26 tot en met zaterdag 30 december in Plopsaland De Panne, Plopsa Indoor Hasselt en Plopsa Station Antwerp. Ga tijdens de kerstvakantie mee op tocht met de Ketnet-wrappers in Jij beslist: wrappertrip op ketnet.be en in de Ketnet-app. Ketnetters kunnen zelf meedoen in dit interactieve verhaal en ook zelf beslissen hoe het afloopt. Ga op pad met Nona, die samen met haar vriend Bert een challenge-race wil doen. Of trek erop uit met Thomas die met Timon en een jeugdvereniging wil survivalen in het bos. Of hou je liever met Héritier en Steffi een sleepover, samen met de Nederlandse YouTube-ster Kit"
