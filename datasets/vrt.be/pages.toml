["https://vrt.be/nl/over-ons/nieuws-over-vrt/klara-stelt-jong-talent-voor-in-vijfde-editie-van-de-twintigers"]
title = "Klara stelt jong talent voor in vijfde editie van De Twintigers | VRT"
description = "Voor het vijfde jaar op rij pakt Klara uit met De Twintigers. Na vier succesvolle edities, staat er opnieuw een frisse lading jonge muzikanten te trappelen om haar talent te tonen. De tien veelbelovende muzikanten zijn tussen de 20 en 29 jaar. Met concerten of opnames lieten ze zich al opmerken, maar echt doorgebroken zijn ze nog niet. Daar wil Klara verandering in brengen door hun carrière een flinke duw in de rug te geven.&nbsp;Wie is de nieuwe generatie die de toekomst van de klassieke muziek, jazz en global in ons land zal kleuren?&nbsp;Elke week staat er andere twintiger in de kijker. De luisteraars leren hen de komende tien weken kennen op Klara en op VRT MAX."
full_description = "Home/Over ons/Nieuws over VRT/Klara stelt jong talent voor in vijfde editie van De TwintigersKlara stelt jong talent voor in vijfde editie van De Twintigers 10 februari 2025Voor het vijfde jaar op rij pakt Klara uit met De Twintigers. Na vier succesvolle edities, staat er opnieuw een frisse lading jonge muzikanten te trappelen om haar talent te tonen. De tien veelbelovende muzikanten zijn tussen de 20 en 29 jaar. Met concerten of opnames lieten ze zich al opmerken, maar echt doorgebroken zijn ze nog niet. Daar wil Klara verandering in brengen door hun carrière een flinke duw in de rug te geven. Wie is de nieuwe generatie die de toekomst van de klassieke muziek, jazz en global in ons land zal kleuren? Elke week staat er andere twintiger in de kijker. De luisteraars leren hen de komende tien weken kennen op Klara en op VRT MAX.Dit zijn De Twintigers van 2025:Eliott Knuets (gitaar, jazz) | BrusselVanaf zijn 6de kreeg Eliott privéles voor zijn lievelingsinstrument, de gitaar. Op z’n 12de al sloeg hij de richting in van de jazzmuziek en volgde hij lessen bij Peter Hertmans en Bert Cools. En op z’n 16de zat hij naast Wynton Marsalis op een podium in New York. Samen met Noé Sécula schreef hij alle nummers voor zijn Studio Toots-opname.Lotte Verstaen (zang, klassiek) | TieltOpera- of liedrepertoire, mezzosopraan Lotte Verstaen draait er haar hand niet voor om. Haar repertoire reikt van intieme liederen van Joseph Jongen tot extraverte opera-aria’s van Bizet en Tsjaikovski. Lotte zingt regelmatig in de Vlaamse Opera en in de Munt, maar evenzeer prijkt ze op affiches van de Opéra Royal in Luik en van de Parijse operascène. Elisabeth Klinck (viool, crossover) | BrusselVioliste Elisabeth Klinck studeerde naast viool ook elektro-akoestische compositie. Ze beschrijft haar werken als emotionele landschappen gegenereerd door intieme en atmosferische tonen. Haar muziek is niet meteen melodisch, maar heeft een gevarieerde textuur met een hedendaags experimenteel tintje.Lenny Bui-Vandeput (piano, klassiek) | LeuvenPianist Lenny Bui-Vandeput volgde les in Brussel bij Jan Michiels, in Leuven bij Liebrecht Vanbeckevoort, maar ook in Seoul bij Jinsang Lee. Hij beschikt over een repertoire dat voornamelijk exclusief is: 'La Valse' van Maurice Ravel. Dit stuk in driekwartsmaat was door Ravel initieel bedoeld voor 2 piano’s, pas later maakte hij er een orkestversie van. Lenny speelt ook solistisch repertoire van Franz Liszt waarin virtuoze passages afwisselen met vertederende en hoogst expressieve rustige passages. Liesl Vanoverberghe (dwarsfluit, klassiek) | Mont de l’EnclusAls jongste Twintiger van deze editie excelleert Liesl Vanoverberghe op fluit! De virtuoze maar tegelijk ‘klassieke’ sonate in C van de Georgische componist Otar Taktakishvili kende ze reeds als kind en vertolkt ze met verve in deze Toots-opname. Veel experimenteler klinkt het werk van Ian Clarke waarin Liesl tovert met klanken. Als tiener deed ze ervaring op in internationale orkesten en speelde ze met gerenommeerde dirigenten. Na dit derde jaar aan het Conservatorium van Maastricht rondt ze daar in 2026 haar Bachelor af.Haroun Iqbal (gitaar, jazz/folk) | HeuleVan West-Afrikaanse kora-nummers, via Indische raga tot Westerse jazzmuziek: gitarist Haroun Iqbal schrikt voor geen enkel van deze genres terug. Haroun is erop gebrand om al die diverse invloeden in zijn eigen composities te laten samenkomen. Met zijn Kwartet Iqnovara presenteert hij tijdens de Toots-opname drie eigen werken en daarnaast een arrangement voor gitaarsolo van Toumani Diabaté, een Malinees kora-speler.Jonathan van der Beek (hoorn, klassiek) | HerentNa zijn studie in Brussel bij Luc Bergé verhuisde Jonathan van der Beek naar Leipzig om er bij Thomas Hauschild in de leer te gaan. Daar studeerde hij vorig jaar af, op z’n 24ste. ​ Hij speelde al in tal van Europese symfonische orkesten. Jonathan speelt zowel op moderne hoorn, als op natuurhoorn. Anaïs Vijgen (zang, jazz) | StevoortJazz-zangeres en componiste Anaïs studeerde jazz aan de conservatoria van Gent en Antwerpen. Als een Parijse diva zingt ze haar eigen composities. Samen met vier andere musici vormt ze het kwintet Anaïs. Met haar mooie, maar tegelijk heel broze stem grijpt ze de luisteraar bij zijn nekvel in het werk van Léo Ferré. Op haar 24ste zingt ze alsof ze de waarheid in pacht heeft; werkelijk adembenemend. Jiska Lambrecht (viool, klassiek) | MerelbekeMet een aartsmoeilijk repertoire scheert Jiska Lambrecht meteen hoge toppen. Als violiste van 28 presenteert ze zich als soliste in het repertoire van Maurice Ravel en Lily Boulanger. Jiska woont momenteel in Zürich en studeert daar bij Ilya Gringolts. Ze houdt erg veel van kamermuziek, maar ze is op de Europese podia ook te horen als soliste in vioolconcerti. Orson Claeys (piano, jazz) | GentJazzpianist Orson Claeys begon zijn opleiding aan het Brussels Conservatorium. Hij ontwikkelde al vlug een compleet eigen stijl waarin jazz blendt met wereldmuziek: hij evoceert diverse andere invloeden en klanken. Hedendaagse jazz in een sfeer van romantische melodieën en soms in een opzwepende ritmiek zorgt voor een directe, maar diepe communicatie met de luisteraar. ​ Leer De Twintigers beter kennen op het Klara-Kanaal op VRT MAX.Alles van Klara op VRT MAXTien twintigers, tien weken lang op KlaraTussen maandag 10 februari en vrijdag 9 mei staat er elke week één muzikant centraal, behalve tijdens de krokus- en de paasvakantie. Luisteraars horen en zien de beloftevolle jongeren in verschillende radioprogramma’s op Klara, via het Klara-kanaal op VRT MAX en ook op de socialemediakanalen van Klara. Op vrijdag is er telkens de apotheose met de uitzending van de concertopname vanuit de legendarische Studio Toots in het radioprogramma De Twintigers, waarin de musici volop hun talent kunnen tonen. De concerten op VRT MAX Elke Twintiger blinkt opnieuw in de Studio Toots met een uniek concert. Op vrijdag 14 februari zijn alle concerten al te zien op het Klara-kanaal op VRT MAX. Daarin valt ook te ontdekken welke muzikanten De Twintigers mee op het podium hebben uitgenodigd.De Twintigers hoor je elke week op Klara Espresso | elke maandag tussen 6 en 9 uur.Sta elke maandagochtend mee op met De Twintigers. Hoe begint deze jonge lichting muzikanten aan de ochtend? Wie heeft een ochtendhumeur en wie is de vroege vogel? Komt de muzikale inspiratie al bij het ontbijt, of is er eerst een sloot koffie nodig voor ze hun instrument in de hand nemen? Music Matters | van maandag tot donderdag tussen 12 en 14 uur.Welke werken zijn essentieel voor de Twintiger en waarom? Leer de jonge muzikanten beter kennen aan de hand van hun persoonlijke playlist. De Twintigers | elke vrijdag tussen 12 en 14 uur.Op vrijdag hoor je het unieke concert van de jonge virtuoos, opgenomen in Studio Toots. Daarnaast gaat Carlo Siau ook uitvoerig in dialoog met de Twintiger, op zoek naar de mens achter de muziek. Uitzendplanning concerten: Eliott Knuets (gitaar, jazz) | 14 februariLotte Verstaen (zang, klassiek) | 21 februari ​ ​Elisabeth Klinck (viool, crossover) | 28 februariLenny Bui-Vandeput (piano, klassiek) | 14 maartLiesl Vanoverberghe (fluit, klassiek) | 21 maartHaroun Iqbal (gitaar, jazz) | 28 maartJonathan van der Beek (hoorn, klassiek) | 4 aprilAnaïs Vijgen (zang, jazz) | 25 aprilJiska Lambrecht (viool, klassiek) | 2 meiOrson Claeys (piano, jazz) | 9 meiDe Twintigers: vanaf maandag 10 februari elke week op Klara en op het Klara-kanaal van VRT MAX.Lees zeker ookMuziekWereldradiodag: echt merci aan alle VRT-radiotoppers!MuziekRed Sebastian gaat voor België naar het Eurovisiesongfestival in Bazel met 'Strobe lights'MuziekAlice Mae, Kaat Van Stralen en Uwase zijn de winnaars van De Nieuwe Lichting 2025MuziekPommelien Thijs en Sylvie Kreusch grote winnaars van de MIA’s 2024MuziekMIA’s 2024: Daphne Agten, Lotte Kopecky, Philippe Geubels en heel wat andere populaire uitreikers maken de winnaars bekendMuziekMia’s Sessies op VRT CanvasMuziekZo klinkt de Week van de Belgische muziek bij VRTDeel dit artikel op sociale mediaBenieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
