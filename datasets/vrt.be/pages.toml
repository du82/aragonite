["https://vrt.be/nl/over-ons/onze-opdracht/beheersovereenkomst"]
title = "Beheersovereenkomst | VRT"
description = "De beheersovereenkomst legt de afspraken vast waaraan de VRT zich gedurende vijf jaar moet houden in ruil voor financiële middelen van de Vlaamse overheid."
full_description = "Home/Over ons/Onze opdracht/BeheersovereenkomstBeheersovereenkomstDe beheersovereenkomst legt de afspraken vast waaraan VRT zich gedurende vijf jaar moet houden in ruil voor financiële middelen van de Vlaamse overheid. VideoNieuwe beheersovereenkomst VRTBeheersovereenkomst 2020-2025Beheersovereenkomst 2020-2025pdf2043 KBWat is een beheersovereenkomst? De Beheersovereenkomst 2021-2025 werd op 10 december 2020 ondertekend door de Vlaamse regering en de publieke omroep. De beheersovereenkomst regelt onder andere: meetbare doelstellingen m.b.t. de VRT-opdracht (kwaliteit, bereik, waardering) de doelstellingen over de onderzoeks- en innovatieopdracht van VRT de doelstellingen betreffende het personeelsbeleid, het financiële beleid, technologie en transmissie de toegekende financiële middelen De Vlaamse Regering kan nog andere bepalingen opnemen in de beheersovereenkomst. Die kunnen gaan over bijvoorbeeld de commerciële communicatie en het ontwikkelen van nieuwe diensten/activiteiten. Beheersovereenkomst 2021-2025 De Beheersovereenkomst 2020– 2025 tussen de Vlaamse Gemeenschap en VRT bepaalt het kader waarbinnen de publieke omroep in de periode 2021-2025 haar opdracht zal vervullen. De basisvisie van deze beheersovereenkomst is om niet langer als traditionele radio- en televisieomroeporganisatie, maar als publieke mediaorganisatie met focus op audio en video een maatschappelijke taak ter versterking van de Vlaamse samenleving in Vlaanderen en Brussel op te nemen. In een mediasector die gekenmerkt wordt door nooit geziene internationalisering en tal van uitdagingen die daarmee gepaard gaan op vlak van lokale productie en desinformatie, kan en moet de publieke omroep een unieke rol spelen door dicht bij alle Vlamingen te staan, haar maatschappelijke en breed-educatieve opdracht voorop te stellen, correcte informatie en duiding aan te bieden in de strijd tegen desinformatie, en dit alles op een toekomstgerichte en in toenemende mate digitale manier. De Beheersovereenkomst schuift 6 strategische doelstellingen naar voren: Relevant voor en dicht bij Vlaanderen Voor iedereen een breed, kwalitatief en in toenemende mate digitaal aanbod Betrouwbare informatie als gemeenschappelijk referentiepunt De Vlaamse cultuur en creativiteit stimuleren Durven innoveren en gebruik maken van technologie voor maatschappelijke impact Samen het media-ecosysteem sterk houden Vorige Beheersovereenkomsten Beheersovereenkomst 2016 - 2020 ondertekende versiepdf952 KBAddendum 1 BHO 2016-2020pdf118 KBAddendum 2 BHO 2016-2020pdf635 KBBeheersovereenkomst 2012-2016pdf2769 KBBeheersovereenkomst 2007-2011pdf386 KBAddendum Cultuur BHO 2007-2011pdf293 KBAddendum Financiering BHO 2007-2011pdf518 KBVerklarend addendum BHO 2007-2011pdf358 KBAddendum Pensioenfonds BHO 2007-2011pdf799 KBEvaluatie BHO 2007-2011pdf1008 KBBeheersovereenkomst 2002-2006pdf301 KBBeheersovereenkomst 1997-2001pdf2418 KBVisietekst 2021-2025Visietekst 2021-2025pdf4736 KBStartnotapdf3340 KBPublieke meerwaarde VRTVRT focust op publieke meerwaarde en onderscheidt zich zo van de andere mediaspelers in Vlaanderen.Missie en waardenVRT is transparant en rapporteert op een open manier over de uitvoering van haar opdracht. De missie en waarden van VRT werden vastgelegd in de Beheersovereenkomst 2021-2025. Benieuwd naar het reilen en zeilen achter de schermen bij VRT? In onze maandelijkse nieuwsbrief kom je meer te wetenDe nieuwsbrief is gratis én je kan je steeds uitschrijven. Lees ons privacy beleid."
