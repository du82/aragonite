["https://vueds.com"]
title = "Vue Design System"
description = "Vue Design System is an open-source tool for building UI Design Systems with Vue.js. It provides you and your team a set of organized tools, patterns & practices."
full_description = "Features Built for Your Team A set of interconnected patterns & practices for you and your team with comprehensive documentation. Naming of Things A well thought-out terminology, naming conventions, and hierarchy for the whole design system to save time. Component Status WIP Get an automated overview of how your design system progresses over time and what’s still left to do. Design Tokens Global design tokens in YAML format that you can use inside any component. In both CSS and JavaScript. Living Docs Automatic generation of living, user editable documentation using custom version of Vue Styleguidist. Publish via NPM Easily export and use your Design System as an NPM dependency in another Vue.js project (or anywhere really). Faster Workflow Create a token, an element, or a pattern, and it’s immediately available across all your Vue.js components. Code Formatting Pre-configured Prettier setup for auto-formatting code on both save and before committing changes to Git. Configurable Live Reloading, Autoprefixing, SCSS and helper functions + good defaults for SVG and Webfont usage out-of-the-box. Examples Vue Design System Got something to add?"
author = "@arielsalminen"
year_published = 2025
