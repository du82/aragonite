["https://vuejs.org/api/built-in-components"]
title = "Built-in Components | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''Built-in Components ​Registration and UsageBuilt-in components can be used directly in templates without needing to be registered. They are also tree-shakeable: they are only included in the build when they are used.When using them in render functions, they need to be imported explicitly. For example:jsimport { h, Transition } from 'vue' h(Transition, { /* props */ })<Transition> ​Provides animated transition effects to a single element or component.Propstsinterface TransitionProps { /** * Used to automatically generate transition CSS class names. * e.g. `name: 'fade'` will auto expand to `.fade-enter`, * `.fade-enter-active`, etc. */ name?: string /** * Whether to apply CSS transition classes. * Default: true */ css?: boolean /** * Specifies the type of transition events to wait for to * determine transition end timing. * Default behavior is auto detecting the type that has * longer duration. */ type?: 'transition' | 'animation' /** * Specifies explicit durations of the transition. * Default behavior is wait for the first `transitionend` * or `animationend` event on the root transition element. */ duration?: number | { enter: number; leave: number } /** * Controls the timing sequence of leaving/entering transitions. * Default behavior is simultaneous. */ mode?: 'in-out' | 'out-in' | 'default' /** * Whether to apply transition on initial render. * Default: false */ appear?: boolean /** * Props for customizing transition classes. * Use kebab-case in templates, e.g. enter-from-class="xxx" */ enterFromClass?: string enterActiveClass?: string enterToClass?: string appearFromClass?: string appearActiveClass?: string appearToClass?: string leaveFromClass?: string leaveActiveClass?: string leaveToClass?: string }Events@before-enter@before-leave@enter@leave@appear@after-enter@after-leave@after-appear@enter-cancelled@leave-cancelled (v-show only)@appear-cancelledExampleSimple element:template<Transition> <div v-if="ok">toggled content</div> </Transition>Forcing a transition by changing the key attribute:template<Transition> <div :key="text">{{ text }}</div> </Transition>Dynamic component, with transition mode + animate on appear:template<Transition name="fade" mode="out-in" appear> <component :is="view"></component> </Transition>Listening to transition events:template<Transition @after-enter="onTransitionComplete"> <div v-show="ok">toggled content</div> </Transition>See also Guide - Transition<TransitionGroup> ​Provides transition effects for multiple elements or components in a list.Props<TransitionGroup> accepts the same props as <Transition> except mode, plus two additional props:tsinterface TransitionGroupProps extends Omit<TransitionProps, 'mode'> { /** * If not defined, renders as a fragment. */ tag?: string /** * For customizing the CSS class applied during move transitions. * Use kebab-case in templates, e.g. move-class="xxx" */ moveClass?: string }Events<TransitionGroup> emits the same events as <Transition>.DetailsBy default, <TransitionGroup> doesn't render a wrapper DOM element, but one can be defined via the tag prop.Note that every child in a <transition-group> must be uniquely keyed for the animations to work properly.<TransitionGroup> supports moving transitions via CSS transform. When a child's position on screen has changed after an update, it will get applied a moving CSS class (auto generated from the name attribute or configured with the move-class prop). If the CSS transform property is "transition-able" when the moving class is applied, the element will be smoothly animated to its destination using the FLIP technique.Exampletemplate<TransitionGroup tag="ul" name="slide"> <li v-for="item in items" :key="item.id"> {{ item.text }} </li> </TransitionGroup>See also Guide - TransitionGroup<KeepAlive> ​Caches dynamically toggled components wrapped inside.Propstsinterface KeepAliveProps { /** * If specified, only components with names matched by * `include` will be cached. */ include?: MatchPattern /** * Any component with a name matched by `exclude` will * not be cached. */ exclude?: MatchPattern /** * The maximum number of component instances to cache. */ max?: number | string } type MatchPattern = string | RegExp | (string | RegExp)[]DetailsWhen wrapped around a dynamic component, <KeepAlive> caches the inactive component instances without destroying them.There can only be one active component instance as the direct child of <KeepAlive> at any time.When a component is toggled inside <KeepAlive>, its activated and deactivated lifecycle hooks will be invoked accordingly, providing an alternative to mounted and unmounted, which are not called. This applies to the direct child of <KeepAlive> as well as to all of its descendants.ExampleBasic usage:template<KeepAlive> <component :is="view"></component> </KeepAlive>When used with v-if / v-else branches, there must be only one component rendered at a time:template<KeepAlive> <comp-a v-if="a > 1"></comp-a> <comp-b v-else></comp-b> </KeepAlive>Used together with <Transition>:template<Transition> <KeepAlive> <component :is="view"></component> </KeepAlive> </Transition>Using include / exclude:template<!-- comma-delimited string --> <KeepAlive include="a,b"> <component :is="view"></component> </KeepAlive> <!-- regex (use `v-bind`) --> <KeepAlive :include="/a|b/"> <component :is="view"></component> </KeepAlive> <!-- Array (use `v-bind`) --> <KeepAlive :include="['a', 'b']"> <component :is="view"></component> </KeepAlive>Usage with max:template<KeepAlive :max="10"> <component :is="view"></component> </KeepAlive>See also Guide - KeepAlive<Teleport> ​Renders its slot content to another part of the DOM.Propstsinterface TeleportProps { /** * Required. Specify target container. * Can either be a selector or an actual element. */ to: string | HTMLElement /** * When `true`, the content will remain in its original * location instead of moved into the target container. * Can be changed dynamically. */ disabled?: boolean /** * When `true`, the Teleport will defer until other * parts of the application have been mounted before * resolving its target. (3.5+) */ defer?: boolean }ExampleSpecifying target container:template<Teleport to="#some-id" /> <Teleport to=".some-class" /> <Teleport to="[data-teleport]" />Conditionally disabling:template<Teleport to="#popup" :disabled="displayVideoInline"> <video src="./my-movie.mp4"> </Teleport>Defer target resolution :template<Teleport defer to="#late-div">...</Teleport> <!-- somewhere later in the template --> <div id="late-div"></div>See also Guide - Teleport<Suspense> ​Used for orchestrating nested async dependencies in a component tree.Propstsinterface SuspenseProps { timeout?: string | number suspensible?: boolean }Events@resolve@pending@fallbackDetails<Suspense> accepts two slots: the #default slot and the #fallback slot. It will display the content of the fallback slot while rendering the default slot in memory.If it encounters async dependencies (Async Components and components with async setup()) while rendering the default slot, it will wait until all of them are resolved before displaying the default slot.By setting the Suspense as suspensible, all the async dependency handling will be handled by the parent Suspense. See implementation detailsSee also Guide - SuspenseEdit this page on GitHub'''
