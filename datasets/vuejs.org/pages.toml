title = "Reactivity API: Advanced | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''Reactivity API: Advanced ​shallowRef() ​Shallow version of ref().Typetsfunction shallowRef<T>(value: T): ShallowRef<T> interface ShallowRef<T> { value: T }DetailsUnlike ref(), the inner value of a shallow ref is stored and exposed as-is, and will not be made deeply reactive. Only the .value access is reactive.shallowRef() is typically used for performance optimizations of large data structures, or integration with external state management systems.Examplejsconst state = shallowRef({ count: 1 }) // does NOT trigger change state.value.count = 2 // does trigger change state.value = { count: 2 }See alsoGuide - Reduce Reactivity Overhead for Large Immutable StructuresGuide - Integration with External State SystemstriggerRef() ​Force trigger effects that depends on a shallow ref. This is typically used after making deep mutations to the inner value of a shallow ref.Typetsfunction triggerRef(ref: ShallowRef): voidExamplejsconst shallow = shallowRef({ greet: 'Hello, world' }) // Logs "Hello, world" once for the first run-through watchEffect(() => { console.log(shallow.value.greet) }) // This won't trigger the effect because the ref is shallow shallow.value.greet = 'Hello, universe' // Logs "Hello, universe" triggerRef(shallow)customRef() ​Creates a customized ref with explicit control over its dependency tracking and updates triggering.Typetsfunction customRef<T>(factory: CustomRefFactory<T>): Ref<T> type CustomRefFactory<T> = ( track: () => void, trigger: () => void ) => { get: () => T set: (value: T) => void }DetailscustomRef() expects a factory function, which receives track and trigger functions as arguments and should return an object with get and set methods.In general, track() should be called inside get(), and trigger() should be called inside set(). However, you have full control over when they should be called, or whether they should be called at all.ExampleCreating a debounced ref that only updates the value after a certain timeout after the latest set call:jsimport { customRef } from 'vue' export function useDebouncedRef(value, delay = 200) { let timeout return customRef((track, trigger) => { return { get() { track() return value }, set(newValue) { clearTimeout(timeout) timeout = setTimeout(() => { value = newValue trigger() }, delay) } } }) }Usage in component:vue<script setup> import { useDebouncedRef } from './debouncedRef' const text = useDebouncedRef('hello') </script> <template> <input v-model="text" /> </template>Try it in the PlaygroundUse with cautionWhen using customRef, we should be cautious about the return value of its getter, particularly when generating new object datatypes each time the getter is run. This affects the relationship between parent and child components, where such a customRef has been passed as a prop.The parent component's render function could be triggered by changes to a different reactive state. During rerender, the value of our customRef is reevaluated, returning a new object datatype as a prop to a child component. This prop is compared with its last value in the child component, and since they are different, the reactive dependencies of the customRef are triggered in the child component. Meanwhile, the reactive dependencies in the parent component do not run because the customRef's setter was not called, and its dependencies were not triggered as a result.See it in the PlaygroundshallowReactive() ​Shallow version of reactive().Typetsfunction shallowReactive<T extends object>(target: T): TDetailsUnlike reactive(), there is no deep conversion: only root-level properties are reactive for a shallow reactive object. Property values are stored and exposed as-is - this also means properties with ref values will not be automatically unwrapped.Use with CautionShallow data structures should only be used for root level state in a component. Avoid nesting it inside a deep reactive object as it creates a tree with inconsistent reactivity behavior which can be difficult to understand and debug.Examplejsconst state = shallowReactive({ foo: 1, nested: { bar: 2 } }) // mutating state's own properties is reactive state.foo++ // ...but does not convert nested objects isReactive(state.nested) // false // NOT reactive state.nested.bar++shallowReadonly() ​Shallow version of readonly().Typetsfunction shallowReadonly<T extends object>(target: T): Readonly<T>DetailsUnlike readonly(), there is no deep conversion: only root-level properties are made readonly. Property values are stored and exposed as-is - this also means properties with ref values will not be automatically unwrapped.Use with CautionShallow data structures should only be used for root level state in a component. Avoid nesting it inside a deep reactive object as it creates a tree with inconsistent reactivity behavior which can be difficult to understand and debug.Examplejsconst state = shallowReadonly({ foo: 1, nested: { bar: 2 } }) // mutating state's own properties will fail state.foo++ // ...but works on nested objects isReadonly(state.nested) // false // works state.nested.bar++toRaw() ​Returns the raw, original object of a Vue-created proxy.Typetsfunction toRaw<T>(proxy: T): TDetailstoRaw() can return the original object from proxies created by reactive(), readonly(), shallowReactive() or shallowReadonly().This is an escape hatch that can be used to temporarily read without incurring proxy access / tracking overhead or write without triggering changes. It is not recommended to hold a persistent reference to the original object. Use with caution.Examplejsconst foo = {} const reactiveFoo = reactive(foo) console.log(toRaw(reactiveFoo) === foo) // truemarkRaw() ​Marks an object so that it will never be converted to a proxy. Returns the object itself.Typetsfunction markRaw<T extends object>(value: T): TExamplejsconst foo = markRaw({}) console.log(isReactive(reactive(foo))) // false // also works when nested inside other reactive objects const bar = reactive({ foo }) console.log(isReactive(bar.foo)) // falseUse with CautionmarkRaw() and shallow APIs such as shallowReactive() allow you to selectively opt-out of the default deep reactive/readonly conversion and embed raw, non-proxied objects in your state graph. They can be used for various reasons:Some values simply should not be made reactive, for example a complex 3rd party class instance, or a Vue component object.Skipping proxy conversion can provide performance improvements when rendering large lists with immutable data sources.They are considered advanced because the raw opt-out is only at the root level, so if you set a nested, non-marked raw object into a reactive object and then access it again, you get the proxied version back. This can lead to identity hazards - i.e. performing an operation that relies on object identity but using both the raw and the proxied version of the same object:jsconst foo = markRaw({ nested: {} }) const bar = reactive({ // although `foo` is marked as raw, foo.nested is not. nested: foo.nested }) console.log(foo.nested === bar.nested) // falseIdentity hazards are in general rare. However, to properly utilize these APIs while safely avoiding identity hazards requires a solid understanding of how the reactivity system works.effectScope() ​Creates an effect scope object which can capture the reactive effects (i.e. computed and watchers) created within it so that these effects can be disposed together. For detailed use cases of this API, please consult its corresponding RFC.Typetsfunction effectScope(detached?: boolean): EffectScope interface EffectScope { run<T>(fn: () => T): T | undefined // undefined if scope is inactive stop(): void }Examplejsconst scope = effectScope() scope.run(() => { const doubled = computed(() => counter.value * 2) watch(doubled, () => console.log(doubled.value)) watchEffect(() => console.log('Count: ', doubled.value)) }) // to dispose all effects in the scope scope.stop()getCurrentScope() ​Returns the current active effect scope if there is one.Typetsfunction getCurrentScope(): EffectScope | undefinedonScopeDispose() ​Registers a dispose callback on the current active effect scope. The callback will be invoked when the associated effect scope is stopped.This method can be used as a non-component-coupled replacement of onUnmounted in reusable composition functions, since each Vue component's setup() function is also invoked in an effect scope.A warning will be thrown if this function is called without an active effect scope. In 3.5+, this warning can be suppressed by passing true as the second argument.Typetsfunction onScopeDispose(fn: () => void, failSilently?: boolean): voidEdit this page on GitHub'''
