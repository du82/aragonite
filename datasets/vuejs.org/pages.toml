["https://vuejs.org/api/sfc-script-setup"]
title = "<script setup> | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''<script setup> ​<script setup> is a compile-time syntactic sugar for using Composition API inside Single-File Components (SFCs). It is the recommended syntax if you are using both SFCs and Composition API. It provides a number of advantages over the normal <script> syntax:More succinct code with less boilerplateAbility to declare props and emitted events using pure TypeScriptBetter runtime performance (the template is compiled into a render function in the same scope, without an intermediate proxy)Better IDE type-inference performance (less work for the language server to extract types from code)Basic Syntax ​To opt-in to the syntax, add the setup attribute to the <script> block:vue<script setup> console.log('hello script setup') </script>The code inside is compiled as the content of the component's setup() function. This means that unlike normal <script>, which only executes once when the component is first imported, code inside <script setup> will execute every time an instance of the component is created.Top-level bindings are exposed to template ​When using <script setup>, any top-level bindings (including variables, function declarations, and imports) declared inside <script setup> are directly usable in the template:vue<script setup> // variable const msg = 'Hello!' // functions function log() { console.log(msg) } </script> <template> <button @click="log">{{ msg }}</button> </template>Imports are exposed in the same fashion. This means you can directly use an imported helper function in template expressions without having to expose it via the methods option:vue<script setup> import { capitalize } from './helpers' </script> <template> <div>{{ capitalize('hello') }}</div> </template>Reactivity ​Reactive state needs to be explicitly created using Reactivity APIs. Similar to values returned from a setup() function, refs are automatically unwrapped when referenced in templates:vue<script setup> import { ref } from 'vue' const count = ref(0) </script> <template> <button @click="count++">{{ count }}</button> </template>Using Components ​Values in the scope of <script setup> can also be used directly as custom component tag names:vue<script setup> import MyComponent from './MyComponent.vue' </script> <template> <MyComponent /> </template>Think of MyComponent as being referenced as a variable. If you have used JSX, the mental model is similar here. The kebab-case equivalent <my-component> also works in the template - however PascalCase component tags are strongly recommended for consistency. It also helps differentiating from native custom elements.Dynamic Components ​Since components are referenced as variables instead of registered under string keys, we should use dynamic :is binding when using dynamic components inside <script setup>:vue<script setup> import Foo from './Foo.vue' import Bar from './Bar.vue' </script> <template> <component :is="Foo" /> <component :is="someCondition ? Foo : Bar" /> </template>Note how the components can be used as variables in a ternary expression.Recursive Components ​An SFC can implicitly refer to itself via its filename. E.g. a file named FooBar.vue can refer to itself as <FooBar/> in its template.Note this has lower priority than imported components. If you have a named import that conflicts with the component's inferred name, you can alias the import:jsimport { FooBar as FooBarChild } from './components'Namespaced Components ​You can use component tags with dots like <Foo.Bar> to refer to components nested under object properties. This is useful when you import multiple components from a single file:vue<script setup> import * as Form from './form-components' </script> <template> <Form.Input> <Form.Label>label</Form.Label> </Form.Input> </template>Using Custom Directives ​Globally registered custom directives just work as normal. Local custom directives don't need to be explicitly registered with <script setup>, but they must follow the naming scheme vNameOfDirective:vue<script setup> const vMyDirective = { beforeMount: (el) => { // do something with the element } } </script> <template> <h1 v-my-directive>This is a Heading</h1> </template>If you're importing a directive from elsewhere, it can be renamed to fit the required naming scheme:vue<script setup> import { myDirective as vMyDirective } from './MyDirective.js' </script>defineProps() & defineEmits() ​To declare options like props and emits with full type inference support, we can use the defineProps and defineEmits APIs, which are automatically available inside <script setup>:vue<script setup> const props = defineProps({ foo: String }) const emit = defineEmits(['change', 'delete']) // setup code </script>defineProps and defineEmits are compiler macros only usable inside <script setup>. They do not need to be imported, and are compiled away when <script setup> is processed.defineProps accepts the same value as the props option, while defineEmits accepts the same value as the emits option.defineProps and defineEmits provide proper type inference based on the options passed.The options passed to defineProps and defineEmits will be hoisted out of setup into module scope. Therefore, the options cannot reference local variables declared in setup scope. Doing so will result in a compile error. However, it can reference imported bindings since they are in the module scope as well.Type-only props/emit declarations ​Props and emits can also be declared using pure-type syntax by passing a literal type argument to defineProps or defineEmits:tsconst props = defineProps<{ foo: string bar?: number }>() const emit = defineEmits<{ (e: 'change', id: number): void (e: 'update', value: string): void }>() // 3.3+: alternative, more succinct syntax const emit = defineEmits<{ change: [id: number] // named tuple syntax update: [value: string] }>()defineProps or defineEmits can only use either runtime declaration OR type declaration. Using both at the same time will result in a compile error.When using type declaration, the equivalent runtime declaration is automatically generated from static analysis to remove the need for double declaration and still ensure correct runtime behavior.In dev mode, the compiler will try to infer corresponding runtime validation from the types. For example here foo: String is inferred from the foo: string type. If the type is a reference to an imported type, the inferred result will be foo: null (equal to any type) since the compiler does not have information of external files.In prod mode, the compiler will generate the array format declaration to reduce bundle size (the props here will be compiled into ['foo', 'bar'])In version 3.2 and below, the generic type parameter for defineProps() were limited to a type literal or a reference to a local interface.This limitation has been resolved in 3.3. The latest version of Vue supports referencing imported and a limited set of complex types in the type parameter position. However, because the type to runtime conversion is still AST-based, some complex types that require actual type analysis, e.g. conditional types, are not supported. You can use conditional types for the type of a single prop, but not the entire props object.Reactive Props Destructure ​In Vue 3.5 and above, variables destructured from the return value of defineProps are reactive. Vue's compiler automatically prepends props. when code in the same <script setup> block accesses variables destructured from defineProps:tsconst { foo } = defineProps(['foo']) watchEffect(() => { // runs only once before 3.5 // re-runs when the "foo" prop changes in 3.5+ console.log(foo) })The above is compiled to the following equivalent:jsconst props = defineProps(['foo']) watchEffect(() => { // `foo` transformed to `props.foo` by the compiler console.log(props.foo) })In addition, you can use JavaScript's native default value syntax to declare default values for the props. This is particularly useful when using the type-based props declaration:tsinterface Props { msg?: string labels?: string[] } const { msg = 'hello', labels = ['one', 'two'] } = defineProps<Props>()Default props values when using type declaration ​In 3.5 and above, default values can be naturally declared when using Reactive Props Destructure. But in 3.4 and below, Reactive Props Destructure is not enabled by default. In order to declare props default values with type-based declaration, the withDefaults compiler macro is needed:tsinterface Props { msg?: string labels?: string[] } const props = withDefaults(defineProps<Props>(), { msg: 'hello', labels: () => ['one', 'two'] })This will be compiled to equivalent runtime props default options. In addition, the withDefaults helper provides type checks for the default values, and ensures the returned props type has the optional flags removed for properties that do have default values declared.INFONote that default values for mutable reference types (like arrays or objects) should be wrapped in functions when using withDefaults to avoid accidental modification and external side effects. This ensures each component instance gets its own copy of the default value. This is not necessary when using default values with destructure.defineModel() ​Only available in 3.4+This macro can be used to declare a two-way binding prop that can be consumed via v-model from the parent component. Example usage is also discussed in the Component v-model guide.Under the hood, this macro declares a model prop and a corresponding value update event. If the first argument is a literal string, it will be used as the prop name; Otherwise the prop name will default to "modelValue". In both cases, you can also pass an additional object which can include the prop's options and the model ref's value transform options.js// declares "modelValue" prop, consumed by parent via v-model const model = defineModel() // OR: declares "modelValue" prop with options const model = defineModel({ type: String }) // emits "update:modelValue" when mutated model.value = 'hello' // declares "count" prop, consumed by parent via v-model:count const count = defineModel('count') // OR: declares "count" prop with options const count = defineModel('count', { type: Number, default: 0 }) function inc() { // emits "update:count" when mutated count.value++ }WARNINGIf you have a default value for defineModel prop and you don't provide any value for this prop from the parent component, it can cause a de-synchronization between parent and child components. In the example below, the parent's myRef is undefined, but the child's model is 1:js// child component: const model = defineModel({ default: 1 }) // parent component: const myRef = ref()html<Child v-model="myRef"></Child>Modifiers and Transformers ​To access modifiers used with the v-model directive, we can destructure the return value of defineModel() like this:jsconst [modelValue, modelModifiers] = defineModel() // corresponds to v-model.trim if (modelModifiers.trim) { // ... }When a modifier is present, we likely need to transform the value when reading or syncing it back to the parent. We can achieve this by using the get and set transformer options:jsconst [modelValue, modelModifiers] = defineModel({ // get() omitted as it is not needed here set(value) { // if the .trim modifier is used, return trimmed value if (modelModifiers.trim) { return value.trim() } // otherwise, return the value as-is return value } })Usage with TypeScript ​Like defineProps and defineEmits, defineModel can also receive type arguments to specify the types of the model value and the modifiers:tsconst modelValue = defineModel<string>() // ^? Ref<string | undefined> // default model with options, required removes possible undefined values const modelValue = defineModel<string>({ required: true }) // ^? Ref<string> const [modelValue, modifiers] = defineModel<string, 'trim' | 'uppercase'>() // ^? Record<'trim' | 'uppercase', true | undefined>defineExpose() ​Components using <script setup> are closed by default - i.e. the public instance of the component, which is retrieved via template refs or $parent chains, will not expose any of the bindings declared inside <script setup>.To explicitly expose properties in a <script setup> component, use the defineExpose compiler macro:vue<script setup> import { ref } from 'vue' const a = 1 const b = ref(2) defineExpose({ a, b }) </script>When a parent gets an instance of this component via template refs, the retrieved instance will be of the shape { a: number, b: number } (refs are automatically unwrapped just like on normal instances).defineOptions() ​Only supported in 3.3+This macro can be used to declare component options directly inside <script setup> without having to use a separate <script> block:vue<script setup> defineOptions({ inheritAttrs: false, customOptions: { /* ... */ } }) </script>This is a macro. The options will be hoisted to module scope and cannot access local variables in <script setup> that are not literal constants.defineSlots() ​Only supported in 3.3+This macro can be used to provide type hints to IDEs for slot name and props type checking.defineSlots() only accepts a type parameter and no runtime arguments. The type parameter should be a type literal where the property key is the slot name, and the value type is the slot function. The first argument of the function is the props the slot expects to receive, and its type will be used for slot props in the template. The return type is currently ignored and can be any, but we may leverage it for slot content checking in the future.It also returns the slots object, which is equivalent to the slots object exposed on the setup context or returned by useSlots().vue<script setup lang="ts"> const slots = defineSlots<{ default(props: { msg: string }): any }>() </script>useSlots() & useAttrs() ​Usage of slots and attrs inside <script setup> should be relatively rare, since you can access them directly as $slots and $attrs in the template. In the rare case where you do need them, use the useSlots and useAttrs helpers respectively:vue<script setup> import { useSlots, useAttrs } from 'vue' const slots = useSlots() const attrs = useAttrs() </script>useSlots and useAttrs are actual runtime functions that return the equivalent of setupContext.slots and setupContext.attrs. They can be used in normal composition API functions as well.Usage alongside normal <script> ​<script setup> can be used alongside normal <script>. A normal <script> may be needed in cases where we need to:Declare options that cannot be expressed in <script setup>, for example inheritAttrs or custom options enabled via plugins (Can be replaced by defineOptions in 3.3+).Declaring named exports.Run side effects or create objects that should only execute once.vue<script> // normal <script>, executed in module scope (only once) runSideEffectOnce() // declare additional options export default { inheritAttrs: false, customOptions: {} } </script> <script setup> // executed in setup() scope (for each '''
