title = "Watchers | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''Watchers ​Basic Example ​Computed properties allow us to declaratively compute derived values. However, there are cases where we need to perform "side effects" in reaction to state changes - for example, mutating the DOM, or changing another piece of state based on the result of an async operation.With the Options API, we can use the watch option to trigger a function whenever a reactive property changes:jsexport default { data() { return { question: '', answer: 'Questions usually contain a question mark. ;-)', loading: false } }, watch: { // whenever question changes, this function will run question(newQuestion, oldQuestion) { if (newQuestion.includes('?')) { this.getAnswer() } } }, methods: { async getAnswer() { this.loading = true this.answer = 'Thinking...' try { const res = await fetch('https://yesno.wtf/api') this.answer = (await res.json()).answer } catch (error) { this.answer = 'Error! Could not reach the API. ' + error } finally { this.loading = false } } } }template<p> Ask a yes/no question: <input v-model="question" :disabled="loading" /> </p> <p>{{ answer }}</p>Try it in the PlaygroundThe watch option also supports a dot-delimited path as the key:jsexport default { watch: { // Note: only simple paths. Expressions are not supported. 'some.nested.key'(newValue) { // ... } } }With Composition API, we can use the watch function to trigger a callback whenever a piece of reactive state changes:vue<script setup> import { ref, watch } from 'vue' const question = ref('') const answer = ref('Questions usually contain a question mark. ;-)') const loading = ref(false) // watch works directly on a ref watch(question, async (newQuestion, oldQuestion) => { if (newQuestion.includes('?')) { loading.value = true answer.value = 'Thinking...' try { const res = await fetch('https://yesno.wtf/api') answer.value = (await res.json()).answer } catch (error) { answer.value = 'Error! Could not reach the API. ' + error } finally { loading.value = false } } }) </script> <template> <p> Ask a yes/no question: <input v-model="question" :disabled="loading" /> </p> <p>{{ answer }}</p> </template>Try it in the PlaygroundWatch Source Types ​watch's first argument can be different types of reactive "sources": it can be a ref (including computed refs), a reactive object, a getter function, or an array of multiple sources:jsconst x = ref(0) const y = ref(0) // single ref watch(x, (newX) => { console.log(`x is ${newX}`) }) // getter watch( () => x.value + y.value, (sum) => { console.log(`sum of x + y is: ${sum}`) } ) // array of multiple sources watch([x, () => y.value], ([newX, newY]) => { console.log(`x is ${newX} and y is ${newY}`) })Do note that you can't watch a property of a reactive object like this:jsconst obj = reactive({ count: 0 }) // this won't work because we are passing a number to watch() watch(obj.count, (count) => { console.log(`Count is: ${count}`) })Instead, use a getter:js// instead, use a getter: watch( () => obj.count, (count) => { console.log(`Count is: ${count}`) } )Deep Watchers ​watch is shallow by default: the callback will only trigger when the watched property has been assigned a new value - it won't trigger on nested property changes. If you want the callback to fire on all nested mutations, you need to use a deep watcher:jsexport default { watch: { someObject: { handler(newValue, oldValue) { // Note: `newValue` will be equal to `oldValue` here // on nested mutations as long as the object itself // hasn't been replaced. }, deep: true } } }When you call watch() directly on a reactive object, it will implicitly create a deep watcher - the callback will be triggered on all nested mutations:jsconst obj = reactive({ count: 0 }) watch(obj, (newValue, oldValue) => { // fires on nested property mutations // Note: `newValue` will be equal to `oldValue` here // because they both point to the same object! }) obj.count++This should be differentiated with a getter that returns a reactive object - in the latter case, the callback will only fire if the getter returns a different object:jswatch( () => state.someObject, () => { // fires only when state.someObject is replaced } )You can, however, force the second case into a deep watcher by explicitly using the deep option:jswatch( () => state.someObject, (newValue, oldValue) => { // Note: `newValue` will be equal to `oldValue` here // *unless* state.someObject has been replaced }, { deep: true } )In Vue 3.5+, the deep option can also be a number indicating the max traversal depth - i.e. how many levels should Vue traverse an object's nested properties.Use with CautionDeep watch requires traversing all nested properties in the watched object, and can be expensive when used on large data structures. Use it only when necessary and beware of the performance implications.Eager Watchers ​watch is lazy by default: the callback won't be called until the watched source has changed. But in some cases we may want the same callback logic to be run eagerly - for example, we may want to fetch some initial data, and then re-fetch the data whenever relevant state changes.We can force a watcher's callback to be executed immediately by declaring it using an object with a handler function and the immediate: true option:jsexport default { // ... watch: { question: { handler(newQuestion) { // this will be run immediately on component creation. }, // force eager callback execution immediate: true } } // ... }The initial execution of the handler function will happen just before the created hook. Vue will have already processed the data, computed, and methods options, so those properties will be available on the first invocation.We can force a watcher's callback to be executed immediately by passing the immediate: true option:jswatch( source, (newValue, oldValue) => { // executed immediately, then again when `source` changes }, { immediate: true } )Once Watchers ​Only supported in 3.4+Watcher's callback will execute whenever the watched source changes. If you want the callback to trigger only once when the source changes, use the once: true option.jsexport default { watch: { source: { handler(newValue, oldValue) { // when `source` changes, triggers only once }, once: true } } }jswatch( source, (newValue, oldValue) => { // when `source` changes, triggers only once }, { once: true } )watchEffect() ​It is common for the watcher callback to use exactly the same reactive state as the source. For example, consider the following code, which uses a watcher to load a remote resource whenever the todoId ref changes:jsconst todoId = ref(1) const data = ref(null) watch( todoId, async () => { const response = await fetch( `https://jsonplaceholder.typicode.com/todos/${todoId.value}` ) data.value = await response.json() }, { immediate: true } )In particular, notice how the watcher uses todoId twice, once as the source and then again inside the callback.This can be simplified with watchEffect(). watchEffect() allows us to track the callback's reactive dependencies automatically. The watcher above can be rewritten as:jswatchEffect(async () => { const response = await fetch( `https://jsonplaceholder.typicode.com/todos/${todoId.value}` ) data.value = await response.json() })Here, the callback will run immediately, there's no need to specify immediate: true. During its execution, it will automatically track todoId.value as a dependency (similar to computed properties). Whenever todoId.value changes, the callback will be run again. With watchEffect(), we no longer need to pass todoId explicitly as the source value.You can check out this example of watchEffect() and reactive data-fetching in action.For examples like these, with only one dependency, the benefit of watchEffect() is relatively small. But for watchers that have multiple dependencies, using watchEffect() removes the burden of having to maintain the list of dependencies manually. In addition, if you need to watch several properties in a nested data structure, watchEffect() may prove more efficient than a deep watcher, as it will only track the properties that are used in the callback, rather than recursively tracking all of them.TIPwatchEffect only tracks dependencies during its synchronous execution. When using it with an async callback, only properties accessed before the first await tick will be tracked.watch vs. watchEffect ​watch and watchEffect both allow us to reactively perform side effects. Their main difference is the way they track their reactive dependencies:watch only tracks the explicitly watched source. It won't track anything accessed inside the callback. In addition, the callback only triggers when the source has actually changed. watch separates dependency tracking from the side effect, giving us more precise control over when the callback should fire.watchEffect, on the other hand, combines dependency tracking and side effect into one phase. It automatically tracks every reactive property accessed during its synchronous execution. This is more convenient and typically results in terser code, but makes its reactive dependencies less explicit.Side Effect Cleanup ​Sometimes we may perform side effects, e.g. asynchronous requests, in a watcher:jswatch(id, (newId) => { fetch(`/api/${newId}`).then(() => { // callback logic }) })jsexport default { watch: { id(newId) { fetch(`/api/${newId}`).then(() => { // callback logic }) } } }But what if id changes before the request completes? When the previous request completes, it will still fire the callback with an ID value that is already stale. Ideally, we want to be able to cancel the stale request when id changes to a new value.We can use the onWatcherCleanup() API to register a cleanup function that will be called when the watcher is invalidated and is about to re-run:jsimport { watch, onWatcherCleanup } from 'vue' watch(id, (newId) => { const controller = new AbortController() fetch(`/api/${newId}`, { signal: controller.signal }).then(() => { // callback logic }) onWatcherCleanup(() => { // abort stale request controller.abort() }) })jsimport { onWatcherCleanup } from 'vue' export default { watch: { id(newId) { const controller = new AbortController() fetch(`/api/${newId}`, { signal: controller.signal }).then(() => { // callback logic }) onWatcherCleanup(() => { // abort stale request controller.abort() }) } } }Note that onWatcherCleanup is only supported in Vue 3.5+ and must be called during the synchronous execution of a watchEffect effect function or watch callback function: you cannot call it after an await statement in an async function.Alternatively, an onCleanup function is also passed to watcher callbacks as the 3rd argument, and to the watchEffect effect function as the first argument:jswatch(id, (newId, oldId, onCleanup) => { // ... onCleanup(() => { // cleanup logic }) }) watchEffect((onCleanup) => { // ... onCleanup(() => { // cleanup logic }) })jsexport default { watch: { id(newId, oldId, onCleanup) { // ... onCleanup(() => { // cleanup logic }) } } }This works in versions before 3.5. In addition, onCleanup passed via function argument is bound to the watcher instance so it is not subject to the synchronously constraint of onWatcherCleanup.Callback Flush Timing ​When you mutate reactive state, it may trigger both Vue component updates and watcher callbacks created by you.Similar to component updates, user-created watcher callbacks are batched to avoid duplicate invocations. For example, we probably don't want a watcher to fire a thousand times if we synchronously push a thousand items into an array being watched.By default, a watcher's callback is called after parent component updates (if any), and before the owner component's DOM updates. This means if you attempt to access the owner component's own DOM inside a watcher callback, the DOM will be in a pre-update state.Post Watchers ​If you want to access the owner component's DOM in a watcher callback after Vue has updated it, you need to specify the flush: 'post' option:jsexport default { // ... watch: { key: { handler() {}, flush: 'post' } } }jswatch(source, callback, { flush: 'post' }) watchEffect(callback, { flush: 'post' })Post-flush watchEffect() also has a convenience alias, watchPostEffect():jsimport { watchPostEffect } from 'vue' watchPostEffect(() => { /* executed after Vue updates */ })Sync Watchers ​It's also possible to create a watcher that fires synchronously, before any Vue-managed updates:jsexport default { // ... watch: { key: { handler() {}, flush: 'sync' } } }jswatch(source, callback, { flush: 'sync' }) watchEffect(callback, { flush: 'sync' })Sync watchEffect() also has a convenience alias, watchSyncEffect():jsimport { watchSyncEffect } from 'vue' watchSyncEffect(() => { /* executed synchronously upon reactive data change */ })Use with CautionSync watchers do not have batching and triggers every time a reactive mutation is detected. It's ok to use them to watch simple boolean values, but avoid using them on data sources that might be synchronously mutated many times, e.g. arrays.this.$watch() ​It's also possible to imperatively create watchers using the $watch() instance method:jsexport default { created() { this.$watch('question', (newQuestion) => { // ... }) } }This is useful when you need to conditionally set up a watcher, or only watch something in response to user interaction. It also allows you to stop the watcher early.Stopping a Watcher ​Watchers declared using the watch option or the $watch() instance method are automatically stopped when the owner component is unmounted, so in most cases you don't need to worry about stopping the watcher yourself.In the rare case where you need to stop a watcher before the owner component unmounts, the $watch() API returns a function for that:jsconst unwatch = this.$watch('foo', callback) // ...when the watcher is no longer needed: unwatch()Watchers declared synchronously inside setup() or <script setup> are bound to the owner component instance, and will be automatically stopped when the owner component is unmounted. In most cases, you don't need to worry about stopping the watcher yourself.The key here is that the watcher must be created synchronously: if the watcher is created in an async callback, it won't be bound to the owner component and must be stopped manually to avoid memory leaks. Here's an example:vue<script setup> import { watchEffect } from 'vue' // this one will be automatically stopped watchEffect(() => {}) // ...this one will not! setTimeout(() => { watchEffect(() => {}) }, 100) </script>To manually stop a watcher, use the returned handle function. This works for both watch and watchEffect:jsconst unwatch = watchEffect(() => {}) // ...later, when no longer needed unwatch()Note that there should be very few cases where you need to create watchers asynchronously, and synchronous creation should be preferred whenever possible. If you need to wait for some async data, you can make your watch logic conditional instead:js// data to be loaded asynchronously const d'''
