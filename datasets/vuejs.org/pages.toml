["https://vuejs.org/api/composition-api-helpers"]
title = "Composition API: Helpers | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''Composition API: Helpers ​useAttrs() ​Returns the attrs object from the Setup Context, which includes the fallthrough attributes of the current component. This is intended to be used in <script setup> where the setup context object is not available.Typetsfunction useAttrs(): Record<string, unknown>useSlots() ​Returns the slots object from the Setup Context, which includes parent passed slots as callable functions that return Virtual DOM nodes. This is intended to be used in <script setup> where the setup context object is not available.If using TypeScript, defineSlots() should be preferred instead.Typetsfunction useSlots(): Record<string, (...args: any[]) => VNode[]>useModel() ​This is the underlying helper that powers defineModel(). If using <script setup>, defineModel() should be preferred instead.Only available in 3.4+Typetsfunction useModel( props: Record<string, any>, key: string, options?: DefineModelOptions ): ModelRef type DefineModelOptions<T = any> = { get?: (v: T) => any set?: (v: T) => any } type ModelRef<T, M extends PropertyKey = string, G = T, S = T> = Ref<G, S> & [ ModelRef<T, M, G, S>, Record<M, true | undefined> ]Examplejsexport default { props: ['count'], emits: ['update:count'], setup(props) { const msg = useModel(props, 'count') msg.value = 1 } }DetailsuseModel() can be used in non-SFC components, e.g. when using raw setup() function. It expects the props object as the first argument, and the model name as the second argument. The optional third argument can be used to declare custom getter and setter for the resulting model ref. Note that unlike defineModel(), you are responsible for declaring the props and emits yourself.useTemplateRef() ​Returns a shallow ref whose value will be synced with the template element or component with a matching ref attribute.Typetsfunction useTemplateRef<T>(key: string): Readonly<ShallowRef<T | null>>Examplevue<script setup> import { useTemplateRef, onMounted } from 'vue' const inputRef = useTemplateRef('input') onMounted(() => { inputRef.value.focus() }) </script> <template> <input ref="input" /> </template>See alsoGuide - Template RefsGuide - Typing Template Refs Guide - Typing Component Template Refs useId() ​Used to generate unique-per-application IDs for accessibility attributes or form elements.Typetsfunction useId(): stringExamplevue<script setup> import { useId } from 'vue' const id = useId() </script> <template> <form> <label :for="id">Name:</label> <input :id="id" type="text" /> </form> </template>DetailsIDs generated by useId() are unique-per-application. It can be used to generate IDs for form elements and accessibility attributes. Multiple calls in the same component will generate different IDs; multiple instances of the same component calling useId() will also have different IDs.IDs generated by useId() are also guaranteed to be stable across the server and client renders, so they can be used in SSR applications without leading to hydration mismatches.If you have more than one Vue application instance of the same page, you can avoid ID conflicts by giving each app an ID prefix via app.config.idPrefix.Edit this page on GitHub'''
