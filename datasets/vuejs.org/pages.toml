["https://vuejs.org/about/community-guide"]
title = "Community Guide | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''Community Guide ​Vue's community is growing incredibly fast and if you're reading this, there's a good chance you're ready to join it. So... welcome!Now we'll answer both what the community can do for you and what you can do for the community.Resources ​Code of Conduct ​Our Code of Conduct is a guide to make it easier to enrich all of us and the technical communities in which we participate.Stay in the Know ​Follow our official Twitter account.Follow our team members on Twitter or GitHub.Follow the RFC discussions.Subscribe to the official blog.Get Support ​Discord Chat: A place for Vue devs to meet and chat in real time.Forum: The best place to ask questions and get answers about Vue and its ecosystem.DEV Community: Share and discuss Vue related topics on Dev.to.Meetups: Want to find local Vue enthusiasts like yourself? Interested in becoming a community leader? We have the help and support you need right here!GitHub: If you have a bug to report or feature to request, that's what the GitHub issues are for. Please respect the rules specified in each repository's issue template.Twitter Community (unofficial): A Twitter community, where you can meet other Vue enthusiasts, get help, or just chat about Vue.Explore the Ecosystem ​The Awesome Vue Page: See what other awesome resources have been published by other awesome people.Vue Telescope Explorer: Explore websites made with Vue, with insights on what framework / libraries they use.Made with Vue.js: showcases of projects and libraries made with Vue.The "Show and Tell" Subforum: Another great place to check out what others have built with and for the growing Vue ecosystem.What You Can Do ​Help Fellow Users ​Code contribution is not the only form of contribution to the Vue community. Answering a question for a fellow Vue user on Discord or the forum is also considered a valuable contribution.Help Triage Issues ​Triaging an issue means gathering missing information, running the reproduction, verifying the issue's validity, and investigating the cause of the issue.We receive many issues in our repositories on GitHub every single day. Our bandwidth is limited compared to the amount of users we have, so issue triaging alone can take an enormous amount of effort from the team. By helping us triage the issues, you are helping us become more efficient, allowing us to spend time on higher priority work.You don't have to triage an issue with the goal of fixing it (although that would be nice too). Sharing the result of your investigation, for example the commit that led to the bug, can already save us a ton of time.Contribute Code ​Contributing bug fixes or new features is the most direct form of contribution you can make.The Vue core repository provides a contributing guide, which contains pull request guidelines and information regarding build setup and high-level architecture. Other sub-project repositories may also contain its own contribution guide - please make sure to read them before submitting pull requests.Bug fixes are welcome at any time. For new features, it is best to discuss the use case and implementation details first in the RFC repo.Share (and Build) Your Experience ​Apart from answering questions and sharing resources in the forum and chat, there are a few other less obvious ways to share and expand what you know:Develop learning materials. It's often said that the best way to learn is to teach. If there's something interesting you're doing with Vue, strengthen your expertise by writing a blog post, developing a workshop, or even publishing a gist that you share on social media.Watch a repo you care about. This will send you notifications whenever there's activity in that repository, giving you insider knowledge about ongoing discussions and upcoming features. It's a fantastic way to build expertise so that you're eventually able to help address issues and pull requests.Translate Docs ​I hope that right now, you're reading this sentence in your preferred language. If not, would you like to help us get there?See the Translations guide for more details on how you can get involved.Become a Community Leader ​There's a lot you can do to help Vue grow in your community:Present at your local meetup. Whether it's giving a talk or running a workshop, you can bring a lot of value to your community by helping both new and experienced Vue developers continue to grow.Start your own meetup. If there's not already a Vue meetup in your area, you can start your own! Use the resources at events.vuejs.org to help you succeed!Help meetup organizers. There can never be too much help when it comes to running an event, so offer a hand to help out local organizers to help make every event a success.If you have any questions on how you can get more involved with your local Vue community, reach out on Twitter at @vuejs_events!Edit this page on GitHub'''
