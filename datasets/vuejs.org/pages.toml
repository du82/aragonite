["https://vuejs.org/guide/extras/web-components"]
title = "Vue and Web Components | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''Vue and Web Components ​Web Components is an umbrella term for a set of web native APIs that allows developers to create reusable custom elements.We consider Vue and Web Components to be primarily complementary technologies. Vue has excellent support for both consuming and creating custom elements. Whether you are integrating custom elements into an existing Vue application, or using Vue to build and distribute custom elements, you are in good company.Using Custom Elements in Vue ​Vue scores a perfect 100% in the Custom Elements Everywhere tests. Consuming custom elements inside a Vue application largely works the same as using native HTML elements, with a few things to keep in mind:Skipping Component Resolution ​By default, Vue will attempt to resolve a non-native HTML tag as a registered Vue component before falling back to rendering it as a custom element. This will cause Vue to emit a "failed to resolve component" warning during development. To let Vue know that certain elements should be treated as custom elements and skip component resolution, we can specify the compilerOptions.isCustomElement option.If you are using Vue with a build setup, the option should be passed via build configs since it is a compile-time option.Example In-Browser Config ​js// Only works if using in-browser compilation. // If using build tools, see config examples below. app.config.compilerOptions.isCustomElement = (tag) => tag.includes('-')Example Vite Config ​js// vite.config.js import vue from '@vitejs/plugin-vue' export default { plugins: [ vue({ template: { compilerOptions: { // treat all tags with a dash as custom elements isCustomElement: (tag) => tag.includes('-') } } }) ] }Example Vue CLI Config ​js// vue.config.js module.exports = { chainWebpack: (config) => { config.module .rule('vue') .use('vue-loader') .tap((options) => ({ ...options, compilerOptions: { // treat any tag that starts with ion- as custom elements isCustomElement: (tag) => tag.startsWith('ion-') } })) } }Passing DOM Properties ​Since DOM attributes can only be strings, we need to pass complex data to custom elements as DOM properties. When setting props on a custom element, Vue 3 automatically checks DOM-property presence using the in operator and will prefer setting the value as a DOM property if the key is present. This means that, in most cases, you won't need to think about this if the custom element follows the recommended best practices.However, there could be rare cases where the data must be passed as a DOM property, but the custom element does not properly define/reflect the property (causing the in check to fail). In this case, you can force a v-bind binding to be set as a DOM property using the .prop modifier:template<my-element :user.prop="{ name: 'jack' }"></my-element> <!-- shorthand equivalent --> <my-element .user="{ name: 'jack' }"></my-element>Building Custom Elements with Vue ​The primary benefit of custom elements is that they can be used with any framework, or even without a framework. This makes them ideal for distributing components where the end consumer may not be using the same frontend stack, or when you want to insulate the end application from the implementation details of the components it uses.defineCustomElement ​Vue supports creating custom elements using exactly the same Vue component APIs via the defineCustomElement method. The method accepts the same argument as defineComponent, but instead returns a custom element constructor that extends HTMLElement:template<my-vue-element></my-vue-element>jsimport { defineCustomElement } from 'vue' const MyVueElement = defineCustomElement({ // normal Vue component options here props: {}, emits: {}, template: `...`, // defineCustomElement only: CSS to be injected into shadow root styles: [`/* inlined css */`] }) // Register the custom element. // After registration, all `<my-vue-element>` tags // on the page will be upgraded. customElements.define('my-vue-element', MyVueElement) // You can also programmatically instantiate the element: // (can only be done after registration) document.body.appendChild( new MyVueElement({ // initial props (optional) }) )Lifecycle ​A Vue custom element will mount an internal Vue component instance inside its shadow root when the element's connectedCallback is called for the first time.When the element's disconnectedCallback is invoked, Vue will check whether the element is detached from the document after a microtask tick.If the element is still in the document, it's a move and the component instance will be preserved;If the element is detached from the document, it's a removal and the component instance will be unmounted.Props ​All props declared using the props option will be defined on the custom element as properties. Vue will automatically handle the reflection between attributes / properties where appropriate.Attributes are always reflected to corresponding properties.Properties with primitive values (string, boolean or number) are reflected as attributes.Vue also automatically casts props declared with Boolean or Number types into the desired type when they are set as attributes (which are always strings). For example, given the following props declaration:jsprops: { selected: Boolean, index: Number }And the custom element usage:template<my-element selected index="1"></my-element>In the component, selected will be cast to true (boolean) and index will be cast to 1 (number).Events ​Events emitted via this.$emit or setup emit are dispatched as native CustomEvents on the custom element. Additional event arguments (payload) will be exposed as an array on the CustomEvent object as its detail property.Slots ​Inside the component, slots can be rendered using the <slot/> element as usual. However, when consuming the resulting element, it only accepts native slots syntax:Scoped slots are not supported.When passing named slots, use the slot attribute instead of the v-slot directive:template<my-element> <div slot="named">hello</div> </my-element>Provide / Inject ​The Provide / Inject API and its Composition API equivalent also work between Vue-defined custom elements. However, note that this works only between custom elements. i.e. a Vue-defined custom element won't be able to inject properties provided by a non-custom-element Vue component.App Level Config ​You can configure the app instance of a Vue custom element using the configureApp option:jsdefineCustomElement(MyComponent, { configureApp(app) { app.config.errorHandler = (err) => { /* ... */ } } })SFC as Custom Element ​defineCustomElement also works with Vue Single-File Components (SFCs). However, with the default tooling setup, the <style> inside the SFCs will still be extracted and merged into a single CSS file during production build. When using an SFC as a custom element, it is often desirable to inject the <style> tags into the custom element's shadow root instead.The official SFC toolings support importing SFCs in "custom element mode" (requires @vitejs/plugin-vue@^1.4.0 or vue-loader@^16.5.0). An SFC loaded in custom element mode inlines its <style> tags as strings of CSS and exposes them under the component's styles option. This will be picked up by defineCustomElement and injected into the element's shadow root when instantiated.To opt-in to this mode, simply end your component file name with .ce.vue:jsimport { defineCustomElement } from 'vue' import Example from './Example.ce.vue' console.log(Example.styles) // ["/* inlined css */"] // convert into custom element constructor const ExampleElement = defineCustomElement(Example) // register customElements.define('my-example', ExampleElement)If you wish to customize what files should be imported in custom element mode (for example, treating all SFCs as custom elements), you can pass the customElement option to the respective build plugins:@vitejs/plugin-vuevue-loaderTips for a Vue Custom Elements Library ​When building custom elements with Vue, the elements will rely on Vue's runtime. There is a ~16kb baseline size cost depending on how many features are being used. This means it is not ideal to use Vue if you are shipping a single custom element - you may want to use vanilla JavaScript, petite-vue, or frameworks that specialize in small runtime size. However, the base size is more than justifiable if you are shipping a collection of custom elements with complex logic, as Vue will allow each component to be authored with much less code. The more elements you are shipping together, the better the trade-off.If the custom elements will be used in an application that is also using Vue, you can choose to externalize Vue from the built bundle so that the elements will be using the same copy of Vue from the host application.It is recommended to export the individual element constructors to give your users the flexibility to import them on-demand and register them with desired tag names. You can also export a convenience function to automatically register all elements. Here's an example entry point of a Vue custom element library:js// elements.js import { defineCustomElement } from 'vue' import Foo from './MyFoo.ce.vue' import Bar from './MyBar.ce.vue' const MyFoo = defineCustomElement(Foo) const MyBar = defineCustomElement(Bar) // export individual elements export { MyFoo, MyBar } export function register() { customElements.define('my-foo', MyFoo) customElements.define('my-bar', MyBar) }A consumer can use the elements in a Vue file:vue<script setup> import { register } from 'path/to/elements.js' register() </script> <template> <my-foo ...> <my-bar ...></my-bar> </my-foo> </template>Or in any other framework such as one with JSX, and with custom names:jsximport { MyFoo, MyBar } from 'path/to/elements.js' customElements.define('some-foo', MyFoo) customElements.define('some-bar', MyBar) export function MyComponent() { return <> <some-foo ... > <some-bar ... ></some-bar> </some-foo> </> }Vue-based Web Components and TypeScript ​When writing Vue SFC templates, you may want to type check your Vue components, including those that are defined as custom elements.Custom elements are registered globally in browsers using their built-in APIs, and by default they won't have type inference when used in Vue templates. To provide type support for Vue components registered as custom elements, we can register global component typings by augmenting the GlobalComponents interface for type checking in Vue templates (JSX users can augment the JSX.IntrinsicElements type instead, which is not shown here).Here is how to define the type for a custom element made with Vue:typescriptimport { defineCustomElement } from 'vue' // Import the Vue component. import SomeComponent from './src/components/SomeComponent.ce.vue' // Turn the Vue component into a Custom Element class. export const SomeElement = defineCustomElement(SomeComponent) // Remember to register the element class with the browser. customElements.define('some-element', SomeElement) // Add the new element type to Vue's GlobalComponents type. declare module 'vue' { interface GlobalComponents { // Be sure to pass in the Vue component type here // (SomeComponent, *not* SomeElement). // Custom Elements require a hyphen in their name, // so use the hyphenated element name here. 'some-element': typeof SomeComponent } }Non-Vue Web Components and TypeScript ​Here is the recommended way to enable type checking in SFC templates of Custom Elements that are not built with Vue.NOTEThis approach is one possible way to do it, but it may vary depending on the framework being used to create the custom elements.Suppose we have a custom element with some JS properties and events defined, and it is shipped in a library called some-lib:ts// file: some-lib/src/SomeElement.ts // Define a class with typed JS properties. export class SomeElement extends HTMLElement { foo: number = 123 bar: string = 'blah' lorem: boolean = false // This method should not be exposed to template types. someMethod() { /* ... */ } // ... implementation details omitted ... // ... assume the element dispatches events named "apple-fell" ... } customElements.define('some-element', SomeElement) // This is a list of properties of SomeElement that will be selected for type // checking in framework templates (f.e. Vue SFC templates). Any other // properties will not be exposed. export type SomeElementAttributes = 'foo' | 'bar' // Define the event types that SomeElement dispatches. export type SomeElementEvents = { 'apple-fell': AppleFellEvent } export class AppleFellEvent extends Event { /* ... details omitted ... */ }The implementation details have been omitted, but the important part is that we have type definitions for two things: prop types and event types.Let's create a type helper for easily registering custom element type definitions in Vue:ts// file: some-lib/src/DefineCustomElement.ts // We can re-use this type helper per each element we need to define. type DefineCustomElement< ElementType extends HTMLElement, Events extends EventMap = {}, SelectedAttributes extends keyof ElementType = keyof ElementType > = new () => ElementType & { // Use $props to define the properties exposed to template type checking. Vue // specifically reads prop definitions from the `$props` type. Note that we // combine the element's props with the global HTML props and Vue's special // props. /** @deprecated Do not use the $props property on a Custom Element ref, this is for template prop types only. */ $props: HTMLAttributes & Partial<Pick<ElementType, SelectedAttributes>> & PublicProps // Use $emit to specifically define event types. Vue specifically reads event // types from the `$emit` type. Note that `$emit` expects a particular format // that we map `Events` to. /** @deprecated Do not use the $emit property on a Custom Element ref, this is for template prop types only. */ $emit: VueEmit<Events> } type EventMap = { [event: string]: Event } // This maps an EventMap to the format that Vue's $emit type expects. type VueEmit<T extends EventMap> = EmitFn<{ [K in keyof T]: (event: T[K]) => void }>NOTEWe marked $props and $emit as deprecated so that when we get a ref to a custom element we will not be tempted to use these properties, as these properties are for type checking purposes only when it comes to custom elements. These properties do not actually exist on the custom element instances.Using the type helper we can now select the JS properties that should be exposed for type checking in Vue templates:ts// file: some-lib/src/SomeElement.vue.ts import { SomeElement, SomeElementAttributes, SomeElementEvents } from './SomeElement.js' import type { Component } from 'vue' import type { DefineCustomElement } from './DefineCustomElement' // Add the new element type to Vue's GlobalComponents type. declare module 'vue' { interface GlobalComponents { 'some-element': DefineCustomElement< SomeElement, SomeElementAttributes, SomeElementEvents > } }Suppose that some-lib builds its source TypeScript fil'''
