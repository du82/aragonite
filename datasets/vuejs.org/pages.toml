["https://vuejs.org/api/options-composition"]
title = "Options: Composition | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = '''Options: Composition ​provide ​Provide values that can be injected by descendant components.Typetsinterface ComponentOptions { provide?: object | ((this: ComponentPublicInstance) => object) }Detailsprovide and inject are used together to allow an ancestor component to serve as a dependency injector for all its descendants, regardless of how deep the component hierarchy is, as long as they are in the same parent chain.The provide option should be either an object or a function that returns an object. This object contains the properties that are available for injection into its descendants. You can use Symbols as keys in this object.ExampleBasic usage:jsconst s = Symbol() export default { provide: { foo: 'foo', [s]: 'bar' } }Using a function to provide per-component state:jsexport default { data() { return { msg: 'foo' } } provide() { return { msg: this.msg } } }Note in the above example, the provided msg will NOT be reactive. See Working with Reactivity for more details.See also Provide / Injectinject ​Declare properties to inject into the current component by locating them from ancestor providers.Typetsinterface ComponentOptions { inject?: ArrayInjectOptions | ObjectInjectOptions } type ArrayInjectOptions = string[] type ObjectInjectOptions = { [key: string | symbol]: | string | symbol | { from?: string | symbol; default?: any } }DetailsThe inject option should be either:An array of strings, orAn object where the keys are the local binding name and the value is either: The key (string or Symbol) to search for in available injections, orAn object where: The from property is the key (string or Symbol) to search for in available injections, andThe default property is used as fallback value. Similar to props default values, a factory function is needed for object types to avoid value sharing between multiple component instances.An injected property will be undefined if neither a matching property nor a default value was provided.Note that injected bindings are NOT reactive. This is intentional. However, if the injected value is a reactive object, properties on that object do remain reactive. See Working with Reactivity for more details.ExampleBasic usage:jsexport default { inject: ['foo'], created() { console.log(this.foo) } }Using an injected value as the default for a prop:jsconst Child = { inject: ['foo'], props: { bar: { default() { return this.foo } } } }Using an injected value as data entry:jsconst Child = { inject: ['foo'], data() { return { bar: this.foo } } }Injections can be optional with default value:jsconst Child = { inject: { foo: { default: 'foo' } } }If it needs to be injected from a property with a different name, use from to denote the source property:jsconst Child = { inject: { foo: { from: 'bar', default: 'foo' } } }Similar to prop defaults, you need to use a factory function for non-primitive values:jsconst Child = { inject: { foo: { from: 'bar', default: () => [1, 2, 3] } } }See also Provide / Injectmixins ​An array of option objects to be mixed into the current component.Typetsinterface ComponentOptions { mixins?: ComponentOptions[] }DetailsThe mixins option accepts an array of mixin objects. These mixin objects can contain instance options like normal instance objects, and they will be merged against the eventual options using the certain option merging logic. For example, if your mixin contains a created hook and the component itself also has one, both functions will be called.Mixin hooks are called in the order they are provided, and called before the component's own hooks.No Longer RecommendedIn Vue 2, mixins were the primary mechanism for creating reusable chunks of component logic. While mixins continue to be supported in Vue 3, Composable functions using Composition API is now the preferred approach for code reuse between components.Examplejsconst mixin = { created() { console.log(1) } } createApp({ created() { console.log(2) }, mixins: [mixin] }) // => 1 // => 2extends ​A "base class" component to extend from.Typetsinterface ComponentOptions { extends?: ComponentOptions }DetailsAllows one component to extend another, inheriting its component options.From an implementation perspective, extends is almost identical to mixins. The component specified by extends will be treated as though it were the first mixin.However, extends and mixins express different intents. The mixins option is primarily used to compose chunks of functionality, whereas extends is primarily concerned with inheritance.As with mixins, any options (except for setup()) will be merged using the relevant merge strategy.Examplejsconst CompA = { ... } const CompB = { extends: CompA, ... }Not Recommended for Composition APIextends is designed for Options API and does not handle the merging of the setup() hook.In Composition API, the preferred mental model for logic reuse is "compose" over "inheritance". If you have logic from a component that needs to be reused in another one, consider extracting the relevant logic into a Composable.If you still intend to "extend" a component using Composition API, you can call the base component's setup() in the extending component's setup():jsimport Base from './Base.js' export default { extends: Base, setup(props, ctx) { return { ...Base.setup(props, ctx), // local bindings } } }Edit this page on GitHub'''
