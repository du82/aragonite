["https://vuejs.org/api/compile-time-flags"]
title = "Compile-Time Flags | Vue.js"
description = "Vue.js - The Progressive JavaScript Framework"
full_description = "Compile-Time Flags ​TIPCompile-time flags only apply when using the esm-bundler build of Vue (i.e. vue/dist/vue.esm-bundler.js).When using Vue with a build step, it is possible to configure a number of compile-time flags to enable / disable certain features. The benefit of using compile-time flags is that features disabled this way can be removed from the final bundle via tree-shaking.Vue will work even if these flags are not explicitly configured. However, it is recommended to always configure them so that the relevant features can be properly removed when possible.See Configuration Guides on how to configure them depending on your build tool.__VUE_OPTIONS_API__ ​Default: trueEnable / disable Options API support. Disabling this will result in smaller bundles, but may affect compatibility with 3rd party libraries if they rely on Options API.__VUE_PROD_DEVTOOLS__ ​Default: falseEnable / disable devtools support in production builds. This will result in more code included in the bundle, so it is recommended to only enable this for debugging purposes.__VUE_PROD_HYDRATION_MISMATCH_DETAILS__ ​Default: falseEnable/disable detailed warnings for hydration mismatches in production builds. This will result in more code included in the bundle, so it is recommended to only enable this for debugging purposes.Only available in 3.4+Configuration Guides ​Vite ​@vitejs/plugin-vue automatically provides default values for these flags. To change the default values, use Vite's define config option:js// vite.config.js import { defineConfig } from 'vite' export default defineConfig({ define: { // enable hydration mismatch details in production build __VUE_PROD_HYDRATION_MISMATCH_DETAILS__: 'true' } })vue-cli ​@vue/cli-service automatically provides default values for some of these flags. To configure /change the values:js// vue.config.js module.exports = { chainWebpack: (config) => { config.plugin('define').tap((definitions) => { Object.assign(definitions[0], { __VUE_OPTIONS_API__: 'true', __VUE_PROD_DEVTOOLS__: 'false', __VUE_PROD_HYDRATION_MISMATCH_DETAILS__: 'false' }) return definitions }) } }webpack ​Flags should be defined using webpack's DefinePlugin:js// webpack.config.js module.exports = { // ... plugins: [ new webpack.DefinePlugin({ __VUE_OPTIONS_API__: 'true', __VUE_PROD_DEVTOOLS__: 'false', __VUE_PROD_HYDRATION_MISMATCH_DETAILS__: 'false' }) ] }Rollup ​Flags should be defined using @rollup/plugin-replace:js// rollup.config.js import replace from '@rollup/plugin-replace' export default { plugins: [ replace({ __VUE_OPTIONS_API__: 'true', __VUE_PROD_DEVTOOLS__: 'false', __VUE_PROD_HYDRATION_MISMATCH_DETAILS__: 'false' }) ] }Edit this page on GitHub"
