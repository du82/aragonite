["https://vulnhub.com/faq"]
title = "Frequently Asked Questions ~ VulnHub"
full_description = "Below are different methods for Linux, OSX & Windows to calculate the checksum value of a file. We will use 'metasploitable-linux-2.0.0.zip' in the examples below. Depending on the virtual machine, that's the aim of it! You gain access to the system, with the highest user privilege you can reach, usually by exploiting a service running on the machine. Giving you the user credentials would defeat the purpose of the exercise. This isn't always the case, some machines have local challenges which require you to login locally. If this is the case, the username & password would be mentioned in the README file. Such machines are: 'Damn Vulnerable Linux' & 'Exploit-Exercises'. A 'virtual machine (VM)', is the simulation of a machine (called the 'guest') that is running inside another machine (the 'host'). The 'guest' machine uses the 'hosts' system resources to create a virtual environment, which allows for multiple machines to be created and running at the same time. These machines behave as close as possible to a 'real' instance. Depending on the virtualization software, the virtual machine could use 'hypothetical specifications' or emulate the host's hardware. These machines can be integrated with a virtual network or interact with an existing network. Both Virtualbox and VMware use different virtual machine formats, but each support the 'Open Virtualization Format'. However, you can be at risk of breaking a virtual machine by doing so. The reason for this is that there may be a 'new' network card attached (as each VM solution uses a different virtual network card). Because a different interface will be active, it may conflict with the setup script of the machine (inside the VM itself) that the author created. It really depends on how the original author designed the machine. All the virtual machines can be converted, however, some will function correctly, others will not. Maybe at a later date, this is something VulnHub will look into documenting. In the following example, we will move a 'Windows 7' VM from Virtualbox 4.2.4 to VMware Player 5 & Workstation 9, on a windows host. To do so, we will use 'OVF Tool', which comes pre-installed with VMware player, fusion & workstaion. You can find the homepage of the tool here. The basic method/principle is the same when the host OS is Linux or OSX."
