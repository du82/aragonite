rums.hackingdojo.com/viewtopic.php?f=18&t=16 Original filename: de-ice-2.100-1.0.iso Also known as 'De-ICE Level 2 - Disk 1' Description × This section is for various information that has been collected about the release, such as quotes from the webpage and/or the readme file. These sources of information are usually helpful towards the completion of the release as the author can drop hints* as well as methods to help get the release up and working. * This is a 'little' hint. Useful to help you get started and it shouldn't give anything away that you quickly could find out for yourself."
