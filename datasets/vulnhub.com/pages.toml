description = "Metasploitable: 1, made by Metasploit. Download & walkthrough links are available."
full_description = '''Description Back to the Top One of the questions that we often hear is "What systems can i use to test against?" Based on this, we thought it would be a good idea throw together an exploitable VM that you can use for testing purposes. Metasploitable is an Ubuntu 8.04 server install on a VMWare 6.5 image. A number of vulnerable packages are included, including an install of tomcat 5.5 (with weak credentials), distcc, tikiwiki, twiki, and an older mysql. You can use most VMware products to run it, and you'll want to make sure it's configured for Host-only networking unless it's in your lab - no need to throw another vulnerable machine on the corporate network. It's configured in non-persistent-disk mode, so you can simply reset it if you accidentally 'rm -rf' it. Source: http://web.archive.org/web/20100525233058/http://blog.metasploit.com/2010/05/introducing-metasploitable.html Description × This section is for various information that has been collected about the release, such as quotes from the webpage and/or the readme file. These sources of information are usually helpful towards the completion of the release as the author can drop hints* as well as methods to help get the release up and working. * This is a 'little' hint. Useful to help you get started and it shouldn't give anything away that you quickly could find out for yourself.'''
