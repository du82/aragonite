title = "Vulture - About Us"
description = "Vulture is a New York Magazine site providing continuous entertainment news."
full_description = "About Us Vulture was founded in 2007 as an entertainment-and-culture outlet of New York providing an authentic, relatable experience for pop-culture fans — which is to say, caring disproportionately about great (and not great) entertainment and the people who create it. Launched with a focus on TV recaps and general Hollywood news, the site has grown into a destination where visitors can find comprehensive coverage of TV, movies, music, art, books, theater, comedy, podcasts, among other media and pursuits, all delivered with wit, insight, criticism, and the appropriate amount of appreciation. Along the way, Vulture evolved and expanded. The first annual Vulture Festival was held in New York City in 2014, inaugurating a pop-culture franchise that brings the website to life. The Vulture TV Podcast premiered in 2015, marking the brand’s entry into audio and establishing a show portfolio that now features Good One: A Podcast About Jokes and Switched on Pop. In 2018, Vulture and New York acquired the comedy site Splitsider, formerly part of the Awl Network, cementing Vulture as the authority on the subject. In 2022, the site debuted the entertainment-infused “Vulture 10x10,” a daily crossword tailored to its audience of pop-culture obsessives. New York Magazine, including Vulture, was a finalist for the National Magazine Award for General Excellence (News, Sports, and Entertainment) in 2019, 2020, and 2022, and Vulture was part of New York’s submission for its 2018 National Magazine Award win for Best Website. Vulture and New York’s have produced two recipients of the Pulitzer Prize for Criticism, with art critic Jerry Saltz winning the award in 2018 and critic Andrea Long Chu in 2023; additionally, our pop-music critic Craig Jenkins was a finalist in 2021. Saltz’s writing for Vulture and New York also won the National Magazine Award for Leisure Interests in 2019 and for Columns and Commentary in 2015. Vulture critic Angelica Jade Bastién was a finalist for the National Magazine Award in Essays and Criticism in 2022, along with features writer E. Alex Jung in Profile Writing. Vulture’s commitment to guiding its readers through the progress of modern fandom has remained unchanged: It strives to help them discover entertainment they might enjoy; provide them with reporting, criticism, and insights that will deepen their understanding; compel them to argue about it online; and then recommend more entertainment for them to devour. If you want to pitch stories, guidelines on how to do so can be found here. Since 2019, New York has been a part of Vox Media, the leading modern media company, whose portfolio features nearly 20 popular and influential editorial properties, including (in addition to the New York brands): Vox, Eater, NowThis, SB Nation, The Dodo, and The Verge. The Vox Media Podcast Network is one of the largest collections of popular podcasts spanning technology, news, pop culture, emerging trends, and more. Vox Media Studios is the award-winning nonfiction production and distribution studio for multiple TV and streaming partners. Subscribe to New York here. Sign up for our newsletters and follow Vulture on Instagram, Twitter, and Facebook. Vulture Editors Editor-in-chief Name Neil Janowitz Twitter Deputy Editor Name Katy Brooks Twitter Features Editor Name Megh Wright Twitter Managing Editor Name Anusha Praturu TV Editor (Long Lead) Name Julie Kosin Twitter TV Editor (Short Lead) Name Genevieve Koski Twitter TV Recaps Editor Name Nic Juarez Twitter Movies Editor Name Melissa León Twitter Music Editor Name Alex Suskind Twitter News Editor Name Morgan Baila Twitter Deputy News Editor Name Zoë Haylock Twitter Recommendations Editor Name Ray Rahman Twitter Deputy Recommendations Editor Name Emily Palmer Heller Twitter Streamliner Editor Name Eric Vilas-Boas Twitter Multimedia Editor Name Anne Clark Twitter Instagram Updates Editor Name Tolly Wright Twitter Associate Editor Name Savannah Salazar Twitter Editorial Producer, Cinematrix Name Britina Cheng New York Culture Pages Culture Editor Name Tomi Obaro Twitter Features Editor Name Dee Lockett Twitter Critics Critic Name Angelica Jade Bastién Twitter TV Critic Name Jen Chaney Twitter Instagram Book Critic Name Andrea Long Chu Twitter Movie Critic Name Bilge Ebiri Twitter TV Critic Name Roxana Hadadi Twitter Theater Critic Name Sara Holdren Twitter Music Critic Name Craig Jenkins Twitter Critic Name Jackson McHenry Twitter Instagram Facebook Critic Name Nicholas Quah Twitter Art Critic Name Jerry Saltz Instagram Critic Name Kathryn VanArendonk Twitter Movie Critic Name Alison Willmore Twitter Writers West Coast Editor Name Josef Adalian Twitter Staff Writer Name Rebecca Alter Twitter News Writer Name Justin Curto Twitter News Writer Name Jason Frank Twitter News Blogger Name Alejandra Gularte Twitter Features Writer Name Rachel Handler Twitter Senior News Writer Name Fran Hoepfner Twitter Staff Writer Name Devon Ivie Twitter Senior Writer Name Nate Jones Twitter Facebook Features Writer Name E. Alex Jung Twitter Senior Reporter Name Chris Lee Twitter Comedy Reporter Name Hershal Pandya Twitter Features Writer Name Matt Zoller Seitz Twitter Features Writer Name Lila Shapiro Twitter News Blogger Name Bethy Squires Twitter News Blogger Name Jennifer Zhan Twitter Podcasts Host, Good One: A Podcast About Jokes Name Jesse David Fox Twitter Instagram Facebook Host, Switched on Pop Name Charlie Harding Twitter Host, Switched on Pop Name Nate Sloan Twitter Social Media Social Media Editor Name Bailey Kircher Twitter Instagram"
