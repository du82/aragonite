["https://www.vulture.com/article/gene-hackman-dead-wife-dog.html"]
title = "What Do We Know About Gene Hackman’s Death So Far?"
description = "Police are investigating after Gene Hackman was found dead with signs of decomposition, along with his wife and dog, in their Santa Fe home.  After initial carbon monoxide tests and an examination of Hackman’s pacemaker, the cause is still unknown."
full_description = '''rip Updated Feb. 28, 2025 Gene Hackman, Academy Award–Winning Actor, Dead at 95 By Jason P. Frank, a Vulture writer covering comedy, theater, and music Gene Hackman. Photo: Warner Brothers/Getty Images Movie star Gene Hackman, his wife, Betsy Arakawa, and their dog were all found dead on February 26, per the New York Times. Hackman was 95 and Arakawa was 64. The Santa Fe County Police said there were no immediately apparent signs of foul play, but details surrounding the circumstances of their deaths remain under open investigation. Hackman will be remembered as one of the great actors of his time. He was one of just 45 performers in cinema history to win two acting Oscars, one for Best Actor and one for Best Supporting Actor, and he received three other nominations. He additionally won four Golden Globe Awards, including the Lifetime Achievement Cecil B. DeMille Award in 2003. Hackman was born in San Bernardino, California, in 1930, and enlisted in the U.S. Marine Corps at 16, lying about his age. While in the military, Hackman worked as a broadcast journalist, before being discharged in 1951. He began his acting career at the Pasadena Playhouse in 1956, which went poorly. “I had the all-time lowest score of students from the Playhouse,” he told the Chicago Tribune in 1986. “I was given so little encouragement that I kind of, even in my insensitive state at that time, understood that at least the academic side of acting was not for me.” He then moved to New York, where he, along with his friends Dustin Hoffman and Robert Duvall, slowly began their part of the revolutionary new cinematic world of the 1960s and ’70s. Hackman’s breakout role was as Buck Barrow in 1967’s Bonnie and Clyde, a controversial movie at the time, but which garnered him an Academy Award nomination for Best Supporting Actor. He was nominated again, in the same category, for 1970’s I Never Sang for My Father, before finally winning Best Actor the next year for his work as Jimmy “Popeye” Doyle in William Friedkin’s The French Connection. “As Popeye Doyle, he generated an almost frightening single-mindedness, a cold determination to win at all costs, which elevated the stakes in the story from a simple police cat-and-mouse chase into the acting-out of Popeye’s pathology,” Roger Ebert wrote of his performance. He was nominated for Best Actor again in 1988, for Mississippi Burning, and won Best Supporting Actor for Clint Eastwood’s Unforgiven in 1991, which also won Best Picture. Hackman’s last great role was as the patriarch in Wes Anderson’s 2001 classic The Royal Tenenbaums. He retired soon after. “The straw that broke the camel’s back was actually a stress test that I took in New York,” Hackman told Empire in 2009. “The doctor advised me that my heart wasn’t in the kind of shape that I should be putting it under any stress.” Below, what investigators know so far about the deaths of Gene Hackman and Betsy Arakawa, updating with additional information as available. Gene Hackman, wife, and dog found dead February 27, 2025, 10:30 a.m.: Hackman, Arakawa, and a dog were all found dead in their home in Santa Fe, New Mexico, on February 26 by the Santa Fe County Police Department, according to a New York Times report. The cause of death is under investigation, though foul play is not suspected. “He was loved and admired by millions around the world for his brilliant acting career, but to us he was always just Dad and Grandpa. We will miss him sorely and are devastated by the loss,” Hackman’s children from a previous marriage, Elizabeth and Leslie, and granddaughter Annie said in a statement to the BBC. “Suspicious” circumstances prompt investigation February 27, 2025, 5:00 p.m.: Police are officially investigating the deaths of Hackman and Arakawa. Hackman was found dead by the police in the mudroom of their home, per a search warrant, published by the New York Times, from Santa Fe County Police detective Roy Arndt. Arakawa was found on the bathroom floor, with pills scattered on the counter near her, alongside an open prescription bottle. One of their dogs, a German shepherd, was found dead in the bathroom closet. Their other two other dogs were found alive on the property. Police say there’s no sign of a gas leak or carbon monoxide poisoning at this time. While the day Hackman and Arakawa died is unknown, their bodies showed similar signs of decomposition. “It sounds like they had been deceased for quite a while, and I don’t want to guess in reference to how long that was,” sheriff Adan Mendoza said at a press conference that afternoon, per the BBC. Mendoza also confirmed the bodies were found in the afternoon on February 26. While “there was no immediate sign of foul play,” the police “haven’t ruled that out yet.” Hackman and wife test negative for carbon monoxide, likely date of death identified February 28, 2025, 7:20 p.m.: Initial carbon monoxide tests of both Hackman and Arakawa’s bodies have come back negative, Santa Fe County Sheriff Adam Mendoza said in a press conference. According to Mendoza, Hackman likely died on February 17, given that his pacemaker recorded “his last event” on that date, more than a week before his body was discovered on February 26. The carbon monoxide tests and initial examination of Hackman’s pacemaker were expedited; Mendoza said it could take “a month or three months or longer” for final toxicology and autopsy reports to be completed. Related Michelle Trachtenberg, Buffy and Gossip Girl Star, Reportedly Dead at 39 Roberta Flack, Formative Quiet-Storm Singer, Dead at 88 Notorious B.I.G.’s Mother, Voletta Wallace, Dead at 78 Tags: gene hackman mississippi burning the royal tenenbaums the french connection unforgiven i never sang for my father bonnie and clyde news movies film rip celebrity More Show Leave a Comment Gene Hackman, Academy Award–Winning Actor, Dead at 95 const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'vulture'; const keywords = ["gene hackman","mississippi burning","the royal tenenbaums","the french connection","unforgiven","i never sang for my father","bonnie and clyde","news","movies","film","rip","celebrity"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
