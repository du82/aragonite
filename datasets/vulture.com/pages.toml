["https://www.vulture.com/article/book-adaptations-tv-movie-2025.html"]
title = "Every Book Adapted Into a TV Show or Movie in 2025"
description = "All of the books you should read in 2025 before you see the movie and TV-show adaptations, including ‘Mickey 17,’ ‘The Electric State,’ and a George R.R. Martin short story."
full_description = 'vulture lists Updated 11:30 A.M. 28 Book-to-Screen Adaptations to Add to Your 2025 Reading List By Emily Maskell, a freelance writer who covers entertainment and pop culture Robert Pattinson in Mickey 17. Photo: Warner Bros. The New Year is the perfect time to refresh your bookshelf and reading list with the many highly anticipated page-to-screen adaptations coming in 2025. Filmmakers and showrunners are drawing from contemporary hits (The Night Agent) and enduring classics (A Study in Scarlet) for exciting new shows and movies. From spy thrillers to witchy dramas to action-packed comics, the sources of these adaptations are well worth a read before you watch. March Syllabus Mickey 7, by Edward Ashton $15 $19 now 21% off $15 Mickey Barnes, desperate to leave Earth, agrees to be a disposable clone worker on an expedition to colonize the planet Niflheim. Whenever the crew faces a deadly mission, they call upon Mickey. Each time his cloned self dies fulfilling one of these tasks, a new body regenerates with the same memories. However, when one clone is presumed dead and a new version is generated, the two expendable clones’ existence overlaps, causing an existential rift in Mickey’s universe. Mickey 17, starring Robert Pattinson, Naomi Ackie, and Steven Yeun, is in cinemas starting March 7. $15 at Amazon Buy $15 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Mickey 7, by Edward Ashton","image":"https://pyxis.nymag.com/v1/imgs/92a/3bd/68290feaff6b49e9013172c2183690f595-mickey17book.png","brand":{"@type":"Brand","name":"Griffin"},"offers":[{"@type":"Offer","price":15,"priceCurrency":"USD","url":"https://www.amazon.com/dp/1250875285?tag=vulture-20&ascsubtag=__vu0301aam__cm574f4mn000n0ih42gctft3y__258513________________"}],"offerCount":1} “In the Lost Lands,” by George R. R. Martin (collected in Amazons II, edited by Jessica Salmonson) $25 $25 The powerful witch Gray Alys is ordered by the queen to venture into the Lost Lands to find a magic spell that will allow a person to shapeshift. Mysterious hunter Boyce joins Gray on the daring quest that involves battling supernatural creatures. All the while, both Gray and the queen are harboring deep and dark secrets, the consequences of which prove to be devastating. In the Lost Lands, starring Dave Bautista, Milla Jovovich, and Arly Jover, is set for release on March 7. $25 at Amazon Buy $25 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"“In the Lost Lands,” by George R. R. Martin (collected in Amazons 2, edited by Jessica Salmonson)","image":"https://pyxis.nymag.com/v1/imgs/543/4ec/239df8266a55548e18a8264eff38c922d8-amazongs2-book.jpg","brand":{"@type":"Brand","name":"DAW"},"offers":[{"@type":"Offer","price":24.99,"priceCurrency":"USD","url":"https://www.amazon.com/Amazons-II-Jessica-Amanda-Salmonson/dp/0879977361/ref=sr_1_1?crid=29GD1A3GRDELG&dib=eyJ2IjoiMSJ9.41Wg7p54A2lxDIw4TWnUHkS_KVFuTpur50xZMokeof2NvAL907dt6GmDUiSTh_3nAlIvHAVlzOsh20Pw2TwZO_9dbSG2LUgRO6gh7WDKCmRhPTD7hCEvII5ALN4NxD-4oJeaIDKnngGKhFGeuCPl0w.EvJhs-97qIYsfPbSqlbOyaYkVFyhe-oYXcR86Nmzmjg&dib_tag=se&keywords=Amazons+II+Jessica+Amanda+Salmonson&qid=1736608231&sprefix=amazons+ii+jessica+amanda+salmonson%2Caps%2C150&sr=8-1&tag=vulture-20&ascsubtag=__vu0301aam__cm574f4mn000n0ih42gctft3y__258514________________"}],"offerCount":1} The Electric State, by Simon Stålenhag $20 $40 now 50% off $20 In a futuristic past, orphaned teenager Michelle has one goal: find her long-lost brother. On her journey across the country to the West Coast, she is accompanied by a small yellow toy robot named Skip. The pair travel through deserted American landscapes littered with discarded technology from a now absent high-consumption society. However, she’s not the only one looking for her brother; a suspicious federal agent is also tracking down the young man. The Electric State, starring Millie Bobby Brown, Chris Pratt, and Ke Huy Quan, is on Netflix on March 14. $20 at Amazon Buy $20 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"The Electric State, by Simon Stålenhag","image":"https://pyxis.nymag.com/v1/imgs/d66/e31/664392aae70f97ef8eefbf11d3f0052498-electricstate.png","brand":{"@type":"Brand","name":"Skybound Books"},"offers":[{"@type":"Offer","price":20,"priceCurrency":"USD","url":"https://www.amazon.com/dp/1501181416?tag=vulture-20&ascsubtag=__vu0301aam__cm574f4mn000n0ih42gctft3y__258516________________"}],"offerCount":1} Dope Thief, by Dennis Tafoya $18 $18 Two Philadelphia friends, Ray and Manny, pose as federal narcotics officers to steal from houses. Their robberies grow into a bustling enterprise as they loot small-time dealers, stealing money and drugs. However, their scheme is threatened when one hit turns out to be a huge narcotics operation. This mark has the means and resources to come after them and won’t give up until they retrieve what was stolen. Dope Thief, starring Brian Tyree Henry, Wagner Moura, and Marin Ireland, is scheduled to premiere on Apple TV+ on March 14. $18 at Amazon Buy $18 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Dope Thief, by Dennis Tafoya","image":"https://pyxis.nymag.com/v1/imgs/19d/e11/da9464cffce5ae4a3990619e901c397489-dopethief-book.png","brand":{"@type":"Brand","name":"Minotaur Books"},"offers":[{"@type":"Offer","price":18,"priceCurrency":"USD","url":"https://www.amazon.com/Dope-Thief-Dennis-Tafoya/dp/1250413567/ref=tmm_pap_swatch_0?_encoding=UTF8&dib_tag=se&dib=eyJ2IjoiMSJ9.-wX8M2_IuCFOrHjbgTr6Uw.h3zPmP9cZzEXcc_7Pujm4An8ZIMpQLcBao7CikMrPiQ&qid=1737539895&sr=8-1&tag=vulture-20&ascsubtag=__vu0301aam__cm574f4mn000n0ih42gctft3y__258517________________"}],"offerCount":1} Snow White, by the Brothers Grimm $15 $18 now 17% off $15 Snow White is set to grace our screens as a live-action reimagining of the 1937 Snow White and the Seven Dwarfs animated film, itself based on the Brothers Grimm fairy tale. This 2025 Snow White endeavours to modernize the classic tale of a wicked queen cursing Snow White to fall into a slumber that she can only be woken from by true love’s kiss. In this new iteration, it’s the plucky heroine who chooses her destiny. Snow White, starring Rachel Zegler, Andrew Burnap, and Gal Gadot, is scheduled to be released in theaters on March 21. $15 at Amazon Buy $15 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Snow White, by the Brothers Grimm","image":"https://pyxis.nymag.com/v1/imgs/105/b18/d5cb120287312a0ab0b24ec24d9da64e63-snowwhite-book.png","brand":{"@type":"Brand","name":"Northsouth Books"},"offers":[{"@type":"Offer","price":15,"priceCurrency":"USD","url":"https://www.amazon.com/dp/1558581324?tag=vulture-20&ascsubtag=__vu0301aam__cm574f4mn000n0ih42gctft3y__258518________________"}],"offerCount":1} Also coming in March ➼ The Queen of the Ring: Sex, Muscles, Diamonds, and the Making of an American Legend, by Jeff Leen: The film charts Mildred Burke’s rise from waitress to champion wrestler (even fighting male wrestlers) at a time when all-girl wrestling was banned in most of America. Queen of the Ring debuts in theaters on March 7. ➼ When Nobody Sees Us, by Sergio Sarrias: At a U.S. Army base in southern Spain, a series of crimes — where suicides are deemed suspicious and soldiers go missing — disturb Holy Week celebrations. This Spanish show premieres on Max on March 7. ➼ Long Bright River, by Liz Moore: When police officer Kacey’s sister disappears and a string of murders devastate her Philadelphia neighborhood, she becomes set on hunting down the culprit before it’s too late. The show will premiere on Peacock on March 13. ➼ Levon’s Trade, by Chuck Dixon: Ex-military construction worker Levon Cade must draw on his black-ops past when his boss’s daughter is kidnapped. A Working Man is in theaters on March 28. ➼ The Friend, by Sigrid Nunez: When a teacher loses her closest friend, she’s saddled with not only the grief but also his huge, beloved Great Dane named Apollo. Her apartment doesn’t allow pets, but she can’t let Apollo leave her side. The film is in theaters on March 28. ➼ The Penguin Lessons, by Tom Michell: An English teacher’s life changes when he rescues an orphaned penguin against the backdrop of the 1976 Argentine coup d’état. The film is in theaters on March 28. February Syllabus The Woman Who Fooled the World, by Beau Donelly and Nick Toscano $25 $25 Belle Gibson is a star of the wellness world after she healed herself of terminal brain cancer through “clean eating.” With her friend Milla, the 23-year-old has a meteoric rise and builds an international media empire. Her story is incredible. Or, it would be, if it was real. Belle has been lying to her friends, family, business partners, and audience about her diagnosis. When a journalist starts to uncover the truth behind the fraudulent story, Belle’s empire crumbles. Apple Cider Vinegar, starring Kaitlyn Dever, Alycia Debnam-Carey, and Aisha Dee, premieres on Netflix on February 6. $25 at Amazon Buy $25 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"The Woman Who Fooled the World, by Beau Donelly and Nick Toscano","brand":{"@type":"Brand","name":"Unknown"},"offers":[{"@type":"Offer","price":25,"priceCurrency":"USD","url":"https://www.amazon.com/dp/1925322467?tag=vulture-20&ascsubtag=__vu0301aam__cm574f4mn000n0ih42gctft3y__256675________________"}],"offerCount":1} My Fault, by Mercedes Ron $9 $13 now 31% off $9 This enemies-to-lovers romance follows teenage Noah as she moves from America to London with her mom to live with her billionaire stepfather and stepbrother Nick. The new stepsiblings are at odds with each other. Nick embodies everything Noah hates, yet there’s an undeniable spark of attraction between them. They enter a forbidden romance, but dangerous ghosts of Noah’s past come back to haunt her and threaten the new life she’s made. My Fault: London, starring Asha Banks, Matthew Broome, and Ray Fearon, is streaming on Prime Video on February 13. $9 at Amazon Buy $9 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"My Fault, by Mercedes Ron","brand":{"@type":"Brand","name":"Bloom Books"},"offers":[{"@type":"Offer","price":9,"priceCurrency":"USD","url":"https://www.amazon.com/dp/1728290732?tag=vulture-20&ascsubtag=