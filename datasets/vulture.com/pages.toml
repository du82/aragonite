title = "Adam Sandler Joins SNL50 to Make Everyone Cry"
description = "On ‘SNL’s 50th-anniversary special, the Sandman sure knows how to get comedy nerds’ waterworks going. And how to make Kanye West rethink his antisemitism, apparently."
full_description = '''snl50 Updated Feb. 20, 2025 Adam Sandler Joins SNL50 to Make Everyone Cry By Jesse David Fox, a Vulture senior writer and author of Comedy Book The song for SNL50 may have had an unintended consequence: breaking Kanye West’s latest antisemitism streak. The Sandman is also the Cryman February 16: After a couple decades specializing in making giant, broad comedy movies, over the last few years, Adam Sandler has developed a new speciality: bittersweet songs about how comedians are a force for good in the world. There is his song about Chris Farley he played when hosted SNL in 2019. And there’s “Here Comes the Comedy,” the song that closed his most recent special about how, in the face of death and endless misery, at least we can laugh at comedy. So, of course, he had a song for SNL50. It’s a tribute to how bad it is working at SNL and yet how lucky people are to work there. The song ends with Sandler just listing cast members and how long they were on the show for and, damn, the Sandman knows how to get comedy nerds’ waterworks going. Kanye says thanks February 19: Once again, a Jewish comedian has seemingly made Kanye West walk back antisemitic statements. Kanye West tweeted “After further reflection I’ve come to the realization that I’m not a Nazi” hours after thanking Adam Sandler for the shoutout on SNL. Ye was referring to the section in Sandler’s song where he says “50 years of learning your favorite musician is antisemitic.” How do we know that’s to what he was referring? He RT’d the clip. https://t.co/S3aS3sEFhP pic.twitter.com/6LQxUwEogi— GoodAssSub (@GoodAssSub) February 19, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); This is the second time a comedic actor has prompted West to rethink being a nazi. In 2023, he attributed a decline in his antisemitism to Jonah Hill’s acting. Specifically his work in 21 Jump Street. “No Christian can be labeled antisemite knowing Jesus is Jew,” he wrote on Instagram. “Thank you Jonah Hill I love you.” Related Every Single Thing That Happened at SNL50 SNL Has Always Been Bad Tags: snl50 snl saturday night live comedy tv adam sandler kanye west More Show Leave a Comment Adam Sandler Joins SNL50 to Make Everyone Cry const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'vulture'; const keywords = ["snl50","snl","saturday night live","comedy","tv","adam sandler","kanye west"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
