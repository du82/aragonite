["https://www.vulture.com/article/2025-oscar-nominated-movies-streaming-watch.html"]
title = "Where to Watch the 2025 Oscar Nominated Movies (Full List)"
description = "Ahead of Sunday night’s Academy Awards, here’s where to watch every one of the nominated movies — from the big screen to your laptop."
full_description = 'vulture lists Updated Feb. 28, 2025 How to Watch and Stream All the Oscar Contenders This Year By Brian Tallerico, a film critic with over 20 years of experience covering movies and TV. He is the president of the Chicago Film Critics Association, the co-producer of the Chicago Critics Film Festival, and managing editor of RogerEbert.com. Starting today, Nickel Boys, “a cinematic experience unlike any other,” is streaming on MGM+. Photo: Amazon MGM Studios This article is updated regularly as Oscar contenders enter theaters and streaming services. The Oscars are almost here! On Sunday night, the Academy will award the best films, performances, and craft of 2024. This year’s nominations are led by a stunning 13 nods for Emilia Pérez. What’s everyone’s big question as we eagerly await to see who takes home the prizes this weekend? Where can I see these movies? With so many streaming services and companies taking different paths to bring their A-list projects to viewers, it can be overwhelming work to simply track down the next potential Best Picture winner. We’re here to help with detailed information on the streaming availability of every single feature nominee. Don’t plan to leave the house for a few weeks. How to Watch the Ten Best Picture Nominees . Anora Also nominated for Best Director, Best Actress, Best Supporting Actor, Best Original Screenplay, and Best Achievement in Film Editing { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "NEON", "contentUrl": "https://pyxis.nymag.com/v1/imgs/fbc/f40/46b04446c3c0659f2a66d8ad35f4334a96-anora-ending.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: NEON The Awards Chatter: It started with the Palme d’Or at 2024’s Cannes, a prize won by recent Oscar darlings like Anatomy of a Fall, Triangle of Sadness, and Parasite. The latest from the genius behind Tangerine and The Florida Project brought Sean Baker back into the Oscar fold with six major nominations, including Best Picture. How to Watch It: Available to rent or own on demand; streaming on Hulu March 17. . The Brutalist Also nominated for Best Director, Best Actor, Best Actress, Best Supporting Actor, Best Supporting Actress, Best Original Screenplay, Best Achievement in Cinematography, Best Achievement in Film Editing, Best Achievement in Production Design { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Focus Features, Universal Pictures", "contentUrl": "https://pyxis.nymag.com/v1/imgs/8ef/613/b80ac0db012225f85568cd1febdb9d20c9-thebrutalist.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Focus Features, Universal Pictures The Awards Chatter: The second-most nominated film of Oscar morning got to double digits because of its remarkable ensemble and technical achievements. The epic drama starring Adrien Brody as a Hungarian architect in postwar America started its run at Venice, where it won the Silver Lion, and went through waves of critics groups (it won Best Picture at Chicago, for example). It was a big winner at the Globes, taking home Best Picture (Drama), Actor, and Director. And now it looks to repeat with the Academy. How to Watch It: Available to rent or own on demand. . A Complete Unknown Also nominated for Best Director, Best Actor, Best Supporting Actress, Best Supporting Actor, Best Adapted Screenplay, Best Achievement in Costume Design, Best Sound { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Macall Polay/Searchlight", "contentUrl": "https://pyxis.nymag.com/v1/imgs/8ff/78a/46302914bfb38a0151b2af86463a1fcb04-a-complete-unknown.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Macall Polay/Searchlight The Awards Chatter: The Academy loves biopics, and that didn’t change this year with a surprising number of nominations for this story of an essential chapter in music history. Timothée Chalamet landed his second nomination for playing Bob Dylan in James Mangold’s acclaimed drama about the folk-music legend, joined by Edward Norton and Monica Barbaro as Pete Seeger and Joan Baez, respectively. How to Watch It: Available to rent or own on demand. . Conclave Also nominated for Best Actor, Best Supporting Actress, Best Adapted Screenplay, Best Achievement in Film Editing, Best Achievement in Production Design, Best Achievement in Costume Design, Best Original Score { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Focus Features", "contentUrl": "https://pyxis.nymag.com/v1/imgs/2e3/93c/cc51fa7c757967e551ec43157ae8612e00-conclave.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Focus Features The Awards Chatter: This papal drama launched its way through awards season, notching citations from every major group on its way to a bunch of big Oscar nods, including Ralph Fiennes, Isabella Rossellini, and Peter Straughan for Best Adapted Screenplay. It’s one of the few Best Picture nominees this year that doesn’t (mostly) seem to make some people mad. How to Watch It: Peacock. . Dune: Part Two Also nominated for Best Achievement in Cinematography, Best Achievement in Visual Effects, Best Achievement in Production Design, Best Sound { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Warner Bros.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/813/94b/aae10d6884720ed59a21add7adbb3aaad0-dune-review.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Warner Bros. The Awards Chatter: The first Dune in this series landed ten Oscar nominations, winning six, more than any other film from 2022. Part Two didn’t exactly replicate that success, likely hurt by being released so early in 2024. Still, it found its way across the awards season desert yet again. Will the third film do the same? Don’t doubt the spice. How to Watch It: Max. . Emilia Pérez Also nominated for Best Director, Best Actress, Best Supporting Actress, Best International Feature Film, Best Achievement in Makeup and Hairstyling, Best Original Score, Best Original Song (x2), Best Sound, Best Adapted Screenplay, Best Achievement in Cinematography, Best Achievement in Film Editing { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Shanna Besson", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ac8/069/67157bd613dc2dbe3220957c6ef7e279b4-selena-gomez.2x.rhorizontal.w700.png", "width": "1400", "height": "934" } } Photo: Shanna Besson The Awards Chatter: One of the most divisive films of the year remains an awards-season juggernaut, landing as many Oscar nominations as Oppenheimer did last year and falling one short of tying the all-time record. The Jacques Audiard–directed musical-crime film’s run actually started much earlier, when it won three prizes at Cannes, including a special joint Best Actress award for stars Karla Sofía Gascón, Selena Gomez, Adriana Paz, and Zoe Saldaña. How to Watch It: Netflix. . I’m Still Here Also nominated for Best Actress, Best International Feature Film { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Sony Pictures/Everett Collection", "contentUrl": "https://pyxis.nymag.com/v1/imgs/06c/ff7/a4ed7268163568c920ccb350db46d65c56-Im-Still-Here.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Sony Pictures/Everett Collection The Awards Chatter: The phenomenal Fernanda Torres was a surprising but deserving winner of the Golden Globe for Best Actress (Drama) for this devastating story of a woman dealing with the disappearance of her husband by the Brazilian government. A deeply personal project for Torres, it co-stars her mother, Fernande Montenegro, herself an Oscar nominee for 1998’s Central Station, also directed by Walter Salles. How to Watch It: In limited theatrical release. . Nickel Boys Also nominated for Best Adapted Screenplay { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Amazon MGM Studios", "contentUrl": "https://pyxis.nymag.com/v1/imgs/011/f25/b689999bb5743009ae02cb25e175d49400-nickel-boys-6.2x.rhorizontal.w700.png", "width": "1400", "height": "934" } } Photo: Amazon MGM Studios The Awards Chatter: An adaptation of Colson Whitehead’s celebrated novel, this RaMell Ross drama has been a critical darling since its fest-season debuts. Nickel Boys won Best Director at Gotham and the New York Film Critics Circle before landing five Critics Choice nods, including Best Picture, and two Independent Spirit nominations. It only got one Golden Globe nomination, but it was a biggie: Best Picture. And it continued that odd trend at the Oscars, getting only two nods, but one was the big one. How to Watch It: MGM+. . The Substance Also nominated for Best Actress, Best Director, Best Original Screenplay, Best Achievement in Makeup and Hairstyling { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "MUBI", "contentUrl": "https://pyxis.nymag.com/v1/imgs/272/108/9c6f62cd73d5c339c993383e47d3bc9ea1-mubi-substance.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: MUBI The Awards Chatter: It’s hard to believe this was the film that broke through the Academy’s blind spot when it comes to horror, but we’re happy it did. The Demi Moore–starring film has been a stronger-than-predicted performer all year, all the way back to a Best Screenplay win at Cannes in May 2024. It then rolled its bloody carcass through the season, including a memorable win for Demi Moore at the Golden Globes. It ultimately felt like the Oscars couldn’t ignore it. How to Watch It: Mubi. . Wicked Also nominated for Best Actress, Best Supporting Actress, Best Original Score, Best Achievement in Makeup and Hairstyling, Best Achievement in Film Editing, Best Achievement in Production Design, Best Achievement in Costume Design, Best Sound, Best Achievement in Visual Effects { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Universal Pictures", "contentUrl": "https://pyxis.nymag.com/v1/imgs/22b/e95/c02975484e0a8fa9458840c95eb6af5de9-wicked-review.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Universal Pictures The Awards Chatter: Can the biggest movie on this list also be a major Oscars player? Definitely. Don’t doubt this witch this season. The crowd favorite of this year’s awards should help boost the ratings. It’s easily the most widely beloved film on this list. Ariana Grande fans alone can move the needle. How to Watch It: Available to rent or own on demand; streaming on Peacock March 21. How to Watch the Rest of the 2025 Oscar Nominees . Alien: Romulus Nominated for Best Achievement in Visual Effects { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Walt Disney/Everett Collection", "contentUrl": "https://pyxis.nymag.com/v1/imgs/24c/931/05168ee57795affc1dd63d04002f4b27a1-alien-romulus.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Walt Disney/Everett Collection Fede Alvarez’s hit reboot of one of the most popular franchises of all time notched a visual effects nomination that’s probably more for the creatures than the janky resurrection of a certain character from a past movie. How to Watch It: Hulu. . The Apprentice Nominated for Best Actor, Best Supporting Actor { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Pief Weyman/Briarcliff Entertainment/Everett Collection", "contentUrl": "https://pyxis.nymag.com/v1/imgs/259/7c1/9a6b1d338666cd44c13a03b0b533360b01-apprentice-goldrush.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Pief Weyman/Briarcliff Entertainment/Everett Collection The performances by Sebastian Stan as Donald J. Trump and Jeremy Strong as Roy Cohn were too much for the Academy to ignore this twisted origin story of a monster. How to Watch It: Available to rent or own on demand. . Better Man Nominated for Best Achievement in Visual Effects { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Paramount Pictures", "contentUrl": "https://pyxis.nymag.com/v1/imgs/4b2/dcc/bd980b3afcb9632150b61de3b2439d8456-BM-FF-0080.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Paramount Pictures While news stories keep touting how much money Paramount lost on this unique Robbie Williams biopic, they can now comfort themselves by knowing they at least got an Oscar nomination out of the deal. How to Watch It: Available to rent or own on demand. . Black Box Diaries Nominated for Best Documentary { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Paramount+", "contentUrl": "https://pyxis.nymag.com/v1/imgs/653/c68/e50e8ec4cd5c84829533fc93f53f268c5a-black-box-diaries.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Paramount+ This is a harrowing true story of a sexual assault investigation in Japan that launched at Sundance almost exactly a year before its Oscar nomination. How to Watch It: Paramount+. . A Different Man Nominated for Achievement in Makeup and Hairstyling { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "A24", "contentUrl": "https://pyxis.nymag.com/v1/imgs/7ed/c82/4143f0053933527b8089570282829acab3-a-different-man.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: A24 Another Sundance debut, some thought this clever film would appear in more categories on Oscar morning, but it didn’t go home completely empty-handed. How to Watch It: Max. . Elton John: Never Too Late Nominated for Best Original Song { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Disney+", "contentUrl": "https://pyxis.nymag.com/v1/imgs/736/808/5462d2a7aed9c06acd9ad5613458b439e7-elton-john-never-too-late.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Disney+ A documentary about the life of Elton John that features a new song by Sir Elton himself is almost a lock for Best Original Song. How to Watch It: Disney+. . Flow Nominated for Best Animated Feature, Best International Feature Film { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Janus Films", "contentUrl": "https://pyxis.nymag.com/v1/imgs/c15/bd8/67da951e018adfcf0600e55b3f260428d7-flow-movie-lede.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Janus Films Gints Zilbalodis’s dialogue-free gem has been one of the most awarded animated films of its e'
