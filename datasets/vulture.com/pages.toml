title = "Is Elon Musk Going on The Daily Show?"
description = "Is Elon Musk going to debate Jon Stewart on The Daily Show? Stewart spent much of his time Monday criticizing Musk’s DOGE program."
full_description = '''last night on late night Feb. 26, 2025 Is Elon Musk Going on The Daily Show? By Bethy Squires, a Vulture reporter Photo: Comedy Central/YouTube Elon Musk and The Daily Show are having a Debate Me-off on Twitter. After Jon Stewart spent the lion’s share of Monday’s TDS episode slagging off Musk and his DOGE program, the Elon stans took to Musk’s social media platform demanding an exchange in the marketplace of ideas. Musk replied to a post titled “Elon Musk Should Go On Jon Stewart’s Daily Show,” saying “I will do it if the show airs unedited.” The Daily Show’s account then RT’d, “.@elonmusk we’d be delighted!” .@elonmusk we’d be delighted! https://t.co/thMOOeLpeZ— The Daily Show (@TheDailyShow) February 26, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); Now, will this actually happen? Let’s look at the Elon Musk promises of yore and make some inferences. Musk said he’d end world hunger, he did not. Musk said he’d rescue the soccer team trapped in that cave, he did not. Then he called one of the people who did rescue the kids a “pedo.” However, Musk said he’d buy Twitter, and he bought Twitter. So it’s a toss-up. Stewart’s critiques were harsh, to say the least. He broke a mug and cut his hand mid-rant, that’s how impassioned he was. Per Stewart, DOGE is slapdash and pointless. Many of the people who were fired were already reinstated, and every decision has been made with haste and justified with misinformation. “We’re getting fucked at a Diddy party,” he said, “and they’re making us buy the baby oil.” Related Jon Stewart: Skip the Takeaways and Get to Work Late Night Braces for Trump 2.0 Tags: last night on late night the daily show the daily show with jon stewart tv comedy elon musk trump 2.0 More Show Leave a Comment Is Elon Musk Going on The Daily Show? const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'vulture'; const keywords = ["last night on late night","the daily show","the daily show with jon stewart","tv","comedy","elon musk","trump 2.0"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
