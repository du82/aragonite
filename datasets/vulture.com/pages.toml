title = "Every 2025 Oscar-Nominated Movie, Ranked"
description = "We ranked every film nominated for at least one Academy Award — all 50 features, shorts, documentaries, and international films, from Tyler Perry’s ‘The Six Triple Eight’ to Brady Corbet’s ‘The Brutalist.’"
full_description = "gold rush Feb. 28, 2025 Every Movie Nominated for a 2025 Oscar, Ranked By Joe Reid, who has been covering movies and pop culture since 2007 Keeping pace with Hollywood’s perpetual awards horserace. Sign up for the newsletter here. Keeping pace with Hollywood’s perpetual awards horserace. Sign up for the newsletter here. Photo-Illustration: Vulture; Photos: Everett Collection (Warner Bros., Searchlight Pictures, Janus Films, Walt Disney Studios) Calling 2024 a year of change and trepidation in Hollywood would be an understatement. But through the lens of the 50 films nominated for at least one Academy Award this year — features, shorts, documentaries, and international films — the film industry is still humming with talent. This is on balance a very strong Oscar year. While a ranking is necessarily an occasion to exalt the greatest and shame the worst, with very few exceptions there’s something to like in every single one of these films, and a few of them even hit greatness. As I do every year, I have somehow evaluated and contrasted 50 films of widely divergent types, genres, intended audiences, and essential vibes. These are apples, oranges, bananas, and pomegranates (and one sacred fig), and yet I have settled on this definitive order of quality. (Now, let me rearrange the middle third of the list one more time before we get going.) 50. The Six Triple Eight Tyler Perry’s first Oscar-nominated movie arrives on the back of Diane Warren’s latest Best Original Song nomination. “The Journey” sounds like a warmed-over (and less lyrically ambitious) “The Climb,” but it’s over in under four and a half minutes. The Six Triple Eight, however, is 128 minutes of hokey dialogue, two-dimensional characterizations, and Susan Sarandon as Eleanor Roosevelt wearing false teeth straight out of a Party City going-out-of-business sale. The real women of the 6888th Central Postal Directory Battalion — the only all-Black women’s army battalion sent overseas during World War II, and who we see at the end of the movie in real-life footage — deserved a portrayal of depth, nuance, and insight. They’re still waiting for one. 49. Elton John: Never Too Late Directed by: R.J. Cutler, David FurnishNominations: (1) Best Original Song The Oscars have largely steered the Best Documentary Feature category away from the self-serving celebrity-autobiography docs that have sprung up everywhere on streaming platforms, but the songwriters could not be stopped from throwing out another nod to Elton John and Bernie Taupin (and Brandi Carlisle and Andrew Watt). I’m more lenient than most when it comes to these movies, especially when they accidentally reveal something of their subjects by virtue of how they choose to manicure their own image. But Elton John already had that version of his biography, in the dishy and revealing Tantrums and Tiaras from 1997 (also directed by Furnish, John’s longtime partner). Never Too Late addresses John’s thoughts on aging and passing things along to the next generation, but it never really justifies itself as a film in its own right. 48. Beautiful Men Directed by: Nicolas KeppensNominations: (1) Best Animated Short I’m always saying I would like the short-film nominees to not be so dependent on weighty themes, and then when a movie about three brothers seeking hair transplants in Turkey comes along, I rank it low. But I just couldn’t find a second gear with this one, which plays like if Force Majeure had lower stakes and no women. There’s some comedy in there, but all the laughs are so blunted by a determined melancholy that nothing really lands. Lotta penises in this one, though! 47. Alien: Romulus Directed by: Fede ÁlvarezNominations: (1) Best Visual Effects If you somehow thought the Alien franchise was far too subtle with its phallic and vaginal imagery up to this point, Romulus is the movie for you. When he’s not busy letting the facehuggers hang dong, Álvarez seems to position this movie as the Rogue One of the greater Alien franchise. And while there’s a welcome griminess to this film, the characterizations all feel pretty limp. And that’s not even getting into the AI abomination that this movie does to the soul (and visage) of the late Ian Holm. 46. Inside Out 2 Directed by: Kelsey MannNominations: (1) Best Animated Feature The original Inside Out was great, a clear highlight amid an uneven (at best) last decade for Pixar. But even Inside Out’s biggest fans can admit the movie was already barely hanging onto its internal logic of personality elements working as an uneasy team to create a child’s psyche. The sequel’s attempt to up the ante and break down this now 13-year-old girl’s personality into ever-more-specific components (Anxiety! Envy! Ennui!) is utter folly, and the harder the film works to make it make sense, the less time it has to tell a compelling story. Perhaps appropriately (if unfortunately), Inside Out 2 can’t get out of its own head. 45. I’m Not a Robot Directed by: Victoria WarmerdamNominations: (1) Best Live Action Short The Oscar-nominated shorts tend to be a rather heavy lot. So often, a film that’s lighter in subject matter will feel like a welcome relief. That ought to have been the case for I’m Not a Robot, a lightly comedic mini–Black Mirror where an office worker’s struggles with a CAPTCHA present her with the seemingly ludicrous notion that she is, in fact, a robot. But what ensues is neither hilarious nor ludicrous, just sort of lightly strange, leading to an ending that amounts to a shrug. 44. Gladiator II Directed by: Ridley ScottNominations: (1) Best Costume Design Despite its Best Picture triumph at the Oscars 24 years ago, the original Gladiator was a big, silly spectacle that took itself incredibly seriously, what with its Elysian fields of wheat and Russell Crowe growling about avenging his wife and child. Gladiator II is an even sillier spectacle and takes itself quite a bit less seriously. From one perspective, that’s an improvement on the original. Too bad it looks demonstrably worse in almost every way. Paul Mescal is handed the unenviable task of having to live up to Crowe’s larger-than-life Maximus, while Pedro Pascal kind of hangs out superfluously on the periphery. There is plenty of fun to be had with Denzel Washington’s peacocking villain (or … is he?) Macrinus, not to mention Joseph Quinn and Fred Hechinger as a pair of fancy-lad co-emperors, but there’s only so far a silly little pet monkey can take a film. 43. Maria Directed by: Pablo LarraínNominations: (1) Best Cinematography Recognizing only Ed Lachman’s gorgeous cinematography for Maria is a very “great gowns, beautiful gowns” way to honor this movie, but Lachman truly is the film’s MVP. Pablo Larraín couldn’t get a third Best Actress nomination out of his triptych of biopics about isolated 20th-century women, after Jackie’s Natalie Portman and Spencer’s Kristen Stewart. Angelina Jolie isn’t the problem here so much as the fact that Larraín doesn’t seem to have a distinct take on Maria Callas at all. 42. Emilia Pérez Directed by: Jacques AudiardNominations: (13) Best Picture, Best Director, Best Actress, Best Supporting Actress, Best Adapted Screenplay, Best International Feature, Best Original Score, Best Original Song x2, Best Sound, Best Cinematography, Best Makeup and Hairstyling, Best Film Editing So here’s the thing … this is a movie that is very French. Before it’s a movie about a transgender cartel leader whose attempts to launder her life of murder and mayhem are complicated by increasingly possessive feelings about her ex-wife and children, it is a movie that is French. Before it’s a musical without any memorable songs, it is a movie that is French. It doesn’t excuse anything, and the people speaking out about how this film misrepresents everyone from trans people to Mexicans aren’t wrong to do so. But, again, this is a French movie that values audacity above all, while dabbling in subject matter and genres it doesn’t understand well enough to make that audacity mean anything. 41. The Last Ranger Directed by: Cindy LeeNominations: (1) Best Live Action Short Certain live-action shorts (the ones that get nominated for the Oscar, at least) feel like a feature-length movie boiled down to The Moment That Changes Everything. Because of the time constraints, you see the moment coming a mile away and it all starts to feel a bit airless. Such, unfortunately, is the case with The Last Ranger, a film about a ranger and her young protégé on a South African game reserve who are suddenly set upon by rhino poachers. Avumile Qongqo is compelling as the ranger, which takes the film a long way, even as it rolls into its inevitable harrowing conclusion. 40. Kingdom of the Planet of the Apes Directed by: Wes BallNominations: (1) Best Visual Effects Oscar voters can’t get enough of this franchise, having nominated Rise, Dawn, War, and now Kingdom all for the VFX award. It is, indeed, impressive motion-capture work. But as each successive film attempts to world-build out from Caesar and his teachings about ape solidarity — heavy with allegory though they are — they start to blend together. It’s sturdy craftsmanship, even as the storytelling makes less and less of an impact. 39. Anuja Directed by: Adam J. GravesNominations: (1) Best Live Action Short Mindy Kaling’s producer credit got a lot of attention when this was announced as a nominee, and its Netflix distribution also likely helped spur its awards campaign along. The film itself, about a 9-year-old girl in New Delhi who works in a garment factory and is given the opportunity to attend a school instead, veers between a compelling portrait of two sisters who have to face life-changing decisions far too young and a more airy, almost storybook directorial vision. It works sometimes, but not always, and keeps the story at more of an arm’s length than it should. 38. In the Shadow of the Cypress Directed by: Hossein Molayemi, Shirin SohaniNominations: (1) Best Animated Short In this sparse Iranian short, an old man lives with his daughter along the sea; one day, a whale beaches near them. While the daughter tries to save it, the father struggles with his PTSD from his days as a ship captain. Directors Molayemi and Sohani have said that the short is a tribute to veterans of the Iran-Iraq war in the 1980s, and while the film trades on some of the tropes familiar to annual viewers of the animated shorts — no dialogue, incongruously weighty themes — it all comes to a moving and ethereal conclusion. 37. Better Man Directed by: Michael GraceyNominations: (1) Best Visual Effects The music biopic may well be the single most stale genre in all of filmmaking; a recitation of rise-and-fall beats that could be mapped out on the back of a child’s placemat at Denny’s. This Britpop bio about Robbie Williams purports to turn the whole genre on its ear by having Williams voice the lead role himself but appear as a CGI monkey. The problem is, monkey or no, Better Man still marches through those same biopic paces, leaning heavily on the star’s One Fatal Flaw (he hates himself!) as he self-destructs his way through fame and fortune before emerging a wiser and more reflective man. Gracey injects some admirable energy into some of the musical sequences — the “Rock DJ” number is big and colorful and full of dancing — but can’t pull Williams’ life story out of a well-worn cliché. 36. Memoir of a Snail Directed by: Adam ElliotNominations: (1) Best Animated Feature When I say that this movie is the A Little Life of stop-motion animation, know that I’m far closer to meaning that literally than I would like to be. Adam Elliot’s movie is, to its credit, a fully realized vision, expressively animated and featuring nimble vocal performances by Sarah Snook and Jacki Weaver. It is also so incredibly bleak, careening its main character from one tragic, devastating circumstance to the next, and at some point that cruelty stops feeling meaningful. 35. Death by Numbers View this post on Instagram A post shared by Death By Numbers - The Film (@deathbynumbersthefilm) Directed by: Kim A. SnyderNominations: (1) Best Documentary Short The macabre prevalence of school shootings in modern American society has become a recurring theme for Oscar-nominated shorts (including the 2021 Animated Short winner If Anything Happens I Love You and the 2017 Live Action nominee DeKalb Elementary). This film pairs the grim reality of the sentencing of the Parkland school shooter with the poetic resilience of one of his victims, Sam Fuentes. While the filmmakers give Fuentes ample space to articulate her grief, rage, and attempts to find perspective, their grappling with bigger-picture issues like the judicial process for a case like this prove to be more elusive. 34. Magic Candies Directed by: Daisuke NishioNominations: (1) Best Animated Short Stories of solitary kids with big imaginations are the bread and butter of Oscar-nominated animated shorts. But if Magic Candies doesn’t break new ground with its tale of a Japanese boy who likes to play with marbles, it at least revels in its plot twist: When the boy buys a bag of marble-shaped candies instead, and eats them, things like the sofa and the family dog start talking to him. Yes, it’s a movie about a little kid tripping balls, but it’s also rich and colorful and about seeing the world differently. 33. A Lien Directed by: David Cutler-Kreutz, Sam Cutler-KreutzNominations: (1) Best Live Action Short An American couple and their young child hustle to make it to the immigration office so the husband — Salvadoran by birth but raised in the United States as far back as he can remember — can undergo his green-card interview. Once there, the office is raided by ICE, and the panicked couple struggle to keep their family from being ripped apart. The pertinence of this story to current events will likely be the first thing anyone focuses on, and rightly so, but the directors also deserve credit for the film’s tightly coiled, deeply felt terror, panic, and betrayal. 32. The Apprentice Directed by: Ali AbbasiNominations: (2) Best Actor, Best Supporting Actor If we’re going to be stuck with the guy as president for [terrified to even put a number on it] more years anyway, there might as well be a movie that forgoes a grandiose, Citizen Kane–style origin story and instead shows public menace Donald Trump as sprung from the bronzed forehead of maniac narcissist Roy Cohn. Sebastian Stan and especially Jeremy Strong are unsparing in their portrayals of two men who nourished themselves on the forced domination of the world around them, depicted in the ugly video resolution of 1980s America. 31. Wicked Directed by: Jon M. ChuNominations: (10) Best Picture, Best Actress, Best Supporting Actress, Best Original Score, Best Sound, Best Production Design, Best Makeup and Hairstyling, Best Costume Design, Best Film Editing, Best Visual Effects As the 2025 Oscar nominee with the most fan enthusiasm behind"
