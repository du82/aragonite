full_description = 'song review Lizzo Is in Limbo On “Love in Real Life,” she struggles to change her narrative. By Craig Jenkins movie review Last Breath Is, Well, Breathtaking This underwater-survival thriller, based on a real-life 2012 deep-sea diving incident, is worth seeing on a big screen while you can. By Bilge Ebiri theater review Dakar 2000 Is a Tense and Unstable Thriller It falls short of wild combustible invention but also stops shy of absolute historical fidelity. By Jackson McHenry theater review Feb. 27, 2025 Dakar 2000 Is a Tense and Unstable ThrillerIt falls short of wild combustible invention but also stops shy of absolute historical fidelity. By Jackson McHenry tv review Feb. 27, 2025 We Were Too Hard on Winning TimeRunning Point extends Jeanie Buss’s Lakers branding to a forgettable Netflix sitcom. By Nicholas Quah theater review Feb. 26, 2025 Overexposition: On the Evolutionary Function of ShameA script that tries to do a lot of explaining. By Sara Holdren close read Feb. 26, 2025 Love Is Blind Can’t Keep Up With the DiscourseSeason eight is stuck in the same superficial relationship to social media it finds so concerning for its participants. By Kathryn VanArendonk theater review Feb. 25, 2025 This Curse of the Starving Class Doesn’t Have Much in Its FridgeAnd a sheep is the star of the show. By Jackson McHenry what am i lemon a father? Feb. 25, 2025 The Baldwins Is Grimmer Than You ImaginedEveryone involved with this should be ashamed. By Kathryn VanArendonk theater review Feb. 24, 2025 Idaho, and What Came After: Samuel D. Hunter’s GrangevilleThe playwright best known for The Whale turns a critical eye on the art he’s made about his hometown. By Sara Holdren book review Feb. 24, 2025 Chimamanda Ngozi Adichie’s Frustrating ReturnHer new novel Dream Count suffers from the retrograde gender politics and bad writing that has defined her career of late. By Sanjena Sathian theater review Feb. 23, 2025 Dispatches From the Apocalypse: Safe House and The BarbariansTwo plays that, fitfully and incompletely, get at this moment’s dread. By Sara Holdren movie review Feb. 22, 2025 The Monkey Has Good Kills, But No SoulThe latest Osgood Perkins movie, adapted from a Stephen King story, is a fine diversion — if you ignore the gaping hole at its center. By Angelica Jade Bastién close read Feb. 21, 2025 Let’s Call That Severance “Love Triangle” What It WasDoppelgänger sexual assault is nothing new in fiction. Neither is the reluctance to engage with male victims’ responses to it. By Ben Rosenstock movie review Feb. 21, 2025 Daisy Ridley’s Die Hard Knockoff, Cleaner, Has Some Fun Action But Little ElseNot even veteran action-master Martin Campbell (Casino Royale, GoldenEye) can’t fix this dopey script. By Bilge Ebiri theater review Feb. 20, 2025 Liberation Is the Best Play I’ve Seen This SeasonBess Wohl’s latest is drawn from the true stories of her mother’s 1970s encounter group. By Sara Holdren tv review Feb. 20, 2025 Not Now, Zero DayA vestigial limb of the Resistance era, the Netflix political thriller clings to a version of the status quo that no longer exists. By Roxana Hadadi close read Feb. 20, 2025 The White-Power Fantasy of ReacherThe streaming juggernaut fronts as wallpaper TV, but its uncanny fiction is anything but easygoing. By Angelica Jade Bastién close read Feb. 19, 2025 Closure With The KardashiansA blatant nostalgia play presented as an emotional reunion confirms that reality TV’s most famous family has outgrown their chosen medium. By Tom Smyth album review Feb. 18, 2025 Drake Is in His Reputation EraBut his new album does more than just settle scores. By Craig Jenkins movie review Feb. 15, 2025 With Mickey 17, Bong Joon Ho Offers a Bitterly Funny Take on AmericaRobert Pattinson plays an immortal drudge and Mark Ruffalo gives sci-fi Trump in the new film from the director of Parasite. By Alison Willmore movie review Feb. 14, 2025 Questlove’s Sly Lives! Is a Revealing Portrait of the Hazards of GeniusYou walk out of Sly Lives! feeling like you’ve genuinely learned something, but you also walk out exhilarated. By Bilge Ebiri hammer of the gods Feb. 14, 2025 Becoming Led Zeppelin Isn’t Trying to Tell the Whole StoryA thoroughly researched documentary blessed by control freaks who still can’t, or won’t, wrestle with the less flattering parts of the band’s history. By Brady Gerber movie review Feb. 14, 2025 The Best Movie at Cannes Last Year Is Finally in TheatersMatthew Rankin’s Universal Language feels warm and familiar even as we realize just how startlingly original it is. By Bilge Ebiri just as you are Feb. 14, 2025 Bridget Jones ForeverAs long as Bridget Jones lives, we should be allowed to tag along for the ride. By Fran Hoepfner the cog you are Feb. 14, 2025 Ricken Got Lumon-edThe self-help author’s shift from naysayer to bootlicker reveals what the Severance corporation actually produces. By Roxana Hadadi movie review Feb. 14, 2025 Paddington in Peru Bites Off More Than It Can ChewFortunately, adorable talking bears have big appetites. By Alison Willmore tv review Feb. 14, 2025 Subsisting on ScrapsYellowjackets saves the juiciest meat for its ’90s story line, leaving characters in the present day starved for attention. By Roxana Hadadi art review Feb. 14, 2025 The Exhilarating Anger of Christine Sun KimHer new show at the Whitney reveals that language is a social currency that constantly places the deaf at a disadvantage. By Jerry Saltz theater review Feb. 13, 2025 All Bark, No Bite: RedwoodIdina Menzel grieves in a tree and leaves. By Sara Holdren theater review Feb. 12, 2025 A Henry IV That Doesn’t Know Its Own StrengthThis play has underappreciated muscles that its director intermittently flexes. By Sara Holdren close read Feb. 12, 2025 For God’s Sake, Let’s Talk About a Different MovieFor months, cinephiles have claimed to find substance in a certain body-horror movie. I am politely asking you to look elsewhere. By Angelica Jade Bastién movie review Feb. 12, 2025 Marvel Is Now a Giant Slop MachineThe messy and tiresome Captain America: Brave New World has a few ideas, but it handles them in the most shallow, simplistic ways. By Bilge Ebiri movie review Feb. 12, 2025 It’s Honestly Really Nice to Get Older With Bridget JonesIn Mad About the Boy, Renée Zellweger’s chaotic singleton has finally learned to love herself. By Alison Willmore close read Feb. 11, 2025 Netflix’s Witcher Universe Keeps ShrinkingAn enjoyable attempt to win back lapsed fans, the new animated movie Sirens of the Deep still feels like a dead end for the once-expansive franchise. By Scott Meslow tv review Feb. 11, 2025 The White Lotus Knows What You’re Here ForSeason three finds Mike White’s series in full franchise mode, most defined by what came before. By Kathryn VanArendonk movie review Feb. 10, 2025 Horizon Will Be a Monumental Achievement — If Kevin Costner Can Finish ItThe latest installment of Kevin Costner’s four-part western epic is darker and more intimate than the first. By Bilge Ebiri an urgent plea Feb. 10, 2025 When Fans Love a Movie to DeathOscar contenders and Sundance breakthroughs alike are suffering at the hands of the people who want to see them the most. By Alison Willmore theater review Feb. 7, 2025 Urinetown Is Still PotableWhoa, there! Plenty of prescience reveals itself in Encores!’s revival of the 2001 musical. By Jackson McHenry movie review Feb. 7, 2025 The Horror Comedy Is the Genre of Our MomentAnd Heart Eyes is funny and gory enough to fit the bill. By Alison Willmore movie review Feb. 7, 2025 The Michelle Yeoh Star Trek TV Movie Just Doesn’t Have the JuiceIt’s almost cruel to compare Star Trek: Section 31 to the series Deep Space Nine, which created its core concept. By Angelica Jade Bastién movie review Feb. 7, 2025 Does Love Hurts Even Count As a Movie?If you can’t make the fight scenes interesting in a film that’s nothing but fight scenes, what have you got? By Bilge Ebiri surprise? Feb. 7, 2025 Let’s Discuss Severance’s Big ‘Twist’If you can even call it that. By Kathryn VanArendonk movie review Feb. 7, 2025 A Woman Is a Woman and the Legend of Anna KarinaJean-Luc Godard’s second released feature — a magnificent and bizarre “neorealist musical” — is back in theaters in a 4K restoration. By Bilge Ebiri art review Feb. 7, 2025 Caspar David Friedrich’s Lonely IslandsA retrospective at the Met captures the German romanticist’s epic melancholy. By Jerry Saltz theater review Feb. 6, 2025 The Antiquities Puts Humanity in a Museum Display CaseThe robots memorialize us in Jordan Harrison’s time-hopping speculative drama. By Jackson McHenry tv review Feb. 6, 2025 Clean Slate Goes All in on Feel-GoodLaverne Cox’s sitcom protagonist doesn’t operate in our world. Honestly, good for her. By Kathryn VanArendonk close read Feb. 5, 2025 Severance’s Title Sequence: Full of Clues or Just Plain Creepy?Why not both! By Nicholas Quah tv review Feb. 5, 2025 You’ve Seen This One BeforeApple Cider Vinegar plumbs a new low for TV scammers. By Jackson McHenry theater review Feb. 3, 2025 At the Kennedy Center, Schmigadoon! Briefly Reappears Through the MistStill sweetly spoofing classic Broadway, albeit with a little less bite than on TV. By Rhoda Feng close read Feb. 3, 2025 The 2025 Grammys Were a Little Too Feel-GoodMainstream music seems to see itself as a refuge from real-world trolls. By Craig Jenkins album review Feb. 3, 2025 Our Sweetheart of the RodeoBeyoncé’s Cowboy Carter chronicles an artist with a voice pliable enough (and a following large enough) to crash whatever scene she pleases. By Craig Jenkins movie review Jan. 31, 2025 Companion Is a Perfectly Mean RompSophie Thatcher and Jack Quaid star in a comedic thriller that’s better with dark twists than it is with big ideas. By Alison Willmore Load More @media (min-width: 1180px) { [data-uri="www.vulture.com/_components/sticky-ad/instances/criticism-top@published"] { height: 2500px; } [data-uri="www.vulture.com/_components/sticky-ad/instances/criticism-top@published"]:last-child { flex: 0 0 2500px !important; } } Switched on Pop A podcast about the making and meaning of popular music Listen Now'
