full_description = 'theater review Dakar 2000 Is a Tense and Unstable Thriller It falls short of wild combustible invention but also stops shy of absolute historical fidelity. By Jackson McHenry theater review Overexposition: On the Evolutionary Function of Shame A script that tries to do a lot of explaining. By Sara Holdren theater What to See on (and Off)(and Off–Off) Broadway Let Vulture’s theater desk be your guide. By Vulture Editors theater review Feb. 27, 2025 Dakar 2000 Is a Tense and Unstable ThrillerIt falls short of wild combustible invention but also stops shy of absolute historical fidelity. By Jackson McHenry theater review Feb. 26, 2025 Overexposition: On the Evolutionary Function of ShameA script that tries to do a lot of explaining. By Sara Holdren theater Feb. 26, 2025 The Best Hate-Watch of All TimeA guide to Smash, from screen to stage. By Jason P. Frank works in progress Feb. 26, 2025 Closers OnlyBob Odenkirk, Kieran Culkin, and Bill Burr battle for the top of the Glengarry Glen Ross leaderboard. By Rebecca Alter theater review Feb. 25, 2025 This Curse of the Starving Class Doesn’t Have Much in Its FridgeAnd a sheep is the star of the show. By Jackson McHenry Sign up for the Stage Whisperer newsletter Weekly theater news, delivered a little louder for the people in the back. Email This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Vox Media, LLC Terms and Privacy Notice By submitting your email, you agree to our Terms and Privacy Notice and to receive email correspondence from us. works in progress Feb. 25, 2025 LaTanya Richardson Jackson Brings a New Grande Dame to Broadway in Purpose“I have not tried to infuse her historically with my life, but it is so me.” By Soraya Nadia McDonald theater review Feb. 24, 2025 Idaho, and What Came After: Samuel D. Hunter’s GrangevilleThe playwright best known for The Whale turns a critical eye on the art he’s made about his hometown. By Sara Holdren works in progress Feb. 24, 2025 George Clooney Is a Little Nervous About His Broadway Debut“There’s all this panic.” By Jackson McHenry theater review Feb. 23, 2025 Dispatches From the Apocalypse: Safe House and The BarbariansTwo plays that, fitfully and incompletely, get at this moment’s dread. By Sara Holdren theater review Feb. 20, 2025 Liberation Is the Best Play I’ve Seen This SeasonBess Wohl’s latest is drawn from the true stories of her mother’s 1970s encounter group. By Sara Holdren tony awards Feb. 19, 2025 Cynthia Erivo Is Holding Space for the Tony AwardsHosting this year’s ceremony at Radio City Music Hall. By Jason P. Frank theater review Feb. 13, 2025 All Bark, No Bite: RedwoodIdina Menzel grieves in a tree and leaves. By Sara Holdren i can finally breathe again Feb. 13, 2025 Idina Menzel Dangles From the Heavens While SingingShe’s in a redwood, singing a song from Redwood about being in a redwood. By Jason P. Frank theater review Feb. 12, 2025 A Henry IV That Doesn’t Know Its Own StrengthThis play has underappreciated muscles that its director intermittently flexes. By Sara Holdren theater review Feb. 7, 2025 Urinetown Is Still PotableWhoa, there! Plenty of prescience reveals itself in Encores!’s revival of the 2001 musical. By Jackson McHenry theater review Feb. 6, 2025 The Antiquities Puts Humanity in a Museum Display CaseThe robots memorialize us in Jordan Harrison’s time-hopping speculative drama. By Jackson McHenry broadway baby! Feb. 6, 2025 Tituss Burgess to Take Over Oh, Mary!“I understand the role of Mary Todd Lincoln maybe a little too well.” By Jason P. Frank theater review Feb. 3, 2025 At the Kennedy Center, Schmigadoon! Briefly Reappears Through the MistStill sweetly spoofing classic Broadway, albeit with a little less bite than on TV. By Rhoda Feng i’m just a broadway baby Jan. 28, 2025 Quentin Tarantino Prefers the The-a-ter Right Now“When it comes to being a filmmaker, I’ve pretty much done everything I’ve wanted to do.” By Jason P. Frank theater review Jan. 23, 2025 Freedom in Speech: Sanaz Toossi’s EnglishFor these characters, learning a global language is both broadening and restraining. By Sara Holdren theater review Jan. 21, 2025 Gary Gulman Clings to GrandiloquenceIn his Off Broadway show, the comedian too often confuses attention for acceptance. By Kathryn VanArendonk willkom-mask Jan. 15, 2025 Does the Mask Stay On?Orville Peck will star in Cabaret at the Kit Kat Club on Broadway, leading to one inevitable question. By Jason P. Frank mythic proportions Jan. 14, 2025 Maya Hawke to Make Off Broadway Debut in Eurydice“Eurydice is a warning to not spend your life fixated on your memories,” Hawke says. By Jason P. Frank 2025 preview Jan. 8, 2025 18 Plays and Musicals We Can’t Wait to See in 2025Idina Menzel in the forest, Paul Mescal in Brooklyn, and more. By Sara Holdren and Jackson McHenry playbook Jan. 7, 2025 Where Will Hugh Jackman and Sutton Foster Pop Up Next?We’ve got some ideas about where their showmance might go from here. By Fran Hoepfner from the wings Jan. 7, 2025 Life As a Millennial Stage MomA journey into the cutthroat and adorable world of professional child actors. By Lauren Hilgers look book Jan. 2, 2025 The Look Book Goes to Cult of Love’s Opening-Night PartyThe play’s cast, creative team, and supporters celebrated at Yard House in Times Square. By Emily Leibert and Jeremy Rellosa rip Dec. 30, 2024 Linda Lavin, Tony Winner and Alice Star, Dead at 87She won theater’s highest honor for 1987’s Broadway Bound. By Devon E. Ivie year in culture Dec. 27, 2024 The Bests of 2024All the books, podcasts, and anime (plus TV, movies, music, and more) that captivated our critics (and John Waters) this year. By Vulture Editors theater review Dec. 22, 2024 The Sit-Down Comedy of All InJohn Mulaney and friends deliver bright readings of slight tales. By Sara Holdren theater review Dec. 20, 2024 Is It Swell? Is It Great? Audra McDonald Takes Over GypsyDespite some iffy production choices, she delivers the world on a plate. By Sara Holdren radical optimism Dec. 19, 2024 Hey, Wait … Is This Broadway Season Actually Great?Dead Outlaw rounds out the biggest slate of actually original musicals in years. By Jason P. Frank different times Dec. 16, 2024 Clay Aiken Lost ‘50 Percent the Fan Base’ After Coming OutHe also claims “ticket sales dropped” for Spamalot afterwards. By Alejandra Gularte theater review Dec. 16, 2024 In Eureka Day, the Jabs Are Verbal, TooA send-up of the leftist battles over vaccination and the weaponization of kindness. By Sara Holdren theater Dec. 13, 2024 Everything’s Coming Up Joy WoodsThe Broadway breakout’s big belting in The Notebook went viral this year. Now, she’s taking on one of the greatest musicals of all time: Gypsy. By Jason P. Frank theater review Dec. 12, 2024 Praise God and Pass the Banjo: Cult of LoveStrains (musical and otherwise) within an American Christian family. By Jackson McHenry peace in new york Dec. 12, 2024 Patti LuPone Was ‘Energized’ by Sunset Blvd.Not in a hazardous way … By Jason P. Frank theater review Dec. 11, 2024 Crimes and Chases: the beautiful land i seek and RACECAR RACECAR RACECARTwo travel tales leading into the American nightmare. By Sara Holdren a mescal named desire Dec. 10, 2024 Dear Paul Mescal, Please Just Admit You Want to Be in a Broadway MusicalA detailed rundown of his passion for singing. By Jason P. Frank a-b-c Dec. 10, 2024 Business Boys Are Back on BroadwayKieran Culkin, Bob Odenkirk, and Bill Burr co-star in Glengarry Glen Ross. By Jason P. Frank finish him! Dec. 6, 2024 Laura Benanti to Zachary Levi: ‘Fuck You Forever’She Loves Me? More like she hates him. By Jason P. Frank best of 2024 Dec. 5, 2024 The Best Theater of 2024Waterfront history staged afloat, a variety of robots, and Mary Todd Lincoln going wild. By Sara Holdren and Jackson McHenry oh betty! Dec. 3, 2024 Betty Gilpin to Replace Cole Escola in Oh, Mary!“I am beyond honored to step in so that Cole can get back to tending their neglected passions: fracking and skincare.” By Jason P. Frank theater review Nov. 24, 2024 We Are Your Robots: Do Androids Dream of Electric Guitars?Siri, show me a good play with music. By Sara Holdren theater review Nov. 21, 2024 Old Patterns and Bold Stitches: The Blood QuiltKatori Hall’s family-inheritance drama stays within a familiar grid. By Sara Holdren theater review Nov. 21, 2024 Divas at Dusk: Death Becomes Her as Broadway CampThe musical adaptation of the Streep-and-Hawn movie is relentlessly eager for you to laugh with and at its dueling lead actresses. By Jackson McHenry theater review Nov. 19, 2024 Out to Sea and Back With Swept AwayThe story of a whaling expedition that turned horrifying, musicalized by the Avett Brothers. By Sara Holdren theater review Nov. 18, 2024 Shit. Meet. Fan. Tells Us Lots That We Already KnowNeil Patrick Harris and Jane Krakowski star in Robert O’Hara’s self-described “blistering vulgar satire.” It delivers one of those three things. By Sara Holdren theater review Nov. 17, 2024 Elf: The Musical, Where They Sing Really Loud for All to HearEveryone’s trying, but the show itself is a cotton-headed ninny-muggins. By Jackson McHenry theater review Nov. 14, 2024 The Lighter Side of Christian Nationalism: Tammy FayeSpinning an evangelist grifter into a camp icon and sorta-feminist heroine is a little hard to take right now. By Sara Holdren More Articles @media (min-width: 1180px) { [data-uri="www.vulture.com/_components/sticky-ad/instances/theater-top@published"] { height: 2500px; } [data-uri="www.vulture.com/_components/sticky-ad/instances/theater-top@published"]:last-child { flex: 0 0 2500px !important; } } Switched on Pop A podcast about the making and meaning of popular music Listen Now'
