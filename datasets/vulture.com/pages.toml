["https://www.vulture.com/article/everything-we-know-about-the-office-spinoff-cast-details.html"]
title = "Everything We Know About ‘The Office’ Spin-off"
description = "Okay, it’s happening. Everybody stay calm! Oscar Nuñez has been added to Greg Daniels’s spinoff of ‘The Office,’ which will follow the revitalization of a dying midwestern newspaper. So paper is kind of still involved."
full_description = '''people person's paper people Updated Feb. 27, 2025 Everything We Know About The Office Spinoff (That’s Mostly a New Show) By Jennifer Zhan, a Vulture news blogger covering music, internet culture, and TV. Photo: NBC/Everett Collection Oh my God! Okay, it’s happening. Everybody stay calm! In a world where most new sitcoms these days feel like old sitcoms, it was only a matter of time before The Office got mined for parts. The Office itself was already an Americanized version of a successful U.K. sitcom of the same name, so why not just add to the universe, right? That’s what Peacock’s thinking. The new version is very much not a reboot of that old show and, in fact, sounds entirely different from the U.S. and the U.K. versions of The Office in just about every way, from the growing cast to the setting to the stakes to if anyone’s coming back from the original series. So what do we know about this mostly entirely new sitcom? How is this connected to The Office? The tenuous connection to the original beloved sitcom is that the show is shot by the “documentary crew” that followed the Scranton Dunder Mifflin. It’s also created by original The Office (U.S.) creator Greg Daniels with Nathan for You’s Michael Koman. Daniels clarified to The Wrap that he does not consider this new take to be a reboot. Instead, he likened it to the way that The Mandalorian fits into the Star Wars universe. “Something like the notion of this documentary crew doing a documentary about a different subject. That, I think, could be intriguing and creative,” he said. “But I don’t even know what you would call that.” Sounds like a spinoff to us! What’s this thing about? Rather than documenting the everyday life of office workers (which would be hard anyway because these days so many people are hybrid), the new show will focus on publishers attempting to revive a “dying historic Midwestern newspaper.” Well … there’s still paper involved! Who’s in it? Gbemisola Ikumelo, Alex Edelman, Tim Key, and Eric Rahill are the latest to join. Rahill, Ikumelo, and Edelman will also be writers on the series. Previously, the Palisadian-Post, a California newspaper, broke the news that Chelsea Frei, Melvin Gregg, and Ramona Young had joined the cast by reporting that the trio shadowed its staffers to prep for their roles. The upcoming story about a dying midwestern newspaper will also partly be brought to life with some international hires; we already know that Italian actress Sabrina Impacciatore (The White Lotus) and Irish actor Domhnall Gleeson (Run) are onboard. Perhaps we can look forward to at least a couple cute cameos from former cast members? Jenna Fischer told People she hasn’t been approached yet. We say bring back Creed. Are any original The Office cast members coming back? Oh, you didn’t know. Tsk, tsk. Oscar Nunez, who plays Oscar Martinez a.k.a. the Coalition for Reason, is returning for the follow-up series, as reported by the InSneider. When we last saw Oscar in the finale, he was running for Senator of Pennsylvania. Variety reports that Oscar isn’t going to be a main character of the series, but his addition to the series has been discussed since its conception. How can I watch? The new sitcom, which is still untitled, was picked up by Peacock on May 8. “It’s been more than ten years since the final episode of The Office aired on NBC, and the acclaimed comedy series continues to gain popularity and build new generations of fans on Peacock,” President of NBCUniversal Entertainment Lisa Katz said in a statement. “In partnership with Universal Television and led by the creative team of Greg Daniels and Michael Koman, this new series set in the universe of Dunder Mifflin introduces a new cast of characters in a fresh setting ripe for comedic storytelling: a daily newspaper.” There have been no confirmed dates for production or release yet. Hold out hope that the new spinoff will be like the old one in one major way — 24-episode seasons. This post has been updated. Related A Very Precise Taxonomy of the TV Reboot John Krasinski and Jenna Fischer Were ‘Off the Charts Nervous’ for First Kiss An Oral History of The Office’s Insane Fire Drill Episode Jenna Fischer and Angela Kinsey Invite NBC to Hear Their Office Reunion Pitch Tags: the office universal television casting greg daniels michael koman sabrina impacciatore domhnall gleeson tv news coming soon spinoffs people person's paper people chelsea frei ramona young melvin gregg More Show Leave a Comment The Office Spinoff Is Mostly a New Show const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'vulture'; const keywords = ["the office","universal television","casting","greg daniels","michael koman","sabrina impacciatore","domhnall gleeson","tv","news","coming soon","spinoffs","people person's paper people","chelsea frei","ramona young","melvin gregg"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
