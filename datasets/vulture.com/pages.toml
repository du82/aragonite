title = "Best Oscar Monologues and Opening Numbers, Ranked"
description = "Ahead the 2025 Oscars with first-time host Conan O’Brien, we ranked all of the televised Academy Awards openers, from Seth MacFarlane to Chris Rock, with lots of Bob Hope in the middle."
full_description = "vulture lists Updated Feb. 28, 2025 73 Oscar Monologues and Opening Numbers Ranked, From Worst to Best By Bill Wyman This article was originally published ahead of the 2018 Oscars. It has been updated to include subsequent Academy Award ceremonies. The Academy Awards right now are like one of those long-running but fading film franchises. The studio’s tried every trick it can think of but just can’t get the box office up to past glories. It’s been a difficult few years. Film admissions generally — and ratings for the annual award broadcast — have been trending down for decades. A move to broaden the Best Picture lineup to as many as ten contenders didn’t help. There was the #OscarsSoWhite movement and the organization’s sometimes overdone attempts to repair the damage. The group gave Jimmy Kimmel a try, then decided it would do without hosts for a couple of years — as dumb a programming decision as one can conceive of. Next? The pandemic … followed by two Best Picture winners whose official theatrical box-office grosses were within a rounding error of zero. Can Oscar get itself back together? We’ll have to see. Last year, ratings inched up with two box-office hits in contention — Oppenheimer (the big winner) and Barbie. Perhaps the allure of the long-awaited Wicked, which brought in $475 million in North America, can bring some viewers back. (Doubtful it will win Best Pic, though.) There’s also the shadow cast by the terrible L.A. fires of just a few months ago, which disrupted or destroyed the lives of hundreds, if not thousands, of industry workers. Sunday night, Conan O’Brien, hosting for the first time, will try to inject some energy and class back into the proceedings. As Oscar watchers know, he’ll do eight or ten minutes of riffs on the movies of the year and the assembled stars (“Meryl Streep, ladies and gentlemen …” ), perhaps with some yuks via some pre-filmed bits. He’s stepping into the shoes of storied hosts — Bob Hope, Johnny Carson, Jon Stewart, Chris Rock — and 70-plus years of hits and misses in the opening monologue. What follows is a ranking of those opening segments, from worst to best, with a lot of great jokes along the way. Sometimes Oscar opted for stranger beginnings; for our purposes, I stuck to whatever happened before the first award was handed out. So here we go! The envelope, please: 73. 2013 (the 85th Oscars)Host: Seth MacFarlane This is one of the most depressing Oscars ever. There’s a terrible host, and great movies like Life of Pi, Zero Dark Thirty, Amour, and Beasts of the Southern Wild are beaten out by Argo, a movie about a trivial sidelight to a geopolitical tragedy abetted by the United States for decades. (The actual story was so uninteresting that director Ben Affleck had to add a lot of spurious suspense, like the fictional oh-so-dramatic plane takeoff at the end.) Anyway, we have the host from Maxim, Seth MacFarlane, whose stint left a bad taste in a lot of people’s mouths. This is for a few reasons. One is that most of his jokes sucked. Mentioning Daniel Day-Lewis’s Method acting as Lincoln, he asks, “If you bumped into Don Cheadle on the lot, would you try to free him?” Django Unchained, he says, “is about “a man fighting to get back his woman, who’s been subjected to unthinkable violence. Or as Chris Brown and Rihanna call it, a date movie.” Why would Rihanna call it that? And this is the Oscars, not the Grammys. Even his Mel Gibson joke was off. There is a dance break with Charlize Theron and Channing Tatum, during which MacFarlane croons “The Way You Look Tonight.” This Fred Astaire classic conjures up memories of the swellegant Astaire and Ginger Rogers that the galumphing Tatum and Theron quickly dispense with. And when Joseph Gordon-Levitt and Daniel Radcliffe come on to join MacFarlane for another dance number, the trio’s raw magnetism rivals that of some of the early Academy president speeches. Then there is MacFarlane’s song “I Saw Your Boobs,” which is presented on tape after a video chat with William Shatner as Captain Kirk, ostensibly beamed in from the future. The song, in case it isn’t clear, mentions a lot of actresses who have done nude scenes in movies. There’s a big double standard when it comes to nude scenes in film; it would have been a great opportunity to riff on that and cinema’s exploitation of women generally. But MacFarlane is just sniggering. No subtext, just sniggering. Hey Seth: You saw Jodie Foster’s breasts in The Accused because her character was being gang-raped. Captain Kirk was right about one thing: You were the worst Oscars host in Academy Award history. 72. 2011 (the 83rd Oscars)Hosts: James Franco and Anne Hathaway Hathaway gets the better reviews — and I know, I know, she’s an angel — but let me tell you, neither is very good. Franco is simpering when he wasn’t distracted, and while Hathaway brings a bit of spirit, most of her lines are only half-funny. It is the longest four minutes in Oscars opening-monologue history. Best Line: Hathaway introduces her mom, who tells Hathaway to stand up straight and push her chest out a bit. “Steven Spielberg is here!” 71. 1974 (the 46th Oscars)Host: Burt Reynolds In the 1970s, things occasionally got weird at the Oscars. Tonight, there is a fanfare of nominated songs. It’s an incredible year for movies, including The Sting, The Exorcist, American Graffiti, The Last Detail, Paper Moon, and, not least, Last Tango in Paris. Then, we get a seven(!)-minute dance by Liza Minnelli, climaxing in two vignettes. In the first, she relives her Best Actress loss for The Sterile Cuckoo … and in the second relives her Cabaret win! Minnelli’s a star, but it was rough going. Then comes Burt Reynolds, the most ill-suited host before James Franco. The highlight here, really worth checking out, is a wonderful collage, coming in at about the 20-minute (!) mark, sort of an Oscars blooper reel. But the rest is just Burt Reynolds, known at the time for displaying Elvis Presley–level acting chops in a series of unaccountably popular movies with titles like Gator and Hooper. Reynolds seems to have the attention span of a hamster. Most of the routine is about how neither he nor the Academy know why he’s there. Typical Line: [Blows raspberry.] “If you want sophistication, talk to David Niven.” Low Point: “I love the title The Sting. It reminds me of old Army-training films.” Politics: [After noting that Marlon Brando, Robert Redford, etc. weren’t at the ceremony.] “A lot of people just don’t want to take what’s comin’ to them. But enough about Richard Nixon …” 70. 1988 (the 60th Oscars)Host: Chevy Chase Chase is hosting solo, after co-hosting the previous year. He begins on the red carpet, but not saying much that is funny. Things improve only marginally once the show starts. It is the year of The Last Emperor — the ravishing Bertolucci epic that won all nine awards it was nominated for — Fatal Attraction, and Wall Street. There is a taped intro, with quick comic stylized skits showing all the different trades that go into making a film. The music starts sounding familiar and then you notice it is “I Hope I Get It” from A Chorus Line, which has recently been made into a movie, and there is a big rousing dance number. “Good evening, Hollywood phonies,” Chase says. There was a strike, so many of the jokes are about that: “My entire monologue was donated by five teamsters.” Otherwise, the onetime SNL star is at his most sour: “Critics are a strange species. Imagine a parent saying, ‘When you grow up I want you to spend all your time going to the movies, and then I want you to make a living talking about what a terrible experience it’s been.’” As someone who saw many of Chase’s movies for professional reasons, I can say there were indeed times when I questioned my career choices. Best Joke (I Guess): “Glenn Close is here with her obstetrician in case anything out of the ordinary pops up.” Beating-a-Dead-Horse Dept: “The Academy seriously considered giving out an award for Best Film Critic. Unfortunately, we found there weren’t any.” [Applause.] 69. 1989 (the 61st Oscars) This is the Plan 9 From Outer Space of Oscars openings, and I am happy to tell you that time has not dimmed its painful awfulness. We begin with Army Archerd, the longtime Variety columnist, outside the auditorium’s doors. He’s interviewing a young star with an unpleasant, squeaky voice. It’s Snow White. The idea is that she’s an actress trying to make it in Hollywood. Archerd ushers her in and she goes down the aisle trying to greet various stars, who do their best to ignore her. What comes next was the most outré event in Oscars history, an 11-minute song-and-dance number that can best be described as the trip you’d have after taking a tab of ecstasy and chasing it with a tall glass of denture water from the bedside table of an aging Hollywood icon. The trouble comes from a number of bad decisions made by producer Allan Carr. The first is lifting ideas and some performers from a campy San Francisco–by–way–of–Vegas theater outfit, Beach Blanket Babylon, known for its breezily low-fi sensibility and enormous architectural headgear, which are amusing in a small venue. But these aspects of the presentation are immediately lost when presented on a worldwide stage. Carr also showcases a bunch of stars from waaay, way back (Dorothy Lamour, Roy Rogers) on a makeshift Coconut Grove nightclub set. These almost to a person come across as not only dragged in but, and I say this with kindness, dragged in from their respective nursing homes. Then Merv Griffin appears to sing “I’ve Got a Lovely Bunch of Coconuts.” Even those who knew that Griffin got his start at the Grove (an L.A. nightclub) singing that song might have wondered what exactly this had to do with Snow White, not to mention cinema in any sense. Beyond that, the Snow White conceit, fine in the absurdist confines of BBB, doesn’t really track at an actual movie event. Snow White wasn’t an actor, she was a character; there’s a difference. And I haven’t even mentioned the dancing tables, Rob Lowe (then the ingénue star of St. Elmo’s Fire), or the White-Lowe duet to that classic movie tune “Proud Mary.” It must be said the segment ends with a wowza display of the ultimate Babylon hat, but this landmark, too, is unclear to the audience. Lily Tomlin enters and apparently accidentally loses a shoe as she goes down the stairs, though I can’t tell if that was a shtick or not. But there is another amazing thing about this opening. It actually gets worse. Richard Kahn, a marketing exec who was then the president of the Academy, appears next to mouth a succession of phonetic sounds we had heard at this point some 60 times before: “Honoring the outstanding achievements in motion picture for the year …” blah blah blah. He tells us that the show will be seen in 91 countries and, for the first time, in the USSR, many of whose viewers must have been staring at the screen in shock. Kahn then introduces some star power. Hold onto your hats, it’s … Tom Selleck! As it happened, Selleck was at the time something passingly like a hot commodity, coming off the hit Three Men and a Baby — the Snakes on a Plane of its day — with fellow thespians Ted Danson and Steve Guttenberg. He appeared sporting an odd buzz haircut and a mustache the size of the Hollywood sign, and, if you can believe it, he was there to explain that he was actually not the host. He goes on and on explaining how people will come on, solo or in pairs, to give out awards. Thanks, Tom — we didn’t know how these newfangled Oscars shows work! And throughout — I’m not making this up — there is music playing in back of him that sounds like the exit music played to get long-winded awardees off the stage. This became the Oscars show opening that never went away. Repercussions reverberated for months; the Disney company launched a legal attack on the show. The position of the Academy’s lawyers was that Snow White was a figure in the public domain. (Yeah, but the whole point was that she was Snow White from the movie.) Right about then, the Academy solons were probably wishing for something, anything, to distract attention from the Disney imbroglio. Their prayers were answered, after a fashion, a few months later when Rob Lowe’s sex tape hit the news. At this point, the Academy was looking into the void, PR-wise, but for Lowe it was more of a good-news–bad-news situation: Sure, a tape got released of him having sex and his movie career was derailed. On the other hand, he’d had the good fortune to make the tape in the enlightened State of Georgia, where it actually wasn’t against the law for movie stars passing through town to film themselves fucking local 16-year-olds. 68. 1958 (the 30th Oscars) Wagon Train, Father Knows Best, and Kraft Theater will not be seen at their usual times tonight … George Stevens (director of Swing Time, Shane, and Giant and three-time Best Director recipient) was the president of the Academy. He told everyone there would be no commercial interruptions in the show — now that’s something they should bring back — and that, “to accommodate the reporters, photographers, and newsreel men,” there was now a pavilion next to the stage to interview the winners after each award presentation. He introduced Jimmy Stewart, “one of the few stars who can fill a CinemaScope screen lying down” — which makes no sense if you think about it. There were half a dozen or more semiofficial hosts over the course of the evening but no monologue. 67. 1963 (the 35th Oscars)Host: Frank Sinatra It is the notable year of Lawrence of Arabia, which gives David Lean his second Best Picture win; To Kill a Mockingbird; and The Manchurian Candidate. The orchestra kicks off with “Tonight,” from West Side Story, the previous year’s big winner. They wrap it up and we see that … Ol’ Blue Eyes is the host! What follows is one of the weirdest Oscars openings ever. Minutes go by as Sinatra riffs on the Mona Lisa (“The chick just sits there and smiles!”), da Vinci, and the personal vision that comes through in the best art. If da Vinci came to Hollywood, you see, a producer would demand things like “a cocktail-party scene in the foreground! Give it some production values!” We can all agree with him, of course. But it is also heavy-handed, long-winded, more than a bit self-satisfied, and boring. (Sinatra was sort of the Kanye West of his day.) No jokes until the adorable Shelley Winters comes on to give out the first award. “De gustibus,” she says. “That means ‘thank you,’ I think, in Latin.” (It’s possible Winters is improvising and twitting Sinatra’s blathering.) “I’ll check with my druggist,” Frank says and exits, pursued by a bear. 66. 2021 (the 93nd Oscars) Host: Regina King Everyone’s freaked out by the pandemic, and Oscar is no exception — the ceremony is delayed until April! The show begins with the fabulous Regina King in a large outdoor area, presumably the social-distancing green "
