full_description = 'profile Sarah McNally’s Book Club The owner of the McNally Jackson literary empire is reshaping the city’s reading life. By Matthew Schneier book review Chimamanda Ngozi Adichie’s Frustrating Return Her new novel Dream Count suffers from the retrograde gender politics and bad writing that has defined her career of late. By Sanjena Sathian book review Neko Case Survived It All The songwriter’s unusual tell-all skips the gossip, revealing a life in music as the solution, not the plot. By Emma Alpern vulture lists 11:30 a.m. 28 Book-to-Screen Adaptations to Add to Your 2025 Reading ListRobert Pattinson (and some clones) are heading to space. By Emily Maskell vulture lists Feb. 25, 2025 5 Great Audiobooks to Listen to This MonthIncluding a new novel that will sneak up on you. By Marshall Heyman neighborhood news Feb. 21, 2025 ‘So You All Got the Email …’At the launch for Susan Morrison’s Lorne after a reply-all blizzard. By Paula Aceves jang-jang-jang-jang Feb. 21, 2025 The Monkey Saves the Stephen King Adaptation by Skewering ItThe closer you look at The Monkey, the more you can see its deliberate subversions of the tropes that have come to define the Stephen King movie. By Louis Peitzman julianne ‘the resistance’ moore Feb. 18, 2025 Why Is the Pentagon So Scared of Julianne Moore?Book-ban insanity comes for Freckleface Strawberry. By Rebecca Alter Sign up for The Critics A weekly dispatch on the cultural discourse, for subscribers only. Become a Subscriber Already a subscriber? Sign in This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Vox Media, LLC Terms and Privacy Notice By submitting your email, you agree to our Terms and Privacy Notice and to receive email correspondence from us. done Feb. 15, 2025 A Court of Thorns and Roses TV Series Doesn’t Survive Valentine’s DayA rose by any other name still dies in development hell. By Alejandra Gularte coming soon ;) Feb. 13, 2025 Miranda July and STARZ Go Public With Their RelationshipThe All Fours author ﻿says the network “really digs into the reality of who women are and what we want.” By Fran Hoepfner spellcasting Feb. 12, 2025 Harry Potter Hires a Hogwarts HeadmasterReportedly casting John Lithgow as Dumbledore. By Rebecca Alter testimonies Feb. 11, 2025 Salman Rushdie Relived His Stabbing Attack in Court Testimony“It occurred to me that I was dying,” the author recalled. By Jennifer Zhan controversies Feb. 11, 2025 Stephen ‘tWitch’ Boss’s Family Speaks Out Against Allison Holker’s Memoir“That was his story to tell.” By Justin Curto the grub street diet Jan. 31, 2025 Author Andrew Lipstein Believes There Are Two Kinds of Bagel Shops“There are those that try to dominate you, and there are those that want to be dominated.” By Paula Aceves shhhhh! Jan. 30, 2025 Dan Brown Wants to Tell You A SecretRobert Langdon is back!!!!!! By Emily Heller sister sister sister Jan. 30, 2025 Lola Kirke Tells Us She’s Not Like Other KirkesBut she is still a Kirke. By Fran Hoepfner book review Jan. 22, 2025 Han Kang’s Latest Novel Mines Korea’s Bloody PastWe Do Not Part is the very best kind of story-telling, poetic and ambiguous without ever shying away from horrible historic truths. By Robert Rubsam cheat sheet Jan. 17, 2025 The Rise of Rebecca Yarros, Mother of Dragon SmutWhat to know about the author of the breakout “Empyrean” series. By Jennifer Zhan in conversation Jan. 16, 2025 David Lynch on His Memoir Room to Dream and Clues to His Films“People are detectives and we have life to find clues about in the same way we would with a piece of cinema.” By David Marchese physical media Jan. 16, 2025 The Art Lost in L.A. FiresCount Warhol artworks, Gary Indiana’s library, and Schoenberg scores among the losses. By Justin Curto reading is fun Jan. 15, 2025 Maybe AJ Brown Can Be Our New BookTokThe Eagles wide receiver’s sideline read Inner Excellence became an Amazon best seller. By Alejandra Gularte no comment Jan. 15, 2025 Amanda Palmer ‘Disturbed’ by Neil Gaiman Assault AllegationsBut “she has no comment,” a representative said, citing her ongoing divorce. By Justin Curto book review Jan. 14, 2025 You Can’t Outrun SpotifyLiz Pelly’s Mood Machine suggests that logging off is the only way out of our music streaming nightmare. By Nicholas Quah okay bomer Jan. 14, 2025 Matt Bomer Brings A Little Life Back to LifeNarrating a tenth anniversary audiobook, for your pain and pleasure. By Jason P. Frank book review Jan. 13, 2025 Fear and Loathing in BerlinAn Afghan girl seeks solace in sex and drugs in an ambitious but bloated debut. By Jasmine Vojdani books Jan. 13, 2025 There Is No Safe WordHow the best-selling fantasy author Neil Gaiman hid the darkest parts of himself for decades. By Lila Shapiro 2025 preview Jan. 7, 2025 30 Books We Can’t Wait to Read in 2025In uncertain times, we look to our sharpest writers. By Vulture Editors year in culture Dec. 27, 2024 The Bests of 2024All the books, podcasts, and anime (plus TV, movies, music, and more) that captivated our critics (and John Waters) this year. By Vulture Editors mystery and intrigue Dec. 20, 2024 Oh, Colleen Hoover’s Next Movie Is Going to Be UnhingedDakota Johnson and Anne Hathaway are having a diva-off. By Jason P. Frank year in culture Dec. 16, 2024 Vulture’s 20 Most-Read Stories of 2024From brat summer to a scandalous fall, here’s what our readers loved most this year. By Vulture Editors reading is fundamental Dec. 13, 2024 Vulture’s 2024 Books Gift GuideA dearth of celebrity memoirs doesn’t mean a dearth of gossip. By Vulture Staff vulture lists Dec. 10, 2024 9 Great Queer Holiday Romance Novels to Cozy Up With This DecemberFeaturing house swaps, fake dates, and conveniently placed mistletoe. By Melissa Kravitz Hoeffner rip Dec. 10, 2024 Nikki Giovanni, Treasured Poet, Dead at 81She died of complications from lung cancer. By Alejandra Gularte best of 2024 Dec. 6, 2024 The Best Comedy Books of 2024The most delightful, thought-provoking, educational, and just all in all funny. By Brian Boone this is me trying Dec. 5, 2024 Taylor Swift’s Error-Laden Eras Tour Book Is Still a HitThe typo-filled tome has sold more than 800,000 copies. By Justin Curto best of 2024 Dec. 3, 2024 The Best Books of 2024The novels and nonfiction that gave us unique perspectives on what it’s like to experience the world in all its sorrow and wonder. By Maris Kreizman vulture lists Dec. 3, 2024 2024 Book-to-Screen Adaptations to Add to Your Reading ListIncluding an ancient epic poem, a magic-realism masterpiece, and a Bob Dylan biography. By Emily Maskell book review Nov. 27, 2024 The Perfect Fantasy Novel for These Uncertain TimesThe last book in Tad Williams’s influential Osten Ard series has a strong anti-authoritarian streak. By Sarah Jones why’d you make this film? Nov. 27, 2024 Just How Queer Is Luca Guadagnino’s Queer Anyway?I didn’t recognize the William Burroughs I knew in it. So I got on a Zoom with the director. By Ira Silverberg chat room Nov. 26, 2024 If You Think That’s How Becky Lynch Is Going Out, You’re WrongThe WWE superstar knows that letting fans peek behind the curtain can hook them even more. By Anne Victoria Clark the work of art Nov. 25, 2024 How Jonathan Franzen Learned to Write a Franzen NovelTo finish The Corrections, he had to kill his protagonist — and his idea of what a book should be. By Adam Moss scene report Nov. 21, 2024 The Party Goes Late at the 75th National Book AwardsSipping prosecco amid the black-tie crowd at the packed publishing-world event in lower Manhattan. By Emma Alpern books Nov. 21, 2024 Percival Everett Can’t Be Pinned DownHis masterful new novel, James, cements his status as one of our most idiosyncratic writers. By James Yeh the pluck of the irish Nov. 21, 2024 The Best Irish Novels From the Past 15 YearsWhich works by Sally Rooney, Colm Toibin, and Claire Keegan among others, reign supreme? Edited by Tomi Obaro if i could turn back time Nov. 19, 2024 14 Stunning Stories From Cher’s (First) MemoirFrom Warren Beatty asking her out when she was a teenager to her “chicken joke” with Carol Burnett. By Justin Curto chapters Nov. 19, 2024 I Thought the Sun Rose and Set on His Sicilian AssSonny Bono was one of the most charming — and possessive — men I’d ever met. By Cher book review Nov. 19, 2024 Haruki Murakami Has Lost the SauceTwo new works read more like fan fiction set in the extended Murakami universe than the thrillingly strange novels he’s famous for. By Bailey Trela books Nov. 12, 2024 Samantha Harvey Wins Booker Prize for Space-Station Novel OrbitalIt’s the second-shortest book to be awarded the prize. By Emma Alpern books Nov. 12, 2024 Literary AssassinRevealing the secret histories of Joan Didion, Donna Tartt, and Eve Babitz. By Lili Anolik obits Nov. 10, 2024 Bastard Out of Carolina Author Dorothy Allison Dies at 75She was a voice for poor, rural queer people across the country. By Bethy Squires read me read me read me Nov. 5, 2024 Robert Smith Is a Big Ol’ Book NerdTracking the not-so-hidden literary references on the Cure’s new album. By Chris Stanton vulture lists Nov. 1, 2024 10 Books With Grotesquerie VibesWhether you’re into creepy Catholic-coded camp or just here for Travis Kelce. By Mikaella Clements & Onjuli Datta anonymous in publishing Oct. 31, 2024 Who’s Really Writing Celebrity Novels?The writers and agents working behind the scenes tell us how it actually works. By Sophie Vershbow More Articles @media (min-width: 1180px) { [data-uri="www.vulture.com/_components/sticky-ad/instances/books-top@published"] { height: 2500px; } [data-uri="www.vulture.com/_components/sticky-ad/instances/books-top@published"]:last-child { flex: 0 0 2500px !important; } } Switched on Pop A podcast about the making and meaning of popular music Listen Now'
