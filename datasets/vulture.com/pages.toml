full_description = 'stand-up 5 New Comedy Specials You Should Definitely Watch (When You Have a Moment) Looking for some stand-up recommendations? Here are some February releases that are worth your attention. By Jesse David Fox keeping up with the baldwins Suffering Is Not a Competition The Baldwins stumbles in its attempt to show two sides of the Rust tragedy. By Fran Hoepfner gold rush Every Movie Nominated for a 2025 Oscar, Ranked This is on balance a very strong Oscar year. By Joe Reid song review Lizzo Is in Limbo On “Love in Real Life,” she struggles to change her narrative. By Craig Jenkins Cinematrix Can you name an Emma Stone movie released between 2000 and 2009? Telematrix Can you name an unscripted TV show starring NeNe Leakes? 10x10 4-Down, Seven Letters: Where Demi Moore might take Pilaf to play Almost Showtime All eyes on Dolby this Sunday for the 97th Academy Awards. How to Watch and Stream All the Oscar Contenders This Year By Brian Tallerico Final Oscar Predictions: Who Will Win the Most Uncertain Race in Years? By Nate Jones 23 Punhinged Oscars Watch-Party Menu Ideas By Rebecca Alter The Feed The Feed The Feed News Recaps Criticism Latest The Feed .cls-1 { fill: #000; stroke-width: 0px; } News-feed rip 5:54 p.m. David Johansen, New York Dolls Frontman, Dead at 75 Martin Scorsese pays tribute to the singer: “What a remarkable artist. What an amazing man. I was so lucky to have known him.” winner girl 5:20 p.m. The Brit Awards? More Like the Brat Awards The 365 Party Girl won the first award of the night. feel better king 5:14 p.m. Harrison Ford Steps Down as Oscar Presenter Amid Shingles Diagnosis He dropped out of the ceremony this morning. vulture lists 11:30 a.m. 28 Book-to-Screen Adaptations to Add to Your 2025 Reading List Robert Pattinson (and some clones) are heading to space. psy? 11:27 a.m. Psyduck Clocks In for Another Shift at Pokémon Concierge Haru returns with new friends Shinx and Luxray for some shenanigans in season two. now streaming 9:30 a.m. The 9 Best Movies and TV Shows to Watch This Weekend If you’re not into the Oscars, there’s always Survivor. vulture games 5:00 a.m. Cinematrix No. 340: March 1, 2025 Can you name an Emma Stone movie released between 2000 and 2009? the industry 2/28/2025 The Golden Globes Will Stop Paying Voters $75,000 Salaries The change reportedly affects about 50 former members of the Hollywood Foreign Press Association. coming soon 2/28/2025 The 2025 Oscars Will Have Conan O’Brien, a Wicked Performance, and a Surprise “Expect the unexpected,” the Academy teased on Instagram. rip 2/28/2025 Gene Hackman, Academy Award–Winning Actor, Dead at 95 Hackman and his wife’s bodies tested negative for carbon monoxide, and his pacemaker stopped more than a week before he was found dead. funny videos of the month 2/28/2025 The Best Comedy Shorts of February 2025 Rounding up our favorite funny videos of the month. vulture lists 2/28/2025 How to Watch and Stream All the Oscar Contenders This Year Robots! Aliens! Nickel Boys! now streaming 2/28/2025 Where to Watch All of Gene Hackman’s Movies You could go through two dozen of them and rarely see the same choices made twice. succession 2/28/2025 Is Kathleen Kennedy’s Star Wars Empire Ending? The Lucasfilm succession plan has enough conflict for an opening crawl. More News see more from the feed .cls-1 { fill: #000; stroke-width: 0px; } Recaps-feed overnights 2/28/2025 RuPaul’s Drag Race Recap: Sew Over It Including these late-stage sewing challenges makes it so the girls’ design abilities can be judged harshly, not just on ability, but on taste. overnights 2/28/2025 Yellowjackets Recap: Serious Karma Deficit A high school mock trial at the end of the world. overnights 2/28/2025 Love Is Blind Recap: Care to Comment? Don’t let the sentimental montages deceive you — there are underlying tensions that could affect the weddings. overnights 2/28/2025 Severance Recap: Eternal Sunshine of the Severed Mind We finally know what happened to G