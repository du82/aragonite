title = "Best New Audiobooks of 2025: Celebrity Memoirs & New Novels"
description = "Looking for a great new audiobook? We listened to the buzziest books of 2025, including the new novels from Jojo Moyes and Anne Tyler, and Bill Gates’s memoir."
full_description = 'vulture lists Updated Feb. 25, 2025 5 Great Audiobooks to Listen to This Month By Marshall Heyman, a freelance journalist and TV writer Photo-Illustration: Vulture Every month, audiobook connoisseur Marshall Heyman listens to hours and hours of freshly published novels and nonfiction. He then recommends his favorite new titles, which often include juicy celebrity memoirs, buzzy literary fare, gripping thrillers, sweet romances, thoughtful essays, and even some poetry. He also provides his preferred listening speed for anyone else looking to maximize their audiobook intake. Check back next month for new releases. February Picks We All Live Here, by Jojo Moyes $20 $23 now 13% off $20 Read by: Jenna ColemanLength: 12 hrs, 38 minsSpeed I listened: 2x I usually savor a new Jojo Moyes novel in print. This time, I gave her latest a listen, and I loved the experience just as much. In this one, a divorced mom finds herself with a complicated full house when her estranged (and broke) father comes back to live with her, her stepfather, and her daughters. Charming, funny, warm, unexpected — like all of the Jojo Moyes canon, it’s a delight. $20 at Amazon Buy $20 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"We All Live Here, by Jojo Moyes","image":"https://pyxis.nymag.com/v1/imgs/1b6/050/a2c5f278e9d5faf9b3b7a766d8222f4c0e-weall-livehere.jpg","brand":{"@type":"Brand","name":"Penguiin Audio"},"offers":[{"@type":"Offer","price":20,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D5YX76NH?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__258123________________"}],"offerCount":1} Memorial Days, by Geraldine Brooks $14 $16 now 13% off $14 Read by: the authorLength: 4 hrs, 56 mins.Speed I listened: 2x Everything seemed fine, and then suddenly, on Memorial Day 2019, the writer Geraldine Brooks got a call that her 60-year-old husband, the journalist Tony Horwitz, had dropped dead. This memoir alternates between the history of their marriage and the grief she attempts to work through while on a remote Australian island. Part of what’s thrilling about the audio production is how Brooks’s lyrical accent elevates her lovely and spare prose. $14 at Amazon Buy $14 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Memorial Days by Geraldine Brooks","image":"https://pyxis.nymag.com/v1/imgs/a84/1c0/4b72115db3a77d27eab7c74d480af5a0b3-memorialdays.jpg","brand":{"@type":"Brand","name":"Penguin Audio"},"offers":[{"@type":"Offer","price":14,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D5YT6FYR?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__258127________________"}],"offerCount":1} Three Days in June, by Anne Tyler $16 $18 now 11% off $16 Read by: J. Smith-CameronLength: 4 hrs, 23 mins.Speed I listened: 1.8x I’ve never been an Anne Tyler reader, but the brisk length of her latest novel made a listen particularly appealing. An added bonus: The book is narrated by actress J. Smith-Cameron from Succession. She’s the awkward mother of a bride who doesn’t really think her daughter should get married to the groom. The weight of this one really sneaks up on you. Or, at least, it snuck up on me. $16 at Amazon Buy $16 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Three Days in June, by Anne Tyler","image":"https://pyxis.nymag.com/v1/imgs/2b7/382/340bd853cf21a362a88b49fbb8facd0130-threedays.jpg","brand":{"@type":"Brand","name":"Random House Audio"},"offers":[{"@type":"Offer","price":16,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D5Z2ZFSV?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__258129________________"}],"offerCount":1} This is a Love Story, by Jessica Soffer $18 $20 now 10% off $18 Read by: Marin IrelandLength: 8 hrsSpeed I listened: 2x I’m not a huge fan of the actress Marin Ireland as a narrator. But I found that her voice slipped away whenever the narrative of this family — a Philip Roth-like writer, his artist wife, and their gallerist son — perked up, and that’s quite often. It takes a minute to get used to the form the book takes, as it’s told from several different perspectives. But otherwise, this is a moving and compelling Manhattan story. $18 at Amazon Buy $18 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"This is a Love Story by Jessica Soffer","image":"https://pyxis.nymag.com/v1/imgs/eed/309/e7bf66301b2f9b8be898eb5362c8c9249d-lovestory.jpg","brand":{"@type":"Brand","name":"Penguin Audio"},"offers":[{"@type":"Offer","price":18,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D9YVSD1N?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__258133________________"}],"offerCount":1} Source Code, by Bill Gates $18 $20 now 10% off $18 Read by: Wil WheatonLength: 11 hrs, 41 mins.Speed I listened: 2x I’m usually not that keen on a memoir that’s not read by the author, but I’m glad I gave Bill Gates’s new book a pass. (It’s read by the actor Wil Wheaton, who, thanks to narrating Ready Player One and The Martian, has become almost synonymous with heady and slightly dorky audiobooks.) I found Gates’s self-analysis here quite relatable and his journey from precocious kid to major player in the tech world very compelling. My favorite detail is that his favorite drink to order while in college was a Shirley Temple. $18 at Amazon Buy $18 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Source Code by Bill Gates","image":"https://pyxis.nymag.com/v1/imgs/613/291/c7b42d27ee40ee7b6c1359ca3af7fecb03-sourcecode.jpg","brand":{"@type":"Brand","name":"Random House Audio"},"offers":[{"@type":"Offer","price":18,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D5KHFN6C?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__258135________________"}],"offerCount":1} . Also Worth a Listen I excitedly tore through the nearly 23 hours of Lorne, by Susan Morrison, in a weekend. (I was her assistant for three years.) The surprising grotesquery of Victorian Psycho, by Virginia Feito, made me laugh out loud. Chelsea Handler did too, in her new memoir I’ll Have What She’s Having, which also convinced me I could use a life-lessons master class from the comedian. And I’m always here for thoughtful analysis about gossip, which is why I enjoyed You Didn’t Hear This From Me, by Kelsey McKinney. January Picks Presumed Guilty, by Scott Turow $31 $35 now 11% off $31 Read by: Grover GardnerLength: 20 hrs, 11 mins.Speed I listened: 2.1x I normally bristle at a 20-hour audiobook, but I found this second sequel to Turow’s 1987 thriller Presumed Innocent (first a Harrison Ford movie, which I have seen; more recently, a Jake Gyllenhaal Apple series I haven’t) completely gripping. Early on, I thought Grover Gardner’s voice was a bit fuddy-duddy, but I got used to it. In this installment, our protagonist Rusty chooses to defend his stepson, who is accused of murder. He’s now in his late 70s, and his company is addictive as ever. $31 at Amazon Buy $31 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Presumed Guilty, by Scott Turow","image":"https://pyxis.nymag.com/v1/imgs/953/4ed/0e03dab6c0672f77d4bd71799d942fe77f-presumedguilty-audio.jpg","brand":{"@type":"Brand","name":"Grand Central Publishing"},"offers":[{"@type":"Offer","price":31,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D63Z3KYR?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__256280________________"}],"offerCount":1} Playworld, by Adam Ross $24 $27 now 11% off $24 Read by: the authorLength: 22 hrs, 9 mins.Speed I listened: 2x It’s so unlike me, but here’s another 20-plus-hour audiobook that I couldn’t turn off. Well, that’s not completely true. A few hours into the saga of Griffin — a child actor growing up in New York City in 1980 — I was frustrated that he was caught between the sexual advances of two adults, one an older female family friend, the other his wrestling coach. But the book takes off when Griffin is cast in a movie by a Woody Allen–esque director. Ross, a former child actor himself, is an engaging reader of what must be a semi-autobiographical roman à clef. $24 at Amazon Buy $24 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Playworld by Adam Ross","image":"https://pyxis.nymag.com/v1/imgs/a09/03b/6eeeb007f45466c3f8a5ac075661ff56e7-playworld-audio.jpg","brand":{"@type":"Brand","name":"Random House Audio"},"offers":[{"@type":"Offer","price":24,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D47VH8M1?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__256298________________"}],"offerCount":1} The Three Lives of Cate Kay, by Kate Fagan $17 $19 now 11% off $17 Read by: Marin Ireland and othersLength: 9 hrs, 52 mins.Speed I listened: 2.2x For a while, the actress Marin Ireland was reading every big audiobook, and I just got tired of listening to her voice. So it’s a testament to the author and this novel that I found it so compelling. The book, a Reese Witherspoon pick about a best-selling writer and her hidden, tumultuous past, shares some similar DNA with The Seven Husbands of Evelyn Hugo (which I loved), and that’s definitely not a bad thing. $17 at Amazon Buy $17 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"The Three Lives of Cate Kay by Kate Fagan","brand":{"@type":"Brand","name":"Simon & Schuester Audio"},"offers":[{"@type":"Offer","price":17,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D684V8NT?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__256299________________"}],"offerCount":1} Wild West Village, by Lola Kirke $12 $14 now 14% off $12 Read by: the authorLength: 5 hrs, 35 mins.Speed I listened: 1.9x I thought the actress/singer Lola Kirke was great in Mozart in the Jungle and Mistress America. I had a fun afternoon writing about her when I worked at The Wall Street Journal. But in the last few years, she’s dropped off the Hollywood scene. She focused more on country music and, one assumes, writing this very honest, sometimes even shocking, book of essays about growing up in New York City in a dysfunctional family of eccentrics. In fact, the most pedestrian thing about the book is the title. Otherwise, Kirke comes off wise and introspective. She even got under my skin. $12 at Amazon Buy $12 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"Wild West Village by Lola Kirke","image":"https://pyxis.nymag.com/v1/imgs/cd6/851/cf925555a154e104b7a53af20d618d1758-wildwest-village.jpg","brand":{"@type":"Brand","name":"Simon & Schuster Audio"},"offers":[{"@type":"Offer","price":12,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D7MWRG9T?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__256300________________"}],"offerCount":1} In Gad We Trust, by Josh Gad $16 $18 now 11% off $16 Read by: the authorLength: 8 hrs, 4 mins.Speed I listened: 2.1x I didn’t want to like this memoir by the actor behind the voice of Olaf in Frozen and from The Book of Mormon, but almost immediately, Gad won me over. Or, Sacha Baron Cohen did, reading a short foreword in which the artist sometimes known as Borat says he’s wearing “very noisy clogs.” Gad is pretty name-droppy. Friends include Anne Hathaway, Bryce Dallas Howard, Johnny Depp, the late Chadwick Boseman, and pretty much anyone with whom he’s ever co-starred. Besides Cohen, Mel Brooks and Ron Howard pop in for seemingly unnecessary vocal cameos. But Gad is awfully charming, whether he’s detailing his tempestuous relationship with stage director James Lapine, his rise on the high-school forensics circuit, or his endearing emotions toward his growing daughters. We’d probably be friends, too. Josh — call me. $16 at Amazon Buy $16 at Amazon Buy @media screen and (max-width: 1179.9px) { .page-header .disclaimer-text_revenue, .section-header .disclaimer-text_revenue { display: block; } } @media screen and (min-width: 1180px) { .tertiary .disclaimer-text_revenue { display: block; } } {"@context":"http://schema.org","@type":"Product","name":"In Gad We Trust by Josh Gad","image":"https://pyxis.nymag.com/v1/imgs/29e/7e7/359c42a274d17b4c49ee203c64789628b7-ingadwetrust-audio.jpg","brand":{"@type":"Brand","name":"Simon & Schuster Audio"},"offers":[{"@type":"Offer","price":16,"priceCurrency":"USD","url":"https://www.amazon.com/dp/B0D681PN2K?tag=vulture-20&ascsubtag=__vu0301aam__cm6fidfv000000ifmne8ryd7f__256301________________"}],"offerCount":1} . Also Worth a Listen The Life Cycle of the Common Octopus, by Emma Knight, is a charming novel about the British class system and coming of age at college in Scotland. In the department of challenging relationships between daughters and their mothers, I enjoyed both the singer Neko Case’s The Harder I F'
