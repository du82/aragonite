ation with an artist who has always claimed her own spaces. By Jerry Saltz year in culture Dec. 27, 2024 The Bests of 2024All the books, podcasts, and anime (plus TV, movies, music, and more) that captivated our critics (and John Waters) this year. By Vulture Editors video games Dec. 18, 2024 Come for the Art, Stay for the ArtPunching Nazis is just a bonus in Indiana Jones and the Great Circle. By Lewis Gordon year in culture Dec. 16, 2024 Vulture’s 20 Most-Read Stories of 2024From brat summer to a scandalous fall, here’s what our readers loved most this year. By Vulture Editors profile Dec. 13, 2024 Lorraine O’Grady Finally Has the World’s AttentionAt 86, the artist had cemented her (belated) trailblazing status. By Jillian Steinhauer art review Dec. 11, 2024 Night BitchesAlex Katz, Matthew Barney, and Jamian Juliano-Villani face the darkness. By Jerry Saltz best of 2024 Dec. 6, 2024 The Best New York Art Shows of 2024Outsiders, Renaissance masterpieces, crazy quilts, and more. By Jerry Saltz the work of art Nov. 25, 2024 How Jonathan Franzen Learned to Write a Franzen NovelTo finish The Corrections, he had to kill his protagonist — and his idea of what a book should be. By Adam Moss ring ring … banana phone! Nov. 21, 2024 It’s One Banana, Michael. What Could It Cost? $6.2 Million?Comedian, the piece of fruit taped to a wall, sold to a crypto bro at auction. By Jason P. Frank art Nov. 20, 2024 The Extremely Chaotic Life of Jamian Juliano-VillaniLess than six months after her Gagosian solo show, the downtown artist-slash-gallerist lost her gallery and all her money. By Jay Bulger art review Nov. 13, 2024 Maps of Things PastThe brilliant art-world cartographies of Loren Munk. By Jerry Saltz art Nov. 5, 2024 Kehinde Wiley Can’t Believe This Is Happening to HimHe built an empire out of painting young Black men into art history. Can it survive accusations of sexual assault? By Rachel Corbett art review Oct. 30, 2024 Maybe KAWS Is Not So Bad After AllHis collection of outsider art, on display at the Drawing Center, is a marvel. By Jerry Saltz tributes Oct. 25, 2024 Gary Indiana’s Exuberant VenomThe late critic and novelist documented the seedy vanities and sorrows of American life with bitchiness and, sometimes, sympathy. By Brandon Sanchez art review Oct. 18, 2024 The Met’s Siena Renaissance Show Is a MasterpieceGo see it now. By Jerry Saltz scene report Oct. 11, 2024 Charli XCX Sculpts a MomentThe jobless made a pilgrimage to Storm King. By Jason P. Frank art review Oct. 11, 2024 A Black Surrealist Finally Gets His DueA solo exhibition of the poet and visual artist Ted Joans is a mostly fitting tribute to an artistic visionary. By Jack Denton art review Oct. 9, 2024 A World Without WeatherThe flat and deep paintings of Hilary Pecis. By Jerry Saltz art review Oct. 4, 2024 What Is a Brooklyn Artist?A sweeping survey at the Brooklyn Museum provides a lot of answers, none of which satisfy. By Jerry Saltz art review Sept. 20, 2024 Yvonne Well’s Patchwork HistoriesA new show spotlights how the artist’s abstract quilts tell the story of the African diaspora. By Jerry Saltz encounter Sept. 9, 2024 Thomas Houseago Was Mad at His Dad (and Larry Gagosian)It’s his first NYC gallery show in a decade, thanks in part to Leonardo DiCaprio. By Rachel Corbett fall preview 2024 Aug. 27, 2024 10 Art Shows We Can’t Wait to See This FallAn Alvin Ailey retrospective sets the tone for an array of eclectic offerings from the art world. By Jerry Saltz art review Aug. 22, 2024 Abigail Goldman’s American Horror StoryHer new show, “State of Nature,” depicts our depraved moment in miniature — literally. By Jerry Saltz public art watch July 31, 2024 A Sixteen-Foot-Tall Pigeon Comes to Nest on the High LinePlease don’t feed Iván Argote’s monumental Dinosaur. By Carl Swanson wwjd July 29, 2024 Da Vinci Would Have Loved the Olympics’ Controversial ‘Last Supper’The Catholic church of France, however, did not. By Jason P. Frank remembrance June 19, 2024 The Power and Grace of Barbara GladstoneThe venerated gallerist worked for the love of art. By Jerry Saltz art review June 14, 2024 Jenny Holzer’s Word SaladHer takeover of the Guggenheim reads like intellectual clickbait for the extended Trump era. By Jerry Saltz art review May 27, 2024 Maurizio Cattelan’s Enormous Wall of KitschA shiny bauble meant to comment on capitalism and to sell. By Jerry Saltz games people play May 24, 2024 Suing Richard PrinceStung when he felt ripped off by a famous artist, a photographer turned to the courts. By Choire Sicha profile May 20, 2024 Emil Ferris Still Believes in MonstersThe graphic novelist’s debut, My Favorite Thing Is Monsters, was a hit. Seven years later—after a contentious lawsuit—the sequel is finally coming. By Mark Yarm sexual assault May 19, 2024 Artist Kehinde Wiley Accused of Sexual AssaultBy Joseph Awuah-Darko, a British-born artist working in Ghana. By Bethy Squires art review May 14, 2024 LaToya Ruby Frazier’s MoMA Show Does Too MuchThe photographer wants to “stand in the gap between working-class and creative-class people.” But her show’s venue makes that impossible. By Madeline Leung Coleman favorite things May 9, 2024 Jerry Saltz’s 78 Indispensable Instagram AccountsInstagram changed our art critic’s life. Here, he recommends 78 of his favorite accounts that you should follow. By Jerry Saltz announcements May 1, 2024 Discover Jerry Saltz’s Favorite ThingsOur chief art critic is writing a pop-up, subscriber-only newsletter about the cultural works that shape his outlook. By The Editors art May 1, 2024 Maurizio Cattelan Takes the Piss Out of the Art WorldThe Italian artist’s first solo gallery show in decades is a provocative commentary on America’s ills. By Madeline Leung Coleman art review Apr. 24, 2024 Taxi Driver Was Always About RaceA new film by Arthur Jafa restores the Scorsese classic to its original intention. By Jerry Saltz the work of art Apr. 4, 2024 How’d You Make That?Three masterpieces from glimmer through struggle to breakthrough. By Adam Moss remembrance Mar. 27, 2024 Richard Serra’s Magnificent Balancing ActThe sculptor, who died this week, built massive houses of cards. By Jerry Saltz rip Mar. 27, 2024 Richard Serra, Sculptor of Monumental Steel Works, Dead at 85His jarring, site-specific works made him a landmark figure of the minimalist movement. By Zoe Guy it takes one to know one Mar. 22, 2024 The Art of the Royal Doppelgänger PhotoThere’s no better expert to turn to about faking a Kate Middleton shot than Alison Jackson. By David Mack art review Mar. 19, 2024 What to See and What to Skip at the Whitney BiennialJerry Saltz searches for the real thing at the museum’s latest survey of contemporary art. By Jerry Saltz art review Mar. 8, 2024 Byzantium RegainedThe Met’s exhibition of art from the African territories of the Byzantine Empire was a triumph. By Jerry Saltz encounter Feb. 26, 2024 Christopher Wool’s Punk-Rock Art Show in a Fidi TowerThe blue-chip artist is over museums, galleries — and pretty much everything else. By Rachel Corbett performance pieces Feb. 24, 2024 Want Enlightenment? Go to MoMA and Ask for CynthiaIf you keep buying things, you’ll never achieve understanding. By Jillian Steinhauer erect against the forces of evil Feb. 23, 2024 A Real-Life Rock Groupie Inspired Miley Cyrus’s Drive-Away Dolls CameoEthan Coen’s new caper takes cues from Cynthia “Plaster Caster,” an artist known for casting the erect penises of famous rock stars in plaster. By Lisa Liebman More Articles @media (min-width: 1180px) { [data-uri="www.vulture.com/_components/sticky-ad/instances/art-top@published"] { height: 2500px; } [data-uri="www.vulture.com/_components/sticky-ad/instances/art-top@published"]:last-child { flex: 0 0 2500px !important; } } Switched on Pop A podcast about the making and meaning of popular music Listen Now'
