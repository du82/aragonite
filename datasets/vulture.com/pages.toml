["https://www.vulture.com/article/best-demi-moore-movies-ranked.html"]
title = "The Best Demi Moore Movie Roles, Ranked"
description = "One dismissed as merely a ‘popcorn actress,’ Demi Moore’s Oscar buzz for ‘The Substance’ is an undeniable convergence of actor, role, and moment."
full_description = "vulture lists Feb. 24, 2025 Every Demi Moore Movie Performance, Ranked By Eddie Mouradian, a freelance writer covering pop culture and entertainment Photo-Illustration: Vulture; Photos: Columbia Pictures, Disney, Hollywood Pictures, Metropolitan Filmexport, MUBI, New Line Cinema, Paramount Pictures Demi Moore has entered the chat. With her transcendent performance in Coralie Fargeat’s The Substance, Moore steadily built a comeback narrative that led all the way to her first Oscar nomination. Her role as Elizabeth Sparkle, an actress of a certain age pushed aside by the industry until she is desperate enough to split herself in two, is an undeniable convergence of actor, role, and moment. Moore spent the past two decades working mostly in supporting roles in indie pictures — an intentional step back from the 1990s, when she made history as Hollywood’s highest-paid actress. For much of that decade, her string of Zeitgeist-stirring hits; her marriage to fellow superstar Bruce Willis; and her celebrity persona (including a controversial 1991 Vanity Fair cover, where she appeared naked and pregnant) made her one of the most famous people on the planet. Despite such movies as Ghost, Indecent Proposal, and Disclosure cementing her as one of the few women of the time who could open a film at the box office, Moore was often maligned by critics. At this year’s Golden Globes, where Moore won the first major acting award of her career, she gave a powerful speech in which she shared a story of a producer who told her she was a “popcorn actress” for whom awards and serious acting were not meant. How wrong he was! Yes, a look back on her filmography reveals her to be one of the greatest “popcorn actresses” of the past half-century, but even more so, a much more interesting actress than she was ever given credit for at the time. Are there missteps? There are many. Are there interminable and forgotten-to-time indie films? You can’t imagine. But more often than not, Moore holds the center of a movie, or drags a howler over the finish line with sheer presence, or simply gives a great performance. The Substance has landed Moore in the awards conversation for the first time in her four-decade career. In addition to winning the Golden Globe, she took home the Critics Choice and Screen Actors Guild awards for Best Actress and has been shortlisted at BAFTA, the Gothams, Independent Spirit awards and dozens of regional critics prizes. In a few short days, she may win her first Academy Award. To celebrate her long overdue welcome to Awards Season, we look back at the forty-plus films featuring Demi Moore, a movie star and actress. Note: We did not include films in which Moore has a glorified cameo, so this list does not include Young Doctors in Love, Love Sonia, or The Unbearable Weight of Massive Talent. Additionally, the film Wild Oats was excluded, as it premiered on cable, and Bunraku and Happy Tears were left off because they are unavailable for streaming. Also, no television. 43. The Scarlet Letter (1995) Roland Jaffe’s take on the high-school English literature classic about Hester Prynne (Demi Moore), shunned by her Puritan community for having an affair with a minister (Gary Oldman), lives down to its brutal reputation. The glacial pacing and clunky script work in tandem with deviations from the source text, including an inexplicable bathtub masturbation scene, to make a cinematic crime for the ages. No one gets out unscathed, but Moore is left holding the bag. She looks wildly out of place, as though this will turn into a time-travel movie in which Demi Moore reveals she was a ’90s girlboss sucked back in time via her Palm Pilot. If only … 42. Half Light (2006) Half Light is somewhat ahead of its time in that it feels like a straight-to-Netflix movie a decade before that was even a thing. Moore plays an author who heads to the Scottish coast to grieve the accidental drowning of her young son. There, she is haunted by her guilt, her dead child, and (for added cliché) her duplicitous husband and best friend. Moore treats the whole thing with the acting equivalent of a shoulder shrug, as though she knew by the middle of the first day of shooting this was unsalvageable. 41. Parasite (1982) Moore’s second big-screen film role comes in a schlock-horror B movie (C movie?) about Dr. Paul Deen (Michael Shoob), who is traversing the postapocalyptic United States while incubating a deadly parasite. In his travels, he runs into Moore’s gentle and kindly Patricia, a lemon farmer. It speaks to the quality of the film that despite so many unanswered questions about the state of the world, the titular parasite, and the roving gangs of often topless killers, the No. 1 question I’m left with is how effective and necessary are lemons in a dystopic future? Is lemonade a favored drink of parasites? Are lemons a form of currency in our new society? Moore has mostly disavowed her first few film roles, and with good reason. 40. Blind (2017) “Baldwin and Moore — together again!” … is something no one (not even me, a person who at 15 years old ran to the theater to see The Juror) wanted. Learning that this movie exists is a surprise; to find out it was released as recently as 2017 is bone-chilling. Unfortunately, its existence is the most memorable thing about it, as nothing in this movie sticks. It needs to be five levels more cheesy to reach Autumn in New York levels of camp, so, ultimately, it ends up being the kind of movie you just feel bad for watching. 39. Choices (1981) When is a movie not a movie? When it’s Choices, Moore’s big-screen debut. The quality of this film is so poor that it’s as though you’re watching the entire thing through a viewfinder. It’s so dark (literally, not plotwise — the movie has no plot) that I barely clocked Moore when she popped up more than halfway through the film as the protagonist’s love interest. Despite the movie featuring performances and quality that are one-part porn, one-part after-school special, and one-part home movie, there is something about Moore’s presence that does catch your interest. It’s not exactly a star-is-born moment, but she does shine bright enough to be the only thing in Choices you can see clearly. 38. Blame It on Rio (1984) Demi Moore herself called this a “dirty old man” comedy; she was not wrong. Blame It on Rio tells the tale of two middle-aged men who head to Rio de Janeiro to chase young girls amid marital woes. Did I mention that Old Man No. 1 (Michael Caine) is chasing Old Man No. 2’s (Joseph Bologna) daughter (Michelle Johnson)? And that said daughter refers to her new lover as “Uncle Matthew”? Or that Johnson had to get court permission to be naked in the film because she was under age? It feels less like a movie and more like something Detective Olivia Benson should be investigating. What saves this from the absolute bottom of the list is that Moore, playing Caine’s daughter, Nikki, is saved from any sexual high jinks with her dad’s BFF by disappearing for much of the movie. 37. Nothing But Trouble (1991) Nothing But Trouble is difficult to watch. Not hard to find, just hard to endure. I’d try to describe the plot, but I am worried someone would send over a wellness check. Nothing could have made this movie work, but when Dan Aykroyd plays both a deformed judge and an overgrown, diaper-clad man-baby, you know Demi Moore will be entirely out of her depth. She has zero chemistry with her co-lead, Chevy Chase (complimentary), and is neither playing it straight enough nor broad enough to break through the noise. Then again, perhaps breaking through a movie that takes place in a dumpster, has a roller coaster called “Mr. Bonestripper,” and includes John Candy playing both a police officer and his own twin sister is not something one should aspire to. Moore would prove to be a fun, lighter screen presence in later films, but this first shot at broad comedy ain’t it. 36. Songbird (2020) Songbird takes place in 2024, when the mutated virus, COVID-23, has sent the world into its fourth year of quarantine. Moore plays a wealthy matriarch selling illegal immunity bracelets in this new-world order for reasons too convoluted to explain. She gets involved with, among other people, Archie from Riverdale. I can’t imagine a movie anyone would want to watch less in the ninth month of our own very real, very much still-happening pandemic — or the fifth year, for that matter. 35. LOL (2012) Imagine if someone took your grandpa shouting “You know the problem with this generation? They’re always on their phones!” and made it into a movie. Moore plays Anne, a divorced mom trying to connect with her rebellious daughter, Lola (Miley Cyrus), who is too busy texting to talk to her mother. It’s the kind of movie that already felt dated the moment filming wrapped, so a decade-plus later, it’s as relevant as your dormant Friendster account. Moore tries her best, but this movie isn’t interested in her exasperated single mom, leaving her to chug wine and do a lot of worrying. 34. The Butcher’s Wife (1991) Unlike many of her contemporaries — Meg Ryan, Julia Roberts, Sandra Bullock — Moore never went the romantic-comedy route. After watching The Butcher’s Wife, you can understand why she may have stayed away. She stars as Marina, a clairvoyant from Ocracoke, North Carolina, who believes the New York butcher who washes up on her shore is the soul mate she saw in her dreams. She marries him and heads to New York City, where every member of the neighborhood treats the local butcher shop as Central Perk, popping in for lamb chops and love advice that is so folksy it should be served with a jug band underscoring it. Moore plays Marina as a mix of Ariel post-legs in The Little Mermaid, shocked by everything she encounters, and Amy Adams in Junebug if she were struck by lightning. The movie can’t decide on its fable underpinnings, and Moore doesn’t seem to be on stable ground — no matter how egregious her blonde wig or broad her country-fried accent. 33. Corporate Animals (2019) In this Ruben Östlund–lite dark comedy, Moore plays an unhinged CEO who takes her team on a retreat that ends in cannibalism. Everything is pitched to an 11, but the film isn’t quite as clever in its satire as it wants, throwing around hot-button issues with abandon in a “look how controversial we are” sort of way. But I’d be lying if, every now and again, I didn’t crack a smile at just how batshit the proceedings were — in many cases thanks to Moore’s demented performance. The movie might occur in a cave, but Moore plays to the rafters as one of the most awful people ever committed to film. She’s enjoying herself; I just wish the audience was too. 32. Deconstructing Harry (1997) In the mid-’90s, during one of his renaissance periods, post–Bullets Over Broadway and Mighty Aphrodite, it was almost a contractual obligation for A-listers to take a small part in one of Woody Allen’s ensembles. It’s hard for Moore to do much with the role since it’s so clear that Allen, the writer, star, and director, has such open disdain for her character, a fictionalized version of his ex-wife in the film. Moore gets a surrealist scene where she lays into Allen’s character, but it lacks the sting his character so clearly deserves. 31. Another Happy Day (2011) This aggressively miserable movie about a dysfunctional family coming together for a wedding is written and directed by Sam Levinson, the creator of Euphoria. And, man, it doesn’t let you forget it. From drug-addled teens to deep-seated-yet-generic family trauma to all the histrionics (there’s so much yelling, you guys), it’s the ur-text for the soaring highs and self-indulgent lows of Euphoria High. As the groom’s stepmother, Moore is the second wife of Ellen Barkin’s nightmares. We’re supposed to hate Moore’s uppity interloper, Patty, but twist! The movie underestimates just how much we also hate Barkin’s erratic Lynn. Moore is sharp-tongued and acidic, but there are so many more levels of awful that you wish she would take this awful character to. 30. We’re No Angels (1989) A titan of the craft, his acting heir apparent, and an up-and-coming international director. Theoretically, one could understand why an on-the-rise Demi Moore would want to co-star with Robert De Niro and Sean Penn in Neil Jordan’s remake of a 1955 Humphrey Bogart film. (To put this in perspective for today, that would be like Leonardo DiCaprio and Timothée Chalamet starring in a remake of Rain Man directed by Justine Triet, which sounds terrible, but you get the idea.) Moore plays Molly, a tough-as-nails single mother and sometimes sex worker who gets involved with De Niro’s escaped convict, Ned. Moore holds her own against De Niro (although I kind of wish we saw her and Penn together), but ultimately has very little to do except deliver a New Yawk accent so thick she might as well be shaking her fist and screaming, “Why I oughttaaaaa!” 29. Very Good Girls (2013) Another year, another mom in the background. Considering how picky Moore became with projects later in her career, this one’s a bit of a head-scratcher. It’s not that Very Good Girls, the story of two best friends (Dakota Fanning and Elizabeth Olsen) who fall in love with the same guy, is particularly bad — at worst, it’s just kind of slight. It’s more that Moore has so little to do as Olsen’s mom you wonder what drew her to the film in the first place. Despite limited screen time, it’s nice to see Moore as this supportive, warm, and safe space for her daughter. 28. Mr. Brooks (2007) After a string of ensemble, supporting, and indie films, in 2007 Moore returned to co-leading films with fellow movie stars. The prospect of Prom Queen and Prom King of ’90s cinema, Demi Moore and Kevin Costner, headlining a movie together ends in disappointment in this nonsensical thriller. While Moore is expectedly steely as a damaged cop who ends up on serial-killer Costner’s trail, the movie makes the odd decision to sideline her from the main action with minimal interaction with Costner. Instead, she deals mostly with a separate set of escaped murderers and Costner’s protégé, serial-killer-in-training Dane Cook. Yes, Dane Cook. She deserved better. 27. Passion of the Mind (2000) Moore is quite good in this romantic drama about a woman simultaneously living two lives. She plays the confusion about her situation, the love for the two men in her life, and the peril of what to do in a way that had been absent from her more recent string of roles in this period. The problem, however, is that the performance is trapped in a movie that is — and this is a technical term — a complete and total slog. Trivia alert: The Substance writer-director, Coralie Fargeat served as an assistant director on Passion of the Mind. 26. Wisdom (1986) Demi Moore starred with her then-fiancé, Emilio Estevez, in his directorial debut, which is essentially Muppet Babies Bonnie and Clyde. Estevez stars as John Wisdom, a co"
