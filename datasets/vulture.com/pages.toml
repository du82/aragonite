title = "Drake Postpones Australian Tour for ‘Scheduling Conflict’"
description = "Drake postponed the final four dates of his Australian tour for “a scheduling conflict,’ including shows in Brisbane, Sydney, and Auckland, New Zealand."
full_description = '''postponements Feb. 26, 2025 Drake Has $ome Postponed Tour Dates 4 AU By Justin Curto, who covers music, TV, and celebrity for Vulture Drake. Photo: Vaughn Ridley/NBAE/Getty Images Drake is cutting his trip down under short — at least for now. The rapper postponed the final four dates of his Australian tour for “a scheduling conflict,” his rep told Rolling Stone Australia. “We are actively working on rescheduling these dates along with adding some additional shows,” the rep said. The postponed dates include a show in Brisbane on March 4, one in Sydney on March 7, and two in Auckland, New Zealand, on March 15–16. And those New Zealand dates had already been pushed back once, after they were originally set for February 28 and March 1. News of the postponement came shortly after Drake finished a show in Brisbane on February 25, as the venue websites deleted mention of the upcoming shows. Drake had so far played 12 shows in Australia on his Anita Max Win tour. It was his first time on the continent since 2017 — and, conveniently, it helped him get as far away from the U.S. as possible for Kendrick Lamar’s Super Bowl halftime show. Mid-tour, he released his new album with PartyNextDoor, $ome $exy $ongs 4 U. These last-minute tour postponements have become routine for Drake. The rapper delayed the beginning of his 2023 It’s All a Blur tour with 21 Savage multiple times with little explanation. Before that, in 2018, he pushed the start of his tour with Migos back last-minute. Related The Boy Who Cried Wolf Drake Is in His Reputation Era Tags: music tours drake anita max win tour cancellations postponements More Show Leave a Comment Drake Has $ome Postponed Tour Dates 4 AU const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const 