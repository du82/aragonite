full_description = '''winner girl Updated 5:20 P.M. The Brit Awards? More Like the Brat Awards By Alejandra Gularte, a Vulture news blogger who covers TV and comedy Can you guess the color of… Photo: Gareth Cattermole/Getty Images Should we do a little tea to celebrate Charli XCX’s nominations at the 2025 Brit Awards? The 365 party girl is the most nominated artist at this year’s show, with five nominations and three wins for the night, not including her one win for Songwriter of the Year. As for the performances of the evening, a few Americans made their way across the pond to move and groove with the Brits: Sabrina Carpenter and Teddy Swims belted out their hits in London (Shaboozey was originally scheduled to perform but had to cancel.) For the locals, nominated Brits Sam Fender, Lola Young, JADE, Myles Smith, The Last Dinner Party, Ezra Collective, and Jorja Smith performed as well. Plus, the Brits confirmed it’s a safe place for HorsegiirLs everywhere. Below are all the winners for the 2025 Brit Awards. British Album of the YearCharli XCX – BratThe Cure – Songs of a Lost WorldDua Lipa – Radical OptimismEzra Collective – Dance, No One’s WatchingThe Last Dinner Party – Prelude to Ecstasy Song of the YearArtemas – “I Like the Way You Kiss Me”The Beatles – “Now and Then”Bl3ss with Camrin Watsin featuring Bbyclose – “Kisses”Central Cee featuring Lil Baby – “Band4Band”Charli XCX featuring Billie Eilish – “Guess”Chase & Status featuring Stormzy – “Backbone”Coldplay – “Feelslikeimfallinginlove”Dua Lipa – “Training Season”Ella Henderson featuring Rudimental – “Alibi”JADE – “Angel of My Dreams”Jordan Adetunji – “Kehlani”KSI featuring Trippie Redd – “Thick of It”Myles Smith – “Stargazing”Sam Ryder – “You’re Christmas to Me”Sonny Fodera with Jazzy and D.O.D. – “Somedays” British Artist of the YearBeabadoobeeCentral CeeCharli XCXDua LipaFred again..Jamie xxMichael KiwanukaNia ArchivesRachel ChinouririSam Fender British GroupBring Me the HorizonColdplayThe CureEzra CollectiveThe Last Dinner Party Best Pop ActCharli XCXDua LipaJADELola YoungMyles Smith Best R&B ActCleo SolFloJorja SmithMichael KiwanukaRaye Best Dance ActBecky HillCharli XCXChase & StatusFred again..Nia Archives Best Alternative/Rock ActBeabadoobeeThe CureEzra CollectiveThe Last Dinner PartySam Fender Best Hip Hop/Grime/Rap Act Central CeeDaveGhettsLittle SimzStormzy Best New ArtistEnglish TeacherEzra CollectiveThe Last Dinner PartyMyles SmithRachel Chinouriri International Artist of the YearAdrianne LenkerAsakeBenson BooneBeyoncéBillie EilishChappell RoanKendrick LamarSabrina CarpenterTaylor SwiftTyler, the Creator International Group of the YearAmyl and the SniffersConfidence ManFontaines D.C.Future and Metro BoominLinkin Park Best International SongBenson Boone – “Beautiful Things”Beyoncé – “Texas Hold ‘Em”Billie Eilish – “Birds of a Feather”Chappell Roan – “Good Luck, Babe!”Djo – “End of Beginning”Eminem – “Houdini”Hozier – “Too Sweet”Jack Harlow – “Lovin on Me”Noah Kahan – “Stick Season”Post Malone featuring Morgan Wallen – “I Had Some Help”Sabrina Carpenter – “Espresso”Shaboozey – “A Bar Song (Tipsy)”Taylor Swift featuring Post Malone – “Fortnight”Teddy Swims – “Lose Control”Tommy Richman – “Million Dollar Baby” Rising StarElmieneGood Neighbours﻿Myles Smith Songwriter of the YearCharli XCX Producer of the YearA.G. Cook Global Success AwardSabrina Carpenter Related The Golden Globes Will Stop Paying Voters $75,000 Salaries The 2025 Oscars Will Have Conan O’Brien, a Wicked Performance, and a Surprise The Tyranny of the GlamBOT Must End Tags: brit awards 2025 news music winners list awards season charli xcx winner girl More Show Leave a Comment The Brit Awards? More Like the Brat Awards const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const s