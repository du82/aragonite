["https://www.vulture.com/article/bhad-bhabie-diss-track-alabama-barker.html"]
title = "Bhad Bhabie’s Alabama Barker Diss Track, Explained"
description = "Bhad Bhabie (the ‘cash me outside’ girl) and Alabama Barker (daughter of Travis Barker) are in something resembling a rap beef. How Romy Mars, Kanye West, and the rest of us got involved."
full_description = '''what dr. phil hath wrought Updated Feb. 28, 2025 Bhad Bhabie Twerks on ‘Travis Barker’ While Dissing His Daughter By Jason P. Frank, a Vulture writer covering comedy, theater, and music Bhabie and Barker. Photo-Illustration: Vulture; Photos: Xavier Collin/Image Press Agency/Alamy, Mat Hayward/Getty Images Bhad Bhabie is beefing with Alabama Barker. And for those of you who need a brain-rot-to-normal translation: The “Cash Me Outside, How ’Bout Dah” girl is in a feud with Kim Kardashian’s step-daughter-in-law. And for those of you who are still confused: Please invite us to the rock you’re living under. The Great White-Girl-Off of 2025 actually began in the last months of 2024 but really escalated this February, with both rappers releasing tracks that somehow dragged in Ty Dolla $ign, Quentin Tarantino, and Latto. We’ll spoil this now: None of those people have responded to the fight publicly yet. Still, Bhabie’s most recent track, “Ms. Whitman,” is going viral, and we are paying attention (not saying we’re proud of that, but it is true). A rundown of everything that’s happened, including Kanye West’s accidental co-sign and Romy Mars’s next great work of art. Hey, who are these people? Alabama Barker is the daughter of actress Shanna Moakler and Blink-182’s Travis Barker, making her Kourtney Kardashian’s step-daughter as of May 2022. She was born during the last season of MTV’s Meet the Barkers, so you can say that she’s been making entertainment since birth. She’s facing off against Bhad Bhabie, the rap persona of the “cash me outside” girl, the Dr. Phil meme persona of a woman named Danielle Bregoli. What years were these people born? Bhad Bhabie was born in 2003 and Alabama Barker was born in 2005. What began the beef? The fight began over Bhabie’s babydaddy, LeVaughn, whom Bhabie claims Barker tried to steal while they were spending some time apart. In a rant on Instagram Stories on December 18 that was recorded by TMZ, Bhabie claimed that she and LeVaughn got into a physical fight after she cheated on him, leading them to spend two weeks apart, at which point he met Alabama. Then, Bhabie claims she later tracked LeVaughn’s car to Alabama’s neighborhood, leading Alabama to admit that she and LeVaughn “linked” a few times, but she thought he was someone else. “First of all,” Bhabie says in the video, “he has my name tattooed on his neck.” All this led to LeVaughn and Bhabie breaking up. How did it become a “rap” beef? Bhabie fired the first shot in the beef on January 26 with her song “Over Cooked.” “Bitch you want my life, you want the dick I get,” Bhabie intones as the track begins. Then she claims “E’rybody know this bitch weird,” which is somehow more hurtful. Bhabie also claims on the track that Barker at some point got pregnant and had an abortion, before later claiming on an Instagram Story that Barker was never pregnant with LeVaughn’s baby but instead “was pregnant by Tyga,” a.k.a. Kylie Jenner’s ex, “and she was fucking on Soulja Boy.” On January 29, Barker said she was “absolutely not” pregnant with Tyga’s baby at any point via TikTok comments. Tyga denied the relationship on X on January 30. “This the dumbest shit I ever heard,” he wrote. “I have never had any sort of physical relationship with Alabama. It’s honestly ridiculous I even have to address it.” Did Alabama Barker drop a diss track? She sure did. On February 7, she put out a song called “Cry Bhabie.” “Can’t believe I heard a diss track, this ho don’t like me,” Barker raps on the song, and we admit to being surprised by her surprise. Danielle Bregoli definitely does not like you. She later adds that “I was out in LV, and LV tried to pipe me, I can’t even cap, I didn’t know he was your BD.” To be fair, Bhabie did already address this by saying he has a tattoo of her name on his neck, but then again, “skills of observation” are not what’s being battled over here. Who’s “Ms. Whitman?” Finally, on February 25, Bhabie released what just might be the killshot: a music video for “Ms. Whitman” — a reference to the prostitute from Quentin Tarantino’s True Romance that Alabama Barker was named after. In the video, Bhabie raps that Barker’s “stanky pussy got you kicked out the Kardashian house” and twerks on a Travis Barker lookalike. She also fires shots at Kourtney Kardashian, saying “Your stepmom burnt out, why she took her sister’s second-hand?” Previously, Barker admitted to having a crush on Kim K while she was Paris Hilton’s assistant. She also claims that Barker stole her flow from the rapper Latto and threatens to “Will Smith” Barker’s mouth. Notably, the song is based on the beat from Ye and Ty Dolla $ign’s “Carnival,” which could be a reference to Kim Kardashian’s ex-husband or could just be for fun. Did Ye respond? He sure did. On February 26, he posted an Instagram Story denying involvement in this feud (even though he did, in fact, approve the sample). “I just talked to Travis Barker,” he said. “I would never be in the middle — I don’t even know what’s goin’ on.” That, we believe. Then he added that “I just got sent a song and asked if I could clear the sample.” It’s not hard to imagine a series of Kardashians, including Barker, calling Ye and ye-lling at him for approving this. But we’d believe if he had never heard of either of these women till now. Wait, what’s Romy Mars’s role in this? Nepo-on-nepo crime has never been higher. Romy Mars, daughter of Sofia Coppola, posted a since-deleted TikTok on February 26 making fun of Alabama Barker. It’s not explicitly pro-Bhabie, but it’s hard not to see it in that context, given the current climate. “Genuine question: What the fuck is Alabama Barker getting ready for?” Mars asks in the video, referring to Barker’s TikTok get-ready-with-me videos and livestreams. “It’s like the Met Gala every single — twice a day! Three times a day with this girl.” “There’ll be like 15 people doing her hair and her makeup and her toenails and her nails and her … I don’t get it.” Importantly, this whole time she’s in a pajama top, gesticulating with a plastic fork in her hand. Then, she ends the video by taking a bite of what appears to be a kale caesar salad with avocado, based on how hungry I currently am. These Coppolas know how to make content. Sofia Coppola’s daughter Romy Mars coming for Alabama Barker 💀 pic.twitter.com/EfWTEdXNUK— Gibson Johns (@gibsonoma) February 27, 2025 window.twttr = (function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {}; if (d.getElementById(id)) return t; js = d.createElement(s); js.id = id; js.src = "https://platform.twitter.com/widgets.js"; fjs.parentNode.insertBefore(js, fjs); t._e = []; t.ready = function (f) { t._e.push(f); }; return t; }(document, "script", "twitter-wjs")); What’s Barker’s next move? Prior to the release of “Ms. Whitman,” Barker did post a TikTok captioned “Anyways who’s ready for pt2? On my way to the studio, I tried to end the war here we go.” @alabamabarker Babe what else do u want from me ?! Not my fault he HATES home. ♬ original sound - Be On Your Feelings Related Can Bhad Bhabie Rap? What’s Going On With Travis Barker, Shanna Moakler, and the Kardashians? Bhad Bhabie Details ‘Abuse’ at Utah Ranch Where Dr. Phil Sends Teens Tags: alabama barker bhad bhabie danielle bregoli news rap rap beefs music levaughn cash me outside what dr. phil hath wrought travis barker More Show Leave a Comment Bhad Bhabie Twerks on ‘Travis Barker’ on Alabama Barker Diss const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'vulture'; const keywords = ["alabama barker","bhad bhabie","danielle bregoli","news","rap","rap beefs","music","levaughn","cash me outside","what dr. phil hath wrought","travis barker"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
