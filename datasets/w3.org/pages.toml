["https://w3.org/policies/process"]
title = "W3C Process Document"
full_description = "Relation of Process Document to Patent Policy and Other Policies W3C Members' attention is called to the fact that provisions of the Process Document are binding on Members per the Membership Agreement [MEMBER-AGREEMENT]. The W3C Patent Policy [PATENT-POLICY] and other policies incorporated by normative reference as a part of the Process Document are equally binding. The Patent Policy and CEPC place additional obligations on Members, Team, and other participants in W3C. The Process Document does not restate those requirements but includes references to them. The Process Document, Patent Policy, and CEPC have been designed to allow each to evolve independently. In the Process Document, the term “participant” refers to an individual, not an organization. Conformance and specialized terms The terms must, must not, should, should not, required, and may are used in accordance with RFC 2119. The term not required is equivalent to the term may as defined in RFC2119 [RFC2119]. Some terms have been capitalized in this document (and in other W3C materials) to indicate that they are entities with special relevance to the W3C Process. These terms are defined within this document, and readers are reminded that the ordinary English definitions are insufficient for the purpose of understanding this document. 1. Introduction W3C work revolves around the standardization of Web technologies. To accomplish this work, W3C follows processes that promote the development of high-quality standards based on the consensus of the Membership, Team, and public. W3C processes promote fairness, responsiveness, and progress: all facets of the W3C mission. This document describes the processes W3C follows in pursuit of its mission. The W3C Process promotes the goals of quality and fairness in technical decisions by encouraging consensus, soliciting reviews (by both Members and public), incorporating implementation and interoperability experience, and requiring Membership-wide approval as part of the technical report development process. Participants in W3C include representatives of its Members and the Team, as well as Invited Experts who can bring additional expertise or represent additional stakeholders. Team representatives both contribute to the technical work and help ensure each group’s proper integration with the rest of W3C. W3C’s technical standards, called W3C Recommendations, are developed by its Working Groups; W3C also has other types of publications, all described in § 6 W3C Technical Reports. W3C has various types of groups; this document describes the formation and policies of its chartered Working Groups and Interest Groups, see § 3.1 Policies for Participation in W3C Groups and § 3.4 Chartered Groups: Working Groups and Interest Groups. W3C also operates Community and Business Groups, which are separately described in their own process document [BG-CG]. In addition, several groups are formally established by the Consortium: the W3C Advisory Committee, which has a representative from each Member, and two oversight groups elected by its membership: the Advisory Board (AB), which helps resolve Consortium-wide non-technical issues and manages the evolution of the W3C process; and the Technical Architecture Group (TAG), which helps resolve Consortium-wide technical issues. Here is a general overview of how W3C initiates standardization of a Web technology: People generate interest in a particular topic. For instance, Members express interest by developing proposals in Community Groups or proposing ideas in Member Submissions. Also, the Team monitors work inside and outside of W3C for signs of interest, and helps organize Workshops to bring people together to discuss topics that interest the W3C community. When there is enough interest and an engaged community, the Team works with the Membership to draft proposed Interest Group or Working Group charters. W3C Members review the proposed charters, and when there is support within W3C for investing resources in the topic of interest, W3C approves the group(s), and they begin their work. Further sections of this Process Document deal with topics including liaisons (§ 9 Liaisons), confidentiality (§ 7 Dissemination Policies), and formal decisions and appeals (§ 5 Decisions). 2. Members and the Team W3C’s mission is to lead the Web to its full potential. W3C Member organizations provide resources to this end, and the W3C Team provides the technical leadership and organization to coordinate the effort. 2.1. Members W3C Members are organizations subscribed according to the Membership Agreement [MEMBER-AGREEMENT]. They are represented in W3C processes as follows: One representative per Member organization participates in the Advisory Committee which oversees the work of W3C. Representatives of Member organizations participate in Working Groups and Interest Groups, where they author and review technical reports. W3C membership is open to all entities, as described in “How to Join W3C” [JOIN]; (refer to the public list of current W3C Members [MEMBER-LIST]). The Team must ensure that Member participation agreements remain Team-only and that no Member receives preferential treatment within W3C. While W3C does not have a class of membership tailored to individuals, individuals may join W3C. Restrictions pertaining to related Members apply when the individual also represents another W3C Member. 2.1.1. Rights of Members Each Member organization enjoys the following rights and benefits: A seat on the Advisory Committee; Access to Member-only information; The Member Submission process; Use of the W3C Member logo on promotional material and to publicize the Member’s participation in W3C. For more information, please refer to the Member logo usage policy described in the New Member Orientation [INTRO]. Furthermore, subject to further restrictions included in the Member Agreement, representatives of Member organizations participate in W3C as follows: In Working Groups and Interest Groups. In Workshops and Symposia; On the Team, as W3C Fellows. The rights and benefits of W3C membership [MEMBER-AGREEMENT] are contingent upon conformance to the processes described in this document. Disciplinary action for anyone participating in W3C activities is described in § 3.1.1.1 Expectations and Discipline. Additional information for Members is available at the Member website [MEMBER-HP]. 2.1.2. Member Associations and Related Members 2.1.2.1. Membership Associations A “Member Association” means a consortium, user society, or association of two or more individuals, companies, organizations or governments, or any combination of these entities which has the purpose of participating in a common activity or pooling resources to achieve a common goal other than participation in, or achieving certain goals in, W3C. A joint-stock corporation or similar entity is not a Member Association merely because it has shareholders or stockholders. If it is not clear whether a prospective Member qualifies as a Member Association, the CEO may reasonably make the determination. For a Member Association, the rights and privileges of W3C Membership described in the W3C Process Document extend to the Member Association's paid staff and Advisory Committee representative. Member Associations may also designate up to four (or more at the Team’s discretion) individuals who, though not employed by the organization, may exercise the rights of Member representatives. For Member Associations that have individual people as members, these individuals must disclose their employment affiliation when participating in W3C work. Provisions for related Members apply. Furthermore, these individuals must represent the broad interests of the W3C Member organization and not the particular interests of their employers. For Member Associations that have organizations as Members, all such designated representatives must be an official representative of the Member organization (e.g. a Committee or Task Force Chairperson) and must disclose their employment affiliation when participating in W3C work. Provisions for related Members apply. Furthermore, these individuals must represent the broad interests of the W3C Member organization and not the particular interests of their employers. For all representatives of a Member Association, IPR commitments are made on behalf of the Member Association, unless a further IPR commitment is made by the individuals' employers. 2.1.2.2. Related Members In the interest of ensuring the integrity of the consensus process, Member involvement in some of the processes in this document is affected by related Member status. As used herein, two Members are related if: Either Member is a subsidiary of the other, or Both Members are subsidiaries of a common entity, or The Members have an employment contract or consulting contract that affects W3C participation. A subsidiary is an organization of which effective control and/or majority ownership rests with another, single organization. Related Members must disclose these relationships according to the mechanisms described in the New Member Orientation [INTRO]. 2.2. The W3C Team The Team consists of CEO, W3C paid staff, unpaid interns, and W3C Fellows. W3C Fellows are Member employees working as part of the Team; see the W3C Fellows Program [FELLOWS]. The Team provides technical leadership about Web technologies, organizes and manages W3C activities to reach goals within practical constraints (such as resources available), and communicates with the Members and the public about the Web and W3C technologies. The CEO may delegate responsibility (generally to other individuals in the Team) for any of their roles described in this document. Team Decisions derive from the CEO's authority, even when they are carried out by other members of the Team. Oversight over the Team, budgeting, and other business decisions, is provided by the W3C Board of Directors, rather than managed directly by the Process. Note: See the W3C Bylaws for more details on the Board and overall governance of W3C. 3. Groups and Participation For the purposes of this Process, a W3C Group is one of W3C’s Working Groups, Interest Groups, Advisory Committee, Advisory Board, or TAG, and a participant is a member of such a group. 3.1. Policies for Participation in W3C Groups 3.1.1. Individual Participation Criteria 3.1.1.1. Expectations and Discipline There are three qualities an individual is expected to demonstrate in order to participate in W3C: Technical competence in one’s role; The ability to act fairly; Social competence in one’s role. Advisory Committee representatives who nominate individuals from their organization for participation in W3C activities are responsible for assessing and attesting to the qualities of those nominees. Participants in any W3C activity must abide by the terms and spirit of the W3C Code of Ethics and Professional Conduct [CEPC] and the participation requirements described in “Disclosure” in the W3C Patent Policy [PATENT-POLICY]. The CEO may take disciplinary action, including suspending or removing for cause a participant in any group (including the AB and TAG) if serious and/or repeated violations, such as failure to meet the requirements on individual behavior of (a) this process and in particular the CEPC, or (b) the membership agreement, or (c) applicable laws, occur. Refer to the Guidelines to suspend or remove participants from groups. 3.1.1.2. Conflict of Interest Policy Individuals participating materially in W3C work must disclose significant relationships when those relationships might reasonably be perceived as creating a conflict of interest with the individual’s role at W3C. These disclosures must be kept up-to-date as the individual’s affiliations change and W3C membership evolves (since, for example, the individual might have a relationship with an organization that joins or leaves W3C). Each section in this document that describes a W3C group provides more detail about the disclosure mechanisms for that group. The ability of an individual to fulfill a role within a group without risking a conflict of interest depends on the individual’s affiliations. When these affiliations change, the individual’s assignment to the role must be evaluated. The role may be reassigned according to the appropriate process. For instance, the Team may appoint a new group Chair when the current Chair changes affiliations (e.g., if there is a risk of conflict of interest, or if there is risk that the Chair’s new employer will be over-represented within a W3C activity). The following are some scenarios where disclosure is appropriate: Paid consulting for an organization whose activity is relevant to W3C, or any consulting compensated with equity (shares of stock, stock options, or other forms of corporate equity). A decision-making role/responsibility (such as participating on a Board) in other organizations relevant to W3C. A position on a publicly visible advisory body, even if no decision-making authority is involved. Individuals seeking assistance on these matters should contact the Team. Team members are subject to the W3C Team conflict of interest policy [CONFLICT-POLICY]. 3.1.1.3. Individuals Representing a Member Organization Generally, individuals representing a Member in an official capacity within W3C are employees of the Member organization. However, an Advisory Committee representative may designate a non-employee to represent the Member. Non-employee Member representatives must disclose relevant affiliations to the Team and to any group in which the individual participates. In exceptional circumstances (e.g., situations that might jeopardize the progress of a group or create a conflict of interest), the CEO may decline to allow an individual designated by an Advisory Committee representative to participate in a group. A group charter may limit the number of individuals representing a W3C Member (or group of related Members). 3.1.2. Meetings The requirements in this section apply to the official meetings of any W3C group. W3C distinguishes two types of meetings: A face-to-face meeting is one where most of the attendees are expected to participate in the same physical location. A distributed meeting is one where most of the attendees are expected to participate from remote locations (e.g., by telephone, video conferencing, or IRC). A Chair may invite an individual with a particular expertise to attend a meeting on an exceptional basis. This person is a meeting guest, not a group participant. Meeting guests do not have voting rights. It is the responsibility of the Chair to ensure that all meeting guests respect the chartered level of confidentiality and other group requirements. 3.1.2.1. Meeting Scheduling and Announcements Meeting announcements should be sent to all appropriate group mailing lists, i.e. those most relevant to the anticipated meeting participants. The following table lists recom"
