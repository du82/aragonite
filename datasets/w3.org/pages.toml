full_description = "Resources Read this page in: 中文（简体） 日本語 Learn from curated resources and our online training, or participate in W3C via discussion lists, blogs, translations, and other means. Find information News and events W3C news is published on the W3C home page, then moves to archives. W3C News and events Blog W3C Team and work group chairs use the blog for longer and more specific communications. Go to the W3C Blog Mailing lists Each mailing list has a purpose: some are for general discussions, others are for specific topics. Learn more about W3C mailing lists W3C Members resources Member homepage Advisory Committee Representatives from W3C Member organizations will find here practical guidance regarding events, Process, Patent Policy, and standards promotion. Visit the Member site (restricted) Onboarding videos Short and practical videos to understand key aspects of being a W3C Member. View the collection on YouTube W3C Member Relations The W3C Member Relations team ensures member satisfaction and participation in W3C groups and events. Meet the W3C Member Relations team Master web fundamentals W3C Developers The one-stop place to find the information and tools you need to learn, build, and move the Web forward. W3C Developers Learn more Online training Under the name W3Cx, W3C develops MOOCs (Massive Open Online Courses) that help web developers increase their skills and empower them to become the next leaders and innovators on the web. Free online courses from W3Cx W3C Developer Relations The W3C Developer Relations team ensures excellent relationships with and participation from our growing and diverse community. Meet the W3C Community Management team"
