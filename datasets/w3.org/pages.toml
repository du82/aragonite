["https://w3.org/WAI/standards-guidelines"]
title = "W3C Accessibility Standards Overview | Web Accessibility Initiative (WAI) | W3C"
description = "Accessibility resources free online from the international standards organization: W3C Web Accessibility Initiative (WAI)."
full_description = "W3C Accessibility Standards Overview Summary This page introduces guidelines and other standards related to web accessibility. Page Contents Introduction Accessibility Guidelines Web Content Accessibility Guidelines (WCAG) 2 Authoring Tool Accessibility Guidelines (ATAG) User Agent Accessibility Guidelines (UAAG) W3C Accessibility Guidelines (WCAG) 3 Working Draft Technical Specifications Accessible Rich Internet Applications (WAI-ARIA) Audio and Video Evaluation WAI-Adapt Pronunciation Other Areas of W3C WAI work Additional Information Introduction The World Wide Web Consortium (W3C) develops international Web standards: HTML, CSS, and many more. W3C’s Web standards are called W3C Recommendations. All W3C standards are reviewed for accessibility support by the Accessible Platform Architectures (APA) Working Group. The W3C standards and Working Group Notes introduced below are particularly relevant to accessibility. Accessibility Guidelines Essential Components of Web Accessibility shows how web accessibility depends on several components of web development and interaction working together, and how the WAI guidelines (WCAG, ATAG, UAAG) apply. Web Content Accessibility Guidelines (WCAG) 2 Web “content” generally refers to the information in a web page or web application, including: natural information such as text, images, and sounds code or markup that defines structure, presentation, etc. WCAG applies to dynamic content, multimedia, “mobile”, etc. WCAG can also be applied to non-web information and communications technologies (ICT), as described in WCAG2ICT. WCAG 2 info: WCAG Overview WCAG 2 at a Glance How to Meet WCAG 2 (Quick Reference) WCAG 2 Translations WCAG 2.2 Standard, What’s New in WCAG 2.2 WCAG 2.1 Standard, What’s New in WCAG 2.1 WCAG 2.0 Standard Authoring Tool Accessibility Guidelines (ATAG) Authoring tools are software and services that “authors” (web developers, designers, writers, etc.) use to produce web content. For example: HTML editors, content management systems (CMS), and websites that let users add content, such as blogs and social networking sites. ATAG documents explain how to: make the authoring tools themselves accessible, so that people with disabilities can create web content, and help authors create more accessible web content. ATAG info: ATAG Overview ATAG at a Glance ATAG 2.0 Standard User Agent Accessibility Guidelines (UAAG) User agents include browsers, browser extensions, media players, readers, and other applications that render web content. UAAG info: UAAG Overview UAAG 2.0 Note W3C Accessibility Guidelines (WCAG) 3 Working Draft WCAG 3 is an early draft that is intended to become a W3C Standard. WCAG 3 applies to web content, apps, tools, publishing, and emerging technologies on the web. WCAG 3 info: WCAG 3 Introduction Technical Specifications Accessible Rich Internet Applications (WAI-ARIA) ARIA provides semantics so authors can convey user interface behaviors and structural information to assistive technologies (such as screen readers). The ARIA specification provides an ontology of roles, states, and properties that define accessible user interface elements. The ARIA suite includes API mapping specifications that provide user agent implementation guidance. It also include modules for Graphics and Digital Publishing. ARIA info: WAI-ARIA Overview – includes a list and description of modules and API mappings WAI-ARIA Authoring Practices WAI-ARIA 1.2 Standard Audio and Video WebVTT: The Web Video Text Tracks Format is a format for captions, text video descriptions, and other metadata that is time-aligned with audio or video content. Timed Text Markup Language (TTML) is intended to be used for transcoding or exchanging timed text information among legacy distribution content formats for subtitling and captioning. Evaluation The following resources support development of accessibility evaluation methods and tools: Accessibility Conformance Testing (ACT) Overview — ACT establishes and documents rules for testing the conformance of web content to accessibility standards. The WCAG 2 Test Rules use the ACT rules format. Evaluation and Report Language (EARL) Overview — EARL is a machine-readable format for expressing test results. Additional resources related to evaluation are listed in the Evaluating Web Accessibility Overview, including: WCAG-EM Overview: Website Accessibility Conformance Evaluation Methodology — WCAG-EM is an approach for determining how well a website conforms to Web Content Accessibility Guidelines (WCAG). WAI-Adapt WAI-Adapt Overview — WAI-Adapt enables users to adapt (or ‘personalize’) how content is presented to meet their needs and preferences. Content authors can use WAI-Adapt standards to provide a default design and enable user adaptation with minimal work. Pronunciation Pronunciation Overview — Pronunciation is about screen readers and other text-to-speech (TTS) synthesis pronouncing content properly. Other Areas of W3C WAI work Mobile Accessibility at W3C Cognitive Accessibility at W3C Additional Information List of all W3C accessibility-related Standards (“W3C Recommendations”) and Working Group Notes Web Accessibility Laws & Policies lists governmental laws and policies relating to web accessibility in countries and regions around the world. Many of these reference W3C accessibility standards. Why Standards Harmonization is Essential to Web Accessibility Referencing and Linking to WAI Guidelines and Technical Documents How WAI Develops Accessibility Guidelines through the W3C Process: Milestones and Opportunities to Contribute Long description of image Help improve this page Please share your ideas, suggestions, or comments via e-mail to the publicly-archived list wai@w3.org or via GitHub. E-mailFork & Edit on GitHubNew GitHub Issue Back to Top"
author = "W3C Web Accessibility Initiative (WAI)"
year_published = 2025
clearnet = "https://w3.org/WAI/standards-guidelines"
