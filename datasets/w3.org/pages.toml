["https://w3.org/staff/comm"]
title = "Marketing & Communications | Staff | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = "Marketing & Communications The W3C Marketing & Communications team communicates who W3C is and what W3C does for the Web overall; builds W3C's influence & improve W3C's reputation; supports W3C development efforts; supports W3C Work Groups operations (i.e., implementation of the Communications aspects of the Process Document); supports promotion of W3C Members' work at W3C . Contact us at w3t-pr@w3.org. Bert Bos Role: Communications Bert Bos completed his Ph.D. in Groningen, The Netherlands, on a prototyping language for graphical user interfaces. He then went on to develop a browser targeted at humanities scholars, before joining the W3C at INRIA/Sophia-Antipolis in October 1995. He is co-inventor of CSS and created & led W3C's Internationalization activity. After working on HTML and XML, he led for many years the CSS and later also the Mathematics activities. He is now working on privacy technologies and is part of the W3C communications team. More... bert@w3.org Bert's Github account Xueyuan Jia Xueyuan Jia joined W3C in May 2015. She was the primary meeting planner at W3C/Beihang, and also the Media Contact in China as a member of W3C Marketing and Communications team. Since June 2017, she fully joined Marketing and Communications team to be committed to Member communications, W3C groups and team supports, as well as to expand W3C press relations in China. xueyuan@w3.org Xueyuan's Github account Alexandra Lacourba Role: W3C Global Events & Operations Coordinator Alexandra joined W3C in September 2002. She is the global Events and Operations coordinator, in charge of events, staff travel. She also leads Membership Administration including AC representative liaison, billing and other administration Alexandra holds a bachelor in Event Project Management from Lille University and a Master in Management from EDHEC Business School. More... alex@w3.org Alexandra's Github account Coralie Mercier Role: Head of W3C Marketing and Communications Coralie is Head of W3C Marketing & Communications. Since February 2015, she manages the Consortium's Comm activities, including messaging, press relations, W3C website, branding, marketing, internal communications as well as Public and Member communications. Previously and since 2005, Coralie was W3C Communications Team assistant. Since joining W3C in January 1999 with degrees in secretarial work and English as a foreign language, Coralie held a number of positions such as W3C Europe team assistant, W3C Europe administration manager (2001-2006). She was team contact for the W3C Advisory Board (2005-2017), helped with community outreach and developer relations. More... coralie@w3.org Coralie's Github account Amy van der Hiel Role: Media Relations Coordinator Amy van der Hiel is the Media Relations Coordinator for the W3C Communications Team and the Team Contact for the Advisory Board. For many years Amy worked as the Special Assistant to Tim Berners-Lee, W3C Emeritus Director. Before joining the W3C, Amy worked at the Museum of Fine Arts, Boston and was the Assistant to the Director and Curatorial Associate at the Exhibitions Department of the Massachusetts College of Art. She has her Bachelors in Art History from Bard College, NY and her Masters in Art Education from Mansfield University, PA. amy@w3.org Amy's Github account"
