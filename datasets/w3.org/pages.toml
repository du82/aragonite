["https://w3.org/membership"]
title = "Why join W3C | W3C"
description = "Discover the value of joining the Web Consortium."
full_description = '''Why join W3C Read this page in: 中文（简体） 日本語 Join W3C to drive the development of web standards and work with technology leaders in a transparent, open, vendor-neutral forum. W3C members collaboratively create royalty-free standards that make the web work for everyone. If you are ready to join as a new or returning W3C Member, you may skip the list of benefits and details of this page.Skip the list of benefits to the join page Learn more about what benefits organizations derive from their membership in W3C, and the role that they are invited to take. Read transcript for 4-minute video: Roles of the AC Rep Quick list of Member benefits Participate in any groupShape web technologyPropose new technologyStandardize your ideasMeet, interact with leaders Join the Web Consortium W3C MembersW3C Members are organizations of all sizes and all types, for-profit or not-for-profit, including commercial, educational and governmental entities. They may be developing web-based products, using web technologies as an enabling medium, conducting research on the web, or developing specifications based on W3C work.See the list of W3C Members Members homepageWho can join W3C?Organizations may join the World Wide Web Consortium. W3C's processes are designed for organizational participation.We do not have a class of Membership for individuals. Public participation in W3C is possible in a number of ways. Some individuals who are not employed by a W3C Member may participate as an "invited expert" in a Working or Interest Group, subject to approval by the group Chair and Team contact.Membership feesIn order to promote a diverse Membership that represents the interests of organizations around the world, W3C Membership fees vary depending on the annual revenues, type, and location of headquarters of an organization. What W3C Members have said they value The following benefits are the most important to W3C Members, in their own words. Interaction The opportunity to interact directly with organizations and individuals in the web community. Strategy The ability to provide strategic direction through review of W3C activity proposals and standards. Participation The contribution via W3C work groups to directly shape the technologies that power the web. Leadership The demonstration of technical leadership through commitment to the vitality of the web.'''
