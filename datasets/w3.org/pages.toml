["https://w3.org/news/2025/upcoming-authentic-web-mini-workshop-series-session-1"]
title = "Upcoming: Authentic Web mini-workshop series - session 1 | 2025 | News | W3C"
description = "W3C is working on a deconstructed mini-workshop series to review proposals to combat misinformation on the web."
full_description = "Upcoming: Authentic Web mini-workshop series - session 1 Author(s) and publish date Published: 20 February 2025 W3C is working on a deconstructed mini-workshop series to review proposals aimed at combating misinformation on the web. Based on discussions at TPAC 2024 (Originator Profile and Content Authenticity) and in the W3C Strategy Team, there is clear interest in investigating how several proposals in this space can contribute and what standardization support they might need. The Credible Web Community Group will host this deconstructed mini-workshop series to discuss a project framework for assessing tooling in the authentic web ecosystem. The first session, scheduled for 12 March 2025, will review the framework and discuss how to move proposals to interoperable standards to combat misinformation on the web. Attendance is free for all participants and is open to the public, whether or not W3C members.Visit here for more details."
