tute (ETRI) Established in 1976, ETRI is a non-profit government-funded research organization in Korea. ETRI has successfully developed information technologies on the Web such as ezOWL (visual Editor of OWL), and ETRI is committed to use W3C Technologies in its developments. ETRI is also the home of the W3C Korean Chapter. Entersekt Entersekt provides transaction authentication to financial institutions that is both secure and free from unnecessary friction. As a leading provider of strong device identity and user authentication, we work with the W3C to help drive innovation in the areas of digital identity, data privacy, and secure payments. ERCIM ERICSSON Founded in 1876, Ericsson is the largest supplier of mobile communications systems in the world. Supporting all major standards for wireless communication, Ericsson is committed to the use and development of W3C Recommendations to continue mobilizing the World Wide Web. ESWIN ETH Zurich Ethereum Foundation The Ethereum Foundation is a non-profit organ"
