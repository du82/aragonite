full_description = "Press releases Press releases about W3C work. Browse archives Browse archives All 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 2008 2007 2006 2005 2004 2003 2002 2001 2000 1999 1998 1997 1996 1995 This is page 1, displaying results 1-10 W3C web accessibility work boosted by Ford Foundation core funding Published: 26 November 2024 This press release announces our first grant since W3C's newly registered entity as a US public-interest non-profit organization. W3C is the recipient of a major grant from the Ford Foundation toward development of web accessibility standards, guidelines, and implementation resources to support access for people with disabilities. World Wide Web Consortium welcomes Sylvia Cadena as Chief Development Officer Published: 2 September 2024 This press release introduces W3C's inaugural Chief Development Officer and gives an overview of the position Enhanced Web of Things connects diverse IoT ecosystems Published: 5 December 2023 The Web of Things suite of documents reaches version 1.1, enhancing the standard with new functionalities and significant improvements. World Wide Web Consortium (W3C) welcomes Seth Dobbs as new Chief Executive Officer Published: 2 October 2023 The W3C Board of Directors has appointed Seth Dobbs for the role of W3C Chief Executive Officer, to commence on 13 November 2023. W3C advances technology to streamline payment authentication Published: 15 June 2023 Secure Payment Confirmation (SPC), published as W3C Candidate Recommendation, is feature-complete and ready for further implementations. EPUB 3.3 becomes a W3C Recommendation Published: 25 May 2023 EPUB 3.3 becomes a W3C Recommendation. World Wide Web Consortium seeking next CEO Published: 21 April 2023 World Wide Web Consortium seeking next CEO W3C re-launched as a public-interest non-profit organization Published: 31 January 2023 W3C re-launched as a public-interest non-profit organization Decentralized Identifiers