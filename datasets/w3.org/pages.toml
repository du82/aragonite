["https://www.w3.org/2005/02/TranslationPolicy.html"]
title = "Policy for Authorized W3C Translations"
full_description = '''This document describes the World Wide Web Consortium's (W3C) policy for the creation and the publication of Authorized W3C Translations. From its inception, W3C has made efforts to develop technologies that reach and may serve a worldwide audience regardless of language or culture. To that end, this policy is designed to achieve quality translations through a process that relies on transparency and community accountability, with W3C providing oversight of the process. Authorized W3C Translations can be used for official purposes in languages other than English. Examples include: a standardization authority in a country that wishes to standardize on a W3C Recommendation, but requires the usage of a local language; or a local government plans to reference the Web Content Accessibility Guidelines in their regulations, but requires a translation of the guidelines in the local language to do so. This policy for authorized translations extends but does not replace the volunteer translation policy described on the W3C’s public translations page. W3C continues to welcome translations created by the volunteer translation process, and these will continue to play an important role in allowing W3C technologies to reach more people around the world. However, as emphasized in the note "e" below, none of the translations created through the volunteer translation process are automatically considered to be Authorized W3C Translations, hence they do not have an official status. Of course, they may be the obvious candidates for the process described in this document. In all cases and in case of dispute, the authoritative version remains the English version (see the disclaimer boilerplate). The publication steps are as follows. A note on terminology: the term ''W3C' refers to representatives of the W3C staff, as appointed by the W3C Management. Important: The following text should be added at the top of each translation. All text in this disclaimer, except for the original title and the reference to the LTO at the top, must be in the target language.'''
year_published = 2025
clearnet = "https://www.w3.org/2005/02/TranslationPolicy.html"
