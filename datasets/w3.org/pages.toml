["https://www.w3.org/donate"]
title = "W3C Donations Program | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = "W3C Donations Program Your donation directly contributes to making the Web work, for everyone: a Web that reflects the principles of accessibility, internationalization, privacy and security which guide our technical work and community engagement. The support from generous individuals and organizations such as you, who share our values, make a huge difference to our operations as a public-interest non-profit, and help us to achieve our vision. Become a Friend of W3C Please select your donation amount (USD) (Required) $25 $50 $100 Other Other amount (USD) How it works: After you click the Donate button, you will be redirected to our payment partner Stripe where you can securely make your donation. You will then be brought back to this page to view your receipt. Donate Tax deduction World Wide Web Consortium, Inc is a registered not-for-profit US 501(c)(3) organization. Your donation may be tax-deductible; please consult your tax advisor. We do not sell or trade your information to anyone. By donating, you agree to share your personal information with World Wide Web Consortium, Inc, and its service providers. World Wide Web Consortium, Inc and its service providers are located in the United States and in other countries whose privacy laws may not be equivalent to your own. Other ways to sponsor W3C W3C recognizes that giving takes many forms. As well as one-time donations we welcome enquiries to discuss how our work aligns with the aspirations and objectives described in the giving portfolios of individuals and family offices, philanthropic organizations and foundations, corporate social responsibility programs, government programs and others. W3C is also registered with benevity, so that employees of organizations worldwide with structured giving and volunteering programs can get involved, help drive awareness about the importance of W3C work and make a tangible positive contribution to our work. Please help us to inspire others to do the same, by sharing with your network of contacts. We also encourage you to explore the benefits of W3C sponsorship opportunities. Discover the various sponsorships See our Sponsors"
year_published = 2025
