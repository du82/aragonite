["https://w3.org/2024/09/TPAC/speaking.html"]
title = "TPAC 2024: speaking guidelines"
full_description = "Skip ⬇ Speaking guidelines All participants are obligated to adhere to W3C's Code of Conduct. The W3C's global audience is thankful to participants and speakers for following these essential guidelines. Skip ⬇ All attendees Remote attendees must use high quality audio equipment as we are providing professional real-time captioning in English. Speak directly into the microphone so that all attendees hear you and interpreters and captioners are able to understand you. Speak clearly, at a rate that people can follow; use simple language, avoid jargon, expand acronyms. Skip ⬇ Audience Use ‘q+’ in IRC to record your question in advance. State slowly and clearly your name and affiliation. Be brief and concise. Directly address the topic discussed; refrain from monologuing and broaching some tangential topic. Skip ⬇ Presenter Slides Your slides must be ready no later than 16 September 2024. Please use the TPAC 2024 HTML slide template. (*) Make your slides accessible. There is information from the W3C WAI Team to help you do that. Make text and illustration big enough for everyone to read. Presentation (talk or panel) State the objective of your presentation. State each slide number as you advance through them. State a conclusion or wrap up with proposed next steps. You can find more recommendations on W3C's Speaker Resources public wiki. (*) Please, ask Bert Bos for help, including putting your slides on the Web."
