["https://w3.org/People/kevin"]
title = "Kevin White — Accessibility Technical Lead"
full_description = "Kevin White Accessibility Technical Lead Contact details: Email: kevin@w3.org LinkedIn: accessiblekevin GitHub: iadawn World Wide Web Consortium (W3C) 2004, Route des Lucioles B.P. 93 06902 Sophia-Antipolis, France At W3C WAI Kevin is the Accessibility Technical Lead for the Web Accessibility Initiative (WAI) at the World Wide Web Consortium (W3C). In this role Kevin supports WAI to deliver internationally recognized standards that support accessibility. He manages W3C accessibility operations, including projects, such as WAI-CooP, co-funded by the European Commission. Kevin has been involved with W3C WAI since 2016 in different capacities. He contributes to resources that support understanding and implementing web accessibility. Kevin was the lead editor of Planning and Managing for Web Accessibility, Tips for Getting Started with Web Accessibility, and Developing Organizational Policies on Web Accessibility Background Kevin was the Head of Digital Accessibility and User Research in the Scottish Government. He also worked as a digital design consultant supporting a wide range of public and private sector organizations to implement high quality, accessible and usable products and services. Kevin holds degrees in Psychology and in Mathematics and Computer Science."
