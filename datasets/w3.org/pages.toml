["https://www.w3.org/2024/Talks/TPAC/seth-w3c-30"]
title = "W3C@30 - Seth Dobbs, W3C CEO"
full_description = "Author(s) The user manual at the end has setup information and instructions. To write slides, look at the slides in this template. Reader(s) To start the slide show, press ‘A’. Return to the index with ‘A’ or ‘Esc’. On a touch screen, use a 3-finger touch. Double click to open a specific slide. In slide mode, press ‘?’ (question mark) to get a list of available commands. If it doesn't work: Slide mode requires a recent browser with JavaScript. If you are using the ‘NoScript’ add-on (Firefox or the Tor Browser), or changed the ‘site settings’ (Chrome, Vivaldi, Opera, Brave and some other browsers), or the ‘permissions for this site’ (Edge), you may have to explicitly allow JavaScript on these slides. Internet Explorer is not supported. So here we are, 30 years. We’ve come so far in that time, as a consortium, an industry, as a society. That video reminds me of how quickly we take change for granted. New innovations, even the most impactful changes, rapidly become expected parts of our lives. Because of that it’s great to step back and make sure we have perspective, and why our theme is “today is better than yesterday, tomorrow will be better than today.” It’s been a long time since I used a dial-up modem - thanks to that video for reminding us! My first dial in experience was in college on a 1200 baud modem. For those that aren’t familiar with that, basically that means that it would take nearly 6 hours to download a 3 MB file. I had a friend with a 400 baud modem, which means basically for that same file we’d get a better transfer speed saving that file onto a disk and flying it to Tokyo from L.A.! And of course that file would have been nearly 190 times the size of the memory expansion I had on my first Timex/Sinclair. All of that is easily, and for the most part rightly, forgotten today. We can exchange information, images and movies, thoughts and ideas, money and services, interact with our governments, interact with our friends, all the subsystems of society, in the blink of an eye, thanks in such large part to work done through this consortium and its members."
