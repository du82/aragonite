["https://w3.org/news/2025/w3c-team-appointment-to-the-tag-ratified"]
title = "W3C Team appointment to the TAG ratified | 2025 | News | W3C"
description = "Lola Odelola is appointed as new TAG member by the W3C Team"
full_description = "W3C Team appointment to the TAG ratified Author(s) and publish date Published: 30 January 2025 Following the W3C Technical Architecture Group (TAG)'s election results, the W3C Team has chosen and the Advisory Board and Technical Architecture Group have ratified the following appointment to the TAG for the 2025-2027 term:Lola Odelola (unaffiliated W3C Invited Expert)Among the individuals the W3C Team considered, Lola particularly stands out due to her connections with the developer community and her involvement in making web development available to under-represented parts of the community. Lola also has experience in W3C Working Groups and is an open source contributor.Per W3C Process Document regarding TAG appointments, this procedure follows a public call for nominations which together with nominations from the W3C Team and Members surfaced a list of several traditional and non-traditional candidates. The Team considered what each on the list would bring to the TAG. In addition to the aspects mentioned in Process, the Team considered cultural diversity and gender diversity.The Team is confident Lola Odelola brings robust complementary skills to the TAG and thanks her for offering her time to do the important TAG work of stewarding the Web architecture.About the W3C TAGThe TAG was created in 2001 as a special W3C working group, chartered to steward the Web architecture. To do so, it fulfills 3 missions:to document and build consensus around principles of Web architecture and to interpret and clarify these principles when necessary;to resolve issues involving general Web architecture brought to the TAG;to help coordinate cross-technology architecture developments inside and outside W3C.The TAG is part of the Horizontal Review Process and reviews a large number of specifications done at W3C and outside, even during their early stage.The TAG and the W3C Advisory Board are also part of the W3C Council to help resolve objections on specifications."
