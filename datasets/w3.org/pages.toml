["https://w3.org/2024/09/TPAC/talk/w3c30-francois-daoust"]
title = "TPAC 2024: Web & the art of specification maintenance"
full_description = '''Skip ⬇ Web & the art of specification maintenance Presenter: François Daoust Duration: 7 min Slides: download Previous: The web as a bridge across borders All talks Next: Supporting human rights in web standards Skip ⬇ Slides & video Keyboard shortcuts in the video player Play/pause: space Increase volume: up arrow Decrease volume: down arrow Seek forward: right arrow Seek backward: left arrow { "@context": "https://schema.org", "@type": "VideoObject", "name": "Web &amp; the art of specification maintenance", "description": "", "thumbnailUrl": "https://www.w3.org/2023/05/AC/banner.jpg", "uploadDate": "2021-04-15T13:00:00+02:00", "duration": "PT7M0S", "embedUrl": "https://customer-0kix77mxh2zzzae0.cloudflarestream.com/e801824a3b1a964300819187d6874208/iframe?poster=https%3A%2F%2Fcustomer-0kix77mxh2zzzae0.cloudflarestream.com%2Fe801824a3b1a964300819187d6874208%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600", } <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=1">Slide 1</a> [Chris Wilson] Next, join me in welcoming on stage Francois Daoust, W3C Media specialist, to talk about the web and the art of specification maintenance. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=2">Slide 2</a> [François Daoust] Yeah, I'm the one with the exciting topic... So, by now, it should be clear to everyone that the web is a core part of the information infrastructure, right? In layman's terms, it means that everyone uses the web, everyone depends on it and, as long as it works, hardly anyone cares about how it works and how it's made. Except us, but we're a small group. So exactly, just like, you know, electricity, water or transport. For infrastructures to last [...] <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=3">Slide 3</a> For infrastructures to last, they need to be resilient where resilience means the positive ability of a system to adapt itself to the consequence of unexpected events, such as a blackout! We need the web to be resilient to celebrate W3C's 60th birthday. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=4">Slide 4</a> I strongly encourage everyone to read about infrastructure, I recommend "How infrastructure works" by Deb Chachra, but I know some people in the room might prefer reports that are full of legalese. So, if you are that type of person, you may enjoy the building resilience report from the OECD. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=5">Slide 5</a> In any case, both agree on the same thing: infrastructure cannot be resilient if it is poorly maintained. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=6">Slide 6</a> So, there's no way to avoid it. We need to continue looking into the maintenance of the web over and over again. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=7">Slide 7</a> The web is simple, very simple. It's a bunch of apps running in browsers. The browsers implement specs and the specs are the thing we develop, we produce here, and that's precisely where we can focus our maintenance efforts. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=8">Slide 8</a> A number of processes and a set of guidelines help produce good quality specs. Documentation makes sure that the specs are meaningful for developers, and sometimes meaningful at all. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=9">Slide 9</a> Tests and associated efforts completed with the research help align specs with implementations and developers at large. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=10">Slide 10</a> This all works somewhat nicely because we have tools in place, starting with authoring tools, which handle all the heavy work to create good and consistent specs. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=11">Slide 11</a> Over the years, various supporting tools have been developed to track specs, validate and publish them, extract and annotate data from them, and overall make our specs you know more machine readable. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=12">Slide 12</a> And to analyze things on a more or less automated basis. Now the reason why I'm bothering you with such a crowded diagram, which on top of being crowded is actually fairly incomplete, is, first, because I think you deserve such a crowded diagram, and, second, because I thought it would be useful to show how maintenance done at the micro level helps build a consistent system at the macro level. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=13">Slide 13</a> In practice, all of these boxes are interconnected. I started to draw some links and, who would have thought, the crowded diagram turned into an unreadable mess. So I stopped here, and the remaining links are left as an exercise to the audience. You have two minutes. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=14">Slide 14</a> These links do matter. They matter because they create feedback loop, positive feedback loops between the different boxes in the diagram. For example, these loops allow us to check the consistency of the web platform as a whole by detecting potential errors in specs, be them just typos, and to close the loop to help maintain the specs and to improve the overall resilience of the web. We report these errors to spec editors. Sometimes, that requires some elbow grease and from time to time we can fully automate the process. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=15">Slide 15</a> So, if you've already received one of these issues, you know, one of these issues that may seem to come from nowhere, now you know where they come from. They come from the need to improve the resilience of the web through positive feedback loops. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=16">Slide 16</a> Speaking of resilience it's interesting to note that different bits are done by different people, different groups and different organizations. Usually in the open as long as loose coordination happens, takes place between these people. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=17">Slide 17</a> I don't know that we need to formalize things further, but it illustrates a key role of W3C. That loose coordination is possible today because W3C has managed to remain a centripetal force for the web community at large over the years. As a matter of fact, basically all the projects tools, groups I mentioned and those I forgot to mention and include in my diagram, are represented here today at TPAC. That W3C is able to play that role is a fantastic thing. I also believe that it is core to its mission. Hopefully that will continue to be the case in 30 years from now. So, many thanks to people who manage to invest time into creating positive feedback loops, and thanks to the organization who support them from time to time, perhaps unknowingly, and see you at W3C's 60th birthday. <a href="../../../Talks/TPAC/francois-w3c-30-web-specification-maintenance.pdf#page=18">Slide 18</a> Thank you Skip ⬇ Previous: The web as a bridge across borders All talks Next: Supporting human rights in web standards'''
