["https://w3.org/groups/cg"]
title = "Community Groups | Discover W3C groups | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = '''Community Groups W3C has created Community and Business Groups to meet the needs of a growing community of Web stakeholders. Community Groups enable anyone to socialize their ideas for the Web at the W3C for possible future standardization. Business Groups provide companies anywhere in the world with access to the expertise and community needed to develop open Web technology. New W3C Working Groups can then build mature Web standards on top of best of the experimental work, and businesses and other organizations can make the most out of W3C's Open Web Platform in their domain of interest. Learn more about Community and Business Groups. Search Closed Show results There are currently 141 open Community Groups. View closed groups Accessibility at the Edge Community Group The mission of the Accessibility at the Edge Community Group is to examine improvements to internet accessibility via "edge computing", a relatively new paradigm that focuses on performing tasks at the edge of the network. Unlike cloud computing, edge computing emphasizes activities that occur closer to the user; these could include accessibility oriented user-agent extensions, applications on content delivery networks, JavaScript-enabled capabilities, AI or ML. The group is a forum for discussing both currently available products, potentially new applications not yet commercially available, as well as objective measures of the quality of any one of these. Our tasks can include inventorying both opportunities and challenges, drafting and incubating Internet specifications for further assessment, standardization, prototyping and testing of reference implementations. A11Y-EDGE CG meetings work and operate under the W3C Code of Ethics and Professional Conduct. Accessibility Discoverability Vocabulary for Schema.org Community Group The primary objective of this group is to maintain and develop the vocabularies for the accessibility discoverability properties in schema.org, that enable discovery of accessible content. This community group is a successor to the Accessibility Metadata Project that first proposed the properties, which were based on the Access for All metadata. The group may also propose additional properties in the future, if needed. Ecosystem Publishing Accessibility for Children Community Group The mission of this group is to discuss accessibility adapted for children (age appropriate, literacy relevant). The Community Group welcomes meeting accommodation sponsorship through funding or complimentary services. Many thanks to Patricia Lessard, Things Entertainment, LLC and Deaf Services of Palo Alto for your donations. Accessibility Internationalization Community Group The mission of the Accessibility Internationalization Community Group is to improve the internationalization of: The Cognitive and Learning Disabilities Accessibility (COGA) Task Force The Accessibility Guidelines Working Group (AG) Scope The Accessibility Internationalization Community Group will include the following efforts: Improve the internationalization of COGA and AG publications. Develop criteria and tests for easy-to-understand language in different languages. Develop criteria and tests for text appearance and semantics in different writing systems Develop criteria and tests for additional guidance that changes based on additional language, writing system, or culture. The community group’s initial focus is to help internationalize two accessibility resources that are currently in development: The next version of Making Content Usable for People with Cognitive and Learning Disabilities WCAG 3.0, with two guidelines as the top priorities: “Clear Language” and “Text Appearance and Semantics,” which will have tests and criteria in different languages. Accessibility Roles and Responsibilities Mapping (ARRM) Community Group This is the community group for individuals interested in contributing to the development and maintenance of the Accessibility Roles and Responsibilities Mapping (ARRM) framework. The purpose of the ARRM is to guide web teams (designers, developers and content creators) and subject matter experts in successfully distributing accessibility responsibilities by roles in a web development lifecycle, so that every stakeholder understands the role that they have to play in embedding accessibility requirements and best practices in their workflow in order to make digital content more usable to - and inclusive of - people with various types of disabilities. This group will not publish Specifications. ACT Rules Community Group The ACT Rules Community Group (previously known as Auto-WCAG), is an open forum set up to document and harmonise the interpretation of W3C accessibility standards, such as WCAG and WAI-ARIA, for testing purposes. The ACT Rules Community Group (ACT-R) achieves this by bringing together the people developing, implementing and using various accessibility testing tools and methodologies to document interpretations as test rules. Test rules are defined using the ACT Rules Format, and reviewed by the community. The process of researching, documenting, and sharing knowledge from different perspectives within the group, builds towards a common understanding. Publishing rules is not an end point for harmonization, it's a starting point. By publishing such test rules, ACT-R hopes to motivate organisations to share their own insights, and encourage adoption of commonly agreed test rules. ACT-R is not set up to remove differences or impose changes on accessibility testing tools and methodologies. There is value in innovation and diverse approaches. Rather it aims to contribute to more consistent results, regardless of how the testing is done. Knowing when something meets a requirement, and when it does not, should be clear and consistent. This group will not publish specifications. Advancing Accessibility Resources Community Group Our goal is to engage and empower accessibility professionals to advance the W3C WAI mission through community driven initiatives. This work could include: Creating and maintaining a repository of community-built resources that complement WAI Being a group of active participants that are continually contributing to resources Vetting and highlighting external resources that relate to and support this group's resources Being available to W3C Working Groups and Task Forces to assist in writing specifications and resources This group will not publish Specifications. AI KR (Artificial Intelligence Knowledge Representation) Community Group Welcome post Group's wiki See also the group's pages from the right-hand side menu The overall goal/mission of this community group is to explore the requirements, best practices and implementation options for the conceptualization and specification of domain knowledge in AI. We plan to place particular emphasis on the identification and the representation of AI facets and various aspects (technology, legislation, ethics etc) with the purpose to facilitate knowledge exchange and reuse. Therefore the proposed outcomes could be instrumental to research and advancement of science and inquiry, as well as to increase the level of public awareness in general to enable learning and participation. Proposed outcomes: A comprehensive list of open access resources in both AI and KR (useful to teaching and research) A set of metadata derived from these resources A concept map of the domain A natural language vocabulary to represent various aspects of AI One or more encoding/implementations/ machine language version of the vocabulary, such as ChatBot Natural Language Understanding & Natural Language Generation Methods for KR management, especially Natural Language Learning / Semantic Memory WHO SHOULD JOIN: researchers and practitioners with an interest in developing AI KR artifacts (ontology, machine learning, markup languages) Editable doc. Anti-Fraud Community Group The mission of the Anti Fraud Community Group is to identify and define scenarios involving fraud and unwanted traffic, as well as to incubate and develop web features and APIs to address those scenarios while improving user security, privacy, and accessibility. Fraud and unwanted traffic can include web activity perpetrated by botnets, attackers impersonating users, and other activity that intends to harm users or compromise web services. The group welcomes participation from anti-fraud service providers, common targets of unwanted traffic, browser vendors, web privacy advocates, web application developers, web hosting and cloud service providers, and other interested parties. The Community Group will discuss issues that server operators and anti-fraud service providers face in this area and ideas for new web features and APIs intended to be implemented in browsers or similar user agents. Ecosystem E-commerce ARIA and Assistive Technologies Community Group How WAI-ARIA is supported by assistive technologies, such as screen readers, is highly variable. This variation in WAI-ARIA rendering adds unnecessary complexity to the development of high-quality web experiences for users of assistive technologies and places significant limitations on the types of web widgets that can be made widely accessible. This community group is dedicated to: 1. helping assistive technology developers converge on a set of clear norms for baseline support of WAI-ARIA. 2. Helping web developers understand the current state of support for WAI-ARIA by assistive technologies. WAI-ARIA is as important to assistive technology presentation as CSS is to visual presentation. Join us to help make WAI-ARIA as reliable as CSS. This group will not publish Specifications. Audio Community Group A group to gather and incubate new features and requirements for the Web Audio API. Making it easier for the community to engage with the Audio Working Group. Audio Description Community Group Mission: To create an open standard file format to support audio description all the way from scripting to mixing. Scope: To agree requirements and propose a workable open standard file format for audio description, probably a profile of TTML2, with the intention of moving to the Rec track within a Working Group. Deliverables: Requirements document Draft specification document Explainer Audiovisual Media Formats for Browsers Community Group Over the past decade, a growing number of sound and imaging media formats have been established offering increasingly sophisticated user experiences such as High Dynamic Range (HDR) and Spatial Audio. On the imaging side, these media formats provide the technical means to facilitate increased spatial and temporal resolutions, higher bit depths, as well as varying color volumes and the mapping between them. Similarly, on the audio side, higher bit-depth, sample rates and more immersive surround sound and speech processing options are available. These experiences are facilitated through tools and technical mechanisms available to both professional and consumer content providers and are readily available for linear content types. However, options to provide such experiences through the web are still limited as potential solutions are fragmented and often insular or significantly limited in capabilities among open source as well as proprietary options. This typically results in incorrect presentation to an end user or even error messages. Therefore, there is need to consider how to support modern audiovisual formats in a W3C context. To alleviate friction in development and deployment, it seems highly beneficial to our community to synchronize open and proprietary solutions so that they can co-exist within a W3C framework. The scope of this community group is to provide a forum for those discussions. Ecosystem Media & Entertainment Automotive Ontology Community Group The Automotive Ontology Working Group is an informal group of individuals and corporations who want to advance the use of shared conceptual structures in the form of Web ontologies for better data interoperability in the automotive industry, and this at Web scale. In particular, we want to develop extension proposals for schema.org so that automotive information can be better understood by search engines and OWL Web ontologies for the automotive industry. Also, we want to provide a forum for bringing together researchers and practitioners who are working on advancing the field. Automotive Privacy Principles Community Group Vehicles are becoming increasingly connected, enabling rich data and useful services. A major obstacle to transportation's information transformation is better protection of personal privacy. The Mozilla Foundation properly called in out in their assessment It’s Official: Cars Are the Worst Product Category We Have Ever Reviewed for Privacy. The goal of this Community Group is to create guiding principles specific to the automotive industry and to work in conjunction with COVESA in prototyping and promoting appropriate solutions. Autonomous Agents on the Web Community Group This community group is interested in the design of Web-based Multi-Agent Systems (MAS) for the deployment of world-wide hybrid communities of people and artificial agents on the Web. Our aim is to design a new class of Web-based MAS that are aligned with the Web Architecture to inherit the properties of the Web (world-wide, open, long-lived, etc.), and are also transparent and accountable to support acceptance by people. We are especially interested in the use of Linked Data and Semantic Web standards for weaving a hypermedia fabric that enables uniform interaction among heterogeneous entities: people, artificial agents, devices, digital services, knowledge repositories, etc. We refer to this new class of Web-based MAS as Hypermedia MAS (hMAS). This community group brings together experts actively contributing to advances in autonomous agents and MAS, the Web Architecture and the Web of Things, Semantic Web and Linked Data, and Web standards in general — as well as any other areas that could contribute to this approach for distributed intelligence on the Web. Best Practices for Multilingual Linked Open Data Community Group The target for this group is to crowd-source ideas from the community regarding best practises for producing multilingual linked open data. The topics for discussion are mainly focused on naming, labelling, interlinking, and quality of multilingual linked data, among others. Use cases will be identified to motivate discussions. Participation both from academia and industry is expected. The main outcome of the group will be the documentation of patterns and best practices for the creation, linking, and use of multilingual linked data. This group will not create specifications. Bibframe2Schema.org Community Group The objective of the community group is: to facilitate a consensually agreed route for the conversion and/or mapping of bibliographic data into Schema.org; building on the development, init'''
