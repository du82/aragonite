["https://w3.org/staff/community-mgnt"]
title = "Community Management | Staff | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = "Community Management The Community Management function is responsible for ensuring excellent relationships with and participation from our growing and diverse community. Responsibilities include: Cultivate strong relationships with those Members who we need the most Work with Project Management to ensure participation from those Members that we think are essential for the success of a Working Group Work with Project Management to ensure that developer stakeholders are implementing new CRs Developer Relations Partnering with the WHATWG Marie-Claire Forgue Role: Head of W3C Training Marie-Claire Forgue serves as Head of W3C Training. She developed the W3Cx MOOC program, in partnership with edX, where Web developers worldwide can learn front-end Web development techniques using W3C Web standards. Previously, she crafted W3DevCampus, a learning platform hosting small private courses. Additionally, Marie-Claire is a member of the W3C Developer relations team, organizing meetups and participating in online and in-person communities via forums, social media (@w3cdevs), etc. She is also involved in the dissemination activities of several projects funded by the European Commission. She joined W3C in 2001 and served as Head of W3C European Communications for over 10 years. Marie-Claire received a Ph.D. degree (computer graphics and parallel processing) in Computer Science from the University of Côte d'Azur and INRIA, France. After a year as a postdoctoral fellow at the Dynamic Graphics Project Lab at the University of Toronto, Canada, she worked at NTT's Human Interface Lab, Japan, for two years. Her research interests were focused on illumination algorithms and scene modeling. After that, she studied filmmaking in Vancouver, Canada. She has directed several short films and documentaries, and got interested in interactive multimedia back in 1993. mcf@w3.org Marie-Claire's Github account Dominique Hazaël-Massieux Role: W3C Community Management Lead, W3C Staff Contact & VR/AR Strategy Specialist Dominique is W3C Developer Relations Lead, W3C Community Development Lead (in charge of managing the Community Groups program), part of the W3C Project Management team, W3C Strategy Specialist on Virtual and Augmented Reality, and serves as staff contact in the Web Real-Time Communications Working Group, the Web and Machine Learning Web Working Group, and the Web & Networks Interest Group. He is the General Manager of ERCIM, the W3C Partner in Europe. He also develops tools and applications as needed in his various roles. He joined initially W3C’s Communication and Systems Team as a member of the Webmaster Team in October 2000; after having joined then led the QA Activity until September 2005, Dom took part in the Mobile Web Initiative as Staff Contact for the Best Practices Working Group and later as co-Chair of the Mobile Web Test Suites Working Group. Dom also served as Staff Contact for the Device and sensors Working Group Dominique holds an engineering degree from the “Grande Ecole” École Centrale Paris. More... dom@w3.org Dominique's Github account"
year_published = 2025
