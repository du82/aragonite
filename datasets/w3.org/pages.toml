description = "The one-stop place to find the information and tools you need to help you learn, build, and move the Web forward."
full_description = '''Developers Read this page in: 中文（简体） 日本語 The one-stop place to find the information and tools you need to help you learn, build, and move the Web forward. Accessibility Tutorials Develop web content that is accessible to people with disabilities, and that provides a better user experience for everyone.WAI tutorials Tools Lead your code to its full potential with great and open source tools.Browse the toolsContribute Get Involved Get involved in the creation of Web standards. Yes, that's where cool people hang out.Get startedCommunity groups Web Platform Tests W3C-coordinated effort to build a cross-browser testsuite for the majority of the web platformGet startedDocumentationImplementation Status Learn In the comfort of your browser, learn Front-End Web technologies such as HTML, CSS, etc. directly from the people who create them.W3Cx MOOCs - Free online courses W3Cx course: Introduction to Web AccessibilityThis course, “Introduction to Web Accessibility”, is designed for technical and non-technical audiences, including developers, designers, content authors, project managers, people with disabilities, and others. Watch the short teaser video for more information about the course, and enroll soon!Enroll now!W3C Front-End Web Developer Professional CertificateLearn directly from W3C and master the foundational programming languages for Web development -- HTML5, CSS and JavaScript -- with the W3C "Front-End Web Developer" (FEWD) Professional Certificate program which consists in 5 courses. Gain skills in one of the fastest growing careers!Enroll now! @w3cdevs on social mediaMastodon YouTube Please donateIf you appreciate our offerings and if you want and can give back, please donate to support us fulfill the W3C's mission.donate'''
