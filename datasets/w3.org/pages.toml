["https://www.w3.org/mission/accessibility"]
title = "Accessibility | Our mission | W3C"
description = "This page gives a high-level introduction to web accessibility and what the W3C Web Accessibility Initiative (WAI) does."
full_description = "Accessibility Read this page in: 中文（简体） 日本語 Page contents The power of the webIncluding everyoneAbout the Web Accessibility Initiative (WAI)Shape an accessible Web as a W3C Member The power of the Web is in its universality. Access by everyone regardless of disability is an essential aspect. Tim Berners-Lee, W3C Founding Director and inventor of the World Wide Web The power of the webThe Web is fundamentally designed to work for all people, whatever their hardware, software, language, location, or ability. When the web meets this goal, it is accessible to people with a diverse range of hearing, movement, sight, and cognitive ability.Including everyoneWeb accessibility is about designing web sites, applications, technologies, tools, products and services in an inclusive manner, and thus lifting barriers to communication and interaction that many people face in the physical world.The mission of the Web Accessibility Initiative (WAI) is to develop strategies, standards, and supporting resources to help you make the web accessible to people with disabilities, thus enabling everyone to participate equally on the web. Introduction to Web Accessibility and W3C Standards About the Web Accessibility Initiative (WAI)WAI develops its work through W3C’s consensus-based process, involving different stakeholders in web accessibility. These include industry, disability organizations, government, accessibility research organizations, and more, and in partnership with organizations around the world, pursues accessibility of the web through these primary activities:ensuring that W3C standards support accessibilitydeveloping accessibility guidelines for web content and applications, browsers, and authoring toolsdeveloping resources to improve web accessibility evaluation processes and toolssupporting education and outreach on web accessibilitycoordinating with research and development that may impact future accessibility of the webpromoting harmonized international uptake of web accessibility standards Shape an accessible Web as a W3C MemberW3C Members play a significant role in shaping the Web.Contact W3C to learn more about the benefits of W3C Membership to play a significant role yourself!"
