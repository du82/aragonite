["https://www.w3.org/sponsor"]
title = "W3C Sponsorships Program | W3C"
description = "Find out how your support allows W3C to accelerate delivering open web standards for the benefit of humanity by dedicating more resources to expand our core work."
full_description = "W3C Sponsorships Program Read this page in: 中文（简体） Page contents W3C Principles ChampionCommunity Engagement ChampionDonations Inquire about Sponsorship See our Sponsors Your sponsorship directly contributes to making the Web work, for everyone: a Web that reflects the principles of accessibility, internationalization, privacy and security which guide our technical work and community engagement, and support business ecosystem development.The contributions from generous supporters, both individuals and organizations, who share our values, make a huge difference to our operations as a public-interest non-profit, and help us to achieve our vision. Your support allows W3C to accelerate delivering open web standards for the benefit of humanity by dedicating more resources to expand our core work.W3C community engagement opportunities at a global, regional and local level bring sponsors into direct contact with leading Web technology experts from industry, research, government, and the developer community, to help your organization expand its outreach and be recognized in the community. Visibility for your brand will be tailored on marketing applications such as signage, conference and workshops merchandise, etc., as well as being recognized for specific deliverables.W3C recognizes that giving takes many forms. We welcome inquiries to discuss how our work aligns with the aspirations and objectives described in the giving portfolios of individuals and family offices, philanthropic organizations and foundations, corporate social responsibility programs, government programs and others. W3C welcomes financial contributions of any size to help us carry out these activities. We invite interested sponsors to discuss with our Team how to customize their support and outline specific elements they may be interested to support. Concrete examples include acknowledgement for sponsorship at W3C’s annual conference TPAC and W3C workshops (such as food and beverages, Internet connectivity, interpretation, captioning, sign language, merchandise such as t-shirts, bags, etc.) or support for the development of specific publications, tools, training materials, among other possibilities.We have two main sponsorship opportunities available, and under each one four tiers based on different amounts for members and non-members. You can choose the one that better suits your interests, aspirations and alignment with our work. W3C Principles ChampionYou can have an impact on people's daily lives by ensuring the Web is secure, private, available to people with disabilities, and to anyone whatever their language or writing system. Show your leadership in social responsibility by supporting W3C's current programs and proposed initiatives. With your support, W3C can continue to work so that the Web is available to all.InternationalizationW3C Internationalization activity ensures that W3C's formats and protocols are usable worldwide in all languages and in all writing systems. That requires collaboration of language experts, web site designers, developers, and vendors to ensure a rapid response to the growth of the Web.AccessibilityThe Web Accessibility Initiative (WAI) ensures that W3C technologies support accessibility; develops accessibility standards and guidelines for web content, browsers, multimedia players, authoring tools, and dynamic web content; develops resources for evaluation and repair of websites, as well as for education and outreach. It enables partnering of industry, disability communities, accessibility research, government, and others interested in improving accessibility of the Web.PrivacyW3C’s work on privacy shapes the privacy-preserving Web by developing privacy standards, reviewing the privacy of web standards and guiding web developers to incorporate privacy by design.SecurityW3C’s work on security has been instrumental in improving Web security through the development of authentication technologies that can replace weak passwords and help mitigate threats from phishing and similar attacks.Business ecosystemsThe work of W3C meets the needs of many industries to develop web services and applications that have a positive impact in the lives of people around the world. W3C is actively looking for sponsors to strengthen work that support business ecosystem development around e-commerce, media & entertainment, publishing, network & communications, data and knowledge, web of things and web advertising.Distribution of fundsAn indicative distribution of the sponsorship funds is outlined below. Such distribution will allow for work associated with each of our Principles to expand and further develop:60% funds towards support for logistics and operational costs related to the core activities specifically linked to one of the W3C Principles25% funds towards supporting W3C Training associated with the specific principle supported15% funds towards supporting W3C R&D activities associated with the specific principle supportedBenefitsBenefits for 12 monthsDiamondRubyEmeraldSapphireLogo on W3C sponsors page on the website✔✔✔✔Promotional interview posted online✔ Acknowledgement on related marketing✔All✔Two selected events✔One selected event Acknowledgement on training materials, events and R&D activities that focus on a specific principle supported✔All events✔Three selected events/activities✔Two selected events/activities✔One selected event/activityAmount for W3C Members, in USD150,00070,00035,00017,500Amount for non-members, in USD155,00075,00040,00022,500 Inquire about Sponsorship See our Sponsors Community Engagement ChampionThe Community Engagement Champion will provide annual support so that W3C can deliver more engaging community events that are key to strengthen participation and advance technical discussions. Community Engagement activities include W3C’s annual conference TPAC, Advisory Committee meetings, Workshops, as well as Group meetings and industry ecosystem events, or support to Training and R&D activities.Sponsorship opportunities can also be tailored for specific community events. Please reach out if you are interested.Distribution of fundsAn indicative distribution of the sponsorship funds is outlined below. Such distribution will allow for an enhanced community engagement experience at events, as well as to expand the benefit to those unable to attend events in person:60% funds towards improving experience for participants at W3C community events including all logistics and operational costs25% funds towards supporting W3C Training15% funds towards supporting W3C R&D activitiesBenefitsBenefits for 12 monthsDiamondRubyEmeraldSapphireLogo on W3C sponsors page on the website✔✔✔✔Promotional interview posted online✔ Acknowledgement on related marketing✔All✔Two selected events✔One selected event Logo included in printed banners, badges and event signage✔All✔Two selected items Logo on W3C TPAC merchandise✔ Logo as host of W3C TPAC reception✔✔ Access to Sponsors Lounge at W3C TPAC✔✔✔✔Invitation to an exclusive social event for Sponsors at W3C TPAC (limited seats)✔✔✔✔Acknowledgement on training materials, events and R&D activities✔All events✔Three selected events/activities✔Two selected events/activities✔One selected event/activityAmount for W3C Members, in USD150,00070,00035,00017,500Amount for non-members, in USD155,00075,00040,00022,500 Inquire about Sponsorship See our Sponsors DonationsBecome a Friend of W3C and support our vision for a web that works, for everyone.We encourage you to explore a donation.Your contribution strengthens our operations and programmingUS tax deductible Donate"
