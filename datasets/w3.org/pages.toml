title = "TPAC 2024: Venue, travel, accommodation"
full_description = "Skip ⬇ Venue and accommodation Also on this page: Transportation Childcare Local information Hilton Anaheim 777 W. Convention Way Anaheim, California, 92802 USA (+1) 714-750-4321 Web site SOLD OUT Nights at the Hilton: W3C Block: Sold out on 23, 24 and 25 September Hilton: Sold out on 23 and 24 September Guest room rate: $209 per night, standard king bed or standard 2 queen beds + 15% room tax, 2% tourism improvement district tax and $1.70 tax per night assessment fee. Wifi included Breakfast not included Deadline: Please book your room as soon as possible as there will be other conventions in town. The group rate will be available through Saturday 31 August 2024, 18:00 pacific time. After 31 August, reservations will be accepted on a space-available basis, at current market rates. Cancellation policy: 72 hours prior to arrival Booking link You may also call at +1 877-776-4932. Group code: TPA Alternate hotels DoubleTree Suites by Hilton Hotel Anaheim Resort - Convention Center 2085 South Harbor Blvd. Anaheim, California 92802 USA +1 714-750-3000 Rates: Around $300 Avg/night with taxes and fees At a 9 minute walk from Hilton Anaheim SpringHill Suite at Anaheim Resort 1801 South Harbor Boulevard, Anaheim, California 92802 +1 714-533-2101 Rates: Around $290 Avg/Night with taxes and fees At a 9 minute walk from Hilton Anaheim The Westin Anaheim Resort 1030 West Katella Avenue, Anaheim, California, USA, 92802 +1 657-279-9786 Rates: Around $410 Avg/Night with taxes and fees At a 14 minute walk from Hilton Anaheim Residence Inn at Anaheim Resort/Convention Center 640 W Katella Ave, Anaheim, CA 92802 +1 714-782-7500 Rates: Around $345 Avg/Night with taxes and fees At a 9 minute walk from Hilton Anaheim ⬇ Transportation Traveling by car If you travel by car and plan to use the hotel parking, we may still have some parking validation ticket for free parking. Please come see the W3C staff at the registration desk. Travel documents If you do not need any visa to travel to the USA, you must apply for a Travel Authorization (Esta application). If you need an invitation letter, please send your request to visa-request@w3.org. Airports Nearest airports: John Wayne Airport Distance: Approximately 15 miles Long Beach Airport Distance: Approximately 18 miles Los Angeles International Airport Distance: Approximately 35 miles Ontario International Airport Distance: Approximately 38 miles Airport shuttles to Anaheim The following companies provide transportation to and from the Anaheim area: 24-7 Ride (+1) 888-700-1222 Go Airport Shuttle (+1) 773-363-0001 Karmel Shuttle (+1) 714-670-3480 Prime Time Services (+1) 800-733-8267 Notes for travelers coming through Los Angeles International Airport (LAX) LAX-it is the new way to get to your taxi or ride app services (Uber, Lyft, or Opoli). Walk or catch the free shuttle outside baggage claim on level one to LAX-it. To share a taxi: use our dedicated wiki Anaheim Regional Transportation Intermodal Center (ARTIC) ARTIC serves as a train station for Amtrak and Metrolink and a bus station used by the Orange County Transportation Authority (OCTA), Anaheim Resort Transportation (ART), Greyhound, and others. 2626 East Katella Avenue, Anaheim, CA 92806-5903 2.5 miles E from Hotel Voice: (+1) 714-385-5100 Anaheim Amtrak Train Station at ARTIC Voice: (+1) 800-872-7245 TTY: (+1) 800-523-6590 Accessible Travel Services Anaheim Metrolink Light Rail Station at ARTIC Voice: (+1) 800-371-5465 TTY: (+1) 800-698-4833 Accessibility/ADA Information Operates Monday-Sunday Anaheim Resort Transportation (ART) Anaheim Resort Transportation (ART) is the primary transportation service provider between local hotels in Anaheim, Buena Park, and Orange. Voice: (+1) 888-364-2787 ⬇ Childcare Childcare will be offered at TPAC 2024 to make events accessible to parents. We will provide in-house childcare from Monday 23 September until Friday 27 September 2024 between 8:45 and 18:15. Please let us know the number of children, their age, any meals details (restrictions, if you will provide the meals…) at w3t-tpregister@w3.org. The requests for childcare should be sent to us no later than 23 August. The childcare company will take care of your child with age-appropriate activities. Information about nannies will be communicated at the end of August to the parents who confirmed the service. Note: Interested participants accept full responsibility and risk for engaging in childcare services. W3C does not make any representations or assume any liability with respect to these services. Skip ⬇ Local information Restaurants Here is a list of restaurants near the Hilton Anaheim hotel. Power Mains power in the US is 110 V at 60 Hz. US standard outlets. Shopping and Tourism Shopping center with shops and restaurants: Anaheim Garden Walk (1 mile from hotel) Visit Anaheim"
