Gibello and Christian PatersonOpen Connectivity Foundation (OCF) Media and Entertainment, Testing, Web of ThingsKazuyuki Ashimura, Dave RaggettMichael Richmond, Clarke Stevens, David McCall, Scott Lofgren, Daniel ParkOECD ITAC (charter) Generic Liaisons, Privacy, Open StandardRigo Wenning (TBC)Christine Runnegar, ISOCOpen Geospatial Consortium (OGC)MOU (2017-2022)Spatial Data on the WebBert BosScott Simmons, Ingo SimonisOMA Open Mobile Allianceexpired MoU with OMACSS, Graphics HTML, Federated Social WebChris Lilley, Dominique Hazaël-MassieuxKieran McAleeseKimmo HalonenMobile Web Initiative: Jari AlvinenFederated Social Web: Goix Laurent WalterVictoria Gray.Object Management Group (OMG) Web Services, DOMPhilippe Le HégaretJames NemiahOneM2M Web of ThingsDave RaggettYongjing ZhangOpenMath Society MathMLBert BosDavid CarlisleOPC Foundation Web of ThingsKaz AshimuraStefan HoppeOpen Web Application Security Project (OWASP) Security, Privacy, TAGTBDSebastien DeleersnyderThe Open Group Generic Liaisons, Web of ThingsDave Raggett Scott Hansen; Chris HardingPCI Security Council Web PaymentsIan JacobsUpdating as of May 2022SMPTE Media and Entertainment, Timed TextPhilippe Le Hégaret, Atsushi ShimonoMike DolanTelecommunications Technology Association (TTA) Media and EntertainmentKazuyuki AshimuraDongHoon LeeTrillium-II DataTBDHarold SolbrigUnicode I18NFuqiao XueMark DavisUNESCO I18N, WAI, Generic LiaisonsFuqiao Xue, Shawn Lawton HenryAxel Plathe, Claudio Menezes, Irmgarda KasinskaiteUS Payments Forum Web PaymentsIan JacobsRandy VanderhoofVendorcom Forum Web PaymentsTBDPaul RogersVoiceXML ForumMoU with VoiceXML ForumVoice Browser, MMIKazuyuki AshimuraMichelle HuntWeb3D Consortium(W3C Member) Graphics, Generic LiaisonsChris LilleyDon BrutzmanWHATWGMOUHTML, DOM, Web IDL, HTML Media Capture, Worklets, Resource Hints, Preload, Media Playback Quality, FetchPhilippe Le HégaretWHATWG Steering GroupMission of W3C international liaisonsW3C is determined to improve W3C's liaisons with international organizations in the areas of policy and standardization and to reinforce W3C's commitment to developing one Web for all.International Relations focuses on spreading W3C's messages and technologies beyond the Consortium's usual geographical and Web community frontiers. We pursue the vision and plan outlined in the white paper Worldwide Participation in the World Wide Web Consortium with the goal of making it easier for new stakeholders to discover and participate in W3C's work and values.Contacting W3C to establish a liaisonTo inquire about W3C liaisons and partnerships, or to ask for review of documents in case of existing liaisons, please send email to team-liaisons@w3.org which will reach various W3C staff members active in the liaisons area and end up in the right technical staff. Please see the public International Relations page for background. We have additional specific information about participation in W3C by EU-funded projects.For relationships between W3C and government driven organizations like ISO, ITU, EU normalization (ETSI, CEN), UN efforts like IGF/WSIS, national bodies (ANSI, AFNOR, etc.), and for Internet Governance liaison activities with other Internet organizations like IETF, ICANN, ISOC, also use team-liaisons@w3.org.About the liaison tableEach entry in the table above includes:the name of the organization, linked to its homepage. In addition, formal agreements, like MoU, should be listed herethe W3C activities or technologies affected by the liaisonone or several contact names within W3Cone or several liaison contact names (preferably using an http URL, rather than a mailto)For more information about a particular liaison, please refer to the contact page for the listed individual(s).When an external organization wants to send an ingoing liaison statement to W3C, it should send it to team-liaisons@w3.org, CCing the W3C staff in contact indicated the table above, and assume that this statement will potentially be shared with the entire W3C membership.When an internal W3C group (usually via its Chair) wants to send an outgoing liaison statement from W3C, it should CC it to team-liaisons@w3.org and to the W3C staff contact for the group, and assume that this statement will potentially be shared with the entire W3C membership.Considerations when establishing a liaisonW3C finds its liaisons fall into two categories:simple liaisonsformal agreements for joint work, involving a Memorandum of Understanding (MoU), signed on paper and reviewed by W3C legal, and the Advisory Committee, per process requirement.We list both types of liaisons in the table above. Per the W3C Process Document, all liaisons, of any kind, must be coordinated by the W3C Team due to requirements for public communication, IPR or confidentiality policies. Mutual membership agreements are also possible.W3C may choose not to pursue a liaison with an organization that has selective or arbitrary membership policies that serve only to benefit pre-existing or dominant members.S'''
