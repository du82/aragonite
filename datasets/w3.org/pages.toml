["https://www.w3.org/groups/wg"]
title = "Working Groups | Discover W3C groups | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = "Working Groups Working Groups are the heart of the W3C Process. Most Working Groups produce Recommendations, other technical reports, and sample code. More information about the role of Working Groups can be found in the Process document. Search Closed Show results There are currently 46 open Working Groups. View closed groups Accessibility Guidelines Working Group The mission of the Accessibility Guidelines Working Group (AG WG) is to develop specifications to make content on the Web accessible for people with disabilities and to participate in the development and maintenance of implementation support materials for the Web Content Accessibility Guidelines. Accessible Platform Architectures Working Group The mission of the Accessible Platform Architectures Working Group (APA WG, formerly part of the Protocols and Formats Working Group) is to ensure W3C specifications provide support for accessibility to people with disabilities. The group advances this mission through review of W3C specifications, development of technical support materials, collaboration with other Working Groups, and coordination of harmonized accessibility strategies within W3C. Accessible Rich Internet Applications Working Group The mission of the Accessible Rich Internet Applications Working Group is to enhance the accessibility of web content through the development of supplemental attributes, including roles, states, and other properties, that can be applied to native host language elements and exposed via platform accessibility APIs. Audio Working Group The mission of the Audio Working Group is to add advanced sound and music synthesis capabilities to the Open Web Platform. Ecosystem Media & Entertainment Browser Testing and Tools Working Group The mission of the Browser Testing and Tools Working Group is to produce technologies for use in testing, debugging, and troubleshooting of Web applications running in Web browsers. Cascading Style Sheets (CSS) Working Group The mission of the group is to develop and maintain CSS. Data Shapes Working Group The mission of the Data Shapes Working Group is to update data shapes standards in line with the versions of core Semantic Web standards that cater for RDF-star and to extend the applications of data shapes with new packaging and use specifications. Ecosystem Data and knowledge Dataset Exchange Working Group The mission of the Dataset Exchange WG is to: 1. Maintain and revise the Data Catalog Vocabulary, DCAT, taking into account feature requests from the DCAT user community. 2. Define and publish guidance on the specification and use of application profiles when requesting and serving data on the Web. Ecosystem Data and knowledge Decentralized Identifier Working Group The mission of the Decentralized Identifier Working Group is two-fold. First, it will maintain the Decentralized Identifiers (DIDs) specification and related Working Group Notes. Second, it will seek consensus around the best way to achieve effective interoperability through common requirements, algorithms, architectural options, and various considerations for the DID resolution and DID URL dereferencing processes. Minutes of past meetings Past resolutions Information about the previous DID Working Group is still available on its old homepage. Ecosystem Data and knowledge Devices and Sensors Working Group The mission of the Devices and Sensors Working Group (DAS WG) is to create secure and privacy-preserving client-side APIs that enable the development of web applications that interact with device capabilities. Distributed Tracing Working Group The mission of the Distributed Tracing is to define standards for interoperability between tracing tools. Federated Identity Working Group The mission of the Federated Identity Working Group is to develop specifications to allow a website to request a federated identity credential or assertion with the purpose of authenticating a user and/or requesting a set of claims in a compatible way to OIDC or SAML. GPU for the Web Working Group The mission of the GPU for the Web Working Group is to provide an interface between the Web Platform and modern 3D graphics and computation capabilities present on native system platforms. Ecosystem Media & Entertainment HTML Working Group The mission of the HTML Working Group is to give input to and bring the WHATWG HTML and DOM Review Drafts to W3C Recommendations. Immersive Web Working Group The mission of the Immersive Web Working Group is to help bring high-performance Virtual Reality (VR) and Augmented Reality (AR) (collectively known as XR) to the open Web via APIs to interact with XR devices and sensors in browsers. Ecosystems Media & Entertainment Network & Communications Internationalization Working Group The mission of the Internationalization Working Group is to enable universal access to the World Wide Web by proposing and coordinating the adoption by the W3C of techniques, conventions, technologies, and designs that enable and enhance the use of W3C technology and the Web worldwide, with and between various different languages, scripts, regions, and cultures. JSON-LD Working Group The mission of the JSON-LD Working Group is to maintain the family of JSON-LD 1.1 Recommendations and related Working Group Notes. Ecosystem Data and knowledge Linked Web Storage Working Group The mission of the Linked Web Storage Working Group is to enable the development of web applications where data storage, entity authentication, access control, and application provider are all loosely coupled, as opposed to the web of today where these are typically all tightly coupled and changing one requires changing all, sometimes at the price of all past data. This will be achieved by identifying a set of relevant use-cases, and standardizing a protocol between applications, on the one hand, and identity and storage servers, on the other hand. Ecosystem Data and knowledge Math Working Group The mission of the Math Working Group is to promote the inclusion of mathematics on the Web so that it is a first class citizen of the web that displays well, is accessible, and is searchable. Media Working Group The mission of the Media Working Group is to develop and improve client-side media processing and playback features on the Web. Ecosystems Media & Entertainment Network & Communications MiniApps Working Group The mission of the MiniApps Working Group is to produce specifications that facilitate the development of interoperable and robust MiniApps. Pointer Events Working Group The mission of the Pointer Events Working Group is to provide methods to enable simple device independent input from pointing devices such as mouse, pen, and multi-touch screen. Portable Network Graphics (PNG) Working Group The mission of the PNG Working Group is to maintain and develop the Portable Network Graphics (PNG) specification. Privacy Working Group The mission of the Privacy Working Group is to improve privacy on the Web both by advising groups developing standards on how to avoid and mitigate privacy issues with Web technologies and by standardizing mechanisms that improve user privacy on the Web. Ecosystem Web Advertising Private Advertising Technology Working Group The mission of the Private Advertising Technology Working Group, motivated by the W3C TAG Ethical Web Principles, is to specify web features and APIs that support advertising while acting in the interests of users, in particular providing strong privacy assurances using predominantly technical means. The Working Group welcomes participation from browser vendors, OS vendors, mobile application vendors, advertisers, publishers, ad buyers, advertising platforms and intermediaries, privacy advocates, web application developers, and other interested parties. Ecosystem Web Advertising Publishing Maintenance Working Group The mission of the Publishing Maintenance Working is to maintain the W3C Recommendations, as well as related Notes, in the area of Digital Publishing published by the Audiobooks and the EPUB Working Groups. Ecosystem Publishing RDF Dataset Canonicalization and Hash Working Group The mission of the RDF Dataset Canonicalization and Hash Working Group is to define a standard to uniquely and deterministically calculate a hash of RDF Datasets for use cases such as Detecting changes in Datasets. The work will include defining RDF Dataset Canonicalization algorithms. Ecosystem Data and knowledge RDF-star Working Group The mission of the RDF-star Working Group is to extend a set of RDF and SPARQL related recommendations, with the ability to concisely represent and query statements about statements. Ecosystem Data and knowledge Second Screen Working Group The mission of the Second Screen Working Group is to provide specifications that enable web pages to use secondary screens to display web content. Ecosystem Media & Entertainment Service Workers Working Group The mission of the Service Workers Working Group is to enable Web applications to take advantage of persistent background processing, including hooks to enable bootstrapping of web applications while offline. Spatio-temporal Data on the Web Working Group The mission of the Spatio-temporal Data on the Web Working Group is to: 1) develop and maintain vocabularies and best practices that encourage better sharing of spatial data on the Web; 2) identify areas where standards should be developed jointly by both W3C and the Open Geospatial Consortium (OGC). Ecosystem Data and knowledge SVG Working Group The mission of the Scalable Vector Graphics (SVG) Working Group is to develop and maintain SVG. Timed Text Working Group The mission of the Timed Text Working Group is to develop W3C Recommendations for media online captioning by developing and maintaining new versions of the Timed Text Markup Language (TTML) and WebVTT (Web Video Text Tracks) based on implementation experience and interoperability feedback, and the creation of semantic mappings between those languages. Ecosystem Media & Entertainment Verifiable Credentials Working Group The mission of the Verifiable Credentials Working Group is to maintain the Verifiable Credentials Data Model specification and related Working Group Notes. Ecosystem Data and knowledge Web Application Security Working Group The mission of the Web Application Security Working Group is to develop mechanisms and best practices which improve the security of Web Applications. Web Applications Working Group The mission of the Web Applications Working Group (WebApps WG) is to produce specifications that facilitate the development of client-side web applications. Web Authentication Working Group The mission of the Web Authentication Working Group is to define a client-side API providing strong authentication functionality to Web Applications. Ecosystem E-commerce Web Editing Working Group The mission of the Web Editing Working Group is to explore limitations in existing browser primitives, provide use cases for new APIs and suggest solutions either by standardizing of existing behaviors or introducing new APIs relevant for text editing. The goal is to facilitate the creation of fully-featured editing systems as well as small editors using JavaScript. Web Fonts Working Group The mission of the Web Fonts Working Group is to develop specifications that allow the interoperable deployment of downloadable fonts on the Web. Web Machine Learning Working Group The mission of the Web Machine Learning Working Group is to develop APIs for enabling efficient machine learning inference in the browser. Ecosystem Data and knowledge Web of Things Working Group The Web of Things seeks to counter the fragmentation of the IoT through standard complementing building blocks (e.g., metadata and APIs) that enable easy integration across IoT platforms and application domains. Ecosystem Web of Things Web Payments Working Group The mission of the Web Payments Working Group is to make payments easier and more secure on the Web. Ecosystem E-commerce Web Performance Working Group The mission of the Web Performance Working Group is to provide methods to measure aspects of application performance of user agent features and APIs. Web Real-Time Communications Working Group The mission of the Web Real-Time Communications Working Group is to define client-side APIs to enable Real-Time Communications in Web browsers. These APIs should enable building applications that can be run inside a browser, requiring no extra downloads or plugins, that allow communication between parties using audio, video, and supplementary real-time communication, without having to use intervening servers (unless needed for firewall traversal, or for providing intermediary services). APIs enabling supplementary functions, such as recording, image capture, and screen sharing are also in scope. Ecosystems Media & Entertainment Network & Communications WebAssembly Working Group The mission of the WebAssembly Working Group is to standardize a size- and load-time-efficient format and execution environment, allowing compilation to the web with consistent behavior across a variety of implementations. WebTransport Working Group The mission of the WebTransport Working Group is to develop APIs that enable data transfer between browsers and servers with support for multiple data flows, unidirectional data flows, out-of-order delivery, variable reliability and pluggable protocols. Ecosystems Media & Entertainment Network & Communications API Data available in API"
