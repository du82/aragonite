full_description = "Reports Read this page in: 中文（简体） 日本語 From time to time, the W3C Team publishes reports to draw attention to particular issues, capture shared understanding to identify future exploration, or to propose ideas for consideration. A curated list of such documents follows.Like the former Team Submissions, these reports are not standards-track documents, but are meant to be useful to the community. • Identity & the Web22 August 2024This document proposes an overview of Digital Identities on the Web and an analysis through different use cases of the systemic impact on both the market side and the human side, as well as the role that Web standardization may play in managing that impact.We are gathering input and feedback, preferably before October 6, 2024.• AI & the Web: Understanding and managing the impact of Machine Learning models on the Web13 March 2024This document proposes an analysis of the systemic impact of AI systems, and in particular ones based on Machine Learning models, on the Web, and the role that Web standardization may play in managing that impact.We are gathering input and feedback, preferably before 30 June 2024."
