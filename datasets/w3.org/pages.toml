["https://www.w3.org/2007/02/japanese-layout"]
title = "Japanese Layout Task Force Home Page"
full_description = "This group is now closed. A new Japanese Layout Task Force was created at the end of 2018. See the GitHub home page for that group. The Japanese Layout Task Force is coordinated by the W3C Internationalization Activity. The following working groups are participating in this task force: Mission: To create a document about requirements for general Japanese layout realized with technologies like CSS, SVG and XSL-FO. The document will be mainly based on the standard for Japanese layout, JIS X 4051. However, it will also address areas which are not covered by JIS X 4051. The task force will gather and integrate feedback from the participating working groups about the need and technical feasability of various requirements. To participate, join one of the participating Working Groups. Contact the I18n Activity Lead for more information. In addition, the task force has held a number of longer face-to-face meetings in English in Tokyo and at W3C Technical Plenaries with representatives of the participating Working Groups. The following documents have been published as Working Group Notes. The same document is available in both English and Japanese. The output of the task force will be an English document (a Working Group Note) describing requirements for Japanese Layout. The description will not be on a technology-specific level. It is assumed that the participating working groups (see below) will decide independently how (and if) to implement the requirements in their specifications. A unique feature of the task force is that the work of its Japanese participants is mostly conducted in their native language. Documents are then translated into English, comments from English speaking participants are gathered and brought back etc. This is a new way of W3C helping local communities to make their expertise available for a world-wide audience. Chair: Tatsuo Kobayashi (i18n Core Working Group) Staff contact: Richard Ishida (ishida at w3 dot org) $Id: Overview.html,v 1.79 2019/04/15 14:55:55 rishida Exp $"
year_published = 2025
