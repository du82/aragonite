["https://w3.org/staff/wai"]
title = "Web Accessibility Initiative | Staff | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = "Web Accessibility Initiative W3C's Web Accessibility Initiative (WAI) develops strategies, standards, and supporting resources to make the web accessible to people with disabilities. WAI staff oversees development of guidelines that are widely regarded as the international standard for web accessibility and support materials to help understand and implement accessibility. Rémi Bétin Role: Web Accessibility Initiative (WAI) Team Rémi joined the W3C team in February 2025 to contribute to Web Accessibility Initiative (WAI) projects. His current work includes managing WAI translations, improving content development processes, and contributing to expanding W3Cx accessibility courses. Prior to joining the team, Rémi worked on various projects involving project management, web design and development. In 2021, he got involved in translations of WAI resources as a volunteer. Between 2023 and 2024, he worked part-time on managing the WAI translations and improving the WAI website’s resources and processes. remi@w3.org Rémi's Github account Tamsin Ewing Role: Accessibility Content Specialist Tamsin joined the W3C Web Accessibility Initiative (WAI) team in July 2024. Her work at W3C includes designing and writing content for accessibility resources, developing accessibility course content, supporting accessibility communications, and contributing to collaborative editing of WAI Working Group materials. Tamsin's work is strongly informed by user experience (UX) design principles, design thinking methodology, and best practices in digital accessibility. Tamsin has a Digital Accessibility micro-credential from Victoria University of Wellington, a graduate diploma from Auckland University of Technology in Communications Studies, and an Honours degree from the University of Salford in Modern Languages (French, Spanish and Portuguese), specialising in translation and interpreting. Tamsin is a Certified Professional in Accessibility Core Competencies (CPACC). Prior to joining W3C, Tamsin worked as a content designer and digital accessibility specialist in the New Zealand public sector. Tamsin is based in Wellington, New Zealand. tamsin@w3.org Tamsin's Github account Ken Franqueiro Role: Web Software Engineer Ken joined W3C in May 2024 to improve the architecture of surfaces related to the Web Accessibility Initiative (WAI). He began by rewriting the build system that generates informative documentation for the Web Content Accessibility Guidelines' Techniques and Understanding documents. Ken has been working with Web technologies for over 15 years, including as a committer/maintainer to multiple open-source front-end libraries, and is excited to focus full-time on static site generation. kfranqueiro@w3.org Ken's Github account Shawn Lawton Henry Role: Web Accessibility Initiative (WAI) Program Lead Shawn joined W3C in February 2003 to lead worldwide education and outreach activities promoting digital accessibility for people with disabilities through the W3C Web Accessibility Initiative (WAI). As WAI Program Lead she directs collaboration on WAI vision, strategic plan, implementation priorities, and stakeholder engagement in W3C accessibility activities. Shawn focuses her personal passion for accessibility on bringing together the needs of individuals and the goals of organizations in designing human-computer interfaces. She holds a BSc in English with focus on computer science and technical writing, and an MSc in Digital Inclusion. Shawn often uses 'shawna' for public accounts to help communicate that she is a 'cisgender' female. 'Shawn' is given/first name, 'Lawton' is middle name (and previous family name), 'Henry' is family/last name; it's not hyphenated. More about Shawn... shawn@w3.org Shawn Lawton's Github account Daniel Montalvo Role: Accessibility Specialist Daniel Montalvo joined the W3C Web Accessibility Initiative (WAI) in 2019 to edit the Curricula on Web Accessibility. He is currently the Staff Contact for the Accessible Rich Internet Applications (ARIA) Working Group, the WCAG2ICT Task Force, and the Accessibility Conformance Testing (ACT) Task Force. He supports accessibility across W3C, providing guidance and reviews. Daniel liaises with standards organizations, people with disabilities, and other stakeholders to support W3C standardization efforts. dmontalvo@w3.org Daniel's Github account Ruoxi Ran Role: Web Accessibility Engineer Roy (冉若曦) joined World Wide Web Consortium in August 2017, working as a Web Accessibility Specialist in W3C Web Accessibility Initiative (WAI). Roy is currently based in Beijing, W3C China host of Beihang University. He works with the Accessible Platform Architectures Working Group, Accessibility Guidelines Working Group and Education and Outreach Working Group. Also, he is responsible for the promotion, coordination, and harmonization of web accessibility standards in China. Roy received his Master's Degree in Software Engineering and did some research work on accessibility during his postgraduate life, meanwhile, he is working on a PhD at Zhejiang University. More... ran@w3.org Ruoxi's Github account Kevin White Role: Accessibility Technical Lead Kevin is Accessibility Technical Lead for the Web Accessibility Initiative (WAI) at the World Wide Web Consortium (W3C). In this role Kevin contributes to internationally recognized standards that support accessibility. He leads the WAI-CooP, co-funded by the European Commission. Kevin provides support and oversight of the accessibility Working Groups, collaborates on WAI strategic planning, and manages W3C accessibility support. More... kevin@w3.org Kevin's Github account"
