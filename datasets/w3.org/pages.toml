["https://w3.org/ecosystems/e-commerce"]
title = "E-commerce | Business Ecosystems | W3C"
description = "The page introduces the concept of payments and commerce applied to the web, and what is done for them at the Web Consortium."
full_description = "E-commerce Read this page in: 中文（简体） Making payments and commerce easier and more secure on the web. The web is transforming payments To help ensure that the Web evolves to meet new industry needs, we’re convening e-commerce companies, payment service providers, card networks, banks, browser vendors, and others to shape the way Web Payments and E-commerce are developed. Write to us to join W3C and start contributing to the work Learn about recent W3C work in web payments (Apr. 2023) Our community is focusing onReducing cart abandonment rates.Streamlining authentication and reducing fraud.Fostering digital payment method innovation.The impact of emerging regulations on Web architecture and capabilities.Harmonization with other standards efforts such as FIDO and EMVCo.Focusing on deliverable APIs to increase the convenience and security of Web Payments.Increasing security across the field of payments on the web.Gathering voices to guide the next phase of payments on the web. Active groups These groups work to create and implement software and APIs to make web payments easier and more secure, or provide a forum for discussion and implementation of new standards, and also allow Members to discover and fix gaps in interoperability of W3C’s standards and APIs. Web AuthenticationWorking group The mission of the Web Authentication Working Group is to define a client-side API providing strong authentication functionality to Web Applications. Visit the Web Authentication Working Group Web PaymentsWorking group The mission of the Web Payments Working Group is to make payments easier and more secure on the Web. Visit the Web Payments Working Group Web Payment SecurityInterest group The mission of the Web Payment Security Interest Group is to enhance the security and interoperability of various Web payments technologies. The group pursues its mission by creating a forum for organizations to define areas of collaboration and identify gaps between existing technical specifications in order to increase compatibility among different technologies. Visit the Web Payment Security Interest Group Anti-FraudCommunity group The mission of the Anti Fraud Community Group is to identify and define scenarios involving fraud and unwanted traffic, as well as to incubate and develop web features and APIs to address those scenarios while improving user security, privacy, and accessibility. Fraud and unwanted traffic can include web activity perpetrated by botnets, attackers impersonating users, and other activity that intends to harm users or compromise web services. The group welcomes participation from anti-fraud service providers, common targets of unwanted traffic, browser vendors, web privacy advocates, web application developers, web hosting and cloud service providers, and other interested parties. The Community Group will discuss issues that server operators and anti-fraud service providers face in this area and ideas for new web features and APIs intended to be implemented in browsers or similar user agents. Visit the Anti-Fraud Community Group Why join?Since 1994, we have been leading the World Wide Web to its full potential by developing protocols and guidelines that ensure long-term growth of the web.By joining these groups, you have the ability to discuss and drive the standards produced by W3C. The conversations occurring in the groups concern both current and future standards, constantly aiming to make the web a better place. You have the ability to take part in guiding the future of the web.Our values revolve around building the web for allThe social value of the web is that it enables human communication, commerce, and opportunities to share knowledge. One of W3C's primary goals is to make these benefits available to all people, whatever their hardware, software, network infrastructure, native language, culture, geographical location, or physical or mental ability. Recent activities in the E-commerce and Web Payments community Find out more via recent stories, news, workshops, talks or events. W3C advances technology to streamline payment authentication Secure Payment Confirmation (SPC), published as W3C Candidate Recommendation, is feature-complete and ready for further implementations. Press release Call for Implementations: Secure Payment Confirmation published as a W3C Candidate Recommendation News EMVCo, FIDO Alliance, and W3C Update Resource on How Technologies Relate News Payments and Authentication: Driving toward a Whole Greater than Parts Blog W3C Members 75 member organizations are involved in the e-commerce ecosystem, including: Criteo JCB CO., LTD. Oracle Corporation IBM Corporation Microsoft Corporation Bitwarden View all members participating in the e-commerce ecosystem Ways to get involved: Join Donate Need more information tailored to your organization? Our Evangelists understand that every organization is different! Evangelists represent W3C in various locations and are an extension of W3C's Business Development Team. They are responsible for identifying and recruiting new W3C Members, running local events, promoting W3C Training and fostering Sponsorship. Our E-commerce evangelist Paul Rodgers W3C Evangelist - Payments, Europe Tel: +44.7785.502605 Email: paul.rodgers@w3.org Related RSS feed Subscribe to our E-commerce feed"
