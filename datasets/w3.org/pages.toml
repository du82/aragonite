["https://w3.org/news/2025/css-snapshot-2024-published-as-w3c-group-note"]
title = "CSS Snapshot 2024 Published as W3C Group Note | 2025 | News | W3C"
description = "This document collects together into one definition all the specifications that together form the current state of Cascading Style Sheets (CSS) as of 2024."
full_description = "CSS Snapshot 2024 Published as W3C Group Note Author(s) and publish date Published: 25 February 2025 The CSS Working Group published the CSS Snapshot 2024 as a Group Note. This document collects together into one definition all the specifications that together form the current state of Cascading Style Sheets (CSS) as of 2024. The primary audience is CSS implementers, not CSS authors, as this definition includes modules by specification stability, not Web browser adoption rate. When the first CSS specification was published, all of CSS was contained in one document that defined CSS Level 1. CSS Level 2 was defined also by a single, multi-chapter document. However for CSS beyond Level 2, the CSS Working Group chose to adopt a modular approach, where each module defines a part of CSS, rather than to define a single monolithic specification. This breaks the specification into more manageable chunks and allows more immediate, incremental improvement to CSS. Since different CSS modules are at different levels of stability, the CSS Working Group has chosen to publish this profile to define the current scope and state of Cascading Style Sheets as of 2024."
