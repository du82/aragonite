["https://w3.org/2005/MWI/BPWG"]
title = "W3C Mobile Web Best Practices Working Group"
full_description = "The Mobile Web Best Practices Working Group is now closed. The group operated from early 2005 until December 2010. The W3C Members chartered the Mobile Web Best Practices Working Group in 2005 as part of the Mobile Web Initiative (sponsors) to develop a set of technical best practices and associated materials in support of development of web sites that provide an appropriate user experience on mobile devices. The group operated in public, through several Task Forces, including work on a Java implementation of a mobileOK checker library. The group interacted with the community at large, working in public in its publicly archived mailing list public-bpwg@w3.org. Comments on its documents may still be sent to the archived mailing list public-bpwg-comments@w3.org. Daniel Appelquist and Jo Rabin chaired the group. The W3C Staff Contacts were François Daoust and Dominique Hazaël-Massieux. The group operated under the W3C Patent Policy (5 February 2004 Version). Information about patent disclosures by group participants and other requirements of the W3C Patent Policy is available. To learn more about the Mobile Web Best Practices and Mobile Web Application Best Practices, readers may find it useful to take a look at the Mobile Web Best Practices flipcards and at the Mobile Web Application Best Practices card that summarize the best practices; and/or to check their web site for mobile-friendliness using the W3C mobileOK checker based on the library developed by the Working Group."
