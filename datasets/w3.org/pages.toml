["https://www.w3.org/2001/tag"]
title = "W3C Technical Architecture Group"
full_description = "Introduction to the TAG The TAG is a special working group within the W3C, chartered (under the W3C Process Document) with stewardship of the Web architecture. As outlined in the W3C Process Document, there are three aspects to this mission: to document and build consensus around principles of Web architecture and to interpret and clarify these principles when necessary; to resolve issues involving general Web architecture brought to the TAG; to help coordinate cross-technology architecture developments inside and outside W3C. See the TAG current work page for details of how to work with it, upcoming events, and its publications. Who are the TAG? Photo Credit: Peter Linss The TAG in Edinburgh, December 2024 Left to right: Jeffrey Yasskin, Peter Linss, Hadley Beeman, Martin Thomson, Amy Guy, Yves Lafon, Daniel Appelquist, Theresa O'Connor, Matthew Atkinson The TAG has 12 participants (8 elected, 3 appointed, and 1 life member) plus a staff contact: Daniel Appelquist (Chair) 1 Matthew Atkinson 1 Hadley Beeman (Chair) 2 Tim Berners-Lee (Emeritus Chair) 6 Marcos Cáceres 2 Sarven Capadisli 2 Xiaocheng Hu 2 Yves Lafon (staff contact) Dapeng (Max) Liu 1 Tristan Nitot 5 Lola Odelola 3 Martin Thomson 1 Jeffrey Yasskin (Chair) 5 See more information about TAG participants. 1 Two-year term begins 1 Feb 2024 (see 2023 election results). 2 Two-year term begins 1 Feb 2025 (see 2024 election results). 3 Two-year term begins 1 Feb 2025 (see announcement). 5 Two-year term begins 1 Feb 2024 (see announcement). 6 Life member The TAG is partly elected by the Advisory Committee and partly appointed by the W3C Team. Each year the nomination period typically starts 1 November the election typically starts 1 December. The TAG follows the guidelines for communicating as a member of a W3C elected body."
year_published = 2025
