["https://www.w3.org/2011/12/mlw-lt-charter"]
title = "MultilingualWeb-LT Working Group"
full_description = 'The mission of the MultilingualWeb-LT Working Group, part of the Internationalization Activity, is to define meta-data for web content (mainly HTML5) and "deep Web" content, for example a CMS or XML files from which HTML pages are generated, that facilitates its interaction with multilingual technologies and localization processes. The MultilingualWeb-LT Working Group will enhance the foundation for the integration of language related technologies into core Web technologies. This will be achieved via the creation of a W3C Recommendation defining metadata applicable by language related technologies in the Web. Beginning with the network of stakeholders built via the MultilingualWeb and META-NET projects, the Working Group will create broad consensus across communities, involving producers of content, localization workers, language technology experts, browser vendors, tool makers and users. MultilingualWeb-LT will lay the technical foundations for new business opportunities for content creators and the vendors who provide them with language and content services and tools. This will enable content creators and distributors to reach out to a growing linguistic and cultural diversity of Web users world wide, and to respond to their specific needs in a timely and cost-effective manner. MultilingualWeb-LT will base its work on the ITS 1.0 specification. MultilingualWeb-LT will produce the successor of ITS 1.0. ITS 1.0 provides conceptual, prose descriptions of its data categories for XML documents, with examples of possible syntax. The MultilingualWeb-LT Working Group has four goals: In addition to the data categories mentioned above, MultilingualWeb-LT MAY discuss data categories in the following areas. The MultilingualWeb-LT Working Group does not commit to define metadata for these data categories, but MAY do so, if this does not influence the timeline described below. In addition, the MultilingualWeb-LT Working Group MAY discuss "Issues and Proposed Features" provided by the ITS Interest Group.'
year_published = 2025
clearnet = "https://www.w3.org/2011/12/mlw-lt-charter"
