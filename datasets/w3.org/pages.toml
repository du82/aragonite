["https://w3.org/WAI"]
title = "Home | Web Accessibility Initiative (WAI) | W3C"
description = "Accessibility resources free online from the international standards organization: W3C Web Accessibility Initiative (WAI)."
full_description = "Collaboration Tools Accessibility User Requirements - Note Published (2025-Jan-21) Collaboration Tools Accessibility User Requirements is a completed W3C Group Note. The document covers accessibility user needs, requirements, and scenarios for collaborative content creation and development tools. The solutions identified in this document are intended to influence the evolution of future accessibility guidelines, technical specifications, or features of collaboration tools and assistive technologies. They are also relevant to software developers who contribute to developing the collaborative experience. For Review: WCAG 3 Working Draft - example guidelines and conformance (2024-Dec-12) An updated W3C Accessibility Guidelines (WCAG) 3.0 Working Draft is available for review. For a summary of changes, new content for review, and how to comment, see the WCAG 3 Introduction section Status: In-progress drafts. WCAG 2.1 and WCAG 2.2 published with minor editorial updates (2024-Dec-12) The W3C Accessibility Guidelines Working Group (AG WG) is addressing open issues on Web Content Accessibility Guidelines (WCAG) 2.1 and 2.2. Most issue resolutions resulted in updates to Understanding WCAG and Techniques for WCAG. Some resulted in minor editorial updates to the WCAG standard. Today W3C published updates to: Web Content Accessibility Guidelines (WCAG) 2.1 and Web Content Accessibility Guidelines (WCAG) 2.2. For a list of updates, see the Change Log section of each document. Please share this web page as the place to start for up-to-date information on WCAG 2: WCAG 2 Overview. WCAG2ICT Note Published (2024-Oct-08) Guidance on Applying WCAG 2 to Non-Web Information and Communications Technologies (WCAG2ICT) is a completed W3C Group Note. WCAG2ICT describes how Web Content Accessibility Guidelines (WCAG) principles, guidelines, and success criteria can be applied to non-web information and communications technologies (ICT), specifically to non-web documents and software. The document includes guidance for WCAG 2.0, 2.1, and 2.2 success criteria and glossary terms. WCAG2ICT has been a key resource for including WCAG in ICT accessibility regulation, legislation, and standards around the world. This update facilitates further adoption of WCAG 2.1 and WCAG 2.2 in non-web contexts. For an introduction, see: WCAG2ICT Overview."
author = "W3C Web Accessibility Initiative (WAI)"
