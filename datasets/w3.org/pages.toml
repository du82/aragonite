["https://w3.org/Amaya"]
title = "Amaya Home Page"
description = """
Amaya is a Web editor, i.e. a tool used to create and update
documents directly on the Web. Browsing features are seamlessly integrated with
the editing and remote access features in a uniform environment. This follows
the original vision of the Web as a space for collaboration and not just a
one-way publishing medium."""
full_description = "Amaya is a Web editor, i.e. a tool used to create and update documents directly on the Web. Browsing features are seamlessly integrated with the editing and remote access features in a uniform environment. This follows the original vision of the Web as a space for collaboration and not just a one-way publishing medium. Work on Amaya started at W3C in 1996 to showcase Web technologies in a fully-featured Web client. The main motivation for developing Amaya was to provide a framework that can integrate as many W3C technologies as possible. It is used to demonstrate these technologies in action while taking advantage of their combination in a single, consistent environment. Amaya started as an HTML + CSS style sheets editor. Since that time it was extended to support XML and an increasing number of XML applications such as the XHTML family, MathML, and SVG. It allows all those vocabularies to be edited simultaneously in compound documents. Amaya includes a collaborative annotation application based on Resource Description Framework (RDF), XLink, and XPointer. Visit the Annotea project home page. Amaya is an open source software project hosted by W3C. You are invited to contribute in many forms (documentation, translation, writing code, fixing bugs, porting to other platforms...). The Amaya software is written in C and is available for Windows, Unix platforms and MacOS X. The application was jointly developed by W3C and the WAM project (Web, Adaptation and Multimedia) at INRIA. Amaya is covered by the W3C Software Notice and License. The icon can be inserted in your Web pages when they are created and edited by Amaya."
year_published = 2025
clearnet = "https://w3.org/Amaya"
