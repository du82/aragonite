description = "W3C coordinates the development of standards for the Internet or the Web through liaisons with national, regional and international organizations."
full_description = '''Liaisons Read this page in: 中文（简体） 日本語 Page contents LiaisonsMission of W3C international liaisonsContacting W3C to establish a liaisonAbout the liaison tableConsiderations when establishing a liaisonW3C and De Jure standards Many organizations in addition to W3C develop standards for the Internet or the Web. In order to coordinate the development of the Web, W3C engages in liaisons with numerous organizations after careful consideration of the costs and benefits.As defined in the W3C Process Document, the term "liaison" is used to refer to coordination of activities with a variety of organizations, through a number of mechanisms ranging from very informal to mutual membership, or even more formal agreements. Liaisons are not meant to substitute for W3C membership.W3C is a broad community which covers standardization work in W3C Working Groups and incubation work in W3C Community Groups (CGs). Listing a formal liaison with W3C on behalf of a CG on this page is generally discouraged because CG output does not represent the consensus of the W3C Community (of course informal liaison is always encouraged). If an external group outside of W3C would like a Liaison with a CG, they must write up their rationale and be explicit that they understand that the CG work is not normative. If there is such a request, it should be sent to team-liaisons@w3.org for approval.While this page is public, some links may be W3C member-only.Contact W3C about a new or existing liaison.LiaisonsLiaison index: 3 • A • B • C • D • E • F • G • H • I • J • K • L • M • N • O • P • S • T • U • V • WOrganizationMOUW3C activities affectedW3C contactLiaison contact3GPP 3rd Generation Partnership Project Media and Entertainment, SVG, Timed TextKazuyuki Ashimura, Chris Lilley>, François Daoust, Philippe Le Hégaret3GPPLiaison alias, Paolo Usai, SVG: Tolga CapinAccord Project Verifiable claims, BlockchainTBDPeter HunnACM The Web Conference Steering Committee CommunicationsPierre-Antoin