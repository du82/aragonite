["https://w3.org/People/Bos"]
title = "Home Page of Bert Bos"
description = "Home Page of Bert Bos"
full_description = "I studied Mathematics in Groningen (1982-1987), wrote a thesis about Graphic User Interfaces (1987-1993), worked on an Internet browser and the surrounding infrastructure for the Faculty of Arts in Groningen (among other things), and am now working for The World Wide Web Consortium on style sheets, math and privacy, among other things. Cascading Style Sheets – designing for the Web (3rd ed.) Hakon Wium Lie & Bert Bos 2005 ISBN 0321193121 (See errata) Provence (which includes the Côte-d'Azur) is the region in Southern France that lies roughly between the Rhone river in the west, the Italian border in the east, the Mediterranean Sea in the south, and halfway into the Alps in the north. I have a few thousand photos of Provence: page 1, page 2 and page 3 (slow link). (The thumbnail page is generated with a script.) R2sync is a program to efficiently synchronize two (local or remote) directories. (Efficient in the sense that it tends to reduce network traffic if files differ only little, thanks to the rsync algorithm, but at the cost of more local computations.) It is similar to unison. B6+ is a framework for slides. It consists of a JavaScript script that runs in a browser to display slides written in HTML. I've thrown together a few simple C programs that can number headings in HTML, make a table of contents, extract elements, pretty-print, etc. Binaries are available through Debian. gb (a.k.a. GHURLBot) and AgendaBot are two IRC bots that help with (W3C) meetings that take minutes on IRC. The former manages issues and action items on GitHub via commands in IRC, the latter find the agenda for a meeting in the W3C calendar or the mail archives. If you often translate XHTML files, you may want to convert the XHTML to PO, translate that, and convert back. I wasn't completely satisfied with the converters I found, so I made a perl script, poxhtml. (XHTML only; to work with HTML, combine it with Tidy or my HTML utilities.) hcalproxy runs as a proxy and converts hCalendar microformat into icalendar: if http://example.org/ex.html is an HTML document, then http://localhost:8000/http://example.org/ex.html is an icalendar document with all events from that HTML document."
