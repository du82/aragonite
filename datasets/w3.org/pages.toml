["https://w3.org/staff"]
title = "Staff | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = "Staff The W3C Team is composed of 53 people of mixed gender, age and race who come from 14 different regions across the globe. With a truly international flavor, the Team operates primarily remotely and includes engineers and experts who work from more than 10 different countries. See group photos we took over the years. Read more about W3C’s functional organization. Would you like to work for W3C? See if we have job postings. Family name starts with AllABCDEFGHIJKLMORSTVWXY Show results Clear all Browse by W3C teams Browse by W3C teams Administration & Operations Architecture & Technology Business Development Community Management Industry Legal Marketing & Communications Member Relations Project Senior Leadership Strategy Systems Web Accessibility Initiative Alumni Alumni Denis Ah-Kang Denis joined W3C in August 2011, as part of the Systems Team, to become the W3C Webmaster at the MIT host site in Cambridge, MA, USA. Between 2013 and 2014, he joined the Interaction Domain to work on the HTML5 test suite. He is now working on maintaining the W3C infrastructure and is involved in the development of the publications tools. Prior to joining W3C, Denis worked for various consulting companies as a software developer. Denis is currently based in Reunion Island. denis@w3.org Denis's Github account Catrina Ahlbach Role: Chief of Staff, Manager of the Office of the CEO Catrina joined W3C in December 2024. A long time web developer and evangelist, she is now working on an Masters in Library and Information Studies. catrina@w3.org Catrina's Github account Kazuyuki Ashimura Role: Team Contact for WoT and ME; Project Specialist; Smart Cities Industry Champion Project Professor, Graduate School of Media and Governance, Keio University Kaz joined the W3C Team at Keio University SFC in April 2005. Prior to joining the Team, Kaz worked for twelve years on research and development on speech and natural language processing. He is interested in Web technologies in general, esp. those related to Voice/Multimodal, Web&TV, WoT and Smart Cities. He would like to make people happy using the Web technologies. Kaz received his B.S. in Mathematics from Kyoto University and his Doctor of Engineering degree from Nara Institute of Science and Technology. ashimura@w3.org Kazuyuki's Github account Tim Berners-Lee Role: Founder, Emeritus Director, Honorary Member of the Board of Directors, World Wide Web Consortium Tim is W3C's Founder, Emeritus Director, Honorary Member of the Board of Directors. He is the 3COM Founders Professor of Engineering in the School of Engineering, and at the Department of Electrical Engineering and Computer Science at MIT's CSAIL. Tim founded and is on the board of the World Wide Web Foundation, whose mission is consistent with W3C's only broader. The Web Foundation will put the power of the Web into the hands of people around the world through effective, high-impact programs. Tim invented the World Wide Web in 1989 while working at CERN, the European Particle Physics Laboratory in Geneva, Switzerland. He wrote the first WWW client (a browser-editor running under NeXTStep) and the first WWW server along with most of the communications software, defining URLs, HTTP and HTML. Prior to his work at CERN, Tim was a founding director of Image Computer Systems, a consultant in hardware and software system design, real-time communications graphics and text processing, and a principal engineer with Plessey Telecommunications in Poole, England. He is a graduate of Oxford University. More... timbl@w3.org Tim's Github account Rémi Bétin Role: Web Accessibility Initiative (WAI) Team Rémi joined the W3C team in February 2025 to contribute to Web Accessibility Initiative (WAI) projects. His current work includes managing WAI translations, improving content development processes, and contributing to expanding W3Cx accessibility courses. Prior to joining the team, Rémi worked on various projects involving project management, web design and development. In 2021, he got involved in translations of WAI resources as a volunteer. Between 2023 and 2024, he worked part-time on managing the WAI translations and improving the WAI website’s resources and processes. remi@w3.org Rémi's Github account Bert Bos Role: Communications Bert Bos completed his Ph.D. in Groningen, The Netherlands, on a prototyping language for graphical user interfaces. He then went on to develop a browser targeted at humanities scholars, before joining the W3C at INRIA/Sophia-Antipolis in October 1995. He is co-inventor of CSS and created & led W3C's Internationalization activity. After working on HTML and XML, he led for many years the CSS and later also the Mathematics activities. He is now working on privacy technologies and is part of the W3C communications team. More... bert@w3.org Bert's Github account Carine Bournez Carine joined the W3C team in 2001 as part of the Jigsaw HTTP server development team. She holds an engineer degree and a PhD in Computer Science, with a research area in distributed artificial intelligence and multi-agent systems. She has worked in the Web Services Activity and the XML Activity as staff contact for multiple Working Groups, in several EU-funded projects, in the Systems Team, and in internal tools development. Currently staff for WebRTC WG, Web Performance WG, SVG WG. More... carine@w3.org Carine's Github account Sylvia Cadena Role: Chief Development Officer I joined the World Wide Web Consortium (W3C) as Chief Development Officer in September 2024 to focus on setting direction and expanding development portfolio across internationalization, accessibility, privacy and security for the Web, ensuring the longevity of the organization by defining a vision for financial security. I am a seasoned international development expert with 30 years’ experience across Latin America and the Asia Pacific. I have extensive experience in fundraising, design, management and reporting at local, national and regional level, leading purposeful collaborations that strategically use the Internet and the Web for social, economical, and cultural development. Before W3C, I worked at APNIC for 16 years. During my tenure, I worked to establish the Information Society Innovation Fund (ISIF Asia); the Seed Alliance and more recently the APNIC Foundation, where I worked to expand its grant making, allocating close to 11M USD to close to 200 initiatives across 32 economies. I also led the design and implementation of a number of training and professional development initiatives addressing gender diversity and social inclusion in APAC. Throughout my career I have served the Internet technical community on a variety of roles across a number of advisory bodies and selection committees related to Internet Governance, innovation, women in technology and professional development initiatives with a focus on the Internet industry, at a global and regional level. I have addressed many national, regional and international conferences. Read more in my LinkedIn profile. sylvia@w3.org Sylvia's Github account Laurent Carcone Role: Systems Team Laurent joined the W3C team in September 2000 to participate in the development of Amaya. He is now part of the Sytems Team. Before joining the W3C, he worked as an engineer at INRIA Grenoble. Laurent hold an engineering degree in computer science from the CNAM Grenoble (Conservatoire National des Arts et Métiers) in 1997. More... laurent@w3.org Laurent's Github account Pierre-Antoine Champin Role: Data Strategist Pierre-Antoine joined W3C in February 2021, as a fellow from ERCIM, then from Inria. He is a member of the Strategy Team, with a focus on Data Interoperability. Before that, he has been involved in many Linked Data and Semantic Web related working groups (including RDF 1.1, Linked Data Platform and JSON-LD). He has been working with RDF and other Semantic Web technologies for as long as he can remember. Pierre-Antoine received an engineering degree from INSA Lyon in 1997 and a PhD in Computer Science from Université Claude Bernard Lyon 1 in 2002. He is currently based in Lyon, France. pierre-antoine@w3.org Pierre-Antoine's Github account François Daoust François takes part in on-going discussions and developments around the convergence between Web and media, serving both as Entertainment Champion in the Industry team and as Media Specialist in the Strategy team. François is also staff contact for the media-related Media Working Group, Second Screen Working Group and GPU for the Web Working Group. François initially joined W3C in November 2007 from Microsoft where he integrated an on-portal mobile search engine called MotionBridge. From 2007 to 2011, he served as staff contact for the Mobile Web Best Practices Working Group, the Web and TV Interest Group, the Web Real-Time Communications Working Group and was co-Activity Lead for the Web and TV Activity. He left W3C at the end of 2011 to develop cross-platform Web applications in a French start-up called Joshfire. François came back to W3C on May 2014. fd@w3.org François's Github account Seth Dobbs Role: W3C President & CEO Seth is W3C President & Chief Executive Officer (CEO) since November 2023. Seth reports to the W3C Board of Directors and takes responsibility for the fiscal integrity, financial stability and revenue generation of the World Wide Web Consortium (W3C). He leads the change management and integration efforts for W3C to create new offerings, seek broader financial support opportunities, and succeed as a public-interest not-for-profit with global partners. He oversees shaping and running W3C in line with its mission to lead the Web to its full potential. More... seth@w3.org Seth's Github account Tamsin Ewing Role: Accessibility Content Specialist Tamsin joined the W3C Web Accessibility Initiative (WAI) team in July 2024. Her work at W3C includes designing and writing content for accessibility resources, developing accessibility course content, supporting accessibility communications, and contributing to collaborative editing of WAI Working Group materials. Tamsin's work is strongly informed by user experience (UX) design principles, design thinking methodology, and best practices in digital accessibility. Tamsin has a Digital Accessibility micro-credential from Victoria University of Wellington, a graduate diploma from Auckland University of Technology in Communications Studies, and an Honours degree from the University of Salford in Modern Languages (French, Spanish and Portuguese), specialising in translation and interpreting. Tamsin is a Certified Professional in Accessibility Core Competencies (CPACC). Prior to joining W3C, Tamsin worked as a content designer and digital accessibility specialist in the New Zealand public sector. Tamsin is based in Wellington, New Zealand. tamsin@w3.org Tamsin's Github account Marie-Claire Forgue Role: Head of W3C Training Marie-Claire Forgue serves as Head of W3C Training. She developed the W3Cx MOOC program, in partnership with edX, where Web developers worldwide can learn front-end Web development techniques using W3C Web standards. Previously, she crafted W3DevCampus, a learning platform hosting small private courses. Additionally, Marie-Claire is a member of the W3C Developer relations team, organizing meetups and participating in online and in-person communities via forums, social media (@w3cdevs), etc. She is also involved in the dissemination activities of several projects funded by the European Commission. She joined W3C in 2001 and served as Head of W3C European Communications for over 10 years. Marie-Claire received a Ph.D. degree (computer graphics and parallel processing) in Computer Science from the University of Côte d'Azur and INRIA, France. After a year as a postdoctoral fellow at the Dynamic Graphics Project Lab at the University of Toronto, Canada, she worked at NTT's Human Interface Lab, Japan, for two years. Her research interests were focused on illumination algorithms and scene modeling. After that, she studied filmmaking in Vancouver, Canada. She has directed several short films and documentaries, and got interested in interactive multimedia back in 1993. mcf@w3.org Marie-Claire's Github account Ken Franqueiro Role: Web Software Engineer Ken joined W3C in May 2024 to improve the architecture of surfaces related to the Web Accessibility Initiative (WAI). He began by rewriting the build system that generates informative documentation for the Web Content Accessibility Guidelines' Techniques and Understanding documents. Ken has been working with Web technologies for over 15 years, including as a committer/maintainer to multiple open-source front-end libraries, and is excited to focus full-time on static site generation. kfranqueiro@w3.org Ken's Github account Emma Fraser Role: Board enablement specialist Emma joined W3C in July 2024, fresh out Wellesley College '24, to assist as recording secretary for the Advisory Board and Board of Directors. She graduated Magna Cum Laude with degrees in Psychology and East Asian Languages and Cultures with a focus in Chinese. She also published research in Psychology investigating the correlation between the sexualization of female characters in video games and hostile sexism, comparing genres with sexist/feminist attitudes. ef@w3.org Emma's Github account Christine Gefaell Role: Director of Legal & Compliance Christine joined the W3C Team in October 2024 as Director of Legal and Compliance to ensure W3C operates in full compliance with all applicable laws and regulations throughout the world, to advise on all legal matters, to guide the organization's policies, ultimately furthering our mission and goals. Prior to joining W3C, Christine worked as an associate general counsel in the ethics and compliance department at a global, biotech company focusing on areas such as antitrust, trade compliance, anti-bribery/anti-corruption, human rights, and risk management, generally. Previous to this corporate position, she worked in litigation as a defense, professional malpractice attorney. Christine is licensed in both New Jersey and Connecticut. See her LinkedIn profile for more information. christine@w3.org Christine's Github account Dominique Hazaël-Massieux Role: W3C Community Management Lead, W3C Staff Contact & VR/AR Strategy Specialist Dominique is W3C Developer Relations Lead, W3C Community Development Lead (in charge of managing the Community Groups program), part of the W3C Project Management team, W3C Strategy Specialist on Virtual and Augmented Reality, and serves as staff contact in the Web Real-Time Communications Working Group, the Web and Machine Learning Web Working Group, and the Web & Networks Interest Group. He is the General Manager of ERCIM, the W3C Partner in Europe. He also develops tools and applications as needed in his various roles. He joined initially W3C’s Communication and Systems Team as a member of the Webmaster Team in October 2000; after having join"
