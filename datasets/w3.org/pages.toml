full_description = "Evangelists Read this page in: 中文（简体） 日本語 Page contents What are W3C EvangelistsHow to become a W3C EvangelistMember access to the W3C websitePeriodic reviewW3C Evangelist identity What are W3C EvangelistsW3C Evangelists represent W3C in various locations and are an extension of W3C’s Business Development Team. They are responsible for identifying and recruiting new W3C Members, running local events, promoting W3C Training and fostering Sponsorship. An Evangelist may cover all W3C technologies in a particular geographic region or be responsible for a particular business ecosystem within an assigned geography.W3C Evangelist Program Directory of W3C EvangelistsHow to become a W3C EvangelistAn individual becomes a W3C Evangelist as follows:Someone in W3C Management has contacted you.Or, you are providing a number of the services discussed in the W3C Evangelist Program, or are part of an organization that does; in which case, please let us know.Member access to the W3C websiteW3C Evangelists may be granted “Member access” to the W3C website.Periodic reviewThe status of all W3C Evangelists is reviewed every year, and may be reviewed more frequently.W3C Evangelist identityPublic directoryThe public W3C Evangelists directory exposes a combination of W3C database information and information an Evangelist has entered (or will have to enter) in their W3C profile:First and Last NamePhotoGitHub icon linking to Github profileTitleBiography"
