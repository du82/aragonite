title = "W3C Patent Policy Overview"
full_description = "W3C operates under a royalty-free patent policy by which participants in standards development make commitments to license their standards-essential patents royalty-free to implementers and users of the W3C specifications. In February 2004, W3C adopted a Royalty-Free Patent Policy to enable continued innovation and widespread adoption of Web standards developed by the World Wide Web Consortium. The W3C Patent Policy is designed to: On 15 September, 2020, W3C adopted an updated version, the 15 September 2020 Patent Policy. The 2020 update supports patent protection at earlier Candidate phases of development, supporting unencumbered implementation and use even as specifications continue to evolve. Copyright © 2024 World Wide Web Consortium. W3C® liability, trademark and permissive license rules apply."
