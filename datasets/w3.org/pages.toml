["https://w3.org/2024/09/TPAC/participation.html"]
title = "TPAC 2024: Participation rules"
full_description = "Skip ⬇ Participation policies and recommendations Before you register to attend a meeting, please read the below participation policies and recommendations, intended to promote participation while ensuring that meeting Chairs have the tools necessary to run their meetings effectively. They apply both for in-person and remote participation. See also: Health rules and covid safety expectations W3C meetings operate under our Code of Conduct. Skip ⬇ Working, Interest, Business and Community Group meetings Registration and attendance are open to: participants in a W3C Working, Interest, Business or Community Group scheduled to meet during TPAC 2024 W3C Advisory Committee Representatives participants of the Board of Directors, Advisory Board and Technical Architecture Group employees of a W3C member organization invited guests W3C Evangelists W3C staff or W3C Chapters staff Observer and guest attendance: Eligible participants may attend as an observer any group meetings that are open to observers. (See Chair contact information.) Community Group participants: Any participant of a CG scheduled to meet may attend other group meetings as an observer. Skip ⬇ Breakout sessions The breakout sessions are scheduled on Wednesday September 25. Registration and attendance are open to: participants in a W3C Working, Interest, Business or Community Group scheduled to meet during TPAC 2024 W3C Member Advisory Committee Representatives participants on the Board of Directors, Advisory Board and the Technical Architecture Group employees of a W3C member organization invited guests W3C Evangelists W3C staff or W3C Chapters staff We also offer a set of breakouts open to the broader public: We particularly welcome individuals from communities that are underrepresented in tech in general, and W3C discussions in particular. No prior experience with W3C is needed, all are welcome. Breakouts that are requested to be public will be open to anyone with a W3C account to join remotely, free of charge, without a TPAC registration. For more details on breakout sessions please see the schedule for Wednesday. Skip ⬇ W3C plenary The regular W3C Advisory Committee Meeting will be replaced this year by a plenary open to all TPAC2024 attendees.The plenary will cover W3C business and consortium updates. Skip ⬇ W3C@30 gala All participants already attending the above sessions are welcome to attend the W3C 30th anniversary celebration."
