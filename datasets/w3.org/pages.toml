["https://w3.org/staff/industry"]
title = "Industry | Staff | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = '''Industry Kazuyuki Ashimura Role: Team Contact for WoT and ME; Project Specialist; Smart Cities Industry Champion Project Professor, Graduate School of Media and Governance, Keio University Kaz joined the W3C Team at Keio University SFC in April 2005. Prior to joining the Team, Kaz worked for twelve years on research and development on speech and natural language processing. He is interested in Web technologies in general, esp. those related to Voice/Multimodal, Web&TV, WoT and Smart Cities. He would like to make people happy using the Web technologies. Kaz received his B.S. in Mathematics from Kyoto University and his Doctor of Engineering degree from Nara Institute of Science and Technology. ashimura@w3.org Kazuyuki's Github account François Daoust François takes part in on-going discussions and developments around the convergence between Web and media, serving both as Entertainment Champion in the Industry team and as Media Specialist in the Strategy team. François is also staff contact for the media-related Media Working Group, Second Screen Working Group and GPU for the Web Working Group. François initially joined W3C in November 2007 from Microsoft where he integrated an on-portal mobile search engine called MotionBridge. From 2007 to 2011, he served as staff contact for the Mobile Web Best Practices Working Group, the Web and TV Interest Group, the Web Real-Time Communications Working Group and was co-Activity Lead for the Web and TV Activity. He left W3C at the end of 2011 to develop cross-platform Web applications in a French start-up called Joshfire. François came back to W3C on May 2014. fd@w3.org François's Github account Dominique Hazaël-Massieux Role: W3C Community Management Lead, W3C Staff Contact & VR/AR Strategy Specialist Dominique is W3C Developer Relations Lead, W3C Community Development Lead (in charge of managing the Community Groups program), part of the W3C Project Management team, W3C Strategy Specialist on Virtual and Augmented Reality, and serves as staff contact in the Web Real-Time Communications Working Group, the Web and Machine Learning Web Working Group, and the Web & Networks Interest Group. He is the General Manager of ERCIM, the W3C Partner in Europe. He also develops tools and applications as needed in his various roles. He joined initially W3C’s Communication and Systems Team as a member of the Webmaster Team in October 2000; after having joined then led the QA Activity until September 2005, Dom took part in the Mobile Web Initiative as Staff Contact for the Best Practices Working Group and later as co-Chair of the Mobile Web Test Suites Working Group. Dom also served as Staff Contact for the Device and sensors Working Group Dominique holds an engineering degree from the “Grande Ecole” École Centrale Paris. More... dom@w3.org Dominique's Github account Philipp Hoschka Dr. Philipp Hoschka is General Manager of ERCIM and a Deputy Director of the W3C. He was founding W3C Industry Lead. He was responsible for W3C industry relationships; including having mutually reinforcing visions; working well in their ecosystems, and identifying new industry requirements for W3C Working Groups. His current work focuses on the "Web of Things", which is about leveraging open Web technology to overcome current silos in the "Internet of Things". In 2012, Philipp launched W3C efforts on automotive, focusing on the use of HTML5 for in-car infotainment apps. He also founded W3C's Ubiquitous Web Domain which had the mission to bring the benefits of Web technology to the emerging "Post-PC" world, including mobile and television devices. In the past, Philipp created W3C's Mobile Web Initiative and pioneered work on integrating audio and video into the Web leading to the W3C Standard SMIL. Philipp has been principal investigator in six EC research projects supporting the Ubiquitous Web Vision (MWeb, 3GWeb, MobiWeb2.0, OMWeb, MobiWebApp, HTML5Apps). Philipp holds a Ph.D. degree in Computer Science, and a Master's Degree in Computer Science from the University of Karlsruhe, Germany. He was visiting scholar at MIT LCS from 1998 until 2002. More... ph@w3.org Philipp's Github account Ian Jacobs Role: Payments Lead As of 1 Feb 2015, Ian leads W3C's Web Payments Activity. From September 2004 through January 2015, Ian was the Head of W3C Marketing and Communications. He managed the Consortium's Comm activities, including press, publications, branding, marketing, and aspects of Member relations. Ian began at W3C in 1997 and for 7 years co-edited a number of specifications, including HTML 4.0, CSS2, DOM Level 1, three WAI Guidelines (Web Content, User Agent, Authoring Tool), the TAG's Architecture of the World Wide Web, and the W3C Process Document. Ian received a degree in Engineering from Yale then a master's degree in software engineering from the CERICS in France. Ian then worked as a software engineer for five years, including at the INRIA. More... ij@w3.org Ian's Github account Dave Raggett Dave leads W3C's Data activity and champions the Web of Things and the role of AI/ML + computational statistics for the Sentient Web. He has been closely involved with the development of Web standards since 1992, contributing to work on HTML, HTTP, MathML, XForms, voice and multimodal interaction, ubiquitous web applications, financial data, privacy and identity. Dave has participated in many European research projects: Boost 4.0, Create-IoT, and F-Interop, and before that VRE4EIC, HTML5Apps, COMPOSE, webinos, Serenoa, and PrimeLife. In addition to work on standards, Dave is a keen programmer, and has developed experimental web browsers (e.g. Arena), a plugin for rendering math from natural language (EzMath), a tool for cleaning up HTML (Tidy), a web page library for HTML slide presentations (Slidy), a Firefox add-on for enhanced privacy (Privacy Dashboard), customizable browser-based editing of HTML and more recently, an open source implementation for the Web of Things (Arena Web Hub). He was educated in England and obtained his doctorate from the University of Oxford, and is a visiting professor at the University of the West of England. For more information see Dave's home page. More... dsr@w3.org Dave's Github account Ralph Swick Role: Chief Operating Officer Ralph joined W3C in January 1997, to focus on the Privacy and Demographics project. As that project (now called P3P) was starting, Ralph also started the Metadata project. The Resource Description Framework became a full-time responsibility when the Metadata Activity turned into the Semantic Web Activity. In 2007 Ralph became the leader of the Technology and Society Domain and in 2009 was appointed Acting Chief Operating Officer. As of 2010 the 'acting' qualifier was removed. Then in 2022 Ralph was appointed as Interim Chief Executive Officer of the new W3C, Inc. In November 2023 when W3C's permanent CEO joined, Ralph resumed his role as Chief Operating Officer. Ralph came to W3C from the X Consortium, where he was Technical Director for the X Window System. Ralph brings to W3C both a systems background and an application background. Long involved with the X Window System, Ralph was one of the architects of the Xt Intrinsics (user interface) toolkit. Prior to joining the X Consortium, Ralph was a software engineer for Digital Equipment Corporation in their Office Systems Advanced Development Group. There he worked on information filtering tools (software agents) and computer-supported cooperative work tools. Before that, Ralph was in Digital's Corporate Research Group working at MIT Project Athena. Ralph holds a BS in Physics and Mathematics from Carnegie-Mellon University. Ralph's interests are in applications of Web technologies to support human-human interaction, especially over time and distance. swick@w3.org Ralph's Github account'''
