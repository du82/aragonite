["https://www.w3.org/groups"]
title = "Discover W3C groups | W3C"
description = "A variety of W3C groups enable W3C to pursue its mission through the creation of Web standards, guidelines, and supporting materials. Community and Business Groups offer more ways for innovators to bring work to W3C."
full_description = "Discover W3C groups Read this page in: 中文（简体） 日本語 A variety of W3C groups enable W3C to pursue its mission through the creation of Web standards, guidelines, and supporting materials. Community and Business Groups offer more ways for innovators to bring work to W3C. Working Groups Working Groups typically produce deliverables (e.g., standards track technical reports, software, test suites, and reviews of the deliverables of other groups). Browse Working Groups Interest Groups The primary goal of an Interest Group is to bring together people who wish to evaluate potential Web technologies and policies. An Interest Group is a forum for the exchange of ideas. Browse Interest Groups Community and Business Groups W3C has created Community and Business Groups to meet the needs of a growing community of Web stakeholders. Community Groups enable anyone to socialize their ideas for the Web at W3C for possible future standardization. Business Groups provide companies anywhere in the world with access to the expertise and community needed to develop open Web technology. New W3C Working Groups can then build mature Web standards on top of best of the experimental work, and businesses and other organizations can make the most out of W3C's Open Web Platform in their domain of interest. Learn more about Community and Business Groups. Browse Community Groups Browse Business Groups Permanent Groups In addition to these groups, W3C operates thanks to the following groups: Advisory Committee (AC) The Advisory Committee represents the Members of W3C at large, which name one individual per Member responsible for managing the organization's rights and responsibilities set out in the W3C Process. This includes reviewing plans for W3C work, electing the Advisory Board and the Technical Architecture Group participants, as well as a portion of the W3C Board of Directors. AC Representatives nominate an unlimited amount of work group participants on behalf of their organizations. Lastly, AC Reps represent their organization in implementing the W3C Patent Policy. Get more information about the Advisory Committee Board of Directors The W3C Board of Directors —first seated in September 2022– is the governing body of the World Wide Web Consortium public-interest non-profit organization. The Directors have ultimate authority on W3C's strategic direction, have a legal obligation to ensure that W3C implements its mission to lead the Web to its full potential, and have fiduciary responsibility over W3C as a whole. Get more information about the Board of Directors Technical Architecture Group (TAG) W3C created the TAG to document and build consensus around principles of Web architecture and to interpret and clarify these principles when necessary. The TAG also helps to resolve issues involving general Web architecture brought to the TAG, and helps coordinate cross-technology architecture developments inside and outside W3C. Some TAG Participants are elected by the W3C Members, others are appointed by the W3C Director. Get more information about the Technical Architecture Group Advisory Board (AB) The Advisory Board provides ongoing guidance to the Team on issues of strategy, management, legal matters, process, and conflict resolution. The Advisory Board also serves the Members by tracking issues raised between Advisory Committee meetings, soliciting Member comments on such issues, and proposing actions to resolve these issues. The Advisory Board manages the evolution of the Process Document. AB Participants are elected by the W3C Members. Get more information about the Advisory Board"
