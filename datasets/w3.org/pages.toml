["https://w3.org/ecosystems/advertising"]
title = "Web Advertising | Business Ecosystems | W3C"
description = "The page introduces the concept of Advertising applied to the web, and what is done in that space at the Web Consortium."
full_description = "Web Advertising Read this page in: 中文（简体） Making online advertising more effective and privacy-preserving. Join the industry and community conversation to improve advertising on the web Web advertising is about making online advertising more effective and privacy-preserving, by identifying areas where standards and changes in the web itself can improve the ecosystem and experience for users, advertisers, publishers, distributors, ad networks, agencies, and others. Write to us to join W3C and start contributing to the work View the dashboard Active groups These groups are designed to improve advertising on the web. PrivacyWorking group The mission of the Privacy Working Group is to improve privacy on the Web both by advising groups developing standards on how to avoid and mitigate privacy issues with Web technologies and by standardizing mechanisms that improve user privacy on the Web. Visit the Privacy Working Group Private Advertising TechnologyWorking group The mission of the Private Advertising Technology Working Group, motivated by the W3C TAG Ethical Web Principles, is to specify web features and APIs that support advertising while acting in the interests of users, in particular providing strong privacy assurances using predominantly technical means. The Working Group welcomes participation from browser vendors, OS vendors, mobile application vendors, advertisers, publishers, ad buyers, advertising platforms and intermediaries, privacy advocates, web application developers, and other interested parties. Visit the Private Advertising Technology Working Group Improving Web AdvertisingBusiness group The mission of the Improving Web Advertising Business Group is to identify areas where standards and changes in the Web itself can improve the ecosystem and experience for users, advertisers, publishers, distributors, ad networks, agencies and others, and to oversee liaison with existing Working Groups and to create new Working Groups as needed Visit the Improving Web Advertising Business Group PrivacyCommunity group The mission of the Privacy Community Group is to develop privacy-focused web standards and APIs to improve user privacy on the web through enhanced browser behavior. Charter: https://privacycg.github.io/charter.html Visit the Privacy Community Group Private Advertising TechnologyCommunity group The mission of the Private Advertising Technology Community Group is to incubate web features and APIs that support advertising while acting in the interests of users, in particular providing strong privacy assurances. Visit the Private Advertising Technology Community Group Why join?Since 1994, we have been leading the World Wide Web to its full potential by developing protocols and guidelines that ensure long-term growth of the web.By joining these groups, you have the ability to discuss and drive the standards produced by W3C. The conversations occurring in the groups concern both current and future standards, constantly aiming to make the web a better place. You have the ability to take part in guiding the future of the web.Our values revolve around building the web for allThe social value of the web is that it enables human communication, commerce, and opportunities to share knowledge. One of W3C's primary goals is to make these benefits available to all people, whatever their hardware, software, network infrastructure, native language, culture, geographical location, or physical or mental ability. Recent activities in the Web Advertising community Find out more via recent stories, news, workshops, talks or events. W3C will be at NAB Show NY - will you? Blog Improving Web Advertising: W3C Business Group Launched Blog W3C Members 65 member organizations are involved in the web advertising ecosystem, including: Ministry of Digital Affairs, Taiwan Snap The News Corporation Cloudflare Huawei Duck Duck Go, Inc. View all members participating in the web advertising ecosystem Ways to get involved: Join Donate Need more information tailored to your organization? Our Evangelists understand that every organization is different! Evangelists represent W3C in various locations and are an extension of W3C's Business Development Team. They are responsible for identifying and recruiting new W3C Members, running local events, promoting W3C Training and fostering Sponsorship. Our Web Advertising evangelist Marty Voshell W3C Evangelist - Automotive Tel: +1.207.251.5841 Email: marty.voshell@w3.org Related RSS feed Subscribe to our Web Advertising feed"
