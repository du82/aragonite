["https://w3.org/staff/leadership"]
title = "Senior Leadership | Staff | W3C"
description = "The World Wide Web Consortium (W3C) is an international community where Member organizations, a full-time staff, and the public work together to develop Web standards."
full_description = "Senior Leadership W3C Senior Leadership Team Catrina Ahlbach Role: Chief of Staff, Manager of the Office of the CEO Catrina joined W3C in December 2024. A long time web developer and evangelist, she is now working on an Masters in Library and Information Studies. catrina@w3.org Catrina's Github account Sylvia Cadena Role: Chief Development Officer I joined the World Wide Web Consortium (W3C) as Chief Development Officer in September 2024 to focus on setting direction and expanding development portfolio across internationalization, accessibility, privacy and security for the Web, ensuring the longevity of the organization by defining a vision for financial security. I am a seasoned international development expert with 30 years’ experience across Latin America and the Asia Pacific. I have extensive experience in fundraising, design, management and reporting at local, national and regional level, leading purposeful collaborations that strategically use the Internet and the Web for social, economical, and cultural development. Before W3C, I worked at APNIC for 16 years. During my tenure, I worked to establish the Information Society Innovation Fund (ISIF Asia); the Seed Alliance and more recently the APNIC Foundation, where I worked to expand its grant making, allocating close to 11M USD to close to 200 initiatives across 32 economies. I also led the design and implementation of a number of training and professional development initiatives addressing gender diversity and social inclusion in APAC. Throughout my career I have served the Internet technical community on a variety of roles across a number of advisory bodies and selection committees related to Internet Governance, innovation, women in technology and professional development initiatives with a focus on the Internet industry, at a global and regional level. I have addressed many national, regional and international conferences. Read more in my LinkedIn profile. sylvia@w3.org Sylvia's Github account Seth Dobbs Role: W3C President & CEO Seth is W3C President & Chief Executive Officer (CEO) since November 2023. Seth reports to the W3C Board of Directors and takes responsibility for the fiscal integrity, financial stability and revenue generation of the World Wide Web Consortium (W3C). He leads the change management and integration efforts for W3C to create new offerings, seek broader financial support opportunities, and succeed as a public-interest not-for-profit with global partners. He oversees shaping and running W3C in line with its mission to lead the Web to its full potential. More... seth@w3.org Seth's Github account Christine Gefaell Role: Director of Legal & Compliance Christine joined the W3C Team in October 2024 as Director of Legal and Compliance to ensure W3C operates in full compliance with all applicable laws and regulations throughout the world, to advise on all legal matters, to guide the organization's policies, ultimately furthering our mission and goals. Prior to joining W3C, Christine worked as an associate general counsel in the ethics and compliance department at a global, biotech company focusing on areas such as antitrust, trade compliance, anti-bribery/anti-corruption, human rights, and risk management, generally. Previous to this corporate position, she worked in litigation as a defense, professional malpractice attorney. Christine is licensed in both New Jersey and Connecticut. See her LinkedIn profile for more information. christine@w3.org Christine's Github account Dominique Hazaël-Massieux Role: W3C Community Management Lead, W3C Staff Contact & VR/AR Strategy Specialist Dominique is W3C Developer Relations Lead, W3C Community Development Lead (in charge of managing the Community Groups program), part of the W3C Project Management team, W3C Strategy Specialist on Virtual and Augmented Reality, and serves as staff contact in the Web Real-Time Communications Working Group, the Web and Machine Learning Web Working Group, and the Web & Networks Interest Group. He is the General Manager of ERCIM, the W3C Partner in Europe. He also develops tools and applications as needed in his various roles. He joined initially W3C’s Communication and Systems Team as a member of the Webmaster Team in October 2000; after having joined then led the QA Activity until September 2005, Dom took part in the Mobile Web Initiative as Staff Contact for the Best Practices Working Group and later as co-Chair of the Mobile Web Test Suites Working Group. Dom also served as Staff Contact for the Device and sensors Working Group Dominique holds an engineering degree from the “Grande Ecole” École Centrale Paris. More... dom@w3.org Dominique's Github account Vivien Lacourba Role: Head of Systems Vivien joined W3C in May 2003 as the W3C Webmaster at the MIT/CSAIL host site in Cambridge, MA, USA. Since September 2004 Vivien is working as a Systems & Network Engineer for W3C Europe at the ERCIM host site in Sophia-Antipolis, France. Vivien graduated in September 2003 from the Polytech Nice Sophia engineering school (formerly known as ESSI) in Sophia-Antipolis, France. He holds an engineering degree in Computer Science, specializing in Networks. In June 2000, he received a two year degree in Computer Programming at the University of Lyon, France. More.... vivien@w3.org Vivien's Github account Philippe Le Hegaret Role: Strategy and Project Lead Philippe Le Hegaret is the Strategy and Project Lead for W3C, responsible for the technical mission of the Consortium. As Project Lead, he is responsible to meet all of the milestones of all of the groups, facilitate the work of Team Contacts, Chairs, and Editors, and drive the work necessary to achieve operational success. He is the current co-Chair of the W3C Process Community Group. Until 2016, he was for the former W3C Interaction Domain, which produced frontend Web technologies including HTML5, CSS3, SVG, WOFF, or Web APIs. Prior to 2009, Philippe lead the W3C Architecture Domain, which produced the W3C Core technologies in the area of XML, Web Services, and Internationalization. He is a former Chair of the Document Object Model (DOM) Working Group. Prior to joining W3C, Philippe promoted the use of XML inside Bull in 1998, also focusing on the interaction between XML and object structures. He wrote the first version of the CSS validator in 1997. Philippe holds a Master's Degree in Computer Science from the University of Nice (France). More... plh@w3.org Philippe's Github account An Qi (Angel) Li Angel Li joined W3C China Office in 2006. Since 2010, she had been devoted to setting up the fourth host of W3C in China together with W3C Team and Beihang University. In January 2013, as the Host of W3C in China was officially launched in Beihang University, Angel Li was assigned as the Site Manager of W3C/Beihang site and was responsible for managing W3C activities in China. Angel left W3C in June 2018 and took an adventure in the industry with Alibaba. In Nov 2021, Angel rejoined W3C as the Deputy Director of W3C China. She is currently based in Beijing, China. angel@w3.org An Qi (Angel)'s Github account Coralie Mercier Role: Head of W3C Marketing and Communications Coralie is Head of W3C Marketing & Communications. Since February 2015, she manages the Consortium's Comm activities, including messaging, press relations, W3C website, branding, marketing, internal communications as well as Public and Member communications. Previously and since 2005, Coralie was W3C Communications Team assistant. Since joining W3C in January 1999 with degrees in secretarial work and English as a foreign language, Coralie held a number of positions such as W3C Europe team assistant, W3C Europe administration manager (2001-2006). She was team contact for the W3C Advisory Board (2005-2017), helped with community outreach and developer relations. More... coralie@w3.org Coralie's Github account Ralph Swick Role: Chief Operating Officer Ralph joined W3C in January 1997, to focus on the Privacy and Demographics project. As that project (now called P3P) was starting, Ralph also started the Metadata project. The Resource Description Framework became a full-time responsibility when the Metadata Activity turned into the Semantic Web Activity. In 2007 Ralph became the leader of the Technology and Society Domain and in 2009 was appointed Acting Chief Operating Officer. As of 2010 the 'acting' qualifier was removed. Then in 2022 Ralph was appointed as Interim Chief Executive Officer of the new W3C, Inc. In November 2023 when W3C's permanent CEO joined, Ralph resumed his role as Chief Operating Officer. Ralph came to W3C from the X Consortium, where he was Technical Director for the X Window System. Ralph brings to W3C both a systems background and an application background. Long involved with the X Window System, Ralph was one of the architects of the Xt Intrinsics (user interface) toolkit. Prior to joining the X Consortium, Ralph was a software engineer for Digital Equipment Corporation in their Office Systems Advanced Development Group. There he worked on information filtering tools (software agents) and computer-supported cooperative work tools. Before that, Ralph was in Digital's Corporate Research Group working at MIT Project Athena. Ralph holds a BS in Physics and Mathematics from Carnegie-Mellon University. Ralph's interests are in applications of Web technologies to support human-human interaction, especially over time and distance. swick@w3.org Ralph's Github account Ken Troshinsky Role: Chief Financial Officer (CFO) Ken joined the W3C Team in February 2024 as Chief Financial Officer (CFO). ken@w3.org Ken's Github account Naomi Yoshizawa Role: W3C Member Relations Lead | W3C Japan Site Manager Naomi is the W3C Member Relations Lead to ensure member satisfaction, encourage participation in W3C groups and events. She is also appointed as the site manager of W3C Japan. Prior to joining W3C, Naomi worked at AT&T Japan as a manager of Marketing Communications for AT&T World Access. She worked on a team that created an innovative prepaid card, produced publications and bids for designs, and developed sales channels. She was awarded a Grand Prize for Best Operations Manager. She earned an MBA of International Management, from Aoyama Gakuin University, accredited by EFMD. naomi@w3.org Naomi's Github account"
