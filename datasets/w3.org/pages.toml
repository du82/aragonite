title = "W3C XHTML2 Working Group Home Page"
description = "This is W3C's home page for the XHTML2 Working Group."
full_description = "This was the W3C's home page for the XHTML2 Working Group, which was chartered in March 2007 (see news) until December 2010. For new information related to HTML and XHTML, please see the home page for the HTML Working Group. This Working Group is now closed. For further ongoing work related to XHTML, see the XHTML syntax section of the HTML5 specification. Skip to main content | news | specifications | public drafts | issues | test suites | tutorials | slides | guidelines | validation | articles | translations | charter | participants | join | roadmap | wiki | XForms | forums | HTML Tidy | related work | HTML 4.0/3.2/2.0 | historical | patent policy status The mission of the XHTML2 Working Group is to fulfill the promise of XML for applying XHTML to a wide variety of platforms with proper attention paid to internationalization, accessibility, device-independence, usability and document structuring. The group will provide an essential piece for supporting rich Web content that combines XHTML with other W3C work on areas such as math, scalable vector graphics, synchronized multimedia, and forms, in cooperation with other Working Groups. 2009-07-02: XHTML 2 Working Group Expected to Stop Work End of 2009, W3C to Increase Resources on HTML 5. Today the Director announces that when the XHTML 2 Working Group charter expires as scheduled at the end of 2009, the charter will not be renewed. By doing so, and by increasing resources in the HTML Working Group, W3C hopes to accelerate the progress of HTML 5 and clarify W3C's position regarding the future of HTML. 2009-01-28: XHTML Media Types - Second Edition published. Many people want to use XHTML to author their Web pages, but are confused about the best ways to deliver those pages in such a way that they will be processed correctly by various user agents. This Note contains suggestions about how to format XHTML to ensure it is maximally portable, and how to deliver XHTML to various user agents - even those that do not yet support XHTML natively. This document is intended to be used by document authors who want to use XHTML today, but want to be confident that their XHTML content is going to work in the greatest number of environments. News item."
