["https://www.w3.org/TR/2025/NOTE-css-2024-20250225"]
title = "CSS Snapshot 2024"
full_description = "1. Introduction When the first CSS specification was published, all of CSS was contained in one document that defined CSS Level 1. CSS Level 2 was defined also by a single, multi-chapter document. However for CSS beyond Level 2, the CSS Working Group chose to adopt a modular approach, where each module defines a part of CSS, rather than to define a single monolithic specification. This breaks the specification into more manageable chunks and allows more immediate, incremental improvement to CSS. Since different CSS modules are at different levels of stability, the CSS Working Group has chosen to publish this profile to define the current scope and state of Cascading Style Sheets as of 2024. 1.1. What is CSS? Cascading Style Sheets (CSS) CSS is a language for writing style sheets, and is designed to describe the rendering of structured documents (such as HTML and XML) on a variety of media. CSS is used to describe the presentation of a source document, and usually does not change the underlying semantics expressed by its document language. Style sheet A set of rules that specify the presentation of a document. Style sheets are written by an Author, and interpreted by a User Agent, to present the document to the User. Source document The document to which one or more style sheets apply. A source document’s structure and semantics are encoded using a document language (e.g., HTML, XHTML, or SVG). Author An author is a person who writes documents and associated style sheets. An authoring tool is a User Agent that generates style sheets. User A user is a person who interacts with a user agent to view, hear, or otherwise use the document. User Agent (UA) A user agent is any program that interprets a document and its associated style sheets on behalf of a user. A user agent may display a document, read it aloud, cause it to be printed, convert it to another format, etc. For the purposes of the CSS specifications, a User Agent is one that supports and interprets Cascading Style Sheets as defined in these specifications. 1.2. Background: The W3C Process and CSS This section is non-normative. In the W3C Process, a Recommendation-track document passes through three levels of stability, summarized below: Working Draft (WD) This is the design phase of a W3C spec. The WG iterates the spec in response to internal and external feedback. The first official Working Draft is designated the “First Public Working Draft” (FPWD). In the CSSWG, publishing FPWD indicates that the Working Group as a whole has agreed to work on the module, roughly as scoped out and proposed in the editor’s draft. The transition to the next stage is sometimes called “Last Call Working Draft” (LCWD) phase. The CSSWG transitions Working Drafts once we have resolved all known issues, and can make no further progress without feedback from building tests and implementations. This “Last Call for Comments” sets a deadline for reporting any outstanding issues, and requires the WG to specially track and address incoming feedback. The comment-tracking document is the Disposition of Comments (DoC). It is submitted along with an updated draft for the Director’s approval, to demonstrate wide review and acceptance. Candidate Recommendation (CR) This is the testing phase of a W3C spec. Notably, this phase is about using tests and implementations to test the specification: it is not about testing the implementations. This process often reveals more problems with the spec, and so a Candidate Recommendation will morph over time in response to implementation and testing feedback, though usually less so than during the design phase (WD). Demonstration of two correct, independent implementations of each feature is required to exit CR, so in this phase the WG builds a test suite and generates implementation reports. The transition to the next stage is “Proposed Recommendation” (PR). During this phase the W3C Advisory Committee must approve the transition to REC. Recommendation (REC) This is the completed state of a W3C spec and represents a maintenance phase. At this point the WG only maintains an errata document and occasionally publishes an updated edition that incorporates the errata back into the spec. An Editor’s Draft is effectively a live copy of the editors’ own working copy. It may or may not reflect Working Group consensus, and can at times be in a self-inconsistent state. (Because the publishing process at W3C is time-consuming and onerous, the Editor’s Draft is usually the best (most up-to-date) reference for a spec. Efforts are currently underway to reduce the friction of publishing, so that official drafts will be regularly up-to-date and Editor’s Drafts can return to their original function as scratch space.) 2. Classification of CSS Specifications A list of all CSS modules, stable and in-progress, and their statuses can be found at the CSS Current Work page. 2.1. Cascading Style Sheets (CSS) — The Official Definition This profile includes only specifications that we consider stable and for which we have enough implementation experience that we are sure of that stability. Note: This is not intended to be a CSS Desktop Browser Profile: inclusion in this profile is based on feature stability only and not on expected use or Web browser adoption. This profile defines CSS in its most complete form. As of 2024, Cascading Style Sheets (CSS) is defined by the following specifications. CSS Level 2, latest revision (including errata) [CSS2] This defines the core of CSS, parts of which are overridden by later specifications. We recommend in particular reading Chapter 2, which introduces some of the basic concepts of CSS and its design principles. CSS Syntax Level 3 [CSS-SYNTAX-3] Replaces CSS2§4.1, CSS2§4.2, CSS2§4.4, and CSS2§G, redefining how CSS is parsed. CSS Style Attributes [CSS-STYLE-ATTR] Defines how CSS declarations can be embedded in markup attributes. Media Queries Level 3 [CSS3-MEDIAQUERIES] Replaces CSS2§7.3 and expands on the syntax for media-specific styles. CSS Conditional Rules Level 3 [CSS-CONDITIONAL-3] Extends and supersedes CSS2§7.2, updating the definition of @media rules to allow nesting and introducing the @supports rule for feature-support queries. Selectors Level 3 [SELECTORS-3] Replaces CSS2§5 and CSS2§6.4.3, defining an extended range of selectors. CSS Namespaces [CSS3-NAMESPACE] Introduces an @namespace rule to allow namespace-prefixed selectors. CSS Cascading and Inheritance Level 4 [CSS-CASCADE-4] Extends and supersedes CSS2§1.4.3 and CSS2§6, as well as [CSS-CASCADE-3]. Describes how to collate style rules and assign values to all properties on all elements. By way of cascading and inheritance, values are propagated for all properties on all elements. CSS Values and Units Level 3 [CSS-VALUES-3] Extends and supersedes CSS2§1.4.2.1, CSS2§4.3, and CSS2§A.2.1–3, defining CSS’s property definition syntax and expanding its set of units. CSS Custom Properties for Cascading Variables Module Level 1 [CSS-VARIABLES-1] Introduces cascading variables as a new primitive value type that is accepted by all CSS properties, and custom properties for defining them. CSS Box Model Level 3 [CSS-BOX-3] Replaces CSS2§8.1, §8.2, §8.3 (but not §8.3.1), and §8.4. CSS Color Level 4 [CSS-COLOR-4] Extends and supersedes CSS2§4.3.6, CSS2§14.1, and CSS2§18.2, also extends and supersedes [CSS-COLOR-3], introducing an extended range of color spaces beyond sRGB, extended color values, and CSS Object Model extensions for color. Also defines the opacity property. CSS Backgrounds and Borders Level 3 [CSS-BACKGROUNDS-3] Extends and supersedes CSS2§8.5 and CSS2§14.2, providing more control of backgrounds and borders, including layered background images, image borders, and drop shadows. CSS Images Level 3 [CSS-IMAGES-3] Redefines and incorporates the external 2D image value type, introduces native 2D gradients, and adds additional controls for replaced element sizing and rendering. CSS Fonts Level 3 [CSS-FONTS-3] Extends and supersedes CSS2§15 and provides more control over font choice and feature selection. CSS Writing Modes Level 3 [CSS-WRITING-MODES-3] Defines CSS support for various international writing modes, such as left-to-right (e.g. Latin or Indic), right-to-left (e.g. Hebrew or Arabic), bidirectional (e.g. mixed Latin and Arabic) and vertical (e.g. Asian scripts). Replaces and extends CSS2§8.6 and §9.10. CSS Multi-column Layout Level 1 [CSS-MULTICOL-1] Introduces multi-column flows to CSS layout. CSS Flexible Box Module Level 1 [CSS-FLEXBOX-1] Introduces a flexible linear layout model for CSS. CSS Basic User Interface Module Level 3 [CSS-UI-3] Extends and supersedes CSS2§18.1 and CSS2§18.4, defining cursor, outline, and several new CSS features that also enhance the user interface. CSS Containment Module Level 1 [CSS-CONTAIN-1] Introduces the contain property, which enforces the independent CSS processing of an element’s subtree in order to enable heavy optimizations by user agents when used well. CSS Transforms Level 1 [CSS-TRANSFORMS-1] Introduces coordinate-based graphical transformations to CSS. CSS Compositing and Blending Level 1 [COMPOSITING] Defines the compositing and blending of overlaid content and introduces features to control their modes. CSS Easing Functions Level 1 [CSS-EASING-1]. Describes a way for authors to define a transformation that controls the rate of change of some value. Applied to animations, such transformations can be used to produce animations that mimic physical phenomena such as momentum or to cause the animation to move in discrete steps producing robot-like movement. CSS Counter Styles Level 3 [CSS-COUNTER-STYLES-3] Introduces the @counter-style rule, which allows authors to define their own custom counter styles for use with CSS list-marker and generated-content counters [CSS-LISTS-3]. It also predefines a set of common counter styles, including the ones present in CSS2 and CSS2.1. Note: Although we don’t anticipate significant changes to the specifications that form this snapshot, their inclusion does not mean they are frozen. The Working Group will continue to address problems as they are found in these specs. Implementers should monitor www-style and/or the CSS Working Group Blog for any resulting changes, corrections, or clarifications. 2.2. Reliable Candidate Recommendations The following specifications are considered to be in a reliable state, meaning they have largely stable implementations and specifications, but are not yet at the Recommendation level due to minor issues or the need for additional implementation reports. Media Queries Level 4 [MEDIAQUERIES-4] Extends and supersedes [CSS3-MEDIAQUERIES], expanding the syntax, deprecating most media types, and introducing new media features. CSS Scroll Snap Module Level 1 [CSS-SCROLL-SNAP-1] Contains features to control panning and scrolling behavior with “snap positions”. CSS Scrollbars Styling Module Level 1 [CSS-SCROLLBARS-1] Defines properties to influence the visual styling of scrollbars, introducing controls for their color and width. CSS Grid Layout Module Level 1 [CSS-GRID-1] Introduces a two-dimensional grid-based layout system, optimized for user interface design. In the grid layout model, the children of a grid container can be positioned into arbitrary slots in a predefined flexible or fixed-size layout grid. CSS Grid Layout Module Level 2 [CSS-GRID-2] Extends and supersedes [CSS-GRID-1], introducing “subgrids” for managing nested markup in a shared grid framework. 2.3. Fairly Stable Modules with limited implementation experience The following modules have completed design work, and are fairly stable, but have not received much testing and implementation experience yet. We hope to incorporate them into the official definition of CSS in a future snapshot. Media Queries Level 4 [MEDIAQUERIES-4] Extends and supersedes [CSS3-MEDIAQUERIES], expanding the syntax, deprecating most media types, and introducing new media features. CSS Display Module Level 3 [CSS-DISPLAY-3] Replaces CSS2§9.1.2, §9.2.1 (but not §9.2.1.1), §9.2.2 (but not §9.2.2.1), §9.2.3, and §9.2.4 (and lays the foundations for replacing §9.7), defining how the CSS formatting box tree is generated from the document element tree and defining the display property that controls it. CSS Writing Modes Level 4 [CSS-WRITING-MODES-4] Extends and supersedes [CSS-WRITING-MODES-3], adding more options for vertical writing. CSS Fragmentation Module Level 3 [CSS-BREAK-3] Describes the fragmentation model that partitions a flow into pages, columns, or regions and defines properties that control it. Extends and supersedes CSS2§13.3. CSS Box Alignment Module Level 3 [CSS-ALIGN-3] Introduces properties to control the alignment of boxes within their containers in the various CSS box layout models: block layout, table layout, flex layout, and grid layout. CSS Shapes Module Level 1 [CSS-SHAPES-1] Extends floats (CSS2§9.5) to effect non-rectangular wrapping shapes. CSS Text Module Level 3 [CSS-TEXT-3] Extends and supersedes CSS2§16 excepting §16.3, defining properties for text manipulation and specifying their processing model. It covers line breaking, justification and alignment, white space handling, and text transformation. CSS Text Decoration Module Level 3 [CSS-TEXT-DECOR-3] Extends and supersedes CSS2§16.3, providing more control over text decoration lines and adding the ability to specify text emphasis marks and text shadows. CSS Masking Module Level 1 [CSS-MASKING-1] Replaces CSS2§11.1.2 and introduces more powerful ways of clipping and masking content. CSS Scroll Snap Module Level 1 [CSS-SCROLL-SNAP-1] Contains features to control panning and scrolling behavior with “snap positions”. CSS Speech Module Level 1 [CSS-SPEECH-1] Replaces CSS2§A, overhauling the (non-normative) speech rendering chapter. CSS View Transitions Module Level 1 [CSS-VIEW-TRANSITIONS-1] Defines the View Transition API, along with associated properties and pseudo-elements, which allows developers to create animated visual transitions representing changes in the document state. 2.4. Modules with Rough Interoperability Although the following modules have been widely deployed with rough interoperability, their details are not fully worked out or sufficiently well-specified and they need more testing and bugfixing. We hope to incorporate them into the official definition of CSS in a future snapshot. CSS Transitions Level 1 [CSS-TRANSITIONS-1] and CSS Animations Level 1 [CSS-ANIMATIONS-1]. Introduces mechanisms for transitioning the computed values of CSS properties over time. CSS Will Change Level 1 [CSS-WILL-CHANGE-1] Introduces a performance hint property called will-change. Filter Effects Module Level 1 [FILTER-EFFECTS-1] Introduces filter effects as a way of processing an element’s rendering before it is displayed in the document. CSS Font Loading Module Level 3 [CSS-FONT-LOADING-3] Introduces events and interfaces used for dynamically loading font res"
