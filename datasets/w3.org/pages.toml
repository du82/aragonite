["https://www.w3.org/mission"]
title = "Our mission | W3C"
description = "Learn who W3C is, our values and the principles upon which we conduct our mission to led the Web to its full potential."
full_description = '''Our mission Read this page in: 中文（简体） 日本語 Making the web work, for everyone. W3C brings together global stakeholders to develop open standards that enable a World Wide Web that connects and empowers humanity. Our visionTo achieve our vision to make the web work, for everyone, we uphold the following core values:The web is for all humanity.The web is designed for the good of its users.The web must be safe for its users.There is one interoperable world-wide web.W3C Statement (Draft): W3C Vision Our identityWe are an open forum where diverse voices from around the world and industries come together, incubate and build consensus for global standards for web technologies.We are socially responsible and committed to ensure that the web is for everyone; we greatly emphasize accessibility, internationalization, privacy, and security.We are committed to developing open and royalty-free standards with high focus on interoperability and collective empowerment. W3C Founding Director Sir Tim Berners-Lee, Web Inventor, answers the question "What part of the World Wide Web Consortium's work are you most proud of?" in this video from the World Wide Web Foundation at the occasion of #WEB30 Our design principlesThe Web Consortium follows these essential design principles.Web for allThe social value of the web is that it enables human communication, commerce, and opportunities to share knowledge. One of W3C's primary goals is to make these benefits available to all people, strive for diversity and inclusion of participants from different geographical locations, cultures, languages, disabilities, gender identities, and more. Learn more about:Accessibility InternationalizationWeb of trustThe web has transformed the way we communicate with each other. In doing so, it has also modified the nature of our social relationships. People now meet on the web and carry out commercial and personal relationships, in some cases without ever meeting in person. W3C recognizes that trust is a social phenomenon, but technology design can foster trust and confidence. As more activity moves online, it will become even more important to support complex interactions among parties around the globe. Learn more about:Security PrivacyWeb on everythingThe number of different kinds of devices that can access the web has grown immensely. Mobile phones, smart phones, interactive television systems, voice response systems, kiosks and even certain domestic appliances can all access the web. Learn about how the web transforms many business ecosystems, how the Web Consortium meets particular industry needs, and how everyone benefits:Business ecosystems Our strategic goalsEnsure efforts on accessibility and internationalization continue to achieve the goal of a web for everyone.Ensure that the evolving web platform and Web technologies improve in integrity, security and privacy. We must revisit the current web platform and explore how we can responsibly improve personal privacy for users.Evolve the extensible web architecture to empower industries and individuals to address the evolving user’s needs.Improve efforts on new technology incubation, making it more structured and improving consensus-building among key stake holders.Achieve worldwide participation, diversity and inclusion, establishing W3C as representative of the worldwide community.Further improve the environment for facilitating balance, equity and cooperation among the participants from different industries, user groups and organizational sizes.Increase involvement of under-represented key stakeholders such as end users, content creators, developers etc.Establish and improve collaborative relationships with other organizations in the domain of Internet and web standards.'''
year_published = 2025
