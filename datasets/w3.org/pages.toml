["https://w3.org/staff/alumni"]
title = "Alumni | Staff | W3C"
description = "This page lists all the former W3C staff."
full_description = '''Alumni We are thankful to all the great individuals who joined the W3C staff over the years to work with our Members and the community to shape the Web. Shadi Abou-Zahra March 2003 to September 2021 Shadi Abou-Zahra worked with the W3C Web Accessibility Initiative (WAI) as the Accessibility Strategy and Technology Specialist. He coordinated accessibility priorities in the W3C Strategy team, as well as international promotion, coordination, and harmonization of web accessibility standards. Shadi also maintained WAI liaisons with key stakeholders including disability, research, and standards organizations, as well as coordinated WAI outreach in Europe, accessibility evaluation techniques, and European-funded projects on accessibility. Prior to joining W3C in 2003, Shadi was a lead web developer and managed the design and implementation of web productions, online community platforms, and online games. Shadi also worked as a Web Consultant for the International Data Centre (IDC) of the United Nations Comprehensive Nuclear-Test-Ban Treaty Organization (CTBTO), as well as for other international organizations. During his computer science studies, Shadi actively participated in the Austrian student council at the Technical University of Vienna as a representative for students with disabilities, where he advocated for equal opportunities in education and employment. Jean-François Abramatic January 1996 to June 2021 Jean-François was Chairman of the World Wide Web Consortium from 1996 to 2001. Formerly Associate Director of the MIT Laboratory for Computer Science (1997-1998) and Director of Development and Industrial Relations at INRIA (1992- 1999), he was responsible for establishing the European branch of W3C in partnership with MIT LCS in 1995. He was the General Chairman of the Fifth International World Wide Web Conference which was held in Paris in May 1996. Jean-François was asked by the French government to prepare a report entitled "Développement Technique de l'Internet". The report was published in June 1999. His areas of expertise include networking, image processing and graphics. Jean-François received his Master's degree from Ecole des Mines in Nancy and his PhD from the University of Paris VI. Jean-François rejoined the W3C staff as a Fellow from INRIA in 2014 to 2021 to work in the International Relations team. Michelle Adamic February 2008 to December 2014 Michelle was a member of the MIT Business Development team. Pamela Ahern September 1996 to December 1997 Pamela joined W3C at MIT as Senior Office Assistant at MIT to assist Susan Hardy with W3C office administration. José-Manuel Alonso January 2007 to September 2009 José came to W3C as a W3C Fellow in January 2007 working in the Technology and Society Domain. José is employed by Fundación CTIC who sponsor his W3C fellowship. The purpose of the fellowship is to understand specific government and citizens' needs related to eGovernment services, identify eGovernment aspects that put Web interoperability at risk, to suggest how governments can deliver better and more efficient services through computer technologies, and to coordinate discussions and actions for possible future efforts of the Consortium in eGovernment. Prior to joining W3C, José was the manager of the W3C Spain Office for three years and also served as the Advisory Committee Representative for CTIC. José received Bachelor's degree in Computer Science and Masters degree in Enterprise Application Integration, both from the University of Oviedo, where he also worked at its Research and Innovation departments as a researcher, developer and teacher. He also worked previously as consultant and even founded his own Web company back in 1997. William Ang July 1996 to May 2013 William as a member of the MIT system team. Andrew Arch November 2007 to September 2010 Andrew joined W3C in November 2007 as the Web Accessibility and Ageing Specialist to work on the European Commission funded WAI-AGE project. The objectives of this project were to increase the accessibility of the Web for those with accessibility needs related to ageing within European Union Member States and around the world. This project coordinates closely with the WAI Education and Outreach working group. Prior to joining W3C, Andrew worked at Vision Australia for seven years leading a team that provided consulting, reviewing and training services around Web accessibility. He was heavily involved with W3C WAI during this time. Phil Archer February 2009 to July 2017 In the final year at W3C, Phil Archer's primary role was as a Data Specialist on the Strategy Team — working to make ever more effective use of the Web as a platform for data. His farewell blog post provides a summary. He originally joined the team to work on the Mobile Web Initiative in February 2009, specifically to work on developing and delivering training in this area. Before joining the team he'd been a participant in the Mobile Web Best Practices working group (joining at its inception in June 2005) and was an editor of, or acknowledged contributor to, 6 of its documents. Separately, Phil also had a long involvement with the Semantic Web activity, notably as chair of the POWDER working group. As part of this role he co-edited most of the documents and created one of the two reference implementations. It was this work that lead Phil to focus on the area of Linked Data and, via work on eGovernment and open data, to become Data Activity Lead before that role evolved into being part of the strategy team. In addition to his work on the strategy team, Phil was staff contact for several working groups: Data on the Web Best Practices, Spatial Data on the Web, Permissions & Obligations Expression and Dataset Exchange. Phil Archer maintains an active online presence through his personal Web site. Takuya Asada October 1997 to October 2000 Takyua completed his Master's degree in image processing and color representation from the Information & Computer Science department at Chiba University. He has worked as a programmer and system administrator for over two years before joining W3C at Keio-SFC in October 1997. Katsutoshi Asaki September 2007 to September 2008 Katsu was a W3C Fellow from Hitachi from September 2007 to September 2008. Katsu received a study grant from Hitachi to join the Team at MIT to work on infrastructure tools for enterprise deployment of Semantic Web technologies. Katsu is a software engineer working on Hitachi's enterprise information systems. Jérémie Astori June 2013 to May 2015 Jérémie joined the W3C System Team in June 2013. He worked at the MIT/CSAIL host in Cambridge as the Webmaster and left in May 2015. Jérémie developped Echidna, an automated publication system for W3C specifications. Maria Auday May 2012 to September 2017 Maria was assistant to Dr. Jeffrey Jaffe, CEO. She was part of the administrative team and organized some of the annual W3C meetings that are lead by Jeff. Anselm Baird-Smith October 1995 to August 1997 Anselm worked at W3C from October 1995 through August 1997 to design and implement Jigsaw, W3C's award-winning object oriented Java-based server software. His interests include communication protocols, distributed objects and scripting languages. Anselm received his Ph.D. in Computer Science from Universite de Jussieu, Paris VI. Caroline Baron December 2001 to July 2023 Caroline joined W3C through INRIA located in Sophia Antipolis in December 2001.Caroline was the W3C Europe administrative and financial manager in charge of accounting, finances and human resources while ERCIM was the W3C Host.As of January 2024 she is ERCIM Deputy General Manager.She holds a BA in Foreign Languages and a Master's Degree in Business Administration from Sophia Antipolis' University. Art Barstow May 2000 to November 2001 Art had been a W3C Team member since May, 2000 (part of that time was as Visiting Fellow). Prior to this current position, he worked on a WAP simulation toolkit and a WAP browser at Nokia . He also has worked at the X Consortium and at Hewlett-Packard. Art was a member of the Technology and Society Domain's Semantic Web Activity and a member of the RDF Core Working Group . He was also a member of the Semantic Web Advanced Development group. Guillaume Baudusseau July 2014 to September 2016 Guillaume joined the W3C Team in the Summer of 2014 as an intern to work on new Mobile Checkers. He continued into the Fall of that year as a member of the W3C Systems Team with a focus on W3C Validators, coding and community building. In the Fall of 2015, while he graduated as a computer science engineer with ISEN Toulon, Guillaume held a position as part of a block-release training within the Communications Team and the Systems Team to continue work on W3C validators and Mobile checker, work on Developer meetups and outreach, and in-house Web design. Robin Berjon July 2012 to July 2015 Robin Berjon has long worked as part of the Web standards community, before joining W3C in 2012 where he edited the HTML specification and worked on tooling. He has notably contributed to the binary XML groups, SVG, WebApps, DAP, Core Mobile Web Platform, and several other efforts. He has since moved on to work at the intersection of the Web, science, and publishing. He likes to hack on things, mostly using JavaScript, and has a long history of contributing to the open source community. He lives in Paris with wife, daughters, and cat. You can follow @robinberjon on Twitter. Alexandre Bertails July 2009 to July 2014 Alexandre joined the W3C in July 2009 as part of the Systems Team. He worked on the W3C Validators and was involved in Linked Data activities. Janet Bertot January 1997 to January 2005 Janet joined the W3C-Sophia team in January 1997, to work part-time with Luc Ottavj and Stephane Boyera on system administration. J. Alan Bird January 2011 to August 2023 Alan Bird was the Global Business Development Lead for W3C. In this role, Mr. Bird led W3C staff efforts internationally to strengthen the W3C Membership program, identify business development strategies, and seek new revenue streams to support the organization.Before joining W3C, Alan was a key executive in two small information security companies where he drove strategic business development. Prior to these appointments, he spent several years each with IBM, Compuware, Legent, and Cullinet in a wide variety of roles, many of which involved creating new business opportunities. Earlier in his career, he worked in the IT organization of Burlington Industries, AVX Ceramics, Family Dollar Stores, and Ingersoll-Rand. This combination of work experiences has provided Alan with a solid foundation from which to drive W3C’s business development activities. Klaus Birkenbihl January 2006 to January 2011 Klaus, based in Germany, graduated as mathematician at the University of Bonn in 1974. He joined the German research institute in computer science (GMD) where he worked since then in several areas. After a few years of research on software technology he was appointed head of GMD's computer center Bonn in 1980. He gave lectures on computer science at the University of Cologne and the University of Applied Sciences Bonn-Rhein-Sieg. He acted as head of the network engineering group and the competence center "Computer Networks and Society" in GMD and later in Fraunhofer Institute for Media Communication. Klaus has a strong computer networks background. Among other roles he was founding member of the European Academic Research Network (EARN) and deputy director of EARN Germany, member of the operational committee of the German Research Network (DFN), member of the EASInet steering committee and chairman of the German Chapter of the Internet Society. Before joining the W3C team Klaus worked for W3C as head of the German/Austrian Office, AB member, and AC rep of GMD/Fraunhofer. After leaving Fraunhofer launched his own company ict Media GmbH from where he works for W3C. As team member - on a part time basis - Klaus worked as Coordinator of W3C World Offices. Irina Bolychevsky July 2015 to December 2016 Maker. Thinker. Product person. Redecentralize.org & CoffeeHouse Club founder. Previously Open Knowledge Commercial Director & ckan.org lead. I love technology, ideas and figuring out how things can be better. @shevski on twitter & shevski.com on the web. David Booth February 2002 to April 2005 David was a W3C Fellow from Hewlett-Packard from 6-Feb-2002 through 15-Apr-2005. His main interests were Web Services and the Semantic Web. He was alternate W3C Team Contact for the Web Services Description Working Group and the Web Services Architecture Working Group, and edited the Web Services Description Language (WSDL) 2.0 Primer and the Web Services Architecture. At HP, he is a Senior Research Architect. Previously, he was Director of Training for Bluestone Software (until Bluestone was acquired by HP), and led Bluestone's use of Web technologies for training purposes. He also served on the W3C's Advisory Committee as Bluestone's representative. Before working at Bluestone, he was a research scientist for ATT Bell labs. David has been programming for many years on a variety of operating systems, currently preferring Java or Perl. David holds a Ph.D. in Computer Science from UCLA, where he specialized in programming language design. Renoir Boulanger August 2013 to July 2015 Renoir Boulanger is an application developer fascinated by technologies of the web. He has been building websites and web applications for over ten years. His experience also includes server management and he worked for several communications agencies in the province of Quebec, Canada. Renoir's involvement to the W3C is as a member of developer relations mainly contributing on the WebPlatform project to improve features, strengthen the hosting and deployment infrastructure, and act as a technical liaison with Open-source communities. In addition to having an easily identifiable name on the web, he can be found as @renoirb or at renoirboulanger.com Stéphane Boyera June 1995 to January 2015 Stéphane was W3C Staff from June 1995 till february 2015. From January 2014 to February 2015, Stephane led the Web Payments activity. Before, he was leading the W3C Device Independence Working Group and he was a key participant in the development and launch of the W3C Mobile Web Initiative, managing the Device Description Working Group till the end of 2005. At the same time, Stéphane took also part in the management of the Voice and Multimodal Activities. From 2006 till 2009, he was leading the W3C work on the Mobile Web for Social Development Interest Group. From January 2009 till June 2013, after participating in the Web Foundation Task Force during 2008, Stéphane joined the newly launched World Wide Web Foundation as lead program manager. Stéphane is still working in the area of ICT for development and the role of Web and mobile in social and economic development of developing c'''
