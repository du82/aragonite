full_description = 'Blog - 2025 The W3C blog is for in-depth Web standards topics and educational materials. More information in About W3C Blog. Search posts Show results Browse categories Browse categories All Accessibility Corporate Data Developers Events Immersive Web Internationalization Privacy and Security Sustainability Systems Testing Tools Training Tutorials Web Architecture Workshop Browse archives Browse archives All 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 2008 2007 2006 2005 This is page 1, displaying results 1-2 International standards and World Economic Forum (WEF) Corporate Published: 24 February 2025 By: Seth Dobbs, W3C CEO and President In this blog post, W3C CEO Seth Dobbs shares impressions from representing W3C for the first time at the World Economic Forum, and illustrates how our distinctive human-centric focus in the world of Standards Development Organizations positions W3C to be helping to shape the future of the web. ceo Davos Collaborating across W3C and Ecma for web-interoperable server runtimes through WinterTC Published: 10 January 2025 By: Luca Casonato (Deno, WinterCG co-chair, Ecma TC55 co-chair), Mike Smith (W3C staff, liaison to Ecma) and Daniel Ehrenberg (Bloomberg, Ecma President) The W3C Web Interoperable Runtimes Community Group ("WinterCG") and Ecma International (the organization which standardizes ECMAScript, also known as JavaScript) have collaborated to create a new Ecma Technical Committee,TC55 – Web-interoperable server runtimes, dubbed "WinterTC", for the development of a common web-aligned API surface for server-side JavaScript runtimes like Node.js, Deno and Cloudflare Workers. Community Group Related RSS feed Subscribe to our blog feed'
