["https://w3.org/ecosystems/data"]
title = "Data | Business Ecosystems | W3C"
description = "The page introduces Data applied to the web, and what is done for data and knowledge at the Web Consortium."
full_description = "Data Read this page in: 中文（简体） Imagining solutions to industry needs for Linked Open Data and digital transformation. Linked Open Data is a key part of the digital transformation which positively impacts society. Data and digital transformation are increasingly important to society, especially with the rise of IoT and Big Data. Opportunities around Artificial Intelligence (AI) and Machine Learning, as well as the need for greater flexibility and agility for adapting to change are challenges for Data and knowledge on the Web, and various W3C work groups imagine the solutions to industry problems. Write to us to join W3C and start contributing to the work Learn about data-related W3C work Our community is focusing onSimplifying semantic interoperability across different kinds of information systemsRole of Linked Data in relation to trust and privacy for digital dataspaces and associated marketplacesSupporting vocabulary development for operating on imperfect knowledgeRDF-star, N3 rule language, Human-like AI, Linked Building Data, and more Active groups These groups imagine and specify the solutions to industry needs for Linked Open Data and digital transformation. Data ShapesWorking group The mission of the Data Shapes Working Group is to update data shapes standards in line with the versions of core Semantic Web standards that cater for RDF-star and to extend the applications of data shapes with new packaging and use specifications. Visit the Data Shapes Working Group Dataset ExchangeWorking group The mission of the Dataset Exchange WG is to: 1. Maintain and revise the Data Catalog Vocabulary, DCAT, taking into account feature requests from the DCAT user community. 2. Define and publish guidance on the specification and use of application profiles when requesting and serving data on the Web. Visit the Dataset Exchange Working Group Decentralized IdentifierWorking group The mission of the Decentralized Identifier Working Group is two-fold. First, it will maintain the Decentralized Identifiers (DIDs) specification and related Working Group Notes. Second, it will seek consensus around the best way to achieve effective interoperability through common requirements, algorithms, architectural options, and various considerations for the DID resolution and DID URL dereferencing processes. Minutes of past meetings Past resolutions Information about the previous DID Working Group is still available on its old homepage. Visit the Decentralized Identifier Working Group JSON-LDWorking group The mission of the JSON-LD Working Group is to maintain the family of JSON-LD 1.1 Recommendations and related Working Group Notes. Visit the JSON-LD Working Group Linked Web StorageWorking group The mission of the Linked Web Storage Working Group is to enable the development of web applications where data storage, entity authentication, access control, and application provider are all loosely coupled, as opposed to the web of today where these are typically all tightly coupled and changing one requires changing all, sometimes at the price of all past data. This will be achieved by identifying a set of relevant use-cases, and standardizing a protocol between applications, on the one hand, and identity and storage servers, on the other hand. Visit the Linked Web Storage Working Group RDF Dataset Canonicalization and HashWorking group The mission of the RDF Dataset Canonicalization and Hash Working Group is to define a standard to uniquely and deterministically calculate a hash of RDF Datasets for use cases such as Detecting changes in Datasets. The work will include defining RDF Dataset Canonicalization algorithms. Visit the RDF Dataset Canonicalization and Hash Working Group RDF-starWorking group The mission of the RDF-star Working Group is to extend a set of RDF and SPARQL related recommendations, with the ability to concisely represent and query statements about statements. Visit the RDF-star Working Group Spatio-temporal Data on the WebWorking group The mission of the Spatio-temporal Data on the Web Working Group is to: 1) develop and maintain vocabularies and best practices that encourage better sharing of spatial data on the Web; 2) identify areas where standards should be developed jointly by both W3C and the Open Geospatial Consortium (OGC). Visit the Spatio-temporal Data on the Web Working Group Verifiable CredentialsWorking group The mission of the Verifiable Credentials Working Group is to maintain the Verifiable Credentials Data Model specification and related Working Group Notes. Visit the Verifiable Credentials Working Group Web Machine LearningWorking group The mission of the Web Machine Learning Working Group is to develop APIs for enabling efficient machine learning inference in the browser. Visit the Web Machine Learning Working Group Why join?Since 1994, we have been leading the World Wide Web to its full potential by developing protocols and guidelines that ensure long-term growth of the web.By joining these groups, you have the ability to discuss and drive the standards produced by W3C. The conversations occurring in the groups concern both current and future standards, constantly aiming to make the web a better place. You have the ability to take part in guiding the future of the web.Our values revolve around building the web for allThe social value of the web is that it enables human communication, commerce, and opportunities to share knowledge. One of W3C's primary goals is to make these benefits available to all people, whatever their hardware, software, network infrastructure, native language, culture, geographical location, or physical or mental ability. W3C Members 118 member organizations are involved in the data ecosystem, including: Apache Software Foundation HM Government Consensys Siemens AG Lenovo INSIGHT - The Centre for Data Analytics View all members participating in the data ecosystem Ways to get involved: Join Donate Related RSS feed Subscribe to our Data feed"
