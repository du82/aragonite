full_description = "Member Relations The W3C Member Relations function ensures excellent relationships with and participation from our Members. Responsibilities include: Support global Members. Ensure that we are overcoming barriers of time zone, culture, and language; Listen and learn about Members' business priorities and concerns; Research, develop and implement measures to support member expectations on the administrative part; Share W3C information to members; Encourage participation in W3C groups; Build relationships; Retain existing W3C members; Ensure Member satisfaction and retain existing Members. Marie-Claire Forgue Role: Head of W3C Training Marie-Claire Forgue serves as Head of W3C Training. She developed the W3Cx MOOC program, in partnership with edX, where Web developers worldwide can learn front-end Web development techniques using W3C Web standards. Previously, she crafted W3DevCampus, a learning platform hosting small private courses. Additionally, Marie-Claire is a member of the W3C Developer relations team, organizing meetups and participating in online and in-person communities via forums, social media (@w3cdevs), etc. She is also involved in the dissemination activities of several projects funded by the European Commission. She joined W3C in 2001 and served as Head of W3C European Communications for over 10 years. Marie-Claire received a Ph.D. degree (computer graphics and parallel processing) in Computer Science from the University of Côte d'Azur and INRIA, France. After a year as a postdoctoral fellow at the Dynamic Graphics Project Lab at the University of Toronto, Canada, she worked at NTT's Human Interface Lab, Japan, for two years. Her research interests were focused on illumination algorithms and scene modeling. After that, she studied filmmaking in Vancouver, Canada. She has directed several short films and documentaries, and got interested in interactive multimedia back in 1993. mcf@w3.org Marie-Claire's Github account Alexandra Lacourba Role: W3C Global Events & Operations Coordinator Alexandra joined W3C in September 2002. She is the global Events and Operations coordinator, in charge of events, staff travel. She also leads Membership Administration including AC representative liaison, billing and other administration Alexandra holds a bachelor in Event Project Management from Lille University and a Master in Management from EDHEC Business School. More... alex@w3.org Alexandra's Github account Zhenjie Li Zhenjie joined W3C in May 2017 as the Administration staff and meeting planner at the Beihang host site in China ,she hold a bachelor degree in law when she graduated from Shandong university in 2010, then got an opportunity to do interdisciplinary studies of law and economics at three European universities---Bologna university, Hamburg university and Vienna university, after this one-year programme she received her master degree in Law and Economics in February 2017. zhenjie@w3.org Zhenjie's Github account Tzviya Siegman Role: Sustainability Lead Tzviya joined W3C in September 2024 as Sustainability Lead and is responsible for North American Member Relations. Prior to joining the Team, Tzviya worked as Standards Principal at Wiley. She became a group participant in 2013 in many of the Publishing groups at W3C, where she led, coordinated, and contributed to several initiatives to develop common standards and best practices. Tzviya also joined the Positive Work Environment group, which she now chairs, and helped rewrite W3C’s Code of Conduct. Tzviya was elected to the W3C Advisory Board for 3 consecutive terms between 2018 and 2024. She was elected Chair of that group during all of her terms. Tzviya enjoys working on sustainability because it is an essential area for W3C to explore, ensuring that our impact on the physical world is positive and prioritizes the planet and people. Tzviya received a BA in English Literature from Yeshiva University, speaks Hebrew, and is interested in her kids and pottery and reading in her spare time. tzviya@w3.org Tzviya's Github account Naomi Yoshizawa Role: W3C Member Relations Lead | W3C Japan Site Manager Naomi is the W3C Member Relations Lead to ensure member satisfaction, encourage participation in W3C groups and events. She is also appointed as the site manager of W3C Japan. Prior to joining W3C, Naomi worked at AT&T Japan as a manager of Marketing Communications for AT&T World Access. She worked on a team that created an innovative prepaid card, produced publications and bids for designs, and developed sales channels. She was awarded a Grand Prize for Best Operations Manager. She earned an MBA of International Management, from Aoyama Gakuin University, accredited by EFMD. naomi@w3.org Naomi's Github account"
