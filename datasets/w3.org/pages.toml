full_description = "Skip ⬇ W3C Plenary The regular W3C Advisory Committee Meeting will be replaced this year by a plenary open to all TPAC2024 attendees. The plenary will cover W3C business and consortium updates. W3C meetings operate under our Code of Conduct. Skip ⬇ Wednesday 25 September recording Location: California ballroom C, Ballroom level, Second Floor See the timezones below for the time in other regions. Time (Anaheim) Agenda topics 17:00 - 18:00 Seth Dobbs, W3C CEO [slides] W3C Technical Agenda: key current and future work per TAG and Team Corporate updates: finances, team updates, other operational updates Board of Directors: welcoming the new board W3C calendar Join IRC* Join Zoom IRC channels Professional real-time captioning will be available in English: Press the ‘CC’ (Closed Caption) button at the bottom of the Zoom window. Skip ⬇ Speaking guidelines A separate page contains hints, both for presenters and for participants, whether on site or connected via video link. Skip ⬇ Timezones 5 p.m. in Anaheim on the 25th of September 2024 corresponds to: Honolulu Tahiti 2:00 pm Anchorage 4:00 pm Vancouver Los Angeles 5:00 pm Edmonton Denver Mexico City El Salvador 6:00 pm Chicago Panama Bogota Lima 7:00 pm Toronto New York Havana La Paz 8:00 pm Halifax São Paulo Buenos Aires Montevideo 9:00 pm Dakar Abidjan 12:00 am (+1) London Casablanca Tunis Kinshasa 1:00 am (+1) Paris Tripoli Johannesburg 2:00 am (+1) Helsinki Kyiv Jerusalem Moscow Istanbul Kuwait Nairobi 3:00 am (+1) Yerevan 4:00 am (+1) Kolkata 5:30 am (+1) Omsk 6:00 am (+1) Novosibirsk Bangkok Phnom Penh Jakarta 7:00 am (+1) Beijing Taipei Manila Singapore Perth 8:00 am (+1) Seoul Tokyo 9:00 am (+1) Darwin 9:30 am (+1) Vladivostok Brisbane Sydney 10:00 am (+1) Auckland 12:00 pm (+1)"
