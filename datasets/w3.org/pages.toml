["https://w3.org/ja/get-involved"]
title = "参加する | W3C"
description = "このページでは、ウェブの標準化を進めるために、個人や組織がWorld Wide Web Consortiumに参加する方法について説明します。"
full_description = "参加する 言語切り替え： 中文（简体） English ウェブの標準化を進めるために、個人や組織がウェブコンソーシアムに参加する方法はたくさんあります。 W3Cメンバーでなくても参加可能 個人のための会員クラスはありませんが、仕様書のレビュー、ディスカッション、翻訳などを通じて、個人の参加を歓迎します。 公開審査 仕様の公開レビューは、関連性と品質を確保するために非常に重要です。仕様書や憲章のレビューを通じて、W3Cの活動の質を向上させることができます。パブリックフィードバック コミュニティグループ W3C Community GroupsとBusiness Groupsは誰でも参加できます。ウェブに情熱を持つ人なら誰でも、ディスカッションを行ったり、アイデアをインキュベートして発表したり、時には新しい仕事をW3Cの標準化に持ち込んだりすることができます。これらのグループは、コミュニティによって提案され、運営されています。W3C コミュニティグループ イベント トーク、ワークショップ、ミートアップ、後援カンファレンス、...ウェブコミュニティのメンバーによる W3C の作業に関するプレゼンテーション、作業のための新しいアイデアを議論するための W3C ワークショップ、開発者ミートアップ、または私たちが支持するカンファレンス。イベントを見る 学ぶ メーリングリスト、ブログ、ニュース、トレーニング、チュートリアル、ツール、ビデオ、翻訳、...W3Cは、作業、教育、アウトリーチのために多くのオンラインツールを使用しています。一般の方は、キュレーションされたリソースやオンライントレーニングから学んだり、ディスカッションリスト、ブログ、翻訳、その他の手段を通じてW3Cに参加することができます。リソースを見る W3Cメンバーとして参加 W3Cのプロセス、特にパテントポリシーは、組織としての参加を前提に設計されているため、組織としてのコンソーシアムへの参加が最も理にかなっています。 作業グループ ワーキンググループ、インタレストグループ、コミュニティグループ、ビジネスグループなど、 ...W3Cは、Web標準、ガイドライン、サポート資料の作成を通じて、その使命を追求しています。コミュニティグループとビジネスグループは、誰でも参加でき、アイデアを議論し、インキュベートし、W3Cに新しい仕事をもたらす方法を提供します。W3Cグループの詳細 イベント 講演、ワークショップ、会員会議、開発者ミートアップ、承認されたカンファレンス、...ウェブコミュニティのメンバーによる W3C の作業に関するプレゼンテーション、作業の新しいアイデアを議論するための W3C ワークショップ、会議（ワーキンググループ、W3C TPAC など）、開発者ミートアップ、または私たちが推奨する会議。イベントを見る 学びと貢献 メーリングリスト、ブログ、ニュース、トレーニング、チュートリアル、ツール、ビデオ、翻訳、...W3Cは、作業、教育、アウトリーチのために多くのオンラインツールを使用しています。一般の方は、キュレーションされたリソースやオンライントレーニングから学んだり、ディスカッションリスト、ブログ、翻訳、その他の手段を通じてW3Cに参加することができます。リソースを見る ビジネス・エコシステム ウェブコンソーシアムは、コアテクノロジー、産業界のニーズ、そして社会的ニーズの結節点で活動しています。現在、特にWebの影響を受けているビジネスエコシステムには、自動車・運輸、Eコマース、メディア・エンターテイメント、ネットワーク・通信、出版、スマートシティ、Web広告、Web of Thingsなどがあります。W3Cエコシステムの焦点"
year_published = 2025
