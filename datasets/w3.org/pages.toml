["https://w3.org/2024/09/TPAC/Overview.html"]
title = "TPAC 2024: Overview"
full_description = "Skip ⬇ On this page: Registration Schedule VenueSponsors Get help W3C TPAC 2024 TPAC 2024 is now over. Thank you to our attendees! Please, give your feedback on TPAC 2024 in the online survey! (until the 31st of October 2024) TPAC, our major event of the year, gathers our community for thought-provoking discussions and coordinated work to advance the invaluable work of our Groups. During the exciting week, W3C Working and Interest Groups gather and network to resolve challenging technical and social issues that the Web faces. TPAC brings together W3C technical groups, the Board of Directors, the Advisory Board, the Technical Architecture Group and the Advisory Committee. Read more about TPAC. Share your experience: @w3c@w3c.social #w3cTPAC Chat with participants: #tpac-chat on irc.w3.org #tpac on w3ccommunity.slack.com The meeting is hybrid with the main in-person hub in Anaheim CA, USA. W3C meetings operate under our Code of Conduct. Press at TPAC: TPAC is a working meeting of W3C Members and groups. While most meeting records will be made publicly available online after the meeting, many participants prefer that their work-in-progress not be reported on verbatim; further, some organizations prohibit their employees from speaking to the press about in-progress work, and we don't want to inhibit their participation so this event is not open to the press. Skip ⬇ Registration Registration is now closed. It will open again onsite, on 23 September. Before you register to attend a meeting at TPAC as a remote or in-person attendee, please read the participation rules, the registration details and fees, as well as event health rules for in-person participation. Registration closed ⬇ Schedule Schedule at a glance: Monday Tuesday Wednesday Thursday Friday 09:00​–18:00 Group meetings 09:00​–18:00 Group meetings 08:30​–16:45 Breakout sessions (including public AC and governance matters) 17:00​–18:00 W3C plenary 18:10​–22:00 W3C @ 30 09:00​–18:00 Group meetings 09:00​–18:00 Group meetings (Times are local times in Anaheim, UTC-7.) Skip ⬇ Venue TPAC 2024 takes place in Anaheim, a city in the Greater Los Angeles area in southern California, at the Hilton Anaheim: Hilton Anaheim 777 W. Convention Way Anaheim, California, 92802, USA +1-714-750-4321 Event health rules Hotel & transport"
