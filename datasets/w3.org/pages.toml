["https://w3.org/2016/08/2016-reorg"]
title = "2016 W3C Internal Reorganization"
full_description = "Effective since 26 September 2016. This document, publicly available, was announced to W3C Memebers and group Chairs in August 2016. It supersedes the Team-only Reorganization document. W3C’s Domain structure served it and the Web well for most of our first two decades. In the earlier days of the Web, when the platform was relatively simple, technologies fell neatly into different domains. More recently, however, as the platform’s uses and ecosystem have grown and changed, the Domain model has struggled to meet the full potential of the Web. We tried to make up for Domain-based management’s shortcomings by surrounding the Domains with a number of other management systems focused on cross-domain, industry, and member communications. Buttressed with these additional mechanisms, the Domain-based structure survived, but its foundational flaws need to be repaired. So we will now move to a different, functional, approach to the management of W3C that better accords with the nature of today’s Web and the expectations of its diverse users, developers, and implementers. To lead the Web to its full potential today requires a flexible team organized to interact with a complex ecosystem of technologies, stakeholders, and industries. It requires well-researched strategy development, rigorous project management, and careful architectural coordination. Above all, it requires us to refocus on our strengths building technical and social consensus on an open interoperable platform with global reach. If we step up to this challenge, we can lead the Web into the 21st century. If we fail to adapt, we risk irrelevance for ourselves and fragmentation of the Web platform. This document enumerates some of the shortcomings in W3C’s current system, outlines the new functional management structure to address these flaws, and then goes into greater detail on the new functions, team organization, and anticipated workflows. To address these flaws this document describes a new structure where leadership roles are more clearly assigned to address the issues."
