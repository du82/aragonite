["https://w3.org/standards/about"]
title = "About W3C web standards | Web Standards | W3C"
description = "This page explains more about W3C web standards, including the value of creating open web standards at the World Wide Web Consortium."
full_description = '''About W3C web standards Read this page in: 中文（简体） 日本語 Page contents What are Web standards?W3C documents and future web standardsReferring to W3C specificationsW3C persistence policyComments on W3C specificationsRe-using a Standard or part thereof for a book (or other purpose) Web standards are the building blocks of the web. They are the blue prints of how to implement browsers, blogs, graphic editors, search engines, and many more software that power our experience on the web. They enable developers to build rich interactive experiences that can be available on any device. What are Web standards?W3C Recommendations are standards.W3C publishes documents that define Web technologies. These documents follow a process designed to promote consensus, fairness, public accountability, and quality. At the end of this process, W3C publishes Recommendations, which are considered Web standards. W3C documents and future web standardsW3C publishes several types of documents that are not standards.Discover the types of documents W3C publishesInput to the W3C standards process may come from a variety of places, including:Conversations with W3C Members, including Member submissionsW3C WorkshopsLiaisons with other standards bodiesTracking the activity in hundreds of public W3C Community GroupsThe Strategy incubation pipeline documents the exploration of potential new work in phases of Incubation and Evaluation, and eventually in the chartering stages of new standards groups.Public input is welcome at any stage but particularly once Incubation has begun. This helps W3C identify work that is sufficiently incubated to warrant standardization, to review the ecosystem around the work and indicate interest in participating in its standardization, and then to draft a charter that reflects an appropriate scope. Ongoing feedback can speed up the overall standardization process. Referring to W3C specificationsEach W3C Technical Report has several URIs associated with it, located at the beginning of the document:A "this version" URI, which identifies the specific document. A "latest published version" URI, which identifies the most recently published draft in a document series.An "Editor's Draft" URI, which may or may not have review from the Working Group.If you mean to refer to a specific version of a document, please use the "this version" URI. If you need to refer to "the most up-to-date version", please use the "latest published version" URI. If you need to refer to the version of the document which the group is currently iterating on, please use the "Editor's Draft" URI. For more information, see Version Management in W3C Technical Reports. W3C persistence policyAccording to W3C persistence policy, W3C will make every effort to make a given document indefinitely available, in its original form, at its "this version" URI.W3C may correct broken markup and broken links in place (per the in-place modification policy) but otherwise will make every effort not to change content after publication of a document. Comments on W3C specificationsEach W3C Technical Report includes a "Status of this document" section near the front. In this section, you will find information about where to send comments. Re-using a Standard or part thereof for a book (or other purpose)See the W3C Document license for answers to questions about copyright.'''
