full_description = '''Contact Read this page in: 中文（简体） 日本語 Find how and who to contact at the World Wide Web Consortium, based on various common needs. Business address for W3C, Inc.World Wide Web Consortium, Inc. 401 Edgewater Place, Suite 600 Wakefield, MA 01880 USAPhone: +1.339.273.2711Membership questionsIf your organization is not a W3C Member, please visit our "why join" page. You may send questions to membership@w3.org.If your organization is a W3C Member, please refer to the Member Web site for assistance. Direct questions about wire payments for W3C Membership to invoicing@w3.orgW3C MembersSee the list of W3C Members.Interview requestsPlease see contact information for the Press and how to request an interview. You may send questions for our Communications team to w3t-pr@w3.org.International liaison questionsPlease see information about liaisons. You may send questions to team-liaisons@w3.org.Technology questionsIf you have a question about a specification or technology, please have a look at specification reviews and public feedback. You may also wish to contact a W3C group or someone on the W3C staff with a technical question. There are also a number of discussion lists.Speak to someoneUse the list of W3C staff if wish to speak to someone with local expertise.Give feedback on our websiteIf you have feedback on the W3C website, please submit each comment as GitHub issues. (If you are not able to use GitHub, please email public-website-redesign@w3.org, a publicly archived mailing list.)If you found "w3.org" in the source of a page and are looking for the ownerOften people look in the source code of a web page for clues about who owns or created the page. Many pages on the web include mention of W3C; see our FAQ for an explanation. However, W3C did not create these pages unless they are on w3.org. Furthermore, W3C cannot help you find who owns or created these pages.If you encounter a technical problem using the W3C siteIf you have technical problems with our site, please write to sysreq@w3.org with a precise description.If you don't know where to startIf, after reviewing the above, you are uncertain where to direct your question, please write to contact@w3.org and we will direct you.Regional W3C contactsW3C Chapters.'''
