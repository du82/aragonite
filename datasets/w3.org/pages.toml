["https://w3.org/2024/09/TPAC/breakouts.html"]
title = "TPAC 2024: Breakouts schedule"
full_description = "Breaking Silos: A Collaborative Discussion on Use Cases for Linked Web Storage Proposer Pierre-Antoine Champin, Aaron Coburn, Laurens Debackere, Eric Prud'hommeaux Description The mission of the newly created Linked Web Storage Working Group is to enable the development of web applications where data storage, entity authentication, access control, and application providers are all loosely coupled, as opposed to the web of today where these are typically all tightly coupled and changing one requires changing all, sometimes at the price of all past data. A number of initiatives — such as IndieWeb, Unhosted, and Solid — have emerged to propose alternative models for web applications. They are largely based on existing open web standards, which they extend to give priority to individual and group autonomy. The goal of the breakout session is to bring together current and potential participants of the Linked Web Storage Working Group, as well as members of other communities with shared interests (such as the ones cited above) to seed a set of use-cases that the working group can later adopt to guide its work. Live minutes will be taken in https://docs.google.com/document/d/1sFZ0BozoLA3U7iROtu10tR7S05_OEOprS8Um9NZqZYw/edit Goals Gather use cases and experiences from a wide range of people to initiate the work of the Linked Web Storage WG. Links W3C Calendar minutes minutes (initial google doc) Session proposal on GitHub Room 4 Concourse Level - Redondo, 08:30​–​09:30 Browser API for Country Data Tracks UX Proposer Christian Indra, Westin Wrzesinski Description Millions of websites rely on country and address formatting data that needs to be unnecessarily downloaded on everyone of those websites. For example on a regular Shopify onlinestore this leads to 193kB uncompressed or 17.7kB compressed data being downloaded on every store. To allow developers build simpler and more performant websites we want to discuss our proposal for a browser API for country data. Goals Discuss proposal, get feedback, and discuss next steps Links W3C Calendar minutes Session proposal on GitHub Room 4 Concourse Level - San Clemente, 08:30​–​09:30"
