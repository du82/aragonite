["https://w3.org/Jigsaw"]
title = "Jigsaw Overview"
full_description = '''Jigsaw is W3C's leading-edge Web server platform, providing a sample HTTP 1.1 implementation and a variety of other features on top of an advanced architecture implemented in Java. The W3C Jigsaw Activity statement explains the motivation and future plans in more detail. Jigsaw is an W3C Open Source Project, started May 1996. See the license for details. It also contains a reworked HTTP client stack and SSL code updates, an improved Digest Authentication implementation, and WebDAV interoperability improvements. Along with some stability fixes for servers with a long uptime and huge traffic. Winie is a network utility to put files on the web using HTTP/1.1. The main feature of Winie is to solve the "lost update problem" by storing ETags. Winie use the client side api of Jigsaw. "WebDAV stands for "Web-based Distributed Authoring and Versioning". It is a set of extensions to the HTTP protocol which allows users to collaboratively edit and manage files on remote web servers." (webdav.org) This is a WebDAV implementation based on Jigsaw 2.1.2, it has been tested with cadaver, DAVExplorer and WebFolders. Go to webdav.org for a more complete list of DAV client. This package is preconfigured as a WebDAV server. � Jigsaw 2.0, as developed by the World Wide Web Consortium (W3C), is designed to be a technology demonstration rather than a full-fledged release. It's purposely intended as a project to showcase new technologies, but in the case of Jigsaw 2.0, this Web server also ends up being more robust than the average Web server. Most importantly, though, Jigsaw serves as a useful blueprint to the future of the HTTP protocol and object-oriented Web servers. � There is also an experimental printable documentation, available in pdf or postscript. The Jigsaw distribution is available in two formats both through the FTP and HTTP protocols (you may want to check the Jigsaw mirror sites for public versions only): Copyright © 1996-2003 W3C® (MIT, ERCIM, Keio), All Rights Reserved. W3C liability, trademark, document use and software licensing rules apply. Your interactions with this site are in accordance with our public and Member privacy statements.'''
