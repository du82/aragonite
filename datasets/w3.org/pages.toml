["https://w3.org/QA/Activity"]
title = "Quality Assurance Activity Statement"
full_description = "The W3C Quality Assurance Activity has completed its work, part of which was to engage in a closer dialog with those who are making the Web a reality, the Web community. Its achievements included helping W3C groups learn the value of test suites in specification development. The Activity has evolved into the Q&A Weblog, and spawned new projects. In 2000, W3C began discussions on how to improve the quality of its specifications and the challenges associated with doing so. It became clear from these discussions that the culture of W3C groups would have to evolve in the direction of more support for specifications in the form of test materials, use cases, and other tools to improve quality. In particular, one of the challenges faced by the QA Activity was to be able to make a convincing case that investing up front (in test cases, for example) pays off in terms of successful interoperability and deployment. One conclusion by observation is that groups have agreed that the investment in test cases, for example, is well worth it. A successful Workshop, hosted by NIST, in January 2001 led to the creation of the Quality Assurance Activity and two groups: the Quality Assurance Working Group and the Quality Assurance Interest Group. The Quality Assurance Working Group published its work in August 2005. W3C Working Groups are now using a framework to achieve quality in the form of these technical reports: The remainder of this Activity Statement puts these resources in context and explains the suite of resources created as part of the QA Activity to foster a culture of quality inside W3C. To give a general orientation to the whole of the QA Framework, the QA Working Group created a Primer & User Scenarios. The guide helps group Chairs understand the goals of the QA Technical Reports and how to reach them when starting up a Working Group. The QA Handbook complements the guide by providing more in-depth guidance for planning, committing and staffing. Technical specifications are W3C's main product. Though there are many ways to design a technology, the QA Activity was able to work with diverse groups to understand their needs and to articulate common themes to help address frequently asked questions. The QA Specification Guidelines that resulted from these discussions is a step by step guide for writing specifications. The guidelines explain how to construct a specification in a way that promotes deployment, including issues of writing testable assertions, and how document organization helps usability. Each guideline is accompanied by techniques to help speed up the development. Variability in Specifications addresses some topics such as complexity and conformance variability in more detail."
year_published = 2025
clearnet = "https://w3.org/QA/Activity"
