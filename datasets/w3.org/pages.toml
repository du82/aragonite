["https://w3.org/2005/MWI/Tests"]
title = "W3C Mobile Web Test Suites Working Group"
full_description = "The Mobile Web Test Suites Working Group is now closed. The group operated from early 2007 until February 2010. The mission of the MWI Test Suites Working Group was to help create a strong foundation for the mobile Web through the development of a set of test suites targeted at browsers. These test suites can help assess which technologies and which features of a given technologies are supported in existing browsers on mobile devices. January 28, 2010: Publication as a Working Group Note of A Method for Writing Testable Conformance Requirements We have integrated some of the test suites above in our Mobile Test Harness: you can help improve the knowledge about your browser by going through these test suites in this tool! The running of this working group is supported by the European Union's 7th Research Framework Programme (FP7) through the MobiWeb 2.0 Project, and its set up was funded through the 3GWeb European Project."
