["https://www.w3.org/2004/11/i18n-recharter/geo-charter"]
title = "Internationalization Guidelines, Education & Outreach (GEO) Working Group Charter"
full_description = "This Working Group follows the rules and requirements of the latest operative version of the World Wide Web Consortium Process Document. In the event of a conflict between this document and the W3C Process Document, the W3C Process Document shall take precedence. The mission of the Internationalization Guidelines, Education & Outreach Working Group (GEO WG) is to help to make the internationalization aspects of W3C technology better understood and more widely and consistently used. The W3C Internationalization Activity was created in October 1995. In February 1998, the Internationalization (I18N) WG was created, and has been rechartered regularly. In 2002 the WG divided its work across three task forces, one of which was the GEO task force. This charter proposes that the GEO task force become a separate Working Group. The GEO WG will continue to work closely with the Internationalization Core Working Group (I18N Core WG) and the Internationalization Tag Set Working Group (ITS WG). The World Wide Web is by its name and by its actual extent world-wide. Enabling people from all parts of the world to make full use of Web technologies requires support for their languages, writing systems and cultures. The W3C is firmly committed to making sure that its specifications and other outputs are adequately internationalized. Overall W3C work has moved on at a high pace, and is expected to continue to do so, but internationalization is a continuing concern for W3C, as part of the W3C goal of Universal Access. The GEO WG will try to ensure that specification writers, web masters, content authors, and others involved in developing and implementing the Web understand the issues involved and the techniques available with regard to supporting international use of Web technology. Scope will center on use of W3C technologies, but may also include more general Web internationalization and localization topics. The GEO WG will also provide assistance to other WGs in the Internationalization Activity for publication of educational and outreach materials."
year_published = 2025
clearnet = "https://www.w3.org/2004/11/i18n-recharter/geo-charter"
