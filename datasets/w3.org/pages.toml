["https://www.w3.org/2024/09/TPAC/registration.html"]
title = "TPAC 2024: Registration"
full_description = "Purpose of the Inclusion fund The TPAC Inclusion fund aims to help remove barriers for people from a group that is under-represented in the web community, who are unable to attend TPAC without financial help, and who want to attend or contribute to TPAC in a meaningful way. Contributing in a meaningful way may include: Running a breakout session Writing documentation or tests Preparing documents such as explainers or drafts for discussion Reviewing a group’s work and preparing comments for discussion Examples of what the Inclusion fund might help cover: Technology to enable participation or to participate more effectively online, conferencing equipment such as microphone, headset, camera Co-working space if you don’t have room at your office or home Bandwidth - portion of monthly charge for number of days an individual attends meetings Travel to TPAC (minding advance reservation to secure economical fares) Accommodation costs (minding the hotel room black deadline) Inclusion fund applications Timeline: 10 July 2024: Applications(*) opening 31 July 2024: Applications closing 9 August 2024: Applicants and awardee(s) informed (*) Following our privacy policy, we do not disclose your data to any third party and the data we collect is used only for the purpose of the Inclusion Fund selection."
