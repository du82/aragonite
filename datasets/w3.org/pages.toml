["https://www.w3.org/WAI/fundamentals"]
title = "Accessibility Fundamentals Overview | Web Accessibility Initiative (WAI) | W3C"
description = "Accessibility resources free online from the international standards organization: W3C Web Accessibility Initiative (WAI)."
full_description = "Accessibility Fundamentals Overview The following resources provide information for getting started with accessibility: Introduction to Web Accessibility Introduces web accessibility and links to additional resources. Includes accessibility in context; why accessibility is important for individuals, businesses, society; making digital technology accessible; evaluating accessibility; and basic examples. Video Introduction to Web Accessibility and W3C Standards 4-minutes Accessibility: It’s About People Explains the people aspect of accessibility. Links to: Web Accessibility Perspectives: Explore the Impact and Benefits for Everyone - videos that illustrate Accessibility: essential for some, useful for all. Ten 1-minute videos, and a 7-minute compilation. How People with Disabilities Use the Web - introduces stories of web users; diverse abilities and barriers; tools and techniques; and videos that illustrate Accessibility: It’s about people. Older Users and Web Accessibility resources Accessibility, Usability, and Inclusion Essential Components of Web Accessibility Shows how web accessibility depends on several components of web development and interaction working together and shows the relationship between the WAI guidelines and other standards. Accessibility Principles A concise introduction to accessibility requirements for websites, apps, browsers, and other tools. It is organized similar to the WAI accessibility standards and provides a useful bridge to the standards. Read this page before reading the standards/guidelines. Research: Accessibility User Requirements - Documentation of research on user needs in virtual or immersive environments (XR), real-time communication (RTC), natural language interfaces, multimedia, low vision, cognitive accessibility, and more. Artificial Intelligence (AI) and Accessibility Research Symposium 2023 - Summaries, transcripts, and videos of the international symposium exploring the positive and negative impacts of artificial intelligence (AI) in digital accessibility. Digital Accessibility Courses: Digital Accessibility Foundations — Free Online Course - Introduces a self-paced course from W3C WAI for developers, designers, ux, writers, managers, advocates. Designed for technical and non-technical learners, including students, instructors, professionals, and people with disabilities. Course is free with optional certificate. Course List of Digital Accessibility Education, Training, and Certification - Lists courses from different providers. Related page: Get resources for… links to resources for designers, developers, testers, managers, and more. Help improve this page Please share your ideas, suggestions, or comments via e-mail to the publicly-archived list wai@w3.org or via GitHub. E-mailFork & Edit on GitHubNew GitHub Issue Back to Top"
