title = "Board of Directors | Discover W3C groups | W3C"
description = '''
<p>The W3C Board of Directors —first <a href="/blog/news/archives/9685">seated in September 2022</a>— is the governing body of the World Wide Web Consortium public-interest non-profit organization. The Directors have ultimate authority on W3C's strategic direction, have a legal obligation to ensure that W3C implements its mission to lead the Web to its full potential, and have fiduciary responsibility over W3C as a whole.</p>

<p>Directors are:</p>
<ul>
 <li>Dominique Hazaël-Massieux (<a title="Partner-selected Director" href="#partner-selected">P</a>)</li>
 <li>Chunming Hu (<a title="Partner-selected Director" href="#partner-selected">P</a>)</li>
 <li>Koichi Moriyama (<a title="Member-elected Director" href="#member-elected">M</a>)</li>
 <li>Jun Murai (<a title="Partner-selected Director" href="#partner-selected">P</a>)</li>
 <li>Chris Needham (<a title="Member-elected Director" href="#member-elected">M</a>)</li>
 <li>Florian Rivoal (<a title="Member-elected Director" href="#member-elected">M</a>)</li>
 <li>Eric Siow (<a title="Member-elected Director" href="#member-elected">M</a>)</li>
 <li>Léonie Watson (<a title="Member-elected Director" href="#member-elected">M</a>)</li>
 <li>Chris Wilson (<a title="Member-elected Director" href="#member-elected">M</a>)</li>
 <li>Hongru (Judy) Zhu (<a title="Member-elected Director" href="#member-elected">M</a>)</li>
</ul>

<p>Non-voting Board meeting participants include:</p>
<ul>
  <li><a href="/People/Berners-Lee/">Tim Berners-Lee</a>, as the Founder Director</li>
  <li><a href="/2002/ab/">Advisory Board</a> liaisons, currently Tantek Çelik and Max Gendler</li>
</ul>

<p>The W3C Inc bylaws define three classes of Directors:</p>
<ul>
  <li id="member-elected"><strong>Member-elected (M)</strong>: All Member-elected Directors were elected by the W3C Membership in September 2024 to two-year terms.</li>
  <li id="partner-selected"><strong>Partner-selected (P)</strong>: These Director were elected by their respective Hosts/Partners to one-year terms during the term of their electing Partner's Partnership.</li>
  <li id="board-elected"><strong>Board-elected (B)</strong>: The Board may elect up to two additional Directors for two-year terms. Director Camarillo was elected in November 2022.</li>
</ul>

<h2 id="officers">Officers</h2>
<ul>
  <li>President: Seth Dobbs</li>
  <li>Treasurer: Ken Troshinsky</li>
  <li>Secretary: Christine Gefaell</li>
</ul>

<h2 id="resources">Board resources</h2>
<ul>
  <li><a href="/Member/bod/">Board home (<em>Member-only</em> info about contact, operations, meetings, etc.</a>)</li>
  <li><a href="/2024/09/25-w3c-bylaws-copy.html">W3C, Inc. Bylaws</a> and <a href="/2024/09/25-w3c-charter-copy.html">Certificate of Incorporation</a></li>
</ul>'''
