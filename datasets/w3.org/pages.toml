title = "我々について | W3C"
description = "このページでは、オープンな場でウェブ標準を開発するマルチステークホルダー・メンバー組織であるワールド・ワイド・ウェブ・コンソーシアムを紹介します。"
full_description = '我々について 言語切り替え： 中文（简体） English ウェブの可能性を最大限に引き出します 会社概要World Wide Web Consortium (W3C) は国際的な公益非営利団体で、メンバー団体、専任スタッフ、および一般市民が協力して Web 標準を開発しています。ウェブの発明者であるティム・バーナーズ＝リーによって設立され、会長兼 CEO の Seth Dobbs と Board of Directors によって率いられるウェブコンソーシアムの ミッション は、ウェブの可能性を最大限に引き出すことです。W3C の歴史ウェブの発明者であるティム・バーナーズ=リーは、ウェブの長期的な成長を保証するために、1994年に World Wide Web Consortium を設立しました。彼は現在も W3C の名誉理事であり、理事会の名誉メンバーです。設立当初から、ワールド ワイド ウェブ コンソーシアム (W3C) は、加盟団体、フルタイムのスタッフ、および一般市民が協力してオープンなウェブ標準を開発する、マルチステークホルダー型の国際コミュニティです。W3Cの歴史を読む W3CコミュニティW3C のグローバルスタンダードは、拡張性のあるウェブソリューションのためのツールキットを構成し、イノベーターが困難な問題を解決することを可能にし、ウェブ上のアクセシビリティ、国際化、プライバシー、およびセキュリティの要件を満たすための適切な基盤を提供します。社会のさまざまなニーズを満たす標準は、1 つの企業によってではなく、Web コンソーシアム コミュニティの活動によって作成されます：メンバー： 世界中の 350 以上のメンバーが、標準の開発と実装をリードしています。スタッフ： W3C は公益非営利団体であり、その収入は主に会費から得られます。これらの収入といくつかの助成金によって、スタッフ約50人が支えられています。開発者： 世界中の 14,700 人以上の開発者が標準開発に参加しています。W3Cがどのように導かれているかを学ぶ 我々独自の利点 違いを生み出すオープンスタンダード 私たちのコミュニティは、20億のウェブサイトの作成、繁栄するビジネス・エコシステムの出現を可能にし、より多くの人々がウェブにアクセスでき、包括的で、安全なものにする数百のオープンスタンダードを開発してきました。 ロイヤリティ・フリーで普及を促進 W3Cの標準は、誰でも無料で利用できます。もし無料でなければ、開発者は無視するでしょう。 組み込みの包括性 W3Cの技術とガイドラインは、障害者がウェブにアクセスすることを可能にします。ウェブは、世界の多くの言語や文字体系でのコミュニケーションをサポートします。 ウェブの保護 W3C標準は、脆弱なパスワードに代わる認証技術を開発し、フィッシングやその他の巧妙なサイバー攻撃を減らすことで、ウェブのセキュリティを向上させます。 "ウェブはテクノロジーでつながった人類" Sir Tim Berners-Lee, ウェブの発明者 W3C標準開発プロセスウェブコンソーシアムで支持されている実証済みの標準開発プロセスは、公正さを促進し、進歩を可能にします。私たちの標準化作業は、W3C プロセス ドキュメントおよびロイヤリティ フリーの W3C 特許ポリシーのもと、より広範なコミュニティからのインプットを得て、オープンに行われます。決定はコンセンサスによって行われます。技術的な方向性と勧告は、大小のW3Cメンバーによるレビューが必要です。Advisory Boardは、コミュニティ主導によるプロセス文書の強化を指導します。テクニカルアーキテクチャグループは、技術的な問題に関する最高権威です。国際的な参加W3C は主に英語で活動しています。世界各地にあり、さまざまな分野に携わる組織がメンバーとして W3C に参加し、ベンダーニュートラルな Web 標準作成のためのフォーラムに参加しています。W3Cメンバーと献身的な専門家の常勤スタッフにより、W3Cはウェブへの貢献で国際的な評価を得ています。W3C の世界的な取り組みには、次のようなものがあります：世界中の国、地域、および国際組織とのリエゾン。これらの連絡先は、W3C がワールド ワイド ウェブの開発にグローバルに参加する文化を維持するのに役立っています。W3Cは、明確な進展を可能にするために、ウェブやインターネットの標準を開発している他の組織と特に緊密に連携しています。W3C Chapters Programは、開発者、アプリケーション構築者、標準設定者の間でW3C勧告の採用を促進し、W3Cに参加することで将来の標準作成にステークホルダー組織の参加を促します。Web 標準の翻訳や、W3C コミュニティの献身的なボランティアによるその他の資料。W3Cには、W3C資料の公認翻訳のポリシーもあります。公認されたW3C翻訳は、英語以外の言語でも公式の目的で使用することができます。講演 標準の作成に深く関わった人々による、ウェブ標準に関する様々な言語での世界各地での講演。W3C の国際化活動は、ウェブが人々にとって利用可能であることを保証するのに役立ちます。認識これらの活動を組織することで、Web コンソーシアムは公正さ、品質、効率性において高い評価を得ています。一般の人々にはあまり知られていませんが、Web コンソーシアムは、その世界的な影響力によって評価されています。Boston Globeは最初の歴史的なホストであるMITとともに W3Cがもっとも重要なことを達成したと報じています。ウェブ コンソーシアムの影響は、この地球を越えても広がっています： NASA は、火星および宇宙探査ミッションで定期的に W3C 標準を使用しています。この組織は、3つのエミー賞を受賞しています。2016年には、オンライン動画を字幕とキャプションでよりアクセスしやすくするための活動に対して、2019年には、ウェブ上のフルTVエクスペリエンスの標準化に対して、そして2022年には、ウェブおよびTVデバイス用のカスタムダウンロードフォントおよびタイポグラフィのためのフォント技術の標準化に対して、受賞しています。組織構造管理上、W3Cは2023年1月より独自の法人格となり、地球上の4つのホスト機関が法的および受託的な役割を担っていた非典型的な組織構造を28年間経て、公益非営利団体に移行しました。W3C の歴史については、こちらをお読みください。プロセス面では、W3C プロセス文書t、メンバー同意書、特許ポリシー、およびその他いくつかの文書が、W3C 標準の作成に関わる関係者の役割と責任を定めています。プロセス (Process) は、W3C の標準設定の側面を規定します。細則は、標準化プロセスと、ミッションを追求する W3C のその他の取り組みをサポートする法人の運営を規定します。資金調達モデルW3Cの収入源は以下の通りです：W3Cメンバーの会費研究助成金およびその他の民間・公的資金源スポンサーおよび寄付'
