["https://w3.org/zh-hans/get-involved"]
title = "欢迎参与 | W3C"
description = "本页描述了个人和组织可以参与万维网联盟（W3C）工作，以推进Web标准化的方式。"
full_description = "欢迎参与 切换语言： English 日本語 个人和组织可以通过多种方式参与万维网联盟的Web标准化工作。 无需W3C会员资格的参与方式 我们并没有个人会员类别，但欢迎个人通过审查规范、讨论、翻译等方式参与。 公众审查 公众对规范的审查对于确保其相关性和质量至关重要。您可以通过审查规范和章程来帮助提升W3C工作的质量。提供公众反馈 社区组 W3C的社区组和商务组对所有人开放。这些小组为任何热爱Web的人提供了一个讨论、孵化和发布想法的平台，有时也会将新工作带入W3C的标准化流程。这些小组由社区提议并运营。W3C社区组 活动 各种演讲、研讨会、见面会，以及W3C支持的会议等。由Web社区成员介绍W3C工作、讨论新想法的W3C研讨会、开发者见面会或我们支持的会议。浏览活动 学习 邮件列表、博客、新闻、培训、教程、工具、视频、翻译等等。W3C使用多种在线工具开展协作、教育和推广。公众可以通过精选资源和我们的在线培训进行学习，或通过讨论列表、博客、翻译等其他方式参与W3C的工作。浏览资源 以W3C会员身份参与 W3C的流程，尤其是专利政策，是为组织参与而设计的，因此作为组织会员参与联盟工作最为合适。 工作组 工作组、兴趣组、社区组、商务组等等。W3C通过创建Web标准、指南和支撑材料来实现其使命。社区组和商务组对所有人开放，为讨论和孵化想法以及将新工作带入W3C提供途径。了解W3C小组 活动 各种演讲、研讨会、会员见面会、开发者见面会，以及W3C支持的会议。Web社区成员对于W3C工作的展示、讨论新想法的W3C研讨会、会议（例如，工作组会议、W3C TPAC大会）、开发者见面会或我们支持的会议。浏览会议 学习与贡献 邮件列表、博客、新闻、培训、教程、工具、视频、翻译等等。W3C使用多种在线工具开展协作、教育和宣传。公众可以通过精选资源和我们的在线培训进行学习，或者通过讨论列表、博客、翻译等途径参与W3C工作。浏览资源 商业生态系统 万维网联盟（W3C）处于核心技术、行业需求和社会需求的交汇点。目前，受Web特别影响的商业生态系统包括汽车与交通、电商、媒体与娱乐、网络与通信、出版业、智慧城市、网络广告、万维物联网。W3C生态系统聚焦"
