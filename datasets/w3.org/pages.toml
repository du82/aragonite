["https://www.w3.org/2024/09/TPAC/health.html"]
title = "TPAC 2024: Health rules"
full_description = "Skip ⬇ Health rules general information We encourage the TPAC 2024 attendees to take the necessary precautions to protect themselves and other participants who will come from around the world where the impact of illness may vary greatly. Here are the guidelines for this event: Masks and daily testing are left to individual choice. At the same time, the W3C Code of Conduct requires respecting the personal boundaries of all fellow participants, and forbids exposing others to contagious disease. For information about mask and test availability, what to do if you are not feeling well, and what to do if you test positive for COVID, see below. Skip ⬇ Further information Masks and COVID tests N95 masks will be available at the registration desk for the attendees who will prefer to wear a mask during the event. COVID Antigen tests will also be available on demand. For blind or low-vision attendees, designated Team members will be available to help those who wish to take a COVID test. Either inquire at the registration desk or we can make arrangements to connect you directly with a Team member. Meeting rooms, breaks & meals All the meals are planned to be served and taken outside. The air handler serving the meeting rooms will be setup to send 100% of air from outside. However, depending on the outside temperature, we may need to adjust this percentage. In case of a positive COVID test If you test positive, even after the event, contact the meeting organizers at health@w3.org. They can assist you with: contact tracing doctors appointments if needed getting a PCR test extending hotel bookings etc. Isolation If you are required to isolate: Do not attend the event in person. Attend virtually instead. Stay in your room and rest. Avoid in-person interactions with other people. If you need to leave your room, wear a properly fitted N95/FFP2 or equivalent respirator and do not take it off. If meeting with other participants: do it outside, socially distanced, while wearing a mask, and only after informing them of your condition and giving them a chance to decline. The W3C team will help you, so don't hesitate to ask for assistance! Skip ⬇ Medical centers Anaheim Regional Medical Center Voice: (714) 774-1450 1111 W. La Palma Avenue, Anaheim, CA 92801 https://www.anaheimregionalmc.com/ Garden Grove Hospital and Medical Center Voice: (714) 537-5160 12601 Garden Grove Blvd., Garden Grove, CA 92843 https://www.gardengrovehospital.com/ One Stop Mobility Wheelchairs, scooters, and more Voice: (714) 533-1444 1520 S Harbor Blvd., Anaheim, CA 92802 https://www.onestopmobility.com/anaheim/"
