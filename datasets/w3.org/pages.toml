["https://www.w3.org/get-involved"]
title = "Get involved | W3C"
description = "This page describes the ways individuals and organizations can participate in the World Wide Web Consortium to advance web standardization."
full_description = "Get involved Read this page in: 中文（简体） 日本語 There are many ways individuals and organizations can participate in the Web Consortium to advance web standardization. Participate without W3C Membership We do not have a class of Membership for individuals but participation by individuals is welcome through review of specifications, discussions, translations and more. Public review Public reviews of specifications are critical to ensuring relevance and quality.You can help improve the quality of W3C work through reviews of specifications and charters.Give public feedback Community Groups W3C Community and Business Groups are open to all. They give anyone passionate about the Web a place to hold discussions, incubate and publish ideas, and sometimes bring new work to W3C standardization. These groups are proposed and run by the community.W3C Community Groups Events Talks, workshops, meetups, endorsed conferences, …Presentations of W3C work by members of the web community, W3C workshops to discuss new ideas for work, Developer meetups, or conferences we endorse.Browse events Learn Mailing lists, blogs, news, training, tutorials, tools, videos, translations, …W3C uses a number of online tools for work, education, and outreach. The public may learn from curated resources and our online training, or participate in W3C via discussion lists, blogs, translations, and other means.Browse resources Participate as a W3C Member W3C's processes, in particular the Patent Policy, are designed for organizational participation, therefore participation in the Consortium as an organization makes the most sense. Work groups Working Groups, Interest Groups, Community Groups, Business Groups, and more, …W3C pursues its mission through the creation of web standards, guidelines, and supporting materials. Community and Business Groups are open to all and offer ways to discuss and incubate ideas, bring new work to W3C.Discover W3C groups Events Talks, workshops, membership meetings, Developer meetups, endorsed conferences, …Presentations of W3C work by members of the web community, W3C workshops to discuss new ideas for work, meetings (e.g., working groups, W3C TPAC), Developer meetups, or conferences we endorse.Browse events Learn & contribute Mailing lists, blogs, news, training, tutorials, tools, videos, translations, …W3C uses a number of online tools for work, education, and outreach. The public may learn from curated resources and our online training, or participate in W3C via discussion lists, blogs, translations, and other means.Browse resources Business ecosystems The Web Consortium works at the nexus of core technology, industry needs, and societal needs.Currently, business ecosystems that are particularly impacted by the web include Automotive & Transportation, E-commerce, Media & Entertainment, Network & communications, Publishing, Smart Cities, Web Advertising, Web of Things.W3C ecosystems focus"
