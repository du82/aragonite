["https://w3.org/zh-hans/about"]
title = "关于我们 | W3C"
description = "本页面介绍万维网联盟（World Wide Web Consortium，W3C），一个多方利益相关者组成的会员组织，致力于开放地制定Web标准。"
full_description = "关于我们 切换语言： English 日本語 让Web惠及所有人！W3C汇聚全球利益相关者协力制定开放标准，共建同一个连接并赋能全人类的万维网。 我们是谁万维网联盟（W3C）是一个国际性的公益非营利组织。在这里，会员组织、全职员工和社会公众共同合作制定Web标准。万维网联盟由Web发明者Tim Berners-Lee创立，由总裁兼首席执行官Seth Dobbs和董事会领导。万维网联盟的使命是：“引领Web尽展其无限潜能。”W3C的历史Web发明者Tim Berners-Lee在1994年创立了W3C，以保障Web的长期发展。他本人仍然是W3C的荣誉理事长和董事会名誉成员。自成立以来，万维网联盟 (W3C) 一直是一个由会员组织、全职员工和社会公众共同合作开发开放Web标准的国际多方利益相关者社区。了解W3C历史 W3C社区W3C的全球标准构成了可扩展的Web解决方案工具包，使创新者能够解决难题，并为满足Web无障碍、国际化、隐私和安全需求提供了适当的基础。满足社会多样化需求的标准不是由某一家公司创造的，而是通过万维网联盟社区的共同努力实现的。会员：全球超过350家会员组织引领着标准的制定和实施。员工：W3C是一个公益非营利组织，其收入主要来自会员会费。这些收入和一些资助支持着一个由大约50人组成的员工团队。开发者：全球有超过14700名开发者参与标准的制定。了解W3C的领导方式 我们的一些独特优势 具有影响力的开放标准 我们的社区已经制定了数百项开放标准，这些标准促成了二十亿个网站的创建，推动了繁荣的商业生态的出现，并使Web更加普及、包容和安全。 免版税以促进采用 W3C标准可供任何人免费使用：如果不免费，开发者将不会采纳它们。 内置包容性 W3C技术和指南使残障人士能够访问Web。Web支持全球多种语言和书写系统的沟通。 保障Web安全 W3C标准通过开发可以取代弱密码的身份验证技术，提高了网页安全性，减少了网络钓鱼和其他复杂的网络攻击。 “Web技术连接人类社会。” Sir Tim Berners-Lee，Web发明者 W3C标准开发流程万维网联盟坚持的经过验证的标准制定流程促进了公平、推动了进步。我们的标准制定工作是在开放的环境中进行的，遵循W3C流程文件和免版税的W3C专利政策，并吸收更广泛社区的意见。决策通过共识达成，技术方向和推荐标准需要W3C会员（无论规模大小）的审核。咨询委员会指导流程文档在社区驱动下的改进。技术架构组是我们在技术事务上的最高权力机构。国际参与W3C主要使用英语作为工作语言。遍布全球且涉及多个领域的组织加入W3C成为会员，在一个中立的论坛中参与Web标准的创建。W3C会员和一支专注的全职专家团队使W3C因对Web的贡献而获得国际认可。W3C的全球努力涉及如下这些方面。与全球各地的国家、地区和国际组织建立联络。这些联络帮助W3C在万维网的发展过程中保持全球参与的文化。W3C特别密切地与其他制定Web或互联网标准的组织协作，以实现明确的进展。W3C分会计划旨在促进开发者、应用程序构建者和标准制定者采用W3C推荐标准，并鼓励利益相关组织通过加入W3C参与未来标准的制定。W3C社区热心志愿者对Web标准和其他材料的翻译。W3C还有一项关于W3C资料的授权翻译政策。经授权的W3C翻译可用于英语以外语言的官方用途。由参与标准制定的人在世界各地用多种语言进行关于Web标准的演讲。W3C的国际化活动有助于确保所有人都可以使用Web。得到认可通过协调这些活动，万维网联盟赢得了公平、高质量和高效率的赞誉。您或许还不知道，但万维网联盟因其全球影响力而获得认可：《波士顿环球报》将W3C评为与麻省理工学院（W3C历史上的第一个总部）相关的最重要成就。万维网联盟的影响甚至延伸到了这个星球之外：美国宇航局在火星和太空探索任务中经常使用W3C标准。万维网联盟已获得三项艾美奖：2016年因为无障碍视频字幕方面的工作、2019年因在网页上标准化完整的电视体验、2022年因标准化自定义可下载字体及网页和电视设备的排版技术获得艾美奖。组织架构在组织管理方面，W3C自2023年1月起成为独立法人实体，完成向公益非营利组织的转变。在此前的28年中，W3C采用了一种非典型的组织结构，由全球四个总部机构承担法律和信托职责。了解更多关于W3C历史的信息。在流程方面，W3C流程文档、会员协议、专利政策以及其他一些文件明确了参与制定W3C标准各方的角色和职责。流程文档指导着W3C的标准制定工作。联盟在章程（Bylaws）的管理下运行，支持标准流程以及W3C为实现其使命所做的其他努力。资金模式W3C的收入来源包括：W3C会员费研究资助以及其他私人和公共资金来源赞助和捐赠"
