["https://www.w3.org/news-events/w3c-tpac"]
title = "About W3C TPAC | News and events | W3C"
description = "The W3C annual conference aims to coordinate solutions to technical issues by gathering in a single event several meetings between the W3C Members and Boards, W3C Working and Interest Groups, as well as a series of breakout sessions determined by the attendees."
full_description = "About W3C TPAC Read this page in: 中文（简体） 日本語 Page contents About W3C TPACUpcoming: TPAC 2025TPAC in more detailsPast meetings About W3C TPACThe W3C annual conference aims to coordinate solutions to technical issues by gathering in a single event several meetings between the W3C Members and Boards, W3C Working and Interest Groups, as well as a series of breakout sessions determined by the attendees.W3C meetings operate under the W3C Code of Conduct. This 2:24 video explains how TPAC (W3C's annual conference) is the place to create momentum, engage, learn and coordinate work on Web Standards. Upcoming: TPAC 2025Will be held on 10-14 November 2025 in Kobe Japan & online.(See previous TPACs.) TPAC in more detailsDuring the exciting TPAC week, W3C Working and Interest Groups gather and network to resolve challenging technical and social issues that the Web faces. This well-attended and popular event is an important means for W3C to coordinate solutions to technical issues that transcend group borders.TPAC brings together W3C technical groups, the Board of Directors, the Advisory Board, the Technical Architecture Group and the Advisory Committee.Breakout sessions and most meetings records are public.What does TPAC stand for?TPAC historically stands for Technical Plenary and Advisory Committee, since it gathered in a single event a meeting of the W3C Advisory Committee (where each W3C Member has a representative) and a broad set of technical group meetings, culminating in a plenary day – the technical plenary.In recent years, the plenary format had mostly been replaced by an unconference format organized as a series of one-hour sessions on topics brought by the attendees.The name TPAC is familiar enough in the W3C community that we are still using it, but we are trying to reference it more broadly as ‘Annual W3C Conference’ to make it easier to understand.Connectivity at meetingsW3C provides wireless Internet access.LanguageMeetings are held in English.Inclusion Fund66% of the world is now online. We want and need to reflect the diversity of the whole world as more people continue to access, use and create the web. We believe that more diversity means better representation, which leads to better and more inclusive design, and brings higher quality results.The Inclusion Fund is sponsored by W3C, its Members or individuals, and aims to help remove barriers for people from a group that is under-represented in the web community, who are unable to attend TPAC without financial help, and who want to attend or contribute to TPAC in a meaningful way.The modest fund can cover expenses like travel, accommodation, child care (or care for a relative) to free up remote attendees time. Applications usually open a few months before TPAC.Registration, modification, cancellationAll meeting participants are expected to register for each meeting they plan to attend as either a group participant or an observer (some groups may not permit observers), subject to each group's policy.Depending on the location, there may be limited seating. Early registration is strongly recommended. Registration is processed on a first-come, first-served basis.We allow people to switch their registration from on-site to remote, and vice versa, while retaining the same class of registration. (i.e., early bird on-site will convert to early bird remote, and vice versa).If you need to cancel your registration to the event, refunds will be subject to a cancellation fee (which will vary depending on the registration fee and type of credit/debit cards).To modify and adjust the fees or cancel your registration, or for any TPAC questions, contact w3t-tpregister@w3.org. Past meetingsTPAC 202423 – 27 September 2024Anaheim, CA, USA (hybrid event)TPAC 202311 – 15 September 2023Seville, Spain (hybrid event)TPAC 202212 – 16 October 2022Vancouver, Canada (hybrid event)TPAC 202112 – 29 October 2021‘Virtual’ eventTPAC 202012 – 30 October 2020‘Virtual’ eventTPAC 201916 – 20 September 2019Fukuoka, JapanTPAC 201822 – 26 October 2018Lyon, FranceTPAC 20176 – 10 November 2017Burlingame, CA, USA Hosted by W3C-MITTPAC 201619 – 23 September 2016Lisbon, PortugalTPAC 201526 – 30 October 2015Sapporo, JapanTPAC 201427 – 31 October 2014Santa Clara, CaliforniaTPAC 201311 – 15 November 2013Shenzhen, China Hosted exclusively by TencentTPAC 201229 October – 2 November 2012Lyon, FranceTPAC 201131 October – 4 November 2011Santa Clara, CaliforniaTPAC 20101 – 5 November 2010Lyon, FranceTPAC 20092 – 6 November 2009Santa Clara, CA, USATPAC 200820 – 24 October 2008Mandelieu, FranceTPAC 20075 – 10 November 2007Cambridge, MA, USATPAC 200627 February – 3 March 2006Mandelieu, FranceTPAC 200528 February – 4 March 2005Boston, MA, USATPAC 20041 – 5 March 2004Mandelieu, FranceTPAC 20033 – 7 March 2003Cambridge, MA, USATPAC 200225 February – 1 March 2002Mandelieu, FranceTPAC 200126 February – 2 March 2001Cambridge, MA, USA"
year_published = 2024
clearnet = "https://www.w3.org/news-events/w3c-tpac"
