full_description = 'Blog The W3C blog is for in-depth Web standards topics and educational materials. More information in About W3C Blog. Search posts Show results Browse categories Browse categories All Accessibility Corporate Data Developers Events Immersive Web Internationalization Privacy and Security Sustainability Systems Testing Tools Training Tutorials Web Architecture Workshop Browse archives Browse archives All 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 2008 2007 2006 2005 This is page 1, displaying results 1-10 International standards and World Economic Forum (WEF) Corporate Published: 24 February 2025 By: Seth Dobbs, W3C CEO and President In this blog post, W3C CEO Seth Dobbs shares impressions from representing W3C for the first time at the World Economic Forum, and illustrates how our distinctive human-centric focus in the world of Standards Development Organizations positions W3C to be helping to shape the future of the web. ceo Davos Collaborating across W3C and Ecma for web-interoperable server runtimes through WinterTC Published: 10 January 2025 By: Luca Casonato (Deno, WinterCG co-chair, Ecma TC55 co-chair), Mike Smith (W3C staff, liaison to Ecma) and Daniel Ehrenberg (Bloomberg, Ecma President) The W3C Web Interoperable Runtimes Community Group ("WinterCG") and Ecma International (the organization which standardizes ECMAScript, also known as JavaScript) have collaborated to create a new Ecma Technical Committee,TC55 – Web-interoperable server runtimes, dubbed "WinterTC", for the development of a common web-aligned API surface for server-side JavaScript runtimes like Node.js, Deno and Cloudflare Workers. Community Group Happy holidays from the World Wide Web Consortium Corporate Published: 18 December 2024 By: Seth Dobbs, W3C CEO and President Discover the World Wide Web Consortium’s 30th anniversary year animated holiday card and read about some of the highlights of the year 2024 in W3C’s CEO Seth Dobbs’ blog post. ceo EOY W3C seeking community input for TAG appointment Corporate Published: 17 December 2024 By: Yves Lafon, W3C Team contact for the TAG and Coralie Mercier, Head of W3C Communications W3C is seeking community input between December 17 and January 5 for appointment to the W3C Technical Architecture Group (TAG), to complement the TAG election by actively seeking candidate appointees in order to support a diverse and well-balanced TAG, including diversity of technical background, knowledge, and skill sets. inclusion tag Ethical Web Principles: Building a better web Web Architecture Published: 16 December 2024 By: Daniel Appelquist, TAG co-chair The Ethical Web Principles are a manifesto of W3C’s core values and principles. In this post, W3C Technical Architecture co-chair Dan Appelquist outlines how to go from words to action. tag W3C Statement EWP W3C Statement on Ethical Web Principles guides the community to build a better web Web Architecture Published: 12 December 2024 By: Daniel Appelquist, TAG co-chair and Yves Lafon, W3C Team contact for the TAG The Ethical Web Principles, which build on W3C’s core values and principles in the web and its architecture, are a call to action for the web industry and for W3C itself, aiming to deliver positive social outcomes. As we expand the web platform, we must consider the consequences of our work. As members of the web community, we each play a part in shaping its future. tag W3C Statement EWP AIOTI Workshop on Semantic Interoperability for Digital Twins at ERCIM Workshop Published: 14 November 2024 By: Dave Raggett the workshop will discuss Semantic interoperability - key to open ecosystems on the Web Sustainable Web Interest Group is formed Sustainability Published: 4 November 2024 By: Tzviya Siegman Announcement of the formation of the W3C Sustainable Web Interest Group. W3C 30th anniversary & impressions on my first TPAC Corporate Published: 23 October 2024 By: Seth Dobbs In this blog post, W3C CEO Seth Dobbs describes W3C’s 30th anniversary event, and shares his impressions after attending for the first time a W3C TPAC which attracts in a week several hundreds from the W3C community in order to coordinate solutions to web problems. ceo anniversary tpac Reflections on TPAC 2024 Breakouts Published: 16 October 2024 By: Ian Jacobs and François Daoust In this post, the staff who organize TPAC breakout sessions share thoughts on the topics covered this year and some feedback received so far. Pagination 1 2 3 4 5 … Last Next Related RSS feed Subscribe to our blog feed'
