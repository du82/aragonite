["https://www.w3.org/email"]
title = "Mailing lists | W3C"
description = "Mailing lists"
full_description = '''Mailing lists Read this page in: 中文（简体） 日本語 Page contents General informationSubscribing and unsubscribingSearching and referencingGuidelines and policies W3C hosts thousands of mailing lists for our group members and the general public to discuss and send feedback on Web standards work at W3C. The corresponding mailing list archives, most of which allow anyone to join and participate, contain millions of messages dating back to the earliest days of the Web.Our Mailing list policies govern W3C email and mailing lists usage.General informationEach W3C mailing list has its own policies regarding who may post to the list. Those subscribed to a list are generally able to post directly to the list without delay; those who are not may be subject to manual moderation.First-time posters to our lists with public archives will need to give us permission to publish their message in our public archives using our archive approval system.Each mailing list has a specific purpose. Please avoid cross-posting to multiple lists.Posting of Unsolicited Bulk E-mail (UBE), or spam is strictly forbidden.Conference announcements and calls for papers or participation are generally not welcome on W3C lists. Please see our spam policy for more details.Messages in our mailing list archives are generally not removed or edited, except in very rare circumstances. See our Archive Editing Policy for more information.Subscribing and unsubscribingMembers of W3C groups are automatically subscribed to the relevant list(s) when joining the group(s), and unsubscribed when leaving.Many of our public mailing lists also allow subscriptions without being a member of a group, using an email command interface described below.W3C account holders can view a list of their current mailing list subscriptions.Before joining a group or subscribing to a mailing list please be sure you have read our mailing list policies and agree to abide by our Code of Conduct (Code).Group-related mailing listsTo subscribe or unsubscribe to mailing lists associated with a W3C group, please visit the home page for the group(s) in question.A list of your current groups is available on your user profile page.Subscribing manuallyTo subscribe to a W3C mailing list, for example www-talk, send "subscribe" in the subject of a message to the list name followed by -request at our domain, for example:To: www-talk-request@w3.org Subject: subscribe You should receive an automated response with instructions on how to confirm your subscription request. Note that you will not get an acknowledgement if you are already subscribed.Unsubscribing manuallyTo unsubscribe from a mailing list, for example www-talk, send "unsubscribe" in the Subject of a message to the list name followed by "-request" at our domain, for example www-talk-request@w3.org:To: www-talk-request@w3.org Subject: unsubscribe To unsubscribe an email address other than your current address, specify the old address following unsubscribe in the Subject, for example:To: www-talk-request@w3.org Subject: unsubscribe old.address@example.org In either case you should receive an autoreply with instructions on how to confirm your request.Asking for helpAll mailing list administrative requests, including asking for help, must be sent to a *-request address (per RFC2142), never to the list itself. For a mailing list named list-name@w3.org, the associated request address would be list-name-request@w3.org.Searching and referencingAn archive search tool is available.It is frequently useful to refer to a message (e.g., from the body of an email or from a web page) using a URI to the message in the archive. In addition, you can use the message's own "message-id" and map it to the archive URI using the message-id mapping tool.Guidelines and policiesMailing list policiesPolicies that apply to our mailing lists, and answers to frequently asked questions.Spam policyHow we define spam, what we do about it, and why.W3C Positive Work Environment and Code of Conduct (Code)W3C's policies for appropriate behavior, including on our mailing lists.Email forgery prevention using SPF (Sender Policy Framework)Information on our use of SPF to block forged email and prevent email forgeries in our name.Guidelines for email attachment formatsGuidelines on email attachments for messages sent to W3C mailing lists.Filtering email from W3C listsSome advice on how to filter mail from W3C mailing lists in various email clients.Policy on subject taggingRationale for not adding tags to the subjects of our lists.Archive editing policyW3C policy on editing/removing posts in online mailing list archives.Email address obfuscationSome notes on the amount of email address obfuscation performed on messages in W3C's mailing list archives.'''
year_published = 2025
