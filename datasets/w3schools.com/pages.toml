title = "ASP VB Conditionals"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. If you want to execute only one statement when a condition is true, you can write the code on one line: There is no ..Else.. in this syntax. You just tell the code to perform one action if a condition is true (in this case If i=10). If you want to execute more than one statement when a condition is true, you must put each statement on separate lines, and end the statement with the keyword "End If": There is no ..Else.. in the example above either. You just tell the code to perform multiple actions if the condition is true. If you want to execute a statement if a condition is true and execute another statement if the condition is not true, you must add the "Else" keyword: In the example above, the first block of code will be executed if the condition is true, and the other block will be executed otherwise (if i is greater than 10). You can use the If...Then...ElseIf statement if you want to select one of many blocks of code to execute: You can also use the "Select Case" statement if you want to select one of many blocks of code to execute: This is how it works: First we have a single expression (most often a variable), that is evaluated once. The value of the expression is then compared with the values for each Case in the structure. If there is a match, the block of code associated with that Case is executed. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com'
