full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. In AngularJS, a service is a function, or object, that is available for, and limited to, your AngularJS application. The $location service has methods which return information about the location of the current web page: Note that the $location service is passed in to the controller as an argument. In order to use the service in the controller, it must be defined as a dependency. For many services, like the $location service, it seems like you could use objects that are already in the DOM, like the window.location object, and you could, but it would have some limitations, at least for your AngularJS application. AngularJS constantly supervises your application, and for it to handle changes and events properly, AngularJS prefers that you use the $location service instead of the window.location object. The $http service is one of the most common used services in AngularJS applications. The service makes a request to the server, and lets your application handle the response. This example demonstrates a very simple use of the $http service. Learn more about the $http service in the AngularJS Http Tutorial. Once you have created a service, and connected it to your application, you can use the service in any controller, directive, filter, or even inside other services. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com"
