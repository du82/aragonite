["https://w3schools.com/ai/ai_perceptrons.asp"]
title = "Perceptrons"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Frank Rosenblatt (1928 – 1971) was an American psychologist notable in the field of Artificial Intelligence. In 1957 he started something really big. He "invented" a Perceptron program, on an IBM 704 computer at Cornell Aeronautical Laboratory. Scientists had discovered that brain cells (Neurons) receive input from our senses by electrical signals. The Neurons, then again, use electrical signals to store information, and to make decisions based on previous input. Frank had the idea that Perceptrons could simulate brain principles, with the ability to learn and make decisions. The original Perceptron was designed to take a number of binary inputs, and produce one binary output (0 or 1). The idea was to use different weights to represent the importance of each input, and that the sum of the values should be greater than a threshold value before making a decision like yes or no (true or false) (0 or 1). If the weather weight is 0.6 for you, it might be different for someone else. A higher weight means that the weather is more important to them. If the threshold value is 1.5 for you, it might be different for someone else. A lower threshold means they are more wanting to go to any concert. The Threshold is the value needed for the perceptron to fire (outputs 1), otherwise it remains inactive (outputs 0). The purpose is to introduce non-linearity into the output. It determines whether the perceptron should fire or not based on the aggregated input. During training, the perceptron adjusts its weights based on observed errors. This is typically done using a learning algorithm such as the perceptron learning rule or a backpropagation algorithm. The learning process presents the perceptron with labeled examples, where the desired output is known. The perceptron compares its output with the desired output and adjusts its weights accordingly, aiming to minimize the error between the predicted and desired outputs.'
