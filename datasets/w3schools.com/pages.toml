["https://w3schools.com/accessibility/accessibility_diversity.php"]
title = "Accessibility Diversity"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. There are close to 8 billion people in the world. According to World Health Organization, there are over one billion people with disabilities. That is about 15 % of the population. Access to information is a human right. This poster says it all. People are different. People are diverse. We must welcome everyone regardless of race, religion, country of origin, gender identity, sexual orientation, ability and disabilities, spoken language or age. We think that web accessibility is about abilities and disabilities. It is also about spoken languages. Is your content written in an easily understandable way for people with a different language background? Have you avoided text in images, so that all text is translatable? It is also about age. With age comes challenges. Technical challenges. Cognitive challenges. Mobility challenges. A disability is not a yes or a no. All people for many different reasons experience varying degrees of auditory, cognitive, physical, speech and visual disabilities. We grow older. Our health conditions change. We have good and bad days. We get ill. We have temporary impairments due to accidents, surgeries and medication. We have situational limitations due to our surroundings and situations. The spectrum is large. People that may have challenges understanding information. Remember a clear structure, consistent labeling, predictable links and plain language. This helps everyone regardless of ability or disability. People with limitations in their muscular control, sensations, joint disorders or missing limbs. Remember to support assistive technologies like switches and voice recognition and to have sufficient target sizes. Target size is the size of a interactive element, the clickable or tapable area. People with reduced vision. Make sure text and images can be enlarged, you use sufficient contrast, that you do not rely on color alone, and that the content supports text-to-speech."
