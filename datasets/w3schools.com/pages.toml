full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Screen readers are necessary for blind people, important for partially-sighted users and helpful for people with reading disorders. It is hard to teach about web accessibility without talking about screen readers. Screen readers has become for web accessibility what wheel chairs is for accessibility. Even though it is a myth that accessibility is just for blind or partially-sighted users, screen reader support is a mandatory topic. If you have done everything you have learned in this course, your site should probably work well in screen readers. That does not necessarily mean that all blind users are able to use it. As the name implies, a screen reader is a tool that reads your screen. Necessary for blind people, important for partially-sighted users and helpful for people with reading disorders. For mobile devices, Apple has the biggest share of screen reader users. The screen reader VoiceOver is built in on iOS. The second most popular is TalkBack for Android, also built in on all Android devices. Making sure your site works well with these two is a good starting point. Before we proceed, read these articles: For desktop and laptop computers, there is two screen readers you should be aware of – NVDA and JAWS. If you have to choose one for testing, go for NVDA. It is free and its popularity is growing. Both are only available for Windows. For the screen reader to speak the correct language, it needs to know what language your content is. This is done with the lang attribute in the <html> element. The following example specifies English as the language: The lang attribute changed from lang="en" to lang="id". Good for screen readers and good for search engines. Sometimes parts of your content is in another language. To make screen readers change their language in the middle of the page, we use 