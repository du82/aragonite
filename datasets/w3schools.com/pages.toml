full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. AngularJS monitors the state of the form and input fields (input, textarea, select), and lets you notify the user about the current state. You can use standard HTML5 attributes to validate input, or you can make your own validation functions. You can use these states to show meaningful messages to the user. Example, if a field is required, and the user leaves it blank, you should give the user a warning: To create your own validation function is a bit more tricky; You have to add a new directive to your application, and deal with the validation inside a function with certain specified arguments. Create your own directive, containing a custom validation function, and refer to it by using my-directive. Remember, when naming a directive, you must use a camel case name, myDirective, but when invoking it, you must use - separated name, my-directive. Make a linking function which takes some arguments, where the fourth argument, mCtrl, is the ngModelController, Then specify a function, in this case named myValidation, which takes one argument, this argument is the value of the input element. Test if the value contains the letter "e", and set the validity of the model controller to either true or false. At last, mCtrl.$parsers.push(myValidation); will add the myValidation function to an array of other functions, which will be executed every time the input value changes. Because of ng-show, the spans with color:red are displayed only when user or email is $dirty and $invalid. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com'
