["https://w3schools.com/ai/ai_robots.asp"]
title = "History of Robots"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = '''W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. In 1969, Victor Scheinman invented the Stanford Arm (Stanford University), and in 1972 he designed the MIT Arm for the MIT Artificial Intelligence Lab. These "robots" are not considered intelligent. They are electrical machines designed to permit 6-axis arm movement. But the new design allowed for a machine to follow a programmed path and opened up for "robot jobs" like car painting, welding and assembly. The pioneering robot company Unimation (with support from General Motors) took the Scheinman's design to the marked as the PUMA (Programmable Universal Machine for Assembly). Most modern robots are said to be autonomous or semi-autonomous because they do not require much human input after they have been programmed. A robot can easily be programmed to do a lot of different things (like on an assembly line), but it will never change what it is doing. It will continue to the same job until you turn it off. A robot is a physical thing. After 50 years of development, almost anything is programmable, your radio, your watch, your phone, and even robots. Artificial Intelligence can be built into robots, and AI is a very exciting field in future robotics. Sophia is a combination of science, engineering, and artistry. She is a human-crafted science fiction character depicting the future of AI and robotics. Kismet (a MIT robot) is programmed to understand body language and voice inflection. The creators study how human and babies interact, based on tone of speech and visual cue. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com'''
