["https://w3schools.com/accessibility/accessibility_intro.php"]
title = "Accessibility Introduction"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. The principle that everyone should be able to use the web equally, regardless of any disability, is as important today as it was twenty years ago. People who have limited use of their arms, people who cannot hear or see well and people who process information differently, should all be able to access and use web sites and apps. Web technologies have many built in features for accessibility, and we as web developers should know them so that we do not exclude any of our users. There is no precise starting point of the history of web accessibility. This coming list of milestones is far from complete. This is a brief history to introduce the basics. Dr. Cynthia Waddel published a web design accessibility standard for the City of San Jose’s Office of Equality Assurance. One of the requirements in the standard was that all images must have alternative text. This is one rule that is still valid today. Another requirement was that all pages should support text browsers. That is not something we aim for any longer, even though text browsers still exist. Even though her standard became an important starting point for other well known standards and guidelines, she is better known for the accessibility testing software Cynthia Says. The accessibility testing software Bobby was released a couple of years before Cynthia Says. Bobby worked much the same way many of the current testing tools are working. HTML code was tested against a set of rules, and the results was a list of issues. Instead of a browser extension, that did not exist back then, you uploaded a local HTML file. The Web Accessibility Initiative started as a W3C project in 1996. This initiative is mostly known for the Web Content Accessibility Guidelines (WCAG). They also provide a variety of strategies and resources for web accessibility. Tim Berners-Lee founded the World Wide Web and wanted everyone to have equal access to it. W3C released 14 guidelines and 65 checkpoints about web accessibility. Many of them are still a part of the WCAG. We will get into more details about WCAG in a later module."
