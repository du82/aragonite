full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. The goal of a linear regression is to fit a linear graph to a set of (x,y) points. This can be solved with a math formula. But a Machine Learning Algorithm can also solve this. Then it trains the model to find a line that fits the plot. This is done by altering the weight (slope) and the bias (intercept) of the line. A standard way to solve a regression problem is with an "Cost Function" that measures how good the solution is. The function uses the weight and bias from the model (y = wx + b) and returns an error, based on how well the line fits a plot. The way to compute this error is to loop through all (x,y) points in the plot, and sum the square distances between the y value of each point and the line. The most conventional way is to square the distances (to ensure positive values) and to make the error function differentiable. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com'
