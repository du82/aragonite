description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. The goal of training is to create a model that can answer a question. Like what is the expected price for a house? Inference is when the trained model is used to infer (predict) values using live data. Like putting the model into production. Supervised Machine Learning uses a set of input variables to predict the value of an output variable. Supervised learning can classify data like "What is spam in an e-mail", based on known spam examples. Supervised learning can predict outcomes like predicting what kind of video you like, based on the videos you have played. Unsupervised Machine Learning uses patterns from any unlabeled dataset, trying to understand patterns (or groupings) in the data. It is expected that machine learning will shift to unsupervised learning to allow programmers to solve problems without creating models. Reinforcement learning is based on non-supervised learning but receives feedback from the user whether the decision is good or bad. The feedback contributes to improving the model. Self-supervised learning is similar to unsupervised learning because it works with data without human added labels. The difference is that unsupervised learning uses clustering, grouping, and dimensionality reduction, while self-supervised learning draw its own conclusions for regression and classification tasks. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com'
