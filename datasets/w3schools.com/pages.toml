["https://w3schools.com/appml/appml_history.asp"]
title = "AppML History"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Already then, AppML was based on HTTP request communication between web client and the web server. Later this method became well known as AJAX. In September 2000, a development project for a large Norwegian customer was started. The goal of the project was to convert a huge information system (about 300 applications) from a Windows desktop application to a modern Internet application, using only AppML. The AppML-based system was launched in 2001, several months before schedule, as the world's first commercial AJAX application. The project was a huge success, with development time reduced by 75% compared to ordinary web development. Since then, new applications have been added, and the system now covers over 1000 running applications. Executables (EXE files, ActiveX and COM objects, DLL-files) are components that prevent the development of applications that can run over the internet. Future application will not use, or rely on, executables or any other components installed on the client's computer. The history is full of large, purpose built, applications. Many of these died very quickly, because they could not survive requirements changes. Applications should be flexible, generalized, and gracefully adjust to changes, without being crumbled or destroyed. Applications should be able to spread from one server to many, or to move between servers, without breaking the application. Applications should be broken down into smaller services, that are easy to create and easy to maintain. Applications should be a set of Internet services that can return data to submitted Internet requests. Applications should request services via standard Internet protocols without maintaining a permanent connection to the server. Use human readable text files to describe services, and provide services by executing these descriptions. The first web developer had a demo up and running in two days. After collaboration with the users, an exiting prototype was ready in a week. And after two weeks of testing, an intelligent, fast and easy to use, web site, was ready to publish."
