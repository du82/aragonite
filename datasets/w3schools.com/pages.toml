full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Clusters can hold a lot of valuable information, but clusters come in all sorts of shapes, so how can we recognize them? The Density Method considers points in a dense regions to have more similarities and differences than points in a lower dense region. The density method has a good accuracy. It also has the ability to merge clusters. Two common algorithms are DBSCAN and OPTICS. The Hierarchical Method forms the clusters in a tree-type structure. New clusters are formed using previously formed clusters. Two common algorithms are CURE and BIRCH. The Grid-based Method formulates the data into a finite number of cells that form a grid-like structure. Two common algorithms are CLIQUE and STING The Partitioning Method partitions the objects into k clusters and each partition forms one cluster. One common algorithm is CLARANS. The Correlation Coefficient (r) describes the strength and direction of a linear relationship and x/y variables on a scatterplot. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com"
