["https://w3schools.com/accessibility/accessibility_landmarks.php"]
title = "Accessibility Landmarks"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. With landmarks, blind users using a screen reader have the ability to jump to sections of a web page. The front page of The White House is using landmarks. It consists of a <header> at the top, a <main> containing all the main content and a <footer> with some <nav> elements at the bottom. One way to visualize landmarks is to use the tool Accessibility Insights. One of the features is that it highlights the landmarks, as we can see in the following screenshot. Try it yourself. Download the browser extension Accessibility Insights and turn on the landmark visualization. Is your favorite site using landmarks? But wait, it shows banner, contentinfo and navigation. This is a bit confusing. The reason is that each landmark element has a corresponding role. We have not talked about roles in this course so far. We will get back to this, but as a simplified explanation: A <header> has a built in role of banner. This means that both <header>, <header role="banner"> and <div role="banner"> are more or less equivalent. For most cases, <header> will be sufficient. The same is true for <nav>, which has role="navigation" built in. <main> is easier, it has role="main". And then we have <footer> with its role="contentinfo". Let us leave the roles for now. A rule of thumb is to only use one <main> per page. When we use more than one type of landmark, like multiple <nav>s like in this example, we must label each of them. This is done with the attribute aria-label. In the footer of The White House, we have three <nav>s, each with an aria-label, like aria-label="social navigation". This means that a screen reader user can skip directly to the social navigation. A helping hand. Some will say that to use the wording "navigation" as a part of the label of a <nav> is redundant. There is no right and wrong, but aria-label="social" should be fine.'
