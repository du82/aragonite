title = "Machine Learning Intro"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Neural Networks are based on how the human brain works: Neurons are sending messages to each other. While the neurons are trying to solve a problem (over and over again), it is strengthening the connections that lead to success and diminishing the connections that lead to failure. In the Neural Network Model, input data (yellow) are processed against a hidden layer (blue) before producing the final output (red). The First Layer: The yellow perceptrons are making simple decisions based on the input. Each single decision is sent to the perceptrons in the next layer. The Second Layer: The blue perceptrons are making decisions by weighing the results from the first layer. This layer make more complex decisions at a more abstract level than the first layer. Deep Neural Networks are made up of several hidden layers of neural networks that perform complex operations on massive amounts of data. For instance, optical reading uses low layers to identify edges, and higher layers to identify letters. In the Deep Neural Network Model, input data (yellow) are processed against a hidden layer (blue) and modified against more hidden layers (green) to produce the final output (red). The First Layer: The yellow perceptrons are making simple decisions based on the input. Each single decision is sent to the perceptrons in the next layer. The Second Layer: The blue perceptrons are making decisions by weighing the results from the first layer. This layer make more complex decisions at a more abstract level than the first layer. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com"
