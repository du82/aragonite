["https://w3schools.com/accessibility/accessibility_buttons_links.php"]
title = "Accessibility Buttons and Links"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Buttons and links are specific types of interactive components. Each of them work differently with assistive technologies. The correct use of each component helps users with assistive technologies to interact with the component. The <button> element should be used for any interaction that performs an action on the current page. The <a> element should be used for any interaction that navigates to another view. In the introduction, we saw that the visual design does not dictate which HTML element we should use. A link that looks like a button, but behaves like a link, is an <a>. Both the "button" Sign up to drive and the link underneath is coded as an <a>. So when should we use a <button>, then? Let us take a closer look at the website of Uber. The first section of the header has five elements – a logo, a dropdown menu and three links. One of them is coded as a <button>. Clicking Company opens a drop down menu. This is an interaction that performs an action on the current page. Using <button> here is the correct thing to do. The underlying links, About us, Our offerings and so on, are correctly coded with <a> elements. The arrow indicates that this is a button with a dropdown menu, that changes direction when opened. This is a nice extra visual cue. One benefit with this, is that semantic HTML gives context to screen readers, which read the contents of a page out loud. You will learn more about screen readers in module 7 about assistive technologies. Both a link and a button are accessible for people relying on keyboard-only navigation; it can be clickable with both mouse and keys, and it can be tabbed between using the tab key on the keyboard. Links take users from one page to another, or sometimes to another part of the page. For a link to be accessible, remember to: If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com'
