full_description = '''W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. The ASP Browser Capabilities component creates a BrowserType object that determines the type, capabilities and version number of a visitor's browser. When a browser connects to a server, a User Agent header is also sent to the server. This header contains information about the browser. The BrowserType object compares the information in the header with information in a file on the server called "Browscap.ini". If there is a match between the browser type and version number in the header and the information in the "Browscap.ini" file, the BrowserType object can be used to list the properties of the matching browser. If there is no match for the browser type and version number in the Browscap.ini file, it will set every property to "UNKNOWN". The example below creates a BrowserType object in an ASP file, and displays some of the capabilities of your browser: This section is not a tutorial on how to maintain "Browscap.ini" files, it only shows you the basics; so you get an idea what the file is all about. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com'''
