full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. The Babylonian system was a place-value system, where the digits to the left represented full values, much like our decimal system. The reason why the Babylonians used 60 as the base, was (we like to believe) that 60 is divisible with most numbers: 1,2,3,4,5,6,10,12,15,20,30, and 60. The downside was that the user had to remember 60 different digits. But the system was smart. A lot of it is still in use today: The Babylonians counted to 360 because of their sexagesimal (base-60) number system, which they inherited from earlier Mesopotamian cultures. This system led to many mathematical and astronomical conventions that we still use today, including: Today, most of the world use a Base 10 number system: Western numbers, Chinese numbers, Brahmi numbers, Greek numbers, Hebrew numbers... 5 means 5 50 means 5 times 10 500 means 5 times 100 57 means 5 times 10, plus 7 75 means 7 times 10, plus 5 If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com"
