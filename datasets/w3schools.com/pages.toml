full_description = '''W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Kenneth Craik suggested in 1943 that the mind constructs "small-scale models" of reality when trying to anticipate events. ✔ The image of the world around us, which we carry in our head, is just a model. Nobody in his head imagines all the world, government or country. He has only selected concepts, and relationships between them, and uses those to represent the real system. Jay Wright Forrester, 1971. "Deep Blue" could not think. But it was stored with information about the chess board, and the rules for moving chess pieces. One example is self-driven cars. They can combine pre-programmed information with information they collect while they learn how to drive. Theory of Mind is a term from psychology about an individual's capacity for empathy and understanding of others. One of the abilities language users have, is to communicate about things that are not concrete, like needs, ideas, or concepts. Simon Baron-Cohen, British psychologist and professor at the University of Cambridge, argues (1999) that "Theory of Mind" must have preceded languages, based on knowledge about early human activities: In psychology, "Theory of Mind" means that people have thoughts, feelings and emotions that affect their behavior. Future AI systems must learn to understand that everyone (both people and AI objects) have thoughts and feelings. We can not construct this software before we know much more about the human brain, memory, and intelligence. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com'''
