full_description = "W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. AngularJS applications usually have a data model. The data model is a collection of data available for the application. You can use the ng-bind directive, which will bind the innerHTML of the element to the specified model property: Use the ng-model directive to bind data from the model to the view on HTML controls (input, select, textarea) When data in the model changes, the view reflects the change, and when data in the view changes, the model is updated as well. This happens immediately and automatically, which makes sure that the model and the view is updated at all times. Applications in AngularJS are controlled by controllers. Read about controllers in the AngularJS Controllers chapter. Because of the immediate synchronization of the model and the view, the controller can be completely separated from the view, and simply concentrate on the model data. Thanks to the data binding in AngularJS, the view will reflect any changes made in the controller. If you want to use W3Schools services as an educational institution, team or enterprise, send us an e-mail:sales@w3schools.com If you want to report an error, or if you want to make a suggestion, send us an e-mail:help@w3schools.com"
