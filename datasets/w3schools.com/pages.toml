["https://w3schools.com/accessibility/accessibility_errors.php"]
title = "Accessibility Errors"
description = "W3Schools offers free online tutorials, references and exercises in all the major languages of the web. Covering popular subjects like HTML, CSS, JavaScript, Python, SQL, Java, and many, many more."
full_description = 'W3Schools offers a wide range of services and products for beginners and professionals, helping millions of people everyday to learn and master new skills. Everyone make mistakes. When we do, we need to understand why we have failed, to be able to correct ourselves. An accessible form needs error messages that is perceivable and understandable for people who is color blind, who is blind or low vision, and people with limited cognitive abilities. The error message is written in text, in addition to a warning icon and red border. Three different indicators makes this error situation clear to the user. Only an icon and a red border would not have been sufficient for all users to understand. Design elements near each other are perceived as related, while elements spaced apart are perceived as belonging to separate groups. Design elements near each other are perceived as related, while elements spaced apart are perceived as belonging to separate groups. In this example the errors are close to the failing fields. In combination with a big margin between the fields, it is easy to understand where the error messages belongs. In our first example the error "Your first name must have at least two letters and no unusual characters" is informative. It is written in a human language. It can be improved, written even more precise: The more precise, the better. This means that the system needs more error messages for different situations. Be pragmatic when deciding how many different error messages and situations you will create. Ask the users if they understand what is wrong. If not, write the error more precise. <p id="firstName-length-error" role="alert">Your first name must have at least two letters and no unusual characters</p> The error has the role alert. This is good. It would make a screen reader read out the content, even though it is not in focus. The error message is not assosiated with the field. This can be done using the aria-describedby attribute. The value is the ID of the error message.'
