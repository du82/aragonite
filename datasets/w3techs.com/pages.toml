["https://w3techs.com/blog/entry/web_technologies_of_the_year_2023"]
title = "Web Technologies of the Year 2023"
full_description = "To identify the winners in the various web technology categories, we compared the number of sites using a technology on January 1st, 2023 with the corresponding number on January 1st, 2024. We use the difference of these numbers, rather than a percentage, because that would favor technologies with a tiny user base at the beginning of the year. As in all our surveys, we focus on the relevant web, see technology surveys for more details. Elementor is a website builder based on WordPress. WordPress itself is not in our top 3 this year, because growing further becomes really hard once you reach well over 60% market share. Elementor's 9.5% market share is significantly higher than any other CMS besides WordPress, and just ahead of second ranked WooCommerce, the WordPress-based e-commerce platform with 9.0% market share. Shopify comes in third this year. 2023 Elementor 2022 Wix 2021 WordPress 2020 WordPress 2019 WordPress 2018 WordPress 2017 WordPress 2016 WordPress 2015 WordPress 2014 WordPress 2013 WordPress 2012 WordPress 2011 WordPress 2010 WordPress JavaScript is the web programming language of the year for the first time. JavaScript is, of course, not new to the game, but it is now growing faster than other languages. Second ranked Ruby has been winning that category four times in that past, and is still growing strongly. The third rank goes to Scala. 2023 JavaScript 2022 Java 2021 Ruby 2020 Ruby 2019 Ruby 2018 Ruby 2017 PHP 2016 PHP 2015 Java 2014 PHP 2013 PHP 2012 PHP 2011 PHP 2010 PHP Underscore is our JavaScript library of the year for the third time in a row. React comes second, ahead of UIkit. 2023 Underscore 2022 Underscore 2021 Underscore 2020 jQuery 2019 Bootstrap 2018 Bootstrap 2017 Bootstrap 2016 Bootstrap 2015 jQuery 2014 jQuery 2013 jQuery 2012 jQuery 2011 jQuery Tailwind is our first winner in the CSS framework category. The front-end framework UIkit also scores in this category, ahead of third ranked Material Design Lite. LiteSpeed is the web server of the year for a second time after 2019. The Cloudflare Server at rank two benefits from the popularity of the Cloudflare CDN. Node.js can repeat its third rank from the last two years."
year_published = 2025
