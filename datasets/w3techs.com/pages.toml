["https://w3techs.com/blog/entry/web_technologies_of_the_year_2022"]
title = "Web Technologies of the Year 2022"
full_description = "To identify the winners in the various web technology categories, we compared the number of sites using a technology on January 1st, 2022 with the corresponding number on January 1st, 2023. We use the difference of these numbers, rather than a percentage, because that would favor technologies with a tiny user base at the beginning of the year. As in all our surveys, we focus on the relevant web, see technology surveys for more details. Wix usage numbers went up from 1.9% of all websites to 2.4% in just one year, growing faster than any other CMS. WordPress gained this title in the last 12 years, but growing further becomes really hard once you reach well over 60% market share. PrestaShop is a little surprise as the second-fastest growing CMS. As a well-established system, its usage rate went up to 0.70% from 0.46% one year ago. The third ranked Squarespace is another example of the strong trend towards hosted content management systems. 2022 Wix 2021 WordPress 2020 WordPress 2019 WordPress 2018 WordPress 2017 WordPress 2016 WordPress 2015 WordPress 2014 WordPress 2013 WordPress 2012 WordPress 2011 WordPress 2010 WordPress Java is the web programming language of the year after winning the title already in 2015. Java, as well as the second-ranked Scala, are general-purpose languages, that make an impact also on web development. The third rank goes to static sites. We rank them in the programming language category, because the fact that no language is executed when fetching these sites is a significant data point in that context, and it's growing in popularity. 2022 Java 2021 Ruby 2020 Ruby 2019 Ruby 2018 Ruby 2017 PHP 2016 PHP 2015 Java 2014 PHP 2013 PHP 2012 PHP 2011 PHP 2010 PHP Underscore is our JavaScript library of the year for the second time in a row. It is now used by almost 9% of all websites. Angular comes second, ahead of React. 2022 Underscore 2021 Underscore 2020 jQuery 2019 Bootstrap 2018 Bootstrap 2017 Bootstrap 2016 Bootstrap 2015 jQuery 2014 jQuery 2013 jQuery 2012 jQuery 2011 jQuery"
