["https://w3techs.com/quality/alert/20"]
title = "Website Quality Alert - Title declaration before character encoding declaration"
full_description = '''The character encoding for the web page is defined in an HTML meta tag, but that meta tag appears only after the title of the web page is defined. It is recommended that meta tags are defined before any visible text in the HTML head. <title>Pelé was a fine footballer</title> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <title>Pelé was a fine footballer</title> We do not show this alert when the encoding has been defined in the HTTP header or in the XML header, or when there are only ASCII characters in the title. Browsers may have difficulties showing the title of the page correctly. In the example above, the title may be displayed as "Pel♦ was a fine footballer", or something similar. Although most modern browsers would try to apply the encoding before the declaration, one should keep in mind that the web is more and more surfed using devices such as mobile phones, game consoles or TV sets, which may have less capable and error tolerant browsers. Additionally, search engines may not recognize the title of the page correctly, so that people interested in your site's topics may not find it.'''
