["https://w3techs.com/blog/entry/trend_analysis_reports"]
title = "Trend Analysis Reports"
full_description = "A new section in our W3Techs reports shows the changes in the usage of technologies caused by changes in the market shares of geographical regions. This gives additional insights into why technologies are increasing or decreasing their global market shares. Nuvemshop is an e-commerce platform popular in South America. It has roughly doubled its popularity in the last year. The proportion of South American sites within the entire internet has also grown during that time period. The question now is, can the increase of Nuvemshop be attributed to this alone, or is there more behind it? This is a type of question, that our new trend analysis report is able to answer. It turns out, that Nuvemshop has increased its market share primarily on .br sites (Brazil). That was expected. But the increase of Nuvemshop is significantly higher than just the increase of .br sites would suggest. That means, they have also increased their share within the Brazilian market. They have a bigger market share of a bigger market. Looking at the numbers, we see this: If the internet had exactly 1 million sites, then there would be around 800 more Brazilian Nuvemshop sites than last year (0.08% of the internet, in slightly more mathematical terms). Around 300 of them can be explained by the increase of .br sites, and around 500 are caused by the increase of the local market share in Brazil. The situation in Argentina is very similar, with somewhat smaller numbers. Nuvemshop also gained among .com sites. However, the global market share of .com sites is shrinking (mainly caused by all the new generic top level domains). This shrinking market of .com sites would explain a loss of around 20 sites for Nuvemshop (in our internet consisting of 1m sites). But they have gained 210 sites based on an increased market share on .com sites, so their overall gain is 190 sites in that market. Now, let's have a look at the WordPress trend analysis for comparison: WordPress also has gained more sites in Brazil than anywhere else, around 5100 sites. But the increase of the Brazilian market would have caused an increase of 5300 sites. WordPress has lost around 200 sites due to the decrease of their Brazilian market share. They have also benefited significantly from the growing Brazilian market, but they were a little bit outpaced by their competitors in that market, and certainly Nuvemshop plays a role here. We can see in our technology change report, that more sites switch from WordPress to Nuvemshop than the other way around."
year_published = 2025
