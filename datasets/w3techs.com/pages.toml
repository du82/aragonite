full_description = "A web server reports this error when a visitor requests a web page that doesn't exist. This happens often for inner pages, when outdated or incorrect links exist somewhere on the Internet. It is, however, a sign of a severe misconfiguration if the homepage of a site doesn't exist. The site is not properly usable for visitors, because they would always expect to be able to enter the site via the homepage and to return to the homepage during a visit. Make sure the homepage always contains some useful information, even while the site is down for maintenance or under construction."
