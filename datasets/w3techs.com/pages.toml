full_description = "The character encoding defined for the web page is incorrect, that means it is different to the actual encoding used for the page. We always try to verify the encoding. Sometimes, the correct encoding can be detected by analyzing the combination of character codes we find on the page. Although most modern browsers would also try to automatically detect the correct encoding, they may not always succeed. Also, one should keep in mind that the web is more and more surfed using devices such as mobile phones, game consoles or TV sets, which may have less capable and error tolerant browsers. Additionally, search engines may not recognize the text of your pages correctly, so that people interested in your site's topics may not find it."
