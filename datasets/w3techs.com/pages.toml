["https://w3techs.com/quality/alert/31"]
title = "Website Quality Alert - Incorrect server time"
full_description = "Like every computer, a web server uses an internal clock to keep track of the current time. The setting of this clock was found to be incorrect. Several concepts on the web, such as page caching and cookie expiration, depend on a correct time to be set. These techniques may not work as expected with an incorrect server time. Additionally, visitors may be confused when they see wrong time stamps on items such as blog or forum entries. Make sure the time and time zone are set correctly at the server. Ideally, use one of the internet time servers for automatic time synchronization."
