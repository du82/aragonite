["https://w3techs.com/blog/entry/web_technologies_of_the_year_2024"]
title = "Web Technologies of the Year 2024"
full_description = "To identify the winners in the various web technology categories, we compared the number of sites using a technology on January 1st, 2024 with the corresponding number on January 1st, 2025. We use the difference of these numbers, rather than a percentage, because that would favor technologies with a tiny user base at the beginning of the year. As in all our surveys, we focus on the relevant web, see technology surveys for more details. Elementor, a website builder based on WordPress could repeat its victory from last year by increasing its market share from 9.5% to an impressive 11.7%. Last years title caused quite a bit of discussion, as people pointed out that Elementor is merely a WordPress plugin and should not be counted as CMS. At W3Techs, we use a most generous definition of CMS: it is any tool that may be used to manage the content of a website. For example, editors, that support generating HTML pages are often used to build websites, so we include them as CMS, although, many people would use a more restricted definition of that term. We see Elementor as website builder in competition with other website builders, that happen to be WordPress-based or not. As such, we think it makes sense to measure and compare the market shares of these tools. To avoid more confusion, we called it Content Management Tool of the Year. 2024 Elementor 2023 Elementor 2022 Wix 2021 WordPress 2020 WordPress 2019 WordPress 2018 WordPress 2017 WordPress 2016 WordPress 2015 WordPress 2014 WordPress 2013 WordPress 2012 WordPress 2011 WordPress 2010 WordPress JavaScript is the web programming language of the year for the second time in a row. It is now used by 4% of all websites, up from 3.1% one year ago. Second ranked Scala benefits from its use at Wix, just like third-ranked Ruby benefits by its use at Shopify and other popular systems. 2024 JavaScript 2023 JavaScript 2022 Java 2021 Ruby 2020 Ruby 2019 Ruby 2018 Ruby 2017 PHP 2016 PHP 2015 Java 2014 PHP 2013 PHP 2012 PHP 2011 PHP 2010 PHP"
