["https://w3techs.com/blog/category/news"]
title = "News Blog"
full_description = 'A new section in our W3Techs reports shows the changes in the usage of technologies caused by changes in the market shares of geographical regions. This gives additional insights into why technologies are increasing or decreasing their global market shares. We used to use the Alexa ranking as a basis of the samples for our surveys. With the end of service for this ranking we were forced to look for alternatives. Our solution is using our definition of the relevant web. For the first time since we started our surveys in 2009, Apache has lost the first spot as the most popular web server to Nginx. The incredible success story of WordPress continues by reaching another milestone: 2 out of every 5 websites use it now. WordPress, Joomla and Drupal used to be the "big 3" content management systems on the web. Now, that order has been disrupted by Shopify passing Joomla and Drupal to become the #2 CMS. In addition to our surveys on web hosting providers, we just added a category showing whose data centers websites are using. A DNS (domain name system) server manages internet domain names and their associated records such as IP addresses. Each website needs one or more DNS servers to provide this information for their domain in order to be accessible. Our new surveys show which are the most popular providers of DNS servers. We have reached a tipping point where encrypted transmission of web pages becomes more common than unencrypted transmission. Squarespace is now used by 1.3% of all websites, up from 0.7% a year ago. This makes it the 4th most popular CMS after WordPress, Joomla and Drupal. We look at the statistics behind this success. WordPress as the most used content management system has created an impressive ecosystem around itself. That consists of hundreds of thousands developers and companies working with WordPress, hundreds of WordPress-related events organized around the world, and tens of thousands plugins developed on top of its core. We have a closer look at some statistics of the most important plugins.'
