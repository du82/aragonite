["https://w3techs.com/faq"]
title = "Frequenty Asked Questions"
full_description = "Primarily, we use information provided by the site itself when downloading web pages. In other words, we fetch web pages very much like a search engine, and analyze the results. Additionally, we use publicly available information from sources such as Tranco, Google, Microsoft and ipinfo.io. We search for specific patterns in the web pages that identify the usage of technologies, similarly to the way a virus scanner searches for patterns in a file to identify viruses. We use a combination of regular expressions and DOM traversal for this search. We have identified several thousand indicators for technology usage. These indicators have different priorities, and based on the presence or absence of specific combinations of indicators in a specific context, we come to our conclusions. Additionally, we exploit dependencies between technologies. For example, if we find a WordPress site, we know that it is using PHP. A fair share of our data is based on such dependencies. A lot of research was necessary to build the analyzer, and we keep improving it all the time. We want it to be the best possible website analyzer. It is impossible for this type of surveys to be 100% accurate, since websites can choose to hide most of their technologies, if they want to. See also our disclaimer for some more information. There is no way to be absolutely sure not to get some errors in the technology identification. We try to find ways to balance the false-positives and the false-negatives (after eliminating as many as possible), and we try to make sure that none of the remaining errors are clustering on one technology rather than another. Our goal is to provide the most accurate and reliable web technology surveys, so that the answer to this question would be: it is as accurate as one can possibly get. We believe that we are not too far away from that goal. All reports on our website are updated daily. Although we don't analyze every site every day (see above), we permanently add new information into our database, and we want new trends to be visible as quickly as possible. The much more extensive technology market reports are generated monthly."
year_published = 2025
