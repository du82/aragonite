full_description = 'WordPress gains more sites from Joomla than from any other CMS, and loses more sites to Shopify than to any other CMS. The incredible success story of WordPress continues by reaching another milestone: 2 out of every 5 websites use it now. WordPress has 82.4% CMS market share among websites in Japanese, whereas it has "only" 43.9% market share among sites in German. Less than 5 months after its release, WordPress version 5 has become the most used WordPress version. One third of all websites are now based on WordPress. This is more than all the other content management systems combined. WordPress as the most used content management system has created an impressive ecosystem around itself. That consists of hundreds of thousands developers and companies working with WordPress, hundreds of WordPress-related events organized around the world, and tens of thousands plugins developed on top of its core. We have a closer look at some statistics of the most important plugins. The most popular content management systems now runs a quarter of the web. We have a closer look at the detailed statistics behind that success. The most popular content management system in the world keeps gaining popularity, and now powers 20% of the web. W3Techs presents a world map showing which content management system is the most popular one in each country. Changes in the usage of the Big 3 content management systems in one year: WordPress +2.0% Joomla +0.1% Drupal +0.4% Usage of Blogger is rising, but many websites switch to WordPress afterwards. Looks like Blogger is the entry-level CMS. The web analytics market share on WordPress sites is 16% for WordPress Stats and 83% for Google Analytics. The most popular WordPress version is 3.2, only released in July. No other CMS is faster in deploying new versions. PHP Link Directory ranks second in the survey of content management systems on .info sites, only behind WordPress. With 16% market share, vBulletin is the #2 content management system amongst the top 10,000 sites, only behind WordPress.'
