full_description = "software gestaltung für komplexe aufgaben Wir arbeiten nach dem Motto: Show, don’t tell. Schneller bei besseren Lösungen ankommen, statt unnützer Berge an abstrakter Dokumentation. Ab der groben Idee ins Konkrete gehen. Damit Software Lösung wird, um Komplexität zu meistern. Da ruft uns die Deutsche Telekom an und erzählt, das Design bekam Applaus von den Mitarbeitern. Und wir tanzen als würde niemand zusehen. zeig'smir. Komplexe Aufgaben durch gutes Design meistern Für spezialisierte Aufgaben gibt es keine Lösung von der Stange. Wenn die Aufgaben der Mitarbeiter komplex sind, sollte die Software es einfacher, schneller und besser machen. Häufig ist das Gegenteil der Fall. Wir starten mit einer Idee. Je nach Projekt haben wir bereits nach vier Wochen einen ersten Prototyp. Mit diesem Prototyp tritt die Anforderungs-Findung aus dem Abstrakten heraus. Es wird für alle greifbar. Vorstellungsabweichungen und Lücken werden frühzeitig identifiziert. Wir nennen das … design-driven evolution Alles, was wir in über 15 Jahren Firmengeschichte gelernt haben, fließt in unsere agile Methode ein. So vereinen wir Design, Psychologie und Technologie in eine praktisch orientierte zero BS Methode, und kommen schneller zu besseren Lösungen. Echt agil, ohne unproduktive Prozess-Schritte, setzen wir die Anwendung um. Alleine – oder mit großen Entwicklungsteams unserer Kunden. Für mich eine klare Forderung: Ohne Wahnsinn mache ich es nicht. Alexander Hemmerling,Telekom Bessere Anwendungen gestalten Mitarbeiter befähigen. Fehlerquellen reduzieren. Komplexe Aufgaben beschleunigen. Prozesse verständlicher machen. Einfachheit im Komplexen finden. Mit unserem erprobten design-driven evolution Ansatz durften wir unter anderem internationalen Automotive-Konzernen, AI gestützten Healthcare-Startups sowie traditionsbewussten Mittelständern helfen. Nötige Komplexität wurde von der unnötigen getrennt. Auszeichnungen wurden gewonnen und Projektleiter befördert. Ausgezeichnet. So macht die Zusammenarbeit Freude. Da ist die Vision und los. Wenn der Kunde deinen Welpen der Problemlösung frei lässt und wir uns mit überschwänglicher Freude in eine Fragestellung stürzen. Aus Komplexität entsteht Klarheit und der mehrfach ausgezeichnete Ströer Marketplace. zeig'smir. Zuverlässig, kompetent. Exzellent, was sie machen. Heben sich ab und denken weiter. Tim Bardon,Ströer Ausgezeichnet, was man erreicht, wenn der Kunde einem freie Hand lässt. Ganz unparteiisch gesprochen, war das eine gute Entscheidung. Das besteDesign der Welt Vom bescheidensten Team aller Zeiten: Alex, Christoph, Sebastian, Christian, Arne, David, Christian, Jonas, Kerstin, Wahn & Sinn. Die Gründer, Alex und Chris, wurden 2005 Freunde während des Studiums der Wirt­schafts­psycho­logie in Köln. Jahre vor dieser Begegnung arbeiteten beide schon im Digitalen, in Kommunikation, Entwicklung und Design. Am Ende des Studiums war klar, Alex und Chris wollten die fruchtbare Zusammen­arbeit fortführen. Also gemeinsam gründen. Heute vereinen sie außer­gewöhnlich tolle und facetten­reiche Experten. Mit uns arbeiten Design-driven Evolution bringt uns durch Expansion und Editierung ans Ziel. Bei unserem agilen Gestaltungs­ansatz geht es immer um Ergebnisse. Vom ersten Schritt zur Lösung Wir erschaffen in wenigen Wochen den ersten Prototyp. Dieser ist möglichst konkret und leitet eine Reihe von weiteren Feedback-Zyklen an, um uns am Ende zur Lösung zu führen. Der erste Zyklus Das leere Blatt, die Idee, steht am Anfang aller großen Dinge. Wir beginnen im zwei­stündigen Kickoff-Workshop Fragen zu stellen. Die Antworten auf unser „Warum?“ führen uns zu einer ersten Hypothese, einem Prototypen. Dieser bringt Konkretes und damit Klarheit. Ein klares „Ja“ hier, ein „Nein“ dort, ein „Jein“ oder ein „Vielleicht“. Alle Antworten führen uns zu neuen Hypothesen. Die hieraus gewonnen Klarheiten arbeiten wir immer mehr ins finale Werk ein. Schnell Klarheit finden Wieso es besser ist, schnell ins Tun zu kommen, selbst wenn noch viele Fragen offen sind? Ganz einfach: Abstraktes ist zu geduldig. Abstrakt vs. Konkret Abstrakt ist: „Team, stellt euch mal total bewegende Musik vor.“ Unbewusst füllen alle die Lücken auf, stellen sich ein Ideal vor, über­springen unklare Punkte auf dem Weg. Das gleiche Wort meint für den Kollegen etwas anderes oder fast das gleiche, nur in einem wichtigen Punkt eben nicht. Solange sich jeder abstrakt seine bewegende Musik vorstellen kann, fallen Lücken und Vor­stellungs­ab­weichungen nicht auf. Konkret ist, dem Team statt­dessen ein Lied vorzuspielen. Konkret bringt Unklarheit ans Licht, wo Abstrakt geduldig wäre. So bringt unsere agile Methode schneller zu besser passenden Lösungen Ganz nah an unserem Herzen. Wenn Du jemanden liebst und ein letztes “ich liebe dich” sagen könntest. Was würde dir das bedeuten? Nachlass digital besser organisieren. Ein toller Kunde und ein bedeutendes Projekt. Und dann gab's auch noch einen Red Dot dafür. cloudoflegacy.com Unser Design für Cloud of Legacy hat den Red Dot Design Award 2022 in der Kategorie Digital Solutions gewonnen. Wir waren selber ganz schön aus dem Häuschen. Und noch besser: danach kam der German Design Award oben drauf. Eure Obsession Software besser zu machen und dabei herausragende Fähigkeiten mitzubringen, macht Wahnsinn zu super Partnern. Und ums ganz schlimm zu machen, seid ihr auch noch wunderbare Menschen. Uwe Böhler,Geschäftsführer du und wir? Vielleicht. Melde dich gerne für einen Schnack. Melde dich: der@wahnsinn.design oder 0221 94 65 29 10 Gespräch: Können und wollen wir helfen? Angebot: In sieben Tagen hast du einen Preis, ein Timing und unseren vorläufigen Plan. Möchtest du mit uns Besseres schaffen? Perfekt! Kunden, die wir lieben. In unseren mehr als 15 Jahren hatten wir die Ehre sowie das Glück, Partner, Kunden und Kollegen kennen­zu­lernen, die wirklich großes Kino sind. Danke! blauarbeit, daimler, netcologne, stellantis, via ebay, sieper, t‑systems, intergenia, ergo direkt, g