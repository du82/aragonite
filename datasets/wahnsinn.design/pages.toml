full_description = "Digitale Technik steht zu oft zwischen Berater und Kunden. Persönliche Distanz wird erhöht. Es werden Standards verkauft. Fehler in Software & Benutzung verwirren oder langweilen die Kunden … Sag Hallo zum Pencil Selling: Es werden die persönlichen Wünsche des Kunden aufgenommen und respektiert. Berater und Kunden schauen gemeinsam auf das Tablet, die Bedienung ist intuitiv, die Darstellung freundlich, groß und übersichtlich. Es entstehen persönliche Beziehungen und individuelle Angebote. Bei der Einführung gab es Applaus; für die GF ist es ein Prestigeprojekt und sogar den Telekom-Kunden gefällt die Interaktion mit Beratern und der Software. Das ist selten im Konzern und unser Kunde ist stolz darauf:"
