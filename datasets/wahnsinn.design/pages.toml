title = "wahnsinn: datenschutz"
description = "Unsere Erklärung zum Datenschutz. Hallo Fremder. Kehre um, bevor es zu spät ist."
full_description = "I. Allgemeines Du befindest Dich auf der Website der Wahnsinn Design GmbH, Oskar-Jäger-Straße 173, 50825 Köln, Handelsregister HRB 63774, Amtsgericht Köln (nachfolgend „Wahnsinn“ genannt). Herzlich Willkommen! Die Verwendung der Du-Ansprache dient dazu, diese Datenschutzerklärung zugänglicher und nahbarer zu machen. Solltest Du nicht wünschen, in diesem Text mit „Du“ angesprochen zu werden, schicken wir Dir gerne eine mit „Sie“-Ansprache formulierte Version per Fax zu. Gerne wollen wir hier alle Nutzer/Besucher über den Datenschutz personenbezogener Daten informieren. Ob und wenn ja, welche und in welcher Form Daten erhoben werden und wie wir diese verwenden. Als personenbezogene Daten gelten sämtliche Informationen, welche dazu dienen, Deine Person zu bestimmen und welche, die zu Dir zurückverfolgt werden können – also beispielsweise Dein Name, Deine E-Mail-Adresse und Telefonnummer, Pagernummer, Faxnummer etc. Definitionen der verwendeten Begriffe (z.B. “personenbezogene Daten” oder “Verarbeitung”) finden sich in Art. 4 DSGVO. Wir nehmen Datenschutz ernst und behandeln personenbezogene Daten vertraulich und entsprechend der gesetzlichen Vorschriften. Wegen Erweiterung der Website, des technologischen Wandels und damit verbundener Änderungen in diesem Text schlagen wir vor, dass Du regelmäßig und häufiger mal vorbeischaust, um Dir diesen Text ganz genau durchzulesen. Dies ist absolut nicht ironisch gemeint. Solltest Du Fragen zu dieser Datenschutzerklärung haben, kannst Du Dich jederzeit gerne an uns wenden. Die Kontaktdaten finden sich nachfolgend. II. Name und Kontaktdaten des für die Verarbeitung Verantwortlichen Diese Datenschutzerklärung gilt für die Datenverarbeitung durch Wahnsinn auf der Internetseite www.wahnsinn.design. Da wir nicht mindestens 20 oder mehr Personen mit der Erhebung, Verarbeitung oder Nutzung der Daten beschäftigen und wir personenbezogene Daten nicht automatisiert verarbeiten, benötigen wir keinen Datenschutzbeauftragten. Du kannst dich aber jederzeit an unseren Geschäftsführer wenden: Alexander J. Hachmann, Geschäftsführer Wahnsinn Design GmbH, datenschutz@wahnsinn.design, 0221 94 65 29 10 III. Zwecke der Datenverarbeitung, Rechtsgrundlagen und berechtigte Interessen, die von Wahnsinn oder einem Dritten verfolgt werden, sowie Kategorien von Empfängern 1. Surfen auf dieser Internetseite Wir, der Anbieter dieser, unserer Internetseite, erheben aufgrund unseres berechtigten Interesses (s. Art. 6 Abs. 1 lit. f. DSGVO) Daten über Zugriffe auf die Website und speichern diese als „Server-Logfiles“ auf dem Server der Website ab. Folgende Daten werden so protokolliert: Besuchte Website Uhrzeit zum Zeitpunkt des Zugriffes Menge der gesendeten Daten in Byte Quelle/Verweis, von welchem Du auf die Seite kamst Verwendeter Browser Verwendetes Betriebssystem Verwendete IP-Adresse des zugreifenden Rechners Warum wir diese speichern? Zur Gewährleistung eines reibungslosen Verbindungsaufbaus, einer komfortablen Nutzung unserer Website und zur Auswertung der Systemsicherheit und -stabilität. Die Server-Logfiles werden für maximal 7 Tage gespeichert und anschließend gelöscht. Die Speicherung der Daten erfolgt auch aus Sicherheitsgründen, um z. B. Missbrauchsfälle aufklären zu können. Müssen Daten aus Beweisgründen aufgehoben werden, sind sie so lange von der Löschung ausgenommen, bis der Vorfall endgültig geklärt ist. An dieser Stelle noch der Hinweis, dass uns aus den erhobenen Daten keine Rückschlüsse auf Deine Identität möglich sind und diese durch uns auch nicht gezogen werden. 2. Reichweitenmessung & Cookies Diese Website verwendet keine Cookies oder andere Methoden zur pseudonymisierten Reichweitenmessung. Falls Du Interesse hast, Kekse (essbare Cookies) mit einem leckeren Kaffee bei uns im Büro zu genießen und über ein tolles neues Projekt zu sprechen, schreib uns gerne eine E-Mail an cookies@wahnsinn.design. 3. Erfassung und Verarbeitung personenbezogener Daten Diese Website erhebt überhaupt keine personenbezogenen Daten, wie Name, Telefonnummer oder E-Mail-Adressen. Du kannst die Website überhaupt nicht in einer Art verwenden, so dass wir solche Daten von Dir in Erfahrung bringen, außer Du schreibst uns eine E-Mail und gibst entsprechende Daten an uns weiter, oder Du rufst uns an und teilst uns mit, dass du gerade auf unserer Webseite bist, wie Du heißt etc … Ansonsten haben wir keine Ahnung, wer du bist. Aber schön, dass du hier bist und Kudos, dass Du Dir diesen Text auch noch durchliest. Wie oben beschrieben werden in den Logfiles IP-Adressen gespeichert. Dies sagt aber grundsätzlich nichts über Dich als individuelle Person aus und diese Information ist auch so gut wie nicht dazu geeignet, über Dich als Person Rückschlüsse zu ziehen und, wie ebenfalls bereits erwähnt, werden wir zu keinem Zeitpunkt versuchen, und haben auch gar kein Interesse daran, diese Daten dazu zu nutzen. Da wir auf der Website keine personenbezogenen Daten erheben, können wir diese auch niemandem weitergeben oder diese selbst nutzen. Denn durch den reinen Besuch dieser Website wissen wir überhaupt nicht, wer du bist. Wir erfahren vermutlich nie, dass Du gerade auf unserer Website bist. Wenn Du uns anrufst oder uns eine E-Mail schickst, würden wir natürlich so in Besitz der Daten, durch und nur durch Deine aktive Kommunikation mit uns, gelangen. Daten, welche Du Wahnsinn durch z.B. eine E-Mail selber zur Verfügung gestellt hast, werden gespeichert und verarbeitet. Evtl. möchtest du ja mit uns zusammenarbeiten. Grundsätzlich solltest du uns vor allem aus diesem Grund anschreiben – oder wegen Keksen (siehe oben). Wenn du durch Veröffentlichung deiner Daten, z.B. auf Deiner eigenen Website oder auf Netzwerken wie LinkedIn, Daten zur Verfügung gestellt hast, könnte es sein, dass wir dich zuerst kontaktiert haben. Das machen wir nur, wenn dies in Deinem Interesse ist oder wir vermuten können, dass dies in Deinem Interesse ist, z.B. weil wir von Deiner Bäckerei Kekse bestellen möchten. Durch reines Besuchen dieser Website haben wir aber, wie gesagt, keinerlei direkte personenbezogene Daten. Die Verarbeitung der personenbezogenen Daten, welche Du uns aktiv zur Verfügung gestellt haben musst, da wir ja ohne Dein Zutun nicht wissen, wer Du bist, werden wir nur aufgrund unseres berechtigten Interesses zur Erfüllung unserer vertraglich vereinbarten Leistungen nutzen. Diese können sein, Projektanfragen zu beantworten, Angebote abzugeben, Interviews zu geben, Termine zu vereinbaren, z.B. um sich zu Kaffe und Keksen (siehe oben) zu verabreden, und was man sonst im Geschäftsleben so alles macht. Da wir ein B2B Geschäft sind, werden wir grundsätzlich unbeteiligte Privatpersonen nicht kontaktieren. Sollten wir personenbezogene Daten aktiv bekommen haben, dann gehen wir damit anständig um. Wahnsinn erhebt, nutzt und gibt Deine personenbezogenen Daten nur dann weiter, wenn dies im gesetzlichen Rahmen erlaubt ist, Du in die Datenerhebung oder Weitergabe einwilligst oder dies nötig ist, um unsere vertragliche Aufgabe zu erfüllen. Zur Verbesserung und Wartung unserer Website speichern wir jedoch (ohne Personenbezug) Deine Zugriffsdaten (siehe oben). Zu diesen Zugriffsdaten gehören z.B. die angeforderten Dateien oder der Name Deines Internet-Providers. Rückschlüsse auf Deine Person sind uns glücklicherweise dadurch nicht möglich. 4. Google Analytics & andere Daten Wie gesagt haben wir keinerlei Tool hier auf der Website. We are digitally cookie-free. 5. Umgang mit Kommentaren und Beiträgen Wir bitten Dich, davon abzusehen, Hasskommentare auf dieser Website zu hinterlassen. Du kannst auf dieser Website sowieso gar keine Kommentare hinterlassen. Wir haben dazu einfach kein Formular. Solltest Du einen Kommentar mit z.B. Edding auf Deinen Monitor schreiben, während Du auf unserer Website bist, können wir diesen technisch nicht erfassen, speichern oder weitergeben. Gerne kannst Du „Ich liebe Wahnsinn“ auf Deinen Monitor schreiben, doch leider werden wir das auch nie erfahren, da diese Information, wie bereits beschrieben, nicht bei uns landen kann. So funktioniert die Welt nicht. Es sei denn Du fotografierst das Kunstwerk und schickst uns eine Mail oder bringst das entsprechende Foto zu Kaffee und Keksen mit zu uns. 6. Newsletter-Abonnement Wir verschicken grundsätzlich keine Newsletter, da uns diese selbst total auf den Keks gehen und wir niemanden nerven wollen. Neben Spam sind Newsletter wirklich etwas, auf das man verzichten könnte – also als Menschheit insgesamt. Deshalb kann man sich bei uns auch nicht in einen Newsletter-Verteiler eintragen. Newsletter sind standardisierte Informations- oder Werbemails, die an einen größeren Personenkreis verschickt werden. E-Mails, die wir verschicken, verschicken wir grundsätzlich an Leute, die wir persönlich kennen oder die uns geschrieben haben. Dies erfolgt individuell oder in einem sehr kleinen Personenkreis. Dir, wenn du hier einfach nur auf der Internetseite bist, einfach so eine Mail zu schicken, ist uns rein physikalisch nicht möglich. Für Kaffee und Kekse wirst du uns also proaktiv kontaktieren müssen. 7. Bewerbung bei Wahnsinn Mit der Übermittlung Deiner Bewerbung gestattest Du uns, Deine Bewerbungsunterlagen für das Bewerbungsverfahren zu speichern und zu nutzen. Rechtsgrundlage hierfür ist Art. 6 Abs. 1 lit. a DSGVO. Deine Daten werden streng vertraulich behandelt. Personenbezogene Daten werden ausschließlich den am Bewerbungsverfahren beteiligten Mitarbeitern zugänglich gemacht. Deine Daten werden auf unbestimmte Zeit gespeichert, um Dir erneut ein Angebot für einen Job oder ein Praktikum zu schicken, falls sich wieder eine Stelle ergibt. Dein Einverständnis zur Speicherung und Verarbeitung Deiner Bewerbungsdaten kannst Du jederzeit mit Wirkung für die Zukunft per E-Mail an datenschutz@wahnsinn.design widerrufen und die Daten löschen lassen. Wir werden dann alle im Rahmen des Bewerbungsverfahrens an uns übermittelten Daten löschen, soweit wir nicht aufgrund gesetzlicher Vorschriften zur Aufbewahrung berechtigt und/oder verpflichtet sind. 8. Umgang mit Kontaktdaten Nimmst Du mit uns als Websitebetreiber durch die angebotenen Kontaktmöglichkeiten (aktuell Telefon oder E-Mail) Verbindung auf, werden Deine Angaben gespeichert, damit auf diese zur Bearbeitung und Beantwortung Deiner Anfrage zurückgegriffen werden kann. 9. Speicherung ggf. außerhalb der EU Solltest Du uns aktiv Daten übermitteln, kann es sein, dass, neben der lokalen Speicherung auf dem jeweiligen Rechner des Mitarbeiters, Deine Daten bei sogenannten Cloud-Services gespeichert werden. Dies schließt z.B. Apple iCloud sowie Dropbox mit ein. Daten bei diesen Anbietern sind grundsätzlich verschlüsselt und können nicht durch Dritte eingesehen werden (https://support.apple.com/de-de/HT202303). Es kann aber sein, dass somit Deine Daten außerhalb der EU gespeichert werden. Der Anbieter Dropbox sichert laut eigenen Angaben seit geraumer Zeit alle Daten auf Servern innerhalb der EU. Wenn Du weitere Informationen dazu möchtest, findest du hier die entsprechenden Links dazu: https://www.dropbox.com/de/privacy https://www.apple.com/legal/privacy/de-ww/ https://www.apple.com/legal/internet-services/icloud/de/terms.html https://slack.com/intl/de-de/privacy-policy https://toggl.com/legal/privacy/ Die Einverständniserklärung zur Speicherung und Verarbeitung Deiner Daten kannst Du jederzeit mit Wirkung für die Zukunft per E-Mail an datenschutz@wahnsinn.design widerrufen und die Daten löschen lassen. 10. Nutzung von Social-Media-Plugins von Facebook etc. Wir verwenden auf dieser Website keine Social-Media-Plugins. Wenn Du uns mitteilen möchtest, dass du uns wirklich cool findest, ruf uns gerne an oder schick uns einen ausgedruckten Daumenhoch an unsere Postadresse. Wenn Du anderen zeigen möchtest, wie großartig Du uns findest, empfehlen wir Dir gerne einen Tätowierer, der unser Logo perfekt beherrscht. 11. Online-Präsenzen in sozialen Medien Wir haben neben dieser Website auch Online-Präsenzen in sozialen Medien wie Twitter, Xing, LinkedIn und Youtube. Diese sind über die Anbieter selber zu erreichen und/oder sind auf entsprechenden Seiten dieser Onlinepräsenz per einfachem Link erreichbar. Wir nutzen keine Social-Media-Plugins direkt auf unserer Website (siehe oben). Wir wollen dich darauf hinweisen, dass Du diese Seiten und ihre Funktionen in eigener Verantwortung nutzt. Dies gilt insbesondere für die Nutzung interaktiver Funktionen (z.B. Kommentieren, Teilen, Bewerten). Besuchst du eine Präsenz durch Klicken auf den einfachen Link, werden ggf. personenbezogene Daten an den Anbieter des sozialen Mediums übermittelt. Der Anbieter des sozialen Mediums erfasst und verarbeitet u.a. Deine IP-Adresse, evtl. den genutzten Prozessortyp und die Browserversion samt Plugins sowie ggf. weitere Informationen. Die dabei über Dich erhobenen Daten werden vom Anbieter des sozialen Mediums verarbeitet und dabei ggf. in Länder außerhalb der Europäischen Union übertragen. Während des Besuchs einer solchen Website bist du evtl. mit Deinem persönlichen Benutzerkonto des jeweiligen Mediums eingeloggt, dies würde evtl. bedeuten, dass dieses Medium den Besuch Deinem Konto und somit Deiner Person zuordnen kann. Wenn Du dies vermeiden möchtest, solltest Du Dich vor dem Klick des einfachen Links beim Anbieter des sozialen Mediums abmelden bzw. die Funktion „angemeldet bleiben“ deaktivieren, die auf Deinem Gerät vorhandenen Cookies löschen und den Browser beenden und neu starten. Auf diese Weise werden Informationen, über die Du unmittelbar identifiziert werden kannst, gelöscht. Zweck und Umfang der Datenerhebung und die weitere Verarbeitung und Nutzung der Daten durch den Anbieter des jeweiligen sozialen Mediums sowie Deine diesbezüglichen Rechte und Einstellungsmöglichkeiten zum Schutz Deiner Privatsphäre entnimmst Du bitte den jeweiligen Datenschutzhinweisen des jeweiligen Mediums unter: Facebook: https://de-de.facebook.com/about/privacy/ Twitter: https://twitter.com/privacy?lang=de Xing: https://www.xing.com/privacy LinkedIn: https://www.linkedin.com/legal/privacy-policy Youtube: https://www.google.de/intl/de/policies/privacy/ Wahnsinn als Betreiber dieser Website erhebt und verarbeitet darüber hinaus keine Daten aus Deiner Nutzung des entsprechenden sozialen Mediums. IV. Rechte des Nutzers bzw. Deine Rechte Du hast als Nutzer/Besucher das Recht, auf Antrag eine kostenlose Auskunft darüber zu erhalten, welche personenbezogenen Daten über Dich gespeichert wurden. Du hast außerdem das Recht auf Berichtigung falscher Daten und auf die Verarbeitungseinschränkung oder Löschung Deiner personenbezogenen Daten. Falls zutreffend, kannst Du auch Dein Recht auf Datenportabilität geltend machen. Sollten Du annehmen, dass Deine Daten unrechtmäßig verarbeitet wurden, kannst Du eine Beschwerde bei der zuständigen Aufsichtsbehörde einreichen. 1. Löschung von Daten Sofern Dein Wunsch nicht mit einer gesetzlichen Pflicht zur Aufbewahrung von Daten (z. B. Vorratsdatenspeicherung) kollidiert,"
