full_description = "Alex ist der perfekte Macher: kreativ, innovativ, team­ori­en­tiert, das Ziel stets im Blick. Jan-Frederik Kremer Geschäftsführer, AiF FTK Alexander J. Hachmann Geschäftsführer & Designer Wahnsinn Design GmbH, seit 2008 Mitgründer ROOT – Privatinstitut für Kognitions- und Medien­psycho­logie, 2014 – 2016 Mitglied des Beirats Innovationsclub - AiF Forschung · Technik · Kommunikation, 2017 - 2020 Per Geistesblitz zum nächsten Einhorn Interview, Wirtschafts-Woche 2016 Technology doesn‘t matter – oder: Kann man hier klicken? Interview, DS Deutsche Startups 2011 Alex ist ein Mann, der die PS sprichwörtlich auf die Straße bringt. Ich freue mich auf jedes neue Projekt mit ihm und seiner Company. Uwe von Grafenstein MP, Kalhammer & von Grafenstein Jurymitglied - Digitale Medien Jahrbuch der Werbung, Econ Verlag, 2010 - 2012 Mentor HackathonAtHome – New Work vs. Corona, deutsch/französische Veranstaltung, 2020 Megatrend Künstliche Intelligenz, Innovationstreiber der Zukunft Podium, BVMW & AiF TFK & Friedrich-Naumann-Stiftung, Schloss Eicherhof 2018 Investition in erfolgreiche Zukunft - Gewinne durch besseres Design Publikation, GmbH-Chef 2018 Kaum bekannt aus Film und Fernsehen. Aber vielleicht aus … Was bleibt, wenn die Computer übernehmen? Vortrag zur Zukunft der Arbeit, Kl. Theater am Weingarten, Minden 2018 Niemand muss Angst vor der Technik haben Interview, Mindener Tagesblatt 2018 Jurymitglied Foresight Festival N° 5, science2public & BMBF, 2021 Digitalisierung und Zukunftsberufe Interviews, Radio KISS FM, 2021 Interactive App Design Vortrag, Parts2Talk: Mobile, Köln 2014 Alex combines compassion and competence in designing digital products. Oliver Gross Geschäftsführer, Sonett GmbH Ausbildung & Studium Wirtschafts­psychologie, Hochschule Fresenius; Kommuni­kations­wirt, WAK; Computer Science, Rheinische Friedrich-Wilhelms-Universität Bonn Dozent u.a. für Medien­psychologie, Angewandte Markt-, Werbe- und Medien­psychologie sowie Ent­scheidungs­orientiertes Management Hochschule Fresenius, Köln, Düsseldorf, Berlin, 2013 – 2017 Gastdozent zum Thema Kommunikation in der Arzt-Patient-Beziehung Medizinische Fakultät der Universität Duisburg/Essen, 2002 – 2006 Ambassador InnovatorsNet - AiF Forschung · Technik · Kommunikation, seit 2020 Alex ist eine seltene Frucht. Kompetent wie sympathisch. Dazu auch noch sehr liebenswert. Design können die Verrückten von Wahnsinn. Tim Bardon Leiter Strategie Media, Ströer Wahnsinn Design GmbH Oskar-Jäger-Straße 173 Gebäude K4 50825 Köln DE 0221 94 65 29 10 der@wahnsinn.design Geschäftsführer Alexander HachmannChristoph Kolb Umsatzsteuer DE 261 675 537 Handelsregister HRB 63774, Amtsgericht Köln Aufsichtsbehörde Stadt Köln Amt für Öffentliche Ordnung Willy-Brandt-Platz 3 50679 Köln datenschutz wird bei uns groß geschrieben, außer hier — hier schreiben wir es klein."
