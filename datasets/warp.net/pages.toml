full_description = '''Hudson Mohawke ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/10318-2.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/10318-2.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/10318-2.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/10318-2.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/10318-2.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/10318-2.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/10318-2.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Hudson Mohawke"/>Register for email updatesSubscribe to Hudson MohawkeSubscribe to WARPSubmitBiography ˇHudson Mohawke exists in a rare space in music. He is simultaneously ubiquitous and guarded, recondite and unmistakable. Though his style adapts and adheres to whatever musical form requires it, his distinct and self-referencing postmodern sonic hallmarks have made him an omnipresent and irreplaceable part of the soundtrack of our times.Releases ˇPushing On (Always Like Never Before), single, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/402385-3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/402385-3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/402385-3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/402385-3.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/402385-3.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/402385-3.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/402385-3.jpg" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="Pushing On (Always Like Never Before)"/>Cry Sugar, album, 2022<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/309466-9.jpg