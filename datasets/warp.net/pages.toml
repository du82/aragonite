full_description = 'Evian Christ ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/26894-2.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/26894-2.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/26894-2.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/26894-2.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/26894-2.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/26894-2.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/26894-2.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Evian Christ"/>Register for email updatesSubscribe to Evian ChristSubscribe to WARPSubmitBiography ˇEvian Christ (b. Joshua Leary) is an Ellesmere Port-based musician, producer and music programmer signed to WARP and DONDA/Sony ATV Publishing. Initially finding recognition for his production contributions to Billboard-topping albums by Kanye West and Travis Scott, and subsequently as the founder of the enduringly influential TranceParty event series, Christ’s recent years have seen him lead an idiosyncratic range of projects that enquire into the legacy of Trance in contemporary cultural life. Revanchist (2023), Christ’s debut album, explores the genre’s latent potential to evoke, beyond Euphoria, the fullest feeling of the Sublime. Show MoreReleases ˇRevanchist, album, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/99afdc01-cffa-4822-9231-a32544ef6e67.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/99afdc01-cffa-4822-9231-a32544ef6e67.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/99afdc01-cffa-4822-9231-a32544ef6e67.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/99afdc01-cffa-4822-9231-a32544ef6e67.jpg 500w, https://d1rgjmn2wmqeif.clo