full_description = '''Flying Lotus ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/3746-3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/3746-3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/3746-3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/3746-3.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/3746-3.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/3746-3.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/3746-3.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Flying Lotus"/>Register for email updatesSubscribe to Flying LotusSubscribe to WARPSubmitBiography ˇSteve Ellison dreams the future. The Grammy-nominated musician, filmmaker, and Brainfeeder label founder, known to the world as Flying Lotus, possesses that rare alchemical ability to make the objects of his imagination manifest in reality. A sonic and visual storyteller, we've heard and seen the sights and sounds of the worlds he's built over the course of six genre-redefining studio albums, a collection of surreal music videos, and through his own film projects like the experimental horror comedy anthology "Kuso." Then there's FlyLo, the community pillar: In a revitalized LA music scene that saw hip-hop, jazz, a burgeoning beat culture, and electronic music co-mingling, he was at the center of it all. FlyLo was the common denominator from Thundercat to Kamasi Washington to Kendrick Lamar. He lent his talents to transplants too, collaborating with and influencing friends and fellow iconoclasts Mac Miller (RIP) and Donald Glover, all the while bringing the sounds of the LA scene from the fringes to the mainstream.Releases ˇSpirit Box, EP, 2024<img sizes="16rem" srcSet="https://d1rg