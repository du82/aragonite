full_description = '''Kelly Moran ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/84377-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/84377-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/84377-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/84377-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/84377-1.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/84377-1.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/84377-1.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Kelly Moran"/>Register for email updatesSubscribe to Kelly MoranSubscribe to WARPSubmitBiography ˇModern composer and pianist Kelly Moran's challenging of the piano's convention has garnered her praise and study alike. Following a variety of schools, be it Cage-esque instrument preparation or electroacoustic composition, Moran's most recent works have revealed her music to be of a unique style. Having collaborated with artists the likes of FKA Twigs, Oneohtrix Point Never, Kelsey Lu, Yves Tumor, and Margaret Leng Tan, Moran's own modus operandi as a musician has been varied, but centered in a crystalline-yet-organic sound and approach. Show MoreReleases ˇSuperhuman (Loraine James & Fyn Dobson Remix), single, 2024<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/6c21bf0b-2f60-4ca9-92b9-da93705d923a.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/6c21bf0b-2f60-4ca9-92b9-da93705d923a.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/6c21bf0b-2f60-4ca9-92b9-da93705d923a.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/6c21bf0b-2f60-4ca9-92b9-da93705d923a.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/6c21bf0b-2f60-4ca9-92b9-da93705d923a.jpg 1000w