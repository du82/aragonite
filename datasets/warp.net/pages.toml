full_description = '''Danny Brown ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/36820-4.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/36820-4.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/36820-4.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/36820-4.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/36820-4.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/36820-4.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/36820-4.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Danny Brown"/>Register for email updatesSubscribe to Danny BrownSubscribe to WARPSubmitBiography ˇDetroit spitter Danny Brown is a fan favorite for a reason. Few MCs have taken true-blue lyrical ferocity and draped it in a persona as arresting as Danny’s. Recognized in his early days as much for his streak of permed hair, toothy grin, and boggling fashion sense as he was for his rhymes and beats, Brown could always tell when to ratchet up the dramatics. But his ability to trojan-horse in bars about street-level Detroit and his surreal day to day life within it has truly produced his longevity and etched his legacy. In an era where hip-hop was fractioning in countless directions, Brown seemed to have it all down to a science–by the time he released his breakout album XXX, he was spearheading a movement of avant-garde internet hip-hop that we still live in the shadow of today. Show MoreReleases ˇQuaranta (Deluxe), album, 2024<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/15d93c48-7576-4597-9658-c2c897f23d26.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/15d93c48-7576-4597-9658-c2c897f23d26.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/15d93c48-