full_description = 'Lorenzo Senni ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/27998-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/27998-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/27998-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/27998-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/27998-1.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/27998-1.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/27998-1.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Lorenzo Senni"/>Register for email updatesSubscribe to Lorenzo SenniSubscribe to WARPSubmitBiography ˇLorenzo Senni was never a raver. Growing up in Rimini, the young artist was fascinated by dance culture as he witnessed close friends interact with a neon-hued chemical world that remained at odds with his own. He inhabited the local straight edge hardcore punk scene, a teenage drummer who absorbed the golden age of trance and gabber anecdotally. Senni was a rave voyeur, studying hedonism from a distance, fascinated by its maximalist, expressive charm. Show MoreReleases ˇScacco Matto, album, 2020<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/178616-2.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/178616-2.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/178616-2.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/178616-2.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/178616-2.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/178616-2.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/178616-2.jpg" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="Scacco Matto"/>The Shape Of RemixXxes To Come, 