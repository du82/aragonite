full_description = 'Clarissa Connelly ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/322331.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/322331.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/322331.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/322331.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/322331.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/322331.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/322331.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Clarissa Connelly"/>Register for email updatesSubscribe to Clarissa ConnellySubscribe to WARPSubmitBiography ˇBorn in Fife, Scotland, as a child Clarissa relocated to Copenhagen, Denmark, whose cultural landscape has continued to fuel her creativity. Over many years she’s explored the sacred sites, mythology, and music of Nordic culture, finding enduring inspiration in the Celtic tradition. While she’s maintained an active role in the thriving local music scene, a global audience has awakened to her sound. She first gained international attention with Tech Duinn (2018), an hypnotic EP named after a spiritual gateway in Celtic myth. For her most recent album, The Voyager (2021), Clarissa physically walked the Scandinavian landscape, channelling melodies from ancient pre-Christian sites. She also developed an app (Vandringen) which allowed others to virtually join-in and musically respond to these sites. The album received global acclaim and was awarded the prestigious Nordic Music Prize. Both more intimate and cosmic in scope than its predecessors, World of Work (her debut album for Warp) draws inspiration from visionary literature, dreams, and meditative walks. While The Voyager explored the sacred history of the Nordic landscape, World of Work explores the metaphysical landscape of the soul. The listener is invited on an inner journey that is by turns hushed and ecstatic.Releases ˇGive it Back, single, 2024<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/234f454f-ec06-4d02-821a-3d1376a3a4dd.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/234f454f-ec06-4d02-821a-3d1376a3a4dd.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/234f454f-ec06-4d02-821a-3d1376a3a4dd.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/234f454f-ec06-4d02-821a-3d1376a3a4dd.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/234f454f-ec06-4d02-821a-3d1376a3a4dd.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/234f454f-ec06-4d02-821a-3d1376a3a4dd.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/234f454f-ec06-4d02-821a-3d1376a3a4dd.jpg" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="Give it Back"/>World of Work, album, 2024<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/442391-2.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/442391-2.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/442391-2.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/442391-2.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/442391-2.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/442391-2.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/442391-2.jpg" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="World of Work"/>Videos ˇGive It Back, 2024<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/478335.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/478335.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/478335.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/478335.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/478335.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/478335.jpg 2000w" src="https://d1r