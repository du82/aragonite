full_description = 'kwes. ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/10806-2.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/10806-2.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/10806-2.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/10806-2.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/10806-2.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/10806-2.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/10806-2.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="kwes."/>Register for email updatesSubscribe to kwes.Subscribe to WARPSubmitBiography ˇKwes makes music that is in love with life. Not in a big, demonstrative way but in a quiet noticing way. In a treasuring of details way. Born Kwesi Sey in the London borough of Lewisham, music as an expression of love was central to Kwes’ upbringing: “I remember on Friday nights my mum and dad used to banter over my dad turning the music up too loud because my mum was trying to watch Coronation Street. He’d be playing jazz records. Then the following morning mum would be playing Mariah Carey out of the tape-deck really loudly. They used to playfully argue,” he smiles. “It was quite a gorgeous thing to watch, thinking about it now.” Show MoreReleases ˇRye Lane (Original Score), album, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/387017-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/387017-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/387017-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/387017-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/387017-1.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/387017-1.jpg 2000w" src="https://d1rgjmn