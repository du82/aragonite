riginal release, Tom has relished the opportunity to bring out fresh dynamics and detail in the tracks. Bonus album Venus No.17 Maximised is compiled from material originally released as part of the Ultravisitor promo EP, released 26 January 2004; the Square Window 3” CD, a free bonus disc given out with WarpMart pre-orders of the Ultravisitor album and the Venus No.17 EP. The accompanying booklet contains photographs, posters and recording documentation from Tom’s archive.↳ Tracklist#TrackArtistTime01Ultravisitor (Remastered)Squarepusher00:08:3302I Fulcrum (Remastered)Squarepusher00:03:3103Iambic 9 Poetry (Remastered)Squarepusher00:06:5504Andrei (Remastered)Squarepusher00:02:010550 Cycles (Remastered)Squarepusher00:08:3206Menelec (Remastered)Squarepusher00:05:4307C-Town Smash (Remastered)Squarepusher00:01:2908Steinbolt (Remastered)Squarepusher00:07:4409An Arched Pathway (Remastered)Squarepusher00:04:0610Telluric Piece (Remastered)Squarepusher00:01:5211District Line II (Remastered)Squarepusher00:08:3312Circlewave (Remastered)Squarepusher00:06:2813Tetra-Sync (Remastered)Squarepusher00:09:2714Tommib Help Buss (Remastered)Squarepusher00:02:1015Every Day I Love (Remastered)Squarepusher00:02:3701Square Window (Remastered)Squarepusher00:05:0002Abacus 2 (Remastered)Squarepusher00:05:1403Venus No.17 (Remastered)Squarepusher00:06:4404Venus No.17 Acid Mix (Remastered)Squarepusher00:05:3805Tundra 4 (Remastered)Squarepusher00:12:3906Itti-Fack (Remastered)Squarepusher00:00:4507Talk About Me & You (Remastered)Squarepusher00:03:0708Melt 14.6 (Remastered)Squarepusher00:02:00<img sizes="100vw" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/extra/s/ReleaseFormat-1591601-277315.png 80w, https://d1rgjmn2wmqeif.cloudfront.net/extra/m/ReleaseFormat-1591601-277315.png 125w, https://d1rgjmn2wmqeif.cloudfront.net/extra/l/ReleaseFormat-1591601-277315.png 250w, https://d1rgjmn2wmqeif.cloudfront.net/extra/g/ReleaseFormat-1591601-277315.png 500w, https://d1rgjmn2wmqeif.cloudfront.net/extra/b/Rel