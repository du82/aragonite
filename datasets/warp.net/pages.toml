c Quintet"/><img sizes="(min-width: 768px) 42vw, 68vw" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/extra/s/ReleaseFormat-1634603-288540.png 80w, https://d1rgjmn2wmqeif.cloudfront.net/extra/m/ReleaseFormat-1634603-288540.png 125w, https://d1rgjmn2wmqeif.cloudfront.net/extra/l/ReleaseFormat-1634603-288540.png 250w, https://d1rgjmn2wmqeif.cloudfront.net/extra/g/ReleaseFormat-1634603-288540.png 500w, https://d1rgjmn2wmqeif.cloudfront.net/extra/b/ReleaseFormat-1634603-288540.png 1000w, https://d1rgjmn2wmqeif.cloudfront.net/extra/2000/ReleaseFormat-1634603-288540.png 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/extra/2000/ReleaseFormat-1634603-288540.png" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-contain opacity-0" loading="lazy" alt="Mars Audiac Quintet. Vinyl - 2×LP"/>Stereolab ˇMars Audiac QuintetDUHFDL05RT28 Feb 2025REISSUEˇMars Audiac Quintet T-shirt BundleVinyl 2×LPWAV 24bit (24-bit lossless)WAV/FLAC (16-bit lossless)MP3 (320kbps, LAME Encoded)Add to Bleep Cart Play↳ Details1994’s Mars Audiac Quintet may have seen a shift in Stereolab’s lineup - Katharine Gifford joined on keys while guitarist Sean O’Hagan went from full-time to part-time during the recording process - but the band continued with their unique brand of post-rock regardless of these changes. Their core Motorik style subtly shifts across the record. At times it leans into Krautrock ala their earlier hit ‘Jenny Ondioline’, at others the intricate guitar runs and peppy vocals side more with their contemporaries Cornershop and St. Etienne. Best of all are the times in which Stereolab indulge their penchant for quirky electronics - the leftfield lounge music of tracks like ‘International Colouring Contest’ draws lines between the BBC Radiophonic Workshop, Edith Piaf and Boards Of Canada. Whatever style she’s working with at a given moment, Laetitia Sadier is able to carry the material with a mixture of quiet charisma and wry wit.↳ Tracklist#TrackArtistTime01Three-Dee MelodieStereolab00:05:0202Wow And FlutterStereolab00:03:0803Transona FiveStereolab00:05:3204Des Etoiles ElectroniquesStereolab00:03:1905Ping PongStereolab00:03:0206AnamorphoseStereolab00:07:3307Three Longers LaterStereolab00:03:2808Nihilist Assault GroupStereolab00:06:5409International Colouring ContestStereolab00:03:4710The Stars Our DestinationStereolab00:02:5811Transporte Sans BougerStereolab00:04:2012L'Enfer Des FormesStereolab00:03:5313Outer AcceleratorStereolab00:05:2114New OrthophonyStereolab00:04:3415Fiery YellowStereolab00:04:04<img sizes="100vw" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/47f44b78-cc15-4804-9a48-67109bded4ba.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/47f44b78-cc15-4804-9a48-67109bded4ba.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/47f44b78-cc15-4804-9a48-67109bded4ba.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/47f44b78-cc15-4804-9a48-67109bded4ba.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/47f44b78-cc15-4804-9a48-67109bded4ba.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/47f44b78-cc15-4804-9a48-67109bded4ba.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/47f44b78-cc15-4804-9a48-67109bded4ba.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover opacity-0" loading="lazy" alt="Mars Audiac Quintet"/>↳ Stereolab<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/925-3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/925-3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/925-3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/925-3.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/