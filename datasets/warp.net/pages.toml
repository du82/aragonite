full_description = 'Seefeel ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/123.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/123.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/123.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/123.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/123.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/123.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/123.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Seefeel"/>Register for email updatesSubscribe to SeefeelSubscribe to WARPSubmitBiography ˇSeefeel signed to Warp in 1994 after releasing a well-received debut album on Too Pure (then riding high with early releases from the likes of PJ Harvey and Stereolab), Quique. They were originally lumped in by the music press with the shoegaze sound of bands like My Bloody Valentine, but their electronic tendencies and use of samplers led to them also being linked to the emerging IDM sound, reinforced when Aphex Twin (a big Seefeel fan) did two different remixes of the early track “Time To Find Me” for free, on the agreement that they would make a record for his Rephlex label at some point. Show MoreReleases ˇSquared Roots, album, 2024<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 1000w, https://d1rgjmn2wmqe