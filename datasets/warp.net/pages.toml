full_description = '''Oli XL ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/59170.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/59170.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/59170.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/59170.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/59170.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/59170.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/59170.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Oli XL"/>Biography ˇStockholm based experimental musician Oli XL has announced his signing to Warp and shares ”Go Oli Go / Cartoon Smile”, the first double single on his new label home. After slowly becoming a key voice in the leftfield club sphere, and appearing in compilations such as PAN's "Mono No Aware", Oli vastly expanded the world of his already distinguished sound with the release of his debut album "Rogue Intruder, Soul Enhancer" in 2019, to critical acclaim. With a dissected freehand approach to the rhythms of the UK rave continuum, fragmented sampling techniques are paired with personal field recordings & processed vocals, resulting in a bizarre but emotionally rich musical universe recalling the playfulness of Basement Jaxx as much as humorless glitch.Releases ˇGo Oli Go! / Cartoon Smile, single, 2021<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/257666-3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/257666-3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/257666-3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/257666-3.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/257666-3.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/257666-3.