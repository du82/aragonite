ingular brand of library-rock with influences from free jazz, baroque art-pop ala David Axelrod and fusion-funk.↳ Tracklist#TrackArtistTime01FusesStereolab00:03:3702People Do It All The TimeStereolab00:03:4103The Free DesignStereolab00:03:4704Blips Drips And StripsStereolab00:04:2705Italian Shoes ContinuumStereolab00:04:3406Infinity GirlStereolab00:03:5307The SpiraclesStereolab00:03:4008Op Hop DetonationStereolab00:03:3209Puncture In The Radax PermutationStereolab00:05:4810Velvet WaterStereolab00:04:2111Blue MilkStereolab00:11:2812Caleidoscopic GazeStereolab00:08:0813Strobo AccelerationStereolab00:03:5414The Emergency KissesStereolab00:05:5315Come And Play In The Milky NightStereolab00:04:38<img sizes="100vw" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/5af75512-8e08-4b4f-8fed-a0594bad7b03.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/5af75512-8e08-4b4f-8fed-a0594bad7b03.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/5af75512-8e08-4b4f-8fed-a0594bad7b03.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/5af75512-8e08-4b4f-8fed-a0594bad7b03.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/5af75512-8e08-4b4f-8fed-a0594bad7b03.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/5af75512-8e08-4b4f-8fed-a0594bad7b03.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/5af75512-8e08-4b4f-8fed-a0594bad7b03.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover opacity-0" loading="lazy" alt="Cobra And Phases Group Play Voltage In The Milky Night"/>↳ Stereolab<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/925-3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/925-3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/925-3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/925-3.jpg 500w, https://d1rgjmn2wmqeif.clou