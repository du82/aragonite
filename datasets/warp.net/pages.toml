full_description = '''Mark Pritchard ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/11753-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/11753-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/11753-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/11753-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/11753-1.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/11753-1.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/11753-1.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Mark Pritchard"/>Register for email updatesSubscribe to Mark PritchardSubscribe to WARPSubmitBiography ˇA chameleonic presence at the heart of British electronic music, Mark Pritchard is as restless as he is prolific. His huge discography – including solo and collaborative projects across multiple aliases – functions as a field guide to three decades of dance mutation, connecting Midwest futurism and UK hardcore with global rhythms from Africa to Brazil. Many of his records are regarded as genre touchstones: the cloud-bursting techno of ‘Peschi’ (as Reload) and ‘Amenity’ (as Link), the precision-engineered drum ‘n’ bass of ‘Links’ (as The Chameleon), and the warped soul groove of ‘The Way’ and ambient techno vistas of 76:14 (as Global Communication), to name a few. Show MoreReleases ˇMP Productions - EP 1, EP, 2020<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/207267.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/207267.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/207267.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/207267.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/207267.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2