title = "DJ Blow My Mind: Evian Christ and Seretide Introduce the Debut Release From TranceParty - News - WARP"
description = "Writer and TranceParty bar-propper Clive Martin caught up with the pair ahead of the release to talk music, mixing, YouTube rabbit holes, and the cheap thrills of high street clubbing."
full_description = '''<img sizes="100vw" srcSet="https://api.warp.net/assets/e4a3e7cc-0fdd-4d50-95a6-382d50f7b978?withoutEnlargement=true&amp;width=640&amp;quality=85 640w, https://api.warp.net/assets/e4a3e7cc-0fdd-4d50-95a6-382d50f7b978?withoutEnlargement=true&amp;width=828&amp;quality=85 828w, https://api.warp.net/assets/e4a3e7cc-0fdd-4d50-95a6-382d50f7b978?withoutEnlargement=true&amp;width=1080&amp;quality=85 1080w, https://api.warp.net/assets/e4a3e7cc-0fdd-4d50-95a6-382d50f7b978?withoutEnlargement=true&amp;width=2040&amp;quality=85 2040w, https://api.warp.net/assets/e4a3e7cc-0fdd-4d50-95a6-382d50f7b978?withoutEnlargement=true&amp;width=2880&amp;quality=85 2880w" src="https://api.warp.net/assets/e4a3e7cc-0fdd-4d50-95a6-382d50f7b978?withoutEnlargement=true&amp;width=2880&amp;quality=85" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="absolute h-full w-full object-cover opacity-0" loading="lazy" alt="DJ Blow My Mind: Evian Christ and Seretide Introduce the Debut Release From TranceParty"/>DJ Blow My Mind: Evian Christ and Seretide Introduce the Debut Release From TrancePartyWords: Clive Martin4092 words, 00:13:38 Read Now<img sizes="(min-width: 1024px) calc((50vw - 2rem) / 3 - 2rem), (min-width: 768px) calc((50vw - 2rem) / 2 - 2rem), (min-width: 640px) calc((100vw - 2rem) / 3 - 2rem), (min-width: 480px) calc(100vw / 3 - 2rem), calc(50vw - 2rem)" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/26894-2.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/26894-2.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/26894-2.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/26894-2.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/26894-2.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/26894-2.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/26894-2.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover opacity-0" loading="lazy" alt="Evian Christ"/>Evian ChristEnglish Heritage is the debut release from TranceParty, mixed by Evian Christ and Seretide. Released one year on from Evian’s debut album Revanchist, English Heritage is essentially a collection of mash-ups—berserk, ecstatic pop remixes—that have created such a furore at TranceParty nights that some fans have been spotted pirating them on the dancefloor.But the record is also the story of a friendship, and a creative collaboration that began when Seretide (AKA: Pedro Goss) first started attending TranceParty events as a 20-year-old student in Newcastle. After a chance meeting, the pair have been collaborating both live and in the studio, playing back-to-back at clubs around Europe while working on their high-velocity rebores of Pitbull, Bladee, and Swedish House Mafia tracks.In an exclusive Warp editorial, writer and TranceParty bar-propper Clive Martin caught up with the pair ahead of the release—to talk music, mixing, YouTube rabbit holes, and the cheap thrills of high street clubbing.<a href="https://tranceparty.bandcamp.com/album/-">⌘ by TranceParty</a> .bandcamp-embed { display: flex; width: 100%; height:50vh; justify-content: center; background: #ffffff; align-items: center; } @media only screen and (max-width:700px) { .bandcamp-embed { height: auto; background: transparent; } } Clive Martin: Hello boys. So, first up, how did you two meet?Evian Christ: Maybe you should answer that one, Pedro, as I can’t piece it together too well.Seretide: We first met at TranceParty:Reload a few years ago now. I really wanted one of the Progressive scarves, but you didn’t actually have any on sale at the time - as there wasn’t a TP store yet. But I messaged you before the show, and you said you'd bring one along. We bumped into each other in the corridor, and you were like, ‘The scarf, right?’ But it turned out you’d lost the bag it was in, and we had to go looking for it all over Corsica Studios at like 3am, with smoke and strobes everywhere. When we eventually found the scarf, we took a photo together with it. After that, we just kept chatting about music over DMs.EC: Yeah, I remember noticing a SoundCloud link on your bio. So I clicked and listened to a mix you’d done, which was good. There was an MRD track in there; I asked for the ID of it, and it kind of just turned into a longer conversation about tunes and stuff. We usually leave an hour or so free at the end of our events for whoever is still around to play back-to-back—or if none of the other DJs are around, I’ll do it. The idea is to leave some room for spontaneity. Anyway, I bumped into Ped in the crowd at TP: Cool, and he had a USB on him, so I was just like, ‘Get up there, let’s play.’ And luckily it was really good, so he’s played basically every one since.CM: Pedro, how did you get into TranceParty, and Josh’s music? ST: TranceParty is just one of those things that everyone has heard of, and I always knew it was Josh’s night, Josh’s music. But because I was living in the north then, it was a bit of a trek to get to one of them. Still, one weekend I went down with about six of my mates. We’d been to a party in Manchester the night before, but we all thought, ‘We have to go to this.’.Back then, no one was really booking things like DJ IBON and Courtesy in the UK, so it was a bit of a no-brainer to attend. CM: Josh, to put it mildly, you’re not exactly a prolific collaborator when it comes to releasing music. So what made you work with Pedro?EC: I’m not a prolific collaborator, no. I like to just do my own thing. But DJing is a bit different, and part of the reason me and Ped connected initially was because he had a really good grasp of contemporary trancey techno stuff that I didn’t know so much about. Basically, I’m really into trance that sounds like techno, and Ped’s into techno that sounds like trance. So there’s synergy. And then we both like Pitbull. But mostly, it’s just that we just get along. We talk almost every day. We have a similar process when it comes to discovering music: going back and forth between YouTube and Discogs, finding weird channels and listening to everything on there, finding an artist who you like and listening to their entire back catalogue, then the back catalogues of associated labels, and so on. I’m obsessed with YouTube as an archive of electronic music; it’s so insanely good, I spend hours on it every day. And I think he and I have that same enthusiasm and process. We share a lot of music back and forth. CM: So tell us about the ‘English Heritage’ release; where did that idea stem from? EC: Well, my output in terms of official releases is very limited, but I'm actually a pretty prolific creator of edits, mash-ups, whatever you want to call them. I kind of make these tracks exclusively to play in my sets, and to hear them, you have to be at the show. I generally don’t even give them to other DJs. Sometimes I make things for specific shows and only play them once. Never thought too much of it.But this year, I’ve been touring a lot, and people started remaking the more popular edits that were staples of my sets. And then those remakes would start showing up in weird places, like other people’s sets—or people would rip them from mixes of mine that were online and play them out. I also had a bit of a strange thing happen where, I think, Skrillex and Boys Noize most likely used one of my edits as a reference point for an official release. It didn’t really bother me, but I realised the only way to regain control was to actually release the music and stand behind it.On top of that, Pedro’s edit of The Saturdays’ ‘All Fired Up’ has always got such a mad reaction at TranceParty—maybe more so than any of my tunes, to be honest—so I really wanted to get it out there. It feels like the definitive TP song of the past few years. I remember after one event someone sent me a ridiculously long message about it, like absolutely begging me to send it, saying that they had to hear it again and couldn’t live without it, as if it were a matter of life and death. So I was like, ‘Alright, we should probably do something with this song everyone loves so much.’<img sizes="(min-width: 768px) calc(50vw - 4rem), calc(100vw - 4rem)" srcSet="https://api.warp.net/assets/c763345f-221e-48dd-a8ad-ee5e8d76b5f6?withoutEnlargement=true&amp;width=296&amp;quality=85&amp;height=296 296w, https://api.warp.net/assets/c763345f-221e-48dd-a8ad-ee5e8d76b5f6?withoutEnlargement=true&amp;width=592&amp;quality=85&amp;height=592 592w, https://api.warp.net/assets/c763345f-221e-48dd-a8ad-ee5e8d76b5f6?withoutEnlargement=true&amp;width=896&amp;quality=85&amp;height=896 896w, https://api.warp.net/assets/c763345f-221e-48dd-a8ad-ee5e8d76b5f6?withoutEnlargement=true&amp;width=1792&amp;quality=85&amp;height=1792 1792w" src="https://api.warp.net/assets/c763345f-221e-48dd-a8ad-ee5e8d76b5f6?withoutEnlargement=true&amp;width=1792&amp;quality=85&amp;height=1792" decoding="async" data-nimg="none" class="w-full object-cover opacity-0" loading="lazy" alt="Evian Christ performing at TranceParty: on+on"/>Evian Christ performing at TranceParty: on+on<a href="https://tranceparty.bandcamp.com/album/-">⌘ by TranceParty</a><img sizes="(min-width: 768px) calc(50vw - 4rem), calc(100vw - 4rem)" srcSet="https://api.warp.net/assets/f1617b1a-3648-49bb-a1bf-92c76d118351?withoutEnlargement=true&amp;width=296&amp;quality=85&amp;height=296 296w, https://api.warp.net/assets/f1617b1a-3648-49bb-a1bf-92c76d118351?withoutEnlargement=true&amp;width=592&amp;quality=85&amp;height=592 592w, https://api.warp.net/assets/f1617b1a-3648-49bb-a1bf-92c76d118351?withoutEnlargement=true&amp;width=896&amp;quality=85&amp;height=896 896w, https://api.warp.net/assets/f1617b1a-3648-49bb-a1bf-92c76d118351?withoutEnlargement=true&amp;width=1792&amp;quality=85&amp;height=1792 1792w" src="https://api.warp.net/assets/f1617b1a-3648-49bb-a1bf-92c76d118351?withoutEnlargement=true&amp;width=1792&amp;quality=85&amp;height=1792" decoding="async" data-nimg="none" class="w-full object-cover opacity-0" loading="lazy" alt="English Heritage (2024) CD Detail"/>English Heritage (2024) CD DetailCM: Pedro, how did you come across ‘All Fired Up’? It’s such a leftfield choice, this also-ran Xenomania tune from 2011...ST: I just like that era of pop music. A lot of it is quite trance-like in nature. I was organising my music folder one day and happened to have ‘All Fired Up’ on there and thought, ‘It would be cool to play this out one night.’ But I also knew I had to make it appropriate for a club environment rather than just playing the original. So I made it slightly faster and cut it up.Once I had the idea, putting it together was easy enough. But for the longest time I only had a 128kbps MP3 of one of the songs I'd used ('Common Enemy' by FUJ), and there was no trace of it online. Josh was obsessed with getting hold of a FLAC. So, after contacting the artist and not really getting anywhere, I ended up going on a mad chase, searching through everyone who had liked his post on Instagram from 2020—which was when the track came out initially. I was just cold messaging everyone who'd liked the post to see if they had it, and like a day before we went to mastering, I managed to get the file. It took about seven months of trying. EC: The original Saturdays song is so good as well. I had kind of forgotten about it before Ped sent me his version. That era of commercial club/pop music, with all the stacked supersaw chord stabs, has been a really big reference point for us recently; stuff like The Wanted, Cheryl Cole, Pixie Lott, even Magnetic Man. I think our set in December will be based on that stuff. CM: Yes, listening to the EP, some of it reminds me of that 2009-2011 era; Geordie Shore stars doing personal appearances at Tiger Tiger, fish bowl cocktails, bodycon dresses, all of that madness.EC: Yeah, I agree. To me, the original music is like the soundtrack of a League One footballer hanging out in the VIP section of a club in Deansgate Locks in 2011. That was a very aspirational lifestyle for me at the time, but I never quite made it, so I ended up doing this. For Pedro, I imagine it’ll be different because he’s younger. ST: Yeah, for me, this genre is what I grew up listening to on the radio or watching the music videos on MTV. CM: How did the title come about? It’s a very English (or British) sound, but not all the tracks are British in origin. There’s Pitbull, Bladee, and Robert Miles—who I had no idea was Italian. EC: Yes, his real name was Roberto. It’s not a very good answer, but it basically came from (TranceParty graphic designer) David Rudnick and his insistence on associating TP with the most banal British iconography he can dig out. English Heritage was a loose concept for TP Season 4 initially. It’s quite normal for us to draw from this type of imagery—like the BT logo, the National Lottery logo—stuff like that. David generally instigates it, so you’d have to ask him. I liked the idea of using the English Heritage identity specifically for this project, though; that was my idea. Even the songs by non-British acts have a sort of unique UK legacy, I think; they seem to activate core memories that are inseparable from growing up here. ST: For a while, we wanted to call it ‘Urban Heat’, but decided against that after the concept became difficult to execute. We used it for the Barcelona event instead, which was a better fit.CM: Why did you decide to do it as a fully-fledged release, on CD, rather than just throwing them up on SoundCloud? EC: I really want it to 'read’ as a record—front-to-back, programmed, mixed and mastered. I appreciate not everyone will care or choose to listen to it like that, but I wanted to make sure it could work that way. With the advent of Bandcamp and SoundCloud, mashups have become quite ubiquitous, but I wanted this to be a fully fleshed-out project.I put a lot of time into it—learning about different stem separation models and trying to break the songs out into multitrack environments that I could control more granularly. For some songs, I wanted full control over the arrangements—the individual sounds, how they were balanced against each other, especially vocals—like a full session. Sometimes that meant re-synthesising and re-playing stuff, reprogramming drums, processing the vocals, and then taking the end product and getting it properly mastered for CD. Some songs were easy, others were a nightmare. Chris Pawlusek, my go-to engineering guy, helped a ton.So it's been a process. It’s just how I am. It's a case of trying to squeeze an extra couple of percent out of everything I work on. You can always hear when someone has just slammed two songs on top of each oth'''
