full_description = 'Yves Tumor ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/47533-5.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/47533-5.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/47533-5.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/47533-5.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/47533-5.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/47533-5.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/47533-5.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Yves Tumor"/>Register for email updatesSubscribe to Yves TumorSubscribe to WARPSubmitBiography ˇYves Tumor shifts, alters, and plays with the boundaries of contemporary art and culture in a boundlessly visceral and authentic sonic signature. With an arc that effortlessly graces rock, psychedelia, and electronica in a constant re-invention of pop music, comparisons only serve as limitations intended to define that which cannot be. Yves Tumor melds restraint and chaos in a soulful clarity; diluting reality by giving meaning to the abstract and allowing for dissonance to be seen and heard as harmony. Show MoreReleases ˇPraise A Lord Who Chews But Which Does Not Consume; (Or Simply, Hot Between Worlds), album, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/367732-9.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/367732-9.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/367732-9.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/367732-9.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/367732-9.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/367732-9.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/367732-9.jpg" decoding="asyn