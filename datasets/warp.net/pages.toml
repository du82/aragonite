full_description = '''<img sizes="(min-width: 768px) 42vw, 68vw" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/f9e7c302-e67e-446a-87ef-c530875bcce3.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-contain opacity-0" loading="lazy" alt="Squared Roots"/>Seefeel ˇSquared RootsWARPDD39104 Dec 2024WAV 24bit (24-bit lossless)WAV/FLAC (16-bit lossless)MP3 (320kbps, LAME Encoded)Add to Bleep Cart Play↳ DetailsA collection of seven tracks from the same recording sessions as their 2024 mini-album, Everything Squared. On more of a drifting, dreamy ambient tip than the previous release, it finds Seefeel even more untethered from traditional song structures, exploring the nuances of deep cavernous bass, slow heart rate kick drums and cosmic synth textures. Sounds are heavily abstracted, with vocals and traditional instrumentation cut-up and processed to the point that they become indistinguishable from electronically generated noises. With motifs from all six tracks on Everything Squared reappearing, in some ways, Squared Roots can be thought of as a more dubbed out version excursion to the previous mini-album's more instantly recognisable sense of melody and rhythm.↳ Tracklist#TrackArtistTime01So Shall You BeSeefeel00:03:4802Tail Tra