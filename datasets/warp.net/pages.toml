y" alt="Emperor Tomato Ketchup"/><img sizes="(min-width: 768px) 42vw, 68vw" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/extra/s/ReleaseFormat-1634604-288529.png 80w, https://d1rgjmn2wmqeif.cloudfront.net/extra/m/ReleaseFormat-1634604-288529.png 125w, https://d1rgjmn2wmqeif.cloudfront.net/extra/l/ReleaseFormat-1634604-288529.png 250w, https://d1rgjmn2wmqeif.cloudfront.net/extra/g/ReleaseFormat-1634604-288529.png 500w, https://d1rgjmn2wmqeif.cloudfront.net/extra/b/ReleaseFormat-1634604-288529.png 1000w, https://d1rgjmn2wmqeif.cloudfront.net/extra/2000/ReleaseFormat-1634604-288529.png 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/extra/2000/ReleaseFormat-1634604-288529.png" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-contain opacity-0" loading="lazy" alt="Emperor Tomato Ketchup. Vinyl - 2×LP"/>Stereolab ˇEmperor Tomato KetchupDUHFDL11RT28 Feb 2025REISSUEˇEmperor Tomato Ketchup 2LP + T-shirt BundleVinyl 2×LPWAV 24bit (24-bit lossless)WAV/FLAC (16-bit lossless)MP3 (320kbps, LAME Encoded)Add to Bleep Cart Play↳ DetailsAlong with the image of Cliff - the little chap with the gun who became Stereolab’s semi-official mascot - Emperor Tomato Ketchup is probably the thing that defines the band in the popular consciousness. A critical success upon impact, the 1996 record ended up in many ‘best of the decade’ lists a few years later - not bad when you consider the competition. If you took a straw poll among fans of Stereolab as to what their best album was there’s a good chance that Emperor Tomato Ketchup would come out on top. Of course the main reason that Emperor Tomato Ketchup remains so beloved is that it’s full of fantastic tracks. Stereolab were a singular band, the sort who made music only they could make. Any other group trying to blend influences from Krautrock, grunge, bossa-nova, mid-Century French chansons and whatever else they fancied at the time would have fallen flat on their face, but Tim Gane and Laetitia Sadier’s gang make it sound like the most natural thing in the world. As such, Emperor Tomato Ketchup acts as a missing link between the pioneering work of Can and Neu! and the experimental gains groups like Animal Collective would make a few years down the line.↳ Tracklist#TrackArtistTime01Metronomic UndergroundStereolab00:07:5402Cybele's ReverieStereolab00:04:4003PercolatorStereolab00:03:4704Les Yper-SoundStereolab00:04:0505Spark PlugStereolab00:02:2906Olv 26Stereolab00:05:4207The Noise Of CarpetStereolab00:03:0508Tomorrow Is Already HereStereolab00:04:5609Emperor Tomato KetchupStereolab00:04:3710Monstre SacreStereolab00:03:4411Motoroller ScalatronStereolab00:03:4812Slow Fast HazelStereolab00:03:5313Anonymous CollectiveStereolab00:04:32<img sizes="100vw" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/48aeb393-6a2a-4e53-b986-15185327004c.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/48aeb393-6a2a-4e53-b986-15185327004c.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/48aeb393-6a2a-4e53-b986-15185327004c.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/48aeb393-6a2a-4e53-b986-15185327004c.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/48aeb393-6a2a-4e53-b986-15185327004c.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/48aeb393-6a2a-4e53-b986-15185327004c.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/48aeb393-6a2a-4e53-b986-15185327004c.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover opacity-0" loading="lazy" alt="Emperor Tomato Ketchup"/>↳ Stereolab<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/925-3.jpg 80w, https://d1rgjmn2wmqeif.cl