description = "For all the benefits of being in a successful band, individuality is not always one of them. Impulses are subsumed by the organization; choices are bound in compromise. …"
full_description = 'Daniel Rossen ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/24515-2.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/24515-2.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/24515-2.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/24515-2.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/24515-2.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/24515-2.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/24515-2.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Daniel Rossen"/>Register for email updatesSubscribe to Daniel RossenSubscribe to WARPSubmitBiography ˇFor all the benefits of being in a successful band, individuality is not always one of them. Impulses are subsumed by the organization; choices are bound in compromise. As formative as Rossen’s experiences in Grizzly Bear were, he recognized what was lost in that equation or even the contemporaneous and often-playful duo Department of Eagles. His 2012 EP, Silent Hour/Golden Mile, felt like pure energetic effusion, a welcome declaration of self soon after Rossen left the city. Like a slow-motion magpie, he gathered more ideas of his own there, sometimes living with and turning over a riff or a melody for years while embracing the routines of rural life and, eventually, the adventures of parenthood. Self-reliance became a way of life, a mode of mature expression. Show MoreReleases ˇLive in Pioneertown & Santa Fe, album, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/397895-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/397895-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/397895-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/39789