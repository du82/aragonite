full_description = 'James Ellis Ford ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/285549-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/285549-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/285549-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/285549-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/285549-1.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/285549-1.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/285549-1.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="James Ellis Ford"/>Biography ˇJames Ellis Ford has been hidden in plain sight for his entire two-decade-long career. The composer, multi-instrumentalist, producer and songwriter has worked with some of the biggest names in music, from Arctic Monkeys to Depeche Mode via Foals, Gorillaz and Kylie Minogue and as part of Simian Mobile Disco and The Last Shadow Puppets’ touring band. This year he takes centre stage with his debut solo album “The Hum”. The album, available May 12th, is a sprawling genreless ode to psychedelia both contemporary and nostalgic, entirely written, produced and performed by James. On stage, he’s joined by his four-piece band to recreate and riff on the original songs. Show MoreReleases ˇThe Hum, album, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/376164-5.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/376164-5.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/376164-5.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/376164-5.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/376164-5.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/376164-5.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/376164-5.jpg" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="The Hum"/>Videos ˇThe Yips, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/466238.png 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/466238.png 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/466238.png 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/466238.png 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/466238.png 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/466238.png 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/466238.png" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="The Yips"/>Squeaky Wheel, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/382762-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/382762-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/382762-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/382762-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/382762-1.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/382762-1.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/382762-1.jpg" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="Squeaky Wheel"/>I Never Wanted Anything, 2023<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/376269.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/376269.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/376269.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/376269.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/376269.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/r/2000/376269.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/r/2000/376269.jpg" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="I Never Wanted Anything"/>Editorial ˇA Whole Other Thing at Play: James Ford on the routes that led him to The Hum<img sizes="16rem" srcSet="https://api.warp.net/assets/f47db1d1-4bcf-4a05-b00e-5675c4d41dd6?withoutEnlargement=true&amp;width=256&amp;quality=85 256w, https://api.warp.net/assets/f47db1d1-4bcf-4a05-b00e-5675c4d41dd6?withoutEnlargement=true&amp;width=512&amp;quality=85 512w" src="https://api.warp.net/assets/f47db1d1-4bcf-4a05-b00e-5675c4d41dd6?withoutEnlargement=true&amp;width=512&amp;quality=85" decoding="async" data-nimg="none" class="w-full bg-gray-100" loading="lazy" alt="A Whole Other Thing at Play: James Ford on the routes that led him to The Hum"/>Web ˇ Official WebsiteStreaming ˇ Spotify Apple Music Amazon YouTube Music Deezer Tidal Bandcamp<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/285549-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/285549-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/285549-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/285549-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/285549-1.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/285549-1.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/285549-1.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="James Ellis Ford"/>Web ˇ Official WebsiteStreaming ˇ Spotify Apple Music Amazon YouTube Music Deezer Tidal BandcampHudson MohawkeKassa Overall'
