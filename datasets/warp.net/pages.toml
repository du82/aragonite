full_description = 'Mount Kimbie ˇ<img sizes="(min-width: 362px) calc(100vw - 2rem), 330px" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/a/s/12120-3.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/a/m/12120-3.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/a/l/12120-3.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/a/g/12120-3.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/a/b/12120-3.jpg 1000w, https://d1rgjmn2wmqeif.cloudfront.net/a/2000/12120-3.jpg 2000w" src="https://d1rgjmn2wmqeif.cloudfront.net/a/2000/12120-3.jpg" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="object-cover" loading="lazy" alt="Mount Kimbie"/>Register for email updatesSubscribe to Mount KimbieSubscribe to WARPSubmitBiography ˇThe Sunset Violent picks up where Mount Kimbie’s last studio album, 2017’s Love What Survives left off, marrying modern indie, shoegaze and electronica seamlessly into another highly unique and forward-thinking LP from one of London’s most seminal contemporary bands. The album was written in California’s Yucca Valley, a scant Western town with a history of alleged UFO sightings before being finished in London. The desert’s surrealistic, auburn-tinged tones and sparse Americana landscape can be heard across each of the album’s nine tracks, marrying perfectly with the album’s abstract storytelling and cutting-edge songwriting to create another classic Mount Kimbie record. Show MoreReleases ˇThe Trail (Astrid Sonne Remix), single, 2025<img sizes="16rem" srcSet="https://d1rgjmn2wmqeif.cloudfront.net/r/s/495880-1.jpg 80w, https://d1rgjmn2wmqeif.cloudfront.net/r/m/495880-1.jpg 125w, https://d1rgjmn2wmqeif.cloudfront.net/r/l/495880-1.jpg 250w, https://d1rgjmn2wmqeif.cloudfront.net/r/g/495880-1.jpg 500w, https://d1rgjmn2wmqeif.cloudfront.net/r/b/495880-1.jpg 1000w, https://d1rgjmn2wmq