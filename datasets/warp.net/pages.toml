title = "About - WARP"
description = "Warp's artists create groundbreaking music, videos and cinema. Aphex Twin, Boards of Canada, Flying Lotus, Kelela, Nala Sinephro and Yves Tumor are just a few who represent the label. Watch and listen here."
full_description = '↳ WARP RECORDSFor over 30 years Warp Records has been a synonym for adventures in sound and vision, consistently furthering their position as one of the most creative independent record labels in the world. With a rich legacy and consistently groundbreaking vision of the future, Warp and its artists traverse mediums to explore new spaces. Aphex Twin, Flying Lotus, Hudson Mohawke, Kelela, Squarepusher and Yves Tumor are just a few who represent the label. CONTACT ˇ GENERAL ENQUIRIES United Kingdom editor@warprecords.com North America usa@warprecords.com PRESS United Kingdom press@warprecords.com North America uspress@warprecords.com Distribution and International Press Enquiries international@warprecords.com Licensing / Compilations Licensing Request Form WARP.NET Site bugs, corrections and feedback feedback@warp.net General Website Enquiries editor@warprecords.com WARP MUSIC PUBLISHING General Enquiries theo@warprecords.com BLEEP All Enquiries support@bleep.com LISTEN TO WARP RECORDS ˇ LISTEN ˇ Apple Music Spotify Soundcloud YouTube FOLLOW WARP RECORDS ˇ FOLLOW ˇ Instagram Twitter Facebook WEBSITE ˇ Creative Direction & Design HelloMe Frontend Development Marlow Perceval Backend Development Ochre DEMOS ˇ We are not currently seeking unsolicited demos. Due to the volume of digital submissions, it is impossible to listen and respond to each one. If you desperately must send a demo to a Warp email address please do not send at random to all addresses you can find - that will not increase the likelihood of us listening to it. Our general enquiry address is editor@warp.net PLEASE DO NOT ATTACH ANYTHING. Please respect that we cannot offer feedback. <img sizes="100vw" srcSet="https://api.warp.net/assets/468b372e-f4d3-4bd0-a34b-8e3d8e6b1c03?withoutEnlargement=true&amp;width=640&amp;quality=85 640w, https://api.warp.net/assets/468b372e-f4d3-4bd0-a34b-8e3d8e6b1c03?withoutEnlargement=true&amp;width=828&amp;quality=85 828w, https://api.warp.net/assets/468b372e-f4d3-4bd0-a34b-8e3d8e6b1c03?withoutEnlargement=true&amp;width=1080&amp;quality=85 1080w, https://api.warp.net/assets/468b372e-f4d3-4bd0-a34b-8e3d8e6b1c03?withoutEnlargement=true&amp;width=2040&amp;quality=85 2040w, https://api.warp.net/assets/468b372e-f4d3-4bd0-a34b-8e3d8e6b1c03?withoutEnlargement=true&amp;width=2880&amp;quality=85 2880w" src="https://api.warp.net/assets/468b372e-f4d3-4bd0-a34b-8e3d8e6b1c03?withoutEnlargement=true&amp;width=2880&amp;quality=85" decoding="async" data-nimg="none" class="w-full object-cover h-full opacity-0" loading="lazy" alt="logo.gif"/>'
