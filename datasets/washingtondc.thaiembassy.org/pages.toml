title = 'เอกอัครราชทูต ณ กรุงวอชิงตัน ร่วมรับชมซีรีส์ "The White Lotus” ภาค ๓ ตอนที่ ๒ รอบพิเศษ ตามคำเชิญของ MPA และ HBO - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน'
description = 'เอกอัครราชทูต ณ กรุงวอชิงตัน ร่วมรับชมซีรีส์ "The White Lotus” ภาค ๓ ตอนที่ ๒ รอบพิเศษ ตามคำเชิญของ MPA และ HBO'
full_description = 'เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) เมื่อวันที่ ๒๐ กุมภาพันธ์ ๒๕๖๘ ดร. สุริยา จินดาวงษ์ เอกอัครราชทูต ณ กรุงวอชิงตัน ได้รับเชิญให้เข้าร่วมเป็นเกียรติและกล่าวในการฉายซีรีส์เรื่อง "The White Lotus” ภาค ๓ (TWL3) ตอนที่ ๒ รอบพิเศษ (Special Screening) ณ โรงภาพยนตร์สมาคมผู้สร้างภาพยนตร์แห่งสหรัฐอเมริกา (Motion Picture Association หรือ MPA) กรุงวอชิงตัน จัดโดย HBO และ MPA โดยมีผู้เข้าร่วมจากทั้งภาครัฐและภาคเอกชน อาทิ สมาชิกรัฐสภา ผู้บริหารระดับสูงของกระทรวงการต่างประเทศสหรัฐฯ และคณะทูตต่างประเทศในสหรัฐฯ ทั้งนี้ กิจกรรมดังกล่าวเป็นหนึ่งในกิจกรรมเปิดตัวซีรีย์ TWL3 ซึ่งถ่ายทำที่ประเทศไทย โอกาสนี้ เอกอัครราชทูตฯ ได้กล่าวขอบคุณ HBO และคณะผู้ผลิต ที่เลือกประเทศไทยเป็นสถานที่ถ่ายทำ TWL3 และนำเสนออัตลักษณ์ความเป็นไทยได้อย่างงดงาม รวมถึงได้แสดงความยินดีต่อความสำเร็จตลอดการถ่ายทำ ซึ่งเป็นการผสมผสานกันอย่างลงตัวระหว่างผลประโยชน์ของทุกฝ่าย ทั้งการเผยแพร่ความคิดสร้างสรรค์ของคณะผู้ผลิตสหรัฐฯ การแสดงศักยภาพของอุตสาหกรรมภาพยนตร์และการท่องเที่ยวในประเทศไทย และโอกาสในการได้รับชมผลงานคุณภาพสำหรับผู้ชมทั่วโลก นอกจากนี้ เอกอัครราชทูตฯ ได้เน้นย้ำความมุ่งมั่นของรัฐบาลไทยในการสนับสนุนอุตสาหกรรมภาพยนตร์และการสร้างสภาพแวดล้อมที่พร้อมรองรับคณะผู้ผลิตจากนานาประเทศ อย่างรอบด้าน ดังเห็นได้จากการพบหารือระหว่างนายกรัฐมนตรีกับคณะผู้บริหารและสมาชิก MPA เมื่อเดือนพฤศจิกายน ๒๕๖๗ ที่นครลอสแอนเจลิส ซึ่งนำไปสู่การพิจารณาให้สิทธิประโยชน์ทางการเงินที่มากขึ้นในเวลาต่อมา'
