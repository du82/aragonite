["https://washingtondc.thaiembassy.org/th/page/%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%87-2"]
title = "การเมือง - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "การเมือง (ความสัมพันธ์ด้านการเมืองไทย-สหรัฐฯ)"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) ไทยและสหรัฐฯ ได้สถาปนาความสัมพันธ์อย่างเป็นทางการเมื่อปี 2376 ในรัชสมัยพระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัว โดยได้มีการลงนามในสนธิสัญญาไมตรีและการพาณิชย์ (Treaty of Amity and Commerce) ระหว่างกันเมื่อวันที่ 20 มีนาคม 2376 (ค.ศ. 1833) ประธานาธิบดีแอนดรูว์ แจ็คสัน (Andrew Jackson) ได้ส่งนายเอ็ดมันด์ รอเบิร์ตส์ (Edmund Roberts) ทูตสหรัฐฯ มายังกรุงเทพฯ โดยมีภารกิจสำคัญคือ การเจรจาจัดทำสนธิสัญญาไมตรีและการพาณิชย์กับไทย ส่วนในด้านการแลกเปลี่ยนผู้แทนทางการทูตนั้น สหรัฐฯ ได้แต่งตั้ง สาธุคุณสตีเฟน แมตตูน (Reverend Stephen Mattoon) เป็นกงสุลประจำสยามคนแรกในเดือนพฤษภาคม 2399 และได้แต่งตั้งนายจอห์น เอ. ฮัลเดอร์แมน (John A. Halderman) เป็นผู้แทนสหรัฐฯ ประจำสยามคนแรก ในตำแหน่งกงสุลใหญ่ เมื่อวันที่ 13 กรกฎาคม 2424 สยามได้แต่งตั้งพระองค์เจ้าปฤษฎางค์ ชุมสาย เป็นราชทูตไทยประจำสหรัฐฯ พระองค์แรกในปี 2430 โดยพระองค์ทรงพำนักอยู่ที่กรุงลอนดอน ประเทศอังกฤษ ไทยได้เปิดสถานทูตในสหรัฐอเมริกาในปี 2444 ที่อาร์ลิงตัน รัฐเวอร์จิเนีย และได้ย้ายสำนักงานมายังกรุงวอชิงตัน ในปี 2456 ไทยและสหรัฐฯ ได้ยกสถานะความสัมพันธ์เป็นระดับเอกอัครราชทูตในปี 2490 ปัจจุบัน ไทยมีสถานเอกอัครราชทูต ณ กรุงวอชิงตัน และมีสถานกงสุลใหญ่ 3 แห่ง คือ สถานกงสุลใหญ่ ณ นครชิคาโก สถานกงสุลใหญ่ ณ นครนิวยอร์ก และสถานกงสุลใหญ่ ณ นครลอสแอนเจลิส ในส่วนของสหรัฐฯ มีสถานเอกอัครราชทูต ที่กรุงเทพฯ และสถานกงสุลใหญ่ ที่จังหวัดเชียงใหม่"
year_published = 2000
