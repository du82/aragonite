["https://washingtondc.thaiembassy.org/th/page/idcardservice"]
title = "บัตรประจำตัวประชาชน - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "บัตรประจำตัวประชาชน"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) คิวนัดหมายบัตรประจำตัวประชาชนสงวนไว้ให้ผู้ที่จะทำบัตรประจำตัวประชาชนเพียงอย่างเดียวเท่านั้น หากจะทำหนังสือเดินทางแต่บัตรประจำตัวประชาชนหมดอายุหรือสูญหาย ให้ท่านทำนัดหมายสำหรับหนังสือเดินทางเพียงอย่างเดียว เจ้าหน้าที่จะอนุโลมให้ทำบัตรประจำตัวประชาชนในวันเดียวกัน ใครมีสิทธิขอทำบัตรประจำตัวประชาชนไทยในต่างประเทศได้บ้าง? 1. คนไทยที่มีบัตรประจำตัวประชาชนไทยอยู่แล้ว แต่บัตรหมดอายุ บัตรหาย บัตรถูกทำลาย บัตรชำรุด หรือมีการแก้ไขชื่อตัว/ชื่อสกุลในทะเบียนบ้าน หรือย้ายที่อยู่ 2. ผู้ขอทำบัตรประจำตัวประชาชนไทยจะต้องไม่เป็นบุคคลที่มีรายชื่ออยู่ในทะเบียนบ้านกลางหรือต้องไม่เป็นบุคคลที่ติด ท.ร.97 (คลิกเพื่ออ่านรายละเอียดเพิ่มเติมที่นี่) 3. ผู้ขอทำบัตรประจำตัวประชาชนจะต้องมีข้อมูลในระบบฐานข้อมูลของกระทรวงมหาดไทยและข้อมูลส่วนบุคคลจะต้องถูกต้องตรงกับฐานข้อมูลทะเบียนราษฎร"
