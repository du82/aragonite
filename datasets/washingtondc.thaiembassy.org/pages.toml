title = "Thailand New Visa Measures - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
full_description = "Thailand New Visa Measures: Effective date 15 July 20241. Visa on Arrival (VoA): Nationals of the 31 countries and territories may apply for visa on arrival at the immigration checkpoints on arrival for the purpose of tourism, for a period not exceeding 15 days. 2. Visa Exemption (60 Days): Nationals of the 93 countries and territories are entitled to visa exemption for the purpose of tourism and short-term business engagements, for a period not exceeding 60 days. 3. Non-ED Plus Visa: Non-ED Plus Visa aims to facilitate international students studying at universities in Thailand at the bachelor's degree level or above. (More details in the visa types & requirements.)"
