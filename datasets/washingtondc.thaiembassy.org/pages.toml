title = "สถาบันพระมหากษัตริย์ - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "สถาบันพระมหากษัตริย์"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) พระอัจฉริยภาพของพระมหากษัตรย์ไทยกับความสัมพันธ์ไทย-สหรัฐ อเมริกา พระมหากษัตริย์ไทยได้ทรงมีสายพระเนตรกว้างไกลในการวางรากฐานความสัมพันธ์กับชาติตะวันตกมาตั้งแต่สมัยกรุงศรีอยุธยาแล้วไม่ว่าจะเป็นโปรตุเกส สหราชอาณาจักร และเนเธอร์แลนด์ ต่างก็เข้ามาค้าขายกับไทยมาช้านาน ส่วนสหรัฐอเมริกา แม้ว่าจะเป็นประเทศเกิดใหม่ไม่นานแต่ก็ตระหนักถึงความสำคัญของสยาม เช่นกัน โดยในปี 2376 ในสมัยราชวงศ์จักรี ประธานาธิบดี Andrew Jackson ของสหรัฐฯ (ดำรงตำแหน่งปี 2372-2380) ได้ส่งนาย Edmund Roberts เป็นเอกอัครราชทูตเดินทางมายังกรุงเทพฯ เพื่อเจริญสัมพันธไมตรี พร้อมทั้งนำสิ่งของมาทูลเกล้าฯ ถวายแด่พระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัว ซึ่งรวมถึงดาบฝักทองคำที่ด้ามสลักเป็นรูปนกอินทรีและช้าง ในโอกาสนั้น พระบาทสมเด็จพระนั่งเกล้าเจ้าอยู่หัวได้พระราชทานสิ่งของตอบแทนซึ่งเป็นของพื้นเมือง อาทิ งาช้าง ดีบุก เนื้อไม้ กำยาน และในปี 2376 นี้เองที่ทั้งสองฝ่ายได้ร่วมลงนามในสนธิสัญญาไมตรีและการพาณิชย์ (Treaty of Amity and Commerce) ซึ่งถือเป็นจุดเริ่มต้นความสัมพันธ์อย่างเป็นทางการระหว่างไทยและสหรัฐอเมริกา"
