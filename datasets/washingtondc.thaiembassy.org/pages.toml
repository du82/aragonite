["https://washingtondc.thaiembassy.org/th/page/%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%A7%E0%B8%B1%E0%B8%95%E0%B8%B4"]
title = "ประวัติ - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "ประวัติ"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) ไทยและสหรัฐฯ มีความสัมพันธ์มายาวนาน โดยเริ่มต้นอย่างเป็นทางการเมื่อปี 2376 จากที่ทั้งสองฝ่ายมีสนธิสัญญาไมตรีและการพาณิชย์ (Treaty of Amity and Commerce) ในรัชสมัยพระบาทสมเด็จพระนั่งเกล้าฯ โดยในปีดังกล่าว ประธานาธิบดี Andrew Jackson ของสหรัฐฯ (ดำรงตำแหน่งปี 2372-2380) ได้ส่งนาย Edmund Roberts เป็นเอกอัครราชทูตเดินทางมายังกรุงเทพฯ พร้อมทั้งนำสิ่งของมาทูลเกล้าฯ ถวายแด่พระบาทสมเด็จพระนั่งเกล้าฯ ซึ่งรวมถึงดาบฝักทองคำที่ด้ามสลักเป็นรูปนกอินทรีและช้าง และพระบาทสมเด็จพระนั่งเกล้าฯ ได้พระราชทานสิ่งของตอบแทนซึ่งเป็นของพื้นเมือง เช่น งาช้าง ดีบุก เนื้อไม้ และกำยาน เป็นต้นโดยภารกิจสำคัญของนาย Robert คือการเจรจาจัดทำสนธิสัญญาทางการค้ากับไทย เช่นเดียวกับที่ไทยได้ทำสนธิสัญญาและข้อตกลงทางการค้ากับสหราชอาณาจักรเมื่อ ปี 2369"
