["https://washingtondc.thaiembassy.org/en/page/bring-pets-to-thailand"]
title = "Bringing Pets into Thailand - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
full_description = "If you plan to travel to Thailand with pets, you must apply for an Import Permit at least 7 days (and no more than 60 days) prior to your departure. The application can be submitted via email to the Animal Quarantine Station (AQS) at the relevant port of entry: After receiving the Import Permit via email, contact a USDA-accredited veterinarian to issue the Official Health Certificate (OHC). Note: Only original OHCs with the USDA stamp will be accepted; electronic copies are not valid. Please find the USDA Endorsement Office in your area here. >> For hand carried pet: AQS (Port of entry) located next to carousel No. 8Tel. +(662) 134 0636 Business hours 24 hrs. daily >>For pet imported by air cargo: AQS (Cargo terminal: Free Zone Area, CE-1Building)Tel. +(662) 134 0731 Business hours 08.30 a.m.- 4.30 p.m. Monday – Friday 2. AQS at Don Mueang International Airport (Open 24 hrs. daily)Email: [email protected] | Tel. +(662) 504 3355 3. AQS at Chiang Mai International Airport (Open 24 hrs. daily)Email: [email protected] | Tel. +(665) 389 2453 4. AQS at Phuket International Airport (Open 24 hrs. daily) Email: [email protected] | Tel. +(667) 6351 514 5. AQS at Samui International Airport (Open 24 hrs. daily)Email: [email protected] | Tel. +(667) 7428 554 6. AQS (Trang’s) at Krabi International Airport (Open 24 hrs. daily)Email: [email protected] | Tel. +(667) 525 4218 1024 Wisconsin Ave. NW Suite 203, Washington DC 20007Tel. (202) 338 -1543 Email: [email protected] www.opsmoac.go.th/dc-home"
