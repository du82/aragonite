title = "วีซ่าสหรัฐฯ - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "วีซ่าสหรัฐฯ"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) เว็บไซต์นี้เป็นแหล่งรวบรวมข้อมูลเกี่ยวกับวีซ่าอย่างเป็นทางการของสถานทูตสหรัฐอเมริกาประจำประเทศไทย ตามที่สถานเอกอัครราชทูต/สถานกงสุลใหญ่ได้รับการตอบถามกรณีคนไทยบางส่วนประสบปัญหาวีซ่าใกล้หมดอายุและจำเป็นต้องยื่นเรื่องยืดเวลาการพำนักในสหรัฐฯ นั้น สถานเอกอัครราชทูตขอแนะนำ ดังนี้ 1. โปรดตรวจสอบระยะเวลาที่ท่านได้รับอนุญาตจากทางการสหรัฐฯ ให้พำนักอยู่ในสหรัฐฯ จากเอกสาร I-94 (ไม่ใช่ตรวจสอบจากอายุวีซ่าสหรัฐฯ ที่ปรากฏบนหนังสือเดินทาง) ทั้งนี้ ท่านสามารถตรวจสอบได้ที่ — https://i94.cbp.dhs.gov 2. หากพบว่า ระยะเวลาในการพำนักใกล้จะสิ้นสุดแล้ว หรือยังไม่แน่ใจช่วงเวลาการเดินทางกลับไทย หรือคาดว่าจะได้รับผลกระทบจากมาตรการห้ามสายการบินพาณิชย์ทำการบินเข้าไทย ขอให้พิจารณายื่นคำขอ extension of stay กับUSCIS ได้ที่ — www.uscis.gov/visit-united-states/extend-your-stay"
