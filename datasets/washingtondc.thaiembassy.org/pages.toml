["https://washingtondc.thaiembassy.org/th/content/20250110cmsfl-2"]
title = "กิจกรรมกงสุลสัญจร ณ วัดฟลอริดาธรรมาราม เมืองคิสซิมมี รัฐฟลอริดา - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "กิจกรรมกงสุลสัญจร ณ วัดฟลอริดาธรรมาราม เมืองคิสซิมมี รัฐฟลอริดา"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) เมื่อวันที่ ๑๐-๑๓ มกราคม ๒๕๖๘ ฝ่ายกงสุล สถานเอกอัครราชทูต ณ กรุงวอชิงตัน ได้เดินทางไปให้บริการด้านกงสุล ณ วัดฟลอริดาธรรมาราม เมืองคิสซิมมี รัฐฟลอริดา เพื่ออำนวยความสะดวกในการทำหนังสือเดินทางและบัตรประจำตัวประชาชน รวมไปถึงให้ข้อมูลและคำปรึกษางานกงสุลด้านอื่น ๆ เช่น การขอสูติบัตรไทย การรับรองเอกสาร การทำหนังสือมอบอำนาจ งานนิติกรณ์ ฯลฯ แก่คนไทยที่อาศัยอยู่ในเขตเมืองคิสซิมมีและเขตใกล้เคียงรัฐฟลอริดาตอนใต้ เช่น เมืองออร์แลนโด เมืองแทมปา เมืองแจ็คสันวิลล์ โดยได้เปิดให้บริการรอบพิเศษเพื่ออำนวยความสะดวกแก่ผู้สูงอายุที่มีอายุ ๗๐ ปีขึ้นไป โดยไม่ต้องลงทะเบียนนัดหมายล่วงหน้าด้วย โอกาสนี้ ดร. สุริยา จินดาวงษ์ เอกอัครราชทูต ณ กรุงวอชิงตัน ได้ไปร่วมให้บริการกงสุลสัญจรและพบกับผู้แทนชุมชนไทยในพื้นที่ รวมทั้งได้มอบประกาศนียบัตรแก่อาสาสมัครที่มีจิตอาสามาช่วยให้บริการประชาชนในครั้งนี้"
