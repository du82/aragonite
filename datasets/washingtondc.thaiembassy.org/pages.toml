["https://washingtondc.thaiembassy.org/th/content/20250207-3"]
title = "เอกอัครราชทูต ณ กรุงวอชิงตัน พบหารือกับ สส. Joe Wilson (R-SC) ประธานร่วม Thai-US Alliance Caucus เพื่อส่งเสริมความสัมพันธ์ไทย-สหรัฐฯ - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "เอกอัครราชทูต ณ กรุงวอชิงตัน พบหารือกับ สส. Joe Wilson (R-SC) ประธานร่วม Thai-US Alliance Caucus เพื่อส่งเสริมความสัมพันธ์ไทย-สหรัฐฯ"
full_description = "อัครราชทูต สถานเอกอัครราชทูต ณ กรุงวอชิงตัน พบปะชุมชนไทยและมิตรประเทศไทยในรัฐฟลอริดา 23 ม.ค. 2568 189 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน เดินทางเยือนนครลอสแอนเจลิส เพื่อดูแลการให้ความช่วยเหลือคนไทยที่ได้รับผลกระทบจากสถานการณ์ไฟป่า 23 ม.ค. 2568 213 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน เป็นเจ้าภาพเลี้ยงอาหารค่ำแก่กลุ่ม Friends of Thailand และภาคธุรกิจจากรัฐฟลอริดา 29 ม.ค. 2568 144 Viewอ่านต่อ กิจกรรมกงสุลสัญจร ณ วัดฟลอริดาธรรมาราม เมืองคิสซิมมี รัฐฟลอริดา 29 ม.ค. 2568 285 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน เข้าร่วมงาน International Red Cross Ball ครั้งที่ ๖๔ 29 ม.ค. 2568 159 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน พบหารือกับผู้บริหารบริษัท Boeing บริษัท Microsoft และบริษัท Amazon ในระหว่างการเดินทางไปราชการที่รัฐวอชิงตัน 30 ม.ค. 2568 140 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน นำทีมประเทศไทยจัดกิจกรรมจิตอาสาบำเพ็ญสาธารณประโยชน์ เพื่อเฉลิมพระเกียรติพระบาทสมเด็จพระเจ้าอยู่หัว เนื่องในโอกาสพระราชพิธีสมมงคลพระชนมายุเท่าพระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกมหาราช สมเด็จพระปฐมบรมกษัตริยาธิราชแห่งราชวงศ์จักรี พุทธศักราช ๒๕๖๘ 1 ก.พ. 2568 116 Viewอ่านต่อ"
