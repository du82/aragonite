["https://washingtondc.thaiembassy.org/th/page/%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%97%E0%B8%AB%E0%B8%B2%E0%B8%A3"]
title = "การทหาร - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "การทหาร"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) ประเทศไทยและสหรัฐฯ มีความสัมพันธ์ที่ดำเนินมาอย่างใกล้ชิดนับตั้งแต่ได้เริ่มสถาปนาความสัมพันธ์ทางการทูต เมื่อปี พ.ศ.2376 ทั้งในด้านการเมือง ความมั่นคง และเศรษฐกิจ ในช่วงหลังสงครามโลกครั้งที่ 2 และยุคสงครามเย็น ความสัมพันธ์ได้มุ่งเน้นด้านความมั่นคงซึ่งเป็นผลสืบเนื่องมาจากปัจจัยภายนอกที่สำคัญได้แก่ ภัยคุกคามจากลัทธิคอมมิวนิสต์ โดยที่ไทยและสหรัฐฯ มีแนวความคิดสอดคล้องกันที่ต้องการต่อต้านและปิดล้อมการแพร่ขยายของลัทธิคอมมิวนิสต์ และสหรัฐฯ ในฐานะเป็นผู้นำในการปกป้องลัทธิเสรีนิยมและอุดมการณ์ประชาธิปไตยจึงได้ให้ความสำคัญกับประเทศไทยในฐานะพันธมิตร และเป็นประเทศที่มีความสำคัญทางยุทธศาสตร์โดยเฉพาะในเรื่องภูมิรัฐศาสตร์เป็นตัวแทนของโลกเสรีในเอเชียตะวันออกเฉียงใต้ ดังนั้น ใน พ.ศ.2493 สมัยรัฐบาล จอมพล ป. พิบูลสงคราม จึงได้จัดทำความตกลงว่าด้วยความช่วยเหลือทางทหารกับรัฐบาลสหรัฐฯ โดยเน้น เรื่องความมั่นคงเป็นหลัก พร้อมกันนั้นรัฐบาลไทยได้จัดกำลังจากทุกเหล่าทัพสนับสนุนสหรัฐฯ ในสงครามเกาหลี ตามมติสหประชาชาติอันเป็นจุดกำเนิดของการปฏิบัติการร่วมสมัยใหม่ และเป็นการพัฒนาความสัมพันธ์ทางทหารระหว่างไทยกับสหรัฐฯ ในเวลาต่อมา"
year_published = 2000
