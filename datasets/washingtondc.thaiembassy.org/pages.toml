description = "เอกอัครราชทูต ณ กรุงวอชิงตัน พบหารือกับ สส. Chris Smith (R-NJ)"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) เมื่อวันศุกร์ที่ ๗ กุมภาพันธ์ ๒๕๖๘ ดร.สุริยา จินดาวงษ์ เอกอัครราชทูต ณ กรุงวอชิงตัน ได้พบหารือกับ สส. Chris Smith (R-NJ) ตำแหน่ง Co-Chair ของ Congressional-Executive Commission on China (CECC) และ Tom Lantos Human Rights Commission ในโอกาสนี้ ทั้งสองฝ่ายได้หารือเกี่ยวกับแนวทางการส่งเสริมความสัมพันธ์และความร่วมมือระหว่างไทย-สหรัฐฯ โดยเฉพาะในด้านการค้า การลงทุน การพัฒนา และการส่งเสริมและปกป้องสิทธิมนุษยชน รวมถึงการต่อต้านการค้ามนุษย์และอาชญากรรมข้ามชาติ ฝ่ายกงสุล สถานเอกอัครราชทูตฯ 2300 Kalorama Road, N.W. Washington, D.C. 20008 วันและเวลาทำการ วันจันทร์ - วันศุกร์ เวลา 09.00-17.00น."
