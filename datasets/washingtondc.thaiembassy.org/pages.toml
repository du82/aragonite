title = "แบบฟอร์มกงสุล - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "แบบฟอร์มกงสุล"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) 1. แบบฟอร์มงานหนังสือเดินทาง (Passport Application Forms) 1.1 คำร้องขอหนังสือเดินทางอิเล็กทรอนิกส์ (E-Passport Application Form) 1.3 คำให้การหนังสือเดินทางหาย สำหรับกรณีหนังสือเดินทางหาย/ขาดอายุเกินกว่า 1 ปี หรือยื่นขอหนังสือเดินทางเป็นเล่มแรก (Lost Passport Report) 1.4 คำร้องขอหนังสือเดินทาง/เอกสารเดินทางฉุกเฉิน (Emergency Passport Form/Emergency Travel Document Form) 1.5 แบบฟอร์มจดหมายชื้แจงเหตุผลในการเดินทางด่วน 2.1 คำร้องขอทำบัตรประจำตัวประชาชน (Thai ID Card Application Form) 2.2 บันทึกสอบปากคำ กรณีบัตรประชาชนหมดอายุเกิน 1 ปี หรือบัตรสูญหาย (Investigating Form in case the ID card is expired greater than a year or is lost) 3. แบบฟอร์มงานนิติกรณ์และรับรองเอกสาร (Legalization Forms) 3.2 แบบฟอร์มรับรองลายมือชื่อ (Notary Public for Signature Form) 3.5 หนังสือรับรองทรัพย์สินการซื้อที่ดิน 3.7 หนังสือมอบอำนาจสำหรับขอเปลี่ยนนามสกุลในระบบทะเบียนราษฎร 3.8 หนังสือมอบอำนาจสำหรับขอย้ายชื่อออกจากทะเบียนบ้านกลาง"
