["https://washingtondc.thaiembassy.org/en/page/eastern-economic-corridor-eec"]
title = "Eastern Economic Corridor (EEC) - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "Eastern Economic Corridor (EEC)"
full_description = "The Eastern Economic Corridor (EEC) development lies at the heart of Thailand 4.0 scheme. The project is an area-based development initiative, aiming to revitalize the well-known Eastern Seaboard where, for 30 years, numerous business developers have experienced a rewarding investment journey and exceptional achievements. The project initially focused on the 3 Eastern provinces, namely Rayong, Chonburi, and Chachoengsao. The EEC development plan envisages a significant transformation of both physical and social development, plays an important role as a regulatory sandbox uplifting the country’s competitiveness. The EEC’s 12 targeted S-curve industries are: cars; smart electronics; affluent, medical and wellness tourism; agriculture and biotechnology; food; robotics for industry; logistics and aviation; biofuels and biochemicals; digital; medical services; defense; and education development. The EEC aims to bring innovation to improve the quality of living, through “7 Smarts” solutions – Smart Mobility, Smart People, Smart Living, Smart Economy, Smart Governance, Smart Energy and Smart Environment. The overall plan is to create a “Livable Smart City” for its residents and investors where technological integration, low carbon emission, a circular economy, and access to good public healthcare and education will not only create an environment suited for innovation, but also for sustainable living. The EEC has designated 21 Promoted Zones to be a location for the 12 targeted industries. Investors will be eligible to receive both tax and non-tax privileges."
year_published = 2023
