title = "การเข้าเยี่ยมชมทำเนียบขาว - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "การเข้าเยี่ยมขมทำเนียบขาว"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) ตั้งแต่เกิดเหตุการณ์ 9/11 เมื่อปี 2544 การรักษาความปลอดภัยของสถานที่ราชการต่าง ๆ ในสหรัฐฯ มีความเข้มงวดมากขึ้น โดยเฉพาะทำเนียบขาวซึ่งเป็นทั้งที่ทำการและที่พำนักของประธานาธิบดีและครอบครัว จึงทำให้การเข้าไปเยี่ยมชมภายในทำเนียบขาวไม่ง่ายนัก ถึงแม้ว่าในเว็บไซต์ของทำเนียบขาวในหัวข้อการเยี่ยมชมทำเนียบขาว ระบุว่าในกรณีสำหรับชาวต่างชาติที่ต้องการจะเข้าเยี่ยมชมจะต้องติดต่อสถานเอกอัครราชทูตฯ เพื่อยื่นคำร้องเพื่อขอเยี่ยมชมนั้น แต่ตั้งแต่ ปี 2554 เป็นต้นมา กระทรวงการต่างประเทศ สหรัฐฯ ได้ยกเลิกการรับบริการรับคำร้องในการเยี่ยมชมทำเนียบขาวสำหรับบุคคลทั่วไป จึงทำให้สถานเอกอัครราชทูตฯ ไม่สามารถดำเนินการใด ๆ ได้ อย่างไรก็ดี เมื่อใดที่กระทรวงการต่างประเทศ สหรัฐฯ เปิดรับคำร้องอีกครั้ง สถานเอกอัครราชทูตฯ จะประกาศให้ทราบโดยทั่วกัน"
