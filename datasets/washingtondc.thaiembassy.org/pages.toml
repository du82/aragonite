full_description = 'เอกอัครราชทูต ณ กรุงวอชิงตัน นมัสการและให้กำลังใจพระสงฆ์วัดอุษาพุฒยาราม นครนิวยอร์ก ซึ่งประสบเหตุอัคคีภัย 27 ก.พ. 2568 27 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน ร่วมรับชมซีรีส์ "The White Lotus” ภาค ๓ ตอนที่ ๒ รอบพิเศษ ตามคำเชิญของ MPA และ HBO 27 ก.พ. 2568 16 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน ให้การต้อนรับรัฐมนตรีว่าการกระทรวงพาณิชย์และคณะในโอกาสเดินทางมาราชการที่กรุงวอชิงตัน 14 ก.พ. 2568 102 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน พบหารือกับ สส. Joe Wilson (R-SC) ประธานร่วม Thai-US Alliance Caucus เพื่อส่งเสริมความสัมพันธ์ไทย-สหรัฐฯ 14 ก.พ. 2568 92 Viewอ่านต่อ สารแสดงความเสียใจ กรณีเหตุเพลิงไหม้วัดอุษาพุฒยาราม เขตบรองซ์ นครนิวยอร์ก 13 ก.พ. 2568 152 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน พบหารือกับ สส. Chris Smith (R-NJ) 10 ก.พ. 2568 103 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน พบปะชุมชนไทยในกรุงวอชิงตันและพื้นที่ใกล้เคียง 10 ก.พ. 2568 94 Viewอ่านต่อ'
