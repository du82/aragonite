title = "Thai National ID Card Information - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
full_description = "The appointment slot for Thai National Identification Card (Thai ID card) is reserved exclusively for those who are obtaining the Thai ID card only. If you need to apply for a passport but your Thai ID card has expired or is lost, please schedule an appointment solely for the passport application. The officer will allow you to receive a service for Thai ID card on the same day. 1. Thai nationals who would like to renew their ID card (expired / lost / damaged / change of name or address) 3. An applicant's personal information must match with the central database of the Ministry of Interior 4. An applicant who has never been issued a Thai National ID card is NOT eligible to obtain a Thai National ID card abroad. The applicant may apply for the first Thai National ID card in Thailand. Click here for more information 1. It is recomended to schedule an appointment online in advance and print out the confirmation of appointment application and submit it in person on the appointment day (Monday-Friday from 9.00 am-12.30 pm/ 1.30 pm-5.00 pm) at the address below: 2. Mobile Consular Services The Royal Thai Embassy will provide consular services in different states throughout a year. An applicant may check the schedule and make an online appointment through the Embassy’s website under “Mobile Consular Services” 4. Proof of name change or address in Thai system such as a copy of a new Thai House Registration, Thai Name Change Certificate or Thai Marraige/Divorce Certificate. Note: Applicants must submit all the required documents. Otherwise, the officer reserves the right to refuse service if the documents are incomplete."
