title = "ชุมชนไทย - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "ชุมชนไทย"
full_description = "สารแสดงความเสียใจ กรณีเหตุเพลิงไหม้วัดอุษาพุฒยาราม เขตบรองซ์ นครนิวยอร์ก 13 ก.พ. 2568 152 Viewอ่านต่อ กิจกรรมกงสุลสัญจร ณ วัดฟลอริดาธรรมาราม เมืองคิสซิมมี รัฐฟลอริดา 28 ม.ค. 2568 284 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน เดินทางเยือนนครลอสแอนเจลิส เพื่อดูแลการให้ความช่วยเหลือคนไทยที่ได้รับผลกระทบจากสถานการณ์ไฟป่า 23 ม.ค. 2568 212 Viewอ่านต่อ อัครราชทูต สถานเอกอัครราชทูต ณ กรุงวอชิงตัน พบปะชุมชนไทยและมิตรประเทศไทยในรัฐฟลอริดา 23 ม.ค. 2568 189 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน เป็นประธานในพิธีสวดพระพุทธมนต์และถวายภัตตาหารเพล ถวายพระราชกุศลพระบาทสมเด็จพระเจ้าอยู่หัว เนื่องในโอกาสพระราชพิธีสมมงคลพระชนมายุเท่าพระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกมหาราช สมเด็จพระปฐมบรมกษัตริยาธิราชแห่งหระราชวงศ์จักรี พ.ศ. ๒๕๖๘ 15 ม.ค. 2568 275 Viewอ่านต่อ เอกอัครราชทูต ณ กรุงวอชิงตัน เป็นประธานพิธีเจริญพระพุทธมนต์และทำบุญตักบาตรถวายพระราชกุศล เนื่องในวันคล้ายวันพระบรมราชสมภพพระบาทสมเด็จพระบรมชนกาธิเบศร มหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร วันชาติ และวันพ่อแห่งชาติ ๕ ธันวาคม ๒๕๖๗ 4 ธ.ค. 2567 468 Viewอ่านต่อ"
