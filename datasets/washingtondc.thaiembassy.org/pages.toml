title = "ข้อมูลทั่วไป - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "ข้อมูลทั่วไป"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) สหรัฐอเมริกา หรือ United States of America (USA) เป็นสหพันธรัฐที่มีการปกครองแบบประชาธิปไตยอิงกับรัฐธรรมนูญ ประกอบด้วย 50 รัฐ และ 1 เขตปกครองพิเศษ โดย 48 รัฐและเขตปกครองของรัฐบาลกลางแห่งกรุงวอชิงตันมีพื้นที่เชื่อมต่อกัน ตั้งอยู่ในแถบอเมริกาเหนือระหว่างประเทศแคนาดาและประเทศเม็กซิโก รัฐอะแลสกาอยู่ทางตะวันตกเฉียงเหนือของอเมริกาเหนือ และรัฐฮาวายเป็นหมู่เกาะอยู่กลางมหาสมุทรแปซิฟิก โดยสหรัฐฯ ยังมีอาณาเขตอีก 5 แห่งที่มีประชากรอาศัยอยู่ ได้แก่ อเมริกันซามัว, กวม, หมู่เกาะนอร์เทิร์นมาเรียนา, เปอร์โตริโก และ หมู่เกาะเวอร์จิน และมีอาณาเขตอีก 9 แห่งเป็นพื้นที่ว่างเปล่าที่ไม่มีผู้อยู่อาศัย ซึ่งเขตเหล่านี้ตั้งอยู่ในมหาสมุทรแปซิฟิกและทะเลแคริเบียน 1 เขตการปกครองพิเศษ – กรุงวอชิงตัน (District of Columbia or Washington D.C.)"
