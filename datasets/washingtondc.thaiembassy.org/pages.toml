["https://washingtondc.thaiembassy.org/en/page/bio-circular-green-economic-mode-bcg"]
title = "Bio-Circular-Green Economic Model (BCG) - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "Bio-Circular-Green Economic Model (BCG)"
full_description = "Bio-Circular-Green Economic Model or BCG has been introduced by the research community and promoted by the Thai government as a new economic model for inclusive and sustainable growth. The BCG model capitalizes the country’s strengths in biological diversity and cultural richness and employs technology and innovation to transform Thailand to a value-based and innovation-driven economy. The model also conforms with the UN Sustainable Development Goals (SDGs) and is also intended to align with the Sufficiency Economy Philosophy (SEP) which is also the key principle of Thailand’s social and economic development. The BCG strategy consists of 4 drivers and 4 enablers, involving the government, industry, communities, academia and international organizations. 4. BCG Frontier Research/ Knowledge. The following cutting-edge areas have been identified as important to the development of BCG: 1. BCG Regulatory Framework. This enabler aims at reviewing and making amendments to laws and regulations in order to build an innovation ecosystem, support technology sandbox and enable product life cycle assessment. 2. BCG Infrastructure & Facility Development. The following facilities will be developed and supported: 3. BCG Capacity Building. This enabler aims at developing manpower in various fields and at all levels from students to the current workforce. The fields that will be in demand in BCG model include taxonomy, system biology, bioinformatics, life sciences, computer engineering and data science. 4. BCG Global Network. Collaboration with international partners will be developed in the forms of research collaboration, technology demonstration, technology localization, or joint investment."
year_published = 2023
clearnet = "https://washingtondc.thaiembassy.org/en/page/bio-circular-green-economic-mode-bcg"
