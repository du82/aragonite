["https://washingtondc.thaiembassy.org/th/content/20250221ny-2"]
title = "เอกอัครราชทูต ณ กรุงวอชิงตัน นมัสการและให้กำลังใจพระสงฆ์วัดอุษาพุฒยาราม นครนิวยอร์ก ซึ่งประสบเหตุอัคคีภัย - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "เอกอัครราชทูต ณ กรุงวอชิงตัน นมัสการและให้กำลังใจพระสงฆ์วัดอุษาพุฒยาราม นครนิวยอร์ก ซึ่งประสบเหตุอัคคีภัย"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) เมื่อวันที่ 21 กุมภาพันธ์ 2568 ดร.สุริยา จินดาวงษ์ เอกอัครราชทูต ณ กรุงวอชิงตัน พร้อมด้วย น.ส.สมใจ ตะเภาพงษ์ กงสุลใหญ่ ณ นครนิวยอร์ก และคณะ ได้เดินทางไปนมัสการพระสุธรรม ฐิตธัมโม เจ้าอาวาสวัดอุษาพุฒยาราม นครนิวยอร์ก และพระสงฆ์วัดอุษาพุฒยาราม ซึ่งจำวัดอยู่ที่วัดพุทธไทยถาวรวนาราม นครนิวยอร์ก และ วัดวชิรธรรมปทีป เมาท์เวอร์นอน เป็นการชั่วคราว เพื่อให้กำลังใจและแสดงความพร้อมในการให้ความช่วยเหลือจากเหตุการณ์อัคคีภัยที่เกิดขึ้น โอกาสนี้ เอกอัครราชทูตฯ ได้เป็นประธานในพิธีถวายผ้าบังสุกุลและถวายภัตตาหารเพลแด่พระสงฆ์ ร่วมกับชุมชนชาวไทย ณ วัดพุทธไทยถาวรวนาราม นครนิวยอร์ก และได้ถวายเครื่องไทยธรรมแด่พระสงฆ์ ณ วัดวชิรธรรมปทีป เพื่ออุทิศส่วนกุศลให้แก่พระมหาดิเรก วุฑฺฒินฺธโร (ชมภูนิตย์) ที่มรณภาพและนายธนภัทร ชนะรัตน์ ที่เสียชีวิตจากเหตุอัคคีภัยที่วัดอุษาพุฒยารามฯ ด้วย"
