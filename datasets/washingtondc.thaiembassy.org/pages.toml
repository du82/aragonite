["https://washingtondc.thaiembassy.org/en/page/visa-information"]
title = "Visa Information - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "Visa Information"
full_description = "A Thai visa is an official document issued by the Thai government that allows a foreign national to enter, stay, and/or travel within Thailand for a specific period of time. The type of visa required depends on the purpose of the visit, such as tourism, business, education, retirement, or other reasons. To apply or check whether a visa is required, please visit www.thaievisa.go.th Please be informed that the Royal Thai Embassy is unable to issue visas for foreign nationals who are currently in Thailand. Visa applications submitted through the Royal Thai Embassy in Washington, D.C. will typically take approximately 15 business days to process. During this period, you may check the status of your visa through the online visa system. If you receive an email requesting additional documents, the updated status of your visa will be available within 3 to 5 business days from the date you upload the requested documents to the system. It is advisable to plan and apply for a visa at least 30 days prior to the departure date; however, applications should not be submitted more than 90 days in advance, as the validity of most visas is typically only 90 days and effective from the date of issuance. If you apply too early, the visa may expire before your travel date, necessitating a re-application and an additional payment. Please kindly be informed that consular officers reserve the right to request additional documents as deemed necessary and may reject any application without the obligation to provide justification. The visa application fee will depend on the type of visa being applied for. Information regarding the fees for each visa category can be found at Visa Types / Fees / Validity It is important to note that the visa fee is non-refundable. Applicants are advised to verify all information for accuracy before clicking the submit button, particularly if they are using auto-fill or auto-correct functions. Entering first, middle, and last name incorrectly, such as not matching it exactly as it appears on a passport, can lead to visa application denial. Ensure that the name is entered exactly as it appears on the passport. If using the automatic system to capture information from the passport, please review the details carefully before clicking the SUBMIT button."
year_published = 2023
year_updated = 2023
