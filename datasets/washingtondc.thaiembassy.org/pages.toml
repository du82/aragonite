title = "เศรษฐกิจ - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "เศรษฐกิจ (ความสัมพันธ์ไทย-สหรัฐฯ)"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) สหรัฐอเมริกาและไทยมีประวัติความเป็นมาอันยาวนานของความร่วมมือด้านการค้า ซึ่งย้อนไปถึงสนธิสัญญาไมตรีและความสัมพันธ์ทางเศรษฐกิจระหว่างสหรัฐอเมริกากับไทยในปี พ.ศ. 2376 รวมถึง TIFA ที่ลงนามในเดือนตุลาคม พ.ศ. 2545 นอกจากนี้สหรัฐอเมริกาและไทยยังได้ร่วมมือกันผ่านพหุภาคีอีกด้วยในกรอบเศรษฐกิจอินโดแปซิฟิกเพื่อความเจริญรุ่งเรือง (IPEF) และฟอรัมความร่วมมือทางเศรษฐกิจเอเชียแปซิฟิก (APEC) ภาพรวมการค้า-การลงทุนไทย-สหรัฐฯ ปี 2566 ไทยและสหรัฐฯ มีสนธิสัญญาไมตรีและการพาณิชย์ตั้งแต่ปี 2376 (The U.S.-Thai Treaty of Amity and Economic Relations of 1833 – Treaty of Amity) นับถึงปัจจุบันมีทั้งสิ้น 5 ฉบับ ฉบับปัจจุบันได้ลงนามเมื่อวันที่ 29 พฤษภาคม 2509 มีขอบเขตความร่วมมือครอบคลุมกว้างขวางทางด้านมิตรภาพ การพาณิชย์ และการเดินเรือ ครอบคลุมธุรกิจบริการทั้งหมด ยกเว้นธุรกิจ 6 ประเภท ได้แก่ การสื่อสาร การขนส่ง การดูแลทรัพย์สินเพื่อประโยชน์ของผู้อื่น การธนาคารที่เกี่ยวข้องกับการรับฝากเงิน การค้าภายในที่เกี่ยวกับผลิตผลทางการเกษตรพื้นเมือง และการแสวงหาผลประโยชน์จากที่ดินและทรัพยากรธรรมชาติอื่นๆ โดยสนธิสัญญาฉบับ 2509 นี้ให้ผลประโยชน์หลักแก่นักลงทุนต่างชาติ 2 ประการ ได้แก่"
