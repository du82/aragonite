["https://washingtondc.thaiembassy.org/en/page/common-questions-faqs"]
title = "Frequently Ask Questions (FAQs) for VISA - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "Common Questions / FAQs"
full_description = '''All visa applications must be submitted through the e-Visa portal (https://thaievisa.go.th/). Please note that applicants are no longer required to mail anything to the Embassy and the Embassy does not accept walk-in or drop-off for the visa services at the moment. The Royal Thai Embassy and Royal Thai Consulate-General in the United States are currently using a new e-Visa system which no longer requires for e-Visa applicant to submit his/her passport and original supporting documents through mail/in-person. After the e-Visa application has been approved, a confirmation e-mail will be sent to applicants. It is kindly requested to print a copy of the confirmation e-mail to present to airline and Thai Immigration officials to carry out checks when traveling to Thailand. *If the purpose is for vacation and will stay less than 60 days in Thailand, U.S. passport holders don't need a visa. This is called "VISA EXEMPTION". (The period of stay can be extended for another period of not exceeding 30 days.) However, extension of stay is solely at the discretion of the immigration officer. 2. If you need a visa, you may apply for E-visa at www.thaievisa.go.th - If the visa application is approved, you will receive the visa through email- If the Embassy needs more information/document, the Embassy will send a request email to the applicant For more information regarding the E-visa, you may also check the webpage to see the Video User Manual (click here) or download the Manual here Many factors play a role in the visa processing times i.e. Is your application is filled out correctly and accompanied by all needed documents, The order the visa application is received in comparison to other visa applications. However, you should see the updates on your visa application dashboard within 15 business days. (To check status, please sign in to the www.thaievisa.go.th or read below) Due to the number of applications, the embassy can not check status for each individuals.The applicant must check their visa status through www.thaievisa.go.th (click here to see how to check the status online)'''
year_published = 2023
