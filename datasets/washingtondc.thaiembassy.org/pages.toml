["https://washingtondc.thaiembassy.org/en/page/certify-us-documents-2"]
title = "Authentication of U.S. Documents - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "Legalization"
full_description = "The Royal Thai Embassy in Washington, D.C. can legalize documents which are originally issued in the Royal Thai Embassy's jurisdiction ONLY, which are Alabama, District of Columbia, Delaware, Florida, Georgia Louisiana, Maryland, Mississippi, North Carolina, South Carolina, Tennessee, Texas, Virginia, West Virginia, and Puerto Rico Authentication of documents refers to the process of validating and authenticating official documents issued by U.S. government agencies. This process ensures that the documents are genuine, accurate, and recognized as valid by other entities, such as foreign governments or institutions. Authentication is often required when documents are used internationally or for legal purposes outside the United States. According to the regulations issued by the Ministry of Foreign Affairs of Thailand, the Royal Thai Embassy are authorized to legalize documents bearing the Seal of the United States Department of State only, and do NOT accept Apostille. 3.1 State level: Please have the documents issued by U.S. agencies authenticated at the state level, specifically at the Secretary of State's office in the state where the documents were issued. Please CLICK HERE to check the state or territory that you need to contact for document authentication assistance. 3.2 Federal level: Please have the documents, which have already been authenticated at the state level by the Secretary of State’s office in the state where they were issued, further authenticated by the U.S. Department of State. Please CLICK HERE for more details on how to proceed with this level with the Authentication office, the U.S. Department of State. 3.3 Royal Thai Embassy level: Please have the documents, which have already been authenticated at both the state level by the Secretary of State’s office in the state where they were issued and at the federal level by the U.S. Department of State, submitted to the Royal Thai Embassy for further authentication. Please see below for supporting documents required for submission for authentication at the Royal Thai Embassy."
year_published = 2023
