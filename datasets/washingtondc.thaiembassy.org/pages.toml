title = "คำถามที่พบบ่อยเกี่ยวกับการทำบัตรประจำตัวประชาชน - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) คำถามที่พบบ่อยเกี่ยวกับการทำบัตรประจำตัวประชาชน 1. สามารถยื่นขอทำบัตรประจำตัวประชาชนผ่านทางไปรษณีย์ได้หรือไม่ ไม่ได้ เนื่องจากต้องมีการบันทึกข้อมูลชีวภาพ อาทิ ลายนิ้วมือ รูปถ่าย เพื่อบันทึกลงในบัตรประจำตัวประชาชน ดังนั้น จึงต้องเดินทางมาด้วยตนเอง ทั้งนี้ท่านจะได้รับบัตรประจำตัวประชาชนใบใหม่ทันทีในวันที่มารับบริการ 2. สามารถขอรับการบริการโดยไม่ต้องทำนัดหมายล่วงหน้าได้หรือไม่ เจ้าหน้าที่แนะนำให้ผู้ที่ประสงค์ขอทำบัตรประจำตัวประชาชน ทำนัดหมายล่วงหน้าในระบบนัดหมายออนไลน์ คลิกที่นี่เพื่อนัดหมายออนไลน์ขอทำบัตรประจำตัวประชาชน เนื่องจากเมื่อทำนัดหมายสำเร็จ ท่านจะได้รับอีเมลยืนยันนัดหมายสำเร็จจากระบบตอบรับอัตโนมัติทันที โดยในอีเมลจะระบุวันและเวลานัดหมายที่ท่านได้เลือกไว้ พร้อมทั้ง Checklist ของเอกสารที่จะต้องนำมายื่นในวันขอรับบริการ เพื่ออำนวยความสะดวกให้ท่านในการจัดเตรียมเอกสารมาครบถ้วนและหลีกเลี่ยงการรอเข้ารับบริการเป็นระยะเวลานาน หรือแม้กระทั่งการทำบัตรประจำตัวประชาชนไม่ได้ นอกจากนี้ เจ้าหน้าที่จะให้บริการแก่ผู้ที่มีนัดหมายล่วงหน้าก่อนจึงจะสามารถให้บริการแก่ผู้ที่ไม่มีนัดหมายล่วงหน้าได้"
year_published = 2025
clearnet = "https://washingtondc.thaiembassy.org/th/page/faqidcards"
tags = ["ท.ร.", "นครชิคาโก", "ฝ่ายกงสุล", "หรือ", "อีเมล", "เท่านั้น", "ได้ที่นี้", "ไม่ได้"]
