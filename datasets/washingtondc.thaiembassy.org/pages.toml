["https://washingtondc.thaiembassy.org/th/page/callcenterscamwarning"]
title = "เตือนภัย ขบวนการ Call Center กลับมาก่อกวนหนัก โปรดตั้งสติ อย่าหลงเชื่อเด็ดขาด - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) 🚨เตือนภัย ขบวนการ Call Center กลับมาก่อกวนหนัก โปรดตั้งสติ อย่าหลงเชื่อเด็ดขาด กลุ่มมิจฉาชีพเหล่านี้ อาจทราบชื่อ นามสกุล หรือแม้กระทั่งเลขประจำตัวประชาชนของท่าน และพูดจาหว่านล้อม/ข่มขู่ให้ท่านยืนยันข้อมูลส่วนบุคคล โอนเงิน รวมไปถึงให้รายงานตัวผ่านแอปพลิเคชัน LINE ทุกวัน หากได้รับโทรศัพท์ที่น่าสงสัย ทั้งที่เป็นภาษาไทยและภาษาอังกฤษ โดยใช้คำพูด เช่น- แจ้งว่าพบหนังสือเดินทางของท่านที่สนามบินในประเทศไทย- อ้างตัวว่าเป็นเจ้าหน้าที่หน่วยงานรัฐ เช่น เจ้าหน้าที่จากสถานเอกอัครราชทูตฯ สถานกงสุลใหญ่ฯ ของไทยในสหรัฐฯ และประเทศอื่น ๆ หรือเจ้าหน้าที่ตำรวจ/เจ้าหน้าที่หน่วยงานความมั่นคง และข่มขู่ว่าหากท่านไม่ยืนยันข้อมูลส่วนตัว อาจจะถูกดำเนินคดีขอให้ท่านดำเนินการ ดังนี้"
