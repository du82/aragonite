title = "Diplomatic Relations - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "Diplomatic Relations"
full_description = "Thailand and the United States have been friends for almost two centuries. There are many unique and special elements in our bilateral relations. First of all, one reason for the strength of the Thai – U.S. relationship stems from the fact that we both go back a long way and have been through a lot together. Our formal relations extend back 182 years to the signing of the Treaty of Amity and Commerce between our two nations on March 20, 1833, during the Presidency of Andrew Jackson, the seventh United States President, and the reign of His Majesty King Phra Nang Klao, or King Rama III of the Chakri Dynasty. With the signing of such Treaty, the two countries pledged to establish “a perpetual peace” between each other, a vow that has certainly withstood the test of time. We, in Thailand, recall with gratification that this Treaty was the first such Treaty that the United States had concluded with any Asian country. His Majesty King Bhumibol Adulyadej Maharaj, our present King, was born some 80 years ago in Cambridge, Massachusetts, where his father, His Royal Highness Prince Mahidol, was studying medicine at the Harvard Medical School. Since his accession to the throne over 60 years ago, His Majesty the King has paid two visits to the United States — first in 1960, and again in 1967. President and Mrs. Clinton visited Thailand in November of 1996 in celebration of the 50th anniversary of His Majesty’s accession to the throne. This marked the first visit by a sitting U.S. President since the visit of President Nixon 27 years earlier in 1969. In the October of 2003, President George W. Bush visited Bangkok to attend the APEC Summit Meeting. President Bush returned again in August of 2008, when he attended a meeting with Prime Minister Samak Sundaravej. Onhisfirst trip abroad after his re-election, President Barack Obama visited Bangkok from November 14-15, 2012. President Obama was welcomed by Prime Minister Yingluck Shinawatra and had an audience with King Bhumibol Adulyadej."
year_published = 2023
