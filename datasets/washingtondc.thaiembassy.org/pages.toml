["https://washingtondc.thaiembassy.org/th/page/%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%87"]
title = "การเมือง - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "การเมือง"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) สหรัฐอเมริกามีระบอบการปกครองในแบบสหพันธรัฐ (Federal Republic) ที่มีการแบ่งแยกอำนาจออกเป็น 3 ฝ่าย ตามบทบัญญัติรัฐธรรมนูญ ที่แต่ละฝ่ายจะได้รับเลือกในลักษณะที่แตกต่างกัน และมีการตรวจสอบและถ่วงดุลอำนาจซึ่งกันและกัน (check and balance) ดังนี้ มีประธานาธิบดีเป็นประมุขและเป็นหัวหน้ารัฐบาล (Chief of Executive) ได้รับเลือกจากการเลือกตั้งทั่วไป ร่วมกับรองประธานาธิบดีทุก 4 ปี ในวันอังคารแรกหลังวันจันทร์แรกของเดือนพฤศจิกายน ประธานาธิบดีมาจากการเลือกตั้งผ่านคณะผู้เลือกตั้ง (Electoral College) จำนวน 538 คน ดำรงตำแหน่งไม่เกิน 2 สมัย สมัยละ 4 ปี ประธานาธิบดีจะเป็นผู้ร่างรัฐบัญญัติต่อรัฐสภา และทำหน้าที่เป็นผู้บัญชาการทหารสูงสุด ผู้ทำสนธิสัญญาต่างๆ ตลอดจนแต่งตั้งผู้พิพากษาเอกอัครราชทูตและตำแหน่งต่างๆของฝ่ายบริหารตั้งแต่ระดับรองผู้ช่วยรัฐมนตรี (Deputy Assistant Secretary) ขึ้นไป"
