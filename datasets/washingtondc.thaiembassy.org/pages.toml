description = "Invest in Thailand"
full_description = "If you wish to set up an operation in Thailand, your best contact point is the Office of the Board of Investment (BOI). The Eastern Economic Corridor (EEC) is an area-based development initiative, aiming to revitalize the well-known Eastern Seaboard. The project initially focused on the 3 Eastern provinces, namely Rayong, Chonburi, and Chachoengsao. The EEC’s 12 targeted S-curve industries are: cars; smart electronics; affluent, medical and wellness tourism; agriculture and biotechnology; food; robotics for industry; logistics and aviation; biofuels and biochemicals; digital; medical services; defense; and education development. To learn more about investment in Thailand, please go to: http://www.thinkasiainvestthailand.com or contact Thailand Board of Investment offices near you. – USA (Alaska, Arizona, California, Colorado, Hawaii, Idaho, Montana, Nevada, Oregon, Utah, Washington, Wyoming) – USA (Alabama, Arkansas, Connecticut, Delaware, District of Columbia, Florida, Georgia, Illinois, Indiana, Iowa, Kansas, Kentucky, Louisiana, Maine, Maryland, Massachusetts, Michigan, Minnesota, Mississippi, Missouri, Nebraska, New Hampshire, New Jersey, New Mexico, New York, North Carolina, North Dakota, Ohio, Oklahoma, Pennsylvania, Rhode Island, South Carolina, South Dakota, Tennessee, Texas, Vermont, Virginia, West Virginia, Wisconsin)"
