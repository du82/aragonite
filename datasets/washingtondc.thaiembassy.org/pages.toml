["https://washingtondc.thaiembassy.org/th/content/2025011401"]
title = "เอกอัครราชทูต ณ กรุงวอชิงตัน เดินทางเยือนนครลอสแอนเจลิส เพื่อดูแลการให้ความช่วยเหลือคนไทยที่ได้รับผลกระทบจากสถานการณ์ไฟป่า - สถานเอกอัครราชทูต ณ กรุงวอชิงตัน"
description = "เอกอัครราชทูต ณ กรุงวอชิงตัน เดินทางเยือนนครลอสแอนเจลิส เพื่อดูแลการให้ความช่วยเหลือคนไทยที่ได้รับผลกระทบจากสถานการณ์ไฟป่า"
full_description = "เวลาทำการ : จันทร์-ศุกร์ 9:00-17:00 น. (ยกเว้นวันหยุดราชการ) เมื่อวันที่ ๑๔ มกราคม ๒๕๖๘ นายสุริยา จินดาวงษ์ เอกอัครราชทูต ณ กรุงวอชิงตัน ได้เดินทางเยือนนครลอสแอนเจลิส เพื่อพบหารือกับกงสุลใหญ่ ณ นครลอสแอนเจลิส และผู้แทนชุมชนไทย เพื่อรับฟังสถานการณ์ไฟป่าและผลกระทบต่อชุมชนไทย ตลอดจนหารือแนวทางการให้ความช่วยเหลือคนไทยที่ได้รับผลกระทบ ผู้แทนชุมชนไทยกล่าวยินดีสนับสนุนสถานกงสุลใหญ่ฯ ในการให้ความช่วยเหลือคนไทยที่ได้รับผลกระทบ โดยได้เสนอการให้ความช่วยเหลือในสาขาที่ตนมีความเชี่ยวชาญ ทั้งด้านสิ่งของใช้จำเป็น อาหาร ความรู้ด้านกฎหมาย ตลอดจนการฝึกอบรมเพื่อรับมือกับภัยพิบัติในอนาคต ในการนี้ เอกอัครราชทูตฯ ได้กล่าวให้กำลังใจชุมชนไทย และส่งความห่วงใยจากนายกรัฐมนตรีและรัฐมนตรีว่าการกระทรวงการต่างประเทศ ตลอดจนแสดงความเสียใจต่อผู้ที่ได้รับผลกระทบ ทั้งการสูญเสียบ้านหรือธุรกิจ หรือผลกระทบด้านจิตใจ เอกอัครราชทูตฯ ย้ำความมุ่งมั่นของภาครัฐในการดูแลให้ความช่วยเหลืออย่างเต็มที่ ตลอดจนขอบคุณชุมชนไทยที่มีความเข้มแข็ง มีทรัพยากร ความเชี่ยวชาญ และมีความตั้งใจดีที่จะร่วมมือกันให้ความช่วยเหลือ"
year_published = 2000
