title = "WasmEdge C SDK Introduction | WasmEdge Developer Guides"
description = "The WasmEdge C API denotes an interface to embed the WasmEdge runtime into a C program. The following is the quick start guide for working with the C APIs of WasmEdge. For the details of the WasmEdge C API, please refer to the complete documentation. Before programming with the WasmEdge C API, please install WasmEdge first."
full_description = '''C SDK for Embedding WasmEdgeWasmEdge C SDK IntroductionOn this pageWasmEdge C SDK IntroductionThe WasmEdge C API denotes an interface to embed the WasmEdge runtime into a C program. The following is the quick start guide for working with the C APIs of WasmEdge. For the details of the WasmEdge C API, please refer to the complete documentation. Before programming with the WasmEdge C API, please install WasmEdge first.The WasmEdge C API is also the fundamental API for other languages' SDK.noteFor all WASM example codes used in this chapter, users can convert wat to wasm through wat2wasm live tool.Quick Start Guide for the WasmEdge Runner​The following is an example of running a WASM file. Assume that the WASM file fibonacci.wasm is copied into the current directory, and the C file test_wasmedge.c is as follows: Please Note: In the example directory, fibonacci.wat file is provided and users should convert it into corresponding wasm file using WABT tool#include <wasmedge/wasmedge.h>#include <stdio.h>int main(int Argc, const char* Argv[]) { /* Create the configure context and add the WASI support. */ /* This step is not necessary unless you need WASI support. */ WasmEdge_ConfigureContext *ConfCxt = WasmEdge_ConfigureCreate(); WasmEdge_ConfigureAddHostRegistration(ConfCxt, WasmEdge_HostRegistration_Wasi); /* The configure and store context to the VM creation can be NULL. */ WasmEdge_VMContext *VMCxt = WasmEdge_VMCreate(ConfCxt, NULL); /* The parameters and returns arrays. */ WasmEdge_Value Params[1] = { WasmEdge_ValueGenI32(32) }; WasmEdge_Value Returns[1]; /* Function name. */ WasmEdge_String FuncName = WasmEdge_StringCreateByCString("fib"); /* Run the WASM function from file. */ WasmEdge_Result Res = WasmEdge_VMRunWasmFromFile(VMCxt, Argv[1], FuncName, Params, 1, Returns, 1); if (WasmEdge_ResultOK(Res)) { printf("Get result: %d\n", WasmEdge_ValueGetI32(Returns[0])); } else { printf("Error message: %s\n", WasmEdge_ResultGetMessage(Res)); } /* Resources deallocations. */ WasmEdge_VMDelete(VMCxt); WasmEdge_ConfigureDelete(ConfCxt); WasmEdge_StringDelete(FuncName); return 0;}Then you can compile and run: (the 32th fibonacci number is 3524578 in 0-based index)$ gcc test_wasmedge.c -lwasmedge -o test_wasmedge$ ./test_wasmedge fibonacci.wasmGet result: 3524578Quick Start Guide for the WasmEdge AOT compiler​Assume that the WASM file fibonacci.wasm is copied into the current directory, and the C file test_wasmedge_compiler.c is as follows: Please Note: In the example directory, fibonacci.wat file is provided and users should convert it into corresponding wasm file using WABT tool#include <wasmedge/wasmedge.h>#include <stdio.h>int main(int Argc, const char* Argv[]) { /* Create the configure context. */ WasmEdge_ConfigureContext *ConfCxt = WasmEdge_ConfigureCreate(); /* ... Adjust settings in the configure context. */ /* Result. */ WasmEdge_Result Res; /* Create the compiler context. The configure context can be NULL. */ WasmEdge_CompilerContext *CompilerCxt = WasmEdge_CompilerCreate(ConfCxt); /* Compile the WASM file with input and output paths. */ Res = WasmEdge_CompilerCompile(CompilerCxt, Argv[1], Argv[2]); if (!WasmEdge_ResultOK(Res)) { printf("Compilation failed: %s\n", WasmEdge_ResultGetMessage(Res)); return 1; } WasmEdge_CompilerDelete(CompilerCxt); WasmEdge_ConfigureDelete(ConfCxt); return 0;}Then you can compile and run (the output file is fibonacci_aot.wasm):$ gcc test_wasmedge_compiler.c -lwasmedge -o test_wasmedge_compiler$ ./test_wasmedge_compiler fibonacci.wasm fibonacci_aot.wasm[2021-07-02 11:08:08.651] [info] compile start[2021-07-02 11:08:08.653] [info] verify start[2021-07-02 11:08:08.653] [info] optimize start[2021-07-02 11:08:08.670] [info] codegen start[2021-07-02 11:08:08.706] [info] compile doneThe compiled WASM file can be used as a WASM input for the WasmEdge runner. The following is the comparison of the interpreter mode and the AOT mode:$ time ./test_wasmedge fibonacci.wasmGet result: 5702887real 0m2.715suser 0m2.700ssys 0m0.008s$ time ./test_wasmedge fibonacci_aot.wasmGet result: 5702887real 0m0.036suser 0m0.022ssys 0m0.011sAPI References​0.14.10.13.50.12.10.11.20.10.10.9.1Examples​Link with the WasmEdge libraryUse the external reference of WebAssembly input and output in C/C++Implement the host functions in C/C++Multiple WASM Module ExampleEdit this page'''
