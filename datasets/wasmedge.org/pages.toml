["https://wasmedge.org/docs/category/go-sdk-for-embedding-wasmedge"]
title = "Go SDK for Embedding WasmEdge | WasmEdge Developer Guides"
description = "In this chapter, we will learn how to Embed WasmEdge in your Go host applications."
full_description = "📄️ WasmEdge Go SDK IntroductionThe following is the guide to working with the WasmEdge Go API. You can embed the WasmEdge into your go application through the WasmEdge Go API.📄️ Embed a standalone WASM appThe WasmEdge Go SDK can embed standalone WebAssembly applications — ie a Rust application with a main() function compiled into WebAssembly.📄️ Embed WASM FunctionsIn this example, we will demonstrate how to call a few simple WebAssembly functions from a Go app. The functions are written in Rust, and require complex call parameters and return values. The #[wasmedge_bindgen] macro is needed for the compiler tools to auto-generate the correct code to pass call parameters from Go to WebAssembly.📄️ Pass complex parameters to WASM functionsAn issue with the WebAssembly spec is that it only supports a very limited number of data types. If you want to embed a WebAssembly function with complex call parameters or return values, you must manage memory pointers on Go SDK and WebAssembly function sides.📄️ AI Inference with TensorFlowThe WasmEdge extensions have been deprecated after the v0.12.1 version. We'll update to use the WasmEdge plug-in in the future.📄️ Embed a bindgen functionIn this example, we will demonstrate how to call a few simple WebAssembly functions from a Go app. The functions are written in Rust, and require complex call parameters and return values. The #[wasmedge_bindgen] macro is needed for the compiler tools to auto-generate the correct code to pass call parameters from Go to WebAssembly.🗃️ API Reference11 items 📄️ WasmEdge Go SDK IntroductionThe following is the guide to working with the WasmEdge Go API. You can embed the WasmEdge into your go application through the WasmEdge Go API. 📄️ Embed a standalone WASM appThe WasmEdge Go SDK can embed standalone WebAssembly applications — ie a Rust application with a main() function compiled into WebAssembly. 📄️ Embed WASM FunctionsIn this example, we will demonstrate how to call a few simple WebAssembly functions from a Go app. The functions are written in Rust, and require complex call parameters and return values. The #[wasmedge_bindgen] macro is needed for the compiler tools to auto-generate the correct code to pass call parameters from Go to WebAssembly."
