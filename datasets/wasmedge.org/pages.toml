["https://wasmedge.org/docs/develop/javascript/ssr"]
title = "Example: SSR | WasmEdge Developer Guides"
description = 'React is a very popular JavaScript web UI framework. A React application is "compiled" into an HTML and JavaScript static website. The web UI is rendered through the generated JavaScript code. However, executing the complex generated JavaScript entirely in the browser is often too slow and resource consuming to build the interactive HTML DOM objects. React Server Side Rendering (SSR) delegates the JavaScript UI rendering to a server and has the server stream rendered HTML DOM objects to the browser. The WasmEdge JavaScript runtime provides a lightweight and high-performance container to run React SSR functions on edge servers.'
full_description = '''Develop WASM Apps in JavaScriptExample: SSROn this pageExample: SSRReact is a very popular JavaScript web UI framework. A React application is "compiled" into an HTML and JavaScript static website. The web UI is rendered through the generated JavaScript code. However, executing the complex generated JavaScript entirely in the browser is often too slow and resource consuming to build the interactive HTML DOM objects. React Server Side Rendering (SSR) delegates the JavaScript UI rendering to a server and has the server stream rendered HTML DOM objects to the browser. The WasmEdge JavaScript runtime provides a lightweight and high-performance container to run React SSR functions on edge servers.Server-side rendering (SSR) is a popular technique for rendering a client-side single-page application (SPA) on the server and then sending a fully rendered page to the client, allowing dynamic components to be served as static HTML markup. This approach can be useful for search engine optimization (SEO) when indexing does not handle JavaScript properly. It may also be beneficial when downloading a large JavaScript bundle is impaired by a slow network. -- from Digital Ocean.This article will show you how to use the WasmEdge QuickJS runtime to implement a React SSR function. Compared with the Docker + Linux + nodejs + v8 approach, WasmEdge is safer (suitable for multi-tenancy environments) and much lighter (1% of the footprint) with similar performance.We will start with a complete tutorial to create and deploy a simple React Streaming SSR web application and then move on to a full React 18 demo.Getting started with React streaming SSRA full React 18 appAppendix: the create-react-app templateGetting started​The example_js/react_ssr_stream folder in the GitHub repo contains the example's source code. It showcases how to render an HTML string from templates in a JavaScript app in WasmEdge.The component/LazyHome.jsx file is the main page template in React. It "lazy" loads the inner page template after a 2s delay once the outer HTML is rendered and returned to the user.import React, { Suspense } from 'react';import * as LazyPage from './LazyPage.jsx';async function sleep(ms) { return new Promise((r, _) => { setTimeout(() => r(), ms); });}async function loadLazyPage() { await sleep(2000); return LazyPage;}class LazyHome extends React.Component { render() { let LazyPage1 = React.lazy(() => loadLazyPage()); return ( <html lang="en"> <head> <meta charSet="utf-8" /> <title>Title</title> </head> <body> <div> <div> This is LazyHome </div> <Suspense fallback={<div> loading... </div>}> <LazyPage1 /> </Suspense> </div> </body> </html> ); }}export default LazyHome;The LazyPage.jsx is the inner page template. It is rendered 2s after the outer page is already returned to the user.import React from 'react';class LazyPage extends React.Component { render() { return ( <div> <div>This is lazy page</div> </div> ); }}export default LazyPage;The main.mjs file starts a non-blocking HTTP server using standard Node.js APIs, and then renders the HTML page in multiple chunks to the response.import * as React from 'react';import { renderToPipeableStream } from 'react-dom/server';import { createServer } from 'http';import LazyHome from './component/LazyHome.jsx';createServer((req, res) => { res.setHeader('Content-type', 'text/html; charset=utf-8'); renderToPipeableStream(<LazyHome />).pipe(res);}).listen(8001, () => { print('listen 8001...');});The rollup.config.js and package.json files are to build the React SSR dependencies and components into a bundled JavaScript file for WasmEdge. You should use the npm command to build it. The output is in the dist/main.mjs file.npm installnpm run buildCopy over the system's modules to the working directory for Node.js API support as noted here.cp -r ../../modules .To run the example, do the following on the CLI to start the server.nohup wasmedge --dir .:. /path/to/wasmedge_quickjs.wasm dist/main.mjs &Send the server an HTTP request via curl or the browser.curl http://localhost:8001The results are as follows. The service returns an HTML page with an empty inner section (i.e., the loading section), then 2s later, the HTML content for the inner section and the JavaScript to display. % Total % Received % Xferd Average Speed Time Time Time Current Dload Upload Total Spent Left Speed 0 0 0 0 0 0 0 0 --:--:-- --:--:-- --:--:-- 0100 211 0 211 0 0 1029 0 --:--:-- --:--:-- --:--:-- 1024100 275 0 275 0 0 221 0 --:--:-- 0:00:01 --:--:-- 220100 547 0 547 0 0 245 0 --:--:-- 0:00:02 --:--:-- 245100 1020 0 1020 0 0 413 0 --:--:-- 0:00:02 --:--:-- 413<!DOCTYPE html><html lang="en"><head><meta charSet="utf-8"/><title>Title</title></head><body><div><div> This is LazyHome </div><!--$?--><template id="B:0"></template><div> loading... </div><!--/$--></div></body></html><div hidden id="S:0"><template id="P:1"></template></div><div hidden id="S:1"><div><div>This is lazy page</div></div></div><script>function $RS(a,b){a=document.getElementById(a);b=document.getElementById(b);for(a.parentNode.removeChild(a);a.firstChild;)b.parentNode.insertBefore(a.firstChild,b);b.parentNode.removeChild(b)};$RS("S:1","P:1")</script><script>function $RC(a,b){a=document.getElementById(a);b=document.getElementById(b);b.parentNode.removeChild(b);if(a){a=a.previousSibling;var f=a.parentNode,c=a.nextSibling,e=0;do{if(c&&8===c.nodeType){var d=c.data;if("/$"===d)if(0===e)break;else e--;else"$"!==d&&"$?"!==d&&"$!"!==d||e++}d=c.nextSibling;f.removeChild(c);c=d}while(c);for(;b.firstChild;)f.insertBefore(b.firstChild,c);a.data="$";a._reactRetry&&a._reactRetry()}};$RC("B:0","S:0")</script>A full React 18 app​In this section, we will demonstrate a complete React 18 SSR application. It renders the web UI through streaming SSR. The example_js/react18_ssr folder in the GitHub repo contains the example's source code. The component folder contains the entire React 18 application's source code, and the public folder contains the public resources (CSS and images) for the web application. The application also demonstrates a data provider for the UI.The main.mjs file starts a non-blocking HTTP server, fetches data from a data provider, maps the main.css and main.js files in the public folder to web URLs, and then renders the HTML page for each request in renderToPipeableStream().import * as React from 'react';import { renderToPipeableStream } from 'react-dom/server';import { createServer } from 'http';import * as std from 'std';import App from './component/App.js';import { DataProvider } from './component/data.js';let assets = { 'main.js': '/main.js', 'main.css': '/main.css',};const css = std.loadFile('./public/main.css');function createServerData() { let done = false; let promise = null; return { read() { if (done) { return; } if (promise) { throw promise; } promise = new Promise((resolve) => { setTimeout(() => { done = true; promise = null; resolve(); }, 2000); }); throw promise; }, };}createServer((req, res) => { print(req.url); if (req.url == '/main.css') { res.setHeader('Content-Type', 'text/css; charset=utf-8'); res.end(css); } else if (req.url == '/favicon.ico') { res.end(); } else { res.setHeader('Content-type', 'text/html'); res.on('error', (e) => { print('res error', e); }); let data = createServerData(); print('createServerData'); const stream = renderToPipeableStream( <DataProvider data={data}> <App assets={assets} /> </DataProvider>, { onShellReady: () => { stream.pipe(res); }, onShellError: (e) => { print('onShellError:', e); }, }, ); }}).listen(8002, () => { print('listen 8002...');});The rollup.config.js and package.json files are to build the React 18 SSR dependencies and components into a bundled JavaScript file for WasmEdge. You should use the npm command to build it. The output is in the dist/main.mjs file.npm installnpm run buildCopy over the system's modules to the working directory for Node.js API support as noted here.cp -r ../../modules .To run the example, do the following on the CLI to start the server.nohup wasmedge --dir .:. /path/to/wasmedge_quickjs.wasm dist/main.mjs &Send the server an HTTP request via curl or the browser.curl http://localhost:8002The results are as follows. The service returns an HTML page with an empty inner section (i.e., the loading section), and then 2s later, the HTML content for the inner section and the JavaScript to display it. % Total % Received % Xferd Average Speed Time Time Time Current Dload Upload Total Spent Left Speed 0 0 0 0 0 0 0 0 --:--:-- --:--:-- --:--:-- 0100 439 0 439 0 0 1202 0 --:--:-- --:--:-- --:--:-- 1199100 2556 0 2556 0 0 1150 0 --:--:-- 0:00:02 --:--:-- 1150100 2556 0 2556 0 0 926 0 --:--:-- 0:00:02 --:--:-- 926100 2806 0 2806 0 0 984 0 --:--:-- 0:00:02 --:--:-- 984<!DOCTYPE html><html lang="en"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/main.css"/><title>Hello</title></head><body><noscript><b>Enable JavaScript to run this app.</b></noscript><!--$--><main><nav><a href="/">Home</a></nav><aside class="sidebar"><!--$?--><template id="B:0"></template><div class="spinner spinner--active" role="progressbar" aria-busy="true"></div><!--/$--></aside><article class="post"><!--$?--><template id="B:1"></template><div class="spinner spinner--active" role="progressbar" aria-busy="true"></div><!--/$--><section class="comments"><h2>Comments</h2><!--$?--><template id="B:2"></template><div class="spinner spinner--active" role="progressbar" aria-busy="true"></div><!--/$--></section><h2>Thanks for reading!</h2></article></main><!--/$--><script>assetManifest = {"main.js":"/main.js","main.css":"/main.css"};</script></body></html><div hidden id="S:0"><template id="P:3"></template></div><div hidden id="S:1"><template id="P:4"></template></div><div hidden id="S:2"><template id="P:5"></template></div><divhidden id="S:3"><h1>Archive</h1><ul><li>May 2021</li><li>April 2021</li><li>March 2021</li><li>February 2021</li><li>January 2021</li><li>December 2020</li><li>November 2020</li><li>October 2020</li><li>September 2020</li></ul></div><script>function $RS(a,b){a=document.getElementById(a);b=document.getElementById(b);for(a.parentNode.removeChild(a);a.firstChild;)b.parentNode.insertBefore(a.firstChild,b);b.parentNode.removeChild(b)};$RS("S:3","P:3")</script><script>function $RC(a,b){a=document.getElementById(a);b=document.getElementById(b);b.parentNode.removeChild(b);if(a){a=a.previousSibling;var f=a.parentNode,c=a.nextSibling,e=0;do{if(c&&8===c.nodeType){var d=c.data;if("/$"===d)if(0===e)break;else e--;else"$"!==d&&"$?"!==d&&"$!"!==d||e++}d=c.nextSibling;f.removeChild(c);c=d}while(c);for(;b.firstChild;)f.insertBefore(b.firstChild,c);a.data="$";a._reactRetry&&a._reactRetry()}};$RC("B:0","S:0")</script><div hidden id="S:4"><h1>Hello world</h1><p>This demo is <!-- --><b>artificially slowed down</b>. Open<!-- --> <!-- --><code>server/delays.js</code> to adjust how much different things are slowed down.<!-- --></p><p>Notice how HTML for comments &quot;streams in&quot; before the JS (or React) has loaded on the page.</p><p>Also notice that the JS for comments and sidebar has been code-split, but HTML for it is still included in the server output.</p></div><script>$RS("S:4","P:4")</script><script>$RC("B:1","S:1")</script><div hidden id="S:5"><p class="comment">Wait, it doesn&#x27;t wait for React to load?</p><p class="comment">How does this even work?</p><p class="comment">I like marshmallows</p></div><script>$RS("S:5","P:5")</script><script>$RC("B:2","S:2")</script>The streaming SSR examples make use of WasmEdge's unique asynchronous networking capabilities and ES6 module support (i.e., the roll-up bundled JS file contains ES6 modules). You can learn more about async networking and ES6 in this book.Appendix the create-react-app template​The create-react-app template is a popular starting point for many developers to create React apps. In this tutorial, we will provide a step-by-step guide on how to use it to create React streaming SSR applications that run on WasmEdge.Step 1 — Create the React App​First, use npx to create a new React app. Let’s name the app react-ssr-example.npx create-react-app react-ssr-exampleThen, cd into the directory for the newly created app.cd react-ssr-exampleStart the new app to verify the installation.npm startYou should see the example React app displayed in your browser window. At this stage, the app is rendered in the browser. The browser runs the generated React JavaScript to build the HTML DOM UI.Now to prepare for SSR, you will need to make some changes to the app's index.js file. Change ReactDOM's render method to hydrate to indicate to the DOM renderer that you intend to rehydrate the app after it is rendered on the server. Replace the contents of the index.js file with the following.import React from 'react';import ReactDOM from 'react-dom';import App from './App';ReactDOM.hydrate( <React.StrictMode> <App /> </React.StrictMode>, document.getElementById('root'),);noteYou should import React redundantly in the src/App.js, so the server will recognize it.import React from 'react';//...That concludes setting up the application. You can move on to setting up the server-side rendering functions.Step 2 — Create an WasmEdge QuickJS Server and Render the App Component​Now that you have the app in place let’s set up a server that will render the HTML DOM by running the React JavaScript and then send the rendered elements to the browser. We will use WasmEdge as a secure, high-performance, lightweight container to run React JavaScript.Create a new server directory in the project's root directory.mkdir serverThen, inside the server directory, create a new index.js file with the server code.import * as React from 'react';import ReactDOMServer from 'react-dom/server';import * as std from 'std';import * as http from 'wasi_http';import * as net from 'wasi_net';import App from '../src/App.js';async function handle_client(cs) { print('open:', cs.peer()); let buffer = new http.Buffer(); while (true) { try { let d = await cs.read(); if (d == undefined || d.byteLength <= 0) { return; } buffer.append(d); let req = buffer.parseRequest(); if (req instanceof http.WasiRequest) { handle_req(cs, req); break; } } catch (e) { print(e); } } print('end:', cs.peer());}function enlargeArray(oldArr, newLength) { let newArr = new Uint8Array(newLength); oldArr && newArr.set(oldArr, 0); return newArr;}async function handle_req(s, req) { print('uri:', req.uri); let resp = new http.WasiResponse(); let content = ''; if (req.uri == '/') { const app = ReactDOMServer.renderToString(<App />); content = std.loadFile('./build/index.html'); content = content.replace( '<div id="root"></div>', `<div id="root">${app}</div>`, ); } else { let chunk = 1000; // Chunk size of each reading let length = 0; // The whole length of the file let byteArray = null; // File content as Uint8Array // Read file into byteArray by chunk let file = std.open('./build' + req.uri, 'r'); '''
