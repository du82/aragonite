["https://wasmedge.org/docs/zh-TW/category/c-sdk-for-embedding-wasmedge"]
title = "C SDK for Embedding WasmEdge | WasmEdge Developer Guides"
description = "In this chapter, we will learn how to embed WasmEdge with the C API."
full_description = "📄️ WasmEdge C SDK IntroductionThe WasmEdge C API denotes an interface to embed the WasmEdge runtime into a C program. The following is the quick start guide for working with the C APIs of WasmEdge. For the details of the WasmEdge C API, please refer to the complete documentation. Before programming with the WasmEdge C API, please install WasmEdge first.📄️ Use WasmEdge LibraryWhen programming with WasmEdge C API, developers should include the required headers and link with the WasmEdge Library. Besides install WasmEdge with the WasmEdge shared library, developers can also build WasmEdge to generate the WasmEdge static library.📄️ Host FunctionsHost functions are the functions outside WebAssembly and are passed to WASM modules as imports. The following steps give an example of implementing host functions and registering a host module into the WasmEdge runtime.📄️ Customized External ReferencesExternal References denotes an opaque and unforgettable reference to a host object. A new externref type can be passed into a WASM module or returned. The WASM module cannot reveal an externref value's bit pattern nor create a fake host reference by an integer value.📄️ Multiple WASM Module ExampleFor those WASM modules that export their functions, the other WASM modules can import them as a library.🗃️ API Reference11 個項目 📄️ WasmEdge C SDK IntroductionThe WasmEdge C API denotes an interface to embed the WasmEdge runtime into a C program. The following is the quick start guide for working with the C APIs of WasmEdge. For the details of the WasmEdge C API, please refer to the complete documentation. Before programming with the WasmEdge C API, please install WasmEdge first. 📄️ Use WasmEdge LibraryWhen programming with WasmEdge C API, developers should include the required headers and link with the WasmEdge Library. Besides install WasmEdge with the WasmEdge shared library, developers can also build WasmEdge to generate the WasmEdge static library."
