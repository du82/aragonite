["https://wasmedge.org/docs/start/install"]
title = "Install and uninstall WasmEdge | WasmEdge Developer Guides"
description = "This chapter will discuss ways to install and uninstall the WasmEdge Runtime on various OSes and platforms. We will cover how to install plug-ins to WasmEdge."
full_description = '''Install and uninstall WasmEdgeOn this pageInstall and uninstall WasmEdgeThis chapter will discuss ways to install and uninstall the WasmEdge Runtime on various OSes and platforms. We will cover how to install plug-ins to WasmEdge.noteDocker Desktop 4.15+ already has WasmEdge bundled in its distribution binary. If you use Docker Desktop, you will not need to install WasmEdge separately. Check out how to run WasmEdge apps in Docker Desktop.Install​You can install the WasmEdge Runtime on any generic Linux and MacOS platforms. If you use Windows 10 or Fedora / Red Hat Linux systems, you can install with their default package managers.Generic Linux and MacOS​The easiest way to install WasmEdge is to run the following command. Your system should have git and curl as prerequisites.curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bashRun the following command to make the installed binary available in the current session.source $HOME/.wasmedge/envInstall for all users​WasmEdge is installed in the $HOME/.wasmedge directory by default. You can install it into a system directory, such as /usr/local to make it available to all users. To specify an install directory, run the install.sh script with the -p flag. You will need to run the following commands as the root user or sudo since they are written write into system directories.curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- -p /usr/localInstall a specific version of WasmEdge​The WasmEdge installer script will install the latest official release by default. You could install a specific version of WasmEdge, including pre-releases or old releases by passing the -v argument to the installer script. Here is an example.VERSION=0.14.1curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- -v $VERSIONSuppose you are interested in the latest builds from the HEAD of the master branch, which is basically WasmEdge's nightly builds. In that case, you can download the release package directly from our Github Action's CI artifact. Here is an example.Install via Nix​For nix/nixos users, we also provide a flake.nix in repository, so you can install WasmEdge via:nix profile install github:WasmEdge/WasmEdgeInstall WasmEdge with plug-ins​WasmEdge plug-ins are pre-built native modules that provide additional functionalities to the WasmEdge Runtime. To install plug-ins with the runtime, you can pass the --plugins parameter in the installer. For example, the command below installs the wasi_nn-ggml plug-in to enable LLM (Large Language Model) inference.curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- --plugins wasi_nn-ggmlTo install multiple plug-ins, you can pass a list of plug-ins with the --plugins option. For example, the following command installs the wasi_logging and the wasi_nn-ggml plug-ins. The wasi_logging plug-in allows the Rust log::Log API to compile into Wasm and run in WasmEdge.curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- --plugins wasi_logging wasi_nn-ggmlThe installer downloads the plug-in files from the WasmEdge release on GitHub, unzips them, and then copies them over to the ~/.wasmedge/plugin/ folder (for user install) and to the /usr/local/lib/wasmedge/ folder (for system install).noteThe WASI-NN related plug-ins are all EXCLUSIVE. Users can only install one of the WASI-NN backends.After WasmEdge 0.14.1, the WASI-Logging plug-in is bundled into the WasmEdge shared library and is not necessary to be installed.Some of plug-ins need dependencies. Please follow the guide in the comment column to install the dependencies.The following lists are the WasmEdge official released plug-ins. Users can install them easily by the parameters of --plugins option of installer.Plug-inParameterSupported PlatformsVersionsCommentWASI-Loggingwasi_loggingAllSince 0.13.0Bundled into WasmEdge library since 0.14.1.WASI-Cryptowasi_cryptoLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.10.1WASI-NN OpenVINO backendwasi_nn-openvinoLinux (x86_64, Ubuntu only)Since 0.10.1Users should install the OpenVINO dependency.WASI-NN PyTorch backendwasi_nn-pytorchLinux (x86_64)Since 0.11.1Users should install the PyTorch dependency.WASI-NN TensorFlow-Lite backendwasi_nn-tensorflowliteLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.11.2Dependency installed automatically by installer.WASI-NN GGML backendwasi_nn-ggmlLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.13.4Notes for the dependencyWASI-NN Piper backendwasi_nn-piperLinux (x86_64, aarch64)Since 0.14.1Users should install the Piper dependency.WASI-NN Whisper backendwasi_nn-whisperLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.14.1WASI-NN Burn.rs backend (Squeezenet)wasi_nn_burnrs-squeezenetLinux (x86_64, Ubuntu only)Since 0.14.1WASI-NN Burn.rs backend (Whisper)wasi_nn_burnrs-whisperLinux (x86_64, Ubuntu only)Since 0.14.1Ffmpegwasmedge_ffmpegLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.14.0Imagewasmedge_imageLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.13.0LLMwasmedge_llmcLinux (x86_64, aarch64)Since 0.14.1OpenCV miniwasmedge_opencvminiLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.13.3Processwasmedge_processLinux (x86_64, aarch64)Since 0.10.0Stable Diffusionwasmedge_stablediffusionLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.14.1TensorFlowwasmedge_tensorflowLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.13.0Dependency installed automatically by installer.TensorFlow-Litewasmedge_tensorflowliteLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.13.0Dependency installed automatically by installer.Zlibwasmedge_zlibLinux (x86_64, aarch64), MacOS (x86_64, arm64)Since 0.13.5WASM-eBPFwasm_bpfLinux (x86_64)Since 0.13.2Rust TLSwasmedge_rustlsLinux (x86_64)Since 0.13.0Until 0.13.5. DEPRECATED.For further details of each plug-ins, please follow the plug-in page.Windows​For Windows 10, you could use Windows Package Manager Client (aka winget.exe) to install WasmEdge with one single command in your terminal.winget install wasmedgeTo install plug-ins, you can download plug-in binary modules from the WasmEdge release page, unzip them, and then copy them to C:\Program Files\WasmEdge\lib.Fedora and Red Hat Linux​WasmEdge is now an official package on Fedora 36, Fedora 37, Fedora 38, Fedora EPEL 8, and Fedora EPEL 9. Check out the stable version here. To install WasmEdge on Fedora, run the following command:dnf install wasmedgeFor more usages, please check out Fedora docs.To install plug-ins, you can download plug-in binary modules from the WasmEdge release page, unzip them, and then copy them over to /usr/local/lib/wasmedge/.What's installed​If you install into the $HOME/.wasmedge directory, you will have the following directories and files after installation:The $HOME/.wasmedge/bin directory contains the WasmEdge Runtime CLI executable files. You can copy and move them around on your file system.The wasmedge tool is the standard WasmEdge runtime. You can use it from the CLI.Execute a WASM file: wasmedge --dir .:. app.wasmThe wasmedgec tool is the ahead-of-time (AOT) compiler to compile a .wasm file into a native .so file (or .dylib on MacOS, .dll on Windows, or .wasm as the universal WASM format on all platforms). The wasmedge can then execute the output file.Compile a WASM file into a AOT-compiled WASM: wasmedgec app.wasm app.soExecute the WASM in AOT mode: wasmedge --dir .:. app.sonoteThe usage of wasmedgec is equal to wasmedge compile. We decide to deprecate wasmedgec in the future.The $HOME/.wasmedge/lib directory contains WasmEdge shared libraries and dependency libraries. They are useful for WasmEdge SDKs to launch WasmEdge programs and functions from host applications.The $HOME/.wasmedge/include directory contains the WasmEdge header files. They are useful for WasmEdge SDKs.The $HOME/.wasmedge/plugin directory contains the WasmEdge plug-ins. They are loadable extensions for WasmEdge SDKs and will automatically be loaded when running the WasmEdge CLI.noteYou could also change it to /usr/local if you did a system-wide install. If you used winget to install WasmEdge, the files are located at C:\Program Files\WasmEdge.Uninstall​To uninstall WasmEdge, you can run the following command:bash <(curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/uninstall.sh)If the wasmedge binary is not in PATH and it wasn't installed in the default $HOME/.wasmedge folder, then you must provide the installation path.bash <(curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/uninstall.sh) -p /path/to/parent/folderIf you wish to uninstall uninteractively, you can pass in the --quick or -q flag.bash <(curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/uninstall.sh) -qnoteIf a parent folder of the wasmedge binary contains .wasmedge, the folder will be considered for removal. For example, the script altogether removes the default $HOME/.wasmedge folder.If you used dnf to install WasmEdge on Fedora and Red Hat Linux, run the following command to uninstall it:dnf remove wasmedgeIf you used winget to install WasmEdge on Windows, run the following command to uninstall it:winget uninstall wasmedgeAppendix: Installing the Dependencies​GGML Dependencies​The installer from WasmEdge 0.13.5 will detect CUDA automatically. If CUDA is detected, the installer will always attempt to install a CUDA-enabled version of the WASI-NN GGML plug-in.If CPU is the only available hardware on your machine, the installer will install OpenBLAS version of plugin instead.apt update && apt install -y libopenblas-dev # You may need sudo if the user is not root.TensorFlow-Lite Dependencies​If you install the WASI-NN TensorflowLite or WasmEdge-TensorFlowLite plug-in WITHOUT installer, you can download the shared libraries with the following commands:VERSION=TF-2.12.0-CC# For the WasmEdge versions before 0.13.0, please use the `TF-2.6.0-CC` version.PLATFORM=manylinux2014_x86_64# For the Linux aarch64 platforms, please use the `manylinux2014_aarch64`.# For the MacOS x86_64 platforms, please use the `darwin_x86_64`.# For the MacOS arm64 platforms, please use the `darwin_arm64`.curl -s -L -O --remote-name-all https://github.com/second-state/WasmEdge-tensorflow-deps/releases/download/$VERSION/WasmEdge-tensorflow-deps-TFLite-$VERSION-$PLATFORM.tar.gztar -zxf WasmEdge-tensorflow-deps-TFLite-$VERSION-$PLATFORM.tar.gzrm -f WasmEdge-tensorflow-deps-TFLite-$VERSION-$PLATFORM.tar.gzThe shared library will be extracted in the current directory ./libtensorflowlite_c.so (or .dylib for MacOS) and ./libtensorflowlite_flex.so (after the WasmEdge 0.13.0 version). You can move the library to the installation path:# If you installed wasmedge locally as abovemv libtensorflowlite_c.so ~/.wasmedge/libmv libtensorflowlite_flex.so ~/.wasmedge/lib# Or, if you installed wasmedge for all users in /usr/local/mv libtensorflowlite_c.so /usr/local/libmv libtensorflowlite_flex.so /usr/local/lib# Or on MacOS platformsmv libtensorflowlite_c.dylib ~/.wasmedge/libmv libtensorflowlite_flex.dylib ~/.wasmedge/libTensorFlow Dependencies​If you install the WasmEdge-Tensorflow plug-in WITHOUT installer, you can download the shared libraries with the following commands:VERSION=TF-2.12.0-CC# For the WasmEdge versions before 0.13.0, please use the `TF-2.6.0-CC` version.PLATFORM=manylinux2014_x86_64# For the Linux aarch64 platforms, please use the `manylinux2014_aarch64`.# For the MacOS x86_64 platforms, please use the `darwin_x86_64`.# For the MacOS arm64 platforms, please use the `darwin_arm64`.curl -s -L -O --remote-name-all https://github.com/second-state/WasmEdge-tensorflow-deps/releases/download/TF-2.12.0-CC/WasmEdge-tensorflow-deps-TF-TF-$VERSION-$PLATFORM.tar.gztar -zxf WasmEdge-tensorflow-deps-TF-TF-$VERSION-$PLATFORM.tar.gzrm -f WasmEdge-tensorflow-deps-TF-TF-$VERSION-$PLATFORM.tar.gzThe shared library will be extracted in the current directory ./libtensorflow_cc.so.2.12.0 and ./libtensorflow_framework.so.2.12.0 on Linux platforms, or ./libtensorflow_cc.2.12.0.dylib and ./libtensorflow_framework.2.12.0.dylib on MacOS platforms. You can move the library to the installation path:# If you installed wasmedge locally as abovemv libtensorflow_cc.so.2.12.0 ~/.wasmedge/libmv libtensorflow_framework.so.2.12.0 ~/.wasmedge/libln -s libtensorflow_cc.so.2.12.0 ~/.wasmedge/lib/libtensorflow_cc.so.2ln -s libtensorflow_cc.so.2 ~/.wasmedge/lib/libtensorflow_cc.soln -s libtensorflow_framework.so.2.12.0 ~/.wasmedge/lib/libtensorflow_framework.so.2ln -s libtensorflow_framework.so.2 ~/.wasmedge/lib/libtensorflow_framework.so# Or, if you installed wasmedge for all users in /usr/local/mv libtensorflow_cc.so.2.12.0 /usr/local/libmv libtensorflow_framework.so.2.12.0 /usr/local/libln -s libtensorflow_cc.so.2.12.0 /usr/local/lib/libtensorflow_cc.so.2ln -s libtensorflow_cc.so.2 /usr/local/lib/libtensorflow_cc.soln -s libtensorflow_framework.so.2.12.0 /usr/local/lib/libtensorflow_framework.so.2ln -s libtensorflow_framework.so.2 /usr/local/lib/libtensorflow_framework.so# Or on MacOS platformsmv libtensorflow_cc.2.12.0.dylib ~/.wasmedge/libmv libtensorflow_framework.2.12.0.dylib ~/.wasmedge/libln -s libtensorflow_cc.2.12.0.dylib ~/.wasmedge/lib/libtensorflow_cc.2.dylibln -s libtensorflow_cc.2.dylib ~/.wasmedge/lib/libtensorflow_cc.dylibln -s libtensorflow_framework.2.12.0.dylib ~/.wasmedge/lib/libtensorflow_framework.2.dylibln -s libtensorflow_framework.2.dylib ~/.wasmedge/lib/libtensorflow_framework.dylibOpenVINO Dependencies​The WASI-NN plug-in with OpenVINO backend depends on the OpenVINO C library to perform AI/ML computations. The following commands are for Ubuntu 20.04 and above to install OpenVINO(2023) dependencies.wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUBsudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUBecho "deb https://apt.repos.intel.com/openvino/2023 ubuntu20 main" | sudo tee /etc/apt/sources.list.d/intel-openvino-2023.listsudo apt updatesudo apt-get -y install openvinoldconfigPyTorch Dependencies​The WASI-NN plug-in with PyTorch backend depends on the libtorch C++ library to perform AI/ML computations. You need to install the PyTorch 1.8.2 LTS dependencies for it to work properly.export PYTORCH_VERSION="1.8.2"# For the Ubuntu 20.04 or above, use the libtorch with cxx11 abi.export PYTORCH_ABI="libtorch-cxx11-abi"# For the manylinux2014, please use the without cxx11 abi version:# export PYTORCH_ABI="libtorch"curl -s -L -O --remote-name-all https://download.pytorch.org/libtorch/lts/1.8/cpu/${PYTORCH_ABI}-shared-with-deps-${PYTORCH_VERSION}%2Bcpu.zipunzip -q "${PYTORCH_ABI}-shared-with-deps-${PYTORCH_VERSION}%2Bcpu.zip"rm -f "${PYTORCH_ABI}-shared-with-deps-${PYTORCH_VERSION}%2Bcpu.zip"export LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:$(pwd)/libtorch/libnoteFor the Ubuntu 20.04 or above version'''
