["https://wasmedge.org/docs/contribute/overview"]
title = "Contribute and Extend WasmEdge | WasmEdge Developer Guides"
description = "Contribution is always welcome! The WebAssembly ecosystem is still in its early days. Hosted by CNCF, WasmEdge aims to become an open source “reference implementation” of WebAssembly and its edge-related extensions. WasmEdge is developed in the open, and is constantly being improved by our users, contributors, and maintainers. It is because of you that we can bring great software to the community.We are looking forward to working together with you!"
full_description = "Contribute and Extend WasmEdgeOn this pageContribute and Extend WasmEdgeContribution is always welcome! The WebAssembly ecosystem is still in its early days. Hosted by CNCF, WasmEdge aims to become an open source “reference implementation” of WebAssembly and its edge-related extensions. WasmEdge is developed in the open, and is constantly being improved by our users, contributors, and maintainers. It is because of you that we can bring great software to the community.We are looking forward to working together with you!To help new contributors understand WasmEdge development workflow, this guide will includeBuild WasmEdge and WasmEdge plug-in from source on different platformsWasmEdge Plug-in system introductionTest WasmEdgeWasmEdge FuzzingWasmEdge internal explanationWasmEdge installer system explanationWasmEdge installer v2 system explanationcontributing stepsWasmEdge release processJoin WasmEdge communityIdeas for contributions​If you're looking for something to contribute, we have issueslabeled with good first issue, which are recommendations for developers to contribute to WasmEdge by working on some easy tasks. These tasks will help contributors to learn the WasmEdge development workflow.labeled with help wanted, for which are we need suggestions and opinions from the community.Roadmap for every year, which elaborates the new features in the coming days. You are also welcome to pick one.If you find something is missing, don't hesitate to create an issue and let us know. Again, WasmEdge is open in development.Mentoring​WasmEdge maintainers can provide mentoring for WasmEdge, WebAssembly, C++, Rust, compiler, etc. If you are interested in fixing one open issue, just let us know by commenting under the issue. WasmEdge maintainers will reply to your question in time.Besides the regular GitHub issues, the WasmEdge project will participate in some open source mentoring projects like Google Summer of Code (GSoC), Google Season of Docs (GSoD), LFX Mentorship, and Open Source Promotion Plan (OSPP). Join our Discord server or follow @realwasmedge on Twitter to get alerts on the application details.Edit this page"
