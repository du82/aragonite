["https://wasmedge.org/docs/develop/javascript/hello_world"]
title = "Quickstart for JavaScript | WasmEdge Developer Guides"
description = "Prerequisites"
full_description = '''Develop WASM Apps in JavaScriptQuickstart for JavaScriptOn this pageQuickstart for JavaScriptPrerequisites​Install WasmEdgeClone the wasmedge-quickjs repo and use it as the current directory.git clone https://github.com/second-state/wasmedge-quickjscd wasmedge-quickjsThen download the pre-built WasmEdge QuickJS Runtime program, and optionally, AOT compile it for better performance.curl -OL https://github.com/second-state/wasmedge-quickjs/releases/download/v0.5.0-alpha/wasmedge_quickjs.wasmwasmedge compile wasmedge_quickjs.wasm wasmedge_quickjs.wasmnoteThe reason to use wasmedge-quickjs as the current working directory is that modules in the repo are required for the QuickJS runtime.Quick start​You can try a simple "hello world" JavaScript program (example_js/hello.js), which prints out the command line arguments to the console.$ wasmedge --dir .:. wasmedge_quickjs.wasm example_js/hello.js WasmEdge RuntimeHello WasmEdge RuntimenoteThe --dir .:. on the command line is to give wasmedge permission to read the local directory in the file system for the hello.js file.The JavaScript source code for the hello.js program is as follows.import * as os from 'os';import * as std from 'std';args = args.slice(1);print('Hello', ...args);setTimeout(() => { print('timeout 2s');}, 2000);Build it yourself​This section is optional. Read on if you are interested in adding custom built-in JavaScript APIs to the runtime.Following the instructions, you can build a JavaScript interpreter for WasmEdge. Make sure you have installed GCC. If you don't, run the following command line.# Install GCCsudo apt updatesudo apt install build-essentialThen, we could build the WasmEdge-Quickjs runtime.Fork or clone the wasmedge-quickjs Github repository.# get the source codegit clone https://github.com/second-state/wasmedge-quickjscd wasmedge-quickjs# Build the QuickJS JavaScript interpretercargo build --target wasm32-wasip1 --releaseThe WebAssembly-based JavaScript interpreter program is located in the build target directory.WasmEdge provides a wasmedgec utility to compile and add a native machine code section to the wasm file. You can use wasmedge to run the natively instrumented wasm file to get a much faster performance.wasmedge compile target/wasm32-wasip1/release/wasmedge_quickjs.wasm wasmedge_quickjs.wasmwasmedge --dir .:. wasmedge_quickjs.wasm example_js/hello.jsNext, we will discuss more advanced use cases for JavaScript in WasmEdge.Edit this page'''
