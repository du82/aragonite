["https://wasmedge.org/docs/embed/overview"]
title = "Embed WasmEdge in Your Apps | WasmEdge Developer Guides"
description = "As we mentioned before, the most important use case for WasmEdge is to safely execute user-defined or community-contributed code as plug-ins in a software product. It enables third-party developers, vendors, suppliers, and community members to extend and customize the software product."
full_description = "Embed WasmEdge in Your AppsEmbed WasmEdge in Your AppsAs we mentioned before, the most important use case for WasmEdge is to safely execute user-defined or community-contributed code as plug-ins in a software product. It enables third-party developers, vendors, suppliers, and community members to extend and customize the software product.We could use WasmEdge as a standalone container and deploy WasmEdge using the existing containers tools. The other way is to use WasmEdge as an embedded runtime and manage WasmEdge using the host applications.WasmEdge provides SDKs for various programming languages. The WasmEdge library allows developers to embed the WasmEdge into their host applications, so that the WebAssembly applications can be executed in the WasmEdge sandbox safely. Furthermore, developers can implement the host functions for the extensions with the WasmEdge library.In this section, we will walk you through how to embed WasmEdge in different languages. We will cover the following content:Quick StartPassing complex dataDeveloping components using witcEmbed WasmEdge in C/C++Embed WasmEdge in RustEmbed WasmEdge in GoEmbed WasmEdge in JavaEmbed WasmEdge in PythonUse casesBesides this, we also have two more guides for developing WASM apps and contributing to WasmEdge.Edit this page"
