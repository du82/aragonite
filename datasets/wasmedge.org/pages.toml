["https://wasmedge.org/docs/start/overview"]
title = "Getting Started with WasmEdge | WasmEdge Developer Guides"
description = "WasmEdge is a lightweight, high-performance, and extensible WebAssembly runtime for cloud-native, edge, and decentralized applications. It powers serverless apps, embedded functions, microservices, udf, smart contracts, and IoT devices. WasmEdge is currently a CNCF (Cloud Native Computing Foundation) Sandbox project."
full_description = "Getting Started with WasmEdgeGetting Started with WasmEdgeWasmEdge is a lightweight, high-performance, and extensible WebAssembly runtime for cloud-native, edge, and decentralized applications. It powers serverless apps, embedded functions, microservices, udf, smart contracts, and IoT devices. WasmEdge is currently a CNCF (Cloud Native Computing Foundation) Sandbox project.The WasmEdge Runtime provides a well-defined execution sandbox for its contained WebAssembly bytecode program. The runtime offers isolation and protection for operating system resources (e.g., file system, sockets, environment variables, processes) and memory space. The most important use case for WasmEdge is to safely execute user-defined or community-contributed code as plug-ins in a software product (e.g., SaaS, database, edge nodes, or even blockchain nodes). It enables third-party developers, vendors, suppliers, and community members to extend and customize the software product.This chapter will introduce how to install and get started with WasmEdge.We will cover the following content:Install and Uninstall WasmEdgeGetting StartedIntroduce the WasmEdge RuntimeUsages of Running WasmEdgeFrequently Asked QuestionStyle Guide for new contributorsTroubleshooting GuideFor advanced programming with WasmEdge, please refer to the guides for developing WASM apps, Embedding WasmEdge in your apps, or contributing to WasmEdge.If you find any issues or have any feedback, please reach out to us via the following ways.Discord ChatCreate a GitHub issue for technical supportSubmit a GitHub discussionFollow @realwasmedge on TwitterEdit this page"
