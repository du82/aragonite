title = "Astro Starter · Wasmer"
description = "Astro Starter · Wasmer"
full_description = "SolutionsDevelopersPricingTemplatesBlogSign inDeploy for freeSign inDeploy for freeBack to templatesAstro StarterAn Astro site, using the basics starter kit.This is a Astro starter kit bootstrapped with npm create astro@latest -- --template basics. Getting Started First, run the development server: npm run dev You can also run the Astro template easily using Wasmer (check out the install guide): wasmer run wasmer-examples/astro-wasmer-starter --net -- --port 3000 [!TIP] You can also run wasmer run . --net -- --port 3000 in the root of this repo, after running npm run build Open http://localhost:3000 with your browser to see the result. Deploy on Wasmer Edge The easiest way to deploy your Astro App is to use the Wasmer Edge. Live example: https://astro-wasmer-starter.wasmer.app/ First, you'll need to run npm run build, and then, to deploy to Wasmer Edge: wasmer deploy [!NOTE] You will need to change the namespace in wasmer.toml to your own namespace and app name in app.yaml to your own app name. 🚀 Project Structure Inside of your Astro project, you'll see the following folders and files: / ├── public/ │ └── favicon.svg ├── src/ │ ├── components/ │ │ └── Card.astro │ ├── layouts/ │ │ └── Layout.astro │ └── pages/ │ └── index.astro └── package.json Astro looks for .astro or .md files in the src/pages/ directory. Each page is exposed as a route based on its file name. There's nothing special about src/components/, but that's where we like to put any Astro/React/Vue/Svelte/Preact components. Any static assets, like images, can be placed in the public/ directory. 🧞 Commands All commands are run from the root of the project, from a terminal: CommandActionnpm installInstalls dependenciesnpm run devStarts local dev server at localhost:4321npm run buildBuild your production site to ./dist/npm run previewPreview your build locally, before deployingnpm run astro ...Run CLI commands like astro add, astro checknpm run astro -- --helpGet help using the Astro CL