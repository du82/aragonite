["https://wasmer.io/posts/volumes-technical-preview-in-wasmer-edge"]
title = "Volumes Technical Preview in Wasmer Edge · Blog · Wasmer"
description = """
Until today, all workloads executed in Wasmer Edge had ephemeral data.

This works incredibly well for stateless applications, but had some challenges..."""
full_description = "SolutionsDevelopersPricingTemplatesBlogSign inDeploy for freeSign inDeploy for freeBack to articlesVolumes Technical Preview in Wasmer EdgesyrusakbarySyrus AkbaryFounder & CEOedgeSeptember 9, 2024Back to articlesUntil today, all workloads executed in Wasmer Edge had ephemeral data. This works incredibly well for stateless applications, but had some challenges on stateful workloads such as a blog application that requires uploading new images/assets over time. Today, we are incredibly excited to launch the technical preview of Volumes in Wasmer Edge! You can now use Volumes to persist data between deployments and even when the applications are paused. What are Volumes? Volumes are a key building block to support a wide range of new workloads such as object storage, or any full-stack applications that require long-term storage. Volumes are running on the same datacenter as your applications. This ensures low latency and high throughput for your applications. During technical preview, Volumes are free of charge. Also, every Volume created in Wasmer Edge will be exposed through an S3-compatible server, with it's own S3 credentials so you can access it from anywhere (fun fact: the s3 server it's just an app running on Wasmer Edge that gets deployed automatically when you create a volume!) Volumes right now are not globally distributed, but regionally distributed. We are currently working on enabling globally distributed volumes… stay tuned! This means that your apps will need to stay in one region until we support global distribution. Wasmer Edge volumes are currently only available in the North America region. Volumes Use Cases Many modern applications require persistent data to function effectively. Here's a glimpse of the types of applications you can now deploy to Wasmer Edge: Search and Analytics Engines: Quickwit or Meilisearch CMS: Wordpress, Drupal or HohoHub Storage Solutions: Utilize storage options like MinIO, Ceph, or S3-compatible storage for scalable and reliable data storage. And this is just the beginning! Over the coming weeks, we'll be expanding our template catalog to make it even easier to deploy stateful services with Wasmer Edge. Stay tuned as we bring you more powerful tools to accelerate your edge computing journey. Getting Started with Volumes Volumes provide additional, persistent, storage capacity for your services and come in addition to your instances provided ephemeral disk. Each Volume you create is: region-aware, meaning that for now, they need to be attached to services running in the same region. Accessible via S3-compatible clients To create a new volume, you need to add a new key into your app.yaml: volumes: - name: hello-data mount: /data In the future, you'll be able to create volumes directly from the CLI and attach it after. For the moment, volumes are always attached to an instance and the names are globally unique for the owner/namespace that owns the app. Learn more about volumes in our docs: https://docs.wasmer.io/edge/learn/volumes Whats Next? We can't wait to see what you will create next with Wasmer Edge Volumes! Your feedback is invaluable in helping us refine and improve the product, so don't hesitate to share your thoughts with us on Discord. New to Wasmer? Sign up today and start deploying your first edge service in just a few clicks.About the AuthorSyrus Akbary is an enterpreneur and programmer. Specifically known for his contributions to the field of WebAssembly. He is the Founder and CEO of Wasmer, an innovative company that focuses on creating developer tools and infrastructure for running WasmSyrus AkbarySyrus AkbaryFounder & CEOWhat are Volumes?Volumes Use CasesGetting Started with VolumesWhats Next?Read morewasmerwasmer edgerustprojectsedgeweb scraperBuild a Web Scraper in Rust and Deploy to Wasmer EdgeRudraAugust 14, 2023dockeredgewasmer edgekubernetesThe Rise of the MonolithSyrus AkbaryNovember 28, 2023singlepassruntimeedgeAnnouncing Wasmer 4.3.0Syrus AkbaryMay 10, 2024edgeinstabootAnnouncing Instaboot: Instant Cold Starts for Serverless AppsSyrus AkbaryJune 20, 2024Making software universally accessibleTwitterDiscordGitHubExplorePackagesBlogProductsRuntimeRegistryEdgeUse casesWordpress HostingStatic Site HostingPHP HostingCompanyAboutValues & CulturePricingImprintPrivacyTerms"
