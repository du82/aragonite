["https://waswotsch.bandcamp.com/album/fudi-tech"]
title = "Fudi Tech | Cosili | waswotsch"
description = """
Fudi Tech by Cosili, released 21 June 2024

1. Was Isch Passiert
2. Schmassmann
3. Waswotsch
4. Das Bitzli Besser

The 10th release on Waswotsch comes from our long-time friend and companion Cosili, the uncrowned king of Zurich&#39;s Minimal House. And with this new EP, he establishes a new genre: Vernacular Booty Tech, or simply Fuditech.
The opener &quot;Was isch passiert&quot; is an upcycled remake of Abe Duque&#39;s &quot;What Happened&quot; tailored to the Limmat city - just faster and more humorous than the original. &quot;Schmassmann&quot; is a wonderfully self-ironic groover with musical references to Cosili&#39;s last releases. &quot;Waswotsch&quot; can be understood as a crazily playful ode to the label itself. And the dadaistic final track, &quot;das bitzli besser,&quot; would likely have been played multiple times a night by Hugo Ball at the Cabaret Voltaire."""
