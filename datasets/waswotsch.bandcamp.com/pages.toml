["https://waswotsch.bandcamp.com/album/coming-out-ii"]
title = "Coming Out II | waswotsch"
description = """
Coming Out II by waswotsch, released 14 May 2021

1. Bang Goes feat. Stara - Blödi Wält
2. Kaufmann - Rocket Man
3. Michal Ho - Shufflymulti
4. MRZ - Einfamilienhaus
5. Andaloop &amp; Idealist - Greta
6. Levent - Nemo2
7. Bes The Dwarf - Lovelife
8. Cosili - Unterwasserkiffer

Waswotsch Coming Out II

After a short quarantine/interruption/broadcast break/corona retreat/advertising break we enter the second round and musically expand our range.

With Bang Goes’ Blödi Wält (‘dumb world’) and its Zürich slang in our ears, we jauntily head for the approaching end of the world, the hippest place in town.

Inside, we are greeted joyfully by Kaufmann, who is just now spinning the funky minimal groover Rocket Man, winding upwards towards soulful heights in a mini-break.

Michal Ho&#39;s Shufflymulti whisks us down to the floor below, into a darker sonic space that keeps putting a mischievous smile on your face with its mad flashes of inspiration.

By now sweat is dripping from the low ceiling, when suddenly MRZ&#39;s Einfamilienhaus (‘one-family house’) bumps out of the PA, an endearingly relentless stomper that makes every ankle go rubbery.

Things get elegiac at the blue hour, with an oldskool ballad for Greta by Idealist &amp; Andaloop, although it&#39;s not quite clear to us whether we&#39;re dancing indoors or outdoors, towards the sunset or dawn.

With nemo2 by Levent, mind and body can briefly relax a bit on a fluffy couch, before they are pulled into a diffuse, twitching breakbeat, stirred and shaken.

Powerful and minimal repetition with magnificent reverb tails; Lovelife by BesTheDwarf gets to the point, and we have just now forgotten the time thanks to our headbanging.

The room has long since dissolved with Cosili&#39;s Unterwasserkiffer (‘underwater pothead’), and so we get carried through the time zones light-footedly, and eventually gently laid back onto the fresh grass of an abandoned park. 

The alarm goes off at 7.15 a.m."""
full_description = "Waswotsch /‘ vʌsvotʃ/ Risen to the surface from the depths of the ocean of electronic music. Loaded with the experiences of subcultural gatherings, driven by the revolutionary spirit of passion, and animated by an international, decentralized network of befriended artists, Waswotsch feels obliged to release good music. ... more Expansive four-track EP from the electronic-leaning solo project of Lee Malcolm, a founding member of experimental band Vessels. Bandcamp New & Notable Apr 4, 2024 This Bandcamp exclusive comes complete with a head-spinning background story (check the album notes) and eerie electronics. Bandcamp New & Notable Oct 29, 2023"
