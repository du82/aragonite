3. Wottau

In an apartment building the most diverse parties live more or less peacefully together or next to each other. 

But this is not the title track of the new ep &quot;Wottau&quot; by MRZ, but rather &quot;Wottau&quot;, a playful all-rounder that can be played at any time of the day or night - in an opening set for drive or in a late night flow for the necessary splashes of color. 

&quot;Machines on psilocybin&quot; is a 12 minute psychoacoustic trip on a typical mrz bouncy rhythm bed, where every time the echoing bleeps threaten to drift away, a nice hihat drums the herd back together. 

Finally, the &quot;Mehrfamilienhaus&quot; (apartment house), built on a solid brick foundation, with a warm american oak superstructure, countless small windows with moirée curtains and irregularly distributed victorian balconies, on which native weeds grow."""
