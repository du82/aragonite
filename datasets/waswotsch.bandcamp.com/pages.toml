["https://waswotsch.bandcamp.com/album/omw"]
title = "OMW | Michal Ho | waswotsch"
description = """
OMW by Michal Ho, released 10 December 2021

1. MIchal Ho feat.Signup - OMW, _On, On, On
2. MIchal Ho feat.Signup - Eyes Insane, Play the Game
3. OMW, On, On, On (Instrumental)
4. Eyes Insane (Instrumental)

MICHAL HO - OMW EP

Michal’s new tunes roll on a minimal jacking house and speed garage foundation, while funking things up to taste. 
Eyes Insane, Play the Game’s big 4/4 bottom and 5/8 polymetric percussion shuffles will keep ears and feet busy while making sure everyone wins in the process.
OMW, On, on, on sports a 16th-triplet shuffle over a bustling groove, chaotic essence distilled into danceable form.
Both tracks use vocal recordings from songs by NONE OF THEM (A Tree In A Field Records), the duo that Michal has been producing together with his musical partner Signup, since 2012."""
