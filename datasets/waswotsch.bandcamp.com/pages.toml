["https://waswotsch.bandcamp.com/album/coming-out-i"]
title = "Coming out I | waswotsch"
description = """
Coming out I by waswotsch, released 26 June 2020

1. Amygdala - Rising in cancer
2. Andaloop &amp; Idealist - People square
3. MRZ - Benji girl
4. Thomas Wood - Astray
5. Susie Star &amp; Michal Ho - F_ck music
6. Styro2000 - Schnipp-Schnapp
7. Big Hair - Descendos
8. Ben Kaczor - Sand

Waswotsch is a digital and vinyl label based in Zürich, Switzerland. 
The label is open to a wide range of styles, with a focus on left-field house and techno.

The two first releases – Coming Out I and Coming Out II – are compilations featuring tracks by various artists. They intend to give an overview over what is to come in the near future.

Coming Out I begins with Amygdala’s ‚Rising in Cancer‘, a serene, psychedelic ride on broken beats. 

On ‚People Square‘, Andaloop &amp; Idealist take a field recording from the Shanghai metro and channel their deep vibes onto the dance floor.

MRZ drops a lively groove with ‚Benji Girl‘, sporting some proper NYC jive talkin.

Thomas Wood delivers a lush and spacious dub house track, ‚Astray‘.

Susie Star &amp; Michal Ho go crazy on ‚F**k Music‘, a brain-controlled modular &amp; drum machine jam. 

Styro2000’s ‚Schnipp-Schnapp‘, is a tight minimal dancefloor shuffler, distinguished by tasteful FM synth aesthetics.

Big Hair’s ‚Descendos’ will go down on you. And give you a taste of the nice things to come. 

‚Sand‘, by Ben Kaczor ends the first volume of the compilation on a hypnotic note."""
