["https://waswotsch.bandcamp.com/album/palaver-ep"]
title = "Palaver EP | KFM live | waswotsch"
description = """
Palaver EP by KFM live, released 29 November 2024

1. Palaver
2. Blogdahl
3. Kanda Masta
4. Finocchio Spettacolo

We&#39;re thrilled to present the &#39;Palaver&#39; EP by our friend Sascha Hodler (aka KFM live) from Bern. Sascha had already contributed a track to the second compilation, &#39;Coming out II&#39; (WAWO 02). We were really impressed by &#39;Rocket Man&#39;, so it made sense for us to release an EP by him to give a deeper insight into his complex and extensive work.

The EP kicks off with the track that gives it its name, &#39;Palaver&#39;. Just picture this: you&#39;re riding your lowrider bike from your neighbourhood towards the city centre. You sit down on the comfortable saddle and put on your headphones. With a great, laid-back beat, a tasty bassline and some great percussion and sound effects, you ride through a park past loads of people chatting.
With &#39;Blogdahl&#39;, you leave the green park and head into a slightly sloping neighbourhood street. The beat speeds up a bit, you change gear and pass snack bars from all over the world and small shops.
When you get to the big junction, &#39;Kanda Masta&#39; kicks in. The streets get wider, the traffic gets thicker, and you pick up the pace. As you ride, you take in the glass and concrete buildings around you. As you get closer to the city centre, the neon lights are really starting to come alive. With ‘Finoccio Spettacolo’ you reach the pedestrian zone. You slow down and take in the sights as you make your way to the main square. There it is, the newly renovated cathedral, drawing our gaze upwards. After a quick stop, you continue on to the old town, where you&#39;ll be playing these tracks at the Waswotsch Party in your favourite club."""
full_description = "Waswotsch /‘ vʌsvotʃ/ Risen to the surface from the depths of the ocean of electronic music. Loaded with the experiences of subcultural gatherings, driven by the revolutionary spirit of passion, and animated by an international, decentralized network of befriended artists, Waswotsch feels obliged to release good music. ... more A new offering from the Shall Not Fade label, “Dancing For You” is low-lit, beatific minimal house at its finest. Bandcamp New & Notable Oct 28, 2019"
year_published = 2020
year_updated = 2025
