title = "Swingback | Thomas Wood | waswotsch"
description = """
Swingback by Thomas Wood, released 15 March 2024

1. Third Floor
2. Swirl
3. Crystal Tears
4. Southwind

We are very happy to release the next EP with our good friend Thomas Wood. 
The Zurich native has a constant and consistent output and has released over the last 10 years on JD (Subwax), Quality Vibe, Foul &amp; Sunk, Waehlscheibe, Idealistmusic and his own label TW Limited, among others, mainly on vinyl.
His productions are located in the broad field of house music and are characterized by a warm depth and crisp, finely crafted grooves.
The EP Swingback now shows his more minimal side.
The dubby third floor shines with an outstanding depth of percussive elements and lively chord sequences. Swirl is possibly Thomas&#39; most minimal track to date, with a beautiful swinging and playful drive. Crystal Tears, on the other hand, is beautifully dreamy and light with a lovely depth. The ambient track Southwind rounds off this 4 track EP and lets us land gently on earth."""
