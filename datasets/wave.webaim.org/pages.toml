full_description = '''Terms of Use and Privacy Notice Terms of Use By accessing or using the WAVE Accessibility Tool online web service or browser extensions, you acknowledge that you have read, understood, and agree to be bound by the WAVE Terms of Use. You may use the WAVE Accessibility Tool online web service or browser extensions to help you determine the accessibility of web content. You must first obtain WebAIM's permission if you want to sell or redistribute WAVE reports or data (e.g. number of WAVE errors, error listings, etc.) derived directly from WAVE, or if you want to modify, copy, license, or create derivative works from WAVE. It is not our intent that WAVE be used for legal or litigation purposes. While WebAIM supports the civil rights of individuals with disabilities to access web content, and provides services to help organizations implement accessibility, WAVE cannot provide a good measure of discrimination. Its use in legal actions can cause confusion and may suggest relationships with complainants, litigants, or defendants that are not valid. The use of WAVE or WAVE results/data for any purpose related to a legal action is not allowed without written permission. If you are aware of WAVE being used in violation of these terms, please contact us. You may not use WAVE in any manner that could damage, disable, overburden, or impair WAVE reporting services. In other words, excluding API usage, you may not use WAVE in an automated manner or author web spiders or bots that will send URLs or code to WAVE for processing, or automatically save WAVE reports without permission. Additionally, inappropriate content may be flagged and banned from WAVE. WAVE use is closely monitored and abuse will result in permanent IP or content blocking. This service is being provided "as is", without any express or implied warranty. WAVE's automated reports are generated by software. These machine-generated evaluations of website accessibility are not conclusive. In particular, WebAIM makes no representation or warranty of any kind concerning the reliability, quality, or merchantability of this service or its fitness for any particular purpose. Additionally, WebAIM does not guarantee that use of this service will ensure the accessibility of your web content or that your web content will comply with any specific web accessibility standard or law. You understand and agree that you download and/or use the WAVE service and/or browser extensions at your own discretion and risk and that you will be solely responsible for any damages to your computer system or loss of data that results from the download or use of WAVE. You acknowledge that WebAIM or third parties own all right, title, and interest in and to the WAVE service and browser extensions, portions thereof, or software provided through or in conjunction with WAVE, including without limitation all Intellectual Property Rights. You agree not to modify, adapt, translate, prepare derivative works from, decompile, reverse engineer, disassemble, or otherwise attempt to derive source code from WAVE. WAVE is © and ® 2025 - WebAIM. Privacy Notice By submitting a URL, file, or code to the WAVE server, you agree that content, media, and information contained within the submitted resources may be displayed within the WAVE report shown on the WAVE web site. WebAIM is not liable for content, media, or information presented within WAVE reports. WAVE may not be used to share, present, or disseminate offensive or illegal materials, or used as a proxy for viewing information anonymously. You may request to have your domain blocked from WAVE access. When using the WAVE online service, the WAVE server stores limited non-identifying information about users and WAVE online service reports. This information is available to WebAIM staff only. Pages submitted to the WAVE service are stored only temporarily. Cookies are used to track distinct user sessions, maintain user history, and generally improve the WAVE