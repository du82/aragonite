["https://wave.webaim.org/extension"]
title = "WAVE Chrome, Firefox, and Edge Extensions"
full_description = 'WAVE Browser Extensions The WAVE Chrome, Firefox, and Edge extensions allows you to evaluate web content for accessibility issues directly within your browser. Because the extension runs entirely within your web browser, no information is sent to the WAVE server. This ensures 100% private and secure accessibility reporting. The extension can check intranet, password-protected, dynamically generated, or sensitive web pages. Also, because the WAVE extension evaluates the rendered version of your page, locally displayed styles and dynamically-generated content from scripts or AJAX can be evaluated. Chrome Extension WAVE Chrome Extension at the Google Web Store Firefox Extension WAVE Firefox Extension at Mozilla Add-ons Microsoft Edge Extension WAVE Edge Extension at Edge Add-ons Using the WAVE extension Updates to the WAVE extension will automatically be sent to your browser when they are made available. To run a WAVE report, simply click on the WAVE icon to the right of your browser address bar. Click the icon again or refresh the page to remove the WAVE interface. You can also trigger a WAVE report by pressing Control + Shift + U (Command + Shift + U on Mac) or by activating the "WAVE this page" context (right click) menu item. If using Edge, the shortcut key can be defined or customized on the Manage Extensions page. To allow WAVE to evaluate local pages on your computer or pages in incognito modes, this may need to be enabled in the WAVE extension settings in your browser. Copyright, privacy notice, and other stuff The WAVE extension, its interface elements, design elements, functionality, and underlying code are © WebAIM. No information is transmitted from the WAVE extension, thus allowing secure and private accessibility reporting. By downloading the WAVE extension, you agree to the WAVE Terms of Use and Privacy Notice.'
