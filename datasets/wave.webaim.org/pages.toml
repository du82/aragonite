["https://wave.webaim.org/sitewide"]
title = "Site-wide WAVE Tools"
full_description = '''Site-wide WAVE Tools Need more than just one page at a time? Now you can put the power of WAVE to work on your entire site: Pope Tech WAVE AIM WAVE Stand-alone API WAVE subscription API Pope Tech - Powered by WAVE Pope Tech is an enterprise-level web accessibility evaluation system based on WAVE. This cost-effective, powerful tool helps organizations large and small significantly improve their web site accessibility for people with disabilities by providing monitoring and reporting of accessibility over time. Pope Tech offers the following features: Powered by the time-tested and popular WAVE accessibility evaluation engine. Based primarily on WCAG 2.1, the full power and educational resources of WAVE are incorporated directly into Pope Tech. Site-wide accessibility scanning and monitoring over time. Pope Tech takes the page-specific accessibility details of WAVE and makes them available for your entire web presence. Unlimited scans on any number of web sites! Pricing is based on the number of pages you want to scan, but you're then free to analyze those pages as often as you need. You can be up and running with usable accessibility data in a matter of minutes. Unlimited users! Users can be assigned to customizable groups and will only see accessibility issues for pages that are relevant to them. Learn more about Pope Tech WAVE AIM The Accessibility IMpact (AIM) score and service provides a measure of user experience quality for users with disabilities. It combines an Automated Accessibility Score based on WAVE data, and a Manual Accessibility Impact Score based on expert manual testing. This service provides a low-cost option for obtaining the following: The Accessibility IMpact (AIM) score for your web site. Comprehensive WAVE data and scoring for your entire web site. The Automated Accessibility Score allows comparisons of your site to web pages generally, based on data from the annual WebAIM Million analysis of one million home pages. A Manual Accessibility Score based on expert testing of a sample of site pages. This score provides insight into the end user impact of accessibility issues, something that is difficult to obtain from automated testing alone. Feedback and recommendations from expert testers. A detailed report on the accessibility issues detected. Learn more about AIM WAVE Stand-alone API and Testing Engine Send the WAVE Stand-alone API a URL and it will return the accessibility data about that page's accessibility. The API (Application Programming Interface) engine can be licensed for stand-alone usage on your server. You can analyze any number of web pages, including intranet, non-public, secure pages, etc. Results are returned in JSON or XML format compatible with the analysis tools that are available with your license. The WAVE Stand-alone API analyzes pages in a self-contained, "headless" browser after scripting has been applied—full DOM analysis of a rendered web page! The API can also take full-page screenshots, define customized viewport sizes (handy for checking mobile responsive breakpoints), supports pass-through authentication, etc. The stand-alone API runs on Windows, Mac, or Linux and simply requires Apache/nginx and PHP. The WAVE Testing Engine is a JavaScript library that conducts in-page accessibility testing. It is at the core of the WAVE API, but can also be easily integrated into most CI/CD and testing pipelines and processes, such as Selenium, Puppeteer, and other headless browser test processes. This licensable library can readily test a web page within your existing testing system and generate a JavaScript object or JSON file for further analysis. Learn more about the WAVE stand-alone API and Testing Engine WAVE subscription API Don't need to run WAVE locally? The WAVE Subscription API runs on WAVE-hosted servers, helping you collect WAVE data about your public site pages without installing the API engine. Pricing starts at only $10. Learn more about the WAVE subscription API'''
