["https://wave.webaim.org/api"]
title = "WAVE API"
full_description = "Register | Login WAVE API Stand-alone API The WAVE API can be licensed as a stand-alone, installable product. Learn more about the WAVE stand-alone API. What is the WAVE API? The WAVE API allows automated and remote accessibility analysis of web pages using the WAVE processing engine. You submit the URL of the page to be analyzed and the API returns back useful data about how accessible it is. The API engine evaluates your web page after CSS and JavaScript has been applied resulting in a very accurate evaluation of end user accessibility. How do I get started? Simply register for a new API key and purchase WAVE API credits. All new accounts get 100 free credits. If you already have an account, log in to the account manager. You can purchase additional credits for as little as $.025 each. The more you purchase, the less expensive credits become. If you're familiar with APIs, using the WAVE API will be very easy. You perform a simple GET request that contains your API key and the URL of the page to check, we'll send you back results data in either JSON or XML format. You can customize the request to get more or less data. Additional details are available in the API Specification. Pricing A balance of WAVE API credits is necessary to use the API. All new accounts get 100 free credits. Basic analysis of one web page costs you 1 credit. If you use advanced features of the WAVE API, it might cost you 2 or 3 credits per request. # of CreditsPrice 250-999$.04/credit. 250 credit ($10) minimum purchase. 1000-9999$.03/credit 10000+$.025/credit Payment can be made instantly via credit credit card or via check. Please register to get started. Using the API API requests are made by sending a request to http://wave.webaim.org/api/request?key={yourAPIkey}&url={url} (https can be used for secure connections). You can generate your unique key by registering. Several additional parameters are available to customize the request and data you receive - from basic overview data to full WAVE report details including XPath data for detailed accessibility analysis. Read the API Specification Details Support We're always striving to make WAVE and the WAVE API better. If you have recommendations or encounter an issue, please contact us."
