title = "About Us |         Waveform Lighting"
description = "We manufacture LED lighting products for specialty applications. Our expertise in color science allows us to pursue applications that demand the higest levels of light spectrum quality and scrutiny."
full_description = '''About Us #leftnav{display:none} We all take light for granted - but as lighting professionals, the intricacies and complexity of lighting intrigue us. Light, of course, allows us to see. Many lighting companies will stop there, and make it their mission to pursue maximum brightness for the lowest possible cost. But behind the human vision system itself is a fascinating mechanism, involving physics, biology and neurological processes - much of which is still not fully understood by researchers. On the other hand, developed through many years of technological progress are the standards and metrics for describing the physics and biology of light, which allow us to meaningfully compare, judge and analyze lighting. With developments in LED, the potential for innovation in lighting products has increased exponentially. The technology behind the diodes and LED phosphor materials allows for the creation of lighting products that provide unprecedented light colors, spectral design and brightness, often with substantial energy savings. Despite these technological developments and scientific metrics to back it up, color science is, at best, a theoretical model for the human vision system. Lighting is ultimately an emotional and personal experience, and is much more than the physics and biology that enables human vision or the dollars per lumen economics - it is also about aesthetics, architecture, psychology, and overall well-being. Adding to the multifaceted nature of lighting is the need to consider the specific application and installation. We do not believe in a "one size fits all" approach, and take pride in learning about our customer' specific lighting application in order to recommend the most optimal solution for their unique needs. Our appreciation for the complexity of lighting underlies all that we do at Waveform Lighting, and the endless challenges that it presents motivates us to always improve, whether it is with respect to product design, consistency or how we explain our products to our customers. There is a specific, almost subconscious feeling of joy we experience when the light is right, regardless of what the light is for. We make it our mission to help as many customers share in this joy as we can, and invite you to learn more about how our lighting can help you. Sincerely, An emphasis on quality Quality in light starts with quality in materials. Our extensive experience across the supply chain means that we are adamant about specifying the highest quality materials and inspection at every step of the manufacturing process. This includes raw materials such as LED die, phosphors and epoxies, as well as further downstream components such as PCB, diffuser & housing materials and power supply units. ★★★★★ "The results BLEW ME AWAY...I'm so happy to finally have discovered Waveform Lighting for my high quality lighting needs." An emphasis on quality Quality in light starts with quality in materials. Our extensive experience across the supply chain means that we are adamant about specifying the highest quality materials and inspection at every step of the manufacturing process. This includes raw materials such as LED die, phosphors and epoxies, as well as further downstream components such as PCB, diffuser & housing materials and power supply units. ★★★★★ "The results BLEW ME AWAY...I'm so happy to finally have discovered Waveform Lighting for my high quality lighting needs." Innovative designs Every type of lighting has unique needs and requirements that require a tailored approach to product design. We recognize that a one-size-fits-all approach does not always work, and take the necessary steps to ensure we truly understand what is important for each application. Color Science Expertise We are lifelong students and believe that understanding the fundamental science behind lighting and color is critical to building quality products. We maintain a knowledge base with articles and resources pertaining to lighting color science. Read More → ★★★★★ "Received very helpful advice from the sales staff to ensure I was getting what I needed...no less, no more." Color Science Expertise We are lifelong students and believe that understanding the fundamental science behind lighting and color is critical to building quality products. We maintain a knowledge base with articles and resources pertaining to lighting color science. Read More → ★★★★★ "Received very helpful advice from the sales staff to ensure I was getting what I needed...no less, no more." 100% US-Based Operations and Customer Support We stand behind our products, and that starts with our promise to offer quick and efficient customer support. You can browse our support center or reach out directly and we'll be sure to resolve any issues or questions promptly. See what our customers have to say about us! See Reviews → Want to learn more? Visit our product support center to learn more about our products. Download spec sheets, test reports and reach out to us with any questions. PRODUCT SUPPORT'''
