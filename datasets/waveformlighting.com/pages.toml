idth:50px;height:50px}.squareCard{width:50px;height:50px}}@media (max-width:650px){.productPanel{display:block;vertical-align:middle;width:100%;padding:0}.productDescription{display:none}}.link{position:absolute;width:100%;height:100%;top:0;left:0;z-index:1}.blogContainer{position:relative}.productDescription{font-size:12px} ‹ ‹ › ‹ › › ‹ › • • • • var refreshIntervalId = setInterval(roll, 6000); function roll() { if(document.getElementById('carousel-1').checked == true) { document.getElementById('carousel-1').checked = false; document.getElementById('carousel-2').checked = true; } else if(document.getElementById('carousel-2').checked == true) { document.getElementById('carousel-2').checked = false; document.getElementById('carousel-3').checked = true; } else if(document.getElementById('carousel-3').checked == true) { document.getElementById('carousel-3').checked = false; document.getElementById('carousel-4').checked = true; } else if(document.getElementById('carousel-4').checked == true) { document.getElementById('carousel-4').checked = false; document.getElementById('carousel-1').checked = true; } } function cancelInterval() { clearInterval(refreshIntervalId); } Product Categories A-Series LED Bulbs Our A19 and A21 lamps fit in standard lamp fixtures and are perfect for floor and desk lamp fixtures. Decorative LED Bulbs View our high CRI decorative LED bulbs that replicate the classic appearance of incandescent bulbs. BR30 LED Lamps BR30 lamps are ceiling lamps that fit in residential and commercial fixtures with 4-inch or wider openings. T8 LED Lamps Directly replace 4-ft fluorescent lamps with our T8 LED tube lights, compatible both with and without ballasts. LED-Ready T8 Fixtures LED tube light fixtures pre-wired and compatible with our T8 LED lamps. LED Linear Fixtures Linear lamp fixtures in 2-ft and 4-ft lengths. Plugs into standard wall outlets nd mounts using screws or magnets. LED Shop Lights Overhead light fixtures with hanging chains. Plugs into standard wall outlets. UV-A LED Lights We offer 365 nm and 395 nm LED lights for fluorescence and curing applications. UV-C LED Lights We offer 270 nm UV-C LED lights for germicidal applications. LED Modules & Accessories LED PCBs, panels and other form factors for a variety of industrial and scientific applications. LED Strip Lights Bright LED emitters mounted on a flexible circuitboard. Can be cut-to-length and installed in a variety of locations. LED Strip Dimmers Dimmers and controllers to adjust LED strip lighting system brightness and color. LED Strip Power Supplies Power supply units to convert line voltage to low voltage DC needed for LED strip light systems. Aluminum Channels Extruded aluminum channel profiles for mounting LED strip lights. LED Strip Connectors Solderless connectors, wires and adapters to join and connect LED strip light system components together. Lighting Applications Home & Residential Lighting products designed for home and residential use. Featuring high CRI and wall-dimmer compatibility. FilmGrade™ Film & Photo 95 CRI tungsten & daylight cinematography lighting, flicker-free controllers and DMX dimmers. Horticulture Lighting systems and lamps with spectra tuned for maximum growth and yield. realUV™ Ultraviolet UV LED lights with true ultraviolet light output for fluroescence and industrial applications. CENTRIC SERIES™ Human-centric lighting tuned for health and well-being. D65 Bias Lighting D65 calibrated light sources to ensure accurate lighting conditions for color-critical tasks. D50 Color Matching Lights for color-critical applications in graphic arts, calibrated to ISO 3664 standards. Aquarium Lighting Optimally tuned spectra for planted tank and aquarium applications. NorthLux™ Art & Painting Work on your art & painting projects with full confidence knowing it will appear the same under natural daylight. ★★★★★ "Waveform Lighting provides in-depth specifications and test results; far beyond any other manufacturer I have yet seen. Their website demonstrates that they are aware of what is required for quality lighting and of color science." ★★★★★ "I wanted quality lights and I found them here at Waveform. These lights set the benchmark high! I was very happy to get the super high CRI..." ★★★★★ "We have tried several different UV lights and the Waveform lights are without question the best we have used. Highly recommended." See All Reviews Spectral waveform matters. In lighting applications ranging from commercial to retail, hospitality to horticulture, both consumers and professionals have come to expect so much more than just improved efficiency and longevity from LED lighting. It is no longer enough to simply evaluate the quantity of light, but its quality. Any meaningful discussion of light quality is fundamentally based on a light source's spectral power distributions (SPD). Only by understanding exactly how much energy is emitted at each wavelength, can we meaningfully understand lighting quality metrics such as color rendition and fidelity. Try out our spectrum simulator to see what is possible with our LED technologies! Create your own SPD Our Lighting Technologies Ultra High CRI LEDs Read more about the science behind color rendering, and how it can help bring out true and lively colors. ABSOLUTE SERIES™ 99 CRI LED Learn about how innovative violet die and phosphor technology allows us to achieve 99 CRI. Flicker-Free LED Lighting Hidden flicker in LED lights can cause a variety of issues for both industrial and human-centric applications. SimpleColor™ LED Strips Plug-and-play color available in an variety of wavelengths such as red, amber, violet, green and blue. Spectrum Simulator Test out our SPD simulator to see how you can achieve both high CRI and full RGB color. Blog & Resources Browse our wide range of articles pertaining to lighting and color science. Want to learn more? Visit our product support center to learn more about our products. Download spec sheets, test reports and reach out to us with any questions. PRODUCT SUPPORT'''
