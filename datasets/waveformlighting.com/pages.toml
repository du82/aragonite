title = "Lighting Products for Color Matching |         Waveform Lighting"
full_description = "Color Matching D50 Replacement T8 Lamps for Light Booths & Color Viewing Stations Waveform Lighting's D50 LED lamps are full spectrum lamps that feature 95 CRI and conformance to ISO 3664 chromaticity. Unlike fluorescent lamps, LED lamps offer stable and consistent lighting conditions that last for many years. Show Now → D50 Replacement T8 Lamps for Light Booths & Color Viewing Stations Waveform Lighting's D50 LED lamps are full spectrum lamps that feature 95 CRI and conformance to ISO 3664 chromaticity. Unlike fluorescent lamps, LED lamps offer stable and consistent lighting conditions that last for many years. Learn More → D50 LED A19 Lamps for Task Lighting Applications Looking for a quick and convenient way to get D50 light? Our A19 lamps feature traditional E26/E27 lamp bases that can be installed into virtually any table lamp. Get up and running in seconds! Learn More → What is D65 and what is it used for?What is white? A seemingly simple question can have many answers, depending on who you ask. And for many applications, the exact definition can have significant consequences. One such definition is called Illuminant D65. In this article, we'll go through the exact specification and how you can ...Read MoreTop 4 Things To Consider Before Buying 6500K Daylight LED BulbsAre you looking for Daylight White LED bulbs? Unsure about whether 6500K is the best color temperature? Read our 4 point guide before making that purchase! 1) Be sure that you truly need 6500K daylight LED bulbs 6500K daylight LED bulbs are not for everyone, especially in a residential application. Al...Read MoreWhat is D50 for graphic arts & printing?A consistent and standardized light source is of critical importance for professionals in the graphic arts and printing industries. The reason? Different lighting conditions can create different visual perceptions of the same object, leading to serious control issues when performing basic color-based tasks such as proof vie...Read More"
