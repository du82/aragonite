full_description = "October 9, 2024 Our Music is Composed by HumansMENDEL KAELEN •Welcome to our new series of short blogs and essays, where we explore the diverse creative processes and inspirations that shape our musicThis series marks the first time we’ll be pulling back the curtain to share the intricacies of our music-making process with you and the various ideas that form its foundational building blocks.A common misconception is that our music is AI-generated. While our adaptive music platform has surely changed the way music is created and experienced, every note you hear in our product is crafted by skilled human composers.Since 2019, we’ve collaborated with over 30 diverse and talented musicians, each bringing their unique touch to our platform. Their musical contributions are informed by guidelines, research findings and theoretical frameworks, but what might set our music apart is our composition process.As you’ll discover, our approach is first and foremost rooted in the artist’s authentic connection with our mission. We have developed an approach to music composition that put’s each individual artist’s creative intuition, and personal expression at its core.Through our weekly Short Essays, this series will dive into the creative processes, theoretical foundations and scientific insights behind our music.Our weekly Artist Spotlights will celebrate the incredible musicians who bring our music to life. Follow this series via Instagram, LinkedIn or X. You can also follow Waverpaths founder Mendel Kaelen on Substack, where these and more articles are posted. Our Music is Trans-verbal A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More » Our Music is Trans-cultural A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More »"
