full_description = "For ResearchersWe support Drug Developers, Biotech Companies, Clinical Research Organisations and Universities with the licensing, standardisation and optimisation of music in research environments.Music plays an important role in psychedelic therapies Improved Hemodynamic Response Improved Tolerability Improved Remission Reduced Anxiety Research environments have unique needs to ensure data quality Selecting music to accommodate drug effects, individual patient needs, and specific patient populations necessitates careful standardization both within and across research sites. We help you design music conditions and protocols that adhere to highest standards of care, ethics and science Wavepaths has been a useful tool in our therapy sessions, by offering personalized music experiences for our clients. The feedback from both therapists and clients has been incredibly positive so far. Prof Kirsten MorleyPrincipal Investigator, The University of Sydney Wavepaths has been an essential part of my two clinical trial interventions, and many participants remark on how important and facilitative the music is to their experience. Prof Anthony BackPrincipal Investigator, The University of Washington We are utilizing Wavepaths as a means to standardize the music experience across approximately 40 different clinical sites in an effort to alleviate a potential variable in the program. Mark TheeuwesCOO, Reunion Neuroscience The music Wavepaths developed to accompany our clinical study has been liked by the study participants and the overall service provided by Wavepaths has been appreciated by all those running the study. Tim WilliamasMedical Doctor, Beckley Psytech In our work with MDMA-assisted therapy, the unique musical landscapes provided by Wavepaths have proven to be more than just background sounds—they are a therapeutic tool and have already led to pivotal moments in our patients' therapy sessions. Dr Jon LaugharneLead Psychiatrist, Emyria Group Previou