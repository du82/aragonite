full_description = "March 29, 2023 We are delighted to welcome Manvir Singh to join us for our next Experience as Medicine Conversation, hosted by Wavepaths Founder & CEO Mendel Kaelen. Event Date: 21 April 2023Event Time: 4pm – 5pm BST | 11am – 12pm ETBooking fee: £10-20 based on incomeLearning outcomes:A broad understanding of the role of spiritual practices (and shamanism, in particular) in healing around the worldThoughtfulness around how popular narratives misrepresent humanity’s diverse traditionsConsideration of therapeutic applications from traditional shamanic practicesSpeaker bio:Manvir Singh is an anthropologist at the Institute for Advanced Study in Toulouse. He graduated with a PhD in human evolutionary biology from Harvard in 2020 and has studied shamanism among the Mentawai people since 2014. He has written about anthropology, evolution, and deep history for The New Yorker, Vice, Wired, and Aeon, among other outlets.If you are a Wavepaths Care-Provider or have a Practitioner Community Membership, join freely via your member events space. var exampleCallback=function(){console.log('Order complete!')};window.EBWidgets.createWidget({widgetType:'checkout',eventId:'602536231087',iframeContainerId:'eventbrite-widget-container-602536231087',iframeContainerHeight:425,onOrderComplete:exampleCallback}) Our Music is Trans-verbal A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More » Our Music is Trans-cultural A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More » Our Music is Original and Exclusive A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More »"
