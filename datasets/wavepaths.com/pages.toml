full_description = "Courses and WorkshopsComplete the form to be contacted when new courses or workshops are organised. Name Email About you Signup for next training Wavepaths presents a new and updated workshop format on person centred music, accessible on-demand for those with an active subscription.The combined use of music and psychedelic substances predates Western medicine, with roots in Indigenous cultural practices. Yet with the rise of psychedelic therapy in the West, practitioners are left with questions regarding the function of music and how to support patients with music effectively in clinical settings. Try WavepathsIf you are a Wavepaths care-provider and do not have access, please email us.Learning OutcomesDeepen your understanding of the role of music in psychedelic therapy Learn about the key concepts and therapy techniques that make music-selection person-centredExperience and learn about the 6 distinct therapeutic functions of music and how to select and design music for psychedelic therapy sessions accordinglyGain insight and access to Wavepaths music tool for Care ProvidersOn-demand contentSession 1: Workshop Introduction & Deep Listening ExperienceDefining deep listening and your own relationship with music as a therapistUnderstanding the main shifts in attitude that come with deep listeningExperiencing the potential of music as a psychedelic first-hand and how deep listening can be used as a preparation and integration tool within psychedelic therapiesSession 2: Scientific Foundations for applying Person-Centred Music in Psychedelic TherapiesUnderstanding the neuroscientific mechanisms for experience-based learning and change within psychotherapyUnderstanding the primary therapeutic role of music in Psychedelic TherapyA brief overview of ongoing research and key findings at Wavepaths on Person-centred Music for Psychedelic TherapySession 3: Key Concepts and Definitions of Person Centred MusicUnderstanding the ways person-centredness can be applied to music-selection in psychotherapy contextsAn introduction to the key concepts of person-centred music and how these apply to music music-selection before and during therapy sessionAn introduction to 6 distinct therapeutic functions of music and their use-casesSession 4: Person-centred music selection for psychedelic therapiesAn overview of the main variables influencing music selection before the session (Session template / playlist design)Understand how to tailor music to the pharmacodynamics of the medicine Understand how to tailor music to the individual traits and therapeutic objectives of the patientSession 5: Person-centred music adaptation within psychedelic therapiesUnderstand music selection as an ongoing dialogue between patient, therapist, medicine and musicUnderstand how and when to adapt music during sessionsDefining 3 distinct types of psychological resistance your patient may express, and how to respond to each of these differently.Who this course is forDesigned as an introduction to music for/as psychedelic therapy, this workshop series is created for:Therapists working with Psychedelics, such as Ketamine, Psilocybin, MDMA and others. Psychedelic therapy studentsAny mental health practitioners who are looking to work with music in their practiceEquipment NeededSession 1 includes an experiential deep listening component that requires:Your best headphones or external sound systemAn eye mask to support full immersion in the musicA jumper or blanket to hand for warmth and comfortTry WavepathsIf you are a Wavepaths care-provider and do not have access, please email usWorkshop InstructorDr. Mendel Kaelen is the founder and CEO of Wavepaths. Prior to this, he worked as a PhD and postdoctoral neuroscientist at Imperial College London since 2012, where his research was the first to demonstrate music’s central role in psychedelic therapies. He is a thought leader on the therapeutic use of music and publishes and speaks frequently on this topic."
