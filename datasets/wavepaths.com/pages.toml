["https://wavepaths.com/blog/person-centred-music-workshop-3"]
title = "Person-centred Music Workshop | Wavepaths"
description = "Develop an understanding of the role of music in psychedelic therapy and how to apply it in a person-centred way"
full_description = "April 5, 2023 Designed for: Psychedelic therapists and any mental health practitioners or students interested in the therapeutic application of music.Hosted by: Dr. Mendel KaelenRunning from: April 28 to May 12, 2023Cost: £130 to £160 (free for Wavepaths care-providers)Dual Timezone: Timezone 1: Fridays at 8:00am BST / 03:00am EDT / 12:00am PT / 6:00pm AEDTTimezone 2: Fridays at 6:00pm BST / 13:00pm EDT / 10:00am PT / 4:00am AEDTWavepaths presents a new and updated workshop format on person centred music, accessible for all timezones.The combined use of music and psychedelic substances predates Western medicine, with roots in Indigenous cultural practices. Yet with the rise of psychedelic therapy in the West, practitioners are left with questions regarding the function of music and how to support patients with music effectively in clinical settings.This workshop is designed to teach participants the foundations for how to work with music in a person-centred way, within psychedelic therapies or other experience-based healing modalities. Reserve your place Wavepaths care-providers access request(If you would like to join this workshop but are unable to pay full price, please contact [email protected] to request support)Learning outcomes Deepen your understanding of the role of music in psychedelic therapy Learn about the key concepts and therapy techniques that make music-selection person-centredExperience and learn about the 6 distinct therapeutic functions of music and how to select and design music for psychedelic therapy sessions accordinglyGain insight and access to Wavepaths music tool for Care Providers Workshop content SESSION 1: LIVE ZOOM (2 hours)Workshop Introduction & Deep Listening ExperienceApril 28th (dual timezone)1. 8:00am BST / 02:00 am EDT / 11:00pm PT / 6:00pm AEDT2. 6:00 pm BST / 12:00pm EDT / 09:00am PT / 4:00am AEDTDefining deep listening and your own relationship with music as a therapistUnderstanding the main shifts in attitude that come with deep listeningExperiencing the potential of music as a psychedelic first-hand and how deep listening can be used as a preparation and integration tool within psychedelic therapies SESSION 2: ON DEMAND (70 min)Scientific Foundations for applying Person-Centred Music in Psychedelic TherapiesUnderstanding the neuroscientific mechanisms for experience-based learning and change within psychotherapyUnderstanding the primary therapeutic role of music in Psychedelic TherapyA brief overview of ongoing research and key findings at Wavepaths on Person-centred Music for Psychedelic Therapy SESSION 3: ON DEMAND (90 min) – New content!Key Concepts and Definitions of Person Centred MusicUnderstanding the ways person-centredness can be applied to music-selection in psychotherapy contextsAn introduction to the key concepts of person-centred music and how these apply to music music-selection before and during therapy sessionAn introduction to 6 distinct therapeutic functions of music and their use-cases SESSION 4: ON DEMAND (90 min) – New content!Person-centred music selection for psychedelic therapiesAn overview of the main variables influencing music selection before the session (Session template / playlist design)Understand how to tailor music to the pharmacodynamics of the medicine Understand how to tailor music to the individual traits and therapeutic objectives of the patient SESSION 5: ON DEMAND (90 min) – New content!Person-centred music adaptation within psychedelic therapiesUnderstand music selection as an ongoing dialogue between patient, therapist, medicine and musicUnderstand how and when to adapt music during sessionsDefining 3 distinct types of psychological resistance your patient may express, and how to respond to each of these differently. SESSION 6: LIVE ZOOM (2 hours)Live Q&A with Mendel on workshop content and music for psychedelic therapyMay 12th (dual timezone)1. 8:00am BST / 02:00 am EDT / 11:00pm PT / 6:00pm AEDT2. 6:00 pm BST / 12:00pm EDT / 09:00am PT / 4:00am AEDT Who this course is forDesigned as an introduction to music for/as psychedelic therapy, this workshop series is created for:Therapists working with Psychedelics, such as Ketamine, Psilocybin, MDMA and others. Psychedelic therapy studentsAny mental health practitioners who are looking to work with music in their practice Equipment neededSession 1 includes an experiential deep listening component that requires:Your best headphones or external sound systemAn eye mask to support full immersion in the musicA jumper or blanket to hand for warmth and comfortWavepaths care-providers access request(If you would like to join this workshop but are unable to pay full price, please contact [email protected] to request support) Workshop Instructors Dr. Mendel Kaelen is the founder and CEO of Wavepaths. Prior to this, he worked as a PhD and postdoctoral neuroscientist at Imperial College London since 2012, where his research was the first to demonstrate music’s central role in psychedelic therapies. He is a thought leader on the therapeutic use of music and publishes and speaks frequently on this topic. var exampleCallback=function(){console.log('Order complete!')};window.EBWidgets.createWidget({widgetType:'checkout',eventId:'609553229117',iframeContainerId:'eventbrite-widget-container-609553229117',iframeContainerHeight:425,onOrderComplete:exampleCallback})"
