["https://wavepaths.com/our-purpose"]
title = "Our Purpose | Wavepaths"
description = "Wavepaths purpose is to help facilitate personally meaningful experiences to improve mental health and well-being."
full_description = "Wavepaths' PurposeFrom viewing the struggles of human living as problems to suppress, to messages of personal meaning to attend.Mental health treatment is facing a paradigm shift away from symptom alleviation towards therapies that put personal meaning making at the centreOur purpose is to help care-providers and care-seekers to have personally meaningful experiences as a foundation to the explorative journey towards healing they both share.Wavepaths is founded on the fundamental insight that our ways of being in this world, our ways of relating to ourselves and others, are continuously shaped by life experiences.We have therefore developed a new category of therapeutic tools: Experience as Medicine – unifying insights from psychedelic science, machine learning, music theory, psychotherapies and experience design, in collaboration with artists, therapists, technologists and researchers. Our Product MissionWe have developed the world’s first person-centred music solution for practitioners to facilitate Experience as Medicine with music.Our software enables therapists and clinicians to work with music in a person-centred way, as an extension of the therapeutic relationships with clients.Our ValuesCo-Creation • TechnologyOur music is a collaboration between our artists and software. Our experiences are a collaboration between our artists, software and the listener.Co-Creation • ApproachHealing is a creative act between practitioner and patient. New meanings are created through shared explorations of the unknown.Co-Creation • BusinessCollaboration catalyzes creativity, and innovation happens when specialisms collide. Teamwork is where inspiration is nurtured into maturity.Agency • BusinessLeadership creates clarity and encourages autonomy and initiative. Ownership is the foundation of growth and success. Processes and guidelines are not prohibitive but enabling.Agency • TechnologyThe capacity for individuals to make decisions will never be reduced or removed, only strengthened. Technologies do not manipulate or generate dependence, only empower.Agency • ApproachOur approach is person-centred. It never claims authority over truth. It is never forceful. It supports patients and listeners to take compassionate ownership over their thoughts, feelings and actions.Trust • ApproachTrust is the basis for building strong and enduring relationships between practitioner and patient.. It is the foundation for one’s capacity to be open and vulnerable, and thus be fully seen, to heal and grow.Trust • TechnologyAll technologies feel natural and approachable. We have full data oversight with multiple levels of security, including end-to-end encryption.Trust • BusinessClear communication and accountability are the foundation of our integrity, team cohesion, and success. Working with mental health is a responsibility we do not take lightly. We are true to the evidence base and do not overpromise.Secularity • TechnologySoftware and their developments will be guided by empirical research. We avoid being influenced by, and any associations with religion, spirituality and New Age movements.Secularity • ApproachOur approach is inspired by humanistic and existential attitudes to healing. We acknowledge the language and beliefs of all patients and listeners fully.Secularity • BusinessWe are rooted in science and committed to maintain a humble and neutral attitude to the unknown. Personal beliefs and non-scientific concepts (pseudo-science) remain separate from our business."
