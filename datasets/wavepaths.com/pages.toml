full_description = "April 9, 2024 FREE Ask Me Anything Sessionwith Wavepaths founder Mendel Kaelen Join Dr. Mendel Kaelen for an exclusive LIVE and FREE interactive event tailored for those eager to delve into the transformative power of sound and music. Engage in an open Q&A session driven entirely by you, the participants. Pose your questions, lend your voice to the discussion, and immerse yourself in the conversations that ensue. All attendees will receive complimentary free trial access along with an exclusive 20% discount on their Wavepaths subscription (codes will be shared after the event). Day:25 April 2024Time:08:00 – 09:30 PT12:00 – 13:30 EDT16:00 – 17:30 GMTFormat:Delivered LIVE via ZoomDuration: 60 minsCosts:This is a FREE event About WavepathsWavepaths is a tool that facilitates live, unique, personalised music experiences for therapeutic use. The company is founded by Mendel Kaelen who prior to Wavepaths worked as a PhD and postdoctoral neuroscientist at Imperial College London, where his research was the first to demonstrate music’s central role in psychedelic therapies. He is a thought leader on the therapeutic use of music and publishes and speaks frequently on this topic. Our Music is Trans-verbal A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More » Our Music is Trans-cultural A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More » Our Music is Original and Exclusive A Wavepaths Series exploring the various building blocks behind it’s music composition process to make adaptive music for psychedelic therapies and other experiential approaches. Read More »"
