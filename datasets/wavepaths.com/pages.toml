full_description = 'Deep ListeningBe guided through an introspective listening experienceDeep ListeningWe developed Deep Listening as a transformative music listening method that emerged from our continuous research programs on the therapeutic power of music.By harnessing processes reminiscent of psychedelic therapies and other experiential therapies, this approach provides a guided and introspective experience, fostering meaning-making and emotional insight – practiced independently or in conjunction with your existing practices.You can book deep listening sessions for yourself or a group. All sessions are facilitated over Zoom. Depending on the group size and structure they can be between 1 to 3 hours long.Be introduced to Deep Listening and be guided into your experience with reflections, intention-setting and listening exercises.Experience a live-guided introspective music experience created with our music technology: Each session becomes a unique musical creation, created live, designed exclusively for you, and intuitively attuned to you.Join a post-session integration session to process and share reflections on your experience.Inquire below to learn morePlease let us know your interest via the message below, and we respond promptly. We can provide more materials and information, or jump on a video-call to explore the deep listening session in more detail. Currently all Deep Listening sessions are facilitated by Mendel Kaelen, unless it is indicated otherwise ahead of scheduling the session. Individual Up to 6 people Up to 12 people 12 + people Message Send DisclaimerDeep Listening is not offered as a psychotherapeutic or medical intervention. Deep Listening can facilitate powerful experiences. If you are currently experiencing acute emotional distress, please note that we cannot provide the relevant support during our experiences. If you are under the active care of a mental health practitioner, please seek their advice before participating. "Today was incredible... still reflecting on the experience but it was beautiful. The flute 😍... just awed! Can feel the energy, thoughtfulness, talent and heart that went into creating that session. Thank you ❤🫂✨❣️" "I had a very positive experience and felt an overwhelming sense of calm and quiet afterwards. So much so, that I remained laying down for an hour with no music just allowing my brain to drift in the comfort of that space." "Yesterday I had a chance to attend the deep listening session and wanted to express how EFFECTIVE and transformative it was"" "Thank you it was one of 5 most incredible musical experiences in my life!" Previous Next'
