["https://wavepaths.com/artists"]
title = "Our Artists | Wavepaths"
description = "World-renowned artists create music for Wavepaths, intended for inner exploration and personal transformation."
full_description = '''Our MusicMeet our talented artists and understand our creative approaches used to collaborate with themOur Composition ProcessWe carefully select the musicians we work with, based on their creative skills as well as their authentic connection with and recognition for the profound responsibilities we collaborate on. Our composition process is rooted in the one humble intention of serving and caring for those individuals who embarked on their vulnerable journey of growth, in need for guidance along the way. Our technology weaves individual musical contributions together in real-time, adapted to person, experience and medicine, to result in unique musical experiences that are an expression of each individual and each moment in time.You can explore our artist profiles below to learn more about each unique individual behind Wavepaths’ music. For more information about our approach to music composition please visit this page. Abul Mogard Italy Abul MogardItaly Abul Mogard is the alter ego of Guido Zen, an Italian musician residing in Rome. Mogard's work is characterised by innovative use of modular synthesisers and processed field recordings, creating soundscapes that are vast, immersive and evocative. "I first encountered Abul’s work via a live performance in a London church in the 2010s, and I’ve been captivated by his work ever since. It was immediately evident that Abul provides a unique contribution to the realm of drone music—his sound is vast and expansive, yet profoundly nuanced and rich. Abul’s authentic sonic signature aligns perfectly with our mission to explore novel music compositions for altered states of consciousness from a contemporary and artist-centric foundation."— Mendel Kaelen, Founder of Wavepaths Bandcamp Adrian Freedman United Kingdom Adrian FreedmanUnited Kingdom Adrian Freedman is a British born multi-instrumentalist, renowned for blending traditional music, contemporary composition and sacred music. His mastery of the shakuhachi demonstrates a deep connection to nature and spiritual practice. Contributions to Wavepaths include Shakuhachi, Kotu Harp, Trumpet and Handpan. "I was first introduced to shakuhachi through Arve Henriksen's music in the early 2000s. When I later witnessed Adrian perform, I was captivated not only by the instrument's incredible tonal colour but also by its deep roots in Zen philosophy. I believe Adrian is one of the rare artists who truly embodies the shakuhachi essence, as a tool for awakening. His multi-instrumental contributions to Wavepaths are authentic and rooted in humanity, yet transcending tradition."— Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp Andrea Belfi Germany Andrea BelfiGermany Italian-born Andrea Belfi is a drummer, composer, and experimental musician based in Berlin. Over the years Belfi has built a sound world blending the complex timbres of the acoustic with the endless possibilities of the electronic. He has a strong live reputation internationally and his performances are known to be energetic and hypnotic, featuring long-arching immersive soundscapes. "I had the privilege of experiencing Andrea Belfi live before inviting him to join Wavepaths. His blend of drums, percussion, and electronics are innovative, his music immediately captivating. As we explored the role of rhythm and sought out exceptional contemporary percussion artists, Andrea was a natural choice. His experimentations with drones, rhythms, and striking tonal colours result in impressive sonic journeys that are richly layered, energetic, entrancing and cathartic."— Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp Anilah Canada AnilahCanada Andrea Drury, the composer and vocalist behind Anilah, grew up in the remote wilderness of British Columbia, an experience that deeply influences her music. Fascinated by the therapeutic potential of sound, she studied psychoacoustic sound design and music therapy with mentors such as Silvia Nakkach and Ali Akbar Khan. "When I first heard Andrea’s voice and compositional talent, I had a strong instinct that she would be a valuable collaborator. As I learned more about her strong connection to sound and its therapeutic aspects, that instinct was fully confirmed. Andrea has brought a moving, heart-opening and authentic female voice to Wavepaths, one that ranges from profoundly soothing and reassuring to powerfully cathartic and expressive."— Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp BISHI United Kingdom BISHIUnited Kingdom BISHI is a London-born artist, composer, and producer of Bengali heritage, known for blending Hindustani and Western classical music. A multi-instrumentalist trained in sitar by Gaurav Mazumdar, a disciple of Ravi Shankar, she has released three critically acclaimed albums through her label, Gryphon Records. Her third album, Let My Country Awake (2021), explores themes of identity, anti-racism, and empathy, incorporating electric sitar and her four-octave vocal range. “Bishi is an amazing multi-instrumentalist and vocalist of Bengali heritage. She is a wonderful Sitar player and we were honoured to have her play and contribute diverse musical elements to the Wavepaths system.”— Robert Thomas, Lead Composer at Wavepaths Artist Website Bandcamp Christina Vantzou Belgium Christina VantzouBelgium Christina Vantzou is a Brussels-based composer known for her exploration of time, atmosphere, and harmony through a blend of electronics and acoustic instruments. She has released five solo ambient-classical albums on the American label Kranky, as well as the 2020 Multi-Natural LP—a dive into abstract electronics and field recordings with Belgian label Edições CN. Vantzou has also collaborated on two albums with John Also Bennett as CV & JAB and numerous other projects. Her latest work creates ceremonial and emotive spaces where voice, synthesizers, piano, winds, and electronics weave ethereal soundscapes. "I think I first encountered Christina’s music many years ago randomly through a blogger's coverage. It felt like a mysterious lost soundtrack to an arthouse dream. Later I heard an incredible remix of one of her pieces by Loscil and it reminded me to get in touch with her as I felt she could be a natural at creating bittersweet musical elements. Christina has a fascinating auto didactical creative process where she often creates her own language and methodology to describe musical theory and structure. This was a very interesting process to incorporate into our system."— Robert Thomas, Lead Composer at Wavepaths Artist Website Bandcamp David Wingo U.S.A. David WingoU.S.A. David Wingo is an American composer and musician known for his atmospheric film scores and indie-rock band Ola Podrida. He has scored films such as Take Shelter and Midnight Special, blending elements of Americana and ambient music to create richly evocative soundscapes. “I was first introduced to David through a mutual friend, and his experience in composition stood out pretty quickly. His music not only showcases a creative diversity, but a cinematic sensibility and unique skill for emotive storytelling. His resulting contributions to Wavepaths feel both nostalgic and timeless”— Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp East Forest U.S.A. East ForestU.S.A. East Forest is an American musician and producer whose ambient, meditative music blends electronic sounds with spiritual teachings. Known for his album Ram Dass and Music For Mushrooms, his music is often used in psychedelic settings. “I met Trevor first at a conference in San Francisco and we quickly bonded over our shared interest: creating music for psychedelic therapy. When exploring his music it was obvious that he would contribute a sound that is not only authentic and human, but imbued with intentionality. East Forest has contributed voice and piano recordings to Wavepaths, that have both an earthy and transcendent quality, beautifully dissolving polarities"— Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp Galya Bisengalieva United Kingdom Galya BisengalievaUnited Kingdom Galya Bisengalieva is a Kazakh-British violinist and composer known for her innovative approach to contemporary classical music. Her albums, such as Aralkum, combine ambient electronics with violin to explore themes of climate change and cultural heritage, creating immersive soundscapes. “I met Galya through my work with the London Contemporary Orchestra, of which she is the leader. Galya is an incredible violinist with a truly unique and experimental contemporary style. She is also an incredible composer and has created some wonderful soundtracks and albums. Galya’s style often encompasses detailed extended techniques such as artificial harmonics and Sul pont bowing. Her contributions to Wavepaths were incredibly pure and rich sounding violin elements which added a deep emotional resonance.”—Robert Thomas, Lead Composer at Wavepaths Artist Website Bandcamp Greg Haines Italy Greg HainesItaly Greg Haines is a British composer and producer known for his blend of modern classical and contemporary music. His albums, such as Slumber Tides and Digressions, combine orchestral and electronic elements to create evocative cinematic journeys. “Some of Greg haines’ songs were introduced via my earlier work in playlist design, and became what we may call “psychedelic therapy hits”. We met many times since, and Greg soon became amongst the first contributors to Wavepaths. His contributions are extensive and their very unique signatures are evident of Greg’s strong connection with this work and his relentless and very authentic creative drive. It’s been a real honour and inspiration collaborating closely with Greg."—Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp Hayden Thorpe United Kingdom Hayden ThorpeUnited Kingdom Hayden Thorpe is a British singer-songwriter known for his distinctive voice and introspective solo work. Formerly of Wild Beasts, he explores themes of love and identity in his albums Diviner and Moondust For My Diamond, blending ambient pop with poetic lyrics. “Meeting and starting collaborating with Hayden Thorpe was one of those wonderful surprise moments in the journey of Wavepaths. His talent, involvement, character and approach to music reflect the values we look for in our composers. His ability to express raw and sincere emotion in his music brings an emotive and essentially human quality to our work. His voice beautifully unifies a sense of both strength and vulnerability."—Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp Jon Hopkins United Kingdom Jon HopkinsUnited Kingdom Jon Hopkins is a British electronic musician and producer known for blending ambient, classical, and techno influences. His acclaimed albums, such as Immunity and Singularity, showcase intricate soundscapes and a seamless fusion of organic and electronic elements. “I was introduced to Jon Hopkins via a mutual friend, while he was finishing up his album Singularity. Both of us living in London, we started to converse often over music and consciousness and he soon became amongst the first contributors to Wavepaths. Jon displays a lived understanding of music’s power and potential, materialised through his delicate, thorough and creative sound designs, music composition and constant innovation. It’s been inspiring exploring these territories together and a honour to receive his truly visionary and creative input."—Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp Helping People Connect to Their EmotionsWorking on the Wavepaths material has informed my work. I think that it has affirmed a specific style of vocal composition that I have been cultivating for many years now. Specifically in relation to using the voice therapeutically, and creating music from a very present and intentional place. I would also say that my style of vocal work adds a human quality of warmth to Wavepaths, and hopefully helps people connect to their emotions during a listening session.Anilah NYX United Kingdom NYXUnited Kingdom NYX is a London-based electronic drone choir that merges choral harmonies with analog synthesis. Their music is recognised for their immersive, deep and otherworldly qualities. Website: NYX is a London-based electronic drone choir that merges choral harmonies with analog synthesis. Their music is recognised for their immersive, deep and otherworldly qualities. "I discovered NYX electronic drone choir at an amazing immersive event called Void. They create incredible textured atmospheres using just female voices. I had wanted to collaborate with them for years before Wavepaths, but once we were thinking about artists for bittersweet music for the system they immediately came to mind for vocals. Sian their lead composer provided some unbelievably emotional vocals for a very powerful piece which I collaborated on with her. By the end of the piece it builds to a truly vast sounding operatic climax. Many people have reported this piece being incredibly emotional for them."— Robert Thomas, Lead Composer at Wavepaths Artist Website Bandcamp Pascal Savy United Kingdom Pascal SavyUnited KingdomPascal Savy is a French composer known for his immersive atmospheric ambient and powerful experimental soundscapes. His music often explores themes of decay and memory, blending synthesisers with field recordings. "I met Pascal Savy many years ago in London’s experimental music scene, and we’ve been connected ever since. Pascal has a remarkable creativity and depth of thinking, making him embody so much of what we seek in our composers. Pascal’s long-form, captivating, introspective soundscapes often leave listeners speechless. His merging of analogue sound machines with modern digital tools gives his work an unparalleled transcendent dimension. Working with him from Wavepaths' inception onwards has been inspiring and a true joy."— Mendel Kaelen, Founder of Wavepaths Artist Website Bandcamp Robert Thomas United Kingdom Robert ThomasUnited KingdomRobert M. Thomas is a composer who creates adaptive, real-time music experiences through custom software designs. His innovative approach combines experimental instrumentation and advanced production techniques, allowing music to respond dynamically to various contexts. Robert has worked with Wavepaths since 2019 and is a leading expert in generative, adaptive, and interactive music. "Robert Thomas has been an invaluable force behind Wavepaths from the very beginning, serving as both a composer and system designer, and working closely with all our artists. It feels impossible to overstate the impact of Robert’s input, or the brilliance he brings to our technology, team, me, or our compositional processes. His unique blend of artistic and technical expertise has been influential in shaping our algorithmic and musical ecosystem, and his input has been foundational to bring my vision for Wavepaths to life.”— Mendel Kaelen, Founder of Wavepaths'''
