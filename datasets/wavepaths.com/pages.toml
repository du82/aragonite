full_description = "April 5, 2024 Music For Care ProvidersA FREE webinar introducing Wavepaths Join Dr. Mendel Kaelen and the Wavepaths team for this LIVE and FREE webinar designed for care-providers who want to start using music, or improve their use of music, in their therapeutic practice. In this webinar Mendel will present the latest research findings on the therapeutic use of music, an introduction to Wavepaths’ Person Centred Music approach, and offer a showcase of most recent music composed by Wavepaths for distinct use-cases, ranging from Ketamine, Psilocybin and MDMA to Breathwork and Psychotherapy. All attendees receive free trial access and a subsequent 20% discount on their Wavepaths subscription (codes will be shared after the event). Day:02 May 2024Time:08:00 – 09:30 PT12:00 – 13:30 EDT16:00 – 17:30 GMTFormat:Delivered LIVE via ZoomDuration: 90 minsCosts:This is a FREE event OverviewThe historical and cultural use of music as a healing tool is expansive, and mounting research continues to demonstrate therapeutic effects of music. However, the application of music by care-providers often remains restricted.This free event is organised for any care-provider interested in incorporating sound and music in their practice, regardless of the professional background and orientation. The webinar will provide a summary overview of music’s distinct therapeutic functions and present accessible ways to integrate music into your practice. What will you get?Learn about the distinct therapeutic functions of music and how these can be used as part of your own therapeutic approach.Experience music composed by Wavepaths musicians for different therapy modalities.Access Wavepaths in a free trial (no card details required) and a subsequent 20% discount. For who?Anyone interested in using music in their therapy practicePsychedelic therapistsPsychotherapistsKetamine infusion practitionersBreathwork FacilitatorsHealthcare WorkersWellness Practitioners About WavepathsWavepaths is a tool that facilitates live, unique, personalised music experiences for therapeutic use. The company is founded by Mendel Kaelen who prior to Wavepaths worked as a PhD and postdoctoral neuroscientist at Imperial College London, where his research was the first to demonstrate music’s central role in psychedelic therapies. He is a thought leader on the therapeutic use of music and publishes and speaks frequently on this topic."
