["https://waves.com/mixers-racks/emo-iem"]
title = "eMo IEM – Immersive in-Ear Mixing for the eMotion LV1 Live Mixer – Waves"
description = "Bring clarity, openness and comfort to in-ear monitors in live shows. No external hardware is needed: just set the monitors output of the Waves eMotion LV1 live mixer to immersive, and let your performers control their in-ears on stage."
