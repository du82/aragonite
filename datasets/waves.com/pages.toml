["https://waves.com/plugins/cla-vocals"]
title = "CLA Vocals Plugin - Waves Audio"
description = "Created in collaboration with Grammy award-winning mixer Chris Lord-Alge, the CLA Vocals plugin delivers the radio-ready rock vocal sound of Green Day, James Blunt, and Stone Temple Pilots."
full_description = "We worked with Grammy-winning mixer Chris Lord-Alge to pack his six favorite vocal effect, each with three optimized variations, into a plugin that excels at all-around vocal processing. Six faders optimize bass, treble, compression, reverb, delay, and pitch—quickly and easily. Now, the same kind of expertise applied to vocals by Green Day, James Blunt, Foo Fighters, and countless others can be part of your productions—and bring out the very best in your voice. Use Bass to add extra depth, reduce proximity effect issues, and more. Increase Treble for brightness, articulation, or a sweet sheen; reduce treble to warm up the sound, or tame stridency. Chris Lord-Alge’s expert use of compression is legendary, and reflected in the three compression variations. Use PUSH for punch, SPANK to hit harder, or WALL to brickwall the voice for maximum compression. Vocals without ambience sound dull and dry. Place your voice in three kinds of reverb (TIGHT, LARGE, or CHAMBER), and supplement it with 1/16th, 1/8th, or 1/4-note delays that sync to your DAW’s tempo for tight rhythmic effects. Embellish your vocals with a lush stereo image, thanks to three chorusing options. Choose mild modulation, spacious stereo imaging, or chorusing that’s similar to tightly double-tracked vocals. It’s easy to dial up sounds with CLA vocals, and you’ll be inspired by how it brings out the best in your voice. Choose from the superb collection of factory presets, create your own variations, or design sounds from scratch. “The most important part of any song is the vocals. I have taken the very best chains I use in my mixes every day, and poured them all into CLA Vocals. Vocalists want that sound on their vocals all the time, because that’s the thing about these chains—they’re designed to sound great and cut through every single time.”—Chris Lord-Alge"
