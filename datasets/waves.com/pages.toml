["https://waves.com/plugins/waves-harmony"]
title = "Waves Harmony - Real-Time Vocal Harmonizer Plugin - Waves Audio"
description = "Create instant vocal harmonies—up to 8 voices generated from a single voice—and quickly craft your dream vocal production. Personalize the character of each voice with pitch, formant, panning, delay, filtering and modulation."
full_description = "Create instant vocal harmonies—up to 8 voices generated from a single voice—and quickly craft your dream vocal production. Waves Harmony gives you three choices of workflow, so whether you’re a producer, songwriter, mix engineer or composer, it’s easily adaptable to your creative process. Easily personalize the character and texture of each voice with built-in pitch, formant, panning, delay, filtering and drag-and-drop modulation, to back up your vocal leads with creative color. In seconds, audition Jacob Collier, Ty Dolla $ign and Imogen Heap-style sounds in your song. Better yet—perform them live in real-time. As a producer, you might just want an instant harmonizing effect for the hook. As a composer, you may want to noodle with choir ideas as you write an arrangement. As a mix engineer, you might need incredibly rich, lush doubling for the chorus. Whatever your workflow or genre—Waves Harmony has you covered. Don’t know musical theory? Simply scroll through a versatile bank of quick-harmony chord presets, plus over 450 creative artist and factory presets, and pick what you like—the EASIEST way to generate harmonies if you’re not sure where to go. Performing live? Messing around in the studio? MIDI control lets you play backing vocals in real time. Connect a MIDI keyboard and play notes or chords as you sing to harmonize your voice—once you set the key and scale, everything you play will be in tune. Want total control over a full vocal arrangement? Click to draw in harmonies on the visual display—arrange, tune, shift formant, delay, filter and pan—then use the snapshots to adjust the arrangement as the song moves. Beyond harmonies, Waves Harmony can work wonders for vocal FX in any production or mix. Efficiently layer thick vocal stacks and create exceptional doubling effects, as well as complex delay arrays, creative voicings, modulated melodies and sequencing."
