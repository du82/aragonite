["https://waves.com/plugins/curves-equator"]
title = "Curves Equator – Smarter Resonance Suppression & Unmasking – Waves Audio"
description = "Perfect balance. Zero resonance. Equator 'learns' your content and offers a personalized suppression curve, improving full mixes, vocals & instruments."
full_description = "Curves Equator is a smarter resonance suppression plugin. It immediately improves any full mix, vocal, instrument or sample by removing problematic frequencies, fixing resonances and balancing inconsistencies. Additionally, it can learn your content & safeguard your work with a personalized suppression curve to avoid overprocessing. It offers groundbreaking frequency unmasking by learning the sidechain of a clashing source and dynamically applying the inverse curve on the part you’re mixing. Equator is the first in our new Curves Spectral Series of plugins, which pioneers the evolution of EQ. Two more Curves plugins will be available in early 2025: Welcome to your first self-driving EQs! Most sources have some issues. Just because they’re being masked by your room, your speakers, or other instruments, it doesn’t mean they’re not there. This is why we made Equator. Simply bring the Equator line down – you’ll hear the blanket lifted off your mix. Most other solutions are one-size-fits-all. They process your sound via a generic average curve, often harming the unique sound you created. By ‘Learning’ your audio, Equator gives you a personalized suppression curve, protecting against anomalies and imbalances and avoiding overprocessing. TIP: Use Learn to capture a healthy part of your audio as a template. Equator will then process the rest of the signal to match it. ‘Learning’ via sidechain can create some truly magical results in your mix, where sources will no longer clash in the same frequencies. If the vocals are most important, you can ‘SC Learn’ the vocal curve and apply its inverse shape on the instrument bus to carve perfect space for both. TIP: When using the Rider feature for dynamic carving, the louder the SC audio, the more carving occurs. Some problems are objective, and we fix all those. But some are subjective, and not everyone has the same idea of balanced. That’s why we have the Shape & Tilt controls, which adjust the target for the processing according to your taste."
year_published = 2025
