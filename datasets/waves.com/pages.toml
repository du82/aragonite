["https://waves.com/about-us"]
title = "About Us - Waves Audio"
description = "Waves Audio is the world’s leading developer of audio plugins and signal processors for the professional and consumer electronics audio markets."
full_description = "Waves is the world’s leading developer of audio plugins and signal processors for the professional and consumer electronics audio markets. Heard on hit records, major motion pictures, and popular video games worldwide, Waves’ cutting-edge software and hardware processors are used in every aspect of audio production, from tracking to mixing to mastering, broadcast, live sound, and more. Waves offers Native and SoundGrid audio plugins in VST, TDM, RTAS, and AU formats for Pro Tools, Logic, Cubase, Ableton and other popular hosts. Waves began in October 1992 with the introduction of the first audio plugin, the Q10 Paragraphic equalizer. The Q10 broke new ground in three major areas. First, it was the debut of the audio signal processor plugin, a tool commonly used today. Second, its graphic user interface gave users unprecedented control and eliminated the requirement for a DSP engineering background since it automated the filter coefficient calculations. Finally, the revolutionary Q10 offered sound quality equal to or better than many of its hardware counterparts. Another highlight of Waves’ first decade of success was the development of the L1 Ultramximizer™, which established a new benchmark for dynamic controls. Still considered innovative over a decade later, countless L1s are an integral part of studios all over the world. Propelled by an increasingly comprehensive product line, Waves quickly became a favorite of engineers worldwide and the choice of recognized audio masters. Waves founders Gilad Keren and Meir Shaashua share music as their first love. When establishing Waves, Gilad drew upon his experience as an accomplished sound engineer, having recorded and produced hits for major Israeli artists, while Meir had been a musician in successful bands. Both Gilad and Meir pursued engineering study: Meir went to Hebrew University and majored in Physics and Mathematics; Gilad attended Israel’s Technion Institute of Technology and majored in applied Mathematics. They met through a mutual friend at a recording studio in 1982. In 1990 they both worked for a start-up called AudioAnimation. Two years later, Waves Ltd. was formed in Israel and the U.S. simultaneously."
