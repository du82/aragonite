full_description = 'Contact Us FAQ Size Chart StormTec Wavian Fuel Cans Shipping Policy Return Policy Privacy Policy Blog About Us Swiss-Link, Inc is proud to carry authentic Wavian NATO Fuel Cans, HITCO goods, Swiss Link Classic Wool Blankets, and StormBags by StormTec USA. Contact/About Us Wholesale Policies FAQs Material Safety Datasheet Fuel Can FAQs Privacy & Security Privacy Policy Security Policy Ordering Checkout Changing/Canceling Orders Valid Payment Methods Sizing Chart Shipping Information About Shipping Shipping Methods Super Saver Shipping Returns Information About Returns My Account Managing Your Account Opening An Account Terms & Conditions Terms & Conditions of Sale Home Checkout Checkout When you are ready to complete your purchase, simply go to the Checkout and follow these steps to place your order: For registered users: If you are a returning customer and already have an account, please sign in using your email address and password and you will be taken directly to the first Checkout tab. For non-registered users: If you are not registered, you can proceed without creating an account or you can create an account. Billing and Shipping Tab. Enter your billing information as it appears on your credit card statement. Your credit card will not be accepted without the appropriate billing address and telephone number. If you are a returning customer, your billing address will automatically appear on the Billing and Shipping page. If the shipping address is different than the billing address, enter the address where you would like your order shipped. Shipping Options. From the options provided, select from the shipping methods that are available for the items you wish to purchase. For more information on shipping, click here. Payment Information. At this time, you must verify your address information is correct, review your order and then enter your payment method and click "Place Order". For more information on payment, click here. Purchase Summary. After you complete the checkout process, the Purchase Summary page confirms details of the order you have placed and also provides you with a reference number. We recommend that you print this Purchase Summary page for your records as it may be needed for order references. Order and Shipment Confirmations. You will receive an order confirmation email which will include an order number - you can use this to track your order in My Account. Once your items have been shipped, you will receive a shipping confirmation email with details of which items have been sent. Please note that if you order more than one item, it is possible that different items may arrive on different days depending on stock availability. VAT Invoice. After your items are invoiced, you will receive an email which includes a link for retrieval of a VAT invoice for items purchased and shipped to you. This email will be sent in addition to the Shipment Confirmation email you will receive.'
