gh a substantial 4lbs. They're a lighter grey color than their Charcoal Grey Classic Wool counterparts. Pair this blanket with one of our blanket carriers for a perfect picnic or bushcraft combo or throw it in the vehicle for emergencies. This blanket is sturdy enough for your greatest adventures and soft enough to keep in your living room. Even better, it's at a price that won't break the bank. Share The link to Classic Wool 50/50 Blanket has been copied Military Surplus Sizing Guide Military Surplus Sizing GuideDue to the wide variety of surplus clothing we carry, a standardized sizing guide helps customers find the best fit. However, military surplus can vary significantly in fit and cut. This chart serves as a general reference rather than an exact, tailor-level measurement.Each military has its own sizing system, which is why we’ve created this guide to help you understand how we size our surplus garments.Jacket & Shirt SizingWhen an official military size chart is unavailable, we measure each jacket or shirt from armpit to armpit (PtP) to estimate its fit. If a measurement falls between sizes, we round it down. For example, a shirt with a 19.75" PtP is categorized as a Small rather than a Medium.Sizing Chart (Armpit-to-Armpit Measurement)14"-15" PtP = XXS16"-17" PtP = XS18"-19" PtP = Small20"-21" PtP = Medium22"-23" PtP = Large24"-25" PtP = XL26"-27" PtP = XXL28"-29" PtP = 3XLPant SizingWe convert military pants to standard U.S. waist and inseam sizes. If a pair measures between sizes, we round down. For example, a 33" waist is listed as a 32" waist.How We Measure Pants:Waist: Pants are laid flat, and we measure straight across the waistband. This number is doubled to determine the U.S. waist size. (Example: A 16" flat waist measurement equates to a U.S. 32" waist.)Inseam: We measure from the crotch seam to the bottom of the cuff. (Example: A measurement of 30" from crotch to cuff is listed as a 30" inseam or 30L.) Shipping and Delivery Swiss Link maintains it