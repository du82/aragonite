tory on-site and ships directly from our warehouse in Chico, California.Standard Processing Time: Orders typically ship within 3-5 business days.Peak Season Delays: During high-demand periods, processing may take 7-10 business days or longer.As a small business, we appreciate your patience and support. If you have any questions about your order, feel free to reach out!'''
