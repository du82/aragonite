["https://wavianusa.com/customer-service-security-policy.html"]
title = "Security Policy"
description = "At Salesforce, we know that keeping your credit card information secure is important to you. That makes it very important to us. We use Secure Socket Layer (SSL) 128-bit encryption technology to protect your online information."
full_description = '''Contact Us FAQ Size Chart StormTec Wavian Fuel Cans Shipping Policy Return Policy Privacy Policy Blog About Us Swiss-Link, Inc is proud to carry authentic Wavian NATO Fuel Cans, HITCO goods, Swiss Link Classic Wool Blankets, and StormBags by StormTec USA. Contact/About Us Wholesale Policies FAQs Material Safety Datasheet Fuel Can FAQs Privacy & Security Privacy Policy Security Policy Ordering Checkout Changing/Canceling Orders Valid Payment Methods Sizing Chart Shipping Information About Shipping Shipping Methods Super Saver Shipping Returns Information About Returns My Account Managing Your Account Opening An Account Terms & Conditions Terms & Conditions of Sale Home Security Policy Security Policy At Salesforce, we know that keeping your credit card information secure is important to you. That makes it very important to us. We use Secure Socket Layer (SSL) 128-bit encryption technology to protect your online information. How do we make sure information is secure? We use the latest encryption technology (Secure Sockets Layer, or SSL) to secure your personal information. The information you provide when you place an order is encrypted (or coded) using a secure server for maximum security. This coding makes it extremely difficult for anyone to reach your information as it moves through our ordering system. Certain browsers will not allow communication through secure servers. If this is the case, you won't be able to place an order online. If you have any problems placing an order online please print your shopping page and place your order by phone at 1 (800) 555 0199. Please note that calls to 1 (800) 555 0199 that are not made from a UK landline may be subject to a charge. To check the security of your computer, look at the lower right-hand corner of your browser window if you are using Internet Explorer. If you see an unbroken key or a closed lock, then the encryption technology is active and the server is secure. You can also check by looking at the URL line of your browser; when you access a secure server, the initial characters of the site address will be "https." What if you link to another site? Our website may provide links to other websites that are not under our control. Neither we nor the third party service providers who manage our website are responsible for these linked websites, their content or for the actions of the providers of such sites. We recommend that you review the Privacy and Security Policies and terms of use for any websites you use. Do I have to turn the security feature on when I want to shop? The security features are automatic, and always on. You don't have to do anything but shop. Clicking "Checkout" on any page is all it takes to get started in our secure checkout process. How do I know if I'm connected when I start ordering? Once you've clicked the "Continue Checkout" button, your browser looks for a digital certificate to confirm that it's communicating with our website. Once a positive identification is made, your order will continue securely. Are all the pages on your website secure? Most of the pages on our website provide information about Salesforce and our products. We make this information available freely and there's no reason for these pages to be "secure." The pages that we make secure are the ones on which you actually submit purchasing data such as when managing your account, checking your order status, or within the "Checkout" area. For example, the entire checkout process, from introduction to final confirmation, is completely secure. Is my information secure when it's transmitted across the Internet? All of your information is encrypted before it's transmitted across the Internet, then decoded only after it arrives at our secure servers. Consent We take the privacy rights of users of this site very seriously and our Privacy Policy explains to you how certain information about you may be processed.'''
