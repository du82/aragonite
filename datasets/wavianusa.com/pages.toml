res between sizes, we round down. For example, a 33" waist is listed as a 32" waist.How We Measure Pants:Waist: Pants are laid flat, and we measure straight across the waistband. This number is doubled to determine the U.S. waist size. (Example: A 16" flat waist measurement equates to a U.S. 32" waist.)Inseam: We measure from the crotch seam to the bottom of the cuff. (Example: A measurement of 30" from crotch to cuff is listed as a 30" inseam or 30L.) Shipping and Delivery Swiss Link maintains its inventory on-site and ships directly from our warehouse in Chico, California.Standard Processing Time: Orders typically ship within 3-5 business days.Peak Season Delays: During high-demand periods, processing may take 7-10 business days or longer.As a small business, we appreciate your patience and support. If you have any questions about your order, feel free to reach out!'''
