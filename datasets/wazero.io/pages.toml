["https://wazero.io/community"]
title = """
Community ::
wazero"""
description = """
wazero is the only zero dependency WebAssembly runtime written in Go. It is used as a library dependency, allowing Go applications to embed or execute code written in other languages. It is also used as a CLI, to invoke WebAssembly binaries, a.k.a. wasm files.
wazero community # tetratelabs/wazero holds the Apache licensed, open source code and tests that ensure the project. A team of full-time staff at Tetrate steward the wazero, and you can read history for how everything began!"""
full_description = "Communitywazero is the only zero dependency WebAssembly runtime written in Go. It is used as a library dependency, allowing Go applications to embed or execute code written in other languages. It is also used as a CLI, to invoke WebAssembly binaries, a.k.a. wasm files.wazero community #tetratelabs/wazero holds the Apache licensed, open source code and tests that ensure the project. A team of full-time staff at Tetrate steward the wazero, and you can read history for how everything began!Today, wazero is a vibrant community of dozens of community members, leveraged by many open source projects and commercial products. Please have a look at our users page, as you may find something you need!Keeping up to date #wazero writes detailed release notes. Click Watch, Custom then Releases on the tetratelabs/wazero repository to automatically get notifications. You can also watch for the tag #wazero on various social media.We also have a gophers slack #wazero channel for support, updates and conversation! Note: You may need an invite to join gophers.Regardless, if you like what we are doing, please star our repo as folks appreciate it.How change works in wazero #Most wazero efforts start as localized experiments, then progressively build traction before becoming a feature. Before you start a large effort, be it docs or a test framework or a feature, check with one of the above channels. Someone may already have worked on this in the past and might join your effort. Sometimes, features are intentionally absent, usually with rationale documented in an issue. Regardless, the best advice is to join the community before proposing change, and read one of our CONTRIBUTING files which explains technical aspects of change culture."
