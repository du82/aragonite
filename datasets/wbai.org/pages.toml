["https://wbai.org/partners.php"]
title = "WBAI Radio - Partners"
full_description = "WBAI fulfills its mission to educate, promote, and aid creative activities which serve the cultural welfare of diverse communities by partnering with an array of not-for-profit organizations. Partnership support includes providing live airing of events, public service announcements, inclusion in our monthly e-newsletter, the recording and archiving of performances, space for public meetings, and opportunities for experimental use of the radio and other disciplines. WBAI benefits from partnerships by expanding our exposure to new listeners, through discounts for WBAI members, access to the use of larger public facilities for events, and by bringing an additional array of contemporary topics to the air. The Cell - an experimental theater group for playwrights and a collective for artists to incubate and present new works of art. Poet’s House - offers poetry resources and literary events that document the wealth and diversity of modern poetry, and stimulate public dialogue on issues of poetry in culture. With over 50,000 volumes of poetry—including books, journals, chapbooks, audio and video tapes, and digital media—the collection is among the most comprehensive, open-access collections of poetry in the United States. Alwan organizes film festivals and screenings, book/poetry readings and signings, lectures and conferences, art exhibits, musical and theatrical performances, and language and literature classes. Cave Canam – is a respected incubator for young African American poets. It is a home for the many voices of poetry and is committed to cultivating the artistic and professional growth of African American poets. Haitian Cultural Exchange - offers programs and services that seek to support emerging and established artists, promote cross-cultural exchanges, preserve Haitian cultural heritage, and encourage dialogue around contemporary social issues. Creative Coalition - addresses both film industry related issues, as well as general social issues. The group educates leaders in the arts community on issues of public importance, specifically in the areas of First Amendment rights, arts advocacy and public education."
