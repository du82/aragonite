["https://wbai.org/about.html"]
title = "WBAI - About Us"
full_description = '''WBAI is listener-supported radio. As a member of the Pacifica chain of radio stations, it provides a vast array of original programming to listeners in the Metropolitan New York City region and worldwide on this site. CPB Information Click either button to the left for detailed information on the governing and advisory boards of both Pacifica and WBAI, lists of all current members, station licensing and contact information. Click the button to the left to explore employment opportunities at WBAI-FM and The Pacifica Foundation. Otis Maclay 3729 Cahuenga Blvd West Studio City, CA 91604 DMCATakedown@pacifica.org Put 'TAKEDOWN' in Subject Line of Email We cannot process your request without contact information The Pacifica Foundation was launched by pacifist Lew Hill in 1949 with the first ever listener-funded radio station - KPFA, Berkeley. The Pacifica Mission called for radio that would: "foster understanding amongst nations and individuals, encourage creativity, and promote innovative, uncensored distribution of news." WBAI began as WABF in 1941 and moved to 99.5 FM in 1948. The station took a respite from broadcasting in 1953, and came back on the air as part of World Broadcast Associates, Inc (WBAI) in 1955. On January 10, 1960, WBAI joined Pacifica when philanthropist Louis Schweitzer gave the station to the network. Pacifica now has 5 radio stations (the other four are in Berkeley, Los Angeles, Houston, and Washington, DC) and more than 50 affiliate stations across the U.S. "From a programming standpoint, WBAI is definitely not easy-listening. We all know what this means. We are charged with the responsibility to provide radio that informs, educates and entertains New York with a critical approach to politics, art, music, literature, health, and culture. We are not radio that is just on in the background. We require a commitment from our listeners; we actively challenge you, but we engage you. You are part of the process, the most important part of the broadcasting equation. "'''
year_published = 2025
clearnet = "https://wbai.org/about.html"
