["https://wbai.org/cabindex.php"]
title = "WBAI Radio - Community Advisory Board"
full_description = "All public broadcast stations receiving funds from the Corporation for Public Broadcasting (CPB) are required by law to have a Community Advisory Board (CAB). Click here for the CPB’s statement of Community Advisory Board Requirements. The CAB is a vehicle for the community to effectively provide input to the Local Station Board (LSB). The CAB's role is strictly advisory. It has no authority over the daily management or operation of the station. The function of the CAB is to review the station's programming goals, services provided by the station, and any significant policy decisions made by the station. The CAB advises the LSB and the Program Director with respect to whether the programming and other policies of the station are meeting the specialized educational and cultural needs of the communities served by the station, along with the CAB being able to offer other advice respecting station programming goals, the station’s service, and its significant policy decisions. The WBAI CAB normally meets once a month, on the third Sunday of the month, at 1:00 PM. The CAB meets by teleconference at 619-309-1058. The pin number is 641711. Everyone is welcome to join the meeting."
year_published = 2025
clearnet = "https://wbai.org/cabindex.php"
