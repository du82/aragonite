["https://wbai.org/mission.html"]
title = "WBAI Radio - Mission"
full_description = "WBAI began as WABF in 1941 and moved to 99.5 FM in 1948. The station took a respite from broadcasting in 1953, and came back on the air as part of World Broadcast Associates, Inc (WBAI) in 1955. The Pacifica Foundation was launched by pacifist Lew Hill in 1949 with the first-ever listener funded radio station - KPFA, Berkeley. The Pacifica Mission called for radio that would foster understanding amongst nations and individuals, encourage creativity, and promote innovative, uncensored distribution of news. On January 10, 1960, WBAI joined Pacifica when philanthropist Louis Schweitzer gave the station to the network. Pacifica now has 5 radio stations (the other four are in Berkeley, Los Angeles, Houston, and Washington, DC) and more than 50 affiliate stations across the U.S. The Pacifica Foundation is a California non-profit corporation. Its governance procedures are laid out in its bylaws and (which includes the Mission Statement). The Board Of Directors, referred to as the national board, has fiduciary responsibility over the network. On and off over the years, there have also been Local Station Boards with varying degrees of responsibility that work with the national board. (a) To establish a Foundation organized and operated exclusively for educational purposes no part of the net earnings of which inures to the benefit of any member of the Foundation."
year_published = 2025
