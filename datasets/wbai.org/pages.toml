["https://wbai.org/donate"]
title = "WBAI Radio - NYC"
full_description = "WBAI is radio for the 99%! Unlike commercial radio, we have no rich corporations as sponsors, no deep well of corporate support to keep us on the air. What we have is better - you, the listeners and members of WBAI! You are our primary sponsors. You provide the bulk of the funding to keep the signal on the air, bringing you the unique content that's not found anywhere else on the radio dial. We can't do it without you. Check the icons below to explore the wealth of different options we offer for you to support WBAI. Donate today and help keep this honored and beloved institution on the air! And remember, anyone who donates $25 (or more) to WBAI becomes a member, eligible to stand for, and vote for the Local Station Board, which helps determine the future direction of WBAI! Recurring Monthly Donation Become a BAI Buddy by committing to a recurring monthly donation to WBAI. Your generous automatic monthly gift will help keep WBAI on the air! Plus, enjoy the perks that come with being a BAI Buddy, including discounted theater tickets, special offers at restaurants and clubs, discount or free tickets to museums and exhibits, and savings on many other products and services. A truly painless way to do a great deal of good! Donate stock to WBAI and get the full tax deduction regardless of the price when WBAI cashes it in. To donate securities, call the WBAI Development Director at 833.922.4692 (WBAI NYC) for further details. A number of wonderful employers in the New York City area have partnered with WBAI to generously match contributions made by their employees - in essence, doubling the donation to WBAI. Click the image above to see if your company is on the list. If it is, contact your company to arrange a matched donation. If your company is not on the list, you can nominate WBAI to be added. Contact matchingfund@wbai.org for assistance. Any time you search the Internet using goodsearch, or purchase through a goodshop partner site or dine-in or -out through gooddining, goodsearch makes a donation to WBAI!"
year_published = 2025
clearnet = "https://wbai.org/donate"
