["https://wbai.org/privacypolicy.html"]
title = "WBAI-FM - Local Board Elections"
full_description = "This privacy policy has been compiled to better serve those who are concerned with how their 'Personally identifiable information' (PII) is being used online. PII, as used in US privacy law and information security, is information that can be used on its own or with other information to identify, contact, or locate a single person, or to identify an individual in context. Please read our privacy policy carefully to get a clear understanding of how we collect, use, protect or otherwise handle your Personally Identifiable Information in accordance with our website. What personal information do we collect from the people that visit our blog, website or app? When donating or contacting us via our Web site, as appropriate, you may be asked to enter your name, email address, mailing address, credit card information, bank information or other details necessary to implement the transaction or communication. When do we collect information? We collect information from you when you make a donation,, fill out a form or enter information on our site. How do we use your information? We may use the information we collect from you when you register, donate, sign up for our newsletter, respond to a survey or process your transactions. How do we protect visitor information? Our website is scanned on a regular basis for security holes and known vulnerabilities in order to make your visit to our site as safe as possible and we use regular Malware Scanning. Your personal information is contained behind secured networks and is only accessible by a limited number of persons who have special access rights to such systems, and are required to keep the information confidential. In addition, all sensitive/credit card or banking information you supply is encrypted via Secure Socket Layer (SSL) technology. We implement a variety of security measures when a user makes a donation, enters, submits, or accesses their information to maintain the safety of your personal information. All transactions are processed through a gateway provider and are neither stored nor processed on our servers."
year_published = 2025
clearnet = "https://wbai.org/privacypolicy.html"
