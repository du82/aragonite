["https://wbai.org/employment.php"]
title = "WBAI Radio - Employment"
full_description = "WBAI is listener-supported radio. As such, many of the positions at WBAI are filled by volunteers and interns. However, from time-to-time, positions in management, administration and technical areas become available. Check this page regularly to see what positions may be available both here at WBAI and at its parent, The Pacifica Foundation. The Pacifica Foundation was founded in 1946 and is a non-profit organization providing educational services through listener-supported community FM radio. There are five listener-supported FM radio stations in the Pacifica network: KPFA Berkeley, KPFK Los Angeles, KPFT Houston, WPFW Washington, DC, and WBAI New York and a network of over 250 Affiliate stations. Pacifica is dedicated to education, free speech, peace, social justice, and cross-cultural understanding. Pacifica’s national and local boards include elected delegates of listener and staff members. The Pacifica Foundation is an EQUAL OPPORTUNITY EMPLOYER. Pacifica Foundation does not discriminate on the basis of race, color, ancestry, religious creed, national origin, ethnicity, gender, age, marital status, disability, medical condition, or sexual orientation. Women and minorities are encouraged to apply."
