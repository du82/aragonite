title = "Nile Rodgers — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''NILE RODGERS2011 We Are Family Humanitarian Award HonoreeFour-time Grammy nominee Nile Rodgers is one of the most enduring and prolific artists in the music business. In 1977, he and his late partner, Bernard Edwards, created the group CHIC, whose number-one hit "Le Freak" remains Warner Bros.' biggest-selling single of all time. Rodgers has produced, written or played for some of the greatest artists in the business, including Madonna, David Bowie, Diana Ross, Eric Clapton, Mick Jagger, Sting, Duran Duran, the B-52's and Joss Stone. As artist, producer or writer, Rodgers is responsible for the sales of more than 100 million records–including his world-famous "We Are Family," which he co-wrote with Edwards. Rodgers is currently the only African-American to own a national music distribution company. After a lifetime of supporting charitable efforts and organizations, Nile founded the We Are Family Foundation in 2002. Back to Honorees'''
year_published = 2011
year_updated = 2014
