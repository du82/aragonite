full_description = "Black Artist Database (B.A.D.) United KingdomProject: Knowledge Transfer Network - DJing in the ClubBlack Artist Database (B.A.D.) supports Black artists by connecting communities on a centralized platform and challenging inequalities in the music industry. Through the Knowledge Transfer Network - DJing in the Club program, B.A.D. is sharing expertise from leading DJs, bridging technological gaps that impact Black women, queer, non-binary, and differently-abled people in the community, empowering a new generation of DJs, and entrenching the community spirit across generations. “By addressing systemic barriers and promoting inclusivity, we ensure that Black artists feel valued and supported, fostering a more diverse and equitable industry.”Check out Black Artist Database’s work here: Website << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
