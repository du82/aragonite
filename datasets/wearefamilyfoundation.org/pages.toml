["https://wearefamilyfoundation.org/bill-margaritis"]
title = "Bill Margaritis — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''Bill Margaritis2004 We Are Family Visionary Award HonoreeWilliam G. Margaritis is Corporate Vice President of Worldwide Communications and Investor Relations of FedEx Corporation. He is responsible for all public relations, investor relations, employee communications, and community relations activities for FedEx Corporation and its subsidiaries.Margaritis has been at FedEx since May of 1997. He has developed and led communications for various crises, acquisitions, a rebranding initiative and a new go-to-market strategy. In recent years, he has been successfully transcending the image of FedEx from an air express carrier to a full-service transportation powerhouse. These efforts have helped propel FedEx to the Top 10 "World's Most Admired Companies" list by FORTUNE magazine for three consecutive years and the Harris Interactive/Reputation Institute Top 10 list.Prior to joining FedEx, Margaritis was vice president of Bechtel International, based in London, England, responsible for managing the public relations and marketing communications program for Europe, Middle East, Africa and Southwest Asia. He also worked in Washington, D.C. and Athens, Greece for separate divisions of the company.In addition to his extensive international communications background, Margaritis has acquired a depth of government affairs experience following positions with Occidental Petroleum, the U.S. Secretary of Commerce's Office of Intergovernmental Affairs, and the Michigan State Senate. In 1984, Margaritis worked with the Reagan-Bush reelection campaign as the Deputy Director for the State of Michigan.He serves on various boards, including the Larry King Cardiac Foundation, Arthur Page Society, the Reputation Institute and the Memphis Big Brothers/Big Sisters Organization. He is also on the Board of Counselors for the Council on Public Relations Agencies.A native of Greece, Margaritis earned his bachelor's degree in business from Michigan State University. Back to Honorees'''
