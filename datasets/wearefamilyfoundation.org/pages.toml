full_description = '''WHAT IF WE COULD STOP LANDMINES WITH MUSIC. TURN THIN AIR INTO WATER. TURN MUSIC INTO SOMETHING YOU CAN TOUCH. FIT 3 YEARS OF TRASH IN ONE JAR. USE ALGORITHMS TO END WAR. CERTAINLY YOU WOULD HAVE A STORY TO TELL. WHATTEDxTeen is more than a conference. It is an engaged international community committed to making positive impact in the world through creativity, innovation and social good - through the power of story telling. HOWLicensed from TED, TEDxTeen is one of the most well known TEDx events. Since 2010 over 125 speakers and performers have taken its global stage, igniting a youth powered dialog you can’t look away from. TEDxTeen talks have been viewed over 30 million times, and have made their way into school curriculums across the world. WHYTo become one of the most important megaphones for this generation. To share 'ideas worth spreading', by young people, for young people, that powers a global conversation. View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449600922-9PS90XFF7DP6BNS4VLWM/26667054199_cf80d8a012_o.jpg" alt="26667054199_cf80d8a012_o.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449603714-ADGFD3WEFAAY0VHCSSAR/26667055419_946c908fdd_o+%281%29.jpg" alt="26667055419_946c908fdd_o (1).jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449671124-CVDVZN9TWF8ZQ4GHUJEQ/37728199264_2fdc8bfaa3_o.jpg" alt="37728199264_2fdc8bfaa3_o.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449607756-PIJXJQUCFG3H2O6QI63Q/37728202684_6a01a50cf8_o+%282%29.jpg" alt="37728202684_6a01a50cf8_o (2).jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449711238-CN563ORCG1VN38IXRT3B/37728200444_522f5ac2eb_o.jpg" alt="37728200444_522f5ac2eb_o.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449617540-NOJVCCV4O5VGDDDA17CE/38411957372_dd1bd2845d_o.jpg" alt="38411957372_dd1bd2845d_o.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449609706-52NXWO7MO3QNNO2KUMQ7/38411957752_110138eb6d_o.jpg" alt="38411957752_110138eb6d_o.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449769629-088AHQ0OR0I0URZ4N7E5/38411956762_0ccba3fdc4_o.jpg" alt="38411956762_0ccba3fdc4_o.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449858421-IWL4D7XB4TU3AS3ARLGS/37728203004_80fa0391f4_o.jpg" alt="37728203004_80fa0391f4_o.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1515449858903-PT0K887INSNII87ZSCCF/38411949272_885732f60a_o.jpg" alt="38411949272_885732f60a_o.jpg" /> #block-yui_3_17_2_21_1478470117170_5575 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -0px; } #block-yui_3_17_2_21_1478470117170_5575 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 0px; margin-bottom: 0px; } Visit the Website This Independent TEDx event is operated under license from TED.'''
