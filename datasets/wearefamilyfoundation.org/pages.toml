SA WHAT IF...YOU COULD SAVE SOMEONE’S LIFE WITH A SELFIE?ERIN SMITHIS... DEVELOPING FACIAL RECOGNITION SOFTWARE THAT CAN EARLY DIAGNOSE DISEASE. 3DD Home - Nav 3DD Home - Welcome 3DD Home - Mattie 3DD Home - Global Teen Leaders 3DD Home - Coalition 3DD Home - Case Studies'''
