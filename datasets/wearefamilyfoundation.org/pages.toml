["https://wearefamilyfoundation.org/gtl-micro-docs"]
title = "GTL Micro Docs — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = "RETURN TO THREE DOT DASH MAIN PAGE THREE DOT DASH GLOBAL TEEN LEADERSMeet some of the incredible Global Teen Leaders (GTLs) who are driving change in their communities and beyond through their inspiring “micro docs” - created in collaboration with WAFF and GTL Alumni Filmmaker Gary Bencheghib, during the 2019 Just Peace Summit. AMONGE 17, SOUTH AFRICAAmonge is the co-founder of Blackboard Africa, a youth-led movement that supports the next generation of African leaders through mentorship, leadership development and empowering self-narratives. Blackboard Africa has hosted workshops for more than 400 young leaders with recognition by Global Citizen, TEDx, Black Girls Lead, Google, Facebook, Black Girls Rock with former US First Lady, Michelle Obama and UNICEF’s Voices of Youth. ARCHIKA 16, USAArchika co-founded The EduSTEM Initiative. EduSTEM aims to utilize STEMX curriculum, such as STEMXPoliticalScience and STEMXEntrepreneurship, to educate, encourage and empower minorities in STEM. They have held over 60 workshops, camps and events, directly impacting more than 500 minority youths across the globe. ARI 17, USAAri coded the Trill App, a safe social network app that fosters tight-knit communities built on support rather than judgement. Trill has been downloaded more than 50,000 times in over 40 countries and has initiated over 300,000 conversations. Audrey 17, philippinesAudrey taught herself programming with online resources and after struggling to find female role models in the process, she founded Women in Technology (WiTech) to empower other youth in STEM. CHIAra 18, philippinesGrowing up in a poor area of the Philippines, Chiara was fascinated with technology, and equally frustrated with the widening technology gap. So at age 16, she founded Developh, a tech skills exchange platform for students that teaches 55,000+ youth! DANISH 15, CANADADanish invented the Wireless Interconnected Non-Invasive Triage System (W.I.N.I.T.S), a vital-signs detector system that monitors patient’s heart rate, blood oxygen, body temperature & blood pressure using a single finger sensor for under $25 per unit. This novel device will exceptionally improve the efficiency of monitoring patients in the hospital, at a disaster site or at home. Diana 18, paraguaySometimes the solution to one problem is the antidote to another! Paraguay has thousands of abandoned stray animals and a garbage problem of 2,000 tons of waste a day. Here’s how Diana is fixing one issue with the other! FAITH 18, USAFarmworkers pick the food that we all eat, unfortunately though, their work is extremely hard and dangerous especially with rising global temperatures. 18 year-old Faith is innovating for farmworker safety and rights with her app, Calor that’s already combatting rates of heatstroke. HASHAM 18, PAKISTANHasham developed Solvify, a super-absorbent-particle made from non-hazardous, biodegradable waste materials that reduces crop need for water by 70%, need for fertilizer by 50% and increases crop yield by 20%. Solvify completely biodegrades in 6-10months into a non-toxic fertilizer. Hasham has received a $11,000 grant to pilot Solvify with 200 farmer families. HUNTER 19, NEW ZEALANDHunter is the founder of Focal Projects, a film production company focused on telling stories for social impact. They cover a a variety of issues ranging from human trafficking to dementia to child cancer. Hunter’s films have been watched by more half a million people globally. JAMES 19, UK & USAAfter hearing from a peer that they were NOT going to vote in an upcoming election even though they were eligible, James decided he had to do something to boost civic engagement with young people! James started Young Voices, a 150-page civics e-textbook used in over 40 schools! KESAVA 19, INDIAKesava is using travel to build greater cultural understanding breaking stereotypes and encouraging communities to embrace diversity with Hitcher Hub. Hitcher Hub uses cross-country cycling as an intercultural learning opportunity. Covering 8 countries in 80 days, Hitcher Hub stories have reached more than 7 million people LUCAS 18, BRAZILDespite the health and environmental benefits they bring to a city, trees are not prioritized by urbanization. 18-year-old Lucas is working to change that through his app, Maracanã e suas Árvores. Maracanã e suas Árvores is rallying communities to protect what is precious! MALCOLM 18, USAHospitals don’t have to be as daunting as they seem, especially for children. 18-year-old Malcom is transforming how children perceive and experience the hospital with Artpass! MARISSA 18, USALosing her grandfather to heart disease pushed Marissa to start her research on treatment of chronic diseases at the age of only 14. Since then, she created Theraplexus, a computational platform that maps the molecular interactions of a disease! Marissa’s innovative thinking is helping identify 200+ disease-specific drug targets. MELISSA 17, USAMelissa founded 1000 Books For, a 501(c)3 organization that sends books and entrepreneurial learning materials to developing communities across Mongolia, China, USA, Russia (Siberia), Liberia, Mexico, India, Venezuela and Australia. 1000 Books For has supported over 35,000 students and 400 teachers in 9 countries. PEYTON 17, USAWhen Peyton spoke to her friend about their experiences with cultural intolerance as a refugee, she knew that something had to be done to create more intercultural communities. WATCH how she has since impacted 1500+ students! PRIYA 18, USA Priya created GroGreen Tech, an app that enables farms to sell their unwanted produce, which would otherwise go to waste to restaurants at cheaper prices. GroGreen is a game-changer considering the US alone throws away over 6 billion pounds of food a year because “it’s ugly.” GroGreen has been recognized by MarketWatch, WCBS880 radio, 2017 Consumer Electronic Show, Crain NY Business “20 Under 20” and Mobile Apps Showdown “10 Under 20.” PRIYANKA 19, NEPALGlobal Teen Leaders know a thing or two about BREAKING STIGMAS and 19-year-old Priyanka is no exception! In addition to her educational and awareness campaigns, she has distributed sanitary products to over 650 women in her home country of Nepal. ROCÍO 19, PUERTO RICO, USARocío is an award-winning scientist recognizing for her insight on the proteins involved in regulating or causing disease. She’s received numerous awards for her scientific discovery including the Outstanding Achievement for Ability and Creativity in research at the 2017 Intel International Science and Engineering Fair. She’s been featured in ACS 50 Forward Campaign along with Chemistry Nobel Laureate Sir J. Fraser Stoddart. SHREYA 18, USA18-year-old Shreya, as seen in Forbes and Smithsonian Magazine, is using predictive analytics and data mining to identify and potentially prevent future mass shootings. TANISHQ 18, USAIn a world where young people often don’t have access to the career guidance they need and deserve, 18-year-old Tanishq is making it free, accessible and more impactful than ever! VIRAJ 16, USALosing his grandfather to cancer after he had been misdiagnosed, then re-diagnosed too late, is what pushed Viraj into machine learning at the age of 14. Since then, he designed OncoVision, an app that predicts a patient’s risk to cancer based on their symptoms, demographics & lifestyle. ZAIN 18, india Millions of people live with paralysis and lack access to affordable prosthetics. Meet Zain, a teenager using his passion for innovation to help patients recover and regain motor function with ExoHeal! ZIYAAN 17, india Fact: 1 in 10 girls globally do not have access to menstrual hygiene products. 17-year-old Ziyaan is fighting to end period poverty with AASW, an initiative that empowers young women to self-produce their own menstrual materials while also breaking down social stigma!"
year_published = 2019
year_updated = 2024
