description = "France, United Kingdom    Project:  Red Cloud Project: Periods In Your Language  The Red Cloud Project, powered by Ricebox Studio, is an innovative education campaign that combines creativity and technology to challenge period stigma and help young people and their families from the South and East A"
full_description = "Ricebox Studio France, United KingdomProject: Red Cloud Project: Periods In Your LanguageThe Red Cloud Project, powered by Ricebox Studio, is an innovative education campaign that combines creativity and technology to challenge period stigma and help young people and their families from the South and East Asian diaspora rethink religious misinterpretations and harmful intergenerational beliefs about menstruation. After initiatives like the “From Your Big Sisters” period book, the “Period Cloud” installation, Augmented Reality tools, workshops, and more, Ricebox Studio is now building on the Red Cloud Project with the upcoming “Periods In Your Language” digital campaign to continue redefining menstrual education.“Our power is using creativity to find novel, entertaining yet serious ways of tackling periods whilst respecting our target audience's needs through appropriate primary, secondary, and user research and testing.”Check out Ricebox Studio’s work here: Website << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
