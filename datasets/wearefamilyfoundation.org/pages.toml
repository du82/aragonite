full_description = "Thando Mlambo (Dark Art Matter) ZimbabweProject: Femme Sonic PowerhousePronouns: She/HerFemme Sonic Powerhouse, presented by multidisciplinary creative Thando Mlambo’s Dark Art Matter (DAM) laboratory for ideas, is a community-centered platform dedicated to training and promoting femme DJs while positively contributing to the local culture in Zimbabwe. The project will pair professional femme DJs with aspiring DJs for a weekend intensive and offer an innovative curriculum that foregrounds contemporary experimental processes.“My creative, professional, and academic pursuits have always centered the ways art can, and does, interrogate and unsettle systems of inequality.”Check out Thando’s work here: Instagram << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
