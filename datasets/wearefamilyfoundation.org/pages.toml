full_description = '''JACKSON BROWNE2010 We Are Family Humanitarian Award HonoreeJackson Browne has written and performed some of the most literate and moving songs in popular music and has defined a genre of songwriting charged with honesty, emotion and personal politics. Beyond his music, Jackson is known for his advocacy on behalf of environmental and social justice, human rights and arts education. He's a co-founder of the groups Musicians United for Safe Energy (MUSE), Nukefree.org, and the Success Through the Arts Foundation, which provides education opportunities for students in South Los Angeles.In a career that spans four decades, he has released 18 albums. His songwriting and his social and political interests became integrated with the album "Lives In the Balance", in the mid 80's.In 2002, he was the recipient of the John Steinbeck Award. In 2004, Jackson was given an honorary Doctorate of Music by Occidental College, for "a remarkable musical career that has successfully combined an intensely personal artistry with a broader vision of social justice. In 2007 and 2008, he received the Chapin-World Hunger Year and NARM Harry Chapin Humanitarian Awards. This past April, he was honored with the Duke University LEAF Award for "advancing a national and international environmental agenda," and "inspiring others to help forge a more sustainable future for all." Back to Honorees'''
