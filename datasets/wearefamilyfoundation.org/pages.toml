["https://wearefamilyfoundation.org/adam-lambert"]
title = "Adam Lambert — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''Adam Lambert2012 Unity Award HonoreeWhen Adam Lambert appeared on the eighth season of American Idol, people couldn't stop talking about the singer with the glam-rock sartorial flair, razor-sharp sense of humor, and jaw-dropping, powerhouse voice. His debut album, For Your Entertainment, scored a smash single with "Whataya Want From Me," and earned him a Grammy nomination.In 2012, he released his follow-up album, Trespassing, which debuted at Number One on the Billboard Charts. Trespassing, which was Executive Produced by Lambert, revealed both his dark and light sides, and the complex gray area in between. "The search for balance is a key underlying theme of this album," says Lambert. "It's more honest and self-aware. I think it paints a clearer picture of who I am and what I want out of life."Adam has graced the covers of Rolling Stone, Details, Entertainment Weekly, The Advocate, and Out, appeared on every major late-night and daytime talk show, and became the first openly gay mainstream pop artist to launch a career on a major record label in the United States. Lambert channeled his newfound fame into raising awareness about issues close to his heart, advocating on behalf of LGBT causes The Trevor Project, Equality California, and GLAAD, as well as for charity organizations MusiCares, charity:water, and DonorsChoose.org."I'm a firm believer that life doesn't just happen to you", Lambert says. "We are all on a journey that we have the ability to affect and change. Sometimes we have to trespass out of our comfort zone in order to evolve." Back to Honorees'''
