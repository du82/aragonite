["https://wearefamilyfoundation.org/yttf-the-creatives-2024/developh"]
title = "Developh — We Are Family Foundation"
description = '''Philippines    Project:  KAKAKOMPYUTER MO YAN  Developh, organized by Chia Amisola, is a community of practice working towards a more critical, poetic, and archipelagic internet by reclaiming technology as a tool for liberation. KAKAKOMPYUTER MO YAN ("that's what you get for using the computer!'''
full_description = '''Developh PhilippinesProject: KAKAKOMPYUTER MO YANDeveloph, organized by Chia Amisola, is a community of practice working towards a more critical, poetic, and archipelagic internet by reclaiming technology as a tool for liberation. KAKAKOMPYUTER MO YAN ("that's what you get for using the computer!") is their art exhibition and platform that commissions, preserves, and showcases works at the intersection of new media/art and technology highlighting third-world internet and networking cultures. After presenting 20 Filipino artists tackling themes of labor, identity, religiosity, queerness, corruption, nostalgia, abortion, immigration, and beyond, Developh is working on producing the next issue of KAKAKOMPYUTER MO YAN.“By working towards 'archipelagic internets', we work towards an intersectional remaking of a web amidst crisis, climate, and collapse — understanding the internet as something we can make and unmake. Beyond our struggles and suffering is the intimacy, love, and communal care that exemplifies our resilience – these narratives are just as crucial, what makes us human.”Learn more about KAKAKOMPYUTER MO YAN here: Website << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes'''
