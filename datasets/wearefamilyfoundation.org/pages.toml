full_description = "President Jimmy Carter2016 Mattie J.T. Stepanek Peacemaker Award HonoreeJIMMY CARTER served as the thirty-ninth president of the United States from 1977 to 1981. His administration negotiated the Panama Canal treaties, the Camp David Accords between Egypt and Israel, the SALT II treaty with the Soviet Union, and U.S. diplomatic relations with the People’s Republic of China. In 1982 President Carter became University Distinguished Professor at Emory University in Atlanta, Georgia, and founded The Carter Center, a nonpartisan, nonprofit organization that actively addresses international and national issues of public policy. He is the author of twenty-eight books and numerous articles. In 2002, he was awarded the Nobel Peace Prize. Back to Honorees"
