title = "Kaanchi Chopra — We Are Family Foundation"
description = "India    Project:  At a Floral Pace  Pronouns:  She/Her  At a Floral Pace is a public art installation project that confronts the inequities of urban green spaces in cities like New Delhi and New York, where marginalized communities are devoid of greenery. At a Floral Pace co-designs large-scale flo"
full_description = "Kaanchi Chopra IndiaProject: At a Floral PacePronouns: She/HerAt a Floral Pace is a public art installation project that confronts the inequities of urban green spaces in cities like New Delhi and New York, where marginalized communities are devoid of greenery. At a Floral Pace co-designs large-scale floral prints crafted from pressed and preserved living materials (flowers, fungi, leaves, twigs) with the neighborhoods’ residents and installs the pieces in public spaces, sparking dialogue, encouraging local environmental activism, and reimagining urban spaces.“By juxtaposing the vibrancy of flowers against the harshness and grayness of these areas [...], I seek to not only bring attention to the unjust urban planning, but also utilize floral motifs in increasing residents' emotional health, and collectively inspire a radical reimagining of cities where nature flourishes in our surroundings regardless of one's income level.”Check out Kaanchi’s work here: Instagram << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
