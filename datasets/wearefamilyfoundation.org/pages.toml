title = "Privacy Policy — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = 'We Are Family Foundation Global Privacy PolicyWe Are Family Foundation (“WAFF” or “we”) is committed to protecting your privacy. We are pleased to provide this Privacy Policy to inform you of the personal data or personal information we may collect from you or other sources and how we may use and share that information. If you have any questions or comments about the Privacy Policy or our privacy practices, please contact us at hello@wearefamilyfoundation.com.This Privacy Policy describes the ways WAFF manages Personal Information (as defined below) that it receives in the course of its operations and from employees, vendors, visitors and guests, including in each such case on our website foundation, blogs, social media pages, mobile applications, and mobile site (collectively, the “Site”). All individuals who process Personal Information on behalf of WAFF are expected to protect Personal Information by adherence to this Privacy Policy.For a description of the rights of California residents under the California Consumer Privacy Act, and our handling of Personal Information of California residents, please see the section titled “Privacy Rights for California Residents” below.Personal Information Generally: “Personal Information” or “personal data” is any information relating to an identified or identifiable natural person; an identifiable natural person is one who can be identified, directly or indirectly, in particular by reference to an identifier such as a name, an identification number, location data, an online identifier or to one or more factors specific to the physical, physiological, genetic, mental, economic, cultural or social identity of that natural person. “Process” or “processing” means any operation which is performed upon Personal Information, whether or not by automatic means, such as collection, recording, organization, structuring, storage, adaptation or alteration, retrieval, consultation, acquisition, holding, use, disclosure by transmission, dissemination or otherwise making available, alignment or combination, restriction, erasure or destruction. Collection and Use of Personal Information: The types of Personal Information we may collect (directly from you or from third parties) depend on the nature of the relationship you have with WAFF and the requirements of applicable law. Below are the legal bases and some of the ways we may collect and use Personal Information. Program Participants: The data WAFF collects from or on behalf of its Program Participants include information such as title, name, address, phone number, email address, business or company affiliation, username and answer to a security question and password (if you have access to any of our secure online resources or mobile applications).We process Personal Information about or on behalf of Program Participants for a variety of foundation purposes including but not limited to: provide program servicesgenerally manage Program Participant informationrespond to questions and requestsprovide access to certain areas and features of the Siteverify Program Participant identitycommunicate about Program Participant accounts and activities on the Site and systems, and, in WAFF’s discretion, changes to any WAFF policytailor content, publications, advertisements and offers we believe may be of interest to Program Participantsprocess transactions and services utilized by Program Participantsimprove the Site and systemsdevelop new servicesfurther purposes disclosed at the time that Program Participants provide Personal Information, or otherwise with consentSuppliers: The data WAFF collects from its Suppliers relate to the management of Supplier relationships and the exchange of requested products and services. They may include title, name, address, phone number, email address, invoicing and other payment information and agreements executed with WAFF. We process personal information about Suppliers for a variety of business purposes, including but not limited to: generally manage Supplier informationrespond to questions and requestsprovide access to certain areas and features of the Siteverify Supplier identitycommunicate about Supplier accounts and activities on the Site and systems, and, in WAFF’s discretion, changes to any WAFF policyprocess payment for products or services purchased by WAFFimprove the Site and systemsdevelop new products, processes and servicesprocess applications and transactionsfurther purposes disclosed at the time Suppliers provide personal information or otherwise with consentOther Personal Data Collection on the Site and through Electronic Communications: In general, you can visit the Site without providing us with Personal Information about yourself. However, in order to access certain information, services or features on the Site, you may be asked to provide Personal Information. Where you have consented to WAFF’s processing of your Personal Information, subject to applicable legal obligations that may apply to us and to our lawful ability to enforce our rights or your obligations to us, you may withdraw that consent at any time and opt out. Publications and Email Alerts: On the Site, you may choose to receive publications and email alerts from WAFF. If you elect to sign up, we may ask you for information such as your name, address, company, phone number, email address and publications of interest. We use the information you provide to send the requested communications and to communicate with you about other topics that we believe may be of interest to you. We offer you the option to decline these communications at no cost. Blogs: You may subscribe on the Site to receive an RSS feed or email from WAFF blogs. We use this information to send you the requested communications and to communicate with you in connection with our blogs. You may also be able to submit comments to WAFF blogs that include Personal Information, such as your name and email address, with your comment. We may use your name to identify you as a commenter on our blogs.Social Media: Social media resources include, but are not limited to, social networks, discussion boards, bulletin boards, blogs, wikis and referral functions to share website content and tools with a friend or colleague. We may collect information that you make publicly available through social media resources. We may use this information for a variety of foundation purposes, including for foundation development. WAFF will comply with the terms of this Privacy Policy and the privacy policies applicable to the social media resources it uses.Contact Us: You may communicate with us through the “Contact Us” link on our Site or the App. If you choose to contact us via the Site we may ask you for information such as your name, address, company, phone number and email address so we can respond to your questions and comments. We also may use the information you provide to communicate with you about topics that we believe may be of interest to you. Email Communications: When you engage in email communications with any WAFF employees, we may retain records of your email address, along with other information that we collect, such as your name, title, address, phone number, email address, or company affiliation, as well as information about your engagement with emails, attachments, and/or links that we send to you. We may use this information for a variety of foundation purposes, including for business development.Event Registration: You may register for WAFF-sponsored events. You may provide us with information such as your name, address, company, title, phone number and email address when registering for an event. We use this information to register you for the event and contact you about event updates. We also may use the information to communicate with you about other events and topics that we believe may be of interest to you. Password-Protected Extranet: You may access parts of the Site that are password-protected in order, for example, to obtain access to documents in the course of WAFF providing you with legal services. You may provide us with information such as your name, address, company, title, phone number and email address when accessing password-protected parts of the Site. We will not use this information to market to you. Aggregate Information: From time to time, we may collect and monitor other nonpersonal information about the use of the Site, such as the number and frequency of visitors to our Site. This information may include the websites that you access immediately before and after your visit to the Site, the browser and operating system you are using, your Internet protocol (IP) address, host name, device type, geographic data, and screen resolution. We collect this information in order to determine which areas of the Site are most popular and to help us develop and improve our Site. We may group this information into aggregate visitor data in order to describe the use of and preferences on the Site. However, this aggregate data does not personally identify you or any other visitors to the Site except as agreed by you.Cookies and Other Tracking Technologies: When you visit our Site, we collect certain information by automated means to help us improve our Site and provide customized services and information. Like many companies, we collect this information through the use of “cookies” and other tracking technologies. Cookies are small text files that are downloaded to your computer’s memory and hard drive when you visit certain websites. Some cookies are automatically deleted when you close your browser or after a short period (“temporary cookies”), while others can be stored longer on your computer, sometimes until you delete them manually (“persistent cookies”). For example, we may use cookies to collect information about website activity or to tell us whether you are an existing or new visitor to our Site. Our Site utilizes both temporary and persistent cookies to enhance your online experience.We require your affirmative consent before using cookies or other technologies that would track your personal data. If you wish to restrict, block, or delete the cookies that are set by our Site, you can do so using your browser settings. Most browsers allow you to control cookies, including whether to accept them and how to disable existing cookies. You may also set most browsers to notify you if you receive a new cookie. Please note that some features of the Site may not function properly or may be slower without cookies. To make full use of the Site, your computer or mobile device will need to accept cookies. For more information about cookies and how to remove them on your browser, you can visit these third-party websites:Google ChromeInternet ExplorerMozilla FirefoxSafari DesktopSafari MobileAndroidOperaYou can also learn more about cookies here: www.allaboutcookies.org.Other tracking technologies may record information such as your IP address, browser software and operating system, host name, referring site, clickstream data, device type, geographic data, and dates and times that our Site is accessed. An IP address is a number that your Internet service provider automatically assigns to the computer you are using. An IP address is identified and logged automatically whenever a user visits the Site, along with the time of the visit and the page(s) that were visited. Collecting IP addresses is standard practice on the Internet and is done automatically by many websites. Our Site does not respond to "do not track" signals.It is not our practice to link the information we record using cookies or other tracking technologies to any Personal Information you submit through the Site. However, we reserve the right to use cookies and other tracking technologies to identify a visitor. We may do so, for example, when we believe it is necessary to protect the Site, our visitors, Program Participants or other third parties, or to protect our rights or defend against a claim relating to us, or when we believe that the law requires it.Third-Party Websites: For your convenience, our Site may contain links to websites owned and operated by third parties. Please note that WAFF does not control such third-party websites, the content of these sites, any products or services that may be offered through these sites, or any other use of the linked sites. These other websites may send their own cookies to visitors, collect data or solicit Personal Information, and the privacy policies of these other sites may be significantly different from this Privacy Policy. Your access to and use of such websites is governed by the terms of use and policies of those sites and shall be at your own risk. WAFF is not responsible for the privacy practices of these other sites and cannot guarantee the security of any information collected by any linked or other third-party website. WAFF encourages you to review the privacy policy of any company or website before submitting your Personal Information. Some third parties may choose to share their users’ Personal Information with WAFF; that sharing is governed by that company’s privacy policy, not this Privacy Policy.Information from Third-Party Sources: WAFF may collect information about you from third-party sources to supplement information provided by you. This supplemental information allows us to verify or supplement information that you have provided to WAFF and to enhance our ability to provide you with information about our business and services. WAFF’s agreements with these third parties typically limit how WAFF may use this supplemental information.Sharing of Information: WAFF does not sell, rent, trade or otherwise disclose Personal Information, except as described in this Privacy Policy or as you explicitly consent. We may share your information among WAFF entities and affiliates. We also may share the information with third-party service providers we have retained to perform services on our behalf to help with our foundation activities. These service providers are not authorized by us to use or disclose the information except as necessary to perform services on our behalf or to comply with legal requirements.We may disclose information about you (i) if we are required to do so by law, court order or legal process; (ii) in response to lawful requests by public authorities, including to meet national security or law enforcement requirements; (iii) under the discovery process in litigation or arbitration; (iv) to enforce WAFF policies, contracts or other rights; (v) to collect amounts owed to WAFF; (vi) when we believe disclosure is necessary or appropriate to prevent physical harm or financial loss or in connection with an investigation or prosecution of suspected or actual illegal activity; or (vii) if in good faith we believe that disclosure is otherwise necessary or advisable. In addition, from time to time, server logs may be reviewed for security purpo'
