["https://www.wearefamilyfoundation.org/three-dot-dash-program"]
title = "Three Dot Dash — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''Scroll Apply | Global Teen Leaders YOUNG PEOPLECHANGING THE WORLD one basic human need at a time GLOBAL TEEN LEADERS:ADDRESSING THE WORLD'SMOST PRESSING ISSUES THREE DOT DASH MENTORS:HELPING TO EMPOWERTHE NEXT GENERATION Meet the global teen leaders THREE DOT DASH WAS INSPIRED BY THE LATE CRITICALLY ACCLAIMED POET AND PEACEMAKER, 13 YEAR-OLD MATTIE J.T. STEPANEK. IN HIS NEW YORK TIMES BEST SELLER, “JUST PEACE: A MESSAGE OF HOPE", MATTIE SAID “Peace is possible, when your basic human needs are met.” — Mattie J.T. Stepanek, Poet and Peacemaker Our 400+ GTL alumni are dedicated to positively affecting their communities and addressing one or more basic human needs. THREE DOT DASH POWERS THE MOST INFLUENTIAL SOCIAL ENTREPRENEURS BETWEEN THE AGES OF 13 -19, WHO HAVE FOUND A SOLUTION OR INNOVATION TO ADDRESS A BASIC HUMAN NEED. HOW WE DO THIS:Identify and curate Global Teen Leaders (GTLs)Host an annual game-changing Just Peace SummitPair each GTL with an extraordinary Mentor for ONE YEARCollaborate with innovative partners to expand purposeful offerings and opportunities that amplify their workFoster and sustain a sought-after global network that brings together hundreds of GTLs, Mentors, industry leaders, and policy makers – past, present and futureWe are a global family full of solutions. Our GTLs come from 75+ countries on 6 continents in 10 years. Their work is positively affecting millions of people. Making heads turn, and often, changing history. OUR COALITION PARTNERSOrganizations focused on creating positive change around the world make up our global Coalition, strengthening our existing network through new opportunities, and growing our global community. <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419802587-IEDRD5UQDEF8VAIHPX3A/UnicefUSA-logo1_1449175056.png" alt="UnicefUSA-logo1_1449175056.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419802562-5XWX5WL3ZD3JEIPYSC5D/adobe_logo_0_0_.a5753192302.original.jpg" alt="adobe_logo_0_0_.a5753192302.original.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419803001-DO2EXWE5NX078VODW0JQ/download.jpg" alt="download.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419803118-T41JMD88A13BPZAL5DET/LOGO%2B2.jpg" alt="LOGO+2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419803401-HXP7QSEYNRBNRBWQ5BRN/LOGO%2B4.png" alt="LOGO+4.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419803617-WQ7WZDVSPXL2S70Y91LA/LOGO%2B7.png" alt="LOGO+7.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419803713-3ACBPG404V69MXB8K2HE/LOGO%2B8.jpg" alt="LOGO+8.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419803941-H7EEFBBZN43PYEP67QE1/LOGO%2B9.jpg" alt="LOGO+9.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419804110-QQINGTGJKG28N4T3TGHW/LOGO%2B10%2B.jpg" alt="LOGO+10+.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419804902-1HG77H8SOI5M4FN2WIMF/LOGO%2B12.jpg" alt="LOGO+12.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419805356-GDWO8WRDC4N46M72MKLP/musings-susan-logo-black-right.jpg" alt="musings-susan-logo-black-right.jpg" /> #block-yui_3_17_2_1_1580419747271_5099 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -27px; } #block-yui_3_17_2_1_1580419747271_5099 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 27px; margin-bottom: 27px; } Mridul 18, India WHAT IF...YOU COULD REVOLUTIONIZE HEALTHCARE AND EDUCATION USING THE SIMPLEST OF TECHNOLOGIES?MRIDUL MANASIS... USING TEXT MESSAGES TO TRANSFORM LIVES IN OVER 600 NEGLECTED POPULATIONS WORLDWIDE. Erin 17, USA WHAT IF...YOU COULD SAVE SOMEONE’S LIFE WITH A SELFIE?ERIN SMITHIS... DEVELOPING FACIAL RECOGNITION SOFTWARE THAT CAN EARLY DIAGNOSE DISEASE. 3DD Home - Nav 3DD Home - Welcome 3DD Home - Mattie 3DD Home - Global Teen Leaders 3DD Home - Coalition 3DD Home - Case Studies'''
