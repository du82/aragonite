["http://wearefamilyfoundation.org/impact"]
title = "Collaborating Across Generations: A We Are Family Foundation Global Study"
description = "This Global Study was conducted to better understand global viewpoints that are most important for meaningful and impactful collaboration across generations."
full_description = "Collaborating Across Generations: Insights, Challenges, and Best Practices A We Are Family Foundation Global StudyKEY INSIGHTS believe intergenerational collaboration holds significant value and can generate positive change recognize the powerful potential of youth ideas and solutions in addressing global challenges agree that youth are currently given enough opportunities to lead and contribute to important social issues but only believe intergenerational collaboration holds significant value and can generate positive change recognize the powerful potential of youth ideas and solutions in addressing global challenges agree that youth are currently given enough opportunities to lead and contribute to important social issues but only GLOBAL STUDYProblems that span generations require leadership that does too.We Are Family Foundation’s (WAFF) groundbreaking Global Study — Collaborating Across Generations: Insights, Challenges and Best Practices (Global Study) — was conducted in late 2023 to better understand global viewpoints and characteristics that are most important for meaningful and impactful collaboration across generations. For more than 20 years, WAFF has identified, trained, and amplified young changemakers worldwide through its innovative programs Three Dot Dash, TEDxTeen, Youth To The Front Fund, and Youth To The Table. Through these efforts, WAFF builds powerful ecosystems that propel the impact of this generation’s social entrepreneurs, activists, innovators, creatives, and policy-shapers.With decades of experience as a pioneering organization in the youth changemaking space, WAFF has witnessed the unique, powerful, and diverse values that youth bring to the table. The fact of the matter is, there are youth experts across all issues: AI, food insecurity, education reform, climate awareness, racial equity, and many more. Understanding how the expertise of young people can effectively collaborate across generations to address the world’s most pressing issues is paramount to our mission. Because problems that span generations require leadership that does too.Informed by a critical examination of historical youth exclusion, the Global Study’s findings fuel a transformative framework for intergenerational collaboration (IGC). The framework’s Recommendations empower ALL generations to work together more effectively, while its Case Studies provide tangible examples that put these strategies into action.Through research, understanding, and powerful partnerships across private, public, and social sectors, we take part in a collaborative movement — join us! METHODOLOGYMETHODOLOGYThe Global Study was inspired by WAFF’s observations of working with young people for 20+ years and The Possibilists 2021 Report on the needs of young changemakers. One of the report’s key findings was “the need to connect young social innovators with relevant decision-makers.” The Global Study digs deeper into this issue to identify the best practices to connect and deeply collaborate with “relevant” — and most often older — decision-makers.The results and Recommendations from the Global Study are rooted in data from a survey developed and conducted over a three-month period in partnership with Vienna University of Economics and Business. The survey questions were developed in collaboration with 24 Youth Study Advisors and adapted for global participation in partnership with 16 Youth Translators.996 individuals aged 14-74, across 104 countries and diverse intersecting identities, participated in the survey and shared their thoughts.The Global Study results and Recommendations are further supported by qualitative research from WAFF’s community of young changemakers and the collaborators they engaged with across generations and spaces. In 2023/2024, WAFF orchestrated Delegations of young changemakers in historic international global convening spaces of decision-making — the United Nations General Assembly (UNGA), the United Nations Climate Change Conference (COP) and the World Economic Forum (WEF). At these Global Convenings, WAFF and WAFF Youth Delegates orchestrated hundreds of opportunities for intergenerational collaborations (see more below on Youth To The Table). Interviews, surveys, and standardized observation methods provided additional qualitative data that complements the quantitative findings.Recognizing the diversity of definitions surrounding the term “youth,” WAFF has maintained flexibility in our approach. For the Global Study, WAFF considers individuals under the age of 30 as youth, and for Global Convenings and qualitative work, those under the age of 35. What does collaborating across generations look like in practice?A youth leader collaborating with a politician to draft new legislation.An organization establishing an intergenerational committee to provide insights on company culture.Ensuring equitable representation of youth voices during climate change policy negotiations.Young professionals serving on a corporate Board of Directors.Youth helping shape the agenda and framework for a major global convening. Youth To The Table Commit to Bringing #YouthToTheTableThe Global Study is bolstered by qualitative research conducted over a year with diverse Youth Delegations at three major global events: the United Nations General Assembly (UNGA78) in New York, the United Nations Climate Change Conference (COP28) in Dubai and the World Economic Forum (WEF24) in Davos. WAFF Youth Delegates are leaders in their respective fields. They navigate these venues with WAFF Collaborators, leaders of older generations, with whom they foster reciprocal working relationships. These efforts reflect WAFF’s Youth To The Table (YTTT) program, which aims to accelerate sustainable change by deepening intergenerational collaboration between young changemakers and current stakeholders. YTTT began as a beta pilot in 2020, in collaboration with WAFF’s long-standing strategic partner and early advocate for intergenerational collaboration, SAP.WAFF’s Enduring Partnership with SAP: Empowering Youth LeadershipFor over a decade, SAP has been a steadfast partner of WAFF, investing in the development of exceptional young leaders through our signature programs.In 2020, this collaboration reached new heights with the co-piloted launch of Youth To The Table (YTTT). This innovative program placed WAFF’s talented youth leaders in high-profile advisory roles within SAP and its partner ecosystem, aligning their expertise with strategic needs. The program not only provided valuable data on the effectiveness of intergenerational collaboration, but its success also spurred the official launch of Youth To The Table by WAFF, aiming for broader systemic change.Today, YTTT partners with policymakers, governments, business leaders, organizations, and corporate partners to create meaningful, accountable, and non-performative opportunities for youth to participate in decision-making across all sectors. Who Are WAFF Youth & Collaborators?Meet some remarkable young experts from diverse sectors including healthcare, climate science, and AI policy. WAFF Youth are distinguished in their fields, working across generations to drive innovative solutions forward.Additionally, meet several WAFF Collaborators — senior leaders and key stakeholders who partner with WAFF Youth to accelerate multigenerational leadership, and tackle some of our most pressing problems. Erin SmithUSA, 23 UNGA78 WAFF Youth Delegate LinkedIn Erin is a technologist focused on the future of brain and mental health. She is the inventor of FacePrint — an AI tool to detect and monitor Parkinson’s disease. Erin SmithUSA, 23 UNGA78 WAFF Youth Delegate LinkedIn Erin SmithUSA, 23 UNGA78 WAFF Youth DelegateErin is a technologist focused on the future of brain and mental health. She is the inventor of FacePrint — an AI tool to detect and monitor Parkinson’s disease.Erin has collaborated with Harvard Medical School, Weizmann Institute of Science, the Michael J. Fox Foundation, and the Alzheimer’s Association. Her 40+ academic publications have been featured in leading journals including Neuron, Molecular Psychiatry, Brookings, and Oxford University Press.Erin is a Senior Atlantic Fellow for Equity in Brain Health at the Global Brain Health Institute at the University of California, San Francisco (UCSF) and Trinity College Dublin, where she leverages technology to improve brain health and reduce dementia worldwide. She is also a Fellow for Transdisciplinary Innovation at Meadows Mental Health Policy Institute, where she develops solutions to the current mental health crisis that span technology, policy, and investment approaches.Erin is an OECD Neuroscience-Inspired Policy Initiative Steering Committee Member, a Thiel Fellow, a Y Combinator Alumni, and an AAAS IF/THEN Ambassador. Erin’s work has been recognized by the European Patent Office Young Inventor Award, Wired Health Startup of the Year, Seventeen Magazine Voice of the Year, and Forbes 30 under 30. Paul PolmanFormer CEO, Unilever WAFF Collaborator LinkedIn “Through thoughtful pairings with experienced executives, [WAFF Youth] delegates are given access to discussions where they learn, and are listened to. They receive training and resources before and after. Unlike conventional mentorship, this kind of collaboration creates more equal and enduring partnerships, understanding that both sides have something to give.” Paul PolmanFormer CEO, Unilever WAFF Collaborator LinkedIn Paul PolmanFormer CEO, Unilever WAFF Collaborator“Through thoughtful pairings with experienced executives, [WAFF Youth] delegates are given access to discussions where they learn, and are listened to. They receive training and resources before and after. Unlike conventional mentorship, this kind of collaboration creates more equal and enduring partnerships, understanding that both sides have something to give.”Business leader, campaigner, and co-author of “Net Positive: How Courageous Companies Thrive by Giving More Than They Take,” a Financial Times Business Book of the Year. #3 Thinkers50. Paul works to accelerate action by business to tackle climate change and inequality.As CEO of Unilever (2009-2019), Paul demonstrated that business can profit through purpose, marrying a long-term, multi-stakeholder model with excellent financial performance. During Paul’s tenure, shareholders saw their returns increase by 290% while the company consistently ranked 1st in the world for sustainability. Today, Paul works across a range of organizations to advance the UN Sustainable Development Goals, which he helped develop. This includes his work to drive systems change with Systemiq and bold new industry coalitions, including in fashion and food. He leads the UN Global Compact, is an Ambassador for the Race to Zero and works to develop our next generation of leaders, through the Oxford University Saïd Business School, INSEAD, One Young World and others. Paul actively campaigns on a range of human rights issues, including promoting disability inclusion through the Valuable 500 and the Kilimanjaro Blind Trust, which he set up with his wife Kim. Angeline MartynAdvisor, Private Sector, Education Cannot Wait WAFF Collaborator LinkedIn “In my years of coming to the UN General Assembly, I look for a way to leave each space and event with something truly meaningful. When I look back at this week, every meaningful connection I made had something to do with a young person — their insights, their future, and their impactful presence.” Angeline MartynAdvisor, Private Sector, Education Cannot Wait WAFF Collaborator LinkedIn Angeline MartynAdvisor, Private Sector, Education Cannot Wait WAFF Collaborator“In my years of coming to the UN General Assembly, I look for a way to leave each space and event with something truly meaningful. When I look back at this week, every meaningful connection I made had something to do with a young person — their insights, their future, and their impactful presence.”Angeline manages the Private Sector Portfolio for Education Cannot Wait, the United Nations Global Fund for Education in Emergencies.She has spent over 20 years building partnerships with private and public sectors, social movements, and multi-lateral institutions that cross-geographic, thematic, and gender lines. She has a deep commitment to advancing how empowerment and leadership influence national and global outcomes while ensuring equality is at the heart of immediate and long-term recovery plans with success in engaging businesses, foundations, and individuals as transformational partners.Angeline most recently served as Head, Private Sector Engagement at UN Women with notable partnerships launched with Google & Salesforce, and prior to that as Sr. Director, Global Corporate Partnerships at Save the Children in the US, leading relationships with Johnson & Johnson, Disney, HP, Pfizer, TOMS and more. She also co-launched the first Asia Corporate Engagement Center for Save the Children International. Angeline spent over a decade as Director of Communications & Marketing and in Public Relations roles for global and domestic NGOs and the private sector. Jeremiah ThoronkaSierra Leone, 23 COP28 WAFF Youth Delegate LinkedIn Jeremiah is an award-winning innovator, scholar, and entrepreneur with deep expertise in energy, climate change, and sustainability. Jeremiah ThoronkaSierra Leone, 23 COP28 WAFF Youth Delegate LinkedIn Jeremiah ThoronkaSierra Leone, 23 COP28 WAFF Youth DelegateJeremiah is an award-winning innovator, scholar, and entrepreneur with deep expertise in energy, climate change, and sustainability.While growing up in Sierra Leone, Jeremiah witnessed the negative consequences of energy poverty in his country, such as health issues from photochemical smog, insufficient light for students to study, and the destruction of forests for firewood, which leads to further problems like flooding and landslides.At 17, Jeremiah developed Optim Energy, an innovative piezoelectric device that harnesses energy from heat, vibrations, and weather to create affordable, accessible, and clean power. Optim Energy has provided electricity to over 1,500 citizens and 9,000 students across northern Sierra Leone from 2017 to early 2022. Jeremiah is now using a mini solar grid to provide free electricity for locals in Makawo through a sustainable community development framework he has been exploring.In 2021, Jeremiah was recognized as the inaugural laureate of the 2021 Global Student Prize, Africa Youth and Young Innovator of the Year, received the Commonwealth Youth Award for Excellence in Development Work — Africa, and ranked among the Top 100 Most Influential Africans. He was also named a 2019 United Nations Academic Impact and Millennium Campus Network Fellow and invited to present at the 2019 African Leadership University School of Wildlife Conservation Conference.Jeremiah currently advises the Clean Growth Leadership Network, a world-class "
