["https://wearefamilyfoundation.org/yttf-home"]
title = "Youth To The Front — We Are Family Foundation"
description = "Allyship is important to anti-racist and social justice work. While our aim is to support and further the work of BIPOC individuals and communities, we encourage those who do not identify as BIPOC, but offer a project scope and design that illustrates solidarity and allyship with BIPOC individuals, communities and organizations, to also apply."
full_description = 'Scroll YOUTH TO THE FRONT FUNDWe Are Family Foundation (WAFF) is committed to fighting systemic racism, inequality, and injustice. We Are Family Foundation created the Youth To The Front Fund to support and fund under 30-year-old youth activists, youth-led organizations, projects, innovations and creative solutions that are at the forefront of fighting systemic racism, inequality, inequity and injustice in the United States and around the world. MEET “THE CREATIVES“ 2024 applications closed “By addressing systemic barriers and promoting inclusivity, we ensure that Black artists feel valued and supported, fostering a more diverse and equitable industry.” — Black Artist Database (B.A.D.), “The Creatives” 2024 Frontliners “We foster a sense of belonging, inspire collective action, and drive forward the message that true sustainability and justice must include everyone, regardless of ability.” — Puneet Singhal, “The Creatives” 2024 Frontliner “Our work is a testament to the strength of our traditions, guiding us to heal the land and nurture future generations.” — Uru Uru Team, “The Creatives” 2024 Frontliners “THE CREATIVES” 2024 — THE NEWEST YOUTH TO THE FRONT FUND FRONTLINERSCreative therapy to heal the grief of gun violence. Floral art installations to reclaim marginalized green spaces. Audiovisual storytelling to highlight sexual and reproductive health inequities. These are just a few of the ways “The Creatives” Frontliners are rewriting the narrative, reshaping our world when it comes to justice work. And we’re committed to supporting them. Representing 19 countries on 5 continents and 5 states in the United States, We Are Family Foundation is honored to introduce you to “The Creatives” 2024 Frontliners!They are under-30 artivists, collectives, cultural storytellers, creative organizers, heritage keepers, holistic health healers, and community leaders who use creative approaches to address systemic injustices in local and global communities. In the process, they are:Centering Black, Indigenous, and communities of color in impactSpearheading education equity, community engagement, and freedom of speechAdvocating for LGBTQIA+, climate, arts, gender, health, social justice — and more MEET “THE CREATIVES” 2024 FRONTLINERS MEET “THE CREATIVES” 2023 FRONTLINERS MEET THE 2022 FRONTLINERS MEET THE 2021 FRONTLINERS MEET THE 2020 FRONTLINERS ABOUT THE YOUTH TO THE FRONT FUNDWe Are Family Foundation (WAFF), co-founded in 2002 by music icon and philanthropist Nile Rodgers and inspired by the power and true meaning of his song, "We Are Family", has always focused on bringing people together from different ethnicities, cultures and backgrounds. For over two decades, WAFF has been a leader in identifying, amplifying and supporting the actions and voices of diverse youth leaders across the globe who are actively and positively addressing issues surrounding our basic human needs — food, water, shelter, health, safety, education and the environment. However, ALL of those basic human needs are further compromised by systemic racism and injustice in our society. Traditionally, the nonprofit philanthropic space has made the genius of youth, particularly within the BIPOC community, invisible. WAFF addresses this gap in philanthropic racial equity through the innovative Youth To The Front Fund (YTTFF) program. YTTFF supports and funds under-30-year-old BIPOC youth activists and allies, youth-led organizations, collectives, projects, innovations and creative solutions that are at the forefront of fighting systemic racism, inequality, inequity and injustice in the United States and around the world. We call them “Frontliners”.Since its inception in July 2020 after the murder of George Floyd, YTTFF has funded 110+ Frontliners from 50+ countries on 6 continents with grants totaling $1,000,000+ through funding partnerships with EXCELerate Foundation, SAP, Sony Music, Walton Family Foundation, and Warner Music Social Justice Fund / Blavatnik Family Foundation.Inspired by Nile Rodgers’ lifelong spirit of activism and creative genius, YTTFF has expanded its funding efforts to support “The Creatives” Frontliners, illuminating the significance of using the power of art to transform the future and reclaim humanity. If you have any questions regarding the Youth To The Front Fund, please email us at youthtothefront@wearefamilyfoundation.org. “To create social change and to contribute to a democratic life, we must engage in co-creation that is based on collective thinking and collective learning.” — Beats By Girlz Türkiye, “The Creatives” Frontliner Collective applications closed A Message from Nile Rodgers… Frequently Asked Questions (FAQs) Do I have to identify as BIPOC in order to apply? Allyship is important to anti-racist and social justice work. While our aim is to support and further the work of BIPOC individuals and communities, we encourage those who do not identify as BIPOC, but offer a project scope and design that illustrates solidarity and allyship with BIPOC individuals, communities and organizations, to also apply. What are the minimum / maximum size grants YTTFF will fund? Each specific call has a specified grant amount range. Please check the application call description. Can I apply for a YTTFF grant if I do not live in the United States? We believe that structural inequality are systemic challenges that are experienced across and beyond geographic borders and we invite our global family to apply, no matter what country they reside in. How long is the review process and when will selected applicants be notified? Currently, the review and selection process takes 8-10 weeks from the Main Application submission. Can the project be based in the US but have chapters across the globe? Yes, but we prefer to have the chapter leadership in each location apply directly on behalf of their work. May I apply to other We Are Family Foundation programs? Yes. I haven’t received a status update on my application but I know others have heard back. If you have any questions, inquiries or concerns, please email us. Can I still apply if I am currently 30 years old or over 30 years old? No. As part of our efforts to center and empower youth organizing, you MUST be under 30 through December 31st of the application call year. I am interested in applying for a grant. How do I apply? To apply for the Youth To The Front Fund, first create an account on Submittable here then access the application here. Please note our Submittable page will only display applications which are open. If no application is present, please wait for the next call for applications. Do I qualify as a “collective”? You qualify as a “collective” if you are a mission-driven group coming together to disrupt unjust systems, reimagine the world and mobilize local and global communities towards a liberated humanity. I am having trouble submitting my application on Submittable. Is there technical support available? For any technical issues with your Submittable account, please fill in a query via this link and keep us posted. Submittable technicians should be able to sort you out as soon as possible. Can any project or initiative focusing on any particular social injustice apply to the Youth To The Front Fund? Some grant calls are specific for certain approaches or systems of organizing. Please always crosscheck the grant call and eligibility to ensure your work aligns with the call for applications. Can I schedule a call with the YTTFF team to learn more about the program, see if I meet eligibility or share more information about our work? We encourage you to apply if you feel you meet eligibility requirements and the application call aligns with the mission of your work. Our team does not conduct any preliminary calls or readings of applications as this does not provide an equitable approach to our review practice. ﻿Back to top YTTF Overview YTTF Directory Summary YTTF Application Info YTTF A Message from Nile YTTF FAQ'
