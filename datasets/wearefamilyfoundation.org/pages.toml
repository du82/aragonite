full_description = "Speak Up EgyptProject: Speak UpSpeak Up is a feminist initiative dedicated to supporting victims of violence in all its forms, combating sexual harassment, and promoting gender equality to empower women and girls in Egypt and the MENA region. Through innovative storytelling, interactive social media campaigns, and community support services, Speak Up creates safe spaces, advocates for policy changes, and fosters global dialogue for shaping a more inclusive and equitable society. “By highlighting underrepresented voices and redefining victimhood, we provide a fresh perspective that encourages empathy, action, and broader engagement with these critical issues.”Check out Speak Up’s work here: Instagram << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
