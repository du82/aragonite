full_description = '''Scroll “The CREATIVES” 2024 Frontliners GLOBAL STUDY unesco partnership WE ARE FAMILY FOUNDATION powers youth around the world who are changing the game with their ideas, innovations and social good solutions. WE mentor. WE CHAMPION. WE amplify. WE act creatively. WE lead with purpose.WE live for the power of community.WE are a global FAMILY made up of different cultures, ethnicities, beliefs and backgrounds. WE believe in the power of humanity.WE ARE FAMILY. WHAT STARTED AS A SONG BECAME A GLOBAL MOVEMENT...Through programs like Three Dot Dash, Youth To The Front Fund, Youth To The Table and TEDxTeen, WAFF amplifies the voice of young people, connecting them with resources, partnerships and opportunities at the forefront of global impact. They are speaking at the United Nations, in Forbes 30 under 30, mobilizing communities and spearheading global revolutions. THIS PURPOSEFUL COMMUNITY. LET'S TALK ABOUT IT. <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469900533-R1HBRQ91ZNTAD7XZ5O2M/chicago-featured.png" alt="chicago-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469900575-5UYJX034DZWLFU5A50R2/oprah-featured.png" alt="oprah-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469909338-MBOLHFHRX3FT4M7W5QEL/wired-featured.png" alt="wired-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469979636-YPYFP0EZPSFV1ONZNQO6/fortune-featured.png" alt="fortune-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469909361-WESUKW2RNSBG3NAPGGJH/cnn-feature.png" alt="cnn-feature.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469909449-M22GDH1TDWC43H9IT3DF/huffington-featured.png" alt="huffington-featured.png" /> #block-yui_3_17_2_2_1478469096687_58801 .sqs-gallery-block-g