description = "South Africa, Kenya    Project:  Verses to Voices  Verses to Voices is a collaborative audiovisual project that harnesses the power of music, poetry, and visual storytelling to address systemic injustices in sexual and reproductive health. Created by author, humanitarian, and entrepreneur Shudufhadz"
full_description = "Verses to Voices South Africa, KenyaProject: Verses to VoicesVerses to Voices is a collaborative audiovisual project that harnesses the power of music, poetry, and visual storytelling to address systemic injustices in sexual and reproductive health. Created by author, humanitarian, and entrepreneur Shudufhadzo Musida and artist Xenia Manasseh, Verses to Voices confronts cultural stigmas, gender inequality, economic disparities, political neglect, and intersectional oppression by igniting dialogue, educating communities, inspiring meaningful action, and merging art with activism.“By combining poetry, music, and visual narratives, we create a powerful platform that not only raises awareness but also drives meaningful conversations around body autonomy, gender equality, and reproductive rights.”Check out Verses to Voices’ work here: Shudu Musiḓa Instagram & Xenia Manasseh Instagram << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
