amp;ndash; WAFF Youth Delegates tackled it all during the 2025 World Economic Forum in Davos. This is what &amp;lsquo;Collaboration for the Intelligent Age&amp;rsquo; looks like. Yet still, young " /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1737653527507-ZSVNFQREK7HSJPSGFI0U/image-asset.jpeg" alt="In just one week, incredible things can happen... Here's a glimpse of the transformative magic from a Three Dot Dash Just Peace Summit. Apply now for the next summit in Stockholm, Sweden this June 🇸🇪. 2025 Global Teen Leader Pre-Applications clos" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1737555762208-D8B82F8TKD0F4SKUB78U/image-asset.jpeg" alt="We are taking the Just Peace Summit from New York City to Stockholm and doubling down on climate action.&amp;nbsp; Only a few more days to apply as a 2025 Global Teen Leader&amp;hellip; Link in bio for more info. 💌&amp;nbsp; #ThreeDotDash #WeAreFamily" /> #block-yui_3_17_2_1_1607710927020_23845 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1607710927020_23845 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Intro WAFF Homepage Announcements (2024) Overview Press'''
