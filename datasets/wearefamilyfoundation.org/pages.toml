["http://wearefamilyfoundation.org/board-of-directors"]
title = "Board of Directors — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''NILE RODGERS, ChairmanCo-FOUNDER/CHAIRMAN, WE ARE FAMILY FOUNDATION; Producer, Musician, SongwriterNile Rodgers is a Rock & Roll Hall of Fame inductee, Songwriters Hall of Fame inductee and a multiple Grammy Award winning songwriter, composer, producer, arranger, and guitarist. In 2023 he became the first creator to be awarded a Lifetime Achievement Grammy for his legacy in the same year as being awarded a Grammy for his new work with Beyoncé on the smash hit “Cuff It”. As the Co-founder of CHIC, Nile pioneered a musical language that generated chart-topping hits like "Le Freak”, the biggest selling single in the history of Atlantic Records and sparked the advent of hip-hop with "Good Times” and “Rapper’s Delight”.His work in The CHIC Organization, including “We Are Family” for Sister Sledge and “I’m Coming Out” for Diana Ross, and his productions for artists such as David Bowie (“Let’s Dance”), Madonna (“Like A Virgin”) and Duran Duran (“The Reflex”), have sold more than 500 million albums and 100 million singles worldwide, while his innovative, trendsetting collaborations with Daft Punk, Daddy Yankee, LE SSERAFIM and Beyoncé reflect the vanguard of contemporary hits.Nile is the first, and only Producer In Residence at Apple Music and helms the award-winning Apple Music 1’s “Deep Hidden Meaning” radio show celebrating the work of great songwriters. Nile served as the first-ever Chief Creative Advisor for the incomparable Abbey Road Studios and is the Chairman of the Songwriters Hall of Fame as well as Co-founder of Hipgnosis Songs, the multi-billion-dollar investment fund listed on the London Stock Exchange’s FTSE 250.In 2001 in the wake of 9/11 Nile co-founded the We Are Family Foundation (WAFF) at first to bring everyone together following the tragedy to start the healing process. It quickly evolved into an organization dedicated to the vision of a global family by creating and supporting programs that promote cultural diversity while nurturing, mentoring, and amplifying the vision, talents and ideas of young people who are positively changing the world.WAFF is focused on empowering young people globally through its acclaimed youth leadership, storytelling and mentoring program, Three Dot Dash; Youth To The Front Fund, designed to support BIPOC (Black, Indigenous, People of Color), youth at the forefront of fighting systemic racism, inequality and injustice; and Youth To The Table, bringing youth voices to decision making tables that are shaping humanity’s future.Most recently Nile received the 2024 World Economic Forum’s Crystal Award for his extraordinary efforts to make the world a more peaceful, equal and inclusive place through his music, his exemplary commitment to fighting systemic racism, inequality and injustice, and by championing innovative youth voices to decision-making tables. MARK BARONDESS, vice chairmanPARTNER, MILLER BARONDESS, LLPAn attorney for more than 36 years, Mark A. Barondess has earned a reputation as an aggressive civil advocate in the Washington, D.C. metropolitan area and in Los Angeles, CA. Barondess is a founding partner of the firm Miller Barondess, LLP, a 40-lawyer firm that has served the Los Angeles community since 2006. His clients have included a former major party presidential candidate, Grammy Award winners, an Academy Award winning Best Actress, multiple Emmy Award winners, various sports legends including two Olympic gold medalists, corporate leaders as well as members of the United States Congress and the Federal Executive Branch of the United States Government at top levels. Mark acted as General Counsel to the former CNN broadcasting giant Larry King and his affiliated companies until his passing. He serves as Vice-Chairman and General Counsel of the We Are Family Foundation. He also serves on the Board of Ambassadors of Project Restore at Johns Hopkins University Medical Center and works with The Nancy Davis Race to Erase MS. NANCY HUNT, PresidentCo-Founder/President, We Are Family FoundationNancy Hunt is a Co-founder of We Are Family Foundation (WAFF) and has served as President since its inception in 2002. As President, Nancy is responsible for developing WAFF’s acclaimed programs amplifying extraordinary global youth changemakers, including Three Dot Dash; TEDxTeen, Youth To The Front Fund and Youth To The Table; forging strategic partnerships and spearheading fundraising initiatives. Directly after 9/11 Nancy was Executive Producer of the We Are Family Project, which brought over 200 celebrities together to re-record "We Are Family" as a start of the healing process. She was also Executive Producer of the "We Are Family" children's music video PSA which brought together over 100 children's television characters for the first time in history to promote diversity and multiculturalism. Prior to the Foundation, Nancy co-founded Smock Media Inc., an art-based media company in 1999, and Notorious Entertainment, an upscale urban brand in 1996. During her tenure as Partner and Executive Vice President of both media companies, Nancy oversaw joint ventures, the publishing of Smock and Notorious magazines and the extensions of each brand. She is an award-winning photographer and earned her Master's degree in clinical psychology at The American University. ROBERT LIGHT, Vice PRESIDENTManaging Partner & Head of Worldwide Music, Creative Artists AgencyRob Light is Head of the Music department, a Partner, and Managing Director of leading entertainment and sports agency Creative Artists Agency (CAA). Under Light’s leadership, CAA’s Music department represents many of the world’s most accomplished and talented musical artists and comedians. Light oversees all of CAA’s music agents, providing strategic counsel on concert tours and event bookings worldwide, as well as advising clients on their overall career development.Respected throughout the industry for his innovative deal structures and his ability to foresee and adapt to changes in the business environment, Light has led CAA’s music department to new heights by implementing an integrated services model that leverages CAA’s expansive and deep resources within the department and across the agency. This inter-departmental approach has taken clients into soundtracks, theater, features films, television, documentaries, sponsorship, endorsement and licensing.Light is a graduate of Syracuse University’s Newhouse School of Communication with a degree in Film and Television. Married, with five children, he serves on the Board of Trustees for Syracuse University and is a board member for The Rock & Roll Hall of Fame, Communities in Schools, and The Tiger Woods Foundation. MICHAEL LEVINE, Ph.D., TreasurerSENIOR VICE PRESIDENT, NOGGIN (NICKELODEON)Michael Levine is the senior vice president for learning and impact at Nickelodeon where he is leading the transformation of its educational brand, Noggin. Previously he was the Chief Knowledge Officer at Sesame Workshop and the founding director of the Joan Ganz Cooney Center at Sesame Workshop, an action research and innovation hub devoted to harnessing the potential of digital media to advance young children's learning and healthy development. Prior to joining the Center, Dr. Levine served as Vice President of New Media and Executive Director of Education for Asia Society, managing the global nonprofit's interactive media and educational initiatives to promote understanding of Asia and other world regions, languages and cultures. Previously, Dr. Levine oversaw Carnegie Corporation of New York's groundbreaking work in early childhood development, educational media and primary grades reform, and was a senior advisor to the New York City Schools Chancellor, where he directed dropout prevention, afterschool, and early childhood initiatives. Dr. Levine often serves as an adviser to government and public media organizations such as the US Department of Education, PBS and the Corporation for Public Broadcasting, is the author of a best-selling book on technology and early learning and writes for policy groups and the mass media. He serves on numerous nonprofit boards and advisory councils, including the Joan Ganz Cooney Center, JumpStart, Promise Venture Studio and the Harvard Center on Media and Child Health. Michael has advised WAFF since its founding! DANIEL CROWN, SecretaryCo-founder Red Crown ProductionsComing from a family with a tradition of philanthropy, Daniel, along with his wife Ellen, continues that legacy with honor. He serves on the Board of a number of worthy and prestigious organizations, including Lincoln Center, Lenox Hill Hospital, Manhattan Eye Ear & Throat Hospital, The Jerusalem Foundation, The Crohn's and Colitis Foundation of America's Greater New York Chapter, the Connecticut Public Broadcasting Network and the Mount Sinai Children's Center Foundation. A native of Chicago, Daniel has been a resident of New York for more than 20 years. Ahmed M. BadrDirector, the Patricelli Center for Social EntrepreneurshipAhmed M. Badr is an Iraqi-American author, poet, and social entrepreneur working at the intersection of creativity, climate action, displacement and youth engagement. He is author of “While the Earth Sleeps We Travel: Stories, Poetry, and Art from Young Refugees Around the World” (Andrews McMeel). Ahmed is the Director of the Patricelli Center for Social Entrepreneurship and Adjunct Assistant Professor of Public Policy at Wesleyan University. At 25, he is one of the youngest senior university faculty and staff members in the world. As a teen, Ahmed founded Narratio, a 501c3 that activates, supports and highlights the creative expression of displaced young people through fellowships, workshops, publishing and partnerships. In the summer of 2019, Narratio launched an annual storytelling and leadership Fellowship for resettled refugee youth in partnership with the Metropolitan Museum of Art. Over the past five years, work by 80 Narratio Fellows has reached 2.5 million individuals worldwide. In 2020, Ahmed began a storytelling and strategy consultancy with the World Bank’s Connect4Climate initiative. For this role, Ahmed co-hosted #Youth4Climate Live, a nine-episode series highlighting youth climate leaders in conversation with government ministers, institutional executives and civil society. The series and the #Youth4Climate campaign reached over a billion people across 130 countries. Ahmed’s work has been exhibited at Juilliard, Harvard Divinity School, Yale Law School, UNICEF House, Christie's, World Bank Headquarters and the Metropolitan Museum of Art, among others. Ahmed received a BA in Anthropology from Wesleyan University and a Master’s in Education from Harvard University. He is a winner of the Echoing Green Social Innovation Showcase, a Regional Murrow Award, the Adrian Cheng Fellowship from Harvard Kennedy School, and the Social Innovation Fellowship Fund award from Harvard Business School. He is a National Geographic Young Explorer and serves as one of 17 UN Young Leaders for the Sustainable Development Goals. KIM BRIZZOLARAFilm Producer and InvestorKim Brizzolara is a film producer, and private investor; and serves as advisor to several non-profit organizations. She is Executive Vice Chair of the Hampton's International Film Festival, where in 1999, she co-founded the signature program "Films of Conflict & Resolution", which she continues to oversee, Ms. Brizzolara is a Trustee of Glascow Caledonian University/NYC, which focuses on sustainable business practices, and serves on the boards of Creative Visions, Blade of Grass, The Sunny Center in Ireland for exonerees, and the Women's Leadership Board at the Kennedy School of Government at Harvard University.She started her career as a journalist with the Philadelphia Inquirer, and later worked with Kerry Kennedy at the Robert Kennedy Center for Human Rights, where she began to focus on the area of international conflict resolution. She then served as a grants maker for the Threshold Foundation, where she designated funds to nonprofit organizations that focus on peace and national security issues; as acting director of the Coexistence Center at Baruch College School of Public Affairs, which focused on conflict resolution, race relations, ethnic diversity, and equity in the academic environment and in the community; and worked in fund-raising and wrote position papers for various political campaigns. Julie GarciaPRESIDENT, THE GARCIA FAMILY SPOTLIGHT FOUNDATIONJulie Garcia is a lawyer, artist, and philanthropist based in Washington, D.C. Julie’s philanthropic efforts center on social justice, the arts, and providing access to education. She is a trustee of the Phillips Collection and serves on the board of A Breeze of Hope, which provides comprehensive legal and support services to victims of childhood sexual assault. She serves on advisory councils at both Brown University and Wesleyan University.Julie retired from Chevron Corporation in 2009, after five years as a senior consultant for the policy team with a focus on Southeast Asia. Before joining Chevron, Julie spent nearly a decade at AOL Time Warner, where she was Vice President for International Public Policy. At AOL, Julie played a pivotal role on a range of market access, baseline regulation, and intellectual property issues, in more than a dozen different geographies. Earlier in her career, Julie practiced intellectual property law and policy in Washington, D.C. at DLA Piper, where she specialized in representing “new media” clients. Julie has published extensively on novel issues in intellectual property law and policy.Julie earned her M.A. from the Corcoran College of Arts & Design at the George Washington University, her J.D. from Georgetown Law Center, and her B.S. from Northwestern University. Andile Alexius MnguniFounder, ROAR South AfricaAndile Alexius Mnguni is a South African serial Social Entrepreneur, Speaker and Changemaker dedicated to catalyzing change in the Education sector and at the intersection of Food Systems and Climate Change within underserved communities.As the founder of ROAR South Africa, Andile spearheads a social enterprise and movement aimed at empowering young people, providing them with the tools to find their voices and effect meaningful change within their communities. Her commitment to impact has continued with the establishment of The Source, an initiative dedicated to bridging the divide between social and environmental challenges. The Source's primary mission involves building sustainable circular economies within local contexts.Andile graduated with distinction from the University of Pretoria’s Gordon Institute of Business Science’s Social Entrepreneurship Programme. She wears many hats as a consulting impact practitioner, helping businesses understand the intricacies of grassroots challenges and navigating the role of socially conscious business practices within local communities. Her commitment and vision have earne'''
