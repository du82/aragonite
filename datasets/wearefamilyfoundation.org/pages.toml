description = "Karakalpakstan (an autonomous republic in Uzbekistan)    Project:  Shab-dal  qiriq qiz is a collective of cultural activists dedicated to preserving the heritage of the Karakalpak community from the Aral Sea delta of Uzbekistan facing political oppression, language extinction, and environmental disa"
full_description = "qiriq qiz Karakalpakstan (an autonomous republic in Uzbekistan)Project: Shab-dalqiriq qiz is a collective of cultural activists dedicated to preserving the heritage of the Karakalpak community from the Aral Sea delta of Uzbekistan facing political oppression, language extinction, and environmental disasters. Their documentary project, Shab-dal, examines the topics of collective memory and cultural preservation by exploring culinary traditions and highlighting the overlooked role of women as natural heritage keepers. “We advocate for women's visibility by giving women the opportunity to become the protagonists of their stories through family culinary histories, thereby showing that despite the patriarchal influence that has denied women's contribution to culture for many years, culture itself is transmitted to new generations by women.”Check out qiriq qiz’s work here: Instagram << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
