description = "Costa Rica    Project:  “Mujeres del Manglar” (“Women of the Mangrove”)  Pronouns:  She/Her  “Mujeres del Manglar” (“Women of the Mangrove”) is a documentary set in Manzanillo, a small fishing village on Costa Rica’s Pacific coast that struggles with poverty, government neglect, and the impacts of c"
full_description = "Astrid Peraza Costa RicaProject: “Mujeres del Manglar” (“Women of the Mangrove”)Pronouns: She/Her“Mujeres del Manglar” (“Women of the Mangrove”) is a documentary set in Manzanillo, a small fishing village on Costa Rica’s Pacific coast that struggles with poverty, government neglect, and the impacts of climate change. In response to this adversity, the women of Manzanillo join forces to establish the Mudecoop Cooperative. The documentary follows the mangrove growth cycle while telling stories of personal growth across three generations of women, showcasing the transformative power of women-led community projects.“My work intertwines environmental activism, community engagement, and filmmaking to address pressing social and political issues.”Check out Astrid’s work here: Linktree << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
