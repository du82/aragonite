full_description = 'Christopher Cerf Co-Founder & President, Sirius Thinking, Ltd. Gina LegnaniFormer Muppet publicist, Emmy award-winning producer, Founder, “eats & antiques" KATHY SLEDGETHE VOICE OF "WE ARE FAMILY" Tom SilvermanFounder & CEO, TommY BoY Steven Van ZandtMusician, Actor & Activist Montel WilliamsCEO, Montel Williams Enterprises, Inc. WE ARE FAMILY FOUNDATION (WAFF) is a non-profit organization that’s dedicated to the vision of a global family by creating and supporting programs that promote cultural diversity while nurturing and mentoring the vision, talents, and ideas of young people who are positively changing the world. Sign up with your email address to receive the latest news and updates from We Are Family Foundation.'
