["http://wearefamilyfoundation.org/programs"]
title = "Three Dot Dash — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''Scroll Apply | Global Teen Leaders YOUNG PEOPLECHANGING THE WORLD one basic human need at a time GLOBAL TEEN LEADERS:ADDRESSING THE WORLD'SMOST PRESSING ISSUES THREE DOT DASH MENTORS:HELPING TO EMPOWERTHE NEXT GENERATION Meet the global teen leaders THREE DOT DASH WAS INSPIRED BY THE LATE CRITICALLY ACCLAIMED POET AND PEACEMAKER, 13 YEAR-OLD MATTIE J.T. STEPANEK. IN HIS NEW YORK TIMES BEST SELLER, “JUST PEACE: A MESSAGE OF HOPE", MATTIE SAID “Peace is possible, when your basic human needs are met.” — Mattie J.T. Stepanek, Poet and Peacemaker Our 400+ GTL alumni are dedicated to positively affecting their communities and addressing one or more basic human needs. THREE DOT DASH POWERS THE MOST INFLUENTIAL SOCIAL ENTREPRENEURS BETWEEN THE AGES OF 13 -19, WHO HAVE FOUND A SOLUTION OR INNOVATION TO ADDRESS A BASIC HUMAN NEED. HOW WE DO THIS:Identify and curate Global Teen Leaders (GTLs)Host an annual game-changing Just Peace SummitPair each GTL with an extraordinary Mentor for ONE YEARCollaborate with innovative partners to expand purposeful offerings and opportunities that amplify their workFoster and sustain a sought-after global network that brings together hundreds of GTLs, Mentors, industry leaders, and policy makers – past, present and futureWe are a global family full of solutions. Our GTLs come from 75+ countries on 6 continents in 10 years. Their work is positively affecting millions of people. Making heads turn, and often, changing history. OUR COALITION PARTNERSOrganizations focused on creating positive change around the world make up our global Coalition, strengthening our existing network through new opportunities, and growing our global community. <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419802587-IEDRD5UQDEF8VAIHPX3A/UnicefUSA-logo1_1449175056.png" alt="UnicefUSA-logo1_1449175056.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1580419802562-5XWX5WL3ZD