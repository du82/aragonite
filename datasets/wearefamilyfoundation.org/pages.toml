full_description = '''Scroll “The CREATIVES” 2024 Frontliners GLOBAL STUDY unesco partnership WE ARE FAMILY FOUNDATION powers youth around the world who are changing the game with their ideas, innovations and social good solutions. WE mentor. WE CHAMPION. WE amplify. WE act creatively. WE lead with purpose.WE live for the power of community.WE are a global FAMILY made up of different cultures, ethnicities, beliefs and backgrounds. WE believe in the power of humanity.WE ARE FAMILY. WHAT STARTED AS A SONG BECAME A GLOBAL MOVEMENT...Through programs like Three Dot Dash, Youth To The Front Fund, Youth To The Table and TEDxTeen, WAFF amplifies the voice of young people, connecting them with resources, partnerships and opportunities at the forefront of global impact. They are speaking at the United Nations, in Forbes 30 under 30, mobilizing communities and spearheading global revolutions. THIS PURPOSEFUL COMMUNITY. LET'S TALK ABOUT IT. <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469900533-R1HBRQ91ZNTAD7XZ5O2M/chicago-featured.png" alt="chicago-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469900575-5UYJX034DZWLFU5A50R2/oprah-featured.png" alt="oprah-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469909338-MBOLHFHRX3FT4M7W5QEL/wired-featured.png" alt="wired-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469979636-YPYFP0EZPSFV1ONZNQO6/fortune-featured.png" alt="fortune-featured.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469909361-WESUKW2RNSBG3NAPGGJH/cnn-feature.png" alt="cnn-feature.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1478469909449-M22GDH1TDWC43H9IT3DF/huffington-featured.png" alt="huffington-featured.png" /> #block-yui_3_17_2_2_1478469096687_58801 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -15px; } #block-yui_3_17_2_2_1478469096687_58801 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 15px; margin-bottom: 15px; } <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1740507722620-HIWPZJGQHJO5YOEK5L4S/image-asset.jpeg" alt="📢 Will you tell us about your impact, needs, and challenges? @the_possibilists Study 2025 explores the impact, challenges, and needs of young changemakers aged 14-35 who currently lead initiatives that tackle social or environmental problems. You" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1739208023264-2BAJ4PSSU4KO4L0OXBVR/image-asset.jpeg" alt="Storytelling for resettled refugee youth. Disability inclusion in environmental justice. Breaking systemic barriers for Black artists in music and beyond. This is just a glimpse of the &amp;ldquo;The Creatives&amp;rdquo; 2024 class &amp;mdash; the newest #Youth" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1738948317753-AI3L460CBSYQ9WJ7DD1A/image-asset.jpeg" alt="From Davos to COP30: The Campaign for National Climate Plans During the World Economic Forum in Davos, #Mission2025 and We Are Family Foundation (WAFF) hosted a closed door roundtable with key stakeholders to continue to co-create a cohesive, human-" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1738591480504-L9LMXEWQZAI6EMU5ZAZO/image-asset.jpeg" alt="That&amp;rsquo;s a wrap! 🎬 Both Pre-Applications and Main Applications are now CLOSED for Three Dot Dash 2025 Global Teen Leaders. As our selection process unfolds over the next few months, we&amp;rsquo;ll be in touch with all of the incredible applicants" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1738346593051-XYYRKERP2Q8IAF4QFCXI/image-asset.jpeg" alt="AI, climate action, mental health, gender equality, healthcare &amp;ndash; WAFF Youth Delegates tackled it all during the 2025 World Economic Forum in Davos. This is what &amp;lsquo;Collaboration for the Intelligent Age&amp;rsquo; looks like. Yet still, young " /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1737653527507-ZSVNFQREK7HSJPSGFI0U/image-asset.jpeg" alt="In just one week, incredible things can happen... Here's a glimpse of the transformative magic from a Three Dot Dash Just Peace Summit. Apply now for the next summit in Stockholm, Sweden this June 🇸🇪. 2025 Global Teen Leader Pre-Applications clos" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1737555762208-D8B82F8TKD0F4SKUB78U/image-asset.jpeg" alt="We are taking the Just Peace Summit from New York City to Stockholm and doubling down on climate action.&amp;nbsp; Only a few more days to apply as a 2025 Global Teen Leader&amp;hellip; Link in bio for more info. 💌&amp;nbsp; #ThreeDotDash #WeAreFamily" /> #block-yui_3_17_2_1_1607710927020_23845 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1607710927020_23845 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Intro WAFF Homepage Announcements (2024) Overview Press'''
