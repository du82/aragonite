full_description = "Puneet Singhal IndiaProject: Green DisabilityPronouns: He/HimGreen Disability is a community-based project operating at the intersection of disability inclusion, climate justice, and social equity to integrate accessibility into environmental policies. Through storytelling, documentaries, AI, creative organizing, and more forms of expression, Green Disability amplifies marginalized voices, empowers individuals with disabilities to become advocates for change, and works to ensure that accessibility and equity are central to social justice movements and climate conversations. “We foster a sense of belonging, inspire collective action, and drive forward the message that true sustainability and justice must include everyone, regardless of ability.”Check out Puneet’s work here: LinkedIn << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
