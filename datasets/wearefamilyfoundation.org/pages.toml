["https://wearefamilyfoundation.org/quincy-jones"]
title = "Quincy Jones — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''Quincy Jones2006 Mattie J.T. Stepanek Peacemaker Award HonoreeAn impresario in the broadest and most creative sense of the word, Quincy Jones' career has encompassed the roles of composer, record producer, artist, film producer, arranger, conductor, instrumentalist, TV producer, record company executive, television station owner, magazine founder, multi-media entrepreneur and humanitarian. Among the multitude of awards that he has received for his contributions are an Emmy Award, seven Academy Award nominations, the Academy of Motion Picture Arts and Sciences' Jean Hersholt Humanitarian Award, 27 Grammy Awards, and is the all-time most nominated Grammy artist with a total of 79 nominations. Recently, he was inducted as a "Kennedy Center Honoree," the United States' most prestigious artistic award, for his lifetime contributions to the culture of the country, and is the recipient of the Republic of France's Commandeur de la Legion d' Honneur.Most recently, Quincy Jones added the title "Best Selling Author" to his list of accomplishments when his autobiography "Q: The Autobiography of Quincy Jones" entered the New York Times, Los Angeles Times and Wall Street Journal Best-Sellers lists. Released by Doubleday Publishing, the critically acclaimed biography retells Jones' life story from his days as an impoverished youth on the Southside of Chicago through a massively impressive career in music, film and television where he worked beside legends such as Billie Holiday, Ray Charles, Dizzy Gillespie, Count Basie, Ella Fitzgerald and Michael Jackson, among many others. In conjunction with the autobiography, Rhino Records released a 4-cd boxed set of Jones' music, spanning his more than 5 decade career in the music business, entitled "Q: The Musical Biography of Quincy Jones." Back to Honorees'''
year_published = 2006
year_updated = 2014
