description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = "Daniel Crown2005 We Are Family Visionary Award HonoreeComing from a family with a rich tradition of philanthropy, Daniel, along with his wife Ellen, continues that legacy with honor. He serves on the Board of a number of worthy and prestigious organizations, including Lenox Hill Hospital, Manhattan Eye Ear & Throat Hospital, The Allen-Stevenson School, The Jerusalem Foundation, The Crohn's and Colitis Foundation of America's Greater New York Chapter, Central Synagogue and the Mount Sinai Children's Center Foundation. He is also a Trustee at the New York Foundling Hospital. A native of Chicago, Daniel has been a resident of New York for more than 20 years. He and Ellen are the proud parents of four children and split their time between homes in New York and Connecticut. Back to Honorees"
