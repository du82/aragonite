title = "PRESS RELEASE: We Are Family Foundation to Honor Roger Daltrey CBE and LL Cool J at 2018 Celebration Gala — We Are Family Foundation"
description = "New York, NY (March 19, 2018) – We Are Family Foundation Roger Daltrey CBE and entertainment icon LL COOL J at its 2018 Celebration Gala on Friday, April 27, 2018 at the Hammerstein Ballroom in New York City. WAFF is a not-for-profit organization founded by legendary multiple GRAMMY® Award winning m"
full_description = "PRESS RELEASE: We Are Family Foundation to Honor Roger Daltrey CBE and LL Cool J at 2018 Celebration Gala New York, NY (March 19, 2018) – We Are Family Foundation Roger Daltrey CBE and entertainment icon LL COOL J at its 2018 Celebration Gala on Friday, April 27, 2018 at the Hammerstein Ballroom in New York City. WAFF is a not-for-profit organization founded by legendary multiple GRAMMY® Award winning musician Nile Rodgers, dedicated to the vision of a global family. WAFF creates and supports programs that promote cultural diversity while nurturing the vision, talents and ideas of young people who are positively changing the world.“Not only are both Roger and LL COOL J Kennedy Center and Grammy Awardees, they've dedicated much of their lives to organizations that benefit people overall, and youth specifically, which perfectly aligns them with We Are Family Foundation’s mission and goals. These two incredibly talented individuals are selflessly dedicated to helping others. We are immensely grateful to them for their efforts to improve the state of humanity and welcome them into our WAFF family”, says Rodgers. click here for full press release Annie GreeneMarch 19, 2018 Facebook0 Twitter Pinterest0 0 Likes"
author = ""
year_published = 2018
