full_description = "Daniel H. Stern2012 We Are Family Visionary Award HonoreeDan Stern is Founder and Co-CEO of Reservoir Capital Group, a New York-based investment management firm.Prior to founding Reservoir in 1998, Dan was President of Ziff Brothers Investments, a private investment advisory firm, and previously worked with the Burden Family in New York and the Bass Family in Fort Worth, Texas.Mr. Stern has participated in the formation and development of numerous investment management entities, including Starwood Capital, Och-Ziff Capital Management, HBK Investments, Ellington Capital Management, and Anchorage Capital, among others.Mr. Stern is President of the Film Society of Lincoln Center. He is a trustee of the Mt. Sinai Medical Center, the Educational Broadcasting Corporation (PBS Channel 13), DIFFA (Design Industries Foundation Fighting Aids), the Allen-Stevenson School, the Big Apple Circus, and Lincoln Center for the Performing Arts. He is also the Founder of 20 X 24 Holdings, an organization devoted to supporting large format analog photography and the artists who work in the large-format medium.He is a graduate of Harvard College and Harvard Business School. Mr. Stern, his wife Nanna and their two children reside in New York City. Back to Honorees"
