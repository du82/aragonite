full_description = "PRESS RELEASE: We Are Family Foundation Announces 2019 Global Teen Leaders NEW YORK, NY, January 17, 2019 – We Are Family Foundation (WAFF) is proud to announce the 2019 Three Dot Dash Global Teen Leaders (GTLs), representing 15 countries on 6 continents. Carefully selected and curated from hundreds of applicants, these 33 13–19 year-old teens are innovating technology and harnessing creativity to keep our water systems clean, rethink approaches to cancer research, put youth at the forefront of civic engagement, transform urban forestry industries, and use machine learning to tackle modern day crises, among other vital challenges. They are addressing some of the world’s most pressing issues across the spectrum. click here for full press release 2019 Global Teen Leaders At a Glance Annie GreeneJanuary 17, 2019 Facebook0 Twitter Pinterest0 0 Likes"
