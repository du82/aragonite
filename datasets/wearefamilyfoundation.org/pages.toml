description = "United States    Project:  Narratio Fellowship  Narratio is an organization and online platform that activates, supports, and highlights the creative expression of displaced young people through fellowships, workshops, publishing, and partnerships. Through their year-long flagship program, the Narra"
full_description = "Narratio United StatesProject: Narratio FellowshipNarratio is an organization and online platform that activates, supports, and highlights the creative expression of displaced young people through fellowships, workshops, publishing, and partnerships. Through their year-long flagship program, the Narratio Fellowship, resettled refugee youth learn to share stories across diverse contexts and receive media training, leadership development, networking support, and academic advising, ultimately shaping the global conversation around displacement and cultural production.“The program creates a mechanism for rejecting alienation and recognizing narrative agency, which allows Fellows to become active members of their communities. This personal impact ripples across to their families, their host communities, the media and entertainment industries, and the public perception about immigration and displacement.”Check out Narratio’s work here: Website << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
