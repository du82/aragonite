["https://wearefamilyfoundation.org/yttf-the-creatives-2024/dousman"]
title = "Dousman — We Are Family Foundation"
description = "Senegal, Netherlands    Project:  École Dousman  École Dousman empowers creative professionals and promotes safe and inclusive nightlife spaces while raising environmental awareness. Organized by multidisciplinary Dakar-based collective Dousman, the project includes DJ classes, event management ment"
full_description = "Dousman Senegal, NetherlandsProject: École DousmanÉcole Dousman empowers creative professionals and promotes safe and inclusive nightlife spaces while raising environmental awareness. Organized by multidisciplinary Dakar-based collective Dousman, the project includes DJ classes, event management mentorship and workshops, safety and sustainability campaigns, and creative project development. By combining practical training with social advocacy, Dousman strives to foster a safer and more sustainable nightlife culture in the local community. “Due to systemic gatekeeping and other barriers to employment, many talented individuals outside established circles in Dakar find themselves excluded from professional opportunities or fair compensation. This gatekeeping disproportionately affects marginalized groups of women, members of the LGBTQI+ community, and young people from disadvantaged backgrounds in securing stable and meaningful creative employment.”Check out Dousman’s work here: Instagram << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
