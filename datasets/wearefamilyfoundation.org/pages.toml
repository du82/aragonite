full_description = '''LARRY KING2004 We Are Family Humanitarian Award HonoreeEmmy Award-winning Larry King has been dubbed "the most remarkable talk-show host on TV ever" by TV Guide and "master of the mike" by Time magazine. CNN's Larry King Live is the first and only worldwide phone-in television talk show and is CNN's highest-rated program. Mr. King has written multiple books and received innumerable awards as well as honorary degrees from George Washington University, the New England Institute of Technology, Brooklyn College and the Pratt Institute. Mr. King is also the founder of the Larry King Cardiac Foundation and the Larry King Scholarships at George Washington University. Back to Honorees'''
