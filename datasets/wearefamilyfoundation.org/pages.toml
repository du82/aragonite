["https://wearefamilyfoundation.org/bono"]
title = "Bono — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = "BONO2016 We Are Family Humanitarian Award HonoreeBono, lead singer of U2 and cofounder of ONE and (RED)The lead singer of U2, Bono was born Paul David Hewson in Dublin. He met The Edge, Larry Mullen Jr. and Adam Clayton at school, and in 1978 U2 was formed. Acknowledged as one of the best live acts in the world, U2 have toured the globe countless times, released 13 studio albums, sold over 157 million albums and won numerous awards, including 22 Grammys®.Bono is a long-time activist in the fight against AIDS and extreme poverty in Africa. He is the cofounder of ONE, a global advocacy and campaigning organization with more than 7 million members dedicated to fighting extreme poverty; and (RED) which works with companies to raise awareness and funds for the fight against AIDS. To date, (RED) has generated $350 million for AIDS treatment and prevention in Africa through the Global Fund to Fight AIDS, TB and Malaria.Bono has received a number of awards for his music and activism, including the Legion D'Honneur in 2003, Time Magazine’s Person of the Year in 2005 (along with Bill & Melinda Gates), and an honorary British knighthood in 2007. He lives in Dublin with his wife and children. Back to Honorees"
