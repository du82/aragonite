["https://wearefamilyfoundation.org/henry-schleiff"]
title = "Henry Schleiff — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = "Henry Schleiff2003 We Are Family Visionary Award HonoreeHenry S. Schleiff is the Chairman and Chief Executive Officer of Court TV Network, having been promoted to that position in December, 1999.After joining the crime and justice network in October, 1998 as President and CEO, Schleiff helped re-launch Court TV by introducing several successful non-fiction series, documentaries, specials and original movies as well as adding popular off-network dramatic series and movies to the evening schedule. In addition, Schleiff has continued to build upon the network's exclusive daytime live trial coverage and expert analysis by signing a variety of established anchors and commentators. Under Schleiff's stewardship, Court TV has become one of the most successful basic cable networks in the industry, having grown from 31 million subscribers and an average prime time rating of .1 in 1998 to more than 75 million subscribers and a .8 average prime time rating, today.Schleiff came to Court TV as a television veteran with an extensive background in management and production. From 1996-1998, Schleiff was the Executive Vice President for Studios USA, where he was responsible for evaluating all East Coast broadcasting and cable opportunities for the TV group, developing new talent relationships with independent and niche producers and overseeing the production of various issue-related talk shows.From 1992-1996, Mr. Schleiff was Executive Producer for Viacom International Inc., where his production credits included a variety of original television movies, dramatic series and specials for such networks as HBO, Showtime, USA, Lifetime and AMC. Back to Honorees"
year_published = 2003
