full_description = '''WE ARE FAMILY FOUNDATION HUMANITARIAN AWARDHONORING A PERSON IN THE PUBLIC EYE WHO HAS MADE TREMENDOUS EFFORTS AND INROADS INTO MAKING THE HUMAN CONDITION BETTER THROUGHOUT THE WORLD. <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1578104481256-JCMB9OKLCI83JGRFQ7OX/WAFFWebsite_2019HumanitarianHonoree_ImagePanel_JeanPaulGaultier-TEMP1.jpg" alt="WAFFWebsite_2019HumanitarianHonoree_ImagePanel_JeanPaulGaultier-TEMP1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1525466265752-AJ7K27EOI9O086GRDK7N/WAFFWebsite_2018HumanitarianHonoree_ImagePanel_LLCoolJ.jpg" alt="WAFFWebsite_2018HumanitarianHonoree_ImagePanel_LLCoolJ.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1507758376055-W34701HTE06FP4ZUW6HM/whoweare-honoree_HH2017a.png" alt="whoweare-honoree_HH2017a.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1507758382708-8XA8I91I7GQXNITKU9TC/whoweare-honoree_HH2016a.png" alt="whoweare-honoree_HH2016a.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1507758388657-JQM875Y5VSB8AR07RQ8Z/whoweare-honoree_HH2015a.png" alt="whoweare-honoree_HH2015a.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1507758390240-XHWC4FDIHNBYW8721AX3/whoweare-honoree_HH2014a.png" alt="whoweare-honoree_HH2014a.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1507758391509-0TI1CBY1Y23G9QXDIZMB/whoweare-honoree_HH2013a.png" alt="whoweare-honoree_HH2013a.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1507758394814-LOE6E0ST171577FHEZO9/whoweare-honoree_HH2011a.png" alt="whoweare-honoree_HH2011a.png" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1507758396651-DY8Q204BH47KKO03OO0A/whoweare-honoree_HH2010a.png" alt="whoweare-honoree_HH20