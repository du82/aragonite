full_description = "It takes a village.When you donate to We Are Family Foundation (WAFF), you’re directly helping to impact our global family by strengthening leadership and Mentoring programs all powering this generation forward. As of June 2020, WAFF also invites you to donate to the Youth To The Front Fund, created to support and fund under-30-year-old BIPOC youth activists, youth-led organizations, projects, innovations and creative solutions that are at the forefront of fighting systemic racism, inequality, inequity and injustice in the United States and around the world.Should you wish to make donations via payment methods other than PayPal, please contact us at hello@wearefamilyfoundation.org.For partnerships and sponsorships, please contact Jess Teutonico, Executive Director, at jess@wearefamilyfoundation.org. DONATE TO WAFF"
