["https://wearefamilyfoundation.org/press/2020/6/15/press-release-we-are-family-foundation-announced-youth-to-the-front-fund-black-lives-matter-video-from-nile-rodgers"]
title = "PRESS RELEASE: We Are Family Foundation Announces Youth to the Front Fund; Black Lives Matter Video from Nile Rodgers — We Are Family Foundation"
description = 'NEW YORK, NY, June 16, 2020  –  We Are Family Foundation  (WAFF) is committed to fighting systemic racism, inequality, inequity and injustice. Black Lives Matter.   Founded by legendary musician  Nile Rodgers  and inspired by the power and true meaning of his song, "We Are Family", WAFF’s'
full_description = 'PRESS RELEASE: We Are Family Foundation Announces Youth to the Front Fund; Black Lives Matter Video from Nile Rodgers NEW YORK, NY, June 16, 2020 – We Are Family Foundation (WAFF) is committed to fighting systemic racism, inequality, inequity and injustice. Black Lives Matter. Founded by legendary musician Nile Rodgers and inspired by the power and true meaning of his song, "We Are Family", WAFF’s mission has always focused on bringing people together from different ethnicities, cultures and backgrounds. For more than a decade WAFF has been a leader in amplifying and supporting the actions and voices of diverse youth leaders across the globe who are actively and positively addressing issues surrounding our basic human needs - food, water, shelter, health, safety, education and the environment. However, ALL of those basic human needs are further compromised with systemic racism in our society. The world is finally acknowledging and demanding that the pandemic of systemic racism that has survived and thrived for hundreds of years needs to be eradicated – and our youth are on the front lines of finding the cure. WAFF created the Youth to the Front Fund (YTTF Fund) to support and fund under 30-year- old BIPOC youth activists, youth-led organizations, projects, innovations and creative solutions that are at the forefront of fighting systemic racism, inequality, inequity and injustice in the United States and around the world. The growing six-figure fund is not a one-off response to George Floyd’s murder and the subsequent global outrage, but rather an ongoing sustainable commitment. CLick here for full press release Annie GreeneJune 15, 2020 Facebook0 Twitter Pinterest0 0 Likes'
