["https://www.wearefamilyfoundation.org/communication-policy"]
title = "Communication Policy — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = "We Are Family Foundation Community Conversations PolicyWe Are Family Foundation (WAFF) maintains a commitment to justice and peace through impactful solutions and actions within our global communities. WAFF recognizes and seeks to amplify the voices, stories and experiences of all of our unique community members.Meaningful conversation, sharing and learning are vital for the WAFF community to constructively thrive. We welcome both positive and difficult conversations within the various spaces and platforms that WAFF hosts or participates.WAFF is dedicated to providing safe spaces for all WAFF community members to engage in meaningful dialog. To protect our community, we have adopted the following Community Conversations Policy:WAFF recognizes its global community is comprised of Global Teen Leaders (GTLs), GTL Alumni, Mentors, Frontliners, TEDxTeen Speakers, Three Dot Dash Team, Youth To The Front Team, WAFF Internal Staff, WAFF Board Members (US Board of Directors, UK Board of Trustees and Board of Governors)WAFF fully respects freedom of speech and expression for each and every one of its global community membersWAFF will NOT tolerate:o Personal attacks directed at any WAFF global community member or any other personso Verbal abuse (including, but not limited to racial, religious or sexual slurs, profanities/cursing, insults or name-calling) and cyber-bullying by or directed at WAFF global community members or third parties o Violent threats or other direct or implied Illegal actions by WAFF global community members at fellow WAFF global community members or personsIf any impermissible conduct occurs within any WAFF hosted/administered platforms or in communications outside of WAFF platforms but which reference or tag WAFF or any community members, WAFF will promptly respond, conduct an expeditious internal review and take all reasonable actions to procure immediate compliance with this policy, including removal of any person from the WAFF global community.If any WAFF community member has concerns or questions about this Community Conversations Policy, you may directly contact any internal WAFF team member that you feel comfortable—our lines and inboxes are open."
year_published = 2024
year_updated = 2024
