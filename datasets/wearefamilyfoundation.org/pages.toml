title = "Maya Angelou — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''Dr. Maya Angelou2005 Mattie J.T. Stepanek Peacemaker Award HonoreeMaya Angelou is considered one of the most eminent authors and poets, and has long been one of the strongest voices for civil rights activism in America. She is best known for her autobiographical writings, such as I Know Why the Caged Bird Sings (1969) and All God's Children Need Traveling Shoes (1986). Her volume of poetry, Just Give Me a Cool Drink of Water 'Fore I Die (1971) was nominated for the Pulitzer Prize, and she has published numerous other collections of verse.Angelou's early activism led Martin Luther King, Jr. to request that she become the northern coordinator for the Southern Christian Leadership Conference in the 1960's. In the early and mid-1960s, Angelou was an editor for newspapers in Africa, including The Arab Observer in Cairo, Egypt and The African Review in Accra, Ghana. She returned to the United States in the 1970s, being named a member of the Bicentennial Commission by Gerald Ford and a member of the Commission for International Woman of the Year by Jimmy Carter. She was given a lifetime appointment in 1981 as Reynolds Professor of American Studies at Wake Forest University in Winston-Salem, North Carolina. She also read one of her poems, entitled "On the Pulse of Morning", at President Clinton's inauguration in 1993, at his request.In addition to her careers in literature and activism, Angelou has had success as a director, producer, actor, and author for stage, television, and film. She wrote the screenplay and score for the film Georgia, Georgia in 1971: the screenplay was nominated for a Pulitzer Prize. She was nominated for a Tony Award in 1973 for Look Away (her debut role), and an Emmy for her role in the 1977 miniseries Roots. She was the first African-American woman admitted to the Directors Guild of America.Dr. Angelou now lectures extensively throughout the United States and she has become very well known due to appearances on "The Oprah Winfrey Show". Her writing contains themes of love and universality of all lives. Dr. Angelou states, "The honorary duty of a human being is to love." Back to Honorees'''
