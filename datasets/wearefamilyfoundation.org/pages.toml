["https://wearefamilyfoundation.org/youth-to-the-table"]
title = "Youth To The Table — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = "We need young people. To rethink. To reshape. To challenge how we approach and solve the world's unprecedented problems.The energy and ingenuity of youth have already started to make waves on the global stage, illustrating their remarkable potential to rally the world and drive meaningful action. Yet still, young changemakers are often restricted by decision-making stakeholders who invite them to participate in conversations that tend to be more performative than productive.We Are Family Foundation’s (WAFF) Youth To The Table (YTTT) program accelerates sustainable change by deepening intergenerational dialogue between young changemakers and current stakeholders, and ensuring young people have a meaningful say in the decisions that impact all of our lives. YTTT brings WAFF Youth Delegations to co-lead pivotal conversations and bridge generation gaps at powerful and historic global convenings, including the United Nations General Assembly (UNGA), the United Nations Climate Change Conference (COP), and Davos during the World Economic Forum (WEF). MEET THE UNGA79 DELEGATES MEET THE DELEGATES AT DAVOS2024 MEET THE COP16 & COP29 DELEGATES MEET THE COP28 DELEGATES MEET THE DELEGATES AT DAVOS2025 MEET THE UNGA78 DELEGATES YTTT partners with policymakers, governments, business leaders, organizations, and corporate partners to create meaningful, accountable, and non-performative opportunities for youth to participate in decision-making across all sectors. Our youth leaders have voices, knowledge, skills and lived experiences. YTTT provides them with the chance to channel these attributes into lasting change by leading and challenging the status quo. Photo by Carol Biazotto Photo by Lana Walsh Photo by Lawrence Jackson, 2015 Join us as we flip historic power dynamics. #YouthToTheTable #WeAreFamily Inquire Here"
