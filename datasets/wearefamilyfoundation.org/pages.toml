["https://wearefamilyfoundation.org/dionne-warwick"]
title = "Dionne Warwick — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''DIONNE WARWICK2007 We Are Family Humanitarian Award HonoreeOver an illustrious four-decade career, DIONNE WARWICK has established herself as an international music legend. As a performer, she has delighted audiences on every continent. As a philanthropist and activist, she has been a true pioneer in serving humanitarian causes, including being one of the first artists to lead the music industry in the fight against AIDS with her landmark recording of "That's What Friends Are For," with Elton John, Stevie Wonder and Gladys Knight. Warwick is also on the Board of Governors of the We Are Family Foundation and participated in the remake of the hit song, "We Are Family" after 9/11 with over 200 other stars.Throughout the world, Warwick has devoted countless hours to a wide range of humanitarian causes, serving as the U.S. Ambassador for Health throughout the 1980's. In 2002, she was named a global Ambassador for the United Nations Food and Agriculture Organization. Warwick also spearheaded the long-overdue development and production of a history book that will detail African American history for use in schools, libraries and bookstores throughout the world. She continues her work as a socially conscious and concerned global citizen. In 2002, Warwick was honored by the American Red Ribbon AIDS Foundation and the following year, she received a lifetime achievement award from the R&B Foundation, and was selected as one of the Top Faces of Black History. She was recently named a "Hero in the Struggle" as she was honored by the Black Aids Institute.Warwick was also honored with the first SupportMusic Appreciation Award which she received in Washington DC for her tireless efforts to preserve music education in school curricula.Warwick first hit the charts in 1962 with her hit single, "Don't Make Me Over," and scored 12 consecutive Top 100 hits between 1963 and 1966, emerging as the foremost interpreter of the soon-to-be legendary Bacharach-David catalog. "Walk on By," "Say A Little Prayer," "Anyone Who Had a Heart," "Windows of the World," "Wishin' and Hopin'," "Do You Know the Way to San Jose?", are just a few of the unforgettable songs inextricably linked to this extraordinary vocalist. Her signature tone, nuanced phrasing and stunning emotional range firmly ensconced Warwick in the upper echelon of popular music earning her icon status.She earned Grammy Awards for "Do You Know the Way to San Jose?" (1968), "I'll Never Fall in Love Again" (1970), "I'll Never Love This Way Again" (1979), "Déjà vu" (1979), and "That's What Friends Are For" (1986). The latter song, featuring Elton John, Stevie Wonder and Gladys Knight, was not only a smash hit, but a cultural landmark for its highlighting the devastation caused by AIDS. The song helped raise awareness and millions for the American Foundation for AIDS Research.Warwick received a star on Hollywood' "Walk of Fame" and was honored by Oprah Winfrey at the 2005 Legends Ball. In 2006, Warwick joined Bacharach to perform "Walk on By" and "That's What Friends Are For" for some 36 million "American Idol" finale viewers.With a new duets album just out, "My Friends And Me," (Concord Records), Warwick will doubtless continue to use her voice to both hold audiences spellbound and to speak out for humanity and for what she believes is right. It's what she has always done. Back to Honorees'''
year_published = 2007
year_updated = 2014
clearnet = "https://wearefamilyfoundation.org/dionne-warwick"
