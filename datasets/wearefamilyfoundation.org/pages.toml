full_description = "Kushite Revival United StatesProject: Kushite RevivalKushite Revival is a New York-based youth organization that works with community centers and schools, empowering young people to take control of their mental and physical health to foster a constructive lifestyle. With an interactive curriculum founded on the pillars of Nutrition, Physical Exercise, Mental Exercise, Social Instruction, and the Basics of Boxing, the program features interactive workshops with food label analysis, original short films, and physical activities to instill lifelong values of self-reliance, self-defense, and self-care.“In certain areas of Brooklyn, a lot of the youth value perspectives that [...] can land them in extremely dangerous situations with the least optimal circumstances. Providing new perspectives while they are still young and growing will create new pathways for them and new heights to reach.”Check out Kushite Revival’s work here: Instagram << Back to Main Evan Wei-HaasJanuary 27, 2025 Facebook0 Twitter Pinterest0 0 Likes"
