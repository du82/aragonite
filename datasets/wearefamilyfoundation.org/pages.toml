["http://wearefamilyfoundation.org/the-possibilists"]
title = "The Possibilists — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = 'WE ARE FAMILY FOUNDATION IS A PROUD COLLABORATOR ON THE FIRST OF ITS KIND STUDY THAT REVEALS THE PRESSING NEEDS OF YOUNG CHANGEMAKERS WORLDWIDE. Young people are creating change everywhere we look. Some of them dedicate everything they have to tackle the most pressing issues of our time; it is their work and way of life. They are changemakers, activists, social innovators, disruptors, dreamers, doers, people who believe social and environmental change is possible. They are Possibilists.The Possibilists, Initiated by ChangemakerXchange, is a global study driven by the desire to better understand the lives and realities of young changemakers. It was conducted in 2021 by an alliance of 16 of the world’s leading youth social innovation networks, including Ashoka, The Diana Award, Global Changemakers, The Kofi Annan Foundation, MasterPeace, Obama Foundation, One Young World, Peace First, Social Impact Award, Social Shifters, SOS Children’s Villages International, UNLEASH, We Are Family Foundation, Yunus&Youth, and YSI – Young Sustainable Impact and supported by SAP Foundation and Google org.The study surveyed a diverse group of about 800 young social innovators aged 16-35 from 137 countries who all lead impact-focused initiatives, social businesses, non-profits and campaigns related to every single one of the 17 UN Sustainable Development Goals, from lobbying for the rights of migrant construction workers to supporting sexual violence survivors. <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1629230232058-KDHQM353T3EBUX67ENW5/1.jpg" alt="1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1629230432467-B5XS27J04GB09OYAGKC2/2.jpg" alt="2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/581e5b6a8419c273288db3e9/1629230445180-E0G8LDUQKE3ALDAUG3U0/3.jpg" alt="3.jpg" /> Key findings: Young changemakers are sacrificing their financial security and wellbeing to change the world. Financial issues: 66% cannot compensate themselves beyond a token amount for their work on their initiatives (41% not at all), and only 9% can live off their ventures. Wellbeing issues: 59% have experienced some degree of burnout since they started work on their initiative.64% feel their work is negatively affected by systemic inequalities.The COVID-19 crisis has increased both their capacity and desire to make a change in the world.Only 3% have been forced to close down activities due to COVID; the majority are innovating, adapting and responding to the challenge. Recommendations to support changemakersThe report outlines eight recommendations for organizations to better support changemakers on a personal level and in their work with their initiatives and organizations. Support programs for youth social entrepreneurship need to: Focus on young social innovators as people and on their personal needs and not just on their initiatives; Ensure the personal financial stability of young social innovators; Offer wellbeing support, and avoid placing additional or unnecessary pressure and demands on young social innovators; Strengthen the local–international connections of young social innovators and how their work helps to translate global matters into concrete local action;Focus on working to reduce systemic inequalities;Give young social innovators a seat at the table by facilitating access to decision-makers and grant young social innovators access to places of power and influence. Download the full report (pdf) For more info visit thepossibilists.org'
year_published = 2021
year_updated = 2024
clearnet = "http://wearefamilyfoundation.org/the-possibilists"
