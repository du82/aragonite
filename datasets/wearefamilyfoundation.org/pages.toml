full_description = "Henry Juszkiewicz2008 We Are Family Visionary Award HonoreeMr. Juszkiewicz grew up in Rochester, NY and worked his way through school playing guitar — a Gibson, of course. He completed his MBA at Harvard University on a General Motors Fellowship. In 1986, Juszkiewicz and his partners acquired the faltering Gibson guitar operation. His aggressive management style and innovative marketing transformed Gibson from the brink of closure to a company respected worldwide, with an annual average growth of 20 percent over the last decade. Juszkiewicz began fulfilling his vision of Gibson as a full-line, global musical instrument company by acquiring other instrument companies, establishing a Gibson-owned European distribution center with joint-venture distributors, and obtaining manufacturing facilities in China. Henry resides in Nashville, Tennessee with his wife, Catherine, and children. Back to Honorees"
