["https://wearefamilyfoundation.org/deepak-chopra"]
title = "Deepak Chopra — We Are Family Foundation"
description = "Sign up with your email address to receive the latest news and updates from We Are Family Foundation."
full_description = '''Deepak Chopra2008 Mattie J.T. Stepanek Peacemaker Award HonoreeDr. Deepak Chopra is the Founder of Chopra Center for Wellbeing in Carlsbad, California and Manhattan, New York and President of the Alliance for a New Humanity. Chopra's Wellness Radio airs weekly on Sirius Satellite Stars, Channel 102, which focuses on the areas of success, love, sexuality and relationships, well-being, and spirituality. Time Magazine heralds Deepak Chopra as one of the top 100 heroes and icons of the century, and credits him as "the poet-prophet of alternative medicine." (Time Magazine, June 1999.)Deepak Chopra is known as a prolific author of over fifty books with thirteen best sellers on mind-body health, quantum mechanics, spirituality, and peace. A global force in the field of human empowerment, Dr. Chopra's books have been published in more than thirty-five languages, including numerous New York Times bestsellers in both the fiction and non fiction categories. His latest book, The Third Jesus: The Christ We Cannot Ignore, was released on February 19, 2008. His New York Times best sellers, Peace is the Way won the Quill Awards and The Book of Secrets, was awarded the grand prize at the 2005 Nautilus Book Awards.Deepak Chopra's popularity as an international presenter and keynote speaker is exemplified in an impressive list of honorariums. As the keynote speaker, he appeared at the inauguration of the State of the World Forum, hosted by Mikhail Gorbachev and the Peace and Human Progress Foundation. Esquire Magazine designated him as one of the top ten motivational speakers in the country; and is the recipient of the Toastmasters International Top Five Outstanding Speakers award. He participates annually as a lecturer at the Update in Internal Medicine course sponsored by Harvard Medical School, Department of Continuing Education and the Department of Medicine, Beth Israel Deaconess Medical Center. Chopra has been a keynote speaker at several academic institutions including Harvard's Divinity and Business Schools, Stanford, and Kellogg School of Management. He is the recipient of the Einstein Award through Albert Einstein College of Medicine in collaboration with the American Journal of Psychotherapy.Dr. Chopra is a fellow of the American College of Physicians, a member of the American Association of Clinical Endocrinologists, Adjunct Professor at Kellogg School of Management and Senior Scientist with The Gallup Organization. Back to Honorees'''
year_published = 2008
year_updated = 2014
