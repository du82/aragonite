full_description = 'Dentistry 🦷 Additional Dentistry Application Resources We Are Medics Read more posts by this author. We Are Medics 19 May 2021 • 1 min read These Instagram accounts have a lot of insightful thoughts about dentistry:@iwanttobeadentist is a dental Instagram account with some free opportunities. Make sure to check the eligibility criteria and have a look at the link their bio!@drraabihamaan is an excellent Dentistry Account run by Dr Raabiha Maan, UK based General Dentist. There is a wealth of free videos in her highlights section and IGTV that provide exceptional insight into various aspects of the Dental World. Dr Raabiha runs a series called “20 topics” aimed at professionals and students where she speaks to experts within the world of dentistry. In a time when work experience can be scarce, being able to FREEly watch her insightful videos makes a huge difference and really clarifies how unique the dental world really is. As a current student her videos definitely help me day-to-day.@smileshadowers is a dental Instagram account run for and by predental students at UCLA. It provides an excellent opportunity to virtually shadow various dental specialists on a global platform giving you well rounded insight into the breadth of opportunities to grow, connect and learn within dentistry.Some more resources:The BDJ (British Dental Journal) have lots of fun articlesDentistry.co.ukOur FREE Dentistry eBook and Blog Posts here. More in Dentistry 🦷 Fun facts about studying Dentistry in the UK 24 Apr 2021 – 1 min read 🚀 Virtual Work Experience Opportunities 24 Apr 2021 – 1 min read Consent in Dentistry: Part 3 (Consent in Children) 9 Feb 2021 – 3 min read See all 18 posts → Blog Series by Medical Applicants ✏️ COVID Passports - A Critical Appraisal By Sarayu Shankar - Year 12 Medicine Applicant Featured from our May Newsletter - "Medicine in the News" section. "I believe COVID Passports are being introduced to 6 Jul 2021 • 3 min read Dentistry 🦷 Fun facts about studying Dentistry in the UK 1. There are 14 undergraduate dental schools in the UK. 2. Dentistry courses usually last about 5 years, unless you choose to intercalate (study another course for 1 year in between). 3. Year group sizes are fairly tiny compared to medicine – usually around 75 24 Apr 2021 • 1 min read'
