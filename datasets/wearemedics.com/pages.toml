full_description = 'Dentistry COVID-19 & Dentistry: Some Interesting Reads… 1. Dentists as superheroes in the Fight Against the Virus by Professor Damien Walmsley (Head of Teaching Unit of the Prosthetics Dentistry department at UoB) This super fun and light 13 Aug 2020 • 4 min read Reading list Book Recommendation: When Breath Becomes Air Paul Kalanithi’s memoir is pretty much near the top of the list of the (many) books I’ve read over my almost 22 years. This amazingly written autobiography cleverly 10 Apr 2020 • 4 min read Reading list 5 Podcast Episodes Aspiring Medics Should Listen To 1. Why Become a Doctor? Junior Doctors: A Matter of Life and Death "With great power comes great responsibility" is a phrase most of us are familiar with, 10 Apr 2020 • 3 min read Reading list 5 Videos Every Aspiring Medic Should Watch This Week This is a collection of YouTube videos to watch and gain a better understating of Medicine as a career. Thanks to Kenneth for pulling these together! 1. A stressful shift 8 Apr 2020 • 3 min read Reading list Evidence Based Medicine and Virtual Journal Club Hi, I’m Tom, currently a third year at Birmingham and have been asked to explain the premise of evidence-based medicine as well as appraise an article from an online 8 Apr 2020 • 4 min read Reading list 6 News Articles Every Aspiring Medic Should Read This Week Hi guys! To introduce myself: my name is Ruby and I am a third year medic at the University of Birmingham. I wanted to share with you today six articles from sources that I believe are super useful both in preparing for your medicine interviews and for expanding your knowledge of the medical field. 7 Apr 2020 • 4 min read'
