["https://wearemedics.com/blog/example-personal-statements-graduate-entry-medical-school"]
title = "8 Example Personal Statements - Graduate Entry Medical School"
description = "We have collected a few Graduate entry personal statements for you as many of you have asked. The personal statements are from students who all received offers at medical schools for the graduate entry course. We have presented them under the undergraduate degree the student studied before Medicine. These degrees"
full_description = "Personal Statement 8 Example Personal Statements - Graduate Entry Medical School We Are Medics Read more posts by this author. We Are Medics 21 Jun 2020 • 19 min read We have collected a few Graduate entry personal statements for you as many of you have asked. The personal statements are from students who all received offers at medical schools for the graduate entry course. We have presented them under the undergraduate degree the student studied before Medicine. These degrees are not an exhaustive list.Remember, these personal statements are not 'perfect' - none ever will be! Each medical school is looking for something different. Be careful not to plagiarise personal statements you read online - UCAS will detect this.Biomedical SciencesExample 1I view medicine as a career with a diverse range of roles that all ultimately care for and improve people’s health. This diversity is why I want to be a doctor because I will care for patients, whilst learning, educating and problem solving. As a doctor I would work in a team to provide effective healthcare, where everyone counts and are treated with respect, dignity and compassion. I believe I have what it takes to work to these values as a practitioner, scientist, scholar and professional.Alongside my degree in Medical Science, I have shadowed in clinic and ward environments to contextualise my understanding. I manage my time effectively with working in retail, volunteering at St Stephens day care centre during term and St Giles Hospice during vacations both on the ward and by teaching young adults about end of life care. From these, I have developed a strong skill set for working in healthcare. Over the past 16 months I shadowed an obstetrician and gynaecologist once a month. I saw patients more than once and appreciated the importance of developing strong doctor-patient relations, and how treatment is a balance between treating the pathology and quality of life. After observing the doctor, I developed the ability to tailor my approach to individuals whilst maintaining dignity and respect.During a week in ENT and CDU at the Queen Elizabeth Hospital, I noticed how oral and written communication within the NHS multi-disciplinary team is vital for delivering the best patient-centred care. I gained an insight into the demands of a junior doctor’s routine and I was inspired by the teamwork between all staff levels that makes a doctor’s job possible. I saw the importance of being honest, compassionate and clear when talking to patients. I admired one doctor’s humanity and reassurance during a conversation with a COPD patient regarding resuscitation, as he ensured the patient would continue to receive the best care. It highlighted that whatever a person’s situation – everyone counts.I experienced the emotional challenges of birth and death when I was awarded a bursary to work in a Tanzanian hospital for two weeks in 2015. The experience developed my resilience and ability to maintain focus in stressful environments and showed me medicine is not glamorous, but is rewarding. I realise the challenges of healthcare, but I was inspired by being part of making patients’ lives more positive.I was awarded a competitive 8 week studentship by the Lister Institute whereI worked on patient fibroblasts with mutant DNA repair protein Treslin; where my work will contribute towards a publication. I prioritised and organised myself to carry out experiments, became resilient when faced with problems and became able to effectively analyse data to draw conclusions. I can translate these skills to treating patients as I witnessed doctors using them to provide good care. Evidence based medicine is important for improving patient care, and I have the skills to help me continue researching as a medical student and an academic doctor, as well as giving me an awareness of how research changes practise.Experience being a retail team leader for 4 years and student ambassador for my undergraduate programme has given me the communication and teamwork skills to confidently communicate with a range of people and work under pressure. I have responsibility of leading a team by being president of the university Blood Donation Society, to increase the number of student donors and fundraise. I spend my free time riding horses and weightlifting; both allow me to focus on something I find relaxing and enjoyable, but require dedication, resilience and determination.Although it will be challenging, I have demonstrated that I can make a positive contribution to an academic programme and I would continue this enthusiasm in my medical degree. I would take my studies seriously, demonstrating dedication and an attitude that reflects the values of the NHS Constitution.Example 2My desire to study medicine cannot be attributed to a single phenomenon or traced back to a precise ‘lightbulb-flashing’ moment. Instead, it is steadfast and evolving, honed by years of commitment and curiosity - which resonates in the valuable NHS experiences I have seized. I enjoyed studying the complex elements driving health and disease states throughout my Biomedical Science degree, which I earned First Class Honours in; but I knew that my interests lay beyond the confines of the lab. Each module fascinated me but learning through pro-sections in Human Anatomy was a particular highlight, which led me to return this year as a practical demonstrator.Working alongside my studies was a challenge I overcame with meticulous time management. My role as anti-coagulation assistant, since June 2015, gives me a realistic grasp of what working in the NHS means. Daily, I overcome the challenges of working in an understaffed department with efficiency and patience. An example is when I noted the detrimental effects of an outdated clinic diary system; I took the initiative to create and apply a new template, which has since improved patient waiting times considerably. Effective communication is essential, as I liaise with members of the multi-disciplinary team to manage patients. I work carefully to safeguard patient confidentiality, as I independently prioritise and process referrals to create clinics. This requires plenty of responsibility, as does conducting INR testing in clinics, where I also support my team of nurse specialists in counselling patients. This patient exposure is deeply rewarding; it is heart-warming to see the 82-year-old lady who gets up at 6am to look her best for us, or the waving gentleman with failing eyesight who still spots me from afar. Besides humbling me, these moments serve as the strongest incentive to keep going in the face of drawbacks.My work experiences were also insightful and consolidated my career choice. Assisting in consultant-led haematology clinics, I noted that by showing interest in the patient and maintaining eye contact, the clinician built a relationship of mutual understanding. Furthermore, techniques such as summarising and signposting gathered information quickly and effectively to guide treatment. Contrarily, whilst shadowing my local GP I was reacquainted with the unpredictability of disease during a consultation with a young girl, whose brain tumour had diminished her quality of life. Putting my sadness aside, I observed the GP’s professional detachment and reflected on the importance of being resilient in this career. I also faced challenges whilst volunteering as a dining companion on the wards, when certain patients would refuse food despite their malnourished state. I tried my best to feed patients/promote eating, but sometimes I had to walk away and respect the patient’s autonomy, even though it went against my instincts.I consider myself to be a compassionate person. This is reflected in my role as a part time carer for my grandfather, to whom I provide everyday support in hygiene and administering medication. I also make time for charities such as Humanity First, Breast Cancer care and Team Up. My participation ranges from marshalling at walks, to working behind the scenes in logistics. Recently, I had the privilege of being appointed Youth Group leader for young girls in my local community. I mentor the girls weekly in workshops, tackling issues such as bullying, teaching Urdu, baking, and arts and crafts.My hobbies include swimming and horse-riding, as they are fun ways to stay fit. I also enjoy reading stimulating literature – recently I read “The immortal life of Henrietta Lacks”, which enlightened me on the evolution of medical ethics and the importance of informed consent. I am confident a medical career is right for me. I recognise there will be challenges, but I believe that my realistic expectations, maturity, and resolve, allow me the capability to overcome these. I hope you will allow me the opportunity to prove so.Biomedical Sciences with a PhDOne image that has stuck with me is of a gentleman gripping the table as he learned of his cancer diagnosis. The experience highlighted how a doctors job is as much breaking bad news as it is treating people. It took place when shadowing a Urology firm, where I was able to attend surgery, outpatients’ clinics and ward rounds. Spending time with varied levels of doctors taught me how the role changes with experience and training, but that the basics of care remain the same. It confirmed how much I want to be a doctor, as every day and patient is different; it was not so much the illness but the individual that mattered most. Witnessing bad news being broken was difficult, but revealed I have the empathy and fortitude to be with those patients in difficult times. Shadowing a physiotherapist in a private clinic emphasised seeing the patient in a holistic way, as a simple foot injury may be the sign of an underlying hip condition.When undertaking a PhD in cancer biology, I enjoyed investigating the reasons behind cellular behaviours. It taught me to have an inquisitive mind, ask questions and look for solutions, but it made me realise that what I want to do is use these skills to treat the patients whose cells were in front of me. It developed my ability to be an independent thinker, be self-motivated and in charge of my own learning; I believe these qualities will aid me during medical school and my future career.I have been a trained first aider with St. John Ambulance for a year. Although the skills learnt and practised are undoubtedly useful, the most valuable experience has been dealing with distressed members of the public, especially children. When a performer fell off stage whilst I was on duty at an event, I used my training to take observations and ensure he kept his head still until paramedics arrived. I wanted to have the knowledge and skills to help him further. Learning some basic first aid has made me even more passionate to know the why behind the treatments and to be able to diagnose injuries and diseases.Witnessing how unglamorous the job can be, I was covered in a violent patient’s blood after he removed a cannula. One evening a week, I volunteer in the ED of a large teaching hospital, helping care for patients by speaking to them, transporting and giving food and drink. Never knowing what I will encounter, I have realised the uncertainty that comes with being a doctor, and how exciting yet daunting this can be. I have seen how communication is key when treating patients, as many people do not mind waiting if kept informed. A lady had been on a trolley for 3 hours and was becoming distressed. When I explained we were waiting for a bed, the calming effect was clear.Communication is vital in all areas of the hospital. I have worked in an NHS hospital for almost two years. Firstly, in the finance department of a DGH, which helped me understand the economic complexities and strains the health service is under. Currently, I work within the Pharmacy quality department. It has given me an awareness of how therapies work and how important timely discharge is to patients and staff. Several incidents could have been avoided with effective communication between staff members.I gained insight into the world of a medical student when employed as a simulated patient. Many students in their first week did not explain procedures or introduce themselves. By the end of the year, the communication skills had greatly improved, and a simple introduction made me feel much more at ease. I have taken part in events to encourage more children into science, including ‘I’m a scientist, get me out of here!’ and the Bodyworlds exhibition. I taught undergraduates during my PhD and, as teaching is a part of Medicine, it would be enjoyable building on these skills.I enjoy running, reading crime novels and learning French. I play the flute, previously as part of an orchestra that toured Belgium, playing in Ghent Cathedral.Master of PharmacyExample 1As a hospital pre-registration pharmacist, I have had the opportunity to witness doctors’ application of clinical knowledge during decision making and their devotion and empathy towards patients. This has deepened my admiration for clinical practice and reinforced my aspiration to become a doctor. Working alongside clinicians has strengthened my desire to gain a deeper understanding of the human body and my desire to play an integral role in differential diagnosis to assist patients.Pharmacy has helped me to develop a broad range of skills necessary to study medicine. At Heart of England NHS Foundation Trust (HEFT), I liaise within an MDT to provide patient-centred care and deliver an efficient and seamless service, especially when undertaking ward based medicine management. I take accurate drug histories from patients through the use of pertinent questions and observation skills. Using my professional judgement in the interest of patient safety allows me to readily detect and reduce the occurrence of medication errors. Furthermore, I have also gained a comprehensive understanding of the diverse range of patients in primary and secondary care, which has taught me how to adapt the way I communicate to meet my patients’ unique needs. I understand the importance of patient confidentiality and safeguarding vulnerable adults and children as well. These attributes that I have developed will help me to become a safer, efficient and confident clinician in the future.Due to my clinical rotations at HEFT I have developed a particular interest in genetic disorders. I recently met a patient who had been diagnosed with Shapiro Syndrome. I took this opportunity to converse with the patient which helped me gain an understanding of the disorder and the pharmacological treatment involved. My rotation within cancer services, including a placement at Marie Curie Hospice, has shown me how the Liverpool Care Pathway is implemented and helped me understand the importance of empathy. I shadowed consultant haematologists in various roles at Heartlands hospital including haematology clinics and ward rounds. I observed a doctor administer chem"
