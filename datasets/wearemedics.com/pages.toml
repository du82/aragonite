["https://wearemedics.com/blog/master-list-of-medical-school-application-resources"]
title = "Master List of Medical school Application Resources:"
description = """
There are many resources out there for medical school applicants and in this blog, I’ve put together some resources that may be helpful with each stage of the application process, whether that’s choosing a medical school, tackling the UCAT / BMAT and med school interviews.

Note

All online resources"""
full_description = "BMAT Master List of Medical school Application Resources: We Are Medics Read more posts by this author. We Are Medics 16 Apr 2020 • 4 min read There are many resources out there for medical school applicants and in this blog, I’ve put together some resources that may be helpful with each stage of the application process, whether that’s choosing a medical school, tackling the UCAT / BMAT and med school interviews.NoteAll online resources recommended are free, and the 3 books we have recommended are not essential for success. Do not feel like you need to purchase anything to support your medical application. The author of this blog found these books helpful, however in almost all cases the same information is available online for free.General application essentials:Entry requirements for UK medical schools 2020 entry by the Medical Schools Council - this is a list of all the medical schools in the UK, their entry requirements and summary of their shortlisting procedures and their type of interview. I would recommend using this for making a list of medical schools you want to apply to based on your strengths (i.e – if you have a high UCAT score or strong GCSEs, you may want to pick medical schools that give a high weighting to these when selecting applicants for interview). Available hereIndividual Medical School Websites - each medical school will have an admissions page which provides further details about their shortlisting, interviews and admissions criteria as well as information about their courses. It’s super important that you read these, before applying and before the interview (they may ask what you know about the course / why you chose that particular medical school).We Are Medics Instagram page – we provide heaps of free medical school application resources and guidance over on our Instagram! Available hereVirtual work experienceWork experience in the NHS isn't always possible to secure, especially during COVID-19. However, there are some fantastic virtual alternatives which are free!Brighton and Sussex Medical School Virtual Work ExperienceBrighton and Sussex Medical School have developed a free virtual work experience platform, designed to promote reflection and give you something to talk about in your interviews! Sign up hereRoyal Colleges of GPs Virtual Work ExperienceAspiring medics aged 16+ are required to develop an understanding of medicine when applying to medical school. Work experience is one way to gain insights into medicine, the RCGP have created another. Observe GP provides is a free, online interactive video platform providing insights into general practice. Available hereUCATYou can get a range of online resources and books for this. I would definitely recommend using online resources as these are most like the format of the UCAT.The official UCAT website – Their website has question banks and 4 official mock exams to give you an idea of what to expect on test day. Available hereThe UCAT app - Offers official UCAT practice questions that you can't find anywhere else. Available here (App store) or here (Google Play store)PassMedicine Question Bank – Question bank with over 3000 free UCAT questions. Available hereUltimate UCAT Guide - this free eBook has been created by the We Are Medics team. It features a 28 day revision plan using the above free resources, tons of strategic advice and a comprehensive approach to acing the UCAT exam. It is 56 pages long, over 13,000 words and has been written by 16 different medical students! All advice has been checked by an editor who scored 3050 in the UCAT and placed in the top 5%! The eBook is available to download for free hereUCAT Cheat Sheets - these sheets have been produced by Life of a Medic and they summarise key UCAT strategies. You can download them free hereUCAT YouTube videos - Journey2Med have created a 5 parts of series of YouTube videos with in-depth advice for each section. You can watch them on their YouTube channel herePersonal statementPerfect Your Medicine Personal Statement - this eBook provides all the information you need to ensure your personal statement is the best it can be. It has advice on how to structure your personal statement, how to demonstrate reflection, proof-reading tips, an example personal statement bank and more. It is 81 pages, over 22,000 words and has been written by 22 different medical students! Download a free copy here.BMAT:There are years and years worth of past papers available for BMAT, these are by far the best resource to familiarise yourself with the style of the exam.BMAT general information – information on timings for each section and about what to expect on test day: available hereBMAT past papers - all the past papers are available on the BMAT website . They come with answers and a few come with worked solutions. Available hereBMAT section 1 guide – provides information and worked examples of section 1. Available hereBMAT section 2 revision guide – is a free CGP revision guide that goes over all the content from KS4 Biology, Chemistry, Maths and Physics that you have to go over the BMAT. This is accessible once you have registered for the exam; you can login and access it via this link by clicking ‘access the guide’.Interviews:GMC guide for medical students, 'Achieving Good Medical Practice' – This is just a guide which the general medical council outlines expectations for medical students. You don’t have to read all of it or memorise it, it’s just useful to get an understanding of what the GMC expects from medical students. It would be impressive if you could refer back to it in an interview. Read it hereFree list of potential interview questions – some common interview questions that you can use for mock interview practice. These were written by the Royal College of Surgeons and are available hereMedscape – A website with lots of medical information and news – it’s useful for staying up to date with medical news stories. Available hereBBC Health News - A comprehensive news website covering the latest healthcare news in the UK and abroad. Topics are explained in an easy to understand way, and regular reading will keep you up to date with NHS 'hot topics'. Read it here.Medical Ethics by Tony Hope- this book is a short read and is really useful for understanding the basic principles of medical ethics and goes through common ethical dilemmas such as euthanasia and abortions, which may come up in interviews.Articles on NHS core principles and values - These articles cover the key ideas and core principles . I was asked about these in one of my interviews and it’s worth reading. Available hereJune Medical Applicant Challenge - this free eBook was originally designed as a challenge for aspiring medics to complete in June 2020. However, the content and activities are extremely useful for helping direct your super-curricular learning during interview preparation. Download your free copy here.Words by Anjitha Anilkumar and Kirsty Morrison"
year_published = 2020
year_updated = 2020
