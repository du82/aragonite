full_description = "Newsletter Our newsletter aims to support teachers, careers advisers, and parents of aspiring medical and dental students.At We Are Medics, we aim to provide applicants with an insight into life as both a healthcare student and practitioner, as well as advising on next steps to prepare for an application.Each month, you will receive a newsletter featuring our Application Spotlight, selected Top Tip Tuesdays, advice and resources, book recommendations, and important events in medicine and dentistry in the news to share with your young people. Most importantly, we’ll help you stay in the loop with new We Are Medics resources and activities.As a teacher or careers advisor, we highly encourage you to subscribe and share our monthly newsletter to your aspiring healthcare students! #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; width: 100%;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Subscribe * indicates required Email Address * Full Name * Please confirm the following: * I am a student I am a parent/guardian I am a teacher I am a careers advisor (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[3]='MMERGE3';ftypes[3]='dropdown';}(jQuery));var $mcj = jQuery.noConflict(true); We hope you enjoy our newsletters and do get back to us if you have any ideas of what you would like to see in them.Access previous newsletters here:May 4th 2021: Introducing ourselves, and focusing on organising work experienceMay 19th 2021: Reflecting on work experienceJune 1st 2021: June Medical Applicant ChallengeJuly 7th 2021: UCAT PrepAugust 3rd 2021: Personal statement + UCAT tipsSeptember 7th 2021: Strategic ApplicationOctober 6th 2021: Final UCAS Checks + What next?"
