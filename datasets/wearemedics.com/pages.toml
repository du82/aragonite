full_description = '''🤔 Where do we go from here? - September and Applying to Dentistry/Medicine By: Karishma Dewitt Hi again aspiring dentists (& medics)!! Hope you all have had a great summer and have taken some time to rest & reset ready for the next academic year. Today I’ll be taking a bit about what YOU can be 6 Sep 2021 • 2 min read Blog Series by Medical Applicants ✏️ COVID Passports - A Critical Appraisal By Sarayu Shankar - Year 12 Medicine Applicant Featured from our May Newsletter - "Medicine in the News" section. "I believe COVID Passports are being introduced to 6 Jul 2021 • 3 min read Dentistry 🦷 Additional Dentistry Application Resources These Instagram accounts have a lot of insightful thoughts about dentistry: * @iwanttobeadentist is a dental Instagram account with some free opportunities. Make sure to check the eligibility criteria and have a look at the link their bio! * @drraabihamaan is an excellent Dentistry Account run 19 May 2021 • 1 min read Dentistry 🦷 Fun facts about studying Dentistry in the UK 1. There are 14 undergraduate dental schools in the UK. 2. Dentistry courses usually last about 5 years, unless you choose to intercalate (study another course for 1 year in between). 3. Year group sizes are fairly tiny compared to medicine – usually around 75 24 Apr 2021 • 1 min read Work Experience 🚀 Virtual Work Experience Opportunities Here's a few virtual work experience opportunities currently running. We will continue to update this list as we come across more events. If you're helping run 24 Apr 2021 • 1 min read First Year First Year Truths: Lizzie's Blog Series #3 Hi my name is Lizzie and I’m a first year med student studying at the University of Lincoln. Time has flown since I last posted; we are in another 15 Mar 2021 • 3 min read Dentistry Consent in Dentistry: Part 3 (Consent in Children) Children In cases where children are unable to give consent or where the child is able to consent but refuses to do so, the law allows for proxy co