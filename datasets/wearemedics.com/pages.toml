["https://wearemedics.com/blog/5-things-aspiring-dentists-should-read-watch-listen-to-this-week"]
title = "5 Things Aspiring Dentists Should Read/ Watch/ Listen to This Week"
description = """
Hi everyone, my name is Karishma, I’m a 3rdYear Dental Student at UoB and here’s 5 things I think aspiring Dental Students should take a look at this week…

1.  A Collection of  7 videos produced by our very own Dental School

Listen to current students talk about"""
full_description = "Dentistry 5 Things Aspiring Dentists Should Read/ Watch/ Listen to This Week We Are Medics Read more posts by this author. We Are Medics 10 Apr 2020 • 3 min read Hi everyone, my name is Karishma, I’m a 3rdYear Dental Student at UoB and here’s 5 things I think aspiring Dental Students should take a look at this week…1. A Collection of 7 videos produced by our very own Dental SchoolListen to current students talk about their experiences studying Dentistry, these short videos are a great resource to look at and provide you with unique insight into what life at Dental School is really like.Many of my peers are involved in these discussions covering a range of topics:1. What is your top tip for anyone who wants to study Dental Surgery?2. What advice would you have given yourself when applying to Dentistry knowing what you know now?3. What has been the most rewarding part of studying your degree?4. Tour of Birmingham Dental Hospital and School of Dentistry.5. What made you choose Birmingham to study Dentistry?6. What has been the best part of studying Dental Surgery at Birmingham?7. What has been the worst part of studying BDS Dental Surgery at Birmingham?Although they appear to cover Birmingham Dental School specifically, the candid advice from students is an insightful resource and one I wish I could have had.2. Restricting Amalgam Use in Specific Patient Groups – Scottish Dental Clinical Effectiveness Programme (SDCEP) Guidance (Implementation Advice document)Amalgam, the controversial “metal” mercury containing filling material used by our profession…when I was applying to study Dentistry I honestly had no clear insight into the debate around amalgam usage in Dentistry, sure I had googled it several times, read countless articles/blogs/sources discussing its use BUT it was just an incoherent jumble in my mind.Don’t panic, you won’t be expected to be well versed it the material properties of amalgam (at this stage) or an expert on the topic by any means BUT… you should have a basic understanding of what it is and why it is such a topical material.It is slowly being phased out globally in line with the Global Minamata Convention, with some Dental Students/Dentist’s overseas never having used it and some UK Dental School’s no longer teaching you how to use it.The SCDEP are an invaluable source to refer to in your clinical years publishing guidance on a range of topics from things such as caries (decay) in children to antibiotic use.This is a fairly easy read and they have some handy leaflets for patients also.The British Dental Association (BDA) also have a page of information and links regarding amalgam if you want to read further…3. Oral Hygiene Tips – Scottish Dental Clinical Effectiveness Programme (SCEDP)Advice!! It’s just one of the many things that patients will come to you for.-This short video shows an interaction between a Dentist and patient where she provides him with advice about plaque removal as well as tips on brushing. It’s useful to see an interaction like this and just how effective clear communication can be.4. Oxford Handbook of Clinical Dentistry 6th edition– Laura Mitchell and David A. MitchellThis pocket guide covers a range of topics from communication and professionalism to preventive dentistry and some insight into the different dental specialities.Easy to read and concise information all in the palm of your hand.5. Delivering better oral health: an evidenced based toolkit for prevention by Public Health England (PHE)If you come to Birmingham Dental School this priceless document will be referenced countless times throughout your 5 years and even when you escape out into practice…and WHY NOT…It’s an easy but essential read covering guidance on a range of topics for the dental team directly from PHE (e.g. fluoride, healthy eating, smoking, alcohol use and oral health…)Don’t get too overwhelmed with the tables/graphs of guidance targeted towards dental professionals.Refer to the contents page and read information under any sections you find interesting to give you an overview of what preventive dentistry looks like.Thanks for making it this far down the page!Hope these sources start to point you in the right direction.Stay safe and stay home."
