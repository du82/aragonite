full_description = "Profile We're Azimuth, or just Azi; we're a swarm of black and orange fruit bats. We've become pretty good at pretending to be a fruit bat girl though, and that's how you'll generally see us. We write transformation stories, and pretty much anything goes. We're looked after by Nall, one or more feral pine martens who do most of the talking. They're a freelance magical familiar, full of mischief and occasionally helpful as well. Nall lives with their better half in a treehouse at the edge of Fairytale, and not far from the Forgotten City, a highly arboreal and naturalised city-state populated by critters big and small. Other than that, Nall's a writer and musician. We don't check the Weasyl inbox that often, but you'll find them as @nalldook on Twitter, @nall@dook.business on Mastodon/fediverse, or posting transformation content as @nallchange. Also on Telegram: if you'd like to get in touch this way, just ask. We're sometimes open for commissions! Keep an eye on our journal or on Nall's Twitter/Mastodon feeds for further details. Most recent: Sneplink Contact deviantArt nalldook Fur Affinity azimuth Patreon nall SoFurry nalldook Twitter nallchange Twitter nalldook Website https://nall.skunks.org.uk Latest Journal Tip jars, ideas on October 24, 2021 at 13:40:40 UTC Hi! I've updated my website to include Patreon and Ko-fi for tips, in case anyone was interested to do so. That's all available from https://nall.skunks.org.uk/ now ^^ Anything you might want to see as a possible perk for patrons/supporters? Let me know :3 View This Journal and 0 Comments Statistics Joined February 16, 2013 14025 Pageviews 89 Followers 33 Favorites Given 209 Favorites Received 69 Submissions 21 Journals 77 Following Connections View Friends of azi View Users azi is Following View Users who Follow azi Shouts Link Myoti on August 25, 2015 at 17:19:57 UTC Thanks for following! Link uropygid on February 8, 2014 at 00:24:09 UTC dook dook dook dook Link Proxer on January 25, 