full_description = '''Report Character Violation Type: Harassing content Tracing or plagiarism Rapidly flashing colors Incorrect content rating Perpetual incorrect tagging Low-quality photography Low-quality literature Spamming or flooding Meme or image macro Unacceptable screenshot Illegal content Photographic pornography Offensive content Misleading thumbnail Other (please comment) * This report type requires a comment Additional Comments: Send Report Cancel Name: Sunshine “Sunny” Craft Age: 1-and-a-half to 5-and-a-half Gender: Female Species: Dog (Cocker Spaniel/Golden Retriever Mix) Sunny is a Cocker Spaniel/Golden Retriever mix, and the one and only child of her single mother (Mother is the Cocker Spaniel). She is being raised in a household that practices Christianity alongside some elements of witchcraft/magic (ex. Tarot readings are a regular occurrence in the Craft household.) Sunny and her mother, Ms. Craft, moved into the house next to Amaryllis (AKA: Anna) and her family when Sunny was only 1-and-a-half. At that point, Anna was 3, but despite being in vastly different developmental stages (Anna being able to speak coherently, especially to those who were older, being the big difference as Sunny didn't say her first word til around 1-and-a-half + didn't speak very much til age 3), Anna and Sunny became very close. Whatever Anna does, Sunny wants to do. She's a very good influence developmentally in that sense lol 1-and-a-half At this age, Sunny knows how to say "Mama", "Anna", and "Bakey" (the name of her blue baby blanket). She will be diagnosed with autism (spoilers) the year following moving next to Anna and her family. At this age, she babbles and vocalizes a lot, but again, not a lot of spoken words and won't be considered verbal until she begins preschool at age 3 (the year before Anna goes to kindergarten). She is a very cute, sweet baby. Her favorite things include her blue baby blanket, Bakey, playing with Anna, chewing on everything (especially when she's not supposed to... It tastes better when it's forbidden ig), her mama, wearing long-sleeve t-shirts, and listening to music boxes. She does not like loud noises, naptime, and she isn't fond of the taste of fish. 3-and-a-half By this age, Sunny is in preschool and loves it! She and Anna are both enrolled at "Little Owls Academy" (in the 3's- 4's and Pre-K classrooms respectively). As stated previously, she is able to talk relatively well at this point thanks to therapy and Anna's encouragement/constantly talking to her in specific (as well as her mama and other loved ones of course). At this age, her favorite things include Penelope, her "Sunny-size" caterpillar stuffie given to her by Anna on Valentine's Day the year before, her BFF/neighbor Anna, her Mama, being babysat/watched by Anna's family, grilled cheese sandwiches (cheddar cheese specifically), picking flowers, her friends at preschool, and fingerpainting. Her main special interests at this age are collecting clothing/items with flowers/floral patterns, collecting things that are the color yellow or at least mainly yellow, watching Meet The Tiddlybubs (Teletubbies-coded show), and learning about bugs. She does not enjoy loud noises (and can't go to venues that are fun + louder than a typical classroom unless she has her headphones), naptime, having to transition from one activity to another (especially if it's extremely fun. And no, saying that the next activity might be "even more fun" doesn't do anything to make her feel better lol. It is something she's working on though). 5-and-a-half Sunny is in kindergarten now at the same school as Anna! (who is in 1st grade) A lot to learn, a lot to do, and a lot to explore this year!! They are both enrolled at Manatee Grove Elementary School. At this age, she loves her (now not exactly "Sunny-size") caterpillar stuffie, Penelope, her BFF & neighbor Anna, her mommy, being watched/babysat by Anna's family, reading picture books, arts & crafts, her friends at school, wearing anything with long sleeves (not in the summer obviously lol), and playing on the playground. Her special interests include watching/collecting movies on VHS & DVD, drawing elaborate "world maps" on big pieces of construction paper of her imaginary story worlds, and learning about bugs. She does not enjoy loud noises (and will sometimes have to take out her headphones in order to self-regulate), when she's teased about needing headphones, when she and/or others are treated unfairly, and being told she's "too little" to do activities (especially when Anna is allowed to do them lol). Character Information Views: 37 Comments: 1 Favorites: 2 Rating: General Tags adorable baby canine character character_sheet cute dog fursona girl kid kidcore puppy ref_sheet reference toddler Comments Link dollyprincessollie on February 16, 2025 at 06:19:35 UTC Oh she's so cute... (╥ ω ╥) I love her caterpillar toy!!'''
