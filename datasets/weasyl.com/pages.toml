ission to be finished unless I tell otherwise. It does take me a while to get supplies since I do need a ride to my supplier store/ shop online (only for certain colors of fur o fleece that I cannot find in my store). If you have a specific deadline, it must be discussed and I will work around things in order to get it done sooner. *I have the right to deny any commission if I find that it is not within my ability. *For sewn commissions, I hand sew everything. I do not like sewing machines at all and quite frankly with the pieces that I work on, a machine can't do them. *For sewn commissions on fursonas/oc characters, I would prefer having a clean ref. If you only have unclean refs that's perfectly fine too. *Feel free to ask for WIP pictures *More examples of items that I am selling are in my gallery so feel free to look if you so choose. Show More Hazel3 [Gallery] from £ 10.00 to £ 30.00 (Approx. $ 12.60 to $ 37.81) Types Available: Fullbody, Halfbody, Headshot, Icon Meep! Info will be right here! ^w^ Sho'''
