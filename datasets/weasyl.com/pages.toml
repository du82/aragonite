description = "Hi, my name's Clay! I draw digital art, often of the fat variety. I like cute and fluffy things in general. If a character is, I probably like them. If you think something on my profile is wordplay, you're probably right. If you ever want to chat, feel free! I'm on Telegram and Discord, with the sa…"
full_description = '''Profile Hi, my name's Clay! I draw digital art, often of the fat variety. I like cute and fluffy things in general. If a character is, I probably like them. If you think something on my profile is wordplay, you're probably right. If you ever want to chat, feel free! I'm on Telegram and Discord, with the same username as here! Most recent: Kalen Vee Contact Bluesky https://bsky.app/profile/mirrorhall-clay.neocities.org Bluesky (18+) https://bsky.app/profile/bigbellycat.bsky.social Discord Server https://discord.com/invite/DFByra2G8d My Site https://mirrorhall-clay.neocities.org/ Tumblr https://www.tumblr.com/mirrorhall-clay Tumblr (18+) https://www.tumblr.com/pizza-belly-cat Commissions Fullbody Unshaded $ 30.00 add Additional Characters (up to 3 more) from $ 20.00 to $ 60.00 add Shaded $ 15.00 Halfbody Unshaded $ 20.00 add Additional Characters (up to 3 more) from $ 15.00 to $ 45.00 add Shaded $ 10.00 Headshot Unshaded $ 10.00 add Additional Character (1 more only) $ 8.00 add Background $ 10.00 add Shaded $ 5.00 Reference Base (full front view, small back and tail views) $ 50.00 add Additional Full-Character View (up to 2) from $ 20.00 to $ 40.00 add Full Back View $ 10.00 By commissioning, you allow me to post the commissioned art on my socials and galleries (here, Itaku, Tumblr, Bluesky, and my Discord server) unless you request otherwise, tagging you where applicable. Payment is through PayPal only. I'll send an invoice at the start, and I won't move past a sketch until it is paid. Asking for modifications in the sketch phase is okay, changes you ask for after that are not guaranteed to be done if they're too drastic. I will not accept fetish/sexual commissions if you are under 18. Please be patient. I may not live in the same timezone as you, and I have a life outside of art. I may cancel the commission and refund you if you pester me about it too much (e.g. ask more than once daily several days in a row). Will draw: Furry OCs Pokémon OCs Weight Gain, Stuffing, Inflation Will not draw: Humans Genitalia Gore Many kinks; ask me if I'm okay with drawing what you want Underage characters in sexual scenarios (even "aged-up") To Commission: 1. Let me know what you'd like on Discord or Telegram; I am @MirrorHall_Clay on both! Please be descriptive; I don't want to disappoint you! 2. I'll let you know how much your piece will cost, how long your commission may take, and will ask for your PayPal email. Once that's in order, I'll send you an invoice. 3. As I work on the sketch, I'll keep you updated on it. It's here where you can ask for more changes. 4. After that's finished, you'll need to pay the invoice before I continue any further. 5. Once paid, I will begin lining, coloring and shading. I will still send updates, but fewer, as this combined step is fairly straightforward. 6. I'll send you the finished work! I'll ask if you're okay with me posting it, and ask for your socials to tag you. Statistics Joined March 15, 2024 481 Pageviews 3 Followers 118 Favorites Given 72 Favorites Received 61 Submissions 0 Journals 10 Following Connections View Friends of MirrorHall_Clay View Users MirrorHall_Clay is Following View Users who Follow MirrorHall_Clay Folders Fattytober 2024 2 Items Shouts'''
