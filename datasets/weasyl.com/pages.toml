full_description = '''Profile !magpie★anarchie! hey there, magpie here! i do art and make monsters. here's some stuff that may or may not be useful to know! about gender: nonspecific nonbinary pronouns: ei/eir/eirs/eirself. i am (we are) a PTSD system. sometimes i slip up and refer to myself as "we" instead of "i". some of my "ocs" are alters. so it's better that this is right here out in the open than having to rush an explanation in the moment, yknow? V: other than some weird word choices it shouldnt affect much. art i mostly do digital art! i'm quickest/most comfortable with animals and monsters but by no means is that all i can do! c: if you're interested in commissions, trades, or requests, lemme know and i'll see if i can work something out? i don't always have the energy to art for people, let alone myself (tfw disabilities) but hey, if it's something i can do, i'd love to give it a shot! words if i don't talk much please don't think you did something wrong or that i'm upset with you! i'm not great at wording things sometimes and i get overwhelmed. (tfw aforementioned disabilities) Featured: OBJECTION! Contact *nsk net (personal site) http://nskanetis.net/ DeviantArt Anarchisme Discord anarchasm Flight Rising user ID #4075 Fur Affinity Anarchies Steam aexxys YouTube JackalopeFrost Latest Journal Tag Blocking Questions on January 11, 2025 at 00:35:37 UTC hey, put this up on FA since they just put tag blocking up, but i figured i'd refresh my info here does anyone need anything i commonly post - or DON'T commonly post - blocked in tags, and what would you suggest i use if i don't already use that tag? things i don't really commonly post but am likely to post that possibly need blocking: fatal vore grimdark vore? i don't actually know what to call things like the ketucari images like NOT A DRAGON (i'm leaving this unlinked but it's findable in my gallery) - if you need this blocked past "fatal vore" and "grimdark" let me know if you have a tag suggestion LITERALLY WHATEVER THE FUCK YOU CALL BLUEBLOODS SHIT. do i just tag this bluebloods, do you know me well enough to block this. hard vore other gore gunplay/gun tf/idk just guns. if you need this tagged past "gunplay" and "gun" let me know. feral just like let me know if you need those tagged past the obvious and what to tag them with? and obviously if i missed anything, that too personally, i have synonyms of vomit, pregnancy, and superbowl set to block. i do not want to explain the superbowl, no. if you think i'm missing synonyms on those feel free to inform me but no pressure. i do not want to add every version of gregnant from the video so don't worry about linking that. thanks, have good View This Journal and 0 Comments Commissions EVERYTHING PER HOUR: $ 15.00 as a quick estimate: with most things typical to what you'd see in my gallery, lineart takes about an hour , and color can take an hour or two depending on complexity and shading ! i am comfortable with animals/monsters/pokemon/furries/etc humans fictional characters (exception: if the creator says not to sell works for the media, i won't , bc respecting their wishes is important yknow?) nsfw, most kinks character design, refsheets, etc i am NOT GREAT AT these but im willing to try! very detailed backgrounds extensive robotics (though i do like giving this a shot when possible!) i am NOT COMFORTABLE WITH noncon (dubcon may be ok situationally but i'm honestly probably not good at it) vomit, scat (phobias, sorry) nsfw mlp, nsfw undertale, nsfw su, nsfw skylanders, nsfw revecroir if you're interested, send me a message with what you're thinking of and we'll go from there! i take payment after finishing your art and will send you my paypal info when you confirm the art is okay! if you don't have a lot of $$$IRL CASH DOLLARS$$$ but you happen to be pretty wealthy in a game or petsite or something, ask me about alternate payment methods such as game currencies or ARPG genos. Statistics Joined May 19, 2015 9301 Pageviews 97 Followers 469 Favorites Given 1241 Favorites Received 967 Submissions 11 Journals 30 Following Connections View Friends of Anarchie View Users Anarchie is Following View Users who Follow Anarchie Folders For Friends 26 Items Rixixi 29 Items Mags 40 Items Shouts Link Hedgehodge on September 5, 2017 at 20:34:04 UTC Thanks. Link Anarchie on September 5, 2017 at 23:07:18 UTC eyyy no prob, i love your art a lot tbh! Link Hedgehodge on September 10, 2017 at 17:08:46 UTC !!! Link Hedgehodge on March 4, 2017 at 14:01:33 UTC >BB^J Link Hedgehodge on October 2, 2016 at 11:58:51 UTC thenc u Link Anarchie on October 2, 2016 at 18:50:39 UTC no prob! Link Maresy on April 15, 2016 at 16:35:08 UTC Thanks so much for the fave! Link Anarchie on April 15, 2016 at 18:10:31 UTC No problem at all, your work is really great!'''
