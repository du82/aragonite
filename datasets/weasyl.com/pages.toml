["https://weasyl.com/character/85394/ren-taxel"]
title = "René Taxel — Weasyl"
full_description = '''Report Character Violation Type: Harassing content Tracing or plagiarism Rapidly flashing colors Incorrect content rating Perpetual incorrect tagging Low-quality photography Low-quality literature Spamming or flooding Meme or image macro Unacceptable screenshot Illegal content Photographic pornography Offensive content Misleading thumbnail Other (please comment) * This report type requires a comment Additional Comments: Send Report Cancel Name: René Taxel Age: 21 Gender: Nonbinary Height: 4.3 m Weight: 260 kg Species: Naga René Taxel is, in their default form, a two-headed nonbinary naga with a mostly mint-green body and pink eyes. The repeating pattern on their back, tail and arms has three overlapping diamonds, each individual diamond alternating between blue and white (so one unit is white-blue-white, the next blue-white-blue, etc.) There is a blue diamond crossing the eyes to continue the pattern. A large sapphire choker adorns their short anthro neck. This choker can be slid up, forcing René's two heads and their supporting feral necks together like a zipper. In this single-headed form they have a third eye and can shoot beams opening portals to any imaginable place. This fusion is uncomfortable by the cacophony of thoughts packed into one brain, however, and the third eye has no eyelid, so René cannot sleep with the ring up. Furthermore, only their two-headed form can multitask (their brains constantly share information with each other – there is no split personality). René was once an ordinary female naga with separate blue and white diamonds, who came across a magical pool reversing the gender of any creature peering into it. She fell in love with her male reflection, so much that she took a dip to try and kiss him; the ensuing long bath fused her and the reflection into one creature, and erased the gender distinctions. The choker female René wore absorbed some of the magic of that pool, granting them the portal-opening ability. In early 2022, my last semester as an undergraduate at the National University of Singapore, I played board games on most Friday nights at one of its student clubs, and one of them was Betrayal at House on the Hill. One of its scenarios featured a two-headed ever-growing snake as its "traitor" or secret antagonist – the Worm Ouroboros – and having just made Tori Taxel and adopted Hearth I made a note to make another personal character out of it. Years passed and I got into my job and then Lean and bridge and riichi mahjong over furry art, but that wish to myself remained in my head. After seeing pictures of the nonbinary Fang from Goodbye Volcano High I decided to have the two-headed snake be nonbinary too. Finally, with the year of the snake coming, I put my mechanical pencil down and sketched René – named for two mathematicians, Descartes and Thom – and vectored them out. SVG here. Character Information Views: 45 Comments: 0 Favorites: 2 Rating: General Tags choker forked_tongue inkscape looking_at_you multi_head naga nonbinary smile snake two_heads vector'''
