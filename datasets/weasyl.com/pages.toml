commission, I'll message back letting you know :3 2. Send me your Paypal information (email is enough), and I'll send you an invoice for the initial payment over Paypal. 3. Once you pay the invoice, we're good to go! Once the commission is done, I'll send you a final invoice for any remaining payment (if there is any remaining payment). Once that's paid, you'll get the final version of your commission! <3 My commissions come with the following terms: - You are free to post the finished piece on any social site. - I am also free (but not required) to post the finished piece on any of my social sites. This is important as it allows me to share examples of my work with potential clients. If you would like to keep the piece private, let me know and we'll discuss a fee. - If you would like to use the piece commercially (in a stream/game/writing-commission) or edit it, let me know and we'll discuss an additional fee. Commercial commissions include source files (Krita/Blender) so that you can separate lines from colors, use transparencies, etc... - Finished pieces may NOT be used for the purposes of AI training, fine-tuning, or within a LoRA. - Finished pieces should never be mis-attributed (ie, don't claim that you drew the thing X3) If you have questions or an idea that the below details don't cover, feel free to send a message <3 Will Do / Won't Do❤★❤★❤★ The golden rule: When in doubt, ask! I won't be mad at you for asking whether or not I draw a particular scenario. The worst I'll say is 'no', so don't paralyze yourself worrying about whether the idea you have is within bounds <3 Things I WILL do: Topics: - Vore (obviously :3) - SFW/non-vore/general pieces - Oral, anal, and vaginal vore - Both willing and unwilling vore - Eager prey, predator/prey relationships, wholesome vore/sex/scenarios (both SFW and NSFW) - Fatal vore (see restrictions below) - Reformation, full-tour, safekeeping, regurgitation - Soul vore, permavore, sentient fat/disposal - Melty digestion, stomach acid and acid burns, crushing, drowning in stomach acid, painful deaths, general cruelty - Belching, (mild) farting - Cum, femcum, saliva, saliva strings, bodily fluids (see restrictions below) - Scared/crying/horrified prey - Disposal/bones (in stomach, poop, or regurgitated) - Scat (see restrictions below) - NSFW, sex, and sexualized situations (vaginal, oral, and anal sex, frotting, knotting, kissing, masturbation, etc) - Cunnilingus, anilingus (if ass is clean) - Rape/noncon/hypnosis - Cruel/teasy/casual/smug preds (see restrictions below) - UwU speak/teasing/cutsey preds - Bondage/restraining (prey or partners) - Sharing prey/couple vore - Mouth play, tongue play, sex with prey inside, using prey as sex toys - YCH/OC scenarios (please send a ref sheet or example pics <3) Body types, poses, and anatomy: - Both feral and anthropomorphic preds/prey - Furries, dragons, scalies - Smaller prey - Humanoid and animal genitalia - Internal views - Tentacles/Ovipositors - Hands/paws/wings - Dynamic/action poses - Mawshots - Butt shots and genital presentation (incl during disposal) Things I will NOT Do: - Underage characters (even if non-sexualized) - Loli - Human preds (see human prey below) - Non-stylized/excessive gore - Anything that comes across to me as racist, transphobic, or otherwise bigoted, or anything that feels problematic to me in any way. - Realistic depictions or advocacy for live-feeding (esp snakes and rodents) - Predators/prey eating or touching scat - Excessive non-stylized saliva or bodily fluids (realistic saliva grosses me out a lot) - Ingesting saliva in any scenario - Ingesting bodily fluids like cum/femcum in any form except for straight from the source ;3 - Drinking milk/breastfeeding - Excessive farting or over-excessive burping - Messy stomachs (remains of previous prey may be an exception) - Sweaty paws - Anything else that grosses me out Things I MIGHT do: Depending on my comfort with the scenario and whether I think that I can deliver a good piece. There are some subjects I have no issue drawing but that aren't my specialty. - Human prey (esp paired with monster preds/wolves) - role reversal - same size/smaller preds - Macro/micro - Herbavore preds - Paw worship - Urinating (inc marking) - Cock vore - Hyper - Hard vore (in rare situations) Notes on Saliva and Bodily Fluids: Real-life bodily fluids and substances gross me out a lot. I can separate between the two when I'm drawing, because I think of the fluids in my pictures more abstractly. Fluids are fine to request, but I may be more restrictive about how they're drawn or talked about and I may turn down requests that I think might make it hard for me to keep that abstraction, or refuse changes if a piece is straying to far into gross-out material for me. Take a look at my gallery to get a sense for the fluid styles and scenarios I typically do. Notes on Fatal and Cruel Vore: I draw a lot of cruel vore (and you should commission it X3c), but I do have hard-to-define areas and triggers that can make fatal/cruel vore unpalatable to me. When fatal vore crosses these lines it can get under my skin and I'm more likely to turn down a commission request. Overly-sympathetic fatal preds Preds trying to empathize or connect to prey that they're about to kill Prey being asked to understand or excuse predation Circle-of-life talk ("everybody's got to eat") Prey being forced to accept their fate or relax "It's complicated"/"Just a fact of life" talk When in doubt, if a prey is being killed, lean into it :3 Make the pred cruel. You are much less likely to gross me out with a monstrous pred than with a pred that you're trying to make empathetic or kind. Killing any sapient/intelligent creature for food isn't kind, so have fun with it X3 Be teasey, maximize the horror that the prey is feeling, let your predators enjoy themselves~ Remember the golden rule: if in doubt, just ask! I know that some of my hangups might not be intuitive, so if you have an idea you're not sure about it's OK to run it past me <3 Prices and Process Prices below may change in the future. When requesting a commission I will always let you know the current price beforehand so there aren't any surprises. Stream Sketches❤★❤★❤★ These sketches are drawn in a single session live on Piczel.tv and are designed to be cover creative scenarios and situations. Basically come up with an idea, vague or specific, before or during a stream, and we'll have some fun with it live <3 You do not need to be present in-stream to commission sketches, but if you are around during the stream you can give feedback at any point during the drawing process :3 Just remember that what I get done in the time limit is what I get done! $35: 60 minute stream sketch $50: 90 minute stream sketch (if your idea is more complicated or you'd like some additional polish). (Addon) $25: Include a (short) 1-hour horny/lewd description or accompanying story (Requires approval!). These will be written off-stream. You should request this addon when you request the sketch, but be aware that even if I approve the commission I may not approve the addon if it's not a piece I have any immediate writing ideas about. After stream completion I'll send you the full-resolution finished picture (usually within a day or two, resolution will be 3840x2160 pixels or below) via your preferred method of DM or email. Your finished picture can be posted on any social platform that you'd like. In most cases I'll also post a downsized version (~50% resolution) on some of my socials. Polished Work❤★❤★❤★ Polished pieces are full drawings taken from sketch to final deliverable over multiple sessions. Because of the time and energy involved in making a full sketch I am more selective in what topics that I draw. $30 per-hour: consultation, idea/style refinements, checkins $50 per-hour: drawing Additional charges might be incurred for rushed timelines, commercial use licenses, etc[/list] Expect pieces in this range to cost at least several hundred dollars depending on complexity. To help mitigate risk to both parties, I split polished commissions up into multiple deliverables. Stage 0: Send your commission request and any relevant details and I'll approve it. Once approved, send me your Paypal info and I'll create an invoice and send it over for $30, which will cover the initial consultation. Stage 1: Initial consultation. I'll spend a minimal amount of time clarifying what you'd like me to draw and going over any questions I have, possibly exchanging some thumbnails. During this stage I'll also provide an estimate of the amount of time I think it will take me to draw the piece. This is only an estimate! At the end of this process, you'll be responsible for paying 50% of the estimated cost. This payment is non-refundable! Stage 2: Rough sketches/posing. The first deliverable will be rough sketches of the subject so we can make sure we're on the same page about what I'm drawing. This will be a good opportunity to go refine the idea and nail down specifics. If the project changes in scope during this process, we may need to re-estimate the costs. Stage 3: Full drawing/checkins. I like to try to send a progress report on commissions roughly once a week telling you what I've been able to do and how many hours of drawing I've spent at each point. This means that you spend less time wondering what the status of a commission is, and there are generally less surprises all around with the finished piece. Stage 4: Final deliverable. Once we're both satisfied with final piece, I'll send you an invoice for the remaining cost. Once you pay it, I'll send you the final piece at full-resolution and half-resolution. If you're using the piece commercially or depending on what we discussed during the initial consultation, I'll also send you a Krita/Blender source file. Show More L James [Gallery] from $ 25.00 to $ 250.00 Types Available: Badge, Character Illustration, Ref Sheet, Telegram Sticker Discount