["https://weasyl.com/site-updates/159"]
title = "Site Update — Weasyl"
full_description = '''Temporary favorites glitch Posted by charmander July 27, 2021 at 22:37:32 UTC Hi everyone! New favorites on Weasyl were broken July 27th between 05:22 and 21:53 UTC – about 17 hours leading up to this announcement. They’re working again now, and the missing favorites will be restored soon, but feel free to refavorite anything from that period in the meantime if you’d like to have them counted right away. Apologies to those affected for the confusion/inconvenience. Temporary favorites glitch Posted by charmander July 27, 2021 at 22:37:32 UTC Hi everyone! New favorites on Weasyl were broken July 27th between 05:22 and 21:53 UTC – about 17 hours leading up to this announcement. They’re working again now, and the missing favorites will be restored soon, but feel free to refavorite anything from that period in the meantime if you’d like to have them counted right away. Apologies to those affected for the confusion/inconvenience. Comments Link Hazel3 on July 27, 2021 at 23:02:18 UTC it's fine, these things happen UwU Link ScaredStoked on July 28, 2021 at 00:03:38 UTC No worries! We understand~ Link Wilren on July 28, 2021 at 00:07:24 UTC Oops! (No worries, the fact that you're working on the error speaks volumes. ^_^ ) Link Uluri on July 28, 2021 at 00:09:06 UTC Oh? Well, Thank ya for fixing it. Link sweetheart1012 on July 28, 2021 at 00:55:56 UTC Thank you for informing us about the situation. I also really hope I can make friends here too. Link 1ndigoCat on July 28, 2021 at 01:16:53 UTC Thanks for solving the problem! Link The Pink Rose Of Texas on July 28, 2021 at 01:42:30 UTC All I can say is: "These things do happen." Thanks for the heads-up. Link keirajo on July 28, 2021 at 02:32:32 UTC No worries! Keep up the good work! :) Link Zenithell on July 28, 2021 at 02:52:38 UTC Things happen! Thank you for working on it! Link ferrodegaragem on July 28, 2021 at 03:07:04 UTC This stuff happens. Keep up the good work. Link Ghazghull Thraka on July 28, 2021 at 03:29:39 UTC Oh! I didn't even realize this was worth an update. Thanks for keeping us informed! Link charmander (admin) on July 28, 2021 at 04:40:23 UTC It’s probably not, so I’m also sorry for the unnecessary update! Unfortunately, finding out exactly who was affected is about as much work as restoring the favorites to begin with, so this was the only way to get the message out in a timely manner. Link Ghazghull Thraka on July 29, 2021 at 01:44:45 UTC Oh, don’t apologize! It’s much appreciated. Link AoiTheDragon on July 28, 2021 at 13:33:01 UTC Thanks for keeping us updated about this matter and for restoring it! I was actually a bit scared thinking if I was the only one or not. This cleared things up. <3 Link STrRedWolf on July 28, 2021 at 17:09:28 UTC Thanks for letting us know! Just notifying us saves a ton of support tickets. Link katie sandow on July 28, 2021 at 17:56:25 UTC Thanks Link BronzeHeart92 on July 31, 2021 at 20:09:51 UTC I see. Link Vivid on August 7, 2021 at 17:21:43 UTC I didn't really notice but thanks. Link BronzeHeart92 on August 11, 2021 at 05:56:36 UTC And now I spotted an another glitch if you wanna call it that. Whereas before the submit areas used to have this neat box behind, now it has disappeared for some reason. Can someone look into this matter? Link charmander (admin) on August 11, 2021 at 06:29:49 UTC You mean the tag lists? That was removed intentionally, because even though it looked nice, it broke some important features of text input boxes. Link BronzeHeart92 on August 11, 2021 at 15:35:48 UTC It's not about tags, it's the browse files button or however you wanna call it. The bluish rectangle behind them is gone now, making them look pretty amateurish as a result. Did something break on your end or something? Otherwise the site appears to be as same as always. Though for Edge/Chrome users, you probably should tweak the coding behind the input fields as to block those browsers from implemening unwanted focus rings just in case. Link charmander (admin) on August 11, 2021 at 23:37:00 UTC Oh, that was also removed intentionally for similar reasons. Link BronzeHeart92 on August 12, 2021 at 15:55:06 UTC Ok? Well, if you're gonna renovate the submission pages, why not go the whole way? I'm sure there's gonna be a big site upgrade coming soon anyways... Link QueenDanielle on August 13, 2021 at 23:03:18 UTC Keep up the good work thanks for fixing the issue Link Jewel Wildmoon on August 30, 2021 at 00:17:04 UTC It's understandable. These things happen. Keep up the good work ^^ Link superbanny on September 10, 2021 at 17:18:02 UTC thaks Link SailorSeiyaDigiGem on October 1, 2021 at 18:27:22 UTC How to hide favorite? Link charmander (admin) on October 1, 2021 at 20:46:16 UTC https://www.weasyl.com/control/editpreferences "Hide my favorites from other users" Link SailorSeiyaDigiGem on October 2, 2021 at 18:45:50 UTC Thanks! Link DevinTheTransgender on January 28, 2022 at 16:01:16 UTC I probably made an acc after this event, bc i don't remember this. Link Heartstorm4ever on September 24, 2022 at 19:45:05 UTC I don't know if you're aware, but there's a problem with "finalizing" the placement of an avatar. I already emailed support about it. I hope that I did the right thing. Link Avery-Sune on October 2, 2022 at 06:48:17 UTC Uh, yea, there's a new glitch in town! I'm trying to submit a new character but the image won't show! Link RyukyuShin1997 on October 20, 2022 at 17:26:55 UTC Think you guys could also fix the 502 errors when submitting images for characters or even finalizing avatars? Link TailBit on October 22, 2022 at 12:06:26 UTC Yes, the 502 error needs a fix, there is a whole month worth of characters that is without images atm Link Kayfabe on July 11, 2023 at 09:53:48 UTC will we ever get the option to delete our accounts? Link charmander (admin) on July 12, 2023 at 01:53:59 UTC Yep! As soon as I can get to it Link Eupeptic on July 28, 2023 at 02:18:44 UTC Yay, this news item is now two years old! 🎉 How about a new news post? For example, I see there's been a few UI changes in the past couple of weeks; maybe that would warrant a news post? Interest in Weasyl has risen again since mid-May 2023 for some reason <_< , so a new news post might help show that the lights are still on. :) Link charmander (admin) on July 28, 2023 at 12:47:04 UTC Soon! Just a few more UI changes first :D Link Menageriecat on July 28, 2023 at 07:09:38 UTC To add to the above: Will there be recruitment for new staff members? Recruitment for EVENT staff? The site looks abandoned, to be honest. There's no communication from staff, which is sad given the potential that lays here still. For instance, AI art is a big deal, as it's blatant theft. Artists obviously don't like it. Becoming an art site that outright bans AI art could be VERY appealing to artists, as it provides a safe haven. DA and Art Station destroyed their reputations by allowing it, and many people boycotted or left those sites. Becoming a safe haven and advertising that could be good for attracting users and boosting activity. Discord and Telegram chats can also draw users, and it promotes community growth. Of course, those require staff and bot savvy staff. Twitter is a lost cause. These are just suggestions. Doing a staff drive and creating external chats could really help the site. AI ban could be very attractive. There's been many people trying to find safe art sites to upload their work to and interact with, and theres only 2 of aware of. It's work, but beneficial for the community. Many edits, apologies. Link UnnamedDragon on February 27, 2024 at 10:37:26 UTC Seconding the above. ^ A new announcement, and a stance on AI art, would be appreciated. Also, there seems to be no ability to edit or add journal tags. Lastly, is there a way to send a support ticket on-site instead of email? (Keep the email option available, though, just in case.) Best wishes in 2024! Link charmander (admin) on March 2, 2024 at 07:49:30 UTC Hi! Are you referring to tagging other people’s journals? You should be able to edit tags on your own journals. We’re still accumulating things for the next announcement – an explicit AI policy is one of them, although it’s been considered to fall under the existing Tracing and Plagiarism and Character Generator Submissions so far. The only on-site support function is the Report button on submissions, characters, and journals. Link UnnamedDragon on March 5, 2024 at 06:15:04 UTC I discovered that Javascript has to be on to edit journal tags (as well as reply to comments made to me). Everything else works without it. My mistake. Glad to hear you're implementing an AI policy. I always considered character generators to be like the old Flash "dollmaker" games, but can see what you mean. It sort of fits, but AI has advanced a lot (and has consumed massive quantities of datasets) since people used it to create characters. Better to have a specific statement for clarity. Thankfully I haven't felt I've had to click the report button on anything I see in my feed, yet. I've probably missed stuff when it happened, due to time zones. Thanks for replying! Link tmdrake on May 9, 2024 at 07:28:30 UTC Ooops...people break things! Link Eupeptic on July 30, 2024 at 11:10:36 UTC Yay, this news item is now three years old! 🎉 Link CuteAdventures on September 4, 2024 at 15:43:49 UTC yippee! Link neononyxofficial on August 6, 2024 at 06:04:14 UTC Not sure if that happened to me but, the whoopsies happen Link Menageriecat on August 11, 2024 at 17:20:28 UTC Will there be any rule in place for AI uploads? There hasn't been a community post in three years, and with yet another FA shake up (this unfortunately due to Dragoneer's death), something would be a good idea to post. Link charmander (admin) on August 14, 2024 at 01:32:31 UTC There’s a more explicit section in the community guidelines now: https://www.weasyl.com/policy/community#ai-and-other-generated-content Link Menageriecat on August 15, 2024 at 09:15:18 UTC That's very disappointing to see another art site allowing AI content, considering said content is stolen from artists to generate it to begin with. Link charmander (admin) on August 16, 2024 at 00:30:45 UTC Sorry if I didn’t word it well, but the broad rule is that AI is not allowed on Weasyl (which is in line with how other tracing and plagiarism rules were already being enforced on AI posts). Link Menageriecat on August 16, 2024 at 00:42:59 UTC The rules literally say it's acceptable: AI and Other Generated Content: Any meaningful material generated by a process based on the work of people other than the creator of the overall piece – including that produced by “artificial intelligence” (e.g. language/image models) or character generators, but not including generative art where all algorithms and data involved are the poster’s original work... The rules they're subject to don't matter when you cannot police theft via AI content, and it's theft. The above paragraph explicitly states stealing from other artists is okay. Link charmander (admin) on August 16, 2024 at 02:09:52 UTC No, that’s not at all what it says. (And the part you quoted just defines a scope, omitting the actual rules that apply to it.) The reason there’s any wiggle room at all is that it’s very hard to define “AI” objectively without also including things that it doesn’t help anyone to ban (and that are impossible to detect anyway if someone wanted to lie about it), like content-aware fill in a patch of a photo background. As I’ve mentioned, the actual enforcement of the rules is that AI-generated posts aren’t allowed on Weasyl. Since you mention “explicitly states”, I’d also like to emphasize that all that this new rule “explicitly states” is additional requirements. It doesn’t allow anything that was already forbidden by other rules, particularly “Tracing and Plagiarism: You may incorporate the work of others into new works; however, the use of borrowed content must either abide by fair use or you must obtain permission from the copyright holder. The submission will be removed if it meets neither of these requirements. If it does meet these requirements, you must still cite the content’s source in the submission description.” For Weasyl’s purposes, incorporating AI output counts as incorporating the work of others, and if that output was derived from others’ art without permission, it’s plagiarism. Link Menageriecat on August 17, 2024 at 01:59:00 UTC I'm acutely aware i didnt include the rules, as i was citing a very specific section. I suggest rewording it in a way that less implies it's fair game to use whatever generator to rip off others work to use for their own purposes, as the way it reads now implies this, though again your response seems to endorse using generators. Incorporating the work of others from generators is theft. The likelihood a user will seek out the original artist to credit them is abysmally low. Link Sludger Slipfwysh on August 27, 2024 at 07:19:34 UTC Hey Weasyl, not sure having Popular being the largest front page gallery is the right move. There's a tremendous self-reinforcing feedback of image popularity, and the recently uploaded tab is only six images long if you happen to have the tab open at the bottom of the page. Qualitative results are not a level playing field for artists of varying skill and subject matter, it is less friendly to emerging artists and there are measurably fewer submissions of any quality appearing on the front page after the change. I've expanded on this just a little bit in my journal, along with some other site feedback. Thank you for your time. Link Hazel3 on August 27, 2024 at 08:12:56 UTC I totally agree, I feel this change could make it alot harder for smaller artists like myself to get our works out there more :< I really like this site though I feel it would be a good idea to reconsider this new change While I'm here I thought I might mention that it would be awesome if weasyl had community groups that can collect already uploaded art, aswell as being able use the groups to feature and decorate your profiles with. like deviantart groups and stamps combined ^w^ Link Calcimas on August 27, 2024 at 08:41:39 UTC I think community groups are a decent idea. Pixiv had (has?) something similar to what you mentioned. Link Hazel3 on August 27, 2024 at 23:03:57 UTC they sound like they'd be really cool to have! I also thought it would be awesome if weasyl's character feature had more to it aswell, like being able to link your gallery posts and collections to where that character was included in. I also think it'll be fun if users were able to comment and post as their characters, which is ideal for those who want to be a different sona, or for those who just enjoy roleplaying with ocs in general :3 Link Sludger Slipfwysh on August 27, 2024 at 11:39:56 UTC Ohhh shi likes this thought. I know Weasyl has had ambitions for community stuff simmering for a while, sub-community pro'''
