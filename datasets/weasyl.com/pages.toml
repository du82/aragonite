["https://weasyl.com/policy/community"]
title = "Community Guidelines — Weasyl"
full_description = '''I. General Upload Rules A. Right to Submit Weasyl respects the rights of artists with regard to the distribution of their original works; as such, there are two types of artwork that you may upload: artwork that you have created, and artwork that has been created by others for you. Original Content Submissions: If you are a creator of a particular work, whether you created it individually or in collaboration with others, you automatically hold the rights to its distribution. Content of this type belongs in your submissions gallery. Weasyl Collections Feature: Weasyl has a collections feature. The feature makes it possible for the original creator of a work to offer a submission to another Weasyl user, so that that work will appear in both galleries. The use of the collections feature is optional! If you have permission from the original creator and you do not wish to use the Weasyl collections feature, you are welcome to upload it to your own gallery, providing: the work has been created by someone else for you; or features you, your character(s), or intellectual property. Tracing and Plagiarism: You may incorporate the work of others into new works; however, the use of borrowed content must either abide by fair use or you must obtain permission from the copyright holder. The submission will be removed if it meets neither of these requirements. If it does meet these requirements, you must still cite the content’s source in the submission description. Proper Citation: If you are uploading a submission that was made for you by another person, you must cite the name of the original creator in the submission’s description. If the creator was an anonymous contributor, please state so in the description. Copyright and Trademark: The creator of the content of a submission holds the copyright and rights to its distribution; unless the content is trademarked by someone else, is considered harassment, or is otherwise a violation of Weasyl policy, the submission will not be removed. For further information, see our Copyright Policy. B. Rating and Describing Your Content Terminology A “Submission” is any artwork, story, comic page, still image, or animation that the user uploads to the site. “Content” refers to actions, poses, points of view or mise-en-scene involving characters (see below) in the submission. A “Character” is a drawn or described depiction of a conscious being (e.g., a furry, an anthropomorphized entity, an animal, a human, a robot, or any combination of these) in the submission. A “Juvenile” character (sometimes called a “cub”, “babyfur” or “kidfur”) is any character with recognizably humanoid body proportions of children or infants (see below). NOTE: Not to be confused with a “minor” (i.e., a user of the site who is under the real-life age of 18 and restricted to viewing General content). A “Rating”: All submissions must, at the time of upload, be assigned one of three ratings: General, Mature, or Explicit; content must be rated appropriately. What “Sexual Content” Is: Submissions may include sexually explicit content, either implied or explicit, if rated appropriately. For the purposes of this document, “sexually explicit content” is anything involving but not necessarily limited to: exposed or aroused genitalia, including genital bulges/”tents” or partial concealment of aroused genitals, frotting, masturbation with one character or any form of sexual intercourse between two or more characters, or the depiction or use of sex toys. Furthermore, characters in extremely provocative poses who are presenting their genital or perianal regions in a provocative manner can be sexual content, even if those genital regions are concealed. Hyper-enlarged genitals or breasts in any context are sexual content. Certain fetishes and kinks such as BDSM qualify as sexual or explicit content. The final decision of what constitutes “sexual content” or what is merely suggestive is determined by Weasyl’s moderators. Ratings This is a brief summary, however, please see the Ratings Guidelines for more detailed information. General Submissions rated “General” are appropriate for all audiences of all ages and may contain mild suggestive content but no full nudity, exposed nipples or genitals, or sexual acts. Certain non-sexual kinks and fetishes are rated General. Please see the Ratings Guidelines for more information. Mature (18+; NO sexually explicit content) Submissions rated “Mature” may contain imagery, themes or material that is not suitable for and will not be made available to minors. Mature content may not contain graphic depictions of sexual acts or aroused genitalia, but may depict nudity, and/or depict various non-overtly-sexual kinks or fetishes. Please see the Ratings Guidelines for more information. Explicit (18+; with explicit content) Submissions rated “Explicit” can contain graphic depictions of sexual content or sexual acts, and/or signs of sexual arousal, such as visibly erect genitalia or bodily fluids, or kinks/fetishes with a sexual component. This is also the rating for more extreme non-sexual content. Please see the Ratings Guidelines Tagging Weasyl’s tag system is an essential tool for users to find what they’re looking for, making it important for uploaders to add relevant tags to their work. When submitting artwork, we ask that you supply at least two tags that describe the submission. Proper tagging also benefits you as an uploader by helping to increase exposure to your work. Because it’s possible that an uploader might miss something, users have the ability to add additional tags to others’ works. Users found to be abusing this ability (e.g. adding harassing or irrelevant tags) may have their right to tag others’ works revoked. Likewise, uploaders removing relevant tags without good reason may be subject to moderation. Custom Thumbnails While using a portion of the actual submission is not required when creating its thumbnail, tricking users into viewing sexually explicit or otherwise unanticipated content by applying a misleading thumbnail is prohibited. Streaming Videos and streams that utilize the Streaming Now feature must represent a creative effort from the broadcaster. Only the artist who is streaming may promote the stream via the Streaming Now feature. Streams featuring movies, television shows, or other copyrighted content are prohibited from use of the Streaming Now feature. Critique The critique feature is for artists who are actively seeking artistic critique of their work. Users may utilize the Critique feature only for content created in part or in whole by them. Furthermore, the critique feature should only be used when the creator is actively seeking critique and improvement on the content flagged for critique. Items flagged for critique that the uploader did not create will have the flag removed. Abuse of this feature (e.g. using it for advertising purposes, on items made for you, or to otherwise keep items on the front page) will result in the removal of certain site privileges. C. Prohibited Upload Material Offensive Content: Submissions should avoid expressing bigoted or hateful material (e.g. racist, sexist, homophobic, etc.) to the extent possible without compromising the artistic integrity of the piece. Material that appears intended for the sole purpose of provoking hostile responses is not permitted. Young-Looking (“Juvenile”) Characters and Allowed Content Ratings: A character is considered a “Juvenile” by meeting at least one of these two criteria: They are expressly described in the submission as being under the age of 18 (e.g., in dialogue, the caption or description), or; They appear visibly prepubescent to any reasonable viewer; the character has multiple child-like or infant-like physical attributes (e.g., a low head-to-body ratio (4:1, 3:1), an undeveloped physique without secondary sexual characteristics, a short stature, stubby limbs, neotenic features, etc.). NOTE: “Chibi” style characters, who are adults with big heads and small bodies as part of a particular art style, are not considered “Juveniles.” Certain fantasy races with a childlike appearance (e.g. Lalafells) may qualify as juveniles at moderator discretion. Certain art styles can make it difficult to determine character age. WEASYL MODERATORS RETAIN THE RIGHT TO DETERMINE IF A CHARACTER IS CONSIDERED A “JUVENILE.” In the event of any disagreement, decisions of the Weasyl moderators are final. Any character not a juvenile is regarded as an adult. An adult character can become a juvenile (through some fictional means, e.g., physical regression by magic or super-science, etc.), in which case and from then on so long as they remain a juvenile, all Weasyl policies apply as with any other character. Similarly, a juvenile character can become an adult, in which case Weasyl policies apply as to any other adult character. No submission can contain both juveniles(s) and sexually explicit content, regardless of rating. In the event of a story or comic where an adult becomes a juvenile, or vice versa, any sexual content can only occur when the character is an adult. The scenes with sexual content and the scenes with juveniles(s) should be separated into different submissions (e.g., comic pages, story chapters) with different ratings. No submission can show visible genitalia of juveniles(s), aroused or not. Incidental nudity (e.g., running around without pants on) must not show genitalia. Naked butts are allowed as long as the character is not posing in a provocative or sexual manner. Juvenile characters can wear almost any clothes (see below), including diapers, underwear, etc., as long as their genitals are not revealed or visibly bulging. Many juvenile characters are depicted wearing and using diapers. Adult characters are also sometimes depicted in diapers in “ABDL” scenarios. Specific rules apply: If a diaper is clean, and no other content rules apply, the submission can be rated General. If any diaper is visibly wet or full (e.g., sagging, stained) or if the character is being changed, the submission should be rated Mature. If a diaper is leaking in any way, the submission should be rated Explicit. The same rules apply to both adult or juvenile characters in diapers. In any art of this type, the genitals of the juvenile should never be shown. Juvenile characters should not wear clothing typically associated with adult sexuality, (e.g., skimpy lingerie, BDSM harnesses or fetish material like rubber suits). Fursuits, or age-appropriate clothing for any gender, is allowed. Juvenile characters can be depicted in common restraints such as car seats, bouncers, etc., but not adult-type bondage restraints (e.g., BDSM gear, hoods, rope, suspension bondage, etc.). Photographs must not contain any inappropriately clothed minors regardless of the situation depicted. Seizure-Inducing Images: Do not upload any avatars, banners, profile images, or submissions that feature rapidly flashing lights, colors, or rapid movement, as this may induce seizures in some users. Avatars, Banners, and Profile Pictures: Do not upload an avatar, banner, or profile picture that is not suitable for all audiences, as such content is accessible to everyone. Duplicates/Similar Content Posting: It is prohibited to upload any exact duplicates or over three (3) submissions of considerable similarity, with no discernible or apparent difference between them. Similar submissions should be posted in collage format to save bandwidth and avoid flooding users’ inboxes with large amounts of similar submissions. This rule applies to character submissions and journals as well. AI and Other Generated Content: Any meaningful material generated by a process based on the work of people other than the creator of the overall piece – including that produced by “artificial intelligence” (e.g. language/image models) or character generators, but not including generative art where all algorithms and data involved are the poster’s original work – is subject to the following rules on Weasyl: Art posts (i.e. “submissions”) must not consist mainly of generated content. All use of generated content must be clearly indicated in the same post (in the case of a submission, journal, or character), comment (in the case of a comment), private message (in the case of a private message), or profile (in the case of profile text, an avatar, or a banner). Adoptables, Auction, and Raffle Reminders: It is acceptable to post reminder submissions, however any reminder may only be posted one time every 24 hours. There is no limit on the amount of individual auctions a user can have open at one time. Uploading a reminder, deleting it, and re-uploading it multiple times in 24 hours or less is considered a violation. In addition, any submission that falls under this rule must be tagged with "reminder". II. Category Specific Rules A. Visual Art Must not be improperly rotated, blurry, or show a portion of the scanner bed. Using pre-existing images and sprites for the purposes of a comic is allowed only with the use of stock images or with permission from the image creator. Art memes (such as questionnaires or "draw in the blank" submissions) are acceptable as long as the user completing them does so using original content that they created. Image macros (existing images to which a textual caption has been added) and (de)motivational posters are not permitted as submission uploads unless they contain imagery that was created by the user submitting them. Submissions that have been heavily referenced or contain material that does not belong to the submission's author (e.g free-to-use items such as stock images, or material for which permission has been granted for use) are permitted so long as the original sources are cited. However, stock images by themselves, with little or no original content, are not permitted. Submissions comprised primarily of words written in an image file are prohibited from visual art submissions, unless the arrangement of the text is important to the artistry of the piece. These items should be composed as literary submissions or journal entries. B. Photography Must not be excessively blurry, grainy, under- or overexposed (too dark or bright to discern anything), or rotated improperly, unless important to the artistry of the piece. Must not depict the use of illegal drugs, child abuse, animal abuse, human or animal injury or gore, bodily waste or fluids, or illegal acts or items. Stage makeup depicting blood and gore is permitted as long as it is stated as thus in the submission's description. Photographic art made with blood is permissible provided it is rated in the Mature or Explicit categories (exact category depends on the content, as per the Ratings Guidelines). Must not contain pornographic depictions of any sex acts. Must not feature exposed or clearly defined genitalia, or exposed mammaries with nipples or areolae, even if the image has been altered so as to obsc'''
