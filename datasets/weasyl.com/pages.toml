["https://weasyl.com/site-updates"]
title = "Site Updates — Weasyl"
full_description = "Temporary favorites glitch Hi everyone! New favorites on Weasyl were broken July 27th between 05:22 and 21:53 UTC – about 17 hours leading up to this announcement. They’re working again now, and the missing favorites will be restored soon, but feel free to refavorite anything from that period in the meantime if you’d like to… The secret testing version of Weasyl March 19th update: Thank you for testing, everyone! The main website has now been upgraded. We’ve been working on some wide-reaching changes to Weasyl and could use your help with one last round of testing! If you have a moment to log in, please try using https://testing.weasyl.com/ over the next w… Extra image space A summary of some minor changes since the last announcement: The file size limit for visual submissions is now 50 MB instead of 10 MB! There’s a more informative look for journal pages that includes dates and previews It’s now possible to follow people before getting verified Self-serve username changes In case you’ve been wanting to change your username on Weasyl, you can now do that without needing to e-mail support! It’s in the Preferences column of settings. https://www.weasyl.com/control/username This feature includes the benefit of keeping links to your old username working for as long as yo… Development resumes Hi and welcome to the first unofficial official announcement. Embedded content from Sketchfab, SoundCloud, Vimeo, and YouTube is tentatively working again. (Google Docs continues to work.) Sorry that it was broken for so long. We ended up working around the broken part instead of fixing it. Because… 502s, Spam and Staff Turnover Hi Everyone! I know this hasn't been updated in a while, so have some updates! First off, I'd like to announce that with some clever code updates, our devs have managed to make the intermittent 502 errors go away! This is a longstanding issue with the site, so it's nice to have that working. Second… March 9 Weasyl outage Greetings! SkylerBunny here from the development and operations team. Weasyl suffered an outage from March 9-10. The symptoms were variable and not immediately clear, but thanks to several members of our team (including Ikani, Hendikins, Charmander, and Kyra), collectively we identified the root ca…"
