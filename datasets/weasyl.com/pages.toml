["https://weasyl.com/help/ratings"]
title = "Content Ratings — Weasyl"
full_description = 'How Do I Rate Content I Submit? Content rating is determined on the existence and degree of six primary factors*: language, nudity, sexual situations, violence, drug use, and kinks/fetish content. The following outlines the acceptable criteria for each content rating: General Appropriate for all audiences of all ages. Mature Content that is not suitable for minors. May include non-sexual kink or fetish content, violence or profanity, as well as suggestive or implied sexuality, but excludes graphic depiction of sexual content or sexual acts, including depictions of sexual arousal. Explicit Content that is graphic or sexual in nature. This may contain dramatized sex acts or overt sexual situations or sexual arousal. This rating also covers “harder” fetish material such as vore, blood, scat, watersports (urination), and overflowing/leaky diapers. * Note: ratings do not differentiate amongst different characters’ species. We ask that you use your best judgement when rating your content. Please consider the intended audience and context of the content you submit. When in doubt please use a higher rating. Below is a detailed guideline for content rating criteria: General All Audiences Contains no mature or explicit content. Content must be suitable for audiences under 18. Language May contain mild use of mild expletives or profanity. Nudity May contain a compositional focus on sexualized anatomy (mammaries, buttocks, groin bulges, etc.) of clothed or partially clothed characters, or non-detailed nudity. Sexual Situations May contain mild implications of sexual activity or themes. This includes implied sexual acts, references, behavior, or the presence of mild sexual situations or discussion. Sexualized or erotic fashion is permissible as long as it does not meet the criteria for Explicit. Violence May contain mild violence or fantasy violence. May contain a small amount of imagery or situations that may be disturbing to sensitive viewers (e.g., depictions of disgusting or scary content in a horror or fantasy context). Violence depicted must not be gory or sexual in nature or heavily detailed/realistic. Drug Use May contain mild drug use or implied use, including excessive consumption of alcohol or tobacco. May include incidental or comedic use of drugs such as marijuana, sativa, hallucinogens or prescription drugs. Kinks/Fetishes Non-sexual kinks/fetishes such as babyfur/age regression, macro/micro, inflation, cartoon style transformations, and clean/dry diapers can be rated General. Content one might see on Cartoon Network is permitted in this rating. Mature (Non-Sexual 18+ Content) Audiences Over the Age of Eighteen Contains mature content of a non-sexual nature. Not suitable for minors. Restricted to viewers 18 and older. Language May contain persistent use of expletives, profanity, and coarse or vulgar language. Nudity Full nudity where context is educational, artistic, or for the purpose of documenting anatomy is permissible. "Full nudity" includes exposed genitalia and/or nipples or areolae on developed and/or postpubescent mammaries. It also includes prominent definition of the aforementioned body parts through clothing. Sexual Situations Equivalent to General. ANY SEXUALLY EXPLICIT CONTENT MUST BE CATEGORIZED IN THE EXPLICIT CATEGORY. Violence May contain intense/realistic and graphic violence. May also include imagery or situations that may be considered highly disturbing or repulsive to the average viewer, such as serious injury, disembowelment, dismemberment, and excessive blood. Drug Use May contain depictions of drug abuse and displays of drug paraphernalia. Kinks/Fetishes Most non-overtly-sexual kinks and fetishes are rated Mature, including wet/full diapers (not hyper or blowouts), vore, violent macro/crushing, light bondage, pregnancy, fat furs, breastfeeding, feral transformation, etc. A comprehensive list is impossible, but the rule of thumb is if there is no sexual stimulation directly depicted it is Mature. NOTE: For written works, explicit description of nudity must be rated Mature; graphic sexual content must be rated Explicit. NOTE: Photography cannot contain any nudity on Weasyl. Explicit Audiences Over the Age of Eighteen Contains explicit adult or sexual content. Not suitable for minors. Restricted to viewers 18 and older. Language Equivalent to Mature Nudity Equivalent to Mature Sexual Situations Anything involving but not necessarily limited to: exposed or aroused genitalia, including genital bulges/”tents” or partial concealment of aroused genitals, frotting, masturbation with one character or any form of sexual intercourse between two or more characters, or the depiction or use of sex toys. Furthermore, characters in provocative “pinup” poses who are presenting their genital or perianal regions in a provocative manner can be sexual content, even if those genital regions are concealed. Hyper-enlarged genitals or breasts in any context are sexual content. Certain fetishes and kinks such as BDSM can qualify as sexual content. The final decision of what constitutes “sexual content” or what is merely suggestive is determined by Weasyl’s moderators. Violence Equivalent to Mature Drug Use Equivalent to Mature Kinks/Fetishes Any “hard” kink or fetish is rated Explicit, including but not limited to: scat/watersports (urine or feces), including blowout/leaky diapers, vomit, breast milk, bondage and BDSM, hypnosis, extreme blood, gore, sexually-explicit transformation, diaper fetishism (with a sexual component), and other things not listed here. A comprehensive list is not possible, but the rule of thumb is if there is urination/defecation or explicit sexual activity involved, then it is rated Explicit. DISCLAIMER: Please note that all decisions on appropriate content ratings are subject to moderator discretion in conjunction with these guidelines.'
