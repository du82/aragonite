["https://www.weather.gov/news/091421-swag-members"]
title = "NOAA Announces Appointees to New Space Weather Advisory Group"
full_description = "September 14, 2021 -- NOAA is pleased to announce the appointment of 15 non-government members to the new Space Weather Advisory Group (SWAG). The SWAG was established by Public Law 116-181, the Promoting Research and Observations of Space Weather to Improve the Forecasting of Tomorrow Act of 2020, also known as the PROSWIFT Act. The members were chosen to provide a range of views that represent the span of the space weather community and end-user sectors. The SWAG will receive advice from the academic community, the commercial space weather sector, and nongovernmental space weather end-users to inform the National Science and Technology Council’s Space Weather Operations, Research, and Mitigation (SWORM) Interagency Working Group (IWG). The Chair of the SWAG, selected by the NOAA Administrator from one of the 15 members, will be announced within 30 days. “The government alone cannot manage all risks associated with space weather; we need a whole-of-community approach to effectively build a space-weather-resilient Nation,” said Ezinne Uzo-Okoro, Assistant Director of Space Policy, Office of Science Technology Policy at the White House and Co-Chair of the SWORM IWG. “The Space Weather Advisory Group represents an excellent cross-section of the space weather enterprise in this Nation. Leveraging their industry perspective will inevitably lead to more informed space weather policy.” By statute, the SWAG will advise the SWORM IWG on improving the ability of the United States to prepare for, mitigate, respond to, and recover from space weather storms. The SWAG will also advise on enhancing the transition of research to operations and operations to research; and developing and implementing an integrated space weather observation strategy. “Strong public-private collaborations must be established among the three components of the weather enterprise: Federal Government, industry, and academia in order to build the Nation’s resilience against severe space-weather events,” said Louis W. Uccellini, Ph.D., Director, National Weather Service and Co-Chair of the SWORM IWG. “These 15 individuals bring a wealth of industry, academic, and user perspectives and experience to the table that will help accomplish the goal of building a Space-Weather Ready Nation that we all are striving to achieve.”"
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "https://www.weather.gov/news/091421-swag-members"
