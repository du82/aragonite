["https://www.weather.gov/nwr"]
title = "NOAA Weather Radio"
full_description = '''function goBack() { if (document.referrer.toLowerCase().indexOf("weather.gov") != -1) { history.back(); } else { document.location.href = "https://www.weather.gov"; } } HOME FORECAST Local Graphical Aviation Marine Rivers and Lakes Hurricanes Severe Weather Fire Weather Sunrise/Sunset Long Range Forecasts Climate Prediction Space Weather PAST WEATHER Past Weather Heating/Cooling Days Monthly Temperatures Records Astronomical Data SAFETY Tsunamis Floods Beach Hazards Wildfire Cold Tornadoes Fog Air Quality Heat Hurricanes Lightning Safe Boating Rip Currents Thunderstorms Space Weather Sun (Ultraviolet Radiation) Wind Drought Winter Weather INFORMATION Wireless Emergency Alerts Brochures Weather-Ready Nation Cooperative Observers Daily Briefing Damage/Fatality/Injury Statistics Forecast Models GIS Data Portal NOAA Weather Radio Publications SKYWARN Storm Spotters StormReady TsunamiReady Service Change Notices EDUCATION Be A Force of Nature NWS Education Home NEWS NWS News Events Pubs/Brochures/Booklets NWS Media Contacts SEARCH Search For NWS All NOAA ABOUT About NWS Organization Strategic Plan For NWS Employees International National Centers Careers Contact Us Glossary Social Media NOAA WEATHER RADIO ALL HAZARDS NOAA Weather Radio All Hazards (NWR) is a nationwide network of radio stations broadcasting continuous weather information directly from the nearest National Weather Service office. NWR broadcasts official Weather Service warnings, watches, forecasts and other hazard information 24 hours a day, 7 days a week. Working with the Federal Communication Commission's (FCC) Emergency Alert System, NWR is an "All Hazards" radio network, making it your single source for comprehensive weather and emergency information. In conjunction with Federal, State, and Local Emergency Managers and other public officials, NWR also broadcasts warning and post-event information for all types of hazards – including natural (such as earthquakes or avalanches), environmental (such as chemical releases or oil spills), and public safety (such as AMBER alerts or 911 Telephone outages). Known as the "Voice of NOAA's National Weather Service," NWR is provided as a public service by the National Oceanic and Atmospheric Administration (NOAA), part of the Department of Commerce. NWR includes more than 1000 transmitters, covering all 50 states, adjacent coastal waters, Puerto Rico, the U.S. Virgin Islands, and the U.S. Pacific Territories. NWR requires a special radio receiver or scanner capable of picking up the signal. Broadcasts are found in the VHF public service band at these seven frequencies (MHz): 162.400 162.425 162.450 162.475 162.500 162.525 162.550 .display-none{display: none !important;} Special Notices Click on [+] to see more [-] to see less [+] "Beeping" on certain Midland receivers and the weekly test NOTE: If your Midland receiver is beeping, the following explanation is the most common, but it is not the ONLY explanation for a beeping receiver. The Midland WR-120 desktop NOAA weather radio knows it is supposed to receive a weekly test from the National Weather Service every seven days. If the radio goes for ten days without receiving a test, it gives out one beep every ten minutes. The radio will re-set itself at the next weekly test, or the next watch/warning issuance. If you do not want to wait, you can cancel the beeping by unplugging the radio from the wall, turning the radio over, and removing one battery. Wait approximately 10-15 seconds, then replace the battery and plug the radio back in. The settings on the radio will NOT be affected by this, as the SAME county code, and all other information is stored on a flash memory chip. But you WILL need to re-set the clock. To do so: 1) Push MENU. "SET TIME" appears. 2) Push SELECT. 3) Use the up/down arrows to adjust the hour up or down. To get from AM to PM, just continue past the hour 12. 4) Use the right button to move to the minutes setting. 5) Use the up/down arrows to adjust the minutes up or down. Right arrow to access both of the minute digits. 6) When you have set the clock to the proper time, hit MENU twice. The radio will display "SAVING". You are done setting the clock. We apologize for the inconvenience. The ten-day missed test alarm is a way to assure viewers that their weather radio is performing properly. NOTE: The previous version of this radio, the Midland WR-100 does not make an audible beep. However, it will display the words "CHECK RECEPTION" until it is re-set using the same steps as outlined above. Like the WR-120, the radio will automatically re-set itself at the next weekly test, or the next watch/warning issuance. [+] WWG43 Glenwood Springs, CO is out of service (2/19/2025) (2/19/2025) WWG43 Glenwood Springs, CO on frequency 162.425 is out of service due to an inoperable transmitter. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconvenience and thank you for your patience. [+] WXK81 Ulysses, KS is out of service (1/2/2025) (1/2/2025) WXK81 Ulysses, KS on frequency 162.450 is out of service due to relocation. Details of this transition are available in Service Change Notice 24-120. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconvenience and thank you for your patience. [+] WXK63 Shelbyville, TN is out of service (10/23/2024) (10/23/2024) WXK63 Shelbyville, TN on frequency 162.450 is currently out of service due to the site moving to a new location. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconven