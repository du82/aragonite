["https://www.weather.gov/news/012221-lake-charles-radar"]
title = "Lake Charles weather radar back online after Hurricane Laura damage"
full_description = "Lake Charles weather radar back online after Hurricane Laura damage Radar ready to track active weather, spring storms January 22, 2021 — Today, the National Weather Service restored service to the weather radar serving southwest Louisiana and northwest Gulf of America. Category 4 winds from Hurricane Laura significantly damaged the radar, making it inoperable on August 27, 2020. “Weather radar imagery is flowing again, feeding weather forecasts and warnings and bringing back important public safety infrastructure to our Lake Charles community,” said Roger Erickson, warning coordination meteorologist, Lake Charles Weather Forecast Office. “We are thankful to have the radar online before the peak of severe weather this spring.” The radar was restored in just five months, nearly two months ahead of schedule, at a cost of $1.65 million. Since September, contractors and technicians from the NEXRAD Radar Operations Center in Norman, Oklahoma, worked to repair and replace damaged radar parts. All of the equipment inside the radome, including the antenna and pedestal, were replaced, along with repairs to the tower, fence, and equipment shelters. These efforts included working 65 feet above ground with heavy equipment weighing more than 8,000 pounds. “Our team worked diligently to manage the entire restoration process, from the purchase of major components and contracting with specially trained crews, to deployment of our expert technicians to complete the installation and check-out of the system,” said Terrance Clark, Radar Operations Center director. “We are delighted the radar could return to service ahead of schedule, which is a testament to the hard work and expertise of our team and contractors working on this project.” Hurricane Laura was the most powerful hurricane to strike the U.S. in 2020. It made landfall near Cameron, Louisiana, as a Category 4 storm delivering winds up to 150 mph. Storm surge in excess of 15 feet caused heavy damage along the coast. The storm caused 42 deaths and was the most costly weather disaster in 2020 with more than $19 billion in losses."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
