["https://www.weather.gov/news/102723-sw-testbed"]
title = "NOAA hosts exercise on space weather threats to satellite operations"
full_description = "October 27, 2023 – Satellite orbital drag and energetic particles topped the list of space weather threats to low-Earth orbit satellites discussed at the Satellite Environment Testbed Exercise held in Boulder, Colorado this week. Space weather scientists, satellite owner-operators, tracking and maneuver service providers, and related commercial service providers gathered to better understand how satellite companies plan for and respond to space weather. During the three-day meeting, experts also assessed current space weather products and services for the satellite industry that are offered by NOAA’s Space Weather Prediction Center (SWPC) and other service providers. Space weather can disrupt satellites used for commercial communications, global positioning, Earth observation, and national security. Increased orbital drag caused by space weather reduces the lifespan of low-Earth orbit satellites and complicates space traffic coordination. One notable example occurred in February 2022, when space weather caused the loss of 38 Starlink satellites after launch. Besides the risk from enhanced drag with the increasing solar activity, energetic particles in the Radiation Belts or associated with solar storms could cause damage to electronic circuits and components in satellites. During the tabletop exercise, participants were handed a scenario modeled after a past Earth-directed Coronal Mass Ejection and discussed actions satellite operators may take and potential impacts on operations. “Identifying the quantitative impact of space weather on satellites due to the severe radiation environment and atmospheric density changes will help us prioritize tasks to improve our space weather models and design operational products that will better meet the needs of modern space commerce,” said Tzu-Wei Fang, Ph.D., testbed exercise co-organizer and space scientist at SWPC. Several satellite industry representatives voiced concerns about the economic losses they experienced due to space weather, including reduced satellite lifespan, launch costs for replacing satellites, and more frequent maneuvering for collision avoidance or for orbit maintenance. The biggest problem reported by many low-Earth orbit operators at the testbed is atmospheric drag, but their list of space weather concerns is long. SWPC and the satellite industry hope this testbed will lead to improved atmospheric drag and radiation environment modeling; improved space weather nowcasts, probabilistic forecasts and long term predictions; better event duration information; access to real-time data; and better archiving of model and observation data."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "https://www.weather.gov/news/102723-sw-testbed"
