["https://www.weather.gov/news/040522-SafePlaceSelfie"]
title = "Prepare for extreme weather and share your #SafePlaceSelfie"
full_description = "As we head into severe weather season, it’s that time of year to review family safety plans ahead of a local threat! Help the National Weather Service and its Weather-Ready Nation Ambassadors bring awareness to the importance of preparedness by participating in the sixth annual #SafePlaceSelfie Day on April 6, 2022. Extreme weather doesn’t stop for anyone, and it only takes one storm to devastate a community. That’s why it’s essential that you take the time to identify your “safe place” – a secure location that can keep you safe from a specific weather hazard. Some examples of safe places include storm shelters and basements, but if those options are not available, an interior room without windows can offer protection. FInding your safe place well before extreme weather threatens your area is one of the most essential preparedness actions that you can take. Want to go the extra mile? Take a look at the NWS Spring Safety Campaign for seasonal safety tips and share it far and wide. US Dept of Commerce National Oceanic and Atmospheric Administration National Weather Service News Around NOAA 1325 East West Highway Silver Spring, MD 20910 Comments? Questions? Please Contact Us."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "https://www.weather.gov/news/040522-SafePlaceSelfie"
