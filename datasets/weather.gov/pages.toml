["https://weather.gov/mso"]
title = "Missoula, MT"
description = "A low pressure circulation will move through the Great Basin on Thursday.  Impacts will be snow and blowing snow on Highways 28 and 93 in Idaho and Homestake Pass along Interstate 90 in Montana.  Expect northerly winds gusting to 30-40 mph on Thursday afternoon and evening throughout Lemhi County and the Highway 95 corridor in southwest Idaho County.  Gilmore Summit will be favored for snow accumulation, with about a 70% chance of receiving 3 inches or more by Thursday night."
