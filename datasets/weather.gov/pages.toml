["http://www.weather.gov/news/171417_wildfire"]
title = "WFO Los Angeles/Oxnard Provides Support to Emergency Managers Who Rescued 80 Children Trapped by Wildfire"
full_description = 'On Saturday, July 8, the Whittier Fire broke out in Santa Barbara County, California. That day, 80 children staying at the nearby Circle V Camp Ranch became trapped as fire blocked the road leading out of the camp. Whittier Fire Incident Commander Mark Von Tillow was able to send in a Forest Service employee to the camp, who kept the children calm and safe while aircraft dropped fire retardant around the perimeter to combat the flames. A Santa Barbara County Fire Department dozer was able to clear a path to the camp, and the children escaped. During the incident, the NWS Weather Forecast Office Los Angeles/Oxnard provided critical fire weather forecast information to help the local emergency managers conduct the operation as safely as possible. During the evening of the event the NWS provided several written forecasts focusing specifically on that fire, as well as being in verbal contact to provide updates. In addition to this event, the NWS provided another heads up to an approaching wind event 24 hours later, allowing the Los Padres National Forest to send a one-hour alert to the firefighters. The firefighters later reported that winds had been quite erratic during the event and how much they appreciated the heads up. "Thanks to all of the local Santa Barbara County emergency managers and first responders for their hard work managing the Whittier Fire and ensuring the safety of their citizens," said NWS Director Dr. Louis Uccellini. "The National Weather Service is proud to have been a partner in this effort, providing Impact-based Decision Support Services like spot forecasts and on-site meteorology support to protect lives during this devastating fire." US Dept of Commerce National Oceanic and Atmospheric Administration National Weather Service News Around NOAA 1325 East West Highway Silver Spring, MD 20910 Comments? Questions? Please Contact Us.'
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "http://www.weather.gov/news/171417_wildfire"
