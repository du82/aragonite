title = "Elko, NV"
description = "A storm system will continue to impact our area through Friday morning, bringing more rain and snow. Between 1-2 inches of snow and 0.1-0.25 inches of rain or liquid equivalent is forecast for lower elevation valleys. Between 2-5 inches of snow and 0.25-0.5 of rain or liquid equivalent is forecast for higher elevations, and 15 inches or more of snow is expected for the mountain ranges. Travel could be difficult during this morning's commute. Motorists should anticipate travel delays and allow extra time to reach their destination."
