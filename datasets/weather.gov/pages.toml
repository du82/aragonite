["http://www.weather.gov/radar_tab.php"]
title = "NWS Radar"
full_description = '''An official website of the United States government Answers to common questions on our FAQ and Glossary or contact us. Learn more about the National Weather Service mission and vision. Discover career opportunities at the National Weather Service. Legal Information Disclaimer Information Quality Privacy Policy Freedom of Information Act (FOIA) National Weather Service 1325 East West Highway, Silver Spring, MD 20910 The NWS Radar site displays the radar on a map along with forecast and alerts. The radar products are also available as OGC compliant services to use in your application. Enhanced Radar Standard Radar (Low-Bandwidth) Support Review the Radar FAQ for help with the transition to the new site. Contact the helpdesk for operational issues. Visit IDP-GIS web services for questions about geospatial services. Quick Guide This site is organized into views that provide relevant radar products and weather information for a common task or goal. Radar station products This view provides specific radar products for a selected radar station and storm based alerts. National radar mosaic This view combines radar station products into a single layer called a mosaic and storm based alerts. Weather for a location This view is similar to a radar application on a phone that provides radar, current weather, alerts and the forecast for a location. Recommended for bookmarks. Bookmarks The URL will automatically update as you select the view and settings. You may bookmark the URL to return later to the same view with the selected settings. For example, if you select "Weather for a location," then select a location, the bookmark will return to your location on your next visit. On mobile devices, you can save the bookmark as an easy-access icon similar to other apps. Please consult your device documentation for instructions. Search: NWS All NOAA Forecast Local Graphical Aviation Marine Rivers and Lakes Hurricanes Severe Weather Fire Weather Sun/Moon Long Range 