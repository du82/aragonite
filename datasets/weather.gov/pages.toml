["https://www.weather.gov/news/072021-air-quality-prediction"]
title = "NOAA Upgrades Key Air Quality Prediction Model"
full_description = "On July 20, NOAA’s Environmental Modeling Center (EMC) launched an upgrade to the Air Quality Model based on the Community Multiscale Air Quality Modeling System (CMAQ) to deliver improved air quality forecast guidance. NOAA, in partnership with the Environmental Protection Agency (EPA), issues daily air quality forecast guidance as part of a national Air Quality Forecasting Capability. The goal of the program is to provide ozone and particulate matter forecasts the public can use to limit the harmful health effects of poor air quality in the air we breathe. CMAQ (see-mak) is an active open-source development project led by EPA that consists of a suite of programs for conducting air quality model simulations. CMAQ combines current knowledge in atmospheric science and air quality modeling, with computing techniques and an open-source framework, and delivers estimates of ozone, particulates and pollutants. For the first time, NOAA’s air quality forecast guidance now extends from 48 hours out to 72 hours into the future and now improves the quality of predictions by incorporating scientific advances in chemistry modeling and inputs from the latest pollutant emission datasets. State and local agencies that provide localized air quality forecasts use NOAA’s predictions as guidance for their products and services. These state and local partners have been actively involved with the development and evaluation of the NOAA air quality model. This guidance, which extends out to three days, is particularly helpful for forecasting over weekends. “The NOAA air quality models have been an invaluable tool for the air quality forecasters across the country for many years and adding a day 3 forecast will be of great benefit to the forecasters. NOAA provides hourly air quality predictions to the public, and even makes them available in a GIS format,” said Michael Geigert, Senior Air Quality Meteorologist from the Connecticut Department of Energy and Environmental Protection."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
