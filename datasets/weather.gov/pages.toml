["https://weather.gov/news"]
title = "News Around NOAA"
full_description = "January 13, 2025 - New NOAA system ushers in next generation of hurricane modeling, forecasting National Hurricane Center saw improved forecast accuracy during 2024 Atlantic hurricane season December 20, 2024 - Holiday travels throughout the U.S. The 2024 holiday season features a rare occurrence of Christmas Day falling on the first day of Hanukkah - which could mean even more folks will be in the air and on the roads than usual. And this time of year, the weather can be downright frightful! December 16, 2024 - Get the science behind tsunamis A tsunami is a series of waves generated by a large and sudden displacement of the ocean. December 4, 2024 - 4 tips to keep you safe during a snow squall It’s that time of year to watch out for one of the most dangerous and underplayed winter hazards while on the road: Snow squalls. November 25, 2024 - Atlantic hurricane season races to finish within range of predicted number of named storms The 2024 Atlantic hurricane season, which officially ends on Nov. 30, showcased above-average activity, with a record-breaking ramp up following a peak-season lull. October 1, 2024 - National Weather Service revises watch, warning and advisory products for cold Hazard Simplification project seeks to simplify weather messaging September 26, 2024 - Update to U.S. precipitation frequency standards now accounts for climate trends NOAA seeks stakeholder feedback on Precipitation Atlas 15 pilot data before expanding nationwide September 25, 2024 - NOAA expands Flood Inundation Mapping to 30% of the U.S. population Mapping services improve flood communication with emergency managers and the public September 19, 2024 - Precipitation frequency estimates updated for Idaho, Montana and Wyoming NOAA Atlas 14 is the authoritative source for precipitation frequency information; used in flood risk management and infrastructure design September 6, 2024 - Fall safety: Prepare for wildfires and pending winter weather Fall may bring images of changing leaves, football games and pumpkin patches to mind, but as we prepare for these annual autumn favorites, it’s also time to prepare for potential weather hazards."
author = "US Department of Commerce, NOAA, National Weather Service"
