["http://www.weather.gov/news/183101_winter-storm"]
title = "Improved High-Resolution Models Support Accurate Forecast of a Very Rare Winter Storm"
full_description = "On January 3, 2018, a significant winter storm struck northeast Florida and southeast Georgia, an event that occurs once every 25-50 years…the last one occurred in 1989. A challenging forecast faced the staff at WFO Jacksonville, as some of the models were forecasting the event to occur. As this hasn’t happened in 30 years, there was no knowledge on model accuracy or bias in predicting such a rare event in Florida. In the past, models were notoriously bad in forecasting shallow-cold-air events. While the global models had problems predicting the event, higher-resolution options accurately predicted precipitation type and type-changeover. Despite the known NAM bias of over-predicting precipitation in cold air (it consistently showed 8-12 inches of snow in southeast Georgia), its precipitation type forecasts were accurate. As the event drew closer, the HRRR (and parallel HRRRx out to 36 hours) precisely forecast both precipitation type and amount. This supported accurate winter storm watches/warnings, and decisions not to include Jacksonville and Gainesville in them, despite the fear of past model handling of shallow cold air. The challenge to forecasters was whether or not to believe the higher-res model forecasts of such a rare event, particularly one coming out of the Gulf of America, a warm air source that makes winter storm events so rare. The accurate watches/warnings issued in advance, and DSS webinars for nearly 100 partners that focused as much on impact as weather, supported efforts to keep people off the roads. During state calls, Florida Highway Patrol officials noted the lack of accidents and injuries/fatalities on icy roads. As observed by SOO Pete Wolf, “the improvements in higher-resolution modeling were key to accurately warn of a high-impact event that probably would have been missed 10-15 years ago.” US Dept of Commerce National Oceanic and Atmospheric Administration National Weather Service News Around NOAA 1325 East West Highway Silver Spring, MD 20910 Comments? Questions? Please Contact Us."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "http://www.weather.gov/news/183101_winter-storm"
tags = ["accurate", "forecast", "high-resolution", "improved", "models", "rare", "storm", "support", "very", "winter"]
language = "en"
internal-references = ["none"]
external-references = ["alerts.weather.gov", "cdip.ucsd.edu", "climate.gov", "cpaess.ucar.edu", "digital.weather.gov", "emc.ncep.noaa.gov", "facebook.com", "fema.gov", "fly.faa.gov", "fs.fed.us", "ghs.guam.gov", "lightningsafety.noaa.gov", "manati.star.nesdis.noaa.gov", "mping.nssl.noaa.gov", "ntsb.gov", "oceanservice.noaa.gov", "polar.ncep.noaa.gov", "ready.gov", "tsunami.gov", "twitter.com"]

["https://www.weather.gov/news/072221-svr-wea"]
title = 'New "Destructive" Severe Thunderstorm Warning category to trigger Wireless Emergency Alerts on mobile phones'
full_description = "July 22, 2021 - Severe thunderstorms can be life-threatening, but not all severe storms are the same. Hazardous conditions range from tornadoes, large hail storms, and widespread straight-line winds called derechoes, to cloud-to-ground lightning and flash flooding. Starting August 2, the National Weather Service will better convey the severity and potential impacts from thunderstorm winds and hail by adding a “damage threat” tag to Severe Thunderstorm Warnings, similar to our Tornado and Flash Flood Warnings. We developed three categories of damage threat for Severe Thunderstorm Warnings. The categories, in order of highest to lowest damage threat, are destructive, considerable, and base. These tags and additional messaging are designed to promote immediate action, based on the threats. On average, only 10 percent of all severe thunderstorms reach the destructive category each year, nationwide. Most of these storms are damaging wind events such as derechoes and some of the larger, more intense thunderstorms, called “Supercell” storms that can typically produce very large hail in their path. The new destructive thunderstorm category conveys to the public urgent action is needed, a life-threatening event is occurring and may cause substantial damage to property. Storms categorized as destructive will trigger a WEA to your cell phone. All National Weather Service Severe Thunderstorm Warnings will continue to be issued and distributed via weather.gov, NOAA Weather Radio, Emergency Alert System and through dissemination systems to our emergency managers and partners. The addition of damage threat tags are part of the broader Hazard Simplification Project to improve communication of watches and warnings to the public. Thirteen of the 22 costliest weather disasters in 2020 were severe thunderstorms. The new “destructive” tag would have activated a Wireless Emergency Alert for many of these impactful events, including the costliest thunderstorm in U.S. history, the $11 billion derecho that affected Iowa in August 2020."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "https://www.weather.gov/news/072221-svr-wea"
