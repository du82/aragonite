["https://www.weather.gov/news/101722-jamie-rhome-cone"]
title = "The Tropical Cyclone Track Forecast Cone: A conversation with Jamie Rhome, acting director of the National Hurricane Center"
full_description = "Q: Post-Hurricane Ian, a lot of people are talking about the hurricane cone issued by the National Hurricane Center. First, what is its official name? A: Officially, it’s called the Tropical Cyclone Track Forecast Cone. Colloquially, it has been given all sorts of names such as “Cone of Uncertainty” and “Cone of Concern,” but these are not the official name and therein lies part of the communication and interpretation challenge. These unofficial titles might convey a message which doesn’t always align with the intended application of the Track Forecast Cone. Q: What is the Tropical Cyclone Track Forecast Cone meant to convey? A: The Track Forecast Cone simply communicates the most likely track of the center — or eye — of a tropical cyclone. The center of a tropical cyclone historically moves out of the cone about a third of the time.* The landfall location of Hurricane Ian’s center ultimately stayed within or on the edge of the cone throughout the forecast cycle. Ian was a particularly large system with impacts that extended well beyond the center, and hence well outside the cone. The way Ian approached Florida at an acute angle meant that relatively small changes in the track direction meant larger-than-normal changes in the landfall location. The Tropical Cyclone Track Forecast Cone for Hurricane Ian shows the most likely track of the center of the storm as it makes landfall in Cuba, Florida and South Carolina. NHC Acting Director, Jamie Rhome, warns communities in Hurricane Ian’s path of the life-threatening impacts: wind, storm surge, flooding, and tornadoes during one of numerous social media livestreams Q: Immediately after Hurricane Ian made landfall, the cone came under scrutiny, with many claiming that it might have confused people. You stayed out of the conversation until now. What drove that decision? A: It was premature, given the extreme suffering taking place in southwest Florida and the fact that our partners within emergency management were actively involved in search and rescue efforts. My goal is to help the conversation take place at the right time, in the right venue and in a productive way."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "https://www.weather.gov/news/101722-jamie-rhome-cone"
