["https://www.weather.gov/news/062422-wea-10yr"]
title = "National Weather Service celebrates 10th anniversary of life-saving Wireless Emergency Alerts"
full_description = "The first Wireless Emergency Alert (WEA) was sent on June 28, 2012, by the National Weather Service for a Flash Flood Warning near Santa Fe, New Mexico. Since then, the agency has activated 60,000 WEAs to warn the public about hazardous weather near them. WEAs are text-like messages accompanied by a series of loud tones sent to compatible cell phones by authorized government officials to alert individuals of an imminent threat to safety in their area. With cell phone usage on the rise – 97% of Americans own a cell phone, according to Pew Research – WEAs are reaching more people than ever, helping to keep them safe during an emergency. We connected with NWS Wireless Emergency Alert expert Mike Gerber to learn more about this powerful tool and what the future holds. In weather emergencies, warnings can save lives because they give people the information they need to take protective action. WEA has helped to get emergency weather information to people when and where they might otherwise not receive it. Using WEA, NWS can send a warning describing the hazard along with action people should take to their mobile phone when they are in harm's way. WEA does not require people to download an app or subscribe to a service. In short, WEAs have been a game changer in helping the NWS get warnings to people quickly, if they are located near a threat. Comparison of a Wireless Emergency Alert from 2012, the first year they were activated, and one from 2022. Over the past decade, the National Weather Service has improved WEA messages and format to better communicate weather warnings to the public. First, I want to recognize the important role played by the skilled and dedicated NWS forecasters across the country who issue the life-saving weather warnings that activate WEA. I’ve heard dozens of stories of lives saved and tragedies avoided as a result of WEAs; two events in the first and second year really stick out in my mind. The first was during the July 26, 2012 Elmira, New York, tornado that carved a 10 mile path and damaged 2,000 structures. Public safety officials initially expected fatalities, but amazingly there weren’t even any injuries. Through conversations with survivors from the event, many said that they received a Tornado Warning on their phone from WEA, a service they didn’t even know existed. They got the warning in time and immediately took shelter."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "https://www.weather.gov/news/062422-wea-10yr"
