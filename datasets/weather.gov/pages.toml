dvised to check the https://www.weather.gov/nwr/outages page for updates. We apologize for the inconvenience and thank you for your patience. [+] WWG36 Roswell, NM is out of service (9/6/2023) (9/6/2023) WWG36 Roswell, NM transmitter on frequency 162.450 MHz is out of service due to a telecommunication issue. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconvenience and thank you for your patience. [+] WWH35 Cooperstown, NY is out of service (7/31/2023) (7/31/2023) WWH35 Cooperstown, NY on frequency 162.450 is currently out of service due to the tower damage. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconvenience and thank you for your patience. [+] KXI79 Hillsboro, IL is out of service (5/19/2023) (5/19/2023) KXI79 Hillsboro, IL on frequency 162.425 is currently in the process of being moved to another location. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconvenience and thank you for your patience. [+] WWF37 Carlsbad, NM is out of service (2/11/2022) (02/11/2022) WWF37 Carlsbad, NM on the frequency 162.475 is out of service due to an inoperable transmitter. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconvenience and thank you for your patience. [+] WXN24 Artesia, NM is out of service (1/19/2022) (01/19/2022) WXN24 Artesia, NM on the frequency 162.425 is out of service due to a transmitter power issue. We do not have an estimated time for a return to normal service. Listeners are advised to check the NOAA Weather Radio County Coverage Listings for alternate transmitters serving their county. We apologize for the inconvenience and thank you for your patience. Report an Outage View Outages Find My Station NWR Stations that have either degraded performance or are currently offline. This information was current on: var xhr = $.ajax({ url: "/source/nwr/JS/CCL.js", success: function(response) { document.getElementById("current").innerHTML = xhr.getResponseHeader("Last-Modified"); } }); Legend DEGRADED - Indicates that a transmitter is operational but experiencing a temporary reduction in the quality of service such as coverage area, audio quality, etc. OUT OF SERVICE - Indicates transmitter is temporarily non operational due to problems such as a power outage, antenna damage, etc. NOAA Weather Radio All Hazards Coverage var map = L.map("map").setView([38.192778, -97.187778], 4); map.removeControl(map.zoomControl); map.touchZoom.disable(); map.doubleClickZoom.disable(); map.scrollWheelZoom.disable(); map.boxZoom.disable(); map.keyboard.disable(); var arrayOfLatLngs = []; // map.options.maxZoom = 11; // map.options.minZoom = 2; L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}').addTo(map); // custom icon var nwrIcon = L.Icon.extend({ options: { iconSize: [12, 15], iconAnchor: [0, 0], popupAnchor: [10, 0] } }); // Create icons for NWR transmitter status var greenIcon = new nwrIcon({ iconURL: '/images/nwr/mm_20_green.png' }); // Normal var redIcon = new nwrIcon({ iconUrl: '/images/nwr/mm_20_red.png' }); // Out of Service var yellowIcon = new nwrIcon({ iconUrl: '/images/nwr/mm_20_yellow.png' }); // Degraded function markers(lat, lon, icon, message, site) { L.marker([lat, lon], { icon: icon, title: site + "\nClick for information" }) .addTo(map) arrayOfLatLngs.push([lat, lon]); } function onMapClick(e) {