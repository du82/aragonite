["https://weather.gov/sju"]
title = "San Juan, PR"
description = """
[6 de marzo]
💧Los aguaceros de la tarde continuarán disipándose gradualmente y/o moviéndose hacia el mar. El flujo de viento del sur continuará dirigiendo las lluvias hacia las regiones sur y este esta noche.
⛵🏖️ Una marejada que se disipa resultará en condiciones marítimas mejoradas. El riesgo de corrientes marinas será moderado esta noche. Se pueden observar las condiciones actuales de las boyas  en caricoos.org.
🌡️Mínimas en los altos 50s y bajos 60s en elevaciones más altas de PR y en los bajos a medios 70s en las áreas costeras de las islas (localmente más bajas en algunas áreas de PR).
⏳Se pronostican condiciones más estables este fin de semana con el patrón diurno normal manteniéndose. Por otro lado, una marejada del noroeste deteriorará las condiciones marítimas y costeras.
||||||||[Mar 6th]
💧Afternoon showers will continue to gradually dissipate and/or move offshore. Southerly wind flow will continue to steer showers into southern and eastern regions tonight.  
⛵🏖️ A dissipating swell will result in improved marine conditions. The risk of rip currents will be up to moderate tonight. Current buoy conditions can be observed at caricoos.org. 
🌡️Lows in the upper 50s to low 60s at higher elevations of PR and in the low to mid 70s at coastal areas of the islands (locally lower in some areas of PR).
⏳More stable conditions are forecast this weekend with the normal diurnal pattern remaining. On the other hand, a northwesterly swell will deteriorate marine and coastal conditions."""
