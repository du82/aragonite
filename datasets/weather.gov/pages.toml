["https://www.weather.gov/news/051121-ken-graham"]
title = "Ken Graham guides nation through the historic 2020 hurricane season with steady hand"
full_description = "Editor’s Note: Ken Graham became the director of NOAA’s National Hurricane Center in 2018. He was recently recognized by the Partnership for Public Service as a finalist for the prestigious Service to America Medal for coordinating the national response to the most active hurricane season on record, during the coronavirus pandemic in 2020. For Ken Graham, 2020 was deeply personal. During the most active Atlantic hurricane season in 170 years of recorded history, he’d inform those in harm’s way of 11 landfalling U.S. tropical cyclones. That is a challenge unto itself. But it was also happening in the middle of the worst global pandemic in more than a century. As director of the National Hurricane Center, Graham knew what he had to do first: take care of his team. “You can always say you care about the mission but I look at this building, and I deeply care for the people in it,” he said. “We couldn’t lose this place, not in a season like that when people are counting on us.” So, with the 2020 hurricane season quickly approaching in the throes of the pandemic, Graham led the way early to protect his team. CDC guidelines were followed to have staff work at home in support of the on-site hurricane specialists to limit exposure to Covid-19. NHC’s Continuity of Operations Plan (COOP) was activated to issue marine forecasts from remote locations. Markings were placed on the floor to limit the spacing between people who were in the office, and masks were mandatory. Enhanced sanitation measures were put in effect. All-hands meetings, usually done in-person every few months, were conducted virtually several times each month. Graham admits they got to him. “I think there were three all-hands meetings I had water in my eyes when I told everyone I loved them,” he said. “I was telling people if you need something, call me anytime, and they did.” As the NHC staff rallied to adapt to this new work paradigm, many faced personal challenges, and Graham was there to support each and every one on his staff."
author = "US Department of Commerce, NOAA, National Weather Service"
year_published = 2025
clearnet = "https://www.weather.gov/news/051121-ken-graham"
