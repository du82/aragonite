title = "About Duke Law School | Duke University School of Law"
description = "The mission of Duke Law School is to advance knowledge and the rule of law through open, rigorous, and collaborative education and scholarly inquiry, and to help build and sustain a dynamic legal profession that embodies commitment to equal justice, ethical leadership, diversity of perspective and experience, public service, and the highest standards of client representation."
full_description = '''Banner About About Duke Law School Main Content Heading The mission of Duke Law School is to advance knowledge and the rule of law through open, rigorous, and collaborative education and scholarly inquiry, and to help build and sustain a dynamic legal profession that embodies commitment to equal justice, ethical leadership, diversity of perspective and experience, public service, and the highest standards of client representation. At Duke Law School, students and faculty experience and contribute to academic rigor in an interdisciplinary environment that supports and values creativity and innovation. Strategic investment in faculty, clinics, interdisciplinary centers, law journals and other student development opportunities, and in technology, as well as support for initiatives and opportunities to serve the public interest, ensure that the Law School remains on the cutting edge of legal scholarship, service, and education. These commitments are memorialized in the Duke Blueprint to LEAD, a set of principles for leadership growth that informs the development of committed, ethical lawyers, well-equipped for the 21st century. Heading Message from the Dean Content "At Duke Law School, we like to follow a set of values that we believe set us apart from other law schools, values that we have come to call 'The Duke Way.' The Duke Way is a combination of intellectual engagement at the highest level, extraordinary collaboration and collegiality, and a commitment to serving the common good. We take scholarship, service, professionalism, and teaching seriously, but we try not to take ourselves too seriously." Link Read about the Duke Way Heading Duke University Content Duke University has more than 17,000 students, more than half of them graduate students, and a world-class faculty helping to expand the frontiers of knowledge. Our students love being a part of this broad, vibrant community, and take advantage of all that it entails, from pursuing a interdisciplinary Bass Connections project, to joining the Graduate and Professional Student Council, to cheering on the Blue Devils basketball team. Link Explore Duke University Heading Durham: The Bull City Content The secret is out: Durham is a great place to live. It's easy to see why — natural beauty, low cost of living, big city amenities, accessibility to the coast and mountains, and great weather for most of the year. Link See why we love Durham In this section Administration Academic Affairs Academic Services Academic Technologies Administrative Services Admissions and Financial Aid Alumni & Development Career and Professional Development Center Clerkships Communications Dean's Office Diversity Initiatives Office Events International Studies Library Public Interest & Pro Bono Registrar Student Affairs Faculty & Staff Directory Facilities Consumer Information (ABA Required Disclosures) A History of Duke Law School Durham: The Bull City Visiting Duke Law Hotels & Accommodations Building Maps Rules & Policies In this section Administration Academic Affairs Academic Services Academic Technologies Administrative Services Admissions and Financial Aid Alumni & Development Career and Professional Development Center Clerkships Communications Dean's Office Diversity Initiatives Office Events International Studies Library Public Interest & Pro Bono Registrar Student Affairs Faculty & Staff Directory Facilities Consumer Information (ABA Required Disclosures) A History of Duke Law School Durham: The Bull City Visiting Duke Law Hotels & Accommodations Building Maps Rules & Policies Title Video Tour Content Take a tour through some of the Law School's places to study, learn, and relax. Student guides share advice as they highlight important Law School areas such as the J. Michael Goodson Law Library and the James M. Poyner Moot Courtroom.'''
