["https://web.mit.edu/building-a-better-world"]
title = "Better World | MIT - Massachusetts Institute of Technology"
description = "Scholarships and fellowships funded by our community open a world of opportunities to tomorrow’s changemakers. Professorships nurture research powerhouses and tap the potential of rising stars. Support for the evolution of the physical campus sets the stage for the next 100 years. Unrestricted funds contribute to the acceleration of MIT’s commitment to action on climate change and enable MIT to realize opportunities such as the redevelopment of Kendall Square into a new gateway to MIT."
full_description = "Home Better World Better World The generosity of MIT’s global community powers the education, research, and innovation at the heart of the Institute. Time and time again, our alumni and friends demonstrate their confidence in the talented people of MIT and their quest to invent, discover, and make a better world. Scholarships and fellowships funded by our community open a world of opportunities to tomorrow’s changemakers. Professorships nurture research powerhouses and tap the potential of rising stars. Support for the evolution of the physical campus sets the stage for the next 100 years. Unrestricted funds contribute to the acceleration of MIT’s commitment to action on climate change and enable MIT to realize opportunities such as the redevelopment of Kendall Square into a new gateway to MIT. Every contribution and each point of involvement—through volunteering, attending events, and more—enhances the Institute’s infinite potential. Make a gift Your browser does not support the video tag. Support MIT Our next great innovation begins with the support of our alumni and friends. Top Resources Give to MIT Explore the impact of the MIT Campaign for a Better World Volunteer MIT students enjoy a community celebration. Share in the MIT Experience Whether you are a student, a graduate, or just getting to know MIT, there are many ways to get involved. Top Resources Admissions Give to MIT Open Learning MIT Solve MIT Alumni Association Events at MIT Careers at MIT MIT is a powerful magnet for brilliant minds from around the globe."
