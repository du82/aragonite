["http://web.mit.edu/facilities/transportation/ridesharing.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "Sharing a ride to work or school can save you money, decrease wear and tear on your vehicle, and help preserve natural resources. MIT makes it even easier to share a ride by subsidizing several sustainable options. Please note that MIT does not reimburse for rideshare services like Lyft or Uber except in the case of an emergency. More info. Eligible Cambridge-based MIT employees and/or students who are daily-rate commuters and who are interested in forming a carpool together may request the carpool through MIT�s parking app. Carpool members pay a reduced parking fee and no annual fee for parking at MIT. For more information, see the MIT carpool FAQ. An MIT employee or student who occasionally needs a vehicle for short-term use can join Zipcar as a sustainable alternative. MIT hosts 12 Zipcars on campus and sponsors Zipcar memberships for staff and students. An MIT-sponsored member pays no application fee, no security deposit, and just a $35.00 annual fee. Zipcars can be used by the hour or the day. Insurance and gas are included in the hourly and daily rates. Please note that ZipCar adds an hourly/daily Young Driver Fee for drivers aged 18-24, and this fee is slightly higher for younger drivers (ages 18-20). Reserve online any time, pick up the car, and drive. To apply, just sign up for a Zipcar account online. Note that Zipcar is a private company and is not affiliated with MIT. MIT partners with Commute with Enterprise to offer a program that helps MIT employees share the commute in a vehicle provided by Enterprise. Vehicles are rented on a month-to-month basis, and the cost is split among participants. For eligible MIT employees, MIT provides a subsidy as well as a pre-tax payroll deduction benefit. MIT�s vanpool subsidy and pre-tax payroll deduction program is available to MIT employees only. Please note that the cost of parking the van is included in the monthly fee paid to Enterprise, and the monthly rideshare benefit cannot exceed the actual cost of the service."
year_published = 2025
clearnet = "http://web.mit.edu/facilities/transportation/ridesharing.html"
