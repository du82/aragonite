["https://web.mit.edu/mit-lockheed-Martin-seed-fund"]
title = "MIT-Lockheed Martin Seed Fund | MIT - Massachusetts Institute of Technology"
description = "Correcting the record on the MIT-Lockheed Martin Seed Fund Inaccurate assertions have been made regarding the MIT-Lockheed Martin Seed Fund, including claims that MIT elected to “cut ties” with Lockheed.  Following is information MIT has provided to media regarding a set of activities across a number of countries: Several seed funds supported by Lockheed Martin and established as part of the larger MIT Global Seed Fund program have either wound down or soon will."
full_description = "Home MIT-Lockheed Martin Seed Fund MIT-Lockheed Martin Seed Fund Correcting the record on the MIT-Lockheed Martin Seed Fund Inaccurate assertions have been made regarding the MIT-Lockheed Martin Seed Fund, including claims that MIT elected to “cut ties” with Lockheed. Following is information MIT has provided to media regarding a set of activities across a number of countries: Several seed funds supported by Lockheed Martin and established as part of the larger MIT Global Seed Fund program have either wound down or soon will. These seed fund programs have supported faculty collaborations and international experiences for students in various countries, including Germany, Israel, the Netherlands, Poland, and Switzerland. These programs have run for various one and two-year cycles beginning in 2019. Programs in Israel, the Netherlands, and Switzerland have completed their funding cycles and the funded work is now winding down. Those in Germany and Poland are in their final year. It was a Lockheed decision not to continue the seed funds for all of these country programs. We note that there remain engagements across MIT’s campus involving Lockheed and individual faculty and programs interested in connection."
year_published = 2025
clearnet = "https://web.mit.edu/mit-lockheed-Martin-seed-fund"
