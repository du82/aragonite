["http://web.mit.edu/facilities/employees.html"]
title = "MIT Facilities - For Facilities Employees Gateway Page"
full_description = 'Welcome to the Facilities Employees section of the Department of Facilities website. This portion includes links and information designed specifically for members of the department. As a result, unless you’re a member of the Facilities group at MIT, you won’t be able to go further. There’s still lots more to learn about Facilities though, so please visit other parts of the site. If you are a member of Facilities, you’ll need a personal MIT certificate in order to continue. You may already have a certificate; many people signed up for one in order to get a parking permit. However, if you don’t have a Personal MIT certificate, go to the Information Services Technology certificates page and click on "Get MIT Personal Certificate." It will ask you for your Kerberos name and password – that’s your username and the password you first used on your computer. You’ll also need your MIT ID number. When you start to move forward from this page, your web browser will ask for and examine your certificate to determine if you should be allowed to visit the website. As you move between these pages and other pages on the overall Facilities site, your browser may notify you that are going to or from a secure page. These notifications can be configured to appear less or more frequently depending on your personal preference. For help configuring this option, please submit a helpdesk request to the IT group. You should also submit a helpdesk request if you feel that you should be able to access these pages and experience any problems with them.'
