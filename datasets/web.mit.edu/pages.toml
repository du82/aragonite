["http://web.mit.edu/facilities/transportation/accessmit/index.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "Access MIT represents the Institute’s progressive vision for rethinking the culture of commuting and encouraging sustainable transportation practices. These programs provide commuters with the flexibility to choose, day-to-day, how they would like to commute, and encourage us all to utilize a variety of transportation options over the course of a given week. By connecting the MIT community to flexible, affordable, and low-carbon transportation options, we seek to ease parking demand while positively impacting our campus, community, and environment. The Access MIT pass is part of the Access MIT program. All benefits-eligible faculty, staff, and postdoctoral scholars on the Cambridge campus have free access to MBTA subway and local buses embedded right in your MIT ID card, giving you the flexibility to choose, day-to-day, how you would like to commute. Read about the T-pass program. If you received your MIT ID after June 2016, your ID already includes the CharlieCard chip. If you have an older ID, stop by the MIT Card Office in Building E17-106 between 8:00 AM and 5:00 PM, Monday through Friday, and we�ll upgrade your ID, so you can start enjoying free access to the MBTA subway and local bus systems. Find out how Access MIT ended up changing Bruce Gibbs� commute and boosting his quality of life (hint: 18 fewer traffic lights, more steps, and supper in Central Square). Phone: 617-258-6510 Phone (after hours): 617-253-2997 Fax: 617-258-6357 Email: mitparking@mit.edu Tom Giannino Manager Robynn Cruz-Walker Commuter Program Administrator"
