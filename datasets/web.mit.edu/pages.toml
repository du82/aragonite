["https://web.mit.edu/letter-regarding-events-csail"]
title = "Letter regarding events at CSAIL | MIT - Massachusetts Institute of Technology"
description = "To The Tech,   In a recent opinion published on November 7 regarding a research project at CSAIL, the authors argued for taking increasing action against the lab."
full_description = "Home Letter regarding events at CSAIL Letter regarding events at CSAIL To The Tech, In a recent opinion published on November 7 regarding a research project at CSAIL, the authors argued for taking increasing action against the lab. We want to be clear that recent student disruptions involving CSAIL have already crossed a line. We can agree or disagree on research or policies at MIT, but we cannot at any time accept individualized targeting of staff, students, and faculty that aims to intimidate them from carrying out their work and studies, or which makes them fearful for their security in their offices, labs and other activities. This has happened in this case and in other instances, and is not acceptable. Accordingly, students involved in these types of activities have been referred to the Committee on Discipline. As President Kornbluth stated last spring, “In an open academic community, it is certainly acceptable to ask questions about someone’s research and funding sources. But that should never rise to the level of intimidation or harassment.” It's important to make clear that the project at CSAIL was approved in accordance with US law and MIT policy. As with all research on our campus, the project involves work that is open and publishable, with the results available to investigators everywhere and not only in a particular country or countries. The opinion article suggests that this work is proprietary and conducted for a specific use, which is simply untrue. In fact, the grant supports work focused on a coreset compression algorithm that can improve robotics in a wide array of fields. This is fundamental research that has many applications, as is typical of much of the technical research carried out by our PIs and students. In this respect, it is just one reflection of MIT’s ongoing contribution to the world of knowledge. Even when they feel strongly about an issue, we expect our students, and all community members, to treat each other and those around them with decency. Sincerely, Cynthia Barnhart, Provost Melissa Nobles, Chancellor"
year_published = 2025
clearnet = "https://web.mit.edu/letter-regarding-events-csail"
