["http://web.mit.edu/facilities/about/index.html"]
title = "MIT Facilities - About Us"
full_description = "The MIT Department of Facilities creates, cares for, and powers MIT�s physical environment. As stewards of the campus, we build, maintain, and optimize its structures and grounds, implementing high-performance solutions to maximize campus sustainability. We also provide the utilities and services necessary to advance the educational and research activities of the Institute. The goal of our more than 800 employees is to provide a safe, well-functioning, and welcoming campus for the people who visit, study, work, and live within the MIT community. The Department of Facilities is part of the Office of the Vice President for Campus Services and Stewardship. Read more about the Office of the VPCSS. Campus Construction manages the construction, renovation, and renewal of MIT�s buildings, addressing the needs of our faculty, students, and staff while also enhancing sustainability. In consultation with academic and administrative leadership, Campus Construction identifies goals and manages projects ranging from complete new buildings and major renewals of existing buildings to redesigns and renovations of labs, departments, and other complex spaces. The team oversees a capital renewal effort that will improve the physical campus for years to come. The Facilities Operations group consists of Campus Services & Maintenance, Engineering & Energy Management, Facilities EHS, and Utilities. As a whole, the group provides repair and maintenance services to all MIT buildings and facilities, on-campus engineering guidance and services for sustainable building systems, campus safety compliance services, and the management of all campus electricity, heating, and cooling resources. The Parking & Transportation Office, also a part of this group, develops and manages commuter service programs and shuttle programs for MIT�s 20,000+ faculty, students, and staff. The teams in the Finance & Administration group crunch the numbers and manage the processes and systems that enable the department to function efficiently and effectively. These teams include Applications & Information Technology Services; Business Systems, Reporting & Analytics; Capital Budgeting & Analysis; Finance & Accounting; and Procurement, Contracts & Vendor Management."
