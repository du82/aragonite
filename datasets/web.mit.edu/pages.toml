["http://web.mit.edu/research"]
title = "Research | MIT - Massachusetts Institute of Technology"
description = "Research flourishes in our 30 departments across five schools and one college, as well as in dozens of centers, labs, and programs that convene experts across disciplines to explore new intellectual frontiers and solve important societal problems."
full_description = "Home Research Research At MIT, pushing the boundaries of knowledge and possibility is our joyful obsession, and we celebrate fundamental discoveries and practical applications alike. As educators, we also value research as a potent form of learning by doing. Research flourishes in our 30 departments across five schools and one college, as well as in dozens of centers, labs, and programs that convene experts across disciplines to explore new intellectual frontiers and solve important societal problems. Our on-campus research capabilities are enhanced through the work of MIT Lincoln Laboratory, the Woods Hole Oceanographic Institution, active research relationships with industry, and a wide range of global collaborations. Your browser does not support the video tag. Centers, Labs & Programs MIT continually develops organizations and partnerships that foster interdisciplinary work. Listed here are just some of the MIT labs, centers, and programs where groundbreaking research is happening every day. View Centers, Labs & Programs MIT researchers have devised a miniaturized system that can deliver tiny quantities of medicine to brain regions as small as 1 cubic millimeter. Collaborating Institutions MIT researchers collaborate with many leading local, national, and international organizations to further drive exploration. View Collaborating Institutions Researchers from MIT and the Charles Stark Draper Laboratory are developing a new space boot with built-in sensors and tiny “haptic” motors, whose vibrations can guide the wearer around or over obstacles. Conducting research in a biological engineering lab A system from CSAIL uses EEG brain signals to detect if a person notices robots making an error. This student, an Olympic medalist, is developing a device that more precisely measures the curvatures of the blades used for speedskates. Recent faculty research topics in mechanical engineering include pattern formation, fluid dynamics, and soft condensed matter. Ion accelerators play a strong role in magnetic fusion energy research. MIT students have research interests that extend beyond the lab. MIT researchers have developed a new way to image proteins and RNA inside neurons of intact brain tissue. A graduate student works on robotic systems that are tasked with removing items from bins and placing them into boxes. prev next"
