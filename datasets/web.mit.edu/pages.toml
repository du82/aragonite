["http://web.mit.edu/facilities/index.html"]
title = "MIT Facilities Home"
full_description = '''Facilities staff are always here supporting the Institute. Twenty four hours a day, seven days a week. Through rain and especially snow, our staff carries on so that the MIT community can move forward. Whether we’re repairing aging systems or breaking ground on a new research building, our staff solve problems and keep the Institute working. On these web pages you’ll find forms to order our services, learn what you can recycle and how construction will impact your commute. Speaking of commuting, there’s also information on alternatives on getting to work. So, go ahead and click on our pages! Capital Projects at MIT The continuous renewal and renovation of MIT�s physical facilities is an essential component of the Institute's mission to advance knowledge and educate students. Visit the Capital Projects site for project updates as we continue shaping the future of our campus and the innovation district nearby. "All-lots" parking access through January Through Sunday, February 2, 2025, parking account holders will be granted all-lots access. View the complete set of rules and regulations for this program on our parking page.'''
