["http://web.mit.edu"]
title = "MIT - Massachusetts Institute of Technology"
description = "Via @mitsloanadmissions on Instagram: “‘Everything feels possible here … the MIT ecosystem is amazing.’ Since coming to MIT Sloan, Benedetta Magni, MFin ’25, has fully embraced the exploratory spirit embedded into the Institute’s DNA.”"
full_description = "Spotlight: Mar 2, 2025 New research may help to protect cancer patients from the side effects of radiation therapy. Inspired by the tardigrade, a tiny organism that can withstand huge amounts of radiation, engineers developed a strategy for protecting healthy tissue from DNA damage. Mar 2, 2025 Full story Share: Twitter Facebook Menu Explore websites, people, and locations Look up people by “last name sounds like” What are you looking for? See More Results Suggestions or feedback? MIT's response to government activity: Read the latest about government activity affecting MIT. Updates from campus: Read the latest from MIT and its leaders regarding events on campus. Spotlight: Mar 2, 2025 New research may help to protect cancer patients from the side effects of radiation therapy. Inspired by the tardigrade, a tiny organism that can withstand huge amounts of radiation, engineers developed a strategy for protecting healthy tissue from DNA damage. Mar 2, 2025 Full story Share: Twitter Facebook MORE FROM THE MIT COMMUNITY #THISISMIT Via @mitsloanadmissions on Instagram: “‘Everything feels possible here … the MIT ecosystem is amazing.’ Since coming to MIT Sloan, Benedetta Magni, MFin ’25, has fully embraced the exploratory spirit embedded into the Institute’s DNA.” AROUND CAMPUS For the fifth time in the history of the annual William Lowell Putnam Mathematical Competition, and for the fifth year in a row, MIT swept all five of the contest’s top spots. RESEARCH A new framework helps rail system operators or other planners identify joint infrastructure projects to collaborate on with other firms. The tool can tell an operator how much to invest, when to collaborate, and how to distribute the shared profits. MIT INNOVATORS Engineers developed a programmable computer in the form of a single elastic fiber that can be sewn into a garment. Base-layer clothing with these fiber computers is being tested in the Arctic to monitor U.S. service members’ health and safety in extreme environments. LISTEN In the latest episode of the Curiosity Unbounded podcast, President Sally Kornbluth asks Brent Minchew to describe how he went from being a 17-year-old U.S. Marine to a geophysicist studying glaciers and their impact on ocean levels. COMMUNITY SPOTLIGHT Stefani Spranger wants to discover why some cancers, like lung and ovarian cancer, don’t respond well to immunotherapy. “We’re working on understanding what exactly the problem is, and then collaborating with engineers to find a good solution,” she says."
