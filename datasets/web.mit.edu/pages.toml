["https://web.mit.edu/updates-from-campus"]
title = "Updates from campus | MIT - Massachusetts Institute of Technology"
description = "Latest updates | Quick links | Archive “We need a community where we can all express our views. But we also need MIT to be a place where we all feel safe and free to live, work, and study.” — President Sally Kornbluth"
full_description = "Home Updates from campus Updates from campus Updates on campus and community from MIT Latest updates | Quick links | Archive “We need a community where we can all express our views. But we also need MIT to be a place where we all feel safe and free to live, work, and study.” — President Sally Kornbluth Since October 7, 2023, when Hamas terrorists attacked Israeli civilians and more than 240 hostages were taken, an ongoing war between Israel and Hamas and the ensuing humanitarian suffering have drawn members of communities — including university campuses and including MIT — into serious tension with one another. This page was first published in fall 2023. Updates regarding recent events on campus and sharing relevant policies can be found here. Latest updates CAFCE commentary on free expression December 11, 2024 MIT’s Committee on Academic Freedom and Campus Expression issued a statement on an essay that appeared in a student publication earlier this fall. CAFCE is a faculty-led committee charged by the president and chair of the faculty to “establish a healthy foundation for academic freedom, civility, and the inclusion of a diversity of voices on campus.” Letter regarding vandalism on campus December 6, 2024 President Sally Kornbluth sent a letter to the MIT community after posters and spraypainted messages were found in multiple locations on campus. Letter regarding events at CSAIL November 13, 2024 On Friday of last week, a letter to the editor from Provost Cynthia Barnhart and Chancellor Melissa Nobles was sent to the MIT student newspaper The Tech, addressing an opinion piece published last Thursday and speaking to recent events at CSAIL. Because the next issue does not appear for more than a week, it can be read here. Correcting the record on MIT and Lockheed Martin September 16, 2024 MIT addressed inaccurate assertions regarding the MIT-Lockheed Martin Seed Fund. Letter regarding guidelines for a new year August 29, 2024 Members of MIT’s senior leadership wrote to students, faculty, and staff to share policy updates and valuable resources designed to help everyone on our campus live and learn together. Letter regarding antisemitism August 28, 2024 President Sally Kornbluth sent a letter reminding members of the MIT community that “antisemitism is totally unacceptable.” Update on MIT’s disciplinary process August 7, 2024 The Institute Discrimination and Harassment Response (IDHR) office posted an update describing how MIT’s disciplinary process is handling incidents related to campus tensions stemming from the Israel-Hamas war. Lawsuit against MIT is dismissed July 30, 2024 A federal lawsuit accusing MIT of tolerating antisemitism has been dismissed. Dialogues Across Difference: A Model for Discussing Conflict and War in the Middle East May 9, 2024 During spring 2024, there were five events in the Dialogues Across Difference series, which is sponsored by the offices of the president, provost, and chancellor. Quick links MIT Statement on Freedom of Expression and Academic Freedom The MIT Statement on Freedom of Expression and Academic Freedom was approved by the MIT faculty on December 21, 2022, and embraced by President Sally Kornbluth soon after she took office, in one of her earliest communications to the full community. Free Expression at MIT The Ad Hoc Committee on Academic Freedom and Campus Expression (CAFCE) created this website to help our community understand what freedom of expression means at MIT. Mission and Values The vital work of the people of MIT continues year-round — work that is essential to the nation’s security, prosperity, and quality of life. Read MIT’s Mission Statement and Values Statement. Archive You can find last year’s content, including messages from President Kornbluth, archived here."
