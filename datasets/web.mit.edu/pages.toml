full_description = "Affiliate Parking Bicycle Commuter Reimbursement Cancellation--Parking Carpool Parking Department Vehicle Extended Parking Notification Parking Private Transit Subsidy T-pass Vanpool Subsidy Visitor Parking Affiliates may apply online and must have a Kerberos account. Learn more. Examples of MIT Affiliates are: This form is used by full-time benefits-eligible MIT employees who commute to work by bicycle and are seeking reimbursement for cycling expenses. Parking Coordinators may apply online to request parking accounts for department-owned vehicles. Visit the FAQ for more information. An MIT permit holder who is traveling on Institute business may request to leave their vehicle in an MIT lot for up to two weeks while they are away. Faculty, staff, students, and affiliates who commute to campus by car should fill the appropriate online form to request a parking account. A Kerberos account is required to apply for parking. Affiliates must be sponsored in advance of using the online application. Learn more about affiliate parking. MIT staff or faculty can request a subsidy for their commute to work via private transit (e.g. Amtrak, Peter Pan bus). Faculty, staff, students, and affiliates who commute to campus by MBTA (bus, subway, or commuter rail) are eligible for a discounted T-pass. After you enroll in the Commute with Enterprise vanpool program, you will need to enroll for MIT�s payroll deduction plan (via Atlas). Parking passes for visitors are available for invited guests of any MIT department. Department personnel with SAP authorization may purchase visitor passes through Atlas. Phone: 617-258-6510 Phone (after hours): 617-253-2997 Fax: 617-258-6357 Email: mitparking@mit.edu Tom Giannino Manager Robynn Cruz-Walker Commuter Program Administrator"
