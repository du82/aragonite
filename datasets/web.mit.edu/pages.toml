["http://web.mit.edu/facilities/transportation/emergencyride.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "Are you hesitant to take public transportation or join a car pool because you worry about being stranded at work if there�s an emergency at home or you have to work late unexpectedly? We have just the program for you! Sign up for the Emergency Ride Home (ERH) program, sponsored by MIT and run by the Charles River Transportation Management Association (TMA). If you are a benefits-eligible employee who habitually opts for public transit, the ERH program will reimburse you for the cost of a rideshare service or taxi if you need one in an emergency. MIT Cambridge-campus employees who commute via public transportation, carpool, vanpool, bike, or on foot at least three days per week are eligible. Participants in the ERH Program may obtain a ride one time per month, up to four times per year. Simply register in advance, get a ride in the event of an emergency, and submit your receipt within 5 days to receive reimbursement. Here�s how it works: You must register with Charles River TMA prior to using the program. Once Charles River TMA has received and processed the completed registration forms, an orientation package will be sent to you with program information. Please note that registration may take up to three weeks. In the case of a personal emergency or unexpected overtime, simply use any ridesharing app (such as Uber or Lyft) or cab company to get home. Once you have taken a trip, email your receipt* to Charles River TMA and submit a confirmation report within 5 business days. You�ll receive reimbursement within 10-15 business days. You may include a tip for good service, but it may not exceed 20% of the fare. * To obtain a ridesharing service receipt, simply take a screenshot of the in-app receipt on your smart phone or request a receipt after the trip. To obtain a cab ride receipt, request a receipt from the cab driver and scan it or take a photo of it with your phone. Phone: 617-258-6510 Phone (after hours): 617-253-2997 Fax: 617-258-6357 Email: mitparking@mit.edu Tom Giannino Manager Robynn Cruz-Walker Commuter Program Administrator"
year_published = 2025
clearnet = "http://web.mit.edu/facilities/transportation/emergencyride.html"
