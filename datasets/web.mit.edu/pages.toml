full_description = "Home Visit Where to stay Where to stay The Greater Boston area offers a wide variety of options for overnight accommodations. Accommodations in the Boston area can be pricey, and depending on when you visit, very hard to find. In particular, please be advised that the months of May and June constitute Commencement season in eastern Massachusetts, so hotels and restaurants are especially busy during that time. Other busy times include the weekend prior to the Boston Marathon (annually on the third Monday in April) and the days surrounding the Head of the Charles Regatta (annually in October). We strongly advise reserving your accommodations before arriving. Refer to this map of hotels in the greater area and the list of preferred hotels nearest to campus; bed and breakfasts are another option. Please note that MIT does not guarantee any of these accommodations—this information is provided for reference only. Many of the accommodations in Boston and Cambridge are accessible by the MBTA subway system. For information about living on or off campus while studying at MIT, visit MIT Housing. Map of area hotels Preferred hotels MIT has several preferred hotels in the campus area, three of which are in Kendall Square*. Boston Marriott Cambridge* 2 Cambridge Center Cambridge, MA 02142 Phone: 617-494-6600 Toll-free: 800-228-9290 Courtyard Boston Cambridge by Marriott 777 Memorial Drive Cambridge MA 02139 Phone: 617-492-7777 Toll-free: 866-323-4149 Fairfield Inn and Suites Boston Cambridge 215 Monsignor O’Brien Highway Cambridge, MA 02141 Phone: 617-621-1999 Holiday Inn Express and Suites Boston Cambridge 250 Monsignor O’Brien Highway Cambridge, MA 02141 Phone: 617-577-7600 Hotel Commonwealth 500 Commonwealth Avenue Boston MA 02215 Toll-free: 866-784-4000 Hyatt Regency Boston / Cambridge 575 Memorial Drive Cambridge, MA 02139 Phone: 617-492-1234 Toll-free: 800-228-9000 The Kendall Hotel* 350 Main Street Cambridge, MA 02142 Phone: 617-577-1300 Kimpton Marlowe