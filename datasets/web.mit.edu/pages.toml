["http://web.mit.edu/facilities/transportation/parking/visitors/index.html"]
title = "MIT Facilities - Parking & Transportation"
full_description = "The number of visitor parking spaces on campus is limited, and it may not be possible to accommodate every visitor who wishes to park at MIT. Therefore, we strongly recommend using public transportation when visiting the MIT campus. A limited number of one-day scratch cards is available for employees and students to purchase for visitors. Parking Coordinators and designated employees with the ability to spend and commit funds may purchase visitor passes and scratch cards online through the parking app. Employees and students without this ability may purchase scratch cards by visiting the Parking & Transportation Office at the Atlas Service Center, Building E17-106. Public parking near campus includes metered spaces and several public parking garages. MIT is also easily accessible by public transportation. An alumnus/alumna visiting MIT for the day can explore the daily visitor parking options described above. MIT alumni (including volunteers) who will be on campus for more than a few days are eligible to apply for affiliate parking on campus. Department guest parking may be purchased by a designated member of a department with Spend or Commit authorization online through the parking app or by contacting the Parking & Transportation Office. Two kinds of parking passes are available for invited guests of a department or lab at MIT�s current visitor rates. Note that guest parking is for a department's occasional guests, not for functions with a large attendance. If your department needs to arrange on-campus parking for a large event, contact the Parking & Transportation Office for more information. Guest parking passes may not be issued to MIT employees. If a department guest reservation is not canceled by 4:45 PM the day before the guest is due to arrive, the Parking & Transportation Office will not be able to refund the cost of the pass back to the department. Volunteers with an MIT account are eligible to apply for affiliate parking on campus. See our affiliate parking page for more information."
