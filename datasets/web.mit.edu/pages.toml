title = "MIT Facilities - Commuter Connections"
full_description = "Check for PW riders and pedestrians, especially in your blind spots. Make eye contact with them and yield as needed. Slow down and make your right turn behind them. The PW rider may be traveling faster than you realize, and a collision might result. At urban intersections, large vehicles like buses and trucks can block your view of oncoming PW riders. Be watchful to avoid a potential head-on collision. Move over a lane if possible. This is the Vulnerable Road Users Law, designed to protect (among others) PW riders and pedestrians. The Dutch Reach ensures that you check behind you first, and it works whether you�re on the driver�s or passenger�s side of the car. Check out this video for a clear illustration of how to do the Dutch Reach. Don�t stop, park, or travel in a bike lane with your motor vehicle. Stay out of the bike box at an intersection. Be patient; the cyclist is allowed to take this safety measure. Honking, arguing, or attempting to pass can create an unsafe situation. Use a navigation app (hands free!) if you�re unfamiliar with the area. Even loud music or conversation can be a dangerous distraction. Stay focused � your life and the lives of your fellow riders and drivers depend on it! The �bike� feature on a navigation app like Google Maps will recommend a route, and it�s usually the safest. Look for a route that uses bike lanes, multi-use paths, and side streets with fewer cars. Wear a well-made helmet that fits � every time you ride. Please protect your astonishing brain! Use/wear bright colors, reflective gear, and lights. Put flags on any trailer or cargo you are towing. Don�t assume you�ve been seen at intersections � try to make eye contact with drivers and avoid their blind spots. Make some noise! Use a bell and/or audible signals to alert or warn pedestrians and drivers. Check for drivers and pedestrians at the intersections. Make eye contact with drivers whenever possible and indicate your direction. Keep an eye out for bike-specific signals."
year_published = 2025
clearnet = "http://web.mit.edu/facilities/transportation/safety.html"
