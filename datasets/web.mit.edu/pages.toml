["http://web.mit.edu/facilities/transportation/parking/rates.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "Parking account type Cost Annual Fee Cap Employee Daily and Graduate Employee Daily (gated and ungated lots) $11/day $0 $1995/year Employee Off-Campus (leased lots, limited) $174/month $0 No cap Emeritus Faculty $11/day $0 $336/year Student Commuter $11/day $0 $1300/year Campus Resident $174/month $0 No cap Carpool (Groups of two or more daily-rate employee and/or student commuters) $88/month divided by # people in carpool $0 No cap Affiliate* (Consultants, contractors, volunteers, DAPER members) $11/day $11/month No cap Department Vehicles $2509/year $0 No cap Visitor passes and scratch cards** $34/day $0 No cap Students, faculty, and staff no longer pay an annual fee for parking. Motorcycles do not require an additional permit; account holders simply add the motorcycle as one of the vehicles on their account. MIT on-campus parking account holders may park for no additional charge in most lots on campus after 2:30 PM, Monday through Friday, and all day on weekends and MIT holidays. During the same periods of time, off-campus parkers have access to ungated lots on campus for no additional charge. The following lots are excluded from evening/weekend day/holiday parking: W18 Garage; Hayward Garage; MIT Health lot; E19 (Ford) Lot; 139 Mass Ave lot (front); and Childcare lots. Note that evening and weekend parking is allowed only in spots that are not otherwise reserved — Learn more. * To request a parking account, affiliates must be sponsored and have a Kerberos account; visit the Affiliate parking page for more info. Note that DAPER is not currently sponsoring any additional accounts. ** Employees and students may purchase scratch cards for visitors in person at the Atlas Service Center; Parking Coordinators and designated employees with the ability to commit funds may purchase them online through the parking application — Learn more."
