full_description = "Home Alumni Alumni MIT’s alumni — entrepreneurs, researchers, policymakers, and above all, leaders — have helped to shape the world we know today. From 3-D printing to bionic prostheses, many of the products and services that define the modern world have sprung from the minds and hands of MIT’s brilliant alumni community. MIT’s nearly 149,000 alumni represent one of the most talented, innovative, and networked communities on the planet. Many remain deeply involved in the life of the Institute. They volunteer, serve on boards, head up regional alumni clubs, and generously support MIT’s students, faculty, and staff. As individuals, their contributions are extraordinary. As a community, their impact is infinite. Your browser does not support the video tag. Get Involved Join a club. Start a group. Make an annual gift. Attend an event. MIT draws great strength from its graduates’ ongoing engagement — with each other and with the Institute. Our alumni can always find community at MIT, no matter where in the world they are. Top Resources MIT Alumni Association Alumni Directory Alumni Career Resources Lifelong Learning Give to MIT MIT alumni and friends participating in a community service project MIT Alumni News In their communities and their professions, locally and around the globe, MIT’s alumni are vital to our vision of making a better world. Through MIT News, the Alumni Association’s Slice of MIT blog, Resource Development’s Spectrum, and MIT News in Technology Review, you can keep up with our graduates’ remarkable impact around the globe. Top Resources Slice of MIT Blog MIT News Office MIT News in Technology Review Spectrum Alum-to-student mentoring in action Presenting at the annual Alumni Leadership Conference (ALC) MIT volunteers with Tim the Beaver at the Institute’s Alumni Leadership Conference MIT alumni, present and future! Alumni attending an engaging educational event The Reunion Row, an MIT alumni tradition Classmates reconnecting at MIT