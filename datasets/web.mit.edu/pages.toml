["http://web.mit.edu/facilities/transportation/parking/residents.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "As a student or employee who lives on the MIT campus, you (and your spouse or partner) can request on-campus parking privileges online. Please note that every parker is responsible for keeping account information, including vehicle description(s), up to date. You can log into your parking dashboard at any time to view and/or change your account details. Number of vehicles: Campus residents can register one permanent vehicle (a car or motorcycle) on your parking account. Residents with two vehicles will need two parking accounts. No need to renew: Once you establish a parking account, the account is maintained continuously until you cancel it. You can cancel parking at any time during the year through your online parking dashboard or by contacting the Parking & Transportation Office. Parking location: Campus residents park at the lot associated with their residence. Note that the MIT Health parking lot is for patient parking only. For more information, please review the Campus resident parking FAQ and the All parkers FAQ. You can also visit or contact the Parking and Transportation Office at 617-258-6510 or mitparking@mit.edu."
