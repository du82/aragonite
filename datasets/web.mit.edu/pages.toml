["http://web.mit.edu/facilities/construction/index.html"]
title = "MIT Facilities - In Development & Construction"
full_description = "MIT is committed to providing state-of-the-art amenities for its faculty, staff and students, and the Department of Facilities fulfills that objective by developing and constructing smart, sustainable buildings. Construction updates for all ongoing projects are provided regularly via the web, email announcements and public notices. As part of its mission to enhance the student experience, MIT constructed a new undergraduate residence hall on the site of the West Garage parking facility, adding 450 new beds and placing more students close to the heart of campus. New Vassar’s design includes rooms arranged in “clusters” that mix single and double rooms with shared community spaces such as lounges and study rooms. Residents also enjoy shared community spaces such as study lounges, music rooms, and green space including a private courtyard. A dining facility on the first floor, open to the community, includes a kitchen area where students have the opportunity to cook for themselves. The Site 4 project addressed the need for additional graduate student housing at MIT and also created a vibrant new innovation center as well as a new home for Admissions. Two existing buildings on Main Street (E38 and E39) were renovated to accommodate retail space, a Welcome Center and new offices for Admissions, an auditorium, and a new Innovation and Entrepreneurship Hub, home to the MIT Innovation Initiative. Program space was also created for the Office of Sustainability, the Environmental Solutions Initiative, the Water & Food Systems Lab, and the Open Space Programming group. The new graduate student housing tower (Building E37) provides 454 housing units (2-bedroom, 1-bedroom, and efficiencies), a childcare facility, and common space for the residents. Along its southern side, Site 4 borders a welcoming open space designed to encourage pedestrian traffic, offering trees, landscaping, and seating as well as space for special and seasonal events. Occupying the footprint of Building 12 just steps from the Infinite Corridor at the heart of the MIT campus, MIT.nano supports the activities of 2,000 MIT researchers. It streamlines delicate experimentation and prototyping by bringing together complex research activities that were previously distributed around campus. A world-class facility, it modernizes MIT�s research capacity and deepens the collaboration between disciplines, nurturing game-changing ingenuity and advancing the frontiers of innovation without boundaries, for the betterment of humankind."
year_published = 2025
