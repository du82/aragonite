["http://web.mit.edu/lns"]
title = "Laboratory for Nuclear Science"
full_description = "MIT’s Lab for Nuclear Science offers its employees many great resources and features unmatched by most employers. In addition to being surrounded by some of the most talented faculty and students in the world, MIT offers employee benefits including generous health and dental, tuition assistance, a children's scholarship program, a traditional defined contribution pension plan and optional 401(k). Moreover, MIT is a truly diverse and nurturing community. The campus is alive with groups, classes and activities for employees. Finally, the lab itself is filled with great colleagues and is committed to a sense of pride in its service to its students, faculty and the public. A new report by the American Physical Society and lead by MIT physicist, Washington Taylor, provides an overview of the major experimental CDR approaches and determines their fundamental physical limits. The report focuses on methods that have the biggest potential for removing carbon dioxide, at the scale of gigatons per year, which is the magnitude that would be required to have a climate-stabilizing impact. The US Department of Energy published that LNS scientist testing the possible doubly magic nature of Tin-100, study the electromagnetic properties of Indium isotopes. Scientists are closing in on a major cornerstone of nuclear physics, Tin-100.” Physics World has selected two research advances by MIT physicists for its Top 10 Breakthroughs of the Year for 2024, reports Hamish Johnston for Physics World. Graduate student Andrew Denniston, his advisor Prof. Or Hen, and his colleagues were honored for their work “being the first to unify two distinct descriptions of atomic nuclei,” which Johnston describes as a “major step forward in our understanding of nuclear structure and strong interactions.” MIT researchers were also featured for their work demonstrating quantum error correction on an atomic processor with 48 logical qubits, making it “far more likely that quantum computers will become practical problem-solving machines.”"
