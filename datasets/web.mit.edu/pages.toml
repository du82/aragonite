["https://web.mit.edu/response-government-activity"]
title = "MIT's response to government activity | MIT - Massachusetts Institute of Technology"
description = "Latest updates | Quick links “We’re here to advance knowledge, to educate students, and to bring knowledge to bear on the world’s great challenges. There is no more important work in the world, and I’ll continue to do everything I can to steer a steady course, keep us focused on the mission, and help us do big things together.” — President Sally Kornbluth"
full_description = "Home MIT's response to government activity MIT's response to government activity Latest updates | Quick links “We’re here to advance knowledge, to educate students, and to bring knowledge to bear on the world’s great challenges. There is no more important work in the world, and I’ll continue to do everything I can to steer a steady course, keep us focused on the mission, and help us do big things together.” — President Sally Kornbluth MIT continues to press forward with its vital research and education mission, including on topics such as human health, energy innovation, quantum computing, advanced manufacturing, and other areas important to national security, economic competitiveness, and quality of life for all Americans. At the same time, MIT follows the law and is assessing on an ongoing basis the initial impacts of the government orders and new agency guidance. The Institute will update this page when it can offer concrete, broadly applicable information to the MIT community, or when the Institute has public information to share. This page was first published during the 2025 spring semester. Latest updates Explainer: On direct and indirect costs February 20, 2025 Indirect costs support the crucial research infrastructure that makes MIT a phenomenal environment in which to conduct research. More specifically, indirect costs are a well-defined (and audited) set of costs incurred for common or joint objectives. These costs are necessary to perform research but are not exclusively related to a specific project. Chart: The federal research dollar on the MIT campus February 20, 2025 The presentation Research Costs at MIT [PDF] provides more details on how indirect and direct costs support the research enterprise. Article: Cuts threaten US leadership in science and technology February 17, 2025 Writing for The Boston Globe, President Emeritus L. Rafael Reif highlights the fundamental contributions made by universities across the U.S. in the advancement of scientific and technological innovations, and the role of government funding in these sectors. “Since World War II, the ideas born in university research laboratories have helped to make America great,” writes Reif. Letter: Hiring freeze implemented on campus February 14, 2025 Given the uncertain outlook for federal funding and policy, MIT has instituted a general hiring freeze on most non-faculty positions, as the Institute has done in response to past financial challenges. Executive Vice President and Treasurer Glen Shor and Provost Cynthia Barnhart provided details on the freeze, including the process for exemption requests, writing: “The current measure is designed to help steward and safeguard the Institute’s mission in the face of unpredictable change.” Letter: Response to proposed cuts by the NIH February 10, 2025 MIT joined the American Council on Education, the Association of Public and Land Grant Universities, the Association of American Universities (AAU), and a number of AAU member institutions in filing suit in federal court seeking to block these indiscriminate cuts from taking effect. (Joint Statement of ACE, APLU, and AAU) Letter: Guidance on federal funding January 29, 2025 Vice President for Research Ian Waitz wrote to the MIT community about federal research funding. A message from President Kornbluth January 20, 2025 President Sally Kornbluth addressed the MIT community about changes that may come with the new administration in Washington. (Transcript | Video) Resources Information for MIT researchers Changes to federal policy (Touchstone login required) Updates on campus and community from MIT MIT and its leadership are committed to promoting student well-being, protecting free speech, and responding to policy violations as appropriate. Updates on recent events on campus and sharing relevant policies can be found here. MIT News MIT News is the Institute’s platform for promoting MIT’s research, innovations, teaching and newsworthy events and people to the campus community, news media and public. The latest about the work and people of MIT can be found here: from Institute-wide moves in generative AI, health and climate to the breakthroughs enabled by nanoscience and nanotechnology; startups bringing innovations from lab to impact; and advances in fields as varied as quantum computing, cancer, agriculture, and cleaner industry. Mission and Values The vital work of the people of MIT continues year-round — work that is essential to the nation’s security, prosperity, and quality of life. Read MIT’s Mission Statement and Values Statement."
year_published = 2025
clearnet = "https://web.mit.edu/response-government-activity"
