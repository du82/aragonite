["http://web.mit.edu/facilities/transportation/walking.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "Did you know that walking is a major mode of transportation? The Parking and Transportation Office encourages you to use walking in your commute and when getting around campus. Walking for 30-60 minutes a day greatly reduces your risk of heart disease, cancer, stroke, and diabetes. By finding a way to make walking part of each day, you will give your health a boost. Try adding 15 minutes of walking at the beginning of the day and at the end � or somewhere in the middle. If you take public transportation, consider getting on or off at an earlier stop or a later one. Check out the MIT Walking Map (PDF) for suggested routes close to campus. Walking is one of the many ways to participate in MIT�s getfit program, a 12-week team fitness challenge (usually February to April) that encourages participants to exercise regularly. Weekly prizes are awarded to registered teams and individuals � and many participants keep following their new routines after the challenge has ended. Individuals can also participate in Green Streets Initiative�s Walk/Ride Days on the last Friday of every month. The program includes events sponsored by local community agencies and retailers, and participants receive discounts at Boston-area retailers and restaurants. Each month, all registered participants who logged a commute are also entered into a monthly raffle offering a range of unique prizes. Phone: 617-258-6510 Phone (after hours): 617-253-2997 Fax: 617-258-6357 Email: mitparking@mit.edu Tom Giannino Manager Robynn Cruz-Walker Commuter Program Administrator"
