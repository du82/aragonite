["http://web.mit.edu/facilities/transportation/parking/employee/index.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "As a full- or part-time employee of MIT (or eligible graduate student employee), you can request on-campus parking privileges online. If you are open to alternative options, we encourage you to explore our commuter benefits programs, many of which offer subsidies and reimbursements. For benefits-eligible employees on the Cambridge campus, the Access MIT program includes a free local bus and subway pass in your MIT ID. Please note that every parker is responsible for keeping account information, including vehicle description(s), up to date. You can log into your parking dashboard at any time to view and/or change your account details. Cost of parking: Account holders in both gated and ungated on-campus lots pay a daily parking fee for each day you park at your designated location, up to an established annual cap. Current parking rates can be viewed here. Number of vehicles: Account holders can register up to three vehicles (including motorcycles) on your parking account. However, please note that only one vehicle at a time may be parked on campus under each account. No need to renew: Once you establish a parking account, the account is maintained continuously until you cancel it. You can cancel parking at any time during the year through your online parking dashboard or by contacting the Parking & Transportation Office. Carpools: Employees and students may form carpools for commuting purposes. Read more about carpools in our All parkers FAQ. Parking location: The Parking & Transportation Office makes its best effort to find you a parking space within reasonable walking distance of where you work, based on lot availability and capacity. Note that the MIT Health parking lot is for patient parking only. See All parkers FAQ for information about medical requests. Location information is always available to view on your parking dashboard. For more information, please review the Employee parking FAQ and the All parkers FAQ. Departmental Parking Coordinators are also available to answer your commuter questions."
year_published = 2025
