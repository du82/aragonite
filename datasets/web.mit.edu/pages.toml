["https://web.mit.edu/about"]
title = "About MIT | MIT - Massachusetts Institute of Technology"
description = "Founded to accelerate the nation’s industrial revolution, MIT is profoundly American. With ingenuity and drive, our graduates have invented fundamental technologies, launched new industries, and created millions of American jobs. At the same time, and without the slightest sense of contradiction, MIT is profoundly global. Our community gains tremendous strength as a magnet for talent from around the world."
full_description = "Home About MIT About MIT The MIT community is driven by a shared purpose: to make a better world through education, research, and innovation. We are fun and quirky, elite but not elitist, inventive and artistic, obsessed with numbers, and welcoming to talented people regardless of where they come from. Founded to accelerate the nation’s industrial revolution, MIT is profoundly American. With ingenuity and drive, our graduates have invented fundamental technologies, launched new industries, and created millions of American jobs. At the same time, and without the slightest sense of contradiction, MIT is profoundly global. Our community gains tremendous strength as a magnet for talent from around the world. Through teaching, research, and innovation, MIT’s exceptional community pursues its mission of service to the nation and the world. Mission and Values Mission Statement MIT Values Your browser does not support the video tag. Key Facts History Incorporated 1861 Motto “Mens et manus” (“mind and hand”) Campus Location Cambridge, MA USA Size 168 acres (0.68 km2) Student residences 20 Playing fields 26 acres (0.11 km2) Gardens + green spaces 40+ Publicly sited works of art 60+ Admissions (Class of 2028) Applicants 28,232 Admits 1,284 Selected Honors Nobel laureates 105 National Medal of Science winners 61 National Medal of Technology and Innovation winners 33 MacArthur Fellows 84 A. M. Turing Award winners 17 More MIT FactsA brief history of MIT MIT’s first building was in Boston, before the move to Cambridge in 1916. “Aesop’s Fables II,” by Mark di Suvero, is part of MIT’s public art collection. Community (as of 10/30/23) Employees (including faculty) 17,180 Professors (all ranks) 1,089 Other teaching staff 1,020 Undergraduate student-to-faculty and instructional staff ratio 3:1 Students 11,920 Undergraduates 4,576 Women 2,231 (49%) US minority groups 2,650 (58%) Graduate students 7,344 Women 2,969 (40%) US minority groups 1,617 (22%) MIT’s low ratio of student-to-faculty and instructional staff promotes intensive teaching. In 2023–24, MIT students came from all 50 states, the District of Columbia, four territories, and 136 foreign countries. Faculty For MIT’s faculty — just over 1,000 in number — cutting-edge research and education are inseparable. Each feeds the other. When they’re not busy pioneering the frontiers of their fields, MIT faculty members play a vital role in shaping the Institute’s vibrant campus community — as advisors, coaches, heads of houses, mentors, committee members, and much more. Top Resources Awards & Honors Faculty by School MIT faculty instruct undergraduate and graduate students, and engage in research. An MIT professor works on an architectural model. Leadership President Sally Kornbluth MIT’s 18th president, January 2023 – present The Institute’s board of trustees, known as “the Corporation,” includes 78 distinguished leaders in engineering, science, industry, education, and other professions. Top Resources Office of the President Senior Leadership MIT Corporation President Sally Kornbluth Cambridge & Boston MIT is an integral part of its host city of Cambridge, a diverse and vibrant community noted for its intellectual life, history, and thriving innovation climate. With a campus nestled between Central and Kendall Squares, and across the Charles River from Boston’s Back Bay, the Institute is optimally positioned to collaborate with its neighbors and to contribute to its community. Top Resources Visit MIT Kendall Square Visiting Boston Aerial view of the campus, with a glimpse of the Boston skyline Studying on Killian Court Performers at the a dance festival Oliver Smoot ’62 gets measured on the Harvard Bridge as part of a fraternity prank. The length of the bridge is determined to be 364.4 smoots plus or minus one ear. Working on an electronics project The Koch Institute Public Galleries Panorama of the MIT campus The Ray and Maria Stata Center Product Integraph Lab, 1927 prev next"
