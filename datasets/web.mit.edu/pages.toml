full_description = "This is the homepage h1 Discoveries in Physics Research From quarks to twistronics to dark matter, MIT is on the cutting edge of physics research. Graduate Program Undergraduate Program Diversity & Inclusion Scroll Spotlight On MIT physicists find unexpected crystals of electrons in new ultrathin material Rhombohedral pentalayer graphene joins a family of materials with exotic properties that may have other “relatives.” > Scroll Our Research Areas The MIT Department of Physics is recognized as a worldwide leader in physics research. Explore Our Research Areas Our Programs Undergraduate An undergraduate degree in physics at MIT prepares students very well for graduate studies in physics, as well as for a variety of academic or research-related careers. Graduate Consistently highly ranked by U.S. News and World Reports as the Best Physics Program in the World. Pappalardo Fellowships in Physics Our distinguished postdoctoral fellowship program that identifies, recruits and supports talented and promising young physicists at an early stage of their careers. Our Faculty We have five faculty who have won the Nobel Prize in Physics. We have also been the source of innovation in physics education with eight Oersted Medal winners. Learn about our faculty Recent News See All News MIT physicists find unexpected crystals of electrons in new ultrathin material February 26, 2025 Categories: Research, Faculty/Emeritus, Graduate Students, Condensed Matter Experiment Fiber computer allows apparel to run apps and “understand” the wearer February 26, 2025 Categories: Research, Faculty/Emeritus, Condensed Matter Theory The man who reinvented the hammer February 25, 2025 Categories: In The News, Alumni"
