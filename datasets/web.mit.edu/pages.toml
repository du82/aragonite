["http://web.mit.edu/facilities/services/index.html"]
title = "MIT Facilities - Request Services"
full_description = "Atlas provides a central system for requesting services from the Department of Facilities. Enhanced tools and processes make it easier for people to create service requests and users are now able to track their pending, in-process and completed requests. You can request a repair in Atlas and also order “sales work” or special services such as carpentry, cleaning, event set up and more. All requests receive a work order number that allows you to check the status of your job. There is also a search feature you can use to check all the orders you’ve submitted. The Customer Service Center (CSC) team is committed to providing quality service to the MIT community. They are available to help streamline work orders, answer questions and address customer needs. The CSC team is a central point of contact for customers because they work closely with Facilities staff in Operations including Repair & Maintenance, Grounds, and Custodial Services. One of the Customer Service Center's goals is to build and maintain a network of communication with the MIT community. Although customers should continue to go to Service Requests in Atlas to order services from Facilities, the CSC representatives can assist with this process. They can also check on the status of a job and they can answer questions about billing. You can contact them directly at: 617-253-4948 or dof-csc@mit.edu. Their office is in Building E17-129. The Customer Service Center representatives are available to assist the community from Monday through Friday 7AM to 4:30PM. Their hours for key distribution are from 8AM to 4PM. Office Hours: M - F, 7AM - 4:30PM Key Distribution Hours: M - F, 8AM - 4PM Phone: 617-253-4948 Building: E17-129 Email: dof-csc@mit.edu"
