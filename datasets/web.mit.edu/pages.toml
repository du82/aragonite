full_description = "Spotlight Get charged upThe Fast Forward MIT Campus Commitments include increasing the number of on-campus electric car charging spaces to 360 by 2026! Currently, we have 151 charging spaces available (another 80+ coming soon) � and they are in much demand. Please keep this in mind when charging, and move your vehicle out of the charging space when you�re done. Learn more. Get charged upThe Fast Forward MIT Campus Commitments include increasing the number of on-campus electric car charging spaces to 360 by 2026! Currently, we have 151 charging spaces available (another 80+ coming soon) � and they are in much demand. Please keep this in mind when charging, and move your vehicle out of the charging space when you�re done. Learn more. Based on your parking account, you are authorized to park in one of the areas around campus. Each area has one or more lots or garages, and each lot or garage offers specific amenities. Request parking. Note about EV charging stations: Currently, the campus charging stations (offering a total of 151 spaces, with 80+ more in development) can be found at the following locations: If there is a station located in the campus area where you are authorized to park, you can charge your EV there (you�ll need to open a ChargePoint account first). Charging spaces are first come, first served, and our EV population is growing, so charge up at home when you can � and if you are charging on campus, remember to free up the space as soon as possible to enable a fellow EV driver to start charging. Learn more about how to use MIT's EV charging stations."
