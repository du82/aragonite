["https://web.mit.edu/about/mission-statement"]
title = "Mission Statement | MIT - Massachusetts Institute of Technology"
description = "Mission Statement The mission of MIT is to advance knowledge and educate students in science, technology, and other areas of scholarship that will best serve the nation and the world in the 21st century."
full_description = "Home About MIT Mission Statement Mission Statement Mission Statement The mission of MIT is to advance knowledge and educate students in science, technology, and other areas of scholarship that will best serve the nation and the world in the 21st century. The Institute is committed to generating, disseminating, and preserving knowledge, and to working with others to bring this knowledge to bear on the world’s great challenges. MIT is dedicated to providing its students with an education that combines rigorous academic study and the excitement of discovery with the support and intellectual stimulation of a diverse campus community. We seek to develop in each member of the MIT community the ability and passion to work wisely, creatively, and effectively for the betterment of humankind. MIT’s motto is “mens et manus,” or “mind and hand,” signifying the fusion of academic knowledge with practical purpose."
