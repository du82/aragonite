["http://web.mit.edu/facilities/transportation/parking/index.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "MIT�s parking program enables the majority of MIT commuters to take advantage of our daily rate system and integrates efficient technologies such as License Plate Recognition (LPR). You do not need a physical sticker for your car, and your parking account is maintained continuously until you cancel it. Caps on annual charges will reset every July, but there is no need to renew your parking. The parking program is one component of Access MIT, which encourages sustainable transit by providing MIT commuters with more options and greater flexibility. Switch it up by ditching the car when you can! Drive today, take the subway or bus tomorrow, and walk when the weather is nice. To apply for subsidy and reimbursement incentive programs or for a parking account, visit your Commuting Benefits page on Atlas. If driving is your only commuting option, we�re here to help with information about parking accounts, parking locations, amenities, and regulations. If you have questions that are not answered by these pages, simply contact the Parking & Transportation Office. Please note: MIT is committed to helping the City of Cambridge reduce atmospheric pollution and traffic congestion, and we work with the City to regulate and restrict the number of on-campus parking spaces per Cambridge Municipal Code 10.18."
