["http://web.mit.edu/facilities/transportation/parking/regulations.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "Even if a vehicle is driven by another party, the faculty member, staff member, or student who registered and holds the parking account associated with the vehicle is responsible for any and all violations. Any person with four or more parking violations may be towed (at his/her own expense) and/or may lose parking privileges at MIT. Your car might get towed (at your expense) under certain circumstances. Please note that MIT is not responsible for any damage caused by an independent towing contractor. Towing circumstances include: During snow emergencies, MIT requests that all cars be moved out of outdoor parking lots so that those lots may be plowed. Please refrain from leaving your car in an outdoor MIT parking lot for the duration or aftermath of a snowstorm. MIT parking lots may not be used as an alternative to street parking during a snow event. Information concerning snow emergencies may be obtained by visiting MIT�s Emergency Information page or calling 617-253-SNOW. If you have questions about parking during a snow emergency, call the Department of Facilities Customer Service Center at 617-253-4948."
year_published = 2025
clearnet = "http://web.mit.edu/facilities/transportation/parking/regulations.html"
