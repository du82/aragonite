["http://web.mit.edu/facilities/transportation/parking/affiliates.html"]
title = "MIT Facilities - Commuter Connections"
full_description = "If you are not an MIT student or employee, but you have a specific or professional relationship with MIT, you may be eligible to apply for affiliate parking. Parking for affiliates is not guaranteed and is determined based on availability. Please note that every parker is responsible for keeping account information, including vehicle description(s), up to date. You can log into your parking dashboard at any time to view and/or change your account details. Who is eligible: Examples of eligible affiliates include alumni, cross-registered students, previously-sponsored DAPER members (currently, DAPER is not sponsoring any additional parking accounts), retired staff, and volunteers. Retired faculty members are eligible for either employee parking or affiliate parking, depending on their specific appointment. You are only eligible for a parking account during the time when your specific or professional relationship with MIT is ongoing and active. Cost of parking: A monthly fee for each month (regardless of whether you park that month), plus a daily parking fee for each day you park at your designated location. Payment can be made via credit card auto-pay. View current parking rates. Number of vehicles: Affiliates can register up to three permanent vehicles (including motorcycles) on your parking account. However, please note that only one vehicle at a time may be parked on campus under each account. First-time applicant: To apply for parking, you must have a Kerberos account (also known as an MIT or Athena account), which will allow you to log into the online parking application. No need to renew: Once you establish a parking account, the account is maintained continuously (and monthly charges accrue) until you cancel it. You can cancel parking at any time during the year through your online parking dashboard or by contacting the Parking & Transportation Office. Parking location: The Parking & Transportation Office makes its best effort to find you a parking space within reasonable walking distance of where you work, based on lot availability and capacity. Note that the MIT Health parking lot is for patient parking only. Location information is always available to view on your parking dashboard."
year_published = 2025
clearnet = "http://web.mit.edu/facilities/transportation/parking/affiliates.html"
