title = "RadioLogic | Internet with a Brain"
description = "OpenMRS est un projet collaboratif visant à développer des solutions logicielles pour soutenir la prestation de soins de santé dans les pays en développement. Le projet a été lancé en 2004 par Paul Biondich et Burke Mamlin de l’Institut Regenstrief. L’outil OpenMRS est actuellement déployé dans plus de 80 pays au travers le monde. Je suis en train d’évaluer l’intégration d’un module de radiologie dans cet outil."
full_description = "RadioLogic Jj’ai découvert le monde médical de la radiologie il y a quelques années quand j’ai démarré le développement d’un outil de formation pour des internes en radiologie dans un hôpital universitaire. La réalisation de ce projet, nommé RadioLogic, conçu pour tourner sur des équipements Apple, a nécessité de ma part l’apprentissage de nouvelles connaissances et compétences dans différents domaines. En premier lieu la familiarisation avec le standard médical DICOM qui est à la base du projet. Ensuite l’enrôlement comme développeur Apple identifié et l’étude d’un nouveau langage de programmation, Swift. La découverte des systèmes d’hébergement public de logiciels en source libre, comme GitHub, SourceForge et BitBucket, et le déploiement d’applications dans des conteneurs logiciels comme Docker, étaient des étapes supplémentaires. En dernier, mais pas des moindres, l’échange d’informations et les discussions avec d’autres développeurs dans des forums et groupes de développement étaient une nouvelle expérience pour moi. Ci-après je présente quelques exemples des travaux effectués dans le contexte de la radiologie. OpenMRSProjets de radiologieRIS Module - Medical Record SystemOpenMRS est un projet collaboratif visant à développer des solutions logicielles pour soutenir la prestation de soins de santé dans les pays en développement. Le projet a été lancé en 2004 par Paul Biondich et Burke Mamlin de l’Institut Regenstrief. L’outil OpenMRS est actuellement déployé dans plus de 80 pays au travers le monde. Je suis en train d’évaluer l’intégration d’un module de radiologie dans cet outil. OrthancPiSystèmes d'archivageServeur radiologique pour Raspberry PiOrthanc est un serveur d’images radiologiques développé à l’Université de Liège par Sébastien Jodogne. En début 2016, j’ai porté le logiciel en source libre de ce serveur sur la plateforme Raspberry Pi. Ce mini PACS est utilisé pour archiver les séances de formation de jeunes radiologues dans un environnement sans accès à Internet. Images radiologiques sur smartphonesImagerie médicaleAperçu des visionneuses DICOM pour tablettes et mobilophonesFin 2015 j’avais évalué et testé toutes les applications DICOM pour iOS et Android qui étaient disponibles sur le marché. Le rapport afférent, publié sur mon blog, est référencé sur plusieurs sites web du domaine de la radiologie. DICOM standardNotions de baseDigital Imaging and Communication in MedicineLe standard DICOM a été conçu en 1983 par le American College of Radiology et la National Electrical Manufacturers Association. Le standard DICOM, qui compte plus de 3.000 pages, est considéré comme particulièrement complexe. OrthancMacSystèmes d'archivageServeur radiologique pour MACEn 2016 j’ai compilé le code source du serveur radiologique Orthanc sur mon MacBook avec le système d’exploitation OS X El Capitan. Des versions plus récentes sont fournies par Osimis, une start-up spin-off de l’Université de Liège. Personnellement je préfère installer Orthanc à l’heure actuelle dans un conteneur Docker sur mes ordinateurs Mac au lieu d’exécuter le code en mode natif. Visionneuses DICOMImagerie médicaleAperçu des logiciels de visualisation d'images radiologiquesEn 2015 j’ai dressé un inventaire des logiciels de visualisation d’images de radiologie DICOM disponibles sur le marché. J’ai classé ces outils dans sept rubriques. A l’époque OsiriX a été considéré comme la référence dans ce domaine. A l’heure actuelle c’est plutôt la visionneuse OHIF qui joue un rôle de précurseur. Outil de test DVTkNotions de baseValidation, Analyse et Diagnose de systèmes de communication DICOMDVTk est un logiciel en source libre permettant de tester, de valider et de diagnostiquer des systèmes de communication DICOM. J’utilise couramment ces outils dans le cadre de mes projets de radiologie. /* Specific Story Style Start */.ctl-wrapper #ctl-story-22947.ctl-story{--ctw-second-story-color :#351f39;--ctw-first-story-color:#351f39;}.ctl-wrapper #ctl-story-22935.ctl-story{--ctw-second-story-color :#32485c;--ctw-first-story-color:#32485c;}.ctl-wrapper #ctl-story-22945.ctl-story{--ctw-second-story-color :#45415e;--ctw-first-story-color:#45415e;}.ctl-wrapper #ctl-story-22943.ctl-story{--ctw-second-story-color :#3f4234;--ctw-first-story-color:#3f4234;}.ctl-wrapper #ctl-story-22553.ctl-story{--ctw-second-story-color :#32485c;--ctw-first-story-color:#32485c;}.ctl-wrapper #ctl-story-22942.ctl-story{--ctw-second-story-color :#45415e;--ctw-first-story-color:#45415e;}.ctl-wrapper #ctl-story-22944.ctl-story{--ctw-second-story-color :#3f4234;--ctw-first-story-color:#3f4234;}/* Specific Story Style End */"
