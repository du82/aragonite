title = "Anna Cook | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = "Anna holds a Master’s degree in Immunology and her career has been an eclectic and interesting journey since, spanning laboratory sales, freelance scientific translation, administration, resource planning and HR. Anna joined CERN in 2004 to work on the EU-funded Enabling Grids for E-sciencE (EGEE) project, and in 2010 she joined the HR department’s Talent Acquisition (TA) group to start up the staff recruitment unit which she ran for 6 years. Today she co-leads the TA group, coordinating all student, graduate and staff programmes, with a particular focus on CERN’s HR communication."
