title = "Bruno Giussani | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = "Bruno Giussani is the Global Curator of the TED conferences (ted.com) and the Chairman of the Geneva International Film Festival on Human Rights (fifdh.org). A recognized expert on international affairs and on the social and economic impacts of technology, he was a journalist and columnist (for, among others, the New York Times) and has co-founded three Internet companies. He also co-created, in 1995, the first news website in Switzerland. Bruno Giussani Bruno Giussani is the Global Curator of the TED conferences (ted.com) and the Chairman of the Geneva International Film Festival on Human Rights (fifdh.org). A recognized expert on international affairs and on the social and economic impacts of technology, he was a journalist and columnist (for, among others, the New York Times) and has co-founded three Internet companies. He also co-created, in 1995, the first news website in Switzerland. You are hereHome"
