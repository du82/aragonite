["https://web30.web.cern.ch/speakers/jean-fran%c3%a7ois-groff-2.html"]
title = "Jean-François Groff | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = 'A lifelong entrepreneur, Jean-François Groff always strives to simplify technical innovations and make them accessible to the general public. He now helps the world transition to digital mobile money, thus accelerating financial inclusion for all. During his stay at CERN as "cooperant", Jean-François helped Tim Berners-Lee develop the World Wide Web technology. He later as consultant ported the communications code to DECnet in order to set up servers for physics experiments, and helped the Danish Technical Library set up their W3 server. Jean-François also worked for NeXT Europe.'
