["https://web30.web.cern.ch/press.html"]
title = "Press | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = "Media who want to attend the event should contact the CERN Press Office via press@cern.ch The seats will be very limited but the event will be live broadcast via EBU/eurovision services. Find out more about the broadcast here and the satellite details here. The event will also be webcast and streamed live on CERN Facebook and Youtube channels. The Web@30 celebration will start at 08:00 AM CET and will end at 10:00 AM CET. A photo gallery about the web is available here. You can find the photos of the web@30 ceremony in the folder below. The names of those in the photo are in the metadata CDS database:https://cds.cern.ch/record/2665683?ln=en Videos about the web are available here and the VNR of the event is available here. Terms of use All our ressources about the birth of the Web."
