["https://web30.web.cern.ch/index.html"]
title = "30th Anniversary of the World Wide Web | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = '''Suppose all the information stored on computers everywhere were linked. Suppose I could program my computer to create a space in which everything could be linked to everything.’ Sir Tim Berners-Lee, inventor of the World Wide Web In 1989 the world’s largest physics laboratory, CERN, was a hive of ideas and information stored on multiple incompatible computers. Sir Tim Berners-Lee envisioned a unifying structure for linking information across different computers, and wrote a proposal in March 1989 called "Information Management: A Proposal". By 1991 this vision of universal connectivity had become the World Wide Web. Celebration at CERN To celebrate 30 years since Sir Tim Berners-Lee's proposal and to kick-start a series of celebrations worldwide, CERN hosted a 30th Anniversary event in the morning of 12 March 2019 in partnership with the World Wide Web Consortium (W3C) and with the World Wide Web Foundation. This anniversary event was webcast, with Web@30 Viewing Parties watching live worldwide! Official photos of the CERN celebration More photos of the CERN event at https://cds.cern.ch/record/2665683 Web@30 tweets from CERN'''
