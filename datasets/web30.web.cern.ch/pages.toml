["https://web30.web.cern.ch/programme.html"]
title = "Programme | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = "Web@30 celebration at CERN on 12 March 2019 (morning) Sir Tim Berners-Lee and Robert Cailliau, together with other Web pioneers and leading experts, will explore the challenges and opportunities of innovative technologies, past, present and future. The event will start at 8:00 and will close at about 10:00. Welcome and Introduction - Welcome by Anna Cook - master of ceremonies - Opening talk by Fabiola Gianotti - CERN Director General Let’s Share What We Know - panel discussion This session highlights the importance of sharing what we know in the context of the early days of the Web. The Web has had a huge influence on the way we collaborate and share knowledge in society as a whole. Collaboration and sharing knowledge were also core values at the heart of its early evolution. Chair: Frédéric Donck Speakers: Tim Berners-Lee, Robert Cailliau, Jean-François Groff, Lou Montulli, Zeynep Tufekci For Everyone - conversation The Web was designed For Everyone! Conversation between Sir Tim Berners-Lee and Bruno Giussani Towards the Future - panel discussion This session will focus on the aspects that technology evolution can bring us Chair: Bruno Giussani Speakers: Doreen Bogdan-Martin, Jovan Kurbalija, Monique Morrow, Zeynep Tufekci Closing Remarks - Closing remarks by Charlotte Warakaulle - CERN Director for International Relations"
