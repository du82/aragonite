["https://web30.web.cern.ch/web-history.html"]
title = "Web History | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = "Sir Tim Berners-Lee, a British scientist, invented the World Wide Web (WWW) in 1989, while working at CERN. The web was originally conceived and developed to meet the demand for automated information-sharing between scientists in universities and institutes around the world. The first website at CERN - and in the world - was dedicated to the World Wide Web project itself and was hosted on Sir Berners-Lee's NeXT computer. In 2013, CERN launched a project to restore this first ever website: info.cern.ch. On 30 April 1993 CERN put the World Wide Web software in the public domain. CERN made the next release available with an open licence, a more sure way to maximise its dissemination. These actions allowed the web to flourish. See more at https://home.cern/science/computing/birth-web."
