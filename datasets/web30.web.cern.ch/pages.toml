["https://web30.web.cern.ch/speakers/charlotte-lindberg-warakaulle.html"]
title = "Charlotte Lindberg Warakaulle | Web at 30: Celebrating the 30th Anniversary of the Invention of the Web"
full_description = "Charlotte Warakaulle has held a variety of posts at the United Nations and was a key focal point for relations between CERN and the UN Office at Geneva. Since 2001 Charlotte Warakaulle has held a variety of posts at the United Nations, from associate speechwriter to chief of the Political Affairs and Partnerships Section at the United Nations Office at Geneva. Most recently she held the position of chief of the United Nations Library in Geneva, where she was responsible for library services, knowledge management, cultural diplomacy and intellectual outreach. Prior to her work with the United Nations, Warakaulle held a Carlsberg Visiting Research Fellowship at Lucy Cavendish College at the University of Cambridge from 1998 to 2001. During her time at the University of Cambridge, she also served as editor-in-chief of the Cambridge Review of International Affairs, a peer-reviewed international affairs journal then published by the Centre of International Studies at the University of Cambridge. She gained her M.Phil in international relations at the University of Cambridge (Pembroke College) and also holds an MA in history (cand.mag.) from the University of Copenhagen, as well as an MA in history (coursework) from the University of Sydney and a BA in history from the University of Copenhagen. Warakaulle speaks English, French, German and Danish."
