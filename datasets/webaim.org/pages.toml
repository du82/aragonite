["https://webaim.org/blog/salary-survey-results"]
title = "WebAIM: Global Digital Accessibility Salary Survey Results"
full_description = 'Global Digital Accessibility Salary Survey Results You are here: Home > Blog > Global Digital Accessibility Salary Survey Results In December 2024 WebAIM conducted a survey to collect salary and job-related data from professionals whose job responsibilities primarily focus on making technology and digital products accessible and usable to people with disabilities. 656 responses were collected. The full survey results are now available. This survey was conducted in conjunction with the GAAD Foundation. The GAAD Foundation is a nonprofit organization whose mission is to disrupt the culture of technology and digital product development to include accessibility as a core requirement. Survey Results Highlights Respondents that reported working full time reported an average salary of $109,542 US dollars (median = $96,100). Average salaries varied by country. 57.6% of respondents reported having a disability. Respondents with disabilities reported higher full-time salaries on average than respondents without disabilities. Blind respondents had the highest average salary of all disability types. Respondents with motor disabilities were the only disability category that reported lower average salaries than respondents without disabilities. 65% of respondents reported working at companies or organizations with over 1000 people. Employees for larger companies/organizations generally reported notably higher average salaries. Those who reported working in an office had notably lower salaries on average than respondents that reported working remotely or in hybrid environments. 22.5% of respondents worked for accessibility software, tools, or services companies. These respondents reported notably lower full-time salaries. More results are available in the full Salary Survey results report. Leave a Comment Click here to cancel reply. Name (required) Email address (will not be published) (required) Website Comments You can use these tags: <a> <b> <blockquote cite=""> <code> <em> <i> <strike> <strong> Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
