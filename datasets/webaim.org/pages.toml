title = "WebAIM: Projects"
full_description = "Projects You are here: Home > WebAIM Projects WebAIM is actively involved in various projects to improve the accessibility of the web. Supported by BrowserStack WebAIM research is funded in part by a donation from Current Projects Screen Reader User Surveys Survey #10 Survey #9 Survey #8 Survey #7 Survey #6 Survey #5 Survey #4 Survey #3 Survey #2 Survey #1 The WebAIM Million: An accessibility analysis of the top 1,000,000 home pages Survey of Web Accessibility Practitioners Survey #3 Survey #2 Survey #1 Four Years of Accessibility Data in Prominent US Networks: An analysis of UCEDD, Institution, and US state/territory accessibility Survey of Users with Low Vision Survey #2 Survey #1 Survey of Users with Motor Disabilities WAVE development NCDAE/WebAIM Web Accessibility in Accreditation Initiative The National Center on Disability and Access to Education (NCDAE) and WebAIM have received funding to explore web accessibility in the education accreditation arena. The project is a 3-year effort supported by the Fund for the Improvement of Postsecondary Education (FIPSE) under their highly competitive Comprehensive Program. Partners include Michigan Community College Virtual Learning Collaborative (MCCVLA); Southern Association of Colleges and Schools – Commission on Colleges (SACSCOC); Southern Regional Education Board (SREB); Western Interstate Commission for Higher Education (WICHE). Past Projects Steppingstones Project on Web Accessibility and Cognitive Disabilities in Education Cognitive and Learning Disabilities Literature Review Overview of Steppingstones Cognitive Research WASP Accessibility Task Force CaptionCaster development NCRTM & Moodle Accessibility Project XUL Accessibility Brigham and Women's Hospital Kessler Library YES Project PowerPay Accent Tool Development and Whitepaper WAVE 3.0 Development IBM Global Campus: Advanced Web Accessibility Education Course WebAIM: Subject Matter Experts to University of Maryland University College gr