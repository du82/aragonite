["https://webaim.org/standards/wcag/checklist"]
title = "WebAIM: WebAIM's WCAG 2 Checklist"
full_description = '''WebAIM's WCAG 2 Checklist You are here: Home > Articles > WCAG > WCAG 2 Checklist Article Contents Perceivable Operable Understandable Robust WebAIM Accessibility Testing Services The experts at WebAIM can audit your web site and provide a detailed report to help you remediate accessibility and WCAG compliance issues. Learn more about WebAIM Evaluation Services Important! The following is NOT the Web Content Accessibility Guidelines (WCAG) 2. It is a checklist that presents our recommendations for implementing the most common accessibility principles and techniques for those seeking WCAG conformance. The language used here significantly simplifies and condenses the official WCAG 2.2 specification and supporting materials to make it easier to implement and verify for web pages. The checklist contains links to the official success criteria. A PDF version of this checklist is also available Tools Show success criteria from WCAG version... 2.0 2.1 2.2 Show level... A AA AAA Perceivable Web content is made available to the senses - sight, hearing, and/or touch Guideline 1.1 Provide text alternatives for any non-text content 1.1.1 Non-text ContentA 2.0 Images, image buttons, and image map hot spots have appropriate, equivalent alternative text.Images that do not convey content, are decorative, or contain content that is already conveyed in text are given empty alternative text (alt="") or implemented as CSS backgrounds. All linked images have descriptive alternative text.Equivalent alternatives to complex images are provided in context or on a separate linked page.Form buttons have a descriptive value.Inputs have associated accessible names.Embedded multimedia is identified via accessible text.Frames and iframes are appropriately titled. Guideline 1.2 Provide alternatives for time-based media. NOTE: If the audio or video is designated as an alternative to web content (e.g., an audio or sign language version of a web page), then the web content itself serves as the alternative. 1.2.1 Audio-only and Video-only (Prerecorded)A 2.0 A descriptive transcript of relevant content is provided for non-live audio-only (audio podcasts, MP3 files, etc.).A descriptive transcript or audio description of relevant content is provided for non-live video-only, unless the video is decorative. 1.2.2 Captions (Prerecorded)A 2.0 Synchronized captions are provided for non-live video (YouTube videos, etc.). 1.2.3 Audio Description or Media Alternative (Prerecorded)A 2.0 A descriptive transcript or audio description is provided for non-live video. NOTE: Only required if there is relevant visual content that is not presented in the audio. 1.2.4 Captions (Live)AA 2.0 Synchronized captions are provided for live media that contains audio (audio-only broadcasts, web casts, video conferences, etc.) 1.2.5 Audio Description (Prerecorded)AA 2.0 Audio descriptions are provided for non-live video.NOTE: Only required if there is relevant visual content that is not presented in the audio.While not required at Level AA, for optimal accessibility WebAIM recommends descriptive transcripts in addition to audio descriptions. 1.2.6 Sign Language (Prerecorded)AAA 2.0 A sign language video is provided for media that contains audio. 1.2.7 Extended Audio Description (Prerecorded)AAA 2.0 When audio description cannot be added to video due to insufficient pauses in the audio, an alternative version of the video with pauses that allow audio descriptions is provided. 1.2.8 Media Alternative (Prerecorded)AAA 2.0 A descriptive transcript is provided for pre-recorded media that has a video track. For optimal accessibility, WebAIM strongly recommends transcripts for all multimedia. 1.2.9 Audio-only (Live)AAA 2.0 A descriptive text transcript (e.g., the script of the live audio) is provided for live content that has audio. Guideline 1.3 Create content that can be presented in different ways (for example simpler layout) without losing information or structure. 1.3.1 Info and RelationshipsA 2.0 Semantic markup is appropriately used to designate headings, regions/landmarks, lists, emphasized or special text, etc.Tables are used for tabular data and data cells are associated with their headers. Data table captions, if present, are associated to data tables.Text labels are associated with form inputs. Related form controls are grouped with fieldset/legend. ARIA labelling may be used when standard HTML is insufficient. 1.3.2 Meaningful SequenceA 2.0 The reading and navigation order (determined by code order) is logical and intuitive. 1.3.3 Sensory CharacteristicsA 2.0 Instructions do not rely upon shape, size, or visual location (e.g., "Click the square icon to continue" or "Instructions are in the right-hand column").Instructions do not rely upon sound (e.g., "A beeping sound indicates you may continue."). 1.3.4 OrientationAA 2.1 Orientation of web content is not restricted to only portrait or landscape, unless a specific orientation is necessary. 1.3.5 Identify Input PurposeAA 2.1 Input fields that collect certain types of user information have an appropriate autocomplete attribute defined. 1.3.6 Identify PurposeAAA 2.1 Regions/landmarks are used to identify page regions.ARIA is used, where appropriate, to enhance HTML semantics to better identify the purpose of interface components. Guideline 1.4 Make it easier for users to see and hear content including separating foreground from background. 1.4.1 Use of ColorA 2.0 Color is not used as the sole method of conveying content or distinguishing visual elements.Color alone is not used to distinguish links from surrounding text unless the contrast ratio between the link and the surrounding text is at least 3:1 and an additional distinction (e.g., it becomes underlined) is provided when the link is hovered over and receives keyboard focus. 1.4.2 Audio ControlA 2.0 A mechanism is provided to stop, pause, mute, or adjust volume for audio that automatically plays on a page for more than 3 seconds. 1.4.3 Contrast (Minimum)AA 2.0 Text and images of text have a contrast ratio of at least 4.5:1.Large text - at least 18 point (typically 24px) or 14 point (typically 18.66px) and bold - has a contrast ratio of at least 3:1. 1.4.4 Resize textAA 2.0 The page is readable and functional when the page is zoomed to 200%. NOTE: 1.4.10 (below) introduces additional requirements for zoomed content. 1.4.5 Images of TextAA 2.0 If the same visual presentation can be made using text alone, an image is not used to present that text. 1.4.6 Contrast (Enhanced)AAA 2.0 Text and images of text have a contrast ratio of at least 7:1.Large text - at least 18 point (typically 24px) or 14 point (typically 18.66px) and bold - has a contrast ratio of at least 4.5:1. 1.4.7 Low or No Background AudioAAA 2.0 Audio with speech has no or very low background noise so the speech is easily distinguished. 1.4.8 Visual PresentationAAA 2.0 Blocks of text over one sentence in length:Are no more than 80 characters wide.Are NOT fully justified (aligned to both the left and the right margins).Have adequate line spacing (at least 1/2 the height of the text) and paragraph spacing (1.5 times line spacing).Have defined or inherited foreground and background colors.Do NOT require horizontal scrolling when the text size is doubled. 1.4.9 Images of Text (No Exception)AAA 2.0 Text is used within an image only for decoration (the image does not convey content) OR when the information cannot be presented with text alone. 1.4.10 ReflowAA 2.1 No loss of content or functionality occurs, and horizontal scrolling is avoided when content is presented at a width of 320 pixels.This requires responsive design for most web sites. This is best tested by setting the browser window to 1280 pixels wide and then zooming the page content to 400%.Content that requires horizontal scrolling, such as data tables, complex images (such as maps and charts), toolbars, etc. are exempted. 1.4.11 Non-text ContrastAA 2.1 A contrast ratio of at least 3:1 is present for differentiating graphical objects (such as icons and components of charts or graphs) and author-customized interface components (such as buttons, form controls, and focus indicators/outlines).At least 3:1 contrast is maintained in the various states (focus, hover, active, etc.) of author-customized interactive components. 1.4.12 Text SpacingAA 2.1 No loss of content or functionality occurs when the user adapts paragraph spacing to 2 times the font size, text line height/spacing to 1.5 times the font size, word spacing to .16 times the font size, and letter spacing to .12 times the font size.This is best supported by avoiding pixel height definitions for elements that contain text. 1.4.13 Content on Hover or FocusAA 2.1 When additional content is presented on hover or keyboard focus:The newly revealed content can be dismissed (generally via the Esc key) without moving the pointer or keyboard focus, unless the content presents an input error or does not obscure or interfere with other page content.The pointer can be moved to the new content without the content disappearing.The new content must remain visible until the pointer or keyboard focus is moved away from the triggering control, the new content is dismissed, or the new content is no longer relevant. Operable Interface forms, controls, and navigation are operable. Guideline 2.1 Make all functionality available from a keyboard. 2.1.1 KeyboardA 2.0 All page functionality is available using the keyboard, unless the functionality cannot be accomplished in any known way using a keyboard (e.g., free hand drawing).Page-specified shortcut keys and accesskeys (accesskey should typically be avoided) do not conflict with existing browser and screen reader shortcuts. 2.1.2 No Keyboard TrapA 2.0 Keyboard focus is never locked or trapped at one particular page element. The user can navigate to and from all navigable page elements using only a keyboard. 2.1.3 Keyboard (No Exception)AAA 2.0 All page functionality is available using the keyboard. 2.1.4 Character Key ShortcutsA 2.1 If a keyboard shortcut uses printable character keys, then the user must be able to disable the key command, change the defined key to a non-printable key (Ctrl, Alt, etc.), or only activate the shortcut when an associated interface component or button is focused. Guideline 2.2 Provide users enough time to read and use content. 2.2.1 Timing AdjustableA 2.0 If a page or application has a time limit, the user is given options to turn off, adjust, or extend that time limit. This is not a requirement for real-time events (e.g., an auction), where the time limit is absolutely required, or if the time limit is longer than 20 hours. 2.2.2 Pause, Stop, HideA 2.0 Automatically moving, blinking, or scrolling content (such as carousels, marquees, or animations) that lasts longer than 5 seconds can be paused, stopped, or hidden by the user.Automatically updating content (e.g., a dynamically-updating news ticker, chat messages, etc.) can be paused, stopped, or hidden by the user or the user can manually control the timing of the updates. 2.2.3 No TimingAAA 2.0 The content and functionality have no time limits or constraints. 2.2.4 InterruptionsAAA 2.0 Interruptions (alerts, page updates, etc.) can be postponed or suppressed by the user. 2.2.5 Re-authenticatingAAA 2.0 If an authentication session expires, the user can re-authenticate and continue the activity without losing any data from the current page. 2.2.6 TimeoutsAAA 2.1 Users must be warned of any timeout that could result in data loss, unless the data is preserved for longer than 20 hours of user inactivity. Guideline 2.3 Do not design content in a way that is known to cause seizures. 2.3.1 Three Flashes or Below ThresholdA 2.0 No page content flashes more than 3 times per second unless that flashing content is sufficiently small and the flashes are of low contrast and do not contain too much red. (See general flash and red flash thresholds) 2.3.2 Three FlashesAAA 2.0 No page content flashes more than 3 times per second. 2.3.3 Animation from InteractionsAAA 2.1 Users can disable non-essential animation and movement that is triggered by user interaction. Guideline 2.4 Provide ways to help users navigate, find content, and determine where they are. 2.4.1 Bypass BlocksA 2.0 A link is provided to skip navigation and other page elements that are repeated across web pages.While proper use of headings or regions/landmarks is sufficient to meet this success criterion, because keyboard navigation by headings or regions is not supported in most browsers, WebAIM recommends a "skip" link in addition to headings and regions. 2.4.2 Page TitledA 2.0 The web page has a descriptive and informative page title. 2.4.3 Focus OrderA 2.0 The navigation order of links, form controls, etc. is logical and intuitive. 2.4.4 Link Purpose (In Context)A 2.0 The purpose of each link (or image button or image map hotspot) can be determined from the link text alone, or from the link text and its context (e.g., surrounding text, list item, previous heading, or table headers).Links with the same text that go to different locations are readily distinguishable. 2.4.5 Multiple WaysAA 2.0 Multiple ways are available to find other web pages on the site - at least two of: a list of related pages, table of contents, site map, site search, or list of all available web pages. 2.4.6 Headings and LabelsAA 2.0 Page headings and labels for form and interactive controls are informative. Avoid duplicating heading and label text unless the structure provides adequate differentiation between them. 2.4.7 Focus VisibleAA 2.0 There is a visible indicator for page elements when they receive keyboard focus. 2.4.8 LocationAAA 2.0 If a web page is part of a sequence of pages or within a complex site structure, an indication of the current page location is provided, for example, through breadcrumbs or specifying the current step in a sequence (e.g., "Step 2 of 5 - Shipping Address"). 2.4.9 Link Purpose (Link Only)AAA 2.0 The purpose of each link (or image button or image map hotspot) can be determined from the link text alone.There are no links with the same text that go to different locations. 2.4.10 Section HeadingsAAA 2.0 Beyond providing an overall document structure, individual sections of content are designated using headings, where appropriate. 2.4.11 Focus Not Obscured (Minimum)AA 2.2 When elements have keyboard focus, they are not entirely covered or hidden by page content. 2.4.12 Focus Not Obscured (Enhanced)AAA 2.2 When elements have keyboard focus, they are entirely visible. 2.4.13 Focus AppearanceAAA 2.2 If a custom focus indicator or background color is in place, the focus indicator pixels must:have at least 3:1 contrast between focused/unfocused statesbe at least as large as the area of a 2 pixel thick perimeter surrounding the element. The formula (width × 4) + (height × 4) = focus indicator area can be used for rectangular components. Guidelin'''
