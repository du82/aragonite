title = "WebAIM: Web Accessibility E-mail Discussion List"
full_description = '''Web Accessibility E-mail Discussion List You are here: Home > Community > E-mail Discussion List List Archives The WebAIM discussion group archives are available here. Ask the Experts Members of this list may be able to answer your Web accessibility questions... and you may hold the answer to someone else's question! About the Mailing List Important! The WebAIM web accessibility mailing list is for anyone interested in discussing web accessibility issues. Individuals from all organizations and specialties are encouraged to join. Please limit your comments and questions to web accessibility topics. Please maintain high standards of civility and courtesy toward other members of the listserv. WebAIM manages the list and reserves the right to remove any offending member from the listserv. Subscribe An easy way to subscribe is to use the form below. If you subscribe to the Regular Version, you will receive all of the messages as they are sent. If you subscribe to the Digest Version, you will receive only one email a day, with all of the day's messages. To switch between the Regular or Digest versions enter your e-mail address below to manage your subscription. Your email address: Your name (optional): You may enter a privacy password below. If you choose not to enter a password, one will be automatically generated and sent to you once you've confirmed your subscription. You can always request your password when you edit your personal options. Pick a password: Reenter password to confirm: Would you like to receive list mail batched in a daily digest? No Yes You can also subscribe by sending a blank email to webaim-forum-request@list.webaim.org, making sure that the word "SUBSCRIBE" or "SUBSCRIBE DIGEST" (for digest subscription) appears in the Subject line. If you have an e-mail client installed, you can select one of the following links to generate the e-mail: Subscribe to the WebAIM Forum | Subscribe to the WebAIM Forum - Digest Version Manage your Subscription To manage your subscription, including unsubscribing, getting a password reminder, changing to or from the digest version, or changing other subscription options, enter your e-mail address below: E-mail address: You can also unsubscribe by sending a blank email to webaim-forum-request@list.webaim.org, making sure that the word "UNSUBSCRIBE" appears in the Subject line. If you have an e-mail client installed, you can select the following link to generate the e-mail: Unsubscribe from the WebAIM Forum'''
