["https://webaim.org/services"]
title = "WebAIM: WebAIM Services"
full_description = "WebAIM Services You are here: Home > Services The WebAIM Strategy WebAIM provides a wide variety of services, but our goal is always the same—to expand the potential of the web for people with disabilities by empowering individuals and organizations to create accessible content. WebAIM services can include... Training WebAIM offers a variety of on-site and virtual training options, including: Web accessibility virtual training Zoom accessibility workshops Online Document Accessibility course Customized trainings for your organization Strategic Web Accessibility Workshops to help your organization implement system-level accessibility, including customized workshops focused on accessibility in design, technology procurement and use, and more. Accessibility in Technology Procurement and Use Workshop to provide insight into tools and processes that will help any organization, large or small, better account for accessibility when making decisions about purchasing or using third-party technology. We provide the knowledge, resources, and tools for your organization to meet its accessibility goals. Consulting Whether you are drafting wireframes, developing an accessibility policy, or implementing accessibility techniques and strategies, our expert staff can consult with you on-site or remotely. Evaluation Our team can inspect, audit, and evaluate a representative sample of pages from your site. Our website evaluation report will list the accessibility barriers we found, describe their impact on users, and recommend strategies for remediation. We can also evaluate designs, wireframes, and mockups to catch accessibility barriers before they find their way into your site or application. No matter where you are at in your accessibility journey, WebAIM can be a guide to help you through the process. Accessible Website Certification WebAIM can provide a conformance statement that documents the accessibility of your site to established benchmarks of accessibility, such as WCAG. What can WebAIM do for you? Please contact us to see how WebAIM can support your web accessibility efforts."
