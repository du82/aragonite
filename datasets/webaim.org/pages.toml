["https://webaim.org/contact"]
title = "WebAIM: Contact Us"
full_description = "Contact Us You are here: Home > Contact Us Your Name: Your E-mail Address: Subject: Choose a category... Website comments Evaluation, testing, or consultation Accessible documents online course Virtual and in-person training Web Accessibility in Mind conference WAVE accessibility tool questions or comments Other Message: Ignore this form element. It is used to detect spambots. If you enter anything into this text box, your message will not be sent. Phone: For information on conformance statements, website accessibility auditing/evaluation, or consultation, contact John at 435-797-2325. For virtual or on-site training, call Jon at 435-797-8284. For independent-study document accessibility course information, call George at 435-797-0974. For all other inquiries, call 435-797-7024. TDD 435-797-1981. Address: WebAIM Utah State University 6807 Old Main Hill Logan, UT 84322-6807 WebAIM Staff Jared Smith Jonathan Whiting George Joeckel John Northup Rob Carr Cynthia Curry Alaina Foust Cameron Lund Alyson Bell Claire Joeckel Jared Smith - Executive Director Phone: 435-797-7024 Send Jared an email Jared Smith is the Executive Director of WebAIM. He is a highly demanded presenter and trainer and has provided web accessibility training to tens of thousands of web professionals throughout the world. With over 25 years of experience working in the web design, development, and accessibility field, he brings a wealth of knowledge and experience that is used to help others create and maintain highly accessible web content. Much of his written work, including a broad range of tutorials, articles, and other materials, is featured on the WebAIM site. Jonathan Whiting - Director of Training Phone: 435-797-8284 Send Jonathan an email Jonathan is the director of training at WebAIM. His main passion is helping others learn to make the web more accessible to people with disabilities. With a master's degree in Instructional Technology and over 20 years of experience in the field of web accessibility, Jonathan has published dozens of articles, tutorials, and other instructional resources on the WebAIM site. He has traveled extensively to train thousands of web developers and other professionals who develop or maintain web content. George Joeckel - Online Training Program Manager Phone: 435-797-0974 Send George an email George manages the online training program at WebAIM. He has a master’s degree in instructional psychology and technology, and over 20 years of teaching experience. He has developed online courses at Utah State University since 2008, and he joined the WebAIM team at the end of 2015. The Accessible Documents video-based course launched in July 2018, and over 11,000 participants have enrolled in this independent-study training. George also conducts pre-conference workshops and delivers presentations at national conferences. John Northup - Director of Evaluation Phone: 435-797-2325 Send John an email John has worked in web development since 2000, in roles including design, coding, usability, and accessibility. He thrives on the challenge of facilitating delightful, engaging experiences for aural and visual users alike. He holds a master's in information science from the University of Michigan School of Information, an undergraduate degree in mass communications from Goddard College, and a CPACC certification from the International Association of Accessibility Professionals. Rob Carr - Strategic Accessibility Coordinator Send Rob an email Rob Carr is the Strategic Accessibility Coordinator at WebAIM. Rob has been in the digital accessibility space since 2010. He has spent loads of time training, consulting, and learning about digital accessibility topics large and small. Rob has worked with hundreds of individuals and dozens of organizations on everything from accessibility in a single PDF to integrating accessibility into organizations' digital strategies. Rob presents at national conferences, organizes the occasional conference, and tries to be more active and less snarky on LinkedIn. Cynthia Curry - Strategic Accessibility Advisor Send Cynthia an email Cynthia Curry is Strategic Accessibility Advisor for WebAIM. She has provided state, regional, and national training and technical assistance on digital accessibility since 2000. Starting her career as a secondary science teacher, she has enjoyed diverse roles in the pursuit of more accessible digital learning environments in preK–12 and higher education. With the Maine Department of Education’s Learning Technology Initiative (MLTI), she served as a Statewide Technology Integration Mentor for ten years, providing training to districts on making 1:1 technology programs accessible to learners who use assistive technology (AT). For Maine CITE, the state’s AT Act Program, she led statewide trainings during the early implementation of the National Instructional Materials Access Center (NIMAC) and the acquisition and use of accessible educational materials (AEM). At the University of Southern Maine, Cynthia was a lecturer and director of a five-year personnel development project funded by the Office of Special Education Programs (OSEP), Transforming Teaching through Collaborative Teacher Education. During this time, she founded the Maine Teacher Preparation Collaborative to help pre-service programs better prepare new general and special education teachers in the use of AT and AEM in instruction. Cynthia served as Disability Services Coordinator and an instructional designer at the University of New England before joining CAST’s technical assistance team in 2016. During seven years at CAST, she provided leadership to two OSEP-funded TA centers, the National AEM Center and the Center on Inclusive Technology & Education Systems (CITES). In 2024, Cynthia joined the Institute for Disability Research, Policy & Practice to bridge opportunities between WebAIM and the Center for Technical Assistance for Excellence in Special Education (TAESE) for new and innovative digital accessibility solutions for educational agencies. Alaina Foust - Web Accessibility Evaluator Alaina is originally from Pittsburgh, Pennsylvania, where she received a B.S. in information science from the University of Pittsburgh. Her interest in web accessibility touches on her passion for attention to technique and detail and a people-centered approach to web development. In her spare time she enjoys gardening, baking, and exploring the natural beauty of Utah. Cameron Lund - Software Engineer Cameron Lund is a Software Engineer specializing in web development. With a diverse background across multiple industries, Cameron brings a unique perspective to his work. He is passionate about building accessible and user-centered websites, ensuring that digital content is inclusive for everyone. Cameron's technical expertise, combined with his commitment to accessibility, helps create seamless online experiences for users of all abilities. Alyson Bell - Online Course Facilitator Send Alyson an email Alyson Bell is a Cache Valley native. She earned her BS in Family, Consumer, and Human Development at USU, and her MS in Family and Human Development at ASU. She joined the WebAIM team in the spring of 2019. In her free time she enjoys spending time with family, reading, cooking, and going on walks with her dog. Claire Joeckel - Web Accessibility Evaluator Claire earned her B.A. in English and Instructional Technology and Learning Sciences from Utah State University. Her goal is to make the world a better and more accessible place, one text contrast correction at a time. Outside of work, she loves nothing more than a good book (although a good meal is a strong contender)."
