["https://webaim.org/projects/screenreadersurvey10"]
title = "WebAIM: Screen Reader User Survey #10 Results"
full_description = '''Screen Reader User Survey #10 Results You are here: Home > WebAIM Projects > Screen Reader User Survey #10 Results Article Contents Introduction Demographics Region Age Disability Disability Types Screen Reader Proficiency Internet Proficiency Primary Desktop/Laptop Screen Reader Screen Readers Commonly Used Browsers Screen Reader / Browser Combinations Operating System JavaScript Reason for Use Screen Reader Satisfaction Home vs. Work Braille Output Free/Low-cost vs. Commercial Mobile Screen Readers Mobile Usage Mobile Platforms Mobile Screen Readers Used Primary Mobile Browser Mobile vs. Desktop/Laptop Usage Mobile App vs Web Site Usage Web Accessibility Progress Impacts on Accessibility Contacting Website Owners Social Media Accessibility Descriptions in Virtual Meetings Landmarks/Regions Finding Information Heading Levels Problematic Items /* The charts and graphs are generated by Google Charts, which are very cool, but, unfortunately, have rather poor accessibility. We use scripting to define the chart container as an image with alt text (<div role="img" aria-label="Chart alt text">). We then hide the SVG chart contents so they are not read by a screen reader. This allows us to provide basic accessibility to the charts. A data table provides the full data for each chart. */ // Load the Visualization API and the corechart package. google.charts.load('current', {'packages':['corechart']}); google.charts.setOnLoadCallback(regionRegion); google.charts.setOnLoadCallback(ageRegion); google.charts.setOnLoadCallback(disabilityRegion); google.charts.setOnLoadCallback(disabilitiesRegion); google.charts.setOnLoadCallback(proficiencyRegion); google.charts.setOnLoadCallback(internetRegion); google.charts.setOnLoadCallback(primaryRegion); google.charts.setOnLoadCallback(usedRegion); google.charts.setOnLoadCallback(browsersRegion); google.charts.setOnLoadCallback(osRegion); google.charts.setOnLoadCallback(javascriptRegion); google.charts.setOnLoadCallbac