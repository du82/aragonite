["https://webaim.org/features"]
title = "WebAIM: Features"
full_description = "WebAIM Features You are here: Home > WebAIM Features Celebrating WebAIM's 25th Anniversary WebAIM began in October, 1999. We reflect on the past 25 years and look forward to improved accessibility in the future. Read more about WebAIM's 25th anniversary The WebAIM Million - 2024 Update This year's automated WAVE analysis of the home pages for the top one million web sites is now available. This research is supported in part by BrowserStack. Read the WebAIM Million report WebAIM Screen Reader User Survey The results of the 10th WebAIM Screen Reader User Survey are available. This survey is supported in part by BrowserStack. Review the Screen Reader User Survey Results The WebAIM Strategic Accessibility Framework Accessibility requires strategic vision and planning. This framework provides a structure for implementing and assessing organizational accessibility. The WebAIM Strategic Accessibility Framework The WebAIM Million - 2023 Update An automated WAVE analysis of the home pages for the top one million web sites shows widespread accessibility issues. Read the WebAIM Million report Creating a Community that Values Accessibility One of the more effective ways to help an organization make digital accessibility a closely held value is to approach the effort as a community-building experience. Read the Creating Accessibility Communities article Web Accessibility Evaluation Guide A guide to using free tools—including WAVE—to conduct a comprehensive web accessibility evaluation. Web Accessibility Evaluation Guide Screen Reader User Survey #9 The results of WebAIM’s 9th Screen Reader User Survey are now available. These data provide insight into the preferences and technology usage of screen reader users. Read the survey results The WebAIM Million - 2021 Update An automated WAVE analysis of the home pages for the top one million web sites shows widespread accessibility issues. Read the WebAIM Million report Survey of Web Accessibility Practitioners Results from WebAIM's 3rd Survey of Web Accessibility Practitioners are now available. View the Practitioners Survey Results Scholarship Program for WebAIM's Accessible Documents Course All individuals with a disability may enroll in the Accessible Documents: Word, PowerPoint, & Acrobat course without cost through WebAIM's scholarship program. Apply for the scholarship Significant WAVE Updates A new version of the WAVE suite of web accessibility testing tools has been released. This update now gives you more power, more flexibility, and a fresh new interface. Read about the WAVE updates Contrast and Color Accessibility This new WebAIM article goes in-depth into understanding and testing color and contrast for WCAG conformance. Read the color and contrast article Survey of Users with Low Vision #2 The results of this survey for people with low vision provide insight and data to better support accessibility best practices. Read the low vision survey results Survey of Web Accessibility Practitioners #2 This survey collected information from those who implement web accessibility. The responses inform accessibility data and best practices. Read the practitioner survey results Screen Reader User Survey #7 Results from the 7th in our series of Screen Reader User Surveys are available. Read the screen reader user survey results To ARIA! The Cause of, and Solution to, All Our Accessibility Problems Examples of common correct and incorrect ARIA usage. Read the blog post Screen Reader User Survey #6 Responses to the July 2015 survey are now available. View the screen reader user survey results Survey of Web Accessibility Practitioners The results of WebAIM's Survey of Web Accessibility Practitioners are now available. View the survey results New Screen Reader User Survey A results of the fifth in our series of Screen Reader User Surveys are now available. Read the Screen Reader User Survey Results New WebAIM Website A new WebAIM website has been launched. Read more about the site updates and new features in our blog post. Read more about the new WebAIM site Low Vision and Motor Disabilities Surveys Results of WebAIM's Survey of Users with Low Vision and Survey of Users with Motor Disabilities are now available. The results of these surveys are of great interest and can be used to inform design and development choices for those creating accessible web content. Low Vision Survey ResultsMotor Disability Survey Results Screen Reader Survey The results of the fourth WebAIM screen reader user survey are now available. The survey results provide invaluable data for web developers, disability advocates, and standards bodies. View the Survey Results Infographic: Web Accessibility for Designers This new infographic highlights a few important principles of accessible design. View the Infographic Using VoiceOver to Evaluate Web Accessibility VoiceOver is a screen reader on Apple computers, iPhones, iPads, and iPod Touches. This article teaches the basics of using VoiceOver to evaluate the accessibility of web content. Read Using VoiceOver to Evaluate Web Accessibility Evaluating Cognitive Web Accessibility This article provides a brief overview of cognitive web accessibility and a checklist of items to implement to ensure your web content is accessible to users with cognitive or learning disabilities. Read Evaluating Cognitive Web Accessibility Using NVDA to Evaluate Web Accessibility This article provides an overview for beginners on using NVDA to evaluate the accessibility of web content. NVDA is a free, open source screen reader for Windows. Read Using NVDA to Evaluate Web Accessibility Screen Reader Survey Results WebAIM conducted a survey of preferences of screen reader users. With over 1100 responses, this survey provides great insight into the demographics and preferences of screen reader users. View the Screen Reader Survey Results WCAG 2.0 Checklist This checklist is intended to be an easy-to-use, understandable checklist for evaluating or implementing the Web Content Accessibility Guidelines 2.0. The language in the checklist is significantly simplified from the actual WCAG 2.0 language published by the W3C. This checklist will make implementing and evaluating WCAG 2.0 much easier. View the WCAG 2.0 Checklist Accessibility of Rich Internet Applications This article provides an overview of ARIA (Accessible Rich Internet Applications) and demonstrates how it can be used to resolve many of the accessibility issues found in dynamic, complex web applications and widgets. Additional ARIA documentation and examples will be coming to the WebAIM site in the near future. Read Accessibility of Rich Internet Applications Web Accessibility Gone Wild This article presents a wide variety of mistakes, misconceptions, over-indulgences, intricacies, and generally silly aspects of modern accessibility. Read Web Accessibility Gone Wild Using JAWS to Evaluate Web Accessibility Evaluating the screen reader accessibility of web content is important. Screen readers, however, can be complex and difficult to use, especially for novice users. This article provides an overview for beginners on how to use screen readers for evaluating the accessibility of web content. Read Using JAWS to Evaluate Web Accessibility WebAIM Training February 2009 Training Dates Now Available! Join WebAIM's accessibility experts in two days of intensive, hands-on web accessibility training February 18-19, 2009 in beautiful Logan, Utah. Learn everything from basic web accessibility principles to advanced accessibility techniques. Learn what you need to know to ensure that you and your website meets legal guidelines and international standards. Registration is limited to ensure you get individualized attention. Find out more or register Updated Introduction to Web Accessibility We recently updated our popular introduction to accessibility. It highlights the web's potential to empower people with disabilities, the frustrations they feel when they cannot access the web, and what you can do to make your sites more accessible. This is a great resource for anyone who is new to web accessibility. Read the introduction to Web Accessibility Appropriate Use of Alternative Text Adding alternative text for images is the first principle of web accessibility. It is also one of the most difficult to properly implement. This article presents the basics of alternative text and showcases many examples of proper implementation. These recommendations come from our understanding of accessibility standards and screen-reader users. Read the Alternative Text article Section 508 Checklist Updated The WebAIM Section 508 checklist has been one of our most popular resources since 2001. Although most accessibility principles haven't changed in the last five years, there have been some changes in assistive technologies, conventions and best practices. The Section 508 Checklist has recently been updated with these changes in mind. View the updated Section 508 Checklist Usable and Accessible Form Validation and Error Recovery Form validation is the process of testing to ensure that end users enter necessary and properly formatted information into web forms. Error recovery is the process of guiding the user through fixing missing or improper information as detected by form validation. There are several methods of performing form validation and error recovery. Read the Form Validation and Error Recovery Article"
