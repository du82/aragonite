["https://webaim.org/training/virtual"]
title = "WebAIM: Virtual Web Accessibility Training - April 8–9"
full_description = "Virtual Web Accessibility TrainingApril 8–9 You are here: Home > Services > WebAIM Training WebAIM Web Accessibility Virtual Training When: April 8–9, 2025; 12–5pm Eastern (9am–2pm Pacific) Where: Online via Zoom Cost: $500/person ($400 each for groups of two or more) Join WebAIM's accessibility experts for two days of virtual web accessibility training. This training will provide the resources and information you need to empower your organization to meet all your future accessibility needs. This training session will teach basic web accessibility principles and advanced accessibility techniques. Learn what you need to know to ensure that your web site meets international guidelines and legal requirements. This training is primarily suited for web developers, though it will be valuable for designers, program managers, quality assurance experts, or anyone interested in gaining a deep understanding of web accessibility. A basic understanding of HTML is recommended. Training participants receive a complimentary enrollment for WebAIM's Document (Word, PowerPoint, and PDF) Accessibility online course—a $125 value. Registration is limited to ensure individualized attention, so register now to secure your place. There are currently 27 registrations remaining. Register now FAQ How is this similar to your in-person training? Both events are live training events with an emphasis on interaction and participation. Questions and interaction are encouraged, and we keep our group size small—25 participants for the in-person training and 35 participants for virtual training. How is it different? The virtual training is shorter— about 8 hours vs. almost 13 hours of training for in-person training. The same general topics will be covered in both trainings, but with less detail in the virtual option (especially testing activities, user experience, and deeper ARIA). The in-person training also has more interaction with trainers and other participants, especially if you choose to participate in pre-training tour and dinners. It has been our experience that hybrid events (a mix of in-person and virtual participants in one event) is usually less effective for one or both groups. Instead, we host events that are optimized for each group. We can provide customized in-person training training at your location. What is Training Plus? As part of a training registration, you will have the option to secure 3 hours of one-on-one time with WebAIM staff at a discounted price of $575. You can use this time for additional training, a mini-evaluation, or other consultation (in up to 2 separate engagements). Additional details are available during registration. What other training options do you have? If you are looking for organizational or system change work in accessibility, you may want to consider our Strategic Accessibility Workshop. We also offer customized in-person or virtual training on just about any topic related to web or document accessibility. Will the training be archived? Since this is an interactive training and not a webinar, an archived version will not be available. What will I need to participate? A reliable internet connection—we will provide this training over Zoom for optimal accessibility, interaction, and engagement. A microphone is strongly recommended because you will have opportunities to speak and ask questions. A webcam is also recommended—we hope you will feel comfortable sharing your video to allow more personal interactions. Will the training be accessible? We have been providing online training for years and know what it takes to create an accessible online experience. The event will have automatic captions, and we will be happy to work with you before the event to address any accessibility needs or concerns that you might have. What if we have a group of people participating in the same room? A registration is for a single person. Multiple registrants may share a single Zoom connection, though we recommend that each person have a connected computer so they can ask questions and participate in activities. We also offer customized training, or you can contact us to discuss other group training options. What is your cancellation policy? We offer a full refund for a cancellation more than 5 days before the event. There is a $100 fee for a cancellation within 5 days of the event. No-shows can request a refund, minus a $250 fee, up to a week after the missed event. Register now Training Outline The training will be held over two days. Each day, we will meet 12–2pm Eastern, take a one-hour break, and then finish 3–5pm. This schedule should be convenient for participants throughout the Continental United States. WCAG Structure of WCAG 2 Brief overview of relevant laws Screen reader users How screen readers work Headings Page Title Regions and Landmarks Lists Links Tables Document language Alternative text WCAG label and name Forms (labels, fieldset/legend) Visual disabilities Zooming content Contrast Color reliance Auditory disabilities and media accessibility Captions and transcripts Audio description Accessible screen sharing Photosensitive epilepsy Cognitive and learning disabilities Understandable content Legible text Animating and time-sensitive content Motor disabilities Mouse, touch, and voice control Keyboard navigation Mobile accessibility Hiding content with CSS Skip links Contrast of user interface components Cognitive and learning disabilities Understandable content Legible text Animating and time-sensitive content Evaluating web accessibility Principles and methodologies for evaluation and user testing WAVE and other automated tools Keyboard testing Screen reader testing The last session of the training will be split into two breakout groups: Advanced topics Rules of ARIA use Form label, title, and placeholder ARIA labels and descriptions Form errors Tabindex and scripting ARIA widgets ARIA roles, states, and properties OR Document Accessibility Overview Creating accessible Microsoft Word documents Converting Office documents to PDF PDF principles PDF evaluation and repair in Acrobat Pro Register now Need Help or Have Questions? If you have any questions regarding the workshop or the registration process, please contact us."
