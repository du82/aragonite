["https://webaim.org/community"]
title = "WebAIM: Community"
full_description = '''WebAIM Community You are here: Home > Community WebAIM's goal is to help make the web more accessible to individuals with disabilities. We can't do that on our own. Since 1999, we have helped build a large community of developers, web masters, individuals with disabilities, and others who share this goal with us. In the sharing of resources and information, the web accessibility community benefits. WebAIM provides several ways for you to both learn and share with others. E-mail Discussion List With over 1000 subscribers, the WebAIM list is one of the largest accessibility discussion lists available. The list was started in 1999 and the list archives contain a wealth of information. With subscribers who range from the foremost accessibility experts to those just beginning in web accessibility, the list is an excellent resource for anyone. You can subscribe with the options to get individual e-mail messages as they are posted by subscribers or you can receive your messages in a digest format that will be sent to you once a day. Join the WebAIM E-mail Discussion List or view the list archives Most recent discussion threads: Is it no longer necessary to use tabindex="-1" to allow JavaScript focus movement?Quick question on zoom testingQuery on Zoom Testing in Mobile BrowserQuery Regarding BITV 2.2 and WCAG 2.1 Standards ComplianceCan you remove link underlines and focus indicators in PDF documents? Newsletter Our monthly email newsletter is a great resource to help you keep up-to-date on what's new in the accessibility field. We provide featured accessibility articles, news, tips & tricks, and resources & tools, all in your inbox once a month. Subscribe to the WebAIM Newsletter or view the newsletter archives Blog The WebAIM staff uses the blog to keep the community up-to-date on our own findings and what is happening in the accessibility community. It's our place to share our thoughts and discoveries about web access, technology standards, and the sometimes wild and crazy field of web accessibility. It's also a place for you to share your thoughts with us. Read the blog or get the RSS feed Twitter Join us on twitter at @WebAIM. Read our Tweets'''
year_published = 2025
