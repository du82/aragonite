["https://webaim.org/projects/million"]
title = "WebAIM: The WebAIM Million - The 2024 report on the accessibility of the top 1,000,000 home pages"
full_description = '''The WebAIM MillionThe 2024 report on the accessibility of the top 1,000,000 home pages You are here: Home > WebAIM Projects > The WebAIM Million Article Contents Introduction The Sample Methodology Detected Errors Home Page Complexity WCAG Conformance Low Contrast Text Images and Alternative Text Form Labeling Headings Regions ARIA Links Skip Links Doctypes Site Categories TLDs Languages Technologies Content Management Systems and Site Builders JavaScript Frameworks JavaScript Libraries Web Frameworks Ecommerce Platforms Advertisement Networks Other Technologies Conclusion /* The charts and graphs are generated by Google Charts, which are very cool, but, unfortunately, have rather poor accessibility. We use scripting to define the chart container as an image with alt text (<div role="img" aria-label="Chart alt text">). We then hide the SVG chart contents so they are not read by a screen reader. This allows us to provide basic accessibility to the charts. A data table provides the full alternative data for each chart. */ // Load the Visualization API and the corechart package. google.charts.load('current', {'packages':['corechart']}); // Disabilities function wcagRegion() { var data = new google.visualization.DataTable(); data.addColumn('string', 'WCAG Failure'); data.addColumn('number', '% of Pages'); data.addColumn({ type: 'string', role: 'style' }); data.addRows([ ['Low contrast text', 81.0, 'red'], ['Missing alternative text', 54.5, 'blue'], ['Missing form labels', 48.6, 'green'], ['Empty links', 44.6, 'IndianRed'], ['Empty buttons', 28.2, 'orange'], ['Missing document language', 17.1, 'purple'] ]); var options = { width:700, height:350, title:"Home pages with most common WCAG failures (% of home pages)", legend: 'none', vAxis: {format:'#\'%\''} }; var chart = new google.visualization.ColumnChart(document.getElementById('wcag_div')); chart.draw(data, options); $("#wcag_div").attr("aria-label","Bar chart showing percent of home pages with common WCAG failures."); } google.charts.setOnLoadCallback(wcagRegion); Introduction For the sixth consecutive year, WebAIM conducted an accessibility evaluation of the home pages for the top 1,000,000 web sites. The evaluation was conducted using the WAVE stand-alone API (with additional tools to collect site technology and sector data). The results provide an overview of and insight into the current state of web accessibility for individuals with disabilities as well as trends over time. Note! Results below are from February 2024—with comparisons to, and trends from, earlier analyses in 2019, 2020, 2021, 2022, and 2023. Supported by BrowserStack Support for this research is funded in part by a donation from The Sample Site Lookup How did your home page rank in our study? Enter a web site domain below to view details. Domain name: The million home page list was derived from the Tranco ranking which combines several sources of "top" web sites. Sites without home pages, pages that returned errors (404, etc.), pages with fewer than 10 HTML elements, and pages with more than 5,000 links to the same domain (for SEO purposes) were not included. Methodology The WAVE accessibility engine was used to analyze the rendered DOM of all pages after scripting and styles were applied. WAVE detects end-user accessibility barriers and Web Content Accessibility Guidelines (WCAG) conformance failures. All automated tools, including WAVE, have limitations—not all conformance failures can be automatically detected. Absence of detected errors does not indicate that a page is accessible or conformant. Although this report describes only a subset of accessibility issues on only 1,000,000 home pages, this report provides a quantified and reliable representation of the current state of the accessibility of the most influential pages on the web. Note! The Tranco list of top web sites was used for the 2024 sample. While the methodology and sources for Tranco are very similar to those used by the WebAIM Million in previous years, the Tranco sample includes only pay-level domains, meaning domains that can be directly registered, not including sub-domains. This year's sample covered a broader swath of the web with fewer infrastructural domains that users would not view, such as CDNs, image and data servers, APIs, etc. This minor change to sampling, plus more comprehensive tests in WAVE, may account for some of the changes described below. Detected Errors Across the one million home pages, 56,791,260 distinct accessibility errors were detected—an average of 56.8 errors per page. The number of detected errors increased notably (13.6%) since the 2023 analysis which found 50 errors/page. "Errors" are WAVE-detected accessibility barriers having notable end user impact, and which have a very high likelihood of being WCAG 2.2 Level A/AA conformance failures. This chart shows the average number of detectable errors per home page over time: Home Page Complexity The home pages tested had nearly 1.2 billion page elements. Home page complexity increased significantly in 12 months, from an average of 1050 elements in February 2023 to an average of 1173 elements per home page in February 2024—an 11.8% increase. The following chart shows the number of home page elements detected over the last six WebAIM Million studies: The number of home page elements increased 11.8% since 2024, and has increased 50% in the last 5 years. 4.8% of all home page elements had a detected accessibility error. Users with disabilities would expect to encounter errors on 1 in every 21 home page elements. Note! Error density (number of errors divided by number of page elements) is provided in the site lookup, but is an unreliable metric of site accessibility. A significant number of page elements (<div> and <span> elements, for example) may result in a lower error density (suggesting better accessibility), when in fact many new accessibility errors may have also been introduced. This report focuses on average number of detected errors—likely end user barriers—present as opposed to error densities (how diluted those errors are within page elements). There was a correlation between page popularity and home page complexity. The top 100,000 pages averaged 1,424 elements—45% more page elements than the last 100,000 sites in the sample (980 elements). WCAG Conformance 95.9% of home pages had detected WCAG 2 failures. This improved slightly from 96.3% in 2023. Over the last 5 years, the pages with detectable WCAG failures have decreased by only 1.9% from 97.8%. These are only automatically detected errors that align with WCAG conformance failures with a high level of reliability which suggests that the rate of full WCAG 2 A/AA conformance was certainly lower. This chart shows the percentage of home pages with detected WCAG conformance failures over time: While the rate of pages with no detectable errors was very low, 22.2% of pages had 5 or fewer detected errors and 31.2% had 10 or fewer. Over the last several years the proportion of pages with fewer errors has increased while the number of pages with many errors has also increased—pages with fewer errors have gotten better while pages with many errors have gotten worse. Home pages with most common WCAG 2 failures WCAG Failure Type% of home pages Low contrast text81.0% Missing alternative text for images54.5% Missing form input labels48.6% Empty links44.6% Empty buttons28.2% Missing document language17.1% 96.4% of all errors detected fall into these six categories. These most common errors have been the same for the last 5 years. Addressing just these few types of issues would significantly improve accessibility across the web. Over time the number of pages with low contrast text, missing alternative text, empty links, and missing document language has decreased while the number of pages with missing form input labels and empty buttons has been largely unchanged. Low Contrast Text Low contrast text, below the WCAG 2 AA thresholds, was found on 81% of home pages. This was the most commonly-detected accessibility issue. On average, each home page had 34.5 distinct instances of low-contrast text, up 13.7% from 30.4 in 2023. Images and Alternative Text Home pages are becoming increasingly graphical. There were over 55.6 million images in the sample, or 55.6 images per home page on average, a 28% increase over the last year. 21.6% of all home page images (12 per page on average) had missing alternative text (not counting alt=""). 43% of the images missing alternative text were linked images—resulting in links that were not descriptive. One out of every four linked images was missing alternative text. 14.6% of images with alternative text had questionable or repetitive alternative text—such as alt="image", "graphic", "blank", a file name, etc., or alternative text identical to adjacent text or the alternative text of an adjacent image. These data show that one may expect one third of the images on popular home pages to have missing, questionable, or repetitive alternative text. Form Labeling The number of form inputs on home pages has nearly doubled in 5 years, with a notable increase of 22.6% in the last year, from 5.0 million to 6.2 million. 35.5% of form inputs identified were not properly labeled (either via <label>, aria-label, aria-labelledby, or title). Headings 23.8 million headings were detected (nearly 24 on average per home page). The number (and prevalence) of heading levels were: 1.5 million <h1> headings (6.4%) 7.3 million <h2> headings (30.5%) 8.6 million <h3> headings (36.3%) 3.7 million <h4> headings (15.6%) 1.8 million <h5> headings (7.5%) .9 million <h6> headings (3.7%) The number of headings present on analyzed home pages decreased 4% from 24.8 million in 2023 reversing a trend of increases the previous four years. Because headings are the primary mechanism used by screen reader users to navigate content, their proper implementation is important. 16.8% of home pages had more than one <h1>—a decrease from 20.1% in 2023. There were 1,058,992 instances of skipped heading levels (e.g., jumping from <h2> to <h4>)—one in every 22 headings. Skipped heading levels were present on 37.9% of all pages, down from 42.2% in 2023. 11.3% of pages had no headings present at all, up from 7.9% in 2023. Regions 76.7% of home pages had at least one region (or ARIA landmark) defined—a decrease from 80.9% in 2023 (though an increase from all previous years). A <main> element or main landmark was present on 39.1% of home pages, down slightly from 41.5% in 2023 (though an increase from all previous years). 15.5% of home pages had a "search" landmark, down from 21% in 2023. ARIA 89,050,856 ARIA attributes were detected—89 per page on average! ARIA code usage increased 15% in just one year and has more than quadrupled since 2019. This chart shows the number of ARIA attributes per home page over time: The prevalence of ARIA labels and descriptions increased 26% in just the last year. Home pages averaged 19.2 aria-label, aria-labelledby, or aria-describedby attributes. 74.6% of the one million home pages used ARIA (excluding ARIA landmark roles). Home pages with ARIA present averaged 34.2% more detected errors than those without ARIA—one would expect to encounter an additional 15 potential barriers on home pages with ARIA present. Increased ARIA usage on pages was associated with higher detected errors. The more ARIA attributes that were present, the more detected accessibility errors could be expected. This does not necessarily mean that ARIA introduced these errors (these pages are more complex), but pages typically had more errors when ARIA was present. 6.7% of home pages had an ARIA menu (role="menu", up from 5% in 2023), but 28% of ARIA menus introduced accessibility barriers due to the lack of necessary ARIA menu markup and interactions. Home pages also averaged 15.5 aria-hidden="true" attributes (up from 13.7 in 2023, 11.0 in 2022, 8.9 in 2021, and 6.6 in 2020) and 3.1 role="button" attributes (down from 3.4 in 2023, but up from previous years). Home pages averaged 23.1 instances of tabindex=0 or tabindex=-1 (up 16% from 19.9 in 2023 and up 95% from 2020). Links 13.2% of pages had ambiguous link text, such as "click here", "more", "continue", etc. (a decrease from 17.3% of pages in 2023). These pages had 6.3 instances of ambiguous links on average. Skip Links 13.3% of home pages had a "skip" link present, down from 17.2% in 2023. One out of every 10 "skip" links were broken—either they were hidden in a way that made them inaccessible or the link target was not present in the page. Doctypes 91.6% of home pages had a valid HTML5 doctype—an increase from 89.8% in 2023, 86.1% in 2022 and 79.1% in 2021. Pages with a valid HTML5 doctype had significantly more page elements (average of 1213 vs. 745) and detectable errors (average of 57.1 vs. 53.2) than pages with other doctypes. 511 unique doctypes were encountered in the million-page sample. Site Categories Note! We're grateful for the support of webshrinker.com for providing us the site category data. Their support makes this valuable information available. The one million home pages were categorized based on content into IAB Content Taxonomy categories. The table below shows the average number of errors in each category and the percent difference in errors for that category from the average of 56.8 errors for the entire million-page sample. In other words, the percentage difference is how much better or worse that category is than the average home page. CategoryAvg. # of errors% difference Government35.7−37.2% Social Media40.9−28.0% Technology & Computing41.8−26.4% Law, Government, & Politics43.1−24.1% Business44.3−22.0% Society44.8−21.0% Education48.3−15.0% Careers48.9−13.8% Personal Finance49.2−13.4% Family and Parenting50.8−10.6% Science50.9−10.4% Food and Drink51.6−9.1% Health and Fitness51.7−9.0% Religion and Spirituality58.7+3.3% Arts and Entertainment60.4+6.3% Travel64.7+13.8% Hobbies and Interests66.2+16.5% Pets66.3+16.7% Automotive66.5+17.1% Home and Garden67.6+19.1% News/Weather/Information69.5+22.3% Adult Content72.9+28.3% Real Estate75.1+32.2% Style & Fashion77.3+36.1% Shopping83.3+46.6% Sports84.9+49.4% There were notable differences in accessibility errors for sites in different categories. Sports, shopping, style & fashion, real estate, and adult content home pages, for example, had over twice the number of errors on average as governmental web sites. TLDs 1068 unique top-level domains (e.g., com, .tv, .fashion, etc.) were represented in the million pages analyzed. The table below shows select TLDs with home page counts, average number of errors per home page, and percentage difference from the average of 56.8 errors for the entire million-page sample. TLD# of home pagesAvg. # of errors% difference gov1,61120.3−64.2% edu3,25726.0−54.2% us2,51534.2−39.7% ca5,38635.6−37.3% uk15,38841.7−26.6% org41,10742.0−26.1% info7,95244.7−21.3% au7,53348.7−14.3% ne'''
