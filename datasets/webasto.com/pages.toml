["https://webasto.com/en-int/cooling.html"]
title = "Cooling solutions from Webasto"
description = "Rooftop air-conditioning systems from Webasto are installed on the vehicle roof. Thanks to the latest compressor technology, they air-condition the vehicle interior reliably and efficiently. Some models can also heat."
full_description = "Cooling solutions Jump to section Rooftop air-conditioning Parking coolers Transport refrigeration Air filtration systems Marine air-conditioning Cooling for campers Home Air-conditioning systems and refrigerators from Webasto provide reliable and efficient temperature control for vehicle interiors and food when traveling. The wide range of rooftop air-conditioning systems, integrated air-conditioning systems and parking coolers leaves nothing to be desired when traveling to warm and hot regions - whether in vans, trucks, camping vehicles or boats. Webasto also offers various individual solutions for cooling goods such as medicines, plants and more. Refrigerators and freezers are available in versions ranging from very small to really large. HEPA-standard filtration systems ensure that the air in vehicle interiors is kept clean. Rooftop air-conditioning systems Rooftop air-conditioning systems Efficient cooling Rooftop air-conditioning systems from Webasto are installed on the vehicle roof. Thanks to the latest compressor technology, they air-condition the vehicle interior reliably and efficiently. Some models can also heat. Learn more Compact and efficient The main components of Webasto air-conditioning systems are housed in a compact casing. They are quick and easy to install on the vehicle roof. The rooftop air-conditioning systems from Webasto are available in various performance levels. Parking coolers Parking coolers Engine-independent cooling The powerful Webasto parking coolers provide pleasantly cool air in parked trucks. They work when the engine is switched off, thus saving fuel. Learn more Lightweight and flat design The systems combine high performance with a lightweight and flat design for easy installation and fuel efficiency. Integrated air-conditioning systems Integrated air-conditioning systems Cooling systems for buses and commercial vehicles These air-conditioning systems from Webasto can be individually installed in vehicles. In addition to a wide range of standard products, Webasto also offers customized system solutions. Learn more Individual system placement All components are seamlessly integrated into the vehicle and can be adapted to individual requirements. A versatile accessory set optimizes installation in the vehicle. Transport refrigeration Transport refrigeration Fresh goods at all times Webasto transport refrigeration systems are powerful and efficient at the same time. Depending on requirements, there are rooftop and integrated as well as battery and direct-driven units. Learn more Versatile cooling systems The transport refrigeration systems from Webasto are suitable for the delivery of fresh goods (> 0 °C) and frozen goods (< 0 °C). They are available in various power ratings up to 3,660 W. An optional stand-by function enables operation independently of the engine. Air filtration systems Air filtration systems Clean air for everyone on board Highly efficient HEPA air particulate filters prevent the spread of airborne bacteria and viruses in ambulances, buses and other vehicles for patient and passenger transportation. Learn more Safety during ambulance transports With 99.995% particle removal in the air, the Webasto HEPA filter system ensures a safer environment for rescue workers and reduces the risk of infection in critical situations. Marine air-conditioning systems Marine air-conditioning systems Individual boat air-conditioning as required The air-conditioning systems for boats and yachts from Webasto range from compact air-conditioning systems to large cooling units with a cooling capacity of 6,000 to 1,000,000 BTU/h. Learn more Cooling solutions for camping vehicles Cooling solutions for camping vehicles Fridges and air-conditioning for camping vehicles of all sizes As retrofit units for camping enthusiasts or integrated solutions for motorhome and caravan manufacturers, Isotherm refrigerators and freezers cool food while traveling. In the form of a drawer, box or cabinet - all appliances cool efficiently with the latest compressor technology. In addition, air-conditioning systems ensure a comfortable climate in camping vehicles. Learn more Control elements for cooling systems Control elements for cooling systems Air-conditioning control There is a wide range of controls available for Webasto air-conditioning systems. Learn more Downloads Air-conditioning solutions - Catalog Get the complete catalog of air-conditioning solutions offered by Webasto. Size 9 MB Format application/pdf Download Air-conditioning solutions accessoires - Catalog Our accessories catalog on air-conditioning solutions gives an overview of the complete range of accessories for our air-conditioning systems. Size 81 MB Format application/pdf Download Find your dealer Find your nearest Webasto dealer quickly and easily or arrange your consultation appointment directly. Find my dealer More solutions Products and Solutions Heating The versatile heating solutions from Webasto are suitable for cars, buses, trucks, special vehicles, boats and motorhomes. Reliable and high quality - Webasto heating solutions always provide the best comfort. More about Products and Solutions Battery With individually manufactured battery solutions as well as our modular, standardized battery system, we can meet a wide variety of customer requirements. Durability, safety and performance are a matter of course for us and guarantee sustainable solutions for clean mobility. More about Products and Solutions Roof With innovative roof systems Webasto creates pure joy and driving fun. As an all-roof company, we serve the entire technological diversity from the fixed or openable panoramic roofs and convertibles to roof solutions for autonomous driving. Innovative high-tech glass in all roof systems makes driving a special experience. More about Previous Next The Group / Responsibility Supplier Management Evolutions Automotive trends Electromobility is transforming vehicle design, favoring clean lines, large glass, and high-tech features. Webasto is leveraging this shift to create innovative roofs for enhanced comfort and design in driving. More about Digitalization With our extensive expertise in mechatronics, we develop pioneering solutions tailored to the changing needs of modern industry. At the heart of our vision are state-of-the-art factories where the well-being and satisfaction of employees and customers are paramount. More about Electrification Get ready for the electric revolution! As electric vehicles take over our streets, Webasto, a pioneer in innovation and technology, is at the forefront. Discover our cutting-edge solutions for a sustainable future in electromobility, shaping the way we drive today and beyond. More about"
