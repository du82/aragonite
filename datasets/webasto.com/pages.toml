["https://webasto.com/en-int/career.html"]
title = "Webasto Career - Open Up New Career Perspectives"
description = "Experience future mobility with Webasto—where comfort, sustainability, and team respect converge for a joyous drive into a safe and vibrant future. Join us for a culture of teamwork, personal growth, and opportunities."
full_description = '''Your Career at Webasto Jump to section Shaping the future Culture & Values Initiatives Our benefits How we work Locations Home Career Webasto is a global leader in roof, heating and cooling systems for all types of vehicles, as well as battery systems for electric mobility. We are known for our innovative spirit and collaborative culture, and we're proud to be the trusted partner of almost all automobile manufacturers. At Webasto, we are all on first name terms - from young professionals to the CEO. The "Du" stands for our mutual appreciation and at the same time it is also part of our feedback culture. Join us and become a part of the tradition and innovation! Become a part of our team! Getting started Job listings You want to check out our exciting career opportunities directly? You are just one click away from our job portal. Take your chance now and shape the mobility of the future with us. To the job portal Group of young business people working together on a project. Networking. Startup concept How we shape the future of mobility Autonomous driving Electromobility High-tech glass Future Factory Autonomous driving Smart solutions for driverless driving Reliably detecting the surroundings, recognizing obstacles and danger in all weathers, ensuring safety for all road users and pedestrians - the transition from the classic to the autonomous vehicle presents car manufacturers with completely new challenges. Camera, radar and lidar technologies offer the technical possibilities for that, but only the ideal positioning of these sensor systems makes the result perfect. Electromobility Electrifying solutions At Webasto, we are convinced that the future belongs to electromobility. That is why we are using our automotive technology expertise to drive forward the development of batteries and thermo management solutions for passenger cars, commercial and off-highway vehicles. Through a consistent future-oriented focus and constantly new innovations, Webasto has held a leading position in the automotive industry for over 90 years. High-tech glass Get fascinated By day, panoramic roofs from Webasto offer generous views and an interior ambience that is bright and pleasant. At night, dynamic light effects create a real wow effect. The secret: a transparent print is integrated into the pane, which is virtually invisible during the day and provides a view of the sky. With light control, a wide variety of patterns – from geometric figures to a starry sky – can be realized in the glass in many colors, leaving plenty of scope for individual customer wishes. Future Factory Smart, connected and automized At Webasto, the concept of a 'Future Factory' encompasses more than production lines and processes. The supply chains, plants, machines and, of course, our employees are also part of the Webasto factory of the future. In all these areas, Webasto is focusing on automation and digitalization, with the goal of having modern, well-positioned plants. Culture & Values Our Webasto employees come from different cultures and we have worked together to develop these values. Across national borders, these five values provide orientation for our cooperation with colleagues, customers and business partners. We live these values worldwide, which make us a very special company. Culture & Values Responsibility with a Long-Term View Because long-lasting and trustful partnerships form the basis of our business, we take responsibility for our colleagues, business partners and the society. Responsibility extends beyond the boundaries of our company: Wherever we are engaged in business, we aim to be good neighbors. We are committed to environmental protection. Therefore we use our resources with care. We respect rules and regulations: We never risk our integrity for perceived advantages. We take responsibility for our decisions and we keep our promises. binocular on the top of building Culture & Values Passion for Quality and Innovation Because we give our best every day and we do it with convincing passion. Our state-of-the-art products reflect our passion and performance. We do everything we can to achieve perfection. That is why we place the greatest importance on accuracy and precision. Our business partners appreciate our new ideas and solutions. We offer our employees an atmosphere in which they can develop and grow. That includes giving our employees the freedom that encourages self-reliance in their work. Industrial Engineering Facility: Close-up on Hands of Group of Engineers, Technicians and Specialists on a Meeting, Tracing Lines and Analysing Engine Design Technical Drafts Laying on the Table, Industrial Engineering Facility: Close-up on Hands of Group of E Culture & Values Hearts and Minds for our Customers Because we know our customer better than anyone else, we make a major contribution to their success. Due to our unique expertise, we know our customers’ requirements inside out. They perceive us as a reliable and competent partner who provides appropriate solutions to their challenges. Each and every day, we consistently do the very best for our customers. We feel equally committed to their objectives as we do to our own. Our products and solutions always offer an advantage for both sides. This means: We are in the right place at the right time with the right quality at the right price. This is how we exceed our customers’ expectations and strengthen our position on the market. Businesspeople or lawyers shaking hands finishing up meeting or negotiation in sunny office. Business handshake and partnership Culture & Values Embracing Cooperation and Improvement Because at Webasto we strive to find the best solutions by working together, our collaboration across divisions and regions is based on mutual trust. Cooperation throughout the whole Webasto Group is characterized by a strong team spirit. We are constructive in striving for the best solution, while always remaining respectful. We are not lone fighters. The ideas and competencies of our colleagues are always acknowledged. We bear setbacks as a team and celebrate success together We are open in our interaction with one another and benefit from each other’s strengths. We are glad to share our knowledge and experience with colleagues from other teams and countries. Every day, we work hard on continuously improving our processes and products. This is how we continue to develop together. Group of business workers standing with hands together at the office, Group of business workers standing with hands together at the of Culture & Values Courageously Optimistic Because every one of us is enthusiastic about their work, we are ready for the challenges of the future. Our industry is constantly changing: characterized by market shifts, competitive pressure and shorter development cycles. We meet these challenges with self-confidence. We are experts and doers: Each and every employee contributes to the success of Webasto in the work they do. We are decision-makers and act in an entrepreneurial manner. We have the courage to question the tried and trusted. We come up with new solutions by breaking with routine. We address concerns and constantly question ourselves. We draw the right conclusions from our mistakes and apply the learnings to our work going forward. This is how every single one of us contributes to the successful future of Webasto. Happy multiethnic friends showing thumbs up close up, Happy multiethnic friends showing thumbs up close up, like, finger, gesture, recommendation of good choice, excited satisfied clients, successful teamwork, hands view, celebrate great deal Previous Next Responsibility with a long-term view Passion for Quality and Innovation Hearts and Minds for our Customers Embracing Cooperation and Improvement Courageously Optimistic What we stand for Diversity Diversity as important success factor Whether in Europe, Asia, Australia or the Americas, Webasto is there wherever our customers need us. Our multicultural workforce of over 16,800 employees works in more than 50 locations in over 20 countries worldwide and is united by our values: cooperation, open-mindedness and respect for each other. Learn more In the Industrial Engineering Facility: Diverse Group of Engineers, Technicians, and Specialists on a Meeting, Have Discussion, Analyse Engine Design Technical Drafts that are Lying on the Table Sustainability Committed to sustainability “Responsibility with a long-term view” is one of the company´s corporate values and has shaped the activities of the family business since its foundation in 1901. Today, the understanding of responsibility is also reflected in the Webasto Purpose "Make individual mobility ​more enjoyable and sustainable by advancing technology and people". Learn more Sustainability fingerprint Foundation Webasto Foundation - We Drive the Future The Webasto Foundation aspires to move people, improve conditions, mobilize for the future and move things forward. Against this background, it supports social projects in the surroundings of Webasto locations, promotes sustainable mobility concepts for a better future, and provides impulses for the social commitment of people at Webasto. Learn more 1135837973 Our benefits Through flexibile working hours we support colleagues to achieve an optimum balance between their private and professional lives. With a comprehensive package of benefits and discounts, we further recognize the dedication of our colleagues. The benefits shown here vary depending on the location and position within the Webasto Group and represent an overview of our benefits. Benefits Optimal organization For a better balance of private and professional life: Flexible working hours Mobile working from homePossibility to switch between full- and part-time work30 days of vacation as well as days off on special holidays Sabbatical Part-time care leave and care leave for family reasons Portrait, happy and business people in office for solidarity, support or motivation with bokeh. Partnership, face and person team with diversity in solidarity for startup, management or collaboration, Portrait, happy and business people in office for solidarity, su Benefits Balancing Balancing work and family life: Parental compensation adviceIn-house children's nursery or crèche placesChildren's holiday program during summer holidays Children's and junior days Partial retirement Working day at home Benefits Career & Development Global assignments Mentoring program In-house academy for advanced training and intercultural education E-learning offers for specific target groupsMany language courses Performance review and feedback meetings Businessman, team support and thank you with applause for success, celebrate and congratulations with diversity. Solidarity in workplace with respect, promotion bonus and business people community. Benefits Health & Care Access to sports, fitness and wellness facilities throughout Germany Company doctor as well as health days and checks Running training, physical education for the back and other sports courses Company sports events Social security benefits such as: Hospital allowance, spa/rehab, eyeglasses & hearing device allowanceOffers for retirement provision Girl with heart hands, nature and sunshine, sustainability and eco friendly earth care and natural farm landscape. Conservation, sustainable farming and love hand sign emoji, woman with green fingers Benefits Additional benefits Christmas and vacation bonus or conversion to additional vacation days Relocation assistance Subsidized canteen & bistro Jobbike leasing Private package reception and textile care service Insurance offers such as private accident insurance, private liability insurance, etc. Capital-forming benefits Employee discounts, e.g. in the areas of fashion, travel & gastronomy People making thumb up hands sign in circle Benefits Work culture & environment Professional onboarding and buddy program for all new employeesModern office concept e.g. open space areas, free choice of workplace, ergonomic workstations etc. Company events such as Webasto BBQ, summer & winter events, etc. Good access to public transferFree parking & e-charging stations Bicycle maintenance and parking spaces Changing rooms, showers and lockers Previous Next Benefit 1 Benefit 2 Benefit 3 Benefit 4 Benefit 5 Benefit 6 How we work Empowering Automotive Innovation At Webasto, we value independent work, empowering employees as decision-makers. Join us to shape automotive innovations, working on complete modules with a focus on self-determination, team orientation, and a culture that appreciates every individual through our 'YOU' approach. How we work Locations & plants worldwide Insides to our locations & plants Discover a world of opportunities with Webasto! With 50+ global locations and a focus on proximity to customers, our career offerings extend beyond jobs. Experience cultural richness and scenic beauty in our diverse regions. At Webasto, find not just a job, but a fulfilling work-life harmony. Learn More Awards More about Webasto About us The Group Webasto is a manufacturer of vehicle roofs and solutions for e-mobility (batteries and heaters). The automotive supplier has an international production and sales network. More about About us Responsibility An understanding of responsibility is reflected both in the corporate culture and the Purpose "Make individual mobility ​more enjoyable and sustainable by advancing technology and people". Together, they serve as a guiding principle for meeting the demands of economic, ecological and social responsibility with holistic solutions. More about'''
