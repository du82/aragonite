["https://webcontainers.io/api"]
title = "API Reference | WebContainers"
description = "The public WebContainer API allows you to build custom applications on top of an in-browser Node.js runtime."
full_description = '''API Reference ​The public WebContainer API allows you to build custom applications on top of an in-browser Node.js runtime. Its main entry point is the WebContainer class.WebContainer ​The main export of this library. An instance of WebContainer represents a runtime ready to be used.WebContainer Properties ​fs: FileSystemAPI ​Gives access to the underlying file system.path: string ​The default value of the PATH environment variable for processes started through spawn.workdir: string ​The full path to the working directory (see FileSystemAPI).WebContainer Methods ​▸ boot ​Boots a WebContainer. Only a single instance of WebContainer can be booted concurrently (see teardown). Booting WebContainer is an expensive operation.Signature#static boot(options: BootOptions = {}): Promise<WebContainer>Return#Returns a WebContainer instance.BootOptions#tsinterface BootOptions { coep?: 'require-corp' | 'credentialless' | 'none'; workdirName?: string; forwardPreviewErrors?: boolean | 'exceptions-only'; }interface BootOptions { coep?: 'require-corp' | 'credentialless' | 'none'; workdirName?: string; forwardPreviewErrors?: boolean | 'exceptions-only'; }coep?: 'require-corp' | 'credentialless' | 'none' ​The value of the COEP header used to load your application.Choosing 'none' will result in no cross-origin isolation headers being used. This will only work on Chromium-based browsers as long as an Origin Trial is supported.This value is fixed the first time a WebContainer is booted, and cannot be changed in successive reboots.workdirName?: string ​Sets the folder name for the working directory of your WebContainer instance. If not provided, it will be auto-generated.This is mostly a "cosmetic" option.forwardPreviewErrors?: boolean | 'exceptions-only' ​Configure whether errors occurring in embedded preview iframes should be forwarded to the parent page. Captured errors originate from:Calls to console.errorAny unhandledrejection events on windowAny uncaught error events on windowIf set to exceptions-only, console.errors are not forwarded.Default value is false, so no errors are emitted.To receive the events, you register an event handler like this:jswebcontainerInstance.on('preview-message', (message) => { // process the message received from a preview });webcontainerInstance.on('preview-message', (message) => { // process the message received from a preview });▸ mount ​Mounts a tree of files into the filesystem. This can be specified as a FileSystemTree object or as a binary snapshot generated by @webcontainer/snapshot.Signature#mount(tree: FileSystemTree | Uint8Array | ArrayBuffer, options?: Options): Promise<void>Options#tsinterface Options { mountPoint?: string; }interface Options { mountPoint?: string; }▸ on ​Listens for an event. The listener is called every time the event gets emitted.Signature#on(event: 'port' | 'error' | 'server-ready' | 'preview-message', listener: PortListener | ErrorListener | ServerReadyListener | PreviewMessageListener): () => voidReturns#Returns a function to unsubscribe from the events. Once unsubscribed, the listener will no longer be called.Overloads# ▸ on(event: 'port', listener: PortListener): () => voidListens for port events, which are emitted when a port is opened or closed by some process.PortListener (Function)ts(port: number, type: "open" | "close", url: string): void(port: number, type: "open" | "close", url: string): void ▸ on(event: 'error', listener: ErrorListener): () => voidListens for error events, emitted when an internal error is triggered.ErrorListener (Function)ts(error: { message: string }): void(error: { message: string }): void ▸ on(event: 'preview-message', listener: PreviewMessageListener): () => voidListens for preview-message events, emitted when an internal error is triggered.PreviewMessageListener (Function)ts(message: PreviewMessage): void(message: PreviewMessage): voidPreviewMessage#tstype PreviewMessage = (UncaughtExceptionMessage | UnhandledRejectionMessage | ConsoleErrorMessage) & BasePreviewMessage; interface BasePreviewMessage { previewId: string; port: number; pathname: string; search: string; hash: string; } interface UncaughtExceptionMessage { type: PreviewMessageType.UncaughtException; message: string; stack: string | undefined; } interface UnhandledRejectionMessage { type: PreviewMessageType.UnhandledRejection; message: string; stack: string | undefined; } interface ConsoleErrorMessage { type: PreviewMessageType.ConsoleError; args: any[]; stack: string; }type PreviewMessage = (UncaughtExceptionMessage | UnhandledRejectionMessage | ConsoleErrorMessage) & BasePreviewMessage; interface BasePreviewMessage { previewId: string; port: number; pathname: string; search: string; hash: string; } interface UncaughtExceptionMessage { type: PreviewMessageType.UncaughtException; message: string; stack: string | undefined; } interface UnhandledRejectionMessage { type: PreviewMessageType.UnhandledRejection; message: string; stack: string | undefined; } interface ConsoleErrorMessage { type: PreviewMessageType.ConsoleError; args: any[]; stack: string; } ▸ on(event: 'server-ready', listener: ServerReadyListener): () => voidListens for server-ready events, emitted when a server was started and ready to receive traffic.ServerReadyListener (Function)ts(port: number, url: string): void(port: number, url: string): void▸ spawn ​Spawns a process. When no args are provided, spawns a process without command-line arguments.Signature#spawn(command: string, args: string[], options?: SpawnOptions): Promise<WebContainerProcess>Example#With args:jsconst install = await webcontainerInstance.spawn('npm', ['i']);const install = await webcontainerInstance.spawn('npm', ['i']);Without args:jsconst install = await webcontainerInstance.spawn('yarn');const install = await webcontainerInstance.spawn('yarn');Returns#Returns a WebContainerProcess.Overloads# ▸ spawn(command: string, args: string[], options?: SpawnOptions): () => voidSpawns a process with additional arguments. ▸ spawn(command: string, options?: SpawnOptions): () => voidSpawns a process without additional arguments.▸ export ​Added in version 1.4.0.Exports the filesystem.Signature#export(path: string, options?: ExportOptions): Promise<Uint8Array | FileSystemTree>Example#jsconst data = await webcontainerInstance.export('dist', { format: 'zip' }); const zip = new Blob([data]);const data = await webcontainerInstance.export('dist', { format: 'zip' }); const zip = new Blob([data]);Returns#Returns a FileSystemTree when the format is json, otherwise a Uint8Array.▸ setPreviewScript ​Added in version 1.5.0.Configure a script to be injected inside all previews. After this function resolves, every preview iframe that is either added or reloaded will now include this extra script on all HTML responses.Notably, existing previews won't include the script until they have been reloaded.To reload a preview you can use reloadPreviewWARNINGThis API is an advanced feature that should only be used if it is your only option. Since you can control servers running in WebContainer, it's preferable to add this code when serving the content itself.In particular, this might break existing WebContainer features or ones that will be added later.Signature#setPreviewScript(scriptSrc: string, options?: PreviewScriptOptions): Promise<void>Example#jsconst script = ` console.log('Hello world!'); `; await webcontainerInstance.setPreviewScript(script); // now all previews will always print hello world to the console if they serve HTMLconst script = ` console.log('Hello world!'); `; await webcontainerInstance.setPreviewScript(script); // now all previews will always print hello world to the console if they serve HTML▸ teardown ​Destroys the WebContainer instance, turning it unusable, and releases its resources. After this, a new WebContainer instance can be obtained by calling boot.All entities derived from this instance (e.g. processes, the file system, etc.) also become unusable after calling this method.Signature#teardown(): voidreloadPreview ​Added in version 1.2.2.Reload the provided iframe by sending a message to the iframe and falling back to resetting the src if the iframe didn't respond in time.Signature#reloadPreview(preview: HTMLIFrameElement, hardRefreshTimeout?: number = 200): Promise<void>Returns#Returns a Promise that resolves when the reload has completed.configureAPIKey ​Added in version 1.3.0.Configure an API key to be used for commercial usage of the WebContainer API. See https://webcontainers.io/enterprise for more information.Signature#configureAPIKey(key: string): voidThis function will throw an exception if WebContainer.boot was called before configureAPIKey.auth ​The authentication API is exported under the auth namespace. It allows you to authenticate users visiting your website via StackBlitz. In order for users to be authenticated via this method, they must:Be logged in on StackBlitz.Belong to the organisation you used to generate your clientId for use with the WebContainer API.Authorize your website.Once logged in, you'll be able to install private packages that those users have access to within WebContainer.auth Functions ​▸ init ​Intialize the authentication for use in WebContainer. This method should be called as soon as possible as part of the loading phase of your page. For example at the top of a module that gets loaded as soon as the page loads. This is important for multiple reasons:If you do client side routing, and the OAuth flow is happening, then query parameters might be populated with values related to the OAuth flow. The init function removes them after they've been consumed.If you do the authentication in popup mode, you likely want the popup to be closed as soon as the authentication completed.Signature#init(options: AuthInitOptions): { status: 'need-auth' | 'authorized' } | AuthFailedErrorThis function will throw an exception if WebContainer.boot was called before auth.init.AuthInitOptions#tsinterface AuthInitOptions { /** * StackBlitz' origin. * * @default https://stackblitz.com */ editorOrigin?: string; /** * The client id for this OAuth application. */ clientId: string; /** * OAuth scope. The value can be found under your `Teams Settings` > `API`. * * @see https://www.rfc-editor.org/rfc/rfc6749#section-3.3 */ scope: string; }interface AuthInitOptions { /** * StackBlitz' origin. * * @default https://stackblitz.com */ editorOrigin?: string; /** * The client id for this OAuth application. */ clientId: string; /** * OAuth scope. The value can be found under your `Teams Settings` > `API`. * * @see https://www.rfc-editor.org/rfc/rfc6749#section-3.3 */ scope: string; }AuthFailedError#tsinterface AuthFailedError { status: 'auth-failed'; /** * A short description of the error. */ error: string; /** * A detailed description of the error. */ description: string; }interface AuthFailedError { status: 'auth-failed'; /** * A short description of the error. */ error: string; /** * A detailed description of the error. */ description: string; }▸ startAuthFlow ​This starts the OAuth flow, redirecting the current page to the StackBlitz editor to authenticate the user unless popup is set to true in which case it's done in a popup.startAuthFlow(options?: { popup?: boolean }): void▸ loggedIn ​Returns a promise that resolves when the user authorized your application. This promise is guaranteed to never be rejected.If the user never authorizes or declines your application, this promise never resolves.Signature#loggedIn(): Promise<void>Example#tsconst instance = await WebContainer.boot(); // wait until the user is logged in await auth.loggedIn(); // we can now fetch private packages from our organisation await instance.spawn('npm', ['install']);const instance = await WebContainer.boot(); // wait until the user is logged in await auth.loggedIn(); // we can now fetch private packages from our organisation await instance.spawn('npm', ['install']);▸ logout ​Logout the user and clear any credentials that were saved locally.If ignoreRevokeError is set and the revocation failed, the locally-saved credentials are discarded nonetheless.Signature#logout(options?: { ignoreRevokeError?: boolean }): Promise<void>▸ on ​Listens for an event. The listener is called every time the event gets emitted.Signature#on(event: 'logged-out' | 'auth-failed', listener: () => void | (reason: { error: string, description: string }) => void): () => voidReturns#Returns a function to unsubscribe from the events. Once unsubscribed, the listener will no longer be called.Overloads# ▸ on(event: 'logged-out', listener: () => void): () => voidListens for logged-out events, which are emitted when the credentials are revoked, meaning the user needs to re-authenticate. ▸ on(event: 'auth-failed', listener: (reason: { error: string, description: string }) => void): () => voidListens for auth-failed events, which are emitted when the user declines authorization in another tab / popup.The property error corresponds to a constant that your code can match against, while description is a human readable error that can be useful for development. The possible values of error are:access_denied: The user denied the authorization request.invalid_scope: The scope is invalid, unknown or malformed.More might be addded in the future, which is reason behind having error typed as a string instead of an union.DirEnt ​A representation of a directory entry, see the Node.js API.DirEnt Properties ​▸ name ​The name of the file or directory.Signature#name: string | Uint8ArrayDirEnt Methods ​▸ isDirectory ​Whether the entry is a directory.Signature#isDirectory(): boolean▸ isFile ​Whether the entry is a file.Signature#isFile(): booleanFileSystemAPI ​Interface to interact directly with the WebContainer file system. Modeled after fs.promises in Node.FileSystemAPI Methods ​▸ mkdir ​Creates a new directory. If the directory already exists, it will throw an error.Signature#mkdir(path: String, options?: Options): Promise<void>Options#When recursive is set to true, it will create any missing folders in the path.tsinterface Options { recursive?: boolean; }interface Options { recursive?: boolean; }▸ readdir ​Reads a given directory and returns an array of its files and directories.Signature#readdir(path: string, options?: Options): Promise<Uint8Array[]> | Promise<string[]> | Promise<DirEnt<Uint8Array>[]> | Promise<DirEnt<string>[]>Options#tsinterface Options { encoding?: BufferEncoding; withFileTypes?: boolean; }interface Options { encoding?: BufferEncoding; withFileTypes?: boolean; }encoding: BufferEncoding ​The encoding (see BufferEncoding) can be any one of those accepted by Buffer.withFileTypes: boolean ​When set to true, the return value is an array of Dirent objects.▸ readFile ​Reads the file at the given path. If the file does not exist, it will throw an error.Signature#readFile(path: string, encoding?: BufferEncoding | null): Promise<Uint8Array> | Promise<string>By default, it returns a UInt8Array. A second argument can be pass'''
