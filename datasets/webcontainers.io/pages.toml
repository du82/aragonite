title = "Changelog | WebContainers"
description = "Changelog for the WebContainers API library"
full_description = '''Changelog ​1.5.0 ​Add support for injecting a script in previews with setPreviewScript.1.4.0 ​Add support for exporting the file system with export.1.3.0 ​Breaking change: we now throw if auth.init is called after WebContainer.bootAdd configureAPIKey to use the API with an API key.Add stack information to console.error messages coming from previews.1.2.4 ​Bug fix: reloadPreview was always doing a hard refresh as the port was not transferred.1.2.3 ​Make @webcontainer/api ESM and SSR friendly again.Emit preview messages on the webcontainer's on('preview-message') event handler.1.2.2 ​Add reloadPreview utility, also exported under @webcontainer/api/utils.1.2.1 ​WARNINGIt's recommended to use version >= 1.2.3 to use forwardPreviewErrors as you cannot add an event listener in the webcontainerInstance in that version.Add forwardPreviewErrors to BootOptions which lets you capture "errors" from previews.1.2.0 ​Add support for authentication.Add cwd option to SpawnOptions.1.1.8 ​Add fs.watch.1.1.7 ​Change compile target to ES20221.1.6 ​Add fs.rename.After a WebContainer instance has been torn down you can boot it again.1.1.5 ​Show warning with invalid coep settings1.1.4 ​Add 'none' to the list of accepted values for coep setting. This value can only work on Chromium-based browsers as long as an Origin Trial is supported.1.1.3 ​No changes were made1.1.2 ​Fix ESM support for @webcontainer/api by changing all imports to include the .js extension.1.1.0 ​The value of the Cross-Origin-Embedder-Policy header can be changed now with BootOptions#coep.The name of the working directory can be specified through BootOptions#workdirName.The default value of the PATH environment variable is exposed in WebContainer#path.The full path of the working directory is exposed in WebContainer#workdir.'''
