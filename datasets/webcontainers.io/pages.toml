["https://webcontainers.io/guides/configuring-headers"]
title = "Configuring Headers | WebContainers"
description = "This guide provides an overview on how to configure COOP/COEP headers, including hosting platform configuration."
full_description = '''Configuring Headers ​This guide provides an overview on how to configure COOP/COEP headers, including hosting platform configuration.WebContainers require that your page, even in development, is served with these two headers:yamlCross-Origin-Embedder-Policy: require-corp Cross-Origin-Opener-Policy: same-originCross-Origin-Embedder-Policy: require-corp Cross-Origin-Opener-Policy: same-originThese headers are needed because WebContainer requires SharedArrayBuffer, which, in turn, requires your website to be cross-origin isolated.Some browsers support a different mode for cross-origin isolation: credentialless. If you wish to serve your content in this way, set your headers instead to:yamlCross-Origin-Embedder-Policy: credentialless Cross-Origin-Opener-Policy: same-originCross-Origin-Embedder-Policy: credentialless Cross-Origin-Opener-Policy: same-originand make sure to boot your WebContainer specifying coep: 'credentialless'.Deep Dive: cross-origin isolationHere are a few helpful resources if you'd like to learn more about these topics:MDN page on SharedArrayBufferMDN page on cross-origin isolationour primer on COOP/COEPStackBlitz docs page on browser supportCloudflare ​All pages ​You can configure headers for all pages in your _headers file:_headersyaml/* Cross-Origin-Embedder-Policy: require-corp Cross-Origin-Opener-Policy: same-origin/* Cross-Origin-Embedder-Policy: require-corp Cross-Origin-Opener-Policy: same-originSpecific page ​You can configure headers for a specific page(/tutorial in this case) in your _headers file:_headersyaml/tutorial Cross-Origin-Embedder-Policy: require-corp Cross-Origin-Opener-Policy: same-origin/tutorial Cross-Origin-Embedder-Policy: require-corp Cross-Origin-Opener-Policy: same-originNetlify ​All pages ​You can configure headers for all pages in your netlify.toml file:netlify.tomlyaml[[headers]] for = "/*" [headers.values] Cross-Origin-Embedder-Policy = "require-corp" Cross-Origin-Opener-Policy = "same-origin"[[headers]] for = "/*" [headers.values] Cross-Origin-Embedder-Policy = "require-corp" Cross-Origin-Opener-Policy = "same-origin"Specific page ​You can configure headers for a specific page(/tutorial in this case) in your netlify.toml file:netlify.tomlyaml[[headers]] for = "/tutorial" [headers.values] Cross-Origin-Embedder-Policy = "require-corp" Cross-Origin-Opener-Policy = "same-origin"[[headers]] for = "/tutorial" [headers.values] Cross-Origin-Embedder-Policy = "require-corp" Cross-Origin-Opener-Policy = "same-origin"Read more here about headers on Netlify.Vercel ​All pages ​You can configure headers for all pages in your vercel.json file:vercel.jsonjson{ "headers": [ { "source": "/(.*)", "headers": [ { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }, { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" } ] } ] }{ "headers": [ { "source": "/(.*)", "headers": [ { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }, { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" } ] } ] }Specific page ​You can configure headers for a specific page(/tutorial in this case) in your vercel.json file:vercel.jsonjson{ "headers": [ { "source": "/tutorial", "headers": [ { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }, { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" } ] } ] }{ "headers": [ { "source": "/tutorial", "headers": [ { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }, { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" } ] } ] }Read more here about headers on Vercel.Configuring across popular meta-frameworks ​Sometimes, configuring headers in your meta-framework of choice is easier than configuring them in your hosting platform. Here are some guides for popular meta-frameworks:SvelteKit ​All pages ​You can configure headers for all pages in your hooks.server.js file:hooks.server.jsjsexport const handle = async ({ request, resolve }) => { const response = await resolve(request); response.headers.set('Cross-Origin-Embedder-Policy', 'require-corp'); response.headers.set('Cross-Origin-Opener-Policy', 'same-origin'); return response; };export const handle = async ({ request, resolve }) => { const response = await resolve(request); response.headers.set('Cross-Origin-Embedder-Policy', 'require-corp'); response.headers.set('Cross-Origin-Opener-Policy', 'same-origin'); return response; };Specific page ​You can configure headers for a specific page(/tutorial in this case) in your hooks.server.js file:hooks.server.jsjsexport const handle = async ({ request, resolve }) => { const response = await resolve(request); if (request.path === '/tutorial') { response.headers.set('Cross-Origin-Embedder-Policy', 'require-corp'); response.headers.set('Cross-Origin-Opener-Policy', 'same-origin'); } return response; };export const handle = async ({ request, resolve }) => { const response = await resolve(request); if (request.path === '/tutorial') { response.headers.set('Cross-Origin-Embedder-Policy', 'require-corp'); response.headers.set('Cross-Origin-Opener-Policy', 'same-origin'); } return response; };You can also do this in specific page's +page.server.js file:tutorial/+page.server.jsjs/** @type {import('./$types').PageServerLoad} */ export const load = ({ setHeaders }) => { setHeaders({ 'Cross-Origin-Embedder-Policy': 'require-corp', 'Cross-Origin-Opener-Policy': 'same-origin', }); };/** @type {import('./$types').PageServerLoad} */ export const load = ({ setHeaders }) => { setHeaders({ 'Cross-Origin-Embedder-Policy': 'require-corp', 'Cross-Origin-Opener-Policy': 'same-origin', }); };Nuxt 3 ​All pages ​You can configure headers for all pages in your nuxt.config.js file:nuxt.config.jsjs// https://nuxt.com/docs/api/configuration/nuxt-config export default defineNuxtConfig({ nitro: { routeRules: { '**': { headers: { 'Cross-Origin-Embedder-Policy': 'require-corp', 'Cross-Origin-Opener-Policy': 'same-origin', }, }, }, }, });// https://nuxt.com/docs/api/configuration/nuxt-config export default defineNuxtConfig({ nitro: { routeRules: { '**': { headers: { 'Cross-Origin-Embedder-Policy': 'require-corp', 'Cross-Origin-Opener-Policy': 'same-origin', }, }, }, }, });Specific page ​You can configure headers for a specific page(/tutorial in this case) in your nuxt.config.js file:nuxt.config.jsjs// https://nuxt.com/docs/api/configuration/nuxt-config export default defineNuxtConfig({ nitro: { routeRules: { '/tutorial': { headers: { 'Cross-Origin-Embedder-Policy': 'require-corp', 'Cross-Origin-Opener-Policy': 'same-origin', }, }, }, }, });// https://nuxt.com/docs/api/configuration/nuxt-config export default defineNuxtConfig({ nitro: { routeRules: { '/tutorial': { headers: { 'Cross-Origin-Embedder-Policy': 'require-corp', 'Cross-Origin-Opener-Policy': 'same-origin', }, }, }, }, });NextJS ​All pages ​You can configure headers for all pages in your next.config.js file:next.config.jsjs// https://nextjs.org/docs/api-reference/next.config.js/introduction module.exports = { async headers() { return [ { source: '/(.*)', headers: [ { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp', }, { key: 'Cross-Origin-Opener-Policy', value: 'same-origin', }, ], }, ]; }, };// https://nextjs.org/docs/api-reference/next.config.js/introduction module.exports = { async headers() { return [ { source: '/(.*)', headers: [ { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp', }, { key: 'Cross-Origin-Opener-Policy', value: 'same-origin', }, ], }, ]; }, };Specific page ​You can configure headers for a specific page(/tutorial in this case) in your next.config.js file:next.config.jsjs// https://nextjs.org/docs/api-reference/next.config.js/introduction module.exports = { async headers() { return [ { source: '/tutorial', headers: [ { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp', }, { key: 'Cross-Origin-Opener-Policy', value: 'same-origin', }, ], }, ]; }, };// https://nextjs.org/docs/api-reference/next.config.js/introduction module.exports = { async headers() { return [ { source: '/tutorial', headers: [ { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp', }, { key: 'Cross-Origin-Opener-Policy', value: 'same-origin', }, ], }, ]; }, };'''
