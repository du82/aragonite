nd serviced apartment style accomodation options in and around the area. Live Streaming Not everyone is ready, or able to get back to in-person events. Others find online conferences provide greater accessibility, or make their training budget go further. So we'll be streaming UX Australia, on Web Direction's very own streaming platform Conffab. Streaming passes just $495 Partner with us Keen to connect with those in the industry shaping its direction? Then Next is for you. We work closely with our partners and their technologies to deliver world leading online conferences. Contact us to talk about how we can help you be even more awesome. Web Directions Conffab Stream and download nearly 1,000 presentations from hundreds of world leading experts at 50 conferences…and counting With free and paid levels, keep up to date with all that's happening in our industry at your own pace. Sign up Now Learn More Organised and produced by In 2025, UX Australia teams up with Web Directions to bring you Australia's leading UX conference. About Steve Baty Steve was the inaugural CEO of the Australian Design Council, co-founder of Meld Studios and co-founder of UX Australia. He is a Director of the Product Stewardship Centre of Excellence and served two years as the President of the Interaction Design Association. His practice is centred on improving our public spaces, infrastructure and services. About UX Australia Since 2009, UX Australia has been Australia's premier conference about UX, product and service design, and the surrounding disciplines of research, content, operations, management, and more. About Web Directions Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. About John Allsopp John Allsopp has been 