rld's leading experts across this vast field. We spend our lives thinking about what comes next, keeping up with trends in technology, practices and processes, and filtering the hype, to make sure you don't miss trends that matter, and don't waste time on hype that doesn't. We promise attending one of our events will leave you significantly better versed in the challenges you face day to day, and in solutions for addressing them. Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
