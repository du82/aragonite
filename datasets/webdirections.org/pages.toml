full_description = '''Your weekend reading John Allsopp 3rd February, 2025 @johnallsopp Great reading, every weekend. The best writing about the web, each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1em; font-weight: 600; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .3em 2em .3em 2em; box-shadow: var(--contrast-box-shadow); margin-block-end: .2em; } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } /* Container Query: Applies when .ac-form-container is < 600px */ @container (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } #ac-form { width: 100% } .ac-form-container #ac-form .form-group { flex: 0 0 100%; width: 100%; } .ac-form-container #ac-form .form-group input { width: 100%; } .ac-form-container #ac-form .form-group label { color: #000 } .ac-form-container #ac-form .submit-btn { width: 100%; } #response-message { color: #000 } } Keeping up our 2025 posting streak (of now 2, but from little things…), here’s a roundup of some things we found this week we thought you might find valuable. Plenty of CSS and thoughts on architecting the Web, plus some AI for developers related articles as well, and more. Like what you see? Checkout our huge catalog of presentations on Conffab (a free account gets you access to hundreds of world class talks), and the events we have lined up in Sydney and Melbourne in 2025. And get these first in your inbox every Friday by signing up to our newsletter. Build for the Web, Build on the Web, Build with the Web architecture, react, web platform If you’re going to build for the web, build on the web and build with the web. If I was only able to give one bit of advice to any company: iterate quickly on a slow-moving platform.In the last year alone, I have seen two completely different clients in two completely different industries sink months and months into framework upgrades. Collectively, they’ve spent tens, if not hundreds, of thousands of dollars rewriting entire projects just to maintain feature parity with the previous iteration. This is not meaningful or productive work—it is time sunk into merely keeping themselves at square one. Source: Build for the Web, Build on the Web, Build with the Web With major new releases of React and Tailwind here or close, teams might start considering the efforts they’ll need to put into keeping up to date. Here Harry Roberts asks developers to consider these costs and ultimately If you’re going to build for the web, build on the web and build with the web. If I was only able to give one bit of advice to any company: iterate quickly on a slow-moving platform. Rupert’s world – Thought partnership with language models AI, Design This is a new sort of interaction with computers, one that’s far more personal and flexible than anything in the history of human-computer interaction. It’s something I’ve been calling “thought partnership”.Thought partnership. A relational interaction with a computer system in which the user and computer collaborate to uncover information & insights relevant to the topic of conversation, the user’s interests, and their values. Source: Rupert’s world – Thought partnership with language models Rupert Manfredi is doing very interesting work on the future of human-computer interfaces & artificial intelligence as a designer and developer. Here he explores the concept of ‘thought partnership’ a new kind of human computer interaction he is working on. Bonus video: Rupert’s Web Directions Summit 2023 keynote explored these ideas in detail as well. Watch it, no signup required! Moving on from React, a Year Later architecture, JavaScript, react Maybe it’s the changing interest rates or political winds, but I think the “fat client” era JS-heavy frontends is on its way out. The hype around edge applications is misplaced and unnecessary for building many different flavors of successful businesses. Many interactions are not possible without JavaScript, but that doesn’t mean we should look to write more than we have to. The server doing something useful is a requirement for building an interesting business. The client doing something is often a nice-to-have. Source: Moving on from React, a Year Later A year ago Kelly Sutton wrote about his company’s move away from React. A year on how has that worked out? He revisits the decision in this new piece. Get Started with Chrome Built-in AI : Access Gemini Nano Model locally AI, browser API, web AI An AI model within your browser. Yes that’s exactly what Chrome Built-AI is all about. The team has been at work to infuse AI APIs and models inside of Chrome via Chrome’s built-in AI APIs and models, including Gemini Nano.This would mean that you can invoke a Gemini model locally in the browser. Thinking of giving that Chrome extension of yours, some AI superpowers and yet running it locally? You should give Chrome Built-in AI a try. In this article, we are going to look at: Chrome Built-in AI capabilities at the time of writing (likely to have breaking changes as its early days). Key Configuration steps to getting started with Chrome Built-in AI. Sample code that demonstrates Sentiment Analysis feature that you can build within your web application and it uses the Gemini Nano model integrated within Chrome AI via the Prompt API. All processing is done locally. Source: Get Started with Chrome Built-in AI : Access Gemini Nano Model locally | by Romin Irani | Google Cloud – Community | Medium We’re so excited about AI and ML in the browser we’re planning a whole online conference Inference on it for later in 2025. This is a good outline of one of the emerging approaches–it exposes Gemini Nano, one of Google’s models directly to web developers to access via JavaScript. Mozilla has also announced something similar. These are very much emerging technologies but one we’d encourage developers to explore. On the Origin of Cross CSS, performance, web fonts A browser decides to download a web font after: Content is ready CSS is readyIt appears that some content will indeed need the web font It’s often late enough in the page rendering that the content in question is initially rendered in a fallback font (or not shown at all, depending on font-display). To prevent this you can preload the font using an HTTP header or a link in the head of the document. … This article is about the importance of crossorigin part of the code above. Source: On the Origin of Cross The performance and UX impact of web fonts can be subtle and tricky. Here’s how you can preload a font and avoid some pitfalls. Some Things You Might Not Know About Custom Counter Styles CSS You’ve more than likely dabbled with custom counters using counter-reset and counter-increment. Or maybe your way of doing things is to wipe out the list-style (careful when doing that!) and hand-roll a marker on the list item’s ::before pseudo.But have you toyed around with @counter-style? Turns out it does a lot of heavy lifting and opens up new ways of working with lists and list markers. Source: Some Things You Might Not Know About Custom Counter Styles | CSS-Tricks The ability to manage counters, allowing for the numbering not just of list items but things like headings has been around since the beginning of CSS. But as Geoff Graham explores here, @counter-style brings us many more options. Initial load performance for React developers: investigative deep dive Core Web Vitals, performance, react Exploring Core Web Vitals, performance dev tools, what initial load performance is, which metrics measure it, and how cache control and different networking conditions influence it. … Spoiler alert: there will be no React in this article other than the study project. Today is all about fundamental stuff: how to use performance tools, an intro to Core Web Vitals, Chrome performance panel, what initial load performance is, which metrics measure it, and how cache control and different networking conditions influence it. Source: Initial load performance for React developers: investigative deep dive Nadia Makarevich is a fantastic developer and communicator who has spoken more than once at our events. She focuses a lot on React (her book is called ‘Advanced React‘) and it’s in the title of the article, but this is relevant to any front end developer regardless of the framework they use. Justified Text: Better Than Expected? CSS, typography When it comes to Western languages, most long-form text you’ll encounter is either left-aligned (with an uneven, “ragged” right edge) or justified (with words spaced evenly across a line). But I’ve long avoided the latter in my web design work.Why? Hyphenation. To quote Matthew Butterick’s Practical Typography, “if you’re using justified text, you must also turn on hyphenation.” But hyphenation on the web can be tricky. In On Web Typography, Jason Santa Maria called hyphens: auto “crude,” warning that “the results are unpredictable.” Source: Justified Text: Better Than Expected? – Cloud Four Pick up a book–take a look at the page–you’ll almost invariably see the text is aligned on both the right and left hand edges of the page. “Justified”. Now visit any web page. Few if any align text in this way. It’s been in CSS from the very beginning, text-align: justify, but it’s almost never used. Why? Because pleasant looking justified text is hard to algorithmically lay out. That typeset book-it’s almost certain a human has manually nudged around spacing on a line by line basis, hundreds of times for any book. This is simply not something that a responsive web design enables since those nudges are on lines fixed in length based on page size and other fixed parameters. So web designers have long avoided justified text. Here Tyler Sticka revisits justified text, and CSS based hyphenation, and finds it works better than he expected. But it’s not quite there yet still. CSS JOY Webring CSS A CSS Webring! This is the home of a new webring that I’ve decided to set up for those of us who take joy in messing around with CSS 🙂 Why a webring?I am enjoying the resurgence of old-web nostalgia, and think it’s fun to just land on interesting websites without being funnelled through social media, or searching for them first. Source: CSS JOY Webring For those not around the first decade or so of the Web, a Web Ring may not bring back any memories but they were quite the thing. You would link to other sites associated with yours, a sort of organic, non algorithmic way of promoting related sites. They are making a little bit of a comeback like a lot of old school web stuff (you know like web sites) and here’s a CSS related one! What I’ve learned about writing AI apps so far AI, LLMs, software engineering I started writing a post called “how to write AI apps” but it was over-reach so I scaled it back to this. Who am I to tell you how to write anything? But here’s what I’ll be applying to my own writing of AI-powered apps, specifically LLM applications. Source: What I’ve learned about writing AI apps so far | Seldo.com We’ve published similar pieces recently where developers talk about how they work with LLM’s. Here Laurie Voss provides his thoughts-which we largely agree with. OK, that’s enough keep you busy over the weekend! See you next week where we aim to keep our 2025 streak intact! Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-me