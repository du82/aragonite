["https://webdirections.org/speaking"]
title = "Speak at a Web Directions Event"
description = "Conferences for web and digital professionals, in person and online"
full_description = '''Why Speak? Presenting is a great way to really get to understand something, raise your professional profile and connect with with your peers. At Web Directions, we're always looking for new (as well as experienced) speakers to share their ideas and expertise and enthusiasm with our audience. In 2025 will that be you? Our 2025 Events Here's what we're bringing you in person (and streaming) in 2025. With more online at Conffab. web directions UX Australia Melbourne August 2025 The conference at the heart of the Australian UX community . Learn More web directions code Melbourne June 2025 Australia's conference for JavaScript developers and front end engineers. Learn More web directions code leaders Melbourne June 2025 for engineering leaders and managers creating world class engineering teams and cultures Learn More web directions developersummit Sydney November 2025 A world leading conference for the people building the Web. Learn More web directions Next Sydney November 2025 What's next in the world of digital design, product and strategy? Learn More web directions inference online 2025 AI and ML in the browser and at the edge Learn More What opportunities are there to speak? We're glad you asked! In 2025, we're hosting five major in-person events–in Melbourne in June (Code and Code Leaders), UX Australia in Melbourne in August, and later in the year in Sydney–Dev Summit and Next, plus Inference online. Read on for more and to propose! Inference Web Directions Inference Sees a return to our online, specialised conference format which we pioneered when in person events weren't possible. AI and Machine Learning are garnering an enormous amount of attention right now–but where does the Web fit into this? We believe it has a significant role to play. So we've created Inference, a conference focussed on AI and ML in the browser. We'll cover key enabling Web platform technologies like WebNN, WebGPU and WebGL. Existing and emerging web platform APIs. Technologies like Tensorflow.js, ONNX.js, and Web LLM which make it possible to do AI inference in the browser. As well as practices like optimizing for performance, and real world use cases to inspire you. If you're working with these technologies, we'd love to hear from you! Whether a deep dive into a specific area of practice of technology, or a case study of work you've done, tewll us more! Inference takes place in online in the first half of 2025. Talks are pre-recorded (we'll provide the equipment and support you need). CFPs are open now and close end of March 2025. UX Australia In 2025 Web Directions is teaming up with UX Australia to bring you the return of their wonderful main event. To learn more about what we're looking for and to propose head over to the dedicated CFP page for the conference. Dev Summit Web Directions Dev Summit covers the front end in depth–from the back to the front of front end. Technologies like CSS, JavaScript, Web Components, and browser APIs as well as practices like performance, security, testing and debugging, design systems, architecture and more. One of the longest running and most highly regarded conferences of its kind in the world, we go far beyond the expected. Industry shaping concepts like OOCSS and Progressive Web Apps were unveiled to the world at our conferences, and for 2 decades we've helped shaped what the Web looks like. Dev Summit takes place in Sydney in late November 2025, and CFPs are open now and close May 2025 Next Next is a relative new, one day, ideas driven conference. Most speakers will be invited, but take a look at the program for 2024, and if there's ideas you'd like to convey to our audience we'd love to hear about them. Next takes place in Sydney in late November 2025, and CFPs are open now and close May 2025 Code Web Directions Code is all in on front end engineering–front of the front end (CSS/HTML/JS/Browser APIs), back of the front end (frameworks like React, Remix, Next, CI/CD, operations), platform engineering, security, performance, and much more. Code takes place early June 2025 and CFPs are open now and close mid March 2024 Code Leaders Code Leaders is a one day conference for engineering leaders and managers. From the big picture technical considerations to the huan side of leadershop we'll help you grow. Code Leaders takes place June 2025, and CFPs are open now and close mid March 2024 How do I get to speak at a Web Directions Conference? This is a little long winded and in depth, but understanding what we look for will really help you propose a topic that's likely to work for our programs. A look at past conference programs will likely help you get a sense of what we look for too. Our philosophy At Web Directions we have a strong editorial style we've developed over 20 years of putting together conferences. The type of sessions that prove popular, and so which we program, tend to have a number of characteristics: They're often about "unknown unknowns"–introducing or explaining to the audience concepts, practices or technologies they may not be aware of, or maybe only vaguely aware of, that would be useful to them in their work, today, or in the near future. They're focussed–don't think breadth, think focus and depth. They're 'explainers'–they succinctly help the audience understand what something is, what it's for, and how they can get value from it. They're forward looking (but not far future). It's right there in our name "directions"–we want to help our audience chart where they are going, but we don't want to lead them down dead ends, or show them things that might only one day become useful. Each year we tend to get a lot of similar proposals for something that's the topic everyone is talking about right now–and would have been the ideal proposal last year or the year before. One of the things we love hearing from our audience is "I can't wait to get back to work and put this into practice". If you can aim for that, for the event's target audience, you'll go a long way to getting a place in the schedule. Here's a few more tips what we recommend to give yourself the best chance of getting a place at our conferences. Talks are typically of no more than 30 minutes duration. If we see proposals we really like, we start pencilling them in before the closing date. So it pays to not wait until last minute. We're also happy for multiple proposals from the same person. Past presentations give a good indication of the sort of thing we're looking for as well. Focus is good! Rather than proposing for example "what's new in Javascript" think about a deep dive on one aspect of what's new in JavaScript (for example "Crunchy or smooth? All about JavaScript's Spread Operator"). What's something you think is indispensable but not as many people know about and use as you think should? There's a great topic right there! OK, I'm keen! Where do I propose? You'll find a form for proposing for our 2025 conferences below. You propose, we'll work out where the best fit is. Feel free to submit multiple proposals as well! What Do Speakers Get? We provide travel and accomodation for speakers at our in-person conferences, plus speaker dinners, receptions and an all round great experience for speakers. And it doesn't stop with the conference, we host your presentation on our streaming platform Conffab, where speakers are compensated for the engagement their presentations generate! And speakers get a lifetime Conffab subscription as well. Good luck, we can't wait to hear your proposals! Questions? Happy to discuss your proposal and thoughts–just email us info@webdirections.org. Ready? Head over to our CFP form and submit away–for multiple proposals just submit multiple times.! Loading… Keep up to date with Announcements Want to keep up to date with news about our 2025 events? Let us know below and we'll email you as things develop. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_event_interest_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); var pathName = window.location.pathname; var directoryEnd = pathName.indexOf('/', 1); if (directoryEnd !== -1) { pathName = pathName.substring(1, directoryEnd); } if (hiddenField) { hiddenField.value = pathName; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: var(--main-theme-contrast-color); } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: space-evenly; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; flex: 0 0 37%; margin: 0 } #ac-form .form-group label { font-weight: 600; text-align: left; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92% } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1.1em; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .2em 2em .3em 2em; cursor: pointer; box-shadow: var(--contrast-box-shadow); } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } @media (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } .submit-btn { width: 100%; } } Partner with us We work closely with our partners and their technologies to deliver world leading online conferences. Contact us for more on how we work can work with you to help you be even more awesome. Web Directions Conffab Stream and download nearly 1,000 presentations from hundreds of world leading experts at 50 conferences…and counting With free and paid levels, keep up to date with all that's happening in our industry at your own pace. Sign up Now Learn More John Allsopp John Allsopp has been working on the Web for nearly 30 years. He's been responsible for innovative developer tools such as Style Master and X-Ray, and his ideas formed the foundation for Typekit, now Adobe Fonts, and the entire concept of Responsive Web Design. He's spoken at numerous conferences around the World and delivered dozens of workshops in that time as well. His writing includes several books, including Developing With Web Standards and countless articles and tutorials in print and online publications. His "A Dao of Web Design" published in 2000 is cited by Ethan Marcotte as a key influence in the development of Responsive Web Design, who's acclaimed article in 2010 begins by quoting John in detail, and by Jeremy Keith as "a manifesto for anyone working on the Web". John brings his deep knowledge of and passion for the web and all things digital to every aspect of Web Directions. About Us Co-founded and now run by John Allsopp, Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. We spend our lives thinking about what comes next, keeping up with trends in technology, practices and processes, and filtering the hype, to make sure you don't miss trends that matter, and don't waste time on hype that doesn't. We promise attending one of our events will leave you significantly better versed in the challenges you face day to day, and in solutions for addressing them. Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
