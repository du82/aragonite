ore productive? We’d love to hear from you. Here are some of the things we think are important right now Web components (particularly the declarative shadow DOM) front end architectures architecting CSS (including CSS layers) modern CSS layouts Web animation in 2025 (it’s come a long way) new features of JavaScript (like the new array features, temporal, import attributes, chelatest on promises) View Transitions Speculation Rules front end security web performance AI and Machine learning in the browser (so much happening here) but I’m sure there’s much more, we always love to hear what folks propose! For Code Leaders For Code Leaders (Melbourne June 11) what do you wish you’d known sooner as a manager and leader? What have you learned recently that has worked (or now worked) that you’d like others to know? Leading people? Architecting systems? Convincing stakeholders? Code Leaders is all about sharing with your peers. Want to know more? All the details about the events and the proposal process are at our speaking page, which also outlines our philosophy about what makes a great talk. Got an idea you want to run past us? Just contact us and we’ll get back to you right away. Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.v