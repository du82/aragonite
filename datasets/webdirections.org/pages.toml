full_description = '''Weekly reading returns for 2025 John Allsopp 27th January, 2025 @johnallsopp Great reading, every weekend. The best writing about the web, each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1em; font-weight: 600; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .3em 2em .3em 2em; box-shadow: var(--contrast-box-shadow); margin-block-end: .2em; } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } /* Container Query: Applies when .ac-form-container is < 600px */ @container (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } #ac-form { width: 100% } .ac-form-container #ac-form .form-group { flex: 0 0 100%; width: 100%; } .ac-form-container #ac-form .form-group input { width: 100%; } .ac-form-container #ac-form .form-group label { color: #000 } .ac-form-container #ac-form .submit-btn { width: 100%; } #response-message { color: #000 } } A new (Gregorian) year has begun (while the Lunar New Year is still a couple of weeks off). I hope it has begin well with you. Since the last newsletter, I’ve posted dozens of ‘elsewheres’ over at Conffab–this newsletter usually rounds up some of the recent highlights, but you can find much more over there, and if RSS is your thing (I highly recommend if it’s not to go old school and start using RSS!) you can subscribe to the feed here. Speaking at a Web Directions conference in 2025? Whether you’re a seasoned speaker, or a novice, we’d love you to consider speaking at one of our events in 2025. We have details on the events, and the sort of topics we are looking for over here. Speaking of Web Directions events in 2025 So what have we got planned when and where? We’ve got 4 in person conferences in Sydney and Melbourne, and (at least) one online only conference lined up for live-streaming on Conffab. Plus after the success of streaming the renowned design systems conference Clarity in 2024, we’re working hard to lineup more for Conffab. Conffab gives you access to nearly 1,000 talks from world experts, and live streamed conferences from $19.95 a month–there’s even a free option that gives you access to everything over 2 years old! We’d love you to check it out! This week’s reading OK onto this week’s reading! When I wasn’t hauling heavy boxes and (re)assembling furniture, and even while doing so I’ve been giving a lot of thought to trends I think front end folks should be thinking about, and I’ll post something along those lines soon. But to ease us all back into the new year, here’s some of the things I found interesting elsewhere the last couple of weeks. There’s CSS, JavaScript, animation, accessibility, and a bit of AI engineering and more–all the things you’d expect from Web Directions! 6 CSS Snippets Every Front-End Developer Should Know In 2025 animation, CSS, View Transitions I think every front-end developer should know how to enable page transitions, transition a <dialog>, popover, and <details>, animate light n’ dark gradient text, type safe their CSS system, and add springy easing to animation Source: 6 CSS Snippets Every Front-End Developer Should Know In 2025 A great roundup of useful recent additions to CSS you’ll find handy in making more sophisticated UIs from Adam Argyl. CSS text-box-trim This property lets you control the space above and below text, for example , and . Every font produces a different amount of this block directional space which contributes to the element’s size. This chaotic space contribution is not easily measured, and has been impossible to control until now.The font knows, now CSS knows! Source: CSS text-box-trim | Blog | Chrome for Developers text-box-trim is a new CSS features that helps with tricky text layout issues we’ve been facing for decades. Add it to your toolbox. The :empty pseudo-class in CSS | Go Make Things CSS selectors You can use this to target elements that have no children—either child elements or whitespace and text nodes—and style them differently than they would be otherwise. Source: The :empty pseudo-class in CSS | Go Make Things Sometimes you want to style an empty element, one with no child elements, differently from similar elements that have contents. And with this relatively new CSS pseudo-class you can. CSS light-dark() CSS, CSS color light-dark() makes it easy to build websites that respect the user’s preferred color scheme while also providing the ability to override the color scheme without code duplication. Be sure to check out the demo at the bottom! Before we dive into light-dark(), let’s take a quick detour to understand color-scheme. Source: CSS light-dark() | 12 Days of Web Mayank gives us an easy standards based way to do light/dark themed web sites and talks a bit about the CSS color-scheme property. 5 Technical JavaScript Trends You Need To Know About in 2025 architecture, JavaScript, software engineering JavaScript remains the foundation of modern web development — not because it’s convenient, but because it’s relentless. It’s the most adaptive, versatile language, shaping everything from enterprise-grade applications to cutting-edge browser innovations. What’s emerging now in JavaScript isn’t incremental progress; it’s a paradigm shift. We’re talking about serverless architectures that scale globally, state management that decouples complexity from growth, and integrations that bring JavaScript closer to the hardware — running faster and leaner than anyone thought possible. Source: 5 Technical JavaScript Trends You Need To Know About in 2025 – The New Stack The folks at the New Stack have some predictions for front end development for 2025–they suggest a paradigm shift in how we develop. Definitely food for thought. Are we seeing the back end commodified? Accessibility essentials every front-end developer should know a11y, accessibility, JavaScript, react Many developers view accessibility as an overwhelming task, requiring a lot of extra effort or specialized knowledge. But a few basic practices can make a significant impact.In this article, I’ll walk you through the key accessibility principles I believe every front-end developer should apply when building components, including: Semantic HTML: Use the right elements for interactive and native functionality. Forms: Simplify labels and structure to improve usability for everyone. Keyboard navigation: Ensure users can navigate around with their keyboard. Modals: Modals have many accessibility requirements. Image alt texts: Write better descriptions to make images more accessible. Styling: Enhance accessibility through focus indicators, responsive design, and reduced motion. ARIA Attributes: When and how to use ARIA to fill accessibility gaps. Source: Accessibility essentials every front-end developer should know by Martijn Hols A good roundup of accessibility essentials for front end developers, whatever framework (if any) you use. Revealed: React’s experimental animations API animation, react, View Transitions Since its inception over 12(!) years ago, there’s been a glaring animation-sized hole in React’s API. Over the years its closest competitors like Vue and Svelte have introduced APIs that, while not extensive, still make animations a little easier. Whereas React developers have had to rely on third-party libraries like Motion for React, React Spring or others. Until now.Yes, React is getting its first animations API. The angels sing, the heavens part, and through the break in the long gloom descends author Seb Markbåge, gifting unto the world. (Incidentally I have to thank Seb for fielding my many questions about this new API)As its name implies, is based on the browser’s powerful new View Transition API feature. Source: Revealed: React’s experimental animations API – Motion Blog I feel there’s no little irony that React’s first real native animation capability, the still experimental <ViewTransition> harnesses the new Web platform View Transition API, which we’ve been excited about for a while now! On-Device AI: Building Smarter, Faster, And Private Applications — Smashing Magazine generative AI, LLMs, web AI Shouldn’t there be a way to keep your apps or project data private and improve performance by reducing server latency? This is what on-device AI is designed to solve. It handles AI processing locally, right on your device, without connecting to the internet and sending data to the cloud. In this article, Joas Pambou explains what on-device AI is, why it’s important, the tools to build this type of technology, and how it can change the way we use technology every day. Source: On-Device AI: Building Smarter, Faster, And Private Applications — Smashing Magazine We think something big is coming to the Web in the next 12-24 months. Inference, the aspect of large language models where we generate a response to a prompt (as opposed to training which is creating the model in the first place) is moving onto the device (in many cases). Apple Intelligence is perhaps the most high profile example of this. But the Web has a strong story here too–and Joas Pambou does an incredible job of outlining the field here. Highly recommended. Common pitfalls when building generative AI applications generative AI, Product Design As we’re still in the early days of building applications with foundation models, it’s normal to make mistakes. This is a quick note with examples of some of the most common pitfalls that I’ve seen, both from public case studies and from my personal experience.Because these pitfalls are common, if you’ve worked on any AI product, you’ve probably seen them before. … In short, here are the common AI engineering pitfalls: Use generative AI when you don’t need generative AIGen AI isn’t a one-size-fits-all solution to all problems. Many problems don’t even need AI. Confuse ‘bad product’ with ‘bad AI’For many AI product, AI is the easy part, product is the hard part. Start too complexWhile fancy new frameworks and finetuning can be useful for many projects, they shouldn’t be your first course of action. Over-index on early successInitial success can be misleading. Going from demo-ready to production-ready can take much longer than getting to the first demo. Forgo human evaluationAI judges should be validated and correlated with systematic human evaluation. Crowdsource use casesHave a big-picture strategy to maximize return on investment. Source: Common pitfalls when building generative AI applications It is still very early days when it comes to building with generative AI–few people know much if anything. One person who knows more than just about anyone is Chip Huyen, who rounds up a number of common pitfalls. Is there such a thing as a web-safe font? CSS, fonts, typography Says Wikipedia: “Web-safe fonts are computer fonts that may reasonably be expected to be present on a wide range of computer systems, and used by Web content authors to increase the likelihood that content displays in their chosen font.” Yes, reasonably expected. But that doesn’t mean really expected. For example this article points out that even Arial and Times New Roman are not present on some Android distributions. And, as I found out today (Thanks Barry!) working on this here web site, Courier New is not available on iOS. Let’s repeat this again. Source: Is there such a thing as a web-safe font? Next we’ll be hearing there’s no such thing as a web safe color palette! Until next week! Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; '''
