full_description = '''Our 2025 Events Here's what we're bringing you in person (and streaming) in 2025. With more online at Conffab. web directions UX Australia Melbourne August 2025 The conference at the heart of the Australian UX community . Learn More web directions code Melbourne June 2025 Australia's conference for JavaScript developers and front end engineers. Learn More web directions code leaders Melbourne June 2025 for engineering leaders and managers creating world class engineering teams and cultures Learn More web directions developersummit Sydney November 2025 A world leading conference for the people building the Web. Learn More web directions Next Sydney November 2025 What's next in the world of digital design, product and strategy? Learn More web directions inference online 2025 AI and ML in the browser and at the edge Learn More Keen to speak at one of our 2025 events? If you're keen to speak at one of our events in 2025, we'd love to hear from you. CFPs are open now. Read all the details about what we're looking for and what we offer speakers. Learn more and apply! Keep up to date with Announcements Want to keep up to date with news about our 2025 events? Let us know below and we'll email you as things develop. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_event_interest_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); var pathName = window.location.pathname; var directoryEnd = pathName.indexOf('/', 1); if (directoryEnd !== -1) { pathName = pathName.substring(1, directoryEnd); } if (hiddenField) { hiddenField.value = pathName; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: var(--main-theme-contrast-color); } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: space-evenly; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; flex: 0 0 37%; margin: 0 } #ac-form .form-group label { font-weight: 600; text-align: left; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92% } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1.1em; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .2em 2em .3em 2em; cursor: pointer; box-shadow: var(--contrast-box-shadow); } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } @media (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } .submit-btn { width: 100%; } } Partner with us We work closely with our partners and their technologies to deliver world leading online conferences. Contact us for more on how we work can work with you to help you be even more awesome. Web Directions Conffab Stream and download nearly 1,000 presentations from hundreds of world leading experts at 50 conferences…and counting With free and paid levels, keep up to date with all that's happening in our industry at your own pace. Sign up Now Learn More John Allsopp John Allsopp has been working on the Web for nearly 30 years. He's been responsible for innovative developer tools such as Style Master and X-Ray, and his ideas formed the foundation for Typekit, now Adobe Fonts, and the entire concept of Responsive Web Design. He's spoken at numerous conferences around the World and delivered dozens of workshops in that time as well. His writing includes several books, including Developing With Web Standards and countless articles and tutorials in print and online publications. His "A Dao of Web Design" published in 2000 is cited by Ethan Marcotte as a key influence in the development of Responsive Web Design, who's acclaimed article in 2010 begins by quoting John in detail, and by Jeremy Keith as "a manifesto for anyone working on the Web". John brings his deep knowledge of and passion for the web and all things digital to every aspect of Web Directions. About Us Co-founded and now run by John Allsopp, Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. We spend our lives thinking about what comes next, keeping up with trends in technology, practices and processes, and filtering the hype, to make sure you don't miss trends that matter, and don't waste time on hype that doesn't. We promise attending one of our events will leave you significantly better versed in the challenges you face day to day, and in solutions for addressing them. Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
