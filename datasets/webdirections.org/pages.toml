full_description = "Your weekly reading–performance, platforms, security, CSS and more 24th February, 2025 @johnallsopp After last week’s deep dive on the question “What is Software Engineering in the age of LLMs?” this week we round up a bumper crop of recent reading, with a heavy dose of performance, some security, CSS and more. The web on mobile Ten or fifteen years ago, the gap between the web and native […] Your weekend reading–the AI Software Engineering edition 17th February, 2025 @johnallsopp Every week I read a lot of articles, blog posts, listen to numerous podcasts, watch a fair number of videos, all trying to keep up with what is happening in a relatively narrow slice or two of technology. It’s interesting that sometimes a raft of related things arrive almost all at once, and the last […] UX Australia and Web Directions are teaming up! 14th February, 2025 @johnallsopp This is one of the most exciting announcements we’ve ever, ever made. So I won’t bury the lede–UX Australia and Web Directions are joining forces to bring you the 2025 edition of their legendary conference. Say What? I’ve long admired UX Australia, which has been around since 2009, just a couple of years after Web […] Your weekly Web Directions reading 10th February, 2025 @johnallsopp Week 3 of our 2025 streak features articles, documentaries and bonus presentation videos on a range of topics for anyone working on the Web. From CSS features old and new, to a very engaging and watchable documentary on the origins of Node.JS, and much more. Remember if you’re keen to talk at one of our […] Your weekend reading 3rd February, 2025 @johnallsopp Keeping up our 2025 posting streak (of now 2, but from little things…), here’s a roundup of some things we found this week we thought you might find valuable. Plenty of CSS and thoughts on architecting the Web, plus some AI for developers related articles as well, and more. Like what you see? Checkout our […] Weekly reading returns for 2025 27th January, 2025 @johnallsopp A new (Gregorian) year has begun (while the Lunar New Year is still a couple of weeks off). I hope it has begin well with you. Since the last newsletter, I’ve posted dozens of ‘elsewheres’ over at Conffab–this newsletter usually rounds up some of the recent highlights, but you can find much more over there, […]"
