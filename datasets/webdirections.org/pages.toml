s may be sanctioned or expelled from the event, and refused entry to further events, without a refund at the discretion of the conference organisers. The Less Quick Version Harassment includes offensive verbal comments related to gender, sexual orientation, disability, physical appearance, body size, race, religion, sexual images in public spaces, deliberate intimidation, stalking, following, harassing photography or recording, sustained disruption of talks or other events, inappropriate physical contact, and unwelcome sexual attention. Participants asked to stop any harassing behaviour are expected to comply immediately. Sponsors are also subject to the anti-harassment policy. In particular, sponsors should not use sexualised images, activities, or other material. Booth staff (including volunteers) should not use sexualised clothing/uniforms/costumes, or otherwise create a sexualised environment. If a participant engages in harassing behaviour, the event organisers may take any action they deem appropriate, including warning the offender or expulsion from the event with no refund, and barring offender from future events. If you are being harassed, notice that someone else is being harassed, or have any other concerns, please contact John Allsopp, or Rosemary Allsopp immediately. As above, you will find us via the info/registration desk at the event. We will be happy to help participants contact hotel/venue security or local law enforcement, provide escorts, or otherwise assist those experiencing harassment to feel safe for the duration of the conference. We value your attendance. We expect participants to follow these rules at all venues for all our events, whether they be conference, workshop or social. Attribution Adopted from The Conference Code of Conduct. Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementByI