he part Core Web Vitals plays, then Google’s Annie Sullivan will dive deeply into each of these metrics, demystifying them, and helping us understand how best to address improving them. There’s over a dozen presentations in total, all focussed exclusively on front end performance. Curated and MC’d by Henri Helvetica, this phrase is over used, but it is an event not to be missed if you care about performance, and these days, we really can’t afford not to be. In 2022 we have a whole series of events for Front End Developers Across 2022 Web Directions is presenting our series of online conferences for front end designers and developers. Focussed deep dives, they go far beyond what you might expect from conference programs. Learn more and register now Priced individually from $195, or attend all 6, plus get access to our conference presentation platform Conffab for just $595, or $59 a month. Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-contai