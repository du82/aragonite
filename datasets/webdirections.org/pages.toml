ssary for us to do what you have asked us to do. This information may include your name and the name of your organisation your email address, address and telephone number any special requirements you may have your credit/debit card number, expiry date and billing address How is this information used? We may use the information we collect to process your order and create your tax invoice and ticket(s) send you ongoing information regarding the conference, workshop or info night for which you have registered inform you of related upcoming events Disclosure of Personal Information to Third Parties We may be required on occasion to disclose your personal information to third parties eg if required by law or to provide the service you requested. Other than these occasions, we do not disclose your personal information for any other purpose unless you have authorised us to do so. Under no circumstances will we sell or receive payment for licensing or disclosing your personal information. Security Any information we collect from you is stored in a secure database. We use 128 bit encryption in areas where personal details for payment are required. To ensure your confidentiality a secure (SSL) connection is required (by the server) for the entire registration section of our site. Cookies A cookie is a small text file that a website can send to your browser, which may then store it on your system. You can set your browser to notify you when you receive a cookie, giving you the option of accepting or refusing it. Our site may from time to time make use of cookies to measure visitor patterns at our site enable commission tracking software to correctly track referrals Access and correction We will take reasonable steps to ensure your personal information is accurate, complete and up-to-date. Should you wish to access or amend this information, or to opt out of receiving any communications or be removed from any databases please contact info@localhost. Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-famil