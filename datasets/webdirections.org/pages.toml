full_description = '''UX Australia is Australia's premier conference about UX, product and service design, and the surrounding disciplines of research, content, operations, management, and more. Connect with a global audience to share inspiration, insights, knowledge and experiences. Join peers, pros and leaders who can help with challenges and may be the bridge to your next opportunity. Take away new skills and insights to apply in your organisation. Keen to speak at UX Australia? If you're keen to speak at UX Australia, we'd love to hear from you. CFPs are open now, closing May 2nd 2025. Read all the details about what we're looking for and what we offer speakers. Learn more and apply! Previous editions of UX Australia After a year's hiatus, UX Australia returns revitalised in 2025. See what we covered in previous years, starting way back in 2009. 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 Find the conference pass for you There's in person and streaming options, and we have special pricing if you're paying your own way, in education, at a not for profit, and for early career professionals wherever you are working. Early bird ends May 3–that's UX Australia 2025 in person $995before May 3 Includes UX Australia in person attendance UX Australia conference videos early bird ends May 3 $995 middle bird ends July 18 $1095 late bird $1295 See below for special pricing register UX Australia Streaming Pass $495before May 3 Includes UX Australia live stream UX Australia conference videos early bird ends May 3 $495 middle bird ends July 18 $595 late bird $695 See below for special pricing register What's included? In person In-person conferences are fully catered (morning and afternoon tea and lunch) including any dietary requrements. Our conferences feature amazing coffee (and more). We end the first day with a reception at the venue. Streaming Streaming passes include access to the conference livestream on Web Direction's platform Conffab, including live captioning and chat, access to the stream on demand after the event and to the conference videos when they become available. Special Pricing We know it's valuable to attend, to learn from our experts, and make connections in the industry. So, to make our events as affordable as possible, we have special pricing for a range of attendees. Freelancers If you're paying you're own way–whether as a contractor, freelance, consultant, independent–whatever you might call yourself, or if you're employed but you're covering the cost, then use the code freelanceuxau25 and pay just $795 in person or the code freelanceuxau25streaming and pay $395 streaming. Education If you work in education–as an educator or otherwise for an educational institution, then you'll pay just $795 with the code eduuxau25, or $395 streaming with the code eduuxau25streaming Juniors To encourage teams to send juniors to our events, we have special pricing for early career professionals. Use the code junioruxau25 and pay $795 in person or junioruxau25streaming and pay just $395 for a streaming pass. Not for profits As a not for profit, register with the code nfpuxau25, and pay just $795, or nfpuxau25streaming and pay $395 for a streaming pass. Keep up to date with Announcements Want to keep up to date with news about UX Australia? Let us know below and we'll email you as things develop. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_event_interest_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); var pathName = window.location.pathname; var directoryEnd = pathName.indexOf('/', 1); if (directoryEnd !== -1) { pathName = pathName.substring(1, directoryEnd); } if (hiddenField) { hiddenField.value = pathName; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: var(--main-theme-contrast-color); } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: space-evenly; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; flex: 0 0 37%; margin: 0 } #ac-form .form-group label { font-weight: 600; text-align: left; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92% } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1.1em; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .2em 2em .3em 2em; cursor: pointer; box-shadow: var(--contrast-box-shadow); } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } @media (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } .submit-btn { width: 100%; } } Our venue UX Australia 2025 will take place August 27th and 28th at ACMI in Federation Square, Melbourne. Getting there: There are numerous public transport options, and parking available close by. Accommodation: If you're coming from out of town, there are many hotel and serviced apartment style accomodation options in and around the area. Live Streaming Not everyone is ready, or able to get back to in-person events. Others find online conferences provide greater accessibility, or make their training budget go further. So we'll be streaming UX Australia, on Web Direction's very own streaming platform Conffab. Streaming passes just $495 Partner with us Keen to connect with those in the industry shaping its direction? Then Next is for you. We work closely with our partners and their technologies to deliver world leading online conferences. Contact us to talk about how we can help you be even more awesome. Web Directions Conffab Stream and download nearly 1,000 presentations from hundreds of world leading experts at 50 conferences…and counting With free and paid levels, keep up to date with all that's happening in our industry at your own pace. Sign up Now Learn More Organised and produced by In 2025, UX Australia teams up with Web Directions to bring you Australia's leading UX conference. About Steve Baty Steve was the inaugural CEO of the Australian Design Council, co-founder of Meld Studios and co-founder of UX Australia. He is a Director of the Product Stewardship Centre of Excellence and served two years as the President of the Interaction Design Association. His practice is centred on improving our public spaces, infrastructure and services. About UX Australia Since 2009, UX Australia has been Australia's premier conference about UX, product and service design, and the surrounding disciplines of research, content, operations, management, and more. About Web Directions Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. About John Allsopp John Allsopp has been working on the Web for nearly 30 years. His ideas formed the foundation for Typekit, now Adobe Fonts, and the entire concept of Responsive Web Design. His "A Dao of Web Design" published in 2000 is cited by Ethan Marcotte as a key influence in the development of Responsive Web Design, who's acclaimed article in 2010 begins by quoting John in detail, and by Jeremy Keith as "a manifesto for anyone working on the Web". Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
