title = "UX Australia 2025 CFP"
description = "Melbourne August 27th and 28th 2025. The conference at the heart of the Australian UX community"
full_description = '''We'd love to hear your UX Australia 2025 talk proposals To have the best chance of getting a talk accepted, please take a couple of minutes to read this page to get a sense of the audience and what we're looking for. The audience The audience at UX Australia is predominantly experienced working UX practitioners, so if your topic is more focused on a methodology or a deep exploration of a process, be sure to add your unique insights and experiences as well. See more on writing a great proposal. What we're looking for In all proposals, we're looking for: Clarity of ideas - Focused ideas that are clearly and persuasively expressed in the summary pitch. Real stories - Topics based on your demonstrable, practical experience. Fresh perspectives - New and interesting insights beyond what we all discover in our first couple of years working. Substance - Enough detail for us to get a clear idea of the presentation narrative and objectives. Outcomes - we’re looking for clear outcomes and learning objectives. For even more detail, this article really outlines what we think makes for a stellar talk proposal. OK, I'm keen! Where do I propose? You'll find a form for proposing for our 2025 conferences below. You propose, we'll work out where the best fit is. Feel free to submit multiple proposals as well! What Do Speakers Get? We provide travel and accomodation for speakers at our in-person conferences, plus speaker dinners, receptions and an all round great experience for speakers. And it doesn't stop with the conference, we host your presentation on our streaming platform Conffab, where speakers are compensated for the engagement their presentations generate! And speakers get a lifetime Conffab subscription as well. Good luck, we can't wait to hear your proposals! Questions? Happy to discuss your proposal and thoughts–just email Steve Baty steve@uxaustralia.com.au. Ready? Head over to our CFP form and submit away–for multiple proposals just submit multiple times.! Loading… Organised and produced by In 2025, UX Australia teams up with Web Directions to bring you Australia's leading UX conference. About Steve Baty Steve was the inaugural CEO of the Australian Design Council, co-founder of Meld Studios and co-founder of UX Australia. He is a Director of the Product Stewardship Centre of Excellence and served two years as the President of the Interaction Design Association. His practice is centred on improving our public spaces, infrastructure and services. About UX Australia Since 2009, UX Australia has been Australia's premier conference about UX, product and service design, and the surrounding disciplines of research, content, operations, management, and more. About Web Directions Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. About John Allsopp John Allsopp has been working on the Web for nearly 30 years. His ideas formed the foundation for Typekit, now Adobe Fonts, and the entire concept of Responsive Web Design. His "A Dao of Web Design" published in 2000 is cited by Ethan Marcotte as a key influence in the development of Responsive Web Design, who's acclaimed article in 2010 begins by quoting John in detail, and by Jeremy Keith as "a manifesto for anyone working on the Web". Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
