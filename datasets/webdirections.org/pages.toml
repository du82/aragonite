title = "UX Australia 2025"
description = "Melbourne August 27th and 28th 2025. The conference at the heart of the Australian UX community"
full_description = '''UX Australia is Australia's premier conference about UX, product and service design, and the surrounding disciplines of research, content, operations, management, and more. Connect with a global audience to share inspiration, insights, knowledge and experiences. Join peers, pros and leaders who can help with challenges and may be the bridge to your next opportunity. Take away new skills and insights to apply in your organisation. Keen to speak at UX Australia? If you're keen to speak at UX Australia, we'd love to hear from you. CFPs are open now, closing May 2nd 2025. Read all the details about what we're looking for and what we offer speakers. Learn more and apply! Previous editions of UX Australia After a year's hiatus, UX Australia returns revitalised in 2025. See what we covered in previous years, starting way back in 2009. 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 Find the conference pass for you There's in person and streaming options, and we have special pricing if you're paying your own way, in education, at a not for profit, and for early career professionals wherever you are working. Early bird ends May 3–that's UX Australia 2025 in person $995before May 3 Includes UX Australia in person attendance UX Australia conference videos early bird ends May 3 $995 middle bird ends July 18 $1095 late bird $1295 See below for special pricing register UX Australia Streaming Pass $495before May 3 Includes UX Australia live stream UX Australia conference videos early bird ends May 3 $495 middle bird ends July 18 $595 late bird $695 See below for special pricing register What's included? In person In-person conferences are fully catered (morning and afternoon tea and lunch) including any dietary requrements. Our conferences feature amazing coffee (and more). We end the first day with a reception at the venue. Streaming Streaming passes include access to the conference livestream on Web Direction's platform Conffab, including live captioning and chat, access to the stream on demand after the event and to the conference videos when they become available. Special Pricing We know it's valuable to attend, to learn from our experts, and make connections in the industry. So, to make our events as affordable as possible, we have special pricing for a range of attendees. Freelancers If you're paying you're own way–whether as a contractor, freelance, consultant, independent–whatever you might call yourself, or if you're employed but you're covering the cost, then use the code freelanceuxau25 and pay just $795 in person or the code freelanceuxau25streaming and pay $395 streaming. Education If you work in education–as an educator or otherwise for an educational institution, then you'll pay just $795 with the code eduuxau25, or $395 streaming with the code eduuxau25streaming Juniors To encourage teams to send juniors to our events, we have special pricing for early career professionals. Use the code junioruxau25 and pay $795 in person or junioruxau25streaming and pay just $395 for a streaming pass. Not for profits As a not for profit, register with the code nfpuxau25, and pay just $795, or nfpuxau25streaming and pay $395 for a streaming pass. Keep up to date with Announcements Want to keep up to date with news about UX Australia? Let us know below and we'll email you as things develop. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_event_interest_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var 