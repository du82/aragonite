full_description = '''If you lead engineering teams and cultures, or aspire to, this is the event for you. senior engineers engineering managers CTOs VPs of Engineering Team Leads Directors of Engineering Keen to speak at Code Leaders? If you're keen to speak at Code Leaders or one of our other events in 2025, we'd love to hear from you. CFPs are open now, closing March Read all the details about what we're looking for and what we offer speakers. Learn more and apply! Previous editions of Code Leaders Code Leaders has been running since 2017. See our past lineups from 2017, 2018, 2019, 2022, 2023 and 2024. Watch past conference presentations from 2018, 2019, and 2022 Conffab. Find the conference pass for you Attend Code Leaders by itself, or add a Code ticket for 3 in depth days. There's great bonuses for you and your organisation when you attend as a team Early bird ends in Code + Code Leaders Pass $1995before April 18 Includes Code + Code Leaders in person attendance Code + Code Leaders conference videos early bird ends April 18 $1995 middle bird ends May 30 $2095 Full Price $2295 register Code Leaders Pass $795 before April 18 Includes Code Leaders in person attendance Code Leaders conference videos early bird ends April 18 $795 middle bird ends May 30 $895 Full Price $995 register Code Leaders Streaming Pass $295 Includes Code Leaders live stream Code Leaders conference videos register Conffab Premium $695 Includes Code + Code Leaders live streams Code + Code Leaders conference videos Plus all our live and on-demand content for 12 months register What's included? In person In-person conferences are fully catered (morning and afternoon tea and lunch) including any dietary requrements. Our conferences feature amazing coffee (and more). Code also features a reception. Streaming Streaming passes include access to the conference livestream on our very own platform Conffab, including live captioning and chat, access to the stream on demand after the event and to the conference videos when they become available. Special Pricing We know it's valuable to attend, to learn from our experts, and make connections in the industry. So, to make our events as affordable as possible, we have special pricing for a range of attendees. Freelancers If you're paying you're own way–contractor, freelance, consultant, independent–whatever you might call yourself use the code freelanceleaders25 when you register, and pay just $595. Register Education If you work in education–as an educator or otherwise for an educational institution, then you'll pay just $595 with the code eduleaders25 Register Not for profits As a not for profit, register with the code nfpleaders25, and pay just $595. Register Bring the whole team Over the years we've had many many teams attend our conferences together–treating it like an offsite, with amazing speakers, coffee, and more. Some come back year after year (well, they did until Covid). And now we're returning, bigger and better than ever, we're keen to make it really worth your while to attend together. So here's a range of bonuses for groups of 5 or more from the same organisation. Send 5 or more to Code, and receive Ticket Upgrades We'll add a year of Conffab Pro for each attendee. Bonus Code Leaders tickets For each 5 Code tickets you register, get a bonus Code Leaders ticket Simply register 5 or more Code tickets and we'll be in touch, or contact us to learn more register. Keep up to date with Announcements Want to keep up to date with news about Code Leaders? Let us know below and we'll email you as things develop. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_event_interest_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); var pathName = window.location.pathname; var directoryEnd = pathName.indexOf('/', 1); if (directoryEnd !== -1) { pathName = pathName.substring(1, directoryEnd); } if (hiddenField) { hiddenField.value = pathName; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: var(--main-theme-contrast-color); } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: space-evenly; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; flex: 0 0 37%; margin: 0 } #ac-form .form-group label { font-weight: 600; text-align: left; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92% } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1.1em; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .2em 2em .3em 2em; cursor: pointer; box-shadow: var(--contrast-box-shadow); } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } @media (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } .submit-btn { width: 100%; } } Our venue Web Directions Code 2025 will take place in June once more at ACMI in Federation Square, Melbourne. Getting there: There are numerous public transport options, and parking available close by. Accommodation: If you're coming from out of town, there are many hotel and serviced apartment style accomodation options in and around the area. Partner with us We work closely with our partners and their technologies to deliver world leading online conferences. Contact us for more on how we work can work with you to help you be even more awesome. Web Directions Conffab Stream and download nearly 1,000 presentations from hundreds of world leading experts at 50 conferences…and counting With free and paid levels, keep up to date with all that's happening in our industry at your own pace. Sign up Now Learn More John Allsopp John Allsopp has been working on the Web for nearly 30 years. He's been responsible for innovative developer tools such as Style Master and X-Ray, and his ideas formed the foundation for Typekit, now Adobe Fonts, and the entire concept of Responsive Web Design. He's spoken at numerous conferences around the World and delivered dozens of workshops in that time as well. His writing includes several books, including Developing With Web Standards and countless articles and tutorials in print and online publications. His "A Dao of Web Design" published in 2000 is cited by Ethan Marcotte as a key influence in the development of Responsive Web Design, who's acclaimed article in 2010 begins by quoting John in detail, and by Jeremy Keith as "a manifesto for anyone working on the Web". John brings his deep knowledge of and passion for the web and all things digital to every aspect of Web Directions. About Us Co-founded and now run by John Allsopp, Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. We spend our lives thinking about what comes next, keeping up with trends in technology, practices and processes, and filtering the hype, to make sure you don't miss trends that matter, and don't waste time on hype that doesn't. We promise attending one of our events will leave you significantly better versed in the challenges you face day to day, and in solutions for addressing them. Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
