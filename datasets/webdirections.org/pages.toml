full_description = '''JavaScript, Ajax and the DOM Great reading, every weekend. The best writing about the web, each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1em; font-weight: 600; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .3em 2em .3em 2em; box-shadow: var(--contrast-box-shadow); margin-block-end: .2em; } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } /* Container Query: Applies when .ac-form-container is < 600px */ @container (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } #ac-form { width: 100% } .ac-form-container #ac-form .form-group { flex: 0 0 100%; width: 100%; } .ac-form-container #ac-form .form-group input { width: 100%; } .ac-form-container #ac-form .form-group label { color: #000 } .ac-form-container #ac-form .submit-btn { width: 100%; } #response-message { color: #000 } } Do they use JavaScript? JavaScript coding practices Libraries and Frameworks The resurgence of the use of JavaScript, and the increased level of sophistication in its employment on the web is nothing short of spectacular. After an early surge of enthusiasm in the mid to late 1990s, JavaScript remained largely confined to effects and gimmicks, until the rise of Ajax and various libraries and frameworks. That the majority of our respondents consider themselves “developers” not “designers” is testimony to how important JavaScript and Ajax have become. In this section, we tried to get an understanding of the extent to which respondents used JavaScript (if at all), and how they used JavaScript. Do they use JavaScript? In response to the question “Do you use JavaScript in your development?”, only 5% replied no. 73% replied that they use it for visual effects, 61% for form validation, 42% for complex application interaction, and over half for Ajaxian communication between client and server (respondents could give multiple answers). Both the overall percentage of JavaScript users (95%), and the level of sophistication they are using the language for reflect not only the prominence of JavaScript as part of these respondents tools, but also the nature of web development generally today. The days of the static page based web site are definitely on the way out, and the day of the web application is on the rise. Do you use JavaScript in your development? Answer Count Percentage No 65 5.27% For visual effects 902 73.10% For form validation 754 61.10% For complex application interaction 520 42.14% For Ajax communication with the server 659 53.40% We followed up with some questions about developers’ methodologies when it comes to using JavaScript. JavaScript coding practices First up, we asked “Do you separate your JavaScript from your markup (“unobtrusive JavaScript”)?”, a recommended practice. Just under 4% of developers said no, while 39% said always, and 42% said usually. It’s clear that respondents are at least on the whole aware of this recommended practice. Do you separate your JavaScript from your markup? Answer Count Percentage Always 477 38.65% Usually 518 41.98% No 47 3.81% No answer 82 6.65% Non completed 110 8.91% We also asked “Do you strictly adhere to the W3C DOM, and avoid browser specific extensions?”. Again only around 4% answered in the negative, while half answered “as much as possible”, and just under a third “always”. Only about 9% of respondents answered the follow up question “What non W3C DOM methods or properties do you use regularly?” Unsurprisingly, innerHTML tops the list at around 40% of these respondents. At about 7% is xmlHttpRequest. The latter is currently a draft specification from the W3C, while innerHTML is a proposed addition to HTML 5. About 17% of these respondents specifically mentioned working around Internet Explorer bugs, or lack of support of aspects of the W3 DOM. Like all the other questions which asked for further information from respondents, the full responses are available in the CSV of the survey results. Do you strictly adhere to the W3C DOM, and avoid browser specific extensions? Answer Count Percentage Yes 375 30.39% As much as possible 613 49.68% No 53 4.29% No answer 83 6.73% Non completed 110 8.91% Libraries and Frameworks The resurgence of the use of JavaScript has gone hand in hand with the rise of robust, sophisticated JavaScript libraries like JQuery, Dojo and YUI. To get a sense of whether developers are using these libraries, and which ones, we asked “Which JavaScript libraries and frameworks do you use?”, with options for a dozen of the most well known libraries, and the option too of listing other libraries used. 10% of respondents replied that they used no libraries, suggesting that as many as 95% of developers who use JavaScript use libraries to some extent. In terms of which libraries were used (respondents could list more than one library), JQuery dominates among these respondents, with 63% of developers answering that they use it. Other commonly used libraries include Prototype at 23%, Mootools at 19%, Script.aculo.us at 18%, and YUI at 11%. In this survey, no other library gained a share of more than 3%. Of the “other” libraries used (a total of just on 4% of respondents answered other), only Adobe’s Spry, with a total of 11, or about 1%, had any non trivial number of respondents. Which JavaScript libraries and frameworks do you use? Answer Count Percentage None 119 9.64% Backbase 2 0.16% Dojo 36 2.92% Ext 33 2.67% GWT 16 1.30% JQuery 775 62.80% Mootools 235 19.04% Prototype 287 23.26% qooxdoo 1 0.08% script.aculo.us 224 18.15% YUI 133 10.78% Other 50 4.05% It’s clear that in just a few short years, JavaScript has gone from something used sparingly to add a little interaction or some effects to sites, to a key technology for web professionals. Next Next we’ll take a look at how respondents use embedded content like Flash and Silverlight which require browser plug-ins. Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-conta