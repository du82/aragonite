full_description = '''UX Australia and Web Directions are teaming up! John Allsopp 14th February, 2025 @johnallsopp Great reading, every weekend. The best writing about the web, each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1em; font-weight: 600; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .3em 2em .3em 2em; box-shadow: var(--contrast-box-shadow); margin-block-end: .2em; } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } /* Container Query: Applies when .ac-form-container is < 600px */ @container (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } #ac-form { width: 100% } .ac-form-container #ac-form .form-group { flex: 0 0 100%; width: 100%; } .ac-form-container #ac-form .form-group input { width: 100%; } .ac-form-container #ac-form .form-group label { color: #000 } .ac-form-container #ac-form .submit-btn { width: 100%; } #response-message { color: #000 } } This is one of the most exciting announcements we’ve ever, ever made. So I won’t bury the lede–UX Australia and Web Directions are joining forces to bring you the 2025 edition of their legendary conference. Say What? I’ve long admired UX Australia, which has been around since 2009, just a couple of years after Web Directions first started. Like Web Directions, it’s always been an independent conference, focussed on the community of practice the founders were deeply involved with. It has grown up alongside the industry it’s part of and it’s not an exaggeration to say the profession of design in Australia would be a pale imitation of itself in the absence of their wonderful conferences. UX Australia shared with us the almost overwhelming challenges of Covid–and its impact on in person events–adapting to an online format and delivery, and then a hybrid model as in person events became possible, if far from easy, again. Then in 2024 UX Australia took a hiatus, leaving a huge hole in the Australian industry. But, I’m excited and proud to announce, Web Directions is teaming up with UX Australia to bring this stellar and important event back in 2025 (and beyond)! Steve Baty, co-founder and long time organiser of UX Australia will be programming the event, ensuring the same independent, high quality content and professional relevance, while we’ll be there in the background helping make sure it all runs smoothly, and ensuring a great experience, whether you’re there in person, or online on Web Direction’s very own streaming platform Conffab. This year UX Australia will take place in Melbourne, at ACMI in Federation Square, during its traditional time slot of the last week of August. Interested in Speaking? CFPs are open now until May 2nd, and if you’re keen to speak take a look at what we’re looking for. Early Bird tickets on sale now Early bird tickets are on sale from today–but with a more intimate venue than in previous years, don’t wait too long, as we expect ticket to sell out. There’s in person and streaming passes, and special pricing for both for those paying your own way, folks in education and at not for profits, and early career professionals. Mark your calendars for August 27th and 28th and we look forward to seeing you in Melbourne for the return of UX Australia. Great reading, every weekend. We round up the best writing about the web and send it your way each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { docume