isibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } @media (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } .submit-btn { width: 100%; } } Partner with us We work closely with our partners and their technologies to deliver world leading online conferences. Contact us for more on how we work can work with you to help you be even more awesome. Web Directions Conffab Stream and download nearly 1,000 presentations from hundreds of world leading experts at 50 conferences…and counting With free and paid levels, keep up to date with all that's happening in our industry at your own pace. Sign up Now Learn More John Allsopp John Allsopp has been working on the Web for nearly 30 years. He's been responsible for innovative developer tools such as Style Master and X-Ray, and his ideas formed the foundation for Typekit, now Adobe Fonts, and the entire concept of Responsive Web Design. He's spoken at numerous conferences around the World and delivered dozens of workshops in that time as well. His writing includes several books, including Developing With Web Standards and countless articles and tutorials in print and online publications. His "A Dao of Web Design" published in 2000 is cited by Ethan Marcotte as a key influence in the development of Responsive Web Design, who's acclaimed article in 2010 begins by quoting John in detail, and by Jeremy Keith as "a manifesto for anyone working on the Web". John brings his deep knowledge of and passion for the web and all things digital to every aspect of Web Directions. About Us Co-founded and now run by John Allsopp, Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. We spend our lives thinking about what comes next, keeping up with trends in technology, practices and processes, and filtering the hype, to make sure you don't miss trends that matter, and don't waste time on hype that doesn't. We promise attending one of our events will leave you significantly better versed in the challenges you face day to day, and in solutions for addressing them. Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
