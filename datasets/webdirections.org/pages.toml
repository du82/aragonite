full_description = '''CSS and Presentation Great reading, every weekend. The best writing about the web, each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1em; font-weight: 600; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .3em 2em .3em 2em; box-shadow: var(--contrast-box-shadow); margin-block-end: .2em; } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } /* Container Query: Applies when .ac-form-container is < 600px */ @container (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } #ac-form { width: 100% } .ac-form-container #ac-form .form-group { flex: 0 0 100%; width: 100%; } .ac-form-container #ac-form .form-group input { width: 100%; } .ac-form-container #ac-form .form-group label { color: #000 } .ac-form-container #ac-form .submit-btn { width: 100%; } #response-message { color: #000 } } About the Survey The Audience Operating Systems and Browsers Markup CSS and Presentation JavaScript and the DOM Rich Media Server technologies The Cloud Conclusions and predictions Consistency across browsers Development strategies for multiple browsers CSS Specifics Other browser based graphics Devices other than PCs The challenge of convincing web designers and developers that CSS, rather than presentational markup, is the better approach to developing for the web has long since been won. In this section of the survey, we tried to get an understanding of just how developers are using CSS to this end, and their underlying philosophies about presentation for the web. Consistency across browsers One of the ongoing questions in web development is the extent to which sites should “look the same in all browsers”. As with last year, we asked “Which of the following best describes your web design philosophy?” with three possible answers. This years results are markedly different from last years. While a philosophy of “progressive enhancement”, long advocated by many standards based web designers and developers continues to be the most widely held philosophy, and remained the choice of around 60% of developers (60.5% up from 57.4% last survey), the percentage advocating that “pages should look as near to identical as possible across browsers” dropped noticeably, from around quarter in 2008 to 14% this time round. The more radical concept that “pages might look substantially different in different browsers, but provided they look acceptable in all browsers, consistency is of no great concern” climbed from 9.5% to surpass the concept that pages should look nearly identical, with 15.7% holding this view. The increasing diversity of devices with excellent web browsers may well hold the key to this change, and we’d expect to see the percentage of respondents who hold this last view climb in future surveys. Which of the following best describes your web design philosophy? 2010 Answer Count % Pages should look as near to identical as possible across browsers 197 14.05% Consistency across browsers is important, but I use features supported in newer browsers provided they don’t cause problems for older browsers 848 60.49% Pages might look substantially different in different browsers, but provided they look acceptable in all browsers, consistency is of no great concern 220 15.69% 2008 Answer Count % Pages should look as near to identical as possible across browsers 304 24.64% Consistency across browsers is important, but I use features supported in newer browsers provided they don’t cause problems for older browsers 708 57.37% Pages might look substantially different in different browsers, but provided they look acceptable in all browsers, consistency is of no great concern 117 9.48% Development strategies for multiple browsers Developers need to continue ensuring their sites and applications work acceptably across a broad range of browsers, some, like IE6, many years old now, lacking in features introduced in newer browsers, and shackled with bugs long since fixed in newer versions. We asked respondents how they addressed this issue, with a particular focus on their strategy for ensuring their sites work well in Internet Explorer, the most idiosyncratic of the widely used browsers. Results for this question were very similar to those for the last survey. Standards based development comes first for almost all developers, with most (77% both surveys) then working around problems with IE. Both years, around 10% claim to not bother working around problems in Internet Explorer, which may reflect a lack of concern for users of that browser, or the opinion that their sites will, if developed using web standards, work “well enough” in Internet Explorer. Which of the following best describes your approach to developing for multiple browsers? 2010 Answer Count % I only develop for IE 3 0.21% I develop for IE first, and then make sure my pages work in other major browsers 39 2.78% I develop to W3C standards, and then work around IE 1072 76.46% I develop to W3C standards and expect browsers to support these 150 10.7% 2008 Answer Count % I only develop for IE 3 0.24% I develop for IE first, and then make sure my pages work in other major browsers 62 5.02% I develop to W3C standards, and then work around IE 946 76.66% I develop to W3C standards and expect browsers to support these 116 9.40% CSS Specifics The next set of questions in this section focussed more on the specifics of how respondents use the technology of CSS. We wanted to get a sense of what they were using CSS for, and which aspects of CSS they were using. We also wanted to get a sense of which more experimental aspects of CSS, such as CSS3, and some browser extensions to CSS, developers are using. When asked what they use CSS for, results from this survey were almost identical to the previous, with around 90% of respondents saying they use CSS for fonts and text style, and even slightly more for page layout. As we commented in our last survey results Together with responses to a number of the questions in the markup section, it’s clear that the practice of separating content and appearance using HTML and CSS is very well established now, at least among this sample of developers and designers. Which of the following do you use CSS for? 2010 Answer Count % Fonts and text style 1246 88.87% Page layout 1252 89.3% Print appearance 966 68.9% 2008 Answer Count % Controlling fonts and text style 1112 90.11% Controlling page layout 1115 90.36% Controlling print appearance 851 68.96% Next we looked more deeply into which CSS features respondents were using. Selectors As with the previous survey, 80% or more use HTML element, class and id selectors, with nearly 80% (78%) using descendent selectors. While class and id are still extensively used, the widespread use of descendent selectors probably reflects a decrease in the over-reliance on these selectors. 37% of respondents use child selectors, up significantly from 27%, but very similar numbers also use CSS3 structural selectors (like last-child), and attribute selectors. Question 24: Which of these types of selector do you regularly use? 2010 Answer Count % HTML element selectors such as p {} 1192 85.02% Class selectors such as p.classname {} 1194 85.16% ID selectors such as p#idname {} 1140 81.31% Descendent selectors such as p a {} 1125 80.24% Child selectors such as p > a {} 516 36.8% attribute selectors such as a[href] 526 37.52% structural selectors such as p:last-child 525 37.45% 2008 Answer Count % HTML element selectors such as p {} 1027 83.23% Class selectors such as p.classname {} 1057 85.66% ID selectors such as p#idname {} 999 80.96% Descendent selectors such as p a {} 961 77.88% Child selectors such as p > a {} 337 27.31% CSS3 and Experimental CSS A little over a year before the current survey, we asked respondents about their use of CSS3 and experimental CSS properties. Back then, an overwhelming majority (68%) didn’t. A scant 13 months later, in early 2010, and nearly half of the respondents (45%) said they did. The increasing support for these features in Chrome, Firefox and Opera, in addition to Safari which has somewhat lead the way in this regard, coupled with a philosophy of “progressive enhancement” would seem to be driving this rather dramatic takeup of something still not supported by Internet Explorer. Do you use any CSS3 or experimental CSS properties, such as CSS transitions, transforms, animations, shadows? 2010 Answer Count % Yes 636 45.36% No 616 43.94% 2008 Answer Count % Yes 274 22.20% No 843 68.31% We followed up by asking “Which such properties do you use?”. Of those who answered that they use CSS3 and experimental CSS 48% (up from 40%) use border-radius Around 25% use text-shadows and box shadows, a similar number to those who replied “shadows” in last year’s survey. Transitions (12%) and transforms (8%), come in with similar numbers to last year (both around 10%) Use of opacity appears to have dropped off, from around 10%, to around 6% About 12% (up markedly from 5% )use RGBa colors Gradients (4%), animations (2%) and somewhat surprisingly multi-column text (.6%) are all still in their earliest stages of adoption, though support for animation is currently Webkit only, and gradients and multi-column text still only Webkit and Firefox. 2010 property Count % text-shadow 166 26% box-shadow 158 25% border-radius 305 48% gradient 24 4% multi-column 4 .6% rgba 74 12% opacity 37 6% transitions 86 14% transforms 50 8% animation 13 2% Fonts Web designers and developers have long been keen to expand the range of fonts available, and have typically resorted to image replacement, or flash based replacement techniques like SiFR, all of which are less than ideal solutions. The last 18 months or so have seen the widespread adoption of CSS font embedding technologies in Firefox, Webkit browsers and Opera. Internet Explorer has for many years supported font embedding, but its use has always been legally challenging, and frankly painful. In late 2008, a very small percentage of respondents (around 4%) responded that they use the @font-face statement. This number has increased dramatically in the short period of time since, to nearly 23%. One reason is the increased support for @font-face (now well supported in all current browsers, other than Mobile Safari). Also, since the last survey a number of “fonts as a service” companies, like Kernest and Typekit (disclosure, John Allsopp is an advisor to Typekit), coupled with increasingly liberal licensing of fonts by some foundries allowing linking to fonts have helped drive this adoption. We suspect that this trend will continue, and font linking will be very widely adopted by respondents in the next 12 to 18 months. Do you use linked fonts with the @font-face statement? 2010 Answer Count % Yes 320 22.82% No 932 66.48% 2008 Answer Count % Yes 51 4.13% No 1060 85.90% When we last surveyed, there were essentially two font formats supported by browsers for font linking. Webkit supported linking to TrueType fonts only. Internet Explorer supported linking to EOT fonts (as it had for a decade or so but not TrueType). Developers wishing to use the same font in these two different browsers needed to link to two different font formats. When asked in late 2008 which formats they linked to, only .6% (or about 10% of those who used font linking) linked to EOT fonts, while 4% (almost 100%) linked to TrueType fonts. With the addition of @font-face support in Firefox and Opera, not only has the overall number of developers using font linking increased dramatically, but EOT (14% of all respondents) is approaching parity with TrueType (17%), while OpenType is the most widely supported format (17.7%). Even WOFF, a new, compressed format currently supported only in Firefox, and only since Firefox 3.6 even has support by over 7% of all respondents, nearly twice the percentage who used font linking at all in the previous survey. More than CSS3, or HTML5, it would seem the buggest change in the state of web design and development in the last 12 months or so has been the significant takeoff in professional (as opposed to experimental) use of font linking. In late 2008, essentially not one of our respondents was using font linking except experimentally. 13 months later, perhaps as many as one fifth are. Which type of fonts do you link to? 2010 Type Count % Truetype 237 16.9% EOT 193 13.77% WOFF 99 7.06% OpenType 248 17.69% 2008 Type Count % Truetype 50 4.05% EOT 7 0.57% Other browser based graphics In this section, we also asked respondents whether, and how they used SVG, and Canvas, two other widely supported (in browsers other than IE) standards or proposed standards for web graphics. SVG Three quarters of respondents replied in the negative to the question “Do you use SVG”, up a little from 2008. 13% replied “a little” (down from 14%), while a littl'''
