description = "A conference on AI and ML in the browser and at the edge. Online 2025"
full_description = '''Web Directions Inference covers AI and machine learning in the browser. We'll cover key enabling Web platform technologies like WebNN, WebGPU and WebGL. Existing and emerging web platform APIs. Technologies like Tensorflow.js, Onnx.js, and Web LLM which make it possible to do AI inference in the browser. As well as practices like optimizing for performance, and real world use cases to inspire you. AI is coming to the device, and the Web has an important story to tell. So get onboard the most transformative technology revolution since the Web itself. Keen to speak at Inference? If you'd like to put your hand up to speak at Inference or one of our other events in 2024, we'd love to hear from you. CFPs are open now, closing June 15th Read all the details about what we're looking for and what we offer speakers. Learn more and apply! Keep up to date with Announcements Want to keep up to date with news about Web Directions Inference? Let us know below and we'll email you as things develop. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_event_interest_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); var pathName = window.location.pathname; var directoryEnd = pathName.indexOf('/', 1); if (directoryEnd !== -1) { pathName = pathName.substring(1, directoryEnd); } if (hiddenField) { hiddenField.value = pathName; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: var(--main-theme-contrast-color); } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: space-evenly; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; flex: 0 0 37%; margin: 0 } #ac-form .form-group label { font-weight: 600; text-align: left; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92% } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1.1em; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .2em 2em .3em 2em; cursor: pointer; box-shadow: var(--contrast-box-shadow); } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } @media (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } .submit-btn { width: 100%; } } AI and ML are already a reality in the browser Inference will challenge the traditional cloud-centric view of AI and LLMs and show you that today's browsers can already support a large range of AI and ML tasks. Discover how technologies like WebNN, WebGPU, WebLLM, TensorFlow.js, and ONNX.js are enabling powerful machine learning directly in the browser, not only enhancing user privacy and performance but significantly reducing cost (and environmental impacts). What we'll be covering WebNN WebGL WebGPU Web Speech Browser APIs Prompt API Tensorflow.js MediaPipe Transformers.js Onnx.j WebLLM The hardware landscape model optimisation performance caching prompting hybrid cloud/device strategies case studies Inference Online $195ends Jan 1 Includes Inference conference live stream Inference conference videos register Conffab Premium $695 Includes Inference conference live stream Inference conference videos All Conffab live and on-demand content for 12 months register What's included? Streaming Conference passes include access to the conference livestream on our very own platform Conffab, including live captioning and chat, access to the stream on demand after the event and to the conference videos when they become available. Conffab Premium Conffab Premium, features access to all livestreamed conferences on the Conffab platform for 12 months, access to all on-demand presentations, self assessment quizzes, and more. A unique online-native format From 2020-2022, we hosted nearly 2 dozen online native conferences, and developed a format to ensure the most engaging online conferences. Key features include Pre-recorded sessions Expertly produced and edited, our focussed sessions make for more engaging, high bandwidth presentations. Shorter days Rather than day-long sessions, each "day" runs for around 3 hours, so you're not drained by hours of staring at the screen A time to suit you Each session runs 3 times, so wherever you are in the world it will take place at a time convenient to you. Time to digest Rather than back-to-back days we spread the conference sessions across 3 to 4 weeks. Each Friday there's a session, making it easier to fit into your work schedule Instant replay Right after the sessions end they're available on-demand, to go back over anything or catch up on what you missed. Total Recall Each individual presentation is available, with interactive transcripts, chapters and accessible slides, and self assessment quizzes to make sure you get the most from every talk. Live Streaming Inference is exclusively an online event, streamed on our very own streaming platform Conffab. Drawing on our lessons of many online and livestreamed conferences in recent years, there's live captions, accessible slides, and interaction with fellow attendees and speakers, designed ground up as an online experience. Partner with us Keen to reach hundreds of the leading web engineers in the country? We bring them together in one place, fuel them with coffee and amazing talks and reignite their excitement. We work closely with our partners and their technologies to deliver world leading online conferences. Contact us to talk more about how we work can work with you to help you be even more awesome. Web Directions Conffab Stream and download nearly 1,000 presentations from hundreds of world leading experts at 50 conferences…and counting With free and paid levels, keep up to date with all that's happening in our industry at your own pace. Sign up Now Learn More John Allsopp John Allsopp has been working on the Web for nearly 30 years. He's been responsible for innovative developer tools such as Style Master and X-Ray, and his ideas formed the foundation for Typekit, now Adobe Fonts, and the entire concept of Responsive Web Design. He's spoken at numerous conferences around the World and delivered dozens of workshops in that time as well. His writing includes several books, including Developing With Web Standards and countless articles and tutorials in print and online publications. His "A Dao of Web Design" published in 2000 is cited by Ethan Marcotte as a key influence in the development of Responsive Web Design, who's acclaimed article in 2010 begins by quoting John in detail, and by Jeremy Keith as "a manifesto for anyone working on the Web". John brings his deep knowledge of and passion for the web and all things digital to every aspect of Web Directions. About Us Co-founded and now run by John Allsopp, Web Directions has for nearly 2 decades years brought together leading developers, engineers, visual, IxD, UX and product designers, Art and Creative Directors, product managers indeed everyone involved in producing web and digital products to learn from one another, and the World's leading experts across this vast field. We spend our lives thinking about what comes next, keeping up with trends in technology, practices and processes, and filtering the hype, to make sure you don't miss trends that matter, and don't waste time on hype that doesn't. We promise attending one of our events will leave you significantly better versed in the challenges you face day to day, and in solutions for addressing them. Code of Conduct For over a decade, we've worked hard to create inclusive, fun, inspring and safe events for the Web Industry. As part of our commitment to these values, we've adopted a code of conduct for all involved: ourselves, our speakers, our partners and our audience. If you have any concern or feedback, please don't hesitate to contact us.'''
