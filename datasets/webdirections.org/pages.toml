onference videos when they become available. Special Pricing We know it's valuable to attend, to learn from our experts, and make connections in the industry. So, to make our events as affordable as possible, we have special pricing for a range of attendees. Freelancers If you're paying you're own way–contractor, freelance, consultant, independent–whatever you might call yourself use the code freelanceleaders25 when you register, and pay just $595. Register Education If you work in education–as an educator or otherwise for an educational institution, then you'll pay just $595 with the code eduleaders25 Register Not for profits As a not for profit, register with the code nfpleaders25, and pay just $595. Register Bring the whole team Over the years we've had many many teams attend our conferences together–treating it like an offsite, with amazing speakers, coffee, and more. Some come back year after year (well, they did until Covid). And now we're returning, bigger and better than ever, we're keen to make it really worth your while to attend together. So here's a range of bonuses for groups of 5 or more from the same organisation. Send 5 or more to Code, and receive Ticket Upgrades We'll add a year of Conffab Pro for each attendee. Bonus Code Leaders tickets For each 5 Code tickets you register, get a bonus Code Leaders ticket Simply register 5 or more Code tickets and we'll be in touch, or contact us to learn more register. Keep up to date with Announcements Want to keep up to date with news about Code Leaders? Let us know below and we'll email you as things develop. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_event_interest_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getEleme