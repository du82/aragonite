full_description = '''Your weekly reading–performance, platforms, security, CSS and more John Allsopp 24th February, 2025 @johnallsopp Great reading, every weekend. The best writing about the web, each Friday. Name Email* Submit document.addEventListener("DOMContentLoaded", function () { document.getElementById('ac-form').addEventListener('submit', function(event) { event.preventDefault(); // Prevent default form submission let formData = new FormData(this); fetch('/ac-forms/submit_newsletter_form.php', { method: 'POST', body: formData }) .then(response => response.json()) .then(data => { document.getElementById('response-message').textContent = data.message; }) .catch(error => { document.getElementById('response-message').textContent = "Error submitting the form."; }); }); // Populate event-interest field var hiddenField = document.querySelector("#event-interest"); if (hiddenField) { hiddenField.value = "weekend_reading"; } // Enable the submit button var submitButton = document.querySelector(".submit-btn"); if (submitButton) { submitButton.disabled = false; } }); /* General styling */ #ac-form { font-family: inherit; background-color: transparent; font-size: .9em; } .ac-form-container { container-type: inline-size; /* This establishes a containment context */ width: 100% } .horizontal .ac-form-container { width: 100% } /* Define the container on .ac-form-container instead of .form-container */ #ac-form { width: 100%; max-width: 100%; } .form-container { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1cqw; max-width: 800px; margin: 0 auto; justify-content: flex-start; } .ac-form-container #ac-form .form-group { display: flex; flex-direction: column; margin: 0; } .horizontal .ac-form-container #ac-form .form-group { flex: 0 0 37%; } #ac-form .form-group label { font-weight: 600; text-align: left; color: inherit; } .ac-form-container #ac-form .form-group input { padding: .4em 1em; border-style: none; box-shadow: var(--contrast-box-shadow); border-radius: 5px; font-size: 1em; width: 92%; } .ac-form-container #ac-form .submit-btn { -webkit-appearance: none; cursor: pointer; font-family: inherit, sans-serif; font-size: 1em; font-weight: 600; text-align: center; background: var(--main-theme-highlight-color); border: none; border-radius: 2em; color: var(--reverse-text-color); padding: .3em 2em .3em 2em; box-shadow: var(--contrast-box-shadow); margin-block-end: .2em; } .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; } .additional-field { display: none; visibility: hidden; position: absolute; left: -9999px; opacity: 0; height: 0; } #response-message { margin-block-start: 1em; } /* Container Query: Applies when .ac-form-container is < 600px */ @container (max-width: 600px) { .form-container { flex-direction: column; gap: 15px; } #ac-form { width: 100% } .ac-form-container #ac-form .form-group { flex: 0 0 100%; width: 100%; } .ac-form-container #ac-form .form-group input { width: 100%; } .ac-form-container #ac-form .form-group label { color: #000 } .ac-form-container #ac-form .submit-btn { width: 100%; } #response-message { color: #000 } } After last week’s deep dive on the question “What is Software Engineering in the age of LLMs?” this week we round up a bumper crop of recent reading, with a heavy dose of performance, some security, CSS and more. The web on mobile mobile, progressive web apps, PWAs Ten or fifteen years ago, the gap between the web and native apps on mobile was entirely technical. There were certain things that you just couldn’t do in web browsers. That’s no longer the case now. The web caught up quite a while back. But the experience of using websites on a mobile device is awful. Never mind the terrible performance penalties incurred by unnecessary frameworks and libraries like React and its ilk, there’s the constant game of whack-a-mole with banners and overlays. What’s just about bearable in a large desktop viewport becomes intolerable on a small screen. This is not a technical problem. This doesn’t get solved by web standards. This is a cultural problem. Source: Adactio: Journal—The web on mobile The web struggles to compete on mobile as much for cultural as technical reasons. And that’s on us to fix. As Scott Jenson put it many years ago ‘Native apps are a remnant of the Jurassic period of computer history, a local maximum that is holding us back‘. True in 2012, even more true now. Navigating the Web Platform Cheatsheet Standards As a web developer, navigating the web platform isn’t always easy. Here are ways to keep track of what you can use, of what’s new in web browsers, and ways you can influence the development of the platform by making your voice heard. Source: Navigating the Web Platform Cheatsheet Here’s how you can keep up with everything happening with the Web platform, and get involved in making it better. The Web is not like proprietary platforms–it is ours to help shape and grow. More Edge features get a performance boost – Microsoft Edge Blog performance Starting with Microsoft Edge 132, many of the browser’s most important features, such as Downloads, Drop, History, and the inPrivate new tab experience are now a lot faster. In fact, no less than 14 different areas of the user interface throughout the browser are now 40% faster than before, on average. (This includes Favorites and Browser Essentials, which we had already mentioned in our earlier blog post: An even faster Microsoft Edge.) These improvements are all made possible thanks to our effort to migrate the browser UI to WebUI 2.0, our markup-first architecture that minimizes the size of our code bundles, and the amount of JavaScript code that runs during the initialization of the UI. Source: More Edge features get a performance boost – Microsoft Edge Blog As we’ve covered before and as Alex Russell spoke about in 2023 at our Summit, Microsoft Edge browser’s UI is all web technologies (as are those of other Microsoft products like Outlook and Teams–not the browser versions but the desktop versions as well) and they have been on a mission to improve performance I this regard. Here they talk about recent improvements. How OWASP Helps You Secure Your Full-Stack Web Applications — Smashing Magazine security The OWASP vulnerabilities list is the perfect starting point for web developers looking to strengthen their security expertise. Let’s discover how these vulnerabilities materialize in full-stack web applications and how to prevent them. Source: How OWASP Helps You Secure Your Full-Stack Web Applications — Smashing Magazine A roundup of the most common security pitfalls you should be aware of from OWASP. Bonus Video: We had a great related talk at Code last year–Browsers Are Magical Creatures from Stephen Rees-Carter that takes you step by step through security headers. I followed it and took the conffab website from a complete F to an A on securityheaders.com in one evening while I waited for my daughter at soccer practice. You should watch it (free, no signup required) and follow along! Reimagining Fluid Typography CSS, responsive design, typography For many years, it has been ‘best practice’ to use relative units (especially em and rem) for sizing text. That’s great! But after playing around with my user preferences, I think we can improve on the common approaches. Source: Reimagining Fluid Typography | OddBird Are we doing responsive typography right? Recent speaker Miriam Suzanne reconsiders the traditional but practice of using relative units for responsive typography. Simplify Nested Code JavaScript, software engineering One of the most common pieces of feedback I leave in code reviews, at least in the realm of code readability, is to reduce nesting. In general, the more deeply-nested code is, the more complex it is to track mentally. This is especially the case with if statements. Source: Simplify Nested Code I have a strong, indeed near visceral aversion to nesting if statements at all–though will do one level if I have to–beyond that it’s almost physically impossible for me to do so. Even thinking about it raises my blood pressure. So, here are some strategies and patterns for managing nested code. Optimizing Images for Web Performance image optimisation, performance Images make websites look great, but they’re also the biggest performance bottleneck. They add huge file sizes, delay Largest Contentful Paint (LCP), and can even mess with Cumulative Layout Shift (CLS) if they aren’t handled properly. And while developers are quick to optimize JavaScript and CSS, images are often ignored—despite being the heaviest assets on most pages. So, how do we make images fast, responsive, and efficient? Here’s how: Source: Optimizing Images for Web Performance – Frontend Masters Boost Image optimisation may seem like entry level stuff for web performance–30 years ago we were doing it! But the state of the art constantly improves, and this is great roundup of some techniques you may or may not be using. Now, SVG doesn’t get a mention in the images section. I’ve been on a mission to minimise the use of pixels on the Web for years now, and if in doubt, avoid pixels (in your image formats) by using SVG is one thing I’d add to this. Interop 2025: another year of web platform improvements | Blog | web.dev interop After the huge success of Interop 2024, the project returns today with a new set of focus areas for 2025. While we couldn’t include every suggestion made this year, the final list reaches across the web platform—from CSS to performance-related features. Source: Interop 2025: another year of web platform improvements | Blog | web.dev Interior is a major project across browser engine developers to improve the baseline of web technology, by focussing collectively on a set of features to implement or improve. 2025’s targets have just been announced, and we’re excited to see among the many things focussed on Storage Access API, View Transition API, Modules and Anchor positioning. How Google Search uses speculation rules performance, speculation rules Google Search is one of the most popular sites on the web, and also one of the fastest. The Search team is continually investing in making the search experience faster. On a page as popular as Google Search, even milliseconds of improvement quickly add up! That interest in speed includes the well-known Google home page, the Search Engine Results Page (SERP), and clicks to other sites from those search results. Google Search has been making use of the Speculation Rules API to improve navigation speed from the search results page to the result links and they’ve been using a few features of the API that may be of interest to other site owners. Source: How Google Search uses speculation rules Read about how Google Search has been using speculation rules to prefetch search results. Build a local and offline-capable chatbot with WebLLM large language models, LLMs, web AI Now that you better understand client-side AI, you’re ready to add WebLLM to a to-do list web application. You can find the code in the web-llm branch of the GitHub repository. WebLLM is a web-based runtime for LLMs provided by Machine Learning Compilation. You can try out WebLLM as a standalone application. The application is inspired by cloud-backed chat applications, such as Gemini, but the LLM inference is run on your device instead of the cloud. Your prompts and data never leave your device, and you can be sure that they aren’t used to train models. Source: Build a local and offline-capable chatbot with WebLLM You might be taken aback, as I was a few months ago, about what can be done in the browser with large language models–not calling external APIs but models actually running in your browser. Want to get started? This is a great place to do so from Christian Liebel. Then sign up for our upcoming online conference Inference, where we’ll go deep into the topic. Optimising for High Latency Environments performance Chrome have recently begun adding Round-Trip-Time (RTT) data to the Chrome User Experience Report (CrUX). This gives fascinating insights into the network topography of our visitors, and how much we might be impacted by high latency regions. Source: Optimising for High Latency Environments – Web Performance and Site Speed Consultant Harry Roberts dives into Round Trip Time (RTT) in light of the recent addition of this data to CrUX, with thoughts about managing high latency situations. Six things that slow down your site’s UX (and why you have no control over them) performance, RUM Have you ever looked at the page speed metrics – such as Start Render and Largest Contentful Paint – for your site in both your synthetic and real user monitoring tools and wondered “Why are these numbers so different?” … Your synthetic testing tool shows you how your pages perform in a clean lab environment, using variables – such as browser, connection type, even CPU power – that you’ve selected. Your real user monitoring (RUM) tool shows you how your pages perform out in the real world, where they’re affected by a myriad of variables that are completely outside your control. In this post we’ll review a handful of those performance-leaching culprits that are outside your control – and that can add precious seconds to the amount of time it takes for your pages to render for your users. Then we’ll talk about how to use your monitoring tools to understand how your real people experience your site. Source: Six things that slow down your site’s UX (and why you have no control over them) Tammy Everts contrasts the use of real user measurements (RUM) and synthetic testing for performance and how best to use them. MPA View Transitions Deep Dive animation, CSS, View Transitions Cross-document, or MPA, view transitions are here, and they are amazing! But there is a lot going on with them, and as I was researching them, I kept seeing that it was Bramus who had great content about them… so I asked if he could teach me more about them and he said yes! Source: MPA View Transitions Deep Dive – Bram.us Bramus van Damme discusses multi-page view transitions with Kevin J Powell. See them in action and how to implement them in this extended video. Organizing Design System Component Patterns With CSS Cascade Layers cascade layers, CSS, CSS architecture I’m trying to come up with ways to make components more customizable, more efficient, and easier to use and understand, and I want to describe a pattern I’ve been leaning into using CSS Cascade Layers. Source: Organizing Design System Component Patterns With CSS Cascade Layers | CSS-Tricks CSS Cascade Layers have been widely supported for quite some time (essentially since early 2022, so well and truly baseline technology). At Conffab we covered them at Hover in 2022 and then at Web Directions Summit later that year. But they are quite a lot to get your head around–a completely new way of architecting our CSS. Here Ryan Trimble shows a case study of making components more manageable with cascade '''
