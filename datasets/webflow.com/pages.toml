["https://webflow.com/analyze"]
title = "Native site analytics | Webflow Analytics"
description = "Webflow Analyze puts a native, unified view of visitor behavior in your hands so you can make data-backed decisions that improve site performance."
full_description = "Give your team the data they needForget about complex third-party analytics tools that can be difficult to implement and learn. With Webflow Analyze, everyone who needs site data can get it right within Webflow — and understand it.DesignersUnderstand which pages and page elements perform better than others — so you can make informed design decisions.Content marketersSee what content actually gets results — so you can invest in the right content strategy and maximize your team’s impact. Any site contributor — data expert or notGet a better picture of your site’s performance without needing to set up or learn to use third-party analytics tools.How it worksAnalyze is an analytics tool that gives designers and content marketers insight into how visitors interact with a site — from the page level to specific click events.The visitor data you need, where you need itAnalyze offers site and page insights right within Webflow — so you don’t need to switch between tools or navigate confusing third-party dashboards.Site overviewUnderstand overall site level traffic and key performance stats — like most-viewed pages or number of unique visitors — at a glance.Page insightsSee how visitors interact with specific pages on your site — including which elements they clicked on most and which pages they went to next.View insights while you workQuickly access analytics data while you build in Webflow – right within whatever page you’re working on.Effortless, code-free setupAnalyze offers both one-click setup and automatic event capture — so there’s no need for manual or code-based configuration.Built with privacy in mindAnalyze is a native Webflow feature, so you don’t need to worry about your data sprawling across third-party ecosystems. And for customers that need a specialized consent management platform (CMP), Analyze also integrates with leading solutions like DataGrail and Finsweet Components.Learn more about how Analyze handles data privacy→Start using Analyze todayBilled monthlyBilled yearly(Save up to 29% with yearly billing)For Basic, CMS, and Business Site plans*Analyze is available now as an add-on to your paid Site plan.Buy now*excluding Ecommerce plans# of sessions per monthPrice per month10k$2925k$4950k$79100k$149250k$199500k$229# of sessions per monthPrice per month10k$3925k$6950k$99100k$199250k$269500k$299For enterprise customersAnalyze is available as an add-on to your Enterprise plan.Learn more# of sessions per monthPrice per monthStarting at 100kCustomView all plan featuresHide plan features FeatureFeature descriptionAnalyze for core Site plansAnalyze for EnterpriseSite plans:StarterBasicCMSBusinessMaximum monthly sessionsA session begins when a single user lands on your site and ends when they leave the site or are inactive for 30 minsUp to 500kCustomAuto-captured page views, sessions, and visitorsAs soon as it’s added to your site, Analyze auto-captures foundational visitor behavior data including page views, sessions, and visitors with no manual set up needed.Auto-captured click dataAs soon as it’s added to your site, Analyze auto-captures what buttons / elements visitors click on –no manual set up required.Site analytics overviewSummary of site performance at a glance –including overall traffic and top pages –with the ability to search for specific pages to see how they rank relatively.Page-level insightsView traffic and engagement stats at the page-level such as # of views and most clicked events — as well as page-to-page comparisons.Share insightsShare visibility to Analyze insights with other team members through a preview mode url.Integrations with consent management solutionsOur consent management partner integrations are available via Webflow’s vetted app marketplace for all customers.Concerned about privacy? So are we.Analyze is built with your visitors’ privacy in mind. Here are a few commonly asked questions about how Analyze works.Does Analyze provide insights down to the individual site visitor level? No, Analyze provides aggregate analytic information about your site. For example, Analyze can provide you information about how many visits originated from the United States, but not that Visitor 1234 visited from the United States.How does Analyze collect this information? When someone visits your site, a snippet of Javascript runs in the browser, which begins the collection of visitor analytics.Can a site visitor opt-out of the collection of analytics? If you have a consent management platform (CMP) integrated with your site, you can offer your visitors the choice to opt out of Analyze.Does Analyze place a cookie in visitors’ browsers? Analyze does not place a cookie in your visitors’ browsers. Analyze does store information in the visitor’s browser local storage.Why does Analyze need to store data in a browser’s local storage? Analyze stores data in a browser’s local storage in order to ensure the accuracy and integrity of the analytics data being collected.What categories of data does Analyze collect? The number of visitors to each of your pagesWhich countries your visitors originate fromEvent tracking, e.g., how many times a button on a page is clickedThe browser language for your site visitorsWhat browsers your site visitors are usingThe aggregate breakdown by device typeDoes Analyze collect personally identifiable information about my visitors? No. Analyze uses anonymous identifiers when collecting analytics information. As a simplified example, Analyze will identify a visitor with an anonymous visitor ID (e.g., user12345), but cannot tie that anonymous visitor ID back to an identifiable person. For example, if John Smith from the United States visits your site and is assigned the visitor ID of user12345, Analyze would only identify that visit as user12345 but would not know that user12345 is John Smith.All featuresDiscover everything you can do with Webflow. Elevate your site with the power of AI→Build Design↗Build high-performing sitesDiscover feature Edit mode↗Empower your content teamDiscover feature Interactions↗Craft immersive experiencesDiscover feature Page buildingnew↗Launch simple landing pages quicklyDiscover featureManage CMS↗Manage content at scaleDiscover feature Hosting↗Host and scale your site without the hassleDiscover feature Security↗Ensure your site stays safeDiscover feature Localization↗Customize your site for a worldwide audienceDiscover featureOptimize Analyzenew↗Understand how your site performsDiscover feature Optimizenew↗Maximize conversions with testing and personalizationDiscover feature SEO↗Grow your reach with fine-tuned controlsDiscover featureExtend Apps↗Connect your site to apps like HubSpot, Adobe Express, and moreDiscover feature Figma to Webflow↗Turn static designs into clean, production-ready codeDiscover feature DevLink↗Create production-ready React componentsDiscover feature Ecommerce↗Design your store visuallyDiscover featureGet started for freeTry Webflow for as long as you like with our free Starter plan. Purchase a paid Site plan to publish, host, and unlock additional features.Get started — it's freeTransforming the design process at"
