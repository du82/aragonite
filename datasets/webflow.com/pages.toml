["https://webflow.com/accessibility"]
title = "Web accessibility: guide, courses, and features | Webflow"
description = "Learn about the importance of accessibility on the web and how you can build accessible experiences in Webflow."
full_description = "MenuAccessibility at WebflowStatementChecklistTestingAccessibility at WebflowWeb and software creation should be accessible to everyone. Learn about our commitment to web accessibility and how you can build more accessible online experiences.On this pageWhy it mattersGet startedBuild accessible sitesAuditing toolsGive feedbackCase studyVlad MagdalinChief Innovation Officer and Co-FounderWhy it matters“To realize our mission of democratizing access to software creation, we have to make sure that the experiences created with Webflow, and Webflow itself, are accessible for as many people as possible. We strive for constant improvement in this area, and we’re actively taking steps to empower our teams and our customers with the education and tools they need to build accessible experiences on the web.”Vlad MagdalinCEO and co-founder, WebflowAccessibility statement→Building an accessible site in WebflowResources to help you learn about building accessible sites with Webflow.Design with accessibility in WebflowLearn how to get started with accessible design and development in Webflow, including alt text, the Audit panel, and responsive typography.Webflow University→Get started for freeWebflow’s accessibility checklistThis essential tool for Webflow users contains guidelines derived from WCAG, including how to implement them with no and low-code solutions.Accessibility checklist→Get started for freeThe controls you need to build accessible websitesWe’re continually updating our elements to include built-in baseline accessibility, while providing features and auditing tools to help you create a more accessible website.Accessibility controls Generate clean, semantic codeWebflow contains the power of HTML and CSS in a visual canvas, giving you the ability to make accessible choices that generate semantic code.Building in Webflow→Learn more Alt text attributesEnsure your images have alternative (alt) text attributes, or set them as decorative images.Setting alt attributes→Learn more Set HTML5 tagsSet your elements to the proper HTML5 tag to make sure assistive technology can accurately communicate your page structure to visitors.Setting element tags→Learn more Relative unitsUse relative units like rems, percentages, viewport height, and character count to create legible and responsive typography.Advanced typography controls→Learn more Flexible custom code optionsAdd code as needed to set custom attributes, control markup, set custom focus states, and more.Custom code options→Learn more Accessible elements out of the boxGet a head start on accessibility by using Webflow's top elements, which are keyboard and screen reader accessible.List of accessible elements→Learn moreBuilt-in auditing toolsAudit your siteCheck for some common issues like missing alt text, empty links, and out-of-sequence heading elements.Check text contrast ratiosEnsure your site text is readable using our built-in color contrast tool.Simulate low-vision viewingPreview your site as it appears for vision-impaired visitors. Give our product team feedbackHow else can we better enable you to build more accessible sites? Submit a product request in the Webflow Wishlist.Submit a request↗Submit a requestHow 8020 helped Brink build a Level AA accessible site in Webflow“A lot of people add a plugin to a non-accessible website to ‘technically’ meet accessibility standards. But that is such bullshit for anyone that actually uses the accessibility features — they simply don’t work. Our goal was to find a partner who could go much deeper and build a site that was accessible by design.”Dylan Bulkeley-KraneCo-founder, Brink.ioRead case study↗Get started for freeTry Webflow for as long as you like with our free Starter plan. Purchase a paid Site plan to publish, host, and unlock additional features.Get started — it's freeTransforming the design process at"
