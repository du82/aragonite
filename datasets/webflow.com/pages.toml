["https://webflow.com/accessibility/statement"]
title = "Accessibility statement | Webflow"
description = "At Webflow, we’re building a roadmap to make accessibility improvements across our product. Learn more about our efforts in our full accessibility statement."
full_description = "MenuAccessibility at WebflowStatementChecklistAccessibility statementLast updated on May 20th, 2021Conformance statusIn this section, we’ll cover three areas:Websites built by you in WebflowThe Webflow productWebflow’s own websites and webpagesWebsites built by you in WebflowThe most commonly used Webflow elements have been updated and tested for keyboard operability and screen reader support. Those elements include Tabs, Dropdown, Image, Text Link, Link Block, Button, Section, List, List Item, Collection List, Navbar, and Slider. Sites using these accessible elements conform to levels as high as WCAG 2.1 Level AA.Ultimately, when building an accessible site, the power lies in the hands of the builder. Webflow gives you the power of HTML and CSS in a visual canvas, giving you the control to make accessible choices that generate semantic code. Our team is actively working on making sure all elements a Webflow user can use to build their site are as accessible as possible — without the need for custom workarounds — along with tools to guide users to make more accessible decisions.‍Explore the list of accessible Webflow elements, and see our roadmap for making more elements accessible, in Webflow University.‍We've also added a suite of features and auditing tools to help you get started with building a more accessible website. Those features and tools include text color contrast, alt text, and proper heading structure.‍Learn more about how to make your site more accessible in Webflow.The Webflow productWe acknowledge our responsibility to empower disabled people to use our product.As an organization, we’re actively building a roadmap to make accessibility improvements across our product. Currently, the Webflow Designer does not fully support assistive technology, and we continue to work to improve support.We’re also creating an internal training series to better educate our team, and we’re incorporating accessibility practices into our product design and development processes to make progressive and meaningful change.Webflow’s own websites and webpagesWe aim to adhere our websites — the Webflow homepage, Webflow University, our blog, and other marketing pages — to WCAG 2.1 Level AA.Starting in January 2021, we’ve made continuous efforts to improve our website content to be more compliant with Level AA. In Webflow University, we’re continually adding transcripts to all lessons, and we’re adding alternative (alt) text to all images in articles. Lastly, we're building an internal checklist based on WCAG guidelines to help us audit all of our sites. Once the audits are complete, we’ll work to improve any sites or pages that are not up to Level AA standards. Our accessibility effortsIn this section, we’ll cover four areas:Internal efforts at WebflowWebsites built by you in WebflowThe Webflow productWebflow’s own websites and webpagesInternal efforts at WebflowWebflow is taking the following company-wide measures:Audit and optimize our accessibility-related systems, processes, and practicesPrioritize disability inclusion in our ongoing diversity, equity, and inclusion (DEI) efforts and programsSupport and empower our disabled teammates through our Disability @ Webflow Affinity Group (AG)Scale and embed accessibility efforts across the organization through our appointed Accessibility Task Force Create and scale accessibility and ableism education for all team members Prioritize accessibility accommodations for internal and external events and programming Embed accessibility and accessibility checkpoints into our product design and development processes‍Websites built by you in WebflowWe plan to improve the accessibility of websites built by you in Webflow by: The creation of, and improvements to, Webflow elements that are keyboard-operable and screen reader-accessibleSupporting you with education, tools, and controls that help you build more accessible websites in WebflowEvolving our roadmap to include more accessibility tools, features, and education‍The Webflow productWe’re improving the accessibility of our product by:Updating our internal design systemEnsuring new foundational technologies are built accessible from the start Building new features that are more accessible‍Webflow’s own websites and webpagesAs specified in the Conformance Status section above, we’re currently updating our existing pages to bring them up to WCAG 2.1 Level AA. We plan to share more specific information on our progress in the latter half of 2021.How to provide feedbackWe welcome your feedback on accessibility at Webflow. To share, please reach out by emailing accessibility@webflow.com.We also invite you to engage with us and others on the Webflow Forum. And you can help us build a more accessible product for our customers and their site visitors by sharing your ideas on the Webflow Wishlist.Get started for freeTry Webflow for as long as you like with our free Starter plan. Purchase a paid Site plan to publish, host, and unlock additional features.Get started — it's freeTransforming the design process at"
