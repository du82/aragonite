title = "vTools WebInABox"
description = "vTools.WebInABox hosting provides a wizard to assist officers to generate simple section websites in an automated fashion with no dependence on webmaster availability. You must be an IEEE Officer (e.g., Section Chair, Webmaster or vTools Coordinator) in order to use this service."
full_description = "Please note that not all of the IEEE Organizational Units use WebInABox to host their website. If you do not see the site you would like to visit, then please contact your Section officers for a link."
