["https://webinabox.vtools.ieee.org/contact"]
title = "Contact Staff : vTools WebInABox"
description = "IEEE vTools, providing tools to the volunteers and staff who support our members."
full_description = "You can send us a message up to 1000 characters long. Please note that our normal business hours are Monday - Friday, 8:30 AM - 5:00 PM Eastern Standard Time excluding holidays. Please provide your name, e-mail address, IEEE member number (optional), organizational unit (optional), and the message. To indicate organizational unit, you can type, search or browse to find one; click in the Organizational Unit field for more info."
