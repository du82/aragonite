["https://webpack.js.org/configuration/stats"]
title = "Stats | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "The stats option lets you precisely control what bundle information gets displayed. This can be a nice middle ground if you don't want to use quiet or noInfo because you want some bundle information, but not all of it. This option does not have any effect when using the Node.js API. You need to pass the stats options to the stats.toString() resp. stats.toJson() calls instead. A fallback value for stats options when an option is not defined. It has precedence over local webpack defaults. Tells stats to sort the assets by a given field. All of the sorting fields are allowed to be used as values for stats.assetsSort. Use ! prefix in the value to reverse the sort order by a given field. Tells stats how many items of assets should be displayed (groups will be collapsed to fit this space). Tells stats whether to add the build date and the build time information. Set stats.builtAt to false to hide it. Tells stats whether to add information about the cached assets. Setting stats.cachedAssets to false will tell stats to only show the emitted files (not the ones that were built). Tells stats how many items of chunk modules should be displayed (groups will be collapsed to fit this space). Tells stats whether to add information about the chunk. Setting stats.chunks to false results in a less verbose output. Tells stats to sort the chunks by a given field. All of the sorting fields are allowed to be used as values for stats.chunksSort. Use ! prefix in the value to reverse the sort order by a given field. boolean = false { bold?: string, cyan?: string, green?: string, magenta?: string, red?: string, yellow?: string } When stats.entrypoints is set to 'auto', webpack will decide automatically whether to display the entry points in the stats output. Tells stats whether to add the details to the errors. It defaults to 'auto' which will show error details when there're only 2 or less errors. array = []: string | RegExp | function (assetName) => boolean string RegExp function (assetName) => boolean"
