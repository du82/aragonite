["https://webpack.js.org/contribute/plugin-patterns"]
title = "Plugin Patterns | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "Plugins grant unlimited opportunity to perform customizations within the webpack build system. This allows you to create custom asset types, perform unique build modifications, or even enhance the webpack runtime while using middleware. The following are some features of webpack that become useful while writing plugins. While running webpack middleware, each compilation includes a fileDependencies Set (what files are being watched) and a fileTimestamps Map that maps watched file paths to a timestamp. These are extremely useful for detecting what files have changed within the compilation: You may also feed new file paths into the watch graph to receive compilation triggers when those files change. Add valid file paths into the compilation.fileDependencies Set to add them to the watched files. The fileDependencies Set is rebuilt in each compilation, so your plugin must add its own watched dependencies into each compilation to keep them under watch. Since webpack 5, compilation.fileDependencies, compilation.contextDependencies and compilation.missingDependencies are now a Set instead of a Sortable Set and thus no longer sorted. Similar to the watch graph, you can monitor changed chunks (or modules, for that matter) within a compilation by tracking their hashes."
