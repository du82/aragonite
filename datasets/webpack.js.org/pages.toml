["https://webpack.js.org/guides/development"]
title = "Development | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = '''If you've been following the guides, you should have a solid understanding of some of the webpack basics. Before we continue, let's look into setting up a development environment to make our lives a little easier. When webpack bundles your source code, it can become difficult to track down errors and warnings to their original location. For example, if you bundle three source files (a.js, b.js, and c.js) into one bundle (bundle.js) and one of the source files contains an error, the stack trace will point to bundle.js. This isn't always helpful as you probably want to know exactly which source file the error came from. In order to make it easier to track down errors and warnings, JavaScript offers source maps, which map your compiled code back to your original source code. If an error originates from b.js, the source map will tell you exactly that. There are a lot of different options available when it comes to source maps. Be sure to check them out so you can configure them to your needs. For this guide, let's use the inline-source-map option, which is good for illustrative purposes (though not for production): Now open the resulting index.html file in your browser. Click the button and look in your console where the error is displayed. The error should say something like this: We can see that the error also contains a reference to the file (print.js) and line number (2) where the error occurred. This is great because now we know exactly where to look in order to fix the issue. Some text editors have a "safe write" function that might interfere with some of the following tools. Read Adjusting Your Text Editor for a solution to these issues. There are a couple of different options available in webpack that help you automatically compile your code whenever it changes: In most cases, you probably would want to use webpack-dev-server, but let's explore all of the above options. You can instruct webpack to "watch" all files within your dependency graph for changes. If one of these files is updated, the code will be recompiled so you don't have to run the full build manually.'''
year_published = 2025
