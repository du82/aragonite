full_description = '''IgnorePlugin prevents the generation of modules for import or require calls matching the regular expressions or filter functions. This plugin works with both JavaScript and CSS, allowing you to ignore specific resources in CSS as well. The resourceRegExp parameter passed to IgnorePlugin is not tested against the resolved file names or absolute module names being imported or required, but rather against the string passed to require or import within the source code where the import is taking place. For example, if you're trying to exclude node_modules/moment/locale/*.js, this won't work: ...your first regexp must match that './locale/' string. The second contextRegExp parameter is then used to select specific directories from where the import took place. The following will cause those locale files to be ignored: ...which means "any require statement matching './locale' from any directories ending with 'moment' will be ignored.'''
