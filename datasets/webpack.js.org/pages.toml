full_description = "A resolver is a library which helps in locating a module by its absolute path. A module can be required as a dependency from another module as: The dependency module can be from the application code or a third-party library. The resolver helps webpack find the module code that needs to be included in the bundle for every such require/import statement. webpack uses enhanced-resolve to resolve file paths while bundling modules. In this case, the directory of the source file where the import or require occurs is taken to be the context directory. The relative path specified in the import/require is joined to this context path to produce the absolute path to the module. Modules are searched for inside all directories specified in resolve.modules. You can replace the original module path by an alternate path by creating an alias for it using the resolve.alias configuration option. Once the path is resolved based on the above rule, the resolver checks to see if the path points to a file or a directory. If the path points to a file: If the path points to a folder, then the following steps are taken to find the right file with the right extension: This follows the same rules as those specified for file resolution. But the resolveLoader configuration option can be used to have separate resolution rules for loaders. Every filesystem access is cached so that multiple parallel or serial requests to the same file occur faster. In watch mode, only modified files are evicted from the cache. If watch mode is off, then the cache gets purged before every compilation."
