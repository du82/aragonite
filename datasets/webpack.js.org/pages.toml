["https://webpack.js.org/plugins/mini-css-extract-plugin"]
title = "MiniCssExtractPlugin | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "This plugin extracts CSS into separate files. It creates a CSS file per JS file which contains CSS. It supports On-Demand-Loading of CSS and SourceMaps. Note that if you import CSS from your webpack entrypoint or import styles in the initial chunk, mini-css-extract-plugin will not load this CSS into the page. Please use html-webpack-plugin for automatic generation link tags or create index.html file with link tag. Source maps works only for source-map/nosources-source-map/hidden-nosources-source-map/hidden-source-map values because CSS only supports source maps with the sourceMappingURL comment (i.e. //# sourceMappingURL=style.css.map). If you need set devtool to another value you can enable source maps generation for extracted CSS using sourceMap: true for css-loader. By default, the mini-css-extract-plugin appends styles (<link> elements) to document.head of the current window. However in some circumstances it might be necessary to have finer control over the append target or even delay link elements insertion. For example this is the case when you asynchronously load styles for an application that runs inside of an iframe. In such cases insert can be configured to be a function or a custom selector. If you target an iframe make sure that the parent document has sufficient access rights to reach into the frame document and append elements to it. ⚠ Do not forget that this code will run in the browser alongside your application. Since not all browsers support latest ECMA features like let, const, arrow function expression and etc we recommend you to use only ECMA 5 features and syntax. ⚠ The insert function is serialized to string and passed to the plugin. This means that it won't have access to the scope of the webpack configuration module. If defined, the mini-css-extract-plugin will attach given attributes with their values on <link> element. It's only applied to dynamically loaded css chunks, if you want to modify link attributes inside html file, please using html-webpack-plugin"
