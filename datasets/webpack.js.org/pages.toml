title = "Output | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = '''The top-level output key contains a set of options instructing webpack on how and where it should output your bundles, assets, and anything else you bundle or load with webpack. [name], [file], [query], [fragment], [base], and [path] are set to an empty string for the assets built from data URI replacements. When used in tandem with output.library and output.libraryTarget, this option allows users to insert comments within the export wrapper. To insert the same comment for each libraryTarget type, set auxiliaryComment to a string: Although the charset attribute for <script> tag was deprecated, webpack still adds it by default for compatibility with non-modern browsers. This option determines the name of non-initial chunk files. See output.filename option for details on the possible values. Note that these filenames need to be generated at runtime to send the requests for chunks. Because of this, placeholders like [name] and [chunkhash] need to add a mapping from chunk id to placeholder value to the output bundle with the webpack runtime. This increases the size and may invalidate the bundle when placeholder value for any chunk changes. By default [id].js is used or a value inferred from output.filename ([name] is replaced with [id] or [id]. is prepended). If the output.filename is defined as a string containing placeholder such as [name], [id], [contenthash], or [chunkhash], the default value for output.chunkFilename will be derived from the output.filename. Otherwise, [id].js will be used as the default value. The format of chunks (formats included by default are 'array-push' (web/WebWorker), 'commonjs' (node.js), 'module' (ESM), but others might be added by plugins). The default value of this option depends on the target and output.module setting. For more details, search for "chunkFormat" in the webpack defaults. The Number of milliseconds before chunk request expires. This option is supported since webpack 2.6.0. The method to load chunks (methods included by default are 'jsonp' (web), 'import' (ESM), 'importScripts' (WebWorker), 'require' (sync node.js), 'async-node' (async node.js), but others might be added by plugins).'''
