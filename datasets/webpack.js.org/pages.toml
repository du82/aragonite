full_description = "Plugin and Loader for webpack to optimize (compress) all images using imagemin. Do not worry about size of images, now they are always optimized/compressed. For lossy optimization we recommend using the default settings of @squoosh/lib package. The default values and supported file types for each option can be found in the codecs.ts file under codecs. For lossless optimization we recommend using the options listed below in minimizer.options.encodeOptions. For lossy optimization we recommend using the default settings of sharp package. The default values and supported file types for each option can be found in the sharp documentation. For lossless optimization we recommend using the options listed below in minimizer.options.encodeOptions. For optimization we recommend using the options listed below in minimizer.options.encodeOptions. The default values for plugins can be found in the svgo plugins source code. By default, plugin configures loader (please use the loader option if you want to disable this behaviour), therefore you should not setup standalone loader when you use a plugin setup. Loader optimizes or generates images using options, so inlined images via data URI (i.e. data:) will be optimized or generated too, not inlined images will be optimized too. In your webpack.config.js, add the ImageMinimizerPlugin.loader and specify the asset modules options (if you use images in import): Options for the implementation option (i.e. options for imagemin/squoosh/sharp/custom implementation). If no generator was found for the image (i.e. no ?as=webp was found in query params), the minimizer option will be used. Therefore, it is recommended to configure generator outputs optimized image. Allows you to apply the generator for import or assets from compilation (useful for copied assets). By default, generators are applying on import/require, but sometimes you need to generate new images from other plugins (for example - copy-webpack-plugin), if you need this, please set asset value for the type option."
