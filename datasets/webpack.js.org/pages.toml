["https://webpack.js.org/api/loaders"]
title = "Loader Interface | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "A loader is a JavaScript module that exports a function. The loader runner calls this function and passes the result of the previous loader or the resource file into it. The this context of the function is filled-in by webpack and the loader runner with some useful methods that allow the loader (among other things) to change its invocation style to async, or get query parameters. The first loader is passed one argument: the content of the resource file. The compiler expects a result from the last loader. The result should be a String or a Buffer (which is converted to a string), representing the JavaScript source code of the module. An optional SourceMap result (as a JSON object) may also be passed. A single result can be returned in sync mode. For multiple results the this.callback() must be called and the loader must return undefined. In async mode you can return a single result from an async function. Alternatively, you may call this.async() to indicate that the loader runner should wait for an asynchronous result. It returns this.callback(). In this case the loader must return undefined and call that callback. This is the only option for multiple results. The following sections provide some basic examples of the different types of loaders. Note that the map and meta parameters are optional, see this.callback below. The this.callback method is more flexible as you pass multiple arguments instead of using content only. Loaders were originally designed to work in synchronous loader pipelines, like Node.js (using enhanced-require), and asynchronous pipelines, like in webpack. However, since expensive synchronous computations are a bad idea in a single-threaded environment like Node.js, we advise making your loader asynchronous if possible. Synchronous loaders are ok if the amount of computation is trivial. By default, the resource file is converted to a UTF-8 string and passed to the loader. By setting the raw flag to true, the loader will receive the raw Buffer. Every loader is allowed to deliver its result as a String or as a Buffer. The compiler converts them between loaders."
year_published = 2025
