full_description = '''Webpack can compile for multiple environments or targets. To understand what a target is in detail, read through the targets concept page. Instructs webpack to generate runtime code for a specific environment. Note that webpack runtime code is not the same as the user code you write, you should transpile those code with transpilers like Babel if you want to target specific environments, e.g, you have arrow functions in source code and want to run the bundled code in ES5 environments. Webpack won't transpile them automatically with a target configured. For example, when the target is set to "electron-main", webpack includes multiple electron specific variables. A version of node or electron may be optionally specified. This is denoted by the [[X].Y] in the table above. It helps determinate ES-features that may be used to generate a runtime-code (all the chunks and modules are wrapped by runtime code). Set target to false if none of the predefined targets from the list above meet your needs, no plugins will be applied. When no information about the target or the environment features is provided, then ES2015 will be used.'''
