full_description = "A context is created if your request contains expressions, so the exact module is not known on compile time. A context module is generated. It contains references to all modules in that directory that can be required with a request matching the regular expression. The context module contains a map which translates requests to module ids. This means dynamic requires are supported but will cause all matching modules to be included in the bundle. It allows you to pass in a directory to search, a flag indicating whether subdirectories should be searched too, and a regular expression to match files against."
