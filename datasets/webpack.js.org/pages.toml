["https://webpack.js.org/contribute/writing-a-loader"]
title = "Writing a Loader | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "A loader is a node module that exports a function. This function is called when a resource should be transformed by this loader. The given function will have access to the Loader API using the this context provided to it. Before we dig into the different types of loaders, their usage, and examples, let's take a look at the three ways you can develop and test a loader locally. To test multiple, you can utilize the resolveLoader.modules configuration to update where webpack will search for loaders. For example, if you had a local /loaders directory in your project: By the way, if you've already created a separate repository and package for your loader, you could npm link it to the project in which you'd like to test it out. You can use webpack-defaults package to generate boilerplate code necessary to start writing your loader. When a single loader is applied to the resource, the loader is called with only one parameter – a string containing the content of the resource file. Synchronous loaders can return a single value representing the transformed module. In more complex cases, the loader can return any number of values by using the this.callback(err, values...) function. Errors are either passed to the this.callback function or thrown in a sync loader. The loader is expected to give back one or two values. The first value is a resulting JavaScript code as string or buffer. The second optional value is a SourceMap as JavaScript object. When multiple loaders are chained, it is important to remember that they are executed in reverse order – either right to left or bottom to top depending on array format. In the following example, the foo-loader would be passed the raw resource and the bar-loader would receive the output of the foo-loader and return the final transformed module and a source map if necessary. The following guidelines should be followed when writing a loader. They are ordered in terms of importance and some only apply in certain scenarios, read the detailed sections that follow for more information."
year_published = 2025
