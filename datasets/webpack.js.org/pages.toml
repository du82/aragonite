full_description = "The NormalModuleFactory module is used by the Compiler to generate modules. Starting with entry points, it resolves each request, parses the content to find further requests, and keeps crawling through files by resolving all and parsing any new files. At last stage, each dependency becomes a Module instance. The NormalModuleFactory class extends Tapable and provides the following lifecycle hooks. They can be tapped the same way as compiler hooks: NormaleModuleFactory creates Parser and Generator instances which can be accessed by HookMaps. Identifier must be passed to tap into these: Called when a new dependency request is encountered. A dependency can be ignored by returning false. Otherwise, it should return undefined to proceed. Called before the request is resolved. A dependency can be ignored by returning false. Returning a Module instance would finalize the process. Otherwise, it should return undefined to proceed. A hook that allows you to override the NormalModule class when creating modules. This hook is called after the createModule hook and before the module hook. Called before a Parser instance is created. parserOptions is options in module.parser for the corresponding identifier or an empty object. Called before a Generator instance is created. generatorOptions is options in module.parser for the corresponding identifier or an empty object."
