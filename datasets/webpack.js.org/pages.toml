["https://webpack.js.org/configuration/module"]
title = "Module | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = '''Starting with webpack 5.87.0, falsy values including 0, "", false, null and undefined are allowed to pass to module.defaultRules to conditionally disable specific rules. Similar to the module.generator, you can configure all parsers' options in one place with a module.parser. This option enables the handling of @import at-rules in CSS files. When set to true, @import statements are processed, allowing modular inclusion of styles from other CSS files. To filter specific imports, you can use Webpack's built-in IgnorePlugin. The filter option, as available in css-loader, is not supported. This option enables the use of ES modules named export for CSS exports. When set to true, the CSS module will export its classes and styles using named exports. When namedExports is false for CSS modules, you can retrieve CSS classes using various import methods. Named exports are redirected to improve developer experience (DX), facilitating a smooth transition from default exports to named exports: When namedExports is enabled (default behavior), you can use only named exports to import CSS classes. By enabling namedExports, you adopt a more modular and maintainable approach to managing CSS in JavaScript projects, leveraging ES module syntax for clearer and more explicit imports. This option enables or disables the handling of URLs in functions such as url(), image-set(), src(), and image() within CSS files. When enabled, these URLs are resolved and processed by webpack. To filter specific imports, you can use Webpack's built-in IgnorePlugin. The filter option, as available in css-loader, is not supported. Specifies the behavior of invalid export names in \"import ... from ...\" and \"export ... from ...\". Set the module to 'strict' or 'non-strict' mode. This can affect the module's behavior, as some behaviors differ between strict and non-strict modes. Specifies the behavior of invalid export names in \"export ... from ...\". This might be useful to disable during the migration from \"export ... from ...\" to \"export type ... from ...\" when reexporting types in TypeScript.'''
