full_description = "This plugin enables more fine grained control of source map generation. It is also enabled automatically by certain settings of the devtool configuration option. test (string|RegExp|array): Include source maps for modules based on their extension (defaults to .js and .css). exclude (string|RegExp|array): Exclude modules that match the given value from source map generation. append (string|function): Appends the given value to the original asset. Usually the #sourceMappingURL comment. [url] is replaced with a URL to the source map file. Starting from version 5.84.0, webpack allows the append option to be a function that accepts path data and an asset info object as arguments, and returns a string. Setting module and/or columns to false will yield less accurate source maps but will also improve compilation performance significantly. If you want to use a custom configuration for this plugin in development mode, make sure to disable the default one. I.e. set devtool: false. You can use the following code to replace the configuration option devtool: eval-source-map with an equivalent custom plugin configuration:"
