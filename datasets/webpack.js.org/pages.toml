full_description = 'But between input and output, it also has modules, entry points, chunks, chunk groups, and many other intermediate parts. During the bundling process, modules are combined into chunks. Chunks combine into chunk groups and form a graph (ChunkGraph) interconnected through modules. When you describe an entry point - under the hood, you create a chunk group with one chunk. One chunk group with the main name created (main is the default name for an entry point). This chunk group contains ./index.js module. As the parser handles imports inside ./index.js new modules are added into this chunk. Two chunk groups with names home and about are created. Each of them has a chunk with a module - ./home.js for home and ./about.js for about There might be more than one chunk in a chunk group. For example SplitChunksPlugin splits a chunk into one or more chunks. By default, there is no name for non-initial chunks so that a unique ID is used instead of a name. When using dynamic import we may specify a chunk name explicitly by using a "magic" comment:'
