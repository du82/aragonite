full_description = 'Help Wanted: This page is still a work in progress. If you are familiar with any of the options for which the description or examples are incomplete, please create an issue and submit a PR at the docs repo! Certain popular modules written for AMD, most notably jQuery versions 1.7.0 to 1.9.1, will only register as an AMD module if the loader indicates it has taken special allowances for multiple versions being included on a page. The allowances were the ability to restrict registrations to a specific version or to support different sandboxes with different defined modules. This option allows you to set the key your module looks for to a truthy value. As it happens, the AMD support in webpack ignores the defined name anyways. Fail out on the first error instead of tolerating it. By default webpack will log these errors in red in the terminal, as well as the browser console when using HMR, but continue bundling. To enable it: Avoid using bail option in watch mode, as it will force webpack to exit as soon as possible when an error is found. A list of name defining all sibling configurations it depends on. Dependent configurations need to be compiled first. [RegExp, function (WebpackError, Compilation) => boolean, {module?: RegExp, file?: RegExp, message?: RegExp}] Tells webpack to ignore specific warnings. This can be done with a RegExp, a custom function to select warnings based on the raw warning instance which is getting WebpackError and Compilation as arguments and returns a boolean, an object with the following properties: You can override properties in the loader context as webpack copies all properties that are defined in the loader to the loader context. Limit the number of parallel processed modules. Can be used to fine tune performance or to get more reliable profiling results. Capture a "profile" of the application, including statistics and hints, which can then be dissected using the Analyze tool. It will also log out a summary of module timings. Combine profile: true with parallelism: 1 to get correct timings. Note that this will slow down the build as well.'
