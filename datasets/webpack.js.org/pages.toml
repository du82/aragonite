["https://webpack.js.org/plugins/environment-plugin"]
title = "EnvironmentPlugin | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = '''The EnvironmentPlugin accepts either an array of keys or an object mapping its keys to their default values. EnvironmentPlugin checks process.env for the specified variable. If it’s missing, it searches for a default value provided in the configuration. If neither the environment variable nor the default value is defined, an error will be thrown: "EnvironmentPlugin - ${key} environment variable is undefined". Alternatively, the EnvironmentPlugin supports an object, which maps keys to their default values. The default value for a key is taken if the key is undefined in process.env. Default values of null and undefined behave differently. Use undefined for variables that must be provided during bundling, or null if they are optional. Let's investigate the result when running the previous EnvironmentPlugin configuration on a test file entry.js: The following EnvironmentPlugin configuration provides process.env.GIT_VERSION (such as "v5.4.0-2-g25139f57f") and process.env.GIT_AUTHOR_DATE (such as "2020-11-04T12:25:16+01:00") corresponding to the last Git commit of the repository:'''
