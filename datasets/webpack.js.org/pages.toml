full_description = "This will enable HTML optimization only in production mode. If you want to run it also in development set the optimization.minimize option to true. Use multi-process parallel running to improve the build speed. Default number of concurrent runs: os.cpus().length - 1. Allows you to override default minify function. By default, plugin uses html-minifier-terser package. The difference between swcMinify and swcMinifyFragment is the error reporting. You will get errors (invalid or broken syntax) if you have them in your HTML document or fragment. Which allows you to see all the errors and problems at the build stage. If an array of functions is passed to the minify option, the minimizerOptions can be an array or an object. If minimizerOptions is array, the function index in the minify array corresponds to the options object with the same index in the minimizerOptions array. If you use minimizerOptions like object, all minify function accept it. Default: { caseSensitive: true, collapseWhitespace: true, conservativeCollapse: true, keepClosingSlash: true, minifyCSS: true, minifyJS: true, removeComments: true, removeScriptTypeAttributes: true, removeStyleLinkTypeAttributes: true, } The function index in the minify array corresponds to the options object with the same index in the minimizerOptions array. If you use minimizerOptions like object, all minify function accept it. You can use multiple HtmlMinimizerPlugin plugins to compress different files with the different minify function."
