["https://webpack.js.org/guides/hot-module-replacement"]
title = "Hot Module Replacement | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "Hot Module Replacement (or HMR) is one of the most useful features offered by webpack. It allows all kinds of modules to be updated at runtime without the need for a full refresh. This page focuses on implementation while the concepts page gives more details on how it works and why it's useful. HMR is not intended for use in production, meaning it should only be used in development. See the building for production guide for more information. This feature is great for productivity. All we need to do is update our webpack-dev-server configuration, and use webpack's built-in HMR plugin. We'll also remove the entry point for print.js as it will now be consumed by the index.js module. If you took the route of using webpack-dev-middleware instead of webpack-dev-server, please use the webpack-hot-middleware package to enable HMR on your custom server or application. You can use the CLI to modify the webpack-dev-server configuration with the following command: webpack serve --hot-only. Now let's update the index.js file so that when a change inside print.js is detected we tell webpack to accept the updated module. Start changing the console.log statement in print.js, and you should see the following output in the browser console (don't worry about that button.onclick = printMe output for now, we will also update that part later). When using Webpack Dev Server with the Node.js API, don't put the dev server options on the webpack configuration object. Instead, pass them as a second parameter upon creation. For example: To enable HMR, you also need to modify your webpack configuration object to include the HMR entry points. Here's a small example of how that might look: If you're using webpack-dev-middleware, check out the webpack-hot-middleware package to enable HMR on your custom dev server. Hot Module Replacement can be tricky. To show this, let's go back to our working example. If you go ahead and click the button on the example page, you will realize the console is printing the old printMe function."
