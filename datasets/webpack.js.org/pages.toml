full_description = "To disambiguate in your webpack.config.js between development and production builds you may use environment variables. webpack's environment variables are different from the environment variables of operating system shells like bash and CMD.exe The webpack command line environment option --env allows you to pass in as many environment variables as you like. Environment variables will be made accessible in your webpack.config.js. For example, --env production or --env goal=local. Setting up your env variable without assignment, --env production sets env.production to true by default. There are also other syntaxes that you can use. See the webpack CLI documentation for more information. There is one change that you will have to make to your webpack config. Typically, module.exports points to the configuration object. To use the env variable, you must convert module.exports to a function: Webpack CLI offers some built-in environment variables which you can access inside a webpack configuration."
