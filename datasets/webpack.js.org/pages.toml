["https://webpack.js.org/api/compiler-hooks"]
title = "Compiler Hooks | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "The Compiler module is the main engine that creates a compilation instance with all the options passed through the CLI or Node API. It extends the Tapable class in order to register and call plugins. Most user-facing plugins are first registered on the Compiler. When developing a plugin for webpack, you might want to know where each hook is called. To learn this, search for hooks.<hook name>.call across the webpack source. The Compiler supports watching which monitors the file system and recompiles as files change. When in watch mode, the compiler will emit the additional events such as watchRun, watchClose, and invalid. This is typically used in development, usually under the hood of tools like webpack-dev-server, so that the developer doesn't need to re-compile manually every time. Watch mode can also be entered via the CLI. Called while preparing the compiler environment, right after initializing the plugins in the configuration file. Executes a plugin during watch mode after a new compilation is triggered but before the compilation is actually started. Called right after beforeCompile, before a new compilation is created. This hook is not copied to child compilers. Executed while initializing the compilation, right before emitting the compilation event. This hook is not copied to child compilers. Executed when an asset has been emitted. Provides access to information about the emitted asset, such as its output path and byte content. Executed when a watching compilation has been invalidated. This hook is not copied to child compilers. Allows to use infrastructure logging when enabled in the configuration via infrastructureLogging option. Allows to log into stats when enabled, see stats.logging, stats.loggingDebug and stats.loggingTrace options."
