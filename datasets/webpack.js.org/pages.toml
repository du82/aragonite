["https://webpack.js.org/plugins/context-replacement-plugin"]
title = "ContextReplacementPlugin | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = '''Context refers to a require with an expression such as require('./locale/' + name + '.json'). When encountering such an expression, webpack infers the directory ('./locale/') and a regular expression (/^.*\.json$/). Since the name is not known at compile time, webpack includes every file as module in the bundle. The ContextReplacementPlugin allows you to override the inferred information. There are various ways to configure the plugin: If the resource (directory) matches resourceRegExp, the plugin replaces the default resource, recursive flag or generated regular expression with newContentResource, newContentRecursive or newContextRegExp respectively. If newContentResource is relative, it is resolved relative to the previous resource. The moment/locale context is restricted to files matching /de|fr|hu/. Thus only those locales are included (see this issue for more information). The newContentCallback function is given a data object of the ContextModuleFactory and is expected to overwrite the request attribute of the supplied object. These two parameters can be used together to redirect requests in a more targeted way. The newContentCreateContextMap allows you to map runtime requests to compile requests in the form of an object:'''
year_published = 2025
