["https://webpack.js.org/loaders/css-loader"]
title = "css-loader | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "If, for one reason or another, you need to extract CSS as a file (i.e. do not store CSS in a JS module) you might want to check out the recommend example. Allow to enable/disables handling the CSS functions url and image-set. If set to false, css-loader will not parse any paths specified in url or image-set. A function can also be passed to control this behavior dynamically based on the path to the asset. Starting with version 4.0.0, absolute paths are parsed based on the server root. To import assets from a node_modules path (include resolve.modules) and for alias, prefix it with a ~: Allow to filter url(). All filtered url() will not be resolved (left in the code as they were written). Allows to enables/disables @import at-rules handling. Control @import resolving. Absolute urls in @import will be moved in runtime code. To import styles from a node_modules path (include resolve.modules) and for alias, prefix it with a ~: Allow to filter @import. All filtered @import will not be resolved (left in the code as they were written). Using false value increase performance because we avoid parsing CSS Modules features, it will be useful for developers who use vanilla css or use other technologies. Using local value requires you to specify :global classes. Using global value requires you to specify :local classes. Using pure value requires selectors must contain at least one local class or id. The syntax :local(.className) can be used to declare className in the local scope. The local identifiers are exported by the module. With :local (without brackets) local mode can be switched on for this selector. The :global(.className) notation can be used to declare an explicit global selector. With :global (without brackets) global mode can be switched on for this selector. The loader replaces local selectors with unique identifiers. The chosen unique identifiers are exported by the module. We strongly recommend that you specify the extension when importing a file, since it is possible to import a file with any extension and it is not known in advance which file to use."
year_published = 2025
