title = "Asset Modules | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "Asset Modules allow one to use asset files (fonts, icons, etc) without configuring additional loaders. When using the old assets loaders (i.e. file-loader/url-loader/raw-loader) along with Asset Modules in webpack 5, you might want to stop Asset Modules from processing your assets again as that would result in asset duplication. This can be done by setting the asset's module type to 'javascript/auto'. To exclude assets that came from new URL calls from the asset loaders add dependency: { not: ['url'] } to the loader configuration. By default, under the hood, the asset type does __webpack_public_path__ + import.meta. This means that setting the output.publicPath in your config will allow you to override the URL from which the asset loads. If you set the __webpack_public_path__ in code, the way you need to achieve it so as not to break the asset loading logic is to make sure you run it as the first code in your app and not use a function to do so. An example of this would be having a file called publicPath.js with contents Alternatively, you can do the following in your App.js without modifying your webpack config. The only downside is you have to enforce ordering here and that can collide with some linting tools. All .png files will be emitted to the output directory and their paths will be injected into the bundles, besides, you can customize outputPath and publicPath for them. By default, asset/resource modules are emitting with [hash][ext][query] filename into output directory. With this configuration all the html files will be emitted into a static directory within the output directory. Rule.generator.filename is the same as output.assetModuleFilename and works only with asset and asset/resource module types. If you want to use a custom encoding algorithm, you may specify a custom function to encode a file content: Depending on the target in your configuration, webpack would compile the above code into a different result: Now webpack will automatically choose between resource and inline by following a default condition: a file with size less than 8kb will be treated as a inline module type and resource module type otherwise."
