["https://webpack.js.org/guides/author-libraries"]
title = "Authoring Libraries | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "Aside from applications, webpack can also be used to bundle JavaScript libraries. The following guide is meant for library authors looking to streamline their bundling strategy. Let's assume that we are writing a small library, webpack-numbers, that allows users to convert the numbers 1 through 5 from their numeric representation to a textual one and vice-versa, e.g. 2 to 'two'. We install lodash as devDependencies instead of dependencies because we don't want to bundle it into our library, or our library could be easily bloated. So far everything should be the same as bundling an application, and here comes the different part – we need to expose exports from the entry point through output.library option. However it only works when it's referenced through script tag, it can't be used in other environments like CommonJS, AMD, Node.js, etc. As a library author, we want it to be compatible in different environments, i.e., users should be able to consume the bundled library in multiple ways listed below: Note that the library setup is tied to the entry configuration. For most libraries, specifying a single entry point is sufficient. While multi-part libraries are possible, it is more straightforward to expose partial exports through an index script that serves as a single entry point. Using an array as an entry point for a library is not recommended. Now, if you run npx webpack, you will find that a largish bundle is created. If you inspect the file, you'll see that lodash has been bundled along with your code. In this case, we'd prefer to treat lodash as a peer dependency. Meaning that the consumer should already have lodash installed. Hence you would want to give up control of this external library to the consumer of your library. This means that your library expects a dependency named lodash to be available in the consumer's environment. You won't be able to exclude them from the bundle by specifying library in the externals. You'll either need to exclude them one by one or by using a regular expression."
year_published = 2025
clearnet = "https://webpack.js.org/guides/author-libraries"
