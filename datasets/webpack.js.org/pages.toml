["https://webpack.js.org/plugins/copy-webpack-plugin"]
title = "CopyWebpackPlugin | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = '''copy-webpack-plugin is not designed to copy files generated from the build process; rather, it is to copy files that already exist in the source tree, as part of the build process. If you want webpack-dev-server to write files to the output directory during development, you can force it with the writeToDisk option or the write-file-webpack-plugin. Glob or path from where we copy files. Globs accept fast-glob pattern-syntax. Glob can only be a string. Don't use directly \\ in from option if it is a glob (i.e path\to\file.ext) option because on UNIX the backslash is a valid character inside a path component, i.e., it's not a separator. On Windows, the forward slash and the backward slash are both separators. Instead please use /. If you define from as absolute file path or absolute folder path on Windows, you can use windows path segment (\\) Don't use directly \\ in to (i.e path\to\dest) option because on UNIX the backslash is a valid character inside a path component, i.e., it's not a separator. On Windows, the forward slash and the backward slash are both separators. Instead please use / or path methods. Don't return directly \\ in to (i.e path\to\newFile) option because on UNIX the backslash is a valid character inside a path component, i.e., it's not a separator. On Windows, the forward slash and the backward slash are both separators. Instead please use / or path methods. Don't use directly \\ in context (i.e path\to\context) option because on UNIX the backslash is a valid character inside a path component, i.e., it's not a separator. On Windows, the forward slash and the backward slash are both separators. Instead please use / or path methods. context can be an absolute path or a relative path. If it is a relative path, then it will be converted to an absolute path based on compiler.options.context. context should be explicitly set only when from contains a glob. Otherwise, context is automatically set, based on whether from is a file or a directory: If from is a directory, then context equals from. The result paths will be the paths of the directory's contents (including nested contents), relative to the directory.'''
