["https://webpack.js.org/guides/getting-started"]
title = "Getting Started | webpack"
description = "Learn how to bundle a JavaScript application with webpack 5."
full_description = '''Webpack is used to compile JavaScript modules. Once installed, you can interact with webpack either from its CLI or API. If you're still new to webpack, please read through the core concepts and this comparison to learn why you might use it over the other tools that are out in the community. First let's create a directory, initialize npm, install webpack locally, and install the webpack-cli (the tool used to run webpack on the command line): Throughout the Guides we will use diff blocks to show you what changes we're making to directories, files, and code. For instance: We also need to adjust our package.json file in order to make sure we mark our package as private, as well as removing the main entry. This is to prevent an accidental publish of your code. If you want to learn more about the inner workings of package.json, then we recommend reading the npm documentation. In this example, there are implicit dependencies between the <script> tags. Our index.js file depends on lodash being included in the page before it runs. This is because index.js never explicitly declared a need for lodash; it assumes that the global variable _ exists. First we'll tweak our directory structure slightly, separating the "source" code (./src) from our "distribution" code (./dist). The "source" code is the code that we'll write and edit. The "distribution" code is the minimized and optimized output of our build process that will eventually be loaded in the browser. Tweak the directory structure as follows: You may have noticed that index.html was created manually, even though it is now placed in the dist directory. Later on in another guide, we will generate index.html rather than edit it manually. Once this is done, it should be safe to empty the dist directory and to regenerate all the files within it. When installing a package that will be bundled into your production bundle, you should use npm install --save. If you're installing a package for development purposes (e.g. a linter, testing libraries, etc.) then you should use npm install --save-dev. More information can be found in the npm documentation.'''
