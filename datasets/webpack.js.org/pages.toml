["https://webpack.js.org/api/compilation-hooks"]
title = "Compilation Hooks | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = 'The Compilation module is used by the Compiler to create new compilations (or builds). A compilation instance has access to all modules and their dependencies (most of which are circular references). It is the literal compilation of all the modules in the dependency graph of an application. During the compilation phase, modules are loaded, sealed, optimized, chunked, hashed and restored. The Compilation class also extends Tapable and provides the following lifecycle hooks. They can be tapped the same way as compiler hooks: The afterChunks hook is invoked following the creation of the chunks and module graph, and prior to their optimization. This hook provides an opportunity to examine, analyze, and modify the chunk graph if necessary. Called at the beginning of the module optimization phase. A plugin can tap into this hook to perform optimizations on modules. Called at the beginning of the chunk optimization phase. A plugin can tap into this hook to perform optimizations on chunks. Called before optimizing the dependency tree. A plugin can tap into this hook to perform a dependency tree optimization. Called after the tree optimization, at the beginning of the chunk modules optimization. A plugin can tap into this hook to perform optimizations of chunk modules. Called to determine whether or not to store records. Returning anything !== false will prevent every other "record" hook from being executed (record, recordModules, recordChunks and recordHash). Store information about record hash to the records. This is only triggered if shouldRecord returns a truthy value. Store information about the compilation to the records. This is only triggered if shouldRecord returns a truthy value. additionalChunkAssets is deprecated (use the Compilation.hook.processAssets instead and use one of the Compilation.PROCESS_ASSETS_STAGE_* as a stage option) Called to determine whether or not generate chunks assets. Returning anything !== false will allow chunk assets generation. additionalAssets is deprecated (use the Compilation.hook.processAssets hook instead and use one of the Compilation.PROCESS_ASSETS_STAGE_* as a stage option)'
