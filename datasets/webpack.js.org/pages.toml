full_description = '''For proper usage and easier distribution of this configuration, webpack can be configured with webpack.config.js. Any parameters sent to the CLI will map to a corresponding parameter in the configuration file. webpack-cli offers a variety of commands to make working with webpack easier. By default webpack ships with To generate a project without questions. When enabled, the default answer for each question will be used. See the full list of options for webpack serve command and related documentation for webpack-dev-server. Starting CLI v4 and webpack v5, CLI imports the entire configuration schema from webpack core to allow tuning almost every configuration option from the command line. For example if you want to enable performance hints in your project you'd use this option in configuration, with core flags you can do - A filename or a set of named filenames which act as the entry point to build your project. You can pass multiple entries (every entry is loaded on startup). Following are the multiple ways of specifying entry file(s) via CLI - The --entry-reset option is required to replace the existing entry option, without it the --entry option will add another entry to the existing entries. Use webpack [command] --entry-reset [entries...] [option] syntax because some options can accept multiple values so webpack --target node ./entry.js means target: ['node', './entry.js'] A path for the bundled file to be saved in. It will be mapped to the configuration options output.path. This will bundle your source code with entry as index.js, and the output bundle file will have a path of dist. CLI will look for some default configurations in the path of your project, here are the config files picked up by CLI. example - config file lookup will be in order of .webpack/webpackfile > .webpack/webpack.config.js > webpack.config.js Note that Command Line Interface has a higher precedence for the arguments you use it with than your configuration file. For instance, if you pass --mode="production" to webpack CLI and your configuration file uses development, production will be used.'''
