title = "Module Variables | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "This section covers all variables available in code compiled with webpack. Modules will have access to certain data from the compilation process through module and other variables. Indicates whether or not Hot Module Replacement is enabled and provides an interface to the process. See the HMR API page for details. Defines the value that will be returned when a consumer makes a require call to the module (defaults to a new object). This variable is equal to the default value of module.exports (i.e. an object). If module.exports gets overwritten, exports will no longer be exported. If used inside an expression that is parsed by the Parser, the configuration option is treated as true. The import.meta exposes context-specific metadata to a JavaScript module, such as the URL of the module. It is only available in ESM. Please note that webpack does not support direct access to import.meta. Instead, you should access its properties or use destructuring assignment. E.g., Webpack specific. An alias for module.hot, however import.meta.webpackHot can be used in strict ESM while module.hot can't. If used inside an expression that is parsed by the Parser, the configuration option is treated as true. The resource query of the current module. If the following require call was made, then the query string would be available in file.js. It is assignable, which allows changing the filename used by the runtime. For example, it can be used to determine the final path when loading chunks. Generates a require function that is not parsed by webpack. Can be used to do cool stuff with a global require function if available. __webpack_exports_info__.<exportName>.used is false when the export is known to be unused, true otherwise Accessing the info from nested exports is possible: i. e. __webpack_exports_info__.<exportName>.<exportName>.<exportName>.used"
