full_description = "Create an instance of ProgressPlugin and provide one of the allowed params, besides, there's a static method createDefaultHandler which can be used to customize the default handler. Provide a handler function which will be called when hooks report progress. handler function arguments: If the default handler of ProgressPlugin does not meet your requirements, you can customize it using the static ProgressPlugin.createDefaultHandler method. By default, progress percentage is calculated based on built modules count and total modules count: built / total The total modules count is unknown in advance and changes during the build. This may cause inaccurate progress percentage. To solve this problem ProgressPlugin caches the last known total modules count and reuses this value on the next build. The first build will warm the cache but the following builds will use and update this value. We recommend using percentBy: 'entries' setting for projects with multiple configured entry points. Percentage calculation will become more accurate because the amount of entry points is known in advance. Hooks marked with * allow plugins to report progress information using reportProgress. For more, see Plugin API: Reporting Progress"
