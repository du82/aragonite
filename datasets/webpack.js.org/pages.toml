["https://webpack.js.org/guides/web-workers"]
title = "Web Workers | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "The syntax was chosen to allow running code without bundler, it is also available in native ECMAScript modules in the browser. Note that while the Worker API suggests that Worker constructor would accept a string representing the URL of the script, in webpack 5 you can only use URL instead. Using a variable in the Worker constructor is not supported by webpack. For example, the following code will not work: const url = new URL('./path/to/worker.ts', import.meta.url); const worker = new Worker(url);. This is because webpack cannot analyse the syntax statically. It is important to be aware of this limitation when using Worker syntax with webpack. Note that this is only available in ESM. Worker in CommonJS syntax is not supported by either webpack or Node.js."
