["https://webpack.js.org/plugins/dll-plugin"]
title = "DllPlugin | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = '''The DllPlugin and DllReferencePlugin provide means to split bundles in a way that can drastically improve build time performance. The term "DLL" stands for Dynamic-link library which was originally introduced by Microsoft. This plugin is used in a separate webpack configuration exclusively to create a dll-only-bundle. It creates a manifest.json file, which is used by the DllReferencePlugin to map dependencies. When webpack output uses code splitting, we should use Template strings in path to ensure that webpack generates multiple manifest files. We recommend using DllPlugin only with entryOnly: true, otherwise tree shaking in the DLL won't work as all the exports might be used. Creates a manifest.json which is written to the given path. It contains mappings from require and import requests to module ids. It is used by the DllReferencePlugin. Combine this plugin with output.library option to expose (aka, put into the global scope) the dll function. This plugin is used in the primary webpack config, it references the dll-only-bundle(s) to require pre-built dependencies. References a dll manifest file to map dependency names to module ids, then requires them as needed using the internal __webpack_require__ function. The content of the dll is accessible under a module prefix. i.e. with scope = 'xyz' a file abc in the dll can be access via require('xyz/abc'). The content of the dll is mapped to the current directory. If a required file matches a file in the dll (after resolving), then the file from the dll is used instead. Because this happens after resolving every file in the dll bundle, the same paths must be available for the consumer of the dll bundle. i.e. if the dll contains lodash and the file abc, require('lodash') and require('./abc') will be used from the dll, rather than building them into the main bundle.'''
year_published = 2025
