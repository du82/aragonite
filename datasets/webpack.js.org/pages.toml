["https://webpack.js.org/concepts/module-federation"]
title = "Module Federation | webpack"
description = "webpack is a module bundler. Its main purpose is to bundle JavaScript files for usage in a browser, yet it is also capable of transforming, bundling, or packaging just about any resource or asset."
full_description = "Multiple separate builds should form a single application. These separate builds act like containers and can expose and consume code among themselves, creating a single, unified application. We distinguish between local and remote modules. Local modules are regular modules that are part of the current build. Remote modules are modules that are not part of the current build but are loaded at runtime from a remote container. Loading remote modules is considered an asynchronous operation. When using a remote module, these asynchronous operations will be placed in the next chunk loading operation(s) that are between the remote module and the entrypoint. It's not possible to use a remote module without a chunk loading operation. A chunk loading operation is usually an import() call, but older constructs like require.ensure or require([...]) are supported as well. A container is created through a container entry, which exposes asynchronous access to the specific modules. The exposed access is separated into two steps: Step 1 will be done during the chunk loading. Step 2 will be done during the module evaluation interleaved with other (local and remote) modules. This way, evaluation order is unaffected by converting a module from local to remote or the other way around. It is possible to nest containers. Containers can use modules from other containers. Circular dependencies between containers are also possible. Each build acts as a container and also consumes other builds as containers. This way, each build is able to access any other exposed module by loading it from its container. Shared modules are modules that are both overridable and provided as overrides to nested containers. They usually point to the same module in each build, e.g., the same library. The packageName option allows setting a package name to look for a requiredVersion. It is automatically inferred for the module requests by default, set requiredVersion to false when automatic infer should be disabled."
year_published = 2025
clearnet = "https://webpack.js.org/concepts/module-federation"
