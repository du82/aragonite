["https://www.webpagetest.org/learn/lightning-fast-web-performance"]
title = "Lightning-Fast Web Performance Online Course from WebPageTest"
description = "Run a free website speed test from around the globe using real browsers at consumer connection speeds with detailed optimization recommendations."
full_description = "Online CourseLearn to analyze site performance, fix issues, monitor for regressions, and deliver fast, responsive designs from the start. In this lecture series, you'll gain a well-rounded understanding of front-end web performance that'll empower you to deliver sites quickly and reliably. These clips are taken from various points throughout the lecture series and illustrate the style of presentation you can expect to see throughout. This lecture series is designed to cover performance holistically, starting with the basics and continuing to touch on points both technical and not. The course does not assume any knowledge of performance concepts, but it is aimed at Front-End Developers and UI/UX designers who are comfortable writing HTML, CSS, and have a basic knowledge of JavaScript. If you're a designer or developer looking to gain a better understanding of how your decisions and company culture impacts your ability to deliver quickly and resiliently, this is the course for you. This free course consists of a series of video lectures that combine screencasts and narrated slides. Closed captioning is provided and a PDF is included with each video for links to resources mentioned within. Some videos require signing up for a free WebPageTest account. An introduction to the course and and overview of how you can expect the subject matter to be divided up. A tour of the common metrics that performance tools and web developers use to measure and compare webpage performance and usability. A deep dive into the process of using popular performance tools to find and diagnose issues with webpage performance. Optimizing files is one of the easiest and most impactful ways to improve your site's ability to perform. A look at the delays between when a page looks usable and actually responds to user interaction and how to mitigate them. Good performance considers the holistic user experience, and many optimizations can make recurring visits faster and more resilient. Scott Jehl is an experienced professional with over two decades of expertise in creative design and front-end technology. He has led web design and development projects for numerous iconic brands. He enjoys writing and speaking for various publications and conferences around the world."
