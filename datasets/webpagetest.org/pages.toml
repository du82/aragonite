["https://www.webpagetest.org/signup"]
title = "Go Pro with WebPageTest"
description = """
WebPageTest Pro  our premium, paid subscription plan that unlocks powerful functionality and features for WebPageTest including, but not limited to: bulk testing, premium testing locations, high priority in testing queues, the WebPageTest API, experiments, dedicated support and private tests.                                WebPageTest Starter is our free plan available to all users to run WebPageTest runs that provide all the performance metrics that WebPageTest has provided for years plus access to the new Opportunities report."""
full_description = "Ready to go Pro? All the WebPageTest features you already love, plus API Access & No-Code Experiments! Plans start at just $18.75/mo Compare Plans Starter Plan WebPageTest Pro Save 20% with Annual Plans Runs/mo: 1000 5000 10000 20000 1000 5000 10000 20000 Plan: Annual Monthly Limited-time special price Expert Starting from 10M pageviews (RUM) + 30K runs/month Price Sign up for a Free Plan Start for free Sign up for a Pro Plan Start for $180.00/year Sign up for an Expert Plan Start for $999/month Billed at $11,988/year Monthly Test Runs 300 As per plan As per contract New User Experience No No Yes Real User Monitoring (RUM) No No Yes Single Sign On (SSO) No No Yes DNS Monitoring No No Ask your account team CDN Monitoring No No Ask your account team Locations 30 40* 40* Browser All All All Connection Speeds All All All Filmstrip and Video Yes Yes Yes Google Lighthouse Yes Yes Yes Test History 13 Months 13 Months Up to 7 years Priority Tests No Yes Yes API Access No Yes Yes Integrations No Yes Coming Soon Private Tests No Yes Yes Bulk Testing No Yes Coming Soon Opportunities Yes Yes Yes Experiments No Yes Yes Custom Metrics Yes Yes Coming Soon Scripted Test (limited to 3 steps) Yes Yes Yes Carbon Control Yes Yes Yes AI-powered dashboards No No Yes Scheduled Tests No No Yes BGP Monitoring No No Ask your account team Internet Sonar No No Ask your account team Support Forums Dedicated Support Assigned CSM team Need a custom plan? Contact Us Talk to Us * Our list of available test locations is continually growing. What' s included in WebPageTest Pro? What is WebPageTest Pro and what is WebPageTest Starter? WebPageTest Pro our premium, paid subscription plan that unlocks powerful functionality and features for WebPageTest including, but not limited to: bulk testing, premium testing locations, high priority in testing queues, the WebPageTest API, experiments, dedicated support and private tests. WebPageTest Starter is our free plan available to all users to run WebPageTest runs that provide all the performance metrics that WebPageTest has provided for years plus access to the new Opportunities report. How do you define a test run? FOR ALL PLANS, A test on WebPageTest is comprised of one or more test runs. A test run is defined as a single page load within a test. Here are a few examples: A test from a single browser and location, with 3 test runs, first view only, counts as three test runs. (3 runs * 1 load per run) A test from a single browser and location, with 5 test runs, first and repeat views for each run, counts as 10 test runs (5 runs * 2 loads per run) A test from a single browser and location, with 4 tests runs, first and repeat views for each run, and an additional Lighthouse run, counts as 9 test runs ( (4 runs * 2 loads per run) + 1 Lighthouse run) An experiment from a single browser and location, with 2 test runs, first view only for each run, counts as 4 runs (2 runs * 2 tests (one for the experiment, one for the control run). What countries and browsers do you support with the WebPageTest WebPageTest Starter gives you access to 30 locations worldwide, including mainland China. With WebPageTest Pro, you get access to 10 more premium locations. WebPageTest is always up-to-date on the current version of every browser and you can test on Chrome (stable, beta, canary), Firefox (stable, beta, ESR), Microsoft Edge (dev) and Brave. WebPageTest Pro also supports mobile emulation testing. You can test mobile content by emulating an Android browser by passing “mobile=1” as an API option. What are Opportunities and Experiments? Opportunities and Experiments are a powerful combination that will let you quickly identify areas of improvement for your website and test the impact of any relevant optimizations without ever having to write a line of code. Opportunities are recommendations that are broken down into three categories: Quickness Usability Resilience Opportunities are a free feature of WebPageTest provided to all users. For every opportunity, you will be presented with some combination of tips (suggestions for what to do to improve) and experiments (the ability to apply optimizations right within the WebPageTest sandbox). When you choose to run an experiment, WebPageTest applies the optimization in our sandbox environment and then runs a test (alongside a control test which uses our sandbox environment without applying the optimization), and presents you with results showing you how significant, or insignificant, the improvement was. Experiments are a paid feature and are only available to WebPageTest Pro subscribers. Is there a free trial where I can test WebPageTest Pro? We provide 1 free experiment per test for you to check out WebPageTest Experiments. You can also run Experiments from our inhouse webpage called The Metric Times where we have builti in anti-patterns for easy testing. We do not have a free trial option apart from the above 2 options, since Web PageTest Pro gives you all the metrics (except for the option to run the experiments) you see on a typical WebPageTest test result page as well as in the JSON today for any test you run on www.webpagetest.org. Is there a daily limit for the test runs? There is a monthly limit on the total tests you can run with the WebPageTest Pro and WebPageTest Starter Plans, based on the subscription plan you choose. There is currently no daily limit on top of that monthly limit. Do you provide any developer integrations that I can use with WebPageTest Pro? There are several existing first-party integrations built with the WebPageTest API, including our GitHub Action, Slack Bot, Visual Studio Code Extension, and our Node.js API wrapper (the preferred way to interact with our API). There are also numerous integrations built and maintained by our community members. You can find more ideas of how to use the API in our constantly growing recipes repository. How will I be charged? For monthly and annual subscriptions plans, your credit card will be automatically billed when you sign up and purchase the subscription, you'll be able to access your payment history under Billing History in My Account on www.webpagetest.org. All subscription plans can be canceled at any time without penalty. Once you choose to cancel, it stops the WebPageTest Pro subscription from auto-renewing for the next billing cycle. You’ll continue to have access to run tests for that plan, until the end of your current billing period. For Custom Enterprise plans where you want to run more than 20000 tests per month, please contact us. If you are based out of the United States of America, You will be charged in US Dollars, but the exact amount you will see on your credit card statement may vary, depending on foreign exchange rates and any foreign transaction fees your bank may impose. What payment methods do you support? We accept payment via Credit Card (VISA, Mastercard, American Express, JCB, Maestro, Discover, Diners Club International, UnionPay). Please ensure the accuracy of your payment method and that it is properly funded to avoid any issues with payment acceptance. We do not accept and will not ask you to provide payments with cash or a physical check. For Custom Enterprise plans, requiring more than 20K tests per month, please contact us. How secure is my payment? All payments are securely processed over HTTPS and your card information never touches our servers. All payment processing is done by a level 1 PCI compliant third-party credit card processor. All details are sent over SSL, which is a 2048-bit RSA-encrypted channel. Our payment gateway also adheres to card networks' requirements and regulations surrounding payment processing. Can I add more users to my WPT Pro or Starter account? Currently, we only support one user account to sign in and set up your account for WebPageTest Starter or to purchase the WebPageTest Pro subscriptions. However, if you use the WebPageTest API under the Pro subscription, you can generate up to 30 API Consumer keys for multiple use cases and teams, from a single WebPageTest Pro account. Generate a new key by clicking on “+ New API Key” in your account page. We have plans to support adding multiple users and defining roles in the future. What is the cancellation policy? You can choose to cancel anytime during the subscription period. Once you choose to cancel, it stops the WebPageTest Pro subscription from auto-renewing for the next billing cycle. You'll continue to have access to run tests for that plan, until the end of your current billing period. When you cancel, you cancel only the subscription. You'll continue to have access to the WebPageTest account and history of the manual tests you ran with that account. Please note all subscriptions are automatically renewed unless explicitly cancelled."
