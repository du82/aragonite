["https://webstandards.org/about/history/index.html"]
title = "History of the Web Standards Project - The Web Standards Project"
description = "The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all."
full_description = "History of the Web Standards Project Birth of the WaSP Return with us to 1998. The Web was no longer the exclusive playground of geeks. Creative web design had long ceased to be an “underground” phenomenon. Every corporation on earth was “building an online presence” whether it needed to or not. Chortling venture capitalists knew in their hearts that the money machine would never run out of steam. Netscape and Microsoft each claimed about 50% of the browser market, and their 4.0 browsers were almost entirely incompatible. Into that miasma of giddy hype, foolish dreams, and broken websites, The Web Standards Project (WaSP) intruded with a practical message practically nobody wanted to hear: If Netscape and Microsoft persisted in building ever–more incompatible browsers, the cost of development would continue to skyrocket, tens of millions would find themselves locked out, and the Web would fragment into a tower of digital Babel. In fact, we said, it had already begun to do so. We also pointed to the solution in our mission statement of 1998. Tim Berners–Lee, the inventor of the Web, had founded the World Wide Web Consortium (W3C) to nurture and recommend technologies such as CSS and XML that would enable the fledgling medium to remain open, interoperable, and accessible. If fully supported, these techologies would enable designers to design and developers to create functionality far beyond the capabilities of any individual web browser. Indeed, with solid support for W3C recommendations, which we referred to as “web standards,” the Web could expand beyond the browser without incurring additional fragmentation into incompatible wireless models. Our message did not go down easy. As competitors, Netscape and Microsoft were disquieted by the notion that they should support the same, open technologies. As powerful companies, they were also quite naturally uncomfortable with the idea that anyone—including the people who actually built the Web—had the right to tell them what they should or should not do. Between 1998 and today, we persevered, and ultimately the browser makers listened. In fact, engineers at both companies agreed with us, and privately delighted in our efforts to persuade the managers in charge to let Engineering do the right thing. Today, with most web users accessing the medium via products like Internet Explorer 5+, Opera 5+, Netscape 6, or Mozilla, we have solid support for many web standards, and The WaSP’s mission would seem to have been accomplished. Yet in spite of the efforts of the W3C, the browser makers, and a leading–edge minority of designers and developers, most of the Web remains a Balkanized mess of non–valid markup, unstructured documents yoked to outdated presentational hacks, and incompatible code fragments that leave many millions of web users frustrated and disenfranchised. Browser makers are no longer the problem. The problem lies with designers and developers chained to the browser–quirk–oriented markup of the 1990s—often because they don’t realize it is possible to support current standards while accommodating old browsers. It lies with “helpful” software that generates sites optimized for 4.0 browsers with nary a thought for document structure, open standards, separation of structure from presentation, or the long–term durability and viability of web documents. The resulting sites quickly become useless unless their browser–specific markup and code is continually updated to reflect changes in the browser market. In today’s economic climate, few site owners can afford such perpetual revision. Thus these once–fresh sites begin to rot. As we once spoke to browser makers, now we address a challenge to our colleagues in design and development, to our friends in the web software industry, and to our clients: W3C standards, supported in all popular browsers, are the only means of ensuring that the sites you build today will work for all—today and tomorrow. If not now, when? If not you, who? The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all. Mission History of the Web Standards Project Who We Are Colophon Legal Contact"
year_published = 2025
clearnet = "https://webstandards.org/about/history/index.html"
