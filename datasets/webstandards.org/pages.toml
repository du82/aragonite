full_description = "Small Business Update By Aaron Gustafson | August 5th, 2010 | Filed in Education, Outreach, Small Business Outreach A while back I announced WaSP’s new small business outreach effort and, thanks to your help, we’ve been making great progress. Skip to comment form Back in February, I announced that one of WaSP’s new efforts was going to be in the direction of outreach to small businesses. Since that time, things have looked pretty quiet from the outside, but the Small Business Outreach Committee has actually been quite busy gathering materials and putting together our first document which aims to help small business owners evaluate the competencies of those seeking to do web work for them. Thanks to the efforts of a handful of WaSP members and a cadre of other web professionals, we’re making great progress. We’ve just wrapped up the material organization phase and are beginning to work on drafting the document, which we hope to have out before the end of the year. We’re also in the process of putting together a website to house “living” versions of the materials we produce and assist with the promotion and distribution of this document and any others we generate in the future. We’ll post further announcements on this project as we get closer to the launch date. Your Replies #1 On August 25th, 2010 11:23 am DSL replied: Can you please tell me the expected lunch date? #2 On September 8th, 2010 5:49 am CodersX Webdesign replied: Like to hear, that your projects are getting bigger and better. I wish you the best for the future and hope that WaSP will still remain as the last castle of web standards in the internet. ;) Return to top Post a Reply Comments are closed."
