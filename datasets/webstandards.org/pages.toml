, webmasters need not test in less popular browsers (those with ... By Bruce Lawson | January 19th, 2009 WCAG 2 and mobileOK Basic Tests specs are proposed recommendations WCAG 2 and the mobileOK Basic Tests specifications have been moved to "proposed recommendation status" by the W3C, which means that the technical material is complete and it has been implemented in real sites. WCAG 2 Shawn Henry writes of WCAG 2, Over the last few months, the Web Content ... By Bruce Lawson | November 4th, 2008 Acid3 receptions and misconceptions and do we have a winner? Acid3 progress and what it really means. By Lars Gunther | October 2nd, 2008 UK government draft browser guidance is daft browser guidance This blog post is superseded by UK government browser guidelines: good sense prevails. Last friday, the UK government's Central Office of Information (COI) published a public consultation on browser standards for public sector websites: This guidance has been developed to assist those delivering public sector websites to determine which web browsers to ... By Bruce Lawson | September 8th, 2008 Acid 2 Test Back to Normal The Acid 2 test hosted here on the WaSP site was broken but is now fixed. By Derek Featherstone | July 24th, 2008 Opera 9.5 released Just a short buzz: the final version of Opera 9.5 was released today, with a boatload of exciting features. Of particular interest: excellent support for current standards — (X)HTML, XML, XSLT, CSS 2.1, SVG 1.1 partial implementations of new emerging standards — CSS 3, HTML 5, and ARIA More details about the browser's ... By Patrick Lauke | June 12th, 2008 Mozilla Download Day [German Translation] Mozilla hat sich vorgenommen, ins Guinness Buch der Rekorde zu kommen mit den meisten Software-Downloads in 24 Stunden! Darum wird der 17. Juni 2008 ein besonderer Tag sein: der Download Day. Was wird an diesem Tag so Besonderes sein? Mozilla möchte den Weltrekord aufstellen für die meisten Software-Downloads an einem einzigen ... By Glenda Sims | June 1st, 2008 Mozilla Download Day Mozilla is on a mission to set a Guinness World Record for the most software downloaded in 24 hours! By Kimberly Blessing | May 29th, 2008 Acid3 Passed in 23 Days! On March 3, the Web Standards Project launched the Acid3 Browser Test. On March 26, two browser teams reported that their builds passed. By Kimberly Blessing | April 7th, 2008 Microsoft releases the first IE8 Beta In other news, the ACID2 test page has become overwhelmed. By Aaron Gustafson | March 5th, 2008 Microsoft rethinks IE8′s default behavior Perhaps it was our complaining or perhaps it was a reconsideration of its own interoperability principles, but Microsoft has decided to change its course on IE8 and will opt-in to its new standards mode by default. By Aaron Gustafson | March 3rd, 2008 WaSP Round Table: IE8′s Default Version Targeting Behavior One week ago, several WaSP members took the time to have a virtual sit-down with Chris Wilson of Microsoft to talk about IE8′s proposed default behavior of having to opt-in for the browser’s new standards mode. By Aaron Gustafson | February 24th, 2008 Hug your bike, drink a beer and discuss a browser March is coming up and for most people in the web standards community, that means at least one thing: SXSW! The Web Standards Project will be present again this year, with our annual meeting (held on Monday the 10th, exact details to follow soon). Because there's so much going on in ... By Faruk Ateş | February 5th, 2008 Acid3 nearing completion If you’re a fan of the Acid browser tests, you already know that Acid3 is in the works. It’s now in a “final review” state, so please check it out and submit your feedback. By Kimberly Blessing | February 5th, 2008 Opting-in to standards support In this week’s issue of A List Apart, I was (finally) able to reveal Microsoft’s new strategy for forward-compatibility, a strategy that was developed hand-in-hand with several of us here at WaSP. By Aaron Gustafson | January 22nd,