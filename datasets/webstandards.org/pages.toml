title = "Henny Swan - The Web Standards Project"
description = "The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all."
full_description = "Henny Swan Henny Joined Opera as a Web Evangelist in September 2008 to help promote web standards and the open web. Prior to this she focused on accessibility and usability since the late 90′s when she worked for a search engine in China. From there she went on to be Senior Web Accessibility Consultant at Royal National Institute of Blind People (RNIB), a charity that supports blind and partially sighted people in the UK. Henny has a particular focus on where accessibility standards overlap with mobile best practice and internationalisation looking at how adherence to these standards benefits not just users of desktop browsers, mobiles and other devices but also businesses themselves. She is a member of the Web Accessibility Initiative (WAI) Education and Outreach Working Group (EOWG) as well as co-lead of the Web Standards Project (WASP) International Liaison Working Group (ILWG). She blogs on the Opera Developer Network, her own blog iheni.com as well as contributes articles to the UN Global Initiative for Accessible ICT (UN G3ICT). When not on the web she can be found kick-boxing in an old gym in south London or cooking Chinese food for friends. The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all. Mission History of the Web Standards Project Who We Are Colophon Legal Contact"
