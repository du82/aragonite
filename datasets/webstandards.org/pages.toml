full_description = "International Liaison Group ILG Members ILG Objectives ILG Translations Web Standards Cafés Translations of web standards articles ILG Mission The WaSP International Liaison Group (ILG) is an international collective of web professionals promoting the global use of standards to ensure an equitable Web. العربية (Arabic) مجموعة التنسيق الدولي (ILG) لمشروع المعايير القياسية (WaSP) للWeb هي منظمة مكونة من محترفي تطوير المواقع من جميع انحاء العالم لتعزيز استخدام المعايير القياسية و تحقيق قابلية الوصول للجميع. 简体中文 (Chinese, Simplified) WaSP 的国际联络组 (ILG) 由各国的网页专家组成，致力于推广网页标准，促进 Web 的平等访问。 繁體中文 (Chinese, Traditional) 網頁標準計畫 (WaSP) 旗下的跨國際聯絡團隊 (ILG) 集結了全球網頁專家，致力推廣網頁標準，以促成網站的存取平等。 Česky (Czech) Mezinárodní kontaktní skupina Web Standards Project (WaSP International Liaison Group – ILG) je celosvětovou iniciativou webových odborníků prosazující všeobecné používání standardů k zajištění rovného přístupu k Webu. Nederlands (Dutch) De Internationale Contactgroep (ILG) van de WaSP is een internationaal collectief van professionele webontwikkelaars dat wereldwijd het gebruik van de standaarden wil bevorderen om zodoende een gelijkwaardig Web te waarborgen dat openstaat voor allen. فارسى (Farsi) گروه رابط بين الملل (ILG) پروژه استانداردهاي وب (Wasp) جمعي است جهاني از حرفه ايهاي وب كه براي توسعه دادن كاربرد استانداردهاي جهاني و تضمين دسترسي بهتر به وب بهمديگر پيوسته اند. Français (French) Le groupe de liaison internationnal du WaSP (ILG) est un collectif international de professionnels du web promouvant l’utilisation mondiale des standards afin de s’assurer d’un Web équitable. Deutsch (German) Die WaSP International Liaison Group (ILG) ist ein internationaler Zusammenschluss von Web-Experten zur Förderung der weltweiten Verwendung von Webstandards, um ein offenes Internet zu gewährleisten. Ελληνικά (Greek) Το Διεθνές Γκρουπ Επικοινωνίας (ILG) της WASP είναι μια ομάδα επαγγελματιών του Web απ’ όλο τον κόσμο που στόχο έχει να προβάλλει τη χρήση των standards για ένα καλύτερο Web. Magyar (Hungarian) A WaSP (Web Standards Project) Nemzetközi Összekötő Csoport (International Liaison Group – ILG) webes szakemberek nemzetközi kollektívája, akik egy pártatlan Web biztosítása érdekében a szabványok globális alkalmazását támogatják. Íslenska (Icelandic) WaSP International Liaison Group (ILG) er alþjóðlegur samvinnuhópur atvinnufólks í vefmálum sem hefur það að markmiði að efla notkun hnattrænna staðla til að tryggja jöfnuð á vefnum. Italiano (Italian) L’ILG (International Liaison Group, Gruppo di cooperazione internazionale) del WaSP (Web Standards Project, Progetto per gli Standard Web) è un gruppo internazionale di professionisti del web che promuove l’uso degli standard a livello mondiale per garantire che il web sia uno strumento equo, accessibile e fruibile per tutti. 日本語 (Japanese) WaSPのInternational Liaison Group （ILG）は、公正なWebを確かなものとするためにWeb標準のグローバルな利用を促進する専門家らからなる、国際的なグループです。 한국어 (Korean) WaSP의 International Liaison Group (ILG)은 웹의 공정한 사용을 위하여 표준의 국제적인 이용을 촉진하기 위한 웹 전문가 그룹입니다. Polski (Polish) WaSP International Liaison Group (ILG) jest międzynarodowym kolektywem profesjonalistów z branży internetowej promujących globalne wykorzystanie standardów mających zapewnić porządek w sieci. Português (Portuguese) O Grupo de Ligação Internacional (ILG em inglês) do WaSP (Web Standards Project) é um colectivo de profissionais da Web que promovem o uso global dos standard para assegurarem uma Internet igualitária. Русский (Russian) Международная контактная группа при WaSP (WaSP International Liaison Group — ILG) — интернациональный коллектив вебпрофессионалов, пропагандирующий широкое применение стандартов с целью построения справедливого Веба. Српски (Serbian) Међународна контактна група (International Liaison Group — ILG) при Пројекту Веб Стандарда (Web Standards Project — WaSP) је интернационални колектив веб професионалаца који промовишe глобалну употребу стандарда како би обезбедио једнакост Веба. Castellano (Spanish) El Grupo de Enlace Internacional (ILG en inglés) del WaSP (Web Standards Project) es un colectivo internacional de profesionales de internet que promueven el uso global de los estándares para asegurarnos una Internet igualitaria. Svenska (Swedish) Web Standards Projects internationella sambandsgrupp (WaSP International Liaison Group – ILG) är en internationell grupp av webbspecialister som förespråkar globalt användande av standarder för att säkerställa en rättvis webb. Tagalog/Filipino (Tagalog/Filipino) Ang Internasyonal na Grupong Tagapamagitan (ILG sa Ingles) ng WaSP ay isang internasyonal na samahan ng mga propesyonal sa Web upang himukin ang pandaigdigang paggamit ng mga pamantayan para makatiyak sa isang pantay-pantay na Web. More Languages Don’t see your language? WaSP is a grassroots volunteer organization. All the translations you see here were created by friends of WaSP. Want to volunteer to translate content into your language? Contact the ILG Co-leads directly. The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all. Recent Task Force Buzz InterAct translations and localizations By Henny Swan | May 11th, 2009 Work is well and truly underway to get WaSP InterAct translated into multiple languages. With an army of over thirty volunteers working in eighteen languages we hope to get localized versions of the Curriculum into schools colleges and universities near you soon. Work is well and truly underway to get WaSP InterAct translated into multiple languages. With an army of over thirty volunteers working in eighteen languages we hope to get localized versions of the Curriculum into schools colleges and universities near you soon. It’s a huge project and we’re looking for as many volunteers as possible. If you’d like to help translate or help with localizing content for your local education system email the ILG leads and we’ll put you in touch with other volunteers. Full details abut how to get involved can be found in the Internationalizing and Translating InterAct forum. Thank you to everyone who’s involved so far! More Buzz articles Title Date Translations, 翻译, traducciones, Terjemahan, Перевод February 27th, 2009 Web Standards in Indonesia – a university web developer perspective February 20th, 2009 Opera Web Standards Curriculum translations available February 3rd, 2009 Get International Liaison Group Buzz via RSS or Atom"
