full_description = "Action What We’re Doing The Web Standards Project has formed project teams to address specific issues and technologies related to development and standards. Project Teams are led by WaSP members and involve industry representatives and subject matter experts. WaSP’s WaSP InterAct/Education Task Force works directly with educational institutions to promote instruction of Web standards and standards-compliant public sites. InterAct: Web Standards Curriculum is a living open curriculum based upon web standards and best practices, designed to teach students the skills of the web professional. The Interact Curriculum framework has 6 Learning Tracks. Adapt and use our resources. Contribute your own content and ideas. The WaSP International Liaison Group (ILG) is an international collective of web professionals promoting the global use of standards to ensure an equitable Web. Looking for a little history? Check out WaSP Previous Campaigns. We also are involved with the Acid2 and Acid3 browser tests, test pages for use by browser vendors. What You Can Do You can help shore up support for standards in our medium by joining us on WaSP Edu on Facebook, reporting browser bugs and participating in worthwhile campaigns. The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all. Acid2 Browser Test Acid3 Browser Test Small Business Outreach Education Task Force International Liaison Group Previous Campaigns Report Browser Bugs WaSP Street Team"
