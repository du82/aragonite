full_description = '''Buzz Archives: International Liaison Group InterAct translations and localizations Work is well and truly underway to get WaSP InterAct translated into multiple languages. With an army of over thirty volunteers working in eighteen languages we hope to get localized versions of the Curriculum into schools colleges and universities near you soon. By Henny Swan | Filed in General, International Liaison Group, translations Translations, 翻译, traducciones, Terjemahan, Перевод There are lots of great resources and blogs around the world in many languages that spread the word about web standards. Every once in a while however I see a new article in English and I think to myself "What a fantastic write-up, but I wish everyone could read it". ... By Henny Swan | Filed in International Liaison Group, translations Web Standards in Indonesia – a university web developer perspective When in Indonesia Bruce Lawson, co-lead of the Accessibility Task Force, got the opportunity to interview Widianto Nugroho from Institut Teknologi Bandung. What follows is the transcript of their chat as well as links to useful resources for anyone interested in web standards in Indonesia. Take it away Bruce! I was ... By Henny Swan | Filed in Accessibility, International Liaison Group, Web Standards (general) Opera Web Standards Curriculum translations available I'm always on the look out for translations of good resources into multiple languages so it's great to see the Opera Web Standards Curriculum starting to be translated into Brazilian Portuguese, Chinese, Hungarian, Italian and Russian. The curriculum, which will work in parallel with the upcoming Web Standards Framework from WaSP, ... By Henny Swan | Filed in International Liaison Group, Web Standards (general) “Just ask: Integrating accessibility throughout design” available in English, Japanese and Spanish Fancy giving your site a hardcore usability test? Then why not involve people with disabilities in your testing. Not sure where to start? Then check out Just Ask: integrating accessibility throughout design. This free online book, written by Shawn Lawton Henry from W3C in her spare time, looks at all you ... By Henny Swan | Filed in Accessibility, HTML/XHTML, International Liaison Group, Usability Want to set up a Web Standards Café? As a hat tip to Blue Beanie Day 2008 and in the spirit of helping spread the word of web standards, the International Liaison Group thought we'd celebrate by putting together a Web Standard Café Kit. Web Standards Cafés have been held all over the world bringing together people passionate about ... By Henny Swan | Filed in Action, International Liaison Group, Outreach, WSCafe WaSP Announces the International Liaison Group (ILG) A passion and hope I had during my years as Group Lead for the Web Standards Project was to reach out and create a network with peers around the globe. After all, this is the World Wide Web, right? It made sense to me that in order to advance our ... By Molly E. Holzschlag | Filed in International Liaison Group, WaSP Announcement The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all. Recent Buzz Our Work Here is Done By Aaron Gustafson | March 1st, 2013 Thanks to the hard work of countless WaSP members and supporters (like you), Tim Berners-Lee’s vision of the web as an open, accessible, and universal community is largely the reality. When The Web Standards Project (WaSP) formed in 1998, the web was the battleground in an ever-escalating war between two browser makers—Netscape and Microsoft—who were each taking turns “advancing” HTML to the point of collapse. You see, in an effort to one-up each other, the two browsers introduced new elements and new ways of manipulating web documents; this escalated to the point where their respective 4.0 versions were largely incompatible. Realizing that this fragmentation would inevitably drive up the cost of building websites and ran the risk of denying users access to content and services they needed, Glenn Davis, George Olsen, and Jeffrey Zeldman co-founded WaSP and rallied an amazing group of web designers and developers to help them push back. The WaSP’s primary goal was getting browser makers to support the standards set forth by the World Wide Web Consortium (W3C). In 2001, with the browser wars largely over, WaSP began to shift its focus. While some members continued to work with browser vendors on improving their standards support, others began working closely with software makers like Macromedia to improve the quality of code being authored in tools such as Dreamweaver. And others began the hard slog of educating web designers and developers about the importance of using web standards, culminating in the creation of WaSP InterAct, a web curriculum framework which is now overseen by the W3C. Thanks to the hard work of countless WaSP members and supporters (like you), Tim Berners-Lee’s vision of the web as an open, accessible, and universal community is largely the reality. While there is still work to be done, the sting of the WaSP is no longer necessary. And so it is time for us to close down The Web Standards Project. Many (if not all) of us are continuing to work in the world of web standards, but our work is now largely outside the umbrella of WaSP. If you are interested in continuing to work on web standards-related projects along with us, we humbly suggest you follow these projects: A List Apart – The magazine “for people who make websites” is run by WaSP founder Jeffrey Zeldman and is a consistent source of forward-thinking articles and tutorials. HTML5 Doctor – A solid resource and discussion forum on all things HTML5, brought to you by Bruce Lawson and his team. W3C Community Groups – If you have a passion for a specific web technology, you can help make it better by participating in one (or more) community groups. In particular, you might be interested in one of these: Core Mobile Web Platform, Responsive Images, Web Education, and Web Media Text Tracks. WebPlatform.org – A fantastic web standards resource, providing up-to-date documentation, Q&As, tutorials & more. Chris Mills, Doug Schepers, and a number of other standards advocates are involved in this project. Web Standards Sherpa – An educational resource founded by WaSP which continues to operate under the leadership of Chris Casciano, Virginia DeBolt, Aaron Gustafson, and Emily Lewis. Web Standards + Small Business – An outreach project started by WaSP that educates small businesses about why they should care about web standards. This project is overseen by Aaron Gustafson. The job’s not over, but instead of being the work of a small activist group, it’s a job for tens of thousands of developers who care about ensuring that the web remains a free, open, interoperable, and accessible competitor to native apps and closed eco-systems. It’s your job now, and we look forward to working with you, and wish you much success. Nota bene: In the near future, we will be making a permanent, static archive of webstandards.org and some of our other resources like WaSP Interact to preserve them as a resource and to provide a record of our 15-year mission to improve the web. Bruce Lawson and Steph Troeth contributed to this post. Filed in WaSP Announcement | Comments (89) More Buzz articles Title Author Call for action on Vendor Prefixes Rachel Andrew An End to Aging IE Installs Aaron Gustafson Beyond the Blue Beanie? Stephanie (Sullivan) Rewis The Sherpas are Here Aaron Gustafson'''
