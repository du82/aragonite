amweaver. And others began the hard slog of educating web designers and developers about the importance of using web standards, culminating in the creation of WaSP InterAct, a web curriculum framework which is now overseen by the W3C. Thanks to the hard work of countless WaSP members and supporters (like you), Tim Berners-Lee’s vision of the web as an open, accessible, and universal community is largely the reality. While there is still work to be done, the sting of the WaSP is no longer necessary. And so it is time for us to close down The Web Standards Project. Many (if not all) of us are continuing to work in the world of web standards, but our work is now largely outside the umbrella of WaSP. If you are interested in continuing to work on web standards-related projects along with us, we humbly suggest you follow these projects: A List Apart – The magazine “for people who make websites” is run by WaSP founder Jeffrey Zeldman and is a consistent source of forward-thinking articles and tutorials. HTML5 Doctor – A solid resource and discussion forum on all things HTML5, brought to you by Bruce Lawson and his team. W3C Community Groups – If you have a passion for a specific web technology, you can help make it better by participating in one (or more) community groups. In particular, you might be interested in one of these: Core Mobile Web Platform, Responsive Images, Web Education, and Web Media Text Tracks. WebPlatform.org – A fantastic web standards resource, providing up-to-date documentation, Q&As, tutorials & more. Chris Mills, Doug Schepers, and a number of other standards advocates are involved in this project. Web Standards Sherpa – An educational resource founded by WaSP which continues to operate under the leadership of Chris Casciano, Virginia DeBolt, Aaron Gustafson, and Emily Lewis. Web Standards + Small Business – An outreach project started by WaSP that educates small businesses about why they should care about web standards. This project is overseen b