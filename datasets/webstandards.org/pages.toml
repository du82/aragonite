full_description = "InterAct translations and localizations By Henny Swan | May 11th, 2009 | Filed in General, International Liaison Group, translations Work is well and truly underway to get WaSP InterAct translated into multiple languages. With an army of over thirty volunteers working in eighteen languages we hope to get localized versions of the Curriculum into schools colleges and universities near you soon. Skip to comment form Work is well and truly underway to get WaSP InterAct translated into multiple languages. With an army of over thirty volunteers working in eighteen languages we hope to get localized versions of the Curriculum into schools colleges and universities near you soon. It’s a huge project and we’re looking for as many volunteers as possible. If you’d like to help translate or help with localizing content for your local education system email the ILG leads and we’ll put you in touch with other volunteers. Full details abut how to get involved can be found in the Internationalizing and Translating InterAct forum. Thank you to everyone who’s involved so far! Your Replies #1 On May 11th, 2009 8:41 am Alan replied: Oh sounds like a great chance to get involved. I’ll look into getting a few helpers and get in touch. #2 On May 13th, 2009 8:41 am Henny replied: Wonderful, thanks Alan. You can find me on Twitter if that helps @iheni. I’ll be posting updates there as well. #3 On June 2nd, 2009 4:33 pm Translation replied: We have several translators that may be willing to volunteer some time. We will let them know about this. #4 On June 9th, 2009 4:40 am WaSP Member Henny Swan replied: @Translation Wonderful, looking forward to hearing from you, thanks. What language(s) do you work in? #5 On July 19th, 2009 5:10 am nedir replied: Oh sounds like a great chance to get involved. I will look into getting a few helpers and get in touch. #6 On July 21st, 2009 10:11 am PHPmoz replied: I have access to several translators as well that would be willing to contribute their services. I will notify them about this project. #7 On August 8th, 2009 5:44 am John replied: Email me if you need help getting the program translated to Dutch, I can do it for you or at least parts of it :). Love WaSP. Return to top Post a Reply Comments are closed."
