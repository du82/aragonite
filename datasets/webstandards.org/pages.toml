["https://webstandards.org/about/members/agustafson/index.html"]
title = "Aaron Gustafson - The Web Standards Project"
description = "The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all."
full_description = "Aaron Gustafson WaSP Group Manager, Microsoft Task Force Member After getting hooked on the web in 1996 and spending several years pushing pixels and bits for the likes of IBM and Konica Minolta, Aaron Gustafson founded Easy! Designs, LLC, a boutique web consultancy. In addition to being a member of the Web Standards Project (WaSP), Aaron serves as Technical Editor for A List Apart, is a contributing writer for Digital Web Magazine and MSDN, and has amassed a library of writing and editing credits in the print world, including AdvancED DOM Scripting (Friends of Ed, 2007) and Web Design in a Nutshell (3rd Edition, O’Reilly). Aaron is a regular on the web conference circuit and is frequently called upon to provide web standards and JavaScript training in both the public and private sector. He blogs at easy-reader.net. The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all. Mission History of the Web Standards Project Who We Are Colophon Legal Contact"
