["https://webstandards.org/2011/03/13/the-sherpas-are-here/index.html"]
title = "The Sherpas are Here - The Web Standards Project"
description = "The Web Standards Project is a grassroots coalition fighting for standards which ensure simple, affordable access to web technologies for all."
full_description = "The Sherpas are Here By Aaron Gustafson | March 13th, 2011 | Filed in General, Outreach, WaSP Announcement After many months of hard work, we’re excited to announce the launch of Web Standards Sherpa. Skip to comment form Today, I am very proud to announce the launch of our newest endeavor: Web Standard Sherpa. This project has been the better part of a year in the making and we’re really excited to see it finally launch. Web Standards Sherpa came about because we wanted to create a repository of best practices information while, at the same time, providing mentorship opportunities for practicing web professionals. With those goals in mind, we began to throw around ideas of what that could look like and we realized a pseudo-critique site could fit that bill perfectly. We say “pseudo” because the reviews we’ll be posting on Web Standards Sherpa are not traditional critiques, but rather focused reviews of a particular aspect of a site. The elevator pitch on the site sets it up well: Web Standards Sherpa’s experts provide helpful, pragmatic and up-to-date advice on best practices for web professionals everywhere. In terms of format, our plan is to bring on amazing authors for a period of 3-6 months or more at a time, with new articles coming out weekly. We’ve kicked things off with pieces by Erin Kissane, Jared Spool, and yours truly; Dan Rubin and Derek Featherstone are on deck for the next two issues. In order to get the ball rolling, we’ve chosen a handful of sites to look at, but our goal is to have users submit their own work to get honest feedback. We’re not looking to tear down your work, but we are looking to help everyone get better at their job. If you’re struggling with your navigation, for instance, you could submit your site and ask for our thoughts. If you’re unsure your approach to scripting a particular widget is the most efficient or are concerned about its accessibility, you should submit that too. We see Web Standards Sherpa as a way to let you glean advice from some of the smartest folks in the industry and provide you with the opportunity to learn from real world examples of what people are doing right and where there is room for improvement. We hope you’ll help us out by “feeding Shirley” (our mountain goat mascot) and submit your sites for review. Your Replies #1 On May 16th, 2011 5:58 pm Carlyle replied: In reading your article, I understand that you are going to review websites and give honest reviews. I am just wondering that once you become established would you begin to charge clients to review their websites? #2 On June 10th, 2011 1:00 pm David Ewing replied: Aaron, this post is from a few months back so Im not sure if you guys are still reviewing the sites and giving feedback but what would be the best way to get in line for the next batch of site reviews? Return to top Post a Reply Comments are closed."
