full_description = "What our users say… What our users say… We have appreciated WebTMS and, had I remained in practice after this year, we would have happily continued with your service indefinitely. Mark Nielsen Law Office of Mark J. Nielsen Our WebTMS system was installed in 2005 and we now have over 24,000 records. It accommodates all of our needs and is so user friendly, that anyone new to the system quickly gets the hang of it. I particularly like that it is accessible from anywhere which makes working off site easy. Especially if the documents you need are attached to the record, and that it is easy to compile and run off well presented reports. Frances HardingDirector of Trade MarksEMI Group Limited We converted our intellectual property portfolio to the hosted WebTMS application in August 2011, and must say that the interactive docket is a great tool. It reports deadlines and reminders for trademarks, contracts, and disputes. Additionally, the search capability in each module permits sub-searches based on the last search results, inclusive and exclusive of user-specified fields, so drill down searching is both convenient and fast. There are many pre-defined reports in the system but we have also created numerous custom reports for each module, with minimal effort. Tech support is very responsive when there is an issue or we have a question as well. We are very pleased with WebTMS’ functionality and speed as well as its accessibility from any location. The new mobile website and integration with Outlook email are both time savers. De Ann FreitagSenior IP ParalegalDel Monte Corporation As a new user to WebTMS, the Outlook add-in function is an excellent addition to the database. …it’s addicting! WebTMS Outlook add-in allows me to save time and reduce the amount lingering emails in my inbox. With a few clicks my emails and attachments are immediately sent to individual records within the trademark database without having to login. Korto LyonsTrademark & Domain 