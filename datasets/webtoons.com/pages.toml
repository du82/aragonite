description = "Edele Lancaster is the perfect noble lady who has been groomed for the job. But when her husband whom she married reluctantly commits treason, she is branded a traitor and becomes a slave. Distraught, she tries to kill herself to preserve honor as a noble lady, but her new master, Count Laslo Krissus prevents her from doing so. Will Edele be able to find freedom and happiness in her new life as Count Krissus’ maid?"
full_description = ". . . . . . . . . . . . . . MON TUE WED THU FRI SAT SUN MON MORE MON WEBTOONS Duchess in Ruins like621,103 Romance Duchess in Ruins Candlebambi / Saedle Edele Lancaster is the perfect noble lady who has been groomed for the job. But when her husband whom she married reluctantly commits treason, she is branded a traitor and becomes a slave. Distraught, she tries to kill herself to preserve honor as a noble lady, but her new master, Count Laslo Krissus prevents her from doing so. Will Edele be able to find freedom and happiness in her new life as Count Krissus’ maid? The Reborn Young Lord is an Assassin like1.7M Fantasy The Reborn Young Lord is an Assassin swingbat / CoffeeLime Cyan Vert, illegitimate son of the Duke and the empire's greatest assassin, is betrayed by the righteous brother whose shadow he's always lived in. But just before the fatal blow strikes his throat, Cyan awakes to find he's just a boy again. The young lord has been reborn, and this time, he's not going to live in anyone's shadow! A Savage Proposal like405,678 Romance A Savage Proposal Lee yuna / team IRUKA When the ruthless Lord Tiwakan seizes the kingdom of Nauk, Princess Liene Arsac faces an impossible choice: marry her captor or watch her homeland crumble. But Lord Tiwakan isn’t just after power; he desires Liene, and his devotion stirs a mix of fear and undeniable attraction within her. With her former betrothed, Lafitte, still missing, Liene must decide whether to trust Tiwakan's promises or hold out hope for a rescue. As dangerous secrets come to light, Liene’s decision could change the fate of Nauk—and her own heart—forever. I’m the Queen in This Life The Etruscan Kingdom is stained with blood when the king’s illegitimate son Cesare conspires with his fiancée Ariadne to usurp the throne from his half-brother Alfonso. Despite Ariadne’s devotion to the new king, her faith is shattered when she is betrayed by him and eventually murdered by her own sister, who wishes to be queen. To her surprise, Ariadne finds herself sent back in time to her 17-year-old self. As she navigates the perils and opportunities of palace intrigue, Ariadne must make the most of her guile and grit to ensure that her tragic future does not repeat itself. like8.5M Fantasy I’m the Queen in This Life Themis / Omin The Etruscan Kingdom is stained with blood when the king’s illegitimate son Cesare conspires with his fiancée Ariadne to usurp the throne from his half-brother Alfonso. Despite Ariadne’s devotion to the new king, her faith is shattered when she is betrayed by him and eventually murdered by her own sister, who wishes to be queen. To her surprise, Ariadne finds herself sent back in time to her 17-year-old self. As she navigates the perils and opportunities of palace intrigue, Ariadne must make the most of her guile and grit to ensure that her tragic future does not repeat itself. I Grabbed the Leash of the Blind Beast like355,126 Romance I Grabbed the Leash of the Blind Beast The greedy gatsby / PPANG When an average twenty-something wakes up in the battered body of a nameless extra from a romance novel, all she wants is to go home. But first, she’ll have to see the story through as Rona, the maid of Grand Duke Ileon, the novel’s hero who was blinded by poison. She just has to make sure the heroine restores his sight with a special flower so they can have their happy ending -- easy enough, right? With a plot gone awry, Rona’s dangerous past, and the grand duke’s affections, can Rona stick to the story? The Perfect Contract like580,880 Romance The Perfect Contract TTUSOL / TAEZA Junwon, a perfect man, and Ju-i, a woman who knows her abilities and charms, strike an unusual deal: they will date with one strict condition—no falling in love. What starts as a simple arrangement soon becomes complicated as unexpected feelings begin to surface. Can they stick to their promise, or will emotions get the better of them? Dive into a world where love is both the goal and the enemy, and find out if their hearts will follow the rules or break free. Hidden Class Gravity User like546,542 Fantasy Hidden Class Gravity User Nekoko / Chikuwa “Who needs a bandit, anyway?” That’s the last thing Ikoma Ichinose, a bandit-class hunter, heard before he got kicked out of his party and ran into a monster that would kill him. But he was given a second chance at life in the form of a time-turning pocket watch. “Yeah, who needs a bandit?” This time, Ikoma chooses to be a gravity master to have a shot at becoming the greatest hunter of all time. You Can’t Kill Me: The Secret Bride of the Black Wolf like553,772 Romance You Can’t Kill Me: The Secret Bride of the Black Wolf HAEMIN / Kingkang Yeonwu Chae, a talented yet lonely composer from Korea, finds herself and her family trapped in the underworld after a car crash. In her first life, she marries Hyojo, who ultimately kills her. In her second life, she takes revenge by taking her own life in front of him. But despite her desperate wish for an end, she’s given another chance at life. However, this time, instead of encountering Hyojo, she is discovered by Hwita, a mysterious man with a black wolf as his guardian spirit. Can Yeonwu break the cycle and find true safety in this treacherous underworld? Tower of God like64.2M Fantasy Tower of God SIU What do you desire? Money and wealth? Honor and pride? Authority and power? Revenge? Or something that transcends them all? Whatever you desire—it's here. The Mafia Nanny like8.1M Romance The Mafia Nanny sh00 / Violet Matter Being an Elite Nanny is simple: protect the charge, obey the principle, and don’t get emotionally attached. Easier said than done when Davina’s first client is a dangerously compelling Venetian underboss who’s determined to get under her skin. What he wants from her, she can’t imagine, but Gabriel Angelini drags her back into the glittering world of organized crime she thought she’d left behind forever. She might get answers about her past if she digs deep enough, but can she protect Mikey from his father’s ambitions and keep her heart from getting tangled up in their treacherous web? Down To Earth like25.7M HIATUS Romance Down To Earth Pookie Senpai Kade lives his average life alone and undisturbed... until a cute alien girl crashes into his backyard! By opening up his home, will this other worldly girl inadvertently open up his heart? Not Your Typical Reincarnation Story like6.3M Romance Not Your Typical Reincarnation Story Lemon Frog / A-jin Not all villains are evil. When Suna Choi reincarnates as Edith Rigelhof, the villain from her favorite novel, she is determined to change Edith’s life around and treats everyone with kindness. Although she marries the handsome Killian Rudwick, he is madly in love with the original protagonist of the book and mistrusts Edith because she is from a rival family. Will her marriage survive the whirlwind of family feuds, love triangles, and more? Will Edith find her happy ending? Omniscient Reader like35.9M Action Omniscient Reader singNsong / UMI Dokja was an average office worker whose sole interest was reading his favorite web novel 'Three Ways to Survive the Apocalypse.' But when the novel suddenly becomes reality, he is the only person who knows how the world will end. Armed with this realization, Dokja uses his understanding to change the course of the story, and the world, as he knows it. Eleceed like32.6M Action Eleceed Jeho Son / ZHENA Jiwoo is a kind-hearted young man who harnesses the lightning quick reflexes of a cat to secretly make the world a better place – one saved little child or foster pet at a time. Kayden is a secret agent on the run, who finds himself stuck in the body of a…um…decidedly fat old fluffy cat. Together, armed with Jiwoo’s super powers and Kayden’s uber-smarts, they’re out to fight those forces who would let evil rule this world. That is, if they can stand each other long enough to get the job done. The Villainess Just Wants to Live in Peace! like869,003 Romance The Villainess Just Wants to Live in Peace! Graycat / Honaran I quit my terrible job and set off on a trip, only to die in a plane crash! I woke up to find myself reincarnated as Tanasia Breloff, the villainess of a novel I once read. Tanasia was scheming to harm her sister out of jealousy, but I’m not interested in villainy; I’m content being a beautiful, wealthy noblewoman! But wait… don’t I eventually get killed in the novel? I must prevent my death—so I can live the peaceful life I’ve dreamed of! This series contains themes regarding abuse and may not be suitable for all readers. Viewer discretion is advised. The Tyrant Wants to Be Good like6.2M Fantasy The Tyrant Wants to Be Good Ramguel / KAKON Nothing was ever handed to Dorothea Millanaire. No attention, no love, no power. So she decided to take them for herself… with her sword! She accepts her fate when she is executed for being a bloodthirsty tyrant, only to wake up... as a child?! This is her second chance. She must not repeat history. She must be good. Adopted by a Murderous Duke Family After ten years of being exploited by Duke Gerwehr for her healing powers, Agnes meets her death in a dungeon. When she wakes up, she finds herself in her uncle’s house before she was sold to Duke Gerwehr in the slave market. Desperate for her past life not to repeat itself, she lets Duke Rodwick adopt her and starts her new life with a new name, Tuariche Rodwick. Will she be able to keep her healing powers secret in this notorious family of assassins and find true happiness and love in her new life? like2.1M Romance Adopted by a Murderous Duke Family Rogang / URang After ten years of being exploited by Duke Gerwehr for her healing powers, Agnes meets her death in a dungeon. When she wakes up, she finds herself in her uncle’s house before she was sold to Duke Gerwehr in the slave market. Desperate for her past life not to repeat itself, she lets Duke Rodwick adopt her and starts her new life with a new name, Tuariche Rodwick. Will she be able to keep her healing powers secret in this notorious family of assassins and find true happiness and love in her new life? Homesick like9.6M Thriller Homesick Ms. Freaky Rayne woke up with no memories of the apocalypse. Samael is just... a delinquent, who happened to find Rayne at a rooftop. They both ended up making a deal in order to survive in a world where cannibalistic monsters roam. School Bus Graveyard like12.1M HIATUS Thriller School Bus Graveyard Red Ashlyn is a loner in high school with no friends. But when a fateful visit to a haunted house causes her and her classmates to see monsters at night, she'll be forced to forge bonds to survive. Marionetta like5M Fantasy Marionetta Míriam Bonastre Tur A mysterious circus. A missing friend. A dangerous deal. Julia Lazarrett is happy with her honest, predictable life. But when her best friend Kamille convinces her to visit a travelling circus, they both get more than for which they bargained. Thrust into a world full of secrets, magic, and death, Julia finds herself presented with the most horrific of deals in order to survive. Teenage Mercenary like16.3M Action Teenage Mercenary YC / Rakyeon At the age of eight, Ijin Yu lost his parents in a plane crash and became stranded in a foreign land, forced to become a child mercenary in order to stay alive. He returns home ten years later to be reunited with his family in Korea, where food and shelter are plenty and everything seems peaceful. But Ijin will soon learn that life as a teenager is a whole other feat of survival. With only one year of high school left, Ijin must master new tactics to maneuver his way around the schoolhouse battleground. Can he survive a year of high school? Or rather, will the school be able to survive him? The Dragon King’s Bride like4.8M Romance The Dragon King’s Bride SOY MEDIA / Kanghee Jamae Ten years ago, a young girl saved the life of a dragon. Little did they know that they would be brought together again by the vicissitudes of fate, when Lucina’s family estate is invaded by the fearsome Tayar nation led by King Hakan. After Lucina’s selfish stepmother offers her up as a bride to Hakan in exchange for their lives, Lucina realizes that she is now fated to journey to the arid kingdom of Tayar and marry its seemingly brutish king. Will fate lead the unlikely pair to ruin or romance? The Price Is Your Everything like2.1M Drama The Price Is Your Everything Gones / Haco Transported back to her first academy days, Nerys Truydd revisits a life marred by betrayal and torment. Exploited and poisoned by her own family and husband, her demise was met with a vow to curse those who wronged her. Now granted a second chance, Nerys vows to rewrite her fate. As she navigates her past, memories of those who hurt her flood back. Determined and fueled by retribution, she seeks to reclaim all she lost. Can she overturn her tragic past and emerge victorious from the shadows of her betrayal? Lock Me Up, Duke! When doomed to get the bad ending, everyone would try to avoid it no matter what, right? But, that’s not the case for A-Min Kim. Reborn as Jayna Blake, the main character of her favorite game: “How to Fall in Love with the Obsessed Man”, A-min Kim is determined to get the locked up ending. Free food, limitless sleep, and no need to work! Who’d refuse that? At least, not Jayna! like184,534 Romance Lock Me Up, Duke! Kisai Entertainment / ⓒGLEE CAT When doomed to get the bad ending, everyone would try to avoid it no matter what, right? But, that’s not the case for A-Min Kim. Reborn as Jayna Blake, the main character of her favorite game: “How to Fall in Love with the Obsessed Man”, A-min Kim is determined to get the locked up ending. Free food, limitless sleep, and no need to work! Who’d refuse that? At least, not Jayna! Trapped in a Soap Opera like1.1M Drama Trapped in a Soap Opera Ganno / Apricot.K After a life of hardship as an orphan, Jia Han finally achieves the dream of homeownership... only to have her moment of jubilation cruelly cut short. While indulging in her guilty pleasure--a riveting soap opera--she experiences a sudden, piercing chest pain and meets an untimely demise. But when she wakes up, she finds herself not in the afterlife, but within the very drama she was watching and as none other than its villainess! In a realm where a glance sparks a scandal and a step triggers a landmine of emotions, what fate lies ahead for Jia? Behind Her Highness’s Smile like827,620 Drama Behind Her Highness’s Smile Studio wooridle / Amid When the king offers Aerik Cladinae his own sister's hand in marriage for his meritorious deeds in battle, he didn't expect to get saddled with a limping, drooling woman like Miesa Esquillre. Driven insane by her brother's physical and psychological torture, Miesa rolls around on the ground, spills food all over herself, and screams unintelligebly as a way of communicating. But sometimes, Aerik catches a flash of shrewd understand"
