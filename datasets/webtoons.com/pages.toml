full_description = "WEBTOON VIDEO CONTEST 2025 Show us your love for a chance to win a share of $200,000 in prizes! HOW IT WORKS TOOLKIT OFFICIAL RULES FAQ SUBMIT NOW How it Works step 1Select a series or stories you love Do you have a favorite series you can’t stop thinking about? Are you a fan of WEBTOON or a new reader getting to know webcomics? Create a video about these select WEBTOON ORIGINAL series! Or you can simply make a video about your passion for WEBTOON. Your video must be 59 seconds or less. If you need help, check out our TOOLKIT. step 2Create a video Pick a category that will best showcase your creativity and love for WEBTOON. Tell the world about the story (or stories) you’re obsessed with in the most entertaining way! Live Action Get in character and act out your favorite scenes! Animation Bring a character to life via rigging, 2D, 3D and more! Original Music Write an original song that speaks to a series or about your love for WEBTOON! Explainer/Recommendation Recommend YOUR favorite series! Explain the plot or share your favorite tropes! Reactions Pick a series you’ve never read and show us how it makes you feel as you read! Wild Card Not sure where your video falls into? This is your category! step 3Post on your TikTok or YouTube Shorts Post your video on your TikTok or YouTube Shorts account. Make sure to tag @webtoonofficial and add #WEBTOONVideoContest & #WEBTOON and the hashtag of the eligible ORIGINAL Series’ title featured, in your caption or video description. *Your account must be public step 4Submit your video! Head over to the submission page . Grab your video URL and submit under a category that best fits your content. You have until April 14, 2025 11:59pm PT to submit your entry. We can’t wait to see what you come up with! submit now winnersPRIZE POOL This is your chance of winning a share of $200,000 in prizes! GRAND PRIZE $30,000 1 winner from any category DIAMOND $10,000 Up to 3 winners from Live Action, Animation, or Original Music categories PLATINUM $5,000 Up to 3 winners from Explainer/Recommendation, Reaction, or Wild Card categories GOLD $1,000 Up to 10 winners from Live Action, Animation, or Original Music categories SILVER $500 Up to 10 winners from Explainer/Recommendation, Reaction, or Wild Card categories BRONZE $100 Up to 100 winners from any category COINS 100 Free Coins 10,000 winners from any category This Contest is in no way sponsored, endorsed or administered by, or associated with Apple Inc. or Google LLC. NO PURCHASE NECESSARY. Contest ends: 4/14/25. Minors must have parental consent. Eligibility & other restrictions apply. Rules."
