["https://webtv.univ-lille.fr/grp/673/recherche-en-education-2023-2024-cycle-de-conferences-inspe"]
title = "Collection » Recherche en éducation 2023-2024 / Cycle de conférences INSPÉ - WebTV Université de Lille"
description = """
Collection « Recherche en éducation 2023-2024 / Cycle de conférences INSPÉ »
\t\t\t\t\t\t\t\tL’INSPÉ Lille HdF organise chaque année un cycle de conférences sur des questions vives de la recherche en éducation. Les thématiques abordées sont déterminées en fonction de l’actualité. Elles peuvent aussi être liées à des sollicitations de nos partenaires scientifiques, académiques, institutionnels, de terrain ou des acteurs de la recherche de l’Institut. Suivies par les étudiants car intégrées à leur formation, ces conférences sont également ouvertes au grand public. Elles réunissent ainsi, aussi bien dans leur conception que dans leur animation et réception, des équipes pluri catégorielles. L’Institut soutient par ailleurs de nombreux évènements de recherches en éducation (conférences, colloques, journées d’études, etc.) à la demande de partenaires scientifiques, académiques, institutionnels ou de terrain."""
