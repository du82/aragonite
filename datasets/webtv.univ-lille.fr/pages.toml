["https://webtv.univ-lille.fr/grp/692/episteme-cycle-attirer-recruter-fideliser-regards-croises-dans-un-monde-en-transition"]
title = "Collection » Epistémè - Cycle 3 : Attirer, recruter, fidéliser : Regards croisés dans un monde en transition - WebTV Université de Lille"
description = """
Collection « Epistémè - Cycle 3 : Attirer, recruter, fidéliser : Regards croisés dans un monde en transition »
\t\t\t\t\t\t\t\tLes défis à relever sont nombreux pour faire face aux profondes mutations de la société et aux enjeux climatiques. Pour aller vers une transition juste et équitable avec l’objectif d’une économie à faible émission de carbone, l’enjeu est de taille. Organisations privées, associatives et publiques doivent repenser leur stratégie globale, leur mode d’organisation et l’attractivité des missions proposées dans un contexte de pénurie de main d’œuvre et de modification du rapport au travail.Différentes enquêtes, recherches scientifiques et études révèlent l’existence de formes de « rejet » de certaines réalités du travail. Ce qui se traduit par des bifurcations parfois radicales dans des projets professionnels, des burn-out, des bore-out, des départs d’entreprises…Les actifs ont des exigences plus marquées quant à leurs aspirations et perspectives professionnelles :
•    le sens et l'engagement des entreprises en matière sociale et environnementale•    l’égalité et la lutte contre les discriminations•    un meilleur équilibre entre la vie professionnelle et la vie personnelle
Face à ces constats, comment attirer les talents vers les métiers en tension, vers les métiers de demain, vers les secteurs professionnels à fort enjeux, vers les territoires où se situent les offres d’emploi ? Comment impliquer et accompagner les collaborateurs dans les entreprises ?Telles sont les questions auxquelles tentera de répondre ce troisième cycle du programme Epistémè au travers de regards croisés émanant de la recherche universitaire et de l’expérience des acteurs socio-économiques."""
