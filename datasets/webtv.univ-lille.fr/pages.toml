description = """
Collection « Eurohaptics 2024 »
\t\t\t\t\t\t\t\tJoin us in Lille, France for Eurohaptics 2024, where the world’s leading minds in haptics converge to explore the latest in tactile and haptic technologies. Experience cutting-edge research, engaging discussions, and innovative demonstrations that showcase the diverse applications of haptics.We are excited to announce that this year, we are organizing a dedicated “Art/Design” track, providing a unique opportunity to explore the intersection of haptics with creativity and design. Furthermore, we are committed to strengthening our ties with industrial partners. Eurohaptics 2024 will feature job dating sessions and an industry forum, facilitating meaningful connections between academia and industry, and fostering collaborative opportunities that drive haptic technology forward.As capital of Flanders, Lille’s rich cultural heritage provides a picturesque backdrop to our conference, offering a perfect blend of intellectual exchange and cultural immersion.We extend our gratitude to sponsors, speakers, and attendees for making this event possible. Let’s collectively advance haptics research and shape the future of human-computer interaction."""
