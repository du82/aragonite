["https://webtv.univ-lille.fr/grp/608/piav-droit-de-la-photographie-des-images-et-des-artefacts-visuels-saisi-par-la-revolution-numerique"]
title = "Collection » D-PIAV (Droit de la Photographie, des Images et des Artefacts Visuels saisi par la révolution numérique) - WebTV Université de Lille"
description = """
Collection « D-PIAV (Droit de la Photographie, des Images et des Artefacts Visuels saisi par la révolution numérique) »
\t\t\t\t\t\t\t\tCette série offre une porte d’entrée sur le droit des images et de la photographie ; à chaque fois, vous est présenté en quelques minutes un résumé des controverses, litiges ou contentieux juridiques suscités par des supports visuels bien divers.
Elle s’appuie en particulier sur le site « Une histoire litigieuse et contentieuse de l'image et de la photographie », disponible à l’adresse d-piav.huma-num.fr. Y sont montrées des images et photographies qui « ont fait droit », lesquelles sont accompagnées d’analyses et commentaires juridiques rédigés par les membres du CRDP (Centre de Recherche Droits et Perspectives du Droit) dans les domaines les plus variés : droit d’auteur, droit pénal, droit des personnes, droit des biens, droit public, droit de la presse…
Ce projet, intitulé Le Droit de la Photographie, des Images et des Artefacts Visuels saisi par la révolution numérique (D-PIAV), développé par le Centre de Recherche Droits et Perspectives du Droit (CRDP – ULR 4487), hébergé au sein de la Faculté des sciences juridiques politiques et sociales de l’Université de Lille, soutenue par le CPER MAuVE (Contrat de Plan État-Région - Médiations visuelles : culture numérique et création) en partenariat avec la région Hauts-de-France et la MESHS (Maison Européenne des Sciences de l'Homme et de la Société), est portée par Jean-Christophe Duhamel, qui en assume également la codirection scientifique avec Michel Dupuis.
Bienvenue dans le projet D-PIAV"""
