["https://webtv.univ-lille.fr/video/10933/ma-these-en-180-secondes-medecine-personnalisee-en-hemato-oncologie-representations-et-attitudes-projet-mephora"]
title = "Ma thèse en 180 secondes / Médecine personnalisée en hémato-oncologie : représentations et attitudes (projet MEPHORA) - WebTV Université de Lille"
description = '''
<p style="text-align: justify;">32 doctorants ont particip&eacute; &agrave; l&rsquo;une des trois sessions de formation qui se sont d&eacute;roul&eacute;s. Les pr&eacute;s&eacute;lections ont eu lieu le mardi 3 mars de 13h &agrave; 17h30 &agrave; l&rsquo;Universit&eacute; de Lille campus Pont de bois-Villeneuve d&rsquo;Ascq.</p>
