\t\t\t\t\t\t\t\tJournées d’étude AVENIR(S) - « Accompagner l’approche par compétences dans l’ESR : pour quels enjeux et avec quels repères ? » Pour ses premières journées d’études, organisées à l’Université de Lille, le volet AVENIR(s) ESR peut compter sur la présence de personnalités scientifiques reconnues dans les domaines de l’approche par compétences (APC) et de l’approche programme : Christelle LISON, Benoit ESCRIG, Catherine LOISY et Aurélie DUPRE. L’APC est une méthode largement promue dans les discours politiques et institutionnels au sein de l’enseignement supérieur français (ESR). Les différentes communautés universitaires (comprenant les enseignants, les conseillers et ingénieurs pédagogiques, les responsables de formations, les formateurs, les tuteurs, les chercheurs, les décideurs politiques et les étudiants) s’engagent progressivement dans ce mouvement de transformation pédagogique, chacune poursuivant ses propres objectifs. Parmi les diverses approches, la méthodologie du Labset offre un cadre structurant pour aller au-delà de la simple présentation d’un référentiel de compétences. Elle permet d’intervenir sur les pratiques pédagogiques afin de soutenir le développement des compétences attendues par les apprenants. Au niveau national, dans le cadre du programme AVENIR(s) France 2030, nous constatons que les mises en œuvre concrètes de l’évaluation des compétences dans une démarche APC restent encore rares. La démarche est délicate, et les risques de s’égarer dans des orientations contradictoires sont nombreux. Cependant, certaines initiatives se révèlent très prometteuses et stimulent les réflexions au sein des communautés universitaires. Ces premières journées d’études AVENIR(s) ESR, proposent de discuter de repères permettant de soutenir l’avancée des communautés dans l’appropriation de la démarche APC"""
