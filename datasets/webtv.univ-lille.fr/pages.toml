description = """
Collection « 7èmes Journées Spécialisées de Natation - L’enfant et l’eau : Apprendre à nager. Apprendre à s’entrainer. »
\t\t\t\t\t\t\t\tOrganisée par la FSSEP (Faculté des sciences du sport et de l’éducation physique) de l’Université de Lille et la ville de Saint-Amand-Les-Eaux.Les 7èmes Journées Spécialisées de Natation seront axées sur la thématique de l’enfant et l’eau, dans les domaines de l’éducation au savoir nager (mercredi) et de l’entrainement du jeune nageur et nageuse (jeudi).8 conférences, 1 table ronde et des présentations d’expérience éducatives et d’entraînement chez le/la jeune constitueront le programme pluridisciplinaire de ces deux journées.Ces journées spécialisées (toutes organisées par l’Université de Lille ou ex-Lille2 depuis 1994) sont l’occasion de rencontres, d’échanges entre acteurs issus d’univers parfois différents mais qui partagent une passion commune.C’est ainsi que vont se côtoyer durant cet événement, d’éminents spécialistes, des enseignants, des enseignants-chercheurs, des éducateurs, des étudiants, des responsables politiques, des personnes de la société́ civile autour de la thématique."""
