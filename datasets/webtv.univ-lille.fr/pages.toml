title = "WebTV Université de Lille -"
description = "La physique classique distingue deux objets : les particules, discrets en nombre et en position, et les ondes, continues sous ces deux termes. Au début du XXe siècle, les physiciens mettent en évidence que les photons et les électrons se comportent parfois comme des ondes, parfois comme des particules. Deux théories permettent alors de rendre compte de ces propriétés : la mécanique ondulatoire (Einstein, Schrödinger) et la mécanique quantique (Bohr, Heisenberg). Si leurs développements mathématiques, initialement différents, purent être unifiés, leurs bases épistémologiques diffèrent : la mécanique quantique est une interprétation qui fixe son domaine de validité par un principe d’incertitude probabiliste, la mécanique ondulatoire refuse cette position, adopte un point de vue réaliste, conjecture qu’il existe une réalité matérielle encore inaccessible. En 1935, Einstein, Podolsky et Rosen croient pouvoir réfuter l’interprétation probabiliste au moyen d’une expérience de pensée « le paradoxe EPR ». En 1964, Bell fournit un test numérique, des inégalités, permettant de choisir entre les deux positions. En 1983, en faisant interagir deux photons, nous avons pu, par la mesure, invalider la vision réaliste locale. Deux photons ayant interagi se comportent comme un système quantique unique : c’est l’intrication. Au dualisme de la physique classique succède le monisme quantique : il décrit de manière identique matière et lumière."
full_description = '''Les directs Regards croisés sur la valorisation et la médiation scientifique dans les entreprises et universités28 février 2025 09:00 01:55:23 À l’échelle des photons, l’intrication quantique La physique classique distingue deux objets : les particules, discrets en nombre et en position, et les ondes, continues sous ces deux termes. Au début du XXe siècle, les physiciens mettent en évidence que les photons et les électrons se comportent parfois comme des ondes, parfois comme des particules. Deux théories permettent alors de rendre compte de ces propriétés : la mécanique ondulatoire (Einstein, Schrödinger) et la mécanique quantique (Bohr, Heisenberg). Si leurs développements mathématiques, initialement différents, purent être unifiés, leurs bases épistémologiques diffèrent : la mécanique quantique est une interprétation qui fixe son domaine de validité par un principe d’incertitude probabiliste, la mécanique ondulatoire refuse cette position, adopte un point de vue réaliste, conjecture qu’il existe une réalité matérielle encore inaccessible. En 1935, Einstein, Podolsky et Rosen croient pouvoir réfuter l’interprétation probabiliste au moyen d’une expérience de pensée « le paradoxe EPR ». En 1964, Bell fournit un test numérique, des inégalités, permettant de choisir entre les deux positions. En 1983, en faisant interagir deux photons, nous avons pu, par la mesure, invalider la vision réaliste locale. Deux photons ayant interagi se comportent comme un système quantique unique : c’est l’intrication. Au dualisme de la physique classique succède le monisme quantique : il décrit de manière identique matière et lumière. Rencontre, échange, débat - Direction CultureL’Esprit d’ArchimèdeL’Esprit d’Archimède - Cycle « Infini(s) » 05:38 Le devenir des diplômés de l’Université de Lille – Enquête 2023-2024 Enquête 18 mois après le diplôme (Promotion 2022). Études de l’Observatoire de la Direction des Formations (ODiF) Le devenir des diplômés de l’Université de Lille 01:55:14 Quelles œuvres pour la littérature sourde ? Après avoir évoqué la littérature générale, Juliette Dalle nous dressera un panel de la littérature sourde existante. À travers des exemples précis d’Art sourd, elle s’interrogera sur la forme de la littérature signée, ses supports, les mouvements existants et les procédés littéraires propres aux langues signées. Modérateurs : Damien Ducasse, Enseignant, Université de Lille. Thibaut Dalle, Enseignant, Université de Lille. Interprètes : Anaïs Lescroart Dalle, Interprète français/ LSF (Langue des signes française), Agence Via. Frédéric Poivre, Interprète français/LSF (Langue des signes française), Agence Via. - Page Facebook: Etudiants Interprètes français/LSF – Lille - Blog des étudiants: Etudiants LSF – Lille Conférences Culture SourdeL’accès à l’information chez les Sourds 01:33:02 Heurs et malheurs de la mémoire en politique Le champ n’est pas ici celui de l’histoire qui confère à la mémoire bien des responsabilités dont celle des leçons du passé et celle de l’entretien des grandes traditions. En politique le regard va d’abord vers les acteurs et leurs rapports aux autres acteurs, compagnons ou adversaires : oublis, fidélités, ingratitude et rancœurs. Les grandes biographies révèlent l’intensité de ce registre dans la vie politique. La politique soigne souvent la mémoire par la commémoration voire la célébration et se charge aussi de favoriser l’oubli et parfois froisse la réalité de la mémoire en entretenant quelques légendes ou exagérations. Les souverains et présidents ont la maîtrise des grandes cérémonies toujours manière vaporeuse de parler d’eux. La mémoire contribue aussi à expliquer des aspects importants des choix politiques des familles partisanes ou des responsables : le regard sur le référendum, sur le parlement, sur les élites ou la conception de l’exercice du pouvoir. La Cinquième est ici un formidable terrain de jeux pour l’observateur. En conclusion ou peut-être en introduction, un coup d’œil rapide sur un genre littéraire singulier, celui de la rédaction des « mémoires » chargées de contribuer à écrire l’histoire. En partenariat avec la Société des sciences, de l’agriculture et des arts de Lille (SSAAL) Rencontre, échange, débat - Direction Culture 31:31 Retex sur la mise en place de campagnes de phishing pédagogiques La majeure partie des attaques commence par l’exploitation d’un compte utilisateur piraté. Comment faire en sorte de sensibiliser et d’entrainer nos utilisateurs à détecter des phishings de plus en plus élaborés ? Min2Rien : 10ème édition de la journée SECU 05:29 Sous la pluie, faut-il marcher ou courir pour être moins mouillé ? Kezako, la série documentaire qui répond à vos questions de science, aborde cette fois-ci la question « Sous la pluie, faut-il marcher ou courir pour être moins mouillé ? » KEZAKO 03:29 #etudiant – Faculté des Humanités – Farah Touchi Farah Touchi a effectué son stage au lycée Sacré-Cœur de Tourcoing lors de sa Licence 3 de Philosophie. Son stage lui a appris à adapter des savoirs philosophiques à un public lycéen, mais lui a permis également d’affiner ses choix d’orientation pour la poursuite d’études en Master. Plus d’informations sur la licence Philosophie : https://humanites.univ-lille.fr/philosophie/offre-de-formation/licences-philosophie-philosophie-sociologie Lilagora - Étudiants 03:00 L’IUF ? Késako ? L’Institut universitaire de France (IUF) regroupe un ensemble d’enseignants-chercheurs appelés membres, sélectionnés pour 5 ans par un jury international pour la qualité de leurs recherches. 200 nouveaux membres sont nommés annuellement (Juniors et Seniors) afin de bénéficier d’une décharge horaire et d’un financement pour se consacrer pleinement à leurs travaux de recherche. Vous hésitez à candidater ? Ce motion design explicatif vous propose de tout comprendre sur l’IUF en quelques minutes (avantages, chaires ouvertes au concours, etc…) IUF : À la découverte de nos lauréats 01:21:43 Le campus Pont-de-Bois, architecture et art À l’occasion des 50 ans du campus Pont-de-Bois et à l’approche des Journées nationales de l’architecture Cette table ronde revient sur l’implantation du campus Pont-de-Bois, créé dans le contexte de création de la ville nouvelle de Villeneuve-d’Ascq, qui accueille ses premiers étudiants il y a tout juste 50 ans, le 18 octobre 1974. Elle s’attachera plus particulièrement à rappeler qui était son architecte, Pierre Vago (1910-2002), son projet initial et son aboutissement en 1974. Elle décrira la cohérence et les particularités, tant architecturales qu’artistiques, de cet ensemble qui sera finalement la dernière grande œuvre de Pierre Vago. Elle abordera enfin l’évolution du site au fil du temps. De quoi découvrir et renouer avec l’histoire et la philosophie du campus Pont-de-Bois. Rencontre, échange, débat - Direction Culture 02:04:42 Changement climatique : dépasser les idées reçues Dans le cadre de la Fête de la Science 2022, l’Université de Lille vous invite à assister à un débat autour de la publication de l’ouvrage « Tout Comprendre (ou presque) sur le climat » (CNRS éditions, 2022) organisée par Xperium, le 13 octobre à LILLIAD. Puisque la Fête de la Science doit être l’occasion d’un Réveil Climatique, Xperium, vitrine de la recherche en train de se faire, a choisi de valoriser la sortie d’un ouvrage qui permet de dépasser les idées reçues autour du changement climatique. Édité en 2022 à l’initiative de l’Institut national des sciences de l’Univers du CNRS, cet ouvrage est le résultat d’une collaboration fructueuse entre des scientifiques, des communicants et une illustratrice médiatrice scientifique. Il permet de mieux comprendre de façon claire, accessible et étayée quels sont les causes et les enjeux du changement climatique. Fête de la Science 2022 02:42 Recherche participative : l’exemple des projets Boutique des sciences Journée d’échange du 20 septembre 2024 à Lille Boutique des Sciences - Recherche Participative 13:55 Dans la pea