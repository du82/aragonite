title = "Collection » Innov’ember - WebTV Université de Lille"
description = """
Collection « Innov’ember »
\t\t\t\t\t\t\t\tInnov'ember, c’est quoi ?
Chaque mois de novembre, l'Université de Lille organise la semaine annuelle de l’innovation en formation professionnelle portée par la formation continue et alternance. Elle réunit des acteurs de l’université (enseignants-chercheurs, ingénieurs de formation, pédagogiques multimodales, étudiants…) dans les directions et les composantes (facultés, départements, écoles…) et des partenaires (entreprises, collectivités, organismes de formation…).
Durant plusieurs jours, les participants et les intervenants ont l’occasion de :
- Découvrir et comprendre ce que recouvre l’innovation en formation, en éducation, dans les organisations…Comprendre pourquoi nous innovons,- Se connecter avec les personnes qui innovent et celles qui n’innovent pas encore ou hésitent à innover,- Valoriser les compétences, les pratiques innovantes en matière d’accompagnement, d’ingénierie de projet, de formation, pédagogique à destination des publics (étudiants, stagiaires de la formation professionnelle…),- Valoriser ce qui se fait en matière d’innovation à l’université et sur les territoires des Hauts-de-France.
Ainsi, à travers des conférences, des ateliers de découverte, des moments de convivialité, des personnes en recherche d’idées innovantes se rencontrent et échangent entre elles !
Cet événement est organisé par la Formation Continue et Alternance en collaboration avec la Direction d'Appui à la Pédagogie et à l'Innovation et la Direction Développement Durable et Responsabilité Sociale de l'Université de Lille"""
