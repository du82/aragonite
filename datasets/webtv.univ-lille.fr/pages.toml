tale• l’égalité et la lutte contre les discriminations• un meilleur équilibre entre la vie professionnelle et la vie personnelle Face à ces constats, comment attirer les talents vers les métiers en tension, vers les métiers de demain, vers les secteurs professionnels à fort enjeux, vers les territoires où se situent les offres d’emploi ? Comment impliquer et accompagner les collaborateurs dans les entreprises ?Telles sont les questions auxquelles tentera de répondre ce troisième cycle du programme Epistémè au travers de regards croisés émanant de la recherche universitaire et de l’expérience des acteurs socio-économiques. Trier par : Date Titre 01:40:48 06 juin 2024 18:00 Epistémè : Veiller sur ceux qui soignent EpistémèEpistémè - Cycle 3 : Attirer, recruter, fidéliser : Regards croisés dans un monde en transition 01:31:08 21 mars 2024 14:00 Épistémè: Les gigafactories : attractivités des métiers et des... EpistémèEpistémè - Cycle 3 : Attirer, recruter, fidéliser : Regards croisés dans un monde en transition 01:35:44 25 janvier 2024 18:00 Épistémè: Attirer, recruter, fidéliser : Regards croisés dans... EpistémèEpistémè - Cycle 3 : Attirer, recruter, fidéliser : Regards croisés dans un monde en transition $(function(){ $('#tagSortBy').prepend($('#tagSortBy').closest('.dropdown').find('ul li.selected a').html()); });'''
