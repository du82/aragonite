\t\t\t\t\t\t\t\tLa mécompréhension ne se réduit pas à l’incompréhension. Elle ne tient pas seulement à l’absence de sens : lorsqu’on comprend mal, on comprend quand même quelque chose. Pour cette raison, ce qu’on comprend quand on comprend mal ne peut être saisi sous le même régime que la compréhension « simple » du sens visé. En outre, l’expérience nous montre que, même dans ces cas « simples », notre saisie s’avère souvent partielle. La mécompréhension semble dès lors jouer un rôle constitutif de tout sens. Ne faudrait-il pas, par conséquent, dépasser le caractère négatif de la mécompréhension, comprise comme un défaut de compréhension, et la regarder autrement, c’est-à-dire comme une étape essentielle à toute saisie d’un sens ? Dans cette perspective, la 21e Université européenne d’été du réseau OFFRES propose de s’intéresser à la manière dont la mécompréhension produit du sens, en adoptant des approches disciplinaires variées : herméneutique, logique, sciences politiques, littérature, science du langage, psychologie sociale, anthropologie, etc."""
