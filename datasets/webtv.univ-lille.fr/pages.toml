["https://webtv.univ-lille.fr/video/10926/ma-these-en-180-secondes-1er-prix-du-jury-finale-regionale-hauts-de-france-2020"]
title = "Ma thèse en 180 secondes / 1er prix du jury - Finale régionale Hauts-de-France 2020 - WebTV Université de Lille"
description = '''
<p style="text-align: justify;">Le jury de la 7e &eacute;dition du concours &laquo; Ma th&egrave;se en 180 secondes &raquo; (MT180), organis&eacute;e le mardi 15 septembre 2020 au Petit Th&eacute;&acirc;tre de Templeuve-en-P&eacute;v&egrave;le (Nord), a rendu son verdict : le premier prix a &eacute;t&eacute; attribu&eacute; &agrave; No&eacute;mie Chaniaud, doctorante de l&rsquo;UPJV.</p>
<p style="text-align: justify;">Pr&eacute;senter, en trois minutes top chrono et devant un auditoire d&rsquo;experts, un expos&eacute; clair et concis de son projet de th&egrave;se de recherche. Ce d&eacute;fi, douze jeunes chercheurs l&rsquo;ont relev&eacute; lors de la finale Hauts-de-France de &laquo; Ma th&egrave;se en 180 secondes &raquo; (MT180) organis&eacute; &agrave; Templeuve-en-P&eacute;v&egrave;le. Parmi les concurrents, des &eacute;tudiants en Sciences humaines et sociales, en h&eacute;matologie, en sciences&hellip;</p>
<p style="text-align: justify;">Pour d&eacute;partager les douze candidats qui se sont succ&eacute;d&eacute; avec brio au micro, le jury a d&ucirc; &eacute;valuer la prestation de chacun selon des crit&egrave;res pr&eacute;d&eacute;finis : talent d&rsquo;orateur, justesse du ton utilis&eacute;, pr&eacute;sence sur sc&egrave;ne, lien du projet avec l&rsquo;actualit&eacute;, m&eacute;diation scientifique du sujet&hellip; Apr&egrave;s d&eacute;lib&eacute;ration, c&rsquo;est No&eacute;mie Chaniaud, doctorante au sein de l&rsquo;unit&eacute; de recherche CRP-CPO (UR UPJV 7273), qui a remport&eacute; le premier prix.</p>
<p style="text-align: justify;">&laquo; Une belle suprise ! &raquo;</p>
<p style="text-align: justify;">Le concours MT180 est organis&eacute; par le CNRS et la Conf&eacute;rence des pr&eacute;sidents d&rsquo;universit&eacute;. Il offre l&rsquo;opportunit&eacute; aux chercheurs de valoriser leurs comp&eacute;tences, mais les oblige &agrave; donner un c&ocirc;t&eacute; ludique &agrave; leur pr&eacute;sentation. Pour l&rsquo;occasion, No&eacute;mie Chaniaud devait d&eacute;fendre un sujet de th&egrave;se pointu : &laquo; &Eacute;valuation de l&rsquo;utilisabilit&eacute; d&rsquo;un dispositif m&eacute;dical connect&eacute; &agrave; destination du domicile patient dans le cadre de la chirurgie ambulatoire &raquo;. Apr&egrave;s sa prestation, ponctu&eacute;e de traits d&rsquo;humour et de pr&eacute;cisions scientifiques sur l&rsquo;ergonomie des dispositifs m&eacute;dicaux connect&eacute;s et du futur de la sant&eacute;, le jury a tenu &agrave; saluer <em>&laquo; </em>la qualit&eacute; de son intervention, son aptitude &agrave; int&eacute;resser le public et sa pr&eacute;cision dans la m&eacute;diation scientifique. &raquo;</p>
<p style="text-align: justify;"><em><em>&laquo; </em>La vulgarisation est &agrave; mon sens une partie essentielle du m&eacute;tier de chercheur.&nbsp; En 2018, je participais d&eacute;j&agrave; au projet de m&eacute;diation &laquo; C&rsquo;est quoi cette th&egrave;se ? &raquo;, organis&eacute; par le RJCE (R&eacute;seau des Jeunes Chercheurs en Ergonomie). L&rsquo;ann&eacute;e suivante, j&rsquo;ai suivi le parcours &laquo; Sciences en bande dessin&eacute;e &raquo;, avec Ombelliscience Picardie. Et cette ann&eacute;e, &laquo; Ma th&egrave;se en 180 secondes &raquo;, confie la gagnante, qui a mis un point final &agrave; sa th&egrave;se qu&rsquo;elle soutiendra en novembre. Cette victoire est une belle surprise, car le niveau de l&rsquo;ensemble des concurrents &eacute;tait tr&egrave;s &eacute;lev&eacute;. C&rsquo;est la premi&egrave;re fois que je remporte un concours ! Cela me donne confiance pour l&rsquo;avenir.</em><em> &raquo;</em></p>'''
full_description = "Partager Ma thèse en 180 secondes / 1er prix du jury - Finale régionale Hauts-de-France 2020 15 SEPTEMBRE 2020 16:15 | Durée 07:48 | Vues 3,516 Le jury de la 7e édition du concours « Ma thèse en 180 secondes » (MT180), organisée le mardi 15 septembre 2020 au Petit Théâtre de Templeuve-en-Pévèle (Nord), a rendu son verdict : le premier prix a été attribué à Noémie Chaniaud, doctorante de l’UPJV. Présenter, en trois minutes top chrono et devant un auditoire d’experts, un exposé clair et concis de son projet de thèse de recherche. Ce défi, douze jeunes chercheurs l’ont relevé lors de la finale Hauts-de-France de « Ma thèse en 180 secondes » (MT180) organisé à Templeuve-en-Pévèle. Parmi les concurrents, des étudiants en Sciences humaines et sociales, en hématologie, en sciences… Pour départager les douze candidats qui se sont succédé avec brio au micro, le jury a dû évaluer la prestation de chacun selon des critères prédéfinis : talent d’orateur, justesse du ton utilisé, présence sur scène, lien du projet avec l’actualité, médiation scientifique du sujet… Après délibération, c’est Noémie Chaniaud, doctorante au sein de l’unité de recherche CRP-CPO (UR UPJV 7273), qui a remporté le premier prix. « Une belle suprise ! » Le concours MT180 est organisé par le CNRS et la Conférence des présidents d’université. Il offre l’opportunité aux chercheurs de valoriser leurs compétences, mais les oblige à donner un côté ludique à leur présentation. Pour l’occasion, Noémie Chaniaud devait défendre un sujet de thèse pointu : « Évaluation de l’utilisabilité d’un dispositif médical connecté à destination du domicile patient dans le cadre de la chirurgie ambulatoire ». Après sa prestation, ponctuée de traits d’humour et de précisions scientifiques sur l’ergonomie des dispositifs médicaux connectés et du futur de la santé, le jury a tenu à saluer « la qualité de son intervention, son aptitude à intéresser le public et sa précision dans la médiation scientifique. » « La vulgarisation est à mon sens une partie essentielle du métier de chercheur. En 2018, je participais déjà au projet de médiation « C’est quoi cette thèse ? », organisé par le RJCE (Réseau des Jeunes Chercheurs en Ergonomie). L’année suivante, j’ai suivi le parcours « Sciences en bande dessinée », avec Ombelliscience Picardie. Et cette année, « Ma thèse en 180 secondes », confie la gagnante, qui a mis un point final à sa thèse qu’elle soutiendra en novembre. Cette victoire est une belle surprise, car le niveau de l’ensemble des concurrents était très élevé. C’est la première fois que je remporte un concours ! Cela me donne confiance pour l’avenir. » Téléchargements Télécharger Le téléchargement vous est proposé pour une consultation hors ligne. Veuillez respecter le droit à l'image et ne pas déposer cette vidéo sur un autre site. qualité 1080p qualité 480p qualité 720p Liens Collège doctorale Lille Nord de France - Ma thèse en 180 secondes Intervenants Noémie Chaniaud Doctorante de l’Université Picardie Jules Verne. Mots clés chercheur.seconcoursdoctorant.edoctoratjeune chercheur.seMT180performancerecherche scientifiquethèseUniversité de LilleUniversité de Picardievulgarisation scientifique Collection Ma thèse en 180 secondes Ma thèse en 180 secondes - Finale régionale Hauts-de-France 2020"
