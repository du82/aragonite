["https://weebly.com/about"]
title = "Weebly - About Us"
description = "Weebly’s free website builder makes it easy to build a website, blog, or online store. Find customizable designs, domains, and eCommerce tools for any type of business using our website builder."
full_description = "Weebly is a website and eCommerce service founded on the belief that anyone should have the tools to take their business from idea to launch to growth. Whether you're starting an online business from scratch or taking your in-person business online, with Weebly, entrepreneurs can build websites that customers love to visit and shop. Our powerful tools make it easy to build a professional, mobile-optimized site and grow your business with integrated marketing and advanced analytics. We also help you tackle the manual hassles of running a successful online store by simplifying shipping, taxes, and inventory management. Since Weebly is part of Square's commerce offering, Weebly customers can easily sell in-person. With Weebly and Square, your business is always open. Weebly was started in 2007 and currently powers millions of businesses on more than 50 million sites around the world. Weebly is based in San Francisco with offices in New York, Scottsdale, and Toronto. We were acquired by Square in May, 2018. Weebly is eCommerce by Square"
