["https://weitz.de/haw-videos"]
title = "Alle Videos / Edmund Weitz"
full_description = "Beachten Sie die kleinen roten Symbole neben einigen Videos. Das sind Links, die auf korrigierte Fehler hinweisen. Wenn Sie inhaltliche Fehler finden, auf die nicht in den Kommentaren oder in dieser Liste hingewiesen wird, schicken Sie mir bitte eine E-Mail. Danke! Warum gibt es diese Seite �berhaupt? Weil YouTube sich zwar wunderbar f�r die Verbreitung von Schminktipps und Verschw�rungstheorien eignet, aber f�r Lehrvideos wie meine eher nicht die richtige Wahl ist. (Leider kenne ich auch keine Alternative, mit der man �hnlich viele Menschen erreichen kann. So ist das mit den Monopolen …) Die Benutzeroberfl�che f�r diejenigen, die die Videos hochladen, war schon 2017 grausam, aber durch ein Zwangsupdate 2020 ist sie noch gruseliger geworden. Es ist nun nahezu unm�glich geworden, Videos in einer inhaltlich sinnvollen Reihenfolge anzubieten oder sie anderweitig irgendwie zu kuratieren. Diese Seite soll das halbwegs ausgleichen. Idealiter werden Sie nach dem Klick auf einen Link so umgeleitet, dass nach dem Ende des Videos automatisch das inhaltlich n�chste kommt. Aber die Hoffnung, dass das verl�sslich klappt, habe ich inzwischen aufgegeben …"
year_published = 2025
