["https://weitz.de/cl-recipes"]
title = "Common Lisp Recipes"
description = "A treasure trove of practical knowledge for effectively hacking Lisp in the 21st century."
full_description = "A treasure trove of practical knowledge for effectively hacking Lisp in the 21st century. This is your chance to learn from the master! [Luke Gorrie, creator of SLIME] A piece of jewel. Overall, an amazing book and one that must be on your desk if you are a serious Lisp developer. [Rangarajan Krishnamoorthy (full review)] I have been programming in Common Lisp for the last 35 years, but when I went through the new book, I felt like a kid in a candy store, discovering all kinds of new/old patterns that were enlightening to me. [Jans Aasman, president and CEO of Franz Inc.] The optimization chapter is excellent. I'm not aware of any other resource that summarizes all this information and the explanations are clear. This is a great reference. [Arthur Lemmens, organizer of the ECLM] This is a reference book of advanced CL techniques, but I've read it cover to cover, and learned a lot from it, even though I've been using Lisp for more than a decade. [Peter Salvi] Weitz writes with clarity and concision, and has produced a book which can be read in one sitting or dipped into at leisure and will extend the practice of even seasoned Common Lisp professionals. [Christophe Rhodes, SBCL maintainer]"
year_published = 2025
