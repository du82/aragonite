full_description = "Byline Byline is the WELL’s conference for freelance non-fiction writers. Whether you write for newspapers and magazines, websites, or corporate clients, we invite you to join our conversations about research, writing, marketing, practical business issues, what you’re working on right now, who you’ll never work for again, how to beat procrastination, what to do with your time off, and much, much more. You should also visit The WELL’s Inkwell.vue conference, dedicated to conversations between authors and book readers. Hosted by: Mary Elizabeth Williams <marybeth> Shortcut: g byline"
