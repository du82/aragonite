["https://www.well.com/conferences/inkwell-2"]
title = "Inkwell.vue < The WELL"
full_description = "NOW in the Inkwell Miriam Zellnik: The Vaudeville Murders: A Libby Seale Mystery, starts Feb 11, 2025 We’re delighted that our featured author is Well member Miriam Zellnik as our guest in the Inkwell conference for the next two weeks, discussing her new book “The Vaudeville Murders: A Libby Seale Mystery“, which she co-wrote with her brother, Joe. Libby Seale – a recent transplant from New York’s Lower East Side – enjoys the glamor and the bustle of her work as a seamstress at Crowther’s Portland Variety. That is, until the murder of her friend Vera Carabella, a magician’s assistant, reveals a darkness at the heart of her new home town. Now available through Amazon: https://www.amazon.com/Vaudeville-Murders-Libby-Mystery-Mysteries/dp/B0DT2D1F8J JOIN the live conversation ———————————————————————- If you have a comment or question, send via email to inkwell at well.com. To read all previous Inkwell interviews, go Here. —————————————————————— Recently in the Inkwell Lee Felsenstein – Me and My Big Ideas: Counterculture, Social Media, and the Future, Jan 27 – Feb 10, 2025 Lee Felsenstein joins Inkwell.vue to discuss his autobiography, Me and My Big Ideas: Counterculture, Social Media, and the Future, self-published in 2024 under his imprint FelsenSigns (<www.FelsenSigns.com>). As the third person to receive an account on The WELL, Lee played a pivotal role in the computer revolution, not just as an innovative engineer but also as a keen observer of the societal dynamics it shaped. His book goes beyond a personal memoir, offering a rich exploration of the intersection between technology, sociopolitical reform, and computer-assisted communication, spanning from the Free Speech Movement to the rise of modern social media. VISIT the archived conversation State of the News 2025, beginning January 9, 2025 As we step into 2025, the landscape of news reporting is undergoing significant transformation, shaped by advancements in technology, shifting audience behaviors, and evolving economic models. Our latest Inkwell discussion delves into the current state of journalism, featuring a panel of esteemed journalists: Dan Gillmor, Wendy Grossman, Jamis Mara, John McAlpin, Peter Richardson, John Schwartz, Ben Shapiro, and Paula Span. The discussion is skillfully moderated by Emily Gertz. Join us to explore the challenges and opportunities shaping the future of journalism. VISIT the archived conversation State of the World 2025, December 26 – January 14, 2025 Welcome to this year’s “State of the World” conversation, once again hosted on the pioneering online community platform, The WELL. As The WELL approaches its 40th anniversary in 2025, we celebrate the 25th annual discussion about global trends and insights, featuring the renowned author, journalist, design visionary, and world traveler Bruce Sterling, alongside me, Jon Lebkowsky. I’m a co-host at the Plutopia News Network and have had the privilege of hosting several conferences on The WELL, including this one, Inkwell.vue. Over the years, I’ve worn many hats as a writer, editor, net activist, web strategist, and futurologist, and I’m psyched to continue this tradition of exploring the State of the World. VISIT the archived conversation Election 2024 Pop-Up, beginning November 4, 2024 Election Night and the weeks that follow are going to be both tense and intense. Looking for community and (reasonably calm) conversation to help you cope? You’ll find it at Inkwell’s Election 2024 Pop-Up! The conversation will be led by KALW radio host and WELL member Angie Coiro <coiro>, and feature some of the WELL‘s most avid and well-informed politics nerds, including Larry Person <lperson>, Jennifer Powell <jnfr>, Jon Lebkowsky <jonl> and instigator/organizer/journalist Emily Gertz <emilyg>. It will be a haven where WELL members as well as the public can follow, analyze, worry over and even, possibly, celebrate the 2024 election and its results. VISIT the archived conversation Jonathan Lethem: Brooklyn Crime Novel, September 9 – October 1, 2024 We’re honored to have author Jonathan Lethem as our guest in the WELL’s public Inkwell.vue conference discussing his life and work, especially his latest, Brooklyn Crime Novel, winner of the New York City Book Award. Jonathan is the author of thirteen novels; his work has been translated into over thirty languages. Please join us! VISIT the archived conversation —————————————————————— Visit the rest of the topics: g inkwell.vue The books and commentary we’ve spotlighted over the years run the gamut from timely political commentary, to noteworthy blogs, to gardening and cooking books, to parenting issues, to the social implications of new technologies. We’ve delved into the evolution of online culture and communications technologies, and we’ve explored improvisational and collaborative branches of music history. Who can say what we’ll talk about next? Previous Discussions The State of the World 2025 The State of the World 2024 The State of the World 2023 The State of the World 2022The State of the World 2021 The State of the World 2020The State of the World 2019The State of the World 2018Virginia Eubanks: Automating InequalityRoger McNamee: Brain Hacking For DummiesEllen Ullman: Life in CodeJulie Rehmeyer: Through the Shadowlands Hosted by: Jon Lebkowsky (jonl), Emily Gertz (emilyg), David Gans (tnf), and Alan Chamberlain (axon) Host emerita: Julie Sherman <julieswn>"
