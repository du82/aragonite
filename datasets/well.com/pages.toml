["https://www.well.com/conferences/media"]
title = "Media < The WELL"
full_description = "Media The media conference discusses all aspects of print and electronic journalism, with special emphasis on the legal and ethical problems facing practitioners of same. It is a place for gossip, praise, war stories, debate and support. It’s also a place where media professionals encounter their readers, with amusing and occasionally testy interchanges trying the patience of typists and lurkers alike. After a brief period of conflict, however, all is peaceful, and the two sides share caffeine and sugar. Our motto since the beginning has been: “If you don’t like the news, go out and make some of your own.” — Scoop Nisker Hosted by: Paul Belserene (paulbel), Angie Coiro (coiro), Betsy Humphrey (potterygirl), Jon Lebkowski (jonl), and on sabbatical, Sam Delson, (samiam)Host Emeritus: Jon Carroll (jrc) Shortcut: g media"
