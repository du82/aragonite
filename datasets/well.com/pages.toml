["https://www.well.com/join/join-the-well"]
title = "Join Us! < The WELL"
full_description = "Join Us! There’s only one way to find out if the WELL’s for you, and that’s to experience it first hand. Join the site that WIRED called “the most influential online community in the world”! What you get: Participation in The WELL’s acclaimed conferences via your browser — plus if you want to party like it’s 1999, you can try out the classic text-only interface, too! Quality conversation with smart people on a wide range of topics Real community: what one member called, “A small town all over the world.” It’s non-anonymous, so you always know who you’re talking with. There is no data-mining. There is no advertising. Your own @well.com email address WELL membership is $15 per month, but with our special introductory offer, you’ll pay only $9.50 per month for the first three months. Sign up for your monthly WELL Membership, starting at the introductory rate or Sign up for an annual WELL Membership at a cost of $150 for the year ($12.50/month) Introductory months: This reduced rate applies to new monthly memberships only. At the end of your third introductory month, if you have not changed to the annual membership, your fourth month’s subscription will be billed at $15. If you choose to leave at any time, (including during discounted months one, two or three), simply email helpdesk@well.com and tell us. We’ll cancel your membership at the end of your current month. At any time, swap to the yearly plan for a better long-term rate. (From our Billing Terms and our Member Agreement.)"
