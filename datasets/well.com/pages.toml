["https://www.well.com/tools-and-help/your-personal-conference-list"]
title = "Your Personal Conference List < The WELL"
full_description = "Your Personal Conference List Seeding your list Navigating from your List Finding other conferences of interest to you Create your own conference Editing your Conference List Keeping up with new responses Seeding your list When you log into The WELL from the login boxes at the top of The WELL’s home page, you will be taken to a page for your personal conference list. Build this list to make it easy to keep up with your favorite conferences and to check in on ones you want to learn more about. On your first visit to The WELL you will Seed your conference list to start off with a sample list with a handful of interesting conferences to check out. Click Import conference list from shell account to import the list you’ve set up using the legacy PicoSpan interface (rare), or if you are a new member, to start you off with a recommended sample conference list. Change it as you find places you like to visit around The WELL. Navigating from your List Your personal conference list is your primary page for navigating among conferences. To jump right into a specific conference, click on its name. To return to your list at any time, select My List in the Toolbar at the bottom of your conferencing window. If you leave your conference list open, it will refresh every five minutes to show which of your conferences have topics with new posts in them. If you see an Inaccessible Conference symbol on your Conference List, check the spelling of its go-name in the Conferences page. If you’ve spelled the name correctly, contact the host of the conference or contact Helpdesk. Finding other conferences of interest to you In the Toolbar at the bottom of your conferencing window, click Conferences to browse categories of conferences you may add to your personal conference list. To see a list of conferences that focus on entertainment, for instance, select the “Arts, Entertainment and the Media” category. As you scroll down your screen under this conference category, you will see the names of conferences that you can visit or add to your list. To learn more about a conference, click on the “Description link.” To visit a particular conference, click on its “Direct login link.” Create your own conference If the topic you want to discuss will not fit easily into an existing conference on The WELL, you may wish to create a conference and either invite all WELL members or a select few WELL members to your conference. See Hosting private and independent conferences. Editing your Conference List To edit your conference list, select Settings on the Toolbar. A new settings window will open. Then select Edit My List to see the conference list editor. To add a conference, click on the location in the list where the new conference should appear, create a blank line (by pressing ENTER or RETURN on your keyboard), and then type the conference name on that line. To delete a conference, highlight its name using your mouse and then press DELETE on your keyboard. To rearrange the order of conferences on your list, cut and paste the names into the order you prefer. When you have finished editing your list, click the Update button. TIP: If you know the name of a conference, you can add or remove it from your list using a command in the shortcut box. Type add or remove followed by the conference name and then press ENTER or RETURN. The command to add the Books Conference from your list, for instance, is add books. remove books will remove the conference from your list. For more help on using the shortcut box, see Shortcuts. Keeping up with new responses Once a conference has been added to your list, a red number will appear next to its name to tell you how many topics in the conference have responses that have been posted in your absence. To read the new items, click the red number next to the conference name. To see all the new items in all of your listed conferences, select Global See New from your personal conference list. This may produce a large output. TIP: When you select New items in a conference, you’ll go on a “tour” of new responses, looking at one topic at a time. To move from one topic to another, select Pass at the end of each conversation. Experienced participants may choose to bypass the tour and load all new responses on a single page. INTRODUCTION Getting started THE BASICS Your personal conference list The Toolbar Settings Inside a conference Reading and responding Learning more about your fellow WELL members ADVANCED TOOLS Hypertext linking Placemarks Shortcuts REFERENCE Frequently asked questions Glossary"
