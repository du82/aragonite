title = "Media Mentions of The WELL < The WELL"
full_description = "Media Mentions of The WELL The WELL seems to show up everywhere: in movies, on TV, in newspaper articles, you name it. Sometimes it’s just a passing reference, but sometimes it’s more than that! Here are just some of the places where you might read about The WELL — no site too large or too small to get listed. If you run across a mention of The WELL somewhere, drop us an email and we’ll add it to this page. Articles, Blogs, and Forums Cynthia Heimel, Irreverent Writer About Sex, Dies at 70, Richard Sandomir, NYTimes.com, 2/27/2018 Obituary: John Perry Barlow Died on February 7th, TheEconomist.com, 2/22/2018 John Perry Barlow obituary, Jack Schofield, Guardian.com, 2/11/2018 Eight Rock Star Programmers You Never Heard Of: Jaron Lanier, Jason Christie, Buzzfeed.com, 2/25/2016 Before the Web: Online Services of Yesteryear, Steven J. Vaughan-Nicholas, ZDNet.com, 12/4/2015 When Nerds Collide, Meredith Patterson, Medium.com, 3/23/2014 PLATO Notes Released 40 Years Ago Today, Brian Dear, Medium.com, 8/7/2013 Le Cas Sanghal Rinpoché, SanghaForum, 2/25/2012 (In French) Stop Judging: 4 Reasons, 5 Things, 6 Ways, PositivelyPresent.com, 5/29/2009 Will You Buy WiFi?, Chris Taylor, Time.com, 4/13/2003 The Third Wave of Online Journalism, Larry Pryor, OJR.org, 4/18/2002 Seriously Wired, Karen Schoemer, NYTimes.com, 8/8/1993 Greatest Stories Ever Told: Jack Straw, David Dodd, Dead.net References The Annotated Grateful Dead Lyrics, David Dodd Converging Media: A New Introduction to Web Communication Web Links, Oxford University Press Cyberculture, Curlie.com Cyberpunk Zones & Zines, Project.Cyberpunk.ru Deadstuff, TruFun.com Engagement Guide 05: Team Effort, Cliqueworthy.com Library, Tek-Gnostics.com Really Useful Websites, WholeEarth.com Sample Lesson Plan: Data Compression, AQA.org.uk Tom Collins’ World Wide Web Log, TomCollinsBlog.com"
