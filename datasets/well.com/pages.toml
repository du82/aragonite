["https://www.well.com/articles/host-tips"]
title = "Online Moderator Guidelinesand Community-Building Tips < The WELL"
full_description = "Online Moderator Guidelinesand Community-Building Tips From The WELL Host Manual by John Hoag Adapted by Gail Ann Williams Copyright 1990,1997 The WELL What’s So Special About Online Conversation? It’s a very human activity, that’s for sure. The words can have an incandescent feeling, brighter and larger than life. The interactions can have heightened emotional or creative charges, despite the fact that we may never see one another face to face. Taking part in a conversation in text, distributed to its participants by means of networked computers, is a relatively new group experience. It’s just familiar enough to feel like there’s nothing to it, and just foreign enough to feel like the birth of a new kind of human community. Like actors on a bare stage, members of a discussion create the illusion of a place, a scene you can watch or join, by their words and perhaps simple graphical gestures. As the interactions become more complex, and the participants become known to one another, several roles become available for the sustainers of the group conversation. Often these roles are filled intuitively; small understandings are smoothed out, new ideas introduced, visitors welcomed and progress summarized and restated simply because it feels right. These tasks may be swapped effortlessly. Perhaps this instinctive collaboration will go forward with relatively few missed cues, and never be formalized. However, in most online environments, a conversation convener becomes the initial facilitator, moderator, wizard or referee of the conversation. On my home site, we call these people Hosts, and we honor them when they can make a wonderful scene without calling much attention to their special powers. What is Hosting at The WELL? The WELL, the forum service strongly associated with the emergence of full-blown online community, is widely regarded as one of the world’s most influential and cherished virtual gathering places. WELL users log in regularly, in some cases several times a day, in order to discuss, debate, banter, inform … and most importantly to connect to friends they’ve made on the service. Founded in Sausalito, California, The WELL was launched in 1985 by the iconoclastic, opinionated founders of The Whole Earth Review. Rather than starting with a purpose, it started with a loose network of people with some shared values. The purpose eventually became to connect with one another. People on The WELL interact in asynchronous conversation forums called “conferences,” communicating at each individual’s convenience. Each conference is tended by one or more users. These moderators with some special system privileges were originally called “Fair Witnesses” at the WELL, but the community and staff came to adopt the more welcoming and socially involved term “Host.” While in many ways forum software is optimal for deep interactive community building, group processes in WELL conferences pose the same range of online community dilemmas which challenge conveners of bulletin boards, news groups, blogs, social network sites or mailing lists involving ongoing participants. Beyond the distinctive culture of our local online community, many of the lessons learned in this colorful petri dish of virtual group dynamics and living, breathing relationships may be applied to any online conversational setting, from the most corporate to the most anarchic. The original WELL-specific version of this manual is one of the resources The WELL has developed in conjunction with conference hosts to advance the art of online community building, and let better conversations bloom. The document you are reading was adapted from that manual, and from some of my postings and speaker’s notes about moderator’s strategies. What Makes a Compelling and Sustainable Scene? What makes a good subject matter, purpose or theme for a really great ongoing virtual gathering place? Notable forums, meeting places or virtual worlds come from that mysterious realm of creativity which is generally recognized after the fact, but completely unheralded before it happens. Further, the success of a virtual gathering place can depend as much upon the energy, creativity and approach of its host or hosts as it does upon the proposed subject matter or theme. In an online environment, the founders and original participants are the initial destination. A good party depends a significant amount on who’s there when each guest arrives, so you will want to steadily build the sensation of having interesting people “already there” from the moment you open, usually starting with your own scintillating participation as the reason to visit. Still, if you have an idea for a new gathering place, there are a few questions you might ask yourself to help you decide on the feasibility of your idea, purpose or theme: Is it a theme or subject matter of which you are personally likely to tire? Nothing worse than building a castle and getting tired of the entire premise of royalty, or starting a Solitaire Players Support Group and realizing you are wearing thin on both fascination and compassion with the solitary within a few weeks. If you have a limited interest in your own idea, challenge yourself to find a better one, or set up your gathering with a predetermined closing date (or perhaps a hand-off date) so it won’t just wither away. Is the theme broad enough to support a multitude of interactions and conversations? A site that relies too heavily on a single issue or topic of discussion can get tiring quickly, like a one-issue candidate or a one-joke movie. Do you think there would be enough interest in, and knowledge of, the subject area to promote lively participation? Can you draw enough lawyers to discuss immigration law, or would law in general be pushing the limits of your networking abilities? This applies to fanciful topics, too. Developing traffic — and participants with knowledge and energy — is the major challenge of creating a new virtual gathering place that is a community hub. Some ideas for discussions or even role playing themes don’t click, others become successful online communities, giving their members a chance to build rich connections with one another. Experimentation is the best approach. So once you have your idea, you’re ready to set up your forum, blog, list or world. But first, take a moment to define your own role as founding host. If you are not planning to convene the new gathering place personally, you will need to look for someone who can take on that role. What Exactly Does a Host Do? Hosting generally will provide you with some extra administrative privileges, conveyed by the software itself. You may be able to create or modify items your guests cannot change, or even to exclude or censor your visitors. Remember that the rules written into the software are part of the law of your place. That’s why they call it code: Technical details do indeed have social implications. So if you get a chance to select the software, evaluate the restrictions and powers of the platform in terms of your specific vision. While you will probably be taking care of some of the technical aspects of your gathering place, the most important aspects of hosting have to do with stimulating participation and dealing with people. What is your primary goal as a host? No matter what the medium or the theme, a good host wants his or her gathering place to be worth a return visit and committed interaction. Whether that can best be achieved by active participation in the conversation or by simply staying out of the way is a decision only the host can make. In most cases, shifting between active participation, and backing off to let the guests run with a conversation or provide support to one another, is the best ongoing strategy. It’s not about you; the whole point is to find a way to help the participants share the spotlight. At The WELL, hosts vary greatly in their approaches. Some hosts do considerable research and present thought-provoking materials on a regular basis for participants to discuss. (Even in the era of search engines, keeping good reference books handy is a simple magical technique for finding material, and current events can help as well.) Other hosts let the forum milieu generate discussion material for itself. Some of the most successful low-key hosts keep lists of topic ideas in case their forum goes for a week with no new subject matter or ideas. Recycling can be helpful over the long haul. Many topics are timeless, and can be discussed again and again by newcomers who’d like to have a chance to describe their experiences. Others are seasonal, and come back around for you to reinvent every year. The nature of a gathering place will determine the duties of its host. Some forums are fairly self-sustaining while others need regular infusions of hostly enthusiasm, expertise or control. Blogs are predicated on the active host premise, while forums depend more on aggregate visitor involvement. Bear in mind that it’s not merely interest in a particular subject or the opportunity to interact that draws people to a conversation, but the quality of that interaction, the scope and setting of it, what kinds of topics are available, how they are introduced, and the tone which is set for the gathering place by its host. The final broad category concerned with hosting is dealing with people, from the shy to the contentious. Over the years, a number of general rules of thumb have been noted which hosts may wish to consider when dealing with the marvelous, and sometimes troublesome, human species online. We’ll take a look at some of them now. Welcoming New Participants Some hosts like to help people feel more at home by welcoming them specifically after their first arrival, either in e-mail, a private instant message, or in a discussion thread or area set aside just for people to introduce themselves. On the other hand, some hosts feel that a welcome in e-mail is too intrusive unless the visitor has actually posted something. Some software may not support the option of identifying these timid “lurkers” before they wade into the fray. And an Introductions thread is not appropriate for every gathering place. One thing a host can be fairly sure of, however, is that nobody likes to go into a new place for the first time, compose a response, then have it sit there without ever being acknowledged. At the very least, as host, you will want to keep an eye out for responses by folks who have never responded before, and acknowledge their participation. Even a simple “Hello! I’d love to hear more about your experiences with …” or “Nice to see you here!” can mean the difference between someone feeling snubbed, and feeling like a welcomed participant who will return. If a newcomer posts, “Hi, I’m a published expert on Foo arrangement,” he or she may be waiting to be invited to open a new topic about arranging Foo, or about the saga of publishing that book, feeling it is presumptuous to barge in. New readers are frequently shy, or polite, and may be waiting for suggestions and cues on how to best participate in your discussions. Over time, you will begin to build a group of regulars who have a rapport with one another. If you can inspire this group to take on some of the hostly spirit, greet newcomers, recap and summarize what’s gone before and start new topics or suggest new events, you’ll have the seeds of a self-sustaining and durable gathering place. Creating Special Rules Some game or forum designs proceed upon special rules of one sort or another as part of their initial concept. If you have such rules in mind for your gathering place, think them through very carefully. Then think them through again! Whatever rule you make, someone will eventually question it — even if it is “no rules at all.” The most casual glance at human history shows that humans love making rules and arguing over them. Such argumentation can quickly get to the point where the main subject matter of a gathering is completely obscured in favor of heated arguments over rules, and it can be very destructive to the spirit of a forum. If the rules of a gathering are in dispute, the best places to discuss them are backchannel, in e-mail, by telephone even, in a special area for the Hosts of your site, or in a special conversation area devoted to discussing your guidelines with all active participants. There are, however, ways to avoid some of the more common rule pitfalls. If you feel your place needs a special rule, take care to consider its fairness before implementing it and try to imagine how it might be circumvented. Words are a malleable medium, and they can be made to say things by inference, innuendo, and ambiguity which are very hard to pinpoint. Suppose you set up a conference in which you wanted everyone to be nice to each other, and you made a rule saying just that. You might have a difficult time enforcing it because language can be made to imply something unkind even while saying something ostensibly respectful. Excessive niceness, through hyperbole, can even convey an insult. Rather than creating a rule, you may want to depend on the direct yet respectful approach, calmly asking people to clarify whether an insult was actually meant, and making it possible to save face. This is often a useful way to communicate with guests who are testing the rules, or making you wish you’d made some. By the same token, knock-down, drag-out arguments, especially those involving personal insults, are nonproductive and can easily get to the point of dominating the interaction in discussions which might otherwise be, though controversial, potentially fruitful. Hosts can do a lot to keep the tone in their gathering places positive by making general ground rules which encourage courteous argumentation, and with reminders, when necessary, to “attack the idea, not the person” and to “take personal disputes to e-mail, please.” If a rule is inherent in, or indispensable to, the basic design or operation of your forum, be consistent in enforcing it. Avoid like the plague situations in which a rule applies to one person or group and not to another. If your place has a hard and fast rule, apply it always, not just when you feel like it. And most of all, abide by the rule yourself. Handling Problems If someone violates your rules or guidelines, there are several options at your disposal. It’s important to give a sense of due process by starting with the lightest sanction you feel comfortable with, and if necessary, to escalate methodically. Here are some approaches, as used on The WELL in our software environment, in increasing order of severity. Note that this process is not required in a “pre-moderated” environment where hosts must affirmatively approve all material before it is posted. 1. Post a short, two-paragraph response after the comment in question indicating that you would prefer folks to avoid that type of posting, then using the second shor"
