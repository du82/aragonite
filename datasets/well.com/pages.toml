["https://www.well.com/mastodon"]
title = "MASTODON < The WELL"
full_description = "MASTODON To provide a companion experience to the private walled garden that the Conferencing system provides, the WELL also provides a home for its members in the Federated Universe (Fediverse). Mastodon became a popular alternative to privately owned social media sites once people wanted to maintain more control over what they write and see as well as ownership of their own data. Having access to a host server is a requirement to participate. The WELL hosts a Mastodon server for use only by its membership. Our users can interact (read, follow, be followed, comment) with any non-WELL members in the Fediverse using their same credentials as the conferences. For instructions on using your Mastodon account, see our Mastodon Quick Start Guide Well Members: log into the WELL’s Mastodon at https://mastodon.well.com"
