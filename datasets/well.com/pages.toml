title = "WELL System Status < The WELL"
full_description = "WELL System Status Tuesday September 17, 2024, 9:00 AM Pacific Daylight Time There was a brief outage of the Billing Information Center at https://bic.well.com around 9:00 AM Pacific. Full service has been restored now. UPCOMING SCHEDULED MAINTENANCE WINDOWS Sunday March 5, 2024, 7:00 AM – 8:00 AM Pacific // 10:00 AM – 11:00 AM Eastern (one hour total) There will be intermittent outages of the email system. Conferencing will not be affected, and no email will be lost. PREVIOUS STATUS UPDATES Sunday Nov 12, 7:00 AM – 10:00 AM Pacific // 10:00 AM – 1:00 PM Eastern There will be intermittent outages of the email system. Conferencing will not be affected, and no email will be lost. Sunday Nov 5, 7:00 – 8:00 AM Pacific // 10:00 – 11:00 AM Eastern * There will be intermittent outages of web access to conferencing and the account management portal (The Well’s Billing Info Center). Email will not be affected. *Clocks change as we “fall back” to Standard time the night before this maintenance window. EMAIL Service has been restored at 9:35 a.m. Pacific, Thursday August 10, 2023. Temporary outage is resolved. THREE SCHEDULED MAINTENANCE WINDOWS for ALL WELL Systems, posted July 14, 2023 Sunday, July 16, 6:00 am – 9:00 am Pacific time // 9:00 am – 12 noon Eastern Saturday, July 22, 6:00 am – 9:00 am Pacific time // 9:00 am – 12 noon Eastern Sunday, August 6, 6:00 am – 9:00 am Pacific time // 9:00 am – 12 noon Eastern On these days, there will be rolling outages as we do maintenance and upgrades on ALL WELL systems – conferencing, email, and web hosting. The outages may be much shorter than stated. All outgoing and incoming email will be queued for delivery. Apologies for the inconvenience. SCHEDULED MAINTENANCE WINDOW for WELL EMAIL, Wednesday, May 10,2023, 7:00 – 7:15 PM PT // 10:00 – 10:15 PM ET Well email will be out of service for a schedule maintenance window tonight to resolve the lingering email issues. Apologies for the inconvenience. Conferencing will not be affected, and all outgoing and incoming email will be queued for delivery. Email Outage Resolved, But Delays Persist, Tuesday, May 9,2023, 4:00 PM PT The Well experienced an email outage yesterday, 5/8/2023, resolved at around 3:45 PM. Because of the outage, a large amount of incoming and outgoing email that was queued up is now being processed. Mail will be delayed, but ultimately delivered. We’re sorry for the inconvenience. SCHEDULED MAINTENANCE WINDOW: Sunday, April 23, 2023 There will be a brief scheduled maintenance window on Sunday, April 23, 2023, from approximately 7:00 am – 7:30 am PDT // 10:00 am – 10:30 am EDT. There will be intermittent interruptions to conferencing and email. Access to member web pages and web directories during this time will not be affected. No email will be lost. SCHEDULED MAINTENANCE WINDOW: Sunday, April 16, 2023 There will be a brief scheduled maintenance window on Sunday, April 16, 2023, from approximately 8:00 am – 8:15 am PDT // 11:00 am – 11:15 am EDT. There will be intermittent interruptions to email service. Access to conferencing, member web pages and web directories during this time will not be affected. No email will be lost. SCHEDULED MAINTENANCE WINDOW: Sunday, December 4, 2022 There will be a scheduled maintenance window on Sunday, December 4th, from approximately 7:00 am – 8:00 am PST // 10:00 am – 11:00 am EST. There will be intermittent interruptions to conferencing, email service and access to member web pages and web directories during this time. No email will be lost. ALERT for GMAIL Users: Thursday, June 9, 2022 Recent changes in Gmail policy have caused (at least) two problems for WELL users. (1) Outgoing mail from Well accounts that use a third party SMTP for their outgoing server are finding that their emails to gmail.com accounts are failing, sometimes with an error message and sometimes silently. For example, <puffball> might use Thunderbird to get their email from the WELL, but use smtp.sonic.net as their outgoing server. Email from <puffball> to <random.user@gmail.com> will not be delivered. We advise everyone to specify iris.well.com as their outgoing email server for mail that originates from a well.com account. Instructions are in the email help page at <https://www.well.com/email/using-well-email/>. (2) We’ve received and confirmed reports that Gmail is rejecting or flagging email forwarded from Zimbra, using the Zimbra Preferences setting. Email from a Sonic.net account to the user bounced with a message from Gmail saying >Our system has detected that this message is likely unsolicited mail. To reduce the amount of spam sent to Gmail, this message has>been blocked. Please visit <https://support.google.com/mail/?p=UnsolicitedMessageError> for more information. We set a test account to forward to Gmail, and while it went through, it was flagged as dangerous. So, using Zimbra Preferences to forward to Gmail is unreliable at best, and unusable at worst. If your WELL account is configuredto do this, please remove the forwarding address from Zimbra Preferences and use IMAP or POP3 in Gmail itself to retrieve (fetch) your Well email. To do so, in Gmail go to Settings=>Check mail from other accounts. SCHEDULED MAINTENANCE WINDOW: Sunday, June 5, 2022 There will be a scheduled maintenance window on Sunday, June 5th, from approximately 6:00 am – 7:00 am PDT // 9:00 am – 10:00 am EDT. There will be intermittent interruptions to mail service during this time. No mail will be lost. Conferencing and member web pages will not be affected. SCHEDULED DOWNTIME: Sunday, February 20, 2022 The Well will be installing a software update to the Zimbra email server to address a security problem in our current version. The installation will take place for about an hour beginning at 10:00 AM EST // 7:00 AM PST. There will be one or more brief interruptions in service on iris.well.com while the mail server is restarted. No mail will be lost during the short interruptions. Conferencing, including Engaged and Picospan, will not be affected, nor will user web pages."
