["https://www.well.com/conferences/current"]
title = "Current Events < The WELL"
full_description = "Current Events The Current Events conference is a place to discuss current events of interest: political, social, economic, and technical. Discussions are often started in Current and linked to other appropriate conferences as the discussion matures. We also like to focus on what can loosely be called “human interest” news. Think of Current as The WELL’s “Living” section and you’ll get the idea. Stories that are interesting but don’t fit into the typical “hard news” conferences belong here, such as social trends, crime, scandal, lifestyles, Hollywood, gossip, etc. News about politics is appropriate here for discussion of its social implications, rather than grinding a particular ideological axe. Current events that don’t fit into any other category can find a home in Current. Hosted by: Jet Townsend (jet) Shortcut: go current"
