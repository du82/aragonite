ctory (Featured Conferences only) 12.0 THE RC FILES 12.1 What Are the RC and URC Files? 13.0 CREATING A MENU WITH !INFOMENU 13.1 Moving & Copying Files Into the Info Directory 13.2 Removing Files From the Info Directory 13.3 How Menus Work 13.4 Preparing Your Files 13.5 Amenu 14.0 A FRONT PAGE ON THE WEB 14.1 Your Conference Web Directory (Featured Conferences only) 14.2 The How-to of Enhancing your Conference Web Page 14.3 More Extensive Enhancements 15.0 HOW GOES IT: CONFERENCE STATISTICS 15.1 Using the !conflog Command to Check Conference Visits 15.2 Census: Comparing Conference Activity 15.3 Using Extract -U for Topic Statistics 16.0 PRUNING YOUR CONFERENCE 16.1 Hitlist: A Utility for Inactive Topics 16.2 Conference Archives Last Edited: 20 May 2024 Copyright 2024, The WELL, All Rights Reserved."
