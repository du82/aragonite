full_description = '''Publications Software Patent and/or Software Development, Brooklyn Law Review (2013); cited in Intellectual Ventures v. Symantec, Mayer concurrence, 838 F.3d 1307 (Fed. Cir. 2016). Infrastructures of Censorship and Lessons from Copyright Resistance, USENIX FOCI Workshop, August 8, 2011 (local copy) Exposing the Flaws of Censorship by Domain Name, IEEE Security and Privacy, vol. 9, no. 1, pp. 83-87, Jan./Feb. 2011, doi:10.1109/MSP.2011.8 (local draft) Free Speech Unmoored in Copyright's Safe Harbor: Chilling Effects of the DMCA on the First Amendment 24 Harvard Journal of Law and Technology 171 (2010) (local PDF). The Imperfect is the Enemy of the Good: Anticircumvention Versus Open User Innovation, 25 Berkeley Technology Law Journal 909 (2010) (local PDF). The Politics of Internet Control and Delegated Censorship, American Society for International Law (2008) (local PDF). The Broadcast Flag: It's not just TV, 57 FCLJ 209 (2005) "Why Open Source Needs Copyright Politics," in Open Sources 2.0, (O'Reilly, 2005) Death by DMCA, with Fred von Lohmann, IEEE Spectrum, June 2006 "The Overloaded Activist," in She's Such a Geek, Seal Press, 2006 Crafting Law, CRAFT 06, Jan. 2008 Artistic License, CRAFT 07, April 2008 Author page on SSRN Projects and Explorations Lumen Database (formerly Chilling Effects): This pioneering transparency reporting site documents requests to remove online speech and informs Internet users of their rights in response. Cross-Cultural Partnership Template: The partnership template and supporting materials are designed to help collaborators with different backgrounds and interests to converse about their common goals and frame joint work. Endangered Gizmos: Demonstrating the threat that expansive copyright poses to innovation and creative expression by showcasing some of the devices killed by law. The project included a "build-in" and cookbook to construct MythTV high-definition time-shifting video recorders, one of the endangered gizmos. Openlaw: An experiment in crafting legal argument in an open forum, developing arguments, drafting pleadings, and editing briefs in public, online. Non-lawyers and lawyers alike were invited to join the process by adding thoughts to the "brainstorm" outlines, drafting and commenting on drafts in progress, and suggesting reference sources. ICANN: From early study of "representation in cyberspace" to service on the Board of the Internet Corporation for Assigned Names and Numbers, helping to shape this multi-stakeholder institution of domain name governance. Tor Project: Advocate and founding Board member for the Tor onion-routing secure anonymous communication software. Teaching Northeastern University School of Law: Software and Internet Law (Spring 2008); Antitrust (Spring 2008); Intellectual Property Survey (Fall 2007); Seminar: Adv. Topics in I.P. and Technology Regulation, (Winter 2007-08) Brooklyn Law School: Copyright, 2007, 2006; Information Privacy 2007; Internet Law 2006 Internet Law at St. John's University School of Law (2001, 2002) Online course, Privacy in Cyberspace, with Prof. Arthur Miller (1999) Law of Cyberspace at UMass Amherst (1999) Teaching with The Bot Elsewhere Online @wseltzer@infosec.exchange Mastodon @wseltzer on Twitter (no longer updated) wseltzer on GitHub'''
