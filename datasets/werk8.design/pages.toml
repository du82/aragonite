description = "Werde Teil unseres Teams bei Werk 8 als Mediengestalter und gestaltest digitale Kundenprojekte mit uns"
full_description = "Ausbildung – Mediengestalter Digital (m/w/d)Ludwigsburg, ab September 2025Nutze deine Talente und finde den Job, den du liebst.Wir sind Werk 8 – eine Digitalagentur aus Ludwigsburg. Wir helfen unseren Kunden mit Empathie, Kreativität und Technologie digitale Lösungen für die Welt von morgen zu entwickeln. Wir sind eine bunte Mischung aus kreativen Köpfen, engagierten Machern und digitalen Allroundern. So schaffen wir gemeinsam digitale und stilprägende Produkte, die Emotionen wecken und einen positiven Einfluss auf unseren Alltag haben.Werde ab September 2025 Teil unseres Teams und unterstütze uns bei der Entwicklung von spannenden digitalen Projekten.Direkt bewerbenDas erwartet dichIm Rahmen deiner dualen Ausbildung lernst du die kreativen und technischen Aspekte deines neuen Berufs kennen.Nachdem du mit den gängigen Design Tools vertraut bist, wirst du aktiv in unserem Team mitarbeiten. Hier wirkst du an der Ideenfindung, Konzeption, Gestaltung sowie der Entwicklung von digitalen Produkten mit und sammelst so wertvolle Erfahrungen.Während deiner Ausbildung durchläufst du unterschiedliche Gewerke einer Digitalagentur, um auf vielfältige Weise Einblicke in alle Stationen des Berufsalltags zu erhalten.Nicht zuletzt darfst du auch Verantwortung für kleinere Projekte übernehmen, in denen du unter anderem Websites und App Prototypen, digitale Werbeanzeigen und animierte Social Media Formate entwickelst.Darauf freuen wir unsGuter Realschulabschluss (mittlere Reife), allgemeine Hochschulreife oder ein vergleichbarer Abschluss.Gutes Gespür und Leidenschaft für Ästhetik, digitale Trends und kreative Ideen. Erste Erfahrungen und Kenntnisse in den gängigen Design Tools.Gutes Deutsch und Englisch in Wort und Schrift.Du arbeitest selbstständig, zuverlässig, bist ein Organisationstalent und ein Teamplayer.Du bist motiviert und suchst nach deiner Schulzeit oder nach ein paar Semestern in der Marketing- und Medienbranche eine neue Herausforderung.Deine Vorteile bei unsEin tolles, kleines Team, das dich und eine kollaborative Arbeitskultur fördert, Teamwork schätzt und dir Zugang zu den neuesten Tools und Techniken bietet.Mobiles Arbeiten (Homeoffice) für mehr Freiheit und eine angenehme Work-Life Balance.Interessante Fort- und Weiterbildungsmöglichkeiten, um deine Skills zu verbessern und deine zukünftige Karriere zu boosten.Modernes Büro in zentraler und gut erreichbarer Innenstadtlage (mit Bus und Bahn), in dem die Arbeit richtig Spaß macht.BewerbungKlingt das spannend? Dann lass uns gerne ins Gespräch kommen und leite deine Bewerbung (inkl. Anschreiben, Lebenslauf und dein letztes Zeugnis) an uns weiter: join@werk8.deWir freuen uns auf deine Bewerbung.Direkt bewerben"
