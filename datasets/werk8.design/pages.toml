["https://werk8.design/work/hts-tentiq"]
title = "Digitalerlebnis für HTS TENTIQ - Werk 8 GmbH"
description = "Skalierbare, mehrsprachige Website präsentiert temporäre Bauten und fördert Neukundengewinnung, Gewinner des German Brand Awards 2022"
full_description = 'Alle ProjekteHTS TENTIQEine einheitliche Web Experience für mehr LeadsLinkshts-tentiq.comHTS TENTIQ ist ein führender Hersteller von temporären Bauten wie mobilen Lagerhallen, hochwertigen Veranstaltungszelten oder speziellen Unterkünften für humanitäre und militärische Einsätze. Bekannt wurde das Unternehmen unter anderem durch die Zusammenarbeit mit der Bundeswehr beim Bau von Flüchtlingszelten oder durch den Bau von überdachten Tribünen für renommierte Motorsport Events wie die Formel 1 oder die DTM.Gemeinsam mit unserem Partner Oscar Charlie haben wir eine skalierbare und mehrsprachige Website entwickelt, die bestehenden Kunden, Lieferanten und allen anderen Stakeholdern den Zugang zu temporären Bauten erleichtert und die Neukundengewinnung nachhaltig steigert. Die Herausforderung bestand darin, eine nutzerfreundliche und ästhetische digitale Lösung zu schaffen, die die vielfältigen Einsatzmöglichkeiten von HTS widerspiegelt und gleichzeitig den hohen Ansprüchen der Nutzer und Branchen gerecht wird.RESULTBarrierefreies Design System und nutzerzentrierte ProduktarchitekturUm die Bedürfnisse und Wünsche der Nutzer umfassend zu berücksichtigen, wurden auf Basis einer Nutzerbefragung mit allen relevanten Stakeholdern die Top-Anforderungen definiert, um anschließend die gesamte Informationsarchitektur neu zu strukturieren und in einzelnen User Journeys zu dokumentieren.Ein flexibles und barrierefreies Design System wurde nach WCAG Standards entwickelt und in Form von Prototypen im Usability Testing mit relevanten Nutzergruppen getestet. Auf Basis eines agilen Setups wurde die Website innerhalb von acht Sprints in einem interdisziplinären Team aus UX Architects, UI Designern und Full Stack Developer von Oscar Charlie und uns konzipiert und für die Umsetzung entwickelt.Entstanden ist eine mehrsprachige Website, die das Produktportfolio von HTS Tentiq optimal abbildet und mit Case Studies, Ratgebern und einem Self Service Bereich unterstützt. Ein zentrales Element der neuen Website ist der responsive Produktfinder, der den Nutzer intuitiv durch eine Schritt-für-Schritt-Abfrage führt und anschließend die passenden Produkte anzeigt. Mit Oscar Charlie sind wir stolzer Gewinner des German Brand Awards 2022 in der Kategorie “Excellent Brands - Building & Elements”. Zusätzlich erhielten wir eine Special Mention in der Kategorie Excellent Brands - Brand Innovation of the Year" für besondere Aspekte in der Markenführung. Der German Brand Award zeichnet erfolgreiche Markenführung in Deutschland aus und wird von einer unabhängigen, interdisziplinären Expertenjury aus Unternehmen, Wissenschaft, Beratung, Dienstleistung und Agenturen vergeben.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesWeinlageAufbau einer Personal Brand für die WeinbrancheCJDInklusive Web Experience für maximale Barrierefreiheit'
