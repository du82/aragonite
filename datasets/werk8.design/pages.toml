["https://werk8.design/work/stuttgarter-prominenten-kicker"]
title = "Stuttgarter Prominenten-Kicker - Werk 8 GmbH"
description = "Website Relaunch mit Headless CMS für die Stuttgarter Prominenten-Kicker, einen Sportverein mit über 40 Jahren Geschichte"
full_description = "Alle ProjekteStuttgarter Prominenten-KickerEine digitale Plattform für Tradition und VielfaltLinksprominentenkicker.deDie Stuttgarter Prominenten-Kicker sind ein Sportverein ehemaliger Stuttgarter Fußballspieler. Mit über 40 Jahren Geschichte und regionalen Auszeichnungen wie dem Stuttgarter Rössle und dem Goldenen Volltreffer sind die Prominenten-Kicker eine feste Größe rund um Stuttgart. Unter anderem ist Niko Kappel aktueller Preisträger des Stuttgarter Rössle und Silbermedaillengewinner im Kugelstoßen bei den Paralympics 2024 in Paris. Neben bekannten Persönlichkeiten aus der Event- und Gastronomiebranche sind auch ehemalige Fußballprofis des VfB Stuttgart wie Guido Buchwald, Hansi Müller und Kevin Kurányi Mitglieder des Vereins.Need & MissionEntwicklung einer digitalen Plattform für Tradition und VielfaltDie Stuttgarter Prominenten-Kicker benötigten eine moderne und barrierefreie Website, um neben der Vereinsgeschichte auch die verschiedenen sportlichen Aktivitäten zu präsentieren. Unser Ziel war es, eine digitale Plattform zu schaffen, die für alle Nutzergruppen funktional ansprechend ist und genügend Flexibilität für die Verwaltung der Inhalte bietet..Für die technische Umsetzung haben wir uns für das leistungsfähige Web-Framework Next.js und das Headless CMS Prismic entschieden. Ein Headless CMS ist ein cloudbasiertes Content Management System (CMS), das Inhalte über eine Schnittstelle für eine Website zugänglich macht. Dadurch können flexible und skalierbare digitale Lösungen entwickelt werden, ohne durch vorgefertigte Technologien eingeschränkt zu sein. Solution & ResultModerne und authentische Web Experience für mehr SichtbarkeitUnsere digitale Lösung umfasst neben der technischen Umsetzung die Entwicklung einer zielführenden Website-Architektur, die Gestaltung eines authentischen und barrierefreien Webdesigns sowie die Optimierung von suchmaschinenoptimierten Texten und Bildern für eine bessere Sichtbarkeit im Google Ranking. Als Headless CMS setzen wir die Lösung unseres langjährigen Partners Prismic ein. Prismic hat mit seinem Page Builder die Verwaltung und Pflege von Inhalten revolutioniert. Für die Stuttgarter Prominenten-Kicker ist der Website Relaunch ein weiterer Meilenstein in der digitalen Transformation und bietet den Mitgliedern und Interessierten einen weitere Möglichkeit, die Inhalte auf einem weiteren digitalen Kanal zu konsumieren.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesKnebelNeue digitale Experience für einen B2C-OnlineshopDIGITUUFlexible User Experience für die Gastronomie Branche"
