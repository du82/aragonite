title = "Karriere - Werk 8 GmbH"
description = "Werde Teil von Werk 8. Wir sind eine bunte Mischung aus digitalen Experten mit einer Mission: Die digitale Zukunft von morgen zu gestalten. Bist du dabei?"
full_description = "01BewerbungZeige uns, was dich auszeichnet und warum du ein Teil von Werk 8 werden möchtest. Schick uns deine Bewerbung (mit Lebenslauf, letztem Zeugnis und Arbeitsproben) gerne an join@werk8.de. Wir schauen uns jede Bewerbung sorgfältig an und melden uns innerhalb von zwei Wochen bei dir. 02InterviewIn einem ersten digitalen Kennenlernen möchten wir mehr über dich und deine Qualifikationen erfahren. Was treibt dich an, was hast du bisher gemacht und welche neue Herausforderung suchst du? Wir sehen dieses Meeting als eine Art gegenseitiges Vorstellungsgespräch und möchten dir auch einen ersten Eindruck von uns und unserer Arbeitskultur als Digitalagentur vermitteln sowie offene Fragen klären. 03Deep DiveDu hast uns überzeugt und nun möchten wir dich persönlich und fachlich noch näher kennenlernen und dir weitere Kolleg:innen vorstellen. Außerdem möchten wir anhand einer praktischen Aufgabe einen ersten Eindruck von deiner Arbeitsweise gewinnen. Wir finden: Eine gute Entscheidung kann nur getroffen werden, wenn beide Seiten ein gemeinsames Verständnis von Zusammenarbeit und Arbeitsweise haben. 04Job AngebotWenn Du zu uns passt - und wir zu Dir, dann schicken wir Dir ein Vertragsangebot und vereinbaren telefonisch einen Starttermin, damit Du schon bald ein Teil von Werk 8 wirst."
