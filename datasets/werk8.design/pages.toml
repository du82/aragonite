["https://werk8.design/work/stuttgarter-kickers-svk"]
title = "Stuttgarter Kickers - Werk 8 GmbH"
description = "Entdecken Sie den digitalen Fußball-Hub der Stuttgarter Kickers - Redesign der Website der Stuttgarter Kickers durch Werk 8"
full_description = 'Alle ProjekteStuttgarter KickersDigitalisierung im Fußball durch neue Marketing PlattformLinksstuttgarter-kickers.deFast zehn Jahre nach dem hochdramatischen Abschied der Stuttgarter Kickers aus dem Profifußball steigen derzeit die Chancen auf eine Rückkehr in die 3. Bundesliga. Die Kickers begeistern auf und neben dem Platz. Mit einem überdurchschnittlichen Zuschauerschnitt in der vergangenen Saison ist der Sportverein fest in der Region verwurzelt. Durch die engagierte Vereinsarbeit ist auf der Waldau eine bunte Fußballgemeinschaft gewachsen, die sich als moderner, fortschrittlicher und sozialer Club etabliert hat. Need & MissionDie Website als digitales SpielfeldZiel war es, eine skalierbare, barrierefreie und moderne Vereinswebsite zu entwickeln, die den hohen Bedürfnissen und Erwartungen von Fans, Mitgliedern, aber auch Sponsoren und Partnern gerecht wird. Gleichzeitig wollten die Stuttgarter Kickers ihre digitalen Services wie Livestream oder Liveticker auf einer zukunftssicheren und performanten Technologie anbieten.Die neue Marketing Plattform soll als zentraler Content Hub für News, Tickets, Onlineshop und Fanseiten dienen. Gemeinsam mit den Kickers setzen wir alles daran, die Fans auch auf dem digitalen Spielfeld zu emotionalisieren und zum Wiederkommen zu motivieren. Ein flexibles Headless CMS soll dem Team die Verwaltung der Inhalte für die verschiedenen Kanäle erleichtern. Solution & ResultPerformante Marketing Plattform für mehr Sichtbarkeit und SicherheitUnter Berücksichtigung aller Schnittstellen und externen Dienste haben wir auf Basis des Headless CMS Prismic und des Web Frameworks Next.js eine barrierefreie und performante Marketing Plattform entwickelt. Damit haben wir eine Web Experience geschaffen, die es ermöglicht, Inhalte flexibel, schnell und einfach auf verschiedenen Kanälen auszuspielen. Diese Website-Architektur garantiert schnelle Ladezeiten und erhöht gleichzeitig die Sichtbarkeit im Google-Ranking.Um die starken Schwankungen der Zugriffe auf die Website zwischen Spieltagen und Normalbetrieb zu bewältigen, arbeiten wir beim Hosting mit unserem Partner Amazon Web Services (AWS) zusammen, der ein sicheres und zuverlässiges Hosting garantiert und sein Engagement für Sicherheit durch ISO-Zertifizierungen unter Beweis stellt.Für die erfolgreiche Integration weiterer digitaler Services entwickelten wir API-Schnittstellen zu Vivenu für Ticketing, HubSpot für Lead Generierung, Mitgliederverwaltung und Newsletter Marketing sowie Shopware für den Onlineshop. Seit dem Relaunch ist der SISTRIX Sichtbarkeitsindex um über 160 Prozent gestiegen. Der SISTRIX Sichtbarkeitsindex ist eine Kennzahl für die Sichtbarkeit einer Domain im Google Ranking. Der geschätzte organische Traffic liegt bei durchschnittlich knapp 70.000 Seitenaufrufen pro Monat und einer mobilen Nutzung von über 90 Prozent.Matthias Becher, Geschäftsführer der Stuttgarter Kickers: “Es war ein langer Weg, aber auf das Ergebnis können wir sehr stolz sein. Gemeinsam mit unseren Partnern haben wir genau die Website geschaffen, die zu den Stuttgarter Kickers passt. Modern und doch in manchen Dingen traditionell.”Good to knowDetailsBrancheSport und FreizeitFrameworksPrismicNext.jsReactTypescriptTailwind CSSVercelHubSpotViveniuShopwareKompetenzenUser Experience (UX)InformationsarchitekturWeb DesignHeadless CMSWebentwicklungHosting und MaintenanceLifecycle ImprovementsAll you needHäufige FragenWas ist ein Headless CMS?Ein Headless CMS ist ein entkoppeltes Content Management System (CMS), das Inhalte über eine API-Schnittstelle für jede Website und jede digitale Plattform zugänglich macht. Auf diese Weise werden die Inhalte (der “Body”) von der Darstellung (dem “Head”) getrennt, daher der Begriff "Headless". Mit einem Headless CMS können Unternehmen skalierbare, mehrsprachige Omnichannel-Erlebnisse anbieten, ohne durch vorgefertigte Technologien eingeschränkt zu sein.Wie funktioniert ein Headless CMS?Ein Headless CMS trennt das Frontend vom Backend und ermöglicht so die flexible Ausspielung von Inhalten über verschiedene Kanäle. Die Inhalte werden über APIs (Application Programming Interfaces) bereitgestellt. API-Schnittstellen sind eine standardisierte Möglichkeit, auf die (im Headless CMS) gespeicherten Inhalte zuzugreifen und mit ihnen zu interagieren. Der Zugriff auf die Inhalte erfolgt über HTTP-Anfragen, die von jedem Gerät aus gestellt werden können.Welche Vorteile bietet ein Headless CMS?Ein Headless CMS bietet Unternehmen nicht nur technische Flexibilität und Skalierbarkeit. Es ermöglicht auch die kollaborative Verwaltung wiederverwendbarer Inhalte für verschiedene digitale Kanäle. Darüber hinaus entscheiden sich viele Unternehmen für eine Headless CMS-Lösung aufgrund der zukunftssicheren Website-Architektur und der erhöhten Sicherheit.Was ist Barrierefreiheit?Barrierefreiheit fokussiert sich auf die Beseitigung von Barrieren und Behinderungen in digitalen Produkten, Dienstleistungen und Informationen. Das Ziel ist, diese für alle Menschen zugänglich und nutzbar zu machen, ohne besondere Erschwernis oder fremde Hilfe. Im Kern geht es darum, sicherzustellen, dass Menschen mit Behinderungen gleichberechtigt und selbstständig am digitalen Leben teilhaben können.Was macht Vivenu?Vivenu ist ein Ticketing-Anbieter für den Verkauf, die Verwaltung und die Analyse von Tickets für Veranstaltungen in den Bereichen Sport, Festivals, Konferenzen und Lifestyle. Die cloudbasierte Ticketing-Plattform lässt sich über eine modulare API-Schnittstelle einfach in bestehende Systeme integrieren und ist unbegrenzt skalierbar. Vereine wie der FC Schalke, der FC Basel und die Hamburg Towers nutzen Vivenu bereits für ihr Ticketing.Was macht HubSpot?HubSpot ist eine weltweit führende CRM-Plattform (Customer Relationship Management), die Unternehmen dabei unterstützt, zu wachsen und bessere Kundenerlebnisse zu schaffen. Die Plattform realisiert ganzheitliche Inbound-Marketing-Lösungen von der Lead-Generierung bis zur Conversion (Geschäftsabschluss).ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesDIEDAWeb Experience für einen Marktführer der DIY-BrancheCellcentricEine Digitale Experience Website für klimaneutralen Transport'
