title = "Ring deutscher Pfadfinderverbände – RdP - Werk 8 GmbH"
description = "Authentisches Markenlogo und flexibles Designsystem für das deutsche Kontingent entwickelt, verbindet Pfadfinderei mit internationalen Einflüssen"
full_description = 'Alle ProjekteRing deutscher PfadfinderverbändeNachhaltige Markenentwicklung für das World Scout JamboreeLinksPfadfinden in DeutschlandWorld ScoutingDas 25. World Scout Jamboree fand 2023 unter dem Motto "Draw your dream" in Südkorea statt. Über 40.000 Pfadfinder:innen aus aller Welt kamen zu diesem traditionsreichen Pfadfindertreffen zusammen, das seit 1920 alle vier Jahre gefeiert wird. Ebenfalls vertreten war das deutsche Kontingent mit etwa 2.000 Pfadfinder:innen aus ganz Deutschland unter der Leitung des Ring deutscher Pfadfinderverbände (rdp).ResultModerner Markenauftritt, der Pfadfindergeist mit internationalen Einflüssen verbindetWir entwickelten ein authentisches und charakteristisches Markenlogo und ein flexibles Gestaltungssystem für den Einsatz an allen digitalen und analogen Touchpoints. Dazu haben wir einen ikonischen Illustrationsstil kreiert, der die typisch deutschen Gerichte symbolisiert, die während der Events in der BlackMagic Zeltküche zubereitet werden. Entstanden ist ein intelligentes Baukastensystem, um die Marken über das World Scout Jamboree auf unterschiedlichen Content Formaten zu präsentieren. Der Markenauftritt verbindet das altbewährte Pfadfindertum mit modernen internationalen Einflüssen anderer Kulturen und Länder.Die Unterstützung von sozialen Projekten für Kinder und Jugendliche liegt uns am Herzen und ist fester Bestandteil unserer Vision, daher war es uns eine große Ehre, den Markenauftritt für das deutsche Kontingent des 25. World Scout Jamboree zu entwickeln.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedIn'
