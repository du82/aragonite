["https://werk8.design/career/minijob-full-stack-entwickler"]
title = "Minijob – Full-Stack Entwickler (m/w/d) - Werk 8 GmbH"
description = "Werk 8 sucht dich! Werde Full-Stack Developer (m/w/d) im Minijob und unterstütze unser Team flexibel bei Websites, Onlineshops und Webanwendungen."
full_description = "Minijob – Full-Stack Entwickler (m/w/d)Ludwigsburg und/oder RemoteDu interessierst dich für moderne Website-Architekturen und hast ein gutes Gespür für performante und barrierefreie Webanwendungen? Du suchst eine Möglichkeit, nebenberuflich in einem kreativen und flexiblen Umfeld Websites, Onlineshops und Webanwendungen zu entwickeln? Dann bist du bei uns genau richtig!Wir sind Werk 8 – eine kleine, kreative Digitalagentur aus Ludwigsburg bei Stuttgart. Wir glauben daran, dass die besten digitalen Lösungen durch die perfekte Kombination von Kreativität und Technologie entstehen. Unser Team arbeitet jeden Tag daran, digitale Erlebnisse zu schaffen, die performen, inspirieren und skalieren.Ab sofort suchen wir einen Full-Stack Entwickler (m/w/d), der uns für ca. 8 Stunden pro Woche unterstützt. Egal, ob du nebenberuflich, als Werkstudent oder während deiner Elternzeit steuerfrei etwas dazuverdienen möchtest – bei uns hast du die Möglichkeit, in einem flexiblen und modernen Arbeitsumfeld aktiv einzubringen.Direkt bewerbenUnser Tech StackFrameworks – Next.js, React, Gatsby, TailwindCSSHeadless CMS – Prismic, Storyblok, Sanity, Dato CMS, Hygraph, ContentfulProgrammiersprachen – Javascript, Typescript, GraphQLInfrastruktur – AWS, Vercel, Heroku, REST APIOnlineshops: ShopifyDas erwartet dichDu arbeitest selbstorganisiert und flexibel in einem kleinen Team aus UX Architekten, UI Designern, Produktmanagern und Entwicklern.Du entwickelst Features, Templates, React Components und behebst kleinere Bugs im Frontend.Du hast die Freiheit, neue Ansätze zu recherchieren und zu testen, um die beste Lösung zu entwickeln.Du arbeitest mit modernen Tools und agilen MethodenDas bringst du mitDu hast praktische Erfahrung in der Entwicklung mit Next.js, React und TypeScript.Du bist sicher im Umgang mit GitHub, VS Code, etc.Du hast Kenntnisse in semantischem HTML, modernem CSS, SCSS und idealerweise Grundkenntnisse in Barrierefreiheit.Du arbeitest zuverlässig, zielorientiert und hast ein gutes Auge für Design und Ästhetik.Du hast Spaß an moderner Webentwicklung und bringst gerne deine Ideen gerne ein.Deine Vorteile bei unsDu arbeitest von zu Hause aus oder in unserem Office in Ludwigsburg – so, wie es für dich am besten passt.Ein flexibler Minijob, der sich perfekt in deinen Alltag integrieren lässt, ob nebenberuflich, während der Elternzeit oder als Werkstudent.Ein kleines, familiäres Team, das auf Augenhöhe zusammenarbeitet und Wert auf Kreativität, Austausch und gegenseitige Unterstützung legt.Wie bewirbst du dich?Klingt spannend? Dann lass uns ins Gespräch kommen! Schick uns deine Bewerbung mit Arbeitsproben, Lebenslauf und deinem letzten Zeugnis an: join@werk8.deWir freuen uns auf dich!Direkt bewerben"
