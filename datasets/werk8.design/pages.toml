full_description = "Alle ProjekteBündnis Mensch und UmweltNeuer Markenauftritt für das Bündnis Mensch und UmweltLinksbmu-besigheim.deDas Bündnis Mensch und Umwelt (BMU) ist eine parteiunabhängige Wählervereinigung, die sich für eine transparente und offene Kommunalpolitik einsetzt. Schwerpunkte des BMU sind Klimaschutz und soziale Gerechtigkeit.Unter dem Motto „Global denken - lokal handeln“ will die BMU auf lokale Bedürfnisse eingehen und gleichzeitig globale ökologische und soziale Themen aufgreifen. Mit Aktionen vor Ort zeigt es, dass Nachhaltigkeit und soziale Gerechtigkeit zentrale Bestandteile seiner Politik sind. Projekte wie die Förderung erneuerbarer Energien zeigen, dass eine nachhaltige, global denkende Kommunalpolitik mit klaren Visionen und aktiver Bürgerbeteiligung möglich ist.ResultModernes Branding und ikonisches Logo kombiniert mit einer barrierefreien WebsiteFür das BMU haben wir ein modernes Branding entwickelt, das die Grundidee und das Motto des Bündnisses optimal widerspiegelt. Basierend auf den Werten Klimaschutz und soziale Gerechtigkeit haben wir ein durchgängiges Gestaltungsprinzip geschaffen, das die Markenbekanntheit steigert und die Inhalte der Corporate Website nutzerzentriert präsentiert. Darüber hinaus entwickelten wir ein ikonisches Logo, eine harmonische Farbpalette und einen nachhaltigen Bildstil.Neben dem Corporate Design wurde eine nutzerzentrierte und barrierefreie Website entwickelt, die eine intuitive Verwaltung und Pflege der Inhalte ermöglicht und die Performance und Sichtbarkeit in Google verbessert.Der Fokus des Website Relaunches lag zum einen auf der Modernisierung der Technologie und zum anderen auf dem barrierefreien und nutzerzentrierten Zugang zu den relevanten Informationen des BMU. Durch den Einsatz des Headless CMS Systems Hygraph können Inhalte flexibel und einfach auf der Website publiziert werden. Wiederverwendbare Content Bausteine und Content Automation bei der Veröffentlichung von Pressemitteilungen und News Artikeln erhöhen zudem die organische Reichweite.BenefitsSteigerung der Sichtbarkeit und des Bekanntheitsgrades des BMUDas neue Branding bietet dem Bündnis die Möglichkeit, einheitliche Printprodukte zu entwickeln und so einen konsistenten Markenauftritt zu gewährleisten. Die mobil optimierte Website verbessert neben der User Experience auch die redaktionelle Pflege der Inhalte. Dank suchmaschinenoptimierter Texte erreicht die Website eine konstant gute Sichtbarkeit im Google Ranking, was die Bekanntheit des Bündnisses nachhaltig fördert.Insgesamt stärkt der moderne Markenauftritt die Vision des BMU und fördert eine effektivere Kommunikation der Grundwerte Klimaschutz und soziale Gerechtigkeit.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesHTS TENTIQEine einheitliche Web Experience für mehr LeadsWeinlageAufbau einer Personal Brand für die Weinbranche"
