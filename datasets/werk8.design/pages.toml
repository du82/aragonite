full_description = "Alle ProjekteWeinlageAufbau einer Personal Brand für die WeinbrancheLinksweinlage.instagramLisa Riecker ist Weinerlebnisführerin und Wine Guide im WeinSüden Baden-Württemberg. Der Süden wird von der Sonne verwöhnt. Kein Wunder also, dass in Baden-Württemberg die besten Weine wachsen. Von wunderbaren Alltagsweinen bis hin zu edlen Spitzengewächsen ist für jeden Geschmack etwas dabei. Mit ihrem Label Weinlage möchte Lisa die Schönheit der Weinregion am Neckar näher bringen und den Wein-Süden repräsentieren.ResultAuthentisches und flexibles Branding mit regionalem Bezug und starker MarkenidentitätIn enger Zusammenarbeit mit Lisa haben wir für ihr Label Weinlage ein authentisches und erlebbares Branding entwickelt, das die Liebe zum Wein und zur Region Baden-Württemberg visualisiert. Der Fokus lag dabei auf der Positionierung des Labels Weinlage und der Gestaltung eines flexiblen Branding Systems.Zentrales Element des Brandings ist das neu kreierte Logo, das Authentizität und Hingabe visualisiert und Lisa perfekt widerspiegelt. Ob dezent als kleines Signet in leuchtendem Lila oder als Label, der Bezug zur Region ist in jeder Form spürbar. Darüber hinaus haben wir eine moderne Farbpalette und einen neuen Bildstil definiert, der souveräner und ikonischer wirkt.Das einfache und zugleich authentische Gestaltungssystem zeigt, dass mit klaren Gestaltungsprinzipien ein Branding flexibel einsetzbar ist und an allen digitalen und analogen Touchpoints funktioniert.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesCJDInklusive Web Experience für maximale BarrierefreiheitEmpal ConsultingIkonisches Branding für ein Beratungsunternehmen"
