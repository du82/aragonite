["https://werk8.design/work/knebel"]
title = "Knebel - Werk 8 GmbH"
description = "Optimierte Onlineshop-Experience steigert Neukundengewinnung und erhöht Conversionrate durch bessere Navigation und ansprechendes Interface Design"
full_description = "Alle ProjekteKnebelNeue digitale Experience für einen B2C-OnlineshopLinksknebel.deKnebel ist ein Hersteller von Infrarotheizungen für Wohn- und Geschäftsräume. Die Heizlösungen sind energieeffizient, umweltfreundlich und in verschiedenen Designs erhältlich.Briefing & NeedsOptimiertes Shopping Erlebnis zur Steigerung des WarenkorbwertesKnebel beauftragte uns mit der Optimierung ihrer Onlineshop Experience, um die Neukundengewinnung zu fördern, die Conversionrate zu erhöhen und langfristig den durchschnittlichen Warenkorbwert zu steigern. Unser Fokus lag dabei auf der Konzeption und Neustrukturierung der Informationsarchitektur und dem Navigationskonzept des E-Commerce Shops. Ziel war es, die breite Produktpalette von Knebel klar und ansprechend darzustellen, ohne die Nutzer zu überfordern, um diese effizient zu den für sie relevanten Informationen und Produkten zu leiten.ResultVerbesserte Navigationsstruktur für leichtere Produktsuche und Steigerung der ConversionUm diese Ziele zu erreichen, haben wir den Header der Website neu gestaltet, um die Navigation und Zugänglichkeit zu verbessern. Klare Menüpunkte und ein ansprechendes Interface Design helfen den Nutzern, schneller die passenden Produkte zu finden.Zusätzlich haben wir kampagnenspezifische Landingpages entwickelt, die auf verschiedene Produktkategorien und Keywords zugeschnitten sind, um Nutzer gezielt zur Conversion zu motivieren. Die Produktübersicht wurde optimiert, um einen schnellen Überblick über das Gesamtsortiment zu ermöglichen.Alle Maßnahmen führten mittelfristig zu einer Verbesserung der User Experience und einer Erhöhung des durchschnittlichen Warenkorbwertes bei Neukunden.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesDIGITUUFlexible User Experience für die Gastronomie BrancheDIY ProductsShopify Onlineshop für digitale Vertriebsstrategie"
