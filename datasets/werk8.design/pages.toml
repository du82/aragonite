["https://werk8.design/work/cjd-christliche-jugenddorfwerk-deutschlands"]
title = "CJD Website Relaunch - Werk 8 GmbH"
description = "Barrierefreier Web Experience mit Drupal CMS für mehr Inklusion, Zugänglichkeit und Barrierefreiheit"
full_description = "Alle ProjekteCJDInklusive Web Experience für maximale BarrierefreiheitLinkscjd.deDas Christliche Jugenddorfwerk Deutschlands e.V. (CJD) ist einer der größten Bildungs- und Sozialträger Deutschlands und unterstützt Menschen in schwierigen Lebenslagen sowie Personen mit körperlichen oder kognitiven Beeinträchtigungen.Das CJD beauftragte die Agentur 21TORR mit der Entwicklung einer neuen barrierefreien und benutzerfreundlichen Web Experience, um den vielfältigen Bedürfnissen der Nutzer gerecht zu werden. Bei durchschnittlich 15.000 Visits pro Monat und über 700 individuellen Angeboten musste die Website so konzipiert werden, dass sie leicht zugänglich und verständlich ist.ResultAgile Entwicklung im interdisziplinären Team nach dem Design Thinking AnsatzFür die erfolgreiche Umsetzung unterstützen wir 21TORR und arocom in den Bereichen Product Ownership, User Experience und User Interface Design. In einem interdisziplinären Team aus UX Architekten, UI Designer und Full Stack Developer entwickelten wir innerhalb von sechs Monaten eine Plattform, die auf dem Framework und Content Management System Drupal basiert.Mit Hilfe einer vereinfachten Design Thinking Methode haben wir das Projekt in zwei Phasen unterteilt: Die Discover & Define Phase und die Design & Deliver Phase. In der ersten Phase entwickelten wir eine ganzheitliche Produktvision, führten Nutzerbefragungen durch, konzipierten die Informationsarchitektur und kreierten das responsive und barrierefreie Look & Feel. In der zweiten Phase haben wir in einem agilen Setup nach SCRUM die digitale Plattform auf Basis des Produkt-Backlogs entwickelt und die Inhalte aus dem vorherigen System migriert.BenefitsModerne und barrierefreie Website zur Inklusion aller NutzergruppenEin zentrales Element der Website ist die Barrierefreiheit. Das Interface Design wurde so gestaltet, dass es bewusst alle Nutzergruppen einschließt. Auch das Front- und Backend wurde so entwickelt, dass alle WCAG-Richtlinien und Accessibility-Prinzipien erfüllt werden.Das Ergebnis ist eine moderne, barrierefreie Website, die den hohen Anforderungen der digitalen Inklusion gerecht wird. Die neue Web Experience bietet allen Nutzern einen einfachen Zugang zu den Inhalten und unterstützt das CJD dabei, seinen Auftrag - Menschen auf ihrem Weg in ein selbstbestimmtes Leben zu fördern und zu begleiten - noch effektiver zu erfüllen.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesEmpal ConsultingIkonisches Branding für ein BeratungsunternehmenBack on TrackIkonisches Branding für einen zeitgenössischen Gospelchor"
