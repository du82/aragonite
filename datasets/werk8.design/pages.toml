["https://werk8.design/work/cellcentric"]
title = "cellcentric Website Relaunch - Werk 8 GmbH"
description = "Website Relaunch mit Headless CMS für verbesserte User Experience, Usability und Content Management"
full_description = "Alle ProjekteCellcentricEine Digitale Experience Website für klimaneutralen TransportLinkscellcentric.netcellcentric ist ein Joint Venture von Daimler Trucks und Volvo, das 30 Jahre Erfahrung in der Entwicklung, Produktion und Vermarktung von sicheren und effizienten Brennstoffzellensystemen höchster Qualität bündelt und die Marktführerschaft in der Brennstoffzellenentwicklung für Nutzfahrzeuge und Logistik anstrebt. Mehr als 700 Patente sichern den Erfolgskurs und unterstreichen die Technologieführerschaft von cellcentric. Needs & MissionModerne Technologie und verbesserte Web Experience für mehr Agilität und PerformanceNeben der technologischen Entwicklung stellt sich cellcentric auch erfolgreich der Vermarktung und erkannte rechtzeitig die Notwendigkeit, die Grenzen der bisher genutzten Webtechnologien auf Wordpress-Basis zu überwinden, um die Basis zu schaffen, agil auf die Anforderungen in der digitalen Kommunikation reagieren zu können und neue Handlungsspielräume im Marketing zu schaffen.Für cellcentric haben wir den Webauftritt auf ein Headless CMS System umgestellt, das Design hinsichtlich verbesserter User-Interaktion und User-Experience für alle Devices optimiert und den Weg für eine barrierefreie und performanceorientierte Website geebnet.ResultSkalierbares Website Framework und flexible Inhaltspflege mit Headless CMSUnsere Lösung umfasst die technische Entwicklung der Website auf Basis des Headless CMS Systems von Prismic mit der Möglichkeit der Live-Vorschau, der Nutzung wiederverwendbarer dynamischer Inhaltsblöcke, der Pflege formatunabhängiger Daten sowie der Option der Mehrsprachigkeit, die die Erstellung individueller lokaler Website-Inhalte ermöglicht. Die Integration von “SAP Success-Factor” schafft eine nahtlose Schnittstelle zum Bewerbermanagement von cellcentric.Durch den Einsatz skalierbarer Webtechnologien bildet der Relaunch von cellcentric eine sichere Basis für die wachsenden Anforderungen sowohl im Marketing als auch in der Zusammenarbeit mit Kommunikationsagenturen. Datenschutzkonforme Formulare, einfache und schnelle Content-Pflege und die Möglichkeit zur flexiblen Gestaltung von Landingpages geben cellcentric die Werkzeuge an die Hand, um führende Kraftstofftechnologie im Sinne einer klimaneutralen Mobilität zukunftsfähig in allen Kanälen zu vermarkten.Good to knowDetailsBrancheAutomotiveFrameworkPrismicNext.jsReactTypescriptTailwind CSSVercelAlgoliaFormspreeKompetenzenUser Experience (UX)InformationsarchitekturInterface DesignHeadless CMSWeb/App EntwicklungHosting und MaintenanceLifecycle ImprovementsProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesStuttgarter Prominenten-KickerEine digitale Plattform für Tradition und VielfaltKnebelNeue digitale Experience für einen B2C-Onlineshop"
