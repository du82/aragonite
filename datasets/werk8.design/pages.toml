["https://werk8.design/work/klimaplan-besigheim"]
title = "Klimaplan Besigheim - Werk 8 GmbH"
description = "Buch für mehr Klimaneutralität und Klimaschutz in Besigheim"
full_description = 'Alle ProjekteKlimaPlan BesigheimEin Design für mehr KlimaneutralitätLinksallianz-für-beteiligung.deKlimaPlan ist eine Initiative, die sich für den lokalen Klimaschutz einsetzt und das Bewusstsein für die Dringlichkeit des Handelns vor Ort schärft. Langfristiges Ziel ist es, die Stadt Besigheim im Landkreis Ludwigsburg bis 2035 klimaneutral zu machen. Die Initiative hat eine beratende Funktion in der Kommune und zeigt Möglichkeiten auf, sich aktiv am Klimaschutz zu beteiligen.Im Rahmen des Workshops “Klimaleine” haben Bürger:innen über 300 Ideen für mehr Klimaschutz und eine verantwortungsbewusste Zukunft in Besigheim entwickelt. Diese Ideen wurden in dem Buch “Unser Weg zur Klimaneutralität" dokumentiert und visualisiert und stehen nun allen Interessierten, der Stadtverwaltung und allen Bürger:innen von Besigheim zur Verfügung.Needs & BenefitsÄsthetische Buchgestaltung zur Förderung des Umweltbewusstseins und des KlimaschutzdialogsGemeinsam mit der Initiative KlimaPlan haben wir das Konzept und das Design des Buches erarbeitet und entwickelt. Die Herausforderung bestand darin, die Vielfalt der Ideen ansprechend und professionell in einem Printprodukt aufzubereiten.Unser gemeinsames Ziel war es, mit einem ästhetischen und hochwertigen Printprodukt das Bewusstsein für Umweltthemen zu stärken und den Dialog zum Klimaschutz weiter zu fördern. Das Buch würdigt nicht nur die kreativen Lösungen und Ideen der Kommune, sondern dient auch als Inspirationsquelle für zukünftige Projekte und Maßnahmen zur Förderung der Klimaneutralität in der Stadt Besigheim. Durch die hohe Auflage des Buches ist es nun möglich, sich aktiv über die Klimaschutzmaßnahmen zu informieren und sich selbst für den Klimaschutz zu engagieren.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesRing deutscher PfadfinderverbändeNachhaltige Markenentwicklung für das World Scout Jamboree'
