["https://werk8.design/work/back-on-track-gospel-chor"]
title = "Branding für Back on Track Gospelchor - Werk 8 GmbH"
description = "Back on Track Gospelchor vereint Gospel, R'n'B und Jazz in einem ikonischen Corporate Design. Erlebe Musik und Design auf analogen und digitalen Kanälen"
full_description = "Alle ProjekteBack on TrackIkonisches Branding für einen zeitgenössischen GospelchorLinksBack on Track InstagramBack on Track ist ein Gospelchor aus Stuttgart unter der Leitung von Christoph Gärtner. Der Chor mit etwa 40 Sänger lebt modernen Gospel, R'n'B und Jazz Sound und ist unter anderem bekannt von seinen Events in der Jazzkiste in Stuttgart.CHALLENGEEin einheitliches und authentisches Corporate DesignZiel war es, ein ikonisches Corporate Design zu entwickeln, das die Essenz des Gospels und die Energie des Jazz visuell transportiert. Der neue Markenauftritt soll auf verschiedenen analogen und digitalen Kanälen funktionieren und unter anderem für die Vermarktung der anstehenden Konzerte und Events genutzt werden.Das neue, markante Logo visualisiert ideal die Kernwerte des Gospel “Love, Joy and Peace”. Neben dem Logo haben wir ein einfaches Gestaltungsprinzip entwickelt, das perfekt mit der neuen Schrift harmoniert und den typischen Charakter des Gospelchors unterstreicht. SOLUTION & ResultAuthentisches Branding mit WiedererkennungswertDas flexible Corporate Design nutzt Back on Track derzeit für verschiedene Promotion-Aktionen wie die Veranstaltungsreihe “Gospel in der Kiste” im Stuttgarter Jazzclub Kiste oder das einmal jährlich stattfindende Weihnachtskonzert “Gospel Session” in der Stuttgarter Friedenskirche. Trotz der unterschiedlichen Markenauftritte der einzelnen Veranstaltungen erkennt man die Zugehörigkeit zum Back on Track Gospelchor. Solution & RESULTTradition trifft modernes Design SystemFür die Konzerte von Alana Alexander in Deutschland haben wir ein einfaches Design System entwickelt, um die Veranstaltungen auf verschiedenen digitalen und analogen Kanälen zu bewerben. Die in New York aufgewachsene Sängerin Alana ist mit ihrer Band bekannt für Gospel, R'n'B (Rhythm and Blues) und Jazz. Der Markenauftritt besteht aus einer Jazz-inspirierten Farbpalette, einer markanten Schriftart und weiteren grafischen Elementen, die eigenständig funktionieren und gleichzeitig die Charakteristika des R'n'B und Soul visualisieren.ProjektanfragenLet’s connectWo auch immer Sie stehen oder wohin auch immer Sie gehen wollen – es ist an der Zeit, loszulegen.Tobi SausseleGründer und Managing Directort.saussele@werk8.de+49 7143 3308076LinkedInWeitere CasesKlimaPlan BesigheimEin Design für mehr KlimaneutralitätRing deutscher PfadfinderverbändeNachhaltige Markenentwicklung für das World Scout Jamboree"
