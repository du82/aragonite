["https://werk8.design/news/barrierefreie-websites"]
title = "Barrierefreie Websites bis 2025 - Werk 8 GmbH"
description = "Hier finden Sie die gesetzlichen Bestimmungen und Richtlinien, die Sie für eine barrierefreie Website ab Juni 2025 einhalten müssen."
full_description = 'Alle News30. August 2024Barrierefreie Websites bis 2025Finden Sie heraus, welche gesetzlichen Anforderungen bis Mitte 2025 für barrierefreie Websites umgesetzt sein müssen.Was ist Barrierefreiheit bei WebsitesDie Barrierefreiheit stellt sicher, dass alle Menschen eine Website uneingeschränkt nutzen können. Um Barrierefreiheit zu gewährleisten, muss jeder Mensch eine Website verstehen, bedienen und mit ihr interagieren können. Allein in Deutschland leben fast 12 Millionen Menschen mit Behinderungen. Das sind fast 15 Prozent der deutschen Bevölkerung. Die Zahl der Menschen mit Behinderungen steigt mit zunehmendem Alter. Damit wächst auch die Zahl der Menschen, die darauf angewiesen sind, zum Beispiel ihr Online-Banking nur mit der Tastatur bedienen zu können oder die Schriftgröße auf Webseiten zu verändern.Vier Prinzipien der BarrierefreiheitSeit 2018 gibt es die “Vier Prinzipien der Barrierefreiheit” (engl. POUR Principles of Accessibility), die als internationaler Standard für barrierefreie Webinhalte (engl. Web Content Accessibility Guidelines, kurz WCAG) gelten. Erfüllt eine Website alle vier Prinzipien, können Menschen mit Behinderungen die Inhalte ohne größere Schwierigkeiten und grundsätzlich ohne fremde Hilfe nutzen. Wahrnehmbar (Perceivable) – Inhalte müssen so präsentiert werden, dass sie für die Nutzer wahrnehmbar sind. Das bedeutet, dass Inhalte mit ausreichendem Farbkontrast veröffentlicht werden und Bilder mit entsprechenden Alternativtexten (alt-Text) versehen werden. Bedienbar (Operable) – Nutzer müssen in der Lage sein, die Website mit all ihren Navigationselementen bedienen zu können, zum Beispiel über die Tastatur oder gut erkennbare Links.Verständlich (Understandable) – Informationen und Bedienelemente müssen klar und verständlich sein. Das bedeutet, dass die Nutzer in der Lage sein müssen, sowohl die Informationen als auch die Bedienung mithilfe einfacher Sprache oder einer konsistenten Navigation zu verstehen. Robust – Inhalte müssen robust genug sein, dass die Nutzer jederzeit in der Lage sind, mit verschiedenen Techniken und Assistenten zuverlässig auf die Inhalte zuzugreifen. Das bedeutet, dass Inhalte auch dann zugänglich bleiben müssen, wenn sich die Technik und die Websuche weiterentwickeln.Gesetzliche Grundlage zur digitalen BarrierefreiheitAb Mitte 2025 werden barrierefreie Websites durch das Barrierefreiheitsstärkungsgesetz (BFSG) gesetzlich vorgeschrieben. Das Gesetz schreibt vor, digitale Angebote barrierefrei zu gestalten. Die gesetzliche Verpflichtung zur Barrierefreiheit gilt für alle Unternehmen mit mehr als zehn Mitarbeitern oder einem Jahresumsatz von mehr als zwei Millionen Euro. Private und rein gewerbliche Anbieter digitaler Dienste (B2B, Business to Business) fallen nicht unter das Barrierefreiheitsgesetz. Verstößt ein Unternehmen gegen das Barrierefreiheitsstärkungsgesetz, drohen empfindliche Strafen mit Bußgeldern von mehreren tausend Euro. Was Unternehmen droht, die keine barrierefreie Website betreiben, zeigt ein Blick in die USA. Dort ist digitale Barrierefreiheit durch den “Americans with Disability Act” schon lange vorgeschrieben und gehört zum Alltag. So musste die Supermarktkette Target nach einem Bericht des Handelsblatts zwölf Millionen Dollar Strafe zahlen, weil ihre Website nicht vollständig barrierefrei war. Auch die Lieferkette Domino’s Pizza wurde verklagt, weil sehbehinderte Menschen online keine Pizza bestellen konnten. Wie Unternehmen ihre Website barrierefrei machenUnternehmen können ihre Website barrierefrei machen, wenn sie die “Vier Prinzipien der Barrierefreiheit” von den Web Content Accessibility Guidelines (WCAG) umsetzen. Das bedeutet zum Beispiel, dass Menschen mit Sehbehinderungen Texte und Formularfelder auf der Website durch ausreichenden Farbkontrast zum Hintergrund erkennen können gehörlose und schwerhörige Menschen Videos nutzen können, wenn diese mit Untertiteln versehen sindBlinde Menschen können die Website nutzen, indem Bilder, Formulare und Schaltflächen textlich beschrieben werden. Für das BFSG regelt die Norm EN 301549 die Barrierefreiheit von Websites. Die Norm stellt sicher, dass digitale Angebote im Sinne des European Accessibility Act (EAA) barrierefrei sind. Neben den technischen Änderungen müssen Unternehmen auch eine “Erklärung zur Barrierefreiheit" und ein Kontaktformular zur Meldung von digitalen Barrieren veröffentlichen.Barrierefreiheit von Websites testenDer wohl umfassendste Test zur Barrierefreiheit in Deutschland ist der BITV-Test der Initiative BIK (“Barrierefrei informieren und kommunizieren”). Der Test prüft alle Anforderungen, die in der BITV 2.0 definiert sind. Parallel dazu gibt es den WCAG-Test, der aber weitgehend alle Anforderungen abdeckt, die auch im BITV-Test geprüft werden.Da die offiziellen Tests sehr aufwändig und kostenintensiv sind, empfiehlt es sich, für eine erste Einschätzung der Barrierefreiheit auf kostenlose Tools und Schnelltests zurückzugreifen. Im Folgenden sind die bekanntesten Tools zum Testen digitaler Barrieren aufgeführt.WAVE Web Accessibility Evaluation ToolsLanguageTool Contrast CheckeraccessScanAccessibility CheckerDie Web Accessibility Initiative (WAI) bietet eine umfassende Liste verschiedener Werkzeuge, mit denen die Barrierefreiheit von Webseiten getestet werden kann. Bitte beachten Sie, dass keines dieser Tools einen offiziellen Test oder eine andere Qualitätskontrolle ersetzen kann.Häufige FragenWas ist der European Accessibility Act (EAA)?Der European Accessibility Act (EAA) ist die Richtlinie, die Gesetze und Verordnungen zur Sicherstellung der Barrierefreiheit in der EU erlässt. In Deutschland wurde der EAA in Form des Barrierefreiheitsstärkungsgesetzes (BFSG) in nationales Recht umgesetzt und betrifft digitale Angebote für die Personenbeförderung, Telefonie- und Messaging-Dienste sowie den Online-Handel.Was regelt die Norm EN 301 549?Die europäische Norm EN 301 549 stellt sicher, dass Produkte und digitale Angebote, die unter den European Accessibility Act fallen, barrierefrei sind. Für Websites und Onlineshops verweist die Norm direkt auf den internationalen Standard für barrierefreie Webinhalte (engl. Web Content Accessibility Guidelines, WCAG).Was ist das Barrierefreiheitsstärkungsgesetz?Das Barrierefreiheitsstärkungsgesetz (BFSG) ist die Umsetzung des European Accessibility Act (EAA) in nationales Recht. Es wurde Mitte Juni 2021 verabschiedet und tritt in Deutschland am 28. Juni 2025 in Kraft. Das BFSG verpflichtet Unternehmen, ihre Webseiten und digitalen Angebote barrierefrei zu gestalten.Was ist die Barrierefreie-Informationstechnik-Verordnung (BITV)?Die Barrierefreie-Informationstechnik-Verordnung (BITV) ist eine Verordnung, die die Anforderungen an die Barrierefreiheit von Websites der öffentlichen Verwaltung des Bundes enthält. Die BITV verweist auf die Norm EN 301 549, die wiederum auf die WCAG-Richtlinien verweist.'
