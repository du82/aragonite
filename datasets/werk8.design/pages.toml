title = "Leichte vs. Einfache Sprache - Werk 8 GmbH"
description = "Entdecken Sie die Unterschiede zwischen Leichter und Einfacher Sprache und wie sie barrierefreie Kommunikation für verschiedene Zielgruppen unterstützen."
full_description = "Alle News25. Oktober 2024Leichte und einfache Sprache: Was ist der UnterschiedBarrierefreie Kommunikation gewinnt immer mehr an Bedeutung. Leichte und Einfache Sprache spielen dabei eine wichtige Rolle. Obwohl beide Sprachformen oft miteinander verglichen werden, gibt es doch deutliche Unterschiede. In diesem Artikel erläutern wir die wichtigsten Unterschiede und geben einen Überblick über die wichtigsten Merkmale der Leichten Sprache und was sie von der Einfachen Sprache unterscheidet.Was ist der Unterschied zwischen Leichter und Einfacher SpracheLeichte Sprache Leichte Sprache ist die am stärksten vereinfachte Form der deutschen Sprache und streng geregelt. Sie richtet sich vor allem an Menschen mit geistiger Behinderung, Demenz oder eingeschränktem Sprachverständnis. Für die Erstellung solcher Texte gibt es bereits verschiedene Standards wie die Richtlinien der BITV 2.0 (Barrierefreie Informationstechnik-Verordnung), des Netzwerks Leichte Sprache e.V. oder der Forschungsstelle Leichte Sprache an der Universität Hildesheim. Alle diese Grundlagen enthalten konkrete Anforderungen an den Satzbau, die Wortwahl und das Layout, um ein Höchstmaß an Verständlichkeit zu gewährleisten.Einfache SpracheDie Leichte Sprache hingegen ist weniger streng reglementiert und orientiert sich stärker an der allgemeinen Standardsprache. Sie wird in verschiedenen Schwierigkeitsgraden verwendet und richtet sich vor allem an Menschen aus bildungsfernen Schichten, Deutschlernende oder Menschen mit leichten Sprachbehinderungen. Einfache Sprache bietet mehr Flexibilität, da sie an die jeweilige Zielgruppe angepasst werden kann und sich nicht an Richtlinien halten muss.Welche Regeln gibt es für Leichte und Einfache SpracheFür die Leichte Sprache gibt es, wie bereits beschrieben klare Vorschriften, die zum Beispiel beinhalten:Ein Satz darf nur eine Aussage enthalten.Sätze müssen kurz und verständlich sein, meist nicht länger als zwei Zeilen bei einer Schriftgröße von mindestens 14.Komplexe Wörter oder Fachbegriffe sollen vermieden werden, und der Text wird häufig durch Illustrationen ergänzt, die das Verständnis unterstützen.Einfache Sprache folgt diesen strengen Vorgaben nicht, doch es gibt Empfehlungen zur Verbesserung der Verständlichkeit. In der Praxis wird daran gearbeitet, auch für Einfache Sprache DIN-Normen wie die DIN 8581-1 zu etablieren, um eine einheitliche Grundlage zu schaffen.Was sind die Zielgruppen von Leichter und Einfacher SpracheLeichte Sprache richtet sich in erster Linie an Menschen mit geistiger Behinderung, Demenz, Aphasie sowie an Personen mit einer Hörbehinderung, deren Muttersprache die Deutsche Gebärdensprache ist. Diese Sprachform ermöglicht ihnen, wichtige Informationen barrierefrei zu erfassen.Zielgruppen für die Leichte SpracheEinfache Sprache hingegen ist ideal für Menschen mit fortgeschrittenen Deutschkenntnissen, bildungsferne Schichten und Jugendliche mit Deutsch als Zweitsprache. Sie eignet sich auch für öffentliche Institutionen oder kulturelle Einrichtungen wie Museen, wo auch Personen mit guten Sprachkenntnissen von verständlich aufbereiteten Texten profitieren.Wie entstehen Leichte und Einfache SpracheDie Erstellung von Texten in Leichter und Einfacher Sprache folgt unterschiedlichen Prozessen. Leichte Sprache wird in der Regel von der Hauptzielgruppe – Menschen mit geistiger Behinderung oder Lernschwierigkeiten – überprüft, um sicherzustellen, dass die Inhalte verständlich sind. Organisationen wie das Netzwerk Leichte Sprache e.V. oder Inclusion Europe schreiben vor, dass solche Texte von mindestens zwei Personen aus der Zielgruppe geprüft werden. Diese Überprüfung erfolgt häufig durch lautes Vorlesen und das Stellen von Verständnisfragen, um herauszufinden, ob der Text klar und nachvollziehbar ist.Bei Einfacher Sprache hingegen wird die Zielgruppe nicht immer systematisch in den Erstellungsprozess eingebunden. Es gibt jedoch Anbieter, die auch hier Prüfgruppen nutzen, zum Beispiel Jugendliche mit Deutsch als Zweitsprache. Da Einfache Sprache flexibler ist und weniger strenge Regeln befolgt, wird sie oft an die jeweilige Zielgruppe angepasst, um die Verständlichkeit zu optimieren.In den letzten Jahren kommen zunehmend KI-basierte Tools zum Einsatz, die Texte in Leichte oder Einfache Sprache umwandeln sollen. Besonders bei Leichter Sprache ist jedoch Vorsicht geboten, da die künstliche Intelligenz den menschlichen Prozess der Vereinfachung noch nicht vollständig ersetzen kann. Es ist wichtig, dass bei der Erstellung von Leichte-Sprache-Texten nicht nur die sprachliche Vereinfachung, sondern auch das Weltwissen der Zielgruppe berücksichtigt wird, um sicherzustellen, dass der Inhalt wirklich verständlich ist.Beispiele für Einfache und Leichte SpracheIm folgenden zeigen wir zwei einfache Beispiele, um die Unterschieden zwischen Einfacher und Leichter Sprache abzubilden.1. BeispielEinfache SprachePeter ist krank, weil er gestern zu leicht angezogen war.Leichte SpracheGestern war Peter den ganzen Tag draußen.Peter hatte nur eine Jacke an. Die Jacke war sehr dünnDeshalb war Peter sehr kalt.Und deshalb ist Peter heute krank2. BeispielEinfache SpracheWenn Sie Fragen haben, rufen Sie uns bitte unter dieser Nummer an: XXXLeichte SpracheVielleicht haben Sie Fragen.Dann rufen Sie uns an.Unsere Nummer ist:XXXSowohl Leichte als auch Einfache Sprache spielen eine wichtige Rolle bei der digitalen Zugänglichkeit. Leichte Sprache ermöglicht es Menschen mit kognitiven Einschränkungen, wichtige Informationen zu verstehen, während die Einfache Sprache eine breitere Zielgruppe anspricht. Wenn Sie mehr über Leichte und Einfache Sprache erfahren möchten, finden Sie viele Informationen auf dem Blog von Andrea Halbritter.Häufige FragenWas sind die Zielgruppen Einfacher und Leichter Spracher?Leichte Sprache richtet sich in erster Linie an Menschen mit geistiger Behinderung, Demenz, Aphasie sowie an Menschen mit Hörbehinderung, deren Muttersprache die Deutsche Gebärdensprache ist. Einfache Sprache hingegen ist ideal für Menschen mit fortgeschrittenen Deutschkenntnissen, bildungsferne Schichten und Jugendliche mit Deutsch als Zweitsprache. Sie eignet sich auch für öffentliche und kulturelle Einrichtungen.Welche Regeln gibt es für Leichte Sprache?Leichte Sprache ist stark reglementiert. Für die Erstellung gibt es verschiedene Richtlinien wie die BITV 2.0 (Barrierefreie Informationstechnik-Verordnung), die Standards des Netzwerks Leichte Sprache e.V. oder das Regelwerk der Forschungsstelle Leichte Sprache an der Universität Hildesheim. Alle diese Grundlagen enthalten konkrete Anforderungen an Satzbau, Wortwahl und Layout, um ein Höchstmaß an Verständlichkeit zu gewährleisten.Welche Regeln gibt es für Einfache Sprache?Die Einfache Sprache folgt keinen strengen Regeln, aber es gibt Empfehlungen zur Verbesserung der Verständlichkeit. Derzeit wird daran gearbeitet, auch für die Einfache Sprache Normen und Richtlinien wie zum Beispiel die DIN 8581-1 zu etablieren, um eine einheitliche Grundlage zu schaffen."
