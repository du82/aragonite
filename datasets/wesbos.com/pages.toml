["https://wesbos.com/javascript/04-the-dom/creating-html"]
title = "Creating HTML - Beginner JavaScript - Wes Bos"
full_description = '''Creating HTMLEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, DOMEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk5 { color: #FF628C; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } In this lesson, we will learn about creating elements. Create the file creating.js within the 20 - The DOM folder. In the index.html file we have been using so far, replace the script source to point to creating.js instead of the-dom.js, as shown below 👇 <script src="./creating.js"></script> There are a few ways to create HTML in JavaScript. The main way is using document.createElement(). Let's look that up in MDN. To use this method, you pass it a tagName and then there are optional options you can pass (you can tell it's optional because of the square brackets), which we won't be using. Let's try to make a paragraph tag using this method. const myParagraph = document.createElement('p'); console.log(myParagraph); When you open the HTML file, you will see the paragraph in the console but it is not visible on the page. That is because we haven't actually put it on the page yet, we just created it and it's living in what is called memory right now. There is no shortcut to create an element with a class or with a set attribute, so something like the code below would not work 👇 const myParagraph = document.createElement('p.special[title="hey"]'); If you want to add or get attributes from it, you must instead do it the way we have learned, as shown below 👇 const myParagraph = document.createElement('p'); myParagraph.textContent = 'I am a p!'; myParagraph.classList.add('special'); console.log(myParagraph); We now have that paragraph with a class of special and the text content that we supplied it with. Let's create a few more elements before we get into how to actually insert them into the DOM. First create an image element as shown below 👇 const myImage = document.createElement('img'); myImage.src = "https://picsum.photos/500"; myImage.alt = "Nice photo"; console.log(myImage); Next, create a div with a class of wrapper and log it. const myDiv = document.createElement('div'); myDiv.classList.add('wrapper'); console.log(myDiv); Now we have created 3 elements: a paragraph an image div How do we add it to the page? We use another API called appendChild. To use it, you have to first select an element to call .appendChild() against. If you want to add the element directly into the body, you can grab the document.body and insert it. document.body is available to us because the document element gives us access to the body element quickly via a property. Not every element is as easily accessible to us like body is. Let's look up appendChild() in MDN. It takes in one parameter, which is a child reference. document.body.appendChild(myParagraph); This gives us a p tag right before the closing body tag. appendChild() can be called against any node, so we can do something as shown in the code below 👇 document.body.appendChild(myDiv); myDiv.appendChild(myParagraph); myDiv.appendChild(myImage); It is probably better to do that in reverse order. Why? Everytime you use appendChild() you are modifying the DOM, which causes something called a reflow in the browser, which tells the browser that something has changed and that the browser needs to repaint the HTML. This means that if you call appendChild() 3 times in a row, you are causing the browser to re-render 3 times in a row. That can start to eat into other things on the page and degrade the user experience. To solve that, you could modify the code like so 👇 myDiv.appendChild(myParagraph); myDiv.appendChild(myImage); document.body.appendChild(myDiv); What we are doing here is: we are creating the elements and inserting the paragraph inside of the div then we are inserting the image inside of the div as well finally, we call document.body.appendChild(myDiv) last to modify the DOM This approach causes the browser to re-paint only once as opposed to 3 times in the earlier approach. (Technically, the browser is doing 2 repaints, once when you dump the div in and the second time when the image loads, that's not the end of the world, that is how the browser works.) That is one way to go ahead and create elements, using the createElement() API. append method You may come across the .append() method when searching for how to add an element to the DOM, which works very similarly to createElement. However, append() doesn't seem to be fully supported in Internet Explorer so Wes suggests holding off on using it. insertAdjacentElement method There is another API, insertAdjacentElement, that Wes is fond of using. It works similarly to insertAdjacentText() which we looked at in a previous lesson and is used to add text before, after and inside elements. The difference is insertAdjacentElement is used to insert elements before, after and inside other elements. This is handy when you need to do something like insert an element before a paragraph in a div. const heading = document.createElement('h2'); heading.textContent = 'Cool things'; myDiv.appendChild(heading); If you try using appendChild as shown in the code above 👆, you should see that the heading is inserted after the image (as shown below 👇) which is not what we want. insertAdjacentElement() takes two parameters: the position of where you want to insert the element the element you want to insert. myDiv.insertAdjacentElement('afterbegin', heading); That will put the heading before the paragraph and image tag. If you were to use beforebegin, it would insert the header before the div tag, as a sibling to the wrapper. That may be something you will need to use. Let's say you have a few cards and you need to add something after the first card. You can grab the second card and use beforebegin to insert an element before it. Generating An Unordered List Let's do one more example. In this example, we will create an unordered list with 5 items in it, using all the APIs we have learned so far. The outcome should look like the code shown below 👇 <ul> <li>one</li> <li>two</li> <li>three</li> <li>four</li> <li>five</li> </ul> Start with the middle one and then try to insert one before, however you can make use of all the APIs that we have gone over. Pause the video here and try to create that and inject it into the DOM. Once you have tried that, continue on. First, create the unordered list. Next, create the third list item and append it to the list. NOTE: If this seems like a lot of code to make an unordered list, well it is, we will go over in the next section how we can write a bit of html in a string and inject it in. const list = document.createElement('ul'); const li = document.createElement('li'); li.textContent = 'three'; list.appendChild(li); document.body.insertAdjacentElement('afterbegin', list); Next, create the other list item which we will add using append(), like so 👇 const li5 = document.createElement('li'); li5.textContent = 'Five'; list.append(li5); There is the ability to clone a Node which we could do as shown below 👇 const li1 = li5.cloneNode(); list.insertAdjacentElement('afterbegin', li1); What that code will do is it will create a clone of the li5 Node, and then insert that clone adjacently. If you reload the page, you will see that we added the element but it is empty. If you take a look at the docs for cloneNode(), you will see that it accepts a parameter of "deep" which specifies whether to clone the child nodes or not. You may be wondering "well isn't text part of the element?", and no, it is actually a child of the element. Since the text is not wrapped in a separate element (like a span or p tag), that makes it just a regular node. That means we need to pass true when using cloneNode to include the text, as shown below 👇 const li1 = li5.cloneNode(true); li1.textContent = 'one'; list.insertAdjacentElement('afterbegin', li1); In this instance cloneNode() wasn't much more efficient to use, but it generally is. If you are trying to clone an element that has a lot of attributes set on it, and want to copy those over as well, it is much more efficent to use cloneNode. Now that we have 1, 3 and 5, how do we inject 2 and 4? const li4 = document.createElement('li'); li4.textContent = 'Four'; li5.insertAdjacentElement('beforebegin', li4); We will use beforebegin 👆because we want four to go beside the 5th one. FInally for two, we can use afterend to insert it after the first list item, as shown in the code below 👇 const li2 = document.createElement("li"); li2.textContent = "Two"; li1.insertAdjacentElement("afterend", li2); That was a good practice exercise because we used all the different APIs available to us to create elements, set the contents and insert them in different ways. In the next video, we will look at how we can use backticks and strings to generate the HTML.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevBuilt-in and Custom Data AttributesNext →HTML from Strings and XSS'''
