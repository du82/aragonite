full_description = '''Browser, Editor and Terminal SetupEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, Browser, TerminalEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } Let's talk real quick about setup and the tools you need. You can skip this video if you know the three things: Which browser you would like to use (as well as how to open the dev tools) You already have Node.js and NPM installed. You have an editor that you like (such as VSCode). If you already have those things in place, skip this video and move onto the next one. Wes will just be introducing all three of those and talking about his personal choices behind them. The browser Let's get into the browser. You can use Firefox, Chrome, any browser you like because we are just writing JavaScript. The important thing here is that we will be using the developer tools. Both Firefox and Chrome have very good web developer tools. Wes will likely be using Chrome throughout the course. Things you need to know is how to do open the dev tools. You can just right click and select "Inspect Element", which will show you the DOM, and you can click over to the console. Shortcuts It's worth learning the shortcuts to quickly open up developer tools, inspect element and the console. That way you can really quickly open it. To find the shortcuts, in Chrome you go to View > Developer and then you can see the shortcuts. In Firefox, you click on the hamburger menu and go to Web Developer > and then you will see the shortcuts for Inspector and Web Console, which is the two we will be using. Node.js Next up, we need Node.js. In order to install Node.js, go to https://nodejs.org and install the latest version. Don't pay attention to the version numbers, those will change depending on when you take the course. The stuff that we are covering is not dependent on what version of node you use. We aren't writing Node.js websites in this course, instead a lot of tooling, bundling, formatting, etc. uses Node.js under the hood so we need to have it installed. Checking if Node.js is installed How do you know if you have it installed or not? You can go ahead and install it again and all that will do is update your Node.js to the current version if you already had it installed. Another way to check is to open up a terminal window. Which Terminal to Use You can use the built in terminal application which on a Mac you can find under Applications > Utilities > Terminal. Wes is using a terminal called Hyper for his terminal. You can also use the terminal in VSCode. You can use iTerm. They are all the same terminal at the end of the day. If you want to know what theme Wes is using, you can go to https://wesbos.com/uses and that will give you the links to all of the different themes and things he is using. On Windows, the terminal is called Command Prompt. You can access this by going to Start > All Programs > Accessories > Command Prompt. There is another terminal for Windows called Cmder. How do you know once you have a terminal open? You can go ahead and type node -v in the terminal and press enter. That will let you know what version you have installed. Checking if you have npm installed You need to also check that you have NPM installed. You can do that using npm -v, which will tell you what version of NPM you have installed. As long as you have something greater than 10 for node and 6 for npm, you should be fine. Wes wants to avoid going down any rabbit holes regarding complex tooling and best ways to do things. You just need to have it installed and it will be working. Command Line Basics Now we will do some command line basics in case you are not familiar with working in the command line. There are a couple of commands you need to know in order to run our JavaScript and bundles. Basic Commands cd - this means change directory ls -l (mac), dir (windows) - this will list out all of the files and directories under the current directory pwd - print working directory will give you something like /Users/wesbos/beginner-JavaScript/exercises cd .. - go up a level in the current directory (examples of the above commands visible in image below)👇 In this example, Wes is in the beginner-javascript directory, and he uses the command ls -l to see what other directories he has nested inside his current directory. He can use the cd command to change directories into the /exercises directory by typing in cd exercises. Note: If you want to learn how to customize your terminal, you can go to https://commandlinepoweruser.com to take a quick course of Wes' to get you up and running with a cool terminal that shows the prompt and current working directory like Wes' does. That is not part of this course, just for those who are curious. Other things to know is how to go up a level in a directory. You can do that using cd ... That is all we need to know right now. Check that Node.js is working If you want to see if your Node.js is working, you can type node in the terminal and that will give you a caret which will load up a REPL which is a read-eval-print loop. That is essentially the console. You can do 1+1 and press enter and the console will evaluate that to 2. Once you have run the node command, to get back to the terminal you have to press CTRL + C a few times. Other helpful things are: cmd + k or cmd + r (mac) or ctrl + k or ctrl + r (windows) - will clear out the console. (this works in Chrome dev tools console as well) Code Editor Finally we are on the topic of the editor. Wes highly recommends you use VSCode because he thinks it's the best editor for writing JavaScript in. You may have different opinions. In terms of tooling, Wes feels that VSCode is the best. We will be looking at some extensions to use to format JavaScript properly. Again if you want to know what theme Wes is using, refer to https://wesbos.com/uses.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevWelcomeNext →Running and Loading JavaScript'''
