title = "Types - Booleans and Equality - Beginner JavaScript - Wes Bos"
full_description = '''Types - Booleans and EqualityEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, Types, Booleans, Equality CheckingEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk5 { color: #FF628C; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } The final type in JavaScript is called a boolean. A boolean is either true or false, it's like a light switch, it's on or off and that is it. We use booleans for logic such as if statements in our JavaScript code. Booleans can be manually set or calculated. Let's take a look at some examples. Comment out all the code you have added to types.js so far and add 👇 let isDrawing = false; Let's say we want to know if the user is moving their mouse and if they are currently clicking down or up. To do that, we can use a flag variable, which is a variable that is either set to true or false. When the user clicks down, we set it to true and when they click up, we set it to false. That is what a boolean is -- something that is either true or false. We can also calculate booleans. For example, if we have an age variable that is set to 18, and another variable called ofAge that has the value of age > 19, if you console log ofAge, it will return false. const age = 18; const ofAge = age > 19; console.log(ofAge); Sometimes values are calculated, like for ofAge. We will talk later about the greater than, less than and equal to operators. Equality (equal sign, double equal sign, triple equal sign) For now, we will just focus on equality which is the equal sign, double equal sign and triple equal sign. One equal sign = is used to assign a value to a variable. const age = 100; For double equals == and triple equals ===, know that you should almost always be using triple equals. There are some edge cases where you can use double equals, but almost all the time it's better to use triple equals. If you take the age variable in the console and do the following age === 100 will return true age === 10 will return false That is what Wes means by booleans can be calculated as well. You have 1 value, which can be a straight up value 100 === 10 or it can be a value that is stored in a variable age === 100 or it can be two variables. Add let age2 = 100; in types.js, and refresh the HTML page in the browser. Now you can do age === age2 which will return true. 👇 What is happening there is the browser is checking the value of the first variable and then it checks the value of the second one, to make sure they are exactly the same. What would happen if instead we did 10 == 10, with a double equals? It would return true. 👇 Why are there two different ways to check for equality? Triple equal will check that the value of the thing on the left hand side and the right hand side are the same, AND it will check that the types of the thing on the left and on the right are the same. Triple equals will always check for both value and type. In the examples above, the types were numbers. What if you were to do "10" == 10? The console would return true. Why? Because the value is the same, but the types are not. If you did "10" === 10, it would return false. 👇 This is one of the examples where you can get into hot water by mixing strings and numbers when doing addition. You should almost always be working with the same type. The same is true with equality. It's easy to get into hot water if you are checking if a string and a number are the exact same thing. === always checks that the value and type are exactly the same. In a future video, we will go over something called "flow control", which is if, ternary, and switch statements. These booleans will be particularly helpful for those videos. We will also be extending what we learned here a little bit further into things like truthy and falsy values, as well as this thing called coercion which is where you have one type of value and you want to force it into another type of value.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevTypes - Null and UndefinedNext →Functions - Built-in'''
