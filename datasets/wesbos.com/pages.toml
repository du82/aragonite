title = "Click Outside Modal - Beginner JavaScript - Wes Bos"
full_description = '''Click Outside ModalEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, ExercisesEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtki { font-style: italic; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk7 { color: #3AD900; } .cobalt2 .mtk6 { color: #FFEE80; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk4 { color: #0088FF; } .cobalt2 .mtk11 { color: #FB94FF; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } In this lesson we are going to learn how to check whether you clicked outside an element, which kind of tough. Let's look at the HTML we will be working with. <body> <div class="cards"> <div class="card" data-description="Wes is cool"> <img src="https://picsum.photos/200?random=1" alt="Wes Bos"> <h2>Wes Bos</h2> <button>Learn more →</button> </div> <div class="card" data-description="Scott is neat!"> <img src="https://picsum.photos/200?random=2" alt="Wes Bos"> <h2>Scott Tolinski</h2> <button>Learn more →</button> </div> <div class="card" data-description="Kait is beautiful!"> <img src="https://picsum.photos/200?random=3" alt="Wes Bos"> <h2>Kait Bos</h2> <button>Learn more →</button> </div> <div class="card" data-description="Snickers is a dog!"> <img src="https://picsum.photos/200?random=4" alt="Wes Bos"> <h2>Snickers the dog</h2> <button>Learn more →</button> </div> </div> <div class="modal-outer"> <div class="modal-inner"> </div> </div> <script src="./click-outside.js"></script> </body> As you can see, each card has a random image, an h2 and a button that says "learn more". Let's add the following CSS 👇 <style> .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); grid-gap: 20px; padding: 2rem; } .card { background: white; padding: 1rem; border-radius: 2px; } .card img { width: 100%; } .card h2 { color: black; } </style> That looks good. Moving onto the modal, add some dummy content inside of it so when we style it we can visualize what it will look like. <div class="modal-outer"> <div class="modal-inner"> <p>Testing 123</p> </div> </div> As you can see, there are two nested divs each with a class ofmodal-inner or modal-outer. Go ahead and style the modal in the on position and then we will turn it off with CSS. 👇 .modal-outer { display: grid; background: hsla(50, 100%, 50%, 0.7); position: fixed; height: 100vh; width: 100vw; top: 0; left: 0; justify-content: center; align-items: center; } .modal-inner { max-width: 600px; min-width: 400px; padding: 2rem; border-radius: 5px; min-height: 200px; background: white; } Now you have this modal which will pop up and you want to be able to close it. Let's just do a really quick example to demonstrate how this works. We need to hide the modal by default. There are LOTS of different ways you could do that, such as display: none, visibility: hidden, or something that Wes likes to do is give it an opacity:0, which won't cut it in our case. That is because even if you did give the modal an opacity of 0, you will see that the modal will prevent the other elements from being clicked like that buttons. That is because the modal-outer is actually still there, even if you give it an opacity of zero. What you can do is give modal-outer a pointer event of none like so 👇 .modal-outer { display: grid; background: hsla(50, 100%, 50%, 0.7); position: fixed; height: 100vh; width: 100vw; top: 0; left: 0; justify-content: center; align-items: center; /* hide this modal until we need it */ opacity: 0; pointer-events: none; } That tells the browser to just ignore that any events that come to that and to not capture them. That is an example of where JavaScript and CSS work together. Now if you refresh the page and give modal-outer an opacity of .5, in the dev tools, you will see that the modal outer is still there but you will see how the buttons underneath can still be clicked and the events aren't being captured by modal-outer. When the modal has a class of open, set the opacity to 1 and the pointer events to all. .modal-outer.open { opacity: 1; pointer-events: all; } If you go into the dev tools and give modal-outer a class of open, it will show up. Let's add a transition to make that look a bit smoother. 👇 /* hide this modal until we need it */ opacity: 0; pointer-events: none; transition: opacity 0.2s; Now if you refresh the page, grab the modal outer in the dev tools and give it a class of open, it will fade itself in, and then fade itself out. Now let's get into the JavaScript. We will work on clicking the button on each card now, starting by selecting them. Then we will loop over each of the buttons and add an on click event listener to each one and pass a function as the handler called handleCardButtonClick. const cardButtons = document.querySelectorAll('.card button'); cardButtons.forEach(button => button.addEventListener('click', handleCardButtonClick)) Above that code, go ahead and create that function. For now, just log "YA CLICKED IT" when the button is clicked. function handleCardButtonClick() { console.log('YA CLICKED IT'); } const cardButtons = document.querySelectorAll('.card button'); cardButtons.forEach(button => button.addEventListener('click', handleCardButtonClick)) If you refresh the page and try to click on the buttons, you will see the log in the console. Next you need to grab something to show in the modal. Let's grab the data-description of the parent card and show a larger version of the image. To do that, grab the current target from the event and assign it to the variable button. const button = event.currentTarget closest method Now you need to find the card that is associated with the button. You could do button.parentElement, but if the button were to ever more or be nested inside of something, that wouldn't work that well. What you can do is take the button and run the .closest method and search. It works kind of like querySelectorAll for the closest card. function handleCardButtonClick(event) { const button = event.currentTarget; const card = button.closest('.card'); console.log(card); } Now when you click each card's button, you will see the card logged to the console. What is great about using closest like we did is you can take any element, such as one of the h2 elements on the card and search for the closest div, the closest HTML element. If there is something that does not find (like $0.closest('.doesnotmatch')) it will return null because there is no parent of it. .closest() is like querySelectorAll, except it is the opposite where it will climb up the nested tree of DOM elements instead of look down the DOM tree. We are going to use it once more within this handler. Grab the image source. function handleCardButtonClick() { const button = event.currentTarget; const card = button.closest('.card'); // grab the image src const imgSrc = card.querySelector('img').src; console.log(imgSrc); } If you refresh the page and click on the buttons, you should see the image source logged to the console. Now, grab the description from the data attribute on the card, like so 👇 const desc = card.dataset.description Add a log as well to make sure it is working. Now when you refresh the page, and click the buttons, you should see the descriptions logged to the console. Next you can populate the modal with the card's info. Grab the modal above the handleCardButtonClick method so you do not need to reselect it every click. const cardButtons = document.querySelectorAll('.card button'); const modalInner = document.querySelector('.modal-inner'); function handleCardButtonClick(event) { const button = event.currentTarget; const card = button.closest('.card'); // Grab the image src const imgSrc = card.querySelector('img').src; const desc = card.dataset.description; } Also select the name 👇 const name = card.querySelector('h2').textContent; Within our handler, set the innerHTML of the modal using backticks. You want to replace the 200 value in the image sources with 600. Use the name as the alt attribute value. modalInner.innerHTML = ` <img src="${imgSrc.replace('200', '600')}" alt="${name}" /> <p>${desc}</p> `; Next you want to show the modal. To do that, select the modal-outer, which you can do right above or below where you selected modal-inner. const cardButtons = document.querySelectorAll('.card button'); const modalOuter = document.querySelector('.modal-outer'); const modalInner = document.querySelector('.modal-inner'); At the bottom of the handler function, add modalOuter.classList.add('open'); to show the modal. function handleCardButtonClick(event) { const button = event.currentTarget; const card = button.closest('.card'); // Grab the image src const imgSrc = card.querySelector('img').src; const desc = card.dataset.description; const name = card.querySelector('h2').textContent; // populate the modal with the new info modalInner.innerHTML = ` <img src="${imgSrc.replace('200', '600')}" alt="${name}" /> <p>${desc}</p> `; // show the modal modalOuter.classList.add('open'); } If you refresh the page, you will see that it works. The image is also there, it is just spilling out so let's fix the CSS. Add the following to the style tag .modal-outer img { width: 100%; } Good, now you have the bare bones of a modal. The other thing we need to talk about is closing the modal. Obviously we could have a function called closeModal which would take the modalOuter an remove open from the classList, like so 👇 function closeModal() { modalOuter.classList.remove('open'); } But how do we code it so that the modal closes when you click outside of it, and not on the text or the image or anything like that? We can solve this using a technique called click outside. What we will do is take the modalOuter and listen for a click on it. When that happens, take a look at the event, like so 👇 modalOuter.addEventListener('click', function(event) { console.log(event); }) Now when you click outside the modal on modalOuter, you will see the click event logged. Next log the target and currentTarget of the event. modalOuter.addEventListener('click', function(event) { console.log(event.target); console.log(event.currentTarget); }) You might think this would be simple to solve because you can just check if the modalOuter and the currentTarget are the same thing, then you can go ahead and close it. But in the real world, modals are usually more complex than that. Sometimes they have elements on the outside, sometimes you want to listen for clicks on specific things. What you can do is use the closest() method to see if you are clicking inside of modalInner at all. Make a variable called isOutside as assign it to the value of e.target.closest('.modal-inner'). Log the value of isOutside. modalOuter.addEventListener('click', function(event) { const isOutside = event.target.closest('.modal-inner'); console.log(isOutside); }) How that works is if you click on the modal or anywhere inside of it, it will find modalInner. However, if you click on something that is outside of the inner or a close button or something, it won't be able to find anything. So what you can do is convert the closest() to a boolean true or false by putting a bang in front of it like so const isOutside = !event.target.closest('.modal-inner'); If it finds something it will be false, and if it doesn't finds something it will be true. That gives us a nice boolean we can use like so, 👇 modalOuter.addEventListener('click', function(event) { const isOutside = !event.target.closest('.modal-inner'); if (isOutside) { closeModal(); } }) If you refresh the page now, it should work. Let's hook up the escape key really quickly. window.addEventListener('keydown', event => { console.log(event); if (event.key === 'Escape') { closeModal(); } }); That is it for the lesson, now Wes will just demo some cool stuff. Add the following style to modal-inner 👇 .modal-inner { max-width: 600px; min-width: 400px; padding: 2rem; border-radius: 5px; min-height: 200px; background: white; transform: translateY(-200%); transition: transform 2s; } Now the modal is way off the screen, above the browser. The transition will animate the transform over two seconds. When the modalOuter has a class of open, you want to grab modalInner and change the transform to be 0 so it goes back to where it should be. 👇 .modal-outer.open .modal-inner { transform: translateY(0); } Now if you refresh the page and try clicking on the buttons, you will see how it animates in now. However, you may notice that the transition is a bit jerky and not completely smooth. 22:17 What is happening there is the image isn't'''
