full_description = '''Functions - Built-inEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, FunctionsEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .mtk5 { color: #FF628C; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } These videos are going to be about functions. We will get a good primer on what functions are, the core concepts, and an overview of the types of functions that you can write. It will not be exhaustive, because there is so much more we need to learn in order to take advantage of functions. The rest of the course is going to be using functions, since they are like types, a fundamental building block of JavaScript and we will get good at functions because we will be writing them throughout this entire course. So, functions, what are they? They allow us to group together sets of statements. As a refresher from previous videos, these are all statements 👇 If you wanted to group all those statements together (generally they are related to each other and generally they produce some sort of output), you could group them together inside of a function. Functions can take in data, those are known as arguments (we will discuss the difference between arguments and parameters shortly). When you pass data to a function, it is known as an argument. Functions perform some work (a statement), and sometimes they also return a value. Let's look at an example in the console using Math.max() (this is actually a method, and we will explain the difference between a function and a method shortly, it is not much). If you run it in the console, it returns negative infinity. What we want to do is pass it some data, and it should return to us the maximum value. For example, let's pass two numbers, 10 and 12. It will return to us the highest number (which is 12). Now what is going on there? Math.max(10, 12) is a JavaScript statement. The values 10 and 12 that we are passing into the function are called arguments. If you are passing multiple values to a function, you need to separate each value with a comma and it's best practice to include a space between each. To repeat, the data that you pass to a function, the data that you give to a function in order for it to run is called an argument. Sometimes, functions will return to you some data that is generally the answer or the computed output based on what you passed in. For example, Math.floor(2.4444) will return 2. Here we are passing one argument of 2.4444 and it returns to us the floor of that value which is 2. Built-in Functions There are a whole bunch of built-in functions in JavaScript, whether you are using it in the browser or with Node.js. JavaScript comes with all of these built in functions, and we have already been using them because there is no way around it. The one that we have used the most so far is console.log(). For example if you console.log('hey'), it will return hey. Interestingly enough, it also returns undefined. That is because the console.log function logs to the console, it does not return a value. Not all functions are meant to return a value, sometimes they just go off and do things without returning a value. Tip: You can tell in the console if something is a return or a statement by the > and <. arrows next to the line in the console. > indicates that it's a statement and <. indicates that it's the response to the statement. Some other built in functions we can use are 👇 parseFloat() which takes in a string and returns a number, it switches the type. For example 👇 parseFloat("20.34543543"); parseInt() takes in a string and returns a number without a decimal. For example 👇 parseInt("20.3243423"); We looked at Math.round(), Math.floor(), Math.ceil() already in previous lesson. If you type Date.now() in the console it will return something like the following 👇 Date.now() is a function that does not take in any arguments. What it returns to us is the number of milliseconds since January 1, 1970. If you go to https://epoch.now.sh, it's a tool that you can use to convert the millisecond value to a datetime. You can also do the opposite -- pick some date and time in the future and then it will return the millisecond value. We will go deeper into dates in future videos. We also have functions that will work with something called the DOM, which are the HTML elements that are on the page. Create a new file called functions.html, and use the html base snippet. Add a paragraph tag inside of the body that says "hey, how ya doin?" and then add an empty script tag below. Open that up in the browser. 👇 <!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width,initial-scale=1.0" /> <title>Functions!!</title> <link rel="stylesheet" href="../base.css" /> </head> <body> <p>Hey How ya doin?</p> <script></script> </body> </html> In the script section of functions.html, add the following code. that will run a function called document.querySelector(), to which we are passing a selector p. This built in function will find something that matches that selector and puts it into a variable, and we will log that variable. <script> const p = document.querySelector("p"); console.log(p); </script> There are a lot of other functions built in, some are mobile specific like navigator.vibrate(). Another useful thing is if you are not sure what arguments a function should take, you can refer to the Mozilla developer docs, in order to see what is going on. In google, type "Navigator.vibrate()". Usually you will need to look for the Mozilla Developer website (a tip is to include mdn at the end of your search so the Mozilla docs float to the top). The docs should explain what the method is, how it can be used, and what it returns. Let's look at a couple of more. Clear the console. In functions.html, add a lot of text, such as a few paragraphs of Lorem Ipsum. (Wes is using the Emmet extension for VS Code which allows him to type lorem500 and hit tab to expand 500 words of lorem ipsum. You can manually search for a Lorem Ipsum generator online if do not have the Emmet extension.) Now if you refresh functions.html you will see a lot of text on the page. Add enough text so you can scroll on functions.html. Now you should be able to type in the console window.scrollTo(0, 600), and that should cause your window to scroll down 600 pixels. If we search for scrollTo on Mozilla docs, it says it accepts arguments of a x and y coordinate, or you can pass it an options object. The docs say that options is a ScrollToOptions dictionary Dictionary is a word we use in JavaScript to represent an object, it's an object that has a number of set properties on it. Example #1 👇 window.scrollTo(0, 1000); Example #2 👇 window.scrollTo({ top: 100, left: 100, behavior: "smooth", }); In the first example, we are passing two numbers but it's also an option to pass an object which has properties inside of it like top, left, and behavior. Try typing into the console the following 👇 scrollTo({ top: 500, left: 0, behavior: 'smooth' }) That page should cause the page to scroll down 500 pixels. scrollTo is an example of a function that does not return anything, instead it just goes off and does some work for us.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevTypes - Booleans and EqualityNext →Functions - Custom'''
