["https://wesbos.com/new-es6-string-methods"]
title = "4 New String Methods in ES6 that you should know - Wes Bos"
description = "The String type in ES6 has come with four new methods that are really handy, help us write a little bit more readable code, as well as…"
full_description = "The String type in ES6 has come with four new methods that are really handy, help us write a little bit more readable code, as well as reduce our reliance on using regular expressions, or RegExp, for certain things. So I have a const variable named course, which has the value of RFB1, this stands for React for Beginners. Sometimes I have RFB1 which is the starter package, RFB2 which is the master package, RFB3 which is the team package. I don't really care too much about that in certain cases, I just want to know if course starts with RFB, and not something like STPU, which is Sublime Text Power User or ES6, which is this series. Here, RFB means React for Beginners, I need to know if the string starts with it. We can use the console to check this out by typing course.startsWith('RFB'), it will return true, because obviously it does start with it. If I did rfb, in lowercase letters, it says, false, because there is no way to make this case insensitive. If you do need case sensitivity you must still use a Regular Expression. One other thing that .startsWith() will do is it'll allow you to skip a certain number of characters and start looking at a set point. This flight number here, I want to see if it starts with AC. Over in the console, I'm going to type flightNumber.startsWith('AC'). It's false, because the variable starts with 20-. This also happens if we have SKU numbers, and they start with a bunch of junk and then it gets to actually what we want. What you can do is you can use flightNumber.startsWith('AC', 3);, which says start after three characters. That is returning true, because it ignores the first three and then starts at AC and checks against that. EndsWith works fairly similar. Here is an example where we have jz at the end of the flightNumber, and I want to know if it's an Air Canada Jazz flight. We can say flightNumber.endsWith('jz'), which will be true, obviously, because it ends with it. There's another option that we can pass .endsWith(), and I'm going to use an account number variable as an example here:"
