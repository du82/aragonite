full_description = "One feature that comes along with template literals, or template strings, is the ability to tag them. That means we can run a template… Another feature of template literals or template strings is the ability have multi-line strings without any funny business. Previously with… In JavaScript, when you want to put a variable inside of a string, it's a pain in the ass because you have to stop your string, concatenate… Hey Folks - I totally updated and re-recored every single video on my React for Beginners series. Just under a year ago I launched ReactFo… Default function arguments in JavaScript are here. This is one of those features that's going to make your life much easier, and make your… We've learned about the concise syntax of arrow functions. We've learned about the implicit return of arrow functions. The last thing we're… Before you start going absolutely bananas on using arrow functions everywhere, we need to chat. Arrow functions don't replace regular… Let's look at a couple more JavaScript arrow function examples. This is something that comes up often where I'm building an application… ES6 has introduced arrow functions which have three main benefits. First, they have a concise syntax. Secondly, they have implicit returns,… We've learned about let and const — what they do, and how they're scoped. We also know when they can be reassigned and when they cannot… A fun, exercise heavy approach to learning Modern JavaScript from scratch. This is a course for absolute beginners or anyone looking to brush up on their fundamentals. Start here if you are new to JS or programming in general!"
