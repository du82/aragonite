["https://wesbos.com/new-wesbos-website"]
title = "My New Website! Here are the deets - Wes Bos"
description = """
It's here! My new website. It's funny how being a developer, you neglect your own website until things are dire.

Over the past year I've…"""
full_description = '''Over the past year I've been chipping away at building this new site and I'm super happy with how it's turned out. It was running on WordPress. I had over a decade on WordPress and I still love it, but I'll explain why I left WP in just a second. Here is the tech I used on the old site: Gatsby is the framework and despite a few hiccups, I really enjoyed working with it! It makes this site wicked fast without having to really do much at all. Many of you will ask why I didn't use Next.js — a framework that I love and have built much of my course platform on. I used to say that Gatsby was for websites and Next.js was for apps. I don't believe that to be true as Next.js has per-page opt-in static generation and on-demand page builds in development. So, it comes down to: All the styling is done with Styled Components. I don't go overboard with components, but I do really enjoy being able to scope my CSS and still use descendant classes. Big fan! After years of being a salesman of Operator Mono, Hoefler&Co took notice and hooked me up with a free license for my site. Most of my blog posts were already written in Markdown, so I went with MDX which allows you to use React components inside of your markdown. Handy for embedding Video players, graphs or anything else that is already a React component. If this were a client project, I'd likely go Headless CMS like WordPress w/ GraphQL, Sanity, Prismic or similar. I don't usually recommend someone use markdown for their content, but in my case I want to have all my content on github, easily editable so the nitpickers can fix things themselves instead of emailing me. 😃 There are a few pieces of dynamic content on the footer of this site — the latest Podcast, Tweets, Instagram stories and Instagram posts. I didn't use Gatsby plugins for these because they would quickly become outdated. Instead I load them on the client once the page loads. For this I use Amazon's Lambda functions. I loved this workflow of needing a "sip of backend", I just created a new file in this folder.'''
