full_description = '''Different Ways to Declare FunctionsEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, FunctionsEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtki { font-style: italic; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk5 { color: #FF628C; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk11 { color: #FB94FF; } .cobalt2 .mtk6 { color: #FFEE80; } .cobalt2 .mtk7 { color: #3AD900; } .cobalt2 .mtk4 { color: #0088FF; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } One thing you will hear often when getting into JavaScript is that functions are "first-class citizens". JavaScript functions are values in themselves, and they can be stored in variables and passed into other functions. What is a value in JavaScript? We know that in the examples below 👇 that true and 100 are values. const age = 100; const cool = true; Those are values that are numbers, or strings or booleans. What is cool about JavaScript is that functions can be: passed into other functions. stored in variables, moved around like any other piece of data in JavaScript That is not true for every other programming language. Let's start by looking at how you can put a function into a variable, and then look at the different ways to declare functions. Create a new file ways-to-make-a-function.js in the /custom-functions directory. <script src="./ways-to-make-a-function.js"></script> Add a log of "it works!" and go back to the index.html file and change the path in the script source attribute as shown above 👆 and refresh the browser to ensure it works. We already know one way to declare a function and that is using the function keyword, like so 👇 function doctorize(firstName) { return `Dr. ${firstName}`; } Anonymous Functions Let's look at some other options we have when declaring functions, starting with an anonymous function, which is a function without a name. To make doctorize an anonymous function, you would modify it like this 👇 function(firstName) { return `Dr. ${firstName}`; } However, that is not valid JavaScript. If you try running it in the console you will see an error that says 👇 SyntaxError: Function statements require a function name Anonymous functions are only valid in some use cases, such as using them in callbacks (we will learn more about that later) as well as in an IIFE (immediately invoked function expression). This example was not a valid use case. Why would you ever want an anonymous function? Function Expressions The next way we will cover to declare a function will help explain that, which is as a function expression. Add a comment above that function specifying that it is an anonymous function, then copy the function and comment it out. Paste the copied code below the commented-out function. The next way to declare a function is a function expression. A function expression is when you store a function as a value in a variable. 👇 // function expression const doctorize = function (firstName) { return `Dr. ${firstName}`; }; In the code above 👆, we have taken the anonymous function and stuck it in a variable. If you refresh the page, you will see that in the console, we have doctorize() available to us, and we can call it like we did in previous videos. Having the ability to store a function in a variable is what leads people to say functions are "first-class citizens". You may come across developers who say to not use function expressions because they used to give unhelpful errors. Previously, anonymous function errors would just tell you that they occurred in an anonymous function, without giving you any clue where the error is happening. However, now the dev tool errors are better. Here is an example that demonstrates what they mean by that 👇 // function expression const doctorize = function (firstName) { doesntExist(); return `Dr. ${firstName}`; }; In our case, it does now tell you it happens inside of doctorize on line 12. Although the function is technically an anonymous function without a name, the browsers will now infer the name of the function from the variable name and use that in the errors. What is the difference between a function declaration and a function expression? What is the difference between doing a function declaration and a function expression? Why would you want to use one over the other? Hoisting There is only one real difference which is how they operate in something called hoisting. We will go over this in detail in a future video but for now we will just quickly cover the concept. Duplicate the doctorize function and name it doctorize2, like 👇 const doctorize = function (firstName) { return `Dr. ${firstName}`; }; function doctorize2 (firstName) { return `Dr. ${firstName}`; } Let's say right before the first doctorize function, we called doctorize and passed it the value of "wes", as shown below 👇, do you think the code will run? If you run a function before you define it, does it work? Refresh the page and look at the console to test it doctorize("wes"); const doctorize = function (firstName) { return `Dr. ${firstName}`; }; function doctorize2 (firstName) { return `Dr. ${firstName}`; } Did it work? Nope! You get an error like: Uncaught ReferenceError: Cannot access 'doctorize' before initialization at ways-to-make-a-function.js:78 (anonymous) @ ways-to-make-a-function.js:78 What about doctorize2? console.log(doctorize2("wes")); const doctorize = function (firstName) { return `Dr. ${firstName}`; }; function doctorize2 (firstName) { return `Dr. ${firstName}`; } It does work! Why does a function declaration work if you call it before you define it, but a function expression does not, especially when we created the exact same function in both cases? Functions that are declared with the function keyword are called hoisted. JavaScript will take all functions with the function keyword and hoist them up, up, up and says "you're a function, you belong at the top of the file". That means anywhere you call the function, it will be available to you. JavaScript does not hoist variable functions. When is that useful? Very rarely, Wes has never used that in his entire career except for tiny use cases. Hoisting is more of an interview question that you may be asked. Essentially it means that JavaScript will take functions and bring them up to the top of the code before they are called. This gives us the ability to run a function before it is defined. Remove the doctorize2 function from the JavaScript file which should leave just the function expression. Arrow Functions The next way to make a function is using an arrow function. Arrow functions themselves have a few different ways of being declared. They are a newer addition to JavaScript, and were added in the last couple of years. They have a few benefits: concise syntax and tend to be shorter allow for writing one line functions do not have their own scope in reference to the this keyword (we will cover the this keyword in a future video) Arrow functions are also anonymous functions, which means there is no way to declare an arrow function the way we do a function declaration function doctorize() {..}. You always have to stick it into a variable. To illustrate this, we will begin by writing a regular function. 👇 function inchToCM(inches) { const cm = inches * 2.54; return cm; } This function will take in inches and return centimeters. Let's try it out in the browser. This is a pretty simple function, but it still takes up 4 lines of code. We can make it a bit shorter by instead of creating a variable and then returning a variable, we can just return the calculation directly. function inchToCM(inches) { return inches * 2.54; } Note: You may notice in the above 👆 screenshot that the line of code with return cm; is now greyed out. That is because that code will never be reached, since we are returning in the line of code above it. When you return from a function, the function stops running. Now we can convert it to an anonymous function as a step on the way to making it an arrow function. const inchToCM = function (inches) { return inches * 2.54; }; Refresh the page to check that it still works, which it should. All we have done is turned it into an anonymous function and stored it in a variable. Different Ways to Write Arrow Functions Let's convert it to an arrow function now, which we can do a few different ways. Instead of writing the word function, we will delete it like so 👇 const inchToCM = (inches) { return inches * 2.54; } Now we will go to the right of the parenthesis and add what is called a fat arrow =>. In programming, -> is referred to as a skinny arrow and => is referred to as a fat arrow. const inchToCM = (inches) => { return inches * 2.54; }; When you save, you might notice that Prettier modified the function for you and removes the parenthesis, which is not what we want because we are trying to change it to an arrow function in steps.To disable that, add /* eslint-disable */ right above the function. The spaces between the parenthesis and the arrow in the following code 👉 (inches) => { does not have to be there, this is the same code with different whitespace and 👉 (inches)=>{ still works, but it's more readable with spaces. If you refresh the page and run it in the console, you will see that it still works. Implicit and Explicit Returns The next thing we will do is what is called an implicit return. An explicit return is when you type the return keyword before returning a value such as 👇 return inches * 2.54; That is an explicit return meaning that we explicitly return the value there. An implicit return is returning it without actually having to type the keyword return. Arrow functions allow us to use implicit returns. Let's start by putting the function on one line, like so 👇 const inchToCM = (inches) => { return inches * 2.54; }; To get rid of the explicit return: first put the function on one line then delete the curly brackets{ } finally, delete the return keyword const inchToCM = (inches) => inches * 2.54; Your code should look like the above 👆 What we did there is: we made an arrow function inchToCM which takes in one parameter, inches modified the function to implicitly return the value. The way we can tell this is an implicit return is that: it's all on one line there is no return keyword there are no curly brackets If you refresh the browser, you will see that it still works. To recap: what we did there is we removed the function block, modified the code to be on one line, and removed the explicit return. Finally, and this is more of a stylistic choice, if there is only ever one parameter for your function, you can actually get rid of the parenthesis around the parameter as well, like so👇 const inchToCM = inches => inches * 2.54; If there is only one parameter in your arrow function, you can remove them no problem. It is still a valid arrow function. Let's do another example! Make a function called add, that takes in two parameters a and b, with the default value of b being 3. We will then make a temporary variable called total which we return. function add(a, b = 3) { const total = a + b; return total; } Pause here, try to convert it to an arrow function yourself and then come back once you have tried it. Let's first see if it works as it originally was. Save the code from above 👆 and refresh index.html in the browser. Open the console and test the function. You might notice that dev tools is giving us an annotation ?b in ƒ(a,?b) as shown above. That little question mark in front of b is telling us that the argument is optional. b is optional because there is a default value to fall back on. Stick the function in a variable add and remove the function name, like so 👇 const add => function (a, b = 3) {} Next, convert it to an arrow function. Get rid of the keyword function and add a fat arrow to the right of the parenthesis, as shown below. const add = (a, b = 3) => { const total = a + b; return total; }; Modify the code to return a + b and get rid of the total variable. 👇 const add = (a, b = 3) => { return a + b; }; Put the function on one line. const add = (a,b = 3) => { return a + b; } Get rid of the function block and the return keyword like so 👇 const add = (a, b = 3) => a + b; Now we have a short arrow function! You may have noticed that we did not get rid of the parentheses, and that is because there is more than one parameter. Arrow Function Gotcha's There are a couple of other gotchas with arrow functions that we need to know about. Let's go over them now. Returning an object Let's make'''
