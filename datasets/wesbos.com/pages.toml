["https://wesbos.com/parity-purchasing-power"]
title = "Parity Purchasing Power - Wes Bos"
description = "For the last ~5 years I've been offering PPP discounts on my web development courses for developers in countries where their purchasing…"
full_description = '''For the last ~5 years I've been offering PPP discounts on my web development courses for developers in countries where their purchasing power isn't as strong as the US, Canada and Parts of Europe. I've received hundreds of questions about it, and I'm happy to see that it has caught on with other course creators! I recorded this Syntax.fm Podcast detailing everything (seriously listen to this!), but I thought I'd log my most common questions here. I use this code to both display the coupon code banner when visiting the site from a supported country, as well as when validating the coupon against the requesting country. My platform is 100% custom so I'm able to do things like coupon codes that are limited to a specific country. I've been running this for 4+ years and i've had hundreds of emails from devs in different countries. I simply asked them how much a typical dev makes in a year, and how much would be reasonable. These values change as economies do and the US dollar fluctuates, so you do need to stay on top of it. It's not perfect, but it works well for me. There are dozens of github packages, and even a few SaaS apps that now do this for you. I don't use any of them, but I know lots of people do. Just search github for them. I don't make my list public because I am not an economist and I don't want to be in the middle of some sort of economics fight choosing what is fair. People do cheat it, but not enough that it's a big problem. In general, I make more money from these discounts than I lose from people cheating it. I've always operated from the standpoint that I don't want to punish my honest users because there are a few Anthonys from India that want to take advantage of it. It's more fun to email them and ask questions about living in India. That is great! My system is opt-in. I've had many devs say "Thanks for the offer, but I actually don't need it!", or even offer to buy a second course for someone who does need it. Hopefully that clears up a few questions! Feel free to tweet me with any followup questions you have!'''
