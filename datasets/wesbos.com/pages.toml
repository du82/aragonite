--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .mtk7 { color: #3AD900; } .cobalt2 .mtk6 { color: #FFEE80; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk11 { color: #FB94FF; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } In JavaScript, it is common to need to add and remove classes. Let's demonstrate how to do that, starting by commenting out all the code within the-dom.js. When you select an element, it will have a classList attribute on it, and that attribute has methods on it for adding and removing multiple classes. We will do an example with animation. Duplicate one of the image tags and add it right after the opening body tag, and give it a class of nice. 👇 <body> <img class="nice" src="https://picsum.photos/500" /> Within the-dom.js, add the following code to select the element using the class of nice, and then we will log the classList attribute of the element. const pic = document.querySelector('.nice'); console.log(pic.classList) In the console we get a DOMTokenList which is kind of like an array of all the classes that are on that image. In the HTML file, add a class of cool to the image as well. When you refresh the page, you will see that we get both of them as well as a value of all of the classes. 👇 If you look into the prototype (we haven't learned what that is yet), you can see which methods are available to call against the thing we have. classList has many methods. To name a few, there is add remove contains foreach. A lot of those are methods for working with classes which is exactly what we are going to do. Within VS Code, as you type, you may have noticed that you get a dropdown of methods available to you. 👇 Adding a class We are going to use pic.classList.add() to add a class of 'open'. const pic = document.querySelector(".nice"); pic.classList.add("open"); console.log(pic.classList); Refresh the page, and inspect the image element. You will see the image now has a class of open. Removing a class What if we wanted to remove the class of "cool" which already exists on the element? You could do that with the following code 👇 pic.classList.remove('cool'); Toggling a class There is also toggle which is pretty cool. Let's write a bit of CSS so we can visually see what is going on. In our index.html add a style tag somewhere on the page with the following styles 👇 <style> .round { border-radius: 50%; } </style> Now using JavaScript, we will add a class of round. pic.classList.add('round'); Now the element has the class of round and makes the image circular. We can add and remove that class either by pasting it into the console or on click. We will go over both. Replace the add method used above with toggle(). toggle will add the class if it is not there, and remove it if it is. pic.classList.toggle('round'); If you copy and paste that line of code into the console, you will see that the class is being added and then removed. If we go into our CSS and add a transition all for .2 seconds, that will give us an animation when the class is toggled. img { transition: all 0.2s; } .round { border-radius: 50%; transform: rotate(1turn) scale(2); box-shadow: 0 0 10px black; } Quick peak ahead (we will be learning about events later), you can do something like the following 👇 function toggleRound(){ pic.classList.toggle('round'); } pic.addEventListener('click', toggleRound); What we are doing there is saying when the pic element is clicked, we want to the trigger the function called toggleRound(), which will toggle on and off the class of .round for the image element. You can add the following styles to the .round class also for a rotation transition... .round { border-radius: 50%; transform: rotate(20deg); } The CSS added 👆 above will give you the transition shown below 👇 .round { border-radius: 50%; transform: rotate(2000deg); } To get the transition effect below 👇 add the code shown above 👆 .round { border-radius: 50%; transform: rotate(1turn) scale(2); } The code above 👆 gives you the effect below 👇 A lot of JavaScript interaction is just adding and removing classes at different points in time. That allows JavaScript developers to use CSS to add and remove transitions. That is common with modals and navigation which open and close, and we will be going over lots of examples of that throughtout the class. The contains method There is also the contains() method, which you would use like so 👇 pic.classList.contains('open'); It will return a boolean value of true or false based on whether that element has the class or not. That is useful when you want to check the current state of an element by looking at it's class list. In the next video we will go over regular attributes. Even though class is an attribute, classList gives us some utility methods for working with it. Whenever Wes needs to work with classes, he uses classList which is a few years old but fairly newer.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevElement Properties and MethodsNext →Built-in and Custom Data Attributes'''
