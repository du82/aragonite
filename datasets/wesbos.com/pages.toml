title = "Setting Default Values with JavaScript’s Destructuring - Wes Bos"
description = "There's one last thing we need to know about destructuring objects, and that is the ability to set defaults. This one's a little bit…"
full_description = "There's one last thing we need to know about destructuring objects, and that is the ability to set defaults. This one's a little bit confusing, so bear with me here and we're going to circle back for another example later on in a couple of videos over at ES6.io. What is width? It's undefined because we create the variable, but it's not able to be set to anything. With destructuring we can set defaults, or fallback values so that if an item is not in the object (or Array, Map, or Set) it will fall back to what you have set at the default. Now if the speed or width properties don't exist on our settings object, they fallback to 750 and 500 respectively. One thing to note here is that this isn't 100% the same as this old trick used to fallback when settings.speed is not set: Why? Because ES6 destructuring default values only kick in if the value is undefined; null, false and 0 are all still values! In my last post we learned that we can destructure and rename variables at the same time with something like this: We can also set defaults in the same go. Hold onto your head because this syntax is going to get funky! Next we look for person.middle. If there was a person.middle property, it would be put into the middleName variable. A fun, exercise heavy approach to learning Modern JavaScript from scratch. This is a course for absolute beginners or anyone looking to brush up on their fundamentals. Start here if you are new to JS or programming in general!"
