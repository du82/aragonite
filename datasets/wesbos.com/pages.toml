title = "How to Transfer USD out of PayPal without conversion fees - Wes Bos"
description = "Canadian, and many international users, often find themselves with USD in their PayPal account. When it comes time to get that USD out of…"
full_description = '''Canadian, and many international users, often find themselves with USD in their PayPal account. When it comes time to get that USD out of your PayPal and into your personal or business bank account, you might be surprised to see that PayPal forces you to convert your USD into your local currency before transferring it. PayPal already charges you 3+% to receive the funds, and then another 4% to convert them. Put this on top of Merchant fees (Shopify, GumRoad) and you can easily lose 10-13% of your income. Note: I'll be using CAD as my example currency here, but this method should work well for many other currencies. Visit the Country Notes below for any additional details. The problem is PayPal won't send USD to an account with a transit number. The solution to getting your money out of PayPal without any fees is that you must: Transferwise is an online transfer service for converting currency. They have "multi-currency" accounts, which allow you to hold various currencies in your account before you spend, transfer or convert it. The key here is that they will give you both an account number, and a routing number of a US based bank where you can withdrawl your paypal funds to. Business accounts must pay a $35 one-time fee to get access to your banking details. Not a big deal as this pays for itself after you move over $1,000 out of PayPal. Note: This method is not currently working and it looks like paypal has blocked it. It still works if you have set it up, but setting up a new one will likely not work. I'll leave the instructions here in case you want to try it yourself. A full writeup of this method is available on the Travel Breakthrough blog, but I believe it can be simplifed: This is a solution I didn't think was possible. But you can just call a US Bank up and ask to open an account as a Canadian. This is nice for businesses as you could take advantage of other services like a USD Business Credit Card. Hat Tip to Paul Jarvis for this one. One you have an account, you should be able to get both your routing number and your account number from your bank / online banking.'''
