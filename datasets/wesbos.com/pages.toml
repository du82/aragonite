full_description = '''Code Quality Tooling with Prettier and ESLintEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comTooling, ESLint, PrettierEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtk11 { color: #FB94FF; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk6 { color: #FFEE80; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk5 { color: #FF628C; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } Whether you are a solo developer looking to follow best practices or catch potential bugs, or you are a member of a team that has a specific way of writing JavaScript, there are many use cases for using code quality tooling. There are two tools that are extremely helpful in code quality and formatting of your JavaScript: ESLint Prettier Before we jump into those, let's start by looking at some code and opinions people have about formatting in JavaScript. In the code above 👆, we are using single quotes '' rather than double quotes "", which is an opinion that some people have. Some people prefer one over the other. The fact that there is a space between the variable name and the equal sign is actually not necessary in const p = document.querySelector('p');, that is an opinion that people have in their JavaScript. const p=document.querySelector('p'); would work the same way. Those are just two example of things that have the potential to cause issues in your code, or are formatting preferences that people have opinions about. The tools we mentioned earlier will help you fix those issues by either fixing it for you, or by alerting you if you are doing something that is a bad practice, or causes an accessibility issue, along with a whole lot of other things. ESLint & Prettier I recommend that you go to https://eslint.org and go to the demo in the navigation. For Prettier, there is a link on the homepage that says "Try it". We will cover the following about these tools: what they are how they work the steps you need to go through to install them ESLint ESLint, is a JavaScript linter for identifying and reporting potential issues in your JavaScript. Some examples may be bad practices or design patterns, or identifying unused variables in functions. If you go to the ESLint demo, select the "Rules Configuration" section and choose the latest version of JavaScript. If you type into the demo const age = 300;, you will see the following linting rule 👇 'age' is assigned a value but never used. If we go ahead and use it by adding a line below of console.log(age);, we will get the following errors 👇 3:1 - Unexpected console statement 3:1 - 'console' is not defined. One of the rules that are set in the demo version of ESLint is to not use console.log(), which is sometimes a production rule that developers use because you don't want to ship code to production that include console logs. With ESLint, you can turn specific rules on or off. Wes will show us his own config shortly. If you scroll down on the ESLint site, you will see a list of all of the rules that you can set using ESLint. Sometimes as you are writing code, ESLint will throw an error and you might not know why it is being thrown. Thankfully, ESLint provides a link to the documentation of the rule so you can read through and understand what it means. Some other things ESLint helps us with is code that is broken or confusing scoping. Let's say you add the following code in the ESLint demo page 👇 function hi() { age = 300; } You should get the following errors: 👇 1:10 - 'hi' is defined but never used. 2:3 - 'age' is not defined. If we add a let before the age variable, it will still complain that hi is defined but never used. If we call hi(); in our code, it will complain that age is assigned but never used. ESLint is always giving you feedback on your code. Initially, this can be very frustrating because it tells you that all your code is wrong. Over time, you will be able to modify your own config that fits your own coding style as well as understand as to why some of those things might be bad practices. ESLint is also plug-able. This means you can have many different plugins with it, there are many of them, for different styles of JavaScript, such as a React/Vue/Angular plugin. That is a high level overview of what ESLint is. We will talk more about configuring it in just a second. Prettier The next tool that we have is Prettier. Whereas ESLint will yell at you about things that are causing potential issues in your code, Prettier focuses entirely on just the formatting of your code. Navigate to https://prettier.io/ and select the "Try me" link which should open up the playground. Paste the following code in it 👇 const age = 100; alert("hey"); The output should give you: const age = 100; alert("hey"); The input code is technically valid JavaScript, however it is messy and harder to read. Those are annoying things, such as indentation or spaces between lines of code. Prettier will take in all of your code. For example if you are mixing your quotes, using single quotes ' sometimes and " double quotes at other times, Prettier will always just format the code to use one or the other, for consistencies sake, depending on the settings you have. Prettier is pretty opinionated. There are a few settings that we can toggle here or there, but mostly you just have to let it figure out how you want it to format your code. You can use ESLint and Prettier separately. What Wes likes to do is use ESLint and then use the Prettier plugin for ESLint. That way, all of his code goes through ESLint which will tell him what is wrong with his code, as well as any possible issues that ESLint can fix, including Prettier fixes, and then it will go ahead and fix those for us. One bad thing about ESLint is after you install it, you can spend the rest of your life configuring it based on the hundreds of possible rules. It is likely that the rules you want have already been chosen well by someone else, so often you just want to pick someone elses settings that you already like. That is exactly what Wes did for this course. He made a config that is a set of ESLint rules, as well as the Prettier plugin which will do the formatting for you, all bundled into one so you can hit the ground running with that config. As you start to develop your own opinions for what you like, you can sort of overwrite those ESLint rules one by one. Installing ESLint & Prettier Let's get into installing Prettier and ESLint. Go into the terminal, and use it to navigate to the beginner-javascript directory. (refer to the Welcome page if you don't have that directory). Tip: If you don't know which directory you are currently in, type pwd in the terminal and it will return the directory that you are currently in. There are a few things we need to do before we can get going. We are going to follow the instructions located at https://github.com/wesbos/eslint-config-wesbos. The ESLint config can only be installed locally per project due to changes that were made to ESLint v6 that removed global installs. Installing npm packages locally If you don't already have your package.json, create one running the command npm init by typing it into the terminal (make sure you are in the beginner-javascript folder). We will be talking about npm later in this course, but essentially npm allows us to download what are called dependencies, which is other people's JavaScript packages that allow us to do things. We need other people's JavaScript packages for this lesson, specifically we need ESLint, Prettier, and we need Wes' config. Creating the package.json file In order for that to work, we need what is called a package.json file which is going to hold a list of all of the other things in JavaScript that we need. To create the package.json, you simply just type npm init in the terminal and press enter. You will now be prompted to enter a package name, description, keywords, etc. but you can just press enter to skip setting those values for now. Then we need to go ahead and install all of our dependencies. Go ahead and copy this line of code and paste it in your terminal to install the dependencies. npx install-peerdeps --dev eslint-config-wesbos After about a minute or so, it will go ahead and install all of your packages. If you take a look at your filesystem, you will see that there is this new folder called node_modules and inside there are a whole bunch of dependencies. We're not going to get into what that is just yet, that will be coming in our modules lesson. For now, all we need to know is it contains all of the npm packages that makes ESLint and Prettier work. Configuring ESLint and Prettier with VS Code Next we need to make a new file within the beginner-javascript folder called .eslintrc. This is what is called a dot file. Sometimes your computer will hide dot files from you because they are typically just files that developers use under the hood. Since we are developers, we do not want to hide those files. If you have trouble seeing that file in your file system, do a quick google of "Showing hidden files Mac" or "show hidden files Windows" and it will show you how to flip that setting on. Inside of your .eslintrc file, copy the following: { "extends": ["wesbos"] } We are going to extend "wesbos", which means we are going to extend all the settings and plugins that Wes has packed into his own config. That is really all we need right now. Next, what we need is to get it running with VS Code. Scroll down in Wes' instructions to the With VS Code section. First thing you need to do is install the ESLint extension for VS Code. Ctrl + Shift + x (cmd + Shift + x / MacOS ) will get you to the list of extensions in VS Code. You want to search for ESLint, and you will see a whole bunch of different ones, but the one you want is just called ESLint. You'll know it's the right one because it has billions (just kidding, millions) of installs. Go ahead and click the install button. Now what we need to do is set up some VS Code settings. Within VS Code, in the right hand corner, navigate to Code > Preferences > Settings. If you're on Windows, that would be File > Preferences > Settings. That should open up the settings section in VS Code like so 👇 What you want to do is click on the symbol in the top right hand corner that looks like a page with a curved arrow 👇 That will open up the text based version of your settings. Simply just copy all of the settings from Step #2 of the "With VS Code" instructions found here https://github.com/wesbos/eslint-config-wesbos. Go to the very end of your settings.json file in VS Code, and after the last value, add a comma and then paste in the settings we just copied. (If you don't have any previous VS Code custom settings then you will have an empty object). Let's go through the settings really quickly. editor.formatOnSave: true: turns on formatting on file save. "[javascript]": { "editor.formatOnSave": false } The setting above 👆 is responsible for turning off formatting on save for JavaScript. We will format JavaScript code using ESLint. This setting below is responsible for telling the ESLint plugin to run on save. 👇 "editor.codeActionsOnSave": { "source.fixAll": true }, You need to do that to prevent other built-in plugins in VS Code from clashing with our ESLint plugin. The built-in plugin in VS Code for formatting is called Beautifier and it doesn't do as good of a job as ESLint and Prettier, so what that setting is doing is turning off the editor format on save for JavaScript and for javascriptreact and using the ESLint fix on save instead. Finally, this is important: if you already have a prettier extension enabled, you want to disable it for JavaScript and javascriptreact using the following setting 👇 "prettier.disableLanguages": ["JavaScript", "javascriptreact"], Why? Because we are not using Prettier directly through the Prettier plugin. We are using Prettier through ESLint as a ESLint plugin. This stuff can get confusing and be a real bummer, so if you get stuck or have trouble, watch the video again and check out the "troubleshooting tips" in the eslint-config-wesbos Github repository. To check if Prettier is working, you can open a JavaScript file in VS Code and some add extra whitespace between variables and equal signs and then save the file. If it isn't working, you can click on ESLint in the bottom corner and it will often tell you what the issues are and why it isn't workig. Another thing you will notice with ESLint is these squiggly underlines in VS Code👇 That is actually ESLint giving you information about a warni'''
