full_description = '''Selecting ElementsEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, DOMEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk11 { color: #FB94FF; } .cobalt2 .mtk6 { color: #FFEE80; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } Setup For this lesson, we will be working out of the /exercises/20 - The DOM/ folder which Wes has already created for us. Within that folder there are two files: index.html the-dom.js (the JavaScript file should be empty). Open up index.html in the browser. Where to Load JavaScript When Selecting Elements The first thing we need to talk about is where to load our JavaScript if we are selecting elements. To demonstrate this, we are going to jump ahead of ourselves briefly and grab an element from the page. Add the following the the JavaScript file 👇 const p = document.querySelector('p'); console.log(p); If you wanted to load this JavaScript into the index.html, you might think you want to add it inside of the head tag, as shown below 👇 <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0"> <title>The DOM</title> <link rel="stylesheet" href="../../base.css"> <script src="./the-dom.js"></script> </head> Let's try that. Reload the page, which will cause the JavaScript to run, then open up the dev tools and take a look at what was logged in the console. It should be null. What we are doing in the JavaScript code we just added is we are trying to select something on the page, and then log it. If you try to run document.querySelector('p') in the console, it will return an element like so 👇 Why does it work in the console, but not when we loaded it via JavaScript? It is not working because our JavaScript is being loaded before our HTML is created. That causes the JavaScript to be downloaded and run before the actual elements have been created on the page. There are ways to get around like (such as async and defer attributes), but it's better to just put the script tag right before the closing body tag. That will ensure that all your HTML is first downloaded and parsed to the page before the JavaScript is run. If you move your script tag to right before the closing body tag and refresh the page, you will see the exact same code works. There are other ways around it. One of those ways is putting all the js code inside of a function, and then adding an event listener that listens for the DOM content loaded event and runs the init() function we created when that happens. 👇 function init() { const p = document.querySelector('p'); console.log(p); } document.addEventListener('DOMContentLoaded', init); Move the script src back inside the <head> tag. This is getting ahead of ourselves but if you refresh the page, you will see that it works now even though the script is in the head. What we are doing is delaying the code that actually runs until all of the DOM content has been loaded to the page. If you move the script back to right before the closing body tag, you will see that it still works. It's easier to not need to use an event listener like that and just include the script tag before the closing body tag so that is what we will be doing! Selecting DOM Elements Before you actually work with elements on the page, you will need to go get them, which we refer to as selecting them. You need to be able to access the specific element on the page (whether an h2 tag, div, button, image). Once we have it we can do things like listen for clicks, change the content, add content to it. There are sort of two main ways of selecting elements, which are the only two that Wes uses: querySelector() querySelectorAll(). Generally you are using them on the document although that is not always the case. const p = document.querySelector("p"); console.log(p); In the example above 👆 we have selected something with a p. Both querySelector() and querySelectorAll() take one argument, which is the CSS selector. Those are almost the exact same selectors used in CSS. If you open up the index.html in the browser, you will see we have grabbed a paragraph tag. When we log it, you will see we have the item there. querySelectorAll() will give you multiple elements, whereas querySelector() will give you the first matching one. Let's demonstrate that by making another variable called divs. Add the code below 👇 const p = document.querySelector("p"); const divs = document.querySelectorAll("div"); console.log(p); console.log(divs); If you reload index.html you will see that we get something in the console called a NodeList. We will be learning about arrays in the future and NodeLists look a lot like arrays. It is a frequent interview question that you might hear, that a node list is not an array. It is a list of things, but there are a few differences which we will go through in the future. The short and skinny is that it does not have all the methods that an array does like map, filter and reduce built into it. If you hover over the NodeList in the console, you will see that it is grabbing everything that matches the selector (div). You can get more specific than using elements as selectors. document.querySelectorAll('.item'); You could say give me anything with a class of .item, as shown above 👆 Let's say you only wanted divs with a class of item. You would then use 👇 document.querySelectorAll("div.item"); You can also do parent child selectors. If you only wanted to grab an image inside of an item div, you could achieve that using the code below. 👇 const divs = document.querySelectorAll('.item img'); If you wanted to just select the first item and then the image inside of it, you could add the code below instead, which will return the first match. 👇 document.querySelector('.item img') Let's say the other item div also has a class of item2. You could add the following code 👇 const item2 = document.querySelector('.item2'); Searching Inside Already Selected Elements If you want to search inside of an element that you already selected, you can use querySelector on any other element like so 👇 const item2Image = item2.querySelector('img'); If you ever need to narrow down your focus as to where you are searching, you can do that in your selector, but you can also run querySelector() and querySelectorAll() on any other element and only search within it to limit the scope. <h2 id="wes">Sub Div</h1> If you have an element with an id, as shown in the code above 👆, you would be able to grab it using document.getElementById('wes');. Notice how you don't put the # sign before 'wes'? That is because if you're using anything that's not query selector, you don't have to pass . or #. The same works with document.getElementsByClassName(), but you don't pass the . from the classname. You can get all the work done with document.querySelector() and document.querySelectorAll() however, and they are much more flexible.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevIntroduction to the DOMNext →Element Properties and Methods'''
