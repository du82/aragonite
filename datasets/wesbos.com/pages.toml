title = "Announcing Learn Node! - Wes Bos"
description = "It's finally here! I'm super excited to announce my latest course - Learn Node. The last 5 months of my life have been spent creating this…"
full_description = '''The last 5 months of my life have been spent creating this server side course and it's honestly one of the best things I've ever made. I know a lot of you have been waiting patiently (and some not so patiently 😂) so grab it now at the launch price over at LearnNode.com Learn Node is my latest premium training course in which we learn to build full stack web apps with Node.js, Express, MongoDB, Passport JS and a few other friends. This is an extremely in depth course that covers everything from the core concepts to user accounts and authentication to image uploading + resizing and all the way through to deploying live to the web. If you want to up your JavaScript game and further your career while having fun building an application in Node.js, this course is for you. Together we will build "Now That's Delicious!", a full stack restaurant application which users can search, geolocate, review and curate their favourite restaurants from around the world. The application has three main models — Users, Stores and Reviews — all of which are relational. It is designed to hit upon many of today's application needs such as user authentication, database storage, Ajax REST API, file upload and image resizing. I've also added a bunch of new team licenses and snazzy new dashboard for distributing licenses. Forward this email to your boss and let them know they should grab it now. It's been 10 months since I've launched a paid course (ES6 for Everyone) and about that long since I went full time on creating free + premium courses. With this now being my primary income, it would mean the world to me if you could share my Learn Node course with a friend, co-worker or slack room. A fun, exercise heavy approach to learning Modern JavaScript from scratch. This is a course for absolute beginners or anyone looking to brush up on their fundamentals. Start here if you are new to JS or programming in general!'''
