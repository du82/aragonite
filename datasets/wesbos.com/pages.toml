title = "Variables and Statements - Beginner JavaScript - Wes Bos"
full_description = '''Variables and StatementsEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, VariablesEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtki { font-style: italic; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .mtk5 { color: #FF628C; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk4 { color: #0088FF; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } This video is going to teach you an introduction to variables. Variables are a building block of JavaScript, and you can't use JavaScript without knowing variables. We will cover what they are, what the different types of them are, what declaration means as well as what a statement is in JavaScript. Go into the /playground folder and make a new file variables.html. Use the HTML base snippet and add a script tag within the body. To make sure everything is working, add a console.log('hey'); within the script tag. Wes will explain the use of the semi colon shortly. If you open up the variables.html file in the browser, you should see 'hey' in the console. There are three different ways to make a variable, which in JavaScript we refer to as declaring a variable. They are: var let const var Let's start with var. To make a variable you type var and then you make a name of the variable. You can use almost anything for a variable name (we will discuss the restrictions shortly). var first = "wes"; What we have done there is created a new variable called first and we set it to a string of "wes" (we will discuss what a string is in a second). Now, if you refresh the variables.html page, and type into the console first, you will see that we actually get the value that is inside of that variable. You can also do it by doing adding a console.log() statement like so: <body> <script> var first = 'wes'; console.log(first); </script> </body> let The second way to declare a variable is with let. Below the declaration of the variable first, add 👇 let age = 300; If you refresh the variables.html page, and type in age, you will see 300 returned in the console. const The third way is with const. Below the age variable, add the following: 👇 const cool = true; That is what is called a constant variable. The naming of these things aren't great. Const means constant, but it's still called a variable. var, let, const are all different types of variables, and there are different ways to declare the variables and we will talk about the pros and cons to all of them in just a second. Statements and Semi-Colons in JavaScript Before we do that, let's discuss the semi-colon Wes is adding after each JavaScript line. Semi-colons are used to terminate the line of code in JavaScript. Below is an example of what is referred to as a statement in JavaScript. var first = "wes"; A statement is an instruction to the computer, browser, the JavaScript interpreter to do something. This can usually be summarized as a variable that was declared, a variable that was updated, a function that was called, or something was logged to the console. Anytime you want to do something in JavaScript, that is referred to as a statement. When you are done writing your statement, you add a semi-colon to the end of the line. var first = "wes"; // variable declaration statement let age = 300; const cool = true; console.log(first); // function call statement Code Blocks One thing that we will run into in JavaScript is something called a code block. For example, add the following line of code to variables.html and refresh the page. if (age > 10) { console.log("you are old"); } You should see the message "you are old" in the console. The question is how come we didn't put the semi-colons after each line like this 👇 if (age > 10) {; console.log("you are old"); }; That is because it's something that is referred to as a code block. Code blocks are things that are bound by these curly brackets { and }. Things like function definitions, if statements, loops do not need a semi-colon at the end because you aren't telling the computer to do something. In those instances, you are just running some code and telling the computer to do something inside of the block. Throughout the course Wes will continue to mention why we do and do not use the semi-colon so you can get the hang of it. It is possible to get away without writing semi-colons in JavaScript because there is something in JavaScript called ASI, which is automatic semi-colon insertion, but we are not going to cover that because it's a much more advanced topic. Differences between var, let & const Let's talk about the difference between the three types of variables. Remove all the extra JavaScript code within variables.html except for: <script> var first = "wes"; let age = 300; const cool = true; </script> The values of the var and let variables can be updated. If you ever wanted to change what the value is of one of those variables, you can simply just change it. For example, if you add the following line of JavaScript, refresh variables.html in the browser and type first in the console, you should see the value 'westerhoff' returned. first = 'westerhoff'; The same can be done with the age variable. For example type in the console age = 400. That updates the value of the age variable. You can either run the JavaScript from the variables.html page, or you can run it from the console. Because the variables in variables.html are global variables (which we will cover in a future video), we can modify them either in the script tag within variables.html or directly from the console. Notice that we do not have to redeclare the variable. We did not have to do something like this: var first = "wes"; let age = 300; const cool = true; var first = "westernhoff"; That is actually a bad practice and in most cases, won't even work. You only need to declare the variable with var, let, or const, and then whenever you want to update the value, you don't need to put the variable keyword in front of it, you can just go ahead and set it to it's new value. You cannot set a const variable to be something else (there are instances where you can change a const variable, that will be handled later). If you were to go cool = false, you will see the following error: 👇 Errors in JavaScript will tell you what went wrong and where it went wrong. Here it says 👇 Uncaught TypeError: Assignment to constant variable on Line 18. That error is describing exactly what we did, which was that we tried to change a boolean value that was set to a constant variable. Constant variables cannot be changed, so think of them like an API key or something that you never want changed. You set those to a constant, and the value of that variable can never be changed. It is not completely true that it can never be changed, which we will follow up on when we get to arrays and objects (meaning that there is a difference between the array or object that it is bound to and the values that live inside of it). What we need to know right now is just that var and let variables can be changed or updated, and const variables cannot. Strict Mode The next thing you need to know about variables is this thing called Strict Mode. 🔥 Tip: While in your code editor, you can select a block of text and on your keyboard press Command + / (Ctrl + /, Windows and Linux) to comment out your code. Commenting out code makes your browser skip that code. It'll still be there, but the browser will not run it. If you put this code in the script tag, refresh variables.html and write dog in the console, the console will return the value of "snickers". <script> // var first = 'wes'; // let age = 300; // const cool = true; // first = 'westerhoff'; // cool = false; dog = "snickers"; </script> We made a variable even though we did not use var, let, or const. What is going on? How can that happen? Now if we go to the top of our opening script tag, and add "use strict"; and then refresh the page, we will see this error: dog is not defined In the early days of JavaScript, it was possible to create a variable without first declaring it, and the browser would just add the var on behalf of the user. That leads to bad code down the road, it's pretty sloppy and it's not something that you want to do. So what happened? JavaScript still supports the old method of not declaring a variable because it has to be backwards compatible with early JavaScript code. But they introduced a new mode into browsers named strict mode, which will throw an error if you try to do something like not declaring a variable properly. dog = "hugo"; // will throw an error in strict mode Another thing you can do is to declare a variable and then update it on the next line like so 👇 var dog; dog = "snickers"; That will work because what happens here is if you comment out the second line so it's just var dog; and refresh variables.html, when you type dog into the console you will have the value of "undefined" returned to you. Strict mode is useful but we won't be typing it every time in this course because we are going to be following best practices and it is enforced by default when you are using ECMAScript Modules, and modules are probably how you are going to be writing all of your modern JavaScript. Scoping Now let's talk about the second difference between var, let, and const, which is scoping. Clear your JavaScript code until it's back to the three variables we had at the beginning. var first = "wes"; let age = 300; const cool = true; Scoping in JavaScript answers the question "Where are my variables available to me?" We are going to have an entire section of this course focused on scoping because it's such a fundamental part of JavaScript, but for now we need to know that: var variables are scoped differently than let and const variables. var variables are what we refer to as function scoped variables (they are only available within the parent function). let and const variables are what we refer to as block scoped variables. What does this mean?! We are going to learn what blocks and functions are in the future. Since we haven't covered that yet, just put that on pause temporarily until the functions and blocks video. We will continue on in the functions and block video about this. The question is, what are we going to be using in this course? They are all valid. let and const were introduced as part of what is called es6, which is only a couple of years old. var has been around since JavaScript was invented. You may sometimes see people say var variables are old or deprecated, but they are not. It's just that some developers (Wes included) prefer to use let and const because the block scoping makes more sense as well the benefit of assigning a constant value to these variables and not accidentally overwriting a variable which can lead to bugs. Here is how Wes approaches deciding which of the three to use: He uses const by default. Anytime he is assigning a new variable, he just defaults it to const because he doesn't know if he'll need to update that value or not. If he needs to change a value of a variable, he will use a let. Sometimes he will make a variable const and then realize he needs to update it so he will make it a let variable. Wes almost never uses a var variable. There are some exceptions like when declaring a variable outside of a block but we will go into more detail about that shortly. Naming Conventions Last thing we need to talk about is naming conventions. What can you call your variables? As a convention, variables should not start with a capital. For example, this code below will work in the browser. It is not wrong or broken JavaScript, but it's a convention that variables should not start with a capital unless they are a class (we will get into what classes are in the future). const Dog = "bowser"; Variables must start with either a letter (a,b,c,D,X, etc). They can also start with or contain an underscore _ or dollar sign $. They can also contain but may not start with a number. For example you could create the variable below and it would work. A variable like $_$ would also work. const $$$$$$$$ = 100; $ and _ are the only non a-Z characters that can be used at the start of a variable name. Tip: the _ symbol is sort of synonymous with a library called lodash, and the $ symbol is sort of synonymous with a library called jQuery so you don't normally make your variables called $ or _ because they have sort of been taken as a convention. You can however certainly include them if you want. Camel Casing Sometimes a variable is made up of two w'''
