["https://wesbos.com/javascript/05-events/accessibility-gotchas-and-keyboard-codes"]
title = "Accessibility Gotchas and Keyboard Codes - Beginner JavaScript - Wes Bos"
full_description = '''Accessibility Gotchas and Keyboard CodesEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, Events, AccessibilityEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtki { font-style: italic; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk11 { color: #FB94FF; } .cobalt2 .mtk6 { color: #FFEE80; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } Making a website accessible means that you are making it usable to everyone and anyone, regardless of what disability they may have, or what input device they are using, or what situation they are currently in. If HTML is marked up correctly, it will be accessible. However, what often happens is JavaScript developers will often add code that only works with the mouse for example, and therefore aren't accessible to anyone. In this video, we will cover the common pitfalls that happen in JavaScript. Most accessibility goof-ups happen not because someone is purposely trying to prevent a certain type of user from accessible the website. They are typically accidental and the developer just did not know what to look for or check to ensure it's still accessible. Difference between Buttons and Links The difference between buttons and link is a big accessibility issue. Buttons are meant to be used for actions that happen inside of an application. Links on the other hand are used to change the page. Do not mix those up. Links are not meant to be used where buttons are. Wes sees code like this all the time 👇 <a href="#">Save</a> Then the developer will add a click event via JavaScript to the a tag and preventDefault, and then perform some sort of action. However, that is not a use-case for a link because that "Save" click doesn't redirect you to anywhere, and thus is not a link. That is a good use case for a button (an action within your application or website). It's still fine to prevent default on a specific link. For example, on Twitter, if you try to click "tweets and replies" while not logged in, you will see a modal popup saying "You are not logged in". That is an example of a valid use case for using prevent default with a link. When you need to do something, don't mix up buttons and links. Keyboard Accessibility Elements that are not keyboard accessible should not have clicks registered on them, unless you need to. For example, let's say you have an image like so: <img class="photo" src="https://picsum.photos/200" alt="Nice"> Via JavaScript, select the photo and add a click event listener. const photo = document.querySelector(".photo"); photo.addEventListener("click", function() { console.log("you clicked the photo"); }); There are plenty of valid use cases for clicking on a photo. For example, maybe it will open up a larger version of that photo, or you want to draw on the photo or zoom it in. If you refresh the HTML page and click on the photo, you will see "You clicked the photo" logged every time you click it. If you threw your mouse away, using the tab button on your keyboard, you should be able to tab through everything on the browser. However, you will not be able to click on the photo with only the keyboard. That is a problem because if the user doesn't have a mouse or they are unable to use a mouse, then they can't use that part of your website. An easy solution is giving the element the following attribute: role="button". If you mean for something to be a button that is not a button tag, such as a div, if you mean for it to be used like a button, you should add the role attribute like so 👇 <div role="button" tabindex="0">click me</div> You also need to add the tabindex attribute when you add the role="button". You will likely set that to 0, which will put that element in the flow so people can tab to it with their keyboards. For the image, you could give it a role of button, but it's easier to put the image actually inside a button, like so 👇 <button> <img class="photo" src="https://picsum.photos/200" alt="Nice" /> </button> If you modified the code like so instead, like so 👇 <div role="button" tabindex="0">Click me</div> <img class="photo" tabindex="0" src="https://picsum.photos/200" alt="Nice" /> Now if you tab using your keyboard, you can go back and forth between the image and the div with button role. If you focus on the image like shown above and hit the enter key, unlike some other buttons and elements, it will not trigger a click. If that is the case, you have to go back to your JavaScript and move the anonymous function that you pass to the click event listener and make it named function. Modify the click event listener to call handlePhotoClick instead and then duplicate the event listener and add another listener but on the keyup event this time, like so 👇 function handlePhotoClick() { console.log("you clicked the photo"); } photo.addEventListener("click", handlePhotoClick); photo.addEventListener("keyup", handlePhotoClick); Now, when you go to the image, you can click on over to it. You might notice that when upi tab to the image, the console is logging "You clicked the photo", even though you haven't actually clicked it yet (we only care about the enter key). How can you only listen for the enter key? The event has a bunch of information about this. The event object should have event.key and event.keycode. event.key is more modern and supported in more browsers. Every single key on an event will give you a bunch of information. Wes has a website, http://keycode.info, on which you can press any key and it will give you the meta information about that key. There is event.key, event.which, event.code and event.key. event.key is the best way to go about it. Now what we can say is if the event is a click or if the event.key equals enter like so: 👇 function handlePhotoClick(event) { if (event.type === "clicked" || event.key === "Enter") { console.log("you clicked the photo"); } } Now if you try tabbing and then pressing enter when on the image, you will see "You clicked the photo" logged, meaning it is accessible. Accessibility is something that people tend to forget about, but it only takes about 10 minutes of work to ensure it's accessible.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevPrevent Default and Form EventsNext →Etch-a-Sketch'''
