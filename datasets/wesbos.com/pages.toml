title = "Coercion, Ternaries and Conditional Abuse - Beginner JavaScript - Wes Bos"
full_description = '''Coercion, Ternaries and Conditional AbuseEnjoy these notes? Want to Slam Dunk JavaScript?These are notes based on my Beginner JavaScript Video Course. It's a fun, exercise heavy approach to learning Modern JavaScript from scratch.Use the code BEGINNERJS for an extra $10 off.BeginnerJavaScript.comJavaScript, CoercionEdit Post .grvsc-container { overflow: auto; position: relative; -webkit-overflow-scrolling: touch; padding-top: 1rem; padding-top: var(--grvsc-padding-top, var(--grvsc-padding-v, 1rem)); padding-bottom: 1rem; padding-bottom: var(--grvsc-padding-bottom, var(--grvsc-padding-v, 1rem)); border-radius: 8px; border-radius: var(--grvsc-border-radius, 8px); font-feature-settings: normal; line-height: 1.4; } .grvsc-code { display: table; } .grvsc-line { display: table-row; box-sizing: border-box; width: 100%; position: relative; } .grvsc-line > * { position: relative; } .grvsc-gutter-pad { display: table-cell; padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } .grvsc-gutter { display: table-cell; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter::before { content: attr(data-content); } .grvsc-source { display: table-cell; padding-left: 1.5rem; padding-left: var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)); padding-right: 1.5rem; padding-right: var(--grvsc-padding-right, var(--grvsc-padding-h, 1.5rem)); } .grvsc-source:empty::after { content: ' '; -webkit-user-select: none; -moz-user-select: none; user-select: none; } .grvsc-gutter + .grvsc-source { padding-left: 0.75rem; padding-left: calc(var(--grvsc-padding-left, var(--grvsc-padding-h, 1.5rem)) / 2); } /* Line transformer styles */ .grvsc-has-line-highlighting > .grvsc-code > .grvsc-line::before { content: ' '; position: absolute; width: 100%; } .grvsc-line-diff-add::before { background-color: var(--grvsc-line-diff-add-background-color, rgba(0, 255, 60, 0.2)); } .grvsc-line-diff-del::before { background-color: var(--grvsc-line-diff-del-background-color, rgba(255, 0, 20, 0.2)); } .grvsc-line-number { padding: 0 2px; text-align: right; opacity: 0.7; } .cobalt2 { background-color: #193549; color: #fff; } .cobalt2 .mtk3 { color: #FFC600; } .cobalt2 .mtk9 { color: #9EFFFF; } .cobalt2 .mtk8 { color: #E1EFFF; } .cobalt2 .mtk15 { color: #FF9D00; } .cobalt2 .mtk5 { color: #FF628C; } .cobalt2 .mtk1 { color: #FFF; } .cobalt2 .mtk10 { color: #80FFBB; } .cobalt2 .mtk17 { color: #92FC79; } .cobalt2 .mtk16 { color: #A5FF90; } .cobalt2 .mtk7 { color: #3AD900; } .cobalt2 .mtk6 { color: #FFEE80; } .cobalt2 .mtk11 { color: #FB94FF; } .cobalt2 .grvsc-line-highlighted::before { background-color: var(--grvsc-line-highlighted-background-color, rgba(255, 255, 255, 0.1)); box-shadow: inset var(--grvsc-line-highlighted-border-width, 4px) 0 0 0 var(--grvsc-line-highlighted-border-color, rgba(255, 255, 255, 0.5)); } Coercion can seem like an intimidating word but it's a pretty simple concept to understand. So far, we have learned that if you only need to use bang operator !, that checks for the opposite. For example, if you wanted to check if someone is not cool, you might think you have to do the following 👇 const isCool = true; if (isCool) { } else { console.log('You are not cool'); } In the situation where you are only ever using the else, that is because you want the opposite of a value. You could have done something like the following, 👇 if (!isCool) { console.log('You are not cool'); } A bang in front of a boolean will always flip it. So if isCool = true, then !isCool would evaluate to false. In addition to flipping the boolean to the opposite, it also does coercion. Coercion is when you force something that is of a different type, such as a string or number, or an object or anything like that and force it into another type. For example when we coerce something into a true boolean. Let's do an example. If you type name into the console, it should return "wes" (we assigned that variable in earlier exercises in this JavaScript file). If you type !name in the console, it should return false. You will notice that !name took the string and turned it into a boolean by putting the bang in front of it. So when you use the bang, it will coerce the value into a real boolean. That is sort of the opposite because if we want to check if there is a name, if we want to take the fact that there is a name and make it into a real boolean, we can put double bang in front of it !! and that will coerce it into a Boolean of it exists or not. So !!name would return true. Here is another example: Let's say you have a middle variable that is assigned an empty string, like so 👇 const middle = ""; When you put 1 bang inmfront of it, it gave us the opposite which was true. If you put 2 bangs, it gives you false. If you ever see the ! and !! being used in the if statements, that is because someone is taking the fact that you have a truthy or falsy value, and are coercing it into a true boolean. Wes used to use that quite a bit, but now that he has a really good understanding of truthy and falsy values, he doesn't use this coercion method much. Coercion in general is the act of changing one type into another. Ternary Next up we have ternary. Wes likes to think of ternary's as shorthand if statements. They are helpful when you quickly want to run functionality based on something being true or false. A ternary needs 3 things: A condition What to do if it' true What to do if it's false. For example 👇 const count = 2; let word; if (count === 1) { word = 'item'; } else { word = 'items'; } So if you had a sentence that said how many items in your cart for example, you could so something like 👇 const sentence = `You have ${count} ${word} in your cart`; console.log(sentence); If you changes count to be 1, it would return the following sentence 👇 The if statement that you wrote above is a bit verbose.. you first have to declare an empty variable and then update it. What we can do, if it's a simple if else like in this example, you can turn it into a shorthand if statement with ternary. Comment out the if statement that you wrote above, because we will be replacing it was a ternary statement. Like we mentioned above, for a ternary statement, we need one condition, then we need what to do if that condition is true, and what to do if that condition is false. That would look like this 👇 const word = count === 1 ? 'item' : 'items'; If you run that in the console like so 👇 const count = 0; const word = count === 1 ? 'item' : 'items'; const sentence = `You have ${count} ${word} in your cart`; console.log(sentence); You should see that it works. What this does is it puts the if statement where we have our condition (something that will be true or false) (count === 1) and then we have what to return if true ('item'), and finally what to return if false (items). That is useful when you need to do a quick if statement. You could even take the example above a step further and do the ternary function directly inside of the sentence like so 👇 const count = 0; const word = count === 1 ? 'item' : 'items'; const sentence = `You have ${count} item${count === 1 ? '' : 's'} in your cart`; console.log(sentence); What you are doing here is saying if count is equal to 1, return nothing, and if it's not, return "s". That works exactly the same. You can also use these for running functions. For example, let's say you have a variable like const isAdmin = true;. You can run a function based on if we have it or not, like so 👇 isAdmin ? showAdminBar() : null; So in that example, if the isAdmin variable is set to true, you would show the admin bar, otherwise you would do nothing which is why you are returning null. You could also return an empty string or anything really because it's not saving that variable anywhere, it is just checking if it is true. If it is true, it will run a function. It is important to note that both what happens when it's true and when it's false needs to be there for a ternary statement. isAdmin ? showAdminBar(); The code above 👆 would not be valid. You need to supply the false case. There is one trick you can do, the && trick. The neat thing about chaining stuff on conditions is it will check along the way to make sure that things are true. For example let's say you had 3 functions and you wanted to make sure that all 3 functions are true before going ahead. You can do an if statement like so 👇 function check1(){ return true; } function check2(){ return true; } function check3(){ return true; } if (check1() && check2() && check3()) { console.log('all checks passed'); } If you run that in the browser, you will see "all checks passed" logged in the console. console.log('Running check 1'); Now inside each function, add the code above 👆 with the corresponding function number (running check 1, running check 2 etc). What is cool about this is if you refresh the page and look in the console, you will see each one running in order 👇 Now if we put an else like so, and make one of the checks fail (modify one to return false) like so 👇 function check3() { return false; } if (check1() && check2() && check3()) { console.log('all checks passed'); } else { console.log('Some checks failed'); } When you run in the browser you should see the following 👇 Did the third check ever run? No, it never did. If you run a condition, JavaScript will do the following: it will check the first one, and then if it's okay, it will move to the next condition. If that next condition is true, it will go onto the next one. If at any point one of them is false, JavaScript will give up and say that one is false, there is no reason I would keep checking.. Therefore it returns the condition as false, and the third condition never runs and the else block will run. That is sometimes referred to in JavaScript as short-circuiting, meaning that we never finished what we wanted, but we knew it wouldn't work out anyway so we short-circuited it and went directly to else. The way that works can be abused or used. Some people hate it, some love it. Wes personally likes it. Let's go back to the admin example to demonstrate what that can look like 👇 isAdmin ? showAdminBar() : null; isAdmin && showAdminBar(); We can abuse it by using isAdmin && showAdminBar(); JavaScript will say, this is a condition so check if the first is true, and if it is true, we will go ahead and do the next one. However if it is false, it won't run showAdminBar(). This is abusing the condition chaining, meaning that if the first condition is false, the second will never run. You see that sort of thing in React because it's a bit hard to do if statements in React. You would do something like this in React if you wanted to conditionally render the admin bar based on whether the isAdmin value is true or false 👇 {isAdmin && <AdminBar/>} Blockless If Statements If something is on the same line, you don't actually need the block in the if statement. For example, the following if statement is on multiple lines so it needs the {} block 👇 if (isAdmin) { showAdminBar(); } However, you could refactor it to be on one line like so 👇 if (isAdmin) showAdminBar(); However, as soon as it goes onto another line, it is broken, so the code below would not be valid 👇 if (isAdmin) showAdminBar(); Should you use blockless if statements? That is up to you to decide. Wes doesn't use it often but he definitely has in the past because it is very convenient to write one-liners. In most cases however Wes will use the blocks just in case someone else accidentally moves the if statement to multiple lines and breaks it.Find an issue with this post? Think you could clarify, update or add something?All my posts are available to edit on Github. Any fix, little or small, is appreciated! Edit on Github← PrevIf Statements, Function Returns, Truthy and FalsyNext →Case Switch and Animating a Turtle with CSS Variables'''
