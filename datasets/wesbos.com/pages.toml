full_description = '''These last few examples we've been creating HTML and inserting it right into the DOM. If you have any sort of security background and you're probably screaming, "Wes, you must sanitize that data before you put it into the DOM!!!" If you don't know what that means, essentially when you get data from a user, or whenever you're displaying data from an untrusted (or even what you think is trusted) source, you must make sure that the user isn't doing any Sneaky Pete stuff on you, and trying to maybe insert an iFrame, or an image, or to do an XSS attack. Let's assume I took this first name in the about me. I got that from a database, an API or something sort of data source where the user had this saved in their database. They set their bio to be, "I love to do evil," and they inserted an image from Unsplash, which is allowed. You can insert an image into your bio, no problem, but they do the Sneaky Pete thing here by inserting an onload=alert('you got hacked');, so when this image loads, it runs some JavaScript. That is a huge problem. You cannot let your users run JavaScript on your page because then they could drain your bank account, or delete your app, or post spam, or really anything! Imagine if you let someone run JavaScript on Facebook. You could have people unfriending everyone, or you could look at all of their messages, or send nasty messages on their behalf. I'm taking it, carte blanche, putting it into the DOM, I refresh, and I get this message, "You got hacked." That is what's called an XSS, cross site scripting, where we let someone else run JavaScript on our page. That's really dangerous. The solution to this is to sanitize your HTML. This is another place where you could use the tag template. In creating all this HTML here, I have all kinds of inputs from a user. But before I put it into my HTML, it's probably a good idea to run it through a sanitizer, so our HTML will look something like this: I've loaded it in this library called DOMPurify. It's a pretty good library that we use to sanitize. You can have all kinds of options in here in terms of what tags are allowed and aren't allowed. There are all kinds of sanitize libraries here.'''
