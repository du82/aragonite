["https://wesbos.com/twitter-cropping-vertical-video"]
title = "Twitter Cropping Vertical Video - Wes Bos"
description = "TLDR: Use 1080x1920 for TikTok, YouTube Shorts and Instagram Reels. I've settled on quickly re-editing my 1080x1920 into 1920x1920 for…"
full_description = '''I've been doing a bunch of vertical video lately for TikTok, Twitter, YouTube Shorts, Instagram Reels, and even LinkedIn. Inside of that, there is a "safe zone" - the area where its safe to put things like text that wont be cut off. Recently I received a few reports of my code being cut off on Twitter mobile apps - very frustrating. Almost every phone on this list had at least one instance of not cropping. So this is clearly an issue with Twitter. Since the video on Twitter doesn't have to be 1080 x 1920, I thought about adding some width to the video, to see if that would stop it from cropping. After a few tests, I found that adding 25px to each side tricked whatever aspect ratio twitter was looking for into showing the entire video. I tried uploading the same 1105x1920 to TikTok, and that seems to show the entire video as well, but then you lose the "full screen" feel. So now I need to decide if I will export two copies of my video - one for Twitter, and one for everything else. A fun, exercise heavy approach to learning Modern JavaScript from scratch. This is a course for absolute beginners or anyone looking to brush up on their fundamentals. Start here if you are new to JS or programming in general!'''
