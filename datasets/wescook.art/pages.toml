full_description = "Home Interior Design Personal I’ve been trying to figure this one out. I think there’s a chance this was Wes designing the interiors of his own home — the swinging doors for the Studio gave me that hope. But it’s totally possible this was client work for somebody else’s house. One thing I can’t emphasize enough is how wild it was that Wes was not only an incredible artist, but an extremely technical draftsman. (And, if you’re wondering if those shapes on the door are rather… phallic?… I’d say they definitely are, and it was definitely intentional.) ←Figure Study 5 Minute Man→"
