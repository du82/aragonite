title = "McDonalds’s Circus Mural – The Wes Cook Archive"
description = '''This sketch is so loose/light that at first I wasn't sure it was Wes, but it has his tell tale specifications and markings. (I love that the sky says "Hi there! I'm blue now!" in the upper left corner. And do NOT draw the valances!) I'm excited to see this was for a McDonalds in…'''
full_description = "McDonalds’s Circus Mural McDonalds This sketch is so loose/light that at first I wasn’t sure it was Wes, but it has his tell tale specifications and markings. (I love that the sky says “Hi there! I’m blue now!” in the upper left corner. And do NOT draw the valances!) I’m excited to see this was for a McDonalds in Düsseldorf-Oberkassel, Germany. Anyone there ever see this in person? ←McDonald’s Centralia Mural: Sketch McDonald’s Cut-Out Panels→ This sketch is so loose/light that at first I wasn’t sure it was Wes, but it has his tell tale specifications and markings. (I love that the sky says “Hi there! I’m blue now!” in the upper left corner. And do NOT draw the valances!) I’m excited to see this was for a McDonalds in Düsseldorf-Oberkassel, Germany. Anyone there ever see this in person?"
