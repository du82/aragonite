title = "The McDonald’s Centralia Mural – The Wes Cook Archive"
description = "This is the mural that took me on this whole incredible journey. If you're curious how, please watch my XOXO 2024 talk. Full of incredible detail, a phenomenal sense of depth and character, whimsical feelings and beautiful color — even 44 (!) years later. There are a few ketchup stains. There's also a whole story about…"
full_description = "The McDonald’s Centralia Mural McDonalds This is the mural that took me on this whole incredible journey. If you’re curious how, please watch my XOXO 2024 talk. Full of incredible detail, a phenomenal sense of depth and character, whimsical feelings and beautiful color — even 44 (!) years later. There are a few ketchup stains. There’s also a whole story about a part of the mural that got modified by another artist — I’ll add that here when I get a chance. It’s hard to express how incredible it is, when you’re not standing in front of it. If I hung this mural up on display in our office in Portland, OR, would you come and see it? Let me know. ←Swee’pea’s Schoolyard Academy Awards: “Ballad of Cat Ballou” Set→"
