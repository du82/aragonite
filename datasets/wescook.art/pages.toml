["https://wescook.art/2024/10/09/setmakers-studio-painting-platform"]
title = "Setmakers Studio Painting Platform – The Wes Cook Archive"
description = "This is one of my favorite pieces, because it tells such an incredibly perfect story about Wes and who he was. This is Wes, designing his very own painting platform, to use in the Setmakers Studio where he would paint his giant McDonalds murals. I'm sure this was very very specifically designed for the ergonomics…"
full_description = "Setmakers Studio Painting Platform McDonalds This is one of my favorite pieces, because it tells such an incredibly perfect story about Wes and who he was. This is Wes, designing his very own painting platform, to use in the Setmakers Studio where he would paint his giant McDonalds murals. I’m sure this was very very specifically designed for the ergonomics necessary to do his work. This is the equivalent of asking your boss for a cool standing desk or something, but taken to the most impeccable extreme. Who amongst you wants to try to build this? ←Woman Disneyland Christmas Parade 1964 • Gorilla Cage→"
