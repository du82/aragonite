["https://wescook.art/2024/10/09/mother"]
title = "Mother – The Wes Cook Archive"
description = '''An incredible portrait of Wes Cook's mother. If the date is accurate, I think he was 20 years old when he drew this — an incredible accomplishment also making it his earliest pieces in my collection. One small detail is that his signature here is just "COOK", written in a very different style than the "Wes…'''
full_description = "Mother Personal An incredible portrait of Wes Cook’s mother. If the date is accurate, I think he was 20 years old when he drew this — an incredible accomplishment also making it his earliest pieces in my collection. One small detail is that his signature here is just “COOK”, written in a very different style than the “Wes Cook” signature on everything else. He was definitely still figuring out his style and his identity. (I also think there’s a chance the legend in the lower right hand corner was added to the piece much later.) Was “Stan Reckless” his art teacher for this class? ←5 Minute Man Woman→"
