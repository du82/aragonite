["https://wescook.art/2024/10/10/the-lost-mcdonalds-satire-triptych"]
title = "The Lost McDonalds Satire Triptych – The Wes Cook Archive"
description = "When I first discovered Wes Cook's artwork, and quickly headed to eBay, this item had just sold. That's right. I don't have this. So I can't scan it. And that's normally fine but, painfully, this is one maybe one of the most important Wes Cook pieces to exist, in my opinion. Yes, your eyes aren't…"
full_description = "The Lost McDonalds Satire Triptych McDonalds When I first discovered Wes Cook’s artwork, and quickly headed to eBay, this item had just sold. That’s right. I don’t have this. So I can’t scan it. And that’s normally fine but, painfully, this is one maybe one of the most important Wes Cook pieces to exist, in my opinion. Yes, your eyes aren’t deceiving you. Wes Cook was working on a beautiful painting of the Baptism, Crucifixion, and Ascension of Christ… as told via Ronald McDonald and the gang. Yes, Grimace is weeping at the feet of Ronald/Christ. Yes, Captain Crook seems to be a scheming Pontius Pilot. Yes, that’s a yamaka (sic) on Big Mac. What an incredible piece of satire. What an incredible thing to make. And what a thing that could have only existed during this exact time — if you were an official McDonalds artist, and you drew even 1% of this today, your friend would post it on social media within the minute, and you would be fired within the hour. But back then? How would they ever find out? A friend of Wes, David Doherty, told me it was always Wes’ plan to complete the finished painting, and use it as a Christmas card one year. What a moment that would have been. Suffice it to say: if you’re the one who bought this from eBay, please, please let me borrow it and do a proper scan for history. Send me an email any time. Here are the only pictures I have of this piece — poor-quality JPG images from a completed eBay listing. I’ll cross my fingers. (And thank you for doing this, Wes.) ←Dirt Road McDonald’s Stage 5 Re-Do (Part 1)→"
