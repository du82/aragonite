["https://wescook.art/about"]
title = "About – The Wes Cook Archive"
description = "Floyd Wesley “Wes” Cook was born in Hollywood, California, on March 24, 1931… I think? Maybe. You see, as of this writing, there's no Wikipedia page for Wes. There's no book of his work. Every piece of information I have about Wes I scrapped together from people who knew him, documents I found, and little…"
full_description = "About Floyd Wesley “Wes” Cook was born in Hollywood, California, on March 24, 1931… I think? Maybe. You see, as of this writing, there’s no Wikipedia page for Wes. There’s no book of his work. Every piece of information I have about Wes I scrapped together from people who knew him, documents I found, and little bits and pieces of information, as I tried to draw my own mental picture of this incredibly talented artist. Wes existed in that pre-internet zone when you did your job and you did your absolute best job at your job, but it was just that: a job. Despite being a literal master artist, he was only known by his peers. Wes Cook died in 2004. He had no heirs, no family. His life’s work was left in a storage locker that went unpaid, eventually being sold at auction. I purchased all I could from the person who bought his storage locker, until I basically ran out of money. Oops. He deserves to be world famous. Maybe it’s not too late. About Cabel To understand why I’m the person making this website, I really recommend you watch my XOXO 2024 talk. It will explain it better than any of my words on this page. For my day job, I work at Panic. We make Mac apps like Transmit, Nova, and Prompt — we publish video games, like Untitled Goose Game, Firewatch, Thank Goodness You’re Here!, Arco, and Nour — and we make a handheld video game system called Playdate. You can find my personal blog here. And you can email me here! Credits Images were captured by Pushdot Studio here in Portland, OR. The McDonald’s Centralia Mural was photographed by Aaron Lee. Wes Cook signature vectorized by Louie Mantia."
year_published = 2024
year_updated = 2024
