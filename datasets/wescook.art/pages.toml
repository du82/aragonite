["https://wescook.art/2024/10/09/the-wheely-bird"]
title = "The Wheely Bird – The Wes Cook Archive"
description = "Another incredible design that was built almost exactly as Wes had rendered it. I might as well use this piece of art to explain a key piece of the Wes timeline: his jump from Sid and Marty Krofft to Setmakers, who did all the McDonalds commercials and artwork. You see, the McDonaldland characters were super…"
full_description = "The Wheely Bird Pufnstuf Another incredible design that was built almost exactly as Wes had rendered it. I might as well use this piece of art to explain a key piece of the Wes timeline: his jump from Sid and Marty Krofft to Setmakers, who did all the McDonalds commercials and artwork. You see, the McDonaldland characters were super similar to the work that Sid and Marty Krofft were doing for television. They were so similar, that Sid and Marty Krofft actually filed a lawsuit against McDonalds. Plaintiffs filed suit in September 1971. The complaint alleged, inter alia, that the McDonaldland advertising campaign infringed the copyrighted H. R. Pufnstuf television episodes as well as various copyrighted articles of Pufnstuf merchandise In the eventual ruling from the United States Ninth Circuit Court of Appeals, one paragraph stood out to me: In fact, Needham had already been awarded McDonald’s advertising account and was proceeding with the McDonaldland project. Former employees of the Kroffts were hired to design and construct the costumes and sets for McDonaldland. Needham also hired the same voice expert who supplied all of the voices for the Pufnstuf characters to supply some of the voices for the McDonaldland characters. That has to be Wes. He was right in the middle of this tense situation, having left Sid and Marty to build McDonaldland. I wonder why Wes left. More money? More prestige? Anyway, here’s Wes Cook’s Wheely Bird as it was built: ←The Evil Trees McDonald’s Centralia Mural: Bull→"
