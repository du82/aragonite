title = "McDonald’s Stage 5 Re-Do (Part 1) – The Wes Cook Archive"
description = "Here's the thing that's hard for me to unpack with Wes: how incredibly technical his skills could be. Did he train as a fine artist, and an architect? Or did this kind of thing just come naturally to him? Either way, here's an incredible technical drawings showing the construction of a Gobblin puppet. To my…"
full_description = "McDonald’s Stage 5 Re-Do (Part 1) McDonalds, Unknown Here’s the thing that’s hard for me to unpack with Wes: how incredibly technical his skills could be. Did he train as a fine artist, and an architect? Or did this kind of thing just come naturally to him? Either way, here’s an incredible technical drawings showing the construction of a Gobblin puppet. To my eyes, it’s designed to stand up? And I’m really curious what the “Re-Do” is in reference to — maybe there was a disastrous first try at this commercial? Here are the puppets in action! ←The Lost McDonalds Satire Triptych McDonald’s Stage 5 Re-Do (Part 2)→"
