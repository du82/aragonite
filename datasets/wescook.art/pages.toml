title = "Woman – The Wes Cook Archive"
description = "To be honest, I'm not 100% sure this is a Wes Cook piece. While it was included in the giant batch of art that I acquired, there's a chance the eBay seller included it on accident from another lot. There's no telltale Wes signature, which is unusual. But that being said, it definitely looks accomplished…"
full_description = "Woman Personal To be honest, I’m not 100% sure this is a Wes Cook piece. While it was included in the giant batch of art that I acquired, there’s a chance the eBay seller included it on accident from another lot. There’s no telltale Wes signature, which is unusual. But that being said, it definitely looks accomplished enough to have been done by Wes. If anyone knows anything about the piece, leave a comment! ←Mother Setmakers Studio Painting Platform→ To be honest, I’m not 100% sure this is a Wes Cook piece. While it was included in the giant batch of art that I acquired, there’s a chance the eBay seller included it on accident from another lot. There’s no telltale Wes signature, which is unusual. But that being said, it definitely looks accomplished enough to have been done by Wes. If anyone knows anything about the piece, leave a comment!"
