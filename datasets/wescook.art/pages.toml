["https://wescook.art/2024/10/09/the-professors-pineapple-slicing-machine"]
title = "The Professor’s Pineapple Slicing Machine – The Wes Cook Archive"
description = "So. This is an extremely interesting piece to me, for one reason: the Hula Burger. It's McDonald's legend that in 1960 Ray Kroc once tested a Hula Burger — designed for Catholics who didn't eat meat on Fridays — and the Hula Burger was literally a slice of pineapple with cheese in a bun. (Honestly, that…"
full_description = "The Professor’s Pineapple Slicing Machine McDonalds So. This is an extremely interesting piece to me, for one reason: the Hula Burger. It’s McDonald’s legend that in 1960 Ray Kroc once tested a Hula Burger — designed for Catholics who didn’t eat meat on Fridays — and the Hula Burger was literally a slice of pineapple with cheese in a bun. (Honestly, that sounds delicious to me.) The Hula Burger flopped and was eventually replaced by the Filet-O-Fish, which served the same goal. I can’t think of another reason for this piece of art than to support the Hula Burger… but this art was almost certainly done in the 70’s, long after the Hula Burger was extinct. (Anybody know the number for the McDonalds Corporate Archives department?) ←McDonald’s Mural: Hawaii Sketch Uncle O’Grimacey→"
