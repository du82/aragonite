title = "wgpu - Rust"
description = "A cross-platform graphics and compute library based on WebGPU."
full_description = "Crate wgpuCopy item pathSource Expand descriptionA cross-platform graphics and compute library based on WebGPU. To start using the API, create an Instance. §Feature flags§Backends dx12 (enabled by default) — Enables the DX12 backend on Windows. metal (enabled by default) — Enables the Metal backend on macOS & iOS. vulkan (enabled by default) — Enables the Vulkan backend on Windows, Linux, and Android. gles (enabled by default) — Enables the OpenGL/GLES backend on Windows, Linux, Android, and Emscripten. webgpu (enabled by default) — Enables the WebGPU backend on WebAssembly. §Conditional Backends angle — Enables the GLES backend on macOS only for use with ANGLE. vulkan-portability — Enables the Vulkan backend on macOS & iOS only for use with MoltenVK. webgl — Enables the GLES backend on WebAssembly only. noop — Enables the noop backend for testing. This backend allows creating resources such as buffers and textures, but performs no computation. Because it lacks basic functionality, it is only actually used if explicitly enabled through NoopBackendOptions. Note: In the documentation, if you see that an item depends on a backend, it means that the item is only available when that backend is enabled and the backend is supported on the current platform. §Shading language support These features enable support for that input language on all platforms. We will translate the input language to whatever the backend requires. spirv — Enable accepting SPIR-V shaders as input. glsl — Enable accepting GLSL shaders as input. wgsl (enabled by default) — Enable accepting WGSL shaders as input. naga-ir — Enable accepting naga IR shaders as input. §Assertions and Serialization strict_asserts — Apply run-time checks, even in release builds. These are in addition to the validation carried out at public APIs in all builds. serde — Enables serialization via serde on common wgpu types. §External libraries The following features facilitate integration with third-party supporting libraries. static-dxc — Enables statically linking DXC. Normally, to use the modern DXC shader compiler with WGPU, the final application must be shipped alongside dxcompiler.dll and dxil.dll (which can be downloaded from Microsoft’s GitHub). This feature statically links a version of DXC so that no external binaries are required to compile DX12 shaders. §Other counters — Internally count resources and events for debugging purposes. If the counters feature is disabled, the counting infrastructure is removed from the build and the exposed counters always return 0. fragile-send-sync-non-atomic-wasm — Implement Send and Sync on Wasm, but only if atomics are not enabled. WebGL/WebGPU objects can not be shared between threads. However, it can be useful to artificially mark them as Send and Sync anyways to make it easier to write cross-platform code. This is technically very unsafe in a multithreaded environment, but on a wasm binary compiled without atomics is a definitionally single-threaded environment. §Feature Aliases These features aren’t actually features on the crate itself, but a convenient shorthand for complicated cases. wgpu_core — Enabled when there is any non-webgpu backend enabled on the platform. naga –– Enabled when any non-wgsl shader input is enabled. Re-exports§pub extern crate wgpu_hal as hal;pub extern crate wgpu_core as wgc;pub extern crate wgpu_types as wgt;pub use ::wgc::naga;wgpu_core or nagapub use raw_window_handle as rwh;Modules§api 🔒 Types and functions which define our public api and their helper functionality.backend 🔒 cmp 🔒 We need to impl PartialEq, Eq, PartialOrd, Ord, and Hash for all handle types in wgpu.dispatch 🔒 Infrastructure for dispatching calls to the appropriate “backend”. The “backends” are:macros 🔒 Convenience macrosutilUtility structures and functions that are built on top of the main wgpu API.Macros§include_spirv_rawMacro to load raw SPIR-V data statically, for use with Features::SPIRV_SHADER_PASSTHROUGH.include_wgslLoad WGSL source code from a file at compile time.vertex_attr_arrayMacro to produce an array of VertexAttribute.Structs§AdapterHandle to a physical graphics and/or compute device.AdapterInfoInformation about an adapter.BackendOptionsOptions that are passed to a given backend.BackendsRepresents the backends that wgpu will use.BindGroupHandle to a binding group.BindGroupDescriptorDescribes a group of bindings and the resources to be bound.BindGroupEntryAn element of a BindGroupDescriptor, consisting of a bindable resource and the slot to bind it to.BindGroupLayoutHandle to a binding group layout.BindGroupLayoutDescriptorDescribes a BindGroupLayout.BindGroupLayoutEntryDescribes a single binding inside a bind group.BlasBottom Level Acceleration Structure (BLAS).BlasBuildEntryBuilds the given sets of geometry into the given Blas.BlasTriangleGeometryDefinition for a triangle geometry for a Bottom Level Acceleration Structure (BLAS).BlendComponentDescribes a blend component of a BlendState.BlendStateDescribe the blend state of a render pipeline, within ColorTargetState.BufferHandle to a GPU-accessible buffer.BufferAsyncErrorError occurred when trying to async map a buffer.BufferBindingDescribes the segment of a buffer to bind.BufferSliceA slice of a Buffer, to be mapped, used for vertex or index data, or the like.BufferTransitionA buffer transition for use with CommandEncoder::transition_resources.BufferUsagesDifferent ways that you can use a buffer.BufferUsesSimilar to BufferUsages, but used only for CommandEncoder::transition_resources.BufferViewA read-only view of a mapped buffer’s bytes.BufferViewMutA write-only view of a mapped buffer’s bytes.ColorRGBA double precision color.ColorTargetStateDescribes the color state of a render pipeline.ColorWritesColor write mask. Disabled color channels will not be written to.CommandBufferHandle to a command buffer on the GPU.CommandBufferDescriptorDescribes a CommandBuffer.CommandEncoderEncodes a series of GPU operations.CompilationInfoCompilation information for a shader module.CompilationMessageA single message from the shader compilation process.ComputePassIn-progress recording of a compute pass.ComputePassDescriptorDescribes the attachments of a compute pass.ComputePassTimestampWritesDescribes the timestamp writes of a compute pass.ComputePipelineHandle to a compute pipeline.ComputePipelineDescriptorDescribes a compute pipeline.ContextBlasBuildEntryContext version see BlasBuildEntry.ContextBlasTriangleGeometryContext version of BlasTriangleGeometry.CopyExternalImageDestInfoView of a texture which can be used to copy to a texture, including color space and alpha premultiplication information.CoreCounterswgpu-core’s internal counters.CreateSurfaceErrorInstance::create_surface() or a related function failed.DepthBiasStateDescribes the biasing setting for the depth target.DepthStencilStateDescribes the depth/stencil state in a render pipeline.DeviceOpen connection to a graphics and/or compute device.DownlevelCapabilitiesLists various ways the underlying platform does not conform to the WebGPU standard.DownlevelFlagsBinary flags listing features that may or may not be present on downlevel adapters.DownlevelLimitsRepresents the sets of additional limits on an adapter, which take place when running on downlevel backends.Dx12BackendOptionsConfiguration for the DX12 backend.Extent3dExtent of a texture related operation.FeaturesFeatures that are not guaranteed to be supported.FeaturesWGPUFeatures that are not guaranteed to be supported.FeaturesWebGPUFeatures that are not guaranteed to be supported.FragmentStateDescribes the fragment processing in a render pipeline.GlBackendOptionsConfiguration for the OpenGL/OpenGLES backend.HalCounterswgpu-hal’s internal counters.ImageSubresourceRangeSubresource range within an imageInstanceContext for all other wgpu objects. Instance of wgpu.InstanceDescriptorOptions for creating an instance.InstanceFlagsInstance debugging flags.InternalCountersAll internal counters, exposed for debugging purposes.LimitsRepresents the sets of limits an adapter/device supports.MultisampleStateDescribes the multi-sampling state of a render pipeline.NoopBackendOptionsConfiguration for the noop backend.OperationsPair of load and store operations for an attachment aspect.Origin2dOrigin of a copy from a 2D image.Origin3dOrigin of a copy to/from a texture.PipelineCacheHandle to a pipeline cache, which is used to accelerate creating RenderPipelines and ComputePipelines in subsequent executionsPipelineCacheDescriptorDescribes a pipeline cache, which allows reusing compilation work between program runs.PipelineCompilationOptionsAdvanced options for use when a pipeline is compiledPipelineLayoutHandle to a pipeline layout.PipelineLayoutDescriptorDescribes a PipelineLayout.PipelineStatisticsTypesFlags for which pipeline data should be recorded.PresentationTimestampNanosecond timestamp used by the presentation engine.PrimitiveStateDescribes the state of primitive assembly and rasterization in a render pipeline.PushConstantRangeA range of push constant memory to pass to a shader stage.QuerySetHandle to a query set.QueueHandle to a command queue on a device.QueueWriteBufferViewA write-only view into a staging buffer.RenderBundlePre-prepared reusable bundle of GPU operations.RenderBundleDepthStencilDescribes the depth/stencil attachment for render bundles.RenderBundleEncoderEncodes a series of GPU operations into a reusable “render bundle”.RenderBundleEncoderDescriptorDescribes a RenderBundleEncoder.RenderPassIn-progress recording of a render pass: a list of render commands in a CommandEncoder.RenderPassColorAttachmentDescribes a color attachment to a RenderPass.RenderPassDepthStencilAttachmentDescribes a depth/stencil attachment to a RenderPass.RenderPassDescriptorDescribes the attachments of a render pass.RenderPassTimestampWritesDescribes the timestamp writes of a render pass.RenderPipelineHandle to a rendering (graphics) pipeline.RenderPipelineDescriptorDescribes a render (graphics) pipeline.RequestAdapterOptionsBaseOptions for requesting adapter.RequestDeviceErrorRequesting a device from an Adapter failed.SamplerHandle to a sampler.ShaderModuleHandle to a compiled shader module.ShaderModuleDescriptorDescriptor for use with Device::create_shader_module.ShaderModuleDescriptorSpirVDescriptor for a shader module given by SPIR-V binary, for use with Device::create_shader_module_spirv.ShaderRuntimeChecksDescribes how shader bound checks should be performed.ShaderStagesDescribes the shader stages that a binding will be visible from.SourceLocationA human-readable representation for a span, tailored for text source.StencilFaceStateDescribes stencil state in a render pipeline.StencilStateState of the stencil operation (fixed-pipeline stage).SubmissionIndexIdentifier for a particular call to Queue::submit. Can be used as part of an argument to Device::poll to block for a particular submission to finish.SurfaceHandle to a presentable surface.SurfaceCapabilitiesDefines the capabilities of a given surface and adapter.SurfaceTextureSurface texture that can be rendered to. Result of a successful call to Surface::get_current_texture.TexelCopyBufferInfoBaseView of a buffer which can be used to copy to/from a texture.TexelCopyBufferLayoutLayout of a texture in a buffer’s memory.TexelCopyTextureInfoBaseView of a texture which can be used to copy to/from a buffer/texture.TextureHandle to a texture on the GPU.TextureFormatFeatureFlagsFeature flags for a texture format.TextureFormatFeaturesFeatures supported by a given texture formatTextureTransitionA texture transition for use with CommandEncoder::transition_resources.TextureUsagesDifferent ways that you can use a texture.TextureUsesSimilar to TextureUsages, but used only for CommandEncoder::transition_resources.TextureViewHandle to a texture view.TlasTop Level Acceleration Structure (TLAS).TlasBuildEntryEntry for a top level acceleration structure build. Used with raw instance buffers for an unvalidated builds. See TlasPackage for the safe version.TlasInstanceSafe instance for a Tlas.TlasPackageThe safe version of TlasEntry, containing TlasInstances instead of a raw buffer.VertexAttributeVertex inputs (attributes) to shaders.VertexBufferLayoutDescribes how the vertex buffer is interpreted.VertexStateDescribes the vertex processing in a render pipeline.WgslLanguageFeaturesWGSL language extensions.Enums§AddressModeHow edges should be handled in texture addressing.AstcBlockASTC block dimensionsAstcChannelASTC RGBA channelBackendBackends supported by wgpu.BindingResourceResource that can be bound to a pipeline.BindingTypeSpecific type of a binding.BlasGeometriesContains the sets of geometry that go into a Blas.BlendFactorAlpha blend factor.BlendOperationAlpha blend operation.BufferBindingTypeSpecific type of a buffer binding.CompareFunctionComparison function used for depth and stencil operations.CompilationMessageTypeThe type of a compilation message.CompositeAlphaModeSpecifies how the alpha channel of the textures should be handled during compositing.ContextBlasGeometriesContext version of BlasGeometries.DeviceLostReasonReason for “lose the device”.DeviceTypeSupported physical device types.Dx12CompilerSelects which DX12 shader compiler to use.DxcShaderModelDXC shader model.ErrorError typeErrorFilterFilter for error scopes.FaceFace of a vertex.FilterModeTexel mixing mode when sampling between texels.FrontFaceVertex winding order which classifies the “front” face of a triangle.GlFenceBehaviorDictate the behavior of fences in OpenGL.Gles3MinorVersionSelects which OpenGL ES 3 minor version to request.IndexFormatFormat of indices used with pipeline.LoadOpOperation to perform to the output attachment at the start of a render pass.MaintainBasePassed to Device::poll to control how and if it should block.MapModeType of buffer mapping.MemoryHintsHints to the device about the memory allocation strategy.PollErrorError states after a device pollPollStatusStatus of device poll operation.PolygonModeType of drawing mode for polygonsPowerPreferencePower Preference when choosing a physical adapter.PredefinedColorSpaceColor spaces supported on the web.PresentModeTiming and queueing with which frames are actually displayed to the user.PrimitiveTopologyPrimitive type the input mesh is composed of.QueryTypeType of query contained in a QuerySet.SamplerBindingTypeSpecific type of a sampler binding.SamplerBorderColorColor variation to use when sampler addressing mode is AddressMode::ClampToBorderShaderModelCollections of shader features a device supports if they support less than WebGPU normally allows.ShaderSourceSource of a shader module.StencilOperationOperation to perform on the stencil value.StorageTextureAccessSpecific type of a sample in a texture binding.StoreOpOperation to perform to the output attachment at the end of a render pass.SurfaceErrorResult of an unsuccessful call to Surface::get_current_texture.SurfaceStatusStatus of the received surface image.Surfa"
