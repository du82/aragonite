title = "The Whimsical Web"
description = "A curated list of sites with an extra bit of fun."
full_description = "Websites that spark joy.A curated list of sites with an extra bit of fun.Kickscondor is one of these things you just have to see for yourself. It’s a weird, wonderful, whimsical place to get lost in. kickscondor.com kickscondorThe 80s are alive and well at Chris’ website, and it’s glorious. Note the darkmode switch in this case goes from dusk to dawn. Pun very much intended. chriskirknielsen.com ckirknielsenPlease don’t try to close the window on the pinwheel website. It’s just a screenshot, it won’t work. You might break something. pinwheel.pwHelp the poor fisherman boost his business by summoning the power of the octopus. Something something, release the kraken! octopulse.io octopulseappDrag your mouse across Matthew’s website to leave a trail of colorful shapes. matthewhoelter.comIt’s a physics-engine-keyboard-thing! Try typing “rain”, “feross”, “semi” or “hexbin” for secret behavior! magickeyboard.io ferossThe department of Latin American and Iberian cultures got creative with their website. Paint unique “word pictures” with your mouse! laic.columbia.eduAlex’ site has lovely hand-drawn illustrations, an “Arts & Crafts” and a “Recipes” section. alexgreene.me alexg473Click the hamburger icon in Wells’ footer and you get - well hamburgers, duh. wells.ee wrNight mode at Nikita’s site is a bit darker than you might be used to. Thankfully you still get a flashlight. tonsky.me nikitonskyolder postsLoading...That's all of them - for now.Know a site that should be on this list?Submit it!"
