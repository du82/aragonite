full_description = "Websites that spark joy.A curated list of sites with an extra bit of fun.Lots of cool things to discover on Sara’s new site. Play around with the hero ornament, switch to high-contrast mode, check out her ASCII art or go old-school and sign the guestbook! sarajoy.dev sarajwClick the dog on the homepage to tinyfy it! Works in reverse too. Good boy. tinydogs.atSo much interesting stuff happening here! Launch the rocket. Eat the sandwich. Have some coffee. nuel.pwMichael has a great selection of medieval cats going on this site, all ready to be meme-ified. Medieval Cat Meme Generator michaelkleinThe navigation on Zacky Ma’s site is inspired by monorails. All aboard! marchbox.com marchboxIf you’re unsure how to pronounce “David Darnes”, his new website has you covered. Press the megaphone button for a wide range of great options. darn.es DavidDarnesJacob’s site offers a handy “craftsman’s tip” feature, as well as a peek behind the curtain that shows visitors the awesomeness of semantic HTML. jacobleech.com jacobleonleechAlina’s site is a literal mixtape (remember these?) floating in a starry void. sava.io AlinaCSavaScroll down the page to drive through a quiet street at night. pleaseleaveon.com pleaseleaveonHave a play, discover your science personality & find out about Edinburgh Science Festival’s learning, climate and community projects in this lovely interactive quiz. DNAtion.science EdSciFestolder postsLoading...That's all of them - for now.Know a site that should be on this list?Submit it!"
