["https://whimsical.club/6"]
title = "The Whimsical Web"
description = "A curated list of sites with an extra bit of fun."
full_description = "Websites that spark joy.A curated list of sites with an extra bit of fun.Cassie’s site has lots of fun little details. She even shows up herself to watch you write her an email. cassie.codes cassiecodesStefan has a “TL;DR” switch for all his blogposts, showing you just the really essential parts if you’re in a hurry. There’s also a “celebrate” button - I’ll let you figure that one out yourself. fettblog.eu ddprrtJosh’s site is a regular goldmine of whimsy. Hit counters, heart buttons, sound effects, floating avatars - you name it. joshwcomeau.com JoshWComeauPress a button on Monica’s site and it starts raining emoji. meowni.ca notwaldorfSwyx’ site is full of web development knowledge, but his scrollbar is full of love. swyx.io swyxJack teaches a course called “Radical Design”, so it’s no wonder his site is a bit different. Try scrolling around the “Design Work” section for a good laugh. jackmcdade.com jackmcdadeIf you view Wes’ site on a very wide display, he congratulates you on your big monitor. wesbos.com wesbosThe floating possum is the official mascot of the static site generator Eleventy,so naturally its documentation includes a nice flyover appearance. 11ty.dev eleven_tyThe hamburger on Zach’s site might not be useful for navigation - but it sure is tasty. zachleat.com zachleatMax’s site (that’s me) has a built-in theme switcher, including something called “Lobster Mode”. I’m sorry. mxb.dev mxbckLoading...That's all of them - for now.Know a site that should be on this list?Submit it!"
