title = "The Whimsical Web"
description = "A curated list of sites with an extra bit of fun."
full_description = "Websites that spark joy.A curated list of sites with an extra bit of fun.Sam’s website is a magazine cover with an animated portrait of himself. Check out the past editions too! smth.uk smthdotukIan’s website seems simple at first, but scroll past the project section and enter an interdimensional SVG wormhole. Or at least that’s what I think it is. ianmaclarty.com ianmaclartyThe real show goes on behind the scenes on iamschulz: Pop open the console and you can experience this website as a text adventure! iamschulz.com iamschulzThe website for this art supplies company features a canvas you can draw on and then submit your painting! I drew a fruit salad. It wasn’t my best work. happy-medium.coDerek’s personal site has a friendly floating whale. 'Nuff said. derekshirk.com derekshirkAlvin’s website has a fun canvas animation that reacts to scroll. Also check out the “about” page - good stuff. alvin.codes alvinometricThere’s lots to love on Nils’ site - my personal favorite is the slider to adjust the CSS detail level, with the animated call-to-action waffle coming in a close second. ichimnetz.com supremebeing09The boop sound effects alone would put Jason’s new site on this list, but then there’s like 18 other fun things. A gold standard in whimsy. jason.af jlengstorfSimone’s site is a throwback to the Win95 days, and his attention to detail there is amazing. Click the trash if you have a bit too much time on your hands. simone.computer syxanashPatrick’s website is a spectacular mix of squishy animation, beautiful design and fun little details. Scroll through his projects and discover them all! patrickheng.com Pat_Hgolder postsLoading...That's all of them - for now.Know a site that should be on this list?Submit it!"
