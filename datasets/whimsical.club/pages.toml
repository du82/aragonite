["https://whimsical.club/about"]
title = "The Whimsical Web"
description = "The web needs to take itself less seriously."
full_description = '''Wait But Why?The web needs to take itself less seriously.It's barely out of its twenties and suddenly the web is all like "I can't make fansites for hippos anymore, I have businesses to run".It used to be cooler. It used to be weirder.As Sarah Drasner puts it in "In Defense of a Fussy Website":While we’re all laser-focused on shipping the newest feature with the hottest software and the best Lighthouse scores, I’ve been missing a bit of the joy on the web. Apps are currently conveying little care for UX, guidance, richness, and — well, for humans trying to communicate through a computer, we’re certainly bending a lot to… the computer.So this site is meant to showcase how a more personal web could look like, and hopefully give you some inspiration to make your own corner of the web a bit weirder.[a thing by @mxbck]'''
