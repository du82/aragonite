["https://whimsical.club/5"]
title = "The Whimsical Web"
description = "A curated list of sites with an extra bit of fun."
full_description = "Websites that spark joy.A curated list of sites with an extra bit of fun.Lynn consistently knocks it out of the park with her website. The current iteration gives you a glimpse inside her head. Literally. lynnandtonic.com lynnandtonicJohn’s eyes are watching you as you move your mouse around his site. If you try to “Save As…” him, he even gives you a nice selection of personal avatars to choose from. How thoughtful. johnlindquist.com johnlindquistComplete the Fallout-style hacking minigame on Jet’s site to gain access to a simulated terminal. It’s not radioactive btw, I checked. jetholt.com jetroidmakesAndré’s site shows a timeline of upcoming rock festivals and even gives you the weather forcast for them! They might be paused for now, but there will be rock again, and it will get muddy. jaenis.ch AndreJaenischAndy’s personal site looks like a Kindle, so you can feel like you’re reading a book while still being glued to your favorite screen. hankchizljaw.com hankchizljawEric decided that hamburger menus are over, and people should just click on his head for the navigation instead. Cool shades as well. erickarjaluoto.com karjWhen you move your mouse over the bubbles on Brad’s site, they change color. It’s like being in a big colorful bubble bath. bradfrost.com brad_frost“Barbarian meets Coding” is Jaime’s epic tale of adventure, glory and Javascript. Learning to code has never felt more heroic. barbarianmeetscoding.com VintharasIf you scroll around on Wimer’s site, content reveals itself in a sort of 8-bit pixel animation. It’s hard to describe - just watch it yourself. monokai.nl monokaiJon shows you what good copywriting looks like by showing you what bad copywriting looks like first. fullstopnewparagraph.co.uk fullstopnewparaolder postsLoading...That's all of them - for now.Know a site that should be on this list?Submit it!"
