["https://whimsical.club/1"]
title = "The Whimsical Web"
description = "A curated list of sites with an extra bit of fun."
full_description = "Websites that spark joy.A curated list of sites with an extra bit of fun.Nothing can prepare you for the awesomeness of the website of former Nintendo president Hiroshi Yamauchi. It features dinosaurs, unicorns, mermaids, volcanoes and general pixel art galore. It sparks all the joy. Yamauchi No.10 Family OfficeCafe Robot describes itself as “the first non-awkward Computer Club”, and its website is anything but boring. cafe-robot.co madame_robotMy personal highlight on Will’s site is the conversation between these two fishes. Love, Intrigue, SVG Puns - it’s got it all. codersblock.com lonekoreanTyler’s personal website is inspired by cartoon art, and there’s lots of little details and animations to love. tylersticka.com tylerstickaLaura’s nautical-themed website features mermaids, sunken pirate treasures and all kinds of great sea creatures. lauracharvey.dev lauracharveyJhey is one of these wizards who does things with HTML, CSS and JS that you didn’t think were possible. Check out his featured Codepens for lots of whimsy. Also: Rainbow Bears! jhey.dev jh3yyThe landscape on Alistair’s site changes color depending on the time of day. There’s also a “Naked” (no CSS) option for that extra barebones HTML look. alistairshepherd.uk accudioRafael’s site is one of the funniest, most creative personal websites I’ve ever seen.Stay around for a bit and watch him try to get you to scroll down! rafa.design rafahariVole is a fun pinboard of interesting internet content™If you visit with an ad blocker you’re congratulated, then low-five a sloth to get in. vole.wtf VOLEwtfJames’ website features a line-drawing avatar that changes shape when you hover over the different sections. johalloran.dev jamespohalloranolder postsLoading...That's all of them - for now.Know a site that should be on this list?Submit it!"
