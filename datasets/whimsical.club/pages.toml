full_description = "Websites that spark joy.A curated list of sites with an extra bit of fun.Connect the dots on Timo’s site and he’ll draw a unique illustration around it. timobecker.com volligohnePress the “Chaos” button in the corner of Luke’s site and see what happens. I mean you can probably take a guess. luketowers.ca TheLukeTowersIf you’re feeling nostalgic, Patrick has got you covered with his Win98-themed website. There’s even a DOS prompt! ka.ge patrick_kageGregory sits at his desk to welcome you personally on his website. Click around the office, or fly out the window and see where he’s lived. gkoberger.com gkobergerZach’s site has a unique nautical design. Turn on the sound and scroll around for the full underwater-synth experience! anemon.esSteven first got into design making visualizations for WinAmp, and it shows. His site is full of music, animation and WebGL goodness. acko.net unconedThe header on Tom’s website has guitar strings you can actually play! I tried doing Seven Nation Army, but failed. Still cool. webrocker.de webrockerIf you find one of the Steves hidden online and in real life, it’ll be marked as yours forever. Find all of them and you unlock the power of a thousand suns. ste.vg steeevgRobb’s site is full of animated illustrations and fun little details. But please don’t move your cursor around too fast, it makes him dizzy. robbowen.digital robb0wenEric’s site has tons of personality and care. It features Hamonshū, japanese-style illustrations of waves. You also got to love the “Excuse of the Day”. meyerweb.com meyerwebolder postsLoading...That's all of them - for now.Know a site that should be on this list?Submit it!"
