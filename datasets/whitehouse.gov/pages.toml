o be Administrator of the Federal Railroad Administration, vice Amitabha Bose, resigned. Paul Atkins, of Virginia, to be Member of the Securities and Exchange Commission for the remainder of the term expiring June 5, 2026, vice Gary Gensler, resigned. Darío Gil, of New York, to be Under Secretary for Science, Department of Energy, vice Geraldine Richmond, resigned. Preston Griffith, of Virginia, to be Under Secretary of Energy, vice David Crane, resigned. Jacob Helberg, of Florida, to be an Under Secretary of State (Economic Growth, Energy, and the Environment), vice Jose W. Fernandez, resigned. Dudley Hoskins, of the District of Columbia, to be Under Secretary of Agriculture for Marketing and Regulatory Programs, vice Jennifer Lester Moffitt, resigned. Jared Isaacman, of Pennsylvania, to be Administrator of the National Aeronautics and Space Administration, vice Bill Nelson, resigned. Scott Kupor, of California, to be Director of the Office of Personnel Management for a term of four years, vice Kiran Arjandas Ahuja, resigned. Christopher Landau, of Maryland, to be Deputy Secretary of State, vice Kurt Campbell, resigned. Luke Lindberg, of South Dakota, to be Under Secretary of Agriculture for Trade and Foreign Agricultural Affairs, vice Alexis Taylor, resigned. William Long, of Missouri, to be Commissioner of Internal Revenue for the remainder of the term expiring November 12, 2027, vice Daniel I. Werfel. Martin Makary, of Virginia, to be Commissioner of Food and Drugs, Department of Health and Human Services, vice Robert McKinnon Califf, resigned. Mark Meador, of Virginia, to be a Federal Trade Commissioner for the term of seven years from September 26, 2024, vice Lina M. Khan, term expired. Troy Meink to be Secretary of the Air Force, vice Frank Kendall III, resigned. Emil Michael, of Florida, to be Under Secretary of Defense for Research and Engineering, vice Heidi Shyu, resigned. Janette Nesheiwat, of New York, to be Medical Director in the Regular Corps of the Public Health Service, subject to qualifications therefor as provided by law and regulations, and to be Surgeon General of the Public Health Service for a term of four years, vice Vivek Hallegere Murthy, resigned. James O’Neill, of California, to be Deputy Secretary of Health and Human Services, vice Andrea Joan Palm, resigned. Mehmet Oz, of Pennsylvania, to be Administrator of the Centers for Medicare and Medicaid Services, vice Chiquita Brooks-LaSure, resigned. Kashyap Patel, of Nevada, to be Director of the Federal Bureau of Investigation for a term of ten years, vice Christopher A. Wray, resigned. John Phelan, of Florida, to be Secretary of the Navy, vice Carlos Del Toro, resigned. Aaron Reitz, of Texas, to be an Assistant Attorney General, vice Hampton Y. Dellinger. Michael Rigas, of Virginia, to be Deputy Secretary of State for Management and Resources, vice Richard R. Verma, resigned. Dean Sauer, of Missouri, to be Solicitor General of the United States, vice Elizabeth Prelogar, resigned. Rodney Scott, of Oklahoma, to be Commissioner of U.S. Customs and Border Protection, Department of Homeland Security, vice Chris Magnus. Abigail Slater, of the District of Columbia, to be an Assistant Attorney General, vice Jonathan Kanter, resigned. Keith Sonderling, of Florida, to be Deputy Secretary of Labor, vice Julie A. Su, resigned. Stephen Vaden, of Tennessee, to be Deputy Secretary of Agriculture, vice Xochitl Torres Small, resigned. David Weldon, of Florida, to be Director of the Centers for Disease Control and Prevention. (New Position) Brandon Williams, of New York, to be Under Secretary for Nuclear Security, vice Jill Hruby, resigned. Keith Sonderling, of Florida, to be Deputy Secretary of Labor, vice Julie A. Su, resigned."
