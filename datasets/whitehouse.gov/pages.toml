["https://www.whitehouse.gov/privacy"]
title = "Privacy – The White House"
description = "The White House is committed to protecting individual privacy and securing the personal information made available to us when you visit WhiteHouse.gov, or"
full_description = "Privacy Policy The White House is committed to protecting individual privacy and securing the personal information made available to us when you visit WhiteHouse.gov, or visit White House pages hosted by other sites (such as our official profiles on social networking sites). This Privacy Policy describes what information is made available to the White House and how that information is used and retained, and provides information on: Information we receive (when you provide it, visit WhiteHouse.gov, receive email updates, or interact with official White House presences on third-party sites) How this information is used Sharing of this information Data retention Third-party tools and sites Children and privacy Security If you have questions about this policy or suggestions for its improvement, please let us know at WhiteHouse.gov/Contact/. Information Received and Retained by White House Online Platforms Information You Give Us You do not have to provide the White House with any personal information or create a user account to access information on WhiteHouse.gov. However, for some services, we may need some personal information from you such as your name, address, telephone number, email address, and other contact or identifying information about yourself or others that you choose to provide or authorize us to collect. For example: The “Contact the White House” form asks for basic contact information so we can respond to your request; When we ask users to share their story or how a policy decision will impact them, we generally ask for their name, zip code, and email address; We may ask for personal information from people applying to, registering for, or participating in a White House event or competition. We will ask for personal information of people applying to jobs or internships in through WhiteHouse.gov. Visits to WhiteHouse.gov When you visit WhiteHouse.gov, the following basic information is automatically received and stored by the web servers hosting WhiteHouse.gov: The originating Internet Protocol (IP) address; The internet domain name; Information about your computer or mobile set-up (e.g., type and version of web browser, operating system, screen resolution, and connection speed); The pages on WhiteHouse.gov that you visit; The internet address, or URL, of the website that connected you to our site, if you accessed WhiteHouse.gov via a link on another page (i.e., “referral traffic”); and The amount of data transmitted from WhiteHouse.gov to your computer. The White House also uses web measurement and customization technologies (such as “cookies”). You can choose not to accept cookies from any website, including WhiteHouse.gov, by changing your browser settings. Email Subscriptions In order to manage White House email subscription lists, we retain the names and email addresses of our email subscribers, as well as other information they may have shared with us (e.g., addresses and phone numbers), logs of emails we send, and automatically generated email data used to improve our email communications. This automatically generated email data (generated through simple tools such as “pixel tags” and link redirects) includes: The recipient’s email client; Whether the email was opened; If a link in the message was clicked; Whether an email was delivered; If the email was forwarded; and If the email was printed. If, at any time, you wish to stop receiving our messages, simply click on the “Unsubscribe” link at the bottom of each email message. Third-Party Websites The White House maintains official pages or accounts on third-party websites in order to better engage with the American public (a current list is here). Your activity on those sites is governed by the third-party website’s security and privacy policies. Users of third-party sites often share information with the general public, user community, and/or the third-party operating the site. Consequently, you should review the privacy policies of third-party sites before using them and ensure that you understand how your information may be shared and used. You should also adjust privacy settings on your account on any third-party site to match your preferences. To comply with the Presidential Records Act, the White House may archive information that users submit or publish when engaging with the White House through official White House pages or accounts on third-party websites (e.g., by sending a message, posting a comment, “following,” “friending,” or taking similar actions). This information may contain personal information, such as an individual’s username and other public account information, when such information is available based on the user’s privacy settings and the terms of the site. For aggregate statistical analysis and to improve the quality of our services, we may integrate web measurement tools with our social media pages. These tools enable basic analysis of social media traffic (such as the number of people visiting a certain page) and do not collect personally identifiable information. How Information is Used If you choose to provide us with information, we may use that information to contact you, respond to your message, or provide you the information or services you requested. In order to serve you better, we may analyze multiple sources of data you have provided (for example, to look up whether you previously contacted the White House about the same topic so that we do not send you a duplicative response). We may also use messages or comments collected through WhiteHouse.gov or official social media pages for our own purposes, such as to inform policy decisions or in public advocacy. We may use data you provide and automatically generated data for statistical analysis to assess, for example, what information is of interest to users, technical design specifications, and system performance. This allows us to make general improvements to our site as well as to offer tailored content to email subscribers (e.g., a follow-up message to subscribers interested in a specific topic based on information they have provided or automatically generated data). We may also use your information in order to detect, prevent, and respond to security issues and other harmful or unlawful activities on the Site. For resume information submitted, your information may be used for employment consideration. Sharing of this Information Information you choose to share with the White House (directly and via third party sites) may be treated as public information. We may, for example, publish compilations of messages or comments collected through WhiteHouse.gov or official social media pages and provide them to national leaders, members of the press, or other individuals outside of the Federal Government. However, we exercise discretion to limit such disclosures to protect your privacy (for example, we generally do not publish last names of commenters). The White House uses a third-party analytics provider (currently Google Analytics) to analyze data from cookies. The third-party analytics provider does not receive personally identifiable information through these cookies. We have also limited the provider’s ability to see your full IP address (a process known as “IP masking”). Please review Google Analytics’ privacy policy for additional information. Within the White House, we restrict access to personally identifiable information to employees, contractors, and vendors subject to non-disclosure requirements who require access to this information in order to perform their official duties and exercise controls to limit what data they can view based on the specific needs of their position. In some cases, we may share information you have provided or automatically generated information with other government agencies in response to lawful law enforcement requests or to protect WhiteHouse.gov from security threats. Additionally, if you seek assistance on a matter within the jurisdiction of a federal agency, we may share your information with that agency for the limited purpose of addressing your request for assistance. We do not use or share your information for commercial purposes and, except as described above, we do not exchange or otherwise disclose this information. Data Retention Under the Presidential Records Act (PRA), we are generally required to retain information until the end of the current Administration, at which time it will be transferred to the National Archives and Records Administration (NARA). NARA may eventually release this material to the public, but will withhold any information that would constitute a clearly unwarranted invasion of personal privacy if released. Access to this information may be requested under the Freedom of Information Act (FOIA) five years after the end of the current Administration. NARA or the White House may choose to dispose of information lacking in historical value through procedures under the PRA. Third-Party Tools and Sites Links to External Sites WhiteHouse.gov and other White House platforms and pages may link to websites created and maintained by other public and/or private organizations and individuals. When you follow a link to an external site, you are leaving WhiteHouse.gov and are subject to the external site’s privacy and security policies. We do not control or guarantee the accuracy, relevance, timeliness, or completeness of information contained on an external site. We also do not endorse the site’s sponsor, any views they express, or any products or services they offer. White House Pages on Third-Party Websites Your activity on third-party website sites is governed by the third-party website’s security and privacy policies. White House Content Embedded in Third-Party Sites In some instances, a third-party website may feature embedded White House content served by WhiteHouse.gov. The embedded WhiteHouse.gov content automatically generates White House server logs (see Visits to WhiteHouse.gov) and may set a White House cookie. Children and Privacy on WhiteHouse.gov We believe in the importance of protecting the privacy of children online. The Children’s Online Privacy Protection Act (COPPA) governs information gathered online from or about children under the age of 13. Verifiable consent from a child’s parent or guardian is required before collecting, using, or disclosing personal information from a child under age 13. Our site is not intended to solicit information of any kind from children under age 13. If you believe that we have received information from or about children under age 13, please contact us. Security We take reasonable precautions to protect our site and information automatically collected by WhiteHouse.gov or voluntarily submitted to WhiteHouse.gov or an official White House page on a third-party site. For example, we restrict access to personally identifiable information to employees, contractors, and vendors subject to non-disclosure requirements who require access to this information in order to perform their official duties and exercise controls to limit what data they can view based on the specific needs of their position. Access to official White House accounts on third-party sites is limited to the individuals who administer those accounts, and all official White House accounts are clearly labeled. We also utilize commonly used practices and technical controls to protect the information in our possession or control, along with WhiteHouse.gov itself. These practices and controls include, but are not limited to: encrypting the transfer of personal information over the internet via Secure Sockets Layer (SSL), using high-strength firewalls and intrusion detection systems (IDS) to safeguard personal information, and maintaining strict technical controls and procedures to ensure the integrity of all data on WhiteHouse.gov. We periodically review our processes and systems to verify compliance with industry best practices and to ensure the highest level of security for our website. Updates to This Privacy Policy We will revise or update this policy from time to time. If we make significant changes to how we handle personal information, we will post changes to the policy on our site and change the date at the bottom. We will provide additional notice in advance (e.g., a disclaimer on our website or an email to subscribers) if material changes are being made. Updated: January 20, 2025 Glossary Internet Protocol (IP): A computer’s IP address establishes its location on the internet and allows other computers, such as those hosting WhiteHouse.gov, to send it content and other information. Domain name: For example, “xcompany.com” if you use a private Internet access account, or “yourschool.edu” if you are connecting from a university’s domain. Cookies: A small piece of data sent from a website and stored in a user’s web browser while the user is browsing that website. Device token: A unique string used to identify devices. Email client: The email client is the program used to access and manage a user’s email (e.g., Gmail, Outlook, Yahoo!). WhiteHouse.gov Cookies WhiteHouse.gov uses the following cookies (defined and organized per the Office of Management and Budget’s “Guidance for Online Use of Web Measurement and Customization Technologies” (OMB M-10-22): Single-session cookies are used for technical purposes, such as enabling better navigation through the site, facilitating the use of user accounts, and generating aggregated statistics about how the website is used. Single-session cookies may use a unique identifier, but do not publicly expose personal information. Under the framework of OMB M-10-22, this qualifies as a Tier 1 use. Multi-session or persistent cookies are used to recognize a computer that has previously visited WhiteHouse.gov, which can improve a user’s experience, for example, by continuing preference settings from previous visits. Under the framework of OMB M-10-22, this qualifies as a Tier 2 use. WhiteHouse.gov currently uses the following cookies: WhiteHouse.gov currently uses single session and multi-session cookies to ensure that WhiteHouse.gov displays correctly and measure website metrics, such as which pages are popular and how often people visit the website. These cookies do not capture personally identifiable information, such as your name or email, or track interactions outside of WhiteHouse.gov and other White House sites/pages. This list does not include cookies associated with third-party content or functionality included on WhiteHouse.gov (see Third-Party Cookies). The White House uses a third-party analytics provider (currently Google Analytics) to analyze the data collected through the cookies with a name beginning _utm. The third-party analytics provider does not receive personally identifiable information through these cookies and does not combine, match, or cross-reference WhiteHouse.gov information with any other information. We have also limited the provid"
