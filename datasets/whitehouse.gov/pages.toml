description = "Tonight, President Donald J. Trump delivered bold, forward-looking remarks before a joint session of Congress — highlighting the historic accomplishments"
full_description = "Briefings & Statements Democrats Showed Whose Side They’re On — And it’s Not the American People March 5, 2025 Tonight, President Donald J. Trump delivered bold, forward-looking remarks before a joint session of Congress — highlighting the historic accomplishments already achieved in his second term and setting the course for four years of prosperity and strength. Unfortunately, Congressional Democrats were too consumed by their own hatred of President Trump, refusing to show support for lowering taxes, fighting childhood cancer, capturing terrorists, protecting women and girls in sports, or law and order — to name only a few. As Dana Perino said, “The Democratic Party still has no common sense. They have no ideas and they have no heart. They couldn’t even stand for the most inspiring moments of the speech.” Tonight, Democrats refused to applaud: The capturing of an ISIS terrorist that masterminded the Abbey Gate attack A young boy fighting brain cancer A call to lower taxes for middle-class Americans Americans joining the military in record numbers Law and order Taking down illegal revenge porn Protecting women’s sports The United States of America Working together to Make America Great Again Ending the harmful electric vehicle mandate Cutting regulations to unleash American prosperity Ending censorship and bringing back free speech Ending discriminatory “diversity, equity, and inclusion” Recognizing only two sexes Defeating inflation Unleashing American energy Ending waste, fraud, and abuse in government Ending taxes on tips, overtime, and seniors’ Social Security Bringing manufacturing home to America Securing historic investments in American chip manufacturing Removing illegal alien killers, rapists, and drug dealers from our streets Securing our border Declaring the brutal Tren de Aragua gang as a Foreign Terrorist Organization Waging war on the deadly cartels trafficking deadly drugs into our country Punishing cop killers with the death pen