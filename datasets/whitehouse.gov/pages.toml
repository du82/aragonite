["https://www.whitehouse.gov/remarks/2025/02/remarks-by-president-trump-after-executive-order-signing"]
title = "Remarks by President Trump after Executive Order Signing – The White House"
description = "Mar-a-Lago Palm Beach, Florida (February 18, 2025) 4:13 P.M. EST      THE PRESIDENT:  I want to thank some of the great people"
full_description = "Remarks Remarks by President Trump after Executive Order Signing February 18, 2025 Mar-a-Lago Palm Beach, Florida (February 18, 2025) 4:13 P.M. EST THE PRESIDENT: I want to thank some of the great people from the Palm Beach County Sheriff’s Office. They’re here to take photographs, and it’s my honor to do so. Also, the fire department, the great firefighters. So, they’re here throughout the room, and I want to thank you very much for being here. I’ll be with you in a little while. We’ll do some great photos. We have plenty of time. Policemen, policewomen, and firemen, firewomen — they’re here, and we appreciate it very much. You’ve done a fantastic job. Oh, I think it’s very important to state that incredible things are happening in our country. I think we’ve made more progress in three weeks than they’ve made in four years, especially with respect to the reputation of our country, and people are respecting us again as a country and as a powerful country and maybe a smart country. But maybe not so smart, because when you look at some of the waste, fraud, and abuse that’s being inco- — uncovered by DOGE and the people at DOGE — these are young — often young but super brilliant people, incredible computer scientists and other things. And they’re finding levels of fraud and waste and abuse like, I think, nobody ever thought possible. But before we do that, I just want to ask Will to come over. We’ve — I’ve just finished signing some executive orders. And if we could start with that, Will, you might want to come up here and just explain what we did. Thank you. MR. SCHARF: Good afternoon, y’all. A short while ago, President Trump signed three — three items. The first is an executive order relating to the affordability and availability of in vitro fertilization and other fertility treatments. These are treatments that have become unaffordable for many Americans or have been unaffordable for many Americans. And the executive order is a directive to the Domestic Policy Council to examine ways to make IVF and other fertility treatments more affordable for more Americans. The second item that we signed was a presidential memorandum imposing radical transparency requirements on government departments and agencies in keeping with President Trump and the administration’s broader commitment to governmental transparency. What this presidential memorandum would do is require — as waste, fraud, and abuse is uncovered, as programs are canceled, and, ultimately, as taxpayer dollars are saved, this presidential memorandum would require departments and agencies to make all of the details of that freely available to the public. Lastly, we have another executive order that President Trump signed relating to independent agencies. This executive order would establish important oversight functions in the Office of Management and Budget and its subsidiary office, OIRA, supervising independent agencies and many of their actions and also reestablishes the long-standing norm that only the president or the attorney general can speak for the United States when stating an opinion as to what the law is. THE PRESIDENT: All right. Thank you very much, Will. That was the primary purpose of this conference to explain that they are all very important in their own way. Fertilization — I’ve been saying that we’re going to do what we have to do, and I think the women — and families, husbands — are very appreciative of it. But that was it. I do want to say while I’m up here, I’ve been contacted by some of the biggest companies in the world, and because of what we’re doing economically and through tariffs and taxes and incentives, they want to come back into the United States. And we’ll be announcing various very large companies — the biggest, actually. And they’ll be coming back, having to do with chips and having to do also with cars and lots of other things. We’re going to be announcing some very, very big — very big — momentous, I think — momentous decisions are being made by companies all around the world — the biggest — and they want to come back into the U.S. Car plants are being canceled in other locations now because they want to build them here. And you read about a couple — not that I want to mention names or anything — but you read about a couple of big ones in Mexico just got canceled because they’re going to be building them in the United States. And that’s very simply because of what we’re doing with respect to taxes, tariffs, and incentives. And I think it’s a very important thing. And you’ll be seeing this over the next — probably over the next two years, to be honest, but you’re going to see a lot of it over the next couple of weeks. A lot of big ones are be — going to be announcing. And so, while we’re here, I guess we can take a couple of quick questions. Go ahead, please. Please. Q Mr. President, have you decided specifically what the auto tariff rate should be? THE PRESIDENT: Yeah, I probably will tell you that in — on April 2nd, but it’ll be in the neighborhood of 25 percent. Q And what about semiconductors and pharmaceuticals? THE PRESIDENT: It’ll be 25 percent and higher, and it’ll go very substantially higher over a course of a year. But we want to give them time to come in, because, as you know, when they come into the United States and they have their plant or factory here, there is no tariff. So, we want to give them a little bit of a chance. Yes, thank you. Q Just following up on that. The EU — I’m sorry. Andrea Shalal. The EU representative is going to be here in Washington next week — I’m sorry, tomorrow. He’s going to be meeting with Hassett and Greer and Lutnick. What can the EU do to sort of avoid the reciprocal tariffs that you’ve talked about? And, you know, you’ve talked a lot about the VAT. Do you expect them to reduce that? THE PRESIDENT: Well, they did already, as I understand it, reduce their car tariff all the way down to what we have. And a lot of that will take place, and I think some won’t do it and some will do it. But the EU had a 10 percent tax on cars, and now they have a 2.5 percent tax, which is the exact same as us. So, already we’ve saved a tremendous amount. That would be great — if everybody would do that, then we’d all be on the same playing field. Because essentially, what we’re doing with the tariffs is, you know, they charge us, we charge them. Same amount. And it’s called reciprocal, actually, and whatever they charge us, we’re charging them. And so, the EU is — you know, I appreciate that they did this, but, you know, the EU has been very unfair to us. We have a deficit of $350 billion. They don’t take our cars. They don’t take our farm products. They don’t take almost anything. They take very little. And we’re going to have to straighten that out, and we will. I have no doubt about it. Yeah, go ahead, please. Q Thanks. Thank you, Mr. President. Can you tell us a little bit more about the Russia talks, your impression of — THE PRESIDENT: Yeah. Q — how they went today — THE PRESIDENT: Sure. Q — and if you’re perhaps more confident or less confident of a deal after what happened today? THE PRESIDENT: Well, much more confident. They were very good. Russia wants to do something. They want to stop the savage barbarianism. I mean, what’s going on over there, it’s — soldiers are being killed by the thousands on a weekly basis. It’s ridiculous. And they’re not American soldiers. They’re Russian soldiers and they’re Ukrainian soldiers, largely, although a lot of Koreans have been killed, as you know — quite a bit of them have been killed. They came over to fight, and a large portion have been wiped out. But we want to end it. It was — it’s a senseless war. It should have never happened. It would have never happened if I was president. And it’s a shame to see it. And I see pictures that you don’t see, but I see pictures of fields that look hor- — just horrible. It looks like Gettysburg. If you see the old pictures of Gettysburg, it’s soldiers lying all over the field, body parts all over the field. They’re all dead. And this is going on on a — on a daily basis. It’s a horrible thing. Both Russia and Ukraine — they’re losing thousands and thousands of soldiers, and a lot of people have been killed too. I think that’s one of the things that’ll — you’ll see historically and you’ll see later on as it goes along. I think people are going to be surprised at how many people, not only soldiers, have been killed in Ukraine. A lot more people than you think. Yeah, please. Q President Trump, as part of a peace deal with Putin, would you be willing to consider removing all American troops from Europe? THE PRESIDENT: Well, nobody has asked me to do that, so I don’t think we’d have to do that. I wouldn’t want to do that. But that question has never really come up. Q Sir — THE PRESIDENT: Yeah. Please. Q Sir, do you support stationing European peacekeeping troops in Ukraine as part of this peace deal? THE PRESIDENT: If they want to do that, that’s great. I’m — I’m all for it. If they want to do that, I think that’s — that’d be fine. Q Even if the Russians are opposed — THE PRESIDENT: I mean, I know France has mentioned it, others have mentioned it. Q Even if the Russians are — THE PRESIDENT: UK has mentioned it. But yeah, if — well, if we have a peace deal, I think having troops over there for — from the standpoint of Europe — we won’t have to put any over there, because, you know, we’re very far away, but having troops over there would be fine. I would not object to it at all. We’re talking about this now: peace. We have either a ceasefire or a peace itself, and we’re looking to do both. Would start off with the ceasefire. And if they want to do that — I know France was willing to do that, and I thought that was a beautiful gesture. Yeah, please. Q Sir, do you have any message for Ukrainians who, after three years of fighting, might feel betrayed or disappointed at not having a seat at these initial talks in Saudi Arabia? THE PRESIDENT: Well, I think I’m really disappointed in what’s happened. I’ve been watching this for three years. It’s a war that would have never happened if I was president. And I’ve been watching these — these, you know, people being killed at levels that you’ve rarely seen — not — not even close since the Second World War, and I’m very disappointed. I hear that, you know, they’re upset about not having a seat. Well, they’ve had a seat for three years and a long time before that. This could have been settled very easily. Just a half — a half-baked negotiator could have settled this years ago without — I think, without the loss of much land, very little land; without the loss of any lives; and without the loss of cities that are just laying on their sides. You have those magnificent golden domes that are shattered, will never be replaced. You can’t replace them. Thousand-year-old domes that are so beautiful. You can’t replace that. A whole civilization has changed because of what — So, when they’re worried about not being seated, you mean somebody that should have gone in and made a deal a long time ago. You could have made a deal. This is one that could have made a deal. There was no talk of this during the Trump administration. Putin would have never, ever done it. And, by the way, we wouldn’t have had October 7th. You know that. We wouldn’t have had October 7th either in Israel, and we wouldn’t have that mess that’s going on over there. It’s like you — we have great fire people here. We’re putting out fires. All over the world, we’re putting out fires. So, that wouldn’t have happened. And you know what else wouldn’t have happened? Inflation, because it was caused, really, by the cost of energy going through the roof because of their bad energy policies, and — and also their spending — their terrible spending, wasteful spending on the Green New Scam. It’s a scam. It’s a whole big scam. Yeah, please. Q Yes, sir. I want to ask you a little closer to home. What would it take for you to reconsider the restrictions on the Associated Press? And secondly, some of your advisers are concerned with the Associated Press’s style guide, using language and giving guidance to not use words like “illegal immigrant” or to use phrases like “gender-affirming care,” and they’re concerned about that being an encroaching amount of liberalism in the way in which the press writes about things. Do you share those concerns? THE PRESIDENT: Well, I do think that some of the phrases that they want to use are ridiculous, and I think, frankly, they’ve become obsolete, especially in the last three weeks, because many things have happened in the last three weeks. And I didn’t know about that, but I would say that if they want to use certain phrases like that — and I guess some are okay, but many aren’t. But the Associated Press just refuses to go with what the law is and what has taken place. It’s called the Gulf of America now. It’s not called the Gulf of Mexico any longer. I have the right to do it, just like we have the right to do Mount McKinley, and nobody is even challenging that. But only the Associate- — essentially, it’s primarily the Associated Press, and I don’t know what they’re doing, but I just say that we’re going to keep them out until such time as they agree that it’s the Gulf of America. We’re very proud of this country, and we want it to be the Gulf of America. Now, the Associated Press, as you know, has been very, very wrong on the election, on Trump, and the treatment of Trump, and other things having to do with Trump and Republicans and conservatives. And they’re doing us no favors, and I guess I’m not doing them any favors. That’s the way life works. But, you know, thank you for the question. Who are you with? Q Axios, sir. THE PRESIDENT: It’s a very good question. (Laughs.) Thank you. Yes. Q Thank you, Mr. President. We’re hearing that Russia wants to force Ukraine to hold new elections in order to sign any kind of a peace deal. Is that something that the U.S. would ever support? THE PRESIDENT: Well, we have a situation where we haven’t had elections in Ukraine; where we have martial law — essentially martial law in Ukraine; where the leader in Ukraine — I mean, I hate to say it, but he’s down at 4 percent approval rating; and where a country has been blown to smithereens. You got — most of the cities are laying on their sides. The buildings are collapsed. It looks like a massive demolition site. The whole — I mean, so many of the cities — I mean, they haven’t done it in Kyiv, because I guess they don’t want to shoot too many rockets in there. They’ve done it 20 percent, but they haven’t done it 100 percent. If they wanted to do it 100 percent, it would probably happen very quickly. But you have cities that are absolutely decimated. And yeah, I would say that, you know, when they want a seat at the table, you could say, the people have to — wouldn’t the people of Ukraine have to say, like, you know, “It’s"
