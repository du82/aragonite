title = "Return to In-Person Work – The White House"
description = "Heads of all departments and agencies in the executive branch of Government shall, as soon as practicable, take all necessary steps to terminate"
full_description = "Presidential Actions Return to In-Person Work January 20, 2025 Heads of all departments and agencies in the executive branch of Government shall, as soon as practicable, take all necessary steps to terminate remote work arrangements and require employees to return to work in-person at their respective duty stations on a full-time basis, provided that the department and agency heads shall make exemptions they deem necessary. This memorandum shall be implemented consistent with applicable law. Presidential Actions Return to In-Person Work January 20, 2025 Heads of all departments and agencies in the executive branch of Government shall, as soon as practicable, take all necessary steps to terminate remote work arrangements and require employees to return to work in-person at their respective duty stations on a full-time basis, provided that the department and agency heads shall make exemptions they deem necessary. This memorandum shall be implemented consistent with applicable law."
