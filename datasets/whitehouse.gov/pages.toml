full_description = "Administration Usha Vance Second Lady of the United States Usha Vance is the proud wife of Vice President JD Vance and the mother of their three beautiful children, Ewan, Vivek, and Mirabel. A native of San Diego, California, Ms. Vance is an experienced litigator whose work involved complex civil litigation and appeals in a wide variety of industries. Ms. Vance also clerked for Chief Justice John G. Roberts, Jr. of the U.S. Supreme Court and Judge Brett Kavanaugh, then of the U.S. Court of Appeals for the District of Columbia Circuit. Prior to that, Ms. Vance clerked for Judge Amul Thapar, then of the U.S. District Court for the Eastern District of Kentucky. Though Usha and JD met while attending Yale Law School, Usha also earned her bachelor’s degree from Yale University and a master’s degree from the University of Cambridge, where she was a Gates Cambridge Scholar. In her free time, Ms. Vance is a trustee of the Washington National Opera and has served on the board of the Gates Cambridge Alumni Association and as secretary of the board of the Cincinnati Symphony Orchestra. Learn more about Vice President JD Vance here."
