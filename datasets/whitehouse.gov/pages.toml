full_description = "About The White House The White House From the Ground Floor Corridor rooms, transformed from their early use as service areas, to the State Floor rooms, where countless leaders and dignitaries have been entertained, the White House is both the home of the President of the United States and his family, and a living museum of American history. AIR FORCE ONE “Air Force One” is used to designate any Air Force aircraft carrying the President, but it is now standard practice to use the term to refer to specific planes that are equipped to transport the Commander-in-Chief. CAMP DAVID Camp David, known formally as the Naval Support Facility Thurmont, is the President’s country residence. Located in Catoctin Mountain Park in Frederick County, Maryland, Camp David has offered Presidents an opportunity for solitude and tranquility, as well as an ideal place to host foreign leaders."
