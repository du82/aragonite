["https://www.whitehouse.gov/about-the-white-house/camp-david"]
title = "Camp David"
description = "Camp David, known formally as the Naval Support Facility Thurmont, is the President’s country residence. Located in Catoctin Mountain Park in Frederick County, Maryland, Camp David has offered Presidents an opportunity for solitude and tranquility, as well as an ideal place to host foreign leaders."
full_description = "About The White House CAMP DAVID Camp David, known formally as the Naval Support Facility Thurmont, is the President’s country residence. Located in Catoctin Mountain Park in Frederick County, Maryland, Camp David has offered Presidents an opportunity for solitude and tranquility, as well as an ideal place to host foreign leaders. Adapted from the federal employee retreat Hi-Catoctin, President Franklin Roosevelt established the residence as USS Shangri La, modeling the new main lodge after the Roosevelt winter vacation home in Warm Springs, Georgia. President Eisenhower subsequently renamed the institution in honor of his grandson David. Camp David has been used extensively to host foreign dignitaries. Prime Minister Winston Churchill of Great Britain attended the first such meeting in May of 1943; the summit held at the residence in 1978 for Egyptian President Anwar al-Sadat and Israeli Prime Minister Menachem Begin resulted in what are now known as the Camp David Accords."
