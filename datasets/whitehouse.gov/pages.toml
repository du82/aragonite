["https://www.whitehouse.gov/remarks/2025/02/press-gaggle-by-president-trump-at-future-investment-initiative-institute-priority-summit"]
title = "Press Gaggle by President Trump at Future Investment Initiative Institute Priority Summit – The White House"
description = "Faena Hotel & Forum Miami Beach, Florida (February 19, 2025) 5:35 P.M. EST      THE PRESIDENT:  Thank you very much."
full_description = "Remarks REMARKS BY PRESIDENT TRUMPAT FUTURE INVESTMENT INITIATIVE INSTITUTE PRIORITY SUMMIT February 19, 2025 Faena Hotel & Forum Miami Beach, Florida (February 19, 2025) 5:35 P.M. EST THE PRESIDENT: Thank you very much. (Applause.) What a great group this is. You have to see outside. It’s going wild outside with a lot of love for all of us, I guess. (Laughter.) But thank you, Richard, for the introduction. And thank you to all for such a warm welcome. It’s great to be back in beautiful Miami, where I’ve actually built a lot of great buildings with the Dezer family and some others. We’ve had tremendous success in Miami. We have Trump Towers in Sunny Isles Beach. It’s four beautiful buildings right on the ocean. The Trump Grande — put the little E on the end for a little — class it up a little bit. (Laughter.) Trump Grande. And the 700-acre Doral. That’s a tremendous country club in the — it’s actually the most successful country club in the U.S., where I was just given approval to build 1,500 units. And I couldn’t care less about building units. When you’re president, who the hell wants to build units? (Laughter.) I’ve been building units all my life. I don’t want to build units, but they gave us permission to do it. But today is a tremendous honor to become the first American president to address the Future Investment Initiative Institute. That’s the first one. That’s very — it’s always nice. (Applause.) And I want to thank Mayor of Miami Francis Suarez for being here. Thank you very much, Francis, wherever you may be. (Applause.) Hi, Francis. And thank you for the endorsement when I ran. I was very appreciative. Along with the mayor of Miami Beach, Steven Meiner. Steven, thank you very much. Thank you. (Applause.) Thank you. Thank you, Steven. Thank you very much. And numerous American business leaders, some of the bi- — biggest business leaders, actually, anywhere in the world, and many distinguished guests from the Middle East, and, in particular, the Kingdom of Saudi Arabia — a special place with special leaders. (Applause.) And including FII Institute chairman and governor of the Public Investment Fund, which is a seriously big fund, Yasir. I see you there. Stand up, Yasir. (Applause.) Everyone knows Yasir. Thank you. Great guy. Great, great person. And Finance Minister Mohammed, thank you very much. Thank you right — thank you very much. (Applause.) Good to see you again. That’s pretty good: finance minister of that part of the world. That’s not bad. (Laughter.) Other parts of the world, not so good, but that one is good. (Laughter.) And many other senior government leaders. I also want to recognize the Kingdom’s ambassador to the United States, Her Royal Highness Princess Reema. (Applause.) Ooh, very popular. Very popular. Wow. That’s very nice. Sitting next to Elon. Wow, that’s — you couldn’t do better than that, huh? (Applause.) As well as my own special envoy to the Middle East, who has really done a fantastic job, Steve Witkoff. Thank you, Steve. (Applause.) He’s been busy. And Michael Waltz is here. Where is Michael? Michael has been so busy. They’ve been going back and forth and back. And a woman who was just voted the most powerful woman an- — anywhere in the world — (applause) — no, I’ll go with — I’m going to go with Princess Reema — but she was voted the most powerful woman anywhere in the world: Susie Wiles. Thank you. (Applause.) Thank you. Most powerful woman, that’s pretty good. We have to talk to you about that, Susie. That’s pretty good. (Laughter.) And also, we all know Jared Kushner, a very special guy. (Applause.) Thank you, Jared. Thank you, Jared. And Elon Musk. He’s been making a little news lately, hasn’t he, though? (Applause.) Very positive news. Stand up, Elon. (Applause.) He’s a great guy. We did a little show last night. I heard that it got very good ratings, too, by the way. We did “Hannity.” Sean Hannity was fantastic — a fantastic man, a fantastic guy, and he did a show. And it was great being on the show with you last night. I come today with a simple message for business leaders from all across the nation and all around the world: If you want to build the future, push boundaries, unleash breakthroughs, transform industries, and make a fortune — because you want to make fortune; most of you have already made a fortune, I don’t want to say — (laughter) — there is no better place on Earth than the current and future United States of America under a certain president named Donald J. Trump. I think that you’re going to do very well. (Applause.) They’re saying that November 5th — Election Day — 2024, will go down as one of the most important days in the history of our country. They said, “In 129 years, the most consequential election.” I don’t know if they’re right about that or not, but it sounds good. I wanted to see if I could get a couple of more years tacked on, but I figured the fight wasn’t really worth it. One hundred and twenty-nine is a lot. And as of January 20th, 2025, the dark days of high taxes, crushing regulations, rampant inflation, flagrant corruption, government weaponization — ooh, I know about weaponization — and total incompetence will be gone forever. Will be gone forever. (Applause.) Because the United States is back and open for business, and the golden age of America has officially begun. You see it happening. (Applause.) Since my election, America’s economic engines have come roaring back to life in just a very short period of time. Think of it. From November 5th, the — the progress that’s been made has been amazing. The Nasdaq is up nearly 10 percent in just a few months, and that’s a lot. The Dow Jones Industrial Average is up 2,200 points. And Bitcoin has set multiple all-time record highs, because everyone knows that I’m committed to making America the crypto capital. We want to stay — we want to stay at the forefront of everything, and one of them is crypto. And Miami seems to be the center of the action, come to think of it, and maybe it’ll stay there. Business optimism skyrocketed 42 points — think of that — in a single month. The most in history, by far. That’s the biggest increase in history by not even close. The ISM index of manufacturing activity surged into positive territory for the first time in many years. Amazing. And it was just announced — this is an interesting one. I didn’t realize it was that bad for so long. But it was just announced by one of the nation’s most historically accurate and respected pollsters, Rasmussen, that the number of Americans who believe our country is on the right track now exceeds those who think it’s heading in the wrong direction for the first time in 20 years. Can you believe you that? Twenty years. (Applause.) And this is really a seismic 27-point swing from just before the election. That’s — nobody has ever seen anything like that one, Yasir. I want to tell you. That’s a big one. (Laughter.) The best and most successful business leaders on Earth are now racing to invest in the United States. Since November, DAMAC has announced plans to invest $40 billion in the U.S., creating at least 10,000 jobs. SoftBank has announced investments of between $100- and $200 billion, creating at least 100,000 American jobs. Oracle and OpenAI and SoftBank are now collectively committing $500 billion to keep the United States on the cutting edge of artificial intelligence. And so many more — I mean, so many companies, they want to come to the White House and have a little news conference all the time. I said, “Why don’t you just announce it?” But they want to come, and I’ll do that. I don’t mind doing that. I say anytime they want to go $10 billion or more, I’m — I’m there. (Laughter and applause.) Ten billion or more. But on his recent visit to the White House, the prime minister of Japan announced he anticipates Japanese investment in the United States of well over a trillion dollars, and we’re working on an Alaska pipeline already, which is the closest point to Asia. And as you know, the ANWR, which we’ve started, Ronald Reagan couldn’t get it approved. Nobody could get it approved for so many years. Couldn’t get it approved. I got it approved. Actually, I got it approved twice. I got it approved, and Biden ended it. That was a shocker. But we just got it approved again. And we’re going to be — (applause) — it’s — it’s probably the largest deposit maybe anywhere in the world, just by itself. It’s — they say of similar size to Saudi Arabia, so we hope that’s correct. But all of this is only happening because of the world-changing results of the 2024 election. We won the House. We won the Senate, the White House, and the Electoral College and the popular vote in a landslide. We also won all seven swing states, and all 50 states shifted in the Republican direction for the first time ever. So, every state — every single state of the 50 states shifted Republican. That’s never happened before. Either way, it’s never happened. And 85 percent of counties voted for Trump. Think of that. So, you have 2,600 counties versus 525. Two thousand six hundred, think of that. That’s why when you look at the election map, after it was all done — the certified map — the whole thing was red — 2,600 versus 500. It’s a big, big dif- — nobody’s seen anything like it, actually. So, as a result of this very historic victory, investors from all over the planet, once again, have confidence in America’s future and respect for America’s leaders, and it’s about time we get a little respect. The last administration was the worst and most incompetent in the history of our country, but we are moving quickly to fix every single disaster Joe Biden created and make America stronger and more prosperous than ever before. (Applause.) Our first and most urgent mission is to remove the criminals that Biden allowed into our country with the ridiculous and very dangerous open-borders policy. They came from all over the world. They came from prisons and jails. They came from mental institutions and insane asylums. They were gang members. They were drug lords. They came from all over, and they were allowed to come into our country. And we’re getting them out in record levels, just like they came in in record levels. I want to thank Tom Homan and Kristi, who is just doing — she’s doing a fantastic job — governor of South Dakota — and Tom Homan, you know, and they are doing a fantastic job. (Applause.) And the results are incredible. And every country is taking them back. They’re sending their criminals to us, and they’re all taking them back. We had a little problem with a couple of them. That ended very quickly. And because some said, “We don’t really want MS-13 back in our country.” But I said, “Congratulations, you’re taking them back,” and they take them back. And, by the way, Europe and other places ought to start also doing that. They better start looking at immigration, because it’s really hurting Europe very, very badly. And they better get smart and they better get tough before it’s too late. We’re also working to end the highest inflation in our country’s history, all caused because they played with our energy policy and wasted money on the Green New Scam and other things such as that, and they wasted monies at — at never-seen-before levels. If Joe Biden had simply held federal spending at the pre-pandemic levels we had in 2019, we — right now, we would have virtually no inflation. We’re trying to balance the budget immediately, and because of the tariff income, which is really go- — it’s — it’s already turned out to be amazing, actually. It’s really meant more for bringing countries and companies into our country, but it’s — the numbers are rather staggering, because we’re the big piggy bank that everybody wants to be. And they can play games, and they can say, “Well, there’ll be retribution and, you know, equal this and that,” but they can’t be equal. But we want to keep it so that we’re the big piggy bank. And if we had years like we did the last four years, that wouldn’t have lasted too long. So, we’re not promising it, but you know, all of these things could happen. We — we hope to balance our budget. So, I don’t want to promise it, because if I do and we come about $10 short, the fake news media back there would say, “We have breaking news. He did not make it. He did not make it.” But we’ll get it done very soon. It might not be this year, but it could be this year. Actually, we have a chance at getting it even this year, which people would be shocked at, because they were talking about 10 years, 15 years, 20 years from now. When I took office last month, we inherited the consequences of inflation that was more than four times what it was when I left four years ago. Think of that, I left, it was at 1.4 percent. And the annual government spending over $1.5 trillion more than projected in 2020 alone — $1.5 trillion. But under the Trump administration, all of that is changing faster and more dramatically than anyone ever thought possible. They didn’t think it was possible to do what we’ve done in just a very short period of time. We’ve accomplished more in four weeks than most administrations accomplish in four years. On my first day in office, I imposed an immediate federal hiring freeze, a federal regulation freeze, and a foreign aid freeze. I signed an order creating the Department of Government Efficiency and put a man named Elon Musk in charge. Thank you, Elon, for doing it. (Applause.) Thank you very much. And he’s doing a great job. I wish you could have seen him last night. It’s really — you know, he’s a very committed person. He’s a very serious person. And he’s a very high-IQ people. You know, I like high-IQ people. Not all have to be, but, you know, it’d be nice to have some people up there that — (laughter) — he’s a seriously high-IQ individual. Now, he’s got his faults also, I will tell you that — (laughter) — but not too many of them. Which is now really waging war on government waste, fraud, and abuse, and they’re curbing inflation and saving taxpayers billions and billions of dollars every single day. And there’s even under consideration a new concept where we give 20 percent of the DOGE savings to American citizens and 20 percent goes to paying down debt, because the numbers are incredible, Elon. So many billions of dollars — it’s billions — hundreds of billions, and we’re thinking about giving 20 percent back to the American citizens and 20 percent down to pay back debt — and pay down debt, which is — if you look at value, if it were a real estate balance sheet, the debt is tiny, but we still — we still want to pay it down. Doesn’t matter. We don’t look at it as a piece of real estate. It’s America. We’re going to get it down through intelligence, hard work, and, as Elon said, a word called “caring.” You have to have — you have to care. By doing this, Americans will tell us where there is waste. They’ll be reporting it themselves. Th"
