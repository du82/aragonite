title = 'Interview of President Trump and Elon Musk by Sean Hannity, "The Sean Hannity Show" – The White House'
description = "Roosevelt Room 11:48 A.M. EST      Q    Mr. President, great to see you again.     THE"
full_description = "Remarks INTERVIEW OF PRESIDENT TRUMPAND ELON MUSKBY SEAN HANNITY, “THE SEAN HANNITY SHOW” February 18, 2025 Roosevelt Room 11:48 A.M. EST Q Mr. President, great to see you again. THE PRESIDENT: Thank you very much. Thank you. Q How are you? THE PRESIDENT: Thank you. Q Elon Musk. MR. MUSK: Hi. Q Great to see you. MR. MUSK: Thanks. Thanks for having me. Q I’ve been reading a lot about you. I’ve got to start with this. So, he’s working for free with DOGE. He’s — he’s kind of put a lot of his life on hold, and you sued Twitter a number of years ago. You just made him pay you $10 million? THE PRESIDENT: That’s right. That’s right. Q That’s — that’s right. (Laughs.) THE PRESIDENT: Well, I sued — I sued from long before he had it. MR. MUSK: Yeah. Yeah. (Inaudible.) THE PRESIDENT: And, I mean, they really did a number on me, you know. And I sued, and they had to pay. You know, they paid $10 million settlement. Q You’re okay with that? MR. MUSK: I mean, I left it up to the lawyers and, you know, the team running Twitter. So, I said, “You guys do what you think is the right — makes sense.” Q I think it’s funny. THE PRESIDENT: I think — Q Because — THE PRESIDENT: — it’s a very low — I was looking to get much more money than that. Q So, you gave him a discount w- — in the lawsuit? THE PRESIDENT: He got — oh, he got a big discount. I don’t think he even knows about it. Q He’s become one of your — if you read and believe the media — he’s become one of your best friends. He’s working for free for you. He’s — MR. MUSK: Well, I love the president. I just want to be clear about that. Q You don’t care about that? MR. MUSK: I — no, I love the pr- — I — Q You love the president? MR. MUSK: I think — I think President Trump is a good man, and — and he’s, you know — I — I — THE PRESIDENT: That’s the way he said that. You know, there’s something nice about. (Laughter.) MR. MUSK: No, it is. I, you know — THE PRESIDENT: It is. MR. MUSK: Because, I mean, the president has been so — so unfairly attacked in the media. It’s truly outrageous. And I’ve sp- — at this point, spent a lot of time with the president, and not once have I seen him do something that was mean or cruel or — or wrong. Not once. Q You know, I’ve known him for 30 years. MR. MUSK: Yeah. Q And I’ve never seen anybody take as much as he’s taken. MR. MUSK: Yeah. Q And we’ve discussed this. And I’m like, “How do you deal with it?” THE PRESIDENT: Did have a choice? (Laughs.) I didn’t have a choice. Q Well, you would say that to me. I’m like, “What — what am I going to do? Worry about it?” THE PRESIDENT: That’s the only thing I can say. Q And, you know — and then culminating in two assassination attempts, which resulted in your endorsement. MR. MUSK: Well, I was going to do it anyway, but that was — Q That was it? MR. MUSK: — a precipitating event, yeah. THE PRESIDENT: That speeded it up a little bit? MR. MUSK: Yeah. Yeah. Q The day of the assassination? THE PRESIDENT: Nice. I didn’t know that. MR. MUSK: Yeah, it just — it sped it up, but I was going to do it anyway. Q Mr. President, with your indulgence, I’m convinced that people only know a little bit about Elon. I don’t think they know everything about Elon, because as I studied for and prepared for this interview, I learned a lot about you that I didn’t know. I think people will think about Tesla. Democrats are demonizing you and — and trying to make the country hate you. I just want people to understand you a little bit better, and the person that you’ve gotten to know and have now put a lot of trust in. THE PRESIDENT: Sure. Q And, you know, just — let’s go over a little bit of your bio, starting — MR. MUSK: Ah, okay. Q — with PayPal and how you became involved in Tesla and SpaceX and Neuralink — MR. MUSK: This — this could take a while. Q — and all these — MR. MUSK: I mean, you know, I — I think the way you think of me is, like, I’m a technologist and I try to make technologies that improve the world and make life better. Q You can show them your shirt. MR. MUSK: Yeah, and that’s why, like, my t-shirt says “tech support” — (laughter) — because I’m here to provide the president with — with technology support. And now, that — that may seem, like, well, is that a silly thing? But actually, it’s a very important thing, because the president will make these executive orders, which are very sensible and good for the country, but then they don’t get implemented, you know? So, if you take the — for example, all the funding for the migrant hotels, the president issued an executive order: Hey, we need to stop taking taxpayer money and — and paying for luxury hotels for illegal immigrants — Q It’s crazy. MR. MUSK: — which makes no sense. Like, obviously, people do not want their tax dollars going to — to fund high-end hotels for — for illegals. And yet, they were still doing that, even as late as last week. And so, you know, we went in there, and we were like, “This is in violation of the presidential executive order. It needs to stop.” So — so, what we’re — what we’re doing here is — is — one of the biggest functions of the DOGE team is just making sure that the presidential executive orders are actually carried out. And this is — I just want to point out, this is a very important thing, because the president is the elected representative of the people, so he’s representing the will of the people. And if the bureaucracy is fighting the will of the people and preventing the pres- — the president from implementing what the people want, then what we live in is a bureaucracy and not a democracy. Q Yeah. You — you’re both aware — you have to be keenly aware that the media and — and the punditry class — not that — you know, I think you’ve proven they have no power anymore, because they threw everything they had at you, and they didn’t win. And that was, you know, the New York Times, Washington Post, three networks, every late-night comedy show, two cable channels — they — they just threw — they threw everything — lawfare, weaponization. THE PRESIDENT: It’s true. Q And now I see they want you two to start — they want a divorce. They want you two to start hating each other. And they try — “Oh, President Elon Musk,” for example. You do know that they’re doing that to you? THE PRESIDENT: Oh, I see it all the time. They tried it, then they stopped. That wasn’t — they have many different things of hatred. Actually, Elon called me. He said, “You know they’re trying to drive us apart.” I said, “Absolutely.” You know, they said, “We have breaking news: Donald Trump has ceded control of the presidency to Elon Musk. President Musk will be attending a Cabinet meeting tonight at 8 o’clock.” (Laughter.) And I say — it’s just so obvious. They’re so bad at it. I used to think they were good at it. They’re actually bad at it, because if they were good at it, I’d never be president because I — I think nobody in history has ever gotten more bad publicity than me. I could do the greatest things; I get 98 percent bad publicity. I could do — outside of you and a few of your very good friends. It’s, like, the craziest thing. But you know what I have learned, Elon? The people are smart. They get it. MR. MUSK. Yeah. They do, actually. Yeah. THE PRESIDENT: They get it. They really see what’s happening. MR. MUSK: Yes. Q And at the end of this interview, I — what I would like is, I — I want people to know the relationship and know more about you. What is the relationship, Mr. President? THE PRESIDENT: Well, I respect him. I’ve always respected him. I never knew that he was right on certain things, and I’m usually pretty good at this stuff. He did Starlink. He did things that were so advanced and nobody knew what the hell they were. I can tell you, in North Carolina, they had no communication. They were wiped out. Those people were — you know, they had rivers in between — land that never saw water, all of a sudden, there was a river and a vicious — like, rapids. People were dying all over. They had no communication. They said, “Do you know Elon Musk?” And they didn’t really know I knew him. I said, “Yeah.” They said, “Could you get Starlink?” It’s, like, the first time I ever heard of it. I said, “What’s Starlink?” “A communication system that’s unbelievable.” Q I have it. THE PRESIDENT: And he — yeah. And he said — I called him, and I said, “Listen, they really need it.” And he got, like, thousands of units of this communication, and it saved a lot of lives. He got it immediately. And you can’t get it. I mean, you have to wait a long time to get it. But he got it to him immediately. And I said, “That’s pretty amazing.” And I didn’t even know he had it. We watch the rocket ships, and we watch Tesla. I think, you know, something that had an effect on me was when I saw the rocket ship come back and get grabbed like you grab a beautiful little baby. You grab your baby. It just — MR. MUSK: Just hug the rocket. THE PRESIDENT: I’d never seen — MR. MUSK: Everyone — right. Everyone needs (inaudible) — Q You hug the rocket. You hug the rocket. MR. MUSK: — (inaudible) rockets. THE PRESIDENT: Yeah. No, but — and he said, “You know, you can’t really have a rocket program if you’re going to dump a billion dollars into the ocean every time you fly. You have to save it.” And he saved it. First time — Q That’s ever been done. THE PRESIDENT: — I’ve ever seen that done. Now nobody else can do it. If you look at the U.S., Russia, or China, they can’t do it, and they won’t be able to do it for a long time. He has the technology. So, you learn — I wanted somebody really smart to work with me, in terms of the country — a very important aspect. Because, I mean, he doesn’t talk about it. He’s actually a very good businessman. And when he talks about the executive orders — and this is probably true for all presidents: You write an executive order and you think it’s done, you send it out; it doesn’t get done. It doesn’t get implemented. They don’t implement it. They — maybe they’re from the last administration — and they are, in some cases. You try and get them out as fast as you can. But I could — as soon as he said that, I said, “You know, that’s interesting.” You write a beautiful executive — and you sign it and you assume it’s going to be done, but it’s not. What he does is he takes it, and with his hundred geniuses — he’s got some very brilliant young people working for him that dress much worse than him, actually — MR. MUSK: Yeah, they do. THE PRESIDENT: — they dress in just t-shirts. (Laughter.) You wouldn’t know they have 180 IQ. Q Wait. Wait. So, what — he’s — he’s your tech support? MR. MUSK: I — THE PRESIDENT: No, no. He is — MR. MUSK: I actually virtually am tech support. THE PRESIDENT: He’s much more than that. MR. MUSK: I actually am tech support, though. But that’s — THE PRESIDENT: But he gets it done. He’s a leader. He really is a — he gets it done. You get a lot of tech people, and you have people, they’re good with tech, but they — he gets it done. You know, I said, in real estate, you had guys that would draw beautiful renderings of a building, and they’d draw the rendering, it would be great, and you’d say, “Great. When are you starting?” But they were never able to get it built. They couldn’t get the finances. They couldn’t get the approvals. It would never get done. And then you have other guys that are able to get it done. You know, they could just get it done. I was in real estate. Same thing in this. He gets it done. So, when he said that — he said, “You know, when you sign these executive orders, a lot of them don’t get done, and maybe the most important ones,” and he would take that executive order that I’d signed, and he would have those people go to whatever agency it was — “When are you doing it? Get it done. Get it done.” And some guy that maybe didn’t want to do it, all of a sudden, he’s signing — he just doesn’t want to bothered. Q Does — do a lot of those executive orders have to be codified into law to — do you need the Republican Congress to follow up? THE PRESIDENT: Yeah, and they will. A lot of them will be. Yeah. Q They will? THE PRESIDENT: Look, in the meantime, we have four years. The beauty is, we have four years. That’s why I like doing it right at the beginning. Because an executive order is great. I mean, the one problem — it’s both good and bad, because when they did all these executive orders, I’ve canceled most of them. They were terrible. I mean, we were going to go radical left, communist, okay? It was crazy. Their — MR. MUSK: Really crazy. THE PRESIDENT: — executive orders were so bad, if they ever got them codified, you’d never be able to break them. So, the damage that Biden has done to this country — and it’s not even Biden; it’s the people that circled him in the Oval Office, okay? — but the damage they did to this country, in terms of, let’s say, open borders — you know, there’s so many things, but open borders, where millions of people poured into our country, and hundreds of thousands of those people are criminals. They’re murderers. They’re drug dealers. They’re gang members. They’re people from prisons from all over the world. And we have a great guy, Tom Homan, and he is doing so incredibly. You saw the numbers. They’re down like 96 percent. Q Ninety-five percent. THE PRESIDENT: He is a phenomenal guy. And Kristi Noem is doing an unbelievable job. And he wanted her. He said, “She’s so tough.” And I said, “I don’t think of her as that way. You know, she’s very nice.” He said, “No, she’s so tough.” And she is. I see her with the horses. She’s riding the horse. Let’s — (laughter) — she’s great. But the team we have is — is really unbelievable. But those executive orders, I sign them, and now they get passed on to him and his group and other people, and they’re all getting done. We’re getting them done. Q Let me go back a little bit to your background, because — MR. MUSK: Sure. Q — it’s beyond impressive. You were the chief engineer, for example — you were an early believer in Tesla. You became the CEO and — and then the chief engineer, which was phenomenal. SpaceX, same thing, which is unbelievable. I mean, you were the first company — private company to send astronauts successfully into — into space, first private company to send astronauts into orbit. MR. MUSK: Yeah. Q That’s — that’s pretty deep. THE PRESIDENT: He’s going to go into orbit soon. Q Okay. MR. MUSK: (Laughs.) Yeah. THE PRESIDENT: No, he’s going to go to Mars. He’s going to fly on his — Q Starlink. MR. MUSK: At some point, yeah. Q As in (inaudible) — MR. MUSK: But they say — they always ask me, like, “Do you want to die on Mars?” And I say, “Well, yes, but not on impact.” (Laughter.) Q Star- — Starlink is in 100 countries. This is going to be hard. I feel like I’m interviewing two brothers here. MR. MUSK: You go ahead. Q Starshield, which could be used for national defense. MR. MUSK: Yeah, it is already being used for national defense. Q Then you have a — what is it calle"
