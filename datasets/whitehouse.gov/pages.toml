["https://www.whitehouse.gov/visit"]
title = "Visit The White House – The White House"
description = "Learn how to reserve your White House tour, including steps for booking, requirements, and essential information for a smooth visit."
full_description = "White House Tours Visit The White House President Donald J. Trump and First Lady Melania Trump are delighted to welcome you to tour the White House. Tours can be requested via your Member of Congress (U.S. Representative or U.S. Senator). You may reach your Member of Congress through the United States Capitol Switchboard at 202-224-3121 (TTY: 202-225-1904), or online at www.congress.gov/members. If you are a citizen of a foreign country, please contact your country’s embassy in Washington, D.C. Book a Tour Reserve Your Tour White House tour requests should be made through your Member of Congress, which may be submitted 7 – 90 days in advance of the requested tour date. Tours are generally available 7:30 a.m. to 11:30 a.m. Tuesday through Thursday as well as 7:30 a.m. to 1:30 p.m. Friday through Saturday (excluding Federal holidays or unless otherwise noted). When possible, public tour hours will be extended based on the official White House schedule. All White House tours are free of charge. Tour schedules may change at any time, with little notice, due to inclement weather or scheduling conflicts, even after your tour is confirmed. What is included on the White House tour? Tours of the White House include the public rooms in the East Wing and the Residence, which include the Vermeil Room, the Library, the China Room, the Blue Room, Red Room, Green Room, the State Dining Room, and a view of the White House Kennedy Garden. Secret Service Officers are stationed along the tour route and are available to answer questions about each room’s history, art, furnishings, current uses, and beyond. Find Out More FAQs"
