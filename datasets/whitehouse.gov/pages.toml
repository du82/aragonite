["https://www.whitehouse.gov/articles/2025/03/president-trump-is-securing-our-homeland"]
title = "President Trump is Securing Our Homeland – The White House"
description = "After four years of Biden’s open borders, President Donald J. Trump launched an unprecedented crackdown on the illegal immigrants and deadly drugs allowed"
full_description = "Articles President Trump is Securing Our Homeland March 4, 2025 After four years of Biden’s open borders, President Donald J. Trump launched an unprecedented crackdown on the illegal immigrants and deadly drugs allowed to enter our country to remarkable success — and he didn’t need legislation to do it. In February — President Trump’s first month in office — illegal border crossings fell to the lowest level ever recorded, down 94% from last February and down 96% from the all-time high of the Biden Administration.ICE arrests of illegal immigrants have surged 627%.Would-be illegal border crossers have “given up” and are returning to their own countries in a “reverse flow” across South America.Mexican cartel operatives say they are “genuinely” fearful “for the first time in years” amid the Trump Administration’s crackdown. Migrant shelters across the country — run by organizations that once facilitated the invasion of illegal immigrants — have been forced to shutter because they are no longer necessary. Illegal immigrants removed from the country has topped 50,000 as the Trump Administration continues getting illegal immigrant killers, rapists, and drug dealers off our streets. Mexico announced a deployment of 10,000 troops to the border to combat illegal immigration and fentanyl trafficking, while Canada announced a flurry of measures to combat fentanyl manufacturing and trafficking following President Trump’s imposition of tariffs on the two countries. President Trump secured the extradition of 29 Mexican drug cartel bosses to face charges for their crimes in the United States. The crackdown began on Day One: President Trump ended “catch-and-release,” reversing the dangerous Biden-era policy that released dangerous illegal aliens back into our communities. President Trump shut down the “CBP One” app, which “paroled” more than one million illegal immigrants into the country. President Trump signed the Laken Riley Act into law, which requires illegal immigrants arrested or charged with theft or violence to be detained — honoring the legacy of Laken Riley, a Georgia college student brutally murdered by an illegal alien released into the country. President Trump terminated all taxpayer-funded public benefits for illegal aliens. President Trump re-established the successful “Remain in Mexico” policy. President Trump restarted construction of the border wall. The Trump Administration declared Tren de Aragua, MS-13, the Sinaloa Cartel, the Jalisco New Generation Cartel, the United Cartels, the Gulf Cartel, the Northeast Cartel, and the Michoacán Family as Foreign Terrorist Organizations. U.S. drones have been deployed on missions to locate deadly fentanyl labs in Mexico. President Trump revoked Temporary Protected Status for Haitians as part of his promise to rescind policies that were magnets for illegal immigration. President Trump ordered an end to birthright citizenship. President Trump suspended the U.S. Refugee Admissions Program."
