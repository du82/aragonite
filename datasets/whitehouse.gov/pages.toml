["https://www.whitehouse.gov/about-the-white-house/the-white-house"]
title = "The White House Building"
description = "Every president since John Adams has occupied the White House, and the history of this building extends far beyond the construction of its walls. From the Ground Floor Corridor rooms, transformed from their early use as service areas, to the State Floor rooms, where countless leaders and dignitaries have been entertained, the White House is both the home of the President of the United States and his family, and a living museum of American history. The White House remains a place where history continues to unfold."
full_description = "About The White House The White House BUILDING Our first president, George Washington, selected the site for the White House in 1791. The following year, the cornerstone was laid and a design submitted by Irish-born architect James Hoban was chosen. After eight years of construction, President John Adams and his wife Abigail moved into the still-unfinished residence. During the War of 1812, the British set fire to the President’s House, and James Hoban was appointed to rebuild it. James Monroe moved into the building in 1817, and during his administration, the South Portico was constructed. In 1829, Andrew Jackson oversaw the addition of the North Portico. Various proposals were put forward during the late 19th century to significantly expand the President’s House or to build an entirely new residence, but these plans were never realized. In 1902, President Theodore Roosevelt began a major renovation of the White House, including the relocation of the President’s offices from the Second Floor of the Residence to the newly constructed temporary Executive Office Building (now known as the West Wing). The Roosevelt renovation was planned and carried out by the famous New York architectural firm McKim, Mead and White. Roosevelt’s successor, President William Howard Taft, had the Oval Office constructed within an enlarged office wing. Less than fifty years after the Roosevelt renovation, the White House was already showing signs of serious structural weakness. President Harry S. Truman began a renovation of the building in which everything but the outer walls was dismantled. The reconstruction was overseen by architect Lorenzo Winslow, and in 1952, the Truman family moved back into the White House. Every president since John Adams has occupied the White House, and the history of this building extends far beyond the construction of its walls. From the Ground Floor Corridor rooms, transformed from their early use as service areas, to the State Floor rooms, where countless leaders and dignitaries have been entertained, the White House is both the home of the President of the United States and his family, and a living museum of American history. The White House remains a place where history continues to unfold. There are 132 rooms, 35 bathrooms, and 6 levels in the Residence. There are also 412 doors, 147 windows, 28 fireplaces, 8 staircases, and 3 elevators. The White House kitchen is able to serve dinner to as many as 140 guests and hors d’oeuvres to more than 1,000. The White House requires 570 gallons of paint to cover its outside surface. At various times in history, the White House has been known as the “President’s Palace,” the “President’s House,” and the “Executive Mansion.” President Theodore Roosevelt officially gave the White House its current name in 1901."
year_published = 2025
year_updated = 2025
