["https://www.whitehouse.gov/articles/2025/03/president-trump-is-restoring-common-sense-to-government"]
title = "President Trump is Restoring Common Sense to Government – The White House"
description = "President Donald J. Trump believes government should work for the people — and his historic action has ensured government policies reflect the"
full_description = "Articles President Trump is Restoring Common Sense to Government March 4, 2025 President Donald J. Trump believes government should work for the people — and his historic action has ensured government policies reflect the longstanding values of the Americans it serves. President Trump designated English as the official language of the United States. President Trump declared an end to lower standards in the name of discriminatory “diversity, equity, and inclusion” (DEI) initiatives. The Trump Administration dismissed Biden-era lawsuits against police and fire departments that were portrayed as racist for using writing tests, physical exams, and credit checks in their hiring processes. President Trump ordered an end to the weaponization of the Federal Government against American citizens. The Department of Justice immediately began rooting out politically motivated lawfare that occurred in the Biden Administration. President Trump eliminated discriminatory DEI offices, employees, and practices across the bureaucracy alongside a return to merit-based hiring — including at the Federal Aviation Administration, where the Biden Administration specifically recruited individuals with intellectual disabilities and psychiatric issues. As a result, taxpayer-funded PBS closed its DEI office, Disney dropped two of its DEI programs, Goldman Sachs ended its DEI policy, and Institutional Shareholder Services announced it would no longer consider the gender, racial, or ethnic diversity of company boards when making its voting recommendations. The Federal Communications Commission opened an investigation into discriminatory DEI policies at Comcast, an entity it regulates. President Trump ordered an end to all censorship of Americans by the federal government. President Trump banned COVID-19 vaccine mandates at schools that receive federal funding. President Trump rolled back the Biden-era push to mandate paper straws. President Trump ordered an end to anti-Christian bias in the Federal Government. President Trump ordered an examination of all regulations to assess any infringements on Americans’ Second Amendment rights. President Trump directed full enforcement of the Hyde Amendment, which bars taxpayer dollars from being used to fund or promote elective abortion. President Trump ordered the declassification of documents related to the assassinations of President John F. Kennedy, Jr., Sen. Robert F. Kennedy, and Rev. Dr. Martin Luther King, Jr. President Trump proclaimed February 9, 2025, as “Gulf of America Day” after the Department of the Interior officially established it on its mapping databases. The Department of Transportation terminated the approval for New York City’s burdensome “congestion pricing” scheme."
