["https://www.whitehouse.gov/the-administration/melania-trump"]
title = "First Lady Melania Trump"
description = "First Lady Melania Trump is the wife of the 45th and 47th President of the United States, Donald J. Trump, and the mother to their son, Barron Trump."
full_description = "Administration Melania Trump First Lady OF THE UNITED STATES Melania Trump is the wife of the 45th and 47th President of the United States, Donald J. Trump, and the mother to their son, Barron Trump. She was born in Slovenia on April 26, 1970, and is the second First Lady born outside the United States. At a young age, she began what would soon become a highly successful modeling career, appearing in many high-profile ad campaigns and working with some of the best photographers in the fashion industry. In 1996, Mrs. Trump moved to New York, and 10 years later, she proudly became a United States Citizen, making her the only First Lady to become a naturalized citizen. Mrs. Trump has always been an active member of her community. In 2005, she was the Honorary Chairwoman of the Martha Graham Dance Company. That same year, she was awarded Goodwill Ambassador by the American Red Cross—a role she served for 4 years. Mrs. Trump served 5 years as Honorary Chairwoman for the Boys’ Club of New York and was named Woman of the Year in 2006 by the Police Athletic League. In 2010, Mrs. Trump was the Chairwoman of the American Heart Association. In addition to her philanthropic work and modeling and fashion career, Mrs. Trump is an accomplished businesswoman. In 2010, she launched her own successful jewelry collection, Melania Trump Timepieces and Jewelry. While Melania Trump became a household name, she is, first and foremost, a mother and wife, and in 2017, she made the White House and Washington home for her family. In her role as First Lady from 2017 to 2021, Mrs. Trump focused on the many issues affecting children across the Nation. This passion led to the establishment of BE BEST in 2018; Mrs. Trump’s awareness campaign focused on the well-being of children and highlighted the people and programs dedicated to ensuring a better future for the next generation. Mrs. Trump promoted BE BEST throughout the country and internationally. In addition to BE BEST, Mrs. Trump has a deep appreciation for the military and their families. She traveled to military bases domestically and overseas, including Iraq in 2018, and regularly incorporated military families in public engagements. In her time away from the White House, Mrs. Trump established Fostering the Future, a BE BEST initiative, which provides college-level scholarships to those aging out of the foster care system. The scholarship funds are provided by a portion of the revenue generated from her Web 2 and Web 3 platforms on melaniatrump.com and usamemorabilia.com. Her platforms utilize blockchain technology, marking her as a pioneer within the industry while empowering the next generation of young Americans with the resources needed to excel. Mrs. Trump consistently implements innovative approaches to advance her advocacy for children and the causes she supports, demonstrating a forward-thinking commitment to making a positive impact. In 2024, Mrs. Trump released her memoir, MELANIA, which quickly became #1 on The New York Times best sellers list. Learn more about President Donald J. Trump here."
year_published = 2025
year_updated = 2025
