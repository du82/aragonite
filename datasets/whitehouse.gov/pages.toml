["https://www.whitehouse.gov/the-administration/donald-j-trump"]
title = "President Donald J. Trump"
description = "After a landslide election victory in 2024, President Donald J. Trump is returning to the White House to build upon his previous successes and use his mandate to reject the extremist policies of the radical left while providing tangible quality of life improvements for the American people."
full_description = "Administration Donald J. Trump 45th & 47th President of the United States After a landslide election victory in 2024, President Donald J. Trump is returning to the White House to build upon his previous successes and use his mandate to reject the extremist policies of the radical left while providing tangible quality of life improvements for the American people. This includes putting a stop to endless wars, defending our nation’s borders, and unleashing the potential of the American economy, affording ALL Americans the opportunity to pursue THEIR version of the American dream. In his first administration, President Trump passed record-setting tax cuts and regulation cuts, achieved energy independence, replaced NAFTA with the United-States-Mexico-Canada Agreement, invested $2 trillion to completely rebuild the Military, launched the Space Force, obliterated the ISIS Caliphate, achieved a major breakthrough for peace in the Middle East, passed the most significant Veterans Affairs reforms in half a century, confirmed over 250 federal judges, including 3 Supreme Court Justices, signed bipartisan Criminal Justice Reform, lowered drug prices, protected Medicare and Social Security, and secured our nation’s borders in his first four years in office. This was only the beginning. Donald J. Trump defines the American success story. Throughout his life he has continually set the standards of business and entrepreneurial excellence, especially in real estate, sports, and entertainment. President Trump built on his success in private life when he entered into politics and public service. He remarkably won the Presidency in his first ever run for any political office. He won a second time despite several assassination attempts and the unprecedented weaponization of law fare against him. Time after time President Trump has defied the odds because he fundamentally believes in the exceptionalism of the American spirit and wants to see our great country succeed. A graduate of the University of Pennsylvania’s Wharton School of Finance, President Trump followed in his father’s footsteps into the world of real estate development, making his mark in New York City. There, the Trump name soon became synonymous with the most prestigious of addresses in Manhattan and, subsequently, throughout the world. President Trump is also an accomplished author. He has written more than fourteen bestsellers. His first book, The Art of the Deal, is considered a business classic. President Trump has five children, Barron, Don Jr., Ivanka, Eric, and Tiffany, as well as 10 grandchildren. Learn more about First Lady Melania Trump here."
