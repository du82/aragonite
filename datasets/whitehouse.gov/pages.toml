["https://www.whitehouse.gov/administration/the-cabinet"]
title = "The Cabinet"
description = "Established in Article II, Section 2 of the Constitution, the Cabinet’s role is to advise the President on any subject he may require relating to the duties of each member’s respective office. President Donald J. Trump’s Cabinet includes Vice President J.D. Vance and the heads of the 15 executive departments."
full_description = "Administration The Cabinet Established in Article II, Section 2 of the Constitution, the Cabinet’s role is to advise the President on any subject he may require relating to the duties of each member’s respective office. Meet President Trump’s Cabinet Nominees Administrator of the Environmental Protection Agency, Lee Zeldin Lee Zeldin is a former United States Congressman who represented New York’s First Congressional District from 2015 to 2023. In 2022, Zeldin made national headlines by nearly winning New York’s gubernatorial race, garnering the most votes for a Republican candidate statewide since Nelson Rockefeller over 50 years earlier. His strong performance at the top of the ticket helped Republicans flip multiple suburban House districts in New York, resulting in the Republican Party’s majority in the House of Representatives. Born and raised in Suffolk County, New York, at just 23, Lee Zeldin became the youngest attorney in New York at the time. Zeldin served four years on active duty in the U.S. Army, where he held roles as a Military Intelligence Officer, Prosecutor, and Military Magistrate. In the summer of 2006, Lee Zeldin deployed to Iraq with an infantry battalion of fellow paratroopers from the Army’s elite 82nd Airborne Division in support of Operation Iraqi Freedom. Today, he continues his service as a Lieutenant Colonel in the U.S. Army Reserve, marking over two decades in the military. In 2010, Zeldin was elected to the New York State Senate, where he served until 2014, when he won a seat in Congress. During his eight years in Congress, Zeldin served on the House Foreign Affairs Committee and House Financial Services Committee. As one of two Jewish Republicans in Congress, he co-chaired the House Republican Israel Caucus, which had over 100 members. He was a vocal advocate on foreign policy, border security, military affairs, combating antisemitism, environmental issues, energy policy, and much more. For his district, he championed vast infrastructure and research projects, including the preservation of Plum Island, Army Corps of Engineers initiatives, and a $2 billion Electron-Ion Collider for Brookhaven National Lab. Lee Zeldin currently resides on Long Island, in New York State, with his wife, Diana. Their twin daughters, Mikayla and Arianna, recently left for college, marking an exciting new chapter for their family. Administrator of the Small Business Administration, Kelly Loeffler Kelly Loeffler is an entrepreneur, philanthropist, and former U.S. Senator from Georgia who dedicates her life to growing businesses and advancing economic opportunity for all. A self-made businesswoman, Kelly rose from modest beginnings, working on her family’s farm and small trucking business, to build a three-decade career in financial services and technology. As a member of the executive leadership team at Intercontinental Exchange (NYSE:ICE), she helped build ICE from a small startup to a Fortune 500 company. In 2018, she launched Bakkt (NYSE:BKKT), a fintech startup in digital assets, as its founding CEO. Kelly served in the U.S. Senate in 2020, where she brought her private-sector experience to Washington. She served on key committees including Agriculture, Joint Economic, HELP, and Veterans Affairs – championing conservative values, pro-growth policies, advocating for small businesses, and passing legislation to strengthen economic resilience. As co-owner of the WNBA’s Atlanta Dream for a decade, Senator Loeffler helped position the franchise as a platform to empower women through sports, demonstrating her commitment to community impact. After her Senate service, Kelly founded Greater Georgia Action, an election integrity advocacy and voter registration non-profit, as well as RallyRight, a conservative tech startup – while serving on several corporate and philanthropic boards. She earned a bachelor’s degree from the University of Illinois, an MBA from DePaul University, and is the only CFA® charterholder to ever serve in Congress. A devout Catholic, she is a staunch advocate for free enterprise and opportunity for all Americans through the America First agenda. Attorney General Pam Bondi Pam Bondi is a fourth-generation Floridian from Tampa, Florida who spent more than 18 years as a prosecutor, trying cases ranging from domestic violence to capital murder. In 2010, she ran for Florida Attorney General, becoming the 37th and first female Attorney General in Florida’s history, serving for two consecutive terms from 2011-2019. As Florida’s Attorney General, Pam Bondi remained unwavering in her commitment to make Florida the safest state to live, work, and raise a family. When Attorney General Bondi took office, Florida was referred to as the pill mill capital of the United States. Of the top 100 oxycodone dispensers in the country, 98 of them were in Florida. In her first legislative session, Attorney General Bondi successfully fought for tough legislation to shut down all 98 of these unscrupulous doctors and clinics. She was then appointed Co-chair of the Substance Abuse Committee for the National Association of Attorneys General and to President Trump’s Opioid and Drug Abuse Commission where she worked alongside other national leaders in areas of prevention, interdiction, and treatment. In her commitment to combating human trafficking, Attorney General Bondi spearheaded efforts to strengthen Florida’s state laws, raise public awareness, and provide enhanced resources for victims. Under her leadership, the Florida Legislature created the Florida Statewide Human Trafficking Council. Attorney General Bondi served as Chair of the Council until the conclusion of her tenure as Florida Attorney General. In 2019, Attorney General Bondi joined the White House as Special Advisor to President Trump in the Office of White House Counsel, working on the defense legal team throughout the unprecedented Impeachment Proceedings. Attorney General Bondi also served on the Board of Trustees for the Kennedy Center and as the Chair of the Center for Litigation, Co-Chair of the Center for Law and Justice, and Chair of the Florida Chapter at the America First Policy Institute. Director of the Central Intelligence Agency, John Ratcliffe John Ratcliffe previously served as the Director of National Intelligence from May 2020 until January 2021, making him the first person to ever serve as both Director of the CIA and Director of National Intelligence. As DNI, Director Ratcliffe led a shift in the U.S. Intelligence Community’s priorities to gain a decisive strategic advantage over the People’s Republic of China and provided oversight of numerous operations to remove designated terrorist leaders from the battlefield. Director Ratcliffe also made the historic decision to elevate space to a priority intelligence domain by adding U.S. Space Force as the 18th member of the U.S. Intelligence Community and received the National Security Medal, the nation’s highest honor for distinguished achievement in the field of intelligence and national security. Prior to serving as DNI, Ratcliffe served for over five years as the U.S. Representative for the 4th Congressional District of Texas. As a Congressman, Ratcliffe was a leading policy maker on national security issues as a member of the House Intelligence, Homeland Security and Judiciary committees. His congressional career followed one of public service in the George W. Bush administration as both Chief of Anti-Terrorism and National Security and as the U.S. Attorney for the Eastern District of Texas. Director Ratcliffe earned a bachelor’s degree in government and international studies from the University of Notre Dame and his doctoral degree in law from Southern Methodist University School of Law. Director of National Intelligence, Tulsi Gabbard Lieutenant Colonel Tulsi Gabbard’s life is defined by her unwavering commitment to service and her love of country. From her earliest days in public office to her extensive military career, she has dedicated her life in service to protect the safety, security and freedom of the American people and our nation. The people of Hawaii elected LTC Tulsi Gabbard to the State Legislature when she was 21 years old, to the Honolulu City Council eight years later, and at age 31, to the United States Congress where she served for four terms. Having experienced firsthand the true cost of war, LTC Gabbard vowed to honor the lives and sacrifice of her brothers and sisters in uniform, serving on the Armed Services, Homeland Security, and Foreign Affairs Committees in Congress. A combat veteran with three deployments to the Middle East and Africa as part of a special operations mission to counter terrorism, LTC Gabbard has served in uniform since 2003. She served in a medical unit during her 2005 deployment to Iraq and later led a Military Police platoon in Kuwait, where she was the first woman to receive an award of appreciation from the Kuwaiti military, earning their hard-won respect. She currently serves in the U.S. Army Reserve as Battalion Commander of the 1-354 Regiment in Tulsa, Oklahoma, leading soldiers in Oklahoma, Missouri and Arkansas. LTC Tulsi Gabbard approaches every issue, domestic and foreign, with a focus on ensuring the safety, security, and freedom of the American people. She is honored to be President Trump’s nominee for Director of National Intelligence and is committed to securing the nation, upholding the Constitution and serving the American people. Director of the Office of Management and Budget, Russ Vought Russell Vought has been nominated to serve as the 44ᵗʰ Director of the Office of Management and Budget (OMB). He served as the 42ⁿᵈ Director of OMB for nearly two years, including in an acting capacity. Prior to serving in the Trump Administration, Russ spent 20 years working in Congress and with grassroots and public policy organizations. Most recently, he was the President of the Center for Renewing America. He worked for seven years as Vice President of Heritage Action for America. Prior to that, he worked on Capitol Hill, serving as the Policy Director for the House Republican Conference, as the Executive Director of the Republican Study Committee, and as a legislative assistant for U.S. Senator Phil Gramm. Russ graduated with a BA from Wheaton College in 1998 and a JD from the George Washington University Law School in 2004. Secretary of Agriculture, Brooke Rollins Brooke Leslie Rollins is from Glen Rose, Texas, a small agricultural community in the American heartland. She grew up working summers on her family’s farm in Minnesota, barrel racing, and raising livestock for 4-H and Future Farmers of America. She proudly served as a Texas State FFA Officer and worked for the National FFA Organization. Rollins most recently served as the Founder, President and CEO of the America First Policy Institute. Prior to that, she was Director of the Domestic Policy Council and Assistant to the President for Strategic Initiatives in the last White House under President Donald Trump. In these roles, she helped lead the transformational domestic policy agenda of the Trump Administration, enacting the President’s vision and leading to historic achievements for the American people. Rollins graduated with honors from Texas A&M University with a Bachelor of Science in agricultural development and was the first woman in university history to be elected student-body president. After earning her Juris Doctor with honors at the University of Texas School of Law, she served as Governor Rick Perry’s policy director before building and leading the Texas Public Policy Foundation for fifteen years. Rollins and her husband, Mark, reside in Fort Worth, Texas, with their four children. Secretary of Commerce, Howard Lutnick Howard W. Lutnick has been nominated to serve as the 41st United States Secretary of Commerce. During President Trump’s 2024 election campaign, he was the Co-Chair of the Trump-Vance Transition Team. Before entering public service, Mr. Lutnick was a prominent figure on Wall Street for over three decades, simultaneously serving as Chairman and CEO of Cantor Fitzgerald, L.P. and BGC Group, as well as Executive Chairman of Newmark. He joined Cantor Fitzgerald in 1983 and quickly rose through the ranks, becoming President and CEO at just 29 years old. Tragedy struck on September 11, 2001, when terrorists attacked the World Trade Center and Cantor Fitzgerald lost 658 of its 960 New York-based employees, including Mr. Lutnick’s brother and his best friend. He emerged from these events with an indomitable sense of purpose to rebuild the firm to honor those lost, support their families, and become a beacon of hope for those who remained. In the days after the attacks, Mr. Lutnick launched the Cantor Fitzgerald Relief Fund, which donated $180 million to families of his coworkers who died on 9/11. He has donated more than $100 million to victims of terrorism, natural disasters, and other emergencies around the world. Mr. Lutnick served on the Board of Directors of the National September 11 Memorial & Museum and Weill Cornell Medicine. He was named the Financial Times Person of the Year in 2001 and Ernst & Young’s United States Entrepreneur of the Year in 2010. Howard also received the Department of the Navy’s Distinguished Public Service Award, the highest honor granted to non-military personnel by the Navy. Secretary of Defense, Pete Hegseth An Army combat veteran and advocate for America’s veterans, Hegseth was most recently a co-host of FOX & Friends Weekend on the FOX News Channel. Hegseth was commissioned an infantry officer into the U.S. Army National Guard upon graduation from the ROTC program at Princeton University in 2003. His deployments include Guantanamo Bay, where he served as an infantry platoon leader; Iraq, where he served as an infantry platoon leader in Baghdad and Samarra with the 3rd Brigade of the 101st Airborne Division; and Afghanistan with the Minnesota Army National Guard as part of a NATO Training Mission. Hegseth also served in multiple staff positions in state National Guard units. Hegseth’s military honors include the Army Commendation Medal and Expert Infantryman’s Badge (EIB) for his time in Cuba; the Bronze Star Medal, Combat Infantryman’s Badge (CIB), and a second Army Commendation Medal for his time in Iraq; and a second Bronze Star Medal and a Joint Commendation Medal for his time in Afghanistan. Hegseth has authored five books, including “The War on Warriors” (June 2024), which spent over 10 weeks on the New York Times best-sellers list. Secretary of Education, Linda McMahon Linda McMahon is originally from New Bern, North Carolina, and most recently served as Chair of the Board and Chair of the Center for the American Worker at the America First Policy Institute. McMahon served in President Donald Trump’s Cabinet as Administrator of the Small Business Administration. At SBA, McMahon re-imagined the organization, focusi"
