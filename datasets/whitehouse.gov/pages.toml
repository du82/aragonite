title = "Remarks by President Trump at Republican Governors Association Meeting – The White House"
description = "The National Building Museum Washington, D.C. (February 20, 2025) 7:37 P.M. EST      THE PRESIDENT:  Well, thank you very"
full_description = "Remarks REMARKS BY PRESIDENT TRUMP AT REPUBLICAN GOVERNORS ASSOCIATION MEETING February 20, 2025 The National Building Museum Washington, D.C. (February 20, 2025) 7:37 P.M. EST THE PRESIDENT: Well, thank you very much. (Applause.) That’s such a great song. It’s hard to cut it off, isn’t it? You know? I want to get you home for the hockey game, I guess. And we’ll get this done real quick — quickly. And I want to thank you all. We have so many great friends here. A lot of great governors, a lot of talent. I’m thrilled to be with the Republican governors, and they have done an amazing job, and I look forward to working with each and every one of you as we complete the mission of saving America — they left us a real mess, didn’t they, huh? — and making our country great again. We’re going to do it. We’ve made a lot of progress. We’re given credit for having the best four weeks that anybody has ever had as an opening, so — (applause). Now, a few hundred more weeks like this and we’re going to be in great shape. But we’ve had a lot of fun doing it too. It’s a pleasure to do it. We just ripped down whatever they’ve done. It’s almost like I want to just do one executive order: Anything he signed is now terminated. (Laughter and applause.) It’s easier than, you know, point after point after point. I sign and sign. Just do one: Everything he signed is no good. Because that’s really what, basically, it’s all about. I especially want to thank the chairman of the Republican Governors Association, Brian Kemp, who is fantastic. (Applause.) He was fantastic. We won Georgia by a lot. Where is Brian? We won Georgia by a lot. Where are you, Brian? There you are. And we did a great job together, and I appreciate it. We won’t forget it. Thank you, Brian. As well as Vice Chairman Greg Gianforte, a friend of mine who has done a fantastic job as governor — (applause) — for organizing this beautiful evening. In addition to — hi, Greg. How you doing? Good? You look good. (Laughs.) You look good. In addition to our fantastic governors, we also have Secretaries Doug Burgum and Chris Wright. They are very important. (Applause.) Where are they? Where are they? Doug, you were great on television. Chris. These two guys are going to do it. I tell you, if they get the energy bumping, we’ll get that energy price down, and everything is going to follow. Everything is going to follow, and we’re going to work very, very hard. Here’s a gentleman from Virginia that I recognize that we’ve become — (applause) — we almost won that, didn’t we, huh? We almost won it. We were just a little bit shy, but I want to thank you for the help. We did a great job together. But another man that’s with us is really unbelievable, and you’re going to be working him very closely: RNC Chairman Michael Whatley. (Applause.) And Michael worked with Lara, and the team of him and Lara were pretty unbeatable, I would say. She was great and had the victory, and she’s solid. There was no nepotism either. Nobody said, “Oh, gee.” They said, “How did you get her?” And I said to Michael, “So, who would you like to work with?” “Well, how about Lara again?” But Lara came — right after we won, she said, “Now, Dad, I want to go home to my family.” (Laughs.) She did a great job, and she just wanted to go back home to the family. But what a team that was. We beat them left and right. They tried to cheat, but they — (laughs) how many lawyers did you have? Like, 2,000 lawyers or some crazy number, right? PARTICIPANT: Six thousand five hundred. THE PRESIDENT: Six thousand five hundred lawyers. I would say that’s a lot. And the reason I picked him is because, with North Carolina, in 2020 — we did so great in 2020. But the one that just held steady was him with the 601 lawyers at that time. And I remembered that. And I said, “That’s the guy, because we’re going to win.” But we have to keep them from being really bad, being naughty. They tried. But, you know, we had an expression: We got to make it too big to rig. And that’s what we did. Too big to rig. (Applause.) And it was a great night. And, Michael, thank you. Great — just a fantastic job. You’ll be working with these ladies and gentlemen on just keeping — keeping everything, including keeping governor’s seats, I assume. You’re going to work with them on governor’s seats too, right? But there’s no better man than Michael. Thank you, Michael. Great job. Appreciate it. (Applause.) And we’re gathered tonight at a really exciting time in our nation. I think it’s going to be a very exciting time. We have tremendous potential. I have been called by every company — Brian just told me about a big one that’s going to be moving in in a very big way. But I have been called by so many big companies that they want to beat the tariffs, and there’s only one way to beat the tariffs. Tariffs, one of the most beautiful words I’ve ever heard. In fact, I went around saying it’s my favorite word in the dictionary, and I got killed by the fake news media. They said, “What about God? What about religion? What about love?” I said, “All right. I give up. It’s my fourth favorite word.” (Laughter.) So, now I say God, religion, love, and then tariffs, number four. (Laughter and applause.) And now I’m okay. I can get away with that. I couldn’t get away with making it number one, but it’s close. (Laughter.) The American people gave Republicans a historic mandate in November — you remember that, November 5th — what a day that was, huh? (Applause.) No — there was no games. November 5th, 2024, will go down as one of the most important days in the history of our country. I believe that. We won the House. We won the Senate. We won the White House. And, in the presidential race, we won all seven swing states by a lot, and the popular vote by millions and millions of votes for the first time of any Republican in decades. It’s hard for us to win the popular vote, but it’s not going to be anymore, because we’re a much different Republican Party right now. We’re really — nobody can believe what’s happened to this party. It’s become a big party, really big and powerful party. We won 85 percent of all counties in America. Think of that. Eighty-five percent. Have you seen the map? It’s all red. There’s a little blue on the outside here and — the outside. The whole thing is, like, red. They won 525 counties compared to us — 2,600 counties. Think of that. I don’t know why we only won by millions of votes. We should have won by a lot more than that. Maybe it’s because they cheated. Who knows? And incredibly, all 50 states shifted toward the Republican Party. That’s never happened before. It’s the first time ever in history that that’s happened. All 50 states shifted toward the Republicans — and significantly, in many cases. Most importantly for this room, we’re pleased to welcome eight new Republican governors. Could you stand up please? (Applause.) Just stand up. Look at these people. Oh, I know them. I know the men. Good. Great. I know every one of them. (Applause.) Mike Braun of Indiana. Mike Kehoe of Missouri. Kelly Ayotte of New Hampshire. Larry Rhoden — that’s great — Larry Rhoden of South Dakota. Kelly Armstrong of North Dakota. Patrick Morrisey of West Virginia. Jenniffer González-Colón of Puerto Rico. Nikolao Pula of American Samoa. (Applause.) And I want to congratulate you all. You had great races. You won, generally, pretty easily. We’re going to win a lot of races. You know, in presidential races, they say when you win the presidency, usually the midterms don’t go well. I think we’re going to do great. I think we’re going to really increase our margins by a lot. That’s why I went to Michael. I said, “You got to stay. You can’t go anywhere, Michael.” But I can tell you that I did something very different. Our win was so big and so conclusive presidentially — and we had great help from donors. We have a lot of great donors in the room tonight, but — This is a nice room, by the way. It’s a very nice place. But we did something differently. I said that — to my people that do the fundraising, I said, “Listen, everyone is so happy.” Usually, you wait two or three years to go back to the donors. You know, you let it rest. You let their wallets cool off a little bit. But I did it the next morning after we won. (laughter). I said to Meredith, who may or may not be here — I don’t think she is. Maybe she is. She’s great and — but I said to a whole staff of people — I said, “Call everybody and see if they’ll double up.” Now, we raised a billion six. They raised $2.7 billion, and they’re running short. They can’t raise the final 28. You know, when you lose, it’s very hard to raise money. But when you win, it’s not so hard. I said, “See what you can do. Call everybody and say, ‘Thank you very much. We appreciate it. Would you like to make a contribution?’” (Laughs.) So, this was not a good situation, but they fully understood. They were so happy, they didn’t care. And, Michael, we raised $608 million in three weeks. Can you believe that? Six — so we’ve got that money, and I got to spend it somewhere. And they tell me I’m not allowed to run. I’m not sure. Is that true? I’m not sure. (Laughter.) So, if I can’t spend it on me, I guess that means I’m going to be spending it on some of my friends, right? A lot of my friends who are going to be running. (Applause.) But think of that. We raised $608 million. Isn’t that great? And I think I’ll keep going. I’ll just keep bugging them, bugging them, build it up. But it’s going to be great. I think we’re going to do fantastically. I think the midterms are going to be a big surprise. And it just seems — I don’t know what it is. You go back to the last, I think, eight elections in a row, the midterms haven’t been great for the person that wins the presidency. And I think, so far, we’re very popular. I had an approval rating today of 71 and another one of 69. (Applause.) I have not heard of those numbers before. So, we’re going to fight very hard, because the better I do, the better you do. It makes your races a lot easier if we do well, and we’re going to keep doing well. With the help of everyone here tonight, the golden age of America has officially begun and the golden age of — just this whole thing — the red states — it’s going to be leading the way to making our country richer and safer and stronger than ever before. The red states are going to do good. And the blue states — I don’t know — maybe they’ll totally disappear off that map. You know, they don’t learn, because — you know, like men in women’s sports. I say we’ve become the party of common sense. Men in women’s sports is not a winner for them. But I saw somebody fighting like hell for the fact that a man should partake in women’s sports — a Democrat, a radical left lunatic. And they’re still going at it. And we shouldn’t really fight them too hard until just about a week or two before the election. Just let them go. Don’t convince them not to. You know, I’m always saying, “They haven’t learned.” I don’t want to say that. Don’t say that. Let them keep going. And then about a week before the election, just blast the hell out of them. (Laughter and applause.) It’s like in a race. You know, you hang in there, and then you just go. Because there’s no way — open borders with prisoners coming in. Jails. Some of the worst murderers in the world. We had — one guy killed five people — separately killed five different people. This is not going to be a great person for our county. But we had 11,088 murderers right now. Some of them have been already brought back. And you know, when you think about it, transgender everything. Everybody should be transgender. These are not things that play very well. I would say they’re 7 percent issues for them, and they’re over 90 percent for us. But they keep going. So, don’t tell them they’re wrong. It’s too long. Two years or four years. It’s too long. Let them continue to go and say, “I think it’s a brilliant idea to have open borders, to allow prisons and mental institution people to pour in from all over the world.” Everywhere. They came from everywhere. But about a week before that election, go crazy. Just save up your money and explain we can’t live like this. And they understand it. Every day of my administration will be fighting to help your state succeed and prosper. And together, we’re going to bring back the American dream — something nobody talks about anymore. In our last four weeks, our new administration has accomplished more than most administrations do in four years, and the last administration was a negative. I mean, it was accomplishment — I would say negative 50 percent. There wasn’t any accomplishment. There was de-accomplishment. On day one, I declared a national emergency on our southern border. I sent our military to the border to secure the sovereign territory of the United States of America. We ended catch and release. We began the largest deportation operation in American history, larger even than that of President Dwight D. Eisenhower. You know, he was sort of a moderate guy, but he was very strong on the fact he didn’t want people pouring into our country from all over the world. He was very tough. He had the record. We now have the record. It’s not a record I’m really proud of. You don’t like to do that, but we have no choice. We can’t let it — I mean, they let criminals — many, many criminals — hundreds of thousands, probably millions of criminals. Twenty-one million people, I believe, is the number. And of that, millions of people are hard, stone-cold criminals. In the past four weeks, illegal border crossings have plummeted by nearly 100 percent, and the tiny number of illegals that do make it across are being apprehended and sent right back to their home, where they belong. All countries are taking the illegal aliens back — every single one, even though they said, and strongly, “We’re never taking them back. Don’t even try.” They said that during the Biden administration. It didn’t work. They’re taking them back. They have no choice. They’re taking them back. They know we’re not playing games. (Applause.) You remember Venezuela saying it: “We’re not taking them back. Don’t even waste your time.” They said that to Biden. He said, “Well, they have us over a barrel.” They don’t have us over a barrel. How about BRICS? You know, the BRICS states? There are, like, six of them, and they were trying to destroy our dollar. They were going to say — you know, they wanted to create a new currency. They probably wanted to use the yuan, China. They wanted to use the yuan. And Biden said, “Well, this is a tough situation. There’s not much we can do about that. We can’t help that.” I said, “Oh, we can help it.” So, when I came in, the first thing I said is: Any BRICS state that even mentions the destruction of the dollar will be charged a 150 percent tariff. And we don’t want your goods. We don’t want to partake. (Applause.) And the BRICS state"
