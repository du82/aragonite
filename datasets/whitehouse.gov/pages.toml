title = "What They Are Saying: President Trump’s Masterclass Before Congress – The White House"
description = "Tonight, during his first address to a joint session of Congress in his second term, President Donald J. Trump delivered a powerful, masterful speech"
full_description = "Articles What They Are Saying: President Trump’s Masterclass Before Congress March 5, 2025 Tonight, during his first address to a joint session of Congress in his second term, President Donald J. Trump delivered a powerful, masterful speech highlighting the remarkable accomplishments of his first six weeks in office and charting a course for four years of prosperity. The address received widespread acclaim. 76% of Americans approved of the speech, according to a CBS poll, while a CNN poll showed 69% of Americans had a positive reaction. Praise immediately poured in:Speaker Mike Johnson: “Tonight, President Trump made his triumphant return to Congress to share his bold, optimistic vision for renewing the American Dream.”Sen. Ted Cruz: “This is the fifth State of the Union address I’ve seen Trump give — it was by far his best.”Fox News’s Bret Baier: “The best moment — emotional moment, was DJ, who’s battling cancer. He wanted to be a police officer and during the speech, the president said the Secret Service has made him an agent.”Fox News’s Brit Hume: “If you ever doubted that Donald Trump is the political colossus of our time and our nation, this night and this speech should have put that to rest.”Geraldo Rivera: “Trump was strong, defiant and entertaining.”Clay Travis: “This is the best speech of Donald Trump’s career. Just a phenomenal litany of common sense and rational leadership. Great and heartwarming guests. It’s a grand slam.”Chris Cillizza: “That was a very effective speech. You can hate it or him. But that speech was aimed squarely at issues where the public is with Trump — and filled with made-for-sharing moments. A master image-maker at work (and you can hate him and acknowledge that’s true!)”Riley Gaines: “I am just left feeling inspired and hopeful and there’s so much to look forward to.”Amber Rose: “Donald Trump just gave the greatest presidential speech of all-time.”Reince Priebus: “I thought it was extremely strong. When he talked about… common sense revolution, giving the government back to The People… I thought was really insightful.”Breitbart’s Matthew Boyle: “This speech is one of Trump’s best ever, and the Democrat behavior during it has been not only despicable but also colossally politically stupid. Whoever is advising these idiots just steered their party into an even deeper ditch than Joe Biden and Kamala Harris left them in.”Pennsylvania resident: “I thought it was very positive… We used to be a country that would just let everything happen… I think now, we’re taking back things that should’ve never been given away. So, I think doing those tariffs… it’s well overdue.”Secretary of State Marco Rubio: “An inspiring and momentous speech. @POTUS returned to the White House with a clear mandate from the American people to renew the American Dream. His address tonight laid out exactly how he is keeping those promises with a vision of peace through strength, and a stronger, safer, and more prosperous United States.”Secretary of Homeland Security Kristi Noem: “Tonight, President Trump laid out his vision to renew the American dream. In just a few short weeks, President Trump’s immigration and border security policies have led to an all-time-low in illegal crossings at the southern border. The message is clear: America’s borders are closed to lawbreakers.”Secretary of the Treasury Scott Bessent: “Strength. Prosperity. Peace. Tonight, President Trump shared his historic vision for our nation in renewing the American dream. He has done more in the past six weeks for the American people, than the previous administration in four years.”Secretary of the Interior Doug Burgum: “The previous administration used a whole-of-government approach to oppose reliable, affordable U.S. energy production in favor of unreliable, unaffordable intermittent sources. The Trump administration is working overtime to undo all the damage done during the Biden years and we are fast-tracking America’s path to a New Golden Age through Energy Dominance!”Secretary of Defense Pete Hegseth: “Thank you @POTUS it is the honor of my life to serve the American warfighter.”Secretary of Agriculture Brooke Rollins: “@POTUS spoke loud and clear on American agriculture. He loves America’s farmers, and they have no more faithful friend nor more powerful champion. He will defend them, and if anyone doubted it — they don’t after tonight.”Secretary of Energy Chris Wright: “President Trump is renewing the American Dream, and we here @Energy are with him every step of the way to unleash American energy dominance!”UN Ambassador-designate Elise Stefanik: “In just one month under President Trump, Americans have experienced record results and the renewal of the American Dream with the triumphant return of strong leadership to the Oval Office. From securing the border, to cutting wasteful spending of our hard earned taxpayer dollars, to reasserting America First peace through strength leadership to the world stage, President Trump has delivered the most exceptional first month of an American presidency in history. Promises made, promises kept. The American Golden Age is here.”Secretary of Housing and Urban Development Scott Turner: “The American people sent President Trump to enact generational change in Washington. What @POTUS has accomplished in less than two months is nothing short of remarkable. This is what America first feels like.”Small Business Administration Administrator Kelly Loeffler: “This was a tour de force of a President who, in 42 days, has more accomplishments than Joe Biden had in four years — It is a new day in America and people at home had to have loved what they’ve seen from this great President.”Secretary of Education Linda McMahon: “Tremendous address by President Trump tonight. America is back, & the work is only beginning. I will work hard to make @POTUS’ vision for education a reality — preparing our students for the workforce & empowering their parents will be vital to our nation’s future success.”EPA Administrator Lee Zeldin: “This vision of President Trump will usher in the greatest four years in American history. Honored to be a part of this amazing Cabinet working hard to restore our nation to glory. Will continue to do my part @EPA to Power the Great American Comeback.”Sen. Bernie Moreno: “An inspiring, emotional address from @realDonaldTrump!! But crazed partisan Dems refused to applaud even a brave young man like DJ. Appalling!”Sen. Rick Scott: “Under President Trump’s strong leadership, our allies respect us, our adversaries fear us, and the world respects us again!”Sen. Marsha Blackburn: “What a great night! President Trump gave a fantastic address and laid out the many accomplishments he and his administration have made during these first six weeks back in office for the American people.”Sen. Markwayne Mullin: “@POTUS commanded the podium for TWO hours. He’s restoring the American Dream with relentless determination. “The Golden Age of America has only just begun.”Sen. John Cornyn: “One of the best lines from President Trump tonight during his state of the union speech: to secure the border we didn’t need any new laws, what we needed was a new president! Amen.”Sen. Shelley Moore Capito: “@POTUS delivered a strong vision for our country—one that prioritizes border security, unleashing American energy, strengthening our military, and providing tax relief for families.”Sen. Ted Budd: “Tonight was about promises made, promises kept.”Sen. Jim Risch: “Excellent speech, Mr. President! I am proud to work with my Republican colleagues to support President Trump’s renewal of the American Dream. @POTUS is the strong leader America needs!”Sen. Pete Ricketts: “It’s time to get our economy back on track. Under @POTUS’ first administration, America’s economy was strong. Tonight, we heard him commit to restoring prosperity and supporting American families. Relief is on its way—and not a minute too soon.”Sen. Chuck Grassley: “Pres Trump delivered a strong state of the union address He’s working w Congress to make America safer + stronger + restore common sense in govt After an impactful start to his presidency there’s a lot more work 2do”Sen. Jon Husted: “Tonight, the president outlined what he’s doing to make our country secure, strong, and prosperous.”Sen. Katie Britt: “Tonight @POTUS made it clear: We’re putting Americans first—securing our nation, making streets safe, growing our prosperity, and unleashing our energy potential.”Sen. Lindsey Graham: “My take on President @realDonaldTrump’s address tonight: Inspiring, funny, compelling and the Democrats’ worst nightmare.”Chairwoman Lisa McClain: “President Trump’s message to the American people is clear: America is BACK.”Rep. Claudia Tenney: “This was one of the most tremendous experiences of my life. Donald Trump hit it out of the park.”Rep. Brandon Gill: “Help is here. Hope is here. President Trump is here.”Rep. Mark Alford: “What a speech and what a time to be in America.”Rep. Stephanie Bice: “President Trump’s speech was a testament to the vision of the American people which was suppressed under President Biden.”Rep. Gary Palmer: “President Trump’s speech tonight was the embodiment of ‘promises made, promises kept.’”Rep. Troy Downing: “What a speech. It’s never been so clear that a new golden age is upon us. From securing our border, to unleashing American energy, to rooting out waste, fraud, and abuse, @POTUS is delivering on the promises that he ran on. A great night to be an American!”Rep. Anna Paulina Luna: “Tonight was historic. President Trump said he was saved by God to Make America Great Again- and THAT is our mandate.”Rep. Nancy Mace: “Best speech ever.”Rep. Jim Jordan: “Incredible speech by President Trump! Confident. Empowering. Leadership.”Rep. Blake Moore: “It was an honor to attend President Trump’s Joint Session tonight. He and his administration have swiftly responded to the call of Americans to secure our border, unleash domestic energy production, address rampant crime, tackle the difficult task to root out waste, fraud, and abuse in our government, and more. There is much to do legislatively in the coming months to ensure a strong economy and defense, and I look forward to working with the Trump administration to accomplish this agenda.”Rep. Mike Kennedy: “President Trump has emerged as the leader the United States needs right now. I look forward to working alongside him to advance our nation’s prosperity.”Rep. Victoria Spartz: “Great speech by President Trump! The State of the Union is strong!”Rep. Julia Letlow: “President Trump delivered a strong message emphasizing the promises he is keeping to secure our border, increase energy production, fix the Biden economy, and reassert American leadership.”Rep. Dan Meuser: “Tonight, President Trump reaffirmed his commitment to the Renewal of the American Dream and made clear that Promises Made, Promises Kept is not just a slogan—it’s a reality.”Rep. Ron Estes: “It was great to welcome President Trump back to Congress and I look forward to continuing to work with him to advance the America First policy agenda that will restore our nation.”Rep. Mike Flood: “President @realDonaldTrump’s speech to Congress was a celebration of America and the renewal our country is experiencing.”Rep. Sam Graves: “The Golden Age of America has ARRIVED. Thank you, President Trump!”Rep. Beth Van Duyne: “In just six weeks, President Trump has made incredible progress for America: the most secure borders in our lifetime without any new money or legislation; through DOGE, he has exposed the massive fraud and money laundering of billions of dollars in the federal government; brought in more manufacturing investments (Apple, TSMC, Honda) than the entire Biden presidency; and he is working with Congress to deliver long term reforms to lower costs and expand opportunities for our hard working families.”Rep. Brad Finstad: “Tonight, @POTUS made clear he is putting the American people first. Since taking office, he has begun reining in an oversized, inefficient government, brought safety and security back to our communities, and restored common sense to the @WhiteHouse.”Rep. Rudy Yakym: “America is back! I look forward to working with President Trump to continue delivering for Hoosiers and all Americans.”Rep. Ben Cline: “President Trump just delivered a bold, positive vision to secure our border, revive our economy, and restore American strength. Leadership is back, our enemies are on notice, and we’re making America great again.”Rep. Doug LaMalfa: “Tonight, President Trump delivered a strong and optimistic message about the renewal of the American Dream. He highlighted the progress made in rebuilding our economy, securing our border, and restoring America’s leadership on the world stage.”Rep. Dale Strong: “President Trump is delivering on his promises. He has secured our borders and is working to revitalize our economy. The United States is seen as a symbol of strength across the globe once again, and tonight’s address proves that this administration is ready and willing to help hardworking American families.”"
