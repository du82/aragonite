["https://www.whitehouse.gov/remarks/2025/02/press-briefing-by-press-secretary-karoline-leavitt-deputy-chief-of-staff-stephen-miller-national-economic-council-director-kevin-hassett-and-national-security-advisor-mike-waltz"]
title = "Press Briefing by Press Secretary Karoline Leavitt, Deputy Chief of Staff Stephen Miller, National Economic Council Director Kevin Hassett, and National Security Advisor Mike Waltz – The White House"
description = "1:05 P.M. EST      MS. LEAVITT:  Hello.  Good afternoon, everybody.  I brought some heavy hitters in here with me today.  Today marks one month of"
full_description = "Remarks PRESS BRIEFING BY PRESS SECRETARY KAROLINE LEAVITT, DEPUTY CHIEF OF STAFF STEPHEN MILLER, NATIONAL ECONOMIC COUNCIL DIRECTOR KEVIN HASSETT, AND NATIONAL SECURITY ADVISOR MIKE WALTZ February 20, 2025 1:05 P.M. EST MS. LEAVITT: Hello. Good afternoon, everybody. I brought some heavy hitters in here with me today. Today marks one month of President Trump’s return to the Oval Office, and there is no denying this administration is off to a historic start. The President has already signed 73 executive orders. That is more than double the number signed by Joe Biden and more than quadruple the number signed by Barack Obama over the same period. These executive orders have ended burdensome regulations; sealed the border; unleashed our domestic energy sector; eliminated divisive DEI from our federal government; stopped the weaponization of government; cut waste, fraud, and abuse; reinstituted “America First” trade and foreign policies; and ultimately restored common sense. The President also signed the Laken Riley Act into law, which ensures ICE will detain illegal aliens arrested or charged with theft or violence. As of today, the Senate has already confirmed 18 Cabinet-level nominees, which is more than at this point under the Obama administration in 2009 and more than double the pace of the Biden administration in 2021. And today, we expect Kash Patel to be confirmed as the next director of the FBI. We are proud to announce that the president will host his first official Cabinet meeting here at the White House next Wednesday, February 26th. In just four weeks, President Trump has already hosted the leaders of Israel, Japan, Jordan, and India. And next Monday, the President will host France’s President, Emmanuel Macron, and on Thursday, the UK Prime Minister, Keir Starmer, will visit the White House as well. As you all know, over the past month, the President has taken questions from the press — all of you — nearly every single day, sometimes on multiple different occasions in the same day, on any topic any of you wish to talk about. President Trump set the tone on this approach immediately when he took more than 12 times the questions in his first few hours in office as Joe Biden did in his entire first week. Yesterday, we hosted a local media row here at the White House with television and radio stations from across the country that reached up to 60 million viewers and listeners. In our ongoing pursuit of transparency, on this one-month celebration, I am thrilled to bring three of my colleagues and our policy experts here at the White House to further recap this incredible first month of accomplishments in greater detail. We have Deputy Chief of Staff for Policy and Homeland Security Advisor Stephen Miller; the Director of the National Economic Council, Kevin Hassett; and our National Security Advisor, Mike Waltz. I will hand it over to them. They will deliver brief remarks on the accomplishments of this administration in the first month, and then we will open it up to Q and A. When we open up the Q and A portion, I do ask, for the sake of efficiency in this room, that you direct your question to the principal you seek an answer from. And I will call on you in this room. But first I will let them roll through their remarks. And first up, I’ll turn it over to Stephen Miller. MR. MILLER: Thank you. It’s great to be back. And I want to just thank you all for joining today our one-month celebration of the most historic opening to a presidency in American history. No president comes close to what Donald Trump has achieved over just the last 30 days. He has packed eight years of transformative action restoring this nation, restoring our laws, restoring fairness, restoring economic opportunity, restoring national security in just one month. No one in this country has ever seen anything like it. And when you look at the consequentiality and the significance and the transformative nature of the actions he’s taking, it truly defies description. For example, in just one area, this nation has been plagued and crippled by illegal discrimination: diversity, equity, and inclusion policies. It strangled our economy. It has undermined public safety. It has made every aspect of life more difficult, more painful, and less safe. He has ended all DEI across the federal government. He has terminated all federal workers involved in promulgating these unlawful policies. He has ended diversity, equity, and inclusion in all federal contracting. He has restored merit as the cornerstone of all federal policy; restored the full, fair, impartial enforcement of our federal civil rights laws for the first time in generations; and he has cracked down on individuals across this government and nonprofits who have engaged in illegal racial discrimination against the American people. This includes making clear to every educational institution in this country that ending diversity, equity, and inclusion, ending unlawful race discrimination is a precondition of receiving federal funds. He has also saved women’s sports by ending the participation of men in women’s sports. He has ended radical gender ideology across the entire federal government, and he’s pressured the private sector to also end and combat radical gender ideology. He’s reestablished the scientific and biological truth that there are only two sexes in this country — male and female — that those are biologically based determinations. They are not based and can never be based on gender identity. That includes rooting out of the Department of Defense all DEI policies, all critical race theory, all gender madness, and once again having a military that is focused solely and exclusively on readiness, preparedness, and lethality. As I’m sure Kevin will talk about more, of course, he has undertaken a historic cost-cutting effort across the federal government, launching the first-ever Department of Government Efficiency, uncovering corruption on a scale that we never thought imaginable, terminating every single federal worker that we — that we have found to be engaged in the corruption and theft and the waste of taxpayer dollars, and already saving $50 billion in a single year, which over a 10-year period would be $500 billion. Just think about how vast and enormous that sum is. Of course, as you all know, he has renamed the Gulf of Mexico to its correct and proper name: the Gulf of America. He has renamed Mount Denali into Mount McKinley, part of a historic effort to restore patriotism and national pride all across this land. He has ended the weaponization of the federal government, restored the Department of Justice to its true mission of combating threats to this nation and keeping the American people safe. He has ended all federal censorship of free speech. This has been one of the greatest crises that has plagued this nation. Years and years and years, the federal government violating the First Amendment to take away Americans’ right of free speech — President Trump has ended that. And he has demanded that all federal workers, all law enforcement cease any effort to intimidate the rights of Americans or to police their speech. He has also restored the death penalty at the Department of Justice, including for illegal aliens who commit murder, including for those who murder cops, and including for all of those who threaten Americans with heinous acts of violence. The death penalty is back. Law and order is back. The streets are being made safe once again. On the public health front, he has launched the nation’s first-ever commission — the MAHA Commission — Make America Healthy Again, following the historic confirmation of RFK Jr., to finally uncover the true root causes of the public health crisis in this country, the childhood disease epidemic in this country, the spiraling rates of pediatric cancer and devastating childhood sickness. He has finally created a situation where the federal heal- — health agencies in this country will be focused on preventing disease, on keeping children from getting sick in the first place, not sentencing them to a lifetime in and out of hospitals, suffering needlessly, when we can find ways to prevent this epidemic of illness. Then, of course, on homeland security. Today, it is officially the law of the land at the conclusion of the congressional notification process that six Mexican cartels and two transnational gangs — Tren de Aragua, or TDA, and MS-13 — so eight organizations in total — are now formally designated as foreign terrorist organizations, which means that every single member of those organizations who operates on U.S. soil is now, as a legal matter, a terrorist, and they will be treated as terrorists. This is a sea change in U.S. policy. And this means the Department of Justice and the Department of Homeland Security, along with the rest of U.S. law enforcement and the Department of Defense, are now operating in a legal reality where these cartels are recognized as terrorists, and there will be a whole-of-government effort to remove these terrorists from our soil and to degrade their ability to threaten or undermine any American security or sovereignty interests. Border crossings since the day he took office are down 95 percent. I think it’s almost impossible to even describe the scale and scope of that achievement. President Trump, within days of taking office, cut border crossings 95 percent. And those few who have dared to cross are being either prosecuted or deported. They’re either facing significant jail time for trafficking, smuggling, harboring, aiding, impeding, or they’re being immediately removed from our soil. Either way, at the end of the process, they are going home. He has reimplemented Remain in Mexico, and he has obtained historic cooperation from foreign countries all around the world in accepting their deportees back. And he has used the United States military to fully seal the southern border with a historic deployment of both active duty and National Guard troops, resumed the building of infrastructure. He has opened up Guantanamo Bay, and he’s using military aircraft to carry out deportations all across this country. And ICE is joining with ATF, DEA, and FBI to carry out the largest deportation operation in American history. The criminals are going home. The border is sealed shut. America is safe, sovereign, proud, and free. We are a nation that everyone in the world understands all across this planet: You do not come here illegally. You will not get in. You will go to jail. You will go home. You will not succeed. This is the biggest and most successful change in any area of law enforcement that this nation has ever seen, and he did it in under one month. Thank you. MR. HASSETT: Should I go? MS. LEAVITT: Yes, yes. MR. HASSETT: Well, thank you, Karoline. Thank you, Stephen. You know, one of the things that President Trump cares most about is job creation. And it was about seven years ago I had the honor of joining you in this room for the first time, and it looks like we’ve created a lot more jobs in the last month. Look at how many people are here. I — my estimate is about 180 but — but I didn’t count. So, thank you. It’s really an honor to be back here. I think that I just want to go over a few things and then hand it off to Mike. The first thing is that the President has told us to prioritize fighting inflation, and he had to do that because, as you know, President Biden let inflation get completely out of control. And he did it with policies that made no sense. They made no sense. You know, a lot of times, you people say to us — our friends, the journalists — you know, “Why are you doing that?” But — but, you know, I like to think, “Why did they do that? Why did they spend so much money and then — why did the Fed print so much money so that we had inflation as high as we’ve ever seen since Jimmy Carter? So, why did they do that?” So, we’re addressing inflation. We didn’t have to address it in the first term, because it was always in the 1s, almost always. But we’re going to get it back there. And how are we doing it? Well, we’re doing it with a plan that President Trump and I and others have talked about in the Oval that involves, like, every level of fighting inflation. First, the macroeconomic level. We’re cutting spending. We’re cutting spending in negotiations with people on the Hill. We’re cutting spending with the advice of our IT consultant, Elon Musk. And then we’re also looking into supply-side things, like restoring Trump’s tax cuts, maybe even expensing new factories so that there is an explosion of supply. If you have an explosion of supply and a reduction in government demand, then inflation goes way down. And then, one of the things that you want to say is “Well, when are you going to see it?” Well, the first thing that you’ll see when the markets believe that we’re going to get inflation under control is that the 10-year Treasury rate goes down, because that’s how they think about future expected inflation. And so, we’re still going to see some memory of Biden’s inflation. It’s not going to go away in a month. But the 10-year Treasury before the last Consumer Price Index had dropped about 40 basis points. Forty basis points because markets were optimistic about our ability to fight inflation. Forty basis points is kind of not a fun thing to say. I — economists talk that way. I apologize. But the way to think about it is, for a typical mortgage, if that affects the mortgage rate, then it’s going to save a typical family buying a house about a thousand bucks a year, and that’s just in our first month. Okay. The second thing we’ve done is we’ve had a lot of trade talks. In fact, I was just meeting a minister from Mexico with Howard Lutnick just a couple of hours ago. And we’re talking about reciprocal trade, and we’re also talking about the fentanyl crisis. And so, reciprocal trade is about our government treating other governments the way they treat us. We want trade to be fair. It turns out that Americans have been disadvantaged by foreign governments over and over, and President Trump wants it to stop. And the fact that struck me as most noticeable, when I started to look at what President Trump was asking us to do, is that last year — last year — we have data — U.S. companies paid $370 billion in taxes to foreign governments — $370 billion. Last year, foreign multinationals paid us $57 billion in taxes. We have one quarter of world GDP. They have three quarters of world GDP. And we’re paying $370. They’re paying $57. This is not reciprocal. We’re going to try — or we’re going to fix it. The other thing that we’ve done is we’ve had an all-of-the-above energy approach that’s led by Doug Burgum and Chris and a really large team — EPA — and we’ve already made so many actions that are going to affect the price of energy and lower inflation. We’ve opened up 625 million acres to energy exploration. We’ve cut 50"
