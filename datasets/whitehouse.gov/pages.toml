title = "Adjusting Imports of Steel into The United States – The White House"
description = "BY THE PRESIDENT OF THE UNITED STATES OF AMERICA A PROCLAMATION 1. On January 11, 2018, the Secretary of Commerce (Secretary) transmitted to me a"
full_description = "Presidential Actions Adjusting Imports of Steel into The United States February 10, 2025 BY THE PRESIDENT OF THE UNITED STATES OF AMERICA A PROCLAMATION 1. On January 11, 2018, the Secretary of Commerce (Secretary) transmitted to me a report on the Secretary’s investigation into the effect of imports of steel mill articles (steel articles) on the national security of the United States under section 232 of the Trade Expansion Act of 1962, as amended (19 U.S.C. 1862) (section 232). The Secretary found and advised me of his opinion that steel articles are being imported into the United States in such quantities and under such circumstances as to threaten to impair the national security of the United States. 2. In Proclamation 9705 of March 8, 2018 (Adjusting Imports of Steel Into the United States), I concurred in the Secretary’s finding that steel articles, as defined in clause 1 of Proclamation 9705 (as amended by clause 8 of Proclamation 9711 of March 22, 2018 (Adjusting Imports of Steel Into the United States)), are being imported into the United States in such quantities and under such circumstances as to threaten to impair the national security of the United States, and decided to adjust the imports of steel articles by imposing a 25 percent ad valorem tariff on such articles imported from most countries. Proclamation 9705 further stated that any country with which the United States has a security relationship is welcome to discuss alternative ways to address the threatened impairment of the national security caused by imports from that country, and noted that, should the United States and that country arrive at a satisfactory alternative means to address the threat to the national security such that the President determines that imports from that country no longer threaten to impair the national security, I may remove or modify the restriction on steel articles imports from that country and, if necessary, adjust the tariff as it applies to other countries, as the national security interests of the United States require. 3. In Proclamation 9705, I also directed the Secretary to monitor imports of steel articles and inform me of any circumstances that in the Secretary‘s opinion might indicate the need for further action under Section 232, as amended, with respect to such imports. Pursuant to Proclamation 9705, the Secretary was authorized to provide relief from the additional duties, based on a request from a directly affected party located in the United States, for any steel article determined not to be produced in the United States in a sufficient and reasonably available amount or of a satisfactory quality, or based upon specific national security considerations. In subsequent proclamations, I noted the conclusion of discussions or the agreement on certain measures with the Argentine Republic (Argentina), Proclamation 9759 of May 31, 2018 (Adjusting Imports of Steel Into the United States); the Commonwealth of Australia (Australia), Proclamation 9759; the Federative Republic of Brazil (Brazil), Proclamation 9759; Proclamation 10064 of August 28, 2020 (Adjusting Imports of Steel Into the United States); Canada, Proclamation 9894 of May 19, 2019 (Adjusting Imports of Steel Into the United States; the United Mexican States (Mexico), Proclamation 9894; and the Republic of Korea (South Korea), Proclamation 9740 of April 30, 2018 (Adjusting Imports of Steel Into the United States). President Biden noted the conclusion of discussions or the agreement on certain measures with the European Union (EU) on behalf of its member countries, Proclamation 10328 of December 27, 2021 (Adjusting Imports of Steel Into the United States); Proclamation 10691 of December 28, 2023 (Adjusting Imports of Steel Into the United States); Japan, Proclamation 10356 of March 31, 2022 (Adjusting Imports of Steel Into the United States); and the United Kingdom (UK), Proclamation 10406 of May 31, 2022 (Adjusting Imports of Steel Into the United States), on alternative ways to address the threat to the national security. In addition, then-President Biden acknowledged the close relationship with Ukraine and exempted steel articles from Ukraine from the tariff. Proclamation 10403 of May 27, 2022 (Adjusting Imports of Steel Into the United States); Proclamation 10588 of May 31, 2023 (Adjusting Imports of Steel Into the United States); Proclamation 10771 of May 31, 2024 (Adjusting Imports of Steel Into the United States). In Proclamation 10783 of July 10, 2024 (Adjusting Imports of Steel Into the United States), President Biden noted that imports of steel articles from Mexico had increased significantly as compared to their levels at the time of Proclamation 9894. Accordingly, he implemented a melt and pour requirement for imports of steel articles that are products of Mexico and increased the section 232 duty rate for imports of steel articles and derivative steel articles that are products of Mexico that are melted and poured in a country other than Mexico, Canada, or the United States. 4. The Secretary has informed me that the initial 25 percent ad valorem tariff imposed by Proclamation 9705 has been an effective means of reducing imports, encouraging investment and expansion of production by domestic steel producers, and mitigating the threatened impairment of U.S. national security. Following the initial imposition of 25 percent ad valorem tariffs, the U.S. steel capacity utilization rate increased to above 80 percent. 5. The Secretary has also informed me that, notwithstanding the impact of the tariff imposed by Proclamation 9705, imports of steel articles from certain countries exempted from the tariff or subject to alternative agreements have increased significantly, while excess capacity in the global steel industry has begun to increase again in recent years. For example, imports from Canada increased 18 percent since Canada was excluded from the section 232 tariffs. According to the Organization for Economic Cooperation and Development (OECD), global steel excess capacity is projected to reach approximately 630 million metric tons by 2026, more than total steel production in all OECD countries. At the same time, exports of steel from the People’s Republic of China (China) have recently surged, exceeding 114 million metric tons through November 2024 while displacing production in other countries and forcing them to export greater volumes of steel articles and derivative steel articles to the United States. 6. Total steel imports as a share of U.S. consumption increased significantly in 2024, reaching nearly 30 percent, similar to the import share of U.S. consumption at the time the Secretary issued his January 11, 2018, report. Imports from countries with which the United States has reached alternative agreements have increased significantly as a share of total imports, from 74 percent in 2018 to 82 percent in 2024, while imports from countries subject to quantitative restrictions remain elevated regardless of changing U.S. demand conditions and the substantial investments made to expand the capabilities of the domestic industry. Increasing and persistently high import volumes from countries exempted from the duties or subject to other alternative agreements like quotas and tariff-rate quotas have captured the benefit of U.S. demand at the domestic industry’s expense and transmitted harmful effects onto the domestic industry. As steel import market share has increased, the domestic industry’s performance has been depressed, resulting in capacity utilization rates persistently lower than the 80 percent target level highlighted in the Secretary’s report. 7. The Secretary has informed me that imports of steel articles from Canada and Mexico have increased significantly to levels that once again threaten to impair U.S. national security. Volumes from both Canada and Mexico increased overall, from 7.77 million metric tons in 2020 to 9.14 million metric tons in 2024. Imports have also surged in excess of historical norms of trade across numerous key product lines, such as long reinforcing bars, which have experienced import increases of 1,678 percent from Mexico and 564 percent from Canada. These surges have occurred while authorities in those countries have supported otherwise uncompetitive producers with subsidies and other interventions that have exacerbated the global excess capacity crisis. In addition, increasing import volumes and including Mexico’s imports from China, support a conclusion that there is transshipment or further processing of steel mill articles from countries that remain subject to the additional ad valorem tariff proclaimed in Proclamation 9705, or from countries seeking to evade quantitative restrictions. 8. The Secretary has also informed me that alternative agreements with trading partners including Australia, the members of the EU, Japan, and the United Kingdom have been less effective in eliminating the threatened impairment of U.S. national security than the additional ad valorem tariff proclaimed in Proclamation 9705. As a result, imports of steel articles from these countries have increased as a share of total U.S. steel imports from 18.6 percent in 2020 to 20.7 percent in 2024. In addition, from 2022 to 2024, imports from countries subject to quotas (Argentina, Brazil, and South Korea) increased by approximately 1.5 million metric tons, even as U.S. demand declined by more than 6.1 million tons during the period. Argentina has continued to export steel to the United States at unsustainable quantities, especially a recent surge of semifinished products. Furthermore, Argentina’s lack of data transparency has continued to be of concern for the United States. From official trade statistics released by Argentina, it is difficult to assess the levels of steel being imported from places like China and Russia, and other potential sources of excess capacity. Brazilian imports from countries with meaningful levels of overcapacity, specifically China have grown tremendously in recent years, more than tripling since the institution of this quota arrangement. 9. At the same time, these alternative agreements have not resulted in sufficient action by these trading partners to address non-market excess capacity caused primarily by China, or sufficient cooperation by these trading partners on issues like trade remedies and customs matters or monitoring bilateral steel trade. Some countries have also welcomed steel industry investments from non-market producers in countries like China seeking to exploit the agreements to obtain preferential access to the U.S. market. The agreements have therefore been detrimental to U.S. steel production and national security. 10. The Secretary has informed me of similar problems with respect to the temporary exemption for imports of steel articles and derivative steel articles from Ukraine. Rather than supporting the Ukrainian steel industry and alleviating the economic harm caused by the ongoing conflict, the benefits of this temporary exemption have accrued primarily to producers in EU member countries, which have significantly increased duty-free exports to the U.S. market of steel articles processed from Ukrainian semi-finished steel. Since 2021, imports from Ukraine have remained steady at 0.5 percent of total U.S. imports, while imports from the European Union have increased 11.2 percent to 14.8 percent. As a result of the temporary exemption, these imports enter the U.S. market subject to neither the ad valorem tariff proclaimed in Proclamation 9705, nor the tariff-rate-quota system applicable to other imports of steel articles from EU producers as proclaimed in Proclamation 10328. This has facilitated evasion of both the section 232 measures and of antidumping duties that would be paid if the finished products were imported directly from Ukraine. 11. The Secretary has informed me that producers in countries that remain subject to the program have continued to evade the measures by processing covered steel articles into additional downstream steel derivative products that were not included in the additional ad valorem tariffs proclaimed in Proclamation 9705 and Proclamation 9980 of January 24, 2020 (Adjusting Imports of Derivative Aluminum Articles and Derivative Steel Articles Into the United States). Imports of products such as fabricated structural steel, prestressed concrete strand, and others, have increased significantly since the issuance of Proclamation 9705 and Proclamation 9980, eroding the domestic industry’s customer base and resulting in depressed demand for steel articles produced in the United States. 12. The Secretary has also informed me of certain ongoing challenges with the product exclusion process authorized by Proclamation 9705, Proclamation 9777 of August 29, 2018 (Adjusting Imports of Steel Into the United States), and Proclamation 9980 and implemented by subsequent regulations. This process has resulted in exclusions for a significant volume of imports, in a manner that undermines the purpose of the section 232 measures and threatens to impair national security. Certain general approved exclusions remain in effect for entire tariff lines of steel articles, notwithstanding the domestic industry’s potential to produce many excluded products. 13. I determine that these developments and modifications to the tariffs announced in Proclamation 9705 have undermined the program’s national security objectives by preventing the domestic steel industry from achieving sustained production capacity utilization of at least 80 percent, as determined necessary in the Secretary’s report of January 11, 2018. I also determine that they have failed to achieve their articulated objectives. As a result, I determine that they have resulted in significantly increasing imports of steel articles that threaten to impair the national security. 14. In light of the Secretary’s findings regarding the alternative agreements with South Korea proclaimed in Proclamation 9740; Argentina, Australia, and Brazil proclaimed in Proclamation 9759; Canada and Mexico proclaimed in Proclamation 9894; EU countries proclaimed in Proclamation 10328; Japan proclaimed in Proclamation 10356; and the United Kingdom proclaimed in Proclamation 10406, I have revisited the determinations in these proclamations. In my judgment, the arrangements with these countries have failed to provide effective, long-term alternative means to address these countries’ contribution to the threatened impairment to the national security by restraining steel articles exports to the United States from each of them, limiting transshipment and surges and distorted pricing, and discouraging excess steel capacity and excess steel production. Thus, I have determined that steel articles imports from these countries threaten to impair the national security, and I have decided that it is necessary to terminate these arrangements as of March 12,"
