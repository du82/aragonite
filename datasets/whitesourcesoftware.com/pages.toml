full_description = "This post breaks down the differences between securing AI, secure AI use, AI for security, and AI safety. Learn about a fake VS-code extension on npm—truffelvscode—typosquatting the popular truffle for VS-code extension. See how Mend SAST’s AI-powered automated remediation eliminates vulnerabilities with speed & accuracy. CVSS base scores are up in the latest version of the scoring system. What does that mean for AppSec practitioners? An Apache Tomcat web server vulnerability has been published, exposing the platform to remote code execution through a race condition failure. Backstage offers wide views and controls across the development process and with the Mend.io plugin, deep insights into application risks overall or by project. SBOMs alone are overwhelming. Learn how VEX adds context, highlighting real threats for efficient risk management. See why Mend.io is recognized as a Strong Performer in The Forrester Wave™ Software Composition Analysis (SCA) Q4 2024 report. Announcing an exclusive partnership between Mend.io and HeroDevs to provide support for deprecated packages."
