title = "WS-2023-0266 | Mend Vulnerability Database"
description = """
Date: January 14, 2025                                                                                In mod-data-export-spring before 1.5.4 and 2.x before 2.0.2, the module creates a system user that is used to perform internal module-to-module operations. Credentials for this user are hard-coded in the source code. This makes it trivial to authenticate as this user, resulting in unauthorized access to potentially dangerous APIs, allowing to view and modify configuration including single-sign-on configuration, to read, add and modify user data, and to read and transfer fees/fines in a patron's account.                                                                                                                    Language: Java"""
