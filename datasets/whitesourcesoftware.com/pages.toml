title = "About Us - Mend.io"
description = "At Mend.io, our suite of enterprise-grade AppSec tools gives developers and security teams unique, but complementary, solutions."
full_description = 'Our MissionAppSec should be necessary, not a necessary evil <img width="1219" height="570" src="https://www.mend.io/wp-content/uploads/2024/07/About-Us-Hero.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> <img width="141" height="30" src="https://www.mend.io/wp-content/uploads/2024/05/Group-238039.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> <img width="90" height="30" src="https://www.mend.io/wp-content/uploads/2024/07/Google_2015_logo.png" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> <img width="164" height="30" src="https://www.mend.io/wp-content/uploads/2024/05/Group-238041.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> <img width="108" height="30" src="https://www.mend.io/wp-content/uploads/2024/12/yahoo-logo-grey.png" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> <img width="167" height="40" src="https://www.mend.io/wp-content/uploads/2024/06/SIEMENS-black.png" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> <img width="85" height="30" src="https://www.mend.io/wp-content/uploads/2024/08/Comcast-black-logo-30px-1.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> What we believeThere is no one tool to rule them all Your dev teams and security teams need to work together to effectively lower application risk – which means reconciling very different priorities.Dev teams want to hit their cycle deadlines. Security teams want to stay on top of an ever-increasing number of vulnerabilities. And forcing both sides to use the same AppSec tool makes nobody happy. You end up with a never-ending tug-of-war of responsibilities – and an AppSec program stuck in reactive mode. <img width="595" height="400" src="https://www.mend.io/wp-content/uploads/2024/07/About-Feature-1.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> What we doSupport devs and security teams equally – and independently At Mend.io, our suite of enterprise-grade AppSec tools gives developers and security teams unique, but complementary, solutions. Because when each side can focus on what really matters, your AppSec program can finally evolve into a mature program that proactively manages application risk. <img width="594" height="400" src="https://www.mend.io/wp-content/uploads/2024/07/About-Feature-2.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> Meet the team that’s building Mend.io <img width="296" height="295" src="https://www.mend.io/wp-content/uploads/2024/05/Rami-Sass-1.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/05/Rami-Sass-1.png 296w, https://www.mend.io/wp-content/uploads/2024/05/Rami-Sass-1-150x150.png 150w" sizes="auto, (max-width: 296px) 100vw, 296px" loading="lazy" decoding="async" /> Rami Sass Co-Founder & CEO <img width="590" height="587" src="https://www.mend.io/wp-content/uploads/2024/10/azi-cohen.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/10/azi-cohen.png 590w, https://www.mend.io/wp-content/uploads/2024/10/azi-cohen-300x298.png 300w, https://www.mend.io/wp-content/uploads/2024/10/azi-cohen-150x150.png 150w" sizes="auto, (max-width: 590px) 100vw, 590px" loading="lazy" decoding="async" /> Azi Cohen Co-Founder & President <img width="296" height="295" src="https://www.mend.io/wp-content/uploads/2024/05/Ilan-Sidi-1.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/05/Ilan-Sidi-1.png 296w, https://www.mend.io/wp-content/uploads/2024/05/Ilan-Sidi-1-150x150.png 150w" sizes="auto, (max-width: 296px) 100vw, 296px" loading="lazy" decoding="async" /> Ilan Sidi Chief Financial Officer <img width="296" height="296" src="https://www.mend.io/wp-content/uploads/2024/05/Maya-Rotenberg-1.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/05/Maya-Rotenberg-1.png 296w, https://www.mend.io/wp-content/uploads/2024/05/Maya-Rotenberg-1-150x150.png 150w" sizes="auto, (max-width: 296px) 100vw, 296px" loading="lazy" decoding="async" /> Maya Rotenberg Chief Marketing Officer <img width="296" height="296" src="https://www.mend.io/wp-content/uploads/2024/05/Vared-Shaked.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/05/Vared-Shaked.png 296w, https://www.mend.io/wp-content/uploads/2024/05/Vared-Shaked-150x150.png 150w" sizes="auto, (max-width: 296px) 100vw, 296px" loading="lazy" decoding="async" /> Vered Shaked EVP Corporate Development <img width="296" height="296" src="https://www.mend.io/wp-content/uploads/2024/05/Yaron-Avisror-1.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/05/Yaron-Avisror-1.png 296w, https://www.mend.io/wp-content/uploads/2024/05/Yaron-Avisror-1-150x150.png 150w" sizes="auto, (max-width: 296px) 100vw, 296px" loading="lazy" decoding="async" /> Yaron Avisror EVP Engineering <img width="296" height="296" src="https://www.mend.io/wp-content/uploads/2024/05/Nir-Stern-1.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/05/Nir-Stern-1.png 296w, https://www.mend.io/wp-content/uploads/2024/05/Nir-Stern-1-150x150.png 150w" sizes="auto, (max-width: 296px) 100vw, 296px" loading="lazy" decoding="async" /> Nir Stern EVP Product <img width="296" height="296" src="https://www.mend.io/wp-content/uploads/2024/05/Galit-Gold-2.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uplo