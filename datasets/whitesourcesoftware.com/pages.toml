["https://whitesourcesoftware.com/partners/microsoft"]
title = "How Microsoft and Mend.io Work Together"
description = "The Mend-Microsoft integration enables your developers to work in their native environments to detect problematic components early in the SDLC."
full_description = 'How Microsoft and Mend.io work together Get started <img width="779" height="96" src="https://www.mend.io/wp-content/uploads/2024/07/microsoft-mend-logos.png.webp" class="afc-image afc-picture__image" alt="microsoft-mend-logos.png" srcset="https://www.mend.io/wp-content/uploads/2024/07/microsoft-mend-logos.png.webp 779w, https://www.mend.io/wp-content/uploads/2024/07/microsoft-mend-logos.png-300x37.webp 300w, https://www.mend.io/wp-content/uploads/2024/07/microsoft-mend-logos.png-768x95.webp 768w" sizes="auto, (max-width: 779px) 100vw, 779px" loading="lazy" decoding="async" /> <img width="1920" height="461" src="https://www.mend.io/wp-content/uploads/2024/07/Microsoft-top-strip.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/07/Microsoft-top-strip.png 1920w, https://www.mend.io/wp-content/uploads/2024/07/Microsoft-top-strip-300x72.png 300w, https://www.mend.io/wp-content/uploads/2024/07/Microsoft-top-strip-1024x246.png 1024w, https://www.mend.io/wp-content/uploads/2024/07/Microsoft-top-strip-768x184.png 768w, https://www.mend.io/wp-content/uploads/2024/07/Microsoft-top-strip-1536x369.png 1536w" sizes="auto, (max-width: 1920px) 100vw, 1920px" loading="lazy" decoding="async" /> Integrations – Working in your native environment The Mend-Microsoft integration enables your developers to work in their native environments to detect problematic components early in the SDLC. Azure Devops integration Mend for Azure Repos integrates with developers’ native environment to scan repositories as part of a Mend.io account. Mend.io detects all open source components and displays any security vulnerabilities or license compliance issues directly within Azure Repos. Developers are also given remediation advice on vulnerable and outdated open source components directly in Azure Repos without having to leave their repository. <img width="1440" height="842" src="https://www.mend.io/wp-content/uploads/2024/07/azure-devops-AWS-partner-page.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/07/azure-devops-AWS-partner-page.png 1440w, https://www.mend.io/wp-content/uploads/2024/07/azure-devops-AWS-partner-page-300x175.png 300w, https://www.mend.io/wp-content/uploads/2024/07/azure-devops-AWS-partner-page-1024x599.png 1024w, https://www.mend.io/wp-content/uploads/2024/07/azure-devops-AWS-partner-page-768x449.png 768w" sizes="auto, (max-width: 1440px) 100vw, 1440px" loading="lazy" decoding="async" /> IDE integrations Mend.io’s Integrated Development Environment (IDE) integrations, including support for Visual Studio and Visual Studio Code (Editor), are designed to work seamlessly within the development process, enabling developers to code more productively and securely. <img width="908" height="507" src="https://www.mend.io/wp-content/uploads/2024/07/image-IDE.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/07/image-IDE.png 908w, https://www.mend.io/wp-content/uploads/2024/07/image-IDE-300x168.png 300w, https://www.mend.io/wp-content/uploads/2024/07/image-IDE-768x429.png 768w" sizes="auto, (max-width: 908px) 100vw, 908px" loading="lazy" decoding="async" /> GitHub integration Mend for GitHub.com is a GitHub app, which is part of Mend Developer Integrations, continuously scans your repositories and alerts on security vulnerabilities. It includes continuous automated security remediation with Mend Remediate, using fix pull requests. Mend for GitHub.com detects all open source components in your software, without ever scanning your code. <img width="768" height="430" src="https://www.mend.io/wp-content/uploads/2024/07/microsoft-screenshot.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/07/microsoft-screenshot.png 768w, https://www.mend.io/wp-content/uploads/2024/07/microsoft-screenshot-300x168.png 300w" sizes="auto, (max-width: 768px) 100vw, 768px" loading="lazy" decoding="async" /> Mend.io is available on Azure Marketplace Customers who procure Mend through the Azure commercial marketplace, can use it toward their Azure Consumption Commitment (MACC). Learn more <img width="910" height="565" src="https://www.mend.io/wp-content/uploads/2024/07/azure-ss.png" class="afc-image afc-picture__image" alt="" srcset="https://www.mend.io/wp-content/uploads/2024/07/azure-ss.png 910w, https://www.mend.io/wp-content/uploads/2024/07/azure-ss-300x186.png 300w, https://www.mend.io/wp-content/uploads/2024/07/azure-ss-768x477.png 768w" sizes="auto, (max-width: 910px) 100vw, 910px" loading="lazy" decoding="async" /> Hear why Microsoft’s developers love using Mend SCA Hear why Microsoft chose Mend for open source security Start building a proactive AppSec program Book a live demo'
