 <img width="674" height="381" src="https://www.mend.io/wp-content/uploads/2024/07/Product-image-1.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> Merge Confidence workflows Allows developers to group, filter, and even merge high-confidence dependency updates based on the confidence of an error-free merge. <img width="674" height="381" src="https://www.mend.io/wp-content/uploads/2024/07/Product-image-2.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> Integrates with your repos Mend Renovate integrates directly into your repositories to support your developers without overwhelming them. See repo integrations <img width="594" height="400" src="https://www.mend.io/wp-content/uploads/2024/07/Renovate-overview-page-integrations.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> Frequently asked questions What is Mend Renovate? Mend Renovate is a family of products that helps developers keep their dependencies up-to-date. It automates the process of finding new versions, creating pull requests (PRs), and reviewing changes, saving developers valuable time and effort. How does Mend Renovate work? Mend Renovate scans files to find open source dependencies and checks for available updates. It further automatically generates pull requests so developers can easily merge the updates. All of Mend Renovate is configurable to follow update policies and schedules. What types of dependencies does Mend Renovate support? Mend Renovate supports a wide range of dependency types, including npm packages, Maven artifacts, NuGet packages, and more. What is the difference between Mend Renovate CLI, Mend Renovate Community, and Mend Renovate Enterprise? Mend Renovate CLI is a free, open source, community-driven version with basic dependency management features. It’s ideal for individual developers and small teams attempting to keep a few code repositories up-to-date. Mend Renovate Community is also free, but adds significant quality of life and ease of use features such as job scheduling and API access. Mend Renovate Enterprise is an enterprise-grade solution that offers additional features such as advanced security checks, detailed insight into the effort needed to implement specific updates, granular control, and enterprise-level support. It’s perfect for larger teams and organizations with complex dependency management needs. How do I get started with Mend Renovate? We offer a variety of reports that will help you monitor all of your open source activity such as an inventory report, due diligence report, high severity bugs report, vulnerability report and many more. Can I still use your AppSec platform if my environment is not connected to the internet? Getting started with Mend Renovate is easy! First, check which products support your repository. If several products support your repo, then decide if you wish to d'
