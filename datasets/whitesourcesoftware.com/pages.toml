full_description = 'Mend Renovate Community Automated dependency updates A free stateful app that automatically updates your project’s dependencies with every code commit by combining the power of the Mend Renovate CLI with a built-in job scheduler. Cloud-hosted Self-hosted <img fetchpriority="high" width="540" height="400" src="https://www.mend.io/wp-content/uploads/2024/07/verse1-540.svg" class="afc-image afc-picture__image" alt="" srcset="" sizes="auto, " loading="lazy" decoding="async" /> Reduce risk caused by outdated dependencies with automation Embedded job scheduler Mend Renovate Community includes its own scheduler module to queue up repositories at configurable intervals. Real-time webhook handling Includes a webhook listener to detect repository events and trigger immediate Renovate jobs. Stateful priority queue Mend Renovate Community’s job queue is stateful and processes repositories in order of job priority (e.g. webhooks first). Job history log A table of completed jobs is saved to the database for easy administrator reference. Repo integration Mend Renovate Community delivers pull requests for dependency updates directly in your repo with every code commit. Choose your hosting option to get started Cloud-hosted Self-hosted Cloud-hosted Self-hosted Supported platforms: GitHub Cloud, Bitbucket Cloud, Azure DevOps Cloud GitHub, GitLab, Bitbucket Includes: Web UI Dashboard APIs for actions and basic information (eg. run a job, get log jobs, show job queue) Get started: (Choose the platform that hosts your code) GitHub: Renovate App Bitbucket: Mend App Azure DevOps: Developer Portal Follow the guide at Renovate CE/EE website Need enterprise-grade performance and advanced features? Check out Mend Renovate Enterprise for full scale automation and support built for large enterprises. See Mend Renovate <img width="1498" height="982" src="https://www.mend.io/wp-content/uploads/2024/07/RENOVATE-Data-Sheet-Mockup-2x.png" class="afc-image afc-picture__image" alt=