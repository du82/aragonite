full_description = "Overview Prerequisites Training Topics Schedule Certified Partners FAQ CWIP Portal Certified Widevine Implementation Partner Overview The Certified Widevine Implementation Partner (CWIP) program is designed to allow highly qualified companies the ability to confidently and successfully install and configure Widevine systems for their clients. The goals of the program are to: Teach CWIP candidates how to install, configure and troubleshoot the Widevine system Ensure a high level of satisfaction for both the System Integrator and their end customers Maintain a high level of Widevine system knowledge within the CWIP community Maintain a high level of content owner trust in the Widevine system and Widevine’s CWIPs In order to become a CWIP the following must be completed: Execution of CWIP agreements (Note: Individuals will be unable to register for classes until this step is complete) Non-Disclosure Agreement Master Licensing Agreement Certified Widevine Implementation Partner Agreement and Order Form The 3-DayTraining Session Lecture Hands on lab time (not applicable until in-person classes resume) Completion of an online exam with a score of 90% or greater It should be noted the class is difficult and the requirements for passing are high to ensure the highest quality and customer satisfaction with implementations performed by CWIPs. To maintain CWIP certification, CWIPs must: Have on staff a minimum of two individuals that are CWIP certified Pass audits of end user sites if conducted by Widevine to ensure proper and secure installations End user and content owner experience must remain satisfactory Remain in good standing with their annual CWIP fees CWIP Prerequisites Required skills and background knowledge for training and certification: Must be proficient in English (verbal and written) as the classes are in English Must have a laptop with Chrome browser installed to participate in and complete the lab sessions Please ensure you are using the latest version of Chrome browser. Systems and Network Administration The individual should have a good understanding of networks, including CDN setup and maintenance, setup and maintenance of web servers, video content flow to the Internet, firewalls, routing, subnets, TCP and UDP communications. Experience with Video encoding and Video Encoding Standards (Understand DASH, GOP, iframe, H.264, VP9, MP2TS, etc.) Video encoding is one of the most time consuming and complicated portions of an integration and CWIP students should have a very good understanding of video encoding standards, such as IDR frame structure, encoding profiles like baseline, main, high, and which platforms support which profile, video muxing, HLS, etc. Experience with Linux Widevine's supported OS is Ubuntu, therefore, all students are expected to have an intermediate knowledge of the Ubuntu environment and work from the command line to complete the lab exercises. Experience with Python and XML Ability to read and edit XML files. Students should also have an intermediate knowledge of working with Python, including the command line interpreter and reading python code. Requirements for Visitors to Google Offices All visitors to Google Offices must provide: A government issued photo ID. Failure to provide a government issued photo ID will prevent you from being allowed to enter a Google office. Upcoming Course Schedule * Class schedules are subject to change Course Title Course Date(s) Location Time Registration Deadline Widevine DRM Training Register April 29, 2025 - May 1, 2025 New York, NY, USA 9:00a - 5:00p EST April 15, 2025 Widevine DRM Training Register July 29, 2025 - July 31, 2025 Singapore 9:00a - 5:00p SGT July 15, 2025 Training Topics * Please note course description and content are subject to change Widevine DRM Training Day 1: Lecture: Widevine Overview Modular DRM Framework Description of DASH What are Encrypted Media Extensions What are Media Source Extensions Common Encryption (CENC) Encoding and Packaging Packaging and Packaging Options The Widevine Ecosystem The Widevine Client (CDM), Security, and Integration Content Playback and Options Day 2: Lecture: Widevine License Proxy SDK Overview and Workflow Inspection of a license request Management of Policies and Keys Returning device information and client capabilities Lab: Widevine License Proxy SDK Proxy SDK Setup Content playback License Diagnostics Offline playback and license renewals Lecture: Widevine License Server SDK Overview and Workflow Installation and Setup Generating a License Device Security Policies (DSP) Playback Policies Lab: Widevine License Server SDK License SDK Setup Content playback Day 3: Lecture: Shaka Player Overview Setup Code Labs Lecture: Android CDM and Java Classes Certificate Provisioning Key Rotation Android Integrations Device Security Levels ExoPlayer Lab Finish remaining Lab exercises Lab Review Wrap Up CWIP Integrators List The following companies have been certified as Widevine integrators to install, maintain, and deploy Widevine software. Integrator Contact Information Certifications Email: widevine@accenture.com Widevine Classic VOD PackagingWidevine Modular DRM Name: Filipe BadaroName: Thiago BessaPhone: +55 11 3045-5010Email: cwip@agilecontent.com Widevine Modular DRM Name: YoungMi ShinName: EunJung Seo Phone: +82 2 2007 7700Email: cwip@alticast.com Widevine Modular DRM Name: Sunyoung KangName: Hamin Choi Email: widevine@altimedia.com Widevine Modular DRM Name: David GonzalezName: Miguel RodriguezEmail: cwip@antena3tv.es Widevine Classic VOD PackagingWidevine Classic Live Packaging Name: Vlastimil LakatosEmail: widevine@antik.sk Widevine Modular DRM Name: Juan Manuel MurguiaName: Andrés CarjuzaaPhone: +54 11 4760 2641Phone: +1 347 774 0747Email: webcontact@we-are-around.com Widevine Modular DRM Email: widevinecwip@arris.com Widevine Modular DRM Email: service@ascentac.com Widevine Modular DRM Email: contact@aspirapps.com Widevine Modular DRM Email: in