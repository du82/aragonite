full_description = "Overview Widevine DRM Widevine CAS Shaka Player + Packager Widevine 3PL Service Providers Widevine Third Party Labs (3PL) As the demand for Widevine device integrations continues to grow quickly from partners, a scalable way to provide professional technical integration, support and verification services is required. The Widevine 3PL program allows for licensed and authorized third party partners to assist with the implementation and approval of Widevine integrated devices. Additionally, the 3PL partner may assist with the following items: Execution of test plans and submitting the results to Widevine for final review. Providing product development support to OEMs and SoCs. Providing upgrade and maintenance related assistance to OEMs and SoCs. Based on the device submission, integration needs can be supported by a Widevine 3PL to validate Widevine device integrations. Please reach out to any of the Widevine 3PL partners below for further information: Widevine 3PL Partners Partner Contact Android (AOSP) Linux WV CAS contact@altimedia.com 3pl@castlabs.com widevine@irdeto.com 3plwidevine@seirobotics.net CWIP Training Program The Certified Widevine Implementation Partner (CWIP) program is designed to allow highly qualified individuals and companies the ability to confidently and successfully install and configure Widevine systems for their clients. Learn More"
