["https://widevine.com/solutions/shaka-player"]
title = "Shaka Player"
description = "Widevine provides multiplatform DRM and video optimization solutions using industry adopted standards including common encryption (CENC) and encrypted media extensions (EME)."
full_description = "Overview Widevine DRM Widevine CAS Shaka Player + Packager Widevine 3PL Service Providers Shaka Player Shaka Player is an open-source JavaScript library for adaptive media. It plays adaptive media formats (such as DASH and HLS) in a browser, without using plugins or Flash. Instead, Shaka Player uses the open web standards MediaSource Extensions and Encrypted Media Extensions. Shaka Player also supports offline storage and playback of media using IndexedDB. Content can be stored on any browser. Storage of licenses depends on browser support. Features & Benefits Content Protection Provides ubiquitous device coverage and extends synergy across multiple content protection systems. See a list of currently supported platforms. Video Playback Fully featured HTML5 video player with adaptive streaming, QoS, and accessibility support across devices. Standardized Format Encrypt once, play anywhere utilizing industry adopted media containers including ISO BMFF 9i.e. MP4) and WebM. Legacy System Support for concurrent access to all content protection systems. Providing migration tools and flexibility while adopting new technologies Device Security Robust device security is enabled by using factory provisioned keyboxes to establish a hardware root of trust, secure decryption and content rendering. CWIP Training Program The Certified Widevine Implementation Partner (CWIP) program is designed to allow highly qualified individuals and companies the ability to confidently and successfully install and configure Widevine systems for their clients. Learn More"
