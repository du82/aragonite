full_description = "Overview of Technology Widevine provides digital media solutions for the delivery of digital entertainment to any device. Widevine’s DRM solution enables service providers to secure high quality video and audio. 5 Billion Devices 82 Billion Licenses Quarterly 1000 Partners Today, millions of consumers enjoy digital entertainment secured and optimized by Widevine on retail consumer electronics devices from all major consumer brands. Widevine is trusted by: Service Providers and Broadcasters who deliver premium content over an OTT network Devices using Widevine Widevine's mission is to deliver best-in-class content security solutions across all devices and platforms by providing our partners with secure, easy, and efficient technology for streaming video over the Internet."
