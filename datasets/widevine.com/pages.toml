["https://widevine.com/solutions/widevine-drm"]
title = "Widevine DRM"
description = "Widevine provides multiplatform DRM and video optimization solutions using industry adopted standards including common encryption (CENC) and encrypted media extensions (EME)."
full_description = "Overview Widevine DRM Widevine CAS Shaka Player + Packager Widevine 3PL Service Providers Widevine DRM Widevine’s DRM solution provides the capability to license, securely distribute and protect playback of content on any consumer device. Content owners, multiple service operators and digital media providers can utilize Widevine’s solutions to ensure revenue generating services keep flowing to whatever device consumers desire. Features & Benefits Content Protection Provides ubiquitous device coverage and extends synergy across multiple content protection systems. See a list of currently supported platforms. Video Playback Fully featured HTML5 video player with adaptive streaming, QoS, and accessibility support across devices. Standardized Format Encrypt once, play anywhere utilizing industry adopted media containers including ISO BMFF (i.e. MP4) and WebM. Legacy System Support for concurrent access to all content protection systems. Providing migration tools and flexibility while adopting new technologies Device Security Robust device security is enabled by using factory provisioned keyboxes to establish a hardware root of trust, secure decryption and content rendering. Device Integration Details Depending on your needs, please review the information below to help determine your next steps. If you have any questions please contact us. Device Manufacturers and Chipset Vendors Widevine has an established process to help streamline the integration of new devices and chipsets. A high-level overview of the steps are as follows: Completion of legal agreements Delivery of a Widevine documentation package Technical discussion to understand the device type, chipset, and review the Widevine robustness rules Exchange of libraries, SDKs, and integration documentation Keybox request and fulfillment (as needed) Client integration testing If you are interested in a new device or chipset integration, please Contact Us. Content Owners/Providers Content owners and providers can join the Certified Widevine Implementation Partner (CWIP) program to become CWIP certified. The program offers comprehensive training and certification for Encoding and Packaging, Proxy Development, Android, and Business Rules. CWIP is an optional training program designed to educate third parties on the use of Widevine products. Partners who successfully complete the program will be positioned to significantly expedite their deployment to the market. For content owners and providers interested in independently protecting their digital media, the Common Encryption standard (ISO/IEC 23001-7) and Encrypted Media Extensions framework are both available as open specifications. Please refer to their respective documentation for implementation design guidelines. Please Contact Us for more information End User For end users, the implementation of Widevine DRM is dependent upon your device manufacturer and/or service provider. CWIP Training Program The Certified Widevine Implementation Partner (CWIP) program is designed to allow highly qualified individuals and companies the ability to confidently and successfully install and configure Widevine systems for their clients. Learn More"
year_published = 2025
clearnet = "https://widevine.com/solutions/widevine-drm"
