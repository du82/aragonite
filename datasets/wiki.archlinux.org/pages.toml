title = "Main page (עברית) - ArchWiki"
full_description = '''Toggle the table of contents Main page (עברית) 31 languages العربيةБългарскиBosanskiCatalàČeštinaDanskDeutschΕλληνικάEnglishEspañolSuomiFrançaisHrvatskiMagyarBahasa IndonesiaItaliano日本語한국어LietuviųNederlandsPolskiPortuguêsРусскийSlovenčinaСрпски / srpskiSvenskaไทยTürkçeУкраїнська中文（简体）中文（繁體） PageDiscussion עברית ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki ברוכים הבאים לארץ' וויקי ( ArchWiki ) : המקור שלך עבור מסמכי ארץ' לינוקס על רשת האינטרנט. באפשרותיך לבקר בתוכן העניינים כדי לקבל רשימה של כל הקטגורוית של ארץ, לינוקס. ראה גם: דפים מסודרים לפי נושא ו דפים מסודרים לפי סוג. ראשית כל הקישורים הבאים, שימושיים לאלה המתחילים להתשמש בארץ' לינוקס. ארץ' לינוקס סקירה קצרה על ארץ' לינוקס, מתאר מה אפשר לצפות מארץ' לינוקס כמערכת. דרך הארץ' מתאר את העקרונות והפילוסופיה מאחורי ארץ' לינוקס. ארץ' לעומת הפצות אחרות מסכם את הדומה והשונה בין הפצות אחרות וארץ' לינוקס איך אני יכול לתרום מסביר את הדרכים שמשתמשי ארץ' (חדשים וגם מנוסים) יוכלו לתרום לקהילת הארץ' כללי הפורום כללים לחברי הפורום . מדריך לארץ' וויקי מדריך קצר לעריכה ותרומה לארץ' וויקי מדריך למתחילים מדריך שעובר על כך תהליך ההתקנה והקונפיגרציה של ארץ' לינוקס, נכתב עבור משתמשים חדשים ולא מנוסים. המדריך הרשמי להתקנת ארץ' לינוקס מדריך התקנה כללי יותר, בהנחה שהמשתמש יותר מנוכב בכל הקשור ל - UNIX/GNU/Linux וכל שביניהם. שאלות נפוצות רשימה של שאלות ותשובות נפוצות המלצות כלליות אינדקס מקוצר של מאמרים פופולריים וכאלה שאנשים מפנים אליהם לעיתים קורבות חדשות וויקי לחץ כאן כדי לקבל מידע על החדש בווקי באם אתם מוכנים ומסגולים לעזור ולתרום לוויקי אנא קרא את הרשימה הבאה לרעיונות. בעיקר יש צורך באנשים בכדי לסווג את הדפים שאינם באנגלית. אנא תאם את הפעליוית עם הadmins and sysops שפות יותר קל לך לקרוא בשפת האם שלך? אנא לחץ כאן לרשימה של שפות עזרה באם אתה מחפש עזרה בנושא מסוים, נסה להתשמש בקופסאת החיפוש מצד שמאל, לחלופין, אפשר לשתמש ב"האתר" של גוגל על ידי הוספה של site:wiki.archlinux.org (לדוגמא חיפוש באתר הזה של הערך "ארץ' לינוקס" (באנגלית)[dead link 2023-09-16 ⓘ]) עלייך להירשם בכדי לערוך את הוויקי. כאשר סיימת, תוכל לשחק עם ה Sandbox (ארגז חול) או בדף המשתמש שלך בכדי להתרגל לממשק. התחביר הזמין נמצא ב wiki help category בנוסף לעוד ממשאבים יעילים המדריך והתוכן נכתבו בלשון זכר לנוחיות בלבד. Retrieved from "https://wiki.archlinux.org/index.php?title=Main_page_(עברית)&oldid=799291" Category: עבריתHidden category: Pages with dead links'''
