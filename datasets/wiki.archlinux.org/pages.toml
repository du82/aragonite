full_description = 'Main page 31 languages العربيةБългарскиBosanskiCatalàČeštinaDanskDeutschΕλληνικάEspañolSuomiFrançaisעבריתHrvatskiMagyarBahasa IndonesiaItaliano日本語한국어LietuviųNederlandsPolskiPortuguêsРусскийSlovenčinaСрпски / srpskiSvenskaไทยTürkçeУкраїнська中文（简体）中文（繁體） Main PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki Welcome to the ArchWiki: your source for Arch Linux documentation on the web. Visit the Table of contents for a listing of article categories. The distribution Arch Linux Overview of Arch Linux describing what to expect from an Arch Linux system. Frequently asked questions Notable questions and facts about the distribution. Arch compared to other distributions Summarizes the similarities and differences between Arch and other distributions. Installation guide Guide through the process of installing Arch Linux. General recommendations Annotated index of post-installation tutorials and other popular articles. List of applications Categorized presentation of common official and AUR packages. Our community Code of conduct Guidelines for the Arch community. Getting involved Describes various ways Archers can contribute to the Arch community. International communities Collection of links to the Arch Linux communities around the world. Arch IRC channels Get together with your fellow Archers for a good chat. Wiki interaction Help:Reading Find clarifications if you struggle to understand instructions in some articles. Help:Browsing How to search the wiki, find related articles and view the wiki offline. ArchWiki:Contributing The starting point for those willing to contribute to the wiki. Help:Editing Tutorial on editing articles and introduction to wiki text syntax. Retrieved from "https://wiki.archlinux.org/index.php?title=Main_page&oldid=813472" Category: English'
