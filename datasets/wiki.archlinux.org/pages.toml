full_description = 'Main page (Српски) 30 languages العربيةБългарскиBosanskiČeštinaDanskDeutschΕλληνικάEnglishEspañolSuomiFrançaisעבריתHrvatskiMagyarBahasa IndonesiaItaliano日本語한국어LietuviųNederlandsPolskiPortuguêsРусскийSlovenčinaSvenskaไทยTürkçeУкраїнська中文（简体）中文（繁體） PageDiscussion Ћир./lat. Ћир./lat.ЋирилицаLatinica ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki Добродошли на АрчВики; најбољи извор документације за Арч Линукс на интернету. Посетите Table of contents за списак АрчВики категорија. Како почети Следеће везе су корисне за оне који тек почињу са Арч Линуксом. О Арч Линуксу Кратак преглед Арч Линукса; описује шта да очекујете од Арч Линукс система. Арчов начин Описује принципе и философију Арч Линукса. Арч у поређењу са осталим дистрибуцијама Сумаризује сличности и разлике између Арча и осталих дистрибуција. Getting involved Описује разне начине на које Арчери (и нови и искуснији корисници) могу да допринесу Арч заједници. Forum etiquette Смернице за чланове Арч форума. Упутства за ArchWiki Кратка упутства за уређивање и допринос Арч Линукс Вики страницама. Службени водич кроз инсталацију Арч Линукса Уопштенији водич кроз инсталацију; претпоставља се да је корисник искуснији са ЈУНИКС/ГНУ/Линукс методологијом. FAQ Листа уобичајених и често постављених питања. General recommendations Коментарисани индекс других популарних чланака и често навођених информација. Вики Вести Проверите страницу Вики Вести за најновије вести. Ако сте вољни и у могућности да допринесете вики страницама, погледајте ову страницу да видите неке идеје. Конкретно, потребна је помоћ око рекатегоризације страница које нису на енглеском. Координишите ваше активности са администраторима и оператерима. Интернационализација Лакше вам је читати чланке на вашем језику? Кликните овде за списак доступних језичких категорија и осталих информација о интернационализацији. Помоћ Ако тражите одређену информацију, користите претрагу на левој страни странице. Или можете користити Гуглову претрагу "сајта" тако што ћете додати site:wiki.archlinux.org изразу за претрагу (нпр. тражи "Arch Linux" на овом сајту[dead link 2023-09-16 ⓘ]). Морате отворити налог да бисте могли уређивати овај вики. Кад отворите налог можете се играти у Sandbox или на вашој корисничкој страници да се упознате са АрчВики ознакама. Доступна синтакса је у Вики помоћ категорији заједно са осталим ресурсима који могу бити од помоћи. Retrieved from "https://wiki.archlinux.org/index.php?title=Main_page_(Српски)&oldid=799467" Category: СрпскиHidden category: Pages with dead links'
