full_description = 'Main page (العربية) 30 languages БългарскиBosanskiČeštinaDanskDeutschΕλληνικάEnglishEspañolSuomiFrançaisעבריתHrvatskiMagyarBahasa IndonesiaItaliano日本語한국어LietuviųNederlandsPolskiPortuguêsРусскийSlovenčinaСрпски / srpskiSvenskaไทยTürkçeУкраїнська中文（简体）中文（繁體） PageDiscussion العربية ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki مرحباً بك في موسوعة آرتش، مصدرك للحصول على توثيق نظام آرتش لينُكس على الويب. اطّلع على جدول المحتويات للحصول على قائمة بتصنيفات مقالات الموسوعة. تستطيع البدء من هذه الصفحة: تعريب لتهيئة نظامك باللغة العربية. التوزيعة آرتش لينُكس مقالة توَّفِر نظرة عامة عن توزيعة آرتش لينُكس تشرح أساسيات هذا النظام. أسئلة شائعة أسئلة وحقائق متعددة بارزة حول التوزيعة. مقارنة آرتش مع توزيعات أخرى مُلخص للتشابهات والاختلافات بين آرتش والتوزيعات الأخرى. دليل التثبيت دليل إرشادي شامل حول عمليّة تثبيت آرتش لينُكس. نصائح عامة قائمة بدروس حول الخطوات ما بعد عمليّة التثبيت ومقالات أخرى شائعة. قائمة التطبيقات قائمة مُصنَّفة بالحزم الرسميّة الشائعة في مستودع AUR. مجتمعنا مقالة قواعد السلوك مقالة تشرح السلوكيات التي يجب أن يتحلّى بها الفرد في مجمتع آرتش. المساهمة مقالة تشرح طرق مختلفة يمكن من خلالها الفرد المساهمة في مجتمع مشروع آرتش. مجتمعات عالميّة مجموعة من الوصلات لمواقع مجتمعات آرتشيّة حول العالم. قنوات آي آر سي اجتمع مع أصدقاءك وآرتشاويين للخوض في مناقشات رائعة. مقالات عن التعامل مع الموسوعة دليل القراءة ادخل للحصول على بعض التوضيحات حول الرموز المُستخدمة في الشرح في المقالات إن كنت تواجه صعوبة في فهم بعض المقالات. دليل استخدام صندوق البحث مقالة تشرح بعض الخدع لتسهيل عمليّة البحث وإيجاد المقالات. دليل المساهمة نقطة البداية للذين يرغبون في المساهمة في موسوعة آرتش. دليل تعديل المقالات دليل شامل لتعديل المقالات متضمناً مقدمة إلى الصيغة الكتابيّة للنصوص في الموسوعة. Retrieved from "https://wiki.archlinux.org/index.php?title=Main_page_(العربية)&oldid=815002" Category: العربية'
