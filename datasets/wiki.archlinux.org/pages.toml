full_description = 'Main page (Ελληνικά) 30 languages العربيةБългарскиBosanskiČeštinaDanskDeutschEnglishEspañolSuomiFrançaisעבריתHrvatskiMagyarBahasa IndonesiaItaliano日本語한국어LietuviųNederlandsPolskiPortuguêsРусскийSlovenčinaСрпски / srpskiSvenskaไทยTürkçeУкраїнська中文（简体）中文（繁體） PageDiscussion Ελληνικά ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki Καλώς ήλθατε στο ArchWiki: την πηγή σας για την τεκμηρίωση του Arch Linux στο διαδίκτυο. Επισκεφτείτε το Table of contents για να δείτε την λίστα με τις ενότητες του ArchWiki (στα Ελληνικά). Εναλλακτικά επισκευτείτε το Table of contents στην αγγλική έκδοση. Ξεκινήστε Οι παρακάτω σύνδεσμοι είναι χρήσιμοι για όσους μόλις ξεκινούν με το Arch Linux. Arch Linux Μια σύντομη επισκόπηση του Arch Linux, περιγράφει τι να περιμένετε από ένα σύστημα Arch Linux. The Arch Way Περιγράφει τις αρχές και την φιλοσοφία του Arch Linux. Arch Compared to Other Distributions Συνοψίζει τις ομοιότητες και τις διαφορές μεταξύ του Arch Linux και άλλων Linux διανομών. Getting Involved Περιγράφει διάφορους τρόπους όπου οι χρήστες του Arch (είτε αρχάριοι, είτε έμπειροι) μπορούν να συνεισφέρουν στην κοινότητα του Arch. Forum etiquette Οδηγίες για τα μέλη του φόρουμ του Arch Linux. Installation Guide Ένας συνοπτικός οδηγός εγκατάστασης. Απευθύνεται σε πεπειραμένους χρήστες του Arch. FAQ Μια λίστα με τις συνήθεις ερωτήσεις. General Recommendations Ένα ευρετήριο άλλων δημοφιλών άρθρων και συχνά-αναφερόμενων πληροφοριών. ArchWiki Tutorial Ένας σύντομος οδηγός επεξεργασίας και συνεισφοράς στο Arch Linux Wiki. Τα Νέα του Arch Ελέγξτε την σελίδα Wiki News για τα τελευταία γεγονότα στο wiki. Αν είστε πρόθυμοι να συνεισφέρετε στο Wiki, παρακαλώ διαβάσετε αυτή τη λίστα για ιδέες. Διεθνοποίηση/Μετάφραση Αισθάνεστε πιο άνετα όταν διαβάζετε άρθρα στην μητρική σας γλώσσα; Κάνετε κλικ εδώ, για μια λίστα με τις διαθέσιμες κατηγορίες γλωσσών και άλλες πληροφορίες διεθνοποίησης/μετάφρασης. Αν θέλετε να μάθετε περισσότερα σχετικά με την μετάφραση στην Ελληνική γλώσσα, επισκεφτείτε την σελίδα της ομάδας μετάφρασης του Arch Wiki στα Ελληνικά, κάνοντας κλικ εδώ. Βοήθεια Αν ψάχνετε για συγκεκριμένες πληροφορίες, χρησιμοποιείστε το κουτί αναζήτησης στα αριστερά. Εναλλακτικά χρησιμοποιείστε την ιδιότητα του Google να ψάχνει σε sites προσαρτώντας στους όρους αναζήτησης site:wiki.archlinux.org (π.χ. search this site for "Arch Linux"[dead link 2023-09-16 ⓘ]). Πρέπει να δημιουργήσετε έναν λογαριασμό για να επεξεργαστείτε αυτό το Wiki. Μόλις το κάνετε μπορείτε να «παίξετε» με το Sandbox ή την σελίδα χρήστη σας για να εξοικειωθείτε με την επεξεργασία του Wiki. Η διαθέσιμη σύνταξη υπάρχει στην Category:Help μαζί με άλλες βοηθητικές πηγές. Retrieved from "https://wiki.archlinux.org/index.php?title=Main_page_(Ελληνικά)&oldid=799451" Category: ΕλληνικάHidden category: Pages with dead links'
