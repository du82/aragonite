["https://wiki.archlinux.org/title/ArchWiki:News"]
title = "ArchWiki:News - ArchWiki"
full_description = '''ArchWiki:News 3 languages 日本語Português中文（简体） Project pageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki 2024/12/19 - New maintainer It is a great time of the year to welcome a new member to the Maintenance Team. A round of applause for Andrei Korshikov for their continued contributions to this project. Thank you for your hard work and welcome to the team! — Erus Iluvatar (talk) 22:36, 19 December 2024 (UTC) 2024/02/29 - New maintainers and translators We are pleased to announce that Andreymal and CodingKoopa officially join the ArchWiki:Maintenance Team, in reward for their long term contributions to the project. Andreymal and Dybdeskarphet have also been conferred the role of official translators to recognize their efforts in improving the accessibility of the wiki to speakers of other languages. Thank you, keep up the good work! — Erus Iluvatar (talk) 09:32, 29 February 2024 (UTC) 2024/01/07 - New administrator The first tribute of the new year belongs to Erus Iluvatar who has earned a seat in the Administration Team after tirelessly serving the wiki as a maintainer and its most active contributor. Thank you and enjoy your new superpowers! — Lahwaacz (talk) 19:28, 7 January 2024 (UTC) 2022/07/08 - Seventeenth birthday! What an achievement it is to keep a documentation project in such good health for so many years, in a field that sees significant change and advancement every day! Such a feat does not happen autonomously though (not yet): dozens of enthusiastic humans volunteer some of their precious time and knowledge every month to boost the ArchWiki back to its orbit, so thank you all! And today is an excellent opportunity to mention in particular two members of the ArchWiki:Maintenance Team, User:Nl6720 and User:NetSysFire, who have been giving their help for respectively 1706 and 538 days continuously! Kudos, kudos, kudos, and love :D — Kynikos (talk) 14:41, 9 July 2022 (UTC) 2022/04/13 - New maintainer and translator We are happy to welcome User:Erus Iluvatar to the ArchWiki:Maintenance Team after their hard work and long-term investment in the wiki. Additionally, in recognition of their efforts to translate the French ArchWiki (which has now returned to our "home base" after being previously hosted on archlinux.fr), User:Erus Iluvatar is conferred the role of official translator. Thank you and keep up the good work! — Alad (talk) 22:44, 13 April 2022 (UTC) 2021/09/25 - New maintainer With great pleasure we announce that Flyingpig officially joins the Maintenance Team. Thank you for your hard work and welcome to the team! — Lahwaacz (talk) 20:57, 25 September 2021 (UTC) 2021/07/08 - 0x10th foundation anniversary Another year, another massive amount of changes that Arch Linux and the software that we redistribute made, but we have been here to document them all. As we inaugurate the fifth bit in ArchWiki's years-of-age counter, we wish to also distribute tonnes of gratefulness to all the awesome humans and bots who contributed so far: let us continue more determined than ever, all together! — Kynikos (talk) 04:58, 8 July 2021 (UTC) 2021/03/19 - New maintainer We are happy to welcome a new reinforcement to the Maintenance Team. The honour goes to NetSysFire, whose enthusiasm and commitment improved the wiki in the past several months. Thank you and keep up the good work! — Lahwaacz (talk) 18:23, 19 March 2021 (UTC) 2020/07/08 - ArchWiki's birthday As alive and avant-garde as always, this project and the vibrant community of people that animates it have grown another year stronger, this time breaking the record of registered users, with more than 4700 new accounts created, almost as many as the previous two years together! A good excuse to go have a drink (perhaps via video conference) with a couple of friends and brag about being an awesome ArchWiki contributor, well done everyone! — Kynikos (talk) 14:52, 8 July 2020 (UTC) 2020/06/06 - New maintainer and translators Some great news for our community, we are pleased to announce the appointment of Blackteahamburger as a new member of the ArchWiki:Maintenance Team, in reward for his recent valuable contributions to the project. Blackteahamburger himself and Duodai have also been conferred the role of official translators to recognize their enthusiastic efforts in improving the accessibility of the wiki to speakers of other languages. Thank you, keep up the good work! — Kynikos (talk) 15:25, 6 June 2020 (UTC) 2019/07/08 - 14 years of ArchWiki Today this wiki is one year older than last year, more than 2000 pages larger than last year, and more than 47000 edits better than last year. Many thanks to the thousands of people who keep the wiki rolling with an amazing pace of 130 edits per day on average! Today we also welcome a new reinforcement to the Administration Team. After being the most active maintainer in the past months or even years, nl6720 has naturally progressed towards gaining even more superpowers for improving the wiki in new ways. Thank you for your work and congratulations! — Lahwaacz (talk) 11:17, 8 July 2019 (UTC) 2018/12/16 - Official translators Translating our most important articles, and in some cases many more of them, into languages other than English is a remarkable work that has always been conducted quite a bit in the background in the community, sometimes within a self-organized Translation Team, other times simply by passionate individual efforts. The Administrators fully support translation work, as long as it is conducted in a way that is compliant with the wiki's general language-agnostic style and editing rules, starting from Help:i18n. To give it official acknowledgement, a new "translator" role has been introduced to thank and symbolically reward users who have made and will make the greatest contributions towards this goal. The initial selected translators are (in alphabetical order): AlonsoLP, ArchLinuxUser, Fengchao, Josephgbr, Kusakata, MrReDoX, Pedro, SlavMetal, Tuxpain. Some notable historical, though currently inactive translators have also been awarded the role: Agent0, Blackx, Hilinus, Kycok, Maveloth, Skydiver, Umby213, Veleno77, Vladimir Shatalin. It must be noted that the official "translator" role is independent from the membership in a Translation Team: some languages may not have enough users to constitute a team, nonetheless exceptional individual efforts will still be recognized; equally, membership in a Translation Team is not subject to the assignment of the "translator" role: the teams are still completely free and even encouraged to independently invite more users to join, in an effort to better coordinate the translation work; the most active members will eventually be awarded the official role. Novice translators will also hopefully benefit by seeking advice and guidance from the experience accumulated by the official translators. Again, thanks to all wiki translators for your help to overcome language barriers to make the ArchWiki available to as many people as possible! — Kynikos (talk) 15:59, 16 December 2018 (UTC) 2018/12/14 - 404 Award Today is time to single-out one of the extraordinary wiki engagements. This has been dubbed the "404 Award", because the wiki would have had to go offline for a day to stop nl6720 from improving it with contributions on every single of the past 404 days. Thank you! On this opportunity a due thank you also goes out to the Arch Linux DevOps team for keeping watch over and tuning the system! — Indigo (talk) 16:01, 14 December 2018 (UTC) 2018/07/08 - 13 years working together Today marks thirteen years of contributions to this project, many thanks to all the fresh and experienced users who decided to share some of their time and knowledge here! — Kynikos (talk) 16:00, 8 July 2018 (UTC) 2018/01/07 - New maintainers Thank you Kewl and Svito for accepting to join the ArchWiki:Maintenance Team, keep up the wonderful work that you have been doing so far! — Kynikos (talk) 05:01, 7 January 2018 (UTC) 2018/01/06 - New administrator The new year brings fresh forces into the Administration Team: thanks to the experience and trust earned by loyally serving the ArchWiki for a long time as an official Maintainer, enriching it with thousands of contributions, Lonaowna has been given administrator rights with the confidence that his help will be of great value to prolong and advance the prosperity of our cherished project. Congratulations! — Kynikos (talk) 15:04, 6 January 2018 (UTC) 2017/07/08 - Happy Birthday ArchWiki Hey everybody, today the ArchWiki turns 12! You can try to sing Happy Birthday to your screen, but it's unlikely that our server will understand your good-hearted feelings... As an alternative, try to make a small gift edit, it's very easy, and if you don't know how to do it, ArchWiki:Contributing can give you some inspiration :) Many thanks to all those who spent some of their time here during the last year, let's all keep supporting this project!! — Kynikos (talk) 11:05, 8 July 2017 (UTC) 2017/06/29 - New maintainer Congratulations to Larivact, who today was given maintainer rights thanks to his recent contributing efforts: keep up the good work! — Kynikos (talk) 17:20, 29 June 2017 (UTC) 2016/10/05 - New maintainers The Maintenance Team gains new blood in the form of User:Edh, User:Francoism, and User:nl6720 (in alphabetical order). Your continuous efforts to improve ArchWiki are more than appreciated — not only by the maintenance team, but by a wide range of GNU/Linux users which benefit from our wiki every day. Thanks! — Alad (talk) 11:53, 5 October 2016 (UTC) 2016/07/08 - 11 years of ArchWiki Today the wiki celebrates 11 years of activity, an amazing accomplishment for a project that is kept alive solely by volunteer contributions! As it has always been, there's a lot going on even right now while you're reading: in particular you should be aware that the Beginners' guide and the Installation guide are just about to be unified into a single article, after years of attempts and small shifts towards this goal; if you want to participate, see what's happening in Talk:Beginners' guide, and possibly also refer to the mailing-list thread or the special wiki birthday forum thread. And don't forget the brand-new #archlinux-wiki channel if you feel more at ease on IRC. If you have ever authored an edit in any of our thousands articles, even if only once, even if only to make a small correction, thank you!!! The value of this work is the sum of innumerable small contributions from people who don't follow the "somebody else will fix it" philosophy: most people here are not PhD's in Computer Science, we simply share a passion for Arch Linux, the broader FOSS community and pretty much anything related to the digital computing world, therefore if you think this sounds like you but you've never bothered creating an account, take the few seconds needed to do it now, and start sharing your skills and knowledge, whatever their size is; you will find that the more you contribute, the more you will learn and improve yourself too, so it's a win-win choice ;) Anyway, Happy Birthday ArchWiki, and everybody keep up the good work! — Kynikos (talk) 10:48, 8 July 2016 (UTC) 2016/05/22 - IRC channel ArchWiki now has a dedicated IRC channel to ask questions surrounding articles, and the wiki itself. Please join us at #archlinux-wiki on Libera Chat, of course always keeping the three fundamental rules in mind when editing the wiki. For more information, see ArchWiki:IRC. — Alad (talk) 01:23, 22 May 2016 (UTC) 2016/05/15 - New administrator The ArchWiki has thousands of articles, and hundreds of different users edit it every month: keeping the whole project together, ensuring that it always sails in strict accordance to Arch's principles, is a task that requires a great deal of organizational work behind the scenes. As an official Maintainer for a long time, Indigo has gained plenty of experience, demonstrating a comprehensive understanding of how the wiki is structured and regulated by its internal policies, therefore today he is officially promoted to the Administration Team, granting him full power to unleash all his skills where needed :) Thank you for your hard work! — Kynikos (talk) 04:28, 15 May 2016 (UTC) 2016/03/19 - New maintainers After several months of high-quality contributions, Pypi and Rdeckard have been welcomed as members of the official ArchWiki:Maintenance Team, congratulations! — Kynikos (talk) 04:33, 19 March 2016 (UTC) 2016/02/03 Account creation issues During these days you may be finding it impossible at times to register a new account: this is deliberately done by the staff due to maintenance necessities, not a bug to be reported. If you are affected by this issue, please try registering again every few hours, until successful. Trying our best to restore the service to full and continuous operation as quickly as possible, we truly apologize for this inconvenience. — Kynikos (talk) 07:57, 3 February 2016 (UTC) Update 02:12, 6 February 2016 (UTC): see also Unable to determine correct answer for wiki account registration. 2015/10/02 - New maintainers As a result of their long-term commitment and valuable contributions, Det, Kycok, Neitsab and Silverhammermba (in alphabetical order) have entered the official ArchWiki:Maintenance Team. Thank you for your help! — Kynikos (talk) 15:18, 2 October 2015 (UTC) 2015/07/08 - ArchWiki turns 10! Exactly 10 years ago, on July 8th 2005, the ArchWiki was installed with the MediaWiki engine: since then, more than 20,000 users created their account and made almost 400,000 edits that evolved the initial blank page into this fantastic documentation resource that innumerable Arch and non-Arch Linux users every day browse from all around the world. For the future, several major improvements are already under discussion or planning in various talk pages, with Help talk:I18n#Language namespace(s) in place of suffixes?, ArchWiki:Requests#Should we remove or archive obsolete articles? or ArchWiki talk:Maintenance Team#Reorganization being only some notable examples. For this anniversary, ArchWiki:Statistics has been expanded, and many more ideas have been brought up in its talk page to better show the evolution of the wiki and try to give something back to the most active contributors. If you did not make it to get involved in the community of contributors in the past decade, you are very welcome to become one of the first ones of the decade that has just started! The wiki syntax is very easy to learn and use, you can find an introduction in Help:Editing, and ArchWiki:Contributing is there to give you plenty of inspiration about how and where to start. If you have any questions, just ask in the talk page of one of those pages, or any othe'''
year_published = 2025
