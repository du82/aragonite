full_description = '''Toggle the table of contents List of applications 10 languages العربيةBosanskiDeutschEspañol日本語LietuviųPolskiPortuguêsTürkçe中文（简体） PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki Documents – Internet – Multimedia – Security – Science – Utilities – Other Related articles Core utilities List of games This article is a general list of applications sorted by category, as a reference for those looking for packages. Many sections are split between console and graphical applications. Applications listed in "Console" sections can have graphical front-ends, official ones are currently omitted. Tip: Please consider installing the pkgstats package, which provides a timer that sends a list of the packages installed on your system, along with the architecture and the mirrors you use, to the Arch Linux developers in order to help them prioritize their efforts and make the distribution even better. The information is sent anonymously and cannot be used to identify you. You can view the collected data at the Statistics page. More information is available in this forum thread. Daemon packages usually include the relevant systemd unit file to start; some packages even include different ones. After installation pacman -Qql package | grep -Fe .service -e .socket can be used to check and find the relevant one. The content is split into the following subpages for individual categories (also accessible via the navigation bar at the top of the page and each subpage): /Documents /Internet /Multimedia /Science /Security /Utilities /Other Generic software lists Wikipedia:Portal:Free and open-source software Wikipedia:List of free and open-source software packages Wikipedia:List of GNU packages AlternativeTo — Linux alternatives to popular applications Awesome Linux Software — Collection of Linux applications and tools Linux Alternative Project — Linux equivalents to Windows software Linux Links Directory — Linux applications directory Open Source Alternative[dead link 2025-01-19 ⓘ] — Alternatives to commercial software Software lists of other distributions AppImageHub Flathub Snapcraft Debian packages and screenshots Fedora packages Gentoo packages openSUSE Software Ubuntu packages Specialized software lists awesome-linuxaudio — Software for audio/video/live production awesome-selfhosted — Network services and web applications awesome-shell — Command-line frameworks, toolkits and guides awesome-sysadmin — Software for system administrators GNOME applications KDE Applications Inconsolation — Lightweight and minimalist applications reviews K.Mandla's blog — Console applications screenshots and reviews Libre Projects — Open source hosted web services LinApp — Commercial applications and games for Linux PRISM Break — Software against mass surveillance Privacy Tools — Knowledge and tools to protect your privacy against global mass surveillance Software forges From Wikipedia: a forge is a web-based collaborative software platform for both developing and sharing computer applications. Codeberg GitHub GitLab Launchpad SourceHut Retrieved from "https://wiki.archlinux.org/index.php?title=List_of_applications&oldid=825733" Categories: ApplicationsLists of softwareHidden category: Pages with dead links'''
