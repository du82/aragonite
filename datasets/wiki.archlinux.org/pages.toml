title = "ArchWiki talk:Requests - ArchWiki"
full_description = '''Toggle the table of contents ArchWiki talk:Requests Project pageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Appearance move to sidebar hide From ArchWiki Latest comment: Yesterday at 18:51 by Comic-paralyze-image in topic Modification requests Note: Questionable edits should be reported directly on the page itself via an appropriate article status template, or on the respective talk page. Is the wiki missing documentation for a popular software package or coverage of an important topic? Or, is existing content in need of correction, updating, or expansion? Write your requests below and share your ideas... Creation requestsLatest comment: 17 September 202414 comments11 people in discussion Here, list requests for topics that you think should be covered on ArchWiki. If not obvious, explain why ArchWiki coverage is justified (rather than existing Wikipedia articles or other documentation). Furthermore, please consider researching and creating the initial article yourself (see Help:Editing for content creation help). Left-Handed Adjustments for Desktop Environments I was thinking it would be helpful for lefties if there were a list of configuration options for each desktop environment that facilitate left-handed use of mice and touchpads. I'm not sure if this is related enough to Arch to include in this wiki, but I haven't had a lot of luck finding information for my own DE (KDE) let alone for others. I will start writing down information, and if no one else thinks there should be a separate page for this, I'll just add the information I find to each individual DE's page. —ajrl 2013-08-11T15:09−06:00 I think a separate page is better. -- Fengchao (talk) 11:58, 12 August 2013 (UTC)Reply iPXE iPXE is a powerful network boot program with many features. Currently, there is no iPXE specific page to describe iPXE in details. There are some pages mentioning iPXE in the wiki, mostly related to network booting, without any further instruction on how to get iPXE to work. So I think it's worth to add a page with detailed iPXE explanation in the wiki. Alive4ever (talk) 10:08, 21 July 2016 (UTC)Reply I have recently added ipxe to [community], which apart from the defaults also features the binaries required to allow iPXE booting towards the Arch Linux specific endpoint. It would be great to have a page for this and I will try to work on iPXE as soon as time permits. Davezerave (talk) 09:54, 17 June 2021 (UTC)Reply Missing redirects Linux namespaces sysfs lspci and lsusb genfstab stty terminfo (termcap) LPD, LPR JSON, XML, CSV, JS, CSS Exif CGI SQL YAML, TOML Chromecast --Larivact (talk) 15:35, 21 October 2018 (UTC)Reply I think I might create TOML, however I first will check how many pages attempting to link to this to see how wanted it is. TOML has grown a lot over the years, so it would be a useful page to list the packages, such as libraries, which are toml compatible, and also give a brief explanation of what TOML is (by quoting their docs), and also linking to their docs. Have a good day, PolarianDev (talk) 10:56, 11 May 2023 (UTC)Reply This is the only page which links to TOML, might be a waste of time linking to it... especially how alal the other serialisation and configuration langauges (json, yaml etc) also do not have pages. PolarianDev (talk) 10:57, 11 May 2023 (UTC)Reply Mirror troubleshooting Unfortunately, Mirrors#Troubleshooting is a bit lacking and can definitely benefit from more information such as how to detect a bad mirror. A mirror becoming faulty is not extremely uncommon so this topic should definitely be covered, including who to tell about the bad mirror so it can e.g be removed from the mirrorlist. This topic is impacting enough people that it is worth putting it into here. -- NetSysFire (talk) 00:07, 6 August 2021 (UTC)Reply The bad mirror case i covered now. Should another section, about a mirror returning 404, be added or information in is Pacman#Packages_cannot_be_retrieved_on_installation enough? --Mpan (talk) 08:19, 6 August 2021 (UTC)Reply Thanks for contributing! The content you added looks good. Some information helping how to determine that a mirror is faulty is still missing. The section you mentioned is unfortunately not containing enough information on that and would be specific to the Mirrors article anyways. If any developer or other person knowing mirror internals sees this, please share your knowledge in debugging mirrors. -- NetSysFire (talk) 17:19, 6 August 2021 (UTC)Reply Random page - only with specific language ? I like the "Random page", https://wiki.archlinux.org/title/Special:Random , but often it provides me the articles not in English, e.g. today fstab in Português which is above my pay-grade :-) Is it possible to call the random page url with an extra option and get e.g. only wiki articles in English ? Thanks. Ua4000 (talk) 09:34, 19 May 2023 (UTC)Reply Looking at mw:Manual:Random page, it doesn't looks like it's possible since ArchWiki has all translations in the main namespace. -- nl6720 (talk) 09:40, 19 May 2023 (UTC)Reply Observability This article could start by quoting and linking to the Wikipedia article on the same topic. I also have an idea of adding a brief blurb to the General Recommendations page, or even to the list of applications (with a link to the main Observability article prominently at the top of the section). As a budding cloud engineer, I've become more interested in observability in web applicationd/services, and in my own hobby projects. I've done some research into it, and I'm slightly familiar with a few different options. Most of what I found are open source, and I'd like to link to some options from within this Observability page, with possibly full-blown wiki articles describing various options. There are more turnkey, commercial offerings as well, and we could list some of those with links for more information. I actually went with one of those to start off with, mainly so I could learn which features were important to me, before I cobble together some of the more manual options. When I was searching for ways to monitor my personal web projects, I stumbled upon an ad for New Relic, one of the many commercial services. What struck me as interesting, was that most of New Relic's tools are open source (under an Apache 2.0 license, written in Go). They offer 100GB of data upload per month for free, which has been plenty for observing my hobby projects on my VPS. I've already drafted (but not published) PKGBUILDs for some of the tools I've used, mostly from their pre-compiled debs. There are PKGBUILDs in the AUR (like newrelic-cliAUR and newrelic-infraAUR), but I didn't see a Wiki article describing how to use them. Unfortunately Arch Linux isn't currently supported by New Relic, and their method of bootstrapping New Relic using only the newrelic command (part of newrelic-cliAUR) didn't work for me so I've had to follow their dispersed manual instructions. I've run across a few issues so I've gotten onto their forums to seek help. They have community members who provide the first line of support, and for at least one of my issues they've actually created a New Relic support case for it. I even learned about Pressure Stall Information, and wrote my own scripts to monitor and alert when CPU, I/O, or memory pressure gets too high. It's in a public Git repository, but I wanted shore up some of the documentation before I share a link to it anywhere. Would an Arch Wiki article like this be worthwhile? I think it would be, but I didn't want to simply start writing it without having a discussion first. Ectospasm (talk) 18:00, 17 December 2023 (UTC)Reply Installation Recipes Thanks to the rolling release of Arch Linux, I've only actually installed Arch a handful of times. And the Wiki is wonderful in documenting the process. The first time I ever installed Arch, I didn't have another computer to access the wiki, and didn't think to use my phone. I just used separate virtual consoles on the desktop system I was using, and had the wiki loaded in a text mode browser (elinks or lynx, I don't remember which). I may have even enabled GPM so I could copy and paste with my mouse in the Linux console (this part I don't rightly remember). However, each time I've installed Arch I've always wanted something specific, which generally meant searching, following, and backtracking through several Wiki articles to achieve my end. Now that I have a new laptop, and I'm planning on installing Arch on it very soon, I've drafted a "recipe" for myself to follow. I've been told that publishing such a "recipe" is against the spirit of the Wiki, but I'm finding it's a slog to go through all the articles to piece together how I want to do it, especially without planning ahead. I think many Archers might find such "recipes" useful, if only to get ideas for their own systems. I think the format of these "recipes" would need to be debated, as I'm not sure what would be best. We definitely don't want to replicate or repeat sections within the wiki. Here's my proposed format, but I'm not settled that this is the best way to do it. First, start with hardware prerequisites for the recipe. A recipe for a file server or Network Attached Server (NAS) would be different from a laptop, or an x86_64 handheld or mobile device, as would a recipe for a virtual private server (VPS) or other virtual machine. The recipe could go on to describe the partition layout, filesystems, bootloader, network topology and corresponding network manager, etc. The reasoning behind each decision can be explained in whatever detail the author wants. It could then provide a link to a (pseudo-)script that executes it, possibly pausing where the user is intended to make a decision. I'm not familiar with the Archinstall, but if these work well perhaps they could be an optional component of the Archinstall script (this might be getting ahead of myself, though). What would be the proper way to address this kind of documentation, and keep to the spirit of the wiki? Or is this really a bad idea? If it is a bad idea, why would it be so? I mean, such a section in the Wiki could have a disclaimer stating that it is a requirement for readers to understand the installation process, and not blindly follow what's listed. Of course, links back to the Wiki articles describing how to perform each task should be all over these "recipes," I don't think these are a substitute for understanding the installation guide. Maybe the wiki isn't the best place for this; the wiki could collect links to recipes by various users, and the recipes themselves could be hosted on the Arch Linux GitLab instance. Ectospasm (talk) 22:14, 17 December 2023 (UTC)Reply Article about how to optimize for Privacy I know that Arch doesn't want to follow an Ideology like some other distros do, but wants to give everyone any options. But as we do already have an article about how to improve you System towards other goals like Security or Improving performance i think an article, at with at least links to the various ways to improve your system for Privacy would be a good idea. Especially because on many pages like NetworkManager/Privacy or Firefox/Privacy we already have pages about specific applications Privacy related config and if you search beyond arch, especially when it comes to linux system config, you have to look at a bunch of sites and sometimes change things to make them work on arch. SolarpunkJulian (talk) 18:00, 17 September 2024 (UTC)Reply Modification requestsLatest comment: Yesterday at 18:5139 comments18 people in discussion Here, list requests for correction or other modification of existing articles. Only systemic modifications that affect multiple articles should be included here. If a specific page needs modification, use that page's discussion or talk page instead and one of the article status templates. As a rolling release, Arch is constantly receiving updates and improvements. Because of this the Arch wiki must be updated quickly to reflect these changes. Change drive naming/accessing to UUID? Trying to install drives with/out Luks, LVM on internal, external drives is quite complicated currently. Following the ralated articles suggest different ways of reaching the goal. Many different drive name conventions are suggested, eg.: /dev/sda2 /dev/md0 /dev/mapper/md/0 /dev/mapper/vgroup-lvm-root /dev/vgroup-luks/root ... Some of them don't work with portable external drives. This overcomplicates setting up encrypted drives in different situations. My suggestion is, to change all drive related articles to one specific solution of addressing drives universal. Currently I think of UUDI drive naming as a way to go. This would ease the process of drive naming in all kinds of situations: The reader is guided through system setup along one red line Troubleshootiing "no drie found" is strait forward Many sections become clearer to read even when not reading the whole article Articles are easier to write and maintain Beginners have an easier read and geta better idea of how to access drives Accessing internal/external encrypted drives is easy ' LMV or other virtual file systems are easier to describe and setup Ok, I know it is a big suggestion. I wanted to bring it up here, bacause I have the impression that following one primary path would help a lot - everyone involved. It doesn't need to be done in one day. While I think to have one suggested guideline would be a good start. Then with thain mind, we all have it easier to change those sections while Writing/editing Wiki entries. T.ask (talk) 11:22, 30 March 2015 (UTC)Reply Hi, To your own examples above: using an UUID for a /dev/mapper/* device declaration is generally unnecessary (the uniqueness of the device is determined when it is mapped). I think you overestimate the amount of users who actually require setting up the examples where it really matters (e.g. external drives). What I don't understand is why you consider using UUIDs being easier to read/describe. For starters the terribly long UUIDs will break formatting in many cases, e.g. making code blocks in-text not possible. An UUID itself gives no contextual hint, something that a device name does. If you look at the three examples in Persistent block device naming#Boot managers, you really find the UUID one the easiest? I think you are certainly right in that we may lack crosslinks to Persistent_block_device_naming in some articles where it may be important to use an UUID. Maybe we also need an example section to illustrate singular important points in Persistent block device naming and maybe there are individual articles/sections where content should indeed use a form of persistent naming straight away. Suggestion: How about using Talk:Persistent block device naming to assemble '''
year_published = 2024
year_updated = 2024
