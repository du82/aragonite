full_description = '''Main Page From BlogNomic Wiki Jump to navigation Jump to search BlogNomic is a game of Nomic run as a communal weblog, that started in January 2003. Proposals are made as posts to the BlogNomic blog, with votes made as comments on those posts, and the ruleset stored here on the wiki. BlogNomic is played over a number of themed rounds (or "dynasties"), usually presided over by one player as its "Emperor" figure. The Emperor chooses the theme for the dynasty, and is regarded as its caretaker, with the power to veto proposals made during it - this is as close as BlogNomic gets to having anybody in charge. When somebody wins a dynasty, we wipe the ruleset (except for the basic mechanics of voting and proposing) and start a new one with that player as its Emperor. Contents 1 Current game 2 General reference 2.1 Gameplay 2.2 Social media 2.3 Writing 2.4 History 2.5 Useful links 3 Dynastic history 4 Archive 4.1 Older Core Game Documents 4.2 Proposed Core Game Documents Substitutes (2006-2008) 4.3 Switch to blognomic.com (2005) 4.4 Switch from ExpressionEngine to WordPress (2020, ongoing) 4.5 Other 5 Other games played around here Current game The First Dynasty of Raven1207 began on 06 February 2025, with a theme of board game islands. All rules are written in the Ruleset Proposals and other game posts are made on the blog Gamestate is being tracked on Board Game Isle Reports wiki page General reference Gameplay FAQ New Player Guide Community Guidelines Laundry list Mentorships Admin Manual Social media Invite to the BlogNomic Discord BlogNomic Twitter feed BlogNomic Facebook page BlogNomic LiveJournal feed Writing Player essays Blognomic Jargon and Plays Imperial Styles Discussion: Dynasty Ideas Annotated ruleset, explaining the thinking behind some of the game's rules. Various lookup lists of random words and corpora BlogNomic quotes file Site suggestions to suggest ideas for the BlogNomic site History History of victories‎ History of player terms Historical player names Game Changelog — major changes to core gameplay over time (anything a returning player would do well to know) Site Changelog Historical data, including: Graphs of BlogNomic history 2020 Data Analysis BlogNomic Fun Survey BlogNomic Records Category:Display templates — useful wiki templates from past dynasties Useful links BN VioletMonkey Script, which gives links to new comments and automatically tallies votes. (Last updated January 2022. Does not reflect the August 2023 change to Imperial DEFs) Automatic idle-player checker Blogspot archive (2003-2005) recovered by Roujo and 75th Trombone, missing all comments. (Note: the top page of the domain has no content, but the rest of it is there, eg. https://blogspot.blognomic.com/2003) Text Compare tool, useful for checking "reword this entire rule to:" proposals Edit interface for your blog entries, useful for non-admins wanting to delete posts made in error Color Contrast Accessibility Checker to check that blog colour schemes are readable Dynastic history Round One - Pre-Dynasty The First Dynasty of Myke - The Kingdom Dynasty The First Dynasty of Lyndse - The Robin Hood Dynasty The Second Dynasty of Myke - The Agricultural Dynasty The First Dynasty of Kevan - The Orwellian Dynasty The First Dynasty of Anthony - The Mad Emperor Dynasty The First Dynasty of est - The Robot Factory Dynasty The Second Dynasty of Kevan - The Moreau Dynasty The First Dynasty of Damanor - The Galactic Dynasty The Third Dynasty of Kevan - The Thing Dynasty The First Dynasty of Cayvie - The Elemental Dynasty The First Dynasty of Joranj - The Mob Dynasty The First Dynasty of Keitalia - The Superhero Dynasty The First Dynasty of SatyrEyes - The Odyssey Dynasty The First Metadynasty - The Hat Metadynasty The Second Dynasty of Cayvie - The Crashed Spaceship Dynasty The First Dynasty of Brendan - The Office Dynasty The Fourth Dynasty of Kevan - The Petri-Dish Dynasty The First Dynasty of Knightking - The Warlord Dynasty The Firs