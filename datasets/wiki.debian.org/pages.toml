["https://wiki.debian.org/DebianWiki/Contact"]
title = "DebianWiki/Contact - Debian Wiki"
full_description = "Translation(s): English - español - Français - Italiano - Português (Brasil) - Русский - Українська Discussion Contacting Debian Wiki people You want to contact someone at the Debian Wiki? There isn't one single answer to this (because it's a wiki!). For the Press For Visitors For Editors For the Press Since this is a wiki, edited by everyone, you should probably get in touch with Debian's Publicity/Press Department (https://www.debian.org/contact). You could also try the publicly archived Debian Publicity mailing list (https://lists.debian.org/debian-publicity). For Visitors What's your question? You want some help installing/using Debian? Consider using the mailing lists or IRC channels, listed on DebianResources. You have comments/questions about a page? See FeedBack You want to contribute? Contribution on this wiki: You can simply start reading EditorQuickStart. Other contributions to Debian: Visit How can you help Debian? and this. Contact a user (wiki editor): Click on the editor's name. You can send an email if an address is provided, or you can edit the editor's page and add your question at the bottom. Get in touch with people involved in this wiki: Ask your question in the appropriate page (you can create a !PageName/Discussion). or Contact the Content Administrators. Access to wiki.debian.org is blocked with 403 Forbidden Please mail wiki@debian.org with your IP address For Editors Do not expect wiki admins to resolve your disputes (BTW, Wikipedia's Dispute resolution is a useful resource). Lost password? If you have lost your password, please try the password reset option and if that does not work contact the Wiki Administration team. Report a bug? Use the pseudo package wiki.debian.org to report bugs. Restore an image/attachment? Deleted images (and attachments) are destroyed permanently. Got a Great idea? Unless you want to do something that changes how the wiki works, you don't need approval before working on your great idea - go ahead! If your idea involves a major change in the wiki, make a proposal and sample, then ask for comments (on the debian-www mailing list). Admins Please see the FAQ before contacting the admins below. Content Administration Please see the FAQ before contacting the admins below. Currently, there is no official debian-wiki content team. Teams/Webmaster is officially in charge; the mailing list is debian-www and the IRC Channel is #debian-www. The following is a list of people who, while not having special rights, do have an interest in maintaining the wiki as a whole (organization, conventions, etc.). PaulWise Old content admin: AugustinMa, FranklinPiat, madduck, SalokineTerata (sorted alphabetically) Wiki Administration Please see the FAQ before contacting the admins. Anything that involves feature requests (i.e., wiki upgrades), bugs that aren't completely upstream or issues with the wiki that don't involve the content would be fine for contacting the Wiki Admins. debian-www is the best way to contact folks; be aware that this is a public list. If you have anything that you need to discuss with the Wiki Admins but you think it should be private, try <wiki@debian.org> instead. Several of the Wiki Admins are also normally to be found on #debian-www as well. The Wiki Admins belong to wikiadm LDAP group and you can find their debian.org logins and IRC nicks using this command: $ ldapsearch -H ldaps://db.debian.org -x -b 'dc=debian,dc=org' supplementaryGid=wikiadm ircNick System Administration The system administration is handled by the Debian System Administrators (DSA) Team. The Wiki Admins can also coordinate with DSA on stuff they personally have no access to. Requests should be discussed with the Wiki Admins before being submitted to the System Administrators."
year_published = 2025
clearnet = "https://wiki.debian.org/DebianWiki/Contact"
