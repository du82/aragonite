title = "DebianDay - Debian Wiki"
full_description = "Translation(s): English - Italiano - Português (Brasil)- 简体中文 Contents Debian Day by year pages Organize a local Debian Day celebration Curiosa Statistics The Debian Project was officially founded by Ian Murdock on 1993-08-16. The Debian Community celebrates its birthday, Debian Day, on this day each year. (It has also been called Debian Appreciation Day.) There is also a day of activities called a Debian Day (DebianDayDebConf) shortly before or after the yearly Debian Conference, DebConf. Debian Day by year pages You can check if a there is a Debian Day celebration being organized in a city near you and look to past celebrations on the following pages. If there is no information for your location, you are invited to create it. 2024 | 2023 | 2022 | 2021 | 2020 | 2019 | 2018 | 2017 | 2016 | 2015 | 2014 | 2013 | 2012 | 2011 | 2010 | 2009 | 2008 | 2007 | 2006 | 2005 | 2004 Organize a local Debian Day celebration If you want to organize Debian Day for your city, we urge you to follow these instructions: Select a place for the celebration that has: Easy access That have sufficient electrical outlets, if they want to do an install fest. Sponsors: Ideally you should choose sponsors that don't have links to private products. Activities: some activities that you may wish to choose include: Install Fest Key signing party Talks about: Debian Free Software Advertising: If you have made some art for this event, share it with everybody! and put link for it here. Create your Debian Day event page under the country of you're living in. If your city doesn't appear, can create the information necessary in the right space provided. Go to DebianDay 2024 and share your details and links. Curiosa CPAN, the Comprehensive Perl Archive Network, has birthday on the same day. Statistics Country 2004 2005 2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 Australia - - - - - - - - 1 - - - - - Belarus - - - - - - - 1 - - - - - - Belgium - - - - - - - 1 - - - - - - B