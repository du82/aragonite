title = "Compression - Debian Wiki"
full_description = "Translation(s): English - Français - Italiano - 日本語 (Nihongo) - Svenska - 简体中文 - Русский Data compression involves encoding information using fewer bits than the original representation (reducing size). This page is about lossless, general purpose file compression tools. Graphical The following packages provide graphical interfaces to work with most compressed files: file-roller xarchiver ark Command line Many archive file format exist. These command line tools are able to manipulate most file formats: atool p7zip dact upx To work with a specific file type/extension: .7z (7zip package, manual page) .arc (arc package, manual page) .arj (arj package, manual page) .bz2 (bzip2 package, manual page) .cab (Microsoft Cabinet - package, manual page) .lzh .gz (gzip package, manual page) .rar (WinRAR - non-free package) .rz, .rzip (rzip package, manual page) .tar, .tar.bz2, .tbz, .tar.gz, .tgz (tar package, manual page, see also TarBall) .xz (xz-utils package) .zip (zip package, manual page) .zoo (zoo package) See also CategoryFileFormat XZ Backdoor In March 2024, a backdoor was discovered in the 5.6 distribution of XZ Utils. Red Hat assigned CVE-2024-3094 to track the issue. See backdoor in upstream xz/liblzma leading to ssh server compromise on the oss-security mailing list and [DSA 5649-1] xz-utils security update on the debian-security-announce mailing list. See Also TarBall External links https://web.archive.org/web/20000925082746/http://www.linuxheadquarters.com/howto/basic/gz.shtml TODO: merge some pages from CategoryCompression TODO: redirect CategoryCompression here CategorySoftware CategoryCompression CategoryCommandLineInterface"
