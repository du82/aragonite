full_description = 'Translation(s): English - Español - Français - Italiano - 한국어 - Svenska - Português 데비안 프로젝트 뉴스 데비안 프로젝트 뉴스 는 정기적인(현재 격주 기본) 일반적인 데비안에 대한 가장 중요하고 재미있는 뉴스레터입니다. 그것은 DeveloperNews 를 교체하려는 게 아니라 그것을 완성하려는 겁니다. 그 대상은 "평범한" 사용자들이며, 그들은 개발 프로세스나 성공 이야기의 긴 보고서에는 관심 없을 겁니다. 데비안 프로젝트 뉴스 1호 는 2008-04-21 에 나왔으며, 그 때는 Debian Weekly News의 끝과 Alexander Schmehl의 그것을 되살리기 이후입니다. 기여하고 싶다면 contribution page를 읽어보셔오. 글을 쓰고 싶다면, our style guidelines도 읽어보셔오. 현재 쓰이는 워크 플로우 는 관심있는 사람들을 위해 문서화 되었습니다. 메일을 통해: http://lists.debian.org/debian-news/ 웹을 통해: http://www.debian.org/News/project/ RSS를 통해: http://www.debian.org/News/project/dwn CategoryNews CategoryProjectNews'
