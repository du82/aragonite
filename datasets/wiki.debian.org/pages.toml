["https://wiki.debian.org/ru/ProjectNews/HowToContribute"]
title = "ru/ProjectNews/HowToContribute - Debian Wiki"
full_description = '''Translation(s): English - Español - Français - Italiano - Русский ?Discussion Эта страница объясняет КАК помочь Debian ProjectNews и что ВЫ можете сделать, чтобы помочь. Contents КАК внести свой вклад в DPN Присылайте интересные новости Что вам следует присылать Вещи, о которых не следует сообщать Help from native speakers Becoming an editor yourself Accessing the subversion repository Some hints for subversion usage Format of the index.wml file Перевод Debian Project News («Новости проекта Debian») Отслеживание версии оригинального документа Публикация перевода Рабочий процесс перевода КАК внести свой вклад в DPN Внести свой вклад в ProjectNews просто и зависит от ваших умений и времени, которое вы готовы тратить на это. Присылайте интересные новости Самый простой способ помочь, это сообщать нам об интересных событиях, происходящих в мире Debian. Debian очень большой проект, и у нас нет возможности следить за каждым списком рассылки, блогом, новостным сайтом, чтобы отбирать информацию, которую мы бы хотели включить в ProjectNews. Поэтому сообщайте нам, если вы нашли что-то интересное. Вы можете сделать это отправив нам E-Mail на адрес debian-publicity@lists.debian.org . Что вам следует присылать В общем говоря: всё, что может оказать влияние на проект Debian в целом, и на пользователей в частности. Некоторые идеи: Обсуждения, проходившие в списке рассылки, которые: имеют заметное влияние на Debian (например, обсуждение лицензий, запланированное перемещение программного обеспечения) содержат интересное обсуждение отношения проекта А к проекту Б, и т.д.) Небольшие объявления из под-проектов: debian installer готовит к выпуску beta3, требуется тестирование Русский перевод файлов debconf достиг 100% В cdrkit появилась возможность записи blue ray дисков и так далее... Интересные отчёты об ошибках (когда-нибудь смотрели на 245047?) Вы представляете Debian на конференции или выставке (со стендом, выступлением, мастер-классом и т.д.) Вы написали доклад после представления Debian на конференции или выставке У вас брали интервью о вашей работе в Debian Связанные с Debian обзоры / тесты / статьи в других СМИ / веб-сайты / почтовые рассылки / блоги Конференции, mini ?DebConfs, FOSDEM, CeBIT, и т.д. и так далее... Вещи, о которых не следует сообщать Релизах Debian -- мы наверняка уже знаем об этом Конечно, приведённый выше список далеко не полный. Мы хотели бы особо отметить, что мы не можем следить за другими СМИ, веб-сайтами, блогами и всем остальным. Так что очень важно сообщать о всём, что вы думаете было бы уместно в ProjectNews в наш список рассылки debian-publicity@lists.debian.org . Имейте в виду, что кроме того, чтобы наши пользователи были в курсе событий, одна из наших главных задач -- показать им, что мы живое, функционирующее сообщество! Т.е. показать, что Debian растёт и процветает! Help from native speakers Currently the main editor is not a native English speaker. He knows it, and you probably have noticed it, too. So one thing you can help with, as a native speaker, is to fix his en_DE to proper English. The issues are drafted in a Subversion repository. Details on how to access using a Subversion client are listed below in the "Becoming an editor yourself" section. Even if you are unfamiliar with Subversion, you can always download the current issue, review it, and mail comments to the debian-publicity mailing list. We would prefer to receive your changes as diff or wdiff, if possible: Just make a copy of the downloaded file, edit it, and send us the output of diff -u <oldfile> <newfile>. Becoming an editor yourself If you want to contribute directly and want to add small articles to the ProjectNews yourself, feel free to join the team: You really should subscribe to the debian-publicity mailing list at http://lists.debian.org/debian-publicity, as all discussion is held there. You may also want to subscribe to the publicity-commits mailing list at http://lists.alioth.debian.org/mailman/listinfo/publicity-commits. Everytime a change is committed to our subversion repository a mail is sent to that list. So it's very easy to stay up to date. If you are already a Debian Developer you should already have write access to the subversion repository. If you are not a Debian Developer, you need an account on Alioth. If you already have one, you can just request to join the publicity project. If you don't have one, please register on Alioth and then request to join the publicity project. At this point, you really should read our Guidelines for ProjectNews articles. Accessing the subversion repository DPN issue in preparation can be browsed via viewvc Before accessing the subversion repository, you might want to read ?Setting up SSH the first time to use the subversion repository on alioth more conveniently. run svn co svn+ssh://svn.alioth.debian.org/svn/publicity/dpn/en/current. This command will create a current folder containing the current draft the Debian Project News. If you like, you may rename that folder into something more convenient for you. Change into that directory. Whatever you do: never delete or otherwise touch the .svn folder therein! It contains some meta data needed to let everything work properly. You can now edit the Debian Project News. Don't worry if you are unexperienced with subversion or the Website Meta Language / HTML (which is used for Debian's website). Nothing you do will directly appear on the website and all errors you might do can be revoked relatively painlessly. Editing Change into the folder containing the checkout. Unless you renamed it, that would be current. Before editing, you should run svn update. This will get your local copy up to date. You may now edit index.wml as you like. See below for details on the format. After you changed index.wml, please run svn update again. Just in case someone changed that document while you where working on it. Subversion tries to be smart, when applying foreign changes to your changed document. Unless you changed the very same line, everything should work out pretty fine. Should you have changed the very same lines, you have created a so called conflict, which must be resolved. Please see the svn book on how to do so. Once your local copy is up to date, you can send your changes to the central repository by running svn -m "description of your changes" commit index.wml. Congrats you just contributed to next issue of the Debian Project News! Also note, that there are several graphical front ends for subversion. But as the writer lacks experience with any of them, he can't recommend them. Two more guidelines for committing your changes: Please use a useful commit message (the description of your changes behind the "-m" Parameter). Try not to write too long lines. Tracking changes / viewing diffs is easier, when the line length is shorter than ~80 characters. Most Editors can be configured to automatically break the line for you. Some hints for subversion usage Keyword expansion and subversion To use the translation check header (which makes it possible for translators to mark which revision of a file they followed when translating) the wml-Files must have the respective svn keywords properties set. So you can place $Id:$ in a document, and subversion will automatically replace it with some information about who did the last changes, when and which revision this document is now. So before committing a new wml file to the repository, please use the following to allow keyword expansion: svn propset svn:keywords "Date Author Id Rev" <yourfile>. You can also add the following line to the [auto-props] section of your ~/.subversion/config and uncomment the enable-auto-props = yes entry which should take care of that automatically: *.wml = svn:keywords="Author Date Id Rev URL"; Format of the index.wml file The Debian Project News are available in three formats: As e-mail sent to the debian-news mailing list (in text form) As HTML version from Debian's website. As RSS feed. All these formats are generated from the index.wml file. Debian's website uses the website meta language (WML) to create the web pages. Roughly speaking WML is HTML with embedded macros (e.g. for common elements on various sites) and the possibility to embed perl scripts, e.g. to create a list of DPN issues based on the available files. But don't worry: you don't need to know WML or perl (and only basic HTML) to contribute to the DPN. Luckily nearly everything is already in place and we just need to create the content with minimal HTML markup. If you look at an empty index.wml (you can look at this one which is used as a template) you'll notice that it starts as follows: #use wml::debian::projectnews::header PUBDATE="2010-XX-XX" SUMMARY="" #use wml::debian::acronymsThe first line says to the wml compiler that it should use the project-news template for the header. It also sets two variables for the publishing date and a small summary. The summary is used for example at the index page for recent issues. It shouldn't be too long. The acronyms line allows the use of specific acronyms, which will show the explanation as a hover text over the acronym. At the end you'll see something similar to this: #use wml::debian::projectnews::footer editor="XXX, XXX, Alexander Reichle-Schmehl"That tells the wml compiler to add the normal footer to the web page. With the editor variable, it will also add the names of the contributors listed there. Everything between these lines, is regular HTML, which in our case mostly means: some headlines (<h2>...</h2>), some paragraphs (<p>...</p>) and some lists (<ul><li>...</li><li>...</li></ul>). Every article should start with a headline: <a name="1"></a> <h2>This is the headline of my small article</h2>The stuff between the <h2> and </h2> is the actual headline. The <a name="x"></a> creates a so called anchor used to directly jump to a specific entry. It's for example used in the RSS-feed. After that follows the actual article between <p> and </p>. You may use several of these paragraphs, but note that only the first one will appear in the RSS-feed. (Which might be a bug worth fixing, if you know enough perl...) As explained, you may use normal HTML in these paragraphs. This means: <q>...</q> for quotes, citations or release names: Debian 6.0 <q>squeeze</q>, Steve McIntyre said: <q>Booh!</q> <a href="..."> for links: The Secretary <a href="http://lists.debian.org/debian-devel-announce/2010/03/msg00000.html">called for nominates</a> for the project leader elections. <!-- ... --> for comments, which won't appear on the website: {<!-- TODO: Add a link once this discussion has come to a conclusion! --> As the Project News is also read by users not very familiar with the Debian internal jargon and acronyms, please also use the <acronym ...> </acronym> tag (not part of HTML but one of our wml templates). See the following example: One topic discussed was: <q>Race against <acronym lang="en" title="None of the above">NOTA</acronym>.</q>While it won't work in the text version for e-mails, at least the HTML version for the websites and the RSS feed will mark the acronym so, that when the user moves the mouse cursor over the acronym the explanation is displayed. You can see an example on http://www.debian.org/News/project/2009/02/ (search for DPL). Перевод Debian Project News («Новости проекта Debian») Вы также можете использовать репозиторий Subversion для переводов. В этом случае проще всего получить копию всей структуры DPN из репозитория Subversion выполнив: svn co svn+ssh://svn.alioth.debian.org/svn/publicity/dpn/ cd dpn Затем проверьте, существует ли уже директория для вашего языка. Если нет Создайте её выполнив, например, mkdir ru Добавьте её в репозиторий выполнив svn add ru И зафиксируйте изменения в центральном хранилище выполнив svn commit -m "create directory for russian translations" ru Теперь вы можете создать структуру аналогичную директории en. Прошлый выпуски хранятся в директории вида en/<год>/<выпуск>. Текущий выпуск, над которым ведётся работа, хранится в директории en/current. Также существует файл en/index.wml-template — шаблон, используемый при создании новых выпусков. Смотрите раздел Becoming an editor yourself чтобы узнать некоторые правила использования репозитория и небольшое описание формата wml-файлов. Но обратите внимание! В переводах должен использоваться заголовок #use wml::debian::translation-check translation="<ревизия>" для обозначения номера ревизии оригинального выпуска, который переводится. Как и поле editor в строке #use wml::debian::projectnews::footer переводчики также могут добавить поле translator для указания имени переводчика. Вот пример: #use wml::debian::projectnews::footer editor="Moritz Muehlenhoff, Andre Felipe Machado, Alexander Reichle-Schmehl" translator="Benedikt Beckmann" Отслеживание версии оригинального документа Вы можете использовать скрипт scripts/trans-check для отслеживания актуальности ваших переводов. Для этого вы должны включить в заголовок документа поле translation-check. Например: #use wml::debian::translation-check translation="45"Это сообщит скрипту (а позже сайту Debian), что ваш перевод основан на 45-ой ревизии ориигнального документа. Единственный параметр который вам необходимо передать скрипту это язык, который вы хотите проверить (сравнение будет производиться с фалами в директории en/). Смотрите следующий пример: alex@rusalka:publicity/dpn$ scripts/trans-check ru Found 'ru/current/index.wml' is outdated! Please run 'svn diff -r 9:18 "en/current/index.wml"' to review the changes to the original document. Публикация перевода Как было коротко сказано в разделе Формат файла index.wml, выпуски Debian Project News публикуются в трёх видах: HTML на сайте Debian RSS ленты (также на сайте Debian) Текстовое письмо, отправляемое в различные списки рассылки Чтобы опубликовать перевод на веб-сайте Debian необходимо добавить его в репозиторий CVS. Подробную информацию смотрите на странице http://www.debian.org/devel/website/. Перед отправкой перевода в виде письма в один из наших списков рассылки пользователей обратите внимание на то, что рассылки debian-news-язык модерируемые, поэтому свяжитесь с их модераторами или вашей командой локализации (например через рассылку debian-l10n-язык). Если рассылка debian-news-язык отсутствует для вашего языка, но существует рассылка debian-user-язык, вы можете отправить перевод в эту рассылку (если ей участники не против). Независимо от того, куда вы собираетесь отправлять перевод, вы можете использовать скрипт scripts/DPNhtml2mail.pl. Когда ваш перевод доступен на веб-сайте, вы можете запустить его, и он создаст текстовую версию перевода. Вы можете вызывать его примерно так: scripts/DPNhtml2mail.pl -d -l en -i 2008/06. Он не работает идеально (ещё), но с его помощью достаточно легко сделать приятного вида тектовую версию. Рабочий процесс перевода В этом разделе описан текущий рабочий процесс, используемый французской командой для перевода и публикации Debian Project News'''
year_published = 2025
clearnet = "https://wiki.debian.org/ru/ProjectNews/HowToContribute"
