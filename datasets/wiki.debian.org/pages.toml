title = "DebianForNonCoderContributors - Debian Wiki"
full_description = "Translation(s): English - Español - Français - Português (Brasil) Contents Is there a place for contributors other than developers? Translators Web Designers, Artists, Navigational and Usability experts, Copywriters Artists, Graphics Man, artwork Lawyers, Accountants from all countries Journalists, Copywriters, Marketeers, Branding experts Event Promoters, Caterers, Host(ess) Technical documentation writers Users and Developers Social human behaviour experts Resources for knowing a bit more about Debian Project culture: Is there a place for contributors other than developers? The Debian Project needs many kinds of human knowledge. On this page we list SOME examples and starting points. This list is not exhaustive. Please read How to Help Debian Project. Whatever skills you have, ask at user's lists http://lists.debian.org for guidance and include it here. More suggestions of how to help without coding. Translators I18n http://lists.debian.org/i18n.html L10n Web Designers, Artists, Navigational and Usability experts, Copywriters DebianWebSiteProject Artists, Graphics Man, artwork DebianArt Lawyers, Accountants from all countries http://lists.debian.org/debian-legal/ Journalists, Copywriters, Marketeers, Branding experts http://lists.debian.org/debian-publicity/ Event Promoters, Caterers, Host(ess) Promote CategoryEvents Technical documentation writers DebianDocumentation http://www.debian.org/doc/ddp Users and Developers BugTriage Social human behaviour experts The objectives are: Helping to solve flamewars. Debian is attempting to create a 'social committee' to address interproject personal conflicts. If you have experience in mediation or have suggestions for a conflict-resolution process, please email the debian-project mailing list or the Debian project leader ( leader@debian.org ) for more private issues. Resources for knowing a bit more about Debian Project culture: Debian Diversity Statement Debian Community Guidelines: a series of tips on how to interact in Debian http://lists.debian.org/users.html Scientific study about Debian Project governance and social organization http://www.techforce.com.br/content/scientific-study-about-debian-project-governance-and-social-organization A New User Guide to Linux Communities http://linux-blog.org/index.php?/archives/247-A-New-User-Guide-to-Linux-Communities.html Community"
