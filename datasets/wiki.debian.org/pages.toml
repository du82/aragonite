["https://wiki.debian.org/BashColors"]
title = "BashColors - Debian Wiki"
full_description = '''Translation(s): English - Русский bash is a Unix shell written for the GNU Project. Its name is an acronym for Bourne-again shell, a pun ('Bourne again' / 'born again') on the name of the Bourne shell (sh), an important early Unix shell written by Stephen Bourne and distributed with Version 7 Unix circa 1978. bash was created in 1987 by Brian Fox. In 1990, Chet Ramey became the primary maintainer. bash is the default shell on Debian. Its output can be colorized to increase human readability. Add the following contents to the system-wide configuration file /etc/bash.bashrc or the user's ~/.bashrc, using your preferred text editor: export LS_OPTIONS='--color=auto' eval "`dircolors`" alias ls='ls $LS_OPTIONS'Apply changes by executing the command ~$ source /etc/bash.bashrc; source ~/.bashrcOr by executing ~$ exec bashNow test to make sure that changes were applied ~$ lsThe output of commands should appear in color. Links Why is Debian's default bash shell colourless? (StackExchange) CategorySoftware CategorySystemAdministration CategoryCommandLineInterface'''
