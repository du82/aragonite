title = "es/ProjectNews - Debian Wiki"
full_description = 'Traducción(es): English - Español - Français - Italiano - 한국어 - Svenska - Português Las Noticias del Proyecto Debian en Español Las Noticias del Proyecto Debian en Español (lists.debian.org/debian-news-spanish/) son un boletín vía correo electrónico con las noticias más importantes e interesantes acerca de Debian en general, resultado de la traducción de Las Noticias del Proyecto Debian en Inglés, con una publicación periódica (actualmente la publicación es cada 2 semanas). Son similares a las antiguas Noticias Semanales de Debian (Debian Weekly News). No son un intento por reemplazar news.debian.net o Developer News sino que son complementarios. La audiencia a la que están dirigidas son usuarios "comunes", quienes no están interesados en los detalles del proceso de desarrollo o en largos reportajes de historias exitosas. Si le interesa colaborar, por favor lea la página sobre como contribuir. Si te gustaría ayudar escribiendo artículos, por favor también lea nuestras directrices de estilo. Alexander (el editor principal de Las Noticias del Proyecto Debian) ha documentado su flujo de trabajo utilizado actualmente para los interesados. Vía correo electrónico: http://lists.debian.org/debian-news-spanish/ en español http://lists.debian.org/debian-news/ en inglés Vía Web: http://www.debian.org/News/project/ Vía RSS: http://www.debian.org/News/project/dwn CategoryNews CategoryProjectNews'
