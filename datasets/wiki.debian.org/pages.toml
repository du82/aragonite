full_description = '''Translation(s): English - Español - Français - Italiano - 한국어 - Português - Português (Brasil) - Svenska - Українська Le Debian Project News Le Debian Project News sono una newsletter con le notizie più importanti e interessanti riguardo a Debian in generale, fornite regolarmente (attualmente ogni due settimane). Non sono pensate per sostituire le Developer News, ma per affiancarle. Sono pensate per un pubblico di utenti "regolari" che possono non essere interessati ai dettagli del processo di sviluppo o a lunghi rapporti su storie di successo. Il primo numero delle Debian Project News è stato pubblicato il 21 aprile 2008, dopo la fine delle Debian Weekly News e dopo l'invito di Alexander Schmehl a farle rivivere. Se si desidera contribuire, leggere la pagina sui contributi. Se si desidera aiutare alla stesura di articoli, leggere anche le linee guida per lo stile. Per coloro che sono interessati è documentato l'attuale flusso di lavoro. Via posta: debian-news mailing-list Via web: https://www.debian.org/News/project/ Via RSS: https://www.debian.org/News/project/dwn CategoryNews CategoryProjectNews'''
