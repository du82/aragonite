full_description = 'Translation(s): العربية - বাংলা - Brasileiro - English - Español - Français - Indonesia - Italiano - 日本語 - Melayu - Русский - Svenska - 简体中文 ?Discussion Bienvenido a la Interfaz de linea de órdenes de Debian Este portal habla sobre el uso en Debian de la línea de órdenes, llamada también CLI («Command Line Interface»). Este portal puede utilizar lenguaje técnico. Manual de Debian - Capítulo 1. Tutoriales de GNU/Linux Un interfaz de línea de órdenes (CLI) es un medio para interactuar con un programa de ordenador en el que el usuario (o cliente) da órdenes al programa en forma de lineas de texto sucesivas (líneas de órdenes). El programa que hace de interfaz se llama intérprete de líneas de órdenes o Shell. La shell Interfaz de línea de órdenes ShellConfiguration, Zg2ShellStartup - Ejemplo de configuración de bash ShellScript ShellTricks ShellCommands ( CategoryRedundant: divide ShellToolTricks, PrincipalCommands y coreutils) Bash CommandLine es/terminal, TerminalEmulator Console - ¿Como sobrevivir en una consola? La Manera Unix Enlaces externos: Bash Definición Shell Definición Comparison_of_computer_shells http://www.spack.org/wiki/InTheBeginningWasTheCommandLine - Tutorial https://gna.org/projects/mbfl - Biblioteca de funciones bash de marco http://linux.org.mt/article/terminal - Terminal http://www.tldp.org/LDP/abs/html - Guía avanzada de bash scripting. http://www.tldp.org/LDP/Bash-Beginners-Guide/html/index.html - Guía de bash para principiantes http://linuxcommand.org/ - "¿Cansado de cambiar tus temas de escritorio?. ¿Te quedas mirando esta cosa llamada "terminal"? ¿Ahora qué? http://web.archive.org - The history of unix shells CategoryPortal | CategoryCommandLineInterface'
