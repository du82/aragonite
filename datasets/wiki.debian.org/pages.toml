["https://wiki.debian.org/it/ProjectNews/Workflow"]
title = "it/ProjectNews/Workflow - Debian Wiki"
full_description = '''Traduzioni: English - Español - Italiano Questa pagina documenta l'attuale flusso di lavoro usato per fare la bozza, modificare e pubblicare le uscite delle Debian Project News. Notare che qui di seguito è indicato solo il flusso di lavoro ideale. Per impegni dei redattori o per eventi improvvisi (ad esempio quando un ftp-master chiede di ritardare l'uscita di numero di un paio di ore in modo da potervi menzionare il messaggio che sta per mandare) la tabella di marcia può essere dilatata. Flusso di lavoro attuale (Come messo in pratica più o meno da Alexander.) Dopo ogni uscita git.debian.org/git/publicity/dpn.git/en/current viene spostato nella posizione corretta (es. 2017/04). Quindi viene creata una nuova cartella current e vi viene copiato index.wml-template, per iniziare con un numero delle notizie nuovo e pulito. Durante questo periodo il campo "Status" nelle intestazioni è impostato a "open-to-edit" (aperto alle modifiche). Coloro che contribuiscono possono ora aggiungere notizie al numero nella cartella current: Vengono aggiunti messaggi di blog interessanti. Vengono aggiunti collegamenti a discussioni interessanti in una delle mailing-list Debian. Se viene rilasciato un avvertimento di sicurezza viene considerato se inserirlo, in base più o meno all'importanza del pacchetto e al numero stimato di installazioni. Vedere HowToContribute per istruzioni su come farlo. Alcuni giorni prima di quello in cui verrà rilasciato il nuovo numero, sono scritti i restanti testi nei modelli: Vengono aggiunti i pacchetti nuovi e degni di nota. Vengono inseriti i numeri dai rapporti del WNPP. Vengono inserite le statistiche sui bug critici per il rilascio. Vengono aggiunti nell'ultima riga i nomi di chi ha contribuito a quel numero (nel campo "Editor" di #use wml::debian::projectnews::footer e nell'elenco dei detentori del copyright all'inizio. Viene controllata la numerazione dei paragrafi per assicurare che i feed RSS funzionino correttamente. Gli script per fare quanto detto sono disponibili su git.debian.org/git/publicity.git/dpn/scripts A questo punto il numero viene congelato per dare ai traduttori il tempo di portarsi in pari con il lavoro (e ai madre lingua di correggere gli errori rimanenti). Il campo "Status" nell'intestazione viene impostato a "string-frozen". Viene richiesta una revisione su debian-l10n-english e tranduzioni su debian-i18n VECCHIO!!!: Vengono richieste le traduzioni su progetto di traduzione delle DWN / "dovunque sia"? Il giorno in cui viene rilasciato il numero: Il numero viene aggiunto all'archivio del sito web di Debian (lunedì mattina) Una volta che il sito web è stato ricompilato (molto probabilmente intorno a mezzogiorno), è anche disponibile come RSS Dopo di chè il delegato di Publicity in carica invia la versione via posta elettronica alla mailing-list debian-news (e i traduttori possono fare lo stesso nelle loro mailing-list). Imposta il campo "Status" nell'intestazione a "sent" (inviato). Problemi con il flusso di lavoro attuale http://packages.debian.org/unstable/main/newpkg elenca solo i pacchetti degli ultimi sette giorni, mentre le DPN escono non così frequentemente Notare che sebbene le informazioni mancanti non siano mostrate, sono disponibili. Patch per mostrarle (es. aggiungendo un parametro addizionale) sono le benvenute. A richiesta possono essere forniti suggerimenti su da dove partire -- ?FrankLichtenheld Lo farò, tempo permettendo; per adesso ho "risolto" con 00 12 * * 1 /home/alex/bin/newpkgs | mail -s "New package report" alexander@schmehl.info nel mio crontab ... Vedere anche: Debian Project News Come contribuire alle DPN Linee guida per le DPN CategoryProjectNews'''
year_published = 2025
