["https://wiki.debian.org/BourneShell"]
title = "BourneShell - Debian Wiki"
full_description = '''This page is about Bourne shells compatible script interpreters (bash, dash, busybox, etc..) Testing for compatibility Consider testing your script with various Bourne compatible shell interpreters. dash is a simple, POSIX compliant, shell interpreter. busybox is used in Debian installer (attention, some features can be disable at compile time). It may contain its own implementation of grep, sed, etc.. Differences between implementation Bash : Major differences from the Bourne Shell . http://www.gnu.org/software/bash/manual/... Internationalizing shell scripts The Internationalization of shell scripts can be achieved by multiple means : Use variables with strings. . http://www.hedden-information.com/translation-services/Internationalizing-UNIX.htm Use Bash's $"sample" syntax. . http://www.gnu.org/software/bash/manual/bashref.html#Locale-Translation (example: http://lists.debian.org/debian-i18n/2002/05/msg00018.html Use gettext . http://lists.debian.org/debian-i18n/2002/05/msg00019.html See Also Bash Beginner's Bash (and compatibles) . http://linux.org.mt/article/terminal Bash (and compatible) Guide for Beginners http://www.tldp.org/LDP/Bash-Beginners-Guide/html/index.html. Wikipedia's Bourne_shell CategoryCommandLineInterface | CategoryRedundant: merge with ShellCommands/Bash/other shell pages'''
