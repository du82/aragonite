title = "el/ProjectNews/Issues/Current - Debian Wiki"
full_description = '''Translation(s): none ?/Discussion Νέα του Debian Project http://www.debian.org/News/project/2009/03 Νέα του Debian Project - 24 Φεβρουαρίου, 2009 Καλώς ήρθατε στο τρίτο τεύχος των Νέων του Debian Project (DPN), του δελτίου ειδήσεων για την κοινότητα του Debian. Θέματα που καλύπτονται σ' αυτό το τεύχος περιλαμβάνουν: ... και πολλά άλλα. TODO: Summarize noteworthy articles from http://times.debian.net/ Mention upcoming events Add new and noteworthy packages from http://packages.debian.org/unstable/main/newpkg (done by a script directly creating HTML) 4.0 Point release http://www.debian.org/News/2009/20090210 Debian Project seeks Hardware Donations http://www.debian.org/News/2009/20090208 Might be interesting: German schools pilot remote virtual Debian/KDE desktops http://www.debian-news.net/2009/02/11/german-schools-pilot-remote-virtual-debiankde-desktops/ Debian Lenny, coming Real Soon Now! Interview with "Steve ?MacIntyre" http://www.debian-news.net/2009/02/12/debian-lenny-coming-real-soon-now/ Άλλες Ειδήσεις The Xth issue of the miscellaneous news for developers has been released and covers the following topics: New Developers X applicants have been accepted as Debian Developers since the prior issue of the Debian Project News. Please welcome Foo, Bar and Baz in our project! Important Debian Security Advisories Debian's Security Team recently released advisories for these packages (among others): gnutls, typo3 and phpmyadmin. Please read them carefully and take the proper measures. Please note that these are a selection of the more important security advisories of the last two weeks. If you need to be kept up to date about security advisories released by the Debian Security Team, please subscribe to the security mailing list for announcements. New and noteworthy packages The following packages were added to the unstable Debian archive recently (among others): Debian Package of the Day featured the packages vnstat (a console-based network traffic monitor) and bar. Work-needing packages Currently x packages are orphaned and y packages are up for adoption. Please take a look at the recent reports to see if there are packages you are interested in or view the complete list of packages which need your help. Want to continue reading DPN? Please help us create this newsletter. We still need more volunteer writers to watch the Debian community and report about what is going on. Please see the contributing page to find out how to help. We're looking forward to receiving your mail at debian-publicity@lists.debian.org. X, Y and Z contributed to this issue of the Debian Project News. CategoryProjectNews'''
