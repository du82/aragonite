["https://wiki.debian.org/pt_BR/ProjectNews/HowToContribute"]
title = "pt_BR/ProjectNews/HowToContribute - Debian Wiki"
full_description = '''Translation(s): English - Español - Français- Italiano - 한국어 - Português - Português (Brasil) Como contribuir Esta página explica como contribuir com as Notícias do projeto Debian (Debian ProjectNews) e o que VOCÊ pode fazer para ajudar. Contents Como contribuir Como contribuir para a DPN Envie notícias interessantes O que você deveria enviar Coisas que não precisam ser relatadas Ajuda de falantes nativos(as) Tornando-se um(a) editor(a) Acesso ao repositório Git DPN Formato do arquivo index.wml Traduzindo as Notícias do projeto Debian Traduzindo os Bits do Debian Uso do "Translation check" para seguir as versões originais do documento (FIXME: seção desatualizada) Publicando sua tradução Fluxo de trabalho de tradução Como contribuir para a DPN Contribuir para as Notícias do Projeto é fácil, mas depende das suas habilidades e do tempo disponível para se dedicar. Por favor, observe que todo o material fornecido ao repositório publicity (publicidade) (isto, é, as suas contribuições) será publicado no site web Debian sob os termos das licenças MIT (Expat) ou GPL2+ Envie notícias interessantes O modo mais simples de nos ajudar é informar sobre acontecimentos interessantes que ocorrem no universo Debian. O Debian é um projeto bastante grande e não possuímos recursos humanos necessários para acompanhar os conteúdos em todas as listas de correio, blogs e sites de notícias, e adicioná-los às nossas Notícias do Projeto. Assim diga-nos se reparar em algo interessante que esteja acontecendo. Você pode fazer isso através do envio de um e-mail em inglês para debian-publicity . O que você deveria enviar De um modo geral: tudo o que possa ter algum impacto significante sobre o projeto Debian em larga escala, em particular aquilo que se relaciona com sua base de utilizadores(as). Algumas ideias: Discussões que ocorram numa lista de discussão, que: tenham um impacto significativo no Debian (por exemplo, discussões sobre licenças, uma transição programada de software) contenham um debate interessante relativo ao Projeto X e Projeto Y Resoluções Gerais, etc.) Pequenas divulgações de subprojetos: instalador debian perto do lançamento da versão beta3, testes necessários traduções debconf no idioma Francês atinge 100% cdrkit é capaz de gravar discos blue ray e-mail de "Notícias de " etc... Relatórios de erros interessantes (você já deu uma olhada no 245047?) Representando o Debian numa conferência ou exibição (com um estande, palestra, oficina, etc.) Você redigiu um relatório depois de ter representado o Debian numa conferência ou exibição Você foi entrevistado(a) sobre o seu trabalho no Debian Análises / testes / artigos sobre o Debian em outras mídias / sites web / listas de discussão / blogues Conferências, mini ?DebConfs, FOSDEM, CeBIT, etc. etc... Coisas que não precisam ser relatadas Lançamentos Debian -- provavelmente já sabemos Claro que a lista acima está longe de estar completa. Gostaríamos de salientar que não podemos monitorizar outras mídias, sites web, blogues e todo o resto. É assim valiosíssimo que seja sinalizada qualquer coisa que se encaixe nas Notícias do projeto, enviando para a nossa lista de e-mails debian-publicity . Tenha em mente que para nós um dos objetivos principais, além de manter os(as) utilizadores(as) informados(as), é mostrar que somos uma comunidade viva e trabalhadora! Ou seja, mostrar que o Debian é vibrante, que está vivo! Ajuda de falantes nativos(as) Atualmente o editor principal não é falante nativo do inglês. Ele sabe-o e provavelmente você já reparou isso. Portanto, uma das coisas em que você pode ajudar como falante nativo(a) é corrigir o en_DE dele para o inglês correto. As publicações são redigidas em um repositório Git. Detalhes de como acessar usando um cliente Git encontram-se abaixo na seção "Tornando-se um(a) editor(a)". Mesmo que você não tenha familiaridade com o Git, sempre pode-se baixar a publicação atual a partir do repositório DPN em inglês, revisá-la e enviar comentários em inglês para a lista de discussão debian-publicity. Preferiríamos receber as suas alterações como diff ou wdiff, se possível: apenas faça uma cópia do arquivo baixado, edite-o e envie-nos o resultado do diff -u <arquivo_antigo> <arquivo_novo>. Tornando-se um(a) editor(a) Se desejar contribuir diretamente e adicionar pequenos artigos às Notícias do projeto, sinta-se livre para se juntar à equipe: Você realmente deverá subscrever a lista de discussão debian-publicity em http://lists.debian.org/debian-publicity, já que toda a discussão ocorre lá. Você também pode subscrever o pseudopacote press em https://tracker.debian.org/pkg/press. Toda vez que uma alteração é feita em nossos repositórios Git, você receberá notificações por e-mail, então é muito fácil ficar atualizado(a). Veja https://lists.debian.org/debian-publicity/2018/04/msg00001.html para os passos específicos a seguir. Se for um(a) desenvolvedor(a) Debian, você já deve ter acesso de escrita ao repositório Git. Se não for um(a) desenvolvedor(a) Debian, você pode enviar suas propostas para a lista de discussão ou usar sua conta Salsa para enviar contribuições. Se não tem uma conta Sala e quer criá-la, por favor registre-se no Salsa. Se você já tem uma conta e gostaria de fazer contribuições no longo prazo, faça login na plataforma Salsa do Debian com sua conta e então solicite seu ingresso no projeto publicity (publicidade) ao clicar no botão "Request Access" (Requisite Acesso) no meio da página principal da Equipe de Publicidade no Salsa. Você é encorajado(a) a escrever na lista de discussão debian-publicity uma apresentação sua que que a coordenação do DPN possa te conhecer e aprovar sua requisição de ingresso. Se você já tem uma conta, mas veio aqui somente para fazer contribuições esporádicas, você pode fazer um fork do repositório e submeter Merge Requests para a gente. Neste ponto, você realmente deveria ler nossas Diretrizes para artigos nas Notícias do Projeto. Acesso ao repositório Git DPN A publicação DPN em preparação pode ser vista através do ?nosso repositório Git no Salsa Antes de acessar o repositório Git, você poderá querer ler a documentação do Salsa para usar o repositório Git mais convenientemente. execute git clone git@salsa.debian.org:publicity-team/dpn.git. Este comando irá criar um diretório dpn contendo as Notícias do Projeto Debian. A versão atual está no subdiretório current do diretório dpn. Se quiser, você pode mudar o nome daquele diretório para algo que lhe seja mais conveniente. Entre naquele diretório. Qualquer coisa que faça: nunca apague ou altere o conteúdo do diretório .git! Ele contém alguns metadados necessários para que tudo funcione corretamente. Agora você pode editar as Notícias do Projeto Debian. Não se preocupe se não tem muita experiência com Git ou com a metalinguagem de sites web WML/HTML (que é usada para o site web Debian). Nada que faça aparece diretamente no site e todos os erros que possa fazer podem ser desfeitos com relativa facilidade. Acesso anônimo ao repositório Git Se não possuir uma conta Salsa, você pode acessar o repositório Git anonimamente. Você pode verificar o rascunho atual das Notícias do projeto Debian utilizando o comando: git clone https://salsa.debian.org/publicity-team/dpn.git. Este comando criará um diretório dpn contendo as Notícias do projeto Debian. O último rascunho encontra-se no diretório dpn/current. Edição Mude para o diretório contendo o checkout. A não ser que tenha alterado o nome, deverá ser dpn. Antes de editar, você deve executar git pull. Isso atualizará a sua cópia local. Agora pode editar index.wml à vontade. Veja abaixo para detalhes sobre o formato. Submeta as suas alterações com git commit index.wml Depois de alterar o index.wml, por favor execute git update --rebase para o caso de alguém ter modificado o documento enquanto você estava trabalhando nele. O Git tenta ser inteligente quando se aplica alterações exteriores ao seu documento modificado. A não ser que tenha modificado a mesma linha, tudo deverá funcionar corretamente. Se modificou as mesmas linhas, você terá criado um "conflito", que tem que ser resolvido. Por favor veja esta página para saber como proceder. Assim que a sua cópia local esteja atualizada, você pode enviar suas alterações para o repositório central executando git push. Parabéns, você acabou de contribuir para a próxima publicação das Notícias do projeto Debian! Note também que existem diversas interfaces gráficas para o Git. No entanto, como quem escreveu este artigo não tem experiência com qualquer um deles, não as recomenda. Mais duas recomendações para submeter suas alterações: Por favor use uma mensagem de commit útil (a descrição das suas alterações após a opção "-m"). Tente não escrever linhas muito longas. O monitoramento de alterações / visualização de diffs é mais simples quando o comprimento da linha é inferior a 80 caracteres. A maior dos editores de texto podem ser configurados para quebrar a linha automaticamente. Formato do arquivo index.wml As Notícias do projeto Debian estão disponíveis em três formatos: Como um e-mail enviado para a lista de discussão debian-news (em formato texto) Como versão HTML do site web do Debian. Como feed RSS. Todos estes formatos são gerados a partir do arquivo index.wml. O site web do Debian utiliza a metalinguagem de website (website meta language - WML) para criar as páginas web. Grosso modo, WML é HTML com macros embutidas (por exemplo, para elementos comuns em vários sites) e com possibilidade de embutir scripts perl, por exemplo para criar uma lista de publicações DPN baseada nos arquivos disponíveis. Mas não se preocupe: você não tem que saber WML ou perl (apenas HTML básico) para contribuir para o DPN. Com alguma sorte tudo já estará em seu devido lugar e apenas teremos que criar o conteúdo com o mínimo de marcações HTML. Se olhar para um arquivo index.wml vazio (você pode olhar para este que é usado como modelo) notará que começa da seguinte forma: #use wml::debian::projectnews::header PUBDATE="2017-MM-DD" SUMMARY="" #use wml::debian::acronymsA primeira linha diz ao compilador wml que deverá utilizar o modelo do project-news para o cabeçalho. Define também duas variáveis para a data de publicação e um pequeno sumário. O sumário é utilizado por exemplo na página de índice das publicações recentes. Não deverá ser muito longo. A linha acronyms permite o uso de acrônimos específicos, que mostram uma explicação quando da passagem do cursor sobre o texto do acrônimo. No final do arquivo deverá ver algo similar a isto: #use wml::debian::projectnews::footer editor="The Publicity Team with contributions from contributor1, contributor2, contributor3"Esta linha diz ao compilador wml para adicionar um rodapé normal à página web. A variável editor adicionará os nomes dos(as) contribuidores(as) listados(as) no documento. Tudo o que está entre estas linhas é praticamente HTML regular, o que no nosso caso significa basicamente: alguns títulos (<toc-add-entry>...</toc-add-entry>), alguns parágrafos (<p>...</p>) ou algumas listas (<ul><li>...</li><li>...</li></ul>). Cada artigo deve começar com um nome de entrada único: <toc-add-entry name="$unique_anchor">$meu_bonito_título</toc-add-entry> <p>Este é o conteúdo do meu pequeno artigo, onde posso inserir <a href="http://debian.org/">ligações</a> e outras marcações HTML normais.</p>O conteúdo entre <toc-add-entry> e </toc-add-entry> é o título atual. Depois disso segue-se o artigo em si entre <p> e </p>. Você pode usar vários desses parágrafos, mas note que apenas o primeiro irá aparecer no feed RSS (o que pode ser algo a corrigir, se você souber perl o suficiente...). Como explicado, você pode utilizar HTML normal nesses parágrafos. Isto significa que: <q>...</q> para citações, menções ou nomes de lançamentos: Debian 6.0 <q>squeeze</q>, Steve McIntyre disse: <q>Booh!</q> <a href="..."> para ligações: O secretário <a href="http://lists.debian.org/debian-devel-announce/2010/03/msg00000.html">chamou por nomes a nomear</a> para as eleições de líder de projeto. <!-- ... --> para comentários que não aparecem no site web: {<!-- TODO: Adicionar um link assim que esta discussão chegue a uma conclusão! --> Como as Notícias do Projeto também são lidas por usuários(as) pouco familiares com o jargão interno e acrônimos do Debian, use por favor a tag <acronym ...> </acronym> (não é parte do HTML, mas dos nossos modelos wml). Veja o exemplo seguinte: Um dos tópicos discutidos foi: <q>Race against <acronym lang="en" title="None of the above">NOTA</acronym>.</q>Apesar de não funcionar na versão de texto para e-mails, pelo menos a versão HTML para sites web e para os feeds RSS marcarão o acrônimo de modo a surgir a explicação ao se mover o cursor sobre o acrônimo. Você pode ver um exemplo em http://www.debian.org/News/project/2009/02/ (procure por DPL). Traduzindo as Notícias do projeto Debian Sinta-se livre para usar o repositório Git para o seu trabalho de tradução também. Nestes casos é mais fácil fazer checkout da hierarquia completa do repositório DPN, executando: git clone git@salsa.debian.org:publicity-team/dpn.git cd dpn Verifique agora se já existe um diretório com o seu idioma. Em caso negativo Crie um, por exemplo mkdir fr Crie o subdiretório ano/publicação correspondente (por exemplo mkdir -p 2015/07) Adicione uma primeira versão (pode ser inacabada) da sua tradução como index.wml Adicione-a ao repositório, por exemplo git add fr/ Faça um commit local com as suas alterações, git commit -m "primeiro passo na tradução" E faça push das suas alterações para o servidor central, git push Agora você pode imitar a mesma estrutura do diretório en. Publicações antigas são guardadas em diretórios específicos en/<ano>/<publicação>, a publicação atual está em en/current. Você irá reparar que o en/index.wml-template é uma publicação vazia e é utilizada como um modelo para iniciar uma publicação nova. Por favor, veja Tornando-se um(a) editor(a) para orientações úteis sobre Git e para uma pequena descrição do formato dos arquivos wml. Mas note que: As traduções devem usar um cabeçalho #use wml::debian::translation-check translation="<revision_git_hash>" para marcar a revisão da publicação original da qual a tradução se baseou. Contudo, por enquanto deixe vazia a <revision_git_hash>, a pessoa que fará a publicação copiará o hash correspondente quando a versão em inglês for adicionada ao repositório do site web. Tal como no campo editor na linha #use wml::debian::projectnews::footer, os(as) tradutores(as) podem adicionar um campo translator de um modo semelhante. Veja o seguinte exemplo (para francês): #use wml::debian::projectnews::footer editor="L'équipe en charge de la publicité avec des contributions de Thomas Lange et Paulo Henrique de Lima Santana et Jean-Pierre Giraud" translator="Jean-Pierre Giraud, l\'équipe francophone de traduction" Traduzindo os Bits do Debian Para traduzir os itens no repositório Bits, você pode fazer fork no repositório se não tiver acesso de gra'''
