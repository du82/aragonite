full_description = '''Translation(s): English - Español - Français - Italiano - 한국어 - Svenska - Português O Debian Project News O Debian Project News é um boletim das notícias mais importantes e interessantes sobre Debian em geral e numa base regular (actualmente bissemanal). Não foi pensado para substituir o DeveloperNews mas para o completar. Procura atingir uma audiência de utilizadores "regulares", que pode não estar interessada em detalhes sobre o processo de desenvolvimento ou relatórios longos de histórias de sucesso. O primeiro número do Debian Project News foi enviado a 2008-04-21, depois do final da Debian Weekly News e após a chamada para ressuscitar de Alexander Schmehl's. Se gostaria de contribuir por favor leia a nossa página de contribuição. Se gostaria de ajudar escrevendo artigos, por favor leia também ?os nossos guias de estilo. O ?fluxo de trabalho actual está documentado para quem estiver interessado. Via Mail: http://lists.debian.org/debian-news/ Via Web: http://www.debian.org/News/project/ Via RSS: http://www.debian.org/News/project/dwn CategoryNews CategoryProjectNews'''
