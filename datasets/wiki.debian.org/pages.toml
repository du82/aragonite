title = "Software - Debian Wiki"
full_description = '''Translation(s): عربي - বাংলা - German - English - Español - فارسی (Persian) - Français - עברית (Hebrew) - indonesia - Italiano - 日本語 (Nihongo) - 한국어 - Melayu - Polski - Português (Brasil) - Русский - Svenska - Українська - 简体中文 Quick access Editors Edutainment Emulators Games Multimedia Internet and networks Office applications Programming Security Desktop Environments System Administration Printing Compression Installing software The recommended way to install new software on Debian, is to use Package Management tools to install packages from the official repositories. These repositories should contain most of the software you will want to install, allowing you not to rely on external sources. Finding Software There are several ways to learn what software included in Debian can cover your specific needs. Debian Administrator's Handbook: Searching packages Debian Administrator's Handbook: Package Meta Information Debian Reference Manual - 2. Debian package management - Search method options with aptitude Debian Reference Manual - 2. Debian package management - Searching on the package meta data Use a package manager to browse software categories, sort them, and search through available packages. Debtags web search provides means to search software according to their various facets (see Help page). Search and browse packages on packages.debian.org. Each package may have a list of "recommended", "suggested" packages which complement the main package, and a list of packages with similar functionality. The new packages RSS feed lists packages recently added to Debian Unstable snapshot.debian.org - the snapshot archive allows access to all past and current packages in the Debian archive based on dates and version numbers. Installing software from other sources Provided you know what you are doing, you might also get software by : Installing packages from unofficial/third-party repositories Downloading and running ready-to-use binaries Building the software from sources. Deploying software in containers such as Docker Using other package managers such as Flatpak, Nix/Guix... writing your own! See also http://screenshots.debian.net/packages - Screenshots of packages WhyTheName, because we all wonder where does software names come from DebianSoftware - An Overview of the Software Available to Debian Stable BTS - Bugs in debian software FlatpakHowto - How to install third party software using Flatpak WNPP - list of packages requested for packaging and/or looking for maintainers WindowsEquivalent - Equivalents to Windows software Other software lists Generic software lists List of free and open-source software packages - Wikipedia Free and Open-Source Software portal - Wikipedia List of applications - ArchWiki Specialized software lists awesome-sysadmin - Free Software for system administrators awesome-selfhosted - Free Software network services and web applications Libre Projects - Free and Open Source web services Software forges https://github.com/explore https://gitlab.com/explore https://codeberg.org/explore https://launchpad.net/ https://sourceforge.net/ Wiki pages List of pages related to software in Debian: AmarokAmpacheApacheAppArmorAptCLIAptCacherNgAptConfigurationAptProtocolAptitudeArdourAutoConfAutoMakeAutomaticPackagingToolsBackupAndRecoveryBashBashColorsBind9BitTorrentBoot-InfoBoot-RepairBrowserAppsBurnCdCDDVDToolsCategoryDesktopApplicationCheckInstallChineseInputMethodChromiumClementineCoinOrCompizCompressionConsoleConvertCVStosvnCordovaCuptDDDNSDHCP_---chinese-inputhu/FreedomBoxirssiit/GIMPit/HowToReconfigureCryptSetupit/Picardlibvirtlight-lockerminidlnampdms/ProgrammingApplicationms/Softwaremsmtpnetconfnginx/FastCGInspawnnullmaileropendkimplymouthporeportbugru/PlymouthsSMTPscreenungoogled-chromiumvimw3mzh_CN/ChineseInputMethodzh_CN/Chromiumzh_CN/Gamezh_CN/I18n/Fcitx5zh_CN/KDEzh_CN/Multimediazh_CN/NetworkApplicationzh_CN/OfficeApplicationzh_CN/Operazh_CN/PipeWirezh_CN/ProgrammingApplicationzh_CN/Sof