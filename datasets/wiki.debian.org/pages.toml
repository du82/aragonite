["https://wiki.debian.org/ProgrammingApplication"]
title = "ProgrammingApplication - Debian Wiki"
full_description = "Translation(s): عربية - English - Español - Français - Italiano - Melayu - Português (Brasil) - Русский - Svenska - Українська - 简体中文 This portal talks about development and programming tools. Technical words can be used but explained. Editors The following editors are available through DebianPackageManagement, the preferred way to install applications on Debian: ed - Ed is a line-oriented text editor. vim - Vim is an almost compatible version of the UNIX editor Vi. neovim - ?NeoVim is the fork of Vim with additional features. emacs - GNU Emacs is the extensible self-documenting text editor. This is a metapackage that will always depend on the latest recommended Emacs release. ne - An easy to use terminal based text editor jed - Emacs like text editor, uses S-Lang for the scripting. nano - small, friendly text editor inspired by Pico kate - The KDE Advanced Text Editor gedit - The default Gnome text editor geany - a GTK+ / Scintilla based promramming editor (it calls itself a lightweight IDE) For more, see: Editors and Editors and IDEs. IDEs - Integrated Development Environments The following are available through DebianPackageManagement, the preferred way to install applications on Debian: gnome-builder - GTK and GNOME Development eclipse - Extensible Tool Platform and IDE for Java and many other languages, including C++, Python, etc. (Available as a Debian package in Stretch, but not in current versions of Debian, in which eclipse-debian-helper can be used, or the software can be manually installed - see below.) gambas2 - based on a Basic interpreter with object extensions, like Visual Basic(tm) (but it is NOT a clone!) KDevelop - IDE for C, C++, Python, QML/JavaScript and PHP MonoDevelop - C / C++ / C# / Boo / ASP.NET/ VB.NET / Java programming netbeans - IDE for Java, PHP, C/C++ Development and More (Available as a Debian package in Stretch, but not in current versions of Debian, in which the software can be manually installed - see below.) projectcenter.app - IDE for GNUstep Development using Objective-C QtCreator - C++ / Qt Window designer. Codelite - IDE for development using C, C++, PHP, Node.js The following are available as downloads from their creators, and are possible to use on Debian: Netbeans - IDE for Java, PHP and more. Netbeans installation instructions can be found here: Netbeans Eclipse - Extensible Tool Platform and IDE for Java and many other languages, including C++, Java, Python, etc. Eclipse installation instructions can be found here: Eclipse Visual Studio Code (from Microsoft) - An editor and lightweight IDE for many programming languages. VS Code installation instructions can be found here VisualStudioCode. VS Code can also be downloaded from https://code.visualstudio.com/ IntelliJ IDEA, Pycharm, Web Storm, Ruby Mine, and a whole family of similar IDEs from Jetbrains, for almost every popular programming language, can be easily installed on Debian: see the Debian Wiki JetBrains Page for more information. For more, see: Editors and IDEs. Repository and Sources control: git mercurial SVN UsingQuilt fossil Development Tools: FakeRoot - Provides virtual root privileges for file manipulation within a fake root environment. PentiumBuilder - Kludge to allow building for Pentium compatible architecture Make - Automatically recompiles parts of a package that need recompilation AutoConf - Tool to create a configure script from the configure.ac file AutoMake - Automatically generates build information files Distcc - tool to compile on many boxes at once PCRE (Perl Compatible Regular Expressions) tester (GUI) (used to be a KDE one) Some more: meson - SCons-like build system that uses Python as a front-end language and Ninja as a building backend cmake - A cross-platform open-source make system Languages: See ProgrammingLanguage Wiki pages All wiki pages related to programming and software development: AutoConfAutoMakeCategoryProgrammingDDistccFakeRootMakePHPPentiumBuilderProgrammingApplicationPythonRustSprints/2016/DebianCloudNov2016 (Minutes.txt)fr/ProgrammingApplicationfr/Pythongolangit/FakeRootit/PentiumBuilderit/ProgrammingApplicationit/Pythonpt_BR/ProgrammingApplicationuk/ProgrammingApplicationzh_CN/ProgrammingApplication CategoryPortal | CategorySoftware"
