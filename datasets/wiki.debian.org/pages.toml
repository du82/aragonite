r/image.img sudo mount -t udf -o utf8,rw,noatime /home/user/image.img /mnt/hdd (Kopii dosierojn al /mnt/hdd) sudo umount /mnt/hdd eo/Arturo_Teslao 2023-01-11 19:06:32 CategoryCommandLineInterface"
