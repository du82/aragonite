Rolling Sprint at DebCamp Debian Edu / Skolelinux Sprint June 2019 Debian Perl Sprint May 2019 Debian Web Team Sprint, March 2019, Madrid (Spain) Debian Med Sprint March 2019, Vilnius, Lithuania Local Team DebConf19 at Campus Party Brazil (São Paulo) - Feb 2019 DebConf Video team sprint @ FOSDEM 2019 git & Debian packaging sprint, July 2019, Cambridge, U.K. Cloud Team sprint, Oct 2019, Boston, MA, USA 2018 Local Team DebConf19 Curitiba at FTSL - October 2018 Debian Cloud Team Sprint October 2018 Debian Policy Sprint at DebCamp18 Debian Art Sprint DebCamp 2018 DebConf Video Team Sprint at DebCamp18 Debian Perl Group Rolling Sprint at DebCamp Debian Perl Sprint May 2018 Debian Edu Sprint May 2018 Secure Boot Sprint Apr 2018 Debian Med Sprint Jan 2018 Treasurer Sprint Feb 2018 DSA Sprint Jan-Feb 2018 DebConf Video team sprint @ FOSDEM 2018 2017 DebConf Videoteam Sprint Nov 2017 Debian Cloud Sprint 2017 Alioth Sprint 2017 Python3 brainstorming at DebCamp17/DebConf17 DebConf Video Team Sprint at DebCamp17 Debian Perl Group Rolling Sprint at DebCamp OpenStack meeting and sprint at DebCamp17 pkg-emacsen meeting and sprint at DebCamp17 Debian Policy Sprint at DebCamp17 Debian Perl Sprint 2017 in Lloret de Mar (May 18-21) Reproducible Builds Hamburg Hackathon 2017 (May 4-8th) Listmaster Sprint Debian Med 2017 Sprint in Bucharest (Jan 12-16) 2016 Reproducible Builds Summit 2 in Berlin (December 13-15 2016) Debian Edu 2016 Sprint in Oslo (Nov 25-27) Debconf Video Team Sprint - Paris Debian Cloud Sprint 2016, Nov 02-04 in Seattle Debian Perl Group Rolling Sprint at DebCamp Debian Perl Sprint 2016 in Zurich, May 20-22 Groupware Meeting, Apr 08-10 Ruby sprint, Feb 29-Mar 4 Debian Med 2016, 04 Feb- 07 Feb 2015 Vmdebootstrap sprint at the mini debconf UK, Cambridge. Debian l10n Portuguese Sprint @ DebConf DebConf Orga Sprint @ DebCamp15 Debian Perl Group Rolling Sprint at DebCamp Emacs Sprint @ DebConf15 Debian Haskell boot-camp @ DebCamp15 Listmaster Sprint 2015 @DebCamp, 10-14. A