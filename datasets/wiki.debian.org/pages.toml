["https://wiki.debian.org/DebianSoftware"]
title = "DebianSoftware - Debian Wiki"
full_description = '''Translation(s): English - español - Italiano - 简体中文 - Svenska - Русский - Francais The software available to Debian users This page provides a brief introduction to the software available for the stable version of the Debian operating system. More detail is available at the links given below. The Software Available for Debian's Stable Release The default Debian install makes a vast amount of software available, all of it easily installable from within Debian itself using the package management tools.1 Historically Debian has had more software2 in its repositories than any other Linux Distribution. Nevertheless, for various reasons, Debian's stable version does not include all the software that people find important and many have come to expect. To remedy this there is quite a bit of additional software available for Debian stable, from both official and unofficial sources. This page provides an overview of the most commonly used sources and/or those sources with substantial breadth or depth. The software sources on this page are all either produced by Debian itself or by members of the Debian community for Debian3 so, crucially, all of the software described here is supported by the Debian community at large. More narrowly focused or obscure sources of Debian software, and sources from outside the Debian community may be found on the page of UnofficialRepositories. Contents The Software Available for Debian's Stable Release Notes Regarding Security Software That Addresses Installation Problems Newer Software For Debian Stable Updates to Software for Debian Stable Audio and Video Software Non-Free Software (e.g. Adobe's Flash) Software for Embedded Devices Running Debian Without Installing See Also Notes Regarding Security Security Considerations The Debian project provides the highest level of security support to the free software included in the Debian stable release. The official, semi-official, and non-official software sources listed herein may or may not receive this level of security support. Security Updates of Existing Software It is worth mentioning that Debian provides timely security updates but that the default install does not ensure that these updates are automatically installed as they become available. An essential part of administering a Debian system is ensuring that security updates happen. A Debian system is pre-configured to receive security updates when manually requested to do so. The default desktop (gnome) provides a button in the menu bar which installs security updates. Others may need to run (as root) apt update followed by apt upgrade on a regular basis. Packages are available which install security updates automatically. Software That Addresses Installation Problems Because Debian's stable release changes minimally after release the stock version may have difficulty installing or operating on the newest hardware, often because of difficulty with newer wireless hardware. Frequently the problem can be addressed after installation4 by installing a newer kernel. 5 obtained from the Backports repository. Note also that some hardware requires non-free firmware to work; firmware that is not included as part of the stock Debian installer6. See the details here or in the wiki installation instructions or the official installation guide, and obtain help via IRC or other support channels. Newer Software For Debian Stable Because Debian's stable release changes minimally after release, and has few changes in months prior to release, the software included is not always the latest and greatest. Those who need newer software but still want the reliability and security of Debian stable can often satisfy their wants with software from backports, https://backports.debian.org. Backports provide not only newer applications but also newer kernels. Installing a newer kernel is often the best way to solve problematic hardware issues because the newer kernel contains many newer drivers and bug fixes. If you need something that is not in backports, or something even newer than what's in backports, a good option is to backport the newer package yourself from the Debian sid/unstable release. If the instructions for backporting from sid/unstable are not clear or you need further help the IRC channel can be a good support option. You may also ask there should you need software even newer than that available in sid/unstable. Backporting (recompiling and repackaging) is the only safe way to install packages from Debian Sid or Debian Testing on a Debian stable system. Do not install such packages without backporting. Attempting to "mix" releases, especially by updating your sources.list file, is a sure way to break your system. Recovery in these cases usually involves restoring from backup. Note that installing the latest software may not be the best way to meet your real needs. IRC, and other support options may be able to suggest other alternatives that help you accomplish your real goal. Those using backports, or backporting packages themselves, should remember that security updates are no longer automatic!7 Updates to Software for Debian Stable Some software, such as spam scanners, must be very up-to-date to work. To enable8 updates to the very latest versions of such software, or backports of the important parts, be sure that the bookworm-updates ?suite is enabled in /etc/apt/sources.list, by adding bookworm-updates to the end of the line. Lines should look something like:9 deb https://deb.debian.org/debian/ bookworm main bookworm-updates Audio and Video Software Warning Some software is not included in Debian because it is illegal in some parts of the world. Audio and video software can be especially problematic in this regard and the United States is among the more restrictive governments. Mere possession may be a criminal offense and may lead to time in jail. Ignorance of the law is no excuse. This web page should not be considered a substitute for qualified legal advice; legal advice can only be obtained by consulting a lawyer. Some software related to multi-media, particularly software allowing the playback and manipulation of music, video, and the like, is not included in Debian itself for legal reasons. This is now much rarer than in the past10.11 Sometimes it may be appropriate to recompile the Debian source package of interest to enable codecs or other features excluded for legal reasons. This is done by downloading the source .deb package with apt-get source packagename, changing the compilation options found in debian/rules, using dpkg --build sourcedirectory to rebuild a binary .deb file, and gdebi packagename to install it. It is a good idea to append +custom.X, where custom is your custom name and X is your private revision number, to the version number defined in the source package's .dsc file to distinguish your re-packaging from stock Debian, and to put the resulting package on hold after installation with apt-mark hold packagename so that it is not automatically replaced during system upgrade. Non-Free Software (e.g. Adobe's Flash) In accordance with Debian's core principles, those codified in The Debian Social Contract, the default Debian install is configured to install only Free Software. Non-free software is made available to those who wish to risk its ills. Before blindly installing non-free software it may be prudent to ask if there is a Free replacement.12 Access to non-free software distributed by the Debian project is done by modifying the /etc/apt/sources.list file.13 The sources.list man page contains explanations and examples. The basic idea is to have the text contrib and non-free appear as components, along with the main component, at the end of each line so that the non-free and contributed software ?suites can also be downloaded from each software archive. However, it is to be noted that there is some exception these days with the rise of "Application Sandboxing" technologies like Flatpak, etc, but still, Debian can't guarantee the same security prospect in that case. Flatpak lets applications run on a custom runtime, which is isolated from base Debian system. Again, /usr/bin, /lib64 etc are very sensitive places, so careful doing any modifications over there. See FlatpakHowto for more. Software for Embedded Devices If you have large enough storage for standard Debian distribution, it is available for ARM (armel, armhf, arm64) and MIPS (mips, mipsel, mips64el) processors as well as i386 and amd64. The Emdebian project has been abandoned and some of the efforts have been integrated into Debian. Running Debian Without Installing A computer can run Debian without installing it onto a hard drive; running instead from, say, a CD or a USB stick. The Debian-Live project provides this capability. A "live" version of Debian is no different from an installed version. The software is installed and removed as usual, although whether or not these changes are preserved across reboots depends upon whether the underlying media is writable. See Also DontBreakDebian CategoryPortal | CategoryPackageManagement CategorySoftware ToDo: cleanup/organize, CategoryRedundant: merge with Software and/or PackageManagement New Debian users should obtain all their software from the Debian repositories. The Debian maintainers have gone to a lot of work to ensure that the software in the Debian repositories works well together and is secure. Getting software from non-Debian sources voids the (non-existent) warranty! The combination of package management systems and the advent of Linux distributions which supply vast amounts of software fundamentally changes appropriate system administration practice, especially for the typical user. Do not obtain software from anywhere other than Debian, not even from the software's author, unless you have the skills and the time to solve the resultant problems! Linux newbies are often used to obtaining their software directly from the software's author, as well as from other random places on the Net. This practice contributes to the instability, inflexibility, and insecurity of non-Linux systems. You may think that because you are used to obtaining software from various sources and integrating it into your system that this practice is manageable. Experience suggests otherwise. You are advised to wait until you have navigated several major system upgrades and consider yourself something of a Linux expert before venturing away from the supported Debian software repositories. (1)In those cases where the software or its configuration has been modified to introduce Debian specific peculiarities these are noted in a README.Debian document found in the package's /usr/share/doc/packagename/ directory. This is usually of interest only to server administrators. (2)Even the unofficial sources are "officially unofficial" and would be part of Debian itself if the means were available to make it so. These software sources strive to meet Debian's high standards and are engineered to integrate seamlessly into Debian. They are well established and have proven themselves over time. (3)After installing using a wired Internet connection or using only offline installation media. (4)The kernel, the core of the system, mediates between the rest of the system and most of the hardware. Consequently a newer kernel often is all that's required to support newer hardware. (5)Unoffical installers containing non-free firmware are available and are easier to use than adding non-free firmware to the regular installer. (6)At the time of this writing the Debian Security Team does not provide support for the software in backports.debian.org, although some software may get security updates from the backport maintainers. (7)The Debian installer does ask if the updates suite is to be enabled so it may or may not already be enabled. (8)Of course there are GUI tools that will make such changes for those afraid of editing text. (9)Say, pre-squeeze. (10)Note that https://deb-multimedia.org/ is no longer a recommended source of Debian stable packages. (11)Regardless, it is much better to obtain non-free software from the official Debian repositories than it is to obtain it from elsewhere on the Internet, even from the software's original source. The software in the Debian repositories has been proven to integrate with Debian and is updated when necessary to maintain security -- in so far as such is possible with non-free software. (12)Those afraid of typing text into a document can instead use checkboxes found in the graphical interface of the Synaptic package manager. (13)'''
year_published = 2025
clearnet = "https://wiki.debian.org/DebianSoftware"
