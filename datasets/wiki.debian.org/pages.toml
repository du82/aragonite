["https://wiki.debian.org/el/ProjectNews"]
title = "el/ProjectNews - Debian Wiki"
full_description = 'Τα Νέα του Σχεδίου Debian (Debian Project News) Tο Debian Project News (lists.debian.org/debian-news/) είναι ένα δελτίο ειδήσεων με τα πιο σημαντικά και ενδιαφέροντα νέα σχετικά με το Debian σε μια γενικά συχνή βάση (αυτή τη στιγμή δεκαπενθήμερη). Δεν πρόκειται για έναν αντικαταστάτη των times.debian.net ή του DeveloperNews αλλά μάλλον για ένα συμπλήρωμά τους. Στοχεύει σε ένα κοινό "τακτικών" χρηστών που πιθανόν να μην ενδιαφέρονται για τις λεπτομέρειες της διαδικασίας ανάπτυξης ή για μακροσκελείς αναφορές επιτυχιών. Αν θέλετε να συνεισφέρετε παρακαλούμε διαβάστε τη σελίδα μας contribution page. Αν θέλετε να βοηθήσετε στη συγγραφή άρθρων παρακαλούμε διαβάστε επίσης τις οδηγίες στο our style guidelines. Στο τρέχον δοκιμαστικό τεύχος ?Current draft, θα βρείτε δουλειά σε εξέλιξη στην οποία μπορείτε να συνεισφέρετε μέχρι την ημερομηνία της κυκλοφορίας. Ο Alexander έχει τεκμηριώσει την τρέχουσα ροή εργασιας. Και τέλος ένας σύνδεσμος στη λίστα εκκρεμοτήτων μας που δεν σχετίζονται με το περιεχόμενο ?todo-list. Τα Νέα του Σχεδίου Debian αντικαθιστούν τα παλιότερα Εβδομαδιαία Νέα του Debian Debian weekly News. CategoryNews CategoryProjectNews'
