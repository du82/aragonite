["https://wiki.debian.org/DebianIntroduction"]
title = "DebianIntroduction - Debian Wiki"
full_description = "Translation(s): বাংলা-(Bengali) - Català - Česky - Deutsch - Ελληνικά (Ellinika) - English - Español - فارسی - Français - עברית-(Hebrew) - Indonesian - Italiano - 日本語(Nihongo) - 한국어 - Melayu - Nederlands - Polski - Português (Brasil) - Portuguese (Portugal) - Русский(Russian) - සිංහල-(Sinhala) - Српски(Serbian) - Svenska - தமிழ்-(Tamil) - Українська - tiếng Việt - 简体中文 Debian is a free operating system (OS) for your computer. An operating system is the set of basic programs and utilities that make your computer run. Debian uses the kernel Linux (the kernel is the core of an OS), but most of the basic OS tools come from the GNU project. Thus we refer to Debian as a Debian GNU/Linux operating system, giving credit to all its main originators. Debian GNU/Linux provides much more than just the OS---a wide range of application software is included too. It comes with a total of over 118000 Check # https://packages.debian.org/stable/ packages, precompiled software bundled up in a nice format for easy installation on your machine. Are you new to GNU/Linux? Finding where to start can be a daunting task! There are many places to start and there is so much information that it can be confusing. This wiki and the following web pages are very good places to start: Introduction to Debian Debian Documentation Why Debian? A brief history of Debian Debian Releases An overview of the software available for the Debian stable release Some Debian resources How to install Debian See DebianInstall External links Debian - Wikipedia Debian GNU/Linux Reference Card (PDF) - The 101 most important things when using Debian GNU/Linux CategoryPortal"
