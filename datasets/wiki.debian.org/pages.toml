full_description = "Translation(s): العربية - বাংলা - English - Česky - Español - Français - Indonesia - Italiano - ?日本語 - Melayu - Português (Brasil) - Русский - Svenska - Українська - 简体中文 Portale del wiki Debian sulla riga di comando. Questo portale copre alcuni aspetti dell'uso della riga di comando in Debian. Manuale Debian - Capitolo 1. GNU/Linux tutorials Una interfaccia a riga di comando (CLI, command line interface) è un mezzo per interagire con un programma per computer in cui l'utente (o client) dà comandi al programma in forma di righe di testo (righe di comando) una di seguito all'altra. Il programma che gestisce l'interfaccia e chiamato interprete a riga di comando o Shell. Pagine generali Comandi di shell - funzionamento di base a riga di comando di un sistema GNU/Linux Shell - shell a riga di comando Console - la console Linux Bash - la shell interattiva predefinita in Debian CommandLine - Lavori in corso Il modo Unix Script di shell - Lavori in corso Pagine man - pagine di manuale/documentazione per programmi a riga di comando Emulatore di terminale - Programmi per interagire con le shell e i programmi a riga di comando CommandsCLI - Lavori in corso Trucchi per la shell - Lavori in corso Configurazione della shell - Lavori in corso Avvio di una shell Zg2 - Lavori in corso Pagine del Wiki Un elenco delle pagine del wiki relative alle interfacce a riga di comando: _CN/Bashzh_CN/CommandLineInterface Un elenco di quelle con traduzione in italiano: it/Bashit/BurnCdit/CommandLineit/CommandLineInterfaceit/CommandsCLIit/Compressionit/Consoleit/DvdRwToolsit/Lynxit/Ncursesit/Permissionsit/Shellit/ShellCommandsit/ShellConfigurationit/ShellScriptit/ShellToolTricksit/ShellTricksit/TheUnixWayit/UserInterfaceit/WhereIsItit/coreutilsit/gitit/motdit/w3m CategoryPortal | CategoryCommandLineInterface"
