["https://wiki.debian.org/it/ProjectNews/Guidelines"]
title = "it/ProjectNews/Guidelines - Debian Wiki"
full_description = '''Translation(s): English - Español - Italiano ?Discussion (Bozza) Linee guida di stile per le Debian Project News Contents Generalità Pubblico Contenuti Lunghezza Stile Linee guida per lo stile in diversi tipi di situazione Riportare discussioni in corso Riportare discussioni terminate Riportare interviste Riportare eventi futuri Generalità Quando si scrive per le Debian Project News si rappresenta il Progetto Debian davanti al mondo intero. Perciò tenerlo a mente quando si aggiungono articoli: i lettori si aspettano un alto livello di qualità, a cui sono abituati da tutto ciò che porta il nome "Debian". Per essere più precisi, le Debian Project News dovrebbero seguire lo spirito del contratto sociale; gli articoli di Debian Project News dovrebbe essere liberi da pregiudizi, obiettivi e aderenti al vero. Ciò significa, ad esempio, che quando si scrive a proposito di una discussione in corso, dovrebbero essere riportati entrambi i punti di vista. Pubblico Il pubblico di destinazione delle Debian Project News sono gli utenti normali che potrebbero avere solo un'idea generale del progetto e dei suoi aspetti tecnici. Le Debian Project News dovrebbero essere comprensibili da questa tipologia di utente. Spesso le Debian Project News possono solo indirizzare ad una specifica discussione senza avere lo spazio per riportare un riassunto completo. Come minimo un articolo nelle Debian Project News dovrebbe permettere all'utente medio di determinare se seguire un collegamento per leggere di più su un argomento sia per lui utile o meno. Contenuti Per il momento vedere la sezione in Come contribuire. Lunghezza Idealmente un articolo adatto alle Debian Project News dovrebbe essere lungo uno, o al massimo due, paragrafi. Dovrebbero semplicemente essere un piccolo riassunto dell'argomento con eventuali collegamenti (ad esempio agli archivi delle mailing list) per permettere a chi è interessato di proseguire la lettura. Stile Come delineato nella sezione sul pubblico le Debian Project News dovrebbero essere comprensibili dall'utente medio. Per il momento, dato che non sono inviate traduzioni, temere a mente che molti dei lettori potrebbero non essere di madre lingua inglese. Perciò al momento è preferito uno stile inglese semplice e conciso. Per il momento l'inglese britannico è preferito all'americano, così come avviene per le pagine web di Debian (dove andranno a finire anche le News). Il formato delle date segue le linee guida per lo stile MHRA, come descritto all'indirizzo http://lists.debian.org/debian-publicity/2008/05/msg00050.html, e come ad esempio in 12 April 2008. Linee guida per lo stile in diversi tipi di situazione Situazioni differenti possono richiedere stili diversi quando vengono riportate. Ecco alcune idee: Riportare discussioni in corso Quando si scrive un articolo su una discussione in corso tenere a mente quando verrà pubblicata l'edizione successiva! Forse per quel momento la discussione sarà terminata? Si dovrebbe indirizzare il lettore all'esatto posto in cui la discussione sta avvenendo. Non basta cioè citare la mailing-list o il fatto che la discussione è attualmente in corso, ma deve essere indicato un collegamento all'esatto messaggio negli archivi di posta Debian che ha dato origine alla discussione. In aggiunta (se lo permettono le restrizioni sulla lunghezza descritte in precedenza) dovrebbero anche essere riassunti gli argomenti principali di ciascuna parte coinvolta nella discussione. Riportare discussioni terminate Quando una discussione è già terminata al momento della pubblicazione dell'edizione successiva, è più importante riportarne la conclusione. Perciò si possono omettere gli argomenti principali (che invece sono necessari quando si riporta una discussione in corso). Tuttavia se la discussione è stata piuttosto lunga, sarebbe preferibile anche citare (e mettere collegamenti a) gli argomenti principali, in modo che i lettori non debbano spostarsi attraverso tutta la discussione essi stessi. Riportare interviste Quando si riporta una intervista che è collegata a Debian (es. un Release Master intervistato da LWN; un rappresentate HP intervistato che cita Debian) non dovrebbe semplicemente essere detto che è avvenuta un'intervista e dove, ma devono anche essere riassunti i punti salienti dell'intervista. Riportare eventi futuri Deve essere chiaro ai lettori ciò che devono aspettarsi quando visiteranno l'evento correlato al Progetto Debian. Ci sarà uno stand o solo comunicazioni correlate a Debian? Per quale tipo e quanto pubblico è pensato l'evento? C'è un costo di partecipazione? All'interno dell'evento dove si può trovare Debian? C'è qualcosa che un volontario può fare per aiutare durante l'evento? CategoryProjectNews'''
