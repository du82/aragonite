title = "nl/FrontPage - Debian Wiki"
full_description = "Català - Česky - Deutsch - English - Español - Esperanto - Français - Indonesian - Italiano - Magyar - Melayu - Dutch - Norsk - Polski - Português (Brasil) - Portuguese (Portugal) - Русский (Russian) - српски - Svenska - தமிழ் (Tamil) - Türkçe - Українська (Ukrainian) - Tiếng Việt - فارسی (Farsi) - Ελληνικά (Greek) - বাংলা (Bengali) - 日本語 (Nihongo) - 简体中文 (Chinese) - عربي (Arabiya) - עברית (Hebrew) - 한국어(Korean) - 正體中文 (Chinese) Deze wiki is een ondersteunings- en documentatie-resource voor het Debian project, maar ook een communicatiemiddel voor ontwikkelaars. Zoals alle wiki's wordt deze wiki voortdurend bijgewerkt en we verwelkomen je wijzigingen aan te brengen. Mocht je op zoek zijn naar iets specifieks, probeer de FindPage. Hint: Om alle Nederlandstalige documentatie te vinden, probeer de term 'dutch'. Voor de Nederlandse vertalers zie DutchTranslations. SpotLight: WhereIsIt Deze pagina geeft aan waar je de verschillende gereedschappen kan vinden op een Debian systeem. Official and unofficial Debian-related news Easier file renaming with renameutils, by debianadmin.com Samba file-sharing with Active Directory authentication, by rubenleusink.com DebianInstaller/Xen, by DebianWiki Setup Xen within 20 minutes on Debian, by Michael Prokop Install Tomcat 5.5 in Debian, by sub.jam Lees meer op ?presscoverage Voor Gebruikers ?DebianIntroductionDutch - Wat is Debian? Waar kan ik Debian vinden? WhyDebianDutch - Waarom Debian verkiezen over een andere Unix/Linux distributie? DebianInstallDutch - Zo, u verlangt Debian te installeren? DebianSystem - Documentatie over Debian (Desktop, Systeembeheer, Pakketten, verscheidene tips & trucs) Sarge2EtchUpgradeDutch - Upgraden van Sarge (Debian 3.1) naar Etch (Debian 4.0) DebianNetworkInstallDutch - Hoe Debian te installeren over een netwerk zoals het Internet. DebianHostingDutch - Verlangt u een Debian server online zo snel mogelijk? FromWindowsToDebianDutch - Wilt u van Windows naar Debian overstappen? Dit artikel is voor u! DebianSupportDutch - Een lijst met locaties om hulp te verkrijgen en hoe deze werken. MeetDebianDutch - Ontmoet lokale Debian gebruikersgroepen, Debian in conferenties en exposities. DebianReleasesDutch - Hoe het releasen van Debian werkt. Voor Ontwikelaars HowToPackageForDebian OngoingTransitions - Informatie over actuele pakketten in transitie in Debian. Status/Unstable - Actuele problemen in Unstable. LowThresholdNmu - Packages that may be NMUd without waiting. ComaintainersAreWelcome - People that agree to having their packages co-maintained. CategoryEtchReleaseRecertification - Deciding what architectures are suitable to release with etch. EtchTODOList qa.debian.org DebianMachines - Gebruik ontwikelaars machines om architectuur-specifieke packaging problemen op te lossen. BSPMarathon - BSPs van de Etch release. Subprojects ArmEabiPort - Project voor het ontwikkelen van een nieuw ARM architectuur (zie pagina waarom) DebianDesktop. DebianEdu - Free Software voor het educatie. DebianInstaller - Ontwikkel het installatie systeem. DebianLive - Debian in een LiveCD en installatie gereedschap in ?harddisk en USB keys. DebianScience - Packaging Free Software for scientific research. DeMudi - Free Music and Audio Software Embedded_Debian - Tools to build Debian for smaller devices. Games/Development - De Debian Games Team FriendsOfDebian HugAFinn DebianEvents - Events in which the people involved in the Debian project participate XStrikeForce - Maintaining packages for the X Window System in Debian. Teams/TeXTaskForce - Maintaining TeX systems in Debian and developing the Debian TeX Policy DebianGis - Maintaining and packaging GIS related tools and programs. Other CustomDebian Java - Packaging free java software DebianHistory - Place to collect information and files about the history of Debian I18n - Internationalisatie L10n - Localization Meta DebianWiki - over dit wiki, hoe u in logt en pagina's wijzigt. DebianWiki/ConventionsDiscussion - discussie ov