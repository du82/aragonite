["https://wiki.debian.org/Jabber"]
title = "Jabber - Debian Wiki"
full_description = '''Translation(s): English - French - Italiano-简体中文 ?Discussion Here is a quick presentation of Jabber and Jabber communities around Debian. Contents Jabber Official Debian chat rooms Non Official Debian chat rooms on Jabber How to get help on Jabber See Also External Links Credits Jabber Jabber is an open instant messaging protocol based on “Extensible Messaging and Presence Protocol” (a.k.a. XMPP). Jabber Client To join a conference or chat room you'll need a client software. Debian is shipped with several of them, run apt(itude)? or debtags (?learn more about Debtags) to make your choice : apt-cache search jabberaptitude search "~djabber ~snet ~dclient"debtags search "protocol::jabber && network::client"For a list of available clients, see JabberClients. Official Debian chat rooms Official debian conference server is conference.debian.org General talking and support, english speaking room: debian@conference.debian.org Debian Junior (english speaking room): debian-jr@conference.debian.org Debian, German speaking room debian-user-german@conference.debian.org Non Official Debian chat rooms on Jabber Here is a list of rooms in different languages. There is no room for your own language in that list? Feel free to add new rooms details. If there isn't, you can create your own and put together a community, Jabber is open, Jabber is easy . Russian General talking about Debian : debian@conference.jabber.ru German The German Debian forum's chatroom debianforum.de - Der Chat des deutschsprachigen Debianforums : debianforum.de@chat.debianforum.de Debian User German: debian-user-german@conference.debian.org French French speaking room, General talking and support. Salon de discussion dédié à Debian : debian-fr@chat.jabberfr.org Czech Debate about fun and suffering with various *nixes of all sorts but a lot of people running Debian. Diskuse o radostech a strastech v *nixech všeho druhu : linux@conf.netlab.cz Debian India Hangout place for Debian Community in India: debian-in@conference.diasp.in How to get help on Jabber The sames rules apply to Jabber, IRC and mailing list. Please refer to "On getting help with IRC" wiki page for instance. Here is a quick summary of the main points : Don't ask to ask, just ask Write properly respecting your own language, you're not on your cell phone or with your chat buddies. Try to give us relevant information about your problem : “<something> is not working, what should I do?” is not for instance. But pay attention not to flood the chat room with endless log or configuration files, use paste.debian.net Be polite and patient, these people are all volunteers, this is not their paid job to answer you. Don't be lazy, read the documentation. You may read that famous how-to about “How to ask questions the smart way”. See Also JabberClients External Links Official Jabber web site : https://xmpp.org/ Spanish community : https://www.jabberes.org/ French community : https://jabberfr.org/ wiki pages (french): https://wiki.jabberfr.org/Accueil Chat Room presentation in french (Multi-User Chat) https://wiki.jabberfr.org/MUC Credits Copyright (C) 2008 GeoffB Under the GNU GPL2 CategoryCommunity CategoryXmpp'''
