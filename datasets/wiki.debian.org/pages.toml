title = "ProgrammingLanguage - Debian Wiki"
full_description = "Translation(s): العربية - English - Español - Français - Indonesia - Italiano - Melayu - Português (Brasil) - Svenska - Українська Contents Ada Algol 68 Assembly AWK BASIC C C++ C# and .NET Clojure Crystal D (dlang) Erlang Forth Fortran Go Hare Haskell Intercal Java JavaScript Kotlin Lisp Lua M4 Modula-2 Nim Objective-C, Objective-C++ OCaml Odin Pascal Perl PHP Pike Prolog Python R Raku Ruby Rust Shell Smalltalk Standard ML Swift Tcl/Tk Verilog Zig For availability status, please search the tracker for packages or wnpp for packaging requests/intents. Ada GNAT is an Ada compiler. It supports all versions of the language, i.e. Ada 2012, Ada 2005, Ada 95 and Ada 83 (however at the time of writing there are troubles with compiling Ada 2012 code) Algol 68 Algol 68 Genie - All you need to write Algol 68 programs which run at the command line. Assembly Multiple CPUs: binutils (GNU assembler) radare2 (asssembler and disassembler) x86 (16-bit): bin86 x86 (32-bit): x86dis (disassembler) x86 (32-bit and 64-bit): nasm intel2gas (NASM to GAS translator) yasm fasm fcml zydis-tools (disassembler) Intel 8031/8051: as31 (Intel 8031/8051) dis51 (Intel 8051 disassembler) Atmel AVR: avra Zilog Z80: z80asm z80dasm pasmo d52 (8052, 8048/8041, and Z80/8080/8085) Motorola 68xx (8-bit), MOS 65xx (8-bit) and 65816 (16-bit): 64tass (MOS 65xx) xa65 (Motorola 65xx and 65816) acme (6502/6510/65816) dasm (MOS 6502 & 6507; Motorola 6803, 68705, and 68HC11; Hitachi HD6303, an extended Motorola 6801); Fairchild F8) crasm (6800/6801/6803/6502/65C02/Z80) Motorola DSP56001: a56 Microchip PIC controllers: gputils Synthetic machines or instruction sets: mdk (MIXAL assembler for Donald Knuth's MIX mythical computer) pep8-simul (16-bit CISC for teaching) AWK gawk mawk original-awk BASIC FreeBasic (libfreebasic already packaged, fbc not yet. Very Microsoft QBasic compatible (graphics)) brandy (BBC BASIC) bwbasic (Bywater BASIC) Scriba pcbasic GW-BASIC compatible basic interpreter yabasic