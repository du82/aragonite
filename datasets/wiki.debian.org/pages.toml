buciones derivadas de Debian Ayuda para los desarrolladores de distribuciones derivadas a contribuir al proyecto Debian Distribuciones derivadas de Debian DEX - Proyecto para mejorar Debian y las distribuciones derivadas a través del trabajo de equipo inter-comunitario Contribuciones y ayudas para mejorar el proyecto Información para contribuidores que no son programadores Sitio web para debatir las propuestas sobre el rediseño y reestructura de www.debian.org Como ayudar al proyecto Debian CategoryPortal'
