["https://wiki.debian.org/DebianMed"]
title = "DebianMed - Debian Wiki"
full_description = '''Contents Contributing to Debian Med Services for developers Web sites Mailing lists and Chat Using Git to group-maintain packages Debian Med community and internships Meetings Outreachy projects References Related pages See also The Debian Med project prepares packages that are associated with medicine, pre-clinical research, and life sciences. Its developments are mostly focused on three areas for the moment: medical practice, imaging and bioinformatics. Over the years, several initiatives have spawned that address software provision in the scientific disciplines like chemistry or bioinformatics. Debian Med is not a competitor to these efforts but a nucleus for developers and a platform to enable that development. The ultimate goal of our packaging work is to make Debian, and therefore derivatives including Ubuntu, the best possible platforms for medical and life sciences research. As the packages are prepared to Debian policy standards and contributed to the regular Debian and Ubuntu repositories, the Debian Med project is classified as a Debian Pure Blend. Website: https://www.debian.org/devel/debian-med/ To commit changes, join the webwml project on Salsa Relevant projects on Salsa: https://salsa.debian.org/med-team/ Group policy: https://med-team.pages.debian.net/policy/ https://blends.debian.org/blends Information for end users: is collected in the FAQ Email contact: <debian-med@lists.debian.org> Matrix channel for instant discussions: https://app.element.io/#/room/#debian-med:matrix.org We are proud of: existing and prospective packages Bugs of Debian Med relevant packages: Bugs overview of web sentinel QA page: Blends QA overview Relevant Ubuntu projects: Unofficial packages for Ubuntu: https://launchpad.net/~debian-med/+archive/ppa Launchpad team: https://launchpad.net/~debian-med Contributing to Debian Med From the developer to the user, there is a long chain of tasks in which we always welcome participation. First we must keep ourselves informed about the software landscape in biology and medicine. Software to be packaged is chosen according to criteria such as users' need and the consistency of the distribution. Once in Debian, the software is monitored for its quality and bugs are fixed, if possible in collaboration with the upstream maintainer(s). All this work would not be very useful if it remains confidential. We also dedicate some time to advertise it to the world via http://www.debian.org and to ease the integration of new members through this wiki. Please contact us on debian-med@lists.debian.org if you want to help to make medical and biological software available to Debian users. Next steps are described very verbosely in our team policy document which describes the workflow in our team and should guide you step by step into the rules we have agreed upon. If you speak a language other than English, you can contribute rightaway with translations of package descriptions at the Debian Description Translation Project. When working on these, you will find immediate targets for improvements of the original English versions, too. For these, though, you need access to Debian Med's source code repository. Very welcome are tutorials that guide Debian users towards the use of packages to their immediate benefit. You may also consider to write respective articles for Magazines, be they online or in print. There is a list of active Debian Med developers including data about motivation and activity in the project. If you would like to contribute to Debian Med you might also have a look at DebianMedTodo that contains a list of tasks to do. If you are a newcomer and have no idea how to contribute you might like to join the Mentoring of the Month effort. Even if you are no software developer you can help us contacting upstream authors to free their software. This is coordinated on the Software Liberation page. Services for developers Web sites a Debian Med Salsa project which controls the access to all Git repositories of Debian Med packages A specific page is available for non-free packages Mailing lists and Chat Debian Med - general discussion list (Archives) debian-med-packaging - reports and discussions on packages (Archives) debian-med-commit - reports on commits to Git repositories (Archives) The persons who know the administrative password of the alioth-lists are AndreasTille, CharlesPlessy and NelsonOliveira. We chat on Matrix: https://matrix.to/#/#debian-med:matrix.org Using Git to group-maintain packages Our source packages are managed in Git repositories. Every Debian Developer and member of the Salsa debian-med project have write permissions on them. Our Group policy explains most details. The Git tips are a recommended reading for the beginners. Debian Med community and internships Meetings CustomDebian/Extremadura2007 First Sprint Second sprint Third sprint Fourth sprint Fifth sprint Sixth sprint Seventh sprint Eighth sprint Ninth sprint Sprint 2020 Covid-19 weekly video-conferences Sprint 2023 ?Sprint 2024 Outreachy projects GSoC 2016: Continuous Integration for all biological applications inside Debian GSoC 2017: Quality assurance for biological applications inside Debian ?Outreachy 2017: Continuous_Integration_for_biological_applications_inside_Debian GSoC 2018: Quality assurance for biological applications inside Debian GSoC 2019: Continuous Integration for biological applications inside Debian GSoC 2020: Quality assurance and continuous integration for applications in life sciences and medicine GSoC 2021: Quality assurance for biological and medical applications inside Debian Outreachy 2023: Quality assurance for biological applications inside Debian References When using Debian or Ubuntu for your work, you may find it appropriate to cite any of the following publications: S. Möller, H. N. Krabbenhöft, A. Tille, D. Paleino, A. Williams, K. Wolstencroft, C. Goble, R. Holland, D. Belhachemi, C. Plessy (2010) "Community-driven computational biology with Debian Linux" BMC Bioinformatics, 11(Suppl 12):S5 A. Tille, S. Möller, M. Hanke, Y. Halchenko (2011) "Debian Med - Integrated software environment for all medical purposes based on Debian GNU/Linux", Med@Tel 2011 Related pages Debian Med home page DebianMedImaging BOINC, the Debian packages for the Berkeley Open Infrastructure for Network Computing, fosters the active involvement in biomedical research for everybody by merely contributing CPU time. ?debichem, applications for chemistry (Salsa) Quite complete list of medical software in Wikipedia rosetta molecular modeling tool See also The work of the Debian Med packaging team in Debian and Ubuntu. DebianMed/Developers. DebianMedProspective: study of other workflows to solve the growth crisis that we will soon or later face. Supported Open Access Journals Genome Biology PLoS Computational Biology Bioinformatics (OUP) BMC Bioinformatics Source Code for Biology and Medicine In Silico Biology (International Fully Free online+print Journal, most in sync with Debian's principles) News sites LinuxMedNews Similar Initiatives BioPuppy - Debian Med packages are transformed to a Puppy-based LiveCD Bio-Linux .deb packages BioconductorBuntu GoeBix Bioinformatics LiveDVD from Göttingen (existing) BOSC Live CD (planned) The Linux for Biotechnology cdrom project (RPMs) FedoraMedical OpenSUSE-Medical BioNode, a flavor of CloudBioLinux (virtual machine build system) Categorization and evaluation of medical software medfloss.org'''
