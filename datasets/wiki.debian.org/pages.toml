["https://wiki.debian.org/Teams"]
title = "Teams - Debian Wiki"
full_description = '''Translation(s): English - indonesia - Italiano - Portuguese (Portugal) - Português (Brasil) - Русский - Українська This page aims to provide an entry point to the various Debian internal teams. The goal is to document everything that is important for people who want to help and maybe later join the corresponding teams. If you're part of such a team, you should check out the guidelines for internal teams, which provides information on creating and keeping a successful team. Contents Teams Infrastructure and Core teams Development Projects Blends teams Packaging teams Help out About this page Teams For convenience, please keep the list alphabetically sorted. Infrastructure and Core teams Alioth Lists - The Alioth Lists mailing list service team Backports - The Debian Backports FTP Masters Community - The Anti-harassment Community Team DAM - The Debian Account Manager(s) Debbugs - The bugs.debian.org and debbugs maintainers DebConf - organizers of the DebConf conference Debian Buildd - Wanna-build and build daemon administrators Debian CD - CD / DVD / image production Debian Live - Live images toolchain and production Debian Wiki - Admin and management of this wiki Debian Women - The Debian Women Project Delegation Advisory - the DPL's Delegation Advisory Helpers DPL - The Debian Project Leader DSA - The Debian System Administrators Events & Merchandise - Gather/organize events, including merchandise FrontDesk - The Debian front desk for prospective developers FTPMaster - FTP Masters I18n - Internationalization and localization KeyringMaint - Keyring maintainers ListMaster - Debian List Masters Local Groups - Debian Local Groups team MIA - Debian "Missing in Action" team Mirrors - Debian Mirrors Administrators Outreach - Debian Outreach Team Policy - The Debian Policy team Publicity - The publicity team Press - The press team (old, now merged with Publicity team) QA - The Quality Assurance team Release Team RTC - Real Time Communications team Salsa SalsaCI - Continuous Integration on Salsa team Secretary Security - The security team DebianSocial - The Debian Social team Treasurer - The Debian Treasurer(s) Video - Debconf Video team Webmaster - The web team debci - Debian Continuous Integration Team LiveCoding - The Debian Live Coding team for art, sound, music and visuals Development Projects Apt - We maintain apt and python-apt. Adequate - Debian package quality testing tool. Boxer - Package blending and deployment tool. Cloud - Usage and distribution of Debian on computer clouds. Debian Documentation Project - Documentation for the Debian system. Debian-eeepc - Debian Eee PC team DebianInstaller - The Debian Installer team Debian LAN - Debian Local Area Network team DebTags - The Debtags team Dpkg - Developing the Debian package manager Embedded_Debian - The Debian Embedded team FAI - FAI - Fully Automatic Installation for Debian and others Lintian - Lintian Debian package checker Blends teams Debian Accessibility The Debian Accessibility team. Debian Astro The Debian Astro Team Debian Design Team - Debian for designers DebianEdu / Skolelinux - Debian Blend Distribution for education (which should become a Pure Blend Distribution in future) Debian Games - The Debian Games Team Debian GIS - The Debian GIS applications team Debian Math - The Debian Math Team Debian Med - The Debian Med Blend. Mobian - Debian Blend targeting mobile devices Debian Parl - Debian for parliamentarians Debian Science - The Debian Science Blend Sugar - Debian Sugar Blend Teams/Tinker - Debian for tinkerers/makers/hackers DebianWorking - Debian for those wanting a (fully/barely/arguably) Working Debian DebiChem - The Debian Chemistry Team NeuroDebian - Debian for neuroscience research project FreedomBox - Debian for home server appliance Packaging teams In addition to the general guidelines for teams there's a page collecting resources for packaging teams. pkg-3dprinting - 3D-printing packaging team pkg-android-tools - Android development tools and SDK packaging team pkg-apparmor-team - Debian AppArmor Team pkg-ayatana - The Ayatana Packagers pkg-bacula - The Debian Bacula Team pkg-bazaar - Debian Bazaar Team pkg-bluetooth - The Debian bluetooth group pkg-boinc - Debian BOINC Maintainers pkg-boost - The Debian Boost Team pkg-cas - CAS packaging team pkg-cinnamon - Cinnamon packaging team pkg-cli-apps - Debian CLI (~ Mono/…) Applications Team pkg-cli-libs - Debian CLI (~ Mono/…) Libraries Team pkg-clojure - Clojure packaging team pkg-collab-maint - Collaborative package maintenance pkg-common-lisp - The Debian Common Lisp Team pkg-corba - CORBA packaging team pkg-crosswire - Debian Crosswire Packaging Team pkg-cryptocoin - Debian Cryptocoin Packaging Team pkg-cryptsetup - Debian Cryptsetup Packaging Team pkg-cups-devel - Debian CUPS Maintainers pkg-cyrus-sasl2 - The Debian Cyrus SASL Team ?pkg-devscripts - devscripts Devel Team pkg-dns - Debian DNS packaging team pkg-electronics - Debian Electronics Packaging Team pkg-emacsen - Debian Emacsen team pkg-erlang - Erlang Packaging Team pkg-eucalyptus - Debian Eucalyptus Maintainers pkg-exim4 - Debian exim 4 Team pkg-fedora-ds - Debian 389 Directory Server Packaging Team pkg-fonts - The Debian Fonts Task Force pkg-foo2zjs - The Debian Foo2zjs Team pkg-forensics - Forensics and security related packaging team pkg-fso - The Debian FreeSmartphone.Org Team pkg-gnome - The Debian GNOME team pkg-gnustep - Debian GNUstep packaging team pkg-gnupg - Debian GnuPG packaging team pkg-go - Debian Go (golang) packaging team debian-hams - ham-radio packaging team pkg-haskell - Packaging Haskell libraries pkg-hebrew - Hebrew support on Debian pkg-heka - Packaging Lua Sandbox, Hindsight and dependencies pkg-horde - Debian Horde Packaging team debian-hpc - Debian HPC team pkg-ime - IME Packaging Team (input method) pkg-in - The Debian Indic Language Packaging Team pkg-iproute - The iproute (iproute2) packaging team. pkg-ipsec-tools - The ipsec-tools/racoon packaging team. pkg-iot - Debian IoT Packaging Team pkg-java - The Java packaging team Javascript - Debian Javascript Maintainers pkg-jed - Debian JED Group pkg-kde - Debian Qt/KDE maintainers and KDE extra teams pkg-kernel - The Debian Kernel Team pkg-kolab - Debian Kolab pkg-libreOffice Debian libreOffice maintainers (and openOffice.org) pkg-libvirt - Libvirt/Virt-manager/oVirt Packaging Team pkg-lua - The Debian Lua Team pkg-mate - Debian MATE Packaging Team pkg-mono - Debian Mono Group pkg-mozext - Mozilla ?WebExtensions packaging team pkg-multimedia - The Debian Multimedia Project pkg-munin - Debian Munin Maintainers pkg-mutt - Debian Mutt packaging pkg-mysql-maint - Debian MariaDB/MySQL packaging pkg-nagios - Debian Nagios Maintainer Group pkg-netfilter - Debian Netfilter packaging team pkg-obs - Debian Open Build Service packaging team pkg-ocaml-maint - The Debian OCaml Maintainers Task Force pkg-octave - Debian Octave Group pkg-openmpi - The Debian OpenMPI Maintainers pkg-opennebula - Debian OpenNebula Packaging Team pkg-openstack - Debian OpenStack Packaging Team pkg-otr - Debian OTR Team pkg-owncloud - ownCloud for Debian Team pkg-perl - The Debian Perl Group pkg-privacy-maintainers - Debian Privacy Maintainers packaging team pkg-php - The Debian PHP Group pkg-proftpd - The Debian ProFTPD team pkg-puppet - Puppet packaging team PythonTeam - Debian Python Team (merged from the Python Applications Team and Python Modules Team) r-pkg - Debian R Packages Maintainers pkg-rakudo - The Debian Rakudo (Perl6) Group Robotics - Debian Robotics Team, which maintains ROS and other robotics related software pkg-ruby - The Debian/Ruby team, which maintains the ruby interpreters pkg-ruby-extras - The Debian/Ruby Extras team, which maintains ruby libraries and applications pkg-rust - Debian/Ubuntu Rust team pkg-s3fs - S3FS (FUSE Filesystem for Amazon S3) Packaging Team pkg-samba - Debian Samba Team pkg-salt - Salt Packaging Team Sass pkg-scicomp - Debian Scientific Computing Team pkg-sdl - The Debian SDL Group pkg-security - The Debian Security Tools Packaging Team pkg-shibboleth - The Debian Shibboleth Packaging Team pkg-ssh - Debian SSH Team ?pkg-sugar - Debian Sugar Team pkg-systemd - Debian systemd Maintainers pkg-tcltk-devel - The Debian Tcl/Tk team pkg-telepathy - Debian Telepathy maintainers pkg-TeX - The Debian TeX maintainers ?pkg-trac - Debian Trac Team pkg-vim - Debian Vim Maintainers pkg-voip - The Debian pkg-VoIP packaging team pkg-wmaker - The Debian ?WindowMaker packaging team pkg-wxwidgets - wxWidgets packaging team pkg-X - The X Strike Force (XSF) : Debian X11 Maintainers Debian Xen Team - Packaging the Xen hypervisor and tools for Debian pkg-xfce - The Debian Xfce Group pkg-xml-sgml - Debian XML/SGML Group pkg-xmpp - Debian XMPP Maintainers r-pkg-team - Debian R Packages Maintainers pkg-zenoss - The Zenoss packaging team lxqt-team - The Debian LXQT packaging team There are far more teams! Help out If you want to create a new page for a team, please enter the name of your team in CamelCase, press the button and fill out the template. It's best when the page is created by a member of the team. However, when the team is known to be overloaded, and if you would like to join that team to help out, it's wise to create the page and put all your knowledge about the team in that page. Then ask someone from the team to review it. Some teams that have not yet been added to this page are listed in /TODO. About this page A somewhat similar effort was once started with ?TaskDescription but it was too theoretic and never got very far. This page aims to be much more concrete and lightweight so that people effectively keep it up to date. CategoryTeams CategoryPackaging'''
