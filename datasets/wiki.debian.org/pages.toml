["https://wiki.debian.org/DebianEdu"]
title = "DebianEdu - Debian Wiki"
full_description = '''Translation(s): English - Italiano - 简体中文 - Deutsch - Português (Brasil) A screenshot from the current Debian Edu "bullseye" release showing the Xfce desktop Contents Release Status, download information and manuals Introduction Before Getting Started Documentation Manuals Howtos Debian Edu meta-packages LibreOffice Debian Help Frequently asked questions Free help Professional help More help Talk to us and participate Mailing lists IRC - Internet relay chat Bug tracking Source Code Contribute - help us to improve! Reports, presentations and experiences Reports Presentations User experiences Other languages Release Status, download information and manuals The status pages include up to date links to installation ISO images. Detailed instructions about how to verify and use these images are part of the Debian-CD FAQ. Bullseye status page (current release) Buster status page (previous release) Bookworm status page (upcoming release) Frequently updated manuals (including translations) are available. Introduction Click on the Introduction page to see information about: What is it? Why consider it? Where we are now? Before Getting Started Click on the Before Getting Started page to see information about: Basic terminology What is a profile? Documentation Manuals Manuals Thorough books covering multiple topics Howtos Howtos Shorter articles covering a specific topic or problem Debian Edu meta-packages Debian Edu packages overview Details about Debian Edu meta-packages LibreOffice LibreOffice LibreOffice's support pages Debian Debian GNU/Linux Debian's support pages Help Frequently asked questions Frequently Asked Questions Frequently asked questions – with answers Free help Free help How to get in touch with the volunteer community, and how to proceed in order to get answers to your questions Professional help Professional help Skolelinux consultants, companies providing support services More help Use the search function of this Wiki! Use the search function of the Debian Edu mailing list (see below)! If you don't find usable information and solutions for your problem, talk to us. See below! Talk to us and participate Mailing lists The coordination of this project happens on the debian-edu mailing list. Go there to subscribe to the list, browse its archives, or view some statistics. If you want to send us an email then just do so; you don't have to be subscribed to the list. (But please mention when doing so if you are not subscribed.) Further mailing lists deal with user support, translation, and other issues. IRC - Internet relay chat irc.debian.org channel topic language #debian-edu development talk English #skolelinux user/admin support multi-language #skolelinux.de user/admin support German #skolelinux.fr user/admin support French Bug tracking Debian Edu uses the Debian Bug Tracking System (BTS). View existing bug reports and feature requests or create new ones. Please report all bugs against the package debian-edu-config. Take a look at How To Report Bugs for more information on bug reporting in Debian Edu. Source Code Debian Edu is part of Debian, sources are available from the Debian archive at the usual locations. Source code repositories on salsa.debian.org Debian Edu core packages (meta-packages, installation, configuration, documentation, artwork). Debian Edu Packaging Team additional packages (web based administration, educational software). Contribute - help us to improve! Everyone can help You can help in many ways: participate in translating manuals write good documentation for education related software help with this Wiki Debian Edu Wiki We try to put all useful information (or at least links to it) into these pages. You can also edit everything or place comments on any page; this is a Wiki! (You need an account and may have to log in first.) Any change in the Debian Edu section of the Wiki will be noticed by the Debian Edu team. See the complete site map. Tasks for Debian Developers DDs can help in many ways: package and maintain education related software, see the related HowTo. sponsor non-Debian Developers who are packaging education related software. help with Debian Installer to produce an even friendlier installer for people with limited computer skills. Reports, presentations and experiences Reports Reports Independent reports about or relevant to Debian Edu Presentations Presentations Presentations held by the Debian Edu team User experiences User experiences Problems, solutions and success stories from Debian Edu users Other languages French: fr/DebianEdu German: http://www.skolelinux.de Italian: http://www.debian-edu.it CategoryPermalink'''
