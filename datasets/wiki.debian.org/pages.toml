["https://wiki.debian.org/FreedomBox"]
title = "FreedomBox - Debian Wiki"
full_description = "عربي - Dansk - Deutsch - English - Español - Français - Magyar - Indonesian - Italiano - Nederlands - Русский - తెలుగు - Türkçe - Українська - (+) FreedomBox: The Home Server Appliance Welcome to FreedomBox support and collaboration space. FreedomBox is a self-hosting server aimed at protecting your privacy and data ownership. You can use FreedomBox at home to replace services provided by third-parties mining your life and using your content. It is also a 100% free software web server that makes it easy to deploy social applications on small machines by providing a selected collection of online communication tools. Thanks to a very friendly interface, you will be able to deploy on demand applications focusing on confidentiality such as file sharing, shared calendaring, instant messaging, secure voice conference calling, blog and wiki. Once installed, the simplicity of setting up and operating a FreedomBox is similar to that of a smart phone. FreedomBox is a product you can just buy, set up and use. Alternatively, you can build it yourself. FreedomBox's software stack is a subset of the Debian universal operating system, designed to be installed on many flavors of inexpensive and power-efficient Open Source hardware, called single board computers (SBC). It can be installed on other hardware too. Continue reading a general overview and get your FreedomBox. Then get instant help and contribute. Intro Information Support Contribute Reports Promote Vision Hardware Live Help Where To Start Translate Calls Talks Overview Download Q&A To Do Design Releases Press Features Manual Contributors Code Blog FreedomBox for Communities FreedomBox Developer Manual HELP & DISCUSSIONS: Discussion Forum - Matrix - Mailing List - #freedombox irc.debian.org | CONTACT Foundation | JOIN Project Next call: Saturday, February 08 at 14:00 UTC This page is copyright its contributors and is licensed under the Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0) license. CategoryFreedomBox CategorySoftware"
