title = "eo/FrontPage - Debian Wiki"
full_description = "Squeeze liberigis ! Elŝuti Manlibro de instalado Eldonaj notoj - Kio nova ? (i386, ...) - Versiaj notoj (i386, ...) - Eblaj problemoj (i386, ...) Lastminutaj notoj: - La eraroj Novaĵoj Komunumo Kontribuu al la vikio Debiano Rapida enkonduko Rapida instalado Aplikaĵadministrado Uzantoj Labortablo Programaro Aparataro Administrantoj Komanda linio Sistemadministrado Retservoj Programistoj Debian-programado Programlingvo Programiloj Català - Česky - Deutsch - English - Español - Esperanto - Français - Indonesian - Italiano - Magyar - Melayu - Dutch - Norsk - Polski - Português (Brasil) - Portuguese (Portugal) - Русский (Russian) - српски - Svenska - தமிழ் (Tamil) - Türkçe - Українська (Ukrainian) - Tiếng Việt - فارسی (Farsi) - Ελληνικά (Greek) - বাংলা (Bengali) - 日本語 (Nihongo) - 简体中文 (Chinese) - عربي (Arabiya) - עברית (Hebrew) - 한국어(Korean) - 正體中文 (Chinese) Tiu vikio estas subtenejo kaj dokumentejo de la projekto Debian. Kiel ĉiuj vikioj, ĝi konstante ŝanĝiĝas kaj ni bonvenigas viajn kontribuojn (). Vi ankaŭ povas paroli pri tiu paĝo. Se vi serĉas ion, provu la serĉpaĝon. Se vi bezonas kontakti iun el la vikia teamo, legu tiun paĝon."
