["https://wiki.debian.org/DebianWiki/EditorGuide"]
title = "DebianWiki/EditorGuide - Debian Wiki"
full_description = "Translation(s): English - Español - Français - Indonesia - Português (Brasil) - Português (Portugal) - Русский - Українська - 简体中文српски-~ Discussion This page provides instructions for people wanting to edit the content of wiki.debian.org. There's a QuickStart for new editors. See also: HelpOnSmileys HelpOnMacros and HelpOnLinking and short HelpOnEditing For generic help on formatting under moinmoin wiki, read moinmoin's HelpContents pages (in the sidebar). Syntax reference is handy. You can experiment in WikiSandBox. If you disagree with any statement below, comment it out, then start a new discussion thread in the discussion page. Contents Your Account Your WikiHomePage Contacting you Subscribe to pages Lost Password Writing Style / WikiEtiquette Links Internal Links Links to external sites Links from external sites Formatting Header sections Disambiguation banner Debian \"official material\" banner Table of Contents sections FAQ sections Footer sections Page Fragments Advanced Formatting/Complex Formatting Images, media and attachments Credits and copyright Attachment location Screenshots Image position \"Work needed\" tags Pages URL/page naming conventions Creating a page Renaming a page Deleting a page Merging and splitting pages Redirect pages Categories Portals Turning pages into portals Image Data Base Translations Synchronizing translations Wiki translators Helping with wiki.debian.org Promoting wiki.debian.org Frequently Asked Questions Technical Information Your Account Your wiki username should be in the format \"FirstnameLastname\" (\"IrcNickname\" or your Debian Developer login are fine too). Adjust the timezone in your userprefs page. Your WikiHomePage You can use the HomepageTemplate when you create your homepage. Here are ideas for content, grabbed from various existing homepages. Your full name. Your main homepage outside this wiki. Your email address. Your location (city and country) useful for timezone considerations and more. If you use IRC, your usual server, channel and nickname. If you are a Debian Developer (DD), your login name (with a link to https://qa.debian.org/developer.php?login=foobar@debian.org). Non-DDs can link to https://bugs.debian.org/from:foo@bar.com. Your subjects of interest (not limited to Debian). Your !ToDo/Done list. (Some of) Your contributions to open source (bug reporting; writing/translating; developing/maintaining...) Make sure you keep the CategoryHomepage tag at the bottom of your homepage (present by default in the HomepageTemplate). Contacting you If you are editing the wiki a lot, you might want to include your contact information on your WikiHomePage and also join the debian-www mailing list and #debian-www IRC channel (web version). Subscribe to pages You could subscribe to the pages relevant to your subjects of interest. Lost Password If you lose your wiki.debian.org password, go to the page recoverpass, then follow the instructions there (type your email address, then click on \"Mail me my account data\"). Writing Style / WikiEtiquette There are at least five major styles of Wiki page TreeMode DocumentMode ThreadMode NewsMode CategoryHomepage Elements of good style for each type are explained further on their individual pages. Try to maintain balance when writing. This includes visual balance, but also an attempt to avoid bias. If you find that your comments are controversial, sign them, so that others will feel more free to disagree publicly. Don't make EveryThing into a UselessWikiName. Knowing when to make a new page is one of the hardest parts of WikiStyle. RefactorMercilessly There is no page in the WikiUniverse that is finished. All content can be refined. See RefactoringWikiPages for many useful thoughts. If the wiki topic is fairly long, then it would be good style to give a quick overview of what has been discussed in the topic as a sort of concluding paragraph. If a concluding paragraph cannot be easily written then perhaps the scoping of the topic was not right, and it should either be separated into subtopics or merged with others into one larger topic. This is common when ThreadMode meanders off topic. See also this GoodStyle page. Links Don't overuse linking. If there are too many, the reader won't know which links are useful. You can move some of the links to a \"See also\" section at the bottom of your page (but again, not too many). Where links point to a page in another language, append \"(in $language)\", thus: ?Something (in French) See also moinmoin's HelpOnLinking Internal Links Internal Links (within this wiki) [[FooPage]] is usually the preferred syntax. [[SomeParentPagewith/FooPage|FooPage]] is frequently used to shorten subpages. [[EditorGuide|editor guide]] can be used to help fit the link name into a sentence as normal lower-case words. Don't \"rename\" the link by using [[PageName|Another title]] (if you have to do this, it implies the page is misnamed). In all cases, make sure that the link label is meaningful to visitors, and that the link doesn't lead somewhere unexpected (preferably, the link label should be the same as the page title). To link within a page, you should define the target anchor using <<Anchor(bar)>> (see HelpOnMacros), then use [[#bar|Bar Chapter]] or [[Foo#bar|Bar Chapter]] (where Bar Chapter is the actual paragraph title). Links to external sites The preferred way to link to external resources is: https://www.debian.org/doc/ - Debian Official documentation repository. (Avoid the notation [[https://www.example.com|link label]] , which hides the target URL, unless the context makes it clear, as in \"John Doe provides a script named test.sh.\") Group external links in the last section of the page. Call this section External links. Any \"project homepage\" link can go in this section, or (if there are no other external links) a See also section. Use InterWiki format to link to Debian packages, bugs, RFCs and Wikipedia articles. Links from external sites If an (important) page is linked from outside Debian, it's a good idea to tag it with CategoryPermalink, so that nobody removes it inadvertently. Formatting Header sections Material that naturally belongs in an (optional) \"header\" area at the top of the page includes: Links to translated versions (make sure they really exist!): Translation(s): [[de/DebianWiki/EditorGuide|Deutsch]] - [[fr/DebianWiki/EditorGuide|Français]] A Discussion link, for controversial material: (!) [[/Discussion|Discussion]] Compare DefaultTemplate To ease the updating and synchronization of the translation headers of all the language versions of a page, the English version's is the only one that should be modified, and included in all translated versions via the macro Include. To accomplish this, the translation header in the English version, must be surrounded by special comment tags, which will tell the macro Include what to include in the translated pages. In the original English page Make sure the English language is a self-referencing link to the English page itself (not a simple text), like this: [[<PageName>|English]]. Insert this before the line with the list of translations (remember to substitute <PAGENAME> for the actual page name):##For Translators - to have a constantly up to date translation header in you page, you can just add a line like the following (with the comment's character at the start of the line removed) ##<<Include(<PAGENAME>, ,from=\"^##TAG:TRANSLATION-HEADER-START\",to=\"^##TAG:TRANSLATION-HEADER-END\")>> ##TAG:TRANSLATION-HEADER-STARTInsert this after the line with the list of translations:##TAG:TRANSLATION-HEADER-ENDIn your translated page Insert this instead of the translation line (remember to substitute <PAGENAME> for the actual page name):<<Include(<PAGE_NAME>, ,from=\"^##TAG:TRANSLATION-HEADER-START\",to=\"^##TAG:TRANSLATION-HEADER-END\")>>See the DefaultTemplate and its translations for examples on this and how it works. Disambiguation banner Sometimes, a page's name can be ambiguous. If this can't be avoided, you can insert something like this at the top of the page: Disambiguation : This page is about Debian Conferences. For Debian configuration management system, see debconf. Sample: ||<tablestyle=\"width:65%;margin-left:35%;padding-left:30pt\" style=\"border:1pt solid #b48;border-left:5pt solid #d4a\">'''Disambiguation :''' This page is about ''Debian Conferences''.<<BR>> For ''Debian configuration management system'', see [[debconf]].|| Debian \"official material\" banner Often, the content of a Debian wiki page is also covered by some piece of \"official\" Debian Documentation (or in some other \"reference\" location). The wiki page can still be useful for collaboration. It's a good idea to add a link to the reference location at the top of the page. Sample link presentation to some official page, related to the current subject. https://www.debian.org/somewhere - Sample topic Sample: {{{#!wiki debian https://www.debian.org/somewhere - Sample topic }}}The logo's license is Portal/IDB#debian-official-doc-modif-fpiat. Table of Contents sections If a page gets long, you might want to add a Table of Contents. See the example at the top of this page! Sample (note how the table is indented with one space): <<TableOfContents(2)>> FAQ sections A typical FAQ section could be formatted like this: Q. How do I do XXXX? A1) You can do XXXX by doing X. A2) You can do XXXX by doing Y. Sample (notice the space at the beginning of the lines): Q. How do I do XXXX? :: A1) You can do XXXX by doing X. :: A2) You can do XXXX by doing Y. Footer sections Material that naturally belongs in an (optional) \"footer\" area at the end of the page includes: \"See also\" sections Link to \"Parent Page : ?ParentPageName\" (if the page is a SubPage). Categories to mark connections with other pages Credits for attachements Work Needed tags Compare DefaultTemplate Page Fragments Not only code can be be reused - page content can too! If you notice that a given paragraph has to be repeated on many pages, you can reuse (\"include\") a page fragment each time. (Do not abuse this to duplicate content everywhere!) A page meant to be included in another should be named */!PageFragment/* Add a hidden comment (##) at the top of the page so people understand why it's \"incomplete\" (a fragment!) See the <<Include()>> macro in HelpOnMacros A sample is available at InstallingDebianOn and InstallingDebianOn/PageFragments/Philosophy. Also note how the page is included inside a table (but don't use this hack to bypass moinmoin formatting limitations: see Complex Formatting). Advanced Formatting/Complex Formatting Avoid using \"advanced\" formatting (using tables, include, etc.) It's difficult to understand and maintain for you and other wiki editors. It's difficult to read the diff of complex formatting. The GUI editor may break your layout. Images, media and attachments See also: moinmoin's HelpOnLinking. Credits and copyright Add credits and copyright information at the bottom of the page where you attach an image, typically: ## attachments: ## openlogo-100.jpg Copyright 1999 \"Software in the Public Interest\" from https://www.debian.org/logos/openlogo-100.jpg Attachment location It's often a good idea to attach the image to the parent page (in case the image is reused in other subpages). For translated pages, attach the image to the English version (internationalized/localized images should be attached to the internationalized/localized pages). Screenshots If you want to include a screenshot, you might want to store it on https://screenshots.debian.net/, then use : [[https://screenshots.debian.net/screenshot/amide|{{https://screenshots.debian.net/thumbnail/amide|Screenshot|width=160}}]] Note the package name appears twice in this block. Example: Image position It is possible to shift the images to right of the page, thanks to CSS' float:right: ||<tablestyle=\"float:right; width:100px; background:transparent; margin: 0 0 1em 1em;\" style=\"padding:0.5em; border-style:none;\"> {{https://www.debian.org/logos/openlogo-nd-75.jpg}} ||Note: adjust width:100px to fit your need. \"Work needed\" tags Translation(s): English - español - Português (Brasil) - Українська A tag is a WikiName that has special meaning to the community. It is used to group pages, by searching for the tag and seeing all the pages that have it. Under MoinMoin wiki, one should use Categories. WikiTags related to ongoing work on the wiki can be found at DebianWiki/Administration#Current_tasks. Note: do not use the #deprecated processing instruction, as it prevents further editing of the page (e.g. to fix broken links). If you need to mark a page as needing to be improved/removed, use an appropriate WikiTag instead. These tags are meant for wiki editors, not for visitors, so don't make them too intrusive; instead of putting a warning tag at the top of the page, insert it in the page's footer. Pages URL/page naming conventions Use only CamelCase formatting (as opposed to Underscore_Separated). There may be exceptions to this rule, for example pages named after commands or other situations where the page is named after something that does not use CamelCase. The first letter of the first word should be upper case. Special characters should be avoided in page names. Slashes function to create (directory-style) groups of related subpages. If your page clearly belongs to a collection, you might consider creating it as a subpage - see for example the Moinmoin documentation SubPages. For translated pages, see Translation section. Picking an appropriate name is important. It should clearly state what the page is about and should contain the word visitors will search for. Avoid ambiguous names - don't use, for instance: \"About\"... about what? About the Debian OS, community, wiki...? \"Release\"... does it mean previous releases, the current stable release, the release life-cycle, future release status, release process, release team, etc... Creating a page Before you create a page, ask yourself some questions: Is a new page really needed? Might it already exist under a different name? Could the content be added to an existing page? Does it comply with the wiki.debian.org Content guidelines? link If you decide to proceed: Choose a unique name for the page - see URL/page naming conventions. Search the CategoryPortal page for an appropriate portal page (you may find more than one - choose the best) and click on it Once on the portal page, click on the Edit link and add the name of the new page you want to create (with \"link\" formatting) to the existing list of page links Save the edited portal page and then click on the \"?\" link in front of the new page that is to be created; this will take you to a page where you have the option to create the new page You can then either create a blank page, but the recommended option is to pick the appropriate template - DefaultTemplate is the recommended one If your page relates to a subject already covered by some official Debian documentation, link to it at th"
