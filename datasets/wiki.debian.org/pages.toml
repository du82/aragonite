["https://wiki.debian.org/WhyDebian"]
title = "WhyDebian - Debian Wiki"
full_description = '''Translation(s): Dutch - English - Español - Français - Italiano - Polish - Português (Brasil) - Русский - tiếng Việt - 简体中文 "Why Debian?", you may ask. Debian is another GNU/Linux distribution, and it is another Unix-like operating system. What makes it better than the rest? Why should I use Linux at all? Well, this document explains all: https://people.debian.org/~srivasta/talks/why_debian/talk.html To ensure that this document is available to all, it is archived here: Contents Why Linux? Why Debian? Philosophy and Community Utility and usability Quality of implementation Feature set and Selection of Software Kernels User Land Maintenance and administration Portability and Hardware Support Source Builds Security and Reliability Scalability and Performance Conclusion Acknowledgement Other Resources Why Linux? Why Debian? By Manoj Srivastava (srivasta at debian.org) I am perhaps not the best person to talk about a dispassionate comparison of operating system choices, partially because I am not unbiased, and partially because of my limited experience with any OS that is not my primary choice. I am also not a prime candidate for advocacy of my choices, since the reasons I have chosen what I like are unlikely to be universal, and the environment in which I originally made my decision (since there is a modicum of historical inertia that keeps me where I am) no longer exists. However, I have tried to make this talk have a broader perspective than my views alone, and have solicited the opinions of other folks that have made the same choices that I have -- but given how subjective this topic is, I am going to speak here mostly from my perspective, and the perspective of people who have already selected Debian. Given the nature of the primary audience for this talk, I am not going to spend much time expanding on why one should choose a UNIX like OS over Microsoft's operating systems. Suffice it to say that the following criteria pointed me unequivocally away from Windows: Security. Flexibility. Control of features. Philosophy. Cost. Speed. Efficiency. Reliability. Availability and choices in application software. Susceptibility to Worms and Viruses. Openness and speed of resolution of known flaws. Clustering. Multi-user OS. Not having the GUI or a HTTP browser as an integral part of the OS. https://www.michaelhorowitz.com/Linux.vs.Windows.php provides a relatively unbiased comparison of Linux and Windows, and can serve as an introduction of Linux to Windows users. It does have more of a commercial bent than is appropriate for this talk (the concern of the market success of Linux distributions/companies, for example). Philosophy and Community Ultimately, philosophy is the most durable differentiating criterion between the operating systems we are considering. Performance numbers change. Ease of use, reliability, availability of software -- all these characteristics change over time, and you have to go out and re-evaluate them over time. I must confess that philosophy and community is what led me originally into the Linux camp, and then to Debian; and I think these are still the most important criteria, and are often underrated. Why is free software a good thing? Over nearly two decades that I have been involved with free software, I have asked people this question (and often been surprised by the answers). The popular answer seems to be because it is cool, or because it is zero-cost. The motivations of the authors also are varied, but the coin that they get paid in is often recognition, acclaim in the peer group, or experience that can be traded in in the work place. But I think that is missing the critical raison d'être for free software -- the standing on the shoulder of giants aspect. I like to give the analogy to the manner in which academic research is conducted. If researchers were doomed to reinvent the wheel, and discover for themselves everything beyond what existed in the textbooks, then progress in the research community would be stunted. Most of my peers got their start in research by doing literature searches, looking for interesting investigations, and perhaps correlating unrelated papers, building on the ideas and techniques of other researchers in the field. The secrecy shrouding research in most labs exists only till the moment of publication -- and then people share their techniques, and ideas, and results -- indeed, reproducibility is a major criteria of success. Contrast this with proprietary software, where we do all begin from scratch -- I believe we could soar, if only we could freely share and build upon the ideas and labours of others. This would lower the time, effort, and cost of innovation, allow for best practices and design patterns to develop and mature, and reduce the grunt programming that raises the barrier to developing solutions in house. We just have to ensure that the incentive for achievement still exists (and it need not be purely a profit motive). This belief led me to chose the GPL, and free software foundation view of things, as opposed to the BSD licence, which are also free software licenses, and led eventually to choosing Debian. In my personal opinion, the BSD license has been more about personal pride in writing free software, with no care as to where the software went; I want more than that. I want my labours to help build a synergistic community; to feed back into a well spring of useful software. Debian is an exercise in community barn building; together, we can achieve far more than we could on our own. The Debian social contract is an important factor in my choice of Debian, with its blend of commitment to free software, and pragmatic recognition that there are going to be cases where usability demands software that does not meet our guidelines. Community is the other reason I went to Linux rather than the BSD's. At the time I was looking around for a free UNIX like OS to put on my brand new university issued 386, the BSD's were far more robust, and performed far better, and I had friends who swore by the BSD's. What turned me off was the caste system that permeated the BSD community. There were core developers up on high, and you went down to lowly newbie wannabe contributors. The Linux community, though rambunctious, seemed far more inclusive -- your pedigree mattered less than the code you produced. And I could contribute immediately to developing the OS I would be running. I guess this is another reason I like Debian -- I have been there long enough to guide it into being the OS that is laid out the way I think. Utility and usability Assuming I have not totally lost the pragmatists amongst you, the criteria that the vast majority of people hold highest while choosing an operating system are, after cost, utility and usability. Of course, utility depends on what your goals and requirements are, but there broad areas we can still address. There is more to an operating system than a kernel with a hodge-podge of software thrown on the top - systems integration is a topic usually given short shift when discussing the merits of a system. But a well-integrated system - where each piece dovetails with and accommodates other parts of the system - has greatly increased utility over the alternative. Debian, in my experience, and the experience of a number of my respondents, is the best integrated OS out there. Debian packages trace their relationships to each other not merely through a flat dependency/conflicts mechanism, but a richer set of nuanced relationships - Pre dependencies, ordinary dependencies, recommendations, suggestions, conflicts, and enhances relationships. Apart from this, packages are categorized according to priority (Essential through extra), and their function. This richness of the relationships, of which the packaging system is aware and pays attention to, indicates the level at which packages fit in with each other. Debian is developed by about 1000 volunteers. That means that every developer is free to maintain programs he is interested in or he needs for his special tasks in real life. That's why Debian is able to cover different fields of specializations - its developers just want to solve their own special problems. This broad focus is different from commercial distributions which just try to cover mainstream tasks. I have found that the Debian machines at work take less hand holding, are easier to update, and just plain don't break as often as the Red Hat and Mandrake boxes I manage. I am told that dealing with SunOS, for example, is far more, umm, interesting. One of the reasons for selecting Debian over other distributions is the sheer size of the project which strongly suggest that Debian won't suddenly disappear and one is suddenly left without any support. Debian can't go bankrupt. Its social contract doesn't allow the project to abruptly decide not to support non enterprise versions of the distribution. I do not want my OS to be held hostage to anyone's business plan! You can fine-tune the degree of risk you want to take, since Debian has three separate releases: Stable, Testing, and Unstable. On some of our machines (the server, the kiosk machines) we run 'stable'. Some of the other systems (individual work-stations) run various combinations of testing/unstable. (Note that there are no security updates for testing). I run some stuff from experimental on my own work-station. What's great is the ability to make finely graded decisions for different machines serving different functions. But even the more adventurous choices are solid enough that they virtually never break. And `stable' just never breaks ;-). Debian provides a great deal of feedback upstream. For example, the XFree project does not itself maintain or debug X on all the architecture Debian supports -- it relies on Debian for that. There have been a number of deep fixes to libc (there was a recent reference counting flaw in glibc when dlopening a shared object with certain ELF dependencies discovered by the Debian developers). This attention to detail is hard for any other Linux distribution to match. The level of knowledgeable, fast, and friendly help available for end users is just extraordinary -- and nothing I have been able to match from old style commercial companies like DEC -- unless you are paying them really big bucks. This can provide third party support without in house expertise, for businesses building upon Debian. For derivative systems, DFSG and "main" simplify building systems with predictable licensing. Quality of implementation People often say how they came to Debian because of apt-get, or that apt is the killer app for Debian. But apt-get is not what makes the experience so great: apt-get is a feature readily reproduced (and, in my opinion, never equalled), by other distributions -- call it urpmi, apt4rpm, yum, or what have you. The differentiating factor is Debian policy, and the stringent package format QA process (look at things like apt-listchanges, apt-list-bugs, dpkg-builddeps, pbuilder, pbuilder-uml -- none of which could be implemented so readily lacking a policy (imagine listchangelog without a robust changelog format)). It is really really easy to install software on a Debian box. This resembles cargo cult (https://en.wikipedia.org/wiki/Cargo_cult) religions: that is, apt-get is the visible aspect of Debian's policy system, the same way that cargo-cult practices saw runways and other characteristics as the source of western goods ("cargo"), and built their own replicas, complete with fake wooden headphones for control towers. In the same way, other distributions have created the shallow visible aspect of Debian's packaging infrastructure, without addressing the deep issues of policy. Worse: the conflicts of technical requirements and marketing / economic imperatives often work at cross purposes. Less perversely for most GNU/Linux distros than for proprietary software, but still clearly present. Red Hat, Mandrake, and other distributions in the class have really massive base installations. Why? I do believe it's because it's a PITA to install software. Even with RPM, it's a kludgey procedure, impossible to codify. With Debian, it was a breeze. So the killer app is really Debian policy, the security team, the formal bug priority mechanisms, and the policy about bugs (namely: any binary without a man page is an automatic bug report. Any interaction with the user not using debconf is a bug). As the Wiki page Why Debian Rocks (http://twiki.iwethey.org/Main/WhyDebianRocks) puts it: This is the crux, the narthex, the throbbing heart of Debian and what makes it so utterly superior to all other operating systems. Policy is defined. It is clear. It is enforced through the tools you use every day. When you issue apt-get install foo, you're not just installing software. You're enforcing policy - and that policy's objective is to give you the best possible system. What Policy defines are the bounds of Debian, not your own actions on the system. Policy states what parts of the system the package management system can change, and what it can't, how to handle configuration files, etc. By limiting the scope of the distribution in this way, it's possible for the system administrator to make modifications outside the area without fear that Debian packages will affect these changes. In essence, Policy introduces a new class of bugs, policy bugs. Policy bugs are release-critical -- a package which violates policy will not be included in the official stable Debian release. Let me reiterate, because that is the whole secret: A package which violates policy will not be included in the official stable Debian release.Add to that the Debian QA team which does non maintainer uploads (NMUs), helps with bug cleanup, performs security updates, and ensure that there is someone looking at the system holistically, and working to create an integrated OS, as opposed to merely fixing individual packages in isolation. That is what makes people swear by Debian. There are a lot of tools in the QA subsystem to help developers take care of their packages -- just look at https://qa.debian.org/developer.php?login=srivasta. The evaluation process each package has to undergo in the unstable distribution before it makes it into testing adds to the quality of the finished product. Once a package has not shown any important problem for a certain time period, it goes into the testing distribution. This distribution is the release candidate for the future stable distribution, which is released only when all release critical bugs are resolved. This careful testing process is the reason why Debian has a longer release cycle than other distributions. However, in terms of stability this is an advantage. (Note: RH Enterprise Linux is apparently shooting for 12 - 24 month release cycles. Closer to what Debian historically had.) The fact that Debian supports as many architectures as it does also feeds into t'''
