["https://wiki.debian.org/pt/ProjectNews/HowToContribute"]
title = "pt/ProjectNews/HowToContribute - Debian Wiki"
full_description = '''Translation(s): English - Español - Français- Italiano - 한국어 - Português - Português Brasileiro ?/Discussion Esta página explica como contribuir para o Debian ProjectNews e o que TU podes fazer para ajudar. Contents Como contribuir para a DPN Envie notícias interessantes O que deve enviar O que não necessita de assinalar Ajuda de falantes nativos Tornar-se um editor Acesso ao repositório Git DPN Formato do ficheiro index.wml Traduzindo Debian Project News Uso do "Translation check" para seguir as versões originais do documento (FIXME: Outdated section) Publicar a sua tradução Fluxo de trabalho de tradução Como contribuir para a DPN Contribuir para ProjectNews é fácil mas depende das suas habilidades e do tempo disponível que lhe pode dedicar. Todo o material fornecido ao repositório publicity (p.e. as suas contribuições) serão publicadas no site web Debian sob os termos das licenças MIT (Expat) ou GPL2+ Envie notícias interessantes O modo mais simples de nos ajudar é informar sobre acontecimentos interessantes que ocorram no universo Debian. Debian é um projecto bastante grande e não possuímos os recursos humanos necessários para monitorizar conteúdo para adicionar ao nosso ProjectNews em todas as listas de correio, blogues e sites de notícias. Assim diga-nos se reparar em algo interessante que ocorra. Pode geralmente fazê-lo através do envio de um E-Mail para debian-publicity@lists.debian.org . O que deve enviar De um modo geral: tudo o que possa ter algum impacto de notícia em larga escala sobre o projecto Debian e relacionado com os utilizadores em particular. Algumas ideias: Discussões que ocorram numa mailing list, que: tenham um impacto de notícia em Debian (p.e. Discussão sobre licenças, uma transição planificada de software) contenham um debate interessante relacionada com o Projecto X ao Projecto Y e suas Resoluções Gerais, etc.) Pequenos anúncios de sub projectos: debian installer perto do lançamento da versão beta3, necessário testes traduções debconf no idioma Francês atinge 100% o cdrkit é capaz de gravar discos blue ray mail "Notícias de " etc... Relatórios de erros interessantes (alguma vez olhou para o 245047?) Representa Debian numa conferência ou exibição (com um stand, comunicação, etc.) Escreveu um relatório depois de ter representado Debian numa conferência ou exibição Foi entrevistado sobre o seu trabalho em Debian Análises / testes / artigos noutros suportes / sites web / mailing lists / blogues Conferências, mini ?DebConfs, FOSDEM, CeBIT, etc. etc... O que não necessita de assinalar Lançamento Debian -- provavelmente já sabemos Claro que a lista acima está longe de estar completa. Gostaríamos de salientar que não podemos monitorizar outros suportes de media , sites web, blogues e tudo o resto. É assim valiosíssimo qualquer possa assinalar qualquer coisa que considere encaixar no ProjectNews, enviando para a nossa mailing list debian-publicity@lists.debian.org. Tenha em mente que para nós um dos objectivos primários, além de manter os outros utilizadores informados, é mostrar que somos uma comunidade viva e trabalhadora! Ou seja mostrar que Debian está a vingar, que está viva! Ajuda de falantes nativos Actualmente o editor principal não é falante nativo Inglês. Ele sabe-o e provavelmente já reparou também. Assim uma das coisas em que pode ajudar como falante nativo é corrigir o seu en_DE para Inglês correcto. As publicações são criadas em rascunho no repositório Git. Abaixo encontram-se detalhes de como aceder ao cliente Git na seccão "Tornar-se um editor"..Mesmo que não seja familiar com o Git, pode sempre descarregar a publicação actual a partir do repositório Inglês do DPN, revê-lo e enviar comentários para a mailing list debian-publicity. Preferiríamos receber as suas alterações como diff ou wdiff, se possível: Faça apenas uma cópia do ficheiro descarregado, edite-o e envie-nos o resultado do diff -u <ficheiro antigo> <novo ficheiro>. Tornar-se um editor Se desejar contribuir directamente e adicionar pequenos artigos ao ProjectNews sinta-se livre para se juntar à equipa: Deverá subscrever a mailing list debian-publicity em http://lists.debian.org/debian-publicity, já que toda a discussão ocorre lá. Pode também querer subscrever o pseudo-pacote em https://tracker.debian.org/pkg/press. Sempre que uma alteração é enviada (commit) para o repositório Git um email é enviado para a lista, tornando-se assim muito fácil estar actualizado. Veja https://lists.debian.org/debian-publicity/2018/04/msg00001.html para saber os passos específicos a tomar. Se for um Developer Debian deverá ter já acesso de escrita ao repositório Git. Se não for um Developer Debian, pode enviar as suas propostas para a lista de correio, ou usar a sua conta Salsa para enviar contribuições. Se já possui uma conta e quiser fazer contribuições a longo termo, faça login na plataforma Salsa Debian com a sua conta e então pode simplesmente fazer um pedido para se juntar ao projecto publicity. Se já possui uma conta mas apenas quiser fazer contribuições esporádicas, pode fazer um fork do repositório e submetê-lo a nós Merge Requests. Se não tiver uma conta e quiser criar uma faça-o em registe-se no Salsa e efectue um pedido para se juntar ao projecto publicity. Neste ponto deverá mesmo ler as nossas ?Guias para artigos do ProjectNews. Acesso ao repositório Git DPN A publicação DPN em preparação pode ser "folheada" através do nosso repo Git em Salsa Antes de aceder ao repositório Git, poderá querer ler a documentação Salsa para usar o repositório Git mais convenientemente. executar git clone git@salsa.debian.org:publicity-team/dpn.git. Este comando irá criar um directório dpn contendo o Debian Project News. A versão actual está no sub-diretório current do directório dpn. Se quiser pode mudar o nome daquele directório para algo que lhe seja mais conveniente. Coloque-se naquele directório. Qualquer coisa que faça: nunca apague ou altere o conteúdo do directório .git! Contém alguma meta data necessária para que tudo funcione correctamente. Pode agora editar o Debian Project News. Não se preocupe se não tem muita experiência com Git ou a linguagem Website Meta Language / HTML (que é usada para o site web Debian). Nada que faça aparece directamente no site e todos os erros que possa fazer podem ser desfeitos com relativa facilidade. Acesso anónimo ao repositório Git Se não possuir uma conta Salsa pode aceder ao repositório Git anonimamente. Pode verificar o rascunho actual do Debian Project News utilizando o comando: git clone https://salsa.debian.org/publicity-team/dpn.git. Este comando irá criar um directório dpn contendo o Debian Project News. O último rascunho encontra-se no directório dpn/current. Edição Mude para o directório contendo o checkout. A não ser que tenha alterado o nome, deverá ser dpn. Antes de editar deverá correr git pull. Assim actualizará a sua cópia local com qualquer alteração que exista. Pode agora editar index.wml à sua vontade. Veja abaixo para detalhes sobre os formatos. Submeta as suas alterações com git commit index.wml Depois de alterar o index.wml, por favor corra git update --rebase, para o caso de alguém ter modificado o documento enquanto você estava a trabalhar nele. O Git tenta ser inteligente quando se aplica alterações exteriores ao seu documento modificado. A não ser que tenha modificado a mesma linha, tudo deverá funcionar correctamente. Se modificou as mesmas linhas, terá então sido criado um conflito, que tem que ser resolvido. Por favor veja esta página para saber como proceder. Assim que a sua cópia local esteja actualizada, pode enviar as suas alterações para o repositório central executando git push. Parabéns, acabou de contribuir para a próxima publicação do Debian Project News! Note também que existem diversos frontends gráficos para o Git. No entanto como o escritor deste artigo não tem experiência com qualquer um deles, não os recomenda. Mais duas recomendações para submeter as suas alterações: Use por favor uma mensagem útil quando submeter a alteração (a descrição das suas alterações com o parâmetro "-m" à frente). Tente não escrever linhas longas. Tracking changes / viewing diffs é mais simples, quando o comprimento da linha é inferior a ~80 caracteres. A maior dos editores podem ser configurados para mudar de linha automaticamente. Formato do ficheiro index.wml O Debian Project News está disponível em três formatos: Como um email enviado para a mailing list debian-news (em formato texto) Como versão HTML do Debian's website. Como feed RSS. Todos estes formatos são gerados a partir do ficheiro index.wml. O site web Debian utiliza website meta language (WML) para criar as páginas web. Grosso modo o WML é HTML com macros embebidas (p.e. para elementos comuns em vários sites) e a possibilidade de embeber scripts perl, p.e. Para criar uma lista de publicações DPN baseada nos ficheiros disponíveis. Não se preocupe: não tem que saber WML ou perl (apenas HTML básico) para contribuir para o DPN. Com alguma sorte tudo está já no sítio correcto e apenas temos que criar o conteúdo com o mínimo de markup HTML. Se olhar para um ficheiro index.wml vazio (pode olhar para este que é usado como modelo) notará que começa da seguinte forma: #use wml::debian::projectnews::header PUBDATE="2017-MM-DD" SUMMARY="" #use wml::debian::acronymsA primeira linha diz ao compilador wml que deverá utilizar o modelo do project-news para o cabeçalho. Define também duas variáveis para a data de publicação e um pequeno sumário. O sumário é utilizado por exemplo na página de índice das publicações recentes. Não deverá ser muito longo. A linha acronyms permite o uso de acrónimos específicos, que mostram uma explicação aquando da passagem do cursor sobre o texto do acrónimo. No final do ficheiro deverá ver algo similar a isto: #use wml::debian::projectnews::footer editor="The Publicity Team with contributions from contributor1, contributor2, contributor3"Esta linha diz ao compilador wml para adicionar um rodapé normal à página web. A variável editor adicionará os nomes dos contribuidores listados no documento. Tudo o que está entre estas linhas é praticamente HTML regular, o que no nosso caso significa basicamente: alguns títulos (<toc-add-entry>...</toc-add-entry>), alguns parágrafos (<p>...</p>) ou algumas listas (<ul><li>...</li><li>...</li></ul>). Cada artigo deve começar com um nome de entrada único: <toc-add-entry name="$unique_anchor">$meu_título</toc-add-entry> <p>este é o conteúdo do meu pequeno artigo, onde posso inserir <a href="http://debian.org/">ligações</a> e outro markup HTML regular.</p>O conteúdo entre <toc-add-entry> e </toc-add-entry> é o título actual. Depois disso segue-se o artigo actual entre <p> e </p>. Pode usar vários parágrafos destes mas note que apenas o primeiro irá aparecer no feed RSS (O que pode ser algo a corrigir, se souber perl suficiente...). Como anteriormente explicado, pode utilizar HTML normal neste parágrafos. O que significa: <q>...</q> para citações ou nomes de lançamentos: Debian 6.0 <q>squeeze</q>, Steve McIntyre disse: <q>Booh!</q> <a href="..."> para ligações: O secretário <a href="http://lists.debian.org/debian-devel-announce/2010/03/msg00000.html">chamou por nomes a nomear</a> para as eleições de líder de projecto. <!-- ... --> para comentários que não aparecem no site web: {<!-- TODO: Adicionar uma ligação assim que esta discussão chegue a uma conclusão! --> Como o Project News é também lido por utilizadores pouco familiares com o jargão interno e acrónimos de Debian, use por favor o <acronym ...> </acronym> tag (não fazendo parte do HTML mas um dos nossos templates wml). Veja o exemplo seguinte: Um dos tópicos discutidos foi: <q>Race against <acronym lang="en" title="None of the above">NOTA</acronym>.</q>Apesar de não funcionar na versão de texto para e-mails, pelo menos a versão HTML para sites web e para os feeds RSS irá marcar o acrónimo de modo a surgir a explicação quando o utilizador mover o cursor sobre o acrónimo. Pode ver um exemplo em http://www.debian.org/News/project/2009/02/ (procure por DPL). Traduzindo Debian Project News Sinta-se livre para usar o repositório Git para o seu trabalho de tradução também. Nestes casos é mais fácil fazer check out da hierarquia completa do repositório DPN, execute: git clone git@salsa.debian.org:publicity-team/dpn.git cd dpn Verifique agora se já existe um directório com o seu idioma. Em caso negativo Crie um, p.e. mkdir fr Crie o sub-directório ano/publicação correspondente (p.e. mkdir -p 2015/07) Adicione uma primeira versão (pode ser inacabada) da sua tradução como index.wml Adicione-a ao repositório, p.e. git add fr/ Faça um commit local com as suas alterações git commit -m "primeiro passo na tradução" E faça push das suas alterações para o servidor central, p.e. git push Pode agora imitar a mesma estrutura do directório en. Publicações antigas são guardadas em directórios específicos en/<ano>/<publicação>, a publicação actual está em en/current. Irá reparar que o en/index.wml-template é uma publicação vazia e é utilizada como um template para iniciar uma publicação nova. Para algumas directrizes de Git e uma pequena descrição sobre o formato dos ficheiros wml, veja por favor Tornar-se um editor. No entanto note que: As traduções devem usar um cabeçalho #use wml::debian::translation-check translation="<revision_git_hash>" para marcar a revisão da publicação original da qual a tradução se baseou. No entanto, por agora deixe apenas em branco a <revision_git_hash>, a pessoa que publicar a edição copiará o hash correspondente quando a versão Inglesa for adicionada ao repositório do site web. Tal como no campo editor na linha #use wml::debian::projectnews::footer os tradutores podem adicionar um campo translator de um modo semelhante. Veja o seguinte exemplo (para Francês): #use wml::debian::projectnews::footer editor="L'équipe en charge de la publicité avec des contributions de Thomas Lange et Paulo Henrique de Lima Santana et Jean-Pierre Giraud" translator="Jean-Pierre Giraud, l\'équipe francophone de traduction" Uso do "Translation check" para seguir as versões originais do documento (FIXME: Outdated section) Note: This section is outdated, the script was designed to use Subversion and now we use Git. We keep the info here for the case somebody wants to update the script. Se utilizar o repositório do publicity pode usar o script em scripts/trans-check para seguir quais das suas traduções estão actualizadas. As suas traduções necessitam de um translation check para esta funcionalidade funcionar. Por exemplo: #use wml::debian::translation-check translation="45"Isto dirá ao script (e mais tarde ao site web Debian) que a sua tradução foi baseada na revisão 45 do documento original. O único parâmetro a fornecer é o idioma a ver verificado ou mais precisamente: o directório que deverá ser comparado ao directório en/. Veja o exemplo seguinte: alex@rusalka:publicity/dpn$ scripts/trans-check fr Found 'fr/current/index.wml' is ou'''
