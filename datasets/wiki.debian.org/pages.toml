["https://wiki.debian.org/git"]
title = "git - Debian Wiki"
full_description = "Translation(s): عربية - English - Français - Italiano - Svenska Git is a popular version control system designed to handle very large projects with speed and efficiency; it is used mainly for various open source projects, most notably the Linux kernel, xorg, OLPC, Wine, Samba, swfdec and many others. Git falls in the category of distributed source code management tools, similar to e.g. GNU Arch or Monotone (or Bitkeeper in the proprietary world). Every Git working directory is a full-fledged repository with full revision tracking capabilities, not dependent on network access or a central server. Git tools under Debian git - git itself git-gui , gitk - The git graphical user interface (based on tcl/tk). giggle - Gtk+ frontend for the git directory tracker git-buildpackage - Suite to help with Debian packages in Git repositories git-dpm - Another suite to help with Debian packages in Git repositories There are many other tools, see git Debian development Salsa/Doc - Using Git on Salsa GitSrc - .git.tar.gz format for debian source packages. PackagingWithGit - Using git to maintain Debian packages See also http://git-scm.com/ - Project homepage. progit Other VersionControlSystems https://wiki.archlinux.org/index.php/Git - Git on Arch Linux wiki CategorySystemAdministration CategorySoftware CategoryCommandLineInterface CategoryVersionControlSystem"
