full_description = 'Translation(s): English - español - Français - Italiano - Português (Brasil) - Українська Promote Debian - Debian Events Find a way to share knowledge: Buttons and Banners | Social Networking | Events | Print Advertising Contents Detailed information Adding a new event Detailed information These are events where Debian Developers or Collaborators are going to participate all around the World. They can be 100% Debian-related or have a significant part of Debian participation to be cited here. Feel welcome to visit their webpages and ask the organization team for more information on how to arrive there. Adding a new event To add a new event page, please enter a string like "de/2012/LinuxTag" (country code, year, event name) into the box below. Major events related to Debian DebianEvents/ar: Events in Argentina DebianEvents/Asia: Events in Asia DebianEvents/be: Events in Belgium DebianEvents/br: Events in Brazil DebianEvents/by: Events in Belarus DebianEvents/ca: Events in Canada DebianEvents/ch: Events in Switzerland DebianEvents/cu: Events in Cuba DebianEvents/de: Events in the German-speaking countries DebianEvents/es: Events in Spain DebianEvents/fr: Events in the French-speaking countries DebianEvents/gb: Events on the British Isles DebianEvents/it: Events in Italy DebianEvents/jp: Events in the Japanese-speaking countries DebianEvents/ks: Events in Kosovo DebianLatinoamerica : Events in Latin American countries. DebianEvents/nl: Events in the Netherlands DebianEvents/Nordic: Events in the Nordic region (i.e. Iceland, Norway, Sweden, Finland, Denmark) DebianEvents/oc: Events in Oceania DebianEvents/pt: Events in Portugal DebianEvents/us: Events in the US DebianEvents/uy: Events in Uruguay DebianEventsHowto - Howto organize the Debian presentation at a fair / exhibition / trade show / conferences / whatever DebianEventsFaqs - Frequently asked questions (and possible answers / pointers) you could expect when representing debian at different fairs