["https://wiki.debian.org/it/ProjectNews/HowToContribute"]
title = "it/ProjectNews/HowToContribute - Debian Wiki"
full_description = '''Traduzioni: English - Español - Français - Italiano - 한국어 - Português - Português Brasileiro In questa pagina è spiegato come contribuire al Debian ProjectNews e cosa puoi fare TU per aiutarci. Contents Come contribuire a DPN Inviare notizie interessanti Cose da segnalare Cose che non è necessario segnalare Aiuto da parte degli utenti madrelingua Diventare un redattore Accedere al repository Git delle DPN Formato del file index.wml Tradurre le Debian Project News Usare "Translation check" per tenere traccia delle versioni dell'originale (FIXME: Sezione non aggiornata) Far pubblicare la propria traduzione Come contribuire a DPN Contribuire al ProjectNews è piuttosto semplice, ma dipende dalle tue capacità e dalla quantità di tempo a tua disposizione. Tutto il materiale fornito al repository publicity (ad esempio i vostri contributi) saranno pubblicati sul sito web di Debian sotto i termini delle licenze MIT (Expat) o GPL2+ Inviare notizie interessanti Il modo più semplice di aiutarci consiste nel farci sapere le cose interessanti che succedono nell'universo Debian: Debian è un progetto piuttosto grosso, e non siamo certo in grado di monitorare ogni mailing list, blog e sito di notizie per selezionare contenuti da inserire nel nostro ProjectNews. Perciò faccelo sapere, se scopri qualcosa di interessante. Puoi farlo inviando una e-mail a debian-publicity@lists.debian.org . Cose da segnalare In linea di massima, tutto ciò che può avere un qualche impatto sul progetto Debian in generale e sulla sua utenza è da considerarsi speciale. Alcune idee: Discussioni sulle mailing list che: abbiano un impatto significativo su Debian (ad esempio: discussioni sulle licenze, la pianificata transizione di un programma) contengano un dibattito interessante riguardo il Progetto pinco o il Progetto pallino Risoluzioni Generali, etc.) Annunci provenienti da progetti minori: debian installer vicino alla release beta3, richieste di test la traduzione francese di debconf raggiunge il 100% cdrkit in grado di masterizzare blue ray disc lettere "Notizie da" etc. Segnalazioni di bug interessanti (avete mai dato un'occhiata al 245047?) Hai rappresentato Debian ad una conferenza o ad un'esibizione (con uno stand, un discorso o un workshop) Hai scritto un resoconto dopo aver rappresentato Debian ad una conferenza o ad un'esibizione Sei stato intervistato a proposito del tuo lavoro su Debian Recensioni, testi e articoli riguardanti Debian su altri media, siti web, mailing list, blog Conferenze, mini DebConfs, FOSDEM, CeBIT, etc. etc. Cose che non è necessario segnalare rilasci Debian -- probabilmente lo sappiamo già! Naturalmente la lista di cui sopra è ben lungi dall'essere completa. In particolare vorremmo sottolineare che non siamo in grado di cercare notizie su gli altri media, siti web, blog, eccetera. Quindi sarebbe davvero un contributo apprezzato se poteste segnalare tutto ciò che ritenete adeguato al ProjectNews alla nostra mailing list debian-publicity@lists.debian.org . Tenete presente che uno dei maggiori propositi da parte nostra, oltre che tenere i nostri utenti informati, è di mostrar loro che siamo una comunità viva e attiva. Cioè mostrare che Debian è fiorente, che Debian è vivo! Aiuto da parte degli utenti madrelingua Attualmente il redattore principale delle notizie non è di madrelingua inglese. Lui lo sa e probabilmente lo avrai notato anche tu. Dunque ciò che puoi fare per aiutare, se sei madrelingua inglese, è di correggere il suo inglese da tedesco in un inglese corretto. Le uscite della newsletter sono stilate in un repository Git. I dettagli su come accedere usando un client Git sono elencati più avanti, nella sezione intitolata "Diventare un redattore". Anche se non si ha familiarità con Git, è sempre possibile scaricare l'uscita attuale dal repository inglese delle DPN, revisionarla, e mandare i commenti via mail alla mailing list debian-publicity. Sarebbe meglio mandare i cambiamenti proposti sotto forma di diff o wdiff, se possibile: basta fare una copia del file scaricato, modificarla e inviarci l'output di diff -u <file_vecchio> <file_nuovo>. Diventare un redattore Se vuoi contribuire direttamente e aggiungere dei brevi articoli per il ProjectNews, sentiti libero di entrare a far parte del team: Dovresti davvero iscriverti alla mailing list debian-publicity, all'indirizzo http://lists.debian.org/debian-publicity, dato che tutte le discussioni vengono tenute lì; Potresti anche volere iscriverti al pseudopacchetto "press" in https://tracker.debian.org/pkg/press. Ogni volta che viene fatto il commit di un cambiamento nei repository Git, riceverai una notifica via email, perciò è molto facile rimanere aggiornati. Vedere https://lists.debian.org/debian-publicity/2018/04/msg00001.html per i passi specifici da seguire. Se sei già un Debian Developer dovresti avere già l'accesso in scrittura al repository Git. Se non sei un Debian Developer, puoi inviare le tue proposte alla mailing list o usare il tuo account Salsa per inviare i contributi. Se non hai un account su Salsa e vuoi crearlo, registrati su Salsa. Se hai già un account e vuoi contribuire nel lungo periodo, fai il login nella piattaforma Salsa di Debian con il tuo account, e poi puoi semlicemente richiedere di unirti al progetto Pubblicity cliccano il pulsante "Request Access" al centro della pagina del Publicity Team in Salsa. Una buona prassi è di scrivere nel frattempo alla mailing list debian-pubblicity presentandosi in modo che i coordinatori delle DPN possano conoscerti e approvare la tua richiesta di unirti al gruppo. Se hai già un account but vuoi solo fare qualche contributo sporadico, puoi fare il fork del repository e inviare richieste di merge. A questo punto, devi proprio leggere le nostre Linee Guida per gli articoli del ProjectNews. Accedere al repository Git delle DPN Il numero delle DPN in fase di preparazione può essere sfogliato usando il nostro repository git in Salsa Prima di accedere al repository Git, potresti voler leggere la documentazione per usare il repository Git su Salsa opportunamente. eseguire git clone git@salsa.debian.org:publicity-team/dpn.git. Questo comando creerà una cartella dpn contenente le Debian Project News. Il numero attuale è nella sottocartella current della cartella dpn. Se lo si desidera, la si può rinominare come si preferisce. spostarsi in quella cartella. Qualsiasi cosa si faccia ricordarsi però di non cancellare né modificare o toccare in altro modo la cartella .git lì contenuta: contiene alcuni metadati necessari per far funzionare tutto in modo corretto. Ora puoi scrivere nel Debian Project News. Non preoccuparti se non hai esperienza con Git o con il Website Meta Language / HTML (che viene usato per il sito di Debian). Niente di quello che farai apparirà direttamente sul sito e tutti gli errori che potresti fare possono essere rimediati senza eccessiva difficoltà. Accedere al repository Git in modo anonimo Se non si ha un account Salsa, si può accedere al repository Git in modo anonimo. Si può fare il checkout della bozza attuale di Debian Project News usando il comando seguente: git clone https://salsa.debian.org/publicity-team/dpn.git. Questo comando creerà una cartella dpn contenente le Debian Project News. La bozza più recente è nella cartella dpn/current. Editing Spostati nella cartella contenente il checkout. Se non è stata rinominata, dovrebbe essere dpn. Prima di scrivere o modificare dovresti lanciare git pull, così da aggiornare la tua copia locale. Ora puoi modificare il file index.wml come preferisci. Vedi sotto per i dettagli sul formato. Invia con un commit le tue modifiche con git commit index.wml Dopo aver modificato il file index.wml, lancia git update --rebase, nel caso qualcun altro avesse modificato quel documento mentre ci lavoravi. Git cerca di essere intelligente, quando applica modifiche esterne al tuo documento modificato: a meno che le modifiche (tue e dell'altro autore) non riguardino proprio la stessa riga, tutto dovrebbe funzionare bene. Nel caso in cui abbiate modificato le stesse identiche righe, si crea un cosiddetto conflitto che deve essere risolto. Per sapere come farlo leggi questa pagina Una volta che la tua copia locale è aggiornata, puoi inviare le tue modifiche al repository centrale lanciando il comando git push. Congratulazioni: hai appena contribuito al prossimo numero del Debian Project News! Esistono, inoltre, svariate interfacce grafiche per Git. Tuttavia, poiché l'autore manca di esperienza al riguardo, non si sente di consigliarne alcuna. Due ulteriori consigli riguardanti il commit delle proprie modifiche: Usa un messaggio di commit (la descrizione dei tuoi cambiamenti dopo il parametro "-m") che sia utile ed esplicativo. Cerca di non usare righe troppo lunghe: tenere conto dei cambiamenti o vedere i diff è più facile se la lunghezza delle righe è inferiore agli 80 caratteri. Molti editor possono essere configurati per andare a capo automaticamente oltre un certo numero di caratteri. Formato del file index.wml Il Debian Project News è disponibile in tre formati: come e-mail inviata alla mailing list debian-news (in formato testo) come versione HTML dal sito web di Debian come feed RSS. Tutti questi formati sono generati dal file index.wml. Il sito Debian utilizza il website meta language (WML) per creare le pagine web. Grossomodo il WML è HTML con inserite delle macro (ad esempio per elementi comuni in vari siti) e la possibilità di inserire script perl, ad esempio creare un elenco dei numeri di DPN in base ai file disponibili. Ma niente paura: non è necessario conoscere il WML o il perl (ma solo un po' di HTML) per contribuire a DPN. Fortunatamente, quasi ogni cosa è già al suo posto e c'è solo bisogno di creare i contenuti con davvero poco markup HTML. Se guardi un index.wml vuoto (dai un'occhiata a questo che viene usato come modello) noterai che inizia così: #use wml::debian::projectnews::header PUBDATE="2017-MM-DD" SUMMARY="" #use wml::debian::acronymsLa prima riga dice al compilatore wml di usare il modello ("template") project-news per l'intestazione, e inoltre imposta due variabili per la data di pubblicazione e un piccolo riassunto. Il riassunto è utilizzato, ad esempio, nell'indice dei numeri recenti. Non dovrebbe essere troppo lungo. La riga relativa agli acronimi consente l'uso di acronimi specifici, il che permetterà di mostrare la loro spiegazione quando il puntatore è sopra di essi. Alla fine vedrai invece qualcosa di simile a questo: #use wml::debian::projectnews::footer editor="The Publicity Team with contributions from contributor1, contributor2, contributor3"Questo dice al compilatore wml di aggiungere il piè di pagina normale alla pagina web. Con la variabile editor verranno inseriti anche i nomi dei redattori lì elencati. Tutto ciò che è compreso tra quelle righe, è quasi normale HTML, che nel nostro caso significa soprattutto: alcuni titoli (<toc-add-entry>...</toc-add-entry>), alcuni paragrafi (<p>...</p>) o qualche elenco (<ul><li>...</li><li>...</li></ul>). Ogni articolo deve iniziare con un nome univoco: <toc-add-entry name="$anchor_univoco">$mio_titolo</toc-add-entry> <p>Questo è il contenuto del mio breve articolo, dove posso inserire <a href="http://debian.org/">collegamenti</a> e altri markup HTML.</p>Ciò che si trova tra <toc-add-entry> e </toc-add-entry> è il titolo vero e proprio. Dopo il titolo abbiamo l'articolo vero e proprio, contenuto tra i tag <p> e </p>. Si possono usare svariati paragrafi, ma è importante notare come solo il primo di questi apparirà nei feed RSS. (Questo potrebbe essere un bug degno di essere corretto, nel caso tu conosca il Perl...) Come detto, puoi usare il normale HTML in questi paragrafi; questo significa: <q>...</q> per i virgolettati, le citazioni o i nomi delle release: Debian 6.0 <q>squeeze</q>, Steve McIntyre ha detto: <q>Boh!</q> <a href="..."> per i link: Il Segretario ha <a href="http://lists.debian.org/debian-devel-announce/2010/03/msg00000.html">aperto le liste per i candidati</a> alle elezioni del leader del progetto. <!-- ... --> per i commenti, che non appariranno sul sito: {<!-- TODO: Aggiungi un collegamento quando questa discussione è terminata! --> Poiché il Project News viene letto anche da utenti che non hanno familiarità con il gergo interno di Debian e i suoi acronimi, va usato anche il tag <acronym ...> </acronym> (non fa parte di HTML ma di uno dei nostri template wml). Si veda il seguente esempio: One topic discussed was: <q>Race against <acronym lang="en" title="None of the above">NOTA</acronym>.</q>Anche se non funzionerà nelle versioni in formato testo per le e-mail, almeno nella versione HTML per il sito e nei feed RSS questo marcherà l'acronimo in modo che quando l'utente muove il mouse sopra di esso, ne viene mostrato il significato. Per vedere un esempio vai a questa pagina: http://www.debian.org/News/project/2009/02/ (cerca l'acronimo DPL). Tradurre le Debian Project News Sentiti anche libero di usare il repository Git per il tuo lavoro di traduzione. In questi casi è più facile fare semplicemente il checkout della completa gerarchia del DPN nel repository Git, seguendo questi passi: git clone git@salsa.debian.org:publicity-team/dpn.git cd dpn Ora guarda se esiste già una directory per la tua lingua. Se non esiste creane una, ad esempio mkdir it crea la sottodirectory anno/numero corrispondente (es. mkdir -p 2015/07) aggiungi una prima versione (va bene anche una bozza) della tua traduzione come index.wml aggiungila al repository, ad esempio git add fr/ fai il commit locale delle tue modifiche git commit -m"primi passi di traduzione" e invia le modifiche al server centrale, es. git push Ora puoi imitare la stessa struttura della directory utilizzata nella cartella en. I vecchi numeri sono posti nelle directory specifiche en/<anno>/<numero>, quello attualmente in lavorazione è nella directory en/current. Inoltre en/index.wml-template, che è un numero vuoto, è usato come template per iniziarne uno nuovo. Leggi Diventare un redattore per alcune linee guida sull'uso di Git e una breve descrizione del formato dei file wml. Ma tieni presente che: i traduttori devono usare anche un header ulteriore: #use wml::debian::translation-check translation="<revision_git_hash>", che serve a segnalare su quale revisione dell'originale si basa la traduzione. Tuttavia per il momento lasciare <revision_git_hash> vuoto; la persona che farà l'effettiva pubblicazione del numero copierà l'hash corrispondente quando la versione inglese viene aggiunta al repository del sito web. In modo simile a quanto avviene per i redattori nel campo editor della riga #use wml::debian::projectnews::footer}}, i traduttori possono aggiungere un campo {{{translator in modo simile. Ad esempio (per il francese): #use wml::debian::projectnews::footer editor="L'équipe en charge de la publicité avec des contributions de Thomas Lange et Paulo Henrique de Lima Santana et Jean-Pierre Giraud" translator="Jean-Pierre Gir'''
