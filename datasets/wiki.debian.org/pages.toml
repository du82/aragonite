["https://wiki.debian.org/Derivatives/Census"]
title = "Derivatives/Census - Debian Wiki"
full_description = '''Note that the census is currently inactive. If you would like to help revive the project, please contact the DerivativesFrontDesk about it. Debian Derivatives Census The Debian derivatives census is an attempt to gather detailed information about Debian derivatives that is useful to Debian, for integration of that information into Debian infrastructure and for the development of relationships between Debian and our derivatives. In addition we will be doing some QA on the data that you enter into the census. If you are not involved in the Debian derivative that you would like to see added to the census, please consider sending an invitation to join the census to a contact point of the derivative you would like to see added to the census. To add a new derivative to this page, register an account, login and enter the short name of your derivative below, with no spaces. When you click "Add a new derivative", an editor will be loaded containing the census template (please fill out as much information as you have) and when you save the page, the new page will be created and added to the list below. If you are the maintainer of a census page, you are expected to subscribe to both it and the census template or subscribe to the RecentChanges RSS feed so that you are notified when your census page is out of sync with the template and more information needs to be added. When editing your census page, please replace the date at the end with @TIME@ so that the current date is added. Please use no spaces when entering a name for the page. /AIMS_Desktop /Abalar /AlienVault-OSSIM /Apertis /Aptosid /ArcheOS /ArchivistaBox /Armbian /AstraLinux /Auxtral /BCCD /BOSSlinux /Bayanihan /BlackWeb /BlankOn /Bloss /BunsenLabs /Canaima /Clonezilla /CoreBiz /Crunchbang /CumulusLinux /CyborgLinux /DANOS /DebOps /Debathena /Deepin /Devuan /Donau /DoudouLinux /Elive /Emdebian /EmmabuntusDE /Endless /Epidemic-Linux /FUSS /Finnix /Freedombone /Freeduc /GNUSTEP /GauSSIan /GreenboneOS /Grml /Hamara_Linux /HandyLinux /Huayra /Inquisitor /JaSP_packages /Kali /Knoppix /LMDE /Lernstick /LiMux /Lihuen /LinEx /LinuxAdvanced /Lotos /Maemo /Matriux /Meilix /MentorEmbeddedLinuxOmniOS /MetamorphoseLinux /Mobian /NEMS_Linux /Netrunner /OLPC /OSMC /OpenNetworkLinux /Open_Secure-K_OS /Ordissimo /PakOS /Pardus /ParrotSecurity /Parsix /Pengwin /PrimTux /ProgressLinux /Proxmox /PureOS /Purism /Q4OS /Qlustar /Qubes /Quirinux /Raspbian /Rescatux /SELKS /SPACEflight /SalentOS /Septor /SerbianLinux /SolusOS /SolydXK /SparkyLinux /SprezzOS /SteamOS /SteamRuntime /StormOS /Symbiosis /Tails /Tanglu /ThengOS /ToriOS /Tucunare /TurnKeyLinux /Ubuntu /UltimediaOS /UniventionCorporateServer /Vanillux /Volumio /VoyageLinux /VyOS /Vyatta /Wazo /Webconverger /Whonix /YunoHost /ZevenOS-Neptune /Zevenet /ev3dev /gNewSense /hLinux /nakeDeb /relianoid /rtros /semplice /siduction /ttos /ubilinux /xanadu The list of derivatives below includes the names, logos and descriptions of each derivative in the census. More details on each derivative can be found by clicking through to the page about the derivative. There is also a list of derivatives that includes the full details about each derivative. More lists of distributions directly and indirectly derived from Debian are available on the main derivatives page. AIMS Desktop AIMS Desktopis a Debian derivative for maths and science users primarily in tertiary education environments. It is mostly used by AIMS centres in Africa, but also by individuals and other institutions. It aims to be a turn-key solution that includes the most popular free software packages available. [Derivatives/Census/AIMS_Desktop][edit] Abalar Abalar is a derivative of Debian developed by the government of the Xunta de Galicia (Spain) intended to be a distribution for the integration of ICT in the educational field. [Derivatives/Census/Abalar][edit] AlienVault OSSIM AlienVault Open Source SIEM (OSSIM) is a complete Security Management solution. Along with the AlienVault Unified SIEM for IT and AlienVault ICS SIEM for industrial / SCADA applications, AlienVault OSSIM is in use at more organizations than all alternatives combined. AlienVault OSSIM provides all of the functionality required to detect and profiles attacks and provides a comprehensive, intelligent Security Management platform and toolset. The entire solution is based on Debian's, including all seamlessly integrated tools and the security management platform. The OSSIM project was created and is currently coordinated by the founders of AlienVault. The OSSIM platform consists of a Management Server, and Sensor or "Probe". A professional version that includes Logger functionality is also available (please see below). The solution may be implemented as a single monolithic appliance or a set of appliances in which probes are separated from the management server, and distributed throughout the enterprise. Probes capture network and system information in real time, and send it to the central Management Server where the data is analyzed to assess immediate threats and risk, filter out false positives, and locate false negatives that other security devices and software on the network cannot detect. [Derivatives/Census/AlienVault-OSSIM][edit] Apertis Apertis is a FOSS (Free and open source) GNU/Linux-based platform for infotainment in automotive vehicles. It is a distribution derived from Debian and geared towards the creation of product-specific images for ARM and Intel x86 systems. [Derivatives/Census/Apertis][edit] aptosid aptosid is made up of 2 words, firstly apto, which is a Latin word which means 'to fit, adapt, adjust, make ready, or fit'. The second word is sid and is the codename of Debian's unstable branch. aptosid holds fast to the core values and social contract of Debian. (DFSG). We aim to be 100% compatible with debian sid, and is at the forefront regarding the definition of a rolling distribution. [Derivatives/Census/Aptosid][edit] ArcheOS ArcheOS is a Debian derivative aimed at being a complete operating system for archaeologists. [Derivatives/Census/ArcheOS][edit] ArchivistaBox 64Bit ArchivistaBox 64Bit is available in two versions: a) ArchivistaVM: Virtualisation with KVM b) ArchivistaBox: Document Management System (DMS) The ArchivistaBox has a very fast and powerful installer, in about 1 to 2 minutes the whole solution is installed. [Derivatives/Census/ArchivistaBox][edit] ARMBIAN is a Debian derivative aimed at ARM development boards. [Derivatives/Census/Armbian][edit] Astra Linux Astra Linux is the Russian Debian derivative. Its structure includes many free software components and also software decisions of the Astra Linux developers that allow to work with unique simple and fast graphical interface and raise the security level and to expand possibilities of its application on desktops tablets mobiles and servers. [Derivatives/Census/AstraLinux][edit] Auxtral Auxtral is a custom stable Debian distribution with no pre-installed applications.The specific applications (office automation, image editing, etc.) will be installed by the user, according to their software needs according to the destination they want to give to their PC. [Derivatives/Census/Auxtral][edit] BCCD BCCD (Bootable Cluster CD) is a live CD intended for use as an pedagogical tool for high school and college computational science educators. Using the BCCD, one can quickly setup a compute cluster with all the tools needed to start teaching computational science or parallel programming. Optionally, a permanent cluster maybe automatically configured by copying the live CD image onto a hard drive. [Derivatives/Census/BCCD][edit] BOSSLinux BOSSLinux is a Debian derivative aimed at Schools and Government sectors with more support in Indian Languages and for Indian usage scenarios [Derivatives/Census/BOSSlinux][edit] Bayanihan Linux Bayanihan Linux was a Debian derivative aimed at creating an easy to use alternative desktop-oriented operating system particularly for use in the Philippines. [Derivatives/Census/Bayanihan][edit] Black|Web Black|Web is a Linux distribution aimed at advanced Penetration Testing and Security Auditing. Black|Web contains several hundred tools which are geared towards various information security tasks, such as Penetration Testing, Security research, Computer Forensics and Reverse Engineering. Starting from an appropriately configured LXDE desktop manager it offers stability and speed. Black|Web has been designed with the aim of achieving the maximum performance and minimum consumption of resources. [Derivatives/Census/BlackWeb][edit] Blankon Aims to build a Linux distribution according to the needs of Indonesian computer users. [Derivatives/Census/BlankOn][edit] Bloss bloss OS is a Debian derivative aimed at making the desktop experience awesome and helping people with technology. [Derivatives/Census/Bloss][edit] BunsenLabs Linux BunsenLabs Linux is a Debian derivative, it is a community continuation of CrunchBang. [Derivatives/Census/BunsenLabs][edit] Canaima Canaima GNU/Linux is a Venezuelan desktop distribution based on Debian GNU/Linux. It was primarily designed as a solution for the computers of the National Public Administration (NPA) in accordance with the presidential decree N° 3.390 about the use of free technologies in NPA. Nowadays, Canaima is no longer a distribution of the state but a Metadistribution developed, promoted, and used by a large Community in Venezuela and various latin-american countries. It also continues to be the official Operating System in the NPA and powers National Projects as Canaima Educativo (Educational Canaima) for children. [Derivatives/Census/Canaima][edit] Clonezilla live Clonezilla live is a Debian derivative aimed at being a disk imaging and cloning derivative. [Derivatives/Census/Clonezilla][edit] CoreBiz CoreBiz is a Debian / Ubuntu derivate aimed at small and medium-sized companies which are willing to migrate their IT infrastructure to Linux. CoreBiz serves as a highly available hyper-converged virtualization cluster, including an LDAP-based directory server and modular extensions, such as the CoreBiz backup server, file server, groupware server or the desktop client. It includes a centralized configuration management and a web-based admin frontend and plays well in a mixed Linux / Windows environment. [Derivatives/Census/CoreBiz][edit] CrunchBang ?CrunchBang is a Debian GNU/Linux based distribution offering a great blend of speed, style and substance. [Derivatives/Census/Crunchbang][edit] Cumulus Linux Cumulus Linux is the industry's first, full-featured Linux operating system for networking hardware. [Derivatives/Census/CumulusLinux][edit] Cyborg Linux Cyborg is a Ubuntu-based security distribution designed for penetration testing and forensic investigations. Although it is primarily designed for security enthusiasts and professionals, it can also be used by any Linux user as a desktop system for day-to-day computing. Besides standard Ubuntu software, Cyborg-Linux has pre-installed GNOME metacity and compiz Desktop Environment, more than 700+ open-source tools for penetration testing, and a custom-built Linux kernel 3.13.0-40-generic. Cyborg was first released in 04/Dec/2014 under code name “Cyborg-Hawk” as the most advanced, powerful and yet beautiful penetration testing distribution ever created. Lined up with ultimate collection of tools for pro Ethical Hackers and Cyber Security Experts. Simplify security in your IT infrastructure with Cyborg. Its real strength comes from the understanding that a tester requires a strong and efficient system,that benefits from a strong selection of tools, integrated with a stable linux environment. It has 700 + tools while other popular distro have 300+ and also dedicated tools for and menu for mobile security and malware analysis. Distro Features:- *Exploitation Toolkit:- Toolkit to test the integrity of your IT Infrastructure.Best exploit of for best results *Reverse Engineering:- Reversing the core code for the analysis by going backwards through the development cycle *Forensics:- Uncover the Digital evidence. Investigate them and interpreting electronic data for use in a court of law. *Stress Testing:- Determine the amount of stress your computer, network, program or device can bear. *Mobile Security:- Penetrate the mobile security and fix the vulnerabilities of it . Mobile Security covers every known platform for smartphones. *Wireless Security:- Secure your wireless world. Cyborg have top level tools to test your security. [Derivatives/Census/CyborgLinux][edit] DANOS The Disaggregated Network Operating System (DANOS) is a Telco-grade Network Operating System (NOS) seeded to The Linux Foundation by AT&T. DANOS was defined by AT&T’s “dNOS” software framework white paper to be a more open, cost-effective and flexible alternative to traditional networking equipment. DANOS is based on a subset of the Vyatta NOS used internally in AT&T’s network. It is a ready-to-use Debian-based distribution that makes use of the Data Plane Development Kit (DPDK) libraries to provide highly efficient software packet-processing on x86 hardware in addition to Broadcom’s Open Network Switch Layer (OpenNSL) libraries to support a hardware programming plugin architecture for merchant silicon based forwarding. [Derivatives/Census/DANOS][edit] DebOps ?DebOps is a Debian derivative aimed at providing a set of Ansible roles and playbooks which can be used to set up and manage Debian-based infrastructure. The project is designed to be scalable from one host to an entire data center, and provides various services and facilities to allow management of multi-host infrastructure. [Derivatives/Census/DebOps][edit] Debathena Debathena is a packaging of the clients and configuration for MIT's Athena workstations for Debian and Ubuntu. Debathena on Ubuntu 12.04 is deployed on MIT's public Athena computer labs, and we support all current Debian and Ubuntu releases on private workstations, laptops, etc. [Derivatives/Census/Debathena][edit] Deepin Deepin is a Debian-based distribution that aims to provide an elegant, user-friendly and reliable operating system. [Derivatives/Census/Deepin][edit] Devuan GNU/Linux Devuan is a derivative aimed at providing a Debian-like OS without the encumbrances of Systemd. The init systems sysvinit and openrc are fully supported. [Derivatives/Census/Devuan][edit] Donau Lotus Donau is an Operating System designed for everyone. Its latest Beta stage, Donau Lotus, builds upon that idea with a new interface and a completely reworked codebase. [Derivatives/Census/Donau][edit] DoudouLinux DoudouLinux is a live distro for kids. It focuses on providing an environment as easy to use as a gaming console, for children aged from 2 and in the children's language natively. Our first official release is supported in 15 languages and new languages are on the road. DoudouLinux offers the traditional Linux educational games, plus multimedia '''
