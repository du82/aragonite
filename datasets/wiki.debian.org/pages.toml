title = "DebianWiki - Debian Wiki"
full_description = "Translation(s): العربية - German - Ελληνικά - English - Español - Français - Bahasa Indonesia - Italiano - 한국어- 日本語 - Polski - Português (Brasil) - Português (Portugal) - Русский - Svenska - 中文(简) Discusión This wiki is a major documentation resource for the Debian project. It is freely editable by everyone and participation is actively encouraged by anyone who can see a way to improve it. Below you will find details about the wiki itself, including how to find what you are looking for and how to create an account and start editing. So don't hesitate: improve something today! Quick access About this wiki Copyright | Privacy | Helping | Feedback | FAQ Editor quick start Create an account | Editing Content of this wiki Content Criteria Intermediate editing Your Account | Formatting | more... Browsing this wiki Search | Glossary | Offline Wiki pages Delete, Name, Rename, Create a Page | more... Contact us for Visitors | Press | Editors | more... Translation Page Naming | Keep in sync | more... Getting Help using Debian (FAQ, Mailing list, Forums, IRC...) Contents Quick start Utilization guides Discussion's corner Administration History Support Quick start Editor QuickStart is a good choice if you are a beginner and want to contribute to the Debian Wiki. Syntax Reference gives some examples of wiki syntax. Help for beginners is a starting point for general information. Utilization guides Editor guide is the official article explaining the rules of editing and how to respect conventions. Content criteria for this wiki. Help on editing - Moinmoin Wiki help pages for editors. Help index lists all help pages for this wiki. Discussion's corner Conventions and policies of this wiki (should be moved to the Editor guide). License Terms of the content of this wiki. Translation Namespace of this wiki. Administration Content Administrators is a central hub related to the administration of this wiki. Interwiki links: currently configured and propositions. MoinMoin help index of the current installed version. Spam on this wiki. System informations. Engine. History DebianWiki History. Support Wiki Contacts: Who does what? Webmaster The Debian System Administrators (called DSA) Resources to get help under Debian. CategoryPortal"
