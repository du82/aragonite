full_description = '''This page is an attempt to gather detailed information about Debian Local Groups around the world, for integration of that information into Debian infrastructure and also in order to improve the quality and quantity of events and the promoting of Local Groups initiatives. If you need help setting up or adding your Debian Local Group, come by #debian-localgroups on IRC (OFTC network) or post email to debian-localgroups team mailing list. If you would like to add a new local group to this page, please enter the short name of your group below, with no spaces. If you are the maintainer of a group page, you are expected to subscribe to both it and the template or subscribe to the RecentChanges RSS feed so that you are notified when your group page is out of sync with the template and more information needs to be added. When editing your group page, please replace the date at the end with @TIME@ so that the current date is added. Feel free to add any group to this list that deals mostly or primarily with Debian. If you have doubts, add it anyway and do as good a job in the description as you can. Please keep this page organized like it currently is. Hint: if you need a mailing list for your group please create it on lists.debian.org naming it debian-dug-<groupname> (dug is an acronym for Debian User Group) (no spaces) If there is no group in your area, you may be able to find Debian people in your area on the keysigning pages (offers, need), the recent release parties pages or other Debian related locations. /CoderGalsKosovo /DUG-BY /Debian-CN /Debian-HK /Debian-JP /Debian-LK /Debian-MTK /Debian-Malaysia /Debian-TW /Debian-Tn /Debian-ZA /Debian-id /DebianBerlin /DebianBurkinaFaso /DebianCat /DebianIreland /DebianIsrael /DebianMadrid /DebianMontreal /DebianMuc /DebianNordic /DebianPoz /DebianPozPastMeetings /DebianQuebec /DebianRheinMain /DebianSC /DebianSlovenia /DebianUkraine /DebianValencia /DebianVienna /Karlsruhe /LIFO /ManchesterFreeSoftware /MeetingMinutes /OpenLabs /Pa Debian Users Group /PrishtinaHackerspace /RtlugMuc /Stuttgart /chicago /debian-sa Contents Asia Japan Hong Kong India Sri Lanka Indonesia China Taiwan Thailand Malaysia Oceania Australia Africa Tunisia Burkina Faso Nigeria South Africa Europe Albania Austria Catalonia France Germany Italy Ireland Kosovo Nordic Region Poland Slovenia Switzerland The Netherlands UK Ukraine Middle East Saudi Arabia Iran Israel North America Canada Mexico USA CA - California DC - Washington MA - Massachusetts NY - New York PA - Pennsylvania WA - Washington Central America Costa Rica El Salvador Guatemala Nicaragua South America Argentina Brazil Debian Brasil Debian Brasília Ceará Debian Users Group Debian Curitiba Debian Minas Gerais Debian Rio de Janeiro Debian Rio Grande do Sul DebianSP Debian Santa Catarina Chile Colombia Perú Uruguay Venezuela Asia Japan Japan Hong Kong Hong Kong India India Sri Lanka Sri Lanka Indonesia Indonesia China China Taiwan Taiwan Thailand Thailand Malaysia Malaysia Oceania Australia Debian AU Location: AU Group Email Address: debian-au@lists.linux.org.au Website: http://lists.linux.org.au/listinfo/debian-au Wiki: IRC Channel: #debian-au on irc.debian.org (OFTC) Contact: James Bromberger <jeb@debian.org>, Andrew Ruthven <andrew@etc.gen.nz> Description: Australian Debian Group. Geolocation: Debian-melb Location: Melbourne, VIC, AU Group Email Address: debian-melb@taz.net.au Website: Wiki: IRC Channel: Contact: Daniel Stone daniels@debian.org Description: Meets very irregularly - usually just when people are in town. Geolocation: 37.817 S 144.967 E Africa Tunisia Debian-Tn Debian Tunisian Burkina Faso Debian Burkina Faso Ouagadougou, Burkina Faso, West Africa Nigeria DebianNigeria South Africa Debian South Africa Europe Albania Open Labs, Tirana Austria Debienna Location: Vienna, Austria Group Email Address: debienna@lists.debienna.at Website: https://debienna.at/ Wiki: LocalGroups/DebianVienna IRC Channel: #debian.or.at Contact: debienna@lists.debienna.at Description: meets every third Thursday in metalab. If you are close drop by - see linked Websites for details. Geolocation: 48.200 N 16.367 W Catalonia Deb-Cat Location: nomad, throughout the length and breadth of the country Group Email Address: Website: Wiki: LocalGroups/DebianCat IRC Channel: #debian-catalan on irc.debian.org (OFTC) Mailing list: Not yet but you can find us at the global catalan mailing list <debian DASH user DASH catalan AT SPAMFREE lists DOT debian DOT org> Description: At this moment we're planning our first meeting. Join us! France Debian-France Location: France Group Email Address: asso@france.debian.net Website: http://france.debian.net Wiki: IRC Channels: #debian-france - Association Debian France #debian-fr - Debian technical support in French Contact: asso@france.debian.net Description: We organise meetings, produce goodies, drink wine, etc Germany Debian Berlin Location: Berlin, Germany, Europe Group Email Address: buug-l@buug.de (not exclusively Debian, but the Berlin DDs hang around here!) Website: Wiki: IRC Channel: #debian-berlin Contact: buug-l@buug.de (not exclusively Debian, but the Berlin DDs hang around here!) Description: Meets every last Thursday of an odd-numbered month at the e-lok. Also available as interactive guide from S-Bahnhof Ostkreuz to the e-lok. DUG-HH Location: Hamburg, Germany Group Email Address: dug-hh@gnu-forum.de Website: Wiki: IRC Channel: Contact: dug-hh@gnu-forum.de Description: to be written Geolocation: 53.550 N 10.000 E Debian Karlsruhe Location: Karlsruhe, Germany Wiki: https://wiki.debian.org/LocalGroups/Karlsruhe IRC Channel: #debian-suedwest Contact: Christoph Biedl <debian.axhn@manchmal.in-ulm.de> Description: Meets roughly monthly Debian Muc Location: Munich, Germany Group Email Address: debian-dug-muc@lists.debian.org Website: Wiki: LocalGroups/DebianMuc IRC Channel: #debian-muc Contact: Michael Ablassmeier <abi@debian.org> Description: Meets roughly monthly - or when people are in town and get in touch with us. Geolocation: 48.150 N 11.583 E Debian Rhein-Main (Rhein-Main-Gebiet / Metropolregion Frankfurt/Rhein-Main) Location: Rhein-Main-Gebiet, Deutschland Wiki: LocalGroups/DebianRheinMain Debian Rhine Area Location: Düsseldorf and around, Germany Group Email Address: Website: Wiki: IRC Channel: Contact: Mechtilde <mechtilde@debian.org> Description: Geolocation: Italy The Secret "Fetch Every DD Passing Thru Bologna and Take 'em To Dinner" Group #debian-it can neither confirm nor deny the existence of this group Location: Bologna, Italy Group Email Address: None. But we track debian-private@lists.debian.org and debian-italian@lists.debian.org Website: Wiki: IRC Channel: #debian-it Contact: Description: Thou Shalt Not Pass For Bologna Without Gaining An Extra Kilo Geolocation: 44.483 N 11.333 E Debianizzati Location: Group Email Address: Website: http://debianizzati.org Wiki: http://guide.debianizzati.org IRC Channel: #debianizzati at irc.azzurra.org Contact: Description: Geolocation: LIFO Location: provinces of Varese and Como Group Email Address: Website: https://social.gl-como.it/profile/lifo Wiki: LocalGroups/LIFO IRC Channel: #lifo@?FreeNode Contact: Description: weekly meetings @ the local LUGs, plus special events. Food is often, but not necessarily, involved. Geolocation: Ireland Debian Ireland Location: Dublin, Ireland Group Email Address: debian-dug-ie@lists.debian.org Wiki: Wiki page IRC Channel: #debian-ie Description: Local Debian group, Kosovo Prishtina Hackerspace Nordic Region Debian Nordic Location: Denmark, Iceland, Finland, Norway, Sweden, ... Group Email Address: debian-dug-nordic@lists.debian.org Wiki: LocalGroups/DebianNordic IRC Channel: #debian-nordic Description: A Debian community for the Nordic region with the goal to bring together people that are interested in, uses, or develops Debian. Poland Debian Poz Location: Poznań, Poland Wiki: LocalGroups/DebianPoz Contact: Laszlo Kajan <lkajan@debian.org> Description: Meets roughly monthly - or when people are in town and get in touch with us. Geolocation: 52.416 N 16.966 E Slovenia Debian Slovenia Location: Slovenia Wiki: LocalGroups/DebianSlovenia Group Email Address: debian-user-slovenian@lists.debian.org (mailing list archive) Website: https://debian.si/ Contact: debian-user-slovenian@lists.debian.org IRC Channel: #debian.si on irc.debian.org (OFTC) Telegram Group: @debianslovenia Description: Meetings are online on IRC channel; 4 times per year; on every first Wednesday in the following months (Jan, Apr, Jul, Oct) at 20:00 CE(S)T. Switzerland Debian Switzerland Location: Switzerland Group Email Address: debian-switzerland@lists.debian.org (mailing list archive) Website: https://debian.ch/ IRC Channel: #debian.ch Contact: debian-switzerland@lists.debian.org Description: Meets irregularly - usually when people are in town and get in touch with us. Debian ZH ("Debian-Treff Zürich") Location: Restaurant ?DaPizi (https://dapizi2017.ch/), Josefstrasse 27, 8005 Zürich Geolocation: 47.3812322 N, 8.5331802 E About 200m to 300m west of Zurich Main Station and easy to reach if you come by public transport or bicycle. Coming by car is not recommended. (If necessary: there are a few public parking slots in front of the restaurant) Group Email Address: debian-switzerland@lists.debian.org (mailing list archive) IRC Channel: #debian.ch Contact: Axel Beckert <abe@debian.org> Description: A monthly real-life gathering of Debian users and developers from the greater Zurich area Schedule: We gather every first Tuesday of a month — unless that's a public holiday, then it's one week later. Start and End Time: Gatherings are starting at 18:00, but coming later is fine. It usually ends at 22:00 when the restaurant closes. iCal calendar feed of the gatherings Debian Switzerland Jitsi Location: https://jitsi.debian.social/Switzerland Contact: Axel Beckert <abe@debian.org> Description: A monthly online gathering of Debian users and developers from Switzerland and nearby. Schedule: We gather every third Tuesday of a month — unless that's a public holiday, then it's one week later. Start and End Time: Gatherings are starting at 19:30, but coming later is fine. iCal calendar feed of the gatherings The Netherlands Debian-nl Location: The Netherlands Group Email Address: debian-events-nl@lists.debian.org Website: Wiki: IRC Channel: #debian-nl Contact: Just use the list Description: Discussion list, mainly used to announce keysigning party's once some non-dutch developer visits the Netherlands. Geolocation: 52.350 N 4.917 E UK Debian UK Location: United Kingdom/Great Britain/'England' Group Email Address: debian-uk@chiark.greenend.org.uk (sign up at http://www.chiark.greenend.org.uk/mailman/listinfo/debian-uk) Website: Wiki: https://wiki.earth.li/DebianUK IRC Channel: #debian-uk Contact: The list. Insofar as anyone is in charge: SteveMcIntyre <93sam@debian.org> Description: Debian developers and hangers-on in the UK. Meets and exhibitions are organised through this list. By far the largest concentration is in Cambridge so most physical meets happen there, several times a year. Meets in London are quite common, especially when visitors are passing through. Geolocation: 51.517 N 0.105 W (London) 52.205 N 0.144 E (Cambridge) Manchester Free Software Ukraine Debian-Ukraine Location: Ukraine Group Email Address: Website: https://linux.org.ua/ Wiki: LocalGroups/DebianUkraine IRC Channel: #debian-ukraine (on OFTC) Mailing list: <debian DASH user DASH ukrainian AT SPAMFREE lists DOT debian DOT org> Contact: <debian DASH user DASH ukrainian AT SPAMFREE lists DOT debian DOT org>, https://linux.org.ua Description: Debian users and maintainers from Ukraine Middle East Saudi Arabia Debian-sa Location: Riyadh, Saudi Arabia Wiki: LocalGroups/debian-sa Contact: XIDME xidme@outlook.sa IRC Channel: #debian-sa Matrix Room: #debian-sa:matrix.debian.social Iran Iranian Debian GNU/Linux Users IRC Channel: #debian-ir Israel Debian Israel North America Canada THUG Location: (Greater) Toronto Group Email Address: thug@gnu.org Website: http://www.nongnu.org/thug/ Wiki: IRC Channel: #thug Contact: Description: We are currently a small group that is growing nicely. We meet every couple months in a convenient location, usually the University of Waterloo. Our current leaders are all Debian developers and GNU Hurd enthusiats. Geolocation: 33.000 S 151.600 E UW-DIG Location: University of Waterloo, Waterloo, Ontario, Canada Group Email Address: uw-dig@uw-dig.uwaterloo.ca Website: http://uw-dig.uwaterloo.ca Wiki: IRC Channel: Contact: Description: The University of Waterloo Debian Interest Group is a group of Debianers who meet monthly to learn from each other and discuss the current projects the group has going. Geolocation: 43.467 N 80.533 W Debian Quebec Location: Montréal, Canada Wiki: LocalGroups/DebianQuebec IRC Channel: #debian-quebec Mailing list: https://lists.debian.org/debian-dug-quebec/ Website: https://debian.quebec Description: Our group has been recently organizing a local meeting roughly every two months. We've also been sporadically organizing events such as release and bug squashing parties. In the past, we've organized DebConf17 in Montreal. GTALUG Location: Toronto, Ontario, Canada Wiki: GTALUG Mailing list: https://gtalug.org/mailing-list/ Website: https://gtalug.org Description: Our group has been meeting on a monthly basis since June 1994. Mexico Debian Mexico Location: México Group Email Address: debian-dug-mx@lists.debian.org Website: http://www.debian.mx/ Wiki: IRC Channel: #debian-mx Contact: Description: Mexican Debian User's Group Geolocation: 19.432696 N 99.132936 W USA CA - California Southern California Debian Location: CA, US (Los Angeles, San Diego) Group Email Address: scd@scd.debian.net Website: http://scd.debian.net/ (If you receive a 403 error, please contact Blars Blarson <blarson@blars.org>. He will be more than happy to explain to you why you are not able to access this web site). Wiki: IRC Channel: Contact: Matt Zimmerman <mdz@debian.org> Description: The usual low-traffic mailing list, irregular meetings, key signing Geolocation: 32.715 N 117.156 W Bay Area Debian Location: CA, US (San Francisco Bay area) Group Email Address: bad@bad.debian.net Website: http://bad.debian.net Wiki: IRC Channel: Contact: Description: A loose collection of over 100 Debian developers and enthusiasts. Currently has get-togethers on the second Wednesday of most months. Geolocation: 37.775 N 122.418 W DC - Washington area-washington-dc Location: Washington, DC, US Group Email Address: debian-dug-washington-dc@lists.debian.org Website: https://lists.debian.org/debian-dug-washington-dc/ Wiki: IRC Channel: #debian-dc Contact: Aaron M. Ucko <ucko@debian.org> Description: A dozen or so Debianers (mostly but not exclusively DDs) who meet irregularly (usually by request). Geolocation: 38.895 N 77.037 W MA - Massachusetts debian-boston-soc Location: Boston, MA, US Group Email Address: debian-bo'''
