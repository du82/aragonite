["https://wiki.debian.org/DebianLex"]
title = "DebianLex - Debian Wiki"
full_description = '2019-07-22 "Reorganisation of www.debian.org: Please provide information about your Blend" After this reorganisation you will find information about software under OfficeApplication. This goals will be taken over: Project goals Build a solid software base for legal practice with emphasis on easy installation, easy maintenance and security. Bring authors of different projects with similar goals together. Test suite for easy evaluation of the quality of legal software. Provide information and documentation of legal software. Help upstream authors to get their products packaged for Debian. Show commercial software companies the strengths of a solid base system and make them consider to port their software to Linux or even to switch to Open Source. Debian-Lex Project description Debian-Lex is an internal project to develop Debian into an operating system that is particularly well fit for the requirements for legal offices. The goal of Debian-Lex is a complete system for all tasks in legal practice which is built completely on free software. Debian-Lex will be based on Debian Pure Blends, which is a framework for metapackages that declare dependencies on other Debian packages, so that the complete blend will be well suited to meet the requirements of the practice of law. We also envisage that Debian-Lex will add value to existing packages by providing customised templates for lawyers. For example, templates would be provided for OpenOffice.org, SQL-Ledger and a sample database schema for PostgreSQL. News [5 September 2009] Some stirrings : law.com article, a ubuntu forum group, a blog by a lawyer user. [15 March 2009] DebianLex is now a blends project with a svn repository. To begin blending for this project, please see this preliminary guide. [29 November 2007] Debian Lex gets its rebirth and the project wiki is opened on DebianLex [23 August 2005] Debian Lex is looking for a new co-ordinator. [11 August 2003] Our CVS server is up with initial versions of Debian-Lex packages [2 May 2003] Press: Aussie leads development of open source O-S for lawyers [23 Apr 2003] Debian-Lex makes DWN! [19 Apr 2003] Initial proposal to developers Email List The Debian-Lex mailing list is now available. You can subscribe to and unsubscribe from it using the list web page, and also read the list archives. Proposed Metapackages and Roles Translation(s): none /ProposedMetapackages Send any suggestions for improvements to the mailing list, or on the discussion page DebianLex/ProposedMetapackages/Discussion. Accounting Case Communication Confidentiality Document Time Roles Project goals Build a solid software base for legal practice with emphasis on easy installation, easy maintenance and security. Bring authors of different projects with similar goals together. Test suite for easy evaluation of the quality of legal software. Provide information and documentation of legal software. Help upstream authors to get their products packaged for Debian. Show commercial software companies the strengths of a solid base system and make them consider to port their software to Linux or even to switch to Open Source. Talks about Debian-Lex We will add any talks about Debian-Lex here as source and preformatted slides. It might be a good idea to check these pages to get some interesting information about the project. What can I do to help? Work on enhancing and translating these web pages. Create a logo (here is an example, also in GIMP format, and here is the legal TuX on which it is based). Packaging the above-mentioned software projects for Debian. Building meta packages for different tasks. Documentation and translation. Internationalization (which is more than just translating because of the different legal systems). Building a live CD (perhaps based on Knoppix). Marketing & PR Once we have something to show for this project, and indeed even in the formative stages of this project, we are being watched by the eyes of the world. We will necessarily want to work with press@debian.org to get the word out and to help give Debian and this project the kind of exposure we want. For this purpose we will build a collection of slides of talks about Debian-Lex. Links LegalXML lexml Project Participants List Please add your name and an information about the country below if you are interested in helping to bring Debian-Lex back to life: ... Pepe Co - pepeco1948 at gmail.com (ES). Spanish Lawyer & Debian User Oliver Vivell - oliver(at)vivell.info (DE) Joe Reed - joe(at)kastenhosting.net ( ) Dr. Michael Stehmann - webmaster@rechtsanwalt-stehmann.de (DE) Canzeley. It is now available as a Debian package Jeroen de Kreek - jdk(at)lawyers.nl (EU) Ken Walker kgw at lunar dot ca. Canadian lawyer and ubuntu user. Barbara Figueirido - barbara (at) bariloche (dot) com (dot) ar - Argentina - Lawyer / Linux user Elaine Tsiang et @t ihear top is comSeattle USA After some very helpful input from other blenders, we have a working copy for /ProposedMetapackages. Please continue your input on the list, or directly on the working copy. I am working on recategorizing. Your inputs are welcome. Enric G. Torrents, e n r i c g a r c i a at u o c dot e d u -Working as developer at ArbyX, a web application from CodeX (Stanford Department of Legal Information) devoted to arbitration and international law. - Contractor for the Stanford School of Law, developing social and semantic networks applied to law research (http://www.weboflaw.com). - Collaborator at the Stanford China Guiding Cases Project, developing a machine translation engine English-Chinese specialized in the legal domain. Currently located in Southern China, born in Barcelona. Interested in promoting the implementation of open-source in the law field, available to contribute to this pure blend by maintaining packages and any other necessary tasks.'
