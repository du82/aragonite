["https://wiki.debian.org/fr/ProjectNews/HowToContribute"]
title = "fr/ProjectNews/HowToContribute - Debian Wiki"
full_description = "Traduction(s):English - Español - Français - Italiano - 한국어 - Português - Português Brasileiro ?Discussion Note : le document original est plus récent que cette traduction. Cette page explique COMMENT contribuer aux Nouvelles du projet et ce que VOUS pouvez faire pour aider. Contents COMMENT contribuer Envoyer des nouvelles intéressantes Ce que vous devriez envoyer Les choses qui n'ont pas besoin d'être rapportées Help by native speakers Devenez vous-même un éditeur COMMENT contribuer Contribuer aux Nouvelles du projet est simple et dépend de vos compétences et du temps que vous pouvez y consacrer Envoyer des nouvelles intéressantes Le meilleur moyen de nous aider est de nous informer sur des sujets intéressants de l'univers Debian. Debian est un assez gros projet et nous n'avons pas suffisamment de ressources humaines pour monitorer chaque mailing list, chaque blog ou site de nouvelles pour du contenu que nous voudrions ajouter à nos Nouvelles du projet. Donc, tenez-nous au courant si vous remarquez des évènements intéressants. Vous pouvez, en règle générale le faire en envoyant un email à debian-publicity@lists.debian.org. Ce que vous devriez envoyer De façon générale : tout ce qui peut avoir un impact sur le Projet Debian de façon générale et ses utilisateurs plus particulièrement. Quelques idées : les discussions sur les mailing-lists ayant un impact (ex : discussion concernant les licences, transition programmée du projet foo vers le projet bar, discussion à propos des résolutions générales, etc.) Débats en cours sur une liste de diffusion, ce qui aura un impact notable (par exemple, Licence de discussion, de transition prévue à partir de Projet Foo vers Projet bar, la discussion sur les résolutions générales, etc.) petites annonces concernant les sous-projets Debian installateur debian s'apprête à sortir beta3, test demandés debconf traduction en francais pour atteindre 100% cdrkit capable de graver des disques blue ray ... des rapports de bugs intéressants (vous avez déjà regardé 245047 ?) Vous avez représenté Debian à une conférence ou à une présentation (avec un stand, une discussion, ou un atelier) Vous avez écrit un rapport après avoir représenté Debian à une conférence ou à une présentation Vous avez été interviewé à propos de votre travail sur Debian Debian commentaires connexes / tests / articles dans d'autres médias / sites web / listes de diffusion / blogs ... Les choses qui n'ont pas besoin d'être rapportées Les versions de Debian -- nous le savons probablement déjà Bien sûr, cette liste est loin d'être complète. Ce que nous voulons montrer, c'est que nous ne pouvons surveiller tous les médias, sites web, blogs, et tout le reste. Donc, c'est intéressant que vous rapportiez tout ce que vous pensez avoir sa place dans le ProjectNews à notre liste de discussions debian-publicity@lists.debian.org. Gardez à l'esprit qu'un de nos principaux objectifs, en plus de tenir nos utilisateurs informés, est de leur montrer que nous formons une communauté vivante et laborieuse ! Que les choses avancent, que Debian est vivante ! Help by native speakers Actuellement, le rédacteur principal n'a pas l'anglais comme langue maternelle. IL le sait et vous vous en êtes peut-être aussi rendu compte. Donc si vous êtes anglophone, vous pouvez corriger son en_DE en anglais correct. C'est très facile ; vous jetez un oeil à ?la dernière édition et vous corrigez les fautes d'orthographes ou autres. Devenez vous-même un éditeur Si vous vous sentez capable d'écrire de petits articles pour ProjectNews, n'hésitez pas à rejoindre l'équipe. Nous supposons que vous avez déjà souscrit à la liste de diffusion debian-publicity à http://lists.debian.org/debian-publicity? La bonne idée serait de vous abonner à la wiki-pages de la catégorie CategoryProjectNews. Alors vous êtes prêt à démarrer: Jetez un oeil à la liste, et si nous avons eu une proposition, l'examiner - ou de trouver quelque chose d'intéressant vous-même. Pensez-vous qu'il devrait être ajouté à l'hebdomadaire de nouvelles? Vous sentez-vous capable de le résumer dans un objectif façon? Puis le faire! Il suffit d'ajouter vos nouvelles à ?dernière édition. Nous avons mis en place des lignes directrices ici. Si vous n'êtes pas sûr, si vous avez obtenu l'autorisation, n'hésitez pas à envoyer votre premier article à la liste de publicité. CategoryProjectNews | CategoryL10nFrUpdate"
