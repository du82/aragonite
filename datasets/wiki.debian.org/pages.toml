["https://wiki.debian.org/Fish"]
title = "Fish - Debian Wiki"
full_description = "fish is a smart and user-friendly command line shell for Linux, macOS, and the rest of the family. Fish features includes Autosuggestions fish suggests commands as you type based on history and completions, just like a web browser. Watch out, Netscape Navigator 4.0! Sane Scripting fish is fully scriptable, and its syntax is simple, clean, and consistent. You'll never write esac again. Man Page Completions Other shells support programmable completions, but only fish generates them automatically by parsing your installed man pages. Glorious VGA Color fish supports 24 bit true color, the state of the art in terminal technology. Behold the monospaced rainbow. Web Based Configuration For those lucky few with a graphical computer, you can set your colors and view functions, variables, and history all from a web page. Works Out of the Box fish will delight you with features like tab completions and syntax highlighting that just work, with nothing new to learn or configure. Debian Specific Information fish package in debian Upstream Specific Information Upstream website for fish Fish Tutorial CategoryCommandLineInterface"
