full_description = "2025-01-11: 데비안 12.9 (bookworm) 릴리스 2024-08-31: 데비안 11.11 (bullseye) 릴리스 추가 릴리스 & EOL 날짜... 내려받기 설치 안내 업그레이드 가이드 (amd64) 데비안 릴리스 릴리스 노트 새로운 점 (amd64) 주의 사항 (amd64) 정오표 데비안 새 소식 데비안 소개 설치 커뮤니티 사용자 데스크톱 환경 소프트웨어 하드웨어 패키지 관리 관리자 시스템 관리 네트워크 서비스 명령줄 인터페이스 개발자 데비안 개발하기 프로그래밍 개발 도구 Català - Česky - Deutsch - English - Español - Esperanto - Français - Indonesian - Italiano - Magyar - Melayu - Dutch - Norsk - Polski - Português (Brasil) - Portuguese (Portugal) - Русский (Russian) - српски - Svenska - தமிழ் (Tamil) - Türkçe - Українська (Ukrainian) - Tiếng Việt - فارسی (Farsi) - Ελληνικά (Greek) - বাংলা (Bengali) - 日本語 (Nihongo) - 简体中文 (Chinese) - عربي (Arabiya) - עברית (Hebrew) - 한국어(Korean) - 正體中文 (Chinese) 이 위키는 데비안 프로젝트를 지원하고 이와 관련된 문서가 있는 곳입니다. 누구나 편집하고 발전시킬 수 있으니 함께 기여해주세요. 둘러보기: FindPage | WordIndex | TitleIndex | RecentChanges | RandomPage 이 위키를 운영하는 사람과 연락하려면 연락처를 참고해 주세요. CategoryProjectNews"
