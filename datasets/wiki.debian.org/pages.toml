["https://wiki.debian.org/ProjectNews/Translation_Workflow"]
title = "ProjectNews/Translation_Workflow - Debian Wiki"
full_description = "This page documents the current workflow used by the French translation team to translate and send out issues of the Debian Project News. It welcomes other team experience in order to give some hints to each other. It relies on the current workflow, and likewise, the following states only the ideal workflow. Because of some constraints of the editors or due to expected events (e.g. when one ftp-master ask the issue to be delayed for a couple of hours, so the mail he is about to send out can be mentioned in the issue) the following timeline might be stretched. Current workflow (As practised more or less by the French translation team.) After every release svn.alioth.debian.org/svn/publicity/dpn/LL/current is moved to the proper location (e.g. 2010/01). Then a new current folder is created and the index.wml-template is copied in there, to start with an empty and fresh translation of the news. Around a week before the issue is to be published, begin to translate what is already available (in order to avoid last minute, hurry and possibly dirty work). If enough articles are already in place (say four or five), sent the WIP draft to the debian-l10n-language@l.d.o for review. When the DPN is string-frozen, try to finish it as quickly as possible, asking for help in debian-l10n-language@l.d.o can be a good idea, and offers to any member the ability to provide at least one translated article (ask explicitly to mention on which article she or he works in order to avoid duplicate). When the translated DPN is finished hopefully Friday or Saturday, ask for a formal review on debian-l10n-language@l.d.o. On the next Monday, publish the translated DPN on the website following the original one, and launch a last call for comment on debian-l10n-language@l.d.o. Two or three days later, send the DPN on debian-news-language@l.d.o. Remarks and problems with the current workflow The time allowed for contributors to review the issue is still short, thus the proposition to provide partial WIP draft for review one week before. It heavily depends on a DPN which is not edited at the last minute ;-). It is still sent two or three days after its targeted date. See also: ProjectNews ProjectNews/HowToContribute ProjectNews/Workflow CategoryProjectNews"
year_published = 2025
