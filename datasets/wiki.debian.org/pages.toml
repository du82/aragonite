full_description = '''Translation(s): English - Español - Français - Italiano - 한국어 - Português - Português (Brasil) - Svenska - Українська The Debian Project News The Debian Project News is a newsletter with the most important and interesting news about Debian in general on a regular basis (currently on a biweekly basis). It is not intended as a replacement of the DeveloperNews but as a completion for them. It's targeting an audience of "regular" users, which might not be interested in details of the development process or long reports of success stories. The first issue of the Debian Project News was sent out on 2008-04-21, after the end of Debian Weekly News and Alexander Schmehl's call to resurrect it. If you would like to contribute please read our contribution page. If you would like to help writing articles, please also read our style guidelines. The currently used workflow is documented for those who are interested. Via Mail: debian-news mailing list Via Web: https://www.debian.org/News/project/ Via RSS: https://www.debian.org/News/project/dwn CategoryNews CategoryProjectNews'''
