full_description = "Translation(s): Brasileiro - English - Русский - Español - Ελληνικά - 日本語 - Bahasa Indonesia ?/Discussion Καλώς ήρθατε στην κοινότητα του Debian Το παρόν portal αφορά γεγονότα, την ιστορία και λίγο από το υπόβαθρο του Debian Πηγές Συχνές Ερωτήσεις Χρήσιμα κανάλια irc Λίστες Αλληλογραφίας Φίλοι του Debian Φιλοξενία του Debian ?Ομάδες Γεγονότα Γεγονότα για το Debian Bug Squashing Parties: Party επίλυσης Σφαλμάτων Γενέθλια του Debian DebianEvents: Γεγονότα σχετικά με το Debian DebConf: το Ετήσιο Συνέδριο του Debian Εκθέσεις, Συνέδρια Time line: ?Timeline2007 Για το Linux γενικά LinuxWorld Συνέδριο και Έκθεση: ?San Francisco 2007 LinuxTag: LinuxTag2007 Διανομές Προ-διαμορφωμένες διανομές Το Debian Edu είναι ένα σχέδιο για την αξιοποίηση του Debian στη δημιουργία της καλλίτερης διανομής για τους σκοπούς της Εκπαίδευσης. Το Debian Junior είναι ένα σχέδιο ώστε να γίνει το Debian ένα λειτουργικό σύστημα που τα παιδιά θα απολαμβάνουν να χρησιμοποιούν! Το Debian Lex is a complete system for all tasks in legal practice Το Debian Live that you can try in a CD-rom or install in your hard disk or usb stick. Το Debian Med presents packages that are associated with medicine, pre-clinical research, and life science. Το Sidux is a Debian-based live cd of balanced sid snapshots Το ?Debmacs is a french distribution with Stumpwm and Emacs Άλλες διανομές το Debian και οι άλλες διανομές Εμπορικές διανομές βασισμένες στο Debian Συνεισφορά και βοήθεια στη βελτίωση του Σχεδίου Περιοχή για συνεισφέροντες που δεν είναι προγραμματιστές Επανασχεδιασμός του ιστοτόπου και συζήτηση για την ανακατασκευή, προτάσεις για το www.debian.org Πώς μπορείτε να βοηθήσετε το Σχέδιο Debian CategoryPortal"
