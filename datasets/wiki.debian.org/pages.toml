["https://wiki.debian.org/Derivatives/Census/Aptosid"]
title = "Derivatives/Census/Aptosid - Debian Wiki"
full_description = "aptosid aptosid is made up of 2 words, firstly apto, which is a Latin word which means 'to fit, adapt, adjust, make ready, or fit'. The second word is sid and is the codename of Debian's unstable branch. aptosid holds fast to the core values and social contract of Debian. (DFSG). We aim to be 100% compatible with debian sid, and is at the forefront regarding the definition of a rolling distribution. Status: inactive (2024-01-26) Homepage: http://aptosid.com/ Blog: Microblog: Corporate sponsor: Government sponsor: user IRC: ircs://irc.oftc.net/aptosid devel IRC: Debian IRC: user list: devel list: Debian list: user forums: http://aptosid.com/index.php?name=PNphpBB2 devel forum: Debian forum: Forum: wiki: security contact: Stefan Lippers-Hollmann <s.l-h@gmx.de> Manual: http://manual.aptosid.com/ Debian derivatives census maintainer: Stefan Lippers-Hollmann <s.l-h@gmx.de>, Trevor Walkley <trevor_walkley@aptenodytes.org>(bluewater on IRC) Debian derivatives census page: Derivatives/Census/Aptosid Debian page: Distrowatch page: https://distrowatch.com/aptosid Distribution type: live image, installable Debian derivative model: uses Debian binary packages and adds/modifies a minimal amount of source packages Based on: Debian unstable VCS repository: https://github.com/fullstory Bug tracker: Forwarded bugs: Architectures: amd64 i386 Patches repo: Docs about aptosid for Debian developers: Docs about Debian for aptosid developers: aptosid glossary: Package comparison: Popcon information: QA information: lintian information: piuparts information: static analysis information: list of developers: developer blogs: developer microblogs: developer info: derivatives info: mirrors: http://aptosid.com/mirrors-en.html apt repositories: deb [arch=i386,amd64] http://aptosid.com/debian/ sid main fix.main deb-src http://aptosid.com/debian/ sid main fix.main Last updated 2013-08-06 12:53:56"
