full_description = '''Català - Česky - Deutsch - English - Español - Esperanto - Français - Indonesian - Italiano - Magyar - Melayu - Dutch - Norsk - Polski - Português (Brasil) - Portuguese (Portugal) - Русский (Russian) - српски - Svenska - தமிழ் (Tamil) - Türkçe - Українська (Ukrainian) - Tiếng Việt - فارسی (Farsi) - Ελληνικά (Greek) - বাংলা (Bengali) - 日本語 (Nihongo) - 简体中文 (Chinese) - عربي (Arabiya) - עברית (Hebrew) - 한국어(Korean) - 正體中文 (Chinese) *** Denne sida er definitivt ikkje på nynorsk! *** Ho vil verta oppdatert med ein gong ressursane er til stades. Vi beklager at denne siden ikke er oppdatert mhp. den internasjonale siden FrontPage. Vi håper å finne tid til å oppdatere den snart. Dette er en wiki for Support og dokumentasjon av Debian Prosjektet, og en måte for utviklere å kommunisere på. Som alle andre wiki'er, er denne wiki'en under konstant endring, og du er velkommen med dine endringer. Dersom du leter etter noe spesielt, kan du søke bruke FindPage. SøkeLys: DebianHosting Flere selskaper tilbyr dedikerte Debian servere, eller tjenester på en Debian server i løpet av kort tid. På DebianHosting kan du se hvem du skal henvende deg til. Offisielle og uoffesielle nyheter om Debian Easier file renaming with renameutils, by debianadmin.com Samba file-sharing with Active Directory authentication, by rubenleusink.com DebianInstaller/Xen, by DebianWiki Setup Xen within 20 minutes on Debian, by Michael Prokop Install Tomcat 5.5 in Debian, by sub.jam For brukere DebianIntroduction - Hva er Debian? Hvor kan jeg finne Debian? WhyDebian - Hvorfor bruke Debian istedet for en annen Unix/Linux? DebianInstall - OK, du vil installere Debian? Les denne guiden. DebianNetworkInstall - Hvordan installere Debian over nettet, for eksempel internett DebianHosting - Ønsker du en server med Debian på nett så raskt som mulig? FromWindowsToDebian - Ønsker du å gå fra Windows til Debian ? Les denne guiden! DebianResources - Eksterne resurser for Debian MeetDebian - Debian på konferanser og utstillinger DebianSystem - Dokumentasjon av programvaren som finnes i Debian DebianReleases - Hvordan blir forskjellige utgaver av Debian til For utviklerne OngoingTransitions - Informasjon om pakker som er i en overgansfase i Debian. Status/Unstable - Hvilke problemer finnes nå i unstable. LowThresholdNmu - Pakker hvor NMU kan skje uten ventetid. ComaintainersAreWelcome - Utviklere som ønsker hjelp med å vedlikeholde pakkene sine. CategoryEtchReleaseRecertification - Hvilke arkitekturer passerdet å gi ut for etch (neste debian-version). EtchTODOList qa.debian.org DebianMachines - Bruk av utviklermaskiner for å rette arkitektur-spesifikke problemer med pakker Underprosjekter ArmEabiPort - Prosjekt for å lage en ny "ARM" arkitektur (forklaring på hvorfor finner du på siden) DebianDesktop DebianEdu - Fri programvare for skoler (aka SkoleLinux). DebianInstaller - Utvikling av installasjonsrutinene. DebianLive - Debian på en LiveCD og verktøy for å installere på ?harddisk på USB minnepenner. DebianScience - Fri Programvare for forskning. Embedded_Debian - Verktøy for å bygge debian for små enheter Games/Development - Spill for Debian. FriendsOfDebian DebianEvents - Arrangementer hvor folk fra Debian prosjektet er involvert XStrikeForce - Vedlikehold av pakker for X vindussystem i Debian. Teams/TeXTaskForce - Vedlikehold av TeX systemer i Debian og utvikling av en Policy for Tex i Debian DebianGis - Vedlikehold og pakking av GIS relaterte program og verktøy. Andre CustomDebian Java - Java i Debian, veien videre til frie versjoner av java Meta DebianWiki - Informasjon om denne wiki, hvordan logge inn, og hvordan redigere sider. DebianWiki/ConventionsDiscussion - diskusjon om innholdet på disse sidene.'''
