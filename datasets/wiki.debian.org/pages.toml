["https://wiki.debian.org/es/ProjectNews/Issues/2008/09"]
title = "es/ProjectNews/Issues/2008/09 - Debian Wiki"
full_description = 'Translation(s): ?Inglés - Español ?Discussion Estas noticias han sido publicadas! Por favor no las edite. Si encuentra errores por favor corríjalos en el sitio de Debian. Noticias del Proyecto Debian http://www.debian.org/News/project/2008/09 Noticias del Proyecto Debian - 18 de agosto de 2008 Bienvenido a 9na edición de este año del DPN, el boletín para la comunidad de Debian. Algunos de los tópicos cubiertos en esta edición incluyen: Debian arriba a los 15 Finaliza 8va Conferencia anual de Debian Freespire 5 se basa en Debian ... y mucho más. Debian arriba a los 15 El 16 de Agosto de 1993 Ian Murdock anunció una nueva distribución de Linux nombrada "Debian". 15 años después el proyecto comenzado por él es la má grande distribución de Linux a lo largo del mundo, la cuál ofrece más de 20 000 paquetes de softwares mantenidos por cerca de 1000 voluntarios, soportando más arquitecturas de hardware que cualquier otra distribución de Linux, y proveyendo de una base para más de 20 derivados activos, como Knoppix , Skolelinux ó Ubuntu Usuarios, periodistas, y Desarrolladores de Debian se felicitaron, algunas veces con alegría, otras veces con profundidad, y celebraron el cumpleaños del proyecto del Proyecto Debian en todo el mundo con fiestas y un día de conferencias(algunas veces incluso con contactos en vivo de las sesiones). Incluso una fiesta de cumpleaños virtual se llevó a cabo en Second Live(un mundo virtual potenciado por debian) donde los músicos Blue4u Nowicka y Jaggpro ?McCann dieron conciertos como una apertura de la fiesta virtual. En Argentina Steve ?McIntyre, actual líder del Proyecto Debian, inició la 9na Conferecia de Debian con una conferencia describiendo el estado actual del proyecto y el argo camino que ha tenido hasta hoy. Su conferencia está disponible como video para descargar . El proyecto Debianquiere agradecer a sus usuarios y desarrolladores por la confianza puesta en nuestra distribución a lo largo de los 15 años y que está buscando la nueva publicación de Debian GNU/Linux 5.0 "Lenny" por lo que mucha felicitación nos llega. Freespire 5 se basa en Debian Recientemente adquirido por la Corporación Xandrox, la próxima liberación de Freespire será basada en la publicación de Debian GNU/Linux Lenny. La presente liberación de Freespire (2.0.8) está todavía basada en Ubuntu 7.10 (Gutsy Gibbon). "Un esfuerzo combinado de desarrollo de Xandros/Linspire retornará Freespire a sus raíces en Debian GNU/Linux y lo prondrá en sincronismo con la versión profesional de escritorio de Xandros, " dijo Andreas Typaldos, CEO de Xandros. Freespire 5 está listo para ser liberado en el último trimestre del 2008. Finaliza 8va Conferencia anual de Debian La 8va conferencia anual de Debian, que permitió a los usuarios y desarrolladores estás juntos, aprender nuevas técnicas y discutir desarrollos adicinales ha finalizado el 17 de Agosto de 2008. Algunos de los resultados de los diálogos que tuvieron lugar en ella serán mencionados en esta edición. Los videos de las sesiones de conferencia están disponibles( o lo estarán pronto) en el archivo de reuniones. El equipo de video pide retroalimentación. Es también posible darle retroalimentación a los conferencistas y temas. Cómo la mayoría de los participantes están todavía camino a sus casas, el próximo boletín de Noticias del Proyecto Debian tendrá una covertura más profunda de la Conferencia de Debian y lo asociado al Día de Debian en Buenos Aires. Debian en el FreeRunner OpenMoko Joachim Breitner anuncia el comienzo de una adaptación oficial de Debian para el FreeRunner ?OpenMoko, un teléfono inteligente que fue diseñado y desarrollado de un modo libre y abierto. Esto permite a los usuarios de Debian usar la distribución de su preferencia incluso en su teléfono. Las instrucciones de instalación pueden ser encontradas en la Wiki de Debian. Bits desde equipo especial X Julien Cristau reporta sobre los nuevos desarrollos dentro del equipo especial X. El equipo X está contento de anunciar que la configuración del servidor Xorg ha sido considerablemente simplificada y es posible ahora configurar la salida de video en tiempo de ejecución. Además nuevos controladores han sido empaquetados, los más renombrados son los controladores nouveau, un esfuerzo de ingeniería reversa para las tarjetas nVidia y openchrome, la cuál será soportada vía chipsets en lugar de la no mantenida del controlador. El controlador nouveau no tiene todavía la calidad para ser publicado pero el equipo X pide ayuda para probar la versión experimental. Xorg-server 1.5 y mesa 7.1 están también actualmente en la rama experimental y está programado que avancen para sid después de la liberación de lenny. Sobre el mismo tiempo, el equipo planea habilitar el hotplug de los dispositivos de entrada y su configuración a través de hal. Las personas interesadas en participar en el equipo pueden contactarlos en #debian-x de irc.debian.org, ó en debian-x@lists.debian.org. Petición de adopción: El proyecto Debian para niños Ben Armstrong busca a alguien que asuma el proyecto Debian Jr., ya que actualmente él está muy involucrado en otros proyectos internos de Debian y no puede emplear el tiempo que necesita dicho proyecto. El recomienda algunas medidas para mover el proyecto hacia adelante y tiene la esperanza de encontrar un nuevo líder para el proyecto, que asuma su reponsabilidad y otras tareas, y adelante su trabajo de personalizar una distribución Debian cercana a los niños. Próximos cambios a las arquitecturas soportadas Uno de los problemas discutidos durante la Conferencia de Debian de este año fue el ftp-master.debian.org, el principal archivo de Debian, que funciona con recursos limitados. Jörg Jaspert anunció los resultados: Arquitecturas de hardware, que no se han incluido en las dos liberaciones oficiales serán movidas para otro servidor(p.e. debian-ports.org). El principal propósito de liberar espacio para las arquitecturas que están en mejor forma y por lo tanto tienen más opotunidad de estar en una liberación. Los candidatos actuales para ser quitados son m68kk, hurd-i386 y arm(que será reeemplazada por armel), mientras que kfreebsd-i386 y kfreebsd-amd64, así como otras arquitecturas podrían ser ahora adicionadas a las máquinas oficiales del archivo de Debian. Por supuesto que las arquitecturas quitadas pueden ser readicionadas al archivo principal cuando estén listas para estar en la liberación. Reducir paquetes de contrib debidos al contructor de paquetes de main Joerg Jaspert dudó si es una característica necesaria que los paquetes fuentes de un componente específico(main, contrib o non-free) creen paquetes binarios dentro de otro componente. Algunos paquetes fuentes en Debian main usan esta característica para crear paquetes binarios en contrib. Quitando esa posibilidad sería fácil un rediseño de la base de datos central del proyecto. Cuando se preguntó sobre los beneficios de quitar esta característica, Stefano Zacchiroli explicó, además que la base de datos debe reflejar la estructura del proyecto, especialmente porque el componente main es una parte oficial de Debian. Ocultar la diferencia podría confundir a nuestros usuarios y es "antinatural". Bits de los adaptadores de GNU/kFreeBSD Aurelien Jarno dió un reporte de estado sobre la adaptación kFreeBSD. En general está en buena forma. Actualmente están soportada en arquitecturas basadas en i386 y AMD64. Tiene una completa cadena de herramientas(incluyendo Java) y más del 85% de todos los paquetes están construidos. El pidió ayuda para calificarlo como arquitectura liberable, porque una adaptación del instalador de Debian está actualmente ausente. Reunión de trabajo de FAI en el Linuxhotel en Essen/Alemania El fin de semana desde el 8 hasta el 10 de Agosto, el equipo de desarrollo de FAI(Instalación completamente automática - una plataforma de instalación y control de actualización para Debian y otras distribuciones) se encontró en el Linuxhotel en Essen, Alemania, para alistar FAI para la liberación de Lenny. En una productiva y agradable reunión siete personas tuvieron muchas cosas que hacer, pero lo más importante, ellos hicieron muchas pruebas de la funcionalidad del FAI actual en el contexto de Lenny. Fallos importantes fueron encontrados y arreglados y el desarrollo futuro fue discutidos, p.e: integración de pruebas para clases así como para regresión de softwares, cómo lidiar con los derechos de autor y cómo los contribuyentes deben ser mencionados en los ficheros de derechos de autor de Debian. Asuntos extras que fueron tocados con fuerza durante el encuentro fueron cómo una mayor cantidad de desarrolladores podrían ser atraídos para adicionar sus códigos dentro de FAI, cómo hacer que FAI esté disponible para ser probado por los usuarios y cómo obtener parches externos en la línea principal de FAI - los cuáles son escritos actualmente por el principal desarrollador. Una primera documentación resultado de la reunión puede ser encontrada en la wiki de fai. El encuentro fue auspiciado por el Linuxhotel Essen, el sistema de información Linux AG y LT-ec. Debian Lenny con soporte para sistemas NAS de corto alcance Martin Michlmayr actualizó kernels para MIPS y ARM para la versión del 2.6.26 del kernel. Estas actualizaciones traen mejoras mayores para el soporte de la arquitectura ARM, que que posibilita ejecutar Debian en dispositivos NAS de corto alcance como el QNAP TS-409. Con el acercamiento de lenny a 2.6.26, lenny se acerca para ser ejecutado en dichos dispositivos. Futuro de snaphsot.debian.net Desde que snapshot.debian.net - un servicio para almacenar todas las versiones de los paquetes de Debian ya subidos al archivo incluyendo enlaces blandos útiles, p.e para navegar por días específicos - tuvo problemas de vez en cuando respecto al manteniendo en condiciones de su espacio en disco, Eddy Petrisor se preguntaba, si una estructura distribuida y soportada para usuarios para almacenar esa gran cantidad de datos sería una buena idea. Andrew Pollock respondió que Debian podría gastar alguno de sus fondos para este servicio- Cyril Brulebois adicionó que ha sido anunciado que snapshot.debian.net debe ser hecho un servicio oficial ofrecido por Debian, haciendo más fácil el empleo de fondos en él. Trabajo de arte y temas de escritorio para Debian "Lenny" Valessio Brito anunció que los trabajos de arte y los temas para la próxima liberación estable de Debian GNU/Linux 5.0 Lenny han sido comenzados durante Debcamp, la sección de programadores durante la Conferencia de Debian anual. En el período de tiempo una versión actualizada del paquete debian-desktop ha sido subido incluyendo un nuevo tema por defecto así como un segundo. Descarga de imágenes CD/DVD - Un recordatorio / rsync en ftp.debian.org Josip Rodin apuntó que parece ser que está ocurriendo un ocultamiento de las imágenes de CD/DVD demasiado pronto. Particulamente, parece que muchas personas no sólo descargan la primera imagen, sino que también las imágenes adicionales(CDs 2-20+). El juego completo de imágenes está publicado por lo que pueden ser descargados por todos los que no tienen acceso regular a una conexión segura a internet.Sin embargo, para aquellos que tiene conexiones sólidas a internet es más eficiente obtener los paquetes directamente desde los repositorios. En las noticias relacionadas Josip Rodin notó que el servicio de rsync de ftp.debian.org ha sido disminuido desde 2001 y ahora ha sido completamente deshabilitado. Cualquiera que ha usado el repositorio para sincronizar el suyo propio usando rsync debe cambiar para otro espejo. Una lista completa de los espejos disponibles de Debian está accesible en http://www.debian.org/mirror/list. Bits desde los editores de DPN Los editores de Noticias del Proyecto Debian enviaron un primer reporte del estado de la arrancada del período del DPN. Después de un comienzó con dificultades el flujo de trabajo ha sido ahora estabilizado de manera general con algunos temas de cuidado, que incluyen la frecuente ausencia de hablantes nativos para examinar los ensayos y traductores para preparar versiones del proyecto de noticas en su propio idioma, para ser enviados simultáneamente con las noticias originales. Pero lo más importante es que se necesita una mayor cantidad de personas que escriban textos pequeños sobre las noticias más notables obtenidas de cada edición de la página de desarrollo. Other news Lucas Nussbaum se preguntó si la solución técnica de congelar la propagación de paquetes desde la rama de desarrollo inestable a la rama de prueba, que va a ser liberada pronto, es adecuada. Partiendo de que el requirimiento de cambios no perturbadores son más un problema social, no deben ser resueltos por medidas estrictamente técnicas y aprobación manual de excepciones. Joey Schulze anunció la reunión de la adaptacion Linux M68k del 2008. que tendrá lugar desde el 29 al 31 de Agosto en la Universidad de Kiel, Alemania. Lucas Nussbaum pidió la revisión final del propósito 1 de elevación de Debian, el cuál trata de mejorar la manera de cómo tratar con las "subidas de softwares por parte de los no desarrolladores"(NMUs en inglés). Sandro Tosi informó que el tópico del canal #debian-devel@OFTC es usado a menudo para dar mensajes de estado en caso de situaciones severas o excepcionales(suspensión de operaciones, caída de servidores, etc). Para estar informados si no se está conectado a oftc el recomienda subscribirse a la Wiki de Debian que a espejos o tópicos de canales. Neil Williams resumió el uso de PO para cualquier cosa que tenga que ver con el mantenimiento de traducciones de varios documentos, incluyendo páginas man. Nicolas François anunció que los servicios hosteados en i18n.debian.net (por ejemplo la interfaz web para el proyecto de traducción de descripción de paquetes de Debian) están ahora disponibles vía SSL también. Stefano Zacchiroli reportó algunas mejoras que hizo en el sistema de seguimiento de paquetes. El arregló varios errores y características pedidas incluyendo la integración sólida con lintian, una herramienta para chequear los paquetes de Debian respecto a errores comunes, y mentors.debian.net, un servicio usado por los desarrolladores de paquetes para buscar desarrolladores de Debian que auspicien sus paquetes para subirlos al archivo de Debian. Lucas Nussbaum blogueó sobre un importante caso de uso de la Base de Datos de Debian "Ultimate", un proyecto del verano de código de Google que integra información de varias fuentes dentro de Debian: la eliminación reciente de importantes paquetes de la distribución de prueba ha causado algunas discusiones. El seguimiento de esos importantes paquetes será fácil a través de esa base de datos. El proyecto Debian en FrOSCon 2008 Desde el sábado 23 de Agosto de 2008 hasta el domingo 24 de agosto del mismo año, el proyecto Debian participará con una sala en la Conferencia de Software Libre y Código Abierto en St. Agustín, Germany. Por favor miré la respectiva página de eventos '
