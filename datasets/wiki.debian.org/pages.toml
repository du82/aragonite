["https://wiki.debian.org/Teams/DebianWiki"]
title = "Teams/DebianWiki - Debian Wiki"
full_description = '''Debian Wiki Team Contents Debian Wiki Team Infrastructure Interacting with the team Usual roles Tasks you can help us for Wiki administrators More stuff Bits from Teams/DebianWiki DebConf BoF(s) Reminders Call for help Future directions Infrastructure Website: https://wiki.debian.org Documentation: https://wiki.debian.org/DebianWiki Unix group: wikiadm (System administrators, not necessarily content administrators, see DebianWiki/Contact), wikiweb (runs the moin/etc WSGI processes). Services handled by the team: /srv/wiki.debian.org/ on host wilder.debian.org git repository with wiki configuration https://salsa.debian.org/debian/wiki.debian.org Interacting with the team Read the FAQ first: DebianWiki Read about contacting us: DebianWiki/Contact Email contact (public): <debian-www@lists.debian.org> Email contact (private): <wiki@debian.org> Bug reports: wiki.debian.org Public IRC channel: #debian-www on OFTC (webchat) Usual roles There are 4 kinds of roles. Someone can handle multiple roles: Contributors : That's anyone who contribute to the wiki. All pages are editable by everyone logged in (except the wiki's built-in base pages that are immutable). Translators : The Wiki translators (see DebianWiki/TranslationCoordination) are like contributors Content administrators : The Content administrators ensure the wiki is consistent. They also maintain the DebianWiki/EditorGuide. (members: see DebianWiki/Contact). Wiki administrators : The member of the group wikiadm can modify the wiki configuration files (and any arbitrary file). (members: see DebianWiki/Contact). Also, DSA team manages the machine hosting the wiki. Tasks Keep the wiki clean, consistent, coordinate structural changes... keep it usable ! you can help us easy tasks Update the pages tagged with "ToDo". more advanced tasks write a FAQ about the Wiki? Rename the translated pages (fr/Something, rather than SomethingFrench or FrenchSomething). hint: make sure you update all the links pointing to the renamed page. Prepare/Implement some standards pages tags (see Wikipedia ; UbuntuWiki) See also: Helping with wiki.debian.org for Wiki administrators Remove spam and spammers Watch RecentChanges for spam and when you find some, login to the wiki server and perform the following steps: $ PATH=$PATH:/srv/wiki.debian.org/bin $ kill-spammer "Some user" $ touch /srv/wiki.debian.org/bin/moin.wsgi $ whois 1.2.3.4 $ mail abuse@example.comContacting the abuse address for the IP address is a good idea but is optional. More stuff See DebianWiki pages. Bits from Teams/DebianWiki It is well past time we did a "bits from ..." mai! DebConf BoF(s) Any topics? ikiwiki? ... Reminders ?DebianBug links other cool stuff that is unused Call for help If you see spam on the wiki, please ping one of the members of the wikiadm group so that the account can be disabled and the IP address banned. More details at DebianWiki/DealingWithSpam Future directions licensing stuff? ikiwiki? more work on moin? Add tracking for a core set of pages to get them reviewed regularly? Sledge has a Category tracking script that might help.'''
