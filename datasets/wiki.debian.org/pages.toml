["https://wiki.debian.org/es/ProjectNews/HowToContribute"]
title = "es/ProjectNews/HowToContribute - Debian Wiki"
full_description = '''Traducción(es): English - Español - Français - Italiano - 한국어 - Português - Português Brasileiro ?/Discussion This page explains HOWTO contribute to Debian ProjectNews and what YOU can do to help. Contents HOWTO contribute to the DPN Send interesting news What you should send Things you don't need to report Help from native speakers Becoming an editor yourself Accessing the subversion repository Some hints for subversion usage Format of the index.wml file Translating the Debian Project News Using Translation check to track original document versions Getting your translation published HOWTO contribute to the DPN Contributing to ProjectNews is easy but depends on your skills and the amount of time you can spare. Send interesting news The easiest way to help us is to inform us about interesting things happening in the Debian universe. Debian is quite a big project, and we don't have the manpower to monitor every mailing list, blog, news site for content we might want to add to our ProjectNews. So tell us, if you noticed something interesting happening. You can usually do this by sending an E-Mail to debian-publicity@lists.debian.org . What you should send Generally speaking: everything which might have a noticeable impact on the Debian Project at large and its user base in particular. Some ideas: Discussions taking place on a mailing list, which: have a noticeable impact on Debian (e.g. License Discussion, a scheduled software transition) contain an interesting discussion regarding Project foo to Project bar General Resolutions, etc.) Smaller announcements from sub projects: debian installer about to release beta3, testing requested French debconf translations reach 100% cdrkit capable of burning blue ray discs "Bits from " mail etc... Interesting Bug Reports (ever looked at 245047?) You represent Debian at a conference or exhibition (with a booth, talk, workshop, etc.) You wrote a report after having represented Debian at a conference or exhibition You were interviewed about your work on Debian Debian related reviews / tests / articles in other media / web sites / mailing lists / blogs Conferences, mini ?DebConfs, FOSDEM, CeBIT, etc. etc... Things you don't need to report Debian release -- we probably know it already Of course the above list is far from being complete. We would especially like to point out, that we can't monitor other media, web sites, blogs and everything else. So it's very valuable to report anything you think fitting to the ProjectNews to our mailing list debian-publicity@lists.debian.org . Keep in mind, that one of the main goals for us, beside keeping our users informed, is to show them that we are a living, working community! I.e. to show that Debian is thriving, that Debian is alive! Help from native speakers Currently the main editor is not a native English speaker. He knows it, and you probably have noticed it, too. So one thing you can help with, as a native speaker, is to fix his en_DE to proper English. The issues are drafted in a Subversion repository. Details on how to access using a Subversion client are listed below in the "Becoming an editor yourself" section. Even if you are unfamiliar with Subversion, you can always download the current issue, review it, and mail comments to the debian-publicity mailing list. We would prefer to receive your changes as diff or wdiff, if possible: Just make a copy of the downloaded file, edit it, and send us the output of diff -u <oldfile> <newfile>. Becoming an editor yourself If you want to contribute directly and want to add small articles to the ProjectNews yourself, feel free to join the team: You really should subscribe to the debian-publicity mailing list at http://lists.debian.org/debian-publicity, as all discussion is held there. You may also want to subscribe to the publicity-commits mailing list at http://lists.alioth.debian.org/mailman/listinfo/publicity-commits. Everytime a change is committed to our subversion repository a mail is sent to that list. So it's very easy to stay up to date. If you are already a Debian Developer you should already have write access to the subversion repository. If you are not a Debian Developer, you need an account on Alioth. If you already have one, you can just request to join the publicity project. If you don't have one, please register on Alioth and then request to join the publicity project. At this point, you really should read our Guidelines for ProjectNews articles. Accessing the subversion repository Before accessing the subversion repository, you might want to read ?Setting up SSH the first time to use the subversion repository on alioth more conveniently. run svn co svn+ssh://svn.alioth.debian.org/svn/publicity/dpn/en/current. This command will create a current folder containing the current draft the Debian Project News. If you like, you may rename that folder into something more convenient for you. Change into that directory. Whatever you do: never delete or otherwise touch the .svn folder therein! It contains some meta data needed to let everything work properly. You can now edit the Debian Project News. Don't worry if you are unexperienced with subversion or the Website Meta Language / HTML (which is used for Debian's website). Nothing you do will directly appear on the website and all errors you might do can be revoked relatively painlessly. Editing Change into the folder containing the checkout. Unless you renamed it, that would be current. Before editing, you should run svn update. This will get your local copy up to date. You may now edit index.wml as you like. See below for details on the format. After you changed index.wml, please run svn update again. Just in case someone changed that document while you where working on it. Subversion tries to be smart, when applying foreign changes to your changed document. Unless you changed the very same line, everything should work out pretty fine. Should you have changed the very same lines, you have created a so called conflict, which must be resolved. Please see the svn book on how to do so. Once your local copy is up to date, you can send your changes to the central repository by running svn -m "description of your changes" commit index.wml. Congrats you just contributed to next issue of the Debian Project News! Also note, that there are several graphical front ends for subversion. But as the writer lacks experience with any of them, he can't recommend them. Two more guidelines for committing your changes: Please use a useful commit message (the description of your changes behind the "-m" Parameter). Try not to write too long lines. Tracking changes / viewing diffs is easier, when the line length is shorter than ~80 characters. Most Editors can be configured to automatically break the line for you. Some hints for subversion usage Keyword expansion and subversion To use the translation check header (which makes it possible for translators to mark which revision of a file they followed when translating) the wml-Files must have the respective svn keywords properties set. So you can place $Id:$ in a document, and subversion will automatically replace it with some information about who did the last changes, when and which revision this document is now. So before committing a new wml file to the repository, please use the following to allow keyword expansion: svn propset svn:keywords "Date Author Id Rev" <yourfile>. You can also add the following line to the [auto-props] section of your ~/.subversion/config and uncomment the enable-auto-props = yes entry which should take care of that automatically: *.wml = svn:keywords="Author Date Id Rev URL"; Format of the index.wml file The Debian Project News are available in three formats: As e-mail sent to the debian-news mailing list (in text form) As HTML version from Debian's website. As RSS feed. All these formats are generated from the index.wml file. Debian's website uses the website meta language (WML) to create the web pages. Roughly speaking WML is HTML with embedded macros (e.g. for common elements on various sites) and the possibility to embed perl scripts, e.g. to create a list of DPN issues based on the available files. But don't worry: you don't need to know WML or perl (and only basic HTML) to contribute to the DPN. Luckily nearly everything is already in place and we just need to create the content with minimal HTML markup. If you look at an empty index.wml (you can look at this one which is used as a template) you'll notice that it starts as follows: #use wml::debian::projectnews::header PUBDATE="2010-XX-XX" SUMMARY="" #use wml::debian::acronymsThe first line says to the wml compiler that it should use the project-news template for the header. It also sets two variables for the publishing date and a small summary. The summary is used for example at the index page for recent issues. It shouldn't be too long. The acronyms line allows the use of specific acronyms, which will show the explanation as a hover text over the acronym. At the end you'll see something similar to this: #use wml::debian::projectnews::footer editor="XXX, XXX, Alexander Reichle-Schmehl"That tells the wml compiler to add the normal footer to the web page. With the editor variable, it will also add the names of the contributors listed there. Everything between these lines, is regular HTML, which in our case mostly means: some headlines (<h2>...</h2>), some paragraphs (<p>...</p>) and some lists (<ul><li>...</li><li>...</li></ul>). Every article should start with a headline: <a name="1"></a> <h2>This is the headline of my small article</h2>The stuff between the <h2> and </h2> is the actual headline. The <a name="x"></a> creates a so called anchor used to directly jump to a specific entry. It's for example used in the RSS-feed. After that follows the actual article between <p> and </p>. You may use several of these paragraphs, but note that only the first one will appear in the RSS-feed. (Which might be a bug worth fixing, if you know enough perl...) As explained, you may use normal HTML in these paragraphs. This means: <q>...</q> for quotes, citations or release names: Debian 6.0 <q>squeeze</q>, Steve McIntyre said: <q>Booh!</q> <a href="..."> for links: The Secretary <a href="http://lists.debian.org/debian-devel-announce/2010/03/msg00000.html">called for nominates</a> for the project leader elections. <!-- ... --> for comments, which won't appear on the website: {<!-- TODO: Add a link once this discussion has come to a conclusion! --> As the Project News is also read by users not very familiar with the Debian internal jargon and acronyms, please also use the <acronym ...> </acronym> tag (not part of HTML but one of our wml templates). See the following example: One topic discussed was: <q>Race against <acronym lang="en" title="None of the above">NOTA</acronym>.</q>While it won't work in the text version for e-mails, at least the HTML version for the websites and the RSS feed will mark the acronym so, that when the user moves the mouse cursor over the acronym the explanation is displayed. You can see an example on http://www.debian.org/News/project/2009/02/ (search for DPL). Translating the Debian Project News Feel free to use the subversion repository for your translation work, too. In these cases it is easier to just check out the complete DPN hierarchy of the subversion repository by doing: svn co svn+ssh://svn.alioth.debian.org/svn/publicity/dpn/ cd dpn Now check if there is already a directory for your language. If not Create one, e.g. mkdir fr Add it to the repository, e.g. svn add fr And commit it to the central Server, e.g. svn commit -m "create directory for french translations" fr Now you can mimic the same directory layout used under the en folder. Old Issues are kept in the specific en/<year>/<issue> directories, the one currently worked on is in en/current. You'll also notice the en/index.wml-template which is an empty issue, used as a template to start a new one. Please see Becoming an editor yourself for some usage guidelines for subversion and a small description of the format of the wml files. But note: Translations should also use a #use wml::debian::translation-check translation="<revision>" header, to mark which revision of the original issue the translation follows. Just like the editor field in the #use wml::debian::projectnews::footer line, translators can also add a translator field in a similar fashion. See the following example: #use wml::debian::projectnews::footer editor="Moritz Muehlenhoff, Andre Felipe Machado, Alexander Reichle-Schmehl" translator="Benedikt Beckmann" Using Translation check to track original document versions If you use the publicities subversion repository you can use the script in scripts/trans-check to track which of your translations are up to date. Your translations need a translation check for this to work. For example: #use wml::debian::translation-check translation="45"This will tell the script (and later Debian's website), that your translation was based upon revision 45 of the original document. The only parameter it takes is the language to be checked or to be more precise: the folder it should compare against the en/ folder. See the following example: alex@rusalka:publicity/dpn$ scripts/trans-check fr Found 'fr/current/index.wml' is outdated! Please run 'svn diff -r 9:18 "en/current/index.wml"' to review the changes to the original document. Getting your translation published As shortly explained in section Format of the index.wml file, the Debian Project News are published in three ways: HTML on the Debian web site RSS feed (also on the Debian web site) Text mail sent to various lists To get your translation published on Debian's website, it will need to be added to the CVS repository. See http://www.debian.org/devel/website/ for more details about that. To send your translation out as e-mail on one of our user mailing lists, note that the debian-news-language lists are moderated, so please get in contact with the respective moderators / your translation team (e.g. via the debian-l10n-language lists). If there's no debian-news-language list for your language, but a debian-user-language list, you may send your translation to that list (depending on what the members of that list think about it). Regardless of where you send it, you will find the script scripts/DPNhtml2mail.pl quite handy: when your translation is available on the website, you can just run it, and it will create the text version for you. You can call it in a way similar to scripts/DPNhtml2mail.pl -d -l en -i 2008/06. It doesn't work perfectly, yet, but it makes it very easy to create a "good looking" text version. CategoryProjectNews'''
