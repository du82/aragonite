full_description = "Translation(s): English - Français - Português (Brasil) - 简体中文 Disambiguation : This page is about Debian Conferences. For Debian configuration management system, see debconf. DebConf is the Debian Project's developer conference. In addition to a full schedule of technical, social and policy talks, DebConf provides an opportunity for developers, contributors and other interested people to meet in person and work together more closely. It has taken place annually since 2000 in locations as varied as Canada, Finland and Mexico. Previous Debian Conferences have featured speakers from around the world. They have also been extremely beneficial for developing key Debian software components, including the new Debian Installer, and for improving Debian's internationalization. General DebConf information For bids DebConf/General/Handbook/Bids/PriorityList • DebConf/General/Handbook/Bids/LocationCheckList For fundraising DebConf fundraising Goals DebConf Goals For Accounting DebConf Accounting All Debian Conferences 2026 DebConf/26 Still taking bids for the location 2025 DebConf/25 Brest, France 2024 DebConf/24 Busan, South Korea 2023 DebConf/23 September 10-17 Kochi, India 2022 DebConf/22 July 17-24 Prizren, Kosovo 2021 DebConf/21 August 24-28 Online 2020 DebConf/20 August 23-29 Online 2019 DebConf/19 July 21-28 Curitiba, Brazil 2018 DebConf18 July 27-August 5 Hsinchu, Taiwan 2017 DebConf17 August 6-12 Montreal, Canada 2016 DebConf16 July 2-9 Cape Town, South Africa 2015 DebConf15 August 15-22 Heidelberg, Germany 2014 DebConf14 August 23-31 Portland (Oregon), USA 2013 DebConf13 August 11-17 Vaumarcus, Switzerland 2012 DebConf12 July 8-14 Managua, Nicaragua 2011 DebConf11 July 24-30 Banja Luka, Bosnia and Herzegovina 2010 DebConf10 August 1-7 New York, USA 2009 DebConf9 July 24-30 Cáceres, Extremadura, Spain 2008 DebConf8 August 10-16 Mar del Plata, Argentina 2007 DebConf7 June 17-23 Edinburgh, Scotland 2006 DebConf6 May 14-22 Oaxtepec, Mexico 2005 DebConf