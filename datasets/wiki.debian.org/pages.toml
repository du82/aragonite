["https://wiki.debian.org/DesktopEnvironment"]
title = "DesktopEnvironment - Debian Wiki"
full_description = "Translation(s): العربية - বাংলা-(Bengali) - Deutsch - Ελληνικά - English - Español - Français - עברית (Hebrew) - Italiano - 한국어 - Polski - Português (Brasil) - Русский - සිංහල-(Sinahala) - Svenska - தமிழ் (Tamil) - 简体中文 Debian supports all kinds of graphical environments, ranging from full-featured desktop environments, to lighter alternatives and even minimalist but powerful window managers. A desktop environment provides a coherent suite of applications in terms of look, functionality, and usability. Contents Desktop components Desktop environment Window manager Tiling window managers Display managers Display server How it works Installation of a desktop environment Sessions Theming and customization Fonts Common problems Heterogeneous environments Default applications Resources End-user Cross-theming Contributing See also External Links Desktop components Desktop environment The GNOME project provides two things: The GNOME desktop environment, an intuitive and attractive desktop for users, and the GNOME development platform, an extensive framework for building applications that integrate into the rest of the desktop. Plasma by KDE is a powerful open source graphical desktop environment for Unix workstations. It combines ease of use, contemporary functionality, and outstanding graphical design with the technological superiority of the Unix operating system. Xfce is a lightweight desktop environment for various *NIX systems. Designed for productivity, it loads and executes applications quickly, while conserving system resources. LXDE is designed to work well with computers on the low end of the performance spectrum such as older resource-constrained machines, new generation netbooks, and other small computers. LXQt is a lightweight desktop environment designed to be especially energy-efficient and suitable for older systems. MATE is the continuation of GNOME 2. It provides an intuitive and attractive desktop environment using traditional metaphors for Linux and other Unix-like operating systems. Other desktop environments available in Debian include Cinnamon, Budgie, Enlightenment, FVWM-Crystal, GNUstep/Window Maker, Sugar and possibly others. Other desktop environments not available in Debian include Unity (1 2), Pantheon, ROX, Equinox/EDE, Étoilé, CDE, Artemis, Durden, Trident, Lumina and others. Window manager As its name says, a window manager controls the layout, appearance and ways to interact with your environment windows. While some window managers might be part of your desktop environment, some (such as tiling window managers) also do work standalone, and were eventually designed for that purpose. Openbox is a lightweight and highly configurable window manager with extensive standards support. It is well known for its minimalistic appearance. Fluxbox is a window manager for X that was based on the Blackbox 0.61.1 code. It is very light on resources and easy to handle yet full of features to make an easy, and extremely fast, desktop experience. Compiz is a compositing window manager for the X Window System that uses 3D graphics hardware to create fast compositing desktop effects for window management. Search Window Managers with Debtags: x11::window-manager. Tiling window managers Tiling window managers provide a way to control windows' behavior by making them tiled, easily occupying the whole screen. Wmii is a dynamic window manager for X11. It supports classic and tiling window management with extended keyboard, mouse, and filesystem-based remote control. It replaces the workspace paradigm with a new tagging approach. Awesome is a dynamic window manager for X11. It supports tiling window management with extended keyboard, mouse, and it is scriptable in Lua. It includes many add-ons which can make it very powerful. It replaces the workspace paradigm with a new tiling approach of non-overlaping windows. i3 dwm Notion is a tiling, tabbed window manager for the X window system. sway is a tiling Wayland compositor. Display managers In the X Window System, an X display manager is a graphical login manager which starts a session on an X server from the same or another computer. A display manager presents the user with a login screen. A session starts when a user successfully enters a valid combination of username and password. More info: Display Manager Display server Most desktop environments currently rely on Xorg, and will eventually support Wayland in the future. How it works Installation of a desktop environment During the installation of Debian the installer offers the choice of which desktop environment to install. Should you prefer to install one after booting into the new OS, you can do so by unticking Debian desktop environment. A user on Debian 11 (bullseye) or Debian 12 (bookworm) would be presented with the menu: [*] Debian desktop environment [ ] GNOME [ ] Xfce [ ] KDE Plasma [ ] Cinnamon [ ] MATE [ ] LXDE [ ] LXQtAccepting this selection installs the GNOME desktop environment. Without deselecting the desktop environment, another entry, GNOME included, may be selected. This will install that selection. Unticking Debian desktop environment and selecting a desktop environment leads to the Debian desktop environment set being installed. For an explanation of this behaviour we have to look at part of the Recommends: line in apt show task-desktop. Recommends: task-gnome-desktop | task-xfce-desktop | task-kde-desktop | task-lxde-desktop | task-cinnamon-desktop | task-mate-desktop | task-lxqt-desktopThe Debian desktop environment option installs task-desktop and requires one of the packages listed above. If none of them are on the system, the first in the list, task-gnome-desktop, will be installed to fulfill the dependency. This is the situation when a user accepts only the Debian desktop environment. Looking at apt show task-mate-desktop we see that it depends on task-desktop and mate-desktop-environment. Ticking MATE, with or without the Debian desktop environment ticked, would satisfy task-desktop's Recommends: line and install MATE instead of the GNOME default. Afterward, installing another desktop environment is as simple as installing a single package. For some desktop environments, you have choice between several meta-packages depending on if you wish to install a minimal set or most of the software coming with the environment. Please refer to the page specific to the desktop environment you wish to install for a description of these meta-packages. Debian Administrator's handbook: Customizing the Graphical Interface Debian Reference Manual: The X Window System: Key packages (Chapters 7.1, 7.2) Installing a new desktop environment will make it available for your system, but you still need to set up your user session (see below) in order to run it. Sessions Sessions are usually managed by the display manager, which itself relies on Xsession. Most display managers will allow you to select which desktop environment and/or window manager you wish to run for next session, and eventually make it default. If you don't want to run a display manager to manage your sessions, you might consider using nodm - you may be comfortable merely using a screen locker (eg. XScreensaver, slock) to lock your sessions manually instead of expecting it to insist on username plus password to get in. This is likely inappropriate for servers, but may well be acceptable for a user's home system, assuming no familial trust issues. If you have no Display Manager installed at all, you can still start the X Environment from console with the startx command, which is a call to xinit. Debian Reference Manual: The X Window System: Starting the X Window System (Chapter 7.5) Theming and customization Desktop environments often have customized themes that allow you to change the look and feel of your desktop. The easiest way to customize your desktop environment is to install theme packages from your system's Package Manager. Further customization is possible by editing settings of Graphical Toolkits, such as GTK2, GTK3, or directly change the application settings. Some terminals like xterm and urxvt make use of Xresources to control their appearance and functionalities. Search X11 Themes with Debtags: x11::theme. Fonts Learn about getting fonts, fonts rendering and other issues. Common problems Heterogeneous environments While the purpose of a desktop is to provide a coherent suite of applications, you are likely to mix applications coming from several desktops which are using various graphical toolkits, with the inconvenience that they will not be well integrated. Getting a uniform look and feel between your applications might be challenging, and relies on workarounds such as using themes specifically designed to look similar between several environments and applications. Some features such as the desktop menus can be shared, in particular for environments following FreeDesktop (XDG) guidelines. Default applications Having several applications with the same purpose will lead to competition for which software is meant to open when handling your files. Several mechanisms do exist to control these default applications and settings. Resources End-user Definition of User Interface. Display managers like XDM, GDM, WDM, or KDM. FreeDesktop Fonts Default settings Xorg Wayland Cross-theming qt5-gtk-platformtheme : may help to have similar look with QT5 applications within GTK environments Base16 : guidelines to make similar-looking themes for various applications. Contributing DebianArt The Debian Desktop project (wiki) Resolution about the default Desktop for Debian. See also CategoryDesktopApplication - wiki pages related to graphical programs for the desktop External Links Desktop environment in Wikipedia Desktop environment (ArchWiki) CategoryPortal | CategoryDesktopEnvironment"
