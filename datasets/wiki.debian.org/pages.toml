["https://wiki.debian.org/es/ProjectNews/Issues/Current"]
title = "es/ProjectNews/Issues/Current - Debian Wiki"
full_description = 'Translation(s): ?Inglés - Español ?Discussion Noticias del Proyecto Debian http://www.debian.org/News/project/xxxx/xx Noticias del Proyecto Debian - día, mes, año Bienvenidos a la xth edición de este año del DPN, el boletín para la comunidad de Debian. Algunos de los tópicos cubiertos en esta edición incluyen: Debian en la conferencia europea de Perl ... y mucho más. Traducciones de Debian para el Francés y el Alemán al 100% Christian Perrier anunció "El 22 de Agosto, las traducciones del Alemán y el Francés para el po-debconf alcanzaron el 100% para la versión inestable. Para el Alemán, es la primera vez que esto pasa y el equipo alemán l10n(localización) merece felicitaciones por este logro". Las traducciones Po-debconf permiten a los hablantes nativos usar Debian en sus propios lenguajes y este es un aspecto importante para trabajar hacia la meta de Debian de ser un sistema operativo universal. TODO: http://lists.debian.org/debian-devel-announce/2008/08/msg00013.html http://lists.debian.org/debian-devel-announce/2008/08/msg00014.html http://lists.debian.org/debian-publicity/2008/08/msg00057.html ?? SERPRO escoje Debian GNU/Linux para sus servidores y quiere colaborar (ver texto de discusión -pub) Resumir los artículos más notables de http://times.debian.net/ Mencionar próximos eventos Adicionar paquetes nuevos y notables desde http://packages.debian.org/unstable/main/newpkg (hecho por un script que crea directamente HTML) Sesiones Planeado movimiento de people.debian.org http://lists.debian.org/debian-devel-announce/2008/08/msg00012.html http://lists.debian.org/debian-devel/2008/08/msg00780.html http://lists.debian.org/debian-project/2008/08/msg00172.html Otras noticias El número Xth de la noticias variadas de los desarrolladors han sido publicadas y cubren los siguientes tópicos: debian en el YAPC::EU 2008 Yo hablé en la Conferencia europea de Perl en Copenhagen la pasada semana, específicamente sobre Debian y Perl y como ellos van juntos. - más sobre la conferencia - de qué hablé - qué personas están interesadas en eso - qué sucederá en el futuro - enlaces, etc. Avisos importantes de seguridad de Debian El Equipo de Seguridad de Debian recientemente ha publicado avisos para estos paquetes(entre otros): foo, bar and baz. Por favor, leálos con cuidado y tome sus propias medidas. Por favor note que éstas son una selección son de los avisos más importantes de las dos últimas semanas. Si ud. necesita mantenerse actualizado de los avisos de seguridad publicados por el equipo de Seguridad de Debian subscríbase a la lista de correo se seguridad para recibir los anuncios. Paquetes nuevos y notables Los siguientes paquetes fueron adicionados al archivo inestable de Debian recientemente(entre otros): Paquetes con necesidad de apoyo Actualmente x paquetes están huérfanos y y paquetes están buscando adopción. Por favor mire en recientes reportes para ver si hay paquetes en los que ud. está interesado o ver la lista completa de paquetes los cuáles necesitan su ayuda. Quiere ud. continuar leyendo DPN? Por favor ayude a crear este boletín. Nosotros todavía necesitamos más escritores voluntarios para estar atentos a la comunidad de Debian y reportar que es lo que está sucediendo. Por favor visite la página de contribución para saber cómo ayudar. Estamos esperando recibir su correo en debian-publicity@lists.debian.org. X, Y y Z contribuyeron en este número del Proyecto de Noticias de Debian. CategoryProjectNews'
