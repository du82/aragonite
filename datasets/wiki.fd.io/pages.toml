["https://wiki.fd.io/view/Archived-JVPP"]
title = "Archived-JVPP - fd.io"
full_description = 'Archived-JVPP From fd.io Jump to: navigation, search JVPP Facts Project Lead: Michal Cmarada Committers: Michal Cmarada Marek Grądzki Tibor Kral Rastislav Szabo Jerome Tollet Repository: git clone https://gerrit.fd.io/r/jvpp Mailing List: JVPP-dev@lists.fd.io Jenkins: jenkins silo Gerrit Patches: code patches/reviews Bugs: JVPP bugs Contents 1 Description 1.1 Project Termination 1.2 Architecture 1.3 Plugin Support 2 Meeting 3 Releases 3.1 19.04 - current master 4 Devel Description Project Termination JVPP/Termination Review Architecture JVPP is a VPP module providing Java APIs for VPP. Java APIs provide a way for a JVM application to access and manage VPP. Main use of JVPP is in Honeycomb project. Honeycomb relies heavily on JVPP to access and manage VPP. JVPP contains of manually crafted code together with generated classes. Classes are being generated by python based on VPP API json files. Generated code represents various Java classes (Callbacks, callfacades, DTOs, types ...) and jni header files. Overview of JVPP usage Plugin Support VppRegistry opens connection to VPP (VppConnection) and manages JVPP plugins. Each plugin needs to be registered in the VppRegistry. Registration involves plugin initialization (providing JNI implementation with JVppCallback reference, VPP client identifier and VPP shared memory queue address). JVPP - Architecture API user sends message by calling a method of appropriate plugin interface. The call is delegated to JNI implementation provided by the particular plugin. When JNI code receives reply, it invokes callback method of JVppCallback that corresponds to the received message reply. JVppCore as an example of JVPP plugin architecture Components marked with an asterisk (*) contain manually crafted code, which in addition to generated classes form jvpp. Exception applies to Callbacks and DTOs, since there are manually crafted marker interfaces in callback and dto package (dto/JVppRequest, dto/JVppReply, dto/JVppDump, dto/JVppReplyDump, callback/JVppCallback) Meeting Honeycomb meeting Releases 19.04 - current master Release plan: Work planned for release Milestones leading to the release Devel HowTo: Cutting stable branches & version bumping Retrieved from "https://wiki.fd.io/index.php?title=Archived-JVPP&oldid=11122" Category: Project Main Pages'
