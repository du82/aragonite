["https://wiki.fd.io/view/Archived-ONE"]
title = "Archived-ONE - fd.io"
full_description = 'Archived-ONE From fd.io Jump to: navigation, search ONE Facts Project Lead: Florin Coras Committers: Florin Coras Lorand Jakab Vina Ermagan Alberto Rodriguez Natal Repository: git clone https://gerrit.fd.io/r/one Mailing List: one-dev@lists.fd.io Jenkins: jenkins silo Gerrit Patches: code patches/reviews Bugs: ONE bugs Contents 1 Description 2 Get Involved 3 Start Here 4 Documentation 5 Tutorial 6 References Description Overlay Network Engine (ONE) is a VPP project that enables programmable dynamic Software Defined overlays. ONE uses an extended LISP-based map-assisted control plane to dynamically lookup overlay-to-underlay address mappings, as well as forwarding policies, on demand and as packets arrive. This includes policies such as connectivity, encryption, traffic engineering and virtual topologies, access control, and service chaining. The looked up mappings and forwarding policies are cached locally for a TTL period until they time out. The mapping and forwarding policy information is then used to encapsulate overlay packets towards their associated destinations or next hops. ONE can use and operate a variety of encapsulation formats for the overlay including GRE, VXLAN-GPE (Generic Protocol Extension) [1], which is effectively merging VXLAN and LISP [2] encapsulations in a single format that supports multi-protocol payloads, etc. The control plane can be used to fetch the encapsulation capabilities of a destination as part of its mapping and forwarding policies. An external open SDN controller will be used as the mapping system to store and provide the mapping and forwarding policies. Get Involved Join the ONE Mailing List. Join fdio-one IRC channel. Start Here Project Proposal Set Up Dev Environment - Explains how to set up a VPP development environment and the requirements for using the build tools Documentation ONE/Termination Review ONE-LISP architecture Command-line Interface (CLI) Guide Binary Interface and VAT Guide RESTCONF Guide (WIP) Tutorial Run the ONE functional tests Simple overlay setup for testing Re-encapsulating tunnel router setup Video tutorial: arch walkthrough, code dive and demo References [1] https://tools.ietf.org/html/draft-ietf-nvo3-vxlan-gpe [2] https://tools.ietf.org/html/rfc6830 [3] https://tools.ietf.org/html/draft-ietf-sfc-nsh [4] https://tools.ietf.org/html/draft-ermagan-lisp-nsh Retrieved from "https://wiki.fd.io/index.php?title=Archived-ONE&oldid=10937" Category: Project Main Pages'
