title = "Events - fd.io"
full_description = 'Events From fd.io Jump to: navigation, search Contents 1 Events 1.1 Click here for Upcoming Event 1.2 Click here for Past Events 1.3 DPDK Summit 2016 | San Jose, CA 1.4 May FD.io /dev/boot Training & Hackfest | Paris, France 1.5 April FD.io /dev/boot Training & Hackfest | San Jose, CA 1.6 ONS 2016 Events For Detailed list of Upcoming and Past Events visit the FD.io Events pages. Click here for Upcoming Event Join us at FD.io Mini-Summit at CloudNativeCon + KubeCon North America, Tuesday December 5, 2017 Click here for Past Events DPDK Summit 2016 | San Jose, CA DPDK Agenda and Presentations May FD.io /dev/boot Training & Hackfest | Paris, France May 31 - June 3—Télécom ParisTech, Paris, FR | Get introduced to and learn more about FD.io (specifically VPP) at this immersive, hands-on training for code contributors and users of FD.io. The training will begin with an overview of FD.io and VPP, followed by learning on how to use VPP, including coding and understanding the internals through a series of deep dives and hands-on labs, and will close with a “hackfest” component for unstructured community collaboration. Subject Matter Experts will be on-hand throughout the session. Final Agenda Content How to Prepare for the Session April FD.io /dev/boot Training & Hackfest | San Jose, CA April 4-7—San Jose, CA | An immersive, hands-on training for code contributors and users of fd.io and hackfest for the fd.io community. The multi-day session begins with VPP basics, proceeds with a series of deep dives and hands-on labs, and closes with a “hackfest” component for unstructured community collaboration. Subject Matter Experts will be on-hand throughout the session. Tentative Agenda Content ONS 2016 FD.io has a presence at ONS 2016: Introduction to FD.io - Wednesday Mar 16 4:10-4:50pm in Grand Ballroom B FD.io Meetup - Wednesday Mar 16 5:00-5:40pm in Napa Retrieved from "https://wiki.fd.io/index.php?title=Events&oldid=6159"'
