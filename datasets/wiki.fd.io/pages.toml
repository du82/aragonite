["https://wiki.fd.io/view/Infrastructure_Support"]
title = "Infrastructure Support - fd.io"
full_description = '''Infrastructure Support From fd.io Jump to: navigation, search Contents 1 FD.io Infrastructure Support 1.1 Linux Foundation Infrastructure Support 1.1.1 Linux Foundation Supported Systems 1.1.2 Linux Foundation Supported Services 1.1.3 Linux Foundation Self Service Offerings 2 FD.io Lab Hardware Support 3 FD.io Lab Software Support FD.io Infrastructure Support Linux Foundation Infrastructure Support The Linux Foundation manages and maintains the CI/CD infrastructure for FD.io projects. Linux Foundation uses Jira Service Desk as a support platform for administrative and infrastructure issues requiring input or action from members of the Linux Foundation IT staff. All requests require an LF HelpDesk ticket. Please follow the LF Help Desk/Service Desk documentation to ensure your ticket is routed to the correct queue. Choose “Project Services” as your support category and then start typing your question into the field provided. As you type, the system will suggest knowledge base articles that may help you find an applicable self-service solution. If none of the suggested articles are helping you resolve your problem, please navigate the menus under the input field to select the category that best reflects the nature of your request. Linux Foundation has monitoring and alerting in place that should recognize and escalate system outage reports as they occur. Please check the Linux Foundation Status Page and FD.io Status Page prior to opening a ticket with the service desk. Linux Foundation Supported Systems Gerrit Jenkins Sandbox Jenkins Production Nexus Jira SonarCloud OpenGrok Wiki Project Mailing Lists Linux Foundation Supported Services Gerrit GitHub replication Jenkins OpenStack executors and images Approved project creation Provide the link to the project proposal page and the TSC meeting notes with approval Linux Foundation account issues VPN access Be sure to attach your public PGP/GPG signature to your LF HelpDesk request Creating GPG Keys Linux Foundation Self Service Offerings Self-Service Committer Promotion Linux Foundation has provided self-service committer promotion via INFO.yaml files in each project's repository. The purpose of the INFO file is to allow project committers to act as administrators of their project and provide a clear record of project history. Please follow the steps in the LF Releng Committer management documentation to add TSC approved project committers Self-Service PackageCloud Releases Coming soon FD.io Lab Hardware Support The Linux Foundation does not provide support or have access to the FD.io lab Vexxhost manages and maintains the FD.io lab hardware for FD.io projects. For hardware and network related issues, please open a ticket by logging into the Vexxhost Client Area Approved support contacts include CSIT committers, and VPP committers FD.io Lab Software Support The Linux Foundation does not provide support or have access to the FD.io lab The CSIT and VPP projects manage and maintain the FD.io lab software. For software related issues, please contact csit-dev@lists.fd.io For Nomad executors and Docker images, please open an FD.io JIRA ticket under the CIMAN project. Nomad Operations and Planning Retrieved from "https://wiki.fd.io/index.php?title=Infrastructure_Support&oldid=10557"'''
