["https://wiki.fd.io/view/Project_Proposals"]
title = "Project Proposals - fd.io"
full_description = '''Project Proposals From fd.io Jump to: navigation, search Contents 1 Instructions for Submitting New Project Proposals 2 Guidelines for your Creation Review 3 After Your Creation Review 4 Project Proposals Instructions for Submitting New Project Proposals Review the Technical Community Charter to get a clear picture of how projects work in fd.io. Replace ${projectname} in the URL https://wiki.fd.io/view/Project_Proposals/${projectName}?action=edit&preload=Project_Proposals/Template and enter it in your browser bar. This will copy in the Project Proposal Template into your new page. Fill out the template and save your new project proposal page. Please indicate if you are planning to contribute existing code, or start a new project from scratch. Add a link to your proposal to the Project Proposals Section of this page. When you are happy with your proposal, send email to tsc@lists.fd.io using this email template. You should expect questions and feedback on your proposal from the community in response to your email, please be prepared to respond and engage. Prepare your existing code for contribution. here. Submit your code to the fd.io Foundation for IPR Review. Guidelines for your Creation Review The last step before your project is created is your Creation Review before the fd.io TSC. You can ask for your creation review to be scheduled for any TSC meeting that is more than two weeks after the proposal was e-mailed to the tsc list. Please e-mail the tsc list to schedule the proposal using this email template. It may not be possible to schedule the creation review on the requested day, the TSC does it's best to accommodate requests. Creation reviews typically last 20–30 minutes. People usually either bring slides or just use their proposal if it goes into sufficient detail. A few diagrams of the major components and how they interact are often useful. If you plan to use slides, please upload them to the wiki ahead of time so that people can see them without needing WebEx screensharing to work as it's often annoying to get to work on Linux. We conduct the meeting on IRC as well as WebEx, so it's useful to have the slides posted to the wiki before the meeting, that way we can link them in. You can find details about both the WebEx and IRC on the TSC page Common questions that come up are: Is the committer list complete? What problem is being solved here? What is the scope of the project? How should we expect it to interact with other related components and projects that are already in fd.io? How would an user interact with it? any user story to illustrate? Is this work that can be done in existing projects? If there is overlap with existing projects, why are you choosing to start a new project? After Your Creation Review Once your project has been formally approved by the TSC, you'll want to start getting it set up. Make sure any code you are bringing in goes through IPR Review. Look at the New Project Checklist Of particular note, create a main wiki page for your project using the project facts template so that people can find key information about your project and so that it appears in the Project List. The first thing you'll want to do is to email the fd.io helpdesk with a link to the TSC minutes (or TSC list e-mail) showing your creation review approval asking for your resources to be set up. After that, you should start working through the tasks on the checklist. At the very least, you can set up your main project wiki page with the key facts while your infrastructure is being set up. Project Proposals https://wiki.fd.io/view/Project_Proposals/CSIT https://wiki.fd.io/view/Project_Proposals/Honeycomb https://wiki.fd.io/view/Project_Proposals/NSH_SFC https://wiki.fd.io/view/Project_Proposals/Overlay_Network_Engine https://wiki.fd.io/view/Project_Proposals/TLDK https://wiki.fd.io/view/Project_Proposals/VPPSandbox https://wiki.fd.io/view/Project_Proposals/pkg-dpdk https://wiki.fd.io/view/Project_Proposals/ci-management https://wiki.fd.io/view/Project_Proposals/TRex https://wiki.fd.io/view/Project_Proposals/puppet-fdio https://wiki.fd.io/view/Project_Proposals/honeycomb-vpp https://wiki.fd.io/view/Project_Proposals/processing_pipeline https://wiki.fd.io/view/Project_Proposals/govpp https://wiki.fd.io/view/Project_Proposals/odp4vpp https://wiki.fd.io/view/Project_Proposals/p4vpp https://wiki.fd.io/view/Project_Proposals/pma_tools https://wiki.fd.io/view/Project_Proposals/cicn https://wiki.fd.io/view/Project_Proposals/DMM https://wiki.fd.io/view/Project_Proposals/Sweetcomb https://wiki.fd.io/view/Project_Proposals/hicn https://wiki.fd.io/view/Project_Proposals/JVPP https://wiki.fd.io/view/Project_Proposals/opflex-vpp-renderer https://wiki.fd.io/view/Project_Proposals/uDPI https://wiki.fd.io/view/Project_Proposals/VSAP Retrieved from "https://wiki.fd.io/index.php?title=Project_Proposals&oldid=11671"'''
