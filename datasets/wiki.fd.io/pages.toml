["https://wiki.fd.io/view/Become_A_Committer"]
title = "Become A Committer - fd.io"
full_description = '''Become A Committer From fd.io Jump to: navigation, search Contents 1 How To Become A FD.io Project Committer 1.1 What Is A Committer? 1.2 How Is A Committer Added To A Project? 1.3 Where Is The List Of Committers Maintained? 1.4 What Are The Attributes Of Excellence For FD.io Committers? 1.5 How Do I Get Started On Becoming A Committer? 1.6 What Happens Next? 1.7 How Do I Activate Git Merge Rights? How To Become A FD.io Project Committer This page is provides an overview of how a contributor to a FD.io project can become a committer. What Is A Committer? The committer role is defined in FD.io Technical Community Document section 3.1.2: For each project there is a set of Contributors approved for the right to commit code to the source code management system (the “Committers”) for that project. Committer rights are per project; being a Committer on one project does not give an individual committer rights on any other project. The Committers will be the decision makers on all matters for a project including design, code, patches, and releases for a project. Committers are the best available individuals, but usually work full-time on components in active development. How Is A Committer Added To A Project? The process of adding a committer to a FD.io project is specified in FD.io Technical Community Document section 3.2.2: Initial Committers for a project will be specified at project creation. Committer rights for a project are earned via code contribution and community trust. Committers for a project select and vote for new Committers for that project, subject to TSC approval. New Committers for a project should have a demonstrable established history of meritocratic code contribution. Where Is The List Of Committers Maintained? Each project maintains the official list of committers in the project git repository in the INFO.yaml file. Committers are also listed on the project wiki page on wiki.fd.io, however, this list may become stale and should not be taken as the official list. What Are The Attributes Of Excellence For FD.io Committers? Active participation in project meetings, events, webinars, etc. Project contributions (code, documentation, tests, white papers, presentations, etc) Diligent & timely review of gerrit changes Personal commitment to supporting the project (above and beyond employer expectations) Personal accountability for content merged by committer (e.g. if a patch that you merged causes a problem, you take action to rectify the issue) Considerate and thoughtful interactions with all project contributors (i.e. in reviews, email discussions, meetings) Adherence to LFN's Antitrust Policy How Do I Get Started On Becoming A Committer? Participate, participate, participate push gerrit changes make constructive review comments speak up at community meetings answer questions on email lists, slack channels, etc. Communicate your desire to become a committer directly with the project PTL or Committer and the TSC Chairperson Participate, participate, participate What Happens Next? After having convinced the PTL or another Committer to nominate you, a vote by the projects committers will be held on a publicly accessible email list with a list of your contributions to the project (typically from gerrit.fd.io). Once the vote concludes, if a majority of the project committers have voted for you, then the results of vote will be added to the FD.io TSC Meeting Agenda and the TSC will discuss and vote on your nomination. How Do I Activate Git Merge Rights? If the TSC approves, then you must follow the LFN Project Self-Service Committer Management instructions to activate merge rights to the project git repository. Retrieved from "https://wiki.fd.io/index.php?title=Become_A_Committer&oldid=12242"'''
