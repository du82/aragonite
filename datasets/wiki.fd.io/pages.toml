full_description = 'Main Page From fd.io Jump to: navigation, search Contents 1 Welcome to the FD.io Developer Wiki 2 FD.io Webinars 3 FD.io Projects 4 FD.io Community Organization 5 Get Involved 6 Presentations 7 Videos 8 Useful Resources for Projects 9 FD.io Infrastructure 9.1 Getting IT Support 9.2 Infrastructure Guide Welcome to the FD.io Developer Wiki This wiki supports Linux Foundation ID single-sign-on and registration with the link at the top this page. Other components of the FD.io Project that do not support single-sign-on will directly request your Linux Foundation ID username and password for login. FD.io Webinars The Linux Foundation and FD.io would like to do some technical talks. We had originally intended to do an in person FD.io technical event collocated with the DPDK folks. With the advent of covid, in person events were cancelled for this year. In the course of discussing perhaps doing a ‘virtual’ event, it was decided instead to do a series of technical webinars. Please add your ideas to the subpage below. FD.io Webinars FD.io Projects VPP Archived-Honeycomb CSIT Archived-NSH SFC Archived-ONE VPP Sandbox Archived-TLDK Archived-Deb dpdk Ci-management Archived-Rpm dpdk Archived-Puppet-fdio Archived-Hc2vpp TRex Cicn GoVPP Archived-ODP4VPP Archived-P4vpp Archived-Pma tools Archived-DMM Archived-Sweetcomb HICN Archived-JVPP UDPI VSAP FD.io Community Organization Technical Steering Committee (TSC) TSC Documents About the TSC Technical Working Stream Fd.io is one of LFN projects. Get Involved Join FD.io mailing lists Join FD.io IRC channels Meetings Propose a Community Project How to become a committer FD.io Events FD.io Internship Opportunities Presentations A running list of FD.io Presentations. Videos FD.io Youtube Channel Performance of VPP vs OVSDPDK in an IP based Cloud Video Network Useful Resources for Projects Mature Release Process FD.io Security Process LFX Security report for FD.io LFX Security FD.io Overview FD.io Infrastructure Getting I