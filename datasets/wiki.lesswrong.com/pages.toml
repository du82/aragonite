["https://wiki.lesswrong.com"]
title = "LessWrong"
full_description = '''LessWrong Wiki From LessWrong Jump to navigation Jump to search This wiki is deprecated. The new wiki is available at lesswrong.com/tags/all Old Wiki is here as a historical artifact Welcome to the Less Wrong wikiThe wiki about rationality that anyone who is logged in can edit 564 articles since April 2009 Over the last few decades, new experiments have changed science's picture of the way we think — how we succeed or fail to obtain the truth and achieve our goals. The heuristics and biases program, in cognitive psychology, has exposed dozens of major flaws in human reasoning. Social psychology has learned about how groups succeed or fail. Behavioral economists have measured the way humans decide against models of optimal decision-makers, and discovered that we often decide suboptimally. Less Wrong is a site for people who want to apply these findings to their own thinking. This wiki is a companion for the community blog Less Wrong. Our criterion for "notability": a concept needs to be discussed in at least one promoted article, and later be referenced by another (possibly unpromoted) article. If you want to write about something that isn't "notable" yet, do it on the blog! Featured articles Articles in need of help Complexity of value Paperclip maximizer Evolutionary psychology Rationality Cached thought Costs of rationality Getting Started Not sure where to start? Start reading the Sequences, posts organized from the best of the Less Wrong archives. Consult the FAQ. If you're a reader looking to explore the Wiki, you might like to start by browsing the topic tree (especially Concepts) or by viewing all pages. A few interesting places on the blog are described in Special threads. If you are new to wikis, check out the Help:User Guide. The Open Thread is a good place to ask questions. Adding content If you create an account on the Less Wrong group blog, you'll be able to edit pages here using the same login details around 24 hours later. If you would like to get started on editing, please read Help:Etiquette and Help:Style_Guide. A description of the Wiki format can be found at Help:Formatting on MediaWiki. To create a new article, just enter the article title in the box below. Every wiki has two list of articles that need help called "Stubs" and "Wanted Articles". Don't be shy, get in there. Check out the community portal to see what the community is working on, to give feedback or just to say hi. Retrieved from "https://lesswrong.mywikis.wiki/w139/index.php?title=LessWrong_Wiki&oldid=16982" Categories: BrowseLessWrong Wiki'''
