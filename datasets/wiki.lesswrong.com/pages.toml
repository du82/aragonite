["https://wiki.lesswrong.com/wiki/Categories"]
title = "Categories - LessWrong"
full_description = '''Categories From LessWrong Jump to navigation Jump to search This page contains a list of categories for the pages on this wiki. Click on any of the categories to see a list of pages that belong to that category. See All Topics for a hierarchical rendering of the list of pages on the wiki. See also Category:Categories, and Special:Categories Main categories for Less Wrong Concepts This category is for pages that define concepts. Sequences The main page for this category is Sequences. Directory for the sequences: Sequences Resource lists This category is for pages containing lists of links to other pages or to external resources and sites. Meta This category is for pages about the wiki itself, or about Less Wrong portal/community, rather than about any particular topic. First pages to see on the wiki Introductory articles Pages that could be helpful to new people on Less Wrong. Featured articles This category contains the best articles on the wiki. Use {{featured article}} template to mark articles as featured. Articles by topic Biases This category is for pages about Biases. Fallacies This category is for pages about Fallacies. Jargon This category is for pages that define jargon used on this wiki, or other articles on Less Wrong or Overcoming Bias. Please add missing common terms or acronyms to the Jargon page. Positions This category is for pages that give a brief summary of standard positions on various topics. Techniques This category is for the descriptions of techniques for improving people's rationality in specific situations. Theses This category is for pages that summarize theses that have been developed at length and discussed on Less Wrong. Problems This category is for pages about difficulties that face human rationality, either unresolved, or with a resolution that is not generally appreciated or understood. Theorems This category is for pages about Theorems. Categories for people People This category is for pages about people of interest to readers of this wiki. Authors This category is for pages about authors of books, articles, or other media relevant to readers of this wiki. Wiki administrators This category lists the main administrators of this wiki. Other users may have admin privileges, but the people listed here are the main people responsible for administrative tasks on this wiki. Maintenance of the wiki Help Category for "help" pages on Less Wrong wiki. Most, but not all, have "Help:" at the beginning of their page names and are therefore in the "Help" namespace; an automatically-generated list of those can be found at Special:AllPages by running down the "Namespace" menu. Wiki administrators This category lists the main administrators of this wiki. Other users may have admin privileges, but the people listed here are the main people responsible for administrative tasks on this wiki. Site maintenance This category includes matters that should be examined from time to time by contributors concerned with maintaining and enhancing the quality of this wiki. There may be errors or omissions that need fixing, or pages that clearly need improvement. Whenever there is nothing more to attend to in subcategories or articles below, such contributors are urged to look at: The community portal Special:Log/protect Special:BrokenRedirects Special:DoubleRedirects Special:Uncategorizedcategories Special:Uncategorizedimages Special:Uncategorizedpages Special:Wantedcategories Retrieved from "https://lesswrong.mywikis.wiki/w139/index.php?title=Categories&oldid=6825" Categories: Resource listsCategoriesOrganization'''
