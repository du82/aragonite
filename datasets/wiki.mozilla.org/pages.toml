title = "Contribute - MozillaWiki"
full_description = '''Contribute From MozillaWiki Jump to navigation Jump to search Thanks for your interest in contributing to Mozilla! The Mozilla Project welcomes contributions from everyone who shares our goals and wants to contribute in a healthy and constructive manner within our community. As such, we require all those who participate to agree to adhere to the Community Participation Guidelines in order to help us create a safe and positive community experience for all. Quick Start: To make a technical contribution: Contribute to the Mozilla code base -> [1] Find your first code contribution -> codetribute.mozilla.org Contribute documentation to MDN (formerly Mozilla Developer Network) -> developer.mozilla.org Contribute your design to an open design community -> github.com/mozilla/OpenDesign/ Contribute to Common Voice by supporting the technical aspects To make a non-technical contribution: Localize Mozilla into your language -> pontoon.mozilla.org Help support users from the comfort of your couch by answering questions and/or writing and translating support articles -> support.mozilla.org Support Mozilla's mission - find worthwhile and fun ways to get involved right away via the -> Mozilla Community Portal Contribute to Common Voice by contributing and validating voice clips Specialist Programs & Funding Programs: As a critical part of the mission, Mozilla invests in innovators and projects working to make the internet more open, inclusive, decentralized, and secure. These programs each have their own set of requirements and application process, please read carefully. Available by application: Fellowships - For web activists, open-source researchers and scientists, and technology policy experts who work on the front lines of the internet health movement. Research Grants & Sponsorships - For universities, labs and research-focused registered non-profits working to make the internet a better place. Mozilla Awards - For open source projects that contribute to Mozilla’s work and to the health of the Internet. Mozilla's Open Source Support Awards- provide catalytic funding to open source technologists. Outreachy - For members of under-represented groups who want to intern in free and open source software. Summer of Code - For student developers who want to work with an open source organization on a 3 month programming project during their break from school. Developer Engagement Events - for people seeking speakers or sponsorship for developer-oriented events. Still can’t find what you’re looking for? Check out the conversations on the Mozilla Discourse. Looking for content from the old page? You can find it in the archive HERE. Retrieved from "https://wiki.mozilla.org/index.php?title=Contribute&oldid=1250815"'''
year_published = 2025
clearnet = "https://wiki.mozilla.org/Contribute"
