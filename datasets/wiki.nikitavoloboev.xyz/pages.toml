Tech And Programming Wiki Pages

As Voloboev is a developer first and foremost, a lot of the content on his wiki concerns these topics. As such, he has put together enough pages to create a good introduction to the topic right now.

This includes pages on the basics, such as programming and programming languages, macOS, hardware, and more. These serve as a good starting point for anyone who wants to learn more about these components and wants to get started with their own programming career.

You will also find pages concerning the newest advances in tech, too. For example, you can take a look at the augmented reality page, where he pulls together links that explain what this is and what the tech can do. You will also find pages on cloud computing, cryptocurrencies, and virtual reality.

Links To Other Media

A big part of the wiki here is links to other useful media. Voloboev has ensured that he has linked any media that he has found useful or interesting. Not only does that give the reader a repository of useful info, but gives you an insight into his thought processes behind his work too.

You can find a full list of the podcasts he listens to, as well as TV shows and web links that he has pulled from. A link to talk gives a list of the talks he finds interesting on a range of topics, from coding to how to prepare a talk.

Off Topic Wiki Pages

While a lot of the wiki is devoted to programming and related subjects, there are some pages that cover the basic things that Voloboev is interested in.

For example, he has put together a page on sleep, with links to studies on sleep as well as tips on how to get better sleep. You’ll also find a page on mindfulness, which has Voloboev’s thoughts on the practice and notes on how mindfulness is practised, along with its effects.

Social Media

Voloboev can currently be found on several social media platforms, such as Twitter, Instagram, Telegram, and more. He aims to be available on these platforms, so if you want to get in touch these are the best ways to get in contact with him.

As Voloboev keeps such extensive notes online, both on his site and his wiki, you can see a lot of what he works on and the code he uses. He aims to share all this info with the idea of helping others, and ensuring that everyone has a chance to learn.'''
