full_description = '''Af:Main Page From OpenStreetMap Wiki Jump to navigation Jump to search Purge Help Main Page - Other languages Afrikaans asturianu azərbaycanca Bahasa Indonesia Bahasa Melayu bosanski brezhoneg català čeština Crnogorski dansk Deutsch eesti English español Esperanto euskara français Frysk Gàidhlig galego hrvatski Ido interlingua íslenska italiano Kreyòl ayisyen kréyòl gwadloupéyen kurdî latviešu Lëtzebuergesch lietuvių magyar Nederlands norsk norsk nynorsk occitan polski português română sardu shqip slovenčina slovenščina srpski (latinica) suomi svenska Tagalog Tiếng Việt Türkçe Zazaki Ελληνικά беларуская български македонски монгол русский српски / srpski українська հայերեն עברית العربية سرائیکی فارسی پنجابی پښتو नेपाली मराठी हिन्दी বাংলা ਪੰਜਾਬੀ தமிழ் മലയാളം සිංහල ไทย မြန်မာဘာသာ 한국어 ქართული ⵜⴰⵎⴰⵣⵉⵖⵜ 中文（简体） 中文（繁體） 日本語 粵語 Other languages... Welkom by OpenStreetMap, die projek wat verniet geografiese data skep en voorsien vir enige iemand wat dit wil gebruik. Ons het die projek begin want die meeste kaarte wat jy dink is verniet het gewoonlik wettige en tegniese beperkings as jy dit gebruik. Die beperkings hou mense weg daarvan om die kaarte kreatiewe, produktiewe en/of onverwagte maniere te gebruik. Die Kaart Gebruik die hoof aanlyn kaarte of van die baie ander dienste.. Bydrae Gebruik die Beginners Gids om uit te vind hoe om die kaart inhoud te verbeter. Anders kan jy ook 'n fout raporteer deur Notes te gebruik. Jy kan ook die developers help om beter gereedskap te maak, donasies gee of data te skryf wat ander kan invoer in hulle rekenaars. Kartering Projekte Vind uit oor die verskeie Kartering Projekte, van toegankilikheid (vir sig en mobiliteid gestremde persone) tot winter sporte. Vir 'n lys van Lande/gebiede van Afghanistan tot Zimbabwe. Map Features The Map Features page will show you how to tag everything from an Acacia tree to a zoological garden. Help To get answers when things aren't working. About Find out about how the project works and its many Contributors. Licensing We have changed the license from CC BY-SA to the Open Database License (ODbL). Upcoming events (add) – Sien ook: Past Events Event archive 2004-2020 1–2 MaartVirtual Mapping Party - Port Townsend, WAPort Townsend, Washington, United States2 Maart14th OSM Delhi Mapping Party (Online)Dwarka, Delhi, India4 MaartMapRoulette Monthly Community Meeting4 MaartOSM Utah Monthly Map NightSalt Lake City, Utah, United States4 MaartOpenStreetMap meetup in BrusselsMolenbeek-Saint-Jean - Sint-Jans-Molenbeek, Belgium4 MaartOSM Treffen SalzburgSalzburg, Salzburg, Austria4 MaartMissing Maps London: (Online) Mapathon [eng]4 MaartOnline-Diskussion OSM-Förderprogramm des FOSSGIS e.V.4 MaartSouth Bay Map NightSan Jose, California, United States5 MaartStuttgarter OpenStreetMap-TreffenStuttgart, Baden-Württemberg, Germany5 MaartiD Community Chat5 MaartKvartální OSM pivoBrno, Southeast, Czechia5 MaartOSM Indoor Meetup5 MaartMissing Maps - DRK & MSF Online Mapathon [deutsch]7 MaartOSMF Engineering Working Group meeting7 MaartRencontre Mapadour (Groupe local Pays Basque - Sud Landes)Anglet, Nouvelle-Aquitaine, France7 MaartZagreb mapathon @ FERCity of Zagreb, Croatia7–9 MaartStarke Frauen, Brot und Rosen - Community-Hackday im JuNo in MoersMoers, North Rhine-Westphalia, Germany9 Maart14th OSM Delhi Mapping PartyDwarka, Delhi, India9 MaartOSMmapperCPHCopenhagen, Capital Region of Denmark, Denmark10 MaartDécouverte d'OpenStreetMapGrenoble, Auvergne-Rhône-Alpes, France10 MaartOpenStreetMap x Wikidata Taipei #74Chengnei, Taipei, Taiwan11 MaartHamburger MappertreffenHamburg, Germany13 MaartMünchner OSM-TreffenMunich, Bavaria, Germany14 MaartConférence présentation d'OpenStreetMapMarseille, Provence-Alpes-Côte d'Azur, France15 MaartBalade et cartopartie - Parcours de fraîcheurMarseille, Provence-Alpes-Côte d'Azur, France15 MaartJunta OSM Latam - Avances SotM Latam 2025 MedellínMedellín, Antioquia, Colombia15 MaartCartopartie - Quartier du Pontiffroy MetzMetz, Grand