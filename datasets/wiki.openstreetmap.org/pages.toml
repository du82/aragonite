full_description = '''Ar:Main Page From OpenStreetMap Wiki Jump to navigation Jump to search Purge Help Main Page - Other languages Afrikaans asturianu azərbaycanca Bahasa Indonesia Bahasa Melayu bosanski brezhoneg català čeština Crnogorski dansk Deutsch eesti English español Esperanto euskara français Frysk Gàidhlig galego hrvatski Ido interlingua íslenska italiano Kreyòl ayisyen kréyòl gwadloupéyen kurdî latviešu Lëtzebuergesch lietuvių magyar Nederlands norsk norsk nynorsk occitan polski português română sardu shqip slovenčina slovenščina srpski (latinica) suomi svenska Tagalog Tiếng Việt Türkçe Zazaki Ελληνικά беларуская български македонски монгол русский српски / srpski українська հայերեն עברית العربية سرائیکی فارسی پنجابی پښتو नेपाली मराठी हिन्दी বাংলা ਪੰਜਾਬੀ தமிழ் മലയാളം සිංහල ไทย မြန်မာဘာသာ 한국어 ქართული ⵜⴰⵎⴰⵣⵉⵖⵜ 中文（简体） 中文（繁體） 日本語 粵語 Other languages... أهلا بك في خرائط OpenStreetMap، المشروع الذي ينشئ ويوزع | بالمجان البيانات الجغرافية للعالم. لقد بدأنا هذا لأن معظم الخرائط التي تعتقد أنها مجانية لها في الواقع قيود قانونية أوتقنية على استخدامها، و التي تمنع الناس من استخدامها بطرق إبداعية أو منتجة أو غير متوقعة. إعرف أكثر عن OpenStreetMap | كيفية المساهمة | الحصول على المساعدة استخدام خرائط Openstreetmap استخدام الخرائط استعرض موقع world map تحقق من المنتجات الجاهزة للاستخدام مثل أجهزة المحمول, أو أجهزة الكمبيوتر أو خدمات الويب ... أعرف أكثر عن استخدام OpenStreetMap المساهمة في توفير بيانات الخرائط المجانية دليل المبتدئين استعرض دليل ميزات الخريطة استعرض مشاريع رسم الخرائط ... أغرف أكثر عن المساهمة في بيانات الخرائط تطوير البرمجيات تطوير واستخدام المنصة استخدم OpenStreetMap مع برمجياتك المساهمة في برنامج OpenStreetMap News 2025 ٧ يناير2025-01-07–2025-01-08 Want to work on OpenStreetMap? Apply to be the OSM Core Software Development Facilitator! Applications will be accepted until January 21. 2024 ٢٠ ديسمبر2024-12-20–2024-12-21 Sovereign Tech Fund invests €384k in OpenStreetMap. ١٩ ديسمبر2024-12-19–2024-12-20 Meta has donated €178k to the OpenStreetMap Foundation to support community and core infrastructure. ١٧ ديسمبر2024-12-17–2024-12-18 All services are back live after an outage – map away. :) ١٩ أكتوبر2024-10-19–2024-10-20 If you are an OpenStreetMap Foundation member, you can attend the online 18th Annual General Meeting of the Foundation, where the results of the OSM Foundation's board election will be announced. ١٢ أكتوبر2024-10-12–2024-10-13 Voting is open for the 2024 board election. Read about voting eligibility, instructions and common questions here. ٩ أكتوبر2024-10-09–2024-10-10 Learn about how OSM's infrastructure has been progressing with an update from OSM's Senior Site Reliability Engineer. ٢٧ سبتمبر2024-09-27–2024-09-28 You can now read the answers and the manifestos of the 2024 OSM Foundation's board election candidates. Discuss the answers on your local channels or on community.osm.org. ٩ أغسطس2024-08-09–2024-08-10 OpenStreetMap's 20th birthday. See where birthday parties and meetings were held. ٩ أغسطس2024-08-09–2024-08-10 Read OSM's founder Steve Coast's thoughts on the 20th birthday of OpenStreetMap. ١٨ يونيو2024-06-18–2024-06-19 OpenStreetMap Foundation board member Sarah Hoffman participated in the United Nations' UN-Maps conference, hear more about how the UN uses OSM. ٧ يونيو2024-06-07–2024-06-08 See a progress update on vector tiles from the Engineering Working Group to learn more about this exciting improvement to openstreetmap.org. ٢١ مايو2024-05-21–2024-05-22 Read about what the OSM Foundation Board has been up to – highlights from the OSMF Board Spring 2024 Meeting. ١٧ أبريل2024-04-17–2024-04-18 Learn about changes in authorizations with OAuth 1.0a and HTTP Basic Auth shutdown on OpenStreetMap.org. ١١ أبريل2024-04-11–2024-04-12 Join the OpenStreetMap Foundation! Here are three great reasons to join the OSM Foundation as a member. ٤ أبريل2024-04-04–2024-04-05 The academic track at the 2024 State of the Map conference has opened for submissions as well! Learn more about submitting your academ