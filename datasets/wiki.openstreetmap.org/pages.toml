title = "Birthday - OpenStreetMap Wiki"
full_description = '''Birthday From OpenStreetMap Wiki Jump to navigation Jump to search The "Birthday" of OpenStreetMap is lost in the sands of time. Observance of the anniversary of the creation of OpenStreetMap is held on or about the 9th of August, which is the anniversary of the registration of the OpenStreetMap.org domain name. The concept of OpenStreetMap predates the domain name registration, but that seems a suitable anniversary date. In August this year, we're 21! Details of this year's events: OpenStreetMap 21th Anniversary Birthday party The OpenStreetMap Anniversaries 1st (2005) 2nd (2006) 3rd (2007) 4th (2008) 5th (2009) 6th (2010) 7th (2011) 8th (2012) 9th (2013) 10th (2014) 11th (2015) 12th (2016) 13th (2017) 14th (2018) 15th (2019) 16th (2020) 17th (2021) 18th (2022) 19th (2023) 20th (2024) This year we're celebrating the OpenStreetMap 21th Anniversary Birthday party! See also History of OpenStreetMap Cake – the edible one! Retrieved from "https://wiki.openstreetmap.org/w/index.php?title=Birthday&oldid=1628907" Category: OSM Anniversary'''
