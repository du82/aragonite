Dez. 2024 europäischer Zeit, wieder verfügbar sein. – Wir wechseln zum neuen ISP (Internetanbieter). 19. Okt.2024-10-19–2024-10-20 Auf dem jährlichen Treffen der OSM Foundation wird der Vorstand gewählt. Die Erklärungen der Kandidaten sind hier zu finden. Mitglieder können hier am Treffen und der Wahl teilhaben. 9. Aug.2024-08-09–2024-08-10 OpenStreetMap's 20. Geburtstag – Übersicht der Geburtstags-Feiern und -Treffen 20. Mär.2024-03-20–2024-03-21 Der Aufruf zur Beteiligung an der „State of the Map“ Konferenz 2024 ist aktiv! Erfahre mehr über das Einreichen einer Idee für eine Präsentation. 11. Feb.2024-02-11–2024-02-12 2024 als Jahr der OpenStreetMap vector maps ausgerufen. 5. Feb.2024-02-05–2024-02-06 OpenStreetMap wurde zum digitalen öffentlichen Gut ernannt. ältere … Systemstatus(en) Neue Merkmale und Attribute Darüber wird aktuell abgestimmt: Mtb:scale:amtb Abstimmung vor Kurzem beendet: Golf=out of bounds Россия/Голосования/Обозначения военных объектов Zuletzt bearbeitete Vorschläge: FR:Markers subject refinement Markers subject refinement Deprecate crossing=zebra in favor of crossing:markings Sensory Catenary mast details Tagging scheme for windmills and watermills Social facility=equine assisted centre High seas Culvert type Basic network (2021) Key:is sidepath Add languages: tags for name rendering Key:is sidepath:of Ele with units Shared green Key:cycleway:doorzone Addr:milestone Check dam Lounges 3 Railway:train protection Skatepark Sign:type=projecting;wrapped Public transport access space Access key Top-level information tag RededeÁgua RededeEsgoto Hiking water source Surcharges and Discounts Parking space=collection Flowlines Key:amusement arcade Vending=ski pass Golf:first cut Bore Tags for Volunteers Hitchhiking Natural=wadi Industrial tagging scheme complementing man made=works Role:request stop Laboratory:biosafety level Charging connectors Coat of arms Flood assets Changeset tags in osmChange file Key:tourism=camp lodging Highway crossing cleanup 