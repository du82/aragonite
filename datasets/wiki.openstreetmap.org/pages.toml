title = "About OpenStreetMap - OpenStreetMap Wiki"
full_description = '''About OpenStreetMap From OpenStreetMap Wiki Jump to navigation Jump to search Purge Help About - Other languages Afrikaans asturianu azərbaycanca Bahasa Indonesia Bahasa Melayu bosanski brezhoneg català čeština Crnogorski dansk Deutsch eesti English español Esperanto euskara français Frysk Gàidhlig galego hrvatski Ido interlingua íslenska italiano Kreyòl ayisyen kréyòl gwadloupéyen kurdî latviešu Lëtzebuergesch lietuvių magyar Nederlands norsk norsk nynorsk occitan polski português română sardu shqip slovenčina slovenščina srpski (latinica) suomi svenska Tagalog Tiếng Việt Türkçe Zazaki Ελληνικά беларуская български македонски монгол русский српски / srpski українська հայերեն עברית العربية سرائیکی فارسی پنجابی پښتو नेपाली मराठी हिन्दी বাংলা ਪੰਜਾਬੀ தமிழ் മലയാളം සිංහල ไทย မြန်မာဘာသာ 한국어 ქართული ⵜⴰⵎⴰⵣⵉⵖⵜ 中文（简体） 中文（繁體） 日本語 粵語 Other languages... Get help About OpenStreetMap Browsing How to contribute Contribute map data Editors Glossary Beginners' guide± OpenStreetMap is a free, editable map of the whole world that is being built by volunteers largely from scratch and released with an open-content license. The OpenStreetMap License allows free (or almost free) access to our map images and all of our underlying map data. The project aims to promote new and interesting uses of this data. See "Why OpenStreetMap?" for more details about why we want an open-content map and for the answer to the question we hear most frequently: Why not just use Google Maps? The Map Browsing our map is easy. Have a look around and see what you think of our coverage and detail. Over the years we've progressed quite spectacularly, achieving many mapping milestones. Individuals, governments and commercial companies have already begun putting this data to use, and in many countries, for many uses, OpenStreetMap is a viable alternative to other map providers. However, the map isn't finished yet. The world is a big place. How does your neighbourhood look on OSM? There are lots of other ways to start using OpenStreetMap too. Mapping This is not just an online project. We are getting out from behind our computer screens, and surveying towns and countryside to create our maps. This is very much a community mapping effort. We use wiki-style collaborative editing software to support this, which means that our maps will keep growing bigger and better. If you have a GPS unit you can contribute any tracks you have recorded. We are also able to derive maps from Bing aerial imagery or other mapping techniques. You can start editing our maps straight away using the online "iD" editor, or download the JOSM desktop application. Development Extensive software development work is taking this project in many different directions. As mentioned above, we have created various map editing tools. In fact OpenStreetMap is powered by open-source software from its slippy map interface to the underlying data access API (a web service interface for reading and writing map data). There is opportunity for subprojects that work with or use our data, but we also need help fixing bugs and adding features to our core components. Developers and translators are always welcome! Using OpenStreetMap data If you are looking for how to use OpenStreetMap data following topic will be of interest for you: leaflet - for showing OpenStreetMap-based maps and other data Overpass API + Overpass Turbo - extracting some limited OSM data from the database planet - obtaining all data from the database History of OpenStreetMap Main article: History of OpenStreetMap Steve Coast founded OpenStreetMap in 2004. On August 22nd 2006, the OpenStreetMap Foundation was established to encourage the growth, development and distribution of free geospatial data and provide geospatial data for anybody to use and share. The OpenStreetMap Foundation The OpenStreetMap Foundation is an organization that performs fund-raising. One major expense is acquiring and maintaining the servers that host the OpenStreetMap project. While the foundation supports the project, it does not control the project or "own" the OSM data. The foundation is dedicated to encouraging the growth, development and distribution of free geospatial data and to providing geospatial data for anyone to use and share. Retrieved from "https://wiki.openstreetmap.org/w/index.php?title=About_OpenStreetMap&oldid=2811646" Category: PortalsHidden category: Translate to Esperanto'''
year_published = 2025
clearnet = "https://wiki.openstreetmap.org/wiki/About_OpenStreetMap"
