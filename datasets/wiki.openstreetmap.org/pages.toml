full_description = '''Cs:Hlavní strana From OpenStreetMap Wiki (Redirected from Cs:Main Page) Jump to navigation Jump to search Purge Help Main Page - Other languages Afrikaans asturianu azərbaycanca Bahasa Indonesia Bahasa Melayu bosanski brezhoneg català čeština Crnogorski dansk Deutsch eesti English español Esperanto euskara français Frysk Gàidhlig galego hrvatski Ido interlingua íslenska italiano Kreyòl ayisyen kréyòl gwadloupéyen kurdî latviešu Lëtzebuergesch lietuvių magyar Nederlands norsk norsk nynorsk occitan polski português română sardu shqip slovenčina slovenščina srpski (latinica) suomi svenska Tagalog Tiếng Việt Türkçe Zazaki Ελληνικά беларуская български македонски монгол русский српски / srpski українська հայերեն עברית العربية سرائیکی فارسی پنجابی پښتو नेपाली मराठी हिन्दी বাংলা ਪੰਜਾਬੀ தமிழ் മലയാളം සිංහල ไทย မြန်မာဘာသာ 한국어 ქართული ⵜⴰⵎⴰⵣⵉⵖⵜ 中文（简体） 中文（繁體） 日本語 粵語 Other languages... Vítejte v OpenStreetMap, projektu zaměřeném na vytváření a šíření svobodných geografických dat celého světa. Projekt vznikl, protože použití většiny volně dostupných map má ve skutečnosti nějaká právní nebo technická omezení, což lidem brání v jejich používání kreativním, produktivním nebo neobvyklým způsobem. Co je OpenStreetMap? | Jak přispívat? | Kde hledat pomoc? Používejte OpenStreetMap Používání OpenStreetMap(en) Prohlížejte si naši mapu světa. Podívejte se na České mapové servery nebo na již hotové aplikace(en) či služby(en) postavené nad OpenStreetMap. …více o používání OpenStreetMap(en). Přispějte svobodnými mapovými daty Průvodce začátečníka Přečtěte si dokumentaci prvků mapy. Navštivte stránku o Česku a české komunitě. Přečtěte si o mapovacích projektech. Před mapováním budov si pročtěte průvodce. …více o mapování Vyvíjejte software Vyvíjejte a používejte platformu(en) Použijte OpenStreetMap ve vašem software. Přispějte k vývoji software OpenStreetMap. Novinky 2025 7. 1.2025-01-07–2025-01-08 Want to work on OpenStreetMap? Apply to be the OSM Core Software Development Facilitator! Applications will be accepted until January 21. 2024 20. 12.2024-12-20–2024-12-21 Sovereign Tech Fund invests €384k in OpenStreetMap. 19. 12.2024-12-19–2024-12-20 Meta has donated €178k to the OpenStreetMap Foundation to support community and core infrastructure. 17. 12.2024-12-17–2024-12-18 All services are back live after an outage – map away. :) 19. 10.2024-10-19–2024-10-20 If you are an OpenStreetMap Foundation member, you can attend the online 18th Annual General Meeting of the Foundation, where the results of the OSM Foundation's board election will be announced. 12. 10.2024-10-12–2024-10-13 Voting is open for the 2024 board election. Read about voting eligibility, instructions and common questions here. 9. 10.2024-10-09–2024-10-10 Learn about how OSM's infrastructure has been progressing with an update from OSM's Senior Site Reliability Engineer. 27. 9.2024-09-27–2024-09-28 You can now read the answers and the manifestos of the 2024 OSM Foundation's board election candidates. Discuss the answers on your local channels or on community.osm.org. 9. 8.2024-08-09–2024-08-10 OpenStreetMap's 20th birthday. See where birthday parties and meetings were held. 9. 8.2024-08-09–2024-08-10 Read OSM's founder Steve Coast's thoughts on the 20th birthday of OpenStreetMap. 18. 6.2024-06-18–2024-06-19 OpenStreetMap Foundation board member Sarah Hoffman participated in the United Nations' UN-Maps conference, hear more about how the UN uses OSM. 7. 6.2024-06-07–2024-06-08 See a progress update on vector tiles from the Engineering Working Group to learn more about this exciting improvement to openstreetmap.org. 21. 5.2024-05-21–2024-05-22 Read about what the OSM Foundation Board has been up to – highlights from the OSMF Board Spring 2024 Meeting. 17. 4.2024-04-17–2024-04-18 Learn about changes in authorizations with OAuth 1.0a and HTTP Basic Auth shutdown on OpenStreetMap.org. 11. 4.2024-04-11–2024-04-12 Join the OpenStreetMap Foundation! Here are three great reasons to join the OSM Foundation as a member. 4. 4.2024-04-04–2024-04-05 The academic track at the 2024 State of the Map conference has opened for submissions as well! Learn more about submitting your academic research. 20. 3.2024-03-20–2024-03-21 The call for participation in the 2024 State of the Map conference is open! Learn more about submitting an idea for a presentation. 12. 3.2024-03-12–2024-03-13 The OpenStreetMap Foundation Board looks ahead to 2024. 12. 3.2024-03-12–2024-03-13 Help us grow and diversify OSM Foundation membership worldwide! 14. 2.2024-02-14–2024-02-15 Welcome OpenStreetMap Belgium, the newest (and returning) OSMF Local Chapter. 13. 2.2024-02-13–2024-02-14 OpenStreetMap giving recap: Mappers, universities, companies, and nonprofits contributed over £373,000 to support OSM in 2023. 11. 2.2024-02-11–2024-02-12 2024: announcing the year of the OpenStreetMap vector maps. 5. 2.2024-02-05–2024-02-06 OpenStreetMap named as digital public good by United Nations-affiliated agency. 23. 1.2024-01-23–2024-01-24 Tom Hughes recognized for OpenStreetMap contributions on OpenUK’s 2024 Honours List. starší zprávy... See also Recently approved tags · Blog OpenStreetMap · TýdeníkOSM · OpenStreetMap na médiích Stav serverů (Stav wiki) Upcoming events (add) – Viz také: Past Events Event archive 2004-2020 1–2 březnaVirtual Mapping Party - Port Townsend, WAPort Townsend, Washington, United States2 března14th OSM Delhi Mapping Party (Online)Dwarka, Delhi, India4 březnaMapRoulette Monthly Community Meeting4 březnaOSM Utah Monthly Map NightSalt Lake City, Utah, United States4 březnaOpenStreetMap meetup in BrusselsMolenbeek-Saint-Jean - Sint-Jans-Molenbeek, Belgium4 březnaOSM Treffen SalzburgSalzburg, Salzburg, Austria4 březnaMissing Maps London: (Online) Mapathon [eng]4 březnaOnline-Diskussion OSM-Förderprogramm des FOSSGIS e.V.4 březnaSouth Bay Map NightSan Jose, California, United States5 březnaStuttgarter OpenStreetMap-TreffenStuttgart, Baden-Württemberg, Germany5 bře