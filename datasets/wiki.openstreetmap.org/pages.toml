alà fàcilment. Traduïu! I si voleu traduir més, aneu aquí Guia del Principiant Tots els recursos necessaris perquè els principiants s'endinsin en el món de l'OpenStreetMap. Creació de mapes Les eines per crear i editar els nostres mapes. Desenvolupament Recursos per als desenvolupadors d'aplicacions informàtiques. PMF Resposta a les preguntes més freqüents. Premsa Informació per a periodistes. Grup Catalunya Wiki del Grup d'usuaris d'OSM de Catalunya Grup Illes Balears Wiki del Grup d'usuaris d'OSM de les Illes Balears Upcoming events (add) – Vegeu també: Past Events Event archive 2004-2020 1–2 marçVirtual Mapping Party - Port Townsend, WAPort Townsend, Washington, United States2 març14th OSM Delhi Mapping Party (Online)Dwarka, Delhi, India4 marçMapRoulette Monthly Community Meeting4 marçOSM Utah Monthly Map NightSalt Lake City, Utah, United States4 marçOpenStreetMap meetup in BrusselsMolenbeek-Saint-Jean - Sint-Jans-Molenbeek, Belgium4 marçOSM Treffen SalzburgSalzburg, Salzburg, Austria4 marçMissing Maps London: (Online) Mapathon [eng]4 marçOnline-Diskussion OSM-Förderprogramm des FOSSGIS e.V.4 marçSouth Bay Map NightSan Jose, California, United States5 marçStuttgarter OpenStreetMap-TreffenStuttgart, Baden-Württemberg, Germany5 marçiD Community Chat5 marçKvartální OSM pivoBrno, Southeast, Czechia5 marçOSM Indoor Meetup5 marçMissing Maps - DRK & MSF Online Mapathon [deutsch]7 marçOSMF Engineering Working Group meeting7 marçRencontre Mapadour (Groupe local Pays Basque - Sud Landes)Anglet, Nouvelle-Aquitaine, France7 marçZagreb mapathon @ FERCity of Zagreb, Croatia7–9 marçStarke Frauen, Brot und Rosen - Community-Hackday im JuNo in MoersMoers, North Rhine-Westphalia, Germany9 març14th OSM Delhi Mapping PartyDwarka, Delhi, India9 marçOSMmapperCPHCopenhagen, Capital Region of Denmark, Denmark10 marçDécouverte d'OpenStreetMapGrenoble, Auvergne-Rhône-Alpes, France10 marçOpenStreetMap x Wikidata Taipei #74Chengnei, Taipei, Taiwan11 marçHamburger MappertreffenHamburg, Germa