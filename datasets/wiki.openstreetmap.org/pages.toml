full_description = '''Contributors From OpenStreetMap Wiki Jump to navigation Jump to search Purge Help Contributors - Other languages Afrikaans asturianu azərbaycanca Bahasa Indonesia Bahasa Melayu bosanski brezhoneg català čeština Crnogorski dansk Deutsch eesti English español Esperanto euskara français Frysk Gàidhlig galego hrvatski Ido interlingua íslenska italiano Kreyòl ayisyen kréyòl gwadloupéyen kurdî latviešu Lëtzebuergesch lietuvių magyar Nederlands norsk norsk nynorsk occitan polski português română sardu shqip slovenčina slovenščina srpski (latinica) suomi svenska Tagalog Tiếng Việt Türkçe Zazaki Ελληνικά беларуская български македонски монгол русский српски / srpski українська հայերեն עברית العربية سرائیکی فارسی پنجابی پښتو नेपाली मराठी हिन्दी বাংলা ਪੰਜਾਬੀ தமிழ் മലയാളം සිංහල ไทย မြန်မာဘာသာ 한국어 ქართული ⵜⴰⵎⴰⵣⵉⵖⵜ 中文（简体） 中文（繁體） 日本語 粵語 Other languages... There are many contributors to OpenStreetMap. There are more than ten million registered OpenStreetMap users. It is impossible to adequately acknowledge the many individuals who survey their neighbourhoods with GPS and notepad, or trace over licensed satellite imagery, to contribute the most complete, most current, most accurate data to OpenStreetMap. Also, some publishers (listed and attributed below) allow their data to be included in OpenStreetMap. If you are looking for how to attribute OSM, see Legal FAQ. Inclusion of data (including data derived from photos) in OpenStreetMap does not imply that the original data provider endorses OpenStreetMap, provides any warranty, or accepts any liability. Contents 1 Finding contributors 2 Contributor specific attribution and disclaimer 3 Global / Multiple countries 3.1 GADM (Global Administrative Areas) 3.2 HOT (Humanitarian OpenStreetMap Team) crisis mapping 3.3 EU Copernicus (GMES) data 3.4 Natural Earth 3.5 Global Land Ice Measurements from Space 3.6 World Food Programme Logistics Capacity Assessments 3.7 Strava Heatmap 3.8 OpenBenches.org 3.9 geoBoundaries from