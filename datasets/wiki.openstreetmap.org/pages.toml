title = "Changelog - OpenStreetMap Wiki"
full_description = '''Changelog From OpenStreetMap Wiki Jump to navigation Jump to search Purge Help Changelog - Other languages Afrikaans asturianu azərbaycanca Bahasa Indonesia Bahasa Melayu bosanski brezhoneg català čeština Crnogorski dansk Deutsch eesti English español Esperanto euskara français Frysk Gàidhlig galego hrvatski Ido interlingua íslenska italiano Kreyòl ayisyen kréyòl gwadloupéyen kurdî latviešu Lëtzebuergesch lietuvių magyar Nederlands norsk norsk nynorsk occitan polski português română sardu shqip slovenčina slovenščina srpski (latinica) suomi svenska Tagalog Tiếng Việt Türkçe Zazaki Ελληνικά беларуская български македонски монгол русский српски / srpski українська հայերեն עברית العربية سرائیکی فارسی پنجابی پښتو नेपाली मराठी हिन्दी বাংলা ਪੰਜਾਬੀ தமிழ் മലയാളം සිංහල ไทย မြန်မာဘာသာ 한국어 ქართული ⵜⴰⵎⴰⵣⵉⵖⵜ 中文（简体） 中文（繁體） 日本語 粵語 Other languages... This changelog documents developments in the tagging proposal process. For tags introduced by other mechanisms, see Status: de facto, Status: in use or search taginfo.If you would like to learn more about the process of adopting of new tags please read: How to invent tags, Any tags you like, Non-proposed features This page provides information about recent community approved changes in object tagging strategies, for the benefit of downstream OSM data users. It is advised to continue supporting older versions for some transition time. This page was introduced at the start of 2021; for earlier changes, please see the listing of approved proposals and deprecated features, or the categories for status "approved" or status "deprecated". Contents 1 2025 1.1 February 2 2024 2.1 November 2.2 October 2.3 July 2.4 June 2.5 May 2.6 March 2.7 February 2.8 January 3 2023 3.1 December 3.2 November 3.3 August 3.4 July 3.5 June 3.6 May 3.7 February 3.8 January 4 2022 4.1 December 4.2 November 4.3 October 4.4 September 4.5 July 4.6 June 4.7 April 4.8 February 4.9 January 5 2021 5.1 December 5.2 November 5.3 October 5.4 September 5.5 August 5.6 July 5.7 June 5.8 May 5.9 April 5.10 March 5.11 February 5.12 January 2025 February Added education=* — Proposal:Education_tag 2024 November Deprecated busway=lane – Deprecate busway=* for bus lanes in favour of lanes:bus=* and bus:lanes=*, respectively. busway:left=* busway:both=* busway:right=* busway=opposite – Deprecate busway=* for bus lanes in favour of oneway:bus=no busway=opposite_lane October Added sac_scale=strolling – Proposal:Add strolling to sac scale and some further refinements agroecology=* – Proposal:Agroecology July Added contact:sms=* – Proposal:Add ability to specify ordering-only phone number, sms-only phone numbers and related tags delivery:*=* drive_through:*=* takeaway:*=* June Deprecated cycleway=opposite – Deprecate cycleway=opposite family in favour of oneway:bicycle=no cycleway=opposite_lane cycleway=opposite_share_busway cycleway=opposite_track May Added open=* – Proposal:Key:opened= shop=tortilla – Proposal:Shop=tortilla March Added hairdresser=barber: A type of hairdresser that traditionally specialises in cutting masculine styles gtfs:(gtfs column):(feed suffix)=*: The general format to link to a GTFS object, further described in GTFS. community_adopted=*: Tagging for when an individual or organization takes volunteer responsibility for cleaning or minor maintenance of a facility. Deprecated All gtfs_*=* tags in favour of the corresponding gtfs:*=* tags. gtfs_id=*, gtfs:name=* because they don't correspond to a GTFS column. gtfs:feed=*, replaced by feed suffixes listed under List of GTFS feeds. February Added toilets:menstrual_products=*: Used to indicate if period products are available in a toilet January Added emergency=disaster_response: A station where equipment and volunteers/paid members are based to work in an area affected by a natural or anthropogenic disaster Deprecated amenity=emergency_service emergency_service=technical emergency=ses_station 2023 December Added crossing:continuous=*: Whether a path continues uninterrupted across a road amenity=bicycle_wash: A place designed for washing bicycles November Added historic=millstone: A large round stone used for grinding grain or other materials highway=cyclist_waiting_aid: Street furniture and devices for cyclists that are intended to make waiting at esp. traffic lights more comfortable footrest=* / handrest=*: To differentiate between different types of street furniture. side=*: To indicate the side of the way on which the waiting aid is located highway=ladder: Use for a ladder, a vertical or inclined set of steps or rungs intended for climbing or descending of a person with the help of hands August Added platform_lift=*: Indicates the availability of platform lift for wheelchair users platform_lift:portable=*: States if the platform lift is moveable or not ramp:portable=*: States if the ramp is portable or not platform_lift:seat=*: States if the platform lift has a foldable seat or not July Added playground=<values>: more values added, see Proposal line_arrangement=*: Consistently describe how lines bundles are arranged (vertical, horizontal, delta...) around a given support or way point June Added crossing:whistle=*: Handle North American level crossing quiet zones & wayside horns – Indicates whether a train normally blows its horn at the level crossing Deprecated maxspeed:seasonal:winter=*: replaced by maxspeed:conditional=* @ winter May Added man_made=charge_point: New feature to map individual charging devices at a amenity=charging_station location. kerb:approach_aid=*: approach aid of the public transport platform. announcement=*: Indicates whether there are announcements on a public transport platform. departures_board:speech_output=*: Indicates whether the departures board of a feature is capable of outputting it's contents as speech on demand. passenger_information_display:speech_output=*: Indicates whether a passenger information display is capable of outputting speech on demand. Changed amenity=charging_station: May represent one or a group of man_made=charge_point at a location. February Added emergency=fire_service_inlet: An inlet that allows the fire brigade pump water into a building fire_mains=(yes/no/wet/dry) fire_sprinkler=(yes/no/wet/dry/pre-action) fire_service_inlet=* emergency=water_rescue emergency=air_rescue_service Deprecated emergency=dry_riser_inlet: replaced by emergency=fire_service_inlet + fire_mains=dry emergency=sprinkler_connection: replaced by emergency=fire_service_inlet + fire_sprinkler=yes amenity=lifeboat_station: replaced by emergency=water_rescue emergency=lifeboat_station: replaced by emergency=water_rescue emergency=marine_rescue: replaced by emergency=water_rescue emergency_service=air: replaced by emergency=air_rescue_service January Deprecated industrial=gas: replaced by utility=gas street_cabinet=broadband: replaced by utility=telecom street_cabinet=gas: replaced by utility=gas street_cabinet=cable_tv: replaced by utility=television street_cabinet=communications: replaced by utility=telecom street_cabinet=power: replaced by utility=power street_cabinet=street_lighting: replaced by utility=street_lighting street_cabinet=telecom: replaced by utility=telecom street_cabinet=water: replaced by utility=water and utility=sewerage street_cabinet=water_management: replaced by utility=water and utility=sewerage 2022 December Added parking:left=* / parking:right=* / parking:both=*: New schema for street parking: describes the parking position in the street. parking:both:orientation=* / parking:left:orientation=* / parking:right:orientation=*: describes the parking orientation of parked vehicles. parking:both:access=* / parking:left:access=* / parking:right:access=*: describes general access of parking lanes. parking:both:fee=* / parking:left:fee=* / parking:right:fee=*: describes whether there is a fee to park along a street. parking:both:maxstay=* / parking:left:maxstay=* / parking:right:maxstay=*: describes whether there is a maximum time to stay for parking along a street. parking:both:restriction=* / parking:left:restriction=* / parking:right:restriction=*: describes parking restrictions like no stopping, no parking or loading zones. parking:both:zone=* / parking:left:zone=* / parking:right:zone=*: the letter or code of a residential parking zone. parking:both:markings=* / parking:left:markings=* / parking:right:markings=*: describes whether a parking lane is marked. parking:both:direction=* / parking:left:direction=* / parking:right:direction=*: describes special rules on parking direction (back-in- or head-in parking). parking:both:staggered=yes: specify staggered parking on narrow roads. parking=on_kerb / parking=half_on_kerb / parking=shoulder: New parking values in case street parking is mapped separately. Deprecated parking:lane=*: Replaced by new street parking schema. parking:condition=*: Replaced by new street parking schema. site_type=*: Replaced by archaeological_site=*. November Added pedagogy=*: Describes the pedagogical philosophy of an entity, especially schools and kindergartens. amenity=mailroom: A mailroom. model=* model:wikidata=* model:wikipedia=* Deprecated manufacturer:type=* vehicle:wikidata=* vehicle:wikipedia=* October Added payment:coins:denominations=* and payment:notes:denominations=*: Coins and notes accepted at a POI. September Added crossing:markings=*: Describes a style of markings on the ground where pedestrians cross a road. amenity=loading_dock: The entrance of a building used for loading and unloading goods vehicles. door:height=*: The height of a loading dock door. door:width=*: The width of a loading dock door. dock:height=*: The height of a loading dock platform. dock:width=*: The width of a loading dock platform. Deprecated door=loadingdock: replaced by amenity=loading_dock July Added pitch:net=*: Indicates whether a net is available at a sports pitch. amenity=library_dropoff: A place where library patrons can return or drop-off books other than the library itself. Deprecated net=*: replaced by pitch:net=* school=entrance: replaced by entrance=* June Added aeroway=aircraft_crossing: A point where the flow of traffic is impacted by crossing aircraft. crossing:aircraft=*: The relative position of the aircraft to ground traffic at a aeroway=aircraft_crossing. April Added artwork_subject=sheela-na-gig: Medieval to modern depiction of nude females exposing their genitals. February Added transformer=main: For main transformers mounted in substations. windings:auto=yes: to specify a given transformer is an auto-transformer boundary=forest: Describes a boundary of an administered forest area, which may encompass also non-wooded sections such as glades, screes, or ponds. boundary=forest_compartment: A compartment that is a referenced area completely within a boundary=forest. Changed transformer=distribution: Now only used for standalone transformers on top of power poles, when they're not in a wider substation. transformer=auxiliary: Now used for both standalone transformers on top of power poles as well as mounted in substation. Deprecated transformer=traction: replaced by transformer=main transformer=auto: replaced by windings:auto=yes boundary=forestry_compartment: replaced by boundary=forest_compartment January Added amenity=parcel_locker: electrical machines with lockers for picking-up parcels. parcel_pickup=yes/no: specifies whether you can pick up your parcels there. parcel_mail_in=yes/no/returns_only: specifies whether you can drop off your parcels there. refrigerated=yes: whether lockers are dedicated for receiving packages containing perishable goods and are refrigerated. defensive_works=*: for representing individual defensive structures mainly at historic/pre-modern fortifications. bicycle_rental=*: extends amenity=bicycle_rental tag, by providing information about the type of bicycle rental infrastructure. parking:condition:*:conditional=*: provides information about conditional restrictions for parking lane. parking:condition:*:maxstay=*: provides information about maximum allowed stay period for parking lane. parking:condition:*:reason=*: provides information about reason for a certain parking condition. Deprecated vending=parcel_pickup: replaced by amenity=parcel_locker + parcel_pickup=yes vending=parcel_mail_in: replaced by amenity=parcel_locker + parcel_mail_in=yes parking:condition:*:default=* parking:condition:*:time_interval=*: replaced by parking:condition:*:maxstay=* landuse=reservoir: replaced by natural=water + water=reservoir embassy=embassy: replaced by embassy=yes 2021 December Added inlet=*: describes how a culvert or pipeline inlet is shaped or protected. ref:EU:bwid=*: identifier of public bathing sites held in European Environment Agency (EEA) database. url:bathing_water=*: a URL to the objects government information website, as in the EEA's dataset. November Added outlet=*: marks a place where content of a closed duct (like a culvert, a tunnel or pipeline) is released. October Added natural=fumarole: an opening in a planet's crust found in volcanic areas and geothermal fields, which emits steam and gases. foraging=*: to specify permission for harvesting materials from plants or fungi, especially edible ones boundary=border_zone: to mark areas near country borders that have special restrictions on movement. historic=creamery: tag for historic creameries where dairy farmers brought their milk churns for the milk to be skimmed September Added club=cadet: location where various Youth Cadet groups meet cadet=*: type of cadet organization e.g. Police / Fire / Ambulance headlight=*: signifies requirement on some roads to always use one's headlights regardless of time of day. August Added cycle_barrier=*: structural design classification of bicycle barriers cycle_barrier:installation=*: information on whether a barrier can be removed or folded man_made=video_wall: a digital screen, typically constructed out of smaller LED panels. July Added man_made=survey_point: a triangulation pillar, geodetic vertex, or other piece of fixed equipment used by topographers. survey_point:structure=*: denotes the structure of a survey point. survey_point:purpose=horizontal/vertical/both: denotes the purpose of a survey point. survey_point:datum_aligned=yes/no: denotes whether a survey point is aligned to the local geodetic datum. building=fire_lookout: a building that is or was originally built to be a fire lookout. emergency=fire_lookout: to indicate that a feature (e.g. building or tower) is used for fire spotting. June Added man_made=stupa: a Buddhist dome-shaped structure with a spire on top originally built to contain relics. man_made=utility_pole: a pole used to support utility networks lines for telecom or power networks. Deprecated tower:type=stupa + man_made=tower: replaced by man_made=stupa communication=pole: replaced by man_made=utility_pole + utility=telecom telephone=pole: replaced by man_made=utility_pole + utility=telecom telecom=pole: replaced by man_made=utility_pole + uti'''
