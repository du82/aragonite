["https://wiki.osdev.org/Books"]
title = "Books - OSDev Wiki"
full_description = '''Books From OSDev Wiki Jump to navigation Jump to search Contents 1 Algorithms 2 Compiler Theory 3 Computer Architecture 3.1 Theory 3.2 Implementations 3.2.1 PC 4 Human-Computer Interaction 5 Networking 5.1 Theory 5.2 Implementations 5.2.1 AppleTalk 5.2.2 OSI 5.2.3 TCP/IP 6 Peripherals 6.1 Implementations 6.1.1 USB 7 Operating Systems 7.1 Theory 7.2 Implementations 8 Programming Languages 8.1 Theory 8.2 Implementations 8.2.1 C 9 Security 9.1 Cryptology 9.1.1 Cryptanalysis 9.1.2 Cryptography 10 Software Development 10.1 Theory 10.2 Practice 11 Theory of Computation 12 UNIX 13 See also Algorithms Algorithms Author(s): Sanjoy Dasgupta, Christos Papadimitriou, Umesh Vazirani Year: 2006 Supplementary material and/or errata: Penultimate draft, Errata, Link Official Description: This text, extensively class-tested over a decade at UC Berkeley and UC San Diego, explains the fundamentals of algorithms in a story line that makes the material enjoyable and easy to digest. Emphasis is placed on understanding the crisp mathematical idea behind each algorithm, in a manner that is intuitive and rigorous without being unduly formal. Features include: The use of boxes to strengthen the narrative: pieces that provide historical context, descriptions of how the algorithms are used in practice, and excursions for the mathematically sophisticated. Carefully chosen advanced topics which can be skipped in a standard one-semester course, but can be covered in an advanced algorithms course or in a more leisurely two-semester sequence. An accessible treatment of linear programming introduces students to one of the greatest achievements in algorithms. An optional chapter on the quantum algorithm for factoring provides an unique peephole into this exciting topic. Review: Algorithms and Data Structures Author(s): Niklaus Wirth Year: 1985 Supplementary material and/or errata: Oberon Version 2004 Official Description: The classical textbook on algorithms and data structures. Citing the amazon review of "oversteer": The book goes over practically important algorithms and data structures. It may not include the latest and greatest advances, but it is still very relevant in today's practical applications. To me, the highest value of the book is not the particular methods explained, but the good style and the way of thinking about programs that the book teaches. There are very few books that can actually teach good style, and this is probably one of the best. This book is a must read for anyone wishing to become a great programmer, not merely an average one. Review: Wikipedia Algorithms, 4th ed. Author(s): Kevin Wayne, and Robert Sedgewick Year: 2011 Supplementary material and/or errata: Link Official Description: The textbook Algorithms, 4th Edition by Robert Sedgewick and Kevin Wayne [ Amazon · Pearson · InformIT ] surveys the most important algorithms and data structures in use today. The textbook is organized into six chapters: Chapter 1: Fundamentals introduces a scientific and engineering basis for comparing algorithms and making predictions. It also includes our programming model. Chapter 2: Sorting considers several classic sorting algorithms, including insertion sort, mergesort, and quicksort. It also includes a binary heap implementation of a priority queue. Chapter 3: Searching describes several classic symbol table implementations, including binary search trees, red-black trees, and hash tables. Chapter 4: Graphs surveys the most important graph processing problems, including depth-first search, breadth-first search, minimum spanning trees, and shortest paths. Chapter 5: Strings investigates specialized algorithms for string processing, including radix sorting, substring search, tries, regular expressions, and data compression. Chapter 6: Context highlights connections to systems programming, scientific computing, commercial applications, operations research, and intractability. Applications to science, engineering, and industry are a key feature of the text. We motivate each algorithm that we address by examining its impact on specific applications. Review: The Art of Computer Programming Author(s): Donald E. Knuth Year: 2011 Supplementary material and/or errata: Link Official Description: At the end of 1999, these books were named among the best twelve physical-science monographs of the century by American Scientist , along with: Dirac on quantum mechanics, Einstein on relativity, Mandelbrot on fractals, Pauling on the chemical bond, Russell and Whitehead on foundations of mathematics, von Neumann and Morgenstern on game theory, Wiener on cybernetics, Woodward and Hoffmann on orbital symmetry, Feynman on quantum electrodynamics, Smith on the search for structure, and Einstein's collected papers. Wow! Review: Introduction to Algorithms, 3rd ed. Author(s): Thomas H. Cormen, Charles E. Leiserson, Ronald L Rivest, Clifford Stein Year: 2009 Supplementary material and/or errata: Link Official Description: Some books on algorithms are rigorous but incomplete; others cover masses of material but lack rigor. Introduction to Algorithms uniquely combines rigor and comprehensiveness. The book covers a broad range of algorithms in depth, yet makes their design and analysis accessible to all levels of readers. Each chapter is relatively self-contained and can be used as a unit of study. The algorithms are described in English and in a pseudocode designed to be readable by anyone who has done a little programming. The explanations have been kept elementary without sacrificing depth of coverage or mathematical rigor. The first edition became a widely used text in universities worldwide as well as the standard reference for professionals. The second edition featured new chapters on the role of algorithms, probabilistic analysis and randomized algorithms, and linear programming. The third edition has been revised and updated throughout. It includes two completely new chapters, on van Emde Boas trees and multithreaded algorithms, and substantial additions to the chapter on recurrences (now called "Divide-and-Conquer"). It features improved treatment of dynamic programming and greedy algorithms and a new notion of edge-based flow in the material on flow networks. Many new exercises and problems have been added for this edition. As of the third edition, this textbook is published exclusively by the MIT Press. Review: Compiler Theory Assemblers and Loaders Author(s): David Salomon Year: 1993 Supplementary material and/or errata: Freely available Official Description: Written during 1985--1992, the book developed from class notes on computer organization. It includes numerous exercises with answers provided, and review questions following each chapter. The book is bound as a paperback with a colorful cover. Review: Compilers: Principles, Techniques, & Tools Author(s): Alfred V. Aho, Monica S. Lam, Ravi Sethi, and Jeffrey D. Ullman Year: 2006 Supplementary material and/or errata: Link Official Description: Compilers: Principles, Techniques and Tools, known to professors, students, and developers worldwide as the "Dragon Book," is available in a new edition. Every chapter has been completely revised to reflect developments in software engineering, programming languages, and computer architecture that have occurred since 1986, when the last edition published. The authors, recognizing that few readers will ever go on to construct a compiler, retain their focus on the broader set of problems faced in software design and software development. New chapters include: Chapter 10 Instruction-Level Parallelism Chapter 11 Optimizing for Parallelism and Locality Chapter 12 Interprocedural Analysis Review: Linkers and Loaders Author(s): John R. Levine Year: 1999 Supplementary material and/or errata: Free manuscript, Errata and code Official Description: Whatever your programming language, whatever your platform, you probably tap into linker and loader functions all the time. But do you know how to use them to their greatest possible advantage? Only now, with the publication of Linkers and Loaders, is there an authoritative book devoted entirely to these deep-seated compile-time and run-time processes. The book begins with a detailed and comparative account of linking and loading that illustrates the differences among various compilers and operating systems. On top of this foundation, the author presents clear practical advice to help you create faster, cleaner code. You'll learn to avoid the pitfalls associated with Windows DLLs, take advantage of the space-saving, performance-improving techniques supported by many modern linkers, make the best use of the UNIX ELF library scheme, and much more. If you're serious about programming, you'll devour this unique guide to one of the field's least understood topics. Linkers & Loaders is also an ideal supplementary text for compiler and operating systems courses. Features Includes a linker construction project written in Perl, with project files available for download. Covers dynamic linking in Windows, UNIX, Linux, BeOS, and other operating systems. Explains the Java linking model and how it figures in network applets and extensible Java code. Helps you write more elegant and effective code, and build applications that compile, load, and run more efficiently. Review: Excellently written and easy to read, yet thorough and informative. It has just enough whimsy to make what most readers find a dry topic entertaining. While the current edition is now somewhat dated, it covers the majority of what one needs to understand how both linkage editors and program loaders work. - User:Schol-r-lea Computer Architecture Theory Computer Architecture: A Quantitative Approach, 5th ed. Author(s): John L. Hennessy, and David A. Patterson Year: 2011 Supplementary material and/or errata: Link Official Description: The computing world today is in the middle of a revolution: mobile clients and cloud computing have emerged as the dominant paradigms driving programming and hardware innovation today. The Fifth Edition of Computer Architecture focuses on this dramatic shift, exploring the ways in which software and technology in the cloud are accessed by cell phones, tablets, laptops, and other mobile computing devices. Each chapter includes two real-world examples, one mobile and one datacenter, to illustrate this revolutionary change. Review: Computer Systems: A Programmer's Perspective, 2nd ed. Author(s): Randal E. Bryant, and David R. O'Hallaron Year: 2010 Supplementary material and/or errata: Manuscript, Web asides, errata, Link, Blog Official Description: This book (CS:APP2e) is the second edition of a book that stems from the introductory computer systems course we developed at Carnegie Mellon University, starting in the Fall of 1998, called "Introduction to Computer Systems" (ICS). The presentation is based on the following principles, which aim to help the students become better programmers and to help prepare them for upper-level systems courses: Students should be introduced to computer systems from the perspective of a programmer, rather from the more traditional perspective of a system implementer. What does this mean? Students should get a view of the complete system, comprising the hardware, operating system, compiler, and network. Students learn best by developing and evaluating real programs that run on real machines. We cover data representations, machine level representations of C programs, processor architecture, program optimizations, the memory hierarchy, linking, exceptional control flow (exceptions, interrupts, processes, and Unix signals), virtual memory and memory management, system-level I/O, basic network programming, and concurrent programming. These concepts are supported by series of fun and hands-on lab assignments. See the manuscript Preface for more details. Review: Structured Computer Organization, 6th ed. Author(s): Andrew S. Tanenbaum, and Todd Austin Year: 2012 Supplementary material and/or errata: Link Official Description: Structured Computer Organization, specifically written for undergraduate students, is a best-selling guide that provides an accessible introduction to computer hardware and architecture. This text will also serve as a useful resource for all computer professionals and engineers who need an overview or introduction to computer architecture. This book takes a modern structured, layered approach to understanding computer systems. It's highly accessible - and it's been thoroughly updated to reflect today's most critical new technologies and the latest developments in computer organization and architecture. Tanenbaum’s renowned writing style and painstaking research make this one of the most accessible and accurate books available, maintaining the author’s popular method of presenting a computer as a series of layers, each one built upon the ones below it, and understandable as a separate entity. Review: Implementations PC The Indispensable PC Hardware Book, 4th ed. Author(s): Hans-Peter Messmer Year: 2001 Supplementary material and/or errata: N/A Official Description: This fully revised and popular book is now up-to-date and even more comprehensive than before. The Indispensable PC Hardware Book 4/e will be 'indispensable' to anyone who wants to know more about the inner workings of a personal computer: from programmers who want access to hardware components; professionals and home-users who wants to or has to understand the structure and functioning of a personal computer; to users who want to up-grade their PC's, and dealers who wish to advise their customers--this book will provide the solution to all your hardware questions. Even beginners should not shy away as this book begins with an easy introduction to the subject area. Key highlights: CPU's from the 8086/8088 to the Pentium III and Athlon Real, protected and virtual models Windows and plug&play devices CPU Clones from all major manufacturers Chipsets and support chips Timers, interrupts and DMA I/O programming and PCI bus programming AGP variants and graphic systems Universal serial bus Local storage from the diskette to DVD Memory systems, SDRAM, EDO, flas, RAM bus, and modules Extensive glossary which explains most of the terms and concepts related to personal computer hardware. Appendices brimming with practical advice, especially for programmers. Review: The Undocumented PC, 2nd ed. Author(s): Frank van Gilluwe Year: 1996 Supplementary material and/or errata: N/A Official Description: The Undocumented PC is your technical guide into the inner workings of the PC. At over 1100 pages, The Undocumented PC is the standard that programmers around the world rely on to create powerful programs and to better understand all areas of the PC. Get the competitive advantage of knowing how to utilize and connect to PC firmware and hardware. Review: Human-Computer Interaction Networking Theory Computer Networks, 5th ed. Author(s): Andrew S. Tanenbaum,'''
