["https://wiki.osdev.org/COFF"]
title = "COFF - OSDev Wiki"
full_description = '''COFF From OSDev Wiki Jump to navigation Jump to search COFF stands for Common Object File Format. It is a file format used for storing compiled code, such as that outputted by a compiler or a linker. Like most compiler file formats, COFF defines structures within the file for storing information about the sections of the program, such as .text and .data, and about the symbols that the program declares or defines. COFF can be used to store individual functions or symbols, fragments of programs, libraries or entire executables. The Microsoft PE Executable format (strictly PE/COFF) contains a version of COFF. Whilst COFF is still around today, it is regarded as being overly complicated and in many cases its use has been replaced by ELF or other executable file formats. Contents 1 Microsoft PE/COFF 2 File Format 2.1 File Header 2.2 Optional Header 2.3 Section Header 2.4 Relocation Entries 2.5 Line Number Entries 2.6 Symbol Table 2.7 String Table 3 Example 4 See Also 4.1 External Links Microsoft PE/COFF Main article: PE Most Microsoft EXE and DLL files use a file format that is based on COFF. Microsoft's Portable Executable (PE/COFF) standard is largely compatible with the COFF specification with a few notable exceptions. Firstly, the COFF File Header is not placed at the beginning of the file if the file is an image (executable) file. In brief, a PE/COFF Image contains a pointer at offset 0x3C which points to the PE header. The COFF File Header immediately follows this PE signature. More information can be found in the PE article. Secondly, the PE/COFF format also changes some of the COFF magic values (including the File Header one) and assigns them special meanings. More information can be found in the "Microsoft Portable Executable and Common Object File Format Specification" document. File Format COFF files contain a number of different tables, as well as areas of data that are referenced by the tables. Structure Purpose Location Length File Header Stores the basic information about the file as well as pointers to the other structures. At the beginning of the file, except in Microsoft PE/COFF Image files (see above). Fixed structure length. Optional Header Stores additional information about the execution of the file. Only present if indicated by the File Header. Immediately follows the File Header. Specified in the File Header Section Header Stores information about the different sections defined in the file. Immediately following the Optional Header. If no Optional Header is provided, immediately follows the File Header. Calculated by the number of sections (specified in the File Header) multiplied by the fixed structure length. Section Relocation Table Allows the file to be relocated to any area of memory by providing information on which addresses need to be changed. At most one table exists for each Section. Location is indicated by the corresponding Section Header. Calculated by the number of relocation entries (specified in the Section header) multiplied by the fixed structure length. Section Line Number Table Provides debugging information to map code addresses to source file line numbers. At most one table exists for each Section. Location is indicated by the corresponding Section Header. Calculated by the number of line number entries (specified in the Section header) multiplied by the fixed structure length. Symbol Table Stores information on each symbol defined or declared by the code. Indicated to a pointer in the File Header. Calculated by the number of symbols (specified in the File Header) multiplied by the fixed structure length. String Table Stores any Section or Symbol names that are longer than eight characters. Immediately following the Symbol table. Indicated by the first 32 bits of the string table, evaluated as a long Most COFF files contain additional space between the end of the Section table and the start of the Symbol table which stores the data for the sections themselves, although the location of this data relative to the Symbol (and String) table does not seem to be specified by the standard. File Header The file header exists at the beginning of a COFF file (except in Microsoft PE/COFF Image files as noted above). It contains a magic number field and other general information about the File. The structure of this header can be found in filehdr.h, and is 20 bytes longs. { unsigned short f_magic; /* Magic number */ unsigned short f_nscns; /* Number of Sections */ long f_timdat; /* Time & date stamp */ long f_symptr; /* File pointer to Symbol Table */ long f_nsyms; /* Number of Symbols */ unsigned short f_opthdr; /* sizeof(Optional Header) */ unsigned short f_flags; /* Flags */ } The magic number varies from implementation to implementation, for example, DJGPP generates COFF files with the value 0x14C in this field. The number of sections indicates how many section structures should be expected in the Section table. The time and date stamp indicate when the COFF file was created. This field is of the type time_t, being the number of seconds since epoch ( 1970-01-01 00:00:00 GMT ). The Symbol table pointer indicates the offset within the file where the Symbol table begins. The number of symbols indicate how many (fixed length) symbol structures are in the symbol table. This value coupled with the Symbol table pointer allow you to calculate where the String table starts. The flags field usually indicates the state of the file. Usually this is used to quickly lookup information that could be calculated from the rest of the file. For example, one bit of this field indicates if relocation information has been removed from the file, another bit indicates if all the external symbols have been resolved, etc. Optional Header The Optional header provides run-time information about the file and therefore is only present in executable COFF files. This header is only present in the file if the File header field f_opthdr is non-zero and, if present, immediately follows the File header. The structure of this header can be found in aouthdr.h, and is 28 bytes long. { unsigned short magic; /* Magic Number */ unsigned short vstamp; /* Version stamp */ unsigned long tsize; /* Text size in bytes */ unsigned long dsize; /* Initialised data size */ unsigned long bsize; /* Uninitialised data size */ unsigned long entry; /* Entry point */ unsigned long text_start; /* Base of Text used for this file */ unsigned long data_start; /* Base of Data used for this file */ } Section Header The Section table provides information about the individual section contained within the file. The Section table is an array of Section header structures. It immediately follows the Optional header (or File header if no Optional header exists) and its length in Section header structures is given by the f_nscns field in the File header. Unlike most other tables, the Section table is 1-based, meaning that the first Section is referred to as Section 1 instead of Section 0. This is done because in the Symbol table, a Section number of 0 has a special meaning. The structure of this header can be found in scnhdr.h, and is 40 bytes long. { char s_name[8]; /* Section Name */ long s_paddr; /* Physical Address */ long s_vaddr; /* Virtual Address */ long s_size; /* Section Size in Bytes */ long s_scnptr; /* File offset to the Section data */ long s_relptr; /* File offset to the Relocation table for this Section */ long s_lnnoptr; /* File offset to the Line Number table for this Section */ unsigned short s_nreloc; /* Number of Relocation table entries */ unsigned short s_nlnno; /* Number of Line Number table entries */ long s_flags; /* Flags for this section */ } The section name field stores the name of this section padded with NULL bytes if it is eight characters or fewer; otherwise, this field contains either a pointer into the String Table, or a special name that starts with `/` and is followed by the decimal digits representing the offset within the String Table where the section name may be found. See the entry on the String Table below. The Physical address field stores the memory start address for this file. If the file has been linked so that this section is to be loaded to a specific location in memory, this field will have been set to that value. The Virtual address field is equivalent to the Physical address field for the Virtual memory space. However, in almost all instances, these two fields contain the same value. The s_size field contains the Section size in bytes. The Section pointer field contains the file offset where the raw data for this section begins. This, coupled with the Section size, can be used to load the section data. If this is a BSS Section (indicated in the Section's Flags field), the section may well have a size, but a Section pointer of zero. The s_relptr indicates the file offset for the Relocation information for this Section. The number of entries in the Relocation table is given in the s_nreloc field. If the s_nreloc field is zero, the section does not contain any Relocation information. Like the Relocation pointer, the s_lnnoptr field indicates the file offset to the Line number table for the section, whose length in entries is given in the s_nlnno field. As with the s_nreloc, if the s_nlnno is zero then the Section contains no Line number information. The Flags field gives important information on how the Section should be handled when being processed. The most important flag values relate to the type of field as follows: Value Define Meaning if set 0x0020 STYP_TEXT The section contains executable code. 0x0040 STYP_DATA The section contains initialised data. 0x0080 STYP_BSS The COFF file contains no data for this section, but needs space to be allocated for it. Relocation Entries Using Relocation entries, it is possible to load a section of code into an arbitrary memory address and then modify the code so that the memory addresses for Symbols are correct. This means you can take a COFF file, load the .text section of the file into one place, the .data section into another, the .bss section somewhere else again, and then update the .text section so that the code is able to find its values and function correctly. The Relocation Table is an array of Relocation Entry structures and is zero based. A COFF file can contain a Relocation table for each Section. .text ( STYP_TEXT ) sections often have relocation information, it is also possible for .data ( STYP_DATA ) and other sections to have relocation information. The Relocation table for a section has its location and length stored in the Section's header. The structure of this header can be found in reloc.h, and is 10 bytes long. { long r_vaddr; /* Reference Address */ long r_symndx; /* Symbol index */ unsigned short r_type; /* Type of relocation */ } The Address field gives the offset within the Section's raw data where the address starts. The reference will almost always be a 32-bit value starting at the given address, but this is dependant on implementation and the r_type field. The Symbol index gives the (zero based) index in the Symbol table to which the reference refers. Once you have loaded the COFF file into memory and know where each symbol is, you find the new updated address for the given symbol and update the reference accordingly. The r_type indicates how the address should be updated. It is, unfortunately, implementation specific. For an example, DJGPP can indicate that this be the 32-bit absolute address of the symbol (type 6), or it can specify a 32-bit address that is relative to the location of the reference (type 20). Line Number Entries Line number entries are used by debugging programs to relate symbols and physical instruction addresses to source file line numbers. The Line Number table is an array of Line Number Entry structures and is zero based. A COFF file can contain a Line number table for each Section, but it would be unusual to find line number information for anything other than .text ( STYP_TEXT ) Sections. Like the Relocation table, the Line Number table for a section has its location and length stored in the Section's header. The structure of this header can be found in linenum.h, and is 6 bytes long. { union { long l_symndx; /* Symbol Index */ long l_paddr; /* Physical Address */ } l_addr; unsigned short l_lnno; /* Line Number */ } In brief, The line number table will contain an entry with a line number of zero in which the l_symndx field will indicate the function name Symbol in the Symbol table. This entry will be followed by additional entries with incrementing line numbers which indicate, through the l_paddr field, the byte offset into the section where this line starts. Given this, an exception that occurs during processing of the COFF file can be traced back to a function and a line number within that function. Symbol Table The Symbol Table contains information on each symbol that is declared or defined by this file. There will be symbols in this table for each function name, for each global variable, for each static variable, for each variable defined as extern, etc. There are even symbols in this table that indicate the start of each section and further information about the file as a whole. The Symbol table is an array of Symbol Entry structures and is zero based. The Symbol table location is given in the File Header f_symptr field, and its length in entries is given in the File Header f_nsyms field. The structure of this header can be found in syms.h, and is 18 bytes long. { char n_name[8]; /* Symbol Name */ long n_value; /* Value of Symbol */ short n_scnum; /* Section Number */ unsigned short n_type; /* Symbol Type */ char n_sclass; /* Storage Class */ char n_numaux; /* Auxiliary Count */ } The Symbol name field stores the name of this symbol if it is eight characters or fewer, otherwise this field contains a pointer into the String table. See the entry on the String table below. Each symbol in the Symbol table can be followed by zero or more Auxiliary entries which provide further information about the symbol. Each of these entries is the same length as the Symbol table entry, but has a different structure depending on the parent Symbol. The Section number field n_scnum indicates the Section to which this Symbol belongs. If this value is greater than zero, it refers to a Section in the Section table (hence why the Section table is one-based). I can also take one of the following special values: n_scnum Value Meaning N_DEBUG (2) A debugging symbol. In the example below, information about the file has been put into a symbol like this. N_ABS (1) An absolute symbol. This means that the value of the n_value field is an absolute value. N_UNDEF (0) An undefined external symbol The n_value, n_scnum and n_sclass fields in the table need to be considered together because they are interlinked. A number of the more common combinations of these fields is given in the following table. (Much of the information in the followin'''
