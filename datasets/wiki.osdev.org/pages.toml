["https://wiki.osdev.org/AHCI"]
title = "AHCI - OSDev Wiki"
full_description = '''AHCI From OSDev Wiki Jump to navigation Jump to search The specification: https://www.intel.com/content/dam/www/public/us/en/documents/technical-specifications/serial-ata-ahci-spec-rev1-3-1.pdf Contents 1 Introduction 2 SATA basic 3 Find an AHCI controller 3.1 Determining what mode the controller is in 4 AHCI Registers and Memory Structures 5 Detect attached SATA devices 6 AHCI port memory space initialization 7 AHCI & ATAPI 8 Example - Read hard disk sectors 9 Checklist 9.1 Initialisation 9.2 Start read/write command 9.3 IRQ handler 10 External Links Introduction AHCI (Advance Host Controller Interface) is developed by Intel to facilitate handling SATA devices. The AHCI specification emphasizes that an AHCI controller (referred to as host bus adapter, or HBA) is designed to be a data movement engine between system memory and SATA devices. It encapsulates SATA devices and provides a standard PCI interface to the host. System designers can easily access SATA drives using system memory and memory mapped registers, without the need for manipulating the annoying task files as IDE do. An AHCI controller may support up to 32 ports which can attach different SATA devices such as disk drives, port multipliers, or an enclosure management bridge. AHCI supports all native SATA features such as command queueing, hot plugging, power management, etc. To a software developer, an AHCI controller is just a PCI device with bus master capability. AHCI is a new standard compared to IDE, which has been around for twenty years. There exists little documentation about its programming tips and tricks. Possibly the only available resource is the Intel AHCI specification (see External Links) and some open source operating systems such as Linux. This article shows the minimal steps an OS (not BIOS) should do to put AHCI controller into a workable state, how to identify drives attached, and how to read physical sectors from a SATA disk. To keep concise, many technical details and deep explanations of some data structures have been omitted. It should be noted that IDE also supports SATA devices and there are still debates about which one, IDE or AHCI, is better. Some tests even show that a SATA disk acts better in IDE mode than AHCI mode. But the common idea is that AHCI performs better and will be the standard PC to SATA interface, though some driver software should be enhanced to fully cultivate AHCI capability. All the diagrams in this article are copied from the Intel AHCI specification 1.3. SATA basic There are at least two SATA standards maintained respectively by T13 and SATA-IO. The SATA-IO focuses on serial ATA and T13 encompasses traditional parallel ATA specifications as well. While the hardware specifications for IDE and SATA (and even between different devices implementing them) differ greatly, the API and ABI are very similar. To a software developer, the biggest difference between SATA and parallel ATA is that SATA uses FIS (Frame Information Structure) packet to transport data between host and device. An FIS can be viewed as a data set of traditional task files, or an encapsulation of ATA commands. SATA uses the same command set as parallel ATA. 1) FIS types Following code defines different kinds of FIS specified in Serial ATA Revision 3.0. typedef enum { FIS_TYPE_REG_H2D = 0x27, // Register FIS - host to device FIS_TYPE_REG_D2H = 0x34, // Register FIS - device to host FIS_TYPE_DMA_ACT = 0x39, // DMA activate FIS - device to host FIS_TYPE_DMA_SETUP = 0x41, // DMA setup FIS - bidirectional FIS_TYPE_DATA = 0x46, // Data FIS - bidirectional FIS_TYPE_BIST = 0x58, // BIST activate FIS - bidirectional FIS_TYPE_PIO_SETUP = 0x5F, // PIO setup FIS - device to host FIS_TYPE_DEV_BITS = 0xA1, // Set device bits FIS - device to host } FIS_TYPE; 2) Register FIS – Host to Device A host to device register FIS is used by the host to send command or control to a device. As illustrated in the following data structure, it contains the IDE registers such as command, LBA, device, feature, count and control. An ATA command is constructed in this structure and issued to the device. All reserved fields in an FIS should be cleared to zero. typedef struct tagFIS_REG_H2D { // DWORD 0 uint8_t fis_type; // FIS_TYPE_REG_H2D uint8_t pmport:4; // Port multiplier uint8_t rsv0:3; // Reserved uint8_t c:1; // 1: Command, 0: Control uint8_t command; // Command register uint8_t featurel; // Feature register, 7:0 // DWORD 1 uint8_t lba0; // LBA low register, 7:0 uint8_t lba1; // LBA mid register, 15:8 uint8_t lba2; // LBA high register, 23:16 uint8_t device; // Device register // DWORD 2 uint8_t lba3; // LBA register, 31:24 uint8_t lba4; // LBA register, 39:32 uint8_t lba5; // LBA register, 47:40 uint8_t featureh; // Feature register, 15:8 // DWORD 3 uint8_t countl; // Count register, 7:0 uint8_t counth; // Count register, 15:8 uint8_t icc; // Isochronous command completion uint8_t control; // Control register // DWORD 4 uint8_t rsv1[4]; // Reserved } FIS_REG_H2D; 3) Register FIS – Device to Host A device to host register FIS is used by the device to notify the host that some ATA register has changed. It contains the updated task files such as status, error and other registers. typedef struct tagFIS_REG_D2H { // DWORD 0 uint8_t fis_type; // FIS_TYPE_REG_D2H uint8_t pmport:4; // Port multiplier uint8_t rsv0:2; // Reserved uint8_t i:1; // Interrupt bit uint8_t rsv1:1; // Reserved uint8_t status; // Status register uint8_t error; // Error register // DWORD 1 uint8_t lba0; // LBA low register, 7:0 uint8_t lba1; // LBA mid register, 15:8 uint8_t lba2; // LBA high register, 23:16 uint8_t device; // Device register // DWORD 2 uint8_t lba3; // LBA register, 31:24 uint8_t lba4; // LBA register, 39:32 uint8_t lba5; // LBA register, 47:40 uint8_t rsv2; // Reserved // DWORD 3 uint8_t countl; // Count register, 7:0 uint8_t counth; // Count register, 15:8 uint8_t rsv3[2]; // Reserved // DWORD 4 uint8_t rsv4[4]; // Reserved } FIS_REG_D2H; 4) Data FIS – Bidirectional This FIS is used by the host or device to send data payload. The data size can be varied. typedef struct tagFIS_DATA { // DWORD 0 uint8_t fis_type; // FIS_TYPE_DATA uint8_t pmport:4; // Port multiplier uint8_t rsv0:4; // Reserved uint8_t rsv1[2]; // Reserved // DWORD 1 ~ N uint32_t data[1]; // Payload } FIS_DATA; 5) PIO Setup – Device to Host This FIS is used by the device to tell the host that it’s about to send or ready to receive a PIO data payload. typedef struct tagFIS_PIO_SETUP { // DWORD 0 uint8_t fis_type; // FIS_TYPE_PIO_SETUP uint8_t pmport:4; // Port multiplier uint8_t rsv0:1; // Reserved uint8_t d:1; // Data transfer direction, 1 - device to host uint8_t i:1; // Interrupt bit uint8_t rsv1:1; uint8_t status; // Status register uint8_t error; // Error register // DWORD 1 uint8_t lba0; // LBA low register, 7:0 uint8_t lba1; // LBA mid register, 15:8 uint8_t lba2; // LBA high register, 23:16 uint8_t device; // Device register // DWORD 2 uint8_t lba3; // LBA register, 31:24 uint8_t lba4; // LBA register, 39:32 uint8_t lba5; // LBA register, 47:40 uint8_t rsv2; // Reserved // DWORD 3 uint8_t countl; // Count register, 7:0 uint8_t counth; // Count register, 15:8 uint8_t rsv3; // Reserved uint8_t e_status; // New value of status register // DWORD 4 uint16_t tc; // Transfer count uint8_t rsv4[2]; // Reserved } FIS_PIO_SETUP; 6) DMA Setup – Device to Host typedef struct tagFIS_DMA_SETUP { // DWORD 0 uint8_t fis_type; // FIS_TYPE_DMA_SETUP uint8_t pmport:4; // Port multiplier uint8_t rsv0:1; // Reserved uint8_t d:1; // Data transfer direction, 1 - device to host uint8_t i:1; // Interrupt bit uint8_t a:1; // Auto-activate. Specifies if DMA Activate FIS is needed uint8_t rsved[2]; // Reserved //DWORD 1&2 uint64_t DMAbufferID; // DMA Buffer Identifier. Used to Identify DMA buffer in host memory. // SATA Spec says host specific and not in Spec. Trying AHCI spec might work. //DWORD 3 uint32_t rsvd; //More reserved //DWORD 4 uint32_t DMAbufOffset; //Byte offset into buffer. First 2 bits must be 0 //DWORD 5 uint32_t TransferCount; //Number of bytes to transfer. Bit 0 must be 0 //DWORD 6 uint32_t resvd; //Reserved } FIS_DMA_SETUP; 7) Example This example illustrates the steps to read the Identify data from a device. Error detection and recovery is ignored. To issue an ATA Identify command to the device, the FIS is constructed at follows. FIS_REG_H2D fis; memset(&fis, 0, sizeof(FIS_REG_H2D)); fis.fis_type = FIS_TYPE_REG_H2D; fis.command = ATA_CMD_IDENTIFY; // 0xEC fis.device = 0; // Master device fis.c = 1; // Write command register After the device receives this FIS and successfully read the 256 words data into its internal buffer, it sends a PIO Setup FIS – Device to Host to tell the host that it’s ready to transfer data and the data size (FIS_PIO_SETUP.tc). After the PIO Setup FIS – Device to Host has been sent correctly, the device sends a DATA FIS to the host which contains the received data payload (FIS_DATA.data). This scenario is described in SATA revision 3.0 as a PIO data-in command protocol. But an AHCI controller will do the latter two steps for the host. The host software needs only setup and issue the command FIS, and tells the AHCI controller the memory address and size to store the received data. After everything is done, the AHCI controller will issue an interrupt (if enabled) to notify the host to check the data. Find an AHCI controller An AHCI controller can be found by enumerating the PCI bus. It has a class id 0x01 (mass storage device) and normally a subclass id 0x06 (serial ATA, but can be IDE Interface 0x01). The vendor id and device id should also be checked to ensure it’s really an AHCI controller. Determining what mode the controller is in As you may be aware, a SATA controller can either be in IDE emulation mode or in AHCI mode. The problem that enters here is simple: How to find what mode the controller is in. The documentation is really obscure on this. Perhaps the best way is to initialize a SATA controller as both IDE and AHCI. In this way, as long as you are careful about non-existent ports, you cannot go wrong. One possible way of doing this is by checking the bit 31 of GHC register. It's labeled as AHCI Enable. AHCI Registers and Memory Structures As mentioned above, host communicates with the AHCI controller through system memory and memory mapped registers. The last PCI base address register (BAR[5], header offset 0x24) points to the AHCI base memory, it’s called ABAR (AHCI Base Memory Register). All AHCI registers and memories can be located through ABAR. The other PCI base address registers act same as a traditional IDE controller. Some AHCI controller can be configured to simulate a legacy IDE one. 1) HBA memory registers An AHCI controller can support up to 32 ports. HBA memory registers can be divided into two parts: Generic Host Control registers and Port Control registers. Generic Host Control registers controls the behavior of the whole controller, while each port owns its own set of Port Control registers. The actual ports an AHCI controller supported and implemented can be calculated from the Capacity register (HBA_MEM.cap) and the Port Implemented register (HBA_MEM.pi). typedef volatile struct tagHBA_MEM { // 0x00 - 0x2B, Generic Host Control uint32_t cap; // 0x00, Host capability uint32_t ghc; // 0x04, Global host control uint32_t is; // 0x08, Interrupt status uint32_t pi; // 0x0C, Port implemented uint32_t vs; // 0x10, Version uint32_t ccc_ctl; // 0x14, Command completion coalescing control uint32_t ccc_pts; // 0x18, Command completion coalescing ports uint32_t em_loc; // 0x1C, Enclosure management location uint32_t em_ctl; // 0x20, Enclosure management control uint32_t cap2; // 0x24, Host capabilities extended uint32_t bohc; // 0x28, BIOS/OS handoff control and status // 0x2C - 0x9F, Reserved uint8_t rsv[0xA0-0x2C]; // 0xA0 - 0xFF, Vendor specific registers uint8_t vendor[0x100-0xA0]; // 0x100 - 0x10FF, Port control registers HBA_PORT ports[1]; // 1 ~ 32 } HBA_MEM; typedef volatile struct tagHBA_PORT { uint32_t clb; // 0x00, command list base address, 1K-byte aligned uint32_t clbu; // 0x04, command list base address upper 32 bits uint32_t fb; // 0x08, FIS base address, 256-byte aligned uint32_t fbu; // 0x0C, FIS base address upper 32 bits uint32_t is; // 0x10, interrupt status uint32_t ie; // 0x14, interrupt enable uint32_t cmd; // 0x18, command and status uint32_t rsv0; // 0x1C, Reserved uint32_t tfd; // 0x20, task file data uint32_t sig; // 0x24, signature uint32_t ssts; // 0x28, SATA status (SCR0:SStatus) uint32_t sctl; // 0x2C, SATA control (SCR2:SControl) uint32_t serr; // 0x30, SATA error (SCR1:SError) uint32_t sact; // 0x34, SATA active (SCR3:SActive) uint32_t ci; // 0x38, command issue uint32_t sntf; // 0x3C, SATA notification (SCR4:SNotification) uint32_t fbs; // 0x40, FIS-based switch control uint32_t rsv1[11]; // 0x44 ~ 0x6F, Reserved uint32_t vendor[4]; // 0x70 ~ 0x7F, vendor specific } HBA_PORT; This memory area should be configured as uncacheable as they are memory mapped hardware registers, not normal prefetchable RAM. For the same reason, the data structures are declared as "volatile" to prevent the compiler from over optimizing the code. 2) Port Received FIS and Command List Memory Each port can attach a single SATA device. Host sends commands to the device using Command List and device delivers information to the host using Received FIS structure. They are located at HBA_PORT.clb/clbu, and HBA_PORT.fb/fbu. The most important part of AHCI initialization is to set correctly these two pointers and the data structures they point to. 3) Received FIS There are four kinds of FIS which may be sent to the host by the device as indicated in the following structure declaration. When an FIS has been copied into the host specified memory, an according bit will be set in the Port Interrupt Status register (HBA_PORT.is). Data FIS – Device to Host is not copied to this structure. Data payload is sent and received through PRDT (Physical Region Descriptor Table) in Command List, as will be introduced later. typedef volatile struct tagHBA_FIS { // 0x00 FIS_DMA_SETUP dsfis; // DMA Setup FIS uint8_t pad0[4]; // 0x20 FIS_PIO_SETUP psfis; // PIO Setup FIS uint8_t pad1[12]; // 0x40 FIS_REG_D2H rfis; // Register – Device to Host FIS uint8_t pad2[4]; // 0x58 FIS_DEV_BITS sdbfis; // Set Device Bit FIS // 0x60 uint8_t ufis[64]; // 0xA0 uint8_t rsv[0x100-0xA0]; } HBA_FIS; 4) Command List Host sends commands to the device through Command List. Command List consists of 1 to 32 command headers, each one is called a slot. Each command header describes an ATA or ATAPI command, including a Command FIS, an ATAPI command buffer and a bunch of Physical Region Descriptor Tables specifying the data payload address and size. To send a command, the host constructs a command header, and set the according bit in the Port Command Issue register (HBA_PORT.ci). The AHCI controller will automatically se'''
