["https://wiki.osdev.org/OSDevWiki:Editing"]
title = "OSDev Wiki:Editing - OSDev Wiki"
full_description = 'OSDev Wiki:Editing From OSDev Wiki (Redirected from OSDevWiki:Editing) Jump to navigation Jump to search Contents 1 Getting edit permissions 2 Trying out features 3 Starting a new page 4 Editing features 4.1 Interwiki links 4.2 Signing discussions 5 More information Getting edit permissions Full article: Joining To prevent spam, this wiki does not allow anonymous edits. If you would like to edit this wiki, please sign up for a forum account and join the wiki group. Trying out features You can use the Sandbox to experiment with MediaWiki syntax. You can also make pages underneath your username, just click on your name on the top menu. You can read more about the editing features: Wikipedia Editing Help. Starting a new page New pages can be started by following a link to a non-existent page which leads to an edit page. Users are encouraged to start new articles while paying close attention to the overall organization of the OSDev Wiki. When creating a new article, you should bear in mind that: The title that you choose is important, as this will be the title of your new article. Un-doing mistakes is rarely easier than avoiding them, so it is always a good idea to do a little homework first. If you just want to experiment, use the sandbox first. Editing features Interwiki links You can create interwiki links to Wikipedia: [[wikipedia:Article name|Link title]]. You can create links to forums: [[forum:8|OSDev Wiki Forum]], or to a forum topic: [[topic:17323|Topic on OSDev logos]]. Signing discussions When writing in the Discussion Tab on the wiki you can sign it with your name and a timestamp using four tildes (~), like this: -- ~~~~ More information Manual Of Style OSDev Wiki Forum - Forum for the users and maintainers of this Wiki. Retrieved from "https://wiki.osdev.org/index.php?title=OSDev_Wiki:Editing&oldid=28451" Category: Wiki administration'
