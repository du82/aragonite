title = "Category:ATA - OSDev Wiki"
full_description = 'Help Category:ATA From OSDev Wiki Jump to navigation Jump to search This page contains all pages related to the ATA specifications. To get started quickly, try one of the following pages: ATA PIO Mode Describes the oldest hardware mode for accessing devices. Start here for all your driver needs. ATAPI ATA Packet Interface - Add SCSI commands to the protocol. CD-ROM drives are usually ATAPI devices. You will need some ATA parts for setup. ATA in x86 RealMode (BIOS) If you want to make disk accesses using the legacy BIOS. IDE The name IDE is often used interchangeably with ATA, but "IDE" actually refers to only the electrical specifications of the signals on the 40 / 80 pin disk cable. ATA is the proper name for the entire specification. SATA and PATA Recently a new standard for ATA data transmission has emerged. It was named SATA, and the previous well-known forms of ATA were retroactively renamed PATA, "to reduce confusion" -- while certainly causing it. Pages in category "ATA" The following 11 pages are in this category, out of 11 total. A ADMA AHCI ATA Command Matrix ATA PIO Mode ATA read/write sectors ATA/ATAPI Power Management ATA/ATAPI using DMA ATAPIL LBAP PCI IDE ControllerS SATA Retrieved from "https://wiki.osdev.org/index.php?title=Category:ATA&oldid=23196" Categories: StorageBuses'
