title = "PCI - OSDev Wiki"
full_description = '''PCI From OSDev Wiki Jump to navigation Jump to search Contents 1 The PCI Bus 2 Configuration Space 2.1 Configuration Space Access Mechanism #1 2.2 Configuration Space Access Mechanism #2 2.3 Memory Mapped PCI Configuration Space Access 2.4 Detecting Configuration Space Access Mechanism/s 2.5 PCI Device Structure 2.5.1 Common Header Fields 2.5.1.1 Command Register 2.5.1.2 Status Register 2.5.2 Header Type 0x0 2.5.3 Header Type 0x1 (PCI-to-PCI bridge) 2.5.3.1 Header Type Register 2.5.3.2 BIST Register 2.5.4 Header Type 0x2 (PCI-to-CardBus bridge) 2.6 Base Address Registers 2.6.1 Address and size of the BAR 2.7 Class Codes 3 Enumerating PCI Buses 3.1 "Brute Force" Scan 3.2 Recursive Scan 3.3 Recursive Scan With Bus Configuration 3.4 Configuring PCI-to-PCI bridges 4 IRQ Handling 5 Message Signaled Interrupts 5.1 Enabling MSI 5.2 Enabling MSI-X 6 Multi-function Devices 7 Disclaimer 8 References 9 See Also 9.1 Articles 9.2 External Links The PCI Bus The PCI (Peripheral Component Interconnect) bus was defined to establish a high performance and low cost local bus that would remain through several generations of products. By combining a transparent upgrade path from 132 MB/s (32-bit at 33 MHz) to 528 MB/s (64-bit at 66 MHz) and both 5 volt and 3.3 volt signalling environments, the PCI bus meets the needs of both low end desktop systems and high-end LAN servers. The PCI bus component and add-in card interface is processor independent, enabling an efficient transition to future processors, as well as use with multiple processor architectures. The disadvantage of the PCI bus is the limited number of electrical loads it can drive. A single PCI bus can drive a maximum of 10 loads. (Remember when counting the number of loads on the bus, a connector counts as one load and the PCI device counts as another, and sometimes two.) Configuration Space The PCI specification provides for totally software driven initialization and configuration of each device (or target) on the PCI Bus via a separate Configuration Address Space. All PCI devices, except host bus bridges, are required to provide 256 bytes of configuration registers for this purpose. Configuration read/write cycles are used to access the Configuration Space of each target device. A target is selected during a configuration access when its IDSEL signal is asserted. The IDSEL acts as the classic "chip select" signal. During the address phase of the configuration cycle, the processor can address one of 64 32-bit registers within the configuration space by placing the required register number on address lines 2 through 7 (AD[7..2]) and the byte enable lines. PCI devices are inherently little-endian, meaning all multiple byte fields have the least significant values at the lower addresses. This requires a big-endian processor, such as a Power PC, to perform the proper byte-swapping of data read from or written to the PCI device, including any accesses to the Configuration Address Space. Systems must provide a mechanism that allows access to the PCI configuration space, as most CPUs do not have any such mechanism. This task is usually performed by the Host to PCI Bridge (Host Bridge). Two distinct mechanisms are defined to allow the software to generate the required configuration accesses. Configuration mechanism #1 is the preferred method, while mechanism #2 is provided for backwards compatibility. Only configuration mechanism #1 will be described here, as it is the only access mechanism that will be used in the future. Configuration Space Access Mechanism #1 Two 32-bit I/O locations are used, the first location (0xCF8) is named CONFIG_ADDRESS, and the second (0xCFC) is called CONFIG_DATA. CONFIG_ADDRESS specifies the configuration address that is required to be accesses, while accesses to CONFIG_DATA will actually generate the configuration access and will transfer the data to or from the CONFIG_DATA register. The CONFIG_ADDRESS is a 32-bit register with the format shown in following figure. Bit 31 is an enable flag for determining when accesses to CONFIG_DATA should be translated to configuration cycles. Bits 23 through 16 allow the configuration software to choose a specific PCI bus in the system. Bits 15 through 11 select the specific device on the PCI Bus. Bits 10 through 8 choose a specific function in a device (if the device supports multiple functions). The least significant byte selects the offset into the 256-byte configuration space available through this method. Since all reads and writes must be both 32-bits and aligned to work on all implementations, the two lowest bits of CONFIG_ADDRESS must always be zero, with the remaining six bits allowing you to choose each of the 64 32-bit words. If you don't need all 32 bits, you'll have to perform the unaligned access in software by aligning the address, followed by masking and shifting the answer. Bit 31 Bits 30-24 Bits 23-16 Bits 15-11 Bits 10-8 Bits 7-0 Enable Bit Reserved Bus Number Device Number Function Number Register Offset1 1 Register Offset has to point to consecutive DWORDs, ie. bits 1:0 are always 0b00 (they are still part of the Register Offset). The following code segment illustrates the use of configuration mechanism #1 to read 16-bit fields from configuration space. Note that this segment, the outl(port, value) and inl(port) functions refer to the OUTL and INL Pentium assembly language instructions. uint16_t pciConfigReadWord(uint8_t bus, uint8_t slot, uint8_t func, uint8_t offset) { uint32_t address; uint32_t lbus = (uint32_t)bus; uint32_t lslot = (uint32_t)slot; uint32_t lfunc = (uint32_t)func; uint16_t tmp = 0; // Create configuration address as per Figure 1 address = (uint32_t)((lbus << 16) | (lslot << 11) | (lfunc << 8) | (offset & 0xFC) | ((uint32_t)0x80000000)); // Write out the address outl(0xCF8, address); // Read in the data // (offset & 2) * 8) = 0 will choose the first word of the 32-bit register tmp = (uint16_t)((inl(0xCFC) >> ((offset & 2) * 8)) & 0xFFFF); return tmp; } When a configuration access attempts to select a device that does not exist, the host bridge will complete the access without error, dropping all data on writes and returning all ones on reads. The following code segment illustrates the read of a non-existent device. uint16_t pciCheckVendor(uint8_t bus, uint8_t slot) { uint16_t vendor, device; /* Try and read the first configuration register. Since there are no * vendors that == 0xFFFF, it must be a non-existent device. */ if ((vendor = pciConfigReadWord(bus, slot, 0, 0)) != 0xFFFF) { device = pciConfigReadWord(bus, slot, 0, 2); . . . } return (vendor); } Configuration Space Access Mechanism #2 This configuration space access mechanism was deprecated in PCI version 2.0. This means it's only likely to exist on hardware from around 1992 (when PCI 1.0 was introduced) to 1993 (when PCI 2.0 was introduced), which limits it to 80486 and early Pentium motherboards. For access mechanism #2, the IO port at 0xCF8 is an 8-bit port and is used to enable/disable the access mechanism and set the function number. It has the following format: Bits 7-4 Bits 3-1 Bit 0 Key (0 = access mechanism disabled, non-zero = access mechanism enabled) Function number Special cycle enabled if set The IO port at 0xCFA (the "Forwarding Register") is also an 8-bit port, and is used to set the bus number for subsequent PCI configuration space accesses. Once the access mechanism has been enabled; accesses to IO ports 0xC000 to 0xCFFF are used to access PCI configuration space. The IO port number has the following format: Bits 15-12 Bits 11-8 Bits 7-2 Bits 1-0 Must be 1100b Device number Register index Must be zero Note that this limits the system to 16 devices per PCI bus. Memory Mapped PCI Configuration Space Access PCI Express introduced a new way to access PCI configuration space, where it's simply memory mapped and no IO ports are used. This access mechanism is described in PCI Express. Note that systems that do provide the memory mapped access mechanism are also required to support PCI access mechanism #1 for backwards compatibility. Detecting Configuration Space Access Mechanism/s In general there are 4 cases: Computer doesn't support PCI (either the computer is too old, or your OS is being run at some time in the future after PCI has been superseded) Computer supports mechanism #2 Computer supports mechanism #1 but doesn't support the memory mapped access mechanism Computer supports both mechanism #1 and the memory mapped access mechanism For BIOS systems, int 0x1A, AX=0xB101 will tell you if the system uses mechanism #1 or mechanism #2. If this function doesn't exist you can't be sure if the computer supports PCI or not. If it says mechanism #1 is supported you won't know if the memory mapped access mechanism is also supported or not. For UEFI systems, it's extremely safe to assume that mechanism #2 is not supported; and you can test to see if the computer supports PCI or not by checking to see if the "PCI bus support" protocol exists. If PCI is supported, there's no easy way to determine if (e.g.) the computer supports mechanism #1 or not. For both BIOS and UEFI systems, you can check the ACPI tables to determine if the memory mapped access mechanism is supported. This leaves a few cases uncovered (e.g. where you don't know if whether mechanism #1 or #2 are supported despite trying all of the above). For these cases the only option left is manual probing. This means 2 specific tests - whether mechanism #1 is supported, and if not whether mechanism #2 is supported. Please note that manual probing has risks; in that if there is no PCI (e.g. the system only has ISA) the IO port accesses might cause undefined behaviour (especially on systems where the ISA bus ignores highest 6 bits of the IO port address, where accessing IO port 0xCF8 is the same as accessing IO port 0xF8). PCI Device Structure The PCI Specification defines the organization of the 256-byte Configuration Space registers and imposes a specific template for the space. Figures 2 & 3 show the layout of the 256-byte Configuration space. All PCI compliant devices must support the Vendor ID, Device ID, Command and Status, Revision ID, Class Code and Header Type fields. Implementation of the other registers is optional, depending upon the devices functionality. Common Header Fields The following field descriptions are common to all Header Types: Register Offset Bits 31-24 Bits 23-16 Bits 15-8 Bits 7-0 0x0 0x0 Device ID Vendor ID 0x1 0x4 Status Command 0x2 0x8 Class code Subclass Prog IF Revision ID 0x3 0xC BIST Header type Latency Timer Cache Line Size ... Device ID: Identifies the particular device. Where valid IDs are allocated by the vendor. Vendor ID: Identifies the manufacturer of the device. Where valid IDs are allocated by PCI-SIG (the list is here) to ensure uniqueness and 0xFFFF is an invalid value that will be returned on read accesses to Configuration Space registers of non-existent devices. Status: A register used to record status information for PCI bus related events. Command: Provides control over a device's ability to generate and respond to PCI cycles. Where the only functionality guaranteed to be supported by all devices is, when a 0 is written to this register, the device is disconnected from the PCI bus for all accesses except Configuration Space access. Class Code: A read-only register that specifies the type of function the device performs. Subclass: A read-only register that specifies the specific function the device performs. Prog IF(Programming Interface Byte): A read-only register that specifies a register-level programming interface the device has, if it has any at all. Revision ID: Specifies a revision identifier for a particular device. Where valid IDs are allocated by the vendor. BIST: Represents that status and allows control of a devices BIST (built-in self test). Header Type: Identifies the layout of the rest of the header beginning at byte 0x10 of the header. If bit 7 of this register is set, the device has multiple functions; otherwise, it is a single function device. Types: 0x0: a general device 0x1: a PCI-to-PCI bridge 0x2: a PCI-to-CardBus bridge. Latency Timer: Specifies the latency timer in units of PCI bus clocks. Cache Line Size: Specifies the system cache line size in 32-bit units. A device can limit the number of cacheline sizes it can support, if a unsupported value is written to this field, the device will behave as if a value of 0 was written. Remember that the PCI devices follow little ENDIAN ordering. The lower addresses contain the least significant portions of the field. Software to manipulate this structure must take particular care that the endian-ordering follows the PCI devices, not the CPUs. Command Register Here is the layout of the Command register: Bits 11-15 Bit 10 Bit 9 Bit 8 Bit 7 Bit 6 Bit 5 Bit 4 Bit 3 Bit 2 Bit 1 Bit 0 Reserved Interrupt Disable Fast Back-to-Back Enable SERR# Enable Reserved Parity Error Response VGA Palette Snoop Memory Write and Invalidate Enable Special Cycles Bus Master Memory Space I/O Space RW RO RW RO RW RO RO RO RW RW RW Interrupt Disable - If set to 1 the assertion of the devices INTx# signal is disabled; otherwise, assertion of the signal is enabled. Fast Back-Back Enable - If set to 1 indicates a device is allowed to generate fast back-to-back transactions; otherwise, fast back-to-back transactions are only allowed to the same agent. SERR# Enable - If set to 1 the SERR# driver is enabled; otherwise, the driver is disabled. Bit 7 - As of revision 3.0 of the PCI local bus specification this bit is hardwired to 0. In earlier versions of the specification this bit was used by devices and may have been hardwired to 0, 1, or implemented as a read/write bit. Parity Error Response - If set to 1 the device will take its normal action when a parity error is detected; otherwise, when an error is detected, the device will set bit 15 of the Status register (Detected Parity Error Status Bit), but will not assert the PERR# (Parity Error) pin and will continue operation as normal. VGA Palette Snoop - If set to 1 the device does not respond to palette register writes and will snoop the data; otherwise, the device will trate palette write accesses like all other accesses. Memory Write and Invalidate Enable - If set to 1 the device can generate the Memory Write and Invalidate command; otherwise, the Memory Write command must be used. Special Cycles - If set to 1 the device can monitor Special Cycle operations; otherwise, the device will ignore them. Bus Master - If set to 1 the device can behave as a bus master; otherwise, the device can not generate PCI accesses. Memory Space - If set to 1 the device can respond to Memory Space accesses; otherwise, the device's response is disabled. I/O Space - If set to 1 the device can respond to I/O Space accesses; otherwise, the device's response is disabled. If the kernel configures the BARs of the devices, the kernel also have to enabl'''
