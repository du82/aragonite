full_description = '''Help Category:X86 From OSDev Wiki Jump to navigation Jump to search The x86 category includes information covering Intels 8086,186,286,386,486,Pentium, and newer cpus that initialize in an 8086 compatibility mode. The term x86 is typically limited to 16 and 32-bit cpus. Cpus that have 64-bit extensions to x86 compatible cpus are commonly known as x86-64. Computer systems are considered to be x86 architecture systems if they are opcode compatible with Intel x86 cpus even when employing cpus by manufacturers such as Cyrix and AMD. X86 now has the X87 coprocessor (FPU) intergrated Subcategories This category has the following 7 subcategories, out of 7 total. B BIOSC CPU RegistersI InterruptsP Power managementU UEFIX X86 CPU X86-64 Pages in category "X86" The following 46 pages are in this category, out of 46 total. " "8042" PS/2 Controller8 8259 PICA A20 Line AVX2B BIOS BIOS32 Boot SequenceC CMOSD Descriptor Detecting Memory (x86) Disk access using the BIOS (INT 13h) DPLE ExceptionsF Floating Point Number FPUG Going Further on x86H User:Halofreak1990/CromwellI I/O Ports IA32 Architecture Family Interrupt Service RoutinesL Learning 80x86 Assembly LingemuM MBR (x86) Memory Map (x86) MP SpecificationP Partition Table Physical Address Extension PNP Calls In Protected Mode Port IO Porting to UEFIR Ralf Brown's Interrupt List Real ModeS Segment Selector Segmentation SSE Stack Trace System Initialization (x86) System Management BIOS System Management ModeT TLBU UEFI Uefi.incV VMXW Which assembler should I use?(x86)X X86 Xbox Retrieved from "https://wiki.osdev.org/index.php?title=Category:X86&oldid=12645" Category: Platforms'''
