["https://wiki.pine64.org/wiki/PinePhone_(Pro)_Add-ons"]
title = "PinePhone (Pro) Add-ons - PINE64"
full_description = '''PinePhone (Pro) Add-ons From PINE64 Jump to navigation Jump to search Contents 1 Keyboard 2 LoRa Add-on 2.1 Schematics and Datasheet 3 Qi Wireless Charging Add-on 3.1 Schematics and Datasheet 4 Fingerprint Reader Add-on 4.1 Credits 4.2 Schematics and Datasheet Keyboard Main article: PinePhone (Pro) Keyboard The keyboard case works with both the PinePhone and PinePhone Pro and features a clam-shell design. It uses pogo pins located on the phone’s midsection and attaches by replacing the default back cover. When folded, the phone’s screen and the keyboard rest securely against each other. The hinge features a 180° design, which not only allows for two-hand typing on a surface but also for comfortable thumb-typing when fully extended. The etched keycaps can be easily relocated for alternate layouts such as AZERTY or QWERTZ. The keyboard case runs an open firmware, which means that anyone with the know-how can alter existing functions or add new ones. The bottom (keyboard) and top (phone) sections of the assembly are well-balanced thanks to the large, 6000mAh, internal battery capable of charging the PinePhone (Pro) during operation. The internal battery effectively triples the phone’s battery life. The internal keyboard battery can be manually toggled on/off and the keyboard’s battery charge level can be read in the supported operating systems; the keyboard remains functional with the battery fully depleted. You do not lose access to the PinePhone (Pro)’s USB-C port, speaker, microphone, or any external features, such as volume and lock buttons, with the keyboard attached. There is also a cut-out for the camera, torch, and headphone jack. The USB-C port on the keyboard is capable of powering both the keyboard and PinePhone (Pro) simultaneously. This means that you can plug in a USB mouse, a USB-C dongle, or some other peripheral while the phone and keyboard’s internal battery charge. Please keep in mind that the keyboard case transforms the PinePhone (Pro) into a PDA, which means that taking calls will likely prove awkward without a wired or wireless headset connected. Store page: pine64.com LoRa Add-on Store page: pine64.com Uses the pogo pins to interface a Semtech SX1262 LoRa module with the PinePhone (Pro). Software for receiving and sending LoRa messages with this back cover does exist, however no PinePhone operating system has added support for it yet. Schematics and Datasheet Schematic: PinePhone LoRa Back Cover Schematic ver 1.0 20210425 Datasheet: SX1262 Long Range, Low Power, sub-GHz RF Transceiver Datasheet ATmel ATtiny Microcontroller Datasheet I2C to SPI firmware: zschroeder6212's tiny-i2c-spi Github page Qi Wireless Charging Add-on Store page: pine64.com Warning: Possible safety hazard: If the wireless charging chip fails for some reason, do not plug the phone in to charge via USB-C. Take the back case off first. It is possible that power gets fed into the chip, causing it to overheat, possibly causing damage to the phone and creating a fire-hazard. Album of damage caused by reverse current: [1] Until the cause of this is determined, it is recommended NOT to use the wireless charging add-on. Uses the pogo pins to supply Qi Wireless and Wireless Power Consortium compatible charging. No software required. Schematics and Datasheet Schematic: PinePhone Wireless Charger Back Cover Schematic ver 1.0 20210508 Datasheet: HL6111RFNWP5 5W WPC Wireless Power Receiver Datasheet Fingerprint Reader Add-on Store page: pine64.com Uses the pogo pins to interface a high quality fingerprint sensor, which uses open firmware for it's i2c bridge, and can also be used for gesture navigation thanks to it's ability to detect directional swipes. No PinePhone operating system has added support for the fingerprint reader yet. Credits Credit goes to the user zschroeder6212, who carried the PinePhone Fingerprint Cover project from an idea to a real product. Their progress can be followed on GitHub under https://github.com/zschroeder6212. Schematics and Datasheet Schematic: PinePhone Finger Print Back Cover Schematic ver 3.0 20210124 Datasheet: P2SD Personal Identity Authentication Module Datasheet ATmel ATtiny Microcontroller Datasheet I2C to SPI firmware: zschroeder6212's tiny-i2c-spi Github page Retrieved from "https://wiki.pine64.org/index.php?title=PinePhone_(Pro)_Add-ons&oldid=18725" Categories: PinePhonePinePhone ProPinePhone (Pro) Add-Ons'''
