title = "PINE H64 - PINE64"
full_description = '''PINE H64 From PINE64 Jump to navigation Jump to search The PINE H64 Model B The PINE H64 Model B is a Single Board Computer by PINE64. It is powered by an Allwinner “H6” Quad-Core ARM Cortex A53 64-Bit Processor with a MALI T-722 GPU. The PINE H64 is equipped with up to 3GB of LPDDR3 PC-1600 system memory and 128Mbit of SPI boot Flash. There is also an optional eMMC module (up to 128GB) and a microSD slot for booting. The board is equipped with an onboard 802.11n Wifi/BT chipset, one USB 3.0 host port, two USB 2.0 host ports, Gigabit Ethernet, a PI-2 GPIO bus, an Euler GPIO bus as well as many other peripheral device interfaces such as UART, SPI, and I2C. Contents 1 Versions 2 Software Releases 2.1 Linux 2.1.1 Armbian 2.1.2 Manjaro ARM 2.1.3 DietPi 2.1.4 LibreELEC 2.2 BSD 2.2.1 FreeBSD 2.2.2 NetBSD 3 SoC and Memory Specification 3.1 CPU Architecture 3.2 GPU Architecture 3.3 System Memory 4 Board Features 4.1 Video 4.2 Audio 4.3 Network 4.4 Storage 4.5 Expansion Ports 4.6 Console 5 Information, Schematics and Certifications 6 Datasheets for Components and Peripherals 7 Mali-T720 driver 8 Linux BSP SDK 9 Android SDK Versions There are two types of PINE H64 models: PINE H64 Model A (discontinued) PINE H64 Model B (this page) Software Releases The following releases are for the PINE H64 Model B Linux Armbian Armbian is a Linux distribution designed for ARM boards. They are usually Debian or Ubuntu flavored. Download: https://www.armbian.com/pine-h64-b/ Manjaro ARM Manjaro is a user-friendly Linux distribution based on the independently developed Arch operating system. To learn more about Manjaro please visit the Manjaro Forum. Download: Manjaro ARM PINE H64 GitHub DietPi DietPi is a lightweight yet easy to setup and feature-rich Linux distribution, based on Debian. To find out more about DietPi, please visit the official documentation. Discuss the PINE H64 build on the PINE64 forum thread. Download: Debian 11 Bullseye (supports the microSD card and eMMC, 4GB or more) Debian 12 Bookworm (supports the microSD card and eMMC, 4GB or more) Default credentials Default user root/dietpi LibreELEC LibreELEC is a "Just enough OS" Linux distribution combining the Kodi media center with an operating system. Download: Daily builds (look for look for LibreELEC-H6.arm-xxx-nightly-xxxxxxxx-xxxxxxx-pine-h64-model-b.img.gz] Notes: Supports microSD card and eMMC boot BSD FreeBSD FreeBSD is an operating system used to power modern servers, desktops, and embedded platforms. To learn more about FreeBSD, please visit FreeBSD main page. Instructions: See general information about FreeBSD on Allwinner ARM and specific details about creating a microSD card for the PINE H64 Notes: FreeBSD supports booting from the microSD card NetBSD NetBSD is a free, fast, secure, and highly portable Unix-like Open Source operating system. To learn more about NetBSD please visit NetBSD main page. Download: Direct download latest release build from NetBSD by select PINE H64 Notes: NetBSD supports booting from the microSD card Instructions concerning enabling SSH can be found here Default credentials Root user and SSH root/[none] SoC and Memory Specification Based on Allwinner H6 CPU Architecture Quad-core ARM Cortex-A53 Processor@1488Mhz A power-efficient ARM v8 architecture 64 and 32bit execution states for scalable high performance Trustzone technology supported Support NEON Advanced SIMD (Single Instruction Multiple Data) instruction for acceleration of media and signal processing function Support Large Physical Address Extensions(LPAE) VFPv4 Floating Point Unit 32KB L1 Instruction cache and 32KB L1 Data cache 512KB L2 cache GPU Architecture ARM Mali T-720MP2 Dual-core GPU Supports OpenGL ES 3.1/3.0/2.0/1.1, OpenCL 1.2/1.1 Supports ATSC (Adaptive Scalable Texture Compression) Supports FAST(4x)FSAA, IO Coherency Floating point operation greater than 70 GFLOPS System Memory RAM Memory Variants: 1GB, 2GB, and 3GB LPDDR3. Storage Memory: PINE H64 boards have built-in 128Mb SPI Flash memory, use bootable eMMC module, bootable microSD Cards or USB attached storage. Board Features Video Digital Video 4KP60 (Type A - full) Audio 3.5mm stereo earphone/microphone plug Network 10/100/1000Mbps Ethernet WiFi 802.11 b/g/n/ac with Bluetooth 4.0/4.1 MHF1 RF coaxial connector for external BT/wifi antenna Storage microSD - bootable, support SDHC and SDXC, storage up to 256GB USB - 1 USB3.0 Host port and 2 USB2.0 Host port Expansion Ports RTC - Real Time Clock Battery Connector Wifi/BT Module Header - SDIO 3.0 and UART 2x20 pins "Pi2" GPIO Header 3x3 pins "EXT" Header giving console, power switch and reset switch access Console The console UART is available on the 6-pin header connector between the HDMI and headphone jacks. The pins are on the front row, closer to the board's edge: TX, RX, GND, from left (HDMI) to right (headphone). The default standard is 8,n,1 at 115200bps. Information, Schematics and Certifications Board Dimensions: 85mm x 56mm x 18.8mm Input Power: DC 5V @ 3A, 3.5mm OD/ 1.35mm ID DC jack connector PINE H64 Model B Pi-2 Bus and EXP Bus Connector Pin Assignment PINE H64 board schematics: PINE H64 Model B 1GB/2GB/3GB Rev 1.2 Board Schematic PINE H64 Model B certification: PINE-H64 Model-B FCC Certificate PINE-H64 Model-B CE Certificate] Datasheets for Components and Peripherals Allwinner H6 SoC information: Allwinner H6 SoC Brief Introduction Allwinner H6 SoC Data Sheet V1.1 (Official Released Version) Allwinner H6 SoC User Manual V1.0 (Official Release Version) X-Powers AXP805 PMU (Power Management Unit) information: X-Powers AXP805 Data Sheet V1.0 (Official Release Version) LPDDR3 (178 Balls) SDRAM: Hynix LPDDR3 Datasheet V1.2 Samsung LPDDR3 Datasheet V1.00.00 Spectek LPDDR3 Datasheet eMMC information: PINE64 eMMC module schematic PINE64 USB adapter for eMMC module V2 schematic PINE64 USB adapter for eMMC module PCB in JPEG 16GB Foresee eMMC Datasheet 32GB/64GB/128GB SanDisk eMMC Datasheet SPI NOR Flash information: WinBond 128Mb SPI Flash Datasheet GigaDevice 128Mb SPI Flash Datasheet Ethernet PHY information: Realtek RTL8211 10/100/1000M Ethernet Transceiver for PINE H64 Board Wifi/BT module information: Realtek RTL8723BS WiFi with BT SDIO Remote control button mapping Official Remote Control for the PINE H64 Button Mapping Mali-T720 driver A good DRM PowerPoint presentation by Free Electron here and the DRM video presentation by Free Electron here. 32-bit Wayland MALI Driver: MALI EULA document MALI-T720 32-bit server binary driver and binary download from pine64.org (3.4MB, MD5 F2186A4CAE505A76E0758735886FE682) MALI-T720 32-bit client binary driver and binary download from pine64.org (3.4MB, MD5 F316A78AFABE87E69C8F816D18F15D68) 64-bit Wayland MALI Driver: MALI EULA document MALI-T720 64-bit server binary driver and binary download from pine64.org (5.0MB, MD5 13CC8DCB7CF068D80DFC16281E95E9D7) MALI-T720 64-bit client binary driver and binary download from pine64.org (5.0MB, MD5 951BAD6ED66D4CB904CFE0D65F2855E8) Linux BSP SDK Linux BSP Kernel 4.9 Download: Direct download from pine64.org (5.04GB, MD5 of the TAR-XZ file 06B675B1C217D4CC6A21FF320DA250C1) Android SDK Android Pie 9.0 SDK version 1.0 Direct download from pine64.org (29.14GB, MD5 of the TAR-XZ file 734B4DBB03CAF82A4E955F7E83DE0C65) Retrieved from "https://wiki.pine64.org/index.php?title=PINE_H64&oldid=20778" Categories: PINE H64Allwinner H6'''
