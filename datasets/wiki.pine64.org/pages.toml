full_description = 'PINE H64 Model A From PINE64 Jump to navigation Jump to search The PINE H64 Model A The PINE H64 Model A is a discontinued Single Board Computer by PINE64. It is powered by an Allwinner “H6” Quad-Core ARM Cortex A53 64-Bit Processor with a MALI T-722 GPU. For the Model B version see PINE H64 article. Contents 1 Armbian 2 Accessories 3 SoC and Memory Specification 3.1 CPU Architecture 3.2 GPU Architecture 3.3 System Memory 4 Board Features 4.1 Video 4.2 Audio 4.3 Network 4.4 Storage 4.5 Expansion Ports 5 Information, Schematics and Certifications 6 Datasheets for Components and Peripherals 7 Linux BSP SDK 8 Mali-T720 driver Armbian Armbian is a Linux distribution designed for ARM boards. They are usually Debian or Ubuntu flavored. Download: https://www.armbian.com/pineh64/ Default credentials Default user root/1234 Accessories The step-by-step guides for the accessories can be found under Accessories Step by Step Guides. SoC and Memory Specification The PINE H64 Model A is based on the Allwinner H6. CPU Architecture Quad-core ARM Cortex-A53 Processor@1488Mhz A power-efficient ARM v8 architecture 64 and 32bit execution states for scalable high performance Trustzone technology supported Support NEON Advanced SIMD (Single Instruction Multiple Data) instruction for acceleration of media and signal processing function Support Large Physical Address Extensions(LPAE) VFPv4 Floating Point Unit 32KB L1 Instruction cache and 32KB L1 Data cache 512KB L2 cache GPU Architecture ARM Mali T-720MP2 Dual-core GPU Supports OpenGL ES 3.1/3.0/2.0/1.1, OpenCL 1.2/1.1 Supports ATSC (Adaptive Scalable Texture Compression) Supports FAST(4x)FSAA, IO Coherency Floating point operation greater than 70 GFLOPS System Memory RAM Memory Variants: 1GB, 2GB, and 3GB LPDDR3. Storage Memory: PINE H64 boards have built-in 128Mb SPI Flash memory, use bootable eMMC module, bootable microSD Cards or USB attached storage. Board Features Video Digital Video 4KP60 (Type A - full) Audio 3.5mm stereo earphone/microphone plug Network 10/100/1000Mbps Ethernet WiFi 802.11 b/g/n/ac with Bluetooth 4.0/4.1 (optional) Storage microSD - bootable, support SDHC and SDXC, storage up to 256GB USB - 1 USB3.0 Host port and 2 USB2.0 Host port Expansion Ports RTC - Real Time Clock Battery Connector Wifi/BT Module Header - SDIO 3.0 and UART 2x20 pins "Pi2" GPIO Header mini PCIe connector Information, Schematics and Certifications Board Dimensions: 133mm x 80mm x 19mm Input Power: DC 5V @ 3A, 3.5mm OD/ 1.35mm ID DC jack connector, Euler connector PINE H64 Pi-2/Euler/Ext Bus Connector Pin Assignment PINE H64 Board Schematic: PINE H64 1GB/2GB/3GB Rev 1.1 Board Schematic PINE H64 Certification: [Not yet available] Datasheets for Components and Peripherals Allwinner H6 SoC information: Allwinner H6 SoC Brief Introduction Allwinner H6 SoC Data Sheet V1.1 (Official Released Version) Allwinner H6 SoC User Manual V1.0 (Official Release Version) X-Powers AXP805 PMU (Power Management Unit) information: X-Powers AXP805 Data Sheet V1.0 (Official Release Version) LPDDR3 (178 Balls) SDRAM: Hynix LPDDR3 Datasheet V1.2 Samsung LPDDR3 Datasheet V1.00.00 Spectek LPDDR3 Datasheet eMMC information: PINE64 eMMC module schematic PINE64 USB adapter for eMMC module V2 schematic PINE64 USB adapter for eMMC module PCB in JPEG SanDisk eMMC Datasheet Hynix eMMC Datasheet Foresee eMMC Datasheet SPI NOR Flash information: WinBond 128Mb SPI Flash Datasheet GigaDevice 128Mb SPI Flash Datasheet Ethernet PHY information: Realtek RTL8211 10/100/1000M Ethernet Transceiver for PINE H64 Board Wifi/BT module information: AMPAK AP6356 2x2WiFi with BT 4.1 SDIO Realtek RTL8723BS 1x1 WiFi with BT 4.0 SDIO miniPCIe SATA module information: Molex miniPCie Socket information ASmedia ASM1061 2x2WiFi with BT 4.1 SDIO Enclosure information: ABS Enclosure 3D file Outdoor Aluminum Cast Dust-proof IP67 Enclosure Drawing Remote control button mapping Official Remote Control for the PINE H64 Button Mapping Linux BSP SDK The Linux BSP Kernel version 4.9 Download: H6 BSP 4.9 Tools H6 BSP 4.9 "Brandy" Github H6 BSP 4.9 Linux Github Mali-T720 driver Here is the good DRM powerpoint presentation by Free Electron: https://free-electrons.com/pub/conferences/2017/kr/ripard-drm/ripard-drm.pdf Here is the DRM video presentation by Free Electron: https://www.youtube.com/watch?v=LbDOCJcDRoo 32-bit Wayland MALI Driver: MALI EULA document MALI-T720 32-bit server binary driver and binary download (3.4 MB MD5 F2186A4CAE505A76E0758735886FE682) MALI-T720 32-bit client binary driver and binary download (3.4 MB MD5 F316A78AFABE87E69C8F816D18F15D68) Retrieved from "https://wiki.pine64.org/index.php?title=PINE_H64_Model_A&oldid=19255" Categories: PINE H64Allwinner H6'
