["https://wiki.pine64.org/wiki/Getting_started"]
title = "Getting started - PINE64"
full_description = "Getting started From PINE64 Jump to navigation Jump to search This guide is for the PINE64 devices. For device-specific information please see the corresponding device pages listed on the main page. Contents 1 Requirements 2 Step-by-Step Instructions for Flashing MicroSD Cards 2.1 Imaging microSD on Windows 7/8/8.1/10 2.2 Imaging microSD on macOS 2.3 Imaging microSD on Linux 3 Instructions for Flashing Removable eMMC Modules 3.1 Flashing Using the USB-to-eMMC Adapter (Preferred Way) 4 Instructions for Flashing Integral eMMC 4.1 Flashing to eMMC from a SD Boot 4.2 Flashing to eMMC using FEL (Allwinner A64 Devices Only) 4.3 Flashing to eMMC using Rockchip Tools (Rock64 Only) 4.4 Flashing to eMMC Android 'Update' OS Images on Linux (Rock64 Only) 5 Flashing u-boot to SPI Flash 5.1 Using a Stand-Alone Image to Write u-boot to SPI 5.2 Using a Script on Linux OS Images 5.3 Erasing and Rewriting SPI 5.4 Booting an OS image from USB 2.0/3.0 Storage 6 Troubleshooting Requirements You will need the following to get started with using your PINE A64(+), PINE A64-LTS, Pinebook or ROCK64 board: A Windows / Linux PC or Mac device with a MicroSD Card Reader Internet connection / pre-downloaded OS image files Power Supply: PINE A64(+): Power Supply (PSU) and a micro usb cable. Please make sure to use a PSU rated at +5V @2A and a micro USB cable that is at least 26 AWG thick. SOPine/PINE A64-LTS: Power Supply (PSU) with 3.5mm OD/1.5mm ID barrel DC Jack. Please make sure to use a PSU rated at +5V @2A. Pinebook and ROCK64: Power Supply (PSU) with 3.5mm OD/1.5mm ID barrel DC Jack. Please make sure to use a PSU rated at +5V @3A. MicroSD card (Recommend: 8GB or higher capacity, 10MB/s or faster speed) HDMI cable (unless you wish to run headless / without a screen) For A64 devices, Android and Remix OS supports 720p and 1080p, while Linux supports a wider range of resolutions. Input device(s) such as: keyboard, mouse, remote, pointer, etc. Step-by-Step Instructions for Flashing MicroSD Cards Caution! Handle the Pine64 Single Board Computers' PCBs with care. Always hold bare boards by the edges and make sure to wear an anti-static wrist strap. Touching components on the front and back of the boards can result in an ESD discharge that may cause damage to the electronics. Avoid placing bare boards on materials such as carpets, plastics or other surfaces prone to electrostatic build-up Begin by imaging the OS of your choice The process of flashing PINE64 OS images to micro SD on your Windows, Linux or OSX device is the same for all devices. You will require a quality microSD card (8GB or greater; class 10 or faster). There are many substandard and counterfeit cards in circulation and even reputable vendors may unknowingly sell counterfeit microSD cards. Cards that do not meet the criteria outlined above are known to cause a variety of issues including, but not limited to, complete boot failure. There are ways of testing microSD cards prior to installing the operating system to make sure they are appropriate for use with your board. The main utility for checking microSD cards is H2testw 1.4; yet another alternative is F3. Yet another overview of various options Test and Detect Fake Cards Please refer to the relevant section below for instructions on how to image your microSD card: Imaging microSD on Windows 7/8/8.1/10 Imaging microSD on Apple OSX Imaging microSD on Linux Having successfully imaged your microSD card, insert it into the microSD slot. Plug in the HDMI Cable, Ethernet Cable and Peripherals to your PINE64 SBC Unless you are planning on running your board headless (without a monitor / as a server) you should plug in all necessary peripherals, including the HDMI and Ethernet cable, prior to powering ON the board. Do note, depending on which OS image you are using, some peripherals may or may not work. Apply Power to Your Board Once you have imaged your microSD and plugged everything in, you are ready to apply power to the PINE64 Single Board Computer. You'll need a good quality 5 Volt, 2 Amp PSU. Using a good quality PSU is very important as failing to meet the required specifications may prevent the board from booting correctly. A marginally higher PSU Voltage is acceptable (for instance, 5.1 volts - due to the nature of the micro usb connection, a 5.1v supply can help protect slightly against voltage drops which can cause undesirable results). However, a significantly higher voltage of 7 Volts or more will damage the PINE64 Single Board Computer and may render it inoperative. For PINE A64(+) board, if you are using a separate micro USB cable with your PSU, make sure that the cable has a low resistance rating. Cables with high resistance will cause improper function and the unit may not boot at all or only partially. The thicker the internal cabling, the better i.e. AWG (American Wire Gauge) 20 is better than AWG 28. In General, power-only microUSB cables come with red colour USB header. Having completed the steps outlined above the PINE64 Single Board Computer will begin to boot. The onboard power-on LEDs will come on and Ethernet port LEDs will start to blink if you have an Ethernet cable plugged in. Imaging microSD on Windows 7/8/8.1/10 You will need the following utilities to get started with imaging the OS of your choice onto your microSD card: A compression utility (used to unarchive the OS image). We recommend you use 7zip. A disk image utility (used to flash the .img to your SD card). We recommend you use either the Etcher or Win32Imager utility. Optional for Allwinner A64 SoC based boards Phoenix Card image utility (used ONLY for phoenix card images). Downloading and extracting OS image(s) You can find OS images for the respective devices in the device section on the main page. Images designated ‘DD’ need to be flashed using Etcher or Win32imager, whilst images labelled ‘Phoenix Card Image’ require the Phoenix Card utility. Having downloaded the required OS image proceed to use 7zip to unarchive it by right-clicking the archive, and selecting ‘Extract All’. Upon completion, note the destination of where the .img file was extracted (‘Downloads’ folder by default). Once the process has completed, you can proceed to imaging the .img file. Imaging the microSD card (DD) Insert your microSD card into your laptop/USB card reader. You may require a SD → microSD converter, as most laptops and desktops only feature a full-size SD card reader. Once the microSD card is plugged into your computer, make sure to take note of the drive it has been assigned (the drive is assigned a letter, e.g. ‘F:’). You will need to remember the ‘letter’ it has been assigned when imaging the OS. Launch Win32diskImager.exe or etcher.exe. You will be presented with a field titled ‘path’ and a drop down menu labeled ‘device’. Click the ‘path’, navigate to and select the OS image you extracted from the archive earlier. Next, from the drop-down menu select the drive your microSD has been assigned. Warning: Pay close attention to the selected drive (remember your letter) – the imaging process will permanently erase and format the selected drive. If you choose the wrong drive all your data will be lost. Having chosen the desired OS image and the correct driver press ‘write’. Once the image has been written to your microSD card you will receive a pop-up notification. Be sure to close the application and to eject/remove your SD card safely from Windows. Imaging using Phoenix Card (applicable only to Allwinner A64 SoC based boards) On Windows, you can also use Phoenix Card (for detailed instructions click here). The Phoenix Card utility works ONLY with images designated as ‘Phoenix Card’ in the downloads section. To use Phoenix Card follow these steps: Insert your microSD card into your laptop/USB card reader. You may require a SD → microSD converter, as most laptops and desktops only feature a full-size SD card reader. Once the microSD card is plugged into your computer, make sure to take note of the drive it has been assigned (the drive is assigned a letter, e.g. ‘F:’). You will need to remember the ‘letter’ it has been assigned when imaging the OS. Launch phoenixcard.exe. You will be presented with a ‘disk’ drop-down menu and a field denoted as ‘.img File’. Click on ‘.img File’ and navigate to and select the OS image have downloaded and unarchived. Next, make sure to select the disk that your microSD card has been assigned. Warning: Pay close attention to the selected drive (remember your letter) – the imaging process will permanently erase and format the selected drive. If you choose the wrong drive all your data will be lost. Make sure to select ‘Startup!’ from the ‘Write mode’ window and click Burn. Once the image has been written to your microSD card you will receive a confirmation in the ‘option’ window. Be sure to close the application and to eject/remove your SD card safely from Windows. Imaging microSD on macOS You will need the following utilities to get started with imaging the OS of your choice onto your microSD card: A compression utility (used to unarchive the OS image). You may use Keka. A disk image utility (used to flash the .img to your SD card in GUI). You may use ApplePi Baker v2 or Etcher. Phoenix Card utility and images are NOT available on macOS. Downloading and extracting OS image(s), insert the SD card You can find OS images for the respective devices in the device section of the main page. Having downloaded the required OS image, proceed to use the compression utility to unarchive it and get the .img file. Once the process has completed, you can proceed to write it to your SD card. Insert your microSD card into your Mac laptop/USB card reader. You may require a SD → microSD converter, as Apple’s laptops and desktops only feature a full-size SD card reader. Once the microSD card is plugged into your computer, it should appear in Finder / on your desktop. Imaging the microSD card (GUI) Launch the imaging utility. Upon startup, the application may ask for your password. When the application launches, you will be presented with a field titled ‘IMG file’ and a path of the mounted microSD card (it will look like this: ‘/dev/diskX 32.0Gb SD card’). To choose the OS image file, click the ‘IMG file’ button, navigate to and select the .img file you extracted from the archive earlier. Then select the microSD card you want to write into. Warning: Pay close attention to the selected device, make sure it is the right SD card – the imaging process will permanently erase and format the selected storage device. If you choose the wrong device, all the data in it will be lost. Having chosen the desired OS image and the correct device, press ‘Restore Backup’ or ‘Flash’. Once the image has been written to your microSD card, you will receive a pop-up notification. Close the application, then eject/remove your SD card from your Mac. Imaging from Terminal If you are not comfortable using the terminal, please use the GUI method outlined above instead. Open up your terminal and navigate to the directory where you unarchived your OS image. Before you start writing to the card, you will have to identify your microSD card. Type: diskutil list and note the output. The disk number should match the size of your SD card, and will likely be using Fdisk_partition_scheme. Having identified the disk number execute the following commands (substitute diskX for your disk and name of image for pine64-image-name.img): diskutil unmountDisk /dev/diskX sudo dd if=pine64-image-name.img of=/dev/disk2 bs=1M Wait patiently for the process to complete, then eject/remove your SD card from your Mac. Imaging microSD on Linux You will need the following utilities to get started with imaging the OS of your choice onto your microSD card: A compression Utility (used to unarchive the OS image). We recommend you use Ark. A disk image utility (used to flash the .img to your SD card in GUI). We recommend you use Etcher or the GUI Disks utility that ships with most popular distributions. Phoenix Card utility and images are NOT available on Linux. Downloading and extracting OS image(s) You can find OS images for the respective devices in the device section on the main page. On Linux you can only use images designated as ‘DD’. Having downloaded the required OS image proceed to use 7zip to unarchive it by double clicking the archive, and selecting ‘Extract All’. Upon completion, note the destination where the .img file was extracted (‘Downloads’ folder by default). Once the process has completed, you can proceed to imaging the .img file. Imaging the microSD card (GUI) Insert your microSD card into your Linux laptop/USB card reader. Once the microSD card is plugged into your computer it should appear in your File Manager / on your desktop. Launch Disks or the etcher utility (This tutorial outlines how to use Disks, if you wish to learn how to use Etcher please visit their website). Upon launching Disks, you will be presented with all volumes visible to your computer. As a rule of thumb, your microSD card should be found at the bottom of listed volumes. Verify this by checking the size and mounting of the microSD card. Warning: Pay close attention to the selected drive – the imaging process will permanently erase and format the selected drive. If you choose the wrong drive all your data will be lost. Having selected your microSD card, click the cog menu in top right corner and choose the ‘Restore Disk Image’ option from the drop-down list. Navigate to and select the OS image you extracted from the archive earlier. Once you select it, you will be asked to enter your password and to confirm writing to the chosen volume (microSD card). You will be given a predicted time, writing-speed and completion percentage. Once the image has been written to your microSD card you will receive a pop-up notification. Be sure to close the application and to eject/remove your SD card safely from your computer. Imaging from Terminal If you are not comfortable using the terminal, please use the GUI method outlined above instead. Insert your microSD card into your Linux laptop/USB card reader. Once the microSD card is plugged into your computer it should appear in Finder / on your desktop. Open up your terminal and navigate to the directory where you unarchived your OS image. e.g. cd Download Before you start writing to the card, you will have to identify your microSD card. Type: lsblk and pay attention to the listed disks. Disks will appear as /dev/mmcblk0 /dev/mmcblk1 etc. Hint: the drive you currently have booted from has the / at the end of the line. This is the wrong drive. Look at the drive that matches your microSD card’s size. Now you are ready to write the image to the microSD card using this command: (replace the pine.img file with your image and mmcblkX with the correct device for the microSD card) sudo umount /dev/mmcblkX sudo dd if=pine.img of=/dev/mmcblkX bs=1M status=progress conv=fsync Wait patiently for th"
