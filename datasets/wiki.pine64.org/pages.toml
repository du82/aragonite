title = "PinePhone - PINE64"
full_description = '''PinePhone From PINE64 Jump to navigation Jump to search Rendering of the PinePhone Beta Edition The PinePhone is a smartphone created by PINE64. It is capable of running mainline Linux and is supported by many partner projects. The Braveheart Edition of the PinePhone was the first publicly available version of the phone. It shipped without a fully functional operating system and was geared specifically towards early adopters. The Braveheart Edition's successors were the Community Editions, which featured a branded backcover and box of selected community projects. The Community Editions became available in June 2020. The Beta Edition featuring Manjaro with Plasma Mobile is the latest edition, it became available in March 2021. Contents 1 Introduction 1.1 State of the software 1.2 Help and support 2 First time installation 3 Operating systems 3.1 Software releases 3.2 Installation instructions 3.3 Troubleshooting 3.3.1 The battery is drained 3.3.2 The installation is corrupted or incorrect 4 Specifications 5 Components 6 Hardware revisions 7 Hardware accessory 7.1 Add-ons 7.2 PinePhone Accessories 7.3 Pogo pins 7.4 Back cover 7.5 Serial console 8 Privacy switch configuration 9 Camera 10 Battery 11 Modem 11.1 AT commands 11.2 VoLTE 11.3 APN settings 11.4 Carrier support 11.5 Documents 11.6 Firmware update 11.6.1 Custom firmware 11.6.2 Stock firmware 11.7 Firmware modifications 11.8 GPS / GNSS 11.9 Voice mail 12 Safety 12.1 General recommendations 12.2 Charging safety 12.3 Thermal safety 13 Frequently asked questions 14 Modifications and repairs 14.1 Swapping in a new mainboard revision 14.1.1 Replacing the mainboard 14.1.2 Flashing the ANX firmware 14.1.2.1 Method 1 14.1.2.2 Method 2 14.2 Replacing the screen 14.3 Spare parts not available in the PINE64 store 14.4 Other hardware issues 15 Press 16 PinePhone board information, schematics and certifications 17 Datasheets for components and peripherals 18 Resources 19 External links Introduction The PinePhone is not a regular phone and you might not get the latest and greatest hardware and this years' newest innovation. You will get a device with good mainline support with a great community behind it. State of the software First things first, the PinePhone is aimed solely at early adopters - more specifically, the units are solely intended to find their way into the hands of users with extensive operating system experience. Bear in mind that the software for these smartphones is very early, with most of the software being in alpha or beta state. That's especially also the case for scalability of applications, their availability and practicability, any hardware function implementations and the firmware. The software is provided as is. There is no warranty for the software, not even for merchantability or fitness for a particular purpose. If you have any questions regarding the current state of the software or of specific features working, please don't hesitate to ask in the community chat (see Main Page#Community and Support)! Help and support Still have any questions regarding software, shipping, or ordering after reading this wiki? Please don't hesitate to contact the community in the bridged community channels for detailed answers or simply to chat with friendly people in the community! See Main Page#Community and Support. Please keep in mind that PINE64 is not like a regular company (see the PINE64 philosophy) and that support resources are limited - the best way to get support quickly is to ask in the community chat! Please only contact the PINE64 support directly if questions couldn't be solved via the community chat or this wiki. First time installation A protection foil isolates the battery for the shipping. When shipped the battery is isolated from the device using a protective plastic tab, which is required to be removed before using the phone. The battery will not charge or boot until it is removed and the battery is connected again. Note: To remove the sticker after unboxing the phone: Carefully remove the back panel using the notch in the corner of the back cover without overbending it. Then remove the battery. Peel off the clear plastic sticker below it, which isolates the charging contacts and reinsert the battery. The PinePhone's SIM slot only accepts a micro-SIM, please do not insert a nano-SIM without an adapter and make sure that the nano-SIM does not get released from its adapter. The SIM card has to be placed in the lower slot, while the microSD has to be placed in the upper slot. Note: Do not insert an empty micro-SIM adapter into the phone and do not release the nano-SIM inside the adapter, as it will get stuck on the contact pins. If the nano-SIM got released inside the adapter inside the phone, carefully reinsert the nano-SIM card without moving the adapter. In that case do not pull on the empty adapter as it will get stuck on the contact pins and damage them! The microSD belongs in the upper slot, the micro-SIM in the lower slot. An adapter from a nano to a micro-SIM might be included under tape in the camera notch of the phone's packaging. Some nano-SIMs will not fit firmly into that adapter that comes with the PinePhone and if the included adapter is used without a well-fitting nano-SIM, the contact pins might get damaged. In that case it is highly recommended to acquire a better fitting adapter. Operating systems The PinePhone will automatically boot from microSD if a bootable card is inserted. Although it is technically possible to use any ARM distribution (because the PinePhone uses the mainline kernel), there are a few that are designed specifically for mobile use on devices like the PinePhone. Software releases The PinePhone Software Releases page has a complete list of currently supported phone-optimized Operating System images that work with the PinePhone as well as other related software information. As soon as more patches get mainlined and distributions ship with the updated kernel, they will also be able to run unmodified on the device. To update any installed operating system please see PinePhone Updating Instructions. Installation instructions The instructions to install an operating system to the internal memory ("eMMC") or a microSD card can be found here: PinePhone Installation Instructions. Troubleshooting If the PinePhone is not booting from eMMC and/or microSD card anymore it can have two causes: The battery is drained If the battery is fully drained, most operating systems and distributions won't boot anymore. One of the exceptions which still boots is the utility Jumpdrive, which can usually be used to expose the eMMC and microSD card as drives to a USB-connected computer. Mind that JumpDrive won't expose the eMMC and microSD card with a drained battery but it still can be flashed and booted from microSD card to confirm that the phone still functions and boots up fine. JumpDrive can be downloaded from here (not compatible with the PinePhone Pro!). Note: If JumpDrive boots and other releases do not boot, the battery is likely drained. In that case let it charge while running JumpDrive with a compatible charger for multiple hours and make sure to not fully drain the battery in the future anymore, as that significantly reduces the battery lifetime. Alternatively to testing JumpDrive, the issue can also be diagnosed by checking the battery charge. Simply remove the battery from the device and measure the voltage on the (+) and (-) contacts on the battery. Make sure to not shorten the contacts as shorting battery pins is a severe life and safety danger. The installation is corrupted or incorrect If the installation of the prioritized boot medium is corrupted or incorrect, the PinePhone will not boot anymore. The following problems are common: The microSD card is in the wrong slot (see first time installation) The image file was flashed to partition 1 (example: sdx1, nvme0x1p1) instead of the whole device (example: sdx, nvme0x1) An image without bootloader was flashed (mind the Tow-Boot bootloader requirements of Mobian and postmarketOS) The operating systems got corrupted, for example after running updates (reflash the device, see PinePhone Installation Instructions) An incompatible image was flashed (make sure that the images are compatible. Images for the PinePhone Pro won't boot on the PinePhone and vice versa. Check your invoice to see if you ordered a PinePhone or a PinePhone Pro). Specifications Dimensions: 160.5 x 76.6 x 9.2mm Weight: Between 180 ~ 200 grams SIM Card: Micro-SIM Display: Size: 5.95 inches (151mm) diagonal Type: HD IPS capacitive touchscreen, 16M colors Resolution: 1440x720, 18:9 ratio System on Chip: Allwinner A64 RAM: 2GB or 3GB LPDDR3 SDRAM Internal Storage: 16GB or 32GB eMMC, extendable up to 2TB via microSD, supports SDHC and SDXC Back Camera: Single 5MP, 1/4", LED Flash Front Camera: Single 2MP, f/2.8, 1/5" Sound: Loudspeaker, 3.5mm jack & mic (jack doubles as hardware UART if hardware switch 6 is deactivated) Communication: Modem: Quectel EG25-G LTE-FDD: B1, B2, B3, B4, B5, B7, B8, B12, B13, B18, B19, B20, B25, B26, B28 LTE-TDD: B38, B39, B40, B41 WCDMA: B1, B2, B4, B5, B6, B8, B19 GSM: B2, B3, B5, B8 (850, 900, 1800, 1900 MHz) WLAN: Wi-Fi 802.11 b/g/n, single-band, hotspot Bluetooth: 4.0, A2DP GNSS: GPS/GLONASS/BeiDou/Galileo/QZSS, with A-GPS Sensors: Accelerometer, gyroscope, proximity, ambient light, compass Privacy switches: Modem, WiFi & Bluetooth, Microphone, Cameras Battery: Lithium-ion, rated capacity 2800mAh (10.64Wh), typical capacity 3000mAh (11.40Wh) (nominally replaceable with any Samsung J7 form-factor battery) I/O: USB Type-C, USB Host, DisplayPort Alternate Mode output, 15W 5V 3A Quick Charge, follows USB PD specification Components Component Model Touchscreen Goodix GT917S Rear camera OmniVision OV5640 Camera flash Awinic AW3641EDNR Front camera GalaxyCore GC2145 LCD Xingbangda XBD599 WiFi Realtek RTL8723CS Bluetooth Realtek RTL8723CS Modem Quectel EG25-G GNSS/GPS Quectel EG25-G Magnetometer ST LIS3MDL Ambient light / Proximity SensorTek STK3335 Accelerometer / Gyroscope InvenSense MPU-6050 Vibration motor Unknown model Notification LED LED0603RGB Volume buttons Buttons connected to the KEYADC Power button X-Powers AXP803 Battery fuel gauge X-Powers AXP803 See the PinePhone Component List. Hardware revisions The history of the PinePhone CEs The following are all hardware revisions of the PinePhone that have existed, ordered by the time of their releases: Project Anakin - Development kit Project Don't be evil - Development kit PinePhone v1.0 - Developer Edition PinePhone v1.1 - Braveheart Edition PinePhone v1.2 - Ubports Community Edition PinePhone v1.2a - postmarketOS Community Edition PinePhone v1.2b - Manjaro Community Edition, KDE Community Edition, Mobian Community Edition and Beta Edition Hardware accessory Add-ons The PinePhone (and PinePhone Pro) is compatible with the official add-on cases, such as the keyboard, the LoRa add-on, the Qi wireless charging add-on and the fingerprint reader add-on. Details can be found under: PinePhone (Pro) Add-ons PinePhone (Pro) Keyboard PinePhone Accessories See PinePhone Hardware Accessory Compatibility for a list of devices working with the PinePhone (depending on their OS support). The USB-C can be used to power the device, and offers USB2 host and OTG capabilities, and also can make use of the USB-C capability to integrate HDMI signals. Some USB-C hubs are available that offer power throughput, USB connection, an HDMI port and Ethernet connection. Pogo pins The pogo pins, as visible under the back cover. The PinePhone has six pogo pins on the back allowing for custom hardware extensions such as wireless charging, an IR blaster, a keyboard extension or extended battery case. The pogo pins provide access to an interrupt line, power inputs/outputs and an I2C interface. Interrupt SDA SCL DCIN USB-5V GND The DCIN pogo pin is connected to the VBUS line of the phone's USB Type-C connector, serving as another 5 V power input to the phone. However, the PinePhone may act as a USB host (providing 5 V at the USB Type-C connector's VBUS line to a connected device) or as a USB device (drawing from a 5 V source on the USB Type-C connector's VBUS line). Thus, connecting a 5 V power supply to DCIN in order to power the phone may not be safe to do in all conditions, e.g., when the phone is acting as a USB host to a connected USB device. The USB-5V pogo pin is to used as an "always on" power output from the PinePhone. Depending on a number of factors, USB-5V may be at the battery voltage (between 3.0 V and 4.3 V), or at 5 V. Thus, if you are using USB-5V to power your pogo-pins expansion board, you will probably need to use DC/DC converters/regulators as appropriate. USB-5V is on even while the A64 SoC is powered down. Pine Store offers the PinePhone Flex Breakout Board. With its 2.54 mm pitch, this breakout may have leads soldered directly to the contacts for use in a solderless breadboard. A non-soldered solution would be to use a TE AMP Connector that accepts a flat flexible cable with 2.54 mm pitch. The following community projects use the pogo pin connections: The PinephonePogoBreakout breakout board from the community member SMR404 Martijn Braams' Making a backcover extension for the PinePhone Back cover A step file for the back cover for creating custom cases is freely available here. Serial console Pinout of the serial adapter. This shows signals from the PinePhone's point of view, so connect the adapter's Rx to Ring 1 and Tx to Tip The PinePhone has a serial port in the headphone connector, it's activated by the 6th contact on the dipswitch. If the switch is set to "on", the headphone connector is in audio mode, if it is set to "off" it's in UART mode. The UART serial connection can also be used for communication with other devices from the PinePhone. The UART is 115200n8. The pinout for the serial connector is: Tip: RX Ring: TX Sleeve: GND You can buy a serial debug cable from the PINE64 Store. The store cable uses a 4 ring plug, as seen in the here, but a 3 ring plug works just as well. The cable uses a CH340 chipset based serial to USB converter, but any 3.3v serial connection can be used. Because it is a "host"/DTE it means that you need a cross modem cable (Null Modem) with TX on Tip to be connected to RX. A cable like e.g. FTDI TTL-232R-3V3-AJ which has TX on Tip and RX on Ring fits perfectly. Privacy switch configuration Picture of the privacy switches The PinePhone features six switches that can be used to configure its hardware. They are numbered 1-6, with switch 1 located nearest to the modem. Their "on" position is toward the top of the phone. Number Name Explanation Description 1 Modem Pulls Q1501 gate up (FET killing modem power) "On" enables 2G/3G/4G communication and GNSS hardware, "off" disables it. 2 WiFi / Bluetooth Pulls up CHIP_EN "On" enables WiFi and Bluetooth communication hardware, "off" disables it. 3 Microphone Breaks '''
year_published = 2025
