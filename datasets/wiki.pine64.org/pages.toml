["https://wiki.pine64.org/wiki/Pinecil"]
title = "Pinecil - PINE64"
full_description = '''Pinecil From PINE64 Jump to navigation Jump to search Pinecil is a portable soldering iron with computer controlled temperature, sleep modes, motion detection, and allows many options for power from AC supplies (USB-C, DC Barrel) to external tool/LiPo batteries. You may already have a power supply that works. It also has the intended use of being a RISC-V development device using a breakout board. The Pinecil has evolved over the years from a 60W device into the latest rendition, the V2, which supports 24V/88W and includes the new PINE64 designed shorter tip. Note: Other irons only care if they can solder. The Pinecil is held to an additional standard; how well can it meet the needs of the open source community as a RISC-V development tool. It includes hardware features not found on other soldering irons such as BLE Bluetooth in the V2 in order to support FOSS community feature requests for both fun and science. Pinecil V2, launched Aug 2, 2022 Pinecil V2, side view Contents 1 Main features 2 Authenticity 2.1 Pinecil V2 Authenticity Checker 3 Where to buy a Pinecil 3.1 PINE64 Official Stores 3.2 PINE64 EU 3.3 Affiliates 3.4 Why buy from a legitimate seller? 4 Shipping & Tracking 5 Usage 5.1 Overview 5.2 Getting Started with the Menu 6 Optional Advanced Modifications 7 Live Community Chat 8 Firmware & Updates 9 Development Projects 10 Power Supplies and Watts 10.1 Power Chart 10.2 Power Notes 10.3 QC Chargers 11 Compatible Power Supplies 12 Checklist 13 Specifications 13.1 Pinecil V2 13.2 Pinecil V1 13.3 Fasteners/Screws 14 Manuals 15 Pictures 16 Pinecil Breakout board 17 Pinecil Tips 18 Guides to Soldering & Maintenance 19 Cases, Stands, 3D models, Supplies 20 Test, Repair, Issues 21 Schematics and Board Data 22 Datasheets for Components 23 Pinecil Certifications 24 History of Pinecil Changes 25 Pinecil in the Media 25.1 Humor 25.2 Videos 25.3 Pinecil V2 Articles 25.4 Pinecil V1 Reviews 25.5 Pinecils in the Field Main features The main features of the Pinecil include the following: Portability and temperature control Soldering tips: Replaceable and low cost Many styles: currently sold as 4-packs, one fine set, the other larger Compatible with other TS100 tips. Multiple power sources will work for more flexibility: USB-C PD (power delivery), minimum 3 A at 12 V DC 5525 (5.5 mm OD / 2.5 mm ID) barrel jack charger, minimum 3 A at 12 V Battery: connect to 18-21 V lithium-ion tool batteries or 3S/4S/5S lithium-polymer batteries Pinecil v2 has a BL706 chip, see history of changes below. Board schematics are open, software is open, so create your own! Pinecil breakout board lets you use JTAG, GPIO, A2D, SPI, and more Some additional features and information, useful to developers: Programmable RISC-V BL706 embedded processor The v2 model allows BLE Bluetooth control because of the switch to the Bouffalo BL706 MCU 0.69-inch monochrome display that can render text or graphics Support for idle detection, sleep mode of tip, automatic shut-down Programmable with tools from Bouffalo Labs, HomeBrew or Linux RISC-V Authenticity There are no PINE64 Pinecils sold on AliExpress. They are not made by PINE64. There are no authorized resellers on AliExpress. Some manufacturer has copied the PINE64 company name, trademark and Pinecone logo and is selling a product made to look like Pinecil through many store fronts, but it is not an authentic. They use a different type of box, i.e., a blue or red box. They are fake copies and do not go through the same quality control as PINE64. It is unclear what type of chips or poor quality cloned chips are used in them. They are not recommended. Genuine new PINE64 Pinecil only comes in a black handle color with a green silicone thumb grip. The original V1 always came in a black box. This model was discontinued and has not been made or sold by PINE64 or authorized resellers since July 2022. The current official Pinecil (a.k.a. V2 model) comes in a white box (see Pictures), it has a black color handle with a green silicone thumb grip. If you receive anything that has the PINE64 brand name and Pinecone and does not look like described, it is a fake copy that was not made or authorized by PINE64 or the Pine Store Ltd (see Authenticity Checker below, all real PINE64 Pinecils purchased after Aug. 2, 2022 should pass the checker if they are genuine). Pinecil V2 Authenticity Checker Pinecil V2 comes with a unique internal ID/Serial number. This allows people to check if the Pinecil V2 is Authentic. To be more sure, update to the newest stable Ralim's IronOS and check again, see Firmware & Updates. Authenticity Checker here. Where to buy a Pinecil PINE64 Official Stores Main global PINE64 store (ships from China, exports only, Global, VAT not included). Amazon-USA official pine64 store (ships from USA, has Pinecil V2 - no tips/accessories) PINE64 EU PINE64 EU store (ships from EU, VAT+ 2-year warranty included per EU laws) Affiliates AmeriDroid (offers pre-order, ships to USA/Global/Brazil) Bitcompact (ships from Canada) Blinkyparts.com (ships from Germany to worlwide, 2-year warranty included) Droneit (ships from Sweden, sells all Pine tips/accessories). Eleshop.eu (ships from EU, offers pre-order, 2-year warranty included per EU laws). In Netherlands, use this NL link. Handheld Legend (ships from USA to worldwide). Keycapsss (ships from Germany to EU/AUS/Global) Testclips (ships from GB) Typeractive (ships from USA to 55 countries). URS Electronics (local in-store only sales in Portland, Oregon, USA) Reference: https://pine64.com/affiliates/ Why buy from a legitimate seller? The PINE64 Mission is to get hardware into the hands of open source developers and tinkerers. Buying authentic Pinecils supports that mission (see this article). In July 2022, all final stock sold out of Pinecil V1 (GD32VF103 mcu) at the Pine Store & all legit resellers. There are zero new authentic Pinecil V1 sold in the world after July 2022. Pinecil V1 was made in a black color with a light blue finger grip. PINE64 never made an all-blue Pinecil, and never used blue or red color boxes (those are fake copies with fake PINE64 logos and Pinecone). Starting Aug. 2, 2022, only the new Pinecil V2 model with the new BL706 Bluetooth Low Energy (BLE) MCU are made by PINE64 and sold at all authentic resellers. They are black with a green finger grip (see photos in the Picture section). The new model has anti-counterfeiting features. Authentic Pinecil using the newest official GitHub IronOS firmware, will successfully pass the Authenticiy Checker website. If a new Pinecil (post Aug. 1, 2022) does not have a BL706 chip, then it is a fake copy. If the AliExpress seller tries to show "CE certification" documents as some type of proof, those are all copied public info from this Wiki page in the Certifications section. PINE64 publishes those as they are the CE/FCC certifications for the stamps on the Pinecil. They are not proof of purchase from the Pine Store Ltd. Shipping & Tracking See the Shipping and Tracking article, which includes: How does it work? Courier options Tracking Why doesn't Pine store ship to my country? Usage Overview Prep Tasks Clean new cartridges/tips with isopropyl alcohol (IPA) to remove factory residue before installing (even if it looks clean). If you have no IPA, at least try a paper towel, especially clean the white end with the two silver electric contacts (do not use water; it could get into the seam line on the white end). This resolves issues with jumping temperatures or random no-tip symbol from poor electric contact. Do not try to bend the two internal contacts, they are made of a thin stiff spring metal and could break (not soft copper), but you could wipe them with IPA (including the small PCB pad below the contacts). 1. Install the tip: The Pinecil comes with a separate heating element, the tip. Remove the screw from the front top-side of handle. Then, gently push the tip all the way back until the wide collar/guard is touching the front of the plastic (see photo). Gently tighten or loosen this screw to install or swap the tip. (careful, tiny screws break easy, if tip does not fall out, it's tight enough) The bottom front screw should not touch the tip, it only holds the handle together (see Fasteners). Always unplug before swapping tips if you have multiple tips. 2. Supply power: the USB-C port, connected to any supply, is enough power to show the display screen, but not necessarily enough to heat the tip. USB port at 5 volts (i.e., laptop) shows DC Low, this is enough for firmware updates and to view the menu, but not to run the soldering iron. See Power section for details on power options. QC 12V phone chargers will not work, too weak 3. Heat the tip: plug Pinecil into an appropriate power supply. Clicking [+] starts the tip heating. The detailed display option shows power draw, current temperature, supply voltage, and time until sleep mode starts. Adjust the target temperature with further clicks of [+] and [-] buttons. Wait a few seconds for the regular display to return, then hold down [-] for a moment to turn the heat off. You can observe the temperature measurement go up and down. Certain settings involve holding down both buttons (see GitHub IronOS for details on firmware settings). 4. Using the Settings Menu: To check the firmware version, hold down the [-] button. It will display something like "v2.19.A3BBABC 13-07-22". This is the firmware number and release date, the date is July 13, 2022 in the example. Clicking [-] when heat is off steps through main categories menus to control a variety of settings, see Getting started with menus section. Clicking [-] also returns to the regular display of temperature and supply voltage (this view varies if you activate detailed idle). At other times it may show power draw. Click [-] to scroll to the the main menu section desired (i.e., User Interface). Then click [+] button to change various internal settings. Then click [-] again to go to the next item in the sub-menu. 5. Important notes: The iron will "sleep", switching to a lower temperature, after it has been put down for a short time, and heat up again when it is picked up. Calibration of the Tip temperature is usually not necessary and should only be done if the tip is off by +/- 5 °C or temperature is behaving oddly. See instructions to calibrate the tip in the firmware on GitHub IronOS. For Safety, unplug the soldering Iron when not in use or left unattended. To heat up the tip, we need a power supply that can provide at least 12V 3A to run. This is the bare minimum. Pinecil will heat slowly at only 12V/3A. To maximize performance, higher Volts/Amps/Watts is recommended (see Pinecil Power Supplies). Option 1: a USB-C supply that can negotiate up to such a voltage. For good performance and soldering experience, a USB-C PD65W, 20V, 3+ A charger is recommended (suitable for most users). Option 2: a supply with a DC 5525 barrel connector (+ pos center, - neg outside) that supplies anywhere from 12V-21V, 3+ amps (V1 Pinecil) or 12V-24V, 3+ amps (V2 Pinecil). Option 3: use a battery, i.e., an 18V-21V tool Battery with a Power Wheels adapter, and a cable to plug into the Pinecil DC5525 barrel jack. You may have a suitable supply already that could be used, (see Pinecil Power Supplies). While 12V-3A will work, it will not heat the tip as quickly and efficiently as a PD65W-20V USB-C charger or a higher rated DC barrel charger. See warnings about using random DC barrel chargers, not all of them have the correct polarity or DC 5525 style plug and some may be too high of voltage which could damage the Pinecil. Getting Started with the Menu Getting Started Guide in GitHub/IronOS Main Settings Menu: updated list is found in the firmware repository Settings Menu Power settings: settings related to power, battery cells, input voltage. Soldering settings: settings for soldering such as, boost temps, increments for temperature change Sleep mode: power & tip saving, such as sleep mode, sleep temperature, and shutdown modes, motion sensitivity User interface: settings such as, units C/F, display orientation, button reversal, animation speed, brightness, boot logo duration Advanced settings: assorted catchall for settings that don't fit elsewhere or settings that require some thought before use. Restore default/factory settings is here. It will not change the firmware version, but rather resets the menu back to IronOS defaults. This is good to do after a major firmware update as settings may have been altered and need to be re-selected/customized again to work as expected. Hidden Debug Menus: also available, see GitHub/IronOS Optional Advanced Modifications Hall Effect Sensor: add a sensor that activates with a magnet to put the Pinecil to sleep when it enters a holder or stand. Thumb Screws: switch tiny tip holder screw to an easy to use thumb screw. LED light ring install: add a PCB light ring to Pinecil. Video of the process LED light install: add two LEDs to Pinecil. RGB internal LED - pink and blue LEDs. Live Community Chat Need troubleshooting advice for the PINE64 Pinecil soldering iron? Join through one of the community chat links below. Protocol Droid bot: the live chat is bridged to Discord, Telegram, Matrix and IRC. Those bridges will not have all the features available within all platforms, but the chat is relayed between all four by a bot named "Protocol Droid". Live chat has volunteer members that are not paid PINE64 employees, but occasionally get official information. The Pinecil channel is the most popular for questions and troubleshooting such as help installing Firmware or use of Tips (and where most people discuss Pinecil/soldering). The pinecil-dev channel is a more limited chat for developers working on software/firmware such as IronOS or the new BLE Bluetooth apps. Discord Telegram Matrix Firmware & Updates Pinecil is designed to use only 1 power port at any time. Only the USB-C cable should be plugged in during firmware updates. Never attempt to use both rear ports at the same time or the PC and Pinecil will be damaged. See the Pinecil Firmware article for instructions on how to update Pinecil, this includes: Overview Flash Mode Update V2: Windows Update V2: Linux and Mac Bluetooth (BLE) for V2 Troubleshoot V2 Flashing Build the Blisp Flasher from Code Update V1 General Firmware Details Boot Logo Art Problems with IronOS firmware? Read documents here. If the answer is not found, open a ticket here or join the live Pinecil community chat. Development Projects Author Project Homepage Description Supported Ben Brown (ralimtek) Ralim's IronOS Official Pinecil firmware BL706, GD32VF103TB, Stm32f103 Marek Kraus gamiee/gamelaster Blisp V2 Flasher CLI Updater for Pinecil V2, BL70x MCU Windows, Linux, Mac Marek Kraus gamiee/gamelaster Pinecil V1 Flasher Pinecil V1 GUI Updater Windows, Mac Arkaitz Goni Hedger spagett1 PineFlash Pinecil V1 GUI Updater Linux, Mac Builder555 BLE PineSAM Bluetooth LE Settings &'''
year_published = 2025
clearnet = "https://wiki.pine64.org/wiki/Pinecil"
