title = "PinePhone Pro - PINE64"
full_description = '''PinePhone Pro From PINE64 Jump to navigation Jump to search Rendering of the PinePhone Pro The PinePhone Pro is PINE64's flagship smartphone announced on October 15, 2021. It features 4GB of RAM, an 128GB eMMC and is using an Rockchip RK3399S SoC, which is a specialized version of the RK3399 made specifically for the PinePhone Pro. Contents 1 Introduction 1.1 State of the software 1.2 Editions and revisions 1.3 Help and support 2 First time setup 3 Software 3.1 Software releases 3.2 Boot order 3.2.1 Boot from microSD card temporarily 3.2.2 Boot from microSD card permanently 3.2.3 Notes 3.3 Installation instructions 3.3.1 Flashing to microSD card 3.3.2 Flashing to the eMMC 3.4 Troubleshooting 3.4.1 The battery is fully drained 3.4.2 The installation is corrupted 3.5 Bootloaders 3.5.1 U-Boot 3.5.2 Tow-Boot 3.5.3 levinboot 4 Privacy switch configuration 5 Modem 5.1 AT commands 5.2 VoLTE 5.3 APN settings 5.4 Carrier support 5.5 Documents 5.6 Firmware update 5.6.1 Custom firmware 5.6.2 Stock firmware 5.7 Firmware modifications 5.8 GPS / GNSS 5.9 Voice mail 6 Specifications 7 Modifications and repairs 7.1 Replacing the mainboard 7.2 Replacing the screen 7.3 Spare parts not available in the Pine Store 8 Components 9 Datasheets, schematics and certifications 10 Factory Test Build for Hardware Checking 11 Using Factory Test Build for Battery charging 12 Press 13 External links Introduction The PinePhone Pro is PINE64’s second smartphone and a successor to the original PinePhone. It does not, however, replace the original PinePhone. It should also not be considered a second generation PinePhone; it is a higher-end device, with much better specs, aimed at those who wish to daily-drive a open system stack. Achieving this goal will, however, take time as the software and overall smartphone software ecosystem needs to mature. State of the software (view separately) Presently the PinePhone Pro Explorer Edition is aimed at Linux developers with an extensive knowledge of embedded systems and/or experience with mobile Linux. It will take time for all the PinePhone Pro’s functionality to reach software parity with the original PinePhone and for mobile operating systems, in more general, to reach a higher degree of maturity. Bear in mind that the software for these smartphones is still in a very early stage, with most of the software being in alpha or beta state. That's especially also the case for scalability of applications, their availability and practicability, any hardware function implementations and the firmware. The software is provided as is. There is no warranty for the software, not even for merchantability or fitness for a particular purpose. The following table lists the feature functionality status of the unaltered pre-installed factory image of the current shipping batch and as comparison an up-to-date reference image (no responsibility is accepted for the accuracy of this information, the list is provided and updated by the community). If you have any questions regarding the current state of the software or of specific features working, please don't hesitate to ask in the community chat before buying the device: Discord: #pinephone under https://discord.gg/pine64 IRC: #pinephone on irc.pine64.org. Note: please consider Matrix, Discord or Telegram due to the volatile nature of IRC Matrix: https://app.element.io/#/room/#pinephone:matrix.org Telegram: https://t.me/pinephone The software is written by the community, any contributions towards the community projects are greatly appreciated! Please see "How to Contribute" to learn about how to contribute to the software projects and "Where to Report Bugs" to learn about where to report bugs. Functionality Component Status (factory)¹ Status (updated)² Notes Bootloader Bootloader Critical bugs Some critical software bugs currently not fixed yet: A drained battery causes U-Boot to bootloop (cause is known and currently being worked on);Workaround Occasionally the eMMC fails to initializeReport. Note: Tow-Boot is now pre-installed on the SPI from the factory - issues need verification to be issues with Tow-Boot. SPI Implemented Devices bought after end of July 2022 come with Tow-Boot flashed to the SPI memory, making it considerably easier to flash the device and boot from microSD card. Boot GUI Not implemented Currently there is no graphical boot selection implementedPossibly planned Operating System Stability WIP Suspend Experimental Audio is often higher pitched after waking up from suspend due to a bug, make sure to update your systemReportReport Updates WIP The pre-flashed and outdated operating system on the eMMC often gets corrupted after updatingExample; Pacman database lock preventing updatesSolution; Keyring bug[Solution is to run "pinephonepro-post-install" script as root] Modem General WIP Alternative firmware; Slow wakeupReport; Some carriers blocking specific TANs in their networkPinePhone Carrier Support; Note: Proprietary firmware Phone WIP The modem connection crashes frequently, which can lead to missed callsReportAlternative firmware; Slow wakeupReport; bad call audio qualityReport; Audio is often higher pitched after waking up from suspend due to a bugReportReport SMS Working SMS functionality is expected to work. In certain cases the functionality might be blocked by a clogged modemReport; Some bugs MMS WIP MMS functionality is integrated into the application "Spacebar", some bugs remaining and expected Push notifications Not implemented Receiving push notifications while the phone is suspended is not implemented Components LCD WIP Hardware issueDetails Touch Working Rear camera Not working WIP Camera work-in-progress with DTS fix[Citation]; userspace still needs to do some catching updebugging article; Green image tint[Citation] Front camera Not working WIP Camera work-in-progress with DTS fix[Citation]; userspace still needs to do some catching updebugging article; Green image tint[Citation] Camera flash Critical issues Hardware issueDetails; Note: /sys/class/leds/white:flash WiFi Working WiFi is expected to work. The firmware does not support monitor mode and package injection. Note: Proprietary firmware Bluetooth WIP Bluetooth not necessarily working for calls yet due to missing audio routing[Citation]; Bluetooth in general dodgy under Pulseaudio.Info Note: Proprietary firmware GNSS/GPS WIP aGPS to be implementedSee original PinePhone article; long loading times to get a GPS fix[Citation]; No preinstalled application[Citation] Sensors WIP "Geo Magnetic Sensor" (af8133j): Status unknown (at /sys/bus/i2c/devices/4-001c/iio:device1) "Accelerometer / Gyroscope" (mpu6500): Working (at /sys/bus/i2c/devices/4-0068/iio:device2) "Ambient light / Proximity" (stk3311): Working after updating Vibration motor Working Notification LED Working Buttons Working Power buttons and volume buttons are working. Accessory compatibility, spare parts Keyboard Add-on WIP The keyboard add-on compatibility is work-in-progress. LoRa Add-on Not implemented No software support implemented Qi Wireless Charging Add-on WIP Wireless charging with the add-on case is expected to work to some degree. Certain software functionality and a driver is currently missing[Citation] Fingerprint Reader Add-on Not implemented No software support implemented Spare parts Partial Some spare parts now available in the store.Store Software notes Waydroid Working Waydroid is an Android container used to run Android applications. ¹ Status of the features at the time of the last factory installation without updates ² Status of the features with an up-to-date reference image Editions and revisions Similarly to the original PinePhone, various PinePhone Pro editions are planned, the first of which is the Developer Edition (aimed at developers, as the name entails) followed by the Explorer Edition, which is aimed at early adopters. PinePhone Pro Developer Edition PinePhone Pro Explorer Edition Help and support Still have any questions regarding software, shipping, or ordering after reading this Wiki? Please don't hesitate to contact the community in the bridged community channels for detailed answers or simply to chat with friendly people in the community! See Main Page#Community and Support. Please keep in mind that PINE64 is not like a regular company (see the PINE64 philosophy) and that support resources are limited - the best way to get support quickly is to ask in the community chat! Please only contact the PINE64 support directly if questions couldn't be solved via the community chat or this wiki. First time setup A protection foil isolates the battery for the shipping. When shipped the battery is isolated from the device using a protective plastic tab, which is required to be removed before using the phone. The battery will not charge or boot until it is removed and the battery is connected again. Note: To remove the sticker after unboxing the phone: Carefully remove the back panel using the notch in the corner of the back cover without overbending it. Then remove the battery. Peel off the clear plastic sticker below it, which isolates the charging contacts and reinsert the battery. The SIM card has to be placed in the lower slot, while the microSD has to be placed in the upper slot. Devices shipped after the end of July 2022 do only accept a nano-SIM, the SIM is inserted into a carriage released by slightly pulling on the handle in the lower slot (for information regarding devices shipped prior to end of July 2022 see below). The microSD belongs in the upper slot, the SIM card in the lower slot. Note: Information regarding devices shipped prior to end of July 2022: The PinePhone Pros shipped prior to the end of July 2022 come with a micro-SIM slot instead of a nano-SIM slot. Do not insert an empty micro-SIM adapter into the phone and do not release the nano-SIM inside the adapter, as it will get stuck on the contact pins. If the nano-SIM got released inside the adapter inside the phone, carefully reinsert the nano-SIM card without moving the adapter. In that case do not pull on the empty adapter as it will get stuck on the contact pins and damage them! Software The software section explains how to install the available software releases for the PinePhone Pro to the internal eMMC or a microSD card, how to boot them and how to solve common booting issues. Software releases The PinePhone Pro Software Releases page has a complete list of currently supported phone-optimized operating system images that work with the PinePhone Pro. Note: Images of the regular PinePhone are not compatible with the PinePhone Pro. Boot order The RK3399S processor in the PinePhone Pro searches for the bootloader (such as U-Boot or Tow-Boot) in the following order: SPI flash eMMC (the internal memory) MicroSD card Boot from microSD card temporarily To temporarily boot from an inserted microSD card do the following: On the Explorer Edition ordered after November 2023 the microSD card is first in boot order due to using rk2aw instead of Tow-Boot, see here. On the Explorer Edition ordered after July 2022 hold the volume down key while powering on the device. The batches bought after July 2022 come with Tow-Boot flashed to the SPI, which offers additional functionality over U-Boot as bootloader. On the Explorer Edition ordered between January and July 2022 hold the RE button underneath the cover for a few seconds, while powering on the device. If the button is labeled RESET instead of RE please verify if the device is a regular PinePhone (or the Developer Edition). This is required because older batches don't ship with Tow-Boot on the SPI. Flashing Tow-Boot can be caught up by following this instruction. Note: If Tow-Boot is flashed later, the microSD card can be selected at boot with the volume down key as well. On the Developer Edition (sold to selected developers only) the SPI and the eMMC can be bypassed by shorting the bypass test points while booting. The process is explained in the article PinePhone Pro Developer Edition. Please join the community chat for any questions regarding the process. The RE button disables the SPI and the eMMC at the hardware level while the button is held and the PinePhone Pro will try to boot from the next available boot medium, which is the microSD card. Note: When holding the RE button (or when shorting the contact points in case of the Developer Edition) for a longer time at boot the operating system will not initialize the SPI and eMMC and it will not be possible to write to these storage mediums until the next reboot. Note: The bootloader uses its own boot order for loading the kernel and other core operating system components at boot, which for example may result in the boot loader residing on the eMMC loading and booting the kernel from a microSD card. Boot from microSD card permanently The bootloader (such as U-Boot) resides in the free space in front of the first partition. Wiping the bootloader from the eMMC to make the PinePhone Pro boot from microSD card can be done using sudo dd if=/dev/zero of=/dev/mmcblk2 seek=64 count=400 conv=fsync. Formatting the drive or deleting the partition table is not sufficient to wipe the bootloader. Notes If you received your device after July of 2022, the bootloader resides on the SPI. See RK3399 boot sequence for further details regarding the boot sequence. Installation instructions The software releases can be installed (the process is being referred to as flashing) to the eMMC or to an microSD card. Flashing to microSD card To install an image to the microSD card: Download a compatible image from PinePhone Pro Software Releases. Important: Typically the image will be compressed in an archive file to reduce the download size (such as .gz or .xz). Extract the image from its archive file to get the file with the file extension .img. Write the image to your microSD card using your favorite method, examples: Using dd: On the device you're flashing the microSD card from, find the correct device under lsblk and then flash the image to the microSD card using sudo dd if=IMAGE.img of=/dev/[DEVICE] bs=1M status=progress conv=fsync. Make sure the target is the whole microSD card and not its first partition (sdc1 or mmcblk0p1 are wrong!). Using bmaptool: Make sure to select the correct device using lsblk. Then run bmaptool with the correct device: Download the IMAGE.xz and the IMAGE.bmap files, then run bmaptool copy --bmap IMAGE.bmap IMAGE.xz /dev/[DEVICE]. This takes around 2.5 minutes to flash a 4 GB file. Using a graphical tool: A graphical tool such as Gnome Disks under Linux or Etcher under Windows may also be used. Insert the microSD card into the top slot of the PinePhone Pro. Make sure the microSD card is inserted all the way and that the notch of the right side of the microSD card is not visible anymore, see here. Boot the device using the following method: On the Explorer Edition ordered after November 2023 boot the phone without any further action. On th'''
