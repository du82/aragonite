title = "PINE A64 - PINE64"
full_description = '''PINE A64 From PINE64 Jump to navigation Jump to search The PINE A64 The PINE A64 and the PINE A64+ is PINE64's first Single Board Computer powered by Allwinner’s A64 quad-core ARM Cortex A53 64-Bit SoC. There are many Operating Systems available for the PINE A64 created by the open source community and various partner projects. Currently the majority of Linux distributions for the PINE A64 are using mainline Linux but there are a number of BSP-based distribution and / or legacy systems that can be downloaded too. Contents 1 Software releases 2 Accessories Step-by-Step Guides 3 SoC and Memory Specification 3.1 CPU Architecture 3.2 GPU Architecture 3.3 System Memory 4 Board Features 4.1 Video 4.2 Audio 4.3 Network 4.4 Storage 4.5 Expansion Ports 5 Information, Schematics and Certifications 6 Datasheets for Components and Peripherals 7 Pine A64 POT 8 Other Resources Software releases Under PINE A64 Software Releases you will find a complete list of currently supported operating system images, which work with the PINE A64 and PINE A64+, as well as other related software. Accessories Step-by-Step Guides Under Accessories Step by Step Guides you can find instructions and guides pertaining to: Enclosures Bluetooth and WiFi module Real Time Clock (RTC) battery Real Time Clock (RTC) battery holder First and third party cases Featured 3D printed cases (and more). SoC and Memory Specification Based on Allwinner A64 CPU Architecture Quad-core ARM Cortex-A53 Processor@1152Mhz A power-efficient ARM v8 architecture 64 and 32bit execution states for scalable high performance Support NEON Advanced SIMD (Single Instruction Multiple Data) instruction for acceleration of media and signal processing function Support Large Physical Address Extensions(LPAE) VFPv4 Floating Point Unit 32KB L1 Instruction cache and 32KB L1 Data cache 512KB L2 cache GPU Architecture ARM Mali400MP2 Dual-core GPU Support OpenGL ES 2.0 and OpenVG 1.1 standard System Memory RAM Memory Variants: 512MB, 1GB and 2GB DDR3. Storage Memory: PINE A64 boards do not have built-in Flash memory but use bootable microSD Cards or USB attached storage. Board Features Video Digital Video Port (Type A - full) Audio 3.5mm stereo earphone/microphone plug Network 10/100/1000Mbps Ethernet (PINE A64+ version), 10/100Mbps Ethernet (PINE A64 version) WiFi 802.11 b/g/n with Bluetooth 4.0 (optional) Storage microSD - bootable, support SDHC and SDXC, storage up to 256GB USB - 2 USB2.0 Host port Expansion Ports DSI - Display Serial Interface, 4 lanes MiPi, up to 1080P CSI - CMOS Camera Interface up to 5 mega pixel TP - Touch Panel Port, SPI with interrupt RTC - Real Time Clock Battery Connector VBAT - Lithium Battery Connector with temperature sensor input Wifi/BT Module Header - SDIO 3.0 and UART 2x20 pins "Pi2" GPIO Header 2x17 pins "Euler" GPIO Header 2x5 pins "EXP" Console Header Information, Schematics and Certifications Board Dimensions: 133mm x 80mm x 19mm Input Power: DC 5V @ 2A, 3.7V Li-Ion battery connector, microUSB connector, Euler connector Schematics and general files: Power Consumption: 2.5W PINE A64 Connector Layout @courtesy of norm24 PINE A64 Heat Sink Location @courtesy of norm24 PINE A64 Connector List PINE A64 Pi-2/Eular/Ext Bus/Wifi Bus Connector Pin Assignment (Updated 15/Feb/2016) Good documentation about PINE A64, A64+, and A64-LTS GPIO pins article Board Model Comparison Board schematics: PINE A64 512MB Rev B Board Schematic PINE A64+ 1GB Rev B Board Schematic PINE A64+ 2GB Rev C Board Schematic PINE A64 Wifi/BT Module Schematic Stereo audio DAC schematics: PINE A64 Stereo audio DAC schematics Certifications: Disclaimer: Please note that PINE64 SBC is not a "final" product and in general certification is not necessary. However, PINE64 still submit the SBC for FCC, CE, and ROHS certifications and obtain the certificates to prove that the SBC board can pass the testing. Please note, a final commercial product needs to perform its own testing and obtain its own certificate. PINE A64 FCC Certificate PINE A64 CE Certificate PINE A64 RoHS Certificate Datasheets for Components and Peripherals Allwinner A64 SoC information: Allwinner A64 SoC Brief Introduction Allwinner A64 SoC Data Sheet V1.1 (Official Released Version) Allwinner A64 SoC User Manual V1.0 (Official Release Version) X-Powers AXP803 PMU (Power Management Unit) information: AXP803 PMIC Datasheet PINE A64, PINE A64+ and SOPINE Related: 5MPixel CMOS Camera module information: PINE64 YL-PINE64-4EC 5M Pixel CMOS Image Sensor Module (Description in Chinese) S5K4EC 5MP CMOS Image Sensor SoC Module Datasheet S5K4EC 5MP CMOS Image Sensor SoC Chip Datasheet S5K4EC 5MP CMOS Image Sensor Driver Source Code in C language Early version Camera module information: Bonsen Kexin V118-A64-GC2145-HM5065 CMOS Image Sensor Module HiMax 5MP CMOS Image Sensor SoC LCD Touch Screen Panel information: 7.0" 1200x600 TFT-LCD Panel Specification Touch Panel Specification GOODiX GT911 5-Point Capacitive Touch Controller Datasheet Lithium Battery information: 8000mAH Lithium Battery Specification Ethernet PHY information: Realtek RTL8211 10/100/1000M Ethernet Transceiver for PINE A64+ Board Realtek RTL8201 10/100M Ethernet Transceiver for PINE A64 Board Wifi/BT module information: PINE A64 Wifi/BT Module Schematic Realtek RTL8723BS WiFi with BT SDIO Enclosure information: Playbox Enclosure 3D file ABS Enclosure 3D file Outdoor Aluminum Cast Dust-proof IP67 Enclosure Drawing Connector information: 2.0mm PH Type connector specification use in Lithium Battery (VBAT) port and RTC Battery port 0.5mm Pitch cover type FPC connector specification use in DSI port, TP port and CSI port Remote control button mapping Official Remote Control for the PINE A64 Button Mapping Pine A64 POT PINE A64 Peripheral On Top (POT) and Related Devices WiFi Remote I2c Quick Start Guide Other Resources Linux Sunxi Wiki page on PINE A64 PINE A64 Linux build scripts, tools and instructions by Longsleep PINE A64 Linux image by Longsleep PINE A64 Linux Github by ayufan PINE A64 Android Github by ayufan Armbian's PINE A64 Page Collection of scripts to set up a minimal Xenial 14.04.3 / Debian 8 Jessie root filesystem Contributed By Uli Middelberg Linux Image created by Andre Przywara PINE A64 with HypriotOS by Dieter and Govinda H2testw 1.4 – Gold Standard In Detecting USB Counterfeit Drives F3 - an alternative to h2testw Benchmarking The Low-Cost PINE 64+ ARM Single Board Computer by Michael Larabel A series of Youtube video on PINE A64 Developers Board by Michael Larson PINE64 Quick Start Guide (with Gotchas) Shrinking images on Linux by FrozenCow FFmpeg Hardware encoder Cedrus264 on Linux by avafinger Retrieved from "https://wiki.pine64.org/index.php?title=PINE_A64&oldid=20549" Categories: PINE A64Allwinner A64'''
