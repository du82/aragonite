title = "SOEDGE - PINE64"
full_description = 'SOEDGE From PINE64 Jump to navigation Jump to search The SOEDGE The SOEDGE is a 3TOPS compute module that can be paired with the SOEDGE Baseboard, the Clusterboard or USB 3.0 and PCIe adapters for development. It can connect to a SBC, such as the ROCKPro64 or a regular PC. Contents 1 Software releases 2 SoC and Memory Specification 2.1 CPU Architecture 2.2 Neural Process Unit NPU Capability 2.3 System Memory 3 Schematics and certifications 4 Datasheets for Components and Peripherals 5 Debugging 5.1 Serial Console Software releases The SOEDGE software releases can be found in the article SOEDGE Software Releases. SoC and Memory Specification Based on the Rockchip RK1808. CPU Architecture Dual-core ARM Cortex-A35 Processor@1600-2000Mhz A power-efficient ARM 64-Bit Armv8-A architecture AArch32 for full backward compatibility with Armv7 Support NEON Advanced SIMD (Single Instruction Multiple Data) instruction for acceleration of media and signal processing function Support Large Physical Address Extensions(LPAE) VFPv4 Floating Point Unit 32KB L1 Instruction cache and 32KB L1 Data cache AArch64 for 64-bit support and new architectural features TrustZone security technology Neon Advanced SIMD DSP and SIMD extensions VFPv4 Floating point Hardware virtualization support 128KB L2 cache Neural Process Unit NPU Capability NPU IP from Verisilicon Vivante Support max 1920 Int8 MAC operation per cycle Support max192 Int16 MAC operation per cycle Support max 64 FP16 MAC operation per cycle 512KB internal buffer One isolated voltage domain to support DVFS Acuity models Github System Memory RAM Memory Variants: 2GB DDR4. Storage Memory: 128Mb SPI Flash and optional eMMC module from 16GB up to 128GB Schematics and certifications SOEDGE module schematics: SOEDGE Module ver 2.0 20190919 Schematic SOEDGE Module ver 2.0 20190919 PCB Component Placement Top PDF file SOEDGE Module ver 2.0 20190919 PCB Component Placement Bottom PDF file SOEDGE Module ver 2.0 20190919 PCB Component Placement Top Drawing file SOEDGE Module ver 2.0 20190919 PCB Component Placement Bottom Drawing file SOEDGE Module Pin Assignment ver 1.0 in Excel format(includes comparison chart to SOPine) SOEDGE Module Pin Assignment ver 1.0 in Open Document format(includes comparison chart to SOPine) SOEDGE Neural AI Stick schematic: SOEDGE Neural AI Stick PDF file SOEDGE/SOPINE/PINE A64 WiFi/BT module schematics: PINE A64 Wifi/BT Module Schematic SOEDGE module together with the baseboard certification: Disclaimer: Please note that SOEDGE module is not a "final" product and in general certification is not necessary. However, SOEDGE module still submits the mpdel A baseboard for FCC, CE, and ROHS certifications and obtain the certificates to prove that can pass the testing. Please note, a final commercial product needs to perform its own testing and obtain its own certificate. Not yet available Datasheets for Components and Peripherals Rockchip RK1808 SoC information: Rockchip RK1808 ver 1.2 datasheet Rockchip TK1808 Technical Reference Manual Part 1 Rockchip RK809 PMU (Power Management Unit) information: Rockchip RK809 PMIC Datasheet DDR4 information: Micron DDR4 Datasheet eMMC information: PINE64 eMMC module schematic PINE64 USB adapter for eMMC module V2 schematic PINE64 USB adapter for eMMC module PCB in JPEG 16GB Foresee eMMC Datasheet 32GB/64GB/128GB SanDisk eMMC Datasheet SPI NOR Flash information: WinBond 128Mb SPI Flash Datasheet GigaDevice 128Mb SPI Flash Datasheet SOEDGE Related: LCD Touch Screen Panel information: 7.0" 1200x600 TFT-LCD Panel Specification Touch Panel Specification GOODiX GT911 5-Point Capacitive Touch Controller Datasheet Ethernet PHY information: Realtek RTL8211 10/100/1000M Ethernet Transceiver for SOEDGE model A baseboard Wifi/BT module information: SOEDGE/SOPINE/PINE A64 Wifi/BT Module Schematic Realtek RTL8723BS WiFi with BT SDIO Enclosure information: Playbox Enclosure 3D file ABS Enclosure 3D file Outdoor Aluminum Cast Dust-proof IP67 Enclosure Drawing Connector information: 2.0mm PH Type connector specification use in Lithium Battery (VBAT) port and RTC Battery port 0.5mm Pitch cover type FPC connector specification use in DSI port, TP port and CSI port Debugging Serial Console System Serial is located on PI-5 bus (11x2 GPIO header). TXD: Pin 6 (Yellow cable) (Connect to RXD on Serial adapter) RXD: Pin 8 (Orange cable) (Connect to TXD on Serial adapter) GND: Pin 10 (Black cable) (Connect to GND on Serial adapter) The default baudrate is 1500000, note that not all serial adapters support this high baudrate. Retrieved from "https://wiki.pine64.org/index.php?title=SOEDGE&oldid=19375" Categories: SOEDGERockchip RK1808'
