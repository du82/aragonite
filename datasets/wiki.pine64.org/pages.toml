title = "Ox64 - PINE64"
full_description = '''Ox64 From PINE64 Jump to navigation Jump to search The Ox64 Pinout of the production version Powered by RISC-V The Ox64 is a RISC-V based single-board computer based on the Bouffalo Lab BL808 RISC-V SoC with C906 64-bit and E907/E902 32-bit CPU cores supported by 64 MB of embedded PSRAM memory, and with built-in WiFi, Bluetooh and Zigbee radio interfaces. The Ox64 comes in a breadboard-friendly form-factor, has a microSD card slot, a USB 2.0 Type-C port, and many other peripheral interfaces for makers to integrate with sensors and other devices. Contents 1 Software Releases 1.1 Quick Links to the Source of OS Images Build 1.2 Software Development Kits 2 SoC and Memory Specification 2.1 CPU Architecture 2.2 System Memory 3 Board Features 3.1 Network 3.2 Storage 3.3 Expansion Ports 3.4 Audio 4 Board Information, Schematics and Certifications 5 Datasheets for Components and Peripherals 6 Compatible UARTs when in bootloader mode 7 Resources and Articles 8 Development Efforts 9 Building 10 Flashing 10.1 Prepare images for flashing 10.1.1 Optional: create a combined SoC image 10.1.2 Check that you have the required files for flashing 10.2 Set up your UART adapter 10.2.1 Option 1: Raspberry Pi Pico 10.2.2 Option 2: STM32 Bluepill 10.2.3 Option 3: Generic UART adapter 10.3 Download flashing tools 10.3.1 DevCube installation 10.3.2 CLI packages installation 10.4 Flashing the Ox64 10.4.1 CLI flashing method 10.4.2 BLDevCube flashing method 10.5 Erasing the microSD card 10.6 Flashing the microSD card 10.7 Booting for the first time 10.7.1 Connecting the Ox64 to your WiFi network 10.8 Appendix 10.8.1 Adding Nuttx RTOS Software Releases Quick Links to the Source of OS Images Build There is a community effort to bring updated kernels, peripherals and buildroot - Lots of communication happening in the #ox64-nutcracker channel. buildroot bringing all the work below together with a bootable kernel and updated filesystem images for SD cards U-Boot and OpenSBI work by Smauel Kernel IRQChip, SDCard, and (WIP) USB by arm000, Alexander Horner and others OpenBouffalo Firmware low_load drivers by Fishwaldo and others Original Linux Images provided by Bouffalo - Very basic alpha build which are only fit for board bring up and testing purposes. Linux for BL808 Installation Instructions for Linux on BL808 (Chinese) Installation Instructions for Linux on BL808 (machine translated to English) Toolchain: elf_newlib_toolchain/bin/riscv64-unknown-elf-gcc (Xuantie-900 elf newlib gcc Toolchain V2.2.5 B-20220323) 10.2.0 linux_toolchain/bin/riscv64-unknown-linux-gnu-gcc (Xuantie-900 linux-5.10.4 glibc gcc Toolchain V2.2.4 B-20211227) 10.2.0 cmake version 3.19.3 Software Development Kits BL808 MCU SDK BLDevCube Flashing Tool for Windows, macOS and Ubuntu x64 Ox64 UART Flashing Guide, see the notes BL808 Demo Firmware: bl808_demo_event.bin, see the notes BL808 UART Log Firmware: whole_flash_data.bin, see the notes BL808 DVK Quick Start OpenSBI for BL808 Rust Peripheral Access Crate (PAC) for BL808 System View Description (SVD) for BL808 SoC and Memory Specification Based on the Bouffalo Lab BL808 CPU Architecture T-Head C906 480 MHz 64-bit RISC-V CPU: Supports RISC-V RV64IMAFCV instruction architecture Five-stage single-issue sequentially executed pipeline Level-1 instruction and data cache of Harvard architecture, with a size of 32 KB and a cache line of 64B Sv39 memory management unit, realizing the conversion of virtual and real addresses and memory management jTLB that supports 128 entries Supports AXI 4.0 128-bit master interface Supports core local interrupt (CLINT) and platform-level interrupt controller (PLIC) With 80 external interrupt sources, 3 bits for configuring interrupt priority Supports BHT (8K) and BTB Compatible with RISC-V PMP, 8 configurable areas Supports hardware performance monitor (HPM) units See here T-Head E907 320 MHz 32-bit RISC-V CPU: Supports RISC-V RV32IMAFCP instruction set Supports RISC-V 32-bit/16-bit mixed instruction set Supports RISC-V machine mode and user mode Thirty-two 32-bit integer general purpose registers (GPR) and thirty-two 32-bit/64-bit floating-point GPRs Integer (5-stage)/floating-point (7-stage), single-issue, sequentially executed pipeline Supports AXI 4.0 main device interface and AHB 5.0 peripheral interface 32K instruction cache, two-way set associative structure 16K data cache, two-way set associative structure See here T-Head E902 150 MHz 32-bit RISC-V CPU: See here System Memory Embedded 64MB PSRAM Board Features Network 2.4 GHz 1T1R WiFi 802.11 b/g/n Bluetooth 5.2 Zigbee 10/100 Mbit/s Ethernet (optional, on expansion board) Storage On-board 16 Mbit (2 MB) or 128 Mbit (16 MB) XSPI NOR flash memory MicroSD, supports SDHC and SDXC (only on the 128 Mbit version) Expansion Ports USB 2.0 OTG port 26 GPIO pins, including SPI, I2C and UART functionality, possible I2S and GMII expansion Dual-lane MiPi CSI port, located at USB-C port, for camera module Audio Microphone (optional, on the camera module) Speaker (optional, on the camera module) Board Information, Schematics and Certifications Pinout for wiring ethernet PHY to EMAC Baseboard dimensions: 51 mm x 21 mm x 19 mm x 3.5 mm (breadboard friendly) Input power: 5 V, 0.5 A through the microUSB or USB-C ports Production version schematic: Ox64 Schematic 20221018 v1.1 Ox64 PCB Component placement(ToP) 20221018 v1.1 Ox64 PCB Component placement(Bottom) 20221018 v1.1 Prototype (dispatched to developers) schematic: Ox64 Schematic 20221007 v1.0 Ox64 PCB Component placement(ToP) 20221007 v1.0 Ox64 PCB Component placement(Bottom) 20221007 v1.0 Certifications: Disclaimer: Please note that PINE64 SBC is not a "final" product and in general certification is not necessary. Not yet available Datasheets for Components and Peripherals Bouffalo BL808 SoC information: Bouffalo Lab BL808 SoC Datasheet Bouffalo Lab BL808 SoC Reference Manual SPI NOR Flash information: GigaDevice 16Mb XSPI-Flash Datasheet GigaDevice 128Mb XSPI-Flash Datasheet Winbond 128Mb QSPI-Flash Datasheet (W25Q128JWSQ) Power Regulator information: Innovation Analog Tech IA2014 Step_down Converter Datasheet MicroSD socket information: Push type microSD socket specification Compatible UARTs when in bootloader mode When the Ox64 is in bootloader mode, some UARTs are unable to communicate with it. When this is the case, utilities such as BLDevCube are unable to actually program the device. If you see "Shake hand fail" and an empty ack, and your device is in bootloader mode, then it is likely an incompatible UART. The below devices have been tested and verified as working: Raspberry Pi Pico - running the following UART firmware (GP4 and GP5 are used for port 0, GP12 and GP13 for port 1) Compiled binary for Pi Pico and connectivity diagram is here ESP32 with CP210x - bridge the EN pin to ground to disable the ESP32 itself, and then connect the TX on the esp32 to 14 on the Ox64 and RX to pin 15. Note that only baud rate 115200 works, and this doesn't seem to work for everyone) Stand-alone CP2102 dongle works at 115200 baud. Brand used was HiLetgo. STM32F401 BlackPill - running the Black Magic Debug firmware STM32F103C8T6 BluePill - running Black Magic Debug. Some UART adapters based on the FT232H (note that the FT232RL does not work, and neither does the Pine 64 JTAG) Some CH340G based adapters work and some don't. Flipper Zero UART-Bridge works with baud rate set to 230400. Resources and Articles A short video on how to connect to the Ox64, flash and boot Another video that covers soldering pins, connecting via Pi Pico and flashing Linux and U-Boot Step-by-step tutorial for how to build, flash and run Ox64 First batch of Ox64 won't appear as USB serial port First batch of Ox64 tested OK with CH340C/G First thoughts on the (a)symmetry of Bouffalo Labs BL808 as in Pine64 Ox64 The $8 linux computer (with picoprobe-rp2040 programming instructions) Building the Xuantie GNU Toolchain for Ox64 on macOS and Apple Silicon Ox64 BL808 RISC-V SBC articles by Lup Yuen LEE: Booting Linux and (maybe) Apache NuttX RTOS Starting Apache NuttX real-time operating system Sv39 Memory Management Unit NuttX Apps and Initial RAM Disk UART Interrupt and Platform-Level Interrupt Controller (PLIC) Fixing the UART Interrupt and Platform-Level Interrupt Controller $8 RISC-V SBC on a Real-Time Operating System: Ox64 + NuttX Nim on a Real-Time Operating System: Apache NuttX RTOS + Ox64 BL808 SBC Git repositories: Community made Arduino Core specifically for the Bouffalo Labs BL808 RISC-V MCU (initial development has been postponed until further notice) Development Efforts Ox64 boots Linux successfully Brennan Ashton is porting Apache NuttX RTOS and OpenAMP (Asymmetric Multiprocessing) to BL808 Phone Concept for BL808 Building Start the building process cloning both the upstream Buildroot repository and the Buildroot Bouffalo overlay repository: $ mkdir -p ~/ox64 $ cd ~/ox64 $ git clone https://github.com/buildroot/buildroot $ git clone https://github.com/openbouffalo/buildroot_bouffalo Define an environment variable for the Buildroot Bouffalo overlay path: $ export BR_BOUFFALO_OVERLAY_PATH=$(pwd)/buildroot_bouffalo Change directory into the cloned Buildroot folder: $ cd ~/ox64/buildroot Apply the default configuration for Pine64 Ox64: $ make BR2_EXTERNAL=$BR_BOUFFALO_OVERLAY_PATH pine64_ox64_defconfig Use the `menuconfig` tool to adjust the build settings: $ make menuconfig Within `menuconfig`, configure the following: Select `Target Options` Enable `Integer Multiplication and Division (M)` Enable `Atomic Instructions (A)` using space key Enable `Single-precision Floating-point (F)` Enable `Double-precision Floating-point (D)` Select `Target ABI`, set it to `lp64d` and `press Exit` Select `Toolchain`, enable `Fortran support`, enable `OpenMP support`, and Save & Exit Initiate the build process, but first make sure that your `PATH` variable contains no spaces. For Arch Linux distrubution you may also need to install extra-packages with `sudo pacman -S cpio rsync bc`. $ make Buildroot will output the needed files to the `~/ox64/buildroot/output/images` directory in about 1 hour, according to your computer processing resources and internet connection speed. Flashing This page explains how to flash an Ox64 board and a microSD card to boot the system. You will need a Linux computer, a serial UART adapter, the Ox64 board, and a microSD card. Prepare images for flashing Download the Ox64 images from the latest OpenBouffalo release. You may skip this step if you built your own images as per the instructions in the link:/documentation/Ox64/Software/Building/[Building] page. $ mkdir -p ~/ox64/openbouffalo $ cd ~/ox64/openbouffalo $ wget https://github.com/openbouffalo/buildroot_bouffalo/releases/download/v1.0.1/bl808-linux-pine64_ox64_full_defconfig.tar.gz $ tar -xvzf bl808-linux-pine64_ox64_full_defconfig.tar.gz $ cd ~/ox64/openbouffalo/firmware $ xz -v -d -k sdcard-pine64_ox64_full_defconfig.img.xz $ mv sdcard-pine64_ox64_full_defconfig.img sdcard.img Optional: create a combined SoC image Use the following commands to combine _m0_lowload_bl808_m0.bin_, _d0_lowload_bl808_d0.bin_, and _bl808-firmware.bin_ into a single image. This is mainly useful for troubleshooting (e. g. when using DevCube v1.8.4 or later). $ cd ~/ox64/openbouffalo/firmware # if you downloaded pre-built images # or $ cd ~/ox64/buildroot/output/images # if you built your own images $ fallocate -l 0x800000 bl808-combined.bin $ dd conv=notrunc if=m0_lowload_bl808_m0.bin of=bl808-combined.bin $ dd conv=notrunc if=d0_lowload_bl808_d0.bin of=bl808-combined.bin seek=$((0x100000))B $ cat bl808-firmware.bin >> bl808-combined.bin Check that you have the required files for flashing $ cd ~/ox64/openbouffalo/firmware # if you downloaded pre-built images # or $ cd ~/ox64/buildroot/output/images # if you built your own images $ ls -1 *808*.bin *.img Expected files: `bl808-combined.bin` -- If you created the combined image. `bl808-firmware.bin` -- OpenSBI and UBoot DTB files. Runs on the D0 core. `d0_lowload_bl808_d0.bin` -- Startup code for the D0 core. `m0_lowload_bl808_m0.bin` -- Startup code for the M0 core. `sdcard.img` -- Kernel and root filesystem. Runs on the D0 core. Set up your UART adapter In this section we will configure and wire up a UART adapter in order to flash the Ox64. Choose one of the options below based on the hardware available to you; the first two are the most convenient since they minimise the number of times you will need to swap electrical connections. Option 1: Raspberry Pi Pico First, download the Raspberry Pi Pico firmware that allows it to act as a serial UART adapter: $ mkdir -p ~/ox64/pico $ cd ~/ox64/pico $ wget https://github.com/Kris-Sekula/Pine64_Ox64_SBC/raw/main/uart/picoprobe.uf2 Put the Raspberry Pi Pico board into programming mode: Press the BootSel button Apply power by plugging the USB cable to PC Release the BootSel button NOTE: As an alternative to pressing the BootSel button, you can also connect the probe point `TP6` (located on the bottom of the Pico board) to any ground point (e. g. pin 28). The Pico will now appear as a USB mass storage device. Copy the `UF2` file to program it: $ cp ~/ox64/pico/picoprobe.uf2 /media/<user>/RPI-RP2 Next, connect the Ox64 board to the Pico according to the following wiring diagram: [cols="1,1,1"] |=== | Ox64 | PI PICO | /dev/tty | uart0_Tx_GPIO14_pin1 | uart0_Rx_pin17 | ACM1 for flashing | uart0_Rx_GPIO15_pin2 | uart0_Tx_pin16 | ACM1 for flashing | Rxd_GPIO17_pin31 | uart1_Tx_pin6 | ACM0 for serial console | Txd_GPIO16_pin32 | uart1_Rx_pin7 | ACM0 for serial console | gnd_pin38 | gnd_pin38/3 | | vbus5v_pin40 | vbus5v_pin40 | |=== With the Pico flashed and wired as per the instructions above, we have access to two of the Ox64's UART ports at the same time. This configuration eliminates the need to switch the physical connections for flashing or testing the system. Reconnect the Pico to your computer's USB port and verify that we have access to all the serial ports we need: $ ls /dev/ttyACM* Expected result: `/dev/ttyACM0` connects to the D0 core's (i.e. Linux's) serial console `/dev/ttyACM1` is used for flashing (but also connects to the M0 core's serial console) Option 2: STM32 Bluepill The Bluepill is an affordable STM32 development board, based on the STM32F103C8T6 chip. We can program it to act as a USB serial adapter, just like we did with the Raspberry Pi Pico. [NOTE] The one catch is that you already need a serial adapter in order to program your Bluepill board. The good news is that you serial adapter does **not** have to be one from from the link:/documentation/Ox64/Further_information/Compatible_UARTs/[Compatible UARTs] list. These programming instructions have been tested with a FT232RL adapter (which, notably, is listed as _not_ supported on that list). If you own an SWD-capable debugger (ST-Link, J-link, etc.) you can use that for programming the Bluepill as well, although instead of `stm32fla'''
year_published = 2025
clearnet = "https://wiki.pine64.org/wiki/Ox64"
