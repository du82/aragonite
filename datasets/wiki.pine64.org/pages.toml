title = "PineNote - PINE64"
full_description = '''PineNote From PINE64 Jump to navigation Jump to search The PineNote The PineNote is the first hybrid notepad computer device combination of notebook, tablet and e-reader using an e-ink panel. It is derived from the Quartz64 Model-A single-board computer and powered by Rockchip RK3566 quad-core ARM Cortex-A55 64-bit SoC with Mali G52 GPU. Contents 1 Introduction 1.1 State of the software 1.2 Help and support 2 Software releases 3 Development efforts 3.1 Software 3.1.1 Linux Kernel 3.1.2 User Space 3.1.3 Android 3.1.4 Related 3.2 Hardware 3.2.1 Resolved issues 3.2.2 Unresolved issues 3.2.3 UART Dongle 4 Specification 4.1 General Information 4.2 Core 4.3 E-ink Display 4.4 Network 4.5 Audio 4.6 Sensor 4.7 Power 4.8 Accessories 5 SoC and Memory Specifications 5.1 CPU Architecture 5.2 GPU (Graphics Processing Unit) Capabilities 5.3 NPU (Neural Processing Unit) Capabilities 5.4 System Memory 6 Information, Schematics, and Certifications 7 Datasheets for Components and Peripherals 8 Resources Introduction State of the software Warning: For Batch-2 (2024) PineNotes: The version of Debian-based Linux distribution shipped with the second PineNote batch contains a U-Boot build that prevents suspend-to-RAM from working correctly and make entering MaskROM mode using a magnet not possible. This was caused by the unfortunate timing, so the factory ended up installing version of the operating system image that contained these issues. The required fixes are already available in the shipped Linux distribution, but they need to be installed manually by the users. Warning: For Batch-2 (2024) PineNotes: The Batch 2 operating system is based on Debian Trixie, which is still in development flux. An issue with /lib64 symlinks was encountered for the specific built of the image that ships with the PineNotes of 2024. If you encounter update failures, please take a look at: this Github issues Warning: For Batch-2 (2024) PineNotes: In order to prevent Gnome from starting after updates, it is recommend to uninstall the lightdm package: sudo apt remove lightdm The PineNote is based on the Rockchip RK3566 SoC, which was released in 2021. The upstreaming status of the SoC functionality can be found on the Quartz64 development wiki page of the Quartz64 single-board computer that uses the same SoC. In the PineNote development wiki page you'll find the items specific to the PineNote. The early adopter's batch of the PineNote is aimed solely at early adopters - more specifically, the units are solely intended to find their way into the hands of users with extensive Linux experience. If you’re looking to buy a PineNote in the first batch, you must expect to write software for it, not to write notes on it. The software shipping from the factory for the first batch will not be suitable for taking notes, reading e-books, or writing your dissertation. It may not even boot to a graphical environment. In October 2024, the second PineNote batch was announced. This batch started shipping during the first half of November 2024 with a Debian-based operating system, currently developed here: [1]. Please note, however, that this batch is still aimed at developers with Linux and embedded experience, and should not be expected to meet general-user readiness. Help and support Still have any questions regarding software, shipping, or ordering after reading this wiki? Please don't hesitate to contact the community in the bridged community channels for detailed answers or simply to chat with friendly people in the community! See Main Page#Community and Support. Please keep in mind that PINE64 is not like a regular company (see the PINE64 philosophy) and that support resources are limited - the best way to get support quickly is to ask in the community chat! Please only contact the PINE64 support directly if questions couldn't be solved via the community chat or this wiki. Software releases While there are no robust and tested operating system releases for the PineNote available at this time, various linux distributions can be installed on the PineNote, with various degrees of working functionality. Operating system software releases, or efforts to create them, can be found in the PineNote Software Releases section. Please join the development effort and help creating one. Development efforts The following page discusses the development efforts for the PineNote: PineNote Development for general information regarding how to flash the device and other development information. Software PineNote Development/Flashing for general flashing instructions of data to the PineNote PineNote Development/TODOs Linux Kernel If you are looking for a working kernel for the PineNote, please see her: [2] RK3566 EBC Reverse-Engineering for the EBC (eInk Panel) driver. PineNote Development/Building Kernel BSP Linux SDK version 4.19 for the PineNote and Quartz64 Model A: Direct download from pine64.org (32.67GB, MD5 of the TAR-GZip file 24554419aec29700add97167a3a4c9ed) Mirror by mwfc An unofficial torrent download provided by a community member of the BSP Linux and Android SDKs can be found here (100GB). User Space PineNote Development/Booting Linux For tweaks and tricks see: PineNote Development/Software Tweaks For app development see: PineNote Development/Apps Android As of November 2024 there is no working Android build available for the PineNote! Android 11 e-ink SDK for the PineNote and [[Quartz64|Quartz64 Model A]. This is the Android SDK build for 10.3" eink panels on Quartz64 Model A. Download: Direct download from pine64.org (72.88GB, MD5 of the TAR-GZip file 293a550584298de4fb95ceae18103672) Mirror by mwfc An unofficial torrent download provided by a community member of the BSP Linux and Android SDKs can be found here (100GB). Just the boot blobs (<1MB): File:Rk35-blobs.tar.gz Notes: View Android SDK for RK3566 for more information how to compile an image for the PineNote using this SDK Related Quartz64 Development for the mainlining status of various functions on the Rockchip RK3566 SoC. Hardware This section includes discussions and their results regarding hardware changes and debugging of the PineNote. Resolved issues The following topics have resolved: PineNote/Hardware Changes/Closed Case UART Could the USB-C port support USB 3.1 5Gbps? Yes and no. The RK3566 only has a host-mode 5Gbps controller, meaning it can only negotiate such a high data rate with a device such as a flash drive. When the RK3566 is acting as a device, it only supports 480Mbps transfer rates. The hardware required to switch between these modes would raise the PineNote's price unreasonably. Therefore, the USB-C port will remain at USB 2.0 speeds for Host and Device mode. Could the USB-C port output DisplayPort? Yes and no. The hardware required to support such a feature would raise the PineNote's price unreasonably. Therefore, DisplayPort output will not be possible through the USB-C port. Where is the microSD card slot? The case design of the PineNote is fixed, making physical changes like adding a microSD card slot would raise the cost unreasonably. How will I install software to the PineNote? This is a hardware and software question. If the software on your PineNote is completely broken and cannot boot to a recoverable state, a Hall (magnet) sensor was fitted to the PineTab motherboard as U9009. This sensor is attached to SARADC_VIN0_KEY/RECOVERY on the RK3566. With the device powered off, and screen face down, holding a magnet over U9009 and plugging in a USB-C cable causes the device to boot into "rockusb" flash mode. With proper flashing software and drivers, it should be possible to load a new operating system using rockusb if the system is soft-bricked. Of course, software vendors will need to be more careful with flashing firmware and providing useful "recovery" options on this device due to this process's relative difficulty to other PINE64 devices. PineNote/Battery Replacement Unresolved issues The following concerns have been brought up as open, unanswered topics: Does Audio Adapter Accessory Mode work? It appears that the Headphone output of the audio codec was routed to the USB-C audio+USB switch, but it's unclear whether CC lines are hooked up correctly for detection of such a device. The PineNote hardware team will be testing this functionality soon (as of August 19, 2021). Note that Audio Accessory mode is detectable by reading the I2C registers of the WUSB3801Q. So connecting ASEL to a GPIO would be enough to get this working if it is not working already. Why is the Headphone output of the audio codec routed to the speakers? HPL_OUT is routed from the RK817 PMIC and audio codec to U9010 (the USB-C switch) and U6 (the audio amplifier). SPK_OUT is unused. It seems like SPK_OUT should be routed to U6 and HPL_OUT to U9010. Nitpick: The cold white charging LED bleeds through the gap between the rear case and the device's face. It does not bleed onto the screen, but it is jarring in low-light conditions or when the screen is amber. Could be resolved in software by turning off the charge LED when the screen is on. Is there any way to indicate when the device is in rockusb mode, such as connecting a certain magic pin to the power LED? The modem/4G connector (J6010) has its I2C and UART pins unconnected. Could those be connected to the SoC? UART Dongle See main article: PineNote Development/UART Warning: The second PineNote batch, which started shipping during the first half of November 2024, is the last batch that has the USB UART dongle included in the box. The UART adapter is not symmetrically wired, make sure to orient it with the components oriented towards the screen! The USB UART dongle delivered with the PineNote allows you to have access to its serial console via USB-C Debug Accessory Mode (DAM) without having to disassemble the device. The factory-installed operating system runs the serial console at the 1,500,000 bps speed, 8 data bits and 1 stop bit, no parity, and no flow control. The USB-C male end should go into the PineNote and the female end can be connected with a standard USB-C cable to your computer. It is relatively easy to build your own UART interface with a USB-C breakout board (for example https://www.ebay.com/itm/275407037613), two resistors and a 3.3V USB serial adapter. It is basically just two 1K pull up resistors (R3, R4), the data sheet values of 10K isn't whats on the real hardware, see the schematic. The pull ups enable the serial output on SBU1 and SBU2 you can use with any 3.3V USB serial adapter. The UART dongle is not necessary to flash the PineNote, but is essential if something goes wrong to fix it without having to open the case. Specification General Information Dimensions: 191.1x232.5x7.4mm Weight: 438g Core CPU: RK3566 1.8GHz 64-bit quad-core A55 GPU: MALI G52 2EE RAM: 4 GB LPDDR4 Flash: 128 GB eMMC (soldered) E-ink Display Size: 10.3" Resolution: 1404x1872 DPI: 227 Grayscale: 16 Front Light: 36 level cold and warm Capacitive multi-touch panel EMR pen digitizer Network WiFi: 2.4/5GHz 802.11a/b/g/n/ac Bluetooth: 5.0 Audio Built in stereo speakers 4 x DMIC microphone Sensor G-Sensor for portrait and landscape sensing Power 4000mAH LiPo battery DC 5V @ 3A USB-C connector, conforms to the USB Type-C Cable and Connector Specification Accessories Optional EMR pen with magnetic attachment (included in the first production batch, the second batch (2024) ships with a purely passive pen) Optional Cover (included in the first and second production batches) SoC and Memory Specifications Based on Rockchip RK3566 CPU Architecture Quad-core ARM Cortex-A55@1.8GHz AArch32 for full backwards compatibility with ARMv7 ARM Neon Advanced SIMD (single instruction, multiple data) support for accelerated media and signal processing computation Includes VFP hardware to support single and double-precision operations ARMv8 Cryptography Extensions Integrated 32KB L1 instruction cache and 32KB L1 data cache per core 512KB unified system L3 cache TrustZone technology support 22nm process, believed to be FD-SOI GPU (Graphics Processing Unit) Capabilities Mali-G52 2EE Bifrost GPU@800MHz 4x Multi-Sampling Anti-Aliasing (MSAA) with minimal performance drop 128KB L2 Cache configurations Supports OpenGL ES 1.1, 2.0, and 3.2 Supports Vulkan 1.0 and 1.1 Supports OpenCL 2.0 Full Profile Supports 1600 Mpix/s fill rate when at 800MHz clock frequency Supports 38.4 GLOP/s when at 800MHz clock frequency NPU (Neural Processing Unit) Capabilities Neural network acceleration engine with processing performance of up to 0.8 TOPS Supports integer 8 and integer 16 convolution operations Supports the following deep learning frameworks: TensorFlow, TF-lite, Pytorch, Caffe, ONNX, MXNet, Keras, Darknet System Memory RAM: 4 GB LPDDR4 Flash: 128 GB eMMC (soldered) Information, Schematics, and Certifications Version v1.2 of the PineNote is the production version sold through the Pine Store as Developer Edition and Community Edition: PineNote Mainboard Schematic ver 1.2 20210824 PDF file PineNote USB-C Daughter Board Schematic ver 1.0 PDF file PineNote USB-C Console UART Breakout Board Schematic ver 1.0 PDF fileWhen building a USB-C console breakout board, please be aware that a 10k CC pin pull-up is too weak to pull CC to a logically high level. Replacing it to a lower resistance, such as 1k, is recommended. PineNote Quick Start GuideDeveloper Edition uses an active pen, which is different than the passive EMR pen described in the guide. Version v1.1 of the PineNote is used by developers who received the early prototype, whose schematic is provided for reference only: PineNote early released Schematic ver 1.1 20210726 PDF file PineNote early released ver 1.1 20210726 PCB Connector placement PDF file Certifications: PineNote FCC-15C Certificate PineNote FCC-15E Certificate PineNote CE RED Certificate PineNote ROHS Certificate Datasheets for Components and Peripherals Rockchip RK3566 SoC information: Rockchip RK3566 ver 1.0 datasheet, release permission from Rockchip Rockchip RK817 PMU (Power Management Unit) Information: Rockchip RK817 version 1.01 datasheet LPDDR4 (200 Balls) SDRAM: --- eMMC information: Biwin 128GB eMMC model: BWCTASC41P128G E-ink Panel information: E-Ink 10.3" 1872x1404 ED103TC2 Glass Panel Specification TPS65185x PMIC for E-Ink Enabled Electronic Paper Display Datasheet Touch Screen information: Cypress CYTMA448 multi-Point Capacitive Touch Controller Datasheet Wacom Pen Digitizer Unit Model: SUDE-10S15MI-01X for 10.3" Display Module WiFi/BT module information: Azurewave CM256SM 11AC WiFi + Bluetooth5.0 Datasheet] G Sensor information: Silan SC7A20 3-Axis MEMS Accelerometer Audio Amplifier information: Awinic AW87318 Class-K Audio Amp Datasheet Resources PineNote Press Retrieved from "https://wiki.pine64.org/index.php?title=PineNote&oldid=21705" Categories: PineNoteRockchip RK3566'''
