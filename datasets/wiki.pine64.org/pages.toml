o6 dir=1 [20143.979260] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=err dir=1 [20143.979268] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=pemp dir=1 [20143.979275] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=int dir=1 [20143.979283] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=slct dir=1 [20143.979290] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=wait dir=1 [20143.979298] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=autofd dir=1 [20143.979306] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=addr dir=1 [20143.979314] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=ini dir=0 [20143.979321] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=write dir=0 [20143.979329] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=scl dir=0 [20143.979337] spi-ch341-usb 1-1.1:1.0: ch341_gpio_get_direction: gpio=sda dir=0 [20143.979831] spi-ch341-usb 1-1.1:1.0: ch341_gpio_probe: registered GPIOs from 496 to 511 [20143.981152] spi-ch341-usb 1-1.1:1.0: ch341_gpio_probe: done [20143.981212] spi-ch341-usb 1-1.1:1.0: ch341_gpio_poll_function: start [20143.981291] spi-ch341-usb 1-1.1:1.0: ch341_usb_probe: connected [20144.756250] usbcore: registered new interface driver ch341 [20144.756334] usbserial: USB Serial support registered for ch341-uart With kernel 5.16 and newer the output is shorter: $ dmesg [ 6744.813564] usb 1-2.1.1: new full-speed USB device number 21 using xhci_hcd [ 6744.904377] usb 1-2.1.1: New USB device found, idVendor=1a86, idProduct=5512, bcdDevice= 3.04 [ 6744.904383] usb 1-2.1.1: New USB device strings: Mfr=0, Product=2, SerialNumber=0 [ 6744.904385] usb 1-2.1.1: Product: USB UART-LPT [ 6744.960243] spi-ch341-usb 1-2.1.1:1.0: ch341_cfg_probe: output cs0 SPI slave with cs=0 [ 6744.960246] spi-ch341-usb 1-2.1.1:1.0: ch341_cfg_probe: output cs1 SPI slave with cs=1 [ 6744.960247] spi-ch341-usb 1-2.1.1:1.0: ch341_cfg_probe: output cs2 SPI slave with cs=2 [ 6744.960249] spi-ch341-usb 1-2.1.1:1.0: ch341_cfg_probe: input gpio4 gpio=0 irq=0 (hwirq) [ 6744.960251] spi-ch341-usb 1-2.1.1:1.0: ch341_cfg_probe: input gpio5 gpio=1 irq=1 [ 6744.960302] spi-ch341-usb 1-2.1.1:1.0: ch341_spi_probe: SPI master connected to SPI bus 0 [ 6744.960350] spi-ch341-usb 1-2.1.1:1.0: ch341_spi_probe: SPI device /dev/spidev0.0 created [ 6744.960398] spi-ch341-usb 1-2.1.1:1.0: ch341_spi_probe: SPI device /dev/spidev0.1 created [ 6744.960445] spi-ch341-usb 1-2.1.1:1.0: ch341_spi_probe: SPI device /dev/spidev0.2 created [ 6744.960583] spi-ch341-usb 1-2.1.1:1.0: ch341_usb_probe: connected Driver development Kernels 5.14 and older Once the module spi-ch341-usb is correctly loaded, here's how you can transfer data on the SPI bus (in C): /* Open the SPI bus */ int spi = open("/dev/spidev1.0", O_RDWR); uint8_t mmode = SPI_MODE_0; uint8_t lsb = 0; ioctl(spi, SPI_IOC_WR_MODE, &mmode); ioctl(spi, SPI_IOC_WR_LSB_FIRST, &lsb); /* Transfer data */ /* TODO: Init buffer_out, buffer_in and size */ const uint8_t *mosi = buffer_out; // output data uint8_t *miso = buffer_in; // input data struct spi_ioc_transfer spi_trans; memset(&spi_trans, 0, sizeof(spi_trans)); spi_trans.tx_buf = (unsigned long) mosi; spi_trans.rx_buf = (unsigned long) miso; spi_trans.cs_change = true; spi_trans.len = size; int status = ioctl (spi, SPI_IOC_MESSAGE(1), &spi_trans); To access GPIOs, you first need to export them (to make them accessible via /sys/class/gpio. As you can see in the dmesg output, GPIOs from 496 to 511 were registered, which means we can export 16 GPIOs. The mapping of these I/O is available in the source code of the driver. For example, pin slct is the 12th, meaning we need to export GPIO 496+12 = 508. int fd; if ((fd = open("/sys/class/gpio/export", O_WRONLY)) == -1) { perror("open ini"); exit(-1); } if (write(fd, "508", 3) == -1){ perror ("write export 508"); } Once exported, the GPIO is available in /sys/class/gpio/sclt (the naming is specified by the driver). You can read the pin in C: int fd; if ((fd = open("/sys/class/gpio/slct/value", O_RDWR)) == -1) { perror("open"); } char buf; if (read(fd, &buf, 1) == -1) { perror("read"); } int value = (buf == '0') ? 0 : 1; You can also write it: int fd; if ((fd = open("/sys/class/gpio/ini/value", O_RDWR)) == -1) { perror("open ini"); } if (write(fd, value ? "1" : "0", 1) == -1) { perror ("write"); } Kernel 5.15 and newer We need some help documenting how these interfaces work! The driver creates these interfaces: Pin SPI Function GPIO function GPIO name IRQ 15 CS0 - - - 16 CS1 - - - 17 CS2 - - - 19 - Input gpio4 hardware 21 - Input gpio5 software The dimich-dmb fork of spi-ch341-usb works with 5.15+ kernels, but as you can see above it is not configured for the needs of the Pinedio-USB by default. I have started a branch in my fork to work on getting the driver pre-configured for our needs. The branch can be found here. Please feel free to help! And open issues or discussions in the repo if you have problems or ideas how to help. Any improvements to the actual code beyond configuration should be pushed to the temporary upstream. Since linux-5.15 binding to spidev driver is required to make slave devices available via /dev/, e.g. for slave 1 on bus 0 as real root (not with sudo): # echo spidev > /sys/class/spi_master/spi0/spi0.1/driver_override # echo spi0.1 > /sys/bus/spi/drivers/spidev/bind For all devices handled by spi_ch341_usb driver (again, only as real root): # for i in /sys/bus/usb/drivers/spi-ch341-usb/*/spi_master/spi*/spi*.*; do echo spidev > $i/driver_override; echo $(basename $i) > /sys/bus/spi/drivers/spidev/bind; done The documentation found at https://github.com/dimich-dmb/spi-ch341-usb/blob/master/README.md has more information. The 5.15+ driver is not ready yet. But if you are interested in testing, helping to get the configuration right, or working on application development you can build and test the current driver: $ git clone -b pinedio https://github.com/UncleGrumpy/spi-ch341-usb.git $ cd spi-ch341-usb $ make $ sudo make install So far this will automatically set up the SPI slave device /dev/spi0.0. It names the ch341-usb device as "pinedio" this will allow application developers to find the correct gpiochip by name. I need help confirming the correct gpio pins but as of now the driver will setup the following configuration: The driver uses following CH341A pins for the SPI interface. Pin Name Direction Function SPI (CH341A) 18 D3 output SCK (DCK) 20 D5 output MOSI (DOUT) 22 D7 input MISO (DIN) 15 D0 output CS0 The driver uses the following GPIO configuration. Warning: It is not sure if these are the correct pins to use! CH341 Pin CH341A Name Function GPIO Name GPIO Configuration SX1262 connection 7 INT# IRQ dio_irq Output DIO1 (IRQ) 8 SLCT BUSY dio_busy Input BUSY 26 RST# Hard Reset dio_reset Output NRESET The function of these pins can be changed from user space by using libgpiod. The command line tools installed with the library (gpioset, gpioget, gpiodetect, gpioinfo...) can be us'''
