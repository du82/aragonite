title = "PINE64"
full_description = '''Main Page From PINE64 Jump to navigation Jump to search PINE64 is a community-driven company focused on creating high-quality, low-cost ARM devices and, more recently, RISC-V devices for individuals and businesses around the globe. PINE64 made its debut with the PINE A64 single-board computer, which successfully launched on Kickstarter in 2015. PINE64 has since released a multitude of other devices, including both development boards and end-user devices. PINE64 has a large, diverse and active community, and offers a variety of resources for hobbyists and businesses to successfully leverage various PINE64 products. To become connected and involved with the community, please see Community and Support for a list of available channels and chat platforms. To learn more about PINE64, please visit the PINE64 website and the PINE64 store. For information about PINE64 branding, including the usage of the PINE64 logo in non-commercial and other applications, please read the article about our brand and logo. Contents 1 Devices 2 Community and Support 2.1 Chat Platforms 2.2 Forums 3 Helpful Information for Beginners Devices Pinebook Pro (left) and PinePhone (right) You can learn more about the following devices manufactured by PINE64: Phones: PinePhone and PinePhone Pro Phone accessories: PinePhone (Pro) Add-ons and PinePhone (Pro) Keyboard Tablets: PineTab, PineTab2, PineTab-V and PineNote Wearable: PineBuds Pro, PineTime Laptops: Pinebook and Pinebook Pro Laptop accessories: Pinebook Pro Docking station Single-board computers: Oz64,Ox64, STAR64, Quartz64, QuartzPro64, ROCKPro64, ROCK64, PINE A64, PINE A64-LTS, PINE H64 Model A and PINE H64 Model B Set-top box: RockBox Clusters and modules: Clusterboard, SOPINE, SOPINE Baseboard, SOEDGE, SOEDGE Baseboard, and SOQuartz IP camera: PineCube Power adapter: PinePower Soldering iron: Pinecil Makerspace: PineCone and Pinedio Community and Support Community collaboration and support is focused around the chat platforms and forums described below. See Getting Started | PINE64 for tips about how to get started with the PINE64 community. Chat Platforms PINE64 has a large and very active community. Community discussion takes place on a variety of chat platforms, which are all bridged together so the messages sent via one platform are sent to all other platforms automatically. The other networks and their users are represented by P64ProtocolBot. PINE64 community is not some always-responding, restless commercial customer service, or some sort of almighty existence that can resolve all your problems. When participating in community discussions, please be patient and do not expect questions to be answered immediately, certainly, or currently. More precisely: The activity of community members varies depending on the time of day and the number of active users. Whether your questions will be answered and whether the answers are right and definitive, depends on the information you provide, the difficulty of your questions, the current state of the involved PINE64 products and their software support, and the community members' ability. Read How To Ask Questions The Smart Way to learn more. Please read PINE64 Community Rules and Code of Conduct. Note: PINE64 uses a bridge bot (matterbridge with some modifications) that allows Discord, IRC, Matrix, and Telegram users to see each other and participate together in the community chat. The bot name is "Pine64 Protocol Droid" or "P64ProtocolBot", depending on the chat platform, and if you see this, look in the message to see the actual author of the message. When the bot relays messages, it will show the chat platform the user is using by prefixing their nickname with "[D]" for Discord, "[I]" for IRC, "[M]" for Matrix, and "[T]" for Telegram. The community chat platforms are the following: Discord: Use this invite link. All PINE64 discord channels are immediately viewable, do not need to join separate channels like the Telegram/Matrix table below. IRC: The server is irc.pine64.org, and the ports are 6667 (plain) and 6697 (TLS). Use /LIST command or the table below to see the full list of channels. This server experienced abuse by spam bots in early October 2023, which resulted in requiring registration and authentication with NickServ before users could join channels between October 3, 2023 and October 11, 2023. Using NickServ to join channels has become required again on October 23, 2023, due to the server experiencing repeated abuse by spam bots. Matrix and Telegram: See the table below. Channel Matrix Telegram IRC PINE64 News #pine64-announcements:matrix.org @PINE64_News Unavailable General PINE64 chat #pine64:matrix.org @mtrx_pine64 #pine64 PINE A64(+), A64-LTS & SOPine #pine64sopine:matrix.org @pine64sopine #lts-sopine ROCK64 / ROCKPro64 #rock64:matrix.org @mtrx_rock64 #rock64 Quartz64 #quartz64:matrix.org Quartz64 #quartz64 Quartz64 Development #quartz64-dev:matrix.org @q64dev #quartz-dev Star64 #star64:matrix.org @star64-sbc Unavailable Pinebook and Pinebook Pro #pinebook:matrix.org @mtx_pinebook #pinebook PinePhone #pinephone:matrix.org @pinephone #pinephone PineNote #pinenote:matrix.org @PineNote #pinenote PineTab #pinetab64:matrix.org @PineTab #pinetab PineTime #pinetime:matrix.org @pinetime #pinetime PineTime Development #pinetime-dev:matrix.org @pinetime_dev #pinetime-dev PineBuds Pro #pinebuds:matrix.org @pinebuds Unavailable Pinecil #pinecil:matrix.org Pinecil #pinecil Pinecil Development #pinecil-dev:matrix.org Pinecil-dev Unavailable Pinetalk Podcast Unavailable Unavailable Unavailable PineCube #cube64:matrix.org @pinecube #cube Nutcracker, Ox64, Oz64 #pine64-nutcracker:matrix.org Nutcracker #nutcracker LoRa #pinelora:matrix.org @pine64lora #lora Off-topic #offtopic64:matrix.org @pine64offtopic #offtopic There is also an unofficial Matrix Space at #pine64-space:matrix.org for supported clients that organizes all of the above matrix channels into one place. Forums PINE64 runs an official forum powered by the open-source forum server software MyBB. The forum can be used to report issues, help out other users, offer findings and new information and more. Users can also engage directly with the community and the developers of partner projects, as well as with the PINE64 members. The official PINE64 forum can be accessed here: Official PINE64 Forum Also, these are the official Subreddits: Official PINE64 Reddit Official PinePhone Reddit Helpful Information for Beginners Getting started: Basic information on setting up and handling PINE64 devices, such as how to write (flash) OS images to microSD cards and eMMC modules How to Contribute: Information about how to contribute to different partner projects Where to Report Bugs: Information about how to report bugs Project: A variety of well documented PINE64 projects to serve as inspiration Retrieved from "https://wiki.pine64.org/index.php?title=Main_Page&oldid=21676"'''
year_published = 2025
clearnet = "https://wiki.pine64.org/index.php"
