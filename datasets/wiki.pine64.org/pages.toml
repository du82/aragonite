title = "How to Contribute - PINE64"
full_description = 'How to Contribute From PINE64 Jump to navigation Jump to search The following article contains a selection of common ways to contribute to the community projects. Contents 1 Reporting issues 2 Contributing code 3 Donating to community projects and developers 3.1 Community projects 3.2 Developers 4 Help with the documentation 5 Other ways to contribute 6 By being a positive member of the community Reporting issues Reporting issues is a great way to contribute (if done correctly). The software projects are using bug trackers to keep track of bugs and to link patches or changes with these bug reports. See the article where to report bugs to find out where you can report bugs. Contributing code By contributing code, for example as documented in the following project pages (alphabetical order): elementary: Get Involved and the ARM project on GitHub KDE: see Get Involved and Help:Contribute Plasma Mobile: https://plasma-mobile.org/get-source/ (see the "Contributing" section) Donating to community projects and developers Many community projects and developers are working on the software on their free time. Donating to community projects and developers is a great way to support these projects and developers developing the software for the devices. The following list is an exemplary selection to which projects and developers can be donated to (in alphabetical order): The following list is not a comprehensive list and solely a selection of different community projects and developers, which can be supported. Any FOSS development effort is valuable and should be rewarded, please support your favorite developer(s) or project(s) even if not mentioned on the list! - Your name or project not on the list? Let us know! Community projects Armbian: https://www.armbian.com/donate/ elementary: https://elementary.io/get-involved KDE: https://kde.org/community/donations/ LibreELEC: https://libreelec.tv/sponsor/ Manjaro ARM: Open Collective, Liberapay, Patreon (see https://manjaro.org/donate/ for an overview) Mobian: Liberapay postmarketOS: https://postmarketos.org/donate/ UBports: https://ubports.com/donate and many more! Developers Danct12: Ko-fi, Liberapay, Patreon megi: https://xnux.eu/contribute.html#toc-donations and many more! Help with the documentation All projects typically require help with the documentation. That can include the wikis of the projects, help pages, tutorials, manuals and technical or informative drawings. Other ways to contribute Other ways to contribute to the projects might include: Translations and localization Designs and creative work Ideas Supplying hardware and many more! By being a positive member of the community By being a positive member of the community you can help answering common questions and help people find the correct places for their inquiries. Retrieved from "https://wiki.pine64.org/index.php?title=How_to_Contribute&oldid=12743"'
