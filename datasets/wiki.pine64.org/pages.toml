title = "SOEDGE Baseboard - PINE64"
full_description = 'SOEDGE Baseboard From PINE64 Jump to navigation Jump to search The SOEDGE Baseboard The SOEDGE Baseboard is a baseboard that hosts the SOEDGE compute module and turns it into a full single board computer. Makers can use this baseboard as reference to develop their own PCBs and for software development during early stages for custom hardware or PCB development. Contents 1 Specifications 2 Features 2.1 Network 2.2 Storage 2.3 Expansion Ports 3 Schematics and certifications Specifications Gigabit Ethernet HD Digital Video Out 2x USB 3.0 Host Euler Bus Expansion Bus PI-2 Bus PCIe 4X open-ended header Touch Panel Port (TP) Display Serial Interface (DSI) Port IR R/X Port Real Time Clock Port (RTC) Lithium Battery Port SMOS Sensor Interface Port Optional AC WiFi + BT 5.0 module expansion module Headphone Jack 5.5″ Barrel Power (12V 3A/5A) Port Features Network 10/100/1000Mbps Ethernet WiFi 802.11 b/g/n with Bluetooth 4.0 (optional) Storage microSD - bootable, support SDHC and SDXC, storage up to 256GB USB - 2 USB2.0 Host port Expansion Ports DSI - Display Serial Interface, 4 lanes MiPi, up to 1080P TP - Touch Panel Port, SPI with interrupt RTC - Real Time Clock Battery Connector VBAT - Lithium Battery Connector with temperature sensor input Wifi/BT Module Header - SDIO 3.0 and UART 2x20 pins "Pi2" GPIO Header PCIe 2x open ended slot Schematics and certifications Model "A" Baseboard Dimensions: 133mm x 80mm x 19mm Input Power: DC 12V @ 3A 5.5OD/2.1ID Barrel DC Jack connector SOEDGE Model "A" Baseboard schematics and PCB board resources: SOEDGE Model "A" Baseboard Schematic 20210223 PDF file SOEDGE Model "A" Baseboard 20210223 PCB Component Placement Top PDF file SOEDGE Model "A" Baseboard 20210223 PCB Component Placement Bottom PDF file SOEDGE module together with the baseboard certification: Disclaimer: Please note that SOEDGE module is not a "final" product and in general certification is not necessary. However, SOEDGE module still submits the mpdel A baseboard for FCC, CE, and ROHS certifications and obtain the certificates to prove that can pass the testing. Please note, a final commercial product needs to perform its own testing and obtain its own certificate. Not yet available Ethernet PHY information: Realtek RTL8211 10/100/1000M Ethernet Transceiver for SOEDGE model A baseboard Retrieved from "https://wiki.pine64.org/index.php?title=SOEDGE_Baseboard&oldid=19346" Category: SOEDGE'
