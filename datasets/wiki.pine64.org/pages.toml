title = "Project - PINE64"
full_description = '''Project From PINE64 Jump to navigation Jump to search Contents 1 Introduction and Instructions 1.1 Contributing New Projects 1.2 Authorship 2 Gaming Projects 3 Desktop Computer Projects 4 Network Attached Storage (NAS) Projects 5 Media Server and Player Projects 6 Projects Utilising General Purpose Input/Output (GPIO) Pins 7 Server Projects 8 Cluster/Docker Computing Projects 9 Home Automation Projects 10 Robotics Projects 11 PADI IoT Stamps Projects 12 Other Projects PINE64 Community Projects Wiki Page The PINE64 Wiki is community-driven and can be edited by anyone who wishes to contribute. Please remember to always login into the Wiki to see the latest updates. You can use your PINE64 forum login details. There are currently 148 projects on this wiki. Introduction and Instructions This Wiki section offers a variety of projects for PINE64 devices. It is co-created and driven by users like yourself, so feel free to browse the listed projects or even submit your own. If you are interested in contributing a project then please first read though the following two sub-sections (on Contributing New Projects and Authorship) before entering your submission. All submissions are welcome. You can submit hardware-based projects, software-based projects or a mix of the two. For example, you could build an NAS server enclosure for your PINE64 SBC and then create a software-based tutorial on how to take advantage of the setup you built. If you feel that a particular theme or project type is not represented on the Wiki then please create a post about it in the relevant section on the PINE64 forum. Contributing New Projects There are a number of ways in which you can contribute new projects to this Wiki section. Projects can be submitted by: Adding a link to a post on the forum, blog, git instructions, etc., Adding a link to an article (please read about authorship in 1.2) Adding a new entry to the Wiki Adding a link to a video or audio file with project instructions Adding links to documents (e.g. Google docs, PDFs, etc,.) of images hosted on Google Drive, Imgur, etc,. A combination of two or more of the above The preferable way of submitting a new project is by creating a new Wiki entry as this assures that it will be easy to locate by other users. Wiki entries can include attachments in the form of photos, videos, documents and external links (e.g. to formatted code); making them ideal for storing complex and lengthy tutorials and instructions. That said, if you do not wish to migrate your project tutorial from another place (e.g. the forums) then a link to the complete write-up, code, video or another medium will suffice. Adding an entry to the listing in the relevant project section should follow this syntax: | Name || Device || Link to project || Notes about the project Authorship If you are the author of the submitted project, be sure to credit yourself accordingly. You are also welcome to remain anonymous if you prefer. However, if you are linking or referencing an external project or source code that has been written up/ recorded/ created by someone else then you must credit the person or organisation that the project and/or related resources belong to. Gaming Projects PINE64 Retro Gaming Projects Most PINE64 devices are capable of emulating old computer and video game consoles such as the Nintendo Entertainment System. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine PINEBOOK ROCK64 Project Author(s) Device(s) Project Link Notes HeadShot LTS/A64 Pine A64 in a Playstation Pine A64 in a Playstation Case using original controllers Luke A64/LTS Arcade Cabinet A custom built min-arcade cabinet using the Pine A64 + LCD screen Luke/Pfeerick LTS/A64 Retroarch Install a dedicated Retroarch build on a minimal xenial image spoonerdee LTS/A64/Pinebook Emulation on Android Video showing emulation on Pine A64 running android. rtissera Rock64 RetroPie Early build An early build of RetroPie for Rock64 Seph Rock64 GIMX on Rock64 GIMX allows you to use peripherals, such as mice and keyboards, on consoles using a SBC like the Rock64 Desktop Computer Projects Desktop Applications of PINE64 SBCs All PINE64 Single Board Computers are capable of acting as destkop computers. This includes a variety of Linux destkop environments (such as Mate or XFCE) as well as different types of Android. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine ROCK64 Project Author(s) Device(s) Project Link Notes Swapnil Bhartiya A64 Debian desktop on Pine64 Installing Debian Mate on simple image AKINWALE A64/LTS MonoDevelop Install MonoDevelop integrated development environment and forward it via SSH Ray Hightower A64/LTS Destkop Quick Start Guide A desktop environment quick start guide for Pine A64 Network Attached Storage (NAS) Projects NAS Projects Most PINE64 Single Board Computers feature Gigabit Ethernet connections and multiple USB 2.0 / 3.0 ports, and are therefore well suited for domestic NAS applications. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine ROCK64 Project Author(s) Device(s) Project Link Notes Ptheven A64/LTS/Rock64 RAID 0 A RAID 0 setup for you PINE64 SBC Ptheven A64/LTS/Rock64 SMB setup Instructions to set up shares on your PINE64 SBC Ptheven A64/LTS/Rock64 NFS share Instructions on how to set up an NFS share on the Rock64 Ptheven A64/LTS/Rock64 Adding USB Storage Adding USB Storage, Linux Formatting and Permissions Media Server and Player Projects Media Server and Player Projects All PINE64 Single Board Computers are capable of acting at media servers as well as playback devices. Dedicated Linux destributions such as LibreELEC as well as Android TV make for great couch media consumption experiences. Your device may also perform the role of a media server. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine ROCK64 Project Author(s) Device(s) Project Link Notes JulianM A64 MDP Server + Speakers A custom build of MDP Server and speakers using a Pine A64 Jeremy Graham A64/LTS Manual Plex Server Installation Manual Plex Server installation on Pine A64 Learnincurve A64/LTS Squeezebox Squeezbox on Pine A64 + LCD Ronnie Bailey A64/LTS EMBY EMBY server on the Pine A64 Projects Utilising General Purpose Input/Output (GPIO) Pins GPIO Projects All PINE64 Single Board Computers have a set of GPIO pins that you can use in your project. The PINEBOOK can also make use GPIO using different means ... you can read about them in this section. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine PINEBOOK ROCK64 Project Author(s) Device(s) Project Link Notes machinehum and MarkHaysHarris777 PINEBOOK uSD Breakout This project allows 6 GPIO pins to be accessed via SD card slot MarkHaysHarris777 Pinebook/A64/LTS PADI GPIO expansion PADI IoT Dongle used for GPIO Expansion pfeerick A64/LTS GPIO Basics Controlling Pine64 GPIO via the filesystem (sysfs) on linux NANITE A64/LTS Controlling an Arduino Controlling an Arduino connected to the PINE64 over I2C with C and C# Rieul Techer A64/LTS Ethereum & CitizenWat Ethereum and CitizenWat Installation on a Pine64+ board TARINGA! A64/LTSI GPIO over web Server Web server for Pine A64 GPIO setup instructions Server Projects Server/Docker Projects All PINE64 Single Board Computers can be used as a wide variety of servers. Common applications include LAMP and Docker servers, but a there is nearly a limitless amount of plausible server applications. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine ROCK64 Project Author(s) Device(s) Project Link Notes Hypriot OS PINE A64/A64+/A64-LTS/SOPine Pine A64 Docker Docker on Pine A64, applies to other PINE64 devices doertepn A64/LTS/Rock64 OwnCloud tutorial Tutorial on manually installing OwnCloud on the Pine A64 wahdooyah Rock64/LTS/A64 Deluge server Deluged Torrent Server on the Pine A64 tomd Rock64/A64/LTS Pi-Hole Pi-Hole DNS server on a Pine A64 rallar8 A64/LTS Server Operation, OpenVPN, SSH Remotely setting up your Pine A64 Server and using using OpenVPN. PiVPN Rock64/A64/LTS PiVPN Tutorial on how to set up PiVPN on a Debian-based distribution pine64nutz Rock64/A64/LTS VNC Server Install and setup a VNC server for remote destkop access Michael Greene A64/LTS Octoprint Server Octroprint Server on the Pine A64 installation tutorial Michael Lenardson Rock64/A64/LTS Next Cloud Installation procedure that works on Pine A64/LTS and Rock64 running Ubuntu 16.04 Jose Fierro Rock64/A64/LTS WordPress/Web Server Rock64: LAMP + WordPress + Let’s Encrypt SSL Yuan Gao Rock64/A64/LTS Status Monitor Rock64: Monitor Rock64 status, like CPU usage, RAM usage, network traffic, etc. on webpage. Yuan Gao Rock64/A64/LTS Web Server Install LAMP/LNMP on Rock64 and easily to add SSL and other things. Cluster/Docker Computing Projects Cluster Projects Have you got two or more PINE64 Single Board Computer board? Consider building a cluster. Clutering of two or more PINE64 boards presents as a fantastic oportunity to explore and learn about node failure management, task scheduling, debuggin, data sharing and much more. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine ROCK64 Project Author(s) Device(s) Project Link Notes Climbers.net PINE A64/A64+/A64-LTS/SOPine 5 Node Cluster with PINE A64+ Cluster in a dedicated acrylic case Quantum Cannibal A64/LTS Docker Cluster Build Videos detailing Docker on a Pine A64 cluster Vivek Juneja A64/LTS Swarm Cluster Instructions to build a swarm cluster using Pine A64/LTS Kurt Stam LTS Docker CentOS Docker on a Pine A64 cluster running CentOS DiversITEurope A64/LTS Docker Installation Docker installation instructions for Pine A64 Mimuni Rock64 Rock64 Docker-compose Build docker-compose on Rock64 Board Home Automation Projects Home Automation Projects PINE64 Single Board Computers - all equipped with milti-core SOCs and GPIO - can become an adition to, or the basis for, your home automation project. Use an existing platform like OpenHAB which is compatible with commercially available devices, add aditional functionality to MotionEye, or just hack away and make things your own. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine ROCK64 Project Author(s) Device(s) Project Link Notes FrankA2 A64 Life Command Center Display weather, email and information about home using a Pine A64 Sytone A64/LTS Home Assistant Running home assistant on Pine A64 Pineadmin LTS/A64 Node-RED Install Node-RED for for wiering together hardware devices on the Pine A64/LTS Moustage LTS/A64 Domoticz setup instructions Domoticz on Pine64 using some cheap I2C modules Andrew Klimovski A64/LTS OpenHAB Basics Basic installation and setup of OPneHAB on Pine A64 running Ubuntu Jewgeni R A64/LTS ioBroker Video about ioBroker on Pine A64 N.B. In German Deviant Engineer A64/LTS/Rock64 Z-Wave bindings DietPi Z-Wave Bindings + Home Assistant installation from DietPi Robotics Projects Robotics Projects Use your PINE64 Single Board Computer featuring a milti-core SOCs and GPIO to have a go at robotics. Download an existing Open Source robotics project from Github or start your own; browse this section for inspiration and resources. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine ROCK64 Project Author(s) Device(s) Project Link Notes Name Device Link to project Notes about the project PADI IoT Stamps Projects PADI Projects PADI is a tiny microcontroller that can be used in conjunction with your PINE64 SBC or the Pinebook Project Author(s) Device(s) Project Link Notes thomash PADI Programming via IDE Programming PADI with Arduino IDE MarkHaysHarris777 PADI Programming PADI Programming PADI basics Other Projects Other Projects You have no doubt come up with something that we didn't think about, and that is truly great. Perhaps your project is interesting enough that it will be granted its own section. After all if you have imagination then sky is the limit. Suitable Devices for this Project PINE A64/A64+ PINE A64-LTS/SoPine PINEBOOK ROCK64 Project Author(s) Device(s) Project Link Notes bits_and_wires Pinebook case mod Pinebook Case modification MarkHaysHarris777 Pinebook Serial Console Cable Serial over 3.5 jack plug on the Pinebook MarkHaysHarris777 Pinebook Case mod Serial Console Case mod to access serial console switch inside the case doertepn A64/LTS Picture frame A Pine A64 picture frame using an old Apple computer vovakurz A64/LTS Ubiquiti UAPs rely on a UniFi CA UniFi relay for better/Smoother WiFi roaming. iPhyse A64/LTS Holodoc Project Instructions on creating a holographic doc using the Pine A64 carlosviansi A64/LTS Weather station Weather Station using Pine A64 + I2C POT KnReLe Pine A64 RTL-SDR RTL-SDR software that works out-of-the-box on the Pine A64 sgjava Pine A64/LTS Pine64 with small OLED Adding a small OLED screen to Pine A64 Dmoreno Pine A64/LTS Karaoke Karaoke software running on Pine A64 wahdooyah A64/LTS Phone Notifications Pushing notifications from home network to cell phone rontant Rock64/A64/LTS migrating rootfs to HDD/SSD Tutorial for migrating rootfs to an external diver Ron Kamphuis Rock64 IOTA Node Deploying full IOTA node on a ROCK64 4GB Lior Pachter Rock64 Bioinformatics on a Rock64 Kallisto bioinformatics for computational biologists evilbunny Rock64 WiFi with WebGUI A DIY WiFI AC AP / Router with WebGUI rmbusy Rock64 Survaillance system A DIY surveillance system using the Rock64 running Motion Retrieved from "https://wiki.pine64.org/index.php?title=Project&oldid=17946"'''
