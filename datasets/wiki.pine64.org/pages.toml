title = "PINE A64-LTS - PINE64"
full_description = '''PINE A64-LTS From PINE64 Jump to navigation Jump to search The PINE A64-LTS The PINE64-LTS is the long term supply version of the PINE A64 (+), PINE64's first single board computer, powered by Allwinner’s A64 quad-core ARM Cortex A53 64-Bit SoC. There are many operating systems available for the PINE A64-LTS created by the open source community and various partner projects. The PINE A64-LTS is guaranteed to be supplied until the year 2025 at the very least. Contents 1 Software releases 2 Accessories and Step-by-Step Guides 3 SoC and Memory Specification 3.1 CPU Architecture 3.2 GPU Architecture 3.3 System Memory 4 PINE A64-LTS Board Features 4.1 Video 4.2 Audio 4.3 Network 4.4 Storage 4.5 Expansion ports 4.5.1 Serial console UART 5 Board Data and Schematic 6 Datasheets for Components and Peripherals 7 Pine A64 POT 8 Other Resources Software releases The SOPINE operating system images are compatible with PINE A64-LTS. Under SOPINE Software Releases you will find a complete list of currently supported operating system images, which work with the PINE A64-LTS, as well as other related software. Accessories and Step-by-Step Guides Please see Accessories Step by Step Guides for a list of guides for Pine A64 accessories; there you can find instructions and guides about the following: Enclosures Bluetooth and WiFi module Real Time Clock (RTC) battery Real Time Clock (RTC) battery holder First and third party cases Featured 3D printed cases (and more) SoC and Memory Specification The PINE A64-LTS is based on the Allwinner A64/R18. The R18 and A64 are identical SoCs but the is R18 committed for a 10 years supply by the vendor. CPU Architecture Quad-core ARM Cortex-A53 Processor@1152Mhz A power-efficient ARM v8 architecture 64 and 32bit execution states for scalable high performance Support NEON Advanced SIMD (Single Instruction Multiple Data) instruction for acceleration of media and signal processing function Support Large Physical Address Extensions(LPAE) VFPv4 Floating Point Unit 32KB L1 Instruction cache and 32KB L1 Data cache 512KB L2 cache GPU Architecture ARM Mali400MP2 Dual-core GPU Support OpenGL ES 2.0 and OpenVG 1.1 standard System Memory RAM Memory Variants: 2GB LPDDR3. Storage Memory: 128Mb SPI Flash and optional eMMC module from 16GB up to 128GB PINE A64-LTS Board Features Front view of a Pine A64-LTS board Rear view of a Pine A64-LTS board Video Digital Video (Type A - full) Audio 3.5mm stereo earphone/microphone plug Network 10/100/1000Mbps Ethernet(PINE A64+ version), 10/100Mbps Ethernet(PINE A64 version) WiFi 802.11 b/g/n with Bluetooth 4.0 (optional) Storage microSD - bootable, support SDHC and SDXC, storage up to 256GB USB - 2 USB2.0 Host port Expansion ports DSI - Display Serial Interface, four-lane MiPi, up to 1080p CSI - CMOS Camera Interface up to 5 megapixel TP - Touch Panel Port, SPI with interrupt RTC - Real Time Clock Battery Connector VBAT - Lithium Battery Connector with temperature sensor input Wifi/BT Module Header - SDIO 3.0 and UART 2x20 pins "Pi2" GPIO Header 2x17 pins "Euler" GPIO Header 2x5 pins "EXP" Console Header Serial console UART An excerpt from the A64-LTS schematic, showing the "EXP" header pinout The "EXP" header, listed above, includes the TX, RX and GND pins for the serial console UART, also known as the debug UART, as visible in the picture in this section. The pin numbers are silkscreened on the top side of the A64-LTS PCB, making navigation easy. This can be used to access the serial console of the boot loader, for example, which is often invaluable for debugging boot issues. To actually access the serial console, you can use these pins to connect, for example, a USB UART adapter that supports 3.3 V on the RX and TX lines, such as the "Woodpecker" USB UART adapter offered by the Pine Store. Warning: Older PCB revision of the "Woodpecker" USB UART adapter has a fixable hardware issue that is described in detail in a product change note, which includes the way to check is your adapter affected. In a nutshell, the 3.3 V mode of the older "Woodpecker" adapters sold by the Pine Store is unreliable, but the hardware fix is available. Newer "Woodpecker" adapters sold by the Pine Store are not affected by this issue. Taking the "Woodpecker" USB UART adapter as an example, its pins should be connected to the pins of the "EXP" header as described in the table below, with the "5V" and "3V3" pins of the "Woodpecker" left unconnected. The voltage selection jumper found on the "Woodpecker" must be placed in the "3V3" position, as silkscreened on the top side of the "Woodpecker" PCB. "Woodpecker" pin "EXP" header pin name "EXP" header pin number TxD PB9_RX 8 RxD PB8_TX 7 GND GND (or GND1) 9 (or 6) Board Data and Schematic Model "A" Baseboard dimensions: 133 mm x 80 mm x 19 mm Power inputs: DC barrel jack, 3.5 mm OD / 1.35 mm ID, 2 A at 5 V 3.7 V lithium-ion battery connector Euler connector Schematics: PINE A64 Connector Layout @courtesy of norm24 PINE A64 Connector List a PDF mapping the pins from the A64 chip itself, to the gold-fingers on the SO-DIMM edge, to the multiple connectors on the Baseboard and the Clusterboard, attached to this forum post PINE A64 Pi-2/Eular/Ext Bus/Wifi Bus Connector Pin Assignment (Updated 15/Feb/2016) Good documentation about PINE A64, A64+, and A64-LTS GPIO pins article and Archive.org link Pine A64-LTS schematic: Pine A64-LTS Schematic Pine A64-LTS V2 schematic: Pine A64-LTS V2 Schematic Datasheets for Components and Peripherals Allwinner A64/R18 SoC information: Allwinner A64 SoC Brief Introduction Allwinner R18 SoC Brief Introduction Allwinner A64/R18 SoC Data Sheet V1.1 (Official Released Version) Allwinner A64/R18 SoC User Manual V1.0 (Official Release Version) X-Powers AXP803 PMU (Power Management Unit) information: AXP803 PMIC Datasheet LPDDR3 information: Allwinner LPDDR3 Datasheet Foresee LPDDR3 Datasheet Samsung LPDDR3 Datasheet Hynix LPDDR3 Datasheet eMMC information: PINE64 eMMC module schematic PINE64 USB adapter for eMMC module V2 schematic PINE64 USB adapter for eMMC module PCB in JPEG 16GB Foresee eMMC Datasheet 32GB/64GB/128GB SanDisk eMMC Datasheet SPI NOR Flash information: WinBond 128Mb SPI Flash Datasheet GigaDevice 128Mb SPI Flash Datasheet Related to the PINE A64-LTS: 5MPixel CMOS Camera module information: PINE64 YL-PINE64-4EC 5M Pixel CMOS Image Sensor Module (Description in Chinese) S5K4EC 5MP CMOS Image Sensor SoC Module Datasheet S5K4EC 5MP CMOS Image Sensor SoC Chip Datasheet S5K4EC 5MP CMOS Image Sensor Driver Source Code in C language Early version Camera module information: Bonsen Kexin V118-A64-GC2145-HM5065 CMOS Image Sensor Module HiMax 5MP CMOS Image Sensor SoC LCD Touch Screen Panel information: 7.0" 1200x600 TFT-LCD Panel Specification Touch Panel Specification GOODiX GT911 5-Point Capacitive Touch Controller Datasheet Lithium Battery information: 8000mAH Lithium Battery Specification Ethernet PHY information: Realtek RTL8211 10/100/1000M Ethernet Transceiver for PINE A64-LTS Board and SOPINE Baseboard Wifi/BT module information: PINE A64 Wifi/BT Module Schematic Realtek RTL8723BS WiFi with BT SDIO Enclosure information: Playbox Enclosure 3D file ABS Enclosure 3D file Outdoor Aluminum Cast Dust-proof IP67 Enclosure Drawing Connector information: 2.0mm PH Type connector specification use in Lithium Battery (VBAT) port and RTC Battery port 0.5mm Pitch cover type FPC connector specification use in DSI port, TP port and CSI port Remote control button mapping Official Remote Control for the PINE A64 Button Mapping Pine A64 POT PINE A64 Peripheral On Top (POT) and Related Devices WiFi Remote I2c Quick Start Guide Other Resources Linux Sunxi Wiki page on PINE A64 Collection of scripts to set up a minimal Xenial 14.04.3 / Debian 8 Jessie root filesystem Contributed By Uli Middelberg Linux Image created by Andre Przywara PINE A64 with HypriotOS by Dieter and Govinda H2testw 1.4 – Gold Standard In Detecting USB Counterfeit Drives F3 - an a