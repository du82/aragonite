title = "Pinedio - PINE64"
full_description = '''Pinedio From PINE64 Jump to navigation Jump to search The Pinedio is a device utilizing LoRa. LoRa is a long range, low power wireless platform that is being used by a lot of Internet of Things (IoT) products. Using LoRa and LoRaWAN, devices can communicate across the world using the internet, using various decentralised networks such as The Things Network or Helium. Since, PINE64 believes in openness, the LoRa gateway can connect to any network, per the developer implementation. If Helium Spots open up for PINE64 gateway and developers have implemented the hook for Helium, then this is good thing. The PINE64 LoRa gateway also open connect to The Things Network if developers implement support. The choice is yours! Contents 1 Gateway 1.1 Connections 1.2 Pictures 1.3 Operating systems 2 USB adapter 2.1 Pins 2.2 Kernel module for CH341 2.3 Driver development 2.3.1 Kernels 5.14 and older 2.3.2 Kernel 5.15 and newer 2.4 Driver for the SX1262 LoRa module 3 Other end nodes 3.1 Pictures 4 Datasheets and schematics 4.1 Gateway 4.2 End nodes 4.3 Pinephone backplate 4.4 USB LoRa adapter 4.5 PineDio Stack 5 Other resources Gateway The gateway will be available in two variants - indoor and outdoor. All that is known about the outdoor unit is that it will have "an aluminum, rugged and water resistant case". The indoor unit consists of a PINE A64-LTS, fitted with a purpose built hat (adapter) which uses a LoRa module by RakWireless. The chipset used is the SX1303, and the module via the SPI interface. There are two external connections on the enclosure for the GPS and loRa antenna. Connections GPS is connected to UART2 on the A64 board SX1303 on SPI0 RAK5146 module PI-2 connector PINE A64-LTS SX1303 SPI Pin 19 = MOSI / PC0Pin 21 = MISO/PC1Pin23 = CLK/PC2Pin24 = CS/PC3 SPI0 (/dev/spidev0.0) SX1303 RESET Pin 11 = GPIO17/PC7 GPIO71 (/sys/class/gpio/gpio71) GPS UART Pin 8 = TX/Pin 10 = RX UART2 (/dev/ttyS2) GPS RESET Pin 33 = GPIO13/PC5 GPIO69 (/sys/class/gpio/gpio69) GPS Standby Pin 35 = GPIO19/PC9 GPIO73 (/sys/class/gpio/gpio73) Pictures Operating systems The Pinedio Gateway carries the A64-LTS board. The SOPINE releases are also compatible based on the RAM specifications. USB adapter The PINE64 USB LoRa adapter The PINE64 USB LoRa adapter is based on the Semtech SX1262 LoRa module and the CH341 USB bus converter chip. The CH341 chip can be configured in multiple mode to convert USB to various serial and parallel ports. In this case, it's configured in synchronous serial mode, which allows this chip to convert from USB to the SPI bus needed to talk to the SX1262 LoRa module: -------- -------------------------- | | | USB LoRa Adapter | | PC | <--USB--> | CH341 <--SPI--> SX1262 | | | | <--I/O--> | -------- -------------------------- Pins Pinout SX1262 Pin Name Description 1 ANT Antenna 2 GND2 3 VREG 4 DCC 5 VCC 6 DIO1 Connected on CH341 Pin 7 7 DIO2 Connected on CH341 Pin6 8 DIO3 Connected on CH341 Pin 5 9 GND 10 MISO SPI MISO (CH341 Pin 20) 11 MOSI SPI MOSI (CH341 Pin 22) 12 SCK SPI clock (CH341 Pin 24) 13 NSS SPI Chip select 14 POR Reset pin 15 Busy Busy pin 16 GND Kernel module for CH341 We need a driver for the CH341 USB bus converter chip. This driver will allow us to send command to the CH341 (SPI messages and access to the GPIOs). I've successfully build and run this driver from rogerjames99 on my desktop computer (running Manjaro Linux) and on my Pinebook Pro (ARM64, running Manjaro ARM Linux). For any kernel newer than 3.10 but mandatory for kernels newer than 5.15 you need to use the dimich-dmb fork of the the spi-ch341-usb driver. This fork has updated documentation for the newer kernel interfaces. If this driver gives you problems please drop by any of the social platforms in the Pine64 LoRa chat and give a holler, and if you are using a 5.15 or older kernel you can use the rogerjames99 fork. $ git clone https://github.com/rogerjames99/spi-ch341-usb.git or $ git clone https://github.com/dimich-dmb/spi-ch341-usb.git then $ cd spi-ch341-usb $ make $ sudo make install Once the driver is installed, unload the module ch341 if it has been automatically loaded: $ lsmod |grep ch341 $ sudo rmmod ch341 On my setup, ch341 would be automatically loaded once I connected my USB adapter. This module drives the CH341 is asynchronous serial mode, which will not work for a SPI bus. Then load the new module: $ sudo modprobe spi-ch341-usb Plug your USB adapter and check that the module is correctly loaded : $ dmesg [20141.872107] usb 1-1.1: USB disconnect, device number 4 [20143.820756] usb 1-1.1: new full-speed USB device number 5 using ehci-platform [20143.973366] usb 1-1.1: New USB device found, idVendor=1a86, idProduct=5512, bcdDevice= 3.04 [20143.973413] usb 1-1.1: New USB device strings: Mfr=0, Product=2, SerialNumber=0 [20143.973434] usb 1-1.1: Product: USB UART-LPT [20143.975137] spi-ch341-usb 1-1.1:1.0: ch341_usb_probe: connect device [20143.975164] spi-ch341-usb 1-1.1:1.0: ch341_usb_probe: bNumEndpoints=3 [20143.975183] spi-ch341-usb 1-1.1:1.0: ch341_usb_probe: endpoint=0 type=2 dir=1 addr=2 [20143.975206] spi-ch341-usb 1-1.1:1.0: ch341_usb_probe: endpoint=1 type=2 dir=0 addr=2 [20143.975229] spi-ch341-usb 1-1.1:1.0: ch341_usb_probe: endpoint=2 type=3 dir=1 addr=1 [20143.975254] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: output cs0 SPI slave with cs=0 [20143.975273] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: output cs0 gpio=0 irq=0 [20143.975295] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: output cs1 SPI slave with cs=1 [20143.975313] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: output cs1 gpio=1 irq=1 [20143.975334] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: output cs2 SPI slave with cs=2 [20143.975352] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: output cs2 gpio=2 irq=2 [20143.975373] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: input gpio4 gpio=3 irq=3 [20143.975394] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: input gpio6 gpio=4 irq=4 [20143.975415] spi-ch341-usb 1-1.1:1.0: ch341_cfg_probe: inpu