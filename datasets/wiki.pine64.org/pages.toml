["https://wiki.pine64.org/wiki/Pinebook_Pro"]
title = "Pinebook Pro - PINE64"
full_description = '''Pinebook Pro From PINE64 Jump to navigation Jump to search Pinebook Pro running Debian with MATE The Pinebook Pro is an ARM laptop from PINE64 for Linux and *BSD. It is designed to be a compelling open alternative to mid-ranged Chromebooks that people convert into Linux laptops. The Pinebook Pro features an IPS 1080p 14″ LCD panel, a premium magnesium alloy shell, eMMC storage, a 10,000mAh (9,600mAh in later batches) capacity battery, and the modularity that only an open source project can deliver with the dimensions of 329mm x 220mm x 12mm (WxDxH). Key features include the Rockchip RK3399 SoC, USB-C (data, DP 1.2 video out, and power in (2.5A at 5V), privacy switches for the microphone, BT5/WiFi4 SDIO module, 2MP camera, and PCIe x4 gen1 expansion with an optional adapter via ribbon cable. The Pinebook Pro is equipped with 4GB LPDDR4 system memory, 16MB (128Mbit) SPI flash for boot, eMMC connector (up to 128GB flash storage module), and SSD with optional adapter. The I/O includes: micro SD card reader (bootable), USB 2.0 A, USB 3.0 A, USB 3.0 Type-C host with DP 1.2 and power-in, PCI Express x4 for an M.2 NVMe SSD drive (requires an optional adapter), and serial console UART (via the headphone jack by setting an internal switch). The keyboard and touchpad both use the USB 2.0 protocol. The LCD panel uses the eDP MiPi display protocol. Contents 1 Software and OS Image Downloads 1.1 Default Manjaro KDE Desktop Quick Start 1.2 Pinebook Pro images 1.3 Linux, the kernel, downstream source 1.4 Hardware-accelerated video decoding 2 Keyboard 2.1 Typing special characters 2.2 Privacy Switches 2.3 Basic summary of replacing keyboard 3 Touchpad (trackpad) 3.1 Troubleshooting 3.2 Firmware 3.2.1 ISO Model 3.2.2 ANSI Model 3.2.3 Revised Firmware 3.3 X Window System Configuration 4 Power Supply 5 LEDs 6 Webcam 7 Audio 7.1 ALSA configuration 7.2 Pop/click suppression workaround 7.3 Speaker polarity workaround 8 Microphones 8.1 Built-in microphones not working 8.2 External wired microphone not working 9 Bluetooth and WiFi 9.1 Hardware Overview 9.2 Issues 9.3 Wi-Fi Capabilities 9.4 Bluetooth Capabilities 9.5 Disabling Bluetooth 10 LCD Panel 11 External ports list 12 Using the serial console UART 13 Using the optional NVMe adapter 13.1 Installing the adapter 13.2 Post NVMe install power limiting 13.3 Using as data drive 13.4 Using as OS root drive 14 Caring for the Pinebook Pro 14.1 Bypass Cables 14.2 Self-Service Step-by-Step Guides 15 Using the SPI flash device 16 Software tuning guide 17 Troubleshooting guide 18 Hardware/Accessory Compatibility 19 Disassembly and Reassembly 19.1 Display Disassembly 20 Internal Layout 20.1 Main chips 20.2 Mainboard Switches and Buttons 20.3 Key Internal Parts 20.4 Smallboard detailed picture 21 Bootable Storage 21.1 Boot sequence details 21.2 Boot devices 21.3 eMMC information 22 Case Dimensions and Data 23 SoC and Memory Specification 23.1 CPU Architecture 23.2 GPU Architecture 23.3 System Memory 23.4 Video out 23.5 Expansion Ports 24 Additional hardware 24.1 Battery 24.2 Display 24.3 Lid closed magnet 24.4 Webcam 24.5 Audio 24.6 Network 24.7 Optional NVMe adapter 25 Pinebook Pro Schematics and Certifications 26 Datasheets for Components and Peripherals 27 Versions 28 Skinning and Case Customization 29 Other Resources Software and OS Image Downloads Many different Operating Systems (OS) are freely available from the open source community and partner projects. These include various flavors of GNU/Linux (Ubuntu, Debian, Manjaro, etc.) and *BSD. Default Manjaro KDE Desktop Quick Start When you first get your Pinebook Pro and boot it up for the first time, it should come with Manjaro using the KDE desktop installed on a 64GB eMMC module. The Pinebook Pro is officially supported by the Manjaro ARM project, and support can be found on the Manjaro ARM forums. On first boot, it will ask for certain information such as your timezone location, keyboard layout, username, password, and hostname. Most of these should be self-explanatory. Note that the hostname it asks for should be thought of as the "name" of your machine, and if you don't know what it's about, you can make something up (use a single word, all lower case, no punctuation, e.g. "pbpro"). After you're on the desktop, be sure to update it as soon as possible and reboot after updates are finished installing. If nothing appears when you click on the Networking icon in your system tray to connect to your Wi-Fi, ensure the Wi-Fi privacy switch is not disabled. Pinebook Pro images Under Pinebook Pro Software Releases you will find a complete list of currently supported Operating System images that work with the Pinebook as well as other related software. Linux, the kernel, downstream source Although the current upstream version boots and works, the development of new features and other improvements is still ongoing. The results (including detailed changelogs) are published on megi's tree. Hardware-accelerated video decoding Drivers for accelerated video decoding are available in the current kernels but to use the v4l2-request API with FFmpeg (and the apps that depend on it) one needs to build a fork. With mpv built against it and the integrated yt-dlp support watching YouTube and similar sources is possible without stressing the CPU. Read more at Mainline Hardware Decoding. Keyboard The Pinebook Pro is available in two keyboard configurations: ISO and ANSI. Both the keyboard and touchpad in the Pinebook Pro use the USB 2.0 protocol and show up as such in xinput. The keyboard features function (Fn) keys in the F-key row, which include display brightness controls, sound volume, touchpad lock, and other functionality. There is also a custom PINE64 logo key that functions as Menu/Super key. It has also a secondary functionality for setting the privacy switches. The keyboard firmware binary can be flashed from userspace using the provided open source utility. Warning: DO NOT update the keyboard firmware before checking which keyboard IC your Pinebook Pro has. Some Pinebook Pro were delivered with a SH61F83 instead of a SH68F83. The SH61F83 can only be written 8 times, this will render the keyboard and touchpad unusable if this limit is reached when step 1 is flashed, see the Reddit SH61F83 thread. The keyboard IC corresponds to U23 on the top layer silkscreen of the main board. It is located under the keyboard flat flexible cable. Documentation for the keyboard can be found in Datasheets for Components and Peripherals and details regarding the assembly can be found under Pinebook Pro Keyboard Assembly. Typing special characters The UK ISO Layout does not have dedicated keys for characters like the German umlauts (Ä, Ö, Ü, etc). Certain characters can still be generated by means of either key combinations or key sequences. Character Key combination/sequence Ä, Ö, Ü, ä, ö, ü [AltGr]+'[' followed by [A], [O], [U], [a], [o] or [u] µ [AltGr]+[m] Ø, ø [AltGr]+[O], [AltGr]+[o] @ [AltGr]+[q] (as on the German layout) ß [AltGr]+[s] § [AltGr]+[S] ° [AltGr]+[)] Privacy Switches There are three privacy switches mapped to the F10, F11 and F12 keys on the Pinebook Pro keyboard. They de/activate the following: Privacy switch function and description Combination Effect Description Notes PINE64 logo key+F10 Microphone Privacy switch CAPs lock LED blinks. 2 blinks = enabled, 3 blinks = disabled PINE64 logo key+F11 WiFi Privacy switch NUM lock LED blinks. 2 blinks = WiFi enabled / privacy switch disabled, 3 blinks = WiFi disabled / privacy switch enabled. Re-enabling requires reboot (or a command line hack to bind/unbind). PINE64 logo key+F12 Camera privacy switch CAPs lock and NUM lock LEDs blink together. 2 blinks = enabled, 3 blinks = disabled Can use tools like lsusb to detect camera's presence. If not detected, check privacy switch. (Press the PINE64 logo key plus F10/F11/F12) for 3 seconds) The keyboard operates on firmware independent of the operating system. It detects if one of the F10, F11 or F12 keys is pressed in combination with the Pine key for 3 seconds. Doing so disables power to the appropriate peripheral, thereby disabling it. This has the same effect as cutting off the power to each peripheral with a physical switch. This implementation is very secure, since the firmware that determines whether a peripheral gets power is not part of the Pinebook Pro’s operating system. So the power state value for each peripheral cannot be overridden or accessed from the operating system. The power state setting for each peripheral is stored across reboots inside the keyboard's firmware flash memory. Basic summary of replacing keyboard This guide is very basic and should be fleshed out with (better) pictures. There just isn't a list of steps anywhere else yet. Here's what the replacement keyboard looks like: Step 0: If changing from ISO keyboard to ANSI keyboard, or vice versa, be sure to have a system capable of running the firmware updater that you can access either remotely or with a USB keyboard beyond the internal keyboard, as the firmware for each is very different and keys won't work correctly. See https://forum.pine64.org/showthread.php?tid=8407 (and for NetBSD, https://forum.pine64.org/showthread.php?tid=8716). Step 1: The remove back back panel. There are 10 screws on the back that must be removed, and the back panel detached. I recommend using a PH0 bit. The speakers may remain attached via glue to the case and should be carefully pried off. When this is done, taking photos of how everything looks now can help put it all back together later. Step 2: Places to unscrew. There are 3 items screwed into the keyboard frame that must be removed. There are 2 large screws for daughter board, 3 large screws and 1 small screw for mainboard, and 4 small screws for battery. Be sure to not lose them. I recommend a PH00 bit for the large screws on the daughter and main boards and a PH1 bit for the small screws on the battery and mainboard. Step 3: Remove the battery. Once the battery screws are removed, it should be unplugged from the mainboard and removed. Note that there are two unconnected cables lying around, that should remain unconnected. They are used when the battery is disconnected entirely. Step 4: Unplug the ribbon cables. NOTE: you should remove the M.2 adapter board now if you have one installed. See elsewhere in this wiki for instructions on how to install/remove that piece. There are several ribbon cables. To remove, flip up the tab and gentle pull the ribbon out. One cable runs from the mainboard to the daughterboard underneath the battery. Detach from both ends. With the battery removed, detach from keyboard shell, and set aside for the new keyboard shell. One cable runs between the touchpad and the mainboard. Detach from both ends, and also set aside. One cable runs between the keyboard and the mainboard. This one remains attached to the keyboard and only needs to be detached from the mainboard. One cable from the LCD attaches near the lid hinge. It should be just unplugged. Step 5: Detach microphone, speakers, and antenna. One of the Pinebook Pro microphones after removal The speakers, microphone, and antenna don't have to be detached from the mainboard, but they need to be detached from the keyboard shell. The microphones are held in place by tape, and the speakers have sticky sides. The speakers are found obviously, but the microphones (two of) can be found between the battery and the hinge area. Each microphone can be carefully pulled/wedged out of its position by a small screwdriver or pick. The antenna, similar to the microphones, is found near the hinge area and to the top left of the battery. Step 6: Remove mainboard and daughterboard. At this point, the mainboard and daughterboards should be removed. When unscrewed (see Step 2) they should pull out fairly easily. Put them aside (including microphones and speakers if left attached.) Step 7: Detach the LCD panel. Step 2 didn't tell you, there are 6 more screws to remove here, 3 for each of the hinges. I recommend a PH1 bit for these screws. Unscrew these and the LCD panel will be able to be removed. You may have to jiggle or move the hinges for this. When detached, be sure to place the LCD panel such that the display is protected. Step 8: Try not to break your touchpad NOTE This section really feels like you're going to break something. The touchpad is glued to the keyboard shell and it's glued well. There are two places it is glued to. If you can, only the middle must be force-detached. You will think you're going to break it. Gently apply increasing force until the glue begins to detach (you will hear a crackle as it comes off), and continue very slowly until the whole thing is detached. This may take minutes due to that feeling you're going to break it. I found it helpful to lift the top left plastic bit on the keyboard to unstick that portion of the touchpad, then push on the top left portion of the touchpad to unstick the rest of the touchpad. Step 9: Over the hill, touchpad goes into new shell. In the new keyboard shell put the touchpad back where it was, hopefully the glue will remain sufficiently attached. If there is a glue issue, this guide unfortunately has no advice currently. Step 10: Reattach the LCD panel. The LCD panel should slot back into the keyboard frame, the same way it came out. If the hinges were moved, they should be *very* *gently* closed such that the LCD panel and keyboard closed like normal for the remaining steps. Step 11: Tape it out. Move any tape from the old keyboard shell to the new one. These items protect the mainboard and daughterboard, and keep various wires in their right place. Some are grey and some are black. For tape that holds the speakers, microhones, or their cables in place, do not reattach yet. Step 12: Board install. Install the mainboard, the daughtboard, and their connecting ribbon cable. Be sure to put the boards in place, 2 large flat screws for the daughterboard, 3 large flat screws and one small screw for the mainboard, before attempting to place the ribbon. Step 13: Microphone, speaker, and antenna install. Reattach the microphones, antenna, and speakers to their respective areas, making sure that both are properly oriented - the speaker "out" faces up, and the microphone cables as connected must face up (these are opposite directions.) Step 14: Reattach other ribbon cables. NOTE: this would be a good time to attach/install the M.2 adapter board if that is desired. See elsewhere in this wiki for those instructions. The LCD panel, keyboard and touchpad ribbon cables should be reattached. Make sure the flap is open, insert the ribbon into the slot (a portion of the cable will disappear), and push the flap down. The cable should not be easy to pull out. Step 15: Reattach the battery, and final re-tape. The battery should be installed with the 4 screws holding it in place, and the connector attached to the mainboard. Be sure to keep the two other'''
year_published = 2025
clearnet = "https://wiki.pine64.org/wiki/Pinebook_Pro"
