full_description = '''Want to edit, but don't see an edit button when logged in? Click here. TaiwanFrom PostgreSQL wiki(Redirected from Main Page/zh-hant)Jump to navigationJump to searchContents 1 PostgreSQL台灣使用者社群 2 PostgreSQL交流會 3 線上交流 4 PostgreSQL正體中文使用手冊 5 官網維運小組 6 Logo PostgreSQL台灣使用者社群 PostgreSQL台灣使用者社群官方網站 在台灣推廣PostgreSQL，為各種PostgreSQL文件進行正體中文化。 PostgreSQL交流會 每月均舉辦實體交流會，詳細時間地點，請加入FB社團以獲得最新社群訊息。 線上交流 加入我們的FB社團，分享你的觀點和疑問 加入社FB社團 追蹤 @pgsqlTaiwan 粉絲專頁，取得台灣社群的最新訊息 Follow us! PostgreSQL正體中文使用手冊 以正體中文台灣用語編譯，在GitBook發佈，歡迎參與協作，教學相長。 編譯版本為 PostgreSQL 10 PostgreSQL 正體中文使用手冊 關注Github專案 官網維運小組 歡迎加入PostgreSQL官網維運小組，由熱血使用者們共同討論，並在Github上一起開發，幫助更多人進入PostgreSQL。 pgsql-tw@github 也可以來 Facebook粉絲團看看。 聯絡我們：contact@postgresql.tw Logo Retrieved from "https://wiki.postgresql.org/index.php?title=Taiwan&oldid=34438" Categories: Zh-hantUsers group'''
