full_description = '''Want to edit, but don't see an edit button when logged in? Click here. ChineseFrom PostgreSQL wiki(Redirected from Main Page/zh)Jump to navigationJump to searchContents 1 Postgres用户大会 2 中国用户会 3 简体中文文档 4 外部站点 Postgres用户大会 Postgres Conference China 2015 中国用户会 用户会 [ QQ用户群：3336901 ] [ 近期活动 ] PostgreSQL 9.4 新特性测试与交流分享 杭州分场 时间: 2014-06-28 13:30 - 17:00 地点: 福云咖啡 , 杭州市西湖区天目山路335号福地创业园5楼 参与方式: 1.听众, 报名链接 http://bbs.pgsqldb.com:8079/client/pguser_info.php 2.分享者, 报名链接 http://bbs.pgsqldb.com:8079/client/pguser_info.php 分享要求: 所测试的功能点的详细描述, 测试方法, 测试过程, 测试结果, 分析. postgresql 9.4开发版下载地址 http://git.postgresql.org/gitweb/?p=postgresql.git;a=summary 费用: 免费 联系人: digoal QQ: 276732431 EMAIL: digoal@126.com 分享题目: 1.PostgreSQL 9.4新特性分享 (Francs, 立群) 2.PG过程语言代码封装交流 (Aida) 3.基于ZFS快照的PostgreSQL增量备份方案 (Digoal) 其他 PostgreSQL内核开发虚拟团队建设沟通 (Digoal) 北京分场 时间: 2014-06-28 13:30 - 17:00 地点: 北京市上地附近 参与方式: 1.听众, 发邮件至quanzongliang@foxmail.com报名. 2.分享者, 发邮件至quanzongliang@foxmail.com说明要分享的功能点. 分享要求: 所测试的功能点的详细描述, 测试方法, 测试过程, 测试结果, 分析. 费用: 免费 联系人: 逯永收（louis@easyea.com）、权宗亮（quanzongliang@foxmail.com） QQ群: 5276420 分享题目： 1.PostgreSQL存储过程加密方法演示（权宗亮） 简体中文文档 常见问题与解答 9.3文档翻译项目 9.1文档翻译项目 9.0中文文档 8.3 wiki版本 8.3 全文搜索（FTI）文档 8.1中文文档 外部站点 中文 BBS 中文社区网站 PG 中文杂志(pgmag.org)) Retrieved from "https://wiki.postgresql.org/index.php?title=Chinese&oldid=25745" Categories: ChineseUsers group'''
