title = "Main Page/fr - PostgreSQL wiki"
full_description = '''Want to edit, but don't see an edit button when logged in? Click here. Main Page/frFrom PostgreSQL wiki< Main PageJump to navigationJump to searchContents 1 Communauté Francophone 2 Quelques documents en français 2.1 Traductions 2.2 Documents originaux 2.3 Publications 2.3.1 Livres consacrés à PostgreSQL 2.3.2 Publications dans GNU/Linux Magazine France 2.4 Slides de présentation Communauté Francophone Le site de la communauté : http://www.postgresql.fr La documentation en français : http://docs.postgresql.fr Le forum d'entraide PostgreSQL : http://forum.postgresql.fr Liste d'entraide PostgreSQL : http://archives.postgresql.org/pgsql-fr-generale/ L'association PostgreSQLFr : http://asso.postgresql.fr Quelques documents en français Traductions Pourquoi préférer PostgreSQL à MySQL (par Christophe Chauvet, le 24/10/2007). Sécuriser votre base PostgreSQL (écrit par Hubert Lubaczewski, traduit par Damien Clochard, le 05/09/2007). Points à vérifier en ce qui concerne les performances de PostgreSQL 8.0 (écrit par Josh Berkus et Joe Conway, traduit par Guillaume Lelarge le 15/07/2005). Les bases de données par M. Deividson : les vues (article de la Gazette Linux, écrit par M. Deividson, traduit par Florence Cousin le 14/09/2008). Les bases de données par M. Deividson : les procédures stockées (article de la Gazette Linux, écrit par M. Deividson, traduit par Florence Cousin le 23/11/2008). Documents originaux Guide d'installation rapide de PostgreSQL 8.3 sur MacOS (par escapek le 11/02/2008). Utiliser un index pour les recherches sur des motifs tels que « colonne LIKE '%chaîne' » et sa suite, Index inversé, en C (par Thomas Reiss, respectivement le 15/07/2007 et le 05/09/2007). PostgreSQL 8.2 (par Guillaume Lelarge, le 04/03/2007). Langages de procédure : type OUT et INOUT (par Guillaume Lelarge, le 16/12/2005). Utilisation des rôles dans PostgreSQL 8.1 (par Guillaume Lelarge, le 29/11/2005). Fiche mémoire sur PostgreSQL (par Guillaume Lelarge, le 09/09/2005). Comparatif entre pgPool et pgBouncer (par Guillaume Lelarge, le 19/06/2007). Les nouveautés de PostgreSQL 8.3 (par Jean-Paul Argudo, janvier 2008). Slony : Impact de la perte d'un noeud esclave (par Cédric Villemain, novembre 2007). Réplication de base avec PostgreSQL : le log shipping (par Scheu, octobre 2008). PostgreQL et l'authentification Apache (par Pascal Brognez, le 16/06/2009) Guide de démarrage rapide avec PostgreSQL PDF (par Florence Cousin, le 20/06/2009). Installation de PostgreSQL 8.3 sous Windows (par Guillaume Lelarge, le 26/12/2009). Installation de PostgreSQL 8.4 sous Windows (par Guillaume Lelarge, le 29/12/2009). Présentation de la version 9.0 de PostgreSQL (par Marc Cousin, le 16/06/2010). Publications Livres consacrés à PostgreSQL PostgreSQL - Architecture et notions avancées, par Guillaume Lelarge, 2015, maj 2016. ISBN: 978-2-8227-0275-1 Bases de données PostgreSQL, gestion des performances, par Gregory Smith, mai 2011. ISBN: 978-2-7440-2483-2. Utiliser PostgreSQL, par Dominique Colombani, avril 2010. ISBN: 978-2-8150-0198-4. Bases de données, de la modélisation au SQL, par Laurent Audibert, 2009. ISBN: 978-2-7298-5120-0. Installer et débuter avec PostgreSQL, par Dominique Colombani, septembre 2009. ISBN: 978-2-8150-0180-9 . Entraînez-vous à créer et programmer une base de données relationnelle, François-Marie Colonna, novembre 2008. ISBN: 978-2-7460-4381-7. PostgreSQL - Administration et exploitation d’une base de données (2ème édition), par Sébastien Lardière. ISBN: 978-2-7460-3961-2 Publications dans GNU/Linux Magazine France Hors-Série 18, « Initiation à la réplication de bases de données » (par Grégoire Lejeune et Stéphane Schildknecht, février 2004) ; Hors-Série 18, « Haute-Disponibilité sous PostgreSQL » (par Stéphane Schildknecht, février 2004) ; numéro 103, « PostgreSQL 8.3 : quoi de neuf ? » (par Guillaume Lelarge, mars 2008) ; numéro 105, « Nouvelle gestion des journaux applicatifs sous PostgreSQL 8.3 » (et son supplément) (par Guillaume Lelarge, mai 2008). numéro 106, « Les vues systèmes sous PostgreSQL 8.3 » (par Guillaume Lelarge, juin 2008). numéro 107, « Gestion mémoire sous PostgreSQL » (par Guillaume Lelarge, juillet/août 2008). numéro 108, « PostgreSQL et ses journaux de transactions » (par Guillaume Lelarge, septembre 2008). numéro 109, « Opérations de maintenance sous PostgreSQL » (par Guillaume Lelarge, octobre 2008). numéro 111, « Recherche plein texte avec PostgreSQL 8.3 » (par Guillaume Lelarge, décembre 2008). numéro 112, « Les processus de PostgreSQL » (par Guillaume Lelarge, janvier 2009). Hors-série 44, « PostgreSQL 8.4 » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « Le projet PostgreSQL » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « Installation de PostgreSQL » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « Rapide configuration de PostgreSQL » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « Créer une base avec PostgreSQL » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « pgPool : le pooler multitâche » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « pgBouncer : un pooler simple, mais efficace » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « La réplication par les journaux de transactions » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « Slony : la réplication des données par trigger » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « Londiste : la réplication vue par Skype » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « pgPool-II : la réplication par duplication des requêtes » (par Guillaume Lelarge, septembre 2009). Hors-série 44, « Une synthèse, et en route vers le futur » (par Guillaume Lelarge, septembre 2009). Hors-série 45, « DRBD, la réplication des blocs disques » (par Guillaume Lelarge, décembre 2009). numéro 131, « Mise en place de la réplication avec PostgreSQL 9.0 1/2 » (par Guillaume Lelarge, octobre 2010). numéro 132, « Mise en place de la réplication avec PostgreSQL 9.0 2/2 » (par Guillaume Lelarge, novembre 2010). numéro 134, « PostgreSQL 9.0, les autres nouveautés » (par Guillaume Lelarge, janvier 2010). Slides de présentation Les bases de données OpenSource (par Stéphane Schildknecht, décembre 2005) ; Découvrons PostgreSQL (par Stéphane Schildknecht, décembre 2005) ; Haute-disponibilité et bases de données (par Stéphane Schildknecht, décembre 2005) ; Découvrons PostgreSQL (par Stéphane Schildknecht, décembre 2008) ; PostgreSQLFr (par Stéphane Schildknecht, décembre 2008) ; Atelier sur PITR et le LogShipping (par Jean-Christophe Arnu, aux RMLL 2008, juillet 2008). Atelier sur PL/pgsql (par Jean-Christophe Arnu, aux RMLL 2008, juillet 2008). PostgreSQL et la haute-disponibilité (par Jean-Paul Argudo, avril 2009). Haute disponibilité avec PostgreSQL (par Guillaume Lelarge, octobre 2009). Conférences françaises (et anglaises) lors du PGDay 2009. PG Day France 2018 Présentation PostgreSQL avec ICU et icu_ext (par Daniel Vérité, meetup PG Paris juin 2018) Retrieved from "https://wiki.postgresql.org/index.php?title=Main_Page/fr&oldid=40216" Category: Français'''
