["https://wiki.postgresql.org/wiki/Main_Page/he"]
title = "Main Page/he - PostgreSQL wiki"
full_description = '''Want to edit, but don't see an edit button when logged in? Click here. Main Page/heFrom PostgreSQL wiki< Main PageJump to navigationJump to search ברוכים הבאים ל PostgreSQL Wiki! wiki זה מכיל תיעוד למשתמש, הוראות ביצוע, וטריקים וטיפים הקשורים ל PostgreSQL. הוא משמש גם כאזור שיתוף פעולה עבור התורמיםהתומכים ב PostgreSQL. התיעוד למשתמש שאלות נפוצות מאמרים המיוצרים על ידי הקהילה, מדריכים ותיעוד מאמרים ומדריכים כלליים מדריכים PostgreSQL מדריכי התקנה מפורטים המרת ממסדי נתונים אחרים ל PostgreSQL השוואה עם מערכות מסדי נתונים אחרות ניהול ותחזוקת Database פיתוח ב PostgreSQL אופטימיזציה של ביצועים PostgreSQL שקופיות ומצגות קשורים ל PostgreSQL תיעוד באתר הראשי מדריכי PostgreSQL ספרי PostgreSQL מידע לתורמים אתה יכול למצוא משתמשים של PostgreSQL רבים ומפתחים בשיחת צ'אט ב- #postgresql ב- Libera. רשימת IRC nick names עם שמות האמיתים שלהם ניתן למצוא כאן אירועים קרובים מידע לפיתוח Advocacy חשבונות משתמשים כל הפעילות באתר זה צריכה להיות כפופה ל מדיניות פרויקט PostgreSQL כדי לערוך או ליצור תוכן באתר, תצטרך חשבון בקהילה. זה אותו חשבון השתמש לצורך הגשת החדשות או אירועים ב www.postgresql.org הערה: עקב פעילות הספאם האחרונה הרשאות "editor" מוענקות באופן ידני מעת לעתה. אם רק יצרת חשבון חדש בקהילה או אם לחשבון הנוכחי השלך היו הרשאות "editor" תבקש או ב PostgreSQL -www Mailinglist או ב PostgreSQL IRC Channel (כוון את בקשתך ל 'pginfra') לעזרה. נא לרשום שם חשבון בקהילה בבקשות אלה. Retrieved from "https://wiki.postgresql.org/index.php?title=Main_Page/he&oldid=36321" Category: Hebrew'''
