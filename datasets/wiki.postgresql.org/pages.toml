title = "Main Page/es - PostgreSQL wiki"
full_description = '''Want to edit, but don't see an edit button when logged in? Click here. Main Page/esFrom PostgreSQL wiki< Main PageJump to navigationJump to search ¡Bienvenido al wiki de PostgreSQL! Este wiki contiene la documentación, guías, how-tos, consejos y trucos relacionados con PostgreSQL en Español. También sirve como un área de colaboración para contribuyentes de PostgreSQL. Visite también el índice de material en español. Documentación de Usuario Preguntas Frecuentes Artículos, guías y documentación Como colaborar con PostgreSQL: Revisión de parches Conversión de datos a PostgreSQL Desarrollo con PostgreSQL Artículos sobre PostgreSQL Herramientas para PostgreSQL Guias de instalacion detalladas Mantenimiento y Administracion de Bases de Datos Optimizacion del Rendimiento PostgreSQL Presentaciones y Charlas relacionadas con PostgreSQL Documentación Oficial Manuales de PostgreSQL Libros de PostgreSQL Videos Peru: PostgreSQL Day 2007 Argentina: PostgreSQL Day 2008 Argentina: PostgreSQL Day 2012 Notas de Liberacion Actualización de Seguridad del 4 de Abril de 2013 Sin Clasificar Trabajando con Eclipse Informacion para Colaboradores Usted puede encontrar muchos usuarios y desarrolladores de PostgreSQL en #postgresql en Libera. Y una lista de nicks de IRC con sus respectivos nombres del mundo real se puede encontrar aqui. Próximos eventos Información de Desarrollo Fomento Cuentas de Usuario Todas las actividades en este sitio debe seguir las Políticas del Proyecto PostgreSQL. Con el fin de modificar o crear documentos en el sitio, necesitarás una Cuenta de la Comunidad de PostgreSQL. Esta es la misma cuenta utilizada a la hora de presentar noticias o eventos en www.postgresql.org, o añadir comentarios a la versión interactiva de la documentación oficial. Retrieved from "https://wiki.postgresql.org/index.php?title=Main_Page/es&oldid=40236" Category: Español'''
