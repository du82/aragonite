full_description = '''Want to edit, but don't see an edit button when logged in? Click here. Converting from other Databases to PostgreSQLFrom PostgreSQL wikiJump to navigationJump to searchContents 1 Terminology 2 Non-specific 3 Apache Derby 4 DBase II, III, IV+ / DBF Format 5 FileMaker Pro 6 IBM DB2 7 InterBase 8 Microsoft Access 9 Microsoft SQL Server 10 MySQL 10.1 Scripts, programs 10.1.1 2015 10.1.2 2014 10.1.3 2013 10.1.4 Previously 10.2 Documentation 11 Oracle 11.1 Utilities, tools, scripts etc. 11.2 Documentation, articles, presentations etc. 11.2.1 PostgreSQL documentation 11.2.2 Articles and presentations (in reverse chronological order) 12 Progress RDBMS 12.1 Utilities, tools, scripts etc. 13 Converting PostgreSQL Databases to other Databases Terminology PostgreSQL Terminology for Oracle DBAs PostgreSQL Terminology for SQL Server DBAs PostgreSQL Terminology for DB2 DBAs PostgreSQL Terminology for MySQL DBAs Non-specific Ispirer Toolkit performs automatic migration of any popular RDBMS to PostgreSQL. A free demo of Ispirer Toolkit is available. Convertum.ru is a robust tool for automatic migration of more than 25 databases, including migration to PostgreSQL. 30-days trial is available for free. DBConvert Streams is a versatile software that supports the conversion of various databases, including PostgreSQL, and enables real-time Change Data Capture (CDC) data replication. It provides cloud data integration and streaming capabilities across distributed platforms. Omni Loader is a massively parallel and horizontally scalable enterprise-class database migration solution. Easily loads millions of records per second into PostgreSQL. AbstraLinx is a metadata management GUI tool for Salesforce with the ability to convert Salesforce schema to PostgreSQL and other databases, such as MySQL, Oracle, SQL Server, Firebird, SQLite, etc. Full Convert is a reliable and easy-to-use database migration and synchronization solution, converting from more than 40 database engines to PostgreSQL and back. pgloader knows how to load data from MySQL, SQLite, MS SQL Server, dBase files, CSV files and fixed-width data files, and more. Released under The PostgreSQL Licence. DBConvert PostgreSQL database migration and sync software Database conversion and synchronization between PostgreSQL/ Amazon RDS, MySQL, MS SQL Server, SQL Azure, Oracle, MS Access. PostgreSQL supported up to 13, so not completely up-to-date. dbForge Studio for PostgreSQL is a feature-rich IDE for database development and management, whose features include comparison and synchronization of database schemas and table data, as well as migration of data to PostgreSQL. dbForge Edge is a multidatabase solution for DB development, design, management, and administration. A set of powerful features applies to all the most popular database management systems – PostgreSQL, MySQL, MariaDB, SQL Server, Oracle, and a wide range of cloud services. dbForge Data Compare for PostgreSQL is a tool that helps locate and review table data differences in PostgreSQL databases, create detailed comparison reports, and synchronize the content of source and target databases. dbForge Schema Compare for PostgreSQL/Redshift is a free solution that helps find and analyze differences in database schemas, generate comprehensive comparison reports, and synchronize schema changes in source and target databases. ERBuilder is a Windows GUI tool that helps to convert from various DBMS schema to PostgreSQL. Supported databases: MySQL, Oracle, SQL Server, Firebird, SQLite, Amazon Redshift, Amazon RDS, Microsoft Azure SQL database. ESF Database Migration Toolkit Enables you to transfer data across various databases, supporting PostgreSQL, MySQL, Oracle, SQL Server, IBM DB2, Informix, Microsoft Access, Microsoft Excel, dBase, Foxpro, Firbird, SQLite etc. - by Martin Williams Comparison of different SQL implementations by Troels Arvin (covers PG 8.4 and MySQL 5.0, so somewhat outdated) Transactional DDL in PostgreSQL: A Competitive Analysis by Greg Smith dataPro Conversion and database objects transfer tool for PostgreSQL, SQLite, MySQL, Oracle, SQL Server and Microsoft Access. convert tables schema and migrate data from one database type to another. Covers PG7 to PG9, so quite outdated. DataDiff CrossDB is a Windows GUI utility to compare and synchronize/transfer data from PostgreSQL to/from Oracle, MSSQL, MS Access or MySQL databases. PostgreSQL Data Wizard is a Windows GUI utility to transfer both schema and data from any ADO-compatible source (like MS Access, MySQL, SQL Server, Oracle, etc) to PostgreSQL. SQL::Translator is a Perl module for translating table definitions between different software. Foreign data wrappers may be useful for exporting data from other databases Postgres Migration Toolkit Software pack to convert Oracle, MySQL, SQL Server and FoxPro to PostgreSQL, and vice versa. sqlacrossover SQLAlchemy-based cross-database migration tool Skyvia Web service for cloud data integration for PostgreSQL with Salesforce, Dynamics CRM, SugarCRM, Zoho CRM, QuickBooks, FreshBooks, ExactTarget, MailChimp, Bigcommerce, MySQL, SQL Server, SQL Azure, Amazon RDS. OmniDB Open source full-featured web tool for database management. Currently supports PostgreSQL only. More RDBMS support coming soon, including the ability of converting databases from any supported RDBMS to PostgreSQL and back. Exportizer Enterprise Universal data conversion tool for PostgreSQL, Oracle, SQL Server, SQLite, Interbase, Firebird, MySQL, DB2, Informix, SQL Anywhere, Microsoft Access, Microsoft Excel, dBase, CSV. Can export data either from GUI or from command line. jOOQ SQL Translator Web service for SQL syntax translation between > 25 RDBMS dialects Apache Derby derby2pg Converter program that will convert the tables, data and indexes in a given schema to a script that can be used to populate a PostgreSQL database. DBase II, III, IV+ / DBF Format ESF Database Migration Toolkit How to migrate dBase/Foxpro to PostgreSQL in an easy way. FoxPro-to-PostgreSQL a program to migrate FoxPro databases to PostgreSQL server. The program does not use ODBC or any other middleware software. Command line support allows to script, automate and schedule the conversion process. Full Convert is a reliable and easy-to-use database migration and synchronization solution, converting from more than 40 database engines to PostgreSQL and back (including dBase, Clipper, Visual FoxPro and other DBF variants). pgloader by Dimitri Fontaine Convert .dbf files into PostgreSQL by Tomasz Judycki A Visual Basic utility to convert Dbase III, IV, and V by Dennis Bazan Porting data from dBASE IV to PostgreSQL by Vijay Deval (2002-09-07) PgDBF : Simplified and optimized replacement for XBaseToPg by Kirk Strauser Exportizer Pro Converts data from dBase to PostgreSQL and back. FileMaker Pro Porting from FileMaker Pro to PostgreSQL by Michelle Murrain (24th August 2001) IBM DB2 Ispirer Toolkit automatically migrates the entire database schema (tables, views, stored procedures, functions, triggers, etc.) and transfers data from DB2 LUW, DB2 AS/400 (iSeries) and DB2 OS/390 (z/OS) to PostgreSQL. A free demo of Ispirer Toolkit is available. Convertum.ru is a robust tool for automatic migration of more than 25 databases, including migration from DB2 LUW, DB2 iSeries, and DB2 z/OS to PostgreSQL. 30-days trial is available for free. Omni Loader is a massively parallel and horizontally scalable enterprise-class database migration solution. Easily loads millions of records per second from DB2 LUW, iSeries, z/OS into PostgreSQL on-prem or on the cloud. Migrating from DB2 to PostgreSQL Full Convert is a reliable and easy-to-use database migration and synchronization solution, converting from more than 40 database engines to PostgreSQL and back (including DB2 LUW, DB2 iSeries, and DB2 z/OS). db2topg Migration tool to convert a DB2 UDB Database into a PostgreSQL database. Exportizer Enterprise Converts data from DB2 to PostgreSQL and back. ESF Database Migration Toolkit How to migrate DB2 to PostgreSQL in an easy way. InterBase Ispirer Toolkit automatically migrates the entire database schema (tables, views, stored procedures, functions, triggers, etc.) and transfers data from InterBase as well as Firebird to PostgreSQL. A free demo of Ispirer Toolkit is available. Convertum.ru is a robust tool for automatic migration of more than 25 databases, including migration from Interbase to PostgreSQL. 30-days trial is available for free. DBConvert migration software that exports data from Interbase/ Firebird to PostgreSQL. DBSync tool enables synchronization between Interbase and Postgres. DBReplicate - Simplify Interbase->PostgreSQL conversions by Kirk Strauser Full Convert is a reliable and easy-to-use database migration and synchronization solution, converting from more than 40 database engines to PostgreSQL and back (including Interbase). Exportizer Enterprise Converts data from Interbase to PostgreSQL and back. ESF Database Migration Toolkit How to migrate Interbase/FireBird to PostgreSQL in an easy way. Microsoft Access ESF Database Migration Toolkit How to migrate MS Access to PostgreSQL in an easy way. Cross-Database conversion and synchronization software Transfer data from Microsoft Access to PostgreSQL and keep them synchronized. Linking to MS Access tables with ogr_fdw If your PostgreSQL is on windows, you can use ogr_fdw foreign data wrapper, packaged with PostGIS 2.2+ bundle for windows via application stackbuilder. With PostgresQL 9.5, you can use IMPORT FOREIGN SCHEMA to link in all the MS access tables and then cherry pick how you want to restructure. exportSQL - a Microsoft Access module which exports Access Database into MySQL, mSQL and PostgreSQL by Dobrica Pavlinusic. Based on the work of Pedro Freire Full Convert is a reliable and easy-to-use database migration and synchronization solution, converting from more than 40 database engines to PostgreSQL and back (including Access). Exportizer Enterprise Converts data from MS Access to PostgreSQL and back. MDB Tools by Brian Bruns A quick way to dump all tables as tsv or csv files for TT in $(mdb-tables file.mdb); do mdb-export -Q -d '\t' -D '%Y-%m-%d %H:%M:%S' file.mdb "$TT" > "${TT}.tsv" done for TT in $(mdb-tables file.mdb); do mdb-export -D '%Y-%m-%d %H:%M:%S' file.mdb "$TT" > "${TT}.csv" done If the tablenames have embedded spaces... mdb-tables -1 file.mdb| while read TT do mdb-export -D '%Y-%m-%d %H:%M:%S' file.mdb "$TT" > "${TT}.csv" done A shell script that may be useful for converting entire databases: #!/bin/sh -e mdbfn=$1 schemafn=$2 fkfn=$3 datafn=$4 schema=$5 tf=$(tempfile) pre="" [ -n "${schema}" ] && pre="\"${schema}\"." mdb-schema "${mdbfn}" postgres > "${tf}" # Schema file echo "BEGIN;\n" > "${schemafn}" sp="" [ -n "${schema}" ] && echo "CREATE SCHEMA \"${schema}\";\n" >> "${schemafn}" [ -n "${schema}" ] && sp="SET search_path = \"${schema}\", pg_catalog;\n" echo ${sp} >> "${schemafn}" awk '($0 !~ /^ALTER TABLE.*FOREIGN KEY.*REFERENCES/) {print;}' "${tf}" >> "${schemafn}" echo "\nEND;" >> "${schemafn}" # Foreign keys file echo "BEGIN;\n" > "${fkfn}" echo ${sp} >> "${fkfn}" awk '($0 ~ /^ALTER TABLE.*FOREIGN KEY.*REFERENCES/) {print;}' "${tf}" >> "${fkfn}" echo "\nEND;" >> "${fkfn}" # Data file echo "BEGIN;\n" > "${datafn}" echo "SET CONSTRAINTS ALL DEFERRED;\n" >> "${datafn}" mdb-tables -1 "${mdbfn}" | while read TT do mdb-export -Q -d '\t' -D '%Y-%m-%d %H:%M:%S' "${mdbfn}" "$TT" > "${tf}" awk -v pre="${pre}" -v TT="${TT}" \ '(NR==1) {gsub(/\t/,"\",\""); print "COPY " pre "\"" TT "\"(\"" $0 "\") FROM stdin;";}' "${tf}" >> "${datafn}" awk '(NR>1) {gsub(/\t\t/,"\t\\N\t"); gsub(/\t$/,"\t\\N"); gsub(/\t\t/,"\t\\N\t"); print;}' "${tf}" >> "${datafn}" echo "\\.\n" >> "${datafn}" done echo "END;" >> "${datafn}" rm -f "${tf}" If this script is saved to the file access2psql.sh and made executable, then it would be used as follows: access2psql.sh file.mdb schema.sql foreignkeys.sql data.sql pg_schema_name psql -f schema.sql pg_db_name psql -f data.sql pg_db_name psql -f foreignkeys.sql pg_db_name This script won't work properly if there are tab characters in text columns, though the call to mdb-export could be modified to export INSERT statements to fix this. Also, mdb-schema has trouble representing multi-column foreign keys, so foreignkeys.sql may need some manual editing. Importing Microsoft Access MDB into PostgreSQL on Linux by Michael Olschimke Microsoft Access to PostgreSQL Conversion by Jon Hutchings (2001-07-20) access2pgsql tool by Mariano Reingart Using MS Access as front end and PostgreSQL as back-end database by PostgresOnLine Journal - 2008-01-31 Microsoft SQL Server Ispirer Toolkit automatically migrates the entire database schema (tables, views, stored procedures, functions, triggers, etc.) and transfers data from Microsoft SQL Server to PostgreSQL. A free demo of Ispirer Toolkit is available. Convertum.ru is a robust tool for automatic migration of more than 25 databases, including migration from SQL Server to PostgreSQL. 30-days trial is available for free. Omni Loader is a massively parallel and horizontally scalable enterprise-class database migration solution. Easily loads millions of records per second from SQL Server and SQL Azure into PostgreSQL on-prem or on the cloud. Fully supports SQL Server CDC for continuous replication. MSSQL-to-PostgreSQL is a migration utility to convert SQL Server or SQL Azure databases to PostgreSQL. Option to filter data using SELECT-queries, synchronization mode, command line support. Full Convert is a reliable and easy-to-use database migration and synchronization solution, converting from more than 40 database engines to PostgreSQL and back (including SQL Server and SQL Azure). sqlserver2pgsql Migration tool to convert a Microsoft SQL Server Database into a PostgreSQL database pgloader by Dimitri Fontaine ESF Database Migration Toolkit How to migrate Microsoft SQL Server to PostgreSQL in an easy way. DBConvert for PostgreSQL and MS SQL Server Conversion and Sync software solutions for cross database migration between PostgreSQL/ Amazon RDS and MS SQL Server/ SQL Azure Learning PostgreSQL (Alexander Kuznetsov) - series of blog articles for SQL Server users (2013-10 ~ 2013-11) Converting SQL Server Table Structure to PostgreSQL Leo Hsu and Regina Obe (2011-09-03) Conversion of Microsoft SQL/ASP applications to PostgreSQL by Ethan Townsend (2005-06-23) Converting your data from MS SQL Server 7 to PostgreSQL 7.1.x by Ryan C. Bonham (2002-01-05) Microsoft SQL Server to PostgreSQL Migration by Ian Harding (2001-09-17) Compare SQL Server 2008 R2, Oracle 11G R2, PostgreSQL/PostGIS 1.5 Spatial Features BostonGIS (2010-06-01) Cross Compare of SQL Server 2005, MySQL 5, and PostgreSQL 8.3 by Leo Hsu and Regina Obe (2008-05-13) Cross Compare of SQL Server 2008, MySQL 5.1, and PostgreSQL 8.4 by Leo Hsu and Regina Obe (2009-08-15) Universal Unique Identifiers PostgreSQL SQL Server Compare Demonst'''
