["http://wiki.python.org/jython/JythonMonthly/Newsletters/August2008"]
title = "JythonMonthly/Newsletters/August2008 - JythonWiki"
full_description = "Jython Monthly August 2008 -- Issue #21 Another great month of Jython triumph. It seems to be the norm as of late, Jython continues to get better and the community continues to grow. The NbPython project, aimed at providing Jython support in the Netbeans IDE, continues to advance. The Jython developers continue to plug away on the 2.5 release as you read. Jython websites based on the Django framework are now possible. It seems as though the language is on a roll. Jython Monthly will be hosting another community interview over the course of the next few weeks. This time, we will be interviewing Jim Baker, a Jython developer and expert. See below for more details... I plan to revamp the Jython Monthly newsletter over the next month or two. I'd like to try and spruce up the newsletter a bit and include a more formal news section each month. I am going over some ideas at this time, and if you have any suggestions or things you'd like to see included, please send them my way. Any feedback is appreciated. If you have any questions or comments regarding this month's newsletter, please feel free to send them to me. My information is as follows: Josh Juneau - http://www.gathereventplanning.com juneau001@gmail.com News Interview with Jim Baker - Jython Monthly Extra The community interview with Frank Wierzbicki of Sun Microsystems was a great success. Many Jython developers participated, and Frank took the time to answer each question. Thanks to all who participated! Due to the great success, Jyhon Monthly will be interviewing another Jython developer and expert, Jim Baker. You can visit the interview site now to leave your questions for Jim. Anyone who wishes to participate in the interview should place his or her question on the interview site by September 19th, 2008. After that date, Jim will answer the questions and an extra distribution of Jython monthly will be released with the results. Special thanks to Jim Baker for taking the time to participate, the community appreciates it. We look forward to another great interview! http://wiki.python.org/jython/JythonMonthly/Interviews/August2008/JimBaker Jython and Django on Glassfish - Scripting Project The Glassfish application server now has a scripting project to help integrate the server with scripting languages for the JVM. There is a section on the project website that is devoted to using Jython and Django on Glassfish. It is comprised of a couple of blogs written by Frank Wierzbicki on the topic a few months ago, and it also contains a bit of information regarding a future roadmap for the Jython and Django support. You can find more information on the Glassfish Scripting project website. https://glassfish-scripting.dev.java.net/discover/jython.html More on Django and Jython - Leo Soto's Speaking at DjangoCon Leo Soto, working on Django and Jython for Google Summer of Code, has posted some information http://wiki.python.org/jython/DjangoOnJython on the Jython wiki regarding how to make Django work on Jython without any patches. Leo will be speaking at this year's DjangoCon, which is being held in Mountain View, CA on September 6 and 7. Congratulations Leo! For more on this topic, read Leo's blog which is posted below. Nbpython Project Progressing Quickly The nbpython project is progressing at a swift pace and releasing new milestones each month. This project promises to add great support for Python and Jython to the Netbeans IDE. The milestone releases are being distributed in Netbeans module format (NBM), as source, and stand alone IDE. Please visit the project website to learn more. The Java Posse Made It To 200! The Java Posse, a group of Java enthusiasts, has released their 200th podcast this month. This podcast is a weekly show which primarily consists of news and discussion regarding the Java language as well as other languages that run on the JVM. Jython has been mentioned on the show a number of times, and in the 200th show the posse suggests having some of the Jython developers on for an interview sometime in the future. If you have not heard a show from the Java Posse yet, go to the website and check it out. Articles *New* Jython Basics - Decorators Submitted By: Josh Juneau A new era in Jython development has arrived. We Jython developers will soon be able to begin harnessing many of the powerful features of the current Python language distribution. Using the latest alpha release of Jython (2.5a+), we can take a look at these new features today. Python is a language whose popularity has grown tremendously over the past several years, partially due to the great features that have been added. One of the newer features are known as decorators, which may appear daunting at first due to their odd syntax. As many Jython developers are also Java gurus, the syntax may look strikingly similar to the JavaEE Annotation. However, the Jython decorator is significantly different yet equally as powerful. Read More Jython Reborn - Chris McAvoy The A-Z of Programming Languages: Python Blogs Django on Jython, it's Here - Leo Soto Code Review with Rietveld - Frank Wierzbicki Playing with JSqueak - A. Sundararajan Jython Import Logic - Lee Soto Books New Python Book: Expert Python Programming - Tarek Ziade IDE Netbeans 6.5 Beta 1 - Now Available for Download The Netbeans development team has been hard a work on this great release. Using Netbeans along with the nbpython(https://nbpython.dev.java.net) project aims to become an excellent choice for Jython IDE. Pydev 1.3.19 Available PyDev is a plugin that enables users to use Eclipse for Python and Jython development -- making Eclipse a first class Python IDE -- It comes with many goodies such as code completion, syntax highlighting, syntax analysis, refactor, debug and many others. http://pydev.sourceforge.net/ Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
