["https://wiki.python.org/moin/AppsWithPythonScripting"]
title = "AppsWithPythonScripting - Python Wiki"
full_description = '''Applications can be written almost completely in Python, but people are slow to change, so a considerable number of desktop applications are still written using C/C++ on Linux and Windows and a combination of C++ and Objective-C on Mac OS X. There has been a sustained trend of the use of Python to provide user automation or scripting, sometimes called macros, for C/C++ applications. This makes a lot of sense: Developers don't have to waste time and money inventing their own scripting language. Users don't have to learn a new automation language for every application they use, and can use Python books, exampling, and learning resources. Python is a Free Software (Open Source) solution and can be embedded and distributed without charge, so there are no royalty payments or licensing hassles Python is simple to learn, yet Python and its standard libraries are much more powerful than a proprietary language like VBScript Python is cross-platform tools like Cython and BoostPython make it easy to expose part or all of the application programming interface (API) Python scripting can be added to legacy projects just as well as new ones so developers don't have to abandon their old C/C++ code libraries On the Windows platform, Python has an excellent interface to COM (also known as ActiveX) and can be used to interface to almost any COM program (such as the MS-Office suite). Again, Python scripting can be added to enhance a project without change to the existing COM components. (See Win32All) PyObjC can be used to add scripting to any Cocoa app on Mac OS X Many Mac OS applications provide Apple event-based scripting interfaces, allowing them to be controlled from languages such as AppleScript, JavaScript OSA, Perl (via Mac::Glue), Python (via appscript), Tcl and UserTalk. (See MacPython) For many of the same reasons, Python is often used as the "glue" language for a project. In the Java world, people are using Jython as the glue and scripting language. Contents Applications and Toolkits Games Graphics Tools For Integrating Python Articles Other Resources (many apps from pages below need to be copied to this page) Additional Notes This page is not for listing those applications primarily built with Python. Try Applications for those types of apps, tools, and frameworks. Please keep wiki links as wiki links, use external links only if there is no existing page for the program. Applications and Toolkits Name Platform Notes Abaqus multi-platform Finite element analysis, modeling, and visualization. Python is embedded for command scripting and GUI extensibility. ArcGis BioNumerics Windows A suite of bioinformatics software applications, uses Python to automate series of actions that are executed repeatedly, to create custom reports, import and export non-standard formats, perform custom calculations, etc. ClearSilver multi-platform Web application framework CodeSubWars Windows Free programming game. Uses Python as scripting language for submarine robots. Emacs, using Pymacs multi-platform Text editor. FontLab Windows, Mac OS Commercial font editing software, uses Python as a macro language. GXSM Linux, Mac OS X Gnome X Scanning Microscopy - multi-channel 2D/3D data acquisition and visualization Golly Open source, cross-platform Conway's Game of Life simulator. Helix DNA multi-platform The Helix community is a collaborative effort among real, independent developers, and leading companies to extend the Helix DNA platform, the first open multi-format platform for digital media creation, delivery and playback. Kahakai Window Manager POSIX and X11 Python is used for event and key binding configuration. Kaydara Motionbuilder Mac OS X, Windows Helpful for integrating into production pipelines and allows users to automate repetitive processes. Mahogany Linux, Mac OS X, Windows OpenSource cross-platform mail and news client. MindLathe ? AI middleware GarageCube Modul8 Mac OS X Video mixing and compositing for VJs and live performers; uses Python for internal scripting. MUSHclient Windows & WINE MUD client NSIS2 Windows There is an NSIS Python Plugin for this OpenSource installer for Windows. -- Note: makensis, the installer compiler, now compiles and runs on POSIX systems too. OGRE multi-platform Object-Oriented Rendering Engine OpenOffice multi-platform Python-UNO bridge for scripting OpenOffice with Python Office and Outlook Windows While Microsoft Office apps including Microsoft Outlook were not originally designed to be scripted with Python, PyWin32 (formerly Win32All) makes it possible to script Microsoft Office apps and build plug-ins. Of special note is the SpamBayes plug-in for Outlook which enables any Outlook user to use SpamBayes without even knowing anything about Python. Orange multi-platform Orange is a component-based data mining software. It includes a range of preprocessing, modelling and data exploration techniques. It is based on C++ components, that are accessed either directly (not very common), through Python scripts (easier and better), or through GUI objects called Orange Widgets. Orca GNOME Accessibility toolkit for applications using GTk+/AT-SPI that provides speech synthesis, braille, and magnification. Paint Shop Pro 8 Windows Photo and graphics editor. PSP scripting resources Panda3D multi-platform Open Source game and simulation engine. Disney is one of the notable users. Check out the PyCon paper on Panda3d. ProScena Studio A high-level content-authoring system and runtime for creating real-time interactive 3D simulations for training, education and gaming applications. press release Ciranova's PyCell Studio A tool from an Electronic Design Automation company Quantum GIS multi-platform User friendly open source Geographic Information System (GIS) Resolver One .NET/CLR Programmable spreadsheet built around IronPython. Scorpion Vision Software Windows Machine-vision software for industrial use with Python scripting Scribus SilverRun ModelSphere Windows/Linux/Solaris A relational data modeling tool with Jython scripting. SPSS Statistical and data management package for analysts and researchers. Squish multi-platform An automated GUI testing framework for Qt applications that supports Python scripting Subversion multi-platform A compelling replacement for CVS. See the Project Links, Bindings or do a Google site search. SuperKaramba Linux, KDE SuperKaramba allows you to create cool dekstop widgets with little to no programming experience. It's similar to "Konfabulator" for the Mac. truSpace Windows 3D modelling/animation package Vim multi-platform Text editor. WinCvs Windows GUI front-end for CVS XChat , SilvereX's free Windows version multi-platform IRC Client Games Name Platform Notes Backyard Hockey Windows 1, 2, 3 Battlefield 2 Windows? Scriptable in Python BigWorld Windows Complete MMOG tool set. The FAQ, Client Engine and Server Engine pages highlight how Python is integrated. Blade of Darkness Windows Butterfly.net multi-platform "The scalable, reliable and high performance online game platform." Uses Python for advanced interactions between players and non-player characters Cars with Guns Windows Civilization IV Earth & Beyond Windows Eve-Online Windows Uses StacklessPython for client and server. Description from the web site - EVE: The Second Genesis, is a massively multiplayer, online, persistent world game. perhaps even too real to be called a game, but definitely more fun than reality. Played on the Net, it takes place in a world that is alive and kicking every day, every hour. Players are spaceship captains cruising around the universe, trading, fighting and communicating with other players. Freedom Force Windows http://www.google.com/search?q=Freedom+Force+Python Frequency PS2 SpongeBob Squarepants PS2 and GameCube See Jason's paper on the Python-based scripting system. Star Trek Bridge Commander Windows Temple of Elemental Evil Toontown Online Windows MMORPG. Postmortem: Disney Online's Toontown on Gamasutra. Also see info on Panda3D above. Uru: Ages Beyond Myst Windows Vega Strike Linux, Mac, Windows 3D OpenGL Action Space Sim Wesnoth Linux, Mac, Windows Open-source turn-based-strategy game, uses optional Python AI scripting since version 1.2.0 Graphics Acorn MacOS X Image editor. Blender multi-platform OpenSource software for 3D modeling, animation, rendering, post-production, interactive creation and playback. Blender Python API reference and tutorials. Crystal Space multi-platform OpenSource 3D SDK GIMP multi-platform, GTK GNU Image Manipulation Program. PyGimp is a package that allows people to write plug-ins for Gimp on Python rather than Script-Fu (Scheme), Perl, Tcl or C. SideFX Houdini Professional 3D animation and visual effects software Inkscape multi-platform Scalable Vector Graphics editor irrlicht multi-platform The Irrlicht Engine is an open source high performance realtime 3D engine written and usable in C++ and also available for .NET languages. It is completely cross-platform, using D3D, OpenGL and its own software renderer, and has all of the state-of-the-art features which can be found in commercial 3d engines. Autodesk Maya 3D modeling, animation, effects, and rendering program. Open Inventor multi-platform Object-oriented 3D toolkit. Pivy is the Python binding for Open Inventor. Check out the Pycon paper on Pivy. Poser Windows and Mac OS X 3D character animation tool Vue Infinite Multi-platform Vue is e-on software's award-winning, complete 3D studio to create, render and animate ultra-realistic 3D natural environments. Zeno Internal graphics pipeline used by Industrial Light & Magic. Tools For Integrating Python Pyrex -- now superceded by Cython SWIG (SimplifiedWrapperAndInterfaceGenerator) BoostPython and Boost.Python (official page) PyObjC (Mac OS X) SIP Articles Devs Using Python to Boost Integration - In this two-part interview, Martelli offers Win32, Java and .NET devs some useful perspectives on Python, and how Python scripting can extend the integration capabilities of their Win32, ASP.Net, Java and C/C++ applications. Embedding Python in Multi-Threaded C/C++ Applications in LinuxJournal Building Hybrid Systems with Boost.Python Integrating Python, C and C++, presented at the ACCU conference by Duncan Booth, and his conference slides Other Resources (many apps from pages below need to be copied to this page) PythonEditors Organizations and Apps using Python http://www.thinkware.se/cgi-bin/thinki.cgi/PythonUsers Game Scripting in Python Humongous Games IntegratingPythonWithOtherLanguages Additional Notes After adding Panda3D and Open Inventor I've started to wonder whether those really qualify as apps the way I originally envisioned this list? Perhaps we should have a separate page for C/C++ libraries, frameworks, etc. that have Python bindings? That would include frameworks like GTK, QT, and WxWidgets which have popular Python bindings. Regardless, all the Python bindings available for popular C/C++ tools and frameworks shows the agility of Python. There are great benefits to adding Python bindings to existing C/C++ (and Java) code bases so that you can leverage the power and flexibility of Python without abandoning an existing code base or giving up the speed of C/C++ code. In these cases, Python is a complement rather than a complete replacement for another programming language. -- KevinAltis'''
