full_description = "Users of the Python programming language meet periodically in so-called Python User Groups 1. Intermediate and advanced users share how they use the language and learn new tricks; they also welcome beginners and help them step in. It is a great place to ask for help and socialize with other people with a similar interest. Meetings are usually once every month, they are very informal and open to everyone. There about 1,637 Python user groups worldwide in almost 191 cities, 37 countries and over 860,333 members. Check in these two places to find if there is already a group in your area: The list below which is sorted by geographical region, country, and state in some cases. A world map of Python Meetups in meetup.com. Enter your country and city to list the local group if any. If there is not a Python user group in your area, please check StartingYourUsersGroup if you are interested in organizing one. There are also a number of \"In House Users Group\" within some, (mostly larger), companies - while these are normally closed to anybody who does not work for the company your company may already have one or you may wish to start one. In either case you may find the information at TipsForInHouseUserGroups useful. Contents Africa Namibia Nigeria South Africa Zimbabwe Ghana Ivory Coast Togo Mozambique Maputo Morocco Other Africa Indian Ocean Asia Pakistan Bangladesh Cambodia(សីល >>> សមាធិ >>> បញ្ញា) China Hong Kong India Indonesia Iran Japan Pakistan Korea Nepal Singapore Sri Lanka Taiwan Philippines Thailand/ประเทศไทย Oceania Australia New Zealand Canada Caribbean Europe Albania Austria Belarus Belgium Croatia Czech Republic Denmark Finland France Georgia Germany General Community Resources User Groups Greece Hungary Iceland Ireland Italy Kosovo Latvia Lithuania Luxembourg Malta Moldova Montenegro The Netherlands Republic of Macedonia Norway Poland Portugal Romania Russia Serbia Slovakia Slovenia Spain Sweden Turkey Ukraine United Kingdom Latin America