title = "JythonMonthly/Newsletters/January2011 - JythonWiki"
full_description = "Jython Monthly December 2010/January 2011 -- Issue #47 This is the Jython Monthly newsletter for the months of December 2010 and January of 2011. Jython 2.5.2 RC3 has been released to the Jython community for review. Please download and test now if you haven't done so already! There is a significant amount of material to cover for this issue. I will be unable to record a podcast due to some timing issues, so I apologize for that. I am hoping to get back into the monthly schedule for releasing the newsletter and podcast at some point in the near future. If you have any questions or suggestions for the newsletter, please feel free to send them to jythonpodcast@gmail.com. I appreciate the feedback! Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://feeds.feedburner.com/JythonPodcast News Jython 2.5.2 RC3 Has Been Released The Jython development team has released the third release candidate for the 2.5.2 release. Please go download the release and test today! Report any issues to the Jython bug tracker. Congrats to the development team on another excellent release. Blogs Jython 2.5.3 RC3 Released Use log4j In WSASMIN and Jython Using Jython As A Configuration Language for Java Programs Jython, Building Project with Multiple Jars Python Pygments in Java with Jython How to Create JVM Parameters for Websphere Application Server Using Jython Jython and java.util.Properties Oracle PL/SQL Recipes - Including a Jython Recipe Specifyng Alternate Settings with Django-Jython WAR Plugins Griffon Jython Plugin Google Refine - Using Jython as Your Expression Language Discussions Sneaking Unsigned Values Jython - Using Pygments in Java Project Accessing Static Java Methods in Python Through Jython Getting Started with Pylint for Jython 2.5.1 Jython Debugging How to remove .py from urls for pyservlet using jython jython django and WMQ Jython Problem bytes to str Using Ivy/Maven2 Dependencies Using Jython to Compile a Script and Run It From A Jar Jython script implementing a class isn't initialized correctly from Java Sikuli X - Want to Use Jython 2.5.2 Frameworks Django-Jython Project Pylons on Jython Web2Py Jython-Swingutils v1.0 PyCon Jython Concurrency - Jim Baker Code Jython Script to Start Cluster jython script to uninstall , install Application and sync nodes IDE Field Project PyDev 1.6.5 Netbeans 7.0 Beta jHepWork Intellij Jython Processor with Swing GUI Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
