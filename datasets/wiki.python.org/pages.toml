title = "JythonMonthly/Newsletters/August2010 - JythonWiki"
full_description = "Jython Monthly August/September 2010 -- Issue #45 This is the Jython Monthly newsletter for the months of August and September of 2010. These are exciting times for Jython as the second beta for 2.5.2 has been released. Please download and test now if you haven't done so already! Due to a lack of materials over the past couple of months, the newsletter will combine both August and September together. I plan to distribute a separate special JavaOne update after the conference as well. If you have any questions or suggestions for the newsletter, please feel free to send them to jythonpodcast@gmail.com. I appreciate the feedback! Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://feeds.feedburner.com/JythonPodcast News Jython 2.5.2 b2 Has Been Released The Jython development team has released the second beta for the 2.5.2 release. The list of issues that have been addressed are as follows: [ 1327 ] Classloaders cannot GC, which exhausts permgen (partial bug fix) [ 1604 ] PyBuiltinCallable.Info should be serializable [ 1397 ] Bugs in PyList and PyJavaType.ListIndexDelegate slice setting [ 1503 ] Java constructors should take keyword arguments [ 1648,1495,1516 ] Incomplete implementation of pep328 for relative imports [ 1611 ] Jython bytecode violated JLS, causing NPE on Sun's JVM when using -Xcomp option [ 1643 ] Tools subdirectory still exists in trunk [ 1455 ] Classes loaded dynamically from sys.path do not have their package defined [ 1555 ] Jython does not publish MIME types via JSR 223 (ScriptEngine.getFactory().getMimeTypes() is empty). [ 1632 ] cPickle.Unpickler does not allow assignment of find_global [ 1395 ] PyList.indexOf() and PyTuple.indexOf() do not function properly [ 1373 ] Jython ClassLoader getResource does not work [ 1506 ] Jython applies PEP263 pattern for determining source-code encoding on noncomments [ 1630 ] threading.Thread lacks tojava method [ 1558 ] PyFunction to single method interface wrapping does not andle java.lang.Object methods [ 1622 ] array type prevents radd fallback Please go download the release and test today! Report any issues to the Jython bug tracker. Congrats to the development team on another excellent release. Blog Series - Jython and Swing By: Bob Gibson Bob Gibson's blog series on Jython and Swing continues and it is available at DeveloperWorks Blogs. Excellent work done by Bob Gibson, author of Websphere Application Server Administration Using Jython. Blogs Jython 2.5.2 Beta 2 Is Released - Jim Baker Jython 2.5.2 Beta 2 Is Released - Frank Wierzbicki Multithreading in Jython Jython Python Function Articles Swing Texting Can Be Fun - Bob Gibson Discussions Jython Classes and Variable Scope Getting the Previous Line in Jython Frameworks Django-Jython Project Pylons on Jython Web2Py Documentation Glassfish Server 3.0.1 Scripting Docs Glassfish V3 Admin Console WSO2 Documentation IDE Field Project PyDev 1.6.2 Netbeans 6.9.1 jHepWork Intellij Jython Processor with Swing GUI Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
