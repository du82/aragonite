title = "JythonMonthly/Newsletters/June2009 - JythonWiki"
full_description = "Jython Monthly June 2009 -- Issue #31 The podcast is also available at the podcast site: http://www.jythonpodcast.com I hope that you enjoy this month's issue, and please feel free to send me suggestions, questions, or feedback. Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://jythonpodcast.hostjava.net/podcasts/podcasts.xml News Jython 2.5.0 Final Released A major goal of this release was to bring Jython more in line with current versions of Python in as far as language features go. The Jython dev team hit this one on the nose...no doubt about it, Jython 2.5 does just that. I'd like to congratulate the Jython developers on all of their hard work. I can tell you that I follow Jython development very closely and a tremendous amount have work has gone into this release. Moreover, a tremendous amount of work continues to be done on Jython and the momentum is growing. For a list of features that have been included in Jython 2.5, as well as all of the PEP inclusions and links, please check out the Jython Roadmap Go to http://www.jython.org to download and test! EuroPython 2009 Conference EuroPython, Europe's Premier Python Conference, will take place from 28th June to 4th July 2009 in Birmingham, UK. For more details, please visit the website at www.europython.eu Talks Related to Jython include: Mixing Python and Java - Andreas Schreiber Java is being used for many existing applications in a variety of domains. Sometimes it is useful to integrate them with Python. For instance, one may wish to add embedded Python scripting to Java applications, to communicate with separate Python code written for CPython, or use existing Java libraries from Python code. The talk gives an overview of the various techniques, tools, and libraries for bridging Python and Java. In particular, the following implementations are described and compared: Embedding of Python into Java with Jython. Calling Java code from CPython scripts with JPype. Calling CPython from Java code with JEPP. Using inter process communication between Python and Java (e.g., with CORBA or SPIRO). Examples for all techniques are demonstrated, and use cases for the different approaches are presented with examples from real world applications. IronClad: Hubris and Laziness - William Reade The lack of support for compiled CPython extensions is a serious problem for alternative implementations of Python. Ironclad is, so far as I know, the only major attempt to rectify this situation: it's a module for IronPython on Windows that enables binary compatibility with extensions compiled for CPython 2.5. These include large parts of the NumPy and SciPy packages, in addition to simpler modules like bz2, _hashlib, and _elementtree. I plan to discuss what I have done to get this far, what strategies succeeded and failed, and what I've learned that may be valuable in implementing similar functionality for PyPy and/or Jython. This talk is primarily concerned with the details of hooking up parts of two separate Python implementations -- CPython and IronPython -- such that objects from either one can be freely used by the other without anyone needing to recompile anything. Most of the discussion will be at a relatively high level, but pitched towards those with some interest in the details of different Python implementations. A Better Python for the JVM - Tobias Ivarsson For future versions of Jython we are working on an optimizing compiler that applies many traditional compiler features to the dynamic nature of Python. The aim of the project is to replace the current compiler in a version after Jython 2.5. In this presentation I will talk about the optimizations performed by this compiler, both static optimizations as well as optimistic optimizations with fallback capabilities. I will also share a comparative overview of the performance of Jython with the new compiler compared to the old compiler and CPython. This will be a fairly advanced talk about the prototype for an optimizing compiler for Jython. I will present the general structure of this compiler, the optimizations it performs and the performance improvements it gives. Acceptance Testing with RobotFramework - Pekka Kaiarck Acceptance testing and acceptance test-driven development (ATDD) using a Python based test automation framework. This is an introduction build around demonstrations and requires no earlier experience. Robot Framework (http://robotframework.org) is a generic open source test automation framework for acceptance testing and ATDD. It used the keyword-driven test automation approach and has an easy-to-use tabular syntax for creating test cases. Its testing capabilities can be extended by test libraries implemented with Python or Java (through Jython). Web Frameworks and Jython - Frank Wierzbicki A final release of Jython 2.5 should be out by the time of this presentation. The Jython project has been collaborating with a number of web frameworks to make sure that they work well on the Jython platform. At the time that this abstract was written, Django and Pylons are working well on Jython, and there has been good progress on getting TurboGears to run. In this talk, I will demonstrate how to take advantage of Java-based technologies from these web frameworks, including the use of Java libraries and deployment options. Some knowledge of Python web frameworks is assumed, but no knowledge of Java is required. The Definitive Guide To Jython (with Django) to be Published by Apress Look for The Definitive Guide to Jython (with Django) to be published by Apress later this year. The book will include beginner to advanced materials covering the Jython language in entirety. Authors include Jim Baker, Frank Wierzbicki, Leo Soto, Victor Ng, and Josh Juneau. Check it out on the Apress site: http://www.apress.com/book/view/1430225270 and stay tuned for more information the open source JythonBook project as well! PlyJy Project Started on Kenai A project named PlyJy has been started on Kenai, and the focus of this project is to provide completely usable Jython object factories for use in your Java projects. Not only does it provide examples of how to code object factories, but it also provides complete implementations that can be used just by including the PlyJy JAR in your Java application classpath. There are many great solutions and projects for integrating Java and Jython, including the [http://github.com/groves/clamp/tree/master|Clamp] project which is currently in development...it is great to see Java and Jython integrating so well together. Check out PlyJy for more information on creating loosely-coupled Jython object factories! Blogs Blogs noted in bold are only presented in newsletter, not on podcast. Jython 2.5.0 Final Is Out - Frank Wierzbicki JavaOne Script Bowl - Alex Miller JavaOne 2009 Script Bowl - Matt Stine Ars Technica Poll Run Django Applications on Glassfish V3 Preview - Vivek Pandey Getting Started with Django Applications on Glassfish V3 - Arun Gupta Last Days of JavaOne - Ola Bini String Compatibility Between Python Implementations - Smallshire.org.uk Jython 2.5 - It's a Beautiful Day! - Alan Kennedy Jython 2.5, Why You Should Upgrade - Tobias Ivarrson Jython Extension for Apache Axis2 - Heshan Suriyaarachchi Design for Jython Extension for Apache Axis - Heshan Suriyaarachchi Newsletter Only Into the Labryinth - Using the JavaCompiler API from Jython Jython 2.5 Released - Josh Juneau Jython 2.5.0 Released - Weigi Gao Do Androids Dream of Google Phones? Waf on Jython 2.5 Performance of Synchronization Primitives in Jython - Tobias Ivarrson Frameworks Django-Jython Project Pylons on Jython IDE Open Source Field Project The Field Project is about to release beta 7! This project is an open source IDE for JVM languages geared towards digital art and coding. Field Project PyDev Netbeans 6.7 Final Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
