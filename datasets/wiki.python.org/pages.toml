["http://wiki.python.org/jython/JythonMonthly/Newsletters/December2007"]
title = "JythonMonthly/Newsletters/December2007 - JythonWiki"
full_description = '''Jython Monthly December 2007 -- Issue #13 There are a few good articles included in this month's newsletter. Rob Andrews has written another helpful article on Jython. There was an excellent article published on Javaworld regarding scripting on the Java platform. Lastly, there is a helpful article for those who are interested in using JavaFX with Jython. I hope that everyone enjoys the holiday season and takes some time to relax with their loved ones. Seasons greetings to everyone! Articles Scripting for the Java Platform By: Gregor Roth Read Article Newbie Corner By: Rob Andrews Most of the day-to-day programming I see in the real world does not consist of 50,000-line applications. And even the larger applications consist of functions and smaller blocks of code that work together to produce the more sophisticated behavior of the larger application. I advise novice programmers to master smaller common tasks, such as handling text, files, and directories. The skills learned in so doing will be used over and over, even in more specialized software development later on. The following is a very simple example of a common task. Each line in the file "states.txt" begins with a two-letter state abbreviation of the variety we use here in the U.S. Read Entire Article Using JavaFX in Jython Applications By: Josh Juneau Have you heard about JavaFX script yet? Of course you have, it is one of the hottest topics in the Java world today. Although in it's early stages, JavaFX script proves to be an easily learned and powerful scripting language addition to the Java community. It gives one the ability to easily create Java animations and Swing applications without coding any Java at all. However, sometimes it is still useful to combine Java and JavaFX to create more robust applications. For example, if one wishes to build an RSS reader using JavaFX then it is still handy to use the Java language for performing RSS parsing. This is because JavaFX script seems to be more targeted at creating user interfaces than for core Java programming. Read Entire Article Python Mini Learning Guide Read the Guide Interested in Developing Jython? If you are interested in developing Jython, please take a look at the current bug listing and submit patches for items which you can repair. Tips and Tricks Jython on Mac OSX Tip: Using JDK 6 with Jython Find more great tips at the Python Cookbook! Interesting Facts The first Christmas was celebrated on December 25, AD 336 in Rome. Artificial Christmas trees have outsold real ones since 1991. Christmas has different meanings around the world; Christmas Eve in Japan is a good day to eat fried chicken and strawberry shortcake. Alabama was the first state to recognize Christmas as an official holiday, and the tradition began in 1836. In 1647, the English parliament passed a law made Christmas illegal. The Puritan leader Oliver Cromwell, who considered feasting and revelry on what was supposed to be a holy day to be immoral, banned the Christmas festivities. The ban was lifted only when Cromwell lost power in 1660. Franklin Pierce was the first president to decorate an official White House Christmas tree. Electric Christmas lights were first used in 1854. Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython'''
