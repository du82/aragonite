title = "JythonMonthly/Newsletters/April2008 - JythonWiki"
full_description = "Jython Monthly April 2008 -- Issue #17 Enjoy this month's newsletter...although brief, it contains a lot of good Jython-related information. Please feel free to contribute to the newsletter in the coming month's by submitting articles and/or tutorials. Josh Juneau juneau001@gmail.com Articles Jython Basics - Simple Data Access Model Using Oracle Submitted By: Josh Juneau Almost every application written today requires data access of some kind. The most common forms of data access today are based upon selection, update, delete processes against a database or XML. While data access has been around for many years now and may be quite trivial, it is an essential concept for any programming language. Not only is it important to know the concepts behind data access, but it is also important to adhere to the basics of object orientation while doing so. A well formed application will use objects to pass data around, which makes it more flexible and easy to maintain. Read More - http://wiki.python.org/jython/JythonMonthly/Articles/April2008/1 Blogs Pycon 2008 Start of an _ast module More Pycon 2008 My first Jython web app on GlassFish v3 Discussions Querying Server Host and Port Using Jython and Wsadmin Zope 3 on Jython - Google Summer of Code Jython Movies New Compiler for Jython Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
