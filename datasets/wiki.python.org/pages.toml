title = "JythonMonthly/Newsletters/December2008 - JythonWiki"
full_description = '''Jython Monthly December 2008 -- Issue #25 Happy Holidays to Everyone! We have passed the Christmas season and are about to ring in a new year. It has been an exciting year for Jython and I know that 2009 will be another great one. We have a lot to remember for 2008 as Jython has made some important advances of the past 12 months. To highlight, here are just a few of the great moments for Jython in 2008: - Sun Hires Two Key Python Developers - March 2008 - Jython 2.5 Alpha Released - July 2008 - Jython 2.5 Beta Released - October 2008 - Django Runs on Jython - Summer 2008 - Jim Baker and Leo Soto Presentation of Django on Jython at DjangoCon 2008 - PyDev and Netbeans 6.5 Provide Two Great IDEs for Jython Development Those are just some of the highlights from the past year. I'm sure that in 2009 we will see a 2.5 release, along with some other Jython surprises...perhaps Turbo Gears on Jython and other great possibilities! Onto other fronts, the Jython Podcast homepage is ready. I also have created the first podcast episode, although I would like to call it a beta since the quality has much to be desired. I had my podcasting studio set up and ready to go, but then my good microphone took a turn for the worst and I was left with a cheaper quality microphone for this first recording. You can pick up the podcast at www.jythonpodcast.com if you are interested in hearing episode #1. I hope to purchase a new microphone so that in January we have a top-notch quality broadcast. As always, I'd love to hear your feedback and suggestions. Please email me at jythonpodcast@gmail.com and let me know if you've got any commentary to add. Thanks, and have a happy new year! My information is as follows: Josh Juneau - http://www.jythonpodcast.com jythonpodcast@gmail.com News nbPython is now available as a plugin in Netbeans 6.5 Some of the features which are currently supported are: # Folding Code # Semantic Code Highlighting # Renaming / refactoring # Code Completion # Smart Indent /Outdent # Debugger Scripting Support for Glassfish V3 to include Jython on Django Read More Jim Baker and Tobias Ivarsson Speak at Devoxx Jim Baker and Tobias Ivarsson gave a presentation entitled Jython in Action at this year's Devoxx. Stay tuned for more information when it comes available. Python 3.0 was released on 12/3 Get It Now Articles Java in the Cloud Author: Hari Gottipati No one is talking about the Web 2.0, AJAX, SaaS, or SOA these days. It doesn't mean that no one is using these technologies, it is just that these are not the buzzwords anymore. The latest buzzword is "Cloud Computing". Every one is talking about building apps in cloud or moving the apps to cloud. There are plenty of jobs on job boards looking for the people with the skills: "familiarity with cloud" or "expertise in cloud". Read Article Blogs Python Support in Netbeans - Tor Norbye Setting Up Django with Sqlite - Matthew Harrison Jython + TileCache/FeatureServer - Christopher Schmidt Jython and GeoTools - Christopher Schmidt Jython Servlets Part 1 - Justin Worall Jython Servlets Part 2 - Justin Worall Sudden Interest in Java - Brett Hoerner IDE PyDev Netbeans 6.5 Poll Would you like to see Jython 3.0 sooner than later, or would you prefer to see 2.5 working perfectly.? Click Here to take survey Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython'''
