title = "JythonMonthly/Newsletters/March2010 - JythonWiki"
full_description = "Jython Monthly March 2010 -- Issue #40 The podcast is also available now: http://www.jythonpodcast.com. I hope that you enjoy this month's issue. Please feel free to send me suggestions, questions, or feedback. Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://feeds.feedburner.com/JythonPodcast News Jython 2.5.2 to be Released Soon The next release of Jython is coming, and it should arrive within the coming month. More information will be available about 2.5.2 once it has been released. Django 1.2 - Beta 1 Released The Django web framework has released version 1.2-Beta1. This is the next major release of the web framework that includes some great new features. While it is not yet functional with Jython, it is certainly a good one to keep an eye on. For more information, please visit the Django Weblog. Articles No articles for March 2010. Blogs Blogs noted in bold are only presented in newsletter, not on podcast. The Grinder IDE: GrinderStone, 2.5.0 Release - Borislav Andruschuk Primary goal of this release was fixing compatibility issues between several versions of Eclipse, The Grinder and PyDev. Secondary goal was to add compatibility with recently release Jython 2.5.0 and 2.5.1. Read More The JVM Crowd - Ahmed Soliman The JVM is an industry-proven environment for enterprise applications development and it has been receiving lots of updates especially after moving to be open source. The only problem was the Java programming language in my opinion. Java is an excellent language for its simplicity and consistency (people may argue) but it’s not a “modern” language and lacks most of the features that the current modern crowd is looking for. Read More Embedding Jython Script in Java with ScriptEngine... - The Darker Side of Programming In an idle hour I did some more playing about with the Java ScriptEngine (see the earlier post on !Reinventing the Wheel) and decided to see just how easy it was to introduce another ScriptEngine into the mix. It was a toss-up between JRuby and Jython, but in the balance I went with Jython because it has certain benefits to work I frequently get engaged in relating to middleware, although I am altogether less familiar and comfortable with Jython/Python than JRuby/Ruby. Read More Poll: Python Version - Learning Python There was a poll taking place on the learning python blog which asked which version of Python you are currently using. I can say that most Jython developers are more likely than not using 2.5, however, there are some that I know are locked into older versions for one reason or another. What version are you currently using? Unfortunately, I don't think the poll is open any longer, but you can still check out the results and it looks like the majority of people are using 2.6, although 2.5 is coming in second place, followed by 3.1. View Poll Book Review: The Definitive Guide to Jython - Mark Freeman The authors describe this book as having the intended audience of a Java developer wishing to use a dynamic language other than Groovy orJRuby. This is a very accurate assessment. The first section serves as a quick introduction to the Python language, however should not be completely skipped even by seasoned Python developers. As a Python and Java developer, it was good to see comparisons of similar features from both languages. In many cases, the authors took the time to show code examples from both languages, side by side. Read More Replacing JythonC in Jython 2.5 - Hasan Diwan I heard, on the jython podcast's latest episode, of a replacement for jythonc. After the flip, I've edited Dan Cheahs jythonc replacement, compile.java, to add per file output and use the system-wide, platform-independant temporary directory, as denoted by the java.io.tmpdir property.Read More Working with Images Using Django on Jython - Josh Juneau If you've tried to use Django on Jython along with an ImageField, you know well that Django on Jython does not support this field. This is because the ImageField in Django relies on the Python Imaging Library (PIL). Jython does not support the PIL since it is C based, and there is not currently a version of the PIL that has been ported to Java. Read More Using vSphere Java API in Jython and other JVM Languages - DoubleCloud ODI Variables and the Operator Module - Uli Bethke Maven, Jython, and Glassfish Example - Adrianwalker.org ODI Series - When is a planning refresh not a refresh http://aruna-inampudi.blogspot.com/2010/03/modify-integration-module-promoted.html Jython/Python Cheat Sheet - Chris Maeda Java Technology Predictions - Greg Luck Sikuli Python Source Code with Pictures - Mikael Kindborg TOPCAT & STILTS - US National Virtual Observatory News Using Vmware Vcloud API with Jython Threads Question About Using Jython When Running a Receiving Socket in Python Breaking the Loop in Jython Next Line in Jython Frameworks Django-Jython Project Pylons on Jython Web2Py IDE Field Project PyDev 1.5.4 Netbeans 6.8, 6.9 M1 jHepWork Intellij Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
