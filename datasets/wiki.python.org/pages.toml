full_description = '''Jython Monthly July 2008 -- Issue #20 More busy times for Jython! There have been some great progressions made in the world of Jython over the past few weeks. One of the biggest news items is the first alpha release of Jython 2.5. Congrats to the Jython development team on their great efforts! Netbeans will soon have a great plugin for Python/Jython development. The NbPython project is underway and you can obtain development downloads of the module at this time! Thanks to all of you who participated in the "Ask Frank" interview for this month. We have not yet processed all of the Q & A, but I do plan on distributing an extra edition of Jython Monthly once we've completed the process. Thanks again to Frank Wierzbicki for his time! If you have any questions or comments regarding this month's newsletter, please feel free to send them to me. My information is as follows: Josh Juneau - http://www.gathereventplanning.com juneau001@gmail.com Articles Script Your Scala Application with JRuby, Jython, Groovy, and Javascript News Netbeans to Support Python Blogs How to instantiate Python classes Jython 2.5 Released Jython 2.5 On The Air Europython 2008 Scripting Language Performance Comparison Jython on Glassfish V3 PyPy Status Blog Presentations Database Access with Jython, Hibernate, and SQLAlchemy Jim Baker JavaOne Scripting VI SDK with Jython IDE NbPython Home Page PyDev Current Release 1.3.18 Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython'''
