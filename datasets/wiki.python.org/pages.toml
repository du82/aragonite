title = "JythonMonthly/Newsletters/July2010 - JythonWiki"
full_description = "Jython Monthly July 2010 -- Issue #44 There will be no podcast distribution for this month, sorry for the inconvenience. Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://feeds.feedburner.com/JythonPodcast News New Blog Series - Jython and Swing By: Bob Gibson Check out the new blog series on Jython and Swing available at DeveloperWorks Blogs. Excellent work done by Bob Gibson, author of Websphere Application Server Administration Using Jython. Django-Jython Oracle Backend Now Works With Django 1.2.1 The Django-Jython project has been updating recently. The Oracle backend has been updated to work with Django 1.2.1. For more information, head over to the project site. JayDeBeApi The JayDeBeApi module allows you to connect from Python code to databases using Java JDBC. It provides a Python DB-API v2.0 to that database. It works on ordinary Python (cPython) using the JPype Java integration or on Jython to make use of the Java JDBC driver. Visit Pypi Blogs Using JSON From Jython - Andre Holzner Pycon Ireland 2010 - Alan Kennedy Serializing Compiled Jython Code - Cliff Hill Making ZOGI XML RPC Calls - OpenGroupware Easily Optimizing Python Extending With Java - Juergen.brendel Articles Oracle Jumps Onboard The Eclipse Helios Train Java Tip - Swing Console Component Frameworks Django-Jython Project Pylons on Jython Web2Py Documentation Glassfish Server 3.0.1 Scripting Docs Glassfish V3 Admin Console WSO2 Documentation IDE Field Project PyDev 1.6.1 Netbeans 6.9.1 jHepWork Intellij Jython Processor with Swing GUI Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
