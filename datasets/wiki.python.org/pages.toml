["https://wiki.python.org/jython/JavaLibraries"]
title = "JavaLibraries - JythonWiki"
full_description = '''Using Java Classes in Jython DocumentationAndEducation Contents Using Java Classes in Jython Array Array Posted to the Jython-users mailing list by Alfonso Reyes on October 14, 2007 Here is an example of a 3D array. I am not fully satisfied with this implementation but to anybody starting with Jython and Java arrays will clarify lots of things. To do: - the class should automatically instantiate and return the array - a print method that can print the class or any arrays operating outside the class function isnumbered(obj) { return obj.childNodes.length && obj.firstChild.childNodes.length && obj.firstChild.firstChild.className == 'LineNumber'; } function nformat(num,chrs,add) { var nlen = Math.max(0,chrs-(''+num).length), res = ''; while (nlen>0) { res += ' '; nlen-- } return res+num+add; } function addnumber(did, nstart, nstep) { var c = document.getElementById(did), l = c.firstChild, n = 1; if (!isnumbered(c)) { if (typeof nstart == 'undefined') nstart = 1; if (typeof nstep == 'undefined') nstep = 1; var n = nstart; while (l != null) { if (l.tagName == 'SPAN') { var s = document.createElement('SPAN'); var a = document.createElement('A'); s.className = 'LineNumber'; a.appendChild(document.createTextNode(nformat(n,4,''))); a.href = '#' + did + '_' + n; s.appendChild(a); s.appendChild(document.createTextNode(' ')); n += nstep; if (l.childNodes.length) { l.insertBefore(s, l.firstChild); } else { l.appendChild(s); } } l = l.nextSibling; } } return false; } function remnumber(did) { var c = document.getElementById(did), l = c.firstChild; if (isnumbered(c)) { while (l != null) { if (l.tagName == 'SPAN' && l.firstChild.className == 'LineNumber') l.removeChild(l.firstChild); l = l.nextSibling; } } return false; } function togglenumber(did, nstart, nstep) { var c = document.getElementById(did); if (isnumbered(c)) { remnumber(did); } else { addnumber(did,nstart,nstep); } return false; } document.write('<a href="#" onclick="return togglenumber(\'CA-f2f26d84cef8a534c073d3e6525a3f0104344fd7\', 1, 1);" \ class="codenumbers">Toggle line numbers<\/a>'); 1 """ 3D array with class 2 3 """ 4 from java.lang.reflect import Array 5 import java 6 7 class multi: 8 def __init__(self, i, j, k): 9 self.m = i; self.n = j; self.p = k 10 self.arr = Array.newInstance(java.lang.Double.TYPE, [self.m, self.n, self.p] ) 11 12 def get(self): 13 return self.arr 14 15 def out(self): 16 print "printing multidimensional array inside class" 17 for i in range(0, self.m, 1): 18 for j in range(0, self.n, 1): 19 for k in range(0, self.p,1): 20 print self.arr[i][j][k], 21 print 22 print 23 print 24 25 26 def out(arr,m,n,p): 27 # TO-DO: one method that can print a class-array and a bare array 28 print "printing multidimensional array" 29 for i in range(0, m, 1): 30 for j in range(0, n, 1): 31 for k in range(0, p,1): 32 print arr[i][j][k], 33 print 34 print 35 print 36 37 38 tArr = multi(4,3,5) 39 uArr = tArr.get() 40 41 print uArr 42 tArr.out() 43 uArr[0][0][0] = 7.77 44 uArr[3][2][4] = 7.77 45 out(uArr,4,3,5) # read what the array contains'''
year_published = 2025
