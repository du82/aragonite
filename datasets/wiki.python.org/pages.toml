full_description = '''If you have anything to contribute -- e.g. configurations for editors, new editors, or opinion -- don't hesitate to edit or create pages. There's an EditorConfigurationHowto available. Contents Multiplatform Editors Unix-Only Editors Windows-Only Editors Macintosh-Only Editors Online Editors Glorified Editors Enhanced Python shells Mobile Device Editors Other Resources Never ending debate Please keep wiki links as wiki links, use external links only if there is no existing page for the editor. Please add pages like BoaConstructor also to page IntegratedDevelopmentEnvironments. Multiplatform Editors Name Platform Impl. Language License Notes a8 Linux, FreeBSD Python, GTK GPLv3 Embed Vim. Little brother of PIDA Alphatk Unix/X, Windows, Mac OS X Tcl/Tk Proprietary Extensible in Tcl, Tk; Can interact with python. Atom Unix/X, Windows, Mac OS X Python MIT Python language support for Atom-IDE, powered by the Python language server. Code::Blocks Linux, Windows, Mac OS X C++, wxWidgets GPLv3 class browser does not currently work for .py files, but it's still a nice IDE to use for python projects Bluefish Linux, Windows, Mac OS X C, GTK+ GPLv3 The link points to the features page. Cream Linux, Windows, FreeBSD C GPLv3 Cream is a free and easy-to-use configuration of the powerful and famous Vim text editor for both Microsoft Windows and GNU/Lfinux. Cssed Unix/X, Windows, Mac OS X C, GTK+ GPLv2 CSS editor with syntax highlighting for Python, and embedded Python interpreter. Extensible through a Python API. codeEditor Unix/X, Windows, Mac OS X Python, wxPython BSD Extensible in Python; part of PythonCard. Includes PyCrust shell. CodeLobster Unix/X, Windows, Mac OS X Python Proprietary Free version includes Python support. eric Linux, Windows, Mac OS X Python, PyQt GPLv3 Complete IDE, very well integrated with PyQT development, but usable for any kind of project. Supports projects, debugging, auto-complete, syntax coloring, etc. It is extensible via plug-in system. Integrated version control interface for Git, Subversion and Mercurial through core plugins. eric6 requires Python 3 (and, if desired, PyQt5), and supports CxFreeze and PyInstaller, Django and Pyramid, PyLint and Vulture CRiSP Unix/X, Windows, Mac OS X Proprietary BRIEF-compatible, supports Python syntax, in-buffer Python interpreter, supports lots of languages. Powerful macro language. DRAKON Editor Windows, Mac OS X, Linux Tcl/Tk Public domain DRAKON diagram editor with code generation in Python. DreamPie Windows, Linux and Mac/MacPorts Python, PyGTK GPLv3 Interactive shell with history box and code box, auto-completion of attributes and file names, auto-display of function arguments and documentation. Keeps your recent results, provides session history saving (optionally in HTML), interactive plotting with matplotlib. Extremely fast and responsive. DrPython Unix/X, Windows, Mac OS X Python, wxPython GPL Simple, Highly Customizable Editor/Environment. A Tribute to DrScheme. Eclipse Unix/X, Windows, Mac OS X Java EPL Eclipse is ... an open extensible IDE for anything and nothing in particular." Support for Python can be obtained via the PyDEV plugin. EditPad Pro Linux, Windows Proprietary Built-in Python syntax highlighting, Python class browsing, Python-compatible regular expressions, code folding, and extensive options for running external tools such as Python scripts. Editra Linux, Windows, Mac OS X Python, wxPython wxWindows A general purpose developer's text editor written in Python/wxPython. It supports python syntax highlighting, auto-ident, auto-completion, classbrowser, and can run scripts from inside the editor. Extensible with plugins written in python. EmacsEditor Unix/X, Windows, Mac OS C, Lisp GPLv3 Python support with EmacsPythonMode. Extensible in Python using pymacs Epsilon Linux, Windows, FreeBSD and OS/2 Proprietary Customizable Python mode, syntax coloring, function tagging. ExCo Linux, Windows, Mac OS Python, PyQt4 GPLv3 Extensible editor written in Python, Python/C/Nim code tree browser, 3-window editing, text diff, multi-language support, Python REPL, manipulate editor text with Python code FTE Text Editor Unix/X, Windows, DOS, OS/2 C++ GPL Supports lots of languages, including Python; doesn't seem programmable Geany Unix/X, Windows C, GTK+ GPLv2 A small and lightweight GTK+ IDE that supports lots of languages, including Python. gedit Unix/X, Windows, Mac OS C, Python GPLv2 gedit is the official text editor of the GNOME desktop environment, with Python syntax highlighting. J Linux, Windows, Mac OS X Java GPLv2 syntax coloring for python, extensible with jython, supports many file formats, has folding, fully customisable, has sidebar for class and functions, fast for a Java application Jasspa's MicroEmacs Unix, Windows C GPLv2 Supports Python syntax and a Python-specific menu. JED Unix, VMS, MSDOS, OS/2, BeOS, QNX, and Windows. C GPLv2 Syntax highlighting and indenting, (optional) emacs keybindings, programmable with s-lang. Note: comment out "msw_help(..." line in pymode.sl if you are having problems on Windows. JEdit Unix, Windows, Mac OS Java GPLv2 Has three plugins - one for Jython and one for Python/Jython JpyDbg - interactive editing debugging, code browsing, highlighting. JpyDbg Linux, Windows, Mac OS Java, Python GPL Netbeans jEdit cross IDE plugin Jupp Unix/OSX/Cygwin/Interix (curses), MS-DOS (DR DOS, FreeDOS, Win, OS/2 DOS-Box) C GPL Versatile WordStar-like editor (JOE fork) with many colourised syntax-highlighting modes kdevelop Linux, Windows, Mac OS C++ GPLv2 Kde main developping app. Code folding, syntax highlighting, navigator. projects, class browser, version control, customizable keybindings. Comes also with some typical python project models: pyton Qt app, Tkinter app and simple script. Komodo IDE Unix, Windows, Mac OS X Proprietary Komodo is an award winning Python IDE from ActiveState. Fully-integrated Python 3 support featuring code intelligence with autocomplete and calltips, Python debugger (includes remote debugging), interactive shell, remote file support, macros, templating, emacs command support and great help documentation. There is also an open-source version called Komodo Edit (Source), as part of the Open Komodo project started November 2007. Komodo Edit Unix/X, Windows, Mac OS X Proprietary/Open Source scaled-down version of Komodo IDE which also supports Python, but excludes the integrated debugger. gEcrit Unix/X, Windows, Mac OS X Python, wxPython GPLv3 Python IDE with focus is on simplicity and ease of use. It is fast and lightweight. It features Python indentation, line numbers, code folding, syntax highlighting, shell access, code completion, a program runner, a source browser, indentation guides, a white space indicator, autosaving, an edge line, multiple tabs, printing, jumping to a specific line, word searching, word replacement, zooming undo/redo, pastebin.com code submission, Python syntax checking, the ability to change the indentation of many lines at once, autocompletiton, and bad brace checking. LeoEditor Linux, Windows, Mac OS X Python, PyQt MIT Outlining editor, fully scriptable and extensible, supporting literate programming. 100% pure Python code. medit Unix, Windows C, GTK+ LGPL Gtk editor with python bindings, allows plugins written in python. nano Linux, Windows C GNU GPL Small, terminal-based editor, Syntax highlighting ne Unix, Windows, Mac OS X C GPLv3 Easy to use, small, powerful, fast, terminal-based editor. Supports UTF-8, syntax highlighting, undo, autocomplete, macros, regexes, bookmarks. v2.4 released 2012-04 NEdit Unix/X, Windows, Mac OS X C GPLv2 X-Based, Python support builtin. Netbeans Unix/X, Windows, Mac OS X, others Java GPLv2 Netbeans is an open extensible cross platform IDE ; Support for Python can be obtained via the JpyDbg plugin. A new plugin exists for Netbeans 6.5 or newer - info. NINJA-IDE Linux, Windows, Mac OS Python, PyQt4 GPLv3 Lightweight and extensible editor. Class browser, project manager, PEP8 finder, virtualenv, plugin support UliPad Unix/X, Windows, Mac OS X Python, wxPython GPLv2 wxPython based editor. Can be easily extended with mixins and plugins, and has many features. Seems to be biased towards Python web development as contains FTP GUI, RSS aggregator and HTML preview. PyCharm Linux, Windows, Mac OS X Java Apache 2.0 Full-featured IDE for Python. Has Free and Open Source edition fully supporting Python as well as proprietary Professional Edition with Django, Flask, Pyramid and Google App Engine support. PyDev Linux, Windows, Mac OS X Java, Eclipse EPL Eclipse plugin. Code-completion. Debugger. Under active development. Pye Linux, Windows Python, Tk GPLv3 Ultra-lightweight Python/text editor made in Python with Tk. Emphasis on easy customization and no-bloat attitude. pyedit PyBoard, Unix, Windows, Mac OS X Python MIT Written in Python - simple small editor, suitable for MicroPython/circuitPython/Pycopy. PyPE Unix, Windows, Mac OS X Python, wxPython GPLv2 Written in Python - code folding, snippets, unicode, multiple documents, code completion, several languages, macros. Python for VS Code Linux, Windows, Mac OS X NodeJs MIT Free open-source extension for Visual Studio Code. Supports syntax highlighting, debugging, code completion, code navigation, refactoring, with support for Django, multi threaded, local and remote debugging. PythonToolkit (PTK) Windows/Linux/Mac (wxPython) Python GPLv3 An interactive environment for python features include: Multiple independent python interpreters. Interactively program with different GUI toolkits (wxPython, TkInter, pyGTK, pyQT4 and PySide). Matlab style namespace/workspace browser. Object auto-completions, calltips and multi-line command editing in the console. Object inspection and python path management. Simple code editor and integrated debugger. Pyzo Unix/X, Windows, Mac OS X Python, PySide BSD License Open-source Python IDE focused on interactivity and introspection, which makes it very suitable for scientific computing. Its practical design is aimed at simplicity and efficiency. Pyzo consists of two main components, the editor and the shell, and uses a set of pluggable tools to help the programmer in various ways: e.g. source structure, interactive help, workspace, file browser (with functionality for searching). Also includes a post-mortem debugger. SciTE Windows, Linux (GTK+) C++ MIT-Like A highly configurable light-weight source code editor (about 50 file formats) based on widely-used Scintilla rich text widget/control. Features: sytax highlighting, code folding, auto-indent, brace matching, codepage/unicode support, multiple documents, context help, code execution, output pane, external tools support, RegExp find/replace, text export (HTML, RTF, PDF, LaTeX, XML). Python API for calltips and autocompletion available. SPE Windows, Linux, Mac OS X Python, wxPython GPLv3 Stani's Python Editor. Auto indentation, auto completion, call tips, syntax coloring/highlighting, UML viewer, class explorer, source index, auto todo list, sticky notes, integrated PyCrust shell, Python file browser, recent file browser, drag&drop, context help. Blender support with a Blender 3D object browser, runs interactively inside Blender. Ships with WxGlade (GUI designer), PyChecker (source code doctor) and Kiki (regular expression console). Extensible with WxGlade. Spyder Windows, Linux, macOS Python, PyQt5 MIT Spyder is a powerful scientific environment written in Python, for Python,and designed by and for scientists, engineers and data analysts. It features a unique combination of the advanced editing, analysis, debugging and profiling functionality of a comprehensive development tool with the data exploration, interactive execution, deep inspection and beautiful visualization capabilities of a scientific package. Furthermore, Spyder offers built-in integration with many popular scientific packages, including NumPy, SciPy, Pandas, IPython, QtConsole, Matplotlib, SymPy, and more. Beyond its many built-in features, Spyder's abilities can be extended even further via first- and third-party plugins. It is conveniently integrated in the cross-platform Anaconda distribution. SlickEdit Unix/X, Windows, Mac OS X Proprietary Syntax coloring, popup function arguments, class hierarchy browser, graphical debugger, and other nice Python features. Context tagging with class/module namespaces, code navigation, and smart indenting are also supported. Sublime Text Linux, Windows, Mac OS X C++, Python Proprietary Beautiful interface, Python syntax highlighting, Python plugins. Thonny Linux, Windows, Mac OS X Python MIT For teaching/learning programming. Focused on program runtime visualization. Provides stepping both in statements and expressions, no-hassle variables view, separate mode for explaining references etc. Vim Unix/X, Windows, Mac OS C Charityware Highly configurable text editor built to enable efficient text editing. Syntax coloring, indenting, autocompletion, and source-navigation tools for Python. Can be scripted in Python. See also Cream. Wing IDE Unix/X, Windows, Mac OS X Proprietary Powerful commercial IDE designed specifically for Python. Auto-completion, call tips, syntax highlighting, goto-definition, keyboard modes for emulating Visual Studio, VI/Vim, Emacs, & Brief, graphical debugger, code browser, integrated shell, scriptable in Python, and much more. wxKonTEXT Linux, Windows Python, wxPython GPL Simple text editor written in python. Syntax highlighter, Code fold, Export code in HTML... Unix-Only Editors Name Platform FreeSoftware? ZeroPrice? Notes Beaver Unix + GTK X Supports debugging Python, Tcl, Ruby, Perl, Lua scripts. Code intelligence (Code completion, folding, auto-complete, code snippets, syntax highlighting matching tags, show keyword or variable information when mouse over...). Keyword help and improved script document. Integrated commonly-used scripting libraries (Tk, wxPython, Pygame, Pmw, Numeric...). Supports compiling python scripts to Windows EXE files. Windows-Only Editors Name Platform Impl. Language License Notes Notepad++ Windows C++ GPL Notepad++ is a free source code editor and Notepad replacement that supports several languages. Running in the MS Windows environment, its use is governed by GPL License. Based on the powerful editing component Scintilla, Notepad++ is written in C++ and uses pure Win32 API and STL which ensures a higher execution speed and smaller program size. By optimizing as many routines as possible without losing user friendliness, Notepad++ is trying to reduce the world carbon dioxide emissions. When using less CPU power, the PC can throttle down and reduce power consumption, resulting in a greener environment. PyScripter Windows Pascal/Delphi MIT Free and open-source Python IDE created with the ambition to become competitive in functionality with commercial Windows-based IDEs Macintosh-Only Editors Name Platform Notes AlphaTcl Mac OS Python-mode extensible in Tcl BBEdit Mac OS '''
