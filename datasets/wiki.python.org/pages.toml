["http://wiki.python.org/jython/JythonMonthly/Newsletters/January2010"]
title = "JythonMonthly/Newsletters/January2010 - JythonWiki"
full_description = '''Jython Monthly January 2010 -- Issue #38 The podcast will be recorded and distributed on February 2nd: http://www.jythonpodcast.com I hope that you enjoy this month's issue, and please feel free to send me suggestions, questions, or feedback. Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://feeds.feedburner.com/JythonPodcast News "The Definitive Guide To Jython - Python for the Java Platform" Has Been Published The Definitive Guide to Jython: Python for the Java Platform has been published! To take a look at the book, please visit the Apress Site. This book is also available in open source format at jythonbook.com. All of the final chapter versions have not yet been converted to open source format, but please stay tuned. Thanks to everyone involved, this has been a great effort and the result is an excellent resource for the community. Websphere Application Server Administration Using Jython - 35% Off Readers of the newsletters and listeners of the podcast are eligible for 35% off "Websphere Application Server Administration Using Jython". To redeem this offer, please visit the book site and use coupon code: IBM9527 Django-Jython 1.1.1 Released The Django-Jython project has released version 1.1.1. This release includes some bug fixes along with a couple of new features. New features include JNDI support and WAR file creation adjustments which allow for Django-Jython libraries to be excluded from the WAR and added to the application server libraries. For more details, visit the site! Sikuli Project Released Sikuli is a visual technology to search and automate graphical user interfaces (GUI) using images (screenshots). The first release of Sikuli contains Sikuli Script, a visual scripting API for Jython, and Sikuli IDE, an integrated development environment for writing visual scripts with screenshots easily. Sikuli Script automates anything you see on the screen without internal API's support. You can programmatically control a web page, a desktop application running on Windows/Linux/Mac OS X, or even an iphone application running in an emulator. To read more, see the site at sikuli.org. PyDev 1.5.4 Released PyDev is an Eclipse plugin for working performing Python, Jython, and IronPython development. Version 1.5.4 has been released and includes many enhancements. For a list of new features, please visit the pydev site. Articles Using the Right Programming Language that Suits You Blogs Blogs noted in bold are only presented in newsletter, not on podcast. Music to Program To - Matt Stephens What types of music – genres, bands, composers – are best for programming? The well-known “Mozart effect” suggests that listening to the great man’s music can improve your concentration and help you to make intuitive leaps… making his music perfect for programming to, surely? The study itself has been brought into question, but besides, Mozart doesn’t always hit the right note (so to speak). Programming isn’t just a single activity – different tasks take a different type of thought, so it follows that each needs a different style of music to nudge your brain into the right gear. Read More Jython Pypdf Reportlab Experimentation - Fraka6 I am currently experimenting jython in order to do pdf files manipulations. I encountered several problems and I want to share some of the solutions (time to give back). Read More Websphere Application Server Administration Using Jython - Websphere Community Blog I recently had the opportunity to review the recently published WebSphere Application Server Administration Using Jython from IBM Press and thought I would share my opinions on this book. In the spirit of full disclosure, I was provided a copy of the book to review at no cost to myself. Read More Django-Jython 1.1.1 Released - Leo Soto Sounds like we are doing one release per month! Django-Jython 1.1.1 is now available, almost exactly one month after 1.1.0. Which is something I didn't expect this time, as I've been really busy with my thesis and other stuff. Fortunately, open source software has this extraordinary property of letting a community move a project forward. Read More Magazines Targeting JRuby and Jython - Michael Kimsal Are you interested? I’m looking at bringing the same style product that we’ve been delivering to the Groovy community to the JRuby and Jython communities, respectively. If there’s enough interest, we’ll move forward. Read More and Express Interest Thank You Wizards of the Coast - DigitalJoel I have a group that is about ready to start a new Dungeons and Dragons campaign. The last time we played was somewhere between 2 and 4 years ago. Since then, Wizards of the Coast has release the 4th edition of the system. In addition to that, they have released a character creator, which has made creating and leveling up characters super easy. Read More Automated Test in Andriod by Sikuli - I-Miss-Erin Blog There is a very friendly and pretty cool project called 'Sikuli' and the authors are from Taiwan too. What is Sikuli? I copy these texts from its website. Sikuli is a visual technology to search and automate graphical user interfaces (GUI) using images (screenshots). The first release of Sikuli contains Sikuli Script, a visual scripting API for Jython, and Sikuli IDE, an integrated development environment for writing visual scripts with screenshots easily. Read More Websphere Get Running JVM Heap Size - IBM Websphere Something Jython Scriptengine with Webstart - frickjack An embedded script engine is a great way to empower an application's users with the ability to customize and extend tools, and java's JSR223 ScriptEngine framework makes it easy to implement. Read More Project Sikuli - Lambda the Ultimate Intellij Version 9.0.1 Ultimate Edition Programming with Screenshots - Jeremy D. Frens I'm really not sure what to think about this yet: Sikuli "is a visual technology to search and automate graphical user interfaces (GUI) using images (screenshots)". In the demo on their homepage, they use Sikuli to configure the IP settings on a Mac going through the standard System Preferences app. Read More My Experiences Building a Small App with Python - daniweb Changing Cell Names, Node Names, Host Names - Dustin's Blog It seems like I get asked quite a bit about how to change cell names, node names, and host names for a given WebSphere Application Server environment. It usually starts by someone asking me what configuration files they need to change when they want to update this information, and is followed by their surprise when I tell them none. The reason I say that is because it’s time consuming, hard, and unnecessary for you to figure this out. Instead, you can use three simple wsadmin commands. I’ll give you an example of those here (all written in Jython). Read More Precompiling JSPs for Websphere 6.1 - James Lorenzen For the past week I have been trying to get precompiled JSPs working for WebSphere 6.1, because our target environment does not include the Java Development Kit (JDK) for security reasons. The following is a brief explanation on how to precompile JSPs for WebSphere 6.1 using maven2. And as an added bonus, I'll also explain how to use the maven-was6-plugin to automate deployment of a WAR using Jython. Read More Spring Python 1.1.0 M1 Released - Daniel Baktier SpringSource has has just announced last week of a milestone release of SpringPython 1.1.0.M1. This announcement made aware about this project. There is a project that has nearly reached its 1.1 version that tries to develop Spring-like framework in Python. I would like to look into this project. Read More Frameworks Django-Jython Project Pylons on Jython Web2Py IDE Field Project PyDev 1.5.4 Netbeans 6.8 jHepWork Intellij Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython'''
