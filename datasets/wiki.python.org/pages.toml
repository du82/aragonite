title = "Applications - Python Wiki"
full_description = '''Applications Written in Python Contents Applications Written in Python 3D CAD/CAM Audio/Video Applications Console Applications Enterprise Applications File Formats Image Applications Internet Applications Mobile Applications Office Applications Personal Information Managers Science and Education Applications Software Development System Administration Applications X-Window Manager Unclassified Editorial Notes See also: AppsWithPythonScripting PythonBlogSoftware PythonGames PythonForSystemsAdministration PythonInMusic PythonWikiEngines WebApplications PythonForArtificialIntelligence PythonForOperationsResearch WellKnownPythonPrograms 3D CAD/CAM FreeCAD is an Open Source CAx RAD based on Open Cascade, Qt and Python. It features some key concepts like Macro recording, Workbenches, ability to run as a server and dynamically loadable Application extensions and its designed to be platform independent... http://free-cad.sourceforge.net/ Fandango is planned to be a full featured CAD program. It has a C++ core extensible by scripts. Currently the memory core for entity management is ready, scripting works wonderfully thanks to the ease of embedding and extending of Python. A KDE+XML user interface is now in place, controlling the keyboard and mouse. http://www.soffernet.com/jaime/fandango/ PythonCAD is a CAD package written, surprisingly enough, in Python. The PythonCAD project aims to produce a scriptable, open-source, easy to use CAD package for Linux, the various flavors of BSD Unix, commercial Unix, and other platforms to which someone who is interested ports the program. Work began on PythonCAD in July, 2002, and the first public release was on December 21, 2002. In addition it has been ported to winXP http://www.pythoncad.org/ Blender is the free open source 3D content creation suite, available for all major operating systems under the GNU General Public License. It only uses Python as a scripting language, however. Vintech RCAM is a CAD/CAM system for true shape nesting and NC programming of laser, plasma, oxy-fuel and water-jet cutting machines. Vintech RCAM is platform independent and now it runs under Windows XP, Windows 7 and Linux. The main programing language of the system is Python, which defines the advanced methodology and the dynamic system development. More information http://www.vintech.bg. Audio/Video Applications cplay - Curses-based Linux multimedia jukebox http://www.tf.hut.fi/~flu/cplay/ Freeseer - Conference recording software and screencast tool http://github.com/Freeseer/freeseer Freevo - Linux multimedia jukebox http://www.freevo.org TimPlayer - Py-GTK based music player using Gstreamer http://creationix.com/OpenSource/TimPlayer/ See also AudioVideo and PythonInMusic. Console Applications IPython - An enhanced Interactive Python shell SQLPython - interactive Oracle database client (alternative to Oracle's SQL*Plus) See also PythonShells. Enterprise Applications Odoo - A complete open source ERP & CRM; accounting, stock management, sales, and modular framework with over 750 modules. Originally called tinyErp, then OpenERP; there is also a variant for Medical. Tryton - a fork of Tiny ERP providing a three-tier high-level general purpose application platform Picalo - A data analysis toolkit for DBMS-type of data. Includes embedded Python scripting and wxWidgets GUI. LinOTP 2 - a flexible and modular solution for strong two-factor authentication with one time passwords (OTP). Due to the modular architecture several OTP tokens and different OTP algorithms are supported. RESTx - a RESTful, GPL licensed open-source data publishing and integration platform, which emphasizes simplicity, sane defaults and out-of-the-box usability. No complex configuration, no steep learning curve, instead up and running in 5 minutes. Components for data access or integration logic can be easily written in Python and Java, users create their own RESTful resources by posting parameters for those components or just filling out a small form in their browser. File Formats xtopdf - a Python toolkit for PDF generation from other data formats; many supported input formats, including: text, DBF/XBASE, CSV, TSV/TDV, XML, DOCX, XLS, XLSX, ODBC, SQLAlchemy, MongoDB, Microsoft Access, SQLite, Berkeley DB, standard input. Support for more formats can be added. PDFBuilder app (using xtopdf) can build composite PDFs from any combination of the supported input formats. xtopdf can be used as a library in your Python programs. Includes stand-alone end-user tools for: command-line (Linux, Windows) / desktop GUI (wxPython - Linux, Windows), web GUI (Flask, Bottle, CherryPy, WSGI, Netius). xtopdf is available on Linux, MacOS, Windows (except for platform-specific features like ODBC). Image Applications Gnofract 4D - A flexible fractal generation program Gogh - A PyGTK-based painting program (or image editor) with support for pressure-sensitive tablets/devices. This application appears to no longer exists. imgSeek - Photo collection manager with content-based search. You simply sketch the image you want to find. MayaVi - Scientific visualization program based on VTK VPython - Navigable 3D animations are produced as side effects of computations, making a normally difficult task exceptionally easy. The new 5.0 release candidate offers opacity, local lights, and materials such as wood. Internet Applications BAOW - A lightweight content manage system based on Python language and SQL database, help you to develop complex web applications. http://www.baow.org (Web site seems to be gone) BitTorrent - a scalable centralized PeerToPeer application http://bittorrent.com/ Flumotion - Streaming server written on top of Twisted and GStreamer http://www.fluendo.com/ HarvestMan Jogger Publishing Assistant - scaled down Jabber client that simplifies publishing weblog entries in Jogger - "Jabber Powered Weblog" http://jpa.berlios.de/ Lamson - a Python SMTP server applying "modern web application framework design" to "e-mail application development" http://lamsonproject.org/ MacTelnet - a Mac OS X terminal program which, as of version 3.1, is partially implemented in Python http://www.mactelnet.com/ Mnet - a scalable decentralized PeerToPeer application http://www.mnetproject.org/ Neatx - an open source implementation of a server for the NX display technology protocols http://code.google.com/p/neatx/ Netusage - A simple script to prevent surprise ISP Traffic Bills http://www.freenet.org.nz/python/netusage/ PDFXMLRPC - a library and a corresponding application (consisting of a client and a server) for client-server PDF creation from text over the Internet or an intranet PSST II - Big Frustration for Big Brother - Encrypted Instant Messaging application http://www.freenet.org.nz/python/psst/ qutebrowser - a pyqt based web browser that supports WebKit and QWebEngine RESTx - a RESTful data publishing and integration platform. For more details, see RESTx under 'Enterprise Applications'. SpamBayes - One of the best anti-spam tools available http://www.spambayes.org/ Spamish Inquisition - Retaliates against spammers by causing their machines to slow to a near-standstill (using RFC831 'incomplete response' messages). http://www.freenet.org.nz/python/spamishinquisition/ Switzerland - a tool to test the integrity of data communications over networks, ISPs and firewalls http://www.eff.org/testyourisp/switzerland TheCircle - a scalable decentralized PeerToPeer application http://thecircle.org.au/ Tribler - a peer-to-peer application written in Python, based on the original BitTorrent client sources http://www.tribler.org/ TwistedMatrix - event-driven networking framework. Supports TCP, UDP, SSL/TLS, multicast, Unix sockets, a large number of protocols (including HTTP, NNTP, SSH, IRC, FTP, and others) http://www.twistedmatrix.com/ Alan Kennedy has compiled a list of HTTP proxies written in Python. PyWebRun Python Web Runner - Running Python scripts over HTTP. See also PythonWikiEngines and WebApplications. Mobile Applications Aarlogic C05/3 - Ready to use GSM /GPS tracking PCB with Python engine on board with support of test server based on Google Maps http://track4free.com AppBackup - an app for jailbroken iOS devices that lets one back up and restore the settings and data of App Store apps Pyroute - a GPS-capable mapping/routing application for mobile devices Office Applications calibre - ebook library management software with syncing to ebook readers, ebook format converter, editor and viewer. Calibre can download news from the web and convert them into e-books using pre-built or user-written Python recipes. faces - Extendible project management software http://faces.homeip.net Notalon - Note-taking, simplified. Notalon is a note-taking software for students, lifting the burden of formatting so that you can focus on taking notes. http://notalon.org pyspread - Spreadsheet application that expects Python expressions in its grid cells http://manns.github.com/pyspread/ Personal Information Managers BitPim - Cell phone data manipulator. Can sync phonebook, calendar, wallpaper, ring tone, etc. http://www.bitpim.org/ Narval - Personnal Assistants, see http://www.logilab.org/narval/ Task Coach - Your friendly task manager, see http://www.taskcoach.org/ WikidPad - a wiki-like notebook application (not web-based) Science and Education Applications Pyrobot - A complete IDE, set of libraries, simulator, and course materials for exploring robotics in Python. Currently aimed for higher education, but work has begun for use in k-12 as well. SimPy - a discrete event, object-oriented, simulation package, http://simpy.sourceforge.net/ PyChem - a multivariate data analysis application for Windows and Unix, including principal components analysis (PCA), partial least squares regression (PLSR) and discriminant analysis (PLS-DA), discrimiant function/canonical correlation analysis (DFA/CVA/CCA), cluster analysis (K-means, HCA), advanced evolutionary methods for variable selection. http://pychem.sourceforge.net/ ACQ4 - Neurophysiology data acquisition and analysis with emphasis on electrophysiology, photostimulation, and fluorescence imaging experiments. MetaPath - A workflow-based metabolomics data analysis package. Includes support for principal components analysis (PCA), partial least squares regression (PLSR) and discriminant analysis (PLS-DA), metabolic pathway mining and data visualisations. Software Development See also DevelopmentTools. Development suites (combinations of tools): Allura Trac Bug/issue trackers: Roundup Build tools: Buildbot - automated building and testing SCons - software construction tool (comparable to make) Waf - software construction tool (comparable to autotools, CMake, SCons, ant) See also ConfigurationAndBuildTools. Version control: Bazaar (formerly Bazaar-NG) and Baz (formerly Bazaar) Mercurial ViewVC (formerly ViewCVS) - a repository browser for CVS and Subversion See VersionControl for details of version control systems and tools. Comparison tools: Meld : Diff and merge tool Visual ORM Builders: Orbiter - a node-based database and Python API builder. System Administration Applications Enomalism - The Enomalism Virtualized Management Console (VMC) is a open source web-based systems administrator management tool for XEN hypervisor. Servers with hundreds of multiple isolated virtualized systems can be managed like a standalone server. Enomalism also includes a virtual server creation wizard and templates to facilitate virtualized server configuration, application deployment and centralized software patch management. http://www.enomalism.com radiusContext - RADIUS log analysis program (user accounting for ISPs) http://www.tummy.com/Community/software/radiuscontext Salt Stack - A high-performance remote execution and configuration management engine. X-Window Manager PLWM - The Pointless Window Manager: a python toolkit for making a wm. It's hostile towards rodents, and ease of configuration is not an objective, not so actively developed, but might be usefull for keyboard-loving hackers. Somebody might even have a use for the code, though PyWM's ideas seem better. http://plwm.sourceforge.net/ PyWM - a small, simple python-programmable X window manager that's packed with features yet very easy to learn and use. http://pywm.sf.net(More up-to-date), http://www.freenet.org.nz/python/pywm/index.html Unclassified Calix - An xwindows gamma calibration tool using Py-GTK and the xgamma command. http://creationix.com/OpenSource/Calix/ (this link do not contain anymore information) CD-Store - a data cd archiving (indexing) with full search and browse capabilities using a Py-GTK interface http://creationix.com/packages/cdstore.tar.gz (this link do not contain anymore information) ruleCore - A reactive event-driven rule engine for event pattern detection http://www.rulecore.com L.I.S.A - The L.I.S.A project is a Digital Life Assistant for a house. You can ask things to LISA by voice or by text and LISA will execute some actions and/or answers you. LISA can control a home automation system to have an artifical intelligence in the house. http://www.lisa-project.net/ Editorial Notes The above lists should be arranged in ascending alphabetical order - please respect this when adding new entries. If, as the developer of a listed application, you disagree with the classification of the work, please move it into the appropriate category or create a new category, respecting the ascending alphabetical order of the categories. When specifying release dates please use the format YYYY-MM-DD. CategoryApplications'''
