["https://wiki.python.org/jython/NewUsersGuide"]
title = "NewUsersGuide - JythonWiki"
full_description = '''Jython User Guide Table of Contents Intro General Python DocumentationOther Useful Links Invoking the Jython Interpreter Making Jython Scripts Executable The Jython Registry Registry PropertiesFinding the Registry File Interaction with Java Packages Accessing Java from JythonMore DetailsImportingCreating Class InstancesCalling Java Methods and FunctionsOverloaded Java Method SignaturesNaming Conflicts with Python Keywords JavaBean Properties PropertiesTuplesEvent PropertiesMethods, Properties and Event Properties Java ArraysSubclassing Java Classes in Jython A Short ExampleCalling Methods in Your SuperclassExampleExample ContinuedInvoking Your Superclass's ConstructorExample Embedding JythonJava Reload (experimental) simple Support - JReload ExampleJava Classes UnloadingJava 1.1JReload Example Source Files Database connectivity in Jython Using a DataSource (or ConnectionPooledDataSource)Using a JNDI lookupGetting a Cursor SQL ServerOracle Datatype mapping callbacks through DataHandler life cycledeveloper supportbinding prepared statementsbuilding resultscallable statement support dbextsConfiguration fileAPIExample session Intro For a look at the Jython internal API see the generated JavaDoc documentation General Python Documentation Since Jython is an implementation of Python for the JVM, most of the standard Python documentation applies. Look in the following places for general information: The Python Tutorial (start here)The Python Library Reference. Although many of these modules are not yet implemented (those coded in C for CPython must be re-implemented in Java for Jython), those that are implemented follow the library reference as closely as possible.The Python Language Reference (for language lawyers). Other Useful Links Jython and CPython are two different implementations of the same language. There are naturally some differences between the two implementations, sometimes reflecting undefined aspects of the Python language, sometimes reflecting quirks of the independent implementations.The Jython FAQ may already contain the answer to your question.If it doesn't, then check Jython-users mailing list archives.If you are still stuck you can post a question to the Jython-users mailing list Invoking the Jython Interpreter Jython is invoked using the "jython" script, a short script that invokes your local JVM, sets the Java property install.path to an appropriate value, and then runs the Java classfile org.python.util.jython. jython [options] [-jar jar | -c cmd | file | -] [args] options -i: Inspect interactively after running script; force prompts even if stdin is not a terminal. -S: Do not imply import site on initialization -Dprop=[value]: Set the jython property prop to value. -jar jar the program to run is read from the __run__.py file in the specified jar file -c cmd program to run is passed in as the cmd string. This option terminates the options list file run file as the program script file program is read from standard-in (default; interactive mode is used if on a tty). This flag allows you to pipe a file into Jython and have it be treated correctly. For example: filter file | jython - args arguments passed to the program in sys.argv[1:] --help print a usage message and exit --version print Jython version number and exit Making Jython Scripts Executable To make a jython ".py" file executable on a Unix system: Make sure that jython is on your standard PATH.Make the ".py" file executable. Typically, this is done with the command chmod +x foo.pyAdd the following line to the top of the file: #! /usr/bin/env jython Note "#! <...>/jython" will generally not work to make your script executable. This is because "jython" is itself a script, and #! requires that the file to execute is a binary executable on most Unix variants. Using "/usr/bin/env" will get around this problem - and make your scripts more portable in the bargain. The Jython Registry Because there is no good platform-independent equivalent of the Windows Registry or Unix environment variables, Java has its own environment variable namespace. Jython aquires its namespace from the following sources (later sources override defaults found in earlier places): The Java system properties, typically passed in on the command line as options to the java interpreter.The Jython "registry" file, containing prop=value pairs. See below for the algorithm Jython uses to find the registry file.The user's personal registry file, containing similarly formated prop/value pairs. The user's registry file can be found at "user.home"+"/.jython"Jython properties specified on the command line as options to the jython class. See the -D option to the interpreter. Registry Properties The following properties are recognized by Jython. There may be others that aren't documented here; consult the comments in registry file for details. python.path Equivalent to CPython's PYTHONPATH environment variable python.cachedir The directory to use for caches - currently just package information. This directory must be writable by the user. If the directory is an absolute path, it is used as given, otherwise it is interpreted as relative to sys.prefix. python.verbose Sets the verbosity level for varying degrees of informative messages. Valid values in order of increasing verbosity are "error", "warning", "message", "comment", "debug" python.security.respectJavaAccessibility Normally, Jython can only provide access to public members of classes. However if this property is set to false and you are using Java 1.2 then Jython can access non-public fields, methods, and constructors. python.jythonc.compiler The Java compiler to use with the jythonc tool, which now generates Java source code. This should be the absolute path to a Java compiler, or the name of a compiler on your standard PATH. python.jythonc.classpath Extensions to the standard java.class.path property for use with jythonc. This is useful if you use Jikes as your compiler. python.jythonc.compileropts Options to pass to the Java compiler when using jythonc. python.console The name of a console class. An alternative console class that supports GNU readline can be installed with this property. Jython already include such a console class and it can be enabled by setting this property to org.python.util.ReadlineConsole python.console.readlinelib Allow a choice of backing implementation for GNU readline support. Can be either GnuReadline or Editline. This property is only used when python.console is set to org.python.util.ReadlineConsole. Finding the Registry File To find the Jython registry file and set the Python values for sys.prefix, you must first locate a root directory. If a "python.home" exists, it is used as the root directory by default.If "python.home" does not exist, "install.root" is used.If neither of these exist, then Jython searches for the file "jython.jar" on the Java classpath, as defined in the system property java.class.path. (The actual file system isn't searched, only the paths defined on the classpath and one of them must literally include "jython.jar"). Once the root directory is found, sys.prefix and sys.exec_prefix are set to this, and sys.path has rootdir/Lib appended to it. The registry file used is then rootdir/registry. Interaction with Java Packages Most Jython applications will want to use the vast array of Java packages available. The following documentation helps you work with Java packages. Working with JavaBean properties, making all Java classes easier to use from Python.Special care is necessary to build and use Java arrays from Python.This document describes how to subclass Java classes in Python.The jythonc utility compiles Python source code to real Java classes, and is used for building applets, servlets, beans, etc.Unloading of java classes and internalTablesImpl option.Reloading java classes. Accessing Java from Jython One of the goals of Jython is to make it as simple as possible to use existing Java libraries from Python. Example The following example of an interactive session with Jython shows how a user could create an instance of the Java random number class (found in java.util.Random) and then interact with that instance. C:\jython>jython Jython 2.0 on java1.2.1 Type "copyright", "credits" or "license" for more information. >>> from java.util import Random >>> r = Random() >>> r.nextInt() -790940041 >>> for i in range(5): ... print r.nextDouble() ... 0.23347681506123852 0.8526595592189546 0.3647833839988137 0.3384865260567278 0.5514469740469587 >>> More Details Hopefully, this example should make it clear that there are very few differences between using Java packages and using Python packages when working under Jython. There are a few things to keep in mind. Importing Jython 2.0 on java1.2.1 Type "copyright", "credits" or "license" for more information. >>> from java.util import * >>> Random <jclass java.util.Random at 31702169> >>> Hashtable <jclass java.util.Hashtable at 7538094> >>> Creating Class Instances You can create an instance of a Java class exactly the way you would create an instance of a Python class. You must "call" the class with a set of arguments that is appropriate for one of the Java class's constructors. See the section below for more details on what constitutes appropriate arguments. Calling Java Methods and Functions Java classes have both static and instance methods this makes them behave much like a cross between a Python module and class. As a user, you should rarely need to be concerned with this difference. Java methods and functions are called just exactly like their Python counterparts. There is some automatic type coercion that goes on both for the types being passed in and for the value returned by the method. The following table shows how Python objects are coerced to Java objects when passed as arguments in a function call. The Java Types show the expected Java type for the argument, and the Allowed Python Types shows what Python objects can be converted to the given Java type. Notice the special behavior of String's when a java.lang.Object is expected. This behavior might change if it is shown to cause problems. Java Types Allowed Python Types char String (must have length 1) boolean Integer (true = nonzero) byte, short, int, long Integer float, double Float java.lang.String, byte[], char[] String java.lang.Class Class or JavaClass (only if class subclasses from exactly one Java class; mutiple inheritance from more than one Java class is now illegal) Foo[] Array (must contain objects of class or subclass of Foo) java.lang.Object String->java.lang.String, all others unchanged org.python.core.PyObject All unchanged Foo Instance->Foo (if Instance is subclass of Foo); JavaInstance -> Foo (if JavaInstance is instance of Foo or subclass) Returned values from a Java method are also possibly coerced back to an object that is more readily usable in Python. The following table shows those coercions. Java Type Returned Python Type char String (of length 1) boolean Integer (true = 1, false = 0) byte, short, int, long Integer float, double Float java.lang.String String java.lang.Class JavaClass which represents given Java class Foo[] Array (containing objects of class or subclass of Foo) org.python.core.PyObject (or subclass) Unchanged Foo JavaInstance which represents the Java Class Foo Overloaded Java Method Signatures Java methods are allowed to be overloaded for different signatures (types and number of arguments). When different versions of the method differ in the number of arguments that they expect, the appropriate method can be easily determined from the number of arguments passed to the method. When the difference is instead in the types of the arguments, more work is required. The possible signatures are sorted in a consistent order that should ensure the appropriate method is chosen first. TBD: document this order! If you need to call a Java method with a particular signature and this is not happening in the easy way, you can use the following workaround: Assume that foo has two methods, "void foo(int x); void foo(byte x);". To call the second method you could write the following: from java.lang import Byte foo(Byte(10))I'm not convinced that any better solution to this problem is possible. Note Look into IronPython's solution to this for ideas. Naming Conflicts with Python Keywords Because Java has a different set of keywords than Python, there are many Java classes that have method and function names that conflict with Python's keyword set. Where the intent can be unambiguously determined, no identifier mangling is necessary, such as when keywords are used as attributes on objects. Thus you can naturally write: java.lang.System.out.print("hi") or java.lang.Runtime.getRuntime().exec(cmd) In the rare case where the conflict can't be resolved due to Python's grammar, you should modify the reserved word by appended an underscore to the end of it, e.g. print_ JavaBean Properties Properties Jython uses JavaBean properties to make it easier to interact with most Java classes. These properties can be used as normal object attributes, and can also be specified to the class constructor as keyword arguments (this idea is stolen from TkInter where it seems to work extremely well). These properties are generated automatically using the JavaBean Introspector which identifies properties either from common design patterns, or from explicitly specified BeanInfo. As a first example, consider the case where you wish to create a button that is disabled. The first example shows how you would do this in the typical Java fashion: b = awt.Button() b.setEnabled(0) The second example shows how enabled can be set as a property: b = awt.Button() b.enabled = 0 The final example sets this property at instantiation time using a keyword argument: b = awt.Button(enabled=0) Tuples If the value of a property is specified as a tuple, then the property will be created by applying the constructor for the type of the property to the tuple. This is particularly handy for specifying sizes: frame = awt.Frame(size=(500,100)) It can also be handy for specifying color as an RGB triple: frame.background = 255,255,0 will set the background color of the frame to yellow. Event Properties In standard Java, the event handlers for a widget are specified by passing in an instance of a class that implements the appropriate interface. This is the only reasonable approach to take in a language that doesn't have first-class functions. In Jython, for every event listener supported by a class, there will be a property added to the class for each method supplied by the event listener class. These properties can be set to give a function to be called when the appropriate event occurs. The standard Java style for setting an event listener is shown below: class action(awt.event.ActionListener): def actionPerformed(self,event): java.lang.System.exit(0) button = awt.Button("Close Me!") button.addActionListener(ac'''
