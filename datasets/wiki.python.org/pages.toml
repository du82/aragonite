full_description = "Jython Monthly June 2010 -- Issue #43 The podcast is available for June 2010 at the following URL: http://www.jythonpodcast.com. I hope that you enjoy this month's issue. Please feel free to send me suggestions, questions, or feedback. Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://feeds.feedburner.com/JythonPodcast News Jython 2.5.2 Beta 1 Released The Jython developer team has released the first beta for the 2.5.2 release. To see all of the changes that have been made, please visit the release notes. Download and try it out today. Please be sure to report any bugs to http://bugs.jython.org Netbeans 6.9 Released The latest update to the Netbeans IDE has been released. Version 6.9 does not include any Python/Jython specific updates, but it is recommended that you download in order to make use of the latest editor and IDE specific enhancements. Once you install Netbeans 6.9, just download the Python plugin and install it. Read More PyDev 1.5.9 Released For those of you using Eclipse Pydev, there has been a new release that now includes support for Aptana Studio 3 (Beta). Read More Bob Gibson Interview Next Month Bob Gibson, co-author of the book entitled WebSphere Application Server Administration Using Jython, will be interviewed by the Jython Podcast next month. I am looking forward to speaking with Bob, and if you have any questions that you would like for me to ask during the interview, please send them to me at jythonpodcast@gmail.com. Special thanks to Bob for his time! Blogs Jython 2.5.1 is Out - Oti Humbel Using Jython as a CLI frontend to HBase - defuze.org Figuring Out How To Script - Locke's Socks Articles None for June 2010 Frameworks Django-Jython Project Pylons on Jython Web2Py Documentation Glassfish Server 3.0.1 Scripting Docs Glassfish V3 Admin Console IDE Field Project PyDev 1.5.9 Netbeans 6.9 jHepWork Intellij Jython Processor with Swing GUI Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
