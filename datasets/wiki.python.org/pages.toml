title = "OtherExamples - JythonWiki"
full_description = '''Other Examples in Jython DocumentationAndEducation Contents Other Examples in Jython Log4j Apache Poi PyServlet Apache Derby BioJava Log4j This is a simple Log4jExample that show how to use this excellent logger with Jython. Yes, Python provides a logger but log4j can be used for debugging apache stuff. What ever you use loggers use its better then using print statements. You can get log4j from http://logging.apache.org/log4j/1.2/download.html Apache Poi No this isn't really bad Hawaiian food but a really slick way to write out Excel xls and other Microsoft Office format files with out have to have any microsoft software installed. Poi is really slick Java API and pretty easy to use. Take a look at the PoiExample and to download it and get more information on Poi and visit http://poi.apache.org/ PyServlet See Sean McGrath's PyServlet Turorial for an introduction. Below are a couple of examples: Simple: function isnumbered(obj) { return obj.childNodes.length && obj.firstChild.childNodes.length && obj.firstChild.firstChild.className == 'LineNumber'; } function nformat(num,chrs,add) { var nlen = Math.max(0,chrs-(''+num).length), res = ''; while (nlen>0) { res += ' '; nlen-- } return res+num+add; } function addnumber(did, nstart, nstep) { var c = document.getElementById(did), l = c.firstChild, n = 1; if (!isnumbered(c)) { if (typeof nstart == 'undefined') nstart = 1; if (typeof nstep == 'undefined') nstep = 1; var n = nstart; while (l != null) { if (l.tagName == 'SPAN') { var s = document.createElement('SPAN'); var a = document.createElement('A'); s.className = 'LineNumber'; a.appendChild(document.createTextNode(nformat(n,4,''))); a.href = '#' + did + '_' + n; s.appendChild(a); s.appendChild(document.createTextNode(' ')); n += nstep; if (l.childNodes.length) { l.insertBefore(s, l.firstChild); } else { l.appendChild(s); } } l = l.nextSibling; } } return false; } function remnumber(did) { var c = document.getElementById(did), l = c.firstChild; if (isnumbered(c)) { while (l != null) { if (l.tagName == 'SPAN' && l.firstChild.className == 'LineNumber') l.removeChild(l.firstChild); l = l.nextSibling; } } return false; } function togglenumber(did, nstart, nstep) { var c = document.getElementById(did); if (isnumbered(c)) { remnumber(did); } else { addnumber(did,nstart,nstep); } return false; } document.write('<a href="#" onclick="return togglenumber(\'CA-9e353308951f17e9c38687401f08244ba562d0ec\', 1, 1);" \ class="codenumbers">Toggle line numbers<\/a>'); 1 from javax.servlet.http import HttpServlet 2 3 class Simple(HttpServlet): 4 def doGet(self, request, response): 5 response.setContentType("text/plain") 6 response.getWriter().println("Veni, vidi, vici!") Using servlet context: document.write('<a href="#" onclick="return togglenumber(\'CA-cab085516af0cd3500e7e936ba4bdf6ee5f51d31\', 1, 1);" \ class="codenumbers">Toggle line numbers<\/a>'); 1 from javax.servlet.http import HttpServlet 2 3 class Simple(HttpServlet): 4 def doGet(self, request, response): 5 response.setContentType("text/plain") 6 response.getWriter().println(self.getServletContext().getServerInfo() + 7 " Veni, vidi, vici!") Apache Derby ApacheDerby Example(s) Apache Derby is a Java relational database management system that can be embedded in Java programs and used for online transaction processing. for more information on Apache Derby see http://db.apache.org/derby/index.html or http://en.wikipedia.org/wiki/Apache_Derby BioJava Bioinformatic analysis using BioJava can be simplified using Jython. A Genbank file, like the ones used to describe chromosomes in the Human Genome can be open and parsed with a few lines of Jython. import sys from java.io import * from java.util import * from org.biojava.bio import * from org.biojava.bio.seq.db import * from org.biojava.bio.seq.io import * from org.biojava.bio.symbol import * if __name__ == "__main__": br = BufferedReader( FileReader( sys.argv[1] ) ) sequences = SeqIOTools.readGenbank(br) while sequences.hasNext(): seq = sequences.nextSequence() print seq.seqString()'''
