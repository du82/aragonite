full_description = "Jython Monthly March 2008 -- Issue #16 March has been a great month for the Jython programming language! There has been a lot of activity on the blog-lines and much anticipation for the future of the language due to the recent hirings of Python programmer Ted Leung and Jython's own Frank Wierzbicki. We all wish them the best and hope that the language will flourish with this renewed awareness and Sun's devotion. This is a good day for Jython and Python programmers indeed! Josh Juneau juneau001@gmail.com Articles The company today is announcing the hiring of Ted Leung, long-time Python developer at the Open Source Applications Foundation, and Frank Wierzbicki, lead implementer of the Jython project, which enables Python to run on the Java virtual machine, Sun said. Read More: http://www.infoworld.com/article/08/03/03/hirings-python_1.html Blogs Jython's Future Looking Sunny Django On Jython More Django on Jython Welcome Pythonistas to Sun Jython Developers Join Sun Ironpython Has Competition Java and Python Jython Gets a Boost Discussions Jython Devs Hired by Sun Who is Using Jython? Grinder Analyzer ExtraLAN Jython Training IBM WebSphere Application Server V6.1 Scripting and Automation Find out more about this training: http://www.integrotraining.com/CourseProfile.aspx?CourseCode=WA661 Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
