["http://wiki.python.org/jython/JythonMonthly/Newsletters/February2009"]
title = "JythonMonthly/Newsletters/February2009 - JythonWiki"
full_description = "Jython Monthly February 2009 -- Issue #27 PyCon 2009 is in the near future, you can almost see it on the horizon. A summarized list of the Jython-specific presentation is as follows: Panel: Python VMs: Speakers are Brett Cannon, Robort Viehland, Holger Krekel, Jacob Kaplan-Moss, and Jim Baker. This panel will bring together all four major implementations of Python in one room to answer questions from the public for the first time. Jython Progress: In this presentation, Frank Wierzbicki will highlight some of the most interesting advances that have occurred in the 2.5 release of Jython, and also some of the new things being developed for 2.7 and 3.0. A better Python for the JVM: Tobias Ivarsson - his consists of advanced discussions regarding the prototype for an optimizing compiler for Jython. Pylons on Jython: Philp Jenvey - Will present how you can use lightweight, flexible Pylons web framework to create web apps on Jython. Django on Jython: Presenters will be Jim Baker and Leo Soto. The discussion will obviously focus on the most popular Python web framework known as Django. They will show examples of how to use Django on Jython and other discussions. Not long after PyCon 2009, Europython 2009 will run at the end of June. More details to come. The podcast is also available at the podcast site: http://www.jythonpodcast.com I hope that you enjoy this month's issue, and please feel free to send me suggestions, questions, or feedback. Thanks My information is as follows: Josh Juneau - http://www.jythonpodcast.com jythonpodcast@gmail.com News Jython BoF Planning Jim Baker and I are planinng a Jython BoF for the PyCon 2009 event. We are planning it for Thursday, March 26 in the evening. Stay tuned to the mailing list for details! Pydev and Pydev Extensions 1.4.4 have been released http://pydev.sourceforge.net/ Details on Pydev Extensions: http://www.fabioz.com/pydev Details on Pydev: http://pydev.sf.net Details on its development: http://pydev.blogspot.com PyCon 2009 is scheduled for March 27 through April 2nd The PyCon 2009 conference is scheduled for March 27 through April 2nd in Chicago IL. The event consists of two tutorial days on March 25 and 26th, three conference days being March 27 - 29th, and then development sprints occurring from March 30 - April 2nd. Articles Introduction to Python EA in Netbeans IDE James Branam This document provides an introduction to programming with the Python programming language in NetBeans IDE. Python is a very popular general-purpose high-level programming language with a design philosophy that emphasizes programmer productivity and code readability. This tutorial demonstrates how features of the NetBeans IDE can best benefit the Python programmer. Each section of the tutorial demonstrates usages of Python and identifies in the IDE features that can be used with Python programming. This tutorial is not intended to teach the Python programming language, but rather demonstrate how the NetBeans IDE can be used with Python-based applications. Read Article Blogs OpenERP Running on Java Jython Round 1 - Raphael Valyi Developing Django-Jython Using Netbeans - Josh Juneau Getting the Class Object and name of a Java Class and Interface in Jython - Prasanna Seshadri Jython FAQ: Differences Between Jython and Java - Prasanna Seshadri Netbeans IDE support for python and jython and its usage - Prasanna Seshadri Netbeans Python IDE features: Configuring and Running Python Projects and Shortcuts - Prasanna Seshadri JRuby and Jython: the easy way - Gioorgi Building Maintainable Test Cases with QEngine - Marchars Netbeans Python: Just Take A Break - Jean-Yves Mengant Progress With Mercurial On Jython - Frank Wierzbicki Progress With Mercurial On Jython - Part 2 - Frank Wierzbicki Java + JNA + {Jython,JRuby} == The Sweet Spot IDE PyDev Netbeans 6.5 Poll What would you like to hear more about on the podcast? Click Here to take survey Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
