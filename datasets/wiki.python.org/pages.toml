title = "IrcChannel - JythonWiki"
full_description = "IRC Channel Welcome to our Jython's IRC community! Jython is an implementation of the high-level, dynamic, object-oriented language Python written in 100% Pure Java, and seamlessly integrated with the Java platform. It thus allows you to run Python on any Java platform. Join us in #jython at Freenode.net and make Jython better. You could also use the webchat interface. Operators Can we help? FrankWierzbicki (fwierzbicki) - Current primary maintainer of Jython AnselmoPeretto (plankton) - IRC channel maintainer and Wiki contributor AlexGrönholm (agronholm) - Users Put your name (and your nickname) here. Let us know about you. If you want, create a new page with your contributions. Dirkjan Ochtman (djc) - Avid Python user (with some long-running simulations at work, for one thing) and Mercurial developer OtiHumbel (Oti) - Jython enthusiast and committer TobiasIvarsson (thobe) - Jython committer and compiler zealot PhilipJenvey (pjenvey) - Jython & Pylons committer JoshJuneau (juneau001) - Jython committer (focus on maintaining jython.org site), newsletter editor, and podcast host External Links IRC Logs Jython Book freenode IRC Clients"
