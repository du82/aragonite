full_description = "Jython Documentation and Learning This section is devoted to all things related to documentation, learning, examples and links to online resources. These are living documents so if you have anything related this section you would like to contribute please do so. This will be updated regularly so check back often. Learning: LearningJython - New users start here. Thanks to David K. for this document. Dive into Python - This is a good source for learning Python. (and Python 3 version) JythonFaq Manuals: Offical User Guide (based on Jython 2.1) NewUsersGuide - This is in the progress of being updated to version 2.2 Examples: Feel free to add you own examples, when you do please follow the following suggestions. post complete examples. If its a long example (more then about 40 lines) please put in on a separate page and provide a link to that page, and lastly please ensure the demo works and provide notes on any special requirements and the JVM version it was tested on. Examples updated as of June 8, 2008 CoreJythonExamples - Standard Python / Jython Examples Standard JavaLibraries - Using Java standard libraries with Jython SwingExamples - Swing is really easy with Jython DatabaseExamples - Interact with various relational databases XmlRelatedExamples - XML and SOAP examples including XPath, etc OtherExamples - Examples that don't have their own category yet. ComparisonJavaJython - What to use in Jython when converting from Java Using Java Libraries with Jython - RSS Example Links to Other Resources: Jython Newsletter - Josh puts together a lot of good info. JythonBibliography: A list of articles and books. Editors / IDE's and other tools JythonEditors - Editors and IDE's"
