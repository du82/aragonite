["https://wiki.python.org/jython/FrontPage"]
title = "FrontPage - JythonWiki"
full_description = '''Welcome to the Jython Wiki! The purpose of a programming language is to let software developers express their intentions as simply and directly as possible. - JimHugunin Jython is a Java implementation of Python that combines expressive power with clarity. Jython is freely available for both commercial and non-commercial use and is distributed with source code. Jython is complementary to Java and is especially suited for the following tasks: Embedded scripting - Java programmers can add the Jython libraries to their system to allow end users to write simple or complicated scripts that add functionality to the application. Interactive experimentation - Jython provides an interactive interpreter that can be used to interact with Java packages or with running Java applications. This allows programmers to experiment and debug any Java system using Jython. Rapid application development - Python programs are typically 2-10X shorter than the equivalent Java program. This translates directly to increased programmer productivity. The seamless interaction between Python and Java allows developers to freely mix the two languages both during development and in shipping products. Starting points for users JythonReleaseNotes: Release notes for Jython 2.7.0 JythonFaq: Frequently asked questions about Jython DocumentationAndEducation: Users Guide, learning Jython and Examples JythonUsers JythonMonthly: a monthly newsletter of Jython news and tips PackageScanning: How Jython decides what jars to scan and how to influence its decision making NonEnglish: Read about Jython in other languages IrcChannel: IRC channel page (#jython at irc.freenode.net) JythonLogo: Jython Logo WhyJython: Believe the hype Beyond the Basics for Users ConsoleChoices: Settings that enable line editing at the interpreter prompt ReadlineSetup: Line-editing at the prompt with GNU Readline or Editline (possibly out of date info) Starting points for developers HowToGetInvolved: Community and contribution overview JythonDeveloperGuide: Getting started with the source code WhosDoingWhat: A weak stab at project management SummerOfCode: Projects suitable for the Google Summer of Code ModulesOverview: An overview of various modules RoadMap: Where the rubber hits for 2.6 Administrative Editing pages Since spamming and vandalism on this wiki has reached a level that is starting to require daily intervention, new users are no longer allowed to edit pages. If you want to edit a page and have just signed up, or you find that you can no longer edit a page that you could edit before, please write to the jython-users@lists.sourceforge.net mailing list, stating your account name and your intended edits and we'll add you to the EditorsGroup. Sorry for the inconvenience, but we want to keep this wiki a useful tool for the community, while at the same time need to prevent wiki admin burnout effects. HTTPS access to the Wiki We have enabled HTTPS access to the wiki to further enhance security and avoid having to send clear text passwords over the network in order to log in to the wikis. If you have not been using HTTPS links to the wiki login page, please be advised that your password may have been sniffed on the network at e.g. a conference. It is best to change it and stop using HTTP links to the wiki login page. Reporting problems In case of emergency, please contact the python.org maintainers, or if experiencing difficulties, contact the pydotorg-www mailing list to say "help".'''
