["https://wiki.python.org/moin/LanguageComparisons"]
title = "LanguageComparisons - Python Wiki"
full_description = '''Comparing Python to various other languages: Full Treatments: PythonVsHaskell PythonVsNice PythonVsRuby PythonVsPhp External Articles: Multiple Languages: At Hyperpolyglot compare PHP, Perl, Python, Ruby and more side-by-side. Rosetta Code is a programming chrestomathy site. The idea is to present solutions to the same task in as many different languages as possible, to demonstrate how languages are similar and different, and to aid a person with a grounding in one approach to a problem in learning another. Rosetta Code currently has hundreds of tasks, and covers over 150 languages, though we do not have solutions to every task in every language, Python is very well represented. Several in 2006, David Howard's http://web.archive.org/web/20100420080552/http://www.dmh2000.com/cjpr/. This essay provides implementations of moderately simple algorithms, like Red-Black Trees in various languages. The essay compares language features and renders fair verdicts. It has a handy feature to scroll through the various implementations side by side. A good, quick read. Several in 2002: GlyphLefkowitz wrote, and MikeConnell updated some very simple performance benchmarks. This is no longer being updated. Several in 2000: Lutz Prechelt's article An Empirical Comparison of C, C++, Java, Perl, Python, Rexx, and Tcl for a Search/String-Processing Program (pdf) is a little old, but it is REAL RESEARCH, comparing productivity and program performance for 80 different implementations of the same requirements, in seven languages. Several in 1997: Guido's essay Comparing Python to Other Languages is an essay comparison of Python to Java, JavaScript, Perl, Tcl, Smalltalk, C++, Common Lisp, and Scheme. erratically updated: "Bilateral comparisons of scripting languages" Important: this reply to Forrester Research's 2007 Survey on Dynamic Languages The PLEAC - Programming Language Examples Alike Cookbook. This project aims to gather fans of programming, in order to implement the solutions to the programming problems from the Perl Cookbook in other programming languages. "Syntax across languages." A detailed comparison of syntax in different programming languages. Perl Perl in 2000: Eric Raymond's essay Why Python describes how he discovered Python, how it compares to Perl, and why he was impressed. Perl in 1999: The humorous Python vs. Perl according to Yoda. Lisp Lisp: Peter Norvig wrote Python for Lisp Programmers which includes a feature-by-feature comparison. Lisp in 1999: There is a pretty terrible comparison of Python and Lisp (in the sense of being uninformed about Lisp) at http://www.strout.net/python/pythonvslisp.html. The only reason for mentioning it is to say, yes, it's old and inaccurate, and not to take it too seriously (you can seach comp.lang.lisp for more specific refutations if you really want). Tcl Tcl in 1998: Frank Stajano's paper, Implementing the SMS server, or why I switched from Tcl to Python, was presented at the Seventh International Python Conference (in 1998). (Also available in PDF.) Java Comparing Python to Java A subjective analysis of two high-level, object-oriented languages - Comparing Python to Java 2007: here's a frequent dialogue: Pythoneer: "My Python source is a tenth the size of my Java programs"; Javaite: "No way! Maybe you gain 30%, but they're kind of the same language, right?"; and so on. This brief note by Paul Buchheit gives a little more depth to the discussion. His point: Java APIs are often terrible. Java: Stephen Ferg's Python & Java: a Side-by-Side Comparison looks at programmer productivity. Recovery from Addiction by Sean Kelly, Screencast A dont-take-it-too-serious Comparison of Python and Java. ... please add more! See also StrongVsWeakTyping. CategoryAdvocacy'''
year_published = 2025
clearnet = "https://wiki.python.org/moin/LanguageComparisons"
