title = "JythonMonthly/Newsletters/November2010 - JythonWiki"
full_description = "Jython Monthly October/November 2010 -- Issue #46 This is the Jython Monthly newsletter for the months of October and November of 2010. Jython 2.5.2 RC2 has been released to the Jython community for review. Please download and test now if you haven't done so already! Due to a lack of materials over the past couple of months, the newsletter will combine both October and November together. I am hoping to get back into the monthly schedule for releasing the newsletter and podcast. If you have any questions or suggestions for the newsletter, please feel free to send them to jythonpodcast@gmail.com. I appreciate the feedback! Thanks My information is as follows: Josh Juneau Podcast Website: http://www.jythonpodcast.com jythonpodcast@gmail.com Podcast Feed: http://feeds.feedburner.com/JythonPodcast News Jython 2.5.2 RC2 Has Been Released The Jython development team has released the second release candidate for the 2.5.2 release. The list of issues that have been addressed are as follows: Please go download the release and test today! Report any issues to the Jython bug tracker. Congrats to the development team on another excellent release. Items Addressed [ 1665 ] cPickle calls import with illegal parameters [ 1628 ] getpass.getpass echoes input Fix logic to detect that a console is interactive (related to #1133) Jython SwingUtils 1.0b2 is Out Jython-Swingutils is a collection of utility classes and functions that are designed to make creating Swing apps on Jython easier. The library is divided into sections based on the area of Swing it helps with. Developers are encouraged to take peeks into each individual section and check out how they can help in the process of building Swing apps in Python. You should also check out the examples directory (not included in the downloadable packages) for practical demonstrations. For more information, please see the online documentation. Blogs Regular Expression Unicode Blocks in IronPython and Jython - Carl Trachte One last thing that's available in jython and IronPython, but not in CPython regular expressions is Unicode Blocks. Blocks are similar to Unicode Scripts, but do not correspond one to one with them. Blocks, as the name implies, represent continuous sequences of Unicode code points. This page, recommended to me by artisonian on twitter, has a good synopsis. Read More Articles No articles for October/November 2010 Discussions Adding Jython Modules to the Classpath Videos jHepWork Channel - Using Java and Jython for Data Analysis Frameworks Django-Jython Project Pylons on Jython Web2Py Tutorials Fiji Scripting Tutorial IDE Field Project PyDev 1.6.3 Netbeans 7.0 Beta jHepWork Intellij Jython Processor with Swing GUI Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython"
