title = "JythonMonthly/Newsletters/May2008 - JythonWiki"
full_description = '''Jython Monthly May 2008 -- Issue #18 This month's newsletter is what I'd like to call a "cram" issue. Since there were no articles or tutorials to add this month, I've decided to cram all of the Jython-related material on the web into one section. The links below lead to blogs, news, videos, or other material which is new to the web within the past few weeks. There is definitely a lot of buzz about Jython lately...and that is great news! Josh Juneau juneau001@gmail.com New Jython Book Take a look at the new Jython book by author Nishio Hirokazu. This book is written in Japanese, and it aims to introduce Jython to Java programmers. It focuses on Python grammer and the differences between Java and Python. Examples in this book include tests using JyConsole, Doctest, and interactive MIDI controlling. Take a look at the book site: http://www.nishiohirokazu.org/jybook/ Amazon Link: http://www.amazon.co.jp/dp/4839922829/ Other Great Material! http://fwierzbicki.blogspot.com/2008/04/jython-and-django-progress-part-ii.html http://www.ustream.tv/recorded/395467 http://us.pycon.org/2008/conference/schedule/event/9/ http://www.sauria.com/blog/2008/03/20/pycon-2008/ http://www.youtube.com/watch?v=Rj43jj-fL5o&feature=related http://blogs.sun.com/seapegasus/entry/groovy_jruby_jython_scala_who http://www.youtube.com/watch?v=7TQAgQ8aZXo http://myarch.com/jython-ant-wrapper-examples http://robineast.wordpress.com/2008/05/16/documentum-and-jython-part-deux/ http://forums.java.net/jive/thread.jspa?messageID=264425 http://wiki.pylonshq.com/display/pylonscommunity/Planet+Pylons http://wtf.hax.is/2008/04/30/my-most-anticipated-gsoc-2008-projects/ Links Jython Home Python Home Jython WikiPedia Freshmeat.net Python Daily News Planet Jython'''
