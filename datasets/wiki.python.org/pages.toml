SciPy, Matplotlib, Jupyter, Pandas, Seaborn, Cython, scikit-image, scikit-learn, TensorFlow, Flask, Click, Tk. Experience with both small and enterprise companies. Truthful Technology, LLC: on-site workshop-style Python training taught by Trey Hunner. Courses include live coding and hands-on exercises instead of slide-based lectures. Course curriculum comes in the form of a rich and descriptive documentation website in lieu of slides and speaker notes. All courses are tailored to your team's needs. Firebox Training consistently delivers Python training courses as live, instructor-led online, on-site, and classroom style training classes for individuals and groups. Courses Offered: Introduction to Advanced Python Programming Bootcamp 5-day - view detailed outline Introduction to Python Programming Training 3-day - view detailed outline. Advanced Python Programming Training 3-day - view detailed outline. Python Programming Training for Scientist, Engineers and Analyst 5-Day - view detailed outline. Python Programming Training for Scientist, Engineers and Analyst 3-Day - view detailed outline. Astro Code School, operated by Caktus Group, the world's largest Django development firm, is licensed by the State of North Carolina as a proprietary school and offers Django Bootcamps, Python and Django Web Engineering classes, and custom group trainings taught by qualified and experienced software educators. Current offerings are: Python and Django Web Engineering, May 18 - August 10, 2015 Python and Django Web Engineering, September 22 - December 15, 2015 Six Feet Up is a WBE dedicated to the development of Python based web applications and integration solutions for the enterprise. The company runs the local Indianapolis Python Meetup group and regularly gives public and private corporate training on a variety of Python based systems and web development. Immersive Python, Django and Pyramid is a 5-day hands on course that teaches students how to leverage Python & Django to build web applications and connect them to a server. The course begins with an overview of using Python for for the web and then dives into Django. Students will create a simple blog site and then they will build the ElevenNote web application. Students will learn how to connect the ElevenNote web app they create to a Python web server and database. Students will even rebuild the ElevenNote app on the Pyramid microframework to understand the benefits of a leaner Python framework. Next public class: Dec 1-5th, Indianapolis, IN Batky-Howell Training has a 20-year history as an international learning organization publishing and delivering software development training content via classrooms, self-paced videos, and textbooks. Our Python Training Courses are continuously being delivered online and onsite to some of the largest and most recognized organizations in the world. Hands On Technology Transfer, Inc. (HOTT) offers a 5-day Python Programming course that teaches students how to rapidly develop and maintain effective Python programs. The course includes thorough coverage of Python syntax, built in data types and control constructs. Attendees will learn how to use Python to create scripts that manipulate data, automate tasks, perform error handling and store and retrieve data by using relational databases and XML files. Hands On Technology Transfer, Inc. (HOTT) offers competency-based IT training programs in more than 75 cities across the United States, Canada and the United Kingdom, covering over 60 IT subject areas. These programs are designed with one main goal – making sure you and your staff will be competent and productive. ITCourseware provides quality Python Training Courseware for instructor-led Python Training. This four day course leads the student from the basics of writing and running Python scripts to more advanced features such as file operations, regular expressions, working with binary data, and using the extensive functionality of Python modules. Continuum Analytics offers virtual, open, and custom on-site training courses for Python users of all levels and backgrounds. Driving core concept learning and in-depth understanding, Continuum’s courses are led by Python experts and give students the ability to get their hands dirty, learn best practices, and ask questions about specific problems. Practical Python Programming is a 3-day introductory course into Python with a focus on applying Python to problems in scripting, data analysis, and systems programming. Geared toward quants and data analysts, the 4-day Python for Finance course provides a strong foundation for being able to work and prototype quicker. Python for Science is a 4-day course for scientists and engineers, which gives students a strong foundation of best practices and the tools available for technical computing. Upcoming open and virtual classes can be found on the Continuum Training page. Custom on-site courses are available worldwide, all year round by contacting sales@continuum.io . DevelopIntelligence is the leader in delivering highly-customized learning solutions to software teams. We offer more than 150 developer training courses. Including instructor-led Python training, Apache training, and other open source training courses. CyberWeb Consulting features courses delivered by principal consultant WesleyChun, another well-known Python trainer. Wesley is author of Prentice Hall's bestselling, Core Python books, the video lecture course, Python Fundamentals (LiveLessons DVD), and co-author of Python Web Development with Django. In addition to being a software architect and Developer Advocate at Google, he runs CyberWeb, a consultancy specializing in Python training. Wesley has over 25 years of programming, teaching, and writing experience, including more than a decade of Python. While at Yahoo!, Wesley helped create Yahoo!Mail using Python. He has delivered courses to Google, Cisco, VMware, Avaya, Hitachi, UC Santa Barbara, UC Santa Cruz, and Foothill College as well as tutorials and sessions at O'Reilly's OSCON and PyCon. Wesley holds degrees in Computer Science, Mathematics, and Music from the University of California. He is available to travel globally. REGISTRATION OPEN for 2012 Aug 1-3 \"Intro+Intermediate Python\" course in San Francisco. Go to WEBSITE for more info & registration. Accelebrate offers Python courses at client sites all over the US and worldwide. Accelebrate's Python classes prepare beginning and intermediate Python users for developing sophisticated scripts and applications in the Python programming language. Our current offerings include Introduction to Python training and Advanced Python training, as well as Python Programming for Scientists training. Accelebrate also offers PHP courses. Python Training with Mark Lassoff of LearnToProgram.tv. Mark offers training in several programming languages including Python. Known for a promoting a dynamic classroom environment, Mark has been lauded for his ability to break down complex "
