full_description = 'Python Conferences The Python community tends to organize regional events around the world. Established events such as PyCon US and EuroPython have since been joined by other regional conferences, and Python often features prominently in various open source conferences. This page aims to be the most complete list of Python conferences around the world and can be edited by the community. Want to organize an event in your community? Read our guide to running a conference. In particular, if you are considering starting a "PyCon" named conference, please see the PSF PyCon Trademark Guidelines and the PSF Trademark FAQs. If you are planning a Python conference event, please check the dates in the Python Event Calendars to see whether there are any overlaps and submit your event to the calendars. Also see the PythonEvents page for more schedule information. Please keep these lists mostly sorted alphabetically. It is fine to place the most prominent and largest events at the top of the respective listings. Contents Python Conferences Regional Python Conferences Africa Americas Asia Australasia Europe Online Topic Conferences AI & Data Science Django Education & Outreach Web Frameworks Science Python at Open Source Conferences Regional Python Conferences Africa PyCon Africa (Africa) PyCon Ghana (Ghana) PyCon Kenya (Kenya) PyCon MEA (Middle East & Africa) (Dubai, UAE) PyCon Namibia (Namibia) PyCon NG (Nigeria) PyCon Niger (Niger) PyCon Somalia (Somalia) PyCon ZA (South Africa) PyCon Tanzania (Tanzania) PyCon Uganda (Uganda) PyConZim (Zimbabwe) Americas PyCon US (US and Canada) - largest international Python event; also see the wiki page: PyCon US DePy (Chicago, United States) inactive North Bay Python (California, United States) PyBay (California, United States) PyBeach (California, United States) PyCascades (West Coast United States and Canada) PyCon Argentina (Argentina) PyCon Bolivia (Bolivia) inactive PyCon Canada (Canada) inactive PyCon Chile (Chile)