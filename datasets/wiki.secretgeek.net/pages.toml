title = "The Common Touch (wiki.secretGeek.net)"
full_description = '''Outbound Links (42 articles…) ⭐ come-back-all-is-forgiven In The Grand Scheme Of Things (None Of This Really Matters) I’m not well Princes HWY Sinking Deep We Are The Parents (Our Parents Warned Us About) 🖼️ we don’t need no education 🖼️ Scene from Zabriskie Points with books exploding 🖼️ zabriskie_point_cover.jpg Heinrich Heine quoted at curiosity.com Jack Ward 🖼️ piccolo_trumpet.png 🖼️ Edmond Halley 🖼️ ET phone home ⭐ paradox Wiki: I know that I know nothing The True Story of History's Only Known Meteorite Victim 🖼️ et phone home "guess a guid" game I'm happy watching the water boil, I love the way the water dances. 🖼️ i_told_you_i_was_sick.png 🖼️ spike_milligan_grave_stone.jpg 'I told you I was ill...' Spike Milligan's gravestone quip is nation's favourite epitaph ⭐ brownsville-girl---song striped sunlight’s page about Who’s Gerald? “1990s.” Wikipedia: Princes Highway Bob Dylan 🖼️ et phone home 🖼️ howls heart 🖼️ sweaty_george.png Rock N Roll Marketplace Hands on Fire Everybody's Talkin' Wikipedia: Existential Nihilism Rock N Roll Marketplace Hands on Fire Wikipedia: The lady doth protest too much, methinks Wikipedia: Princes Highway who’s Gerald at striped sunlight We Are The Parents (Our Parents Warned Us About) ⭐ paradox The Common Touch custard stub album music dylan astronomy pink floyd apocalyptic head canon The Words are Important, The Words are Important —Nice Bird Okay, here's how we play the game. Custard, the band, put out a new album. And I go through it, one lyric at a time, writing down everything I know. I've been a Custard fan for a long time, and I'm from Custard's hometown of Brisbane, so sometimes the connections I make are well-informed. But it's pretty hit and miss. Really I'm just sharing the thoughts that bounce around my weird little brain as I listen to a new record over and over. Repetition makes for some pretty crazy thoughts. The Common Touch came out in the second half of 2017. It's their second album of their long-awaited comeback. The Common Touch In The Grand Scheme Of Things (None Of This Really Matters) Halley's Comet I'm Not Well Princes HWY Sinking Deep You Always Knew Hands On Fire Armageddon Dr Huxley Creeper 2000 Woman Police Cars Take It From Here In The Grand Scheme Of Things (None Of This Really Matters) [Halley’s Comet] I’m not well Princes HWY Sinking Deep [You always knew] [Hands on fire] [Armageddon] [Dr Huxley Creeper] [2000 Woman] [Police Cars] [Take it from here] In The Grand Scheme Of Things (None Of This Really Matters) Your lips are moving But I can not hear A word that you're saying This is clearly reminiscent of the first line of "Everybody's talkin'", the Fred Neil song made famous by Harry Nilsson's rendition, which features in the disturbing New York movie "Midnight Cowboy" — to wit: "Everybody's talking at me, I don't hear a word they're saying." You may be complaining a little too much I fear Is it too early in the album to mention Shakespeare? Not if you're Custard. The line above is clearly a reference to this from Hamlet, "The lady doth protest too much, methinks" I wonder how much of the Bard's work we'll see throughout this album? And do you think, as Shakespeare lay dying in 1616, he would've thought to himself, "I wonder if, 401 years from now, my paltry works will finally be referenced in the works of Custard?" Oh what are we gonna do? Oh no This is what the philosophers call the "Existential Angst." I really don't want to Wear out my welcome here The previous album, Come Back All Is Forgiven was Custard's first album in 15 years. They were very suspicious of this gift they'd been given, an extra chance, and in We Are The Parents (Our Parents Warned Us About) intimated: we must have made a deal with someone either up above or down we've scored one more night to make amends ...which I've interpreted as being about the record deal that ABC presented them with. Now, they're still suspicious of this gift, and still not sure how things will turn out. They don't want to wear out their welcome. The truth is you're saying that maybe we're straining a little too much I fear ...and they're afraid that the comeback might fizzle out and be soon forgotten. I know the feeling. You know the feeling when you decide to write 10,000 words about an album and you end doing more research than you can fit inside a single human lifetime, so you're forced to build a device in which you can save up time and you fall asleep in there and emerge 1000 years later? That's how it feels. Oh what are we gonna do? Oh no (Mouth Wah-Wah) There is also some mouth wah-wah in 'Hit Song' (The second single from Loverama) By "mouth wah-wah" I mean the effect of using the facial apparatus to impersonate the sonic distortions that arise from using a wah-wah pedal (with an electric guitar) to create a spectral slide by rapidly sweeping a frequency filter up and down. The wah-wah pedal itself impersonates the use of a bell mute on a trumpet, which in turn impersonates the sound of a person moving their lips in and out as they cry uncontrollably. So it's a deep moment. Also reminiscent of Fozzie Bear saying his "Wokka Wokka Wokka" catchphrase. And in the grand scheme of things none of this really matters This is not a simple reference to the Metallica song "Nothing Else Matters," (played here by the affable Marty Schwartz of Marty Schwartz music... ...) Nor is this is a simple Call back to an earlier custard lyric— in case you somehow missed it, custard sang the line: Nothing else matters …in their song “I didn’t know I loved you ‘til I saw you rock n roll” - way way back on track 3 from their 1993 single “Casanova” Half of you weren’t yet born when that came about. Statistically it’s very unlikely that anyone you were in the process of being born at the exact moment when that single was released. But statically it’s definitely possible. In which case you’re very welcome to be here reading this. I thank you. No, this lyric - in this song - here and now — “in the grand scheme of things none of this really matters”, this is a far more punching stab at the meaning of life itself. This is nihilism. More than that, it's not even simple nihilism, it's Existential Nihilism. I can't think of a more fitting song than this, from some other musical philosophers: The space theme is completely on point. Bill Murray's 'It Just Doesn't Matter' speech from Meatballs springs to mind also: Just close your eyes Don't give me no alibis And the line "Don't give me no alibis" fits with the grand tradition of grammatical laxity in song lyrics. But now we're getting to the apocalyptic sci-fi feel of the album. This is what I like best about the common touch: In a world that's out of time All the books explode Shown above is a scene from Zabriskie Point with books exploding. The Zabriskie Point soundtrack featured Pink Floyd, Grateful Dead, and others. Here's the cover: I picked up a copy of this for about 50 big ones last year and was pretty pleased with the outlay. I don't know much about the film beyond that. Did the books explode in a world that was out of time? Perhaps they weren't referencing the Custard song after all? Or is this lyric a reference to the Nazi Book Burnings of World War II? Nasty nasty business. In 1823, Heinrich Heine wrote the words, "Dort wo man Bücher verbrennt, verbrennt man auch am Ende Menschen," or "Where books are burned, in the end, people will also be burned." More than a century later in 1933, young Nazi students in Germany organized a nationwide book burning to eliminate foreign influence Heinrich Heine quoted at curiosity.com Hold my hand Reminiscent of the first lyric of the album Wahooti Fandango: "I will take your hand, we'll travel across the land." But also reminiscent of the kind of songs that launched the Beatles onto the world scene. There's certainly a lot of British 60's music coming across. I'll do for you what I can Possibly a reference to 'I'll do 4 U' by Father MC: ...but possibly not. And then we roar into a "BIG FINISH". One of the biggest finishes to a custard song. Some have called it 'sumptuous'. There's a lot of trumpet and then a lot of harmonica and then a lot of both. The trumpet is a piccolo trumpet played by Desmond Honeybottom. And the harmonica is played by Little Roy Grunt. Little Roy Grunt is a great monicker. I wonder who he really is. (Explained later.) That's Jack Ward on cello. Here's a piccolo trumpet. It's an octave higher than a regular Bb trumpet. What a gorgeous little darling of an instrument. It took a while to work out what Beatle's song this reminded me of. But when I found it I knew for sure. There's a piccolo trumpet used in Penny Lane. Listen for the little solo from 1:13 to 1:30. “Little Roy Grunt” is a pseudonym employed by Ian McCormack, the father of David McCormack (and also the father of Dylan McCormack, the skilled musician.), sometimes known by his other moniker, the Cusdad. Not so coincidentally, the name “Little Roy Grunt” is reminiscent of Bob Dylan’s alias “Blind Boy Grunt”. Ian McCormack co-wrote several of Custard's songs. I had the immense fortune to get to know Ian McCormack and he’s possibly my actual favorite thing about the entire Custard Musical Universe. Of course, I’m a lifelong member of the Paul Medew Army — a small but devout group of hardcore warriors who have pledged to always promote the interests, achievements, and songs of Paul Medew ahead of any other band, and ahead of any other member of custard, and even ahead of the band Custard itself, if ever one is forced to choose (which one seldom is.) But regarding all of the people that are in any way associated with the group, it’s definitely Ian McCormack who is the kind of — let me put it this way. If Custard was a Christmas tree, then Ian McCormack would be the Angel on top of the tree. If Custard was a 1907 Rolls Royce Silver Ghost — then Ian McCormack would be The Spirit of Ecstasy ornamental bonnet sculpture that makes the whole thing just… perfect. A very good man Ian McCormack. Halley's Comet I watched Halley's Comet go by Hey! I remember that! I watched Halley's Comet go by. From a backyard in Indooroopilly It was cold, it was autumn '86 Back in those halcyon days of '86 you could hardly walk down a school corridor without being assaulted by a reproduction of this portrait of Edmond Halley. I’m not sure if they were publishing it in Australian Geographic or simply distributing it to every school - but Edmond Halley’s eyes would follow you every where you went in ‘86. You turn a corner — and there’s another Edmond Halley looking deep into your soul! For my part, Halley’s comet itself was a bit of a dud. I'd heard that my grandad saw it last time, and it was so bright in the sky you didn't need a light on your push bike to get home at night. (That sort of rhymes...). Regardless, time spent outside staring at the night sky during my formative years helped me develop a lasting appreciation for astronomy and gave me a sense of the awesome wonder at the vast endlessness of space. This song and this lyric is part of the recurring astronomical motif from many Custard lyrics. ("And I'm checking out Venus and I'm checking out Mars".... "Lucky Star"... "Pluto parts I and II"... if the sun exploded... etc etc etc) We drunk the rest of your gin Reminiscent of "the taste of scotch rich on my tongue" from "This Year" (aka "I'm gonna make it through this year if it kills me", by "The Mountain Goats" And looking for a word to rhyme with "gin", we have.... "anything"? You could have done anything But don't play "Forever Now" I thought this was a reference to Cold Chisel's "Forever Now" — and indeed when I got my hands on the lyrics and found double-quotes around "Forever Now" I was not disappointed. The song forever now is primarily caught up with the question of: “Is this the way it’s gonna be forever”, now? …a throw down to social stagnancy, a youthful cry of despair at lost relationships, a classic case of the fortune telling mental distortion, from cognitive behavioural therapy. The meteor shower caught us all by surprise Now we've departed into Science Fiction territory again — awesome! What's happened during this part of the song, is that things have taken an unexpected twist. Our intrepid party revelers are outside looking for Halley's Comet, when a meteor shower strikes the earth. Only a tiny handful of people survive. This is similar to The Blindness in "The Day of the Triffids" and an episode of the show Benson that it was based on. After talk about Halley's comet, Kraus dreams that she and Benson are the only ones left on earth. How good was that episode? The triffid is also a music venue in Brisbane, in which Benson has never been spotted. And how'd we get to here and how are we going home? ET — the Extra Terrestrial — was also plagued by this question, "How am I going home?" Well I don't know I don't know Here's some deep philosophy: "I know that I know nothing" is a saying derived from Plato's account of the Greek philosopher Socrates. It is also called the Socratic paradox. The phrase is not one that Socrates himself is ever recorded as saying. Wiki: I know that I know nothing ...and continues with: Walking past the deserted agency You know when you're walking through your home town, when you haven't been there for a long time, or when there's been an apocalyptic meteor shower, and you see a newsagent that is now abandoned? That's the landmark we're evoking here. I stopped the cab and tried to see Notice we're in a cab. So we've returned to our home town but we haven't rented or borrowed a car. We're getting about in cabs. Most likely not the same cab from Rice & Beans. What was that place you lived before? On this nostalgic tour of the old home town we head down empty streets trying to find the place where the girl we used to love used to live when we loved her, but the streets don't yield their secrets. How'd you get all those bruises? What? Now we're bringing in the domestic violence motif, as mentioned in The Streets of Your Town, which also mentions streets. I don't care what your excuse is Domestic abuse survivors sometimes find themselves concocting elaborate stories to cover for the bad things that happen to them. But none of those excuses are enough to allow you to listen unironically to Cold Chisel: Don't play "Forever Now" The meteor shower caught me right between the eyes Very few people in recorded history have ever been directly struck by a meteor. The most famous such person is Ann Hodges: Ann Hodges was hit by a meteorite in her Alabama home in 1954. —The True Story of History's Only Known Meteorite Victim It's unlikely that this song is about Ann Hodges. But unlikely doesn't mean impossible does it, Sherlock Homes. How'd we get to here and how are we going home? Well I don't know You mean you still don't know. Given that you were in a cab just a few lines ago, it's possible you could use that cab to get home? I don't know Now there is'''
