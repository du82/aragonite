the {{largest|grandest} scale|{largest|grandest|broadest} concept}, here's an overview of "Things You Might {Wish To |}Generate..." body{background-color:#EEE;} Things You Might Generate {Texture|Textures|Surface detail{s|}} (e.g. {grass|water|clouds|soil|fields|forests|leaves}, {bricks|tiles|mosaics|parquetry}, {wood-grain|natural fibres}{, weaves.|.}) Building (e.g. {prison|laboratory|installation}, {tavern|inn|barracks|school}...) {layout|floor-plan|blue prints}. {Dungeons, Castles, Caves|Dungeons, Caves, Castles|Castles, Dungeons, Caves|Castles, Caves, Dungeons|Caves, Dungeons, Castles|Caves, Castles, Dungeons}{!|.} {Cities|Villages} ({small|tiny} {and|or} {large.|gigantic!}) {Highways|Road {and rail |}systems|Transport networks}. {Vehicles|Transport devices}: {Space-ships|rockets|rocket-ships}, Flying {vehicles|ships|devices},{Cars|Wheeled vehicles}. {Islands|Continents} and {Seas|Oceans}/ {Civilizations|Empires|Societies} (on world, off world, pan-galactic, or universal) Weather {Planetary|Solar} systems As well as character-related elements: Monsters. Robots/aliens/villains/gelfs etc. Character sheets (for a Role-Playing-Game) Crowds{ and traffic|}. Names (gender/culture/era/etc.)({optionally |}including {generated|fictionalised|synthetic} categories of gender/culture/era etc) {Religions|{Superstitious|Occult} belief systems|magic-systems} Calendars Demographics Languages (including {scripts|fonts|runes|symbology}) Technologically advanced weaponry Pretty much any {element|component} of a game can be {generated|synthesized}{, and any portion of a generated {element|component} can be {seeded|fixed|pre-determined|pre-conceived}.|.} A {wealth|plethora|vast tangle} of algorithms are {utilised|employed} when {generating|synthesizing} {(and rendering) |}content. They are sometimes categorized into: those techniques which {simulate|mimic} {real-world|natural} processes... and those that don't. (And when you {ponder|consider} the differing scales of the things to be generated, you quickly realise that fractal methods will {{need to |sometimes| }be employed|make an inevitable appearance}{!|.}) And at the heart of everything is the concept of Randomness. Incorporating randomness into the act of creation is known as Aleatoricism and is connected to the surrealist concept of automatism. Where To Begin!? The best introduction to procedural content generation comes from the first thing mentioned, and {that|the thing} which is smallest{ in scale|}: texture synthesis. Texture is the primary way that games convey a "feel", {a "mood"|an "atmosphere"} and, perhaps most important of all, {a sense of |}"{authenticity|realism|grit}." By learning how various textures are {created|generated|synthesized}, you cover a {significant amount|large percent} of the algorithms used at all other scales. Ken Perlin discusses Perlin Noise and Improved Noise reference implementation Awesome Video This is Kate Compton giving a lightning fast rundown of PCG techniques. It's one of the few tech videos that you don't need to speed up to 1.5 or 2 times. And the accompanying article: So you want to build a generator… External Links Procedural Content Generation Wiki Wikipedia: Texture Synthesis NaNoGenMo Randomness Donjon's Generators List of Generators Polycount: Texturing If an Algorithm Wrote This, How Would You Even Know? Wikipedia: Aleatoricism On Generative Algorithms SPARTAN Procedural Tile Generator Spaceship generator American City Generator Generative Artistry -- A range of interactive tutorials exploring ideas and techniques used in creating generative art. See Also Random Dungeon Generators Category:Fractal Category:Algorithms AI Panic'''
