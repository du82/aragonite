["https://wiki.secretgeek.net/one-of-everything"]
title = "One of Everything (wiki.secretGeek.net)"
full_description = '''Outbound Links (7 articles…) example 🖼️ tim.png 🖼️ beachday.png https://astrofox.io 🖼️ oh_my_goodness.png Going solo: the grinding power of the single-actor film so-you-want-to-release-your-music One of Everything stub art music games I am a little reluctant to share this concept too widely. Once people have considered the ramifications of the following suggestion, they may be willing to undertake the possibility of finding a comfortable bed and some nice meals for me in a quiet facility with a lot of locks on the doors and windows. The gist of it is that I feel we need a lot more artwork and Creativity in this world: perhaps 1000 times what we have available today. To unlock that capability, to help the world go C1K I think we need to get all people to perform a wider search of their own interests by taking the "One of Everything" challenge. The One of Everything Challenge is not a short challenge, the duration of tipping a bucket of ice water over your head, say, no. The One of Everything Challenge's only deadline is your own termination if medical science cannot be advanced enough to prevent that dreadful eventuality, the dark ending we all face. By that deadline, your own death, the challenge is to produce at least exactly 1 of every major form of artwork. 1 non-fiction book on a topic of your choosing. 1 lengthy work of fiction; a novel. 1 window-sized painting you are proud of. 1 woven piece of clothing you have built 1 feature length musical album including album art. 1 clay statue made with your bare hands. 1 tshirt or garment you have designed 1 boardgame you have designed including rules and final art. 1 computer game you've built that is quite playable. 1 website including styles, logos, content. 1 application for business or pleasure. 1 PhD advancing the world's knowledge, albeit in a modest way. 1 much-shared animated gif 1 store on etsy or shopify or amazon or ebay 1 ability to "change a diaper, plan an invasion, butcher a hog, conn a ship, design a building, write a sonnet, balance accounts, build a wall, set a bone, comfort the dying, take orders, give orders, cooperate, act alone, solve equations, analyze a new problem, pitch manure, program a computer, cook a tasty meal" or write a pithy quote. Previous description (2018) This is a strange concept to write about. Where to begin? It's basically a new years resolution. Or perhaps a bucket list. Probably mid-life crisis related. The idea is: You should resolve to create at least one work of art in each major medium. For example: Write 1 novel. Record 1 album. Here's a potential list of categories you might strive to enter: Fiction novel (minimum 50,000 words) Album (minimum 45 minutes) Movie (feature length, 80+ minutes) Non-fiction book Coffee-table book Sculpture Painting: portrait Painting: landscape Building design (which is subsequently built) An illustrated children's story book Photo exhibition Scientific paper (reviewed and published) A meal (served in a restaurant) Patent Website Desktop Application App (mobile/tablet) Computer game Board game Political manifesto Play (3 act minimum) 15 minute standup comedy routine. Algorithm TED talk The idea is breadth. So you need to learn enough to do it all yourself. The album for example: you need to play every instrument. Tough gig, right? And it can't just be 45 minutes of whistling. It should have drums, bass, lead vocal, backing vocals, rhythm guitar, lead guitar. There must be album artwork. The full enchilada. I've written a few novels that are unpublished. I could, for example, track one of those down, polish it up and release it. The next item is a movie. This is quite difficult. I should probably point out the budgetary constraints that I had in mind: 0 dollars. You shouldn't spend any exorbitant amount of money. You shouldn't pay people to be involved in the project for example, shouldn't rent movie studios and so forth. So the film has to be made using equipment to hand. It could, for example, be a LEGO stop motion film, though this would take a long time to create. Every minute of footage would take several hours to create. So I'd be looking at a massive investment of time. A live action film would be quite hard, as I think I'd be expected to play all the parts: this could be problematic. The simplest movies are ones set in a single place with a very small number of characters. Friends staying at a holiday home for the weekend, for example. The minimum is two characters really. Films like Castaway and The Martian spend 90% of their time on a single character. A single person trapped somewhere: a post apocalyptic landscape. An empty planet. Everything is normal but everyone is gone. Could be a single person plus 1 or more robots. Or one person in multiple roles. Twins/Clones (moon) etc. Can also use "found footage" -- public domain footage. NASA footage. The Prelinger archives. example Can't just be 90 minutes of a fixed camera position. Has to take into account all of the cinematic arts. Should use lighting, camera angles, focal depth, makeup, costume, set design, score and soundtrack, title sequence, credit sequence, at least 1 dolly zoom; everything that is Oscar worthy or typical of films should be covered. After the film comes the album. The artwork should be LP record sized, and the album should also be available as pressed vinyl. There has to be at least one "single", with a beat you can dance to, and preferably an a-capella number as well. There should be a 7 minute+ epic, and a ballad (a song that tells a story). There doesn't need to be a rap song. Really, there doesn't. easy video for song, make with: https://astrofox.io Sources Going solo: the grinding power of the single-actor film so-you-want-to-release-your-music'''
