title = "Come Back, All Is Forgiven (wiki.secretGeek.net)"
full_description = '''What Links Here? (5 articles…) brownsville-girl-song red-right-hand the-common-touch unbounded-recursion blackstar Outbound Links (118 articles…) Woody Allen Martin Mull Orchids in Water We Are The Parents (Our Parents Warned Us About) Warren Rd Record Machine If You Would Like To 1990's Contemporary Art Queensland University Rice & Beans Factual Get in Your Car 🖼️ Australian Broadcasting Corporation logo heart of this band 🖼️ Orchid message Blue Orchids played with three times, in 1982 🖼️ gobetween_blue_orchids.jpg 🖼️ Custard 2015 Stephen Grellet Jess Lair 🖼️ Seagrass matting on a cement floor 🖼️ Pet Sematary 🖼️ faust.png other commentators Lantana Gaslighting 🖼️ Gaslight "Australia: If you don't love it, Leave." 🖼️ Marrickville news article 🖼️ RockingHorse Records, Brisbane 🖼️ The record exchange, Adelaide St Revolution Rock Oral History of Brisbane Music 1942-present 🖼️ John Swingle Candy Japan PenJapan Read more here 🖼️ Whos Gerald 'History of Custard' (pdf) Cathy Atthow this story of Who's Gerald 🖼️ catherine_name_popularity.png Popularity of the name "Catherine" 🖼️ Toowoomba See and Do "The Interpretation of Dreams" 🖼️ 54 Bradley St Spring Hill the writing of DF 🖼️ 52 Bradley street Spring Hill (April 2015) 🖼️ Jeff Koons Puppy Bilbao Jeff Koons 🖼️ inflatable_mouse.jpg Scabby The Rat 🖼️ Scabby The Rat argument from authority 🖼️ Venice 🖼️ DLM_BA.png "The Voice" Ricki-Lee Coulter said "Impact Factor" Erdős-Bacon Number Dave Grohl end of the world allegorically attributed to Winston Churchill 🖼️ Seeking a friend for the end of the world Seeking a Friend for the End of the World 'peak-end' rule Rice and Beans, A Survival Combination 🖼️ Danny Bonaduce 🖼️ Little Richard 🖼️ Little Ricky Factual wrestling someone with no bones Ocean of Time Rice & Beans great filter Woody Allen 'Quote' Martin Mull quote Wikipedia: Robert Forster, Calling from Country Phone Wikipedia: Blue Orchids Go-Betweens played with Blue Orchids Go-Betweens gigography (see 1982) Stephen Grellet 'quote' Jess Lair quote Guardian review of the album Wikipedia: Lantana (film) Wikipedia: Gaslighting ABC Editorial re "Australia: If you don't love it, Leave." SMH New re Marrickville Thompson machine gun Revolution Rock Oral History of Brisbane Music 1942-present Candy Japan Pen Japan Candy Japan reaches 10k mrr 'History of Custard' (pdf) Cathy Atthow Who's Gerald story Wolfram Alpha: Popularity of the name "Catherine" Wikipedia: The Interpretation of Dreams DF's blog re Custard Wikipedia: Jeff Koons Wikipedia: Scabby The Rat Wikipedia: argument from authority Wikipedia: "The Voice" Wikipedia: Ricki-Lee Coulter MusicIsCrap website, Dave McCormack Bio Wikipedia: Impact Factor Wikipedia: Erdős-Bacon Number Dave Grohl quote Wikipedia: 2012 Phenomenon Winston Churchill 'quote' Wikipedia: 'peak-end' rule Rice and Beans, A Survival Combination Wrestling someone with no bones Ocean of Time Wikipedia: Drake Equation & great filter Come Back, All Is Forgiven custard album music apophenia grimoire true crime head canon Analyzing a joke is like dissecting a frog, in the end they both die. —Woody Allen Writing about music is like dancing about architecture. —Martin Mull Against all good advice, I plan to dissect every lyric in Custard's 2015 album, "Come Back, All Is Forgiven". I don't intend to shy away from continual and utterly-incorrect over-analysis. A long time ago, when you were just a little kid, I helped a man named DF Hannah write a series of zines about the band Custard. The philosophy of the zine was that we would approach the band's work from all sorts of angles, but always avoid self-indulgence, avoid trying to make ourselves a part of the story. (We didn't always succeed at that.) Well, for this analysis, I'm going to turn my back on that idea and go Full Gonzo. If a thing is worth thinking about, it's also worth over-thinking. Orchids in Water We Are The Parents (Our Parents Warned Us About) Warren Rd Record Machine If You Would Like To 1990's Contemporary Art Queensland University Rice & Beans Factual Get in Your Car Orchids in Water I woke up on the road again, my hands upon the wheel. I turned towards my passenger and said, "Well this must be how it feels?" This album, unlike any other Custard album LP or single, begins with music and lyrics simultaneously starting at 0:00. I don't know of any other album, by anyone, that does this. Many albums begin with a "gentle startup". Silence, slowly giving rise to music. Often there is a walking introduction from one instrument (think of the ascending riff at the start of Wahooti), or a vocal "1-2-3-4". Such a start serves as a way for the musicians to synchronise their timing. Sometimes there is a wall of sound, with guitar, drum and bass exploding to life. But never is there drums, guitar, bass and vocals, instantly at full pace, medium volume, as if we've just walked into a room, half way through a ballad. It's sudden. And I think the reason for such a beginning is embedded in that first verse. Have you ever woken up, while driving? Suddenly, everything is happening, all at once, and you have a dawning realisation that you've just experienced a micro-sleep. Microsleeps, and the dangers of driving while tired, were brought to the public mind in Australia during a series of televised warnings from Australia's most well known scientician, Dr Karl Kruszelnicki. The montage at the end of this example shows that feeling of suddenly waking (though with more drama than in the lyrics) Dr Karl is a popular radio broadcaster, aligned with the Australian Broadcasting Corporation (ABC). I think he's the scientific patron of this album, as his influence arrives in a few more places during the album. ABC meanwhile are the copyright holders of the album. So here we have our narrator, David McCormack, waking up on the highway, driving. Songs that mention driving are frequent in the Custard cannon (Sarsparilla, Bedford, Nice Bird, Truth about Drugs... need I go on), and also popular in the country genre. Aligning with both notions, this song has a distinctive country feel. This pop-country philosophical story telling is also evocative of the Go-Betweens. OK. I didn't think I'd bring it up so early. But Grant McLennan and Robert Forster have a place in the heart of this band and this album as well. Round and round? where have we heard that lyric... On to the chorus: Orchids in water They go round and round my mind What are these orchids in water? Reminiscent of the viral facebook postings of your soppiest friends, with some kind of feel-good "follow your heart, be true to yourself" tripe written in a cursive font over a soft-focus background image of lotus flowers on water. Thoughts of mortality, reminiscences of scenes from your life, fears, insecurities. That's what I think the narrator's invoking. But I could be less than 100% correct. (Incidentally, the Blue Orchids are an English post-punk band that played with the Go Betweens, three times, in 1982 in Norway, Stockholm and London. Just a coincidence? I certainly think so.) Boy don't they warn you all the time These frequent warnings may be a further reference to the microsleep warning campaign. And the constant warning from the sight of white crosses on the side of the highway (a common leitmotif in australian music). My hands are tired my eyes are weak While tiredness and sore eyes are all signs of driver fatigue, they're also signs of parenthood and the onset of middle age. I know these symptoms well. Recent publicity stills show that DM has picked up a pair of spectacles. it's been hot in here for days the air-conditioner is on the blink and the fans they all took away There's three possible meanings here: A lengthy road trip in a car with faulty air conditioning. We've all been there, it's a little hell on wheels. Or it could be a dig at the recording process, putting this album together. Air conditioners and fans are problematic when recording, and studios can end up very hot places. It could just as well be a story about life in an office. Air conditioners often go on the blink, but office managers won't allow people to use ad-hoc circulating fans, because of the increased fire risk from uncontrolled electric appliances. Chorus. Musical interlude. Nice twangy guitar riffs, one taking over from another. Very simple, very laid back. Clean, effortless. The entire album has a wonderful effortlessness to it. I will not pass this way again I can promise that for sure Now we're getting into some heavy philosophising. You might recognise this sentiment as being from a famous quotation: I shall pass this way but once; any good that I can do or any kindness I can show to any human being; let me do it now. Let me not defer nor neglect it, for I shall not pass this way again. —Stephen Grellet ...a saying that has long been associated with Quaker philosophy (and long predates Grellet). But a more likely place for David to have picked up this sentiment is from his father's record collection. No doubt the Cusdad, Ian McCormack, spun this fine tune once or twice during David's formative years: The once-popular tune, from Glen Campbell is lifted straight from the original Quaker saying. And everything I've given back Was what I wanted even more. ...and this has a similar philosophical ring to it. To my mind it evokes this quote, often misattributed to Richard Bach, If you want something very, very badly, let it go free. If it comes back to you, it's yours forever. If it doesn't, it was never yours to begin with. —Jess Lair And this line gets to the theme of the album, if the album has one. A remembrance of things past, in search of lost time. The notion of involuntary memory: the things which we ignore in daily life, but that arise in our dreams, or are evoked against our wishes and crowd themselves into the mental stream of our inner life. And that's what it is to hear a Custard album in 2015. Memories long ignored arise. Feelings forgotten are instantly recalled. A wall of sound erupts as you push open the door to Ric's cafe. Excited chatter, familiar faces, expensive beer, art on the walls. Things forgotten arise again. Chorus: Orchids in water they go round and round my mind And if you wanna stop here I'll be fine. If you're tired, the advice written in driver's education handbooks used to be: pull over and go for a walk. Eventually this advice was changed. (And we'll come back to the drivers' education handbook later in the album). The advice now is that if you're tired, exhausted, wiped out (...sounds like a typical parent, on a good day), you should find somewhere safe to stop the vehicle and have a rest. Orchids in water On the line... Doo-wop chorus in the background. We Are The Parents (Our Parents Warned Us About) So this is Fast tempo drums, slow tempo lyrics. How we will Reminiscent of Sinatra Theory? Bring in the new year I'm disappointed that this is what new year has become. In middle age, you're lucky if you make it to eleven o'clock. "I know," she suggests, "let's call 8 O'Clock midnight, we can celebrate with the kids, have a count down and everything, then all go to bed at a reasonable hour." What if I don't want to go to bed at a reasonable hour!? What if I'm not feeling reasonable! What if I'd just rather.... (Dad falls asleep mid-sentence. It's 8:15pm. He's been cranky for days, he missed his midday nap, poor dear). Sea grass matting on a cement floor Childhood in the 70s. The smell of the sea grass matting. I thought for sure You already knew Every pet We ever had will come back one day Did you have any pets in your childhood? Did you have a pet dog? If so, how did that story end? It was a tragedy wasn't it. Every pet dog story has a tragic ending. They grow up so fast. But what is this lyric really about? Resurrection for pets? Is it some kind of homage to Stephen King's Novel Pet Sematary, or the film it inspired? Even I don't think that, so I don't see how you could let your imagination make such an extraordinary leap. Could it be a reference to Pet Sounds, the legendary Beach Boys album, that often tops lists of the greatest albums of all time. That seems unlikely. I think it's the eternal return of our memories. The pets live! But only in our memories. I sing that song so bad You can play along with ice cream tubs for drums Oh yeah Cusdad was a groovy guy in his time, never stopped being groovy. See David and Dylan playing along to dad's music, using their ice cream tubs for drums, on the sea-grass matting on a concrete floor, downstairs. One review referred to the 'snapshot lyrics' -- well the above lyric is practically a faded Polaroid, and could be from anyone's childhood in Queensland in the '70s. I don't know how it started I've got no idea how it will end but we must have made a deal with someone either up above or down we've scored one more night to make amends What are we talking about here? It's problematic. I'm uncertain. I think we're talking about the album itself. The idea of being granted "one more night to make amends." Of course there's a reference to Faust. Is it Marlowe's Faust or Goethe's Faustus? It's vaguer than that: just the general idea of making a deal with the devil. And the deal could be with heaven or hell: so it might be a 'twist of fate' style deal with an Angel. How did it start? How did the deal, a new record, come about? It seems like a pretty safe bet for ABC music to have taken on. A massive amount of the entertainment economy is driven by repackaging and reinvention of nostalgia. Star Wars, Marvel, James Bond and so on. Music festivals seemed to have filled up with bands from 15 years ago: I paid many dollars to see Blur in Melbourne recently, and it was worth every penny. Giving Custard one more chance is a great deal for everyone. The aging fanbase may not go out as often they used to, but their combined disposable income is greater than what is was in the band's first heyday. we are the parents our parents warned us about On to the chorus: here we have exactly the sort of lyric that is accused of being "too clever". This has long been a criticism levelled at Custard, and it's a sad indictment either of the Australian listening public, or, more likely, of the average Australian rock journalist's opinion about the intellectual power of the Australian listening public. But now we can get onto the song that I haven't seen mentioned by anyone else. Jimmy Buffet, "We are the people our parents warned us about." In that song, we've let our parents down by failing to become a Jesuit priest, or a naval academy grad. But what is it that this song is calling out about us? What is it that the narrator has done to bring on his parents scorn: we can spell "scientist" correctly The trick with 'scientist', in case you're new at this, is that the old rule "'i' before 'e' except after 'c'" is broken. There is a "c". and yet the 'i' still goes before the 'e'. Weird. (Weird also that weird also breaks this weird rule). It's one'''
