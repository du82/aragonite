["https://wiki.secretgeek.net/guns-game-of-life"]
title = "Guns (Game of Life) (wiki.secretGeek.net)"
full_description = "What Links Here? (6 articles…) glossary-game-of-life spaceships-game-of-life conways-game-of-life starting-patterns-gol oscillators still-life Outbound Links (11 articles…) ⭐ cellular-automata ⭐ spaceships-game-of-life ⭐ conways-game-of-life ⭐ flowsnake ⭐ spaceships-game-of-life ⭐ glossary-game-of-life ⭐ cellular-automata ⭐ spaceships-game-of-life ⭐ oscillators ⭐ still-life ⭐ guns-game-of-life Guns (Game of Life) gol al game of life patterns ca gosper A 'gun' (in the world of Cellular Automata) is a stationary pattern that emits moving patterns (i.e. spaceships). Note that a gun is a pattern which grows without limit. The first gun to be discovered was the Gosper Glider Gun. It is also the simplest known gun in Conway's Game of Life. It was discovered by Bill Gosper, who also discovered the FlowSnake (also known as the Gosper Curve). Gosper Glider Gun Below is the Gosper Glider Gun, which emits a steady stream of gliders. It has a period of 30, as it emits a new glider ever 30 generations. For the purposes of this demonstration I've also added an eater, at the bottom of the pattern, which destroys the gliders, before they have a chance to wrap around and monkey-wrench the gun. (I'm using a toroidal array, i.e. a wrap-around world... as I can't afford the infinite pixels required for a true GOL board.) 000000000000000000000000000000000000000 000000000000000000000000010000000000000 000000000000000000000001010000000000000 000000000000011000000110000000000001100 000000000000100010000110000000000001100 011000000001000001000110000000000000000 011000000001000101100001010000000000000 000000000001000001000000010000000000000 000000000000100010000000000000000000000 000000000000011000000000000000000000000 000000000000000000000000000000000000000 000000000000000000000000000000000000000 000000000000000000000000000000000000000 000000000000000000000000000000000000000 000000000000000000000000000000000000000 000000000000000000000000000000000000000 00000000000000000