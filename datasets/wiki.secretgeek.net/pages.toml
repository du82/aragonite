["https://wiki.secretgeek.net/Category/logo"]
title = "Category: LOGO at wiki.secretGeek.net"
full_description = '''🔥 Featured category Category LOGO (See also: all categories, featured categories, featured articles, all articles. Sort articles by name, created, edited) related-categories fractal 13+ curve 9+ geometry 9+ chaos 8+ sierpinski 4+ triangle 3+ grimoire 2+ spiral 2+ stub 2+ … 6 algorithms 1+ category 1+ gosper 1+ hilbert 1+ math 1+ sort 1+ The Logo programming language is an amazing teaching tool and a lot of fun. It includes a graphical system called "Turtle Graphics" where you give instructions to a turtle, and the turtle moves around, drawing as she goes. Logo has been reimplemented many times, for every platform. It was first invented (or discovered?) by Wally Feurzeig, Seymour Papert, and Cynthia Solomon in 1967, the same year as the Beatles released "Sgt Peppers". The first implementation of Logo, called Ghost, was written in LISP on a PDP-1. The goal was to create a mathematical land where children could play with words and sentences —wikipedia The work of Seymour Papert did much to popularize the language and spread the idea, particularly the book Mindstorms, subtitle: "Children, Computers, and Powerful Ideas" which is available online here (thanks to the generosity of Papert's family). Articles with Category LOGO (20…) Bubble Sort Dragon Curve Fern Fractal FlowSnake Harriss Spiral Hilbert Curve Koch Curve Koch Snowflake Penrose Tiling Penrose Triangle Polygon Reuleaux Triangle Sierpinski Carpet Sierpinski Curve Sierpinski Polygon Sierpinski Triangle Space Filling Curves Spirals Tree Fractal Triangle'''
