["https://wiki.secretgeek.net/About"]
title = "About (wiki.secretGeek.net)"
full_description = '''What Links Here? (1 articles…) try-programming-languages-in-your-browser Outbound Links (48 articles…) Leon Bambrick blog post launching the wiki is here ⭐ rss stub gol logo Math spin stub caesar-shift category ⭐ Paradox Tangle Tangle minimum price explorer processing Spoiler d3 D3.js mermaidjs mermaid js flowcharts sequence diagrams class diagrams state diagrams Gantt charts pie charts Markdown Editor Logo Editor Spintax Editor Random Dungeon Generator Caesar-Cipher Editor Game of Life Editor Image Gallery Red Blob Games the sierpinski triangle page to end most sierpinski triangle pages Bret Victor's Learnable Programming _why's tryruby Bob Nystrom's Dungeon generation article Nicky Case Gears whatever this thing is Explorable Explanations Wikipedia: List of Martin Gardner Mathematical Games columns Youtube: ViHart bl.ocks observables publicly available trello board showing categories and articles About meta .h{display:none} This site is written by Leon Bambrick (leodo not show thisnbamdo not show thisbrickdo not show this@gdo not show thismail.com). It aims to be a complete, timeless, annotated repository of things I find sort of interesting. The original blog post launching the wiki is here. There is an RSS feed of recent edits. (Only includes edits not marked as 'minor') Articles Every article should contain original research. Articles are written in markdown. They can be tagged as belonging to categories. (There should also be a "featured" tag, used for making the front page and sidebar more interesting, but that isn't implemented yet) If an article contains the category "stub", or if an edit is flagged as a "minor edit" (there's a checkbox for this) then it won't appear in the sidebar or rss as a recent edit. Illustrated Where possible, the wiki should provide illustrative visualizations of the topic being discussed. Interactive Where possible, the visualizations (and other aspects of the articles) should be interactive, allowing the reader to change parameters, re-run animations, and alter the state of an element. Interactive elements should also have a "tinker..." link that takes you to a sandbox where you can really explore the interactive element with less restrictions. Plugins The category system is also used for loading plugins. For example, if an article has the 'logo' category, then the logo plugin is loaded. Current plugins include: gol (for Game of Life) logo (embed Turtle Logo) Math (for embedding mathematical notation) spin (for spintax) stub (adds a note about the article being a stub, see below) caesar-shift (allows the automated caesar-shifting of a piece of text) category Allows one to write articles about categories (that are not necessarily members of that category). Thus, for example, the intricacies of the logo implementation (and its extensions) can be documented. Planned plugins Tangle Will allow Tangle or similar markup, for interactive documents. (I've previously used Tangle in this minimum price explorer) processing To allow processing.js visualizations. Spoiler Simplify the ability to have spoilers that are hidden initially, but can be revealed. Could be useful when challenges and puzzles are presented. d3 For including D3.js library and some related helper functions or syntax, ultimately to do beautiful and interactive charts mermaidjs To include the mermaid js for including any of these: flowcharts, sequence diagrams, class diagrams, state diagrams, Gantt charts, pie charts Bonus Pages There's a number of added bonuses at this site, other than articles and plugins. Markdown Editor — online markdown editor (doesn't save anywhere) Logo Editor Spintax Editor Random Dungeon Generator Caesar-Cipher Editor Game of Life Editor Image Gallery Hidden Message There are hidden messages. Inspirational Styles When in doubt, use these sites for inspiration: Red Blob Games the sierpinski triangle page to end most sierpinski triangle pages Bret Victor's Learnable Programming _why's tryruby Bob Nystrom's Dungeon generation article Nicky Case Gears — beautiful interactive demonstrations of Gears, by Bartosz Ciechanowski whatever this thing is Explorable Explanations ← every page linked from every page linked from this page. Inspirational Topics If ever one is short of topics, consider everything mentioned in any of these places: Wikipedia: List of Martin Gardner Mathematical Games columns Youtube: ViHart Mike Bostock's bl.ocks and observables Explorable explanations (listed above) -- or better yet: any interesting idea that is not already sufficiently covered by an explorable explanation. Planned categories and articles There is a publicly available trello board showing categories and articles i'd like to write about.'''
