full_description = '''Outbound Links (24 articles…) HeroKids review here buy it here No Thank You, Evil! review playtest review audio review Sidekick quests store Mouse Guard (rpg) D6 Dungeons My Little Pony: Tails of Equestria review Fate Accelerated Monster Slayers Risus rule set Dnd Monsterslayers Tabletop audio RPG Character Sheet Generator wikipedia: Tri-Stat Dx System wikipedia: Fudge (role-playing game system) Reddit: good rpg for kids? Tabletop audio DnD Dwarf commons wikimedia RPG For Kids stub rpg adventure games spin kids Role Playing Games are a lot of fun. What are some good introductory role-playing games for kids? (And particularly for girls) HeroKids — sounds great, review here, buy it here — I did! No Thank You, Evil! — review, playtest review, audio review; Less combat focus than HeroKids. Sidekick quests — "A simple 'lite style' role playing game designed to introduce children to role playing" store — I like this one. Mouse Guard (rpg) — People love this. The artwork is a delight. D6 Dungeons My Little Pony: Tails of Equestria — review Fate Accelerated Monster Slayers Risus rule set Dnd Monsterslayers Background noise You can play ambient background music from Tabletop audio Build your own RPG (for kids!) How hard would it be to build your own RPG? I mean the whole thing, the mechanics and the stories, the artwork, everything. The {stories|tales} themselves are {rich|detailed|richly detailed}, if {predictable|familiar}. "Will {Storm|Fire|Water|Ice|Dungeon|Rock|Gold|Mist}{Breaker|Bringer|Eater|Taker|Shaker} the {Brave|Foolish|Wise|Golden|Nasty} be able to {defeat|out-wit|double-cross|trounce|betray} {Storm|Fire|Water|Ice|Dungeon|Rock|Gold|Mist}{Breaker|Bringer|Eater|Taker|Shaker} the {Brave|Foolish|Wise|Golden|Nasty|Green|Orange|Brown|Red|Sudden} before {he|she|they} can {destroy|befriend|overthrow|thrash|swindle} {Storm|Fire|Water|Ice|Dungeon|Rock|Gold|Mist}{Breaker|Bringer|Eater|Taker|Shaker} the {Brave|Foolish|Wise|Golden|Nasty}? Perhaps, but on