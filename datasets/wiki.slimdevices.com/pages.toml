full_description = '''Main Page From SqueezeboxWiki Jump to: navigation, search Welcome to the Squeezebox Wiki! This Wiki is meant as a knowledge base and "How-to" relating to the Squeezebox product line. It is made up primarily of user-contributed content, though you will find articles submitted by Logitech's team members as well. WARNING: This wiki may contain information which is outdated or inaccurate. Contents 1 Start here 2 The line-up 2.1 Servers 2.2 Players & Controllers 2.2.1 Hardware 2.2.2 Software 3 Extending your Squeezebox system 4 When trouble arises 5 Developing Squeezebox 6 About this wiki Start here Beginners Guide Networking Guide The line-up Servers MySqueezebox.com Logitech Media Server (formerly know as SqueezeCenter and Squeezebox Server) Players & Controllers Hardware Overview Hardware comparison Squeezebox Touch Squeezebox Radio Squeezebox Boom Squeezebox Duet Squeezebox Controller Squeezebox Receiver Transporter Squeezebox 3rd Generation Squeezebox2 Squeezebox, SB1 SLIMP3 Software Squeezebox Controller App SqueezePlay & SqueezeOS (formerly known as Jive) SoftSqueeze Jivelite Squeezelite Extending your Squeezebox system 3rd Party Music Services Community Projects How To Guides - Step by step guides for your Squeezebox products Changing the Squeezebox Controller Highlight Color Third-Party SqueezeCenter Plugins Where to download current, future and past versions When trouble arises Finding Problems This Wiki is not meant as a general purpose tracking system. Please use our Bugzilla database for that. Developing Squeezebox People pages, DIY projects, and other fun stuff Future Plans for Automated Tests About this wiki All Pages Old Man's Index (Under Construction) Squeezebox Wiki Style Guide We migrated our old wiki over to the MediaWiki software platform, so there may be a few places where things aren't yet in perfect working order. Please bear with us as we work through these issues. If you're comfortable with it, please feel free to jump in and correct any problems you see, or expand/edit any of the content. Everybody: Even if you don't feel comfortable with editing the content of a page, it would be a big help if you could identify pages where you know the information is incorrect. To do this, add {{edit needed}} to the top of the page. (Be sure to copy that text exactly as shown). Open Migration Tasks - A summary of open issues still to be addressed. Feel free to add open items to this page or, better yet, pick one, fix it and then delete it from the page! This page will be archived when the migration is completed. Editors: Please be sure to remove the {{edit needed}} template, once you've completed the update for that page. I you find spam on a page, please delete the spam. If the page is all spam, also add {{spam}} to the page, so that an administrator can delete the whole page. If you need an administrator to delete a page for some other reason, you can request this by adding {{delete}} to the page. Please also state the reason for this request if it's not blatantly obvious. Retrieved from "https://wiki.lyrion.org/index.php?title=Main_Page&oldid=14037" Category: Root'''
