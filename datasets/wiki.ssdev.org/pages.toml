["https://wiki.ssdev.org/wiki/Karlsruhe:Bastelworkshop_III"]
title = "Karlsruhe:Bastelworkshop III – SSDeV"
full_description = "Karlsruhe:Bastelworkshop III Aus SSDeV Zur Navigation springen Zur Suche springen Am Samstag, 25. August 2007 ist es mal wieder soweit, dass wir einen Bastelworkshop in den Räumen von Entropia e.V. in Karlsruhe machen wollen. Der Workshop beginnt um 14:00 Uhr und geht bis ... mal schauen ;) Geplant sind derzeit Spannerbau - Picksbauen - (Schlag-)Schlüsselfräsen - Türöffnung - Schlagwerkzeugbauen - etc. Bitte meldet euch per Mail an karlsruhe[at]ssdev.org an, damit wir genügend Material für jede/n besorgen können, das gegen einen geringen Unkostenbeitrag erstanden werden kann! Kurzfristige Unterstützung bei den Workshops ist natürlich immer willkommen :) Für die Leute von weiter weg, können wir auch eine Übernachtungsmöglichkeit bei Voranmeldung anbieten. Ausserdem ist Karlsruhe super mit dem Zug angebunden ... Eine Wegbeschreibung findet ihr unter Anfahrt. Vorsicht: Die Parkplätze rundrum sind für Anwohner(innen) oder kostenpflichtig. Kostenfreie Parkplätze am Samstag (oder abends) gibt's im Uni-Gelände oder an der Franz-List-Schule, manchmal an der Kriegsstr. entlang. Die nächsten Parkhäuser sind am Kronenplatz oder am Ettlinger-Tor-Center. Inhaltsverzeichnis 1 Geeignetes Material 1.1 für Spanner 1.2 für Picks 2 Werkzeug 3 Link Geeignetes Material für Spanner Scheibenwischerblätter (vom Schrottplatz oder einer Autowerkstatt) Federstahl (beim Modellbau oder bei z.B. Conrad) für Picks breite Scheibenwischerblätter (z.B. von ausrangierten Lastwagen) Federstahl Sägeblätter Plastikstiftminen Alurohre Schrumpfschlauch Werkzeug Bitte bringt zum Bearbeiten des Metalls euer eigenes Werkzeug - sofern vorhanden - mit. Wichtig sind: Metallfeilen Zangen Schraubstock Schutzbrille (ansonsten kommt ihr nicht an die Maschinen) Außerdem sinnvoll sind: Bunsenbrenner Campingkocher Dremel feines Schleifpapier Wir werden etwas Werkzeug mitbringen, dass ihr auch leihen könnt. Allerdings ist eigenes Werkzeug von Vorteil. Link Eine Einführung zum Spannerbasteln findet Ihr im Anhang A des MIT - Handbuch zur Schlossöffnung. Informationen zum Picks- und Spanner-Basteln von Pickeon Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Karlsruhe:Bastelworkshop_III&oldid=2835“ Kategorie: Sportgruppe"
