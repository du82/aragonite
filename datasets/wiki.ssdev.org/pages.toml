["https://wiki.ssdev.org/wiki/Unterwasser"]
title = "Unterwasser – SSDeV"
full_description = "Unterwasser Aus SSDeV Zur Navigation springen Zur Suche springen Du findest halb versunken im Schlamm eine Truhe, fingerst nach dem Verschluß alle Kanten ab. Aha, da! - Ein altes Vorhängeschloß mit schönen Ornamenten, eine geheimnisvolle Militärkiste mit einer Schloßöffnung? Was verbirgt sich in ihr, ein Schatz, oder nur wertloser Kram, bis zum Rand mit Schlamm bedeckt? Willst Du das wertvolle Schloß zerstören, oder nicht? Vielleicht ist es das Teuerste am ganzen Fund. UW-Sperrtechnik Workshop im Februar '98 auf Sri Lanka. Was nun? Die Kiste steckt im Schlamm fest, Du bekommst sie nicht raus. Nur durch Freispülen und ein Herbeibringen von Hebesäcken ist das Bergen möglich. An eine Boje, um den Fund zu markieren, hast Du nicht gedacht! Als Sportsfreund der Sperrtechnik wohl eine lösbare Aufgabe... UW-Sperrtechnik Workshop im Februar '98 auf Sri Lanka. Im Workshop Unterwasser-Sperrtechnik wird wird das Handling mit den Picks unter Wasser vermittelt. Im Baggersee werden übungsschlößer ausgelegt und müssen von den Teilnehmern unter Aufsicht angetaucht werden. Bei der ungewohnten Umgebung wird schnell klar, daß durch die veränderten physikalischen Bedingungen die Zylinderstifte ihr Schlagverhalten verändert haben. Neue Hindernisse stellen sich dem sportlichen Sperrtechniker entgegen, die natürlich überwindlich sind - was sonst. Gemeinsam werden neue Erfahrungen gesammelt und ausgetauscht. Voraussetzungen zur Teilnahme sind neben der Mitgliedschaft im SSDeV, ein gültiges tauchärztliches Attest, ein gültiger Tauchschein und eigene Ausrüstung. Leitung: Sportsfreunde Armin (Berufstaucher und Tauchsportlehrer) und Steffen. Links aktueller Koksa-Thread zum Thema Diese Seite wird derzeit überarbeitet und nachfolgend aktualisiert - mehr in Kürze... Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Unterwasser&oldid=7610“ Kategorie: Sportgruppe"
