["https://wiki.ssdev.org/wiki/M%C3%BCnchen"]
title = "München – SSDeV"
full_description = '''München Aus SSDeV Zur Navigation springen Zur Suche springen Inhaltsverzeichnis 1 Regelmäßige Treffen 1.1 Termine 1.2 Veranstaltungsort 1.3 Mailingliste 1.4 Weitere Termine 2 Anreisehinweise 2.1 Anreise Öffentlich 2.2 Anreise mit Auto/Hubschrauber 3 Aktuelle Themen Regelmäßige Treffen Die Sportgruppe München trifft sich jeweils am vierten Freitag des Monats um 18:00 (Ausnahmen sind möglich, meist im Dezember wegen CCC-Kongress). Zum monatlichen Treffen ist jede(r) herzlich willkommen - egal ob Vereinsmitglied oder nicht, erfahrener Lockpicker oder Anfänger. Und natürlich auch Neugierige, die wissen möchten was Lockpicking eigentlich ist. Termine Nächster Termin: 28.02.2025 ab 18:00 Dieses Treffen findet physisch statt! Terminvorschau (unverbindlich): 28.03.2025 - 25.04.2025 - 23.05.2025 - 27.06.2025 25.07.2025 - 22.08.2025 - 26.09.2025 - 24.10.2025 - 28.11.2025 - (Termin für Dezember 2025 wird noch festgelegt wg. Kongress) Veranstaltungsort Vereinsräume des Münchener CCC e.V. Schleißheimerstr. 41 (Ecke Heßstr.) 81549 München GPS: N48°09.218' E11°33.650' Für aktuelle Informationen zum Treffen am besten vorab eine E-Mail schicken, wir versenden vor jedem Treffen eine Rundmail über die Mailingliste. Kontakt Mailingliste Auf vielfachen Wunsch gibt es auch eine offene Mailingliste: An-/Abmeldung auf http://lists.muc.ccc.de/cgi-bin/mailman/listinfo/ssdev Bitte bei der Anmeldung darauf achten ob man den "daily digest" abonniert: Dann erhält man *nur* eine tägliche Zusammenfassung. Weitere Termine Da von vielen Besuchern der Wunsch nach weiteren Treffen geäußert wurde, ist jetzt geplant, sich zum gemütlichen Lockpicken beim CCC München abends zu treffen. Bei entsprechenden Interesse über obige Mailingliste werden die Abende angesetzt. Ziel hier ist hier das gemütliche Picken für die schon wissen wie es funktioniert und weniger der Erklärbär für absolute Neueinsteiger. Natürlich wird die SSDeV Schlosskiste auf dem Tisch stehen, aber mitgebrachte Zylinder werden natürlich auch untereinander gepickt. Also bitte auf obiger Mailingliste anmelden. Anreisehinweise Anreise Öffentlich U2 : Theresienstraße 5 Minuten Fußweg über Theresien- und Schleißheimerstr. Tram 20/21 Sandstraße 5 Minuten Fußweg über Maßmann- und Schleißheimerstr, Anreise mit Auto/Hubschrauber Einfach Dachauerstr. anfahren/fliegen, dann in die Lothstr. abbiegen und direkt rechts in die Heßstr. und nächstgelegene Parkgelegenheit suchen (an der Hochschule München gibt es meist einige). Aktuelle Themen Wir befassen uns u.a. mit elektromechanischen Schliesssystemen diverser Hersteller in Verbindung mit eigenen Ansteuerungen. Wer mit sowas oder auch anderen Systemen schon Erfahrungen gemacht hat, ist jederzeit gerne willkommen. :) Natürlich stehen auch immer unsere Schloßkisten mit ca. 100 mechanischen Schliesszylindern und Hangschlössern aller Schwierigkeitsstufen auf dem Tisch und außerdem haben wir nette Anfänger-Picksets, die gleich zum ausprobieren einladen. Ansonsten wird bei uns neben üblichen Stiftzylindern auch gerne mit Drehscheibenzylindern (Abus Plus u.ä.) und Tresorschlössern gespielt. Wer den ABUS Plus Pick von Jaakko Fagerlund mal austesten möchte, kann das gerne tun - am besten auch gleich ein oder zwei ABUS Plus / X-Plus Schlösser zum Testen mitbringen. Manipulation eines ungewöhnlichen Kombinations-Hangschlosses ( Master Lock One bzw. "Speed Dial"): Auch wenn der Preis nicht besonders hoch ist, ist die Komplexität der Manipulation durchaus mit der eines Zahlenkombinations-Tresor-Schlosses vergleichbar - eine interessante Herausforderung also. Wer sich vorher ein wenig informieren möchte: http://blackbag.nl/?p=183 Wir haben uns auch einem weiteren neuartigen Kombinations-Hangschloss gewidmet, dem Master Lock DialSpeed. Das Bedienkonzept ist ähnlich dem Speed Dial - jedoch nicht auf mechanischer sondern elektronischer Basis. Eine pfiffige Idee (u.a. sind dadurch ausser dem normalen Öffnungscode noch drei weitere Gast-Codes ohne Programmierberechtigung möglich) - leider hat auch dieses Schloss eine Schwäche die dazu führt, dass man es auf anderem Weg zerstörungsfrei öffnen kann. Kleiner Tipp: Es hat etwas mit (starken) Magneten zu tun. ;) Inzwischen ist die Ära der Bluetooth-Schlösser angebrochen. Der Markt wird geradezu überschwemmt mit Hangschlössern, die mittels einer Bluetooth-Funkverbindung via Smartphone geöffnet werden können. Auf den ersten Blick eine tolle Sache: Kein Schlüssel (den man verlieren) und kein Code (den man vergessen kann)! Stattdessen reicht in Klick in einer App und das Schloss entriegelt. Leider (oder sollten wir sagen: erwartungsgemäss?) ist keines der Schlösser, die wir bisher getestet haben, wirklich sicher! Sei es, dass der Verriegelungsmechanismus anfällig gegenüber den bekannten Magnet-Attacken ist oder dass die Apps und/oder die Kommunikation zwischen App und Schloss diverse Schwächen haben. Abgerufen von „https://wiki.ssdev.org/w/index.php?title=München&oldid=8530“ Kategorie: Sportgruppe'''
