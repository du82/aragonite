["https://wiki.ssdev.org/wiki/Karlsruhe"]
title = "Karlsruhe – SSDeV"
full_description = "Karlsruhe Aus SSDeV Zur Navigation springen Zur Suche springen Die Sportgruppe Karlsruhe traf sich jeweils am vierten Mittwoch des Monats um 20 Uhr in den Räumen des Entropia e.V. Falls die Türe geschlossen ist, Entropia e.V. hat eine Klingel. :-) Da die Termine sich kurzfristig ändern konnten, haben wir eine Mailingliste eingerichtet, in die man sich mit einer leeren Mail an lockpicking-ka-subscribe@lists.entropia.de eintragen kann. Wir senden immer ca. 0-2 Tage vor einem Treffen eine Nachricht über die Liste. Wenn ihr also vorbeikommen wollt, tragt euch am besten auf der Liste ein oder schaut kurz vorher hier vorbei. Termine zum Hinfahren Aktuelle Termine im SSDeV-Blog Kontakt Email: karlsruhe@ssdev.org Sportgruppenleiter: Jan, Tobias Sportgruppe Karlsruhe im KOKSA-Forum weitere Seiten der Sportgruppe Karlsruhe unsere bisherigen Projekte und Aktionen seit April 2002 Bastelworkshop_I am 06. März 2004 Bastelworkshop_II am 05. Februar 2005 Bastelworkshop_III am 25. August 2007 Luschtiges halt GPN (bei Entropia e.V.) GPN heißt Gulaschprogrammiernacht und wird vom Entropia e.V. organisiert Die Sportgruppe Karlsruhe nimmt mit einem Anfänger/innen-Workshop und mehreren Vorträgen seit Jahren daran teil. GPN1 - Derk ist schuld! - Photos GPN2 - SPG KA das erste Mal in Aktion - Photos GPN3 - Till was here! - Photos GPN4 - Beschreibung - Wir sind in der Zeitung! (Bild vom Artikel) - und es wird gebloggt! GPN5 - diesmal mit Stuttgart - Beschreibung - Photos - Vortrag: De(kon)struktion des Begriffs Sicherheit GPN6 - gemütlich war's - weitere Infos GPN7 - der Ansturm begann schon Freitagabend - weitere Infos GPN8 - spacige Atmosphäre - weitere Infos GPN9 - wurde verschoben und zur GPN10 GPN10 - auch diesmal wieder gut besucht - weitere Infos GPN11 - 10 Jahre Sportgruppe Karlsruhe - weitere Infos GPN12 - gediegen, aber stetig, mit vielen neuen Karlsruhern - SSDeV-Blogeintrag und weitere Infos GPN13 - Uebergabe alte zu neuer Generation - SSDeV-Blogeintrag und weitere Infos Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Karlsruhe&oldid=8346“ Kategorie: Sportgruppe"
year_published = 2025
