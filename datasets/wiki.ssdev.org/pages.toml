["https://wiki.ssdev.org/wiki/Heilbronn"]
title = "Heilbronn – SSDeV"
full_description = 'Heilbronn Aus SSDeV Zur Navigation springen Zur Suche springen Inhaltsverzeichnis 1 Aktuelles 2 Treffen 3 Ort 4 Termine 5 Mitglieder 6 Kontakt 7 Informationen zu Lockpicking Aktuelles Momentan trifft sich die Sportgruppe Heilbronn nicht. Regelmässige Sportgruppentreffen finden bei der Sportgruppe Stuttgart in Leinfelden https://wiki.ssdev.org/wiki/Stuttgart statt, was von Heilbronn leider nicht der nächste Weg ist. Treffen Das Sportgruppentreffen findet bei genügend Teilnehmer und Interesse an einem Freitag im Monat um 19h in der Gaststätte Landturm statt. Falls Interesse besteht zu kommen, bitte eine EMail schicken. Dann wird der Termin per Mail bekannt gegeben. Ort Termine Die Sportgruppe Heilbronn trifft sich in der Regel einmal monatlich an einem Freitagabend. Interessierte und Anfänger sind herzlich willkommen. Die Teilnahme bitte unbedingt vorher per Mail anmelden, damit wir über den Termin per eMail-Verteilerliste entsprechend informieren können! Beim Sportgruppentreffen können auch Nichtmitglieder/Einsteiger Picks und Übungsschlösser erwerben. Mitglieder Heilbronner Mitgliederliste (Zugriff nur für Mitglieder) Kontakt Mail an Sportgruppe: Kontakt Informationen zu Lockpicking Lockpicking kann man aber auch gut zuhause alleine erlernen. Das beste Manuskript zum Lockpicking ist das "Handbuch zur Schlossöffnung" des SSdeV und kann unter (https://www.ssdev.org/lockpicking/MIT_D/MIT-Handbuch.pdf)heruntergeladen werden. Eine super Animation wie das ganze im Schloss aussieht und insbesondere, was es mit den berüchtigten Hantelstiften auf sich hat, findet man hier (https://www.youtube.com/watch?feature=player_embedded&v=1Lst6m5MZjw&hd=1) Als sehr gute Informationsquelle ist auch das Vereinsforum (http://koksa.org/index.php) geeignet. Dort gibt es auch ein Schloß-Wiki (http://wiki.koksa.org/KoksaWiki:Portal) mit vielen zerlegten Schlössern zum besseren Verständnis. Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Heilbronn&oldid=7984“ Kategorie: Sportgruppe'
