title = "Kontakte zum SSDeV – SSDeV"
full_description = "Kontakte zum SSDeV Aus SSDeV Zur Navigation springen Zur Suche springen Sportsfreunde der Sperrtechnik - Deutschland e.V. - Kontakte Vereinssitz: SSDeV Eschelsweg 4 22767 Hamburg Postanschrift: SSDeV Postfach 1607 22906 Ahrensburg Vorstand: 1. Vorsitzender – Jan Morawek 2. Vorsitzender – Maurice Massar Schatzmeister – Sven Breiser Sportgruppenrepräsentant – Jascha Kreppner Sportwart – Sönke Payns Sportshop: Mail: shop@ssdev.org Mitgliederservice: Mail: mitglieder@ssdev.org Presse: Mail: vorstand@ssdev.org Telefon: 030 / 32291861 Sportgruppen: Hier ist eine Übersicht der Sportgruppen. Fehlt Euch eine lokale Sportgruppe? Gründet sie! Wir unterstützen Euch! Zuständig ist Jascha kreppner – Sportgruppen-Repräsentant Mail: jascha@ssdev.org Kontoverbindung für steuerfreie Vereinsleistungen: (wie z.B.: Beiträge, Mitgliedsausweise und die Kölner Trainingslager) Bitte immer die Mitgliedsnummer und den Zusatz BEITRAG angeben! SSDeV Deutsche Bank 24 Kto.: 35 79 6 79 00 BLZ 200 700 24 Für internationale Zahlungen: IBAN: DE12200700240357967900 SWIFT: DEUTDEDBHAM Kontoverbindung für mehrwertsteuerpflichtige Leistungen: (wie z.B.: Sperrwerkzeug) Bitte immer die Mitglieds- bzw. Rufnummer und den Zusatz WARE angeben! SSDeV Deutsche Bank 24 Kto.: 35 79 6 79 01 BLZ 200 700 24 Für internationale Werkzeug-Zahlungen: IBAN: DE82200700240357967901 SWIFT: DEUTDEDBHAM Vorsteuer: Unsere UST-ID lautet: DE 202660923. Umsatzsteuer wird nur für Sperrwerkzeug berechnet! Unsere Steuernummer beim Finanzamt Hamburg-Mitte lautet: 17/444/04874. Mitgliedsbeiträge, Vereinsleistungen wie Mitgliedsausweise und die Teilnahme an den Trainingslagern und Meisterschaften sind umsatzsteuerfrei! Vereinsregister: Amtsgericht Hamburg: VR 15278 Datenspeicherung: Vorhandene Daten werden solange wie gesetzlich notwendig/vorgeschrieben ist gespeichert und nach Ablauf der Speicherungsfrist (wie gesetzlich vorgeschrieben) als gelöscht gekennzeichnet! Daten über die Bestellung von Sperrwerkzeug werden sofort nach Auslieferung (da keine gesetzliche Grundlage für eine dauerhafte Speicherung bekannt ist) als gelöscht gekennzeichnet. Vertretungsberechtigter (i.S.d. Telemediengesetz [TMG]): Dr. Manfred Bölker (vorgeschriebene Angaben auf dieser Seite). Jugendschutzbeauftragter (gemäß §7a GjS und §8 Abs. 5 MDStV): Nicht notwendig. Wir schulen Kinder ab 4 Jahren. Lieferbedingungen für Sperrwerkzeuge: Für den Erwerb von Sperrwerkzeug gelten unsere im Sport-Shop angegebenen Lieferbedingungen; weiterhin der Verweis auf den Taschengeldparagraphen, das Fernabsatzgesetz und der Hinweis nach dem Geräte- und Produktsicherheitsgesetz. Geräte- und Produktsicherheitsgesetz (GPSG): Für alle von uns vertriebenen Artikel gilt folgender Hinweis nach §5 (1) 1a GPSG: Bei der unsachgemäßen Verwendung von Extraktoren kann man sich verletzten! Sperrwerkzeug hinterläßt Kratzspuren im Schließkern. Zu langes arbeiten mit dem Tastbesteck kann zu Blasen an den Fingern führen! Schließzylinder lassen sich auch ohne Schlüssel auf- und/oder zusperren! Vorgaben für den Einsatz von Sperrwerkzeug: Von uns vertriebenes Sperrwerkzeug darf nur nach den Vorgaben unserer Sportordnung verwendet werden! SPAM: [eMail-Werbung] Alle unsere Domain-Namen sind auf der Robinson-Liste eingetragen! Die unerwünschte Zusendung von Werbung kann deshalb nur vorsätzlich erfolgen! Urheberrecht / Markenzeichen: Die Urheberrechte aller Beiträge und Abbildungen liegen, wenn nicht explizit angegeben, beim SSDeV. Nachdruck und Vervielfältigung jeder Art, auch auszugsweise, nur mit schriftlicher Erlaubnis. Wir behalten uns vor, die Verlinkung unseres Angebotes durch Menschen, welche sich auf unsere Kosten profilieren wollen, zu untersagen! Verweise auf dieses WWW-Angebot, bitte nur auf die URL http://www.SSDeV.org ! Das Vereinslogo ist als Markenzeichen beim Deutschen Patentamt unter der Nr. 397 39 673 eingetragen. Die gewerbliche Ausnutzung von Vereinserzeugnissen, wie der deutschen Übersetzung des “Handbuches zur Schlossöffnung