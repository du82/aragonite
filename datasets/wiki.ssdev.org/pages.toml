["https://wiki.ssdev.org/wiki/Linkliste"]
title = "Linkliste – SSDeV"
full_description = 'Linkliste Aus SSDeV Zur Navigation springen Zur Suche springen Inhaltsverzeichnis 1 Vereine und Institutionen 2 weitere deutschsprachige Informationen 3 Pressemitteilungen und Berichte 4 weitere englischsprachige Informationen Vereine und Institutionen Sportsfreunde der Sperrtechnik e.V. - SSDeV - der Verein Auszug relevanter Straftatbestände aus dem Strafgesetzbuch (StGB) (zusammengestellt vom SSDeV) MIT - Handbuch zur Schloßöffnung, auf deutsch gespiegelt, auf deutsch MIT-Guide, auf englisch (leider fehlerhaft) guide de crochetage des serrures a goupilles, auf französisch Sperrtechnik Handbuch mit sehr schönen Bildern (Sportgruppe Marburg) Dieters Lockpicking mit vielen Infos zu verschiedenen Schloßtypen, Tipps zur Sicherheit und erklärenden Bildern (Homepage der Sportgruppe Stuttgart) Das Chubb-Schloss und Das Tresor-Schloss (Sportgruppe Frankfurt) TOOOL - The Open Organisation of Lockpickers - der niederländische Verein - Seite in niederländisch mit englischsprachige Informationen. Videos mit Lockpicking-Workshops - von TOOOL (gehostet bei der Waag Society) BlackBag - Barrys Blog about locks - encryption - the RF-spectrum TOOOL.US - The Open Organisation of Lockpickers - die amerikanische Niederlassung SPASS - Schlösser Picken Als Schweizer Sport - unsere Schweizer Freunde P1nCh1T0s T34M - Lockpicking Team - die Spanier (liegt derzeit leider brach) Lockpicking UK - in England (liegt derzeit leider brach) Locksport International - Lockpicking und mehr in Canada Nicht bei mir - Initiative für aktiven Einbruchschutz das Thema Einbruchschutz zwischen Mietern, Vermietern und Versicherungen von Nicht bei mir - Initiative für aktiven Einbruchschutz Technische Prävention (Bayerisches Landeskriminalamt) - Ratgeber zum Einbruchschutz, Herstellerverzeichnisse "Geprüfte einbruchhemmende Produkte" und Errichternachweise "Mechanische Sicherheitseinrichtungen" sowie "Überfall- und Einbruchmeldeanlagen" Zentraler Terminkalender der Sicherheitsbranche weitere deutschsprachige Informationen Sendung mit der Maus - Sachgeschichten - Zylinderschloss Sperrtechnik - sehr schöne, anschauliche Bilder und Informationen zur Sperrtechnik von Ingo Schaefer Bumpkey-howto - Anleitung zum Schlagschlüssel machen vom CCC Mannheim (nur mit Anmeldung) Pickset-howto - Anleitung zum Picks basteln vom CCC Mannheim Schlossgeschichte - einiges über die Geschichte der Schlösser, Museen oder Sammlungen, empfohlene Literatur, historische Schlösser (von Derk Marco Reckel)***geht nicht mehr*** Hans Schell Collection - Österreichisches Museum für Schloss, Schlüssel, Kästchen, Kassetten und Eisenkunstguss Pickeon - Tipps, Glossar, Quiz und Forum zum Thema Lockpicking KOKSA-Community - Forum zum Thema Lockpicking - die hohe Kunst des Schlossöffnens Kreiller Fachhandel - Baubeschlag - anschauliche Beschreibungen zu Schlösser, Schließzylinder, Türbeschläge und Türschließer Kriminaltechnischen Prüflabor GÖTH GmbH - untersucht auch Schlösser & Profilzylinder oder Schlüssel Geheimwissen Schlüsseldienst - Anleitung zum Schlossöffnen - Werbung zum Buch / zu den Büchern von Michael Bübl Eine Einführung in die Aufsperrtechnik - Vortrag beim CCC Ulm. Eine Übersicht der verschiedenen Methoden, mit denen Schloss und Riegelwerk ausgetrickst werden können. Pressemitteilungen und Berichte Fahrradschlösser-Testberichte im Bike Magazin und Trekingbike (gehostet bei der Sportgruppe Stuttgart) AG München: Geld zurück nach Wucher bei Schlüsseldienst - Artikel in der beck-aktuell (Verlag C. H. Beck - Recht Steuern Wirtschaft) vom 19. Oktober 2004 Der Rambo vom Schlüsseldienst - Artikel in der Süddeutschen Zeitung vom 28. Februar 2005 Auto-Schlüssel mit unsicherem Schlüssel - in den heise online News vom 30. Januar 2005 Lockpickern bleibt nichts verschlossen - Artikel über den SSDeV in der FAZ vom 17. Dezember 2003 Mit der Sperrtechnik auf Du und Du - Artikel über einen Workshop in Bremen in der Zeitung der informatica feminale, eine Sommeruni Informatik, vom 10. September 2007 GPN lockte 100 Computerbegeisterte ins Z10 - Artikel über die GPN3 im ka.stadtblog.de vom 23. Mai 2004 GPN4, Karlsruhe: Lockpicking - LiveBlog von Oliver Gassner vom 21. Mai 2005 Ein neuer Sport - Schlösser öffnen in Rekordzeit - Artikel über Lockpicking auf der GPN4 in der Stuttgarter Zeitung vom 23. Mai 2005 Die Zukunft des Wissens und die verkäufliche Sicherheit - Artikel über die GPN4, unter anderem über Lockpicking in telepolis vom 27. Mai 2005 The Lock Busters - Bericht über die DutchOpen und Lockpicking in Europa im WIRED-MAGAZINE vom Februar 2005 (deutsche Version, übersetzt vom SSDeV) Who Needs Keys? - Artikel über amerikanische und europäische Lockpicker in den legal affairs (USA) vom 21. Oktober 2004 weitere englischsprachige Informationen Introduction to Lockpicking & Physical Security (Deviant Ollam) - Information über Lockpicking mit schönen Grafiken security.org (Marc Weber Tobias, Autor von Locks safes & security) - umfangreiche Site mit Information über Sicherheitstechnik Bumping Locks (Barry Wels & Rop Gonggrijp von Toool) - Informationen über Schlagschlüssel (als pdf 0,54 MB) Notes on Picking Pin Tumbler Locks (Matt Blaze, University of Pennsylvania) - Information über Lockpicking Master-Keyed Lock Vulnerability (Matt Blaze, University of Pennsylvania) - Informationen über Schließanlagen The second sincerest form of flattery (Matt Blaze, University of Pennsylvania) - Informationen über Tresorschlösser How stuff works: "How Lock Picking Works" - Information über Lockpicking How stuff works: "How Power Door Locks Works" - Information über elektronische Türschlösser How stuff works: "How Combination Locks Works" - Information über Kombinationsschlösser How stuff works: "How Safecracking Works" - Information über Tresoröffnung HPLockPicking - Lockpicking mit Computerteilen ;) Lockpicking 101 - Diskussions-Forum zum Thema Lockpicking Yahoo! Groups : locksports - Yahoo!Group zum Thema Lockpicking IMPRESSIONING MANUAL FOR AMATEUR LOCKSMITHS Version