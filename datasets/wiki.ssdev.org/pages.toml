title = "Hamburg – SSDeV"
full_description = "Hamburg Aus SSDeV Zur Navigation springen Zur Suche springen Inhaltsverzeichnis 1 Treffpunkt 2 Nächste Treffen 3 So findet Ihr uns ! 4 Anfahrt per ÖPNV 5 Parkplätze Treffpunkt Die Hamburger Sportgruppe trifft in den Räumlichkeiten des attraktor e.V. im Eschelsweg 4 in 22767 Hamburg-Altona. Kontakt Nächste Treffen Sportabende: JEDEN Mittwoch ab 19.30 Uhr, Termine die ausfallen, werden hier angekündigt! So findet Ihr uns ! Eschelsweg 4, 22769 Hamburg, im Makerspace Attraktor, der Weg ist ausgeschildert! Adresse: Eschelsweg 4 (Altona), 22769 Hamburg Koordinaten: 53.549838, 9.946596 Anfahrt per ÖPNV Wie man auf dem nachfolgenden Bild sieht, ist diese Location sehr zentral mitten in der Stadt. Die nächste S-Bahnhaltestelle ist Königsstrasse, zu den Bahnhöfen Reeperbahn und Altona ist es in etwa gleich weit. Busverbindungen gibt es diverse. Daten von http://www.openstreetmap.org/ Veröffentlicht unter http://opendatacommons.org/licenses/odbl/ Parkplätze Parkplätze gibt es zu Sportgruppentreffzeiten rund um die Location und auch auf dem Gelände genug! Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Hamburg&oldid=8337“ Kategorie: Sportgruppe"
