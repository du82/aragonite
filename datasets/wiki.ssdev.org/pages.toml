["https://wiki.ssdev.org/wiki/Berlin"]
title = "Berlin – SSDeV"
full_description = 'Berlin Aus SSDeV Zur Navigation springen Zur Suche springen Aktuelle Termine im übersichtlichen Kalenderformat Ankündigungs- und Terminseite der Sportgruppe Berlin der Sportsfreunde der Sperrtechnik Deutschland e.V. Announcements and upcoming events from the Berlin Sportgroup of the Lockpicking Sportenthusiasts of Germany >> Lockpicking im Café Olé Entweder am 1. Samstag im Monat im ehemaligen Café Olé (jetzt "Rudi und Rosa") auf dem Gelände der Ufa-Fabrik in Tempelhof, Viktoriastraße 10, U-Bhf Ullsteinstraße oder im M5, Markstraße 5 (Ladenlokal im Erdgeschoss neben der Buchhandlung am Schäfersee), U-Bhf Franz-Neumann-Platz. Aktuelle Infos: >> lockpicking-im-cafe-ole.de Nächstes Treffen am 04.04.2025 1600 bis 1800 Uhr im "Rudi und Rosa" (ehem. Café Olé). Anfänger willkommen. hier gehts zur Aktion „inhouse-workshop“ „loccpiccbase“, Schlösser öffnen auf der C-BaseNächster Termin an Bord:13.03.2025 ab 19 Uhr Direkt am Ufer der Spree (S/U Jannowitzbrücke). Anfängerworkshop in derKastanienallee 85, HH, EG (Prenzlauer Berg)Nächster Termin: Samstag, 15.03.2025 ab 16h Anfahrt siehe unten. Schlösser Öffnen im Vétomaten Nächster Termin: Sonntag, 16. Februar 2025 ab 19 Uhr Wühlischstr. 42, 10245 Berlin-Friedrichshain S Warschauer Str, Ostkreuz, U5 Frankfurter Tor, Straßenbahn M13, 21 Inhaltsverzeichnis 1 Kontakt – Contact 2 Treffen – Gatherings 3 Aktivitäten & Projekte – Activities & Projects 3.1 Termine – Appointments 3.2 (Inter)nationale Termine – (Inter)national appointments 4 Links 5 Verein Kontakt – Contact allg. Anfragen / general inquiries Sportsfreund Ulli, Torsten, Roland, Frank @SSDeV_SG_Berlin Treffen – Gatherings Die nächsten offenen Sportabende – also auch für Anfänger und Nichtmitglieder – finden voraussichtlich am 1. Samstag des aktuellen Monats im M5 oder im ehem.Café Olé ("Rudi und Rosa") und am 3. Samstag des laufenden Monats in der Kastanienallee 85 in Berlin-Prenzlauer Berg sowie zusätzlich voraussichtlich einmal monatlich Sonntags ab 1830 Uhr im Vetomaten Wühlischstr. 42, 10245 Berlin-Friedrichshain (S Warschauer Str, Ostkreuz, U5 Frankfurter Tor, Straßenbahn M13, 21) statt. Nächstes Treffen am 04.04.2025 16:00 bis 18:00 im "Rudi und Rosa" (ehem. Café Olé). Aktuelle Hinweise zu unseren Treffen auch unter http://lockpicking-im-cafe-ole.de/. Anfängerworkshop in der Kastanienallee 85 - Nächster Termin: Samstag, 15.03.2025 ab 16h Erreichbar ist unser Treffpunkt in der Kastanienallee 85 mit verschiedenen möglichen Verkehrsmitteln: mit den Tramlinien M1, bzw. M12 – „Schwedter Str.“, mit der U-Bahn U2 – „Eberswalder Straße“, mit dem KFZ (Parkpläze sind Mangelware und seit 01.10.2010 kostenpflichtig!!!), mit dem Fahrrad (… möglichst nicht draußen lassen, sondern besser im Hauseingang anschließen oder – noch besser – mit in den Raum nehmen) Aktivitäten & Projekte – Activities & Projects Termine – Appointments „loccpiccbase“ Jeden 2. und 4. Donnerstag monatlich von 18 bis 22 Uhr an Bord der C-base stattfindender Lockpickingworkshop. Anfahrt zur C-Base - U/S-Jannowitzbrücke. Nächster Termin: 13.03.2025 ab 19:00 Uhr.. Übernächster Termin: 27.03.2025 ab 19:00 Uhr. Kontakt: Sportsfreund Roland Lockpicken im Café Olé – in Berlin-Tempelhof oder im M5 in Reinickendorf Jeden 1. Samstag im Monat Nächstes Treffen am 04.04.2025 16:00 - 18:00 im "Rudi und Rosa" (ehem. Café Olé) Kontakt: Sportsfreund Ulrich voraussichtlich einmal monatlich Sonntags ab 1900 Uhr im Vétomaten Wühlischstr. 42, 10245 Berlin-Friedrichshain (S Warschauer Str, Ostkreuz, U5 Frankfurter Tor, Straßenbahn M13, 21) (Inter)nationale Termine – (Inter)national appointments Offen: Links Die Medienlandschaft über die Sportgruppe Berlin und Lockpicking in Berlin & Brandenburg: „Öffnen, nicht knacken“ Die Berliner Stadtzeitung „Scheinschlag“ in Heft 6/06 über den Verein, Inhalte und die Berliner Sperrsportler. „Sportliche Tresorknacker“ in der Berliner Zeitung v. 22.11.2008. „Passionierte Finger an filigranem Besteck“ in der Zeitung „Neues Deutschland“ vom 24.03.2009. „Sudoku für die Finger“ in der „Märkischen Oderzeitung“ vom 01.04.2009. Artikel vom 16.03.2011 über die Berliner Sportgruppe in der „Berliner Morgenpost“. Nur 4 Sekunden Sicherheit vom 2.April 2014 in der „SVZ“. Verein Der Blog des SSDeV Das SSDeV Forum Der Facebook Account des SSDeV Intern: RIP Bernd K. Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Berlin&oldid=8532“ Kategorie: Sportgruppe'
