["https://wiki.ssdev.org/wiki/Account"]
title = "Account – SSDeV"
full_description = "Account Aus SSDeV Zur Navigation springen Zur Suche springen Du möchtest auch etwas zum Wiki beitragen? Oder möchtest die internen Informationen ansehen? - Kein Problem! Wenn du SSDeV-Mitglied bist, wende dich per E-Mail an wiki@ssdev.org. Bitte gib in der E-Mail deinen vollen Namen sowie deine Mitgliedsnummer an, so kann die Anfrage schnell bearbeitet werden. Hinweis: Wer in einer E-Mail mehrere Accounts z.B. für andere aus seiner Sportgruppe beantragt, bitte von jedem eine gültige E-Mail-Adresse mitschicken, diese ist für die Anmeldung erforderlich! Nichtmitglieder erhalten leider keinen Zugang zu internen Informationen! Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Account&oldid=8137“"
