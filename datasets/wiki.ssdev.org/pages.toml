["https://wiki.ssdev.org/wiki/Darmstadt"]
title = "Darmstadt – SSDeV"
full_description = "Darmstadt Aus SSDeV Zur Navigation springen Zur Suche springen Die Sportgruppe Darmstadt trifft sich einmal in Monat an den unten angegebenen Terminen. (Immer ein Mittwoch) Neue Termine 2018 für die Sportgruppe Darmstadt 17. Januar 2018 14. Februar 14. März 18. April 16. Mai 20. Juni Weitere Termine für 2018 folgen... Wir treffen uns um 20 Uhr in der Gaststätte 'Zur Rose' Schwanenstr. 71 64297 Darmstadt- Eberstadt. Wegbeschreibung: Von der Autobahn A5 Abfahrt Eberstadt kommend biegt zunächst links Richtung Darmstadt ab. An der folgenden großen Kreuzung gleich wieder rechts nach Eberstadt rein und an der Shell in Sichtweite gleich wieder links ab. Die Hauptstrasse beschreibt dann eine sehr langzogen S-Kurve und endet in einer T-Kreuzung. Hier biegt man wieder rechts ab und befindet sich nun auf der Heidelbergerlandstrasse, die von Darmstadt nach Eberstadt führt. Ca. 500m weiter biegt man dann an der Volksbank rechts in die Schwanenstrasse ab und ca. 100m weiter auf der rechten Seite befindet sich dann das Lokal. Aber die meisten von uns haben ja eh ein Navi ;-) Links Kontakt per email: ssdev_da Kringel web Pünktchen de Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Darmstadt&oldid=7886“ Kategorie: Sportgruppe"
