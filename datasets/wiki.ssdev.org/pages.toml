full_description = "Bochum Aus SSDeV Zur Navigation springen Zur Suche springen Inhaltsverzeichnis 1 Treffen 1.1 Kontakt 1.2 Ort 1.3 Termine Treffen Die Sportgruppe trifft sich jeden zweiten Mittwoch im Monat im Labor e.V. Bochum um 19:30. Besucher sind herzlich willkommen. Besucher die weder Mitglied des SSDeV noch des Labor e.V. sind werden gebeten sich vorher per Email anzumelden. Kontakt Sportgruppenleiter ist André Matuschek. Email: Bochum@ssdev.org Ort Das Labor e.V. ist ein Hackerspace in Bochum. Der Eintritt ist frei, man muss nicht Mitglied werden. Gekühlte Getränke sind vorhanden. Eine Wegbeschreibung findet sich auf den Webseiten des Labor e.V.: Webbeschreibung Treffpunkt bei Google Maps Termine Die nächsten Termine sind: Jeweils 19:30. Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Bochum&oldid=6899“ Kategorie: Sportgruppe"
