["https://wiki.ssdev.org/wiki/Karlsruhe:Bastelworkshop_I"]
title = "Karlsruhe:Bastelworkshop I – SSDeV"
full_description = "Karlsruhe:Bastelworkshop I Aus SSDeV Zur Navigation springen Zur Suche springen Am Samstag, 06. März 2004 ab 14:00 Uhr findet von den Kalsruher Lockpicking-Leuten ein Bastelworkshop für Spanner und anderes Werkzeug in den Räumen von Entropia e.V. in Karlsruhe statt. Wir werden euch zeigen, wie ihr aus dem verschiedem Material Spanner und anderes bauen könnt. Außerdem haben wir eine Schlüsselfräse (und einige Rohlinge) da, falls ihr z.B. einen zweiten Hausschlüssel braucht. Bitte meldet euch verbindlich per Mail karlsruhe[at]ssdev.org an, damit wir genügend Material für jede/n besorgen können! Bisher angemeldet sind aus Karlsruhe 5, aus der näheren Umgebung 2, aus Nordbaden 2, aus Stuttgart 4, aus Freiburg 2 und aus Wuppertal 2 Personen. Geeignetes Material ist Scheibenwischerblätter Federstahl Es wäre gut, wenn ihr vom Schrottplatz oder von einer Autowerkstatt z.B. ATU noch Wischerblätter besorgen könnt. Federstahl bekommt man beim Modellbau oder bei z.B. Conrad. Wir werden 3 mm Federstahl besorgen, das gegen einen Unkostenbeitrag erworben werden kann. Bitte bringt zum Bearbeiten des Metalls euer eigenes Werkzeug - sofern vorhanden - mit. Wichtig sind: Metallfeilen Zangen Schraubstock Schutzbrille (ansonsten kommt ihr nicht an die Maschinen) Außerdem sinnvoll sind: Bunsenbrenner Campingkocher Dremel feines Schleifpapier Schrumpfschlauch Wir werden etwas Werkzeug mitbringen, dass ihr auch leihen könnt. Allerdings ist eigenes Werkzeug von Vorteil. Eine Einführung findet Ihr im Anhang A des MIT - Handbuch zur Schlossöffnung. Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Karlsruhe:Bastelworkshop_I&oldid=1962“ Kategorie: Sportgruppe"
