["https://wiki.ssdev.org/wiki/Lockpicknick_S%C3%BCd"]
title = "Lockpicknick Süd – SSDeV"
full_description = "Lockpicknick Süd Aus SSDeV Zur Navigation springen Zur Suche springen Das Lockpicknick der süddeutschen Sportgruppen findet traditioneller Weise an einem Samstag ab 14:00 Uhr im August am Breitenauer See bei Löwenstein, in der Nähe von Heilbronn, statt. Es wird gepickt, gefachsimpelt, erzählt, gegrillt, gegessen, getrunken, gesonnt, geschwommen, gespielt, ... Dieses Jahr treffen wir uns am ... 2013. (steht noch nicht fest) Es besteht auch die Möglichkeit (nach vorheriger Anmeldung) zum Unterwasser-Lockpicking. Damit genug Grillgut und Trinken für alle da ist, meldet euch bitte an. Salate und Desserts werden von allen gerne gesehen und verspeist ;-) daher freuen sich auch alle über etwaige Spenden. Nicht-SSDeV-Mitglieder bringen bitte mindestens einen Salat mit. Teller, Besteck und Trinkgefäße bitte selbst mitbringen (ggf. auch Stühle und Tische)! Anfahrt Zum Breitenauer See kommt man über die Autobahn A 81 Ausfahrt Weinsberg, Richtung Ellhofen, dann auf der B 39 bis zum Campingplatz Breitenauer See. Lage Wir befinden uns ca. E 09° 22,82 N 49° 07,26 Und nun drehen wir den See um 90° ;-) Kontakt stuttgart@ssdev.org Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Lockpicknick_Süd&oldid=6607“ Kategorie: Sportgruppe"
