["https://wiki.ssdev.org/wiki/Karlsruhe:Bastelworkshop_II"]
title = "Karlsruhe:Bastelworkshop II – SSDeV"
full_description = "Karlsruhe:Bastelworkshop II Aus SSDeV Zur Navigation springen Zur Suche springen Am Samstag, 05. Februar 2005 findet von den Karlsruher Lockpicking-Leuten wieder ein Bastelworkshop in den Räumen von Entropia e.V. in Karlsruhe statt. Der Workshop beginnt um 11:00 Uhr und geht bis ... mal schauen ;) Geplant sind derzeit Spannerbau - Picksbauen - Tubularöffnung - (Schlag-)Schlüsselfräsen - Türöffnung - etc. Bitte meldet euch verbindlich per Mail karlsruhe[at]ssdev.org an, damit wir genügend Material für jede/n besorgen können, das gegen einen geringen Unkostenbeitrag erstanden werden kann! Bisher angemeldet sind aus Karlsruhe 9, aus der Umgebung 2, aus Nordbaden 2, aus Ditzingen 1, aus Stuttgart 9+, aus Freiburg 1 und aus der Schweiz 2 Person/en. Kurzfristige Unterstützung bei den Workshops ist natürlich immer willkommen :) Für die Leute von weiter weg, können wir auch eine Übernachtungsmöglichkeit bei Voranmeldung anbieten. Ausserdem ist Karlsruhe super mit dem Zug angebunden ... Eine Wegbeschreibung findet ihr unter Anfahrt. Vorsicht: Die Parkplätze rundrum sind für Anwohner(innen) oder kostenpflichtig. Inhaltsverzeichnis 1 Geeignetes Material 1.1 für Spanner 1.2 für Picks 1.3 für Tubularöffnung 2 Werkzeug 3 Link Geeignetes Material für Spanner Scheibenwischerblätter (vom Schrottplatz oder einer Autowerkstatt) Federstahl (beim Modellbau oder bei z.B. Conrad) für Picks breite Scheibenwischerblätter (z.B. von ausrangierten Lastwagen) Federstahl Plastikstiftminen Alurohre Schrumpfschlauch für Tubularöffnung Pappe z.B. von einer Klopapierrolle oder Verpackungsmaterial Klebeband, Gaffa-Tape Plastikstiftminen Werkzeug Bitte bringt zum Bearbeiten des Metalls euer eigenes Werkzeug - sofern vorhanden - mit. Wichtig sind: Metallfeilen Zangen Schraubstock Schutzbrille (ansonsten kommt ihr nicht an die Maschinen) Außerdem sinnvoll sind: Bunsenbrenner Campingkocher Dremel feines Schleifpapier Wir werden etwas Werkzeug mitbringen, dass ihr auch leihen könnt. Allerdings ist eigenes Werkzeug von Vorteil. Link Eine Einführung zum Spannerbasteln findet Ihr im Anhang A des MIT - Handbuch zur Schlossöffnung. Informationen zum Picks- und Spanner-Basteln von Pickeon Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Karlsruhe:Bastelworkshop_II&oldid=1963“ Kategorie: Sportgruppe"
