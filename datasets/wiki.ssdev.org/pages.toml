["https://wiki.ssdev.org"]
title = "SSDeV"
full_description = "Hauptseite Aus SSDeV Zur Navigation springen Zur Suche springen Wissens-Wiki der Sportsfreunde der Sperrtechnik Deutschland e.V. Der Zweck des Vereins ist die Pflege der Sperrtechnik als sportliche Herausforderung. Unter dem Begriff Sperrtechnik verstehen wir sämtliche Verfahren und Kenntnisse, welche mittels mechanischer und/oder elektronischer Maßnahmen (Schlösser, Schließsysteme und andere Sicherheitstechnologie) den Zugang beschränken. Desweiteren strebt der Verein einen Informationsaustausch an, dieser soll unter anderem mit unserem Wissens-Wiki verwirklicht werden. Sportgruppen Berlin, Darmstadt, Bochum, Frankfurt, Hamburg, Heilbronn, Karlsruhe, Köln, Moers, München, Nordbaden, Nürnberg, Stuttgart, Ulm, Sportgruppe Unterwasser, Lockpicknick Berlin-Tegel, Lockpicknick der süddeutschen Sportgruppen Links SSDeV-Homepage SSDeV-Blog Koksa-Forum SSDeV-Forum bei Koksa Einen Account für das Wiki bekommen. Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Hauptseite&oldid=8144“"
