["https://wiki.ssdev.org/wiki/Karlsruhe:Projekte"]
title = "Karlsruhe:Projekte – SSDeV"
full_description = '''Karlsruhe:Projekte Aus SSDeV Zur Navigation springen Zur Suche springen Aktionen der Sportgruppe Karlsruhe oder von Leuten der Sportgruppe Auf der GPN13 von Donnerstag 30. Mai 18:00 bis Sonntag 02. Juni 2013 15:00 Uhr an der HfG Karlsruhe haben Clemens und Loubna die Sportgruppe Karlsruhe nun ganz in die Haende von Jan und Tobias gegeben. :) Der Anfänger/innen-Workshop war wie immer gut besucht und auch zwischendurch gab es viele Lockpicking-Interessierte an den Tischen. (Zum SSDeV-Blogeintrag) Puenktlich zum Lockpicknick am Breitenauer See am Samstag, 11. August 2012 wurde es wieder Sommer :) so dass Tobias, Clemens & Loubna mit Vincent bei schoenstem Wetter gemuetlich fachsimpeln, grillen, picken, baden, ratschen, futtern, ... konnten. Ein weiterer Lockpicking-Anfänger/innen Workshop fand am Freitag, 29. Juni 2012 ab 17:00 Uhr von Loubna & Clemens mit der Fachschaft Mathe/Inf des KIT (früher Uni Karlsruhe) statt. Trotz schwueler Hitze fanden sich ca. 30 interessierte Studierende ein. :) (Zum SSDeV-Blogeintrag) Auch auf der diesjährigen GPN12 von Donnerstag, 07. (Fronleichnam) 18:00 Uhr bis So. 10. Juni 2012 15:00 Uhr an der HfG Karlsruhe waren wir (die Karlsruher Sportgruppe) wieder mit einem erfolgreichen Lockpicking-Tisch und zwei Einführungsvorträgen, um Anfänger/innen zu schulen, vertreten. :) Der Tisch war dauerhaft besetzt und wir hoffen auf interessierten Zuspruch im Verein und den Sportgruppen. (Zum SSDeV-Blogeintrag) Loubna & Clemens haben sich vom Freitag, 02. bis Montag, 05. März 2012 zum Frühjahres-Trainingslager mit außerordentlicher Mitgliederversammlung nach Kerpen und zum Impressionswettkampf 2012 auf der Hausmesse der Firma WENDT in Bergheim gemacht. Beides waren sehr produktive Veranstaltungen :) Vom Freitag, 21. bis Sonntag, 23. Oktober 2011 fand die LockCon in Sneek, Niederlande statt, was sich Clemens & Loubna nicht entgehen liessen. :) Leider war Karlsruhe dieses Jahr auf der 15. Deutsche Meisterschaft im Schlossöffnen vom Freitag, 30. September bis Montag, 3. Oktober 2011 in Chemnitz nicht vertreten :(. Bei herrlichem Wetter lockte es die Karlsruher Sportgruppe mit Jan, Uwe, Tobias, Clemens, Loubna & Vincent am Samstag, 20. August 2011 zum Seelockpicknick an den Breitenauer See :) Wir waren zum 10jaehrigen Bestehen der Sportgruppe Karlsruhe natürlich wieder auf der GPN11 an der HfG in Karlsruhe vom Do. 23. bis Sa. 25.06.2011, am Samstag Nachmittag mit dem obligatorischen Anfänger/innen-Workshop. Unsere Tische war die ganze Zeit gemütlich besetzt. :) Peter schreibt: Lockpicking Dank geht an meine Meisterin Loubna! +1+1+1+1+1+1+1+1, anomym schreibt: Stand war super und hadez schreibt: auf jeden fall, lockpicking hat super spass gemacht und hab wieder einiges dazugelernt :) Von Freitag, 08. bis Sonntag, 10. Oktober 2010 nahmen Clemens & Loubna und Per an der LockCon mit vielen lohnenswerten Vorträgen und den DutchOpen in Sneek, NL teil. :) Wieder qualifizierten sich Jan (1. Platz B-Finale Handöffnung + 10. Platz Finale Hangöffnung) und Uwe (7. Platz Finale Handöffnung + 4. Platz Finale Hangöffnung) bei den diesmal 14. Deutsche Meisterschaft im Schlossöffnen :) von Samstag, 25. und Sonntag, 26. September 2010 in Mainfrankensäle Veitshöchheim nähe Würzburg - gemeinsam mit dem Treffen der 160 Schlosssammler des 9th European Lockcollectors Meeting. Gratulation! Es ist Sommer und heiß! Es sind viele Leute auf die Idee gekommen am Samstag, 10. Juli 2010 zum Breitenauer See zu pilgern, nichts desto trotz haben wir uns zum Seelockpicknick getroffen. :) Aus Karlsruhe kamen Jan, Uwe, Tobias, Clemens, Loubna und Vincent. Letzterer probte sich schon im Schlossöffnen (naja eher schließen ;)) und Frisbee werfen. Auf der GPN10 in Karlsruhe an der HfG hat sich wieder eine große Runde für den Lockpicking-Anfaenger/innen-Workshop interessiert. Nach einem Vortrag am Freitag, 11. Juni 2010, abends von Loubna durfte das frisch erworbene Wissen im Anschluss und am Samstag, 12. Juni 2010, an den Schlössern mit Hilfe von Jan, Tobias, Uwe und Clemens ausprobiert werden. Unsere Tische waren durchweg bis spät in die Nacht voll besetzt. Auch die Entropianer waren erstaunt über den Andrang. :) Die 13. Deutsche Meisterschaft im Schlossöffnen fanden dieses Jahr vom Samstag, 31. Oktober und Sonntag, 01. November 2009 in Köln (im Naturfreundehaus Köln-Ost statt. Jan, Uwe und Tobias haben Karlsruhe gebührend vertreten :) Jan sogar mit einer Platzierung (10. Platz) in der Hangöffnung. Gratuliere! Jan, Uwe, Tobias, Loubna, Clemens und Vincent reisten am Samstag, 11. Juli 2009 zum Seelock-Picking an den Breitenauer See. Das Wetter war verhalten, aber es blieb trocken, so dass wieder mal ein reger Austausch zwischen den süddeutschen Sportgruppen stattfand. :) Wie jedes Jahr traditionsgemäß wird auf der GPN gepickt - schließlich ist die Sportgruppe Karlsruhe auf der GPN 1 entstanden. :) So haben Loubna, Clemens, Tobias, Uta, Uwe und Jan auch dieses Jahr auf der GPN8 am Fr. 26.06.2009 um 20:15 Uhr und am Sa. 27.06.2009 um 16:30 Uhr an der HfG Karlsruhe einen Lockpicking-Anfänger/innen-Workshop erfolgreich durchgeführt. Unser Tisch war durchweg besetzt und auch GPNler/innen, die in den Jahren zuvor den Vortrag angehoert haben, kamen zum gemütlichen Picken und Schwatzen vorbei. Samstag, 06. Juni 2009 sind Clemens, Loubna und Vincent zum SPASS-Workshop nach Littau in die Schweiz gefahren. Clemens konnte sich immerhin mit dem 4. Platz unter 6 Leute, die die Eigenöffnung geschafft haben, qualifizieren. Der 1. und 5. Platz gingen nach Stuttgart, der 3. und 6. blieben in der Schweiz. Vincent hat seinen Vater gut angefeuert :) und applaudierte bei der Preisverleihung kräftig mit ;) Leider konnte uns dieses Jahr niemand auf der SSDeV-Mitgliederversammlung am Fr. 29. Mai 2009 vertreten. Auch die anschliessenden interessanten Voträge und Workshops haben wir verpasst. :( Am 27. Mai 2009 hat uns ein Redakteur der Rheinpfalz besucht. Er hat immerhin ein Schloss aufbekommen :) Wir sind gespannt auf den Artikel. Bei der 12. Deutschen Meisterschaft im Schlossöffnen am 22. und 23. November 2008 in Berlin Tegel sind für Karlsruhe Uwe, Jan und Tobias angetreten. Diesmal hat sich Uwe im Finale Handöffnung (9. Platz), Hangöffnung (9. Platz) und Freestyle (11. Platz) qualifiziert :) Gratuliere! Dieses Jahr sind vom 9. bis 12. Oktober 2008 Per, Jan, Loubna, Clemens und Vincent auf die LockCon mit den DUTCH OPEN im Impressionieren, Picking und Dialing von TOOOL in SNEEK, NL gefahren. Wie immer war es der Austausch, die tollen Workshop, die schoene Lage und vieles mehr wert :) Das Seelock-Picking am Breitenauer See am Samstag, 26.07.2008, ist fuer Loubna, Clemens und Vincent leider in's Wasser gefallen. Jan und Uwe kamen erst nach dem Regen. :) Geplant war ein Workshop auf der GPN7 im AKK, Uni Karlsruhe am Samstag, 05.07.2008, nachmittags ... Als Jan und Loubna Freitagabend zum Location anschauen und Fahne aufhaengen vorbeikamen, waren unsere Tische in Null-Komma-Nix voll besetzt und es hiess: "Wie geht denn das?" - Kurzerhand haben wir beschlossen schon am Freitagabend einen Anfaenger/innen-Vortrag mit anschliessendem freien Ueben zu veranstalten. Am Samstag ging es dann mit Jan und Clemens um 14:00 Uhr weiter. Auch der zweite Vortrag von Loubna war vollbesetzt und es tummelten sich viele Begeisterte bei uns. So dass selbst die Veranstalter (Entropia e.V.) meinten, dass die meisten Leute bei den Lockpickern seien. :) Fuer uns war die GPN7 dieses Jahr ein voller Erfolg! Da Loubna und Clemens am Freitag, 23. November 2007 im Kreissaal waren, um ihren Sohn Vincent zu bekommen :), sind Jan und Uwe mit Per auf die Dutch Open in SNEEK (NL) gefahren und haben am Samstag, 24. November 2007 an den Wettkämpfe im Handpicking und Impressionstechnik teilgenommen. Am Sa. 27. und So. 28.10.2007 fanden die 11. Deutsche Meisterschaft im Schlossöffnen, im Waldheim Altenberg in Stuttgart-Süd statt. Aus Karlsruhe haben Jan, Uwe und Gerd teilgenommen, wobei sich Jan sogar für's Finale in der Hangöffnung (9. Platz) und in der Handöffnung (13. Platz) qualifiziert hat :) Gratuliere! Endlich haben wir mal wieder einen Bastelworkshop am Samstag, 25. August 2007 ab 14:00 Uhr in Karlsruhe durchgeführt. :) Gebastelt wurden Picks, Spanner, Schlagwerkzeuge, ausserdem Schluessel gefraest und gefeilt und vieles mehr von drei Leuten aus Stuttgart, sechs aus Karlsruhe und einer aus der Umgebung. Samstag, 04. August ab 14 Uhr Lockpicknick am Breitenauer See, nähe Heilbronn mit Jan und Uwe aus Karlsruhe :). am Freitag, 01. abend und Samstag 02. Juni 2007 wurden auf der GPN6 an der HS(exFH) Karlsruhe verschiedene Lockpicking-Demonstrationen gezeigt und ein Anfänger/innen-Workshop inklusive Vortrag (Loubna, Clemens, Gerd, Jan) durchgeführt. Es wurde richtig gemütlich :) und wir konnten sogar den ersten Zulauf in die Karlsruheer Sportgruppe verzeichnen. Am Samstag, 24. März 2007 und am Samstag, 02. Dezember 2006 sind Clemens und Loubna in die Schweiz zum Workshop von SPASS nach Littau (CH) gefahren und haben auch einige Kaba geöffnet. Es macht immer Spass :-) Nach den deutschen Meisterschaften haben wir (Gerhard, Uwe, Clemens & Loubna aus Karlsruhe und Per, Nordbaden) am Samstag, 11. November 2006 an den Dutch-Open 2006 in SNEEK (NL) teilgenommen. Drumherum vom Fr. 10. - So. 12. November 2006 gab es wieder sehr interessante Workshops :-) wie "New US lock security" Marc Tobias, Chubb Manifoil Mike vd Stelt, Keys to heaven - STASI tools (Arthur Meister), Combolock manipulation Eric Schmiedl / Paul Crouwel, The TOC Principle, mix between Abloy and S&G, John Loughlin / Han Fey Socialize and natürlich einen Austausch zwischen den Lockpicker(inne)n. Aus der Sportgruppe Karlsruhe sind Uwe und Clemens, aus Nordbaden Per bei den 10. Deutsche Meisterschaft im Schlossöffnen am Samstag, 14. (Vorkämpfe) und Sonntag, 15. (Finalkämpfe) Oktober 2006 in Velbert in den Disziplinen Hangöffnung und Handöffnung angetreten :-) Jan hat zugeschaut, Loubna hat sich um die Besucher/innen und die Presse gekümmert und Clemens hat zusätzlich noch Denis Auswertungsprogramm betreut. Jan (Karlsruhe) ist nicht nur dem Verein beigetreten, sondern kam auch gleich eine Woche später vom Freitag, 01. bis Sonntag, 03. September mit Clemens und Loubna (Karlsruhe), Per (Nordbaden) und Stefan (Stuttgart) mit zum SSDeV-Herbst-Trainigslager in Köln und war ganz begeistert. :-) Dort wurde neben den Wettkampfbesprechungen, dem Workshop Impressionstechnik von Manfred und Oli, den Impressionstechnik-Meisterschaften, vereinzelten Besuchen bei DOM, einem Besuch des Wettkampfschauplatzes in Velbert und natürlich viel fachlischem Austausch auch unser Wissens-Wiki und unsere Bilder-Galerie vorgestellt. Gemütlich auf der Picknickdecke fachsimplen, zwischendurch eine Erfrischung am See oder vom Eisstand, leckeres Essen vom Grill und aus der Salatschüssel - das geht nur beim Lockpicknick am Breitenauer See, wohin Clemens und Loubna am Samstag, 15. Juli 2006 gefahren sind. Außerdem waren noch einige aus Darmstadt, Mainz, Stuttgart, Heilbronn und der weiteren Umgebung da :) Auf der GPN5 an der HS(exFH) Karlsruhe wurden am Samstag, 10. Juni 2006 und Sonntag, 10. Juni 2006 verschiedene Lockpicking-Demonstrationen, Anfänger/innen-Schulungen und zwei Vorträge von Karlsruher (Loubna, Clemens, Gerd) und Stuttgarter Lockpicker/innen (Gerhard, Dieter, Stefan) durchgeführt. Es gab einen stetigen Besucher/innen-Andrang :) und sogar einen außergewöhnlichen Gast. Am Samstag, 13. Mai 2006 war in der Schweiz ein Workshop von SpaSS. Leider waren wir kurzfristig verhindert, sonst hätten wir gerne teilgenommen. Per, Clemens und Loubna sind von Freitag, 03. - Montag, 06. März 2006 auf's SSDeV-Frühjahrstrainingslager nach Köln gefahren. Das Vortragsprogramm mit Safe & Tresor von Heinz Pickshaus, ABLOY PROTEC von Han Fey, Schlagschlüssel von Klaus Noch und der fachliche Austausch zwischendurch war sehr interessant :) Am Sonntag sind wir auf die Practical World und die Hausmesse der Firma WENDT. Als Ausklang vom Jahr 2005 haben wir in der Sportgruppe Karlsruhe am Donnerstag, 08. Dezember 2005 einen kleinen Übungswettkampf veranstaltet. Leider ist keine/r von uns zu den Deutsche Meisterschaften 2005 nach Hamburg gereist. Aber die Teilnahme an den Deutschen Meisterschaften 2006 sind ein guter Vorsatz für's neue Jahr :) Am Freitag 25. November 2005 machten sich Clemens, Loubna, Gerd und Uwe aus Karlsruhe mit Julian (Stuttgart) und Per (Nordbaden) durch ein Schneechaos auf, um am Workshop-Wochenende von TOOOL in Sneek, NL teilzunehmen. Bis Sonntag, 27. November 2005 beschäftigten wir uns mit Schlagschlüsseln, Tresoröffnung und dem regen Erfahrungsaustausch. Es fand auch ein kleiner Übungswettkampf in Blitzöffnung statt, so dass auch das Picken nicht zu kurz kam. :) Am Samstag, 05. November 2005 hat in der Schweiz bei SPASS ein Workshop von Bartschlösser, Zylinder- und Hangschlösser öffnen mit Dietrich, Handpicks, Elektropick und Schlagschlüssel bis hin zu Spannerbasteln stattgefunden. Clemens und Loubna sind hingefahren. Es hat SPASS gemacht :) Von Freitag, 09. bis Sonntag 11. September 2005 sind Per, Sascha, Gerhard, Clemens und Loubna auf das SSD e.V.-Herbst-Trainingslager in Köln-Kalk gefahren. Neben dem Austausch mit anderen Sportsfreund(inn)en bestand das interessante Programm aus "Safe & Tresor" von Heinz Pickshaus, "Schlagschlüssel" von Klaus Noch und Han Fey und "Kriminaltechnische Untersuchungsmöglichkeiten von Werkzeugspuren" von Manfred Göth. Außerdem fand der Wettkampf Imressionstechnik mit vier Öffnungen (Oli, HH, Julian, S, Manfred, HH, Gerhard, S) statt. :) Und wieder gibt es mehr begeisterte Lockpicker/innen :), besonders einige Hamburgerinnen, durch die Anfänger/innen-Workshops in Bremen am Sonntag, 04.09.2005 ab 14:00 Uhr (nur für Frauen) und am Mittwoch, 07.09.2005 ab 19:00 Uhr (für alle). Leider sind es immer noch nicht genügend Bremer/innen, so dass sich noch keine Bremer Sportgruppe gebildet hat. Interessierte können sich gerne melden. Am Samstag, 23. Juli 2005 ab ca. 14 Uhr haben sich die süddeutschen Sportgruppen zum Lockpicknick am Breitenauer See getroffen. Aus Karlsruhe waren Clemens, Loubna, Sascha und Katja dabei. :) Alle 30 Lockpicker/innen hatten klasse Wetter mitgebracht. Im Alter von 3 bis 45 Jahren, hatte jede/r Spaß am Treffen, anwesend waren sowohl Anfänger/innen als auch Meister. Beim geselligen Miteinander bei Essen und Trinken spielte die "Rangfolge" sowieso keine Rolle mehr. Loubna hatte das neue Vereinsshirt dabei, in grellem gelb, echt stark. In kleineren Gruppen hatten wir verschiede Workshops die lose über den Tag verteilt wurden. Es wurde alles angeboten: von der Schulung für Anfänger/innen, Erfahrungsaustausch über Drehscheibenschlösser sowie das Öffnen von Clubbschlösser mit Hilfe einer Nadel. Für jede/n war etwas dabei. In diesem Sinne freuen wir uns schon auf das nächste Jahr. (Gerhard) Am Mittwoch, 25. Mai hatten Clemens und Loubna eine Einladung zum Grillen nach Ditzingen. :) Bernd (Sportgruppenleiter Ditzingen/Ludwigsburg)'''
