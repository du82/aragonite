["https://wiki.ssdev.org/wiki/Lockpicknick_Berlin"]
title = "Lockpicknick Berlin – SSDeV"
full_description = 'Lockpicknick Berlin Aus SSDeV Zur Navigation springen Zur Suche springen Serviervorschlag Nachdem wir unser letztes Lockpicknick am 18.05.23 nach zwei Jahren Pause aufgrund der "Covid-19-bedingten Massnahmen" wieder abhalten durften, findet nun das inzwischen 21. Lockpicknick am Donnerstag, dem 09.05.24 ab 15:23h - wieder an Bord der c-base direkt am Ufer der Spree statt. Wir laden alle Lockpicker, Member der Cbase und "Sympathisanten" herzlich ein, mit uns zu grillen, fachsimpeln und das eine oder andere Schloß zu decodieren. Es wird auch mehr als einen Anfängerworkshop geben.. Näheres in Kürze hier an dieser Stelle... Kontakt Sportgruppe Berlin @SSDeV_SG_Berlin Jascha Roland Galerie Lockpicknick am 21.05.2009 Lockpicknick am 13.05.2010 Lockpicknick am 02.06.2011 Lockpicknick am 17.05.2012 Lockpicknick am 09.05.2013 Lockpicknick am 29.05.2014 Lockpicknick am 14.05.2015 Abgerufen von „https://wiki.ssdev.org/w/index.php?title=Lockpicknick_Berlin&oldid=8446“ Kategorie: Sportgruppe'
