title = "HelpContents - Ubuntu Wiki"
full_description = "HelpContents Ubuntu Wiki Welcome to the Ubuntu wiki! The wiki is open to all to edit, except for spammers. To mitigate this problem, there are a few simple requirements to become an editor: Create a Launchpad account Join the ubuntu-wiki-editors team on Launchpad Login to the wiki and when you do, make sure the checkbox showing your ubuntu-wiki-editors membership is checked Edit freely! MoinMoin We use MoinMoin software to run our wiki at present. If you would like a quick overview of MoinMoin's syntax, have a look at HelpOnMoinWikiSyntax. If you are looking for something for a presentation, look at WikiCourse. HelpForUsers - is help for users who are new to a MoinMoin wiki. HelpOnAdministration - how to configure and maintain a MoinMoin wiki HelpIndex - is a list of all available help pages. Fulltext search is available on FindPage. If you find any errors on the help pages, please describe them on HelpErrata. Please do not edit or create help pages in other wikis than MoinMaster (see HelpContents), because the pages from MoinMaster will overwrite any other changes on wiki engine upgrades. Please follow the established structure of help pages if you want to change pages in MoinMaster. Before doing any major or widespread changes please discuss that on the mailing list or MoinMoin wiki. HelpContents (last edited 2016-08-12 20:02:54 by wxl) Ubuntu Wiki Welcome to the Ubuntu wiki! The wiki is open to all to edit, except for spammers. To mitigate this problem, there are a few simple requirements to become an editor: Create a Launchpad account Join the ubuntu-wiki-editors team on Launchpad Login to the wiki and when you do, make sure the checkbox showing your ubuntu-wiki-editors membership is checked Edit freely! MoinMoin We use MoinMoin software to run our wiki at present. If you would like a quick overview of MoinMoin's syntax, have a look at HelpOnMoinWikiSyntax. If you are looking for something for a presentation, look at WikiCourse. HelpForUsers - is help for users who are new to a MoinMoin wiki. HelpOnAdministration - how to configure and maintain a MoinMoin wiki HelpIndex - is a list of all available help pages. Fulltext search is available on FindPage. If you find any errors on the help pages, please describe them on HelpErrata. Please do not edit or create help pages in other wikis than MoinMaster (see HelpContents), because the pages from MoinMaster will overwrite any other changes on wiki engine upgrades. Please follow the established structure of help pages if you want to change pages in MoinMaster. Before doing any major or widespread changes please discuss that on the mailing list or MoinMoin wiki."
