["https://wiki.ubuntu.com/FocalFossa/ReleaseNotes"]
title = "FocalFossa/ReleaseNotes - Ubuntu Wiki"
full_description = '''ReleaseNotes Table of Contents Contents Introduction Support lifespan Official flavor release notes Get Ubuntu 20.04.6 LTS Download Ubuntu 20.04.6 LTS Upgrading from Ubuntu 18.04 LTS or 19.10 Upgrades on i386 New Features in 20.04 LTS RISC-V image Updated Packages Linux Kernel Toolchain Upgrades 🛠️ Ubuntu Desktop Network configuration Storage/File Systems ZFS 0.8.3 Other base system changes since 18.04 LTS Python3 by default Snap Store Ubuntu Server Installer QEMU libvirt dpdk Open vSwitch Chrony cloud-init PHP 7.4 Ruby 2.7 Ruby on Rails 5.2.3 Ubuntu HA/Clustering isc-kea 1.6 stable track Bind 9.16 OpenSSH updates with U2F Support HAProxy 2.0 Apache, TLSv1.3, client cert auth Samba 4.11 PostgreSQL 12 nginx Squid 4.x s390x OpenStack Ussuri Ceph Cloud Images ☁ Amazon Web Services (AWS) Google Compute Engine Microsoft Azure Vagrant Raspberry Pi Known issues Installer and live session Distribution Upgrades Desktop Raspberry Pi RISC-V Server General Official flavours More information Reporting bugs Participate in Ubuntu More about Ubuntu Introduction These release notes for Ubuntu 20.04 LTS (Focal Fossa) provide an overview of the release and document the known issues with Ubuntu 20.04 LTS and its flavors. For details of the changes applied since 20.04, please see the 20.04.6 change summary. The release notes for 20.04, 20.04.1, 20.04.2, 20.04.3, 20.04.4 and 20.04.5 change summary are available as well. Support lifespan Maintenance updates will be provided for 5 years until April 2025 for Ubuntu Desktop, Ubuntu Server, Ubuntu Cloud, and Ubuntu Core. All the remaining flavours will be supported for 3 years. Additional security support is available with ESM (Extended Security Maintenance). Official flavor release notes Find the links to release notes for official flavors here. Get Ubuntu 20.04.6 LTS Download Ubuntu 20.04.6 LTS Images can be downloaded from a location near you. You can download ISOs and flashable images from: https://releases.ubuntu.com/20.04/ (Ubuntu Desktop and Server for AMD64) http://cdimage.ubuntu.com/ubuntu/releases/20.04/release/ (Less Frequently Downloaded Ubuntu Images) http://cloud-images.ubuntu.com/daily/server/focal/current/ (Ubuntu Cloud Images) http://cdimage.ubuntu.com/kubuntu/releases/20.04/release/ (Kubuntu) http://cdimage.ubuntu.com/lubuntu/releases/20.04/release/ (Lubuntu) http://cdimage.ubuntu.com/ubuntu-budgie/releases/20.04/release/ (Ubuntu Budgie) http://cdimage.ubuntu.com/ubuntukylin/releases/20.04/release/ (Ubuntu Kylin) https://ubuntu-mate.org/download/ (Ubuntu MATE) http://cdimage.ubuntu.com/ubuntustudio/releases/20.04/release/ (Ubuntu Studio) http://cdimage.ubuntu.com/xubuntu/releases/20.04/release/ (Xubuntu) Upgrading from Ubuntu 18.04 LTS or 19.10 You can upgrade to Ubuntu 20.04 LTS from either Ubuntu 18.04 LTS or Ubuntu 19.10. Ensure that you have all updates installed for your current version of Ubuntu before you upgrade. Confirm that you also have a network connectivity to one of the official mirrors or to a locally accessible mirror as there are no offline upgrade options. To upgrade on a desktop system: Open the "Software & Updates" Setting in System Settings. Select the 3rd Tab called "Updates". Set the "Notify me of a new Ubuntu version" drop down menu to "For any new version" if you are using 19.10; set it to "For long-term support versions" if you are using 18.04 LTS. Press Alt+F2 and type update-manager -c into the command box if you are using 19.10; type update-manager -c -d if you are using 18.04 LTS. Update Manager should open up and tell you that Ubuntu 20.04 LTS is now available. Click Upgrade and follow the on-screen instructions. To upgrade on a server system: Install update-manager-core if it is not already installed. Make sure the Prompt line in /etc/update-manager/release-upgrades is set to 'normal' if you are using 19.10, or 'lts' if you are using 18.04 LTS. Launch the upgrade tool with the command sudo do-release-upgrade on 19.10; use sudo do-release-upgrade -d if you are using 18.04 LTS. Follow the on-screen instructions. Note that the server upgrade will use GNU screen and automatically re-attach in case of dropped connection problems. The -d switch is necessary to upgrade from Ubuntu 18.04 LTS as upgrades have not yet been enabled and will only be enabled after the first point release of 20.04 LTS. Upgrades on i386 Users of the i386 architecture will not be presented with an upgrade to Ubuntu 20.04 LTS. Support for i386 as a host architecture was dropped in 19.10. New Features in 20.04 LTS RISC-V image RISC-V images for SiFive HiFive Unleashed and Unmatched boards are now available, which can also be used as a VM with QEMU on any Ubuntu 20.04 machine. For more details see RISC-V page. Updated Packages As with every Ubuntu release, Ubuntu 20.04 LTS comes with a selection of the latest and greatest software developed by the free software community. Linux Kernel Ubuntu 20.04 LTS is based on the long-term supported Linux release series 5.4. HWE stack updated to Linux release series 5.8. NOTE: Users who installed from Ubuntu Desktop media should see the note about desktop tracking the rolling hardware enablement kernel series by default here. Notable features and enhancements in 5.4 since 5.3 include: Support for new hardware including Intel Comet Lake CPUs and initial Tiger Lake platforms, AMD Navi 12 and 14 GPUs, Arcturus and Renoir APUs along with Navi 12 + Arcturus power features. Support has been added for the exFAT filesystem, virtio-fs for sharing filesystems with virtualized guests and fs-verity for detecting file modifications. Built in support for the WireGuard VPN. Enablement of lockdown in integrity mode. Other notable kernel updates to 5.4 since version 4.15 released in 18.04 LTS include: Support for AMD Rome CPUs, Radeon RX Vega M and Navi GPUs, Intel Cannon Lake platforms. Support for raspberry pi (Pi 2B, Pi 3B, Pi 3A+, Pi 3B+, CM3, CM3+, Pi 4B) Significant power-saving improvements. Numerous USB 3.2 and Type-C improvements. A new mount API, the io_uring interface, KVM support for AMD Secure Encrypted Virtualization and pidfd support. Boot speed improvements through changing the default kernel compression algorithm to lz4 (in Ubuntu 19.10) on most architectures, and changing the default initramfs compression algorithm to lz4 on all architectures. Toolchain Upgrades 🛠️ Ubuntu 20.04 LTS comes with refreshed state-of-the-art toolchain including new upstream releases of glibc 2.31, ☕ OpenJDK 11, rustc 1.41, GCC 9.3, 🐍 Python 3.8.2, 💎 ruby 2.7.0, php 7.4, 🐪 perl 5.30, golang 1.13. Ubuntu Desktop Ubuntu Desktop flavour now always tracks HWE (hardware enablement) kernel. It means that from January 2021 the Ubuntu Desktop will gain new major kernel versions every 6 months through to summer of 2022, even if you installed Ubuntu Desktop earlier than this. Read more about it on the Ubuntu discourse thread Improvements for hardware support in Ubuntu Desktop installation media. New graphical boot splash (integrates with the system BIOS logo). Refreshed Yaru theme 🎨 Light/Dark theme switching GNOME 3.36 New lock screen design. New system menu design. New app folder design. Smoother performance, lower CPU usage for window and overview animations, JavaScript execution, mouse movement and window movement (which also has lower latency now). 10-bit deep colour support. X11 fractional scaling. Mesa 20.0 OpenGL stack BlueZ 5.53 PulseAudio 14.0 (prerelease) Firefox 75.0 Thunderbird 68.7.0 LibreOffice 6.4 Network configuration With this Ubuntu release, netplan.io has grown multiple new features, some of which are: Basic support for configuring SR-IOV network devices. Starting with netplan.io 0.99, users can declare Virtual Functions for every SR-IOV Physical Function, configure those as any other networking device and set hardware VLAN VF filtering on them. Support for GSM modems via the NetworkManager backend via the modems section. Adding WiFi flags for bssid/band/channel settings. Adding ability to set ipv6-address-generation for the NetworkManager backend and emit-lldp for networkd. Storage/File Systems ZFS 0.8.3 Continuing with what started in the Eoan release, Ubuntu Focal ships zfs 0.8.3. Compared to what was available in the previous LTS release, zfs 0.8 brings many new features. Highlights include: Native Encryption (with hardware acceleration enabled in Focal) Device removal Pool TRIM Sequential scrub and resilver (performance) Upstream 0.8.0 release notes: https://github.com/openzfs/zfs/releases/tag/zfs-0.8.0 Also checkout 0.8.1, 0.8.2 and 0.8.3 for more details. Other base system changes since 18.04 LTS Python3 by default In 20.04 LTS, the python included in the base system is Python 3.8. Python 2.7 has been moved to universe and is not included by default in any new installs. Remaining packages in Ubuntu which require Python 2.7 have been updated to use /usr/bin/python2 as their interpreter, and /usr/bin/python is not present by default on any new installs. On systems upgraded from previous releases, /usr/bin/python will continue to point to python2 for compatibility. Users who require /usr/bin/python for compatibility on newly-installed systems are encouraged to install the python-is-python3 package, for a /usr/bin/python pointing to python3 instead. Due to this transition the legacy python and python-minimal packages might be removed during an upgrade, being replaced by the python2 and python2-minimal packages as dependencies of the python-is-python2 package. Snap Store The Snap Store (snap-store) replaces ubuntu-software as the default tool for finding and installing packages and snaps. Ubuntu Server Installer The live server installer is now the preferred media to install Ubuntu Server on all architectures. Besides architecture support, the main user visible new features are support for automated installs and being able to install the bootloader to multiple disks (for a more resilient system). There have been many other fixes under the hood to make using encryption easier, better support installing to multipath disks, more reliable installation onto disks that have been used in various ways and allowing failures to be reported more usefully. Starting from Ubuntu Server 20.04.2 the ISO images can optionally boot the installer using the HWE kernel. In this case the installed system will automatically make use of the HWE stack. QEMU QEMU was updated to 4.2 release. There is so much that it is hard to select individual improvements to highlight, here just a few: free page hinting through virtio-balloon to avoid migrating unused pages which can speed up migrations PPC: NVIDIA V100 GPU/NVLink2 passthrough for spapr using VFIO PCI Many speed improvements for LUKS backend pmem/nvdimm support ... Therefore please see the full change logs 4.2 and 4.1 for major changes since Ubuntu 19.10. For Upgraders from Ubuntu 18.04 please also check out 4.0, 3.1, 3.0 and 2.12. When upgrading it is always recommended to upgrade the machine types allowing guests to fully benefit from all the improvements and fixes of the most recent version. upgrading from 19.10 For trimmed down container like isolation use-cases the new qemu has the microvm machine type which can be combined with the qboot ROM (available as bios-microvm.bin) to provide a reduced feature set at a much faster startup time. To further emphasize that you can use the package qemu-system-x86-microvm which provides an alternative QEMU binary stripped of all features not needed these use cases as sugegsted by the qboot ROM. The VMX related features can now be controlled individually instead of just vmx on/off. Due to that the VMX-subfeatures of certain CPU types might have slightly changed (matching those of the selected CPU type now instead of almost randomly depending on the underlying hardware). In general it is - and always was - recommended to use a well defined cpu type when defining a guest, this is also what almost all higher level management tools from virt-manager to openstack will do. But if you want the most generic and compatible cpu but also enable VMX please use the type kvm64 instead of qemu64 now. People that like to work or experiment with nvdimms and persistent memory QEMU now has pmem and nvdimm support enabled in Ubuntu Focal Fossa. upgrading from 18.04 QEMU now has virglrenderer enabled which allows to create a virtual 3D GPU inside QEMU virtual machines. That is inferior to GPU passthrough, but can be handy if the platform used lacks the capability for classic PCI passthrough as well as more modern mediated devices. The graphical QEMU back-end is now based on GTK instead of SDL. That provides much better Desktop integration and is often faster. libvirt libvirt was updated to version 6.0. See the upstream change log for details since version 5.6 that was in Ubuntu 19.04 or further back since verison 4.0 that was in Ubuntu 18.04. upgrading from 19.10 Among many improvements worth to mention might be the features: to access NVMe disks directly now allowing a speed oriented setup that still supports migration. Mediated GPU devices are now supported as boot display. Support kvm-hint-dedicated performance hint allowing the guest to enable optimizations when running on dedicated vCPUs ...see the detailed changelog linked above for much more upgrading from 18.04 Worth mentioning is that libvirt can now enable QEMUs ability to use parallel connections for migration which can help to speed up migrations if one doesn't saturate your network yet. Administrators might like the ease of a new local include apparmor to the libvirt-qemu profile that allows local overrides for special devices or paths matching your setup without conffile delta that has to be managed on later upgrades. Added the ability to have GL enabled graphics as well as mediated devices to be configured while still being guarded by custom apparmor profiles generated per guest. This is required for the use of gpu based mediated devices as well as VirGL mentioned above in the qemu section. Transition libvirt-bin -> libvirt-clients / libvirt-daemon / libvirt-daemon-system Already in Ubuntu 18.04 the package was split from an almost single monolithic package libvirt-bin into three main components: libvirt-daemon-system - system integration of the daemon with config and systemd service files (this is the most similar single package to the old libvirt-bin) libvirt-clients - cli tools to interact with libvirt like virsh libvirt-daemon - just the libvirt daemon, without services/configuration In a similar fashion rarely used and less supported sub-features like virtualbox and xen control, as well as uncommon storage options are broken out into various libvirt-daemon-driver-* packages. That allows to reduce the install footprint and active code in the majority of installations. Packages and project had plenty of time to transition, so now the empty compatibility package libvirt-bin that was pulling in libvirt-daemon-system + libvirt-clients w'''
