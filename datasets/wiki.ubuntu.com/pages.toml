["https://wiki.ubuntu.com/Spanish"]
title = "Spanish - Ubuntu Wiki"
full_description = "Spanish • Principal • Acerca de Ubuntu • Comunidad • Involúcrate • Equipos • Noticiero semanal • Información de lanzamientos Contenidos Contents Equipos y Recursos Desarrollo de Software Control de calidad y paquetería Marketing y promoción Documentación y Soporte Accesibilidad Artwork Localización y Usuarios Internacionales Comunidad Consejo de la Comunidad y Anuncios Puntos de encuentro Foros Grupos de Telegram Páginas de Facebook IRC Freenode Equipos LoCo Podcasts Eventos Lanzamientos Bienvenido a Ubuntu Team Wiki en Español, un lugar para que la comunidad de Ubuntu discuta sus ideas y para que cada equipo conserve información. Puedes editar casi todas las páginas. Para más información consulta la Ayuda de edición. Por favor respeta el Código de Conducta de Ubuntu en todo momento. Equipos y Recursos Cómo conseguir Ayuda - Ayuda con Ubuntu Noticias Semanales - Noticias semanales de la Comunidad Ubuntu. Certificación de Ingeniero - Involúcrate en el nuevo proyecto de Ubuntu dirigido a constituir la certificación del Ingeniero Ubuntu. Desarrollo de Software Los equipos de desarrollo de software trabajan en todos los rangos de software en los que está involucrado Ubuntu. Si está corrigiendo errores o desarrollando completamente nuevas aplicaciones, un equipo de desarrollo estará listo para ayudar. Documentación para desarrolladores puede encontrarse en Ubuntu Development (en inglés) El Equipo de Escritorio maneja los paquetes relacionados con la instalación del escritorio Ubuntu (en inglés) El Equipo de Instalación se ocupa del instalador de Ubuntu (en inglés) El Equipo del Kernel está encargado del mantenimiento del núcleo de Linux en Ubuntu (en inglés) El Equipo de Servidor trabaja para hacer de Ubuntu la mejor plataforma de servidor Linux en el planeta The Embedded Team trabaja para hacer Ubuntu más adaptable en dispositivos a implementar (eninglés) El Equipo de Mozilla se ocupa de matener el software de Mozilla en Ubuntu (en inglés) Los proyectos Kubuntu, Edubuntu y Xubuntu tienen sus propios equipos de desarrollo Control de calidad y paquetería Los equipos de control de calidad se encargan de organizar los centenares de informes de fallos sobre paquetes de Ubuntu que se reciben cada semana. Los equipos de empaquetamiento se ocupan de introducir nuevos paquetes en Ubuntu y de actualizar los viejos. El Bug Squad se ocupa de organizar el torrente de informes de fallos enviados por los usuarios de Ubuntu. MOTU (the Ubuntu Universe packaging team) se encarga de empaquetar y mantener los numerosos paquetes soportados por la comunidad. El Ubuntu Studio packaging team empaqueta las aplicaciones multimedia destinadas al proyecto Ubuntu Studio. El Laptop Testing Team comprueba la compatiblidad de Ubuntu con el hardware de los ordenadores portátiles. Marketing y promoción Los equipos de marketing y promoción están para difundir sobre Ubuntu. Desde la organización de eventos promocionales a preparar materiales para presentaciones, están aquí para llamar la atención sobre Ubuntu. El material promocional de Ubuntu está disponible desde la página Presentaciones El equipo de marketing dirige el marketing y la promoción de Ubuntu Ubuntu Love tiene como objetivo hacer que te involucres con el proyecto de Ubuntu Ubuntu Women ayuda a que las mujeres se involucren en Ubuntu Ubuntu Video, Ubuntu Clips y Ubuntu Screencasts son lugares en los que puedes ver o enviar vídeos sobre el uso de Ubuntu Documentación y Soporte Los equipos de documentación y soporte The support and documentation teams apuntan a ayudar a usuarios que requieres un mano con Ubuntu. Ya sea escribiendo documentación del sistema o ayudando con soporte en un chat IRC, Whether it's writing system documentation or helping out on IRC support chat, los equipos de documentación y soporte están para ayudarte lo mayor posible en temas relacionados a Ubuntu. El Equipo de Documentación escribe y mantiene la documentación principal para Ubuntu, incluyendo la documentación del sitema y el wiki de ayuda El Equipo de Documentación en Español se encarga de diseñar y traducir la documentación para el proyecto Ubuntu en español El Equipo del Wiki es un grupo de activos contribuidores del wiki trabajando en equipo para conseguir cosas hechas más aprisa sin llegar en redundancia Accesibilidad El Equipo de Accesibilidad esta aquí para ayudar a mejorar tecnologías de accesibilidad disponibles con Ubuntu. Artwork El Equipo de Ilustraciones de Ubuntu trabaja en ilustraciones y gráficos para diferentes partes del proyecto Ubuntu. Localización y Usuarios Internacionales Un mapa de Usuarios de Ubuntu al rededor del mundo está disponible en Ubuntu Worldwide. Lista de Equipos LoCo El Equipo de Traducción coordina la traducción de Ubuntu en varios idiomas. El equipo de traducción de Ubuntu al español se encarga de las traducciones al español. Comunidad Comunidad Ubuntu - Donde está la comunidad. Lista de los Equipos de Comunidades Locales, equipos de Desarrollo Ubuntus, y otros equipos, para encontrar cómo involucrarte en la Comunidad Ubuntu y difundir el amor Ubuntu! Entre otras cosas en esta página puedes encontrar: Cómo participar - Ayuda a la Comunidad Ubuntu! Proceso de Nuevo Miembro - Conviertete en un Miembro de Ubuntu! Consejo de la Comunidad y Anuncios Anuncios Técnicos de Ubuntu reuniones dos veces al mes, mira la Agenda de Anuncios Técnicos (en inglés) Consejo de la comunidad Ubuntu reuniones dos veces al mes, mira la Agenda del Consejo de la Comunidad Consejo del Foro reuniones mensuales, mira la próxima reunión en la Agenda del Consejo del Foro Puntos de encuentro Foros LoCo Argentina LoCo Centroamérica LoCo Perú LoCo Chile LoCo Colombia LoCo Uruguay LoCo Venezuela LoCo Bolivia LoCo Ecuador LoCo Honduras LoCo Paraguay Grupos de Telegram Ubuntizados Ubuntu ES Ubuntu Colombia Lubuntu LinuxMintEs linuxmint_es GNULinuxGrupo Cañas y bravas (grupo oficial de KDE España) Gnomeros GNU/Linux Valencia (español y valenciano) Jugando en Linux KDE Plasma Lignux Linuxeros_es Linux y tapas Maratonistas Linuxeros Novato en Linux Páginas de Facebook Linux Latinoamérica Ubuntu, CentOs, RedHat, Oracle Linux, Suse y Linux en español Linux en español Linux Español IRC Freenode Canal Descripción Contacto #ubuntu-ar Argentina beuno marianom #ubuntu-ast Asturian Marcos #ubuntu-cl Chile mruiz #ubuntu-co Colombia AndresMujica #ubuntu-cr Costa Rican Team mayeco #ubuntu-es #ubuntu-es-cafe #kubuntu-es #xubuntu-es #lubuntu-es Spanish speakers m4v, Ubuntu ES IRC Team #ubuntu-es-es Spain GatoLoko #ubuntu-l10n-es Ubuntu Spanish Translators team channel Mailing List: ubuntu-es-l10n@lists.ubuntu.com Team Leader: Ricardo Pérez López IRC Coordinator: Evan R. Murphy #ubuntustudio-es Spanish Ubuntu Studio help channel luisbg #ubuntu-lat Latin America Hord #ubuntu-mx Mexico ubuntu-mx-council #ubuntu-ni Nicaragua Ubuntu-ni CC #ubuntu-pa Panama mayeco #ubuntu-pe Peru #ubuntu-phone-es Spanish speakers mimecar #ubuntu-uy Uruguay PabloRubianes #ubuntu-ve Venezuela effie_jayx,santiago-ve Equipos LoCo Ubuntu Spain Argentina LoCo Ubuntu Colombia Ubuntu Paraguay Team Ubuntu Venezuela Team Bolivian Ubuntu Team Ubuntu Chile Ubuntu Ecuador Team Ubuntu Perú Ubuntu Uruguay LoCo Team Podcasts Atareao Ubuntu y otras hierbas Eventos La comunidad Ubuntu participa en varios eventos al lo largo del año, desde planeamiento y reuniones de equipo a conferencias y demostraciones importantes para industria. Calendario de Eventos Ubuntu en el Fridge - lista de reuiones de equipo. 2007 Eventos Ubuntu UES-Sevilla May 3-4, 2007 en Sevilla, España Ubucon Sevilla May 5, 2007 en Sevilla, España UDS-Sevilla May 6-11, 2007 en Sevilla, España Lista de eventos pasados desde 2004-2006 Conference Appearances, y Eventos Importantes en los que Ubuntu va a ser representado. Mire Ubuntu en Conferencias para información sobre cómo ayuar. Lanzamientos Lanzamiento Versión Fecha de lanzamiento Fecha de soporte Jammy Jellyfish 22.04 21 de abril de 2022 hasta julio de 2027 Impish I