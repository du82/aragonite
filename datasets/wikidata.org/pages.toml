title = "Event:Data Reuse Days 2025 - Wikidata"
full_description = '''Event:Data Reuse Days 2025 From Wikidata Jump to navigation Jump to search LocationOnline eventStart and end time17:00, 18 February 2025 – 19:00, 27 February 2025Timezone: +00:00Number of participants267 participantsMore detailsEvent endedData Reuse Days 2025Organized by: Lea Lacroix (WMDE)Start and end time17:00, 18 February 2025 to 19:00, 27 February 2025Timezone: +00:00LocationOnline event267 participantsLea Lacroix (WMDE)Lydia Pintscher (WMDE)ItamarWMDEKuldeepburjbhalaikeMassslyMSwierengaMacocoboviKosbootSridhar GHanlin LiView all22 participants registered privately Overview Program Register Participants Discussions .mw-parser-output .tocright{float:right;clear:right;margin-bottom:.5em;padding:.5em 0 .8em 1.4em;background:none}Contents 1 Sessions 1.1 Tuesday, February 18th 1.2 Wednesday, February 19th 1.3 Thursday, February 20th 1.4 Friday, February 21st 1.5 Saturday, February 22nd 1.6 Monday, February 24th 1.7 Tuesday, February 25th 1.8 Wednesday, February 26th 1.9 Thursday, February 27th 1.10 Friday, February 28th 2 See also Welcome! The Data Reuse Days 2025 is an online event focusing on how people and organizations use Wikidata's data to build interesting applications and tools. It aims to bring together data reusers and editors to learn from each other and discover cool Wikidata-powered applications. We will also cover technical aspects of Wikidata and share research and ideas for the future of reusing Wikidata’s data. How does it work? The event is taking place online, we will have sessions taking place during periods of 2 hours through 8 days: from February 18 to 27, 2025. Find the schedule below on this page. The sessions take place in English, and are open to everyone interested in the topic of data reuse. You have 3 options to watch the sessions: Attend live in the Jitsi room: you'll be able to interact with the speakers and other participants. Once you have registered for the event you can find the unique Jitsi link on the Event details page. Note: if you join the Jitsi room, please be aware that we will be recording the call and broadcasting it live on Youtube. Watch the livestream of the sessions on Youtube: great option if your connection or device doesn't allow Jitsi, or if you don't want to appear on the videos. You can find the links for each day on the schedule tables below. Watch the replay videos later on Youtube or Wikimedia Commons: to catch up in case you missed the live transmission, you can find the links for each day on the schedule tables below. Register to the event We encourage you to sign up to the event on this page to receive updates and access links. In order to register, you need to be logged in with your Wikimedia account, and click on the "register for event" button at the top of this page. Code of conduct Please note that the entire initiative, including the presentations and discussions on various channels, is covered by the Code of Conduct for technical spaces. Please contribute in making the discussion spaces safe and welcoming for everyone. Discussions and help If you have questions or suggestions about the event, feel free to use the talk page. Announcements about the event are talking place on the same talk page, and on the Wikidata Telegram group. If you want to reach out to the organizers directly, feel free to contact Lea Lacroix (WMDE) (lea.lacroix_extwikimedia.de or @Auregann on Telegram). Sessions The event is now over, but you can rewatch the sessions at anytime. You'll find the links in the program tables below. Tuesday, February 18th Session details Title, description and speakers 17:00 UTC 50min ▶️ Replay on Youtube (starting at 0:26) Opening session opening slides research results slides In this session, we'll present the Data Reuse Days 2025 and how the event will work. In the second part of the session we will give you insight from research Wikimedia Deutschland is conducting about how to improve the various data access methods, and share with you what's coming up for Wikidata reusers. Speakers: Lea Lacroix (WMDE), Lydia Pintscher (WMDE), Ifrahkhanyaree WMDE 18:00 UTC 60min ▶️ Replay on Youtube (starting at 45:17) Using Wikidata's data: Come and ask your questions! Have you been building an application using data from Wikidata and encountered some issues? Struggling to use the dumps or the APIs? Are you thinking of reusing Wikidata's data but you don't know where to start? This session is perfect for you! You will have the ability to ask for help and input (there's no stupid question). The development team, other reusers or editors will answer and unblock you. Facilitation: Lydia Pintscher (WMDE), Ifrahkhanyaree WMDE Wednesday, February 19th Session details Title, description and speakers 17:00 UTC 50min ▶️ Replay on Youtube (starting at 0:15) How to use Wikidata's data: an introduction slides There are several ways to get to Wikidata's data and integrate it in your application. We will give an overview of existing ways to retrieve and use data from Wikidata for developers. We will dive into when to use which as well as good practices and tips. We're here to help you get the data you need for your application in the best way possible. Speakers: Lydia Pintscher (WMDE), Ifrahkhanyaree WMDE 18:00 UTC 60min ▶️ Replay on Youtube (starting at 52:56) Snowman + Wikidata: Website from scratch In this one hour live coding session we will create a small website showcasing glacier data in Wikidata. At the end of the session our website will have individual glacier pages with images, an interactive map, and a few different pages listing glaciers by their attributes. We will be using Snowman, a static site generator for SPARQL services. After the session you will be ready to learn advanced Snowman topics like multilinguality, search, CD/CI integrations, and much more so that you can make your Wikidata projects a reality quicker than ever! Speaker: Abbe98 Thursday, February 20th Session details Title, description and speakers 17:00 UTC 30min ▶️ Replay on Youtube (starting at 0:15) Introduction to the Wikibase REST API slides Wikidata's newest API is the REST API. In this session we will give you an intro to the REST API, how it works and where it's going. Speakers: Ifrahkhanyaree WMDE, Jakob Warkotsch (WMDE) 17:30 UTC 60min ▶️ Replay on Youtube (starting at 21:46) Build a simple app in REST API We will walk through the entire user journey of building a simple web application using the new REST API. Starting with discovering and navigating the documentation, we will explore how to select the appropriate endpoints for retrieving and editing Item data and integrate them into our app. Speakers: Ifrahkhanyaree WMDE, Jakob Warkotsch (WMDE) Friday, February 21st Session details Title, description and speakers 17:00 UTC 80min ▶️ Replay on Youtube (starting at 0:00) Application showcase #1 Discover tools and applications that use Wikidata's data from their creators, learn more about the technical setup they use and the challenges they may face. Each presentation will be a 10min lightning talk, and at the end of all presentations we'll have a common Q&A and discussion. slides slides GLAMorous Europe - Dating the GLAMs of your neighbours (Anne Mühlich, Gerd Müller) Govdirectory: How we monitor data quality and changes (Ainali, Abbe98) mlscore - Multilinguality score of Wikidata items and properties (Jsamwrites) Expeditia, visualise Research Expeditions itineraries (Joaquim Santos) Mapping Libraries in Uganda (Micheal Kaluba, Catherine Amia, AKibombo) 18:30 UTC 25min ▶️ Replay on Youtube ( starting at 1:16:18) Discussion about Action API Have you been a long term user of the Action API? Or always wanted to try it out but ran into challenges? Never had a chance to praise or criticize it? Want to share your opinion or what we could do to improve it? Then come talk to us in this session! Facilitation: Ifrahkhanyaree WMDE 19:00 UTC 60min 👥 Not recorded Let's play Wikidata games together! During this informal session, we will play some Wikidata-based games and chat. Facilitation: Lydia Pintscher (WMDE) Saturday, February 22nd Session details Title, description and speakers 19:00 UTC 50min ▶️ Replay on YouTube Wikidata live editing – Reusing Wikidata: Playing it Safe Ainali and Abbe98 do some live editing, and discuss the thought process of what we are doing and why we do it. This time, we will show how we reuse data from Wikidata in practice. From identifying data, preparing SPARQL queries and then reusing it externally with quality checks. We'll also explore how to future-proof queries and improve Wikidata items so that they can be used as quality providers. Monday, February 24th Session details Title, description and speakers 17:00 UTC 50min ▶️ Replay Youtube (starts at 0:04) Helping AI learn from Wikidata slides Join us to discover how the Wikidata Embedding Project is making it easier to explore Wikidata with AI. With an open-source Vector Database built on top of Wikidata, you can search for entities using natural language and develop new tools and applications in fun, creative ways. Speaker: Philippe Saade (WMDE) 18:00 UTC 25min ▶️ Replay on Youtube (starts at 43:00) Model Context Protocol for Wikidata How can casual users access information from Wikidata via LLMs? We present a tool that can help with this. Prerequisite knowledge: Basic knowledge of Wikidata and use of LLMs like ChatGPT. Speaker: DErenrich-WMF Tuesday, February 25th Session details Title, description and speakers 17:00 UTC 50min ▶️ Replay on Youtube (starts at 0:03) Wikidata Query Service: Where are we? Where is it going? slides Wikidata Query Service is Wikidata's SPARQL endpoint that allows you to query all of Wikidata's data. Over the past years it has been struggling. In this session we will give an update on what we have done to stabilize the service and what is coming next. Speakers: GLederrey (WMF), DCausse (WMF), Lydia Pintscher (WMDE) 18:00 UTC 25min ▶️ Replay on Youtube (starting at 40:32) Using Wikidata to provide background information to application users Combining using Wikipedia and Wikidata for NER, entity linking and background info Wikidata provides valuable information to aid in named entity recognition and for application users to better understand an entity reference in a news or blog article. This presentation overviews how the Wikipedia and Wikidata REST APIs, as well as WDQS, provide this data for the Deep Narrative Analysis application. Speaker: AWesterinen 18:30 UTC 25min ▶️ Replay on Youtube (starting at 1:10:45) WikiFlix, the free video streaming portal WikiFlix is a video streaming site that uses Wikidata to find freely available movies, mostly older public domain classics and some Creative Commons-licensed ones. The videos are hosted on Wikimedia Commons, YouTube, or the Internet Archive. Currently, over 3600 movies are available on WikiFlix. Speaker: Magnus Manske Wednesday, February 26th Session details Title, description and speakers 17:00 UTC 50min ▶️ Replay on Youtube Application showcase #2 Discover tools and applications that use Wikidata's data from their creators, learn more about the technical setup they use and the challenges they may face. Each presentation will be a 10min lightning talk, and at the end of all presentations we'll have a common Q&A and discussion. AletheiaFact.org: Creating an open fact-checking ecosystem in Brazil (Mateus Santos (User:TheSocialDev) and Tamiris T. Volcean) Wikidata use in KDE Itinerary (Volker.krause) vglist, the cross-platform video games catalog (Nicereddy) Paulina - Data for the public domain (Jorge Gemetto (User:Pepe piton)) 18:00 UTC 25min ▶️ Replay on Youtube (starting at 59:27) Scribe: Wikidata Language Learning Keyboards and Lexeme Extraction Scribe applications use Wikidata lexemes to help language learners and enthusiasts. This session will present: 1) The iOS application Scribe - Language Keyboards; 2) The current state of Scribe-Android that we plan to release in mid 2025; 3) The Python command line interface Scribe-Data, which is what the Scribe community uses to get and process language packs (German nouns, French verbs, etc) of Wikidata data. After the demos we'd be happy to discuss future plans for the Scribe community! (slides) Speakers: AndrewTavis, Gauthammohanraj, Afi570 Thursday, February 27th Session details Title, description and speakers 17:00 UTC 25min ▶️ Replay on Youtube 169k Reasons to Care: Wikidata’s Role in Open Library Author Pages In 2024 OpenLibrary.org started populating 169k author pages with information from Wikidata including: language-aware Wikipedia links, description, and links to Google Scholar. I’ll share how and why we made this integration. It would be great to hear ideas from people about how we could expand this integration! Speaker: RayScript 17:30 UTC 25min ▶️ Replay on Youtube Data round-tripping with authority files slides An overview of the importance of effective data round-tripping with authority files (AFs), at least the national ones; focus on the procedure to find mistakes in AFs through Wikidata and on how presently we interact with the main AFs. Speaker: Epìdosis 18:00 UTC 10min ▶️ Replay on Youtube Closing session slides Conclusion of the event and sharing the participants survey. Speakers: Lea Lacroix (WMDE), Lydia Pintscher (WMDE), Ifrahkhanyaree WMDE 18:10 UTC 60min 👥 Not recorded Let's play Wikidata games together! During this informal session, we will play some Wikidata-based games and chat. Facilitation: Lydia Pintscher (WMDE) Friday, February 28th Session details Title, description and speakers 09:00 UTC 👥 Live on Jitsi, not recorded Open replay session In autonomy, participants can enter the Jitsi room to watch some of the replay videos of the event, and discuss. 17:00 UTC 👥 Live on Jitsi, not recorded Open replay session In autonomy, participants can enter the Jitsi room to watch some of the replay videos of the event, and discuss. See also Feel free to add more links here! 🪷 Event useful links Slide template Main Commons category: Data Reuse Days 2025 Sessions slides and materials Videos Youtube playlist 🖋️ Related documentation pages Wikidata:For developers Wikidata:Data access Wikidata:SPARQL query service/Wikidata Query Help Wikidata:Tools/For programmers Slides and videos of the Data Reuse Days 2022 event 💬 Telegram and other social media Wikidata general Telegram group On Mastodon & co: #DataReuseDays2025 ▶️ Selection of sessions from previous events TBD <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Event:Data_Reuse_Days_2025&oldid=2318037954" Category: XXX Days'''
