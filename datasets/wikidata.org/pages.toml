description = """
A place to discuss any and all aspects of Wikidata: the project itself, policy and proposals, individual data items, technical issues, etc.
Please use {{Q}} or {{P}} the first time you mention an item or property, respectively.
Other places to find help

Frequently asked questions
Requests for deletions
Merging instructions
Report a technical problem
Requests for protections, undeletions and other matters requiring administrator attention. To report vandalism, click here.
For realtime chat rooms about Wikidata, see Wikidata:IRC."""
full_description = '''Shortcuts: WD:PC, WD:CHAT, WD:? Wikidata:Project chat From Wikidata Jump to navigation Jump to search .mw-parser-output .chatheader-main{padding:1em 1.6em 1em}.mw-parser-output .chatheader-title{font-size:220%;font-weight:bold;color:var(--color-subtle,#54595d)}.mw-parser-output .chatheader-description{color:var(--color-subtle,#54595d)}.mw-parser-output .chatheader-translate{padding:0 1.6em 0;text-align:right;font-weight:bold}.mw-parser-output .chatheader-newsection{padding:.4em 1.6em 1em;text-align:right}@media screen and (max-width:719px){.mw-parser-output .chatheader,.mw-parser-output .chatheader>tbody,.mw-parser-output .chatheader>tbody>tr,.mw-parser-output .chatheader>tbody>tr>td{display:block;width:auto}.mw-parser-output .chatheader-translate,.mw-parser-output .chatheader-newsection{text-align:left}} .mw-parser-output .wd-box{background-color:var(--background-color-base,#fff);border:thin solid var(--border-color-base,#a2a9b1);border-collapse:collapse;border-radius:0.2rem;box-shadow:2px 3px 4px 1px var(--border-color-base,#a2a9b1);box-sizing:border-box;margin:1.25rem auto 2rem;min-width:97.5%}.mw-parser-output .wd-box .wd-box-header{color:var(--color-subtle,#54595d);font-size:2.2em;padding:1rem 1.5rem 0.5rem}.mw-parser-output .wd-box .wd-box-image-cell{padding:0.8rem 1.5rem 0;width:3.5rem}.mw-parser-output .wd-box .wd-box-subheader{color:var(--color-subtle,#54595d);font-size:1.2em;padding:0.5rem 1.5rem 0.75rem}.mw-parser-output .wd-box .wd-box-description{color:var(--color-subtle,#54595d);font-size:0.975rem;padding:0.5rem 1.5rem 0.75rem}.mw-parser-output .wd-box .wd-box-text{padding:0.75rem 1.5rem} Wikidata project chatA place to discuss any and all aspects of Wikidata: the project itself, policy and proposals, individual data items, technical issues, etc. Please use {{Q}} or {{P}} the first time you mention an item or property, respectively. Other places to find help Frequently asked questions Requests for deletions Merging instructions Report a technical problem Requests for protections, undeletions and other matters requiring administrator attention. To report vandalism, click here. For realtime chat rooms about Wikidata, see Wikidata:IRC. Start a new discussion Afrikaans العربية беларуская беларуская (тарашкевіца) български Banjar বাংলা brezhoneg bosanski català کوردی čeština словѣньскъ / ⰔⰎⰑⰂⰡⰐⰠⰔⰍⰟ dansk Deutsch Zazaki dolnoserbski Ελληνικά English Esperanto español eesti فارسی suomi føroyskt français Nordfriisk galego Alemannisch ગુજરાતી עברית हिन्दी hrvatski hornjoserbsce magyar հայերեն Bahasa Indonesia interlingua Ilokano íslenska italiano 日本語 Jawa ქართული қазақша ಕನ್ನಡ 한국어 kurdî Latina lietuvių latviešu Malagasy Minangkabau македонски മലയാളം मराठी Bahasa Melayu Mirandés مازِرونی Nedersaksies नेपाली Nederlands norsk bokmål norsk nynorsk occitan ଓଡ଼ିଆ ਪੰਜਾਬੀ polski پنجابی português Runa Simi română русский Scots davvisámegiella srpskohrvatski / српскохрватски සිංහල Simple English slovenčina slovenščina shqip српски / srpski svenska ꠍꠤꠟꠐꠤ ślůnski தமிழ் తెలుగు ไทย Tagalog Türkçe українська اردو oʻzbekcha / ўзбекча Tiếng Việt Yorùbá 中文 Edit On this page, old discussions are archived after 7 days. An overview of all archives can be found at this page's archive index. The current archive is located at 2025/03. SpBot archives all sections tagged with {{Section resolved|1=~~~~}} after 1 day and sections whose oldest comment is older than 7 days. .mw-parser-output .discussion-navigation-outer{overflow:auto;overflow-x:auto;overflow-y:hidden;padding:1px}.mw-parser-output .discussion-navigation{font-size:95%;margin:auto;text-align:center;width:80%}.mw-parser-output .discussion-navigation .plainlist li{break-inside:avoid;min-height:3em;padding:1em} .mw-parser-output .plainlist ul{line-height:inherit;list-style:none none;margin:0;padding:0}.mw-parser-output .plainlist ul li{margin-bottom:0} Project chat Translators' noticeboard Bot requests Lexicographical data Request a query Requests for permissions Interwiki conflicts Administrators' noticeboard Requests for deletions Property proposal Bureaucrats' noticeboard Report a technical problem Requests for comment Properties for deletion Requests for checkuser Contents 1 Creating a dedicated undeletion request page 2 Adding links/IDs of full movies in YouTube 3 Same or not? 4 Flood of non-notable articles related to Nigeria 5 location vs located in administrative territorial entity, a muddle 6 erroneous merge - Luxor (Egypt) and Western Valley (England)?? 7 Allow "social networking service" qualifier for "social media followers" claims 8 Data Reuse Days: coming next and how to attend 9 QuickStatements 3.0 10 Wikidata weekly summary #668 11 Q132736405 12 Why don't film items have their IMDb score set? 13 This is not constructive 14 Confirmation in the Catholic Church and elsewhere 15 Wikipedia frontends 16 Adding coordinates in several ways 17 How are subreddit subscriber counts set? 18 Vector 2022 will be the default skin 19 Identifier changed, old identifier was redirected 20 What qualifier could I use to designate a "senior" version of a role? 21 Hide 22 Edit summaries Creating a dedicated undeletion request page[edit] Considering the size of Wikidata and the number of items that gets deleted for notability reasons dont you think we can afford this? It would much easier for everyone if we had them collected in one place instead of spread around a dozen of project pages and user talk pages Trade (talk) 16:58, 18 February 2025 (UTC)[reply] According to (the essay) Guide to requests for undeletion, initial undeletion requests should be on the user talk page of either the appellant or or of the deleting admin, and final appeals should be on WD:AN. When we were developing those guidelines, we initially recommended that the user go straight to WD:AN, but this quickly led to that noticeboard being overwhelmed by repetitive walls of text, so we adopted a two-step approach. The initial conversation with the deleting admin not only gives them a chance to undelete the item quickly and efficiently, but it also gives the appellant an opportunity to develop an appeal that relates to our notability criteria. Frankly, in a lot of cases, editors seeking undeletion don't know how best to help themselves. I'm not firmly opposed to a dedicated noticeboard, but I think the number of final appeals is fairly low, and I'm not sure it would be useful to move initial appeals to a central noticeboard. I think we need to be careful not to create too many different noticeboards when our core community is so small. Niche noticeboards tend to languish unattended. If I understand correctly, the problem that you're trying to solve here is that you can't find the initial requests for undeletion. I'm not sure why this is a problem to be solved, but one possible approach would be similar to unblock requests, where we ask appellants to use a specific template that puts the request into a category. Bovlb (talk) 21:37, 18 February 2025 (UTC)[reply] My issue is largely transparency. It's much harder for the Wikidata community to give their input on the undeletion request when no one but the creator and the deleting admin even know where the undeletion request is located meaning it's de facto hidden to most users "but one possible approach would be similar to unblock requests, where we ask appellants to use a specific template that puts the request into a category" A template to put on the talk page of the creator or the deleting admin? "but I think the number of final appeals is fairly low" Of course without having a dedicated page it's a bit hard to keep statistic off Trade (talk) 12:02, 19 February 2025 (UTC)[reply] OK. I'm still struggling to grasp what transparency issue we're trying to solve here. If someone appeals a deletion to the deleting admin and the item is undeleted, then I don't see any significant transparency issue. Are you concerned that there are items being deleted that should not have been, and that the problem is being covered over by quietly undeleting them on initial appeal? If the initial appeal is rejected, then the appellant is free to make a final appeal on AN, which seems pretty transparent to me. I have a small concern that there might be users whose initial appeal is rejected but who never learn about the possibility of making a final appeal. Any admin receiving any message that sounds like an undeletion request should be pointing to the guide, and we should consider translating the guide into other languages. Bovlb (talk) 16:10, 19 February 2025 (UTC)[reply] "Are you concerned that there are items being deleted that should not have been, and that the problem is being covered over by quietly undeleting them on initial appeal?" I am concerned it becomes too difficult for the rest of the community to give their input on undeletion requests unlike the deletion requests Trade (talk) 14:19, 24 February 2025 (UTC)[reply] Adding links/IDs of full movies in YouTube[edit] It would be nice if the links (IDs) to full movies for free on youtube could be added to the items about the movies. Looks like this "Popcornflix" account has many of them (and some are already integrated: example). I looked it up and there's a Wikipedia article about it: Popcornflix and the releases on that account seem like legal licensed releases. However, in that article it says On July 11, the U.S. Bankruptcy Court approved a conversion of the bankruptcy to Chapter 7, which would signal a liquidation of the company's assets, and the cessation of its subsidiaries, including Popcornflix. what does it mean for those films on YouTube? I mean it wouldn't be useful or worth the effort to link them if they soon get removed from YT. There probably are some more YT accounts one could scan/query for links to add to Wikidata items, e.g. I'd like to link this documentary to this item but I'm not sure about whether this is an official release – it very much does seem so since the video has been up for long with 1.5 million views and the channel "PopNet" which has further full films has its own website. I guess one could also assume it's some legal licensed release if it's on YouTube or on YT for over x months but I still wanted to ask about it. Also if somebody has a list of youtube accounts with films, it would be nice if you could link it or those accounts so the links can be imported. Background: Adding this data may be very useful in the future to potentially improve WikiFlix a lot which currently only shows films with the full video on Commons. So much so good but for films from 1930 or newer, YouTube has much more free films and this could be an UI to browse well-organized free films, including short films, in a UI dedicated to films and on the Web without having to install anything and using data in Wikidata, e.g. based on the genre. It could become one of the most useful and/or popular uses of Wikidata. Prototyperspective (talk) 20:34, 18 February 2025 (UTC)[reply] Is the YouTube video ID (P1651) not suitable for this? Stuartyeates (talk) 08:36, 19 February 2025 (UTC)[reply] Yes, it is suitable – that's the property the IDs would be written to. This isn't a property proposal and not suggesting that one is made. Prototyperspective (talk) 16:00, 19 February 2025 (UTC)[reply] Are you the one who made WikiFlix? Trade (talk) 12:02, 19 February 2025 (UTC)[reply] No, it was made by Magnus Manske. I think it could become quite useful but for it to be useful and used in practice, it would need to also show films whose video is only on YouTube but not on Commons. I've just created this category on Commons which contains nearly all full films that are on Commons. Prototyperspective (talk) 16:03, 19 February 2025 (UTC)[reply] It would also need some actual curation against copyright violations deleted from Commons. What is Thomas the Train even doing on Wikiflix?? Trade (talk) 15:15, 24 February 2025 (UTC)[reply] Items need to have their Wayback Machine link removed if it's offline. That seems to already be done for the item you named since I can't find it. Note that occasionally there is some documentary on the Internet Archive and while that contributes to education and making educational resources accessible – as with the case of 500 Nations (Q2817130) – I wonder whether it can be added to the Wikidata item but currently think the link shouldn't be added so don't add it but a few other editors may just add it, thinking it's fine. Prototyperspective (talk) 16:12, 24 February 2025 (UTC)[reply] I've just remembered that youtube channels have RSS feeds. If every video in a channel is a movie, you should be able to script an import. Stuartyeates (talk) 20:50, 22 February 2025 (UTC)[reply] There are also movies on Youtube where you have to "Pay to watch" (example), so not every item with YouTube video ID (P1651) might be free. Maybe the use of a qualifier could help here. --Dorades (talk) 20:57, 22 February 2025 (UTC)[reply] That may not be a perfect example. When I try and access it, I get "Video unavailable\nThis program is blocked in your area. Viewing restrictions are set by our content partners. Try watching another program." Is there a good exemplar of wikidata coding this kind of thing? Stuartyeates (talk) 08:23, 23 February 2025 (UTC)[reply] Good points all, thanks. If YouTube videos which are not available for free for all are added, then it clearly needs a qualifier for clarifying whether the video is geoblocked and/or blocking access by VPN users and/or only available after payment (pay to watch) or if being a paying premium member. This is needed in general and also so that WikiFlix can exclude all of the videos that have such set. A video like the example you linked is set at Q29906232#P1651 but so far without qualifier. Maybe a new Wikidata property and/or qualifier for YouTube video ID needs to be created. Moreover, I don't know if there's any difference between your example and the video that is set (one has "Try now" and one "Preview only" beneath the video). Prototyperspective (talk) 16:03, 23 February 2025 (UTC)[reply] Minor update to the above: the director of the documentary I linked as example has just linked to the YouTube video uploaded by "PopNet" in a tweet (where he's positive about it) so it must be fine. I have added the YouTube ID to the item now. I guess the other videos uploaded by the channel are also fine but I don't know of any way to check whether things are for sure fully legitimately legal. Plausibly, the best approach would be to just bulk-import all full-length documentaries and films on YouTube if they have been on there for at least x months (3?) where if it's taken down from YT, the YouTube ID would also be removed from the Wikidata item (some bot regularly checks if the video is still online and if not either removes the ID or replaces it with a Wayback Machine archived URL, right?). Prototyperspective (talk) 17:03, 23 February 2025 (UTC)[reply] Further update: created this listeria tabl'''
