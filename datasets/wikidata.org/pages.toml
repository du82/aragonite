al-subtle,#f8f9fa)}.mw-parser-output table.fmbox-warning{border:1px solid #bb7070;background-color:#ffdbdb}.mw-parser-output table.fmbox-editnotice{background-color:transparent}html body.mediawiki .mw-parser-output .mbox-small{clear:right;float:right;margin:4px 0 4px 1em;box-sizing:border-box;width:238px;font-size:88%;line-height:1.25em}html body.mediawiki .mw-parser-output .mbox-small-left{margin:4px 1em 4px 0;box-sizing:border-box;overflow:hidden;width:238px;border-collapse:collapse;font-size:88%;line-height:1.25em}A major review of the data model, structure relationship and new properties to include, has been published for discussion and approval.Please participate and make your comments on its talk page. Thank you! Contents 1 Properties 1.1 Overview 1.2 Person properties 1.3 Group properties 1.3.1 Group and Person Identifiers 1.4 Composition properties 1.4.1 Composition Identifiers 1.5 Track properties 1.5.1 Track Identifiers 1.6 Release properties 1.6.1 Release Identifiers 1.7 Record label properties 1.7.1 Record Label Identifiers 1.8 Qualifiers 1.9 Generic properties 1.10 Coverage of Properties 2 Statistics 3 Queries and lists 3.1 Triple J Hottest 100 Music Chart (by year) 3.1.1 List 3.1.2 Query 3.2 Albums 3.3 Releases 4 Current tasks 4.1 Add missing properties about music genres 4.2 Add missing properties about musical instruments 4.3 Add missing properties about instances of musical instruments 4.4 Musical scales 4.5 Chords 5 Participants 6 Communication 7 Related links 8 Tools 8.1 Items without statements 9 Navigation boxes 9.1 Authority control (edit) Properties Overview Note that most items do not yet use such a specific ontology as described in this table. In particular, items about songs are likely to be about both the composition and track; items about singles are likely to conflate the single release and the track; and items about albums may also include identifiers for individual versions of the album. Artists are grouped into humans, fictional characters and ensembles (musical groups). Ensembles should have one or more members (real or fictional). Compositions comprise the abstract musical creative works which form the basis for performances and audio recordings/tracks. Tracks comprise individual audio and video entities, such as tracks on a CD and music videos. Releases comprise any publications of recorded audio or video, such as studio albums, compilation albums, EPs, mixtapes and singles. These may have editions, particular versions which differ in some way. Releases usually contain one or more tracks. Labels comprise the brands and companies directly associated with releases. If a Wikipedia article is about a single with only one track, or mainly discusses one track of that single, then it should be connected to the item about the composition. Otherwise, it should be connected to the item about the release. Type Example item MusicBrainz Discogs AllMusic Spotify Other identifier Some properties for this type human (Q5), musical ensemble (Q2088357) Miles Davis (Q93341) MusicBrainz artist ID (P434) Discogs artist ID (P1953) AllMusic artist ID (P1728) Spotify artist ID (P1902)[1] Deezer artist ID (P2722) award received (P166), discography (P358) composed musical work (Q207628) Wuthering Heights (Q55777670) MusicBrainz work ID (P435) Discogs composition ID (P6080)[2] AllMusic composition ID (P1994)[3] N/A ISWC (P1827) composer (P86), sheet music (P3030) audio track (Q7302866) Wuthering Heights (Q55777789) MusicBrainz recording ID (P4404) Discogs track ID (P6079)[2] AllMusic song ID (P1730)[3] Spotify track ID (P2207)[4] ISRC (P1243), MetroLyrics ID (P2624) producer (P162), recorded at studio or venue (P483) version, edition or translation (Q3331189) of a musical release (Q2031291) 19 (Q57781481) MusicBrainz release ID (P5813) Discogs release ID (P2206) AllMusic release ID (P6110) Spotify album ID (P2205) Apple Music album ID (U.S. version) (P2281) tracklist (P658), publication date (P577) musical release (Q2031291) 19 (Q208902) MusicBrainz release group ID (P436) Discogs master ID (P1954) AllMusic album ID (P1729) N/A Genius album ID (P6217) cover art by (P736), language of work or name (P407) record label (Q18127) Epic Records (Q216364) MusicBrainz label ID (P966) Discogs label ID (P1955) N/A N/A Yandex Music label ID (P6538) country (P17), headquarters location (P159) ↑ Spotify also has Spotify songwriter ID (P8347) for songwriters, though currently this data is in beta and only available for a limited number of songwriters. ↑ 2.0 2.1 Currently disabled indefintely on the Discogs site pending further development. ↑ 3.0 3.1 AllMusic is a little different in this regard: in popular music, each track (of each release) is given a separate AllMusic song ID (P1730); outside popular music, AllMusic performance ID (P6306) is used instead, and may refer to multiple tracks. Performances and songs will often have many duplicates. Most popular music tracks do not have composition IDs; track credits are attached to album releases. ↑ Tracks on Spotify are usually attached to an ISRC (P1243), and it is possible to search for Spotify tracks by ISRC. Person properties In addition to standard properties that apply for all instance of (P31) of human (Q5), these properties can be specific to music-related persons: Title ID Data type Description Examples Inverse occupationP106Itemoccupation, by occupation or profession and profession: occupation of a person; see also "field of work" (Property:P101), "position held" (Property:P39)Yo-Yo Ma <occupation> cellist- instrumentP1303Itemmusical instrument: musical instrument that a person plays or teaches or used in a music occupationYo-Yo Ma <instrument> cello- award receivedP166Itemaward, honorary citizenship, title of honor and decoration: award or recognition received by a person, organization or creative workLady Gaga <award received> Grammy Award for Best Female Pop Vocal Performance- discographyP358Itemdiscography: item for list pages with d