title = "Wikidata:SPARQL query service/Wikidata Query Help - Wikidata"
full_description = '''Shortcut: Help:SPARQL Wikidata:SPARQL query service/Wikidata Query Help From Wikidata < Wikidata:SPARQL query service Jump to navigation Jump to search Translate this page; This page contains changes. Please contact a translation admin to mark them for translation. Other languages:American English Bahasa Indonesia Bahasa Melayu British English Deutsch English Esperanto Lëtzebuergesch Nederlands Tiếng Việt Türkçe català dansk eesti español euskara français italiano lietuvių norsk bokmål polski português do Brasil svenska vèneto Ελληνικά беларуская (тарашкевіца) български русский српски / srpski українська հայերեն עברית العربية بهاس ملايو فارسی हिन्दी বাংলা 中文 日本語 한국어 Welcome to the Wikidata Query Service help portal The place where your questions to the Wikidata Query Service are answered. Questions to Wikidata can be about pieces of knowledge in this world and their relationships. This can be used to use Wikidata as a knowledge base or generate lists for other Wikimedia projects, such as Wikipedia. We also have documentation for advanced users that goes beyond the first steps. The Wikidata Query Service provides a SPARQL endpoint including a powerful Web-GUI. SPARQL (pronounced "sparkle") is an RDF query language, that is, a semantic query language for databases. With SPARQL, you can extract any kind of data, with a query composed of logical combinations of triples. First steps A gentle introduction to the Wikidata Query Service This introduction introduces you to the user interface of the Wikidata Query Service. You don't need to learn SPARQL to modify queries and display results. This gentle introduction is a good start if you want to start playing around. Query Helper How to use the Query Helper to build or edit a query. Result Views A showcase of various possibilities to display Wikidata Query results. SPARQL Editor A help page to explain the features of the SPARQL editor. Access the Query Service query.wikidata.org The user interface of the Wikidata Query Service. Request a query This is a page where Wikidata SPARQL queries can be requested from community members who will write them for you as volunteers. Building a query Step-by-step examples. Spinach Wikidata botTool for creating or adjusting queries using natural language. Tutorials Wikidata Query Service Tutorial: interactive tutorial covering SPARQL and the Wikidata service for beginners SPARQL Tutorial A beginner-friendly course for SPARQL. This tutorial is aimed at those who want to dive in deeper into queries and learn the language needed to write complex queries Querying Wikidata with SPARQL for Absolute Beginners, a detailed video tutorial by Asaf Bartov (in English, 2 hours) More experienced Example queries Example queries in SPARQL, for inspiration and as building blocks for your own queries. Queries of the week archive Queries from Wikidata status update weekly summaries User Manual The user manual contains technical information on the Wikidata Query Service. This includes instructions on how to access it programmatically via GET or POST requests, or how to download and run the software behind the service yourself. Queries Advanced query concepts further explained, such as optionality and alternatives, working with dates, coordinates, qualifiers, references, etc. RDF Dump Format Technical documentation on the RDF serialization format for Wikidata. This includes information on how information in Wikidata is expressed in RDF and how it can be queried. Query Optimization Tips on optimizing Queries for faster execution and avoiding time-out. Wikidata Query Service: Suggestions and reports • Query limits • Contact the development team • Phabricator • Operational information <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Wikidata:SPARQL_query_service/Wikidata_Query_Help&oldid=2314918760" Categories: Wikidata:SPARQL query serviceWikidata-en'''
