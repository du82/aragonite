full_description = '''Shortcut: WD:RATP Wikidata:Report a technical problem From Wikidata Jump to navigation Jump to search Report a problemHow to report a problemHelp with PhabricatorGet involvedWDQS and Search .mw-parser-output .wd-box{background-color:var(--background-color-base,#fff);border:thin solid var(--border-color-base,#a2a9b1);border-collapse:collapse;border-radius:0.2rem;box-shadow:2px 3px 4px 1px var(--border-color-base,#a2a9b1);box-sizing:border-box;margin:1.25rem auto 2rem;min-width:97.5%}.mw-parser-output .wd-box .wd-box-header{color:var(--color-subtle,#54595d);font-size:2.2em;padding:1rem 1.5rem 0.5rem}.mw-parser-output .wd-box .wd-box-image-cell{padding:0.8rem 1.5rem 0;width:3.5rem}.mw-parser-output .wd-box .wd-box-subheader{color:var(--color-subtle,#54595d);font-size:1.2em;padding:0.5rem 1.5rem 0.75rem}.mw-parser-output .wd-box .wd-box-description{color:var(--color-subtle,#54595d);font-size:0.975rem;padding:0.5rem 1.5rem 0.75rem}.mw-parser-output .wd-box .wd-box-text{padding:0.75rem 1.5rem} On this page, old discussions are archived. An overview of all archives can be found at this page's archive index. The current archive is located at 2025/03. SpBot archives all sections tagged with {{Section resolved|1=~~~~}} after 1 day. .mw-parser-output th.mbox-text,.mw-parser-output td.mbox-text{border:none;padding:0.25em 0.9em;width:100%}.mw-parser-output td.mbox-image{border:none;padding:2px 0 2px 0.9em;text-align:center}.mw-parser-output td.mbox-imageright{border:none;padding:2px 0.9em 2px 0;text-align:center}.mw-parser-output td.mbox-empty-cell{border:none;padding:0;width:1px}.mw-parser-output table.ambox{margin:0 10%;border:1px solid var(--border-color-base,#a2a9b1);border-left:10px solid var(--border-color-progressive,#36c);background-color:var(--background-color-interactive-subtle,#f8f9fa);box-sizing:border-box}.mw-parser-output table.ambox+table.ambox{margin-top:-1px}.mw-parser-output .ambox th.mbox-text,.mw-parser-output .ambox td.mbox-text{padding:0.25em 0.5em}.mw-parser-output .ambox td.mbox-image{padding:2px 0 2px 0.5em}.mw-parser-output .ambox td.mbox-imageright{padding:2px 0.5em 2px 0}.mw-parser-output table.ambox-notice{border-left:10px solid var(--border-color-progressive,#36c)}.mw-parser-output table.ambox-speedy{border-left:10px solid var(--border-color-error,#b32424);background-color:#fee7e6}.mw-parser-output table.ambox-delete{border-left:10px solid var(--border-color-error,#b32424)}.mw-parser-output table.ambox-content{border-left:10px solid #f28500}.mw-parser-output table.ambox-style{border-left:10px solid var(--border-color-content-removed,#fc3)}.mw-parser-output table.ambox-move{border-left:10px solid #9932cc}.mw-parser-output table.ambox-protection{border-left:10px solid var(--border-color-base,#a2a9b1)}.mw-parser-output table.imbox{margin:4px 10%;border-collapse:collapse;border:3px solid var(--border-color-progressive,#36c);background-color:var(--background-color-neutral-subtle,#f8f9fa);box-sizing:border-box}.mw-parser-output .imbox .mbox-text .imbox{margin:0 -0.5em;display:block}.mw-parser-output .mbox-inside .imbox{margin:4px}.mw-parser-output table.imbox-notice{border:3px solid var(--border-color-progressive,#36c)}.mw-parser-output table.imbox-speedy{border:3px solid var(--border-color-error,#b32424);background-color:#fee7e6}.mw-parser-output table.imbox-delete{border:3px solid var(--border-color-error,#b32424)}.mw-parser-output table.imbox-content{border:3px solid #f28500}.mw-parser-output table.imbox-style{border:3px solid var(--border-color-content-removed,#fc3)}.mw-parser-output table.imbox-move{border:3px solid #9932cc}.mw-parser-output table.imbox-protection{border:3px solid var(--border-color-base,#a2a9b1)}.mw-parser-output table.imbox-license{border:3px solid #88a;background-color:#f7f8ff}.mw-parser-output table.imbox-featured{border:3px solid #cba135}.mw-parser-output table.cmbox{margin:3px 10%;border-collapse:collapse;border:1px solid var(--border-color-base,#a2a9b1);background-color:#dfe8ff;box-sizing:border-box}.mw-parser-output table.cmbox-notice{background-color:#d8e8ff}.mw-parser-output table.cmbox-speedy{margin-top:4px;margin-bottom:4px;border:4px solid var(--border-color-error,#b32424);background-color:#ffdbdb}.mw-parser-output table.cmbox-delete{background-color:#ffdbdb}.mw-parser-output table.cmbox-content{background-color:#ffe7ce}.mw-parser-output table.cmbox-style{background-color:#fff9db}.mw-parser-output table.cmbox-move{background-color:#e4d8ff}.mw-parser-output table.cmbox-protection{background-color:#efefe1}.mw-parser-output table.ombox{margin:4px 10%;border-collapse:collapse;border:1px solid var(--border-color-base,#a2a9b1);background-color:var(--background-color-neutral-subtle,#f8f9fa);box-sizing:border-box}.mw-parser-output table.ombox-notice{border:1px solid var(--border-color-base,#a2a9b1)}.mw-parser-output table.ombox-speedy{border:2px solid var(--border-color-error,#b32424);background-color:#fee7e6}.mw-parser-output table.ombox-delete{border:2px solid var(--border-color-error,#b32424)}.mw-parser-output table.ombox-content{border:1px solid #f28500}.mw-parser-output table.ombox-style{border:1px solid var(--border-color-content-removed,#fc3)}.mw-parser-output table.ombox-move{border:1px solid #9932cc}.mw-parser-output table.ombox-protection{border:2px solid var(--border-color-base,#a2a9b1)}.mw-parser-output table.tmbox{margin:4px 10%;border-collapse:collapse;border:1px solid var(--border-color-base,#a2a9b1);background-color:var(--background-color-neutral-subtle,#f8f9fa);min-width:80%;box-sizing:border-box}.mw-parser-output .tmbox.mbox-small{min-width:0}.mw-parser-output .mediawiki .mbox-inside .tmbox{margin:2px 0;width:100%}.mw-parser-output .mbox-inside .tmbox.mbox-small{line-height:1.5em;font-size:100%}.mw-parser-output table.tmbox-speedy{border:2px solid var(--border-color-error,#b32424);background-color:#fee7e6}.mw-parser-output table.tmbox-delete{border:2px solid var(--border-color-error,#b32424)}.mw-parser-output table.tmbox-content{border:2px solid #f28500}.mw-parser-output table.tmbox-style{border:2px solid var(--border-color-content-removed,#fc3)}.mw-parser-output table.tmbox-move{border:2px solid #9932cc}.mw-parser-output table.tmbox-protection{border:1px solid #c0c090}.mw-parser-output table.fmbox{clear:both;margin:0.2em 0;width:100%;border:1px solid var(--border-color-base,#a2a9b1);background-color:var(--background-color-neutral-subtle,#f8f9fa);box-sizing:border-box}.mw-parser-output table.fmbox-system{background-color:var(--background-color-neutral-subtle,#f8f9fa)}.mw-parser-output table.fmbox-warning{border:1px solid #bb7070;background-color:#ffdbdb}.mw-parser-output table.fmbox-editnotice{background-color:transparent}html body.mediawiki .mw-parser-output .mbox-small{clear:right;float:right;margin:4px 0 4px 1em;box-sizing:border-box;width:238px;font-size:88%;line-height:1.25em}html body.mediawiki .mw-parser-output .mbox-small-left{margin:4px 1em 4px 0;box-sizing:border-box;overflow:hidden;width:238px;border-collapse:collapse;font-size:88%;line-height:1.25em}Use this page to report a technical problem! If the problem you encounter is about the Wikidata Query Service or Search, please report it at WDQS and Search. .mw-parser-output .discussion-navigation-outer{overflow:auto;overflow-x:auto;overflow-y:hidden;padding:1px}.mw-parser-output .discussion-navigation{font-size:95%;margin:auto;text-align:center;width:80%}.mw-parser-output .discussion-navigation .plainlist li{break-inside:avoid;min-height:3em;padding:1em} .mw-parser-output .plainlist ul{line-height:inherit;list-style:none none;margin:0;padding:0}.mw-parser-output .plainlist ul li{margin-bottom:0} Project chat Translators' noticeboard Bot requests Lexicographical data Request a query Requests for permissions Interwiki conflicts Administrators' noticeboard Requests for deletions Property proposal Bureaucrats' noticeboard Report a technical problem Requests for comment Properties for deletion Requests for checkuser Start a new discussion Contents 1 darkmode 2 Dark mode inverts images in drop down menu 3 adding an invalid string to P18 (image) prevents user from editing string. (hard to replicate) 4 Language selector has a problem 5 wikidatawiki/entities/latest-all.json.bz2 404 darkmode[edit] It view: This page is always in light mode. Emergency. Normal is not. Henrydat (talk) 03:58, 14 February 2025 (UTC)[reply] it seems I must enable the gadget in preferences. Henrydat (talk) 15:16, 14 February 2025 (UTC)[reply] Dark mode inverts images in drop down menu[edit] As title, when searching wikimedia images for P31 (at least), the images are inverted (maybe there's a better technical term, white is black etc). There's clearly a fix for this already available as the P31 image value shown is not inverted, this only applies when searching for images. Tæppa (talk) 18:35, 16 February 2025 (UTC)[reply] Apologies I meant P18 here. P31 is "instance of" and the only P value I've memorised. 🫤 Tæppa (talk) 18:53, 16 February 2025 (UTC)[reply] Sorry for the delayed response! I tried replicating the issue but couldn’t reproduce the behavior. Does this happen with all images or only specific ones? Could you share a screenshot or screen recording of the issue in action? Which skin are you using? To others reading this: If you’ve encountered this issue too, please share your setup details here! -Mohammed Abdulai (WMDE) (talk) 13:32, 24 February 2025 (UTC)[reply] •All images •I'll try that if you can't replicate it after using the skin •Vectory Legacy (2010), both dark mode gadgets Tæppa (talk) 16:09, 24 February 2025 (UTC)[reply] adding an invalid string to P18 (image) prevents user from editing string. (hard to replicate)[edit] This may apply to other properties as well. I'm adding images to villages missing images. There's a database of images called "geograph" that has been mass imported into wikimedia and the unique identifier of the image is always in the wikimedia title, for example https://www.geograph.org.uk/photo/99269 is in wikimedia as "File:Flackwell Heath - geograph.org.uk - 99269.jpg". To save time looking up the words in the title, I'm copying the unique identifier ie "99269" in my example into the P31 (image) box on the wd item. While adding an image just now, I misclicked and accidentally pressed publish before selecting the image from the drop down search menu, which returns this error, which I have added quotation marks to: "Could not save due to an error. File extension is missing." This is fine and expected, the issue is however that I was temporarily unable to edit the string. Wikimedia search results are not shown. Double clicking highlights the text while the box is red and the error message remains displayed. After pressing cancel and bringing up the P31 box again, I'm able to search for images as expected and the issue does not replicate. I restarted my browser and tried again, but I was only able to replicate it on the second item I tried it on, so I can't advise as to how this problem can be replicated consistently. — Tæppa (talk) 18:48, 16 February 2025 (UTC)[reply] Hi @User:Tæppa, thank you for reporting this issue. This does seem like an obscure case. While it’s tricky to address immediately due to the reproducibility challenges, we’ll keep it in mind as we revamp statement editing as part of our upcoming mobile editing improvements. These broader updates will likely resolve underlying UI/UX quirks like this one. -Mohammed Abdulai (WMDE) (talk) 10:57, 24 February 2025 (UTC)[reply] Language selector has a problem[edit] Hello, I am using a tablet right now and wanted to change the language of the interface. This was hardly possible, as the menu list with the languages was displayed on the extreme left of the screen. Therefore, I could select (click on) only the languages in the right column, not those offered in the left column. In my opinion, the menu list should be displayed more in the centre of the screen so that I can see all of the languages offered. Ziko (talk) 10:23, 18 February 2025 (UTC)[reply] Hi @Ziko, could you share a screenshot of how the menu appears on your tablet? Also, please confirm if you’ve experienced the same issue on Wikimedia Commons (or other Wikimedia projects) while using your tablet? -Mohammed Abdulai (WMDE) (talk) 12:17, 24 February 2025 (UTC)[reply] wikidatawiki/entities/latest-all.json.bz2 404[edit] Tracked in PhabricatorTask T384625 I'm trying to download the latest entities dump but the link returns a 404. https://dumps.wikimedia.org/wikidatawiki/entities/latest-all.json.bz2 2600:4040:E0D0:E700:6C56:669C:4B4:5301 18:47, 20 February 2025 (UTC)[reply] This is currently being prioritized to be fixed soon. -Mohammed Abdulai (WMDE) (talk) 12:12, 24 February 2025 (UTC <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Wikidata:Report_a_technical_problem&oldid=2316319760" Category: Development'''
