mons-creator-table,.mw-parser-output .commons-creator-table>tbody{box-sizing:border-box;display:block;width:100%}.mw-parser-output .commons-creator-table>tbody{border-right:1px solid var(--border-color-base,#aaa);border-bottom:1px solid var(--border-color-base,#aaa)}.mw-parser-output .commons-creator-table>tbody>tr{border-top:1px solid var(--border-color-base,#aaa);display:flex;flex-wrap:wrap}.mw-parser-output .commons-creator-table>tbody>tr>th{border-left:1px solid var(--border-color-base,#aaa);padding:2px;flex:1 1 100%}.mw-parser-output .commons-creator-table>tbody>tr>td{border-left:1px solid var(--border-color-base,#aaa);padding:2px;flex:1 1}}@media(min-width:720px){.mw-parser-output .commons-creator-table{border:1px solid var(--border-color-base,#aaa);border-collapse:collapse;border-spacing:0;padding:5px}.mw-parser-output .commons-creator-table>tbody>tr>th,.mw-parser-output .commons-creator-table>tbody>tr>td{border:1px solid var(--border-color-base,#aaa);padding:2px}.mw-parser-output .commons-creator-table>tbody>tr>.halfwidth{max-width:10em}.mw-parser-output .commons-creator-table>tbody>tr>.fullwidth{max-width:20em}}@media screen{html.skin-theme-clientpref-night .mw-parser-output .commons-creator-table{background-color:#0c0b19}}@media screen and (prefers-color-scheme:dark){html.skin-theme-clientpref-os .mw-parser-output .commons-creator-table{background-color:#0c0b19}} Harrison Schmitt (1935–) Description American geologist, politician, astronaut, scientist and university teacher Date of birth 3 July 1935 Location of birth Santa Rita Work location Washington, D.C.; New Mexico Authority file : Q108886 VIAF: 31002920 ISNI: 0000000028663130 LCCN: n85805597 NAID: 10569053 US Congress: S000132 WorldCat Eugene Cernan (1934–2017) Alternative names Birth name: Eugene Andrew Cernan; Gene Cernan; Eugene A. Cernan Description American naval officer, astronaut, fighter pilot, autobiographer, businessperson and military flight engineer Date of birth/death 14 March 1934 16 January 2017 Location of birth/death Chicago Houston Authority file : Q158486 VIAF: 69785710 ISNI: 000000012138411X LCCN: n98095652 NAID: 10574575 GND: 121475212 WorldCat Ronald Evans (1933–1990) Alternative names Ronald Ellwin Evans Jr.; Ronald Ellwin Evans Description American astronaut, military officer, engineer, aircraft pilot and military flight engineer Date of birth/death 10 November 1933 7 April 1990 Location of birth/death St. Francis Scottsdale Authority file : Q313543 VIAF: 171815135 LCCN: no2011092927 WorldCat Title The Blue Marble label QS:Lar,"الگُلَّة (البلية) الزرقاء" label QS:Len,"The Blue Marble" Part of Apollo 17 Object type photograph Genre astrophotography Description العربية: صورة الگُلَّة (البلية) الزرقاء الشهيرة التي تعتبر أول صورة لمنظر الأرض الكامل. إلتُقطت الصورة في 7 كانون الأوَّل (ديسمبر) 1972 بواسطة طاقم مركبة الفضاء الأمريكيَّة أپولو 17 عند مغادرتهم مدار الأرض لِلقمر من على بعد حوالي 29,400 كيلومتر عن سطح الأرض. إلتقط الطاقم صورة الكوكب الأزرق بِشكلٍ مُتقنٍ حيثُ كانت الشمس من ورائهم وهو ما سمح بِإضائة مُمتازة لِكوكب الأرض، حيثُ تظهر أفريقيا، والقارَّة القطبيَّة الجنوبيَّة (أنتاركتيكا) وشبه الجزيرة العربيَّة. Deutsch: „Blue Marble“, die während des Fluges von Apollo 17 zum Mond am 7. Dezember 1972 entstandene Fotoaufnahme von der Erde English: "The Blue Marble" is a famous photograph of the Earth taken on December 7, 1972, by the crew of the Apollo 17 spacecraft en route to the Moon at a distance of about 29,400 kilometres (18,300 mi). It shows Africa, Antarctica, and the Arabian Peninsula. Español: "La canica azul". Imagen de la Tierra tomada desde el Apollo 17. فارسی: «تیلهٔ آبی» تصویر معروفی از زمین که در ۷ دسامبر ۱۹۷۲ توسط خدمهٔ فضاپیمای آپولو ۱۷ در مسیر ماه در حدود ۲٬۹۰۰ کیلومتری زمین گرفته شده است و قسمت‌هایی از آفریقا، جنوبگان و شبه جزیرهٔ عرب را نشان می‌دهد. Suomi: Sininen marmorikuula. Français : «La bille bleue» : Photo de l'Afrique, de l'Antarctique et de la péninsule Arabique prise en route pour la lune par Harrison Schmitt ou Ron Evans lors de la mission Apollo 17 le 7 décembre 1972. Ce vol a été le dernier à quitter l'orbite terrestre, et le seul au cours duquel un géologue, Harrison Schmitt, s'est rendu sur la lune. हिन्दी: "द ब्लू मार्बल" लगभग 29,400 kilometres (18,300 mi) की ऊँचाई पर चन्द्रमा की यात्रा पर गये अंतरिक्षयान अपोलो १७ के सदस्यों द्वारा दिसम्बर २००७ को लिया गया प्रसिद्ध चित्र है। इसमें अफ़्रीका, अंटार्कटिका और अरबी प्रायद्वीप दिखाई दे रहे हैं। Italiano: Famosa fotografia della Terra ripresa il 7 dicembre 1972 dall'equipaggio della missione Apollo 17 diretta verso la Luna, da una distanza di circa 29.400 km. Magyar: A „Kék üveggolyó”, egy híres fénykép a Földről, amelyet a Hold felé tartó Apollo–17 űrhajó legénysége készített 1972. december 7-én, mintegy 29 ezer kilométer távolságból. Jól látható rajta egész Afrika, az Arab-félsziget és az Antarktisz. Македонски: „Сината џамлија“ е позната фотографија на Земјата направена на 7 декември 1972 од екипажот на вселенското летало Аполо 17 патувајќи кон Месечината. Сликана е на растојание од 29.400 километри, а на неа се гледаат Африка, Антарктикот и Арапскиот Полуостров. Português: A Bolinha Azul é uma fotografia famosa da Terra tirada a 7 de dezembro de 1972 durante a missão Apollo 17, quando se encontrava a caminho da Lua e a 29,400 quilómetros da Terra. Русский: Вид Земли с космического корабля Аполлон-17. 7 декабря 1972 года. Українська: Блакитна іграшкова куля — відома фотографія Землі, зроблена 7 грудня 1972 року командою космічного апарату «Аполлон-17». 中文：​蓝色弹珠 是一张在1972年12月7日由阿波罗17号太空船船员所拍摄的著名地球照片。当时太空船正运行至距离地球29,400公里（18,300英里）之处。 日本語: ザ・ブルー・マーブルは、月へ向かうアポロ17号のクルーが1972年12月7日に撮影した有名な地球の写真。29,400km離れた距離から撮影された。アフリカ、アラビア半島、南極大陸、インド洋などを捉えている。 Čeština: Modrá skleněnka je fotografie planety Země, kterou 7. prosince 1972 pořídila posádka Apolla 17 ze vzdálenosti zhruba 29 400 kilometrů. Date 7 December 1972date QS:P571,+1972-12-07T00:00:00Z/11 Source https://web.archive.org/web/20160112123725/http://grin.hq.nasa.gov/ABSTRACTS/GPN-2000-001138.html (image link); see also https://www.nasa.gov/multimedia/imagegallery/image_feature_329.html Other versions [edit] Other versions: Raw photograph, AS17-148-22727, original orientation Raw photograph, AS17-148-22727, north up Rescanned and color-calibrated with mission color chart.3,000×3,000 (5.6 MB) With white background2,790×2,776 (4.4 MB) With transparent background2,790×2,776 (14.64 MB) Larger photoshopped JPEG version; possibly more useful for articles4,463×4,163 (5.9 MB) Color corrected2,320×2,407 (2.33 MB) Image redone with colors2,400x2,400 (3.33 MB) Reversed (allegedly original) orientation3,000×3,002 (9.33 MB) '"The Blue Marble" is a famous photograph of the Earth'2,400x2,400 (2.98 MB) Derivative works: earth600x600 (1.72 MB) GPS atmospheric effects for the Earth Universal gravitational mass for the Earth Order of magnitude for the Sun, Jupiter, Earth, and Moon Earth size comparison for the Moon Earth size comparison for the planet Venus Earth and Moon to scale with annotations Earth-Moon system to scale Origin of life stages Object location26° 19′ 49″ S, 37° 25′ 13″ E View this and other nearby images on: OpenStreetMap-26.330278; 37.420278 This image or video was catalogued by Johnson Space Center of the United States National Aeronautics and Space Administration (NASA) under Photo ID: AS17-148-22727. This tag does not indicate the copyright status of the attached work. A normal copyright tag is still required. See Commons:Licensing. .mw-parser-output .tpl-hidden{clear:both}.mw-parser-output .tpl-hidden>.mw-collapsible-toggle{float:none}.mw-parser-output .tpl-hidden::before{display:none}.mw-parser-output .tpl-hidden.mw-made-collapsible>.mw-collapsible-toggle>.tpl-hidden-arrowtoggle{padding-left:20px;background-image:url("https://upload.wikimedia.org/wikipedia/commons/1/10/MediaWiki_Vector_skin_action_arrow.png");background-position:left 50%;background-repeat:no-repeat}.mw-parser-output .tpl-hidden.mw-made-collapsible.mw-collapsed>.mw-co