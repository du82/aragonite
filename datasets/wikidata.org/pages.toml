e1}.mw-parser-output table.ombox{margin:4px 10%;border-collapse:collapse;border:1px solid var(--border-color-base,#a2a9b1);background-color:var(--background-color-neutral-subtle,#f8f9fa);box-sizing:border-box}.mw-parser-output table.ombox-notice{border:1px solid var(--border-color-base,#a2a9b1)}.mw-parser-output table.ombox-speedy{border:2px solid var(--border-color-error,#b32424);background-color:#fee7e6}.mw-parser-output table.ombox-delete{border:2px solid var(--border-color-error,#b32424)}.mw-parser-output table.ombox-content{border:1px solid #f28500}.mw-parser-output table.ombox-style{border:1px solid var(--border-color-content-removed,#fc3)}.mw-parser-output table.ombox-move{border:1px solid #9932cc}.mw-parser-output table.ombox-protection{border:2px solid var(--border-color-base,#a2a9b1)}.mw-parser-output table.tmbox{margin:4px 10%;border-collapse:collapse;border:1px solid var(--border-color-base,#a2a9b1);background-color:var(--background-color-neutral-subtle,#f8f9fa);min-width:80%;box-sizing:border-box}.mw-parser-output .tmbox.mbox-small{min-width:0}.mw-parser-output .mediawiki .mbox-inside .tmbox{margin:2px 0;width:100%}.mw-parser-output .mbox-inside .tmbox.mbox-small{line-height:1.5em;font-size:100%}.mw-parser-output table.tmbox-speedy{border:2px solid var(--border-color-error,#b32424);background-color:#fee7e6}.mw-parser-output table.tmbox-delete{border:2px solid var(--border-color-error,#b32424)}.mw-parser-output table.tmbox-content{border:2px solid #f28500}.mw-parser-output table.tmbox-style{border:2px solid var(--border-color-content-removed,#fc3)}.mw-parser-output table.tmbox-move{border:2px solid #9932cc}.mw-parser-output table.tmbox-protection{border:1px solid #c0c090}.mw-parser-output table.fmbox{clear:both;margin:0.2em 0;width:100%;border:1px solid var(--border-color-base,#a2a9b1);background-color:var(--background-color-neutral-subtle,#f8f9fa);box-sizing:border-box}.mw-parser-output table.fmbox-system{background-color:var(--background-color-neutral-subtle,#f8f9fa)}.mw-parser-output table.fmbox-warning{border:1px solid #bb7070;background-color:#ffdbdb}.mw-parser-output table.fmbox-editnotice{background-color:transparent}html body.mediawiki .mw-parser-output .mbox-small{clear:right;float:right;margin:4px 0 4px 1em;box-sizing:border-box;width:238px;font-size:88%;line-height:1.25em}html body.mediawiki .mw-parser-output .mbox-small-left{margin:4px 1em 4px 0;box-sizing:border-box;overflow:hidden;width:238px;border-collapse:collapse;font-size:88%;line-height:1.25em}This page in a nutshell: Wikidata is a multilingual project Site content may require translating depending on what it is and how it's used Tools and gadgets are available to make internationalization easier Wikidata is an international and thus multilingual project. While English is the default interface language, the project is intended to be used by, and useful for, users of every language with MediaWiki internationalization support. Contents 1 General principles 2 Site content 2.1 Items and properties 2.2 Statements 2.3 Sitelinks 3 Special pages 4 Items and properties without translation 5 Translating software 6 See also General principles[edit] Wikidata software is fully localized like all Wikimedia projects. Users can set their preferred language via the Preferences menu or the Universal Language Selector by clicking on the following icon found at the top of any page: . Policies and guidelines should be written in English first and then translated to other languages. The English version of the policy or guideline is the authoritative version on which other language versions should be based. Translations can be made with the Translate extension. Documentation for the Translate extension is also available. You can also leave a message at Wikidata:Translators' noticeboard if you have questions or requests. Site content[edit] Universal Language Selector English The data content of Wikidata consists of items and properties that are multilingual where necessary. Items and properties[edit] For items and properties, the labels, descriptions and aliases are all multilingual, meaning they can be displayed to users, and can be entered by users, in every language supported by the software. By default, users will view, add, and edit labels, descriptions, and aliases in their preferred language. The preferred language will also be the default language when creating new Items. Label list Labels, aliases, and descriptions in multiple languages can be easily added to items and properties in one of two ways: By using the #babel template. After setting your language skills with the #babel template (see Help:Navigating Wikidata/User Options for information on how to do this), the labels, aliases, and descriptions for your languages will now appear in the "In more languages" section of the item or property page. You can edit all or any by clicking on the [edit] link. By activating the labelLister gadget in your Preferences menu (see Help:Navigating Wikidata/User Options for more information on activating gadgets). To use the labelLister gadget on an item, click on the "Label List" tab at the top right of the item page (between "Read" and "View history"). After selecting it, you will see a pop-up with a list of all labels, descriptions, and aliases available by language code. Click the [edit] button of the pop-up to update labels, descriptions, and aliases for different languages. It is also possible to see how an item does appear in a specific language, for instance https://www.wikidata.org/wiki/Q10987?uselang=sv. Statements[edit] For statements (including references and qualifiers), the values and properties typically do not need to be translated. When items and properties are added to statements, they will automatically appear in the entity suggester under the appropriate translated labels for whatever language is set for the page. When adding a property or a value to a statement, you may need to enter the unique identifier (Q### or P###) of an item or property if its label has not yet been translated into the page language. When adding Wikimedia Commons files as values, the file name will match whatever follows "File:" regardless of the language of input. For example, for the statement image (P18) → The_Earth_seen_from_Apollo_17.jpg The_Earth_seen_from_Apollo_17.jpg will always appear and display as the file, even when editing in French or Polish. Values that are strings like external standards, database identifiers, or codes, for example ISBNs, patent numbers, and web color and hex triplets, are also language-independent. Sitelinks[edit] Main language first Sitelinks (links to Wikipedia and other Wikimedia pages) are not multilingual—they are shown and entered as on the linked site. The gadget Main language first highlights sitelinks in the language set for the page and sorts them so they appear at the top of the list. This gadget needs to be activated in the Preferences menu. For support in additional languages, select the "Editing" tab in the Preferences menu and add "Assistant languages:" in the "Translation options" section. Special pages[edit] Special:MyLanguageFallbackChain displays your language fallback chain. The fallback chain refers to Wikidata's systematic way of displaying content to you when it is not available in your primary language of preference. For information on its configuration and effect see Help:Navigating Wikidata/User Options#Language fallback chain. Special:Search is a multilingual search engine which allows you to search for items, properties, or pages in any language. Item by title is for searching for items by their page titles on a Wikimedia site. It will only search for items in the selected language of the specified Wikimedia site; the title must be exactly equal to the search value entered. Special pages like Special:AllPages that generate lists of items and/or properties, will show labels according to the language fallback chain, as well as identifiers (Q### for elements, P### for properties). If labels do not exist for any of the languages in your language fallback chain, only the identifier will be shown. Items and properties without translation[edit] As mentioned above, items and properties without labels in your preferred language will be presented using labels from other languages in your language fallback chain, or just as identifiers (Q### or P###) when no label exists in any of your languages. Please feel free to add a translation of labels (and descriptions) in such cases, but make sure the translation is correct. Entities without label can be used as tool for finding items and properties that have no label in a given language. Translating software[edit] The MediaWiki and the Wikibase software can be translated via translatewiki.net. Furthermore several other tools can be translated via the Tool Translate website from Magnus Manske. See also[edit] For related Help pages, see: Help:Navigating Wikidata/User Options, which covers language settings and gadgets For additional information and guidance, see: Project chat, for discussing all and any aspects of Wikidata Wikidata:Glossary, the glossary of terms used in this and other Help pages Help:FAQ, frequently asked questions asked and answered by the Wikidata community Help:Contents, the Help portal featuring all the documentation available for Wikidata <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Help:Multilingual&oldid=1957773438" Categories: Help:MultilingualHelp-en'''
