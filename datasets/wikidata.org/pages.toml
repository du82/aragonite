full_description = '''Wikidata:WikiProject Music From Wikidata Jump to navigation Jump to search Translate this pageOther languages: Bahasa Indonesia Bahasa Melayu Deutsch English Hausa Kadazandusun Nederlands Türkçe català dansk español français italiano polski português svenska Ænglisc čeština беларуская (тарашкевіца) русский українська հայերեն עברית العربية بهاس ملايو বাংলা ગુજરાતી 中文 日本語 ꠍꠤꠟꠐꠤ WikiProject Music The aim of WikiProject Music is: to define a set of properties that can be used by music infoboxes. to map and import all relevant data that currently is spread in Commons, Wikipedia, and Wikisource. to establish methods to interact with this data from different projects. Join us! Chat with us! .mw-parser-output th.mbox-text,.mw-parser-output td.mbox-text{border:none;padding:0.25em 0.9em;width:100%}.mw-parser-output td.mbox-image{border:none;padding:2px 0 2px 0.9em;text-align:center}.mw-parser-output td.mbox-imageright{border:none;padding:2px 0.9em 2px 0;text-align:center}.mw-parser-output td.mbox-empty-cell{border:none;padding:0;width:1px}.mw-parser-output table.ambox{margin:0 10%;border:1px solid var(--border-color-base,#a2a9b1);border-left:10px solid var(--border-color-progressive,#36c);background-color:var(--background-color-interactive-subtle,#f8f9fa);box-sizing:border-box}.mw-parser-output table.ambox+table.ambox{margin-top:-1px}.mw-parser-output .ambox th.mbox-text,.mw-parser-output .ambox td.mbox-text{padding:0.25em 0.5em}.mw-parser-output .ambox td.mbox-image{padding:2px 0 2px 0.5em}.mw-parser-output .ambox td.mbox-imageright{padding:2px 0.5em 2px 0}.mw-parser-output table.ambox-notice{border-left:10px solid var(--border-color-progressive,#36c)}.mw-parser-output table.ambox-speedy{border-left:10px solid var(--border-color-error,#b32424);background-color:#fee7e6}.mw-parser-output table.ambox-delete{border-left:10px solid var(--border-color-error,#b32424)}.mw-parser-output table.ambox-content{border-left:10px solid #f28500}.mw-parser-output table.a