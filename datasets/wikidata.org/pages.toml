}.mw-parser-output .mp-frame-header{background-color:#888;border-radius:.2em;color:#fff;padding:.4em .8em .5em;font-weight:bold}.mw-parser-output .mp-frame-red{background-color:#990000}.mw-parser-output .mp-frame-green{background-color:#339966}.mw-parser-output .mp-frame-blue{background-color:#006699}.mw-parser-output .mp-frame-header:before{display:inline-block;content:"x";color:transparent;width:40px;opacity:.7;background-image:url("https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Wikidata-logo_white.svg/27px-Wikidata-logo_white.svg.png");background-image:url("https://upload.wikimedia.org/wikipedia/commons/5/54/Wikidata-logo_white.svg");background-size:27px;background-repeat:no-repeat;background-position:left center}.mw-parser-output .mw-content-rtl .mp-frame-header:before{background-position:right center}.mw-parser-output .mp-frame-body{padding:1em} Welcome! Wikidata is a free and open knowledge base that can be read and edited by both humans and machines. Wikidata acts as central storage for the structured data of its Wikimedia sister projects including Wikipedia, Wikivoyage, Wiktionary, Wikisource, and others. Wikidata also provides support to many other sites and services beyond just Wikimedia projects! The content of Wikidata is available under a free license, exported using standard formats, and can be interlinked to other open data sets on the linked data web. Get involvedFor a complete starters’ guide, visit the community portal. Learn about Wikidata What is Wikidata? Read the Wikidata introduction. Explore Wikidata by looking at a featured showcase item for author Douglas Adams (Q42). Get started with Wikidata's SPARQL query service. Contribute to Wikidata Learn to edit Wikidata: follow the tutorials. Work with other volunteers on a subject that interests you: join a WikiProject. Individuals and organizations can also donate data. Meet the Wikidata community Visit the community portal or attend a Wikidata event. Create a user account. Talk and ask questions on the Project chat, Telegram groups, or the live IRC chatconnect. Use data from Wikidata Learn how you can retrieve and use data from Wikidata. More... News 2025-01-15: The Wikidata development team held the Q1 Wikidata+Wikibase office hour for 2025. They presented their work from the past quarter and discussed what's coming next for 2025. Session log is available. 2024-11-21: Coming up: Data Reuse Days 2025, an online event focusing on people using Wikidata's data on applications and tools, 18–27 February 2025, online. 2024-10-29: Wikidata is now 12 years old! Happy birthday! 2024-08-28: The one hundred and thirty millionth item, a scholarly article, is created. 2024-05-07: Wikidata records its 231th edit, the revision IDs not fitting into 32-bit signed integer anymore More news... (edit [in English]) Learn about data New to the wonderful world of data? Develop and improve your data literacy through content designed to get you up to speed and feeling comfortable with the fundamentals in no time. Item: Earth (Q2) Property: highest point (P610) custom value: Mount Everest (Q513) Current highlights Gene Hackman (Q150943) (pictured) Betsy Arakawa (Q23799024) Gareth Jones (Q132796674) 2025 Trump–Zelenskyy meeting (Q132831010) Disclosure (Q126683577) Javier Dorado (Q518541) Paula Alvarellos (Q124284923) Discover Innovative applications and contributions from the Wikidata community Featured WikiProject: WikiProject Music Wikiproject Music is home to editors that help add data about artists, music releases, tracks, awards, and performances! Additionally, importing from and linking Wikidata with the many music databases and streaming services is another focus of the project. Read about our data model on our project page and come chat with us on Telegram. More: Check out Wikidata:Tools for some of our best tools and gadgets for using and exploring Wikidata. Know of an interesting project or research conducted using Wikidata? You can nominate content to be featured on the Main page here! Contact Wikidata mailing list Wikidata technical mailing list Discussion requests for specific topics Facebook, Mastodon, X/Twitter Leave a message at project chat Telegram General Chat, Telegram Help or on IRCconnect Report a technical problem Keep up-to-date: Weekly summaries Wikidata is part of the non-profit, multilingual, free-content Wikimedia family. Wikipedia – Encyclopedia Wiktionary – Dictionary and thesaurus Wikibooks – Textbooks, manuals, and cookbooks Wikinews – News Wikiquote – Collection of quotations Wikisource – Library Wikiversity – Learning resources Wikivoyage – Travel guides Wikispecies – Directory of species Wikifunctions – Free software functions Wikimedia Commons – Media repository Incubator – New language versions Meta-Wiki – Wikimedia project coordination MediaWiki – Software documentation <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Wikidata:Main_Page&oldid=1816946465" Category: Wikidata'''
