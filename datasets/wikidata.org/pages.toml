exeme with the highest L number at the moment is: 2 March 2025 04:5004:50, 2 March 2025 飛翔/ひしょう (L1417174) (hist) [1,512 bytes] Higa4 (talk | contribs) (‎Created a new Lexeme) Tag: Wikidata user interface Wikidata item creation progress Current news Feel free to add to this list anything that is considered news-worthy. (Just remember that it's transcluded to the Main Page!) 2025-01-15: The Wikidata development team held the Q1 Wikidata+Wikibase office hour for 2025. They presented their work from the past quarter and discussed what's coming next for 2025. Session log is available. 2024-11-21: Coming up: Data Reuse Days 2025, an online event focusing on people using Wikidata's data on applications and tools, 18–27 February 2025, online. 2024-10-29: Wikidata is now 12 years old! Happy birthday! 2024-08-28: The one hundred and thirty millionth item, a scholarly article, is created. 2024-05-07: Wikidata records its 231th edit, the revision IDs not fitting into 32-bit signed integer anymore .mw-parser-output .tocright{float:right;clear:right;margin-bottom:.5em;padding:.5em 0 .8em 1.4em;background:none}Contents 1 Current news 2 Older entries 2.1 2024 2.2 2023 2.3 2022 2.4 2021 2.5 2020 2.6 2019 2.6.1 September 2.6.2 August 2.6.3 March 2.6.4 January 2.7 2018 2.7.1 October 2.7.2 April 2.7.3 March 2.8 2017 2.8.1 November 2.8.2 June 2.8.3 May 2.8.4 April 2.9 2016 2.9.1 October 2.9.2 May 2.9.3 April 2.9.4 February 2.10 2015 2.10.1 October 2.10.2 September 2.10.3 July 2.10.4 June 2.10.5 May 2.10.6 February 2.11 2014 2.11.1 December 2.11.2 November 2.11.3 October 2.11.4 August 2.11.5 July 2.11.6 June 2.11.7 April 2.11.8 March 2.11.9 February 2.11.10 January 2.12 2013 2.12.1 December 2.12.2 November 2.12.3 October 2.12.4 September 2.12.5 August 2.12.6 July 2.12.7 June 2.12.8 May 2.12.9 April 2.12.10 March 2.12.11 February 2.12.12 January 2.13 2012 2.13.1 December 2.13.2 November 2.13.3 October 3 Milestones 3.1 Items 3.2 Properties 3.3 Lexemes 3.4 Schemas 3.5 Edits Older entries 2024 2024-10-15: The Wikidata development team held the Q4 office hours on October 16 at 16:00 UTC. They talked about what they've been working on in the past quarter. Session log is available. 2024-07-10: The Wikidata development team held the Q3 Wikidata+Wikibase office hour on July 10th at 16:00 UTC. They presented their work from the past quarter and discussed what's coming next for Q3. Find the session log here. 2024-04-10: The development team at WMDE held the 2024 Q2 Wikidata+Wikibase office hour in the Wikidata Telegram group. You can read session log. 2024-07-10: Wikidata records its 2,200,000,000th edit. 2024-04: Wikidata held the Leveling Up Days, an online event focused on learning more about how to contribute to Wikidata from the 5th to 7th and 12th to 14th of April. 2024-03-12: Wikidata records its 2,100,000,000th edit. 2024-01-24: Wikidata tool QuickStatements (Q20084080) ran its batch 222222. 2024-01-17: The Wikidata development team held Wikidata+Wikibase office hour, talking about what they've been working on. Find the session log here. 2023 2023-11-30: Wikidata holds the Data Modelling Days, an online event focused on how to describe and organise data in Wikidata, from the 30th of November to the 2nd of December. 2023-10-29: Wikidata is now 11 years old! Happy birthday! 2023-10-18: The Wikidata development team talk about what they've been working on in the office hours at 16:00 UTC on Telegram. 2023-05-13: Wikidata tool QuickStatements (Q20084080) ran its batch 200000. 2022 2022-11-09: The Wikidata development team talk about what they've been working on in the office hours at 17:00 UTC on Telegram. 2022-10-29: Wikidata is now 10 years old! Happy birthday! 2022-10-03: Wikidata tool QuickStatements (Q20084080) ran its batch 100000, tagging documents for Project Riksdagen's documents (Q114364300). 2022-07-27: The Wikidata development team talk about what they've been working on in the office hours at 17:00 UTC on Telegram. 2022-07-21: Lua access for lexemes is now available on all Wikimedia projects. 2022-07: Wikidata holds the Data Quality Days, a series of online events focusing on data quality, from the 8th to the 10th. 2022-04-20: The Wikidata development team talk about what they've been working on in the office hours at 17:00 UTC on Telegram. 2022-03: Wikidata holds the Data Reuse Days, a series of online events focusing on data reuse, from the 14th to the 24th. 2022-01-19: The Wikidata development team talk about what they've been working on in the office hours at 17:00 UTC on Telegram. 2021 2021-10-29: Wikidata turns 9! Happy birthday! 2021-10: WikidataCon 2021 takes place online from the 29th to the 31st. 2021-09: Wikidata holds the Data Quality Days, a series of online events focusing on data quality, from the 8th to the 15th. 2020 On October 29th, we celebrate Wikidata's 8th birthday. You can have a look at the events organized by the community, the presents and messages. 2019 September 2019-09-20: Wikidata passed 8 billion triples (source) August 2019-08-09: Entity schemas are enabled on Wikidata. March 2019-03-21: Link support with Wikimania has been added (The discussion) January 2019-01-19: Wikidata passed 7 billion triples (source) 2018 October 2018-10-29: Wikidata celebrates its sixth birthday! 2018-10-18: Senses are now part of Lexicographical Data. April 2018-04-20: Wikidata passed 5 billion triples (source) 2018-04-12: The deployment of the first version of lexicographical data is planned for end of May 2018. March 2018-03-03: The deployment of the first version of lexicographical data is planned for April 2018. 2017 November 2017-11-30: Wikidata passed 4 billion triples (source) June 2017-06-20: Phase 1 of Wiktionary has launched. Now you can link Wiktionary pages with every item for all the Wiktionaries namespaces (except main, citations, user and talk). 2017-06-01: Phase 1 of Wiktionary is planned to start June 20th. May 2017-05-15: Tabular data datatype has launched. April 2017-04-24: Geographic shape datatype has launched. 2017-04-24: Phase 0 (automatic interwiki links) of Wiktionary has launched. 2017-04-05: Phase 0 (automatic interwiki links) of Wiktionary is planned to start April 24th, 2017, check out the coordination page. 2016 October 2016-10-29: Wikidata celebrates its fourth birthday! May 2016-05-11: ArticlePlaceholder has launched. 2016-05-04: Phase 2 of Wikiversity has launched. April 2016-04-26: Arbitrary access is deployed to Wikimedia Commons. February 2016-02-23: Phase 1 of Wikiversity has launched. 2016-02-16: The datatype identifier has launched, and the "in other projects" sidebar is enabled by default on all projects except Dutch Wikipedia. 2016-02-09: The mathematical expression datatype has launched. 2016-02-01: Wikiversity deployment planned to start February 23rd, check out the coordination page. 2015 October 2015-10-29: Wikidata turns three years old. Read about the past year and what is coming next. 2015-10-20: Meta, Wikispecies and MediaWiki get access to the sitelinks on Wikidata. September 2015-09-22: Phase 2 of Wikibooks has launched. 2015-09-16: Arbitrary access is deployed to every Wikimedia wikis that phase 2 supported except Wikimedia Commons. 2015-09-09: Meta, MediaWiki.org and Wikispecies deployment planned to start October 20th. 2015-09-09: Unit support has launched. 2015-09-09: Usage tracking is deployed to every Wikimedia wikis that phase 1 supported. July 2015-07-07: Wikibase Quality Extensions have launched. Now we can view the constraint report of an item. June 2015-06-01: Arbitrary access for Italian Wikipedia and all remaining Wikisource projects has launched. May 2015-05-11: Arbitrary access for Dutch Wikipedia and French Wikisource has launched. 2015-05-06: Arbitrary access for Dutch Wikipedia and French Wikisource is planned to start May 11th. February 2015-02-24: Phase 1 of Wikibooks has launched. Now you can link Wikibooks pages with every item. 2015-02-06: Wikibooks deployment planned to start February 24th, check out the coordination page. 2014 December 2014-12-17: Language fallbacks and property datatype have launched. 2014-12-16: Google announces the closure of Freebase and migration to Wikidata 2014-12-03: Statements on properties have launched. In addition, when you delete a page on a Wikimedia project, Wikidata will automatically update. 2014-12-02: Phase 2 of Wikimedia Commons has launched. November 2014-11-04: Wikidata wins the Open Data Award by the Open Data Institute in the category Publisher October 2014-10-29: Wikidata turns two! August 2014-08-19: Sitelink to Wikinews and Wikidata, badges, redirects between items, and monolingual text datatype have launched. July 2014-07-22: Wikinews deployment planned to start August 19th, check out the coordination page. June 2014-06-10: Phase 2 of Wikiquote has launched. April 2014-04-08: Phase 1 of Wikiquote has launched. Now you can link Wikiquote pages with every item. March 2014-03-07: Wikiquote deployment planned to start April 8th, check out the coordination page. February 2014-02-25: Phase 2 of Wikisource has launched to allow data access, and performance improvements were deployed. January January 31, 2014: The quantities datatype is introduced. January 14, 2014: Phase 1 of Wikisource has launched. Now you can link Wikisource pages with every item. 2013 December December 31, 2013: User:Dexbot became the first bot to reach 10,000,000 edits in one Wikimedia project. December 10, 2013: Ordering, ranks and a table of content have launched. November November 2, 2013: Wikisource deployment planned to start January 13th, 2014, check out the coordination page. October October 29, 2013: Wikidata celebrates its first birthday! September September 23, 2013: Phase 1 of Commons has launched. Now you can link Wikimedia Commons pages with every item. September 16, 2013: The first 2 Wikidata oversighters are elected, Ajraddatz and Rschen7754. September 10, 2013: The URL datatype is now available, and can be used with the reference URL (P854) and official website (P856) properties. September 8, 2013: Wikimedia Commons deployment planned to start September 23rd, check out the coordination page. August August 26, 2013: Phase 2 of Wikidata has gone live on Wikivoyage. July July 23, 2013: Phase 1 of Wikidata has gone live on Wikivoyage. In addition, when you move a page on Wikivoyage, Wikidata will automatically update. (This long-awaited feature will be available on Wikipedia as well on the 25th.) July 5, 2013: Wikivoyage deployment planned to start July 23rd, check out the coordination page. June June 10, 2013: The coordinates datatype is now available, and can be used with the coordinate location (P625) property, as it currently is on the New York City item. May May 29, 2013: The long-awaited time datatype is now available, allowing important properties such as date of birth (P569) and date of death (P570). (See George Washington's item, for instance.) April April 24, 2013: Phase 2 of Wikidata is deployed across all editions of Wikipedia. April 18/19 2013: A software update has introduced qualifiers and case-insensitive searches. April 12, 2013: The first 2 Wikidata bureaucrats are elected. These are Bene* and Vogone. April 4, 2013: Property "P107 (P107)" has been used 1000000 times. March March 6, 2013: Phase 1 of Wikidata goes live on the remaining 282 editions of Wikipedia. In addition, more features and bugfixes are deployed, including a new datatype, "string". February February 18, 2013: New features and bugfixes rolled out. February 13, 2013: Wikidata phase 1 goes live on the English Wikipedia, with Wikidata language links supplementing locally-hosted ones. February 4, 2013: Phase 2 of Wikidata commences, allowing the creation of properties, and of statements for items. For more information, please see Wikidata:Infoboxes task force and Wikidata:Property proposal. January January 30, 2013: Wikidata phase 1 goes live on the Hebrew and Italian Wikipedias. Additionally, the labels and descriptions task force succeeds in creating English labels for all of the first 20,000 items. January 24, 2013: All of the articles of French Wikipedia have items in Wikidata. January 14, 2013: Wikidata phase 1 goes live on the Hungarian Wikipedia, with Wikidata language links supplementing locally-hosted ones. 2012 December December 5, 2012: Wikidata has been updated with lots of bugfixes and a new Special:EntitiesWithoutLabel. For all changes see https://gerrit.wikimedia.org. November November 8, 2012: The first set of local temporary administrators are elected. October October 29, 2012: Wikidata is launched. Several bugs have been fixed and the Wikidata repository should be functional. Please report errors! October 26, 2012: The Wikidata database is created but is not available for editing yet. Milestones Items 2024-03-19: The one hundred and twenty-five millionth item, about the Martha Speaks episode "Martha's Chair / TD the Pack Rat", is created. 2023-12-25: The one hundred and twenty-four mill'''
