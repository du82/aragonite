title = "Event talk:Data Reuse Days 2025 - Wikidata"
full_description = "Event talk:Data Reuse Days 2025 From Wikidata Jump to navigation Jump to search Overview Program Register Participants Discussions Discussions related to the Data Reuse Days are welcome here. If you have any question or need support (for example, to propose a session), feel free to contact Lea Lacroix (WMDE) directly (lea.lacroixwikimedia.de or @Auregann on Telegram). Announcements about the event are talking place here as well as on the Wikidata Telegram group. .mw-parser-output .navbox{border:1px solid var(--border-color-base,#a2a9b1);width:100%;margin:auto;clear:both;font-size:88%;text-align:center;padding:1px}.mw-parser-output .navbox-inner,.mw-parser-output .navbox-subgroup{width:100%}.mw-parser-output .navbox-group,.mw-parser-output .navbox-title,.mw-parser-output .navbox-abovebelow{padding:0.25em 1em;line-height:1.5em;text-align:center}.mw-parser-output th.navbox-group{white-space:nowrap;text-align:right}.mw-parser-output .navbox,.mw-parser-output .navbox-subgroup{background:#fdfdfd}.mw-parser-output .navbox-list{line-height:1.8em;border-color:#fdfdfd}.mw-parser-output .navbox th,.mw-parser-output .navbox-title{background:#ccccff}.mw-parser-output .navbox-abovebelow,.mw-parser-output th.navbox-group,.mw-parser-output .navbox-subgroup .navbox-title{background:#ddddff}.mw-parser-output .navbox-subgroup .navbox-group,.mw-parser-output .navbox-subgroup .navbox-abovebelow{background:#e6e6ff}.mw-parser-output .navbox-even{background:#f7f7f7}.mw-parser-output .navbox-odd{background:transparent}.mw-parser-output table.navbox+table.navbox{margin-top:-1px}.mw-parser-output .navbox .hlist td dl,.mw-parser-output .navbox .hlist td ol,.mw-parser-output .navbox .hlist td ul,.mw-parser-output .navbox td.hlist dl,.mw-parser-output .navbox td.hlist ol,.mw-parser-output .navbox td.hlist ul{padding:0.125em 0}.mw-parser-output ol+table.navbox,.mw-parser-output ul+table.navbox{margin-top:0.5em} Program proposals (concluded) Contents 1 Template for program proposal 2 Expounder - generating wikis for my enthusiasms 3 Creating an open fact-checking ecosystem in Brazil 4 GLAMorous Europe - Dating the GLAMs of your neighbours 5 Reusing data from the Wikidata Lexeme Dump in Turtle Format 6 Snowman + Wikidata: Website from scratch 7 Scribe: Wikidata Language Learning Keyboards and Lexeme Extraction 8 WikiFlix, the free video streaming portal 9 Model Context Protocol for Wikidata 10 Govdirectory: How we monitor data quality and changes 11 Data round-tripping with authority files 12 Wikidata use in KDE Itinerary 13 Mapping Libraries in Uganda 14 Paulina - Data for the public domain 15 Using Wikidata to provide background information to application users 16 Leveraging Wikidata for Ontological Mappings in SSSOM 17 169k Reasons to Care: Wikidata’s Role in Open Library Author Pages 18 mlscore - Multilinguality score of Wikidata items and properties 19 Mathematics and Wikidata 20 vglist in application showcase 21 Data Reuse Days (18-27 February): check out the program! 22 Register to the Wikidata Data Reuse Days, starting next week! 23 Data Reuse Days: coming next and how to attend 24 Data Reuse Days: replay videos & access link Template for program proposal[edit] Here's a template you can use for proposing a session for the Data Reuse Days 2025. Feel free to copy its content and create a new section below! (use the session title as the section title). Please note that sessions are not automatically accepted: because we have limited slots in the schedule, we will make a selection of sessions that can make it to the program of the event. You can propose a session until January 12th. Here's what we're looking for in particular: Short presentations/demos of a tool or application using Wikidata's data Discussions and presentations aiming to connect Wikidata editors with reusers Explanation and demos on how to use the technical infrastructure to reuse Wikidata's data (Query Service, APIs, dumps, etc.) Thanks in advance for your proposals! Lea Lacroix (WMDE) (talk) 08:29, 20 November 2024 (UTC)[reply] Session title: Format: Speaker(s) or facilitator(s): Short description of the session: Prerequisite knowledge: Suggestions of time and date: Preferred presentation mode: Expounder - generating wikis for my enthusiasms[edit] Session title: Expounder - generating wikis for my enthusiasms Format: Presentation + Q&A (25min) Speaker: John Bray (Vicarage) Short description of the session: My Expounder software allows offline generation of gazetteer pages displayed through mediawiki. Used for disparate topics like military history, spaceflight, science fiction and places to visit on holiday. Uses static json and tweaked Mediawiki extensions. Can handle 100k pages, strong on cross-linking, document, image and map display. Prerequisite knowledge: None Suggestions of time and date: Not Wed, Thu Preferred presentation mode: Live Hi @Vicarage: and thanks for your proposal! Due to limited time available, we're offering you a 10min presentation in the lightning talk session #1 on February 21st, would that work for you? Please let me know so I can confirm the slot :) You'll receive further information to prepare your session by email in the ucoming days. Lea Lacroix (WMDE) (talk) 08:42, 21 January 2025 (UTC)[reply] 10 minutes is too short. If I can't get the longer slot I asked for I will withdraw. Vicarage (talk) 09:32, 21 January 2025 (UTC)[reply] Hi @Vicarage:, I understand. However, we decided that we didn't want to allocate additional time to that topic. I'm removing it from the LTs for now, let me know if you change your mind, it would still be possible to add it back. Sorry and thanks for your understanding. Lea Lacroix (WMDE) (talk) 13:20, 23 January 2025 (UTC)[reply] Creating an open fact-checking ecosystem in Brazil[edit] Session title: Creating an open fact-checking ecosystem in Brazil Format: Presentation + Q&A (25min) Speaker(s) or facilitator(s): Mateus Santos (User:TheSocialDev) and Tamiris T. Volcean Short description of the session: AletheiaFact.org is an open-source software and platform committed to open-data that is being used as infrastructure for democratising fact-checking in Brazil. The platform uses Wikidata to link Personality profiles and add topics to the curated data to enhance the knowledge and context about each fact-checking report posted in the platform. In this talk we are going to explain why Wikidata is important to our software and how we plan to expand its usage in the future. Prerequisite knowledge: None Suggestions of time and date: No preference Preferred presentation mode: Live Proposal by AletheiaFact Hi @AletheiaFact: @TheSocialDev: and thanks for your proposal! Due to limited time available, we're offering you a 10min presentation in the lightning talk session #2 on February 26th, would that work for you? Please let me know so I can confirm the slot :) You'll receive further information to prepare your session by email in the ucoming days. Thanks, Lea Lacroix (WMDE) (talk) 08:49, 21 January 2025 (UTC)[reply] Thank you somuch 182.239.92.208 19:14, 24 January 2025 (UTC)[reply] GLAMorous Europe - Dating the GLAMs of your neighbours[edit] Session title: GLAMorous Europe - Dating the GLAMs of your neighbours Format: Presentation + Q&A (15min) Speaker(s) or facilitator(s): Anne Mühlich (and Gerd Müller) (User: Digitalwarenkombinat) Short description of the session: GLAMorous Europe is an open-source webapp bringing together users and Wikidata-integrated digital collections from European GLAM institutions in a creative way. Apart from presenting the project we will also talk about the advantages and disadventages of using Wikidata-APIs. Prerequisite knowledge: None Suggestions of time and date: Friday, February 21st or Monday, February 24th (no other days possible) Preferred presentation mode: Live Hi @Digitalwarenkombinat: and thanks for your proposal! Due to limited time available, we're offering you a 10min presentation in the lightning talk session #1 on February 21st, would that work for you? Please let me know so I can confirm the slot :) You'll receive further information to prepare your session by email in the ucoming days. Lea Lacroix (WMDE) (talk) 08:45, 21 January 2025 (UTC)[reply] Hej @Lea Lacroix (WMDE), that fits for us. I herewith confirm the lightning talk on February 21st. :) See you there! Digitalwarenkombinat (talk) 18:53, 22 January 2025 (UTC)[reply] Reusing data from the Wikidata Lexeme Dump in Turtle Format[edit] Session title: Reusing data from the Wikidata Lexeme Dump in Turtle Format Format: Presentation + Q&A (25 min) Speakers: User:Hogü-456 and User:Dnshitobu Short description of the session: Presentation of a collection of scripts to reuse the Wikidata Lexeme Dump in Turtle Format Prerequisite knowledge: None Suggestions of time and date: will follow soon Preferred presentation mode: Live Hi @Hogü-456: and @Dnshitobu: and thanks a lot for your proposal. Unfortunately, we have to decline it as the topic of Lexemes and Turtle is a bit too specific for this particular event. Nevertheless, we hope you can attend the event, participate in the Q&A sessions and take the occasion to discuss with other tool builders. Thanks for your understanding, Lea Lacroix (WMDE) (talk) 08:54, 21 January 2025 (UTC)[reply] Snowman + Wikidata: Website from scratch[edit] Session title: Snowman + Wikidata: Website from scratch Format: Live coding + Presentation (60 minutes) Speaker(s) or facilitator(s): User:Abbe98 Short description of the session: In this one hour live coding session we will create a small website showcasing glacier data in Wikidata. At the end of the session our website will have individual glacier pages with images, an interactive map, and a few different pages listing glaciers by their attributes. We will be using Snowman, a static site generator for SPARQL services. After the session you will be ready to learn advanced Snowman topics like multilinguality, search, CD/CI integrations, and much more so that you can make your Wikidata projects a reality quicker than ever! Prerequisite knowledge: SPARQL, HTML, basic command line experience Suggestions of time and date: none Preferred presentation mode: Live Hi @Abbe98: and thanks a lot for the proposal! We scheduled the livecoding session on February 19th, I hope that works for you. On that day we expect lots of newcomers and people who are curious of building Wikidata-based applications, since it's right after the general introduction, so make sure you explain terms and what you're doing during the session :) I'll send further speaker info by email in the upcoming days. Talk to you soon, Lea Lacroix (WMDE) (talk) 08:59, 21 January 2025 (UTC)[reply] Hi! February 19th works very well! Thank you for highlighting that it's just after the general introduction I will make sure to take that into account. Abbe98 (talk) 09:58, 21 January 2025 (UTC)[reply] Scribe: Wikidata Language Learning Keyboards and Lexeme Extraction[edit] Session title: Scribe: Wikidata Language Learning Keyboards and Lexeme Extraction Format: Presentation + Q&A (25 min) Speaker(s) or facilitator(s): AndrewTavis (will be expanded) Short description of the session: Scribe was first introduced to the Wikidata community at Data Reuse Days 2022, and its community is very happy to return again for the next edition :) We have many things to discuss this time around: - A quick presentation of the iOS application Scribe - Language Keyboards - The current state of Scribe-Android that we hope to release in mid 2025 - A presentation of the current state of Scribe-Data, our Wikidata language packs (German nouns, French verbs, etc) extraction CLI - A quick discussion of the language pack Toolforge API Scribe-Server After the demos we'd be happy to discuss future plans for the Scribe community and answer any questions from the Wikidata community including those who might be interested in working on Scribe applications :) Feedback on the projects from the Wikidata community would be more than welcome in the Q&A! Prerequisite knowledge: None Suggestions of time and date: Open Preferred presentation mode: Live AndrewTavis (talk) 20:34, 19 December 2024 (UTC)[reply] Hi @AndrewTavis: and thanks a lot for your proposals! Due to the limited available time, I'd like to offer you to combine both sessions in one: you could start with presenting Scribe, the state of development and community, then go more into details about the technical setup. I tentatively scheduled the session on February 26th. Let me know if it works for you, and feel free to rewrite the title and abstract by editing the schedule table directly! You know where to find me if you have questions :) Lea Lacroix (WMDE) (talk) 09:01, 21 January 2025 (UTC)[reply] Hello, @Lea Lacroix (WMDE)! Sorry for the wait here :) Combined the sessions as you suggested, and the 26th should work well on our end :D Thanks as always for your help! AndrewTavis (talk) 15:48, 27 January 2025 (UTC)[reply] WikiFlix, the free video streaming portal[edit] Session title: WikiFlix, the free video streaming portal Format: resentation + Q&A (25 min) Speaker(s) or facilitator(s): Magnus Manske (talk) Short description of the session: WikiFlix is a video streaming site that uses Wikidata to find freely available movies, mostly older public domain classics and some Creative Commons-licensed ones. The videos are hosted on Wikimedia Commons, YouTube, or the Internet Archive. Currently, over 3600 movies are available on WikiFlix. Prerequisite knowledge: None Suggestions of time and date: Preferred presentation mode: Live Magnus Manske (talk) 12:07, 20 December 2024 (UTC)[reply] Hi @Magnus Manske: and thanks for your proposal! We scheduled it on February 25th at 18:30 UTC, can you check your calendar and let me know whether that works for you? Thanks a lot and looking forward to have you at the event! Lea Lacroix (WMDE) (talk) 09:05, 21 January 2025 (UTC)[reply] Hi Lea, that works well for me, thanks! --Magnus Manske (talk) 18:11, 21 January 2025 (UTC)[reply] Model Context Protocol for Wikidata[edit] Session title: Model Context Protocol for Wikidata Format: Demo + Q&A (30min) Speaker(s) or facilitator(s): DErenrich-WMF (talk) 00:10, 3 January 2025 (UTC)[reply] Short description of the session: How can casual users access information from Wikidata via LLMs? We present a tool that can help with this. Prerequisite knowledge: Basic knowledge of Wikidata and use of LLMs like ChatGPT Suggestions of time and date: Something convenient for Pacific time? Preferred presentation mode: Live or Recorded DErenrich-WMF (talk) 00:10, 3 January 2025 (UTC)[reply] Hi @DErenrich-WMF: and thanks a lot for your proposal! We scheduled it on February 24th at 18:00 UTC. Can you check the date and time and let me know if that works for you? Thanks a lot! I'll share more information to speakers by email in the upcoming days. Best, Lea Lacroix (WMDE) (talk) 09:07, 21 January 2025 (UTC)[reply] Yeah that works for me"
