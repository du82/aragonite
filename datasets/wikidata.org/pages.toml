title = "Wikidata:Events - Wikidata"
full_description = '''Wikidata:Events From Wikidata Jump to navigation Jump to search Translate this page; This page contains changes. Please contact a translation admin to mark them for translation.Other languages: Bahasa Indonesia Bahasa Melayu Deutsch English Kadazandusun Lëtzebuergesch Nederlands Tyap Türkçe català dansk español français hrvatski italiano magyar nuõrttsääʹmǩiõll polski português slovenščina suomi svenska čeština ślůnski Ελληνικά беларуская (тарашкевіца) български македонски русский српски / srpski тоҷикӣ українська עברית العربية بهاس ملايو فارسی مصرى کٲشُر বাংলা தமிழ் ไทย 中文 日本語 한국어 Do you want to meet other Wikidata editors, attend a workshop or organize one? Don't hesitate to add a section on this page or use the talk page to suggest ideas! To help us advertise the event, please consider adding it to the next issue of the weekly newsletter. If you are planning a workshop for Wikidata editors, see Wikidata:Planning a Wikidata workshop. You can also join the Wikidata Events Telegram group. Contents 1 Upcoming events 2 Active regular meetups 3 Other meetups 4 Office hours 5 Wikidata bug triage hour 6 Past events 7 See also Upcoming events[edit] If you're adding an event here, please consider adding it to the next issue of the newsletter as well! Some events (conferences) can be entered in Wikidata. You can find them on this page on Scholia, as well as related submission deadlines. Coordinate Me 2024 – Wikidata competition for geolocatable content, May 1-31, 2024 Wikidata's Twelfth Birthday, October-November Wikidata Day NYC 2024, October 26, 2024 MediaWiki Users and Developers Conference Fall 2024, November 4-6, 2024. (Feel free to submit a talk or workshop related to Wikidata) Data Reuse Days, 18-27 February 2025 AAFRennes2025, 26-28 Mars 2025 Active regular meetups[edit] Wikidata workshops and meetings in Vienna. See the detailed program on Wikidata:Events/Vienna and Wikidata:Events/Vienna/WikidataWednesday Wikidata workshops and meetings in Taiwan. See the detailed program on meta:Wikidata Taiwan 2025 event and Wikidata:Events/Taiwan. Regular Wikidata Talks events in Istanbul. See the detailed program on Wikidata:Events/Istanbul. Weekly meetings in Swedish online. See the detailed program on Wikidata:Events/Swedish online editathon. Other meetups[edit] These groups may not be active, or maybe the pages are not up-to-date. Feel free to contact the editors to revive the meetups! Wikidata:Events/Paris held in Paris every third Friday of the month (see the detailed program) - Note: Inactive, last meeting took place in March 2020. Wikidata:Events/Kampala Wikidata meetup in Berlin Regular Wikidata events are held in Tartu. See the detailed program on Wikidata:Events/Tartu. Regular meetups in Zurich: Wikidata:Events/Wikidata Zurich Meetup - Note: Inactive, last meeting took place in 2018. Events in the rest of Switzerland on Wikidata:Events/Switzerland - Note: Inactive, last meeting took place in 2020. Events and workshops in Mexico on Wikidata:Events/Mexico Events and workshops in Argentina on Wikidata:Events/Argentina Ada Lovelace Day and Women Scientists 2021 Office hours[edit] The Wikidata and Wikibase office hours are online events where the development team present what they have been working on over the past quarter, and the community is welcome to ask questions and discuss important issues related to the development of Wikidata and Wikibase. They are announced on the Wikidata mailing list and in the Weekly Summary. Next: April 16th (1800 CEST) Where: Wikidata Telegram group Previous: January 15th (see also the list of all previous sessions and notes) Wikidata bug triage hour[edit] The bug triage hour is an online event where the product manager of Wikidata publicly works on triaging development tasks (typically on Phabricator), improving their descriptions, defining their priority, and collecting the wishes and needs from the Wikidata community. This experiment is part of the improvements on the support process, starting in February 2021. The event is open to anyone who is interested in the development of Wikidata. When joining the event, the participants commit on following the Code of Conduct for technical spaces. Next bug triage hour: 15 April 2024 Date and time: Monday, April 15, at 18:00 CET (16:00 UTC, see other time zones), during one hour Place: Jitsi Meet Topic: Mobile statement editing Speaker: Lydia Pintscher Moderation and time-keeping: Léa Lacroix, Mohammed Abdulai Language: English (German and French also possible) Preparation: bring your favorite Phabricator task related to mobile statement editing! Main rules: In order to keep the discussions easy to follow, please keep your microphone muted, and interact in the text chat. Recording and documentation: the event is not recorded, collaborative notes can be taken by participants here This event is in an experimental phase: the format, tools used, and many other things are still going to evolve in the future. If you have ideas, suggestions or issues, feel free to contact Léa. Documentation of previous sessions: Etherpad Past events[edit] You can find a (probably incomplete) list of past events and office hours on the archive page. See also[edit] Wikidata:Training Wikidata:WikiProject Events <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Wikidata:Events&oldid=2318581940" Categories: Pages using the JsonConfig extensionWikidata EventsWikidata:EventsWikidata-en'''
