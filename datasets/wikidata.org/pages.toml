full_description = '''Wikidata:Tours From Wikidata Jump to navigation Jump to search Translate this page; This page contains changes. Please contact a translation admin to mark them for translation.Other languages:Bahasa Indonesia Bahasa Melayu Cymraeg Deutsch English Esperanto Frysk Gaeilge Gàidhlig Kadazandusun Latina Malagasy Nederlands Scots Simple English Tiếng Việt Türkçe Yorùbá asturianu azərbaycanca català dansk eesti español euskara français galego hrvatski interlingua italiano lietuvių magyar norsk bokmål polski português português do Brasil română shqip suomi svenska čeština ślůnski Ελληνικά български македонски русский српски / srpski татарча / tatarça українська қазақша հայերեն עברית اردو العربية بهاس ملايو فارسی مصرى پښتو भोजपुरी हिन्दी বাংলা ਪੰਜਾਬੀ ગુજરાતી தமிழ் తెలుగు ಕನ್ನಡ മലയാളം ไทย ᐃᓄᒃᑎᑐᑦ / inuktitut 中文 日本語 粵語 閩南語 / Bân-lâm-gú 한국어 .mw-parser-output .wd-box{background-color:var(--background-color-base,#fff);border:thin solid var(--border-color-base,#a2a9b1);border-collapse:collapse;border-radius:0.2rem;box-shadow:2px 3px 4px 1px var(--border-color-base,#a2a9b1);box-sizing:border-box;margin:1.25rem auto 2rem;min-width:97.5%}.mw-parser-output .wd-box .wd-box-header{color:var(--color-subtle,#54595d);font-size:2.2em;padding:1rem 1.5rem 0.5rem}.mw-parser-output .wd-box .wd-box-image-cell{padding:0.8rem 1.5rem 0;width:3.5rem}.mw-parser-output .wd-box .wd-box-subheader{color:var(--color-subtle,#54595d);font-size:1.2em;padding:0.5rem 1.5rem 0.75rem}.mw-parser-output .wd-box .wd-box-description{color:var(--color-subtle,#54595d);font-size:0.975rem;padding:0.5rem 1.5rem 0.75rem}.mw-parser-output .wd-box .wd-box-text{padding:0.75rem 1.5rem} Wikidata ToursWelcome to Wikidata Tours. The tours will show you how Wikidata works and teach you how to add data. Wikidata works a bit differently from a typical article-centered wiki like Wikipedia, so even if you've used a wiki before or you're coming to us from another Wikimedia project please take the tours. Each tour will take around 5 minutes to complete and works over the desktop version. Please Note: Terms of use pop-up IP warning pop-up By clicking on the "Start this tutorial" button, automatic edits will be performed by your user account. While the pages edited as part of the tours are not real item pages, your activity will still be recorded in the revision history of each page. If you do not have a Wikidata user account, or if you have one but have not logged in, your computer's IP address will be recorded in the page history as having made the edit. If you don't want your IP address logged so that everyone can see it, or if you would like to prevent seeing this IP warning pop-up for future edits, please create an account and/or log in before starting a tour. When editing Wikidata for the first time (or if editing while not logged in), you will encounter the Terms of use pop-up. To prevent seeing this pop-up for future edits, please select the "Do not show this message again" option. To read the terms of use now, before starting a tour, click here. Thank you for your interest in Wikidata:Tours. All feedback can be left at talk page. Wikidata Basics Learn the basics of Wikidata, how Wikidata works, how it is structured and the different parts of the structure. Items This tour provides a beginner-friendly introduction to editing Wikidata. It covers "items", the basic units that represent knowledge in Wikidata, and will help you edit your first item. Start this tutorial Edit or translate this tour Statements This tour includes advanced editing on Wikidata and how to create statements for items. This tour is the second one in a series; please take the Items Tour first if you haven't already. Start this tutorial Edit or translate this tour References In this tour, you’ll learn how to add references to help more high quality data be added to Wikidata. A reference (or source) describes the origin of a statement in Wikidata. Start this tutorial Edit or translate this tour More tours coming soon More tours are being added here on, please check back soon. Wikidata activities These tours take you through different common activities you can do on Wikidata, we recommend if you're new to Wikidata that you do the basics tours first. Coordinates This tour will take you through the steps for adding coordinates to items about places. Start this tutorial Edit or translate this tour Images This tour will take you through the steps for adding an image to a Wikidata item Start this tutorial Edit or translate this tour Inception date This tour will take you through the steps for adding an inception date to items. Start this tutorial Edit or translate this tour Official website This tour will take you through the steps for adding an official website to items. Start this tutorial Edit or translate this tour Administrative territory This tour will take you through the steps for adding an administrative territory to items for places. Start this tutorial Edit or translate this tour More tours coming soon More tours are being added here on, please check back soon. Creating and requesting brand new tours To request a new tour or to learn how to create tours please click here. <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Wikidata:Tours&oldid=2311153712" Categories: Wikidata:ToursWikidata-en'''
