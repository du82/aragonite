title = "Wikidata:Contribute - Wikidata"
full_description = '''Wikidata:Contribute From Wikidata Jump to navigation Jump to search Translate this page Other languages:Acèh Afrikaans Bahasa Indonesia Bahasa Melayu British English Deutsch Deutsch (Sie-Form) English Esperanto Frysk Lëtzebuergesch Nederlands Ripoarisch Tiếng Việt Türkçe bosanski català dansk dolnoserbski español euskara français føroyskt hornjoserbsce hrvatski italiano kurdî kurdî (latînî) latviešu lietuvių magyar norsk bokmål occitan oʻzbekcha / ўзбекча polski português português do Brasil shqip suomi svenska čeština Ελληνικά беларуская беларуская (тарашкевіца) български македонски русский српски / srpski тоҷикӣ українська հայերեն עברית اردو العربية بهاس ملايو تونسي سنڌي فارسی پښتو नेपाली भोजपुरी मराठी हिन्दी বাংলা ਪੰਜਾਬੀ ગુજરાતી தமிழ் తెలుగు ಕನ್ನಡ മലയാളം မြန်မာဘာသာ ქართული 中文 日本語 粵語 閩南語 / Bân-lâm-gú 한국어 Welcome! We're very happy to have you here! Wikidata is a multilingual knowledge base of structured data that anyone can edit. The project relies on the efforts of people — just like you! — from all around the world who work together to collect and maintain data in more than 200 languages. There are many opportunities for contributing to Wikidata, from improving and translating documentation to planning and proposing new properties in support of data. If you're looking for ways to get involved, please see below for an overview of the different roles and activities available, and browse the suggested and open tasks available. If the roles listed below are not a good fit for you, or you're having a hard time deciding where your interests lie, please talk to someone on the Wikidata team (specifically Lydia). Editors You can directly edit data on item pages. Add statements, qualifiers and sources to enrich the Wikidata knowledge base. Help with migrating language links to support centralized access for all Wikimedia Foundation projects. To learn how to get started, see Help:Items to learn how to add or edit items, or follow an interactive tutorial at Wikidata:Tours. Updating Help pages and improving documentation, for example by adding examples and screenshots, is another great way you can support the Wikidata community. Developers As a developer you can either contribute to Wikibase, the extension that powers Wikidata, directly or write things on top of it. If you are interested in writing bots that work on Wikidata please check out the Bots page. Ambassadors Ambassadors spread the word about Wikidata to others, answer questions about the project, and serve as educational resources for Wikidata. They encourage Wikidata collaboration on other sister projects you are active on, help update the weekly summary, or participate in Wikidata discussions on one of the mailinglists and Twitter, and provide support to other contributors on the IRC channelconnect. If you are interested in giving a talk at a meet-up or conference or organizing a Wikidata event, Lydia Pintscher (WMDE) can provide you with slides, flyers and other material you might find useful. Project members WikiProjects are groups of contributors who want to work together as a team to improve Wikidata. These groups often focus on a specific topic area (for example, astronomy) or a specific kind of task (for example, solving problems related to disambiguation pages). To find a WikiProject that reflects your interests or to propose a new one that doesn't yet exist, visit WikiProjects. As a contributor to Wikipedia, Wikivoyage, Wikisource, or any other one of Wikidata's sister projects, you can give valuable input on a lot of decisions that have to be made during development and deployment. To join in planning and discussions, or to help with integration of Wikidata on sister projects, navigate to sister projects. Translators As a translator you can translate Wikibase, the extension that powers Wikidata, on translatewiki.net. In addition you can help by translating documentation and information pages about Wikidata here and also on Meta. For more information for Wikidata translators, see the translators' noticeboard. Data owners If you have data that you want to contribute to Wikidata please see the page about data donation. It is possible to enter data into Wikidata by hand and through a bot via an API. For the latter please review our API and Bots pages. <img src="https://login.wikimedia.org/wiki/Special:CentralAutoLogin/start?useformat=desktop&amp;type=1x1&amp;usesul3=0" alt="" width="1" height="1" style="border: none; position: absolute;"> Retrieved from "https://www.wikidata.org/w/index.php?title=Wikidata:Contribute&oldid=1666407188" Categories: Wikidata:ContributeWikidata-en'''
