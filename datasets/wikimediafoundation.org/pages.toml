title = "Accessibility statement – Wikimedia Foundation"
description = "The Wikimedia Foundation is committed to ensuring digital accessibility for people with disabilities. We are continually improving the user experience for everyone, and applying the relevant accessibility standards. This accessibility statement covers the Wikimedia Foundation website, located at wikimediafoundation.org. Conformance status The Web Content Accessibility Guidelines (WCAG) defines requirements for designers and developers to improve…."
full_description = "The Wikimedia Foundation is committed to ensuring digital accessibility for people with disabilities. We are continually improving the user experience for everyone, and applying the relevant accessibility standards. This accessibility statement covers the Wikimedia Foundation website, located at wikimediafoundation.org. Conformance status The Web Content Accessibility Guidelines (WCAG) defines requirements for designers and developers to improve accessibility for people with disabilities. It defines three levels of conformance: Level A, Level AA, and Level AAA. Wikimedia Foundation website is partially conformant with WCAG 2.1 level AA. Partially conformant means that some parts of the content do not fully conform to the accessibility standards. Feedback We welcome your feedback on the accessibility of Wikimedia Foundation website. Please let us know if you encounter accessibility barriers on Wikimedia Foundation website: E-mail: accessibility@wikimedia.org Online: https://meta.wikimedia.org/wiki/Talk:Wikimedia_Foundation_website Help us unlock the world’s knowledge.As a nonprofit, Wikipedia and our related free knowledge projects are powered primarily through donations.Donate now Contact usQuestions about the Wikimedia Foundation or our projects? Get in touch with our team.ContactFollow Facebook Instagram Bluesky LinkedIn Photo credits Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
