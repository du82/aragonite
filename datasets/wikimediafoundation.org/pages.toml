title = "家 – 维基媒体基金会"
description = "維基媒體基金會為免費知識提供必要的基礎設施。 我們管理維基百科。這是一個免費的在線百科全書，由世界各地的志願者創建和編輯，以及許多其他重要的社群項目和計劃。 我們興幸有像您這樣的志願者參與和捐款，讓分享免費和自由的知識這個願景才得以實現。我們歡迎任何與我們分享願景的人加入我們，共同收集和分享代表人類多樣性的知識。 保護和維持維基百科 安全捐款 1 維基媒體項目屬於每個人的 這意味著您可以使用它，調整它，或分享您在維基媒體網站上找到的內容。 請不要填寫自己的簡歷，或複製/粘貼內容到你的功課。 2 我們尊重您的數據 我們不會將您的電子郵件地址或任何個人信息出售給第三方。 有關我們的隱私慣例的更多信息，請參閱維基媒體基金會隱私政策，捐贈者隱私政策，數據保留指南。 3 像你這樣的人保持維基百科準確 讀者們驗證事實。 文章由志願者社群使用可靠來源協作創建和編輯，因此沒有任何一個人或公司擁有維基百科上的文章。 維基媒體基金會不會編寫或編輯，但其他人可以提供幫助。 4 並非所有維基都是與維基媒體基金會有關 “Wiki”一詞是指使用協作編輯軟件構建的網站。數百個與維基百科或維基媒體基金會沒有任何關係的組織和項目也使用該術語，當中包括wikiHow和Wikileaks。儘管這些組織和項目都在名稱中使用“維基”一詞，但它們始終是與維基媒體基金會完全無關聯的。 280,000+ 編輯每個月都會為維基媒體項目做出貢獻 100+ 多萬 維基共享資源上的媒體文件 超过 1.5 亿 獨特的設備每月訪問維基媒體項目 我們的志願者構建工具，分享照片，撰寫文章，並努力將所有知識聯繫起來。 維基百科 世界各地志願者用300種語言撰寫的免費百科全書。 維基共享資源 世界上最大的免費圖庫，照片，圖畫，視頻和音樂庫。 縱觀歷史，知識一直由少數人控制。 維基百科需要來自所有語言和文化的知識。 互聯網已經成為獲取信息的默認設施。 我們邀請您幫助糾正歷史。"
full_description = "想象一下这样的世界：在这个世界中，人人都能在知识的海洋中自由分享。这就是我们的承诺。Stell dir eine Welt vor, in der jeder einzelne Mensch frei an der Summe allen Wissens teilhaben kann. Das ist unsere Verpflichtung.Imagine a world in which every single human being can freely share in the sum of all knowledge. That’s our commitment.Представьте себе мир, в котором каждый человек обладает свободным доступом ко всем накопленным человечеством знаниям. Мы создаём такой мир. 維基媒體基金會為免費知識提供必要的基礎設施。 我們管理維基百科。這是一個免費的在線百科全書，由世界各地的志願者創建和編輯，以及許多其他重要的社群項目和計劃。 我們興幸有像您這樣的志願者參與和捐款，讓分享免費和自由的知識這個願景才得以實現。我們歡迎任何與我們分享願景的人加入我們，共同收集和分享代表人類多樣性的知識。 保護和維持維基百科 現在捐款 安全捐款 中文EnglishالعربيةFrançaisРусскийEspañolDeutsch 1 維基媒體項目屬於每個人的 這意味著您可以使用它，調整它，或分享您在維基媒體網站上找到的內容。 請不要填寫自己的簡歷，或複製/粘貼內容到你的功課。 2 我們尊重您的數據 我們不會將您的電子郵件地址或任何個人信息出售給第三方。 有關我們的隱私慣例的更多信息，請參閱維基媒體基金會隱私政策，捐贈者隱私政策，數據保留指南。 3 像你這樣的人保持維基百科準確 讀者們驗證事實。 文章由志願者社群使用可靠來源協作創建和編輯，因此沒有任何一個人或公司擁有維基百科上的文章。 維基媒體基金會不會編寫或編輯，但其他人可以提供幫助。 4 並非所有維基都是與維基媒體基金會有關 “Wiki”一詞是指使用協作編輯軟件構建的網站。數百個與維基百科或維基媒體基金會沒有任何關係的組織和項目也使用該術語，當中包括wikiHow和Wikileaks。儘管這些組織和項目都在名稱中使用“維基”一詞，但它們始終是與維基媒體基金會完全無關聯的。 280,000+ 編輯每個月都會為維基媒體項目做出貢獻 發推文 100+ 多萬 維基共享資源上的媒體文件 發推文 超过 1.5 亿 獨特的設備每月訪問維基媒體項目 發推文 研究我們開展自己的研究，並與全球研究人員合作，共同應對社會和技術的變化。更多關於研究 技術從站點可靠性到機器學習，我們的開源技術使維基百科在全球範圍內更快，更可靠，更易於訪問。更多關於技術 倡導我們努力保護每個人獲得自由和開放知識的權利。更多關於倡導 項目 協作項目是維基媒體運動的核心。 我們的志願者構建工具，分享照片，撰寫文章，並努力將所有知識聯繫起來。 查看所有項目 維基百科 世界各地志願者用300種語言撰寫的免費百科全書。 访问維基百科 維基共享資源 世界上最大的免費圖庫，照片，圖畫，視頻和音樂庫。 访问維基共享資源 最新動態 看看我們一直在做什麼 維基百科的新聲音徽標：宣布「全人類知識之聲」競賽的獲勝者 Communications Foundation 這篇文章同適用於以下語言： العربيَّة · English · Français · Deutsch · हिन्दी · Bahasa Indonesia · Português · русский язык · Español 2023 年 3 月 28 日 —— 今天，運營維基百科和其他維基媒體專案的非營利組織維基媒體基金會宣布了其全球「全人類知識之聲」競賽的獲勝者，結束了為維基百科和維基媒體專案尋找聲音徽標的旅程。 Thaddeus Osborne 提交的作品由維基媒體志願貢獻者的社群投票選為獲勝者。 「音樂一直是我生活的重要組成部分，也是我從我居住的小鎮後院『 環遊世界』的一種方式。 每首音樂都將我帶到了一個新的地方，並教會了我一些新的東西，」Thaddeus Osborne 在贏得比賽時說道。 「作為維基百科的忠實粉絲，我堅信該平台對可靠和免費資訊的承諾對我們在全球取得成功至關重要。 通過融入我的聲音，我希望使維基百科更易於訪問和吸引人，使讀者 [和現在的聽眾] 能夠踏上他們自己的發現和知識之旅。 隨著更多答案和信息觸手可及，我們可以解決重大問題並為所有人創造更光明的未來。」 日間，Thaddeus Osborne 在美國維珍尼亞州擔任核能工程師。 到了晚上，他為了好玩而製作音樂。 Thaddeus 的音樂經歷主要是自學的，他自大學以來就在業餘時間探索音樂理論和製作技巧。 他提交的內容包括翻書、鍵盤點擊和合成器的提示音，在維基媒體志願者編輯於 12 月舉行的社群投票後被確定為獲勝者。 聲音徽標，同稱為聲音品牌或聲音商標，利用一小段聲音來代表視聽和純音頻設置中的品牌。它們隨著全球音頻技術的興起越來越受歡迎，活躍的語音助手用戶數量從 2015 年的 5.441 億用戶增長到 2021 年的 26…. 28 March 2023 By Wikimedia Foundation Read more 開始搜索全人類知識之聲開始!：旨在為維基百科和維基媒體專案確定第一個聲音徽標的全球比賽 Communications 這篇文章同時可以以以下語言閱讀: اَلْعَرَبِيَّةُ, Bahasa Indonesia, Deutsch, English, Español, Français, हिंदी, Русский, Português, & 한국어. 更新資訊：「全人類知識之聲」聲音徽標競賽的提交現已結束。 請於 12 月 6 日至 19 日在維基共享資源上對前 10 名聲音徽標進行投票，獲勝者將於 2023 年公佈。在 9 月 13 日至 10 月 10 日期間，我們收到了來自 135 個國家/地區的 2,094 名參與者的 3,235 份提交。 如行為了解有關結果的更多信息，請參閱我們 Diff 的文章。 2022 年 9 月 13 —— 今天，支援維基百科和維基媒體專案的非營利組織維基媒體基金會正在發起「全人類知識之聲」——這是一場為維基百科和維基媒體專案尋找聲音徽標的全球比賽。從即日起至 10 月 10 日，您可在 soundlogo.wikimedia.org 上提交作品。 聲音徽標，同時稱為聲音商標或聲音標誌，是利用簡短的聲音集合來代表視聽和純音頻設置中的品牌。隨著全球音頻技術的興起，聲音徽標越來越受歡迎，主動語音助手的用戶數量從 2015 年的…. 14 September 2022 By Wikimedia Foundation Read more 維基媒體是自由知識的英雄。 May Hachem 自2013年以來的編輯, 維基媒體社群 Vitor Mazuco 自2009年以來的編輯, 維基媒體社群 Christine Meyer 自2007年以來的編輯, 維基媒體社群 縱觀歷史，知識一直由少數人控制。 維基百科需要來自所有語言和文化的知識。 互聯網已經成為獲取信息的默認設施。 我們邀請您幫助糾正歷史。 加入運動 幫助我們釋放世界的知識。作為一個非營利組織，維基百科和我們相關的免費知識項目主要通過捐贈來實現。現在捐款 Verbindung 了解維基媒體基金會的最新信息 聯繫人有關維基媒體基金會或我們項目的問題？ 與我們的團隊取得聯繫。Contact關注 Facebook Instagram Bluesky LinkedIn 照片來源 Sound of All Human Knowledge winner announcement press release image Wikimedia Foundation CC BY-SA 4.0 Wikimedia Sound Logo press release image-05 Wikimedia Foundation CC BY-SA 4.0 May Mohamed Hisham Hashem File provided by Wikimedia Commons Ruby Mizrahi CC BY-SA 3.0 Vitor Mazuco File provided by Wikimedia Commons Matthew (WMF) CC BY-SA 3.0 Sesame Street Spaghetti Space Chase File provided by Wikimedia Commons Walter Lim from Singapore CC BY 2.0 Set Knowledge Free mural illustration File provided by Wikimedia Commons Tomi Um / Wikimedia Foundation CC BY-SA 4.0 Papaul_Tshibamba-3 File provided by Wikimedia Commons Victor Grigas CC BY SA 3.0 SOPA protest in Midtown NYC File