full_description = "“Straight out of a mystery”: The winners of Wiki Loves Earth 2024 Community Photo Contest The 12th annual edition of the globe-trotting photo contest has announced this year's winners. 23 December 2024 By Wikimedia Foundation Read more “Where time stands still”: The winners of Wiki Loves Monuments 2023 Community Photo Contest Out of nearly 200,000 submissions from 4,700 participants in 45+ countries, fifteen winning images were announced today in the fourteenth annual Wiki Loves Monuments photography contest. 26 March 2024 By Wikimedia Foundation Read more Birds, bugs, and beauty: The winners of Wiki Loves Earth 2023 Community Photo Contest The international Wiki Loves Earth photo contest has announced the winners of its 2023 edition. 13 December 2023 By Wikimedia Foundation Read more Making Wikipedia Safer: Enforcement Guidelines for Wikimedia Universal Code of Conduct provide a model for governing online behavior Free Knowledge Media Projects/Initiatives Volunteers Wikipedia The Board of Trustees of the Wikimedia Foundation has unanimously approved enforcement guidelines for the first-of-its kind Universal Code of Conduct (UCoC). The code, which was developed hand in hand with more than 1500 Wikimedia project volunteers, outlines global standards for behavior across Wikipedia and all Wikimedia projects to prevent and address harassment and other negative behavior. 21 March 2023 By Wikimedia Foundation Read more SusunW is on a mission to write women into history with Wikipedia Community Equity Gender Equity OTK Stories Women's History Month Today, scientists can tell us with certainty that increased carbon dioxide emissions are warming the planet. But who was the first to discover this, and when did that happen? I’ll bet it’s earlier than you think. Meet Eunice Newton Foote: a 19th century American scientist, inventor, and women’s rights activist whose contributions to climate science…. 14 March 2023 By Ed Erhart Read more Women Do News: Tackling the Gender Divide in Journalism Through Wikipedia Community Equity Gender Equity OTK Stories Women's History Month The gender gap is a pervasive issue that has garnered attention in recent years, particularly in relation to the global pay inequality between men and women. However, this disparity is not limited to pay; it persists across various issues and industries, including the newsroom. For example, despite some progress, just four out of ten US…. 14 March 2023 By Barbara Kandek Read more Six years, 100,000 articles: WikiGap is on a mission to close Wikipedia’s gender gap Community Equity Gender Equity OTK Stories Sweden Women's History Month It’s possible that right now, as you read these words, a WikiGap event is being held in a Swedish embassy somewhere in the world. Created through a joint effort from the Swedish Ministry of Foreign Affairs and Wikimedia Sverige, an independent Wikimedia movement affiliate organization in Sweden, WikiGap edit-a-thon events bring people together across countries…. 8 March 2023 By Ed Erhart Read more How Art+Feminism is using Wikipedia to promote equity in the art world Community Equity Gender Equity OTK Stories Women's History Month If you were asked to name the greatest artists in history, who would come to mind? Chances are, the first few names that pop into your head are men. “Whereas men experience presence in our art institutions, women experience primarily absence,” Judy Chicago, an American feminist artist describes, “except in images that do not necessarily…. 7 March 2023 By Barbara Kandek Read more Closing the gender gap: Women in Red’s efforts to add more women to Wikipedia Community Equity Gender Equity OTK Stories Women's History Month All of the information found on Wikipedia is created and shared by volunteers around the world. However, since 2020, only 15% of these contributors are women. This imbalance has a real impact on how information is covered and presented on the world’s largest online encyclopedia. This problem is often called the “gender gap” and is…. 1 March 2023 By Barbara Kandek Read more Kelly Doyle Kim and this new Smithsonian museum are writing women into Wikipedia Community Equity Gender Equity OTK Stories Women's History Month It’s called the ‘great man theory‘: the idea that large swaths of human history can be explained by the actions of so-called great men. These days, that theory has been resoundingly discredited—but popular history’s long reliance on it has contributed towards an imbalance of stories told about women in the history learned in schools and…. 1 March 2023 By Ed Erhart Read more 1 2 3 … 24 Older"
