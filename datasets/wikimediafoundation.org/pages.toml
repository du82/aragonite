full_description = "Wikipedia Recognized as a Digital Public Good Advocacy Wikimedia Foundation The UN-endorsed Digital Public Goods Alliance has added Wikipedia to its registry, affirming the important role its volunteer editors play in making the internet better for everyone. 12 February 2025 By Wikimedia Foundation Read more Ahead of UN General Assembly, Wikipedia nonprofit calls on governments to ensure the future internet is shaped by communities for the public interest Advocacy Events Global Digital Compact Wikimedia Foundation 21 September 2024, New York USA ― As UN Member States are gathering in New York for the 79th United Nations General Assembly, the Wikimedia Foundation, the nonprofit that hosts Wikipedia and other Wikimedia projects, is calling on governments and the UN to ensure that stakeholders from all sectors can work together in deciding how…. 21 September 2024 By Wikimedia Foundation Read more Carta aberta para proteger a Wikipédia e outros projetos de interesse público no Pacto Digital Global Advocacy Uma nova carta aberta da Fundação Wikimedia, a organização sem fins lucrativos que opera a Wikipédia e outros projetos Wikimedia, e afiliadas do Movimento Wikimedia ao redor do mundo, apela aos Estados Membros da ONU para protegerem a Wikipédia e outros projetos de interesse público no futuro Pacto Digital Global. 24 April 2024 By Wikimedia Read more Wikimedia Foundation and global communities call on UN Member States to protect Wikipedia and other public interest projects in the Global Digital Compact Advocacy Global Digital Compact New open letter calls for UN Member States to include three key commitments in the Global Digital Compact that can allow public interest projects and the people who create them to thrive. 23 April 2024 By Wikimedia Foundation Read more Open letter to protect Wikipedia and other public interest projects in the Global Digital Compact Advocacy A new open letter from the Wikimedia Foundation, the nonprofit that operates Wikipedia and other Wikimedia projects, and Wikimedia affiliates around the world calls on UN Member States to protect Wikipedia and other public interest projects in the forthcoming Global Digital Compact. 23 April 2024 By Wikimedia Read more Wikimedia Foundation calls for protection and fair treatment of Wikipedia as UK Online Safety Bill becomes law Advocacy Governments Media NGOs Northern and Western Europe Partners Policy makers Press Release United Kingdom The Wikimedia Foundation is calling on the UK government and independent regulator to ensure the implementation of the Online Safety Bill does not harm Wikipedia, and other projects that the public relies on to create and access free, reliable knowledge. 19 September 2023 By Wikimedia Foundation Read more For third time, China blocks Wikimedia Foundation as permanent observer to the World Intellectual Property Organization (WIPO) Advocacy Press Release The Wikimedia Foundation was rejected for the third time from gaining accreditation as a permanent observer to the World Intellectual Property Organization (WIPO). 7 July 2023 By Wikimedia Foundation Read more Protect the future of Wikipedia in the UK Advocacy Blog Post Policy makers United Kingdom The UK Online Safety Bill threatens the future of Wikipedia, a vital knowledge resource for people across the country. We are calling on UK government leaders to protect the online encyclopaedia now. 29 June 2023 By Lucy Crompton-Reid and Rebecca MacKinnon Read more Wikimedia Foundation blocked once again by China for accreditation to World Intellectual Property Organization (WIPO) Advocacy China Free Knowledge Press Release Yesterday, the Wikimedia Foundation was rejected for accreditation to the World Intellectual Property Organization’s (WIPO) Standing Committee on Copyright and Related Rights (SCCR). The accreditation was once again blocked by China, marking the fourth time that China has raised objections to the Wikimedia Foundation and Wikimedia affiliate groups participating in WIPO. 14 March 2023 By Wikimedia Foundation Read more U.S. Supreme Court Declines to Hear Wikimedia Foundation’s Challenge to NSA Mass Surveillance Advocacy Legal Press Release Wikimedia v. NSA The U.S. Supreme Court today denied the Wikimedia Foundation’s petition for review of its legal challenge to the National Security Agency’s (NSA) “Upstream” surveillance program. Under this program, the NSA systematically searches the contents of internet traffic entering and leaving the United States, including Americans’ private emails, messages, and web communications. 21 February 2023 By Wikimedia Foundation Read more 1 2 3 … 5 Older"
