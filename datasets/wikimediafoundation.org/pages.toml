["https://wikimediafoundation.org/about/jobs"]
title = "Work with us – Wikimedia Foundation"
description = "Questions about the Wikimedia Foundation or our projects? Get in touch with our team."
full_description = "Make the internet a better place for free knowledge. Table of Contents Navigate within this page. Advancement Advancement Communications Finance and Administration Legal People Department Product & Technology Values Diversity, Equity and Inclusion Commitment Equal Employment Opportunity Statement United States Benefits and Perks Current Hiring Locations Compensation Philosophy Applicant Privacy Policy Advancement Senior Program Delivery Specialist, Fundraising (Contract) Remote We are looking for a Senior Program Delivery Specialist, Fundraising to join our team, reporting to the Online Strategic Projects Lead in the Fundraising department. In this role, you will play a key part in coordinating efforts across the Online Fundraising, Fundraising Tech, Major Gifts, and Fundraising Operations teams. You will also be working closely with teams in Product and Technology, to deliver impactful resourcing programs at the Foundation. Communications Movement Communications Specialist, Product & Tech Remote The Movement Communications Specialist will report to the Senior Manager or Product Ambassadors Manager on the Movement Communications Team. They will embed with the Product & Tech teams as required, working closely with their Product Manager and other staff, to craft and execute communications strategies, facilitate two-way dialog about software design and priorities, and strengthen overall trust between the Foundation and Wikimedia communities. They are involved at all stages of the product lifecycle, from bringing community perspective into product design, gathering feedback during development, supporting use and improvements during maintenance, and facilitating deprecation when needed. They tell the story of our products for a global audience, boosting use and love of Wikimedia products among Wikimedia contributors. Senior Movement Communications Specialist, Product & Tech (Contractor) Remote The Senior Movement Communications Specialist (Contractor) will report to the Senior Manager or Product Ambassadors Manager on the Movement Communications Team. They will embed with the Product & Tech teams as required, working closely with their Product Manager and other staff, to craft and execute communications strategies, facilitate two-way dialog about software design and priorities, and strengthen overall trust between the Foundation and Wikimedia communities. They are involved at all stages of the product lifecycle, from bringing community perspective into product design, gathering feedback during development, supporting use and improvements during maintenance, and facilitating deprecation when needed. They tell the story of our products for a global audience, boosting use and love of Wikimedia products among Wikimedia contributors. Finance and Administration Check back soon! Legal Check back soon! People Department Check back soon! Product & Technology Engineering Manager, Trust and Safety Product Remote The Wikimedia Foundation is looking for an Engineering Manager to join and lead the Trust and Safety Product Team. This role involves directly managing an engineering team and partnering with multiple collaborators and stakeholders to execute complex projects in the Trust and Safety space. The team works on building solutions that enable us to protect our communities, users, and our systems from all kinds of attacks and abuse while ensuring that we operate in compliance with various regulatory requirements. Engineering Manager, Testing Platform Remote The Wikimedia Foundation is looking for an experienced Engineering Manager to lead our Testing Platform team. The team purpose is to provide the foundation for software engineers to self-service on quality practices by providing tools and frameworks to write tests and testing environments to execute them. Manager, User Experience Research Remote We’re hiring a UX Research Manager strongly committed to the principles of free knowledge, human-centered research, open source and open data, transparency, privacy, and collaboration to join the Research team. As our UX Research Manager you will be leading and supporting a small and talented team of design researchers and a program manager to oversee research that informs and advances Wikipedia’s product, technology, and design developments across more than 300 languages. Software Engineer III, Content Transform Team Remote The Wikimedia Foundation is looking for a software engineer to join our team, reporting to engineering management. On the Content Transform team, we work to support and evolve all things wikitext, the markup language behind Wikipedia. We aim to make wikitext easier to write, faster to parse, and less error-prone for humans. We also strive to support editing and content analysis tools with structured representations. We also maintain the web services associated with content rendering and transformation. Engineering Manager, Software Quality & Documentation Services Remote The Wikimedia Foundation (WMF) is looking for an experienced Engineering Manager to lead two teams who are providing testing & documentation services to multiple WMF engineering teams while fostering a culture where Software Quality & Documentation is everyone’s responsibilities. Software Engineer (Trust & Safety Team) Remote The Wikimedia Foundation is looking for a software engineer to join the Trust and Safety Product team. As a software engineer, you will be responsible for building features to keep our communities safe from abuse, harassment, vandalism, and harmful or illicit content. In this role, you will work in a fully-remote, geographically-distributed environment, where we value teamwork and a consensus-oriented approach. You will be writing open source code for collaborative experiences supporting over a billion users at a place that believes we’re all more successful when everyone has a good work-life balance. Senior Database Administrator Remote The Wikimedia Foundation is seeking a Senior DBA. Our objective is to make the sum of all human knowledge available to everyone, and we persist most of this knowledge in MariaDB. Our project sites are some of the most highly visited on the internet, with more page views per engineer than any other site. Staff Software Security Engineer (PHP) Remote The Wikimedia Foundation is looking for a Staff Security Software Engineer to join the Product Security team to build new security technologies to protect Wikipedia and our other projects. This is a very hands-on engineering role working alongside our other security team members to design and code new features to protect and reassure our users and to ensure the platform remains resilient against attacks. Senior Software Security Engineer Remote The Wikimedia Foundation is looking for a Senior Software Security Engineer (PHP) to join the Product Security team to build new security technologies to protect Wikipedia and our other projects. This is a very hands-on engineering role working alongside our other security team members to design and code new features to protect and reassure our users and to ensure the platform remains resilient against attacks. Values We are in this mission together We do great work and improve We welcome everyone who shares our Vision and Values We listen and share with curiosity Read more about our values. Diversity, Equity and Inclusion Commitment We trust our personal and organizational accountability We envision a world in which every single person can freely share in the sum of all knowledge. We believe knowledge belongs to everyone, and in order to empower people from diverse backgrounds to participate in the collaborative creation of knowledge, we need to build diverse teams that reflect the communities we support and an inclusive culture of belonging that embraces the potential of our diversity. We believe in co-creating safe, respectful and collaborative work spaces. We aspire to generate a sense of belonging by understanding each and everyone’s differences, contexts and experiences. Through our actions, we ensure that the staff at the Foundation has a healthy work environment where they can flourish. We acknowledge diversity as a core value that is essential to fulfilling our mission. We are an equal opportunity employer and do not tolerate any form of discrimination. This enables us to attract, develop, and retain amazing talent. We are committed to cherishing our differences, and putting people first. We seek to foster a creative environment that unleashes innovative solutions toward building a more inclusive and equitable hiring and retention process. This commitment starts at the top of our organization and moves through every level of hiring from managers to individual contributors. We strive to ensure excellence in our work by building this path together. Equal Employment Opportunity Statement As an equal opportunity employer, the Wikimedia Foundation values having a diverse workforce and continuously strives to maintain an inclusive and equitable workplace. We encourage people with a diverse range of backgrounds to apply. We do not discriminate against any person based upon their race, traits historically associated with race, religion, color, national origin, sex, pregnancy or related medical conditions, parental status, sexual orientation, gender identity, gender expression, age, status as a protected veteran, status as an individual with a disability, genetic information, or any other legally protected characteristics. If you are a qualified applicant requiring assistance or an accommodation to complete any step of the application process due to a disability, you may contact us at recruiting@wikimedia.org or +1 (415) 839-6885. United States Benefits and Perks Health Care Benefits Fully paid medical, dental, and vision insurance premiums for employees and their eligible families. New Parent Leave We provide a total of 16 weeks of paid new parent leave, plus an additional 8 weeks of paid pregnancy leave. Wellness Reimbursement Program We provide $450 per quarter up to $1,800.00 a year for reimbursement for staff wellness expenses, such as gym fees, educational expenses, and more! Professional Development Program We offer reimbursement of conferences, college/university classes, online programs, and books related to work that supports the Wikimedia Foundation. 401(k) Retirement Plan 401(k) retirement plan with matched contributions up to 4% of annual salary. Time Off Generous paid time off policy which includes: vacation days, holidays, sick leave, and volunteer days. Pre-tax Savings Plans For health care, child care, elder care, public transport, and parking expenses. Includes an employer funded HSA option. Disability & Life Insurance Long and short term disability, life insurance (2x salary) and an employee assistance program. Equipment Stipend Equipment including a laptop, monitor, plus a one-time $600 stipend to cover any additional needs to make sure you have the best work from home experience. *Please note that for remote roles located outside of the U.S., we defer to our EOR (Employer of Record) to ensure alignment with local labor laws. Current Hiring Locations The Wikimedia Foundation is a remote-first organization with staff members including contractors based in 40+ countries. Please note that we are currently able to hire in the following countries: Australia, Austria, Bangladesh, Belgium, Brazil, Canada, Colombia, Costa Rica, Croatia, Czech Republic, Denmark, Egypt, Estonia, Finland, France, Germany, Ghana, Greece, India, Indonesia, Ireland, Israel, Italy, Kenya, Mexico, Netherlands, Nigeria, Peru, Poland, Singapore, South Africa, Spain, Sweden, Switzerland, Uganda, United Arab Emirates, United Kingdom, United States of America and Uruguay. We periodically review this list to streamline to ensure alignment with our hiring requirements. Our non-US based employees are hired through a local third party Employer of Record (EOR). Compensation Philosophy Salaries at the Wikimedia Foundation are set in a way that is competitive, equitable, and consistent with our values and culture. In compliance with local legislation within the US, we post the anticipated annual pay range for each position for applicants with multiple individualized factors, including cost of living in the location, being the determinants of the offered pay. For applicants located outside of the US, the pay range will be adjusted to the country of hire. We neither ask for nor take into consideration the salary history of applicants. The compensation for a successful applicant will be based on their skills, experience and location. All applicants can reach out to their recruiter to understand more about the specific pay range for their location during the interview process. Applicant Privacy Policy The Wikimedia Foundation (“Wikimedia“) values your trust and is committed to the responsible management, use and protection of personal information. This Applicant Privacy Policy (“Policy“) describes our practices regarding the information that we collect in connection to your application for a job or internship with Wikimedia. Learn more about our Applicant Privacy Policy. Help us unlock the world’s knowledge.As a nonprofit, Wikipedia and our related free knowledge projects are powered primarily through donations.Donate now Contact usQuestions about the Wikimedia Foundation or our projects? Get in touch with our team.ContactFollow Facebook Instagram Bluesky LinkedIn Photo credits Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
