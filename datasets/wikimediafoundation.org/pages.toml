title = "Our Work – Wikimedia Foundation"
description = "Questions about the Wikimedia Foundation or our projects? Get in touch with our team."
full_description = "Our WorkWe help everyone share in the sum of all knowledge.We are the people who keep knowledge free. There is an amazing community of people around the world that makes great projects like Wikipedia. We help them do that work. We take care of the technical infrastructure, the legal challenges, and the growing pains. Host free knowledge projectsThe Wikimedia Foundation was established as a nonprofit in 2003 to give Wikipedia a permanent home. We now host 14 collaborative free knowledge projects, from Wikipedia, the free encyclopedia, to Wikidata, a set of structured data, and more. We maintain the servers, build the software, and design the technology that keep these projects running. Deliver grants for goodWe partner with Wikimedia communities around the world to provide them with the support they need to do great work. Last year we awarded over 9 million USD in grants to Wikimedia community members, affiliates and nonprofit organizations. We fund editathons, outreach efforts, events, and conferences. We help them get the word out for free knowledge. Grow community around the worldWhen more people can access and contribute to free knowledge, the better that knowledge reflects the world. We are committed to helping grow and sustain a healthy community of over 220,000 people across 170 nations. From the community health initiative to ORES and our work in gender diversity, the Foundation is actively working to make our projects more inclusive. Support education and learning worldwideWe help teachers and students of all ages access and use the full potential of Wikimedia projects for their learning objectives. Key pillars of our education work include promoting knowledge equity and teaching 21st century skills. Partner for changeWorking with partners like Google, the Biodiversity Heritage Library, and UNESCO, Wikimedia actively seeks new knowledge, closing systemic gaps in global understanding of science, culture, language, and identity. The Wikipedia Library partners the world’s top publishers with Wikipedia. Open the Knowledge“Open the Knowledge” is our call to everyone to promote radical knowledge equity, creating a living record of history, stories, and contexts for and by all people. It aims to make the Wikimedia movement more diverse, equitable, and inclusive. Help us unlock the world’s knowledge.As a nonprofit, Wikipedia and our related free knowledge projects are powered primarily through donations.Donate now Contact usQuestions about the Wikimedia Foundation or our projects? Get in touch with our team.ContactFollow Facebook Instagram Bluesky LinkedIn Wikipedia Recognized as a Digital Public Good Advocacy Wikimedia Foundation The UN-endorsed Digital Public Goods Alliance has added Wikipedia to its registry, affirming the important role its volunteer editors play in making the internet better for everyone. 12 February 2025 By Wikimedia Foundation Read more “Straight out of a mystery”: The winners of Wiki Loves Earth 2024 Community Photo Contest The 12th annual edition of the globe-trotting photo contest has announced this year’s winners. 23 December 2024 By Wikimedia Foundation Read more Photo credits DpgBadge File provided by Wikimedia Commons Digital Public Goods Alliance MIT license (Expat) Wiki-Loves-Earth-2024-gif Photos 1 and 2 by MicheleIlluzzi and Rotadefterim (respectively) CC BY-SA 4.0 Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jim Henderson CC BY-SA 4.0 Wikimedia Foundation Servers 2015-63 File provided by Wikimedia Commons Victor Grigas/Wikimedia Foundation CC BY-SA 3.0 Skrivstuga Art And Feminism Stockholm 09 File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0 Wikimania 2016 - group photo File provided by Wikimedia Commons Niccolò Caranti CC BY-SA 4.0 Club de Edición II mayo 2017 File provided by Wikimedia Commons Constanza Verón (WMAR) CC BY-SA 4.0 Oxford - Oxford University Museum of Natural History - 0247 File provided by Wikimedia Commons Jorge Royan CC BY-SA 3.0 DEI Representation File provided by Wikimedia Commons Basile Morin CC BY-SA 4.0 Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
