["https://wikimediafoundation.org/news/2025/02/12/wikipedia-recognized-as-a-digital-public-good"]
title = "Wikipedia Recognized as a Digital Public Good – Wikimedia Foundation"
description = "The UN-endorsed Digital Public Goods Alliance has added Wikipedia to its registry, affirming the important role its volunteer editors play in making the internet better for everyone."
full_description = "Feb 12, 2025 ― Wikipedia has officially been recognized as a digital public good (DPG) by the Digital Public Goods Alliance (DPGA), a multistakeholder initiative that maintains a Registry of Digital Public Goods: open source-software, data, AI models, standards, and content created for the public interest. The DPGA is endorsed by the United Nations (UN) Secretary-General in support of open source technologies that contribute to the advancement of the Sustainable Development Goals (SDGs). This recognition of Wikipedia, the free online encyclopedia hosted by the nonprofit organization the Wikimedia Foundation, highlights its unique role in advancing global access to a free and open source of trusted knowledge in the public interest. According to Liv Marte Nordhaug, CEO of the DPGA Secretariat: “Wikipedia’s recognition as a digital public good is a testament to the power and importance of open access to knowledge. Wikipedia stands as a prime example of how technologies can drive equitable and unrestricted access to information, accelerating the attainment of the Sustainable Development Goals worldwide.” Wikipedia, the world’s largest online encyclopedia and only top-visited website operated by a non-profit organization, contains reliably sourced information that is shared, maintained, and verified by a global community of nearly 260,000 volunteers in over 300 languages. “The Wikimedia Foundation works with affiliate organizations and volunteer Wikipedians across the world to advocate for policies that protect and support Wikipedia and other digital public goods upon which the free knowledge ecosystem depends,” said Rebecca MacKinnon, Vice President of Global Advocacy at the Wikimedia Foundation. “We look forward to working with the Digital Public Goods Alliance, along with other organizations and communities that create and maintain digital public goods, to build a better internet that serves the public interest.” In 2024 Wikimedia Foundation staff along with Wikipedia volunteers from around the world participated in the UN General Assembly’s Summit for the Future and the drafting of the Global Digital Compact—the UN’s blueprint for global governance of digital technology and artificial intelligence. In an open letter in early 2024, the Wikimedia Foundation and Wikimedia affiliates called on UN Member States to: Protect and empower communities to govern online public interest projects. Promote and protect digital public goods by supporting a robust digital commons from which everyone, everywhere, can benefit. Build and deploy Artificial Intelligence (AI) and machine learning (ML) to support and empower, not replace, people who create content and make decisions in the public interest. The recognition of Wikipedia as a digital public good strengthens these advocacy efforts and affirms Wikipedia’s role in the broader global movement for an internet that protects and promotes community-led spaces. The Wikimedia Foundation will continue working with the UN and other international institutions, governments, and civil society partners to ensure that digital public goods like Wikipedia are protected, supported, and accessible to all. For media inquiries, please contact press@wikimedia.org. Subscribe to our newsletter to stay informed on internet policy and Wikipedia’s future. About the Wikimedia Foundation The Wikimedia Foundation is the nonprofit organization that operates Wikipedia and other Wikimedia free knowledge projects. Our vision is a world in which every single human can freely share in the sum of all knowledge. We believe that everyone has the potential to contribute something to our shared knowledge and that everyone should be able to access that knowledge freely. We host Wikipedia and the Wikimedia projects; build software experiences for reading, contributing, and sharing Wikimedia content; support the volunteer communities and partners who make Wikimedia possible. The Wikimedia Foundation is a United States 501(c)(3) tax-exempt organization with offices in San Francisco, California, USA. Related content Ahead of UN General Assembly, Wikipedia nonprofit calls on governments to ensure the future internet is shaped by communities for the public interest Advocacy Events Global Digital Compact Wikimedia Foundation 21 September 2024, New York USA ― As UN Member States are gathering in New York for the 79th United Nations General Assembly, the Wikimedia Foundation, the nonprofit that hosts Wikipedia and other Wikimedia projects, is calling on governments and the UN to ensure that stakeholders from all sectors can work together in deciding how…. 21 September 2024 By Wikimedia Foundation Read more Wikimedia Foundation and global communities call on UN Member States to protect Wikipedia and other public interest projects in the Global Digital Compact Advocacy Global Digital Compact New open letter calls for UN Member States to include three key commitments in the Global Digital Compact that can allow public interest projects and the people who create them to thrive. 23 April 2024 By Wikimedia Foundation Read more Read more Advocacy, Wikimedia Foundation"
