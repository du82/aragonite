title = "Главная – Фонд Викимедиа"
description = "Некоммерческий Фонд Викимедиа предоставляет ключевую инфраструктуру для свободных знаний. На наших серверах размещается Википедия — свободная онлайн энциклопедия, создаваемая, редактируемая и проверяемая добровольцами со всего мира, — а также многие другие важнейшие проекты сообщества. Все это стало возможным благодаря пожертвованиям таких людей, как вы. Мы приглашаем всех, кто разделяет наше видение, присоединиться к нам в…."
full_description = "Представьте себе мир, в котором каждый человек обладает свободным доступом ко всем накопленным человечеством знаниям. Мы создаём такой мир.Imagina un mundo en el que todo ser humano pueda compartir libremente la suma de todo el conocimiento. Ese es nuestro compromiso.想象一下这样的世界：在这个世界中，人人都能在知识的海洋中自由分享。这就是我们的承诺。Imaginez un monde dans lequel chaque être humain peut librement prendre part au partage de la totalité des connaissances humaines. C’est ce que nous construisons. Некоммерческий Фонд Викимедиа предоставляет ключевую инфраструктуру для свободных знаний. На наших серверах размещается Википедия — свободная онлайн энциклопедия, создаваемая, редактируемая и проверяемая добровольцами со всего мира, — а также многие другие важнейшие проекты сообщества. Все это стало возможным благодаря пожертвованиям таких людей, как вы. Мы приглашаем всех, кто разделяет наше видение, присоединиться к нам в сборе и распространении знаний, которые в полной мере представляют разнообразие человечества. Защитить и поддержать Википедию Сделать пожертвование Безопасные пожертвования РусскийEnglishالعربية中文FrançaisEspañolDeutsch 1 Проекты Викимедиа принадлежат всем Вы создали их. Они ваши, и ими можно пользоваться. Бесплатно. Это означает, что вы можете пользоваться этими материалами, менять их, или поделиться тем, что вы найдете на сайтах Викимедиа. Просто не пишите здесь свою автобиографию и не выдавайте наши материалы за своё домашнее задание. 2 Мы уважаем ваши данные Мы не продаём третьим лицам ваш адрес электронной почты или любые ваши персональные данные. Более подробно о нашей практике обращения с вашими конфиденциальными данными можно узнать из политики конфиденциальности Фонда Викимедиа, политики конфиденциальности дарителей, а также из руководства по сохранению данных. 3 Точность Википедии поддерживают такие же люди, как и вы Читатели проверяют факты. Статьи совместно создаются и редактируются сообществом добровольцев с использованием надёжных авторитетных источников, поэтому никакой человек и никакая компания не владеет какой-либо статьёй Википедии. Фонд Викимедиа не пишет и не редактирует статьи, но другие могут помочь. 4 Не все вики-сайты относятся к Викимедиа Слово «вики» означает веб-сайт, созданный с использованием программного обеспечения для совместного редактирования. Проекты, ранее или в настоящем времени не связанные с Википедией или Фондом Викимедиа, такие как «Wikileaks» и «wikiHow», также используют этот термин. Хотя эти сайты также используют «вики» в своем названии, они не имеют никакого отношения к Викимедиа. > 280,000 Редакторов ежемесячно вносят свой вклад в проекты Викимедиа > 100 млн Медиафайлов на Викискладе > 1.5 млрд Уникальных устройств ежемесячно получают доступ к проектам Викимедиа ИсследованияМы проводим наши собственные исследования и сотрудничаем с исследователями по всему миру для решения проблем, связанных с изменениями в обществе и технологиях.Подробнее об исследованиях ТехнологииВо всём, от надёжности сайта до машинного обучения, наша технология с открытым исходным кодом делает Википедию быстрее, надёжнее и доступнее во всем мире.Подробнее о технологиях ЗащитаМы боремся за защиту права каждого на доступ к свободным и открытым знаниям.Подробнее о защите Проекты Совместные проекты — ядро движения Викимедиа. Наши добровольцы создают инструменты, делятся фотографиями, пишут статьи и работают над тем, чтобы соединить все существующие знания. Посмотрите на все проекты Википедия Свободная энциклопедия, написанная на 300 языках добровольцами со всего мира. Посетите Википедию Викисклад Крупнейшая в мире бесплатная библиотека иллюстраций, фотографий, рисунков, видео и музыки. Посетите Викисклад Новости Смотрите, что у нас нового Новый звуковой логотип Википедии. Объявлен победитель конкурса «Звук Всех Человеческих Знаний» Некатегоризовано Этот пост также доступен на: العربيَّة · 中文 · English · Français · Deutsch · हिन्दी · Bahasa Indonesia · Português · Español 28 марта 2023 г. — Сегодня Фонд Викимедиа, некоммерческая организация, которая поддерживает Википедию и другие проекты Викимедиа, объявил победителя глобального конкурса «Звук Всех Человеческих Знаний», завершив поиск звукового логотипа для Википедии и других проектов Викимедиа.…. 28 March 2023 By Wikimedia Foundation Read more Московский суд оставил в силе штраф за содержание Википедии: Фонд Викимедиа продолжит оспаривать попытки ограничения свободных знаний в России Advocacy Правовые вопросы Фонд Цей пост також доступний українською мовою.This post is also available in English. 22 ноября 2022 года Московский суд отклонил дело Фонда Викимедиа («Фонд»), оспаривающую вердикт суда о наложении штрафа на Фонд за то, что он не удалил «запрещённую» информацию из статьи Русской Википедии — Вторжение России на Украину (2022). Фонд Викимедиа, некоммерческая организация, которая обеспечивает…. 23 November 2022 By Wikimedia Foundation Read more Викимедийцы — герои свободных знаний. Мэй Хашем Редактор с 2013 года, Сообщество Викимедиа Витор Мазуко Редактор с апреля 2009 года, Сообщество Викимедиа Армине Агаян Редактор с 2013 года, Сообщество Викимедиа На протяжении всей истории человечества знания контролировались немногочисленными группами власть имущих. Википедии нужны знания всех языков и культур. Интернет стал базовым средством доступа к информации — однако женщины, люди с разным цветом кожи и жители «глобального Юга» остаются слабо представленными в нём. Мы приглашаем вас помочь исправить историю. Присоединяйтесь к движению Помогите нам раскрыть знания мира.Будучи некоммерческой, Википедия и связанные с ней проекты свободных знаний существуют в основном за счёт пожертвований.Сделать пожертвование Verbindung Будьте в курсе новостей и событий Фонда Викимедиа Связаться с человекомЕсть вопросы о Фонде Викимедиа или наших проектах? Свяжитесь с нашей командой.ContactОтслеживайте Фейсбук Инстаграм Bluesky LinkedIn Авторство фото Sound of All Human Knowledge winner announcement press release image Wikimedia Foundation 