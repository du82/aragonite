title = "الرئيسية – مؤسسة ويكيميديا"
description = "تقدم مؤسسة ويكيميديا غير الهادفة للربح البنية التحتية اللازمة للمعرفة الحرة. نستضيف ويكيبيديا، الموسوعة الحرة على الإنترنت، التي ينشئها ويحررها ويتحقق من معلوماتها متطوعين من كافة أنحاء العالم، وكذلك عدد كبير من مشاريع المجتمع الحيوية. كل هذا أصبح حقيقة وواقعا بفضل تبرعات أفراد مثلك. نرحب بأي فرد يشاركنا رؤيتنا بالانضمام إلينا في جمع المعرفة ومشاركتها…."
full_description = "تخيل عالما حيث كل كائن بشري يستطيع أن يشارك بحرية في مجموع المعرفة، هذا هو التزامناImaginez un monde dans lequel chaque être humain peut librement prendre part au partage de la totalité des connaissances humaines. C’est ce que nous construisons.Представьте себе мир, в котором каждый человек обладает свободным доступом ко всем накопленным человечеством знаниям. Мы создаём такой мир.Stell dir eine Welt vor, in der jeder einzelne Mensch frei an der Summe allen Wissens teilhaben kann. Das ist unsere Verpflichtung. تقدم مؤسسة ويكيميديا غير الهادفة للربح البنية التحتية اللازمة للمعرفة الحرة. نستضيف ويكيبيديا، الموسوعة الحرة على الإنترنت، التي ينشئها ويحررها ويتحقق من معلوماتها متطوعين من كافة أنحاء العالم، وكذلك عدد كبير من مشاريع المجتمع الحيوية. كل هذا أصبح حقيقة وواقعا بفضل تبرعات أفراد مثلك. نرحب بأي فرد يشاركنا رؤيتنا بالانضمام إلينا في جمع المعرفة ومشاركتها التي تمثل كاملة تنوع البشرية. حماية والحفاظ على ويكيبيديا تبرع الأن التبرعات الآمنة العربيةEnglish中文FrançaisРусскийEspañolDeutsch 1 مشاريع ويكيميديا ملك للجميع أنت من استحدثها. هي ملكك ويسعك استخدامها. دون مقابل. وهذا يعني أنه يمكنك استخدام أو تطويع أو مشاركة ما تجده على مواقع ويكيميديا. كل ما عليك هو ألا تكتب سيرتك الذاتية، أو أن تنسخ المحتوى وتلصقه في فروضك المنزلية. 2 نصون بياناتك ونحترم خصوصيتك نحن لا نبيع عنوان بريدك الإلكتروني أو أي من معلوماتك الشخصية إلى الغير. يوجد المزيد من المعلومات عن ممارسات الخصوصية التي نتبعها في سياسة خصوصية مؤسسة ويكيميديا، وكذا سياسة خصوصية المتبرعين، وأيضا إرشادات الاحتفاظ بالمعلومات. 3 أفراد مثلك هم من يحرصون على دقة ويكيبيديا القراء يتولون مهمة التحقق من الحقائق. تنشئ المقالات بصفة تعاونية ويتولى تعديلها مجتمع من المتطوعين يستعينون بمصادر جديرة بالثقة، حتى لا يسيطر شخص واحد أو تتملك شركة بعينها أي من مقالات ويكيبيديا. لا تكتب مؤسسة ويكيميديا أو تعدل، إلا أنك أنت وجميع من تعرف يمكنهم المساهمة. 4 ليست كل مواقع الويكي تابعة لويكيميديا كلمة «ويكي – wiki» تشير إلى موقع شبكي صمم باستخدام برمجيات تعديل تعاونية. توجد مشاريع ليس لها صلة سابقة أو قائمة بويكيبيديا أو مؤسسة ويكيميديا، مثل ويكيليكس وويكي هاو، تستخدم ذات المصطلح. رغم أن هذه المواقع تستخدم أيضا كلمة «ويكي – wiki» في اسمها، إلا أنها لا تمت بصلة بويكيميديا. أكثر من 280,000+ محرر يساهمون في مشاريع ويكيميديا شهريا أكثر من 100+ مليون ملف وسائط متعددة على ويكيميديا كومنز أكثر من 1.5 مليار جهاز فريد يتصل بمشاريع ويكيميديا شهريا الأبحاثنتولى القيام بأبحاثنا بأنفسنا ونعقد شراكات مع الباحثين في كافة أنحاء العالم كي نتعامل مع التغييرات التي تطرأ على المجتمع والتقنية.المزيد عن الأبحاث التقنيةتجعل تقنيتنا مفتوحة المصدر، التي تبدأ بجدارة الموقع وصولا إلى تعلم الآلة، من ويكيبيديا أسرع وأكثر جدارة بالثقة وأيسر وصولا في كافة أنحاء العالم.المزيد عن التقنية المناصرةنناضل في سبيل حماية حق الجميع في الوصول الحر والمفتوح للمعرفة.المزيد عن المناصرة المشاريع المشاريع التعاونية هي عماد حركة ويكيميديا. يتولى متطوعونا تصميم الأدوات ومشاركة الصور وكتابة المقالات ويعملون على الاتصال بكافة أنواع المعرفة التي ظهرت على وجه الأرض. طالع كافة المشاريع ويكيبيديا موسوعة حرة يكتبها في 300 لغة متطوعين من كافة أنحاء العالم. قم بزيارة ويكيبيديا ويكيميديا كومنز أضخم مكتبة حرة الاستخدام على وجه الأرض تضم رسوم توضيحية وصور ورسومات ومقاطع مرئية وموسيقى. قم بزيارة ويكيميديا كومنز الأخبار طالع ما كنا نعمل عليه رسالة مفتوحة بشأن حماية ويكيبيديا ومشاريع المصلحة العامة الأخرى في الاتفاق الرقمي العالمي Advocacy رسالة مفتوحة جديدة من مؤسسة ويكيميديا، وهي منظمة غير ربحية التي تدير ويكيبيديا ومشاريع ويكيميديا الأخرى، والجهات الشقيقة التابعة لـ ويكيميديا حول العالم تدعو الدول الأعضاء في الأمم المتحدة إلى حماية ويكيبيديا وغيرها من مشاريع المصلحة العامة في الميثاق الرقمي العالمي القادم. يُشجَّع كل من يلتزم بالحفاظ على المعرفة الحرة والموثوقة والمفتوحة على التوقيع على الرسالة* دعماً لها. 24 April 2024 By Wikimedia Foundation Read more مؤسسة ويكيميديا تدعو إلى توفير اتصال غير مقيد بالإنترنت والوصول إلى المعرفة في غزة Foundation تعبّر مؤسسة ويكيميديا عن قلقها العميق إزاء قطع الإنترنت المستمر في قطاع غزة، والذي يعيق بشكلٍ مباشرٍ قدرة الناس على تلقّي المعلومات ومشاركتها من ويكيبيديا ومشاريع ويكيميديا الأخرى. باعتبارها منظمة غير ربحية تستضيف مشاريع ويكيميديا، تَعتبِر المؤسسة أن هذه الإغلاقات تشكّل تهديدًا لرسالتها المتمثّلة في نشر المعرفة على نطاقٍ عالمي وحماية الوصول إلى المعرفة كحق إنساني. 6 December 2023 By Wikimedia Foundation Read more الويكيميديون هم أبطال المعرفة الحرة. أرميني أجايان محرره منذ 2013, مجتمع ويكيميديا كريستين ماير محرر منذ 2007, مجتمع ويكيميديا مي هاشم محرره منذ 2013, مجتمع ويكيميديا على مر التاريخ سيطر على المعرفة قلة من ذوي السلطة والنفوذ. ويكيبيديا تحتاج للمعرفة من كافة اللغات والثقافات. أصبح الإنترنت هو السبيل الأول للوصول إلى المعلومات ويظل كل من النساء والملونين والجنوب العالمي من أصحاب التمثيل المتدني. نتوجه إليك بالدعوة كي تساعد في تصحيح التاريخ. انضم إلى الحركة ساعدنا في الحصول على معرفة العالمكمؤسسة غير هادفة للربح ، تعمل ويكيبيديا ومشاريع المعرفة المجانية المرتبطة بها بشكل أساسي من خلال التبرعاتتبرع Verbindung ابق على اطلاع دائم على مؤسسة ويكيميديا اتصل بشخصأسئلة حول مؤسسة ويكيميديا أو مشاريعنا؟ تواصل مع فريقنا.Contactتابع فيس بوك أنستاجرام Bluesky لينكد إن حقوق الصورة Tiny Big Picture Tiny Big Picture for the Wikimedia Foundation CC BY-SA 4.0 Armine Aghayan File provided by Wikimedia Commons Victor Grigas CC BY-SA 3.0 Sesame Street Spaghetti Space Chase File provided by Wikimedia Commons Walter Lim from Singapore CC BY 2.0 May Mohamed Hisham Hashem File provided by Wikimedia Commons Ruby Mizrahi CC BY-SA 3.0 Set Knowledge Free mural illustration File provided by Wikimedia Commons Tomi Um / Wikimedia Foundation CC BY-SA 4.0 Wikimedia Conference 2017 File provided by Wikimedia Commons Jason Krüger/Wikimedia Deutschland e.V. CC BY-SA 4.0 Papaul_Tshibamba-3 File provided by Wikimedia Commons Victor Grigas CC BY SA 3.0 SOPA protest in Midtown NYC File provided by Wikimedia Commons Zachary McCune CC BY-SA 4.0 منافسة تعديل ويكيبيديا نظمتها مجموعة الفن+الحركة النسوية File provided by Wikimedia Commons ينس موهر CC BY-SA 3.0"
