description = "This page contains contact information for specific individuals and functions related to the Wikimedia movement. If you are interested in general discussion about Wikimedia and its projects with the community, please join one of our public mailing lists or IRC channels. Email addresses Questions related to Wikipedia or other wikis (Wikimedia projects): info@wikimedia.org Questions related…."
full_description = "This page contains contact information for specific individuals and functions related to the Wikimedia movement. If you are interested in general discussion about Wikimedia and its projects with the community, please join one of our public mailing lists or IRC channels. Email addresses Questions related to Wikipedia or other wikis (Wikimedia projects): info@wikimedia.org Questions related to donations: donate@wikimedia.org Disclaimer: Due to the volume of inquiries we receive, we use Zendesk as a donor response platform. By emailing donate@wikimedia.org, you understand that your information will be processed by the Zendesk Group in accordance with Zendesk’s terms. Users from the following countries should consult Section 13 of Zendesk’s privacy policy for more information about Zendesk’s country-specific practices: Australia, Brazil, Canada, Japan, New Zealand, and Singapore. Questions related to partnerships: business@wikimedia.org Press and media contacts: Please visit our press room. Other questions for and about the Wikimedia Foundation: answers@wikimedia.org Disclaimer: Emails to info@wikimedia.org are reviewed and responded to by volunteers from our user community. Please understand that the Wikimedia Foundation cannot guarantee confidential treatment of any sensitive information you include in your message. Postal address Wikimedia Foundation, Inc.1 Sansome StreetSuite 1895San Francisco, California 94104USAPhone: +1-415-839-6885Fax: +1-415-882-0495 Please do not send legal documents to this address, for Legal Service of Process, see below. Please note: We receive a large number of calls, so email or fax is always a better first option. If you leave a voicemail, please include an email address for faster response. Before contacting us, please review Answers on Meta-Wiki to best direct your inquiry. Address for donations Wikimedia Foundation, Inc.P.O. Box 98204Washington, DC 20090-8204USA Please note: donations by check are processed directly at our centralized lockbox location, which is in Washington, DC. Legal Copyright violations If you would like to send us a Digital Millennium Copyright Act (“DMCA”) takedown notice or counter-notice regarding a potential copyright violation, you can find more information, and where to send your request, on our DMCA takedowns page. Requests to disclose user information (including emergency requests) Please read our Requests for User Information Procedures and Guidelines and then send your request to: Wikimedia Foundationc/o CT Corporation System330 North Brand BoulevardGlendale, California 91203-2336legal@wikimedia.org Other legal questions or requests Please send all other legal questions or requests to: Wikimedia Foundationc/o CT Corporation System330 North Brand BoulevardGlendale, California 91203-2336legal@wikimedia.org Wikimedia movement affiliates Wikimedia movement affiliates support work focused on a specific theme, topic, or subject within or across countries and regions. Wikimedia chapters Wikimedia thematic organizations Wikimedia user groups Help us unlock the world’s knowledge.As a nonprofit, Wikipedia and our related free knowledge projects are powered primarily through donations.Donate now Contact usQuestions about the Wikimedia Foundation or our projects? Get in touch with our team.ContactFollow Facebook Instagram Bluesky LinkedIn Photo credits Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
