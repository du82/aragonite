["https://wikimediafoundation.org/de"]
title = "Hauptseite – Wikimedia Foundation"
description = "Die gemeinnützige Wikimedia Foundation stellt die grundlegende Infrastruktur für Freies Wissen zur Verfügung. Wir betreiben die Wikipedia, die freie Online-Enzyklopädie, die von Ehrenamtlichen rund um den Erdball erschaffen, bearbeitet und überprüft wird, genauso wie viele andere wichtige Community-Projekte. Ermöglicht wurden sie alle dank der Spenden von Einzelpersonen wie Ihnen. Wir laden alle ein, die unsere…."
full_description = "Stell dir eine Welt vor, in der jeder einzelne Mensch frei an der Summe allen Wissens teilhaben kann. Das ist unsere Verpflichtung.Imagine a world in which every single human being can freely share in the sum of all knowledge. That’s our commitment.Imagina un mundo en el que todo ser humano pueda compartir libremente la suma de todo el conocimiento. Ese es nuestro compromiso.تخيل عالما حيث كل كائن بشري يستطيع أن يشارك بحرية في مجموع المعرفة، هذا هو التزامنا Die gemeinnützige Wikimedia Foundation stellt die grundlegende Infrastruktur für Freies Wissen zur Verfügung. Wir betreiben die Wikipedia, die freie Online-Enzyklopädie, die von Ehrenamtlichen rund um den Erdball erschaffen, bearbeitet und überprüft wird, genauso wie viele andere wichtige Community-Projekte. Ermöglicht wurden sie alle dank der Spenden von Einzelpersonen wie Ihnen. Wir laden alle ein, die unsere Vision teilen, dass sie sich uns anschließen, wenn wir Wissen sammeln und teilen, das die menschliche Vielfalt voll und ganz repräsentiert. Schützen Sie die Wikipedia und halten Sie sie aufrecht Spenden Sie jetzt Spenden sie DeutschEnglishالعربية中文FrançaisРусскийEspañol 1 Wikimedia-Projekte gehören jedem Du produzierst es. Es ist deines zum Verwenden. Umsonst. Das bedeutet, dass du verwenden kannst, anpassen kannst oder teilen kannst, was du auf Wimedia-Sites findest. Schreibe nur nicht deine eigene Biographie oder füge nicht etwas mit Copy und Paste in deine Hausarbeit ein. 2 Wir respektieren deine Daten und deine Privatsphäre Wir verkaufen deine E-Mail-Adresse oder irgendwelche deiner persönlichen Informationen nicht an Dritte. Weitere Informationen über unsere Privacy-Richtlinien gibt es auf Wikimedia Foundation privacy policy, donor privacy policy und data retention guidelines. 3 Menschen wie du sorgen für die Richtigkeit der Wikipedia Leser prüfen die Fakten. Artikel werden kollaborativ erstellt und bearbeitet, von einer Community von Freiwilligen, die zuverlässige Quellenverwenden, so dass keine Einzelperson oder Firma einen Wikipedia-Artikel besitzt. Die Wikimedia Foundation schreibt oder bearbeitet nicht, aber du und alle anderen, die du kennst, können helfen. 4 Nicht alle Wikis gehören zur Wikimedia Das Wort “wiki” bezieht sich auf eine Website, die mit Software erstellt wurde, die kollaboratives Bearbeiten ermöglicht. Den Begriff verwenden auch Projekte, die keine Verbindung zur Wikipedia oder zur Wikimedia Foundation hatten oder haben, wie zum Beispiel Wikileaks und wikiHow. Obwohl diese Sites “wiki” in ihrem Namen führen, haben sie nichts mit Wikimedia zu tun. mehr als 280.000 bearbeiter tragen monatlich zu Wikimedia-Projekten bei mehr als 100 Millionen mediendateien auf Wikimedia Commons mehr als 1.5 Milliarde einzelgeräte greifen jeden Monat auf Wikimedia-Projekte zu ForschungWir führen unsere eigene Forschung durch und arbeiten weltweit mit Forschern zusammen, um Veränderungen in der Gesellschaft und in der Technik zu thematisieren.Mehr über Forschung TechnologieVon der Zuverlässigkeit der Sites bis zum Machine Learning: Unsere Open-Source-Technologie macht die Wikipedia schneller, zuverlässiger und weltweit zugänglicher.Mehr über Technologie AdvocacyWir kämpfen für jedermanns Recht auf Zugang zu freiem und offenem Wissen.Mehr über Advocacy Projekte Mitmachprojekte sind der Kern der Wikimedia-Bewegung Unsere Freiwilligen erstellen Tools, teilen Fotos, schreiben Artikel und arbeiten daran, all das Wissen, das existiert, miteinander zu verbinden. Siehe alle Projekte Wikipedia Freie Enzyklopädie in 300 Sprachen von Freiwilligen auf der ganzen Welt geschrieben. Besuchen Sie Wikipedia Wikimedia Commons Die weltweit größte frei verwendbare Mediathek mit Illustrationen, Fotos, Zeichnungen, Videos und Musik. Besuchen Sie Wikimedia Commons Neues Schau dir an, was wir vorhaben Offener Brief zum Schutz der Wikipedia und anderer Projekte von öffentlichem Interesse im Globalen Digitalpakt Advocacy Ein neuer offener Brief der Wikimedia Foundation, der gemeinnützigen Organisation, die Wikipedia und andere Wikimedia-Projekte betreibt, und der Wikimedia-Mitgliedsorganisationen auf der ganzen Welt fordert die UN-Mitgliedsstaaten auf, Wikipedia und andere Projekte von öffentlichem Interesse im Rahmen des bevorstehenden Global Digital Compact zu schützen. 24 April 2024 By Wikimedia Foundation Read more Das neue Wikipedia-Soundlogo: Der Gewinner des Wettbewerbs zum Klang allen menschlichen Wissens steht fest Communications Foundation Dieser Beitrag ist in weiteren Sprachen verfügbar: العربيَّة · 中文 · English · Français · हिन्दी · Bahasa Indonesia · Português · русский язык · Español 28. März 2023 — Heute hat die Wikimedia Foundation, die Non-Profit-Organisation, die Wikipedia und weitere Wikimedia-Projekte betreibt, den Gewinner des globalen Wettbewerbs zum Klang allen menschlichen Wissens bekannt gegeben, womit die Suche nach…. 28 March 2023 By Wikimedia Foundation Read more Wikimedianer sind Helden des Freien Wissens Vitor Mazuco Bearbeiter seit 2009, Wikimedia community Arminé Aghayan Benutzerin seit 2013, Wikimedia community May Hachem Bearbeiterin seit 2013, Wikimedia community In der Geschichte der Menschheit wurde Wissen von wenigen Mächtigen kontrolliert. Die Wikipedia benötigt Wissen aus allen Sprachen und Kulturen. Das Internet ist zum selbstverständlichen Zugang für Informationen geworden – Frauen, People of Color und der Globale Süden bleiben unterrepräsentiert. Wir laden Sie ein, dabei zu helfen, die Geschichte zu korrigieren. Schließe dich der Bewegung an Helfen Sie uns dabei, das Wissen der Welt zu befreien.Wegen ihrer Gemeinnützigkeit werden die Wikipedia und unsere verwandten Projekte für Freies Wissen vor allem über Spenden unterstützt.Spenden Sie jetzt Verbindung Bleiben Sie über die Wikimedia Foundation auf dem laufenden Kontaktieren Sie eine PersonFragen über die Wikimedia Foundation oder unsere Projekte? Kontaktieren Sie unser Team.ContactFolge Facebook Instagram Bluesky LinkedIn Bildnachweis