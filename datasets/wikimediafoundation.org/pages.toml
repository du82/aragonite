title = "Technology – Wikimedia Foundation"
description = "1.5 billion unique devices access Wikimedia sites every month 6,000 views per second across Wikimedia sites"
full_description = "TechnologyWe keep Wikimedia projects fast, reliable, and available to all. From hosting Wikipedia to creating edit-checking artificial intelligence (AI), we design and build the open-source technology that powers Wikimedia projects. Community volunteers and Foundation technologists collaborate on MediaWiki, the platform that makes sharing free knowledge possible. Hosting the world’s knowledgeWikipedia is one of the top most-visited websites in the world, accessed by 1.5 billion unique devices every month. Our infrastructure keeps it online. Making Wikipedia easier to useThrough technical and design improvements to Wikipedia’s desktop and more, we make the site easier to use and more welcoming for readers and contributors alike. Assisting human collaboration with machine learningAnyone can edit Wikipedia, and it can be challenging to maintain quality control. That is why we made ORES, an artificial intelligence service that automatically identifies potentially problematic content as soon as it appears, advising editors if changes are needed. Helping NASANASA’s internal wiki for collaboration and documentation is built on MediaWiki, just like Wikipedia. We create MediaWiki—open-source wiki software that is free and available for anyone. Mentoring new developersTo help build a more diverse and inclusive technical community, the Wikimedia Foundation funds, supports, and mentors new developers and underrepresented groups in tech. Growing a volunteer developer communityOver half of the commits made to our codebase are pushed by volunteers. We actively support a thriving volunteer technology community, with grants, events, and an open collaboration tool. Help us unlock the world’s knowledge.As a nonprofit, Wikipedia and our related free knowledge projects are powered primarily through donations.Donate now 1.5 billion unique devices access Wikimedia sites every month 6,000 views per second across Wikimedia sites Contact usQuestions about the Wikimedia Foundation or our projects? Get in touch with our team.ContactFollow Facebook Instagram Bluesky LinkedIn O valor da Wikipédia na era da IA generativa Blog Post Technology Wikipedia Se houvesse um sistema de inteligência artificial generativa que pudesse escrever, por conta própria, todas as informações contidas na Wikipédia, seria igual à Wikipédia que temos hoje? 19 November 2024 By Selena Deckelmann Read more Wikipedia is here to stay Technology Wikipedia People are why Wikipedia continues to persist. 16 January 2024 By Chris Albon Read more Dive deeper into Wikimedia projects MediaWikiOriginally created for use on Wikipedia, MediaWiki is free and open-source wiki software written in PHP. ORESThe web service and API that provides machine learning as a service to flag bad edits and vandalism on Wikimedia projects. Wikipedia for AndroidWikipedia at your fingertips on Android. Set your app to night reading mode or save articles to read offline. Wikipedia for iOSWikipedia at your fingertips on iOS. Set your app to night reading mode or save articles to read offline. APIsOur API provides straightforward access to Wikimedia content and data, in machine-readable formats. WikistatsWikistats is a public dashboard featuring data about the reach and impact of Wikimedia projects. Wikimedia EnterpriseFor organizations that reuse Wikimedia content: Wikimedia Enterprise is a commercial product that meets a range of high volume content reuse needs, providing streamlined, on-demand access to Wikimedia APIs with standard Service Level Agreements. Photo credits AI Blog header Wikimedia Foundation CC BY-SA 4.0 Wikimedia Foundation AI Blog Series Header File provided by Wikimedia Commons Jordan McRae CC BY-SA 4.0 WikiDemocracy Event - May 2017 File provided by Wikimedia Commons ZMcCune (WMF) CC BY-SA 4.0 Papaul Tshibamba-4 File provided by Wikimedia Commons Victor Grigas CC BY-SA 3.0 Revscore WP File provided by Wikimedia Commons Mun May Tee-Galloway CC BY-SA 4.0 M101 hires STScI-PRC200