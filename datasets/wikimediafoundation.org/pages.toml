description = "The Wikimedia Foundation, Inc is a nonprofit charitable organization dedicated to encouraging the growth, development and distribution of free, multilingual content, and to providing the full content of these wiki-based projects to the public free of charge."
full_description = "Wikipedia Recognized as a Digital Public Good Advocacy Wikimedia Foundation The UN-endorsed Digital Public Goods Alliance has added Wikipedia to its registry, affirming the important role its volunteer editors play in making the internet better for everyone. 12 February 2025 By Wikimedia Foundation Read more “Straight out of a mystery”: The winners of Wiki Loves Earth 2024 Community Photo Contest The 12th annual edition of the globe-trotting photo contest has announced this year's winners. 23 December 2024 By Wikimedia Foundation Read more The Wikimedia Foundation welcomes community-and-affiliate selected trustees Wikimedia Foundation Today, the Wikimedia Foundation announced that two new members have joined its Board of Trustees: Maciej Artur Nadzikiewicz and Christel Steigenberger. 19 December 2024 By Wikimedia Foundation Read more Announcing English Wikipedia’s most popular articles of 2024 Wikipedia Year in Review Politics, sports, and movies: The 25 most-read English Wikipedia articles in 2024. 3 December 2024 By Wikimedia Foundation Read more Ahead of UN General Assembly, Wikipedia nonprofit calls on governments to ensure the future internet is shaped by communities for the public interest Advocacy Events Global Digital Compact Wikimedia Foundation 21 September 2024, New York USA ― As UN Member States are gathering in New York for the 79th United Nations General Assembly, the Wikimedia Foundation, the nonprofit that hosts Wikipedia and other Wikimedia projects, is calling on governments and the UN to ensure that stakeholders from all sectors can work together in deciding how…. 21 September 2024 By Wikimedia Foundation Read more Wikimania 2024 in Poland celebrates global volunteers who make Wikipedia and sister projects possible Events Wikimania The nineteenth edition of the global event will take place in Katowice, Poland (the 2024 European City of Science), from 7 - 10 August. 31 July 2024 By Wikimedia Foundation Read more Wikimedia Foundation calls on US Supreme Court to strike laws that threaten Wikipedia Legal United States Wikimedia Foundation The Foundation supports challenges to laws in Texas and Florida that jeopardize Wikipedia's community-led governance model and the right to freedom of expression. 25 July 2024 By Wikimedia Foundation Read more Wikimedia Foundation’s Accreditation to World Intellectual Property Organization Blocked for a Fourth Time by China Wikimedia Foundation Yesterday, the Wikimedia Foundation, the nonprofit that hosts and supports Wikipedia and other Wikimedia projects, was again denied accreditation as a permanent observer to the World Intellectual Property Organization (WIPO). 11 July 2024 By Wikimedia Foundation Read more Wikimedia Foundation statement on volunteer processes on reliable sources Wikimedia Foundation Wikipedia There has been recent media coverage regarding a decision by Wikipedia's volunteer community on the reliability of the Anti-Defamation League as an encyclopedic source in specific subject areas. In an effort to promote better understanding of how Wikipedia works, the Wikimedia Foundation has issued a statement. 26 June 2024 By Wikimedia Foundation Read more The Wikimedia Endowment welcomes Mayree Clark as its newest Board member Wikimedia Foundation The Wikimedia Endowment is delighted to welcome Mayree Clark as a new member of its Endowment Board. Mayree, a finance expert, will bring her extensive governance expertise to the Wikimedia Endowment, a nonprofit charitable organization providing a permanent safekeeping fund to support the Wikimedia projects in perpetuity. 10 May 2024 By Wikimedia Foundation Read more 1 2 3 … 14 Older"
