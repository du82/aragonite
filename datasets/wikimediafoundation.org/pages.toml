title = "Inicio – Fundación Wikimedia"
description = "La Fundación Wikimedia, organización sin fines de lucro, provee la infraestructura esencial para el conocimiento libre. Nosotros alojamos a Wikipedia, la enciclopedia libre, creada, editada, y verificada por voluntarios provenientes de todas partes del mundo, así como a varios otros proyectos vitales para la comunidad. Todo ello es posible gracias a las donaciones hechas por…."
full_description = "Imagina un mundo en el que todo ser humano pueda compartir libremente la suma de todo el conocimiento. Ese es nuestro compromiso.Представьте себе мир, в котором каждый человек обладает свободным доступом ко всем накопленным человечеством знаниям. Мы создаём такой мир.Imaginez un monde dans lequel chaque être humain peut librement prendre part au partage de la totalité des connaissances humaines. C’est ce que nous construisons.想象一下这样的世界：在这个世界中，人人都能在知识的海洋中自由分享。这就是我们的承诺。 La Fundación Wikimedia, organización sin fines de lucro, provee la infraestructura esencial para el conocimiento libre. Nosotros alojamos a Wikipedia, la enciclopedia libre, creada, editada, y verificada por voluntarios provenientes de todas partes del mundo, así como a varios otros proyectos vitales para la comunidad. Todo ello es posible gracias a las donaciones hechas por individuos como tú. Le damos la bienvenida a cualquiera que comparta nuestra visión, a unírsenos a colectar y compartir el conocimiento que represente completamente la diversidad humana. Proteger y sostener Wikipedia Dona ahora Donaciones seguras EspañolEnglishالعربية中文FrançaisРусскийDeutsch 1 Los proyectos Wikimedia le pertenecen a todos Tú la hiciste. Está a tu disposición. Gratis. Eso significa que puedes utilizarla, adaptarla o compartir lo que encuentres en los sitios Wikimedia. Sólo no escribas tu propia biografía o la copies y pegues en tu tarea. 2 Respetamos tus datos No vendemos tu dirección de correo electrónico ni cualquier información personal a terceros. Más información sobre nuestras prácticas de privacidad está disponible en política de privacidad de la Fundación Wikimedia, política de privacidad de donantes, directrices de retención de datos. 3 Gente como tú mantiene la veracidad de Wikipedia Los lectores verifican los datos. Los artículos se crean y se editan de manera colaborativa por una comunidad de voluntarios que usan fuentes confiables, así que ninguna persona o compañía es dueña de un artículo de Wikipedia. La Fundación Wikimedia no escribe o edita, pero otros pueden ayudar. 4 No todas las wikis son Wikimedia La palabra “wiki” hace referencia a un sitio web construido a partir de software colaborativo de edición. Otros proyectos que no tienen afiliación pasada o presente con Wikipedia o la Fundación Wikimedia, como por ejemplo Wikileaks y wikiHow también utilizan el término. Aunque esos sitios también usan la expresión “wiki” en su nombre, no tienen ningún vínculo con Wikimedia. +280,000 editores contribuyen a los proyectos Wikimedia al mes +100 millones de archivos de medios en Wikimedia Commons 1,500 millones de dispositivos únicos acceden a los proyectos Wikimedia cada mes InvestigaciónDirigimos nuestras propias investigaciones y nos asociamos con investigadores alrededor del mundo para generar cambios en la sociedad y la tecnología.Más sobre investigación TecnologíaDesde la confiabilidad del sitio hasta el aprendizaje automático, la tecnología de código abierto hace a Wikipedia más rápida, más confiable y más accesible en el mundo entero.Más sobre tecnología DefensaLuchamos para proteger el derecho de todos al conocimiento libre y abierto.Más sobre defensa Proyectos Los proyectos colaborativos son la base del movimiento Wikimedia. Nuestros voluntarios construyen herramientas, comparten fotos, escriben artículos y trabajan para conectar todo el conocimiento que existe. Ver todos los proyectos Wikipedia La enciclopedia libre escrita en 300 idiomas por voluntarios alrededor del mundo. Visita Wikipedia Wikimedia Commons La biblioteca de ilustraciones, fotografías, dibujos, videos y música de uso libre más grande en el mundo. Visita Wikimedia Commons Ve lo que hemos estado haciendo El valor de Wikipedia en la era de la IA generativa Wikipedia ¿Si existiera un sistema de inteligencia artificial generativa que pudiera escribir, por sí solo, toda la información que Wikipedia contiene, esta Wikipedia sería igual a la actual? 19 November 2024 By Selena Deckelmann Read more Carta abierta para proteger Wikipedia y otros proyectos de interés público en el Pacto Digital Mundial Advocacy Una nueva carta abierta de la Fundación Wikimedia, la organización sin ánimo de lucro que gestiona Wikipedia y otros proyectos Wikimedia, y de los afiliados de Wikimedia de todo el mundo, pide a los Estados Miembros de la ONU que protejan Wikipedia y otros proyectos de interés público en el próximo Pacto Digital Mundial (en inglés Global Digital Compact). 24 April 2024 By Wikimedia Foundation Read more Los wikimedistas son los héroes del conocimiento libre. Arminé Aghayan Editora desde 2013, Comunidad Wikimedia Vitor Mazuco Editor desde abril de 2009, Comunidad Wikimedia May Hachem Editora desde 2013, Comunidad Wikimedia A lo largo de la historia, el conocimiento ha sido controlado por unas cuantas personas con poder. Wikipedia necesita conocimiento de todos los idiomas y todas las culturas. El Internet se ha convertido en el acceso predeterminado a la información—mujeres, personas de color y el hemisferio sur siguen subrepresentadas. Te invitamos a ayudar a corregir la historia. Únete al movimiento Ayúdanos a liberar el conocimiento del mundo.Al ser una organización sin fines de lucro, Wikipedia y nuestros proyectos de conocimiento libre relacionados se mantienen principalmente por donaciones.Dona ahora Contactar a un humano¿Preguntas acerca de la Fundación Wikimedia o nuestros proyectos? Contacta a nuestro equipo.ContactSeguir Facebook Instagram Bluesky LinkedIn Crédito fotográfico Tiny Big Picture Tiny Big Picture for the Wikimedia Foundation CC BY-SA 4.0 Armine Aghayan File provided by Wikimedia Commons Victor Grigas CC BY-SA 3.0 Vitor Mazuco File provided by Wikimedia Commons Matthew (WMF) CC BY-SA 3.0 May Mohamed Hisham Hashem File provided by Wikimedia Commons Ruby Mizrahi CC BY-SA 3.0 Set Knowledge Free mural illustration File provided by Wikimedia Commons Tomi Um / Wikimedia Foundation CC BY-SA 4.0 Papaul_Tshibamba-3 File provided by Wikimedia Commons Victor Grigas CC BY SA 3.0 SOPA protest in Midtown NYC File provided by Wikimedia Commons Zachary McCune CC BY-SA 4.0 Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
