title = "Advocacy – Wikimedia Foundation"
description = "Learn more about our work, including research initiatives and how to get involved. Stay up-to-date by following us on Linkedin, reading our monthly public policy and advocacy recap, and joining our mailing list. For quarterly insights, be sure to subscribe to our newsletter. 45 million new articles in 2022 61+ million articles across over 300…."
full_description = "AdvocacyWe protect the right to free knowledge. Everyone, everywhere has the right to access and share knowledge. By working with Wikimedia volunteers and affiliate organizations around the world, we protect free and open knowledge online, the people who make it possible, and our shared values. Defending free expressionWe defend everyone’s right to access free knowledge. We protect free expression rights; oppose government-imposed censorship; and educate governments, regulators, and lawmakers to defend people’s right to access and share knowledge globally. Advancing better internet regulationsWe help lawmakers support the right of online platforms and communities to create and share knowledge. We advocate laws that protect our ability to host content that Wikimedia volunteers share and edit. We are transparent about how we handle government demands to remove content or share data. Promoting open copyright licensesCreating and remixing content is vital for Wikimedia projects. We support copyright laws that promote a strong public domain and enable the use of free and open licenses so Wikimedia volunteers can contribute to knowledge broadly. Upholding human rightsVolunteers may face surveillance, harassment, and retaliation for their work on Wikimedia projects. We defend their human rights, and we work to promote a safe online environment to create and share knowledge. Protecting privacyPrivacy enables people to engage and share knowledge freely, without fear of someone watching their online lives. We defend everyone’s right to privacy and challenge mass surveillance. Fighting disinformationWe stand for the right of everyone, everywhere to participate in free knowledge. In early 2022, when sanctions were imposed against the Russian government for invading Ukraine, we worked with our partners to make sure the Russian people could continue to access the open internet. Learn more about our work, including research initiatives and how to get involved. Stay up-to-date by following us on Linkedin, reading our monthly public policy and advocacy recap, and joining our mailing list. For quarterly insights, be sure to subscribe to our newsletter. 45 million new articles in 2022 61+ million articles across over 300 languages on Wikipedia Contact usQuestions about the Wikimedia Foundation or our projects? Get in touch with our team.ContactFollow Facebook Instagram Bluesky LinkedIn Wikipedia Recognized as a Digital Public Good Advocacy Wikimedia Foundation The UN-endorsed Digital Public Goods Alliance has added Wikipedia to its registry, affirming the important role its volunteer editors play in making the internet better for everyone. 12 February 2025 By Wikimedia Foundation Read more Ahead of UN General Assembly, Wikipedia nonprofit calls on governments to ensure the future internet is shaped by communities for the public interest Advocacy Events Global Digital Compact Wikimedia Foundation 21 September 2024, New York USA ― As UN Member States are gathering in New York for the 79th United Nations General Assembly, the Wikimedia Foundation, the nonprofit that hosts Wikipedia and other Wikimedia projects, is calling on governments and the UN to ensure that stakeholders from all sectors can work together in deciding how…. 21 September 2024 By Wikimedia Foundation Read more Help us unlock the world’s knowledge.As a nonprofit, Wikipedia and our related free knowledge projects are powered primarily through donations.Donate now Photo credits DpgBadge File provided by Wikimedia Commons Digital Public Goods Alliance MIT license (Expat) Wikimedia United Nations General Assembly 2024 Hero Image File provided by Wikimedia Commons Wikimedia Foundation CC BY-SA 4.0 Editatona Escuela de mujeres wikipedistas 02 File provided by Wikimedia Commons LABNL Lab Cultural Ciudadano CC BY-SA 2.0 Transparency Report File provided by Wikimedia Commons ADavenport (WMF) CC BY-SA 4.0 Felix, Satdeep, Stalinjeet and Manavpreet at Wikimedia Conference 2017 File provided by Wikimedia Commons Jason Krüger for Wikimedia Deutschland e.V. CC BY-SA 4.0 Collective photo at the -VisibleWikiWomen photo booth File provided by Wikimedia Commons NamukoloS CC BY-SA 4.0 Suscol Intertribal Council 2015 Pow-wow - Stierch 23 File provided by Wikimedia Commons Sarah Stierch CC BY 4.0 Albert V Bryan Federal District Courthouse - Alexandria Va File provided by Wikimedia Commons Tim Evanson CC BY-SA 2.0 Capacitación con Wikimedia Argentina - 2 File provided by Wikimedia Commons Sombra Inquieta CC BY-SA 4.0 Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
