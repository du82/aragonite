["https://wikimediafoundation.org/fr"]
title = "Accueil – Fondation Wikimedia"
description = "La Fondation Wikimédia, organisation à but non lucratif, fournit l’infrastructure nécessaire à la connaissance libre. Nous hébergeons Wikipédia, l’encyclopédie libre en ligne, créée, éditée et vérifiée par des bénévoles du monde entier, ainsi que de nombreux autres projets communautaires importants. Tout cela est rendu possible grâce aux donations de personnes comme vous. Si notre vision…."
full_description = "La connaissance est humaine. La connaissance, c’est Elle.Rencontrez quelques-unes des personnes qui contribuent à rendre le contenu sur les femmes plus fiable sur Wikipédia. La Fondation Wikimédia, organisation à but non lucratif, fournit l’infrastructure nécessaire à la connaissance libre. Nous hébergeons Wikipédia, l’encyclopédie libre en ligne, créée, éditée et vérifiée par des bénévoles du monde entier, ainsi que de nombreux autres projets communautaires importants. Tout cela est rendu possible grâce aux donations de personnes comme vous. Si notre vision vous parle, rejoignez-nous et, ensemble, rassemblons et partageons des connaissances qui représentent pleinement la diversité humaine. Protéger et maintenir Wikipedia Faire un don Dons sécurisés FrançaisEnglishالعربية中文РусскийEspañolDeutsch 1 Les projets Wikimédia appartiennent à tous Vous les avez bâtis. Vous en disposez. Gratuitement. Cela signifie que vous pouvez utiliser, adapter et partager le contenu que vous trouvez sur les sites Wikimédia. Évitez simplement d’y rédiger votre biographie, ou de le copier-coller dans vos devoirs. 2 Nous respectons vos données et votre vie privée Nous ne vendons pas votre adresse e-mail ou toute autre donnée personnelle à des tiers. Vous trouverez plus d’informations sur nos pratiques en matière de protection de la vie privée dans la Politique de confidentialité de la Fondation Wikimédia, Politique de confidentialité des donateurs et les Directives de conservation des données. 3 Wikipédia est fiable grâce à des gens comme vous Les lecteurs vérifient les faits. Les articles sont créés et modifiés de façon collaborative par une communauté de bénévoles s’appuyant sur des sources fiables, une page Wikipédia n’appartient donc pas à une personne ou une entreprise en particulier. La Foundation Wikimédia ne rédige pas les articles ni ne les modifie, mais vous et quiconque vous connaissez peut aider. 4 Tous les wikis ne sont pas des Wikimédia. Le mot « wiki » fait référence à un site web construit à l’aide d’un logiciel d’édition collaboratif. Les projets sans affiliation antérieure ou actuelle avec Wikipédia ou la Fondation Wikimédia, tels que Wikileaks et wikiHow, utilisent également ce terme. Bien que ces sites utilisent également le préfixe “wiki” dans leur dénomination, ils n’ont rien à voir avec Wikimédia. >280,000 contributeurs participent chaque mois aux projets Wikimédia >100 millions de fichiers multimédias sur Wikimédia Commons 1.5 milliard de dispositifs uniques permettent d’accéder aux projets Wikimédia chaque mois RechercheNous réalisons nos propres études et établissons des partenariats avec des chercheurs du monde entier pour répondre aux transformations de la société et de la technologie.En savoir plus TechnologieDe la stabilité du site à l’apprentissage artificiel, notre technologie open source rend Wikipédia plus rapide, plus fiable et plus facile d’accès à travers le monde.En savoir plus PlaidoyerNous nous battons pour défendre le droit de chacun à l’accès à un savoir libre et ouvert.En savoir plus Projets Les projets collaboratifs sont au cœur du mouvement Wikimédia. Nos bénévoles développent des outils, partagent des photos, rédigent des articles et travaillent à relier l’ensemble des connaissances existantes. Voir tous les projets Wikipédia Encyclopédie libre rédigée dans 300 langues par des bénévoles du monde entier. Visitez Wikipédia Wikimédia Commons La plus grande médiathèque d’illustrations, photographies, dessins, vidéos et musique libres de droits. Visitez Wikimédia Commons Actualités Découvrez notre actualité 7 raisons de donner à Wikipédia Foundation Fundraising Les gens font des dons à Wikipédia pour de nombreuses raisons. La Fondation Wikimedia, l’organisation à but non lucratif qui gère Wikipédia, s’assure que chaque don reçu est réinvesti au service de Wikipédia, des projets Wikimedia et de notre mission de libre connaissance. 3 September 2024 By Lisa Seitz-Gruwell Read more Lettre ouverte pour protéger Wikipédia et d’autres projets d’intérêt public dans le cadre du pacte numérique mondial Advocacy Le pacte numérique mondial constitue une opportunité unique et cruciale de façonner notre monde numérique de façon à promouvoir l’intérêt public et à soutenir le développement durable pour tous, partout. 23 April 2024 By Wikimedia Foundation Read more Profils Les héros du savoir libre May Hachem Contributrice depuis 2013, Communauté Wikimédia Vitor Mazuco Contributeur depuis avril 2009, Communauté Wikimédia Sam Oyeyele Contributeur depuis 2011, Communauté Wikimédia Tout au long de notre Histoire, le savoir a été aux mains d’une minorité de puissants. Wikipédia a besoin de connaissances venues de toutes les langues et de toutes les cultures. Internet est devenu le principal moyen d’accès à l’information, mais les femmes, les non-Blancs et les pays du sud y restent sous-représentés. Nous vous invitons à corriger l’Histoire. Rejoignez le mouvement Aidez-nous à révéler le savoir du monde.Wikipédia et nos autres projets pour la liberté de la connaissance sont non lucratifs et vivent principalement de vos dons.Faire un don Échanger Suivez l’actualité de la Wikimedia Foundation Parlez à un être humainDes questions sur la Wikimedia Foundation ou sur nos projets ? Contactez notre équipe.ContactSuivre Facebook Instagram Bluesky LinkedIn Crédits photo Tiny Big Picture Tiny Big Picture for the Wikimedia Foundation CC BY-SA 4.0 May Mohamed Hisham Hashem File provided by Wikimedia Commons Ruby Mizrahi CC BY-SA 3.0 Vitor Mazuco File provided by Wikimedia Commons Matthew (WMF) CC BY-SA 3.0 Sam Oye - Wiki Indaba 2017 File provided by Wikimedia Commons Zachary McCune CC BY-SA 4.0 Knowledge is her homepage hero File provided by Wikimedia Commons Wikimedia Foundation CC BY-SA 4.0 Papaul_Tshibamba-3 File provided by Wikimedia Commons Victor Grigas CC BY SA 3.0 SOPA protest in Midtown NYC File provided by Wikimedia Commons Zachary McCune CC BY-SA 4.0 Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
year_published = 2024
