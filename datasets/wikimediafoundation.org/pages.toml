full_description = "“Straight out of a mystery”: The winners of Wiki Loves Earth 2024 Community Photo Contest The 12th annual edition of the globe-trotting photo contest has announced this year's winners. 23 December 2024 By Wikimedia Foundation Read more “Where time stands still”: The winners of Wiki Loves Monuments 2023 Community Photo Contest Out of nearly 200,000 submissions from 4,700 participants in 45+ countries, fifteen winning images were announced today in the fourteenth annual Wiki Loves Monuments photography contest. 26 March 2024 By Wikimedia Foundation Read more Birds, bugs, and beauty: The winners of Wiki Loves Earth 2023 Community Photo Contest The international Wiki Loves Earth photo contest has announced the winners of its 2023 edition. 13 December 2023 By Wikimedia Foundation Read more Experience some of the world’s most beautiful places with Wiki Loves Earth 2022 Community Photo Contest Wikimedia Commons Think about that feeling you get when you are walking through pristine nature. Do you think it can be captured in a single photo? The Wiki Loves Earth photography competition celebrates the world’s natural heritage, encompassing everything from small parks to massive nature reserves. It asks photographers to dive into those areas to pick out…. 7 December 2022 By Wikimedia Foundation Read more The majesty of nature (and an abundance of birds) on full display in Wiki Loves Earth 2020 Community Photo Contest Wikimedia Commons In the volcanic valleys of Russia, a red fox lies alert amongst chossy boulders; in the treetops of Thailand, an owl precariously slumbers; and in the forests of Bangladesh, a venomous pit viper stalks its prey. As unprecedented as 2020 has been, this year’s Wiki Loves Earth photography competition presents a stunning view of the…. 16 December 2020 By Aubrie Johnson Read more Imagination becomes reality in the winners of the 2019 Wiki Loves Earth photo contest Photo Contest Wikimedia Commons The child of a monkey holds on to its mother tightly. A lone straw bale stands in a field prior to being collected. A few rays of sunlight filter into a dark, foreboding cave filled with clear blue water. These are a mere three of the imagination-fueling winners from the international Wiki Loves Earth photography…. 2 December 2019 By Ed Erhart Read more Let’s play! Photographers capture the art of fun for the Wiki Loves Africa photo contest Community Photo Contest Wikimedia Commons Children playing around a wrecked airplane. A toddler plays peek-a-boo. Teens play barefoot street soccer. Welcome to the wonder of Wiki Loves Africa, an annual themed photo contest which aims to re-balance the lack of visual representation and content that Wikipedia and Wikimedia Commons hold about the continent. Over the last five years, Wiki Loves…. 5 August 2019 By Ed Erhart Read more Presenting the 2018 winners from the world’s largest photo contest Community Photo Contest Wiki Loves Monuments Wikimedia Commons Alireza Akhlaghi had plenty of time inside the famed Sheikh Lotfollah Mosque in Iran to capture the photo that leads this blog post. Why? He walked in at exactly noon, just as the building was about to close down for two hours. He was able to convince the mosque’s guards to let him inside anyway, even though…. 20 December 2018 By Ed Erhart Read more Lose yourself in our planet’s beauty with the winners of Wiki Loves Earth Community Photo Contest Wikimedia Commons A lonely monastery. The sun rising over the desert. A walk through a national park. These are just a few of the spectacular sights captured in the winners of the international Wiki Loves Earth photography competition, announced today. Coming in first place, seen at top, is a shot of the famed columnar basalt of Cape Stolbchaty, located in Russia’s…. 17 December 2018 By Ed Erhart Read more The stories behind this year’s award-winning photographs from Wiki Loves Africa Community Photo Contest Late last year, photographers from around the world were invited to share their photos of people at work on the African continent. Over 18,000 were submitted. Here are the winners. 7 May 2018 By Samir Elsharbaty Read more 1 2 3 Older"
