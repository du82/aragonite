tement on volunteer processes on reliable sources Wikimedia Foundation Wikipedia There has been recent media coverage regarding a decision by Wikipedia's volunteer community on the reliability of the Anti-Defamation League as an encyclopedic source in specific subject areas. In an effort to promote better understanding of how Wikipedia works, the Wikimedia Foundation has issued a statement. 26 June 2024 By Wikimedia Foundation Read more The Wikimedia Endowment welcomes Mayree Clark as its newest Board member Wikimedia Foundation The Wikimedia Endowment is delighted to welcome Mayree Clark as a new member of its Endowment Board. Mayree, a finance expert, will bring her extensive governance expertise to the Wikimedia Endowment, a nonprofit charitable organization providing a permanent safekeeping fund to support the Wikimedia projects in perpetuity. 10 May 2024 By Wikimedia Foundation Read more The Wikimedia Endowment welcomes Laura Duchâtelet as its newest board member Wikimedia Foundation The Wikimedia Endowment is excited to introduce a new member to its Endowment Board with the appointment of Laura Duchâtelet, an important advocate for Wikimedia’s knowledge equity mission. 21 March 2024 By Wikimedia Foundation Read more קרן ויקימדיה קוראת לאפשר חיבור לאינטרנט, וגישה לידע, בלי הפרעה בעזה Wikimedia Foundation קרן ויקימדיה מביעה את דאגתה העמוקה ממקרי ניתוק האינטרנט הנמשכים ברצועת עזה, הפוגעים באופן ישיר ביכולתם של אנשים לקבל ולשתף מידע מוויקיפדיה וממיזמי ויקימדיה אחרים. בתור המלכ"ר המארח את מיזמי ויקימדיה, הקרן מאמינה שמקרי הניתוק האלה מאיימים על משימתנו לשתף ידע ברחבי העולם ולהגן על הגישה לידע כאחת מזכויות האדם. 7 December 2023 By Wikimedia Foundation Read more Wikimedia Foundation calls for unrestricted internet connectivity and access to knowledge in Gaza Wikimedia Foundation Ongoing internet shutdowns in the Gaza Strip threaten the Wikimedia Foundation's mission to share knowledge globally and provide access to knowledge as a human right. 5 December 2023 By Wikimedia Foundation Read more 1 2 3 Older'''
