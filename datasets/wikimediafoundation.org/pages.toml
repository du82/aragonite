description = "180+ active Wikimedia affiliates around the world 38 local Wikimedia chapters around the globe, with at least one on every inhabited continent 300+ languages represented across all Wikipedias"
full_description = "ParticipateLearn something new. Contribute what you know. Wikimedia projects are made by volunteers. Like you. Editors contribute new articles and improve current articles. Developers write and debug the code that makes the wikis go. Galleries, libraries, archives, and museums share their collections and expertise. All of us have knowledge to share. Here’s how to join our global community. Get involved as a Wikipedia editorNo previous experience is needed to start editing Wikipedia. Visit the Teahouse for a friendly place to learn about editing. Veteran editors answer questions and help new editors become accustomed to Wikipedia culture. Join an event or online communityEdit-a-thons and WikiProjects bring people with similar interests together to create and improve Wikipedia articles around a common theme. There are frequent workshops to train new editors. Find your local Wikimedia communityThere are over 170 active Wikimedia affiliates around the world. Each supports Wikimedia projects within a geographical region or thematic area. Find yours. Contribute your coding skillsOur global technical community welcomes volunteer developers of all levels. We host hundreds of software projects in many different domains. It’s easy to get involved. Galleries, libraries, archives and museumsWikimedia projects offer GLAMs and other institutions a powerful platform to share digital collections, institutional knowledge, and expertise with the public.Share your institution’s knowledge 180+ active Wikimedia affiliates around the world 38 local Wikimedia chapters around the globe, with at least one on every inhabited continent 300+ languages represented across all Wikipedias Contact usQuestions about the Wikimedia Foundation or our projects? Get in touch with our team.ContactFollow Facebook Instagram Bluesky LinkedIn “Straight out of a mystery”: The winners of Wiki Loves Earth 2024 Community Photo Contest The 12th annual edition of the globe-trotting photo contest has announced this year’s winners. 23 December 2024 By Wikimedia Foundation Read more Ahead of UN General Assembly, Wikipedia nonprofit calls on governments to ensure the future internet is shaped by communities for the public interest Advocacy Events Global Digital Compact Wikimedia Foundation 21 September 2024, New York USA ― As UN Member States are gathering in New York for the 79th United Nations General Assembly, the Wikimedia Foundation, the nonprofit that hosts Wikipedia and other Wikimedia projects, is calling on governments and the UN to ensure that stakeholders from all sectors can work together in deciding how…. 21 September 2024 By Wikimedia Foundation Read more Help us unlock the world’s knowledge.As a nonprofit, Wikipedia and our related free knowledge projects are powered primarily through donations.Donate now Photo credits Wiki-Loves-Earth-2024-gif Photos 1 and 2 by MicheleIlluzzi and Rotadefterim (respectively) CC BY-SA 4.0 Wikimedia United Nations General Assembly 2024 Hero Image File provided by Wikimedia Commons Wikimedia Foundation CC BY-SA 4.0 Wikimania 2014 London File provided by Wikimedia Commons Sebastiaan ter Burg CC BY 2.0 Black Lunch Table High Line 2018 05 File provided by Wikimedia Commons Heathart CC BY-SA 4.0 2019 Art+Feminism Edit-a-thon DC 008 File provided by Wikimedia Commons Geraldshields11 CC BY-SA 4.0 Wikimedia Conference 2017 – 149 File provided by Wikimedia Commons Jason Krüger for Wikimedia Deutschland e.V. CC BY-SA 4.0 Macro laptop coding (Unsplash) File provided by Wikimedia Commons Marc Mueller CC0 1.0 Boston Public Library Reading Room File provided by Wikimedia Commons Tony Webster CC BY 2.0 Art+Feminism Wikipedia edit-a-thon File provided by Wikimedia Commons Jens Mohr CC BY-SA 3.0"
