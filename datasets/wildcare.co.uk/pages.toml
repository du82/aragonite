ce the risk of slavery and human trafficking occurring in our business and supply Monitor potential risk areas in our business and supply Provide adequate protection for whistle Preventing Slavery and Human-trafficking in our Business The Company makes appropriate checks on all employees, recruitment agencies and suppliers, to know who is working for, or on behalf of us. The Company provides every employee with a written contract of employment. We pay every employee above minimum wage, and we are Minimum Wage Accredited. We comply with our legal obligations to ensure the health and safety of all of our employees and workers, including in relation to working hours, rest breaks and holidays. Final Statement We have a zero tolerance to slavery and human trafficking and require all those in our supply chain and contractors to comply with our values and adopt the same zero tolerance approach. This is communicated to them at the outset of our business relationship and is regularly reinforced thereafter. We may cease to work with individuals and organisations working on our behalf if they do not comply with our approach. This statement is made pursuant to section 54(1) of the Modern Slavery Act 2015 and constitutes the company’s slavery and human trafficking statement for the present financial year. Eddie Wheatcroft Director Wildcare Ltd. Company No. 12836997 Date: 20/10/2023'
