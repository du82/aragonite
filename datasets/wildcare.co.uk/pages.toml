ere products need to be made to order or are not a regular stock item, or during busy times of year, despatch times may be longer. Typical delivery times are: 1 to 3 working days within the UK. 3 to 5 working days within Europe. 7 to 14 working days for the rest of the world. If delivery is likely to take longer than this we will let you know as soon as we become aware of the delay. If you need an item by a particular date please tell us when you place the order - it if is urgent, we recommend you call us on 01451 833181 to place your order. How will I know when my order has been dispatched? We will email you confirmation after your order has been despatched. You might not receive this confirmation email if you made a spelling mistake when you entered your email address. Login and check your registered email address. Spam filters in your email program may also block this type of email. Please check your junk mail folders. Will I receive online tracking information? We send parcels of all shapes and sizes so'''
