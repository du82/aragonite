title = "Bat Workers' Equipment"
description = """
The UK has 18 species of bat and monitoring and protecting them is a full time job for many ecological consultants! Wildcare supply all the equipment you need to do the job, including a wide range of static and handheld bat detectors and analysis software, plus bat worker accessories like ladders and disposable gloves.

In Britain all bat species and their roosts are legally protected. The work of bat professionals and the contributions made by bat groups are vital.

We have a range of bat detectors and recorders to choose from, to suit your needs. Select from hand-held or passive/static, or by technology type (heterodyne, frequency division, zero-crossing, time expansion or full-spectrum)."""
