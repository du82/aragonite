mpare-products","last-ordered-items","cart","directory-data","captcha","instant-purchase","loggedAsCustomer","persistent","review","wishlist","quotation","payplug-payments-cards","intact-urn","recently_viewed_product","recently_compared_product","product_data_storage","paypal-billing-agreement"] } } } { "*": { "Magento_Customer/js/customer-data": { "sectionLoadUrl": "https\u003A\u002F\u002Fwww.wildcare.co.uk\u002Fcustomer\u002Fsection\u002Fload\u002F", "expirableSectionLifetime": 60, "expirableSectionNames": ["cart","persistent"], "cookieLifeTime": "3600", "updateSessionUrl": "https\u003A\u002F\u002Fwww.wildcare.co.uk\u002Fcustomer\u002Faccount\u002FupdateSession\u002F" } } } { "*": { "Magento_Customer/js/invalidation-processor": { "invalidationRules": { "website-rule": { "Magento_Customer/js/invalidation-rules/website-rule": { "scopeConfig": { "websiteId": "2" } } } } } } } { "body": { "pageCache": {"url":"https:\/\/www.wildcare.co.uk\/page_cache\/block\/render\/id\/53\/","handles":["default","catalog_category_view","catalog_category_view_type_default","catalog_category_view_type_default_without_children","catalog_category_view_displaymode_page","catalog_category_view_id_53","searchanise_handler"],"originalRequest":{"route":"catalog","controller":"category","action":"view","uri":"\/bat-detector-repair.html"},"versionCookieName":"private_content_version"} } } Welcome to the Wildcare Bat Detector Service & Repair Centre Wildcare are proud to be the only authorised Service and Repair Centre in the UK for Wildlife Acoustics’ range of bat recorders and bioacoustics monitoring products. We can also service or repair Pettersson, Batbox, Magenta, and Anabat bat detectors, as well as other electronic equipment including Clulite torches, dataloggers, extension cables, trail cameras and sound recorders. BCT Survey Guidelines and Wildlife Acoustics recommend servicing and testing your equipment annually. If you are planning to have your bat recorders serviced for the start of the bat season please note we become very busy from January/February onwards. In Warranty vs Out of Warranty Repairs If your device is still under warranty then please contact the manufacturer directly regarding any repairs. They will arrange to carry out the repair themselves, or will authorise us to do so. Your device may have had a warranty card included with it, which will have all the pertinent instructions and information. For repairs of in-warranty Wildlife Acoustics products please email [email protected] If your device is out of warranty, then we can help with repairs. What is Included With a Service? Servicing is done by our in-house engineer, who performs a thorough check and clean of your equipment, together with minor repairs and replacements. All items except total replacement of the motherboard, daughtercard, or microphone element are included within our standard service charge. If your repair requires these additional chargeable replacements we will contact you with a quotation before we proceed with the work. Procedure for Booking a Service or Repair Check that your item is not still in warranty. Complete our Service & Repair enquiry form. You will be provided with a reference number, a preliminary quotation and postal instructions. Once the service is completed, your product will be returned to you BOOK NOW Frequently Asked Questions Q. Do you provide a collection service? A. Unfortunately, we do not offer a collection service Q. Is my equipment insured by you whilst it is with you? A. Yes, Wildcare cover your equipment at the point of receipt at our Service Centre until you receive it back. We do not cover the units in transit from you to us. In the event of loss or damage whilst the equipment is with us, we would cover the replacement value of the equipment but not any time or business lost, on your part, as a result. Q. How will my units be dispatched back to me? A. Your units will be dispatched back via DPD courier and should reach you within 1-2 working days. Q. My unit is still faulty following repair, what should I do? We ask all customers to check their equipment within 14 days of receipt as per our terms and conditions. If you find out that your unit is still faulty, please contact us as soon as possible so that we can arrange for this unit to be looked at again by the engineer. Q. My unit is not listed as a repair option on your booking form, are you able to still repair it? A. Please email us directly to the Support Inbox [email protected] where we can discuss your requirements and repair options. In any event, the engineer will always attempt a repair if he deems the equipment repairable. Q. How much carriage do you charge for returning my items? A. This is dependant on which country you are located in, carriage costs will be provided on quotation. Q. I am local to your workshop, can I drop my equipment off to you and collect it on completion of repair? A. Yes, it is ok to drop the equipment off, and collect it. Please do inform us of the date that you will be dropping off/collecting so that we can ensure a member of staff is on hand to greet you. Q. My Wildlife Acoustics unit is faulty and is still under warranty, do I contact you or Wildlife Acoustics directly to organise repair/replacement? A. Please contact Wildlife Acoustics directly by emailing [email protected] they will then discuss the issues you are having with your equipment and will contact us to arrange a returns number should you require a repair/replacement. Q. Can I use my EMT for Android with an Apple tablet as I have an adaptor? A. iOS and Android have different requirements for peripherals beyond just the physical connector, so an adapter will not let you use an Android EMT with an iOS device. Please always look at the Wildlife Acoustics website https://www.wildlifeacoustics.com/products/android-device-compatibility for up-to-date information. Q. What happens in the event that the engineer is unable to repair my equipment? Will I still be charged the service and repair fee? A. In the event that the engineer is unable to repair your equipment we will only charge you 50% of the service and repair fee, which is to cover our administrative costs. Q. I have a microphone that requires a cable repair. Will I need to purchase an extension cable following repair? How long will the repair last? A. There is a chance you will need to purchase an extension cable following repair to your microphone cable, this is dependent on how much cable the engineer will need to cut away to conduct the repair. We can not guarantee how long the cable will last following repair. We advise all customers to take extra care when using the microphone following repair in order to not put too much strain on the repaired cable. BOOK NOW Any other questions? If you can't find what you are looking for, or have questions that we haven't answered, then please email us or phone 01451 833181 to discuss your requirements as soon as possible. { "body": { "requireCookie": {"noCookieUrl":"https:\/\/www.wildcare.co.uk\/cookie\/index\/noCookies\/","triggers":[".action.towishlist"],"isRedirectCmsPage":true} } } Helpful Links Contact Us About Us Meet the Team Jobs Delivery Returns Equipment Hire Service and Repair Centre Reviews Customer Photo Gallery Privacy Policy Terms & Conditions'''
