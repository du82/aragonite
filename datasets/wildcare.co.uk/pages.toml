/v1\/guest-carts\/*\/selected-payment-method":["cart","checkout-data"],"rest\/*\/v1\/carts\/*\/selected-payment-method":["cart","checkout-data","instant-purchase"],"customer\/address\/*":["instant-purchase"],"customer\/account\/*":["instant-purchase"],"vault\/cards\/deleteaction":["instant-purchase"],"multishipping\/checkout\/overviewpost":["cart"],"paypal\/express\/placeorder":["cart","checkout-data"],"paypal\/payflowexpress\/placeorder":["cart","checkout-data"],"paypal\/express\/onauthorization":["cart","checkout-data"],"persistent\/index\/unsetcookie":["persistent"],"review\/product\/post":["review"],"wishlist\/index\/add":["wishlist"],"wishlist\/index\/remove":["wishlist"],"wishlist\/index\/updateitemoptions":["wishlist"],"wishlist\/index\/update":["wishlist"],"wishlist\/index\/cart":["wishlist","cart"],"wishlist\/index\/fromcart":["wishlist","cart"],"wishlist\/index\/allcart":["wishlist","cart"],"wishlist\/shared\/allcart":["wishlist","cart"],"wishlist\/shared\/cart":["cart"],"euvat\/vatnumber\/validation":["cart","checkout-data"],"quotation\/index\/add":["quotation"],"quotation\/index\/remove":["quotation"],"quotation\/index\/update":["quotation"],"quotation\/index\/submit":["quotation"],"taxswitcher\/index\/index":["cart"],"braintree\/paypal\/placeorder":["cart","checkout-data"],"braintree\/googlepay\/placeorder":["cart","checkout-data"],"intactiq\/urn\/set":["intact-urn"],"intactiq\/urn\/reset":["intact-urn"]}, "clientSideSections": ["checkout-data","cart-data"], "baseUrls": ["https:\/\/www.wildcare.co.uk\/"], "sectionNames": ["messages","customer","compare-products","last-ordered-items","cart","directory-data","captcha","instant-purchase","loggedAsCustomer","persistent","review","wishlist","quotation","payplug-payments-cards","intact-urn","recently_viewed_product","recently_compared_product","product_data_storage","paypal-billing-agreement"] } } } { "*": { "Magento_Customer/js/customer-data": { "sectionLoadUrl": "https\u003A\u002F\u002Fwww.wildcare.co.uk\u002Fcustomer\u002Fsection\u002Fload\u002F", "expirableSectionLifetime": 60, "expirableSectionNames": ["cart","persistent"], "cookieLifeTime": "3600", "updateSessionUrl": "https\u003A\u002F\u002Fwww.wildcare.co.uk\u002Fcustomer\u002Faccount\u002FupdateSession\u002F" } } } { "*": { "Magento_Customer/js/invalidation-processor": { "invalidationRules": { "website-rule": { "Magento_Customer/js/invalidation-rules/website-rule": { "scopeConfig": { "websiteId": "2" } } } } } } } { "body": { "pageCache": {"url":"https:\/\/www.wildcare.co.uk\/page_cache\/block\/render\/page_id\/61\/","handles":["default","cms_page_view","cms_page_view_id_delivery","searchanise_handler"],"originalRequest":{"route":"cms","controller":"page","action":"view","uri":"\/delivery"},"versionCookieName":"private_content_version"} } } *EU VAT Charges July 2021* As of 1st July 2021, there have been changes made to VAT charges in Europe. If your order is equal to or under €150.00 (excluding delivery charge), a mandatory VAT charge will be incurred. Where possible, please enter your VAT number at checkout to ensure ease of payment return once your order has been placed. What will I be charged for shipping? Shipping charges are calculated at checkout stage based on the total weight of your order, the type of product and delivery postcode. We aim for next working day delivery on all UK mainland orders received before 2:30pm. Prices quoted below exclude VAT. UK mainland delivery starts at £7.92. Pallet deliveries vary depending on your postcode. Highlands and Islands delivery starts at £25. For larger orders and pallet loads you will need to contact us for a quote. The following postcodes and areas are considered to be Highlands and Islands: AB36-38, AB55-56, FK17-21, HS all postcodes, IV all postcodes, KA27-28, KW1-17, PA20-78, PH19-50, ZE1-3 Channel Islands, Isle of Wight, Isle of Man, Scilly Isles Northern Ireland delivery starts at £20 rising to £90 for orders up to 60kg. Please contact us for a quote for larger or palletised orders. Europe: For European orders please visit www.wildcare.eu call us T. 04 65 65 00 05 or alternatively email us on [email protected] How quickly will I get my order? We aim for next working day delivery on all UK mainland orders received before 2.30pm. Where products need to be made to order or are not a regular stock item, or during busy times of year, despatch times may be longer. Typical delivery times are: 1 to 3 working days within the UK. 3 to 5 working days within Europe. 7 to 14 working days for the rest of the world. If delivery is likely to take longer than this we will let you know as soon as we become aware of the delay. If you need an item by a particular date please tell us when you place the order - it if is urgent, we recommend you call us on 01451 833181 to place your order. How will I know when my order has been dispatched? We will email you confirmation after your order has been despatched. You might not receive this confirmation email if you made a spelling mistake when you entered your email address. Login and check your registered email address. Spam filters in your email program may also block this type of email. Please check your junk mail folders. Will I receive online tracking information? We send parcels of all shapes and sizes so we use several different couriers and haulage companies. Some of these make tracking information available online, and where this is the case you will receive notification by email or text. If you need to track your parcel urgently then please contact us. What happens if my order doesn't arrive? If you do not receive your goods within 5 working days for UK orders, or 2 weeks for international orders, please contact us for tracking information. If your goods do not arrive within 30 days of your order being accepted, please contact us within 40 days and you can opt for a full refund or for us to make good the non-delivery. Items that are lost will be replaced or refunded by us. What happens if my order arrives damaged? Please contact us within 5 working days of receiving your order. You may need to obtain a Returns Number, and return the goods to us; parcels without a Returns Number may be refused. By prior agreement, we will refund the costs of return shipping by Royal Mail first class recorded delivery, or will arrange a collection for items over 2kg. Once we have received the damaged goods we will despatch a replacement or refund you in full. How will my order be sent? We will always use a reputable courier company. Smaller items are usually shipped using Royal Mail or Interlink, and larger items are sent usingTNT or Tuffnells. Palletised deliveries are with Hacklings. A signature will always be required, so please ensure that someone is available to sign for your parcel. Please also ensure you either check the item for damages before signing, or sign for the goods as unchecked. If you need to arrange delivery for a specific time please contact us. There is usually an additional charge for timed delivery. What countries do you ship to? We can deliver to anywhere in the world, but you may need to contact us for a quote. You can purchase online if your order is being delivered to Austria, Belgium, Denmark, France, Germany, Ireland, Luxembourg and the Netherlands. Outside these countries you will need to place your order by phone or email. If you are outside of the EU you may be liable for import taxes. Important Information About Backorders At Wildcare there are times when items are only available on a backorder basis, either due to high demand or if the item is a special order item. We refer to these as ‘backorder items. Backorder items are clearly listed on our website as ‘Order To Reserve Stock (Backorder)’. Items that are in stock and ready to be shipped immediately are listed as ‘In Stock’. When you place an order for a back order item or an order that includes back order items, a member of our team will be in contact within 48 hours of your order to confirm the lead time for delivery. For any queries before then, please call us on: 01451 833 181 Avoiding Disappointment We cannot guarantee that a backordered item will come back into stock or be delivered for a specific date, however we will always do our best to keep you informed and updated. If your back order is urgent or required within a specific time frame we suggest to call us on 01451 833 181 so we can keep your requirements in mind throughout the waiting period. Helpful Links Contact Us About Us Meet the Team Jobs Delivery Returns Equipment Hire Service and Repair Centre Reviews Customer Photo Gallery Privacy Policy Terms & Conditions'''
