171+VAT (per unit per week)* EM3 (+) - £88+VAT (per unit per week)* *Extra discounts may apply when hiring 5 or more units for over 5 consecutive weeks. Please contact [email protected] if you would like a quotation or other information. What is included? Our hire units come with standard cables and microphones, delivery, and collection. Insurance, SD Cards, and batteries are NOT included. All units are fully serviced after each hire period. Our most popular units, the SM2BAT+ and SM4BAT-FS hire units include: SM2BAT+ Detector/SM4BAT-FS Detector SMX-U1/SMM-U1 microphone Extension Cable (1 m or 3 m for SM2BAT+ & 3 m for SM4BAT-FS) Heavy-duty Peli Case (SM2BAT+ only) What are the Terms of Hire? The hire period is one week (7 days), and this is also the minimum hire period. Should you need the units for 10 days, for example, you will be charged for 2 weeks. The units will arrive at your specified delivery address on the Hire Commencement Date and a collection will be arranged on the Hire Cease Date from the same address unless otherwise specified. We don’t hire batteries or SD memory cards for security purposes, but these are available for purchase. We do not insure the units during the hire period – this is normally covered by your ‘Hired in Plant Insurance’. You will need to confirm to us that you are covered for this. For further information, full Terms & Conditions of Hire and our latest hire costs please email [email protected] { "body": { "requireCookie": {"noCookieUrl":"https:\/\/www.wildcare.co.uk\/cookie\/index\/noCookies\/","triggers":[".action.towishlist"],"isRedirectCmsPage":true} } } Helpful Links Contact Us About Us Meet the Team Jobs Delivery Returns Equipment Hire Service and Repair Centre Reviews Customer Photo Gallery Privacy Policy Terms & Conditions'
