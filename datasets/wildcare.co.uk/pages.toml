title = "Bat Detector Starter Kit"
description = "If you are a beginner then this kit is a perfect introduction to the detection of bats!The kit includes:Magenta Bat5 superheterodyne bat detectorFour AAA batteriesA Field Studies Council 'Guide to British Bats' The compact Magenta Bat5 has a backlit 4 digit LCD frequency display which is highly visible during the day and night and a top-illuminated large-diameter frequency dial. Bat detectors work by converting the inaudible ultrasonic calls into sounds that we are able to hear (100 to 12kHz). It has an extended low-frequency coverage so it will be able to detect insects and some birds, in addition to bats.Key features: An enhanced oscillator frequency range and low noiseEasy one-handed operation of volume and frequency controlsLow power consumptionContoured microphone housing for enhanced frequency sensitivityWaterproof, short circuit proof headphone outputLow-level output for connection to a recorder or PC sound cardBuilt-in LED torchWrist strap The FSC guide contains a detailed description of the different calls, flight patterns, and behaviours of the UK's bat species and is an ideal companion for anyone learning to identify British bats."
