ed":"0","videoAutoRestart":"0"}], "optionsVideoData": [] } } } Bat Detector Starter Kit SKU 11323-BCT £105.00 Ex. VAT 25 in stock for immediate dispatch require([ 'jquery', 'underscore', 'Magento_Catalog/js/validate-product' ], function($, _){ window.product_id = 95249 window.updateStockMessage = function(qty = 1, product_id = null){ if(product_id == null) { product_id = window.product_id; } if(isNaN(qty) || qty == 0) { qty = 1; } $.ajax({ url : '/intactstock/message', type : 'POST', data: JSON.stringify({ "product" : product_id, "qty" : qty }), processData: false, success : function(data) { $(".intact-stock-status").html(data.message); $(".intact-stock-dates").html(data.estimatedDates); if(!data.addToCart){ jQuery('#product-addtocart-button').prop('disabled', true); }else{ jQuery('#product-addtocart-button').prop('disabled', false); } }, error : function(request,error) { alert("Error"); } }); } window.updateStockMessage(1); function processChange() { window.updateStockMessage($('#qty').val()); } $(document).on("change", "#qty", _.debounce(processChange, 500)); }); The perfect companion for beginner bat detecting. Quantity Add to Basket or Add to Quote { "#add-to-quote-95249": { "Limely_Quotation/js/add-to-quote" : { "addToQuoteUrl": "https://www.wildcare.co.uk/quotation/index/add/" } } } { "#product_addtocart_form": { "Magento_Catalog/js/validate-product": {} } } require([ 'jquery', 'priceBox' ], function($){ var dataPriceBoxSelector = '[data-role=priceBox]', dataProductIdSelector = '[data-product-id=95249]', priceBoxes = $(dataPriceBoxSelector + dataProductIdSelector); priceBoxes = priceBoxes.filter(function(index, elem){ return !$(elem).find('.price-from').length; }); priceBoxes.priceBox({'priceConfig': {"productId":"95249","priceFormat":{"pattern":"\u00a3%s","precision":2,"requiredPrecision":2,"decimalSymbol":".","groupSymbol":",","groupLength":3,"integerRequired":false},"tierPrices":[]}}); }); Description If you are a beginner then this kit is a perfect introduction to the detection of bats! The kit includes: Magenta Bat5 superheterodyne bat detector Four AAA batteries A Field Studies Council 'Guide to British Bats' The compact Magenta Bat5 has a backlit 4 digit LCD frequency display which is highly visible during the day and night and a top-illuminated large-diameter frequency dial. Bat detectors work by converting the inaudible ultrasonic calls into sounds that we are able to hear (100 to 12kHz). It has an extended low-frequency coverage so it will be able to detect insects and some birds, in addition to bats. Key features: An enhanced oscillator frequency range and low noise Easy one-handed operation of volume and frequency controls Low power consumption Contoured microphone housing for enhanced frequency sensitivity Waterproof, short circuit proof headphone output Low-level output for connection to a recorder or PC sound card Built-in LED torch Wrist strap The FSC guide contains a detailed description of the different calls, flight patterns, and behaviours of the UK's bat species and is an ideal companion for anyone learning to identify British bats. Key Information How the Bat5 Works:The detector uses the Heterodyne principle. Ultrasound is picked up, amplified, and mixed in a special way with another signal generated in the bat detector. The mixer produces the audible difference frequency between the two. In a typical situation, the bat will be sending ultrasound at 45kHz, the bat detector signal will be set to 43kHz and the audible output will be the difference between the two - which is 2kHz. There are two rotary controls. A combined volume on/off switch, and a large calibrated frequency control which adjusts the signal to be mixed with the ultrasound from the bat. Bat5 Technical Specifications:Type: HeterodyneFrequency range (kHz): 10 to130Bandwidth: +/- 9kHzOutput power: 0.5 wattsDisplay: LCD, quartz accurate, 4-digitsDisplay resolution (Hz): 100Power: 4x AAA alkaline, NiCd or NiMHHeadphone socket: 3.5mm StereoTape Socket: 3.5mm stereo jackTape Output: 100mV typicalLED torch: White 5mm led.Speaker: Waterproof low profile mylarMicrophone: Wideband electret. Conforms to EU RoHS and WEEE regulations - Lead free Warranty: 2 years Please note: Make sure the detector is switched OFF when changing the batteries. Delivery & Returns Shipping charges are calculated at checkout stage based on the total weight of your order, the type of product and delivery postcode. We aim for next working day delivery on all UK mainland orders received before 2:30pm. Prices quoted below exclude VAT. UK mainland delivery starts at £7.92. Pallet deliveries vary depending on your postcode. Highlands and Islands delivery starts at £25. For larger orders and pallet loads you will need to contact us for a quote. The following postcodes and areas are considered to be Highlands and Islands: AB36-38, AB55-56, FK17-21, HS all postcodes, IV all postcodes, KA27-28, KW1-17, PA20-78, PH19-50, ZE1-3 Channel Islands, Isle of Wight, Isle of Man, Scilly Isles Northern Ireland delivery starts at £20 rising to £90 for orders up to 60kg. Please contact us for a quote for larger or palletised orders. Europe: For European orders please visit www.wildcare.eu call us T. 04 65 65 00 05 or alternatively email us on [email protected] How quickly will I get my order? We aim for next working day delivery on all UK mainland orders received before 2.30pm. Where products need to be made to order or are not a regular stock item, or during busy times of year, despatch times may be longer. Typical delivery times are: 1 to 3 working days within the UK. 3 to 5 working days within Europe. 7 to 14 working days for the rest of the world. If delivery is likely to take longer than this we will let you know as soon as we become aware of the delay. If you need an item by a particular date please tell us when you place the order - it if is urgent, we recommend you call us on 01451 833181 to place your order. How will I know when my order has been dispatched? We will email you confirmation after your order has been despatched. You might not receive this confirmation email if you made a spelling mistake when you entered your email address. Login and check your registered email address. Spam filters in your email program may also block this type of email. Please check your junk mail folders. Will I receive online tracking information? We send parcels of all shapes and sizes so we use several different couriers and haulage companies. Some of these make tracking information available online, and where this is the case you will receive notification by email or text. If you need to track your parcel urgently then please contact us. What happens if my order doesn't arrive? If you do not receive your goods within 5 working days for UK orders, or 2 weeks for international orders, please contact us for tracking information. If your goods do not arrive within 30 days of your order being accepted, please contact us within 40 days and you can opt for a full refund or for us to make good the non-delivery. Items that are lost will be replaced or refunded by us. What happens if my order arrives damaged? Please contact us within 5 working days of receiving your order. You may need to obtain a Returns Number, and return the goods to us; parcels without a Returns Number may be refused. By prior agreement, we will refund the costs of return shipping by Royal Mail first class recorded delivery, or will arrange a collection for items over 2kg. Once we have received the damaged goods we will despatch a replacement or refund you in full. How will my order be sent? We will always use a reputable courier company. Smaller items are usually shipped using Royal Mail or Interlink, and larger items are sent usingTNT or Tuffnells. Palletised deliveries are with Hacklings. A signature will always be required, so please ensure that someone is available to sign for your parcel. Please also ensure you either check the item for damages before signing, or sign for the goods as unchecked. If you need to arrange delivery for a specific time please contact us. There is usually an additional charge for timed delivery. What countries do you ship to? We can deliver to anywhere in the world, but you may need to contact us for a quote. You can purchase online if your order is being delivered to Austria, Belgium, Denmark, France, Germany, Ireland, Luxembourg and the Netherlands. Outside these countries you will need to place your order by phone or email. If you are outside of the EU you may be liable for import taxes. Important Information About Backorders At Wildcare there are times when items are only available on a backorder basis, either due to high demand or if the item is a special order item. We refer to these as ‘backorder items. Backorder items are clearly listed on our website as ‘Order To Reserve Stock (Backorder)’. Items that are in stock and ready to be shipped immediately are listed as ‘In Stock’. When you place an order for a back order item or an order that includes back order items, a member of our team will be in contact within 48 hours of your order to confirm the lead time for delivery. For any queries before then, please call us on: 01451 833 181 Avoiding Disappointment We cannot guarantee that a backordered item will come back into stock or be delivered for a specific date, however we will always do our best to keep you informed and updated. If your back order is urgent or required within a specific time frame we suggest to call us on 01451 833 181 so we can keep your requirements in mind throughout the waiting period. Returns If you receive damaged items or the wrong goods, please let us know straight away so that we can arrange for them to be returned to us and replaced as quickly as possible. You will need to obtain a Returns Number - please call us on 01451 833 181 or email [email protected] Please return goods, WITH THE RETURNS NUMBER MARKED ON THE PARCEL to: Wildcare, Eastgate House, Moreton Road, Longborough, GL56 0QJ We may ask for a photograph any damaged items before we agree to replace them. Please click here to view our full returns policy. { "*": { "Magento_Customer/js/section-config": { "sections": {"stores\/store\/switch":["*"],"stores\/store\/switchrequest":["*"],"directory\/currency\/switch":["*"],"*":["messages"],"customer\/account\/logout":["*","recently_viewed_product","recently_compared_product","persistent"],"customer\/account\/loginpost":["*"],"customer\/account\/createpost":["*"],"customer\/account\/editpost":["*"],"customer\/ajax\/login":["checkout-data","cart","captcha"],"catalog\/product_compare\/add":["compare-products"],"catalog\/product_compare\/remove":["compare-products"],"catalog\/product_compare\/clear":["compare-products"],"sales\/guest\/reorder":["cart"],"sales\/order\/reorder":["cart"],"checkout\/cart\/add":["cart","directory-data"],"checkout\/cart\/delete":["cart"],"checkout\/cart\/updatepost":["cart"],"checkout\/cart\/updateitemoptions":["cart"],"checkout\/cart\/couponpost":["cart"],"checkout\/cart\/estimatepost":["cart"],"checkout\/cart\/estimateupdatepost":["cart"],"checkout\/onepage\/saveorder":["cart","checkout-data","last-ordered-items"],"checkout\/sidebar\/removeitem":["cart"],"checkout\/sidebar\/updateitemqty":["cart"],"rest\/*\/v1\/carts\/*\/payment-information":["cart","last-ordered-items","captcha","instant-purchase","payplug-payments-cards"],"rest\/*\/v1\/guest-carts\/*\/payment-information":["cart","captcha"],"rest\/*\/v1\/guest-carts\/*\/selected-payment-method":["cart","checkout-data"],"rest\/*\/v1\/carts\/*\/selected-payment-method":["cart","checkout-data","instant-purchase"],"customer\/address\/*":["instant-purchase"],"customer\/account\/*":["instant-purchase"],"vault\/cards\/deleteaction":["instant-purchase"],"multishipping\/checkout\/overviewpost":["cart"],"paypal\/express\/placeorder":["cart","checkout-data"],"paypal\/payflowexpress\/placeorder":["cart","checkout-data"],"paypal\/express\/onautho