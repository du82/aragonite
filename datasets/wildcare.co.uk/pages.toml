02Fload\u002F", "expirableSectionLifetime": 60, "expirableSectionNames": ["cart","persistent"], "cookieLifeTime": "3600", "updateSessionUrl": "https\u003A\u002F\u002Fwww.wildcare.co.uk\u002Fcustomer\u002Faccount\u002FupdateSession\u002F" } } } { "*": { "Magento_Customer/js/invalidation-processor": { "invalidationRules": { "website-rule": { "Magento_Customer/js/invalidation-rules/website-rule": { "scopeConfig": { "websiteId": "2" } } } } } } } { "body": { "pageCache": {"url":"https:\/\/www.wildcare.co.uk\/page_cache\/block\/render\/page_id\/11\/","handles":["default","cms_page_view","cms_page_view_id_about","searchanise_handler"],"originalRequest":{"route":"cms","controller":"page","action":"view","uri":"\/about"},"versionCookieName":"private_content_version"} } } Wildcare are committed to supporting the ecology industry with the best products and service High level of personal service – we like to get to know our customers Fast turnaround – we maintain high stock levels and offer next day shipping to most UK locations Inhouse repair and service centre for bat recorders and other equipment Wide range of ecology and estate management equipment Rental service means you don’t have to make expensive purchases for one-off use Specialist technical advice on the best equipment for your projects Our history Originally trading under the name of Envisage, our company began in 2001. Back then we used to offer an estate management service and supplied a small range of wildlife products. However, supplying equipment to ecologists quickly grew to become the focus of our business, and we became Envisage Wildcare Ltd, finally selling off the estate management work in 2007. In August 2014 the business was sold, becoming a separate entity within Stow Agricultural Ltd, with the trading name Wildcare. 2021 saw Wildcare become its own Limited company. Of course, the team and location still remain unchanged, but we have become a fully separate legal entity. We now have a full team at our location in the heart of the beautiful Cotswolds, where we hold plenty of stock allowing the fastest possible delivery and an expanding range. We also have a service and repair centre, where you can send your surveying equipment and bat detectors to us to be serviced, repaired and ready to go for the season. Additionally, we offer a bat detector rental service, which reduces the up-front cost of a new unit and is perfect for one-off surveys. Our ethos We're here to support you as a professional ecologist, wildlife enthusiast, educational body or conservationist. Our personal customer support and attention is what sets us apart in a rapidly automated commercial world. We know what it is like to be out in the field, wet, cold and struggling to finish a job that would have been finished earlier, if only the supplies had turned up on time. We understand how clients don't give you the go-ahead until the season is already upon you, meaning you simply have to get your equipment next day. Our next day delivery service combined with expert customer service team ensures our clients have the best experience possible. Helpful Links Contact Us About Us Meet the Team Jobs Delivery Returns Equipment Hire Service and Repair Centre Reviews Customer Photo Gallery Privacy Policy Terms & Conditions'''
