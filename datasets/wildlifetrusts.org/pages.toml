["https://wildlifetrusts.org/actions/how-attract-butterflies-your-garden"]
title = "How to attract butterflies to your garden | The Wildlife Trusts"
description = "Provide food for caterpillars and choose nectar-rich plants for butterflies and you’ll have a colourful, fluttering display in your garden for many months."
full_description = "How to attract butterflies to your garden PollinatorInsectButterfly Provide food for caterpillars and choose nectar-rich plants for butterflies and you’ll have a colourful, fluttering display in your garden for many months. While just about any flower with nectar can be a treat for butterflies, it is a slightly different story for caterpillar food or 'host' plants. In fact, most butterfly species have just a short list of host plants. Often this is because caterpillars need particular chemicals from that plant to bring out their warning colouration as butterflies. Some butterflies and caterpillars overwinter, so shelter in the garden, such as thick growths of ivy, is also important. Plants for butterflies Species Host plant Comma Stinging nettle, hop, currants Common blue Bird’s-foot-trefoil Dingy skipper Bird’s-foot-trefoil, horseshoe vetch Green-veined white Hedge mustard, cuckooflower, nasturtium Holly blue Holly, ivy Large skipper Cock's-foot, false brome Large white Cultivated varieties of Brassica oleracea, such as cabbage and brussel-sprouts, nasturtium, wild mignonette Marsh fritillary Devil's-bit scabious Meadow brown Grasses: fescues, meadow-grasses and bents Orange-tip Cuckooflower, garlic mustard, honesty Painted lady Thistles, stinging nettle Peacock Stinging nettle Red admiral Stinging nettle, hop Ringlet Cock's-foot, false brome, tufted hair-grass, common couch Small copper Common sorrel, sheep's sorrel Small skipper Yorkshire-fog Small tortoiseshell Stinging nettle, small nettle Small white Cultivated varieties of Brassica oleracea, such as cabbage, nasturtium, wild mignonette, hedge mustard, garlic mustard Wall brown Cock's-foot, false brome, Yorkshire-fog, wavy hair-grass Growing host plants for caterpillars in the garden is not necessarily guaranteed to attract the relevant butterflies, but butterflies do breed in gardens, so it is worth experimenting with different host plants to see which species might find your garden suitable. Read our butterfly guide (https://www.wildlifetrusts.org/sites/default/files/2020-04/Grow%20a%20secret%20garden%20for%20butterflies%2C%20Wild%20About%20Gardens%202020.pdf) More ways you can help wildlife Action How to grow a wildlife- friendly vegetable garden Learn about companion planting, friendly pest control, organic repellents and how wildlife and growing vegetables can go hand in hand.… Action How to grow a wild patch or mini meadow Whether it's a flowerpot, flowerbed, wild patch in your lawn, or entire meadow, planting wildflowers provides vital resources to… Action How to create a vertical garden Gardening doesn’t need to be restricted to the ground - bring your walls to life for wildlife! Many types of plants will thrive in a…"
