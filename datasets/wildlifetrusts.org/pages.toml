["https://wildlifetrusts.org/get-involved/fund-us"]
title = "Funding nature’s recovery – for wildlife, people and our climate | The Wildlife Trusts"
description = "The UK is one of the most nature-depleted places in the world, and climate change is now one of the greatest threats to the UK’s wildlife. But we can change this. The UK could be a global leader in restoring nature."
full_description = "false - Jon Hawkins – Surrey Hills Photography Funding nature’s recovery – for wildlife, people and our climate We stand up for nature under threat () image/svg+xml We work for nature and people across the UK () image/svg+xml We lead and support The Wildlife Trusts federation () image/svg+xml We collaborate with national partners and funders () Our natural world is in a state of emergency – you can help The UK is one of the most nature-depleted places in the world, and climate change is now one of the greatest threats to the UK’s wildlife. But we can change this. The UK could be a global leader in restoring nature. The Wildlife Trust’ vision is of wildlife thriving on land and at sea, with nature helping to address the climate emergency, and everyone inspired and empowered to take action for nature’s recovery. We are fortunate to work in partnership with some wonderful funders who share our concern for nature and want to be part of the solution. Who we are: the Royal Society of Wildlife Trusts The Royal Society of Wildlife Trusts (RSWT) is the central charity which supports the 46 individual Wildlife Trusts. Together we are The Wildlife Trusts, a federation of independent charities covering the whole of the UK, Alderney and the Isle of Man. The Royal Society of Wildlife Trusts supports the 46 Wildlife Trusts to be as impactful as possible and to stand up for nature together on a regional, national and global scale. We collaborate in national-level coalitions and we stand up for nature under threat through public campaigns and by advocating with Government. We lead on key areas of work for The Wildlife Trusts federation, such as climate change, research and landscape-scale nature restoration. The Wildlife Trusts’ members and supporters stand with us in our public campaigns to protect and restore nature. Wildlife Trusts Impact (https://www.youtube.com/watch?v=nuoDRDQJNBU ) How you can support our work Grants and donations of any size will support our work for nature’s recovery. We are very grateful to all our funders who make our work possible. Fund us Providing unrestricted funding is the most powerful thing that a funder can do to support us. Unrestricted funding supports vital areas of work and enables us to innovate and develop, so The Wildlife Trusts can be even more impactful in our work for nature. It allows us to be flexible to respond to changing situations and challenges - and take opportunities as they arise in order to achieve our goals. Making funding unrestricted reduces bureaucracy for us (and funders!), so that every pound can be used more efficiently to have the greatest impact for climate, nature and people. Fund a programme Some funders like to support a programme of work with a specific area of focus, such as climate change, agriculture or peatlands. This is one way of supporting a range of activities delivered by RSWT and the individual Wildlife Trusts, within a coordinated programme over several years. For example, our three-year Precious Peatlands programme supports national advocacy for peatlands to be protected and restored, alongside on-the-ground work to repair Britain’s globally important peatlands where they have been damaged. We are able to distribute grants on behalf of funders. We manage the administration, governance and reporting on the programme’s impact. You can find out more about our grant distribution here. Fund a project Funders can support a particular area of work with a one-off donation or work in partnership with us over many years. Long-term support means we can plan our work strategically, knowing we are able to continue this work in the future. Changing the world takes time, and with a funder’s support over several years, we can work towards longer-term goals and build momentum for the big changes that nature needs. Our big areas of work Combatting the climate change crisis We are in the middle of a climate and nature emergency, and the two are inextricably linked. Climate change is driving nature’s decline… FarmingNature-friendly farmingOver 70% of the UK’s land is farmed in some way – so how this land is managed has a big impact on wildlife. How we use our landWaterWater and wetlands are a vital part of our natural world – the lives of animals, plants and people depend on them for their survival. Bringing wildlife back The work The Wildlife Trusts do to protect wildlife on land and at sea. Saving the UK’s wildlife and wild places and helping them to… Our seasBringing wildlife back at seaWe need better protection and management of our seas so that species which have declined can become common again. What we're doingRewildingMaking more space for nature to become abundant once again will give our struggling wildlife the chance to recover RestorationAtlantic rainforest restorationThe 100-year temperate rainforest restoration programme will restore approximately 1,755 hectares of temperate rainforest across the British Isles. Well-beingNature for health and well-beingEvidence shows that a thriving, wildlife-rich environment benefits both physical and mental health. EducationEducation and learningOur vision is that people of all ages and backgrounds have the chance to learn about wildlife and the value of the natural world Find out more about us Who we are Our strategy Our impact Our accounts How we are funded Get in touch If you are a funder and would like to talk about how you could work with The Wildlife Trusts, please contact Ellen Kinsley, Head of Fundraising, by email on ekinsley@wildlifetrusts.org or by telephone on 01636 670045. If you are a business, click here to find out how we could work together. Tackling the climate and nature crises together Find out more about some of the fantastic funders who support us. People's Postcode Lottery The funding from players of People’s Postcode Lottery supports a wide range of Wildlife Trust projects, including educational programmes… The National Lottery Community Fund The National Lottery Community Fund is one of 12 distribution bodies for the National Lottery and is one of the largest funder of… The National Lottery Heritage Fund The National Lottery Heritage Fund support has helped to reconnect thousands of people with nature and protect an amazing range of rare… Esmée Fairbairn Foundation Established in 1961, Esmée Fairbairn Foundation is one of the largest independent grant funders in the UK. Each year the Foundation… European Climate Foundation The European Climate Foundation is an independent Foundation committed to creating a net-zero greenhouse gas emissions society and… John Ellerman Foundation John Ellerman Foundation are an independent grant-making foundation supporting charities that make a difference to people, society and… King Charles III Charitable Fund King Charles III Charitable Fund (KCCF) was founded by His Majesty King Charles III in 1979 with a mission to transform lives and build… Ecological Restoration Fund Ecological Restoration Fund supports work that protects biodiverse hot-spots, rejuvenates degraded landscapes and promotes local… Worwin UK Foundation With support from Worwin UK Foundation, The Wildlife Trusts are restoring the UK’s peatlands and raising public and political awareness…"
