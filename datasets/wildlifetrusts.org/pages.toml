title = "Change how you travel | The Wildlife Trusts"
description = "Reduce your travel emissions"
full_description = "Change how you travel Climate changeLifestyle Reduce your travel emissions Emissions from cars and air travel pollute the world around us and cause significant health impacts. Carbon dioxide is released by burning fossil fuels like oil, which the petrol and diesel that we use in our cars is derived from. This harmful greenhouse gas contributes to climate change, including extreme weather events, sea-level rise, floods and drought. Additionally, our cars produce nitrogen oxides. When we breathe this in it can, over time, affect how well our lungs work, as well as the health of our wildlife. Reducing your vehicle emissions doesn’t just reduce the pollution you produce, but can also save you money too! Ten top tips for reducing your vehicle emissions: Avoid flights where you can - reduce how many times you go abroad each year, or see if you can get there by boat or train instead of air. Where possible, use public transport – chances are they're going where you are. Take a hike – enjoy the walk instead of being sat in the car. Choose two wheels instead of 4 – cycling to your destination is good for your health and the environment. Car share - share your journey with colleagues and friends. You can even try a ride-sharing service and meet new people. Care for your car – tyre pressure and brake upkeep can impact the level of emissions. Drive efficiently – avoid idling, use higher gears and maintain a steady speed whenever possible. Avoiding heavy braking can reduce the microplastics that your tyres shed. Avoid using cars for short journeys – combine trips or use other transport. Open the windows instead of using the air conditioning – air conditioning systems increase fuel consumption and emissions. Choose a greener car – hybrid and electric vehicles are greener alternatives, and electric vehicles produce no exhaust emissions when being driven. If buying electric isn’t an option, it’s worth looking for cars with the lowest emissions; these should be listed whenever you buy a vehicle, new or second-hand. Making changes to your vehicle emissions will: Reduce your fuel bills. Reduce your transport costs. Provide fitness benefits if you walk or bike instead Reduce wear and tear on your car and save you money in the long term. Reduce your road tax costs if you switch to a lower emission car. More ways you can help wildlife Action Change your energy use Energy used in buildings accounted for around 20% of total UK emissions in 2022. Reducing your household energy use by switching to a… Action Watch what you wash away Some cosmetics, soaps, washing-up liquids and cleaning products can be harmful to wildlife with long-lasting effects. Action Recycle and reuse Recycle, upcycle - and make do and mend! Production of household waste needs to decrease by 33% by 2037 to reach recommended emissions…"
