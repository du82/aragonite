["https://wildlifetrusts.org/adopt-animal/adopt-insect"]
title = "Adopt an insect | The Wildlife Trusts"
description = "Searching for an original gift for a nature lover? Sponsor an insect with the Wildlife Trusts to help fund conservation efforts. Perfect for adults and children! Adopt a stag beetle, a butterfly or a bee."
full_description = "Jon Hawkins - Surrey Hills Photography Adopt an insect © Chris Lawrence Hertfordshire & Middlesex Wildlife Trust - Small blue butterfly What you'll receive for £20: A personalised sponsorship certificate and beautiful colour photograph, two fantastic factsheets all about your sponsored species and their habitat, and a welcome letter introducing you to us and our work. Adopt a small blue butterfly with Hertfordshire & Middlesex Wildlife Trust. Buff-tailed Bumblebee ©Jon Hawkins - Surrey Hills Photograhpy Scottish Wildlife Trust - Bumblebee What you'll receive for £30: A personalised adoption certificate, a beautiful wooden keyring featuring a bumblebee, an exclusive papercraft model of a garden bumblebee, a garden bumblebee fact file, a Go Wild activity book, a garden bumblebee bookmark, two stunning bumblebee postcards, details on how to sign up to receive exclusive email updates about bees. Adopt a bumblebee with Scottish Wildlife Trust. Birmingham & Black Country Wildlife Trust - Insect gift box What you'll receive for £15: A paper toy kit containing 12 pages of high quality 100% recycled, plastic free paper to make a ladybird, bee, dragonfly and rhinoceros beetle to cut out, create and keep. The pack also contains a species fact card, native wildflower seeds and an introduction to our Action for Insects campaign with lots of ideas for ways the recipient can help these iconic insects, this gift box is perfect for wildlife lovers young and old. Buy a Bee-utiful Gift Box. David Williams Shropshire Wildlife Trust - Bilberry bumblebee What you'll receive for £20: A gift certificate, a photograph and an illustrated factsheet, packed with interesting information. Sponsor a bilberry bumblebee with Shropshire Wildlife Trust. Surrey Wildlife Trust Surrey Wildlife Trust - Silver-studded butterfly What you’ll receive for £15: A digital pack consisting of a beautifully illustrated certificate and accompanying fact sheet with fascinating information on the silver-studded blue. Adopt a silver-studded blue butterfly with Surrey Wildlife Trust. Geoff Oxford The Wildlife Trust for Bedfordshire, Cambridgeshire & Northamptonshire - Tansy beetle What you'll receive for £15: A sponsorship certificate and a factsheet, packed with interesting information. Sponsor a tansy beetle with The Wildlife Trust for Bedfordshire, Cambridgeshire & Northamptonshire. Credit: Steve Lane Somerset Wildlife Trust - Large blue butterfly What you'll receive for £20: A fun cardboard cut-out toy of a large blue butterfly, an information sheet, a large blue butterfly postcard, and an adoption certificate. Sponsor a large blue butterfly with Somerset Wildlife Trust. Surrey Wildlife Trust Surrey Wildlife Trust - Small blue butterfly What you’ll receive for £15: A digital pack consisting of a beautifully illustrated certificate and accompanying fact sheet with fascinating information on the small blue. Adopt a small blue butterfly with Surrey Wildlife Trust. Jill Orme Worcestershire Wildlife Trust - Hairy-footed flower bee What you'll receive for £15: A factsheet about hairy-footed flower bees, an adoption certificate, a welcome letter from us, a Create Your Own Nature Reserve Game for our younger adoptees, a thank you message with a note to the recipient from you, a hi-res image of a hairy-footed flower bee in Worcestershire to use as a screensaver. Adopt a hairy-footed flower bee with Worcestershire Wildlife Trust. Surrey Wildlife Trust Surrey Wildlife Trust - Stag beetle What you’ll receive for £15: A digital pack consisting of a beautifully illustrated certificate and accompanying fact sheet with fascinating information on the Small Blue. Adopt a stag beetle with Surrey Wildlife Trust. Buff-tailed BumbleBee © Jon Hawkins Surrey Hills Photography Herefordshire Wildlife Trust - Bumblebee What you'll receive for £30 (postal): A certificate, a soft toy, a guide packed with facts about your animal, a bookmark, and a packet of wildflower seeds. Plus three