["https://wildlifetrusts.org/actions/how-attract-bumblebees-your-garden"]
title = "How to attract bumblebees to your garden | The Wildlife Trusts"
description = "The best plants for bumblebees! Bees are important pollinating insects, but they are under threat. You can help them by planting bumblebee-friendly flowers."
full_description = "How to attract bumblebees to your garden PollinatorBee The best plants for bumblebees! Bees are important pollinating insects, but they are under threat. You can help them by planting bumblebee-friendly flowers. Bumblebees are vitally important for pollinating hundreds of plant species, including many crops. But they are under threat from the loss and degradation of our habitats due to pressures such as development, agricultural intensification and climate change. Bumblebees look for certain types of flowers. Those with shorter tongues need short, open flowers, with nectar within easy reach. This includes flowers from the daisy family and alliums, which have a number of small flowers on one stalk. Bumblebees with long tongues can enjoy deeper flowers like honeysuckle. Having some early and some late flowers in your planting mix will prolong the nectar season for bumblebees Top 30 plants for bumblebees As with any planting for nectar, having some early and late flowers in the mix will prolong the nectar season for bumblebees. Planting them in drifts will help bees recognise them and allows them to visit repeatedly. Agastache (agastache sp) Betony (stachys officianlis) Borage (borago officianalis) Broad bean (vicia g faba) Buddleia (buddleia davidii) Bugle (ajuga reptans) Catmint (nepeta) Chives (allium schoenoprasum) Clovers (trifolium) Comfrey (spymphytum officianale) Cranesbill (geranium) Curry plant (helichrysum angustifolium) Figwort (scrophularia nodosa) Foxglove (digitalis purpurea) Honeysuckle (lonicera) Heather (calluna, erica) Knapweed (centaurea) Lavender (Lavandula angustifolia) Marjoram (origanum vulgare) Mints (mentha) Nasturium (tropaeolum majus) Poached Egg plant (limnanthes douglasii) Rosemary (rosmarinus officianalis) Sage (salvia officianalis) Larkspur (delphinium) Snapdragon (antirrhinum) Thistles (cirsium) Toadflax (linaria vulgaris) Verbascum (verbascum) Viper’s bugloss (echium vulgare) Woundworts (stachys arvensis) Seasonal planting Having some early and some late flowers in your planting mix will prolong the nectar season for bumble bees and other pollinators, too. Planting them in drifts will help bees to recognise them easily, allowing them to visit repeatedly. Early flowers Late flowers Aubretia (aubretia) Buddleia (buddleia davidii) Dandelion (taraxacum) Ceanothus (ceonothus) English bluebells (hyancynthiodes non-scripta) Cone flower (echinacea) Flowering currant (ribes sanguinium) Goldenrod (solidago candensis) Forget-me-not (myosotis arvensis) Ivy (hedera helix) Hazel (corylus avellana) Lavender (lavandula) Primrose (primula vulgaris) Michaelmas daisies (aster) Pussy willow (alix caprea) Red valerian (centranthus rubra) Wallflower (Erysimum cheiri) Sedum (sedum spectabile) White deadnettle (lamium album) Some bumblebee flower favourites The buff-tailed bumblebee and white-tailed bumblebee prefer short, open flowers, such as white clover and comfrey. Both are hole-biting, ‘nectar robbers’. The buff-tailed bumblebee rarely visits pendulous flowers as its large size means it is not agile enough to do so. The garden bumblebee has a long tongue, so it can visit flowers with petals that form long tubes, such as honeysuckle, delphiniums and catmint. The red-tailed bumblebee is a large bee that likes to land on flowers with ‘platforms’, such as daisies and knapweeds. The early bumblebee is a small, agile bee, with a medium-length tongue, which means it can probe a range of flower depths and is able to visit upside-down and drooping flowers, such as comfrey and viper’s-bugloss. The common carder bee is long-tongued and able to get nectar from long-tubed flowers, such as the late flowers of white dead-nettle. Male bees seem to visit compound daisy-like flowers, such as marsh thistle, more than females. More ways you can help wildlife Action How to make a bee hotel Solitary bees are important pollinators and a gardener’s friend. Help them by building a bee hotel for your home or garden and watch… Action How to attract butterflies to your garden Provide food for caterpillars and choose nectar-rich plants for butterflies and you’ll have a colourful, fluttering display in your… Action How to start a wildlife garden from scratch Use the blank canvas of your garden to make a home for wildlife."
