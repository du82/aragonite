["https://wildlifetrusts.org/about-us/combatting-climate-change-crisis"]
title = "Combatting the climate change crisis | The Wildlife Trusts"
description = "We are in the middle of a climate and nature emergency, and the two are inextricably linked. Climate change is driving nature’s decline, and the loss of wildlife and wild places leaves us ill-equipped to reduce carbon emissions and adapt to change."
full_description = "Joe Cornish/2020Vision Combatting the Climate Change Crisis A global emergencyWe are in the middle of a climate and nature emergency, and the two are inextricably linked. Climate change is driving nature’s decline, and the loss of wildlife and wild places leaves us ill-equipped to reduce carbon emissions and adapt to change. One cannot be solved without the other. We need to reduce emissions of greenhouse gas emissions, and adapt to the effects of climate change. Nature plays a key role in both. When healthy, our natural habitats can lock away carbon, reduce the risk of flooding, provide shading from hot temperatures, maintain healthy soils, clean water and the pollinators needed for our crops – and therefore sustain us, including improving our health and wellbeing. What are The Wildlife Trusts doing?For decades, Wildlife Trusts up and down the country have been working on the ground to restore nature. We protect and recover important habitats, including peatland, woodland, and saltmarsh, which lock carbon safely away and limit the effects of climate change. We invest in natural flood management and urban greenspace, and champion the role of nature in helping to reduce the effects of climate change. Read The Wildlife Trusts' Climate Statement In response to the climate crisis, The Wildlife Trusts are: Stepping up our work to restore vital habitats that lock away carbon and help to boost resilience to climate change, on a landscape scale Calling for more investment in natural climate solutions and nature's recovery, as a priority in tackling climate change Ensuring natural solutions are at the heart of local and national decision-making, such as planning Working to ensure people of all walks of life can connect with and enjoy nature, for the benefit of our health and wellbeing Raising awareness of the climate crisis and actions that can be taken, including how individuals can take action to get to net zero and adapt to climate change Working towards being net zero and addressing the risks from climate change to nature on our own estate Download our reports Changing Nature: A climate adaption report by The Wildlife Trusts Our Year in Adaptation - Progress Report for 2022-23 Embracing Nature – Adaptation Progress Report for 2023-24 The Wildlife Trusts Greenhouse Gas Inventory 2020-21 The Wildlife Trusts' Greenhouse Gas Inventory 2021-22 Quantifying the potential impact of nature based solutions on greenhouse gas emissions from UK habitats The Wildlife Trusts’ Nature-based Solutions Showcase 2023.pdf Addressing your own carbon footprint and adapting to climate change We have lots of advice on how you can take action to reduce your greenhouse gas emissions and adapt to climate change in a nature-positive way. Check out our resources below. How can I get to net zero? | The Wildlife Trusts Things you can do about climate change | The Wildlife Trusts Reducing our carbon footprint (https://www.youtube.com/watch?v=2AKnKZZHFPI) Latest news and activities Meeting our net zero target Adapting to climate change COP29 outcomes on climate action COP28 outcomes on climate action Mark Hamblin/2020VISION Climate solutions Natural flood management Soil management Jon Hawkins - Surrey Hills Photography Pollinators We need your helpSupport work to protect and recover important habitats that lock carbon away I am making a donation of £"
