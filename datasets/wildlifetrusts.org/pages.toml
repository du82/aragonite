title = "Climate solutions | The Wildlife Trusts"
description = "We are in the middle of a climate and nature emergency, and the two are inextricably linked. Climate change is driving nature’s decline, and the loss of wildlife and wild places leaves us ill-equipped to reduce carbon emissions and adapt to change."
full_description = "Natural woodland of Scot's pine by Mark Hamblin/2020VISION Climate solutions Restoring nature can help soak up carbon emissionsRestoring nature can help soak up carbon emissions - known as natural solutions to climate change - whilst contributing many additional benefits. Peatlands, woodlands, ocean sediment, seagrass and wetlands are just a few of the incredible natural carbon stores that we need to start protecting and making use of. Nature itself is at risk from climate change, but if helped to recover, its potential to store carbon does mean it can help us to turn the tide on the climate catastrophe. Natural solutions (https://www.youtube.com/watch?v=4U38zMjjkW0) Green carbon solutions to climate changeOur habitats on land have a huge role to play in addressing climate change. Globally, plants have removed 25% of human-made carbon emissions, whilst our soils contain more carbon than is stored in those plants and the atmosphere combined! Mark Hamblin/2020VISION Powerful peatlandsFind out more © David Tipling/2020VISION Wonderful woodlandsFind out more Jon Hawkins - Surrey Hills Photography Glorious grasslandsFind out more Penny Dixie Wild wetlandsFind out more Blue carbon solutions to climate changeBlue carbon has a huge role to play in tackling climate change. Oceans absorb 20-35% of human-made carbon emissions every year. Carbon is part of the whole system - stored in the tissues of the plants and animals, and in the mud and sediments. Seagrass ©Paul Naylor www.marinephoto.co.uk/ Spectacular seagrassFind out more Minke whale off Rathlin Island ©Tom McDonnell Outstanding ocean sedimentsFind out more ©Terry Whittaker/2020VISION Super saltmarshesFind out more"
