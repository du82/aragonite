title = "Home | The Wildlife Trusts"
description = "The Wildlife Trusts are a federation of 46 independent wildlife conservation charities covering the whole of the UK. We manage nature reserves, help children to learn about nature and campaign to protect our seas."
full_description = '''©chabybucko Our fundraising challenge for little explorersSign up for The Hedgehog Walk!This spring, The Wildlife Trusts invites you to join The Hedgehog Walk! From 31st March to 13th April, take on the challenge of walking 3km while fundraising for wildlife along the way. Find out more 900,000 members (https://www.wildlifetrusts.org/join) 2,600 nature reserves across the UK (https://www.wildlifetrusts.org/nature-reserves) image/svg+xml 4,600 km of rivers and streams improved (https://www.wildlifetrusts.org/water) image/svg+xml 43,169 hectares of peatland restored (https://www.wildlifetrusts.org/natural-solutions-climate-change/peatland) The Wildlife TrustsWe are a grassroots movement that believes we need nature and it needs us. More than 900,000 members and 39,000 volunteers work together with their Wildlife Trust to make their local area wilder and make nature part of life, for everyone. Every Wildlife Trust is an independent charity. We’d love you to join us. More about us Caudhole Moss, Simonside (c) Duncan Hutt For nature and the nationRothbury EstateBe part of this unique chance to create one of the largest areas for nature’s recovery in England. A project of national significance within an iconic landscape, rich in history and heritage. A once-in-a-generation opportunity Female blackbird © Mark Hamblin/2020VISION SupportJoin your Wildlife Trust todayBy becoming a member of your Wildlife Trust you will be helping to look after the wildlife and wild places in your area. Become a member Flooding at Fingringhoe Wick in Essex by Matthew Roberts Wild LIVECould nature be our best flood defence?During Wild LIVE we discuss some of the really important issues of the moment relating to wildlife and the natural world. Each episode we're joined by fantastic guests who share their thoughts and expertise, and answer your burning questions! Register Help us to restore 30% of land and sea for nature by 2030Together we can save wildlife I am making a don