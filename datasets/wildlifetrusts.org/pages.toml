["https://wildlifetrusts.org/how-identify-bumblebees"]
title = "How to identify bumblebees | The Wildlife Trusts"
description = "In Britain we have around 270 species of bee. These include solitary bees, bumblebees and honeybees. You can identify some of the common bumblebees you see buzzing around parks and gardens using our guide."
full_description = "Corinne Welch How to identify bumblebees What bee is this?In Britain we have around 270 species of bee and of them, 24 are species of bumblebee. You can identify some of the common bumblebees you see buzzing around our parks and gardens using our guide. Common carder bee The common carder bee is a fluffy, brown-and-orange bumblebee, sometimes displaying darker bands on the abdomen. One of our most common bumblebees, the common carder bee emerges early in the spring and can be seen feeding on flowers right through to November. Illustration by Corinne Welch Common Carder Bee ©Rachel Scopes Early bumblebee The early bumblebee is relatively small, with distinctive lemon-yellow bands on its thorax and abdomen, and an orange tail. It is found throughout the UK in all kinds of habitats. It is a small bee and an important pollinator of soft fruit, such as raspberries and blackberries. Illustration by Corinne Welch Jon Hawkins - Surrey Hills Photography Tree bumblebee The tree bumblebee has fuzzy, browny-orange hairs on its thorax, a black abdomen, and a white tail. It can now be found in much of England and Wales and has reached Southern Scotland. It is associated with open woodland, so is commonly found in gardens that have a similar type of habitat. Illustration by Corinne Welch Tree bumblebee by Wendy Carter Red-tailed bumblebee The female red-tailed bumblebee is a very large, black bumblebee with a big red 'tail' while males are smaller. It can be found in gardens, farmland, woodland edges, hedgerows and heathland - anywhere there are flowers to feed on. Illustration by Corinne Welch Red-tailed bumblebee ©Jon Hawkins - Surrey Hills Photography Garden bumblebee The garden bumblebee is a large, scruffy-looking bee, with a long tongue and face. It has yellow bands at the collar, rear of the thorax and at the first segment of the abdomen, and the tip of the tail is white. It is a relatively large a bumblebee and can be found in a variety of habitats from woodlands to gardens. Illustration by Corinne Welch Garden bumblebee by Chris Gomersall/2020VISION Buff-tailed bumblebee The buff-tailed bumblebee has a yellow collar near the head and another on the abdomen. The queen has a buff-coloured 'tail', while the workers have white 'tails' with a faint buff line separating them from the rest of the abdomen. Males have buff-tinged tails and also have black hair on their faces. Buff-tailed bumblebees are the biggest of the bumblebees and are found in lowland areas. Illustration by Corinne Welch Buff-tailed BumbleBee © Jon Hawkins Surrey Hills Photography White-tailed bumblebee The white-tailed bumblebee is black with two lemon-yellow bands on its body and a white 'tail'. There are several very similar species that can be very difficult to tell apart. The buff-tailed bumblebee, for example, has black and dull yellow bands, and a buff-coloured tail, instead of a bright white one. White-tailed bumblebees are also similar to garden bumblebees who again have a white tail but the stripes are in a slightly different place. White-tailed bumblebees can be found in gardens, farmland, woodland edges, hedgerows and heathland - anywhere there are flowers to feed on. Illustration by Corinne Welch © Derek Moore Other bees you may have spotted! Membership Join your Wildlife Trust and help protect wildlife and wild places on your doorstep. Make a difference for as little as £3 a month. Blog Identify solitary bees in the UK What bee have you found? Read the best guide to identifying solitary bees that can be found in the UK. Here are a few you may have… Save bees and pollinators We have pollinators to thank for every third mouthful we eat. Not only do they pollinate our food crops, but they’re also vital for the… How you can helpAs a charity we rely on memberships. They help us look after over 2,300 nature reserves and protect the animals that call them home. Join for as little as £3 a month Bertie Gregory/2020VISION Sign up to our e-news!Get monthly newsletters packed with ways that you can help wildlife! Sign up"
year_published = 2025
