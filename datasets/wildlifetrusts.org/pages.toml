t What you'll receive for £15: A welcome letter, certificate and beautiful colour photograph, factsheets about the barn owl and its habitat, wildlife postcard and a Go Wild events guide. Adopt an owl with Herts & Middlesex Wildlife Trust. Barn owl © Danny Green/2020VISION Herefordshire Wildlife Trust What you'll receive for £30 (postal): A certificate, a soft toy, a guide packed with facts about your animal, a bookmark, and a packet of wildflower seeds. Plus three e-newsletters a year about your chosen species and what we're doing to help them. Price includes P&P What you'll receive for £15 (digital): Two photographs, a certificate, a guide packed with facts about your animal, and an Adventures in Nature activity booklet. PLUS three e-newsletters a year, with information about your chosen species and what we're doing to help them. All this delivered by email to download or print. Adopt a barn owl with Herefordshire Wildlife Trust. North Wales Wildlife Trust North Wales Wildlife Trust What you’ll receive for £30: A personalised sponsorship certificate, greetings card, bilingual factsheet about barn owls, bamboo pin badge, seedpaper bookmark, fridge magnet, and a pair of BareKind socks. Sponsor a barn owl with North Wales Wildlife Trust. Chris Gomersall/2020VISION Love wildlife?Become a member"
