["https://wildlifetrusts.org/actions/food"]
title = "Change what you eat | The Wildlife Trusts"
description = "Eat more plant-based foods, reduce your food waste and buy local produce to shrink your environmental footprint."
full_description = "Corinne Welch Change what you eat Climate changeLifestyle Eat more plant-based foods, reduce your food waste and buy local produce to shrink your environmental footprint. Top tips! Eat more plant-based foods. Vegetarian and vegan diets have much lower greenhouse gas emissions, estimated to be 62 - 75% less than diets consuming 100g or more meat each day. Reduce your food waste. Find out where people are selling local produce in your area, and see what's on offer. Buying local means fewer travel emissions associated with your food and often means that you'll also be buying more seasonal produce, which is often tastier too! Check which fruit and vegetables are in season - it's more likely they'll be sourced at the right time of year. You could sign up for a local fruit and veg box that gives you excess or 'ugly' produce that may otherwise go to waste. When shopping, check the country of origin on labels. Food products in our aisles are often transported to us via air, sea or land and the journeys result in emissions from fossil fuels. Look for products that use less plastic packaging. Plastic is made of fossil fuels, and also means less waste getting into our seas and harming our wildlife. Buying local produce is an easy way to reduce plastic use as it doesn’t need to be packaged in plastic to be kept fresh during a long journey. Grow your own produce. Reduce your food waste10 tips to get started Reduce one-use plasticTips to get started More ways you can help wildlife Action How to help wildlife at school Whether feeding the birds, or sowing a wildflower patch, setting up wildlife areas in your school makes for happier, healthier and more… Action How to be an eco-friendly pet owner Caring for a pet is a rewarding experience that doesn't have to cost the earth. Action Smart souvenir shopping Bringing a piece of your holiday home is a great way of keeping the memories alive – just make sure it’s wildlife-friendly! Action How to help wildlife at school Whether feeding the birds, or sowing a wildflower patch, setting up wildlife areas in your school makes for happier, healthier and more…"
