["https://wildlifetrusts.org/gift-in-your-will"]
title = "Gifts in Wills"
description = "Including a gift in your Will to The Wildlife Trusts, no matter the size, makes a difference and helps protect wildlife for the future. Please consider leaving a gift to The Wildlife Trusts in your Will to support a wildlife-rich natural world for future generations. Thanks to our members and supporters, The Wildlife Trusts are at the forefront of wildlife conservation. We believe that everyone deserves to live in a healthy, wildlife-rich natural world and have the opportunity to experience the joy of wildlife and wild places in their daily lives. Legacy gifts received in Wills help make this possible."
full_description = "Tom Marshall help wildlife on your doorstepInclude a gift in your Will Make a real differenceWherever you live in the UK, your local Wildlife Trust is working to protect the wildlife and wild places that you love. You can include a gift in your Will to support this work - a gift dedicated to saving endangered wildlife and giving future generations the opportunity to enjoy a healthy, wildlife-rich natural world. A gift of just 1% of your estate can achieve amazing things for wildlife. Get in touch If you'd like to find out more about how a gift in your Will can save the wildlife you love, fill in the form below to hear from the Wildlife Trust of your choice: First name Surname Email address I'm interested in leaving a gift in Will to: My local Wildlife Trust Another Wildlife Trust The Wildlife Trusts as a whole Postcode Which Wildlife Trust would you like to give to? - None -Avon Wildlife TrustAlderney Wildlife TrustThe Berks, Bucks and Oxon Wildlife TrustBeds, Cambs and Northants Wildlife Trust Birmingham & Black Country Wildlife TrustCheshire Wildlife Trust Cornwall Wildlife TrustCumbria Wildlife TrustDerbyshire Wildlife TrustDevon Wildlife TrustDorset Wildlife TrustDurham Wildlife TrustEssex Wildlife TrustGloucestershire Wildlife TrustGwent Wildlife TrustHampshire & Isle of Wight Wildlife TrustHerefordshire Wildlife TrustHerts and Middlesex Wildlife TrustIsles of Scilly Wildlife TrustKent Wildlife TrustLancashire Wildlife TrustLeicestershire & Rutland Wildlife TrustLincolnshire Wildlife TrustLondon Wildlife TrustManx Wildlife TrustMontgomeryshire Wildlife TrustNorfolk Wildlife TrustNorth Wales Wildlife TrustNorthumberland Wildlife TrustNottinghamshire Wildlife TrustRadnorshire Wildlife TrustScottish Wildlife TrustSheffield & Rotherham Wildlife TrustShropshire Wildlife TrustSomerset Wildlife TrustSouth & West Wales Wildlife TrustStaffordshire Wildlife TrustSuffolk Wildlife TrustSurrey Wildlife TrustSussex Wildlife TrustTees Valley Wildlife TrustUlster WildlifeWarwickshire Wildlife TrustWiltshire Wildlife TrustWorcestershire Wildlife TrustYorkshire Wildlife Trust Phone number If you're happy to be contacted via phone then leave your number. By filling in this form you are opting in to hear from us about gifts in Wills. We promise to protect your data in accordance with the Wildlife Trust Privacy Policy. Leave this field blank Jon Hawkins, Surrey Hills Photography Alternatively, search for your local Wildlife Trust Enter Postcode, Town or Place Already included a gift for wildlife in your Will?If a gift for a Wildlife Trust is already in your Will, and you're happy to let us know about it, we'd love to hear from you. There's no obligation to tell a charity that you've included a gift in your Will to them. But by letting us know, it helps us to better plan our future work for wildlife, and let you know how your gift will make a world of difference for nature. Tell us about your gift Sir David Attenborough ©Tom Marshall “Anyone who cares about wildlife has a marvellous opportunity to do something quite unique, by remembering their local Wildlife Trust in their will. This generous act is one of the most important things you can do to make sure the species and habitats we love will be there for future generations to enjoy.” - Sir David Attenborough Where the need is greatestAny gift you choose to include in your Will should to go towards causes close to your heart. A gift to your local Wildlife Trust is a gift for the nature on your doorstep, so you know that wildlife near you will benefit from your generosity. Alternatively, you can include a gift in your Will to The Wildlife Trusts on a national level. These gifts can support a wide variety of different work across the UK, from restoring wildflower meadows to educating future generations about the importance of the natural world. Please use the webform above if you'd like to hear from The Wildlife Trusts about how a gift in your Will can help your local wildlife. How gifts can help...Gift in Wills have helped us protect wild places, provide a lifeline to species under threat, and give local people opportunities to experience wildlife in their daily lives. Click on the stories below to find out more. Bringing back Devon's beavers Beaver kits by Mike Symes Thanks to legacies given to The Wildlife Trusts, wild beavers are successfully breeding in the English landscape after an absence of 400 years. Beavers are a great addition to our landscape because they are brilliant at creating wetland habitats which can prevent flooding further downstream. In 2016, Devon Wildlife Trust were delighted to announce the birth of the first wild baby beavers in England for centuries. Tom Buckley captured the fabulous footage of the beaver and her kits. He said: “When I saw these new born baby beavers I was totally overwhelmed and thought it must be a miracle. My first sighting of this year’s new born kits was when I saw their mother swimming with one of them in her mouth to an area nearby where their father was waiting to greet them”. A gift to protect local wildlife Cheshire WT Philip has included a gift to Cheshire Wildlife Trust in his Will so that cherished local wildlife is protected for the future. Phillip said ''I decided to leave a gift to Cheshire Wildife Trust in my Will because wildlife needs all the help it can get and the Trust is the 'go to' organisation for wildlife protection in this area.'' Last year, over 7% of Cheshire Wildlife Trust’s income came directly from people like Philip who have chosen to include a gift in their Will for wildlife. These gifts are used in lots of different areas of work, including looking after more than 40 nature reserves, ​​​​​protecting the region’s most endangered habitats and species, campaigning for greater protection of local wildlife, inspiring the next generation of wildlife lovers. Thank you, Philip. Creating a haven for wildlife In 1985 Anne and Lionel decided they wanted to do something extra special to help wildlife. They bought a four acre field near to their home in Staffordshire and have been working ever since to create rich and diverse habitats to help wildlife thrive. They added a further two acre piece of land in 1990. Thanks to their hard work, the land is now a haven for species such as the protected great crested newts, toads, frogs, badgers, weasels and stoats. Anne and Lionel have now been members of Staffordshire Wildlife Trust for 30 years. Recently, they decided to leave their land to the Trust as a gift in their wills, as well as money to assist with further care for the fields. They said “By purchasing the land, we made it our aim to provide an oasis for wildlife to enjoy and then hopefully thrive…being members of the Trust has given us a lot of pleasure over the years. We have seen the charity grow from its early roots and when we were writing our Wills and deciding who to leave the land to, we felt the Trust would be the right choice.” Thank you, Anne & Lionel Discovering and preserving beautiful wildflowers As an amateur botanist with a special interest in wild flower conservation, Tessa realised the importance of Waitby Greenriggs, Cumbria, for rare flowers such as orchids and Grass-of-Parnassus. Thanks to Tessa’s discovery, the area is now a nature reserve and thanks to a gift in her will to Cumbria Wildlife Trust, she will continue to support wild flower conservation for years to come. Tessa’s kind gift is helping to create a new wild flower meadow at Eyecott Hill Nature Reserve, Cumbria, so every year more and more people will see her passion and generosity in full bloom. Thank you, Tessa Our promise to you We recognise your loved ones come first in your Will. We will treat you fairly and we won’t intrude on your privacy. You don't need to tell us about the size or type of your legacy, because every gift makes a difference. We understand that circumstances change and there may be a time where you need to take The Wildlife Trusts out of your Will. We promise to use your gift wisely, in line with your wishes. Details you might need To include a gift in your Will to The Wildlife Trusts on a national level, you'll need this information: Full name: The Royal Society of Wildlife Trusts Registered Charity No: 207238 Our address: The Kiln, Waterside, Mather Road, Newark, Nottinghamshire, NG24 1WT Telephone: 01636 677 711 Frequently asked questions about leaving a gift in your Will We are part of Remember A Charity, a consortium of over 200 charities all working together to raise awareness of the importance of having a Will and encouraging more people to consider leaving a gift in their Will to charity. You can visit the Remember A Charity website to find local solicitors, who will be able to advise you on leaving gifts to charities when making a Will. Wildlife Trust members make our work possibleYou help us to look after over 2,300 nature reserves and protect the animals that call them home. Join today Mark Hamblin/2020VISION Let's put nature into recoveryThe Wildlife Trusts have a vision of at least 30% of our land and seas managed for nature. That means saving our wildlife and wild places. Your donation helps make this ambitious goal a reality. Donate today"
year_published = 2025
clearnet = "https://wildlifetrusts.org/gift-in-your-will"
