["https://wildlifetrusts.org/how-identify/identify-snakes"]
title = "Identify UK snakes | The Wildlife Trusts"
description = "Grass snake or adder? The UK has three species of grass snake, adder and smooth snake. Want to know how to identify British snakes? Read our guide to work out what snake you've spotted."
full_description = "Danny Green/2020VISION Identify snakes Spotted a snake?There are three species of snake native to the UK: grass snake, adder and smooth snake. Depending on where you are will affect what type of snake you're more likely to see. Adder The adder is a greyish snake, with a dark and very distinct zig-zag pattern down its back, and a red eye. Males tend to be more silvery-grey in colour, while females are more light or reddish-brown. Black (melanistic) forms are sometimes spotted. Adders are small, around 60 to 80cm and are mostly likely to be spotted in woodland, heathland and moorland habitat. Read more Adder ©Amy Lewis Adder ©Danny Green/2020VISION Adder © Jamie Hall ©Jon Hawkins Grass snake The grass snake is usually greenish in colour - although this can vary. They have a yellow and black collar, pale belly, and dark markings down the sides. They are our longest snake and can grow up to 150 cm. They are usually spotted in wetlands and grasslands but can be seen in gardens too. They can be attracted to compost heaps where they sometimes lay their eggs. Read more Grass snake ©Danny Green/2020VISION Grass snake ©Jamie Hall Grass snake ©Terry Whittaker/2020VISION ©David Chamberlain Smooth snake Similar in appearance to the adder, the smooth snake can be distinguished by its more slender body, round pupil and less well-formed dark pattern on its back. It is usually grey or dark brown in colour and around 60-70 cm in length. The rare smooth snake can only be found at a few heathland sites in the UK. Read more ©Steve Davis Smooth snake ©Steve Davis Not a snake! Slow worm At first glance, the slow worm might be mistaken for a snake, but it's actually a legless lizard! The slow worm is much smaller than a snake, with smoother, golden-grey skin. The head is a similar width to the body and seems to flow seamlessly into it, whereas our snakes have a slightly broader head that looks more distinct from the body. On closer inspection, slow worms also have eyelids and can be seen blinking (snakes do not), and they can shed their tail if threatened. Jim Higham ©Bruce Shortland ©D.A. Trebilco How you can helpAs a charity we rely on memberships. They help us look after over 2,300 nature reserves and protect the animals that call them home. Join for as little as £3 a month Bertie Gregory/2020VISION Sign up to our e-news!Get monthly newsletters packed with ways that you can help wildlife! Sign up Other species to look out for Species Common lizard Look out for a common lizard basking in the warm sun as you wander around heathlands, moorlands and grasslands. You might even be lucky… Species Sand lizard The sand lizard is extremely rare due to the loss of its sandy heath and dune habitats. Reintroduction programmes have helped establish… Species Smooth newt You are likely to spot the smooth newt in your garden or local pond. It breeds in water in summer and spends the rest of the year in…"
