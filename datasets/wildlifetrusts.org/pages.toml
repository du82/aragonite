["https://wildlifetrusts.org/closer-to-nature/volunteer"]
title = "Volunteer | The Wildlife Trusts"
description = "Volunteer to help wildlife in your local area. Volunteering opportunities range from community gardening, species surveying, caring for nature reserves, dry stone walling, hedge laying, habitat management, to running Wildlife Watch groups. You could volunteer organisational, IT, administrative or financial skills too. Both regular and casual volunteers are needed."
full_description = "Jon Hawkins, Surrey Hills Photography Find volunteering opportunities near you Enter Postcode, Town or Place image/svg+xml Look after a nature reserve () image/svg+xml Run an event () image/svg+xml Help out with office admin () image/svg+xml Gain new skills () What volunteer work should I do?There are plenty of ways you can donate your skills and time to look after wildlife! Opportunities include community gardening, species surveying (such as looking for otters!), caring for nature reserves, plant identification and GPS mapping. You can even run Wildlife Watch groups, which enable young people to discover and explore their local environment. Our volunteers carry out a huge range of tasks but it doesn't have to be outdoors! You could find yourself making good use of your organisational, IT, administrative or financial skills too. Each Wildlife Trust has a large number of both regular and casual volunteers, amounting to a total of more than 38,000 volunteers across the UK. Find your local Wildlife Trust below and start your volunteering adventure today! “Volunteering at the reserve helps me keep fit and meet new people and it’s also great to see so much wildlife.” Jon Hawkins, Surrey Hills Photography London Wildlife Trust volunteers Ross Hoddinott/2020VISION Chris Gomersall/2020VISION Get in touchPlease fill out the form below to be contacted by your local Wildlife Trust about opportunities on your patch. First Name Surname Email address Postcode I am 18 and over You may have to be over 18 for certain hands-on volunteering activities that are deemed dangerous without supervision. Local Wildlife Trust - None -Avon Wildlife TrustAlderney Wildlife TrustThe Berks, Bucks and Oxon Wildlife TrustBeds, Cambs and Northants Wildlife Trust Birmingham & Black Country Wildlife TrustCheshire Wildlife Trust Cornwall Wildlife TrustCumbria Wildlife TrustDerbyshire Wildlife TrustDevon Wildlife TrustDorset Wildlife TrustDurham Wildlife TrustEssex Wildlife TrustGlou