["https://wildlifetrusts.org/adopt-animal/adopt-bird"]
title = "Adopt a bird | The Wildlife Trusts"
description = "Searching for an original gift for a nature lover? Adopt a bird with the Wildlife Trusts to help fund conservation efforts. Perfect for adults and children! You can sponsor a sandwich tern, puffin, peregrine falcon, little ringed plover, song thrush, swift box or rent a nest."
full_description = "©Danny Green/2020VISION Adopt a bird Puffins © Lynne Newton Wildlife Trust of South and West Wales - Puffin What you'll receive for £25: A welcome letter, adoption certificate, fact sheet on your adopted animal and a soft toy. Adopt a puffin with the Wildlife Trust of South and West Wales. Puffin with sand eels ©Richard Steel/2020VISION Scottish Wildlife Trust - Puffin What you'll receive for £30: A personalised adoption certificate, a beautiful wooden keyring featuring a puffin, an exclusive papercraft model of a puffin, an Atlantic puffin fact file, a Go Wild activity book, a puffin bookmark, 2 stunning puffin postcards, Details on how to sign up to receive exclusive email updates about puffins. Adopt a puffin with Scottish Wildlife Trust. ©Derek Moore Hertfordshire & Middlesex Wildlife Trust - Little ringed plover What you'll receive for £15: A welcome letter, certificate and beautiful colour photograph, two factsheets about the little ringed plover and its habitat, wildlife postcard, Go Wild events guide giving information on our local events. Adopt a little ringed plover with Hertfordshire & Middlesex Wildlife Trust. Song thrush ©Amy Lewis Hertfordshire & Middlesex Wildlife Trust - Song thrush What you'll receive for £15: A welcome letter, certificate and beautiful colour photograph, two factsheets about the song thrush and its habitat, wildlife postcard, Go Wild events guide giving information on our local events. Adopt a song thrush with Hertfordshire & Middlesex Wildlife Trust. © Peter Cairns/Northshots Alderney Wildlife Trust - Gannet What you'll receive (from £16): An adoption card and a fun facts greeting card as a thank you Adopt a gannet with Alderney Wildlife Trust. Neil Aldridge Alderney Wildlife Trust - Puffin What you'll receive for £25: An adoption certificate and fun facts card, a cut-out Burhou puffin for your desk, puffin pin badge and cuddly toy puffin. Adopt a puffin with Alderney Wildlife Trust. Roger Pannell Worcestershire Wildlife Trust - Skylark What you'll receive for £15: A factsheet about skylarks, an adoption certificate, a welcome letter from us, a Create Your Own Nature Reserve Game for our younger adoptees, a thank you message with a note to the recipient from you, a hi-res image of a skylark in Worcestershire to use as a screensaver Adopt a skylark with Worcestershire Wildlife Trust. WildNet - Mike Snelle Kent Wildlife Trust - Chough What you'll receive for £32: A chough factfile, an exclusive chough lithograph print, an adoption certificate and a corvid ID guide. Adopt a chough with Kent Wildlife Trust. Little tern chicks at South Walney NR ©Cumbria Wildlife Trust Cumbria Wildlife Trust - Little tern What you'll receive for £20: A certificate and fact file via email for you to either print off or forward on by email to someone else if you're sponsoring a little tern as a gift. Sponsor a little tern with Cumbria Wildlife Trust. North Wales Wildlife Trust North Wales Wildlife Trust - Pied flycatcher What you’ll receive for £15: A personalised sponsorship certificate, greetings card, bilingual factsheet about pied flycatchers, bamboo pin badge, and a seedpaper bookmark. Sponsor a pied flycatcher with North Wales Wildlife Trust. Surrey Wildlife Trust Surrey Wildlife Trust - Dartford warbler What you'll receive for £15: A digital pack consisting of a beautifully illustrated certificate and accompanying fact sheet with fascinating information on the dartford warbler. Adopt a dartford warbler with Surrey Wildlife Trust. Peter Cairns/2020VISION Montgomeryshire Wildlife Trust - Osprey What you'll receive for £20: A welcome letter and an A4 print of an artwork that has been specially produced and generously donated to MWT for this scheme by local artist, Diane Rose. Adopt an osprey with Montgomeryshire Wildlife Trust. Peter Cairns/2020 Vision Cumbria Wildlife Trust - Osprey What you'll receive for £20: A certificate and fact file via email for you to either print off or forward on by email to someone else if you're sponsoring an osprey as a gift. Adopt an osprey with Cumbria Wildlife Trust. Surrey Wildlife Trust Surrey Wildlife Trust - Skylark What you'll receive for £15: A digital pack consisting of a beautifully illustrated certificate and accompanying fact sheet with fascinating information on the skylark. Adopt a skylark with Surrey Wildlife Trust. Warwickshire Wildlife Trust - Peregrine falcon What you'll receive for £20: A digital pack consisting of a downloadable adoption certificate, information on a year in the life of a peregrine, phone and desktop wallpapers, a delicious recipe to bake, fun facts about peregrine falcons, and ways to help wildlife at home Adopt a peregrine falcon with Warwickshire Wildlife Trust. Surrey Wildlife Trust Surrey Wildlife Trust - Nightjar What you'll receive for £15: A digital pack consisting of a beautifully illustrated certificate and accompanying fact sheet with fascinating information on the nightjar. Adopt a nightjar with Surrey Wildlife Trust. Chris Gomersall/2020VISION Love wildlife?Become a member"
