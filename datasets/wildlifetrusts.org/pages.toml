ting facts and lots of lovely pictures and an adoption certificate Adopt a hedgehog from £3 a month with Derbyshire Wildlife Trust. ©Tom Marshall Shropshire Wildlife Trust What you'll receive for £20: A gift certificate, a photograph and an illustrated factsheet, packed with interesting information. Sponsor a hedgehog with Shropshire Wildlife Trust. Durham Wildlife Trust What you'll receive for £25: A personalised welcome letter, a two-page fact file, a certificate and a cuddly toy. Adopt a hedgehog with Durham Wildlife Trust. Ulster Wildlife What you'll get for £25: A species fact cards, Ulster Wildlife car/window sticker, and a beautiful enamel pin badge. Adopt a hedgehog with Ulster Wildlife. Tom Marshall Worcestershire Wildlife Trust What you'll receive for £15: A factsheet about hedgehogs, an adoption certificate, a welcome letter from us, a Create Your Own Nature Reserve Game for our younger adoptees, a thank you message with a note to the recipient from you, a hi-res image of a hedgehog in Worcestershire to use as a screensaver. Adopt a hedgehog with Worcestershire Wildlife Trust. © Jon Hawkins Surrey Hills Photography Surrey Wildlife Trust What you'll receive for £25: An adoption certificate, cuddly toy, factsheet, photo, sticker. Adopt a hedgehog with Surrey Wildlife Trust. WildNet - Gillian Day The Wildlife Trust for Bedfordshire, Cambridgeshire & Northamptonshire What you'll receive for £15: A sponsorship certificate, a hedgehog factsheet with tips on how you can help hedgehogs. Sponsor a hedgehog with The Wildlife Trust for Bedfordshire, Cambridgeshire & Northamptonshire. © Tom Marshall Herefordshire Wildlife Trust What you'll receive for £30 (postal): A certificate, a soft toy, a guide packed with facts about your animal, a bookmark, and a packet of wildflower seeds. Plus three e-newsletters a year about your chosen species and what we're doing to help them. Price includes P&P What you'll receive for £15 (digital): Two photographs, a certificate, a guide packed with facts about your animal, and an Adventures in Nature activity booklet. PLUS three e-newsletters a year, with information about your chosen species and what we're doing to help them. All this delivered by email to download or print. Adopt a hedgehog with Herefordshire Wildlife Trust. Dorset Wildlife Trust What you'll receive for £15 (digital): Includes a hedgehog factfile, adoption certificate, photo, wildlife-friendly gardening in small spaces leaflet and a guide to making a hedgehog house. Adopt a hedgehog with Dorset Wildlife Trust. !function(f,b,e,v,n,t,s) {if(f.fbq)return;n=f.fbq=function(){n.callMethod? n.callMethod.apply(n,arguments):n.queue.push(arguments)}; if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0'; n.queue=[];t=b.createElement(e);t.async=!0; t.src=v;s=b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t,s)}(window, document,'script', 'https://connect.facebook.net/en_US/fbevents.js'); fbq('init', '780410719034291'); fbq('track', 'PageView'); <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=780410719034291&amp;ev=PageView&amp;noscript=1"> Warwickshire Wildlife Trust What you'll receive for £20 (digital): Includes a downloadable adoption certificate, a year in the life of a hedgehog, phone and desktop wallpapers, a delicious recipe to bake, fun facts about hedgehogs, and ways to help hedgehogs at home Adopt a hedgehog with Warwickshire Wildlife Trust. Chris Gomersall/2020VISION Love wildlife?Become a member'''
