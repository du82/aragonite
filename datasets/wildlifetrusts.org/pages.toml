["https://wildlifetrusts.org/identify-birds-prey"]
title = "Identify birds of prey | The Wildlife Trusts"
description = "The UK is home to a variety of birds of prey - predatory birds equipped with sharp talons and hooked bills. This page will help you identify common birds of prey as well as some rarer species."
full_description = "Katy Frost How to identify birds of prey What bird of prey have you spotted? ‘Birds of prey’ are large, predatory bird species that have hooked bills, sharp talons, strong feet, and keen eyesight and hearing. They tend to feed on small mammals, birds, insects and reptiles. The UK’s birds of prey come in a huge variety of shapes and sizes: Hawks and eagles: medium to very large; hooked bills; rounded or broad wings; sharp talons; tend to soar Falcons: small to medium-sized; tapered wings and tails; fast and agile; often hover Owls: small to large; rounded heads; small, hooked bills; forward-facing eyes; mainly nocturnal Sparrowhawk Where: Variety of habitats, including gardens, across the UK. Description: Small. Males have blue-grey backs and white underparts with orange barring. Females are brown above, with grey barring underneath. Read more Sparrowhawk by Andrew Parkinson/2020VISION ©Mark Hamblin/2020VISION Katy Frost Buzzard Where: Grassland, farmland and woodland across the UK. Description: Medium. Brown plumage, broad wings and a short tail. Read more ©Chris Lawrence ©Bob Coyle Katy Frost Red kite Where: Woodland and farmland mainly in Wales and South East England. Description: Large. Reddish-brown plumage, black-tipped wings with white patches underneath, and a forked tail. Read more Red kite by Jon Hawkins, Surrey Hills Photography Red kite © Luke Massey/2020VISION ©David Tipling/2020VISION Red kite illustrated by Katy Frost Kestrel Where: Grassland, heathland and sometimes towns across the UK. Description: Small. Grey head, grey tail with dark banding, gingery-brown back, and a creamy, speckled underside. Read more Kestrel by Steve Waterhouse Kestrel by Katy Frost Peregrine falcon Where: Coastal cliffs and some towns in North and South West England, Wales and Scotland. Where to see peregrine falcons Description: Medium. Slate-grey above and white below, with black bars underneath, a white throat and cheeks, and a black moustache and mask. Read more Neil Aldridge © Bertie Gregory/2020VISION © Bertie Gregory/2020VISION Hobby Where: Southern and eastern heathlands and wetlands in summer. Description: Small. Slate-grey plumage, with black streaks on its belly, red 'trousers', a white throat, and a dark moustache and mask. Read more © Andy Morffew © Terry Whittaker/2020VISION Merlin Where: Moorlands and coastal marshes in England, Wales and Scotland. Description: Small. Males are blue-grey above and cream with black streaks underneath. Females are grey-brown with dark streaking. Read more ©Wildstock Female Merlin on perch by Rob Jordan/2020VISION Hen harrier Where: Breeds on upland moors (rare in England); winters on coasts, heathland and farmland across the UK. Where to see hen harriers Description: Medium. Females are brown above and streaked below, with a white rump and banded tail. Males are blue-grey with black wingtips. Read more Hen harrier (female) ©Mark Hamblin/2020VISION © Mark Hamblin/2020VISION Mark Hamblin/2020VISION Tawny owl Where: Woodland, parks and gardens across the UK. Description: Medium. Mottled brown plumage, a rounded head, large, dark eyes, and a dark ring around its face. Read more Tawny owl ©Margaret Holland Tawny owl by Thinesh Thirugnanasampanthar Marsh harrier Where: Reedbeds in East Anglia, Somerset and the South East Description: Large. Males are brown above and ginger underneath, with grey, black-tipped wings. Females are chocolate-brown with a golden-yellow crown and throat. Read more Andrew Parkinson/2020VISION ©David Tipling/2020VISION (C) Paul Sawyer Golden eagle Where: Upland areas and glens in Scotland. Description: Very large. Mainly dark brown, with a golden head and neck. Read more ©Wildstock ©Jon Hawkins Barn owl Where: Grassland and farmland across the UK. Where to see barn owls Description: Small. Mottled silver-grey and buff back, white underside, heart-shaped, white face, and black eyes. Read more © Jon Hawkins - Surrey Hills Photography ©Jon Hawkins Surrey Hills Photography Barn owl at Vine House Farm ©Nicholas Watts Osprey Where: Wetlands in Scotland, Northumberland, Cumbria, Wales and the East Midlands in summer Where to see ospreys Description: Large. Dark above and white below, with angled wings that show dark patches. Read more Andy Rouse/2020VISION ©Peter Cairns/2020 ©Peter Cairns/2020VISION Short-eared owl Where: Moorlands, saltmarshes and rough grassland. Description: Medium. Mottled yellowy-brown above and pale below, with dark circles around its yellow eyes and short ‘ear tufts’. Read more Short-eared owl © Ben Hall/2020VISION Short-eared owl © Danny Green/2020VISION Short-eared owl © Ben Hall/2020VISION Other rare species that breed in the UK include goshawk, white-tailed eagle and long-eared owl. Find out more about identifying all our birds of prey on our species explorer. Are birds of prey under threat? During the 20th century, many of our birds of prey were persecuted to near extinction such as the white-tailed eagle, or severely suffered from the effects of organochlorine pesticides like DDT - such as the merlin. Today, massive conservation efforts offer them a lifeline. Not only are The Wildlife Trusts involved in reintroduction and habitat restoration programmes we are also working towards a living landscape – a network of habitats that link urban green spaces and nature reserves with the wider countryside, enabling wildlife to thrive and move about freely. How you can helpAs a charity we rely on memberships. They help us look after over 2,300 nature reserves and protect the animals that call them home. Join for as little as £3 a month Bertie Gregory/2020VISION Sign up to our e-news!Get monthly newsletters packed with ways that you can help wildlife! Sign up"
year_published = 2025
