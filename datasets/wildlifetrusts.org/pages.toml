["https://wildlifetrusts.org/how-we-are-run"]
title = "How we are run | The Wildlife Trusts"
description = "The Wildlife Trusts is a movement made up of 46 Wildlife Trusts: independent charities who all share a mission. Each Wildlife Trust is a member of a central charity – the Royal Society of Wildlife Trusts, more widely known as The Wildlife Trusts (TWT). Meet our board of trustees and read our charitable objectives and Annual Impact Reports. Find out more about our Patron, President, Vice Presidents, Chair and Chief Executive."
full_description = '''Andy Rouse/2020VISION Get to know us a little better How we are run There are 46 individual Wildlife Trusts, each of which is a place-based independent charity with its own legal identity, formed by groups of people getting together and working with others to make a positive difference to wildlife and future generations, starting where they live and work. Every Wildlife Trust is part of The Wildlife Trusts federation and a corporate member of the Royal Society of Wildlife Trusts, a registered charity in its own right founded in 1912 and one of the founding members of IUCN – the International Union for the Conservation of Nature. Taken together this federation of 46 local Wildlife Trusts and the Royal Society of Wildlife Trusts are known as The Wildlife Trusts. Each Wildlife Trust is an independent, registered charity but all share a vision of people close to nature, with land and seas rich in wildlife. Because of this, each Wildlife Trust has slightly different membership fees when you join - but they're all around £4 a month! The role of RSWT – the central charity - is to ensure a strong collective voice for wildlife, to help coordinate work between individual Wildlife Trusts, and to lead the development of the movement and federation as a whole. We celebrate the sovereignty of individual Wildlife Trusts and empower each other to make decisions within each Wildlife Trust’s jurisdiction, respecting Trusts’ independence and right to establish their own policies and approaches in line with The Wildlife Trusts’ Strategy. Helena Dolby for Sheffield WT Patron, President and Vice PresidentsPatron His Majesty King Charles III President Liz Bonnin Liz Bonnin (C) Andrew Crowley Broadcaster and biologist, Liz Bonnin was elected as president of The Wildlife Trusts in 2020. The first woman to take the role, Liz joins the movement of 46 Wildlife Trusts at a critical time for nature’s recovery in the UK. Liz champions The Wildlife Trusts’ new 30 by 30 vision to protect 30% of land and sea for nature by 2030 with projects ranging from land acquisition to peatland restoration and species reintroduction. Liz is known for her powerful and ground-breaking documentaries including the sensational Drowning in Plastic, Galapagos, Wild Alaska and Blue Planet Live. Liz’s career has taken her around the world, studying animal behaviours and shining a spotlight on important environmental issues. Liz says: “I am incredibly honoured to be President of The Wildlife Trusts, following in the footsteps of highly esteemed past presidents who I have looked up to throughout my career. It is a critical time for the natural world, and I hope that through lending my voice and support, and by working together, we can help to enforce the changes that must take place in order to secure a brighter future for our wild places. I have been extremely fortunate to work on projects that have explored our planet's wildlife wonders and the many conservation challenges they face – from Nepal and the Galapagos, to the Arctic Circle. Now I want to apply what I have learned to help nature closer to home. The Wildlife Trusts inspire local action to create a national impact, all with a global perspective - I am delighted to be a part of that, and passionate about finding novel ways to make a difference, where it matters most.” President Emeritus David Attenborough Sir David Attenborough has been involved with The Wildlife Trusts since the 1960s. In 1985 he took on the role as Chair of the British Wildlife Appeal, our first national appeal. With support from HRH The Prince of Wales the appeal raised over £16 million for wildlife. In 1991 Sir David took on the role of President of the Wildlife Trusts. Stepping down in 1995, before becoming the first President Emeritus in 2012 and played a major role in helping us to mark our centenary that year. Most recently, Sir David narrated the Wilder Future Wind in the Willows film, and our Nature Recovery Networks film. Sir David has supported so many Trusts as well as the movement more generally. In 2019 he supported Nottinghamshire Wildlife Trusts appeal for the Attenborough Nature Reserve and his opening of both London Wildlife Trust’s Woodberry Wetlands and Essex Wildlife Trust’s Thurrock Thameside Nature Park made global media headlines. He was also vocal in Yorkshire Wildlife Trust’s campaign against a housing development adjacent to their first nature reserve, Askham Bog, which in May 2020 was rejected by the Secretary of State. On August 22, 2024, Sir David Attenborough was awarded the Rothschild medal by The Wildlife Trusts in recognition of his 60 years of support for the federation of charities. The medal was presented to him by Charlotte Lane, the granddaughter of Charles Rothschild and daughter of Miriam Rothschild, who were pioneering conservationists. Simon King Simon was President of The Wildlife Trusts from 2010-2015 and joined Sir David Attenborough as our second President Emeritus in 2015. He is President of Avon Wildlife Trust and Patron of Somerset Wildlife Trust. Simon’s first film, The Willow was broadcast in the BBC Series The World About Us in 1984. This was the beginning of an incredible career producing some of the best known and well-loved nature documentaries for the BBC natural history unit, including many narrated and starring Sir David Attenborough such as Blue Planet, Life of Mammals and Planet Earth. In 2005 Simon joined the Springwatch team and joined Autumnwatch in 2006. Tony Juniper Credit Eleanor Church Tony has been involved with The Wildlife Trusts for over 35 years, starting his career in wildlife education in the mid-1980s with the Berkshire, Buckinghamshire and Oxfordshire Wildlife Trust, through to his recent position as a Trustee for The Wildlife Trust for Bedfordshire, Cambridgeshire and Northamptonshire. He was the first recipient of The Wildlife Trusts’ prestigious Rothschild Medal, which recognises outstanding achievements in the promotion, study, management or conservation of the natural environment. He was President of The Wildlife Trusts from 2015 – 2019, before taking up the position as Chair of Natural England. Vice Presidents Chris Baines Chris has been a Vice President of The Wildlife Trusts since 1996. Chris has been involved with the wider movement since the 60s being a founding member of the Urban Wildlife Group in Birmingham, which went on to become The Wildlife Trust for Birmingham and the Black Country of which Chris is a Vice President. Chris is a horticulturalist, broadcaster, landscape architect and author. He was an early advocate of wildlife gardening and has published books on the subject; he is also an environmental advisor and advised on the sustainability at the 2012 Olympic Park in East London. Nick Baker Naturalist and Presenter Nick Baker will be known to many for his time on the BBC The Really Wild Show but has presented an extraordinary number of shows including Autumnwatch Unsprung, Springwatch Unsprung, Big Week at the Zoo and Weird Creatures with Nick Baker. He has also authored a number of books including ReWild – The Art of Returning to Nature and Nick Baker’s Bug Book. Nick has been Vice President of The Wildlife Trusts since 2005. Gillian Burke Biologist, Gillian Burke, is known to many as co-host on BBC’s Spring, Autumn and Winterwatch. Her engaging style, passion for science and love of the natural world have made her a firm favourite on the show. Dr Amir Khan Dr Amir Khan's enthusiasm captivates you through the screen, and it's no wonder that he's become a firm favourite with the public following his appearance on Channel 5's GPs Behind Closed Doors. He's gone on to cement himself as daytime TV's go-to GP as a regular on Lorraine and Good Morning Britain. His passion for the natural world is infectious. He has been an advocate for green prescribing for a number of years, knowing the benefit the natural world has for people, particularly their mental health and well-being. Dr Amir Khan says: "The natural world has something for everyone. And it has an incredible effect on us all. We've seen from studies that exposure to green spaces, from vast, undeveloped landscapes to urban parks and street greenery, lowers the body's stress hormone cortisol. We know that children and young people who have access are more creative and imaginative. It has been a pleasure working with The Wildlife Trusts, and I'm so proud to be able to give something back by becoming a Vice President. They have been pioneers in championing nature for health and well-being, from nature-friendly schools to the annual nature challenge 30 Days Wild. There really is something for everyone with The Wildlife Trusts!" David Macdonald David founded the Wildlife Conservation Research Unit at the University of Oxford in 1986, with a research focus on solving problems in wildlife conservation and environment management to better inform policy. David has been a Vice President for The Wildlife Trusts since 1999. Bill Oddie Bill is a writer, comedian, television presenter and actor most notably known for being one of The Goodies. Bill has had an incredible career as a TV presenter, fronting a number of wildlife programmes for the BBC, including Springwatch and Autumnwatch, How to Watch Wildlife, Wild in Your Garden, Birding with Bill Oddie, Britain Goes Wild with Bill Oddie and Bill Oddie Goes Wild. Bill has been a Vice President of The Wildlife Trusts since 2000. Julian Pettifer Julian is a journalist and presenter, and has worked across the BBC and ITV. His career started as an announcer on Southern Television in 1958, before going on to present Tonight, 24 Hour and Panorama for the BBC. His interest in the natural world led him to go on to write and present a number of environment and wildlife-focused programmes including Naturewatch, Nature and The Living Isles. He became a Vice President in 1992 and is currently our longest serving VP. Iolo Williams Iolo and the natural world go hand in hand, you can't have one without the other. His documentaries, in Welsh and English, have been the introduction for many to the magnificent wildlife of Wales. Iolo is one of BBC's Springwatch, Autumnwatch and Winterwatch presenters. He has been supportive of The Wildlife Trusts for a long time now and we were excited to have him take up the position of Vice President. Iolo's sage advice over the years has seen him become a vital partner for the movement. Iolo Wiliams says: "I'm very pleased, delighted, in fact, to say that I am a Vice President for The Wildlife Trusts. I've worked with The Wildlife Trusts in Wales for over 40 years. In that time, with this brilliant organisation, I have met and worked with members of staff who are knowledgeable, enthusiastic and always ready to help. If I can play just a small role in championing the work that they do, I'll be a happy man." Robert Worcester Sir Robert Worcester is the Founder of MORI, Market & Opinion Research International, and in October 2005, he became chairman of the Ipsos Public Affairs Research Advisory Board and an International Director of the Ipsos Group. He was subsequently appointed by Her Majesty the Queen a Knight Commander of the Most Excellent Order of the British Empire (KBE) in recognition of the outstanding services rendered to political, social and economic research. He has authored, co-authored, co‑edited or edited more than a dozen books and many articles in newspapers, magazines and in peer-reviewed professional journals. Just as importantly, for us anyway, he has been our loyal and esteemed Vice President since 1995, making him our second longest serving Vice President. Our governance The Wildlife Trusts’ Council is the leadership group for collective strategy in the movement. It has direct governance responsibility for the central charity. The Wildlife Trusts' Council has a Chair, Honorary Treasurer and Honorary Secretary, eight leaders from within the movement and two other independent Trustees. There are currently thirteen trustees. You can meet them below. Trustees are elected at a General Meeting in accordance with our Royal Charter and Bye Laws. As a registered charity, our activities are regulated by the Charity Commission for England and Wales. Meet the team Our Council Duncan Ingram, Chair Duncan is a keen walker and trekker and is passionate about the natural world and nature playing a key role in combatting climate change. He brings extensive UK and international experience of federal governance and considerable non executive experience across a wide range of commercial and charitable sectors. Duncan was a marketing director, managing director and group director at BT responsible for a number of key business units and the success of significant international partnerships and major programmes. David Jordan OBE, Honorary Secretary A lifelong environmentalist, David was appointed Chair of Hampshire & Isle of Wight Wildlife Trust in 2016. Following a career in the National Rivers Authority and the Environment Agency, David retired from the role of Executive Director of Operations in 2015. He has a degree in Environmental Biology and a Masters in Freshwater Ecology. During his career, David had full accountability for all of the Environment Agency’s operations across England and Wales including pollution control, incident response, flood risk management and conservation. David worked with Interpol on international environmental crime, focusing on the illegal trade in rhino horn, having previously advised Interpol over a number of years on wildlife, fisheries and forestry crime and intelligence-led enforcement. David is also the Chair of Sand Dams Worldwide, a charity which delivers water and soil conservation and sustainable agriculture in Africa. David tries to practice what he preaches. Owning land in Devon and in France, David has developed a wildlife lake, a wildflower meadow (with all of its difficulties!) and a thriving orchid meadow in France with land where barn owls and nightingales currently breed. Pete Batchelor, Honorary Treasurer A Loughborough graduate in Business, Economics and Finance as well as a qualified chartered accountant with the Institute of Chartered Accountants of Scotland, Pete worked for 11 years at Big 4 Accountancy firm Ernst & Young and BT in senior restructuring and advisory roles. Pete joined Yorkshire Wildlife Trust in 2013 as Director of Finance and Central Services, where he worked for seven and a half years, playing a key role in the Wildlife Trust’s growth and successes during this period. Peter has since performed a number of Chief Financial Officer, interim CEO and Commercial Leadership roles across a range of industries. Pete has served as a member of The Wildlife Trust Audit and Resources Committee for 4 years now and has a strong understanding of the financial position of TWT and financial and operational matters affecting all Trusts across the movement. As well as accounting, Pete’s s'''
