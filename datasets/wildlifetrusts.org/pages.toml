["https://wildlifetrusts.org/how-we-are-funded"]
title = "How we are funded | The Wildlife Trusts"
description = "Each Wildlife Trust in our movement is an independent charity. Find information on how The Wildlife Trusts are funded, sources of income and how we spend our money."
full_description = '''Andrew Parkinson/2020VISION How we are funded How we raise funds for our work Each Wildlife Trust in our movement is an independent charity. People bring their funds together through their Wildlife Trust to save wildlife and wild places and bring people closer to nature. Our members and donors provide the majority of the funds we spend. We are grateful to every one of you for supporting your Wildlife Trust. Thank you. To help us make an even bigger impact, we also receive funding from grants and from corporate partners. Grants are usually awarded for specific projects. Some of our main sources of support include the players of the National Lottery through the National Lottery Heritage Fund and the National Lottery Community Fund; players of People’s Postcode Lottery; and the Landfill Tax Community Fund. Some Local Authorities and Government Agencies and Departments also support some Trusts, usually for specific projects. We are also working with We Have The Power and National Highways to improve habitats across England benefitting people, nature and wildlife. People's Postcode Lottery The funding from players of People’s Postcode Lottery supports a wide range of Wildlife Trust projects, including educational programmes… The National Lottery Community Fund The National Lottery Community Fund is one of 12 distribution bodies for the National Lottery and is one of the largest funder of… The National Lottery Heritage Fund The National Lottery Heritage Fund support has helped to reconnect thousands of people with nature and protect an amazing range of rare… Esmée Fairbairn Foundation Established in 1961, Esmée Fairbairn Foundation is one of the largest independent grant funders in the UK. Each year the Foundation… European Climate Foundation The European Climate Foundation is an independent Foundation committed to creating a net-zero greenhouse gas emissions society and… John Ellerman Foundation John Ellerman Foundation are an independent grant-making foundation supporting charities that make a difference to people, society and… King Charles III Charitable Fund King Charles III Charitable Fund (KCCF) was founded by His Majesty King Charles III in 1979 with a mission to transform lives and build… Ecological Restoration Fund Ecological Restoration Fund supports work that protects biodiverse hot-spots, rejuvenates degraded landscapes and promotes local… Worwin UK Foundation With support from Worwin UK Foundation, The Wildlife Trusts are restoring the UK’s peatlands and raising public and political awareness… Where we spend our money 98% of our funds are spent by individual Wildlife Trusts in their area with the remainder invested in collective activity at an all Wales, England or UK level. By supporting your Wildlife Trust you really are helping to support the wildlife and wild places in your area. On this page you will find information about the collective finances of The Wildlife Trusts. Collective income and expenditure The charts below show the collective income and expenditure for all Wildlife Trusts and the central charity. The central charity, RSWT, operates a Grants Unit. This distributes around £7m a year from grant givers such as Biffa to other charities outside The Wildlife Trusts to deliver work that falls within our charitable remit – hence the discrepancy of the figures below. Thank youEvery single one of The Wildlife Trust’s supporters are at the heart of what we do. You make our work possible – from protecting threatened wildlife like bats, dormice and bees to saving some of the UK's last wild places and inspiring the next generation of children to love nature. Every donation we receive makes a difference. Thank you. "Because its a local charity you can see where the money goes, and appreciate the hard work that goes into it." AmyWildlife Trust member Heather in bloom by Guy Edwardes/2020VISION Our fundraising promiseRead now Andy Rouse 2020VISION Our publicationsFind out more'''
