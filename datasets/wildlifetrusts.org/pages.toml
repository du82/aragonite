full_description = "©Danny Green/2020VISION Adopt an otter © Wildstock Cheshire Wildlife Trust What you'll receive for £25: A welcome letter, certificate, postcard to share with a friend, a cuddly otter toy or book, plus a booklet all about otters and what you're making possible through your amazing support, all presented in a gift box! Adopt an otter with Cheshire Wildlife Trust. Derbyshire Wildlife Trust Derbyshire Wildlife Trust What you'll receive: A welcome letter, certificate, and a cuddly otter toy. Adopt an otter from £3 a month with Derbyshire Wildlife Trust. Devon Wildlife Trust Devon Wildlife Trust What you'll receive for £25: A soft toy, fascinating factsheet, personalised adoption certificate, welcome letter (which can be personalised) - all presented in a gift box and sent direct to you or the gift receiver. Adopt an otter with Devon Wildlife Trust. Durham Wildlife Trust What you'll receive for £25: A personalised welcome letter, a beautiful otter cuddly toy, a two-page fact sheet about the species and a personalised certificate. Adopt an otter with Durham Wildlife Trust. © Chris Gomersall Scottish Wildlife Trust What you'll receive for £30: A personalised adoption certificate, a beautiful wooden keyring featuring an otter, an exclusive papercraft model of an otter, a Eurasian otter fact file, a Go Wild activity book, an otter bookmark, two stunning otter postcards, details on how to sign up to receive exclusive email updates about otters. Adopt an otter with Scottish Wildlife Trust. Matthew Lissimore Worcestershire Wildlife Trust What you'll receive for £15: A factsheet about otters, an adoption certificate, a welcome letter from us, a Create Your Own Nature Reserve Game for our younger adoptees, a thank you message with a note to the recipient from you, a hi-res image of an otter in Worcestershire to use as a screensaver Adopt an otter with Worcestershire Wildlife Trust. Andy Rouse/2020VISION Norfolk Wildlife Trust What you'll receive for £25: A personalised certificate, beautifully illustrated fact sheet, Norfolk Wildlife Trust branded gift item and information about the work of Norfolk Wildlife Trust and visiting the nature reserves. Adopt an otter with Norfolk Wildlife Trust. Luke Massey Herefordshire Wildlife Trust What you'll receive for £30 (postal): A certificate, a soft toy, a guide packed with facts about your animal, a bookmark, and a packet of wildflower seeds. Plus three e-newsletters a year about your chosen species and what we're doing to help them. Price includes P&P What you'll receive for £15 (digital): Two photographs, a certificate, a guide packed with facts about your animal, and an Adventures in Nature activity booklet. PLUS three e-newsletters a year, with information about your chosen species and what we're doing to help them. All this delivered by email to download or print. Adopt an otter with Herefordshire Wildlife Trust. Surrey Wildlife Trust Surrey Wildlife Trust What you'll receive for £15: A digital pack consisting of a beautifully illustrated certificate and accompanying fact sheet with fascinating information on the otter. Adopt an otter with Surrey Wildlife Trust. Chris Gomersall/2020VISION Love wildlife?Become a member"
