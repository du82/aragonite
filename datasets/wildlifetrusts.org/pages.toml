title = "Campaign with us | The Wildlife Trusts"
description = "We campaign for positive change for nature and people. Get involved to help habitats and wildlife, to see stronger legislation, better wildlife conservation practices or to preserve a wild place. Our latest national campaigns are on this page - ask your Wildlife Trust about local campaigns you can support too."
full_description = "Restore Nature Now rally - Guy Shorrock Stand up for nature with us Campaign with usTo see at least 30% of our land and seas recovering by 2030, there needs to be more people influencing each other to take sustained, collective action for nature and climate. We campaign for a wilder future, where everyone can benefit from and enjoy wildlife near them. We have a long history of campaigning for positive change for nature and people, working with communities of all kinds to save special places for wildlife and to help nature recover. Through our Team Wilder way of working we also listen to and connect and collaborate with individuals, communities, and stakeholders and we build mutual, trusted relationships so that everyone can make meaningful changes for nature’s recovery. Current campaigns Say No to Neonics A win for wildlife: in January 2025, the UK Government said NO to the industry's request to allow banned chemicals to be used on… MP Satisfaction Survey The MP Satisfaction Action: are our MPs fighting for nature? The Wildlife Trusts' satisfaction action allows constituents (that… Action Send a 'letter to the Editor' Sending letters 'to the Editor' of local newspapers is another great way to speak up for wildlife. Precious Peatlands Peatlands are one of our most important habitats, providing homes for rare wildlife and locking up carbon, helping us tackle climate… Action for Insects campaign The UK's insect populations are in trouble: 41% face extinction. To save them, we all need to act quickly. The Wildlife Trusts are… Defend Nature Alongside warm words and consistent encouragement, Government action is crucial to bring nature back to everyone's lives. false - Eleanor Church Past campaignsExplore our previous campaigns Do you have a question about one of our campaigns? Find answers to commonly asked questions. Sign up to our mailing list below! You'll be the first to find out about how you can help create a Wilder Future with us. First name Surname Email address CAPTCHA This question is for testing whether or not you are a human visitor and to prevent automated spam submissions. We promise to protect your data in accordance with the Wildlife Trust Privacy Policy. Leave this field blank Help us to restore 30% of land and sea for nature by 2030Together we can save wildlife I am making a donation of £ News Flagship UK-wide nature project shows people-power dramatically helps communities and wildlife £5 million Nextdoor Nature programme worked with over 1,600 communities to take action for nature Blog 100 days of Labour – Time to act for nature Ahead of the 2024 General Election, The Wildlife Trusts laid out five critical priorities for an incoming government. These five asks… Blog Reform UK's manifesto: a ‘contract’ with the people of the UK Today, Reform UK has launched its manifesto – it is presented as a ‘contract’ with the people of the UK."
