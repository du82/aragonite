description = "Contact The Wildlife Trust, Postal Address The Wildlife Trusts, The Kiln, Mather Road, Newark United Kingdom NG24 1WT General enquiries, Phone: 01636 677711, Email: enquiry@wildlifetrusts.org"
full_description = "Red-tailed bumblebee ©Jon Hawkins - Surrey Hills Photography Contact your local Wildlife Trust Enter Postcode, Town or Place Frequently asked questions Membership Each of the 46 Wildlife Trusts is an independent, autonomous charity and as such they are responsible for and manage their own memberships, vacancies and volunteer opportunities. Your local Wildlife Trust would be your best point of contact to help with any membership queries and the contact details for all 46 Wildlife Trusts can be found by following the below link and entering your postcode or town: Find a Wildlife Trust (https://www.wildlifetrusts.org/find-wildlife-trust) Donations Make a donation (https://www.wildlifetrusts.org/donate) Teemill clothing/The Wildlife Trusts online store If you have any queries about orders on The Wildlife Trusts online store, please contact Teemill, who manage the store. Their customer service team can be contacted on 01983 409790 or via email hello@teemill.com. Baby birds Parents will not abandon baby birds because they have been touched by humans. In most cases, a baby bird should be left alone; wildlife rescue organisations take in thousands of baby birds yearly, which while being well-intentioned rescue efforts are often more damaging than helpful. The page below will help advise you on whether you should try to help a baby bird, what to do, and who to contact if you come across one. The Wildlife Trusts do not offer a general service for care and rehabilitation of wildlife, although some individual Trusts may offer local services. What to do if you find a baby bird (https://www.wildlifetrusts.org/wildlife-advice/baby-birds) Have you found a hornet? The UK is home to one native hornet, the European hornet. Please see the page below for how to tell these apart from invasive Asian hornets (sightings of which should be reported). Have you found a hornet? What to do if you find an injured animal Contact a local animal rescue Info on what to do if you find an injured animal Have you witnessed wildlife crime? Wildlife crime can take many forms and it can be difficult to know what constitutes a crime. Please see the following page for more information and resources: Wildlife Crime Planning applications How to respond to a planning application Forward planning Contact your Wildlife Trust about a local planning application Identify an animal Identify poo Identify butterflies Identify snakes Identify birds of prey Make a complaint Complaints Policy The Wildlife Trusts want to exceed your expectation in everything we do. However, we know that there may be times when we do not meet our own high standards. When this happens, we want to hear about it, in order to deal with the situation as quickly as possible and put measures in place to stop it happening again. Read our complaints policy or make a complaint Business enquiries We are proud to partner with selected national businesses that closely align with our values and mission in helping to tackle the climate and nature crises with people inspired and empowered to take action for nature’s recovery. Find out how your business might support or work with us, here. If your business is interested in promoting wildlife and wild places nearby in its nearby communities, then please consider supporting your local Wildlife Trust in the first instance. Media enquiries Are you writing a story or want to find out more about anything here? Contact our media team at press@wildlifetrusts.org. The Wildlife Trusts can provide stories, quotes and features about our stunning wild places, fabulous events and nature conservation work across the UK. You can also keep up to date with all our latest press releases. For regional enquiries please contact your local Wildlife Trust. Campaigning Having problems with one of our campaign actions? Occasionally, supporters tell us about problems with filling in online campaign forms. We find that if you autofill your contact details using cookies on your device, it can add extra spaces or digits to your email address or postcode. Please try entering your details again manually. If the problem remains, please send a screenshot of the error message you receive to campaigning@wildlifetrusts.org Are you sharing a reply from your MP? We always appreciate feedback, and it really helps us to know how your representatives react to our campaigns. You can send these to campaigning@wildlifetrusts.org You can find more information about contacting our MP on our webpage and our campaigns homepage gives you more information about each of our campaigns to help you write your email. Are you getting in touch about an issue or local campaign in your area? Our movement is made up of 46 independent Wildlife Trusts, each working hard to care for and protect wildlife and wild spaces. Your local Wildlife Trust is best placed to support you with any questions around local campaigns. Find your local Wildlife Trust here. Jobs Find a job Each individual Wildlife Trust handles their own recruitment so if you have any questions about a specific role please contact the Wildlife Trust advertising the role. Volunteering Each Wildlife Trust has a large number of both regular and casual volunteers. Find your local Trust and start your volunteering adventure today! Find opportunities near you Fundraising Find out all about fundraising here, or download our guide to start fundraising for wildlife! Major donor gifts If you wish to discuss making a significant gift to make a strategic impact for climate and nature please contact our Major Gifts Fundraiser, Debbie Johnson. Fox hunting and field sports We do not allow field sports on our nature reserves except in rare instances where other people control the shooting or fishing rights. Neither do we allow hunting with dogs on our nature reserves. Campaigning against field sports on animal welfare grounds would not be within our charitable remit. We do, however, raise concerns and sometimes oppose aspects of field sports in the wider countryside where they have a damaging impact on the conservation of populations of animals, wild plants, or fragile habitats. As a conservation charity our ideal is for such habitats not just to be preserved but to be managed expressly for wildlife. We work pragmatically to achieve as much wildlife conservation benefit as we can in each different situation. Get in touch General enquiries We love to hear from you and to see your photos and videos of local wildlife but unfortunately, we have very limited capacity to answer all enquiries. We are unable to help with enquires related to injured wildlife, unwanted wildlife in your garden, wildlife crime or enquires linked to planning applications. For these areas, and other FAQs, please see the guidance at the top of this page. Membership enquiries If you have a membership enquiry, please get in touch with your local Wildlife Trust. Find out more about membership Business enquiries We are proud to partner with selected national businesses on strategic initiatives that closely align with our values and mission in helping to reverse the climate and nature crises across the UK. Find out how your business might support or work with us, here. If your business is interested in promoting wildlife and wild places in its nearby communities, then please consider supporting your local Wildlife Trust in the first instance. Online shop enquiries Orders from our online shop are processed and shipped through Teemill. If you have enquiries about a recent order, please contact hello@teemill.com for further assistance. Postal Address The Wildlife Trusts, The Kiln, Mather Road, Newark United Kingdom NG24 1WT Phone: 01636 677711 We are open Monday-Friday 9am-5pm You can download a location map Registered Charity Number: 207238 Email address Name Subject - Select -General enquiryMembershipJobsRetailWild Work DaysVisiting a nature reserveReporting a species sighting Gifts in memory Including a gift in my WillSchools and education Philanthropic loans Message I am a member of a Wildlife Trust Yes No I am happy for my details to be passed onto a local Wildlife Trust should they be better placed to answer my enquiry Yes No Postcode We will use your postcode to work out which local Wildlife Trust to put you in touch with. We promise to protect your data in accordance with the Wildlife Trust Privacy Policy. CAPTCHA This question is for testing whether or not you are a human visitor and to prevent automated spam submissions. Leave this field blank"
