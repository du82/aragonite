full_description = '''Mark Hamblin/2020VISION Join your Wildlife Trust today Enter Postcode, Town or Place image/svg+xml Receive a fantastic membership pack (https://www.wildlifetrusts.org/get-involved/join#packs) image/svg+xml Help protect wildlife on your doorstep () image/svg+xml Be the first to hear about brilliant events () image/svg+xml Discover the wonderful wild places near you () Wildlife Trust membership benefitsBy becoming a member of your Wildlife Trust you will be helping to look after the wildlife and wild places in your area. There are 46 Wildlife Trusts covering the whole of the UK. Each is an independent charity working to make a positive difference to the natural world. Every Wildlife Trust has different membership fees, most around £3 a month. Enter your postcode above to find out the details for your closest. Receive a welcome pack full of goodies - the contents will vary depending on the Wildlife Trust you join Regular magazines brimming with local wildlife news and features Access to stunning nature reserves Talks, walks and events to get closer to wildlife Opportunities to campaign for wildlife Goodies!Each Wildlife Trust offers a slightly different membership pack. Here are some examples of what you can get your hands on... Surrey Wildlife Trust membership pack Gwent Wildlife Trust family membership pack BCN membership pack The Wildlife Trust for Birmingham and the Black Country membership pack Suffolk Wildlife Trust membership pack Derbyshire Wildlife Trust membership pack Montgomeryshire Wildlife Trust membership pack Devon Wildlife Trust membership pack Scottish Wildlife Trust membership pack Herefordshire Wildlife Trust membership pack North Wales Wildlife Trust membership pack Yorkshire Wildlife Trust magazine Wildlife Trust members make it possible To care for more than 90,000 hectares of land for wildlife, from ancient woodlands to precious wetlands To stand up for wildlife and campaign for its protection To run marine conservation pro