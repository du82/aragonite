full_description = "an annoying failure mode of copying nurseries13 January 2025 9:59 AMgcevacuationwhippetnurseriesblock-structured heapsguileigaliagenerational collectiongarbage collectionI just found a funny failure mode in the Whippet garbage collector and thought readers might be amused.Say you have a semi-space nursery and a semi-space old generation. Both are block-structured. You are allocating live data, say, a long linked list. Allocation fills the nursery, which triggers a minor GC, which decides to keep everything in the nursery another round, because that’s policy: Whippet gives new objects another cycle in which to potentially become unreachable.This causes a funny situation!Consider that the first minor GC doesn’t actually free anything. But, like, nothing: it’s impossible to allocate anything in the nursery after collection, so you run another minor GC, which promotes everything, and you’re back to the initial situation, wash rinse repeat. Copying generational GC is strictly a pessimization in this case, with the additional insult that it doesn’t preserve object allocation order.Consider also that because copying collectors with block-structured heaps are unreliable, any one of your minor GCs might require more blocks after GC than before. Unlike in the case of a major GC in which this essentially indicates out-of-memory, either because of a mutator bug or because the user didn’t give the program enough heap, for minor GC this is just what we expect when allocating a long linked list.Therefore we either need to allow a minor GC to allocate fresh blocks – very annoying, and we have to give them back at some point to prevent the nursery from growing over time – or we need to maintain some kind of margin, corresponding to the maximum amount of fragmentation. Or, or, we allow evacuation to fail in a minor GC, in which case we fall back to promotion.Anyway, I am annoyed and amused and I thought others might share in one or the other of these feelings. Good day and happy hacking!related articleswhippet update: faster evacuation, eager sweeping of empty blocksephemerons vs generations in whippetwhippet: towards a new local maximumparallel ephemeron tracingpreliminary notes on a nofl field-logging barrierwhippet progress update: feature-complete!Comments are closed."
