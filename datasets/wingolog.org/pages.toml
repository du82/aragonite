full_description = "fedi is for losers24 September 2024 10:11 PMfediversemastodontwitterDoes the fediverse have a vibe? I think that yes, there’s a flave, and with reason: we have things in common. We all left Twitter, or refused to join in the first place. Many of us are technologists or tech-adjacent, but generally not startuppy. There is a pervasive do-it-yourself ethos. This last point often expresses itself as a reaction: if you don’t like it, then do it yourself, a different way. Make your own Mastoverse agent. Defederate. Switch instances. Fedi is the “patches welcome” of community: just fork it!Fedi is freedom, in the sense of “feel free to send a patch”, which is also hacker-speak for “go fuck yourself”. We split; that’s our thing! Which, you know, no-platform the nazis and terfs, of course. It can be good and even necessary to cut ties with the bad. And yet, this is not a strategy for winning. What’s worse, it risks creating a feedback loop with losing, which is the topic of this screed.alembicsFedi distills losers: AI, covid, class war, climate, free software, on all of these issues, the sort of people that fedi attracts are those that lost. But, good news everyone: in fedi you don’t have to engage with the world, only with fellow losers! I know. I include myself in these sets. But beyond the fact that I don’t want to be a loser, it is imperative that we win: we can’t just give up on climate or class war. Thing is, we don’t have a plan to win, and the vibe I get from fedi is much more disengaged than strategic.Twitter—and I admit, I loved Twitter, of yore—Twitter is now for the winners: the billionaires, the celebrities, the politicians. These attract the shills, the would-be’s. But winner is just another word for future has-been; nobody will gain power in the world via Twitter any more. Twitter continues to be a formidable force, but it wanes by the day.Still, when I check my feed, there are some people I follow doing interesting work on Twitter: consider Tobi Haslett, Erin Pineda, Bree Newsome, Cédric Herrou, Louis Allday, Gabriel Winant, Hamilton Nolan, James Butler, Serge Slama: why there and not fedi? Sure, there is inertia: the network was woven on Twitter, not the mastoverse. But I am not sure that fedi is right for them, either. I don’t know that fedi is the kind of loser that is ready to get back in the ring and fight to win.theories of powerWhat is fedi’s plan to win? If our model is so good, what are we doing to make it a dominant mode of social discourse, of using it as a vector to effect the changes we want to see in the world?From where I sit, I don’t see that we have a strategy. Fedi is fine and all, but it doesn’t scare anyone. That’s not good enough. Twitter was always flawed but it was a great tool for activism and continues to be useful in some ways. Bluesky has some of that old-Twitter vibe, and perhaps it will supplant the original, in time; inshallah.In the meantime, in fedi, I would like to suggest that with regards to the network itself, that we stop patting ourselves on the back. What we have is good but not good enough. We should aim to make the world a better place and neither complacency nor splitting are going to get us there. If fedi is to thrive, we need to get out of our own heads and make our community a place to be afraid of.12 responsesSeeM says:25 September 2024 4:51 AMJust get back on IRC and get on with life. bumblefudge says:25 September 2024 5:58 AMwell free to send a patch is also free as in beer and free from payments providers handling the donations because we’re pleading ignorance of too many compliance obligations and free from having a real plan for fighting back when the kiwi farming coordinated chuds decide to play capture-the-flag. bsky has fedi beat in a lot of ways because they tabletopped and modeled out and borrowed against an economic model which fedi is, thus far, way too free from having anything resembling. in fact, i worry that if someone came up with even the concept of a plan for a fedi economy they would be rejected like jesus at nazareth.btw i think the regexp checking email addresses isn’t hip to the newer tlds.Fnordinger says:25 September 2024 8:02 AMI disagree with the sentiment of Mastodon being full of losers, because I don’t think that walking away from a toxic place like Twitter is equal to losing. I also think that a lot of people don’t even want to get everybody on the Fediverse, the reason being fear of importing other networks’ toxicity. There is an alternative view to the loser-theory, that I often observe on Fedi. According to this view, joining Fediverse was not a loss, but a gain. The switching costs then are not just a price one has to pay to join, but also a filter that sieves out everybody who’s mostly interested in clout instead of all the social interactions. Mastodon is large enough for the latter (although it does require more effort to find people you like to listen to, if there are no algorithmic recommendations), but it’s pretty much guaranteed that you won’t get clout on Fedi.If your goal is to build a large social network, then it’s true, that Fedi is losing, but if you just want to build closer friendlier social network Fedi is winning big time. Hans says:25 September 2024 8:50 AMBy now, it should be common sense that the Internet is not going to be a force for good. It is a force for humankind, and as much as it has advanced us, the progressive left, it has advanced the reactionary right.The same is true for the Fediverse: If anything, it is an accumulation space for what you call, in all self-pity, losers. You’re highlighting the problem of the progressive: “Ah, we’re such losers, just look at us”. And the reactionaries are just tooting the self horn, laughing at us.If anything, the Fediverse is the place where progressives meet. We don’t need to call ourselves losers, that is for our opponents to do. Help us to become more. We need to prove them wrong.poor americans says:26 September 2024 2:31 AMFriend, never forget that trying to “win”, or “dominate”, or become big enough as to “scare anyone”, makes you the loser a priori.(So does caring about celebrities, politicians, or billionaires. Those are all instituted to trick a primate brain into comparing itself with the person on the picture, so that it can feel like shit, so that it can bleed out out some money.)To be everything for everyone is the prerogative of those that cater to the lowest common denominator. Big social tried to fill that niche, riding on the lingering remainders of a formerly legitimate techno-optimism. What did it achieve? Make some losers feel like they’re winning? Nice illusion, who paid for it?All it did was demonstrate that the lowest common denominator is really, really low. Then, having made people exhausted and complacent, it lowered the bar even further. For example when it leaked eternal september back into meatspace. Or when it behaviorally profiled the entire fucking world. When it stood and watched, while genocides were coordinated online.That fediverse exists, right here and now, in spite of its lack of “strategy”, or “economic model”, or whatever other business words you consider necessary for sustained existence, that it exists with all its problems but without being an institution of abuse by design, is a greater accomplishment than corporate social media — that deeply and inexcusably totalitarian enterprise — could ever hope for.Have the bells and whistles that were put in place in order to distract you from the power grab of the millenium become something that you now find worthy of striving for? Please take your influencers and clicktivism and bite-sized thoughts somewhere far away from the social arena, then come back. The water’s fine.The Fediverse revolution and its consequences have been a disaster for serious political contestation says:26 September 2024 6:54 AMThe main function of fediverse is to create an epistemic isolate (an “echo chamber”) where one of the core ideological weak spots of tech nerdism cannot be alluded to, let alone challenged. Namely, that infopolitics is inherently politics on neoliberalism’s terms, and that it is therefore doomed to failure if the notional goal is to redistribute power horizontally on the whole. Code will not bring down whatever odious ism it is that you are against. Most of you are objectively working at some flavor of IniTech from which you are trying to achieve escape velocity. The more vehement that left-wing political activism affectations, the more painfully obvious it is that you are failing.I write this as an anthropology major who runs his own Linux servers with all the usual self-hosted stuff, which is to say as someone in tech but not of it. You have to add this kind of stuff because left-wing tech nerds are in some ways remarkably like right-wing gun nuts. If they sense that you don’t share the milieu’s taken-for-granted assumptions and taboos, they sense an infiltrator and will challenge your right to hold an opinion by demonstrating that you don’t “speak Gun”. I.e. you lack some sort of usually arbitrary bit of trivia knowledge.the revolution has been cancelled for violating the coc says:26 September 2024 10:23 AMHappy to see a humanities specialist hosting their own infra. More power to you! (I do however agree with the preconception that those that don’t can’t be trusted, since they are beholden to those entities that do host infra. Of course, this continues as turtles all the way down. I will once again have faith in grassroots communitarian undertakings when they at least demonstrate willingness to build underground sustainable semiconductor fabs. Pending that, retrocomputing enthusiasts are on to something - there’s little room for backdoors on a 6502)Your garden variety egalitarian maximalist has a major blind spot about how power tends to agglomerate. By definition, it does that on its own terms. The futile drive to redistribute it horizontally once and for all is also a neoliberal spook. It just temporarily resets that process within a given isolate. The trick here is to keep creating more sources of power - that way the overall balance at least continues to approach “almost enough for everyone” infinitely. This is possible because power can spread fractally, besides horizontally and vertically; for example, a good baseline for freedom is having conscious control over every molecule of one’s own body. I don’t know anyone who can do that, though. Maybe next kalpa.In present terms, if the established order is maintained by guns, code, and the notions and concepts that form a feedback loop between those artifacts and the humans who wield them, I don’t see how getting some of one’s own would harm one’s cause. And when you have a machinic instrument of power, the locus of control is at the interface between user and machine. (That is to say, we need to radicalize designers.) The fediverse has already succeeded in creating an alternative space that on the surface matches some of the interface language that users have learned from centralized power distributor systems (microblogging), but is internally organized on a different, decentralized basis. This is great - new tools, same skills, new goals. For me, this makes a huge difference: rotting in silence because I cannot bring myself to communicate over a hegemony platform, vs. being able to speak out and reach out towards possibly like-minded people.The Fediverse revolution and its consequences have been a disaster for serious political contestation says says:26 September 2024 12:31 PMSpeaking out and reaching out towards possibly like-minded people is really a low bar though. Also, doesn’t that make scribbling on bathroom stall doors the original fediverse? What has it’s influence on literary culture been?I also seem to recall two earlier fediverse causes that were heavily boosted, around the time of the Snowden leaks, by the same people who are now trying to boost Mastodon etc. into a societally relevant reality: Friendica and Diaspora. How are those doing? Don’t answer, it’s only a rhetorical question. But I’d be surprised if what still goes on there is about more than the process of building Friendica and Diaspora itself, along with some people pushing all manner of socio-political marginalisms.To put it more bluntly, I think anyone who really enjoys the sort of exchange that goes on on decentralized tech is lying to themselves. Not lying to themselves that they subjectively find them to be enjoyable, but lying to themselves that this is the kind of exchange that a normal person ought to find fulfilling. Life has to be more than an endless series of XKCD “Aren’t we STEM majors smart for getting this joke?” comics, retro computing trivia, retro gaming nostalgia and virtue signalling for obscure left-wing politics that aren’t going to go anywhere (else they’d be on the mainstream media and platforms)... Not all of these things are wrong per se, but its an extremely limited spectrum of social exchange that the fediverse can accomodate.You see something analogous in FOSS every few months. Every time some new locked-down gadget comes out, the next day there will be an article on Ars Technica about how someone has succeeded in running Doom on it. This periodic ritual has the value of a religious ruling that something is kosher for FOSS people and tech nerds more broadly, which I assume we all are. The substance of the ruling is that this new thing and the evolution it represents (i.e. a further expansion of the scope of locked-down tech) can ultimately be subverted for general computing. Which is true on a theoretical level, but ignores the fact that resources are far too limited too make such a subversion practically meaningful.The point is therefore that decentralized tech and FOSS, as causes to which those engaged in them attribute a (proto-)political valence, are just ways for tech-involved people to redefine problems and solutions so as to rationalize their continued involvement in tech as a societal phenomenon that is on the whole destructive. Often redefining problems and solutions towards technical aspects that subtly imply the irrelevance of non-technical aspects. When non-technical aspects are addressed, it is often with the societal-scientific naivete of people who have been socialized their whole adult lives to believe that their perspective is superior to that of the social sciences and the humanities. The takes aren’t inherently wrong are odious, the wrongness lies in the fact that people spout of about the non-technical aspects of tech as if as disciplinary expertise holds no special authority, if they even suspect the existence of such expertise. Which is consistent with the broader function of tech nerd culture as a continuous series of performances staged to devalue the humanities.fnord says:26 September 2024 5:10 PMOnline communication has to be a way to facilitate real world communication. For example, our little"
