full_description = "aboutmetaWelcome, reader! The blog is the main thing here. It has a user’s manual and comment policy. The nice thing about that the blog that, unlike this page, it is unlikely to go stale. Pages bear their dates and you can see that if you’re reading something from 2015 then maybe it’s not relevant.Still here? You want context, perhaps. One never knows what to write in these things, so let’s be brief.Name? Andy Wingo. Grew up in North Carolina. Currently in Annemasse, France, near the Swiss border, by way of Barcelona and northern Namibia. Three kids and, yes, a minivan, and a long-tail cargo bike.Jobs? Schoolteacher, waiter, moving van driver, lifeguard, and currently, compiler engineer. At Igalia since 2011.I used to know many things: aikido, fiddle, how to solve the neutron diffusion equation, oshindonga; all still there, somewhere.Email? Not very well: highly variable latency. Personal is wingo@pobox.com and work is wingo@igalia.com. Either one works, but work email has higher quality of service.related articlesnombrilliant, actuallyservice updatesir talks-a-lotcolophonwardssticking point99% spam"
