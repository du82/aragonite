["https://winworldpc.com/library/applications/tag-audio"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''Cakewalk is a MIDI music authoring and editing tool. The earlier versions are considered among the best MIDI tools that ever existed. Microsoft Windows. limited music notation and a built-in scripting language called CAL (Cakewalk Application Language). limited functionality OEM-bundled "Express" editions. Dr. Sbaitso is a simple AI program, similar to the famous "Eliza", that makes use of text-to-speech software. Distributed as a demonstration application with Creative Labs Sound Blaster cards. Encore, from Passport Designs, is a music program that originated on the Atari ST in 1984. It enables writing and editing music using traditional notation format. It can import and export to a number of sources and supports MIDI playback. enable items in the musical score to be added and edited using the mouse. Audio editor for Windows GoldWave is a digital audio editor for Windows 3.1. It has realtime oscilloscopes, intelligent editing, and numerous effects such as echo, flange, distortion, mechanize, and reverse. The intuitive user interface makes GoldWave easy to learn and use. First Released in 1986 by the University of Delaware, GUIDO (Graded Units for Interactive Dictation Operations) was self-paced Ear Training instructional software designed by and for use at the University of Delaware. It was originally programmed on a Burroughs 6700 and later ported to the PLATO system, before it was redesigned for use on the IBM-PC/XT/AT. MidiSoft Recording Session is a MIDI sequencer that uses a music notation based interface. It was sometimes bundled with sound cards. Monologue is a speech synthesis program that reads text from the screen. Versions exist for both DOS and Windows. QuickTime is Apple's Image, Video and Audio framework. QuickTime is freely redistributable, and is provided here only as a convenience. Some applications on Winworld may require that this software be installed first. MediaStudio is a suite of multimedia editing tools. It includes a video editor, video capture tool, image editor, sound editor, and morphing tool. Also supports video conversion, batch mode operation, and overlays.'''
