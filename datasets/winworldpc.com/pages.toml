full_description = "Acrobat Reader is the free software from Adobe used to read, view, and print documents created by the commercial Adobe Acrobat product. Its primary strength is that documents appear and print identically across differing systems. BackMaster is a backup program for IBM OS/2 that features support for a large number of tape drives. It offers an easy-to-use graphical user interface, and enables a variety of backup configurations including unattended backup. It supports full system restore by creating a set of disaster recovery boot disks. cc:Mail, originally from Concentric Systems, Inc and later Lotus and IBM, is a desktop e-Mail system intended for small LANs. It relies on accessing a shared database file rather than client-sever methods. Multiuser Link is a telecommunications program that Connects a PC running DOS or OS/2 to a Citrix Multiuser system via standard RS-232C serial directly or with a modem. ColorWorks is a powerful, full-featured, photo editing program designed exclusively for OS/2. It is a native 32-bit OS/2 application and makes use of OS/2 multitasking, multithreading, and SMP capabilities. It has many features and tools that make it comparable to most other image editors. CorelDRAW is a vector based drawing and illustration program. Tools like CorelDRAW enabled desktop publishers to create professional quality illustrations that printed and scaled without distortion. It is primarily a Windows application, but was ported to Mac OS, Mac OS X, Linux, CTOS and OS/2. The earliest versions ran on Windows 2. DataEase, from DataEase International Inc., USA., is a fast, easy to use yet powerful, menu-driven relational database development system for the IBM PC. Not copy protected. DeScribe is a word processor with some advanced features primarily for OS/2. Later, it was made available for Windows 3.1, 95, and NT. DevTech's Deskman/2 is a set of desktop and system management tools for OS/2. It contains data compression tools, networking tools, performance monitoring tools, and desktop management tools."
