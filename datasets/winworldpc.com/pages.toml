["https://winworldpc.com/library/applications/platform-cpm"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''CalcStar is a spreadsheet from MicroPro, somewhat like VisiCalc but using commands similar to WordStar. You can also format content similar to WordStar. It was available for CP/M and DOS, and often part of early 80s system's bundled software. DR Draw is a shape-based drawing program that uses Digital Research's GSX graphics library, making it portable across CP/M and DOS architectures with different video systems. DR Graph is a business graphics creation program. It can create line, bar, pie, and scatter graphs and print them on a graphics printer. DR Graph is implemented using Digital Research's GSX graphics library, and can run on many different platforms. GrafTalk is a business graphics package for CP/M systems. It can generate pie charts, line plots, symbol plots, composite plots, text, and color. It was considered "easy" to use, with menus, but also features a powerful command line interface. GraphPlan, from Chang Labs, is an integrated spreadsheet/business graphics package that turns numbers into presentation-quality graphics - instantly. Historically important as being among the early "integrated" spreadsheet/graphing packages, and it uses Digital Research's GSX, a core graphics system that evolved in to GEM. Graphstation, from Signature Information Systems, is a graphing application for making business presentations. IBM Asynchronous Communications Support contains a rudimentary telecommunications terminal emulation program written in IBM BASIC. It was provided alongside IBM PCs and the IBM asynchronous communications adapter (serial port card). InfoStar, by MicroPro, a business-application- development system designed specifically for nonprogrammers, provides easy-to-use on-screen menus that guide users through each step of data entry-form design and detailed report generation. within the report and allows users to incorporate data from multiple files. Other features include a form generator and a sorting facility. OPTune is a disk optimizer, file system repair tool, and disk tester. It also includes an tool that can change the low-level format sector interleave on MFM/RLL drives, similar to Spinrite.'''
year_published = 2025
clearnet = "https://winworldpc.com/library/applications/platform-cpm"
