["https://winworldpc.com/product/gem"]
title = "WinWorld: GEM 1.x"
description = "GEM is a graphical application environment that runs on top of MS/PC-DOS. It was built on the technology of Digital Research's GSX portable runtime (Used in DR Draw and DR Graph ) . Notably, a port of GEM and CP/M was used as the primary GUI on the M68k based Atari ST. GEM was also bundled with Amstrad computers."
full_description = "GEM is a graphical application environment that runs on top of MS/PC-DOS. It was built on the technology of Digital Research's GSX portable runtime (Used in DR Draw and DR Graph ) . Notably, a port of GEM and CP/M was used as the primary GUI on the M68k based Atari ST. GEM was also bundled with Amstrad computers. Apple sued Digital Research over their look and feel, which resulted in GEM 2.0 removing overlapping windows from its desktop file management. There were numerous applications written for the GEM Environment. A few available here on WinWorld are: Ventura Publisher, Artline, Publish-It, and Key Publisher, GEM Desktop Publisher, GEM Draw, GEM Graph, GEM Programmer's Toolkit, GEM WordChart, GEM Paint, GEM Write and GEM 1st Word Plus. The final official release was GEM 3.11. Enhanced versions were included with Artline, TimeWorks Publisher, and ViewMax but were only intended for use as runtimes. In 1999 the source code was released as open source, that led to the continued development of OpenGem and FreeGem. Wanted: GEM Desktop 1.0, and manual scans. (1.0 is reportedly somehow crippled to only run on genuine IBM hardware) Note: GEMPREP may ask you for a floppy disk that contains MOUSE.COM (your mouse distribution disk), FORMAT.COM and MODE.COM (Your MS-DOS distribution disk). It will ask for these even if they are already on your hard drive."
year_published = 2025
