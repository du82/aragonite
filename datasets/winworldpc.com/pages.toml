title = "WinWorld: Banyan VINES 5.x"
description = "First released in 1984, Banyan VINES (Virtual Integrated NEtwork Service) was a network operating system originally designed for Unix, initially based on Xerox XNS. It was considered fairly lightweight both on clients and servers and used minimal bandwidth.  It featured an early directory services system prior to either Novel or Microsoft."
full_description = "First released in 1984, Banyan VINES (Virtual Integrated NEtwork Service) was a network operating system originally designed for Unix, initially based on Xerox XNS. It was considered fairly lightweight both on clients and servers and used minimal bandwidth. It featured an early directory services system prior to either Novel or Microsoft. It competed against Novell NetWare, and Microsoft LAN Manager. Like NetWare, it's use dried up as Windows NT began to dominate the market. This site: http://banyan-vines.bamertal.com/pages/banyan-vines-download.html has much more information. Important: This software is copy protected. It used a hardware dongle copy protection system, and no unprotect is known to exist."
