["https://winworldpc.com/library/applications/tag-communications"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = 'Originally released in 1984 by the Canadian company Xanaro that went bankrupt, and then by Migent, Ability is an integrated office suite for DOS that includes word processor, spreadsheet, database, telecommunications, business graphing, presentation graphics capabilities, and built in file management. It features good integration between the different components, with the ability to import, share, and dynamically update data between them. It was advertised as a very easy to use and a quick to learn system. AdvanceLink is a terminal emulator that integrates with the HP NewWave desktop. It has built in scripting tools and features specifically for communicating with HP 3000, HP 9000, and HP 1000 hosts. It can emulate HP 2392A, HP 700/94, HP 700/92, HP ANSI, and DEC VT100 terminals. It appears a lesser version of this product was bundled with early Vectra computers under the generic name of "HP Terminal Program" AppleWorks is an all-in-one Word Processor, Spreadsheet, Database, Graphics Editor, and Presentations tool. The original product was a text-based product for the Apple II. The Apple Macintosh and Windows versions were forked from ClarisWorks in 1998 by Apple. At the time, Apple was under a lot of pressure to have a direct alternative to Microsoft Office. There were serious concerns that Microsoft might pull Microsoft Office for the Macintosh from development. BBS-PC! is an early computerized bulletin board system for IBM PCs. It also has versions for the Amiga. It featured customizability, message boards, and multiple file sections. Better Working Communicator, from Spinnaker Software, is an entry level telecommunications program sold alongside their "Better Working" series of applications, and included as part of "Better Working Eight-In-One". Better Working Communicator supports Macros, auto-dialing, split-screen, XModem file transfers, logging, and printing. Better Working Eight-in-One, from Spinnaker Software is an integrated office suite for DOS. It contains a word processor, a spelling checker, a data base, a spreadsheet, an outliner, a graphics program, a communications program and a set of desktop utilities - all in one single, consistent application.'
