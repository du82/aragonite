["https://winworldpc.com/product/hp-ux"]
title = "WinWorld: HP-UX 1.x"
description = 'HP-UX is a Unix variant based off of System III, later System V Unix. Released in 1984, the initial version of HP-UX supported the Motorola 68k processor family, specifically the HP 9807A, the "HP Integral PC". This OS is still updated, with its latest being version 11i. Platforms that HP-UX have ran on were the Motorola 68k, RISC, HP FOCUS, and the Itanium family of Intel processors.'
full_description = '''HP-UX is a Unix variant based off of System III, later System V Unix. Released in 1984, the initial version of HP-UX supported the Motorola 68k processor family, specifically the HP 9807A, the "HP Integral PC". This OS is still updated, with its latest being version 11i. Platforms that HP-UX have ran on were the Motorola 68k, RISC, HP FOCUS, and the Itanium family of Intel processors. HP-UX was the first UNIX to provide access control lists (acls), logical volumes, features that are currently supported by newer mainstream Operating Systems. HP-UX versions before 11.0 are not deemed as being Y2k-compliant by HP. The first release of HP-UX, released in 1982 was for the HP 9000 Series 500. This follow-up "1.0" was released in 1984 specifically for the HP Integral PC. This version was based on AT&T System III, and the kernel resides in the machine's ROM. The HP Integral PC is a portable UNIX workstation computer system produced by Hewlett-Packard based on the Motorola 68000 CPU. It includes a graphical shell called Personal Applications Manager. The Tutorial and Technical Basic disks appear damaged and are dumped twice. If anyone has a better dump, pleas let us know.'''
