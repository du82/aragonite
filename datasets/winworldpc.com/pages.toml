title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''1001 Windows Hints and Tips is a compilation of sample articles from Ziff-Davis Press books in Windows help format. 12 Month Screen Calendar v1.00 displays the next 12 months on one screen. Distributed as freeware by Command Line Software. Broderbund's 3D Home Architect is a home-design oriented CAD program. It includes a variety of home decor related objects, and can render the results in 3D. 3D Landscape is a computer aided design program specifically geared towards designing and planning landscapes. It includes the ability to view the design from 3 dimensional angles and includes extensive online documentation on landscape design. 3DNA is a 3D virtual environment shell that presents your computer as a series of 3D video-game like rooms. It features objects that you can set to launch applications, web site previews in the form of a "browser bay", and in-program advertising. It was bundled with some video cards. In many ways it is like a 3d-version of Microsoft Bob, and has a resemblance to Packard Bell Navigator. Time and Date, published by Abacus Software originally from Data Becker, is a small easy to use personal information manager for Windows 3.1. It can keep track of your calendar, address, notes, holidays and more. ABC Flowcharter, from Roykore/Micrografx is a flow chart diagramming utility for Windows. It features the ability to link multiple charts together, and easily break procedures in to multiple steps. Micrografx ABC SnapGraphics is a supplementary program for ABC FlowCharter. SnapGraphics provided a more simplistic, automated way to create flow charts and diagrams with a number of pre-defined templates. Version 1.0 was distributed free of charge. Originally released in 1984 by the Canadian company Xanaro that went bankrupt, and then by Migent, Ability is an integrated office suite for DOS that includes word processor, spreadsheet, database, telecommunications, business graphing, presentation graphics capabilities, and built in file management. It features good integration between the different components, with the ability to import, share, and dynamically update data between them. It was advertised as a very easy to use and a quick to learn system.'''
