title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''3D Landscape is a computer aided design program specifically geared towards designing and planning landscapes. It includes the ability to view the design from 3 dimensional angles and includes extensive online documentation on landscape design. Ashlar Vellum is a CAD package for mechanical engineers and designers, that includes the ability to intelligently predict where the user wants to connect the next object. There were both "2D" and "3D" versions. AutoCAD, from Autodesk and first released in 1982, is a powerful Computer Aided Design tool. It was, and still is, often considered the standard for CAD tools. Primarily for the IBM PC platform, it was ported to x86 machines with higher video resolutions such as the Zenith Z-100 and NEC APC. Intermittently, versions for the Macintosh appeared. Later versions use a dongle copy protection. AutoCAD LT is a 2-D only design program targeted at casual drafting users. It was positioned as a lower cost offering, with fewer features than AutoCAD. Initially, it was intended as a replacement for Generic CADD - another 2D drafting tool that AutoDesk bought out and then abandoned. Unlike AutoSketch, AutoCAD LT has more design related features. CADKEY is a 2D/3D mechanical CAD (computer aided design or computer aided drafting) software application released for various DOS, Solaris, and Microsoft Windows operating systems. Originally released for DOS in 1984, CADKEY was among the first CAD programs with 3D capabilities for personal computers. Instinct is a computer aided design drafting tool designed for Microsoft Windows 1.x. It was designed specifically with ease of use in mind, and was among the few early applications designed for Microsoft Windows 1. CircuitMaker, from MicroCode Engineering, is an easy-to-use schematic design and simulation tool. This product was discontinued in 2000 after being bought out by Altium, and is not related to the current software of a similar name. Claris CAD is a computer aided design program developed in 1988 by Claris Corporation in a joint effort with Craig S. Young of Computer Aided Systems for Engineering (CASE). It was based on MacDraw II and Young's earlier CAD application, EZ-Draft. Version 1 was released in 1989 for Macintosh computers running System Software 6 or later. The initial releases were plagued with bugs, especially with the bundled plotter driver.'''
