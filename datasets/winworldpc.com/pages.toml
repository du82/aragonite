["https://winworldpc.com/library/games"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "Alpine Tram Ride, from Learning Technologies Inc, is a children's educational game for the IBM PC. Given a tram ride full of animals, the player must guess which animal is in which car. Balance of power is a strategy game where one must lead a superpower nation to avoid war. It was ported to the Mac, Apple II, Windows, Atari ST, and Amiga. A fairly comprehensive version of Chess for Windows to play against another person or computer. Is able to analyze on potential moves in a game, provide tutoring, and change the appearance of the chess board. Chex Quest is a non-violent first person shooter that was distributed with certain boxes of Chex Cereal based on the DOOM engine. Death Rally is a top-down view racing game. The object of the game is to stop your opponents winning by shooting them. To progress through the game weapons and enhancements for the cars are needed. Based on the Scrabble word board game. Can play with up to 4 people, or a combination of computer players. Fun School 7 contains five activities designed to motivate and educate. Linked to the UK Government's national curriculum and supporting the national literacy and numeracy objectives, these activities cover the subjects of writing, sequencing and counting. Expert Puzzles and Mazes is a set of budget games for the IBM PC. It consists of three programs: Satori, a Maze Generator, and a picture puzzle. FunPack 3D is a collection of three games based off games that existed prior, remastered for (early) 3D graphics. It includes a breakout-like game, a Pac-Man clone, and a space fighter. The Hitchhiker's Guide to the Galaxy is a text based interactive fiction game where you play the part of Arthur Dent, who begins an exciting and confounding space journey right as the world ends. 3-K Trivia is an entertaining and educational party game that challenges you with 3,000 questions in several categories and also lets you add your own questions. Backgammon is a richly detailed, colorful game for beginning backgammon players. It also includes a two-player game for more experienced players. Entertainment Series."
