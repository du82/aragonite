["https://winworldpc.com/library/applications/tag-database"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "4th Dimension is a powerful and feature rich multi-user database for the Apple Macintosh. It features graphical creation of forms, reports, and graphs, a powerful programming language, and databases can be multi-user over AppleTalk networks. Originally released in 1984 by the Canadian company Xanaro that went bankrupt, and then by Migent, Ability is an integrated office suite for DOS that includes word processor, spreadsheet, database, telecommunications, business graphing, presentation graphics capabilities, and built in file management. It features good integration between the different components, with the ability to import, share, and dynamically update data between them. It was advertised as a very easy to use and a quick to learn system. AppleWorks is an all-in-one Word Processor, Spreadsheet, Database, Graphics Editor, and Presentations tool. The original product was a text-based product for the Apple II. The Apple Macintosh and Windows versions were forked from ClarisWorks in 1998 by Apple. At the time, Apple was under a lot of pressure to have a direct alternative to Microsoft Office. There were serious concerns that Microsoft might pull Microsoft Office for the Macintosh from development. Arborist(TM) Decision Tree software, from Texas Instruments/Integral Quality, is a general purpose tool for decision analysis. It features a graphic user interface for decision tree construction, decision tree evaluation, and decision tree analysis. Arborist Decision Tree software is not complicated to use, and it is not restricted to an area of decision problem analysis. Its ease of use makes it convenient and effective to analyze many problems that previously were not cost effective to analyze. ArcView, from Environmental Systems Research Institute, Inc. is a geographical information system program for Win9x/NT. Better Working Eight-in-One, from Spinnaker Software is an integrated office suite for DOS. It contains a word processor, a spelling checker, a data base, a spreadsheet, an outliner, a graphics program, a communications program and a set of desktop utilities - all in one single, consistent application."
