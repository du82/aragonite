["https://winworldpc.com/library/applications/tag-editor"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''AOL Press 2.0 is a Windows based what-you-see-is-what-you-get HTML editor from AOL. It competed with other HTML Cuisinarts such as Microsoft Front Page. Brief is a text editor primarily aimed at programmers and designed to edit source code. Originally written by UnderWare Inc., and briefly sold under Solutions System / SLR Systems, Brief was later sold under Borland. Features included multiple windows, regular expression searching, extremely large file support, and high customizability. FirsTime, from Spruce Technology Corporation, is a source code editor that is aware of a program's syntax and helps guide you as you create code. It highlights the current relevant sections of code, has customizable macros, and alerts you to certain kinds of errors. This is a rudimentary text editor sold by IBM for the IBM PC. It runs with only 64K of RAM and a single sided floppy drive under PC-DOS 1.x. This later evolved in to the IBM "E" Editor. Professional Editor is an early editor for the IBM PC. It makes extensive use of function keys, has user definable macros, and can work with files larger than available RAM. You WILL need to read the manual to use this! The Norton Editor is a text editor targeted at programmers and power users. It features the ability to edit files of any size, supports very long lines, automatic indentation, and compressed display. It supports executing DOS commands from inside the program, and is very configurable. SemWare's QEdit is a powerful, highly responsive, and scriptable text-mode editor. It was also distributed as shareware. It competed with programs like Borland Brief. ThinkTank is an outliner program or "Idea Processor" that arranges notes and ideas in a hierarchy that you can easily re-arrange. It was marketed as a tool for writing document outlines, brainstorming, notes, and todo lists. But it proved to be a very popular program, not just for writers, but for anyone who wanted to organize and move around ideas. VEDIT, from CompuView, is an extremely powerful, flexible, and customizable editor designed for power users and programmers. It can handle extremely huge files. It has a programmable command mode that can be used to automatically perform complex operations on files. It features a completely customizable keyboard layout and special features for editing programming language source files. supported a large number of terminal types.'''
