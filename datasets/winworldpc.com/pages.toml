["https://winworldpc.com/product/citrix-multiuser"]
title = "WinWorld: Citrix Multiuser 1.0"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "Citrix Multiuser is a customized version of Microsoft OS/2 1.21 that turns it in to a real multi-user operating system. With Citrix Multiuser, users can connect and simultaneously run character cell based applications from remote serial terminals. To prevent users from interfering with each other, it adds security permissions to devices and files. It can use multi-port serial port boards like the Digiboard, or any serial device that has OS/2 1.21 drivers. Citrix Multiuser OS/2 does not support running Presentation Manager based application or DOS executables, and programs can not use graphics modes. It also does not have support for networking. This product was released just days before the IBM-Microsoft separation, which was an almost instant fatal blow as Citrix was licensing OS/2 code through Microsoft. As a result, Citrix Systems had to backtrack and instead focused on making MS-DOS multi-user until eventually they released a Windows NT based version. To install on a faster computer, you must first apply the OS/2 speed patches described here to the boot disk: http://www.os2museum.com/wp/installing-os2-1-x-in-a-virtualbox-vm/ To summarize, replace all occurrences of: B8 F4 01 BB C8 00 F7 E3 F7 F1 with B8 F4 01 BB C8 00 F7 E3 90 90 It currently will not install in PCem (or some real hardware apparently) due to a known bug with OS/2's FDISK. Unlike normal OS/2, Citrix Multiuser's setup will not let you skip that. The CSD update disks must be installed from maintenance mode. To do that, use the Citrix Multiuser OS/2 boot disk, and after install starts from the second disk, hit escape."
year_published = 2025
