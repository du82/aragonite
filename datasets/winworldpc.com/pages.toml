["https://winworldpc.com/library/applications/tag-education"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''Type! is an interactive typing tutor. Its lessons are optimized around research on how people learn to type. It includes both basic and special skill levels, and monitors your progress with detailed graphs. Managing Your Business With the Lotus 1-2-3 Program is an on-disk training system that focuses on the practical application of analyzing your business's performance while using the Lotus 1-2-3 spreadsheet. It includes quizzes, exercises, and sample spreadsheet templates. Released by Cdex in 1983, this is an interactive training program that will teach you how to use VisiCalc. Cdex also sold training programs for WordStar, SuperCalc, EasyWriter ||, The IBM Personal Computer, and The Apple //e Personal Computer. There were versions for both the IBM PC an Apple II. Coping With Job Stress, from Disk-Count Software Inc, is an interactive on-disk lesson about dealing with workplace job stress. It was a cheap educational budget title. The sort of thing that would sell for $6.96 at Wal-Mart. run it at work, and the box doesn't include a 3.5" disk for your new IBM PS/2. Easy Working Typing Teacher is a low cost typist training program released as part of the Spinnaker "Easy Working" product family. Features an on-screen keyboard, built in help, drills, and statistics. Expert Perfect Typing, from Expert Software, is a low-end budget typing training program for DOS systems. It features the ability to track the progress of multiple users, has multiple skill levels for both new and experienced typists, and has both lessons and tests. Exploring the IBM PC Network is an animated guide that demonstrates the general use of IBM's PC Network software. Exploring The IBM Personal Computer is a tutorial program included with IBM Personal Computers designed to help new users learn how to use their computer. There were different versions for the IBM PC, PCjr, XT and AT computers. A nicish typing tutor that works as memory resident and annoys the hell out of you by sticking up a little man who knocks on your screen every now and again to remind you to type faster, or as a standalone app. similar to Mavis Beacon...'''
