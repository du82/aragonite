["https://winworldpc.com/product/geos"]
title = "WinWorld: GEOS/GeoWorks 1.x"
description = "GeoWorks is a graphical environment and application suite for DOS. GEOS for the IBM PC (PC/GEOS) was a huge advancement over the earlier-8 bit Apple II and Commodore 64 GEOS products. Although the PC versions runs on top of DOS, it is sometimes considered an Operating System. Notably, PC/GEOS was used as a graphical runtime for the America Online DOS client. The GeoWorks suites include the applications GeoWrite, GeoDraw, GeoManager, GeoPlanner, GeoDex, and GeoComm. GeoWorks later became NewDeal Office and then Breadbox Ensemble."
full_description = 'GeoWorks is a graphical environment and application suite for DOS. GEOS for the IBM PC (PC/GEOS) was a huge advancement over the earlier-8 bit Apple II and Commodore 64 GEOS products. Although the PC versions runs on top of DOS, it is sometimes considered an Operating System. Notably, PC/GEOS was used as a graphical runtime for the America Online DOS client. The GeoWorks suites include the applications GeoWrite, GeoDraw, GeoManager, GeoPlanner, GeoDex, and GeoComm. GeoWorks later became NewDeal Office and then Breadbox Ensemble. GeoWorks 1.2.x was released in several different flavors. GeoWorks Ensemble Lite (omits AOL and GeoDraw), GeoWorks Ensemble, and GeoWorks Pro (includes Quattro Pro tools) GeoWorks Ensemble and GeoWorks Ensemble Lite have the following issues. These should not be a problem for GeoWorks Pro (at least the versions posted here). There is a known bug with the installer. On faster computers, the very end of the GUI setup portion will crash with a "divide by zero" error. To work around this, edit the GEOS.INI file, find the line "continueSetup =", and change "true" to "false".'
