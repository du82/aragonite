full_description = '''1001 Windows Hints and Tips is a compilation of sample articles from Ziff-Davis Press books in Windows help format. 12 Month Screen Calendar v1.00 displays the next 12 months on one screen. Distributed as freeware by Command Line Software. 3D FloorPlan is a 3-dimensional architectural and space planning program for small business professionals and home users. The user may design a home addition or remodel in 2D and FloorPlan automatically converts the drawing into 3D. The user can then walk through the 3D model in real time. Broderbund's 3D Home Architect is a home-design oriented CAD program. It includes a variety of home decor related objects, and can render the results in 3D. 3D Landscape is a computer aided design program specifically geared towards designing and planning landscapes. It includes the ability to view the design from 3 dimensional angles and includes extensive online documentation on landscape design. 3D Studio, not to be confused with the later "3d Studio Max" product, is a DOS-based tool from Autodesk for creating 3d models and animations. 3DNA is a 3D virtual environment shell that presents your computer as a series of 3D video-game like rooms. It features objects that you can set to launch applications, web site previews in the form of a "browser bay", and in-program advertising. It was bundled with some video cards. In many ways it is like a 3d-version of Microsoft Bob, and has a resemblance to Packard Bell Navigator. First released in 1983 by IMSI (International Microcomputer Software, Inc), 4 Point Graphics was one of the earliest drawing and animation programs for the IBM PC. It competed against a drawing program called PC Crayon. 4th Dimension is a powerful and feature rich multi-user database for the Apple Macintosh. It features graphical creation of forms, reports, and graphs, a powerful programming language, and databases can be multi-user over AppleTalk networks. 4WORD is an add-in word processor for Lotus 1-2-3. Unlike TSR programs 4WORD works from within Lotus, using the same menus, using the Lotus printer drivers, and storing your documents inside your spreadsheet. It can copy and paste data between your document and spreadsheet as well link to live cells in to your document.'''
