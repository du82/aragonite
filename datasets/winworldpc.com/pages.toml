["https://winworldpc.com/library/applications/platform-other"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "99/4 Auto Spell Check, by Dragonslayer ASC, is a spell checker for the TI-99/4A home computer with disk system. Acrobat Reader is the free software from Adobe used to read, view, and print documents created by the commercial Adobe Acrobat product. Its primary strength is that documents appear and print identically across differing systems. AppleWorks is an all-in-one Word Processor, Spreadsheet, Database, Graphics Editor, and Presentations tool. The original product was a text-based product for the Apple II. The Apple Macintosh and Windows versions were forked from ClarisWorks in 1998 by Apple. At the time, Apple was under a lot of pressure to have a direct alternative to Microsoft Office. There were serious concerns that Microsoft might pull Microsoft Office for the Macintosh from development. Managing Your Business With the Lotus 1-2-3 Program is an on-disk training system that focuses on the practical application of analyzing your business's performance while using the Lotus 1-2-3 spreadsheet. It includes quizzes, exercises, and sample spreadsheet templates. Released by Cdex in 1983, this is an interactive training program that will teach you how to use VisiCalc. Cdex also sold training programs for WordStar, SuperCalc, EasyWriter ||, The IBM Personal Computer, and The Apple //e Personal Computer. There were versions for both the IBM PC an Apple II. FontWorks is a utility that prints documents using high quality fonts on a dot-matrix printer. It was commonly sold as a companion product to AppleWorks on the Apple II. It can print sideways, it includes a number of high quality fonts, and includes a font editor. FrameMaker, originally from Frame Technology Corporation and later Adobe, is a professional document system for creating large, complex documents with highly structured layout. It was often accompanied by FrameReader. IBM Typing Tutor is an educational program sold by IBM alongside their original IBM PC. The software itself was licensed from Microsoft, and is notable as being one of only two known commercial programs that were sold for the IBM PC on cassette tape. (The other being IBM PC Diagnostics )"
