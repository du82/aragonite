["https://winworldpc.com/about"]
title = "WinWorld: About"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "Hi there, welcome to WinWorld! I created WinWorld in 2003 to serve a singular purpose – to preserve and share old software, and the knowledge needed to use that software in the modern age of computing. My interest in computers began when I was young, using Macintosh LCs in the school computer lab. My first home computer was an outdated Packard Bell 486/66 with 8 MB RAM, running Windows 3.1, which introduced me to games like JezzBall, Chip’s Challenge and a shareware version of Redhook’s Revenge. From that time on, I was hooked on everything tech, but old tech in particular. It was nearly impossible to find reliable sites which offered a place to share and collect abandonware software, save for classic sites such as K-Semler’s File Page and OldOS back in the early 2000s. WinVision was the first to offer a substantial collection by using Yahoo! Briefcases, and provided me the inspiration to create WinWorld. I was just a pre-teen who wanted to create a website dedicated to preserving old software and making it easily accessible to anyone. At that time, I had no idea WinWorld would grow to what it is today. The hard work and generosity of so many people just like you are what has kept this website alive and growing. My hope is to keep WinWorld your best free and open library of abandonware and pre-release software for years to come. To sum up, thank you for flying WinWorld all these years. If you haven't already, I encourage you to join us on the forums or on Discord!"
year_published = 2025
clearnet = "https://winworldpc.com/about"
