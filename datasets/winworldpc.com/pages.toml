["https://winworldpc.com/library/applications/platform-macos"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''4th Dimension is a powerful and feature rich multi-user database for the Apple Macintosh. It features graphical creation of forms, reports, and graphs, a powerful programming language, and databases can be multi-user over AppleTalk networks. Adobe Acrobat, first released in 1993, is a tool for creating portable electronic documents. Its documents retain complex formatting when used across differing systems, so that they appear identical when viewed on screen or printed to a printer. Acrobat accomplishes this by encapsulating Adobe's PostSript printer language in to a document file format and offering the ability to embed fonts that are not present on the target system. Acrobat Reader is the free software from Adobe used to read, view, and print documents created by the commercial Adobe Acrobat product. Its primary strength is that documents appear and print identically across differing systems. Adobe Dimensions was a low cost 3-d object editing and rendering program. Unlike other 3d rendering programs, Dimensions is specifically geared towards producing illustrations for print. programs, such as Adobe Illustrator or Freehand, and edited to create 3d objects. Then, instead of outputting a pixilated raster image, it outputs in postscript bezier curves, which can then be further processed by other 2d illustration packages. Adobe Illustrator is a vector graphics editor developed and marketed by Adobe Systems. It was often sold as a companion product to the bit-map/photo editor Adobe Photoshop. Illustrator was originally released in 1987 for the Apple Macintosh. Early versions were ported to NexT, Silicon Graphics, and Sun Solaris. PageMill, from Adobe, is a What-You-See-Is-What-You-Get web page authoring tool. It was discontinued in February 2000, due to the acquisition and promotion of Adobe GoLive. Adobe Photoshop Elements is the successor to Photoshop LE, a somewhat reduced, home-oriented version of Adobe Photoshop. After Dark, from Berkeley Systems, Inc, is a set of entertaining screen savers for Mac and Windows. After Dark for Windows started off as "Magic Screen Saver" for Windows 2.x. After Dark was most famous for its "Flying Toasters" screen saver. Afterdark was very popular on both the early Macintosh computers and Windows 3.0, as neither included any kind of screen saver or screen blanker that would help prevent screen burn-in.'''
