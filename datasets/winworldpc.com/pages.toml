["https://winworldpc.com/product/mac-os-0-6"]
title = "WinWorld: System Software (0-6) Pre-Release"
description = 'In 1984 Apple Computer unveiled their Macintosh. It included a new user interface that revolutionized the way people though about computer interaction. Originally referred to as simply "Macintosh System", the underlying OS was a single-tasking disk system for the Motorola 68K CPU. Significant changes were made in MacOS 7.x.'
full_description = '''In 1984 Apple Computer unveiled their Macintosh. It included a new user interface that revolutionized the way people though about computer interaction. Originally referred to as simply "Macintosh System", the underlying OS was a single-tasking disk system for the Motorola 68K CPU. Significant changes were made in MacOS 7.x. The Macintosh originally came bundled with a Guided Tour of Macintosh, MacWrite, MacPaint, and a Tour of MacPaint and MacWrite. Note: Wikipedia's/Apple's Developer CD Classic Mac OS "System Software" numbering scheme is GARBAGE and should NOT be used. This version will not run on a normal Macintosh or emulator, and used Apple's 5.25" Twiggy floppy disk. A special Twiggy Macintosh emulator is included so you may try it for yourself. There are also two "Sony Test" pre-releases, that run from a 3.5" disk. One includes a late version of the original Finder prototype renamed as "Flounder".'''
