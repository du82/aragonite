["https://winworldpc.com/library/sys"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''Adlib Juke Box is a program bundled with Adlib sound cards that plays ".ROL" music files created with Visual Composer. Supports IBM CGA graphics. Adobe Type Manager was designed to provide scalable fonts on early Mac and Windows 3.0 systems that did not provide similar functionality natively. ATM is required by a number of graphics application originally designed to work in these environments. ATM is packaged as a "lite" installable runtime. Later releases offer a "Deluxe" version with extra font management abilities. Other OSes including NeXTSTEP, DESQview, and OS/2 come with ATM functionality built-in. More Windows, from Aristosoft, is a video driver that gives you a large scrollable virtual desktop on your existing VGA or EGA system. It offers several virtual desktop sizes including Portrait and Landscape - that may be preferable for different kinds of tasks. It also offers a "paper white" monochrome mode that uses less memory and features a "birds eye" view. The other video modes will consume extra Extended memory. Driver disk included with Artisoft AE-1/T, AE-2 And AE-3 Ethernet Adapters. Contains the Artisoft AI-LANBIOS driver. AST Advanced Diagnostics, from AST Research, is a systems diagnostic tool designed primarily for use on AST computers. The AST SuperPak is a set of drivers intended for use with AST's SixPackPlus and RAMpage memory cards. It includes clock, ram disk, disk caching, and print spooler software. This CD contains device drivers for all Micro Solutions Backpack hard drives, CD-ROM drives, and disk drives as of 2002. Backpack drives were mostly external parallel port connected, and very useful on systems that could not be expanded otherwise. Calmira is a free product that gives Windows 3.1 the appearance of later versions of Windows. This is free open source software. The primary web site is http://www.calmira.net/ This product is posted here as it may be of use to the WinWorldPC community. This is a bootable diagnostics disk intended for use with the Columbia Data Products VP portable computer. The VP is a "luggable" portable computer based on their MPC 1600 that competed with the Compaq Portable, Eagle Spirit, and similar PC clone luggables.'''
