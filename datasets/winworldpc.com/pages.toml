["https://winworldpc.com/irc"]
title = "WinWorld: Chat"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "Want to chat with the staff and fellow community members in a more personal way? Join in our IRC channel, #winboards or our Discord. We welcome chat in regards to WinWorld, technology or general banter. Whether you are in Discord or IRC, we ask that you use common sense in our channel. Adult content, spamming, trolling or generally being childish may result in you being kicked or banned. Thanks to Discord, it's now easier than ever to join in the conversation. All you need is a free Discord account; no installation or setup of an IRC client required. All chat taking place in the #winboards IRC channel is relayed to the #general channel on Discord and vice versa, so no matter how you connect you won't miss any of the conversation. For your privacy, the R-TypeNet network requires all IRC clients use modern encryption (TLS 1.2 with AES-256). Most modern clients support SSL/TLS. You may have to enable it when you add the network to your list. See your IRC client's guide for specific details."
