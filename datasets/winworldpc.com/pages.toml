["https://winworldpc.com/library/applications/tag-financial"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''BankMate, from Practical Software, is a simplistic and easy to use personal checkbook program. Supports check entry, deposits, cash withdrawals, and defining repeating checks or deposits, check printing, credit card purchases, cash purchases. BankMate was Practical Software's inexpensive entry level financial product, while MoneyMate was their mid-level business oriented financial application. Users were encouraged to upgrade to MoneyMate when they outgrew the limits of BankMate. This is the proprietary dial up program used with Bank of America's HomeBanking service ~1997. It is bundled with a customized copy of MECA's "Managing Your Money", a financial management program. BPI Inventory Control is one of a number of accounting and business management programs produced by BPI Systems, Inc. PBI software was among the more popular management programs during the early 1980s. There were versions for the Apple II, CP/M, and the IBM PC. IBM sold an OEM version along side their IBM PC products under IBM part number 6024030. Receivable, BPI Accounts Payable, BPI Payroll, and more. Software. In 1987 BPI Systems was bought by Computer Associates. Buying Your Home is a detailed financial calculation system for home buyers. It operates by creating various "scenarios", defining assumptions, and comparing scenarios such as renting vs. purchasing. CA-Compete! is a graphical, object-based, multi-dimensional modeling and data viewing tool that is as easy to use as a spreadsheet and as powerful as a decision support system (DSS) or executive information system (EIS). Compete! looks and works like a spreadsheet, but is object-based. In other words, you define the names that Compete! uses to identify and locate data in a model. A Compete! model can also contain many more dimensions than the spreadsheet norm of two or three. CashBIZ, from M-USA Business Systems, Inc, is a low-cost and low-feature accounting tool for small cash based businesses. It features modules for checks, billing, and receipts, and a number of pre-defined reports.'''
