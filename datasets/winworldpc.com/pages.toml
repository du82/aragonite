["https://winworldpc.com/library/dev"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = '''This is an implementation of the Forth 83 programming language for 8088/8086 computers running DOS. Forth contains many unique features and paradigms not found in modern languages. Actor, released by The Whitewater Group, Inc. and later Genesis Development Systems, is an object oriented programming language and environment similar to Smalltalk. It is a completely Windows-native environment, and was among the early applications written for Windows. Actor 2 ran under Microsoft Windows 2, and Actor 1.0 runs under Windows 1. This is a software development kit that assists developers in making add-ins for Lotus 1-2-3 4.x for DOS. Add-ins are binary programs that extend and enhance the functionality of the Lotus 1-2-3 spreadsheet without having to change the Lotus program itself. Alpha Four and Alpha Five, from Alpha Software, are a relational database management system and rapid application development platform. It is now known as "Alpha Anywhere". The Apple Lisa Workshop is a set of development tools and a command-line oriented operating environment that was used to develop all software for the Apple Lisa computer. It had variants for multiple languages including Pascal, Cobol, and Basic. Although it was mostly text-based, it did use a GUI code editor. The Workshop ran separately from the Lisa Office System, and developers would switch back and forth while developing their programs. This was Apple's development system for m68k based Macs that ran natively on Macintosh computers. Prior to this product, Macintosh software had to be developed on Lisa machines. The Arity Prolog Compiler is an implementation of the Prolog language. It features a compiler that creates high speed executables in addition to an interpreter. It competed against the less expensive Borland Turbo Prolog. ASSIST/I, by BDM Software, is an IBM Mainframe Assembler/Interpreter. It allows IBM mainframe assembler language programs to be written assembled, and executed in an interactive, non-IBM-mainframe environment.'''
