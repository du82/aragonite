["https://winworldpc.com/library/applications/platform-linux"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = 'Firefox is a web browser based on the open source Mozilla web browser. It was intended to be lighter weight and faster than Mozilla, separating the e-mail client in to the new Thunderbird product. At release, it implemented better support for web standards than Microsoft Internet Explorer. Firefox included features such as tabbed browsing and support for add-ons. IBM Small Business Suite for Linux V1.6 is a Development Platform with a Set of Personal Productivity Tools. It was intended to simplify businesses transitioning to "e-business" by providing a foundation on which users could “webify” their businesses. It includes IBM and Lotus middleware products for Linux and Productivity tools for Windows. Mozilla is an open source web browser based on a rewrite of the Netscape web browser. Netscape Communications Corporation released the source code in 1998 with the intent that it would be used as the core of next Netscape browser. Shortly after the release, Netscape Communications Corporation was acquired by AOL. Mozilla was used for the basis of Netscape 6.x and 7.x. Mozilla (later codenamed SeaMonkey) was eventually reworked and became Firefox. Netscape Navigator/Communicator was the first commercial web browser, displacing the free NCSA Mosaic. 1.0 was first released in December 1994, and initially offered advanced features such as progressively rendering pages as they loaded. It quickly gained many other features and capabilities and became the most popular web browser in the mid 1990s. One reason for its popularity, it was licensed freely for personal and non-profit use, although companies were expected to pay for a license. It later competed with Microsoft Internet Explorer, Opera, and Safari, and eventually was open sourced in to the Mozilla browser. StarOffice, initially from Star Division GmbH is an office suite containing a word processor, spreadsheet, drawing program, and graphing program. It was later owned by Sun Microsystems and then Oracle, and spawned the open source OpenOffice and LibreOffice. Also see the earlier StarWriter'
