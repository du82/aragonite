["https://winworldpc.com/library/applications/tag-document"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "Acrobat Reader is the free software from Adobe used to read, view, and print documents created by the commercial Adobe Acrobat product. Its primary strength is that documents appear and print identically across differing systems. AOL Press 2.0 is a Windows based what-you-see-is-what-you-get HTML editor from AOL. It competed with other HTML Cuisinarts such as Microsoft Front Page. EZ Legal Software Corporate Secretary is a set of legal templates geared towards the operation and management of a company. GOfer is a desktop search tool capable of searching many document formats. It loads as a TSR and can be called while other programs are running. It support multiple word search, operators, and inexact searches. It does not use an index, that makes it slower but requires no additional disk space. Another great Parsons product on Winworld, It's Legal is a program that assists home users in creating complex legally binding documents. It walks users though the process of gathering required information, automatically makes certain decisions, and produces a printed document. It includes wills, power of attorney, employment agreements, promissory notes, leases, and consumer letters. The documents can be used by themselves, or as a draft for an attorney. Magellan was a desktop file viewer and search tool. It indexes all files on your hard drive, and you can search for related information across file formats. This is a promotional collection of documents in HTML format released in 1997 describing Microsoft's upcoming plans for future versions of Windows. MyDesk, from IOTA Industries Ltd, is a document search and organizer tool for scanned images. It incorporates Visioneer's PaperPort to OCR and index documents. Omnipage is an optical character recognition (scanned image) application that can export to a number of document formats. It was often bundled with scanners. PaperPort is a document management system frequently bundled with scanners. It can OCR scanned documents and convert them to PDF."
year_published = 2025
