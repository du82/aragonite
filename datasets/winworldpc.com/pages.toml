["https://winworldpc.com/library/applications/platform-unix"]
title = "WinWorld: Library"
description = "WinWorld is an online museum dedicated to providing free and open access to one of the largest archives of abandonware software and information on the web."
full_description = "Adobe Acrobat, first released in 1993, is a tool for creating portable electronic documents. Its documents retain complex formatting when used across differing systems, so that they appear identical when viewed on screen or printed to a printer. Acrobat accomplishes this by encapsulating Adobe's PostSript printer language in to a document file format and offering the ability to embed fonts that are not present on the target system. Adobe Illustrator is a vector graphics editor developed and marketed by Adobe Systems. It was often sold as a companion product to the bit-map/photo editor Adobe Photoshop. Illustrator was originally released in 1987 for the Apple Macintosh. Early versions were ported to NexT, Silicon Graphics, and Sun Solaris. AutoCAD, from Autodesk and first released in 1982, is a powerful Computer Aided Design tool. It was, and still is, often considered the standard for CAD tools. Primarily for the IBM PC platform, it was ported to x86 machines with higher video resolutions such as the Zenith Z-100 and NEC APC. Intermittently, versions for the Macintosh appeared. Later versions use a dongle copy protection. CorelDRAW is a vector based drawing and illustration program. Tools like CorelDRAW enabled desktop publishers to create professional quality illustrations that printed and scaled without distortion. It is primarily a Windows application, but was ported to Mac OS, Mac OS X, Linux, CTOS and OS/2. The earliest versions ran on Windows 2. FoxBASE, a relational database from Fox Software, started off in 1984 as a clone of dBase II that boasted many speed improvements. FoxBASE+ adds feature parity and compatibility with dBase III Plus. It was later aquired by Microsoft and became FoxPro FrameMaker, originally from Frame Technology Corporation and later Adobe, is a professional document system for creating large, complex documents with highly structured layout. It was often accompanied by FrameReader. The IBM Architecture and Engineering Series (AES) is a complete, high end, integrated, 3D drafting and information system. Developed by the firm of Skidmore, Owings and Merrill (SOM) for IBM, this 3D Computer Aided Design system meets the needs of architects, engineers, and builders."
