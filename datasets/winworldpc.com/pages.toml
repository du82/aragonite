full_description = '3D FloorPlan is a 3-dimensional architectural and space planning program for small business professionals and home users. The user may design a home addition or remodel in 2D and FloorPlan automatically converts the drawing into 3D. The user can then walk through the 3D model in real time. 3D Studio, not to be confused with the later "3d Studio Max" product, is a DOS-based tool from Autodesk for creating 3d models and animations. First released in 1983 by IMSI (International Microcomputer Software, Inc), 4 Point Graphics was one of the earliest drawing and animation programs for the IBM PC. It competed against a drawing program called PC Crayon. 4WORD is an add-in word processor for Lotus 1-2-3. Unlike TSR programs 4WORD works from within Lotus, using the same menus, using the Lotus printer drivers, and storing your documents inside your spreadsheet. It can copy and paste data between your document and spreadsheet as well link to live cells in to your document. Originally released in 1984 by the Canadian company Xanaro that went bankrupt, and then by Migent, Ability is an integrated office suite for DOS that includes word processor, spreadsheet, database, telecommunications, business graphing, presentation graphics capabilities, and built in file management. It features good integration between the different components, with the ability to import, share, and dynamically update data between them. It was advertised as a very easy to use and a quick to learn system. ABstat, from AndersonBell, is a statistical package that contains a variety of statistical functions, creates graphs, features a command language, and can directly use dBase files. ACT!, or "Activity Control Technology", originally from Conductor Software, and later Contact Software and then Symantec, is an easy to use business relationship management system targeted at traveling sales professionals. It can track things like billable time and expenses. Acrobat Reader is the free software from Adobe used to read, view, and print documents created by the commercial Adobe Acrobat product. Its primary strength is that documents appear and print identically across differing systems.'
