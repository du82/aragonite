full_description = '''3D FloorPlan is a 3-dimensional architectural and space planning program for small business professionals and home users. The user may design a home addition or remodel in 2D and FloorPlan automatically converts the drawing into 3D. The user can then walk through the 3D model in real time. Broderbund's 3D Home Architect is a home-design oriented CAD program. It includes a variety of home decor related objects, and can render the results in 3D. 3D Studio, not to be confused with the later "3d Studio Max" product, is a DOS-based tool from Autodesk for creating 3d models and animations. First released in 1983 by IMSI (International Microcomputer Software, Inc), 4 Point Graphics was one of the earliest drawing and animation programs for the IBM PC. It competed against a drawing program called PC Crayon. Adobe Dimensions was a low cost 3-d object editing and rendering program. Unlike other 3d rendering programs, Dimensions is specifically geared towards producing illustrations for print. programs, such as Adobe Illustrator or Freehand, and edited to create 3d objects. Then, instead of outputting a pixilated raster image, it outputs in postscript bezier curves, which can then be further processed by other 2d illustration packages. Adobe Illustrator is a vector graphics editor developed and marketed by Adobe Systems. It was often sold as a companion product to the bit-map/photo editor Adobe Photoshop. Illustrator was originally released in 1987 for the Apple Macintosh. Early versions were ported to NexT, Silicon Graphics, and Sun Solaris. Adobe Photoshop Elements is the successor to Photoshop LE, a somewhat reduced, home-oriented version of Adobe Photoshop. Adobe Streamline is an image conversion and manipulation tool that aids conversion of bit-mapped images in to PostScript line art for use in tools such as Adobe Illustrator. IntelliDraw is a shape based vector illustration tool that enables you to dynamically control shapes using numeric, rule based, or relationship based parameters.'''
