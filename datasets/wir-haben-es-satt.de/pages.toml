title = "Demo 2017 - Wir haben es satt!"
full_description = "YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Fernsehen und Videoberichte Wir haben es satt!-Videorückblick Campact-Video CastorTV-Livestream ARD Tagesthemen (ab Minute 9:54) ZDF Heute Journal (ab Minute 11:08) RBB Abendschau RBB Aktuell (ab Minute 10:50) NDR Hallo Niedersachsen NDR Nordmagazin (ab Minute 2:42) ZDF Frontal 21 (ab Minute 6:15) N24 TV Berlin Print- und Onlinemedien tagesschau.de heute.de MDR SWRinfo Stern taz Welt Tagesspiegel Berliner Kurier Berliner Zeitung Neues Deutschland RBB Deutsche Welle I Deutsche Welle II Focus Junge Welt der Freitag Süddeutsche Berliner Morgenpost u.v.m. regionale und landwirtschaftliche Medien Unabhängige Bauernstimme topagrar Schweizer Bauer Lübecker Nachrichten AZ-online Badische Zeitung Neue Osnabrücker Zeitung Weser-Kurier MOZ Volksstimme Schwäbische Zeitung Hessische Niedersächsische Allgemeine Hohenloher Tageblatt 7. Wir haben es satt!-Demo am 21. Januar 2017 Aufruf Agrarkonzerne: Finger weg von unserem Essen! Die bäuerliche Landwirtschaft und das regionale Lebensmittelhandwerk sind in Gefahr. Denn Agrarkonzerne und die Bundesregierung treiben die Industrialisierung der Land- und Lebensmittelwirtschaft voran. Die Folgen: Das weltweite Höfesterben schreitet rasant voran, die handwerkliche Lebensmittelherstellung wird verdrängt, hunderte Millionen Menschen leiden an Hunger oder Mangelernährung, die Artenvielfalt schwindet und die Klimakrise verschärft sich. Wir wollen Bauernhöfe statt Agrarindustrie! Statt Bäuerinnen und Bauern weltweit durch Landnahme den Boden unter den Füßen wegzuziehen, müssen Arbeit und Perspektiven in den ländlichen Regionen geschaffen werden. Im Wahljahr 2017 wird entschieden: Weiterhin Steuermilliarden für Agrar- und Chemieindustrie, Großgrundbesitz und Tierfabriken? Oder werden die regionale Landwirtschaft und das Lebensmittelhandwerk sowie Tier- und Umweltschutz gefördert? Wir wollen eine sozial gerechte Agrarpolitik! Kleinere und mittlere Höfe müssen überleben können. Dafür brauchen wir eine Agrarwende hin zu einer bäuerlichen und ökologischeren Landwirtschaft! Wir wollen gesundes Essen! Aber Pestizide wie Glyphosat belasten unsere Lebensmittel, Mega-Mastanlagen quälen Nutztiere und übermäßiger Gülleeinsatz verschmutzt unser Wasser. Chemieriesen versuchen neuartige Gentechniken durch die Hintertür auf die Äcker und Teller der Welt zu bringen. An diesem System verdient vor allem die Agrarindustrie – auf Kosten von Bäuerinnen und Bauern. Schluss damit: Wir brauchen verbindliche Regeln für eine Land- und Ernährungswirtschaft, die Mensch, Tier, Umwelt und Klima schützt! Wir wollen Demokratie statt Konzernmacht! Freihandelsabkommen wie CETA, TTIP und EPAs mit afrikanischen Staaten werden die Märkte weiter liberalisieren und zu noch mehr Exportabhängigkeit führen. Bäuerinnen und Bauern müssen zunehmend für den Weltmarkt produzieren, zu noch miserableren Erzeugerpreisen. Das führt zu Dumping-Exporten und zu höherer Marktkonzentration. Megakonzerne wie Bayer-Monsanto üben immer mehr Macht über unser Essen aus – vom Saatgut bis in den Supermarkt. Verantwortlich auch hier: die Agrarpolitik in Berlin und Brüssel. Wir Bäuerinnen und Bauern, LebensmittelhandwerkerInnen, ImkerInnen, BäckerInnen, GärtnerInnen, Tier-, Umwelt- und NaturschützerInnen, Aktive der Entwicklungszusammenarbeit, kritische VerbraucherInnen und engagierte Jugendliche fordern auf der 7. „Wir haben es satt!“-Demonstration eine bäuerlich-ökologischere Landwirtschaft. Wir brauchen gesundes Essen für alle! Wir lassen die Ernährungs- und Agrarwende Tag für Tag Wirklichkeit werden und machen sie zum zentralen politischen Thema im Wahljahr. Die Politik muss sich jetzt ändern, damit Konzerne nicht länger über unser Essen bestimmen. ALLE DEMO-BILDER AUF FLICKR banner traktoren huhn brandenburger tor banner_closeup #carousel-backgroundimage-308-28 { background-image: url('/fileadmin/_processed_/f/2/csm_Demo_17_3_01834f1817.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-308-28 { background-image: url('/fileadmin/_processed_/f/2/csm_Demo_17_3_8aa09afbfe.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-308-28 { background-image: url('/fileadmin/_processed_/f/2/csm_Demo_17_3_0ffffd5515.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-308-28 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_3.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-308-28 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_3.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-308-28 { background-image: url('/fileadmin/_processed_/f/2/csm_Demo_17_3_653e242252.jpg'); } } #carousel-backgroundimage-308-31 { background-image: url('/fileadmin/_processed_/b/7/csm_Demo_17_4_c7a3aef666.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-308-31 { background-image: url('/fileadmin/_processed_/b/7/csm_Demo_17_4_d574d4199c.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-308-31 { background-image: url('/fileadmin/_processed_/b/7/csm_Demo_17_4_88f39f2737.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-308-31 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_4.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-308-31 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_4.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-308-31 { background-image: url('/fileadmin/_processed_/b/7/csm_Demo_17_4_c567cbbf69.jpg'); } } #carousel-backgroundimage-308-30 { background-image: url('/fileadmin/_processed_/6/9/csm_Demo_17_2_325ea43e20.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-308-30 { background-image: url('/fileadmin/_processed_/6/9/csm_Demo_17_2_4c6f2a4a2c.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-308-30 { background-image: url('/fileadmin/_processed_/6/9/csm_Demo_17_2_ea373cb2d1.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-308-30 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_2.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-308-30 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_2.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-308-30 { background-image: url('/fileadmin/_processed_/6/9/csm_Demo_17_2_4978563dbb.jpg'); } } #carousel-backgroundimage-308-29 { background-image: url('/fileadmin/_processed_/1/0/csm_Demo_17_1_732b168be6.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-308-29 { background-image: url('/fileadmin/_processed_/1/0/csm_Demo_17_1_eb8271ea70.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-308-29 { background-image: url('/fileadmin/_processed_/1/0/csm_Demo_17_1_b58bcbbabc.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-308-29 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_1.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-308-29 { background-image: url('/fileadmin/user_upload/fotos/demo17/Demo_17_1.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-308-29 { background-image: url('/fileadmin/_processed_/1/0/csm_Demo_17_1_159cd5b751.jpg'); } } #carousel-backgroundimage-308-32 { background-image: url('/fileadmin/user_upload/fotos/demo17/frontbanner_closeup.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-308-32 { background-image: url('/fileadmin/user_upload/fotos/demo17/frontbanner_closeup.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-308-32 { background-image: url('/fileadmin/user_upload/fotos/demo17/frontbanner_closeup.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-308-32 { background-image: url('/fileadmin/user_upload/fotos/demo17/frontbanner_closeup.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-308-32 { background-image: url('/fileadmin/user_upload/fotos/demo17/frontbanner_closeup.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-308-32 { background-image: url('/fileadmin/_processed_/f/0/csm_frontbanner_closeup_b841964916.jpg'); } } Zurück Weiter Pressemitteilung „Wir haben Agrarindustrie satt!“: 18.000 Bauern und Bürger fordern Wende in der Agrar- und Ernährungspolitik 130 Traktoren aus ganz Deutschland führen Demonstration an / Bündnis fordert in 9-Punkte-Plan tier-, umwelt- und klimagerechten Umbau der Landwirtschaft Berlin, 21.1.17. Parallel zur Grünen Woche zogen heute bei der „Wir haben es satt!“-Demonstration 18.000 Menschen für Bauernhöfe und den tier- und umweltgerechten Umbau der Landwirtschaft durch das Berliner Regierungsviertel. Angeführt von 130 Traktoren drückten die Demonstranten unter dem Motto „Agrarkonzerne, Finger weg von unserem Essen!“ lautstark ihren Protest gegen die Industrialisierung der Landwirtschaft aus. Bereits am Morgen hatten konventionell und ökologisch wirtschaftende Bauern am Bundeslandwirtschaftsministerium neun Forderungen zur Bundestagswahl überreicht. Der Tenor des 9-Punkte-Plans: Die gravierenden Krisen in der Landwirtschaft erfordern nicht folgenloses Reden, sondern entschlossenes Handeln. „Wir fordern ein Ende der Subventionen für die Agrarindustrie und den Stopp von Mega-Fusionen im Agrarsektor. Stattdessen brauchen wir Anreize für Bauern, die Tiere besonders artgerecht halten und umweltschonend wirtschaften“, sagt Jochen Fritz, Sprecher des „Wir haben es satt!“-Bündnisses, dem mehr als 100 Organisationen aus Landwirtschaft, Imkerei, Natur-, Tier- und Verbraucherschutz, Entwicklungsorganisationen und dem Lebensmittelhandwerk angehören. Fritz weiter: „Bundeslandwirtschaftsminister Schmidt muss endlich dafür sorgen, dass die bäuerlichen Betriebe vom gesellschaftlich gewollten Umbau hin zu einer ökologischeren, tierfreundlicheren Landwirtschaft profitieren. Herr Schmidt darf nicht noch mehr Zeit verlieren und muss Agrarpolitik für Bauern statt Agrarindustrie machen!“ Außerdem fordern die Demonstranten im Wahljahr unter anderem die konsequente Förderung von Bauernhöfen sowie die drastische Reduzierung von Pestiziden und Antibiotika. Das Bündnis kritisiert, dass aufgrund fehlgeleiteter Agrarpolitik in den vergangenen zehn Jahren mehr als 100.000 Bauernhöfe aufgeben mussten. Außerdem belaste die deutsche Agrarpolitik, insbesondere durch übermäßige Fleischproduktion, die Umwelt und das Klima und zerstöre durch Dumpingexporte kleinbäuerliche Strukturen überall auf der Welt. Gleichzeitig formierten sich immer größere, global agierende Konzerne. In der Fusion der Chemiekonzerne Bayer und Monsanto sieht das Bündnis eine große Bedrohung, da künftig mehr als 60 Prozent des Saatgut- und Agrochemiemarktes von drei Mega-Konzernen beherrscht würden. Die Kartellbehörden müssten verhindern, dass bäuerliche Betriebe und Konsumenten von patentiertem Saatgut abhängig werden. Auf dem Traktor eines Brandenburger Bauers war zu lesen: „Bayer und Monsanto, bleibt uns vom Acker!“ An der Spitze des Demonstrationszuges liefen zahlreiche junge Bäuerinnen und Bauern, die einen Hof gründen wollen. Ihnen fehlt aber vielfach der Zugang zu landwirtschaftlich nutzbarem Boden. Julia Rupp, 26-jährige Bäuerin aus Honhardt in Baden-Württemberg, sagte: „Als junge Generation wollen wir eine Zukunft auf dem Land, uns werden aber zu viele Steine in den Weg gelegt. Wir brauchen dringend ein Agrarstrukturgesetz, das Landkauf- und Pachtrechte bevorzugt an junge Bäuerinnen und Bauern gibt, nicht an Investoren. Wir müssen den Niedergang der bäuerlichen Landwirtschaft und des Lebensmittelhandwerks aufhalten, sonst kommt es zum Strukturbruch. Unsere Lebens- und Ernährungsgrundlage lassen wir uns nicht von Agrarkonzernen wegnehmen!“ Die Demonstration richtet sich gegen die Agrarindustrie, nicht aber gegen konventionelle Landwirte. Seit sieben Jahren praktiziert „Wir haben es satt!“ den Dialog zwischen Zivilgesellschaft, konventionellen und Öko-Bauern sowie Lebensmittelhandwerkern, um gemeinsam Wege für eine bäuerliche Zukunftslandwirtschaft zu finden. Pressespiegel Fernsehen und Videoberichte Wir haben es satt!-Videorückblick Campact-Video CastorTV-Livestream ARD Tagesthemen (ab Minute 9:54) ZDF Heute Journal (ab Minute 11:08) RBB Abendschau RBB Aktuell (ab Minute 10:50) NDR Hallo Niedersachsen NDR Nordmagazin (ab Minute 2:42) ZDF Frontal 21 (ab Minute 6:15) N24 TV Berlin Print- und Onlinemedien tagesschau.de heute.de MDR SWRinfo Stern taz Welt Tagesspiegel Berliner Kurier Berliner Zeitung Neues Deutschland RBB Deutsche Welle I Deutsche Welle II Focus Junge Welt der Freitag Süddeutsche Berliner Morgenpost u.v.m. regionale und landwirtschaftliche Medien Unabhängige Bauernstimme topagrar Schweizer Bauer Lübecker Nachrichten AZ-online Badische Zeitung Neue Osnabrücker Zeitung Weser-Kurier MOZ Volksstimme Schwäbische Zeitung Hessische Niedersächsische Allgemeine Hohenloher Tageblatt"
