full_description = "WHES25 MITFAHRZENTRALE EINEN BUS ORGANISIEREN Anreise Die Wir haben es satt!-Demonstration beginnt mit der Auftaktkundgebung um 12 Uhr am Bundeskanzleramt in Berlin. Vor Ort Die Demo startet in diesem Jahr am Bundeskanzleramt. Das ist 10 Minuten Laufabstand vom Hauptbahnhof. In 5 Laufminuten Entfernung ist die U-Bahn Station Bundestag (Linie U5). Verbindungen findet ihr bei der BVG. Hinweis Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses externen Inhaltes nicht zu. Cookie-Einstellungen anpassen U-Bahn & S-Bahn Der Hauptbahnhof wird von einer Vielzahl von S-Bahn Linien angefahren: S3, S5, S7, S9. Tram-Linien, die über den Hbf fahren: M5, M8, M10, 12 U-Bahnlinie U5 fährt über den Hauptbahnhof zur Haltestelle Bundestag, dort für die Demoanreise aussteigen Bus Bushaltestellen in Auftakt-Nähe sind Reichstag/Bundestag, Platz der Republik, S+U Hauptbahnhof/Washingtonplatz Mitfahrzentrale Ihr kommt mit dem Bus, der Bahn oder dem Auto nach Berlin und habt noch Plätze frei? Oder ihr sucht eine Mitfahrgelegenheit? ZUR MITFAHRZENTRALE Mit der Bahn Es gibt verschiedene Möglichkeiten mit der Bahn in Gruppen anzureisen. Zum Beispiel mit dem Quer-Durchs-Land-Ticket. Damit können bis zu 5 Personen mit Regionalzügen quer durchs Land reisen. Zusätzlich gilt das Ticket auch für den Berliner Stadtverkehr. In einer Gruppe von 5 Personen ist es am günstigsten: ihr bezahlt dann nur 16,4 Euro pro Person. Bis zu drei Kinder im Alter von 6 bis 14 Jahre dürfen gratis mitfahren. Die Bahn bietet zudem das Grüne-Woche-Ticket an. Damit könnt Ihr mit dem Fernverkehr für rund 112 Euro hin- und zurückreisen. Offiziell braucht ihr als Buchungsbedingung ein für die Grüne Woche o.Ä.. Als Einzelperson bietet sich natürlich auch das 58€-Ticket/Deutschlandticket an. Mit dem Fernbus Fernbusse sind eine weitere Möglichkeit, um aus den meisten deutschen Großstädten nach Berlin zu kommen. Zeiten und Preise könnt ihr unter busliniensuche.de vergleichen. Organisiert einen Bus Du weißt, dass mehrere Menschen aus deiner Region zur Demonstration wollen? Dann fahrt doch gemeinsam im Bus! Einen Bus zu organisieren ist leichter als gedacht. Alle wichtigen Infos finden sich auf unserer Seite zur Bus-Orga. WHES25 MITFAHRZENTRALE EINEN BUS ORGANISIEREN"
