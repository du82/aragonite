title = "Berlin, 18.01.2020 - Wir haben es satt!"
full_description = 'Pressemitteilung 27.000 für enkeltaugliche Landwirtschaft und gutes Essen Bündnis aus Landwirtschaft und Gesellschaft fordert: Bauernhöfe unterstützen, Artenvielfalt sichern und Klima retten – 2020 die europäische Agrarwende anpacken Berlin, 18.01.20. Bauernhöfe unterstützen, Insektensterben stoppen und konsequenten Klimaschutz – das fordern 27.000 Menschen bei der „Wir haben es satt!“-Demonstration zum Auftakt der „Grünen Woche“ in Berlin. „Wir haben die Alibi-Politik des Agrarministeriums gehörig satt!“, sagt Bündnis-Sprecherin Saskia Richartz. Die Bundesregierung trägt die Verantwortung für das Höfesterben und den Frust auf dem Land. Seit 2005, als Angela Merkel Kanzlerin wurde, mussten 130.000 Höfe schließen – im Schnitt gab ein Familienbe-trieb pro Stunde auf. Die Klimakrise, zu viel Nitrat im Grundwasser und das dramatische Artensterben zeigen, dass es so nicht weitergeht. „Reden reicht nicht, die Zeit der Ankündigungen ist vorbei. Wir messen Agrarministerin Klöckner daran, was bei ihrer Politik unter dem Strich für Bauern-höfe, Tiere und das Klima herauskommt. Bislang ist diese Ministerin in dieser Hinsicht eine Nullnummer!“, so Richartz. „Wir fordern, dass die Bundesregierung 2020 bei der EU-Agrar-reform Nägel mit Köpfen macht. Jetzt heißt es für Julia Klöckner: Ärmel hochkrempeln und die Agrarwende anpacken!“ Der Bundesregierung kommt während ihrer EU-Ratspräsidentschaft in der zweiten Jahres-hälfte eine zentrale Rolle bei der Gestaltung der Gemeinsamen EU-Agrarpolitik (GAP) zu. Mit den rund 60 Milliarden an Fördergeldern pro Jahr sind zukunftsfähige Landwirtschaft und gutes Essen auf den Tellern europaweit möglich. Elisabeth Fresen, 29-jährige Bäuerin mit einem 160-Hektar-Betrieb und 100 Mutterkühen aus Verden/Aller, sagt: „Wir Bäuerinnen und Bauern jammern nicht, wir packen an. Viele Be-triebe sind der Politik in Sachen Tier- und Klimaschutz schon große Schritte voraus. Wenn Landwirtschaft und Gesellschaft jetzt an einem Strang ziehen, können wir der bauern- und umweltfeindlichen Politik ein Ende machen. Mit einer enkeltauglichen Agrarpolitik und fairen Preisen sind Tierwohl, Insektenschutz und gesundes Essen für alle machbar.“ Mit ihrem „Wachsen oder Weichen“ haben das Agrarministerium und die Spitzen des Bau-ernverbands jahrelang gegen die bäuerlichen Betriebe gearbeitet. Der jetzt anstehende art-gerechte Umbau der Ställe und das Mehr an Insekten- und Klimaschutz kosten und dürfen nicht auf die Bauernhöfe abgewälzt werden. Schon am Vormittag übergaben die Bäuerinnen und Bauern, die mit ihren Traktoren aus ganz Deutschland angereist waren, eine Protestnote an die Agrarminister*innen der Welt. Ihre Botschaft: Statt mit unfairen Freihandelsabkommen neue Märkte für Auto- und Chemie-Konzerne zu erschließen, braucht es gerechten Handel, die Durchsetzung von Bauernrech-ten und Schutz von bäuerlichen Betrieben auf der ganzen Welt. Deswegen fordert das De-monstrationsbündnis ein Veto Deutschlands gegen das geplante EU-Mercosur-Abkommen. Bei der „Wir haben es satt!“-Großdemonstration gehen zum mittlerweile zehnten Mal Zehn-tausende gegen die Agrarindustrie und für eine zukunftsfähige Landwirtschaft auf die Straße. Konventionelle und Öko-Bäuer*innen demonstrieren im Schulterschluss mit der Gesellschaft gegen die fatalen Auswirkungen der intensiven industriellen Landwirtschaft. Gemeinsam zeigt das Bündnis zugleich Wege für eine bäuerliche Landwirtschaft auf, die auf breite Zustimmung in der Bevölkerung trifft und den Bauernhöfen wirtschaftliche Perspektiven bietet. Statements von Redner*innen der Demonstration Lea Leimann von Slow Food Youth: „Durch die Ressourcenübernutzung und Überschreitung der planetaren Grenzen durch das industrielle globale Lebensmittelsystem steuern wir gerade auf einen Abgrund zu. Mit einem ökologisch und sozial verträglichen Lebensmittelsystem können wir dagegen den Umwelt- und Klima-Herausforderungen unserer Zeit begegnen und die Ernährung sichern.“ Tilman von Samson von Fridays for Future: "Die aktuelle Agrarpolitik verdeutlicht die Ignoranz der Bundesregierung gegenüber den Herausforderungen unserer Zeit. Anstelle der massiv kritisierten Direktzahlungen brauchen wir ein System, das unseren Landwirt*innen hilft, eine der größten Hoffnungen im Kampf für die Klimawende zu werden!" Christoph Bautz, Geschäftsführer der Bürgerbewegung Campact: “Die Demos gestern und heute ziehen am selben Strang: Denn den Bauern steht das Wasser bis zum Hals. Jetzt braucht es die richtigen Konsequenzen: Weniger Weltmarkt und mehr regionale Vermarktung. Faire Preise statt Dumping der Discounter. Und Agrarsubventionen für Landwirte, die Artenvielfalt erhalten und ihre Tiere anständig halten." Paula Gioia von der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) und La Via Campesina: „Wir fordern: Schluss mit der Produktion für den Weltmarkt – Bauernrechte jetzt umsetzen! Als Bäuer*innen wollen wir in erster Linie für lokale Märkte produzieren. Das schafft Ernährungssouveranität hier, erhält die Agrarmärkte und bäuerlichen Lebensmittelsysteme anderswo und ist ein wichtiger Beitrag für die globale Solidarität!“ Antônio Andrioli, Agrarexperte und Mitbegründer der brasilianischen Bundesuniversität „Fronteira Sul“: „Wir fordern EU-Mercosur-Abkommen stoppen! Denn es ist politisch falsch, erhöht die soziale Ungleichheit beim Einkommen, fördert lange Transportwege und noch mehr Abholzung. Die Länder in Lateinamerika werden weiter auf die Produktion von Primärprodukten reduziert, von Industriegütern aus Europa überschwemmt und zur Unterentwicklung verdammt.“ Martin Kaiser, Geschäftsführer von Greenpeace: „Ohne eine konsequente Agrarwende werden wir die Klimakrise nicht in den Griff bekommen. Ministerin Klöckner muss unseren Protest ernstnehmen. Sie muss Tierleid endlich verbieten und die Emissionen aus der Landwirtschaft durch weniger Tiere deutlich reduzieren.“ Hubert Weiger, Ehren-Vorsitzender des Bund für Umwelt und Naturschutz Deutschland (BUND): „Wir brauchen eine soziale und ökologische EU-Agrarpolitik – bei der die Natur und die bäuerlichen Betriebe im Mittelpunkt stehen. Damit schützen wir auch die Vielfalt der Landschaften und können den Rückgang der Insekten stoppen. Die Agrarpolitik muss endlich den Rahmen dafür schaffen, dass Bäuerinnen und Bauern für den Erhalt der Lebensgrundlagen auch honoriert werden.“ Thomas Schröder, Präsident des Deutschen Tierschutzbunds: „Stillstand und Rückschritt zeichnen die letzten Jahre deutscher Tierschutzpolitik aus. Erst die Verlängerung der betäubungslosen Ferkelkastration – nun soll die Sauenhaltung im Kastenstand legalisiert werden. Wir haben es satt – und stellen Strafanzeige, sofern Frau Klöckner nicht von ihren Plänen ablässt.“ Jörg-Andreas Krüger, NABU-Präsident: „Dürresommer, Artensterben: Die Zeit rennt uns davon. Wir brauchen jetzt eine zukunftsfähige EU-Agrarpolitik. Denn 2020 entscheidet sich, ob wir endlich faire Bedingungen für Landwirte und Natur schaffen." Felix Prinz zu Löwenstein, Bio-Bauer und BÖLW-Vorsitzender: „Wir stehen in einer Zeitenwende, ob wir wollen oder nicht. Es kommt jetzt nur darauf an, ob wir sie selbst gestalten. Die Bundesregierung muss deshalb für die Unterstützung der Bauern sorgen, die Klima, Tiere, Boden oder Gewässer schützen. Und die Bäuerinnen und Bauern müssen gemeinsam ein mutiges Bild einer zukunftsfähigen Landwirtschaft entwickeln.“ Fotos Fotos von der Demonstration gibt es hier. Pressemitteilung'
