title = "Demo 2021 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen PRESSESPIEGEL TV ZDF Heute ZDF Journal Tagesthemen Deutsche Welle (ab 10:00) Euronews Brandenburg Aktuell RBB Abendschau MDR Aktuell Tagesschau am 13.1. Tagesschau24 am 13.1. RADIO Inforadio DLF Umwelt & Verbraucher Deutschlandfunk Aktiv Radio I Aktiv Radio II Aktiv Radio III Aktiv Radio IV BR Landwirtschaft und Umwelt Dom Radio Tagesschau.de Tagesspiegel Bayerischer Rundfunk WEITERLESEN Zeit Tagesspiegel Junge Welt Frankfurter Rundschau Berliner Morgenpost Berliner Zeitung B.Z. Berliner Kurier F.A.Z. rbb24 Süddeutsche Zeitung Süddeutsche Zeitung TAG24 Täglicher Anzeiger web.de Welt RTL.de berlin.de Junge Welt Deutsche Welle RTL.de rbb24 Tagesspiegel II Neues Deutschland evangelisch.de rbb24 Sächsische Zeitung taz taz Schwarzwälder Bote Mannheimer Morgen Wetterauer Zeitung WEITERLESEN Nordwest Zeitung Usinger Anzeiger Neue Westfälische Wasserburger Stimme Märkische Oder-Zeitung Allgäuer Zeitung Schwäbische Zeitung Nord24 Agrar Heute I Unabhängige Bauernstimme I BauernZeitung.ch WEITERLESEN Unabhängige Bauernstimme II Top Agrar I Top Agrar II Top Agrar III Agrar Heute II Agrarzeitung I Agrarzeitung III Agrarzeitung II Proplanta Proplanta People Dispatch 7D News Clarin Daily Sabah WEITERLESEN KCRW Berlin TVP-Info Deutsche Welle Deutsche Welle El Tiempo ElPais.cr Euronews Herald-Whig International Business Times Metro Libre MSN News Nau.ch Pioneer Pressenza Republic World San Louis Obispo - The Tribune Südtirolnews Swissinfo.ch The Local The New York Times United News of Bangladesh WBOC Yahoo News Business Insider Polska Mainichi Agribusiness Intelligence Euractiv Express News Click Shark News A2Larm IDNES.cz Aufruf zum Protest am 16. Januar 2021 Agrarindustrie abwählen! Für eine bäuerlich-ökologischere Landwirtschaft und artgerechte Tierhaltung, für Klimagerechtigkeit und globale Solidarität! Eine gescheiterte EU-Agrarreform, Bankrotterklärungen in der Klimakrise und ein fatales Abkommen mit den Mercosur-Staaten – diese Agrarpolitik muss abgewählt werden! Das Landwirtschaftsministerium und die Bundesregierung hofieren die Agrarindustrie und schieben den Umbau der Landwirtschaft weiter auf. Doch im Superwahljahr 2021 entscheiden wir alle über die Zukunft von Landwirtschaft und Essen. Laut und entschlossen fordern wir im Januar einen echten Politikwechsel: Vom Acker bis zum Teller – Agrar- und Ernährungswende jetzt! Corona zeigt uns noch deutlicher, wie wichtig eine bäuerliche, nachhaltige Landwirtschaft und das regionale Lebensmittelhandwerk sind. Mit tagtäglicher harter Arbeit sichern sie unsere Ernährungssouveränität. Die Pandemie veranschaulicht aber auch die Probleme: Am Beispiel Tönnies sehen wir, wie die Industrie gewaltige Profite auf Kosten von Menschen, Tieren und Natur einfährt. Das macht uns sauer! Schluss mit der Blockadehaltung im Agrarministerium! Seit 15 Jahren macht das unionsgeführte Landwirtschaftsministerium knallharte Klientelpolitik für die Industrie. Das treibt zehntausende Höfe in den Ruin und lässt die Bäuer*innen auf den Kosten für den Umbau der Tierhaltung sitzen. Mit dem „Weiter so“ bei den pauschalen Flächensubventionen heizt Agrarministerin Klöckner das Höfesterben, die Klimakrise und das Insektensterben an. Das haben wir satt! Essen ist politisch! Wir sind die breite Bewegung, die für eine enkeltaugliche Agrar- und Ernährungspolitik auf die Straße geht. Deswegen kämpfen wir für den Erhalt der Höfe und artgerechte, flächengebundene Tierhaltung, für insektenfreundliche Landschaften und echten Klimaschutz, für globale Gerechtigkeit und gutes Essen für alle. Im Superwahljahr für Agrarwende und Klimagerechtigkeit! Bei den 6 Landtagswahlen und der Bundestagswahl zeigen wir 2021 klare Kante: Ohne Politikwechsel keine gute Zukunft für Bauernhöfe, Tiere und Umwelt! Für echten Klimaschutz brauchen wir den Umbau der Landwirtschaft. Das heißt: Die bäuerlich-ökologischere Landwirtschaft stärken und die Höfe bei artgerechter Tierhaltung, Klima- und Artenschutz unterstützen – bei uns und weltweit! Am 16. Januar tragen wir – die bunte, entschlossene und vielfältige Bewegung – unseren Protest für die Agrarwende vor das Kanzleramt. Bleibt bitte Zuhause und beteiligt euch am Protest auf Distanz: Aktion Fußabdruck. Gemeinsam verlangen wir so ein radikales Umsteuern in der Agrar- und Ernährungspolitik! Wir fordern: Höfesterben beenden – Bäuer*innen beim Umbau der Landwirtschaft unterstützen! Tierfabriken stoppen – Stallumbau fördern & Tierzahlen reduzieren! Klimakrise bekämpfen – Fleischkonsum senken & gesunde Böden sichern! Pestizidausstieg angehen & Gentechnik stoppen – Gesundheit & Insekten schützen! EU-Mercosur-Abkommen in die Tonne – Menschenrechte statt Freihandelsabkommen! FOTOS AKTION FUSSABDRUCK FOTOS BÄUER*INNENPROTEST Meer Fussabdrücke 02 Power to the Bauer Klimaschutz ist Ernteschutz Jans Trecker Ausschnitt_Meer_Fussabdrücke Klöckner Abtreten Bauernprotest Schilder #carousel-backgroundimage-5777-504 { background-image: url('/fileadmin/_processed_/a/c/csm_210116_Meer_Fussabdruecke02_15a6d120e6.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-5777-504 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Meer_Fussabdruecke02.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-5777-504 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Meer_Fussabdruecke02.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-5777-504 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Meer_Fussabdruecke02.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-5777-504 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Meer_Fussabdruecke02.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-5777-504 { background-image: url('