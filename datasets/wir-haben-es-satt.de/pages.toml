title = "6-Punkte-Plan - Wir haben es satt!"
full_description = "PDF HERUNTERLADEN 6-Punkte-Plan für die sozial-gerechte Agrarwende und gutes Essen für alle! Forderungspapier von über 100 Organisationen an die Bundesregierung Januar 2023 Gutes Essen ist ein Menschenrecht. Doch trotz steigendem Wohlstand wächst der globale Hunger. Die Corona-Pandemie und der russische Krieg gegen die Ukraine haben diese Schieflage zusätzlich verschärft. Für diejenigen, die Wetten auf Lebensmittelpreise abschließen, ist die Ernährungsarmut der anderen ein Spiel. Agrarflächen sind für Konzerne genauso wie Wohnraum schon lange zum Spekulationsobjekt geworden. 125 Superreiche weltweit verursachen zusammen so viele CO2-Emissionen wie ganz Frankreich, während die Klimakatastrophe durch Dürren, Überschwemmungen oder Brände immer mehr Menschen die Lebensgrundlagen raubt. Die dominanten Agrar- und Ernährungssysteme sind ungerecht, krisenanfällig und nicht nachhaltig. Sie schaffen weder faire Preise und Löhne für Bäuer*innen, Beschäftigte und das Lebensmittelhandwerk noch beenden sie den Hunger auf der Welt. Dazu kommt: Wie Lebensmittel hergestellt werden, schadet vielfach Klima, Artenvielfalt und unserer Gesundheit. Spätestens seitdem die Inflation auch Deutschland erreicht hat, wissen Menschen mit wenig Geld hierzulande nicht mehr, ob sie ihre Wohnung heizen oder den Kühlschrank mit guten Lebensmitteln füllen sollen. Bäuer*innen fehlt die Perspektive, weil sie für ihre anstrengende Arbeit vielfach weder Anerkennung noch faire Preise bekommen. Die prekäre Lage teilen sie mit Beschäftigten, die unter schwierigen Bedingungen Lebensmittel herstellen und oft keine ausreichende Absicherung im Alter haben. Und alle, die Lebensmittel nachhaltig und handwerklich herstellen, sehen sich dem Preisdruck von Großkonzernen ausgesetzt, deren Preise nicht die Folgekosten für Umwelt, Klima und Gesundheit abbilden. Das haben wir satt! Daher fordern wir – über 100 Organisationen aus Landwirtschaft, Sozialbereich, Lebensmittelhandwerk, Gewerkschaftsbranche, Erwerbslosen-, Klima- und Umwelt-Bewegung, Jugend-, Tierschutz- und Eine-Welt-Verbänden – die sozial-gerechte Agrarwende und gutes Essen für alle! Wir fordern eine Politik, die gutes Essen, faire Erzeuger*innenpreise, Umwelt-, Tier- und Klimaschutz, eine gerechte Verteilung des Wohlstands und ein demokratisches Zusammenleben vereint und für alle sichert. Wir erleben, wie Konzerne, Aktienfonds und Milliardär*innen immer wieder Krisen nutzen, um ihre Vermögen zu vergrößern. Die Schere zwischen Arm und Reich wird – hierzulande und weltweit – noch größer. Das ist gefährlich und nützt auch den Feind*innen von Demokratie, Gerechtigkeit und Umweltschutz. Wir lassen uns nicht gegeneinander ausspielen. Umweltgerecht hergestelltes Essen ist ein Grundrecht für alle. Wir sagen: Gutes Essen hat seinen Preis und alle Menschen müssen sich gutes Essen leisten können. Bei sozialen und ökologischen Fragen gibt es kein Entweder-Oder, sie sind die elementare Basis für ein gutes Zusammenleben auf diesem Planeten. Die Agrar- und Ernährungswende, eine Umverteilung des Reichtums und konsequenter Klimaschutz sind notwendige erste Schritte in eine sozial gerechte und solidarische Gesellschaft. Es ist die Pflicht der Bundesregierung dafür zu sorgen, dass alle Menschen Zugang zu gutem Essen haben, dass kleine und mittlere Betriebe nicht der zunehmenden Konzentration zum Opfer fallen und dass Lebensmittel sozial-, tier- und umweltgerecht hergestellt werden. Das fordern wir von der Bundesregierung – und dafür gehen wir gemeinsam auf die Straße. Für uns ist klar: Gutes Essen ist ein Menschenrecht – für alle weltweit! Menschen mit wenig Geld – egal ob mit oder ohne Lohnarbeit – brauchen Zugang zu gesundem und ökologisch verträglich hergestelltem Essen! Gutes Essen braucht faire Erzeuger*innenpreise! Bäuer*innen, Bäcker*innen und alle anderen, die uns mit hochwertigen Lebensmitteln versorgen, müssen gut von ihren Produkten leben können! Gutes Essen geht nur mit guten Arbeitsverhältnissen! Ganzjährig und saisonal Beschäftigte in der Landwirtschaft und Lebensmittelbranche brauchen Tariflöhne, gute Arbeit und armutssichere Renten im Alter! Gutes Essen muss gesund für Mensch, Klima und Tiere sein! Was wir essen, darf nicht unserer Gesundheit, der Umwelt oder den Tieren schaden! Gutes Essen muss global gerecht sein! Agrarexporte aus der EU dürfen keine bäuerlichen Existenzen im globalen Süden zerstören und importierte Lebensmittel brauchen faire Preise! Unsere 6 Forderungen: 1. Zugang zu gesunder und umweltgerechter Ernährung für alle Menschen! Regelsatzlücke von über 250 Euro im Bürgergeld schließen, Sanktionen und Leistungskürzungen überwinden, Versorgung mit fair produzierten, umweltgerechten Lebensmitteln für alle Menschen umsetzen! Sozialleistungen müssen ökologischen Konsum ermöglichen. 2. Faire Erzeuger*innenpreise dauerhaft sicherstellen! Preisdiktat der Supermarktketten stoppen, Einkauf unter Produktionskosten verbieten und regionale, bäuerliche und ökologische Strukturen (z.B. durch öffentliche Kantinen) stärken! 3. Gute Löhne für gute Arbeit! Einen ausreichenden Mindestlohn und armutssichere Renten garantieren, Inflationsausgleich schaffen und eine stärkere Tarifbindung in Landwirtschaft, Nahrungsmittelverarbeitung und im Einzelhandel unterstützen! 4. Gesellschaftlichen Reichtum fair verteilen! Übergewinnsteuer auch bei Agrar-, Lebensmittel-, Handels- und Düngemittelkonzernen erheben, Vermögenssteuer einführen und Kapitalerträge konsequent besteuern, niedrige und mittlere Arbeitseinkommen entlasten, Mehrwertsteuer auf klimagerechte Lebensmittel senken und umweltschädliche Subventionen stoppen! 5. Teller statt Trog, Tank oder Tonne! Ackerflächen, wo möglich, für menschliche Nahrung statt für Futter- und Biosprit-Anbau nutzen und Lebensmittelverschwendung beenden! 6. Hungerkrise beenden! Lebensmittelspekulation verbieten, Recht auf Nahrung durch freies Saatgut und gerechte Landverteilung unterstützen, gentechnikfreie Landwirtschaft sichern, mehr Entwicklungsgelder für die sozial-ökologische Transformation der Ernährungssysteme bereitstellen und unfaire Handelsabkommen stoppen! Unterzeichner*innenliste 144 Unterzeichner*innen (Stand 31.1.23) 1Hektar-Zukunft - GreensUnlimitedADFC MerzigAG Prekäre Lebenslagen (BAG Plesa)Agrar Koordination und Forum für internationale AgrarpolitikAktion 3. Welt SaarAktion Agrar – Landwende jetztAktion gegen den HungerAktionskreis Eine Welt ReifferscheidArbeitsgemeinschaft bäuerliche Landwirtschaft (AbL)Arbeitslosenselbsthilfe OldenburgArmut und Gesundheit in DeutschlandArmutsnetzwerkAttac DeutschlandAurelia StiftungAWO Bezirksverband MittelrheinAWO InternationalBAG Soziale Stadtentwicklung und GemeinwesenarbeitBasta! Erwerbsloseninitiative BerlinBäuerliche Erzeugergemeinschaft Schwäbisch HallBerlin4FutureBerliner TafelBerlin-VeganBerufsverband der PräventologenBiO Reporter InernationalBiohof KeposBiokreisBioland – Verband für organisch-biologischen LandbauBioland Geflügelhof BoddenBischöfliches Hilfswerk MISEREORBrot für die WeltBund für Umwelt und Naturschutz Deutschland (BUND)Bund gegen Missbrauch der TiereBundesverband KulturlogeBundesverband Naturkost Naturwaren (BNN)BUNDjugendBündnis für eine enkeltaugliche LandwirtschaftBündnis für eine gentechnikfreie Landwirtschaft in Niedersachsen, Bremen und HamburgBündnis Junge LandwirtschaftBürgerliste Grün der ZeitCampactChristiansForFutureChristliche Initiative RomeroCoordination gegen BAYER-GefahrenDeinwerk HeinsbergDemeterDeutsche UmwelthilfeDeutscher Berufs- und Erwerbsimkerbund (DBIB)Deutscher NaturschutzringDeutscher TierschutzbundDiakonie Deutschland – Evangelisches Werk für Diakonie und EntwicklungDie Freien BäckerELAN - Emanzipatorisches LandwirtschaftsnetzwerkErnährungsrat BerlinErnährungsrat BrandenburgExtinction RebellionFDCL - Forschungs- und Dokumentationszentrum Chile-LateinamerikaFIAN DeutschlandFoodsharingFördergemeinschaft Ökologischer Landbau Berlin-BrandenburgForum Ökologie & PapierForum Umwelt und EntwicklungFressnetF