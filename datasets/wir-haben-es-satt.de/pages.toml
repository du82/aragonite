["https://wir-haben-es-satt.de/presse-archiv/bonn-28042017"]
title = "Bonn, 28.04.2017 - Wir haben es satt!"
full_description = 'Pressemitteilung Bayer-Monsanto-Fusion bedroht bäuerliche Landwirtschaft Breites Bündnis demonstriert vor Bayer-Aktionärsversammlung gegen Megafusion / Bauern verbrennen aus Protest Patentscheine und Fusionsverträge Bonn, 28.04.2017. Vor Beginn der Bayer-Hauptversammlung demonstrierten heute früh Bauern und Verbraucher in Bonn gegen die geplante Monsanto-Übernahme. Die Kritik der rund 50 in der Kampagne „Meine Landwirtschaft“ zusammengeschlossenen Organisationen lautet: Da Bayer-Monsanto bei erfolgreicher Fusion zum weltweiten Marktführer im Saatgut- und Agrochemiemarkt wird, könne der Megakonzern künftig fast im Alleingang bestimmen, was Bauern pflanzen und Verbraucher essen. Außerdem bedrohe die Fusion die bäuerliche Landwirtschaft – in Europa ebenso wie im globalen Süden. Die Kartellbehörden müssten die Fusion also verhindern, so die Forderung der Veranstalter. Mit einem historischen Kartoffeldämpfer, in dem symbolisch Patentscheine und Übernahme-Verträge verbrannt wurden, zeigten die Demonstranten den eintreffenden Bayer-Aktionären ihre Ablehnung der Konzentrationstendenzen im Agrarbereich. Die Aktion stand unter dem Motto „Genmanipuliert, patentiert, abkassiert – Stoppt die Bayer-Monsanto-Fusion!“ und war Teil der breiten „Stop Bayer-Monsanto“-Proteste in Bonn, zu der am Morgen mehr als 300 Menschen zusammenkamen.Viele Bauern waren mit ihren Traktoren angereist, um ihre Besorgnis auszudrücken. Sie sehen ihre Zukunft durch die Megafusion und die sich immer weiter ausbreitende industrielle Landwirtschaft gefährdet. Bernd Schmitz, Milchbauer aus Hennef und NRW-Landesvorsitzender der Arbeitsgemeinschaft bäuerliche Landwirtschaft warnte vor den Folgen der geplanten Megafusion:"Bayer und Monsanto wollen alle Bereiche der Lebensmittelerzeugung kontrollieren – vom Acker des Bauern bis zum Teller des Verbrauchers. Wir sind heute hier, weil wir nicht tatenlos zusehen werden, wie die bäuerliche Landwirtschaft zerstört wird. Warum sollen wir Bauern uns durch Megakonzerne kaputtmachen und uns ein so wertvolles Gut wie die tägliche Lebensmittelerzeugung aus den Händen nehmen lassen? Sie gehört in die Hände der Zivilgesellschaft, für die wir gerne ackern."Aktuell findet eine noch nie dagewesene Fusionswelle im Agrarbereich statt, Dow und Dupont planen ebenso wie Chemchina und Syngenta den Zusammenschluss. Die EU-Kommission hat hierzu bereits grünes Licht gegeben. Jutta Sundermann von Aktion Agrar kritisierte die Genehmigungspraxis der EU-Kommission:"Die Fusionskontrolle auf EU-Ebene wurde über viele Jahre systematisch geschwächt. Heute werden die Auswirkungen von Elefantenhochzeiten nicht mehr ausreichend geprüft und es fehlt an Werkzeugen, um zu große Konzerne aufzusplitten. Die aktuelle Fusionswelle wird leider nicht die letzte sein. Wer für eine ökologischere bäuerliche Landwirtschaft und demokratische Mitsprache bei unserer Nahrung streitet, muss jetzt Grenzen für Konzernmacht fordern!"Nach der Fusion besäßen Bayer und Monsanto 25 Prozent aller Patente auf Pflanzen und könnten damit Saatgut-Patentgebühren erheben. Bauern müssten also für den Anbau zahlen und Verbraucher würden beim Kauf von Lebensmitteln zur Kasse gebeten. Georg Janßen, Geschäftsführer der IG gegen Nachbaugebühren auf Saatgut sagte:„Die Patentwut von Bayer und Monsanto scheint keine Grenzen zu kennen: Mittlerweile werden nicht mehr nur Patente auf gentechnisch veränderte, sondern auch auf konventionell gezüchtete Pflanzen beantragt und erteilt. Die Bundesregierung und die anderen EU-Regierungen müssen diese unerträgliche Praxis des Europäischen Patentamts in München stoppen, denn Pflanzen und Tiere sind keine Erfindungen. Genmanipuliert, patentiert, abkassiert – nicht mit uns!"Bayer und Monsanto geben vor, mit ihrem Geschäftsmodell aus Gentechnik, Patenten und Pestiziden den Hunger in der Welt besiegen zu wollen. Für eine gesunde ausreichende Ernährung weltweit sind aber freier Zugang zu Land, Saatgut, Wasser und Bildung elementar, denn Kleinbäuerinnen und -bauern stellen 80 Prozent der Lebensmittel weltweit her. Thorsten Moll, von der entwicklungspolitischen Organisation Christliche Initiative Romero verwies auf die existentielle Bedrohung von Millionen Kleinbauern durch die Fusion:„Die Lebensgrundlage vieler Menschen im Globalen Süden steht auf dem Spiel. Durch die Fusion kann Bayer sowohl die Preise für das Saatgut als auch für die Düngemittel bestimmen. So nimmt der Konzern die Bauern und Bäuerinnen von beiden Seiten in die Mangel und macht sie abhängig von industriellem Saatgut und Agrarchemikalien. Das verringert die Artenvielfalt und hat katastrophale Auswirkungen auf Umwelt und Gesundheit der Bäuerinnen, Bauern und ihrer Familien.“ Hintergrund:Die Kampagne „Meine Landwirtschaft“ ist ein breiter gesellschaftlicher Zusammenschluss von rund 50 Organisationen aus den Bereichen Landwirtschaft, Lebensmittelhandwerk und Imkerei sowie Umwelt-, Natur-, Tier- und Verbraucherschutz und Entwicklungszusammenarbeit. Seit sieben Jahren veranstaltet die Kampagne die „Wir haben es satt!“-Demonstration in Berlin, zu der alljährlich im Januar bei eisigen Temperaturen Zehntausende zusammenkommen, um für eine bäuerliche und ökologischere Landwirtschaft und Lebensmittelproduktion zu demonstrieren. www.meine-landwirtschaft.de | www.wir-haben-es-satt.deFür Rückfragen:Bernd Schmitz, Arbeitsgemeinschaft bäuerliche Landwirtschaft NRW, Mobil: 0177-3565559, Email: schmitz[at]abl-ev[dot]deJutta Sundermann, Aktion Agrar, Mobil: 0175-8666769, Email: jutta.sundermann[at]aktion-agrar[dot]deGeorg Janßen, IG gegen Nachbaugebühren auf Saatgut, Mobil: 0170-4964684, Email: janssen[at]abl-ev[dot]deThorsten Moll, Christliche Initiative Romero, Telefon: 0251-67441312, Email: moll[at]ci-romero[dot]de Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Presseansprechpartner, Mobil: 0151-51245795, E-Mail: rollmann[at]meine-landwirtschaft[dot]de Pressemitteilung'
