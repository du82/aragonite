title = "Demo 2012 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Videos: ARD - 20 Uhr-TagesschauARD - TagesthemenZDF - heuteRBB - AbendschauWDR - Aktuelle Stundeh1 - tv.lokalOffizielles Demo-Video von Die FairanstalterVideo: Hühner vor dem Kanzleramt von Die FairanstalterFocus Online VideoDemo-Video von Slow FoodDemo-Video von Regionfilm Film zur Skulpt(o)ur: Skulpt(o)ur in Frankfurt - Video von Uwe KampmannSkulpt(o)ur in Kassel - Video vom BioFairVerein Funk: Deutschlandradio vom 16.1.2012Deutschlandradio vom 21.1.2012 Podcast: Greenpeace-Podcast mit Jochen Fritz (# 95 Meine Landwirtschaft) Print- und Onlinemedien: Berliner KurierBerliner MorgenpostBerliner ZeitungBioNews24.deBZCharivariderStandard.atDer Tagesspiegel (1)Der Tagesspiegel (2)Der WestenDomradioEntwicklungspolitik OnlineFair NewsFAZ BlogFinanznachrichtenFreie PresseFR OnlineJunge WeltMärkische OderzeitungNiederlausitz AktuellNordschleswiger.dkN-TVPeiner Allgemeine ZeitungProPlantaRote FahneScharf LinksSüddeutsche.deSüdwest PresseSZ Onlinetageszeitung (1)tageszeitung (2)Themenportalturus.netWelt OnlineWeeyooWochenblattZeit Online Weitere Fotos: Umbruch Bildarchiv 2. WIR HABEN ES SATT!-Demo am 21. Januar 2012 Aufruf Bauernhöfe statt Agrarindustrie Demonstration – Kundgebung – Protesttafel Samstag, 21.01.2012 – 11:30 Uhr, Berlin Die Agrarindustrie verursacht Dioxinskandale, Gentechnik im Essen und Tierleid in Megaställen. Sie verschärft Hungerkrisen, den Klimawandel und das Höfesterben. Zurück bleiben ausgeräumte Landstriche und Monokulturen. Das haben wir satt! EU und Bundesregierung fördern diese Agrarindustrie jedes Jahr mit Milliarden Euro an Subventionen. Doch die Chance, diese Politik zu ändern, war noch nie so groß.Jetzt werden die entscheidenden Weichen für die Agrarpolitik bis 2020 gestellt. Bisher blockiert die Bundesregierung eine echte Reform. Wir fordern von Bundeskanzlerin Merkel: Subventionen an soziale, ökologische und Tierschutz-Kriterien bindenFaire Regeln durchsetzen statt Agrarmärkte liberalisierenHeimisches Futter statt Gentechnik-Soja fördernSpekulationen mit Lebensmitteln beendenExportsubventionen stoppenDer Fleischindustrie den Geldhahn abdrehen Wir schätzen die tägliche Arbeit der Menschen auf den Bauernhöfen. Sie müssen im Zentrum einer Reform stehen! Daher gehen am 21. Januar 2012 VerbraucherInnen, TierschützerInnen, UmweltschützerInnen, ImkerInnen, Bäuerinnen und Bauern gemeinsam auf die Straße. Ja zur bäuerlich-nachhaltigen Landwirtschaft. Ja zum Menschenrecht auf Nahrung. Respekt vor den Tieren in der Landwirtschaft. Frontbanner Dame Kind #carousel-backgroundimage-1183-112 { background-image: url('/fileadmin/_processed_/9/7/csm_frontbanner_dcbede0727.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1183-112 { background-image: url('/fileadmin/_processed_/9/7/csm_frontbanner_10182c1457.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1183-112 { background-image: url('/fileadmin/_processed_/9/7/csm_frontbanner_0d41b6d409.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1183-112 { background-image: url('/fileadmin/_processed_/9/7/csm_frontbanner_ec17ce6f21.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1183-112 { background-image: url('/fileadmin/_processed_/9/7/csm_frontbanner_a6e78d0b6e.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1183-112 { background-image: url('/fileadmin/_processed_/9/7/csm_frontbanner_f94b04a62a.jpg'); } } #carousel-backgroundimage-1183-113 { background-image: url('/fileadmin/_processed_/d/f/csm_dame_17c70196b6.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1183-113 { background-image: url('/fileadmin/_processed_/d/f/csm_dame_9cdd5af76a.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1183-113 { background-image: url('/fileadmin/_processed_/d/f/csm_dame_69ce4c5300.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1183-113 { background-image: url('/fileadmin/_processed_/d/f/csm_dame_c5b5afc8da.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1183-113 { background-image: url('/fileadmin/user_upload/fotos/demo12/dame.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1183-113 { background-image: url('/fileadmin/_processed_/d/f/csm_dame_8cbbd8bcf3.jpg'); } } #carousel-backgroundimage-1183-114 { background-image: url('/fileadmin/_processed_/e/0/csm_Kind_064af59dde.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1183-114 { background-image: url('/fileadmin/_processed_/e/0/csm_Kind_1d2e2bcead.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1183-114 { background-image: url('/fileadmin/user_upload/fotos/demo12/Kind.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1183-114 { background-image: url('/fileadmin/user_upload/fotos/demo12/Kind.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1183-114 { background-image: url('/fileadmin/user_upload/fotos/demo12/Kind.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1183-114 { background-image: url('/fileadmin/_processed_/e/0/csm_Kind_1de5ca4200.jpg'); } } Zurück Weiter ALLE DEMO-BILDER AUF FLICKR Gemeinsame Pressemitteilung VerbraucherInnen, Umwelt- und TierschützerInnen, ImkerInnen, entwicklungspolitische Gruppen, Bäuerinnen und Bauern fordern Bauernhöfe statt Agrarindustrie Bundesregierung soll Zukunft der Landwirtschaft sichern Berlin, 21.01.2012 | 23000 Menschen haben heute in Berlin gegen Lebensmittelskandale, Gentechnik im Essen und Tierquälerei in Megaställen und für eine bäuerliche ökologische Zukunftslandwirtschaft demonstriert. VerbraucherInnen, Umwelt- und TierschützerInnen, ImkerInnen, Bäuerinnen und Bauern sowie entwicklungspolitische Gruppen zogen unter dem Motto „Wir haben es satt! – Bauernhöfe statt Agrarindustrie“ zum Kanzleramt und verlangten von Bundeskanzlerin Merkel eine Neuausrichtung der Landwirtschaftspolitik. Die Veranstalter werfen der Bundesregierung vor, bei der Reform der EU-Agrarpolitik bislang Steigbügelhalter für die Agrarindustrie zu sein, statt die Forderungen der Zivilgesellschaft durchzusetzen. Die Agrarzahlungen müssten an ökologische, soziale und Tierschutzkriterien gekoppelt und für Großbetriebe gedeckelt werden. Sämtliche Subventionen für den Agrarexport seien zu stoppen. Zu der Demonstration hatte ein Bündnis aus über 90 Organisationen aus den Bereichen Landwirtschaft, Umwelt-, Tier-, Verbraucherschutz und Entwicklungszusammenarbeit. Die Nigerianerin, Mariann Bassey, Sprecherin von Friends of the Earth, dem internationalen Umweltnetzwerk des BUND, mahnte: „Die Politik hat schrankenlose Spekulationen auf Lebensmittel erst möglich gemacht. Gleichzeitig ist sie für den Landraub für Futtermittel und Agrosprit in den Ländern des Südens verantwortlich. Das alles treibt die Lebensmittelpreise hoch und schließt Hungernde vom Zugang zu fruchtbarem Land und zu Lebensmitteln aus. Für das Menschenrecht auf Nahrung müssen Spekulation und der Agrospritboom ausgebremst werden. Die Europäische Agrarpolitik braucht eine Kehrtwende weg von Überproduktion und Fleischexporten.“Die Köchin, Gastronomin und Buchautorin Sarah Wiener sagte: „Jüngst wurden antibiotikaresistente Keime in Hühnerfleisch gefunden - dies ist vermutlich nur die Spitze des Eisbergs. Wir haben diese ständigen Lebensmittelskandale satt. Es ist höchste Zeit, dass endlich grundlegende Konsequenzen daraus gezogen werden. Wir müssen weg von der Agrarindustrie, hin zu einer bäuerlichen und nachhaltigen Landwirtschaft."Der Jung-Bauer Moritz Schäfer von der jungen Arbeitsgemeinschaft bäuerliche Landwirtschaft (jAbL) betonte: „Unser breiter Protest gegen die Agrogentechnik wirkt: BASF musste ihre Gentech-Kartoffel in Europa aufgeben, da die gesellschaftliche und bäuerliche Akzeptanz fehlt. Es ist auch eine schallende Ohrfeige für die Bundesregierung, denn die Amflora von der BASF war die erste Kartoffel, die es in einen Koalitionsvertrag schaffte. Auch in der EU-Agrarpolitik forciert Bundeslandwirtschaftsministerin Aigner bislang die Agrarindustrie.Und das obwohl die agrarindustriellen Strukturen Klimawandel, Hungerkrisen und das Höfesterben verschärft. Die EU- Direktzahlungen müssen an Arbeitskräfte und Umweltleistungen gebunden und nach oben gekappt werden und dürfen nicht die Agrarindustrie mästen! Dann finden sie auch gesellschaftliche Akzeptanz.“Der Präsident des Deutschen Tierschutzbundes, Thomas Schröder, stellte fest:„Es geht um die Systemfrage: Lassen wir es weiter zu, Tiere in Haltungssysteme zu zwingen, die ihnen Schmerzen und Leid zufügen? Denn das ist heute der Alltag für Millionen von Tieren. In den Intensivhaltungen leiden sie direkt. Unter den Folgen leiden aber auch Umwelt, Bäuerinnen und Bauern sowie VerbraucherInnen. Daher braucht es den Schulterschluss gesellschaftlicher Gruppen. Wir kämpfen für mehr Tierwohl im Stall, gegen Gentechnik- Futtermittelimporte aus Übersee und für mehr Unterstützung der bäuerlichen, artgerechten Landwirtschaft.“ Pressespiegel Videos: ARD - 20 Uhr-TagesschauARD - TagesthemenZDF - heuteRBB - AbendschauWDR - Aktuelle Stundeh1 - tv.lokalOffizielles Demo-Video von Die FairanstalterVideo: Hühner vor dem Kanzleramt von Die FairanstalterFocus Online VideoDemo-Video von Slow FoodDemo-Video von Regionfilm Film zur Skulpt(o)ur: Skulpt(o)ur in Frankfurt - Video von Uwe KampmannSkulpt(o)ur in Kassel - Video vom BioFairVerein Funk: Deutschlandradio vom 16.1.2012Deutschlandradio vom 21.1.2012 Podcast: Greenpeace-Podcast mit Jochen Fritz (# 95 Meine Landwirtschaft) Print- und Onlinemedien: Berliner KurierBerliner MorgenpostBerliner ZeitungBioNews24.deBZCharivariderStandard.atDer Tagesspiegel (1)Der Tagesspiegel (2)Der WestenDomradioEntwicklungspolitik OnlineFair NewsFAZ BlogFinanznachrichtenFreie PresseFR OnlineJunge WeltMärkische OderzeitungNiederlausitz AktuellNordschleswiger.dkN-