["http://www.wir-haben-es-satt.de"]
title = '"Wir haben es satt!"-Demo am 18.01.2025 - Wir haben es satt!'
description = """
Das Bündnis für die Agrarwende!
Gutes Essen für alle, Bauernhöfe erhalten und Klimagerechtigkeit jetzt. ⠀
Wir haben Agrarindustrie satt! Demo 18.01. Berlin"""
