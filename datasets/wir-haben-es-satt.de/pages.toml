title = "Berlin, 13.01.2025 - Wir haben es satt!"
full_description = "Pressemitteilung 13. Januar 2025 PDF-VERSION PDF-VERSION Pressemitteilung 13. Januar 2025 Gemeinsame Pressemitteilung von “Wir haben es satt!”, AbL, Bioland, demeter, Biokreis, Solawi Netzwerk Konsequenzen nach dem Ausbruch der Maul- und Klauenseuche in Brandenburg Keine Treckerbegleitung bei Agrardemonstration in Berlin Berlin, 13. Januar 2025: Die diesjährige „Wir haben es satt!“-Agrardemonstration am 18. Januar in Berlin wird ohne die geplante Treckerbegleitung von Bäuerinnen und Bauern stattfinden. Die Verantwortlichen der Veranstaltung fassten diesen Beschluss auf Grund des aktuellen Ausbruchs der hochansteckenden Maul- und Klauenseuche auf einem Betrieb in Brandenburg. Claudia Gerster, AbL-Bundesvorsitzende und Bäuerin aus Sachsen-Anhalt, kommentiert: „Bäuerinnen und Bauern mit ihren Treckern an der Spitze der Demonstration sind für uns ein sehr wichtiger Bestandteil unseres breiten Bündnisses von 60 Organisationen und Verbänden. Die gemeinsame Demonstration mit Treckern und Demoteilnehmenden zu Fuß ist ein starkes solidarisches Zeichen für den Zusammenhalt von Landwirtschaft und Zivilgesellschaft. Doch dieses Jahr haben wir uns kurzfristig schweren Herzens gegen die Treckerbegleitung entschieden, weil wir das Risiko einer Ausweitung der Maul- und Klauenseuche in Brandenburg und über die Ländergrenzen hinaus durch eine eventuelle Übertragung durchfahrender Trecker vermeiden wollen. Es ist auch ein Zeichen der Achtung und des Respekts vor den betroffenen tierhaltenden Berufskolleginnen und Berufskollegen, die in Brandenburg und im ganzen Bundesgebiet berechtigterweise besorgt um die Gesundheit ihrer Tiere sind.“ Anne Skambraks, Leitung der Kampagne Meine Landwirtschaft, ergänzt: „Auch wenn uns dieses Mal die Trecker und Anhänger mit ihren vielfältigen politischen Botschaften sehr fehlen werden: Es gibt nicht nur für Bäuerinnen und Bauern, sondern auch für alle Bürgerinnen und Bürger gute Gründe am 18. Januar, vor der Bundestagswahl, zusammen auf die Straße zu gehen! Mit der Frage „Wer profitiert hier eigentlich?“ solidarisieren sich Stadt und Land für eine Landwirtschaft und ein Ernährungssystem, die das Wohl der Gemeinschaft im Fokus haben. Gemeinsam stehen wir für eine gesunde Lebensmittelerzeugung, für Klima-, Tier- und Umweltschutz. Wir fordern von einer neuen Bundesregierung mutige Agrarpolitik! Damit stärken wir der wertvollen Arbeit von Bäuerinnen und Bauern den Rücken. Zukunft geht nur zusammen, Zukunft braucht Höfe.“ Hinweis an die Redaktionen: Die Verantwortlichen der Demonstration stehen in ständiger Verbindung mit den Behörden, dem Veterinäramt und der Polizei, um alle Hygieneauflagen einzuhalten. Zusätzlich zu den amtlichen Maßnahmen, haben wir uns zu diesem weiteren, freiwilligen Schritt entschieden. Die Demonstration wird am Samstag, 18. Januar 2025, ohne Treckerbegleitung und ansonsten wie angekündigt stattfinden. Die geplante morgendliche Zwischenkundgebung der Bäuer*innen und Zivilgesellschaft am Samstag, 18. Januar 2025, vor dem GFFA mit Übergabe einer bäuerlichen Protestnote an Bundesagrarminister Cem Özdemir und die Parlamentarische Staatssekretärin Ophelia Nick wird in abgewandelter Form stattfinden. Wir informieren Sie rechtzeitig. Kontakt für die Presse Xenia Brand, AbL-Bundesgeschäftsführung (01525) 7579219 | brand[at]abl-ev[dot]de Anne Skambraks, Kampagnenleitung des „Wir haben es satt!“-Bündnis (0163) 1846765 | skambraks[at]meine-landwirtschaft[dot]de Nicola Puell Presse- und Öffentlichkeitsarbeit Mobil: (0151) 51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Presseseite: www.wir-haben-es-satt.de/presse Pressemitteilung 13. Januar 2025 PDF-VERSION PDF-VERSION"
