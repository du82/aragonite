t der Ankündigungen ist vorbei. Wir messen Agrarministerin Klöckner daran, was bei ihrer Politik unter dem Strich für Bauern-höfe, Tiere und das Klima herauskommt. Bislang ist diese Ministerin in dieser Hinsicht eine Nullnummer!“, so Richartz. „Wir fordern, dass die Bundesregierung 2020 bei der EU-Agrar-reform Nägel mit Köpfen macht. Jetzt heißt es für Julia Klöckner: Ärmel hochkrempeln und die Agrarwende anpacken!“ Der Bundesregierung kommt während ihrer EU-Ratspräsidentschaft in der zweiten Jahres-hälfte eine zentrale Rolle bei der Gestaltung der Gemeinsamen EU-Agrarpolitik (GAP) zu. Mit den rund 60 Milliarden an Fördergeldern pro Jahr sind zukunftsfähige Landwirtschaft und gutes Essen auf den Tellern europaweit möglich. Elisabeth Fresen, 29-jährige Bäuerin mit einem 160-Hektar-Betrieb und 100 Mutterkühen aus Verden/Aller, sagt: „Wir Bäuerinnen und Bauern jammern nicht, wir packen an. Viele Be-triebe sind der Politik in Sachen Tier- und Klimaschutz schon große Schritte voraus. Wenn Landwirtschaft und Ge"
