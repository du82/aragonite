["https://wir-haben-es-satt.de/informieren/aufruf"]
title = '"Wir haben es satt!"-Demo am 18.01.2025 - Wir haben es satt!'
description = """
Das Bündnis für die Agrarwende!
Gutes Essen für alle, Bauernhöfe erhalten und Klimagerechtigkeit jetzt. ⠀
Wir haben Agrarindustrie satt! Demo 18.01. Berlin"""
full_description = 'CALL TO ACTION (EN) Eylemine Çağrı (TR) Nein zu Rassismus, Hass und Rechtsextremismus Wir haben Nazis, Rassist*innen und rechtsextreme Hetze satt! Uns eint der gewaltfreie Protest gegen die Agrarindustrie. Hass und Menschenfeindlichkeit jeglicher Art haben bei uns keinen Platz – dazu gehört auch die Diffamierung von Bäuerinnen und Bauern. Die Stärken unseres Bündnisses sind Toleranz, Solidarität, Vielfalt und Internationalität – Geflüchtete sind willkommen! FÜR DIE DEMO SPENDEN Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Wer profitiert hier eigentlich? Wer profitiert eigentlich von Klimakrise, Artensterben und dem Verlust fruchtbarer Böden? Wer hat ein Interesse an billigen Agrarrohstoffen, am Höfesterben und an der Spaltung von Landwirtschaft und Gesellschaft? Wer verdient an globaler Ungerechtigkeit, Ernährungsarmut, Patenten und Hunger? Wer gewinnt, wenn Ackerland von Investoren vereinnahmt und zum Spekulationsobjekt wird? Wer profitiert von politischer Instabilität und Existenzängsten? Unsere Zukunft steht zur Wahl! Zu viele Politiker*innen in Berlin und Brüssel stellen seit Jahrzehnten Konzerninteressen vor das Gemeinwohl und fördern mit unseren Steuergeldern ein schädliches Ernährungssystem. Agrarkonzerne wie Bayer-Monsanto, Tönnies und Cargill, fahren horrende Profite ein. Sie verschleiern dies mit dem falschen Versprechen, vermeintlich einfach und billig die wachsende Weltbevölkerung zu ernähren. Ihre Lobbyverbände verlangen unter dem Deckmantel des Bürokratieabbaus einen desaströsen Verzicht auf Klima-, Tier- und Umweltschutz – statt wirtschaftlicher Perspektiven für die Betriebe, wie Bäuerinnen und Bauern sie schon lange fordern. Die weltweiten Folgen: Global sind 733 Millionen von Hunger betroffen, das sind 150 Millionen mehr als vor der Corona-Pandemie. Jeder dritte Mensch auf der Welt kann sich keine ausgewogene Ernährung leisten. Allein in Deutschland mussten mehr als 350.000 Höfe in den letzten 30 Jahren schließen – damit hat sich die Anzahl der Betriebe um fast 60 Prozent verringert. 60 Prozent der Böden in Europa sind geschädigt – Hauptverursacher sind die Agrarindustrie und die von ihr befeuerte Klimakrise. Über 60 Prozent der Tier- und Pflanzenarten des Offenlandes stehen auf den Roten Listen der bedrohten Arten. Insbesondere Ackerlandschaften sind vom Artensterben betroffen. Das haben wir satt! Sozial-gerechte Agrarwende in den Koalitionsvertrag! Das agrarindustrielle System wälzt seine wahren Kosten auf die Gesellschaft ab. Eine bäuerliche, agrarökologische Landwirtschaft ist der gemeinwohlorientierte Gegenentwurf. Sie ist die Grundlage für ein umweltverträgliches, gerechtes und krisenfestes Ernährungssystem, das uns alle und zukünftige Generationen sicher mit gesunden Lebensmitteln versorgen kann – ohne Tieren, Umwelt und Klima zu schaden. Wir fordern von der kommenden Bundesregierung und der EU: Sichern Sie unsere Existenzgrundlagen, den sozialen Zusammenhalt und ein gutes Leben für Mensch und Tier, in Stadt und Land, in Deutschland und der ganzen Welt! Die Agrarwende braucht endlich politischen Mut, verbindliche Gesetze, kostendeckende Erzeuger*innenpreise und eine sichere Finanzierung! In der nächsten Legislaturperiode müssen Agrarwende und zukunftsfähige Neuausrichtung der Europäischen Gemeinsamen Agrarpolitik oberste Priorität haben. Wir können gewinnen, wenn wir alle zusammenhalten! Stadt und Land, bio und konventionell, Tierhalter*in und Veganer*in, jung und alt – wir lassen uns nicht spalten! Solidarisiert euch, kommt zur Demo! Samstag, 18.1.25 | 12 Uhr | Bundeskanzleramt| Berlin Unsere Positionen und Forderungen Gutes Essen für alle Nur 5 Unternehmen kontrollieren bis zu 90 Prozent des weltweiten Getreidehandels. WIR FORDERN… Zugang zu Land Aldi, Deutsche Wohnen & die Münchener Rück besitzen bereits Tausende Hektar Ackerland. WIR FORDERN… Klimaschutz Das aktuelle Ernährungssystem ist weltweit für mehr als ein Drittel der globalen Treibhausemissionen verantwortlich. WIR FORDERN… Weniger Tiere, mehr Tierwohl, viele Höfe Fleischkonzerne wie Wiesenhof, Tönnies oder Westfleisch machen Milliarden Umsätze mit Billigfleisch. WIR FORDERN… Gerechter Handel und faire Preise Weltweit sind bäuerliche Betriebe in ihrer Existenz bedroht, weil Mechanismen für langfristige und stabile Erzeuger*innenpreise fehlen. WIR FORDERN… Starke Höfe und lebendige Regionen Allein 2023 mussten in Deutschland rund 3.000 Höfe aufgeben. WIR FORDERN… Mehr Artenvielfalt, weniger Pestizide Der Rückgang der Fluginsekten um 76 Prozent in 27 Jahren in Deutschland ist mehr als dramatisch. WIR FORDERN… Gentechnikfreiheit sichern, Patente stoppen Gentechnik-Konzerne wie Bayer & BASF sichern sich ihre Vormachtstellung im Saatgutmarkt mit gentechnisch verändertem Saatgut & Patenten. WIR FORDERN… Ökolandbau Tatsächlich nachhaltige Bio-Lebensmittel müssen mit billiger Industrieware im grünen Anstrich konkurrieren. WIR FORDERN… Das "Wir haben es satt!"-Bündnis Wir sind Bäuerinnen und Bauern, von konventionell bis bio, von Tierhaltung bis Ackerbau. Wir sind Gärtner*innen, Imker*innen und Lebensmittelhandwerker*innen. Wir sind Aktivist*innen aus Klimaschutzbewegung, Natur-, Umwelt- und Tierschutz, Aktive der Humanitären - und Entwicklungszusammenarbeit und Sozialverbände, engagierte Jugendliche und kritische Menschen aus Stadt und Land. Landwirtschaft Umwelt und Klima Ernährung Tierschutz Entwicklung und Soziales Agrar Koordination | Aktion Agrar | Aktionsbündnis gentechnikfreie Landwirtschaft | Arbeitsgemeinschaft bäuerliche Landwirtschaft | Biokreis | Bioland | Coordination gegen BAYER-Gefahren | De Immen | Demeter | Deutscher Berufs- und Erwerbsimkerbund | Fördergemeinschaft Ökologischer Landbau | Gen-ethisches Netzwerk | IG Nachbau | junge Arbeitsgemeinschaft bäuerliche Landwirtschaft | Junges Bioland | Kulturland Genossenschaft | Netzwerk Solidarische Landwirtschaft | Neuer Imkerbund | Projekt Gentechnikfreie Regionen und Kommunen | Save Our Seeds | Weltacker Berlin | WWOOF | Zukunftsstiftung Landwirtschaft Aurelia Stiftung | BUND | BUNDjugend | Deutsche Umwelthilfe | Deutscher Naturschutzring | Forum Umwelt & Entwicklung | Fridays for Future | Greenpeace | NAJU | NaturFreunde | GRÜNE LIGA | Pestizid Aktions-Netzwerk | Stadtbienen | Umweltinstitut München Die Freien Bäcker | foodsharing | Slow Food Deutschland | Slow Food Youth Deutschland Bund gegen Missbrauch der Tiere | PROVIEH | VIER PFOTEN Aktion 3. Welt Saar | Aktion gegen den Hunger | Arbeitslosenselbsthilfe Oldenburg | Brot für die Welt | Campact | Christliche Initiative Romero | INKOTA | Misereor | Oxfam | Yeşil Çember Trägerkreis und Unterstützer*innen CALL TO ACTION (EN) Eylemine Çağrı (TR) Nein zu Rassismus, Hass und Rechtsextremismus Wir haben Nazis, Rassist*innen und rechtsextreme Hetze satt! Uns eint der gewaltfreie Protest gegen die Agrarindustrie. Hass und Menschenfeindlichkeit jeglicher Art haben bei uns keinen Platz – dazu gehört auch die Diffamierung von Bäuerinnen und Bauern. Die Stärken unseres Bündnisses sind Toleranz, Solidarität, Vielfalt und Internationalität – Geflüchtete sind willkommen! FÜR DIE DEMO SPENDEN'
