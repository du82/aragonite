["https://wir-haben-es-satt.de/informieren/rueckblick/demo-2016"]
title = "Demo 2016 - Wir haben es satt!"
full_description = "YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Fernsehen/Videos ARD Tagesschau (ab Min. 09:58)ARD Tagesthemen (ab Min. 11:40)ZDF HeuteBR - Unser Land (ab Min. 4:41)NDRn-tvN24 Print- und Onlinemedien topAgrar.comSpiegel OnlineNeues Deutschland (1)Neues Deutschland (2)Berliner Kuriertaz - die Tageszeitung (1)taz - die Tageszeitung (2)TagesspiegelJunge WeltBerliner WocheB.Z. BerlinBauernzeitung.deDie BiokücheGerman Daily NewsKlimaretter.infoGreenpeace MagazinNordwest-ZeitungVolksstimme Sachsen-AnhaltLokalkompass.deWelt.deFocus.deWochenblatt.deBerliner ZeitungObermain TagblattPotsdamer Neueste Nachrichtentagesschau.deGeneral Anzeiger OnlineRBB online Internationale Medien RTBF.de (französisch)Der Standard.at (deutsch)Tiroler Tageszeitung Online (deutsch) 6. Wir haben es satt!-Demo am 16. Januar 2016 Aufruf Keine Zukunft ohne Bäuerinnen & Bauern +++ Seit 1975 sank die Zahl der Bauernhöfe in Deutschland von über 1 Million auf 285.000 Betriebe +++ Das weltweit am meisten genutzte Pestizid, Glyphosat von Monsanto, wird von der Weltgesundheitsorganisation als „wahrscheinlich krebserregend“ eingestuft +++ Der Export von Milchpulver und Fleisch zu Dumpingpreisen zerstört lokale Märkte im globalen Süden +++ Die extrem niedrigen Milch- und Schweinefleischpreise beschleunigen das Höfesterben +++ Freihandelsabkommen wie TTIP und CETA gefährden die bäuerliche Landwirtschaft +++ Agrarfabriken mit 57.000 Schweinen, 2.000 Kühen oder 450.000 Hühnern wurden in Deutschland genehmigt +++ Landraub durch Großinvestoren entzieht Bäuerinnen und Bauern die Lebensgrundlage +++ Konzerne wollen neues Gentechnik-Saatgut auf unsere Felder bringen +++ Rund 70 % des Fleisches werden hierzulande als Sonderangebot in Discountern zu Billigpreisen vertrieben +++ Die Landwirtschaft steht am Scheideweg: Wird unser Essen zukünftig noch von Bäuerinnen und Bauern für den Bedarf einer Region erzeugt oder von Konzernen, die für den Weltmarkt produzieren? Bundesregierung und Agrarindustrie setzen auf steigende Exporte, vor allem von Milch und Fleisch, zu Dumpingpreisen. Dafür sollen unsere Land- und Lebensmittelwirtschaft für den Weltmarkt getrimmt werden – immer mehr und immer billiger. Dies senkt Tierschutzstandards und ruiniert Bäuer­innen und Bauern bei uns und auf der ganzen Welt. Die Folgen für die Menschen in den Ländern des Südens: Hunger und Armut. Wir fordern einen anderen Weg: Gesunde und ökologische Lebensmittel sollen für den vorwiegend regionalen Markt von Bäuerinnen und Bauern erzeugt und vom Lebensmittelhandwerk weiterverarbeitet werden – zu fairen Preisen und Marktbedingungen in Europa und weltweit. Wir stehen für Ernährungssouveränität und fordern einen internationalen Handel, der sich an den Bedürfnissen der Menschen und nicht an den Interessen der Konzerne orientiert. Wir wollen ein Landwirtschafts- und Ernährungssystem, das niemanden zur Landflucht zwingt. Wir setzen auf bewährte Alternativen, bei denen Menschen, Tiere und Umwelt geachtet werden und Bauernhöfe eine Zukunft haben. Wir wertschätzen die Erzeugung guter Lebensmittel und artgerechte Tierhaltung durch Bäuerinnen und Bauern. Wir lassen weder zu, dass sie verunglimpft werden, noch, dass sie für die Ziele der Agrarindustrie vereinnahmt werden! 2016 muss die Agrar- und Ernährungswende eingeläutet werden: Wir appellieren an EU-Agrarkommissar Phil Hogan, Bundeskanzlerin Angela Merkel, Bundeswirtschaftsminister Sigmar Gabriel und Bundeslandwirtschaftsminister Christian Schmidt: Beenden Sie die Förderung von Agrarkonzernen! Treten Sie für eine Qualitätsoffensive ein, anstatt einseitig auf Export zu setzen! Sorgen Sie für einen gerechten Handel weltweit – stoppen Sie TTIP und CETA! Gemeinsam rufen wir – Bäuerinnen und Bauern, Verarbeiterinnen und Verarbeiter, Verbraucherinnen und Verbraucher – dazu auf, am 16. Januar 2016 in Berlin ein starkes Zeichen zu setzen. Wir sind Menschen vom Land und aus der Stadt, aus Nord und Süd. Wir haben Agrarindustrie satt – wir wollen eine gesellschaftlich akzeptierte bäuerliche und ökologischere Land- und Lebensmittelwirtschaft. Reichstag Tierfabrik Frontbanner Traktor #carousel-backgroundimage-342-33 { background-image: url('/fileadmin/_processed_/d/1/csm_Reichstag_16_8a919b0377.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-342-33 { background-image: url('/fileadmin/_processed_/d/1/csm_Reichstag_16_602c00b514.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-342-33 { background-image: url('/fileadmin/_processed_/d/1/csm_Reichstag_16_0c0595439c.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-342-33 { background-image: url('/fileadmin/user_upload/fotos/demo16/Reichstag_16.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-342-33 { background-image: url('/fileadmin/user_upload/fotos/demo16/Reichstag_16.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-342-33 { background-image: url('/fileadmin/_processed_/d/1/csm_Reichstag_16_6cff1c1daf.jpg'); } } #carousel-backgroundimage-342-34 { background-image: url('/fileadmin/_processed_/2/8/csm_Tierfabrik_16_1342037ee9.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-342-34 { background-image: url('/fileadmin/_processed_/2/8/csm_Tierfabrik_16_7036b68b63.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-342-34 { background-image: url('/fileadmin/_processed_/2/8/csm_Tierfabrik_16_c37d6755bd.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-342-34 { background-image: url('/fileadmin/user_upload/fotos/demo16/Tierfabrik_16.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-342-34 { background-image: url('/fileadmin/user_upload/fotos/demo16/Tierfabrik_16.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-342-34 { background-image: url('/fileadmin/_processed_/2/8/csm_Tierfabrik_16_353479b13b.jpg'); } } #carousel-backgroundimage-342-35 { background-image: url('/fileadmin/_processed_/9/1/csm_Frontbanner_629c44e88b.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-342-35 { background-image: url('/fileadmin/_processed_/9/1/csm_Frontbanner_5400d659a5.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-342-35 { background-image: url('/fileadmin/_processed_/9/1/csm_Frontbanner_ec12ad4b89.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-342-35 { background-image: url('/fileadmin/_processed_/9/1/csm_Frontbanner_392ea3f33f.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-342-35 { background-image: url('/fileadmin/_processed_/9/1/csm_Frontbanner_ace9db43f5.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-342-35 { background-image: url('/fileadmin/_processed_/9/1/csm_Frontbanner_c20ce1b03f.jpg'); } } #carousel-backgroundimage-342-36 { background-image: url('/fileadmin/_processed_/a/4/csm_Bauern_im_Widerstand_16_9345562033.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-342-36 { background-image: url('/fileadmin/_processed_/a/4/csm_Bauern_im_Widerstand_16_b081f6a6ca.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-342-36 { background-image: url('/fileadmin/_processed_/a/4/csm_Bauern_im_Widerstand_16_b6ae158ee4.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-342-36 { background-image: url('/fileadmin/user_upload/fotos/demo16/Bauern_im_Widerstand_16.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-342-36 { background-image: url('/fileadmin/user_upload/fotos/demo16/Bauern_im_Widerstand_16.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-342-36 { background-image: url('/fileadmin/_processed_/a/4/csm_Bauern_im_Widerstand_16_4e1f2149ea.jpg'); } } Zurück Weiter ALLE DEMO-BILDER AUF FLICKR Pressemitteilung Schulterschluss von Bauern und Verbrauchern: Starkes Signal gegen Agrarindustrie 23 000 Menschen demonstrieren in Berlin für bäuerliche Zukunftslandwirtschaft Trotz eisiger Temperaturen und angeführt von 130 Traktoren – so viele wie nie zuvor – haben heute 23 000 Bauern und Verbraucher gemeinsam in Berlin für eine Agrarwende demonstriert. Unter dem Motto „Wir haben Agrarindustrie satt! Keine Zukunft ohne Bäuerinnen und Bauern“ zogen sie zum Bundeskanzleramt und forderten von der Bundesregierung die Weichen für eine bäuerliche und ökologischere Zukunftslandwirtschaft zu stellen. Bauern, Imker, Tier- und Naturschützer, Aktive in der Entwicklungszusammenarbeit, Lebensmittelhandwerker und Köche demonstrierten für Bauernhöfe, die umwelt- und klimafreundlich wirtschaften, damit das Recht auf Nahrung weltweit sichern, starke Strukturen im ländlichen Raum erhalten, artgerechte Tierhaltung verwirklichen, gentechnikfrei arbeiten und deren Grundsatz fairer Handel ist. „Angesichts der katastrophalen und strukturzerstörenden Erzeugerpreise für Milch und Schweinefleisch ermutigen dieser starke Rückhalt und die Wertschätzung der Gesellschaft, den Kampf für den Erhalt unserer Höfe energisch zu führen“, so Ottmar Ilchmann, Milchbauer aus Ostfriesland. „Die Agrarpolitik in Berlin und Brüssel ist verantwortlich für die Rahmenbedingungen, die zu Überproduktion und Erzeugerpreisen deutlich unter den Produktionskosten führen. Dabei zerstören Agrarexporte zu Dumpingpreisen für den Weltmarkt bäuerliche Strukturen und regionale Märkte für Bauern hier und in der ganzen Welt. Die Bundesregierung muss jetzt umsteuern, damit es sich für Bauern lohnt, gute Lebensmittel für den heimischen Markt zu produzieren.“ Der lange Trecker-Konvoi wurde von der Menge auf dem Potsdamer Platz jubelnd empfangen. „Die Bauern stehen in der Mitte der Gesellschaft“, kommentierte Jochen Fritz, Landwirt und Sprecher der Demonstrations-Bündnisses „Wir haben es satt!“ den gemeinsamen Protest. „Die Menschen wollen, dass Bauern und nicht Konzerne ihr Essen erzeugen, sie wollen gesundes Essen, keine Gentechnik auf dem Acker, im Trog und auf dem Teller, sie wollen, dass Tiere auf der Weide grasen können, Schweine auf Stroh stehen und keine Schwänze oder Schnäbel abgeschnitten werden. Und die Bauern sind bereit dafür! Worauf wartet die Bundesregierung?“, so Fritz weiter. Auch Sarah Wiener, Köchin aus Berlin, forderte einen Umbau des Ernährungssystems: „Wir wollen den Wandel mit Fairness und Genuss! Gute, köstliche Lebensmittel bekommen wir nur, wenn wir achtsam mit unserer Umwelt, den Pflanzen und Tieren umgehen. Wenn wir verstehen, dass wir mit der Natur arbeiten müssen und nicht gegen sie, werden wir die Wertschätzung für das, was uns ernährt wieder erlangen. Davon profitieren die Bauern, die Böden und die Nutztiere.“ Pressespiegel Fernsehen/Videos ARD Tagesschau (ab Min. 09:58)ARD Tagesthemen (ab Min. 11:40)ZDF HeuteBR - Unser Land (ab Min. 4:41)NDRn-tvN24 Print- und Onlinemedien topAgrar.comSpiegel OnlineNeues Deutschland (1)Neues Deutschland (2)Berliner Kuriertaz - die Tageszeitung (1)taz - die Tageszeitung (2)TagesspiegelJunge WeltBerliner WocheB.Z. BerlinBauernzeitung.deDie BiokücheGerman Daily NewsKlimaretter.infoGreenpeace MagazinNordwest-ZeitungVolksstimme Sachsen-AnhaltLokalkompass.deWelt.deFocus.deWochenblatt.deBerliner ZeitungObermain TagblattPotsdamer Neueste Nachrichtentagesschau.deGeneral Anzeiger OnlineRBB online Internationale Medien RTBF.de (französisch)Der Standard.at (deutsch)Tiroler Tageszeitung Online (deutsch)"
