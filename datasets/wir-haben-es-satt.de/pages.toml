["https://wir-haben-es-satt.de/informieren/rueckblick/demo-2023"]
title = "Demo 2023 - Wir haben es satt!"
full_description = "YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Fernsehen und Videoberichte Tagesschau24 Tagesschau24 in 100 Sekunden Euronews AFP Reuters ZDF heute Journal rbb24 Abendschau WELT MDR Aktuell 13. Wir haben es satt!-Demo am 21. Januar 2023 Aufruf Gutes Essen für alle – statt Profite für wenige! Zusammenstehen für eine bäuerliche und ökologischere Landwirtschaft, für Klima-, Tier- und Umweltschutz, für globale Gerechtigkeit und gesundes Essen für alle Viel zu wenig Regen, trockene Böden und schlechte Ernten – die Klimakrise wird auch bei uns immer bedrohlicher. Die Wachstumslogik und politische Fehlentscheidungen sind verantwortlich für das Überhitzen des Planeten und das dramatische Artensterben. Viele Höfe müssen dichtmachen, während weiter große Tierfabriken genehmigt werden. Weltweit wächst der Hunger und auch hierzulande wissen viele Menschen nicht mehr, wie sie ihren Kühlschrank füllen sollen. Wir kämpfen für die sozial-ökologische Transformation. Sie ist die Antwort auf die vielfältigen Krisen. Klar ist: Ohne Agrar- und Ernährungswende verfehlen wir krachend das 1,5-Grad-Ziel und damit globale Klimagerechtigkeit. Alle Menschen müssen sich gesunde Lebensmittel leisten können. Bauernhöfe, Bäckereien und das Lebensmittelhandwerk brauchen faire Preise. Wir haben Konzerne satt, die mit dem Hunger in der Welt ihr Geschäft machen! Investmentfonds verdienen an der Spekulation mit steigenden Nahrungsmittelpreisen. Agrar-, Lebensmittel- und Düngerkonzerne wie Cargill, Unilever oder Yara vermelden in der Krise horrende Profite. Supermarktketten mit massiver Marktmacht drehen an den Preisschrauben. Konzerne wie Bayer wollen Agro-Gentechnik auf unsere Äcker und Teller bringen. Das alles haben wir satt! Essen ist politisch – für eine gerechte Agrar- und Sozialpolitik! Wir schätzen die Arbeit aller, die uns mit gesunden und hochwertigen Lebensmitteln versorgen. Gerade in Krisenzeiten sind wir solidarisch und kämpfen für eine gerechte Gesellschaft: mit vielen Bauernhöfen, die ländliche Räume lebendig halten. Mit einer flächengebundenen, artgerechten Haltung von weniger Tieren. Mit fairen, regionalen Versorgungsketten und mehr pflanzlicher Ernährung. Mit gesundem Essen, einer gerechten Verteilung des Wohlstands und einem guten Leben ohne Krieg und Ausgrenzung für alle Menschen weltweit. Es gibt genug Nahrung, doch sie wird ungerecht verteilt oder verschwendet. Viel zu viel Essen landet als Futter im Trog, Agrosprit im Tank oder Abfall im Müll. Künftig muss gelten: Teller statt Trog und Tank – Lebensmittelverschwendung stoppen! So schützen wir das Klima und alle werden satt. Für die sozial gerechte Agrar- und Ernährungswende gehen wir im Januar mit Tausenden – pandemiegerecht und entschlossen – auf die Straße. Zu wenig, zu langsam – das ist die Bilanz von einem Jahr Ampel-Koalition. Agrarminister Özdemir muss den Umbau der Landwirtschaft beschleunigen und Finanzminister Lindner die notwendigen Mittel freigeben. Bäuer*innen und Gesellschaft wollen den Umbau, aber Klima-, Tier- und Naturschutz müssen sich für die Höfe lohnen. Der russische Angriffskrieg darf nicht gegen eine nachhaltige Landwirtschaft ausgespielt werden. Dafür erhöhen wir zum Auftakt der weltgrößten Agrarmesse „Grüne Woche“ im Berliner Regierungsviertel den Druck. Wir haben die Krisenprofite satt – für eine globale Agrarwende und gutes Essen für alle! Wir fordern die sozial-ökologische Transformation: Höfesterben stoppen faire Erzeuger*innenpreise durchsetzen und Bauernhöfe beim klima- und artgerechten Umbau unterstützen! Krisengewinne besteuern Übergewinnsteuer auch für Agrar- und Lebensmittelkonzerne und viel mehr Unterstützung für Menschen mit wenig Geld! Klimakrise und Artensterben bekämpfen durch Mehrwertsteuersenkung mehr Pflanzliches auf die Teller bringen und pestizidfreie Lebensräume für Insekten sichern! Bäuerliche Tierhaltung erhalten mit weniger Tieren, die dafür artgerecht gehalten werden! Hunger beenden und Agro-Gentechnik stoppen Spekulationsverbot für Lebensmittel, gerechter Handel und gutes, gentechnikfreies Essen für alle! FOTOS DEMO FOTOS TRAKTOR-DEMO FOTO BÄUER*INNENPROTEST Demo Frontbanner Boden-Banner Traktoren gegen Pestizide Özdemir mit Saatgutschale Traktor-Demo #carousel-backgroundimage-7108-1170 { background-image: url('/fileadmin/_processed_/2/2/csm_demo_trecker_f705fb49b1.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7108-1170 { background-image: url('/fileadmin/_processed_/2/2/csm_demo_trecker_1be4290a5b.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7108-1170 { background-image: url('/fileadmin/_processed_/2/2/csm_demo_trecker_905db3d4eb.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7108-1170 { background-image: url('/fileadmin/user_upload/fotos/whes23/demo_trecker.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7108-1170 { background-image: url('/fileadmin/user_upload/fotos/whes23/demo_trecker.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7108-1170 { background-image: url('/fileadmin/user_upload/fotos/whes23/demo_trecker.jpg'); } } #carousel-backgroundimage-7108-1171 { background-image: url('/fileadmin/_processed_/3/c/csm_frontbanner_b1b488c5b2.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7108-1171 { background-image: url('/fileadmin/_processed_/3/c/csm_frontbanner_af2056a18b.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7108-1171 { background-image: url('/fileadmin/_processed_/3/c/csm_frontbanner_4145a68e7a.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7108-1171 { background-image: url('/fileadmin/user_upload/fotos/whes23/frontbanner.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7108-1171 { background-image: url('/fileadmin/user_upload/fotos/whes23/frontbanner.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7108-1171 { background-image: url('/fileadmin/user_upload/fotos/whes23/frontbanner.jpg'); } } #carousel-backgroundimage-7108-1172 { background-image: url('/fileadmin/_processed_/6/0/csm_bodendenendiedraufackern_a710f6734e.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7108-1172 { background-image: url('/fileadmin/_processed_/6/0/csm_bodendenendiedraufackern_2b07f586ea.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7108-1172 { background-image: url('/fileadmin/_processed_/6/0/csm_bodendenendiedraufackern_6c79f498e0.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7108-1172 { background-image: url('/fileadmin/user_upload/fotos/whes23/bodendenendiedraufackern.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7108-1172 { background-image: url('/fileadmin/user_upload/fotos/whes23/bodendenendiedraufackern.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7108-1172 { background-image: url('/fileadmin/user_upload/fotos/whes23/bodendenendiedraufackern.jpg'); } } #carousel-backgroundimage-7108-1173 { background-image: url('/fileadmin/_processed_/6/8/csm_giftistkacke_c273aa4677.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7108-1173 { background-image: url('/fileadmin/_processed_/6/8/csm_giftistkacke_d0e6e57445.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7108-1173 { background-image: url('/fileadmin/_processed_/6/8/csm_giftistkacke_735749d654.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7108-1173 { background-image: url('/fileadmin/user_upload/fotos/whes23/giftistkacke.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7108-1173 { background-image: url('/fileadmin/user_upload/fotos/whes23/giftistkacke.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7108-1173 { background-image: url('/fileadmin/user_upload/fotos/whes23/giftistkacke.jpg'); } } #carousel-backgroundimage-7108-1174 { background-image: url('/fileadmin/_processed_/5/d/csm_oezdemir_47a1e390ae.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7108-1174 { background-image: url('/fileadmin/_processed_/5/d/csm_oezdemir_8cbe10702d.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7108-1174 { background-image: url('/fileadmin/_processed_/5/d/csm_oezdemir_52e73ee0df.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7108-1174 { background-image: url('/fileadmin/user_upload/fotos/whes23/oezdemir.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7108-1174 { background-image: url('/fileadmin/user_upload/fotos/whes23/oezdemir.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7108-1174 { background-image: url('/fileadmin/user_upload/fotos/whes23/oezdemir.jpg'); } } #carousel-backgroundimage-7108-1175 { background-image: url('/fileadmin/_processed_/8/c/csm_trecker_fe2b2baf59.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7108-1175 { background-image: url('/fileadmin/_processed_/8/c/csm_trecker_a32ffd70d0.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7108-1175 { background-image: url('/fileadmin/_processed_/8/c/csm_trecker_ee6e93c72e.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7108-1175 { background-image: url('/fileadmin/user_upload/fotos/whes23/trecker.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7108-1175 { background-image: url('/fileadmin/user_upload/fotos/whes23/trecker.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7108-1175 { background-image: url('/fileadmin/user_upload/fotos/whes23/trecker.jpg'); } } Zurück Weiter Pressemitteilung „Wir haben es satt!“-Demo: 10.000 fordern sozial gerechte Agrarwende und gutes Essen für alle Breites Bündnis aus Landwirtschaft und Gesellschaft fordert Umverteilung, damit Agrarwende und gutes Essen für alle klappen Berlin, 21.01.23. Bauernhöfe unterstützen, Insektensterben und Klimakrise stoppen, artgerechte Tierhaltung statt Megaställe und gutes Essen für alle – das fordern 10.000 Menschen bei eisigen Temperaturen zum Auftakt der „Grünen Woche“ bei der „Wir haben es satt!“-Demonstration in Berlin. „Wir erwarten deutlich mehr von Agrarminister Özdemir und der Bundesregierung, das war zu wenig ambitioniert, zu mutlos und zu langsam“, sagt Bündnis-Sprecherin Inka Lange mit Blick auf ein Jahr Agrar- und Ernährungspolitik der Ampel-Koalition. „Olaf Scholz‘ selbsternannte Fortschrittskoalition blockiert die Agrarwende. Das Höfesterben geht weiter, das 1,5-Grad-Ziel wurde beerdigt und trotz enormen Reichtums können sich bei uns viele Menschen keine gesunden, umweltgerecht hergestellten Lebensmittel leisten.“ Die Lage ist ernst: Jeden Tag schließen hierzulande im Schnitt zehn landwirtschaftliche Betriebe und für Konzerninteressen wird in Lützerath die Klimakrise weiter angeheizt. Weltweit hungert mittlerweile jeder zehnte Mensch, während 95 Energie- und Lebensmittelkonzerne ihre Gewinne im letzten Jahr mehr als verdoppelt haben. Nach einem Jahr im Amt ist die Schonzeit für Minister Özdemir vorbei. Die Menschen verlangen mehr Tempo beim sozial gerechten Umbau der Landwirtschaft. Als Ernährungsminister muss Özdemir dafür sorgen, dass auch Menschen mit wenig Geld Zugang zu guten Lebensmitteln haben. „2023 muss die Regierung die sozial gerechte Agrar- und Ernährungswende voranbringen. Denn eine gute Zukunft geht nur sozial und ökologisch”, so Lange. „Konkret fordern wir: eine Übergewinnsteuer auch für Agrar- und Lebensmittelkonzerne, die Mehrwertsteuer bei Obst und Gemüse auf Null senken, viel mehr Unterstützung für Menschen mit wenig Geld, eine Vermögensabgabe für Superreiche sowie gerechte und klimaschonende Agrarsubventionen.“ Artgerechte Tierhaltung, mehr Insekten- und Klimaschutz auf den Höfen, die notwendige Erhöhung des Bürgergeld-Regelsatzes um mindestens 250 Euro – das alles kostet und dafür muss Finanzminister Lindner die Mittel freigeben. Das Geld ist da. Es konzentriert sich aller­dings in den Händen weniger Milliardär*innen. 81 Prozent der Vermögensgewinne aus den Jahren 2020 und 2021 gingen auf das Konto des obersten Prozents in Deutschland. Konzerne dürfen nicht länger von Krisen profitieren, dafür brauchen wir gerechte Steuern. Die Demonst­ration steht unter dem Titel: „Wir haben Krisenprofite satt! Gutes Essen für alle – statt Profite für wenige“. Karen Stubbemann, Bäuerin aus Niedersachsen, die mit dem Trecker angereist ist, sagt: „Wir Bäuerinnen und Bauern ziehen mit der Gesellschaft an einem Strang, aber die Politik muss endlich planbare Rahmenbedingungen für den Umbau der Landwirtschaft vorgeben. Wir brauchen wirtschaftliche Perspektiven, die eine klima- und umweltschonende Bewirtschaf­tung und den Umbau der Tierhaltung ermöglichen. Die Agrarsubventionen müssen gerecht verteilt und an ökologische und tiergerechte Kriterien gebunden werden. Und wir brauchen ein klares Bekenntnis gegen Gentechnik auf Acker und Teller.“ Schon am Vormittag übergaben die Bäuerinnen und Bauern, die mit ihren Traktoren nach Berlin gekommen waren, eine Protestnote an Özdemir und die rund 80 versammelten Agrar­minister*innen der Welt. Zudem fand der „6-Punkte-Plan für gutes Essen für alle“ seinen Adressaten im Agrarminister. Über 100 Organisationen – von Landwirtschaft über Umwelt- und Sozialverbänden bis zu Gewerkschaften und Erwerbslosen-Initiativen – fordern von der Bundesregierung höhere Sozialleistungen, faire Erzeuger*innenpreise und gute Löhne. Aufgerufen von 60 Organisationen gehen bei der „Wir haben es satt!“-Großdemonstration seit 2011 viele Tausende gegen die Agrarindustrie und für eine zukunftsfähige Landwirtschaft auf die Straße. Konventionelle und Öko-Bäuer*innen demonstrieren im Schulterschluss mit der Gesellschaft gegen die fatalen Auswirkungen der industriellen Landwirtschaft. Gemeinsam zeigt das Bündnis Wege für eine bäuerliche Landwirtschaft auf, die auf breite Zustimmung in der Bevölkerung treffen und den Bauernhöfen wirtschaftliche Perspektiven bieten. Fotos zur kostenfreien Verwendung ab ca. 14.30 Uhr hier herunterladen. Pressekontakt:Christian Rollmann„Wir haben es satt!“-PressesprecherTel.: 030-28482438Mobil: 0151-51245795E-Mail: presse[at]meine-landwirtschaft[dot]de Statements von Redner*innen Tobias Schied, Jungbauer, Fridays for Future: „Die Klimakrise betrifft uns als Bäuer*innen sehr direkt, Wiesen und Äcker vertrocknen. Im Globalen Norden sind wir durch unsere Agrar- und Klimapolitik direkt dafür verantwortlich, das muss ein Ende haben. Zerstörerische Profite dürfen nicht länger über Menschen, Tiere und Ökosysteme gestellt werden, wir brauchen die klimagerechte Agrarwende jetzt!“ Lisa Reichmann, Kampagnenleiterin bei Campact: „Cem Özdemir sucht die guten Bilder – das Ferkel im Arm oder inmitten von Kühen. Was der Minister nicht liefert, sind konkrete Taten und Gesetze. Die Agrarwende braucht aber einen Bundeslandwirtschaftsminister, der anpackt, d.h. sich einsetzt für weniger Pestizide, mehr Lebe"
