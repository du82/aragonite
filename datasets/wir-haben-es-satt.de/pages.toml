title = "Hof mit Zukunft 2022 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Show larger version for: Mach mit! Du bist Landwirt*in oder Aktivist*in und willst an "Hof mit Zukunft" teilnehmen? Dann trage dich in unserer Vormerkliste ein oder abonniere unseren Newsletter. VORMERKLISTE NEWSLETTER FAQ Du hast Fragen zur Teilnahme bei "Hof mit Zukunft"? Hier findest du unsere FAQs: FÜR HÖFE FÜR AKTIVISTI Das war Hof mit Zukunft 2022 10. bis 12. Juni 2022 25 Höfe bundesweit konventionell und bio Gemüse- und Obstanbau, Ackerbau, Solidarische Landwirtschaft, Weinbau, Tierhaltung (Milchvieh, Schweinemast, Ziegen), Saatgutvermehrung 80 Aktivist*innen Fridays For Future, BUNDjugend, Naturschutzjugend und andere Jugend-Organisationen mit und ohne landwirtschaftliche Vorkenntnisse aus der ganzen Bundesrepublik Presse Viel Steuergeld fließe indirekt in die Landwirtschaft, in dem Betriebe subventioniert werden. Auf die „Bauern“ werde geschimpft, ohne zu differenzieren, kreidet Synowietz an. Deshalb ist er froh, nun selbst anpacken zu dürfen. Ostfriesische Nachrichten (11.06.2022) Es werden zu viele Ferkel geboren Die Landwirtschaft ist oft der Buhmann im politischen Diskurs. Doch im Rahmen von „Hof mit Zukunft“ ging es um Dialog auf Augenhöhe. Hellweger Anzeiger (13.06.2022) Hof mit Zukunft in Fröndenberg: Der Landwirt und die Aktivistinnen PRESSESPIEGEL PRESSEMITTEILUNG Mein Wochenende auf einem Schweinezucht-Betrieb Wo kommt eigentlich unser Essen her? Wer kümmert sich um die Tiere, deren Fleisch wir essen? Wer sät das Getreide aus? Was für Probleme kommen dabei auf? Welchen Herausforderungen müssen sich Landwirt*innen stellen? Das sind alles Fragen, die ich mir als Stadtkind lange gestellt habe... WEITERLESEN Hof mit Zukunft: Aktivist*innen zu Gast auf 25 Höfen In Baden-Württemberg halfen die jungen Menschen z.B. beim Melken und dem Gemüse- oder Weinbau, in Sachsen beim Ackerbau und in Brandenburg in einer Solidarischen Landwirtschaft. In NRW machten sich Aktivist*innen auf Milchvieh- und Schweinemast-Betrieben nützlich. In Hessen wurden Ziegen gemolken und der Käse auf dem Markt verkauft. Auf anderen Betrieben in der Mitte Deutschlands hieß es Möhren jäten und Kartoffeln hacken... WEITERLESEN Impressionen HmZ 22 1 HmZ 22 2 HmZ 22 3 HmZ 22 4 HmZ 22 5 HmZ 22 6 #carousel-backgroundimage-8052-1342 { background-image: url('/fileadmin/_processed_/0/8/csm_HmZ22_Bild1_584b213418.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-8052-1342 { background-image: url('/fileadmin/_processed_/0/8/csm_HmZ22_Bild1_815efe078c.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8052-1342 { background-image: url('/fileadmin/_processed_/0/8/csm_HmZ22_Bild1_8d07b79c44.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8052-1342 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild1.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-8052-1342 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild1.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-8052-1342 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild1.jpg'); } } #carousel-backgroundimage-8052-1343 { background-image: url('/fileadmin/_processed_/2/d/csm_HmZ22_Bild3_c7973bd2f6.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-8052-1343 { background-image: url('/fileadmin/_processed_/2/d/csm_HmZ22_Bild3_07715e81dc.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8052-1343 { background-image: url('/fileadmin/_processed_/2/d/csm_HmZ22_Bild3_0568293bfb.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8052-1343 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild3.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-8052-1343 { background-ima