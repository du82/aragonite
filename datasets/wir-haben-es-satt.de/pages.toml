["https://wir-haben-es-satt.de/presse-archiv/berlin-291117"]
title = "Berlin, 29.11.17 - Wir haben es satt!"
full_description = "Pressemitteilung „Wir haben es satt!“: Breites zivilgesellschaftliches Bündnis schlägt Alarm für gutes Essen und die globale Agrarwende „Wir haben es satt!“-Großdemonstration am 20.01.18 mit Kochtopf-Protest bei internationaler Agrarministerkonferenz / Breites Bündnis für gutes Essen, artgerechte Tierhaltung und die globale Agrarwende bietet der Agrarindustrie die Stirn Berlin, 29.11.17. Unter dem Motto „Der Agrarindustrie die Stirn bieten!“ werden am 20. Januar 2018 viele tausende Demonstranten im Berliner Regierungsviertel für eine zukunftsfähige Agrar- und Ernährungspolitik auf die Straße gehen. Bauern, Imker und Bäcker kommen bei der achten „Wir haben es satt!“-Demonstration mit engagierten Bürgern aus Stadt und Land zusammen. Mit Kochtöpfen und Kochlöffeln werden sie – aufgerufen von einem breiten Bündnis von mehr als 50 Organisationen aus Landwirtschaft und Zivilgesellschaft – ihre Ablehnung zur aktuellen Agrar- und Ernährungspolitik zum Ausdruck bringen. Im Fokus der Demonstration: die internationale Agrarministerkonferenz im Bundeswirtschaftsministerium, wo auf Einladung der Bundesregierung das weltgrößte Treffen dieser Art stattfindet. „Wir schlagen Alarm für eine bessere Politik“, erklärt „Wir haben es satt!“-Sprecher Jochen Fritz. „Mit unserem unüberhörbaren Kochtopf-Protest senden wir unsere Botschaft nach drinnen zu den Agrarministern der Welt. Der Exportwahnsinn in der Landwirtschaft muss beendet werden.“Das Demonstrationsbündnis fordert von der nächsten Bundesregierung eine Abkehr von der aggressiven Exportausrichtung der Agrarpolitik, die Bauernhöfe weltweit in den Ruin treibt. Seit 2005 musste in Deutschland jeder dritte landwirtschaftliche Betrieb die Tore schließen, und in vielen Ländern des Südens bleiben oftmals die Kochtöpfe leer. Denn immer mehr Kleinbauern verlieren ihre Einkommensgrundlagen, weil sie nicht mit den Billigimporten aus Europa konkurrieren können. Mit Blick auf den Alleingang des Bundeslandwirtschaftsministeriums beim jüngsten Glyphosat-Votum in der EU kommentiert Bündnissprecher Jochen Fritz: „Minister Christian Schmidt hat mit diesem vorgezogenen Weihnachtsgeschenk an Bayer-Monsanto einmal mehr bewiesen, dass er ein Handlanger der Industrie ist. So eine Fehlbesetzung darf es nicht wieder geben. Die nächste Bundesregierung muss bei der Besetzung des Landwirtschaftsministeriums sicherstellen, dass die Interessen von Großkonzernen nicht über die von Landwirten und Verbrauchern gestellt werden.“ Von der neuen Bundesregierung erwartet das Bündnis, dass der gesellschaftlich gewollte Umbau der Landwirtschaft und des Ernährungssystems endlich konsequent umgesetzt wird. Dazu braucht es mehr artgerechte Tierhaltung, ein nationales Verbot von Glyphosat und von Gentechnik in Tierfutter sowie wirksame Maßnahmen gegen das Insektensterben. Terminhinweis Wir haben es satt!-Großdemonstration „Der Agrarindustrie die Stirn bieten!“ Zeit: Samstag, 20. Januar 2018, ab 11:00 UhrOrt: Berlin Hauptbahnhof (Washingtonplatz) Ablauf: 11 Uhr: Auftaktkundgebung. Ab ca. 11.30 Uhr: Start der Demonstration zur internationalen Agrarministerkonferenz im Bundeswirtschaftsministerium. Ab ca. 13.30 Uhr: Abschluss mit Reden, Musik und Essen am Brandenburger Tor Hintergrund Seit 2011 demonstrieren unter dem Titel „Wir haben Agrarindustrie satt!“ alljährlich im Januar zehntausende Menschen – Bauern, Lebensmittelhandwerker, Tier-, Umwelt- und Naturschützer, Aktive der Entwicklungszusammenarbeit, engagierte Jugendliche und viele mehr – kraftvoll, bunt und lautstark bei eisigen Temperaturen in Berlin. Zentrale Themen der Demonstration im kommenden Januar sind eine bäuerlich-ökologischere Landwirtschaft, gesundes Essen, artgerechte Tierhaltung, globale Bauernrechte und gerechter Welthandel. Weitere Informationen: www.wir-haben-es-satt.de Pressekontakt Christian Rollmann, Presse- und Öffentlichkeitsarbeit „Wir haben es satt!“, Tel.: 030-28482438, Mobil: 0151-51245795, E-Mail: rollmann[at]meine-landwirtschaft[dot]de Pressemitteilung"
