} } @media (min-width: 992px) { #carousel-backgroundimage-7752-1316 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Frontbanner-und-Bundestag.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7752-1316 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Frontbanner-und-Bundestag.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7752-1316 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Frontbanner-und-Bundestag.jpg'); } } #carousel-backgroundimage-7752-1317 { background-image: url('/fileadmin/_processed_/e/6/csm_WHES24_DiversitaetAckerundGesellschaft_75168ea8da.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7752-1317 { background-image: url('/fileadmin/_processed_/e/6/csm_WHES24_DiversitaetAckerundGesellschaft_452e0af82b.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7752-1317 { background-image: url('/fileadmin/_processed_/e/6/csm_WHES24_DiversitaetAckerundGesellschaft_79485b45ff.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7752-1317 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_DiversitaetAckerundGesellschaft.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7752-1317 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_DiversitaetAckerundGesellschaft.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7752-1317 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_DiversitaetAckerundGesellschaft.jpg'); } } #carousel-backgroundimage-7752-1318 { background-image: url('/fileadmin/_processed_/6/7/csm_WHES24_Banner-Grosskonzerne-weg-vom-Acker_6d95cdff56.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7752-1318 { background-image: url('/fileadmin/_processed_/6/7/csm_WHES24_Banner-Grosskonzerne-weg-vom-Acker_1263df1563.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7752-1318 { background-image: url('/fileadmin/_processed_/6/7/csm_WHES24_Banner-Grosskonzerne-weg-vom-Acker_3de4ee99fa.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7752-1318 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Banner-Grosskonzerne-weg-vom-Acker.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7752-1318 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Banner-Grosskonzerne-weg-vom-Acker.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7752-1318 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Banner-Grosskonzerne-weg-vom-Acker.jpg'); } } Zurück Weiter Pressemitteilung „Gutes Essen hat aktuell keine Zukunft“ – 8.000 fordern ein sofortiges Ende des agrarpolitischen Stillstands Ein breites Bündnis aus Landwirtschaft und Zivilgesellschaft geht für Höfe und Klima und gegen Gifte, Gentechnik und Patente auf die Straße Berlin, 20. Januar 2024: 8.000 Menschen finden sich vor dem Willy-Brandt-Haus in Berlin ein und fordern lautstark die Abkehr von einer Agrarpolitik, die Bäuer*innen und Gesellschaft gleichermaßen im Stich lässt und den sozialen Frieden gefährdet. Klimaextreme und Kostensteigerungen bringen Landwirtschaft und Gesellschaft in Not. Kennzeichnung und Risikoprüfung bei der Gentechnik sollen abgeschafft werden, obwohl die überwiegende Mehrheit der Bevölkerung dies ablehnt. Die Protestierenden haben es satt. Sie fordern einen klaren Fahrplan für eine zukunftsfähige Landwirtschaft und ein krisenfestes Ernährungssystem. Stadt und Land, Produzent*innen und Konsument*innen setzen sich gemeinsam und solidarisch für die ökologische und sozial-gerechte Agrarwende ein, für Klima-, Tier- und Artenschutz sowie weltweite Ernährungssicherheit. „Die richtige Antwort auf Klimakrise, Artensterben und Hunger in der Welt ist eine bäuerliche und ökologischere Landwirtschaft“ sagt Inka Lange, Sprecherin des „Wir haben es satt!“-Bündnisses, das bereits zum 14. Mal zum Protest aufgerufen hat. Neben Organisationen aus den Bereichen Umwelt- und Tierschutz, Ernährung, Menschenrechte und Entwicklungszusammenarbeit gehören auch 35.000 Bäuer*innen dem Bündnis an. Sie benötigen für die Transformation zur umwelt- und tiergerechten Landwirtschaft sichere politische Rahmenbedingungen. Doch auch das grün geführte Landwirtschaftsministerium hat notwendige Maßnahmen trotz vollmundiger Absichtsbekundungen und vorliegender Lösungsvorschläge weitere zwei Jahre verschleppt. „Alle Fragen wurden längst ausreichend beantwortet – wir fordern Taten! Faire Erzeuger*innenpreise und die Unterstützung der Höfe beim Umbau der Tierhaltung, etwa durch eine Tierwohlabgabe, müssen jetzt kommen“ so Lange. „Außerdem muss sich die Bundesregierung in Europa dafür einsetzen, dass Milliarden an Agrarsubventionen endlich den Umwelt-, Tier- und Klimaschutz in der EU honorieren, statt öffentliche Gelder blind pro Fläche Hektar auszuschütten und damit vor allem die Agrarindustrie zu füttern. Die Zukunft der Landwirtschaft muss sofort zur Chefsache in der Ampelkoalition werden.“ Entsprechende Forderungen und die bäuerliche Protestnote übergaben Bäuer*innen, Menschenrechts- und Entwicklungsorganisationen am Vormittag Bundeslandwirtschaftsminister Cem Özdemir. Mit rund 50 Traktoren waren die Teilnehmer*innen der Kundgebung „Bäuerliche Rechte weltweit stärken“ am frühen Morgen aus dem Berliner Umland zum Global Forum for Food and Agriculture gefahren. Dort sprachen sie mit dem Minister zeitgleich zu seiner Konferenz mit rund 70 internationalen Agrarminister*innen und wiesen ihn auf die Notwendigkeit eines solidarischen, raschen Handelns hin. Am Willy-Brandt-Haus vereinte sich die Traktordemo schließlich mit den „Wir haben es satt!“-Demonstrierenden, darunter ein Block mit Bäuer*innen, die ohne Traktoren aus ganz Deutschland angereist waren. In Berlin adressieren sie neben der Ampelregierung auch das Europäische Parlament. Die im Februar drohende Abschaffung des strengen EU-Gentechnikrechts sorgt für Unmut auf den Höfen und bei den Verbraucher*innen. Milana Müller, Landwirtin aus dem Ost-Erzgebirge, und Benny Haerlin von Save our Seeds dazu: „Der Gipfel des umwelt- und agrarpolitischen roll back aus Brüssel: Die EU-Kommission will künftig Gentechnikpflanzen ohne Risikoprüfung und Kennzeichnung zulassen. Niemand weiß mehr, wo es drin ist, keiner kann es mehr vermeiden. Die Risiken steigen, keiner haftet. Aber Bayer und Syngenta können unser Saatgut patentieren. Das lassen wir uns nicht gefallen!“ Die Demonstrierenden erwarten von der Bundesregierung, sich dem Durchmarsch der Gentechnik- und Pestizidindustrie in den Weg zu stellen. Passend dazu skandiert der Demozug „Gentechnik – wir haben es satt!“. Auf dem Weg von der SPD-Parteizentrale vorbei an Finanz- und Landwirtschaftsministerium zum Bundeskanzleramt, wo die Abschlusskundgebung stattfindet, hört man noch den Ruf: „Özdemir verbau's nicht! Agrarreformen! Trau dich!“ Statements von Redner*innen Martin Schulz, Bundesvorsitzender Arbeitsgemeinschaft bäuerliche Landwirtschaft "
