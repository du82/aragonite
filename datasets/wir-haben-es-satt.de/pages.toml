title = "Jugend-Festival 2019 - Wir haben es satt!"
full_description = "YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel WEITERLESEN Wetterauer Zeitung Frankfurter Neue Presse Wetterauer Zeitung Frankfurter Rundschau RheinMain TV Jugendfestival Beats+Bohne 20.-23.06.19 Das Wir haben es satt!- Festival Aufruf Die Agrarwende rocken: „Wir haben es satt!“-Bewegung kommt zum „Beats + Bohne“-Festival bei Frankfurt zusammen Die „Wir haben es satt!“-Bewegung hat sich auf einen Bauernhof bei Frankfurt am Main zum „Beats + Bohne“-Festival getroffen. Vier Tage lang ging es bei „Beats + Bohne“ um die Zukunft von Landwirtschaft und Essen: Rund 500 junge Menschen tauschten sich zwischen Schweinestall und Käserei über nachhaltige Landwirtschaft aus, entwickelten hinter der Feldscheune Strategien gegen Artensterben und Klimakrise und planten auf der Streuobstwiese politische Aktionen für die Agrarwende. Dazu gab es ein umfangreiches kulturelles Rahmenprogramm mit Live-Bands, Kino-Screenings und Performances. Auf dem Dottenfelder Hof, dem Veranstaltungsort des Festivals, konnten die Teilnehmer in Aktivwerkstätten zudem praktisch erfahren, wie umweltfreundlich geackert und gutes Essen hergestellt wird. Initiiert wurde „Beats + Bohne“, das dieses Jahr erstmalig stattfand, von zehn Jugendorganisationen aus den Bereichen Landwirtschaft, Umwelt und Ernährung. ALLE FESTIVAL-BILDER AUF FLICKR Hennen Workshop Solidarität mit Ende Gelände Hofführung The Footprint Project Radioballett Wegweiser #carousel-backgroundimage-4848-297 { background-image: url('/fileadmin/_processed_/9/1/csm_48131938457_20456a84bf_o_602291f569.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-4848-297 { background-image: url('/fileadmin/_processed_/9/1/csm_48131938457_20456a84bf_o_d1dbdd84b3.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-4848-297 { background-image: url('/fileadmin/_processed_/9/1/csm_48131938457_20