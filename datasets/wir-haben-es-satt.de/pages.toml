["https://wir-haben-es-satt.de/presse-archiv/berlin-05122018"]
title = "Berlin, 05.12.2018 - Wir haben es satt!"
full_description = "Pressemitteilung 'Wir haben es satt!’: Der Agrarindustrie den Geldhahn abdrehen – Bauern bei Klimaschutz unterstützen! Großdemonstration für zukunftsfähige EU-Agrarreform am 19.01.19 / Kochtopf-Konzert für klima- und umweltfreundliche bäuerliche Landwirtschaft, artge­rechte Tierhaltung und gutes Essen Berlin, 05.12.18. Unter dem Motto ‚Wir haben es satt – Essen ist politisch!’ ruft ein breites Bündnis von mehr als 50 Organisationen aus Landwirtschaft und Zivilgesellschaft zum Pro­test auf. Zehntausende Menschen – Bauern, Imker, Bäcker und viele engagierte Bürger aus Stadt und Land – werden sich am 19. Januar im Berliner Regierungsviertel lautstark für eine zukunftsfähige Agrarpolitik einsetzen. Im Fokus der Demonstration steht die aktuelle EU-Agrarreform. Denn bei der Neuausrichtung der Gemeinsamen Europäischen Agrarpolitik (GAP) entscheidet die Bundesregierung 2019 maßgeblich über die Verteilung der Subventio­nen von rund 60 Milliarden Euro pro Jahr mit. „Die Menschen verlangen, dass die Agrarsubventionen endlich umverteilt werden“, erklärt ‘Wir haben es satt!’-Sprecherin Saskia Richartz und fährt fort: „Statt weiterhin mit Steuer­geld pauschal Landbesitz zu belohnen, muss die EU Bauern bei Klima- und Tierschutz unter­stützen!“ Das Dürrejahr 2018 zeigt ebenso deutlich wie das Insektensterben oder die Gülle­flut, dass es so nicht weitergeht. „Von den Subventionen profitieren nicht Bauernhöfe, Bienen und Klima, sondern vor allem Großgrundbesitz, Tierfabriken und Monokulturen. Das haben wir satt!“, kommentiert Richartz und fordert: „Schluss mit den Steuermilliarden an die Agrar­industrie!“ Bei der EU-Agrarreform muss endlich das Prinzip öffentliches Geld nur für öffentliche Leis­tungen gelten. Schon heute zeigen unzählige bäuerliche Betriebe in ganz Europa, wie Tiere artgerecht gehalten, Böden und Klima geschützt werden und dabei gutes Essen produziert wird. Die Politik darf diesen Betrieben, die Vorbilder für die Zukunftslandwirtschaft sind, nicht weiterhin Knüppel zwischen die Beine werfen. Dafür schlagen die Demonstranten wenige Monate vor der Europawahl beim internationalen Agrarministergipfel mit ihren Kochtöpfen lautstark Alarm. Terminhinweis: „Wir haben es satt!“-Großdemonstration: „Der Agrarindustrie den Geldhahn abdrehen!“ Zeit: Samstag, 19. Januar 2019, ab 12.00 Uhr Ort: Brandenburger Tor, Platz des 18. März, 10117 Berlin Ablauf: 12 Uhr: Auftaktkundgebung Ab ca. 12.30 Uhr: Start der Demonstration zum internationalen Agrarminister­gipfel im Auswärtigen Amt Ab ca. 14.30 Uhr: Abschluss mit Reden, Musik und Essen am Brandenburger Tor Schon am Vormittag findet die Traktorendemo mit anschließender Übergabe der bäuerlichen Protestnote statt. Ort & Zeit: 10.30 Uhr beim Agrarministergipfel im Auswärtigen Amt, Wer­derscher Markt 1, 10117 Berlin. Hintergrund: Seit 2011 demonstrieren unter dem Motto ‚Wir haben Agrarindustrie satt!‘ alljährlich im Ja­nuar zehntausende Menschen – Bauern, Lebensmittelhandwerker, Tier-, Umwelt- und Natur­schützer, Aktive der Entwicklungszusammenarbeit, engagierte Jugendliche und viele mehr – kraftvoll, bunt und lautstark auch bei eisigen Temperaturen in Berlin. Gemeinsam treten sie ein für eine Landwirtschaft, in der Tiere artgerecht gehalten werden, Umwelt und Klima ge­schützt werden, gutes Essen für alle erzeugt wird und die Bauern faire Preise für ihre Pro­dukte erhalten. Weitere Informationen: www.wir-haben-es-satt.de Pressekontakt: Christian Rollmann, ‚Wir haben es satt!‘-Pressesprecher, Tel.: 030-28482438, Mobil: 0151-51245795, E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung"
