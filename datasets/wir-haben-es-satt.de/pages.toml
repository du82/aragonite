title = "Demo 2015 - Wir haben es satt!"
full_description = "Pressespiegel Fernsehen/Videos ARD Tagesschau RBB Abendschau RBB Aktuell (ab Min. 1:05) Tagesspiegel Online Focus Online Euronews AgrarHeute Deutsche Welle Bayerischer Rundfunk HR Hessenschau (Hintergrund-Bericht) NDR Mecklenburg-Vorpommern ZDF (Hintergrund zu TTIP und Demo) Print- und Onlinemedien Bauernstimme Spiegel Online Berliner Zeitung taz - die Tageszeitung Junge Welt Berliner Morgenpost FR Online Der Freitag Kölner Stadtanzeiger Neues Deutschland Hannoversche Allgemeine Rundschau Online RP Online Stern.de Donaukurier Die Welt B.Z. Berlin Bild.de MDR.de ntv.de Proplanta.de Oberhessische Zeitung Schwarzwälder Bote Radio MDR Figaro Radio Hamburg Deutschlandfunk Deutschlandradio Kultur (Hintergrund) Internationale Medien RT.com (englisch) Radyo Kassel (türkisch) Euronews (italienisch) Deutsche Welle (polnisch) Biorama.eu FM4 vom ORF.at (Hintergrundbericht) German Daily News 5. WIR HABEN ES SATT!-DEMO AM 17. JANUAR 2015 Aufruf Stoppt TierFABRiKEN, Gentechnik und TTIP - Für DIE AgrarWende! Wir haben es satt! Die Agrarindustrie ist weiter auf dem Vormarsch: Wenige globale Großkonzerne untergraben die Saatgut-Vielfalt und fördern die Gentechnik auf dem Acker. Investoren bauen immer neue industrielle Megaställe, in denen Tiere unter qualvollen Bedingungen leiden. Die Mächtigen dieser Welt planen auf dem G7-Gipfel und durch die Freihandelsabkommen TTIP und CETA die globale Industrialisierung der Landwirtschaft. Die Folgen sind allgegenwärtig: Immer mehr Bäuerinnen und Bauern müssen, hier und in den Ländern des Südens, ihre Höfe aufgeben. Billigfleisch überschwemmt die Märkte. Der Anbau von Monokulturen verdrängt den Regenwald. Ackerland wird zum Spekulationsobjekt. Und: Der weltweite Hunger ist nach wie vor Fakt. Wir können es besser! Eine bäuerliche, ökologischere Landwirtschaft verdient unseren Respekt und unsere Wertschätzung, sie ist ein wichtiger Beitrag zur Ernährungssouveränität. Sie muss und kann die Welt ernähren. Dazu brauchen wir kostendeckende Preise für Bäuerinnen und Bauern, die respektvoll mit Tier und Umwelt umgehen. Wir fordern regionale Erzeugung statt steigender Weltmarktorientierung für Nahrungsmittel. Und wir wollen Politikerinnen und Politiker, die endlich im Sinne der Menschen handeln anstatt die Interessen weniger multinationaler Konzerne zu vertreten. Widerstand zeigt Wirkung! Wir haben schon viel erreicht: Überall in Deutschland verhindern Bürgerinitiativen neue Megaställe und fordern bäuerliche Strukturen in der Tierhaltung. Gentechnik-Mais darf in Deutschland nicht mehr angebaut werden und unser Protest lässt TTIP und CETA wanken. Kurz: Für Veränderungen braucht es den Druck der Straße. http://wir-haben-agrarindustrie-satt.de/Deswegen demonstrieren wir am 17. Januar 2015 in Berlin erneut für eine grundlegende Agrarwende – bundesweit und global. Sei dabei! Wir fordern: Fairhandel statt Freihandel! Artgerechte Tierhaltung ohne Antibiotika-Missbrauch! Förderung regionaler Futtermittelerzeugung! Recht auf Nahrung weltweit! Gesundes und bezahlbares Essen für alle! Faire Preise und Marktregeln für die Bauern! Freiheit für die Saatgutvielfalt! Bienen- und umweltfreundliche Landwirtschaft! Zugang zu Land weltweit für alle! Stoppt: die Freihandelsabkommen TTIP und CETA! die Tierfabriken! die Gentechnik auf dem Acker und im Stall! den Hunger! die Lebensmittelskandale! das Bauernhöfesterben! die Patente auf Pflanzen und Tiere! die Monokulturen! die Landnahme durch Staaten und Investoren! ALLE DEMO-BILDER AUF FLICKR Gentechnik-Maiskolben Blick über Platz Traktoren mit Banner Dresden kauft Bio Detail Banner in Front von Menge #carousel-backgroundimage-384-37 { background-image: url('/fileadmin/_processed_/0/4/csm_Gentechnik_Detail_2b5719d6d8.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-384-37 { background-image: url('/fileadmin/_processed_/0/4/csm_Gentechnik_Detail_16b541286d.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-384-37 { background-image: url('/fil