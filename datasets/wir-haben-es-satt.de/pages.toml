["https://wir-haben-es-satt.de/presse-archiv/kw-9917"]
title = "KW, 9.9.17 - Wir haben es satt!"
full_description = "Pressemitteilung Fotos zur kostenfreien Nutzung (Quellenangabe: www.wir-haben-es-satt.de) Für den Umbau der Tierhaltung: Kein Wiesenhof-Megaschlachthof in Königs Wusterhausen Breites Bündnis fordert bei Demonstration Stopp von Schlachthof-Erweiterung auf 240.000 Hühner am Tag / Nächste Bundesregierung muss Bauernhöfe und Stallumbau unterstützen Berlin/Königs Wusterhausen, 9.9.17. Unter dem Motto „Wir haben Tierfabriken satt!“ gingen am Samstag rund 1000 Personen gegen die geplante Erweiterung eines Wiesenhof-Schlachthofs in Königs Wusterhausen auf die Straße. Aufgerufen von einem Bündnis, dem 45 zivilgesellschaftliche Organisationen von Landwirtschaft bis Tierschutz angehören, forderten die Demonstranten einen Stopp der geplanten Verdopplung der Schlachtkapazitäten auf 240.000 Hühner am Tag. In dem Schlachthof des größten deutschen Geflügelproduzenten sehen die Veranstalter ein Symbol der verfehlten Agrarpolitik unter Bundesminister Christian Schmidt (CSU). Statt tatenlos zuzusehen, wie immer mehr Megaställe mit zehntausenden Tieren gebaut würden, müsse die nächste Bundesregierung den Stallumbau hin zu besonders artgerechten Haltungsformen fördern. Der Demonstrationszug führte vom Bahnhof Königs Wusterhausen zum Schlachthof im Ortsteil Niederlehme. Im Anschluss fand ein „Fest für die Agrarwende“ mit Essen, Konzerten und Kleinkunst vor dem Schlachthof statt. „Wir haben es satt!“-Sprecher Jochen Fritz, der im Nebenerwerb einen Landwirtschaftsbetrieb in Werder/Havel betreibt, sagte: „Wir brauchen einen Umbau der Landwirtschaft zu mehr ‚Klasse statt Masse‘. Die nächste Bundesregierung muss endlich den gesellschaftlich gewollten Umbau anpacken. Die Bevölkerung will gute Tierhaltung, der Staat muss den Bauern beim Stallumbau unter die Arme greifen. Die Bauern, die uns gesund ernähren, ihre Tiere artgerecht halten und die Artenvielfalt schützen, müssen wieder von ihren Produkten leben können. Eine Fehlbesetzung wie Bundesminister Schmidt darf es daher nach der Bundestagswahl nicht noch einmal geben.“ Kerstin Rist, Anwohnerin und Mitglied der Bürgerinitiative „KW stinkt’s“, sagte: „Ohne Genehmigung hat Wiesenhof seine Kapazitäten auf 160.000 Hühner am Tag erhöht. Nicht einmal als ich Strafanzeige erstattet habe, haben die Behörden reagiert. Wir haben es hier mit lokalem Staatsversagen zu tun. Die Behörden sind Wiesenhof als weltweit agierendem Konzern, der sich offenbar nicht um Gesetze und Vorschriften schert, nicht gewachsen. Daher sage ich: Herr Umweltminister Vogelsänger, dieser Skandalschlachthof darf nicht erweitert werden!“ Angela Dinter von der Tierschutzorganisation PROVIEH sagte: „Mit jeder Schlachthoferweiterung entstehen Megaställe, in denen 40.000 Tiere und mehr gehalten werden. Diese Tiere sehen nie Tageslicht, sind völlig überzüchtet und landen nach 36 Tagen in diesen Hühner-Schlachthöfen. Um Klima, Umwelt und Gesundheit zu schützen, muss der Fleischkonsum reduziert werden. Wir brauchen mehr Tierschutz und langsamer wachsende Tiere, denn der Qualzucht muss ein Ende gesetzt werden.“ Reinhild Benning, Agrarexpertin von Germanwatch, sagte: „Wer Antibiotika missbraucht, erntet Antibiotikaresistenzen und riskiert damit die Gesundheitsversorgung von Menschen. Industrielle Hühnermast heißt 9 von 10 Tieren erhalten Antibiotika, viel Tierleid und Missbrauch auch von Notfall-Antibiotika wie Colistin. Gesundheitsminister Gröhe und Verbraucherminister Schmidt haben darin versagt, systematischen Antibiotika-Missbrauch im Stall zu stoppen. Nur ein Wechsel der Regierung bringt den Wandel in der Tierhaltung voran.“ Sebastian Junge, Küchenchef aus Hamburg und Mitglied der Slow Food Chefs Alliance, sagte: „Diesem Elend auf dem Teller muss ein Ende bereitet werden. Es braucht wieder saubere und fair produzierte Lebensmittel, verantwortungsbewusst von Bauern und Lebensmittelhandwerkern erzeugt. Es ist Zeit für Slowfood statt Fastfood. 250 Hühnchen in der Minute? Nein, danke!“ Leonie Dorn von Aktion Agrar sagte: „Der Export-Wahnsinn in der Landwirtschaft muss ein Ende haben. 2016 ist der Export von Hühnerfleisch aus der EU um 10 % auf 680 Millionen Tonnen im Jahr gestiegen. Länder wie Ghana haben sich in den 1990er Jahren selbst mit Geflügel versorgt. Heute kommen weniger als 10 Prozent aus dem Land, der Rest sind Importe aus Europa. Deutsche Geflügel-Exporte zerstören Existenzen und verursachen Hunger. Das kann nicht im Sinne der Geflügelbranche sein!“ Hintergrund:Die Demonstration in Königs Wusterhausen bildet den Abschluss der „Wir haben es satt!“- Aktionstour gegen Konzernmacht, Landraub und Tierfabriken. Die Veranstalter, die alljährlich im Januar unter dem Slogan „Wir haben es satt!“ mit Zehntausenden in Berlin für die Agrar- und Ernährungswende demonstrieren, haben im Wahljahr einen 9-Punkte-Plan für den Umbau der Landwirtschaft veröffentlicht. Eine Forderung der 45 Organisationen aus den Bereichen Landwirtschaft, Umwelt-, Natur-, Tierschutz sowie Entwicklungszusammenarbeit ist die sofortige Bereitstellung von 500 Millionen Euro im Jahr für den Umbau von Ställen und andere Agrarwende-Maßnahmen. Pressemitteilung Fotos zur kostenfreien Nutzung (Quellenangabe: www.wir-haben-es-satt.de)"
