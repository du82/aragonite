denburger_Tor_18_6d665eae4e.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1090-93 { background-image: url('/fileadmin/_processed_/2/8/csm_Menge_Brandenburger_Tor_18_0ff719dceb.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1090-93 { background-image: url('/fileadmin/_processed_/2/8/csm_Menge_Brandenburger_Tor_18_52bc82ceaa.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1090-93 { background-image: url('/fileadmin/user_upload/demo18/Menge_Brandenburger_Tor_18.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1090-93 { background-image: url('/fileadmin/user_upload/demo18/Menge_Brandenburger_Tor_18.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1090-93 { background-image: url('/fileadmin/_processed_/2/8/csm_Menge_Brandenburger_Tor_18_c2340c8a31.jpg'); } } Zurück Weiter Pressemitteilung „Essen ist politisch!“ 33.000 fordern mehr Tempo bei Agrar- und Ernährungswende SPD und Union müssen Willen der Bevölkerung umsetzen: Schluss mit Glyphosat, Tierfabriken und weltweitem Höfesterben / Umwelt, Tiere und Bauernhöfe verzeihen keinen weiteren Stillstand Berlin, 20.01.18. Mit einem ohrenbetäubenden Kochtopf-Konzert fordern 33.000 Menschen bei der „Wir haben es satt!“-Demonstration zum Auftakt der Grünen Woche in Berlin die kommende Bundesregierung zu einer neuen Agrarpolitik auf. „Die industrielle Land- und Ernährungswirtschaft verursacht lokal und global Probleme für Bauern, Klima, Tiere und Umwelt“, sagt „Wir haben es satt!“-Sprecher Jochen Fritz und ergänzt im Namen der über 100 Organisationen, die zur Demonstration aufgerufen haben: „Der Umbau hin zu einer umwelt-, tier- und klimafreundlichen Landwirtschaft, in der Bauern gut von ihrer Arbeit leben können, darf von der Politik nicht weiter aufgeschoben werden.“ Das Demonstrationsbündnis ruft SPD und Union auf, keine weitere Zeit mehr verstreichen zu lassen und als erste Schritte Glyphosat zu verbieten sowie den überfälligen Umbau der Tierhaltung zu finanzieren, damit Schweine wieder Tageslicht sehen und Kühe auf Weiden grasen können. Vor dem Agrarministergipfel im Bundeswirtschaftsministerium schlagen die Demonstranten auf ihre Kochtöpfe und fordern die Achtung der Menschenrechte, faire Handelsbedingungen und mehr Unterstützung für die ländliche Bevölkerung weltweit. Schon am Vormittag hatten die 160 Bauern, die die Demonstration mit ihren Traktoren anführen, eine Protestnote an die 70 versammelten Minister aus aller Welt übergeben. „Wir wollen raus aus der fatalen Exportorientierung und Landkonzentration, die Bauern hier und weltweit das Genick bricht“, so Fritz über die Folgen der Agrarpolitik. Allein in den letzten 12 Jahren, mussten in Deutschland ein Drittel der Höfe ihre Tore schließen. Bündnis-Sprecher Fritz weiter: „Essen ist politisch, immer mehr Menschen erkennen das. Aber die Politik nährt eine Agrarindustrie und lässt sie auf Kosten von Umwelt, Klima und Tieren produzieren. Damit wir alle nicht langfristig die Zeche dafür zahlen'''
