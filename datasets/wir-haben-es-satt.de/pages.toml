["https://wir-haben-es-satt.de/informieren/rueckblick/kongress-2016"]
title = "Kongress 2016 - Wir haben es satt!"
full_description = 'YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Berichte Eigene Dokumentation Programm Fazit von Jürgen Maier(Forum für Umwelt und Entwicklung) Pressespiegel Unabhängige Bauernstimme Naturfreunde taz 2. WIR HABEN ES SATT!-Kongress 2016 Vier Tage zu Landwirtschaft macht essen Unter dem Motto „Landwirtschaft Macht Essen" lag der Schwerpunkt des Kongresses, der vom 30. September bis zum 3. Oktober in Berlin-Kreuzberg stattfand, auf den Fragen: Woher kommt das Essen? Welche globalen Machtgefüge steuern die Lebensmittelproduktion? Wie kann ein Umbau der Landwirtschaft gestaltet werden? Vier Tage voll mit spannenden Diskussionen, guten Beispielen gelebten Alternativen, Arbeitsgruppen und Aktivwerkstätten rund um die Landwirtschaft und das Essen der Zukunft. Parallel bot das Stadt Land Food-Festival für gutes Essen und gute Landwirtschaft interessante Märkte und Werkstätten. VIER TAGE KONGRESS (FOTOS) Gemeinsame Pressemitteilung Starkes Zeichen für gutes Essen und gute Landwirtschaft 500 TeilnehmerInnen beim 2. „Wir haben es satt!“-Kongress / Zum Abschluss symbolisches Tauziehen um die Lebensmittelerzeugung unter dem Motto: „Agrarkonzerne: Finger weg von unserem Essen!“ / Demonstration in Berlin am 21. Januar 2017 Berlin, 3.10.2016. Zum Abschluss des „Wir haben es satt!“-Kongresses veranstalteten die TeilnehmerInnen auf dem Mariannenplatz in Berlin-Kreuzberg ein symbolisches Tauziehen um die Agrar- und Ernährungswende. Bauern und in Tierkostümen verkleidete AktivistInnen riefen dabei in Richtung der Konzernvertreter von Bayer, Monsanto und Aldi, die versuchten sie über den Tisch zu ziehen: „Hände weg von unserem Essen!“ Der 2. „Wir haben es satt!“-Kongress fand seit Freitag in der Emmauskirche am Lausitzer Platz statt. 500 TeilnehmerInnen diskutierten vier Tage lang über Lebensmittelerzeugung, globale Machtverhältnisse und gesundes Essen. Zusammen mit dem Stadt Land Food-Festival, auf dem sich Besucher in zahlreichen Werkstätten über das Lebensmittelhandwerk informierten, setzten Zehntausende rund um die Markthalle Neun ein Zeichen für bäuerliche, handwerkliche Lebensmittelerzeugung und gesunde Lebensmittel. Jochen Fritz, Leiter der Kampagne „Meine Landwirtschaft“ und Organisator der „Wir haben es satt!“-Demonstration, sagte: „Der Kongress war ein voller Erfolg. Wir wollen, dass die Agrarwende das zentrale Thema im Bundestagswahljahr wird, dafür gehen wir am 21. Januar 2017 wieder auf die Straße!“ Leonie Dorn von Aktion Agrar appellierte am Rande des Tauziehens an die EU-Kommission: „Die EU-Wettbewerbskommissarin Vestager muss die geplante Fusion von Bayer und Monsanto verhindern, denn schon heute haben die Megakonzerne viel zu viel Macht über unsere Ernährungsgrundlagen!“ Pressekontakt Christian Rollmann, Presse- und Öffentlichkeitsarbeit, Kampagne „Meine Landwirtschaft“, Tel: 030-28482438, Mobil: 0151-75142515, Mail: rollmann(at)meine-landwirtschaft.de Berichte Eigene Dokumentation Programm Fazit von Jürgen Maier(Forum für Umwelt und Entwicklung) Pressespiegel Unabhängige Bauernstimme Naturfreunde taz'
