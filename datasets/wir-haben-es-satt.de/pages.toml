["https://wir-haben-es-satt.de/berlin-15012024-stellungnahme"]
title = "Berlin, 15.01.2024 Stellungnahme - Wir haben es satt!"
full_description = "Stellungnahme 15. Januar 2024 PDF-VERSION PDF-VERSION Stellungnahme 15. Januar 2024 Zukunft braucht bäuerliche, umweltgerechte und gentechnikfreie Landwirtschaft Die geplante Streichung der Agrardieselbeihilfe und der KfZ-Steuerbefreiung ist der Auslöser für die Proteste so vieler Bäuer*innen. Die Ursache ihrer Unzufriedenheit liegt jedoch in einer jahrzehntelangen verfehlten Agrarpolitik, die auch wir schon lange kritisieren. Der Klimawandel und das Artensterben stellen uns vor immense Herausforderungen, die wir als Gesellschaft nur gemeinsam mit der Landwirtschaft lösen können. Damit der umwelt- und tiergerechte Umbau der Landwirtschaft gelingt, brauchen die Bäuer*innen eine vorausschauende Politik, die ihnen wirtschaftliche Perspektiven und Planungssicherheit bietet. Ein weiter so in der Landwirtschaft ist keine Option. Die Ampelregierung muss den agrarpolitischen Stillstand der letzten Jahrzehnte beenden und die Agrarwende endlich konkret angehen. Wir erwarten von der Politik konsequente Antworten auf das Höfe- und Artensterben, die Klimakrise und den Hunger in der Welt. Die Regierung muss die Bäuer*innen endlich unterstützen, im Sinne der Gesellschaft zu wirtschaften, und in den gesellschaftlichen Zusammenhalt investieren! Wir fordern die Bundesregierung auf: Bäuer*innen mit einer Tierwohlabgabe die Finanzmittel zu geben, ihre Ställe artgerecht, klima- und umweltverträglich umzubauen Bäuer*innen gegenüber dem Einzelhandel und der Lebensmittelindustrie zu stärken, damit sie faire Preise für ihre erzeugten Lebensmittel erhalten die EU-Agrargelder endlich so einzusetzen, dass Betriebe gezielt für Umwelt-, Klima, Biodiversitäts- und Tierschutz einkommenswirksam honoriert werden mit einer höheren Grunderwerbsteuer für Großgrundbesitzer*innen beim erneuten Landkauf dafür zu sorgen, dass Ackerland in bäuerlicher Hand bleibt die Erzeugung von Lebensmitteln ohne Gentechnik zu sichern und damit den wirtschaftlichen Standortvorteil für Bäuer*innen zu erhalten. Das „Wir haben es satt!“-Bündnis setzt sich seit über einem Jahrzehnt friedlich und demokratisch für die sozial und ökologisch gerechte Agrarwende ein: Wir sind Bäuerinnen und Bauern, konventionell und bio, von Tierhaltung bis Ackerbau, wir sind Imker*innen, Natur-, Umwelt- und Tierschützer*innen, Aktive der Entwicklungszusammenarbeit und Ernährungsbewegung, engagierte Jugendliche und kritische Bürgerinnen und Bürger. Wir demonstrieren gemeinsam für eine bäuerliche, ökologischere und gentechnikfreie Landwirtschaft und sagen Nein zu rechtsextremen Ideologien und Parteien, Menschenfeindlichkeit, Demokratiefeindlichkeit, Umsturzfantasien und Rassismus. Wir laden dazu ein, zusammen mit uns am Samstag, den 20. Januar, vor dem Willy-Brandt-Haus in Berlin die Stimme zu erheben und zu fordern: „Gutes Essen braucht Zukunft!“ Aufruf „Gutes Essen braucht Zukunft! – für eine gentechnikfreie, bäuerliche und umwelt-verträgliche Landwirtschaft!“ Unser 6-Punkte-Plan für die sozial-gerechte Agrarwende und gutes Essen für alle! Mehr über das „Wir haben es satt!“-Bündnis Inka Lange Sprecherin des „Wir haben es satt!“-Bündnis Mobil: (0163) 184 67 65 E-Mail: lange[at]meine-landwirtschaft[dot]de Stellungnahme 15. Januar 2024 PDF-VERSION PDF-VERSION"
