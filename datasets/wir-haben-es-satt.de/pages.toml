["https://wir-haben-es-satt.de/informieren/aufruf/klimaschutz"]
title = "Klimaschutz - Wir haben es satt!"
full_description = 'Hintergrundinfos: Positionspapier Zukunft der Tierhaltung So heizt die Milch- und Fleischindustrie das Klima an Positionspapier zu Kohlenstoff in Böden Verbändeappell für eine verursachergerechte und umweltfreundliche Düngepolitik Internationale Klimapolitik als Treiber der Agrarwende? Offener Brief Klimagerechtigkeit Ökolandbau ist Klimaschutz Futtermittel Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Klimaschutz Große Unternehmen der Fleisch- und Milchindustrie, Mineralöl- und Düngemittelkonzerne und die Lebensmittelindustrie profitieren von fehlenden Klimaschutzgesetzen. Das aktuelle Ernährungssystem ist weltweit für mehr als ein Drittel der globalen Treibhausemissionen verantwortlich. Insbesondere Massentierhaltung und Düngemittelindustrie tragen mit den klimaschädlichen Gasen Methan und Lachgas zur Klimakrise bei. Gleichzeitig werden für den Anbau von Futtermitteln die grünen Lungen der Welt gerodet. Dabei kann die Landwirtschaft zum Klimaschutz beitragen, indem sie klimaschädliche Emissionen reduziert und CO2 bindet. Besonders wichtig sind Maßnahmen zur Bodengesundheit, denn Böden können fünfmal mehr Kohlenstoff speichern als Pflanzen. Die Folgen der Klimakrise sind nicht nur für Bäuerinnen und Bauern im globalen Süden, sondern auch auf den Höfen in Deutschland schon deutlich spürbar: Die letzten Jahre waren geprägt von Hochwasser, Hitze- und Trockenheitsrekorden. Für viele Höfe bedeutet das bereits jetzt geringere und unsichere Ernten. Unsere Forderungen: Reduktion und bessere Verteilung der Tierbestände ohne das Höfesterben weiter zu befördern Eine verursachergerechte und bürokratieärmere Düngepolitik, die Klima, Natur und Gewässer konsequent schont und bäuerlichen Einsatz honoriert Bäuerinnen und Bauern beim Umbau zur klimagerechten Landwirtschaft gezielt fördern und durch langfristige Verträge unterstützen (z. B. bei der Moorwiedervernässung) Ausbau des Ökolandbaus Hintergrundinfos: Positionspapier Zukunft der Tierhaltung So heizt die Milch- und Fleischindustrie das Klima an Positionspapier zu Kohlenstoff in Böden Verbändeappell für eine verursachergerechte und umweltfreundliche Düngepolitik Internationale Klimapolitik als Treiber der Agrarwende? Offener Brief Klimagerechtigkeit Ökolandbau ist Klimaschutz Futtermittel ← ÜBERSICHT → Hintergrundinfos: Positionspapier Zukunft der Tierhaltung So heizt die Milch- und Fleischindustrie das Klima an Positionspapier zu Kohlenstoff in Böden Verbändeappell für eine verursachergerechte und umweltfreundliche Düngepolitik Internationale Klimapolitik als Treiber der Agrarwende? Offener Brief Klimagerechtigkeit Ökolandbau ist Klimaschutz Futtermittel'
