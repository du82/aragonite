["https://wir-haben-es-satt.de/presse-archiv/berlin-16012023"]
title = "Berlin, 16.01.2023 - Wir haben es satt!"
full_description = "Pressemitteilung PK-MITSCHNITT „Worten müssen Taten folgen“: Özdemir muss sozial gerechte Agrarwende und gutes Essen für alle vorantreiben Aufruf zur „Wir haben es satt!“-Großdemonstration am 21.1. / „6 Punkte-Plan für gutes Essen für alle“: Forderungspapier an die Bundesregierung vorgestellt Berlin, 16.1.23. Wenige Tage vor der großen „Wir haben es satt!“-Demonstration am 21. Januar fordert ein breites Bündnis aus Landwirtschaft und Gesellschaft von der Bundesregie­rung, das Höfe- und Insektensterben zu stoppen, die Klimakrise ernsthaft zu bekämpfen und gutes Essen für alle sicherzustellen. Auf einer Pressekonferenz in Berlin kritisieren Bündnis-Vertreter*innen, dass Agrarminister Cem Özdemir zu wenig für den notwendigen Umbau der Landwirtschaft und die sozial gerechte Ernährungswende unternimmt. Zeitgleich wurde der „6-Punkte-Plan für die sozial gerechte Agrarwende und gutes Essen für alle“ vorgestellt. Über 100 Organisationen aus allen gesellschaftlichen Bereichen – von Land­wirtschaft über Umwelt- und Sozialbereich, Gewerkschaften und Lebensmittelhandwerk bis hin zu Erwerbslosen-Initiativen – appellieren an die Bundesregierung, das Grundrecht auf umweltgerecht hergestelltes Essen umzusetzen, faire Erzeuger*innenpreise zu ermöglichen und gute Löhne zu sichern. „Gutes Essen für alle – statt Profite für wenige!“ lautet das Motto der Demonstration, bei der am Samstag zum Auftakt der Grünen Woche wieder viele Tausende auf die Straße gehen. Nach zwei Jahren pandemiebedingt kleinerer Aktionen demonstrieren Bäuer*innen, Imker*innen, Bäcker*innen gemeinsam mit Konsument*innen für eine bäuerliche Landwirt­schaft, artgerechte Tierhaltung, Artenvielfalt, konsequenten Klimaschutz, gentechnikfreie Lebensmittel und eine Beendigung des globalen Hungers. Inka Lange, Sprecherin des „Wir haben es satt!“-Bündnisses, sagt: „Gutes Essen hat seinen Preis und alle Menschen müssen sich gutes Essen leisten können. Wir erwarten von der Bundesregierung, dass sie den Zugang zu gesunden und umweltgerecht hergestellten Lebensmitteln für alle Menschen sicherstellt. Ein gutes Zusammenleben geht nur sozial und ökologisch. Deswegen brauchen wir mehr Tempo bei der sozial gerechten Agrar- und Ernährungswende.“ Helga Röller, ehrenamtlich aktiv bei der Nationalen Armutskonferenz, sagt: „Armut macht krank, das ist der Skandal. Menschen ohne oder mit geringem Einkommen müssen sich gesund und umweltgerecht ernähren können. Der Regelsatz der Grundsicherung liegt weit unter dem Lebensnotwendigen. Die Lücke von über 250 Euro muss geschlossen werden. Armutsfest werden müssen auch Mindestlohn, Tariflöhne und Renten.“ Georg Janßen, Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL), sagt: „Das Höfesterben geht ungebremst weiter und Agrarminister Özdemir schaut dabei wie seine Vorgängerin einfach zu. Er muss sich den Interessen der Agrarindustrie entgegenstellen und bäuerlichen Betrieben eine Zukunftsperspektive geben. Wir Bäuerinnen und Bauern sind bereit. Wir brauchen faire Erzeugerpreise und klare politische Leitlinien, dann klappt der Umbau der Landwirtschaft hin zu mehr Klima- und Tierschutz.“ Jörg Andreas Krüger vom Naturschutzbund (NABU) sagt: „Es gibt in Deutschland genügend Landwirtschaftsfläche, um die Menschen gerecht mit gesunden Lebensmitteln zu versorgen, ohne dass die Natur zerstört und das Klima weiter angeheizt wird. Dafür müssen landwirtschaftliche Produkte aber auf unseren Tellern landen, nicht im Trog oder Tank. Wenn wir aufhören, Flächen im großen Stil für die Tierfutterproduktion zu nutzen, können wir unsere Ernährung sichern und Natur und Klima schützen.“ Martin Kaiser von Greenpeace sagt: „Landwirtschaftsminister Özdemir hat die Herausforderungen der Landwirtschaft immer wieder klar benannt. Jetzt müssen seinen Worten Taten folgen. Statt den klimaschädlichen Konsum von Fleisch- und Milchprodukten durch die ermäßigte Mehrwertsteuer auch noch staatlich zu fördern, sollten pflanzliche Lebensmittel wie Obst und Gemüse von der Mehrwertsteuer befreit werden.“ Hintergrund: Die „Wir haben Agrarindustrie satt!“-Demonstration wird von Tausenden Bäuerinnen und Bauern – konventionell und bio – getragen, von denen etliche mit ihren Traktoren aus dem gesamten Bundesgebiet anreisen. Zusammen mit 60 Organisationen aus der Gesellschaft treten sie für eine Landwirtschafts- und Lebensmittelpolitik ein, in der Bauernhöfe faire Preise für ihre Lebensmittel erhalten und sich alle Menschen gesund ernähren können. Die Demonstration am 21. Januar beginnt um 12 Uhr am Brandenburger Tor. Auf der Bühne sprechen Edward Mukiibi (Slow Food International, Uganda), Maria Loheide (Diakonie Deutschland), Sefu Sani (World March of Women, Kenia), Helga Röller (nak) sowie Traktor-Fahrer*innen, Umweltschützer*innen und viele mehr. Alle Menschen, die sich für gute Land­wirtschaft und gesundes Essen einsetzen, sind herzlich willkommen. Weitere Informationen: www.wir-haben-es-satt.de Für Rückfragen: Inka Lange, “Wir haben es satt!“-Sprecherin, Mobil: 0163-1846765 , E-Mail: lange[at]meine-landwirtschaft[dot]de Helga Röller, ehrenamtlich aktiv bei der Nationalen Armutskonferenz (nak), Mobil: 0152-53847200, E-Mail: armutskonferenz[at]diakonie[dot]de Georg Janßen, Bundesgeschäftsführer Arbeitsgemeinschaft bäuerliche Landwirtschaft, Mobil: 0170-4964684, E-Mail: janssen[at]abl-ev[dot]de Jörg-Andreas Krüger, NABU-Präsident, Kontakt über Pressestelle, Mobil: 0152-59189658, E-Mail: julian.bethke[at]nabu[dot]de Martin Kaiser, Geschäftsführender Vorstand Greenpeace Deutschland, Kontakt über Pressestelle, Mobil: 0160-4339100, E-Mail: nina.kloeckner[at]greenpeace[dot]org Terminübersicht: Freitag, 20.01.23, ab 18 Uhr: „Schnippeldisko – Topf, Tanz, Talk“. Hunderte Engagierte kochen bei Vorträgen und Musik eine leckere Suppe für die Demonstration. Ort: Festsaal Kreuzberg, Am Flutgraben 2, 12435 Berlin.Samstag, 21.01.23, ab 8 Uhr: Traktor-Demonstration vom StadtGut Blankenfelde (Hauptstr. 24-30, 13159 Berlin-Pankow) zum Agrarministergipfel (s.u.). Gerne vermitteln wir schon im Vorfeld Interviews mit Bäuerinnen und Bauern, die mit dem Traktor aus dem gesamten Bundesgebiet anreisen.Samstag, 21.01.23, 10:15 Uhr: Übergabe der bäuerlichen Protestnote an Minister Özdemir beim Agrarministergipfel (Auswärtiges Amt, Werderscher Markt 1, 10117 Berlin).Samstag, 21.01.23, ab 12 Uhr: „Wir haben Agrarindustrie satt!“-Großdemonstration. Motto: „Gutes Essen für alle – statt Profite für wenige!“ Ort: Brandenburger Tor, Platz des 18. März, 10117 Berlin. Abschlusskundgebung ab ca. 14.30 Uhr am Brandenburger Tor. Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Telefon: 030-28482438, Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung PK-MITSCHNITT"
