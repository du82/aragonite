52-1345 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild2.jpg'); } } #carousel-backgroundimage-8052-1346 { background-image: url('/fileadmin/_processed_/4/0/csm_HmZ22_Bild4_226a1ba382.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-8052-1346 { background-image: url('/fileadmin/_processed_/4/0/csm_HmZ22_Bild4_65a7ce9db4.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8052-1346 { background-image: url('/fileadmin/_processed_/4/0/csm_HmZ22_Bild4_6a235cb0a9.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8052-1346 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild4.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-8052-1346 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild4.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-8052-1346 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild4.jpg'); } } #carousel-backgroundimage-8052-1347 { background-image: url('/fileadmin/_processed_/f/d/csm_HmZ22_Bild5_88d0f649c1.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-8052-1347 { background-image: url('/fileadmin/_processed_/f/d/csm_HmZ22_Bild5_ec89d2132d.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8052-1347 { background-image: url('/fileadmin/_processed_/f/d/csm_HmZ22_Bild5_1c8651ed30.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8052-1347 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild5.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-8052-1347 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild5.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-8052-1347 { background-image: url('/fileadmin/user_upload/aktionen/2022/Hof_mit_Zukunft/HmZ22_Bild5.jpg'); } } Zurück Weiter BILDER VIDEO Pressemitteilung „Hof mit Zukunft“: „Wir haben es satt!“-Bündnis bringt junge Aktivist*innen auf Bauernhöfe in ganz Deutschland (18.05.2022) Klima-, Tier- und Umweltschutz trifft Landwirtschaft – ein Wochenende auf dem Bauernhof (10.-12.6.) / Agrarwende-Bündnis fördert Dialog zwischen Stadt und Land Berlin/bundesweit, 18.05.22. Auf 25 Bauernhöfen im gesamten Bundesgebiet findet in drei Wochen „Hof mit Zukunft“ statt. Junge Aktivist*innen aus dem Klima-, Tier- und Umweltschutz verbringen dabei ein Wochenende auf dem Bauernhof. Konkret heißt das: Anpacken, disku­tieren und zusammen mit den Bäuerinnen und Bauern Forderungen für eine zukunftsfähige Agrarpolitik entwickeln. Das „Wir haben es satt!“-Bündnis, das regelmäßig Zehntausende für die Agrarwende auf die Straße bringt, will mit diesem spannenden Format den Austausch zwischen Jung und Alt und Stadt und Land fördern. Zwei Tage lang helfen die jungen, politisch engagierten Menschen beim Alltagsgeschäft auf biologisch und konventionell wirtschaftenden Höfen mit. Dahinter steht die Idee: Man lernt sich am besten kennen, wenn man sich gemeinsam die Hände dreckig macht. Statt auf vermeint­liche Gegensätze oder etwaige Vorurteile zu schauen, geht es bei „Hof mit Zukunft“ darum herauszufinden: Wo überschneiden sich die Interessen von Landwirt*innen, die Tag für Tag für gutes Essen auf unseren Tellern sorgen, mit denen der Aktivist*innen. Bei #HofMitZukunft werden unter anderem folgende Fragen diskutiert: Wie sieht die Realität auf einem landwirtschaftlichen Betrieb aus? Wie klappt der Umbau der Landwirtschaft und was muss sich politisch ändern, damit die Höfe eine gute Zukunft haben? Wie können wir Land­wirtschaft, Artenvielfalt und Klimaschutz wieder in Einklang bringen? Welche Verantwortung haben die Konsument*innen bei all dem? Termininformation: Hof mit Zukunft – Aktivismus trifft Landwirtschaft Wann: 10.-12. Juni 2022 Wo: auf 25 Höfen in ganz Deutschland (Kartenübersicht) Weitere Infos: www.wir-haben-es-satt.de/hofmitzukunft Über Ihre Berichterstattung – im Vorfeld und vor Ort – freuen wir uns! Gerne vermitteln wir Kontakte zu teilnehmenden Landwirt*innen und Aktivist*innen. Geeignete Tage für Hofbesu­che sind Freitag, 10. sowie Samstag, 11. Juni. Sprechen Sie uns gerne jederzeit an! Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Tel.: 030-28482438 Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Show larger version for: Mach mit! Du bist Landwirt*in oder Aktivist*in und willst an "Hof mit Zukunft" teilnehmen? Dann trage dich in unserer Vormerkliste ein oder abonniere unseren Newsletter. VORMERKLISTE NEWSLETTER FAQ Du hast Fragen zur Teilnahme bei "Hof mit Zukunft"? Hier findest du unsere FAQs: FÜR HÖFE FÜR AKTIVISTI'''
