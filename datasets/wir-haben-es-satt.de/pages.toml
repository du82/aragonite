["https://wir-haben-es-satt.de/mitmachen/hof-mit-zukunft/infos-fuer-teilnehmende"]
title = "Infos für Teilnehmende - Wir haben es satt!"
description = "Aktivismus meets Landwirtschaft. Ein Wochenende auf dem Bauernhof: Anpacken, diskutieren und Visionen für die zukünftige Landwirtschaft entwickeln. Sei dabei!"
full_description = "Infos für Aktivist*innen FAQ - Häufig gestellte Fragen An wen richtet sich Hof mit Zukunft? Gibt es eine Altersgrenze? Hof mit Zukunft ist das Format für Menschen, die aktiv für Klimagerechtigkeit, Umwelt/Tierschutz und die Agrar- und Ernährungswende kämpfen. Es gibt kein Mindestmaß an Aktivismus, wichtig ist vor allem Neugierde und Offenheit für den Austausch. Ab 16 Jahren kannst du teilnehmen. Nach oben haben wir keine Grenze festgelegt. Welche Höfe sind dabei? Es haben sich eine Reihe von Höfen gemeldet, die bereit sind, Interessierte bei Hof mit Zukunft aufzunehmen (siehe Karte). Wenn du teilnehmen möchtest, musst du das Bewerbungsformular ausfüllen. Dadurch wollen wir dich ein bisschen kennenlernen und so können wir besser einschätzen, wer wo am besten hinpasst. In dem Bewerbungsformular kannst du deine drei liebsten Höfe angeben. Sollten deine Prioritäten schon belegt sein, melden wir uns mit einem Alternativ-Vorschlag. Leider sind die Plätze begrenzt, daher können wir nicht garantieren, dass alle Interessierten dieses Mal dabei sein können. Die Bewerbungsfrist geht bis zum 19. Mai. Ab dann geben wir dir spätestens Bescheid, ob es geklappt hat und auf welchem Betrieb. Wie bewerbe ich mich und wie läuft das Auswahlverfahren? Die Bewerbung startet ab Anfang/Mitte April, bis dahin sind wir fleißig auf Hofsuche. Trage dich gerne in die Vormerkliste ein, und wir schreiben dir, sobald die Bewerbung offen ist! Sobald wir hier genug gefunden haben, werden wir diese auf einer Karte anzeigen und du kannst dich auf Höfe bewerben. Durch deine Bewerbung wollen wir dich ein bisschen kennenlernen und so können wir besser einschätzen, wer wo am besten hinpasst. In dem Bewerbungsformular kannst du deine drei liebsten Höfe angeben. Sollten deine Prioritäten schon belegt sein, melden wir uns mit einem Alternativ-Vorschlag. Leider sind die Plätze begrenzt, daher können wir nicht garantieren, dass alle Interessierten dabei sein können. Wann ist die An- und Abreise? Ist auch eine tageweise Teilnahme möglich? Du verbringst die gesamte Zeit vom 13.-16. Juni 24 auf dem Hof. Die Anreise findet am Donnerstagabend statt. Für Freitag und Samstag sind zwei ganze Hoftage geplant. Am Sonntag nach dem Frühstück trittst du wieder die Heimreise an. Bei manchen Höfen ist der Aufenthalt nur bis Samstagabend möglich, das teilen wir dir dann mit. Wichtig: Eine spätere Anreise oder frühere Abreise sind nicht möglich. Wie komme ich zum Hof? Muss ich die Anreise selbst zahlen? Wir gehen davon aus, dass du deine An- und Abreise zum Hof eigenständig organisierst und zahlen kannst. Deine Teilnahme soll aber nicht am Geldbeutel scheitern. Deswegen gibt es einen Soli-Topf. Falls du dir die Fahrtkosten nicht leisten kannst, vermerke das im Bewerbungsformular und wir schauen, wie wir dir helfen können. Hebe dafür auf jeden Fall deine Fahrkarte auf. Für jeden Hof wird es eine Messenger-Gruppe geben. Hier kannst du mit den anderen Aktivist*innen z.B. die gemeinsame Anreise planen und sonstige Absprachen treffen. Wie läuft das mit Unterkunft und Verpflegung auf dem Hof? Für Unterkunft und Verpflegung auf dem Hof ist gesorgt. Auf einigen Höfen können auch Betten zur Verfügung gestellt werden. Auf anderen Betrieben kann es sein, dass du im eigenen Zelt übernachtest, das ist auf der Hofübersicht im Bewerbungsformular markiert bzw. wird dir nocheinmal von uns mitgeteilt. Für die Verpflegung ist es wichtig für den Hof zu wissen, ob du Allergien oder besondere Ernährungsgewohnheiten hast (z.B. vegan/vegetarisch). Gib das im Bewerbungsformular an. Wie werde ich die Tage über mithelfen? Das ist je nach Hof unterschiedlich. Wenn schon Näheres bekannt ist, dann teilen wir das vorab mit. Genauere Infos dazu könnt ihr im Telefonat mit eurem Hof ein paar Wochen vor der Aktion erfragen. Wofür ist der Teilnahmebeitrag von 15 Euro? Die Kosten für Vermittlung, Übernachtung und Verpflegung werden von uns und den Höfen getragen. Die 15 Euro sind ein Zuschuss zur Pauschale, die wir den Höfen zahlen - und sie geben uns Planungssicherheit. Bei der Pilotphase von Hof mit Zukunft sind kurzfristig mehrere Teilnehmende abgesprungen. Deswegen wollen wir dieses Mal mehr Verbindlichkeit schaffen. Als Dankeschön für die Teilnahme bekommst du ein Wir haben es satt!-Shirt auf dem Hof. Im Falle deiner Absage können wir dir den bereits gezahlten Teilnahmebeitrag nicht zurückerstatten. Wie viele Personen werden pro Hof zugeteilt? Je nach Hof variiert die Zahl der Aktivist*innen, die dort teilnehmen können, zwischen 2 und 4. Wer profitiert von Hof mit Zukunft? Hoffentlich wir alle, indem wir den Dialog herstellen, etwaige Vorurteile abbauen und gemeinsam Wege und Strategien für eine tragfähige Zukunftslandwirtschaft finden. Es ist aber in jedem Fall ein Geben und Nehmen: Ihr bietet eure Mitarbeit an, die Landwirt*innen bieten euch Unterkunft und Verpflegung und nehmen sich Zeit für Einweisungen, Erläuterungen und die Diskussionen. Muss oder kann ich mich irgendwie vorbereiten? Du kannst dich natürlich schon vorher in landwirtschaftliche Themen einlesen und dich über die Agrarpolitik informieren. Das schadet nicht. Aber am Wichtigsten sind eine grundsätzliche Offenheit anderen Meinungen gegenüber und die Bereitschaft, in den Dialog zu treten. Eine interessante Lektüre zum Einlesen ist z.B. der Agrar-Atlas oder der Fleisch-Atlas. Was muss ich einpacken/brauche ich Arbeitskleidung? Ja, Kleidung die dreckig werden kann ist auf jeden Fall angebracht. Wir haben für euch eine Packliste erstellt. Darin ist alles vermerkt, was ihr für euren Hofaufenthalt benötigt. Mehr Details bekommt ihr von uns in der Bestätigungsmail vorab. Ich habe keine Ahnung von Landwirtschaft. Kann ich trotzdem mitmachen? Ja, natürlich! Das ist ja grade das Interessante an dem Projekt Hof mit Zukunft. Landwirt*innen treffen auf Aktivist*innen, ihr hört einander zu und lernt voneinander. Es ist für beide Seiten eine bereichernde Erfahrung und vielleicht können im Dialog Ideen für eine zukunftsfähige Landwirtschaft entstehen. Müssen wir uns bei den Diskussionen auf dem Hof immer einig sein? Nein, natürlich nicht. Wichtig ist, dass ihr euch respektvoll und auf Augenhöhe begegnet. So klappt das gegenseitige Kennenlernen und der Austausch am besten. Schön wäre, wenn ihr es schafft an dem Wochenende, ein paar gemeinsame Forderungen an die Politik zu formulieren. Kann ich Kinder oder Haustiere mitbringen? Nein, leider ist das nicht möglich. Da es nur zwei Tage sind finden wir es wichtig, dass alle sich voll und ganz auf die Arbeit und den Austausch fokussieren können. Schön und gut euer FAQ, aber ich habe noch Fragen ... Allgemeine Fragen beantworten wir gerne per Mail an hofmitzukunft[at]wir-haben-es-satt[dot]de oder telefonisch unter 030-28482437."
