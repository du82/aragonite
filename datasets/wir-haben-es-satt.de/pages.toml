["https://wir-haben-es-satt.de/berlin-15012024"]
title = "Berlin, 15.01.2024 - Wir haben es satt!"
full_description = 'Pressemitteilung 15. Januar 2024 PDF-VERSION PDF-VERSION Pressemitteilung 15. Januar 2024 Aufruf zur „Wir haben es satt!“-Demonstration am 20. Januar 2024 in Berlin: "Wir fordern solidarische Antworten der Politik auf das Höfe- und Artensterben, die Klimakrise und den Hunger in der Welt" Berlin, 15. Januar 2024: Die Trägerorganisationen des “Wir haben es satt!”-Bündnis fordern die Ampelregierung auf, die Zukunft der Landwirtschaft zu sichern. Dafür müsse die Bundesregierung für kostendeckende Erzeuger- und faire Bodenpreise sorgen sowie die Bäuer*innen beim anstehenden Umbau der Tierhaltung und bei einer umweltgerechten Landnutzung ausreichend unterstützen. Die „Wir haben es satt!“-Demonstration, findet am 20. Januar parallel zur Berliner Agrarministerkonferenz und kurz vor wichtigen Entscheidungen des Europäischen Parlaments zur Gentechnik-Regulierung statt. Die Organisator*innen erwarten wieder viele Tausend Teilnehmer*innen aus einer breiten Allianz von Landwirtschaft und Zivilgesellschaft. Unter dem Motto: „Gutes Essen braucht Zukunft! – für eine gentechnikfreie, bäuerliche und umweltverträgliche Landwirtschaft!” demonstrieren Bäuer*innen – konventionell und bio, von Tierhaltung bis Ackerbau – Gärtner*innen, Imker*innen, Natur-, Umwelt- und Tier-schützer*innen sowie Aktive der Entwicklungszusammenarbeit und Ernährungsbewegung. Inka Lange, Sprecherin des „Wir haben es satt!“-Bündnis fordert: „Der agrarpolitische Stillstand der letzten Jahrzehnte muss jetzt beendet werden. Die aktuellen Proteste von Bäuer*innen zeigen die Dringlichkeit, endlich solidarische Antworten auf das Höfe- und Artensterben, die Klimakrise und den Hunger in der Welt zu geben. Die Lösung steht seit Jahren im Raum: Eine ökologischere und bäuerliche Landwirtschaft ist die Basis für ein umweltverträgliches und krisenfestes Ernährungssystem, das Erzeuger*innen und Konsument*innen gleichermaßen gut und gerecht versorgt.“ Claudia Gerster, Bäuerin und Mitglied im Bundesvorstand der Arbeitsgemeinschaft bäuerliche Landwirtschaft: „Die Streichung der Agrardieselbeihilfe ist nur ein Auslöser. Die jahrzehntelange export-orientierte agrarpolitische Ausrichtung hat unsere Preise auf den Höfen ruiniert und das Höfesterben vorangetrieben. Wir Bäuerinnen und Bauern brauchen jetzt einen politischen Rahmen, damit wir kostendeckende Preise gegenüber Lebensmittelindustrie und Einzelhandel durchsetzen können und wir brauchen wirtschaftliche Planungssicherung für den anstehenden Umbau der Tierhaltung. Klimaschutz, Tierwohl und Artenvielfalt können wir, diese Arbeit muss aber entlohnt werden.“ Dem schließt sich Reinhild Benning, Agrarexpertin der Deutschen Umwelthilfe e.V. (DUH) an und zeigt am Beispiel der Fleischerzeugung die regionalen und globalen Konsequenzen der Agrarindustrie auf: „Die Ampel sollte die Bauernproteste und unsere Demo als Rückenwind auffassen und Vernunft in die Agrarpolitik bringen. In Deutschland werden 24 Prozent mehr Fleisch erzeugt als hierzulande nachgefragt wird. Bei Schweinefleisch liegt die Überproduktion sogar bei über 40 Prozent. Fleischkonzerne wie Tönnies profitieren und erhalten Millionen-Subventionen aus dem Topf für die Agrar-Marktordnung, um das nutzlose Schweinefleisch in privaten Lagern anzuhäufen. Diese Überproduktion drückt ebenso wie die Marktmacht der Konzerne die Erzeugerpreise nach unten und treibt Bauern und Bäuerinnen auf die Barrikaden. Die Bundesregierung muss uns vom Irrsinn der alten Agrarpolitik befreien und Erneuerung bringen. Die hervorragende Initiative des Bundestages für ein Faire-Erzeugerpreise-Gesetz muss zügig umgesetzt werden wie dies in anderen EU-Ländern längst geschehen ist. Agrarsubventionen müssen maximal umverteilt werden für Klima-, Arten- und definierten Tierschutz, Grünland und Ökobetriebe.“ Christoph Bautz, Geschäftsführender Vorstand von Campact, verweist auf die Verantwortung politischer Entscheidungsträger*innen in Deutschland und Europa, wo über die Gemeinsame Agrarpolitik die Richtung vorgegeben wird: „Die Wucht der Bauernproteste zeigt, wie viel sich in der Agrarpolitik ändern muss. Viele Landwirt*innen sind bereit, ihre Tiere artgerechter zu halten, die Artenvielfalt und das Klima zu schützen – aber nur, wenn die Politik in Berlin und Brüssel sie dabei nicht länger im Stich lässt. Die Bundesregierung muss dafür sorgen, dass die Bäuer*innen sich gegen Lebensmittelkonzerne und Bodenspekulanten erwehren können und faire Preise für ihre Produkte erhalten. Es braucht eine europäische Agrarpolitik, die den Landwirt*innen finanziell beim Umbau der Tierhaltung und umweltgerechter Landnutzung unter die Arme greift. Der derzeitige Rechtsruck gefährdet genau diese Bemühungen. Am nächsten Samstag treten Tausende Verbraucher*innen und Bäuer*innen für eine sozial gerechte und zukunftsfähige Landwirtschaft und ganz deutlich gegen Hass und Hetze ein.“ In Kürze steht das strenge Europäische Gentechnikgesetz auf dem Spiel, wenn das EU-Parlament Ende Februar über die Regulierung der Neuen Gentechnik abstimmt. Tina Andres, Vorstandsvorsitzende BÖLW e.V. dazu: „Neue Gentechniken wie CRISPR-Cas bedeuten noch mehr Patente für Konzerne und die Fortschreibung der Pestizid-Landwirtschaft – das ist das Gegenteil der sozial-ökologischen Agrarwende. Wenn neue Gentechnik nicht vernünftig reguliert und gekennzeichnet wird, verlieren Verbraucherinnen und Verbraucher die Freiheit, selbst über ihr Essen entscheiden zu können, und ökologische und konventionelle Betriebe und ihre Partner in Züchtung, Lebensmittelverarbeitung und Handel die Freiheit, ohne Gentechnik produzieren zu können und damit im In- und Ausland erfolgreich zu sein. Statt CRISPR-Kurzhalmmais brauchen wir mehr Bäume und Hecken in der Landschaft, statt CRISPR-Soja-Importen mehr heimische Eiweißpflanzen, statt noch mehr Abhängigkeit von der Agrochemie-Industrie mehr ökologische Alternativen für Betriebe und Unternehmen und statt noch mehr Konzentration im Saatgutmarkt mehr Vielfalt auf Acker und Teller.“ Gemeinsam rufen die Bündnispartner*innen zu einer solidarischen und friedlichen Demonstration am 20. Januar in Berlin auf: Für Höfe und Klima, gegen Gentechnik und Patente. Weitere Informationen Demonstration | www.wir-haben-es-satt.de Presse-Ressourcen | www.wir-haben-es-satt.de/presse Für Rückfragen Inka Lange, Sprecherin des „Wir haben es satt!“-Bündnis (0163) 1846765 | lange[at]meine-landwirtschaft[dot]de Berit Thomsen, AbL-Pressesprecherin (0157) 85075279 | thomsen[at]abl-ev[dot]de Reinhild Benning, Agrarexpertin DUH (0151) 17918487 | benning[at]duh[dot]de Iris Karolin Rath, Pressereferentin von Campact (0151) 22125420 | presse[at]campact[dot]de BÖLW-Pressestelle (030) 28482-307 | presse[at]boelw[dot]de Nicola Puell Presse- und Öffentlichkeitsarbeit Tel.: (030) 28482438 Mobil: (0151) 51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung 15. Januar 2024 PDF-VERSION PDF-VERSION'
