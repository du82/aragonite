title = "Berlin, 21.1.17 - Wir haben es satt!"
full_description = 'Pressemitteilung „Wir haben Agrarindustrie satt!“: 18.000 Bauern und Bürger fordern Wende in der Agrar- und Ernährungspolitik 130 Traktoren aus ganz Deutschland führen Demonstration an / Bündnis fordert in 9-Punkte-Plan tier-, umwelt- und klimagerechten Umbau der Landwirtschaft Berlin, 21.1.17. Parallel zur Grünen Woche zogen heute bei der „Wir haben es satt!“-Demonstration 18.000 Menschen für Bauernhöfe und den tier- und umweltgerechten Umbau der Landwirtschaft durch das Berliner Regierungsviertel. Angeführt von 130 Traktoren drückten die Demonstranten unter dem Motto „Agrarkonzerne, Finger weg von unserem Essen!“ lautstark ihren Protest gegen die Industrialisierung der Landwirtschaft aus. Bereits am Morgen hatten konventionell und ökologisch wirtschaftende Bauern am Bundeslandwirtschaftsministerium neun Forderungen zur Bundestagswahl überreicht. Der Tenor des 9-Punkte-Plans: Die gravierenden Krisen in der Landwirtschaft erfordern nicht folgenloses Reden, sondern entschlossenes Handeln. „Wir fordern ein Ende der Subventionen für die Agrarindustrie und den Stopp von Mega-Fusionen im Agrarsektor. Stattdessen brauchen wir Anreize für Bauern, die Tiere besonders artgerecht halten und umweltschonend wirtschaften“, sagt Jochen Fritz, Sprecher des „Wir haben es satt!“-Bündnisses, dem mehr als 100 Organisationen aus Landwirtschaft, Imkerei, Natur-, Tier- und Verbraucherschutz, Entwicklungsorganisationen und dem Lebensmittelhandwerk angehören. Fritz weiter: „Bundeslandwirtschaftsminister Schmidt muss endlich dafür sorgen, dass die bäuerlichen Betriebe vom gesellschaftlich gewollten Umbau hin zu einer ökologischeren, tierfreundlicheren Landwirtschaft profitieren. Herr Schmidt darf nicht noch mehr Zeit verlieren und muss Agrarpolitik für Bauern statt Agrarindustrie machen!“ Außerdem fordern die Demonstranten im Wahljahr unter anderem die konsequente Förderung von Bauernhöfen sowie die drastische Reduzierung von Pestiziden und Antibiotika. Das Bündnis kritisiert, dass aufgrund fehlgeleiteter Agrarpolitik in den vergangenen zehn Jahren mehr als 100.000 Bauernhöfe aufgeben mussten. Außerdem belaste die deutsche Agrarpolitik, insbesondere durch übermäßige Fleischproduktion, die Umwelt und das Klima und zerstöre durch Dumpingexporte kleinbäuerliche Strukturen überall auf der Welt. Gleichzeitig formierten sich immer größere, global agierende Konzerne. In der Fusion der Chemiekonzerne Bayer und Monsanto sieht das Bündnis eine große Bedrohung, da künftig mehr als 60 Prozent des Saatgut- und Agrochemiemarktes von drei Mega-Konzernen beherrscht würden. Die Kartellbehörden müssten verhindern, dass bäuerliche Betriebe und Konsumenten von patentiertem Saatgut abhängig werden. Auf dem Traktor eines Brandenburger Bauers war zu lesen: „Bayer und Monsanto, bleibt uns vom Acker!“ An der Spitze des Demonstrationszuges liefen zahlreiche junge Bäuerinnen und Bauern, die einen Hof gründen wollen. Ihnen fehlt aber vielfach der Zugang zu landwirtschaftlich nutzbarem Boden. Julia Rupp, 26-jährige Bäuerin aus Honhardt in Baden-Württemberg, sagte: „Als junge Generation wollen wir eine Zukunft auf dem Land, uns werden aber zu viele Steine in den Weg gelegt. Wir brauchen dringend ein Agrar-strukturgesetz, das Landkauf- und Pachtrechte bevorzugt an junge Bäuerinnen und Bauern gibt, nicht an Investoren. Wir müssen den Niedergang der bäuerlichen Landwirtschaft und des Lebensmittelhandwerks aufhalten, sonst kommt es zum Strukturbruch. Unsere Lebens- und Ernährungsgrundlage lassen wir uns nicht von Agrarkonzernen wegnehmen!“ Die Demonstration richtet sich gegen die Agrarindustrie, nicht aber gegen konventionelle Landwirte. Seit sieben Jahren praktiziert „Wir haben es satt!“ den Dialog zwischen Zivilgesellschaft, konventionellen und Öko-Bauern sowie Lebensmittelhandwerkern, um gemeinsam Wege für eine bäuerliche Zukunftslandwirtschaft zu finden. Fotos zur kostenfreien Verwendung in Kürze unter: flic.kr/s/aHskPWC4D7 (Urheber: „www.wir-haben-es-satt.de/Die Auslöser Berlin“) Pressekontakt:Christian Rollmann, „Wir haben es satt!“-Presseansprechpartner, presse(at)meine-landwirtschaft.de, Mobil: 0151 51245795 Statements von Rednerinnen und Rednern der Demonstration: Hubert Weiger, Vorsitzender des Bund für Umwelt und Naturschutz Deutschland (BUND): „Die jetzige Agrarpolitik ist verantwortlich für das Höfesterben, für Umweltschäden und den Artenschwund. Eine Agrarwende, die Bauern wieder eine Zukunft gibt, ist längst überfällig. Die Tierhaltung muss so gestaltet sein, dass sie gesellschaftliche Akzeptanz findet. Alle demokratischen Parteien sind gefordert, einem Weiter so in der Landwirtschaft eine klare Absage zu erteilen und die nötigen Reformen endlich in Angriff zu nehmen.“ Thomas Schröder, Präsident des Deutschen Tierschutzbundes:„Wir erleben einen tiefgreifenden gesellschaftlichen Wertewandel im Umgang mit Tieren in der landwirt-schaftlichen Erzeugung, und nicht zuletzt deshalb muss die Politik reagieren. Das Tierschutzgesetz lässt immer noch die millionenfache Qual von Tieren in landwirtschaftlicher Haltung zu: Männliche, lebensfähige Küken werden vernichtet, Ferkel immer noch unbetäubt kastriert und Millionen Tieren werden Körperteile amputiert, um sie leidvollen Haltungssystemen anzupassen. Das alles haben wir satt!“ Christoph Bautz, Geschäftsführer von Campact: „Eine beängstigende Welle von Fusionen rollt um den Globus. ChemChina übernimmt Syngenta, Dow Chemical Dupont und zuletzt Bayer Monsanto. Das ist nichts anderes als eine feindliche Übernahme – unserer Böden, unseres Saatguts, unseres Trinkwassers und unseres Essens. Doch diese feindliche Übernahme trifft heute hier auf unseren Widerstand.“ Miriam Mayet, African Center for Biodiversity, Südafrika und Partnerin von Brot für die Welt:„Nicht Konzerne ernähren uns, sondern die Bäuerinnen und Bauern der Welt. Daher müssen die Fusionen von Bayer-Monsanto und der anderen Konzerne verhindert werden. Sonst droht in vielen Staaten der Verlust der Saatgutsouveränität. Wir brauchen endlich die konsequente Förderung der alternativen Saatgutarbeit, von der Bäuerinnen und Bauern und agrarökologischer Züchter auf der ganzen Welt täglich leben. Die Regierungen müssen endlich handeln und die Macht der Konzerne begrenzen.“ Hans Bartelme, Bauer aus Baden-Württemberg und Naturland-Vertreter: „Die Landwirtschaft befindet sich in einer ökonomischen und ökologischen Krise und sie verliert die Akzeptanz der Bevölkerung. Bio zeigt erfolgreich seit vielen Jahrzehnten, wie es anders geht! Die Politik muss die große Nachfrage nach heimischen Bio-Produkten nutzen und mehr Bauern die Chance zur Umstellung auf Ökolandbau ermöglichen. Dazu müssen die Weichen konsequent auf Bio gestellt werden.“ Georg Janssen, Bundesgeschäftsführer Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL):„Wir Bäuerinnen und Bauern stellen uns der großen Herausforderung: Eine flächendeckende, umwelt- und klimaschonende Landwirtschaft mit tiergerechter Haltung zu schaffen. Dabei muss die Vielfalt der Höfe erhalten werden und viele kleine, mittlere und große Betriebe müssen wirtschaftlich mitgenommen werden. Unsere Partnerin ist nicht Agrarindustrie, wir setzen auf die Zivilgesellschaft.“Anke Kähler, „Die Freien Bäcker“, Initiatorin des Aufrufs von LebensmittelhandwerkerInnen:„Wir wollen gute Lebensmittel ohne Gentechnik und Pestizide für alle. Die Konzentrationsprozesse im Agrar- und Ernährungssektor und die bürokratischen Reglementierungen des Handwerks haben wir satt! Wir stehen ein für: transparente, faire und selbstbestimmte Wertschöpfungsketten vom Saatgut bis zum Brot. Dafür gehen wir heute gemeinsam mit KollegInnen aus anderen Gewerken auf die Straße.“ Guido Grüner, Arbeitslosenselbsthilfe Oldenburg, seit 2011 Träger der Demonstration:"Alle sollen sich gentechnikfrei, gesund, nachhaltig und mit menschenwürdig erzeugten Lebensmitteln ausgewogen ernähren können! Dafür braucht ein Erwachsener viel mehr als die 4,50 Euro, die aktuell im Hartz-IV-Satz für Nahrung enthalten sind. Wir fordern daher, das Arbeitslosengeld II allein schon für eine gute Ernährung um gut 100 Euro anzuheben, also auf deutlich über 500 Euro."Karen Hansen-Kuhn, Institute for Agriculture and Trade Policy, USA:“Hunderttausende demonstrieren dieser Tage in den USA gegen die reaktionäre Politik der neuen Regierung und im Kongress. Gemeinsam hat es die Zivilgesellschaft geschafft, dass die transpazifischen und transatlantischen Handelsabkommen TTIP und TPP auf Eis gelegt wurden. Auch in Zukunft werden wir Wi-derstand gegen diese schlechten Abkommen leisten sowie für gutes Essen und gute Landwirtschaft auf der ganzen Welt eintreten.“ Matthias Brümmer, Gewerkschaft Nahrung – Genussmittel – Gaststätten (NGG):„Die Selbstverpflichtung der Arbeitgeber in der Fleischindustrie ist gescheitert, sie bauen eben keine Stammbelegschaften auf und arbeiten weiter mit Werkverträgen. Selbstverständlich ist es richtig, dass mit den Tieren vernünftig umgegangen wird, jedoch bezweifeln wir die Sinnhaftigkeit des Tierschutzlabels. Denn wer mit seinen Beschäftigten nicht gut umgeht, der wird auch bei den Tieren sich nicht vorbildlich verhalten.“ Pressemitteilung'
