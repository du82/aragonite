title = "Koblenz/Brüssel, 30.08.2020 - Wir haben es satt!"
full_description = 'Pressemitteilung Die europäische Agrarwende voranbringen! Demonstration zum EU-Agrargipfel: Antiquierte Subventionspraxis beenden – Höfe erhalten, Insekten retten & Klima schützen / Auftakt für vielfältige Proteste in Koblenz Koblenz/Brüssel, 30.8.20. 1200 Menschen demonstrieren heute in Koblenz für eine grundlegende Wende in der europäischen Agrarpolitik. Zum Auftakt des EU-Agrargipfels, zu dem Bundeslandwirtschaftsministerin Julia Klöckner ihre Amtskolleg*innen an die Mosel einlädt, fordern die Demonstrant*innen die europäische Agrarwende. Angeführt von Bäuer*innen mit Traktoren ziehen junge Menschen in Tierkostümen, Imker*innen mit Smokern und Umweltaktivist*innen zum Koblenzer Schloss, wo sie sich lautstark Gehör verschaffen. Derzeit entscheidet sich, wie die 55 Milliarden Euro verteilt werden, die die EU künftig pro Jahr an die Landwirtschaft zahlt. Bei dem EU-Agrartreffen in Koblenz (30.8.-1.9.) werden die Weichen für die abschließenden Verhandlungen hierzu gestellt. Klar ist: Die pauschalen Flächensubventionen sind nicht mehr zeitgemäß. Bei der aktuellen Reform der gemeinsamen EU-Agrarpolitik (GAP) müssen Klima- und Insektenschutz vorangebracht, der Umbau der Ställe hin zu artgerechter Haltung finanziert und das Höfesterben beendet werden. Die Flächensubventionen nach dem Motto „Wer viel hat, dem wird gegeben“ befeuern einen massiven Konzentrationsprozess in der europäischen Landwirtschaft. Trotz hunderten Milliar­den Euro an Subventionen – jeder dritte Euro aus dem EU-Haushalt geht an die Landwirtschaft – mussten in der EU zwischen 2005 und 2016 über vier Millionen Bauernhöfe (29 Prozent) ihre Tore schließen. Die übrigen Betriebe bewirtschaften immer größere Flächen. (Quelle: Eurostat, Abb. 5) Von den Subventionen profitieren die, die auf Masse und nicht nachhaltig produzieren. Das muss sich ändern. Saskia Richartz, Sprecherin des „Wir haben es satt!“-Bündnisses, sagt: „Wir demonstrieren heute stellvertretend für Zigtausende in ganz Europa. Unser Auftrag an Julia Klöckner und die versammelten Minister*innen lautet: Jetzt umsteuern – verabschieden Sie sich von der antiquierten Förderpraxis! Nur wenn wir Insekten, Böden und das Klima schützen, den Pestizideinsatz reduzieren und Vielfalt auf den Acker bringen, sind wir bereit für die kommenden Herausforderungen. Hören Sie auf Landbesitz zu subventionieren und unterstützen Sie die Bauernhöfe in Europa jetzt bei der Agrarwende!“ Ralf Wey, Bauer aus Moselsürsch bei Koblenz und Landesvorsitzender der Arbeitsgemeinschaft bäuerliche Landwirtschaft in Rheinland-Pfalz (AbL), sagt: „Wir ackern tagtäglich für eine enkeltaugliche Landwirtschaft, doch es fehlt die Unterstützung der Politik für die notwendigen Veränderungen auf den Höfen. Die Fördergelder müssen zielgerichtet verteilt werden, dann sind artgerechte Tierhaltung und Klima- und Artenschutz machbar. Wir fordern von den Agrarminister*innen: Drehen Sie der Agrarindustrie den Geldhahn ab und investieren Sie endlich in den Umbau der Landwirtschaft!“ Annette Seehaus-Arnold, Präsidentin des Deutschen Berufs- und Erwerbsimkerbundes (DBIB), sagt: „Wir haben Agrarministerin Klöckner heute den schwarzen Pinsel für miserablen Insektenschutz verliehen. Sie hat angekündigt die Insekten zu retten, aber letztlich stand sie immer auf der Bremse. Die EU-Kommission will den Pestizideinsatz bis 2030 halbieren. Wo sind die Pläne zur Umsetzung dieses Ziels, Frau Klöckner? Ganz Europa schaut auf Ihren Vorsitz im EU-Agrarrat. Jetzt müssen Sie zeigen, dass Sie mehr als Ankündigungen können!“ Europäischer Protestbrief für die Agrarwende In der vergangenen Woche haben sich mehr als 400 bäuerliche und zivilgesellschaftliche Organisationen aus 12 EU-Mitgliedsstatten in einem offenen Brief an Agrarministerin Klöckner als Vorsitzende der Agrarminister*innen der EU gewandt. Die zentralen Forderungen des Briefes: Anpassung der Agrarpolitik an die Klima-und Biodiversitätsziele der EU, Beendigung des Höfesterbens und zielorientierte Förderpoliitk statt pauschaler Flächensubventionen. Offenen Brief lesen. Demonstrationsbündnis „Wir haben es satt!“ Bei der „Wir haben es satt!“-Demonstration gehen jedes Jahr im Januar Zehntausende in Berlin gegen die Agrarindustrie und für eine bäuerliche Zukunftslandwirtschaft auf die Straße. Bäuer*innen – ökologisch wie konventionell – kämpfen im Schulterschluss mit Umwelt-, Tier- und Klimaschützer*innen sowie Eine-Welt- und ernährungspolitischen Aktivist*innen für eine Wende in der Agrarpolitik – hin zu mehr ökologischer und bäuerlicher Landwirtschaft. Weitere Informationen: www.wir-haben-es-satt.de Weitere Protesttermine: Protestaktion: „Eure Agrarpolitik ist ein einziger Scherbenhaufen“ Zeit: Dienstag, 1. September 2020, 9:45 Uhr Ort: Rhein-Mosel-Halle, Julius-Wegeler-Straße 4, 56068 Koblenz Protestcamp (initiiert von der BUNDjugend Rheinland-Pfalz) Zeit: Sonntag, 30. August bis Dienstag, 1. September 2020 Ort: Kaiserin-Augusta-Anlagen (Nähe Schlossstufen), 56068 Koblenz Für Rückfragen: Saskia Richartz, “Wir haben es satt!“-Sprecherin, Mobil: 0177-8905054, E-Mail: richartz[at]meine-landwirtschaft[dot]de Ralf Wey, Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL), Mobil: 0157-855 45 193, E-Mail: ralf.wey[at]abl-rlp-saar[dot]de Annette Seehaus-Arnold, Deutscher Berufs- und Erwerbsimkerbund (DBIB), Mobil: 0151-6565 4020, E-Mail: annette.seehaus-arnold[at]berufsimker[dot]de Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Mobil: 0151-512 45 795 E-Mail: presse[at]meine-landwirtschaft[dot]de Fotos zur kostenfreien Nutzung Fotos zur kostenfreien Nutzung gegen Angabe der Quelle "Bernd Hartung/www.wir-haben-es-satt.de". Zum Download bitte auf das Bild klicken. Pressemitteilung'
