/5/csm_Banner_vor_Menge_267e273153.jpg'); } } Zurück Weiter Pressemitteilung 50.000 Menschen FORDERN DEN STOPP VON tierfabriken, Gentechnik und TTIp Bauern und Verbraucher gehen vereint für eine Agrarwende auf die Straße Berlin, 17.01.2015 Am heutigen Samstag gingen in Berlin zum fünften Mal Bäuerinnen und Bauern, Imkerinnen und Imker zusammen mit Verbraucherinnen und Verbrauchern für eine grundlegend andere Agrarpolitik auf die Straße. Das Bündnis fordert von der Bundesregierung eine klare Absage an das EU-USA-Handelsabkommen TTIP, einen wirksamen gesetzlichen Schutz der Land- und Lebensmittelwirtschaft vor der Gentechnik sowie den sofortigen Stopp des weiteren Ausbaus von Mega-Ställen. Ein Traktorenkonvoi mit über 90 Traktoren führte den Zug von 50 000 DemonstrantInnen an. Das „Wir haben es satt!“-Bündnis hat in den letzten Jahren viel erreicht: TTIP ist in aller Munde und 97% der Europäer lehnen mehr Macht für Konzerne ab. Bürgerinitiativen haben mit Hilfe des neuen Baugesetzes mehr als 100 Mega-Ställe verhindert. Gentechnik hat durch das Engagement einer breiten Bewegung auf unseren Äckern keinen Fuß gefasst. Doch dies sind nur die Anfänge einer dringend notwendigen Agrarwende für eine Zukunft der Landwirtschaft in bäuerlicher Hand mit Rückhalt in der Gesellschaft. „Das EU-USA-Handelsabkommen (TTIP) dient einseitig global agierenden Konzernen und wird vielen bäuerlichen Betrieben hier und weltweit die Existenzgrundlage entziehen. Gleichzeitig drohen die Verbraucherstandards gesenkt zu werden“, sagt Jochen Fritz, Sprecher des „Wir haben es satt!“-Bündnisses. „Das heißt mehr Gentechnik im Trog und Hormonfleisch durch die Hintertür. Deswegen fordern wir von Bundeskanzlerin Angela Merkel und Bundeswirtschaftsminister Sigmar Gabriel TTIP zu stoppen!“ Auch die Agrarpolitik der Bundesregierung wird von den Veranstaltern scharf kritisiert: Sie habe dazu beigetragen, dass beispielsweise seit dem Jahr 2000 mehr als Dreiviertel der SchweinehalterInnen aufgegeben haben, während Fleischkonzerne zunehmend die Tierhaltung übernähmen. Trotz eines Selbstversorgungsgrades mit Fleisch von 120 % würden weiter Mega-Ställe in Deutschland genehmigt. „Die Strategie, die Produktion immer weiter auszudehnen, was zu Dumping-Exporten auf dem Weltmarkt führt, ist gescheitert. Die Landwirtschaft in Deutschland braucht eine Zukunft jenseits von Tierfabriken und Mega-Schlachthöfen“, so Fritz weiter. „Wenn die Bundesregierung jetzt nicht handelt, zementiert sich eine agrarindustrielle Struktur, die nicht mehr veränderbar ist. Die Zukunft liegt in der Ernährungssouveränität auf Basis regionaler Märkte.“ Informationen: Die Demo-Forderungen beruhen auf den Fakten des Weltagrarberichts, in dem 400 internationale WissenschaftlerInnen eine Neuausrichtung der Landwirtschaft fordern: www.weltagrarbericht.de Pressespiegel Fernsehen/Videos ARD Tagesschau RBB Abendschau RBB Aktuell (ab Min. 1:05) Tagesspiegel Online Focus Online Euronews AgrarHeute Deutsche Welle Bayerischer Rundfunk HR Hessenschau (Hintergrund-Bericht) NDR Mecklenburg-Vorpommern ZDF (Hintergrund zu TTIP und Demo) Print- und Onlinemedien Bauernstimme Spiegel Online Berliner Zeitung taz - die Tageszeitung Junge Welt Berliner Morgenpost FR Online Der Freitag Kölner Stadtanzeiger Neues Deutschland Hannoversche Allgemeine Rundschau Online RP Online Stern.de Donaukurier Die Welt B.Z. Berlin Bild.de MDR.de ntv.de Proplanta.de Oberhessische Zeitung Schwarzwälder Bote Radio MDR Figaro Radio Hamburg Deutschlandfunk Deutschlandradio Kultur (Hintergrund) Internationale Medien RT.com (englisch) Radyo Kassel (türkisch) Euronews (italienisch) Deutsche Welle (polnisch) Biorama.eu FM4 vom ORF.at (Hintergrundbericht) German Daily News"
