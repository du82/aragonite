title = "Demo 2011 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Fernsehen/Videos: ZDF - heuteARD - 17-Uhr-TagesschauARD - BrisantRBB - AbendschauMDR - Aktuellarte - JournalFAZ (Bericht mit Video von Reuters) graswurzel.tvMehr Demokratie e.V.Du hast die Macht (zur Schweineaktion) Print- und Onlinemedien: Berliner MorgenpostBerliner ZeitungDer TagesspiegelTAZ.deZeit onlineFokus onlineWelt onlineHandelsblattFR online (mit Bildergalerie)FAZ.netBILD HannoverAbendzeitungRP online (mit Bildergalerie)Badische ZeitungSüdwest PresseSchwäbische ZeitungStuttgarter NachrichtenAugsburger AllgemeineOberbayerisches VolksblattNürnberger NachrichtenInnsalzach24.de über Soli-Demo in BayernWeser-KurierPeiner Allgemeine ZeitungAK-KurierOsthessen NewsOstthüringer ZeitungMärkische AllgemeineNordwest-ZeitungUsedom KurierUnser LübeckMindener TageblattAhlener ZeitungNeue Rheinische ZeitungJunge WeltNeues Deutschland (mit Bildergalerie)Scharf linksIndymediaZeitfokus onlineDer Standard (Österr.)Bieler Tagblatt (Schw.)Liechtensteiner Vaterland (Liecht.)Kristeligt Dagblad (Dänem.)N-TVNDR (mit Bildergalerie)ReutersAd-hoc-newsProplanta (mit dpa)top agrar online - Sonnleitners große Klarstellung ggü. KritikernBlog-Eintrag zur Soli-Demo in Bremen Radio Deutschlandradio Kultur - Im GesprächDeutschlandfunk - Interview (vom Vortag) Bildergalerien Süddeutsche onlineKlimaretter.infoStadtmorgen.deturus.net 1. WIR HABEN ES SATT!-Demonstration am 22. Januar 2011 AUFRUF Wir wollen eine bäuerlich-nachhaltige Landwirtschaft und keine Agrarindustrie! Die Bilanz der Agrarpolitik der letzten Jahrzehnte ist düster: In immer mehr Tierfabriken wird der Tierschutz verletzt und gefährliche Antibiotikaresistenzen entstehen. Bauernhöfe sterben und Landschaften „vermaisen“. Mehr Pestizide lassen weltweit die Bienen sterben und die Artenvielfalt nimmt rapide ab. Die Spekulation mit Lebensmitteln und Land verschärft den Hunger in der Welt. Dafür landet immer mehr Getreide im Tank statt auf dem Teller. Es ist Zeit für eine Wende! Die Landwirtschaft befindet sich in Deutschland, Europa und weltweit in einem tiefen Umbruch. Im Jahr 2013 stehen wichtige Weichenstellungen bevor. Bei der Bundestagswahl steht auch zur Abstimmung, ob es zu einer nachhaltigen Ernährungs- und Energiewende kommt. In der EU wird entschieden, ob eine bäuerlich-nachhaltige Landwirtschaft unterstützt wird oder jährlich weitere 60 Milliarden Euro an Agrarsubventionen vor allem an die Agrarindustrie fließen. Weltweit entscheidet die internationale Staatengemeinschaft, ob die die bäuerliche Landwirtschaft gestärkt wird, um den Hunger zu bekämpfen und das Recht auf Nahrung für alle zu verwirklichen. Wir haben es geschafft die Gentechnik von den Feldern zu vertreiben. Jetzt machen wir Druck für eine ökologisch-soziale Agrarwende. Vor dem Kanzleramt in Berlin fordern wir:Tierfabriken und Antibiotika-Missbrauch stoppen Subventionen an soziale, ökologische und Tierschutz-Kriterien binden weltweit faire Regeln für eine bäuerliche Landwirtschaft durchsetzen statt die Agrarmärkte weiter zu liberalisierenHeimisches Futter fördern statt Futtermittelimporte mit Gentechnik-Soja Spekulation mit Lebensmitteln und Land, sowie die EU-Exportförderung beendenBienen- und klimafreundliche Landwirtschaft anstelle von Monokulturen fördernWir schätzen die tägliche Arbeit der Menschen auf den Bauernhöfen. Sie müssen im Zentrum von Reformen stehen! Kommen Sie als VerbraucherIn zur Demo! Bäuerinnen und Bauern setzt mit Euren Traktoren ein bäuerliches Zeichen! ImkerInnen und GärtnerInnen seid in Eurer Berufskleidung mit dabei! Fronttranspi slowfarmer Trecker Iss dich doch selbst Bauernhöfe statt Agrarfabriken Traktor Kartoffeln #carousel-backgroundimage-1196-122 { background-image: url('/fileadmin/_processed_/1/5/csm_Fronttranspi_8230981c26.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1196-122 { ba