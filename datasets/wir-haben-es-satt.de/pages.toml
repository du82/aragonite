full_description = 'Hintergrundinfos: Positionspapier Neue Gentechnik Resolution Neue Gentechnik der Jugendverbände Stellungnahme gentechnikfreie Lebensmittelerzeugung Greenwashing in der Gentechnikdebatte Argumente der Gentechnik-Industrie kritisch hinterfragt Forderungen und Hintergründe des Bündnisses „No Patents on Seeds“ Patente auf Saatgut Zugang zu Saatgut Patente auf Pflanzen und Tiere gefährden Nahrungsmittelsicherheit Hintergründe zur neuen Gentechnik Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Gentechnikfreiheit sichern, Patente stoppen Über 25 Jahre Gentechnik in der Landwirtschaft haben weder den Hunger in der Welt besiegt noch leisten gentechnisch veränderte Pflanzen und Tiere einen Beitrag für eine zukunftsfähige, klimaschonende und widerstandsfähige Landwirtschaft. Stattdessen sichern sich Gentechnik-Konzerne wie Bayer (Monsanto), Corteva (Dow/DuPont), BASF, Syngenta und KWS ihre Vormachtstellung im Saatgutmarkt mit gentechnisch verändertem Saatgut und Patenten. Dies verhindert den freien Zugang zu Saatgut, blockiert Züchtung und schafft enorme Abhängigkeiten für Erzeuger*innen weltweit. Die von den Konzernen geplante Abschaffung der Gentechnik-Regeln würde diese Probleme massiv verschärfen. Im Ergebnis hätte die Menschheit noch weniger Vielfalt auf Acker und Teller. Unsere Forderungen: Deregulierung der neuen Gentechniken (CRISPR & Co.) stoppen Vorsorgeprinzip sichern: strikte Risikoprüfung aller gentechnisch veränderten Organismen Lückenlose Kennzeichnung und echte Wahlfreiheit entlang der gesamten Lebensmittelkette vom Saatgut bis zum Teller Keine Patente auf Pflanzen und Tiere und deren genetische Eigenschaften – freier Zugang zu Saatgut für alle Hintergrundinfos: Positionspapier Neue Gentechnik Resolution Neue Gentechnik der Jugendverbände Stellungnahme gentechnikfreie Lebensmittelerzeugung Greenwashing in der Gentechnikdebatte Argumente der Gentechnik-Industrie kritisch hinterfragt Forderungen und Hintergründe des B