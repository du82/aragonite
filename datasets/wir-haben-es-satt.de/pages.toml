["https://wir-haben-es-satt.de/presse-archiv/berlin-18117"]
title = "Berlin, 18.1.17 - Wir haben es satt!"
full_description = 'Pressemitteilung „Bayer und Monsanto, bleibt uns vom Acker!“ Bauern und Imker demonstrieren vor Berliner Bayer-Sitz für eine bäuerliche und bienenfreundliche Landwirtschaft Berlin, 18.01.2017. Heute Morgen demonstrierten Bauern und Imker im Schulterschluss mit engagierten Bürgern gegen die geplante Elefantenhochzeit von Bayer mit Monsanto vor dem Berliner Sitz der Bayer AG. Wenige Tage vor der „Wir haben es satt!“-Demonstration brachten die 50 Demonstranten mit einem Traktor und einem zehn Meter langen Anhänger, auf dem „Bayer und Monsanto, bleibt uns vom Acker!“ zu lesen war, ihre Wut gegen die fortschreitende Konzentration im Saatgut- und Pestizidbereich zum Ausdruck. Einer der anwesenden Imker, die in ihrer Berufskleidung mit Bienenkästen und Smokern gekommen waren, hatte eimerweise tote Bienen mitgebracht, um auf das dramatische Bienensterben hinzuweisen. Die Kritik der Demonstranten: Der Agrar- und Chemieriese Bayer-Monsanto würde bei erfolgreicher Fusion über rund 30 Prozent der Marktanteile des weltweiten Saatgut- und Agrochemiemarktes verfügen. Diese kritische Marktkonzentration würde die freie Saatgutwahl von Millionen Bauern gefärden, die Bedrohungen für Mensch, Umwelt, Biene und Co. durch die Agrarindustrie würden weltweit steigen. Nicht nur Monsanto, sondern auch die Bayer AG macht mit der Agrarsparte Bayer Crop Science weltweit Geschäfte mit Pestiziden und dem passenden, gentechnisch manipulierten Saatgut. Der Konzern hält viele Patente auf Pflanzen und Tiere, außerdem ist er mit der Verbreitung von Insektiziden wie Neonikotinoiden maßgeblich verantwortlich für das verheerende Bienensterben. Bei der Protestkundgebung sagte Heinz Günther Klaas, Ackerbauer und Saatgutvermehrer aus Wiesenhagen in Brandenburg: „Die geplante Fusion von Bayer und Monsanto bedroht nicht nur die Saatgutvielfalt, sondern auch die Existenz vieler Bauern! Als Saatgutvermehrer will ich auch in Zukunft freies Saatgut ohne Gentechnik nutzen können. Es ist eine Anmaßung, dass Megakonzerne wie Bayer und Monsanto versuchen, Patente auf mein Saatgut anzumelden. Unsere Schöpfung darf nicht patentiert werden. Ich sage: ‚Bayer und Monsanto, Finger weg von unserem Saatgut!‘“ Imker Günther Jesse aus Werneuchen in Brandenburg erklärte: „Wenn Bienen vom Land in Städte flüchten, dann läuft etwas gewaltig schief. Bayer und Monsanto stehen für eine Landwirtschaft mit immer höherem Pestizideinsatz. Als Imker wollen wir gesunden Honig aus blühenden Landschaften erzeugen. Die geplante Fusion lehnen wir ab!“ Jochen Fritz, Nebenerwerbslandwirt aus Werder und Mitorganisator der „Wir haben Agrarindustrie satt!“-Demonstration rief zur Teilnahme an der Demonstration auf: „Alle, die sich für eine bäuerliche und bienenfreundliche Landwirtschaft einsetzen und gesundes Essen für alle wollen, sollten am Samstag zur Demonstration kommen. Ich fordere die Bundesregierung, die EU-Wettbewerbskommissarin Margrethe Vestager und das Bundeskartellamt auf, die Megafusion im Interesse der Bevölkerung zu verhindern. Bayer und Monsanto, Finger weg von unserem Essen!“ Die Demonstration beginnt am 21.1. um 12 Uhr am Potsdamer Platz in Berlin und steht unter dem Motto „Agrarkonzerne, Finger weg von unserem Essen!“. Die 100 aufrufenden Organisationen haben im Wahljahr neun Forderungen für die Agrar- und Ernährungswende vorgelegt. Fotomaterial zur kostenfreien Verwendung in druckfähiger Qualität ab 12 Uhr unter www.wir-haben-es-satt.de/presse Pressekontakt:Christian Rollmann, „Wir haben es satt!“, Mobil: 0151-51245795, Mail: rollman(at)meine-landwirtschaft.de Fotos vom Bauern- und Imkerprotest zur freien Verwendung unter Angabe der Quelle "wir-haben-es-satt.de". Ein Klick auf das Bild führt zu der Version in hoher Auflösung. Alle Fotos finden Sie hier: Flickr Pressemitteilung'
