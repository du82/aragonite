["https://wir-haben-es-satt.de/presse-archiv/berlin-30062020"]
title = "Berlin, 30.06.2020 - Wir haben es satt!"
full_description = 'Pressemitteilung „Schluss mit den Lippenbekenntnissen, Frau Klöckner!“: Bauernhöfe, Tiere und Umwelt brauchen ambitionierte Politik, nicht leere Phrasen „Wir haben es satt!“-Bündnis fordert zukunftsfähige EU-Agrarreform (GAP) / Klöckner muss Interessenvertretung für die Industrie beenden und Worten Taten folgen lassen Berlin, 30.6.2020. Kurz vor Beginn der EU-Ratspräsidentschaft demonstrieren heute zahlreiche Menschen mit dem Konterfei von Landwirtschaftsministerin Julia Klöckner vor dem Brandenburger Tor in Berlin. Auf Schildern, die die Demonstrant*innen sich um den Hals gehängt haben, sind die Versäumnisse der Agrarministerin aufgelistet: „Höfesterben“, „Billig-Fleisch“, „Tierfarbriken“, „Artensterben“, „Industrie-Lobby“ und „leere Phrasen“ lauten einige der Kritikpunkte. Das „Wir haben es satt!“-Bündnis, das die Protestaktion initiiert hat, fordert damit eine EU-Agrarreform für Bauernhöfe, Tiere und die Umwelt. Klöckner kommt bei den finalen Verhandlungen zur Reform der Gemeinsamen EU-Agrarpolitik (GAP) während der morgen beginnenden deutschen EU-Ratspräsidentschaft eine zentrale Rolle zu. Doch trotz anders lautender Ankündigungen weigert sich die Ministerin bislang, sich für eine zukunftsfähige Agrarreform einzusetzen. Statt weiterhin pauschal mit Flächensubventionen Landbesitz zu belohnen, müssen landwirtschaftliche Betriebe gezielt beim Umwelt- und Klimaschutz, dem Umbau der Ställe und dem Erhalt des ländlichen Raums unterstützt werden. Saskia Richartz, Sprecherin des „Wir haben es satt!“-Bündnisses, sagt: „Frau Klöckner ist eine Ankündigungsministerin, das ist beim Fleischgipfel erneut deutlich geworden. Wir messen die Politik Klöckners nicht an Werbekampagnen und substanzlosen Lippenbekenntnissen, sondern an den Resultaten. Wir brauchen einen grundlegenden Systemwechsel in der Agrarpolitik. Bei der EU-Agrarreform muss Klöckner jetzt Verhandlungsgeschick und Durchsetzungskraft beweisen, um die Agrarwende in Europa auch gegen die Interessen des Bauernverbands und der Großkonzerne voranzubringen.“ Friedhelm von Mering vom Bund Ökologische Lebensmittelwirtschaft (BÖLW) sagt für die bäuerlichen Organisationen im Bündnis: „Obwohl die EU Jahr für Jahr Milliardenbeträge für die Landwirtschaft ausgibt, mussten in den letzten Jahren europaweit Hunderttausende Höfe schließen. Mit Steuergeld muss gesteuert werden und zwar zielgerichtet in Richtung Zukunft. Wir müssen weg vom Gießkannen-Prinzip, das vor allem Landbesitz belohnt. Stattdessen muss die EU die Landwirt*innen unterstützen, die den Umbau hin zu mehr Umwelt-, Tier- und Klimaschutz anpacken.“ Trees Robijns, Referentin für EU-Agrarpolitik beim NABU, sagt für die zivilgesellschaftlichen Organisationen: "Bundeslandwirtschaftsministerin Julia Klöckner muss jetzt die Chance der deutschen Ratspräsidentschaft nutzen, um die für Klima und Umwelt dringend notwendige Agrarreform in Europa umzusetzen. Zu diesem Ziel kommen wir nur, wenn wir uns konsequent an den Green Deal halten und Landwirt*innen bei der zukunftsfähigen Gestaltung ihrer Betriebe unterstützen." Hintergrund: In den nächsten Monaten werden im Rat der Europäischen Union die Verhandlungen über die nächste Förderperiode der gemeinsamen EU-Agrarpolitik (GAP) unter der Leitung von Klöckner finalisiert: Es muss ein Kompromiss zwischen Rat, EU-Parlament und EU-Kommission ausgehandelt werden. Dabei entscheidet sich, wie die rund 60 Milliarden Euro pro Jahr in den kommenden sieben Jahren verteilt werden. Mit den Fördergeldern und den weiteren GAP-Richtlinien wäre die Agrarwende in Europa zu stemmen. Ein weiterer Aufschub würden Höfe, Nutztiere und die Insekten nicht verzeihen. Initiiert wurde der Protest vom breiten „Wir haben es satt!“-Bündnis, das alljährlich im Januar zehntausende Menschen aus Landwirtschaft und Gesellschaft zum Auftakt der „Grünen Woche“ in Berlin auf die Straße bringt. Gemeinsam treten die rund 60 im Bündnis zusammengeschlossenen Organisationen für eine Landwirtschaft ein, die Tiere artgerecht hält, Umwelt und Klima schützt und gutes Essen für alle herstellt. Aktuell formiert sich europaweit Protest für eine zukunftsfähige Landwirtschaft: In der zweiten Jahreshälfte werden Menschen in ganz Europa von der deutschen Ratspräsidentschaft eine Wende in der Agrarpolitik fordern. Weitere Informationen: www.wir-haben-es-satt.de Für Rückfragen: Saskia Richartz, „Wir haben es satt!“-Bündnis, Tel: 0177/890 50 54, E-Mail: richartz[at]meine-landwirtschaft[dot]de Friedhelm von Mering, Bund Ökologische Lebensmittelwirtschaft (BÖLW), Tel: 030/284 82 306, E-Mail: mering[at]boelw[dot]de Trees Robijns, Naturschutzbund Deutschland (NABU), Tel: 0173/472 61 22, E-Mail: Trees.Robijns[at]NABU[dot]DE Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Fotos zur kostenfreien Nutzung Fotos zur kostenfreien Nutzung gegen Angabe der Quelle "Moritz Richter/www.wir-haben-es-satt.de". Zum Download bitte auf das Bild klicken. Pressemitteilung'
