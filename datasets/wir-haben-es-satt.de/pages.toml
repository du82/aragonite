ter FLICKR-ALBUM VIDEO Pressemitteilung „Hof mit Zukunft“: „Wir haben es satt!“-Bündnis bringt junge Aktivist*innen auf Bauernhöfe in ganz Deutschland Klima-, Tier- und Umweltschutz trifft Landwirtschaft – ein Wochenende auf dem Bauernhof (15.-18.6.) / Agrarwende-Bündnis fördert Dialog zwischen Stadt und Land Berlin/bundesweit, 25.05.23. Auf rund 30 landwirtschaftlichen Betrieben im gesamten Bundesgebiet findet in drei Wochen „Hof mit Zukunft“ statt. Junge Aktivist*innen aus dem Klima-, Tier- und Umweltschutz verbringen dabei ein Wochenende auf dem Bauernhof. Konkret heißt das: Anpacken, diskutieren und zusammen mit den Bäuerinnen und Bauern Forderungen für eine zukunftsfähige Agrarpolitik entwickeln. Das „Wir haben es satt!“-Bündnis, das regelmäßig viele Tausende für die Agrarwende auf die Straße bringt, will mit diesem spannenden Format den Austausch zwischen Jung und Alt und Stadt und Land fördern.Zwei Tage lang helfen die jungen, politisch engagierten Menschen beim Alltagsgeschäft auf biologisch und konventionell wirtschaftenden Höfen mit. Dahinter steht die Idee: Beim gemeinsam die Hände dreckig machen lernt man sich am besten kennen. Statt auf vermeintliche Gegensätze oder etwaige Vorurteile zu schauen, geht es darum herauszufinden: Wo überschneiden sich die Interessen von Landwirt*innen, die Tag für Tag für gutes Essen auf unseren Tellern sorgen, mit denen der Aktivist*innen. Bei #HofMitZukunft werden unter anderem folgende Fragen diskutiert: Wie sieht die Realität auf einem landwirtschaftlichen Betrieb aus? Wie klappt der Umbau der Landwirtschaft und was muss sich politisch ändern, damit die Höfe eine gute Zukunft haben? Wie können wir Land-wirtschaft, Artenvielfalt und Klimaschutz wieder in Einklang bringen? Welche Verantwortung haben die Konsument*innen bei all dem? Termininformation: Hof mit Zukunft – Aktivismus trifft Landwirtschaft Wann: 15.-18. Juni 2023 Wo: auf rund 30 Höfen in ganz Deutschland (Kartenübersicht) Weitere Infos Video-Rückblick Hof mit Zukunft ´22 Über Ihre Berichterstattung – im Vorfeld und vor Ort – freuen wir uns! Gerne vermitteln wir Kontakte zu teilnehmenden Landwirt*innen und Aktivist*innen. Geeignete Tage für Hofbesuche sind präferiert Samstag, der 17. Juni oder alternativ Freitag, der 16. Juni. Sprechen Sie uns gerne jederzeit an! Pressekontakt: Julia Güttler „Wir haben es satt!“-Pressesprecherin Tel.: 030-28482438Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Show larger version Mach mit! Du bist Landwirt*in oder Aktivist*in und willst an "Hof mit Zukunft" teilnehmen? Dann trage dich in unserer Vormerkliste ein oder abonniere unseren Newsletter. VORMERKLISTE NEWSLETTER FAQ Du hast Fragen zur Teilnahme bei "Hof mit Zukunft"? Hier findest du unsere FAQs: FÜR HÖFE FÜR AKTIVISTI'''
