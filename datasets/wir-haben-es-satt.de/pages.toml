title = "Treckerpatenschaft - Wir haben es satt!"
full_description = "Show larger version HERZLICHEN DANK AN ALLE TRECKERPAT*INNEN! Georg Janßen IG Nachbau Anita Idel (Agrobiodiversität und Tiergesundheit) Betriebsratsberatung Dr. Frank Havighorst Vera und Dieter Choulant Michaela Möhn Simone Götz Obst-Arboretum Olderdissen Doris und Fritz Haspel Renate Schmidtke & Tobias Wagner (Winninghausen) Guido Schönherr Bärbel und Jörg Endraß (Biohof Endraß) Georg Petau (Obstwiesenverbund Pyrmonter Bergdörfer) EcoMujer e.V. Mitteldeutsche Imkerunion e.V. Elisabeth Peters DIE LINKE (KV Coesfeld) Reiner Claus LBZ Emmendingen-Hochburg (Ökolandbau-Meisterklasse 2025) Kollektiv Lichtung AbL Landesverband Baden-Württemberg HOFbauernHOF Sascha Maier Ökolandbauzentrum NDS Sebastian Keil Alexandra Burmann und Yunus Waqar Helga Pukall (Gesundheitsgarten Marburg) Hans-Joachim Klöss Solawi Wangen e.V. ZUR TRECKER-SEITE Anmerkung aus dem Organisationsbüro Aus gegebenem Anlass werden zur diesjährigen Demo keine Trecker anreisen. Auf Grund der Kurzfristigkeit der Absage der Treckerdemo, sind dennoch Kosten für die bisherige Organisation und die Planung entstanden. Die bereits eingegangenen Spenden für die Treckerpatenschaften werden damit zu 100% in die bisherige Planung fließen. Bei Einwänden gegen dieses Vorgehen können Sie sich gerne bei uns melden. Mehr Infos Treckerpatenschaft übernehmen! Unterstützt unsere Bäuerinnen und Bauern 2025 werden sich wieder Bäuerinnen und Bauern mit ihren Traktoren aus Brandenburg und bundesweit auf den Weg machen, um in Berlin ein Zeichen zu setzen - für eine bäuerliche und klimaverträgliche Landwirtschaft. Sie werden den Demozug anführen und am Ende das Aktionsbild der Demo unterstützen. Dieses Engagement kostet die Bäuerinnen und Bauern nicht nur viel Zeit, sondern auch eine Menge Geld. Unterstützt sie dabei: Werdet Treckerpat*in! Wie übernehmt ihr eine Treckerpatenschaft? Ihr spendet 100 Euro oder mehr an unten angegebene Bankverbindung oder via PayPal. Das Geld wird direkt an die Bäuerinnen und Bauern weitergeleitet, die mit ihren Treckern demonstrieren und hilft uns, die Organisation rund um die Trecker zu stemmen. Wenn ihr in der Liste der Pat*innen genannt werden möchtet, schreibt uns nach der Spende eine E-Mail mit Namen und ggf. Organisation an Jesper Humrich humrich[at]meine-landwirtschaft[dot]de. Wir nennen die Spender*innen dann auf Tafeln an den Treckern und hier auf der Website. Danke für eure Unterstützung! Spendenkonto: Konto: DNR Umwelt und Entwicklung IBAN: DE95 3705 0198 0026 0051 81 BIC: COLSDE33XXX Betreff: Spende Treckerpatenschaft 2025 Material Download fürs Teilen und Bewerben Anzeige (pdf) Druckvorlage 2x2 DIN A6 (pdf) Quadratisch 1200x1200 (jpg) Hochformat 1080x1920 (jpg) Querformat 940x788 (jpg) Show larger version Show larger version Show larger version Show larger version HERZLICHEN DANK AN ALLE TRECKERPAT*INNEN! Georg Janßen IG Nachbau Anita Idel (Agrobiodiversität und Tiergesundheit) Betriebsratsberatung Dr. Frank Havighorst Vera und Dieter Choulant Michaela Möhn Simone Götz Obst-Arboretum Olderdissen Doris und Fritz Haspel Renate Schmidtke & Tobias Wagner (Winninghausen) Guido Schönherr Bärbel und Jörg Endraß (Biohof Endraß) Georg Petau (Obstwiesenverbund Pyrmonter Bergdörfer) EcoMujer e.V. Mitteldeutsche Imkerunion e.V. Elisabeth Peters DIE LINKE (KV Coesfeld) Reiner Claus LBZ Emmendingen-Hochburg (Ökolandbau-Meisterklasse 2025) Kollektiv Lichtung AbL Landesverband Baden-Württemberg HOFbauernHOF Sascha Maier Ökolandbauzentrum NDS Sebastian Keil Alexandra Burmann und Yunus Waqar Helga Pukall (Gesundheitsgarten Marburg) Hans-Joachim Klöss Solawi Wangen e.V. ZUR TRECKER-SEITE"
