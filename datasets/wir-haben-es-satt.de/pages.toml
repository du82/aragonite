title = "Straßburg/Kehl, 22.10.2019 - Wir haben es satt!"
full_description = 'Pressemitteilung Demonstration zum EU-Parlament: Mit den Subventionen die Bauernhöfe retten und die europäische Agrarwende umsetzen! Straßburg/Kehl, 22.10.2019. 1000 Menschen – Bauerinnen und Bauern im Schulterschluss mit der Zivilgesellschaft – demonstrieren heute vor dem EU-Parlament in Straßburg für eine nachhaltige EU-Agrarreform. Vor dem Parlamentsgebäude machen die Teilnehmer aus 15 europäischen Ländern deutlich: Mit den Fördergeldern aus der EU-Agrarpolitik (GAP) müssen künftig kleine und mittlere Landwirtschaftsbetriebe fit für die Agrarwende gemacht werden. Klar ist: Die pauschalen Flächensubventionen sind nicht mehr zeitgemäß. Die 60 Milliarden Euro pro Jahr, über deren Neuverteilung die EU gerade verhandelt, müssen den Bauernhöfen Anreize für mehr Tier-, Umwelt- und Klimaschutz bieten. Statt die Bauern bei den wichtigen Zukunftsaufgaben weiter im Stich zu lassen, muss die Politik ihnen finanziell unter die Arme greifen. Saskia Richartz, Sprecherin der „Wir haben es satt!“-Bündnisses, sagt: „Die EU muss jetzt die Agrarwende anpacken. Die Klimakrise und das dramatische Artenster­ben erlauben keine weitere verschenkte GAP-Periode. Mit den Agrar-Subventionen kann die Landwirtschaft in den nächsten Jahren klimafreundlich umgebaut werden. Frau Klöckner und Frau von der Leyen, sorgen Sie dafür, dass der Agrarindustrie ein für alle Mal der Geldhahn zu­gedreht wird. Enkeltaugliche Agrarpolitik heißt: Fördergelder nur noch für bäuerliche Betriebe, die Umwelt und Klima schützen, Tiere artgerecht halten und gutes Essen für uns alle herstellen!“ Wolfgang Hees, stellvertretender Vorsitzender der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) in Baden-Württemberg, sagt: "Gemeinsam mit unseren französischen Berufskollegen fordern wir heute von der EU eine Agrarpolitik für bäuerliche Betriebe, die unsere wirtschaftliche Existenz sichert. Statt weiter mit EU-Subventionen die Agrarindustrie zu fördern, muss die Politik endlich bäuerliche Leistungen für Klima-, Arten-, Tier- und Umweltschutz gerecht und zielgerichtet honorieren. Sonst verlieren wir massiv kleine und mittlere Betriebe, die gutes Essen produzieren. Das ist sozial, ökono­misch und ökologisch untragbar. Deshalb protestieren überall in Europa viele Bäuerinnen und Bauern." Die Demonstration war bereits am Morgen auf deutscher Seite in Kehl gestartet. Bauern aus Frankreich und Deutschland führten mit ihren Traktoren den Demonstrationszug ins Straßburger Zentrum an. Angekommen am EU-Parlament übergaben die Demonstranten ihre Forderungen an die Parlamentarier und machten mit einem „Die-In“ auf die alarmierende Lage von Landwirtschaft, Umwelt und Klima aufmerksam. Hintergrund: Initiiert wurde die Demonstration von dem französischen Bündnis „Pour une autre PAC“ (dt. Für eine andere GAP) und dem „Wir haben es satt!“-Bündnis, die auf beiden Seiten des Rheins für den Umbau der Landwirtschaft eintreten. Sie findet im Rahmen des #GoodFoodGoodFarming-Aktionsmonats statt, während dem es rund 100 Aktivitäten in 22 europäischen Ländern gibt. Weitere Informationen: www.wir-haben-es-satt.de/eu Fotos zur freien Verwendung ab ca. 15 Uhr unter: bit.ly/2MJWoQZ Für Rückfragen: Saskia Richartz, „Wir haben es satt!“-Bündnis, Mobil: 0177-890 50 54, E-Mail: richartz[at]meine-landwirtschaft[dot]de Wolfgang Hees, Arbeitsgemeinschaft bäuerliche Landwirtschaft Baden-Württemberg, Mobil: 0176-398 72 928, E-Mail: wolfgang.hees[at]bioservice-suedbaden[dot]de Pressekontakt: Christian Rollmann, "Wir haben es satt!"-Pressesprecher, Mobil: 0151-51245795, E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung'
