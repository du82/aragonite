["https://wir-haben-es-satt.de/informieren/rueckblick/demo-2013"]
title = "Demo 2013 - Wir haben es satt!"
full_description = '''Pressespiegel Fernsehen/Videos: BR NachrichtenARD Tagesschau 17 UhrARD Tagesschau 20 UhrRBB AbendschauMDR AktuellNDR NordmagazinN24SWR Landesschau Aktuell Vox Print- und Onlinemedien: Bayerische Landwirtschaftliches WochenblattB.Z.Der TagesspiegelDie ZeitGießener ZeitungHamburger Abendblattjunge WeltNeue Osnabrücker ZeitungNeues DeutschlandNordkurier.deOstfalen-SpiegelPotsdamer Neueste NachrichtenSächsische ZeitungtaztazTopagrarThüringer AllgemeineThüringische LandeszeitungWestfälische Rundschau Radio Deutsche WelleRadio AktivRSA Radio Online Merkur OnlineNWZ OnlineOVB OnlineSpiegel OnlineRheinraum Online 3. WIR HABEN ES SATT!-DEMO AM 19. Januar 2013 AUFRUF Wir wollen eine bäuerlich-nachhaltige Landwirtschaft und keine Agrarindustrie! Die Bilanz der Agrarpolitik der letzten Jahrzehnte ist düster: In immer mehr Tierfabriken wird der Tierschutz verletzt und gefährliche Antibiotikaresistenzen entstehen. Bauernhöfe sterben und Landschaften „vermaisen“. Mehr Pestizide lassen weltweit die Bienen sterben und die Artenvielfalt nimmt rapide ab. Die Spekulation mit Lebensmitteln und Land verschärft den Hunger in der Welt. Dafür landet immer mehr Getreide im Tank statt auf dem Teller. Es ist Zeit für eine Wende! Die Landwirtschaft befindet sich in Deutschland, Europa und weltweit in einem tiefen Umbruch. Im Jahr 2013 stehen wichtige Weichenstellungen bevor. Bei der Bundestagswahl steht auch zur Abstimmung, ob es zu einer nachhaltigen Ernährungs- und Energiewende kommt. In der EU wird entschieden, ob eine bäuerlich-nachhaltige Landwirtschaft unterstützt wird oder jährlich weitere 60 Milliarden Euro an Agrarsubventionen vor allem an die Agrarindustrie fließen. Weltweit entscheidet die internationale Staatengemeinschaft, ob die die bäuerliche Landwirtschaft gestärkt wird, um den Hunger zu bekämpfen und das Recht auf Nahrung für alle zu verwirklichen. Wir haben es geschafft die Gentechnik von den Feldern zu vertreiben. Jetzt machen wir Druck für eine ökologisch-soziale Agrarwende. Vor dem Kanzleramt in Berlin fordern wir:Tierfabriken und Antibiotika-Missbrauch stoppen Subventionen an soziale, ökologische und Tierschutz-Kriterien binden weltweit faire Regeln für eine bäuerliche Landwirtschaft durchsetzen statt die Agrarmärkte weiter zu liberalisierenHeimisches Futter fördern statt Futtermittelimporte mit Gentechnik-Soja Spekulation mit Lebensmitteln und Land, sowie die EU-Exportförderung beendenBienen- und klimafreundliche Landwirtschaft anstelle von Monokulturen fördernWir schätzen die tägliche Arbeit der Menschen auf den Bauernhöfen. Sie müssen im Zentrum von Reformen stehen! Kommen Sie als VerbraucherIn zur Demo! Bäuerinnen und Bauern setzt mit Euren Traktoren ein bäuerliches Zeichen! ImkerInnen und GärtnerInnen seid in Eurer Berufskleidung mit dabei! Frontbanner Jugendliche Menge Schild Traktoren Schilder #carousel-backgroundimage-1159-106 { background-image: url('/fileadmin/_processed_/7/1/csm_Frontbanner_26812d8a6b.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1159-106 { background-image: url('/fileadmin/_processed_/7/1/csm_Frontbanner_a77b8766c3.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1159-106 { background-image: url('/fileadmin/_processed_/7/1/csm_Frontbanner_0e6669d136.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1159-106 { background-image: url('/fileadmin/user_upload/fotos/demo13/Frontbanner.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1159-106 { background-image: url('/fileadmin/user_upload/fotos/demo13/Frontbanner.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1159-106 { background-image: url('/fileadmin/user_upload/fotos/demo13/Frontbanner.jpg'); } } #carousel-backgroundimage-1159-107 { background-image: url('/fileadmin/_processed_/1/f/csm_jugendliche_412870906a.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1159-107 { background-image: url('/fileadmin/_processed_/1/f/csm_jugendliche_3831062