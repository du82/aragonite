{ background-image: url('/fileadmin/_processed_/7/4/csm_Bild_Glyphosat_50831c6b77.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-4799-281 { background-image: url('/fileadmin/_processed_/7/4/csm_Bild_Glyphosat_04acc70994.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-4799-281 { background-image: url('/fileadmin/_processed_/7/4/csm_Bild_Glyphosat_12a9d44cf1.jpg'); } } #carousel-backgroundimage-4799-282 { background-image: url('/fileadmin/_processed_/e/5/csm_Bild_KeinGott_keinStaat_keinGlyphosat_9316005f0b.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-4799-282 { background-image: url('/fileadmin/_processed_/e/5/csm_Bild_KeinGott_keinStaat_keinGlyphosat_cc222a39e4.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-4799-282 { background-image: url('/fileadmin/_processed_/e/5/csm_Bild_KeinGott_keinStaat_keinGlyphosat_a3b5769eba.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-4799-282 { background-image: url('/fileadmin/_processed_/e/5/csm_Bild_KeinGott_keinStaat_keinGlyphosat_d4b84555f5.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-4799-282 { background-image: url('/fileadmin/_processed_/e/5/csm_Bild_KeinGott_keinStaat_keinGlyphosat_31d82962e3.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-4799-282 { background-image: url('/fileadmin/_processed_/e/5/csm_Bild_KeinGott_keinStaat_keinGlyphosat_6b23916bf3.jpg'); } } Zurück Weiter Pressemitteilung 35.000 fordern von Ministerin Klöckner eine EU-Agrarreform für Bauern, Tiere und Umwelt „Der Agrarindustrie den Geldhahn abdrehen!“ / Agrarpolitik der Bundesregierung befeuert Klimawandel und Höfesterben Berlin, 19.01.19. Eine zukunftsfähige Agrarreform – das fordern zehntausende Teilnehmer bei der „Wir haben es satt!“-Demonstration zum Auftakt der „Grünen Woche“ in Berlin. „Lautstark, bunt und entschlossen haben wir heute mit 35.000 Menschen Landwirtschaftsministerin Julia Klöckner einen unmissverständlichen Auftrag gegeben: Schluss mit der falschen Agrarpolitik“, erklärt „Wir haben es satt!“-Sprecherin Saskia Richartz im Namen der über 100 Organisationen, die zur Demonstration aufgerufen haben. Das Demonstrationsbündnis fordert die Bundesregierung auf, den überfälligen Umbau der Landwirtschaft anzupacken. Die Gelegenheit ist da: Bei der aktuellen Reform der EU-Agrarpolitik (GAP) entscheidet die Bundesregierung maßgeblich mit, welche Landwirtschaft künftig durch Steuergelder finanziert wird. In Deutschland werden jedes Jahr 6,3 Milliarden Euro an EU-Agrargeldern ausgeschüttet, mehr als drei Viertel davon als pauschale Subventionen je Hektar Fläche. In der Praxis heißt das: Die 3.300 flächengrößten Betriebe erhalten eine Milliarde Euro im Jahr, während die kleinsten 200.000 Bauernhöfe sich knapp 700 Millionen teilen müssen. „Mit den über sechs Milliarden Euro, die Deutschland jedes Jahr an EU-Agrargeldern verteilt, muss der umwelt- und tiergerechte Umbau der Landwirtschaft gefördert werden”, so Saskia Richartz."
