["https://wir-haben-es-satt.de/berlin-18012025"]
title = "Berlin, 18.01.2025 - Wir haben es satt!"
full_description = "Pressemitteilung 18. Januar 2025 PDF-VERSION FOTOS PDF-VERSION Pressemitteilung 18. Januar 2025 Zeit für mutige Agrarpolitik! Landwirtschaft und Zivilgesellschaft demonstrieren geschlossen für Tier-, Klima- und Umweltschutz, den Erhalt vieler und vielfältiger Höfe, faire Preise und gutes Essen. Berlin, 18. Januar 2025: Gemeinsam mit 9.000 Demonstrierenden fordern rund 60 Organisationen auf der „Wir haben es satt!“-Demo von der künftigen Bundesregierung ein zuverlässiges Bekenntnis und eine ambitionierte Förderung für eine bäuerlich-ökologischere Landwirtschaft. Gemeinsam adressieren Bäuer*innen, Verbraucher*innen und Aktive der Natur-, Tier- und Klimaschutzbewegung die Politik: „Wir alle wollen gesunde Lebensmittel. Wir alle wollen Tierwohl, Umwelt- und Klimaschutz. Die kommende Bundesregierung muss bäuerliche Betriebe dabei endlich adäquat unterstützen!“, fordert Anne Skambraks, Kampagnenleitung des „Wir haben es satt!“-Bündnisses. Das Bündnis wirft der Bundesregierung vor, dem größten Rollback in der Agrarpolitik seit Jahrzehnten tatenlos zugeschaut zu haben. Dieser beschleunigt Klimawandel und Verlust von Artenvielfalt und erhöht zudem die Planungsunsicherheit auf den Höfen. Wie auch schon von vorangegangenen Regierungen wurden der Umbau der Tierhaltung liegen gelassen und viel zu oft Konzerninteressen priorisiert. Es fehlen weiterhin Gesetze, welche Ackerland für die Nahrungsmittelproduktion sichern, und außerlandwirtschaftliche Investoren treiben die Preise für Äcker und Wiesen ungebremst in die Höhe. Weltweit leiden Menschen unter Hunger und Ernährungsarmut, während Agrarrohstoffhändler ihre Gewinne vervielfachen. Megaställe und Düngemittelindustrie tragen mit klimaschädlichen Gasen zur Klimakrise bei, weil ambitionierte Klimaschutzgesetze fehlen. Die Ernährungssicherheit ist gefährdet, wenn einer vielfältigen und resilienten Landwirtschaft der Nachwuchs ausgeht: Angesichts steigender Investitionskosten entscheiden sich immer weniger junge Menschen, Bäuerin oder Bauer zu werden. Auch weil vom Preis an der Supermarktkasse bei den Bäuer*innen viel zu wenig ankommt. Die demonstrierenden Bäuer*innen und Verbraucher*innen erwarten von der kommenden Koalition mehr. Auf dem Platz vor dem Reichstagsgebäude bilden Demo-Teilnehmende ein riesiges Wahlkreuz aus Menschen, darunter ein Banner mit dem Spruch „Mutige Agrarpolitik wählen!“. Olaf Bandt, Vorsitzender des Bund für Umwelt und Naturschutz Deutschland (BUND), kommentiert: „Die Agrarpolitik der letzten Jahre und Jahrzehnte hat es verpasst, einen mutigen Kurs für die Landwirtschaft vorzugeben. Das Ergebnis sind massive Probleme und kaum Perspektiven für bäuerliche Betriebe. Zivilgesellschaft, Agrarsektor und Wissenschaft haben dafür gemeinsame Lösungen entwickelt. Eine neue Bundesregierung muss nach der Wahl Tier-, Klima- und Umweltschutz endlich voranbringen. Das ermöglicht auch neue Zukunftsperspektiven für unsere heimischen Betriebe!“ Am nötigen gesellschaftlichen Konsens mangelt es nicht. Umfragen und Kaufverhalten zeigen, dass vielen Menschen Tierwohl und Klimaschutz wichtig sind. So fordert das „Wir haben es satt!“-Bündnis die kommende Regierung auf, Höfe endlich mit verbindlichen Gesetzen, kostendeckenden Erzeuger*innenpreisen und einer sicheren Finanzierung zu stärken. Denn nur mit wirtschaftlichen Perspektiven für ihre Betriebe können die Bäuer*innen ihren Anteil an einer guten Zukunft für alle leisten. Auf Schildern der Demonstrierenden ist zu lesen, wie sie sich diese Zukunft vorstellen: „Mehr Tierwohl“, „Arten- und Klimaschutz“, „Ackerland in Bäuer*innenhand“, „Gesunder Boden für unsere Zukunft“, „Lieber gute Politik, statt schlechtes Essen“, „Die Zukunft ist ökologisch“, „Bäuer*innen verdienen mehr als sie verdienen“, „Nahrung ist ein Menschenrecht“. Statements von Redner*innen Antje Hollander, junge Arbeitsgemeinschaft bäuerliche Landwirtschaft e.V. (AbL) „Die Agrarlobby hat die großen bäuerlichen Proteste des letzten Winters dafür genutzt, die ökologische Wirksamkeit der Agrarpolitik um Jahre zurück zu werfen. Bei den Ursachen der Proteste – wie fehlender Wertschöpfung auf unseren Höfen – wird hingegen blockiert. Die politisch Verantwortlichen in Brüssel und Berlin lassen diese Entwicklungen ohne erkennbaren Widerstand geschehen. Die kommende Bundesregierung muss endlich eine mutige und weitsichtige Agrarpolitik machen, welche die bestehenden Einigungen zum Umbau der Tierhaltung und der Ökologisierung der Agrarpolitik umsetzt. Auch um jungen Bäuer*innen wie mir eine langfristige Perspektive zu geben.“ Elke Ronneberger, Diakonie Deutschland, Gastrednerin „Wenn wir unsere ökologischen Ziele erreichen wollen, braucht es dringend ein Umdenken! Wir müssen unser Ernährungssystem umbauen – und dabei muss es gerecht zugehen. Bei der sozialen Existenzsicherung müssen ökologische Aspekte endlich mitgedacht werden. Dies ist eine Frage der Menschenwürde und eine Frage der Gesundheit unserer Erde. Aber es ist auch zwingend notwendig für die Akzeptanz der Ernährungswende. Deshalb sagen wir als Diakonie: Ein menschenwürdiges Existenzminimum kann in Zukunft nur gesichert werden, wenn es zu einem sozial-ökologischen Existenzminimum weiterentwickelt wird.“ Harald Schaum, Industriegewerkschaft Bauen-Agrar-Umwelt, Gastredner „Hohe Profite der Einzelhandelskonzerne, Preisdruck bei den Agrarbetrieben und zu geringe Löhne für Beschäftigte in der Landwirtschaft hängen zusammen und sind ein massives Problem. Es ist daher gut und richtig, dass ‚Wir haben es satt!‘ eine Begrenzung der Konzernmacht und kostendeckende Erzeugerpreise fordert, denn das sind Voraussetzungen für gute Arbeit in der Landwirtschaft.“ Morgan Ody, La Via Campesina, Gastrednerin „733 Millionen Menschen leiden weltweit an Hunger, während die Profite der multinationalen Unternehmen der Agrarindustrie in die Höhe gehen. La Via Campesina baut internationale bäuerliche Solidarität auf, gegen alle Formen kapitalistischer, kolonialer und patriarchaler Herrschaft. Jeden Tag globalisieren wir die Kämpfe, um auch die Hoffnung zu globalisieren.“ Christoph Bautz, Campact „Neue Pestizide auf den Markt bringen, Agrarsubventionen weiter an Megaställe fließen lassen, den Düngemitteleinsatz nicht begrenzen – mit diesen Konzepten aus der Vergangenheit macht die Merz-CDU Wahlkampf und will sie in Regierungspolitik überführen. Diese Klientelpolitik für die Agrarindustrie trifft heute auf den geeinten Widerspruch von Bäuer*innen und Verbraucher*innen. Mit voller Kraft streiten wir für die Agrarwende und gutes Essen für alle.“ Tobias Schied und Carla Reemtsma, Fridays for Future „Wer im Angesicht von gigantischen Bränden wie in Los Angeles immer noch meint, die Klimakrise sei harmlos und müsse nicht bekämpft werden, der lebt offensichtlich in einem Paralleluniversum. Wer Klimaschutz bekämpft, vergeht sich an unseren Lebensgrundlagen. Landwirtschaft braucht Klimaschutz, und deshalb muss die nächste Bundesregierung mit Klimaneutralität bis spätestens 2035 endlich liefern.“ Quammar Abbas, Pakistan Kissan Rabita Committee, Gastredner „In Pakistan und im gesamten globalen Süden erleben wir aus erster Hand das systematische Vordringen von Konzerninteressen in die Landwirtschaft. Deutsche Unternehmen wie Bayer und BASF sind dabei führend. Sie setzen auf gentechnisch veränderte Organismen (GVO), Hybridsaatgut und Agrochemikalien und kriminalisieren die jahrhundertealten Traditionen des Schützens und Tauschens von Saatgut. Dies ist ein direkter Angriff auf unsere Saatgutsouveränität, ein Recht, das in unserer Identität als Landwirte und Bewahrer der biologischen Vielfalt und in der UN-Bauernrechteerklärung verankert ist.“ Marlene Herzog, Bioland Bäuerin und Vorsitzende AbL Rheinland-Pfalz/Saarland „Ich kämpfe für eine gesunde Zukunft auf einer gesunden Erde für unsere Kinder und Enkelkinder. Dafür brauchen wir eine klima- und umweltfreundliche Landwirtschaft, die existenzsichernde Preise erzielen kann. Wir brauchen glückliche Tiere, faire Arbeitsbedingungen, gesunde Lebensmittel und Vielfalt. Und wir brauchen regionale Strukturen damit diese Landwirtschaft weiter bestehen kann. Was wir nicht brauchen, sind große Agrarkonzerne, die die Preise drücken und durch ihre Macht regionale Strukturen zerstören.“ Weitere Informationen Demonstration | www.wir-haben-es-satt.de Presse-Ressourcen | www.wir-haben-es-satt.de/presse Fotos Am Demo-Tag stellen wir sukzessive Fotos zur kostenfreien Verwendung zur Verfügung: „Wir haben es satt!“-Demonstration 2025 https://flic.kr/s/aHBqjBXWjF „Zukunft braucht Höfe: Bäuerinnen und Bauern vor Konzerninteressen – weltweit“ https://flic.kr/s/aHBqjBY284 Nicola Puell Presse- und Öffentlichkeitsarbeit Mobil: (0151) 51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung 18. Januar 2025 PDF-VERSION FOTOS PDF-VERSION"
