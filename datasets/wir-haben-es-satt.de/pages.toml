["https://wir-haben-es-satt.de/informieren/aufruf/tierwohl"]
title = "Tierwohl - Wir haben es satt!"
full_description = 'Hintergrundinfos: Industrielle Massentierhaltung Artgerechte Tierhaltung Weidehaltung von Rindern Positionspapier Tierhaltung & viele Höfe Fleischatlas Haltungskennzeichnung Fleisch in Maßen statt Massen Eckpunktepapier Antibiotika Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Weniger Tiere, mehr Tierwohl, viele Höfe Fleischkonzerne wie die PHW-Gruppe (WIESENHOF), Tönnies oder Westfleisch machen Milliarden Euro Umsätze mit billigem Fleisch aus Megaställen. Dabei werden das Leid der Tiere, Nitratbelastung des Grundwassers, Antibiotikaresistenzen und der Marktdruck auf die bäuerlichen Betriebe von der Industrie bereitwillig in Kauf genommen. Weder Landwirt*innen noch Verbraucher*innen wünschen sich Massentierhaltung! Das gemeinsame Ziel ist eine Landwirtschaft, die sich dem Tierwohl verpflichtet und mit vielen und vielfältigen Betrieben die Lebensmittelversorgung sichert. Es liegen genügend gemeinsam erarbeitete Vorschläge an die Politik vor, wie der Umbau der Tierhaltung umgesetzt werden kann. Unsere Forderungen: Finanzierung des Umbaus der Tierhaltung endlich auf eine dauerhafte gesetzliche Grundlage stellen Bäuerliche und flächengebundene Tierhaltung fördern, Tierfabriken schließen Planungssicherheit für die Höfe: Gesetzliche Rahmenbedingungen für eine am Tierwohl orientierte Tierhaltung schaffen, die Hand in Hand mit geringeren Tierzahlen, Gewässerschutz und verringertem Antibiotikaeinsatz geht Hintergrundinfos: Industrielle Massentierhaltung Artgerechte Tierhaltung Weidehaltung von Rindern Positionspapier Tierhaltung & viele Höfe Fleischatlas Haltungskennzeichnung Fleisch in Maßen statt Massen Eckpunktepapier Antibiotika ← ÜBERSICHT → Hintergrundinfos: Industrielle Massentierhaltung Artgerechte Tierhaltung Weidehaltung von Rindern Positionspapier Tierhaltung & viele Höfe Fleischatlas Haltungskennzeichnung Fleisch in Maßen statt Massen Eckpunktepapier Antibiotika'
