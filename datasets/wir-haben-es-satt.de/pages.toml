 } @media (min-width: 1200px) { #carousel-backgroundimage-1159-109 { background-image: url('/fileadmin/user_upload/fotos/demo13/schild.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1159-109 { background-image: url('/fileadmin/user_upload/fotos/demo13/schild.jpg'); } } #carousel-backgroundimage-1159-110 { background-image: url('/fileadmin/_processed_/a/e/csm_traktoren_98c8ac9c38.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1159-110 { background-image: url('/fileadmin/_processed_/a/e/csm_traktoren_52fefdb1f6.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1159-110 { background-image: url('/fileadmin/_processed_/a/e/csm_traktoren_ed679dd031.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1159-110 { background-image: url('/fileadmin/user_upload/fotos/demo13/traktoren.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1159-110 { background-image: url('/fileadmin/user_upload/fotos/demo13/traktoren.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1159-110 { background-image: url('/fileadmin/user_upload/fotos/demo13/traktoren.jpg'); } } #carousel-backgroundimage-1159-111 { background-image: url('/fileadmin/_processed_/4/9/csm_schilder_89bc4dfe9e.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1159-111 { background-image: url('/fileadmin/_processed_/4/9/csm_schilder_1bfe9dbb11.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1159-111 { background-image: url('/fileadmin/_processed_/4/9/csm_schilder_a69860f430.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1159-111 { background-image: url('/fileadmin/user_upload/fotos/demo13/schilder.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1159-111 { background-image: url('/fileadmin/user_upload/fotos/demo13/schilder.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1159-111 { background-image: url('/fileadmin/user_upload/fotos/demo13/schilder.jpg'); } } Zurück Weiter Gemeinsame Pressemitteilung Großdemonstration in Berlin fordert Abkehr von Agrarindustrie 25 000 Demonstranten erwarten von Kanzlerin Merkel ökologische und soziale Reformen in der Landwirtschaft Berlin, 19.01.13 | Zu Beginn der weltweit größten Landwirtschaftsmesse, der „Internationalen Grünen Woche“ in Berlin, haben 25 000 Menschen in der Hauptstadt mit einer Großdemonstration grundsätzliche Reformen in der Agrarpolitik gefordert. Unter dem Motto „Wir haben es satt! Gutes Essen. Gute Landwirtschaft. Jetzt!“ zogen bereits im dritten Jahr in Folge die Teilnehmer mit Transparenten und in teils phantasievollen Kostümen vom Berliner Hauptbahnhof durch das Regierungsviertel zum Bundeskanzleramt. 70 Traktoren und Imkerfahrzeuge aus dem ganzen Bundesgebiet begleiteten den Protest. Bauern, Verbraucher und Imker demonstrierten gemeinsam dafür, nicht die Interessen der Industrie in den Mittelpunkt der Politik zu stellen sondern die Interessen von Verbrauchern und Landwirten, der Tiere sowie des Natur- und Umweltschutzes. Mit Sprechchören wie „Wer Bauern, Tiere, Bienen quält, der wird nicht gewählt!“ bekundeten sie ihre Ablehnung der gegenwärtigen Tendenz zu einer immer stärkeren Industrialisierung der Landwirtschaft. Auf ihren Transparenten kritisierten die Demonstranten unter anderem Tierfabriken, Umweltschäden durch den Einsatz giftiger Pestizide, zunehmenden Preisdruck auf die Erzeuger und die negativen Auswirkungen auf die kleinbäuerlichen Strukturen in den Ländern des Südens. WEITERLESEN „Trotz bisher durchgeführter Milchstreiks, dem Bäuerinnen-Camp vorm Kanzleramt und mehrerer Demonstrationen in Brüssel hat sich an der Situation der Milchbauern nichts verbessert“, sagte Johanna Böse-Hartje vom Bundesverband der Deutschen Milchviehhalter. „Die Politik geht den Weg der Liberalisierung, den Weg der Vernichtung bäuerlicher Betriebe weltweit. Das breite Bündnis mit dem wir hier heute stehen, ist der Beweis, dass unsere Forderungen nach Marktregeln und einer Umgestaltung der Agrarpolitik in der Gesellschaft angekommen sind. Nur wenn Bauern und Bürger zusammen für eine Reform der Agrarpolitik stehen, können wir unsere Bauernhöfe erhalten und erreichen, dass wir endlich unter fairen Bedingungen gesunde Lebensmittel erzeugen können."Uschi Helmers von der Bürgerinitiative gegen einen riesigen Geflügelschlachthof im niedersächsischen Wietze, die mit über 200 Bürgerinitiativen zum Bündnis „Bauernhöfe statt Agrarfabriken“ gehört, forderte: „Es darf den Politikern nicht egal sein, wenn ausländische Arbeiter für drei Euro fünfzig Cent Stundenlohn in deutschen Schlachthöfen ausgebeutet werden oder dass für unser Tierfutter der Regenwald in Südamerika abgeholzt wird. Riesenschlachthöfe wie der in Wietze geplante sind tier- und menschenfeindlich und außerdem völlig überflüssig.“ Mit Blick auf die Landtagswahlen am Sonntag in Niedersachsen forderte Helmers „eine Agrarpolitik zum Wohle der Tiere, der Menschen und der Umwelt“.Die kirchlichen Hilfswerke Brot für die Welt und Misereor lenkten den Blick auf die Auswirkungen der EU-Agrarpolitik auf Entwicklungs- und Schwellenländer. „Die heutige Agrarpolitik Europas bedroht die Existenz vieler Bauernfamilien in den armen Ländern. Die Steigerung unserer landwirtschaftlichen Produktion und der Agrarexporte lindert den Hunger nicht, das Gegenteil ist der Fall“, erklärte Klaus Seitz, Leiter der Politikabteilung von Brot für die Welt-Evangelischer Entwicklungsdienst. Hubert Weiger, der Vorsitzende des Bund für Umwelt und Naturschutz Deutschland (BUND), kritisierte in seiner Rede vor dem Kanzleramt am Schluss der Großdemonstration: „Hoffentlich hat sich Bundeskanzlerin Angela Merkel bei ihrem Rundgang auf der Grünen Woche nicht von den potemkinschen Dörfern der Agrarindustrie blenden lassen. Hinter dem schönen Schein der Messestände verbergen sich millionenfaches Tierleid, ein exorbitanter Antibiotikaeinsatz bei Masttieren und enorme Belastungen der Umwelt durch die Massentierhaltung. In der Agrarpolitik Deutschlands und der Europäischen Union sind neue Weichenstellungen überfällig. Die Bundesregierung mit Kanzlerin Merkel und Agrarministerin Aigner muss endlich dafür sorgen, dass bäuerliche Betriebe anstatt vor allem Tierfabriken gefördert werden.“ Eine solche Politik nütze nicht nur dem Tierschutz und den Landwirten, sie schaffe auch die Voraussetzungen für mehr Umwelt- und Verbraucherschutz. Pressespiegel Fernsehen/Videos: BR NachrichtenARD Tagesschau 17 UhrARD Tagesschau 20 UhrRBB AbendschauMDR AktuellNDR NordmagazinN24SWR Landesschau Aktuell Vox Print- und Onlinemedien: Bayerische Landwirtschaftliches WochenblattB.Z.Der TagesspiegelDie ZeitGießener ZeitungHamburger Abendblattjunge WeltNeue Osnabrücker ZeitungNeues DeutschlandNordkurier.deOstfalen-SpiegelPotsdamer Neueste NachrichtenSächsische ZeitungtaztazTopagrarThüringer AllgemeineThüringische LandeszeitungWestfälische Rundschau Radio Deutsche WelleRadio AktivRSA Radio Online Merkur OnlineNWZ OnlineOVB OnlineSpiegel OnlineRheinraum Online'''
