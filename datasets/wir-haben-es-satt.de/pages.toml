["https://wir-haben-es-satt.de/presse-archiv/berlin-25052018"]
title = "Berlin, 25.05.2018 - Wir haben es satt!"
full_description = "Pressemitteilung Nein zu Gentechnik im Essen – Landwirtschaft ohne Bayer ist „Ährensache“! Bauern und Verbraucher demonstrieren vor der Bayer-Aktionärsversammlung gegen Konzernmacht und für zukunftsfähige Landwirtschaft Bonn, 25.05.18. Gegen die Megafusion von Bayer und Monsanto demonstrierten heute Morgen 200 Personen vor der Hauptversammlung der Bayer-AG in Bonn. Die Marktkonzentration im Agrarsektor bedroht die bäuerliche Landwirtschaft und die Ernährungssouveränität, so die Kritik der Demonstranten. Einige Bauern waren extra mit ihren Traktoren angereist. „Ährensache ohne Bayer“ stand auf einem ihrer Spruchbänder – ein Plädoyer für eine konzernunabhängige Landwirtschaft. Teil der Proteste war auch eine überdimensionale „PacMan“-Figur in Form einer Bayer-Tablette. Vor den Augen der anreisenden Aktionäre verschlang sie zahlreiche Gemüse- und Obstsorten. Diese „BaySanto“-Performance verdeutlichte die Befürchtung, dass der Megakonzern nach der Fusion noch mehr Patente auf Pflanzen anstreben und so einen massiven Verlust der Saatgutvielfalt herbeiführen würde.Bernd Schmitz, Milch- und Ackerbauer aus Hennef und Landesvorsitzender der Arbeitsgemeinschaft bäuerliche Landwirtschaft in NRW, sagte bei der Kundgebung:„Bayer gibt hunderttausende Euros für öffentlichkeitswirksame Kampagnen aus, mit denen der Konzern uns weismachen will, auf der Seite von Bauern und Bienen zu stehen. Das Bayer-Geschäftsmodell widerspricht dem allerdings fundamental. Bayer und Monsanto erzielen Milliardenprofite mit Neonikotinioden, Glyphosat und Gentechnik. Wir Bauern und Imker setzen auf konzernfreies Saatgut und eine flächendeckende Ökologisierung der Landwirtschaft. Das ist mit Bayer-Monsanto nicht zu machen.“Gentechnik-Expertin Annemarie Volling kritisierte die Bestrebungen Bayers, neue Gentechnik-Verfahren durch die Hintertür durchzusetzen:„Bayer-Chef Baumann versucht der Bevölkerung und der Politik die neuen Gentechnik-Verfahren wie CRISPR/Cas als ‚neue‘ Wunderwaffe mit alten Argumenten schmackhaft zu machen. Vor allem will Bayer, dass die neuen Techniken nicht als Gentechnik eingestuft und reguliert werden. Ohne Zulassungsverfahren und Kennzeichnung können die Risikopflanzen unreguliert in der Umwelt und in unserem Essen landen. Statt Gentechnik durch die Hintertür fordern wir die Stärkung des Vorsorgeprinzips und Wahlfreiheit für Züchter, Bauern und Verbraucher.“Christian Rollmann vom „Wir haben es satt!“-Bündnis widerlegte den Mythos, die Ernährung der Weltbevölkerung sei nur mit der Bayer-Vision von Landwirtschaft zu erreichen:„Bayer ist kein Wohltätigkeitsverein, sondern ein Konzern, der mit unserem Essen Milliardengewinne generieren will. Wenn Bayer ‚Hungerbekämpfung‘ sagt, dann ist damit die Erschließung von neuen Märkten hier und im globalen Süden gemeint. Den 800 Millionen Menschen, die weltweit an Hunger leiden, ist durch die Zerstörung von bäuerlichen Strukturen und regionalen Saatgutmärkten nicht geholfen. Wir dürfen nicht zulassen, dass Megakonzerne die Kontrolle über unser Ernährungssystem übernehmen.“Hintergrund:„Wir haben Agrarindustrie satt!“ ist ein breiter Zusammenschluss aus Landwirtschaft und Zivilgesellschaft, der alljährlich im Januar zur gleichnamigen Demonstration Zehntausende auf die Straßen Berlins bringt. Die rund 50 Trägerorganisationen setzen sich für eine zukunftsfähige Landwirtschaft ein, in der kleine und mittlere Bauernhöfe überleben können, Tiere artgerecht gehalten werden und Umwelt und Klima geschützt werden. Das Bündnis beteiligt sich zusammen mit vielen anderen Organisationen an den „Stopp Bayer-Monsanto“-Protesten in Bonn.Für Rückfragen:Bernd Schmitz, Arbeitsgemeinschaft bäuerliche Landwirtschaft NRW, Mail: schmitz[at]abl-ev[dot]de, Mobil: 0177-3565559Annemarie Volling, Gentechnikfreie Regionen in Deutschland, Mail: gentechnikfreie-regionen[at]abl-ev[dot]de, Mobil: 0160-96760146 Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Presseansprechpartner, Mobil: 0151-51245795, E-Mail: rollmann[at]meine-landwirtschaft[dot]de Pressemitteilung"
