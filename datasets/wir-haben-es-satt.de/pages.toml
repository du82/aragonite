title = "Türkisch - Wir haben es satt!"
full_description = "AUFRUF (DE) CALL TO ACTION (EN) Irkçılığa, nefrete ve aşırı sağcılığa hayır. Nazilerden, ırkçılardan ve aşırı sağcı kışkırtmadan bıktık! Tarım endüstrisine karşı şiddet içermeyen protesto etkinliğinde buluşuyoruz. Çiftçilere yönelik karalama kampanyaları başta olmak üzere her türlü nefret ve insan düşmanlığının bizde yeri yoktur. Çiftçilerin karalanması da dahil olmak üzere, her türlü nefret ve insan düşmanlığının bizde yeri yoktur. Hoşgörü, dayanışma, çeşitlilik ve uluslararası ilişkiler birlikteliğimizin en güçlü yanlarıdır. Mültecilere kapımız açık! Demo için bağış yapın ‘Bıktık!’ 2025 Mitingine Çağrı Burada aslında kim kazançlı çıkıyor? İklim krizinden, türlerin yok olmasından ve verimli toprakların kaybından aslında kim kârlı çıkıyor? Ucuz tarımsal ürünlerden, çiftliklerin yok olmasından ve verimli toprakların kaybından kimlerin çıkarı var? Küresel adaletsizlikten, gıda yoksulluğundan, patentlerden ve açlıktan kim para kazanıyor? Tarım arazilerine yatırımcılar tarafından el konulduğunda ve spekülasyon nesnesi haline getirildiğinde kim kazançlı çıkıyor? Siyasi istikrarsızlık ve maddi kaygılardan kim yararlanıyor? Geleceğimiz seçimlerimize bağlı! Berlin ve Brüksel'deki çok sayıda politikacı on yıllardır şirket çıkarlarını kamu yararının önüne koyuyor ve vergilerimizi zararlı bir gıda sistemini desteklemek için kullanıyor. Bayer-Monsanto, Tönnies ve Cargill gibi tarım şirketleri korkunç kârlar elde ediyor. Bunu da dünyanın artan nüfusunu sözde basit ve ucuz bir şekilde beslemek gibi sahte bir vaatle gizliyorlar. Lobi örgütleri, bürokrasiyi azaltma kisvesi altında, çiftçilerin uzun zamandır talep ettiği gibi ekonomik beklentilerin karşılanması yerine iklim, hayvan ve çevre korumasına ayrılan bütçeden kesinti yapılmasını talep ediyor. Küresel sonuçlar: Küresel olarak 733 milyon insan açlıktan etkileniyor, bu rakam koronavirüs pandemisi öncesine göre 150 milyon daha fazla. Dünyada her üç kişiden biri dengeli beslenemiyor. Sadece Almanya'da son 30 yılda 350.000'den fazla çiftlik kapanmak zorunda kaldı - bu da çiftlik sayısının neredeyse %60 azaldığı anlamına geliyor. Avrupa'daki toprakların yüzde 60'ı zarar görmüştür - bunun başlıca sorumlusu tarım ticareti ve körüklediği iklim krizi. Açık kırsal alandaki hayvan ve bitki türlerinin yüzde 60'ından fazlası nesli tükenmekte olan türlerin kırmızı listeleri arasında yer alıyor. Ekilebilir araziler özellikle türlerin yok olmasından etkileniyor. Bundan bıktık usandık! Koalisyon anlaşmasında sosyal açıdan adil bir tarım dönüşümü! Tarımsal-endüstriyel sistem maliyetlerini topluma yansıtmaktadır. Agro-ekolojik tarım, kamu refahı odaklı bir alternatiftir. Hayvanlara, çevreye ve iklime zarar vermeden hepimize ve gelecek nesillere güvenle sağlıklı gıda sağlayabilecek çevre dostu, adil ve krizlere dayanıklı bir gıda sisteminin temelidir. Bir sonraki Federal Hükümete ve AB'ye sesleniyoruz: Kentsel ve kırsal alanlarda, Almanya'da ve tüm dünyada geçim kaynaklarımızı, sosyal uyumu insanlar ve hayvanlar için iyi bir yaşamı güvence altına alın! Tarımsal dönüşümün nihayet siyasi cesarete, bağlayıcı yasalara, maliyetleri karşılayan üretici fiyatlarına ve güvenli finansmana ihtiyacı var! Önümüzdeki yasama döneminde, tarımsal dönüşüm ve Avrupa Ortak Tarım Politikasının sürdürülebilir bir şekilde yeniden düzenlenmesi en önemli önceliğe sahip olmalıdır. Hep birlikte olursak kazanabiliriz! Kentsel ve kırsal, organik ve konvansiyonel, hayvancılıkla uğraşanlar ve veganlar, gençler ve yaşlılar- bölünmeyeceğiz! Dayanışma gösterin, gösteriye gelin! Cumartesi, 18.1.25 | Saat 12.00 | Federal Şansölyelik | Berlin Taleplerimiz ve politikalarımız hakkında daha fazla bilgi almak için Almanca metni okuyun: AUFRUF AUFRUF (DE) CALL TO ACTION (EN) Irkçılığa, nefrete ve aşırı sağcılığa hayır. Nazilerden, ırkçılardan ve aşırı sağcı kışkırtmadan bıktık! Tarım endüstrisine karşı şiddet içermeyen protesto etkinliğinde buluşuyoruz. Çiftçilere yönelik karalama kampanyaları başta olmak üzere her türlü nefret ve insan düşmanlığının bizde yeri yoktur. Çiftçilerin karalanması da dahil olmak üzere, her türlü nefret ve insan düşmanlığının bizde yeri yoktur. Hoşgörü, dayanışma, çeşitlilik ve uluslararası ilişkiler birlikteliğimizin en güçlü yanlarıdır. Mültecilere kapımız açık! Demo için bağış yapın"
