["https://wir-haben-es-satt.de/informieren/rueckblick/demo-2020"]
title = "Demo 2020 - Wir haben es satt!"
full_description = "YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Fernsehen und Videoberichte Tagesschau24 Tagesschau um 12 Uhr Euronews Tagesschau um 20 Uhr AFP Reuters Brandenburg Aktuell SWR Reuters SWR Aktuell Radio Radio Corax NDR 2 Deutschlandfunk Inforadio Flux FM Radio Lotte KCRW Berlin Berliner Zeitung Junge Welt taz WEITERLESEN Bauernstimme Die Zeit Der Tagesspiegel taz Süddeutsche Zeitung Berliner Zeitung Berliner Morgenpost junge Welt Die Zeit faz Junge Welt Berliner Zeitung Frankfurter Allgemeine Zeitung WEITERLESEN BR 24 Süddeutsche Zeitung Süddeutsche Zeitung Südkurier SWR SWR SWR Tag24 Tagesspiegel Tagesspiegel Taz Taz T-online.de Volksstimme Web.de ZDF ZDF Ze.tt Zeit Zeit Berliner Morgenpost Frankfurter Rundschau Neues Deutschland Proplanta RTL.de Deutsches Verbände Forum Energiezukunft Markische Oderzeitung Taz Themen der Zeit Volksstimme BR 24 Süddeutsche Zeitung Eifel Zeitung Ostsee-Zeitung Mitteldeutsche Zeitung WEITERLESEN Nordkurier Freie Presse Kieler Nachrichten Markische Oderzeitung MK Kreiszeitung Neue Westfälische Nordwest-Zeitung Ruhr Nachrichten Fränkische Nachrichten Hessische/Niedersächsische Allgemeine MAZ Mitteldeutsche Zeitung WAZ Westfalen-Blatt Westfälische Zeitung Hessische/Niedersächsische Allgemeine Kieler Nachrichten Lokalkompass MAZ Reutlinger General-Anzeiger Schleswig-Holsteinischer Zeitungsverlag Schwäbisches Tagblatt Main-Echo Unabhängige Bauernstimme Top Agrar Agrarheute WEITERLESEN Bauernzeitung Top Agrar Land und Forst Agrarheute Agrarheute Agrarzeitung Agrarheute Top Agrar Unabhängige Bauernstimme Unabhängige Bauernstimme Bauernzeitung Top Agrar Wochenblatt Unabhängige Bauernstimme Daily Sabah KCRW Berlin TVP-Info WEITERLESEN 7D News Clarin Deutsche Welle Deutsche Welle El Tiempo ElPais.cr Euronews Herald-Whig International Business Times Metro Libre MSN News Nau.ch Pioneer Pressenza Republic World San Louis Obispo - The Tribune Südtirolnews Swissinfo.ch The Local The New York Times United News of Bangladesh WBOC Yahoo News Business Insider Polska Mainichi Agribusiness Intelligence Euractiv Express News Click People Dispatch Shark News A2Larm IDNES.cz 10. Wir haben es satt!-Demo am 18. Januar 2020 Aufruf Agrarwende anpacken, Klima schützen! – Wir haben die Fatale Politik satt! Für eine bäuerlich-ökologischere Landwirtschaft und artgerechte Tierhaltung, für insektenfreundliche Landschaften und globale Solidarität 2020 stehen wichtige Entscheidungen für die Landwirtschaft und für das Klima an: Bei der EU-Agrarreform entscheidet sich, ob mit den Milliarden-Subventionen die Agrarwende gestemmt und das Insektensterben gestoppt werden kann. Mit einem Veto gegen das Mercosur-Freihandelsabkommen kann Deutschland mithelfen, die Feuer am Amazonas einzudämmen. Und für echten Klimaschutz müssen wir die Bundesregierung auch 2020 weiter unter Druck setzen. Weil die Politik blockiert, rennt uns die Zeit weg. Bei der 10. Wir haben es satt!-Demo im Januar fordern wir mit Zehntausenden auf der Straße: Agrarwende anpacken, Klima schützen – Macht endlich eine Politik, die uns eine Zukunft gibt! Essen ist politisch – für immer mehr Menschen! In den letzten 10 Jahren ist eine starke Bewegung für gute Landwirtschaft und gutes Essen entstanden. Immer mehr Bäuer*innen bauen ihre Ställe um und erzeugen Lebensmittel ohne Gentechnik. Immer mehr Betriebe nutzen weniger Pestizide oder setzen komplett auf Bio. Bürgerinitiativen haben unzählige Tierfabriken verhindert, Volksbegehren kämpfen für Artenvielfalt und Foodsharing-Projekte retten wertvolle Lebensmittel vor dem Müll. Immer mehr Menschen kaufen konzernfreie Lebensmittel und essen weniger Fleisch. Gemeinsam zeigen wir, wie Agrar- und Ernährungswende geht. Ackerland in Bauernhand! Seit Jahrzehnten stemmt sich die Agrarlobby gegen jede Veränderung. Landwirtschaftsministerin Julia Klöckner lässt die Bäuer*innen bei den notwendigen Veränderungen allein. Sie will die Milliarden-Subventionen weiter denen geben, die viel Land besitzen – egal, wie sie wirtschaften. Mit staatlicher Unterstützung kaufen Investor*innen immer mehr Ackerland, während allein in den letzten 10 Jahren hierzulande 100.000 Betriebe aufgeben mussten. Schluss damit! Fördergelder nur noch für Bauernhöfe, die die Tiere gut halten, Umwelt- und Klima schützen und gutes Essen für uns alle herstellen! Wir haben Agrarindustrie satt! Die industrielle Landwirtschaft hat fatale Auswirkungen: Flächendeckender Pestizideinsatz tötet massenhaft Insekten. Zu viel Gülle verschmutzt unser Wasser. Für das Gensoja-Futter in deutschen Tierfabriken werden Regenwälder abgebrannt. Dumping-Exporte überschwemmen die Märkte im globalen Süden und berauben unzählige Bäuer*innen ihrer Existenz. Die Agrarindustrie heizt die Klimakrise und gesellschaftliche Konflikte gefährlich an – das müssen wir stoppen! Auf die Straße – für das Klima und die Landwirtschaft! Ob dürre Äcker oder abgesoffene Felder – die Klimakrise lässt sich nicht ignorieren. Die Wissenschaft warnt schon lange, dass wir den Planeten mit der aktuellen Wirtschaftsweise zugrunde richten. Obwohl Hunderttausende für das Klima streiken, kommen von der Bundesregierung nur Bankrotterklärungen. Das haben wir satt! Zum Auftakt der Grünen Woche, wenn sich die Agrarminister*innen der Welt in Berlin treffen, bringen wir unsere Forderungen in die Schlagzeilen. Während drinnen über Landwirtschaft, Fördergelder und Mercosur geredet wird, zeigen wir draußen mit unserem Massenprotest klare Kante: Landwirtschaft und Gesellschaft müssen jetzt klimagerecht umgebaut werden! Wir fordern von der Bundesregierung:Die Agrarwende finanzieren – Bauernhöfe beim Umbau der Landwirtschaft nicht alleine lassen: Mit gezielten Subventionen und fairen Preisen sind artgerechte Tierhaltung und mehr Klima- und Umweltschutz machbar!Klares Veto gegen das EU-Mercosur-Abkommen: Für gerechten Welthandel, globale Bauernrechte und konsequenten Regenwaldschutz!Nein zu den Industrie-Mogelpackungen: Gentechnik, Patent-Saatgut und der routinemäßige Einsatz von Pestiziden und Kunstdünger verschärfen die Klimakrise und den Hunger!Seid dabei: Kommt mit uns – der breiten, bunten und entschlossenen Bewegung – auf die Straße. Schnappt euch euren Kochtopf und schlagt mit uns Alarm für die Agrar- und Ernährungswende! Demonstration: 18. Januar 2020 | 12 Uhr | Brandenburger Tor | Berlin FOTOS DEMO FOTOS TRAKTOR-DEMO FOTOS BAUERNPROTEST Demozug Frontbanner EU-Geld-Banner Traktoren für Klimaschutz Übergabe der Protestnote Traktor-Demo Imker vorm Ministerium #carousel-backgroundimage-5278-371 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_34e389ba08.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-5278-371 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_810028326b.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-5278-371 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_66e91b4a95.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-5278-371 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_fde8e3b069.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-5278-371 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_68798592a7.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-5278-371 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_934a6e810a.jpg'); } } #carousel-backgroundimage-5278-368 { background-image: url('/fileadmin/_processed_/2/7/csm_Frontbanner_2_f03830244e.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-5278-368 { background-image: url('/fileadmin/_processed_/2/7/csm_Frontbanner_2_04d4f917df.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-5278-368 { background-image: url('/fileadmin/_processed_/2/7/csm_Frontbanner_2_cf2f93b50f.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-5278-368 { background-im