title = "Presse - Wir haben es satt!"
full_description = 'Pressekontakt Anne Skambraks (sie/ihr) Leitung der Kampagne E-Mail: skambraks[at]meine-landwirtschaft[dot]de Telefon: 0163 184 67 65 Pressekontakt Nicola Puell (neutrale Anrede) Presse- und Öffentlichkeitsarbeit E-Mail: presse[at]meine-landwirtschaft[dot]de Telefon: 0151-51245795 RÜCKBLICK „Wir haben es satt!“-Demo 18.01.2025 Pressekonferenz Zeit: Donnerstag, 9. Januar 2025, 10.00–11.00 Uhr AUFZEICHNUNG PRESSEMITTEILUNG Demonstration Zeit: Samstag, 18. Januar 2025, ab 12.00 Uhr Ort: Bundeskanzleramt/Platz der Republik, Berlin BILDER DEMO BILDER BÄUERLICHE KUNDGEBUNG PRESSEMITTEILUNG Presseverteiler Immer auf dem Laufenden bleiben – hier in unseren Verteiler eintragen. PRESSEVERTEILER Pressemitteilungs-Archiv Eine Übersicht der Pressemitteilungen finden Sie in unserem Archiv. ARCHIV Rückblick: Hof mit Zukunft 2024 13.–16. Juni 2024: Das "Wir haben es satt!"-Bündnis hat Aktivist*innen für eine klimagerechte und nachhaltige Welt auf Bauernhöfe gebracht. Dort sind sie in die Arbeitswelt eingetaucht und mit den Bäuer*innen ins Gespräch gekommen. ZUM RÜCKBLICK PRESSEBILDER Rückblick: "Wir haben es satt!"-Demo 2024 20. Januar 2024: Unter dem Moto „Gutes Essen hat aktuell keine Zukunft“ fordert das "Wir haben es satt!"-Bündnis gemeinsam mit 8.000 Menschen in Berlin ein sofortiges Ende des agrarpolitischen Stillstands. ZUM RÜCKBLICK PRESSEBILDER Pressemitteilung 18. Januar 2025 PDF-VERSION FOTOS PDF-VERSION Pressemitteilung 18. Januar 2025 Zeit für mutige Agrarpolitik! Landwirtschaft und Zivilgesellschaft demonstrieren geschlossen für Tier-, Klima- und Umweltschutz, den Erhalt vieler und vielfältiger Höfe, faire Preise und gutes Essen. Berlin, 18. Januar 2025: Gemeinsam mit 9.000 Demonstrierenden fordern rund 60 Organisationen auf der „Wir haben es satt!“-Demo von der künftigen Bundesregierung ein zuverlässiges Bekenntnis und eine ambitionierte Förderung für eine bäuerlich-ökologischere Landwirtschaft. Gemeinsam adressieren Bäuer*innen, Verbraucher*innen und Aktive der Natur-, Tier- und Klimaschutzbewegung die Politik: „Wir alle wollen gesunde Lebensmittel. Wir alle wollen Tierwohl, Umwelt- und Klimaschutz. Die kommende Bundesregierung muss bäuerliche Betriebe dabei endlich adäquat unterstützen!“, fordert Anne Skambraks, Kampagnenleitung des „Wir haben es satt!“-Bündnisses. Das Bündnis wirft der Bundesregierung vor, dem größten Rollback in der Agrarpolitik seit Jahrzehnten tatenlos zugeschaut zu haben. Dieser beschleunigt Klimawandel und Verlust von Artenvielfalt und erhöht zudem die Planungsunsicherheit auf den Höfen. Wie auch schon von vorangegangenen Regierungen wurden der Umbau der Tierhaltung liegen gelassen und viel zu oft Konzerninteressen priorisiert. Es fehlen weiterhin Gesetze, welche Ackerland für die Nahrungsmittelproduktion sichern, und außerlandwirtschaftliche Investoren treiben die Preise für Äcker und Wiesen ungebremst in die Höhe. Weltweit leiden Menschen unter Hunger und Ernährungsarmut, während Agrarrohstoffhändler ihre Gewinne vervielfachen. Megaställe und Düngemittelindustrie tragen mit klimaschädlichen Gasen zur Klimakrise bei, weil ambitionierte Klimaschutzgesetze fehlen. Die Ernährungssicherheit ist gefährdet, wenn einer vielfältigen und resilienten Landwirtschaft der Nachwuchs ausgeht: Angesichts steigender Investitionskosten entscheiden sich immer weniger junge Menschen, Bäuerin oder Bauer zu werden. Auch weil vom Preis an der Supermarktkasse bei den Bäuer*innen viel zu wenig ankommt. Die demonstrierenden Bäuer*innen und Verbraucher*innen erwarten von der kommenden Koalition mehr. Auf dem Platz vor dem Reichstagsgebäude bilden Demo-Teilnehmende ein riesiges Wahlkreuz aus Menschen, darunter ein Banner mit dem Spruch „Mutige Agrarpolitik wählen!“. Olaf Bandt, Vorsitzender des Bund für Umwelt und Naturschutz Deutschland (BUND), kommentiert: „Die Agrarpolitik der letzten Jahre und Jahrzehnte hat es verpasst, einen mutigen Kurs für die Landwirtschaft vorzugeben. Das Ergebnis sind massive Probleme und kaum Perspektiven für bäuerliche Betriebe. Zivilgesellschaft, Agrarsektor und Wissenschaft haben dafür gemeinsame Lösungen entwickelt. Eine neue Bundesregierung muss nach der Wahl Tier-, Klima- und Umweltschutz endlich voranbringen. Das ermöglicht auch neue Zukunftsperspektiven für unsere heimischen Betriebe!“ Am nötigen gesellschaftlichen Konsens mangelt es nicht. Umfragen und Kaufverhalten zeigen, dass vielen Menschen Tierwohl und Klimaschutz wichtig sind. So fordert das „Wir haben es satt!“-Bündnis die kommende Regierung auf, Höfe endlich mit verbindlichen Gesetzen, kostendeckenden Erzeuger*innenpreisen und einer sicheren Finanzierung zu stärken. Denn nur mit wirtschaftlichen Perspektiven für ihre Betriebe können die Bäuer*innen ihren Anteil an einer guten Zukunft für alle leisten. Auf Schildern der Demonstrierenden ist zu lesen, wie sie sich diese Zukunft vorstellen: „Mehr Tierwohl“, „Arten- und Klimaschutz“, „Ackerland in Bäuer*innenhand“, „Gesunder Boden für unsere Zukunft“, „Lieber gute Politik, statt schlechtes Essen“, „Die Zukunft ist ökologisch“, „Bäuer*innen verdienen mehr als sie verdienen“, „Nahrung ist ein Menschenrecht“. Statements von Redner*innen Antje Hollander, junge Arbeitsgemeinschaft bäuerliche Landwirtschaft e.V. (AbL) „Die Agrarlobby hat die großen bäuerlichen Proteste des letzten Winters dafür genutzt, die ökologische Wirksamkeit der Agrarpolitik um Jahre zurück zu werfen. Bei den Ursachen der Proteste – wie fehlender Wertschöpfung auf unseren Höfen – wird hingegen blockiert. Die politisch Verantwortlichen in Brüssel und Berlin lassen diese Entwicklungen ohne erkennbaren Widerstand geschehen. Die kommende Bundesregierung muss endlich eine mutige und weitsichtige Agrarpolitik machen, welche die bestehenden Einigungen zum Umbau der Tierhaltung und der Ökologisierung der Agrarpolitik umsetzt. Auch um jungen Bäuer*innen wie mir eine langfristige Perspektive zu geben.“ Elke Ronneberger, Diakonie Deutschland, Gastrednerin „Wenn wir unsere ökologischen Ziele erreichen wollen, braucht es dringend ein Umdenken! Wir müssen unser Ernährungssystem umbauen – und dabei muss es gerecht zugehen. Bei der sozialen Existenzsicherung müssen ökologische Aspekte endlich mitgedacht werden. Dies ist eine Frage der Menschenwürde und eine Frage der Gesundheit unserer Erde. Aber es ist auch zwingend notwendig für die Akzeptanz der Ernährungswende. Deshalb sagen wir als Diakonie: Ein menschenwürdiges Existenzminimum kann in Zukunft nur gesichert werden, wenn es zu einem sozial-ökologischen Existenzminimum weiterentwickelt wird.“ Harald Schaum, Industriegewerkschaft Bauen-Agrar-Umwelt, Gastredner „Hohe Profite der Einzelhandelskonzerne, Preisdruck bei den Agrarbetrieben und zu geringe Löhne für Beschäftigte in der Landwirtschaft hängen zusammen und sind ein massives Problem. Es ist daher gut und richtig, dass ‚Wir haben es satt!‘ eine Begrenzung der Konzernmacht und kostendeckende Erzeugerpreise fordert, denn das sind Voraussetzungen für gute Arbeit in der Landwirtschaft.“ Morgan Ody, La Via Campesina, Gastrednerin „733 Millionen Menschen leiden weltweit an Hunger, während die Profite der multinationalen Unternehmen der Agrarindustrie in die Höhe gehen. La Via Campesina baut internationale bäuerliche Solidarität auf, gegen alle Formen kapitalistischer, kolonialer und patriarchaler Herrschaft. Jeden Tag globalisieren wir die Kämpfe, um auch die Hoffnung zu globalisieren.“ Christoph Bautz, Campact „Neue Pestizide auf den Markt bringen, Agrarsubventionen weiter an Megaställe fließen lassen, den Düngemitteleinsatz nicht begrenzen – mit diesen Konzepten aus der Vergangenheit macht die Merz-CDU Wahlkampf und will sie in Regierungspolitik überführen. Diese Klientelpolitik für die Agrarindustrie trifft heute auf den geeinten Widerspruch von Bäuer*innen und Verbraucher*innen. Mit voller Kraft streiten wir für die Agrarwende und gutes Essen für alle.“ Tobias Schied und Carla Reemtsma, Fridays for Future „Wer im Angesicht von gigantischen Bränden wie in Los Angeles immer noch meint, die Klimakrise sei harmlos und müsse nicht bekämpft werden, der lebt offensichtlich in einem Paralleluniversum. Wer Klimaschutz bekämpft, vergeht sich an unseren Lebensgrundlagen. Landwirtschaft braucht Klimaschutz, und deshalb muss die nächste Bundesregierung mit Klimaneutralität bis spätestens 2035 endlich liefern.“ Quammar Abbas, Pakistan Kissan Rabita Committee, Gastredner „In Pakistan und im gesamten globalen Süden erleben wir aus erster Hand das systematische Vordringen von Konzerninteressen in die Landwirtschaft. Deutsche Unternehmen wie Bayer und BASF sind dabei führend. Sie setzen auf gentechnisch veränderte Organismen (GVO), Hybridsaatgut und Agrochemikalien und kriminalisieren die jahrhundertealten Traditionen des Schützens und Tauschens von Saatgut. Dies ist ein direkter Angriff auf unsere Saatgutsouveränität, ein Recht, das in unserer Identität als Landwirte und Bewahrer der biologischen Vielfalt und in der UN-Bauernrechteerklärung verankert ist.“ Marlene Herzog, Bioland Bäuerin und Vorsitzende AbL Rheinland-Pfalz/Saarland „Ich kämpfe für eine gesunde Zukunft auf einer gesunden Erde für unsere Kinder und Enkelkinder. Dafür brauchen wir eine klima- und umweltfreundliche Landwirtschaft, die existenzsichernde Preise erzielen kann. Wir brauchen glückliche Tiere, faire Arbeitsbedingungen, gesunde Lebensmittel und Vielfalt. Und wir brauchen regionale Strukturen damit diese Landwirtschaft weiter bestehen kann. Was wir nicht brauchen, sind große Agrarkonzerne, die die Preise drücken und durch ihre Macht regionale Strukturen zerstören.“ Weitere Informationen Demonstration | www.wir-haben-es-satt.de Presse-Ressourcen | www.wir-haben-es-satt.de/presse Fotos Am Demo-Tag stellen wir sukzessive Fotos zur kostenfreien Verwendung zur Verfügung: „Wir haben es satt!“-Demonstration 2025 https://flic.kr/s/aHBqjBXWjF „Zukunft braucht Höfe: Bäuerinnen und Bauern vor Konzerninteressen – weltweit“ https://flic.kr/s/aHBqjBY284 Nicola Puell Presse- und Öffentlichkeitsarbeit Mobil: (0151) 51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung 13. Januar 2025 PDF-VERSION PDF-VERSION Pressemitteilung 13. Januar 2025 Gemeinsame Pressemitteilung von “Wir haben es satt!”, AbL, Bioland, demeter, Biokreis, Solawi Netzwerk Konsequenzen nach dem Ausbruch der Maul- und Klauenseuche in Brandenburg Keine Treckerbegleitung bei Agrardemonstration in Berlin Berlin, 13. Januar 2025: Die diesjährige „Wir haben es satt!“-Agrardemonstration am 18. Januar in Berlin wird ohne die geplante Treckerbegleitung von Bäuerinnen und Bauern stattfinden. Die Verantwortlichen der Veranstaltung fassten diesen Beschluss auf Grund des aktuellen Ausbruchs der hochansteckenden Maul- und Klauenseuche auf einem Betrieb in Brandenburg. Claudia Gerster, AbL-Bundesvorsitzende und Bäuerin aus Sachsen-Anhalt, kommentiert: „Bäuerinnen und Bauern mit ihren Treckern an der Spitze der Demonstration sind für uns ein sehr wichtiger Bestandteil unseres breiten Bündnisses von 60 Organisationen und Verbänden. Die gemeinsame Demonstration mit Treckern und Demoteilnehmenden zu Fuß ist ein starkes solidarisches Zeichen für den Zusammenhalt von Landwirtschaft und Zivilgesellschaft. Doch dieses Jahr haben wir uns kurzfristig schweren Herzens gegen die Treckerbegleitung entschieden, weil wir das Risiko einer Ausweitung der Maul- und Klauenseuche in Brandenburg und über die Ländergrenzen hinaus durch eine eventuelle Übertragung durchfahrender Trecker vermeiden wollen. Es ist auch ein Zeichen der Achtung und des Respekts vor den betroffenen tierhaltenden Berufskolleginnen und Berufskollegen, die in Brandenburg und im ganzen Bundesgebiet berechtigterweise besorgt um die Gesundheit ihrer Tiere sind.“ Anne Skambraks, Leitung der Kampagne Meine Landwirtschaft, ergänzt: „Auch wenn uns dieses Mal die Trecker und Anhänger mit ihren vielfältigen politischen Botschaften sehr fehlen werden: Es gibt nicht nur für Bäuerinnen und Bauern, sondern auch für alle Bürgerinnen und Bürger gute Gründe am 18. Januar, vor der Bundestagswahl, zusammen auf die Straße zu gehen! Mit der Frage „Wer profitiert hier eigentlich?“ solidarisieren sich Stadt und Land für eine Landwirtschaft und ein Ernährungssystem, die das Wohl der Gemeinschaft im Fokus haben. Gemeinsam stehen wir für eine gesunde Lebensmittelerzeugung, für Klima-, Tier- und Umweltschutz. Wir fordern von einer neuen Bundesregierung mutige Agrarpolitik! Damit stärken wir der wertvollen Arbeit von Bäuerinnen und Bauern den Rücken. Zukunft geht nur zusammen, Zukunft braucht Höfe.“ Hinweis an die Redaktionen: Die Verantwortlichen der Demonstration stehen in ständiger Verbindung mit den Behörden, dem Veterinäramt und der Polizei, um alle Hygieneauflagen einzuhalten. Zusätzlich zu den amtlichen Maßnahmen, haben wir uns zu diesem weiteren, freiwilligen Schritt entschieden. Die Demonstration wird am Samstag, 18. Januar 2025, ohne Treckerbegleitung und ansonsten wie angekündigt stattfinden. Die geplante morgendliche Zwischenkundgebung der Bäuer*innen und Zivilgesellschaft am Samstag, 18. Januar 2025, vor dem GFFA mit Übergabe einer bäuerlichen Protestnote an Bundesagrarminister Cem Özdemir und die Parlamentarische Staatssekretärin Ophelia Nick wird in abgewandelter Form stattfinden. Wir informieren Sie rechtzeitig. Kontakt für die Presse Xenia Brand, AbL-Bundesgeschäftsführung (01525) 7579219 | brand[at]abl-ev[dot]de Anne Skambraks, Kampagnenleitung des „Wir haben es satt!“-Bündnis (0163) 1846765 | skambraks[at]meine-landwirtschaft[dot]de Nicola Puell Presse- und Öffentlichkeitsarbeit Mobil: (0151) 51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Presseseite: www.wir-haben-es-satt.de/presse Pressemitteilung 9. Januar 2025 PDF-VERSION PDF-VERSION Pressemitteilung 9. Januar 2025 Aufruf zur „Wir haben es satt!“-Demonstration am 18. Januar 2025 in Berlin: Das "Wir haben es satt!"-Bündnis fordert von der kommenden Bundesregierung: "Gemeinwohl vor Konzerninteressen in der Agrarpolitik!" Berlin, 9. Januar 2025: Unter der Leitfrage „Wer profitiert hier eigentlich?“ rufen im Vorfeld der Bundestagswahl rund 60 Organisationen aus Landwirtschaft und Zivilgesellschaft zur „Wir haben es satt!“-Demonstration am 18. Januar auf. Verbraucher*innen leiden unter hohen Lebensmittelpreisen und Bäuer*innen kämpfen um ihre Existenz: Seit 2021 sind Lebensmittelpreise in Deutschland um rund 33 Prozent gestiegen – deutlich stärker als die Gesamtinflation von 20 Prozent. Bei den Bäuer*innen, die unsere Lebensmittel erzeugen, kommt davon wenig an. Sie haben einen Anteil von durchschnittlich nicht einmal 15 Prozent der Bruttowertschöpfung. Allein in Deutschland mussten mehr als 350.000 Höfe in den letzten 30 Jahren schließen. Handel, Fleisch- und Milchindustrie machen derweil auch in Krisenzeiten gewohnt hohe Gewinne. Mit der Bundestagswahl 2025 entscheidet sich die Ausrichtung der Agrarpolitik für die kommenden Jahre. Werden wir mehr Fairness, Tier- und Umweltschutz bekommen oder weiteres Höfe'
