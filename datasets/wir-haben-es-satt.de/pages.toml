title = "Höfe und Regionen - Wir haben es satt!"
full_description = 'Hintergrundinfos: Die gemeinsame Agrarpolitik der EU (GAP) Stellungnahme der Verbändeplattform zur GAP Ernährungsräte Marburger Aktionsplan für zukunftsfeste Ernährungssysteme in Europa Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Starke Höfe und lebendige Regionen Seit Jahrzehnten verdrängen immer größere Agrarunternehmen kleine Bauernhöfe und Familienbetriebe. Allein 2023 mussten in Deutschland rund 3.000 Höfe aufgeben. Die EU verteilt 80 Prozent der Fördergelder nach dem System „wer viel hat, der bekommt viel“ – ohne große Anforderungen an Natur- Umwelt- oder Tierschutz. Von diesen flächenbezogenen Direktzahlungen profitieren insbesondere große, industrielle Ackerbaubetriebe. Die resultierenden billigen Agrarrohstoffe nutzen dann auch der Lebensmittelindustrie – auf Kosten von Bodengesundheit, Artenvielfalt, Tierwohl und Klimaschutz. Diejenigen Höfe, die für die Entwicklung des ländlichen Raums am wertvollsten sind, werden nicht ausreichend gefördert: kleine und gemischte Betriebe, insbesondere in benachteiligten Regionen. Neue Höfe, und solche, die bereits Tier- und Umweltschutz leisten. Auch die regionalen Verarbeitungs- und Vermarktungsstrukturen kommen zu kurz. In der Folge sterben die Dörfer, Bäckereien schließen, verarbeitendes Gewerbe und lokale Arbeitgeber*innen machen dicht. So sind auch Unmut und Zukunftspessimismus das traurige Ergebnis einer verfehlten Agrarpolitik. Unsere Forderungen: Ende der „Wachse oder weiche“-Politik – wir brauchen viele und vielfältige Höfe als Motor für lebendige ländliche Räume Existenzgründungsprämien für junge und neue Bäuerinnen und Bauern Öffentliches Geld für öffentliche Leistungen – alle EU-Fördergelder an gesellschaftliche Leistungen wie Tierwohl, Klimaschutz und Artenvielfalt koppeln Förderung regionaler Wertschöpfungsketten für eine krisenfeste Versorgung mit gesunden Lebensmitteln und als Investition in unsere Demokratie Hintergrundinfos: Die gemeinsame Agrarpolitik der EU (GAP) Stellungnahme der Verbändeplattform zur GAP Ernährungsräte Marburger Aktionsplan für zukunftsfeste Ernährungssysteme in Europa ← ÜBERSICHT → Hintergrundinfos: Die gemeinsame Agrarpolitik der EU (GAP) Stellungnahme der Verbändeplattform zur GAP Ernährungsräte Marburger Aktionsplan für zukunftsfeste Ernährungssysteme in Europa'
