["https://wir-haben-es-satt.de/informieren/aufruf/artenvielfalt"]
title = "Artenvielfalt - Wir haben es satt!"
full_description = 'Hintergrundinfos: Insektensterben Schmetterlingssterben Pestizidatlas Pestizide in der Landwirtschaft Strategie zur Reduzierung von Pestiziden Offener Brief Pflanzenschutz Studie Pestizidabgabe “Optimum statt Maximum” als Ackerbaustrategie Bayer und BASF im globalen Pestizidmarkt Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Mehr Artenvielfalt, weniger Pestizide Ein Drittel aller Insektenarten ist vom Aussterben bedroht – in Deutschland ist vor allem der Rückgang der Fluginsekten um 76 Prozent in 27 Jahren mehr als dramatisch. In der Landwirtschaft kommt es bereits zu Ernteeinbußen aufgrund der fehlenden Bestäuber. Währenddessen profitieren deutsche Unternehmen enorm vom Handel mit umwelt- und gesundheitsschädlichen, in der EU verbotenen Pestizidwirkstoffen. Für die Folgekosten müssen sie bisher nicht aufkommen: In Deutschland hat die Landwirtschaftliche Berufsgenossenschaft die Beitragssätze bis zu 20 Prozent angehoben, seit sie Parkinson durch den Einsatz von Pestiziden als Berufskrankheit anerkennt – die Kosten tragen die bäuerlichen Betriebe. Mit zunehmender Abnahme der Biodiversität, dem sich beschleunigenden Artensterben und dem Schwund genetischer Vielfalt geht die Beeinträchtigung der Ökosysteme und die abnehmende Widerstandsfähigkeit unserer Ernährungssysteme einher. Diese globale Krise könnte den Klimakollaps sogar übertreffen. Unsere Forderungen: Das Artensterben muss global gestoppt werden – öffentliche Gelder für Biodiversitätsmaßnahmen in der Landwirtschaft Glyphosatverbot und Pestizidreduktion mit den Höfen zusammen anpacken: Einsatz von chemisch-synthetischen Pestiziden deutlich reduzieren – entstehenden Mehraufwand honorieren und beratend unterstützen Doppelstandards abbauen: Export von in der EU verbotenen Pestiziden stoppen Verursacherprinzip anwenden: Kosten für Umwelt- und Gesundheitsschäden müssen die Pestizidkonzerne tragen Hintergrundinfos: Insektensterben Schmetterlingssterben Pestizidatlas Strategie zur Reduzierung von Pestiziden Offener Brief Pflanzenschutz Studie Pestizidabgabe “Optimum statt Maximum” als Ackerbaustrategie Bayer und BASF im globalen Pestizidmarkt ← ÜBERSICHT → Hintergrundinfos: Insektensterben Schmetterlingssterben Pestizidatlas Pestizide in der Landwirtschaft Strategie zur Reduzierung von Pestiziden Offener Brief Pflanzenschutz Studie Pestizidabgabe “Optimum statt Maximum” als Ackerbaustrategie Bayer und BASF im globalen Pestizidmarkt'
