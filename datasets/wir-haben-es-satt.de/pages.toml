title = "Hof mit Zukunft 2023 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Show larger version Mach mit! Du bist Landwirt*in oder Aktivist*in und willst an "Hof mit Zukunft" teilnehmen? Dann trage dich in unserer Vormerkliste ein oder abonniere unseren Newsletter. VORMERKLISTE NEWSLETTER FAQ Du hast Fragen zur Teilnahme bei "Hof mit Zukunft"? Hier findest du unsere FAQs: FÜR HÖFE FÜR AKTIVISTI Das war Hof mit Zukunft 2023 15. bis 18. Juni 2023 24 Höfe bundesweit konventionell und bio Gemüse- und Obstanbau, Ackerbau, Sonderkulturen, Tierhaltung (Milchvieh, Masttierhaltung, Bienen), Saatgutvermehrung 70 Aktivist*innen Fridays for Future, Letzte Generation, Extinction Rebellion, German Zero, NABU, BUND, Greenpeace, Ende Gelände, foodsharing, SlowFood, Aktion Agrar und andere mit und ohne landwirtschaftliche Vorkenntnisse aus der ganzen Bundesrepublik Presse Am Ende der drei Tage sind sich alle Beteiligten einig: Aktivismus und Landwirtschaft sollten sich noch viel öfter treffen. Aber was genau ist eigentlich Aktivismus? „Aktivisten sind Menschen, die etwas verändern wollen. Und sich dafür auch aktiv einsetzen und engagieren“, antwortet Klara. Und sagt an Familie Oestmann gewandt: „Also für mich seid ihr auch alle Aktivist*innen.“ Land & Forst (27.06.2023) Wenn Klimaaktivisten auf dem landwirtschaftlichen Betrieb mitarbeiten Am Ende des Tages wird klar, die To-do-Liste in der Politik in Sachen Agrarpolitik ist nicht kleiner als die auf einem Bauernhof. Fördermittelvergabe reformieren, Boden gerecht verteilen und auch noch junge Leute für ökologische Landwirtschaft motivieren – wie schön es wäre, wenn die Politik sie auch so gewissenhaft abarbeiten würde wie die engagierten Menschen auf dem Hof Schwalbennest. TAZ (26.06.2023) Theorie und Praxis am Acker PRESSESPIEGEL PRESSEMITTEILUNG Aktivisten auf Augenhöhe Ein Erfahrungsbericht „Ihr seid also die Aktivisten?“ werden wir von dem Reporter der Lokalzeitung gefragt, der uns mit prüfendem Blick in großen Schritten entgegenkommt. Zwar bejahen wir, aber eigentlich ist die Frage für mich nicht geklärt… WEITERLESEN Impressionen HmZ 23 1 HmZ 23 2 HmZ 23 3 HmZ 23 4 HmZ 23 5 HmZ 23 6 #carousel-backgroundimage-8050-1336 { background-image: url('/fileadmin/_processed_/0/5/csm_202306_Hof_mit_Zukunft_59__c__Carla_Ulrich_c457867fdf.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-8050-1336 { background-image: url('/fileadmin/_processed_/0/5/csm_202306_Hof_mit_Zukunft_59__c__Carla_Ulrich_21037be578.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8050-1336 { background-image: url('/fileadmin/_processed_/0/5/csm_202306_Hof_mit_Zukunft_59__c__Carla_Ulrich_b51a096ce2.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8050-1336 { background-image: url('/fileadmin/_processed_/0/5/csm_202306_Hof_mit_Zukunft_59__c__Carla_Ulrich_0fe834a050.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-8050-1336 { background-image: url('/fileadmin/_processed_/0/5/csm_202306_Hof_mit_Zukunft_59__c__Carla_Ulrich_b8e7c3b82f.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-8050-1336 { background-image: url('/fileadmin/_processed_/0/5/csm_202306_Hof_mit_Zukunft_59__c__Carla_Ulrich_065689c889.jpg'); } } #carousel-backgroundimage-8050-1337 { background-image: url('/fileadmin/_processed_/9/0/csm_HmZ23_Bild1_a7fd51cde1.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-8050-1337 { background-image: url('/fileadmin/_processed_/9/0/csm_HmZ23_Bild1_9340f05596.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8050-1337 { background-image: url('/fileadmin/_processed_/9/0/csm_HmZ23_Bild1_d793304324.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8050-1337 { background-image: url('/fileadmin/user_upload/aktionen/2023/Hof_mit_Zukunft/HmZ23_Bild1.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-805