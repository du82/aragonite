sabdruecke.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-5777-501 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Ausschnitt_Meer_Fussabdruecke.jpg'); } } #carousel-backgroundimage-5777-503 { background-image: url('/fileadmin/_processed_/a/f/csm_210116_Kloeckner_Abtreten_1ece28dcc3.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-5777-503 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Kloeckner_Abtreten.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-5777-503 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Kloeckner_Abtreten.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-5777-503 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Kloeckner_Abtreten.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-5777-503 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Kloeckner_Abtreten.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-5777-503 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Kloeckner_Abtreten.jpg'); } } #carousel-backgroundimage-5777-500 { background-image: url('/fileadmin/_processed_/7/8/csm_210116_Bauernprotest_Schilder_842ec2ab94.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-5777-500 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Bauernprotest_Schilder.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-5777-500 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Bauernprotest_Schilder.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-5777-500 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Bauernprotest_Schilder.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-5777-500 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Bauernprotest_Schilder.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-5777-500 { background-image: url('/fileadmin/user_upload/demo_21/Karussell_Rueckblick/210116_Bauernprotest_Schilder.jpg'); } } Zurück Weiter Pressemitteilung „Wir haben es satt!“-Protest: Bauern-, tier- und umweltfeindliche Agrarpolitik im Wahljahr abwählen! Agrarwende-Bündnis fordert in Berlin zukunftsfähige Agrarpolitik / „Aktion Fußabdruck“ – 10.000 Menschen stimmen mit den Füßen für Höfe, Tiere und Umwelt ab Berlin, 16.01.21. Mit ihren Fußabdrücken fordern rund zehntausend Menschen heute in Berlin die Agrarwende. Zum Auftakt des Superwahljahres trägt das „Wir haben es satt!“-Bündnis ein Meer aus Fußabdrücken vor das Kanzler*innenamt. So demonstriert die Agrarwende-Bewegung pandemiekonform für eine Politik, die Höfen, Tieren und der Umwelt eine Zukunft gibt. „Agrarindustrie abwählen – Agrarwende lostreten!“ lautet die Botschaft vor dem Amtssitz von Kanzlerin Merkel. Saskia Richartz, „Wir haben es satt!“-Sprecherin, sagt im Namen der 60 Bündnis-Organisationen: „Billiges Essen ist eine Sackgasse, die weder die Landwirtschaft noch die Verbraucher*innen weiterbringt. Julia Klöckner versagt als Agrarministerin und macht eine Politik auf Kosten von Höfen, Tieren und Umwelt. Die CDU gehört nach 15 Jahren miserabler Agrarpolitik abgewählt. Wir fordern: Höfesterben stoppen, Umbau der Tierhaltung fördern, Pestizidausstieg vorantreiben und ein klares Nein zur Gentechnik und zum EU-Mercosur-Abkommen.“ Statt für eine bäuerliche und ökologischere Landwirtschaft auf die Straße zu gehen, beteiligten sich in diesem Jahr rund 10.000 Menschen – kreativ und ausdrucksstark – von zu Hause aus: Sie schickten unzählige Fuß- und Stiefelabdrücke sowie Treckerspuren mit Forderungen nach Berlin. „Insekten retten“, „kleinbäuerliche Strukturen statt Agrarsteppen“, „lieber Gülle am Schuh als CDU“ oder „Bewegungsfreiheit auch für Schweine“ ist im Regierungsviertel zu lesen. Besonders eindrucksvoll: Eine Familie aus Hamburg hat Agrarwende-Botschaften von vier Generationen – von drei bis 93 Jahre – eingesandt. Schon am Vormittag hatte eine Delegation von Bäuerinnen und Bauern aus Berlin und dem Umland vor der CDU-Zentrale ihrem Ärger über 15 Jahre verfehlte Unions-Agrarpolitik bei einer Protestkundgebung Luft gemacht. Sandra Finke-Neuendorf, Bäuerin aus Blankenfelde bei Berlin, die im Traktor-Konvoi mitfuhr, sagt: „Dumpingpreise, Klimakrise und Artensterben zwingen uns alle zu Veränderungen. Wir Bäuerinnen und Bauern sind bereit, unseren Beitrag zu leisten. Von Ministerin Klöckner erwarten wir endlich die notwendigen Rahmenbedingungen. Gerechte Erzeugerpreise und ein ernsthafter Systemwechsel in der Agrarpolitik sind unabdingbar." Hintergrund: Konventionell und ökologisch wirtschaftende Bäuer*innen kämpfen im „Wir haben es satt!“-Bündnis im Schulterschluss mit der Gesellschaft gegen die fatalen Auswirkungen der intensiven industriellen Landwirts'''
