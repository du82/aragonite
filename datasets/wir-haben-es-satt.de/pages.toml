["https://wir-haben-es-satt.de/informieren/aufruf/oekolandbau"]
title = "Ökolandbau - Wir haben es satt!"
full_description = 'Hintergrundinfos: Ökolandbau Solidarische Landwirtschaft (SoLaWi) Agrarökologie FAQ Agrarökologie Agrarökologie – Zwischenbilanz Ampelregierung 2024 Positionspapier Agrarökologie Vandana Shiva – Agrarindustrie versus Agrarökologie Kursbuch Agrarwende Ökolandbau fördern – GAP weiterentwickeln Nationale Bio-Strategie 2030: 30 Prozent Bio-Fläche bis 2030 Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Ökolandbau Mit dreistem Greenwashing bedroht die Agrar- und Lebensmittelindustrie die Agrarökologie und den Ökolandbau: Konzerne wie Nestlé, Cargill oder Syngenta verkaufen ihre Praktiken als „regenerativ“ und „nachhaltig“ und werben irreführend mit Begriffen wie „klimaneutral“ auf ihren Produkten. Gegen diese billige Industrieware im grünen Anstrich müssen die tatsächlich nachhaltigen Bio-Lebensmittel konkurrieren. Der Ökolandbau ist mit seinen erwiesenen Nachhaltigkeitsleistungen das wirksamste etablierte Anbausystem innerhalb der Agrarökologie. In Kombination mit der Solidarischen Landwirtschaft sind Öko-Landwirt*innen Pionier*innen eines sozialen Wirtschaftssystems: Gemeinsam mit ihren Mitgliedern befreien sie sich von Marktzwängen und sichern Auskommen und gutes Essen für alle. Unsere Forderungen: Ausbau des Ökolandbaus und der Solidarischen Landwirtschaft – als Wegbereiter für den Umbau der Landwirtschaft hin zu einem nachhaltigen Agrar- und Ernährungssystem Stärkung des Ökolandbaus im Rahmen der EU-Agrarpolitik – Gesamtbetriebliche, mehrjährige und ganzheitliche Leistungen angemessen belohnen Nationale Bio-Strategie 2030 umsetzen: Maßnahmen finanziell ausstatten und endlich handeln Forschungsvolumen und Bildungsangebote zum Ökolandbau an den nationalen Bio-Zielen orientieren und ebenfalls auf 30 Prozent erhöhen Hintergrundinfos: Ökolandbau Solidarische Landwirtschaft (SoLaWi) Agrarökologie FAQ Agrarökologie Agrarökologie – Zwischenbilanz Ampelregierung 2024 Positionspapier Agrarökologie Vandana Shiva – Agrarindustrie ver