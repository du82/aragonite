52 { background-image: url('/fileadmin/user_upload/aktionen/2021/Hof_mit_Zukunft_2021/HmZ_Schmale1.jpeg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-8053-1352 { background-image: url('/fileadmin/user_upload/aktionen/2021/Hof_mit_Zukunft_2021/HmZ_Schmale1.jpeg'); } } #carousel-backgroundimage-8053-1353 { background-image: url('/fileadmin/_processed_/d/f/csm_HmZ_Schmale5_0509213b47.jpeg'); } @media (min-width: 576px) { #carousel-backgroundimage-8053-1353 { background-image: url('/fileadmin/user_upload/aktionen/2021/Hof_mit_Zukunft_2021/HmZ_Schmale5.jpeg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8053-1353 { background-image: url('/fileadmin/user_upload/aktionen/2021/Hof_mit_Zukunft_2021/HmZ_Schmale5.jpeg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8053-1353 { background-image: url('/fileadmin/user_upload/aktionen/2021/Hof_mit_Zukunft_2021/HmZ_Schmale5.jpeg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-8053-1353 { background-image: url('/fileadmin/user_upload/aktionen/2021/Hof_mit_Zukunft_2021/HmZ_Schmale5.jpeg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-8053-1353 { background-image: url('/fileadmin/user_upload/aktionen/2021/Hof_mit_Zukunft_2021/HmZ_Schmale5.jpeg'); } } Zurück Weiter Pressemitteilung Hof mit Zukunft – Ackern, Diskutieren & Vorschläge für die Zukunft der Landwirtschaft entwickeln Treffen sich Klimaaktivist:innen, Foodies und Landwirt:innen … Was sich anhört wie der Anfang eines nicht besonders guten Witzes, ist das neue Format, bei dem Klima- und Ernährungs-Bewegte auf Bäuerinnen und Bauern treffen. Junge, politisch engagierte Menschen verbringen dabei zwei Tage auf konventionell und ökologisch wirtschaftenden Höfen im gesamten Bundesgebiet. Dort packen sie beim Alltagsgeschäft mit an und entwickeln gemeinsam mit den Landwirt:innen Visionen für die Landwirtschaft der Zukunft. Bei „Zukunft mit Hof“ geht es darum, die Abläufe auf den Höfen jenseits von romantisierten Vorstellungen kennenzulernen und etwaige gegenseitige Vorurteile abzubauen. Dahinter steht auch die Überlegung, dass man lernt sich am besten beim gemeinsamen Machen kennen und schätzen lernt. Wir laden Sie ein zu berichten – über diesen Bauernhof-Ausflug der besonderen Art. „Zukunft mit Hof“ eignet sich für Print, Radio/Podcast ebenso wie für TV/audiovisuelle Berichterstattung. Eine Übernachtungsmöglichkeit kann ggf. gestellt werden. Für Rückfragen stehen wir gerne zur Verfügung. Hof mit Zukunft! Wann: 15. & 16. Oktober Wo: auf Höfen in ganz Deutschland (bspw. Brandenburg, Schleswig-Holstein, Hessen etc.) Rückmeldungen bitte bis 5.10. an: Christian Rollmann („Wir haben es satt!“-Pressesprecher) Tel.: 030-28482438 | Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de www.wir-haben-es-satt.de Show larger version Mach mit! Du bist Landwirt*in oder Aktivist*in und willst an "Hof mit Zukunft" teilnehmen? Dann trage dich in unserer Vormerkliste ein oder abonniere unseren Newsletter. VORMERKLISTE NEWSLETTER FAQ Du hast Fragen zur Teilnahme bei "Hof mit Zukunft"? Hier findest du unsere FAQs: FÜR HÖFE FÜR AKTIVISTI'''
