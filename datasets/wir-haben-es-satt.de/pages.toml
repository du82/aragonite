["https://wir-haben-es-satt.de/presse-archiv/berlin-21012023"]
title = "Berlin, 21.01.2023 - Wir haben es satt!"
full_description = 'Pressemitteilung „Wir haben es satt!“-Demo: 10.000 fordern sozial gerechte Agrarwende und gutes Essen für alle Breites Bündnis aus Landwirtschaft und Gesellschaft fordert Umverteilung, damit Agrarwende und gutes Essen für alle klappen Berlin, 21.01.23. Bauernhöfe unterstützen, Insektensterben und Klimakrise stoppen, artgerechte Tierhaltung statt Megaställe und gutes Essen für alle – das fordern 10.000 Menschen bei eisigen Temperaturen zum Auftakt der „Grünen Woche“ bei der „Wir haben es satt!“-Demonstration in Berlin. „Wir erwarten deutlich mehr von Agrarminister Özdemir und der Bundesregierung, das war zu wenig ambitioniert, zu mutlos und zu langsam“, sagt Bündnis-Sprecherin Inka Lange mit Blick auf ein Jahr Agrar- und Ernährungspolitik der Ampel-Koalition. „Olaf Scholz‘ selbsternannte Fortschrittskoalition blockiert die Agrarwende. Das Höfesterben geht weiter, das 1,5-Grad-Ziel wurde beerdigt und trotz enormen Reichtums können sich bei uns viele Menschen keine gesunden, umweltgerecht hergestellten Lebensmittel leisten.“ Die Lage ist ernst: Jeden Tag schließen hierzulande im Schnitt zehn landwirtschaftliche Betriebe und für Konzerninteressen wird in Lützerath die Klimakrise weiter angeheizt. Weltweit hungert mittlerweile jeder zehnte Mensch, während 95 Energie- und Lebensmittelkonzerne ihre Gewinne im letzten Jahr mehr als verdoppelt haben. Nach einem Jahr im Amt ist die Schonzeit für Minister Özdemir vorbei. Die Menschen verlangen mehr Tempo beim sozial gerechten Umbau der Landwirtschaft. Als Ernährungsminister muss Özdemir dafür sorgen, dass auch Menschen mit wenig Geld Zugang zu guten Lebensmitteln haben. „2023 muss die Regierung die sozial gerechte Agrar- und Ernährungswende voranbringen. Denn eine gute Zukunft geht nur sozial und ökologisch”, so Lange. „Konkret fordern wir: eine Übergewinnsteuer auch für Agrar- und Lebensmittelkonzerne, die Mehrwertsteuer bei Obst und Gemüse auf Null senken, viel mehr Unterstützung für Menschen mit wenig Geld, eine Vermögensabgabe für Superreiche sowie gerechte und klimaschonende Agrarsubventionen.“ Artgerechte Tierhaltung, mehr Insekten- und Klimaschutz auf den Höfen, die notwendige Erhöhung des Bürgergeld-Regelsatzes um mindestens 250 Euro – das alles kostet und dafür muss Finanzminister Lindner die Mittel freigeben. Das Geld ist da. Es konzentriert sich aller­dings in den Händen weniger Milliardär*innen. 81 Prozent der Vermögensgewinne aus den Jahren 2020 und 2021 gingen auf das Konto des obersten Prozents in Deutschland. Konzerne dürfen nicht länger von Krisen profitieren, dafür brauchen wir gerechte Steuern. Die Demonst­ration steht unter dem Titel: „Wir haben Krisenprofite satt! Gutes Essen für alle – statt Profite für wenige“. Karen Stubbemann, Bäuerin aus Niedersachsen, die mit dem Trecker angereist ist, sagt: „Wir Bäuerinnen und Bauern ziehen mit der Gesellschaft an einem Strang, aber die Politik muss endlich planbare Rahmenbedingungen für den Umbau der Landwirtschaft vorgeben. Wir brauchen wirtschaftliche Perspektiven, die eine klima- und umweltschonende Bewirtschaf­tung und den Umbau der Tierhaltung ermöglichen. Die Agrarsubventionen müssen gerecht verteilt und an ökologische und tiergerechte Kriterien gebunden werden. Und wir brauchen ein klares Bekenntnis gegen Gentechnik auf Acker und Teller.“ Schon am Vormittag übergaben die Bäuerinnen und Bauern, die mit ihren Traktoren nach Berlin gekommen waren, eine Protestnote an Özdemir und die rund 80 versammelten Agrar­minister*innen der Welt. Zudem fand der „6-Punkte-Plan für gutes Essen für alle“ seinen Adressaten im Agrarminister. Über 100 Organisationen – von Landwirtschaft über Umwelt- und Sozialverbänden bis zu Gewerkschaften und Erwerbslosen-Initiativen – fordern von der Bundesregierung höhere Sozialleistungen, faire Erzeuger*innenpreise und gute Löhne. Aufgerufen von 60 Organisationen gehen bei der „Wir haben es satt!“-Großdemonstration seit 2011 viele Tausende gegen die Agrarindustrie und für eine zukunftsfähige Landwirtschaft auf die Straße. Konventionelle und Öko-Bäuer*innen demonstrieren im Schulterschluss mit der Gesellschaft gegen die fatalen Auswirkungen der industriellen Landwirtschaft. Gemeinsam zeigt das Bündnis Wege für eine bäuerliche Landwirtschaft auf, die auf breite Zustimmung in der Bevölkerung treffen und den Bauernhöfen wirtschaftliche Perspektiven bieten. Fotos zur kostenfreien Verwendung weiter unten. Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Tel.: 030-28482438 Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Statements von Redner*innen Tobias Schied, Jungbauer, Fridays for Future: „Die Klimakrise betrifft uns als Bäuer*innen sehr direkt, Wiesen und Äcker vertrocknen. Im Globalen Norden sind wir durch unsere Agrar- und Klimapolitik direkt dafür verantwortlich, das muss ein Ende haben. Zerstörerische Profite dürfen nicht länger über Menschen, Tiere und Ökosysteme gestellt werden, wir brauchen die klimagerechte Agrarwende jetzt!“ Lisa Reichmann, Kampagnenleiterin bei Campact: „Cem Özdemir sucht die guten Bilder – das Ferkel im Arm oder inmitten von Kühen. Was der Minister nicht liefert, sind konkrete Taten und Gesetze. Die Agrarwende braucht aber einen Bundeslandwirtschaftsminister, der anpackt, d.h. sich einsetzt für weniger Pestizide, mehr Lebensmittel auf dem Teller statt im Tank und eine Mittelverteilung nach ökologischen Krite­rien.” Maria Loheide, Vorständin Sozialpolitik der Diakonie Deutschland: „Soziale und ökologische Fragen dürfen nicht gegeneinander ausgespielt werden. Wir fordern, dass jeder Mensch die Mittel zur Verfügung haben muss, sich ausgewogen, gesund und nach­haltig zu ernähren. Sozialleistungen und Einkommen müssen hoch genug sein, um sich an der sozial-ökologischen Agrar- und Ernährungswende beteiligen zu können.“ Elisabeth Fresen, Bundesvorsitzende der AbL und Bäuerin in Niedersachsen: „Auf vielen Höfen herrscht existenzielle Not: zu wenig Einkommen bei steigenden Kosten, hohe Arbeitsbelastung und bedrohte Ernten durch Extremwetter. Jeden Tag verlieren wir Höfe. Von Agrarminister Özdemir verlangen wir deshalb, den überfälligen Umbau der Land­wirtschaft zügig und sozial gerecht anzugehen. Die Konzepte liegen vor und werden von Bäuer*innen, Umweltschutz und Gesellschaft getragen. Worauf warten Sie?“ Sefu Sani, World March of Women (Kenia): „Ich fordere das Recht auf Nahrung und Landwirtschaft für die ländliche Bevölkerung, Bäuer*innen, Indigene und alle Menschen, denen Land geraubt wurde. Wir brauchen eine Transformation der Ernährungssysteme, das Ende der Abhängigkeit vom Norden und echte Ernährungssouveränität durch agrarökologische und regionale Märkte. Die Politik muss sich an den am stärksten Benachteiligten ausrichten, nicht an Entwicklungshilfegeber*innen oder Investor*innen.“ Myriam Rapior, stellvertretende Bundesvorsitzende Bund für Umwelt- und Naturschutz Deutschland (BUND): „Der Einstieg in den Umbau der Tierhaltung liegt auf dem Tisch. Damit es den Tieren hier besser geht und Bäuer*innen ein faires Einkommen bekommen, braucht es aber mehr Geld. Und für Klima und Umwelt: weniger Tierhaltung. Das nutzt auch Menschen und Natur in den Ländern, aus denen momentan unser Tierfutter kommt.“ Edward Mukiibi, Präsident von Slow Food International: „Die industrielle Tierhaltung in westlichen Ländern und Asien trägt maßgeblich zur aktuellen Klimakrise und zum Dumping ungesunder tierischer Lebensmittel in Afrika durch bilaterale Handelspolitik bei. Sie zwingt lokale Produktionssysteme in die Knie und untergräbt die Bemühungen dieser Länder um Ernährungssouveränität.“ Patrick Müller von PROVIEH: „Tiere brauchen ein artgemäßes Leben! Wir müssen die Tierhaltung endlich an die Bedürf­nisse der Tiere anpassen, statt immer wieder die Tiere an die Haltungssysteme anzupassen. Das aktuelle System ist gesellschaftlich nicht akzeptiert, wir überschreiten massiv planetare Grenzen und viele der sogenannten Nutztiere leiden. Deshalb sind der Umbau der Tierhaltung und eine Reduzierung der Tierzahlen dringend notwendig!“ Tina Andres, Vorstandsvorsitzende des Bio-Spitzenverbands Bund Ökologische Lebensmit­telwirtschaft (BÖLW): „Die großen Krisen, der Klimawandel und das Artensterben kosten uns 90 Milliarden Euro ökologische Folgeschäden im Jahr! Und wenn wir nichts tun, kosten sie uns die Welt. Wir müssen jetzt handeln: Ökologische Landwirtschaft ist der Weg, um auch in Zukunft klima- und generationengerecht gesunde Lebensmittel für alle zu erzeugen. Ohne Pestizide, frei von Gentechnik, mit dem höchsten Tierwohl und innerhalb der planetaren Grenzen.“ Ahmad Rahal, Arzt aus Paraguay und aktiv bei Aktion Agrar: „80 % der Ackerflächen Paraguays sind mit Soja bepflanzt, damit in Europa Millionen von Tieren volle Futtertröge haben. Nach wie vor kommen Agrotoxine zum Einsatz, die in Europa längst verboten sind. Eine Studie, die ich mit meiner Universität durchgeführt habe, zeigt, dass fast die Hälfte der Kinder zwischen fünf und zehn Jahren in den Sojaanbaugebieten geneti­sche Veränderungen haben. Das muss aufhören.“ Reinhild Benning, Landwirtin und Agrarexpertin der Deutschen Umwelthilfe (DUH): „Wir sehen gerade, wie krisenanfällig globale Lieferketten und wie wertvoll regionale und agrarökologisch hergestellte Lebensmittel sind. Erzeuger*innenpreise und Löhne der Beschäftigten in der Landwirtschaft sind aber oft zu niedrig. Gleichzeitig sind immer mehr Menschen auf Tafeln angewiesen. Der Staat muss für eine faire Verteilung der Wertschöpfung und mehr Nachhaltigkeit in den Lieferketten sorgen.“ Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Telefon: 030-28482438, Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Fotos zur kostenfreien Nutzung Fotos von der "Wir haben es satt!"-Demo am 21.1.23 zur kostenfreien Nutzung gegen Angabe der Quelle. Zum Download bitte auf das Bild klicken. Quelle: Nick Jaussi/www.wir-haben-es-satt.de Pressemitteilung'
