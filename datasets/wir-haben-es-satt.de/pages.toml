title = "Demo 2022 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Wir haben es satt!-Protest am 22. Januar 2022 Aufruf zum Protest am 22. Januar 2022 Neustart Agrarpolitik jetzt! #WHES22: Auf die Straße für Bauernhöfe, Tiere und das Klima Die Landwirtschaft steckt mitten in der Krise. In der Klimakrise, deren Auswirkungen weltweit zu spüren sind. In der Krise der Artenvielfalt, in der täglich Lebensräume zerstört werden und Insekten aussterben. Und in der Krise des Höfesterbens: Immer mehr Bäuer*innen geben auf, weil sie ruinöse Preise für ihre Lebensmittel bekommen. Die alte Bundesregierung hat all dem tatenlos zugesehen und immer wieder die Interessen der Agrar- und Lebensmittelindustrie verteidigt. Die Folgen: Die Bauernhöfe werden mit dem Umbau der Tierhaltung allein gelassen. Immer noch werden zu viele Tiere schlecht gehalten und industrielle Megaställe verdrängen zunehmend kleine und mittlere Höfe. Europäische Dumpingexporte zerstören bäuerliche Existenzen im globalen Süden. Weltweit hungern immer mehr Menschen – und auch in Deutschland fehlt vielen das Geld, um gesund und nachhaltig zu essen. Doch jetzt ist Schluss damit: Wir haben die agrarpolitischen Blockaden satt! 2022 startet eine neue Bundesregierung – unsere Chance für einen Neustart der Agrar- und Ernährungspolitik. Die Vorschläge von Bäuer*innen, Verbraucher*innen und Umwelt- und Tierschützer*innen liegen schon längst auf dem Tisch. Neustart Agrarpolitik bedeutet: Mehr Verlässlichkeit und Unterstützung für Bauernhöfe! Wer gute Lebensmittel produziert, muss die Unterstützung der Politik erhalten. Und wer in Zukunft ökologischer und tiergerechter produzieren will, soll Hilfe bei der Umstellung bekommen. Fördergelder, die nur Landbesitz belohnen oder Naturzerstörung und Klimakrise vorantreiben, gehören abgeschafft. Neustart Ernährungspolitik heißt: Mehr Transparenz für Verbraucher*innen! Wer umweltfreundlich und artgerecht produzierte Lebensmittel einkaufen will, muss diese auf den ersten Blick erkennen können. Der Preis dafür muss erschwinglich, aber fair für die Erzeuger*innen sein. Preisdumping auf Kosten von Klima und Artenvielfalt muss gestoppt und gentechnikfreie Lebensmittelerzeugung sichergestellt werden. Damit die neue Bundesregierung den Neustart anpackt, braucht es jetzt unseren Druck auf der Straße! Wir sind die bunte, entschlossene und vielfältige Bewegung, die für eine zukunftsfähige Agrar- und Ernährungspolitik demonstriert – und wir haben Agrarindustrie satt! Zum Auftakt der Grünen Woche, wenn Landwirtschaft und Ernährung in aller Munde sind, gehen wir in Berlin auf die Straße und fordern von der neuen Bundesregierung: Blockadepolitik beenden – Neustart Agrarpolitik jetzt! Wir fordern: Klimakrise aufhalten – mit gesunden Böden, Vielfalt auf dem Acker & mehr Gemüse auf dem Teller! Höfesterben stoppen – faire Preise, Umbau unterstützen & Ackerland in Bäuer*innenhand! Tierfabriken dichtmachen – für artgerechtere Haltung ohne Tierleid & Ausbeutung! Artensterben verhindern – Glyphosat-Ausstieg durchsetzen, vielfältige Fruchtfolgen statt Monokulturen & Giftexporte stoppen! Hunger bekämpfen – Megakonzerne entflechten, Handel fair gestalten & Agro-Gentechnik verhindern! Tragt mit uns gemeinsam den Protest mit Abstand und Maske ins Regierungsviertel! Demo: Samstag, 22.1.22 | 12 Uhr | Brandenburger Tor | Berlin Was wir wollen: Weltweites Höfesterben stoppen +++ fair produziertes, ökologisches Essen für alle +++ artgerechte Tierhaltung und weniger Fleischkonsum +++ Ernährungssouveränität und gerechten Welthandel +++ Bäuer*innen und Bienen retten +++ routinemäßigen Antibiotikaeinsatz beenden +++ Preisdiktat beenden und Konzerne in die Schranken weisen +++ weniger Tiere, dafür in besserer Haltung +++ Landraub durch außerlandwirtschaftliche Investor*innen verhindern +++ mehr Platz für die Natur in der Agrarlandschaft +++ agrarökologische und demokratische Ernährungssysteme +++ Pestizidausstieg anpacken +++ Agro-Gentechnik stoppen +++ ganzheitliche Ernährungspolitik jetzt +++ für eine solidarische Welt – Geflüchtete willkommen +++ Wer wir sind: Wir sind Bäuerinnen und Bauern, konventionell und bio, von Tierhaltung bis Ackerbau. Wir sind Bäcker*innen, Köch*innen, Verbraucher*innen, Imker*innen, Natur- und Tierschützer*innen, Umweltaktivist*innen, Aktive für globale Gerechtigkeit, engagierte Jugendliche, Menschen aus Stadt und Land und viele mehr. Wir gehen seit 2011 gemeinsam auf die Straße und kämpfen für gute Landwirtschaft und gesundes Essen! www.wir-haben-es-satt.de #WHES22 #NeustartAgrarpolitik FOTOS PROTEST FOTOS TRAKTOR-DEMO Demozug Frontbanner EU-Geld-Banner Traktoren für Klimaschutz Übergabe der Protestnote Traktor-Demo Imker vorm Ministerium #carousel-backgroundimage-6633-691 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_34e389ba08.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-6633-691 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_810028326b.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-6633-691 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_66e91b4a95.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-6633-691 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_fde8e3b069.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-6633-691 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_68798592a7.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-6633-691 { background-image: url('/fileadmin/_processed_/c/6/csm_Demozug_934a6e810a.jpg'); } } #carousel-backgroundimage-6633-692 { background-image: url('/fileadmin/_processed_/2/7/csm_Frontbanner_2_f03830244e.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-6633-692 { background-image: url('/fileadmin/_processed_/2/7/csm_Frontbanner_2_04d4f917df.jpg'); } } @media (min-width: 768p