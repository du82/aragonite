["https://wir-haben-es-satt.de/presse-archiv/berlin-31016"]
title = "Berlin, 3.10.16 - Wir haben es satt!"
full_description = "Pressemitteilung Starkes Zeichen für gutes Essen und gute Landwirtschaft 500 TeilnehmerInnen beim 2. „Wir haben es satt!“-Kongress / Zum Abschluss symbolisches Tauziehen um die Lebensmittelerzeugung unter dem Motto: „Agrarkonzerne: Finger weg von unserem Essen!“ / Demonstration in Berlin am 21. Januar 2017 Berlin, 3.10.2016. Zum Abschluss des „Wir haben es satt!“-Kongresses veranstalteten die TeilnehmerInnen auf dem Mariannenplatz in Berlin-Kreuzberg ein symbolisches Tauziehen um die Agrar- und Ernährungswende. Bauern und in Tierkostümen verkleidete AktivistInnen riefen dabei in Richtung der Konzernvertreter von Bayer, Monsanto und Aldi, die versuchten sie über den Tisch zu ziehen: „Hände weg von unserem Essen!“ Der 2. „Wir haben es satt!“-Kongress fand seit Freitag in der Emmauskirche am Lausitzer Platz statt. 500 TeilnehmerInnen diskutierten vier Tage lang über Lebensmittelerzeugung, globale Machtverhältnisse und gesundes Essen. Zusammen mit dem Stadt Land Food-Festival, auf dem sich Besucher in zahlreichen Werkstätten über das Lebensmittelhandwerk informierten, setzten Zehntausende rund um die Markthalle Neun ein Zeichen für bäuerliche, handwerkliche Lebensmittelerzeugung und gesunde Lebensmittel. Jochen Fritz, Leiter der Kampagne „Meine Landwirtschaft“ und Organisator der „Wir haben es satt!“-Demonstration, sagte: „Der Kongress war ein voller Erfolg. Wir wollen, dass die Agrarwende das zentrale Thema im Bundestagswahljahr wird, dafür gehen wir am 21. Januar 2017 wieder auf die Straße!“ Leonie Dorn von Aktion Agrar appellierte am Rande des Tauziehens an die EU-Kommission: „Die EU-Wettbewerbskommissarin Vestager muss die geplante Fusion von Bayer und Monsanto verhindern, denn schon heute haben die Megakonzerne viel zu viel Macht über unsere Ernährungsgrundlagen!“ Fotos zur kostenfreien Nutzung auf flickr.com (Urheber: Wir haben es satt!/Die Auslöser Berlin) Pressekontakt Christian Rollmann, Presse- und Öffentlichkeitsarbeit, Kampagne „Meine Landwirtschaft“, Tel: 030-28482438, Mobil: 0151-75142515, Mail: rollmann(at)meine-landwirtschaft.de Pressemitteilung"
year_published = 2025
