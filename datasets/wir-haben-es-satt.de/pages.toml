title = "Hof mit Zukunft 2021 - Wir haben es satt!"
full_description = '''Show larger version Mach mit! Du bist Landwirt*in oder Aktivist*in und willst an "Hof mit Zukunft" teilnehmen? Dann trage dich in unserer Vormerkliste ein oder abonniere unseren Newsletter. VORMERKLISTE NEWSLETTER FAQ Du hast Fragen zur Teilnahme bei "Hof mit Zukunft"? Hier findest du unsere FAQs: FÜR HÖFE FÜR AKTIVISTI Das war Hof mit Zukunft 2021 Pilotprojekt: 15. bis 16. Oktober 2021 3 Höfe in Brandenburg, Schleswig-Holstein und Hessen Ackerbau Solidarische Landwirtschaft Tierhaltung (Milchvieh, Schafe) 10 Aktivist*innen Fridays For Future, Naturschutzjugend, SlowFood mit und ohne landwirtschaftliche Vorkenntnisse aus der ganzen Bundesrepublik Presse In der Zusammenarbeit der vier wird deutlich: Es geht unterm Strich um ein gemeinsames großes Ziel: den Stopp der industriellen Landwirtschaft und Lebensmittelproduktion. Weg von Masse, hin zu Nachhaltigkeit – auch im Sinne des Klimaschutzes. „Vom Grundsatz her haben wir die gleiche Einstellung“, resümiert Julia Binder. In Zukunft gelte es deshalb auch, an einem Strang zu ziehen und Möglichkeiten zu finden, Klimaschutz und Landwirtschaft zusammenzubringen. Wetzlarer Neue Zeitung (20.10.2021) Wie Höfe eine Zukunft haben Impressionen HmZ 21 1 HmZ 21 2 HmZ 21 3 HmZ 21 4 HmZ 21 5 HmZ 21 6 #carousel-backgroundimage-8053-1348 { background-image: url('/fileadmin/_processed_/3/e/csm_211016_fmo_Biohof_Rzehak_9883_03582222d6.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-8053-1348 { background-image: url('/fileadmin/_processed_/3/e/csm_211016_fmo_Biohof_Rzehak_9883_3b0742a4d4.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-8053-1348 { background-image: url('/fileadmin/_processed_/3/e/csm_211016_fmo_Biohof_Rzehak_9883_f543239709.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-8053-1348 { background-image: url('/fileadmin/_processed_/3/e/csm_211016_fmo_Biohof_Rzehak_9883_0adee9669a.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-8053-1348 {