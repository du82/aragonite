["https://wir-haben-es-satt.de/berlin-09012025"]
title = "Berlin, 09.01.2025 - Wir haben es satt!"
full_description = 'Pressemitteilung 9. Januar 2025 PDF-VERSION PDF-VERSION Pressemitteilung 9. Januar 2025 Aufruf zur „Wir haben es satt!“-Demonstration am 18. Januar 2025 in Berlin: Das "Wir haben es satt!"-Bündnis fordert von der kommenden Bundesregierung: "Gemeinwohl vor Konzerninteressen in der Agrarpolitik!" Berlin, 9. Januar 2025: Unter der Leitfrage „Wer profitiert hier eigentlich?“ rufen im Vorfeld der Bundestagswahl rund 60 Organisationen aus Landwirtschaft und Zivilgesellschaft zur „Wir haben es satt!“-Demonstration am 18. Januar auf. Verbraucher*innen leiden unter hohen Lebensmittelpreisen und Bäuer*innen kämpfen um ihre Existenz: Seit 2021 sind Lebensmittelpreise in Deutschland um rund 33 Prozent gestiegen – deutlich stärker als die Gesamtinflation von 20 Prozent. Bei den Bäuer*innen, die unsere Lebensmittel erzeugen, kommt davon wenig an. Sie haben einen Anteil von durchschnittlich nicht einmal 15 Prozent der Bruttowertschöpfung. Allein in Deutschland mussten mehr als 350.000 Höfe in den letzten 30 Jahren schließen. Handel, Fleisch- und Milchindustrie machen derweil auch in Krisenzeiten gewohnt hohe Gewinne. Mit der Bundestagswahl 2025 entscheidet sich die Ausrichtung der Agrarpolitik für die kommenden Jahre. Werden wir mehr Fairness, Tier- und Umweltschutz bekommen oder weiteres Höfesterben und den Abbau wichtiger Standards? Das Demonstrationsbündnis hat heute in Berlin seine Erwartungen an die zukünftige Bundesregierung vorgestellt. Es fordert verbindliche Gesetze für kostendeckende Erzeuger*innenpreise und eine sichere Finanzierung von Tierschutz- und Umweltmaßnahmen. Das gemeinsame Ziel der Bündnispartner*innen: ein umweltverträgliches, gerechtes und krisenfestes Ernährungssystem auf Grundlage einer bäuerlichen und agrarökologischen Landwirtschaft. Seit Jahrzehnten werden einseitig Konzerninteressen priorisiert – das Gemeinwohl sollte politisch endlich stärker gewichtet werden. Um diese Forderung zu unterstreichen, führt der Protestmarsch unter anderem zum Sitz von Verbänden der Agrarindustrie, von Handelsriesen und global agierenden Agrarinvestoren, die politisch bevorzugt werden auf Kosten der Allgemeinheit und teils der Menschenrechte. Auf der Pressekonferenz haben Vertreter*innen des „Wir haben es satt!“-Bündnisses die gemeinsamen Positionen erläutert. Reinhild Benning, Mitgründerin INIFAIR, Landwirtin und Agrarexpertin der Deutschen Umwelthilfe (DUH), zur aktuellen Situation steigender Lebensmittelpreise und unfairer Erzeuger*innenpreise: „Die Präsidentin der Europäischen Kommission, Ursula von der Leyen, hat im Juli 2024 versprochen: ‚Niemand sollte gezwungen sein, Lebensmittel unter Produktionskosten zu verkaufen.‘ Von der Leyen muss ihr Wort halten und die Gemeinsame Marktordnung der EU gründlich überarbeiten, denn bisher lässt die mangelhafte Regulierung zu, dass Bäuerinnen und Bauern zu Tausenden gezwungen sind, unter Produktionskosten zu verkaufen. So arbeiten sie unter erheblicher wirtschaftlicher Unsicherheit und erhalten nicht einmal Verträge, bevor sie Tonnen an Produkten wie Milch oder Fleisch liefern. Es muss ein Recht auf Kostendeckung auf EU und auf nationaler Ebene verankert werden. Die neue Bundesregierung muss eine zuverlässige Tierschutz-Finanzierung in den Koalitionsvertrag schreiben und Preistransparenz schaffen. Nur so können Bäuerinnen und Bauern vor ruinösen Produktionsbedingungen, Verbraucherinnen und Verbraucher vor ‚Gierflation‘ und die Tiere und die Umwelt vor Ausbeutung geschützt werden.“ Rupert Ebner, Vorsitzender Slow Food Deutschland, zu regionalen und weltweiten Folgen einer profitorientierten, industriellen Tierhaltung: „Die derzeitige Tierhaltung fördert zu wenig Tierwohl und gefährdet die menschliche Gesundheit durch übermäßigen Antibiotikaeinsatz. Zu viel Gülle auf den Feldern belastet Ressourcen wie Böden und Wasser, u. a. mit der Folge, dass hohe Kosten für die Wasser¬reinigung anfallen. Der Import des Futtermittels Soja aus EU-Drittstaaten mit niedrigeren Produktionsstandards führt zu Gesundheits- und Umweltschäden vor Ort, begünstigt durch höhere zugelassene Rückstandshöchstgrenzen für toxische Substanzen wie Glyphosat. Bundesregierung und EU müssen Verantwortung übernehmen, entwaldungs- und landgrabbingfreie, faire Lieferketten sicherstellen und eine nachhaltige, tierwohlorientierte Landwirtschaft fördern.“ Martin Kaiser, Geschäftsführender Vorstand Greenpeace Deutschland zur Verantwortung der Politik: “Unsere Wahl ist klar: Wir brauchen die sozial-ökologische Agrarwende jetzt! Die Land-wirtschaft wird bereits extrem hart von Klimaextremen und Artenverlust getroffen, zugleich ist sie eine Mitverursacherin dieser Krisen. Das muss sich in den kommenden Jahren dringend ändern. Für eine zukunftsfähige Landwirtschaft muss der Abbau der Tierzahlen jetzt konsequent vorangetrieben werden. Dazu brauchen die bäuerlichen Betriebe verlässliche Vorgaben, gezielte Förderung und wirtschaftliche Perspektiven. Es kann nicht sein, dass die Politik weiter dem Druck der Agrarlobby nachgibt und rückwärtsgewandte Partikularinteressen durchsetzt, die unsere Lebensgrundlagen gefährden, statt dem Gemeinwohl Vorrang zu geben. Nur so sichern wir jetzt und in Zukunft die Versorgung mit nachhaltig erzeugten, gesunden und fair bepreisten Lebensmitteln für uns alle.” Lilli Haulle, angestellte Landwirtin und Mitglied der jungen Arbeitsgemeinschaft bäuerliche Landwirtschaft zur Situation junger Bäuer*innen und der Bedeutung der Landwirtschaft für die Gesellschaft: „Die künftige Bundesregierung ist aufgefordert, junge Bäuer*innen zu stärken, damit wir Lust haben, Landwirtschaft zu betreiben und auf dem Lande zu leben. Wir bringen Lebendigkeit und wirtschaftliche Zukunft in die ländlichen Räume. Das ist auch eine wichtige Voraussetzung, um die Demokratie zu stärken und dem zunehmenden Rechtsextremismus entgegenzuwirken. Dass wir unsere wertvollen Lebensmittel derzeit oft nur abliefern, ist würdelos. Wir wollen am Markt beteiligt werden und auf Augenhöhe mitverhandeln können, um zu faireren Preisen zu kommen. Denn auch Angestellte in der Landwirtschaft sollen auskömmlich bezahlt werden. Das EU-Mercosur Abkommen muss gestoppt werden, wir wollen fairen Welthandel und die Stärkung des Rechts auf Nahrung weltweit und junger Menschen in der Landwirtschaft.“ Anne Skambraks, Kampagnenleitung des „Wir haben es satt!“-Bündnisses, fasst auf der Pressekonferenz abschließend zusammen: „Das ‚Wir haben es satt!‘-Bündnis fordert anlässlich des Wahljahres 2025 ernstgemeinte Fortschritte für eine gute, sozial gerechte und ökologischere Zukunft der Landwirtschaft. Wir erwarten, dass die kommende Bundesregierung endlich Gemeinwohl vor Konzerninteressen stellt! Die negativen sozialen Folgen der bisherigen konzernorientierten Agrarpolitik müssen gleichermaßen Berücksichtigung finden in einem Wahlkampf, den die großen Parteien bislang über wirtschaftliche Themen führen. Unmut und Zukunftspessimismus in weiten Teilen der Bevölkerung sind auch das traurige Ergebnis einer verfehlten Agrarpolitik.“ Entsprechend sucht das Bündnis aus Bäuer*innen, Gärtner*innen, Imker*innen, Natur-, Umwelt- und Tierschützer*innen sowie Aktiven der Entwicklungszusammenarbeit und Ernährungsbewegung den Schulterschluss mit weiteren sozialen Bewegungen und hat auch Delegierte der Nationalen Armutskonferenz, der Diakonie sowie der Gewerkschaft IG BAU auf die Demobühne eingeladen. Die Bündnispartner*innen rufen Menschen aus Stadt und Land – ob jung oder alt, bio oder konventionell, Tierhalter*in oder Veganer*in – auf, sich solidarisch der „Wir haben es satt!“-Demo am 18. Januar in Berlin anzuschließen: „Um bei unserer Großdemonstration lautstark und zahlreich eine gemeinwohlorientierte deutsche, europäische und weltweite Agrar- und Ernährungspolitik einzufordern“, wie es Skambraks formuliert. Weitere Informationen Demoseite | www.wir-haben-es-satt.de Aufruf | www.wir-haben-es-satt.de/aufruf Für Rückfragen Reinhild Benning, Agrarexpertin DUH (0151) 17918487 | benning[at]duh[dot]de Sharon Sheets, Kommunikationsmanagerin Slow Food (030) 200047517 | s.sheets[at]slowfood[dot]de Kristina Oberhäuser, Pressesprecherin Greenpeace (0171) 7099104 | kristina.oberhaeuser[at]greenpeace[dot]org Lilli Haulle, Landwirtin und Mitglied jAbL presse[at]junge-abl[dot]de Anne Skambraks, Kampagnenleitung des „Wir haben es satt!“-Bündnis (0163) 1846765 | skambraks[at]meine-landwirtschaft[dot]de Nicola Puell Presse- und Öffentlichkeitsarbeit Mobil: (0151) 51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Presseseite: www.wir-haben-es-satt.de/presse Pressemitteilung 9. Januar 2025 PDF-VERSION PDF-VERSION'
