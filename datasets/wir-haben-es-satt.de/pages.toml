["https://wir-haben-es-satt.de/presse-archiv/berlin-200118"]
title = "Berlin, 20.01.18 - Wir haben es satt!"
full_description = 'Pressemitteilung „Essen ist politisch!“ 33.000 fordern mehr Tempo bei Agrar- und Ernährungswende SPD und Union müssen Willen der Bevölkerung umsetzen: Schluss mit Glyphosat, Tierfabriken und weltweitem Höfesterben / Umwelt, Tiere und Bauernhöfe verzeihen keinen weiteren Stillstand Berlin, 20.01.18. Mit einem ohrenbetäubenden Kochtopf-Konzert fordern 33.000 Menschen bei der „Wir haben es satt!“-Demonstration zum Auftakt der Grünen Woche in Berlin die kommende Bundesregierung zu einer neuen Agrarpolitik auf. „Die industrielle Land- und Ernährungswirtschaft verursacht lokal und global Probleme für Bauern, Klima, Tiere und Umwelt“, sagt „Wir haben es satt!“-Sprecher Jochen Fritz und ergänzt im Namen der über 100 Organisationen, die zur Demonstration aufgerufen haben: „Der Umbau hin zu einer umwelt-, tier- und klimafreundlichen Landwirtschaft, in der Bauern gut von ihrer Arbeit leben können, darf von der Politik nicht weiter aufgeschoben werden.“ Das Demonstrationsbündnis ruft SPD und Union auf, keine weitere Zeit mehr verstreichen zu lassen und als erste Schritte Glyphosat zu verbieten sowie den überfälligen Umbau der Tierhaltung zu finanzieren, damit Schweine wieder Tageslicht sehen und Kühe auf Weiden grasen können. Vor dem Agrarministergipfel im Bundeswirtschaftsministerium schlagen die Demonstranten auf ihre Kochtöpfe und fordern die Achtung der Menschenrechte, faire Handelsbedingungen und mehr Unterstützung für die ländliche Bevölkerung weltweit. Schon am Vormittag hatten die 160 Bauern, die die Demonstration mit ihren Traktoren anführen, eine Protestnote an die 70 versammelten Minister aus aller Welt übergeben. „Wir wollen raus aus der fatalen Exportorientierung und Landkonzentration, die Bauern hier und weltweit das Genick bricht“, so Fritz über die Folgen der Agrarpolitik. Allein in den letzten 12 Jahren, mussten in Deutschland ein Drittel der Höfe ihre Tore schließen. Bündnis-Sprecher Fritz weiter: „Essen ist politisch, immer mehr Menschen erkennen das. Aber die Politik nährt eine Agrarindustrie und lässt sie auf Kosten von Umwelt, Klima und Tieren produzieren. Damit wir alle nicht langfristig die Zeche dafür zahlen, muss die GroKo den Spieß jetzt umdrehen. Diejenigen, die nachhaltig produzieren und essen, müssen belohnt werden.“ Mit Blick auf den morgigen SPD-Parteitag appelliert Martin Schulz als Sprecher der Traktorfahrer an sei­nen sozialdemokratischen Namensvetter, endlich Mut und Klarheit für eine zukunftsweisende Agrarpolitik zu beweisen. Der Vorsitzende der Arbeitsgemeinschaft bäuerliche Landwirtschaft Schulz sagt: „Viele Bauern haben sich schon längst auf den Weg gemacht und verändern die Landwirtschaft Tag für Tag. Leider noch ohne die Unterstützung der Politik. Wir Bauern brauchen jetzt eine zukunftsfähige Politik, die verlässliche Entscheidungen trifft und Probleme löst. Der Stillstand der alten GroKo hat zu einer Spaltung zwischen Landwirtschaft und Gesellschaft geführt. Da müssen wir raus.“ Konkrete Projekte in der nächsten Legislaturperiode müssen – neben Glyphosat-Ausstieg und Umbau der Tierställe – die Kennzeichnungspflicht bei tierischen Lebensmitteln, das Verbot von Reserve-Antibiotika in der Tierhaltung und faire Marktregeln zum Schutz von Bauernhöfen sein. Außerdem muss die Zahlung von EU-Agrarsubventionen an außerlandwirtschaftliche Investoren, die immer mehr Bauern den Boden unter den Füßen wegkaufen, sofort beendet werden. Die Großdemonstration richtet sich gegen die Agrarindustrie, nicht aber gegen Landwirte. Die konventionellen und Öko-Bauern demonstrieren auch im achten Jahr im Schulterschluss mit Lebensmittelhandwerkern und der Zivilgesellschaft gegen die fatalen Auswirkungen der intensiven industriellen Landwirtschaft. Gemeinsam zeigt das breite „Wir haben es satt!“-Bündnis Wege für eine bäuerliche Zukunftslandwirtschaft und ein gutes Ernährungssystem auf. Weitere Informationen: www.wir-haben-es-satt.de Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Presseansprechpartner, Mobil: 0151-51245795, E-Mail: rollmann[at]meine-landwirtschaft[dot]de Statements von Rednerinnen und Redner der Demonstration: Elisabeth Freesen, junge Bäuerin aus Niedersachsen, die mit dem Traktor angereist ist: „Ich bin eine junge Bäuerin und ich liebe meinen Beruf. Ich übernehme gerne Verantwortung für den Hof, die Region und eine zukunftsfähige, bäuerliche Landwirtschaft. Zusammen mit den vielen anderen jungen Menschen, die die Demonstration anführen, setze ich mich für eine Zukunft auf dem Land ein. Wir wer­den unsere Äcker und Teller nicht der Agrarindustrie überlassen. Die GroKo muss junge Men­schen auf dem Land, Existenzgründung in der Landwirtschaft und vielfältige ländliche Räume fördern.Christoph Bautz, Geschäftsführer der Bürgerbewegung Campact: "Der Einstieg in die Agrarwende muss mit dem Ausstieg aus der Pestizid-Nutzung beginnen. Glyphosat lässt unsere Insekten sterben und macht die Äcker vor der Aussaat so leblos wie einen frisch gewiener­ten Küchenboden. Eine neue Bundesregierung muss klar Farbe bekennen, wann sie das Bienengift ver­bieten will. Wir Bürger und Bürgerinnen hätten da einen Vorschlag: 2018 ist Schluss!"Ulrich Veith, Bürgermeister der pestizidfreien Gemeinde Mals aus Südtirol: „Das Beispiel der Gemeinde Mals zeigt: Es zahlt sich aus, für eine bessere Welt einzustehen. Heute ist Mals frei von chemischen Pestiziden, in einigen Jahren wird es ganz Südtirol sein. Vielleicht zieht Europa mit. Großes entsteht immer im Kleinen. Jeder einzelne kann, ja muss seinen Beitrag leisten. Weitsicht, Mut und Ausdauer, mehr braucht es nicht.“Fátima Aparecida Garcia de Moura, Federação de Órgãos para Assistência Social e Educacional (FASE), Brasilien: „Soja ist nicht nachhaltig, es ist kein richtiges Lebensmittel, sondern vorrangig Futtermittel und wird vor allem für den Export produziert. Sojaanbau führt zu Vertreibungen von Familien und Landverlust. In meinem Staat Mato Grosso ist der größte Gewinner des Sojaanbaus der brasilianische Landwirtschafts­minister Blairo Maggi mit seiner Firma Amaggi.“ Hubert Weiger, Vorsitzender des Bund für Umwelt und Naturschutz Deutschland (BUND): „Gülle und Pestizide belasten Böden und Gewässer, bäuerliche Betriebe ringen ums Überleben und das Insektensterben zeigt, welche dramatischen Auswirkungen die industrielle Agrarproduktion auf die Artenvielfalt hat. Die nächste Bundesregierung muss Lösungen für die massiven Probleme der Land­wirtschaft präsentieren. Wir erwarten einen verbindlichen Umbauplan für die Tierhaltung, eine ambitio­nierte Minderungsstrategie für Pestizide und ein Verbot von Glyphosat und der für Bienen gefährlichen Neonikotinoide.“Ole Plogstedt, TV-Koch, bekannt aus „Die Kochprofis – Einsatz am Herd“: „Es geht um viel mehr, als nur um unser Essen. Eine vernünftige weltweite Agrarwende würde nicht nur Tierleid minimieren, sondern ebenfalls dem Welthunger und der Umweltzerstörung entgegenwirken. Nicht zuletzt würde sie auch Menschenrechte und Gesundheit schützen und sogar Fluchtursachen bekämpfen.“ Thomas Schröder, Präsident des Deutschen Tierschutzbundes: „Die Gesellschaft erwartet ein Mehr an Tierschutz. Tiere haben keinen Preis, Tiere haben einen Wert und Wirtschaftlichkeit darf kein Grund sein, ihnen Schmerzen, Leiden oder Schäden zuzufügen. Des­halb braucht es eine neue Agrarpolitik inklusive einer Nutztierstrategie, die den breiten Konsens der Ge­sellschaft hin zu mehr Tier- und Umweltschutz endlich in die Spur bringt.“ Stephanie Strotdrees, Bäuerin und Vizepräsidentin von Bioland e.V.: „In einem gesunden Kreislaufsystem gehören Tierhaltung und Landwirtschaft zusammen. Die Tiere müssen von der Fläche ernährt werden können und der Acker muss Gülle und Mist aufnehmen können. Nur so können wir eine Lösung für die Nitratproblematik schaffen. Fördermittel müssen an eine niedri­gere Tierzahl pro Hektar gekoppelt werden.“Georg Janßen, Bundesgeschäftsführer der Arbeitsgemeinschaft bäuerliche Landwirtschaft: „Wir brauchen eine grundlegende Reform der europäischen Agrarpolitik. Diejenigen, die umwelt- und klimaschonenden Ackerbau betreiben und Tiere artgerecht halten, müssen durch Direktzahlungen un­terstützt werden, nicht wer am meisten Flächen besitzt. Die Bäuerinnen und Bauern sind bereit, aber die Politik muss den Rahmen schaffen. Gerade die kleinen und mittleren landwirtschaftlichen Betriebe braucht das Land.“Kirsten Wosnitza, Milchbäuerin aus Schleswig-Holstein vom Bundesverband Deutscher Milchviehhalter: „Eine Agrarpolitik mit dem System ‚immer billiger – immer mehr‘ ist gegen die Interessen von Bauern und Bürgern. Milchbauern wollen keine Überschussproduktion, sondern sie brauchen faire Marktregeln und faire Preise. Dann können öffentliche Gelder für öffentliche Leistungen bezahlt werden und nach­haltige Milcherzeugung wird eine echte Perspektive haben.“Rudolf Bühler, Bauer aus Hohenlohe und Vorsitzender der Bäuerlichen Erzeugergemeinschaft Schwä­bisch Hall: „Wir Bauern fordern die Agrar- und Ernährungsindustrie auf: Hände weg von Saatgut und Tierzucht. Schluss mit der Enteignung und Vertreibung von Bauern und Hirten durch die Agrarindustrie! Wir treten ein für den Schutz von natürlichen Ressourcen, der indigenen Kulturen, des indigenen Wissens und des Bodens, den Bauern seit Generationen bewirtschaften und bewahren. Für den globalen Schutz der indi­genen Rechte von Kleinbauern und -bäuerinnen dieser Welt! Die Vereinten Nationen müssen das end­lich durch Bauernrechte sicherstellen.“ Pressemitteilung'
