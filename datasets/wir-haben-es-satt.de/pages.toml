["https://wir-haben-es-satt.de/berlin-04092023"]
title = "Berlin, 04.09.2023 - Wir haben es satt!"
full_description = "Pressemitteilung „Wir haben Tierfabriken satt!“-Demo am 16.9. zum Schlachthof Wiesenhof in Königs Wusterhausen „Wir haben es satt!“ Bündnis fordert, Megaställe endlich zu schließen und die bäuerliche und tiergerechte Tierhaltung finanziell zu fördern Berlin, 04.09.23. Unter dem Motto „Wiesen und Höfe statt Wiesenhof“ rufen 37 Organisationen aus Landwirtschaft und Gesellschaft zur „Wir haben Tierfabriken satt“-Demonstration am 16. September zum Wiesenhof Schlachthof auf, um vor Ort ein Zeichen gegen Konzernmacht und Tierfabriken zu setzen. In Königs Wusterhausen mästet der Geflügelkonzern Wiesenhof über 1 Million Hühner - dichtgedrängt in Megaställen ohne Auslauf. Täglich werden über 120.000 davon in der konzerneigenen Schlachtfabrik geschlachtet. Die Überproduktion in den Tierfabriken verursacht nicht nur Tierleid. Antibiotikaresistenzen, Emissionen und massive Gülleausträge schaden Mensch, Klima und Umwelt. Hierzulande verdrängen Megaställe bäuerliche Betriebe und auch im globalen Süden zerstören europäische Fleischexporte Existenzen von Bäuerinnen und Bauern. Das „Wir haben es satt“- Bündnis fordert den sofortigen Abbau von industriellen Megaställen und eine gezielte finanzielle Förderung von bäuerlicher und artgerechter Tierhaltung. Der Abbau von Megaställen ist eine zentrale Stellschraube, um in der gesamten Landwirtschaft mehr Tierwohl, Klima und- Umweltschutz zu erreichen. Die „Borchert-Kommission“ hat ihre Arbeit niedergelegt und klargestellt, dass der dringend notwendige Umbau der Tierhaltung in Deutschland ohne ausreichende Finanzierung nicht umgesetzt werden kann. Die Bundesregierung sträubt sich allerdings, die finanziellen Mittel bereitzustellen. Immer noch profitieren kleinbäuerliche Weidebetriebe am wenigsten von der staatlichen Förderung. Das „Wir haben es satt!“-Bündnis fordert die Ampelkoalition auf, die erforderlichen finanziellen Mittel für den Umbau der Tierhaltung bereitzustellen und Bäuerinnen und Bauern eine wirtschaftliche Perspektive zu bieten. Terminhinweise: Podiumsdiskussion: „Zukunftsfähige Nutztierhaltung – wie erreichen wir das?“ Zeit: Freitag, 15. September 2023, 19.30 Uhr Ort: Festwiese Niederlehme, Dorfanger 1, 15751 Königs Wusterhausen (bei Berlin) „Wir haben Tierfabriken satt!“-Demonstration zum Wiesenhof-Schlachthof Zeit: Samstag, 16. September 2023, ab 12.00 Uhr Ort: Bahnhof Königs Wusterhausen Ab 13:45 Uhr: Abschlusskundgebung am Wiesenhof-Schlachthof in Niederlehme. Ort: Wiesenhof-Schlachthof, Am Möllenberg 17-18, 15713 Königs Wusterhausen Im Anschluss: „Tanzen, essen und spannenden Workshops lauschen - Fest für die Agrarwende“ auf der Festwiese Niederlehme Weitere Informationen zu Demo und Camp Pressekontakt: Julia Güttler „Wir haben es satt!“-Pressesprecherin Tel.: 030-28482438 Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung"
