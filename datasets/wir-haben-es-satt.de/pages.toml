["https://wir-haben-es-satt.de/informieren/anreise/mitfahrzentrale"]
title = "Mitfahrzentrale - Wir haben es satt!"
full_description = 'Fragen? Melde dich bei uns! Nicole Schiwietz schiwietz[at]meine-landwirtschaft[dot]de 030 / 28482437 Mitfahrzentrale Nutze unsere Mitfahrzentrale, um gemeinsam zur großen "Wir haben es satt!"-Demo am 18.01.2025 zu kommen! eine fahrt anmelden Du fährst mit deinem Auto, Trecker oder einem organisierten Bus nach Berlin zur Demo und suchst noch nette Leute, die mitfahren? Schreibe uns gerne einfach eine E-Mail mit Ort und Uhrzeit der Abfahrt, Ansprechpartner mit Kontaktdaten sowie Kosten an Nicole Schiwietz vom Demo-Orga-Team. Auch Zugfahrende mit noch offenen Ticketkontingenten (z. B. Quer-durchs-Land-Ticket) können sich bei uns melden. Wir sorgen dafür, dass deine Fahrt in unserer Karte sichtbar wird, um vorhandene Kapazitäten bestmöglich zu nutzen. Eine Fahrt suchen Du suchst noch nach einer Mitfahrgelegenheit, um aus deiner Stadt zur WHES-Demo nach Berlin zu kommen? Schau gerne in unsere Kartenansicht und finde heraus, welche Fahrten ab deiner Heimatstadt Richtung Demo in Berlin starten. Mit den dort sichtbar gemachten Ansprechpersonen kannst du alles Weitere klären. Grüne Punkte zeigen gemeinsame Zugfahrten an, blaue Punkte markieren gemeinsame Anreise mit Pkw oder Bus. Lilane Punkte weisen auf Orte hin, an denen das Interesse besteht eine gemeinsame Anreise zu organisieren. Besonders dort bei Interesse möglichst zeitnah bei den angegebenen Kontaktdaten melden, um abzuschätzen, wie viele Leute zusammen zur Demo fahren wollen. Weiterführende Infos findet ihr in den Beschriftungen der Kartenmarkierungen. Hinweis Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses externen Inhaltes nicht zu. Cookie-Einstellungen anpassen Fragen? Melde dich bei uns! Nicole Schiwietz schiwietz[at]meine-landwirtschaft[dot]de 030 / 28482437'
