["https://wir-haben-es-satt.de/presse-archiv/soemmerda-8917"]
title = "Sömmerda, 8.9.17 - Wir haben es satt!"
full_description = 'Pressemitteilung Fotos zur kostenfreien Nutzung (Quellenangabe: www.wir-haben-es-satt.de) „Allee des Landraubs“: Bauern pflanzen 42 Bäume gegen Ausverkauf von landwirtschaftlichen Flächen Bauern aus Ostdeutschland mit zivilem Ungehorsam gegen Landraub und -konzentration / Investoren gefährden bäuerliche Betriebe durch massiven Aufkauf von Acker- und Weideland Sömmerda (Thüringen), 8.9.17. Mit einer spektakulären Aktion protestierten Bäuerinnen und Bauern aus Ostdeutschland heute Morgen gegen Landraub. Sie pflanzten in einer ausgeräumten Agrarland¬schaft 42 Apfelbäume auf ein 130-Hektar großes Ackerstück der Südzucker AG, das der Konzern sich widerrechtlich angeeignet hatte. Unterstützt wurden sie von den Teilnehmern der „Wir haben es satt!“-Aktionstour für eine andere Agrarpolitik, die vor der Bundestagswahl quer durch Deutschland führt. Im Anschluss weihten die Demonstranten feierlich die „Allee des Landraubs“ ein und übergaben sie der Gemeinde Sömmerda, der rechtmäßigen Eigentümerin der Flächen. Es handelt sich um den ersten Akt zivilen Ungehorsams, mit dem Bauern hierzulande gegen Landraub protestieren. Ihre Kritik: Immer mehr außerlandwirtschaftliche Investoren entziehen Landwirten Acker- und Weideland. So auch im Fall der insgesamt 2500 Hektar großen Fläche in Sömmerda, die der Großkonzern Südzucker im vergangenen Jahr für 29 Millionen Euro von der Terra eG, einer ehemaligen LPG, erworben hat. „Diese Allee ist ein Symbol des Kampfs für eine gerechte Landverteilung“, erklärte Michael Grolm, Vorsitzender der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) Mitteldeutschland. „Wir haben heute 42 Bäume gepflanzt. Einen für jeden ehemaligen Genossen der Terra eG. Diese noch verbliebenen Genossen haben mit dem Verkauf an Südzucker 29 Millionen gemacht, obwohl sie das Land nach der Wende extrem vergünstigt bekommen haben. Wir fordern in allen Bundesländern Agrarstrukturgesetze, die garantieren, dass nur landwirtschaftliche Betriebe Agrarflächen kaufen können. Außerdem müssen Anteilskäufe und andere Tricks, die außerlandwirtschaftliche Investoren nutzen, um an Boden zu kommen, verboten werden." Landraub ist längst auch ein Problem in Deutschland. Investoren zahlen heutzutage Preise, die in der Landwirtschaft nicht erwirtschaftet werden können. Dabei wird meist das Grundstücksverkehrsgesetz umgangen, das eine Landvergabe an landwirtschaftliche Betriebe vorschreibt. Weil sich die Situation zunehmend zuspitzt, sind die Bauern heute aktiv geworden: Viele Betriebe bekommen kein Land mehr und sind daher in ihrer Existenz bedroht. So gehören etwa im Landkreis Mecklenburgische Seenplatte nach Angaben des Thünen-Instituts mittlerweile 43 Prozent der Agrarflächen außerlandwirtschaftlichen Investoren. Im Landkreis Sömmerda, wo die Allee gepflanzt wurde, ist bereits jeder fünfte Betrieb in Hand von Unternehmen, die weder lokal verankert sind noch ihren Ursprung in der Landwirtschaft haben. Diese Konzerne zahlen in der Regel keine Steuern vor Ort und sorgen dafür, dass auf lange Sicht Arbeitsplätze in der Region abgebaut werden. Die Konsequenz: Der Ausverkauf des ländlichen Raums. Jochen Fritz, Landwirt im Nebenerwerb und Organisator der „Wir haben es satt!“-Demonstrationen, zu der alljährlich im Januar Zehntausende in Berlin für eine andere Agrarpolitik auf die Straße gehen, sagte: „Es ist ein Skandal, dass Bauern sich landwirtschaftlichen Boden nicht mehr leisten können. Die Preise haben sich in den letzten zehn Jahren mehr als verdoppelt. Auch deshalb können viele Bauern heute nicht mehr von dem leben, was sie anbauen und müssen ihre Höfe schließen. Die Zivilgesellschaft will bäuerliche Betriebe und eine vielfältige Landwirtschaft. Wir fordern eine bevorzugte Landvergabe an bäuerliche Betriebe und junge Menschen, die eine Zukunft in der Landwirtschaft suchen. Dafür treten wir auch jetzt vor der Bundestagswahl ein.“ An den Thüringer Ministerpräsident Bodo Ramelow, Agrarministerin Birgit Keller und Umweltministerin Anja Siegesmund gerichtet formulierten die Bauern das Angebot, weitere Bäume mit ihnen zu pflanzen und Farbe zu bekennen. Zugleich forderten sie die Politiker auf, noch in dieser Legislaturperiode ein Agrarstrukturgesetz auf Landesebene zu verabschieden. Fotos zur freien Verwendung in druckfähiger Qualität finden Sie ab 11 Uhr an dieser Stelle.Hintergrund: Die Südzucker AG hat im Juni 2016 für 29 Millionen Euro den ehemaligen LPG-Betrieb Terra eG mit 2500 Hektar gekauft. Auf einem 130 Hektar großen Flurstück dieser Fläche in Sömmerda wurde nun die „Allee des Landraubs“ gepflanzt, die von 42 drei Meter hohen Apfelbäumen umsäumt wird. Sie hat eine Breite von 11 Metern, was dem im Kataster der Gemeinde eingetragenen öffentlichen Weg entspricht, der an dieser Stelle sein sollte. Viele derartiger Wege wurden in der Vergangenheit zu Ackerland umgewandelt oder auf eine minimale Breite reduziert. Dies geschah zumeist widerrecht¬lich und ohne die notwendige Zahlung von Pachtgebühren an die Gemeinde – so auch in diesem Fall. Die Aktion fand im Rahmen der „Wir haben es satt!“-Aktionstour gegen Konzernmacht, Landraub und Tierfabriken statt. Aufgerufen von den mehr als 45 Trägerorganisationen aus Landwirtschaft und Zivilgesellschaft demonstrierten Teilnehmer am Mittwoch (6.9.) in Leverkusen gegen die geplante Übernahme von Monsanto durch die Bayer AG. Am Samstag, den 9.9. fand die große Abschlussdemonstration zum Wiesenhof-Schlachthof in Königs Wusterhausen bei Berlin statt, wo der größte deutsche Geflügelhersteller künftig 240.000 Hühner am Tag schlachten will. Das breite gesellschaftliche Bündnis fordert vor der Bundestagswahl die rasche Umsetzung der Agrar- und Ernährungswende. Weitere Informationen: www.wir-haben-es-satt.de Bitte beachten Sie auch die beigefügten Hintergrundinformationen der AbL Mitteldeutschland sowie den Thünen Report 35 „Überregional aktive Kapitaleigentümer in ostdeutschen Agrarunternehmen: Bestandsaufnahme und Entwicklung“. Für Rückfragen: Michael Grolm, Vorsitzender der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) Mitteldeutschland, Mobil: 0170-1087174, Mail: mitteldeutschland(at)abl-ev.de Jochen Fritz, „Wir haben es satt!“-Sprecher, Mobil: 0171-8229719, Mail: fritz(at)meine-landwirtschaft.de Pressekontakt:Christian Rollmann, Kampagne „Meine Landwirtschaft“/Wir haben es satt!, Mobil: 0151-51245795, Mail: rollmann(at)meine-landwirtschaft.de Pressemitteilung Fotos zur kostenfreien Nutzung (Quellenangabe: www.wir-haben-es-satt.de)'
