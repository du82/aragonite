title = "Berlin, 19.01.2019 - Wir haben es satt!"
full_description = "Pressemitteilung 35.000 fordern von Ministerin Klöckner eine EU-Agrarreform für Bauern, Tiere und Umwelt „Der Agrarindustrie den Geldhahn abdrehen!“ / Agrarpolitik der Bundesregierung befeuert Klimawandel und Höfesterben Berlin, 19.01.19. Eine zukunftsfähige Agrarreform – das fordern zehntausende Teilnehmer bei der „Wir haben es satt!“-Demonstration zum Auftakt der „Grünen Woche“ in Berlin. „Lautstark, bunt und entschlossen haben wir heute mit 35.000 Menschen Landwirtschaftsministerin Julia Klöckner einen unmissverständlichen Auftrag gegeben: Schluss mit der falschen Agrarpolitik“, erklärt „Wir haben es satt!“-Sprecherin Saskia Richartz im Namen der über 100 Organisationen, die zur Demonstration aufgerufen haben. Das Demonstrationsbündnis fordert die Bundesregierung auf, den überfälligen Umbau der Landwirtschaft anzupacken. Die Gelegenheit ist da: Bei der aktuellen Reform der EU-Agrarpolitik (GAP) entscheidet die Bundesregierung maßgeblich mit, welche Landwirtschaft künftig durch Steuergelder finanziert wird. In Deutschland werden jedes Jahr 6,3 Milliarden Euro an EU-Agrargeldern ausgeschüttet, mehr als drei Viertel davon als pauschale Subventionen je Hektar Fläche. In der Praxis heißt das: Die 3.300 flächengrößten Betriebe erhalten eine Milliarde Euro im Jahr, während die kleinsten 200.000 Bauernhöfe sich knapp 700 Millionen teilen müssen. „Mit den über sechs Milliarden Euro, die Deutschland jedes Jahr an EU-Agrargeldern verteilt, muss der umwelt- und tiergerechte Umbau der Landwirtschaft gefördert werden”, so Saskia Richartz. “Doch Agrarministerin Klöckner klammert sich an die pauschalen Flächensubventionen wie ihre Vorgänger ans Ackergift Glyphosat. Der Agrarindustrie immer weiter Milliarden in den Rachen zu stopfen ist agrar- und klimapolitischer Irrsinn. Wir fordern: Umverteilen jetzt!” Beim Demonstrationszug zum Agrarministergipfel schlagen die Demonstranten Alarm für die Agrarwende. Mit ihrem Kochtopf-Konzert fordern sie konsequenten Klima- und Naturschutz, mehr Unterstützung für kleine und mittlere Betriebe, artgerechte Tierhaltung, ein Ende der Dumping-Exporte, gerechten Welthandel und gesundes Essen für alle. Schon am Vormittag hatten die 171 Bauern, die die Demonstration mit ihren Traktoren anführen, eine Protestnote an die 70 versammelten Minister aus aller Welt übergeben. „Wir haben die Agrarpolitik der Bundesregierung satt. Wir ackern tagtäglich für gutes, enkeltauglich produziertes Essen. Dafür verlangen wir politische Unterstützung“, sagt Moritz Schäfer. Der 32-Jährige ist aus dem hessischen Schwalmtal mit dem Traktor angereist, wo er einen Betrieb mit 100 Kühen und 250 Hektar bewirtschaftet. „Meine Kühe stehen auf der Weide, ich produziere das Futter hier vor Ort und sähe vielfältige Fruchtfolgen. Insekten, Wasser und Klima danken es mir, die Politik aber nicht. Julia Klöckner muss endlich die Interessenvertretung der Industrie beenden und eine Politik für Bauern, Bienen und lebensfähige Dörfer machen“, fordert Schäfer im Namen der Traktorfahrer. Die Großdemonstration richtet sich gegen die Agrarindustrie, nicht aber gegen Landwirte. Die konventionellen und Öko-Bauern demonstrieren auch im neunten Jahr im Schulterschluss mit Bäckern, Imkern, Köchen, Naturschützern und der Zivilgesellschaft gegen die fatalen Auswirkungen der intensiven industriellen Landwirtschaft. Gemeinsam zeigt das breite „Wir haben es satt!“-Bündnis Wege für eine bäuerliche Landwirtschaft der Zukunft und ein gutes Ernährungssystem auf. Weitere Informationen: www.wir-haben-es-satt.de ZU DEN FOTOS Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Pressesprecher, Tel.: 030-28482438, Mobil: 0151-51245795, E-Mail: presse[at]meine-landwirtschaft[dot]de Statements von Rednerinnen und Rednern der Demonstration: Ursula Hudson, Vorsitzende von Slow Food Deutschland: „Um unsere Ernährung und die der nächsten Generation zu sichern, müssen wir die biokulturelle Vielfalt bewahren und die kleinbäuerliche Landwirtschaft, handwerkliche Fischerei und Lebensmittelherstellung unterstützen. Gefördert werden darf nur noch, wer soziale und ökologische Leistungen erbringt. Dafür ist ein politischer Kurswechsel unausweichlich.“ Hubert Weiger, Vorsitzender des Bund für Umwelt und Naturschutz Deutschland (BUND): „Die europäische Agrarpolitik muss geändert werden. Nur wer Tiere artgerecht hält und unsere Umwelt schützt, soll in Zukunft Geld aus Brüssel bekommen. Wir brauchen ein starkes Europa, das aber ökologisch und sozial gerechter ist und brauchen die Stärkung des EU-Parlaments, damit das auch als Mehrheitswille der europäischen Bevölkerung durchgesetzt werden kann.“ Alina Drach vom ackerfeministischen Treckerblock: „In landwirtschaftlichen Betrieben arbeiten knapp 50% Frauen*, ihre Arbeit wird oft nicht gesehen und wertgeschätzt. Wir fordern Chancengleichheit für Frauen* in der Landwirtschaft. Wir sind hier, um zu zeigen, dass wir auch Trecker fahren können und der Kampf für eine gerechte Agrarpolitik nur gemeinsam geht!“ Dr. Felix Prinz zu Löwenstein, Bio-Bauer und Vorsitzender des Bund Ökologische Lebensmittelwirtschaft (BÖLW): „Immer mehr Landwirte packen den Umbau der Landwirtschaft schon selbst an – nicht nur hunderttausende Bio-Bauern in ganz Europa. Die Politik muss mit der EU-Agrarpolitik die Bauern unterstützen, die Klima und Wasser, Boden und Bienen schützen und unsere Tiere artgerecht halten.“ Janet Maro, Geschäftsführerin von Sustainable Agriculture Tanzania (SAT): „Deutschland muss in seiner Entwicklungszusammenarbeit auf Agrarökologie statt Agrarindustrie und Grüne Revolution setzen. Wir brauchen bäuerliches Saatgut und keine Hybride. Damit Agrarökologie und bäuerliches Saatgut endlich eine Chance haben, muss Deutschland die Förderung der Allianz für eine Grüne Revolution in Afrika einstellen.“ Sweelin Heuss, Geschäftsführerin von Greenpeace Deutschland: „Für Bäuerinnen und Bauern sind Dürre und Starkregen eine besonders existenzielle Gefahr. Die Landwirtschaft kann dem Klimawandel nicht einfach ausweichen. Ich bin froh, dass wir mit der Klimaklage Seite an Seite mit Landwirten für wirksamen Klimaschutz kämpfen!“ Lucia Heigl, konventionelle Milchbäuerin aus Bayern und stellvertretende Bundesvorsitzende der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL): „Wir nehmen die Sorgen und Wünsche der Gesellschaft ernst. Aber dafür brauchen wir faire Preise und eine grundlegend andere Förder- und Marktpolitik in Berlin. Die alte Agrarpolitik haben wir satt.“ Olaf Tschimpke, NABU-Präsident: „Die aktuelle Agrarpolitik schaufelt ein Grab für Insekten und Höfe – finanziert mit 60 Milliarden Euro Steuergeld. Wir brauchen einen Kurswechsel: Landwirte, die Natur und Klima schonen, müssen besser belohnt werden. Frau Klöckner, befreien Sie sich endlich aus dem Zangengriff der Agrarlobby und machen Sie Agrarpolitik für Bauern und Verbraucher“ Thomas Schröder, Präsident des Deutschen Tierschutzbundes: „Eine freiwillige, staatliche Tierwohlkennzeichnung, wie sie Bundeslandwirtschaftsministerin Klöckner plant, darf nicht missbraucht werden, um notwendige Anpassungen im Ordnungsrecht auf die lange Bank zu schieben. Die Kennzeichnung sollte daher dringend in eine Gesamtstrategie eingebettet sein.“ Christoph Bautz, Geschäftsführer der Bürgerbewegung Campact: „Wir sind hier, damit die 60 Milliarden im Jahr, unser Steuergeld, endlich an die Bäuerinnen und Bauern fließen, die mit ihrer harten Arbeit unsere Kulturlandschaft und die Artenvielfalt erhalten und für gutes Essen sorgen. Gebt denen genug Geld. Aber dreht der Agrarindustrie endlich den Geldhahn zu!“ Klaus Ahrens, Vizepräsident des Deutschen Berufs- und Erwerbsimkerbunds (DBIB): „Ob Insektenschutz, Tierhaltung oder Pestizidverbot – die Agrarministerin vertagt den Umbau der Landwirtschaft auf den Kosten von Umwelt, Tier und Klima. Die Zeche bezahlen am Ende die Artenvielfalt und die Verbraucher. Denn Insekten sind nicht nur die wichtigsten Pflanzenbestäuber, sondern sie regulieren auch Schädlinge und dienen zahlreichen anderen Arten als Futter.“ Lea Kliem, Sprecherin des Berliner Ernährungsrats: „Wir wollen keinen Einheitsbrei von Großkonzernen, sondern schmackhafte Vielfalt auf den Tellern! Die Zeit ist reif für die Ernährungswende. Die Politik zeigt wenig Engagement und so nehmen zivilgesellschaftliche Initiativen wie der Ernährungsrat den Wandel in die Hand. Wir fordern: Ernährungsdemokratie jetzt!” Fotos zur kostenfreien Nutzung Zum Download bitte auf das Bild klicken. Quellenangabe: Nick Jaussi / www.wir-haben-es-satt.de Pressemitteilung"
