b1565658.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1120-98 { background-image: url('/fileadmin/user_upload/fotos/demo14/Potsdamer_Platz.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1120-98 { background-image: url('/fileadmin/user_upload/fotos/demo14/Potsdamer_Platz.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1120-98 { background-image: url('/fileadmin/user_upload/fotos/demo14/Potsdamer_Platz.jpg'); } } #carousel-backgroundimage-1120-99 { background-image: url('/fileadmin/_processed_/2/d/csm_Waescheleine_3c16a1e078.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1120-99 { background-image: url('/fileadmin/_processed_/2/d/csm_Waescheleine_b8eb097718.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1120-99 { background-image: url('/fileadmin/_processed_/2/d/csm_Waescheleine_ae44ec7ba5.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1120-99 { background-image: url('/fileadmin/user_upload/fotos/demo14/Waescheleine.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1120-99 { background-image: url('/fileadmin/user_upload/fotos/demo14/Waescheleine.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1120-99 { background-image: url('/fileadmin/user_upload/fotos/demo14/Waescheleine.jpg'); } } #carousel-backgroundimage-1120-100 { background-image: url('/fileadmin/_processed_/7/7/csm_Poster_1795225a27.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1120-100 { background-image: url('/fileadmin/_processed_/7/7/csm_Poster_6501c15946.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1120-100 { background-image: url('/fileadmin/_processed_/7/7/csm_Poster_61c7d2959e.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1120-100 { background-image: url('/fileadmin/user_upload/fotos/demo14/Poster.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1120-100 { background-image: url('/fileadmin/user_upload/fotos/demo14/Poster.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1120-100 { background-image: url('/fileadmin/user_upload/fotos/demo14/Poster.jpg'); } } Zurück Weiter Pressemitteilung 30 000 Menschen fordern: Stoppt Agrarindustrie! Die wachsende „Wir haben es satt!“-Bewegung demonstriert für eine bäuerliche und ökologischere Landwirtschaft und gutes Essen Berlin, 18. Januar 2014 | Angeführt von hunderten Bäuerinnen und Bauern und 70 Traktoren zogen heute 30 000 Menschen vor das Kanzleramt in Berlin. Die DemonstrantInnen forderten von Bundeskanzlerin Merkel und Vizekanzler Gabriel einen Kurswechsel in der Agrarpolitik. Statt weiterhin „Klientelpolitik für die Agrarindustrie“ zu betreiben, solle sich die Bundesregierung für eine soziale, tiergerechte und ökologische Agrarwende einsetzen. „Die Große Koalition fährt die Agrarpolitik an die Wand! Wer Megaställe genehmigt und subventioniert, wer auf Export und Freihandel setzt und dann auch noch darüber nachdenkt, Gentech-Pflanzen auf Europas Äckern zuzulassen, der lässt die Bäuerinnen und Bauern im Stich und handelt gegen die Interessen von VerbraucherInnen, Tieren und Umwelt“, sagt Jochen Fritz vom „Wir haben es satt!“-Bündnis. „Wir erwarten von der neuen Bundesregierung eine Landwirtschaftspolitik, die das Arten- und Höfesterben stoppt und den Hunger in der Welt bekämpft.“ Die Veranstalter kritisierten besonders das geplante Freihandelsabkommen zwischen der EU und den USA (TTIP). „Hinter verschlossenen Türen verhandelt die EU-Kommission über ein Freihandelsabkommen, das Bauern und Verbrauchern gleichermaßen schadet. Die große Mehrheit der Menschen will keine Chlorhühnchen, kein Hormonfleisch und keine Gentechnik durch die Hintertüre“, sagte Fritz. Genau das drohe aber, wenn das geplante Freihandelsabkommen abgeschlossen wird. Aufgerufen zu der Demonstration hatte das „Wir haben es satt!“-Bündnis aus über 100 Organisationen, darunter Bäuerinnen und Bauern, ImkerInnen, Natur-, Tier- und VerbraucherschützerInnen, Entwicklungsorganisationen und Erwerbsloseninitiativen. WEITERLESEN Statements: Hubert Weiger, Vorsitzender des Bunds für Umwelt und Naturschutz Deutschland (BUND): „2014 ist ein entscheidendes Jahr. Es kommt darauf an, das Freihandelsabkommen zwischen den USA und der EU zu stoppen. Dieses Abkommen gefährdet uns, unsere Kinder, die Tiere und die Umwelt. Das dürfen wir nicht zulassen. Chlorhühnchen, Hormonfleisch und Gentechnik auf dem Teller lehnen wir ab! Stattdessen brauchen wir eine Landwirtschaft, in der bäuerliche Betriebe gefördert werden statt Massentierhaltung und Export. Agrarminister Friedrich muss sich dafür einsetzen, dass mehr Geld in tiergerechte Haltungsformen fließt und dass Gentechnik und Pestizide nicht in unsere Lebensmittel gelangen.“ Thomas Schröder, Präsident des Deutschen Tierschutzbundes: "Immer größere Bestände in immer intensiveren Haltungen mit immer mehr manipulierten Hochleistungstieren sind ein Irrweg. Wir brauchen ein neues Denken und Handeln in der Agrarpolitik." Felix Prinz zu Löwenstein, Vorsitzender des Bunds Ökologische Lebensmittelwirtschaft (BÖLW): „Die Menschen wollen keine Gentechnik auf Äckern und Tellern. Die Zukunft aller Landwirte in Deutschland hängt daher davon ab, ob sie weiterhin gentechnikfrei produzieren können. Es ist deshalb entscheidend, dass die Bundesregierung in Brüssel mit einem klaren Nein gegen die Zulassung des Gentech-Maises „1507“ stimmt.“ Kerstin Lanje, Referentin für Welthandel und Ernährung bei MISEREOR: „Milchpulver, Hühnchenreste und Schweinefleisch, die in Massen von Deutschland und der EU exportiert werden sind so billig, dass Bauern in Afrika damit nicht konkurrieren können. Auch unsere Soja-Importe als Futtermittel für die massenhafte Fleischproduktion gehen auf Kosten der Armen in den Herkunftsländern. Riesige Flächen von wertvollem Ackerland werden für die Sojaproduktion genutzt, die dann für den Anbau von Lebensmitteln fehlen. Menschen werden von ihrem Land vertrieben. Pestizide für die anfälligen Monokulturen vergiften Menschen, Tiere und die Umwelt.“ Carlo Petrini, Präsident von Slow Food International: „Die bäuerliche Landwirtschaft ist nicht modernitätsfern, arm oder unterentwickelt. Es ist ein nachhaltiges landwirtschaftliches Modell, das natürliche und menschliche Ressourcen respektvoll nutzt und so soziale und Ernährungssicherheit weltweit garantiert. Dafür steht das diesjährige Internationale Jahr der bäuerlichen Familienbetriebe und dafür stehen wir heute in Berlin!“ Eckehard Niemann, Sprecher des Netzwerks Bauernhöfe statt Agrarfabriken: „Das Netzwerk Bauernhöfe statt Agrarfabriken fordert von der Bundesregierung das vollständige Verbot neuer Megaställe sowie Gesetze für eine artgerechte, flächenverbundene Tierhaltung ohne Antibiotika-Abhängigkeit, mit Auslauf und Stroh, in bäuerlich-mittelständischen Strukturen und lebendigen ländlichen Regionen – also: Klasse statt Masse zu fairen Erzeugerpreisen!“ Maria Heubuch, Vorsitzende der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL): „Die Reform der EU-Agrarpolitik hat die wesentlichen fortschrittlichen Instrumente zwar sehr in das Belieben der Mitgliedstaaten gelegt. Aber Deutschland hat nun so große Möglichkeiten wie nie zuvor, über eine gerechtere und ökologischere Politik nicht nur zu reden, sondern sie tatsächlich umzusetzen. Das steht jetzt an! Frau Merkel, liefern Sie!“ Pressespiegel Fernsehen ARD Tagesschau 20 Uhr ARD Tagesthemen (ab Minute 3:19) BR Rundschau N24 NDR n-tv RBB Abendschau RBB Aktuell (ab Minute 7:29) RBB Online (Artikel + Fotogalerie) RTL News Aktuell Sat 1 Online ZDF Heute (ab Minute 4:05) ZDF Heute (Bericht) Radio Antenne Bayern Deutsche Welle Deutschlandfunk BR Bayern 2 BR B5 aktuell BR B5 aktuell Rundschau Radio Dreyeckland Zeitung Berliner Morgenpost (1) Berliner Morgenpost (2) Berliner Zeitung Cellesche Zeitung Die Welt Deutsche Wirtschafts Nachrichten Der Westen Düsseldorfer Abendblatt Finanznachrichten.de Focus Online Frankfurter Rundschau 