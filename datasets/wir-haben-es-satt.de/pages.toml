["https://wir-haben-es-satt.de/presse-archiv/berlin-18012022"]
title = "Berlin, 18.01.2022 - Wir haben es satt!"
full_description = "Pressemitteilung PK-MITSCHNITT „Es gibt nichts Gutes, außer man tut es!“: Agrarwende jetzt! „Wir haben es satt!“-Bündnis fordert schnelle Schritte beim Umbau der Landwirtschaft / Protest am Bundestag am 22.1.22 / Video-Aktion „Staffel-Lauch für die Agrarwende“ Berlin, 18.1.22. Wenige Tage vor dem „Wir haben es satt!“-Protest am Bundestag fordern über 60 Organisationen aus Landwirtschaft und Gesellschaft heute eine rasche Umsetzung der Agrar- und Ernährungswende. Nachdem das Agrarministerium in den letzten 16 Jahren tatenlos bei Höfesterben, Tierfabriken und Klimakrise zugesehen hat, ist der Reformstau heute enorm. Deswegen muss der neue Bundeslandwirtschaftsminister Özdemir jetzt schleunigst den Umbau von Landwirtschaft und Ernährungssektor anpacken. Die große „Wir haben Agrarindustrie satt!“-Demonstration, die traditionell im Januar stattfindet, wurde wegen der hohen Infektionszahlen verschoben. Dennoch findet am 22. Januar ein bildstarker Protest am Bundestag statt. Wegen der Pandemielage sagt das Demo-Bündnis: „Bleibt bitte am 22.1. zuhause!“ und hat den „Staffel-Lauch für die Agrarwende“ ins Leben gerufen. Bei der Video-Aktion reichen derzeit Menschen in ganz Deutschland eine Lauchstange weiter und fordern dabei den Neustart in der Agrar- und Ernährungspolitik. Am 22.1. wird der Staffel-Lauch direkt an Cem Özdemir übergeben. Saskia Richartz, „Wir haben es satt!“-Sprecherin, sagt: „Es gibt nichts Gutes außer man tut es. Das gilt auch in der Agrar- und Ernährungspolitik. Von Tierzahlen und Pestizidreduktion über Fleischpreise bis zu gentechnikfreien Lieferketten – es braucht jetzt schnell verbindliche Vorgaben. Profitieren müssen die bäuerlichen und ökologischen Betriebe, nicht die Agrar- und Lebensmittelkonzerne.“ Ottmar Ilchmann, konventioneller Milchbauer aus Ostfriesland von der Arbeitsgemeinschaft bäuerliche Landwirtschaft, sagt: „Wir Bäuerinnen und Bauern brauchen endlich faire Erzeugerpreise, damit das Höfesterben gestoppt wird. Wer Anwalt der Landwirt*innen sein will, muss Handel und Verarbeitung in die Schranken weisen und das Preisdiktat stoppen. Gleichzeitig muss sichergestellt werden, dass auch bei Geringverdienenden und Sozialleistungsempfänger*innen gutes Essen auf den Tellern landet.“ Marita Wiggerthale von Oxfam sagt: „Im Lebensmittelhandel geht es sehr ungerecht zu, weil Edeka, Aldi & Co. zu viel Macht haben. Sie erzielen Rekordumsätze und drücken gleichzeitig die Lieferanten und Landwirte gnadenlos im Preis. Minister Özdemir muss ihre ausbeuterische Preispolitik verbieten, ihre Übermacht im Einkauf per Entflechtung brechen und die Ombuds- und Preisbeobachtungsstelle in Kraft setzen“. Tina Andres vom Bund Ökologische Lebensmittelwirtschaft (BÖLW) sagt: „Die Ernährungswende drängt! Bio bietet sich für den Umbau an. Denn mit Öko gehen Ökologie und Ökonomie heute schon Hand in Hand. Und zwar per Gesetz und kontrolliert. Die Messlatte für die Bundesregierung liegt auf: 30 % Öko bis 2030. Das geht, wenn Özdemir und Kollegen Volldampf überall dort geben, wo es das entlang der gesamten Wertschöpfungskette braucht.“ Rüdiger Jürgensen von VIER PFOTEN sagt: „Wir brauchen einen Neustart bei der Tierhaltung und kein Herumdoktern am kranken System. Weniger Tiere, dafür mehr Platz und Auslauf. Schluss mit Qualhaltungen, nicht kurativen Eingriffen und Turbozuchten. Minister Özdemir muss den Umbau zügig vorantreiben, es darf nicht bei einer Ankündigungspolitik bleiben.“ Martin Hofstetter von Greenpeace sagt: „Wir werden den neuen Landwirtschaftsminister genauso kritisch begleiten wie die vergangenen Ministerinnen und Minister der Union. Die wichtigste Aufgabe von Cem Özdemir ist es jetzt, den Umbau und Abbau der Tierhaltung anzugehen. Nur dann ist unsere Landwirtschaft zukunftsfähig.“ „Wir haben es satt!“-Protest 2022 – TerminübersichtSamstag, 22.01.22, 12 Uhr: „Wir haben es satt!“-Protest. Ort: Bundestag, Friedrich-Ebert-Platz/Reichstagufer, 10117 Berlin. Pressetreffpunkt ab 11:45 Uhr auf der gegenüberliegenden Spreeseite/Treppe vom Marie-Elisabeth-Lüders-Haus.Samstag, 22.01.22, 9:45 Uhr: Ankunft der Traktoren. 10 Uhr: Bauernprotest am Agrarministerium mit Übergabe von Protestnote an Minister Cem Özdemir. Ort: BMEL, Wilhelmstraße 54, 10117 Berlin.Rahmenprogramm: Freitag, 21.01.22, 17-22 Uhr, Schnippeldisko – Topf, Tanz, Talk (online). Samstag, 22.01.22, 17-20 Uhr, Soup & Talk – 5-Minuten-Talks zu guter Landwirtschaft. Hintergrund: Für eine bäuerliche Landwirtschaft mit mehr Umwelt-, Tier- und Klimaschutz protestiert das „Wir haben es satt!“-Bündnis aus über 60 Organisationen am 22. Januar vor dem Bundestag. Seit 2011 gehen alljährlich zum Auftakt der „Grünen Woche“ Zehntausende unter dem Motto „Wir haben es satt – Essen ist politisch!“ auf die Straße. Pandemiebedingt wurde die Großdemonstration dieses Jahr noch einmal verschoben. Für Rückfragen: Saskia Richartz, „Wir haben es satt!“-Sprecherin, Mobil: 0177 890 50 54, E-Mail: richartz[at]meine-landwirtschaft[dot]de Ottmar Ilchmann, Vorsitzender Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) Niedersachsen/Bremen, Tel.: 04967-334, Mobil: 0176 45 000 760, E-Mail: o.ilchmann[at]yahoo[dot]de Marita Wiggerthale, Agrarexpertin bei Oxfam Deutschland e.V., Mobil: 0162 138 63 21, E-Mail: mwiggerthale[at]oxfam[dot]de Tina Andres, Vorstandsvorsitzende Bund Ökologische Lebensmittelwirtschaft (BÖLW), Kontakt über Pressestelle: Tel.: 030 284 82 307, E-Mail: presse[at]boelw[dot]de Rüdiger Jürgensen, Geschäftsführer Politik VIER PFOTEN, Kontakt über Pressestelle: Mobil: 0151 18 35 15 30, E-Mail: Oliver.Windhorst[at]vier-pfoten[dot]org Martin Hofstetter, Landwirtschaftsexperte von Greenpeace, Mobil: 0171 870 66 45, E-Mail: martin.hofstetter[at]greenpeace[dot]org Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Pressesprecher, Tel.: 030 284 82 438‚ Mobil: 0151 512 45 795, E-Mail: presse[at]meine-landwirtschaft[dot]de Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Tel.: 030-28482438, Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung PK-MITSCHNITT"
