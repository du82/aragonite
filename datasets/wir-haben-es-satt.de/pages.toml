["https://wir-haben-es-satt.de/trecker/aktuelles"]
title = "Aktuelles - Wir haben es satt!"
full_description = "Kontakt Eure Ansprechpartnerin Doro Sterz Tel: 0175- 3381399 trecker[at]wir-haben-es-satt[dot]de Informationen ABLAUF DEMO-TAG ÜBERNACHTUNG ANREISE AUFRUF Ohne Trecker, aber mit euch Bäuerinnen und Bauern! Wir sind erschüttert über den Ausbruch der Maul- und Klauenseuche in Brandenburg. Seit 1988 ist das der erste Ausbruch dieser hoch ansteckenden Krankheit für Rinder, Schafe, Schweine und alle weiteren Paarhufer. Um eine Ausbreitung über das Bundesgebiet zu verhindern, haben wir uns schweren Herzens gegen eine Treckerbeteiligung bei der Wir haben es satt!-Demo entschieden. Die Trecker bleiben auf den Höfen und so nehmen wir Rücksicht auf unsere Tierbestände und unsere Nachbarn. Wir wollen auch ohne Trecker ein starkes bäuerliches Zeichen setzen. Der Wahlkampf läuft – jetzt gilt es Landwirtschaft als Thema zu setzen. Kommt zur Demo und unseren Kundgebungen, bringt Freund:innen und Kolleg:innen mit! ANMELDUNG Doro Sterz trecker@wir-haben-es-satt.de Tel: 0175- 3381399 Ablauf am Demotag am 18.01. Am 18.01. haben wir einen Tag voll bäuerlichen Protest vor uns. Beim Freiland Potsdam (s.u.) gibt es die Möglichkeit, am Vorabend anzureisen und zu übernachten. Am Samstag brechen wir dann gemeinsam morgens um 6 Uhr mit den öffentlichen Verkehrsmitteln nach Berlin auf. Falls ihr nicht übernachtet, könnt ihr am Samstag früh direkt zu den unten genannten Treffpunkten dazu stoßen. Bäuerlicher Protest zur Internationalen Agrarministerkonferenz Am Wochenende versammeln sich Agrarminister:innen aus der ganzen Welt in Berlin. Wir machen mit einer bäuerlichen Proteste deutlich: Zukunft braucht Höfe - Bäuerinnen & Bauern vor Konzerninteressen weltweit! 6:45 Uhr Treffpunkt vor dem City Cube (Messedamm 26, 14055 Berlin) für gemeinsames Aktionsbild 7:15 - 7:30 Uhr Übergabe der bäuerlichen Protestnote an Bundeslandwirtschaftsminister Cem Özdemir 9:00 - 9:30 Uhr Kundgebung mit der Parlamentarischen Staatssekretärin Ophelia Nick Unsere Forderungen übermitteln in kurzen Redebeiträgen: Claudia Gerster, AbL-Bundesvorsitzende Xenia Brand, AbL-Bundesgeschäftsführung Qammar Abbas, Pakistan Kissan Rabita Committee und Delegierter beim Junglandwirt:innen-Forum der internationalen Agrarministerkonferenz Gast: Hans Foldenauer, Sprecher des Bundesverbands Deutscher Milchviehhalter Grußwort: Anne Skambraks, Sprecherin des Bündnisses „Wir haben es satt!“ Bäuerlicher Laufblock bei der 15. Wir haben es satt!-Demo Im Anschluss fahren wir mit den Öffis nach zum Startpunkt der Demo am Platz der Republik. Dort stoßen wir zur Wir haben es satt!-Demo und machen Stimmung im bäuerlichen Laufblock. Mit Bannern, Handschildern und einem alternativen Themenwagen werden wir laut für eine mutige Agrarpolitik, für faire Preise und Zugang zu Land, gegen das EU-Mercosur-Abkommen und Gentechnik, für Klimaschutz! 11:30 Uhr Treffpunkt bäuerlicher Block am Platz der Republik, Pressetribüne, Heinrich von Gagern-Strasse 12:00 Uhr Bäuerlicher Block mit großem Treckerbanner, Musik, Bannern und Handschilder im großen Demozug durch Berlin Danach ab ca. 16 Uhr sind alle zum Fest für die Agrarwende in die Heinrich-Böll-Stiftung eingeladen, dort gibt es Suppe, Kaffee und Austausch zwischen Stadt und Land. Weitere Informationen zum Programm: hier Zu all diesen Terminen sind wir Bäuerinnen und Bauern zentral, jetzt ohne Trecker aber mit genauso deutlichen Forderungen! ANMELDUNG Doro Sterz trecker@wir-haben-es-satt.de Tel: 0175- 3381399 Übernachtung & Bäuerliches Treffen am 17.01. Auch das StadtGut Blankenfelde, auf dem wir viele Jahre genächtigt haben, können wir aufgrund des Ausbruchs der Maul- und Klauenseuche nicht besuchen. Doch in Windeseile haben wir eine gute Alternative gefunden: Freiland Potsdam. Das Gelände ist nur wenige Gehminuten von Potsdam Hauptbahnhof entfernt und gut mit den öffentlichen Verkehrsmitteln angebunden. Insbesondere am Vorabend der Demo können wir dort übernachten. Wir richten ein gemütliches Übernachtungslager für euch ein. Für Matratzen, Verpflegung und ausreichend Getränke sorgen wir. Bitte bringt einen Schlafsack mit. Bäuerinnen und Bauern und auch Helfer:innen sind herzlich willkommen! 14:00 Uhr Banner malen, Brote schmieren, Papptrecker basteln (Videoanleitung) 18:00 Uhr Gemeinsames Abendessen & gemütliches Beisammensein 20:00 Uhr Politische Einordnung & letzte Infos vor dem Demotag (Xenia Brand, Doro Sterz, Georg Janßen) Adresse: freiLand Friedrich-Engels-Straße 22 14473 Potsdam Bitte meldet euch unbedingt an, wenn ihr mit oder ohne Übernachtung kommen wollt – so können wir euch über kurzfristige Änderungen per E-Mail auf dem Laufenden halten und die Verpflegung kalkulieren. ANMELDUNG Doro Sterz trecker@wir-haben-es-satt.de Tel: 0175- 3381399 Hygienemaßnahmen gegen MKS Bitte denkt an all die wichtigen Hygienemaßnahmen, um eine weitere Ausbreitung von MKS zu verhindern. Kommt mit frisch gewaschenen Klamotten, nicht mit Gummistiefeln oder Autos vom Hof und steckt nach der Rückkehr eure Kleidung als allererstes in die Waschmaschine bei 60 Grad. Wir besprechen gerade noch, ob es Desinfektionsschleusen auf der Demo geben wird und wie das vor Ort organisiert werden kann. Anreise Ohne Trecker zur Wir haben es satt!-Demo - zum Glück gibt es ja noch andere Wege für die Anreise aus Brandenburg und dem Bundesgebiet. Da der Weg nach Berlin weit sein kann, schlagen wir euch vor, Fahrgemeinschaften zu gründen, mit dem Zug oder Auto. Eine gute Anlaufstelle ist die Mitfahrzentrale, vielleicht findet sich ja sogar ein Bus in eurer Region? Bitte lasst uns wissen, wenn euer Zugticket aufgrund der Kurzfristigkeit sehr teuer ist oder ihr eine weitere Anfahrt mit dem Auto habt. Nach Möglichkeit unterstützen wir euch finanziell."
