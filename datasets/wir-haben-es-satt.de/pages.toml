title = "Berlin, 16.01.2021 - Wir haben es satt!"
full_description = 'Pressemitteilung "Wir haben es satt!"-Protest: Bauern-, tier- und umweltfeindliche Agrarpolitik im Wahljahr abwählen! Agrarwende-Bündnis fordert in Berlin zukunftsfähige Agrarpolitik / „Aktion Fußabdruck“ – 10.000 Menschen stimmen mit den Füßen für Höfe, Tiere und Umwelt ab Berlin, 16.01.21. Mit ihren Fußabdrücken fordern rund zehntausend Menschen heute in Berlin die Agrarwende. Zum Auftakt des Superwahljahres trägt das „Wir haben es satt!“-Bündnis ein Meer aus Fußabdrücken vor das Kanzler*innenamt. So demonstriert die Agrarwende-Bewegung pandemiekonform für eine Politik, die Höfen, Tieren und der Umwelt eine Zukunft gibt. „Agrarindustrie abwählen – Agrarwende lostreten!“ lautet die Botschaft vor dem Amtssitz von Kanzlerin Merkel. Saskia Richartz, „Wir haben es satt!“-Sprecherin, sagt im Namen der 60 Bündnis-Organisationen: „Billiges Essen ist eine Sackgasse, die weder die Landwirtschaft noch die Verbraucher*innen weiterbringt. Julia Klöckner versagt als Agrarministerin und macht eine Politik auf Kosten von Höfen, Tieren und Umwelt. Die CDU gehört nach 15 Jahren miserabler Agrarpolitik abgewählt. Wir fordern: Höfesterben stoppen, Umbau der Tierhaltung fördern, Pestizidausstieg vorantreiben und ein klares Nein zur Gentechnik und zum EU-Mercosur-Abkommen.“ Statt für eine bäuerliche und ökologischere Landwirtschaft auf die Straße zu gehen, beteiligten sich in diesem Jahr rund 10.000 Menschen – kreativ und ausdrucksstark – von zu Hause aus: Sie schickten unzählige Fuß- und Stiefelabdrücke sowie Treckerspuren mit Forderungen nach Berlin. „Insekten retten“, „kleinbäuerliche Strukturen statt Agrarsteppen“, „lieber Gülle am Schuh als CDU“ oder „Bewegungsfreiheit auch für Schweine“ ist im Regierungsviertel zu lesen. Besonders eindrucksvoll: Eine Familie aus Hamburg hat Agrarwende-Botschaften von vier Generationen – von drei bis 93 Jahre – eingesandt. Schon am Vormittag hatte eine Delegation von Bäuerinnen und Bauern aus Berlin und dem Umland vor der CDU-Zentrale ihrem Ärger über 15 Jahre verfehlte Unions-Agrarpolitik bei einer Protestkundgebung Luft gemacht. Sandra Finke-Neuendorf, Bäuerin aus Blankenfelde bei Berlin, die im Traktor-Konvoi mitfuhr, sagt: „Dumpingpreise, Klimakrise und Artensterben zwingen uns alle zu Veränderungen. Wir Bäuerinnen und Bauern sind bereit, unseren Beitrag zu leisten. Von Ministerin Klöckner erwarten wir endlich die notwendigen Rahmenbedingungen. Gerechte Erzeugerpreise und ein ernsthafter Systemwechsel in der Agrarpolitik sind unabdingbar." Hintergrund: Konventionell und ökologisch wirtschaftende Bäuer*innen kämpfen im „Wir haben es satt!“-Bündnis im Schulterschluss mit der Gesellschaft gegen die fatalen Auswirkungen der intensiven industriellen Landwirtschaft. Gemeinsam zeigt das Bündnis Wege für eine bäuerliche Landwirtschaft auf, die mit mehr Umwelt-, Tier- und Klimaschutz auch auf breite Zustimmung in der Bevölkerung stößt und den Bauernhöfen wirtschaftliche Perspektiven bietet. www.wir-haben-es-satt.de Fotos vom Protest ab ca. 13 Uhr in druckbarer Qualität weiter unten.http://www.wir-haben-es-satt.de/presse Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Tel.: 030-28482438, Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Statements von Redner*innen Gottfried Erves, Bio-Bauer und bundespolitischer Sprecher von Biokreis: "Wir stehen an einem Wendepunkt: Die Politik muss jetzt die richtigen Weichen stellen, damit wir Bäuerinnen und Bauern uns um Klimaschutz, Artenvielfalt und gesunde Böden kümmern können. Denn eines ist klar: Die Landwirtschaft der Zukunft muss nachhaltig sein!" Lena Bassermann von INKOTA: „Wir brauchen endlich gerechte, gesunde und nachhaltige Ernährungssysteme – und zwar weltweit. Deshalb fordern wir: Giftexporte stoppen. Wenn ein Pestizidwirkstoff in Europa verboten ist, weil er Menschen oder Umwelt schadet, warum sollte er dann exportiert werden dürfen? Wir brauchen ein Ende von Doppelstandards in der Pestizidvermarktung und ein konsequentes Verbot für den Export.“ Elisabeth Fresen, Mutterkuhhalterin und Bundesvorsitzende der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL): „Wir tragen heute auch die Proteste für faire Erzeuger*innenpreise der vergangenen Wochen nach Berlin. Bäuerinnen und Bauern fordern gemeinsam mit der Gesellschaft von Frau Klöckner eine andere Agrarpolitik. Es braucht ein Marktkriseninstrument für faire Preise, einen qualifizierten Welthandel, gemeinwohlorientierte Agrarzahlungen und Zugang zu Land für Existenzgründer*innen.“ Cengiz Jiménez Laux von Yeşil Çember: „Wie kann es sein, dass Profit wichtiger ist als die Gesundheit von Menschen? Wir benötigen dringend eine Vorgabe zur Gesamtmenge von Pestizidrückständen, die auf unseren Lebensmitteln vorhanden sein dürfen. Lasst uns 2021 gemeinsam die profitorientierte Agrarindustrie abwählen.“ Jörg-Andreas Krüger, Präsident des Naturschutzbund Deutschland (NABU): „Auch im vergangenen Jahr gab es keine Richtungsänderung in der Landwirtschaft, weil die GAP-Reform auf europäischer Ebene gescheitert ist. Deutschland muss nun bei der nationalen Ausgestaltung der EU-Agrarpolitik mehr Raum für Natur und Artenvielfalt schaffen und dafür sorgen, dass Landwirt*innen angemessen für ökologische Leistungen bezahlt werden.“ Olaf Bandt, Vorsitzender des Bund für Umwelt und Naturschutz Deutschland (BUND): „Niedrige Preise machen es den Bäuerinnen und Bauern schwer, auf die gesellschaftlichen Forderungen nach mehr Umweltschutz und Tierwohl zu reagieren. Frau Klöckner muss politisch umsteuern und die Ergebnisse des Kompetenznetzwerks Nutztierhaltung umsetzen. Nur so kann eine artgerechte Tierhaltung eine verlässliche finanzielle Grundlage bekommen.“ Reinhild Benning von der Deutschen Umwelthilfe (DUH): „Antibiotikaresistenzen auf jedem 2. Hähnchen von Geflügelkonzernen wie Wiesenhof stellen ein massives Gesundheitsrisiko dar. Wählbar ist nur, wer der Gesundheit von Mensch und Tier per Gesetz Vorrang gibt vor Konzerninteressen.“ Thomas Schröder, Präsident Deutscher Tierschutzbund: „Unser Kampf gegen ein tierfeindliches System geht weiter – trotz Corona. Wir werden das Superwahljahr dafür nutzen, um klarzustellen: Nur die, die mit uns gemeinsam einen Systemwechsel in der Agrarwirtschaft fordern, sollen auch in die Parlamente einziehen. Ein „Weiter so“ kann und darf es nicht geben.“ Anke Kähler, Bäckermeisterin und Vorstand Die Freien Bäcker: „Mit der Aktion BODEN-BROT treten wir gezielt dem Verlust von Boden und Bodenfruchtbarkeit entgegen. Land und Boden gehören in die Hände von Bäuerinnen und Bauern, damit sie Humus aufbauend ackern können. Nur wenn sie dafür fair entlohnt werden, können wir – mit Biodiversität in und auf dem Boden – für Vielfalt im Brotregal sorgen.“ Rüdiger Jürgensen, Geschäftsführer VIER PFOTEN Deutschland: „Die derzeitige Agrarpolitik führt in die Sackgasse. Leidtragende sind die Tiere, die Umwelt, aber auch bäuerliche Betriebe. Leichte Kurskorrekturen reichen nicht mehr. Nötig ist eine Tierschutz- und Agrarwende: Weniger Tiere, jedem Tier ein artgemäßes Leben und Schluss mit dem verheerenden Fokus auf Export.“ Johann Lütke Schwienhorst, Imker und Agrarreferent der Aurelia Stiftung: „Im Fall der Zulassungen von Neonicotinoiden wägt Ministerin Klöckner wieder einmal völlig einseitig wirtschaftliche Interessen der Agrarindustrie gegen den dringend notwendigen Schutz der Bienen und Biodiversität und die Interessen der Imker*innen ab. Wer der Biene derart schadet, gehört abgewählt!“ Jan Göldner von der Naturschutzjugend (NAJU): "Wir, die Jugendverbände, die ein gemeinsames Zukunftsbild der Landwirtschaft entworfen haben, fordern eine Umkehr zu einer Gemeinwohl-orientierten Wirtschaftsweise, welche sogleich das Wohl und die Bedürfnisse der Erzeuger*innen ebenso wie der Verbraucher*innen berücksichtigt." Fotos zur kostenfreien Nutzung Fotos vom "Wir haben es satt!"-Protest am 16.1.21 zur kostenfreien Nutzung gegen Angabe der Quelle. Zum Download bitte auf das Bild klicken. Quelle: Nick Jaussi/www.wir-haben-es-satt.de Pressemitteilung'
