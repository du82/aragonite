title = "Berlin, 15.01.2020 - Wir haben es satt!"
full_description = "Pressemitteilung „Klebriger Protest“ – Imker verschütten Honig am Agrarministerium und fordern konsequenten Insektenschutz Berlin, 15.01.2020 | Wenige Tage vor der „Wir haben es satt!“-Großdemonstration hat ein Brandenburger Imkerpaar heute Vormittag über einhundert Eimer mit Honig vor dem Bundeslandwirtschaftsministerium in Berlin abgeladen. Die insgesamt rund vier Tonnen Honig von Sebastian und Camille Seusing sind ein Fall für den Müll. Wegen zu hoher Belastung mit Glyphosat – es wurde eine bis zu 152-fache Überschreitung des erlaubten Grenzwerts gemessen – darf der Honig nicht verkauft werden. Der Gegenwert des Schadens beträgt rund 60.000 Euro. Die eigentlich erfolgreiche Imkerei steht dadurch jetzt vor dem Aus. Aus Protest gegen die Agrarpolitik der Bundesregierung, die weiterhin zulässt, dass Glyphosat auf blühende Pflanzen gespritzt wird, verschütteten die Imker*innen mehrere Eimer Honig vor dem Eingang des Ministeriums. Auf eine Stellungnahme der Agrarministerin Klöckner (CDU) hatte das Imkerpaar seit Mitte Mai ohne Antwort gewartet. Erst kurz vor Beginn der Grünen Woche meldete sich das Ministerium zurück und Klöckner ließ sich bei der geplanten persönlichen Übergabe durch einen Mitarbeiter des Ministeriums vertreten. Der betroffene Imker Sebastian Seusing sagt: „Wir sind wütend! Die Aktion heute ist ein unmissverständliches Signal an Julia Klöckner und die Bundesregierung: Wir Imkerinnen und Imker nehmen es nicht mehr hin, dass im Agrarministerium die Interessen von Bayer und BASF wichtiger sind, als der Schutz der Insekten und der Erhalt unserer Familienbetriebe. Ich muss rund ein Drittel meiner Jahresernte entsorgen lassen, weil Julia Klöckner nichts dagegen unternimmt, dass Glyphosat auf blühende Pflanzen gespritzt wird. Ich habe diese insektenfeindliche Agrarpolitik satt!“Annette Seehaus-Arnold, Vize-Präsidentin des Deutschen Berufs und Erwerbsimkerbundes, sagt: „Julia Klöckner hat mit großen Worten angekündigt, was der Biene schadet, komme vom Markt. Ihren markigen Worten hat sie bislang keine belastbaren Taten folgen lassen. 2019 sind die Zulassungen von über 100 Pestiziden verlängert worden, weil das Ministerium die Prüffristen nicht eingehalten hat. Als Vertreter der erwerbsorientierten Imkerinnen und Imker fordern wir eine verbindliche Pestizid-Reduktion und einen konkreten Pestizid-Ausstiegs-Plan, sowie einen verlässlich funktionierenden Bienenschutz. Dafür gehen wir am Samstag bei der großen ‚Wir haben es satt!‘-Demo mit Bäuerinnen, Bauern und der Gesellschaft auf die Straße.“Thomas Radetzki, Vorstand der Aurelia Stiftung, erklärt: „Die Pestizid-Politik der Bundesregierung gefährdet nicht nur die Gesundheit der Bienenvölker, sondern führt immer wieder auch zu hohen Belastungen von Honig und anderen Lebensmitteln. Bienen ernähren sich ausschließlich vom Nektar und Pollen blühender Pflanzen. Als ‚Anwältin der Bienen‘ fordert die Aurelia Stiftung schon seit Jahren ein Anwendungsverbot von Glyphosat in blühenden Pflanzenbeständen. Deswegen unterstützen wir die Imkerei Seusing jetzt auch bei ihrer Schadenersatz-Klage und fordern einen gesetzlichen Schutzanspruch für Bienen und Imkereien vor Pestizidbelastungen.“ Aufgerufen zu der Protest-Aktion hat das „Bündnis zum Schutz der Bienen“, das von der Aurelia Stiftung organisiert wird und zu dem auch der Europäische Berufsimkerverband und der Deutsche Berufs- und Erwerbsimkerbund gehören. Die Organisationen sind auch Teil des Trägerkreises der „Wir haben es satt!“-Demonstration, bei der am 18. Januar um 12 Uhr in Berlin wieder Zehntausende für insektenfreundliche Landschaften und gesundes Essen auf die Straße gehen werden. Alle Hintergründe zu dem Fall: www.aurelia-stiftung.de/glyphosat-im-honig Terminhinweise:Samstag, 18.01.20, ab 12 Uhr: Gemeinsamer Bienen- und Imker-Block auf der Großdemonstration „Wir haben es satt!“. Ort: Brandenburger Tor, Platz des 18. März, 10117 Berlin.Samstag, 18.01.20, ca. 12.20 Uhr: Imker Sebastian Seusing spricht auf der Auftaktkundgebung der „Wir haben es satt!“-Demonstration am Brandenburger Tor.Ansprechpartner:Florian Amrhein (Aurelia Stiftung – Leitung Öffentlichkeitsarbeit) Telefon: +49 (0)30 577 00 39 66 / Mobil: +49 (0)176 34 51 52 07 E-Mail: florian.amrhein[at]aurelia-stiftung[dot]deChristian Rollmann („Wir haben es satt!“-Pressesprecher) Telefon: 030 28482438 / Mobil: 0151 51 24 57 95 E-Mail: presse[at]meine-landwirtschaft[dot]de Fotos zur kostenfreien Nutzung Auf dem Bild ist Sebastian Seusing, der betroffene Imker vor dem Bundeslandwirtschaftsministerium zu sehen. Zum Download bitte auf das Bild klicken. Quellenangabe: Fabian Melber/www.wir-haben-es-satt.de Pressemitteilung"
