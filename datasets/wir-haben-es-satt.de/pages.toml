title = "Koblenz/Brüssel, 01.09.2020 - Wir haben es satt!"
full_description = 'Pressemitteilung „Eure Agrarpolitik ist ein einziger Scherbenhaufen“ Zukunftsfähige Landwirtschaft braucht eine radikale Wende in der Agrarpolitik Koblenz, 01.09.2020. Aus Protest gegen die fehlgeleitete EU-Agrarpolitik kippten Demonstrant*innen heute einen gewaltigen Scherbenhaufen vor die Tore des EU-Agrargipfels. Während Julia Klöckner mit ihren EU-Amtskolleg*innen in der Koblenzer Rhein-Mosel-Halle über die Zukunft der Landwirtschaft diskutierte, drückte das „Wir haben es satt!“-Bündnis seine Ablehnung zur bauernfeindlichen und industriehörigen Agrarpolitik aus: 1500 Weinflaschen zerbrachen bei der Aktion – ein Sinnbild für die kaputte gemeinsame Agrarpolitik der EU (GAP). Höfesterben, Tierfabriken, Umweltprobleme – die Politik schaut sich die Krisen in der Landwirtschaft seit Jahren tatenlos an und sorgt mit fehlgeleiteten Subventionen sogar noch für ihre Verschärfung. Eine radikale Wende in der Agrarpolitik – hin zu mehr bäuerlicher und ökologischer Politik – ist unumgänglich. Saskia Richartz, Sprecherin des „Wir haben es satt!“-Bündnisses, sagte: "Julia Klöckner und ihre Kolleg*innen haben einen Scherbenhaufen in der Agrarpolitik angerichtet. Sie klammern sich an ein System, das Steuergelder im großen Stil an Superreiche, Tierfabriken und Agrarsteppen verteilt. Mit ein bisschen Nachjustieren ist es nicht getan." Christian Rehmer, Leiter für Agrarpolitik beim Bund für Umwelt und Naturschutz (BUND), sagte: „Ministerin Klöckner kann sich jetzt nur noch mit grundsätzlich neuen Ansätzen für mehr Umwelt-, Klima- und Tierschutz retten. Wenn sie jetzt nicht liefert, lässt sie die Bäuerinnen und Bauern komplett bei den notwendigen Umstrukturierungen allein.“ Georg Janßen, Bundesgeschäftsführer der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL), sagte: „Wir müssen das Höfesterben stoppen. Die Agrarpolitik muss sicherstellen, dass artgerechte Tierhaltung und Klimaschutz deutlich gefördert werden. Die Agrar-Subventionen müssen den Umbau der Landwirtschaft in Europa sozial und umweltgerecht gestalten. Die versammelten Minister*innen dürfen die notwendigen Veränderungen jetzt nicht auf Kosten der nächsten Generationen verschleppen.“ Schon am Sonntag demonstrierten zum Auftakt des EU-Agrargipfels mehr als 1000 Menschen in Koblenz unter dem Motto: „Agrarwende anpacken – Steuergeld nur noch für zukunftsfähige Landwirtschaft!“ Im „Wir haben es satt!“-Bündnis sind Bäuer*innen – konventionell wie bio – mit Organisationen aus dem Rest der Gesellschaft zusammengeschlossen. Gemeinsam setzt sich das Bündnis für eine Landwirtschaft ein, in der die Tiere artgerecht gehalten werden, Umwelt und Klima geschützt wird und die Bäuer*innen faire Preise für ihre Produkte erhalten. Weitere Infos: www.wir-haben-es-satt.de Für Rückfragen: Saskia Richartz, “Wir haben es satt!“-Bündnis, Mobil: 0177 890 50 54, E-Mail: richartz[at]meine-landwirtschaft[dot]de Christian Rehmer, Bund für Umwelt und Naturschutz Deutschland (BUND), Mobil: 0174 39 32 100, E-Mail: christian.rehmer[at]bund[dot]net Georg Janßen, Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL), Mobil: 0170 496 46 84, E-Mail: janssen[at]abl-ev[dot]de Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Mobil: 0151-512 45 795 E-Mail: presse[at]meine-landwirtschaft[dot]de Fotos zur kostenfreien Nutzung Fotos zur kostenfreien Nutzung gegen Angabe der Quelle "Bernd Hartung/www.wir-haben-es-satt.de". Zum Download bitte auf das Bild klicken. Pressemitteilung'
