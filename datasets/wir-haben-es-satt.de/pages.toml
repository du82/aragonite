["https://wir-haben-es-satt.de/presse-archiv/berlin-170118"]
title = "Berlin, 17.01.18 - Wir haben es satt!"
full_description = "Pressemitteilung „Nie wieder Schmidt!“: Zukunftsfähige Agrar- und Ernährungspolitik erfordert Neubesetzung des Landwirtschaftsministeriums Berlin, 17.01.18. Parallel zur Eröffnungs-Pressekonferenz der weltgrößten Agrarmesse Grüne Woche und wenige Tage vor der „Wir haben es satt!“-Demonstration am 20. Januar fand heute im Berliner Re­gierungsviertel die erste öffentliche Probe des Kochtopf-Konzerts für die Agrarwende statt. Bauern, Im­ker und engagierte Bürger stimmten sich mit Kochtöpfen und Kochlöffeln vor dem Bundeskanzleramt für die Großdemonstration am Samstag ein. Dabei sangen sie ein Abschiedslied auf Christian Schmidt. Ad­ressaten des Schmähgesangs: 20 Personen, die Masken mit dem Konterfei des Bundeslandwirtschafts­ministers trugen. Um den Hals trugen sie Schilder, auf denen „Glyphosat“, „Megaställe“, „Höfesterben“ und andere Verfehlungen des Ankündigungsministers zu lesen waren. Für die Demonstranten verkörpert der CSU-Landwirtschaftsminister vier Jahre des Stillstands – ange­sichts der drängenden Probleme in der Landwirtschaft ein unhaltbarer Zustand. Ungebremstes Hö­festerben, ruinöse Exportorientierung, Antibiotika-Resistenzen, Artenschwund und immer größere Tier­fabriken – bei all dem hat der „Ankündigungs-Minister“ nichts unternommen. Ganz anders beim Thema Glyphosat, dessen Neuzulassung der CSU-Mann gegen den Willen von mehr als zwei Dritteln der Be­völkerung verfügt hat. Das Ackergift, das einst für die Rohrreinigung patentiert wurde, wird heute in der intensiven industriellen Landwirtschaft flächendeckend zur Unkrautbekämpfung eingesetzt. Wir haben es satt!-Sprecher Jochen Fritz sagte:„Herr Schmidt hat sich vier Jahre lang den Herausforderungen im Landwirtschafts- und Ernährungsbe­reich nicht gestellt, einzig bei der Glyphosat-Neuzulassung ist er aktiv geworden. Alljährlich kündigt er neue Projekte an und lässt dem keine Taten folgen. Damit muss jetzt endlich Schluss sein! Wir fordern von der nächsten Bundesregierung: Nehmen Sie Landwirtschaft und Ernährung ernst und beenden Sie diese Fehlbesetzung. Die Zukunft von Bauernhöfen, Umwelt und Tieren ist zu wichtig, um sie Dampf­plauderern wie Christian Schmidt zu überlassen.“ Fritz lud alle Menschen ein, die sich für zukunftsfähige Landwirtschaft und gutes Essen einsetzen, sich mit einem Kochtopf an der Demonstration am 20. Januar zu beteiligen. Bauern aus ganz Deutschland werden zum mittlerweile achten Mal im Schulterschluss mit der Zivilgesellschaft für eine bessere Agrar­politik auf die Straße gehen. Zentrale Themen des Protestmarschs, der um 11 Uhr am Berliner Haupt­bahnhof startet, sind neben dem Glyphosat-Verbot auf Bundesebene, der Umbau der Ställe hin zu art­gerechter Haltung und ein Ende der Exportorientierung in der Landwirtschaft, die Bauernhöfe auf der ganzen Welt in den Ruin treibt. Fotos von der Aktion in druckfähiger Auflösung zur kostenfreien Nutzung finden Sie ab 11.30 Uhr unter: www.wir-haben-es-satt.de/presse Hintergrund: Die „Wir haben Agrarindustrie satt!“-Demonstration wird von Tausenden Bäuerinnen und Bauern – kon­ventionell und bio – getragen, von denen sich dieser Tage viele mit Traktoren aus dem gesamten Bun­desgebiet auf den Weg nach Berlin machen. Zusammen mit rund 100 Organisationen aus der Zivilge­sellschaft treten sie für eine Landwirtschaft und Lebensmittelpolitik ein, in der Bauern und Lebensmittel­handwerker fair entlohnt werden und sich alle Menschen gesund ernähren können. Die Demonstration zieht in diesem Jahr zur internationalen Agrarministerkonferenz, wo die versammelten Agrarminister der Welt aufgefordert werden, mehr Tempo bei der Agrarwende zuzulegen. Weitere Infos: www.wir-haben-es-satt.de Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Presseansprechpartner, Mobil: 0151-51245795, E-Mail: rollmann@meine-landwirtschaft.de Pressemitteilung"
