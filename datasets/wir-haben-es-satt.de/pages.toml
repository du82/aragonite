title = "Berlin, 20.01.2024 - Wir haben es satt!"
full_description = "Pressemitteilung 20. Januar 2024 PDF-VERSION FOTOS PDF-VERSION Pressemitteilung 20. Januar 2024 „Gutes Essen hat aktuell keine Zukunft“ – 8.000 fordern ein sofortiges Ende des agrarpolitischen Stillstands Ein breites Bündnis aus Landwirtschaft und Zivilgesellschaft geht für Höfe und Klima und gegen Gifte, Gentechnik und Patente auf die Straße Berlin, 20. Januar 2024: 8.000 Menschen finden sich vor dem Willy-Brandt-Haus in Berlin ein und fordern lautstark die Abkehr von einer Agrarpolitik, die Bäuer*innen und Gesellschaft gleichermaßen im Stich lässt und den sozialen Frieden gefährdet. Klimaextreme und Kostensteigerungen bringen Landwirtschaft und Gesellschaft in Not. Kennzeichnung und Risikoprüfung bei der Gentechnik sollen abgeschafft werden, obwohl die überwiegende Mehrheit der Bevölkerung dies ablehnt. Die Protestierenden haben es satt. Sie fordern einen klaren Fahrplan für eine zukunftsfähige Landwirtschaft und ein krisenfestes Ernährungssystem. Stadt und Land, Produzent*innen und Konsument*innen setzen sich gemeinsam und solidarisch für die ökologische und sozial-gerechte Agrarwende ein, für Klima-, Tier- und Artenschutz sowie weltweite Ernährungssicherheit. „Die richtige Antwort auf Klimakrise, Artensterben und Hunger in der Welt ist eine bäuerliche und ökologischere Landwirtschaft“ sagt Inka Lange, Sprecherin des „Wir haben es satt!“-Bündnisses, das bereits zum 14. Mal zum Protest aufgerufen hat. Neben Organisationen aus den Bereichen Umwelt- und Tierschutz, Ernährung, Menschenrechte und Entwicklungszusammenarbeit gehören auch 35.000 Bäuer*innen dem Bündnis an. Sie benötigen für die Transformation zur umwelt- und tiergerechten Landwirtschaft sichere politische Rahmenbedingungen. Doch auch das grün geführte Landwirtschaftsministerium hat notwendige Maßnahmen trotz vollmundiger Absichtsbekundungen und vorliegender Lösungsvorschläge weitere zwei Jahre verschleppt. „Alle Fragen wurden längst ausreichend beantwortet – wir fordern Taten! Faire Erzeuger*innenpreise und die Unterstützung der Höfe beim Umbau der Tierhaltung, etwa durch eine Tierwohlabgabe, müssen jetzt kommen“ so Lange. „Außerdem muss sich die Bundesregierung in Europa dafür einsetzen, dass Milliarden an Agrarsubventionen endlich den Umwelt-, Tier- und Klimaschutz in der EU honorieren, statt öffentliche Gelder blind pro Fläche Hektar auszuschütten und damit vor allem die Agrarindustrie zu füttern. Die Zukunft der Landwirtschaft muss sofort zur Chefsache in der Ampelkoalition werden.“ Entsprechende Forderungen und die bäuerliche Protestnote übergaben Bäuer*innen, Menschenrechts- und Entwicklungsorganisationen am Vormittag Bundeslandwirtschaftsminister Cem Özdemir. Mit rund 50 Traktoren waren die Teilnehmer*innen der Kundgebung „Bäuerliche Rechte weltweit stärken“ am frühen Morgen aus dem Berliner Umland zum Global Forum for Food and Agriculture gefahren. Dort sprachen sie mit dem Minister zeitgleich zu seiner Konferenz mit rund 70 internationalen Agrarminister*innen und wiesen ihn auf die Notwendigkeit eines solidarischen, raschen Handelns hin. Am Willy-Brandt-Haus vereinte sich die Traktordemo schließlich mit den „Wir haben es satt!“-Demonstrierenden, darunter ein Block mit Bäuer*innen, die ohne Traktoren aus ganz Deutschland angereist waren. In Berlin adressieren sie neben der Ampelregierung auch das Europäische Parlament. Die im Februar drohende Abschaffung des strengen EU-Gentechnikrechts sorgt für Unmut auf den Höfen und bei den Verbraucher*innen. Milana Müller, Landwirtin aus dem Ost-Erzgebirge, und Benny Haerlin von Save our Seeds dazu: „Der Gipfel des umwelt- und agrarpolitischen roll back aus Brüssel: Die EU-Kommission will künftig Gentechnikpflanzen ohne Risikoprüfung und Kennzeichnung zulassen. Niemand weiß mehr, wo es drin ist, keiner kann es mehr vermeiden. Die Risiken steigen, keiner haftet. Aber Bayer und Syngenta können unser Saatgut patentieren. Das lassen wir uns nicht gefallen!“ Die Demonstrierenden erwarten von der Bundesregierung, sich dem Durchmarsch der Gentechnik- und Pestizidindustrie in den Weg zu stellen. Passend dazu skandiert der Demozug „Gentechnik – wir haben es satt!“. Auf dem Weg von der SPD-Parteizentrale vorbei an Finanz- und Landwirtschaftsministerium zum Bundeskanzleramt, wo die Abschlusskundgebung stattfindet, hört man noch den Ruf: „Özdemir verbau's nicht! Agrarreformen! Trau dich!“ Statements von Redner*innen Martin Schulz, Bundesvorsitzender Arbeitsgemeinschaft bäuerliche Landwirtschaft e. V. „Die Proteste der Landwirte in den letzten Wochen haben gezeigt, dass es Ihnen um mehr geht als nur um die Kürzung beim Agrardiesel, auch wenn die Kürzungen für alle Betriebe sofort einkommenswirksam sind. Gleichwohl geht es den vielen Bäuerinnen und Bauern auch darum, wieder eine wirtschaftliche Perspektive und Planungssicherheit zu bekommen. Die Ampelregierung muss den Unmut von Bäuerinnen und Bauern im ganzen Land endlich ernst nehmen und die Ergebnisse der Borchert-Kommission und der Zukunftskommission Landwirtschaft umsetzen. Ferner muss sie die Landwirtschaft in die Lage versetzen, endlich auf Augenhöhe mit der abnehmenden Hand Preise zu verhandeln, muss die Agrargelder endlich sozial gerecht verteilen und muss sich gegen die Deregulierung der neuen Gentechniken einsetzen.“ Luisa Neubauer, Fridays for Future Deutschland „Es gibt keine Transformation ohne Investition. Die Landwirtschaft in Deutschland steht vor ihrer umfassendsten Ökologisierung jemals. Dafür braucht es echte Unterstützung. Sonst können wir uns die Klimaziele an den Nagel hängen.“ Martin Kaiser, Geschäftsführender Vorstand Greenpeace „Weil die Bundesregierung auf drängende soziale Fragen keine ehrlichen Antworten hat, fühlen sich viele Menschen ungerecht behandelt. Die Koalition muss mit einer sozial gerechten Agrarpolitik endlich dafür sorgen, dass Bäuerinnen und Bauern angemessen honoriert werden, wenn sie Artenvielfalt und Klima schützen und das Tierwohl verbessern. Und sie muss sicherstellen, dass alle Menschen Zugang zu gesunden und ökologisch erzeugten Lebensmitteln haben.“ Bezz Cruzada, Coordinator Asian People’s Exchange for Food Sovereignty and Agroecology „Saving, using, exchanging, improving our own seeds matter – for farmers, for humanity, and for the planet. Farmers who rely on commercial seeds also rely on commercial chemicals, and being tied to debt and usury for resource-poor farmers. Those who use GM seeds pay more, risk more and lose their lands and livelihoods in the process. Let us save our seeds and assert farmers’ rights to seeds! No to corporate control in our food systems!“ Jörg-Andreas Krüger, Präsident NABU (Naturschutzbund Deutschland) e.V. „Wir haben es satt, dass die Politik statt Lösungen nur mehr Probleme schafft! Die selbst ernannte Fortschrittskoalition ist bestenfalls eine Stillstandskoalition. Statt um Ver-besserungen für die Landwirtschaft, für Natur und Klima geht es nur um Streitereien. Die Ampel sollte Zukunft endlich ernst nehmen und wegweisenden Maßnahmen wie der Tierwohlabgabe grünes Licht geben!“ Mirjam Strotdrees, Junges Bioland eV „Viele Bio-Junglandwirt*innen bangen um ihre Zukunft in der Landwirtschaft. Allein letztes Jahr mussten 4.400 Höfe in Deutschland aufgeben. Das muss gestoppt werden! Lebensmittel bekommen nicht den Preis, den sie verdienen. Neue Gentechnik schafft Intransparenz und eine Abhängigkeit von der chemischen Industrie. Patente auf Leben darf es nicht geben!“ Janina Hielscher und Theo Lentzen, Slow Food Youth „Die weltweite Ernährungskrise verschärft sich durch multiple Krisen. Slow Food Youth fordert Ernährungsgerechtigkeit für alle, unabhängig von Klasse, kulturellem Hintergrund, Alter oder Geschlecht. Die ökologische und sozial gerechte Ernährungswende darf nicht aus wirtschaftlichen Gründen ausgebremst werden. Wir müssen komplexe Lebensrealitäten, wie die von alleinerziehenden Müttern, ernst nehmen, um die Ernährungswende fair und inklusiv zu gestalten.“ Maria Michaelys und Moritz Tapp, BUNDjugend „Statt anzuerkennen, dass in unserem Land einige Wenige riesige Profite auch mit unseren Lebensmitteln einfahren, deren Vermögen er als Bundesfinanzminister heranziehen könnte, um den Umbau der Landwirtschaft und die krisenfeste, klima- und sozialgerechte Transformation unseres Landes zu finanzieren, entscheidet Christian Lindner sich dafür, Arm gegen noch Ärmer auszuspielen.“ Rüdiger Jürgensen, Geschäftsführer VIER PFOTEN – Stiftung für Tierschutz in Deutschland „Jahrzehnte verfehlter Agrarpolitik torpedieren eine nachhaltige Landwirtschaft. Hier reiht sich auch die aktuelle Regierung ein. Darunter leiden besonders die Tiere, die Umwelt und die Kleinbetriebe in der Landwirtschaft. Zwar wird das Tierschutzgesetz gerade überarbeitet, um die Tiere zukünftig besser zu schützen. Doch statt dabei Tempo zu machen und quälerische Praktiken wie Anbindehaltung oder Schwanzkupieren endlich zu beenden, erleben wir Blockierer in der Regierung, die eine Veröffentlichung des Gesetzentwurfs bis heute verhindern. An diese gerichtet fordern wir: Statt sich bei der politischen Verantwortung vom Acker zu machen, muss jetzt endlich gehandelt werden.“ Weitere Informationen Demonstration | www.wir-haben-es-satt.de Presse-Ressourcen | www.wir-haben-es-satt.de/presse Fotos Am Demo-Tag stellen wir sukzessive Fotos zur kostenfreien Verwendung zur Verfügung: „Wir haben es satt!“-Demonstration 2024 https://flic.kr/s/aHBqjBaGaS „Bäuerliche Rechte weltweit stärken“ und Traktoren-Konvoi https://flic.kr/s/aHBqjBb6HL Video „Wir haben es satt!“-Demonstration Livestream https://www.youtube.com/live/naJo9O65jQw Nicola Puell Presse- und Öffentlichkeitsarbeit Tel.: (030) 28482438 Mobil: (0151) 51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung 20. Januar 2024 PDF-VERSION FOTOS PDF-VERSION"
