title = "Demo 2014 - Wir haben es satt!"
full_description = '''Pressespiegel Fernsehen ARD Tagesschau 20 Uhr ARD Tagesthemen (ab Minute 3:19) BR Rundschau N24 NDR n-tv RBB Abendschau RBB Aktuell (ab Minute 7:29) RBB Online (Artikel + Fotogalerie) RTL News Aktuell Sat 1 Online ZDF Heute (ab Minute 4:05) ZDF Heute (Bericht) Radio Antenne Bayern Deutsche Welle Deutschlandfunk BR Bayern 2 BR B5 aktuell BR B5 aktuell Rundschau Radio Dreyeckland Zeitung Berliner Morgenpost (1) Berliner Morgenpost (2) Berliner Zeitung Cellesche Zeitung Die Welt Deutsche Wirtschafts Nachrichten Der Westen Düsseldorfer Abendblatt Finanznachrichten.de Focus Online Frankfurter Rundschau Online Freie Presse Handelsblatt Hannoversche Allgemeine Zeitung Hannover Zeitung Humanistischer Pressedienst Junge Welt Kieler Nachrichten Märkische Oderzeitung Neues Deutschland (1), 19.1.2014 Neues Deutschland (2), 20.1.2014 Neue Osnabrücker Zeitung Neue Presse (1), 18.1.2014 Neue Presse (2), 19.1.2014 Schwäbische Zeitung SHZ.de (1) SHZ.de (2) Spiegel Online Stern.de Stuttgarter Zeitung Süddeutsche.de Südwest Presse RP Online RP Online (Bildergalerie) Ruhr Nachrichten Tagesspiegel (Bildergalerie) taz - Die Tageszeitung (1) taz - Die Tageszeitung (2) topagrar.com Waldeckische Landeszeitung Weser Kurier Wochenblatt für Landwirtschaft & Landleben International Belgien - Le Vif Bulgarien - Fermer.bg Frankreich - Euronews Frankreich - France TV Frankreich - La Liberation Frankreich - L'Echo Republicain Frankreich - Novethic Frankreich - Orange Italien - La Stampa Polen - Onet/Deutsche Welle Schweiz - Finanzen.ch Schweiz - 20min Luxemburg - RTL.lu Russland - Radio Die Stimme Russlands Verschiedene ARC2020.eu (in English) Agri.eu Lokalkompass.de Organic-market.info (in English) Cashkurs.com 4. WIR HABEN ES SATT!-DEMO AM 18. Januar 2014 AUFRUF Wir haben Agrarindustrie satt! Gutes Essen. Gute Landwirtschaft. Für Alle! +++ Mehr als 840 Millionen Menschen hungern weltweit +++ Höfesterben in Deutschland: jedes Jahr schließen 10.000 Betriebe +++ Deutschland importiert Ernährungsgüter im Umfang von über 18 Millionen Hektar +++ 40 Millionen neue Mastplätze für Hühner und 2,5 Millionen Mastplätze für Schweine in Deutschland geplant +++ Antibiotika-Resistenzen aus der Tiermast bedrohen die Gesundheit +++ Freihandelsabkommen zwischen EU und USA könnte Gentechnik die Tür öffnen +++ Drei multinationale Unternehmen kontrollieren weltweit über 50 % des Saatguthandels +++ Jedes Jahr stirbt ein Drittel der Bienenvölker in Europa und in den USA +++ Weltweit sind die Folgen der agrarindustriellen Massenproduktion für Bäuerinnen und Bauern, Verbraucherinnen und Verbraucher, Tiere und Umwelt dramatisch. Die neue Bundesregierung muss jetzt handeln und für eine gerechte und global verantwortliche Agrarpolitik sorgen. Schluss mit der Klientelpolitik für die Agrarindustrie! Dafür braucht es unseren Protest! Am 18. Januar 2014 werden wir für eine bäuerliche und ökologischere Landwirtschaft mit vielen Tausend Menschen in Berlin auf die Straße gehen. Wir fordern: Recht auf Nahrung weltweit!Gesundes und bezahlbares Essen für alle!Faire Preise und Marktregeln für die Bauern!Artgerechte Tierhaltung ohne Antibiotika-Missbrauch!Freiheit für die Saatgutvielfalt! Bienen- und umweltfreundliche Landwirtschaft!Förderung regionaler Futtermittelerzeugung!Zugang zu Land weltweit für alle! Stoppt: den Hunger!die Lebensmittelskandale!das Bauernhöfesterben!die Megaställe!die geplante EU-Saatgutverordnung!die Monokulturen!die Gentechnik auf dem Acker und im Stall!die Landnahme durch Staaten und Investoren! Bürgerinnen und Bürger, Bäuerinnen und Bauern, ImkerInnen und GärtnerInnen, Erwerbslosen- und Eine-Welt-AktivistInnen, seid dabei, wenn wir gemeinsam vor dem Kanzleramt protestieren! Für gutes Essen und gute Landwirtschaft für alle und weltweit! ALLE DEMO-BILDER AUF FLICKR Fronttranspi Traktor Potsdamer Platz Wäscheleine Poster #carousel-backgroundimage-1120-96 { background-image: url('/fileadmin/_processed_/4/0/csm_Fronttranspi_777fb0e902.jpg'); } @media (m