title = "Gutes Essen - Wir haben es satt!"
full_description = 'Hintergrundinfos: Krisengewinne Konzerninteressen gefährden das Recht auf Nahrung Positionspapier 20 Jahre Menschenrecht auf Nahrung Ernährungsgerechtigkeit Ernährungssicherheit Lebensmittelverschwendung Ernährungssouveränität Internationale Fallbeispiele der Verletzungen bäuerlicher Rechte Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Gutes Essen für alle Nur 5 Unternehmen kontrollieren bis zu 90 Prozent des weltweiten Getreidehandels. In den letzten 3 Jahren haben sich die Gewinne der fünf größten Agrarrohstoffhändler im Vergleich zu den Jahren davor verdreifacht – während immer mehr Menschen weltweit keinen Zugang zu ausreichenden, sicheren, ausgewogenen und gesunden Lebensmitteln haben. Rund 733 Millionen Menschen leiden weltweit Hunger – und auch in Deutschland sind rund 3 Millionen Menschen von materieller Ernährungsarmut betroffen. Solange Lebensmittel als beliebige Handelsware und Spekulationsobjekt behandelt werden, wird es wenige Gewinner und viele Verlierer dieses Systems geben. Gesunde und ausgewogene Ernährung für alle ist nicht möglich, solange Politik und Agrarsystem Konzerngewinne priorisieren. Unsere Forderungen: Spekulationsverbot für Lebensmittel Gesunde, umwelt- und sozialgerecht erzeugte Lebensmittel müssen für alle Menschen zugänglich sein Das Menschenrecht auf angemessene Nahrung verwirklichen Ernährungssouveränität weltweit sichern: Menschen sollen selbst bestimmen können, wie ihre Nahrung angebaut und produziert wird – nicht Märkte und Konzerne Hintergrundinfos: Krisengewinne Konzerninteressen gefährden das Recht auf Nahrung Positionspapier 20 Jahre Menschenrecht auf Nahrung Ernährungsgerechtigkeit Ernährungssicherheit Lebensmittelverschwendung Ernährungssouveränität Internationale Fallbeispiele der Verletzungen bäuerlicher Rechte ÜBERSICHT → Hintergrundinfos: Krisengewinne Konzerninteressen gefährden das Recht auf Nahrung Positionspapier 20 Jahre Menschenrecht auf Nahrung Ernährungsgerechtigkeit Ernährungssicherheit Lebensmittelverschwendung Ernährungssouveränität Internationale Fallbeispiele der Verletzungen bäuerlicher Rechte'
