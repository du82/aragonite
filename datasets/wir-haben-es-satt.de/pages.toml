title = "Trägerkreis - Wir haben es satt!"
full_description = 'Wir haben Agrarindustrie satt! Wir sind Bäuerinnen und Bauern, von konventionell bis bio, von Tierhaltung bis Ackerbau. Wir sind Gärtner*innen, Imker*innen und Lebensmittelhandwerker*innen. Wir sind Aktivist*innen aus Klimaschutzbewegung, Natur-, Umwelt- und Tierschutz, Aktive der Entwicklungszusammenarbeit, engagierte Jugendliche und kritische Menschen aus Stadt und Land. Seit 2011 gehen wir zum Auftakt der weltgrößten Agrarmesse "Grüne Woche" für bäuerliche Betriebe und eine ökologischere Landwirtschaft in Berlin auf die Straße. Die Trägerorganisationen von Wir haben es satt! können sich seit vielen Jahren auf ein breites Netzwerk an Förder*innen, Medienpartner*innen und weiteren Unterstützer*innen verlassen. Herzlichen Dank! Trägerkreis Förderer und Förderinnen Medienpartnerschaften Unterstützer*innen'
