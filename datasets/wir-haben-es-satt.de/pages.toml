itZukunft_Zorgeland__c_CarlaUlrich-27_f76a5fa694.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-5476-1323 { background-image: url('/fileadmin/_processed_/f/6/csm_2024-06_HofmitZukunft_Zorgeland__c_CarlaUlrich-27_2b6a3f6cef.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-5476-1323 { background-image: url('/fileadmin/_processed_/f/6/csm_2024-06_HofmitZukunft_Zorgeland__c_CarlaUlrich-27_ac5246082f.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-5476-1323 { background-image: url('/fileadmin/_processed_/f/6/csm_2024-06_HofmitZukunft_Zorgeland__c_CarlaUlrich-27_7255cf9392.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-5476-1323 { background-image: url('/fileadmin/_processed_/f/6/csm_2024-06_HofmitZukunft_Zorgeland__c_CarlaUlrich-27_1419fdd198.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-5476-1323 { background-image: url('/fileadmin/_processed_/f/6/csm_2024-06_HofmitZukunft_Zorgeland__c_CarlaUlrich-27_c91157d3bb.jpg'); } } #carousel-backgroundimage-5476-1490 { background-image: url('/fileadmin/_processed_/d/9/csm_WHES25_Buehne_a1fdf6ef30.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-5476-1490 { background-image: url('/fileadmin/_processed_/d/9/csm_WHES25_Buehne_915b60e9fd.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-5476-1490 { background-image: url('/fileadmin/_processed_/d/9/csm_WHES25_Buehne_4ad448cf8f.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-5476-1490 { background-image: url('/fileadmin/_processed_/d/9/csm_WHES25_Buehne_2abcfc7974.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-5476-1490 { background-image: url('/fileadmin/_processed_/d/9/csm_WHES25_Buehne_7c1edc9405.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-5476-1490 { background-image: url('/fileadmin/_processed_/d/9/csm_WHES25_Buehne_3559e78333.jpg'); } } Zurück Weiter Zeit für mutige Agrarpolitik! Gemeinsam mit 9.000 Demonstrierenden forderten rund 60 Organisationen auf der „Wir haben es satt!“-Demo von der künftigen Bundesregierung ein zuverlässiges Bekenntnis und eine ambitionierte Förderung für eine bäuerlich-ökologischere Landwirtschaft. Gemeinsam adressieren Bäuer*innen, Verbraucher*innen und Aktive der Natur-, Tier- und Klimaschutzbewegung die Politik: „Wir alle wollen gesunde Lebensmittel. Wir alle wollen Tierwohl, Umwelt- und Klimaschutz. Die kommende Bundesregierung muss bäuerliche Betriebe dabei endlich adäquat unterstützen!“ […]. WEITERLESEN UNSERE FORDERUNGEN DEMO-FOTOS BÄUERLICHER PROTEST VIDEO DEMO-VIDEO HIER SPENDEN HOF MIT ZUKUNFT AGRAR-INDUSTRIE.DE DEMO-LIVESTREAM NEWSLETTER Stimmen aus dem "Wir haben es satt!"-Bündnis WHES25_bund-jugend WHES25_stadtbienen WHES25_vier_pfoten WHES25_Aktion Agrar WHES25_provieh Zurück Weiter 6-Punkte-Plan für die sozial-gerechte Agarwende Die Agrarwende muss sozial gerecht sein. Bei sozialen und ökologischen Fragen gibt es kein Entweder-Oder. Deswegen forderten wir 2023 gemeinsam'''
