["https://wir-haben-es-satt.de/presse-archiv/leverkusen-6917"]
title = "Leverkusen, 6.9.17 - Wir haben es satt!"
full_description = 'Pressemitteilung Fotos zur kostenfreien Nutzung (Quellenangabe: www.wir-haben-es-satt.de) Mit „Pac-Man“ für freies Saatgut und Pflanzenvielfalt: Bauern und Verbraucher fordern Stopp der Monsanto-Übernahme durch Bayer Protest mit Traktoren und pflanzenfressender „Bayer-Monsanto“-Figur am Bayer-Hauptsitz / Auftakt der Aktionstour für eine andere Agrarpolitik vor der Bundestagswahl Leverkusen, 6.9.17. Rund 80 Personen demonstrierten am heutigen Vormittag vor dem Bayer-Hauptsitz in Leverkusen gegen die geplante Übernahme des Glyphosat-Herstellers Monsanto. Mit Traktoren und einer überdimensionalen, pflanzenfressenden Pac-Man-Figur verdeutlichten sie ihre Ablehnung der geplanten Mega-Fusion. Das breite gesellschaftliche "Wir haben es satt!"-Bündnis, dem mehr als 45 Organisationen aus Landwirtschaft und Zivilgesellschaft angehören, wirft den Agrochemie- und Pharmariesen Bayer und Monsanto vor, mit Patenten auf Saatgut die Ernährungskette kontrollieren zu wollen. Die beiden Konzerne halten bereits jetzt jedes vierte Pflanzen-Patent beim Europäischen Patentamt – bei einer erfolgreichen Fusion ist mit einer Ausweitung ihrer Geschäftspraktiken zu rechnen. Mit einem Aktionstheater warnten die Veranstalter vor dem drohenden Schwund der Vielfalt auf den Äckern und Tellern weltweit. Der Bayer-Monsanto-„Pac-Man“ – ein Hybrid aus der bekannten Computerspiel-Figur Pac-Man und einer riesigen Bayer-Tablette – fraß bei der Performance vor dem Bayer-Firmensitz Brokkoli, Paprika und andere patentierte Pflanzen, bevor er durch zivilgesellschaftlichen Widerstand gestoppt wurde. Jochen Fritz, Organisator der „Wir haben Agrarindustrie satt!“-Demonstrationen, zu denen alljährlich Zehntausende im Januar in Berlin zusammenkommen, erklärte: „Bayer und Monsanto verhalten sich wie ein gefräßiger Pac-Man. Monsanto hat ein Saatgut-Unternehmen nach dem anderen geschluckt, auch Bayer ist hier kein Kind von Traurigkeit. Heute beherrschen drei Konzerne mehr als die Hälfte des globalen Saatgutmarkts. Das bedroht die Vielfalt auf unseren Äckern und Tellern! Als breites gesellschaftliches Bündnis sagen wir Nein zu dieser Fusion. Wir wollen Essen von Bauern und Lebensmittelhandwerkern, nicht von Chemie- und Pharmakonzernen!“ Fritz, der in Werder/Havel einen Biohof im Nebenerwerb betreibt, forderte von der nächsten Bundesregierung eine Politik für Bauernhöfe. Statt Großkonzerne zu fördern, müsse die Politik dafür sorgen, dass bäuerliche Betriebe überleben können. Bernd Schmitz, Landesvorsitzender der Arbeitsgemeinschaft bäuerliche Landwirtschaft in Nordrhein-Westfalen, sagte: "Ich fordere die EU-Kommission auf, die geplante Fusion zu untersagen. Wenn Bayer und Monsanto fusionieren, haben wir eine Marktkonzentration erreicht, die Wettbewerb nicht mehr zulässt. Für uns Bauern bedeutet dies in der Regel höhere Preise und Einschränkung der Saatgutvielfalt. Nicht mit uns. Wir setzen auf Stärkung bäuerlicher Saatgutarbeit, auf nachbaufähige Sorten und Bayer und Monsanto sollen uns vom Acker bleiben." Sarah Schneider, Referentin Ernährung und Landwirtschaft bei MISEREOR e.V., erklärte: „Bei unseren Partnern im globalen Süden sind die negativen Folgen der Geschäftspraktiken dieser Konzerne bereits heute deutlich spürbar. Agrarkonzerne wie Bayer und Monsanto begründen ihr Geschäftsmodell mit der Bekämpfung des Hungers in der Welt. Doch ganz in Gegensatz führt dieses Modell dazu, dass sich Kleinbauern verschulden, ihr Land verlieren oder von Pestiziden krank werden. Die Politik muss das Potenzial der Millionen Landwirte weltweit anerkennen, fördern und Konzerne regulieren.“ Mit der Kampagne „Saat für Vielfalt“ informiert MISEREOR derzeit über die negativen Folgen des Agrarmodells der Konzerne im globalen Süden und zeigt demokratische und nachhaltige Alternativen auf. Jutta Sundermann von Aktion Agrar sagte: „Um die bäuerliche Landwirtschaft, gesundes Essen und eine vielfältige Umwelt zu erhalten, brauchen wir direkte Kontakte zu regionalen Produzenten. Immer größere Konzerne im Agrarbereich bedrohen unsere Zukunft. Längst liegt zu viel Macht in den Händen von wenigen Konzernen. Daher fordern wir von der nächsten Bundesregierung: Stoppen Sie diese Fusion! Schieben Sie der Konzernmacht einen Riegel vor." Hintergrund:Der Protest gegen die Megafusion war der Auftakt der „Wir haben es satt!“-Aktionstour für die Agrar- und Ernährungswende, die vor der Bundestagswahl quer durch Deutschland führt. Die nächste Station findet in Thüringen statt, wo es am 8.9. eine aufsehenerregende Aktion zu dem hierzulande bislang wenig beachteten Thema Landraub gibt. Am Samstag, den 9.9. findet zum Abschluss die große Demonstration zum Wiesenhof-Megaschlachthof in Königs Wusterhausen (bei Berlin) statt. Unter dem Slogan „Wir haben Agrarindustrie satt!“ versammeln sich alljährlich im Januar Zehntausende in Berlin für bäuerliche Betriebe, artgerechte Tierhaltung und eine Ökologisierung der Landwirtschaft. Weitere Informationen: www.wir-haben-es-satt.de Für Rückfragen:Jochen Fritz, Kampagne „Meine Landwirtschaft“/Wir haben es satt!, Mobil: 0171-8229719, E-Mail: fritz(at)meine-landwirtschaft.de Bernd Schmitz, Arbeitsgemeinschaft bäuerliche Landwirtschaft NRW, Mobil: 0177-3565559, E-Mail: schmitz(at)abl-ev.de Sarah Schneider, MISEREOR e.V., Mobil: 0160-93533954, E-Mail: Sarah.Schneider(at)misereor.de Jutta Sundermann, Aktion Agrar, Mobil: 0175-8666769, E-Mail: jutta.sundermann(at)aktion-agrar.de Pressekontakt:Christian Rollmann, Wir haben es satt!-Pressekontakt, Mobil: 0151-51245795, E-Mail: rollmann(at)meine-landwirtschaft.de Pressemitteilung Fotos zur kostenfreien Nutzung (Quellenangabe: www.wir-haben-es-satt.de)'
