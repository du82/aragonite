title = "Rückblick - Wir haben es satt!"
full_description = 'Rückblick 2011 startete die erste "Wir haben es satt!"-Demonstration vom Berliner Hauptbahnhof. Schon damals demonstrierten 20.000 Menschen zum Brandenburger Tor und sagten NEIN zu Gentechnik, Tierfabriken und Dumpingexporten und JA zu bäuerlicher und ökologischer Landwirtschaft. Neben den alljährlichen Demonstrationen zum Auftakt der Grünen Woche in Berlin organisiert das "Wir haben es satt!"-Bündnis verschiedene Aktionen und Austauschformate. So zum Beispiel zwei Kongresse, diverese regionale Demonstrationen und ein Festival auf einem Bauernhof. Viel Spaß beim Stöbern! Zentrale "Wir haben es satt!"-Demonstrationen in Berlin "Wir haben es satt!"-Demo 2024 "Wir haben es satt!"-Demo 2023 „Wir haben es satt!“-Protest 2022 „Wir haben es satt!“-Protest 2021 "Wir haben es satt!"-Demo 2020 "Wir haben es satt!"-Demo 2019 "Wir haben es satt!"-Demo 2018 "Wir haben es satt!"-Demo 2017 "Wir haben es satt!"-Demo 2016 "Wir haben es satt!"-Demo 2015 "Wir haben es satt!"-Demo 2014 "Wir haben es satt!"-Demo 2013 "Wir haben es satt!"-Demo 2012 "Wir haben es satt!"-Demo 2011 Immersives Dialogformat "Hof mit Zukunft" Hof mit Zukunft 2024 Hof mit Zukunft 2023 Hof mit Zukunft 2022 Pilotprojekt 2021 Kongresse & Festivals Beats + Bohne-Festival 2019 Kongress 2016 Kongress 2014 weitere Aktionen "Wir haben Tierfabriken satt!"-Demo in Königs Wusterhausen 2023 "Megaställe stoppen – Bauernhöfe statt Tierfabriken!"-Demo in Berlin 2021 "Eure Agrarpolitik ist ein einziger Scherbenhaufen“-Protest in Koblenz 2020 "Die europäische Agrarwende voranbringen!"-Demo in Koblenz 2020 "Schluss mit den Lippenbekenntnissen, Frau Klöckner!“-Demo in Berlin 2020 "Klebriger Protest“ in Berlin 2020 Demo am EU-Parlament in Straßburg 2019 Mahnmahl der ungerechten Agrarsubventionen in Berlin 2019 EU-Aktionstag für die Agrarwende in Berlin und ganz Europa 2018 "Landwirtschaft ohne Bayer ist Ährensache!"-Demo in Bonn 2018 Kochtopf-Konzert für die Agrarwende "Nie wieder Schmidt!"-Protest in Berlin 20