["https://wir-haben-es-satt.de/standard-titel"]
title = "Berlin, 16.09.2023 - Wir haben es satt!"
full_description = 'Pressemitteilung "Wiesen und Höfe statt Wiesenhof"-Demonstrant*innen fordern ein Ende von Megaställen und Tierleid Tierschutzgesetz verbessern / Finanzierung für den Umbau der Tierhaltung endlich bereitstellen Königs Wusterhausen, 16.9.23. Unter dem Motto „Wiesen und Höfe statt Wiesenhof“ protestierten am Samstag rund 750 Personen am Schlachthof Wiesenhof in Königs Wusterhausen. Aufgerufen vom „Wir haben es satt!“-Bündnis, forderten 37 Organisationen aus Landwirtschaft und Gesellschaft den Abbau von Megaställen und eine deutliche Verbesserung des Tierschutzgesetzes. Zudem ist die Politik aufgefordert endlich die finanziellen Mittel für den dringend notwendigen Umbau der Tierhaltung bereitzustellen. Der Demonstrationszug führte vom Bahnhof Königs Wusterhausen zum Schlachthof im Ortsteil Niederlehme. Im Anschluss fand ein „Fest für die Agrarwende“ mit Workshops, Essen und Konzerten auf der Festwiese Niederlehme statt. Bündnissprecherin Inka Lange: „Wir haben das Tierleid in Megaställen und die Blockierhaltung von Finanzminister Lindner satt! Hier in Königs Wusterhausen mästet Wiesenhof über 1 Million Hühner – dichtgedrängt und ohne Auslauf. Die Überproduktion in der industriellen Tierhaltung verursacht nicht nur Tierleid, sondern schadet auch Mensch und Umwelt und verdrängt bäuerliche Betriebe. Um in der gesamten Landwirtschaft mehr Tierwohl, Klima- und Umweltschutz zu erreichen, müssen Megaställe abgebaut und das bäuerliche Höfesterben gestoppt werden. Wir fordern wirksame Gesetze für mehr Tierschutz und eine gezielte finanzielle Förderung von bäuerlicher und artgerechter Tierhaltung, bevor die Legislaturperiode in Berlin dem Ende zu geht.“ Pressekontakt: Julia Güttler, „Wir haben es satt!“-Pressesprecherin, Tel.: 030-28482438, Mobil: 0151-51245795, E-Mail: presse[at]meine-landwirtschaft[dot]de Statements von Redner*innen der Demonstration: Ina Müller-Arnke, Expertin für Tiere in der Landwirtschaft bei VIER PFOTEN: „Megaschlachtfabriken wie die Anlage in Königs Wusterhausen stehen für ein System, in welchem Tiere die ewigen Verlierer sind. Das Tierleid in Deutschland wird durch ein Tierschutzgesetz gedeckt, welches den Namen nicht verdient. Damit muss jetzt Schluss sein! In diesem Jahr steht endlich die Überarbeitung des Tierschutzgesetzes an. Diese Chance muss Landwirtschaftsminister Cem Özdemir jetzt nutzen und das Tierschutzgesetz grundlegend verbessern: Qualzuchtmerkmale müssen definiert, Amputationen an Tieren konsequent verboten und Gesetzeslücken bei Haltungsanforderungen, geschlossen werden. Das Tierschutzstrafrecht muss reformiert sowie Kontrollen erhöht und Verstöße stärker geahndet werden. Für ein echtes Tierschutzgesetz, das Tiere wirklich schützt.“ Elisabeth Waizenegger, AbL-Bundesvorstand: "Bisher ging es beim Umbau der Tierhaltung um die Schweinemast. Für viele Tierarten wie Geflügelhaltung ist noch überhaupt nicht klar, wie es weitergeht. Das Tierschutzgesetz soll jetzt geändert werden, das bedeutet Ordnungsrecht und damit werden auch Umbauten notwendig. Aber die Betriebsleiter:innen wissen noch gar nicht, wie die Kennzeichnung gestaltet sein wird. Diese vielen Unklarheiten führen zu einem Vertrauensverlust in die Politik. Deshalb ist es wichtig, dass Minister Özdemir zügig Planungssicherheit für die Höfe herstellt. Das betrifft verlässliche Haltungsregeln und langfristige finanzielle Förderung für die Höfe. Erst dann können und werden sich die Bäuerinnen und Bauern auf den Weg machen, umzubauen." Reinhild Benning, Agrarexpertin der Deutschen Umwelthilfe (DUH): „Industrielle Hähnchenmast in Deutschland macht krank. Masthühner erhalten immer höhere Dosen an Antibiotika, die als Notfallantibiotika für Menschen bestimmt sind. In der Geflügelindustrie scheitert die freiwillige Antibiotikareduktion, weil Qualzucht und Tierleid in den Mastfabriken so immens ist, dass viele Hühner ohne Überdosis an Antibiotika gar nicht lebend bis zur Schlachtbank gelangen. Bund und Länder müssen sofort eine solide Finanzierung für mehr Tierschutz im Stall sichern und damit die Zukunft der bäuerlichen Tierhaltung und die Erreichung der Ökolandbauziele. Und es braucht einen gesetzlichen Rahmen, der die Wertschätzung für die Tierschutzleistungen der Landwirt:innen auch in Form fairer Verträge und kostendeckender Preise sicherstellt.“ Stig Tanzmann, Referent für Landwirtschaft, Brot für die Welt: „Strukturen der industriellen Tierhaltung, wie hier in Königs Wusterhausen, sind die Grundlage für Dumpingexporte von Fleischresten nach Afrika. Diese Exporte und Strukturen kritisieren wir zusammen mit unseren Partnern seit 20 Jahren! Denn diese Dumpingexporte zerstören die Ernährungssouveränität. Wie fatal der Verlust der Ernährungssouveränität für den globalen Süden ist, zeigt erneut der russische Angriffskrieg gegen die Ukraine. Die Bundesregierung muss endlich handeln, indem sie weltweit Ernährungssouveränität unterstützt und sich für eine agrarökologische Transformation der Ernährungssysteme der Ernährungssysteme einsetzt. Dies bedeutet auch endlich einen realistischen Rahmen für den Umbau der Tierhaltung zu schaffen.“ Nelia Häuser, Slow Food Youth: Slow Food Youth setzt sich für eine pflanzenbasierte Ernährung ein, da diese das Wohl der Tiere, unsere eigene Gesundheit und den Erhalt der Biodiversität fördert. Beim Konsum tierischer Produkte sollte eine respektvolle und wesensgerechte Haltung im Mittelpunkt stehen. Neben persönlichen Konsumentscheidungen sind aber vor allem politische Maßnahmen wichtig, welche die Grausamkeiten unseres ausbeuterischen und zerstörerischen Tierhaltungssystems verbieten. Massentierhaltung jetzt stoppen! Leonie Steinherr, Aktion Agrar: „Der Geflügelkonzern PHW importiert mit seinem Tochterunternehmen, dem Tierfutterhersteller „MEGA“ massenhaft Soja für die Wiesenhof-Geflügelhaltung. Laut Eigenauskunft zu 100% aus Brasilien - wo Wälder und Savannen abgeholzt und massive Menschenrechtsverletzungen begangen werden. Daher hat Aktion Agrar erst kürzlich die Schiffszufahrt eines MEGA-Futtermittelwerks mit Kajaks blockiert. PHW und seine schädlichen Praktiken müssen sofort gestoppt werden.“ Show larger version Show larger version Show larger version Show larger version Show larger version Show larger version Show larger version Fotos zur kostenfreien Nutzung Zum Download bitte auf das Bild klicken. Mehr Fotos im Flickr-Album. Quellenangabe: Nick Jaussi / www.wir-haben-es-satt.de Pressemitteilung'
