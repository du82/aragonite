["https://wir-haben-es-satt.de/informieren/rueckblick/demo-2018"]
title = "Demo 2018 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Fernsehen und Videoberichte Wir haben es satt!-Videorückblick Campact-Video CastorTV-Livestream Tagesschau, 20:00 Uhr (ab 05:34) Tagesschau, 13:00 Uhr (ab 02:15) ZDF heute (ab 09:13) Heute Journal (ab 10:28) Reuters Beitrag ZDF Frontal 21 (ab 23:10) RBB-Abendschau (ab 2:36) Brandenburg Aktuell ZDF Länderspiegel NDR Nordmagazin (ab 03:10) Radio Bremen: Buten un binnen SWR Rheinland-Pfalz Radio Deutschlandfunk Deutschlandfunk Deutschlandfunk - NOVA Flux FM - Die Morning-Show am Nachmittag Radioeins RBB-Inforadio RBB-Kulturradio WDR 5 - Feature Radio Berlin 88,8 - Dein Vormittag Radio Zusa Domradio Köln Berliner Zeitung Der Freitag Junge Welt Zitty taz WEITERLESEN Greenpeace Magazin Jungle World Frankfurter Rundschau Mit Vergnügen taz taz taz Energieverbraucherportal Märkische Allgemeine Zeitung Rote Fahne News Neues Deutschland tazZDFFAZn-tvZDF LogoZeit WEITERLESEN Neue Züricher Zeitung mdr BILD Der Tagesspiegel Der Tagesspiegel Der Tagesspiegel Berliner Kurier Deutsche Welle Deutsche Welle tagesschau ZDF rbb24 Stern Berliner Morgenpost Berliner Zeitung Junge Welt oekonews euronews Utopia.de Berliner Sonntagsblatt Schrot & Korn wetter.com Süddeutsche Zeitung Europe Online Magazin Berliner Morgenpost taz FAZ Rote Fahne News Die Welt euractiv.de Junge Welt Neues Deutschland Neues Deutschland Deutsche Welle Abendzeitung München Haller KreisblattWestfalen-BlattSüddeutsche ZeitungLausitzer Nachrichten Allgemeine Zeitung WEITERLESEN Allgemeine Zeitung Neckar-Chronik Schwäbisches Tagblatt Neue Osnabrücker Zeitung Mittelbayrische General-Anzeiger Märkische Oder-Zeitung Lausitzer Nachrichten Online Wochenblatt Kölnische Rundschau Schleswig-Holsteinischer Zeitungsverlag Sächsische Zeitung Südkurier Lausitzer Nachrichten Online Süddeutsche Zeitung Schwäbische Zeitung Freie Presse Hanau Online Wochenblatt Schwäbisches Tagblatt Salto Nordwest-Zeitung Reutlinger General-Anzeiger Passauer Neue Presse Passauer Neue Presse Radio 8 Süddeutsche Zeitung Potsdamer Neueste Nachrichten Freie Presse Mittelbayrische Celler Presse Da Hog'n Münchner Wochenanzeiger Reutlinger General-Anzeiger wendland.net Neckar-Chronik Allgemeine Zeitung Passauer Neue Presse Merkur Kreiszeitung AgrarzeitungAgrarheuteAgrarzeitungProplantaTopagrarAgrarheute WEITERLESEN Agrarheute Bauernzeitung Agrarzeitung Agrarheute Bauernzeitung Landwirtschaftlicher Informationsdienst Fleischwirtschaft Topagrar Österreich 8. Wir haben es satt!-Demo am 20. Januar 2018 Aufruf Der Agrarindustrie die Stirn bieten! Gemeinsam für eine bäuerlich-ökologischere Landwirtschaft, gesundes Essen, artgerechte Tierhaltung, globale Bauernrechte und Gerechten WElthandel! Vier weitere verschenkte Jahre in der Agrarpolitik? Das können wir uns nicht leisten. Dringender denn je brauchen wir eine bäuerliche, ökologischere Landwirtschaft und gesundes Essen für alle! Doch wer etwas verändern will, legt sich mit der mächtigen Agrarlobby an. Schluss damit: Die Politik muss endlich den Interessen der Menschen folgen, statt Konzernen zu mehr Macht zu verhelfen. Deswegen müssen wir – die kraftvolle, bunte, lautstarke Bewegung – den Konzernen die Stirn bieten und die nächste Regierung in die Pflicht nehmen. Wir haben die fatale Realität der industriellen Landwirtschaft satt – und wir wissen, wie es besser geht: Unternehmen wie Bayer und Monsanto fusionieren zu immer größeren Megakonzernen, wollen Macht vom Acker bis zum Teller – und verdienen Milliarden mit unserem Essen. Die Konsequenz: Lebensmittel-Skandale, Glyphosat und Antibiotikaresistenzen, Verlust der Artenvielfalt und verschmutztes Trinkwasser, Gentechnik und Patente auf Pflanzen und Tiere. Doch wir wollen gesundes Essen von Bäuerinnen und Bauern für alle! Für eine Ernährungspolitik, die auf regionale und nachhaltige Lebensmittel setzt statt auf industrielle Massenprodukte! In Megaställen und Schlachthöfen, wo Arbeitsrechte oftmals mit Füßen getreten werden, trimmt die Fleischindustrie die Tiere immer weiter auf Profit. Doch Schweine, Hühner und Kühe brauchen Stroh, Auslauf und Weideland. Das „immer mehr“, "immer größer“ und „immer intensiver“ in der Landwirtschaft treibt Bauernhöfe in den Ruin. Seit 2005 hat jeder dritte landwirtschaftliche Betrieb in Deutschland dichtgemacht. Schluss mit den Subventionen an die Agrarindustrie! Die Bundesregierung muss den Umbau hin zu artgerechter Tierhaltung wirksam fördern! Aggressive Exportstrategien und verfehlte Agrarpolitik ruinieren Bäuerinnen und Bauern auf der ganzen Welt. Mit Kampfpreisen und Landraub ziehen große Konzerne den Bauernhöfen im globalen Süden und in Europa den Boden unter den Füßen weg. Statt Konzerninteressen mit Freihandelsabkommen abzusichern, brauchen wir weltweit sicheren Zugang zu Land, Wasser, Saatgut und Nahrung. Auch kleine und mittlere Betriebe, die Tiere gut halten und Klima und Umwelt schützen, müssen von ihren Produkten leben können – überall. Deswegen: Schluss mit Dumping-Exporten – für globale Bauernrechte und eine weltweite Agrarwende! Essen ist politisch Millionen Bäuerinnen, Bauern und Lebensmittel-HandwerkerInnen auf der ganzen Welt ackern täglich für die Agrar- und Ernährungswende. Immer mehr Menschen erkennen, dass Essen politisch ist und kaufen saisonal, ökologisch oder direkt bei der Bäuerin. Das zeigt uns: Eine zukunftsfähige Landwirtschaft und gutes Essen für alle sind möglich. Wir schlagen alarm bei der Agrarministerkonferenz! Am 20. Januar, zum Auftakt der weltgrößten Agrarmesse „Grüne Woche“, treffen sich LandwirtschaftsministerInnen aus der ganzen Welt in Berlin. Als Gastgeberin der Agrarministerkonferenz steht die Bundesregierung dann im Licht der Weltöffentlichkeit. Der perfekte Moment für uns! Während drinnen über unser Essen und unsere Landwirtschaft entschieden wird, machen wir draußen Druck für die globale Agrar- und Ernährungswende und für gerechten Handel. Unsere Vorschläge für eine neue Agrarpolitik und Lebensmittelerzeugung liegen auf dem Tisch. Aber: Die nächste Bundesregierung handelt nur, wenn unser Protest auf der Straße unüberhörbar wird. Deswegen: Bring deinen Kochtopf mit und schlag mit uns Alarm für gute Landwirtschaft und gesundes Essen – hier und weltweit! ALLE DEMO-BILDER AUF FLICKR Frontbanner Trecker Detail Demomenge Demo_Detail Trecker Frontbanner Detail Brandenburger Tor Menge #carousel-backgroundimage-1090-89 { background-image: url('/fileadmin/_processed_/9/e/csm_Frontbanner_18_87fa35535d.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1090-89 { background-image: url('/fileadmin/_processed_/9/e/csm_Frontbanner_18_a9e622dcf0.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1090-89 { background-image: url('/fileadmin/_processed_/9/e/csm_Frontbanner_18_aa692f55e5.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1090-89 { background-image: url('/fileadmin/_processed_/9/e/csm_Frontbanner_18_cce2a76281.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1090-89 { background-image: url('/fileadmin/_processed_/9/e/csm_Frontbanner_18_09313f6074.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1090-89 { background-image: url('/fileadmin/_processed_/9/e/csm_Frontbanner_18_b30c16b4fe.jpg'); } } #carousel-backgroundimage-1090-94 { background-image: url('/fileadmin/_processed_/5/d/csm_Detail_Trecker_18_72491c7049.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1090-94 { background-image: url('/fileadmin/_processed_/5/d/csm_Detail_Trecker_18_08031481f8.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1090-94 { background-image: url('/fileadmin/_processed_/5/d/csm_Detail_Trecker_18_beea346271.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1090-94 { background-image: url('/fileadmin/_processed_/5/d/csm_Detail_Trecker_18_c658a3e34e.jpg'); } } @media (min-width: 1200px)