["https://wir-haben-es-satt.de/presse-archiv/berlin-22112019"]
title = "Berlin, 22.11.2019 - Wir haben es satt!"
full_description = "Presseinformation & Terminhinweis Agrarwende anpacken, Klima schützen! – 10. „Wir haben es satt!“-Demonstration am 18.1.2020 Großdemonstration für die Agrarwende / Fatale Bilanz von 10 Jahren unionsgeführtem Agrarministerium / Regierung muss Bauern endlich bei nötigen Veränderungen unterstützen Berlin, 22.11.2019. Am 18. Januar 2020 demonstrieren wieder Zehntausende bei der „Wir haben es satt!“-Demonstration in Berlin für die Agrar- und Ernährungswende. Mit bunten Schildern, kreativen Kostümen und starken Botschaften fordern die Demonstranten – aufgerufen von rund 55 Organisationen aus Landwirtschaft und Gesellschaft – zum Auftakt der Grünen Woche im Regierungsviertel: Bauernhöfe nicht beim Umbau der Landwirtschaft alleine lassen, Veto gegen das Mercosur-Abkommen sowie Nein zu Industriemogelpackungen wie Gentechnik, Patent-Saatgut und routinemäßigem Pestizideinsatz. Nach einem weiteren schwierigen Jahr mit Dürre und Starkregen steht die Demonstration unter dem Motto: „Agrarwende anpacken, Klima schützen!“ „Wir haben es satt!“-Sprecherin Saskia Richartz kritisiert den Stillstand im Landwirtschaftsministerium: „Seit zehn Jahren entwickeln wir im breiten Bündnis Ideen, wie die Landwirtschaft wieder mit Umwelt, Tierwelt und letztlich auch mit der Gesellschaft in Einklang gebracht werden kann. Aber unsere Vorschläge stoßen im Agrarministerium auf taube Ohren, weil dort die wichtigen Zukunftsaufgaben konsequent ignoriert werden. Alle Landwirtschaftsminister der letzten zehn Jahre haben sich geweigert, die Probleme der industriellen Landwirtschaft zu benennen und belastbare Vorschläge zum Umbau der Landwirtschaft vorzulegen. Zukunftsfähige Politik sieht anders aus.“ Mit Blick auf die aktuellen Traktor-Proteste gegen das Agrarpaket der Bundesregierung sagt Richartz: „Die Sorge der Bäuerinnen und Bauern, sie könnten mit dem notwendigen Umbau der Landwirtschaft alleine gelassen werden, sind durchaus berechtigt. Die Landwirte brauchen verlässliche Vorgaben und finanzielle Unterstützung für die notwendigen Veränderungen. Darauf weisen wir seit Jahren hin. Die Agrar-Subventionen müssen die Bauernhöfe gezielt dabei unterstützen mehr Tier-, Umwelt- und Klimaschutz umzusetzen. Im Übrigen müssen auch der Handel und die Verbraucher eine enkeltaugliche Landwirtschaft mit fairen Preisen honorieren.“ Die Bilanz der Agrarpolitik der letzten Jahre ist verheerend: Seit dem Amtsantritt von Angela Merkel im Jahr 2005 mussten 130.000 landwirtschaftliche Betriebe in Deutschland schließen. Im durchgängig unionsgeführten Agrarministerium wurde beim Höfesterben schlicht zugesehen. Gleichzeitig versäumten es die Minister der CDU/CSU wirksame Maßnahmen gegen Insektensterben und Überdüngung zu treffen. Deswegen fordern im Januar wieder Zehntausende eine Agrarpolitik für Bauern, Tiere und Umwelt. Terminhinweis: „Wir haben es satt!“-Großdemonstration: „Agrarwende anpacken, Klima schützen!“ Zeit: Samstag, 18. Januar 2020, ab 12.00 UhrOrt: Brandenburger Tor, Platz des 18. März, 10117 Berlin Ablauf: 12 Uhr: Auftaktkundgebung Ca. 12.30 Uhr: Start der Demonstration Ab ca. 14.30 Uhr: Abschluss mit Reden, Musik und Essen am Brandenburger Tor Hintergrund: Seit 2011 demonstrieren unter dem Motto „Wir haben Agrarindustrie satt!“ alljährlich im Januar zehntausende Menschen – Bauern, Lebensmittelhandwerker, Tier-, Umwelt- und Naturschützer, Aktive der Entwicklungszusammenarbeit, engagierte Jugendliche und viele mehr – kraftvoll, bunt und lautstark auch bei eisigen Temperaturen in Berlin. Gemeinsam treten sie ein für eine Landwirtschaft, in der Tiere artgerecht gehalten werden, Umwelt und Klima geschützt werden, gutes Essen für alle erzeugt wird und Bauern faire Preise für ihre Produkte erhalten. Presseinformation & Terminhinweis"
year_published = 2025
