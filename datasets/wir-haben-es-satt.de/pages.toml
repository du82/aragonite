title = "Hof mit Zukunft 2024 - Wir haben es satt!"
full_description = '''YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Show larger version Mach mit! Du bist Landwirt*in oder Aktivist*in und willst an "Hof mit Zukunft" teilnehmen? Dann trage dich in unserer Vormerkliste ein oder abonniere unseren Newsletter. VORMERKLISTE NEWSLETTER FAQ Du hast Fragen zur Teilnahme bei "Hof mit Zukunft"? Hier findest du unsere FAQs: FÜR HÖFE FÜR AKTIVISTI Das war Hof mit Zukunft 2024 13. bis 16. Juni 2024 23 Höfe konventionell und bio Gemüse- und Obstanbau, Ackerbau, Sonderkulturen (z. B. Kräuter und Wein), Tierhaltung (Milchvieh, Masttierhaltung, Bienen), Saatgutvermehrung bundesweit mit Fokus auf die ostdeutschen Länder 70 Aktivist*innen Fridays for Future, Letzte Generation, Extinction Rebellion, German Zero, NABU, BUND, Greenpeace, foodharing, SlowFood und andere mit und ohne landwirtschaftliche Vorkenntnisse aus der ganzen Bundesrepublik Presse "Es gibt sie noch, diese Momente, in denen das Reporterherz wieder Hoffnung schöpft. Andersdenkende begegnen sich im Gespräch. Ohne Vorwurf, aber mit bohrenden Fragen. Ohne Gegenangriff, sondern mit ehrlichen Antworten. Menschen mit konträrer Meinung können vernünftig miteinander reden, ohne zu streiten." Thüringer Allgemeine (17.06.2024) Guten Morgen, Nordhausen: Veganerin trifft Viehhalter PRESSESPIEGEL PRESSEMITTEILUNG Ein Landwirt mit tausend Ideen Fast 2000 Hektar. So groß sind die Flächen des Betriebs, den wir uns an diesem Wochenende über „Hof mit Zukunft“ anschauen. Streng genommen sind es allerdings zwei Betriebe, die Warnke Agrar GmbH und die Elbland P&HgmbH. Beide zusammen werden von Christian Warnke geführt und von seinen Mitarbeitenden gemeinsam bewirtschaftet; wir besuchen ihn für ein verlängertes Wochenende… WEITERLESEN „Ihr müsst mich jetzt fragen, warum ich keinen Biohof habe“ „Dann sind wir ja Aktivisten unter sich“, bemerkte Bauer Josef, als wir mit dem Auto Richtung Hortingshof fuhren. Dass die Fronten zwischen Bäuer*innen und Klimaschützer*innen nicht ganz so verhärtet sind, wie es im öffentlichen Diskurs manchmal scheint, zeigte sich schon auf der kurzen Autofahrt vom Bahnhof… WEITERLESEN Die Zukunft des ländlichen Raums Wir waren zu viert (Katja, Rico, Ruth und Kristof) auf dem Mittelhof in der Mecklenburgischen Schweiz. Der Hof befindet sich seit Ewigkeiten in Familienbesitz, heute leben dort 4 Generationen im Alter von 11 bis 96. Ulrike, Maria und Bernd haben sich viel Zeit für Gespräche mit uns genommen und uns Stadtmenschen einen sehr guten Einblick in ihre Lebenswelt vermittelt. Am Donnerstag nach der Ankunft setzten wir uns erwartungsvoll an den großen Tisch im Ladencafé des Hofladens… WEITERLESEN Vier Tage auf dem Heilsberger Hof Anfang Mai flatterte eine Mail von Greenpeace, wo ich seit fast zehn Jahren aktiv bin, herein, mit einer Einladung, vier Tage auf einem Bauernhof zu verbringen. Vier Tage mitarbeiten und mit Landwirtinnen diskutieren – wo gibt es das denn? Wo können Aktivisten ihr theoretisches Wissen durch praktische Arbeit aufbessern und offen mit Landwirtinnen in den Dialog und kritischen Austausch gehen?… WEITERLESEN Impressionen HmZ24 Grossmonra 1 HmZ24 Zorgeland 1 HmZ24 Grossmonra 2 HmZ Zorgeland 2 HmZ Zorgeland 3 #carousel-backgroundimage-7822-1331 { background-image: url('/fileadmin/_processed_/c/6/csm_2024-06_HofmitZukunft_Grossmonra__c_CarlaUlrich-20_1b21100850.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7822-1331 { background-image: url('/fileadmin/_processed_/c/6/csm_2024-06_HofmitZukunft_Grossmonra__c_CarlaUlrich-20_5554b50c14.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7822-1331 { background-image: url('/fileadmin/_processed_/c/6/csm_2024-06_HofmitZukunft_Grossmonra__c_CarlaUlrich-20_f74e9b3419.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7822-1331 { background-image: url('/fileadmin/_processed_/c/6/csm_2024-06_HofmitZukunft_Gro