r_upload/fotos/demo11/bauernhoefestattagrarfabriken.JPG'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1196-125 { background-image: url('/fileadmin/_processed_/4/2/csm_bauernhoefestattagrarfabriken_12029c7b88.jpg'); } } #carousel-backgroundimage-1196-126 { background-image: url('/fileadmin/user_upload/fotos/demo11/traktor.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1196-126 { background-image: url('/fileadmin/user_upload/fotos/demo11/traktor.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1196-126 { background-image: url('/fileadmin/user_upload/fotos/demo11/traktor.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1196-126 { background-image: url('/fileadmin/user_upload/fotos/demo11/traktor.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1196-126 { background-image: url('/fileadmin/user_upload/fotos/demo11/traktor.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1196-126 { background-image: url('/fileadmin/_processed_/8/4/csm_traktor_f47ab40bfb.jpg'); } } #carousel-backgroundimage-1196-127 { background-image: url('/fileadmin/_processed_/f/c/csm_kartoffel_8cfc3d32ed.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-1196-127 { background-image: url('/fileadmin/user_upload/fotos/demo11/kartoffel.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-1196-127 { background-image: url('/fileadmin/user_upload/fotos/demo11/kartoffel.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-1196-127 { background-image: url('/fileadmin/user_upload/fotos/demo11/kartoffel.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-1196-127 { background-image: url('/fileadmin/user_upload/fotos/demo11/kartoffel.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-1196-127 { background-image: url('/fileadmin/_processed_/f/c/csm_kartoffel_2fcc24589f.jpg'); } } Zurück Weiter ALLE DEMO-BILDER AUF FLICKR Gemeinsame Pressemitteilung Breites Bündnis fordert Wende in der Landwirtschaftspolitik Demo "Wir haben es satt!": 22.000 Menschen fordern eine ökologisch-bäuerliche Landwirtschaft Berlin, 22.01.11 | Unter dem Motto "Wir haben es satt - Nein zu Gentechnik, Tierfabriken und Dumpingexporten" haben heute in Berlin 22.000 Menschen für eine grundlegende Reform der Agrarpolitik, die Abkehr von der industrialisierten Landwirtschaft und besseren Verbraucherschutz demonstriert. Bei der bislang größten Demonstration dieser Art zogen Bauern, Umweltschützer, Imker und Verbraucher gemeinsam vom Berliner Hauptbahnhof zur Abschlusskundgebung am Brandenburger Tor. Mit 60 Bussen, Zügen und über 60 Traktoren waren Tausende Menschen aus dem ganzen Bundesgebiet zu der Demonstration angereist. Getragen wurde die Veranstaltung von 120 Bauern- und Umweltverbänden, Bürgerinitiativen gegen Massentierhaltung und Gentechnik, sowie von Eine-Welt-Gruppen. Anlass der Demonstration ist die von der Bundesregierung ausgerichtete Agrarwirtschaftskonferenz, die heute auf der "Grünen Woche" in Berlin beginnt. Auf der Abschlusskundgebung am Brandenburger Tor wurde als Konsequenz aus dem Dioxin- und anderen Lebensmittelskandalen gefordert, Bundesregierung und EU sollten statt Agrarfabriken die bäuerliche Landwirtschaft fördern. "Der aktuelle Dioxin-Skandal macht den Reformstau in der Landwirtschaftspolitik schlagartig deutlich", sagte der BUND-Vorsitzende Hubert Weiger in seiner Rede. "Die Bundesregierung muss endlich begreifen, dass sie bei Fortsetzung ihrer Blockadepolitik gegen eine nachhaltige und gerechte Agrarreform in Europa schon beim nächsten Lebensmittelskandal wieder ins Schlingern gerät. Die Gesellschaft fordert die Durchsetzung einer artgerechten Tierhaltung, die Abkehr vom Irrweg der Gentechnik und die Umlenkung der Subventionen weg von der Agrarindustrie hin zur bäuerlichen und ökologischen Landwirtschaft", sagte Weiger.Maria Heubuch, Bundesvorsitzende der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) sagte: "Massentierhaltung und Gentechnik sind eine gefährliche Sackgasse für die Bauern und ein erhöhtes Risiko für die Verbraucher. Agrarfabriken gehören verboten und nicht weiter mit Steuergeldern subventioniert. Tiergerechte Haltung und Fütterung mit einheimischem Getreide und Eiweißfutter ohne Gentechnik - das ist unsere Zukunft!"Für die Veranstalter erklärte Campact-Geschäftsführer Felix Kolb: "Der heutige Protest zeigt: Die Bevölkerung will ein Ende der industriehörigen Landwirtschafts- und Lebensmittelpolitik. Strengere Lebensmittelkontrollen alleine reichen nicht aus. Wir brauchen eine grundlegende Wende in der Agrarpolitik. Bundesagrarministerin Ilse Aigner muss eine echte EU-Agrarreform und den Ausstieg aus der Massentierhaltung voranbringen anstatt beides zu bremsen."Besonderen Beifall erhielt die Rede des alternativen Nobelpreisträgers Nnimmo Bassey aus Nigeria, Vorsitzender der internationalen Umweltorganisation Friends of the Earth (Freunde der Erde). Die Auswirkungen der europäischen Agrarpolitik seien für die Entwicklungsländer verheerend, sagte er, der weltweite Protest der Zivilbevölkerung gegen Gentechnik, Agrarfabriken und Dumping-Exporte für die Ernährungssicherheit der Welt dringend notwendig. Pressespiegel Fernsehen/Videos: ZDF - heuteARD - 17-Uhr-TagesschauARD - BrisantRBB - AbendschauMDR - Aktuellarte - JournalFAZ (Bericht mit Video von Reuters) graswurzel.tvMehr Demokratie e.V.Du hast die Macht (zur Schweineaktion) Print- und Onlinemedien: Berliner MorgenpostBerliner ZeitungDer TagesspiegelTAZ.deZeit onlineFokus onlineWelt onlineHandelsblattFR online (mit Bildergalerie)FAZ.netBILD HannoverAbendzeitungRP online (mit Bildergalerie)Badische ZeitungSüdwest PresseSchwäbische ZeitungStuttgarter NachrichtenAugsburger AllgemeineOberbayerisches VolksblattNürnberger NachrichtenInnsalzach24.de über Soli-Demo in BayernWeser-KurierPeiner Allgemeine ZeitungAK-KurierOsthessen NewsOstthüringer ZeitungMärkische AllgemeineNordwest-ZeitungUsedom KurierUnser LübeckMindener