["https://wir-haben-es-satt.de/presse-archiv/berlin-14012019"]
title = "Berlin, 14.01.2019 - Wir haben es satt!"
full_description = 'Pressemitteilung Schluss mit unfairen EU-Subventionen: Klöckner darf Bauern, Verbraucher und Klima bei EU-Agrarreform nicht im Stich lassen Aufruf zur „Wir haben es satt!“-Großdemonstration am 19.1.19 / Mit Steuergeld Umwelt, Tiere und Klima schützen und den Bauernhöfen eine Zukunft geben Berlin, 14.01.2019. Am 19. Januar gehen Zehntausende bei der „Wir haben es satt!“-Demonstration für eine ambitionierte Agrarreform auf die Straße. Heute fordern Bauern, Wissenschaftler und Vertreter der Zivilgesellschaft in Berlin, dass der Agrarindustrie endlich der Geldhahn abgedreht werden muss. Die 60 Milliarden Euro an jährlichen EU-Agrargeldern müssen künftig Höfesterben, Klimaüberhitzung und Artensterben stoppen, anstatt diese Effekte der industriellen Landwirtschaft zu beschleunigen. Besonders in der Verantwortung steht dabei Agrarministerin Julia Klöckner. Sie darf die wichtigen Zukunftsthemen nicht weiter ignorieren und muss dafür sorgen, dass mit Steuergeld nur noch enkeltaugliche Landwirtschaft honoriert wird. „Wir haben es satt!“-Sprecherin Saskia Richartz verlangt einen Stopp der fatalen Subventions­praxis, bei der Milliardenbeträge direkt an industrielle Großbetriebe weitergeleitet werden: „Ministerin Klöckner, jetzt heißt es Liefern statt Labern. Wenn 2019 bei der EU-Agrarreform die Milliarden Agrarsubventionen neu verteilt werden, muss klar sein: keinen Cent mehr für die Agrarindustrie! Steuergeld muss bäuerliche Betriebe unterstützen, die Umwelt und Klima schützen und unsere Rinder, Schweine oder Hühner gut halten!" Lucas Lütke Schwienhorst (Bio-Bauer vom Gut Ogrosen in Brandenburg) ist direkt vom Klimawandel betroffen und hat Deutschland auf Einhaltung der Klimaschutzziele verklagt: “Erst Überschwemmungen, dann extreme Dürre – wir Bauern merken die Klimakrise auf unseren Äckern und Wiesen als Erste. Wir passen uns den klimatischen Veränderungen an und ackern nachhaltig, sind aber auf konsequenten Klimaschutz angewiesen. Weil die Bundesregierung diesen wieder einmal vertagt, verklage ich sie zusammen mit anderen Bauern.“ Der eingeladene Experte Dr. Benjamin Bodirsky (Potsdam-Institut für Klimafolgenforschung) schlägt angesichts der kommenden Heißzeit ein Ende der Pauschalzahlungen vor: "Fakt ist: Die Klimafolgen für die Landwirte können nur dann vermieden werden, wenn auch die Landwirtschaft ihren Beitrag zum Klimaschutz leistet. Aus Sicht der Wissenschaft ist es entscheidend, dass die Bundesregierung klimaschonend arbeitenden Landwirten einen Wettbewerbsvorteil verschafft. Anstelle von undifferenzierten Pauschalzahlungen brauchen wir eine Steuer auf umweltschädliche Stickstoffüberschüsse und finanzielle Anreize für Landwirte, die Bodenkohlenstoff in der Humusschicht aufbauen." Phillip Brändle von der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) nimmt die Landwirtschaftsministerin in die Pflicht und verlangt eine weitsichtige EU-Agrarreform: "Wir Bauern erwarten, dass Ministerin Klöckner endlich ihrer Verantwortung gerecht wird und selbst Agrarpolitik gestaltet, statt dem Handel und der Industrie das Feld zu überlassen. Bei der EU-Agrarreform heißt das: Fördern Sie den Umbau der Ställe, unterstützen Sie umwelt- und klimaverträglichen Ackerbau und sichern Sie den Erhalt von Höfen statt Landbesitz zu subventionieren.“ Sabine Werth von der Berliner Tafel fordert ein Ende der Lebensmittelverschwendung und erwartet von der Politik, gutes Essen für alle zu garantieren: "Wir produzieren im Überfluss. Ein Drittel der Lebensmittel landet im Müll und gleichzeitig sind immer mehr Menschen auf die Tafeln angewiesen. Wenn Essen künftig nur noch auf dem Teller landen würde, wäre nicht nur den Menschen, sondern auch dem Klima geholfen. Ich warte schon seit Jahrzehnten, dass die Politik endlich aus dem Quark kommt. Solange das nicht passiert ist, müssen sich alle selbst fragen, was und wie sie essen.“ Hintergrund zur Demonstration: Die „Wir haben Agrarindustrie satt!“-Demonstration wird von Tausenden Bäuerinnen und Bauern – konventionell und bio – getragen, von denen etliche mit ihren Traktoren aus dem gesamten Bundesgebiet anreisen. Zusammen mit rund 100 Organisationen aus der Zivilgesellschaft treten sie für eine Landwirtschaft und Lebensmittelpolitik ein, in der Bauern fair entlohnt werden und sich alle Menschen gesund ernähren können. Die Demonstration am 19.1. beginnt um 12 Uhr am Brandenburger Tor und zieht zum Agrarministergipfel, wo die Teilnehmer mit einem unüberhörbaren Kochtopf-Konzert eine gerechte EU-Agrarreform und mehr Mut für die Agrarwende fordern. Alle Menschen, die sich für gute Landwirtschaft und gesundes Essen einsetzen, sind herzlich willkommen teilzunehmen. Weitere Informationen: www.wir-haben-es-satt.de Hintergrund zur EU-Agrarreform: Mit jährlich 60 Mrd. Euro bestimmt die EU-Agrarpolitik (GAP), welche Landwirtschaft sich in Europa lohnt. Aktuell profitieren dabei vor allem Landbesitzer: In Deutschland erhält das obere, flächenreichste Prozent (3.300 Betriebe) eine Milliarde Euro im Jahr, während die unteren 62 Prozent (200.000 Betriebe) sich 700 Millionen Euro teilen. Das Ergebnis der verfehlten Agrarpolitik: Bauernhöfe müssen schließen, Artenvielfalt schrumpft und es ist zu viel Nitrat im Wasser. Selbst der Wissenschaftliche Beirat des Bundeslandwirtschaftsministeriums dringt auf einen raschen Kurswechsel. Alle sieben Jahre wird die GAP reformiert, derzeit verhandeln Mitgliedsstaaten und EU-Parlament über die Agrarförderung nach 2020. Für nächste Förderperiode muss das Prinzip ‚öffentliches Geld für öffentliche Leistungen‘ gelten: Bauern sollten für besondere gesellschaftliche Leistungen auf dem Acker und im Stall Gelder erhalten. Hierzu zählen u.a. Schutz des Wassers, Erhalt fruchtbarer Böden, Sicherung der Artenvielfalt und artgerechte Tierhaltung. Terminübersicht:Mittwoch, 16.01.19, 9 Uhr: Auftakt-Aktion (TV- & Fototermin): „Ungerechte Sub-ventionspraxis beenden“, Ort: Bundesministerium für Landwirtschaft und Ernäh-rung, Wilhelmstraße 54, 10117 Berlin.Freitag, 18.01.19, ab 18 Uhr: „Schnippeldisko – Topf, Tanz, Talk“. Rund 1000 Engagierte kochen bei Vorträgen und Musik eine leckere Suppe für die Demonstra-tion. Ort: Z/KU, Siemensstr. 27, 10551 Berlin.Samstag, 19.01.19, ab 8.30 Uhr: Traktoren-Demonstration vom StadtGut Blanken-felde (Hauptstr. 24-30, 13159 Berlin-Pankow) zur int. Agrarministerkonferenz. Um 10.30 Uhr: Übergabe der bäuerlichen Protestnote an Bundesministerin Klöckner bei der int. Agrarministerkonferenz (Auswärtiges Amt, Werderscher Markt 1, 10117 Berlin). Gerne vermitteln wir schon im Vorfeld Interviews mit Bauern, die mit dem Traktor aus dem gesamten Bundesgebiet anreisen.Samstag, 19.01.19, ab 12 Uhr: Großdemonstration „Wir haben Agrarindustrie satt!“. Ort: Brandenburger Tor, Platz des 18. März, 10117 Berlin. Demonstration zum Agrarminstergipfel, wo ein unüberhörbares Kochtopf-Konzert für die Agrarwende stattfindet. Abschlusskundgebung ab ca. 14.30 Uhr am Brandenburger Tor.Für Rückfragen: Saskia Richartz, “Wir haben es satt!“-Sprecherin, Mobil: 0177-8905054, E-Mail: richartz[at]meine-landwirtschaft[dot]de Lucas Lütke Schwienhorst, Bio-Bauer vom Gut Ogrosen, Mobil: 0151-51245795, E-Mail: info[at]gut-ogrosen[dot]de Phillip Brändle, Bundesvorstand der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL), Mobil: 0163-9709645, E-Mail: phillip.braendle[at]posteo[dot]de Dr. Benjamin Bodirsky, Agrarökonom am Potsdam-Institut für Klimafolgenforschung, Tel.: 0331-2882507, E-Mail: presse[at]pik-potsdam[dot]de Sabine Werth, Vorsitzende der Berliner Tafel, Mobil: 0172- 3137005, E-Mail: werth[at]berliner-tafel[dot]de Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Pressesprecher, Mobil: 0151-51245795, E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung'
