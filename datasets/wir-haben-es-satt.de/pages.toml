title = "Kongress 2014 - Wir haben es satt!"
full_description = 'YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Berichte Eigene Dokumentation Programm Dokumentation "Open Space" Polaroid Dokumentation Präsentation Zukunftsfähige Landwirtschaft Pressespiegel Tageszeitung Neues Deutschland OYA Medien Albert Schweitzer Stiftung 1. WIR HABEN ES SATT!-Kongress 2014 Alte und junge Leute aus Stadt und Land diskutieren Vom 2.-5. Oktober, dem Erntedank-Wochenende, diskutierten in Berlin-Kreuzberg über 500 Menschen über Alternativen zum bestehenden Agrarsystem. Konventionelle und ökologisch arbeitende Bäuerinnen und Bauern, Imker*innen, Tier- und Umweltschützer*innen und internationale Gäste stellten Alternativen zur industriellen Lebensmittelproduktion vor. Zur Sprache kamen Solidarische Landwirtschaft-Projekte, Modelle für eine faire Marktregelung, Initiativen zum Saatgut-Erhalt und zur Bodenvergabe. In über 20 Arbeitsgruppen wurden Themen vertieft und in Großgruppen Forderungen der Bewegung an die Agrarpolitik diskutiert, die anschließend an die Politik übergeben wurden. Parallel zum Kongress fand rund um die Markthalle Neun das Stadt Land Food-Festival statt. Hier sind die Fotos der verschiedenen Veranstaltungen und Events. ERÖFFNUNG UND SCHLAGLICHTER (FOTOS) VORTRAG / ARBEITSGRUPPEN / DISKUSSIONSRUNDE FORDERUNGSPRÄSENTATION UND "OPEN SPACE" AGRARPOLITISCHER TALK UND EVALUATION Berichte Eigene Dokumentation Programm Dokumentation "Open Space" Polaroid Dokumentation Präsentation Zukunftsfähige Landwirtschaft Pressespiegel Tageszeitung Neues Deutschland OYA Medien Albert Schweitzer Stiftung'
