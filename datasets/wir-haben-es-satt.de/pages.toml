["https://wir-haben-es-satt.de/berlin/bundesweit-23052024"]
title = "Berlin/bundesweit, 23.05.2024 - Wir haben es satt!"
full_description = "Pressemitteilung 23. Mai 2024 PDF-VERSION PDF-VERSION Pressemitteilung 23. Mai 2024 Nach europaweiten Bauernprotesten und Rollback in der Agrarpolitik: Naturschutz-Aktivist*innen und Bäuer*innen kommen aufeinander zu Vom 13. bis 16. Juni ermöglicht das „Wir haben es satt!“-Bündnis bei „Hof mit Zukunft“ den Dialog zwischen Klima-, Tier- und Umweltschutzbewegung und Bauernhöfen in ganz Deutschland. Berlin/bundesweit, 23. Mai 2024: Bauernhöfe in ganz Deutschland lassen sich Mitte Juni auf ein besonderes Wochenende ein: sie öffnen Haus und Hof für Aktivist*innen, die sich für die Agrar- und Ernährungswende einsetzen. Erst wird gemeinsam angepackt, dann über die Zukunft der Landwirtschaft diskutiert. „Hof mit Zukunft“ ist ein immersives Dialogformat des Agrarwende-Bündnisses „Wir haben es satt!“. Das Bündnis bringt regelmäßig viele Tausend Menschen für eine zukunftsfähige Landwirtschaft und ein krisenfestes Ernährungssystem auf die Straße. Die Aktivist*innen tauchen ein in die Realität der Höfe, arbeiten zwei Tage mit und lernen Alltag und Bedürfnisse des besuchten Hof kennen. Die Bäuer*innen erfahren von Motivation und Wünschen ihrer engagierten Besucher*innen. Deutschlandweit beteiligen sich die unterschiedlichsten landwirtschaftliche Betriebe – von bio bis konventionell, groß bis klein, solidarischer Gemüseanbau bis Rindermastbetrieb. Über das gemeinsame Anpacken kommen die Bäuer*innen und Aktivist*innen in den Austausch, lernen die gegenseitigen Positionen kennen und diskutieren ihre Sicht auf die Zukunft der Landwirtschaft: Ähneln sich die Visionen von Bäuer*innen und Aktivist*innen? Welche Perspektiven und Sicherheiten benötigen die Höfe um gutes Essen für alle zu produzieren? Was bringt Bäuer*innen und was bringt Aktivist*innen auf die Straße? Und wie verteilt sich die Verantwortung für den notwendigen Wandel zwischen Politik, Verbraucher*innen und Landwirtschaft? Termininformation Hof mit Zukunft – Aktivismus trifft Landwirtschaft Termin Donnerstag 13. bis Sonntag 16. Juni 2024 Ort auf Höfen in ganz Deutschland Weitere Informationen „Hof mit Zukunft“ | www.wir-haben-es-satt.de/hmz Social Media | #HofMitZukunft Presseeinladung Wir freuen uns sehr über Ihre Berichterstattung im Vorfeld und vor Ort! Wir vermitteln Ihnen gerne Kontakte zu teilnehmenden Landwirt*innen und Aktivist*innen. Pressematerialien und Akkreditierung: https://wir-haben-es-satt.de/presse Teilnehmende Höfe finden Sie auf unserer Übersichtskarte: https://umap.openstreetmap.fr/de/map/hmz-24_1048035#6/51.117/10.459 Terminempfehlung: Für Hofbesuche eignet sich insbesondere Samstag, der 15. Juni. Nicola Puell Presse- und Öffentlichkeitsarbeit Tel.: (030) 28482438 Mobil: (0151) 51245795 E-Mail: presse@meine-landwirtschaft.de Pressemitteilung 23. Mai 2024 PDF-VERSION PDF-VERSION"
