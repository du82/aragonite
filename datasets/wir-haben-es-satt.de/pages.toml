["https://wir-haben-es-satt.de/presse-archiv/berlin-13012021"]
title = "Berlin, 13.01.2021 - Wir haben es satt!"
full_description = 'Pressemitteilung Im Wahljahr für den agrarpolitischen Umbruch: Bauernfeindliche Politik beenden – Landwirtschaft krisenfest machen Höfesterben, Artenschwund und Tierfabriken stoppen / Agrarwende-Protest am 16.1. in Berlin / „Aktion Fußabdruck“ – Tausende beteiligen sich am Protest auf Distanz Berlin, 13.01.21. Wenige Tage vor dem „Wir haben es satt!“-Protest am Kanzleramt fordern 60 Organisationen aus Landwirtschaft und Gesellschaft eine grundlegende Wende in der Agrar- und Ernährungspolitik. Landwirtschaftsministerin Julia Klöckner hat nach fast vier Jahren im Amt kaum Nennenswertes vorzuweisen – außer einer bauern- und umweltfeindlichen Politik. Die rückwärtsgewandte Haltung Deutschlands bei den Verhandlungen zur EU-Agrarreform (GAP) beweisen: Klöckner ist nicht Willens, den gesellschaftlich gewollten Umbau der Landwirtschaft voranzubringen. Im Superwahljahr muss die Landwirtschaftspolitik enkeltauglich werden, denn nur so haben Höfe, Tiere und das Klima eine Zukunft. „Bleibt Zuhause!“, sagt das Bündnis wegen der Pandemie und ruft mit der „Aktion Fußabdruck“ zum Protest auf Distanz auf. Tausende Menschen schicken dieser Tage ihre Fußabdrücke nach Berlin, wo diese am Samstag vor dem Kanzleramt eindrucksvoll in Szene gesetzt werden. Bäuer*innen mit Traktoren und Imker*innen mit Rauchtöpfen repräsentieren die Agrarwende-Bewegung bei dem Protest am Amtssitz von Kanzlerin Merkel – und komplettieren so das imposante Bild, das durch das Meer an Fußabdrücken entsteht. Saskia Richartz, „Wir haben es satt!“-Sprecherin, sagt: „Nach 15 Jahren CDU/CSU im Agrarministerium ist der Reformstau verheerend. Das politische Versagen lässt sich an der Zahl der geschlossenen Höfe und verschwundenen Insekten ablesen. Zur Bundestagswahl formulieren wir fünf Messlatten für eine krisenfeste Landwirtschaft. Wir fordern: Steuergelder nur für den Umbau der Landwirtschaft, weniger Tiere besser halten, Höfesterben stoppen, Pestizideinsatz halbieren und Nein zum EU-Mercosur-Abkommen.“ Elisabeth Waizenegger, Milchbäuerin aus dem Allgäu, von der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL) sagt: "Das unionsgeführte Agrarministerium hat zu verantworten, dass seit 2005 130.000 Höfe schließen mussten. Dumpingpreise und Höfesterben haben wir satt! Die aktuellen Bauerndemonstrationen bei Lebensmitteleinzelhandel und Großmolkereien zeigen die verzweifelte Situation auf vielen Höfen. Wir Bäuerinnen und Bauern sind bereit für Klima-, Arten- und Tierschutz, wenn wir faire Erzeugerpreisen bekommen und unsere Leistungen durch eine bessere EU-Subventionspolitik honoriert werden. Volker Krause von der Bohlsener Mühle und dem Bund Ökologische Lebensmittelwirtschaft (BÖLW) sagt: „In der Lebensmittelbranche sehen wir, dass immer mehr Leute zu gut erzeugtem Essen greifen. Doch die Politik versagt, wenn sie die Verantwortung auf die Verbraucher abwälzt. Für Klima- und Artenschutz und nicht zuletzt zum Schutz vor künftigen Pandemien brauchen wir ein zukunftsfähiges Ernährungssystem. Der sozial-ökologische Umbau der Land- und Lebensmittelwirtschaft muss daher beschleunigt und das EU-Ziel von 25 Prozent Bio-Anbaufläche bis 2030 umgesetzt werden." Johannes Specht von der Gewerkschaft Nahrung-Genuss-Gaststätten (NGG) sagt: „Wir begrüßen das Verbot von Werkverträgen in der Fleischindustrie, für das wir seit langem gekämpft haben. Das ist ein wichtiger Schritt für viele zehntausend Menschen, die in der Branche arbeiten. Doch jetzt muss es weitergehen: Wir wollen in Tarifverhandlungen deutlich höhere Löhne und bessere Arbeitsbedingungen erreichen. In der Fleischbranche sehen wir die Umsetzung ökologischer Nachhaltigkeit nur, wenn auch die soziale Ausbeutung gestoppt wird.“ „Wir haben es satt!“-Protest – TerminübersichtSamstag, 16.01.21, 12 Uhr: „Wir haben es satt!“-Protest inkl. „Aktion Fußabdruck“. Motto: „Agrarwende lostreten, Agrarindustrie abwählen!“ Ort: Bundeskanzleramt, Willy-Brandt-Straße 1, 10557 Berlin.Samstag, 16.01.21, 10 Uhr: Protest der Bäuer*innen mit ihren Traktoren vor der CDU-Zentrale. Ort: Konrad-Adenauer-Haus (CDU-Bundesgeschäftsstelle), Klingelhöferstraße 8, 10785 Berlin.Digitales Rahmenprogramm: Freitag, 15.01.21, 18-23 Uhr, Schnippeldisko – Topf, Tanz, Talk digital. Samstag, 16.01.21, 15:30-19:00 Uhr, Soup & Talk – 5-Minuten-Talks zu guter Landwirtschaft. Weitere Infos: www.wir-haben-es-satt.de/programm Hintergrund:Für eine bäuerliche Landwirtschaft mit mehr Umwelt-, Tier- und Klimaschutz protestiert das „Wir haben es satt!“-Bündnis aus rund 60 Organisationen am 16. Januar vor dem Kanzleramt. Seit 2011 gingen alljährlich zum Auftakt der „Grünen Woche“ Zehntausende unter dem Motto „Wir haben es satt – Essen ist politisch!“ auf die Straße. Wegen der Pandemie hat das Bündnis in diesem Jahr die „Aktion Fußabdruck“ ins Leben gerufen, dank der Protest für die Agrarwende auf Distanz möglich ist. Forderungen des „Wir haben es satt!“-Bündnisses im Superwahljahr: Höfesterben beenden – Bäuer*innen beim Umbau der Landwirtschaft unterstützen!Tierfabriken stoppen – Stallumbau fördern & Tierzahlen reduzieren! Klimakrise bekämpfen – Fleischkonsum senken & gesunde Böden sichern! Pestizidausstieg angehen & Gentechnik stoppen – Gesundheit & Insekten schützen! EU-Mercosur-Abkommen in die Tonne – Menschenrechte statt ungerechte Handelsabkommen!Weitere Informationen: www.wir-haben-es-satt.de Für Rückfragen: Saskia Richartz, „Wir haben es satt!“-Sprecherin, E-Mail: richartz[at]meine-landwirtschaft[dot]de, Mobil: 0177-890 50 54 Elisabeth Waizenegger, Milchsprecherin im Bundesvorstand der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL), E-Mail: rewaizen[at]posteo[dot]de, Telefon: 08330-1413 Volker Krause, Geschäftsführer Bohlsener Mühle und Vorstand des Bund Ökologische Lebensmittelwirtschaft (BÖLW), E-Mail: v.krause[at]bohlsener-muehle[dot]de, Mobil: 0171-990 65 39 Johannes Specht, Leiter der Tarifabteilung, Gewerkschaft Nahrung-Genuss-Gaststätten (NGG), E-Mail: Johannes.Specht[at]ngg[dot]net, Mobil: 0151-126 712 79 Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Tel.: 030-284 82 438 Mobil: 0151-512 45 795 E-Mail: presse[at]meine-landwirtschaft[dot]de Pressemitteilung'
