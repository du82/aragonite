["https://wir-haben-es-satt.de/presse-archiv/berlin-27102018"]
title = "Berlin, 27.10.2018 - Wir haben es satt!"
full_description = "Pressemitteilung EU-Aktionstag für die Agrarwende: Gießkannen-Prinzip abschaffen, bienenfreundliche Landwirtschaft stärken! Bauern, Imker und Ernährungsbewegte fordern Stopp von steuerfinanziertem Artensterben / Klöckner muss sich bei EU-Agrarreform für Bauern und Bienen einsetzen Berlin, 27.10.18. Bauern, Imker und Ernährungsbewegte demonstrieren heute in ganz Europa gemeinsam für eine bienenfreundliche Landwirtschaft und eine grundlegende Neuausrichtung der europäischen Agrarpolitik. In Berlin fordern bei der Aktion „Dampf machen für die Agrarwende“ 1000 Menschen am Brandenburger Tor das Ende des Gießkannen-Prinzips. „Die EU füllt mit Steuergeld vor allem die Taschen von Agrarkonzernen, die für Höfesterben, Monokulturen und Artensterben verantwortlich sind“, kritisiert ‚Wir haben es satt‘-Sprecherin Saskia Richartz und verlangt: „Umwelt-, klima- und tierschädliche Landwirtschaft darf nicht mehr subventioniert werden!“ Mit einer überdimensionalen Strohfrau appelliert das breite Bündnis an die deutsche Agrarministerin: „Julia Klöckner, lassen Sie sich nicht zur Strohfrau der Agrarindustrie machen!“ Hintergrund der europaweiten Proteste unter dem Motto „Good Food Good Farming“ ist die EU-Agrarreform, über die aktuell verhandelt wird. Jahr für Jahr investiert die EU im Rahmen der Gemeinsamen Europäischen Agrarpolitik (GAP) rund 60 Mrd. Euro in den europäischen Agrarsektor. Deutschland entscheidet bei den Verhandlungen maßgeblich darüber mit, welche Landwirtschaft sich künftig lohnt. In der nächsten Förderperiode muss die Politik endlich die hunderttausenden europäischen Bauern unterstützen, die zukunftsfähig wirtschaften. Sie sind es, die mit ihrer Arbeit die Landwirtschaft wieder mit Umwelt-, Klima-, Arten- und Tierschutz in Einklang bringen wollen. Auf der Kundgebung in Berlin erklären für das 'Wir haben es satt!'-Bündnis: Paula Gioia, Imkerin und Bäuerin aus Brandenburg und aktiv in der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL): „Es kann keine Zukunft ohne Bienen oder Bäuerinnen und Bauern geben. Denn ohne Bienen keine Bestäubung, ohne Bäuerinnen und Bauern kein gesundes Essen. Bei der EU-Agrarreform muss die Politik jetzt dafür sorgen, dass die Agrargelder nur noch bäuerlichen Betrieben zugutekommen, die bienenfreundlich und enkeltauglich ackern. Wir brauchen eine Agrarpolitik, die es jungen Menschen ermöglicht, auf dem Land zu leben und zu arbeiten. In ganz Europa gehen heute Tausende für lebendige ländliche Räume auf die Straße. Bauernrechte jetzt – auch in der EU-Agrarpolitik!“ Trees Robijns vom Naturschutzbund Deutschland (NABU): „Dieser Hitzesommer war ein Weckruf: Mit Steuermilliarden entwässerte Wiesen und Äcker waren der Trockenheit nicht gewachsen. Mit unseren Insekten verschwinden zudem wichtige Bestäuber für die Lebensmittelerzeugung. Es liegt jetzt an Klöckner und Merkel, in Brüssel den Schalter umzulegen. Wir brauchen eine andere Agrarförderung. Leistungen der Landwirte zum Schutz von Umwelt, Klima, Biodiversität und besseren Tierhaltung müssen endlich angemessen honoriert werden. Nur so können wir unsere Lebensgrundlagen auf Dauer erhalten.“ Louise Duhan von Slow Food Deutschland: „Die Artenvielfalt ist das Immunsystem des Planeten. Wir brauchen gesunde Lebensmittel, die umwelt- und klimaverträglich erzeugt werden. Es ist unerträglich, dass die EU mit Steuermilliarden das Artensterben finanziert. Die Produkte, die unter massivem Einsatz von Glyphosat und anderen Ackergiften hergestellt werden, dürfen künftig nicht mehr mit Steuergeld gefördert werden. Deswegen fordern wir von Julia Klöckner eine Ernährungspolitik, die sich von Pestiziden unabhängig macht.“ Hintergrund:Unter dem Motto „Good Food Good Farming“ sind rund um den 27. Oktober beim europäischen Aktionstag Zehntausende an über 60 Orten in 19 Ländern für gutes Essen und gute Landwirtschaft aktiv. Auch in einer Online-Petition setzen sich schon mehr als 80.000 Menschen aus ganz Europa für eine gerechte und ökologische EU-Agrarreform ein. Am 19./20. November beraten die EU-Agrarminister wieder über die GAP-Reform, mit dem Ziel schon Anfang 2019 eine erste politische Stellungnahme zu verabschieden. Die zuständigen Ausschüsse im Europäischen Parlament werden voraussichtlich bis Februar 2019 ihre Positionen vorlegen. Terminhinweis: Am 19. Januar 2019 findet die nächste ‚Wir haben es satt!‘-Großdemonstration statt. Auftakt ist um 12 Uhr am Brandenburger Tor. Zentrale Themen sind die EU-Agrarreform, eine klimagerechte Landwirtschaft und gutes Essen für alle. Weitere Informationen: www.wir-haben-es-satt.de Für Rückfragen: Paula Gioia, Arbeitsgemeinschaft bäuerliche Landwirtschaft, Mobil: 0152-05764591, E-Mail: paula.gioia[at]eurovia[dot]org Trees Robijns, Agrarpolitikexpertin beim Naturschutzbund Deutschland (NABU), Mobil 0173-4726122, E-Mail: Trees.Robijns[at]NABU[dot]de Louise Duhan, Slow Food Deutschland, Mobil: 0157-88492505, E-Mail: s.sheets[at]slowfood[dot]de Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher E-Mail: presse[at]meine-landwirtschaft[dot]de Tel.: 030-28482438 | Mobil: 0151-51245795 Fotos zur kostenfreien Nutzung Zum Download bitte auf das Bild klicken. Quellenangabe: Nick Jaussi / www.wir-haben-es-satt.de Pressemitteilung"
