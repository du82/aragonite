title = "Berlin, 16.1.17 - Wir haben es satt!"
full_description = "Pressemitteilung Krisen in der Landwirtschaft: Minister Schmidt konzept- und tatenlos „Wir haben es satt!“-Bündnis stellt im Wahljahr neun Forderungen für eine bäuerliche, ökologische, wirtschaftliche und soziale Agrar- und Ernährungswende vor Berlin, 16.01.2017. Wenige Tage vor der „Wir haben Agrarindustrie satt!“-Demonstration, zu der auch im siebten Jahr viele tausende Teilnehmer erwartet werden, ziehen die Veranstalter eine ver­heerende Bilanz der Amtszeit von Bundeslandwirtschaftsminister Christian Schmidt. Der Zusammen­schluss aus Bauern, handwerklichen Lebensmittelherstellern und zivilgesellschaftlichen Organisatio­nen wirft dem Minister Konzeptlosigkeit auf ganzer Linie vor. Seit seinem Amtsantritt vor fast drei Jahren habe sich der CSU-Politiker den Herausforderungen im Agrarbereich nicht gestellt und keine ernsthaften Schritte unternommen, um die schweren Krisen der Landwirtschaft zu überwinden. Da­her wollen die rund 100 aufrufenden Organisationen im Wahljahr 2017 eine neue Agrar- und Ernäh­rungspolitik auf die politische Agenda setzen. In Berlin stellen die Organi­satoren heute neun Forde­run­gen für Bauernhöfe statt Agrarindustrie, für gesundes Essen und Demokratie statt Konzernmacht vor. Die Lage in der Landwirtschaft ist nach wie vor dramatisch: In den letzten zehn Jahren haben mehr als 100 000 landwirtschaftliche Betriebe in Deutschland aufgegeben. Die kleinen und mittle­ren Bau­ernhöfe sind die Leidtragenden dieser fatalen Entwicklung, für die der Minister mit seiner Politik des Wegschauens verantwortlich ist. Ulrich Jasper von der Arbeitsge­meinschaft bäuer­liche Landwirt­schaft, erklärt: „Mit Christian Schmidt haben wir leider den schwächsten Landwirt­schaftsminister der letzten Jahrzehnte. Und das ausgerechnet in einer Zeit, in der es wichtiger denn je ist, die Probleme in der Landwirtschaft gemeinsam anzupacken. Wir stehen vor einem aufwändigen Umbau hin zu einer zukunftsfähigen, umweltfreundlichen und das Tierwohl beach­tenden bäuerlichen Landwirtschaft. Doch der Minister stellt weder die finanziellen Mittel zur Verfü­gung noch schafft er Orientierung oder konkrete Angebote. Er lässt Bauern und Gesellschaft mit den Aufgaben alleine.“ Jedes Jahr zur Grünen Woche kündigt Bundesminister Schmidt symbolträchtige Projekte an, die bei genauerer Betrachtung kaum Substanz haben. Dabei ist die Aufgabenliste des Ministers lang: Anstelle des angekündigten freiwilligen Tierwohl-Labels ist eine Tierhaltungs- und Herkunfts-Kenn­zeichnung mit klaren Kriterien und finanziellen Anreizen für tiergerechte Haltungsbedingungen dringend nötig. Das Artensterben schreitet wegen der Intensivland­wirtschaft und des flächendeckenden Einsatzes von Pestizi­den immer weiter voran. Das höchst umstrittene Gentechnikgesetz muss klare Vorgaben ma­chen, statt mit einem „Flickenteppich“ Gentechnik durch die Hintertür auf deutsche Äcker zu brin­gen. Auch in der lang anhaltenden Milchkrise muss der Erhalt vieler tau­sender Betriebe sichergestellt werden. Der Minister sollte Partei für die Vielfalt von Betrieben im ländlichen Raum ergreifen und endlich den Schulterschluss mit der Agrarindustrie beenden. Matthias Brümmer von der Gewerkschaft Nahrung, Genussmittel und Gaststätten (NGG), der auf der Auftaktkundgebung der Demonstration sprechen wird, kritisiert die prekären Arbeits­verhält­nisse in der Fleischindustrie. Trotz des Mindestlohns und der Selbstver­pflichtung der deutschen Fleischin­dustrie hat sich an der Summe der Werk­vertragsar­beiter fast nichts verändert. Brümmer erklärt: „Die wachsende Konzentration in der Fleisch­wirtschaft wird bei der NGG mit Sorge gesehen. Noch vor 15 Jahren spielte die deut­sche Fleisch­industrie in Europa kaum eine Rolle, heute steht sie an erster Stelle und baut ihre Vormachtstel­lung weiter aus. Viele eu­ropäische Gewerkschaftsverbände beklagen diese Entwick­lung, die dazu geführt hat, dass bereits mehrere zehntausend Arbeitsplätze vernichtet worden sind. Ein Ende ist nicht absehbar.“ Die Tendenz zu Megaställen lässt sich insbesondere im Be­reich der Schweinefleischproduktion nachvollziehen. Hier haben seit 2010 rund 60 Prozent der Schweine hal­tenden Bauern aufgegeben, während gleichzeitig die Tierzahl pro Betrieb um 144 Prozent an­gestie­gen ist. Um die Missstände in der Land- und Ernährungswirtschaft zu überwinden, legt das „Wir haben es satt!“-Bündnis zum Wahljahr 2017 neun Forderungen für eine neue Agrarpolitik vor: So fordern die Demonstranten etwa, bis 2020 müssen 50 Prozent der öf­fentlichen Beschaffung aus regio­naler und ökologischer Landwirtschaft kommen. Außerdem muss der Antibiotikaeinasatz bis 2020 halbiert und Reserveanti­biotika verboten werden. In Intensivtierhaltungs­gebieten sollen die Tierbe­stände redu­ziert werden und die Tierhaltung an die Betriebsfläche ge­bunden werden, um weitere Klagen wegen Verletzung der europäischen Nitratrichtlinie zu verhin­dern. Antje Kölling von Demeter erläutert eine weitere Forderung: „Die Bundesregierung muss jetzt dringend handeln! Sie kann z.B. jährlich 500 Mil­lionen Euro von der Flächenprämie für eine ökologische und tierge­rech­tere Landwirtschaft umschich­ten – das hat sie selbst in der Hand. Bauern ernähren uns und pflegen unsere Landschaft, dafür müs­sen sie fair be­zahlt werden. Statt auf mehr Einkommen aus Exporten zu setzen, muss der Landwirt­schaftsmi­nister für mehr Wertschätzung, für regionale Wirtschaftsstruktu­ren und für engere Beziehun­gen zwischen Stadt und Land sorgen.“ Deutschland habe eine globale Verantwortung und dürfe nicht weiter mit Dumpingexporten kleinbäuerliche Strukturen im Süden zerstören. „Am meisten freut mich, dass die Demonstration in diesem Jahr von einem Block Jungbäuerinnen und Jungbauern angeführt wird, die sich für eine Zukunft auf dem Land einsetzen“, sagt Jochen Fritz, Or­ganisator der „Wir haben es satt!“-Demonstration. „Auch freut mich, dass unsere Debatten nach sie­ben Jahren mittlerweile nicht nur in der Mitte der Ge­sellschaft, sondern auch in der Branche ange­kommen sind. Wir zeigen einen Weg auf, bei dem Bauern, Verarbeiter und Verbraucher profitieren. Jetzt ist die Politik am Zug und muss dem gesellschaftlich gewollten Umbau hin zu einer sozial gerech­ten, tier- und umweltfreundlichen Landwirtschaft konsequent umsetzen.“ Die „Wir haben Agrarindustrie satt!“-Demonstration wird von tausenden Bäuerinnen und Bauern – konventionell und bio – getragen, von denen viele mit Traktoren aus dem gesamten Bundesge­biet anreisen. Zusammen mit rund 100 Organisationen aus der Zivilgesellschaft treten sie für eine Land­wirtschaft und Lebens­mittelpolitik ein, in der Bauern fair entlohnt werden und sich alle Menschen gesund ernähren kön­nen. Der Auftakt der Demonstration findet am Samstag, den 21.1.17 um 12 Uhr am Potsdamer Platz statt. Alle Menschen, die sich für gute Landwirtschaft und gesundes Essen ein­setzen, sind herz­lich willkommen an der Demonstration teilzunehmen. Für Rückfragen: Ulrich Jasper, Bundesgeschäftsführer der Arbeitsgemeinschaft bäuerliche Landwirtschaft, Mobil: 0160-94804331, Mail: jasper(at)abl-ev.de Matthias Brümmer, Geschäftsführer der Gewerkschaft NGG, Region Oldenburg/Ostfriesland, Mobil: 0160-4716206, Mail: region.oldenburg(at)ngg.net Antje Kölling, Politik und Öffentlichkeitsarbeit, Demeter e.V., Mobil: 0157-58249201, Mail: antje.koelling(at)demeter.de Jochen Fritz, Leiter der Kampagne „Meine Landwirtschaft“/“Wir haben es satt!“, Mobil: 0171-8229719, Mail: fritz(at)meine-landwirtschaft.de Pressekontakt: Christian Rollmann, „Wir haben es satt!“, Mobil: 0151-51245795, Mail: rollmann(at)meine-landwirtschaft.de Pressemitteilung"
