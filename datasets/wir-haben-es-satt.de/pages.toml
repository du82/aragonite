title = "Demo 2019 - Wir haben es satt!"
full_description = "YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Pressespiegel Fernsehen und Videoberichte Wir haben es satt!-Videorückblick RTF 1 MDR Thüringen RBB Abendschau NDR NDR Niedersachsen Tagesschau 20 Uhr ZDF heute 19 Uhr ZDF heute journal, ab Min. 11:43 Welt/N24 n-tv RBB Abendschau Brandenburg Aktuell Reuters DW NDR Schleswig-Holstein Magazin BR 24 BR 24 SWR Aktuell Rheinland-Pflalz BR Rundschau, ab Min. 16 BR 24 ARD Bericht aus Berlin, ab Min. 8:45 NDR Extra3 NDR BR Radio Domradio Inforadio Radio 8 Domradio WDR 5 Radio Eins Inforadio Deutschlandfunk Kultur Radio 9.12 Deutschlandfunk WDR 5 NDR 2 RBB24 Berliner Kurier junge Welt WEITERLESEN RBB24 Berliner Kurier junge Welt BR24 Der Tagesspiegel Euraktiv RTL taz Welt junge Welt Sozialismus Info taz chrismon Unsere Kirche RBB24 Rote Fahne News RTL Utopia Erneuerbare Energien Berliner Zeitung Euractiv RBB24 Yahoo! Nachrichten n-tv Berliner Morgenpost Boerse-Express Focus RTL RTL taz Potsdamer Neueste Nachrichten MDR Der Tagesspiegel Berliner Kurier WEITERLESEN Der Tagesspiegel Berliner Kurier ZDF ZDF Zeit Online Berliner Zeitung Der Tagesspiegel Der Tagesspiegel MDR klimareporter Handelsblatt junge Welt Der Tagesspiegel Vegpool Neues Deutschland RBB24 ze.tt Zeit Online berlin.de RTL RTL RTL Deutschlandfunk Kultur Berliner Zeitung Bild junge Welt taz Tagesschau RP online Süddeutsche Zeitung junge Welt Informationsdienst Gentechnik Pressenza junge Welt RBB24 Telepolis Mitteldeutsche Zeitung Stadtspiegel Herten Der neue Wiesenbote Hessische/ Niedersächsische Allgemeine (HNA) WEITERLESEN Stadtspiegel Herten Der neue Wiesenbote Hessische/ Niedersächsische Allgemeine (HNA) Märkische Allgemeine Cellesche Zeitung Haller Kreisblatt Mittelbayrische Hessische/ Niedersächsische Allgemeine (HNA) Märkische Allgemeine BR24 MDR Passauer Neue Presse Radio 8 Halle Spektrum Leipziger Zeitung Mitteldeutsche Zeitung Naumburger Tagesblatt NWZ online Uckermark Kurier Verdener Nachrichten/ Weser Kurier Zollern-Alb-Kurier SWR aktuell Stadtspiegel Herten/Marl Hessische/ Niedersächsische Allgemeine (HNA) Hessische/ Niedersächsische Allgemeine (HNA) Osnabrücker Zeitung Reutlinger Generalanzeiger Main Post Osnabrücker Zeitung Esslinger Zeitung Neue Westphälische Schwäbische Lausitzer Rundschau Fuldainfo Badische Zeitung Ostsee-Zeitung Mittelbayrische Radio 8 Hessenmagazin topagrar Proplanta Agrarzeitung WEITERLESEN topagrar Proplanta Agrarzeitung topagrar Fleischwirtschaft Bauernzeitung topagrar agrarheute Schweizer Bauer topagrar topagrar Südtirol News Daily Sabah Wiener Zeitung WEITERLESEN Südtirol News Daily Sabah Wiener Zeitung 9. Wir haben es satt!-Demo am 19. Januar 2019 Aufruf Der Agrarindustrie den Geldhahn abdrehen! Für eine bäuerlich-ökologischere Landwirtschaft und artgerechte Tierhaltung, für Klimagerechtigkeit und gutes Essen! Gutes Essen, eine klimagerechte Landwirtschaft und der Erhalt der Bauernhöfe – das steht gerade auf dem Spiel. 2019 entscheidet die Bundesregierung bei der EU-Agrarreform (GAP) maßgeblich mit, welche Landwirtschaft die EU Jahr für Jahr mit 60 Milliarden Euro unterstützt. Aktuell gilt: Wer viel Land besitzt, bekommt viel Geld. Schluss mit den Steuermilliarden an die Agrarindustrie! Der Umbau zu einer bäuerlichen und ökologischeren Landwirtschaft kann nicht mehr warten. Bei den Verhandlungen in Brüssel muss sich die Bundesregierung an die Seite der Bäuerinnen und Bauern stellen, die Tiere artgerecht halten, insektenfreundliche Landschaften schaffen und gutes Essen herstellen. Deswegen schlagen wir – die bunte, vielfältige und lautstarke Bewegung – mit unseren Töpfen Alarm für die Agrarwende! Für eine klimagerechte Landwirtschaft und gutes Essen! Das Dürrejahr 2018 hat gezeigt: So geht es nicht weiter! Wir reihen uns ein in die globale Bewegung für Klimagerechtigkeit und fordern konsequenten Klimaschutz. Denn wir brauchen noch mehr bäuerliche Betriebe, die regionale und saisonale Lebensmittel erzeugen und mit lebendigen Böden helfen, das Klima zu schützen. EU-Agrargelder nur noch für umwelt- und klimaschonende Landwirtschaft! Für viele bäuerliche Betriebe … Wir haben Respekt für die harte Arbeit, die Bäuerinnen und Bauern jeden Tag leisten. Doch die Politik lässt die Höfe im Stich. Über 100.000 Betriebe mussten bei uns in den letzten 10 Jahren dichtmachen. Gleichzeitig reißen sich außerlandwirtschaftliche Investor*innen mit EU-Subventionen immer mehr Land unter den Nagel. Die fatalen Folgen: Höfesterben und Monokulturen, Glyphosat und Artenschwund, Megaställe und Antibiotikaresistenzen. Stoppt die Subventionen an Agrarwüsten, Tierfabriken und Großgrundbesitz! … und ein solidarisches Europa! In vielen europäischen Schlachthöfen und Treibhausplantagen herrschen unwürdige Arbeitsbedingungen, damit Discounter und die Exportindustrie mit Dumpingpreisen immer größere Profite machen können. Im globalen Süden zwingt die EU vielen Staaten Freihandelsverträge auf und ruiniert mit Billigexporten dann Millionen Kleinbäuerinnen und -bauern. Für uns ist klar: In einem solidarischen Europa sind gerechter Handel, Menschen- und Bauernrechte nicht verhandelbar! Essen ist politisch! Auf dem Land und in der Stadt zeigen wir gemeinsam, dass es anders und besser geht. Immer mehr Bäuerinnen und Bauern ackern ohne Glyphosat, halten ihre Tiere artgerecht und füttern gentechnikfrei. Immer mehr Menschen machen Foodsharing, sind Teil einer Solidarischen Landwirtschaft und entscheiden sich an der Ladentheke für gutes, handwerklich erzeugtes Essen aus der Region. Wir schauen über den Tellerrand und treten gemeinsam ein für die globale Agrar- und Ernährungswende und für ein Europa ohne Ausgrenzung und Rassismus! Wir haben die unerträgliche Klientelpolitik satt! Agrarministerin Julia Klöckner darf sich nicht länger vor den Karren der Agrarlobby spannen lassen. Bei der EU-Agrarreform muss sie der Agrarindustrie endlich den Geldhahn zudrehen und eine Politik für Menschen, Tiere und Umwelt machen! Wir fordern: Schluss mit dem Gießkannen-Prinzip! Subventionen nur noch für umwelt- und klimaschonende Landwirtschaft!Öffentliche Gelder nur noch für artgerechte Tierhaltung!Mehr Unterstützung für kleine und mittlere Betriebe, die gute Lebensmittel für uns alle erzeugen! Sei dabei, wenn wir dafür mit Zehntausenden im politischen Berlin demonstrieren. Wenn sich bei der weltgrößten Agrarmesse „Grüne Woche“ und dem Agrarministergipfel alles um die Zukunft von Essen und Landwirtschaft dreht, fordern wir gemeinsam den Umbau der Landwirtschaft: Wir haben Agrarindustrie satt – Essen ist politisch! Demonstration: 19. Januar 2019 | 12 Uhr | Brandenburger Tor | Berlin FOTOS DEMO FOTOS TRAKTOR-DEMO FOTOS BAUERNPROTEST Bundestag Bühnenbild Demomenge Demo_Detail Plakat Glyphosat Demo_Detail #carousel-backgroundimage-4799-277 { background-image: url('/fileadmin/_processed_/b/5/csm_Bild_Bundestag_7c2b8203fc.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-4799-277 { background-image: url('/fileadmin/_processed_/b/5/csm_Bild_Bundestag_c5efefc4c5.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-4799-277 { background-image: url('/fileadmin/_processed_/b/5/csm_Bild_Bundestag_951b98d368.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-4799-277 { background-image: url('/fileadmin/_processed_/b/5/csm_Bild_Bundestag_b296040706.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-4799-277 { background-image: url('/fileadmin/_processed_/b/5/csm_Bild_Bundestag_e4fd78e59d.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-4799-277 { background-image: url('/fileadmin/_processed_/b/5/csm_Bild_Bundestag_d991357fff.jpg'); } } #carousel-backgroundimage-4799-276 { background-image: url('/fileadmin/_processed_/8/d/csm_Bild_mBuehne_fb88c7f939.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-4799-276 { background-image: url('/fileadmin/_processed_/8/d/csm_Bild_mBueh