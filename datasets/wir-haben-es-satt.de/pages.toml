["https://wir-haben-es-satt.de/presse-archiv/berlin-07092021"]
title = "Berlin, 07.09.2021 - Wir haben es satt!"
full_description = 'Pressemitteilung Megaställe stoppen – Bauernhöfe statt Tierfabriken! „Wir haben es satt!“-Bündnis fordert klimagerechte Agrar- und Ernährungspolitik: Tierfabriken stoppen, Tierzahlen reduzieren, Fleischkonsum senken und Höfe retten Berlin, 7.9.21. Mit Tiermasken verkleidete Demonstrant:innen fordern heute vor dem Bundestag: Bauernhöfe statt Tierfabriken! Vor der Bundestagswahl treten die Vertreter:innen des „Wir haben es satt!“-Bündnisses für eine zukunftsfähige Agrarpolitik ein. Konkret heißt das: Die nächste Bundesregierung muss die Abstockung der Tierzahlen bei gleichzeitigem Erhalt der Höfe voranbringen. Der Brand in Alt Tellin, wo Ende März knapp 60.000 Schweine starben, ist nur die Spitze des Eisbergs des brandgefährlichen Billigfleisch-Systems. In der aktuellen Legislaturperiode gab es bundesweit bei 27 Bränden in Großstallanlagen über 240.000 tote Tieren. Trotz der gravierenden Brand- und Tierschutz-Bedenken sind derzeit 2,5 Millionen zusätzliche Tierplätze in Megaställen geplant. (1 | 2) Diese Entwicklung steht nicht nur im krassen Widerspruch zum Tierschutz. Auch der vom Verfassungsgericht geforderte Klimaschutz und eine klimagerechte Ernährung lassen sich so nicht erreichen. Wissenschaftler:innen empfehlen eine Fleischreduktion von rund 70 Prozent, damit unsere Überlebensgrundlage auf dem Planeten gesichert wird. (3)Reinhild Benning von der Deutschen Umwelthilfe sagt: „In Deutschland sind 50 neue Megamastanlagen mit mehr als 2,5 Millionen Tierplätzen geplant. Wir fordern einen sofortigen Genehmigungsstopp für Tierfabriken. Die nächste Bundesregierung muss noch in den ersten 100 Tagen gesetzliche Regeln für Tierschutz und Luftreinhaltung definieren, damit Bäuerinnen und Bauern in den Umbau und die Abstockung der Tierzahlen investieren können. Eine staatliche Abgabe auf Fleisch aus Massentierhaltung muss zur Finanzierung der umbauwilligen Betriebe beitragen.“Saskia Richartz, Sprecherin des „Wir haben es satt!“-Bündnisses, sagt: „Die industrielle Tierhaltung ist fatal für die Tiere, das Klima und uns Menschen. Die Erdüberhitzung können wir nur mindern, wenn wir weniger Tiere besser halten und den Fleischkonsum massiv reduzieren. Wir fordern jetzt eine mutige Politik, die pflanzliche und fleischlose Alternativen auf die Teller bringt und den Umbau der Tierhaltung anpackt.“Leo Kraus vom Arbeitskreis Alt Tellin (Mecklenburg-Vorpommern) sagt: „Alt Tellin war eine Katastrophe mit Ansage. Knapp 60.000 Schweine verbrannten, weil der mecklenburgische Agrarminister Backhaus (SPD) die Tierfabrik allen Warnungen zum Trotz durchgewunken hat. Der Wiederaufbau dieses Megastalls muss verhindert werden. Stattdessen soll Alt Tellin zum Mahnmal gegen Massentierhaltung werden.“ Heinz-Günther Klass, Bauer aus Wiesenhagen in Brandenburg, sagt: „Wir Bauern haben Tierfabriken satt! Tiere gehören auf die Weide und an die frische Luft, nicht in Megaställe. Wir brauchen jetzt einen klaren Fahrplan und finanzielle Unterstützung beim Umbau der Tierhaltung. Schluss mit der Politik für Konzerne! Stattdessen muss gelten: Jeder Hof zählt – Höfesterben stoppen!“ Für Rückfragen: Reinhild Benning, Deutsche Umwelthilfe, Mobil: 0151 179 18 487, E-Mail: benning[at]duh[dot]de Saskia Richartz, „Wir haben es satt!“-Bündnis, Mobil: 0177 890 50 54, E-Mail: richartz[at]meine-landwirtschaft[dot]de Leo Kraus, Arbeitskreis Alt Tellin, Mobil: 0157 888 75 901. E-Mail: info[at]provie-theater[dot]de Heinz-Günther Klass, Bauer aus Wiesenhagen, Brandenburg, Mobil: 0163 685 37 98, E-Mail: klasswiesenhagen[at]posteo[dot]de Pressekontakt: Christian Rollmann „Wir haben es satt!“-Pressesprecher Tel.: 030-28482438, Mobil: 0151-51245795 E-Mail: presse[at]meine-landwirtschaft[dot]de Fotos zur kostenfreien Nutzung Fotos vom "Wir haben es satt!"-Protest gegen Megaställe am 7.9.21 zur kostenfreien Nutzung gegen Angabe der Quelle. Zum Download bitte auf das Bild klicken. Quelle: Fabian Melber/www.wir-haben-es-satt.de Pressemitteilung'
