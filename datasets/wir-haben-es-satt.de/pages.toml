title = "Gerechter Handel - Wir haben es satt!"
full_description = 'Hintergrundinfos: Forderungspapier Initiative Faire Preise Hintergrundpapier Supermarktmacht Faire Erzeuger*innenpreise in der Landwirtschaft Marktstellung für Milcherzeuger jetzt wirksam stärken Positionspapier Wertschöpfung in der Lebensmittelkette Konzernatlas Widerspruch Agrarökologie und Freihandelsabkommen Positionspapier des Netzwerk Gerechter Welthandel Aufruf zur 15. "Wir haben es satt!"-Demo 2025 Positionen und Forderungen Gerechter Handel und faire Preise Weltweit sind bäuerliche Betriebe in ihrer Existenz bedroht, weil Mechanismen für langfristige und stabile Erzeuger*innenpreise fehlen. Klima-, Tier- und Gewässerschutz in der Landwirtschaft sind unter dem herrschenden Kostensenkungsdruck für Bäuerinnen und Bauern kaum leistbar. Bisher landen die Profite aus dem Lebensmittelverkauf meistens auf den Konten von Supermärkten, dem Online- und Zwischenhandel und der Ernährungsindustrie. Auch wenn Lebensmittelpreise für die Endverbraucher*innen gestiegen sind, erhalten viele Erzeuger*innen unserer Lebensmittel einen Preis, der zum Leben kaum reicht. Statt fairen Handel und Nachhaltigkeit zu fördern, öffnet die EU mit Handelsabkommen wie EU-Mercosur unsere Märkte für Billigimporte: Mit der geplanten Abschaffung von Zöllen auf 82 Prozent aller Agrarimporte wird mehr Rindfleisch und Soja in die EU gelangen, was den Preisdruck auf die heimischen Bäuerinnen und Bauern weiter verschärft. In Lateinamerika führt der Deal zur weiteren Zerstörung der Regenwälder, zur Verdrängung kleinbäuerlicher Strukturen und zur Verschärfung der Hungerkrise. Handelsabkommen wie EU-Mercosur stärken vor allem die Interessen der Konzerne, während Verbraucherschutz, Tierwohl und Umweltstandards geschwächt werden. Unsere Forderungen: Faire Erzeuger*innenpreise weltweit sichern – Preisdiktate der Lebensmittelindustrie und des Einzelhandels beenden Position der Bäuerinnen und Bauern innerhalb der Wertschöpfungskette stärken, z. B., indem Milchbauern ihre Preise gegenüber den Molkereien selbst verhandeln und Mindestpreise für Nachhaltigkeitsstandards vereinbart werden können Gerechte Handelspolitik statt ausbeuterischer Handelsabkommen: Menschenrecht auf Nahrung sichern und Ernährungssouveränität stärken Hintergrundinfos: Forderungspapier Initiative Faire Preise Hintergrundpapier Supermarktmacht Faire Erzeuger*innenpreise in der Landwirtschaft Marktstellung für Milcherzeuger jetzt wirksam stärken Positionspapier Wertschöpfung in der Lebensmittelkette Konzernatlas Widerspruch Agrarökologie und Freihandelsabkommen Positionspapier des Netzwerk Gerechter Welthandel ← ÜBERSICHT → Hintergrundinfos: Forderungspapier Initiative Faire Preise Hintergrundpapier Supermarktmacht Faire Erzeuger*innenpreise in der Landwirtschaft Marktstellung für Milcherzeuger jetzt wirksam stärken Positionspapier Wertschöpfung in der Lebensmittelkette Konzernatlas Widerspruch Agrarökologie und Freihandelsabkommen Positionspapier des Netzwerk Gerechter Welthandel'
