["https://wir-haben-es-satt.de/presse-archiv/berlin-13012020"]
title = "Berlin, 13.01.2020 - Wir haben es satt!"
full_description = 'Pressemitteilung Der Landwirtschaft eine Perspektive geben: Agrarwende anpacken! Berlin, 13.01.20. Wenige Tage vor der großen „Wir haben es satt!“-Demonstration am 18. Januar fordern 100 Organisationen aus Landwirtschaft und Gesellschaft von der Bundesregierung, das Höfe- und Insektensterben zu stoppen, das EU-Mercosur-Abkommen zu verhindern und endlich die Klimakrise ernsthaft zu bekämpfen. Auf einer Pressekonferenz in Berlin warfen Bündnis-Vertreter*innen der Regierung vor, Bauernhöfe weiter die eigenen politischen Versäumnisse ausbaden zu lassen statt sich den Zukunftsaufgaben zu stellen.„Agrarwende anpacken, Klima schützen!“ lautet das Motto der Demonstration, bei der zum Auftakt der Grünen Woche wieder Zehntausende auf die Straße gehen. Im Schulterschluss mit der Gesellschaft treten Bäuer*innen, Imker*innen, Bäcker*innen und Köch*innen am Samstag im Berliner Regierungsviertel für artgerechte Tierhaltung, Artenvielfalt und konsequenten Klimaschutz ein.Während der EU-Ratspräsidentschaft in der zweiten Jahreshälfte muss Deutschland mit der EU-Agrarreform die Agrarwende anschieben. Damit bekommen die Bauernhöfe eine Zukunft, die Tiere mehr Platz und der Klimaschutz eine Chance – und die gesamte Landwirtschaft würde endlich wieder von der Gesellschaft akzeptiert. Saskia Richartz („Wir haben es satt!“-Sprecherin) sagt mit Blick auf die EU-Agrarreform, deren Verhandlungen 2020 auf die Zielgerade einbiegen:„Julia Klöckner muss jetzt endlich der zukunftsfähigen Landwirtschaft eine Perspektive geben. Mit den 60 Milliarden Euro an EU-Agrar-Fördergeldern im Jahr können europaweit Bäuerinnen und Bauern bei der Agrarwende unterstützt werden. Statt auf Billigexporte und unfaire Handelsabkommen sollte die Bundesregierung auf hochwertiges, regionales Essen setzen. Dann müssten die Bäuerinnen und Bauern auch nicht mehr befürchten, dass sie die Zeche für eine falsche Politik zahlen müssen.“ Georg Janßen (Arbeitsgemeinschaft bäuerliche Landwirtschaft) erklärt für die bäuerlichen Organisationen im Demonstrations-Bündnis:„Der Umbau der Landwirtschaft ist eine große Herausforderung. Damit dieser gelingt, muss der Schlingerkurs des Bundeslandwirtschaftsministeriums aufhören. Wir Bäuerinnen und Bauern machen Politik und Gesellschaft ein konkretes Angebot: Bis 2035 werden wir in Deutschland flächendeckend umwelt- und klimaschonenden Ackerbau praktizieren und unsere Nutztiere artgerecht halten, wenn hierfür endlich ein politischer und wirtschaftlicher Rahmen geschaffen wird.“ Reinhild Benning (Germanwatch) blickt auf ein Jahrzehnt Landwirtschaftsministerium unter Führung der CDU/CSU zurück:„Ein Jahrzehnt des organisierten Versagens im Agrarministerium liegt hinter uns. Zuerst unternahm Ilse Aigner zu lange nichts gegen Dioxin-Eier, dann kam Christian Schmidts Alleingang bei der Glyphosat-Wiederzulassung. Die jetzige Ministerin Julia Klöckner schwingt im Nestlé-Video Lobreden auf die Ernährungsindustrie und verhindert zugleich die Lebensmittel-ampel und die verbindliche Haltungskennzeichnung auf Fleisch. Die Bundesregierung verstärkt die Macht der Lebensmittel- und Agrar-Chemie-Konzerne – auf Kosten von bäuerlichen Existenzen, mehr Transparenz und gesunder Ernährung." Antonio Andrioli (Universitätsprofessor und Agrar-Experte aus Brasilien) sagt:„Das geplante Freihandelsabkommen zwischen der EU und den Mercosur-Staaten wäre fatal für die bäuerliche Landwirtschaft auf beiden Seiten des Atlantiks. Damit würde sich das agrarindustrielle Modell mit Gentechnik, Pestiziden und Tierfabriken noch mehr verfestigen. Wir freuen uns, dass auch in Deutschland der Protest gegen das Abkommen wächst. Deutschland muss ein Veto einlegen, nicht zuletzt damit die Brandrodungen im Amazonas eingedämmt werden.“ Nicolas Barthelmé (Du bist der Chef! Die Verbrauchermarke) berichtet, wie in Frankreich Verbraucher*innen gemeinsam Verantwortung für Bauernhöfe übernehmen:„Wer weiß, was drin steckt und entscheiden darf, wie Lebensmittel produziert werden sollen, zahlt auch einen höheren Preis für gutes Essen. Wenn die Menschen eine echte Wahl haben, entscheiden sie sich an der Ladentheke für mehr Umweltschutz, Tierwohl und faire Preise für die Bauernhöfe. Dafür braucht es Mitbestimmung und Transparenz – und das stellen wir mit unserer Initiative sicher, die demnächst auch in Deutschland auf den Markt kommt.“ Hintergrund: Die „Wir haben Agrarindustrie satt!“-Demonstration wird von Tausenden Bäuerinnen und Bau-ern – konventionell und bio – getragen, von denen etliche mit ihren Traktoren aus dem gesam-ten Bundesgebiet anreisen. Zusammen mit rund 100 Organisationen aus der Gesellschaft treten sie für eine Landwirtschaft und Lebensmittelpolitik ein, in der Bauernhöfe fair entlohnt werden und sich alle Menschen gesund ernähren können.Die Demonstration am 18. Januar beginnt um 12 Uhr am Brandenburger Tor. Auf der Bühne sprechen die alternative Nobelpreis-Trägerin Vandana Shiva, ein Vertreter von Fridays for Future, Imker, Bäuerinnen, Naturschützer und viele mehr. Alle Menschen, die sich für gute Landwirtschaft und gesundes Essen einsetzen, sind herzlich willkommen. Weitere Informationen: www.wir-haben-es-satt.de Pressefahrplan als [pdf] Für Rückfragen:Saskia Richartz, “Wir haben es satt!“-Sprecherin, Mobil: 0177-8905054, E-Mail: richartz[at]meine-landwirtschaft[dot]de Georg Janßen, Bundesgeschäftsführer der Arbeitsgemeinschaft bäuerliche Landwirtschaft, Mobil: 0170-4964684, E-Mail: janssen[at]abl-ev[dot]de Reinhild Benning, Referentin für Landwirtschaft und Tierhaltung bei Germanwatch, Mobil: 0175-7263779, E-Mail: benning[at]germanwatch[dot]org Prof. Dr. Antônio Andrioli, Agrar-Experte und Mitbegründer der Bundesuniversität „Fronteira Sul“ (Brasilien), Mobil: 0176-61171940, E-Mail: antonioandrioli[at]yahoo.com[dot]br Nicolas Barthelmé, Gründer des deutschen Ablegers von „Du bist hier der Chef! Die Verbrauchermarke“, Mobil: 0163-8807552, E-Mail: nicolas[at]dubisthierderchef[dot]de Terminübersicht: Mittwoch, 15.01.20, 11 Uhr: Imker-Protest gegen Klöckners Agrarpolitik. Ein Brandenburger Imkerpaar übergibt vier Tonnen Glyphosat-belasteten Honig an die Agrarministerin. Ort: Bundesministerium für Ernährung und Landwirtschaft, Wilhelmstr. 54, 10117 Berlin Freitag, 17.01.20, ab 17 Uhr: „Schnippeldisko – Topf, Tanz, Talk“. Rund 1000 Engagierte kochen bei Vorträgen und Musik eine leckere Suppe für die Demonstration. Ort: Zirkus Cabuwazi, Flughafen Tempelhof, Columbiadamm 84, 10965 Berlin. Samstag, 18.01.20, ab 8 Uhr: Traktoren-Demonstration vom StadtGut Blankenfelde (Hauptstr. 24-30, 13159 Berlin-Pankow) zur Int. Agrarministerkonferenz (s.u.).Gerne vermitteln wir schon im Vorfeld Interviews mit Bäuerinnen und Bauern, die mit dem Traktor aus dem gesamten Bundesgebiet anreisen. Samstag, 18.01.20, 10 Uhr: Übergabe der bäuerlichen Protestnote an Bundesministerin Klöckner bei der Int. Agrarministerkonferenz (Auswärtiges Amt, Werderscher Markt 1, 10117 Berlin). Samstag, 18.01.20, ab 12 Uhr: „Wir haben Agrarindustrie satt!“-Großdemonstration. Motto: „Agrarwende anpacken, Klima schützen!“ Ort: Brandenburger Tor, Platz des 18. März, 10117 Berlin. Abschlusskundgebung ab ca. 14.30 Uhr am Brandenburger Tor. Pressemitteilung'
