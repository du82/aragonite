["https://wir-haben-es-satt.de/informieren/rueckblick/demo-2024"]
title = "Demo 2024 - Wir haben es satt!"
full_description = "YouTube Video Die aktuellen Cookie-Einstellungen lassen die Einbindung dieses Videos nicht zu. Cookie-Einstellungen anpassen YouTube Video in neuem Tab öffnen Presse PRESSESPIEGEL STELLUNGNAHME BÜNDNIS PRESSEMITTEILUNG PRESSEKONFERENZ PRESSEMITTEILUNG DEMO 14. Wir haben es satt!-Demo am 20. Januar 2024 Aufruf Gutes Essen braucht Zukunft - für eine gentechnikfreie, bäuerliche und umweltverträgliche Landwirtschaft! Eine bäuerliche und ökologischere Landwirtschaft ist die richtige Antwort auf Klimakrise, Artensterben und Hunger in der Welt – nicht Gentechnik, Patente und Glyphosat! Umweltzerstörung, Hunger und Klimakrise sind weltweit längst Realität. Zugleich trägt die Landwirtschaft Verantwortung für die Bewahrung unserer Lebensgrundlagen, muss Emissionen senken, die Biodiversität erhalten und Böden und Wasser schützen. Eine ökologischere und bäuerliche Landwirtschaft ist die Basis für ein umweltverträgliches und krisenfestes Ernährungssystem, das alle Menschen sicher mit gesunden Lebensmitteln versorgen kann. Doch lässt die Bundesregierung Bäuerinnen und Bauern in der Krise allein. Sie können nicht mehr Umwelt- und Tierschutz stemmen, solange diese weder vom Markt, noch von der Politik angemessen honoriert wird. Niedrige Erzeuger*innenpreise, ungerecht verteilte Agrarsubventionen der EU und Kürzungen in der Entwicklungszusammenarbeit bringen Bäuerinnen und Bauern weltweit an ihre Schmerzgrenze – wirtschaftlich, aber auch körperlich und mental. Die Ampel-Koalition ist gefordert, den klimagerechten Umbau der Tierhaltung endlich zu finanzieren. Für mehr Tier- und Klimaschutz und den Erhalt vieler Höfe. Gentechnik und Patente verstärken die Abhängigkeit unserer Bäuerinnen und Bauern von großen Agrarkonzernen und führen zu noch weniger Vielfalt auf Acker und Teller. Wer den Schutz vor den Risiken der Gentechnik aufweicht, setzt unsere Zukunft mit gutem Essen für alle aufs Spiel! Wir fordern: keine Patente auf Pflanzen und Tiere und deren genetische Eigenschaften – Vorfahrt für das Vorsorgeprinzip! Für Verbraucher*innen und Landwirt*innen steht die Selbstbestimmung auf dem Spiel! Wenn die Bundesregierung die geplante Deregulierung der europäischen Gesetzgebung zulässt, können wir alle nicht mehr frei entscheiden, ob wir Gentechnik auf dem Teller oder Acker haben. Wo Gentechnik drin ist, muss auch Gentechnik draufstehen – für eine lückenlose Kennzeichnung und echte Wahlfreiheit entlang der gesamten Lebensmittelkette! Der Verlust der Artenvielfalt ist dramatisch. Eine wesentliche Ursache dafür ist die Intensivierung der Landwirtschaft und der Einsatz von Pestiziden. Die meisten Gentechnikpflanzen heute sind pestizidresistent. Die Auswirkungen der Neue Gentechnik-Pflanzen auf Menschen, Insekten und Ökosystem müssen kontrolliert werden. Wir fordern: ein Nein zu Glyphosat in Deutschland und der EU, Pestizidreduktion anpacken, Bäuerinnen und Bauern dabei finanziell unterstützen und Exporte von in der EU verbotenen Pestiziden endlich verbieten! Zum Auftakt der weltgrößten Agrarmesse „Internationale Grüne Woche“ machen wir im Berliner Regierungsviertel deutlich: Gutes Essen geht nur mit Klimaschutz und sozialer Gerechtigkeit. Agrarminister Özdemir muss sich deutlich gegen die Deregulierung des Gentechnik-Rechts wenden. Für eine gentechnikfreie, bäuerliche und umweltverträgliche Landwirtschaft! Wir fordern von der Bundesregierung: Klimagerechtigkeit und gutes Essen für alle Transformation zur klimafreundlichen Landwirtschaft gezielt fördern, klimaschädliche Subventionen abbauen, ohne Höfe zu gefährden, Zugang zu gesunden, umwelt- und klimagerecht erzeugten Lebensmitteln für alle sichern. Höfesterben stoppen und Tierschutz verbessern Faire Erzeuger*innenpreise und Planungssicherheit für die Höfe, Umbau der Tierhaltung durch eine Tierwohlabgabe ermöglichen, Ackerland in Bäuer*innenhand: Steuerung des Landbesitzes über eine gestaffelte Grunderwerbsteuer. Nein zur Deregulierung neuer Gentechnik Gentechnikfreie Saatgut- und Lebensmittelerzeugung sichern, Patente auf Tiere und Pflanzen stoppen! Artensterben bekämpfen Glyphosatverbot und Pestizidreduktion mit den Höfen zusammen anpacken: Einsatz von chemisch-synthetischen Pestiziden deutlich reduzieren, Export von in der EU verbotenen Pestiziden stoppen! Wir haben es satt!-Demo: Samstag, 20.1.24 | 12 Uhr | Willy-Brandt-Haus | Berlin KURZVIDEO FOTOS DEMO FOTOS TRAKTOREN-DEMO Stadt und Land gemeinsam Rechte Rüben unterpflügen Megafon Frontbanner und Bundestag Diversitaet auf Acker und Gesellschaft Konzerne weg vom Acker #carousel-backgroundimage-7752-1313 { background-image: url('/fileadmin/_processed_/2/9/csm_WHES24_Stadt-und-Land-gemeinsam_1180a6b67d.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7752-1313 { background-image: url('/fileadmin/_processed_/2/9/csm_WHES24_Stadt-und-Land-gemeinsam_efce6dc342.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7752-1313 { background-image: url('/fileadmin/_processed_/2/9/csm_WHES24_Stadt-und-Land-gemeinsam_76a4bfee4e.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-7752-1313 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Stadt-und-Land-gemeinsam.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-7752-1313 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Stadt-und-Land-gemeinsam.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-7752-1313 { background-image: url('/fileadmin/user_upload/fotos/whes24/WHES24_Stadt-und-Land-gemeinsam.jpg'); } } #carousel-backgroundimage-7752-1314 { background-image: url('/fileadmin/_processed_/9/e/csm_WHES24_Trecker-Rechte-Rueben-unterpfluegen_190e279884.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-7752-1314 { background-image: url('/fileadmin/_processed_/9/e/csm_WHES24_Trecker-Rechte-Rueben-unterpfluegen_213a96f7a7.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-7752-1314 { background-image: url('/fileadmin/_processed_