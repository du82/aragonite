["https://wir-haben-es-satt.de/presse-archiv/berlin-16012019"]
title = "Berlin, 16.01.2019 - Wir haben es satt!"
full_description = "Pressemitteilung Mahnmal der ungerechten Agrarsubventionen: Mit Steuergeld zukunftsfähige Landwirtschaft statt Landbesitz unterstützen Berlin, 16.1.2019. Vor dem Bundeslandwirtschaftsministerium zeigen Vertreter des „Wir haben es satt!“-Bündnisses heute, wie ungerecht die Verteilung der Agrarsubventionen ist. Feierlich enthüllen sie das weltweit kleinste Agrar-Mahnmal, auf dem im Maßstab 1:87 die ungerechte Verteilung der Flächensubventionen in Deutschland dargestellt ist. Darauf ist in einem Modellbau-Szenario zu sehen, wie ein einzelner Landwirt auf einem riesigen Geldturm sitzt. Ihm gegenüber eine ganzen Schar an Bauern, die jeweils über ein einzelnes Geldstück verfügen. Ministerin Klöckner stand nicht für eine Übergabe zur Verfügung, stellte jedoch eine Übergabe am Samstag in Aussicht. „Wir haben es satt!“-Sprecherin Saskia Richartz kommentiert: „Wir alle in Europa tragen durchschnittlich 114 Euro im Jahr zu den Agrarsubventionen bei. Es ist hochgradig absurd, dass Großbetriebe mit unserem Steuergeld für ihren Landbesitz bezahlt werden. Das führt den Gedanken von staatlichen Subventionen völlig ad absurdum. Statt weiterhin Geld zu verbrennen, muss der gesellschaftlich gewollte Umbau der Landwirtschaft hin zu mehr Tierwohl, Umwelt- und Klimaschutz finanziert werden.“ Hintergrund: Das grundlegende Prinzip der EU-Agrarsubventionen lautet: „Wer viel hat, dem wird gegeben“. In Deutschland bedeutet das: Die 3300 flächenreichsten Betriebe, das oberste Prozent, erhält eine Milliarde Euro/Jahr aus den Mitteln der Gemeinsamen EU-Agrarpolitik (GAP). Dahingegen müssen sich die 200.000 kleinsten Betriebe zusammen 690 Millionen Euro/Jahr teilen. Anders ausgedrückt: Die unteren 62 Prozent der kleinen und mittleren Betriebe bekommen sechs Prozent der Mittel, während das obere Prozent ein Fünftel der EU-Agrarsubventionen in Milliardenhöhe einstreicht. Für eine gerechte EU-Agrarpolitik demonstrieren am Samstag Zehntausende bei der „Wir haben es satt!“-Demonstration in Berlin. Pressekontakt: Christian Rollmann, „Wir haben es satt!“-Pressesprecher, Mobil: 0151-51245795, E-Mail: presse[at]meine-landwirtschaft[dot]de Pressetermine am Demonstrationstag:Samstag, 19.01.19, ab 8.30 Uhr: Traktoren-Demonstration vom StadtGut Blanken­felde (Hauptstr. 24-30, 13159 Berlin-Pankow) zur int. Agrarministerkonferenz. Samstag, 19.01.19, um 10.30 Uhr: Übergabe der bäuerlichen Protestnote an Bundesministerin Klöckner bei der int. Agrarministerkonferenz (Auswärtiges Amt, Werderscher Markt 1, 10117 Berlin). Gerne vermitteln wir schon im Vorfeld Interviews mit Bauern, die mit dem Traktor aus dem gesamten Bundesgebiet anreisen.Samstag, 19.01.19, ab 12 Uhr: Großdemonstration „Wir haben Agrarindustrie satt!“. Ort: Brandenburger Tor, Platz des 18. März, 10117 Berlin. Demonstration zum Agrarminstergipfel, wo ein unüberhörbares Kochtopf-Konzert für die Agrarwende stattfindet. Abschlusskundgebung ab ca. 14.30 Uhr am Brandenburger Tor. Fotos zur kostenfreien Nutzung Zum Download bitte auf das Bild klicken. Quellenangabe: Fabian Melber / www.wir-haben-es-satt.de Pressemitteilung"
