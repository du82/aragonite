3-694 { background-image: url('/fileadmin/_processed_/1/5/csm_Traktoren_fuer_Klimaschutz_9c0a488e0f.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-6633-694 { background-image: url('/fileadmin/_processed_/1/5/csm_Traktoren_fuer_Klimaschutz_c87bc85315.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-6633-694 { background-image: url('/fileadmin/_processed_/1/5/csm_Traktoren_fuer_Klimaschutz_022762eaaf.jpg'); } } #carousel-backgroundimage-6633-695 { background-image: url('/fileadmin/_processed_/9/f/csm_UEbergabe_der_Protestnote_527561f2e1.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-6633-695 { background-image: url('/fileadmin/_processed_/9/f/csm_UEbergabe_der_Protestnote_b615866799.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-6633-695 { background-image: url('/fileadmin/_processed_/9/f/csm_UEbergabe_der_Protestnote_fb44156b17.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-6633-695 { background-image: url('/fileadmin/_processed_/9/f/csm_UEbergabe_der_Protestnote_f53eb187a6.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-6633-695 { background-image: url('/fileadmin/_processed_/9/f/csm_UEbergabe_der_Protestnote_c64c86a5e8.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-6633-695 { background-image: url('/fileadmin/_processed_/9/f/csm_UEbergabe_der_Protestnote_cc9f532ec3.jpg'); } } #carousel-backgroundimage-6633-696 { background-image: url('/fileadmin/_processed_/4/3/csm_Traktor-Demo_7a66646b74.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-6633-696 { background-image: url('/fileadmin/_processed_/4/3/csm_Traktor-Demo_fc5e1d56f9.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-6633-696 { background-image: url('/fileadmin/_processed_/4/3/csm_Traktor-Demo_f35696424d.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-6633-696 { background-image: url('/fileadmin/_processed_/4/3/csm_Traktor-Demo_58f2a6f19a.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-6633-696 { background-image: url('/fileadmin/_processed_/4/3/csm_Traktor-Demo_d038068b3b.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-6633-696 { background-image: url('/fileadmin/_processed_/4/3/csm_Traktor-Demo_45c7e6f208.jpg'); } } #carousel-backgroundimage-6633-697 { background-image: url('/fileadmin/_processed_/7/5/csm_Imker_vorm_Ministerium_a153082206.jpg'); } @media (min-width: 576px) { #carousel-backgroundimage-6633-697 { background-image: url('/fileadmin/_processed_/7/5/csm_Imker_vorm_Ministerium_9a3930d767.jpg'); } } @media (min-width: 768px) { #carousel-backgroundimage-6633-697 { background-image: url('/fileadmin/_processed_/7/5/csm_Imker_vorm_Ministerium_a5f2489099.jpg'); } } @media (min-width: 992px) { #carousel-backgroundimage-6633-697 { background-image: url('/fileadmin/_processed_/7/5/csm_Imker_vorm_Ministerium_828c847de7.jpg'); } } @media (min-width: 1200px) { #carousel-backgroundimage-6633-697 { background-image: url('/fileadmin/_processed_/7/5/csm_Imker_vorm_Ministerium_a98ba682c4.jpg'); } } @media (min-width: 1400px) { #carousel-backgroundimage-6633-697 { background-image: url('/fileadmin/_processed_/7/5/csm_Imker_vorm_Ministerium_4569eacd9c.jpg'); } } Zurück Weiter Pressemitteilung „Wir haben es satt!“-Protest: Özdemir muss Agrarindustrie die Stirn bieten und Agrarwende voranbringen Berlin, 22.01.22. Mit gigantischen Stroh-Buchstaben fordern heute über 60 Organisationen aus Landwirtschaft und Gesellschaft in Berlin eine nachhaltige Agrar- und Ernährungspolitik. Aus 50 Tonnen Stroh bildet das „Wir haben es satt!“-Bündnis vor dem Brandenburger Tor den 4,5 Meter hohen Schriftzug „Agrarwende jetzt!“. Damit unterstreichen die Demonstrant*innen ihre Erwartung an Bundeslandwirtschaftsminister Özdemir, jetzt für einen schnellen und entschlossenen Umbau der Land- und Lebensmittelwirtschaft zu sorgen. „Es ist höchste Zeit, dass die Höfe und Menschen in diesem Land wieder zu den Gewinner*innen der Agrar- und Ernährungspolitik zählen“, sagt Bündnis-Sprecherin Saskia Richartz. „Minister Özdemir muss jetzt das Feld für die Agrarwende bestellen. Das heißt: Umweltfreundliche Bewirtschaftung, artgerechte Haltung und Klimaschutz auf Acker und Teller müssen sich wieder lohnen.“ Damit die Agrar- und Ernährungswende klappt, brauchen Höfe und Konsument*innen Transparenz, Verlässlichkeit und Zukunftsperspektiven. Die Bundesregierung muss das Höfesterben stoppen und sicherstellen, dass alle Menschen Zugang zu gutem pestizid- und gentechnikfrei hergestelltem Essen haben. Für den Klimaschutz müssen die Tierzahlen reduziert und artgerechte Tierhaltung muss ebenso wie der Ökolandbau zum Leitbild werden. Mit Blick auf die Lobby-Interessen, die in der Vergangenheit die Veränderungen blockierten, verlangt das Bündnis klare Kante vom Landwirtschafts- und Ernährungsministerium. „Özdemir muss der Agrarindustrie die Stirn bieten. Weder Chemie-, Milch- und Fleischkonzerne noch Bodenspekulanten dürfen in Zukunft die Agrarpolitik bestimmen,“ so Richartz. „Die Agrarwende ist harte Arbeit und wird sicher kein Spaziergang. Wir halten den Druck aufrecht und werden die Arbeit des Ministers kritisch begleiten. Wenn Cem Özdemir eine zukunftsfähige Politik macht, hat er die Unterstützung unserer Bewegung.“ Die Lage auf dem Land ist nach 16 Jahren unionsgeführter Agrarpolitik dramatisch: Schlechte Erzeugerpreise durch das Preisdiktat des Handels und die fatale Ausrichtung auf Export zwingen Bauernhöfe zum Schließen. Landwirtschaftlicher Boden wird immer mehr zum Spekulationsobjekt. Tierfabriken verdrängen bäuerliche Betriebe. Der Antibiotikamissbrauch bedroht unser aller Gesundheit. Klimakrise und Artensterben eskalieren. Julia Bar-Tal, Bäuerin und Landesvorsitzende der Arbeitsgemeinschaft bäuerliche Landwirtschaft in Brandenburg sagt: „Wir brauchen eine Landwirtschaft, in der faire Erzeugerpreise mit artgerechter Tierhaltung und Umwelt- und Klimaschutz einher gehen. Gleichzeitig müssen gesunde Lebensmittel für alle bezahlbar sein. Wir erwarten von Minister Özdemir, dass er jetzt sofort die Ärmel hochkrempelt und den Umbau der Landwirtschaft voranbringt. Bäuer*innen, Tiere und das Klima brauchen eine Zukunft." Schon am Vormittag hatten Bäuer*innen mit ihren Traktoren eine Protestnote an Cem Özdemir übergeben. Auch der „Staffel-Lauch für die Agrarwende“ fand im Agrarminister seinen Adressaten. Über 1500 Menschen fordern in Video-Botschaften den agrarpolitischen Neustart und reichen so den virtuellen Staffel-Lauch bis in Regierungsviertel weiter. Hintergrund: Im „Wir haben es satt!“-Bündnis kämpfen konventionell und ökologisch wirtschaftende Bäuer*innen im Schulterschluss mit der Gesellschaft gegen die fatalen Auswirkungen der intensiven industriellen Landwirtschaft. Gemeinsam zeigt das Bündnis Wege für eine bäuerliche und ökologischere Landwirtschaft auf, die mit mehr Umwelt-, Tier- und Klimaschutz auch auf breite Zustimmung in der Bevölkerung stößt und den Bauernhöfen wir'''
