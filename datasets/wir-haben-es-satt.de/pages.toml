["https://wir-haben-es-satt.de/presse-archiv/berlin-150118"]
title = "Berlin, 15.01.18 - Wir haben es satt!"
full_description = 'Pressemitteilung Negative Auswirkungen der industriellen Landwirtschaft alarmierend Aufruf zur „Wir haben es satt!“-Großdemonstration am 20.1.18 / GroKo muss für Agrar- und Ernährungswende endlich konkrete Ziele formulieren und finanzielle Mittel bereitstellen Berlin, 15.01.2018. Wenige Tage vor der „Wir haben es satt!“-Demonstration am 20. Januar zeichnen Bauern, Experten und Unternehmer ein fatales Bild der deutschen Agrarpolitik. Die Konsequenzen des Einsatzes von Glyphosat für Menschen, Tiere und Umwelt sind verhängnisvoll: Artenschwund in unbe­kanntem Ausmaß und Krebsgefahr in unberechenbaren Dimensionen. Bauern fehlt die Unterstützung der bisherigen Bundesregierung beim Pestizid-Ausstieg und dem Umbau der Ställe hin zu artgerechter Tierhaltung. Überdüngung verschmutzt das Grundwasser und ruinöse Agrar-Exporte beschleunigen das weltweite Höfesterben. Angesichts dieser Zustände fordert das breite gesellschaftliche „Wir haben es satt!“-Bündnis, dem mehr als 50 Organisationen aus Landwirtschaft und Zivilgesellschaft angehören, mehr Mut für eine ambitionierte Agrarwende. Das am Freitag veröffentlichte Sondierungspapier von CDU, SPD und der CSU zeigt, dass der gesell­schaftliche Protest der letzten Jahre endlich Wirkung zeigt. Die Bündnis-Vertreter äußern allerdings große Zweifel an der Eignung von Bundeslandwirtschaftsminister Christian Schmidt. Messbare Ziele sowie Finanzierungspläne fehlen in dem Dokument der Unterhändler vollkommen. Eine glaubwürdige Politik braucht klare Zeitvorgaben und darf die Bauern bei dem gesellschaftlich gewollten Umbau der Landwirtschaft nicht alleine lassen. „Wir haben es satt!“-Sprecher Jochen Fritz fordert von der Neuauflage der GroKo klare Vorgaben in der Landwirtschaftspolitik und einen Personalwechsel: „Agrarminister Schmidt ist der Ankündigungsminister, das hat er vier Jahre lang bewiesen. Immer wie­der vor der Grünen Woche das gleiche Déjà-vu: wohlklingende Vorschläge aus dem Hause Schmidt. Das Glyphosat-Fiasko zeigt, dass Herrn Schmidt Konzerninteressen wichtiger sind als der Wille der Be­völkerung. Wir fordern verbindliche Zeitpläne für Glyphosat-Ausstieg und Lebensmittel-Kennzeichnung und wir brauchen echte Unterstützung für Tiere, Umwelt und Bauernhöfe. Mit leeren Versprechungen kommen wir nicht weiter, daher muss die nächste Regierung das Ministeramt neu besetzen.“ Die französische Investigativ-Journalistin Marie-Monique Robin ist eine der Hauptorganisatorinnen des „Monsanto-Tribunals“. In ihrem kürzlich veröffentlichten Film „Roundup – der Prozess“ zeigt sie, welche Schäden das Totalherbizid Glyphosat auf der ganzen Welt anrichtet. Sie sagt: „Glyphosat greift Böden, Pflanzen, Tiere und Menschen an. Auf vielfältige Art und Weise wirkt es zerstö­rerisch. Es wurde 1964 zuerst zur Wasserrohrreinigung benutzt und 2010 als Antibiotikum von Monsanto patentiert. Rückstände dieses Gifts sind in der kompletten Nahrungskette zu finden. Im menschlichen Urin und sogar in deutschen Bieren wurde es nachgewiesen. Es ist eines der giftigsten Produkte, das die Menschheit je erfunden hat, und muss konsequent verboten werden. Glyphosat ist das Asbest des 21. Jahrhunderts.“ Jan Wittenberg, Arbeitsgemeinschaft bäuerliche Landwirtschaft, wirtschaftet als Ackerbauer seit 2010 ohne Glyphosat und berät landwirtschaftliche Betriebe beim Pestizid-Ausstieg. Er sagt: „Wir Ackerbauern wissen längst, wie wir Lebensmittel ohne Glyphosat erzeugen können. Wir brauchen eine größere Vielfalt auf dem Acker. Wechselnde Fruchtfolgen sind unser Geheimrezept, mit dem wir uns von der Chemie der Industrie unabhängig machen. Mit einer Übergangszeit von zwei Jahren schaf­fen wir Bauern es auch ohne Glyphosat. Daher fordern wir: Glyphosat-Verbot in der Landwirtschaft bis 2020. Dafür brauchen wir eine zuverlässige Politik, ein faires Umschichten der Agrarsubventionen und den Willen zur Veränderung in der Agrarpolitik.“ Martin Weyand, Bundesverband der Energie- und Wasserwirtschaft, wird als Redner auf der Demonstration sprechen. Er kennt die Probleme, mit denen die Wasserwerke durch die zunehmende Überdüngung konfrontiert sind, und sagt: "Wasser ist unser Lebensmittel Nummer 1 und nicht ersetzbar. Doch die Überdüngung der Felder ge­fährdet unser Grundwasser. In einigen Regionen sind die Nitratwerte alarmierend und die Trinkwasser-Aufbereitung extrem aufwendig. Damit auch die nächsten Generationen unsere Wasserressourcen nut­zen können, brauchen wir ein Düngerecht, das einen nachhaltigen Gewässerschutz sichert und wir müssen weg von der industriellen Landwirtschaft. Ausdruck der verfehlten Landwirtschaftspolitik ist auch der Gülle-Notstand in Schleswig-Holstein, Niedersachsen und Mecklenburg-Vorpommern." Sofía Monsalve Suárez von FIAN International weist auf die folgenschweren Auswirkungen von Ag­rarexporten für Bauern auf der ganzen Welt hin und kündigt den Kochtopf-Protest bei der internationa­len Agrarministerkonferenz an: „Die ruinöse Exportorientierung und Freihandel fördern Landraub, Umweltzerstörung und Klimawandel in Deutschland und weltweit. Die aktuelle Politik drückt Erzeugerpreise hierzulande und zerstört in vie­len Exportländern die lokalen Märkte. Wir fordern von der internationalen Agrarministerkonferenz, diese fatale Export-Politik muss aufhören. Bäuerinnen und Bauern auf der ganzen Welt brauchen sicheren Zugang zu Land, Saatgut, Wasser und Nahrung. Deswegen brauchen wir weltweite Bauernrechte und eine globale Agrarwende. Dafür schlagen wir am Samstag mit unseren Kochtöpfen Alarm.“ Hintergrund: Die „Wir haben Agrarindustrie satt!“-Demonstration wird von Tausenden Bäuerinnen und Bauern – kon­ventionell und bio – getragen, von denen viele mit Traktoren aus dem gesamten Bundesgebiet anrei­sen. Zusammen mit rund 100 Organisationen aus der Zivilgesellschaft treten sie für eine Landwirtschaft und Lebensmittelpolitik ein, in der Bauern und Lebensmittelhandwerker fair entlohnt werden und sich alle Menschen gesund ernähren können. Die Demonstration zieht in diesem Jahr zur internationalen Agrarministerkonferenz. Dort fordern die Teilnehmer die versammelten Agrarminister der Welt auf, mehr Tempo bei der Agrarwende zuzulegen. Alle Menschen, die sich für gute Landwirtschaft und gesundes Essen einsetzen, sind herzlich willkommen teilzunehmen. Weitere Infos: www.wir-haben-es-satt.de Für Rückfragen: Jochen Fritz, “Wir haben es satt!“-Sprecher, Mobil: 0171-8229719, E-Mail: fritz@meine-landwirtschaft.de Marie-Monique Robin, Journalistin und Filmemacherin, Mobil: 0033-662127607, E-Mail: m2rbox@gmail.com Jan Wittenberg, Bundesvorstand der Arbeitsgemeinschaft bäuerliche Landwirtschaft (AbL), Mobil: 0172-43038911, E-Mail: napus@t-online.de Martin Weyand, Hauptgeschäftsführer Wasser und Abwasser des Bundesverbands der Energie- und Wasserwirtschaft (BDEW), Tel: 030-3001991162, E-Mail: manuela.wolter@bdew.de Sofía Monsalve Suárez, Generalsekretärin FIAN International, 0172 606 7523, E-Mail: monsalve@fian.org Pressekontakt Christian Rollmann, „Wir haben es satt!“-Presseansprechpartner, Mobil: 0151-51245795, E-Mail: rollmann[at]meine-landwirtschaft[dot]de Pressemitteilung'
