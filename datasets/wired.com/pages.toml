full_description = 'Science<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="Texas Official Warns Against ‘Measles Parties’ Amid Growing Outbreak" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c31df5e9b9b138ba30b8c2/16:9/pass/2201702412"/>DiseaseTexas Official Warns Against ‘Measles Parties’ Amid Growing OutbreakAt least 146 measles cases have been identified in West Texas so far, including 20 hospitalizations and one death.Beth Mole, Ars Technica<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_120,h_180,c_limit/GettyImages-1242172582.jpg 120w, https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_240,h_180,c_limit/GettyImages-1242172582.jpg 240w, https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_320,h_180,c_limit/GettyImages-1242172582.jpg 320w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_120,h_360,c_limit/GettyImages-1242172582.jpg 120w, https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_240,h_360,c_limit/GettyImages-1242172582.jpg 240w, https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_320,h_360,c_limit/GettyImages-1242172582.jpg 320w, https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_640,h_360,c_limit/GettyImages-1242172582.jpg 640w" sizes="100vw"/><img alt="Appalachians Are Trapped in a Disastrous Cycle of Flooding and Rebuilding" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c080bb7ca1aba3550756fd/16:9/w_640%2Ch_360%2Cc_limit/GettyImages-1242172582.jpg"/>Disaster RecoveryAppalachians Are Trapped in a Disastrous Cycle of Flooding and RebuildingKristina P. Brant<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c06ecef4badce5d2e048af/16:9/w_120,