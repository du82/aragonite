title = "Best Fitting T-Shirts for Men—According to a Savile Row Tailor (2025) | WIRED"
description = "Bombarded by social media ads promising the “perfect” T-shirt whatever your shape, WIRED put these claims to the test with world-famous Savile Row tailors Gieves & Hawkes."
full_description = '''Chris HaslamGearMar 1, 2025 9:00 AMWe Asked a Savile Row Tailor to Test All the ‘Best’ T-Shirts You See in Social Media AdsBombarded by social media ads promising the “perfect” T-shirt whatever your shape, WIRED put these claims to the test with world-famous Savile Row tailors Gieves & Hawkes.FacebookXEmailSave StoryPhotograph: Son of a Tailor; Rapanui; Sunspel; Getty Images; AlamyFacebookXEmailSave StoryIf you buy something using links in our stories, we may earn a commission. Learn more.Featured in this articleDad Bods Look HereTrue Classic White Crew Neck T-ShirtRead more$30 at AmazonMade in AmericaSteel City Perfect TeeRead more$45 at Steel CityPerformance FabricLabfresh T-ShirtRead more$60 at LabfreshFor Premium HuntersSunspel Men's Classic T-Shirt Read more$95 at AmazonShow more4 / 14Everyone has a favorite T-shirt. Recently most have coveted Jeremy Allen White’s from The Bear. For WIRED senior editor Jeremy Allen White, it’s one of his prized In-N-Out Burger designs—but lately, across his social media feeds, he’s been inundated by brands claiming he’s wrong and that they have unlocked the secret to creating The Perfect T-Shirt.Some use heritage as a sales strategy, others target body insecurities, while a new breed of online fashion brands are turning to high-tech lasers and adaptive algorithms to create custom T-shirts, tailored to you. But which is best?The 13 T-shirt brands tested have all claimed (primarily on social media) to make the perfect T-shirt, or words to that effect. Some, such as Spoke and Son of a Tailor, make shirts to order based on the findings of an online questionnaire, while Sanvt encourages customers to send in video clips to help its algorithm determine the perfect fit.Obviously, fit is personal, and everybody is shaped differently, so to get the measure of each brand, Jeremy was joined by UK managing editor Mike Dent and contributing editor Chris Haslam, all of whom are different shapes and sizes and—crucially—have contrasting ideas around what makes the perfect T-shirt.<img alt="Tailor measuring fabrics" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_1600%2Cc_limit/P1020094-Edit-copy.jpg" srcSet="https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_120,c_limit/P1020094-Edit-copy.jpg 120w, https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_240,c_limit/P1020094-Edit-copy.jpg 240w, https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_320,c_limit/P1020094-Edit-copy.jpg 320w, https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_640,c_limit/P1020094-Edit-copy.jpg 640w, https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_960,c_limit/P1020094-Edit-copy.jpg 960w, https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_1280,c_limit/P1020094-Edit-copy.jpg 1280w, https://media.wired.com/photos/6542d53381909abbb8cc9f84/master/w_1600,c_limit/P1020094-Edit-copy.jpg 1600w" sizes="100vw"/>Davide Taub, head cutter at Savile Row tailors Gieves & Hawkes, graded the T-shirts. Photograph: Gieves & Hawkes<img alt="Gieves Hawkes building" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_1600%2Cc_limit/sss-G&amp;H_001--.jpg" srcSet="https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_120,c_limit/sss-G&amp;H_001--.jpg 120w, https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_240,c_limit/sss-G&amp;H_001--.jpg 240w, https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_320,c_limit/sss-G&amp;H_001--.jpg 320w, https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_640,c_limit/sss-G&amp;H_001--.jpg 640w, https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_960,c_limit/sss-G&amp;H_001--.jpg 960w, https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_1280,c_limit/sss-G&amp;H_001--.jpg 1280w, https://media.wired.com/photos/6542d4a382ddcd2374fa2049/master/w_1600,c_limit/sss-G&amp;H_001--.jpg 1600w" sizes="100vw"/>Gieves & Hawkes’ headquarters at 1 Savile Row in London where WIRED tested the tees. Photograph: Gieves & HawkesAnd because fit is only part of the puzzle, WIRED sought the help of Davide Taub, head cutter at world-famous Savile Row bespoke tailor Gieves & Hawkes. Hawkes, which has been a royal tailor since 1789, purchased its London headquarters in 1913, establishing “the Row” as an epicenter for fine tailoring. So it is fitting then that Taub passed his expert eye, and fingers, over the quality of the fabrics and stitching used. It’s worth remembering that we didn’t discuss pricing with him.It’s by no means an exhaustive list, but can the custom-fit, algorithmically driven designs really size you up like a professional? And perhaps most importantly, is there a cure (aside from hard work, diet, and exercise) for the dreaded Dad Bod?Updated March 2025: We've added T-shirts from online brands Sanvt, Labfresh, AYR, and Steel City, all of whom also claim they offer the perfect fit.Photograph: True ClassicDad Bods Look HereTrue Classic White Crew Neck T-Shirt“Our premium tees … accentuate the arms and shoulders to make you stand out and feel great … Side effects may include: Hyper Confidence, Extreme Charisma, Bloated Ego.”Not a day goes by without at least one of True Classic’s adverts entering our feeds. They promote clothes based around the “it’s not you, it’s them” approach, with the fit of your existing T-shirts to blame for you looking bad, rather than your flabby bits. How? Each tee is fitted around the arms, shoulder, and chest, much like a gym shirt, but far more relaxed (read: forgiving) through the body.Does it work? “To my shame, the ‘dad bod’ fit is perfect and the neck size is not too big, not too small, just right,” says Jeremy White. That said, WIRED is not impressed with the use of 60 percent cotton and 40 percent polyester, which makes it far more likely to end up in landfill or get incinerated. And when it does degrade, it will ultimately contribute to marine pollution.Taub felt the “stretch is so soft, and instinctively feels more comfortable, something you could happily go to the gym in.” And the “construction is fairly standard, and in keeping with the majority we’ve tested.” Mike Dent struggled with the extra length and volume of material, which made his midriff look peculiar, but he had to admit that it’s “so comfy, I’d probably wear it to death as pajamas.” Chris Haslam was nonplussed by the stretchy fit, and felt it “did nothing for me, aside from making me self-conscious about wearing such a snug-fitting top.”$30 at Amazon$30 at True Classic<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_120%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 120w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_240%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 240w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_320%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 320w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_640%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 640w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_800%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_320%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 320w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_640%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 640w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_960%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 960w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_1280%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 1280w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_1600%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 1600w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_1920%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 1920w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_2240%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 2240w, https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_2580%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg 2580w" sizes="100vw"/><img alt="Image may contain Clothing TShirt and Undershirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67bf6c38266af1291719e1b0/master/w_320%2Cc_limit/SteelCity_PerfectTee_White_1200x.jpg"/>Courtesy of Steel CityMade in AmericaSteel City Perfect Tee“Uncompromising craftsmanship for premium fit and feel.”Made in the USA, from hefty 9.5-ounce cotton, this T-shirt is super soft, is prewashed, and has a great vintage vibe. Available in XS–XXL and in six colors—although be warned, the white samples WIRED was sent looked faintly yellow compared to the other optical white options on show.Taub was pleased by the look of the collar but noted that “the construction feels quite bulky where things are finished off, with quite a hard overlock around the neck as we’ve seen before.” After inspecting the inside seams he added, “It’s the very cheapest, most basic way of making something, but the cotton weight feels nice and soft.”Both Mike and Chris also spotted that the vintage style label was stitched in with black thread, which just looked slapdash, and the stitching around the neckline puckered in places, which could be “vintage” or just a machining error.Construction issues aside, the T-shirt was extremely comfortable and soft, although too casual for Mike. Chris' size-small fitted well through the body but was bunched under the arms, while the medium swamped him. But he loved the slubby-casual feel, saying, “If it fitted me better, it would be my go-too choice.”Jeremy was willing this shirt to fit well, but alas: “You think this is going to be nice … and then you put it on. The neck is too large. The length is too long. The stitched-in label scratches, and the neckline uncomfortable. So disappointing.”$45 at Steel City<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_120%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 120w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_240%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 240w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_320%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 320w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_640%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 640w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_800%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_320%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 320w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_640%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 640w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_960%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 960w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_1280%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 1280w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_1600%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 1600w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_1920%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 1920w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_2240%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 2240w, https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_2580%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg 2580w" sizes="100vw"/><img alt="Image may contain Clothing and TShirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67bf6ce44f8b2e6c6e73996f/master/w_320%2Cc_limit/Labfresh%2520Classic_T-shirt_Lisbon_White_NOS_FF_2_1440x1800.jpg"/>Courtesy of LabfreshPerformance FabricLabfresh T-Shirt“The smartest T-shirts in the world.”Made of 95-percent cotton and 5-percent elastane, this T-shirt has plenty of stretch and feels smooth and premium. That quality feel impressed Taub, too, who commented on its “very clean look and construction, with considerate cleaner touches around the neckline.” He was also impressed that “the sleeves have been put in with a double stitch, which is similar to how we would make shirts.”Available in a classic and relaxed cut, in sizes S–3XL, the fit was a mystery to Mike. “My classic-large was anything but—it was practically see-through once I’d squeezed into it, and Taub pointed out that “despite a nice tight sleeve, it just didn't work for me across the chest and upper back.” Interestingly however, the Relaxed XL fitted more like a proper regular and “created a much nicer silhouette with a pretty spot-on length.”Jeremy was pleased with the well-cut neckline, but the fit was off. “I have broad shoulders and yet this [size medium] is still too big in shoulder, and the arms too baggy.” He also “hated” the stitched logo on the rear neck.Chris isn't a fan of T-shirts with elastane in general, not least “because they're much harder to recycle compared to 100-percent cotton." But he was impressed by the fit, which hung nicely, and “didn't make me feel like I was in my gym kit, despite the stretch.”$60 at Labfresh<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_120%2Cc_limit/Gear-Sunspel.jpg 120w, https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_240%2Cc_limit/Gear-Sunspel.jpg 240w, https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_320%2Cc_limit/Gear-Sunspel.jpg 320w, https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_640%2Cc_limit/Gear-Sunspel.jpg 640w, https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_800%2Cc_limit/Gear-Sunspel.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_320%2Cc_limit/Gear-Sunspel.jpg 320w, https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_640%2Cc_limit/Gear-Sunspel.jpg 640w, https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_960%2Cc_limit/Gear-Sunspel.jpg 960w, https://media.wired.com/photos/6542d0e7ef12892fe0b649d1/master/w_1280%2Cc_limit/Gear'''
