title = "Paresh Dave | WIRED"
description = "Paresh Dave is a senior writer for WIRED, covering the inner workings of Big Tech companies. He writes about how apps and gadgets are built and about their impacts while giving voice to the stories of the underappreciated and disadvantaged. He was previously a reporter for Reuters and the Los Angeles Times, and an investigative reporting fellow at the Maynard Institute for Journalism Education. His work has tackled topics ranging from esports to Olympics baseball to diversity and ethics in the tech industry. His team reporting on Snapchat’s IPO was recognized by the Society for Advancing Business Editing and Writing. He is a lifelong Californian."
full_description = '''Paresh DaveSenior WriterParesh Dave is a senior writer for WIRED, covering the inner workings of Big Tech companies. He writes about how apps and gadgets are built and about their impacts while giving voice to the stories of the underappreciated and disadvantaged. He was previously a reporter for Reuters and the Los Angeles Times, and an investigative reporting fellow at the Maynard Institute for Journalism Education. His work has tackled topics ranging from esports to Olympics baseball to diversity and ethics in the tech industry. His team reporting on Snapchat’s IPO was recognized by the Society for Advancing Business Editing and Writing. He is a lifelong Californian.<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c223aa653c2b72f50a911f/16:9/w_120,c_limit/DOGE-Software-Purge-Business-2201518354.jpg 120w, https://media.wired.com/photos/67c223aa653c2b72f50a911f/16:9/w_240,c_limit/DOGE-Software-Purge-Business-2201518354.jpg 240w, https://media.wired.com/photos/67c223aa653c2b72f50a911f/16:9/w_320,c_limit/DOGE-Software-Purge-Business-2201518354.jpg 320w, https://media.wired.com/photos/67c223aa653c2b72f50a911f/16:9/w_640,c_limit/DOGE-Software-Purge-Business-2201518354.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c223aa653c2b72f50a911f/1:1/w_120,c_limit/DOGE-Software-Purge-Business-2201518354.jpg 120w, https://media.wired.com/photos/67c223aa653c2b72f50a911f/1:1/w_240,c_limit/DOGE-Software-Purge-Business-2201518354.jpg 240w, https://media.wired.com/photos/67c223aa653c2b72f50a911f/1:1/w_320,c_limit/DOGE-Software-Purge-Business-2201518354.jpg 320w" sizes="100vw"/><img alt="DOGE&#x27;s Misplaced War on Software Licenses" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c223aa653c2b72f50a911f/1:1/w_330%2Cc_limit/DOGE-Software-Purge-Business-2201518354.jpg"/>BusinessDOGE's Misplaced War on Software LicensesFeb 28,