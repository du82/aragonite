title = "Time Your Attack: Oracle’s Lost Revolution | WIRED"
description = "In 1995, Larry Ellison announced a computer that would run applications that lived in the cloud. Just one thing: The cloud didn’t exist yet."
full_description = '''Daniel RothThe Big StoryDec 21, 2009 10:00 AMTime Your Attack: Oracle’s Lost RevolutionIn 1995, Larry Ellison announced a computer that would run applications that lived in the cloud. Just one thing: The cloud didn’t exist yet.Photograph: Mauricio AlejoSave this storySaveSave this storySaveIf you buy something using links in our stories, we may earn a commission. This helps support our journalism. Learn more. Please also consider subscribing to WIREDJust after midnight on August 24, 1995, a student named Jonathan Prentice walked into a bookshop in Auckland, New Zealand, pulled out 200 New Zealand dollars, and became the first owner of Windows 95. Turning to a reporter, Prentice declared: "I will be able to play solitaire and send faxes at the same time." And with that rallying cry, the Windows 95 craze exploded. Lines formed around the world as consumers jostled to buy copies; journalists in Poland prepared to take a Microsoft-sponsored submarine ride under the Baltic Sea; The Times of London handed out free papers wrapped in a Windows ad; and the Empire State Building lit up in Windows' signature colors. Within a month, Microsoft's new operating system had sales of more than $250 million and Bill Gates went from being a nerd to ... well, he was still a nerd, but an invincible rock-star nerd. The future was very clear: PCs—running Microsoft software—would be the single most important device in our lives.How to FailScrew ups, disasters, misfires, flops. Why losing big can be a winning strategy.Accept Defeat: The Neuroscience of Screwing UpStay in the Game: The Fall and Rise of Alec BaldwinLearn to Let Go: How Success Killed Duke NukemIn Silicon Valley, Larry Ellison followed the glowing press coverage and fumed. He had lived in Gates' shadow since March 1986, when Oracle, Ellison's database-software company, had gone public just a day before Microsoft. Gates got attention for everything he did, but barely anyone knew Oracle. Windows 95 was the last straw. "There was peace in the Middle East and war in Bosnia the same week," he later groused. "And all that the major networks seemed to cover was people in parking lots waiting up all night to get their first copy of Windows 95." His grudge wasn't just about ego; Microsoft had already begun nosing around the database-software industry, and its mounting war chest meant that it could easily fund a push into Oracle's territory.Immediately after the Windows 95 launch, Ellison called one of his lieutenants, Farzad Dibachi, to his mansion in Atherton, California. For years, Dibachi—who was responsible for brainstorming new business strategies—had urged Ellison to think more broadly about his company's potential. Now, the two discussed a vision for Oracle that would neutralize Microsoft's main advantage: the dominance of its operating system. They imagined a simple machine that would eschew software installed on a hard drive in favor of accessing applications online. Data—videos, documents, pictures—would be stored in Oracle databases instead of on the computer itself. In place of a robust operating system, this machine would work with programs and files through browsers like Netscape Navigator. Ellison liked the idea, and he and Dibachi started working on a speech so the CEO could share it with the world. The device would be called the network computer.It was a powerful idea, one that would enchant companies and analysts throughout the IT industry. But it would ultimately fail. In 1999, after spending four years and losing nearly $175 million, Oracle pulled the plug, changing the name of its network computer spinoff to Liberate Technologies and focusing its business on set-top box software for interactive television. (Ellison personally funded another network computer startup that didn't fare any better.) Journalists referred to the idea as "embarrassingly wrong." Gates called it "a fantasy." Even Ellison distanced himself from the debacle. (He declined to discuss it with Wired.) And yet, while his computer may have failed, Ellison's grand vision did not. Just as he predicted, a wave of cheap, underpowered computers with small hard drives and omnipresent Internet connections did challenge the traditional PC. Ellison's vision of widget-based online software has become conventional wisdom. The network computer failed as a product and as a business, but it seeded an idea—and a group of technologists—that would go on to remake the computing world.We typically think about failure in one of two ways: It's either something to avoid or something from which we can learn simple personal lessons about perseverance and character. Silicon Valley has long patted itself on the back for its acceptance—even promotion—of failure. By encouraging risk-taking, the tech industry allows bad ideas to get out of the way so good ones can take their place. But failure is not just the negative space surrounding success. Failures, too, can change the world—just as fundamentally as successes. They can serve as the necessary first round of innovation, the sacrificial lambs that bleed out an insight or vision or breakthrough before perishing.Everywhere you look, our world has been shaped fundamentally by failures. North American farmers in the early 1920s failed to cure their hay properly, causing an outbreak of internal hemorrhaging in cattle but eventually leading to the discovery of warfarin, an anticoagulant that has saved countless lives. Preston Tucker produced only 51 cars, but many of his ideas about safety prefigured the era of airbags and three-point seat belts. Xerox PARC invented the modern personal computer but was unable to capitalize on it, letting others take the technology—from the graphical user interface to the word processor—in thousands of different directions.In a way, seen through a long enough lens, everything is eventually a failure. Every innovation will ultimately be usurped by something that does the same thing more cheaply or more effectively or more elegantly. Everything is failing all the time; it's just a matter of how quickly and how devastatingly. In his 1964 book, The Nature of Design, industrial designer David Pye attempted to lay to rest the very notion of success: "Nothing we design or make ever really works. We can always say what it ought to do, but that it never does," he wrote. "Everything we design and make is an improvisation, a lash-up, something inept and provisional."The network computer was the embodiment of that: It didn't work as promised, it was too early, and it cost too much. But looking back now, it's hard to see it as anything but a success.<img alt="man in black suit with red tie" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_1600%2Cc_limit/fail_oracle6_f.jpg" srcSet="https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_120,c_limit/fail_oracle6_f.jpg 120w, https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_240,c_limit/fail_oracle6_f.jpg 240w, https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_320,c_limit/fail_oracle6_f.jpg 320w, https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_640,c_limit/fail_oracle6_f.jpg 640w, https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_960,c_limit/fail_oracle6_f.jpg 960w, https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_1280,c_limit/fail_oracle6_f.jpg 1280w, https://media.wired.com/photos/5bb6ad3cb1d78f2d74578355/master/w_1600,c_limit/fail_oracle6_f.jpg 1600w" sizes="100vw"/>Larry Ellison in 1997, two years into his push for the network computer.Photograph: CorbisEllison unleashed his concept on September 4, 1995, just days after he and Dibachi had come up with it. The setting was ironic: Ellison was serving as a warm-up act at International Data Corp.'s European IT Forum in Paris. The headliner? Bill Gates. Some of the analysts and techies in the room didn't even seem to know who Ellison was. It was a familiar if frustrating experience for the Oracle CEO; his company wasn't even close to being a household name.Ellison refused to be a second-stringer. "A PC is a ridiculous device," he said, launching an attack on Microsoft's core business. He ran down a list of the desktop's deficiencies: It was hard to learn to operate, expensive, overpowered, and—thanks to the arrival of the World Wide Web—increasingly irrelevant. That's why he was ushering in the post-PC era with the network computer, or NC, which Oracle would help build within a year. The simple $500 box would be a stripped-down unit that served one purpose: to connect to the Internet. For the NC, the Web wouldn't be a mere feature but a utility, as fundamental as water and electricity. "What the world really wants," Ellison told the crowd, "is to plug into a wall to get electronic power, and plug in to get data."Soon, software and hardware manufacturers around the world had signed on to help make Ellison's vision a reality. British computer maker Acorn began ferrying executives to California to discuss the possibility of an Acorn NC. IBM executive Bob Dies persuaded CEO Louis Gerstner to start building the bare-bones machines, eventually establishing a network computer division. "I explained to him that this could mean companies would not have to update every single desktop around their company," Dies says. "He saw the light quickly." Netscape cofounder Marc Andreessen declared the NC "a pretty major new business opportunity," predicting that hundreds of millions of the machines would be in homes and offices within 20 years. Frank Gens, an analyst at IDC, foretold a day when banks would give them away to attract new customers. "Once that happens, it becomes a completely different PC industry," he told BusinessWeek. "If I were Compaq, IBM, or Dell, I'd be thinking hard about that."Perhaps nobody was as excited as Eric Schmidt, CTO of Sun Microsystems. Within months, Sun built an NC prototype and began developing a lean operating system to run on it. Speaking to U.S. News & World Report, Schmidt couldn't stop raving about the idea's potential. Of course, the NC could greatly benefit his business: As the company responsible for the development of the Java programming language, which would power the Web applications, Sun and its work would gain new relevance. But the ramifications went way beyond Sun, he told the reporter. The NC would usher in a whole new world of computing, setting off a wave of innovation. "The implications are serious," he said. "If this takes off, it will have enormous impact."Consumers were just as captivated. Oracle executives received voicemails from strangers expressing interest in the machine. The company's salespeople fielded more questions about the NC than about the databases that constituted the bulk of Oracle's business. Internal support teams geared up to prepare for an onslaught of new customers once the rollout went global. In his attempt to take down a competitor, Ellison had stumbled upon a groundswell of pent-up demand. "The NC story just exploded beyond anything I imagined," Ellison said later. "It took on a life of its own."Obsessive competitiveness may have inspired Ellison's idea, but it also contributed to its downfall. His turf battle with Redmond ended up kneecapping his product. Looking to stem the momentum of Windows, Ellison promised to release low-cost machines within a year. That meant rushing out computers before they were fully developed. When it hit stores in the fall of 1996, the Acorn NC—commissioned by Oracle to be the model around which the new market would coalesce—had an underpowered ARM processor that produced blocky graphics and strained to render a Web page in less than four seconds. IBM's Network Station computers—the flagship corporate version of the NC—didn't fare much better. They were too slow, too limited, and too complicated to coordinate with company servers. Irving Wladawsky-Berger, who ran the Internet division at IBM and ultimately oversaw its NC project, was embarrassed. "We thought we had a full product," he says. "But when we took it to market, we realized it was an alpha."Oracle's rush to market also meant that the NC hit shelves before the infrastructure existed to support it. The machine was supposed to run lightweight Web applications instead of installed software—and everyone believed Java would be up to the task. But it was never able to support powerful-enough applications. And with wide-scale broadband penetration still many years away, Internet apps didn't stand a chance against local software.In the run-up to the release, Ellison's Ahab-like obsession with Microsoft fueled his need to be kept apprised of every development. Nonetheless, the globe-trotting CEO would often shift his focus to other projects, leaving his staff to make major decisions about the NC. ("Mr. Larry is near Australia in his sailboat and can't be reached," read one email from an Oracle employee to a member of the Acorn team. "The feeling on the staff here is that the case designs won't fly.")By 1999, the NC was basically dead. IBM had sold only 10,000 or so of its version and eventually shuttered its NC division; RCA had developed an NC as well, but it, too, sold only about 10,000, nearly all of which the company later recalled. Acorn imploded, and Netscape was crushed by Microsoft's Internet Explorer. Gates delivered his own, gloating coda in late 1998, speaking at the same Paris IT conference where Ellison had first announced the NC. "The network computer is pretty discredited," Gates told the crowd.False StartIn 1995, Larry Ellison began his network computer crusade. The effort failed, but the concept would spark what became cloud computing. —D.R.HardwareNetwork Computer: Low-cost boxes with tiny operating systems and read-only memory. Internet apps that are accessed via browser and dialup modem.Cloud Computing: Low-cost netbooks with low-cost operating systems. Internet apps that are accessed via browser and broadband connection.SoftwareNetwork: Productivity tools and games that are run as applets written in the Java programming language. Downloaded from the Internet.Cloud: Productivity tools and games that are run as applets written using protocols like Ajax and Ruby on Rails. No downloads required.ProponentsNetwork: Oracle, Sun, IBM, NetscapeCloud: Amazon.com, Google, Salesforce.comOpponentsNetwork: MicrosoftCloud: NoneThe NC offensive may have failed to create a new product category, but Ellison's primary motivation was not to sell millions of computers; he wanted to damage Microsoft while improving his own reputation. And by those standards, the NC was a rousing success. One of its main draws was price—for a fraction of the cost, NC customers would get everything they needed from a home computer. But almost immediately after the NC was announced, PC prices began to plummet, partially in response to Ellison's threat. From the 1970'''
