ired.com/photos/67bf00f8c61392e97f29f2aa/3:2/w_640,c_limit/GettyImages-200283166-001.jpg 640w, https://media.wired.com/photos/67bf00f8c61392e97f29f2aa/3:2/w_960,c_limit/GettyImages-200283166-001.jpg 960w, https://media.wired.com/photos/67bf00f8c61392e97f29f2aa/3:2/w_1280,c_limit/GettyImages-200283166-001.jpg 1280w, https://media.wired.com/photos/67bf00f8c61392e97f29f2aa/3:2/w_1600,c_limit/GettyImages-200283166-001.jpg 1600w" sizes="100vw"/><img alt="The US May Start Vaccinating Chickens Against Bird Flu" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67bf00f8c61392e97f29f2aa/3:2/w_1600%2Cc_limit/GettyImages-200283166-001.jpg"/>The US May Start Vaccinating Chickens Against Bird FluWith egg prices soaring, the US is considering vaccinating laying chickens, which have been hit particularly hard by the avian influenza outbreak.Emily Mullin<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_120,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 120w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_240,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 240w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_320,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 320w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_640,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_120,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 120w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_240,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 240w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_320,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 320w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_640,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 640w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_960,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 960w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_1280,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 1280w, https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_1600,c_limit/aids-ebola-musk-cuts-biz-2201510607.jpg 1600w" sizes="100vw"/><img alt="USAID Was Promised Emergency Waivers for Ebola and AIDS. They’re Not Working" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c08b1d568a100309836b63/3:2/w_1600%2Cc_limit/aids-ebola-musk-cuts-biz-2201510607.jpg"/>USAID Was Promised Emergency Waivers for Ebola and AIDS. They’re Not WorkingElon Musk claims he mistakenly fired Ebola prevention workers, then quickly fixed the error. But Ebola programs are still in tatters, along with other livesaving efforts like AIDS treatments for children.Kate Knibbs<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_120,c_limit/GettyImages-2166376964.jpg 120w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_240,c_limit/GettyImages-2166376964.jpg 240w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_320,c_limit/GettyImages-2166376964.jpg 320w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_640,c_limit/GettyImages-2166376964.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_120,c_limit/GettyImages-2166376964.jpg 120w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_240,c_limit/GettyImages-2166376964.jpg 240w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_320,c_limit/GettyImages-2166376964.jpg 320w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_640,c_limit/GettyImages-2166376964.jpg 640w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_960,c_limit/GettyImages-2166376964.jpg 960w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_1280,c_limit/GettyImages-2166376964.jpg 1280w, https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_1600,c_limit/GettyImages-2166376964.jpg 1600w" sizes="100vw"/><img alt="A Deadly Unidentified Disease Has Emerged in the DRC" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67bf988e013c3d92b0988170/3:2/w_1600%2Cc_limit/GettyImages-2166376964.jpg"/>A Deadly Unidentified Disease Has Emerged in the DRCMore than 50 people have died in the Democratic Republic of the Congo, most within 48 hours of the onset of symptoms. Initial analysis suggests neither Ebola nor Marburg is the cause.Marta Musso<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_120,c_limit/nih-doge-sci_1862240914.jpg 120w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_240,c_limit/nih-doge-sci_1862240914.jpg 240w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_320,c_limit/nih-doge-sci_1862240914.jpg 320w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_640,c_limit/nih-doge-sci_1862240914.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_120,c_limit/nih-doge-sci_1862240914.jpg 120w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_240,c_limit/nih-doge-sci_1862240914.jpg 240w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_320,c_limit/nih-doge-sci_1862240914.jpg 320w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_640,c_limit/nih-doge-sci_1862240914.jpg 640w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_960,c_limit/nih-doge-sci_1862240914.jpg 960w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_1280,c_limit/nih-doge-sci_1862240914.jpg 1280w, https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_1600,c_limit/nih-doge-sci_1862240914.jpg 1600w" sizes="100vw"/><img alt="DOGE Is Inside the National Institutes of Health" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67bc948ddd1ccc25ebe00577/3:2/w_1600%2Cc_limit/nih-doge-sci_1862240914.jpg"/>DOGE Is Inside the National Institutes of HealthAt least three people linked to Elon Musk’s DOGE task force have access to NIH systems that control budgets, procurement, and more, according to records and internal documents viewed by WIRED.Matt ReynoldsEnvironment<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_120,c_limit/GettyImages-453765600.jpg 120w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_240,c_limit/GettyImages-453765600.jpg 240w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_320,c_limit/GettyImages-453765600.jpg 320w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_640,c_limit/GettyImages-453765600.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_120,c_limit/GettyImages-453765600.jpg 120w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_240,c_limit/GettyImages-453765600.jpg 240w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_320,c_limit/GettyImages-453765600.jpg 320w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_640,c_limit/GettyImages-453765600.jpg 640w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_960,c_limit/GettyImages-453765600.jpg 960w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_1280,c_limit/GettyImages-453765600.jpg 1280w, https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_1600,c_limit/GettyImages-453765600.jpg 1600w" sizes="100vw"/><img alt="DOGE’s Chaos Reaches Antarctica" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67bde899feb8b09330229a7f/3:2/w_1600%2Cc_limit/GettyImages-453765600.jpg"/>DOGE’s Chaos Reaches AntarcticaDaily life at US-run Antarctic stations has already been disrupted. Scientists worry that the long-term impacts could upend not only important research but the continent’s delicate geopolitics.Leah Feiger<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_120,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 120w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_240,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 240w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_320,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 320w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_640,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_120,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 120w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_240,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 240w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_320,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 320w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_640,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 640w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_960,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 960w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_1280,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 1280w, https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_1600,c_limit/costarica-jungle-canopy-sci-1357649377.jpg 1600w" sizes="100vw"/><img alt="Costa Rica Is Saving Forest Ecosystems by Listening to Them" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67bdf361deb5bda36f6d5a40/3:2/w_1600%2Cc_limit/costarica-jungle-canopy-sci-1357649377.jpg"/>Costa Rica Is Saving Forest Ecosystems by Listening to ThemMonitoring the noises within ecosystems reveals their health—allowing researchers to monitor changes in biodiversity, detect threats, and measure the effectiveness of conservation strategies.Geraldine Castro<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67b4ab66037433678dcc6660/3:2/w_120,c_limit/AP21301449463184.jpg 120w, https://media.wired.com/photos/67b4ab66037433678dcc6660/3:2/w_240,c_limit/AP21301449463184.jpg 240w, https://media.wired.com/photos/67b4ab66037433678dcc6660/3:2/w_320,c_limit/AP21301449463184.jpg 320w, https://media.wired.com/photos/67b4ab66037433678dcc6660/3:2/w_640,c_limit/AP21301449463184.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67b4ab66037433678dcc6660/3:2/w_120,c_limit/AP21301449463184.jpg 120w, https://media.wired.com/photos/67b4ab66037433678dcc6660/3:2/w_240,c_limit/AP21301449463184.jpg 240w, https://media.wired.com/photos/67b4'
