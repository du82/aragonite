title = "14 Best Hoodies for Style, Comfort, and Warmth (2025) | WIRED"
description = "Whether you’re lounging around at home, running errands, or going on a hike, we’ve got the perfect option for you."
full_description = '''Boutayna Chokrane GearMar 1, 2025 10:02 AMThe Best Hoodies for Work or PlayA hooded sweatshirt is a wardrobe staple. You’re probably wearing one right now! These are our favorite hoodies for comfort, style, and warmth.FacebookXEmailSave StoryPhotograph: MadHappyFacebookXEmailSave StoryFeatured in this articleThe Best Hoodie OverallAmerican Giant Classic Full Zip Read more$138 at American GiantA Heavyweight Hoodie for the Sunday ScariesMad Happy Classics Fleece HoodieRead more$175 at Mad HappyThe Best Unisex HoodieNike Sportswear Club Fleece Pullover HoodieRead more$68 at AmazonThe Original HoodieChampion Reverse Weave SweatshirtRead more$55 $50 at AmazonShow more4 / 14Most of us keep our best hoodies around for years. A hooded sweatshirt can be a statement piece, but you’re also probably wearing one over your pajamas, while working out at the gym, or pulled over your head on a long flight. There are so many different fabrics, cuts, price points, and styles that you can never have enough hoodies in your closet.Do you find yourself overwhelmed? Is it mentally and emotionally difficult to replace the threadbare one in your closet right now? We're here to help make it easier. The Gear team waded through a ton of hoodies—OK, it wasn’t hard—and picked our favorites for every activity and price point you can imagine. Need to complete the look? Check out the rest of our buying guides, including the Best Barefoot Shoes, the Best Leggings, and the Best Merino Wool Clothes.Updated March 2025: We've added the Mad Happy Classic Fleece Hoodie, the Nike Sportswear Club Fleece Pullover Hoodie, the Arms of Andes Alpaca Wool Hoodie Jacket, the Kids of Immigrants For Our Family hoodie, the Branwyn Swag Hoodie, and the Fjällräven Vardag Hoodie. We also updated prices and links.Power up with unlimited access to WIRED. Get best-in-class reporting that's too important to ignore for just $2.50 $1 per month for 1 year. Includes unlimited digital access and exclusive subscriber-only content. Subscribe Today.How We Test HoodiesAccordionItemContainerButtonLargeChevronMultiple writers on WIRED's gear team have contributed to this guide, but we test all hoodies by wearing them regularly for multiple activities, from walking the dog, going running, wearing them to the gym, and wearing them in at least seven Zoom meetings minimum per diem. We also put all of our hoodies through several wash and wear cycles to test how to fabric will hold up over time. Does the material feel soft? Have the colors faded or the stitching come loose?We also judge it based on fit, including how the cut and waistband fit along with the length of the sleeves. Most importantly, we make sure it's comfortable and worth the investment. If it's a hoodie we find ourselves constantly reaching for in our closet, then it's safe to say it's WIRED-approved.Photograph: American GiantThe Best Hoodie OverallAmerican Giant Classic Full Zip This zip-up hoodie from American Giant (the brand's signature product) got a ton of attention when it launched in 2012. The tech columnist Farhad Manjoo, writing for Slate at the time, called it "The Greatest Hoodie Ever Made." Strong words, and over a decade later, the phrase still carries the stench of hyperbole. But I'll tell you something: I got one of these full-zips in 2013, and it's still going strong. I wear it regularly, and it hasn't stretched or frayed, just attractively faded with dozens of washes. The full cotton fleece is indeed very heavy and thick, so much so that it's really only comfortable to wear on colder days. I'll sweat inside of it if the thermometer gets above the low 60s Fahrenheit. (The company also makes a lighter version from a cotton-poly blend that reviewer Martin Cizmar also likes.) The elbows are reinforced with patches, and the hood is double-lined. It's a tank. I can recommend it to anyone who needs something warm and durable that will last forever. And the whole thing is spun and sewn in the US.There are two fits, classic and relaxed. I prefer the classic fit because it's cut slim and snug at the waist (and it has stayed nice and snug through a decade-plus of wear) while leaving plenty of room at the shoulders. The classic cut relaxes the waist a bit if you don't like the snug feeling. —Michael Calore100 percent combed ring-spun cotton★ If you want a pullover instead: This is the non-zip version of the brand's Classic hoodie. The material is the same—100 percent cotton fleece—and it's all spun and assembled in the US. The durable reinforced elbows and the wind-stopping, double-lined hood are present here as well. The main difference, aside from the lack of a zipper, is a slightly more relaxed cut. It's snug at the waist and roomy in the shoulders but offers a little more room in the middle. It's just as toasty as the zip-up too. If you want to see how to wear this properly, check out Michael Che's Netflix comedy special, “Matters.” He wears one on stage.100 percent combed ringspun cotton$138 at American Giant<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_120%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 120w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_240%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 240w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_320%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 320w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_640%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 640w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_800%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_320%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 320w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_640%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 640w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_960%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 960w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_1280%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 1280w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_1600%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 1600w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_1920%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 1920w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_2240%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 2240w, https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_2580%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg 2580w" sizes="100vw"/><img alt="A blue Mad Happy Classics Fleece Hoodie laid flat" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c2199410f97865da3e53a8/master/w_320%2Cc_limit/Mad-Happy-Classics-Fleece-Hoodie-(blue)-Offwhite-Background-SOURCE-Mad-Happy.jpg"/>Photograph: MadHappyA Heavyweight Hoodie for the Sunday ScariesMad Happy Classics Fleece HoodieMadhappy built its streetwear brand around optimism and mental health awareness, a refreshing message that resonated with its growing cult following (and celebrities like Lebron James and Gigi Hadid). At $175, this is one of the spendier hoodies on this list, but it quality backs up the price; it’s 100 percent cotton and the subtle details like the embroidered Madhappy logo and hand-stitched hood give it an elevated feel.The fit is already roomy, but I like to drown in my hoodie and can’t help but size up. I love it for travel days; it lets me disappear into my own world at the airport, but paired with the matching sweats, I still look somehow put together. —Boutayna Chokrane100 percent cotton$175 at Mad Happy<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_120%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 120w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_240%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 240w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_320%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 320w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_640%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 640w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_800%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_320%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 320w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_640%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 640w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_960%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 960w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_1280%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 1280w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_1600%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 1600w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_1920%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 1920w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_2240%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 2240w, https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_2580%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg 2580w" sizes="100vw"/><img alt="Two people wearing black Nike Sportswear Club Fleece Pullover Hoodies the person on the left with brown braids and grey..." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c218f68813e85f7980975c/master/w_320%2Cc_limit/Nike-Sportswear-Club-Fleece-Pullover-Hoodie-(black-lifestyle-duo)-Offwhite-Background-SOURCE-Nike.jpg"/>Photograph: NikeThe Best Unisex HoodieNike Sportswear Club Fleece Pullover HoodieI worked at a Nike store for a year, and I bought this hoodie in at least five colors. It was my uniform—both on and off the clock—and I practically lived in it. The Sportswear Club Fleece hoodie is a staple for everyday wear: standard fit, cozy but not overly slouchy, with ribbed hems and cuffs. It’s also designed with a drawstring hood for when you need a little extra anonymity. During my shifts, I liked to stash the essentials in my kangaroo pocket: phone, lip balm, and emergency Starbursts.Nike recommends your usual size if you wear men’s styles and sizing down if you usually shop women’s. I prefer sizing up (sometimes two sizes) for a relaxed fit. It comes in a ridiculous amount of colors—Nike drops new ones all the time—so if your favorite shade is sold out, there’s a good chance it’ll make a comeback. Mine have survived five years (and counting) of near-daily wear and constant washes, but I recommend air-drying to avoid shrinkage. —Boutayna Chokrane80-82 percent cotton, 18-20 percent polyester$68 at Amazon<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_120%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 120w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_240%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 240w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_320%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 320w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_640%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 640w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_800%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_320%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 320w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_640%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 640w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_960%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 960w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_1280%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 1280w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_1600%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 1600w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_1920%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 1920w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_2240%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 2240w, https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_2580%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg 2580w" sizes="100vw"/><img alt="Grey longsleeve sweatshirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/66c8ece41d97d2d806fa9fad/master/w_320%2Cc_limit/Champion-Reverse-Weave-Sweatshirt-(grey)-Offwhite-Background-SOURCE-Amazon.jpg"/>Photograp'''
