/3:2/w_120,c_limit/021325-women-telegram-group-doxing.jpg 120w, https://media.wired.com/photos/67ae75c33240a7baea6b9369/3:2/w_240,c_limit/021325-women-telegram-group-doxing.jpg 240w, https://media.wired.com/photos/67ae75c33240a7baea6b9369/3:2/w_320,c_limit/021325-women-telegram-group-doxing.jpg 320w, https://media.wired.com/photos/67ae75c33240a7baea6b9369/3:2/w_640,c_limit/021325-women-telegram-group-doxing.jpg 640w, https://media.wired.com/photos/67ae75c33240a7baea6b9369/3:2/w_960,c_limit/021325-women-telegram-group-doxing.jpg 960w, https://media.wired.com/photos/67ae75c33240a7baea6b9369/3:2/w_1280,c_limit/021325-women-telegram-group-doxing.jpg 1280w, https://media.wired.com/photos/67ae75c33240a7baea6b9369/3:2/w_1600,c_limit/021325-women-telegram-group-doxing.jpg 1600w" sizes="100vw"/><img alt="Inside the Telegram Groups Doxing Women for Their Facebook Posts" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67ae75c33240a7baea6b9369/3:2/w_1600%2Cc_limit/021325-women-telegram-group-doxing.jpg"/>Inside the Telegram Groups Doxing Women for Their Facebook PostsA WIRED investigation goes inside the Telegram groups targeting women who joined “Are We Dating the Same Guy?” groups on Facebook with doxing, harassment, and sharing of nonconsensual intimate images.Anna Wolfe and Sarah Cammarata<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_120,c_limit/020325-speed-racers.jpg 120w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_240,c_limit/020325-speed-racers.jpg 240w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_320,c_limit/020325-speed-racers.jpg 320w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_640,c_limit/020325-speed-racers.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_120,c_limit/020325-speed-racers.jpg 120w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_240,c_limit/020325-speed-racers.jpg 240w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_320,c_limit/020325-speed-racers.jpg 320w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_640,c_limit/020325-speed-racers.jpg 640w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_960,c_limit/020325-speed-racers.jpg 960w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_1280,c_limit/020325-speed-racers.jpg 1280w, https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_1600,c_limit/020325-speed-racers.jpg 1600w" sizes="100vw"/><img alt="The Anonymous YouTubers Street-Racing Through New York" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67a134f24f619201239c1e42/3:2/w_1600%2Cc_limit/020325-speed-racers.jpg"/>The Anonymous YouTubers Street-Racing Through New YorkIn January, a 20-year-old man that police believe to be an internet-famous street racer known as Squeeze was sentenced to five years in prison for unrelated crimes. Many more still speed through New York City and put it all on YouTube.Jessica Lucas<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67b778fadcbd2b753745187a/3:2/w_120,c_limit/WIRED-MX-Netflix-Production-Mexico-Culture-2200014956.jpg 120w, https://media.wired.com/photos/67b778fadcbd2b753745187a/3:2/w_240,c_limit/WIRED-MX-Netflix-Production-Mexico-Culture-2200014956.jpg 240w, https://media.wired.com/photos/67b778fadcbd2b753745187a/3:2/w_320,c_limit/WIRED-MX-Netflix-Production-Mexico-Culture-2200014956.jpg 320w, https://media.wired.com/photos/67b778fadcbd2b753745187a/3:2/w_640,c_limit/WIRED-MX-Netflix-Production-Mexico-Culture-2200014956.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67b778fadcbd2b753745187a/3:2/w_120,c_limit/WIRED-MX-Netflix-Production-Mexico-Culture-2200014956.jpg 120w, https://media.wired.com/photos/67b778