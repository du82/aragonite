["https://wired.com/2015/04/silk-road-1"]
title = "The Untold Story of Silk Road, Part 1 | WIRED"
description = "How a 29-year-old idealist built a global drug bazaar and became a murderous kingpin."
full_description = "“I imagine that someday I may have a story written about my life and it would be good to have a detailed account of it.”—home/frosty/documents/journal/2012/q1/january/week1 The postman only rang once. Curtis Green was at home, greeting the morning with 64 ounces of Coca-Cola and powdered mini doughnuts. Fingers frosted synthetic white, he was startled to hear someone at the door. It was 11 am, and surprise visits were uncommon at his modest house in Spanish Fork, Utah, a high-desert hamlet in the shadow of the Wasatch Mountains. Green ambled over, adjusting his camouflage fanny pack. At 47 his body was already failing him: He was overweight, with four herniated discs, a bum knee, and gleaming white dental implants. To get around he sometimes borrowed his wife’s pink cane. Green waddled to the door, his two Chihuahuas, Max and Sammy, following attentively. He peeked through the front window and caught a glimpse of the postman hurrying off. The guy was wearing a US Postal Service jacket, but with sneakers and jeans. Weird, Green thought. Also odd was a van Green noticed across the street, one he’d never seen before: white, with no logos or rear windows. Green opened the door. It was winter, a day of high clouds and low sun. A pale haze washed out the white-tipped Spanish Fork Peak rising above the valley. Green looked down. On the porch sat a Priority box—about Bible-sized. His little dogs watched him pick up the mystery package. It was heavy, had no return address, and bore a postmark from Maryland. Green considered the package and then took it into his kitchen, where he tore it open with scissors, sending up a plume of white powder that covered his face and numbed his tongue. Just then the front door burst open, knocked off its hinges by a SWAT team wielding a battering ram. Quickly the house was flooded by cops in riot gear and black masks, weapons at the ready. There was Green, covered in cocaine and flanked by two Chihuahuas. “On the floor!” someone yelled. Green dropped the package where he stood. When he tried to comfort his pups, a dozen guns took aim: “Keep your hands where we can see them!”"
