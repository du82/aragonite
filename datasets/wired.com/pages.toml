full_description = '''Business<source media="(max-width: 767px)" srcSet="" sizes="100vw"/><source media="(min-width: 768px)" srcSet="" sizes="100vw"/><img alt="DOGE&#x27;s Misplaced War on Software Licenses" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c223aa653c2b72f50a911f/16:9/pass/DOGE-Software-Purge-Business-2201518354.jpg"/>TakeoverDOGE's Misplaced War on Software LicensesDOGE claims that a government agency has nearly three times as many software licenses as employees. Experts say there are plenty of good reasons for that.Paresh Dave<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_120,h_180,c_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg 120w, https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_240,h_180,c_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg 240w, https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_320,h_180,c_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg 320w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_120,h_360,c_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg 120w, https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_240,h_360,c_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg 240w, https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_320,h_360,c_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg 320w, https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_640,h_360,c_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg 640w" sizes="100vw"/><img alt="Google’s Taara Hopes to Usher in a New Era of Internet Powered by Light" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c0ba8267cb890683c776f5/16:9/w_640%2Ch_360%2Cc_limit/Plaintext-Internet-By-Light-h_31.RC2TN1A0JKTL.jpg"/>PlaintextGoogle’s Taara Hopes to Usher in a New Era of Internet Powered by LightSteven Levy<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_120,h_180,c_limit/GettyImages-1247584033.jpg 120w, https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_240,h_180,c_limit/GettyImages-1247584033.jpg 240w, https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_320,h_180,c_limit/GettyImages-1247584033.jpg 320w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_120,h_360,c_limit/GettyImages-1247584033.jpg 120w, https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_240,h_360,c_limit/GettyImages-1247584033.jpg 240w, https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_320,h_360,c_limit/GettyImages-1247584033.jpg 320w, https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_640,h_360,c_limit/GettyImages-1247584033.jpg 640w" sizes="100vw"/><img alt="The SEC Is Abandoning Its Biggest Crypto Lawsuits" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c1cb549497ba94653c8b9a/16:9/w_640%2Ch_360%2Cc_limit/GettyImages-1247584033.jpg"/>Free to GoThe SEC Is Abandoning Its Biggest Crypto LawsuitsJoel KhaliliArtificial Intelligence<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_120,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 120w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_240,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 240w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_320,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 320w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_640,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_120,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 120w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_240,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 240w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_320,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 320w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_640,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 640w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_960,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 960w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_1280,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 1280w, https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_1600,c_limit/OpenAI-Chat-GPT-Business-2198339919.jpg 1600w" sizes="100vw"/><img alt="OpenAI Launches GPT-4.5 for ChatGPT&amp;-It’s Huge and Compute-Intensive" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/67c0bc79bb3318089c5123d4/3:2/w_1600%2Cc_limit/OpenAI-Chat-GPT-Business-2198339919.jpg"/>OpenAI Launches GPT-4.5 for ChatGPT—It’s Huge and Compute-IntensiveInternally called Orion, GPT-4.5 is OpenAI’s largest model to date, and it’s first available through the company’s $200 monthly ChatGPT subscription.Reece Rogers<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/67be17abc4bb02587ec88489/3:2/w_120,c_limit/AI-Lab-Humanoid-Robots-145083514.jpg 120w, https://media.wired.com/photos/67be17abc4bb02587ec88489/3:2/w_240,c_limit/AI-Lab-Humanoid-Robots-145083514.jpg 240w, https://media.wired.com/photos/67be17abc4bb02587ec88489/3:2/w_320,c_limit/AI-Lab-Humanoid-Robots-145083514.jpg 320w, https://media.wired.com/photos/67be17abc4bb02587ec88489/3:2/w_640,c_limit/AI-Lab-Humanoid-Robots-145083514.jpg 640w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/67be17abc4bb02587ec88489/3:2/w_120,c_limit/AI-Lab-Humanoid-Robots-145083514.jpg 120w, https://media.wired.com/photos/67be1