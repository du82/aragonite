title = "Best iPad Accessories (2025), Tested and Reviewed | WIRED"
description = "Looking for the best iPad accessories? These are some of our favorite stands, cases, keyboards, and styli, no matter which Apple tablet you have."
full_description = '''Julian Chokkattu Brenda StolyarGearFeb 28, 2025 9:00 AMThe Best iPad AccessoriesThese are some of our favorite stands, cases, keyboards, and styli, no matter which Apple tablet you have.FacebookXEmailSave StoryFacebookXEmailSave StoryIf you buy something using links in our stories, we may earn a commission. Learn more.Featured in this articleBest Overall Folio Case Zugu CaseRead more$50 at AmazonAn Easy Way to Draw or WriteApple Pencil USB-C, Second-Gen, Apple Pencil ProRead more$79 $69 at Amazon (USB-C)Comfortable Pencil GripsPaperlike Pencil Grips (1st-Generation)Read more$30 at AmazonBest Cheap Stand-Up CaseSpigen Rugged Armor ProRead more$30 at AmazonShow more4 / 23One of the best parts of owning an iPad is that you're never short on accessories. There's a wealth of cases, cables, adapters, styli, keyboards, and stands out there to trick out your slate. But what should you buy? I've spent years filling a corner of my tiny New York apartment with boxes of gear to find the best iPad accessories. Whether you’re a longtime iPad owner or recently picked one up after perusing our Best iPad guide, there's something here for you.Check out our many other buying guides, including the Best iPhone, Best iPhone 16 Cases, Best MagSafe Accessories, Best Apple 3-in-1 Chargers, Best Tablets, and Best Drawing Apps.Updated February 2025: We've added new accessories including the Zagg Pro Keys 2, ESR Rebound Keyboard Case (13-inch iPad Pro M4), UGreen 145W Power Bank, and Satechi Mouse M1.Power up with unlimited access to WIRED. Get best-in-class reporting that's too important to ignore for just $2.50 $1 per month for 1 year. Includes unlimited digital access and exclusive subscriber-only content. Subscribe Today.Wait. Which iPad Do You Own?AccordionItemContainerButtonLargeChevronThere are so many iPads out there, it can be hard to identify the exact model you own. Do you have the iPad Pro from 2017 with the 10.5-inch screen? Or the 9.7-inch one from 2016? It doesn't help that Apple avoids the sequential naming structure it uses for the iPhone. But no matter.Finding your model is simple:Look at the back of your iPad. Etched on the back cover, near where it says "Designed by Apple in California," should be a model number starting with the letter A.Head to this website from Apple. Look for your corresponding model number, and that's it! You found your iPad model. (Pro tip: Use your browser's "Find in Page" function to type in your model number and locate it quickly.)Accessory makers usually indicate what iPad a case, folio, or keyboard cover is designed to work with. Most of our picks below are for the newest hardware, but they're often also available for older iPads. Just search for the product name and your iPad model.If you see a retailer mentioning a specific generation, this is Apple's current lineup:iPad: 10th generation (2022)iPad Mini: 7th generation (A17 Pro, 2024)iPad Air 11-inch: 6th generation (M2, 2024)iPad Air 13-inch: 1st generation (M2, 2024)iPad Pro 11-inch: 5th generation (M4, 2024)iPad Pro 13-inch: 7th generation (M4, 2024)Photograph: ZuguBest Overall Folio Case Zugu CaseIt took mere minutes to realize I was looking at the best iPad case I'd ever tried. Zugu has been making iPad cases for a long time, and it has one for practically every model out there. This case feels durable, with a rigid bumper around the edges, and the buttons are easy to press. There's a sizable lip sticking out of the edges to protect the screen if it falls flat, which is nice. The cover is magnetized so it stays shut (and can wake or put the screen to sleep). Flip it around and pull out the flap on the back to magnetically adjust the screen for up to eight (eight!) different angles. Because the cover is rigid and large, it's also one of the most stable iPad cases I've ever used on my lap.Best of all, since the case is magnetic, you can just stick the whole thing to a fridge and it stays secure. It's well-designed, comes in an array of colors, is reasonably priced, and even has a spot to securely store the Apple Pencil when it's not charging. It's hard to find faults here—Zugu also donates 10 percent of all its profits to charitable causes like Children International. It's also available for the iPad Air (13-inch, M2) and both sizes of the iPad Pro (M4) for $70 and $80, respectively.$50 at Amazon$50 at Zugu<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_120%2Cc_limit/DSC_0258.jpg 120w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_240%2Cc_limit/DSC_0258.jpg 240w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_320%2Cc_limit/DSC_0258.jpg 320w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_640%2Cc_limit/DSC_0258.jpg 640w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_800%2Cc_limit/DSC_0258.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_320%2Cc_limit/DSC_0258.jpg 320w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_640%2Cc_limit/DSC_0258.jpg 640w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_960%2Cc_limit/DSC_0258.jpg 960w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_1280%2Cc_limit/DSC_0258.jpg 1280w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_1600%2Cc_limit/DSC_0258.jpg 1600w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_1920%2Cc_limit/DSC_0258.jpg 1920w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_2240%2Cc_limit/DSC_0258.jpg 2240w, https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_2580%2Cc_limit/DSC_0258.jpg 2580w" sizes="100vw"/><img alt="Person holding the Apple Pencil Pro" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/663aba0dec431c62cc42834e/master/w_320%2Cc_limit/DSC_0258.jpg"/>Photograph: Julian ChokkattuAn Easy Way to Draw or WriteApple Pencil USB-C, Second-Gen, Apple Pencil ProThe Apple Pencil is one of the most useful tools you can add to the iPad. Specific models work with certain iPads. (Apple has a guide here so you can check compatibility.) It's excellent for drawing, with an imperceptible delay as the Pencil moves across the glass display. Like a normal pencil, your lines get thicker as you press down harder. The Pencil is also great for navigating iPadOS, which has handwriting support in various search fields so you don't need to switch to the keyboard to type—and it's handy for signing or marking up documents.With the current iPad lineup, there's not much of a reason to buy the first-generation Pencil, which had some drawbacks anyway. The USB-C Pencil has the fewest features—there's no pressure sensitivity so it's useless for sketching, and it doesn't wirelessly pair and charge (hence the built-in USB-C port). It also doesn't have the touch-sensitive controls that let you quickly switch to a previous tool or to open a tool palette. Honestly, the Apple Pencil Pro is often available for not much more and should be the stylus to buy, though it's compatible with far fewer iPads. It has a “squeeze” capability that triggers the tool palette (you can still use double-tap) along with a haptic engine inside that delivers feedback as you squeeze. There's a built-in gyroscope sensor, which allows you to change the orientation of the tools as you twist it (for finer control), and it has support for Apple's Find My Network in case you accidentally lose it.The in-between that Apple no longer sells (but is still available at other retailers) is the second-gen Apple Pencil. It has broad compatibility with several iPads from the past few years, though it won't work with some of the latest models.$79 $69 at Amazon (USB-C)$129 $114 at Apple (Second Gen)$129 $99 at Amazon (Pencil Pro)<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_120%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 120w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_240%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 240w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_320%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 320w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_640%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 640w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_800%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_320%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 320w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_640%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 640w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_960%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 960w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_1280%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 1280w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_1600%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 1600w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_1920%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 1920w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_2240%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 2240w, https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_2580%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg 2580w" sizes="100vw"/><img alt="White digital pencil with grey cushioned grip" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/662bd95b225b88b316a4222c/master/w_320%2Cc_limit/paperlike-pencil-grips-SOURCE-Paperlike.jpg"/>Photograph: PaperlinkComfortable Pencil GripsPaperlike Pencil Grips (1st-Generation)Paperlike's Pencil Grips come in a two-pack. You'll get the Maximum Comfort Grip (designed to reduce fatigue and hand cramps during long drawing or writing sessions) and the Maximum Precision Grip (for better stroke precision and accuracy). I only use the second-generation Apple Pencil for note-taking, so the Comfort Grip made it easier to grasp. It could also be helpful if you have the first-generation Apple Pencil and find the glossy finish too slippery. It's great for sketching, keeps finger fatigue at bay (especially when applying pressure over time), and is comfortable when drawing for long periods.If you have the second-generation Apple Pencil, the grips won't get in the way of the double-tap feature either. It's worth noting these grips are the first-generation version—Paperlike has since launched a new version that delivers “ergonomic precision” for $20. We haven't tested them yet, but they'll likely be better for those who spend more time sketching on their iPads than writing. These specific grips are ideal if you often switch between the two forms.$30 at Amazon$16 at Paperlike<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_120%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 120w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_240%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 240w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_320%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 320w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_640%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 640w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_800%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_320%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 320w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_640%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 640w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_960%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 960w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_1280%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 1280w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_1600%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 1600w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_1920%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 1920w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_2240%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 2240w, https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_2580%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg 2580w" sizes="100vw"/><img alt="Image may contain Electronics Computer and Tablet Computer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.wired.com/photos/5fe3d8ee6a4c22d9a32779ea/master/w_320%2Cc_limit/Gear-Spigen-Rugged-Armor-Pro-SOURCE-Spigen.jpg"/>Photograph: SpigenBest Cheap Stand-Up CaseSpigen Rugged Armor ProSpigen's folio case is bulkier than Apple's official case, but it protects the entire tablet with a bumper covering the edges. There's also a tough back cover made of thermoplastic polyurethane and polyurethane leather, plus a magnetic latch to keep the folio closed. You can convert the display cover into a stand to prop the whole thing up (there are two angle options). When the iPad's in Theater Mode, you won't see much wobble or sliding when tapping the screen. There's a spot to secure the Apple Pencil, but don't worry, the second-gen stylus will still pair and charge. Unfortunately, when you cover the display up, it won't automatically shut it off.$30 at Amazon<source media="(max-width: 767px)" srcSet="https://media.wired.com/photos/63599df13d7842cc349a21f6/master/w_120%2Cc_limit/Twelve-South-HoverBar-Duo-2-SOURCE-Twelve-South-Gear.jpg 120w, https://media.wired.com/photos/63599df13d7842cc349a21f6/master/w_240%2Cc_limit/Twelve-South-HoverBar-Duo-2-SOURCE-Twelve-South-Gear.jpg 240w, https://media.wired.com/photos/63599df13d7842cc349a21f6/master/w_320%2Cc_limit/Twelve-South-HoverBar-Duo-2-SOURCE-Twelve-South-Gear.jpg 320w, https://media.wired.com/photos/63599df13d7842cc349a21f6/master/w_640%2Cc_limit/Twelve-South-HoverBar-Duo-2-SOURCE-Twelve-South-Gear.jpg 640w, https://media.wired.com/photos/63599df13d7842cc349a21f6/master/w_800%2Cc_limit/Twelve-South-HoverBar-Duo-2-SOURCE-Twelve-South-Gear.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.wired.com/photos/63599df13d7842cc349a21f6/master/w_320%2Cc_limit/Twelve-South-HoverBar-Duo-2-SOURCE-Twelve-South-Gear.jpg 320w, https://media.wired.com/photos/6'''
