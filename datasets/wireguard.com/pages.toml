title = "Donations - WireGuard"
full_description = '''Donations We're extremely grateful for all donations, which enable us to continue developing WireGuard as free open source software. We are happy to receive donations from interested companies who would like to see WireGuard development continue and thrive, as well as individual donations from folks who would simply like to say "thanks". By popular demand, you can now donate to WireGuard development via several means. Don't hesitate to ask us for stickers. #payment-bitcoin img { width: 250px; margin: 0 auto; display: block; } .tab-pane { padding-top: 0.5em; padding-bottom: 0.5em; } #other-amount { width: 200px; display: none; } #submit-other:hover { color: #ae373a; } input[name="other"]:focus { border-color: #dce4ec; } #largedonation { font-size: 0.8em; margin-top: 3em; } .grecaptcha-badge { opacity: 0.1; z-index: -1000 !important; } #monthly-buttons { margin-bottom: 2em; } #monthly-buttons a { height: 4em; padding-top: 1.3em; } #monthly-buttons .btn:nth-child(2) { padding-top: .5em; } Contribute Monthly Monthly donations help keep WireGuard development sustainable in the long run. GitHub Sponsors Paypal(check the "monthly" box) Patreon Liberapay Contribute Once Stripe Bitcoin Paypal We're happy to receive donations via Stripe, of the amount of your choosing. $10 $25 $50 $100 $250 Other $ We welcome all incoming Bitcoin donations. Don't hesitate to send an email after if you'd like your name listed on this page. Please use Bitcoin wallet 3Jsk6BuNkzW22RaCS1UaJy8w4bCwtVCkUF. If you intend to donate a very large amount, and wish to do so via other means such as bank transfer, please don't hesitate to send us an email. (function() { $('#donation-tabs a[href^="#"]').click(function(e) { e.preventDefault(); $(this).tab('show'); }); $('input[type="radio"][name="amount"]').change(function() { if (this.value == 'other') { $("#other-amount").parent().css("padding", "9px"); $("#other-amount").css("display", "table"); $("#other-label").css("display", "none"); $("#other-amount input").val("").focus(); } else { $("#other-amount").parent().css("padding", ""); $("#other-amount").css("display", "none"); $("#other-label").css("display", ""); } }); var test_mode = location.search == "?stripe_mode=test"; var amount = 0; var replaced = false; var handler = StripeCheckout.configure({ key: test_mode ? 'pk_test_nMOzrY86BhArpT3L5V5cliTA' : 'pk_live_1NItjSWA2qFGAITqBPyfN1ZG', image: 'https://www.wireguard.com/img/emblem-circle.svg', locale: 'auto', token: function(token) { replaced = true; $("#payment-stripe").html('<h4><i class="fa fa-spinner fa-pulse fa-fw"></i> Processing donation...</h4>'); grecaptcha.ready(function() { grecaptcha.execute('6LdJbGUUAAAAAGcdUgjwx0UENHIzP-bSdmiFXkTA', {"action": "post_stripe_payment"}).then(function(recaptcha) { $.post('/process-stripe', { "token": token.id, "email": token.email, "amount": amount, "recaptcha": recaptcha, "test": test_mode.toString() }, function(data) { if (data.success) $("#payment-stripe").html('<h4>Thank you for your donation!</h4><p>Feel free to <a href="mailto:team@wireguard.com">email us</a> if you would like us to mail you some stickers.</p>'); else { $("#payment-stripe").html('<h1><i class="fa fa-exclamation-triangle"></i></h1><h5></h5><p>There has been an error, and you have not been charged. Please try again or <a href="mailto:team@wireguard.com">email us</a>.'); $("#payment-stripe h5").text(data.message); } }, "json"); }); }); }, closed: function() { if (replaced) return; $('input[type="radio"][name="amount"]').prop('checked', false); $('input[type="radio"][name="amount"]').closest("label").removeClass("active"); $("#other-amount").parent().css("padding", ""); $("#other-amount").css("display", "none"); $("#other-label").css("display", ""); }, name: 'Donation', description: 'Support WireGuard Development', allowRememberMe: false, panelLabel: "Donate {{amount}}" }); function openHandler(amount) { grecaptcha.ready(function() { grecaptcha.execute('6LdJbGUUAAAAAGcdUgjwx0UENHIzP-bSdmiFXkTA', {"action": "open_stripe_form"}); handler.open({ amount: amount }); }); } $('#submit-other').click(function(e) { var el = $('input[name="other"]'); var a = el.val() | 0; if (a && a < 5) el.val(5); amount = (el.val() * 100) | 0; if (!amount) return; e.preventDefault(); openHandler(amount); }); $('input[name="other"]').change(function(e) { var a = $(this).val() | 0; if (!a || a >= 5) return; $(this).val(5); }); $('input[name="other"]').keypress(function(e) { if (e.keyCode != 13) return; var a = $(this).val() | 0; if (a && a < 5) $(this).val(5); amount = ($(this).val() * 100) | 0; if (!amount) return; e.preventDefault(); openHandler(amount); }); $('input[type="radio"][name="amount"]').change(function(e) { amount = ($(this).val() * 100) | 0; if (!amount) return; openHandler(amount); }); window.addEventListener('popstate', function() { handler.close(); }); })(); Donors WireGuard is extremely pleased to have a number of non-profit foundations and companies who have contributed to the project. Company donations* are divided into bronze, silver, gold, platinum, and iridium categories, to reflect the breadth of their year of support. code { word-wrap: break-word; white-space: normal; } .panel-table-right .panel-body img { max-width: 315px; max-height: 100px; } .panel-table-left .panel-body img, .panel-table-bottom .panel-body img { max-height: 50px; max-width: 250px; } .panel-table-bottom .panel-body { display: inline-block; } .panel-table { display: flex; align-items: stretch; } .panel-table-right, .panel-table-left { display: flex; align-items: stretch; flex-flow: column; flex: 1; } .panel-table-right { padding-left: 10px; } .panel-table-left { padding-right: 10px; } .panel-table-bottom { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); padding-top: 10px; margin-bottom: 0; } .panel { flex: 1; } #individual-donors { overflow-x: scroll; } #individual-donors ul { display: inline-block; list-style: inside disc; height: 20em; columns: 10em auto; -webkit-columns: 10em auto; -moz-columns: 10em auto; text-align: left; } @media(max-width:767px) { .panel-table { flex-flow: column; } .panel-table-left { order: 2; padding-right: 0; } .panel-table-right { padding-left: 0; } } Gold Company Donors Jump Trading made a generous donation during August 2021. Silver Company Donors Tailscale made a donation during September 2022, as part of their business centered around WireGuard. Mullvad made a generous donation for supporting WireGuard development during April 2022. Non-Profit Foundations NGI Zero from the NLNet's PET Fund and NGI Pointer, via EU Horizon 2020 grants 825310 and 871528. Bronze Company Donors IPv6rs made a donation during March 2024, as they launch their new IPv6 tunneling service built on top of WireGuard tunnels.. Fly.io made a donation in February 2024 in support of WireGuard's integration into their services. Equinix Metal has donated powerful hardware for our continuous integration build system, automated formal verification, and other intense calculations. *The WireGuard project does not endorse any particular company or service provider and strives to work well for many different use cases and providers. The project is in no way influenced or directed by any external agendas.'''
