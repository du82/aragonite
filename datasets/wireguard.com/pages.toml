["https://wireguard.com/presentations"]
title = "Presentations - WireGuard"
full_description = "Presentations April 21, 2020 – Ask Noah Show, Radio Broadcast This show was an introduction the WireGuard project to a radio and podcast audience. November 15, 2018 – Linux Plumbers, Vancouver, Canada This presentation covered the basics of WireGuard for a kernel-centric audience. Presentation Video Slides November 14, 2018 – Linux Plumbers, Vancouver, Canada This presentation was intended to spur discussion on Zinc, its motivation, and upstreaming plans. Presentation Video Slides September 26, 2018 – Kernel Recipes, Paris, France This presentation introduced Zinc and its motivations, the cryptography library used by WireGuard. Presentation Video Slides August 8, 2018 – Blackhat USA, Las Vegas, Nevada, USA This presentation gave an overview of the security design principles of WireGuard. Presentation Video Slides Command Line Demo June 15, 2018 – SSTIC, Rennes, France This presentation was for the French cyber security industry. Presentation Video Slides Command Line Demo May 28, 2018 – Eindhoven Institute for the Protection of Systems and Information, Eindhoven, Netherlands This presentation was directed for a mixed audience of cryptography people, sysadmin people, and policy people. Presentation Video (coming soon) Slides Command Line Demo November 9, 2017 – Netdev 2.2, Seoul, South Korea This was a presentation for the Linux kernel network stack developers, which focused on kernel-specific integration techniques. Presentation Video Slides Written Conference Paper Command Line Demo September 28, 2017 – Kernel Recipes, Paris, France This was a super quick lightning talk giving an overview of the project – a smaller version of the FOSDEM talk, below. July 19, 2017 – Moby Security SIG, Internet Folks in the Moby Project requested a general overview of WireGuard over video chat. Presentation Video Slides Command Line Demo April 27, 2017 – Euro S&P, Paris, France This talk was an attempt to condense all the material into five minutes. Slides March 31, 2017 – Oxford University, Oxford, England This talk for focused primarily on the cryptography but also did a bit of detail on the systems aspects. This was a less formal talk than ordinary, with questions spread throughout and significant interaction with the audience. Presentation Video with Slides Slides Command Line Demo February 28, 2017 – NDSS, San Diego, California, USA This was a brief introduction for academics to WireGuard and the WireGuard academic paper. It very quickly moved through core concepts, which were then followed up by torrents of interesting questions during the subsequent days of the conference. Presentation Video with Slides Slides February 21, 2017 – INRIA, Paris, France This was a talk for the INRIA Prosecco group, detailing the cryptographic design of WireGuard and the various design decisions made. Slides February 5, 2017 – FOSDEM, Brussels, Belgium This sysadmin-oriented talk went into detail on the overall design and usage of WireGuard, in addition to some of its design considerations, while adding a little bit about the crypto and security aspects at the end. Presentation Video Slides Command Line Demo October 21, 2016 – Codeblue, Tokyo, Japan This security-focused talk presented a high-level overview of the various cryptographic mechanisms at play in WireGuard, and some of the security design goals. Presentation Video English Slides Japanese Slides Command Line Demo September 30, 2015 – Kernel Recipes, Paris, France This was an introductory conversation to the Linux kernel community, going over the basics of WireGuard and the various kernel aspects used to implement it. Much of the information in this talk is now out of date. Presentation Video (information out of date) @media print { .youtube-movie { display: none; } } .youtube-movie { position: relative; height: 0; overflow: hidden; padding-bottom: 56.2%; } .youtube-movie iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }"
