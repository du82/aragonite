["https://wireguard.com/performance"]
title = "Performance - WireGuard"
full_description = "Testing Helpers See debug.mk for easy testing deployment tricks via make remote-run, as well as netns.sh via make test and make remote-test for local and remote testing in network namespaces. The contrib/ directory also has various scripts and wrappers for easing testing. Performance Roadmap In theory WireGuard should achieve very high performance. There are still a few things to be done for that to happen: Support GRO Lock free queues Core autoscaling CPU packet locality Integration into qdisc system and/or fq_codel and/or dql Benchmarking *** These benchmarks are old, crusty, and not super well conducted. In the intervening time, WireGuard and IPsec have both gotten faster, with WireGuard stil edging out IPsec in some cases due to its multi-threading, while OpenVPN remains extremely slow. It is a work in progress to replace the below benchmarks with newer data. *** Testing configuration Intel Core i7-3820QM and Intel Core i7-5200U Intel 82579LM and Intel I218LM gigabit ethernet cards Linux 4.6.1 WireGuard configuration: 256-bit ChaCha20 with Poly1305 for MAC IPsec configuration 1: 256-bit ChaCha20 with Poly1305 for MAC IPsec configuration 2: AES-256-GCM-128 (with AES-NI) OpenVPN configuration: equivalently secure cipher suite of 256-bit AES with HMAC-SHA2-256, UDP mode iperf3 was used and the results were averaged over 30 minutes. Results google.charts.load('current', { packages: ['corechart'] }); var hasInstalledResizer = false; function drawCharts() { var data = google.visualization.arrayToDataTable([ [{ label: 'Tunnel', type: 'string' }, { label: 'megabits per second', type: 'number' }, { type: 'string', role: 'annotation' }, { type: 'string', role: 'tooltip' }, { role: 'style' }], ['WireGuard', 1011, '1011 mbps', 'This is the line-rate of gigabit ethernet. The CPU was not maxed out.', 'color: #5090f0; opacity: 0.8'], ['IPsec (ChaPoly)', 825, '825 mbps', 'The CPU was completely maxed out at this speed.', 'color: #00ba38; opacity: 0.8'], ['IPsec (AES-GCM)', 881, '881 mbps', 'The CPU was completely maxed out at this speed.', 'color: #00ba38; opacity: 0.8'], ['OpenVPN', 258, '258 mbps', 'The CPU was completely maxed out at this speed.', 'color: #f8766d; opacity: 0.8'] ]); var ticks = []; for (var i = 0; i <= 1024; i += 128) ticks.push(i); var options = { title: 'Throughput', hAxis: { title: 'megabits per second (higher is better)', viewWindow: { min: 0, max: 1024 }, ticks: ticks }, legend: { position: 'none' }, height: 300, backgroundColor: { fill: 'transparent' }, }; (new google.visualization.BarChart(document.getElementById('throughput_graph'))).draw(data, options); data = google.visualization.arrayToDataTable([ [{ label: 'Tunnel', type: 'string' }, { label: 'milliseconds', type: 'number' }, { type: 'string', role: 'annotation' }, { role: 'style' }], ['WireGuard', 0.403, '0.403 ms', 'color: #5090f0; opacity: 0.8'], ['IPsec (ChaPoly)', 0.521, '0.521 ms', 'color: #00ba38; opacity: 0.8'], ['IPsec (AES-GCM)', 0.508, '0.508 ms', 'color: #00ba38; opacity: 0.8'], ['OpenVPN', 1.541, '1.541 ms', 'color: #f8766d; opacity: 0.8'] ]); options = { title: 'Ping Time', hAxis: { title: 'milliseconds (lower is better)', viewWindow: { min: 0, max: 1.6 }, }, legend: { position: 'none' }, height: 300, backgroundColor: { fill: 'transparent' }, tooltip: { trigger: 'none' } }; (new google.visualization.BarChart(document.getElementById('ping_graph'))).draw(data, options); if (!hasInstalledResizer) { $(window).resize(drawCharts); hasInstalledResizer = true; } } google.charts.setOnLoadCallback(drawCharts);"
