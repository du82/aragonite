["https://wireguard.com/install"]
title = "Installation - WireGuard"
full_description = '''Installation h4 { margin-top: 1em; } Windows [7, 8.1, 10, 11, 2008R2, 2012R2, 2016, 2019, 2022] Download Windows InstallerBrowse MSIs macOS [app store] Download from App Store Ubuntu [module & tools] $ sudo apt install wireguard Android [play store & direct apk file] Download from Play StoreDownload APK File iOS [app store] Download from App Store Debian [module & tools] # apt install wireguard Users with Debian releases older than Bullseye should enable backports. Fedora [tools] $ sudo dnf install wireguard-tools Mageia [tools] $ sudo urpmi wireguard-tools Arch [module & tools] $ sudo pacman -S wireguard-tools Users of kernels < 5.6 may also choose wireguard-lts or wireguard-dkms+linux-headers, depending on which kernel is used. OpenSUSE/SLE [tools] $ sudo zypper install wireguard-tools Slackware [tools] $ sudo slackpkg install wireguard-tools Alpine [tools] # apk add -U wireguard-tools Gentoo [module & tools] # emerge wireguard-tools The wireguard-modules ebuild also exists for compatibility with older kernels. Exherbo [module & tools] # cave resolve -x wireguard NixOS [module & tools] boot.extraModulePackages = [ config.boot.kernelPackages.wireguard ]; environment.systemPackages = [ pkgs.wireguard pkgs.wireguard-tools ]; Nix on Darwin [userspace go & tools] $ nix-env -iA nixpkgs.wireguard-tools OpenWRT [tools] # opkg install wireguard Further installation and configuration instructions may be found on the wiki. Oracle Linux 8 [UEK6 & tools] # dnf install oraclelinux-developer-release-el8 # dnf config-manager --disable ol8_developer # dnf config-manager --enable ol8_developer_UEKR6 # dnf config-manager --save --setopt=ol8_developer_UEKR6.includepkgs='wireguard-tools*' # dnf install wireguard-tools Red Hat Enterprise Linux 8 [module-kmod, module-dkms, & tools] Method 1: the easiest way is via ELRepo's pre-built module: $ sudo yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm https://www.elrepo.org/elrepo-release-8.el8.elrepo.noarch.rpm $ sudo yum install kmod-wireguard wireguard-tools Method 2: users running non-standard kernels may wish to use the DKMS package instead: $ sudo yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm $ sudo subscription-manager repos --enable codeready-builder-for-rhel-8-$(arch)-rpms $ sudo yum copr enable jdoss/wireguard $ sudo yum install wireguard-dkms wireguard-tools CentOS 8 [module-plus, module-kmod, module-dkms, & tools] Method 1: a signed module is available as built-in to CentOS's kernel-plus: $ sudo yum install yum-utils epel-release $ sudo yum-config-manager --setopt=centosplus.includepkgs="kernel-plus, kernel-plus-*" --setopt=centosplus.enabled=1 --save $ sudo sed -e 's/^DEFAULTKERNEL=kernel-core$/DEFAULTKERNEL=kernel-plus-core/' -i /etc/sysconfig/kernel $ sudo yum install kernel-plus wireguard-tools $ sudo reboot Method 2: the easiest way is via ELRepo's pre-built module: $ sudo yum install elrepo-release epel-release $ sudo yum install kmod-wireguard wireguard-tools Method 3: users running non-standard kernels may wish to use the DKMS package instead: $ sudo yum install epel-release $ sudo yum config-manager --set-enabled PowerTools $ sudo yum copr enable jdoss/wireguard $ sudo yum install wireguard-dkms wireguard-tools Oracle Linux 7 [UEK6 & tools] # yum install oraclelinux-developer-release-el7 # yum-config-manager --disable ol7_developer # yum-config-manager --enable ol7_developer_UEKR6 # yum-config-manager --save --setopt=ol7_developer_UEKR6.includepkgs='wireguard-tools*' # yum install wireguard-tools Red Hat Enterprise Linux 7 [module-kmod, module-dkms, & tools] Method 1: the easiest way is via ELRepo's pre-built module: $ sudo yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm https://www.elrepo.org/elrepo-release-7.el7.elrepo.noarch.rpm $ sudo yum install kmod-wireguard wireguard-tools Method 2: users running non-standard kernels may wish to use the DKMS package instead: $ sudo yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm $ sudo curl -o /etc/yum.repos.d/jdoss-wireguard-epel-7.repo https://copr.fedorainfracloud.org/coprs/jdoss/wireguard/repo/epel-7/jdoss-wireguard-epel-7.repo $ sudo yum install wireguard-dkms wireguard-tools CentOS 7 [module-plus, module-kmod, module-dkms, & tools] Method 1: a signed module is available as built-in to CentOS's kernel-plus: $ sudo yum install yum-utils epel-release $ sudo yum-config-manager --setopt=centosplus.includepkgs=kernel-plus --enablerepo=centosplus --save $ sudo sed -e 's/^DEFAULTKERNEL=kernel$/DEFAULTKERNEL=kernel-plus/' -i /etc/sysconfig/kernel $ sudo yum install kernel-plus wireguard-tools $ sudo reboot Method 2: users wishing to stick with the standard kernel may use ELRepo's pre-built module: $ sudo yum install epel-release elrepo-release $ sudo yum install yum-plugin-elrepo $ sudo yum install kmod-wireguard wireguard-tools Method 3: users running non-standard kernels may wish to use the DKMS package instead: $ sudo yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm $ sudo curl -o /etc/yum.repos.d/jdoss-wireguard-epel-7.repo https://copr.fedorainfracloud.org/coprs/jdoss/wireguard/repo/epel-7/jdoss-wireguard-epel-7.repo $ sudo yum install wireguard-dkms wireguard-tools FreeBSD [kmod, userspace go & tools] # pkg install wireguard OpenBSD [tools] # pkg_add wireguard-tools Termux [tools] # pkg install wireguard-tools Void [module & tools] # xbps-install -S wireguard-tools wireguard-dkms Adélie Linux [module & tools] # apk add wireguard-tools wireguard-module Source Mage [tools] # cast wireguard-tools Buildroot [module & tools] BR2_PACKAGE_WIREGUARD_LINUX_COMPAT=y BR2_PACKAGE_WIREGUARD_TOOLS=y EdgeOS [module & tools] $ sudo dpkg -i wireguard-{type}-{version}.deb First download the correct prebuilt file from the release page, and then install it with dpkg as above. AstLinux [module & tools] BR2_PACKAGE_WIREGUARD_TOOLS=y BR2_PACKAGE_WIREGUARD=y Milis [module & tools] # mps kur wireguard-tools wireguard-linux-compat macOS Homebrew and MacPorts – Basic CLI [homebrew userspace go & homebrew tools] & [macports userspace go & macports tools] $ brew install wireguard-tools or $ port install wireguard-tools See the cross-platform documentation for more information. .distro-status-uptodate { color: #55dd55; } .distro-status-outofdate { color: lightcoral; } .distro-status-outofdate a { color: lightcoral; text-decoration: underline; } .distro-status-outofdate a:hover { text-decoration: none; } *** Move on to the quick start walkthrough. *** Or, if your distribution isn't listed above, you may easily compile from source instead, a fairly simple procedure.'''
