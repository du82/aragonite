["http://wishlephant.com/wishlists/53829b60-3d18-4020-be6f-ed3a06748426"]
title = "Wishlephant - Brettspiel-Lieblinge für Kinder ab 3-8 Jahren"
description = 'Eine kleine Auswahl unserer Spiele des letzten Jahres. Wir haben in der Pandemie angefangen zu spielen, als unsere Tochter 3 Jahre alt wurde und haben auch Spiele gespielt, die für ältere Kinder gedacht sind. Der Trick ist dann oft einfach, die Regeln etwas zu ändern. So hat man aber auch als Eltern noch Spaß und muss nicht zum 100sten Mal "Mein erster Obstgarten" spielen oder so. 🤣Spiele muss man übrigens nicht gleich kaufen, ganz oft gibt es eine tolle Auswahl in den lokalen Bibliotheken, oder Ludotheken und bei spiele-offensive.de gibt es auch die Möglichkeit, die Spiele auszuleihen. 🧡'
full_description = 'Brettspiel-Lieblinge für Kinder ab 3-8 Jahren by Wishlephant Eine kleine Auswahl unserer Spiele des letzten Jahres. Wir haben in der Pandemie angefangen zu spielen, als unsere Tochter 3 Jahre alt wurde und haben auch Spiele gespielt, die für ältere Kinder gedacht sind. Der Trick ist dann oft einfach, die Regeln etwas zu ändern. So hat man aber auch als Eltern noch Spaß und muss nicht zum 100sten Mal "Mein erster Obstgarten" spielen oder so. 🤣Spiele muss man übrigens nicht gleich kaufen, ganz oft gibt es eine tolle Auswahl in den lokalen Bibliotheken, oder Ludotheken und bei spiele-offensive.de gibt es auch die Möglichkeit, die Spiele auszuleihen. 🧡 Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Kitty Bitty Sehr absurd und witziges Suchspiel, in dem die Katzenkinder die Katzeneltern austricksen wollen und mit den Wollknäueln spielen. Altersempfehlung: ab 4 Jahren, wir haben es schon mit 3 gespielt. Goto amazon.de + Add to list Djeco SOLOGIC Cubologic 9 €23.90 Goto takatomo.de + Add to list AMIGO Spiel + Freizeit 02053 Magnefix Man muss mit magnetischen Quadraten das nachbauen, was auf den Karten zu sehen ist. Die Schnellste gewinnt. Kann man aber auch ganz ruhig und entspannt spielen, auch mit kleineren Kindern schon. Ansonsten ab 6 empfohlen. Goto amazon.de + Add to list DJECO Spiel Tapikékoi Schönes Memory mal anders gemacht! Eine Diebesbande klaut Gegenstände aus der Wohnung und wenn man sie sich gut gemerkt hat, kann man sie zurückmopsen. Goto otto.de + Add to list Mabula da steht ab 9, spielen wir aber hier auch schon mit der 6jährigen. Das macht schon allein durch die Haptik so Spaß. Kugelschieben, sehr meditativ auch. €29.90 Goto steffen-spiele.com + Add to list Das Original Headbanz Ratespiel €14.06 Goto idealo.de + Add to list Taco Katze Käse Ziege Pizza es ist soo lustig!! Man muss die ganze Zeit “Taco, Katze, Ziege, Käse, Pizza” rufen und reagieren, wenn Karte und das gerufene übereinstimmen. Sehr schnell und witzig. €11.99 Goto genialokal.de + Add to list FotoFish Dieses süße Spiel ist zum Kinderspiel des Jahres 2020 nominiert und ein richtig kreatives Suchspiel. Man würfelt zwei Farben (oder eine, wenn die Kinder kleiner sind) und sucht dann mit der Kamera zwei Fische in den gewürfelten Farben. Es gibt eine schwere und eine leichtere Spielbrettseite, die man je nach Alter auswählen kann. Das war das erste Spiel, was wir für unsere Tochter gekauft haben, und es macht wirklich viel Spaß, vor allem auch den süßen Fisch wachsen zu sehen, den man von Runde zu Runde weiterpuzzeln kann. Altersempfehlung: ab 4 Jahren, mit vereinfachten Regeln geht das locker schon ab 3. €24.99 Goto spiele-offensive.de + Add to list Draftosaurus Dieses Spiel ist nicht für die ganz kleinen Kids, sondern etwas für die Größeren. Uns hat das als Erwachsene sehr viel Spaß gemacht. Perfekt zum Runterkommen abends, wenn man mal einmal nicht vor Netflix & co. versacken möchte. Ein Dino-Legespiel mit süßen Figürchen und vor allem: eine niedrige Einstiegshürde. Man muss nicht erst ewig die Anleitungen wälzen, sondern hats schnell raus. Für müde Eltern (und größere Kinder) perfekt. Altersempfehlung: ab 8 Jahren €19.99 Goto spiele-offensive.de + Add to list Speedy Roll - Kinderspiel des Jahres 2020 Ein schönes kollaboratives Spiel, in dem die Igel vor dem Fuchs flüchten. "Gewürfelt" wird mit einem Tennisball. Und die Kleinen lieben es, den Ball zu rollen, an dem dann die Klett-Symbole festkleben. Schöne Idee! Altersempfehlung: 8 Jahre, wir haben das auch schon mit angepasst mit 3-4 Jahren gespielt. Strategisch spielen können dann die älteren Kinder sicher gut. €20.99 Goto spiele-offensive.de + Add to list Schoko Hexe Ein ganz einfaches süß gezeichnetes Glücks-Kartenspiel, bei dem man alle Zutaten für Schokolade sammeln muss. Dabei darf man keiner Hexe begegnen, ansonsten schnappt sie sich die Karten. Es gibt also etwas Frustrationspotential. 😅 Unsere Tochter hatte vor allem viel Spaß daran, am Ende die Zutaten zusammenzumischen und Schokolade zu kochen. Anika mag es, weil es nicht so lange dauert, und man mal eben eine kleine Runde einschieben kann. Altersempfehlung: ab 5, aber mit 3 Jahren klappt das auch schon, auch wenn der Fokus dann evtl. woanders liegt, als strategisch zu ziehen. €7.69 Goto spiele-offensive.de + Add to list Kartenhalter gelb So eine tolle Erfindung. So macht das Kartenspielen für kleine Kinder erst richtig Spaß, weil sie es supergut halten können. €2.79 Goto spiele-offensive.de + Add to list Ravensburger Peppa Pig Meine ersten Kartenspiele Quartett mit schönen großen Karten. Da kann man natürlich dann jegliche Leidenschaft der Kids entscheiden lassen, welches Thema man nimmt. Bei uns war damals Peppa Pig sehr hoch im Kurs, solche Kartenspiele gibts ja aber auch für 100 und ein Thema/Serie usw., was den Vorteil hat, dass die Kleinen schon allein gern die Karten angucken und anfassen wollen. Goto rossmann.de + Add to list Dobble Kids Spiel Der Kracher! Ein Schnelligkeitsspiel, bei dem man die gleichen Tiere suchen muss. Dobble ist so beliebt, dass es inzwischen auch Harry Potter-Version gibt, eine Version mit wasserfesten Karten und und und. Altersempfehlung: 4-8. Wir haben es mit befreundeten Kindern (7 und 11) um die Wette gespielt und sie haben uns abgezockt. Mit den Kleinsten (ab 3 würden wir es empfehlen) kann man das Spiel einfach langsam spielen. €11.89 Goto spiele-offensive.de + Add to list Honigbienchen Spiel Eine süße Memory-Variante, bei der man wirklich aufpassen muss. Es ist gar nicht so leicht, den Überblick zu behalten, unter welchem Töpfchen sich welche Biene versteckt hat, weil die sich ständig bewegen. Dadurch kann das Spiel auch sehr lange dauern und langweilig werden. Wir würden empfehlen, das Ziel niedriger zu machen (z.b. gewonnen hat, wer 3 statt 4 Töpfchen gesammelt hat oder auch die Sonderkarten erstmal rauszulassen). Altersempfehlung: ab 4 Jahren, es geht auch schon ab 3, dann muss man das Spiel nur etwas anpassen €15.19 Goto spiele-offensive.de + Add to list Affenbande (Ravensburger) Spiel Ganz einfaches Ziehspiel, das Spaß macht. Die Kinder lieben es einfach, mit geschlossenen Augen in das Säckchen zu greifen und hoffentlich den Affen in ihrer Farbe zu erwischen. Altersempfehlung: ab 3, aber wir denken, sobald die Kleinen keine Dinge mehr in den Mund stecken, kann es losgehen. Weil es so einfach zu spielen ist. €7.69 Goto spiele-offensive.de + Add to list Halli Galli Junior Spiel Eine lustige Abwandlung des Klassikers. Bei zwei gleichen Clowns wird geklingelt. Und wer Kinder kennt: Auf die Klingel hauen ist DAS BESTE! Nur vielleicht nicht für all jene geeignet, die Clowns gruselig finden. 😅 Altersempfehlung: Ab 4 Jahren, geht mit 3 auch schon und mit Übung werden die Kleinen auch richtig schnell. €12.99 Goto spiele-offensive.de + Add to list Monster unterm Bett Die Monster haben Angst vor Spielzeug wir schicken sie damit in den Schrank. (Bei uns schreien sie dabei immer sehr, zur großen Freude der Räubertochter) Sehr schöne Variante von Memory, ist leider gerade schwierig zu bekommen. Vielleicht bekommt ihr es ausgeliehen. Altersempfehlung: ab 5 empfohlen, aber wir haben es schon mit 3 Jahren gespielt, und das hat super geklappt. Goto spiele-offensive.de + Add to list UNO Junior Spiel Der Klassiker unter den Kinderkartenspielen. Funktioniert auch wirklich toll und wer darauf Wert legt: die Kleinen lernen nebenbei sogar Zahlen lesen. Altersempfehlung: Ab 3 Jahren €7.00 Goto spiele-offensive.de + Add to list Clack! Auch wieder ein Schnelligkeitsspiel. Clack! ist vom "Halli-Galli"Erfinder und macht auch wieder Spaß, weil man mit magnetischen Scheiben spielt und die so schön CLACK machen. Die Symbole, die gewürfelt werden, müssen schnellstmöglich auf den Talern gefunden und eingesammelt werden. Einziger Wehmutstropfen: Das Spiel ist am anfang meist sehr schnell und lustig und dann dauert es, wenn nur noch ein paar Scheiben übrig sind und man mehrmals würfeln muss, bis wieder Action reinkommt. (Vorsicht, nicht verwechseln mit Clack! Familiy, das ist ein Kartenspiel ab 7 Jahren) Altersempfehlung: ab 4 Jahren €15.19 Goto spiele-offensive.de + Add to list 20 wishes'
author = "Wishlephant"
