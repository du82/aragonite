["https://wishlephant.com/blog/2021-11-05-nachhaltige-geschenkideen"]
title = "Wishlephant - Blog - Nachhaltige Geschenkideen unter 20 € von Marcia Friese"
description = 'Dieses Buch möchte ich am liebsten jedem Kind schenken! Von PsychologInnen entwickelt hilft es Kindern, die eigenen Gefühle zu verstehen und stärkt die mentale Gesundheit. Und wie immer bei "ein guter Plan" ist alles vom Druck bis zum Papier nachhaltig hergestellt.'
full_description = 'Nachhaltige Geschenkideen unter 20 € von Marcia Friese Über neues Landleben statt Berlin, Tipps für schönere Familienfotos und Adventskalenderinspiration 05.11.2021 Marcia hat von uns nicht nur die schönsten Familienfotos der Welt gemacht, die jetzt im Schlafzimmer hängen, sondern hat für euch auch noch so richtig sinnvolle und nachhaltige Geschenktipps für Kinder mitgebracht. Die findet ihr am Ende des Interviews. Aber jetzt erstmal viel Spaß bei unserem kleinen Interview. Für alle, die dich nicht kennen: Wer bist du und was machst du tolles? Ich bin Marcia Friese, ich bin dokumentarische Familienfotografin im Raum Basel und Freiburg und halte Familiengeschichten und Kindheitserinnerungen auf Fotos fest. Die meisten denken bei Familienfotos noch an so gestellte Fotos im Studio bei dem alle Familienmitglieder vor einer Leinwand posieren und in die Kamera lächeln. Ich fand immer, dass Bilder von echten Momenten für mich sehr viel wertvoller sind. Zum Beispiel ein Bild, auf dem ich als Baby von meiner Mama gestillt werde oder ein anderes, auf dem ich mit meinem Papa als Kleinkind Nase an Nase mache. Ich versuche genau diese „Beziehungs-Essenz“, das lieben und geliebt werden für andere zu dokumentieren. Du hast auch ein zauberhaftes Buch zusammen mit der Hebamme Jule Tilgner veröffentlicht – “Mutter werden”. Erzähl mal, was daran so besonders ist. Oh vielen Dank :) Unser Buch ist ein wirklich ein Herzensprojekt, wir haben es gemacht, weil wir genau so ein Buch in unseren Wochenbetten gebraucht hätten. Um ehrlich zu sein, finde ich unser Buch wirklich auf vielen Ebenen besonders :) Aber vor allem ist es besonders, weil es sich um die Mutter dreht, es ist kein Babybuch sondern ein Mutter-Buch. Es sind zwar auch alle Dinge darin, die wir über Babys wissen müssen und Jule ist eine wundervolle Hebamme, die ihr umfangreiches Wissen dazu wunderbar in Worte fassen kann. Aber vor allem ist es eben ein Buch über das Mutter werden. Weil wir haben genau das als die wirklich große Herausforderung empfunden. Es ist so eine unglaubliche Transformation die wir da durchleben. Körperlich und Psychisch. Egal ob beim ersten oder fünften Kind. Und wir haben uns einfach bis ins Detail gefragt: was hätte uns geholfen? Was hätten wir gebraucht? Welches Wissen? Welche Worte? Welche Bilder? Welche Ansprache? Mutter werden - Dein Begleiter durch die erste Zeit nach der Geburt von Jule Tilgner und Marcia Friese, erschienen im BELTZ Verlag. Du bist von Berlin aufs idyllische Land gezogen, sogar mit eigenen Hühnern! Was hast du dir von dem Umzug für dich und deine Kinder erhofft und wie hat sich dein Leben dadurch verändert? Die Entscheidung Berlin zu verlassen war wohl das schwerste, was wir je gemacht haben. Und ich bin jeden Tag dankbar darüber! Der Grundgedanke oder Wunsch war, mehr Freiheit für die Kinder. Ich denke, Kinder werden genau so gut in der Stadt groß, wie sie auf dem Land groß werden. Aber ich empfinde ihren Radius auf dem Land als sehr viel größer. Ich finde ja, Kindern steht ein gewisses Maß an unbeobachtet sein zu. Und das war in der Großstadt einfach nicht möglich. Du legst großen Wert auf Nachhaltigkeit und Entschleunigung, auch bei deinen Familiendokumentationen merkt man das total. Welche drei Tipps für schönere Familienfotos hast du, die man auch mit dem Handy gut umsetzen kann? Oh das ist aber ein schönes Kompliment, vielen Dank! Für Eltern, die gern selbst schöne Erinnerungsfotos machen möchte, finde ich diese Tipps hilfreich (und die sind auch super mit der Handkamera umsetzbar): Frag dein Kind nicht, ob es in die Kamera schauen kann oder lächeln oder ähnliches. Dadurch wird es schwer, die echten Momente einzufangen, weil das Kind dann beginnt immer in die Kamera zu lächeln, sobald es das Handy oder die Kamera sieht. Ich finde es auch hilfreich, mich immer wieder zu fragen, was genau eigentlich die Momente sind, an die ich mich unbedingt erinnern möchte mit meinen Kindern. Und die dann ganz bewusst einfangen. Immer auf Augenhöhe mit den Kindern gehen. Das ist bei Kleinkindern sehr tief ;) So wirken die Fotos sehr viel „näher“ und erzählerischer. Es ist außerdem eine wunderbare Gelegenheit die Welt durch die Augen unserer Kinder zu betrachten! Die Kamera oder das Handy immer irgendwo in greifbarer Nähe haben. Sich angewöhnen, nicht nur an Feierlichkeiten Fotos zu machen, sondern den Blick auf das Alltagsglück schulen. Auch mal früh morgens am Frühstückstisch Bilder machen. Und als die, die immer die Fotos macht, regelmäßig andere bitten ein Foto von mir zu machen. Vom Stillen oder kuscheln oder vorlesen oder was auch immer es ist, was du von dir als Mutter oder Vater gern als Kindheitserinnerung an deine Kinder weitergeben möchtest. Hier findet ihr noch mehr Tipps von Marcia: Mini Fotografiekurs für Eltern mit 5 Tipps für natürliche Kinderfotos Für alle, die noch Adventskalender-Inspiration suchen: Kannst du helfen? Ich mache jedes Jahr einen Kalender mit gefüllten Säckchen für meine Kinder. Es ist der gleiche, den ich schon als Kind hatte und eine meiner schönsten Kindheitserinnerungen an meine Mama. Es ist etwas, das ich weiter führe um ihr zu gedenken und ein bisschen nah zu sein. Ich versuche die Säckchen möglichst mit nachhaltigen, schönen Verbrauchs-Dingen zu füllen. Und Dinge, die direkt zu einer Tätigkeit führen und nicht rumliegen. Das sind zum Teil Dinge, wie auf der Weihnachtsliste hier oder auch Gutscheine für Zeit-Geschenke wie Schlittschuh fahren gehen oder unter dem Tisch picknicken. Hier sind 24 nachhaltige Füllungen und 24 „Zeit-statt-Zeug“ Ideen gesammelt, die in den letzten Jahren von den Kindern als gut befunden wurden :) : Adventskalender für Kinder nachhaltig und sinnvoll Was schenkst du dir zu Weihnachten? Oooh, meistens Bienenwachskerzen. Und Weiterbildung. Ich versuche im Januar und Februar immer eine Fortbildung zu machen. Einen Kurs oder Workshop oder ein Mentoring. Das schenke ich mir dann zu Weihnachten. Auf unserer Postkarte stehen so Elternwünsche wie: allein aufs Klo, schlafen schlafen schlafen oder Netflix und Chill statt Abwasch und Müll. Was würdest du ankreuzen? Uh, unbedingt Netflix und Chill! Ich bin gerade erkältet und würde so gern einfach mal krank im Bett lümmeln und den ganzen Tag Netflix gucken. Danke für dieses schöne Interview! Wer mehr über Familienfotografie, Mutterschaft und Marcias neues Landleben mitbekommen möchte, sollte ihr unbedingt auf Instagram folgen: @marcia_friese_worte_und_bilder Nachhaltige Geschenkideen für Kinder unter 20 € von Marcia Ein gutes Gefühl Dieses Buch möchte ich am liebsten jedem Kind schenken! Von PsychologInnen entwickelt hilft es Kindern, die eigenen Gefühle zu verstehen und stärkt die mentale Gesundheit. Und wie immer bei "ein guter Plan" ist alles vom Druck bis zum Papier nachhaltig hergestellt. €19.90 Goto einguterplan.de + Add to list Bunte Knete 8 Farben (500g) Das ist mein Standart Geschenk für Kinder. Ist ein super Verbrauchsgeschenk, kann man nie genug haben und selbst meine großen Schulkinder freuen sich noch über Knete. €8.50 Goto waldorfshop.eu + Add to list Opinel-Taschenmesser Das braucht meiner Meinung nach jedes Kind! Zum Stöcke schnitzen am Lagerfeuer. €11.45 Goto jako-o.com + Add to list Washi-Tape "Japanflair" Für spontane Kinderbilder-Ausstellungen, Briefe-Verzierungen und Gläsermarkierungen. €14.99 Goto jako-o.com + Add to list Strickgabel Können schon kleinere Kinder und es entstehen wunderbar dicke Stricke, die sich zum Beispiel zum Pferdchen spielen eignen. Die Kinder nutzen die Kordeln auch um sich mit den Spieltüchern zu verkleiden. €13.95 Goto littlegreenie.de + Add to list Wollvögel Bastel-Set Eine ganz einfache und schöne Bastelei. Wir hängen die Vögelchen an den Weihnachtsbaum und ich verschenke die Sets gern zu Weihnachten. €5.00 Goto waldorfshop.eu + Add to list Dochtwolle, 4 x 25g Die Kinder lieben es zu stricken, zu weben und zu häkeln. Dicke Wolle ist dafür besonders gut, weil damit auch schnell Erfolge zu sehen sind. €13.50 Goto littlegreenie.de + Add to list Faszinierende Fenstersterne ("Schneekristalle") Wir falten jedes Jahr einige Sterne und hängen sie im Advent an die Fenster. Ist auch ein super Weihnachtsgeschenk von den Kindern an die Großeltern €5.50 Goto waldowverlag.de + Add to list Knetbienenwachs (12 Farben) Finde ich noch besser als die normale, weiche Knete. Es ist haptisch einfach nochmal was ganz anderes, die erst harte Knete mit den Händen zu erwärmen und dann erst verarbeiten zu können. Aber es braucht eben auch mehr Geduld und ist deswegen die ersten Male auch eher etwas, das man gemeinsam mit den Kindern macht. € 17,95 € Goto littlegreenie.de + Add to list Zaubernuss Eine Zaubernuss (Eine Walnuss mit kleinem Edelstein innen). Mache ich immer ein paar selbst, einfach vorsichtig knacken, die Nuss herausholen, mit etwas Wolle und einem kleinen Edelstein füllen und dann mit Kleber zukleben. Geht wirklich einfach und schnell und die Kinder freuen sich auch jetzt im Alter von 5 und 8 noch darüber! + Add to list Schmale Wachsfolien in 12 Farben Die sind super zum Kneten (leichter zu verarbeiten als die dickere Wachsknete) aber vor allem schön um Kerzen zu verzieren. €9.50 Goto waldorfshop.eu + Add to list Set Kerzen rollen Das machen wir jedes Jahr und die Kinder verschenken die selbst gerollten Kerzen dann gern. Duftet himmlisch und ist so ein schönes Material! €17.50 Goto waldorfshop.eu + Add to list Spieltuch Bio-Baumwolle 115 x 105 cm Baumwolltücher zum verkleiden und spielen (das wohl meist bespielte Spielzeug bei uns, seit Jahren! Wird hier vor allem zum verkleiden genutzt aber auch als Wiese und See für die Tiere) €3.99 Goto hans-natur.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)'
