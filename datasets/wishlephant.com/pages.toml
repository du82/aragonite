full_description = '''Körper, Identitäten und Aufklärung für Kinder by Wishlephant 11 Buchempfehlungen von Kindheitspädagogin Nina-Louisa Hebeler Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Florian - J. R. und Vanessa Ford Ein Buch über Florian, der schon lange weiß, dass er ein Junge ist. Es zeigt wie wichtig familiäre Unterstützung für trans* Kinder ist und welche bedeutende Rolle das Umfeld, z. B. die Schule spielt. Ein wichtiges Buch für Lehrkräfte, Pädagog*innen, Eltern aller Kinder und für Kinder selbst, um geschlechtliche Vielfalt kennenzulernen. ab 4 Jahren ISBN: 978-39-4931-517-6 €24.90 Goto genialokal.de + Add to list Zwei Mamas für Oscar Thema Homosexualität und unerfüllter Kinderwunsch, Samenspende, familiäre Vielfalt. Hier geht's um die Geschichte von Oskar, der nach viel Herumprobieren seiner Mütter über eine Samenspende von einem befreundeten Mann entsteht. Seine beiden Mamas wünschten ihn sich so sehr, das wird in dem Buch deutlich ("Sehnsuchtskind"). ab 4 Jahren ISBN: 978-37-7070-084-4 €15.00 Goto genialokal.de + Add to list Wuschelkopf und Pupspopo Ab ca. 2,5-3 Jahren, Pappbilderbuch mit Seiten zum Aufklappen. Themen wie Anatomie, Körpervielfalt, Ausscheidungen, Vorlieben usw. Ich mag es: klein, fein und viele Fachkräfte fragen mich immer nach Pappbüchern :-) ISBN: 978-39-0340-810-4 €15.00 Goto genialokal.de + Add to list Ein Baby! Wie eine Familie entsteht Ein weitestgehend inklusives Buch zur Entstehung von Leben auf unterschiedliche Weise. Hier wird auch explizit gezeigt, wie ein Mann und eine Frau Geschlechtsverkehr miteinander haben. Geeignet für Eltern, die bereit sind, dieses Bild zu erklären und für Kinder, die sich dafür interessieren. Am Ende werden auch traurige Ereignisse wie der frühe Tod eines Embryos oder Tod nach Geburt erklärt. Kinder erfahren durch das Buch Sichtbarkeit ihrer eigenen Familienentstehung (z. B. Adoption, Samenspende). ab 5 Jahren ISBN: 978-33-2830-086-1 €14.00 Goto genialokal.de + Add to list Bruno will hoch hinaus Das Pendant zu "Lina die Entdeckerin" für Kinder mit Penis und Hoden. Bruno erfährt vieles über seinen Körper, insbesondere über seinen Penis. Es finden sich zahlreiche Sachinformationen zu Körperpflege, Anatomie und Gesundheit in dem Buch. Wir sehen außerdem vielfältige männliche nackte Körper und dies ist einfach wichtig, damit Kinder verschiedene mögliche Identifikationsfiguren vorfinden. ab 4 Jahren ISBN: 978-39-0340-801-2 €22.00 Goto genialokal.de + Add to list Lina, die Entdeckerin Ein Buch bei dem die Meinungen sehr stark auseinandergehen. Lina entdeckt ihre Vulva und Vagina und das auf sehr bildgewaltige Weise: sie turnt z. B. in ihrer Vagina herum. Mir gefällt, dass dieses Buch etwas wagt: ins Innere des Körpers, aber nicht irgendwo, sondern zu einem Organ, dass z. B. noch heute teilweise in Sachbüchern falsch dargestellt wird. Einige Personen, die das Buch zum ersten Mal sehen, sind geschockt von der Überpräsenz der weiblichen Geschlechtsteile. Auch wird am Ende Menstruation thematisiert, das nicht für alle Menschen ins Kita-Alter gehört. Ich bin da entspannt, es ist ein natürlicher Vorgang, über den Kinder Sachinformationen erhalten dürfen. Es schadet ihnen gar nicht. Es gilt: immer nur so viel Infos, wie das Kind fragt und wo es Interesse zeigt. ab 4 Jahren ISBN: 978-39-5048-315-4 €22.00 Goto genialokal.de + Add to list PS: Es gibt Lieblingseis Leider gibt es bisher wenig Kinderbücher in denen intergeschlechtliche Kinder benannt werden oder in denen das Thema Intergeschlechtlichkeit an sich besprochen / erklärt wird. In diesem Bilderbuch wird einfühlsam die Geschichte von Bella erzählt. Bella kommt neu in eine Klasse. Es geht um Bellas Herausforderungen in der Schule und mit den anderen Kindern, die z. B. noch nie etwas von intergeschlechtlichen Menschen gehört haben. ab 4 Jahren ISBN: 978-39-4444-246-4 €18.00 Goto thalia.de + Add to list Überall Popos Dieses Buch enthält eine humorvolle Erzählung über Mila, die mit ihren Eltern ins Schwimmbad fährt und ganz aufgeregt ist. Mir gefällt, dass das Thema Körpervielfalt hier nebenbei eine Rolle spielt und nicht im Fokus der Geschichte steht. Kinder können sich hier gut mit Mila identifizieren, wenn sie ebenfalls Angst vorm Sprung ins Wasser haben. Auch das Thema Scham spielt eine Rolle an mehreren Stellen. ab 4 Jahren ISBN: 978-39-5470-234-3 €15.00 Goto genialokal.de + Add to list Wie entsteht ein Baby? Absoluter Klassiker für mich geworden. Es beschreibt die Entstehung von Leben auf ganz simple Weise, ohne dass Eltern peinlich berührt von Geschlechtsverkehr berichten müssen. Das Buch beinhaltet eine inklusive Aufklärung zur Entstehung von Leben, bietet vielfältige Anlässe zum Dialog mit Kindern, auch über ihr eigenes Entstehen. Die farbenfrohen Bilder laden zum Dialog mit Kindern ein (gibt es pinkfarbene Haut?). ab 3 Jahren ISBN: 978-38-6321-170-7 €19.00 Goto genialokal.de + Add to list AnyBody Diversitätssensibles Buch für Kinder von ca. 2-10 Jahren rund um das Thema Körpervielfalt. Witzige Zeichnungen von Anke Kuhl. Nimmt man den Umschlag ab, gibt es eine Überraschung. ISBN: 978-39-5470-246-6 €17.00 Goto genialokal.de + Add to list Alle haben einen Po Super witziges Buch rund um Körper, Scham, Ausscheidungen, Aussehen usw., bietet tolle Gesprächsanlässe mit Kindern ab ca. 2 Jahren. ISBN: 978-34-4626-430-4 €14.00 Goto genialokal.de + Add to list Untenrum empfohlen von @w_lena €16.00 Goto genialokal.de + Add to list 12 wishes'''
