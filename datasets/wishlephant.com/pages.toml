["http://wishlephant.com/wishlists/6b35c0f9-d495-4109-8c10-2d609a4847af"]
title = "Wishlephant - Klischeearme Vorlesebücher für 5-6jährige von Jo Lücke"
description = 'Jo Lücke @jo.luecke hat diese Liste aus Geschichten zusammengestellt, die sie 2023 als Familie gelesen haben. Sie sagt:"Die Bücher kommen ohne „schwache Mädchen“ und „starke Jungs“ aus. Auch auf „Mädchen gegen Jungs“ oder die große Liebe als Hauptthema verzichte ich gern. Das ist gar nicht so einfach. Ich bin im letzten Jahr einigen Empfehlungen von euch gefolgt und das hier ist das Best-Of-Vorlesebücher für 5-6jährige.👍In diesen Büchern sind entweder die Geschichten so stark und fantasievoll, dass die vorhandenen Klischees in den Hintergrund treten, oder sie sind absichtlich anders geschrieben.🤷🏻‍♀️Komplett klischeefrei ist dabei keins. Und gendern muss man auch überall selbst. Aber die hier sind zumindest nicht verkehrt."Am Ende gibt es noch die Empfehlungen aus der Community die in den Kommentaren zu Jos Insta-Post genannt wurden.'
full_description = '''Klischeearme Vorlesebücher für 5-6jährige von Jo Lücke by Wishlephant Jo Lücke @jo.luecke hat diese Liste aus Geschichten zusammengestellt, die sie 2023 als Familie gelesen haben. Sie sagt:"Die Bücher kommen ohne „schwache Mädchen“ und „starke Jungs“ aus. Auch auf „Mädchen gegen Jungs“ oder die große Liebe als Hauptthema verzichte ich gern. Das ist gar nicht so einfach. Ich bin im letzten Jahr einigen Empfehlungen von euch gefolgt und das hier ist das Best-Of-Vorlesebücher für 5-6jährige.👍In diesen Büchern sind entweder die Geschichten so stark und fantasievoll, dass die vorhandenen Klischees in den Hintergrund treten, oder sie sind absichtlich anders geschrieben.🤷🏻‍♀️Komplett klischeefrei ist dabei keins. Und gendern muss man auch überall selbst. Aber die hier sind zumindest nicht verkehrt."Am Ende gibt es noch die Empfehlungen aus der Community die in den Kommentaren zu Jos Insta-Post genannt wurden. Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Lichterland 1. Die Suche nach dem magischen Amulett Jo sagt: "Abenteuerliche Quests von zwei Kindern in einer fantastischen Welt. Weibliche Hauptrolle." €16.00 Goto genialokal.de + Add to list Latte Igel: Das große Latte-Igel-Buch "Der Herr der Ringe für Kinder. Sprachlich anspruchsvoller und damit anders als die meisten neuen Bücher (no offense). Keine weiblichen Figuren, aber bei Tieren nicht so schlimm." €18.00 Goto genialokal.de + Add to list Neue Punkte für das Sams "Wir haben alle Bücher gelesen und nur bei „Ein Sams für Martin Taschenbier“ hab ich die Teenie-Love-Story weitestgehend geskippt." €14.00 Goto genialokal.de + Add to list Eliot und Isabella und die Abenteuer am Fluss "Auch hier haben wir alle Bücher gelesen, solides Entertainment mit zwei Rattenkindern, die es immer wieder mit einer Rattenbande zu tun kriegen." €9.95 Goto genialokal.de + Add to list Hey, hey, hey, Taxi! Jo sagt: "Ebenfalls ein Dauerbrenner. Kurze Geschichten aus den wildesten Einfällen und besten Namen. Finden auch 3-4jährige schon sehr gut." €20.00 Goto genialokal.de + Add to list Morgen, Findus, wird's was geben Jo sagt: "Die Kinder lieben dieses lange Vorlesebuch, in dem Pettersson eine Weihnachtsmann-Maschine für Findus baut." €16.00 Goto genialokal.de + Add to list Das große Buch vom Räuber Grapsch. Sonderausgabe Jo sagt: "Heteronormative und dennoch absolut unkonventionelle Beziehung zwischen einem Räuber und einer sehr kleinen Frau. Achtung: Es gibt Folgebücher, die jedoch nicht von Gudrun Pausewang geschrieben sind und vor Klischees nur so strotzen! Also nur das erste lesen." €14.99 Goto genialokal.de + Add to list Zara Zylinder - Die sagenhafte Reise durch das Jemandsland empfohlen von @aza_hamburg: "Fand ich für das Alter richtig gut" €15.00 Goto genialokal.de + Add to list Minna Melone - Wundersame Geschichten aus dem Wahrlichwald empfohlen von @aza_hamburg.: "Meine großen Kinder (6 und 8) mochten beide Bücher sehr gern. Jetzt warten wir auf Band 3." €14.00 Goto genialokal.de + Add to list Der kleine Herr Heimlich bastelt am Glück empfohlen von @wiebke_janina: "Wir lieben den kleinen Herrn Heimlich!" €14.00 Goto genialokal.de + Add to list Fonk 1: Geheimagent aus dem All empfohlen von @ina_friluftsliv €10.00 Goto genialokal.de + Add to list Seeräubermädchen und Prinzessinnenjunge empfohlen von @simobofae: “Mir gefällt an dem Buch, dass es bei den beiden Hauptprotagonisten (Kindern) keine geschlechtsstereotype Rollenbilder gibt und aufzeigt, dass Kinder einfach Kinder sind, sein dürfen aber auch mit welchen Schwierigkeiten Kinder konfrontiert sein können wenn sie nicht der Norm entsprechen und wie diese bewältigt werden können. Zudem ist bei den Eltern der Kinder nicht nur die klassische Kernfamilie (Mutter, Vater, Kind) vertreten sondern auch ein alleinerziehender Papa. Das Buch bietet viele Optionen mit den eigenen Kindern über wichtige Themen in einen Dialog zu kommen und Dinge zu hinterfragen.” €14.00 Goto genialokal.de + Add to list Kami & Mika - Die phantastische Reise nach Wolkenhain empfohlen von @sirereal4: Es spricht Kinder auf mehrere Ebenen an wie z.B. die Fantasie. Wir konnten richtig in die Welt eintauchen und sie weiterspinnen €15.00 Goto genialokal.de + Add to list 13 wishes'''
