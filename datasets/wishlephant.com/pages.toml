full_description = '''Here you see what Wishlephant put on the wish list. If you want to give something, please claim it first. That way others see that someone already is getting an item. To not ruin the surprise, Wishlephant won't know if a present was claimed or who claimed it. KIMI Bücher ab 2 Jahren by Wishlephant Copy List Sort by defaultalphabeticallyby others firstclaimable firstnewest firstonly minepricepriorityyours first <button type="submit" class="btn--small">OK</button> Alfie und der Clownfisch – von Davina Bell ab 3 Jahren Vielfaltskriterien: Rollenzuschreibungen, Selbstakzeptanz KIMI-Faktor: Alfie erkennt und lernt, dass er als Junge schüchtern und ängstlich sein darf. Jury-Stimme: „Ein Kinderbuch mit ganz besonderer ästhetischer Darbietung – durch gekonnten Einsatz von nur wenigen Farbtönen und toller grafischer Gestaltung von der Illustratorin Allison Colpoys können die Leser*innen tief in Alfies Gefühlswelt eintauchen.“ ISBN: 34-5817-859-7 €14.90 Goto genialokal.de Claim Dank des Kranichs – von Keiko Funatsu ab 3 Jahren Vielfaltskriterien: Interkulturalität KIMI-Faktor: Es wird ein japanisches Volksmärchen erzählt, der Topos, dass ein Tabubruch wie Neugierde Zauberkräfte verwirkt, ist bekannt; weniger vielleicht aber in der Gestalt einer Kranichfrau. Jurystimme: „Im Gegensatz zu Grimms Märchen sucht man vergeblich nach einem ‚und sie lebten glücklich und zufrieden bis an ihr Lebensende‘. Die Geschichte führt einem die eigene Rezeptionserwartung vor.“ ISBN: 39-8174-435-7 €10.00 Goto genialokal.de Claim Flucht – von Issa Watanabe ab 3 Jahren Vielfaltskriterien: Flucht, Individualität, Menschenrechte KIMI-Faktor: Diese Geschichte ohne Text vermittelt ein universelles Bild zu den Themen Flucht und Migration, Furcht und Mut, Verbundenheit und Menschlichkeit. Jurystimme: „Im Unterricht könnte man die Bilder von den Schüler*innen beschreiben lassen – sie werden große Freude daran haben, immer wieder Neues ausfindig zu machen – und unterschiedliche Deutungen besprechen, denn wie jede große Kunst bieten auch Issa Watanabes Bilder Interpretationsspielräume. Neben der kreativen Auseinandersetzung mit den Bildern, sollte man auch auf die realen Hintergründe verweisen und Fluchtursachen sowie das Thema Migration besprechen. Ein ehrgeiziges Projekt wäre die vollständige Verschriftlichung der Bilder in einer Gruppenarbeit, sodass ein ganzes Buch entstünde. Außerdem könnte man manchen Doppelseiten reale Fakten und Zusammenhänge zuordnen, z. B. auch in einer Art Collage.“ ISBN: 34-4626-822-7 €16.00 Goto genialokal.de Claim Heute bin ich anders! – von Katja Reider ab 2 Jahren Vielfaltskriterien: Toleranz, Diversität, Gemeinschaft KIMI-Faktor: Dieses Buch zeigt den Kleinsten Diversität und Einzigartigkeit auf komische Weise. Jurystimme: „Anderssein wird mit absurden Ideen dargestellt und sehr witzig aufgelöst.“ ISBN: 37-3735-685-8 €8.99 Goto genialokal.de Claim Ich bin der König! – von Marco Viale ab 3 Jahren Vielfaltskriterien: Identität, Ängste erkennen und zulassen KIMI-Faktor: Jeder Mensch kann bestimmte Dinge sehr gut und manche gar nicht. Die Stärke des einen, ist die Schwäche des anderen – was einander bestens ergänzt. Jury-Stimme: „Ein dialogfähiges Buch, welches zu Überlegungen über die eigenen Stärken und Schwächen und ihr Verhältnis zueinander anregt.“ ISBN: 37-7252-937-2 €14.00 Goto genialokal.de Claim Ich bin fast genau wie du – von Karl Newson ab 3 Jahren Vielfaltskriterien: Einzigartigkeit,Toleranz, Gegensätze, Gemeinsamkeiten KIMI-Faktor: Der gereimte Text stellt prägnant und amüsant individuelle Eigenschaften und Gegensätze dar. Jurystimme: „Ein Bilderbuch über all die wunderbaren Eigenschaften, die jeden von uns einzigartig machen.“ ISBN: 35-2245-922-9 €13.00 Goto genialokal.de Claim Ida'nin Yolu / Idas Weg – von Fulya Gezer ab 2 Jahren Vielfaltskriterien: Identitätsuche, Menschenrechte, Mehrsprachigkeit KIMI-Faktor: Ganz zentral behandelt das Buch die Suche nach sich selbst, der eigenen Identität, der eigenen Freiheit und dem Begegnen von Unbekanntem. Jurystimme: „Seinen eigenen Weg finden, das ist eine Reise wert.“ ISBN: 39-8187-267-3 €16.00 Goto genialokal.de Claim 7 wishes'''
