["http://wishlephant.com/blog/2021-11-19-winterkinderbuecher"]
title = "Wishlephant - Blog - Die schönsten Winter-Kinderbücher zum Einmummeln - von Karina"
description = """
Hoch oben auf den Bergen Tibets lebt eine Yak-Herde und unter ihnen ist die kleine Elli. 
Elli ist nicht nur klein, sie ist die Kleinste von allen und darüber sehr unglücklich. Wie gerne würde sie so groß und stark und schnell sein wie die anderen, denn nur ein großes Yak kann wirklich etwas Großes vollbringen! Doch dann passiert etwas, wo nur die kleine Elli helfen kann…
Eine gereimte Mutmach-Geschichte mit wundervollen Illustrationen für Kinder ab ca. 2 Jahren."""
full_description = "Die schönsten Winter-Kinderbücher zum Einmummeln - von Karina Mit @polly.lux über Adventskalender-Geheimnisse, gefrorene Seifenblasen und Tagträumereien 19.11.2021 Wer bist du und was machst du Schönes - online, wie offline? Ich bin Karina, 35, und offline bin ich ich selbst und online bin ich ich in ausgewählten, meist positiven Quadraten. Aber eigentlich lasse ich mich online auch gerne im Hintergrund. Ich mag meine Ruhe, die Natur und die kleinen Dinge. Und meine Familie (ruft meine Familie aus dem Hintergrund). Ich lese und träume gerne und viel. Warum bist du auf Instagram und wie kam es zu deinem Profil-Namen polly.lux? Die erste Frage stelle ich mir auch sehr häufig. Instagram ist das perfekte Format für mal eben schnell kurz gucken und das mache ich dann sehr oft am Tag. Ich schaue mir gerne schöne Bilder an, lasse mich inspirieren und bin dann ganz schnell selbst süchtig danach geworden, mich mitzuteilen und meinen Kaffee zu zeigen. Als ich mein Profil vor knapp zwei Jahren erstellte, fragte ich meinen Mann, ob ihm spontan irgendein lustiger Name einfällt. Er sagte: „Polly Parkhaus“, woraus ich dann Polly Lux machte, in Gedenken an den guten alten Ost-Overheadprojektor, den die Ü-30-Fraktion unter uns noch kennen dürfte. Du spielst immer mal wieder damit, dass du dein Gesicht zeigst und dann wieder hinter Blumen versteckst. Was macht es mit dir, dein Gesicht im Internet zu sehen (oder eben nicht?)? Ich bin immer wieder erstaunt, wenn ich mich hier sehe, denn das war nie meine Absicht. Unter dem Pseudonym bin ich irgendwie ungehemmter und mache mir weniger Gedanken darüber, was wohl irgendwer denken könnte. Aber hin und wieder habe ich dann doch Lust, etwas mehr von mir zu zeigen. Manchmal stehst du richtig früh auf, um ein (zugegebener Maßen wunderschönes) Foto zu machen – sind deine Nächte bei zwei Kindern nicht schon kurz genug? Frage für eine sehr müde Freundin. Danke für die Blumen! Vor den Kindern war ich ein leidenschaftlicher Frühaufsteher und bin gelegentlich sogar Rennrad gefahren, morgens um halb sieben auf dem Tempelhofer Feld. Nun sind die Kinder nicht mehr ganz so klein und schlafen schon ein bißchen fester und ich habe letzten Winter den Hammrich, ein Naturgebiet in meiner Heimat Leer in Ostfriesland, wiederentdeckt. Morgens zum Sonnenaufgang malt dort der Himmel in seinen schönsten Farben und ich bin einfach ein besserer Mensch, wenn ich da draußen bin. Vier Mal stelle ich mir den Wecker und ein Mal schaffe ich es dann auch, aufzustehen. Das Erlebnis ist es wert. Willst du eigentlich wieder nach Ostfriesland ziehen? Deine Fotos sprechen so sehr von Sehnsucht. Ha! Nein. Ich liebe es jedes Mal, wieder dort zu sein. Und ich liebes es jedes Mal noch mehr, wenn ich wieder weg fahre. Letzten Winter hast du mich total mit deinen gefrorenen Seifenblasen verzaubert. Unglaublich! Wie lange hat es gedauert, bis das geklappt hat? Was braucht man, um das nachzumachen? Vielen Dank, das freut mich! Man braucht dafür vor allem Geduld! Und Kälte natürlich. Ich habe es letzten Winter eine Woche lang täglich probiert, es waren immer ein paar Grad unter Null und ich habe die herkömmlichen Seifenblasen aus dem Supermarkt genommen. Die Blase sollte irgendwo andocken, zum Beispiel an einer Pflanze oder auf Schnee (sofern es welchen gibt). Dann kann man dabei zusehen, wie sich innerhalb kürzester Zeit diese Kristallmuster bilden. Ein sehr schönes Ereignis und ein großer Erfolg, wenn es irgendwann klappt. Erzähl doch mal, wie viele Adventskalender es in eurer Familie (besonders für dich) geben wird. Das ist meine Lieblingsgeschichte zu dir. Hihi. Also mein Mann und ich schenken uns jedes Jahr gegenseitig einen Adventskalender. Ich kaufe allerdings immer die doppelte Menge und behalte sie dann für mich, weil ich es nicht ertragen würde, wenn er eventuell die Sachen bekommt, die ich so sehr mag, und ich nicht. Also sind das schon mal mindestens zwei für mich. (Ich habe es übrigens noch nie in meinem Leben geschafft, erst alle Türchen am 24. geöffnet zu haben, selbst wenn ich hier unter strengster Beobachtung stehe. Aber psssssst!) Was schenkst du dir zu Weihnachten? Ich habe mir dieses Jahr schon so viel geschenkt. Ich würde mir für mich selbst wünschen, dass ich einfach mehr im Moment leben würde, statt immer drei Schritte im Voraus zu planen und mit dem Kopf in der Zukunft zu sein. Auf unserer Postkarte gibt es eine Eltern-Wunschliste, auf der lustig-ehrliche Elternwünsche stehen wie: allein aufs Klo, schlafen schlafen schlafen und Netflix and Chill statt Abwasch und Müll. Welchen davon würdest du auch unterschreiben? Das wäre in jedem Fall: in einem Haushalt ohne Sand leben. Das wäre wirklich traumhaft. Und ohne Krümel. Durch die Fenster muss man nicht durchschauen können, aber Krümel auf dem Boden machen mich echt wahnsinnig! Dankeschön für das Interview, liebe Karina! Wer mehr zauberhafte Blumenbilder sehen möchte, folgt ihr auf instagram unter @polly.lux. Und jetzt Bühne frei für die Kinderbuchempfehlungen: Die schönsten Winter- und Weihnachtsbücher für Kinder - von Karina Elli, die Kleinste von allen Hoch oben auf den Bergen Tibets lebt eine Yak-Herde und unter ihnen ist die kleine Elli. Elli ist nicht nur klein, sie ist die Kleinste von allen und darüber sehr unglücklich. Wie gerne würde sie so groß und stark und schnell sein wie die anderen, denn nur ein großes Yak kann wirklich etwas Großes vollbringen! Doch dann passiert etwas, wo nur die kleine Elli helfen kann… Eine gereimte Mutmach-Geschichte mit wundervollen Illustrationen für Kinder ab ca. 2 Jahren. ISBN: 978-35-2245-962-4 Goto genialokal.de + Add to list Die Eisreise Die Freunde Ida, Max und Jock erkunden gemeinsam die winterliche Natur. Am Vogelbeerbach glauben sie, Otterspuren entdeckt zu haben und betreten das Eis. Zuerst knackt es nur ein bißchen, doch dann löst sich die Eisscholle und treibt den Fluss entlang - auf ihr die drei Freunde. Ein großes Abenteuer beginnt! Es geht bis hinaus in den eisigen Ozean, zu den Pinguinen, durch Sturm und Eis, mit großem Heimweh und Fischbällchen im Gepäck. Eine aufregende Geschichte über Mut, Freundschaft und Zusammenhalt. Natürlich wunderschön illustriert. Für Kinder ab 5-6 Jahren. ISBN: 978-34-2364-085-5 Goto genialokal.de + Add to list So ist der Winter Wenn alles mit einer weißen Schneedecke bedeckt ist, dann ist Winter. Dann kann man den Schnee tauen lassen und ihn wieder einfrieren, Hügel runterrodeln oder bei einem kalten Sturm in der warmen Stube sitzen und durch ein Fenster schauen. Eine achtsame Geschichte über die kalte Jahreszeit, die von den kleinen Freuden lebt. Und (ich weiß, das sage ich bei fast jedem Buch, aber stimmt wirklich): wunderschön illustriert! Für Kinder ab 3 Jahren. ISBN: 978-38-5581-564-7 Goto genialokal.de + Add to list Ein Apfel für alle Es ist Winter und der Hase im Wald hat Hunger. Als er einen einzelnen Apfel oben im Baum hängen sieht, ist die Freude groß - doch leider scheint er unerreichbar. Zusammen mit der kleinen Maus, dem verschnupften Fuchs und schließlich mit dem Bären, der eigentlich schon schläft, versucht der Hase, an den Apfel zu gelangen. Eine rührende Geschichte über Freundschaft und Zusammenhalt, wunderschön illustriert., für Kinder ab 2 Jahren. ISBN: 978-38-6566-344-3 Goto genialokal.de + Add to list Weihnachten mit Thomas Müller Thomas Müller, Teddy und vollwertiges Familienmitglied der Wortmanns aus Hamburg, geht am Heiligabend irgendwo im Karstadt in der Mönckebergstraße verloren. Da er kein Bargeld dabei hat, misslingt sein Versuch, sich mit einem Taxi nach Hause fahren zu lassen. Also setzt er sich an den Brunnen vorm Burger King und hofft, dass seine Familie ihn holen kommt. Die lässt aber erst einmal auf sich warten und stattdessen taucht eine ominöse Katze in der Dunkelheit auf… Eine ulkige Hamburg- und Weihnachtsgeschichte, warmherzig und dramatisch erzählt von der grandiosen Karen Duve. Für Kinder ab ca. 7/8 Jahren und alle Erwachsenen! ISBN: 978-38-6971-130-0 Goto genialokal.de + Add to list Gebrannte Mandeln für Grisou Der Graupapagei Grisou, der bei einer Menschenfamilie zuhause ist und auch ein bisschen Menschisch spricht, hat schon viel über den sogenannten Weihnachtsmarkt gehört. Er ist ganz neugierig darauf und würde ihn so gerne einmal besuchen. Besonders die gebrannten Mandeln möchte er gerne einmal probieren, denn die müssen unglaublich köstlich sein. Als zwei Tage vor Weihnachten das Küchenfenster offensteht, nutzt er die Gelegenheit und begibt sich auf die Reise. Eine ungewöhnliche Weihnachtsgeschichte mit einem abenteuerlichen kleinen Helden. Für Kinder ab 4 Jahren. ISBN: 978-38-6429-477-8 Goto genialokal.de + Add to list Polly hilft der Großmutter Die kleine Polly lebt gemeinsam mit ihrer Großmutter in einem hübschen kleinen Häuschen. Die Großmutter kocht Bonbons und verkauft sie jeden Samstag auf dem Markt. Doch eines Tages rutscht sie auf dem Fußboden aus und stürzt - ausgerechnet jetzt, so kurz vor Weihnachten! Nun liegt es an Polly, die Bonbons zu verkaufen und alles herzurichten. Eine zauberhafte Geschichte über das Miteinander, das Helfen und das Selbstständigsein. Für Kinder ab 3-4 Jahren. ISBN: 978-37-8915-532-1 Goto genialokal.de + Add to list Advent im Holunderweg Im Holunderweg 7 ist immer etwas los. Zur Weihnachtszeit ist es besonders spannend und so können es die allerbesten Freunde Ida, Lennart, Ella, Malte und Bruno kaum aushalten, bis der Heilige Abend endlich vor der Tür steht. Mit allerlei Ideen schaffen sie es jedoch, sich die Wartezeit etwas erträglicher zu gestalten. Ein Geschichten-Adventskalender für (Vor-)Schulkinder und gemütliche Abende auf dem Sofa, mit dem gewissen Bullerbü-Gefühl. ISBN: 978-35-2263-066-5 Goto genialokal.de + Add to list Ein Tag im Schnee Als Peter eines Morgens aufwacht und aus seinem Fenster blickt, ist alles von einer weißen Schneedecke umhüllt. Sofort nach dem Frühstück macht er sich auf den Weg nach draußen, um den Schnee zu erforschen. Er hinterlässt unterschiedliche Spuren auf den Wegen, formt Schneeengel und baut einen Schneemann. Damit er am nächsten Tag auch noch etwas vom Schnee hat, steckt er sich vorsichtshalber einen Schneeball in seine Manteltasche, ehe er wieder zurück ins warme Haus geht. Eine farbenfroh illustrierte kleine Geschichte über das Glück des ersten Schnees, schon für ganz junge Leser. ISBN: 978-39-6843-016-4 Goto tebalou.shop + Add to list Ole Winterwicht Ole Winterwicht versorgt die Tiere im Wald mit kleinen Gaben - er denkt an das Reh, die Maus und den Hasen. Und als alle versorgt sind, macht er sich auf den Weg nach Hause, wo er sich ein leckeres Abendbrot kocht und schließlich zufrieden einschläft. Eine ruhige und kurze Geschichte vom Schenken und auf sich Acht geben, schon für die Allerkleinsten. ISBN: 978-38-2515-205-5 Goto genialokal.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)"
