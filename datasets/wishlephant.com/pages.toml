title = "Wishlephant - Kinderbücher und Comics zum Thema Abschied und Trauer - empfohlen von Ilona"
description = "Hier findet ihr unser kleines Interview mit Ilona Stütz, in dem sie erzählt, welche Bücher sie am häufigsten verschenkt hat, welche Erinnerungen sie an ihre Großeltern im Herzen trägt und wie sie zur Liebe zu Kinderbüchern und -comics kam."
full_description = 'Kinderbücher und Comics zum Thema Abschied und Trauer - empfohlen von Ilona by Wishlephant Hier findet ihr unser kleines Interview mit Ilona Stütz, in dem sie erzählt, welche Bücher sie am häufigsten verschenkt hat, welche Erinnerungen sie an ihre Großeltern im Herzen trägt und wie sie zur Liebe zu Kinderbüchern und -comics kam. Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Radieschen von unten - Katharina von der Gathen Ab 8 Jahren “Dies ist nicht nur ein Buch über das Sterben und den Tod, es ist vor allem auch ein Buch über das Leben.” Autorin Katharina von der Gathen und Illustratorin Anke Kuhl haben bereits einige gemeinsame Bücher bei Klett Kinderbuch veröffentlicht. Schwerpunkt dabei: Körper, Entwicklung und Aufklärung - kurzum auch das Leben. Und zum Leben gehören neben der Geburt, dem Wachsen und dem Lieben eben auch der Tod und das Sterben. Wie immer schafft es das Duo, mit heiterem Blick das Tabu behaftete Thema zu erzählen und den Scheinwerfer darauf zu werfen, was vor Kindern oft versucht wird zu verbergen. Aus fälschlich gut gemeinten “Schutz”, aber sicher auch wegen der Sprachlosigkeit der Erwachsenen selbst. Das Buch nimmt erwachsene und junge Leser*innen mit ihren Ängsten ernst. In einem einfühlsamen Ton werden die einzelnen Etappen des Sterbens und Tod Seins beschrieben - dabei wird über den Tod auch mal gelacht, die Trauer aber respektiert. Um diese Etappen (das Sterben, Abschied nehmen, Beerdigung und Trauer) weniger abstrakter zu machen geben Expert*innen Einblick in ihre Arbeit. Und entmystifizieren den Tod so. Anke Kuhls Illustrationen changieren zwischen bebildert, den Text begleitend, aber auch alleinstehende kleine comichafte Kommentare. Bei allem Augenzwinkern und Witz, ein sehr respektvolles Buch für Jung und Alt. ISBN: 39-5470-285-1 €22.00 Goto genialokal.de + Add to list Child Of Galaxies ✨ Child of Galaxies - Blake Nuto und Charlotte Ager (Illustration) ✨ Das Buch hat mich zunächst wegen des Covers angezogen (ich geb’s zu) und mich dann nicht mehr losgelassen. Es ist in Reimform geschrieben und thematisiert die Fragen woher wir kommen, warum wir leben und was unsere Aufgabe bzw. der Sinn ist, den wir erfüllen sollen und wohin wir gehen, wenn wir sterben. Wir alle sind aus dem gleichen Marerial wie Sterne und dabei sind wir winzig klein im Vergleich zum Universum. Ein kleines Korn, auf einem von vielen Planeten und Universen. ✨ But you are here, you’re awake, you are breathing. ✨ Auch wenn das Buch große Fragen behandelt, die selbst im Erwachsenenalter sind oft für die eine oder andere Krise sorgen kann, nimmt es ihnen die Luft aus den Segeln. Anstatt mit allem auf einmal konfrontiert zu werden, stellt es die Bedeutung des*der Einzelnen immer wieder in Relation. Und so ist es auch einfach Aufgabe genug einfach zu sein. ✨ And though your part may be small, you are PART of it ALL. ✨ Und weil wir alle Teil des Ganzen sind, würde jede*r von uns vermisst werden, wenn wir nicht existieren würden. €13.40 Goto flyingeyebooks.com + Add to list Wie lange dauert Traurigsein? - Maria Farm Ab 9 Jahren Die Autorin Maria Farm schreibt aus der Perspektive als Psychologin mit jeder Menge Erfahrung in der Arbeit mit Trauernden Kindern zu Tod und Trauer. Interessantes Detail ist, dass das Buch bereits 2012 in Schweden erschien und erst 2022 in der deutschen Übersetzung veröffentlicht wurde. (Vermutung: kultureller Unterschied in der Bereitschaft über Tod zu sprechen oder/und Nachfrage auf dem deutschen Buchmarkt) Das Buch richtet sich direkt an Kinder ab 9 Jahren und begleitende Erwachsene. Thematisiert wird der mögliche Tod vieler Personen, die im direkten nahen Umfeld von Kindern sein können - Elternteile, Geschwister oder Freund*innen. Der Tod von Großeltern erscheint häufig als die „natürlichste“ erste Begegnung mit dem Tod. Aufgrund von Alter. Leider ist die Realität, dass viele Kinder viel früher und auch auf unvorhersehbarere Art und Weise mit dem Tod konfrontiert werden. Das Buch konzentriert sich vor allem auf das Empfinden der Trauernden. So wird bei der Frage „Was passiert mit uns?“ nicht auf das Sterben oder das Leben nach dem Tod (ob man nun religiös ist oder nicht) eingegangen, sondern das Trauern. TRAUERN IST GESTREIFT - fand ich eine sehr gut nachvollziehbare Beschreibung des Trauerns, die eine realistische Erwartungshaltung an das Meistern der Trauer aufbauen kann. Wobei Meistern unter Anführungszeichen zu lesen ist. Denn Trauern kann und darf lange dauern, auch wenn gesellschaftlich meist erwartet wird, dass man je nach Nähe zur verstorbenen Person nach Zeit X wieder normal weiterlebt. Im Buch werden auch konkrete Tipps angeboten, wie man zb mit dem Thema Unendlichkeit des Todes umgehen kann. Etwas indem man einen Erinnerungsort schafft (muss nicht der Friedhof sein), oder Briefe schreibt. Überzeugend fand ich die realistische Perspektive auf Trauer. Und auch, dass verschiedene Todesursachen (vorhersehbar und plötzlich), sowie der Fakt, dass alle in jedem Alter versterben können benannt wird. Ein aus meiner Sicht super wichtiges Buch. ISBN: 978-37-5120-226-8 €4.30 Goto buecher.de + Add to list Ein Ort für meine Traurigkeit - Anne Booth Das Bilderbuch “Ein Ort für meine Traurigkeit” ist bereits auf den ersten Blick sehr berührend. Auf dem Cover sieht man eine Person, es wird im Buch aus der Ich-Perspektive erzählt und somit Geschlecht und Alter offen gelassen, die Hand in Hand mit der personifizierten Traurigkeit geht. Die Traurigkeit wird dabei nicht als etwas Monströses dargestellt, vor dem man Angst haben muss, sondern ein -vielleicht- treuer Begleiter, der weder gut noch böse sein muss. Denn Traurigkeit ist ein Gefühl, wie jedes andere auch, dass uns in unserem Leben immer wieder begegnet. Konkret ist die Traurigkeit ein ovales Wesen, ähnlich einer Tropfenform, mit Armen und Beinen, einem freundlichen Gesicht und im halbtransparenten Körper aus hellblauen Linien trägt es ein leuchtend rotes Herz. Alles in allem ist es ein wunderbar wertschätzendes Buch gegenüber einer Emotion, die gesellschaftlich oftmals ein Tabu darstellt. Ich konnte mich als erwachsene Leserin sowohl im Kontext der Trauerarbeit nach einem Todesfall wiederfinden, aber auch dem Umgang mit Trauer im Kontext von Depression oä. ISBN: 35-2230-597-3 €15.00 Goto genialokal.de + Add to list Murr - Josephine Mark Ab 12 Jahren Murr - ein Comic über Tod, Angst und Liebe. Fast ohne Gefühlsduselei. Josephine Mark ist mit „Murr“ ein Comic gelungen der eine einzigartige Bereicherung der Bücher zum Thema Tod ist. Im ersten Drittel des Comic wird Murr als, nun ja, mürrischer Bandit etabliert, der nicht allzu viel von zwischenmenschlichen Beziehungen hält. Der Humor wirkt auf den ersten Blick simpel. So schemenhaft wie Murrs Statur. Eine Kugel als Oberkörper, zwei Striche als Beine und Augen,von denen nur die zusammengezogene Augenbraue zu sehen ist. Peng, peng, nackte Popos und ein Genital. Doch gerade in der scheinbaren Schablonenhaftigkeit liegt die unglaubliche Stärke des Comics. Denn Bücher über denTod müssen sich ihm nicht unbedingt mit Samthandschuhen nähern. Sich über denTod Gedanken zu machen und darüber zu sprechen kann schwer sein, warum sich ihm also nicht mit Humor nähern? Und ihn so entwaffnen. Und im letzten Drittel kommt die überraschende Wendung und Murr ist dann doch noch ein bisschen emotional. ISBN: 39-4869-034-0 €18.00 Goto genialokal.de + Add to list Wie man sich mit einem Gespenst anfreundet - Rebecca Green Ab 4 Jahren Ein vor allem (auch) super schönes, zartes Buch über das vorsichtige Knüpfen von Freundschaften, die über die Zeit hinweg dauern. Für Freund*innen lieber Geister auch ein Buch, das Trost rund um das beängstigende Thema Tod spenden kann. ISBN: 32-5701-250-0 €18.00 Goto genialokal.de + Add to list Oma, wann stirbst du? - Nina Mav Hrovat Ab 4 Jahren Eines der tückischen Dinge am Sterben ist, dass man meistens nicht weiß wannn es passiert und man sich dementsprechend nicht darauf vorbereiten kann. In “Oma, wann stirbst du?” wird genau diese Frage immer und immer wieder gestellt. Und auch die Oma kann keine Antwort geben, außer dass es passiert, wenn es passiert. Und man bis dahin noch so viele Momente wie möglich erlebt. (Und nicht alle davon müssen besonders und außerordentlich sein, denn auch das Kleine kann zur schönen Erinnerung werden.) Der Zeichenstil ist wunderschön mit einem Hauch Nostalgie. Als Vorleser*innen wird man schnell an Momente mit eigenen Großmüttern zurückdenken. ISBN: 39-0340-822-0 €21.50 Goto genialokal.de + Add to list Die Blumenfrau - Anne-Christin Plate Ab 4 Jahren „Die Blumenfrau“ ist ein poetisches Buch über Gemeinschaft, Vergänglichkeit und den Lauf der Zeit. In ihrem Kinderbuchdebüt erzählt Anne-Christin Plate die Geschichte von Wanja und einer namenlosen Blumenverkäuferin. Hin und wieder kauft Wanja mit seinen Eltern einen Strauß. Aus der Ferne grüßen sie einander. Als die Frau eines Tages weg ist stellt sich die Frage wo sie nun ist. Und Wanja entdeckt sie fortan in den Blumen der wechselnden Jahreszeiten wieder. Anne-Christin Plate gibt es Leser*innen und Kindern ein Nachwort mit, das anschaulich auf Augenhöhe vermittelt, was im Buch gelesen werden kann. Die Begegnung mit Fremden und wie wir diesen begegnen. „Das Buch […] kann Anlass sein, mit Kindern über die Begegnung mit Menschen aus der Straße zu sprechen: Kennst du einen Mensch in deiner Nachbarschaft der auf der Straße lebt? Oder dort sitzt und um Geld bittet? Kennst du seinen/ihren Namen? Welche Frage würdest du dem Mensch gerne stellen?“ ISBN: 33-1410-675-0 €18.00 Goto genialokal.de + Add to list Ein Garten für uns - Zoë Tucker Dieses Buch gibt es auch zweisprachig (Deutsch jeweils mit und einer weiteren Sprache)! Ab 4 Jahren „Ein Garten für uns“ ist ein wunderschönes Buch über generationsübergreifende Freundschaft und erweiterte (Wahl-)Familie. Der geteilte Garten liegt Mitten in der Stadt, sichtbar umringt von hohen Häusern mit Flachdächern. Ein Stadtbild, das sicher viele kennen. „Sachte halte ich Samen in der Hand. Jedes Pünktchen ist voller Hoffnung, jedes ein Versprechen.“ Es vergehen die Jahreszeiten und der*die Protagonist*in verbringt Zeit mit den drei älteren Frauen mit gemeinsamer Gartenarbeit, das Genießen des Grüns und der Ernte. Im Herbst sammeln sie die Samen, die die Erinnerungen an den Sommer in sich tragen und die gemeinsam verbrachte Zeit. Im Frühjahr folgenden Frühjahr pflegen sie den Garten zu dritt. Doch die Verstorbene ist in den Pflanzensamen des letzten Jahres Teil des Gartens. ISBN: 33-1410-589-4 €15.00 Goto genialokal.de + Add to list Baba Anna - Yaroslava Black Ab 5 Jahren Eine Geschichte über Traditionen und Sterben in den ukrainischen Karpaten (ohne auf Krieg oder aktuelles Geschehen einzugehen). Der*die Protagonist*in führt aus der Ich-Erzähler*innen-Perspektive durch die Feierlichkeiten und Zeremonien des Abschied Nehmens. Die Aufbahrung im Haus, der offene Sarg, das Schmücken der Toten, die Totenwache. Insgesamt drei Tag bis der Sarg am vierten Tag von jemand der nicht zur Familie gehört mit Nägeln verschlossen wird und zum Friedhof getragen wird. Vermutlich wirken die Rituale im ersten Moment befremdlich oder gar abschreckend. Ich hatte mit 30 das erste Mal Gelegenheit mich von einer toten Person noch vor dem Begräbnis zu verabschieden und beim Sterben dabei zu sein. Es war möglich so lange bei der Person und ihrem Körper zu sitzen bis wir uns verabschiedet hatten. Der Tod war immer noch traurig, aber es war leichter zu verarbeiten, denn die Person war nicht plötzlich einfach „weg“. Ich bin für dieses Erlebnis bis heute unendlich dankbar, weil es rückblickend etwas Trauer um zu früh verstorbene Familienmitglieder nahm. ISBN: 38-2515-319-3 €19.90 Goto genialokal.de + Add to list Julia und ihr kleiner Urgroßvater - Jens Sparschuh Ab 7 Jahren Julia macht Urlaub bei ihrem Urgroßvater. Ganz alleine. Nicht einmal ihr Bruder ist dabei. Ein letzter Sommer mit August, wie sich am Ende des Buches herausstellen wird. Und auch wenn die beiden eine enge Beziehung haben und sich Julia auf eine Woche voll wilder Abenteuer freut, weiß sie, dass sie neben Freude auch Heimweh empfinden wird. Insgesamt finden sehr viele ambivalente Gefühle Platz im Buch. Heimweh, Angst für sich einzustehen, das Gefühl keine Freund*innen zu haben oder Schwierigkeit zu haben, welche zu knüpfen. Das Buch kann in drei Teile gegliedert werden - die Woche im Sommer, die erste Schulwoche und die Beerdigung. Auch wenn Teil 2 und 3 sehr kurz sind fühlt sich die Konfrontation mit dem Tod als runde Erzählung an, da rückblickend die Woche im Sommer (Teil 1) die nötigen Werkzeuge mitgab, um sich von August zu verabschieden. ISBN: 38-3696-142-3 €13.00 Goto genialokal.de + Add to list Wenn die ganze Welt ... - Joseph Coelho Ab 4 Jahren Ein farbenfroh poetisches Buch über gemeinsame Erinnerungen mit dem Wunsch diese für immer bei sich zu behalten. Entlang des Verlaufs der Jahreszeiten von Frühling bis Winter wird die Vergänglichkeit illustriert. Bis es im Winter still wird und der Großvater verstirbt. „Wenn die ganze Welt aus Erinnerungen bestünde, könnte ich in die eintreten wie in ein Zimmer, und in jedem würde ich meinen Großvater wiederfinden.“ Die Protagonist*innen sind PoC und sowohl im Text, als auch in den Illustrationen werden Elemente mit Bezug zu Indien aufgegriffen. ISBN: 34-5864-310-9 €15.90 Goto genialokal.de + Add to list Großvaters Walnuss - Ammi-Joan Paquette Ab 4 Jahren Die aus einem Samen wachsende Pflanze wird häufig als Motiv für das Sterben in Geschichten verwendet. Emilia, ihre Mutter und ihr Großvater leben in einem gemeinsamen Haus - es wird nicht erwähnt, ob es auch andere Personen in der Familie und dem gemeinsamen Haushalt gibt. Im Garten des Hauses stehen zwei Walnussbäume. Ein großer der einst vom Großvater gesetzt wurde und ein kleinerer, den die Mutter setzte. Das Haus bezogen einst die Großeltern, nachdem sie Jahre zuvor aus Italien fliehen mussten. Es wird nicht erklärt warum. Aus der Szene am Grab und dem Ablegen einer Walnuss auf dem Grabstein kann man ableiten, dass es sich möglicherweise um Jüd*innen handelt, die nach der Besetzung Italiens durch Deutschland flohen. Der Großvater hatte die Walnuss aus Italien mitgenommen und den daraus gezogenen Baum im Garten gesetzt. Der Baum hatte wie Emilias Familie in der neuen Heimat tiefe Wurzeln geschlagen. Im letzten gemeinsamen Jahr mit dem Großvater zieht er ein kleines Bäumchen mit Emilia heran. Während der Großvater schwächer wurde, wurde das Bäumchen größer. Am Tag nach Großvaters Tod setzt sie ihn in den Garten. Wo sie von nun an Wiedervereinigung sind - Großvater, Mutter, Emilia. ISBN: 34-5864-359-1 €15.90 Goto genialokal.de + Add to list Seifenblase - Genevieve Castrée Kindercomic Ein berührendes Buch über das Abschied nehmen und die wertvollen letzten gemeinsamen Momente einer Krebserkrankung. Genevieve Castrée hat das Buch ihrem Kind zum Abschied gemacht. Sie verstarb vor'
