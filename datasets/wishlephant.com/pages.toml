["https://wishlephant.com/blog/2021-11-12-gartentips"]
title = "Wishlephant - Blog - Gartentipps für Neulinge und grüne Geschenkideen - von Anna"
description = "April 2024: Anna hat mittlerweile ein Buch geschrieben, wie toll! Das muss hier unbedingt natürlich mit auf die Liste ♡."
full_description = '''Gartentipps für Neulinge und grüne Geschenkideen - von Anna Aus dem Leben einer Schrebergärtnerin - über Lieblingspflanzen, was sie gern vorher gewusst hätte und welches Buch man für naturnahes Gärtnern lesen sollte 12.11.2021 Für alle, die dich noch nicht kennen: wer bist du und was machst du schönes auf Instagram – und offline? Erstmal vielen Dank für die “Einladung” an euch! Ich bin Anna, gebürtige Berlinerin und beruflich viel an den Laptop und das Büro gebunden- der Garten ist daher mein perfekter Ausgleich. Auf Instagram zeige ich seit ungefähr einem Jahr alles rund um unseren Schrebergarten. Gemüsegärtnern, Stauden, Gartengestaltung oder kleine Bastel-DIY´s, es ist ziemlich bunt gemischt. Kennst du “Bin im Garten” von Maike Winnemuth? Das hab ich dieses Jahr gelesen und mich danach auf die Warteliste für einen Schrebergarten setzen lassen. Was war der Auslöser bei dir für einen Garten in der Stadt? Und wie hast du ihn bekommen? Bisher noch nicht gelesen, aber das Buch steht definitiv auf meiner Liste! Wir hatten Glück und haben den Garten von Freunden übernommen, da wir auch in der Nähe wohnen haben wir den Garten schon regelmäßig besucht und kannten somit die Kolonie. Ich lebe total gerne in der Stadt, aber brauche immer viel Zeit in der Natur- die Gartenarbeit erdet mich einfach ungeheuer. So ein urbaner Kleingarten ist für mich somit die ideale Lösung für alle Stadtmenschen, die neben dem ganzen Trubel ihr eigenes Stück Grün haben wollen. Ein Garten, im Idealfall mit Häuschen & Co., ist dann doch nochmal was anderes, als im Park oder Wald spazieren zu gehen: es wird irgendwann ein zweites zu Hause. Das eigene Gemüse ernten und sich eine grüne Oase erschaffen ist einfach ein tolles Gefühl. Und ich drücke dir ganz fest die Daumen, dass die Warteliste nicht allzu lang ist. Hach, Dankeschön! Was hat dir dabei geholfen, anzufangen und was hättest du gern vorher gewusst? Ich habe eigentlich ohne jeglichen Plan angefangen.. am Anfang musste dann aber erstmal Struktur rein, in die Beete und auch am Gartenhäuschen haben wir unfassbar viel gewerkelt. Ich hätte am Anfang gerne schon die Erkenntnis gehabt, dass alles seine Zeit braucht und man nicht in ein paar Wochen den perfekten Gemüse- oder Staudengarten anlegen kann. Das man ein bisschen mehr auf die Natur eingeht, auch in einem Schrebergarten kann man mal “loslassen”. Nach 1-2 Jahren kam somit die Erkenntnis, dass ich so naturnah wie möglich gärtnern möchte. So ein Garten spiegelt auch immer ein bisschen den Charakter wieder, ich mache nach wie vor einiges intuitiv, würde aber auch nach so vielen Jahren noch behaupten, dass man einfach nie aus lernt. Für alle Anfänger*innen kann ich Instagram, Gartenblogs und Gartbücher als Inspirationsquelle empfehlen, den Fokus am Anfang vielleicht erstmal auf einen Bereich legen und einfach nicht enttäuscht sein, wenn etwas mal nicht gelingt. Was waren drei Dinge, die nicht so gut geklappt haben? Ganz oft klappt etwas nicht wie man sich das vorgestellt hat. Da könnte ich jetzt alleine drei Gemüse-Versuche aufzählen, die so gar nicht geklappt haben. Dieses Jahr sind z.B. alle Kürbisse eingegangen, weil wir das Beet zu schattig gesetzt haben, die Tomaten mochten das regnerische Wetter nicht und der Kohl wurde restlos von hungrigen Gartentieren verspeist. Es gehört auch einfach dazu. Deine Fotos zeigen so viele so wunderschöne Blumen - wenn du dich entscheiden müsstest: welche ist dein größter Liebling? So ganz spontan würde ich die Wilde Möhren sagen! Sie hat eine lange Blütezeit, verwildert sehr gut im Garten, ist eine sehr Insektenfreundliche Pflanze und sieht auch noch in Blumensträußen total hübsch aus. Bei welchen Insta-Accounts holst du dir Inspiration/Wissen? Puh, da gibt es so viele tolle Accounts! @lilaluzi hat einen unfassbar vielfältigen Gemüsegarten und inspiriert mich immer auch Gemüse-technisch mal mehr zu machen. Bei @frau_ks_wilder_garten gibt es immer viel zum Thema Schnittblumen und DIYs. @geestgarten hat einen wunderschönen Bauerngarten und inspiriert mich ganz oft mit ihren Stauden-Vorstellungen. Was schenkst du dir selbst zu Weihnachten (wenn du es feierst)? Ich schenke mir zur Adventszeit immer einen Saatgut-Kalender, die gibt es mit Blumen- oder Gemüsesamen. Danke, liebe Anna für dieses feine Interview und die Einblicke! (Und wer weiß, vielleicht können wir in zwei Tagen auch schon Danke fürs Schrebergarten-Daumendrücken sagen! - stay tuned😱🤞🏼💚) Wer mehr von Annas wunderschönen Garten sehen, ihren DIYs und dem naturnahen Gärtnern lernen möchte: folgt ihr auf Instagram unter @gartenkleinod. Und hier kommen Annas Tipps für alle, die sich gern die Hände im Garten schmutzig machen oder die ihnen eine Freude machen wollen. Ihre Geschenkempfehlungen lassen auch bei erfahrenen Gärtner*innen die Herzen höher schlagen. Also falls ihr noch Inspiration sucht, los geht’s: Gartentipps und Geschenkideen für alle, die Gärten lieben In meinem Garten blüht das Glück April 2024: Anna hat mittlerweile ein Buch geschrieben, wie toll! Das muss hier unbedingt natürlich mit auf die Liste ♡. Goto genialokal.de + Add to list Der antiautoritäre Garten - Simone Kern Ein tolles Buch zum Thema "Naturgarten" und viele Tipps für Blumen, die sich selber aussäen ISBN: 978-34-4016-218-7 Goto genialokal.de + Add to list Kräutergarten Saatgut-Box S Bio (Holzbox) Wenn man nicht direkt mit dem Gemüseanbau starten möchte eignen sich Gartenkräuter für den perfekten Einstieg. Für Tees oder zum Kochen hat man direkt die passenden Zutaten im Garten. Die meisten Kräuter blühen außerdem schön und werden gerne von Bienen und Hummeln angeflogen. Goto shop.saatgut-dillmann.de + Add to list Gartenkorb Der perfekte Korb für die Gemüseernte oder den Blumenstrauß. Macht sich auch in jeder Gartenlaube super als Dekoelement Goto sostrenegrene.com + Add to list Holzkiste Eignet sich ideal zum Bepflanzen mit Kräutern oder Salat und ist gleichzeitig auch noch sehr dekorativ. Gartentipp: Immer an eine Drainage denken, damit das Gießwasser richtig abfließen kann. Bei Bepflanzung der Kisten am besten mit einem Vlies auslegen Goto sostrenegrene.com + Add to list BIO Saatgut Hohes Eisenkraut (Verbena bonariensis) Eisenkraut macht sich wunderschön im Staudengarten und zieht viele Schmetterlinge an. Gartentipp: auch hier die Samenstände stehen lassen damit es im nächsten Jahr wieder kommt. Goto biogartenladen.de + Add to list Gardol Hochbeetumrandung Die Beetrahmen gibt es in verschiedenen Größen. Sie können entweder als niedriges Beet verwendet - oder zu einem höherem Hochbeet gestapelt werden. Goto bauhaus.info + Add to list Wilde Möhre (Saatgut) Die Wilde Möhre ist eine tolle Blühpflanze, die sich sehr gut im Garten verwildert. Sie wird von vielen Insekten angeflogen. Gartentipp: nach dem ersten Schnitt blühen die meisten Pflanzen ein zweites Mal, wenn man im nächsten Jahr mehrere Pflanzen haben möchte- einfach die Samenstände den Herbst über stehen lassen. Goto kraeuter-und-duftpflanzen.de + Add to list Bellissa Holzrandsieb Das Sieb wird eigentlich zum Sieben von Erde verwendet - es eignet sich aber auch perfekt um Gartenkräuter oder Blumen zu trocknen. Bei Gartenkräutern für z.B. Tee etc, ist eine gute Belüftung beim Trocknen am wichtigsten. Goto bauhaus.info + Add to list Esschert Gartenschere Die klassische Gartenschere ist wohl das wichtigste Werkzeug im Garten und gehört zu jeder Werkzeug-Grundausstattung zwingend dazu Goto gartentraeume.com + Add to list Gießkanne Metall Eine Gießkanne kann man immer gebrauchen und in Metalloptik noch viel schöner Goto bauhaus.info + Add to list Blumensamen 'Historische Kapuzinerkresse' Ich finde Kapuzinerkresse gehört in jeden Garten. Sie schmeckt nicht nur sehr gut und die Blüten eignen sich zum dekorieren von Salaten- sondern sie kann auch sehr dekorativ an Rabatten oder Zäunen ranken. Bei Manufactum gibt es Zusammenstellung von historischen Sorten. Gartentipp: nach der Blütezeit eignet sich die Kresse auch sehr gut zum Mulchen der Beete Goto manufactum.de + Add to list dida Blumenpresse Bei Dida Seeds gibt es diese wunderschöne handgefertigte Blumenpresse. Ich konserviere so gerne mein Gartenjahr und rahme die gepressten Blüten ein. Goto didaseeds.com + Add to list Garantia Komposter Thermo-Wood Wenn man eigenen Kompost anlegt hat man nicht nur Verwendung für den ganzen Grünschnitt/Laub sondern auch immer frische und nährstoffreiche Erde für Beete und Blumentöpfe! Der Komposter ist zwar optisch nicht der Kracher, aber kompostiert Dank seiner Thermofunktion super schnell. Nie wieder Erde schleppen ;) Gartentipp: den Kompost alle Tage gießen und wieder gut verschließen, das beschleunigt den Prozess. Goto bauhaus.info + Add to list Bienenweide Region Nord-Ost (mehrjährig, 50 g) | Bienenwiese von Biobalu Eine Bienenwiese gehört einfach in jeden Garten. Der Großteil der Blumen ist mehrjährig und breitet sich schön im Garten aus. Nicht enttäuscht sein, wenn sich im Sommer noch nicht allzu viel zeigt: die meisten Mischungen blühen bis in den Spätherbst und kommen im zweiten Jahr umso prächtiger. Goto samenhaus.de + Add to list Romantischer Blumengarten - Samen-Geschenkset | Sets & Geschenke - Samen & Saatgut Magical Gardenseeds hat ausgefallene Sorten und eine wunderschöne Verpackung- perfekt zum Verschenken Goto magicgardenseeds.de + Add to list Dehner Metall-Hochbeet 'Münster 1' | Dehner Vor allem für kleinere Gärten eignen sich die Mini-Hochbeete perfekt für Gemüse oder Kräuter. Gartentipp: auch hier auf eine ausreichende Drainage achten, damit keine Staunässe entsteht. Ich lege z.B. immer ein Drainage aus Vlies und Kieselsteinen. Goto dehner.de + Add to list SVARTRÅ Lichterkette (12), LED - schwarz/für draußen Outdoor-Lichterketten schenken dem Garten eine wunderschöne Abendstimmung Goto ikea.com + Add to list Saatgut-Box "Gartenjahr" Wenn man mit dem Gemüsegärtnern anfangen möchte ist es immer von Vorteil ein umfassendes "Starterset" zu haben- diese Box deckt sogar das gesamte Gartenjahr ab und man hat bis in den Spätherbst eigenes Gemüse zum ernten. Goto shop.rankwerk.de + Add to list Bin im Garten - Meike Winnemuth Anmerkung von Anika: Über dieses Buch sprechen wir kurz im Interview, deswegen steht es hier. Wer Lust auf einen eigenen (Schreber)garten bekommen, oder einfach ein schön zu lesendes Gartentagebuch durchs Jahr möchte: für die ist dieses Buch genau richtig. ISBN: 33-2810-815-7 Goto genialokal.de + Add to list Bienenhotel Mit einem Bienenhotel trägt man viel zum Artenschutz bei und bietet ein Winterquartier. Hier sollte man immer auf eine saubere Verarbeitung des Holzes achten. Gartentipp: nach einer Weile prüfen, ob Vögel die verschlossenen Eingänge aufmachen und ggf. mit einem Gitter absichern. Goto diestadtgaertner.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)'''
