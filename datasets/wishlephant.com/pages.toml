["https://wishlephant.com/blog/2019-12-08-reprodukt"]
title = "Wishlephant - Blog - Von Hundebanden und Büchern mit Leidenschaft - Mona von Reprodukt"
description = "So eine schöne Gutenachtgeschichte mit der lustigsten und liebenswertesten Hundebande, die wir je gesehen haben. Auch das Format ist richtig super, weil es was besonderes ist!"
full_description = "Von Hundebanden und Büchern mit Leidenschaft - Mona von Reprodukt 08.12.2019 Zum zweiten Advent haben wir unseren Lieblingsverlag für euch interviewt - Reprodukt aus Berlin. Die verlegen nicht nur tolle Comics, Graphic Novels und Bilderbücher, sondern haben auch noch die nettesten Mitarbeiter*innen, die wir je getroffen haben. Anika durfte Mona aus dem Vertrieb kennenlernen, die uns ihre 5 Lieblinge für Eltern und Kinder empfiehlt und auch ihre persönlichen Herzensstücke von Reprodukt. Illustration von Anne Becker. Beschreib dich und was du machst gern in drei Sätzen: Ich bin Mona und ich liebe es, schöne Kinderbücher anzuschauen, (vor-) zu lesen und zu sammeln. Eine Leidenschaft, die ich schon gehegt habe, bevor ich Mama von Jonte (4) und Lotta (2) wurde. Außerdem arbeite ich bei Reprodukt — einem tollen Kindercomic-Verlag (der auch ganz tolle Bücher für Erwachsene macht)! Was ist besonders an Reprodukt? Bei Reprodukt wird neben dem Inhalt — den tollen, lustigen, berührenden Geschichten — auch viel Wert auf die Herstellung und Ausstattung der Bücher gelegt. Meist entstehen diese in enger Zusammenarbeit mit den Künstler*innen, die Texte werden immer sorgfältig übersetzt und in der Regel handgelettert. Ich finde, man merkt den Büchern die Leidenschaft an, mit der die Macher*innen dabei sind! Worauf freust du dich im nächsten Jahr? Ich freue mich am meisten auf meinen Sommerurlaub in Dänemark mit der ganzen Familie, Füße im Sand und gute Comics im Gepäck… Welches ist dein eigenes Lieblingsbuch bei Reprodukt? Das ist eine verdammt schwere Frage. Aber wenn ich zumindest zwei nennen darf, wären das EIN SOMMER AM SEE von Jillian und Mariko Tamaki und LICHTUNG von Antonia Kühn. Beide Bücher erzählen auf ihre Art sehr berührende Geschichten, die von Familie und Freundschaft erzählen. Auf unserer Postkarte haben wir drei Wünsche, die man sich als Eltern für Weihnachten wünschen könnte, welchen Wunsch würdest du ankreuzen? Definitiv Nummer eins, allein aufs Klo. Schläfst du? So eine schöne Gutenachtgeschichte mit der lustigsten und liebenswertesten Hundebande, die wir je gesehen haben. Auch das Format ist richtig super, weil es was besonderes ist! Goto reprodukt.com + Add to list 1 Wolf, 2 Hunde, 3 Schlüpfer Zählen lernen anhand von Schlüpfern, noch ein Buch von der Hundebande, in die wir uns sehr verliebt haben Goto reprodukt.com + Add to list Die Rückkehr aufs Land 3 So tolle Nachrichten für alle Fans wie Anika: Kommt im Mai 2020 raus und ist jetzt schon vorbestellbar. Goto reprodukt.com + Add to list Die Rückkehr aufs Land 1 wird gerade überarbeitet, kann man aber vorbestellen Goto reprodukt.com + Add to list Die Rückkehr aufs Land 2 Goto reprodukt.com + Add to list Hilda und der Troll Wunterschöner Comic (nicht nur) für Kinder ab 6. Bodo kann es kaum abwarten, das unsere Tochter alt genug ist die zu lesen. Goto reprodukt.com + Add to list Kinderland Mawil ist einer von Bodos Lieblingskünstlern. Hier erzählt Mawil sehr toll, wie es war im Osten aufzuwachsen. Goto reprodukt.com + Add to list Ein Sommer am See Eines der Lieblingsbücher von Mona aus unserem Inverview, das auch Bodo im Regal stehen hat und sehr liebt. Goto reprodukt.com + Add to list Lichtung Eines der Lieblingsbücher von Mona aus unserem Interview. Eine berührende Geschichte von Familie und Freundschaft. Goto reprodukt.com + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)"
