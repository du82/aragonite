["http://wishlephant.com/blog/2021-12-17-ninia-liest"]
title = "Wishlephant - Blog - Ninia LaGrandes Lieblingsbücher von 2021"
description = "„Die letzte Bibliothek der Welt“ ist in Wahrheit nur eine kleine Bücherei im britischen Dorf Chalcot. Aber: Sie soll geschlossen werden. Und das darf nicht passieren. Also formiert sich Widerstand rund um die Bibliothekarin June. Ich liebe alles, was inhaltlich mit Bibliotheken zu tun hat. Ich rieche die alte Bücherei meiner Kindheit, während ich lese. Das Buch ist ein wunderbares Herbst-Winter-Buch, ein bisschen Gilmore Girls Vibes in Großbritannien. Ich würde mich freuen, wenn wir bald eine Verfilmung dazu sehen können."
full_description = "Ninia LaGrandes Lieblingsbücher von 2021 Die Autorin verrät uns ihre Top 10 aus diesem Jahr 17.12.2021 Foto von Xenia Bluhm. Ninia, du bist gefeierte Autorin, Poetry Slammerin, Moderatorin, Podcasterin und brauchst eigentlich keine Vorstellung mehr, aber vielleicht verrätst du uns noch 3 Dinge, die bisher noch kaum jemand bei deiner Vorstellung erwähnt hat? Gute Frage :D! Ich mag die griechische Mythologie und kenne mich damit auch ziemlich gut aus. Ich bin Camperin - spät zur Überzeugung gelangt, aber immerhin. Und entgegen aller Algorithmen auf Instagram kann ich weder kochen noch gut eine Wohnung einrichten. Dieses Jahr war echt viel los, und du hast richtig tolle und aufregende Sachen moderiert - darunter auch mit den Grünen gearbeitet. Welches Event hat dich richtig bewegt? Oh, dafür muss es gar nicht richtig groß werden. Am bewegendsten fand ich den ersten Auftritt unserer Lesebühne - wieder vor richtigem Publikum und fast full house. Auch, weil mir ein Paar aus dem Publikum ein Foto von mir schenkte, richtig in einer schönen Mappe mit Dank für meine Redekunst - da war ich sprachlos. Du hast auch immer die besten Outfits parat, und selbst auf dem Campingplatz, schriebst du mit deinem Mann (@grosses_rotes_auto), seid ihr immer eher stylisch unterwegs als hust hust andere, die dort ihre verdreckte Jogginghose tragen. Woher kommt diese Liebe für Klamotten? Ha, das hat er geschrieben! (Ich fand das nämlich schon fast zu arrogant :D.) Die Liebe zur Mode kommt definitiv von meiner Mama - sie hat mich immer stylisch und außergewöhnlich (im guten Sinne) angezogen und mir sehr viel Mut, was das Ausprobieren angeht, mitgegeben. Ich fühle mich selbst einfach besser, wenn ich entsprechend angezogen bin. Das geht übrigens auch im Jogginganzug - aber dann vielleicht mit schicken Ohrringen, Lippenstift oder knalligen Schuhen. Hast du einen Lieblingsklamottenladen? Jepp - ich kaufe am liebsten vor Ort, im „Salon“ in Hannover-Linden. Bei welchem Buch/Serie/Podcast hast du das letzte Mal so richtig laut gelacht? Podcast mit Sicherheit bei „Drinnies“, lustiger gehts ja nicht. Serientechnisch bin ich nicht so auf der komischen Seite unterwegs. Ich tue mich eh mit vielem schwer, was hier als Comedy und lustig aufgefasst wird. Ich bin wirklich schwer zum Lachen zu bringen - ggf. Könnte Bully mich mal für LOL anrufen :D. (Da habe ich übrigens sehr laut gelacht zuhause.) Worauf freust du dich? Ganz im Moment: Heute wieder nach Hause zu kommen (Grüße aus dem Zug!). Ansonsten: Weihnachten und Urlaub. Wie wars dieses Jahr mit dem Lesen - hast du mit der Pandemie eher mehr oder eher weniger gelesen? Das kann ich nicht sagen. Ich lese immer sehr viel. Das hat sich mit der Pandemie nicht groß verändert. Auch, weil ich nach den ersten fünf Monaten der Pandemie wieder sehr viel unterwegs war, um hybride und digitale Formate zu moderieren oder Podcasts aufzunehmen. Bei mir blieb also nicht unbedingt mehr Zeit übrig. Welches Buch liest du gerade? „Im letzten Licht des Herbstes“ von May Lawson Was schenkst du dir zu Weihnachten? Eine schicke Tasche und Ruhe. Danke für das Interview und die schönen Schmöker-Tipps! Wer mehr über Ninia erfahren möchte, folgt der Queen der absurdesten und besten Filter auf Instagram: @ninialagrande. Und hier könnt ihre Podcasts hören: Die kleine schwarze Chaospraxis mit Ninia LaGrande und Denise M’Baye und All inclusive. Ninias Top 10 Bücher aus 2021 Die letzte Bibliothek der Welt - Freya Sampson „Die letzte Bibliothek der Welt“ ist in Wahrheit nur eine kleine Bücherei im britischen Dorf Chalcot. Aber: Sie soll geschlossen werden. Und das darf nicht passieren. Also formiert sich Widerstand rund um die Bibliothekarin June. Ich liebe alles, was inhaltlich mit Bibliotheken zu tun hat. Ich rieche die alte Bücherei meiner Kindheit, während ich lese. Das Buch ist ein wunderbares Herbst-Winter-Buch, ein bisschen Gilmore Girls Vibes in Großbritannien. Ich würde mich freuen, wenn wir bald eine Verfilmung dazu sehen können. ISBN: 38-3216-567-3 Goto genialokal.de + Add to list Wirklich nett – Marcy Dermansky Ein super stranges Buch und gerade deshalb ist es so toll. Rachel küsst ihren Professor für Kreatives Schreiben, durch diverse Wendungen verbringt dieser dann den Sommer im Haus ihrer Mutter – während Rachel auch dort ist und ihrem Ferienjob nachgeht. Ihre Mutter ist frisch getrennt, ihr Pudel ist gestorben, da kommt der Professor mit eigenem Pudel gerade recht. Diese Geschichte ist unfassbar komisch – in allen Bedeutungen des Wortes und haut einer nebenbei auch noch Gesellschaftskritik um die Ohren. Mein Lieblingszufallsfund 2021. ISBN: 34-6340-718-3 Goto genialokal.de + Add to list Ist alles deins! – Jami Attenberg Seitdem ich den ersten Attenberg-Roman gelesen habe, bin ich Fangirl No. 1. Auch ihr neues Buch hat mich wieder total abgeholt. Victor Tuchman hat einen Herzinfarkt. Skrupelloser Geschäftsmann, brutaler Ehemann und abwesender Vater. Trotzdem versucht die Familie wieder in New Orleans zusammenzukommen, um sich – ja – nicht unbedingt zu verabschieden, sondern eher für sich selbst mit der Vergangenheit aufzuräumen. Und, Achtung, im Januar erscheint „I came all this way to meet you: Writing myself home” auf Deutsch. ISBN: 38-9561-358-4 Goto genialokal.de + Add to list Ciao – Johanna Adorján Hans Benedek ist Feuilletonist und im Grunde der Inbegriff des alten, weißen Mannes. Seine Affäre mit der Praktikantin läuft nicht so wie gedacht und jetzt wird er auch noch die bekannteste Feministin des Landes interviewen. Für mich schon fast erschreckend, wie nah an der Realität Adorján mit ihrem kurzen, aber sehr unterhaltsamen Roman bleibt. Liest sich an einem Tag durch! ISBN: 34-6200-171-X Goto genialokal.de + Add to list Radikale Selbstfürsorge. Jetzt! – Svenja Gräfen Disclaimer: Svenja ist eine meiner besten Freundinnen. Und gerade deshalb glaube ich beurteilen zu können, dass dieses Buch besonders gut ist. Und genau den Zeitgeist trifft. Ich hasse Ratgeber. Und alle Bücher, die mir erzählen wollen, ich würde nur durch Leistung und Verzicht ein besserer Mensch werden. Svenjas Buch ist eine gute Freundin, die eine an die Hand nimmt und erkennen lässt, wie schon Kleinigkeiten das Selbstbefinden ändern können. Warum es ok ist, wütend, faul oder traurig zu sein. Ich liebs und verschenke es sehr gerne. ISBN: 39-5910-332-8 Goto genialokal.de + Add to list Was wir wollen – Meg Mason Dieses Buch schmerzt an der einen oder anderen Stelle. Und gerade das macht es so herausragend. Martha ist Ende 30 und verheiratet. Eigentlich müsste sie glücklich sein. Eigentlich. Irgendwas stimmt nicht mit Martha und im Laufe der Geschichte wird dieses Gefühl drückend, explosiv. Bei Martha und bei mir. Als Marthas Mann sie verlässt, bricht sich das diffuse Gefühl Bahn und Martha macht sich auf die Suche nach sich selbst. Mason schreibt unglaublich nah an den Protagonist*innen. Selten habe ich das Thema Depression oder psychische Erkrankungen so ungenannt, aber offensichtlich in einem Buch erlebt. Ein Must-Read für mich. ISBN: 37-5300-003-5 Goto genialokal.de + Add to list Junge Frau, am Fenster stehend, Abendlicht, blaues Kleid – Alena Schröder Schröder schreibt über die Leben dreier Frauen aus drei Generationen: Großmutter, Mutter, Tochter. Die Großmutter spricht nicht gern über die Vergangenheit und bis ein Brief aus Israel eintrifft, fragt die Tochter auch nicht nach. Doch die Post verändert alles. Ein großartiger Generationenroman über jüdische Geschichte und Frauenleben in verschiedenen Jahrzehnten – hat mich sehr beeindruckt. ISBN: 34-2328-273-8 Goto genialokal.de + Add to list Das Verschwinden der Erde – Julia Philipps Dieses Buch konnte ich nicht weglegen. An einem Sommertag verschwinden in Kamtschatka zwei Schwestern. Wer jetzt an einen Krimi denkt, liegt ein bisschen falsch. Philipps führt uns in verschiedene Frauenleben auf der Halbinsel. Der Roman zeigt uns, in welcher Form die Protagonist*innen miteinander verbunden sind, geprägt von einer sehr patriarchalen und leistungsorientierten Gesellschaft. Philipps selbst sagt, sie zeigt mit jedem, Handlungsstrang ein weiteres Spektrum von Gewalt. Passender kann man es nicht beschreiben. Mich hat das Setting, das Philipps entwirft unglaublich fasziniert. Mein Favorit in diesem Jahr! ISBN: 34-2314-826-8 Goto genialokal.de + Add to list Ich denk, ich denk zu viel – Nina Kunz Die Kolumnen von Nina Kunz habe ich im Sommerurlaub gelesen und war sehr traurig, als es schon wieder vorbei war. Nina Kunz denkt wirklich viel. Und es macht Spaß, ihr dabei zuzuhören. Sie beschreibt das Bild einer Generation, in der ich mich – obwohl ich einige Jahre älter bin als Kunz – sehr wiedergefunden habe. Es geht um Butterbrote, Tattoos, Weltschmerz und digitale Abstinenz. Und um so viel mehr. Ich freue mich auf weitere Veröffentlichungen. ISBN: 30-3695-843-6 Goto genialokal.de + Add to list Allein – Daniel Schreiber Schreibers Essays atme ich ein. Er kann seine Leser*innen so gut mitnehmen in eine Welt aus eigenen Erfahrungen, philosophischen Ausflügen und utopischen Ideen. „Allein“ behandelt die Rolle der Freundschaft in unserer Zeit und das Spannungsverhältnis zwischen dem Wunsch nach Partner*innenschaft und dem freien Leben allein. Ich will alles anstreichen. Obwohl ich so gar nicht in die Ausgangsposition des Autors passe. Selten fühle ich mich nach einer Lektüre um so vieles schlauer als bei Schreiber. Kein Geheimtipp mehr. ISBN: 34-4626-792-1 Goto genialokal.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)"
