title = "Wishlephant - Blog - Tebalou - Vielfalt im Spielzimmer"
description = "Simple to use. No login required. Create a wish list in seconds. At no charge."
full_description = "Tebalou - Vielfalt im Spielzimmer 07.11.2019 Wir wollen euch ab jetzt in unregelmäßigen Abständen tolle Stores vorstellen. Heute beginnen wir mit Tebalou, einem Store mit einem besonders schönen Fokus. Aber lest selbst. Foto von Christina Salgar. Wer seid ihr? Wir sind Tebbi Niminde-Dundadengar und Olaolu Fajembola, die Gründerinnen des Onlineshop www.tebalou.de, welcher sich auf die Vermarktung und den Verkauf von vielfältiger Kinder- und Jugendbuchliteratur sowie Spielzeug spezialisiert hat. Wir leben in Berlin und sind Mütter von insgesamt 4 Kindern. Neben unserem Onlineshop beraten wir als Psychologin und Kulturwissenschaftlerin Unternehmen im Bereich Diversität in der frühkindlichen Erziehung und organisieren Bücher und Materialtische für unterschiedliche Veranstaltungen und Kongresse. Könnt ihr eure Gründungsgeschichte in drei Sätzen erzählen? Liebe auf den ersten Blick beim Kennenlernen und die Erkenntnis, dass wir beide einen gemeinsamen Traum hegen: Mehr Repräsentation von ALLEN Kindern und ihren vielfältigen Lebensrealitäten in Büchern und Spielzeugen. Außerdem der Wunsch in unserer Selbstständigkeit die Vereinbarkeit von Familie und Beruf zu leben. Was unterscheidet Tebalou von anderen Online-Stores? Uns unterscheidet insbesondere der inhaltliche Ansatz. Unsere Produkte sollen nicht nur schön, pädagogisch wertvoll und hochwertig sein. Wichtig ist uns die diskriminierungssensible und vorurteilsbewusste Darstellung aller Kinder. Insbesondere auch die Darstellung von Kindern, welche sich sonst fast nie in Büchern und in Spielzeug wiederfinden. Kinder mit Behinderung, Kinder aus Regenbogenfamilien, Kinder mit unterschiedlichster ethnischer, religiöser oder kultureller Herkunft finden sich noch immer selten als Helden*innen von Kinderbüchern. Die meisten von uns haben unterschiedlichste Privilegien oder Merkmale, welche uns als „anders“ markieren. Ziel ist es eine plurale, weltoffene und gerechte Spielewelt zu präsentieren. Erinnert ihr euch noch an das erste Produkt, das ihr verkauft habt? Unsere allererste Kundin war Tebbi´s Tante. Sie hat einige Minuten, nachdem wir online gegangen sind direkt bestellt 😊. Was sie genau gekauft hatte mussten wir aber tatsächlich nachschauen. Es war das Malbuch „Curls in color“. Was ist euer absolutes Lieblingsprodukt? Und warum? Tebbi: Mein absolutes Lieblingsprodukt sind die Lottie Dolls. Als Kind war ich ein großer Barbie Fan. Inzwischen sehe ich Barbie kritisch, verstehe aber noch immer den Wunsch von Kindern mit Modepuppen zu spielen. Lottie ist eine ganz wunderbare Alternative, weil sie dem Körper eines 8-jährigen Kindes nachempfunden ist, aktive Hobbies betreibt und inspiriert ist von echten Kindern. Olaoulu: Ich liebe die Family-Builders. Mit den magnetischen Holzfiguren können schon die aller Kleinsten ihre Familie und Freunde nachbauen. Aus meiner Zeit als Waldorfkind prägt mich bis heute meine Liebe zu Holzspielzeug und Produkten, die das freie Spiel fördern und der Fantasie freien Lauf lassen. Worauf freut ihr euch im nächsten Jahr bei Tebalou? So richtig können wir noch gar nicht an das nächste Jahr denken. Für uns steht ja zunächst einmal das Weihnachtsgeschäft vor der Tür. Da wir stetig wachsen steht aber in jedem Fall ein Umzug bevor und wir freuen uns auf neue Räumlichkeiten. Außerdem möchten wir unser Team vergrößern. Es bleibt auf jeden Fall spannend und wir schauen voller Vorfreude auf das nächste Jahr. Auf unserer Postkarte haben wir drei Wünsche, die man sich als Eltern für Weihnachten wünschen könnte, welchen Wunsch würdet ihr ankreuzen? Definitiv „Netflix und Chill statt Abwasch und Müll“. Unsere Kinder sind zwischen 5 und 10 Jahren alt, das heißt wir dürfen zum Glück schon länger wieder allein auf Klo 😉. Von Sand bleiben wir im Winter auch weitestgehend verschont. Aber wenn sich jemand findet, der uns den Haushalt macht sagen wir nicht nein. War etwas für eure Wunschliste dabei? Hier noch die in dem Interview genannten Produkte und dazu noch ein paar weitere als kleiner Bonus. Ich bin anders als du - Ich bin wie du Goto tebalou.shop + Add to list MyFamilyBuilders: Mix&Match Spielfiguren aus Holz (16-teilig) Goto tebalou.shop + Add to list Beißring, regenbogenfarben Goto tebalou.shop + Add to list LYRA-Farbriesen Skin Tones Goto tebalou.shop + Add to list Curls in Color Goto tebalou.shop + Add to list Lottie Puppe: Tierfotografin Mia (mit Cochlea-Implantat) Goto tebalou.shop + Add to list MyFamilyBuilders: Mix&Match Spielfiguren aus Holz (48-teilig) Goto tebalou.shop + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)"
