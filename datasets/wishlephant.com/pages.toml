["https://wishlephant.com/wishlists/86f23098-60bc-4516-9c44-a64cc48fac57"]
title = "Wishlephant - Familienspiele, die Community-Liste"
description = "Danke für all eure schönen Antworten auf die Frage, was ihr gerade spielt. Eine schöne Liste ist so zusammengekommen!"
full_description = '''Familienspiele, die Community-Liste by Wishlephant Danke für all eure schönen Antworten auf die Frage, was ihr gerade spielt. Eine schöne Liste ist so zusammengekommen! Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Le Scorpion Masque - Zombie Kidz Evolution empfohlen von @bilazmrzlina "Das ist so lustig! Es ist ein kooperatives Gesellschaftsspiel, bei dem zwei bis vier Spielende gemeinsam versuchen, Zombies zu bekämpfen, die versuchen eine Schule zu erobern. Je öfter man das Spiel spielt, desto mehr Eigenschaften kann man für die Charaktere freischalten. Es gibt Umschläge mit neuen Figuren und Eigenschaften, die man dann nach und nach ins Spiel mit einbeziehen kann. Das Spielfeld und die Charaktere sind sehr schön gestaltet und es macht einfach super viel Spaß, gemeinsam sich abzusprechen und strategisches Spielen zu lernen. Seinen Spielstand hält man mit Aufklebern fest, was auch richtig fetzt. Die Spieldauer variiert sehr, ja nach Charakter und Eigenschaft zwischen 10-45 Minuten." €26.17 Goto thalia.de + Add to list MicroMacro: Crime City “Das hat uns großen Spaß gemacht. Auf einem Wimmelstadtplan wird als Team nach Hinweisen für die Lösung eines Kriminalfalles gesucht. Spannend, knifflig, lustig.” ab 8 Jahren empfohlen von @hey.jojo.yeah Goto spiele-offensive.de + Add to list Zauberberg Kinderspiel des Jahres 2022, ab 5 Jahren. empfohlen von @hey.jojo.yeah €27.95 Goto thalia.de + Add to list KOSMOS - EXIT - Das Spiel Kids: Monstermäßiger Rätselspaß Überall sind Monster unterwegs und sie sind sehr hungrig! In jeder neuen Runde wartet neuer Rätsel-Spaß auf ein Team aus 2-4 Kindern. Sie erleben gemeinsam ein aufregendes Abenteuer. Ein lustiges Kinderspiel mit großer Spannung. Der perfekte Einstieg in die Marke Exit® - ab 5 Jahren. empfohlen von @1337haeckse und Sophie €10.83 Goto thalia.de + Add to list Schmidt Spiele - Bing Boing Alle nutzen den gleichen Würfelwurf und kreuzen doch unterschiedliche Zahlenkombinationen auf ihrem Blatt an. Der “Boing”-Bonus bringt große Freude, und wer alle Zahlenfelder zuerst markiert hat und Bing-Boing-Fertig ruft, gewinnt! ab 7 Jahren empfohlen von @fraulegas €6.99 Goto thalia.de + Add to list Pegasus - Magic Maze Kids Oh nein, der König wurde in einen Frosch verwandelt! Schnell eilen Prinz, Prinzessin, Hexe und Zauberer in den Wald, um die Zutaten für einen heilenden Trank zu sammeln. Doch der Wald ist das reinste Labyrinth und oft stehen Tiere oder Trolle im Weg. Nur wenn die Spieler zusammenarbeiten, schaffen sie es, den Trank zu brauen - ansonsten muss der König für immer ein Frosch bleiben. Magic Maze Kids ist die kinderfreundliche Einsteigerversion von Magic Maze. Im Laufe von 11 Tutorials werden nach und nach alle Regeln vermittelt, um sich dann nach Herzenslust auf den vier regulären Spielplänen auszutoben. ab 5 Jahren empfohlen von @1337haeckse €34.99 Goto thalia.de + Add to list KOSMOS - Die Legenden von Andor Junior Großer Schreck! Die Wolfsjungen haben sich in den Bergen verirrt und brauchen dringend Hilfe. Keine Frage, dass die Held*innen von Andor zu ihrer Rettung eilen. Doch der listige Drache macht sich zum Angriff bereit. Werden die Held*innen es schaffen, ihre Aufgaben zu erfüllen, bevor der Drache die ungeschützte Burg erreicht? Ein spannendes Abenteuer in der Welt von „Die Legenden von Andor“ beginnt! „Andor Junior“ ist ein kooperatives Brettspiel für 2-4 Kinder ab 7 Jahren. empfohlen von @1337haeckse €23.68 Goto thalia.de + Add to list Wer war's? - Kinderspiel des Jahres 2008 gibts auch günstiger als Mitbringvariante: https://www.spiele-offensive.de/Spiel/Wer-Wars-Mitbringspiel-1007736.html Das Gemeinschaftsspiel für einen lustigen Spieleabend: Dank der anhaltenden Spannung und einer Spieldauer von 30-45 Minuten ist es das ideale Kinderspielzeug für die ganze Familie. Findet den Dieb des Zauberrings! Wer war’s? Welcher Schlossbewohner*innen hat ihn gestohlen? Die sprechenden Tiere werden den Kindern sicher helfen. Dafür sollten sie nur mit ihrem gewünschten Futter versorgt werden. Pfau, Esel, Ziege und Co. haben nämlich den Dieb in der Nacht beobachtet … Jetzt müssen alle Spieler*innen des elektronischen Brettspiels Wer war’s? zusammenarbeiten. Denn nur gemeinsam entlocken die Kinder den sprechenden Tieren ihre geheimen Hinweise auf den Täter. Immer wieder können Verdächtige nach und nach ausgeschlossen werden und schon bald sind die Kinder dem Dieb auf der Spur. ab 6 Jahren empfohlen von @sirereal4 €48.82 Goto thalia.de + Add to list Blue Orange - Slide Quest In Slide Quest können die Spieler*innen den Spielplan mithilfe von 4 Hebeln in die vier Himmelsrichtungen neigen. Dadurch steuern sie den rollenden Ritter (eine Kugel) über einen der Levelspielpläne. Insgesamt stehen den Spielern 20 verschiedene Level zur Verfügung. In jedem Level haben sie dabei verschiedene Aufgaben zu bewältigen: einem einfachen Pfad folgen, Hindernisse und Fallen umgehen, Wachen in Löcher schubsen usw. In jeder Partie werden dabei 5 Level in einer der 4 Welten gespielt. Habt ihr das letzte Level zu Ende gespielt und dabei noch mindestens 1 Leben übrig, habt ihr gewonnen. ab 6 Jahren empfohlen von @blumentopferde €24.69 Goto thalia.de + Add to list HABA - Rhino Hero-Super Battle, 3D-Stapelspiel Es gibt dieses Geschicklichkeits-Spiel auch noch in einer Grundvariante. Bei Rhino Hero Super Battle werden nicht nur die wackeligsten Wolkenkratzer bestiegen, sondern auch knallharte Battles zwischen den vier Superhelden Rhino Hero, Giraffe Boy, Big E. und Batguin ausgetragen. Wer battelt sich zum Sieg und lässt sich auch durch die fiesen Spider Monkeys nicht aus der Ruhe bringen? ab 5 Jahren empfohlen von @blumentopferde €22.86 Goto thalia.de + Add to list Dobble Kids Gibts in allen verschiedenen Varianten und Levels! empfohlen von @jo.luecke €12.45 Goto thalia.de + Add to list Carcassonne - Grundspiel Auflage 3 Während einer Partie erschaffen die Spieler mittelalterliche Landschaften und bevölkern sie mit Rittern, Wegelagerern, Mönchen und Bauern. Wem gelingt es, durch geschicktes Anlegen von Landschaftsplättchen und Setzen von Gefolgsleuten (Meeplen) die Vormachtstellung rund um die südfranzösische Stadt Carcassonne zu erringen? Die beiden Mini-Erweiterungen Der Fluss und Der Abt sind bereits im Grundspiel enthalten. ab 7 Jahren empfohlen von Sophie Goto spiele-offensive.de + Add to list Spinnengift und Krötenschleim Was kommt in den Kessel rein? lustiges Merkspiel für 2-4 Spieler, Kinderspiel ab 6 Jahren empfohlen von Sophie Goto amazon.de + Add to list Libellud - Dixit, Neuauflage Spiel des Jahres 2010 Ein kratives Spiel! Ihr überlegt euch zu einer der sechs Karten, die ihr auf der Hand haltet, eine treffende Aussage. Diese kann aus einem oder mehreren Worten bestehen oder sich auch nur auf eine Lautmalerei beschränken. Erfindet frei oder nutzt ein Zitat als Hinweis. Das kann der Beginn eines Liedes, ein Filmtitel oder auch die Zeile eines Gedichts sein.Der Fantasie sind keine Grenzen gesetzt. Die Mitspielenden suchen entsprechend der Bedeutung aus ihren Handkarten jeweils diejenige aus, von der sie glauben, dass sie am besten zu dem gegebenen Hinweis passt. ab 8 Jahren €23.78 Goto thalia.de + Add to list UNO Spiel Der Klassiker! Es gibt auch noch andere Spezialvariationen mit anderen Regeln oder gebrandeten Karten wie Paw Patrol. empfohlen von Sophie und @sirereal4 Goto thalia.de + Add to list 15 wishes'''
