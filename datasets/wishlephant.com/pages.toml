["http://wishlephant.com/wishlists/fca6449f-592f-4502-a6b8-9eadfcd1c501"]
title = "Wishlephant - Gartentipps und Geschenkideen für alle, die Gärten lieben - von Anna"
description = "Anna @gartenkleinod gibt Tipps und Tricks für alle, die neu mit dem Gärtnern anfangen und verrät Geschenkideen, bei denen auch erfahrene Gärtner*innen-Herzen höher schlagen. Hier geht es zum Interview mit Anna, mit zauberhaften Einblicken in ihren Garten: https://wishlephant.com/blog/2021-11-12-gartentips"
full_description = '''Gartentipps und Geschenkideen für alle, die Gärten lieben - von Anna by Wishlephant Anna @gartenkleinod gibt Tipps und Tricks für alle, die neu mit dem Gärtnern anfangen und verrät Geschenkideen, bei denen auch erfahrene Gärtner*innen-Herzen höher schlagen. Hier geht es zum Interview mit Anna, mit zauberhaften Einblicken in ihren Garten: https://wishlephant.com/blog/2021-11-12-gartentips Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> In meinem Garten blüht das Glück April 2024: Anna hat mittlerweile ein Buch geschrieben, wie toll! Das muss hier unbedingt natürlich mit auf die Liste ♡. €16.00 Goto genialokal.de + Add to list Der antiautoritäre Garten - Simone Kern Ein tolles Buch zum Thema "Naturgarten" und viele Tipps für Blumen, die sich selber aussäen ISBN: 978-34-4016-218-7 €19.99 Goto genialokal.de + Add to list Kräutergarten Saatgut-Box S Bio (Holzbox) Wenn man nicht direkt mit dem Gemüseanbau starten möchte eignen sich Gartenkräuter für den perfekten Einstieg. Für Tees oder zum Kochen hat man direkt die passenden Zutaten im Garten. Die meisten Kräuter blühen außerdem schön und werden gerne von Bienen und Hummeln angeflogen. €24.95 Goto shop.saatgut-dillmann.de + Add to list Gartenkorb Der perfekte Korb für die Gemüseernte oder den Blumenstrauß. Macht sich auch in jeder Gartenlaube super als Dekoelement €6.86 Goto sostrenegrene.com + Add to list Holzkiste Eignet sich ideal zum Bepflanzen mit Kräutern oder Salat und ist gleichzeitig auch noch sehr dekorativ. Gartentipp: Immer an eine Drainage denken, damit das Gießwasser richtig abfließen kann. Bei Bepflanzung der Kisten am besten mit einem Vlies auslegen €10.98 Goto sostrenegrene.com + Add to list BIO Saatgut Hohes Eisenkraut (Verbena bonariensis) Eisenkraut macht sich wunderschön im Staudengarten und zieht viele Schmetterlinge an. Gartentipp: auch hier die Samenstände stehen lassen damit es im nächsten Jahr wieder kommt. €2.75 Goto biogartenladen.de + Add to list Gardol Hochbeetumrandung Die Beetrahmen gibt es in verschiedenen Größen. Sie können entweder als niedriges Beet verwendet - oder zu einem höherem Hochbeet gestapelt werden. €11.99 Goto bauhaus.info + Add to list Wilde Möhre (Saatgut) Die Wilde Möhre ist eine tolle Blühpflanze, die sich sehr gut im Garten verwildert. Sie wird von vielen Insekten angeflogen. Gartentipp: nach dem ersten Schnitt blühen die meisten Pflanzen ein zweites Mal, wenn man im nächsten Jahr mehrere Pflanzen haben möchte- einfach die Samenstände den Herbst über stehen lassen. €2.10 Goto kraeuter-und-duftpflanzen.de + Add to list Bellissa Holzrandsieb Das Sieb wird eigentlich zum Sieben von Erde verwendet - es eignet sich aber auch perfekt um Gartenkräuter oder Blumen zu trocknen. Bei Gartenkräutern für z.B. Tee etc, ist eine gute Belüftung beim Trocknen am wichtigsten. €19.95 Goto bauhaus.info + Add to list Esschert Gartenschere Die klassische Gartenschere ist wohl das wichtigste Werkzeug im Garten und gehört zu jeder Werkzeug-Grundausstattung zwingend dazu €16.90 Goto gartentraeume.com + Add to list Gießkanne Metall Eine Gießkanne kann man immer gebrauchen und in Metalloptik noch viel schöner €24.95 Goto bauhaus.info + Add to list Blumensamen 'Historische Kapuzinerkresse' Ich finde Kapuzinerkresse gehört in jeden Garten. Sie schmeckt nicht nur sehr gut und die Blüten eignen sich zum dekorieren von Salaten- sondern sie kann auch sehr dekorativ an Rabatten oder Zäunen ranken. Bei Manufactum gibt es Zusammenstellung von historischen Sorten. Gartentipp: nach der Blütezeit eignet sich die Kresse auch sehr gut zum Mulchen der Beete €17.90 Goto manufactum.de + Add to list dida Blumenpresse Bei Dida Seeds gibt es diese wunderschöne handgefertigte Blumenpresse. Ich konserviere so gerne mein Gartenjahr und rahme die gepressten Blüten ein. €35.00 Goto didaseeds.com + Add to list Garantia Komposter Thermo-Wood Wenn man eigenen Kompost anlegt hat man nicht nur Verwendung für den ganzen Grünschnitt/Laub sondern auch immer frische und nährstoffreiche Erde für Beete und Blumentöpfe! Der Komposter ist zwar optisch nicht der Kracher, aber kompostiert Dank seiner Thermofunktion super schnell. Nie wieder Erde schleppen ;) Gartentipp: den Kompost alle Tage gießen und wieder gut verschließen, das beschleunigt den Prozess. €99.95 Goto bauhaus.info + Add to list Bienenweide Region Nord-Ost (mehrjährig, 50 g) | Bienenwiese von Biobalu Eine Bienenwiese gehört einfach in jeden Garten. Der Großteil der Blumen ist mehrjährig und breitet sich schön im Garten aus. Nicht enttäuscht sein, wenn sich im Sommer noch nicht allzu viel zeigt: die meisten Mischungen blühen bis in den Spätherbst und kommen im zweiten Jahr umso prächtiger. €8.99 Goto samenhaus.de + Add to list Romantischer Blumengarten - Samen-Geschenkset | Sets & Geschenke - Samen & Saatgut Magical Gardenseeds hat ausgefallene Sorten und eine wunderschöne Verpackung- perfekt zum Verschenken €17.95 Goto magicgardenseeds.de + Add to list Dehner Metall-Hochbeet 'Münster 1' | Dehner Vor allem für kleinere Gärten eignen sich die Mini-Hochbeete perfekt für Gemüse oder Kräuter. Gartentipp: auch hier auf eine ausreichende Drainage achten, damit keine Staunässe entsteht. Ich lege z.B. immer ein Drainage aus Vlies und Kieselsteinen. €59.99 Goto dehner.de + Add to list SVARTRÅ Lichterkette (12), LED - schwarz/für draußen Outdoor-Lichterketten schenken dem Garten eine wunderschöne Abendstimmung €29.99 Goto ikea.com + Add to list Saatgut-Box "Gartenjahr" Wenn man mit dem Gemüsegärtnern anfangen möchte ist es immer von Vorteil ein umfassendes "Starterset" zu haben- diese Box deckt sogar das gesamte Gartenjahr ab und man hat bis in den Spätherbst eigenes Gemüse zum ernten. €44.90 Goto shop.rankwerk.de + Add to list Bin im Garten - Meike Winnemuth Anmerkung von Anika: Über dieses Buch sprechen wir kurz im Interview, deswegen steht es hier. Wer Lust auf einen eigenen (Schreber)garten bekommen, oder einfach ein schön zu lesendes Gartentagebuch durchs Jahr möchte: für die ist dieses Buch genau richtig. ISBN: 33-2810-815-7 €14.00 Goto genialokal.de + Add to list Bienenhotel Mit einem Bienenhotel trägt man viel zum Artenschutz bei und bietet ein Winterquartier. Hier sollte man immer auf eine saubere Verarbeitung des Holzes achten. Gartentipp: nach einer Weile prüfen, ob Vögel die verschlossenen Eingänge aufmachen und ggf. mit einem Gitter absichern. €32.00 Goto diestadtgaertner.de + Add to list 21 wishes'''
