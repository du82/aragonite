["https://wishlephant.com/blog/2024-09-15-ferdinand-lut"]
title = "Wishlephant - Blog - Rosa & Luis, POLLE und Q-R-T"
description = "Simple to use. No login required. Create a wish list in seconds. At no charge."
full_description = "Rosa & Luis, POLLE und Q-R-T 8 Fragen an Comiczeichner Ferdinand Lutz 15.09.2024 Erstmal für alle, die dich noch nicht kennen: Wer bist du und was machst du Schönes und was ist POLLE? Hallo, ich heiße Ferdinand Lutz, bin Comiczeichner und Verleger - und habe das große Glück, schon seit über fünf Jahren das POLLE Magazin zu gestalten und mit herauszugeben.POLLE zeigt Kindern die ganze Bandbreite des Comics: Lustige & ernste, kurze & lange Geschichten, in unterschiedlichsten Stilen und von den unterschiedlichsten Zeichner*innen aus aller Herren (und Frauen) Länder. Wie kamst du auf die Idee, ein Comic-Magazin für Kinder zu produzieren? Die Idee zu so einem Magazin hatte ich, weil mir aufgefallen ist, dass ich als Kind immer nur jede Woche das Micky Maus Magazin gelesen habe. Und ständig die gleichen Geschichten mit dem gleichen runden Disney Stil und der gleichen Disney Mentalität zu lesen, das macht etwas mit einem - besonders in so einer geschmacksprägenden Zeit wie der Kindheit. Gleichzeitig gab es in Deutschland vor POLLE keine Möglichkeit für Zeichner*innen, regelmäßig Comics für Kinder zu veröffentlichen, aus denen später dann evtl. Bücher werden können. Was ist das Schwierigste daran? Die Finanzierung. Wir bezahlen alle Künstler*innen so fair wie möglich, gleichzeitig gibt es in POLLE keine Werbung. Jedes normale Magazin hingegen finanziert sich durch Werbung. Wir haben glücklicherweise einige Förderabonnent*innen, die das etwas auffangen können, sowie kulturelle Partnerschaften wie z. B. das Institut français oder die Kanadische Botschaft. Was ist das Schönste? Die Zusammenarbeit mit diesen wunderbaren Zeichner*innen. Die Begeisterung unserer Leserschaft. Unsere Tochter wird dieses Jahr eingeschult und wir stecken ihr ein POLLE Abo in die Schultüte. Erinnerst du dich noch an die Geschenke deiner Einschulung oder etwas anderes von dem Tag? An eine glänzende Schultüte in grün-metallic mit roten Punkten. An ein Lineal aus irgendeinem Naturmaterial, das man biegen konnte. Welches Comic hast du bisher am meisten verschenkt? Offen gestanden: Meine eigenen. Weil ich davon immer sehr viele Belegexemplare bekomme (und mit neuen Auflagen dann immer noch mehr). Und POLLE! Was liest du gerade? Gerade lese ich ein Buch über die Entstehung von Büchern („Papyrus“ von Irene Vallejo). Auf unserer Wishlephant-Postkarte stehen drei lustig gemeinte Weihnachtswünsche von Eltern. Was würdest du ankreuzen? • Netflix und Chill statt Abwasch und Müll,• Schlafen Schlafen Schlafen• in einem Haushalt ohne Sand lebenMeine jüngstes Kind ist neun Monate alt: Schlafen, Schlafen, Schlafen.Danke, Ferdinand!"
