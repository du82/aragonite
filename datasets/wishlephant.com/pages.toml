["http://wishlephant.com/blog/2020-12-01-reprodukt-verlosung"]
title = "Wishlephant - Blog - Reprodukt - Verlosung"
description = """
In ihren UNERSCHROCKEN-Bänden portraitiert die französische Zeichnerin Pénélope Bagieu dreißig außergewöhnliche Frauen, die den gesellschaftlichen Zwängen ihrer Zeit trotzten, um das Leben ihrer Wahl zu führen. Uns Leser:innen begegnen bekannte Persönlichkeiten wie Josephine Baker oder Tove Jansson — die Schöpferin meiner geliebten Mumins! — aber auch solche Frauen, deren Lebensgeschichten eben nicht den Weg in irgendwelche Nachschlagewerke oder Geschichtsbücher gefunden haben, obwohl sie höchst bemerkenswert sind. Ich muss sagen, dass mich die Biographien im zweiten Sammelband besonders inspiriert und berührt haben. Klar, von Betty Davis und Peggy Guggenheim hatte ich schon gehört — aber wieso eigentlich nicht von der Banditenkönigin Phoolan Devi, der Rapperin Sonita Alizadeh oder der Aktivistin Naziq al-Abid?! Die Kapitel über diese Frauen benennen prägnante Leerstellen und machen schmerzhaft deutlich, dass wir von ihren Lebensgeschichten wissen sollten. 
In ihrem Buch CALIFORNIA DREAMIN' erzählt Pénélope Bagieu übrigens auf 280 Seiten aus dem Leben von Ellen Naomi Cohen, die als Cass Elliot  mit ihrer Band The Mamas and the Papas einen recht holprigen und steilen Weg zum Erfolg beschritt — auch sehr lesenswert, finde ich!"""
full_description = '''Reprodukt - Verlosung 01.12.2020 Viele wissen ja schon, dass wir Riesenfans von Reprodukt sind. Bei Anika im little village gibt es sogar einen Pop Up Store mit den schönsten Reprodukt-Comics für kleine und Große. Anlässlich zur Vorweihnachtszeit, in der viel Arbeit wieder auf den Schultern von Frauen und besonders Müttern lastet (so wie überhaupt das ganze Pandemie-Jahr 2020), wollen wir nochmal ein paar tolle Frauen feiern. Und zwar the only way we know how to: Mit Büchern! Mit den Comics die sie geschrieben haben, bzw. tolle Comics, die über ihre fantastischen Leben geschrieben wurden. Dazu hat Mona, die den Vertrieb bei Reprodukt leitet, uns eine herzliche Empfehlungsliste geschickt, die wir euch unten verlinkt haben. Und weil ja auch bald Weihnachten ist, gibts noch eine Überraschung: Wir verlosen auf Instagram den ersten Band von “Unerschrocken”, den wirklich jede:r gelesen haben solle. Bis zum 3. könnt ihr noch mitmachen, dann kommt das Buch mit ganz viel Glück noch rechtzeitig zum Nikolaus bei euch zuhause an. Mitmachen! Unerschrocken – 2 Bände im Schuber In ihren UNERSCHROCKEN-Bänden portraitiert die französische Zeichnerin Pénélope Bagieu dreißig außergewöhnliche Frauen, die den gesellschaftlichen Zwängen ihrer Zeit trotzten, um das Leben ihrer Wahl zu führen. Uns Leser:innen begegnen bekannte Persönlichkeiten wie Josephine Baker oder Tove Jansson — die Schöpferin meiner geliebten Mumins! — aber auch solche Frauen, deren Lebensgeschichten eben nicht den Weg in irgendwelche Nachschlagewerke oder Geschichtsbücher gefunden haben, obwohl sie höchst bemerkenswert sind. Ich muss sagen, dass mich die Biographien im zweiten Sammelband besonders inspiriert und berührt haben. Klar, von Betty Davis und Peggy Guggenheim hatte ich schon gehört — aber wieso eigentlich nicht von der Banditenkönigin Phoolan Devi, der Rapperin Sonita Alizadeh oder der Aktivistin Naziq al-Abid?! Die Kapitel über diese Frauen benennen prägnante Leerstellen und machen schmerzhaft deutlich, dass wir von ihren Lebensgeschichten wissen sollten. In ihrem Buch CALIFORNIA DREAMIN' erzählt Pénélope Bagieu übrigens auf 280 Seiten aus dem Leben von Ellen Naomi Cohen, die als Cass Elliot mit ihrer Band The Mamas and the Papas einen recht holprigen und steilen Weg zum Erfolg beschritt — auch sehr lesenswert, finde ich! Goto reprodukt.com + Add to list Die Vunderwollen Dieses wunderschöne Buch mit feinen Aquarellzeichnungen ist mein absoluter Liebling aus unserem aktuellen Programm: Die Autorin Camille Jourdy erzählt von der kleinen Jo, die von ihrer Patchworkfamilie so sehr genervt ist, dass sie sich beim gemeinsamen Campingausflug in den Wald davonstiehlt. Dort trifft das Mädchen auf ein Königspaar in Zwergengröße, dem es arglos folgt und kopfüber in ein Abenteuer stolpert, in dem noch viele weitere wundersame Wesen auftauchen. Wir begegnen sprechenden Füchsen und Katzen, Kobolden, Zyklopen, einem sechsbeinigen Hund und den mysteriösen Vunderwollen — das sind übrigens regenbogenfarbige Ponies, die in Alliterationen sprechen. Besonders lustig finde ich die gerupften Hühnchen, die im Dienst des gemeinen Katers stehen, der als tyrannischer Kaiser sein Volk unterdrückt und gegen den Jo und ihren Mitstreiter:innen mutig in den Kampf ziehen... Eine ziemlich turbulente Geschichte, mit viel Witz und wahnsinnig sympathischen Figuren bestückt. Einfach toll! Das Buch macht bestimmt kleinen und großen Leser:innen gleichermaßen viel Spaß - ich würde es ab 8 Jahren empfehlen. Goto reprodukt.com + Add to list Skim Die kanadischen Cousinen Mariko und Jillian Tamaki machen gemeinsam brillante Comics und seitdem ich den Band EIN SOMMER AM SEE von den beiden gelesen habe, bin ich großer Fan. In ihren Büchern erzählen sie von heranwachsenden Mädchen, von Liebe, Verunsicherung, Freundschaften, Schule — von Teenageralltag eben. Und das tun sie auf so eine authentische und berührende Art und Weise, dass ich mich noch lange nach dem Lesen mit den Figuren der Geschichten verbunden fühle. So ging es mir auch mit dem fiktiven Tagebuch von SKIM, dem ersten gemeinsamen Werk der Cousinen. Skim ist 16, besucht eine private Mädchenschule und während ihre Mitschüler:innen den plötzlichen Selbstmord eines Mitschülers zu verarbeiten versuchen, hat Skim ihre ganz eigenen Probleme: Ihre beste Freundin nervt, sie fühlt sich allein, verliebt sich im Laufe der Geschichte in ihre Englischlehrerin und sucht Halt in der Hexenreligion Wicca. Die Figuren der Geschichte sind dabei so selbstverständlich angelegt, dass alle Fiktionalität in den Hintergrund tritt. Goto reprodukt.com + Add to list Julie Doucets allerschönste Comic Strips Die Zeichnerin Anna Haifisch (noch eine dringende Empfehlung!) hat mal über Julie Doucet gesagt, sie sei die Königin der Independent Comics. Und das ist sie! Julie Doucets DIRTY-PLOTTE-Hefte sind mir das erste Mal wohl Ende der 1990er Jahre begegnet, in irgendeinem Hamburger Comicladen lagen sie rum, ich blätterte hinein und war geschockt. Dass eine Comiczeichnerin es wagte, in autobiographischen Strips von Sex, Menstruation, eigener Lust und ihren intimsten Träumen zu erzählen und diese auch noch explizit zu zeichnen, konnte ich kaum fassen. Zwischen all den Independent Comics, die aus rein männlicher Perspektive erzählten, war sie eine Offenbarung! Julies Comics sind oft derb, schonungslos, wahnsinnig witzig und gleichzeitig berührend verletzlich. In diesem Jahr haben wir einen Sammelband ihrer frühen Arbeiten herausgebracht, der eine der wichtigsten Comiczeicherinnen überhaupt würdigt. Julie Doucet ist eine Comic-Legende und Vorreiterin für viele Zeichner:innen, die nach ihr kamen und das Bild der Kunstform verändern sollten. Goto reprodukt.com + Add to list Girlsplaining Dieser sympathische Band versammelt Comic-Essays der Berliner Autorin Katja Klengel, die zunächst auf Broadly, dem feministischen Online-Portal des Vice-Magazins, veröffentlicht wurden. Mit schonungsloser Offenheit und viel Humor erzählt Klengel darin von ihren persönlichen Erfahrungen und vermeintlichen Unzulänglichkeiten – und davon, welchen absurden Erwartungshaltungen Mädchen und Frauen in unserer Gesellschaft ausgesetzt sind. Es geht um die Angst vor der Vulva, angeblich unweibliche Körperbehaarung, schambehaftetes Menstruationsblut, weibliche Orgasmen, gegendertes Spielzeug und neben zahlreichen popkulturellen Bezügen ist auch eine gehörige Portion Nerdiness dabei. Fantastisch wird es, wenn Katja Klengel den Geist der verrosteten Rasierklingen auftreten lässt — die bezahnte Vagina, die Freud'sche "Vagina dentata", konnte sich allerdings nur ein Mann ausdenken... Goto reprodukt.com + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.) P.S. Ihr könnt die Bücher über den “kopieren” - Button gleich auf eure rüber kopieren, wenn sie euch gefallen. Oder sogar auch die gesamte Liste!'''
