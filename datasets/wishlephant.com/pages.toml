["http://wishlephant.com/wishlists/2a460e93-0377-417f-a3ab-339e41e7e82b"]
title = "Wishlephant - Die schönsten Winter- und Weihnachtsbücher für Kinder - von Karina"
description = "Die gelernte Buchhändlerin und Kinderbuchliebhaberin Karina @polly.lux empfiehlt uns die schönsten Vorlese- und Bilderbücher zum Einmuckeln im Winter."
full_description = 'Die schönsten Winter- und Weihnachtsbücher für Kinder - von Karina by Wishlephant Die gelernte Buchhändlerin und Kinderbuchliebhaberin Karina @polly.lux empfiehlt uns die schönsten Vorlese- und Bilderbücher zum Einmuckeln im Winter. Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Elli, die Kleinste von allen Hoch oben auf den Bergen Tibets lebt eine Yak-Herde und unter ihnen ist die kleine Elli. Elli ist nicht nur klein, sie ist die Kleinste von allen und darüber sehr unglücklich. Wie gerne würde sie so groß und stark und schnell sein wie die anderen, denn nur ein großes Yak kann wirklich etwas Großes vollbringen! Doch dann passiert etwas, wo nur die kleine Elli helfen kann… Eine gereimte Mutmach-Geschichte mit wundervollen Illustrationen für Kinder ab ca. 2 Jahren. ISBN: 978-35-2245-962-4 €14.00 Goto genialokal.de + Add to list Die Eisreise Die Freunde Ida, Max und Jock erkunden gemeinsam die winterliche Natur. Am Vogelbeerbach glauben sie, Otterspuren entdeckt zu haben und betreten das Eis. Zuerst knackt es nur ein bißchen, doch dann löst sich die Eisscholle und treibt den Fluss entlang - auf ihr die drei Freunde. Ein großes Abenteuer beginnt! Es geht bis hinaus in den eisigen Ozean, zu den Pinguinen, durch Sturm und Eis, mit großem Heimweh und Fischbällchen im Gepäck. Eine aufregende Geschichte über Mut, Freundschaft und Zusammenhalt. Natürlich wunderschön illustriert. Für Kinder ab 5-6 Jahren. ISBN: 978-34-2364-085-5 €14.95 Goto genialokal.de + Add to list So ist der Winter Wenn alles mit einer weißen Schneedecke bedeckt ist, dann ist Winter. Dann kann man den Schnee tauen lassen und ihn wieder einfrieren, Hügel runterrodeln oder bei einem kalten Sturm in der warmen Stube sitzen und durch ein Fenster schauen. Eine achtsame Geschichte über die kalte Jahreszeit, die von den kleinen Freuden lebt. Und (ich weiß, das sage ich bei fast jedem Buch, aber stimmt wirklich): wunderschön illustriert! Für Kinder ab 3 Jahren. ISBN: 978-38-5581-564-7 €12.95 Goto genialokal.de + Add to list Ein Apfel für alle Es ist Winter und der Hase im Wald hat Hunger. Als er einen einzelnen Apfel oben im Baum hängen sieht, ist die Freude groß - doch leider scheint er unerreichbar. Zusammen mit der kleinen Maus, dem verschnupften Fuchs und schließlich mit dem Bären, der eigentlich schon schläft, versucht der Hase, an den Apfel zu gelangen. Eine rührende Geschichte über Freundschaft und Zusammenhalt, wunderschön illustriert., für Kinder ab 2 Jahren. ISBN: 978-38-6566-344-3 €10.00 Goto genialokal.de + Add to list Weihnachten mit Thomas Müller Thomas Müller, Teddy und vollwertiges Familienmitglied der Wortmanns aus Hamburg, geht am Heiligabend irgendwo im Karstadt in der Mönckebergstraße verloren. Da er kein Bargeld dabei hat, misslingt sein Versuch, sich mit einem Taxi nach Hause fahren zu lassen. Also setzt er sich an den Brunnen vorm Burger King und hofft, dass seine Familie ihn holen kommt. Die lässt aber erst einmal auf sich warten und stattdessen taucht eine ominöse Katze in der Dunkelheit auf… Eine ulkige Hamburg- und Weihnachtsgeschichte, warmherzig und dramatisch erzählt von der grandiosen Karen Duve. Für Kinder ab ca. 7/8 Jahren und alle Erwachsenen! ISBN: 978-38-6971-130-0 €10.00 Goto genialokal.de + Add to list Gebrannte Mandeln für Grisou Der Graupapagei Grisou, der bei einer Menschenfamilie zuhause ist und auch ein bisschen Menschisch spricht, hat schon viel über den sogenannten Weihnachtsmarkt gehört. Er ist ganz neugierig darauf und würde ihn so gerne einmal besuchen. Besonders die gebrannten Mandeln möchte er gerne einmal probieren, denn die müssen unglaublich köstlich sein. Als zwei Tage vor Weihnachten das Küchenfenster offensteht, nutzt er die Gelegenheit und begibt sich auf die Reise. Eine ungewöhnliche Weihnachtsgeschichte mit einem abenteuerlichen kleinen Helden. Für Kinder ab 4 Jahren. ISBN: 978-38-6429-477-8 €15.00 Goto genialokal.de + Add to list Polly hilft der Großmutter Die kleine Polly lebt gemeinsam mit ihrer Großmutter in einem hübschen kleinen Häuschen. Die Großmutter kocht Bonbons und verkauft sie jeden Samstag auf dem Markt. Doch eines Tages rutscht sie auf dem Fußboden aus und stürzt - ausgerechnet jetzt, so kurz vor Weihnachten! Nun liegt es an Polly, die Bonbons zu verkaufen und alles herzurichten. Eine zauberhafte Geschichte über das Miteinander, das Helfen und das Selbstständigsein. Für Kinder ab 3-4 Jahren. ISBN: 978-37-8915-532-1 €13.00 Goto genialokal.de + Add to list Advent im Holunderweg Im Holunderweg 7 ist immer etwas los. Zur Weihnachtszeit ist es besonders spannend und so können es die allerbesten Freunde Ida, Lennart, Ella, Malte und Bruno kaum aushalten, bis der Heilige Abend endlich vor der Tür steht. Mit allerlei Ideen schaffen sie es jedoch, sich die Wartezeit etwas erträglicher zu gestalten. Ein Geschichten-Adventskalender für (Vor-)Schulkinder und gemütliche Abende auf dem Sofa, mit dem gewissen Bullerbü-Gefühl. ISBN: 978-35-2263-066-5 €9.99 Goto genialokal.de + Add to list Ein Tag im Schnee Als Peter eines Morgens aufwacht und aus seinem Fenster blickt, ist alles von einer weißen Schneedecke umhüllt. Sofort nach dem Frühstück macht er sich auf den Weg nach draußen, um den Schnee zu erforschen. Er hinterlässt unterschiedliche Spuren auf den Wegen, formt Schneeengel und baut einen Schneemann. Damit er am nächsten Tag auch noch etwas vom Schnee hat, steckt er sich vorsichtshalber einen Schneeball in seine Manteltasche, ehe er wieder zurück ins warme Haus geht. Eine farbenfroh illustrierte kleine Geschichte über das Glück des ersten Schnees, schon für ganz junge Leser. ISBN: 978-39-6843-016-4 €19.95 Goto tebalou.shop + Add to list Ole Winterwicht Ole Winterwicht versorgt die Tiere im Wald mit kleinen Gaben - er denkt an das Reh, die Maus und den Hasen. Und als alle versorgt sind, macht er sich auf den Weg nach Hause, wo er sich ein leckeres Abendbrot kocht und schließlich zufrieden einschläft. Eine ruhige und kurze Geschichte vom Schenken und auf sich Acht geben, schon für die Allerkleinsten. ISBN: 978-38-2515-205-5 €8.00 Goto genialokal.de + Add to list 10 wishes'
