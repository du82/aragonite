["https://wishlephant.com/blog/2021-12-03-buuuch"]
title = "Wishlephant - Blog - buuu.ch Empfehlungen: Die Lieblings-Kinderbücher des Jahres - von Carla"
description = """
Eine queere Graphic Novel für Kinder ab 10 Jahren. Gelungen ist nicht nur die
ganze Geschichte, sondern auch dass die Tatsache, dass Tuva sich in ein Mädchen
verliebt, unaufgeregt und nicht problematisierend erzählt wird."""
full_description = "buuu.ch Empfehlungen: Die Lieblings-Kinderbücher des Jahres - von Carla 03.12.2021 Für alle, die dich noch nicht kennen: Wer bist du und was machst du? Ich bin Carla, Vorleserin zweier Kinder (sie sind 5 und 10), Grundschullehrerin und Kinderbuchinfluencerin. Ich bespreche und empfehle für den von mir mitgegründeten Gemeinschaftsblog buuu.ch, für das Missy Magazine und für meinen neuen Podcast DIVERSE KINDERBÜCHER vielfältige und klischeefreie Kinder- und Jugendbücher. Abgesehen davon trinke ich gerne Kaffee und spiele Animal Crossing. Erzähl gern mehr zu buuu.ch - und wofür stehen eigentlich die drei uuus? Der Blog wurde 2012 von Eltern, die sich auf Twitter auf der Suche nach nicht doofen Kinderbüchern gefunden haben, gegründet. Wir wollten unsere Empfehlungen gerne sammeln um anderen Familien das Leben zu erleichtern. Auf gute, vielfältige und klischeearme Kinderbücher stößt man in der Regel selten zufällig, vielmehr muss man gezielt danach suchen. Henning hat damals spontan buuu.ch reserviert, weil er den Domain-Witz gut fand und es kurz und bündig und leicht zu merken ist. Die Schweizer Endung sorgt allerdings immer noch vielerorts für Verwirrung, schließlich bin ich (und der Großteil der anderen Leute, die aktuell für buuu.ch rezensieren) aus Österreich. Du bist jetzt Podcastgame eingestiegen - wenn du allen neuen Hörer:innen eine Folge ans Herz legen könntest, welche wäre es? Ganz ehrlich, ich finde man sollte jede Folge einzelne Folge hören! Die erste Episode, in der es ganz grundsätzlich um Vielfalt geht, ist ein guter Einstieg, das Thema zieht sich aber sowieso durch jede einzelne Folge. Besonders gelungen finde die Episode zum Thema Körper und Body Positivity bzw. Body Neutrality. Auch das Thema Weltall gibt viel mehr her, als man im ersten Moment meinen könnte und richtig hörenswert ist das Interview mit Astronautin und Klima- und Wetteforscherin Insa Thiele-Eich, die nebenbei ein Buch für Erstleser_innen geschrieben hat. Ihre Perspektive auf Kinderbücher zum Thema Klimawandel ist sehr interessant. Für die Aufklärungsfolge erzähle ich über den Paradigmenwechsel, der sich in den letzten Jahren in diesem Bereich vollzogen hat, da ist sicher für viele was Neues dabei. Unsere Tochter wird bald 4 Jahre alt - welches Buch sollten wir ihr zum Geburtstag schenken? Ich mag die Bücher aus der Reihe „Der kleine Fuchs liest vor“ total gerne. Selten wird in Vorlesegeschichtenbücher Diversität so gut miterzählt, während gleichzeitig die Tatsache nicht groß hervorgehoben Wird. Mein 5jähriger liebt auch das Kita-Wimmelbuch von Constanze von Kitzing und super Bilderbücher gehen eh immer, zum Beispiel Überall Popos, Pokko und die Trommel oder Hier kommt Harry. Wie kann man euch unterstützen? Am Besten, in dem ihr buuu.ch lest, DIVERSE KINDERBÜCHER hört und weiterempfehlt. Likes und Shares auf Instagram sind auch immer gut. Es gibt außerdem auf Steady die Möglichkeit buuu.ch zu unterstützen und auf Bigcartel hübsches Merch zu kaufen. Da kommt in nächster Zeit einiges neues! Ihr könnt mich auch jederzeit für Buchgespräche oder Vorträge (für Eltern, Pädagog_innen oder andere Multiplaktor_innen buchen. Meine Lieblingsbücher des Jahres Ich empfehle es, Bücher bei unabhängigen Buchhandlungen zu kaufen, egal von lokal und vor Ort (konkret empfehlen kann ich Chicklit in Wien, SheSaid in Berlin und tebalou im Internet). Was auch cool und noch nachhaltiger ist: Man kann bei Büchereien Anschaffungsvorschläge machen, sehr oft werden Bücher dann angekauft. Danke für das Interview, liebe Carla. Die megatollen Tipps hab ich mit schon alle auf die Liste für meine Tochter kopiert! Und danke für die tolle Resource, die ihr geschaffen habt. Buuu.ch ist eine ganz tolle Inspirationsquelle für alle Eltern. Wenn ihr mehr lesen wollt, folgt unbedingt @buuu.ch auf Instagram und abonniert den Blog und den Podcast! Hier kommen jetzt Carlas Lieblinge aus diesem Jahr, viel Spaß beim Stöbern: Regenbogentage Eine queere Graphic Novel für Kinder ab 10 Jahren. Gelungen ist nicht nur die ganze Geschichte, sondern auch dass die Tatsache, dass Tuva sich in ein Mädchen verliebt, unaufgeregt und nicht problematisierend erzählt wird. ISBN: 978-39-5470-253-4 Goto genialokal.de + Add to list Gib mir mal die Hautfarbe Eine wichtige rassismuskritische Ressource, für alle, die mit Kindern zu tun haben. Wenn man einen Erziehungsratgeber unbedingt lesen sollte, dann diesen. Goto tebalou.shop + Add to list Das ist auch meine Welt Wer alt genug ist, Verantwortung für den eigenen ökologischen Fußabdruck übernehmen zu sollen, ist auch alt genug um zu erfahren, welche globalen Verstrickungen hinter unserem Essen, unserem Konsum, unserem Verkehr und unserer Energiegewinnung stecken. Dieses Buch macht das Komplexe für Kinder durch kurze und knappe Sachinfos und kleinteilige Illustrationen konkret. Es vermittelt allerdings nicht nur Fakten, sondern auch liefert Argumente – und Gegenargumente. ISBN: 978-34-0775-857-6 Goto genialokal.de + Add to list Antennenkind Köbi ist ein Kind, dem die Welt viel zu laut ist. Er hört alles – und das ist meistens mehr, als er hören will. Eine einfühlsames und liebenswürdiges Buch über ein hochsensibles Kind und seine Umfeld ISBN: 978-37-1174-022-9 Goto genialokal.de + Add to list Das geheime Leben der Popel Ein supergut aufbereitetes Sachbuch mit witzigen Illustrationen, rund ums Thema Nasenschleim, Rotze, Popel, you name it.– lesenswert für die ganze Familie. ISBN: 978-39-5728-464-8 Goto genialokal.de + Add to list Alles Arbeit, oder was?! Was meint das eigentlich dieses “arbeiten gehen”? In dem Buch gehts nicht nur um Berufe sondern das Thema Arbeit wird aus vielen verschiedenen Perspektiven beleuchtet. Macht arbeiten Spaß? Ist betteln die Arbeit des Bettlers? Arbeiten nur die Erwachsenen und gibt es für besonders wichtige Arbeit besonders viel Geld? Spannend, informativ und vielschichtig. ISBN: 978-34-0775-499-8 Goto genialokal.de + Add to list Sulwe Die mexikanisch-kenianische Schauspielerin und Aktivistin Lupita Nyong’o hat mit diesem Buch ihre persönlichen Erfahrungen mit Colorism niedergeschrieben und ist somit im deutschsprachigen Raum eine der ganz wenigen Ressourcen zum Thema. Darüber hinaus empowert das damit Kinder, die die gesellschaftliche Vorrangstellung von helleren Hauttönen am eigenen Leib spüren und aufgrund ihres dunklen Hauttons benachteiligt werden. ISBN: 978-39-4823-018-0 Goto genialokal.de + Add to list Kleidung ist für alle da! Dieses Buch schließt eine Lücke zwischen öden Kinderbüchern, in denen es vor Klischees und Stereotypen nur so wimmelt und welchen, die diese zwar aufbrechen wollen, das Ganze aber trotzdem erstmal problematisieren (und somit verfestigen), bevor sie zum Punkt kommen. Die Botschaft ist klar und simpel: Es gibt keine Jungs- und Mädchenkleidung! ISBN: 978-39-4931-508-4 Goto genialokal.de + Add to list SAMIRA und die Sache mit den Babys In diesem Aufklärungsbuch wird Intersektionalität auf allen Ebenen mitgedacht. Absolut zeitgemäß und ohne Klischees und Mythen! Feministische Aufklärung für mit viel Gefühl und Herz und für alle! ISBN: 39-4925-801-9 Goto tausendkind.de + Add to list Ein kleiner blauer Punkt Ein kleiner blauer Punkt ist eine liebenswürdige und warmherzige Sachgeschichte, die sich dem spannenden und komplexen Thema Sonnensystem auf eine anschauliche Art widmet, aber auch eine Erzählung übers Einzigartig sein. ISBN: 978-37-3486-001-0 Goto genialokal.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)"
