["http://wishlephant.com/wishlists/dfc80d27-54cc-4f8e-8f7b-4c7719340456"]
title = "Wishlephant - Besondere Buchgeschenke für Kinder ab Sechs von Johanna"
description = "Johanna @hey.jojo.yeah hat für euch ein paar tolle Büchergeschenke für größere Kinder zusammengestellt. Hier kommt ihr zum Interview mit ihr."
full_description = 'Besondere Buchgeschenke für Kinder ab Sechs von Johanna by Wishlephant Johanna @hey.jojo.yeah hat für euch ein paar tolle Büchergeschenke für größere Kinder zusammengestellt. Hier kommt ihr zum Interview mit ihr. Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Emma Thompson / Axel Scheffler: Jims brillante Weihnachten Unser Familien-Weihnachtsbuch dieses Jahr. Mischlingshund Jim soll für seinen Besitzer die erste serienmäßig produzierte Weihnachtskarte an Queen Victoria übergeben und sorgt dabei für ordentlich Trubel. Mit britischem Flair und Augenzwinkern erzählt Emma Thompson (übersetzt von Anu Stohner) eine ganz besondere, auf wahren Begebenheiten beruhende Geschichte. Dazu die Illustrationen von Axel Scheffler - herrlich! €17.00 Goto beltz.de POLLE Für alle Comic-Fans ab 7 Jahren ist zweimal im Jahr ein Jubeltag: Wenn die neue Polle, randvoll mit tollsten Kindercomics von großartigen Künstler*innen im Briefkasten liegt. €12.00 Goto pe-ri-dot.com Timothée de Fombelle: Hinter dem Schnee Drei Wege kreuzen sich in dieser berührenden Geschichte am Weihnachtsabend. Ein Eiswagenfahrer ist auf dem Heimweg von Italien nach England, eine Schwalbe möchte den Winter sehen und fliegt Richtung Norden und ein Unbekannter reist alleine und heimlich. Über Schicksal, Nächstenliebe und Hilfsbereitschaft. Für Kinder ab 10 Jahren und für Erwachsene. €18.00 Goto genialokal.de Glow – Das wundersame Leuchten der Natur Was für ein Sachbuch! Ob in der Tiefsee oder im Wald - Biolumineszenz heißt das Phänomen, das es überall auf der Erde schimmern und strahlen lässt. Die leuchtenden Illustrationen auf dunklem Grund von Jennifer N.R. Smith ziehen sofort in ihren Bann und machen Lust darauf, tief in die Welt der Biolumineszenz einzutauchen. Für Neugierige ab 8 Jahren. €20.00 Goto genialokal.de Mimi, Jakob und die sprechenden Hunde Jakob verbringt seine Ferien bei seiner Cousine Mimi in der Moskauer Vorstadt, einem heruntergekommenen Stadtteil von Riga, in dem auch ein Rudel sprechender Hunde wohnt. Als einer der Hunde verschwindet und ein skrupelloser Immobilienhai das Viertel gentrifizieren möchte, beschließen Mimi und Jakob die Moskauer Vorstadt zu retten. Ein Kindercomic ab 6 Jahren, der wichtige gesellschaftliche Themen mit viel Humor vermittelt. €14.00 Goto reprodukt.com Saša Stanišić, Regina Kehn (Illustrationen): Wolf Zwei Außenseiter treffen beim Ferienlager im Wald aufeinander - einer wird zum Opfer der lauten Mehrheit, der andere ist zunächst froh, aus der Schusslinie zu sein. Ein mutmachendes Buch mit Herzenswärme und Humor für alle Kinder, die ihren Platz suchen. €14.00 Goto genialokal.de Torben Kuhlmann: Die graue Stadt Mit ihrem gelben Regenmantel ist Robin der einzige Farbtupfer in der Stadt. Sie scheint allein zu sein mit ihrer Liebe zu den Farben. Doch sie findet Verbündete und mit ihnen einen Weg aus dem Grau. Detailreich und unglaublich atmosphärisch illustrierte Geschichte über den Mut, anders zu sein. Ab 8 Jahren. €20.00 Goto genialokal.de Laura Scharf: Das Geheimnis von Nox 1: Licht, Schatten - Flederratten! Auftakt einer neuen, fantastischen Buchreihe rund um den Tagling Fill, der sich plötzlich in Nox, dem Land der Nacht, wiederfindet. Hier herrschen ewige Dunkelheit und die Wesen der Nacht. Mit dem Nachtling-Mädchen Issa erlebt Fill dort die spannendsten Abenteuer. Für alle ab 10 Jahren, die nicht nur Nervenkitzel suchen, sondern beim Lesen auch viel Lachen möchten. €14.00 Goto genialokal.de Oliver Jeffers: Da ist ein Gespenst im Haus Ein Mädchen ist überzeugt, dass es in ihrem Haus spukt - doch egal, wo sie auch sucht, sie findet kein Gespenst. Und wir Lesenden? Können auf den transparenten Seiten auf unsere eigene Gespenstersuche gehen. Genial gemachter Bilderbuchspaß, der auch größere Kinder in seinen Bann zieht. €24.00 Goto genialokal.de Minna Melone - Wundersame Geschichten aus dem Wahrlichwald Im Wahrlichwald geht alles seinen gewohnten, beschaulichen Gang. Bis eines Tages Wanderratte Minna Melone mit ihrem Zurkuswagen auftaucht und den Tieren des Waldes allabendlich die abenteuerlichsten Geschichten erzählt. Ein Vorlesebuch für Kinder ab 6 Jahren, das die Kraft der Phantasie feiert. €14.00 Goto genialokal.de 10 wishes'
