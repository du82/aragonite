title = "Wishlephant - Linoldruck - erste Schritte"
description = "Check out this awesome list of presents!"
full_description = 'Linoldruck - erste Schritte by Wishlephant Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Abig Linolschnittwerkzeug Goto modulor.de + Add to list Versa Color Pigment Stempelkissen, Farbmix Tipp: wenn ihr fertig mit Stempeln seid, und die Farben sich etwas gemischt haben, danach die Farben einzeln kurz mit einem feuchten Tuch (oder Feuchttuch) abwischen, dann werden sie wieder sauber. Goto modulor.de + Add to list Paper Poetry Pigment Stempelkissen, Neon NEON Stempelkissen!! 🤩 Goto modulor.de + Add to list Factis Stempelgummi weich (blau) Perfekt, um anzufangen. Das Gummi ist längst nicht so fest wie die Linolplatten und sehr easy zu schneiden. Auch schon für Kinder. € 2,30 Goto modulor.de + Add to list Kreativset „Der Druck“ | Papier Wer dann doch mal Lust hat, mit Linolfarbe und Farbwalze zu drucken: dieses Set finde ich echt toll, auch vom Preis her. Inklusive Walze, Schnittwerkzeug, Platte und Farbe! Mega. €27.75 Goto kinderkunsthaus.de + Add to list Schmincke Linoldruckfarbe Cyan Aqua Metalltube 35 ml, Cyan Wer schon ein paar Sachen zuhause hat, und/oder kein Set kaufen möchte: Ich habe mit dieser Farbe zu Drucken angefangen und finde sie wunderschön - für Stempel und Linolplatten. Und sie lässt sich auch super mit Wasser abwaschen. Goto modulor.de + Add to list Farbwalze b = 60 mm, ø 26 mm ich hab diese einfache Walze hier und bin ziemlich zufrieden, richtige Größe für Stempel und kleine Linolplatten € 6,50 Goto modulor.de + Add to list Abig Handreiber Buche mit Filzauflage Das ist wirklich nur was für Linoldruck, bei den Stempeln verwischt man sich den Druck, weil der zu weich und beweglich ist. Auch für Linoldruck zum Anfang nicht wichtig, das kriegt man auch mit den Händen oder kleinem Nudelholz etc. hin. Aber an sich finde ich das ganz toll, schon allein zum Anfassen und wie schön sich das Ausstreichen lässt. Goto modulor.de + Add to list Linoplatte Soft 3 x 100 x 150 mm Ich benutze diese gerade und bin mit diesem Softheits-Grad ziemlich zufrieden. Man hackt nicht auf komplett festen Platten rum, aber es hat genug Festigkeit, um mehr Details einzuarbeiten als bei den Stempelgummis. Goto modulor.de + Add to list 9 wishes'
