title = "Wishlephant - Blog - Über Elterncomics und Kindheitsträume: Annette vom Jaja Verlag"
description = """
Sowas von treuer Klassiker und beliebtester Jaja-Kalender ist der Familienplaner
von Marie Geißler. Auch für das kommende Jahr gibt es ihn wieder frisch, putzig und einmalig illustriert und ideal für eine 5-köpfige Familie, die Alltag und Freizeit vorausschauend plant."""
full_description = 'Über Elterncomics und Kindheitsträume: Annette vom Jaja Verlag 05.12.2019 Heute stellen wir euch einen ganz tollen unabhängigen Verlag für illustrierte Machwerke vor. Den Jaja Verlag. Wir haben mit der Gründerin Annette über Kindheitsträume, Vorfreude auf 2020 und ihren Gründungsweg gesprochen. Am Ende hat sie uns noch ein paar ausgesuchte Empfehlungen aus eigenem Hause für Eltern verraten. Viel Spaß beim Lesen! Kannst du uns kurz deine Gründungsgeschichte erzählen? Ich habe Kommunikationsdesign studiert und mir nach dem Diplom erstmal einen Arbeits- und Schaffensraum eingerichtet, das ist bis heute die Musenstube, in der neben mir weitere meist illustrierende Kreative arbeiten. Neben den Auftragsjobs blieb mein großes Steckenpferd immer das Zeichnen und ich teilte diese Freude jahrelang mit Gleichgesinnten bei den jährlichen Skizzenfestivals. Die Musen in der Musenstube, unsere Gäste, Freunde, Kollegen, all die SkizzenfestivalzeichnerInnen, das war ein ganz schön großer Kreis von kreativen Menschen, die mich umgaben und von denen hatten viele unveröffentlichte Comicgeschichten und großartige Zeichnungen in ihren Schubladen liegen. Ich wollte also einfach, dass diese Schätze das Licht der Welt erblicken und mehr gesehen und gewertschätzt werden. Und die Idee, einen Verlag zu haben, die lag auch schon seit Kindheitstagen in MEINER Ideen-Schublade. Also, so konnte es losgehen. Was macht den Jaja Verlag so besonders? Durch Jaja bekommen ganz unbekannte, junge IllustratorInnen oder ComiczeichnerInnen die Chance, etwas zu veröffentlichen. Und einige starten dann voll durch und dann kann ich stolz sein auf sie. ;) Und was mir am Besten gefällt an Jaja: Dass alle AutorInnen und ZeichnerInnen zusammen wie eine coole Familie funktionieren und wenn wir uns an diversen Events treffen, dann haben wir immer eine gute Zeit. Möchtest du was zu deinen Empfehlungen erzählen? Aus dem Jaja-Kosmos habe ich jetzt nur ein paar besonders familienfreundliche Bücher ausgesucht, für Eltern, für Kinder und unsere Kalender für 2020, weil das schon bald ist! Auf unserer Postkarte haben wir drei Wünsche, die man sich als Eltern für Weihnachten wünschen könnte, welchen Wunsch würdest du ankreuzen? Mein Sohn ist eben 17 geworden, der kann schon lang allein aufs Klo. Bedeutet der letzte Wunsch, dass ich Netflix und Chill mache, während der Sohn Abwasch und Müll klarmacht? Das wär ja mal was… Worauf freust du dich in 2020? Am meisten auf den Comicsalon Erlangen! Und wenn wieder Frühling wird… Die Empfehlungen aus dem Jaja Verlag Familienplaner 2020 Sowas von treuer Klassiker und beliebtester Jaja-Kalender ist der Familienplaner von Marie Geißler. Auch für das kommende Jahr gibt es ihn wieder frisch, putzig und einmalig illustriert und ideal für eine 5-köpfige Familie, die Alltag und Freizeit vorausschauend plant. Goto jajaverlag.com + Add to list Mein Familienbuch Marie Geißler verdanken wir den in den Jahren traditionell gewordenen Familienplaner, der die Organisation des Familienalltags erleichtert. Aber was ist mit den ganz besonderen Ereignissen und wie hängt die Familie eigentlich zusammen und was hat wer mit wem zu tun oder gemeinsam? Einem Freundebuch nachempfunden, das von Freund zu Freund wandert und mit persönlichen Eintragungen gefüllt wird, möge das Familienbuch von Kind zu Tante zu Bruder zu Mutter und immer weiter herumgereicht werden. Die zu machenden Einträge sind dabei nicht langweilig und ganz bestimmt nicht bierernst. Es interessiert doch viel mehr, ob Opa Günter den Zungenroller kann oder an welches besondere Familienereignis er sich erinnert. Zwei Doppelseiten pro Person lassen auch der Phantasie noch viel Spielraum und dazu gibt es noch einen Stammbaum, eine Karte für die Geburtsorte, einen Geburtstagskalender und mehr. 19 Familienmitglieder passen rein! Goto jajaverlag.com + Add to list Mein Großfamilienbuch Dieses Buch ist die logische Antwort auf den großen Erfolg von „Mein Familienbuch” und den zahlreichen Anfragen von Großfamilien, die dort nicht genug Platz fanden. Dafür ist Marie Geißlers Großfamilienbuch nun mehr als doppelt so dick und es können sich 40 Familienangehörige verewigen. Denn das ist es, was dieses Buch so gut kann: Die persönlichen Erinnerungen speichern ohne Strom und Festplatte, dafür mit dem Charme von individuellen Handschriften, den Familienschatz in Papierform bringen, von Hand zu Hand gehen und noch nach Jahrzehnten liebevoll und oder nostalgisch betrachtet werden. In der Papiertasche hinten im Buch befinden sich zwei Aufkleberbogen mit Portraitstickern. Goto jajaverlag.com + Add to list Mein Sprachbüchlein »Bwwssfrrr bau bau gu« Mama, was war mein erstes Wort? Papa, was hab ich Lustiges gesagt, als ich klein war? …Mist, vergessen unter all den Abwaschbergen und zusammengelegter Wäsche. Um alle unwiederbringlichen Aussprüche und herzzerreißenden Zitate nicht den Abfluss hinunterrinnen zu lassen, hilft dieses kleine Büchlein, die Sprachentwicklung in den ersten Lebensjahren lustvoll zu dokumentieren. In verschiedenen Kapiteln wie Tiere, Philosophisches, Wichtige Fragen und Familie kann man kleine Szenen notieren, beobachten wie sich einzelne Worte verändern und Meilensteine festhalten. Und wieder beglückt uns Illustratorin Marie Geißler (Familienplaner, Mein Familienbuch) mit einem familienfreundlichen Büchlein, bestückt mit ihren schlichten, witzigen Zeichnungen. Goto jajaverlag.com + Add to list Familienjuwelen (Elterncomicbuch) Die beiden Comiczeichner Joris Bas Backer und Nettmann öffnen ihr Schmuckkästchen und zeigen ihre Familienjuwelen. Familienjuwelen ist eine autobiografische Comicstripserie, in der die beiden abwechselnd Episoden aus ihrem deutsch-niederländischen Familienleben erzählen, von den Abenteuern ihres Kindes berichten und über pädagogische Herausforderungen nachdenken. Nichts als die Wahrheit. Goto jajaverlag.com + Add to list supercool (Kindercomicbuch) Ein großer Lesespaß für Kinder ab 6 jahren! In "supercool" geht es um Coolness, Ausgrenzung und Freundschaften geht. Da ist die Heldin Tanja, die mit ihrer neuen Jeansjacke nicht bei allen Klassenkameradinnen auf Begeisterung stößt, aber eine gute Freundin hat, die ihr auch in schweren Minuten auf dem Pausenhof die Treue hält. Da ist auch der blöde Kai, dem sie es zumindest in ihrer Phantasie mal so richtig zeigt und da ist das Zuhause, wo es immer am schönsten ist mit einer Mama, die sie auf eine richtig krasse Idee bringt. Tanja Esch legt hier ein ganz bemerkenswertes Comicdebut vor, das mit seinen illustrativen Comicpanels, charmanter Bleistift-Strichführung und reduzierter Farbgebung in Sachen Coolness punktet. Das ist nicht nur für die Kids spannend und extrem witzig. Goto jajaverlag.com + Add to list WELTRETTUNG 2020 - Illustrierter Wandkalender EIN DUTZEND ILLUSTRIERTE WELTRETTUNGEN VON 12 IDEALISTISCHEN ZEICHNERN 40 x 40 cm, 14 Blätter in Farbe Kalenderspiralbindung silber Es geht uns um unsere Welt, unseren Planeten, unser Zusammenleben und -halten und wie wir was alles besser machen könnten. Von Mülltrennung über Freundlichkeit im Alltag bis zu freier Liebe und Fahrradfahren macht dieser Kalender Mut und erinnert uns, wofür es sich zu leben und kämpfen lohnt. Vom Verkauf werden 1 Euro pro Kalender an Sea-Watch e.V. gespendet, um die Seenotrettung im Mittelmeer zu unterstützen. Goto jajaverlag.com + Add to list Skizzenkalender 2020 Der Kalender für kreative Planer! Mit allem was ein Taschenkalender braucht: Jahres-, Monats-, Wochenübersichten, Feiertage... Dazu illustrierte Häppchen und Kritzelanimationen von Annette Köhn. Jeder Monat hat ein Zeichenwerkzeug als Motto oder ein Lieblingszeichenthema. Neben der Planerei kann man sich also auch inspirieren lassen und gleich loskritzeln. Monatlich wechselt auch die Papiersorte. Der Skizzenkalender ist eine Hommage an das Zeichnen an sich und ein ästhetischer Begleiter, der reichlich Platz für Eintragungen, Notizen und Skizzen lässt. Hardcover, Tasche hinten und zwei Lesebändchen 15 x 20 cm, 240 Seiten S/W auf unterschiedlichen Papieren + farbige Blanko-Papiere Goto jajaverlag.com + Add to list Taschenkalender GRÜN 2020 Unsere Papeterie-Expertin Jenny Boidol hat sich Grünes als grobes Jahresthema auserkoren. Darum gibt es in dem fein illustrierten Taschenkalender viel Grünzeug, ökologische Tipps und Wissenswertes über Insekten zum Beispiel. Dazu Todo-Listen, natürlich Tages-, Wochen- und Monatsübersichten, Platz für Notizen & motivierende Wochenaufgaben. Illustratorin: Jenny Boidol, bär von pappe Din A6 Format, Hardcover mit tannengrünem Gummiband zum Verschließen und senfgelbem Lesebändchen 100% Recyclingpapier 176 Seiten in Farbe Goto jajaverlag.com + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)'
