title = "Wishlephant - Ninia LaGrandes 10 Lieblingsbücher aus 2019"
description = "Die Autorin verrät uns ihre Buch-Highlights aus diesem Jahr. Von Graphic Novels über zu"
full_description = 'Ninia LaGrandes 10 Lieblingsbücher aus 2019 by Wishlephant Die Autorin verrät uns ihre Buch-Highlights aus diesem Jahr. Von Graphic Novels über zu Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Marta Breen - Rebellische Frauen - Women in Battle: 150 Jahre Kampf für Freiheit, Gleichheit, Schwesterlichkeit Ich lese sehr gerne Graphic Novels - und in den letzten Jahren ist da super viel zu feministischen und empowernden Themen entstanden. Dieser Band beschäftigt sich mit 150 Jahre Frauengeschichte. (Ansonsten alles von Liv Strömquist!) €25.00 Goto suhrkamp.de + Add to list James Frey - Strahlend schöner Morgen Stichwort verschiedene Geschichten. Dieses Buch hat mich nicht mehr losgelassen und ich empfehle es wirklich sehr oft. Ich habe es super schnell gelesen, obwohl ich dicke Bücher hasse. Sehr viele Figuren, sie alle mit ihren eigenen Geschichten, alle in LA, alle irgendwie verloren und hoffnungslos. Ein tolles Buch! €9.95 Goto ullstein-buchverlage.de + Add to list Miku Sophie Kühmel - Kintsugi Vor zwei Jahren hat Miku jeden meiner Podcast-Texte für Audible besser gemacht - dieses Jahr war sie mit ihrem Roman für den Deutschen Buchpreis nominiert und hat zahlreiche Preise gewonnen. Eine Geschichte, erzählt aus vier verschiedenen Perspektiven. Gefühlvoll beobachtet, dialogstark - das ist eh immer mein Ding. Ich mochte das Buch sehr. €18.99 Goto fischerverlage.de + Add to list Joyce Johnson - Zaunköniginnen Johnson war kurze Zeit die Lebensgefährtin vom berühmten Jack Kerouac. Dabei war sie so viel mehr - ausgezeichnete Schriftstellerin, tolle Beobachterin, mutige Frau. Hier schreibt sie über die Frauen der Beatpoeten-Szene, nimmt mit ins New York der 50er Jahre und ist dabei so voller Neugier und Spannung, dass es eine Freude ist, sie zu begleiten. €13.99 Goto edition-nautilus.de + Add to list Fatma Aydemir, Hengameh Yaghoobifarah - Eure Heimat ist unser Albtraum Das Buch ist ein Manifest gegen Heimat, gegen den Heimatbegriff und ein Protokoll der aktuellen gesellschaftlichen und politischen Situation. 14 Autor_innen schreiben über ihre rassistischen und antisemitischen Erfahrungen - ein Buch, das aus meiner Sicht in den Schulunterricht gehört und mit Sicherheit für spannende Gespräche beim Familienessen sorgt. €20.00 Goto genialokal.de + Add to list Svenja Gräfen - Freiraum Gräfen ist eine unfassbar gute Erzählerin. Feingliedrig nimmt sie ihre Protagonistinnen auseinander, lässt sie Konflikte nur langsam begreifen, um dann umso mehr zu zerstören. Die Geschichte hat mir gerade aufgrund ihrer Aktualität und der dennoch ungewöhnlichen Zusammensetzung der Figuren besonders gut gefallen. €20.00 Goto genialokal.de + Add to list Julia Korbik - Stand up Das beste Buch für Menschen, die sich für Feminismus begeistern oder andere dafür begeistern wollen. Ein Sachbuch, das Spaß macht, anleitet zum Kritischsein und einen super Überblick bereitet. €24.00 Goto keinundaber.ch + Add to list Hollie McNish - Das sagt einem ja keiner Für mich das einzig wahre Buch zur Schwangerschaft und zum Muttersein. Meine Bibel der ersten Jahre. Hollie ist so poetisch und gleichzeitig realistisch, authentisch und wahrhaftig, dass es fast weh tut, ihre Texte zu eine und sich selbst darin wiederzukennen. Dieses Buch hat mich gerettet und mir die Freude am Schreiben nach der Geburt wiedergegeben. €14.99 Goto genialokal.de + Add to list Johannes Floehr - Dialoge Johannes ist Floehr ist mein persönlicher Twitterkönig. Er bringt in kurzen, teilweise absurd witzigen Dialogen die Lage auf den Punkt. Das Buch versammelt seine besten Ergüsse - ich bin mir sicher, es hat nicht genug Seiten. Aber genug, um mit einem Auge lachend und einem traurig zu weinen allemal. €12.90 Goto lektora.de + Add to list Jackie Thomae - Momente der Klarheit Thomae ist eine Meisterin der Dialoge (ihr merkt, Dialoge sind mein Ding). Hier kommt ein weiterer Aspekt hinzu, den ich liebe - verschiedene Geschichten zu einer verwebt. Man will die Figuren am liebsten schütteln, weil sie so viel Blödsinn machen und merkt auch dabei - es geht trotzdem immer weiter. Thomae hat 2019 einen neuen Roman veröffentlicht: Brüder. Der ebenfalls für den Deutschen Buchpreis nominiert war, mit Sicherheit zu Recht, hab ich nur noch nicht geschafft - sonst würde ich ihn auch empfehlen. €19.90 Goto hanser-literaturverlage.de + Add to list 10 wishes'
