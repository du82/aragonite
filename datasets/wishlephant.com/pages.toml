["http://wishlephant.com/blog/2022-12-05-spiel-des-jahres"]
title = "Wishlephant - Blog - Die Top 5 meistverschenkten Familienspiele"
description = """
Für zwei Spieler:innen: 4 gewinnt nur viel, viel besser! Schönes Material, sieht aufgebaut edel aus.
Altersempfehlung: ab 6 Jahren"""
full_description = "Die Top 5 meistverschenkten Familienspiele Guido Heinecke ist Geschäftsführer bei Spiel des Jahres und verrät uns seine Lieblinge 05.12.2022 Für alle, die dich nicht kennen: Wer bist du und was machst du tolles? Hallo, ich heiße Guido und bin der Papa von Henry (16), Leo (13), Tom (10) und Louise (4). Außerdem bin ich der Geschäftsführer des Vereins „Spiel des Jahres“. Ich bin kein Jurymitglied (war aber mal eins), sondern kümmere mich um die laufende Verwaltung des Vereins. Das umfasst die Haushaltsplanung, Lizenzverträge und die Orga der Preisverleihung und Klausurtagungen. Es macht mir viel Spaß, mich im Hintergrund für das Spiel des Jahres und all die tollen Spiele zu engagieren! Quarto Für zwei Spieler:innen: 4 gewinnt nur viel, viel besser! Schönes Material, sieht aufgebaut edel aus. Altersempfehlung: ab 6 Jahren Goto spiele-offensive.de + Add to list MicroMacro: Crime City Ein Wimmelbild als Spiel mit skurrilen Mordfällen. Für jeden was - und wer es durch hat, schenkt sein Exemplar einfach weiter. Altersempfehlung: ab 8 Jahren Goto spiele-offensive.de + Add to list Dune: Imperium Fortgeschrittene Spieler*innen kämpfen hier um die Herrschaft über den Wüstenplaneten. Wie im Film! Altersempfehlung: Ab 14 Jahren + Add to list Splendor Ein Wetteifern um die besten Edelsteine mit tollen Synergie-Effekten. Altersempfehlung: Ab 10 Jahren Goto spiele-offensive.de + Add to list Cascadia Ein ruhiges Wohlfühlspiel, das nicht zu verkopft daherkommt. Altersempfehlung: Ab 10 Jahren Goto spiele-offensive.de + Add to list Brass: Lancashire Neuauflage Kennerspiel für Expert*innen ab 12 Beschreibung: Die industrielle Revolution ist in vollem Schwung. Errichte dein eigenes Wirtschaftsimperium und nutze dabei auch das, was deine Gegenspieler aufgebaut haben. Das meisterhafte Original von Martin Wallace rangiert als eines der 20 bestbewerteten Brettspiele auf BoardGameGeek und alle sind sich einig: Brass ist bekannt als eins der tiefgängigsten Ökonomiespiele mit kaum erreichten Wiederspielwert. In dieser neuen Version wurden die Regeln nochmals leicht überarbeitetet für eine verbesserte Balance. Verbesserte 2- und 3-Spieler-Regeln sorgen für ein Spielgefühl, das dem 4-Spieler-Spiel gleicht. Goto spiele-offensive.de + Add to list Great Western Trail Neuauflage Kennerspiel für Expert*innen ab 14 Jahren Great Western Trail ist ein von Kritikern hochgelobtes Spiel über Viehzucht von Alexander Pfister. Die Spieler versuchen ihre Herde durch die Prärie des Mittleren Westens zu treiben und sie nach Kansas City zu bringen. Aber Vorsicht! Die Cowboys teilen sich den Weg. Die zweite Edition verfügt über ein neues Design, doppellagige Spielerablagen und neues Spielmaterial. Außerdem gibt es eine Solo-Variante mit zusätzlichem Spielmaterial. Goto spiele-offensive.de + Add to list SPIEL DES JAHRES 2018 - Azul Neuauflage ab 8 Jahren Beschreibung: Azul lädt dich dazu ein, die Wände des königlichen Palastes in Evora mit prunkvollen Fliesen zu verzieren. Die ursprünglich weiß-blauen Keramikfliesen, genannt Azulejos, wurden einst von den Mauern eingeführt. Die Portugiesen vereinnahmten sie ganz für sich, nachdem ihr König Manuel I. bei einem Besuch der Alhambra in Südspanien von der Schönheit der schmuckvollen Fliesen geradezu überwältigt worden war. Sofort wies er seine Bediensteten an, dass die Wände seinen eigenen Palastes in Portugal mit ähnlich prachtvollen Fliesen zu verzieren seien. Goto mytoys.de + Add to list SPIEL DES JAHRES 2019 - Just One ab 8 Jahren Beschreibung: Just One ist ein kooperatives Partyspiel, bei dem alle zusammen gegen das Spiel spielen. Das Ziel ist es, gemeinsam möglichst viele der dreizehn geheimen Wörter zu erraten. Goto mytoys.de + Add to list Time's Up! Family ab 8 Jahren Beschreibung: Es ist das vielleicht lustigste, schnellste und coolste Quiz- und Partyspiel aller Zeiten, bei dem wirklich jeder seinen Spaß hat: Time#s Up! Drei Runden lang werden in zwei Teams Begriffe erklärt: zunächst wie man möchte, ohne das Wort direkt zu nennen, danach mit nur einem einzigen Wort und zuletzt mit Pantomime. Das Besondere daran, jede Runde sind die selben Begriffe zu erraten. Goto mytoys.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.) Du bist Familienvater mit vier Kindern: finden die das toll, dass du beruflich viel mit Spielen zu tun hast, oder haben die mittlerweile davon die Nase voll? ;) Ich glaube, dass sie es grundsätzlich schon toll finden. Bei uns ist Spielen ein zentraler Punkt im Familienalltag, und nicht nur weil drei Regale im Wohnzimmer stehen. Spielen ist auch eine Haltung; sie ist Lockerheit und eine Begegnung auf Augenhöhe. Die Kleine spielt liebend gerne mit uns, die großen Jungs ziehen sich hingegen gerne etwas aus unserem Spieleregal, das sie dann mit ihren Freunden spielen. Nur unser Tom hat damit nichts am Hut, der spielt lieber Fußball! Ich weiß noch, wie ich mit meinem kleinen Bruder im Dänemarkurlaub MauMau-süchtig wurde. Da waren wir gerade so 5 und 7 glaube ich. Wir haben das von morgens bis abends gespielt und ich habs geliebt. Erinnerst du dich noch an das erste Spiel, das dich so richtig in den Bann gezogen hat? Das war ein Würfelspiel und hieß „Zehntausend“. Meine Eltern und ich haben das mit viel Gaudi und witzig übertriebenem Ernst gespielt. Wenn dann noch ne Mark als Einsatz im Pott lag, dann kochten die Emotionen hoch. Klassiker wie Monopoly und Risiko fand ich damals schon doof, weil sie relativ aggressiv gespielt werden wollen. Und das liegt mir nicht. Verrätst du uns dein All-time-favorite Lieblingsspiel? Das existiert nicht. In jeder Zusammenstellung, mit jeweils unterschiedlichen Menschen funktionieren unterschiedliche Spiele mal besser, mal schlechter. In geselligen Runden, wo gelacht werden darf, spiele ich liebend gerne „Time’s Up“ oder „Just One“, wenn es ruhig zugeht auch mal „Cascadia“ und „Azul“ und mit meinen Experten-Mitspielern das abendfüllende „Brass“ oder „Great 