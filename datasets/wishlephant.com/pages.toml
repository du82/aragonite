["https://wishlephant.com/wishlists/648066ba-5313-491e-a2de-80322aa3a44b"]
title = "Wishlephant - Ninia LaGrandes 10 Lieblingsbücher aus 2021"
description = "Die Moderatorin und Autorin liest jedes Jahr viel und verrät uns wieder ihre Lieblingstitel aus diesem Jahr - von wunderschönen Feel-Good-Geschichten über radikale Selbstfürsorge zu Essays übers Alleinsein ist alles dabei ♡"
full_description = 'Ninia LaGrandes 10 Lieblingsbücher aus 2021 by Wishlephant Die Moderatorin und Autorin liest jedes Jahr viel und verrät uns wieder ihre Lieblingstitel aus diesem Jahr - von wunderschönen Feel-Good-Geschichten über radikale Selbstfürsorge zu Essays übers Alleinsein ist alles dabei ♡ Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Die letzte Bibliothek der Welt - Freya Sampson „Die letzte Bibliothek der Welt“ ist in Wahrheit nur eine kleine Bücherei im britischen Dorf Chalcot. Aber: Sie soll geschlossen werden. Und das darf nicht passieren. Also formiert sich Widerstand rund um die Bibliothekarin June. Ich liebe alles, was inhaltlich mit Bibliotheken zu tun hat. Ich rieche die alte Bücherei meiner Kindheit, während ich lese. Das Buch ist ein wunderbares Herbst-Winter-Buch, ein bisschen Gilmore Girls Vibes in Großbritannien. Ich würde mich freuen, wenn wir bald eine Verfilmung dazu sehen können. ISBN: 38-3216-567-3 €20.00 Goto genialokal.de + Add to list Wirklich nett – Marcy Dermansky Ein super stranges Buch und gerade deshalb ist es so toll. Rachel küsst ihren Professor für Kreatives Schreiben, durch diverse Wendungen verbringt dieser dann den Sommer im Haus ihrer Mutter – während Rachel auch dort ist und ihrem Ferienjob nachgeht. Ihre Mutter ist frisch getrennt, ihr Pudel ist gestorben, da kommt der Professor mit eigenem Pudel gerade recht. Diese Geschichte ist unfassbar komisch – in allen Bedeutungen des Wortes und haut einer nebenbei auch noch Gesellschaftskritik um die Ohren. Mein Lieblingszufallsfund 2021. ISBN: 34-6340-718-3 €22.00 Goto genialokal.de + Add to list Ist alles deins! – Jami Attenberg Seitdem ich den ersten Attenberg-Roman gelesen habe, bin ich Fangirl No. 1. Auch ihr neues Buch hat mich wieder total abgeholt. Victor Tuchman hat einen Herzinfarkt. Skrupelloser Geschäftsmann, brutaler Ehemann und abwesender Vater. Trotzdem versucht die Familie wieder in New Orleans zusammenzukommen, um sich – ja – nicht unbedingt zu verabschieden, sondern eher für sich selbst mit der Vergangenheit aufzuräumen. Und, Achtung, im Januar erscheint „I came all this way to meet you: Writing myself home” auf Deutsch. ISBN: 38-9561-358-4 €24.00 Goto genialokal.de + Add to list Ciao – Johanna Adorján Hans Benedek ist Feuilletonist und im Grunde der Inbegriff des alten, weißen Mannes. Seine Affäre mit der Praktikantin läuft nicht so wie gedacht und jetzt wird er auch noch die bekannteste Feministin des Landes interviewen. Für mich schon fast erschreckend, wie nah an der Realität Adorján mit ihrem kurzen, aber sehr unterhaltsamen Roman bleibt. Liest sich an einem Tag durch! ISBN: 34-6200-171-X €20.00 Goto genialokal.de + Add to list Radikale Selbstfürsorge. Jetzt! – Svenja Gräfen Disclaimer: Svenja ist eine meiner besten Freundinnen. Und gerade deshalb glaube ich beurteilen zu können, dass dieses Buch besonders gut ist. Und genau den Zeitgeist trifft. Ich hasse Ratgeber. Und alle Bücher, die mir erzählen wollen, ich würde nur durch Leistung und Verzicht ein besserer Mensch werden. Svenjas Buch ist eine gute Freundin, die eine an die Hand nimmt und erkennen lässt, wie schon Kleinigkeiten das Selbstbefinden ändern können. Warum es ok ist, wütend, faul oder traurig zu sein. Ich liebs und verschenke es sehr gerne. ISBN: 39-5910-332-8 €15.00 Goto genialokal.de + Add to list Was wir wollen – Meg Mason Dieses Buch schmerzt an der einen oder anderen Stelle. Und gerade das macht es so herausragend. Martha ist Ende 30 und verheiratet. Eigentlich müsste sie glücklich sein. Eigentlich. Irgendwas stimmt nicht mit Martha und im Laufe der Geschichte wird dieses Gefühl drückend, explosiv. Bei Martha und bei mir. Als Marthas Mann sie verlässt, bricht sich das diffuse Gefühl Bahn und Martha macht sich auf die Suche nach sich selbst. Mason schreibt unglaublich nah an den Protagonist*innen. Selten habe ich das Thema Depression oder psychische Erkrankungen so ungenannt, aber offensichtlich in einem Buch erlebt. Ein Must-Read für mich. ISBN: 37-5300-003-5 €22.00 Goto genialokal.de + Add to list Junge Frau, am Fenster stehend, Abendlicht, blaues Kleid – Alena Schröder Schröder schreibt über die Leben dreier Frauen aus drei Generationen: Großmutter, Mutter, Tochter. Die Großmutter spricht nicht gern über die Vergangenheit und bis ein Brief aus Israel eintrifft, fragt die Tochter auch nicht nach. Doch die Post verändert alles. Ein großartiger Generationenroman über jüdische Geschichte und Frauenleben in verschiedenen Jahrzehnten – hat mich sehr beeindruckt. ISBN: 34-2328-273-8 €22.00 Goto genialokal.de + Add to list Das Verschwinden der Erde – Julia Philipps Dieses Buch konnte ich nicht weglegen. An einem Sommertag verschwinden in Kamtschatka zwei Schwestern. Wer jetzt an einen Krimi denkt, liegt ein bisschen falsch. Philipps führt uns in verschiedene Frauenleben auf der Halbinsel. Der Roman zeigt uns, in welcher Form die Protagonist*innen miteinander verbunden sind, geprägt von einer sehr patriarchalen und leistungsorientierten Gesellschaft. Philipps selbst sagt, sie zeigt mit jedem, Handlungsstrang ein weiteres Spektrum von Gewalt. Passender kann man es nicht beschreiben. Mich hat das Setting, das Philipps entwirft unglaublich fasziniert. Mein Favorit in diesem Jahr! ISBN: 34-2314-826-8 €13.00 Goto genialokal.de + Add to list Ich denk, ich denk zu viel – Nina Kunz Die Kolumnen von Nina Kunz habe ich im Sommerurlaub gelesen und war sehr traurig, als es schon wieder vorbei war. Nina Kunz denkt wirklich viel. Und es macht Spaß, ihr dabei zuzuhören. Sie beschreibt das Bild einer Generation, in der ich mich – obwohl ich einige Jahre älter bin als Kunz – sehr wiedergefunden habe. Es geht um Butterbrote, Tattoos, Weltschmerz und digitale Abstinenz. Und um so viel mehr. Ich freue mich auf weitere Veröffentlichungen. ISBN: 30-3695-843-6 €20.00 Goto genialokal.de + Add to list Allein – Daniel Schreiber Schreibers Essays atme ich ein. Er kann seine Leser*innen so gut mitnehmen in eine Welt aus eigenen Erfahrungen, philosophischen Ausflügen und utopischen Ideen. „Allein“ behandelt die Rolle der Freundschaft in unserer Zeit und das Spannungsverhältnis zwischen dem Wunsch nach Partner*innenschaft und dem freien Leben allein. Ich will alles anstreichen. Obwohl ich so gar nicht in die Ausgangsposition des Autors passe. Selten fühle ich mich nach einer Lektüre um so vieles schlauer als bei Schreiber. Kein Geheimtipp mehr. ISBN: 34-4626-792-1 €20.00 Goto genialokal.de + Add to list 10 wishes'
