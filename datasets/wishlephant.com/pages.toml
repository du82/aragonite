["http://wishlephant.com/wishlists/b38f9e8d-b1d3-415d-bcdc-8159ad2faa26"]
title = "Wishlephant - 12 Gartenbücher zum Schmökern, Lernen und naturnah Gärtnern"
description = "ob Balkon, Terasse oder (Schreber)garten - in diesen Büchern finden alle Heimat, die gern Gemüse oder Bienenwiesen anpflanzen wollen, Interiortipps oder Rezepte suchen, von einem essbaren Balkon träumen oder alles zusammen."
full_description = '''12 Gartenbücher zum Schmökern, Lernen und naturnah Gärtnern by Wishlephant ob Balkon, Terasse oder (Schreber)garten - in diesen Büchern finden alle Heimat, die gern Gemüse oder Bienenwiesen anpflanzen wollen, Interiortipps oder Rezepte suchen, von einem essbaren Balkon träumen oder alles zusammen. Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Lust auf Laube - Caroline Lahusen, Sylvia Doria Dieses Buch hatte ich schon lange bevor wir uns wirklich für einen Schrebergarten beworben haben und auch das zeigt viele verschiedene Schrebergärten und die Menschen, die sich um sie kümmern. Es zeigt eine richtig schöne Vielfalt von sehr unterschiedlichen Gärten, die sehr unterschiedlich genutzt und eingerichtet sind. Macht viel Spaß. ISBN: 34-2104-057-5 €29.95 Goto genialokal.de + Add to list A Modern Way to Schreber - Anne Peter, Jens Amende Einblicke in Schrebergärten aller Art gibt es auch hier, viele Fotos von Einrichtungsideen und kurzen Interviews mit den Gärtner*innen, ihren Rezepten und Tipps. Das Autor*innenpaar reist durch Deutschland und Österreich und besucht 20 Schrebergärten und die Menschen dahinter. Ein sehr stylischer und hipsteriger Interior-Schmökertraum. ISBN: 39-5728-617-4 €28.00 Goto genialokal.de + Add to list Genial Gärtnern - Monty Don Der ultimative Leitfaden fürs Biogärtnern von meinem Lieblingsgärtner (und dem der ganzen englischsprachigen Welt glaube ich😅). Inhalt: Gärtnern im Einklang mit der Natur - dieses Motto verfolgt Gartenprofi Monty Don . Mit seinem Gartenbuch bietet er den perfekten Leitfaden für alle wichtigen Aspekte des Bio-Gärtnerns : Ob Boden, Kompost und Dünger oder auch Vermehrung, Aussaat, Pflanzung und Schädlingskontrolle. Anhand detaillierter Bilder und prägnanter Beschreibungen zeigt er Ihnen, wie Sie Ihre grüne Oase mit Leidenschaft und Naturverbundenheit gestalten und pflegen. ISBN: 38-3104-311-6 €29.95 Goto genialokal.de + Add to list Der antiautoritäre Garten - Simone Kern Tolles Buch, um zu verstehen, was naturnah Gärtnern bedeutet und umzudenken und am Ende das dann hinzubekommen, was im Untertitel steht. Ein Garten, der sich selbst gestaltet. ISBN: 34-4017-377-1 €20.00 Goto genialokal.de + Add to list Wild & bunt - Simone Kern Inhalt: Das Artensterben hat bedrückende Ausmaße angenommen. Wer etwas dagegen tun möchte, braucht vor allem eines: einen tierfreundlichen Garten mit heimischen Wildpflanzen. Simone Kern zeigt, wie man einen Garten gestaltet, der Vögeln, Insekten und anderen Tieren Lebensraum bietet. Sie stellt Gestaltungsbeispiele für trockene, feuchte, steinige und andere typische Gartenbereiche vor, inklusive Musterbeeten und Einkaufslisten für geeignete Wildpflanzen. Ausführliche Pflanzenporträts informieren u.a. über Standort, Pflege und ökologischen Nutzen von rund 70 heimischen Stauden, Bäumen, Sträuchern und Gräsern. ISBN: 34-4017-336-4 €20.00 Goto genialokal.de + Add to list Abenteuer Garten - Carolin Engwert Der Schrebergartenklassiker für Anfänger*innen von der @hauptstadtgarten Caro, die für ihren Gartenblog schon mehrfach ausgezeichnet wurde. ISBN: 34-4016-412-8 €20.00 Goto genialokal.de + Add to list Grow Easy - Anna Greenland Organic crops for pots & small plots Für alle, die wenig Platz haben oder viel Gemüse aus dem bisschen Platz machen wollen was sie haben. Schönes Einführungsbuch, das von den Tools über Erde und Gemüseauswahl alles erklärt. ISBN: 17-8472-735-0 €25.50 Goto genialokal.de + Add to list Gardening at Longmeadow - Monty Don Für alle, die Monty so lieben wie ich! Inhalt: The nation's favourite gardener' - Guardian 'There was nothing here that could possibly be described as a garden. But beneath years of neglect was a blank canvas that I could fill with the garden of my dreams...'Monty Don invites you into Longmeadow, a place that has become synonymous with Gardener's World, to show how he creates and tends his own garden, and how you can bring some of that same magic to our own. Following the cycle of the seasons, Gardening at Longmeadow is a year-long diary of Monty's gardening wisdom ISBN: 17-8594-782-6 €21.50 Goto genialokal.de + Add to list Gärten inspiriert von der Natur - Henk Gerritsen, Piet Oudolf Werk detailliertes Werk für alle, die Staudengärten anlegen wollen. Mit Ausführlichen Pflanzenportraits und dann Bepflanzungsvorschlägen je nach Thema "Beruhigend", "Überschäumend", aber auch gute Nachbarschaft, und wie lange die Blütezeit dauert. Für alle, die sich richtig reinnerden wollen ein sehr gutes Werk mit Natur-Gartenstar Piet Oudolf. €30.00 Goto genialokal.de + Add to list In meinem Garten blüht das Glück - Anna-Isabell Bergert Meine Lieblings-Naturnahe Gärtnerin Anna @gartenkleinod mit dem schönsten Gartenhäuschen hat ein Buch geschrieben, voll mit ihren Tipps und Tricks und Gartenideen. Ein tolles Geschenk - für sich selbst oder eine befreundete Garteliebhaberin. €16.00 Goto genialokal.de + Add to list Bin im Garten - Meike Winnemuth eine schöne leichte autobiografische Lektüre durchs Gartenjahr. Meike kauft sich ein Gartengrundstück und fängt an zu gärtnern, mit allen Fails und Idealen einer typischen Gartenanfängerin - wie wir alle eben. Es macht einfach Spaß zu lesen und facht die Gartenfreude an! ISBN: 33-2810-815-7 €14.00 Goto genialokal.de + Add to list Rat für jeden Gartentag - Franz Böhmig Dieses Nachschlagewerk hat Bodo mal besorgt und ich habe bisher noch nicht viel reingeschaut, aber es ist wirklich ein gutes Werk, das monatsweise durch den Garten und die Aufgaben führt, die anstehen und gibt wirklich fundierte Tipps wie man z.b. Trockenmauern anlegt, worauf man bei m Umpflanzen von starken Stauden achten sollte und wann genau Bohnen zu düngen sind. ISBN: 38-1861-758-9 €28.00 Goto genialokal.de + Add to list 12 wishes'''
