["http://wishlephant.com/blog/2019-10-20-erstausstattung"]
title = "Wishlephant - Blog - Baby-Erstausstattung"
description = "wunderschön, ehrlich und verletzlicher Comic von der Schwedin Emma Ahlqvist übers Mutterwerden"
full_description = "Baby-Erstausstattung 20.10.2019 Foto von Minnie Zhou. Das erste Kind kommt. Und nun? Was braucht man für den Start in dieses Abenteuer? Die Liste unten war das, was wir uns besorgt haben oder im Nachhinein gerne gehabt hätten 😅. Allerdings braucht ihr eigentlich fast gar nichts davon neu (naja, Windeln schon 😝). Entweder bekommt ihr die Sachen aus dem Freund:innen- oder Familienkreis, oder auf Plattformen wie MamiKreisel (furchtbarer Name leider, aber sehr praktisch) relativ günstig. Wir haben sogar einige der Flaschen, die wir benutzen, vor der Haustür in einer “zu Verschenken” Kiste gefunden. Alles was wir dazu noch brauchten waren neue Sauger. Neben den Sachen, die wir hier zusammengestellt haben, braucht ihr natürlich noch Bekleidung. Da ist es ganz besonders praktisch, die nicht neu zu kaufen, denn die kleinen wachsen da nämlich super schnell raus und Second Hand braucht man sich fast gar keine Gedanken mehr über etwaige reizende Chemikalien zu machen, die noch in vielen neuen Sachen drin sind und die man erst nach und nach rauswaschen muss. Besonders für uns mit einem Neurodermitis-Baby hat sich das gut bewährt. My Body Created a Human wunderschön, ehrlich und verletzlicher Comic von der Schwedin Emma Ahlqvist übers Mutterwerden Goto genialokal.de + Add to list Mutter werden Ganz wunderbar leises und warmes Buch über die Zeit nach der Geburt. Ein Projekt von der Hebamme Jule Tilgner und der Fotografin Marcia Friese Goto genialokal.de + Add to list Stoffwindeln Neben den Wegwerf-Windeln gibt es noch Stoffwindeln. Wenn ihr euch dafür interessiert, sucht ihr am besten eine Windelberatung, die euch alle Fragen dazu beantworten kann und euch erklärt, wie diese anzuwenden sind und was genau gebraucht wird. Goto windelmanufaktur.com + Add to list THERALINE KomfortStillkissen 180 cm Big Stars grau Stillkissen waren die Mega-Entdeckung. Schon in der Schwangerschaft hat Anika nur noch damit geschlafen. Wir hatten sogar zwei am Ende. Sind unglaublich praktisch für allerlei Situationen (Autofahren, Liegen, Lesen, Massieren, Schlafen) - u.a. auch fürs Stillen 😅 Goto baby-walz.de + Add to list Essen vor die Tür stellen Tolles Geschenk: Selbstgekochtes Essen von Freund*innen oder Familie vor die Tür stellen lassen. Da waren wir auf ewig dankbar dafür + Add to list selbst gestrickte Decken das ist mit das Schönste, was ihr euch schenken lassen könnt. Und kriegen auch Anfänger*innen hin. Für den Kinderwagen oder zum Kuscheln und Schlafen, das ist so schön, dann was mit Liebe gemachtes zu haben. + Add to list Müsliriegel Profutura mama für Stillende Schoko-Cranberry, 5x40g, 200 g Anika liebt die immer noch und die sollte man wirklich strategisch überall in der Wohnung verteilen, damit man die beim Stillen oder Füttern auch sofort findet. Goto dm.de + Add to list Baby Bay Wie und wo euer Baby schläft, ist ganz euch überlassen. Ob direkt mit im Bett oder ganz im eigenen Zimmer oder wie hier am Bett dran - whatever works! Wir haben das hier gebraucht von einer Freundin bekommen und waren sehr zufrieden. Goto babybay.de + Add to list Multi-Mam Kompressen - Brustwarzen-Kompressen Beste Brustwarzenpflege und schnellste Hilfe ever! Anika hat die geliebt. Kleiner Tipp: Die einzelnen Tücher kann man auch nochmal zerschneiden, dann reicht es länger! Goto ardoshop.de + Add to list Baby Schlafsack Goto dm.de + Add to list Mulltücher Kolibri / grün, 3 St Wir hatten 12 Tücher am Anfang, damit nicht so oft gewaschen werden muss . Man kommt aber definitiv auch mit weniger aus. Goto dm.de + Add to list Wickeltasche, braun, 1 St Nach 2-3 Wochen werdet ihr auch mal aus der Wohnung raus wollen. Eine Tasche mit allem Wickelzeug ist da dann sehr praktisch. Goto dm.de + Add to list Mandelöl, Bio, 100 ml Zum Reinigen des Babypopos und bei Milchschorf Goto dm.de + Add to list Wundschutzcreme Goto dm.de + Add to list easy emeibaby Babytrage grau David Bei Tragessystemen am besten mal mit einer Trageberatung ein paar Systeme ausprobieren. Jede Person hat da eigene Vorlieben. Wir haben eine emeibaby, einen Sling und Tragetücher gehabt und alles geliebt. Ganz besonders den Sling. Goto emeibaby.com + Add to list Thermoskanne, 500ml, türkis, 1 St Um immer heißes Wasser vorrätig zu haben für die Flaschennahrung. Goto dm.de + Add to list Humana Anfangsnahrung HA PRE von Geburt an, 500 g Stillen ist kein „Muss“. #fedisbest Manchmal klappt es auch einfach nicht, oder nicht sofort. Für uns war es gut, eine Alternative da zu haben , falls es nicht so klappt, oder man wie wir, zufüttern muss. Goto dm.de + Add to list Windeln Größe 1, 2-3 kg, 20 St 4 Packungen Goto dm.de + Add to list Wöchnerinnen Vorlagen/Vlieswindeln 34x12 cm, 10 St Goto dm.de + Add to list Stilleinlagen, 30 St Goto dm.de + Add to list Wickeltisch-Heizstrahler 300/600W mit Abschaltautomatik Für Winterbabys und kalte Wohnungen. Goto dm.de + Add to list Schnuller symmetrisch, Silikon Gr. 1 Katze / Löwe, 2 St Falls ihr Nuckel nehmen wollt - oder euer Baby: 4 Stück sollten für den Anfang reichen. Aber auch hier gibts sehr sehr viele Modelle. Einfach durchprobieren. Goto dm.de + Add to list Babyphone Video SCD831, 1 St Es gibt sehr viele unterschiedliche Systeme. Wir haben zuerst eines nur mit Ton gehabt, aber später festgestellt, dass wir doch sehen wollten, wie die komischen Geräusche zustande kommen 🤣 Goto dm.de + Add to list Trockenständer, 1 St Flaschen werden auch so trocken, aber manche Menschen brauchen es extra ordentlich (wie Bodo 🙈) Goto dm.de + Add to list Flasche Natural 2.0, 260ml, Wal, 1 St 2-3 Flaschen Goto dm.de + Add to list Flaschenwärmer, 1 St Goto dm.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.) Fehlt etwas? Lasst es uns wissen!"
