full_description = '''Privacy For us the protection of your privacy is very important. We will never disclose your data to a third party and obey the strict German privacy laws. The usage of this website is possible without giving us any data. If you enter personal data it is always by choice and we will never force you to do so. We will never hand over your data to a third party without your consent. We should point out that data transmission on the internet (for example using E-Mail) can be compromised. A complete protection can't be guaranteed. Cookies This page is using cookies. Cookies are small textfiles that are stored on your computer when you visit a website. Cookies don't harm your computer and can't contain viruses. Those cookies will help us to make the page a more effective experience for you. Most of our cookies are so called "session cookies". Those will be stored on your computer to make it possible to keep you logged into the page when you revisit it. You can configure your browser that it notices you about cookies to allow them only for specific websites. Alternatively you can configure your browser to delete all cookies when you close it. If you deactivate cookies for this site some parts of the site can't be used anymore. Server-Log-Files The provider of this page stores some data in so called server log files. Those files will include data your browser will send to us automatically. For example: Browser type and versionused operating systemReferrerURLHost name of your computerTime and date of your request This data is not assignable to a specific person. There is no consolidation with data from other sources that would make this possible. We will check the log files if we have concrete evidence for illegal usage of the site. SSL-Encryption This site is using encryption to secure the data you are sending while using this site. The address bar of your web browser should show you a "https://" instead of a "http" at the start of the url. While ssl is active, no third party can read the data that is transmitted to us. Bugsnag Wishlephant is using Bugsnag to identify errors in our code. Should an error appear Bugsnag will be informed and stores the data in an anonymized form. The privacy statement of Bugsnag can be found here. Mailgun We are using Mailgun to send emails. Every email we sent is stored on Mailgun for a limited time. The privacy statement of Mailgun can be found here. Amazon partner program We are part of the Amazon partner program. If you click on a Amazon link and buy products there, we will get a small commission. Awin Affiliate Marketing This website is using the Performance Advertising Netzwerk of AWIN AG, Eichhornstraße 3, 10785 Berlin, Germany. As part of its tracking services, AWIN stores cookies to document transactions (such as leads and sales) on Devices of users who visit or use their customers' websites or other online services (e.g. Register newsletter or place an order in an online shop). These cookies are for the sole purpose of a correct allocation of the success of an advertisement and the corresponding settlement in the context of his Network. Personal data is not collected, processed or used by AWIN. The Cookie only contains the information about when a particular advertising material was clicked. The AWIN Tracking Cookie is an unique id, but not to an individual user assignable digit sequence, used to document the affiliate program of an advertiser, the publisher and the time of the action by the user (click or biew). AWIN also collects information about the device from which a transaction is made, e.g. the operating system and the calling browser More information about the data processing of AWIN can be found here: https://www.awin.com/de/rechtliches Tradedoubler Affiliate Marketing We use the affiliate program Tradedoubler of Tradedoubler GmbH (Herzog-Wilhelm-Straße 26, 80331 München, Germany; “Tradedoubler“). The Tradedoubler tracking cookie does not store any personal data. Only the identification number of the affiliate, i.e. the partner referring the potential customer, as well as the order number of the visitor to a website and the advertising medium clicked on are stored. The purpose of storing this data is to process commission payments between a merchant and the affiliate, which are processed via the affiliate network, i.e. Tradedoubler. More information about the data processing of Tradedoubler can be found here: https://www.tradedoubler.com/en/privacy-policy/ Webgains We participate in the "Webgains" partner program of ad pepper media GmbH, FrankenStraße 150C, 90461 Nuremberg, Germany (hereinafter "Webgains"). Webgains is a German affiliate network that offers affiliate marketing. Affiliate marketing is an Internet-supported form of distribution that enables commercial operators of websites, so-called merchants or advertisers, to display advertising, which is usually paid for by click or sale commissions, on the websites of third parties, such as distribution partners also known as affiliates or publishers. The Merchant provides an advertising medium via the Affiliate Network, i.e. an advertising banner or other suitable means of Internet advertising, which is subsequently integrated by an Affiliate on its own Internet pages. In this context, we have placed advertisements as links on our website. We use cookies from Webgains for this purpose. These are small text files that are stored on your end device in order to be able to trace the origin of orders generated via such links. This enables Webgains to recognize, among other things, that you have clicked on the partner link on our website. This information is required for the processing of payments between us and Webgains. If the information also contains personal data, the processing described is based on our legitimate financial interest in processing commission payments with Webgains in accordance with Art. 6 para. 1 letter f of the Data Protection Act. Further information on the use of data by Webgains can be found in the Webgains Privacy Policy at http://www.webgains.com/public/de/datenschutzerklaerung/ If you wish to block the evaluation of user behavior via cookies, you can set your browser so that you are informed about the setting of cookies and decide individually whether to accept them or to exclude the acceptance of cookies for certain cases or in general. Insofar as legally required, we have obtained your consent for the above-mentioned processing of your data in accordance with Art. 6 Para. 1 lit. a DSGVO. You can revoke your consent at any time with effect for the future. In order to exercise your revocation, please follow the procedure described above for making an objection. Request for information or deletion You have the right to ask us what data we store about you on our server. We will provide that information for free. We also will delete all data that is stored about you on our servers if you request us to do so. If you have any question about your data or your privacy, feel free to contact us using the address in the impressum.'''
