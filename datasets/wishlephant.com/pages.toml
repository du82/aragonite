len will! Aber wer lieber liest, hier ist das Taschenbuch. €13.00 Goto genialokal.de + Add to list Gewässer im Ziplock €23.00 Goto genialokal.de + Add to list Kommst du mit? Schöner Stadtspaziergang durch eine italienische Staft mit wenig Worten und wunderschönen Bildern. Empfohlen von Ilona Stütz €22.50 Goto genialokal.de + Add to list Das Jungfernhäutchen gibt es nicht €18.00 Goto genialokal.de + Add to list Bastelset, Geburtstagstafel €4.95 Goto fridolin-shop.de + Add to list »Gib mir mal die Hautfarbe« €18.00 Goto genialokal.de + Add to list Gutschein Online-Kunst-Workshop für Familien, Kinder und Jugendliche Es gibt auch Workshops für Erwachsene ♡ €30.00 Goto kinderkunsthaus.de + Add to list Pizzakatze für alle die Katzen oder Pizza lieben und vor allem Reime! Süßes, klischeearmes Bilderbuch über die tolle Pizzakatze. ab 3 Jahren €15.00 Goto genialokal.de + Add to list Für Sorge €16.00 Goto genialokal.de + Add to list Lichterland 1. Die Suche nach dem magischen Amulett Aus der Liste der klischeearmen Vorlesebücher, empfohlen von Jo Lücke. Das hat mich total gepackt und ich selbst kann es kaum weglegen - das fehlt mir oft bei Kinderbüchern, die sonst ziemlich viel richtig machen, was so diverse Charaktere und klischeearme Storylines angeht. Auch Teil 2 soll genauso spannend sein! Yay! €16.00 Goto genialokal.de + Add to list Bloom Für alle, die Heartstopper mochten! Sweete queere Freunde-turned-Lovers Graphic Novel , die in einer griechischen Bäckerei spielt. Ab 12 Jahren €19.50 Goto genialokal.de + Add to list Afd-lügt-Sticker von @wimmelsteph Für eine Bestellung, schreibt ihr am besten eine DM auf Instagram + Add to list Wolkentiere und Quadrat €25.00 Goto genialokal.de + Add to list Augenstempel Perlenfischer X WE LIKE MONDAYS €2.99 Goto wlkmndys.com + Add to list Bügelbild "Rosa Fluff" | Krullenbol super süßes Bügelbild von der Illustratorin @Judithmachtdas. €3.90 Goto krullenbol.de + Add to list Blue Orange - Taco Katze Ziege Käse Pizza ein sehr lustiges Reaktions-Kartenspiel bei dem es darum geht, die Schnellste zu sein und alle Karten einzuheimsen. €11.99 Goto thalia.de + Add to list Linus liebt Licht - Anna Mendel und Jasmin Sturm Linus liebt.. Licht, Geschwindigkeit, Gras, Wasser und Laute. Linus ist Autist und wir begleiten ihn durch den Tag und lernen wie Stimming bei im aussieht. Ein wirklich zauberhaft gemachtes Buch, das Kindern und Erwachsenen in ganz einfachen Bildern und Texten das Innenleben von autistischen und neuridivergenten Menschen nahe bringt. €12.90 Goto brimborium-verlag.de + Add to list Sun und Shiro und die gelb gepunktete Schlange ein Märchen über die Freundschaft €12.90 Goto genialokal.de + Add to list 78 wishes'''
