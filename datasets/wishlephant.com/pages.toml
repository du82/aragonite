ere, und so hat man gleich eine prima Aufbewahrung für ihre Kunstwerke, wenn sie die gleich ins Büchlein reinmalen. €9.31 Goto gerstaecker.de + Add to list Das Kleine Mikroskop €3.92 Goto astromedia.de + Add to list Wer versteckt sich hier…im Dschungel? Entdeckung aus dem Camping-Urlaub dieses Jahr, in dem M. das teilweise auch allein ganz fasziniert gespielt hat. Es ist echt superschön gemacht und einfach ne schöne Idee. Goto modulor.de + Add to list Blue Orange - Taco Katze Ziege Käse Pizza eins unserer absoluten Lieblingskartenspiele! Sehr lustig €11.99 Goto thalia.de + Add to list Stirnlampe für Kinder TIKKID blue Bisschen teureres Geschenk, aber falls ihr eh eine gute Lampe sucht, wir haben mit der gute Erfahrungen gemacht (sie leuchtet in verschiedenen Farben und auch weiß). €25.95 Goto decathlon.de + Add to list Fernweh Kofferbox für Reise-Erinnerungen €9.95 Goto moses-verlag.de + Add to list Nagelsticker Animals €12.90 Goto konfettiwolke.de + Add to list Fingerhände 2er Set - nachtleuchtend €5.50 Goto crazythree.de + Add to list 49 wishes'''
