["https://wishlephant.com/blog/2019-12-20-ninia-lagrande"]
title = "Wishlephant - Blog - Ninia LaGrande liest - Die Top 10 aus 2019"
description = "Ich lese sehr gerne Graphic Novels - und in den letzten Jahren ist da super viel zu feministischen und empowernden Themen entstanden. Dieser Band beschäftigt sich mit 150 Jahre Frauengeschichte. (Ansonsten alles von Liv Strömquist!)"
full_description = "Ninia LaGrande liest - Die Top 10 aus 2019 20.12.2019 Eine unserer Lieblings-Poetry-Slammerinnen (sie ist noch so viel mehr, aber lest selbst) Ninia LaGrande stellt regelmäßig Bücher auf ihrem Insta-Kanal vor und wir haben sie gefragt, welche Bücher ihre Top 10 dieses Jahr waren. Großartigerweise hat sie es uns verraten und für uns ihre Top 10 zusammengestellt. Wir haben auch darüber gesprochen, welches Buch sie sich selbst zu Weihnachten wünscht und Ninia hat noch super Tipps, für alle, die sich mehr mit dem Thema Inklusion auseinandersetzen wollen. Los geht’s! Foto von Simona Bednarek. Für alle, die dich noch nicht kennen: Wer bist du und was machst du alles tolles? Ahoi – ich bin Ninia und ich bin Moderatorin, Autorin und Slam Poetin. Außerdem produziere ich Podcasts und führe ehrenamtlich den Vorsitz des Beirats zur Bewerbung Hannovers als Kulturhauptstadt 2025. Ich engagiere mich für feministische und inklusive Themen, experimentiere gerne mit Mode und haue regelmäßig über Instagram Buchtipps raus. Außerdem bin ich Geschäftsführerin der Büro für Popkultur GmbH und Co. KG in Hannover – wir veranstalten unterschiedliche Kulturevents. Du hast selbst noch ein Buch rausgebracht dieses Jahr - erzähl mal! Genau! Das ist mein zweites Buch – und wie das erste ein Sammelband von Kurzgeschichten, Poetry Slam Texten und Kolumnen. Es heißt „Von mir hat es das nicht!“ und ist im Blaulicht-Verlag erschienen. Ich schreibe persönliche Alltagsgeschichten über das Leben als Eltern, kleinwüchsige Mutter und zwischenmenschliche Beziehungen. Was ist das Projekt Ninia Liest? Und wann kommst du so zum Lesen als Elternteil? Ich mache regelmäßig kurze Rezensionsstories auf meinem Instagram-Account @ninialagrande. Die meisten Bücher kaufe oder leihe ich selbst, inzwischen bekomme ich auch einige zur Verfügung gestellt. Ich lese zum einen beruflich recht viel – auch als Inspiration, dann natürlich in meiner Arbeitszeit. Und abends, wenn ich im Bett liege, fast täglich, um etwas runterzukommen. Außerdem bin ich als Moderatorin und Slam Poetin viel unterwegs und nutze dann die Zeit im Zug, um zu lesen. Welches Buch wünschst du dir zu Weihnachten? Ich wünsche mir von Helga Flatland „Eine moderne Familie“. Du setzt dich unter anderem für Inklusion ein und wenn man dir auf Instagram folgt, kann man echt viel lernen. Danke dafür! Hast du einen Bucher/Podcast/Film/Instagramaccount-Tipp, für alle, die gerade erst anfangen, sich mit dem Thema auseinander zu setzen? Meldet euch beim Newsletter von Raul Krauthausen an – jeden Dienstag gibt’s da das Wichtigste zum Thema in einem guten Überblick. Lest das Buch von Laura Gehlhaar und folgt ihr auf Instagram. Folgt außerdem: Christiane Link, Tabea & Marian, Natalie Dedreux und klickt euch von Account zu Account – allein durch’s Zuhören kann man hier schon viel lernen. Eine gute Website zum Einstieg: leidmedien.de. Außerdem als Website und Film: Die Kinder der Utopie. Und auch ein guter Film: Das Märchen von der Inklusion. Unsere Postkarte kennst du vielleicht? Da sind drei imaginäre Elternwünsche drauf: Allein aufs Klo, in einem Haushalt ohne Sand leben oder Netflix & Chill statt Abwasch und Müll. Welchen würdest du ankreuzen? Definitv: allein aufs Klo. Ninias Top 10 Marta Breen - Rebellische Frauen - Women in Battle: 150 Jahre Kampf für Freiheit, Gleichheit, Schwesterlichkeit Ich lese sehr gerne Graphic Novels - und in den letzten Jahren ist da super viel zu feministischen und empowernden Themen entstanden. Dieser Band beschäftigt sich mit 150 Jahre Frauengeschichte. (Ansonsten alles von Liv Strömquist!) Goto suhrkamp.de + Add to list James Frey - Strahlend schöner Morgen Stichwort verschiedene Geschichten. Dieses Buch hat mich nicht mehr losgelassen und ich empfehle es wirklich sehr oft. Ich habe es super schnell gelesen, obwohl ich dicke Bücher hasse. Sehr viele Figuren, sie alle mit ihren eigenen Geschichten, alle in LA, alle irgendwie verloren und hoffnungslos. Ein tolles Buch! Goto ullstein-buchverlage.de + Add to list Miku Sophie Kühmel - Kintsugi Vor zwei Jahren hat Miku jeden meiner Podcast-Texte für Audible besser gemacht - dieses Jahr war sie mit ihrem Roman für den Deutschen Buchpreis nominiert und hat zahlreiche Preise gewonnen. Eine Geschichte, erzählt aus vier verschiedenen Perspektiven. Gefühlvoll beobachtet, dialogstark - das ist eh immer mein Ding. Ich mochte das Buch sehr. Goto fischerverlage.de + Add to list Joyce Johnson - Zaunköniginnen Johnson war kurze Zeit die Lebensgefährtin vom berühmten Jack Kerouac. Dabei war sie so viel mehr - ausgezeichnete Schriftstellerin, tolle Beobachterin, mutige Frau. Hier schreibt sie über die Frauen der Beatpoeten-Szene, nimmt mit ins New York der 50er Jahre und ist dabei so voller Neugier und Spannung, dass es eine Freude ist, sie zu begleiten. Goto edition-nautilus.de + Add to list Fatma Aydemir, Hengameh Yaghoobifarah - Eure Heimat ist unser Albtraum Das Buch ist ein Manifest gegen Heimat, gegen den Heimatbegriff und ein Protokoll der aktuellen gesellschaftlichen und politischen Situation. 14 Autor_innen schreiben über ihre rassistischen und antisemitischen Erfahrungen - ein Buch, das aus meiner Sicht in den Schulunterricht gehört und mit Sicherheit für spannende Gespräche beim Familienessen sorgt. Goto genialokal.de + Add to list Svenja Gräfen - Freiraum Gräfen ist eine unfassbar gute Erzählerin. Feingliedrig nimmt sie ihre Protagonistinnen auseinander, lässt sie Konflikte nur langsam begreifen, um dann umso mehr zu zerstören. Die Geschichte hat mir gerade aufgrund ihrer Aktualität und der dennoch ungewöhnlichen Zusammensetzung der Figuren besonders gut gefallen. Goto genialokal.de + Add to list Julia Korbik - Stand up Das beste Buch für Menschen, die sich für Feminismus begeistern oder andere dafür begeistern wollen. Ein Sachbuch, das Spaß macht, anleitet zum Kritischsein und einen super Überblick bereitet. Goto keinundaber.ch + Add to list Hollie McNish - Das sagt einem ja keiner Für mich das einzig wahre Buch zur Schwangerschaft und zum Muttersein. Meine Bibel der ersten Jahre. Hollie ist so poetisch und gleichzeitig realistisch, authentisch und wahrhaftig, dass es fast weh tut, ihre Texte zu eine und sich selbst darin wiederzukennen. Dieses Buch hat mich gerettet und mir die Freude am Schreiben nach der Geburt wiedergegeben. Goto genialokal.de + Add to list Johannes Floehr - Dialoge Johannes ist Floehr ist mein persönlicher Twitterkönig. Er bringt in kurzen, teilweise absurd witzigen Dialogen die Lage auf den Punkt. Das Buch versammelt seine besten Ergüsse - ich bin mir sicher, es hat nicht genug Seiten. Aber genug, um mit einem Auge lachend und einem traurig zu weinen allemal. Goto lektora.de + Add to list Jackie Thomae - Momente der Klarheit Thomae ist eine Meisterin der Dialoge (ihr merkt, Dialoge sind mein Ding). Hier kommt ein weiterer Aspekt hinzu, den ich liebe - verschiedene Geschichten zu einer verwebt. Man will die Figuren am liebsten schütteln, weil sie so viel Blödsinn machen und merkt auch dabei - es geht trotzdem immer weiter. Thomae hat 2019 einen neuen Roman veröffentlicht: Brüder. Der ebenfalls für den Deutschen Buchpreis nominiert war, mit Sicherheit zu Recht, hab ich nur noch nicht geschafft - sonst würde ich ihn auch empfehlen. Goto hanser-literaturverlage.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)"
author = "Wishlephant"
year_published = 2012
