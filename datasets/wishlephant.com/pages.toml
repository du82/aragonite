["http://wishlephant.com/wishlists/bda4e1c5-cc4f-4eed-a297-045b579ba69b"]
title = "Wishlephant - Reprodukt: Kinder-Comic-Lieblinge von Mona"
description = "Check out this awesome list of presents!"
full_description = 'Reprodukt: Kinder-Comic-Lieblinge von Mona by Wishlephant Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Jim Curious – Streifzug durch den Dschungel Für Kleine und Große. Ein wahrlich beeindruckendes 3D-Abenteuer für große und kleine Leser*innen, in dem der Zeichner Matthias Picard den Dschungel zum Leben erweckt. Wie gucken das Buch zu Hause gern zusammen an und genießen die Reise zu den wilden Tieren vom Sofa aus (kommt praktischerweise mit zwei 3D-Brillen). Da kann ich mich fast nicht entscheiden, welche Version ich besser finde: JIM CURIOUS im Dschungel oder in den Tiefen des Ozeans (das war der erste Band). Schmetterlinge, Haie, Riesenschildkröten, … ach, beide sind großartig! €20.00 Goto reprodukt.com + Add to list Akissi – Vorsicht, fliegende Schafe! Für Kinder ab 5-6 Jahre / auch toll für Erstleser. Akissi wohnt an der Elfenbeinküste und gibt uns einen herrlich anarchistischen Einblick in ihren Alltag: Ob beim Fußball spielen mit ihren Freunden, beim Zahnarztbesuch oder in der Schule - Akissi ist nie um einen Einfall verlegen… Es gibt mittlerweile schon zwei Bände der Serie und mein Vierjähriger lässt sich die Geschichten sehr gern vorlesen („Mama! Noch eine!“). Akissi ist übrigens die kleine Schwester von Aya aus dem gleichnamigen Comic, der auch bei Reprodukt erschienen ist. Noch eine Empfehlung! €18.00 Goto reprodukt.com + Add to list Lehmriese lebt! Für Kinder ab 5-6 Jahre / auch toll für Erstleser. Noch eine meiner Lieblingszeicherinnen: Anke Kuhl erzählt hier eine sehr witzige Geschichte von den Freunden Olli und Ulla, die einen wunderbaren Lehmriesen bauen. Womit die beiden nicht gerechnet haben: Über Nacht erwacht der Riese zum Leben und macht sich auf den Weg in die Stadt. Eigentlich ist der Lehmriese ganz freundlich! Er findet aber seinen Platz unter den Menschen nicht und stiftet versehentlich ein ziemliches Chaos – mit viel Liebe zum Detail erzählt und besonders schön und witzig sind die Schmuckseiten, die Anke Kuhl eingebaut hat. Das Buch ist jedes Mal wieder der Knaller, wenn ich es zu Hause oder im Kinderladen vorlese. €18.00 Goto reprodukt.com + Add to list Das größte Geschenk der Welt Für Kinder ab 2 Jahre. Bei uns zu Hause ist die Hundebande von Dorothée de Monfreid ganz hoch im Kurs. Besonders schön finde ich diesen Band, in dem Micha, Popow, Zaza und ihre Freunde gemeinsam Weihnachten feiern und alle Hunde ihre ganz eigenen Wünsche an den Weihnachtsmann vortragen… die Zeichnerin hat mit ihren Hunden eine liebenswerte Rasselbande von der Leine gelassen, in deren Erlebnissen sich sowohl meine Zweijährige als auch der große Bruder (fast 5) wiederfinden können. €14.00 Goto reprodukt.com + Add to list Antonia war schon mal da Bilderbuch / für Kinder ab 3 Jahre. Ein wunderschön gezeichnetes, wimmeliges Reisebilderbuch, in dem man bei jedem Lesen etwas Neues entdecken kann. Biber und seine Freunde Buntspecht, Molch und Igel wollen die weite Welt entdecken — nur Antonia hat keine Lust. Die vier machen sich eben ohne ihre Freundin auf die Socken und stellen erstaunt fest: ob hoch in den Bergen oder in den Tiefen des Meeres… Antonia war schon mal da! Max Fiedler ist einer meiner liebsten Zeichner, seine Zeichnungen sind so liebevoll, bunt und vollgepackt mit großartigen Ideen. €16.00 Goto reprodukt.com + Add to list 5 wishes'
