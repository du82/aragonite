full_description = '''Wishlephant-Lieblinge by Wishlephant Hier sammeln wir all unsere Lieblinge, und was wir in unseren Instagram-Stories vorstellen. Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Pardalita - Joana Estrela Einfühlsame, mit Preisen ausgezeichnete Graphic Novel über die erste queere Liebe, das Sich-Finden und den Wünschen und Vorstellungen über das eigene Leben von der portugiesischen Autorin Joana Estrella. €24.00 Goto genialokal.de + Add to list 288 kunterbunte Fädelbuchstaben €24.95 Goto betzold.de + Add to list DIMENSIONS EK Success Stanzmaschine, Kreisform, 6,35 cm Goto amazon.de + Add to list woopie! Code Breaker Spiel Ich kenn das Spiel noch unter dem Namen "Mastermind", man findet es auch gebraucht auf Kleinanzeigen und in verschiedensten Ausführungen. Wir haben das hier. Goto amazon.de + Add to list Daunen-Alternative Snugglemeister Bettdecke wirklich die allertollste bettdecke, die wir hier je hatten. wir haben jetzt nach und nach eine für jedes familienmitglied. €80.00 Goto linenbundle.eu + Add to list Bastelbox Kartenset Winter & Weihnachten mit LED-Lämpchen CHF32.90 Goto kiludo.ch + Add to list AllesKönnerKiste Filz-Werkstatt für Anfänger, Bastelset für kreative Kinder ab 8 Jahren Trockenfilzen! ♡ Goto amazon.de + Add to list Deluxe Pink Dragonfly - Studio Roof mal in ganz ausgefallener Größe basteln! Bei Studio Roof gibts aber auch Sets ab 6 € - von ganz kleinen Vögeln über Seepferdchen und Blumenkränzen. €49.95 Goto studioroof.com + Add to list BBC Micro:Bit V2 - Education Set "Die Reise mit dem micro:bit V2 €34.80 Goto reichelt.de + Add to list Kontrastkarten 8er Set €1.20 Goto avalino.shop + Add to list Holz-Ring, natur, Ø 100mm außen €2.19 Goto kreativ-depot.de + Add to list Boris, Babette und lauter Skelette - Tanja Esch Preisgekröter Comic über Identitätsfindung und den eigenen Platz in der Welt anhand der süßen, anrührenden und grusel-liebenden Babette. €20.00 Goto genialokal.de + Add to list Zauberstempel €27.90 Goto manufactum.de + Add to list Selma tauscht Sachen - Martin Baltscheit €15.00 Goto genialokal.de + Add to list POLLE #11 €12.00 Goto pe-ri-dot.com + Add to list Mabula Goto steffen-spiele.com + Add to list Q-R-T: Nächste Stunde: Außerirdisch - Ferdinand Lutz €14.00 Goto genialokal.de + Add to list Rosa und Louis 2 - Ferdinand Lutz €12.00 Goto genialokal.de + Add to list Rosa und Louis 1 - Ferdinand Lutz €12.00 Goto genialokal.de + Add to list folia 455409 - Fensterfolie, selbsthaftend, transparent, farbig sortiert, ca. 23 x 33cm, 10 Blatt - ideal zur Gestaltung von Fensterbildern Goto amazon.de + Add to list Milo tanzt - Anne Becker SO EIN GUTES BUCH - HABS FAST IN EINEM RUTSCH DURCHGELESEN. NICHT ZU SCHWER, NICHT ZU LEICHT, ES GEHT VIEL UM FREUNDSCHAFT, VORURTEILE, SCHULE UND NATÜRLICH BALLETT! BESONDERS DIE ELTERN FAND ICH SEHR ERFRISCHEND UNSTEREOTYP €14.00 Goto genialokal.de + Add to list Nimona - ND Stevenson Ganz großartiges Comic! Die gleichnamige OSCAR-nominierte Verfilmung kann man auf Netflix schauen. €19.00 Goto genialokal.de + Add to list Gipsschale schwarz Ø 150 mm €1.79 Goto toom.de + Add to list Fassadenpinsel lang 80 mm €6.39 Goto toom.de + Add to list Hakenmagnet gummiert mit Neodym drehbar Ø68 mm €3.99 Goto magnethandel.de + Add to list Hakenmagnet gummiert mit Neodym drehbar Ø53 mm €2.49 Goto magnethandel.de + Add to list folia 731100 - Basic Mix Scoubidou Flechtschnüre, 100 Stück sortiert in 10 verschiedenen Farben - ideal zum Flechten von Armbändern, Schlüsselanhängern, usw. Goto amazon.de + Add to list In Gucci zu Netto - Maurizio Onanao Das Leben zwischen Dating Apps, Netto-Einkäufen, weirden Leuten, die sich beim Urinal direkt neben dich stellen und dem Typ, der einem nicht gut tut, den man aber doch zu oft zum Seggs trifft: »In Gucci zum Netto« ist ein queerer Comic von Maurizio Onano, der atmosphärisch, lustig und bisschen melancholisch aus dem Leben eines schwulen jungen Mannes erzählt, der seinen Platz im Leben und auf der Couch sucht. Sehr nahbar und funny und berührend. €16.00 Goto jajaverlag.com + Add to list The House in the Cerulean Sea - T. J. Klune Sooo cosy, so gay, so schön! Lieblings Fantasy-Roman seit langem €19.00 Goto genialokal.de + Add to list Lichterland 3. Das Geheimnis des schlafenden Drachen - Carolin Jelden €16.00 Goto genialokal.de + Add to list Glitzersteine Edelsteine Kinder Gesicht Körper Festival Schminke Goto amazon.de + Add to list Becherset Tipp: Unter “Farbstreifen” findet man auch günstigere (oft aber auch kleinere) Becherchen/Döschen im Netz €3.90 Goto modulor.de + Add to list Das große Geschenke-Bastelbuch für Kinder - Yvonne Skowronek €19.99 Goto genialokal.de + Add to list Magic Gel Kühlpad Die größere Variante von beiden (60cm) reicht über den ganzen Rücken, das ist toll! Kostet natürlich bisschen mehr. Goto amazon.de + Add to list Paula - Liebesbrief des Schreckens - Sandra Brandstätter €18.00 Goto genialokal.de + Add to list Schöner Po Salbei & Rosa Badematte €35.00 Goto urbanoutfitters.com + Add to list Get Naked Rosa & Orange Badematte €35.00 Goto urbanoutfitters.com + Add to list 22 Bahnen - Caroline Wahl ISBN: 38-3216-724-2 €13.00 Goto genialokal.de + Add to list Momo ist das alles viel zu viel €13.90 Goto brimborium-verlag.de + Add to list Funny Story - Emily Henry €17.50 Goto genialokal.de + Add to list More Gay Books Vinyl-Aufkleber €2.94 Goto etsy.com + Add to list offene Musselinjacke mehrfarbig (freie Farbwahl) €66.00 Goto piccolen.com + Add to list Kunst ohne Dach - Udo Lange, Thomas Stadelmann €22.90 Goto genialokal.de + Add to list Ich bin hier! - Joke van Leeuwen €15.00 Goto genialokal.de + Add to list LIEBE - Stephen Hogtun €16.00 Goto genialokal.de + Add to list POLLE #10 Wie toll ist das bitte - ein Comicmagazin für Kinder ab 7! Es gibt Geschichten von verschiedenstens Autor*innen, die man so entdecken kann, Rätsel, Mitmachaktionen und keine Werbung. Schöner können Kinder nicht ans (Comic)lesen herangeführt werden. Gibts auch als Abo ♡ €12.00 Goto pe-ri-dot.com + Add to list Wer war's? - Kinderspiel des Jahres 2008 €40.22 Goto thalia.de + Add to list BOOKii® Hören und Staunen Heimische Vögel - Bärbel Oftring Mein absolutes Lieblingsbuch zum Erkennen-Lernen der Vögel um mich rum. 🥰 €19.95 Goto genialokal.de + Add to list Manno! - Anke Kuhl ab 7, sehr lustiges Buch über das Aufwachsen mit einer Schwester aus dem Leben von der Illustratorin Anke Kuhl €18.00 Goto genialokal.de + Add to list Mira #freunde #zahnspange #kleineschwester - Sabine Lemire empfohlen ab 10 lustige reihe über das schwedische mädchen mira. der witz und die leichtigkeit gefällt mir sehr gut, auch wenn ernste themen verhandelt werden (bullying, patchworkfamilie, eifersucht, pubertät) €16.00 Goto genialokal.de + Add to list Anno und Issa - Linnea Lundborg Illustrationen von Ylva Oknelid €15.00 Goto genialokal.de + Add to list Bauchgefühle - Raina Telgemeier ISBN: 37-4320-995-0 €18.00 Goto genialokal.de + Add to list Sisters - Raina Telgemeier €17.00 Goto genialokal.de + Add to list Reputation - Lex Croucher €11.50 Goto genialokal.de + Add to list Gwen and Art Are Not in Love - Lex Croucher €11.50 Goto genialokal.de + Add to list Countdown mit der Maus ein wiederverwendbarer Countdown zum ersten Schultag, den Ferien, Geburtstag, Weihnachtachten.. toll! ISBN: 38-3036-440-7 €8.00 Goto genialokal.de + Add to list Smile (Smile-Reihe, Band 1) - Raina Telgemeier ab 10 Jahren €15.00 Goto genialokal.de + Add to list Genderqueer – Eine nichtbinäre Autobiografie die dt. Fassung erscheint im Mai bei Reprodukt €2.00 Goto reprodukt.com + Add to list Gender Queer: A Memoir Deluxe Edition die originalfassung Goto amazon.de + Add to list Die Kunst des Verschwindens €14.00 Goto genialokal.de + Add to list Yearbook Ich fand besonders das Hörbuch toll (das findet ihr auf verschiedenen Plattformen sicher), weil er es selbst zusammen mit anderen so großartig und unglaublich witzig liest, dass ich das allen empfehlen will! Aber wer lieber liest, hier ist das Taschenbuch. €13.00 Goto genialokal.de + Add to list Gewässer im Ziplock €23.00 Goto genialokal.de + Add to list Kommst du mit? Schöner Stadtspaziergang durch eine italienische Staft mit wenig Worten und wunderschönen Bildern. Empfohlen von Ilona Stütz €22.50 Goto genialokal.de + Add to list Das Jungfernhäutchen gibt es nicht €18.00 Goto genialokal.de + Add to list Bastelset, Geburtstagstafel €4.95 Goto fridolin-shop.de + Add to list »Gib mir mal die Hautfarbe« €18.00 Goto genialokal.de + Add to list Gutschein Online-Kunst-Workshop für Familien, Kinder und Jugendliche Es gibt auch Workshops für Erwachsene ♡ €30.00 Goto kinderkunsthaus.de + Add to list Pizzakatze für alle die Katzen oder Pizza lieben und vor allem Reime! Süßes, klischeearmes Bilderbuch über die tolle Pizzakatze. ab 3 Jahren €15.00 Goto genialokal.de + Add to list Für Sorge €16.00 Goto genialokal.de + Add to list Lichterland 1. Die Suche nach dem magischen Amulett Aus der Liste der klischeearmen Vorlesebücher, empfohlen von Jo Lücke. Das hat mich total gepackt und ich selbst kann es kaum weglegen - das fehlt mir oft bei Kinderbüchern, die sonst ziemlich viel richtig machen, was so diverse Charaktere und klischeearme Storylines angeht. Auch Teil 2 soll genauso spannend sein! Yay! €16.00 Goto genialokal.de + Add to list Bloom Für alle, die Heartstopper mochten! Sweete queere Freunde-turned-Lovers Graphic Novel , die in einer griechischen Bäckerei spielt. Ab 12 Jahren €19.50 Goto genialokal.de + Add to list Afd-lügt-Sticker von @wimmelsteph Für eine Bestellung, schreibt ihr am besten eine DM auf Instagram + Add to list Wolkentiere und Quadrat €25.00 Goto genialokal.de + Add to list Augenstempel Perlenfischer X WE LIKE MONDAYS €2.99 Goto wlkmndys.com + Add to list Bügelbild "Rosa Fluff" | Krullenbol super süßes Bügelbild von der Illustratorin @Judithmachtdas. €3.90 Goto krullenbol.de + Add to list Blue Orange - Taco Katze Ziege Käse Pizza ein sehr lustiges Reaktions-Kartenspiel bei dem es darum geht, die Schnellste zu sein und alle Karten einzuheimsen. €11.99 Goto thalia.de + Add to list Linus liebt Licht - Anna Mendel und Jasmin Sturm Linus liebt.. Licht, Geschwindigkeit, Gras, Wasser und Laute. Linus ist Autist und wir begleiten ihn durch den Tag und lernen wie Stimming bei im aussieht. Ein wirklich zauberhaft gemachtes Buch, das Kindern und Erwachsenen in ganz einfachen Bildern und Texten das Innenleben von autistischen und neuridivergenten Menschen nahe bringt. €12.90 Goto brimborium-verlag.de + Add to list Sun und Shiro und die gelb gepunktete Schlange ein Märchen über die Freundschaft €12.90 Goto genialokal.de + Add to list 78 wishes'''
