["http://wishlephant.com/blog/2023-12-03-buchgeschenke"]
title = "Wishlephant - Blog - Besondere Bücher für Kinder ab Sechs"
description = "Unser Familien-Weihnachtsbuch dieses Jahr. Mischlingshund Jim soll für seinen Besitzer die erste serienmäßig produzierte Weihnachtskarte  an Queen Victoria übergeben und sorgt dabei für ordentlich Trubel. Mit britischem Flair und Augenzwinkern erzählt Emma Thompson (übersetzt von Anu Stohner) eine ganz besondere, auf wahren Begebenheiten beruhende Geschichte. Dazu die Illustrationen von Axel Scheffler - herrlich!"
full_description = 'Besondere Bücher für Kinder ab Sechs Johanna hat zehn großartige Buchgeschenktipps für uns zusammengestellt 03.12.2023 Danke für die tolle Liste! Magst du für die, die dich noch nicht kennen, dich kurz vorstellen? Ich bin Johanna, bald 39 Jahre und lebe mit meinen drei Kindern (9 Jahre, 6 Jahre und 2 Jahre) und meinem Mann am Bodensee. Bücher gehören schon seit ich denken kann bei mir dazu. In unserer Dorfbibliothek hatte ich in der dritten Klasse alle Kinderbücher durchgelesen. Da war es vermutlich nur konsequent, dass ich nach dem Studium in der Buchhandlung gelandet bin. Wann kommst du so zum Lesen als Elternteil? Zu selten, leider. Meistens lese ich den Kindern vor. Deshalb sind mir gute Kinderbücher so wichtig: Ich möchte auch Freude am Vorlesen haben. Wenn ich momentan für mich lese, dann hauptsächlich e-Books. Das ist zwar ein anderes Gefühl als ein „echtes“ Buch in der Hand zu halten, aber auch unschlagbar praktisch für die Einschlafbegleitung... Welches Buch verschenkst du zu Weihnachten? "Jims brillante Weihnachten“ von Emma Thompson mit Bildern von Axel Scheffler (übersetzt von Ann Stohner), weil die Geschichte um den Mischlingshund Jim, der Queen Victoria eine Weihnachtskarte überbringen soll, Menschen jeden Alters begeistern wird. Die Frauen in meinem Leben bekommen "Marschlande“ von Jarka Kubsova. Die historische Geschichte um eine Frau, die im 16. Jahrhundert allein ihren Hof in den Marschlanden nahe Hamburg bestellt und damit die Missgunst der mächtigen Männer auf sich zieht, hat mich nachhaltig beeindruckt. Was wünschst du dir? Viele gute Bücher von Frauen. Und das neue „Splendide“-Kochbuch. Unsere Postkarte kennst du vielleicht: Da sind drei imaginäre Elternwünsche drauf: Allein aufs Klo, in einem Haushalt ohne Sand leben oder Netflix & Chill statt Abwasch und Müll. Welchen würdest du ankreuzen? Netflix & Chill statt Abwasch und Müll. Der Haushalt kann warten! Emma Thompson / Axel Scheffler: Jims brillante Weihnachten Unser Familien-Weihnachtsbuch dieses Jahr. Mischlingshund Jim soll für seinen Besitzer die erste serienmäßig produzierte Weihnachtskarte an Queen Victoria übergeben und sorgt dabei für ordentlich Trubel. Mit britischem Flair und Augenzwinkern erzählt Emma Thompson (übersetzt von Anu Stohner) eine ganz besondere, auf wahren Begebenheiten beruhende Geschichte. Dazu die Illustrationen von Axel Scheffler - herrlich! Goto beltz.de POLLE Für alle Comic-Fans ab 7 Jahren ist zweimal im Jahr ein Jubeltag: Wenn die neue Polle, randvoll mit tollsten Kindercomics von großartigen Künstler*innen im Briefkasten liegt. Goto pe-ri-dot.com Timothée de Fombelle: Hinter dem Schnee Drei Wege kreuzen sich in dieser berührenden Geschichte am Weihnachtsabend. Ein Eiswagenfahrer ist auf dem Heimweg von Italien nach England, eine Schwalbe möchte den Winter sehen und fliegt Richtung Norden und ein Unbekannter reist alleine und heimlich. Über Schicksal, Nächstenliebe und Hilfsbereitschaft. Für Kinder ab 10 Jahren und für Erwachsene. Goto genialokal.de Glow – Das wundersame Leuchten der Natur Was für ein Sachbuch! Ob in der Tiefsee oder im Wald - Biolumineszenz heißt das Phänomen, das es überall auf der Erde schimmern und strahlen lässt. Die leuchtenden Illustrationen auf dunklem Grund von Jennifer N.R. Smith ziehen sofort in ihren Bann und machen Lust darauf, tief in die Welt der Biolumineszenz einzutauchen. Für Neugierige ab 8 Jahren. Goto genialokal.de Mimi, Jakob und die sprechenden Hunde Jakob verbringt seine Ferien bei seiner Cousine Mimi in der Moskauer Vorstadt, einem heruntergekommenen Stadtteil von Riga, in dem auch ein Rudel sprechender Hunde wohnt. Als einer der Hunde verschwindet und ein skrupelloser Immobilienhai das Viertel gentrifizieren möchte, beschließen Mimi und Jakob die Moskauer Vorstadt zu retten. Ein Kindercomic ab 6 Jahren, der wichtige gesellschaftliche Themen mit viel Humor vermittelt. Goto reprodukt.com Saša Stanišić, Regina Kehn (Illustrationen): Wolf Zwei Außenseiter treffen beim Ferienlager im Wald aufeinander - einer wird zum Opfer der lauten Mehrheit, der andere ist zunächst froh, aus der Schusslinie zu sein. Ein mutmachendes Buch mit Herzenswärme und Humor für alle Kinder, die ihren Platz suchen. Goto genialokal.de Torben Kuhlmann: Die graue Stadt Mit ihrem gelben Regenmantel ist Robin der einzige Farbtupfer in der Stadt. Sie scheint allein zu sein mit ihrer Liebe zu den Farben. Doch sie findet Verbündete und mit ihnen einen Weg aus dem Grau. Detailreich und unglaublich atmosphärisch illustrierte Geschichte über den Mut, anders zu sein. Ab 8 Jahren. Goto genialokal.de Laura Scharf: Das Geheimnis von Nox 1: Licht, Schatten - Flederratten! Auftakt einer neuen, fantastischen Buchreihe rund um den Tagling Fill, der sich plötzlich in Nox, dem Land der Nacht, wiederfindet. Hier herrschen ewige Dunkelheit und die Wesen der Nacht. Mit dem Nachtling-Mädchen Issa erlebt Fill dort die spannendsten Abenteuer. Für alle ab 10 Jahren, die nicht nur Nervenkitzel suchen, sondern beim Lesen auch viel Lachen möchten. Goto genialokal.de Oliver Jeffers: Da ist ein Gespenst im Haus Ein Mädchen ist überzeugt, dass es in ihrem Haus spukt - doch egal, wo sie auch sucht, sie findet kein Gespenst. Und wir Lesenden? Können auf den transparenten Seiten auf unsere eigene Gespenstersuche gehen. Genial gemachter Bilderbuchspaß, der auch größere Kinder in seinen Bann zieht. Goto genialokal.de Minna Melone - Wundersame Geschichten aus dem Wahrlichwald Im Wahrlichwald geht alles seinen gewohnten, beschaulichen Gang. Bis eines Tages Wanderratte Minna Melone mit ihrem Zurkuswagen auftaucht und den Tieren des Waldes allabendlich die abenteuerlichsten Geschichten erzählt. Ein Vorlesebuch für Kinder ab 6 Jahren, das die Kraft der Phantasie feiert. Goto genialokal.de Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)'
