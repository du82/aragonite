Kinder tolle Malbücher werden können. Weniger rumfliegende einzelne Papiere, und so hat man gleich eine prima Aufbewahrung für ihre Kunstwerke, wenn sie die gleich ins Büchlein reinmalen. €9.31 Goto gerstaecker.de + Add to list Paper Poetry Tape Set Acid Leo 5teilig Washitape gibts in allen erdenklichen Farben und Mustern- und gehört einfach in jedes Kinderzimmer von bastelfreudigen Kindern. €10.99 Goto rico-design.com + Add to list Tape Art Kit Papier Rainbow online kaufen | Modulor so ein schönes Set. Haben wir hier auch zuhause. Hält gut und einige Jahre, weil es echt viel ist pro Rolle. Gibt es auch einzeln zu kaufen. €39.90 Goto modulor.de + Add to list Textilstifte neon 5 Stück für Neonfans ♡ €11.79 Goto rico-design.com + Add to list Buntstift STABILO® woody 3in1 duo 5er-Set mit Spitzer die Klassiker in coolem Zweifarben-Design €17.35 Goto tausendkind.de + Add to list Expedition Natur Sitzmatte für Draußenkinder, so bleibt der Po warm :) €5.95 Goto moses-verlag.de + Add to list Stoffpuppe EVI (35cm) €16.95 Goto tausendkind.de + Add to list Bluey: Heeler-Familienwagen inklusive Bandit-Figur für alle Bluey-Fans! Goto amazon.de + Add to list Triola 12 Seydel 70120 | Blasharmonika mit 12 Tönen inkl. Spielanleitung mit Liedbeispielen Goto amazon.de + Add to list small foot Die Maus Lernuhr mit Kalender aus Holz Goto amazon.de + Add to list Projektionsleuchte zum Geschichtenerzählen "Trois Lapins" €17.90 Goto lottiklein.de + Add to list Kugelbahn: 213- teiliger maxi Baukasten Hier lohnt es sich auch, auf Kleinanzeigen usw. nach gebrauchten Bahnen zu schauen. Macht auf jeden Fall Megaspaß zu spielen. €120.99 Goto tausendkind.de + Add to list Günther Flugkreisel 2 Rotor.Twirly €6.99 Goto tausendkind.de + Add to list Land-Haus-Shop Kinder Gartengeräte Set 4 TLG, Besen Harke Rechen Schippe Garten Geräte Spielzeug Kindergartengeräte sind wirklich der Renner für die Kleinen. Diese Geräte gibts auch einzeln und in den meisten Baumärkten findet man auch tolle Versionen und auch Kinderschubkarren. Goto amazon.de + Add to list Seifenblasen-Set XL SOMMERKINDER €12.95 Goto tausendkind.de + Add to list Relaxdays 10024940 Seifenblasenmaschine "Frosch" 13cm, Seifenblasen für Kindergeburtstag und Hochzeit, Mini Bubble Machine, grün Goto amazon.de + Add to list LENA® Sandspielzeug "Betonmischer klein" €7.99 Goto tausendkind.de + Add to list Wasserspielzeug KATAMARAN - OKTOPUS aus Holz €13.59 Goto tausendkind.de + Add to list Kids Stäbchen Training, Cute Learning Stäbchen mit Training Grip für Kinder und Anfänger Lernen, Essstäbchen zu Verwenden (Blau) war hier mal sehr gewünscht und klappt echt gut. Goto amazon.de + Add to list Dino Nackenkissen Tyrannosaurus €24.95 Goto moses-verlag.de + Add to list Wieso? Weshalb? Warum? Stickerheft: Feuerwehr €7.99 Goto thalia.de + Add to list Lenco Kinder Karaoke Mikrofon Panda €34.99 Goto smythstoys.com + Add to list Scooter Tretroller B1 500 Kinder DER Roller schlechthin. Mit den LED-Licht-Rädern einfach das coolste Teil weit und breit. €49.99 Goto decathlon.de + Add to list traturio Hüpfmatratze Kinder Indoor/Outdoor War bei uns eine der allerbesten Anschaffungen. Goto amazon.de + Add to list Hape Großer Baukran aus Holz, 10-teilig €45.59 Goto tausendkind.de + Add to list Carla Caramel nominiert zum Kinderspiel des Jahres 2023, kollaborativer Eisspaß! Sehr süß und schön gemacht Goto amazon.de + Add to list Kartenhalter gelb So eine tolle Erfindung. So macht das Kartenspielen für kleine Kinder erst richtig Spaß, weil sie es supergut halten können. €2.79 Goto spiele-offensive.de + Add to list Hasbro - Kristallica Hier darf gehämmert werden was das Zeug hält - und zwar wird die Eisscholle immer kleiner - nur der Pinguin muss stehen bleiben. Lustiges Geschicklichkeitsspiel. €24.91 Goto thalia.de + Add to list Dobble Kids Spiel Der Kracher! Ein Schnelligkeitsspiel, bei dem man die gleichen Tiere suchen muss. Dobble ist so beliebt, dass es inzwischen auch Harry Potter-Version gibt, eine Version mit wasserfesten Karten und und und. Altersempfehlung: 4-8. Wir haben es mit befreundeten Kindern (7 und 11) um die Wette gespielt und sie haben uns abgezockt. Mit den Kleinsten (ab 3 würden wir es empfehlen) kann man das Spiel einfach langsam spielen. €11.89 Goto spiele-offensive.de + Add to list Blue Orange | Kitty Bitty | Kinderspiel | Lernspiel eines unser absoluten Lieblingsspiele! Sehr absurd und witziges Suchspiel, in dem die Katzenkinder die Katzeneltern austricksen wollen und mit den Wollknäueln spielen. ab 4 Jahren Goto amazon.de + Add to list Speedy Roll - Kinderspiel des Jahres 2020 Ein schönes kollaboratives Spiel, in dem die Igel vor dem Fuchs flüchten. "Gewürfelt" wird mit einem Tennisball. Und die Kleinen lieben es, den Ball zu rollen, an dem dann die Klett-Symbole festkleben. Schöne Idee! Altersempfehlung: 8 Jahre, wir haben das auch schon mit angepasst mit 3-4 Jahren gespielt. Strategisch spielen können dann die älteren Kinder sicher gut. €20.99 Goto spiele-offensive.de + Add to list FotoFish Dieses süße Spiel ist zum Kinderspiel des Jahres 2020 nominiert und ein richtig kreatives Suchspiel. Man würfelt zwei Farben (oder eine, wenn die Kinder kleiner sind) und sucht dann mit der Kamera zwei Fische in den gewürfelten Farben. Es gibt eine schwere und eine leichtere Spielbrettseite, die man je nach Alter auswählen kann. Das war das erste Spiel, was wir für unsere Tochter gekauft haben, und es macht wirklich viel Spaß, vor allem auch den süßen Fisch wachsen zu sehen, den man von Runde zu Runde weiterpuzzeln kann. Altersempfehlung: ab 4 Jahren, mit vereinfachten Regeln geht das locker schon ab 3. €24.99 Goto spiele-offensive.de + Add to list Clack! Ein Schnelligkeitsspiel. Clack! ist vom "Halli-Galli"Erfinder und macht auch wieder Spaß, weil man mit magnetischen Scheiben spielt und die so schön CLACK machen. Die Symbole, die gewürfelt werden, müssen schnellstmöglich auf den Talern gefunden und eingesammelt werden. Einziger Wehmutstropfen: Das Spiel ist am anfang meist sehr schnell und lustig und dann dauert es, wenn nur noch ein paar Scheiben übrig sind und man mehrmals würfeln muss, bis wieder Action reinkommt. (Vorsicht, nicht verwechseln mit Clack! Familiy, das ist ein Kartenspiel ab 7 Jahren) Altersempfehlung: ab 4 Jahren €15.19 Goto spiele-offensive.de + Add to list Affenbande (Ravensburger) Spiel Ganz einfaches Ziehspiel, das Spaß macht. Die Kinder lieben es einfach, mit geschlossenen Augen in das Säckchen zu greifen und hoffentlich den Affen in ihrer Farbe zu erwischen. Altersempfehlung: ab 3, aber wir denken, sobald die Kleinen keine Dinge mehr in den Mund stecken, kann es losgehen. Weil es so einfach zu spielen ist. €7.69 Goto spiele-offensive.de + Add to list UNO Junior Spiel Der Klassiker unter den Kinderkartenspielen. Funktioniert auch wirklich toll und wer darauf Wert legt: die Kleinen lernen nebenbei sogar Zahlen lesen. Altersempfehlung: Ab 3 Jahren €7.00 Goto spiele-offensive.de + Add to list Ich bin anders als du - Ich bin wie du: Das große Bilderbuch zum Vor- und Mitlesen Mehr Büchertipps für 4jährige gibts auf unseren Bücherlisten: https://wishlephant.com/gift-ideas#b%C3%BCcher €16.00 Goto genialokal.de + Add to list Das geheime Leben der Popel Ein supergut aufbereitetes Sachbuch mit witzigen Illustrationen, rund ums Thema Nasenschleim, Rotze, Popel, you name it.– lesenswert für die ganze Familie. ISBN: 978-39-5728-464-8 €14.00 Goto genialokal.de + Add to list Hier kommt Harry! Harry ist ein Hase wie alle anderen auch. Deshalb macht er auch alles genauso wie die anderen. Er hoppelt, wenn die anderen hoppeln, und hopst, wenn die anderen hopsen. Aber irgendwie geht es ihm damit nicht gut. Er hat nämlich einen Traum. Nicht Möhren gehört sein Herz, sondern ... dem Tanzen! Er träumt von glitzernden Discokugeln und toller Musik. Schritt für Schritt setzt er seinen Traum in die Tat um. Als er sich zum ersten Mal traut, so richtig vor den anderen zu tanzen, hüpft sein Herz vor Glück. Du-selbst-Sein ist einfach das Beste, was ein Hase machen kann! Die witzigen und detailreichen Illustrationen von Kate Hindley ermutigen kleine und große Leser*innen, ihre Träume zu leben. ISBN: 38-3696-054-0 €13.00 Goto genialokal.de + Add to list Der kleine Fuchs liest vor. Ahoi, ihr wilden Piraten! ISBN: 37-7070-218-2 €10.00 Goto genialokal.de + Add to list Der kleine Fuchs liest vor. Die Dinos sind los! ISBN: 37-5140-006-0 €10.00 Goto genialokal.de + Add to list Der kleine Fuchs liest vor. Blubberfisch und flotte Flossen ISBN: 37-5140-020-6 €10.00 Goto genialokal.de + Add to list Komm, wir zeigen dir unsere Kita (Constanze von Kitzings Wimmelgeschichten 1) ISBN: 35-5117-015-0 €13.00 Goto genialokal.de + Add to list SAMIRA und die Sache mit den Babys In diesem Aufklärungsbuch wird Intersektionalität auf allen Ebenen mitgedacht. Absolut zeitgemäß und ohne Klischees und Mythen! Feministische Aufklärung für mit viel Gefühl und Herz und für alle! ISBN: 39-4925-801-9 €18.90 Goto tausendkind.de + Add to list Untenrum Onten, Enten und Untenrums: Lo will alles ganz genau wissen. Wie heißt das eigentlich zwischen den Beinen? Wozu ist es da und wie sieht es aus? Und wie kann man noch dazu sagen? Ein sprachkreatives Bildersachbuch, das in kindnahen Bildern und Texten einen unverkrampften Zugang zu unterschiedlichen Körpern, Geschlechtsteilen und Geschlechtern bietet. Ein empowerndes Buch, warm und frech zugleich, das den selbstbestimmten Zugang zum eigenen Körper in den Mittelpunkt stellt. €16.00 Goto genialokal.de + Add to list Überall Popos Dieses Buch enthält eine humorvolle Erzählung über Mila, die mit ihren Eltern ins Schwimmbad fährt und ganz aufgeregt ist. Mir gefällt, dass das Thema Körpervielfalt hier nebenbei eine Rolle spielt und nicht im Fokus der Geschichte steht. Kinder können sich hier gut mit Mila identifizieren, wenn sie ebenfalls Angst vorm Sprung ins Wasser haben. Auch das Thema Scham spielt eine Rolle an mehreren Stellen. ab 4 Jahren ISBN: 978-39-5470-234-3 €15.00 Goto genialokal.de + Add to list Lina, die Entdeckerin Ein Buch bei dem die Meinungen sehr stark auseinandergehen. Lina entdeckt ihre Vulva und Vagina und das auf sehr bildgewaltige Weise: sie turnt z. B. in ihrer Vagina herum. Mir gefällt, dass dieses Buch etwas wagt: ins Innere des Körpers, aber nicht irgendwo, sondern zu einem Organ, dass z. B. noch heute teilweise in Sachbüchern falsch dargestellt wird. Einige Personen, die das Buch zum ersten Mal sehen, sind geschockt von der Überpräsenz der weiblichen Geschlechtsteile. Auch wird am Ende Menstruation thematisiert, das nicht für alle Menschen ins Kita-Alter gehört. Ich bin da entspannt, es ist ein natürlicher Vorgang, über den Kinder Sachinformationen erhalten dürfen. Es schadet ihnen gar nicht. Es gilt: immer nur so viel Infos, wie das Kind fragt und wo es Interesse zeigt. ab 4 Jahren ISBN: 978-39-5048-315-4 €22.00 Goto genialokal.de + Add to list Bruno will hoch hinaus Das Pendant zu "Lina die Entdeckerin" für Kinder mit Penis und Hoden. Bruno erfährt vieles über seinen Körper, insbesondere über seinen Penis. Es finden sich zahlreiche Sachinformationen zu Körperpflege, Anatomie und Gesundheit in dem Buch. Wir sehen außerdem vielfältige männliche nackte Körper und dies ist einfach wichtig, damit Kinder verschiedene mögliche Identifikationsfiguren vorfinden. ab 4 Jahren ISBN: 978-39-0340-801-2 €22.00 Goto genialokal.de + Add to list Florian - J. R. und Vanessa Ford Ein Buch über Florian, der schon lange weiß, dass er ein Junge ist. Es zeigt wie wichtig familiäre Unterstützung für trans* Kinder ist und welche bedeutende Rolle das Umfeld, z. B. die Schule spielt. Ein wichtiges Buch für Lehrkräfte, Pädagog*innen, Eltern aller Kinder und für Kinder selbst, um geschlechtliche Vielfalt kennenzulernen. ab 4 Jahren ISBN: 978-39-4931-517-6 €24.90 Goto genialokal.de + Add to list 59 wishes'
