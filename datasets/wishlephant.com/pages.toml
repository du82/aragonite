full_description = '''Top 10 meistverschenkte Familienspiele by Wishlephant Guido Heinecke ist Geschäftsführer bei Spiel des Jahres und verrät uns hier seine meist verschenkten Spiellieblinge! Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Quarto Für zwei Spieler:innen: 4 gewinnt nur viel, viel besser! Schönes Material, sieht aufgebaut edel aus. Altersempfehlung: ab 6 Jahren Goto spiele-offensive.de + Add to list MicroMacro: Crime City Ein Wimmelbild als Spiel mit skurrilen Mordfällen. Für jeden was - und wer es durch hat, schenkt sein Exemplar einfach weiter. Altersempfehlung: ab 8 Jahren Goto spiele-offensive.de + Add to list Dune: Imperium Fortgeschrittene Spieler*innen kämpfen hier um die Herrschaft über den Wüstenplaneten. Wie im Film! Altersempfehlung: Ab 14 Jahren + Add to list Splendor Ein Wetteifern um die besten Edelsteine mit tollen Synergie-Effekten. Altersempfehlung: Ab 10 Jahren Goto spiele-offensive.de + Add to list Cascadia Ein ruhiges Wohlfühlspiel, das nicht zu verkopft daherkommt. Altersempfehlung: Ab 10 Jahren Goto spiele-offensive.de + Add to list Brass: Lancashire Neuauflage Kennerspiel für Expert*innen ab 12 Beschreibung: Die industrielle Revolution ist in vollem Schwung. Errichte dein eigenes Wirtschaftsimperium und nutze dabei auch das, was deine Gegenspieler aufgebaut haben. Das meisterhafte Original von Martin Wallace rangiert als eines der 20 bestbewerteten Brettspiele auf BoardGameGeek und alle sind sich einig: Brass ist bekannt als eins der tiefgängigsten Ökonomiespiele mit kaum erreichten Wiederspielwert. In dieser neuen Version wurden die Regeln nochmals leicht überarbeitetet für eine verbesserte Balance. Verbesserte 2- und 3-Spieler-Regeln sorgen für ein Spielgefühl, das dem 4-Spieler-Spiel gleicht. €64.99 Goto spiele-offensive.de + Add to list Great Western Trail Neuauflage Kennerspiel für Expert*innen ab 14 Jahren Great Western Trail ist ein von Kritikern hochgelobtes Spiel über Viehzucht von Alexander Pfister. Die Spieler versuchen ihre Herde durch die Prärie des Mittleren Westens zu treiben und sie nach Kansas City zu bringen. Aber Vorsicht! Die Cowboys teilen sich den Weg. Die zweite Edition verfügt über ein neues Design, doppellagige Spielerablagen und neues Spielmaterial. Außerdem gibt es eine Solo-Variante mit zusätzlichem Spielmaterial. €39.99 Goto spiele-offensive.de + Add to list SPIEL DES JAHRES 2018 - Azul Neuauflage ab 8 Jahren Beschreibung: Azul lädt dich dazu ein, die Wände des königlichen Palastes in Evora mit prunkvollen Fliesen zu verzieren. Die ursprünglich weiß-blauen Keramikfliesen, genannt Azulejos, wurden einst von den Mauern eingeführt. Die Portugiesen vereinnahmten sie ganz für sich, nachdem ihr König Manuel I. bei einem Besuch der Alhambra in Südspanien von der Schönheit der schmuckvollen Fliesen geradezu überwältigt worden war. Sofort wies er seine Bediensteten an, dass die Wände seinen eigenen Palastes in Portugal mit ähnlich prachtvollen Fliesen zu verzieren seien. €34.99 Goto mytoys.de + Add to list SPIEL DES JAHRES 2019 - Just One ab 8 Jahren Beschreibung: Just One ist ein kooperatives Partyspiel, bei dem alle zusammen gegen das Spiel spielen. Das Ziel ist es, gemeinsam möglichst viele der dreizehn geheimen Wörter zu erraten. €18.49 Goto mytoys.de + Add to list Time's Up! Family ab 8 Jahren Beschreibung: Es ist das vielleicht lustigste, schnellste und coolste Quiz- und Partyspiel aller Zeiten, bei dem wirklich jeder seinen Spaß hat: Time#s Up! Drei Runden lang werden in zwei Teams Begriffe erklärt: zunächst wie man möchte, ohne das Wort direkt zu nennen, danach mit nur einem einzigen Wort und zuletzt mit Pantomime. Das Besondere daran, jede Runde sind die selben Begriffe zu erraten. €17.99 Goto mytoys.de + Add to list 10 wishes'''
