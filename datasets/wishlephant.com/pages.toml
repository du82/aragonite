["http://wishlephant.com/blog/2024-06-30-kinderb%C3%BCcher-abschied-tod-trauer"]
title = "Wishlephant - Blog - 19 Kinderbücher und Comics zum Thema Abschied, Tod und Trauer"
description = """
Ab 8 Jahren 
“Dies ist nicht nur ein Buch über das Sterben und den Tod, es ist vor allem auch ein Buch über das Leben.” 
Autorin Katharina von der Gathen und Illustratorin Anke Kuhl haben bereits einige gemeinsame Bücher bei Klett Kinderbuch veröffentlicht. Schwerpunkt dabei: Körper, Entwicklung und Aufklärung - kurzum auch das Leben.
Und zum Leben gehören neben der Geburt, dem Wachsen und dem Lieben eben auch der Tod und das Sterben.
Wie immer schafft es das Duo, mit heiterem Blick das Tabu behaftete Thema zu erzählen und den Scheinwerfer darauf zu werfen, was vor Kindern oft versucht wird zu verbergen.
Aus fälschlich gut gemeinten “Schutz”, aber sicher auch wegen der Sprachlosigkeit der Erwachsenen selbst. 
Das Buch nimmt erwachsene und junge Leser*innen mit ihren Ängsten ernst. In einem einfühlsamen Ton werden die einzelnen Etappen des Sterbens und Tod Seins beschrieben - dabei wird über den Tod auch mal gelacht, die Trauer aber respektiert. 
Um diese Etappen (das Sterben, Abschied nehmen, Beerdigung und Trauer) weniger abstrakter zu machen geben Expert*innen Einblick in ihre Arbeit. Und entmystifizieren den Tod so.
Anke Kuhls Illustrationen changieren zwischen bebildert, den Text begleitend, aber auch alleinstehende kleine comichafte Kommentare. 
Bei allem Augenzwinkern und Witz, ein sehr respektvolles Buch für Jung und Alt."""
full_description = "19 Kinderbücher und Comics zum Thema Abschied, Tod und Trauer vorgestellt von Kinderbuchexpertin Ilona Stütz 30.06.2024 Wir haben acht Fragen an Ilona, die uns 19 Kinderbücher und Comics liebevoll vorstellt, in denen es um Tod und Abschied geht! Die Liste findet ihr am Ende des Interviews oder hier: direkt zur Liste Für alle, die dich noch nicht kennen: Wer bist du und was machst du Schönes? Mein Name ist Ilona, auf Instagram findet man mich unter @Ilona.stuetz. Ich arbeite seit einigen Jahren im Projektmanagement für unterschiedliche Bildungs- und Kunst/Technikvermittlungsprojekte. In der Vergangenheit waren das zum Beispiel Jugend hackt in Berlin oder das Technische Museum in Wien. Aber das wohl Schönste ist mein Hobby: meine Liebe zu Büchern und Comics. Dieser Liebe gehe ich in Form von Kurzrezensionen auf Instagram nach, oder bei Vorträgen. 2022 habe ich dafür auch zwei Auszeichnungen bekommen - die der Österreichischen Gesellschaft für Kinder- und Jugendlitaturforschung für ausgezeichnete Abschlussarbeiten und die Talentförderung des Land Oberösterreich für Geistes- und Kulturwissenschaften. Woher kommt deine Liebe/Faszination zu Kinderbüchern? Ich habe an der Kunstuniversität Linz für das Studium Mediengestaltung meine Abschlussarbeit zur Repräsentation, also der Darstellung und Erzählweise, von Körpern in erzählenden Sachbilderbüchern verfasst. Und erst wollte ich das sehr theoretisch angehen und die ausgewählten Bücher nach einem Kriterienraster analysieren und beurteilen. Dann habe ich auf Frage meiner Betreuerin hin, ob ich denn die Autorinnen und Illustratorinnen auch wegen Interviews anfragen will, auf gut Glück eine Menge Mails geschrieben und nicht viel Rückmeldung erwartet. Aber am Ende hatte ich mit sechs von sieben Personen Gespräche via Zoom die teils fast 2 Stunden lange waren. (Corona hat mir da sicher den Vorteil verschafft, das viele zu Hause waren und „nur“ Verpflichtungen online oder in den 4 Wänden hatten). Diese langen Gespräche haben extrem spannende Einblicke gegeben, wie Buchtitel gewählt werden, warum diese und jene Kompromisse eingegangen werden, wie stark Erwachsene bei der Buchgestaltung mitgedacht werden müssen (Spoiler: fast am allermeisten, weil sie kaufen Bücher ein, erlauben das ausleihen und/oder lesen vor) und vieles mehr. Diese zwei Zielgruppen (Kinder und Erwachsene) machen für mich Kinder- und Jugendbücher wohl auch am spannendsten. Gerade Bilderbücher sind einfach hoch-politisch. An ihnen kann man gut ablesen, worüber sich Erwachsene wohl genug fühlen zu sprechen, was sind gesellschaftlich als „Tabu“ markierte Themen, was soll (wieder) als „Tabu“ markiert werden. Das Thema Tod ist für viele ja ein recht schweres, es wird nicht offen viel darüber geredet habe ich das Gefühl, gerade von Kindern wird das Thema oft noch weggehalten. Auch oft aus einer Unsicherheit heraus, denke ich. Daher danke dir für deine große Auswahl an einfühlsamen Büchern. Welches hat dich selbst sehr berührt/begleitet? In meiner Familie gab es auch sehr früh einen Todesfall durch Krebserkrankung und ich kann mich erinnern, dass es dann „dieses eine“ Buch gab mit dem unsere Mutter versuchte mit mir und meiner Schwester über Tod zu sprechen und bei der Verarbeitung zu helfen. In meiner Erinnerung ist das Buch nicht sehr gut und es wirkte auch immer sehr erzwungen, sich bei der Gute Nacht Geschichte gezielt und notgedrungen wegen des Anlasses nun damit auseinandersetzen zu müssen. Insofern bin ich begeistert, wie viele unterschiedliche Bücher es mittlerweile gibt, die mit so vielen Strategien an das Thema Tod herantreten. Vermutlich sind es „Murr“ (Kibitz) von Josephine Mark und „Wenn die ganze Welt….“ (Insel) von Joseph Coelho und Allison Colpoys, die mich besonders berührten. „Murr“ weil ich erst mit dem plakativ anmutenden Humor überfordert war und ich dann aber merkte, wie er das Thema Tod in seiner Schwere entwaffnet und wie tief der Comic - auf subversive Weise - geht. Und „Wenn die ganze Welt…“ weil es mit so wenigen Worten, genau dieses Erinnern anhand kleiner Sinneswahrnehmungen so gut beschreibt. Hast du eine schöne Erinnerung, an die du gern denkst, von jemandem, von dem du Abschied genommen hast? Das kann alles sein..eine Person, ein Tier oder auch ein Ort? Ich zum Beispiel freue mich jedes Mal darüber, dass ich die Schürzen anziehen kann, die ich von meiner Lieblingsoma habe, die schon gestorben ist. Jedes Mal wenn ich koche, kommen Erinnerungen an sie hoch, wie ich mit ihr in der Küche stand. Ich weiß ganz genau noch, wie es nach Butterschmalz gerochen hat und wie die Teetassen sich anfühlten, aus denen wir immer Opas Spezialmischung (Hagebutte und Pfefferminz) getrunken haben. Wir sind eher ländlich aufgewachsen und die Eltern meines Vaters wohnten in einer größeren Stadt mit Stahlindustrie und Straßenbahnen, in der Küche hatten sie einen Gasherd. Ihre Haussiedlung verbinde ich ganz stark mit dem Geruch von Schweißarbeiten (auch wenn sie gar nicht so nah an der Straßenbahn wohnten). Immer wenn ich diesen Geruch nun in der Stadt rieche stehe ich sofort wieder in ihrer winzigen Küche. Wenn man dein Instagramfeed so durchschaut, scheinst du ja unglaublich viele Bücher zu lesen. Welches davon du am häufigsten verschenkt? Ich verleihe Bücher total gerne. (Häufig auch ungefragt; aber bisher kamen noch keine Beschwerden.) Eine Freundin hat ihre Masterarbeit geschrieben zu Comics und Gender und immer wenn sie bei mir zu Besuch war habe ich ihr andere Bücher mitgegeben, die zum Thema passen. Ich habe damals auch die Literaturliste meiner Abschlussarbeit auf meiner Webseite geteilt, weil ich mir dachte „Jetzt habe ich alles zu diesem Thema gesucht - warum nicht mit anderen teilen, vielleicht hilft es.“. Zuletzt habe ich „Feminists in Progress“ (Carlsen) von Lauraine Meyer verschenkt, „Dragman“ (Schaltzeit Verlag) von Steven Appleby empfohlen und „Die dicke Prinzessin Petronia“ (Avant Verlag) von Katharina Greve verliehen. Wieviele Bücher liest du gleichzeitig? Ich muss zugeben, dass es gar nicht so viele sind. Ich bin aktuell in einer Phase in der ich Dinge viel lieber höre als mich auf längere Texte zu konzentrieren. Ich bin riesiger Podcast Fan und Hörbücher. Bei Bilderbüchern oder auch Comics lese ich eher immer alle auf einmal aus. Was liest du gerade? Als Hörbuch habe ich zuletzt „Will I Ever Have Sex Again“ von Sofie Hagen gehört. Und ich lese mich gerade etwas durch die „Max und Moritz“ Nominierten und Preisträger*innen - zb mit „Boris Babette und lauter Skelette“ von Tanja Esch (Kibitz), „Nika, Lotte, Mangold!“ (Rotopol) von Thomas Wellmann und „Emmie Arbel. Die Farbe der Erinnerung“ (Reprodukt Berlin) von Barbara Yelin. Wenn bald dein Geburtstag wäre, was würde auf deiner Wunschliste stehen? Eine Stelle bei der ich beruflich an Kinder- und Jugendbüchern und deren Entstehung und Wirkung forschen könnte :) Und realistische Wünsche: Comics gehen immer und ich liebe es Post zu bekommen (also Post, die mit Sicherheit keine Rechnung ist) Abschied, Tod und Trauer – 19 Comic- und Buchempfehlungen für Kinder von Ilona Radieschen von unten - Katharina von der Gathen Ab 8 Jahren “Dies ist nicht nur ein Buch über das Sterben und den Tod, es ist vor allem auch ein Buch über das Leben.” Autorin Katharina von der Gathen und Illustratorin Anke Kuhl haben bereits einige gemeinsame Bücher bei Klett Kinderbuch veröffentlicht. Schwerpunkt dabei: Körper, Entwicklung und Aufklärung - kurzum auch das Leben. Und zum Leben gehören neben der Geburt, dem Wachsen und dem Lieben eben auch der Tod und das Sterben. Wie immer schafft es das Duo, mit heiterem Blick das Tabu behaftete Thema zu erzählen und den Scheinwerfer darauf zu werfen, was vor Kindern oft versucht wird zu verbergen. Aus fälschlich gut gemeinten “Schutz”, aber sicher auch wegen der Sprachlosigkeit der Erwachsenen selbst. Das Buch nimmt erwachsene und junge Leser*innen mit ihren Ängsten ernst. In einem einfühlsamen Ton werden die einzelnen Etappen des Sterbens und Tod Seins beschrieben - dabei wird über den Tod auch mal gelacht, die Trauer aber respektiert. Um diese Etappen (das Sterben, Abschied nehmen, Beerdigung und Trauer) weniger abstrakter zu machen geben Expert*innen Einblick in ihre Arbeit. Und entmystifizieren den Tod so. Anke Kuhls Illustrationen changieren zwischen bebildert, den Text begleitend, aber auch alleinstehende kleine comichafte Kommentare. Bei allem Augenzwinkern und Witz, ein sehr respektvolles Buch für Jung und Alt. ISBN: 39-5470-285-1 Goto genialokal.de + Add to list Child Of Galaxies ✨ Child of Galaxies - Blake Nuto und Charlotte Ager (Illustration) ✨ Das Buch hat mich zunächst wegen des Covers angezogen (ich geb’s zu) und mich dann nicht mehr losgelassen. Es ist in Reimform geschrieben und thematisiert die Fragen woher wir kommen, warum wir leben und was unsere Aufgabe bzw. der Sinn ist, den wir erfüllen sollen und wohin wir gehen, wenn wir sterben. Wir alle sind aus dem gleichen Marerial wie Sterne und dabei sind wir winzig klein im Vergleich zum Universum. Ein kleines Korn, auf einem von vielen Planeten und Universen. ✨ But you are here, you’re awake, you are breathing. ✨ Auch wenn das Buch große Fragen behandelt, die selbst im Erwachsenenalter sind oft für die eine oder andere Krise sorgen kann, nimmt es ihnen die Luft aus den Segeln. Anstatt mit allem auf einmal konfrontiert zu werden, stellt es die Bedeutung des*der Einzelnen immer wieder in Relation. Und so ist es auch einfach Aufgabe genug einfach zu sein. ✨ And though your part may be small, you are PART of it ALL. ✨ Und weil wir alle Teil des Ganzen sind, würde jede*r von uns vermisst werden, wenn wir nicht existieren würden. Goto flyingeyebooks.com + Add to list Wie lange dauert Traurigsein? - Maria Farm Ab 9 Jahren Die Autorin Maria Farm schreibt aus der Perspektive als Psychologin mit jeder Menge Erfahrung in der Arbeit mit Trauernden Kindern zu Tod und Trauer. Interessantes Detail ist, dass das Buch bereits 2012 in Schweden erschien und erst 2022 in der deutschen Übersetzung veröffentlicht wurde. (Vermutung: kultureller Unterschied in der Bereitschaft über Tod zu sprechen oder/und Nachfrage auf dem deutschen Buchmarkt) Das Buch richtet sich direkt an Kinder ab 9 Jahren und begleitende Erwachsene. Thematisiert wird der mögliche Tod vieler Personen, die im direkten nahen Umfeld von Kindern sein können - Elternteile, Geschwister oder Freund*innen. Der Tod von Großeltern erscheint häufig als die „natürlichste“ erste Begegnung mit dem Tod. Aufgrund von Alter. Leider ist die Realität, dass viele Kinder viel früher und auch auf unvorhersehbarere Art und Weise mit dem Tod konfrontiert werden. Das Buch konzentriert sich vor allem auf das Empfinden der Trauernden. So wird bei der Frage „Was passiert mit uns?“ nicht auf das Sterben oder das Leben nach dem Tod (ob man nun religiös ist oder nicht) eingegangen, sondern das Trauern. TRAUERN IST GESTREIFT - fand ich eine sehr gut nachvollziehbare Beschreibung des Trauerns, die eine realistische Erwartungshaltung an das Meistern der Trauer aufbauen kann. Wobei Meistern unter Anführungszeichen zu lesen ist. Denn Trauern kann und darf lange dauern, auch wenn gesellschaftlich meist erwartet wird, dass man je nach Nähe zur verstorbenen Person nach Zeit X wieder normal weiterlebt. Im Buch werden auch konkrete Tipps angeboten, wie man zb mit dem Thema Unendlichkeit des Todes umgehen kann. Etwas indem man einen Erinnerungsort schafft (muss nicht der Friedhof sein), oder Briefe schreibt. Überzeugend fand ich die realistische Perspektive auf Trauer. Und auch, dass verschiedene Todesursachen (vorhersehbar und plötzlich), sowie der Fakt, dass alle in jedem Alter versterben können benannt wird. Ein aus meiner Sicht super wichtiges Buch. ISBN: 978-37-5120-226-8 Goto buecher.de + Add to list Ein Ort für meine Traurigkeit - Anne Booth Das Bilderbuch “Ein Ort für meine Traurigkeit” ist bereits auf den ersten Blick sehr berührend. Auf dem Cover sieht man eine Person, es wird im Buch aus der Ich-Perspektive erzählt und somit Geschlecht und Alter offen gelassen, die Hand in Hand mit der personifizierten Traurigkeit geht. Die Traurigkeit wird dabei nicht als etwas Monströses dargestellt, vor dem man Angst haben muss, sondern ein -vielleicht- treuer Begleiter, der weder gut noch böse sein muss. Denn Traurigkeit ist ein Gefühl, wie jedes andere auch, dass uns in unserem Leben immer wieder begegnet. Konkret ist die Traurigkeit ein ovales Wesen, ähnlich einer Tropfenform, mit Armen und Beinen, einem freundlichen Gesicht und im halbtransparenten Körper aus hellblauen Linien trägt es ein leuchtend rotes Herz. Alles in allem ist es ein wunderbar wertschätzendes Buch gegenüber einer Emotion, die gesellschaftlich oftmals ein Tabu darstellt. Ich konnte mich als erwachsene Leserin sowohl im Kontext der Trauerarbeit nach einem Todesfall wiederfinden, aber auch dem Umgang mit Trauer im Kontext von Depression oä. ISBN: 35-2230-597-3 Goto genialokal.de + Add to list Murr - Josephine Mark Ab 12 Jahren Murr - ein Comic über Tod, Angst und Liebe. Fast ohne Gefühlsduselei. Josephine Mark ist mit „Murr“ ein Comic gelungen der eine einzigartige Bereicherung der Bücher zum Thema Tod ist. Im ersten Drittel des Comic wird Murr als, nun ja, mürrischer Bandit etabliert, der nicht allzu viel von zwischenmenschlichen Beziehungen hält. Der Humor wirkt auf den ersten Blick simpel. So schemenhaft wie Murrs Statur. Eine Kugel als Oberkörper, zwei Striche als Beine und Augen,von denen nur die zusammengezogene Augenbraue zu sehen ist. Peng, peng, nackte Popos und ein Genital. Doch gerade in der scheinbaren Schablonenhaftigkeit liegt die unglaubliche Stärke des Comics. Denn Bücher über denTod müssen sich ihm nicht unbedingt mit Samthandschuhen nähern. Sich über denTod Gedanken zu machen und darüber zu sprechen kann schwer sein, warum sich ihm also nicht mit Humor nähern? Und ihn so entwaffnen. Und im letzten Drittel kommt die überraschende Wendung und Murr ist dann doch noch ein bisschen emotional. ISBN: 39-4869-034-0 Goto genialokal.de + Add to list Wie man sich mit einem Gespenst anfreundet - Rebecca Green Ab 4 Jahren Ein vor allem (auch) super schönes, zartes Buch über das vorsichtige Knüpfen von Freundschaften, die über die Zeit hinweg dauern. Für Freund*innen lieber Geister auch ein Buch, das Trost rund um das beängstigende Thema Tod spenden kann. ISBN: 32-5701-250-0 Goto genialokal.de + Add to list Oma, wann stirbst du? - Nina Mav Hrovat Ab 4 Jahren Eines der tückischen Dinge am Sterben ist, dass man meistens nicht weiß wannn es passiert und man sich dementsprechend nicht darauf vorbereiten kann. In “Oma, wann stirbst du?” wird genau diese Frage immer und immer wieder gestellt. Und auch die Oma kann keine Antwort geben, außer dass es passiert, wenn es passiert. Und man bis dahin noch so viele Momente wie möglich erlebt. (Und nicht alle davon müssen besonders und außerordentlich sein, denn auch das Kleine kann zur schönen Erinnerung werden.) Der Zeichenstil ist wunderschön mit"
