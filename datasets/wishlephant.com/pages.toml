title = "Wishlephant - 22 Bücher, die man nicht mehr weglegen kann: Tipps aus der Community"
description = 'Nachdem ich (Anika) eine unvernünftig kurze Nacht gehabt hab, weil ich unbedingt "Die Kunst des Verschwindens" von Melanie Raabe inhalieren musste, haben wir auf Instagram mal gefragt, welche Bücher ihr nicht aus der Hand legen könntet. Die Antworten findet ihr hier auf der Liste. Viel Spaß beim Stöbern, aber ⚠️ alles auf eigene Gefahr: Wir übernehmen keine Haftung bei Schlafdefiziten durch zu spannenden Lesestoff. 👻😆💜 Noch mehr Empfehlungslisten für Bücher, Spiele und Geburtstagsgeschenke findet ihr bei unseren Geschenkideen.'
full_description = '''22 Bücher, die man nicht mehr weglegen kann: Tipps aus der Community by Wishlephant Nachdem ich (Anika) eine unvernünftig kurze Nacht gehabt hab, weil ich unbedingt "Die Kunst des Verschwindens" von Melanie Raabe inhalieren musste, haben wir auf Instagram mal gefragt, welche Bücher ihr nicht aus der Hand legen könntet. Die Antworten findet ihr hier auf der Liste. Viel Spaß beim Stöbern, aber ⚠️ alles auf eigene Gefahr: Wir übernehmen keine Haftung bei Schlafdefiziten durch zu spannenden Lesestoff. 👻😆💜 Noch mehr Empfehlungslisten für Bücher, Spiele und Geburtstagsgeschenke findet ihr bei unseren Geschenkideen. Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Die Kunst des Verschwindens - Melanie Raabe Inhalt: Ist es manchmal leichter, mit einer Fremden zu sprechen als mit den Menschen, die man schon lange kennt und liebt? Als die junge Fotografin Nico zufällig zwischen den Jahren der Schauspielerin Ellen Kirsch auf den nächtlichen, winterlichen Straßen Berlins begegnet, fühlt sie fast unmittelbar eine unheimliche Nähe, die sie sich nicht erklären kann. Was haben sie schon gemeinsam, der inzwischen weltberühmte Hollywoodstar und die noch um Anerkennung ringende Fotografin? Was sieht Ellen in ihr, was sie selbst nicht erkennen kann? Vor allem aber: Warum schert sich Nico darum, dass Ellen eines Tages einfach wieder aus ihrem Leben verschwindet? Und zwar so plötzlich, wie sie gekommen ist? Als Nico endlich begreift, warum sie nicht loslassen kann, macht sie sich auf die Suche - nicht nur nach Ellen, sondern auch nach ihrer Mutter und ihrer eigenen Geschichte. 💜 empfohlen von mir (Anika): hab ich bin ein Uhr nachts gelesen, obwohl ich wusste, dass die um 6 schon wieder enden wird. Soo so spannend! €14.00 Goto genialokal.de + Add to list 22 Bahnen - Caroline Wahl Inhalt: Tildas Tage sind strikt durchgetaktet: studieren, an der Supermarktkasse sitzen, sich um ihre kleine Schwester Ida kümmern - und an schlechten Tagen auch um die Mutter. Zu dritt wohnen sie im traurigsten Haus der Fröhlichstraße in einer Kleinstadt, die Tilda hasst. Ihre Freunde sind längst weg, leben in Amsterdam oder Berlin, nur Tilda ist geblieben. Denn irgendjemand muss für Ida da sein, Geld verdienen, die Verantwortung tragen. Nennenswerte Väter gibt es keine, die Mutter ist alkoholabhängig. Eines Tages aber geraten die Dinge in Bewegung: Tilda bekommt eine Promotion in Berlin in Aussicht gestellt, und es blitzt eine Zukunft auf, die Freiheit verspricht. Und Viktor taucht auf, der große Bruder von Ivan, mit dem Tilda früher befreundet war. Viktor, der - genau wie sie - immer 22 Bahnen schwimmt. Doch als Tilda schon beinahe glaubt, es könnte alles gut werden, gerät die Situation zu Hause vollends außer Kontrolle. 💜 empfohlen von @fraeulein_n €13.00 Goto genialokal.de + Add to list Und alle so still - Mareike Fallwickl Inhalt: Ein großer feministischer Gesellschaftsroman über Widerspruchsgeist und Solidarität An einem Sonntag im Juni gerät die Welt aus dem Takt: Frauen liegen auf der Straße. Reglos, in stillem Protest. Hier kreuzen sich die Wege von Elin, Nuri und Ruth. Elin, Anfang zwanzig, eine erfolgreiche Influencerin, der etwas zugestoßen ist, von dem sie nicht weiß, ob es Gewalt war. Nuri, neunzehn Jahre, der die Schule abgebrochen hat und versucht, sich als Fahrradkurier, Bettenschubser und Barkeeper über Wasser zu halten. Ruth, Mitte fünfzig, die als Pflegefachkraft im Krankenhaus arbeitet und deren Pflichtgefühl unerschöpflich scheint. Es ist der Beginn einer Revolte, bei der Frauen nicht mehr das tun, was sie immer getan haben. Plötzlich steht alles infrage, worauf unser System fußt. Ergreifen Elin, Nuri und Ruth die Chance auf Veränderung? 💜 empfohlen von @hey.jojo.yeah und @aza_hamburg €23.00 Goto genialokal.de + Add to list Dinosaurs - Lydia Millet Inhalt: Dinosaurs is the story of a man named Gil who walks from New York to Arizona to recover from a failed love. After he arrives, new neighbours move into the glass-walled house next door and his life begins to mesh with theirs. In this warmly textured, drily funny and philosophical account of Gil's unexpected devotion to the family, Millet explores the uncanny territory where the self ends and community begins-what one person can do in a world beset by emergencies. Dinosaurs is both sharp-edged and tender, an emotionally moving, intellectually resonant novel that asks: In the shadow of existential threat, where does hope live? 💜 empfohlen von @ankonym €12.50 Goto genialokal.de + Add to list I'm Glad My Mom Died - Jennette McCurdy Inhalt: Jennette McCurdy erzählt herzergreifend und mit bitterem Humor von ihrem traumatischen Leben als ehemaliger Kinder-Star in »iCarly« und der krankhaften Beziehung zu ihrer Mutter Seit sie denken kann, wird Jennette von ihrer Mutter beherrscht, emotional erpresst und psychisch wie körperlich missbraucht. Das einzige, was Debra sich für ihre Tochter - aber vor allem für sich selbst - wünscht, ist Jennettes Erfolg als Fernseh-Star. Für Jennette beginnt ein Kreislauf aus Castings, Angstattacken und Selbsthass. Dann bekommt sie die Rolle als Sam Puckett in der Nickelodeon-Serie »iCarly« - eine Rolle, in der sie sich gedemütigt fühlt und Produzenten ausgesetzt ist, die ihre Macht missbrauchen. Als Debra an Krebs stirbt ist Jennette 21 Jahre alt und hat das Zentrum ihres Lebens verloren. Das einzige, worüber sie noch Kontrolle hat, ist ihr Essverhalten und die junge Frau stürzt ab in Essstörungen, Alkoholsucht und toxische Beziehungen. Einzig eine wegen ihrer Bulimie angefangene Therapie erweist sich als Jennettes Weg in die Freiheit. Es kostet sie Jahre um zu erkennen, was ihre Mutter ihr ein Leben lang angetan hat. Doch jetzt kann sie zum ersten Mal entscheiden, was sie selbst möchte, und es ist an der Zeit, die Kontrolle über ihre eigene Zukunft zu übernehmen. 💜 empfohlen von: @chilipetersilie €18.00 Goto genialokal.de + Add to list Ein schönes Ausländerkind - Toxische Pommes Inhalt: Der Debütroman von Toxische Pommes: »Diese Geschichten sind Pointen der Rührung, des Absurden, der politischen Erzählung. Und als Gesamtbild ein großes Glück.« SaSa StaniSic »Was hat uns das neue Leben gekostet? Meinen Vater seine Stimme, meine Mutter ihre Lebendigkeit. Und mich?« Vor dem Krieg in Jugoslawien flüchtet die Familie in ein Einwanderungsland, das keines sein möchte. Dieses Buch erzählt von der Beziehung zwischen einer Tochter, deren einziger Lebenssinn darin besteht, die perfekte Migrantin zu werden, und ihrem Vater, der sich bei dem Versuch, ihr das zu ermöglichen, selbst verliert. 💜 empfohlen von @ilona_stuetz: "Das Buch ist voll gut! Der Schreibstil unterhaltsam und ernst zugleich, die Geschichte rührend und authentisch." €23.00 Goto genialokal.de + Add to list Paradise Garden - Elena Fischer Inhalt: Die 14-jährige Billie verbringt die meiste Zeit in ihrer Hochhaussiedlung. Am Monatsende reicht das Geld nur für Nudeln mit Ketchup, doch ihre Mutter Marika bringt mit Fantasie und einem großen Herzen Billies Welt zum Leuchten. Dann reist unerwünscht die Großmutter aus Ungarn an, und Billie verliert viel mehr als nur den bunten Alltag mit ihrer Mutter. Als sie Marika keine Fragen mehr stellen kann, fährt Billie im alten Nissan allein los - sie muss den ihr unbekannten Vater finden und herausbekommen, warum sie so oft vom Meer träumt, obwohl sie noch nie da war. 💜 empfohlen von @ninanuninana: "Liest sich einfach so weg in einem Rutsch. Wer Benedict Wells mochte, mag das bestimmt auch." €23.00 Goto genialokal.de + Add to list Was ich nie gesagt habe - Susanne Abel Inhalt: Tom Monderath ist frisch verliebt: Mit Jenny erlebt er die glücklichste Zeit seines Lebens. Bis er durch Zufall auf seinen Halbbruder Henk stößt, der alles über ihren gemeinsamen Vater wissen will. Doch Konrad starb vor vielen Jahren und seine demente Mutter Greta kann Tom nicht befragen. Als sich weitere Halbgeschwister melden, wird es Tom zu viel. Jenny und Henk hingegen folgen den Spuren Konrads. Selbst fast noch ein Kind, kämpfte Toms Vater im Krieg, geriet in amerikanische Gefangenschaft, bevor er in den späten 40er-Jahren nach Heidelberg kommt. Dort verliebt er sich Hals über Kopf in die junge Greta, nicht ahnend, dass ein Geheimnis aus der dunkelsten Zeit des Nationalsozialismus ihre gemeinsame Familie ein Leben lang begleiten wird 💜 empfohlen von @ac.fra €13.00 Goto genialokal.de + Add to list Fourth Wing - Flammengeküsst Inhalt: Ein Drache ohne seinen Reiter ist tragisch. Ein Reiter ohne seinen Drachen ist tot. Violets Traum, Schriftgelehrte am renommierten Basgiath War College zu werden, zerplatzt jäh, da sie als Tochter der Generalin am Auswahlverfahren der Drachenreiter teilnehmen muss. Das erste Jahr wird nicht einmal die Hälfte aller Bewerber überleben, denn Drachen binden keine schwachen Menschen, sie fackeln sie nieder. Die meisten Kadetten wollen Violet allein aufgrund ihrer Herkunft niederstrecken - besonders Xaden, der mächtigste und skrupelloseste unter den Geschwaderführern. Und ohne Frage auch der attraktivste. Ausgerechnet ihm wird Violet unterstellt. Sie wird jeden Vorteil nutzen müssen, wenn sie überleben will. Denn am Basgiath War College haben alle eine Agenda und es gibt nur zwei Wege hinaus: den Abschluss machen oder sterben. 💜 empfohlen von @konfettitina €24.00 Goto genialokal.de + Add to list Yellowface - R.F. Kuang Inhalt: June Hayward und Athena Liu könnten beide aufstrebende Stars der Literaturszene sein. Doch während die chinesisch-amerikanische Autorin Athena für ihre Romane gefeiert wird, fristet June ein Dasein im Abseits. Niemand interessiert sich für Geschichten "ganz normaler" weißer Mädchen, so sieht es June zumindest. Als June Zeugin wird, wie Athena bei einem Unfall stirbt, stiehlt sie im Affekt Athenas neuestes, gerade vollendetes Manuskript, einen Roman über die Heldentaten chinesischer Arbeiter während des Ersten Weltkriegs. June überarbeitet das Werk und veröffentlicht es unter ihrem neuen Künstlernamen Juniper Song. Denn verdient es dieses Stück Geschichte nicht, erzählt zu werden, und zwar egal von wem? Aber nun muss June ihr Geheimnis hüten. Und herausfinden, wie weit sie dafür gehen will. 💜 empfohlen von @frau_alfons. War auch eines der krassesten und fesselndsten Bücher, die ich letztes Jahr gelesen habe. €24.00 Goto genialokal.de + Add to list Das leise Platzen unserer Träume - Eva Lohmann Inhalt: Ein Haus auf dem Land. Das hast du dir immer gewünscht, Jule. Dazu ein wilder Garten, durch den eure Kinder rennen. So hast du dir das Glück vorgestellt. Doch die Kinder sind nie gekommen. Und dein Mann hat jetzt eine Affäre in der Stadt. Ihr Name ist Hellen, und Hellen denkt viel an dich. Vielleicht ein bisschen zu viel. Oft fragt sie sich, warum du und dein Mann noch immer zusammen seid. Wie zwei Menschen es so lange miteinander aushalten können, wenn ihre gemeinsamen Träume doch längst geplatzt sind. Aber von alldem hast du keine Ahnung, Jule. Du weißt nicht von Hellen und nicht von ihren Fragen. Noch nicht. Noch sitzt du da, in deinem hübschen Garten, und überlegst, ob das, was du hast, vielleicht doch reichen könnte, um glücklich zu sein. 💜 empfohlen von @whitecappeony €22.00 Goto genialokal.de + Add to list Poussi - Cecilia Joyce Röski Inhalt: "Unsere Türen stehen für die Pois immer offen. Meine Tür ist auch offen, jeder Poi kann eintreten, Zeit mit mir verbringen und ich verbringe dann Zeit mit ihm. Ich bin immer da." Ibli ist Anfang zwanzig und wohnt und arbeitet im Palast, einem einst glanzvollen Bordell, das ihrem Vater gehörte. Iblis Vater, das ist Lackschuh. Zu Hochzeiten des Palastes führte er ein ausschweifendes Leben, nun verfolgt ihn der Bankrott. Seine Tage verbringt er - längst der Sucht verfallen - am Spielautomaten im Café Keese. Ibli aber ahnt, dass es außerhalb des Palasts eine Welt geben muss, in der es in den Fahrstühlen nicht nach Pisse stinkt und wo die Menschen in ihren Wohnungen gemütlich Tee trinken. Eine Welt, in der es nicht allein darum geht, mit einem "sexi Bodi" zahlende Kundschaft anzulocken. Als es im Palast zu einem Eklat kommt, ergreift Ibli die Flucht - mit ungewissem Ausgang. 💜 empfohlen von @coeurdeslivres €24.00 Goto genialokal.de + Add to list Kintsugi - Miku Sophie Kühmel Inhalt: Kintsugi ist das japanische Kunsthandwerk, zerbrochenes Porzellan mit Gold zu kitten. Diese Tradition lehrt, dass Schönheit nicht in der Perfektion zu finden ist, sondern im guten Umgang mit den Brüchen und Versehrtheiten. Es ist Wochenende. Wir sind in einem Haus an einem spätwinterlichen See, das Licht ist hart, die Luft ist schneidend kalt, der gefrorene Boden knirscht unter unseren Füßen. Gerade sind Reik und Max angekommen, sie feiern ihre Liebe, die nun zwanzig ist. Eingeladen sind nur ihr ältester Freund Tonio und seine Tochter Pega, so alt wie die Beziehung von Max und Reik. Sie planen ein ruhiges Wochenende. Doch ruhig bleibt nur der See. 💜 empfohlen von: @frauspindler €12.00 Goto genialokal.de + Add to list Heim schwimmen - Deborah Levy Inhalt: Es ist heiß. Sehr heiß. Sie sind aus London gekommen, um in einem Haus bei Nizza Urlaub zu machen: Das Ehepaar Jozef und Isabel Jacobs, er Schriftsteller, sie Kriegsberichterstatterin; die beiden teilen schon lange nichts mehr außer der Zeit, die sie miteinander verbracht haben. Ihre vierzehnjährige Tochter Nina, die wenig von ihren Eltern hält, aber umso mehr in pubertäre Gefühlsschwankungen verstrickt ist. Schließlich ein befreundetes Ehepaar, dessen Laden gerade pleitegeht. Kurzum: beste Voraussetzungen für geruhsame Ferien. Tatsächlich bricht schon bald das Unheil herein. Ein nackter Frauenkörper treibt im Schwimmbecken. Aber diese junge Frau namens Kitty Finch ist nicht tot. Oszillierend zwischen verletzlich und exaltiert, quartiert sich die selbsternannte Botanikerin mit den grüngelackten Nägeln in der Villa ein ... 💜 empfohlen von @peejez €12.00 Goto genialokal.de + Add to list Uncultured: A Memoir - Daniella Mestyanek Young Inhalt: Uncultured is more than a memoir about an exceptional upbringing, but about a woman who, no matter the lack of tools given to her, is determined to overcome. Behind the tall, foreboding gates of a commune in Brazil, Daniella Mestyanek Young was raised in the religious cult the Children of God, also known as The Family, as the daughter of high-ranking members. Beholden to The Family's strict rules, Daniella suffered physical, emotional, and sexual abuse-masked as godly discipline and divine love-and was forbidden from getting a traditional education. At fifteen years old, fed up with The Family and determined to build a better and freer life for herself, Daniella escaped to Texas, bravely enrolled herself in high school, and excelled. She later elected to join the military, where she believed she would finally belong. But she soon learned that her new world-surrounded by men on the sands of Afghanistan-was remarkably similar to the one she desperately tried to leave behind. 💜 empfohlen von @'''
