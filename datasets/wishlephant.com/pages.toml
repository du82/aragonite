["http://wishlephant.com/wishlists/c12dfac8-e338-4df1-a36b-dda970a3072f"]
title = "Wishlephant - Schönes vom Jaja Verlag"
description = """
Sowas von treuer Klassiker und beliebtester Jaja-Kalender ist der Familienplaner
von Marie Geißler. Auch für das kommende Jahr gibt es ihn wieder frisch, putzig und einmalig illustriert und ideal für eine 5-köpfige Familie, die Alltag und Freizeit vorausschauend plant."""
full_description = 'Schönes vom Jaja Verlag by Wishlephant Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Familienplaner 2020 Sowas von treuer Klassiker und beliebtester Jaja-Kalender ist der Familienplaner von Marie Geißler. Auch für das kommende Jahr gibt es ihn wieder frisch, putzig und einmalig illustriert und ideal für eine 5-köpfige Familie, die Alltag und Freizeit vorausschauend plant. €12.00 Goto jajaverlag.com + Add to list Mein Familienbuch Marie Geißler verdanken wir den in den Jahren traditionell gewordenen Familienplaner, der die Organisation des Familienalltags erleichtert. Aber was ist mit den ganz besonderen Ereignissen und wie hängt die Familie eigentlich zusammen und was hat wer mit wem zu tun oder gemeinsam? Einem Freundebuch nachempfunden, das von Freund zu Freund wandert und mit persönlichen Eintragungen gefüllt wird, möge das Familienbuch von Kind zu Tante zu Bruder zu Mutter und immer weiter herumgereicht werden. Die zu machenden Einträge sind dabei nicht langweilig und ganz bestimmt nicht bierernst. Es interessiert doch viel mehr, ob Opa Günter den Zungenroller kann oder an welches besondere Familienereignis er sich erinnert. Zwei Doppelseiten pro Person lassen auch der Phantasie noch viel Spielraum und dazu gibt es noch einen Stammbaum, eine Karte für die Geburtsorte, einen Geburtstagskalender und mehr. 19 Familienmitglieder passen rein! €15.00 Goto jajaverlag.com + Add to list Mein Großfamilienbuch Dieses Buch ist die logische Antwort auf den großen Erfolg von „Mein Familienbuch” und den zahlreichen Anfragen von Großfamilien, die dort nicht genug Platz fanden. Dafür ist Marie Geißlers Großfamilienbuch nun mehr als doppelt so dick und es können sich 40 Familienangehörige verewigen. Denn das ist es, was dieses Buch so gut kann: Die persönlichen Erinnerungen speichern ohne Strom und Festplatte, dafür mit dem Charme von individuellen Handschriften, den Familienschatz in Papierform bringen, von Hand zu Hand gehen und noch nach Jahrzehnten liebevoll und oder nostalgisch betrachtet werden. In der Papiertasche hinten im Buch befinden sich zwei Aufkleberbogen mit Portraitstickern. €29.00 Goto jajaverlag.com + Add to list Mein Sprachbüchlein »Bwwssfrrr bau bau gu« Mama, was war mein erstes Wort? Papa, was hab ich Lustiges gesagt, als ich klein war? …Mist, vergessen unter all den Abwaschbergen und zusammengelegter Wäsche. Um alle unwiederbringlichen Aussprüche und herzzerreißenden Zitate nicht den Abfluss hinunterrinnen zu lassen, hilft dieses kleine Büchlein, die Sprachentwicklung in den ersten Lebensjahren lustvoll zu dokumentieren. In verschiedenen Kapiteln wie Tiere, Philosophisches, Wichtige Fragen und Familie kann man kleine Szenen notieren, beobachten wie sich einzelne Worte verändern und Meilensteine festhalten. Und wieder beglückt uns Illustratorin Marie Geißler (Familienplaner, Mein Familienbuch) mit einem familienfreundlichen Büchlein, bestückt mit ihren schlichten, witzigen Zeichnungen. €15.00 Goto jajaverlag.com + Add to list Familienjuwelen (Elterncomicbuch) Die beiden Comiczeichner Joris Bas Backer und Nettmann öffnen ihr Schmuckkästchen und zeigen ihre Familienjuwelen. Familienjuwelen ist eine autobiografische Comicstripserie, in der die beiden abwechselnd Episoden aus ihrem deutsch-niederländischen Familienleben erzählen, von den Abenteuern ihres Kindes berichten und über pädagogische Herausforderungen nachdenken. Nichts als die Wahrheit. €19.00 Goto jajaverlag.com + Add to list supercool (Kindercomicbuch) Ein großer Lesespaß für Kinder ab 6 jahren! In "supercool" geht es um Coolness, Ausgrenzung und Freundschaften geht. Da ist die Heldin Tanja, die mit ihrer neuen Jeansjacke nicht bei allen Klassenkameradinnen auf Begeisterung stößt, aber eine gute Freundin hat, die ihr auch in schweren Minuten auf dem Pausenhof die Treue hält. Da ist auch der blöde Kai, dem sie es zumindest in ihrer Phantasie mal so richtig zeigt und da ist das Zuhause, wo es immer am schönsten ist mit einer Mama, die sie auf eine richtig krasse Idee bringt. Tanja Esch legt hier ein ganz bemerkenswertes Comicdebut vor, das mit seinen illustrativen Comicpanels, charmanter Bleistift-Strichführung und reduzierter Farbgebung in Sachen Coolness punktet. Das ist nicht nur für die Kids spannend und extrem witzig. €13.00 Goto jajaverlag.com + Add to list WELTRETTUNG 2020 - Illustrierter Wandkalender EIN DUTZEND ILLUSTRIERTE WELTRETTUNGEN VON 12 IDEALISTISCHEN ZEICHNERN 40 x 40 cm, 14 Blätter in Farbe Kalenderspiralbindung silber Es geht uns um unsere Welt, unseren Planeten, unser Zusammenleben und -halten und wie wir was alles besser machen könnten. Von Mülltrennung über Freundlichkeit im Alltag bis zu freier Liebe und Fahrradfahren macht dieser Kalender Mut und erinnert uns, wofür es sich zu leben und kämpfen lohnt. Vom Verkauf werden 1 Euro pro Kalender an Sea-Watch e.V. gespendet, um die Seenotrettung im Mittelmeer zu unterstützen. €22.00 Goto jajaverlag.com + Add to list Skizzenkalender 2020 Der Kalender für kreative Planer! Mit allem was ein Taschenkalender braucht: Jahres-, Monats-, Wochenübersichten, Feiertage... Dazu illustrierte Häppchen und Kritzelanimationen von Annette Köhn. Jeder Monat hat ein Zeichenwerkzeug als Motto oder ein Lieblingszeichenthema. Neben der Planerei kann man sich also auch inspirieren lassen und gleich loskritzeln. Monatlich wechselt auch die Papiersorte. Der Skizzenkalender ist eine Hommage an das Zeichnen an sich und ein ästhetischer Begleiter, der reichlich Platz für Eintragungen, Notizen und Skizzen lässt. Hardcover, Tasche hinten und zwei Lesebändchen 15 x 20 cm, 240 Seiten S/W auf unterschiedlichen Papieren + farbige Blanko-Papiere €16.00 Goto jajaverlag.com + Add to list Taschenkalender GRÜN 2020 Unsere Papeterie-Expertin Jenny Boidol hat sich Grünes als grobes Jahresthema auserkoren. Darum gibt es in dem fein illustrierten Taschenkalender viel Grünzeug, ökologische Tipps und Wissenswertes über Insekten zum Beispiel. Dazu Todo-Listen, natürlich Tages-, Wochen- und Monatsübersichten, Platz für Notizen & motivierende Wochenaufgaben. Illustratorin: Jenny Boidol, bär von pappe Din A6 Format, Hardcover mit tannengrünem Gummiband zum Verschließen und senfgelbem Lesebändchen 100% Recyclingpapier 176 Seiten in Farbe €16.00 Goto jajaverlag.com + Add to list 9 wishes'
