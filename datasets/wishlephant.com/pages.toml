full_description = '35 Lieblingsgeschenkideen für Babies und Kinder by Wishlephant Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Makedo - Konstruktionswerkzeug für Pappe großartiges Set, das ganz neue Bau- und Konstruktionsmöglichkeigen eröffnet. Damit kann man sich *alles* basteln aus Pappe! Autos, Häuser, Pferde, Häschen, Wichtelwohnungen.. ab 5 Jahren empfohlen. Goto amazon.de + Add to list Wer bin ich? (kartonierter Spieleblock) €7.99 Goto buchboxberlin.de + Add to list Von wilder Welt und Weihnachten €28.00 Goto genialokal.de + Add to list Holzbecher mit Deckel fürs geliebte Ein-und Ausräumen, aber auch zum Aufbewahren kleiner Schätze oder für die Spielküche. Können auch wunderschön bemalt werden. €23.90 Goto kokomoo.at + Add to list LAMEK Montessori Holzschraubbrett Wir haben ein ähnliches Schraubbrett seit M. 3 Jahre alt ist und es gehört zum absoluten All-time-Favorite, mit dem sie stundenlang ausdauernd spielt. Goto amazon.de + Add to list Hüpfmatratze / Hüpfpolster 107x70x17 cm jeansblau/rot Beste Anschaffung ever bei uns zuhause. Couch wird geschont, M. kann zur Beruhigung oder zum Abreagieren ewig hüpfen, oder auch zum Parcour-Spielen. Gibts in verschiedensten Ausführungen und Größen. €134.00 Goto traturio-store.de + Add to list MAMOI® Turnringen Trapez Schaukel 2 in 1 Das Lieblingsgeburtstagsgeschenk dieses Jahr. Wird seit dem 5. Geburtstag tagtäglich beturnt. Goto amazon.de + Add to list Wer versteckt sich hier…im Dschungel? Entdeckung aus dem Camping-Urlaub dieses Jahr, in dem M. das teilweise auch allein ganz fasziniert gespielt hat. Es ist echt superschön gemacht und einfach ne schöne Idee. Goto modulor.de + Add to list Das Kleine Mikroskop €3.92 Goto astromedia.de + Add to list 299 Katzen (und 1 Hund) Was für eine lustige Idee! Verschenken wir selbst zu Weihnachten..aber pssst ♡ €22.00 Goto laurencekingverlag.de + Add to list Ich so du so ab ca. 9 Jahren, ganz wunderbares Buch darüber, was wer oder was eigentlich "normal" ist. €16.95 Goto genialokal.de + Add to list Plackner | Kehrschaufelset Wird hier sehr geliebt! Gibts auch sicher im Baumarkt in Kindergröße. Goto spielzeugmacher.at + Add to list Expedition Natur Sitzmatte €5.95 Goto moses-verlag.de + Add to list Auf und zu, das kann ich schon! Ich glaube, kein anderes Buch wurde bei uns so lange und so ausdauernd benutzt. Es ist ja auch ein sehr besonderes "Buch". Hier können die Kleinen Druckknöpfe zu machen, Schleifen binden, Klettverschlüsse oder auch Reißverschlüsse öffnen üben. Großartig €14.99 Goto genialokal.de + Add to list Plackner | Pikler-Dreieck Standard Klassiker, war bei uns sehr beliebt, wir haben es uns vom Opa nachbauen lassen, da lohnt sich definitiv auch der Blick zu Kleinanzeigen oder anderen Gebrauchtmärkten. Goto spielzeugmacher.at + Add to list Figuren-Kegel, aus Holz, 38 x 100 mm Zum Figuren-Spielen, können auch prima nach eigenen Vorstellungen bemalt und verziert werden. €2.98 Goto kreativ-depot.de + Add to list Klingschalen STÜCK / ø 5cm für Babies ab Krabbelalter, zum Erfahren von verschiedenem Material, die Klingen ganz wunderbar, vor allem, wenn man ihnen aufgefädelte große Knöpfe oder Perlen mit hineinlegt, die sie aus und einräumen können. €17.90 Goto kokomoo.at + Add to list Regenbogen Holzringe 36 Stück wunderbar zum Spielen für Babies und Kleinkinder, die sie von einer Schale in die nächste räumen, ausschütten, stapeln und durchs Zimmer rollen können. Wer es günstiger mag, kann auch beim Kreativmarkt die in Natur um einiges günstiger bekommen. Siehe nächster Wunsch. €26.90 Goto kokomoo.at + Add to list Kleine Holzringe, ca. ø16mm - 15 Stck. €0.99 Goto kreativ-depot.de + Add to list Solarpapier für Sonnenfotografie, das ist Spezialfotopapier und durch drauflegen von Gräsern usw. kann man tolle Muster zaubern! Goto modulor.de + Add to list Kleines Bastel-Set "Ornament" - Dove €6.95 Goto lottiklein.de + Add to list Motorik Ringe Regenbogen eignen sich für Babies zum Fühlen und Kauen, aber auch für Kleinkinder zum Werfen, Bauen und Spielen €17.90 Goto kokomoo.at + Add to list Blox Eimer 250 Teile Basic Lego-kompatibles Lego €29.99 Goto simbatoys.com + Add to list OPEN BRICKS® Bauplatte 32x32 pavement [Duo Pack] mit Lego kompatibel €15.99 Goto openbricksource.com + Add to list Malbürste für Kinder €5.50 Goto buerstenwelt.de + Add to list Woolbuddy Needle Felting Kit ab ca. 7 Jahren Goto amazon.com + Add to list Wooden Blocks Puzzle Brain Teasers Toy €7.95 Goto coogam.com + Add to list Graviertes Nudelholz - skandinavische Dalapferde €20.30 Goto nordliebe.com + Add to list Miami Mix Stamp Washi Tape €4.50 Goto humanempireshop.com + Add to list KUNST & PAPIER Projekt-Skizzenbücher wunderschöne einfache Notizbücher, die für die Kinder tolle Malbücher werden können. Weniger rumfliegende einzelne Papiere, und so hat man gleich eine prima Aufbewahrung für ihre Kunstwerke, wenn sie die gleich ins Büchlein reinmalen. €9.31 Goto gerstaecker.de + Add to list Mir ist langweilig Kinderleichte Bastelideen für Drinnen. Empfohlen ab 5 €19.90 Goto genialokal.de + Add to list Das wird bestimmt ganz toll! €16.00 Goto genialokal.de + Add to list Gassi gehen Im Team puzzlen! ♡ €18.00 Goto laurencekingverlag.de + Add to list Perlen-Schmuckband-Set, 3.000g Perlen, 10x25m elastisches Schmuckband Falls jemand eine Großbestellung machen möchte, für einen großen Kindergeburtstag plant oder sich mit anderen was teilen will: Tolles Riesenset an Perlen und Gummibändern, mit denen ewig gebastelt werden kann. €69.90 Goto kreativ-depot.de + Add to list Kunst aus der Box ab 6 Jahren, lustige Aufgaben für Kinder, die gern kreativ sind Goto modulor.de + Add to list Kugelbahn: 213- teiliger maxi Baukasten Hier lohnt es sich auch, auf Kleinanzeigen usw. nach gebrauchten Bahnen zu schauen. Macht auf jeden Fall Megaspaß zu spielen. €120.99 Goto tausendkind.de + Add to list Expedition Natur Feuerstarter-Set €9.95 Goto moses-verlag.de + Add to list Das Farben-Mischpult €14.90 Goto astromedia.de + Add to list 38 wishes'
