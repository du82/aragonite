["http://wishlephant.com/blog/2024-02-28-aufklaerung%20fuer%20kinder"]
title = "Wishlephant - Blog - Körper, Identität und Aufklärung für Kinder"
description = """
Ein Buch über Florian, der schon lange weiß, dass er ein Junge ist. Es zeigt wie wichtig familiäre Unterstützung für trans* Kinder ist und welche bedeutende Rolle das Umfeld, z. B. die Schule spielt. Ein wichtiges Buch für Lehrkräfte, Pädagog*innen, Eltern aller Kinder und für Kinder selbst, um geschlechtliche Vielfalt kennenzulernen. 
ab 4 Jahren"""
full_description = '''Körper, Identität und Aufklärung für Kinder 11 Buchempfehlungen von Kindheitspädagogin Nina-Louisa Hebeler 28.02.2024 Wir haben sieben Fragen an Nina-Louisa, die Buchempfehlungs-Liste findet ihr am Ende des Interviews. Los geht's! 1 - Danke für die Liste mit den 11 Buchempfehlungen! Stell dich gern nochmal vor: Wer bist du und was machst du so Schönes? Mein Name ist Nina-Louisa Hebeler. Ich bin Kindheitspädagogin und Dozentin in der Erwachsenenbildung. Meine Arbeit besteht hauptsächlich darin, pädagogische Fachkräfte aus Kitas darin zu unterstützen, einen sicheren und entwicklungsförderlichen Umgang mit Kindern gestalten zu können. Ich liebe was ich tue und bin seit 2023 selbstständig mit meinem Unternehmen „nackt im meer – Sexuelle Bildung für Kitas“. 2 - Was kann man sich unter Sexueller Bildung für Kitas vorstellen? Fachkräfte in Kitas gestalten den gesamten Tag über bewusst oder weniger bewusst Bildungsprozesse. Kinder lernen unter anderem durch Erwachsene in der Kita, wie mit Körpern, Intimsphäre, Freundschaften, Liebe, Entstehung von Leben, Schwangerschaft, sexueller und geschlechtlicher Vielfalt umgegangen wird. Sprache ist so mächtig! Was Erwachsene sagen, nehmen Kindern oftmals an als „die Wahrheit“. Hier komme ich ins Spiel: wir reflektieren in meinen Kursen die eigene Biografie in Bezug auf Sexualität und wir beleuchten, inwiefern sie im Alltag in der Kita vielleicht aus ungünstigen Impulsen handeln, die den Kindern eher schaden bzw. sie in ihrer Entwicklung hemmen. Wir wollen weg von zu früher Scham, Tabus, weg von Übergriffen (auch durch Fachkräfte! Die können sehr subtil übrigens stattfinden) und hin zu sexualfreundlicher Begleitung von Kindern ab Geburt oder im Fall der Fachkräfte ab Eintritt in die Kita. 3 - Was ist die Geschichte zu deinem ungewöhnlichen Insta-Namen @nackt_im_meer? Das ist mein Unternehmensname. Wenn ich an die Themen denke, die ich in Kitas bearbeite, dann geht es um Selbstbestimmung, in dem Fall um sexuelle Selbstbestimmung. Wir Menschen haben ALLE ein Recht darauf, von Geburt an. Und selbst als Erwachsene scheuen wir uns oft davor, unseren eigenen Körper zu zeigen, sind nicht zufrieden mit Körperstellen usw. Ich stelle mir vor, wie ein Mensch nackt im Meer schwimmt, sich frei fühlt, sich schön fühlt, das Wasser auf der Haut spürt, die Kraft der Natur, zu der wir Menschen ja alle gehören. So ist der Name entstanden. 4 - Welches Buch verschenkst du am häufigsten? Oh, gute Frage. Seitdem ich sexualpädagogisch tätig bin und mich viel mit „dieser“ Art von Büchern für Kinder befasse, natürlich am liebsten meine Highlight Bücher rund um Themen wie Aufklärung, Körpervielfalt, Gefühle usw. Ich hab da kein absolutes Lieblingsbuch, weil die Bücherwelt sich so rasant (gut) entwickelt, es kommen immer neue HAMMERTOLLE Bücher heraus! Aber wenn ich mich festlegen soll: Wie entsteht ein Baby? (Cory Silverberg). 5 - Was würde auf deiner Wunschliste für dieses Jahr stehen? Also was wünschst du dir, dass dieses Jahr passiert? Ein warmes friedvolles Zuhause für all die Menschen, die gerade oder schon länger keins mehr haben. Das tut mir in der Seele weh zu sehen, jeden Tag.Und für mich persönlich: janz viele Aufträge, damit ich Sexuelle Bildung als Selbstständige noch lange weitermachen kann. 6 - Wir schreiben ja einmal im Monat jetzt einen Newsletter, der nächste heißt "Das Beste vom Februar". Was war dein Bestes bisher? Die Nachricht, dass die ganzen Demos usw. gegen die AfD und überhaupt rechtes Gedankengut einen Rückgang der Beliebtheit der AfD zur Folge haben. Weiter so! Es ist so so bedrohlich, für unfassbar viele Menschen in Deutschland. Und übrigens auch für Sexuelle Bildung. Die sind nämlich komplett dagegen, nennen das „Frühsexualisierung“. Totaler Quatsch. 7 - Auf unserer Wishlephant-Postkarte sind drei imaginäre Elternwünsche drauf: Allein aufs Klo, in einem Haushalt ohne Sand leben oder Netflix & Chill statt Abwasch und Müll. Welchen würdest du ankreuzen? Haha. Tendenz zu „allein aufs Klo“. Ich zähle immer 1,2 und schwupps ist das Kind im Bad. Manno. Körper, Identität und Aufklärung – 11 Buchempfehlungen für Kinder von Nina-Louisa Florian - J. R. und Vanessa Ford Ein Buch über Florian, der schon lange weiß, dass er ein Junge ist. Es zeigt wie wichtig familiäre Unterstützung für trans* Kinder ist und welche bedeutende Rolle das Umfeld, z. B. die Schule spielt. Ein wichtiges Buch für Lehrkräfte, Pädagog*innen, Eltern aller Kinder und für Kinder selbst, um geschlechtliche Vielfalt kennenzulernen. ab 4 Jahren ISBN: 978-39-4931-517-6 Goto genialokal.de + Add to list Zwei Mamas für Oscar Thema Homosexualität und unerfüllter Kinderwunsch, Samenspende, familiäre Vielfalt. Hier geht's um die Geschichte von Oskar, der nach viel Herumprobieren seiner Mütter über eine Samenspende von einem befreundeten Mann entsteht. Seine beiden Mamas wünschten ihn sich so sehr, das wird in dem Buch deutlich ("Sehnsuchtskind"). ab 4 Jahren ISBN: 978-37-7070-084-4 Goto genialokal.de + Add to list Wuschelkopf und Pupspopo Ab ca. 2,5-3 Jahren, Pappbilderbuch mit Seiten zum Aufklappen. Themen wie Anatomie, Körpervielfalt, Ausscheidungen, Vorlieben usw. Ich mag es: klein, fein und viele Fachkräfte fragen mich immer nach Pappbüchern :-) ISBN: 978-39-0340-810-4 Goto genialokal.de + Add to list Ein Baby! Wie eine Familie entsteht Ein weitestgehend inklusives Buch zur Entstehung von Leben auf unterschiedliche Weise. Hier wird auch explizit gezeigt, wie ein Mann und eine Frau Geschlechtsverkehr miteinander haben. Geeignet für Eltern, die bereit sind, dieses Bild zu erklären und für Kinder, die sich dafür interessieren. Am Ende werden auch traurige Ereignisse wie der frühe Tod eines Embryos oder Tod nach Geburt erklärt. Kinder erfahren durch das Buch Sichtbarkeit ihrer eigenen Familienentstehung (z. B. Adoption, Samenspende). ab 5 Jahren ISBN: 978-33-2830-086-1 Goto genialokal.de + Add to list Bruno will hoch hinaus Das Pendant zu "Lina die Entdeckerin" für Kinder mit Penis und Hoden. Bruno erfährt vieles über seinen Körper, insbesondere über seinen Penis. Es finden sich zahlreiche Sachinformationen zu Körperpflege, Anatomie und Gesundheit in dem Buch. Wir sehen außerdem vielfältige männliche nackte Körper und dies ist einfach wichtig, damit Kinder verschiedene mögliche Identifikationsfiguren vorfinden. ab 4 Jahren ISBN: 978-39-0340-801-2 Goto genialokal.de + Add to list Lina, die Entdeckerin Ein Buch bei dem die Meinungen sehr stark auseinandergehen. Lina entdeckt ihre Vulva und Vagina und das auf sehr bildgewaltige Weise: sie turnt z. B. in ihrer Vagina herum. Mir gefällt, dass dieses Buch etwas wagt: ins Innere des Körpers, aber nicht irgendwo, sondern zu einem Organ, dass z. B. noch heute teilweise in Sachbüchern falsch dargestellt wird. Einige Personen, die das Buch zum ersten Mal sehen, sind geschockt von der Überpräsenz der weiblichen Geschlechtsteile. Auch wird am Ende Menstruation thematisiert, das nicht für alle Menschen ins Kita-Alter gehört. Ich bin da entspannt, es ist ein natürlicher Vorgang, über den Kinder Sachinformationen erhalten dürfen. Es schadet ihnen gar nicht. Es gilt: immer nur so viel Infos, wie das Kind fragt und wo es Interesse zeigt. ab 4 Jahren ISBN: 978-39-5048-315-4 Goto genialokal.de + Add to list PS: Es gibt Lieblingseis Leider gibt es bisher wenig Kinderbücher in denen intergeschlechtliche Kinder benannt werden oder in denen das Thema Intergeschlechtlichkeit an sich besprochen / erklärt wird. In diesem Bilderbuch wird einfühlsam die Geschichte von Bella erzählt. Bella kommt neu in eine Klasse. Es geht um Bellas Herausforderungen in der Schule und mit den anderen Kindern, die z. B. noch nie etwas von intergeschlechtlichen Menschen gehört haben. ab 4 Jahren ISBN: 978-39-4444-246-4 Goto thalia.de + Add to list Überall Popos Dieses Buch enthält eine humorvolle Erzählung über Mila, die mit ihren Eltern ins Schwimmbad fährt und ganz aufgeregt ist. Mir gefällt, dass das Thema Körpervielfalt hier nebenbei eine Rolle spielt und nicht im Fokus der Geschichte steht. Kinder können sich hier gut mit Mila identifizieren, wenn sie ebenfalls Angst vorm Sprung ins Wasser haben. Auch das Thema Scham spielt eine Rolle an mehreren Stellen. ab 4 Jahren ISBN: 978-39-5470-234-3 Goto genialokal.de + Add to list Wie entsteht ein Baby? Absoluter Klassiker für mich geworden. Es beschreibt die Entstehung von Leben auf ganz simple Weise, ohne dass Eltern peinlich berührt von Geschlechtsverkehr berichten müssen. Das Buch beinhaltet eine inklusive Aufklärung zur Entstehung von Leben, bietet vielfältige Anlässe zum Dialog mit Kindern, auch über ihr eigenes Entstehen. Die farbenfrohen Bilder laden zum Dialog mit Kindern ein (gibt es pinkfarbene Haut?). ab 3 Jahren ISBN: 978-38-6321-170-7 Goto genialokal.de + Add to list AnyBody Diversitätssensibles Buch für Kinder von ca. 2-10 Jahren rund um das Thema Körpervielfalt. Witzige Zeichnungen von Anke Kuhl. Nimmt man den Umschlag ab, gibt es eine Überraschung. ISBN: 978-39-5470-246-6 Goto genialokal.de + Add to list Alle haben einen Po Super witziges Buch rund um Körper, Scham, Ausscheidungen, Aussehen usw., bietet tolle Gesprächsanlässe mit Kindern ab ca. 2 Jahren. ISBN: 978-34-4626-430-4 Goto genialokal.de + Add to list Untenrum empfohlen von @w_lena Goto genialokal.de + Add to list Copy List (As partner of Amazon and other affiliate networks we earn money from qualified sales.)'''
