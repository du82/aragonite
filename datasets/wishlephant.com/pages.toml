description = "Auf dem Buchblog buuu.ch besprechen Carla und das Team regelmäßig diverse und inklusive Kinderbücher fernab des Mainstreams. Hier verrät Carla ihre Lieblinge aus 2021.Falls ihr noch die Rezensionen der Bücher auf buuu.ch lesen möchtet, könnt ihr sie hier anklicken: Gib mir mal die HautfarbeRegenbogentageDas ist auch meine WeltAntennenkindDas geheime Leben der PopelSulweKleidung ist für alle da!Samira und die Sache mit den BabiesEin kleiner blauer Punkt Alles Arbeit oder was"
full_description = 'buuu.ch Empfehlungen - Lieblingsbücher des Jahres by Wishlephant Auf dem Buchblog buuu.ch besprechen Carla und das Team regelmäßig diverse und inklusive Kinderbücher fernab des Mainstreams. Hier verrät Carla ihre Lieblinge aus 2021.Falls ihr noch die Rezensionen der Bücher auf buuu.ch lesen möchtet, könnt ihr sie hier anklicken: Gib mir mal die HautfarbeRegenbogentageDas ist auch meine WeltAntennenkindDas geheime Leben der PopelSulweKleidung ist für alle da!Samira und die Sache mit den BabiesEin kleiner blauer Punkt Alles Arbeit oder was Copy List Sort by pricealphabeticallynewest firstpriority <button type="submit" class="btn--small">OK</button> Regenbogentage Eine queere Graphic Novel für Kinder ab 10 Jahren. Gelungen ist nicht nur die ganze Geschichte, sondern auch dass die Tatsache, dass Tuva sich in ein Mädchen verliebt, unaufgeregt und nicht problematisierend erzählt wird. ISBN: 978-39-5470-253-4 €18.00 Goto genialokal.de + Add to list Gib mir mal die Hautfarbe Eine wichtige rassismuskritische Ressource, für alle, die mit Kindern zu tun haben. Wenn man einen Erziehungsratgeber unbedingt lesen sollte, dann diesen. €17.00 Goto tebalou.shop + Add to list Das ist auch meine Welt Wer alt genug ist, Verantwortung für den eigenen ökologischen Fußabdruck übernehmen zu sollen, ist auch alt genug um zu erfahren, welche globalen Verstrickungen hinter unserem Essen, unserem Konsum, unserem Verkehr und unserer Energiegewinnung stecken. Dieses Buch macht das Komplexe für Kinder durch kurze und knappe Sachinfos und kleinteilige Illustrationen konkret. Es vermittelt allerdings nicht nur Fakten, sondern auch liefert Argumente – und Gegenargumente. ISBN: 978-34-0775-857-6 €16.95 Goto genialokal.de + Add to list Antennenkind Köbi ist ein Kind, dem die Welt viel zu laut ist. Er hört alles – und das ist meistens mehr, als er hören will. Eine einfühlsames und liebenswürdiges Buch über ein hochsensibles Kind und seine Umfeld ISBN: 978-37-1174-022-9 €15.00 Goto genialokal.de + Add to list Das geheime Leben der Popel Ein supergut aufbereitetes Sachbuch mit witzigen Illustrationen, rund ums Thema Nasenschleim, Rotze, Popel, you name it.– lesenswert für die ganze Familie. ISBN: 978-39-5728-464-8 €14.00 Goto genialokal.de + Add to list Alles Arbeit, oder was?! Was meint das eigentlich dieses “arbeiten gehen”? In dem Buch gehts nicht nur um Berufe sondern das Thema Arbeit wird aus vielen verschiedenen Perspektiven beleuchtet. Macht arbeiten Spaß? Ist betteln die Arbeit des Bettlers? Arbeiten nur die Erwachsenen und gibt es für besonders wichtige Arbeit besonders viel Geld? Spannend, informativ und vielschichtig. ISBN: 978-34-0775-499-8 €16.00 Goto genialokal.de + Add to list Sulwe Die mexikanisch-kenianische Schauspielerin und Aktivistin Lupita Nyong’o hat mit diesem Buch ihre persönlichen Erfahrungen mit Colorism niedergeschrieben und ist somit im deutschsprachigen Raum eine der ganz wenigen Ressourcen zum Thema. Darüber hinaus empowert das damit Kinder, die die gesellschaftliche Vorrangstellung von helleren Hauttönen am eigenen Leib spüren und aufgrund ihres dunklen Hauttons benachteiligt werden. ISBN: 978-39-4823-018-0 €24.00 Goto genialokal.de + Add to list Kleidung ist für alle da! Dieses Buch schließt eine Lücke zwischen öden Kinderbüchern, in denen es vor Klischees und Stereotypen nur so wimmelt und welchen, die diese zwar aufbrechen wollen, das Ganze aber trotzdem erstmal problematisieren (und somit verfestigen), bevor sie zum Punkt kommen. Die Botschaft ist klar und simpel: Es gibt keine Jungs- und Mädchenkleidung! ISBN: 978-39-4931-508-4 €14.90 Goto genialokal.de + Add to list SAMIRA und die Sache mit den Babys In diesem Aufklärungsbuch wird Intersektionalität auf allen Ebenen mitgedacht. Absolut zeitgemäß und ohne Klischees und Mythen! Feministische Aufklärung für mit viel Gefühl und Herz und für alle! ISBN: 39-4925-801-9 €18.90 Goto tausendkind.de + Add to list Ein kleiner blauer Punkt Ein kleiner blauer Punkt ist eine liebenswürdige und warmherzige Sachgeschichte, die sich dem spannenden und komplexen Thema Sonnensystem auf eine anschauliche Art widmet, aber auch eine Erzählung übers Einzigartig sein. ISBN: 978-37-3486-001-0 €15.00 Goto genialokal.de + Add to list 10 wishes'
