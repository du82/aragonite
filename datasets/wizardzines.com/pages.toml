["https://wizardzines.com/zines/css"]
title = "Hell Yes! CSS!"
full_description = '''Hell Yes! CSS! I wrote this zine because, for most of the last 15 years, I found CSS confusing and upsetting (not “hell yes!” at all!). Even CSS changes that I felt like should be “simple” would take forever, and I was often just changing random things and copying and pasting from Stack Overflow. At the end I usually didn’t understand exactly why my CSS code worked, and it wasn’t a good feeling. And if you feel like CSS is weird, you’re not wrong. It is! Did you know that an inline-block element’s vertical alignment changes depending on whether it has text in it or not? It’s true! (Here’s the code showing this: https://css-examples.wizardzines.com/#inline-block-text) But you can learn the weird things about CSS. Once you learn some of the basic weird things, it’s much easier to approach your CSS problems with the confidence that you can actually understand them. And then you can start learning from your CSS bugs (“oh, margin: auto behaves differently depending on whether the parent is a flexbox? Ok, good to know!!“), which means that every weird CSS situation you run into will make you a little bit better at CSS. In Hell yes! CSS!, we’ll: Explain a more productive attitude towards CSS (“it’s not easy, but you can learn it if you put in the work!”) Learn some of the basics of CSS (what’s a block element? how does position: absolute work? what’s the difference between padding and margin?) Show a few examples about how flexbox and grid are a WAY easier and less painful way to do layout than what people did (centering with flexbox or grid is actually really easy!) This zine is 28 pages, and learning some terminology and a few CSS fundamentals won’t magically make you a CSS wizard. But I found that after learning these fundamentals, I’m now a LOT more confident when using resources like MDN and CSS Tricks, and I’ve been able to fix a lot of CSS problems on my own (and understand the fixes) where previously I would have given up. I think it’ll be the same for you. and it comes with examples! A lot of the concepts in this zine are kind of surprising, and they’re hard to fully understand just by reading about them. So this zine comes with a bunch of examples that you can play with. If you see “try me!” on a page in the zine, that means there’s an example you can try out corresponding to that page. Here’s where to get the examples: CSS Examples I want this! This Zine personal PDF just for me! $12 print version print + PDF $16 company PDF for my team(s) $170+ We have different pricing options based on usage: team < 30 copies $170 startup30-100 copies $290 corporate100+ copies $600 Print directions var started; async function add_ppp_banner() { if (started) { return; } started = true; const elt = document.getElementById('ppp-discount'); const base_url = ""; var response = await fetch('https://wizardzines.com/.netlify/functions/ppp'); response = await response.json(); if (!response['code']) { return; } const code = response.code.replace(/\W/g, '') elt.innerHTML = ` <div class="flex flex-row pt-8 text-l text-left" style="width: var(--sidebar-width); max-width: 100%;"> <div style="font-size: 80px; line-height: .8em;" class="px-2"> ${response['flag']} </div> <div class="flex"> <div class="m-auto px-2"> Hello! It looks like you're in <span class="">${response['country']}</span>, where this zine might be expensive. <br> <!-- I've implemented Purchasing Power Parity to help make sure everyone can afford the zine. <br> --> If you need it, please use code <code><strong>${code}</strong></code> at checkout to get ${response['percent']}% off the regular price. </div> </div> </div> `; } add_ppp_banner(); All the zines! personal PDF just for me! $135 print version print + PDF $185 company PDF for my team(s) $1400+ We have different pricing options based on usage: team < 30 copies $1400 startup30-100 copies $3000 corporate100+ copies $5400 Print directions var started; async function add_ppp_banner() { if (started) { return; } sta