full_description = '''Bite Size Bash! bash is a very weird programming language. $ x = 2 x: command not found Variable assignment is weird, it’s hard to quote things, if statements run programs instead of checking a boolean value, its default error handling feels like it’s designed to cause catastophic bugs, and that’s just the beginning. And despite it being so weird, it’s everywhere! We use shell scripts all the time to configure servers and run our builds. So you end up frantically googling bash facts in an emergency when your test suite breaks because it was held together by a bash script that nobody on your team understands. But bash has one thing going for it: it doesn’t change much. Bash scripts today are pretty much exactly the same as they were 15 years ago. So if you take the time today to learn the weird way bash works, everything you learn will still be true in 10 years. And there aren’t that many weird facts about bash you need to learn to be able to understand & change most bash scripts with confidence. If you learn everything in this zine you’ll be way more comfortable with bash scripting than most programmers :). I want this! This Zine personal PDF just for me! $12 print version print + PDF $16 company PDF for my team(s) $170+ We have different pricing options based on usage: team < 30 copies $170 startup30-100 copies $290 corporate100+ copies $600 Print directions var started; async function add_ppp_banner() { if (started) { return; } started = true; const elt = document.getElementById('ppp-discount'); const base_url = ""; var response = await fetch('https://wizardzines.com/.netlify/functions/ppp'); response = await response.json(); if (!response['code']) { return; } const code = response.code.replace(/\W/g, '') elt.innerHTML = ` <div class="flex flex-row pt-8 text-l text-left" style="width: var(--sidebar-width); max-width: 100%;"> <div style="font-size: 80px; line-height: .8em;" class="px-2"> ${response['flag']} </div> <div class="flex"> <div class