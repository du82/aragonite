title = "How Containers Work!"
full_description = '''How Containers Work! When you first start using containers, they seem really weird. Is it a process? A virtual machine? What’s a container image? Why isn’t the networking working? I’m on a Mac but it’s somehow running Linux sort of? And now it’s written a million files to my home directory as root? What’s HAPPENING? And you’re not wrong. Containers seem weird because they ARE really weird. They’re not just one thing, they’re what you get when you glue together 6 different features that were mostly designed to work together but have a bunch of confusing edge cases. This zine explains EXACTLY what happens when you run a container on your computer. It turns out that there are only a few big ideas you need to understand what’s going on (images! overlay filesystems! capabilities! pivot_root! cgroups! namespaces! seccomp-bpf!). Once you understand these fundamentals, you’ll be able to go from “um, my container got killed??? why??? help!!!” to “oh, we set the cgroup memory limit too low! I’ll just look up how to adjust it!” I want this! This Zine personal PDF just for me! $12 print version print + PDF $16 company PDF for my team(s) $170+ We have different pricing options based on usage: team < 30 copies $170 startup30-100 copies $290 corporate100+ copies $600 Print directions var started; async function add_ppp_banner() { if (started) { return; } started = true; const elt = document.getElementById('ppp-discount'); const base_url = ""; var response = await fetch('https://wizardzines.com/.netlify/functions/ppp'); response = await response.json(); if (!response['code']) { return; } const code = response.code.replace(/\W/g, '') elt.innerHTML = ` <div class="flex flex-row pt-8 text-l text-left" style="width: var(--sidebar-width); max-width: 100%;"> <div style="font-size: 80px; line-height: .8em;" class="px-2"> ${response['flag']} </div> <div class="flex"> <div class="m-auto px-2"> Hello! It looks like you're in <span class="">${response['country']}</span>,