full_description = "WNYC is a media partner for PEN World Voices 10th anniversary Festival. 150 writers from 30 nations gather to celebrate those who dare to speak out for their art and beliefs. Now to May 4. WNYC is the media partner for The New York Moth StorySLAM, a Story Telling Competition. At The Housing Works Bookstore Cafe. Stories will feature the theme: Fathers! Tomorrow June 10th. Tues, Jan. 27 | THIS PERFORMANCE IS CANCELED- Please join us for the rescheduled performance on Thurs, Jan. 29 at 8PM. Join Studio 360 in The Greene Space for the world premiere of a rock opera based on The Book of Revelation written and composed by singer songwriter Mike Doughty. Wed, Jan. 28 | Join Studio 360 in The Greene Space for the world premiere of a rock opera based on The Book of Revelation written and composed by singer songwriter Mike Doughty. Wed, Jan. 28 | Join Studio 360 in The Greene Space for the world premiere of a rock opera based on The Book of Revelation written and composed by singer songwriter Mike Doughty. Thurs, Nov 1 | Discover celebrated indie rock band Cloud Cult in one of their most intimate performances yet. Host Dawn Gross of KALW interviews lead singer Craig Minowa, covering topics of love, loss and more. As part of The Greene Space's Wanderlust Wednesdays series, performance artist Marisa Morán Jahn and special guests whose work depends on copper answers your questions about relationships, betrayals, and revelations (bodily or terrestrial), and discuss the importance of copper throughout history. Take a trip back in time to 1970s New York City as acclaimed theater group The Civilians present a one-night-only performance in The Greene Space made from archival WNYC interviews! Join Radiolab at On Air Fest at the Wythe Hotel in Brooklyn on Friday, Feb. 21. Radiolab’s Senior Producer, Simon Adler, will be performing an original live show at the festival. Get more info and tickets here. At 7:30 p.m. on Friday, March 14, The Moth presents a special mainstage show at NYU's Skirball Center in honor of WNYC's Centennial. The theme is Only In New York, and will feature stories from each of the five boroughs. Tying it all together is first-time Moth host, WNYC's Alison Stewart. Expect special musical surprise moments and treats that can happen — Only in New York. Get tickets here."
