["https://www.wnyc.org/events/tags/technology"]
title = "Events - Archive for Technology | WNYC | New York Public Radio, Podcasts, Live Streaming Radio, News"
description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = "Learn how to live a purposeful digital life while keeping a New York state-of-mind. Hosted by New Tech City's Manoush Zomorodi with Priya Parker of Thrive Labs and Vincent Horn of Buddhist Geeks. Join Q2 Music’s Helga Davis and New Tech City’s Manoush Zomorodi for an evening of music and mind. With iconic performance artist, composer and musician Laurie Anderson and Mary Farbood, assistant professor in the Music Technology program at New York University. Watch the live video webcast here at 7pm ET! Join The Brian Lehrer Show for a live broadcast with several guests, lots of interaction, and various takes on a single topic: your privacy. We'll discuss what you want to share, what you don’t, and how much of your personal information you’re willing to trade for online conveniences. This live event has been canceled. You can still hear the conversation live on The Brian Lehrer Show on this date at 10AM on WNYC 93.9 FM and AM 820. Join New Tech City and guests for a discussion about how to raise healthy, thoughtful, and confident kids in the digital age. WNYC is supported by Health Tech 2014: Fueling Innovation in Westchester, a conference highlighting advancements in healthcare technology, therapeutics, research, medical treatments, and product development. Thursday, May 8th. As part of The Greene Space's Wanderlust Wednesdays series, performance artist Marisa Morán Jahn and special guests whose work depends on copper answers your questions about relationships, betrayals, and revelations (bodily or terrestrial), and discuss the importance of copper throughout history."
