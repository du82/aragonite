["https://www.wnyc.org/events/wnyc-events/2025/jan/19/burning-house-mlk-and-american-experience"]
title = '''
"A Burning House" — MLK and the American Experiment at The Apollo Theater- Events  - WNYC Events
 | WNYC | New York Public Radio, Podcasts, Live Streaming Radio, News'''
description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = "Join us for an inspiring tribute honoring Dr. King’s dream, and a timely dialogue on the ongoing project of forging an equitable society. This annual event from WNYC and the Apollo Theater will explore Dr. King’s enduring legacy through the lens of belonging, reflecting on his vision for a just and inclusive society. Through powerful conversations with prominent public intellectuals, community and faith leaders, authors and artists, we will explore the complexities of belonging, justice, and collective responsibility in our contemporary moment. Featuring WNYC’s Michael Hill, Janae Pierre and Brian Lehrer, and WQXR’s Terrance McKnight. Dr. Jacqui Lewis, senior minister, Middle Collegiate Church Dr. Jeanne Theoharis, distinguished professor of political science at Brooklyn College Dr. Christina Greer, associate professor of political science at Fordham University Rashad Robinson, former president of Color of Change Jonathan McCrory, artistic director of the National Black TheatreIrvin Weathersby, Jr., author and professor at City College of New York"
