full_description = "Fri, Oct 5 | Bite into a hot slice of NYC life at 44 Charlton with your host Julian Fleisher. This month's theme is Oktoberfest. Thurs, Nov 1 | Discover celebrated indie rock band Cloud Cult in one of their most intimate performances yet. Host Dawn Gross of KALW interviews lead singer Craig Minowa, covering topics of love, loss and more. Cellist Andrew Yee presents a program which explores their relationship to being bi-racial and going through transition as a trans woman. As part of WQXR’s Artist Propulsion Lab series, saxophonist and composer Steven Banks brings the world premiere of his new composition, Begin Again, to The Greene Space. The late Ingram Marshall’s work incorporated post-minimalism, ambient electronic effects that had a dark, nocturnal aspect. On October 21st, Host John Schaefer along with Ingram’s friends and fellow musicians will gather to pay tribute to the digital delay pioneer. Join some of your favorite WQXR hosts for an evening of holiday music! Classic carols and a few surprises from pianist Micah McLaurin, violinist Jennifer Grim, members of the New York Pops. Soprano Laquita Mitchell and the Clarion Choir will fill the space with tidings of comfort and joy. WQXR presents drag performance artist and violinist Thorgy Thor! Come enjoy an evening of laughter, music, and campy fun as we start off the new year and do a mental health check-in! We’ll have musical guests, games, drinks, and more than a few surprises. Haydn and Mozart knew how to wear a wig, and Thorgy Thor will take that look a few high-heeled steps further!"
