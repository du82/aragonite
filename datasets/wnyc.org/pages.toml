full_description = '''Wed, June 19 | TCG Playwrights in Conversation returns for an evening of author conversations and readings by hit off-Broadway playwrights Annie Baker, Melissa James Gibson and Amy Herzog. Join Andy Borowitz (The Borowitz Report at The New Yorker) as he challenges comedians Lee Camp, Negin Farsad, Todd Barry and Dean Obeidallah to dissect the week's news in this special panel show recording for WNYC and BBC Radio 4. Join us for an evening of beer-focused conversation, consumption and celebration! Learn the secrets of the most rare and special brews around with your host Jimmy Carbone of "Beer Sessions Radio." Featuring Dan McGloughlin of Manhattan’s Pony Bar and Ed Berestecki of Brooklyn’s Mug's Ale House. With music by The Flanks. Join us for an evening of beer-focused conversation, consumption and celebration! Learn the do's and don'ts of brewing beer at home, along with tips on how to taste beer. Hosted by Jimmy Carbone of "Beer Sessions Radio." Featuring John LaPolla of Bitter & Esters, beer educator Sam Merritt of Civilization of Beer and Chris Cuzme of 508 Gastropub. With live music by The Bailen Brothers. Join us for an evening of music from Central Europe, Central Asia, the Balkans, the Middle East — and Uganda! Featuring East of the River, Shashmaqam and The Dave Levitt Klezmer Trio. Learn how to live a purposeful digital life while keeping a New York state-of-mind. Hosted by New Tech City's Manoush Zomorodi with Priya Parker of Thrive Labs and Vincent Horn of Buddhist Geeks. Tues, Jan. 28 | Go behind the curtain with stars of the new musical adaptation: three-time Tony Award-nominee Marin Mazzie; Vincent Pastore; Tony-nominee Brooks Ashmanskas; and Heléne York. Hosted by WQXR's Elliott Forrest. Get a behind-the-scenes look at the new musical coming to Broadway this spring. With Tony and Pulitizer-Prize winning songwriting team Tom Kitt and Brian Yorkey; director Michael Greif; Tony Award winner LaChanze; and actor Anthony Rapp. Hosted by WQXR's Elliott Forrest.'''
