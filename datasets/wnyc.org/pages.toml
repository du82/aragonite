["https://www.wnyc.org/events/tags/art"]
title = "Events - Archive for Art | WNYC | New York Public Radio, Podcasts, Live Streaming Radio, News"
description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = "The ever-provocative guitarist/saxophonist/composer Elliott Sharp teams up with the New York-based Dither guitar quartet to perform at the Whitney Museum on Friday night August 13 at 7pm. They will be performing Christian Marclay’s Chalk Board, a piece that invites museum visitors to write on a giant chalk board and those musical notations/drawings/words/scribbles are then interpreted as a musical score by performers in the gallery. On Friday, August 13th at 7:30 p.m., Q2 encourages New York's New Music enthusiasts, gamelan junkies and seekers of free summer concerts to help document the Kronos Quartet's performance at Lincoln Center Out of Doors in Damrosch Park. This eclectic program presented by the world-famous quartet includes music by Steve Reich, Café Tacuba and Christine Southworth, and it presents diverse opportunities for picture-taking, text-Tweeting and video-filiming. Q2 presents an evening devoted to Chou Wen-chung — one of the legendary composers of our time. Host Nadia Sirota and Mr. Chou welcome some of today's leading musicians, who will honor his profound contributions to contemporary music with a live performance from the Jerome L. Greene Performance Space. Bill McGlaughlin – renowned composer, conductor, musician, music educator, and Peabody Award-winning classical music radio broadcaster - kicks off WQXR’s Beethoven Appreciation Month with a special in-depth discussion of Beethoven’s string quartets at WQXR’s Jerome L. Greene Performance Space. Theater Happy Hour: Join us for a conversation with WNYC host Leonard Lopate and stars of Lincoln Center Theater's production of Golden Boy, including Tony Shalhoub and director Bartlett Sher. Thursday, Oct 3 | Do the arts need to be more accessible? What can new technology bring to arts organizations? Join WQXR's Conducting Business and a group of prominent arts leaders as they explore recent findings and their implications. FREE, but reservations required. Gather 'round The Greene Space with the hosts of WQXR and WNYC for our annual radio play of Charles Dickens' A Christmas Carol. Featuring Broadway and screen veteran Tony Roberts as Ebenezer Scrooge. Directed by WQXR's Elliott Forrest. Audio play by award-winning playwright Arthur Yorinks."
