description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = '''Since January, WNYC has been reporting a special series on health and healthcare in the Bronx. In collaboration with the Bronx Documentary Center, we've asked photojournalists to document people in the community and their "Lifelines" - the things or people in their lives that keep them healthy. Join us on Thursday, June 5th at 7pm for an evening of radio, photos and video as we share our findings on health and healthcare in the city's fastest changing borough, the Bronx. The event will include a roundtable discussion with photojournalists, an “Ask the doctor” Q&A segment and a chat with special guest author Johanna Fernandez who is currently completing a book on the Young Lords.'''
