["https://www.wnyc.org/events/wnyc-events/2016/mar/09/launch-party-there-goes-neighborhood-brooklyn"]
title = """
Launch Party for 'There Goes The Neighborhood'- Events  - WNYC Events
 | WNYC | New York Public Radio, Podcasts, Live Streaming Radio, News"""
description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = "Join us to celebrate the launch of There Goes the Neighborhood, a new podcast series produced by WNYC Studios and The Nation. The podcast is an in-depth look at the gentrification of Brooklyn, from the developers making deals to the mayor’s plan for affordable housing, to the longtime residents trying to preserve their neighborhoods and the integral role that race plays in the process. Hosted by comedian Aparna Nancherla, the evening features an audio clip from the podcast, along with micro-conversations with Martha Plimpton, Dyme-a-Duzin, Justin Garrett Moore, Andrew J. Padilla, Kimberly Drew, Michelle Coffey, Darnell Moore and Elizabeth Wood. The night will include a live spoken word performance by Kai Davis, as well as a video clip from Darnell Moore and Mic.com’s new video series, “The Movement.” Finally, the celebration will conclude with an ensemble Q+A moderated by There Goes the Neighborhood host and The Nation editor, Kai Wright. Food and drink will be catered by Brooklyn’s Egg restaurant."
year_published = 2016
