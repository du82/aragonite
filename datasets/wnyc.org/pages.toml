["https://www.wnyc.org/events/tags/media"]
title = "Events - Archive for Media | WNYC | New York Public Radio, Podcasts, Live Streaming Radio, News"
description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = '''LUMEN is a cutting-edge video art and projection festival featuring site-specific video installations, 3D-video technology, sound-based performances, and art interventions by artists around the globe. Tuesday, Jan. 29 | The On the Media host sits down with Andy Carvin, NPR senior strategist, to talk about his pioneering work as "the man who tweets revolutions." Tuesday, Feb. 26 | The On the Media host talks with The Daily Show's Aasif Mandvi about comedy, making "fake news" and the challenges of being "the brown guy." Watch now. On the Media talks with the Grammy Award-winning artist about her Queens upbringing, colorful career and venture into theater with "Kinky Boots." Watch on-demand video. WNYC is a media partner for the 3rd annual Harlem Arts Festival. Open to all. June 27th through June 29th. WNYC is a media partner of Target First Saturdays at the Brooklyn Museum presenting Nina Sky, Blitz the Ambassador, and a screening of Spike Lee’s “Do the Right Thing.” 5 hours of music, art, and conversation open to all. July 5th. Details at Brooklynmuseum.org. LIVE at The Greene Space: Join filmmaker and founder of Bad Grrls Creative Club, Toni Thai Sterrett, and Creative Technologist and head of studios at CoinDesk, Jordan Muthra, alongside Senior Producer for The United States of Anxiety, Kousha Navidar, for UNRIDDLING NFTs – A conversation that will illuminate what NFT’s are, what creators are doing, and why you should pay attention.'''
