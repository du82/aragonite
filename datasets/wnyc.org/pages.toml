["https://www.wnyc.org/events/tags/music"]
title = "Events - Archive for Music | WNYC | New York Public Radio, Podcasts, Live Streaming Radio, News"
description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = '''The Prospect Park banshell hosts two months of music, dancing, film screening, drinking and eating entertainment. The majority of the festival events come with a mere $3 suggested donation to keep the bandshell in business. So cough it up and get out there. Click here for our picks. Live music on Governors Island. Take the ferry, enjoy the beach and stay for the free tunes. Tonight: The Morning Benders w/ Freelance Whales and Wild Nothing. The L Magazine takes Williamsburg and Greenpoint hostage for four days with their second annual Northside Festival. While there are hundreds and hundreds of bands in this musi-plosion, click here for a curated list of our picks. Every Thursday until August 5, at high-noon in downtown Brooklyn, hip-hop and world music can be found. For free! It's all part of BAM's R&B Festival held on the lawn at MetroTech Commons. Energizing rock rhythms and unexpected up-tempo dance beats from Africa and the Middle East will make you rethink party music. Tinariwen are a band of Tuareg nomad revolutionaries from the Sahara Desert who play amazing psychedelic rock music! Also on the bill is Syrian pop star Omar Souleyman. Bang On A Can notes its marathon as "Lollapalooza advised by the ghost of John Cage". It's a mass of musicians, composers, and listeners collaborating on uninterrupted live ear-bending border-crossing music from around the corner and around the globe. The performace is from noon til midnight (in 2007 it lasted 27 hours and 10 minutes!) and this year, its 23rd year, the World Financial Center Winter Garden plays host. Free concert at The Whitney's lower gallery and sculpture court with admission. No fear, it's pay-what-you-wish on Fridays from 6-9pm. But note, there are no special tickets or reservations. So if your summer Fridays haven't started, or don't exist, jump uptown right after work to guarantee a spot downstairs. See Dean & Britta's accompaniment written for short Andy Warhol films and join the cast and band from the hit Broadway musical Fela! for a live performance on Soundcheck from The Greene Space.'''
