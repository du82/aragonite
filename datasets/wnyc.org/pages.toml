title = "Events - Archive for Local Wnyc | WNYC | New York Public Radio, Podcasts, Live Streaming Radio, News"
description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = "An evening to celebrate the launch of There Goes the Neighborhood, a new podcast series produced by WNYC Studios and The Nation. View the 16th annual Dr. Martin Luther King, Jr. Day Celebration from WNYC and the Apollo Theater, exploring the influence of artists in the civil rights movement. Brooklyn Bowl and New York Public Radio have teamed up to present an annual fundraising event celebrating WNYC, WQXR and Gothamist. This year we are excited to honor 40 years of John Schaefer as host of the influential New Sounds! Take a trip back in time to 1970s New York City as acclaimed theater group The Civilians present a one-night-only performance in The Greene Space made from archival WNYC interviews! The Brooklyn Museum kicks off its 200th anniversary celebration with Birthday Bash from 11 a.m.-10 p.m. on Saturday, October 5, and from 11 a.m.-5 p.m. on Sunday, October 6. The Brooklyn Museum kicks off its 200th anniversary celebration with Birthday Bash from 11 a.m.-10 p.m. on Saturday, October 5, and from 11 a.m.-5 p.m. on Sunday, October 6. At 2 p.m. on Sunday, Jan. 19, join WNYC and The Apollo for an inspiring tribute honoring Dr. King’s dream, and a timely dialogue on the ongoing project of forging an equitable society. RSVP for free. At 7:30 p.m. on Friday, March 14, The Moth presents a special mainstage show at NYU's Skirball Center in honor of WNYC's Centennial. The theme is Only In New York, and will feature stories from each of the five boroughs. Tying it all together is first-time Moth host, WNYC's Alison Stewart. Expect special musical surprise moments and treats that can happen — Only in New York. Get tickets here."
