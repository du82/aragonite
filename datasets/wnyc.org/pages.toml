description = "WNYC is America's most listened-to public radio station and the producer of award-winning programs and podcasts like Radiolab, On the Media, and The Brian Lehrer Show."
full_description = 'WNYC is a media partner for PEN World Voices 10th anniversary Festival. 150 writers from 30 nations gather to celebrate those who dare to speak out for their art and beliefs. Now to May 4. For its 10th anniversary, the Festival celebrates those who have dared to stand "on the edge," risking their careers, and sometimes their lives, to speak out for their art and beliefs. Building upon PEN American Center’s tradition of defending freedom of expression, the festival will foster cross-cultural dialogue among writers, artists, and citizens around the globe, offering connective tissue for a new generation to see beyond cultural divisions and misconceptions. Join us for a wide range of events, including debates, one-on-one conversations, participatory workshops, and performances in venues throughout the city. A variety of events include panel discussions, one-on-one conversations, participatory workshops and performances at venues across the city. Featuring Adonis, A.M. Homes, Martin Amis, Timothy Garton Ash, Judith Butler, Siri Hustvedt, Michael Stipe, Adam Michnik, Salman Rushdie, Tracy K. Smith, Colm Tóibín, Linn Ullman, and many more.'
year_published = 2014
