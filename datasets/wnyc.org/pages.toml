full_description = "WNYC and the Apollo Theater present the 16th annual Dr. Martin Luther King, Jr. Day Celebration, exploring the influence of artists in the civil rights movement and how that legacy of activism in the arts continues today. WNYC's Melissa Harris-Perry, Jami Floyd, Brian Lehrer, Alison Stewart and Kai Wright moderate. WQXR's Terrance McKnight is Master of Ceremonies. “MLK – Activism and the Arts” also includes artistic presentations and performances. Gregory Hopkins directs The Gathering Quartet in a preview performance from Joel Thompson’s oratorio Seven Last Words of the Unarmed, a powerful, multi-movement choral work honoring black men killed by police or by authority figures; this performance is an excerpt from The Gathering: A Collective Sonic Ring Shout which will debut at the Apollo in May. The event also features a video presentation by classical music curator Garrett McQueen on the history of activism by Pan-African musicians. Rapper JSWISS close outs the program with an electrifying tribute to black trailblazers."
