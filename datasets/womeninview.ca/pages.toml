n-top:8px}.elementor-widget-text-editor:not(.elementor-drop-cap-view-default) .elementor-drop-cap-letter{width:1em;height:1em}.elementor-widget-text-editor .elementor-drop-cap{float:left;text-align:center;line-height:1;font-size:50px}.elementor-widget-text-editor .elementor-drop-cap-letter{display:inline-block} The Disabled Producers Lab: Dismantling the System, Building a Better Future by Heather Neale Furneaux Women in View is highlighting equity-focused organizations taking innovative steps to improve racial diversity and gender representation in Canada’s screen industry. These groups have adopted the kinds of structural-level change needed for real progress—changes we put forth in our Calls to Action (CTA) earlier this year. (You can review them here.) The Disabled Producers Lab, supported through a partnership between Women in View (WIV) and the National Screen Institute, is the third initiative WIV would like to spotlight in its Changemaker Case Study series. The first of its kind in Canada, the program offers five Disabled producers marginalized by gender, an intensive opportunity to further develop their production skills and work towards creating a short film. It also offers industry specialists a hands-on opportunity to better understand how the system must change to amplify the important, equity-deserving voices of the Disabled community. Launched in October 2024, the program consists of three parts: 1) group training sessions, 2) the development of a production binder and pitch for the participant’s short film, and 3) a final case study report to help develop industry best practices for being more inclusive. Industry experts present two virtual sessions a week over the course of twelve weeks on topics like pitching and packaging, distribution and marketing, and script to schedule planning including breaking a script for accessibility. Participants each receive a significant stipend to support their attendance and to recognize the time and contribution they make to the case study. How it evolved What’s especially unique about this initiative is that it’s bi-directional: trainers and producers come away equally informed and inspired with practical take aways to strengthen their work: producers with more powerful projects, and trainers better equipped to change the systems within their own spheres and beyond for better inclusion and accessibility. The program dismantles the learning process as a way of dismantling the system. The idea for the program stemmed from a conversation between Disabled writer and artist Ophira Calof and Jan Miller from Women in View’s Board of Directors. WIV’s team was looking to create a new iteration of their Five in Focus program to uplift a new demographic. Having headed up the previous Five in Focus programs for WIV including for the Indigenous community with Co-Lead Tracey Deer, Five in Focus Atlantic, and Five in Focus Animation, Miller asked Calof, who’s also on WIV’s board: Has any program like this ever been done for Disabled people?” Calof’s unequivocal answer set the initiative in motion. “Never.” Calof brought on Disabled producer Michelle Asgarali as her Program Co-Lead, and Calof, Asgarali, and Miller got to work immediately. After two years of research and design, (and yet another grant application turned down) a serendipitous conversation with the National Screen Institute’s former CEO Joy Loewen turned things around. Loewen’s infinite commitment to supporting equity-deserving voices shone through and she excitedly signed on the institute and her team to raise the finances and manage the venture. At this point, WIV stepped back and handed ownership of the new venture over to Calof and Asgarali, both leaders in the Disability community. A New Model The most interesting part of this initiative’s evolution was the myriad ways that the National Screen Institute enthusiastically pivoted to ensure the program would be truly accessible to all. “The National Screen Institute is a progressive organization that has worked on inclusivity for a long time, and is constantly embracing change,” said Program Manager Amy Reitsma. “For us to dismantle these structures in a way that is fair and that works, patience is required. And clear education,” she said. “This takes more time, money, and preparation than one might think.” Everything had to be reworked to suit people living with a wide range of needs and lived experiences. This meant introducing videos with closed captioning or live ASL interpreters, using plain language and other screen reader friendly documents, scheduling extended breaks during learning sessions, and building in flexible assignment deadlines. Everything from the way program trainers created and received applications, held meetings, distributed information, offered program content, and requested deliverables had to be adapted accordingly. Additionally, Miller pointed out, “program content was curated specifically in consultation with the producer cohort to meet their learning priorities.” “The high-level goal is to shift the paradigm around who is invited into the industry, how they’re invited in, and how we work overall,” said Reitsma. The vision is universal accessibility in mentorship models and beyond. “We’re on the verge of an era of being more tolerant and open minded about accepting and inviting different structures into our frameworks,” said Reitsma. “The grind and hustle culture we’ve all been conditioned to adopt isn’t healthy for anyone, nor is it sustainable. You start to see, when you’re working with people who are really in tune with what their bodies need and what their minds need, how this all leads to safer work environments and a better work life balance for everyone.” Asgarali and Calof worked tirelessly to make sure they’d thought through and accounted for every detail. As a result of their hard work, the Disability Screen Office came on as a presenting partner of the program. Asgarali explained the immediate goal is to create a safe community for Disabled producers to feel supported, to learn from each other, and to glean insight from practices outside Canada that the program may adopt or adapt. “There is a craving for Disability content these days—an interest in these kinds of stories, and a lack of knowledge about what we need to be able to tell them.” Through this program Asgarali and Calof are setting out to make space for that knowledge and experience to emerge. “You know, everybody thinks of Disability as a taboo subject,” said Asgarali, “a space they’ve got to be careful in. But it’s the only marginalized voice that every single person, if they live long enough, will be a part of. So, the feeling that we are separate would be something good to try and get rid of.” The case study being prepared from this first cohort’s experience will be a significant step in that direction, sharing key findings from the field, and best practices for going forward. Asgarali laughed. “Ophira and I joke that trying to make it in this industry as a Disabled storyteller can sometimes feel like trying to turn a power chair in a narrow hallway. You scrape by, leaving dents, until you’ve done it enough times to carve out the wall. We thought it was time to add to the number of dent-makers.” Learn more about the Disabled Producers Lab here. Racial Equity Media Collective Driving Canadian Policy by Heather Neale Furneaux Women in View is highlighting equity-focused organizations taking innovative steps to improve gender equity and inclusion in Canada’s screen industry. These groups have adopted the kinds of structural-level change needed for real progress—changes we put forth in our Calls to Action (CTA) earlier this year. (You can review them here.) Making Sense of Where We’re At: The Racial Equity Media Collective (REMC) is another outstanding example of an advocacy organization driving key structural change in Canada. Right from their 2021 beginnings, they’ve shown fierce dedication to establishing “clear, research-informed guidelines and targets” that help make sense of where the industry is at and where and how efforts should be focused. When they published their first report in 2021, following the overwhelming tensions of 2020 (informally dubbed “the year of racial reckoning”), the goal was clear. To effect meaningful change, the industry needed more comprehensive data, and to carefully audit measuring practices. (CTA #6). “The only way to move forward [is] to be clear about where we [are] in the present,” the report read. And that’s exactly what REMC has facilitated. Early on, they discovered that what they were setting out to do wasn’t even possible with the data—or in some cases lack of data—available. Stats proved inconsistent and problematic in terms of equitable representation. And transparency and intersectionality were needed to accurately compare and analyze findings. REMC’s Managing Director Julian Carrington cited Women in View (WIV) and the Indigenous Screen Office (ISO) as being very inspirational in that respect. “Both entities were early advocates for the importance of obtaining data in order to drive evidence-based change. And there’s no question the gender parity push was one of the first initiatives that saw data collection be [aggregated] like that,” he said. “Racial equity, unlike gender, has really been a more recent conversation. So, an early pillar of our advocacy work involved the meta-advocacy of having to advocate for data collection to be introduced to allow for accurate measurement of where we stand in terms of representation and participation.” The national not-for-profit organization’s mission, as outlined on their website, is “to remove barriers to access and increase the production, export, and sustainability of BIPOC content and BIPOC-led production companies.” They’ve been vocal and effective on policy and legislation around a wide range of issues, one of the most recent of which involved confronting Islamophobia and anti-Palestinian racism within the CBC. Collaboration and Community Consultation: Carrington explained the organization’s approach to policy change has always been informed by community consultation and collaboration. “I’m a staff of one, so ensuring we stay engaged with our peers in the advocacy space, and finding avenues as part of that process to advance equity—racial equity in particular—has been really important.” Under the prior Executive Director, Lisa Valencia Svensson, REMC succeeded in having specific language incorporated into the online streaming act that ensured equitable participation of black and racialized communities. “Having that language in legislation has been very impactful,” he said. “[It’s] allowed us to really underscore that this is not just something we’re urging you to do because we think it’s the right thing. It’s a legislative obligation.” Now, the REMC can take that one step further, collaborating with individual organizations to navigate applying the mandates in meaningf'
