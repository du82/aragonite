full_description = "Reports WIVOS23 Report – CALLS TO ACTION The results of WIVOS23, presented in August, clearly demonstrated a decrease overall in progress for women and gender diverse creatives made pre-pandemic, as shown through WIVOS2019 and WIVOS21. Indigenous Women, Black Women, and Women of Colour were the most significantly impacted and underrepresented. Based on these findings, WIV released the Calls to Action that outline eight urgent and necessary steps that must be made to see substantive movement toward an equitable industry. The Calls to Action were presented at this year’s St. John’s International Women’s Film Festival (SJIWFF), the same festival that supported the launch of the first On Screen Report in 2012. Read the Calls to Action in English: Calls to Action WIVOS23 Report English Press Release In French here: Appels a L’Action WIVOS23 Report French Press Release Women in View’s 7th On Screen Report documents women’s employment in Canada’s publicly funded film, television and documentary from 2019 to 2021 with data on Black women, Indigenous Women, Women of Colour and Gender Diverse people who identify beyond the binary of cisgender men and cisgender women throughout. The report takes a deep dive into gender representation and diversity in Canada’s English-language screen industry, examining how multiple aspects of identity—most prominently race and gender—intersect when it comes to accessing employment and funding. The findings reveal precarious progress around parity gains and many setbacks for women and gender diverse creatives in the industry. For example, while Indigenous women and gender diverse creatives saw small gains in film, they experienced huge losses in their share of work in television. Black women, as another example, had the least representation across all key creative roles, led the fewest projects, and received the least funding overall and on average. Of the 5919 credits examined in this report, 71% were by cisgender males. These findings suggest that the hard-earned progress that began to pick up speed in 2019, is fragile and that more sustainable infrastructure must be developed to ensure parity and importantly equity gains withstand market pressure. Read the full report in English here. And in French here. English Press Release French Press Release Women in View On Screen Report 2023 - Full Report Women in View On Screen Report 2023 - Executive Summary Women in View On Screen Report 2023 - Extended Summary Women in View On Screen Report 2023 - Deep Dive Rapport On Screen 2023 - Complete Rapport On Screen 2023 - Sommaire Exécutif Rapport On Screen 2023 - Sommaire Étendu Rapport On Screen2023 - Analyse Approfondie Women in View On Screen 2021- Full Report Women in View On Screen 2021- Executive Summary Women in View On Screen 2021- Recommendations Women in View On Screen 2019- Full Report Women in View On Screen 2019- Executive Summary Women In View On Screen 2015 – Released October 21, 2015 Women in View on Screen 2015- French Women in View on Screen 2014 Women in View on Screen 2013 Women in View on Screen 2012"
