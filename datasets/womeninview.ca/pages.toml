full_description = "2xMore was a three-year game changing initiative Launched at Prime Time in February 2016 by Women in View to support a sustainable shift towards gender equity in Canada’s media industries. In total 2xMore supported 11 directors on to scripted Television series Odd Squad and Dino Dana through our partnership with Sinking Ship Entertainment and another three with CBC’s Heartland. The key to 2xMore was linking shadowing to directing contracts. Since the requirements of each set are different, 2xMore was tailored to fit the needs of the production. To support female directors in the transition from shadowing to directing, we offered prodcos support that matches their needs, giving options like honoraria and travel subsidies for women directors new to the production. This initiative is currently on hiatus. The 2xMore directors are: Mars Horodyski Lara Azzopardi Zoe Robyn Nimisha Mukerji Sherren Lee Heather Hawthron-Doyle Alison Reid Rachel Leiterman Reem Morsi Aubrey Arnason Lisa Rose Snow"
