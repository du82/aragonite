full_description = "News and Media June 24th, 2024 NSI, DSO, Women in View launch Disabled Producers Lab BY KIM IZZO Five gender-marginalized Disabled creatives will be selected for the program. The National Screen Institute (NSI), Women in View and the Disability Screen Office (DSO) have partnered to launch the Disabled Producers Lab. Developed with Disabled filmmakers Ophira Calof and Michelle Asgarali, the lab is designed for Disabled producers across Canada aged 18 or older who are marginalized by gender, including transgender women, cisgender women, transgender men, non-binary people and many other gender identities. Up to five participants with a completed short film script ready to develop will be paired with industry mentors to create a comprehensive production binder featuring a realistic schedule, budget, accessibility plan and pitch package. Over 12 weeks, participants will take part in virtual sessions to learn the ropes of producing from industry experts. Sample topics include pitching and packaging, script to schedule planning and distribution and marketing. A public case study report will be created from the program findings to help develop industry best practices. Participants will receive a $3,250 stipend in acknowledgement of their time and contribution to the case study report. Applications are accepted until July 22. “There are so many gender-marginalized Disabled creatives with incredible producing insights and skillsets who have been systematically excluded from the entertainment industry,” said program co-lead Calof in a statement. “This program aims to explore and interrogate conventional practices, supporting Disabled creatives to develop their own accessible processes.” “Women in View is honoured to have been involved in the inception and design of this program. Working with the remarkable talents of Ophira and Michelle to create this first of its kind program, giving voice to the Disabled community, has been truly rewarding,” added Women in View’s Jan Miller, noting that the NSI later came on board to run the program. Read more here. ______________________ February 20th, 2024 Read Article here. ______________________ September 8th, 2023 CTV News Calgary – An expert on the WIVOS23 report presented by Lindsay Valve. Watch it Here. ______________________ September 7th, 2023 The Weekly Briefing: The Women On Screen Report reveals how much work there is yet to be done. Read full article here. ______________________ September 1st, 2023 New report warns parity gains in Canadian film, TV are ‘fragile’. Read full article here. ______________________ September 1st, 2023 Canadian Industry Losing Ground in Racial Representation, Says Study. Read full article here. ______________________ September 1st, 2023 Dismal Racial Representation Study Reveals Canadian Industry’s Decline Read full article here. ______________________ September 1st, 2023 Canadian Representation loosing ground in Racial Representation, Says Study Read full article here. ______________________ September 1st, 2023 Study Shows Decline in Racial Representation in Canadian Industry, Report The Hollywood Reporter. Read full article here. ______________________ August 31st, 2023 Women in View On Screen Report 2023 – ScreenDaily Exclusive Read full article here. ______________________ October 2020: Playback: Five in Focus Indigenous announcement October 2019: BC’s Five in Focus: Animation Short “The Butterfly Affect” Screening at Spark The Georgia Straight: “Spark Festival Puts Focus on Female Animators” – By Adrian Mack https://www.pressreader.com/canada/the-georgia-straight/20191017/281771335959174 Hollywood North Magazine: “Talent on Tap: Stephanie Blakey Looks to Create a Spark with The Butterfly Affect”- By Shaun Lang http://hnmag.ca/interview/talent-on-tap-stephanie-blakey-looks-to-create-a-spark-with-the-butterfly-affect/ ______________________ May 15, 2019 Women in View On Screen Report 2019 available now WIVOS19 — Women in View’s 5th report 