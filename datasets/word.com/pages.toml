["https://word.com/privacy-policy"]
title = "Privacy Policy | Merriam-Webster"
description = "Merriam-Webster is committed to respecting the privacy of visitors to its Web sites. The guidelines below explain how we protect the privacy of visitors to Merriam-Webster.com and its features."
full_description = '''Privacy Policy 14 Jun 2023 Last Updated and Effective as of: June 16, 2023 Your use of our Services is governed by our Terms of Use. OUR TERMS OF USE CONTAIN DISCLAIMERS OF WARRANTIES AND LIABILITY, A CHOICE OF LAW PROVISION AND A CLASS ACTION WAIVER. THESE PROVISIONS AFFECT YOUR RIGHTS ABOUT HOW TO RESOLVE ANY DISPUTE WITH MERRIAM-WEBSTER, INCORPORATED ("MERRIAM") INCLUDING UNDER THIS PRIVACY POLICY. PLEASE REVIEW. YOUR USE OF THE SERVICES IS ACCEPTANCE OF THIS PRIVACY POLICY AND OUR TERMS OF USE. Table of Contents Introduction Cookie Notice & Cookie Policy COPPA Compliance Links to Third-Party Websites or Apps How We Collect & Use Your Personal Information Use of Our Services - Information Collected Automatically & Other Information Your Rights & Choices How we respond to “Do Not Track” signals Children's Privacy The Puku Privacy Notice Security of Your Information Data Storage and Retention Consent to Processing and Transfer of Information about You Privacy Notice for California Residents EU Data Subject Rights EU Representative and Data Protection Officer Copyright Business Transfers Acceptance of Privacy Policy Terms and Conditions Questions, Comments or Complaints Introduction Your privacy is important to us. We understand that you are aware of and care about your own personal privacy interests, and we take that seriously. This Privacy Policy sets forth your privacy rights and applies to personal information we may collect through our websites, mobile applications or online services that link to this Privacy Policy (our “Services”); how we will use, disclose and protect this information; and how you can opt out of some of our uses and disclosures of your information. This Privacy Policy does not apply to information that we collect in other ways, such as over the phone, by mail or in person, except where state otherwise or as required by law. Your decision to use the Services and provide your personal data is voluntary. We indicate on our online, mobile, and other registration forms what types of personal data are requested. You may choose not to submit requested information online, or may choose to restrict the use of cookies (see our Cookie Policy and Your Rights & Choices below for more information), but that may limit the services Merriam-Webster is able to provide to you. The Services are a network of general audience sites, and are not targeted to, and do not knowingly collect personal data from, minors under 16 years of age. We request that these individuals do not provide personal data through the Services. Please see COPPA Compliance below for more information. We recognize that information privacy is an ongoing responsibility, and so we will from time to time update this Privacy Policy as we undertake new personal data practices or adopt new privacy policies. Cookie Notice & Cookie Policy Our Services use cookies, which are small data files that are placed on the hard drive of your computer, tablet, smartphone, or other devices when you visit a website and other tracking tools on our website and digital platforms. When we refer to cookies, this includes other similar technologies such as pixel tags, or web beacons. For more information about these tools and your choices, please refer to our Cookie Policy, Use of Our Services - Information Collected Automatically & Other Information and Your Rights & Choices below. COPPA Compliance In accordance with the Federal Children's Online Privacy Protection Act of 1998 (COPPA), we will never knowingly solicit, nor will we accept, personally identifiable information from users known to be under thirteen (13) years of age without the consent of their educational institution or the child's parent or guardian. We do, however, use COPPA-compliant, third party services that automatically collect or share certain information and usage data with us to support our internal operations as described under How we use your information and Puku third-party service providers below. If an educational institution with students that are under thirteen (13) years of age uses our Merriam-Webster Unabridged Service, the educational institution also may provide us with personally identifiable information about its students. We use student information to provide this Service to the educational institution and its students, consistent with our Merriam-Webster Unabridged Privacy Notice. If you believe that we have collected personal information from someone under the age of 13, please contact us at: privacy@m-w.com. How We Collect & Use Your Personal Information Merriam-Webster protects the identity of visitors to the Services by limiting the collection of personally identifiable information. Personal information provided by you to us will not be posted or published by us for viewing by third parties. In most cases, the information you provide is limited to first name, last name, email address, city, state, age, and phone number. We use this information to provide you with goods and services, including subscription services, publications, and the like. We do not sell personal information to anyone and only share it with third parties who are facilitating the delivery of our Services as provided in this Privacy Policy. You can enjoy many of our Services and their unique features without giving us your personal information. Subscriptions, User Login Registrations, and Mobile App Services When you subscribe to or register for a Service or download a mobile app service, we collect information about you that may include (but not be limited to) your name, email address, city, state, and age. We may also collect a personal mailing address and a phone number. Users may edit their information at any time to change, add or remove certain personal information. We process your personal information to administer and manage your subscription or other-like Service, deliver user benefits to you, inform you of prizes and other benefits or opportunities