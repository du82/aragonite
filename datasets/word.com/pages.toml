["https://word.com/about-us/faq"]
title = "About Us | Merriam-Webster"
description = "Merriam-Webster is the most reliable, trusted, easy-to-use dictionary and thesaurus online. Our products also include bilingual dictionaries and the Official Scrabble Dictionary. For over 150 years, Merriam-Webster has been America's leading and most-trusted provider of language information."
full_description = "Merriam-Webster is America's foremost publisher of language-related reference works. In addition to its award-winning Merriam-Webster.com dictionary site, the company offers a diverse array of print and digital language references, including Merriam-Webster's Collegiate® Dictionary, Eleventh Edition—America's best-selling desk dictionary—and the online Merriam-Webster Unabridged, which is the successor to its famed Webster's Third New International Dictionary. Merriam-Webster can be considered the direct lexicographical heir of Noah Webster. In 1843, the company bought the rights to the 1841 edition of Webster's magnum opus, An American Dictionary of the English Language, Corrected and Enlarged. At the same time, they secured the rights to create revised editions of the work. Since that time, Merriam-Webster editors have carried forward Noah Webster's work, creating some of the most widely used and respected dictionaries and reference books in the world. For more information, see Noah Webster and America's First Dictionary. In 1831, brothers George and Charles Merriam opened a printing and bookselling operation in Springfield, Massachusetts which they named G. & C. Merriam Co. The company, which was renamed Merriam-Webster, Incorporated, in 1982, has been in continuous operation since that time. For more information on the history of Merriam-Webster, see Merriam-Webster Continues Noah Webster's Legacy and Merriam-Webster's Ongoing Commitment. The first Merriam-Webster dictionary was issued on September 24, 1847. It cost $6.00 per copy and earned the praise of such notable figures as President James K. Polk and General Zachary Taylor. Although originally based on Merriam-Webster's Collegiate® Dictionary, Eleventh Edition, the Merriam-Webster.com Dictionary has since been significantly updated and expanded with new entries and revised definitions. It also has additional content and engagement features specifically designed for the digital user. In cases where discrepancies occur between the print Collegiate® Dictionary and the Merriam-Webster.com Dictionary, the Merriam-Webster.com Dictionary typically provides the most up-to-date information."
year_published = 2025
