["https://word.rodeo/news/game-statistics"]
title = "word.rodeo! - Game Statistics! 📊"
description = "When I started working on word.rodeo, I didn't plan far into the future and anticipated what features I would like to add next."
full_description = "When I started working on word.rodeo, I didn't plan far into the future and anticipated what features I would like to add next. 🤓 Naturally, this meant that adding statistics for your played games after the fact was a little bit complicated! But! There was a way! 💫 I have always stored game state and progress in localStorage in the browser and this would allow me to collect all your previously played games by iterating over it and calculate your game statistics this way! If you've already played a couple of word.rodeo games by now, you can check out your statistics immediately! 🥳 Fun fact: You can't loop over localStorage, but it has a length and you can get the keys by their numerical index, allowing you to iterate over them in this weird roundabout way! 🧑‍💻"
