["https://word.rodeo/news/create-your-own-wordle-website"]
title = "word.rodeo! - How to create your own Wordle website"
description = "Learn how you can create your own custom branded word puzzle page. Complete with a custom design and logo."
full_description = "What started as a fun pastime for a small group of friends in New Zealand back in November 2021 has quickly grown to be a global phenomenon. Josh Wardle, the creator of Wordle, could have never anticipated the viral sensation his game would become. Today, you can't visit your favorite social media page anymore without seeing the now well-known emoji grids everywhere. If you're like me, you may want to create your own word puzzles to entertain your friends, fans and followers. This is why I created WORD.RODEO, a progressive web app where everyone can create puzzles like Wordle for free! This little app has seen a small rise in popularity, allowing everyone to create custom challenges. Many teachers use it with their students, or K-Pop fans have challenged each other with hard riddles to see who's the biggest fan! With custom pages from WORD.RODEO, you can now create your completely custom branded website where you can plan and schedule your challenges for the world to play. For a small monthly subscription fee which supports an independent developer (me 🙂), you get a dashboard to customize and personalize every aspect around your branded Wordle-like page. You'll be redirected back to word.rodeo, to finish setting up your page with a password and the most important settings like your page title and time zone. After this you're ready to create your first puzzle and have it published at the date and time you wish. Afterwards, you are free to explore all the different settings WORD.RODEO has to offer. Maybe you want your players to be able to play previously missed puzzles? Enable the Archive feature! Or change up all the colors to integrate with your own website design? Every custom page can be embedded into another existing website using an iframe, you can copy and paste the code needed for this with a single click, too. What's a custom puzzle website without regular challenges? You can schedule an unlimited number of puzzles in advance. Each puzzle will be automatically published at your desired time, and every player will see the exact same puzzle at the same time around the world. No more confusion why some people see a different puzzle! 🌎"
year_published = 2022
clearnet = "https://word.rodeo/news/create-your-own-wordle-website"
