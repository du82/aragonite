["https://wordnet.princeton.edu/documentation/sensemap5wn"]
title = "sensemap(5WN) | WordNet"
description = "Name 2.1to3.0.noun.poly - mapping from polysemous noun senses in WordNet 2.1 to corresponding 3.0 senses 2.1to3.0.noun.mono - mapping from monosemous noun senses in WordNet 2.1 to corresponding 3.0 senses 2.1to3.0.verb.poly - mapping from polysemous verb senses in WordNet 2.1 to corresponding 3.0 senses 2.1to3.0.verb.poly - mapping from monosemous"
full_description = 'Name 2.1to3.0.noun.poly - mapping from polysemous noun senses in WordNet 2.1 to corresponding 3.0 senses 2.1to3.0.noun.mono - mapping from monosemous noun senses in WordNet 2.1 to corresponding 3.0 senses 2.1to3.0.verb.poly - mapping from polysemous verb senses in WordNet 2.1 to corresponding 3.0 senses 2.1to3.0.verb.poly - mapping from monosemous verb senses in WordNet 2.1 to corresponding 3.0 senses Description WordNet users who have semantically tagged text to senses in version 2.1, or who have statically assigned or used 2.1 senses in other applications should upgrade to WordNet 3.0 if possible. To help users automatically convert 2.1 noun and verb senses to their corresponding 3.0 senses, we provide sense mapping information with version 3.0. The sense mapping was done as follows: · Nouns and verbs unique to either database were ignored. · Nouns and verbs that are monosemous in both databases were found and their sense_key s and synset_offset s were mapped. These sense mappings are in the files 2.1to3.0.{noun,verb}.mono . · All senses of polysemous nouns and verb in version 2.1 were mapped to senses in version 3.0. Various heuristics were used to evaluate the similarity of 2.1 and 3.0 senses, and a score was assigned to each comparison. For each word, each 2.1 sense was compared to all of the 3.0 senses for the same word, and the 3.0 sense (or senses) with the highest score was deemed the best mapping. These sense mappings are in the file 2.1to3.0.{noun,verb}.poly . Heuristics include comparison of sense keys, similarity of synset terms, and relative tree location (comparision of hypernyms). Glosses are not used for comparisions, as they are often significantly modified. File Format A sense mapping is generally represented by two sense_key synset_offset pairs, one for the 2.1 sense and one for its corresponding 3.0 sense. For the polysemous sense mappings, sense_number is also in each pair. This field is not needed in the monosemous mappings since all monosemous words are assigned sense_number 1. See senseidx(5WN) for a detailed description of these fields. In all the mapping files, a space is the field delimiter unless otherwise noted, and each line is terminated with a newline character. 2.1to3.0.{noun,verb}.mono These files contain the mapping of sense keys for nouns and verbs that are monosemous in both WordNet 2.1 and 3.0. Although the actual words and sense numbers are the same in both databases, not all sense_keys are the same, and the synset_offset s are different. This file is an alphabetized list of one mapping per line. Each line is of the form: 2.1_sense_key ; 2.1_synset_offset 3.0_sense_key ; 3.0_synset_offset 2.1to3.0.{noun,verb}.poly These files contain the mapping of sense keys for nouns and verbs that are polysemous in WordNet 2.1 and are also found in 3.0. This file is sorted by score from highest score (100) to lowest (0), and then alphabetically within each score. Each line lists all 3.0 sense(s) that the corresponding 2.1 sense maps to with that score. Each line is of the form: score 2.1_sense_info 3.0_sense_info [3.0_sense_info...] where sense_info consists of the following three fields: sense_key ; synset_offset ; sense_number Scores Scores range from 0 to 100, and are an indication of how confident the mapping heuristics are that the senses are the same - a higher score indicates greater reliability in the mapping. The vast majority of senses mapped with a score of 90 or 100. Notes The number of senses of a polysemous word in version 2.1 often differs from the number of senses for the same word in version 3.0. While there will always be a mapping for each 2.1 sense to one or more 3.0 senses, there may be 3.0 senses to which no 2.1 sense is mapped. WordNet 2.1 words not found in either of the monsemous maps are unique to version 2.1, and therefore cannot be mapped to version 3.0. Environment Variables WNHOME Base directory for WordNet. Unix default is /usr/local/WordNet-3.0 , Windows default is C:\Program Files\WordNet\3.0 . Files All files are in WNHOME/sensemap on Unix platforms, WNHOME\sensemap on Windows. Files 2.1to3.0.noun.poly mapping of polysemous 2.1 noun senses to 3.0 senses 2.1to3.0.verb.poly mapping of polysemous 2.1 verb senses to 3.0 senses 2.1to3.0.noun.mono mapping of monosemous 2.1 noun senses to 3.0 senses 2.1to3.0.verb.mono mapping of monosemous 2.1 verb senses to 3.0 senses See Also senseidx(5WN) , wndb(5WN) , wnpkgs(7WN) .'
year_published = 2025
