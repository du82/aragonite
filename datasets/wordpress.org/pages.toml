["https://wordpress.org/about/history"]
title = "History – WordPress.org"
description = "History WordPress has come a long way since 2003. What started as a few lines of code and a mission to build a better web has become a prevalent web platform and thriving community. Read about the project’s journey through its first ten years in Milestones: The Story of WordPress—with a follow-up covering the latest decade […]"
full_description = "History WordPress has come a long way since 2003. What started as a few lines of code and a mission to build a better web has become a prevalent web platform and thriving community. Read about the project’s journey through its first ten years in Milestones: The Story of WordPress—with a follow-up covering the latest decade available in May 2023. Just in time for the project’s 20th anniversary. Jazzers and release dates WordPress core developers share a love of jazz music, and all our major releases are named in honor of jazz musicians we personally admire. Here’s a list of releases and the musicians they were named for: VersionMusicianDate6.7Sonny RollinsNovember 12, 20246.6Tommy DorseyJuly 16, 20246.5Regina CarterApril 2, 20246.4Shirley HornNovember 7, 20236.3Lionel HamptonAugust 8, 20236.2Eric DolphyMarch 29, 20236.1Mikhail AlperinNovember 1, 20226.0Arturo O’FarrillMay 24, 20225.9Joséphine BakerJanuary 25, 20225.8Art TatumJuly 20, 20215.7Esperanza SpaldingMarch 9, 20215.6Nina SimoneDecember 8, 20205.5Billy EckstineAugust 11, 20205.4Nat AdderleyMarch 31, 20205.3Rahsaan Roland KirkNovember 12, 20195.2Jaco PastoriusMay 7, 20195.1Betty CarterFebruary 21, 20195.0Bebo ValdésDecember 6, 20184.9Billy TiptonNovember 15, 20174.8Bill EvansJune 8, 20174.7Sarah VaughanDecember 6, 20164.6Pepper AdamsAugust 16, 20164.5Coleman HawkinsApril 12, 20164.4Clifford BrownDecember 8, 20154.3Billie HolidayAugust 18, 20154.2Bud PowellApril 23, 20154.1Dinah WashingtonDecember 18, 20144.0Benny GoodmanSeptember 4, 20143.9Jimmy SmithApril 16, 20143.8Charlie ParkerDecember 12, 20133.7Count BasieOctober 24, 20133.6Oscar PetersonAugust 1, 20133.5Elvin JonesDecember 11, 20123.4Grant GreenJune 13, 20123.3Sonny StittDecember 12, 20113.2George GershwinJuly 4, 20113.1Django ReinhardtFebruary 23, 20113.0Thelonious MonkJune 17, 20102.9Carmen McRaeDecember 18, 20092.8Chet BakerJune 11, 20092.7John ColtraneDecember 10, 20082.6McCoy TynerJuly 15, 20082.5Michael BreckerMarch 29, 20082.3D