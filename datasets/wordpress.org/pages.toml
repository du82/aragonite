["https://wordpress.org/download/releases/6-7"]
title = "WordPress 6.7 – WordPress.org"
description = "Refine the detail WordPress 6.7 debuts the modern Twenty Twenty-Five theme, unlocking fresh design options. The new ‘Zoom out’ mode simplifies high-level editing, while media support and design tools offer more control and flexibility. IntroducingTwenty Twenty-Five Endless possibility without complexity. Twenty Twenty-Five offers a flexible, design-focused theme that lets you build stunning sites with ease. […]"
full_description = "Refine the detail WordPress 6.7 debuts the modern Twenty Twenty-Five theme, unlocking fresh design options. The new ‘Zoom out’ mode simplifies high-level editing, while media support and design tools offer more control and flexibility. Get WordPress 6.7 IntroducingTwenty Twenty-Five Endless possibility without complexity. Twenty Twenty-Five offers a flexible, design-focused theme that lets you build stunning sites with ease. Tailor your aesthetic with an array of style options, block patterns, and color palettes. Pared down to the essentials, this is a theme that can truly grow with you. Get the big picture with Zoom Out Explore your content from a new perspective. Edit and arrange entire sections of your content like never before. A broader view of your site lets you add, edit, shuffle, or remove patterns to your liking. Embrace your inner architect. Connect blocks and custom fields with no hassle (or code) A streamlined way to create dynamic content. This feature introduces a new UI for connecting blocks to custom fields, putting control of dynamic content directly in the editor. Link blocks with fields in just a few clicks, enhancing flexibility and efficiency when building. Your clients will love you—as if they didn’t already. Embrace your inner font nerd New style section, new possibilities. Create, edit, remove, and apply font size presets with the next addition to the Styles interface. Override theme defaults or create your own custom font size, complete with fluid typography for responsive font scaling. Get into the details! Performance WordPress 6.7 delivers important performance updates, including faster pattern loading, optimized previews in the data views component, improved PHP 8+ support and removal of deprecated code, auto sizes for lazy-loaded images, and more efficient tag processing in the HTML API. Accessibility 65+ accessibility fixes and enhancements focus on foundational aspects of the WordPress experience, from improving user interface components and keyboard navigation in the Editor, to an accessible heading on WordPress login screens and clearer labeling throughout. And much more Support for HEIC images HEIC image support improves media management by allowing high-quality, space-efficient images across all blocks. Streamlined Query Loop block Improvements to the Query Loop block enhance usability by automating default settings and consolidating key options for easier customization. Extend the preview dropdown Enhancements to the Preview Options enable plugins and themes to add custom items to the dropdown menu, enriching how content is previewed. Customize site background Improved background tools enhance block customization and allow for global settings, ensuring consistency across the site while simplifying design efforts. Refined pages view in site editor Streamline editing with enhanced page views that offer customizable filtering options. Toggle filter displays to access refined views like Published and Drafts without clutter. Template registration API This new API simplifies custom template registration for plugins, allowing theme overrides and custom category templates for greater flexibility. Expanded design tools Support for design tools expands to more blocks, adding shadows, borders, and more, for greater customization. Improved Interactivity API Enhancements to the Interactivity API include bug fixes and new APIs for better state management. Thanks to the over 750 contributors who made this release View All Contributors75thtrombone · Aaron Jorbin · Aaron Robertshaw · Aaron Ware · aatanasov · abcsun · Abha Thakor · abhi3315 · Abhishek Deshpande · Abir · acafourek · Adam Heckler · Adam Silverstein · Adam Wood · Adam Zieliński · Adarsh Akshat · Adrian · aduth · Ahmar Zaidi · Ahmed Kabir Chaion · Ahmed Saeed · Ahsan Khan · Ajit Bohra · Akash Dhawade · Aki Hamano · Akira Tachibana · Akshat Kakkad · Al-Amin Firdows · Alan Fuller · Albert Juhé Lluveras · Alessandro Tesoro · Ale