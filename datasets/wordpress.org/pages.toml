["https://wordpress.org/about"]
title = "About – WordPress.org"
description = "our mission: democratize publishing the freedom to build. the freedom to change. the freedom to share. our story WordPress started in 2003 when Mike Little and Matt Mullenweg created a fork of b2/cafelog. The need for an elegant, well-architected personal publishing system was clear even then. Today, WordPress is built on PHP and MySQL, and licensed […]"
full_description = "our mission: democratize publishing the freedom to build. the freedom to change. the freedom to share. our story WordPress started in 2003 when Mike Little and Matt Mullenweg created a fork of b2/cafelog. The need for an elegant, well-architected personal publishing system was clear even then. Today, WordPress is built on PHP and MySQL, and licensed under the GPLv2. It is also the platform of choice for over 43% of all sites across the web. The WordPress open source project has evolved in progressive ways over time—supported by skilled, enthusiastic developers, designers, scientists, bloggers, and more. WordPress provides the opportunity for anyone to create and share, from handcrafted personal anecdotes to world-changing movements. People with a limited tech experience can use it “out of the box”, and more tech-savvy folks can customize it in remarkable ways. our mission WordPress is designed for everyone. We believe great software should work with minimum set up, emphasizing accessibility, performance, security, and ease of use. The basic WordPress software is simple and predictable, offering powerful features for growth and success. WordPress is open source software. Supporting the idea of democratizing publishing and the freedoms that come with open source, is a large community of people collaborating on and contributing to this project. WordPress is welcoming and inclusive. Our contributors’ passion drives the success of WordPress which, in turn, helps you reach your goals. WordPress contributors work around the globe, and have dedicated countless hours to build a tool that offers anyone a voice. the four freedoms WordPress is licensed under the General Public License (GPLv2 or later) which provides four core freedoms: 0 The freedom to run the program for any purpose. 1 The freedom to study how the program works and change it to make it do what you wish. 2 The freedom to redistribute. 3 The freedom to distribute copies of your modified versions to others. the technology Learn about WordPress, where it’s been, and where it’s going. RequirementsFeaturesSecurityRoadmapHistory the details Dive into the background details, like the GPL and other policies. DomainsLicenseAccessibilityPrivacy PolicyStatistics the people Learn about the community, how we get along and show our pride. PhilosophyEtiquetteLogosPeople of WordPress"
year_published = 2025
