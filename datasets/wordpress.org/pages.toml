["https://wordpress.org/playground"]
title = "WordPress Playground"
full_description = "WordPress in one click WordPress Playground is the platform that lets you run WordPress instantly on any device without a host. It’s your place to build, experiment, test, and grow. Explore Playground Start exploring instantly Build Create and learn WordPress quickly—even on mobile with no signal. Use Playground where you work best, whether that’s in the browser, Node.js, mobile apps, VS Code, or elsewhere. Install WordPress in a single click. Build a block theme in your browser and save it to GitHub. Integrate with Open AI and CLI apps to create new tools. Test Upgrade your QA process with the ability to review progress in your browser in a single click. When you’re ready, push updates instantly. Live preview pull requests in GitHub. Clone your site and experiment in a private sandbox. Test with different WordPress and PHP versions. Launch Reach your clients or customers faster. Showcase your product, let users try it live, or launch it in the App Store with zero lead time. Embed interactive product demos on websites. Put a native app running WordPress in the App Store. Create new sites from Blueprints and share them with a few clicks. The platform forbuilding platforms A single <iframe> tag is all it takes to integrate WordPress Playground with your application. We’ll help you get started. View documentation Change the future of the web Playground, just like WordPress, is an open source project powered by the collaborative efforts of passionate people like you. By contributing, you can help evolve the platform to solve all kinds of challenges. Get involved Playground is readywhen you are Build, try, test, fix—it’s all the freedoms you expect in a platform that makes it easy to get it all done. You’re just one click away. Explore Playground"
