["https://wordpress.org/about/requirements"]
title = "Requirements – WordPress.org"
description = "Requirements To run WordPress, it’s recommended your host supports: That’s really it. Apache or Nginx is recommended as the most robust and featureful server for running WordPress, but any server that supports PHP and MySQL will do. That said, for the smoothest experience in setting up—and running—your site, each host on the hosting page supports […]"
full_description = "Requirements To run WordPress, it’s recommended your host supports: PHP version 7.4 or greater. MySQL version 8.0 or greater OR MariaDB version 10.5 or greater. HTTPS support That’s really it. Apache or Nginx is recommended as the most robust and featureful server for running WordPress, but any server that supports PHP and MySQL will do. That said, for the smoothest experience in setting up—and running—your site, each host on the hosting page supports the above and more with no problems. For detailed PHP extension recommendations, see the Hosting Handbook. Note: If you are in a legacy environment where you only have older PHP or MySQL versions, WordPress also works with PHP 7.2.24+ and MySQL 5.5.5+. However, these versions have reached their official End Of Life and may expose your site to security vulnerabilities. Ask your host to run WordPress If you’re unsure whether or not your host can already run WordPress, here’s a request you can copy and paste to send them! I’m interested in running the open source WordPress <https://wordpress.org/> web software, and I was wondering if my account supported the following: PHP 7.4 or greater MySQL 8.0 or greater OR MariaDB 10.5 or greater Nginx or Apache with mod_rewrite module HTTPS support Thanks! Not required, but recommended for better security Hosting is more secure when PHP applications, like WordPress, are run using your account’s username instead of the server’s default shared username. Ask your potential host what steps they take to ensure the security of your account."
