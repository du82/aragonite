["https://wordpress.org/about/roadmap"]
title = "Roadmap – WordPress.org"
description = "Roadmap WordPress is continually under development. Currently, Phase 2 of the Gutenberg project formally wrapped with WordPress 6.3, and exploration of Phase 3 (Collaboration) is underway. The Gutenberg project is a reimagination of the way we manage content on the web. Its goal is to broaden access to web presence, a foundation of successful modern […]"
full_description = "Roadmap WordPress is continually under development. Currently, Phase 2 of the Gutenberg project formally wrapped with WordPress 6.3, and exploration of Phase 3 (Collaboration) is underway. The Gutenberg project is a reimagination of the way we manage content on the web. Its goal is to broaden access to web presence, a foundation of successful modern businesses. Phase 1 was the new block editor, Gutenberg, released in WordPress 5.0. In 2021 and 2022, we focused on merging Site Editing (Phase 2) into WordPress. This introduced the Site Editor and a suite of editing capabilities that enable leveraging blocks for use across an entire website. Phase 3 is Collaborative Editing, also known as Workflows given its implementation of features for workflows and real-time collaboration. Check out the Feature Projects Overview page for more information on site editing, its components, and other active feature work. To support the vision set in the latest State of the Word, the project has the following big picture goals for 2024: Test, iterate, and ship Phase 3 of the Gutenberg project. Continue to support the community through learning, events, and mentorship of current and future contributors. Address the difficulty in moving platforms through the Data Liberation project, as well as streamline existing review processes across project repositories. Want to get involved? Head on over to Make WordPress and meet the people developing, designing, documenting, translating, and marketing WordPress. 2025 releases Here are the tentative release dates for 2025 and links to their respective milestones in our issue tracker. Any projected dates are for discussion and planning purposes only and will be firmed up as we get closer to release. VersionPlanned6.8April 20256.9July 20257.0November 2025 New features are frozen a month before a release, with the focus shifting entirely to the quality and performance of the release. You can see a list of past releases on our history page. Long term roadmap As a reminder, these are the four phases outlined in the Gutenberg project: Easier Editing — Already available in WordPress, with ongoing improvements Customization — Site Editing, block patterns, block directory, block themes Collaboration — A more intuitive way to co-author content Multilingual — Core implementation for Multilingual sites"
year_published = 2025
