title = "Data Export Request | WordPress.org"
description = "Blog Tool and Publishing Platform"
full_description = "Data Export Request WordPress.org respects your privacy and intends to remain transparent about any personal data we store about individuals. Under the General Data Protection Regulation (GDPR), EU citizens and residents are entitled to receive a copy of any personal data we might hold about you. The following form will allow you to request an export of any data linked to your email address. You will be required to authenticate ownership of that address, and may be asked to provide additional identification or information necessary to verify the request and search our records. This export will contain relevant personal or private data stored on WordPress.org, WordPress.net, WordCamp.org, BuddyPress.org, bbPress.org, and other related domains and sites. Email Address By submitting this form, you declare that you are the individual owner of the specified email address and its associated accounts; and that all submitted information including any supplemental details necessary to verify your identity are true. Please Note: Before we can begin processing your request, we’ll require that you verify ownership of the email address. If the email address is associated with an account, we’ll also require you to log in to that account first."
