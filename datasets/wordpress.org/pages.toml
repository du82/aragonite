["https://wordpress.org/five-for-the-future"]
title = "Five for the Future | How five percent is powering the next generation of the web | WordPress.org"
description = "Commit to the future of WordPress and the open web."
full_description = "The Five for the Future program allows organizations to contribute time or sponsor resources to support the sustained growth of the WordPress project, ensuring the longevity of WordPress and open source while investing in their own success. Take your seat at the table Organizations that participate in Five for the Future play a key role in shaping the future of WordPress. Your contributions can translate that effort into a direct and meaningful impact on your business and beyond. Explore the Five for the Future handbook to learn more about the program. Looking for inspiration? Take a look at organizations contributing time and sponsoring resources to keep the project going. Gain a strategic advantage Sync your business objectives with WordPress’s development to stay current with platform trends, and get early insight into WordPress releases to inform your product decisions. Recruit and develop top talent Connect with a global network of professionals who already contribute to open source. By sponsoring their contributions, you’ll also provide existing teams with cost-effective, hands-on professional development opportunities. Represent your and your client’s needs Represent your customers’ or clients’ perspectives within the WordPress community. As you contribute and provide expertise, you’ll gain the recognition to influence key decisions. Extend your expertise across WordPress The WordPress project is uniquely set up to benefit from contributing teams across all disciplines. Along with development and technical expertise, here are some other focus areas your organization can contribute to: Community building and management Documentation Translation and localization Training and education Testing and QA Discover all the contributing teams your company can get involved with as a Five for the Future participant. Shape the future of WordPress Become a Five for the Future participant. Contribute as an organization Contribute as an individual Driving WordPress Forward Salesforce empowers WordPress Salesforce donates around $8.8 million USD to WordPress.org every year by supporting the Make/WordPress Slack instance, the main platform for real-time communication within the WordPress project. Read more about their contribution. Contributor experiences See all testimonials Milana Cap Sponsored by XWP Milana Cap has been serving as a co-representative for the Documentation team since 2021. Driven by her advocacy for WordPress education, she has delivered talks and workshops on WP-CLI in more than 30 countries. Carolina Nymark Sponsored by Yoast Carolina Nymark is a developer and educator focusing on the block editor and themes. She is a bundled theme component maintainer and was the development lead for the default Twenty Twenty-One theme. Pooja Bhimani Sponsored by Multidots Pooja Bhimani is an active contributor to WordPress, dedicating 40 hours per week towards advancing Gutenberg. Her contributions span across development, mentorship, and advocacy for open-source initiatives."
