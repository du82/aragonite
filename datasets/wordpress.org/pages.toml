full_description = "2025 Shaping Tomorrow at WordCamp Asia 2025 February 22, 2025 Over 1,400 attendees from 71 countries gathered at the Philippine International Convention Center in Manila, and nearly 15,000 more joined online, for WordCamp Asia 2025. It’s the people. It’s the friendships and the stories. Matt Mullenweg, WordPress Cofounder The flagship WordPress event started with a dedicated Contributor Day, followed by two days of engaging talks,…Read Post 2025 WordCamp Asia 2025: Manila Magic February 14, 2025 The first major WordCamp of the year is here! WordCamp Asia 2025 lands in Manila, Philippines, from February 20-22, bringing together open source enthusiasts, developers, and WordPress professionals from across the region—and the world. With three packed days of learning, networking, and collaboration, this year’s event promises fresh insights, dynamic discussions, and plenty of opportunities…Read Post 2024 State of the Word 2024: Legacy, Innovation, and Community December 16, 2024 On a memorable evening in Tokyo, State of the Word 2024 brought together WordPress enthusiasts from around the world—hundreds in person and millions more online. This event marked the first time State of the Word was hosted in Asia, reflecting the platform’s growing global reach.Read Post 2024 PDX + WCUS 2024: A Recap September 21, 2024 WordCamp US (WCUS), North America’s largest WordPress event, hosted over 1,500 attendees from around the world at the Oregon Convention Center in Portland, from September 17 to 20.Read Post 2024 WordCamp US 2024: Oregon-a See You There? September 3, 2024 Starting September 17, open source and WordPress professionals from around the world will touch down in Portland, Oregon, for four days of learning, connecting, and collaborating.Read Post 2024 Highlights from WordCamp Europe 2024 June 15, 2024 From June 13-15, 2024, WordPress enthusiasts from across the globe gathered in Torino to explore and celebrate the world’s most popular web platform at WordCamp Europe 2024. A dedicated team of 250 volunteers, led by WordCamp veterans Wendie Huis in ‘t Veld, Juan Hernando, and Takis Bouyouris, organized and produced the event.Read Post"
