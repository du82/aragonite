["https://wordpress.org/about/privacy/data-erasure-request"]
title = "Data Erasure Request | WordPress.org"
description = "Blog Tool and Publishing Platform"
full_description = "Data Erasure Request WordPress.org respects your privacy and intends to remain transparent about any personal data we store about individuals. Under the General Data Protection Regulation (GDPR), EU citizens and residents may request deletion of personal data stored on our servers. The following form will allow you to request deletion of your account and relevant personal and private data. You will be required to authenticate ownership of that address, and may be asked to provide additional identification or information necessary to verify the request. Important! This will request permanent deletion of your WordPress.org account, and relevant personal or private data stored on WordPress.org, WordPress.net, WordCamp.org, BuddyPress.org, bbPress.org, and other related domains and sites. Please note that we cannot remove or provide access to data stored on WordPress sites hosted or administered by third parties. Not all data can be erased, please review the Privacy Policy for details. This will not erase your support forum activity. Any topics or replies created will remain associated with an anonymized account. Email Address By submitting this form, you declare that you are the individual owner of the specified email address and its associated accounts; and that all submitted information including any supplemental details necessary to verify your identity are true. You also declare that it is your intention for accounts associated with that email address to be permanently deleted. Please Note: Before we can begin processing your request, we’ll require that you verify ownership of the email address. If the email address is associated with an account, we’ll also require you to log in to that account first."
