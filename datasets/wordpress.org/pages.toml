title = "Blocks – WordPress.org"
description = "Blocks Block components. No code. Just click and insert content. Build without limits The technology that powers much of the web has never been easier to learn. Blocks allow you to visually interact with any piece of content, with or without code—fueling rich layouts, interactive onboarding, and endless extensibility. As powerful for design as they […]"
full_description = "Blocks Block components. No code. Just click and insert content. Build without limits The technology that powers much of the web has never been easier to learn. Blocks allow you to visually interact with any piece of content, with or without code—fueling rich layouts, interactive onboarding, and endless extensibility. As powerful for design as they are for development, but still intuitive enough for newcomers. Create blocks Browse the block directory Paragraph Heading Media Image Video Audio Columns File WordPress’s secret power Blocks are the visual foundation of WordPress, and can be used to create and manage every part of your site. They're also easier than you think. Learn how to edit a block and you learn how to use all of WordPress—without having to write code. For inspiration, check out what others have done with WordPress in the Showcase. Explore the Showcase Complete creative control The WordPress editor is the default way to insert, transform, style, and move your blocks around on a visual canvas thanks to a simple drag-and-drop interface. Try blocks live registerBlockType( 'your-first-block/hello-world', { edit: function () { return <p>Hello world (from the editor)</p>; }, save: function () { return <p>Hello world (from the frontend)</p>; }, } ); Hello world (from the editor) Create your own If you can't find a block that suits your needs, create your own. Creating a block is as simple as building a React component. Use the @wordpress/create-block package to jumpstart your creation. Create a block See what's new with blocks The latest major WordPress version includes updates that can improve the blocks you use and enhance your overall site-building experience. Get more details about what features are available in the current release. Discover the latest WordPress release Only the beginning While blocks are powerful on their own, they’re also part of something bigger and can be combined or deployed in various ways. As a unified and open syntax, they're easily understood by editors, browsers, and even AI. So whoever is editing will find it easy to make vibrant, personalized designs and experiences happen, fast. Create custom blocks Design block patterns Build block themes Deploy blocks"
year_published = 2025
