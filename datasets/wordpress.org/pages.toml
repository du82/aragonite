["https://wordpress.org/news/2025/02/wordcamp-asia-2025-manila-magic"]
title = "WordCamp Asia 2025: Manila Magic – WordPress News"
full_description = "February 14, 2025 By Bernard Meyer in Events, WordCamp WordCamp Asia 2025: Manila Magic The first major WordCamp of the year is here! WordCamp Asia 2025 lands in Manila, Philippines, from February 20-22, bringing together open source enthusiasts, developers, and WordPress professionals from across the region—and the world. With three packed days of learning, networking, and collaboration, this year’s event promises fresh insights, dynamic discussions, and plenty of opportunities to connect. Solutions spotlight Throughout the conference days, multiple presentations will focus on the solutions provided by our amazing sponsors. This is a great opportunity to learn more about their initiatives and solutions. Explore the solutions spotlight Keynotes, panels, and deep dives The main conference, which will be held on February 21-22, will feature a lineup of notable keynote speakers, including digital innovation leaders and open-source advocates. Attendees can expect diverse sessions on business strategy, development of best practices, and technical advancements. For those looking to sharpen their skills, presentations will dive deep into topics like SEO for WordPress, performance optimization, and AI-powered content creation. Plus, don’t miss the electrifying WordPress Speed Build Battle, where developers race to create stunning sites in record time. YouthCamp On February 22, WordCamp Asia 2025 will host YouthCamp, a pre-registered event designed to introduce young minds to WordPress and its endless possibilities. This initiative aims to engage the next generation of WordPress users, developers, and contributors through hands-on activities and interactive sessions Closing Q&A with Matt Mullenweg WordPress Cofounder Matt Mullenweg will wrap up the event with a live Q&A session on February 22. Whether attending in person or tuning in online, you can catch his insights live on the WordPress YouTube channel at 4:00 p.m. Philippine Time (08:00 UTC). After party As the sun sets on WordCamp Asia 2025, the excitement continues with the After Party (theme: Island Vibe)! Get ready to experience the vibrant spirit of the Philippines with a lively gathering at The Forum at PICC. Expect a night filled with great conversations, music, and a celebration of the WordPress community. Get WordCamp-ready Secure your WordCamp Asia 2025 tickets (if you haven’t already!) Browse the full schedule of sessions to plan your experience Follow WordCamp Asia on X, LinkedIn, and Instagram for real-time updates As always, be part of the conversation! Whether you’re attending in Manila or following along online, share your experiences using #WCAsia and #WordPress. Manila is calling—see you at WordCamp Asia 2025! Share this: Threads Mastodon Bluesky X Facebook LinkedIn"
