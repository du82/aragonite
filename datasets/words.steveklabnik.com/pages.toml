full_description = "Jan 25 2018 As someone who has significantly different beliefs than Peter Thiel, today is likely my second-to-last power of two years alive. Two years ago, I wrote a post about turning 30, and I pretty much feel the same way. Never enough time, tick tock, tick tock. I have today off (thanks Mozilla!), but am still considering working anyway, because I really care about what I’m working on, and am excited about it. We’ll see. I feel like I have more to say here, but also don’t. So maybe let’s leave it at that."
