["https://wordsoutloud.org.uk/data-protection-statement"]
title = "Data Protection Statement | Words Out Loud"
full_description = "Data Protection Statement Words Out Loud Data Protection Statement This policy applies to all Trustees and volunteers of Words Out Loud Organisation. Introduction The purpose of this policy is to enable Words Out Loud to: comply with the law in respect of the data it holds about individuals; follow good practice; protect Words Out Loud’s clients, volunteers and other individuals protect the organisation from the consequences of a breach of its responsibilities. Brief introduction to Data Protection Act 1998 and GDPR The Data Protection Act 2018 gives individuals the right to know what information is held about them. It provides a framework to ensure that personal information is handled properly. The Act works in two ways. Firstly, it states that anyone who processes personal information must comply with eight principles, which make sure that personal information is: Fairly and lawfully processed Processed for limited purposes Adequate, relevant and not excessive Accurate and up to date Not kept for longer than is necessary Processed in line with the rights of Data Subjects Secure Not transferred to other countries without adequate protection The second area covered by the Act provides individuals with important rights, including the right to find out what personal information is held on computer and most paper records. General Data Protection Regulation (GDPR) came into force on 25th May 2019. Policy statement Words Out Loud will: comply with both the law and good practice respect individuals’ rights be open and honest with individuals whose data is held provide training and support for staff and volunteers who handle personal data, so that they can act confidently and consistently Words Out Loud recognises that its first priority under the Data Protection Act 2018 is to avoid causing harm to individuals. Information about staff, volunteers and clients will be used fairly, securely and not disclosed to any person unlawfully. Secondly, the Act aims to ensure that the legitimate concerns of individuals about the ways in which their data may be used are taken into account. In addition to being open and transparent, Words Out Loud will seek to give individuals as much choice as is possible and reasonable over what data is held and how it is used. Words Out Loud is the Data Controller and is registered under the Data Protection Act 2018. All processing of personal data will be undertaken in accordance with the data protection principles. Definitions The Data Subject is the individual whose personal data is being processed. Examples include: employees – current and past volunteers job applicants donors users suppliers. Processing means the use made of personal data including: obtaining and retrieving holding and storing making available within or outside the organisation printing, sorting, matching, comparing, destroying. The Data Controller is the legal ‘person’, or organisation, that decides why and how personal data is to be processed. The data controller is responsible for complying with the Data Protection Act. The Data Processor – the data controller may get another organisation to be their data processor, in other words to process the data on their behalf. Data processors are not subject to the Data Protection Act. The responsibility of what is processed and how remains with the data controller. There should be a written contract with the data processor who must have appropriate security. The Data Protection Officer is the name given to the person in organisations who is the central point of contact for all data compliance issues. Responsibilities The Board of Trustees recognises its overall responsibility for ensuring that Words Out Loud complies with its legal obligations. The Data Protection Officer is currently Mike Jenkins, who has the following responsibilities: Briefing the board on Data Protection responsibilities Reviewing Data Protection and related policies Advising other staff on Data Protection issues Ensuring that Data Protection induction and training takes place Handling subject access requests Approving unusual or controversial disclosures of personal data Ensuring contracts with Data Processors have appropriate data protection clauses Electronic security Approving data protection-related statements on publicity materials and letters Each trustee and volunteer at Words Out Loud who handles personal data will comply with the organisation’s operational procedures for handling personal data (including induction and training) to ensure that good Data Protection practice is established and followed. All staff and volunteers are required to read, understand and accept any policies and procedures that relate to the personal data they may handle in the course of their work. Significant breaches of this policy will be handled under Words Out Loud’s disciplinary procedures. Confidentiality Because confidentiality applies to a much wider range of information than Data Protection, Words Out Loud has a separate Confidentiality Policy. This Data Protection Policy should be read in conjunction with Words Out Loud’s Confidentiality Policy. Words Out Loud has a privacy statement for clients, setting out how their information will be used. This is available on request, and a version of this statement will also be used on the Words Out Loud web site. (See Appendix) Trustees, volunteers and sessional workers are required to sign a short statement indicating that they have been made aware of their confidentiality responsibilities. (See Confidentiality Policy and Statement.) In order to provide some services, Words Out Loud will need to share client’s personal data with other agencies (Third Parties). Verbal or written agreement will always be sought from the client before data is shared. Where anyone within Words Out Loud feels that it would be appropriate to disclose information in a way contrary to the confidentiality policy, or where an official disclosure request is received, this will only be done after discussions with a manager or the Data Protection Officer. All such disclosures will be documented. Security This section of the policy only addresses security issues relating to personal data. It does not cover security of the building, business continuity or any other aspect of security. Any recorded information on clients, volunteers and trustees will be: Kept in locked cabinets Protected by the use of passwords if kept on computer Destroyed confidentially if it is no longer needed Access to information on the main database is controlled by a password and only those needing access are given the password. Staff and volunteers should be careful about information that is displayed on their computer screen and make efforts to ensure that no unauthorised person can view the data when it is on display. Notes regarding personal data of clients should be shredded or destroyed. Data Recording and storage Words Out Loud has a single database holding basic information about all clients and volunteers. The back-ups are kept on the cloud. Words Out Loud will regularly review its procedures for ensuring that its records remain accurate and consistent and, in particular: The database system is reviewed and re-designed, where necessary, to encourage and facilitate the entry of accurate data. Data on any individual will be held in as few places as necessary, and all staff and volunteers will be discouraged from establishing unnecessary additional data sets. Effective procedures are in place so that all relevant systems are updated when information about any individual changes. Staff and volunteers who keep more detailed information about individuals will be given additional guidance on accuracy in record keeping. Data will be corrected if shown to be inaccurate Words Out Loud stores archived paper records of clients and volunteers securely in the office. Access to data All clients and customers have the right to request access to all information stored about them. Any subject access requests will be handled by the Data Protection Officer within the required time limit. Subject access requests must be in writing. All staff and volunteers are required to pass on anything which might be a subject access request to the Data Protection Officer without delay. All those making a subject access request will be asked to identify any other individuals who may also hold information about them, so that this data can be retrieved. Where the individual making a subject access request is not personally known to the Data Protection Officer their identity will be verified before handing over any information. The required information will be provided in permanent form unless the applicant makes a specific request to be given supervised access in person. Words Out Loud will provide details of information to service users who request it unless the information may cause harm to another person. Trustees have the right to access their file to ensure that information is being used fairly. If information held is inaccurate, the individual must notify the Chair so that this can be recorded on file. Transparency Words Out Loud is committed to ensuring that in principle Data Subjects are aware that their data is being processed and for what purpose it is being processed; what types of disclosure are likely; and how to exercise their rights in relation to the data. Data Subjects will generally be informed in the following ways: Volunteers: in the volunteer welcome/support pack Clients: when they request (on paper, on line or by phone) services Standard statements will be provided to staff for use on forms where data is collected. Whenever data is collected, the number of mandatory fields will be kept to a minimum and Data Subjects will be informed which fields are mandatory and why. Consent Consent will normally not be sought for most processing of information about staff. Although details will only be disclosed for purposes unrelated to their work for Words Out Loud (e.g. financial references) with their consent. Information about volunteers will be made public according to their role, and consent will be sought for (a) the means of contact they prefer to be made public, and (b) any publication of information which is not essential for their role. Information about clients will only be made public with their consent. (This includes photographs.) ‘Sensitive’ data about clients (including health information) will be held only with the knowledge and consent of the individual. Consent should be given in writing, although for some services it is not always practicable to do so. In these cases verbal consent will always be sought to the storing and processing of data. In all cases it will be documented on the database that consent has been given. All Data Subjects will be given the opportunity to opt out of their data being used in particular ways, such as the right to opt out of direct marketing (see below). Words Out Loud acknowledges that, once given, consent can be withdrawn, but not retrospectively. There may be occasions where Words Out Loud has no choice but to retain data for a certain length of time, even though consent for using it has been withdrawn. Direct marketing Words Out Loud will treat the following unsolicited direct communication with individuals as marketing: seeking donations and other financial support; promoting any Words Out Loud services; promoting Words Out Loud events; promoting sponsored events and other fundraising exercises; marketing the products of Words Out Loud Trading; marketing on behalf of any other external company or voluntary organisation. Whenever data is first collected which might be used for any marketing purpose, this purpose will be made clear, and the Data Subject will be given a clear opt out. If it is not possible to give a range of options, any opt-out which is exercised will apply to all Words Out Loud marketing. Words Out Loud does not have a policy of sharing lists, obtaining external lists or carrying out joint or reciprocal mailings. Words Out Loud will only carry out telephone marketing where consent has been given in advance, or the number being called has been checked against the Telephone Preference Service. Whenever e-mail addresses are collected, any future use for marketing will be identified, and the provision of the address made optional. Staff training and acceptance of responsibilities All trustees and volunteers who have access to any kind of personal data will be given copies of all relevant policies and procedures during their induction process, including the Data Protection policy, Confidentiality policy and the operational procedures for handling personal data. All trustees and volunteers will be expected to adhere to all these policies and procedures. Data Protection and GDPR will be included in the induction training for all volunteers. Words Out Loud will provide opportunities for everyone to explore Data Protection issues through training, team meetings, and supervisions. Policy review The policy will be reviewed in June 2024 by the Chair and approved by the Board of Trustees. It will also be reviewed in response to changes in relevant legislation, contractual arrangements, good practice or in response to an identified failing in its effectiveness. Date this policy was approved by the Board of trustees: 18/06/2021 Appendix: Privacy statement When you request information from Words Out Loud, sign up to any of our services or buy things from us, Words Out Loud obtains information about you. This statement explains how we look after that information and what we do with it. We have a legal duty under the Data Protection Act and GDPR legislation to prevent your information falling into the wrong hands. We must also ensure that the data we hold is accurate, adequate, relevant and not excessive. Normally the only information we hold comes directly from you. Whenever we collect information from you, we will make it clear which information is required in order to provide you with the information, service or goods you need. You do not have to provide us with any additional information unless you choose to. We store your information securely on our computer system, we restrict access to those who have a need to know, and we train our staff in handling the information securely. If you have signed up to a class or other service we will also pass your details to the professional worker providing that service. That worker may hold additional information about your participation in these activities. We would also like to contact you in future to tell you about other services we provide, to keep you informed of what we are doing and ways in which you might like to support Words Out Loud. You have the right to ask us not to contact you in this way. We will always aim to provide a clear method for you to opt out. You can also contact us directly at any time to tell us not to send you any future market"
