["https://wordsoutloud.org.uk/2021/10/04/at-home-with-mr-and-mrs-twinkie-elaine-alacron"]
title = "At Home with Mr. and Mrs. Twinkie – Elaine Alacron | Words Out Loud"
full_description = "At Home with Mr. and Mrs. Twinkie – Elaine Alacron Elaine Alarcon, Word is Out Elaine joins us regularly from the US for our Zoom Open-Mic on the 3rd Wednesday of every month. In this amusing and ordinarily tragic poem, Elaine paints a picture of a couple ageing together, where the every day mishaps of a practiced routine begin to falter. At Home with Mr. and Mrs. Twinkie Elaine Alacron “Stand up straight; you’re listing forward,” she said.He said, “You’re looking like George Washington.” He soaked his sore finger in a cup of Epsom saltsthen later drank it, thinking it was tea. Once her tube of preparation H lay too closeto her tooth brush; brushing went smoothly that day. One day he couldn’t start his car.Triple A said the gas tank was empty. One day she mistook the Robitussin in hertravel bottle for hypo-allergenic shampoo. One day in Zoom he forgot the video was onand took out his dentures and licked them clean. One day she forgot his warning not to use the pinkice cubes containing orchid food and put them in her drink. Every day he forgets to read the “Chew Slowly” signtaped to the potted orchid, and bites his tongue. One day she essayed a three-tiered chocolate cake;shaped like Jobba the Hut, the sludge slid off the plate. “Kids under 18 shouldn’t know about chocolate,” he said;divvying up the chocolate hearts she said, “We don’t have kids.” In sleep he sometimes dreamed of tigers;when he awoke, he was one. © Copyright 2021 Elaine Alacron – All Rights Reserved"
year_published = 2023
