["https://wordsoutloud.org.uk/2021/10/15/words-out-loud-from-the-sea"]
title = "Words Out Loud from the Sea | Words Out Loud"
full_description = "Words Out Loud from the Sea Deni Jones, Word is Out To those of us living in and around Chichester, living by the sea influences us in ways we are unaware of until readings by the sea brought it home to us. On Tuesday 12th October, Words Out Loud hosted an evening of Words from the Sea at the Anchor Bleu at Bosham Harbour. The evening was convivial, congenial, filled with fun and laughter, fuelled by the versatile offerings of poetry, prose, diaries and even song/rap! The atmosphere was electric and made more so by the warm and cosy surroundings of the Anchor Bleu where we were served and pampered by the excellent staff and nourished by delicious food and drink. We are so grateful to Mark, Kate and Ben at the Anchor for making the evening go with a swing and in response to the most frequent question of the evening – yes, we will be back! Deni Jones Our Next Themed Reading A Festival of Light An evening of festive readings ~ celebrating the spoken word together Dec 2021 The Pavillion Cafe & BarConnolly Way, Graylingwell Park, Chichester, PO19 6DA"
