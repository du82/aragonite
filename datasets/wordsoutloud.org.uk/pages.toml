["https://wordsoutloud.org.uk/2021/10/03/silvergrey-tina-macnaughton"]
title = "Poems- Tina MacNaughton | Words Out Loud"
full_description = "Poems- Tina MacNaughton Poems, Tina MacNaughton, Word is Out Tina MacNaughton shares with us a few of her poems, encouraging us to look a little deeper at our individual and collective experiences. Tina writes regularly for the community in Wokingham, Today and The Portsmouth Evening News in an attempt to spread the enjoyment and therapeutic benefits of rhyme and rhythm of our rich and beautiful language. Silvergrey I like to thinkmy life is not Goldenbut mainly Silversprinkled withoccasional stardustand gold and gemsthat sparkle,excite andlift meabove the swathesof greynessthat sometimesthreaten to suffocateand drownmy souluntil they pass,as they always do.I know I needboth Goldenand Greynessto appreciatethe mainlySilver times. I want to be too much! You say I’m too much?why should I dumb downcalm down, quieten downI want to be a harpy,harlot, witch, scarlet womangossip, drama queenloud, proud, out thereI want to shout,laugh raucously,giggle, cryexpress myself with joy,passion, sadness and honestyI want to get excitedcreate some dramaI want to be more, not lesslouder, not quieterlarger, not smallerI want to fill my space.You think I’m too much?well maybe you’re insufficient,lacking, too small,not enough.I don’t want lacklustre, withdrawnwithheld, self-contained.I want to make a noisecreate some colourmake an entrancedon’t want vanilladon’t want anodynedon’t want neutral I want more of me. Tina Cathleen MacNaughtonFrom On the Shoulders of Lions, (The Choir Press) True we’ll sit up all nightshare each other’s storiesyou’ll tell me yoursI’ll tell you minewe’ll talk through memoriespast hurts, comforts, caresbeginnings and endingswe’ll feel close as we share we’ll mull over detailspick apart every lineand then when it’s overwe’ll think back to that timetiny inconsistencieswill worry and fret that’s when we’ll realisethough our stories were truethere’s always a subtextbetween Me and You. Tina Cathleen MacNaughtonEnd of Oct 2020 Visit Tina’s website at www.writerhymespoetry.com © Copyright 2021 Tina McNaughton – All Rights Reserved"
