title = "A Celebration of Poetry on National Poetry Day  in Chichester – Thursday 7th October 2021, 7.30pm | Words Out Loud"
full_description = "A Celebration of Poetry on National Poetry Day in Chichester – Thursday 7th October 2021, 7.30pm Barry Smith, Word is Out The Novium, Tower Street, Chichester, PO19 1QH Open-Mic Event Thursday 7th October 2021, 7.30pm Celebrate National Poetry Day by joining South Downs poets Stephanie Norgate and Barry Smith for the launch of their new poetry collections – The Conversation (Bloodaxe) from Stephanie and Performance Rites (Waterloo Press) from Barry. Stephanie is a distinguished poet and playwright, with two previous poetry collections, Hidden River (shortlisted for a Forward award ) and The Blue Den. She ran Chichester University’s MA in Creative Writing for many years. Barry is director of Southdowns Poetry Festival (SDPF), runner-up for a BBC Proms Poetry award and was shortlisted for the 2021 Culture Matters Bread & Roses Award. Live music from Linda Kelsall-Barnett on classical guitar and open mic poetry combine to offer a stimulating mix of words and music. Readers and listeners equally welcome. Celebrate poetry in the historic setting of the Novium, overlooking the Roman ruins Tickets £7.50 (to include a glass of wine) are available from The Novium, 01243 816525. https://chichesterboxoffice.ticketsolve.com/shows/873620405"
