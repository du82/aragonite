title = "Words Out Loud | Are you Listening?"
description = "WordsOut Loud"
full_description = "1st Wednesday of the month in person in Chichester Words Out Loud holds regular scheduled readingswhere everyone is welcometo come and read a poem or piece of prose. It doesn’t matter if this is the first piece you have written or whether you are a seasoned pro, you will find a warm and supportive welcome as you share your work with us out loud. If speaking out loud is not your thing just come along to listen and enjoy the readings with everyone. Downstairs at Franco Manca, 1-3 South Street, Chichester PO19 1EH First Wednesday each month, 6pm for a 6:30pm start. We usually finish around 8:30pm. Come along to hear Poetry & Spoken Word live and also take the opportunity to enjoy Franco Manca’s selection of Pizza, Salads and Light Bites as well as a wide selection of wines, beers, cocktails & spirits, teas, coffees and soft drinks. Seven Up A Live Performance, Cabaret-Style Event at Franco Manca in Chichester, presented by Words Out Loud. Mesdames et messieurs, Ladies and gentlemen. Guten abend! Bon soir! Good evening! Seven performers, giving Seven performances, each of Seven minutes’ duration.Set your clock, save the date, book a ticket, get your coat, grab a drink, take a seat.This is Seven Up. Downstairs at Franco Manca, 1-3 South Street, Chichester PO19 1EHThird Thursday of odd numbered months7pm – 10pm Book Tickets Celebrating the spoken word In-Person and Online About Upcoming Events In-Person Next Event: The first Weds each month, 6pm for 6:30pm Start Open-Mic Join us for our regular in-person Open-Mic event, taking place on the first Wednesday each month Downstairs at Franco Manca in Chichester. Book Tickets Venue Info Regular Open-Mic, Curated Readings, Workshops & More Words Out Loud is a Charitable Trust that aims to foster the enjoyment and benefits of the spoken word in Chichester About Are You Listening? Come along to one of our events, read some words out loud or simply listen to some orignal poetry and prose. WordsOut Loud Upcoming Events View Events View Upcoming Events Join the Mailing List Sign up for our Mailing List to be informed of our events and other news Success! Your email has been registered with our Mailing List. You will receive opt in confirmation to the email address you entered. First Name Last Name Email Subscribe Ventura Poetry County Project The Peaceful Paintbrush Voluntary Action Arun & Chichester Chichester Community Development Trust Chichester City Council Chichester District Council South Downs Poetry Festival Words Out Loud are very grateful for the support of Local Giving and Magic Little Grants in helping us extend our work in the community, helping people to explore their creative talents and share them with audiences."
