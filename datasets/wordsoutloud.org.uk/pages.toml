["https://wordsoutloud.org.uk/2021/10/13/words-out-loud-is-encouraging-inspirational-and-rather-wonderful"]
title = "Words Out Loud is encouraging, inspirational and rather wonderful | Words Out Loud"
full_description = "Words Out Loud is encouraging, inspirational and rather wonderful Tina MacNaughton, Word is Out I love being part of Words Out Loud and our Wednesday evening zoom meetings really gave me something to look forward to during lockdown. I am not a natural performer and have always been very nervous of public speaking, so this was a fantastic, safe and supportive forum for me to spread my performance poetry wings! It has certainly improved my confidence and helped me to ‘own’ my writing. I even managed to to read at Portsmouth Victorious Festival this summer – a major achievement for me and I thoroughly enjoyed it. I am not sure I would have done it without the experience gained at Words Out Loud. A lovely group of people and a high standard of writing – not that it matters really, we all just like sharing our work and having a go. Words Out Loud is encouraging, inspirational and rather wonderful. Tina MacNaughton"
