["https://wordsoutloud.org.uk/submissions"]
title = "Submissions | Words Out Loud"
description = """
Join the Mailing List
Sign up for our Mailing List to be informed of our events and other news"""
full_description = "Submissions You can find details of events and projects for which we are seeking written submissions on this page. Guidance for all submissions Please attach your document in MS Word format and please clearly state the following information on your document (not in the body of the email). Your full name (the name you wish to be credited for with your work, pen names are perfectly fine). Your contact email address The title of your work and the date Please save your file using the following format: your-name-title-of-your-work (EG: Fred-Blogs-The-Otters-Dream) Please put the name of the event/project you are submitting work for in the subject line of your email Seven Up – Ongoing This is our bi-monthly entertainment evening where we showcase performers and creatives from a range of different disciplines, including dance, music, poetry, drama, comedy, movement, puppetry, storytelling and so on. We’re always on the look out for new acts to take part. So, if you have something that you think you could perform as part of this lively evening of entertainment, please get in touch and give us the details by clicking the submissions button below. Submissions call for International Women’s Day 2025 ‘A Happy Ending For Her’ Calling all female writers, actors, creatives. Do you have a favourite mythical or fictional woman, possibly an historical woman about whom too little is written? Can you retell her story with a happier ending? Please submit a proposed 4 to 10 minute stage piece you would like to read or perform with others, or to request us to perform on your behalf. This could also be commentary about what is missing with the way her character is usually presented. To submit by 30 March 2025. We will invite you to convene to discuss format and delivery late April, with a view to presenting our work in Chichester midsummer. We are seeking up to 20 women to participate. Kindly share this call with creative women you know. How: Please email proposals and questions to submissions@wordsoutloud.org.ukand entitle the email: Submissions IWD and name of your chosen character. Submissions call for Our Anthology Words Out Loud is looking for submissions with a view to publishing an Anthology! We think that as we listen to so many wonderful pieces of writing from those who come to the Open Mic we should find a way to keep a record of those pieces that moved us most. And so we are going to publish an Anthology featuring your writings. Please submit up to 5 pieces (poetry, prose, or anything that you could perform at the Open Mic) in Word format to submissions@wordsoutloud.org.uk with the word Anthology in the subject line. In the first instance we would like to limit submissions to come from those of you who have read pieces at the Open Mic at Franco Manca and the usual rules apply; in this case up to 5 pieces, no epics, we mean it! Please make your submissions by April 30th 2025. The editorial committee undertakes to write to everyone who submits with the outcome of their submission as soon as possible after the closing date. SEND YOUR SUBMISSION Join the Mailing List Sign up for our Mailing List to be informed of our events and other news Success! Your email has been registered with our Mailing List. You will receive opt in confirmation to the email address you entered. First Name Last Name Email Subscribe"
