["https://wordsoutloud.org.uk/event/saturday-writers-club-at-graylingwell-chapel-53"]
title = "Saturday Writers Club at Graylingwell Chapel | Words Out Loud"
description = """
Saturday Writers Club, Join with others in a friendly, sociable environment to work on your writing projects.


On alternate Saturdays, Words Out Loud facilitates a Writers Club at Graylingwell Chapel. The Club is free, open to anyone whatever their level of writing ability and is a wonderful opportunity to meet with other people who have a shared interest in creative writing, non-fiction writing or who simply want time and space to develop a writing practice. 
You may choose to share what you are writing if you wish but most people just want to start or continue with their own project. We are there to offer help, advice, support if you need it, writing prompts if you are stuck for ideas or just be a friendly face.
Come and join us at the Slay table in The Chapel from 11:00am to 1:00pm on alternate Saturdays from October 7th 2023 onwards. Find us in the What’s On section of the Chapel website under Activities. No need to book, just turn up!
Find out more about Words Out Loud and our events at our website: w﻿ww.wordsoutloud.org.uk/open-mic"""
