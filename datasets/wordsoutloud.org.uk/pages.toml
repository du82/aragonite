["https://wordsoutloud.org.uk/event/poetry-spoken-word-open-mic-at-wagtail-coffee-yoga-chichester-39"]
title = "Poetry & Spoken Word Open-Mic Downstairs at Franco Manca, Chichester | Words Out Loud"
description = """
Come along and read some of your own poetry or prose, listen to others and share in the joys of the spoken word.


Arrive from 6pm to order drinks and snacks. Open-Mic starts at 6:30pm.
Join us for our regular in-person Open-Mic event downstairs at Franco Manca in Chichester, West Sussex. We meet on the 1st Wednesday of every month. The event is free to attend and open to anyone, but a £3.00 donation made on the door would be very much appreciated.
Come along and read some of your own poetry, a published poem or even read some prose. Franco Manca serve teas, coffees and soft drinks as well as beers, wines, spirits, cocktails, pizza, pasta, salads and other delicious food.
It doesn’t matter if this is the first piece you have written or whether you are a seasoned pro, you will find a warm and supportive welcome as you share your work with us out loud.
And if reading out loud is not for you, please do come along and enjoy the atmosphere and listen to the readings."""
