["https://wordsoutloud.org.uk/2023/12/14/stonepillow-winter-appeal-2023-theres-this-place"]
title = "Stonepillow Winter Appeal 2023 – There’s This Place | Words Out Loud"
full_description = "Stonepillow Winter Appeal 2023 – There’s This Place Featured, Word is Out Stonepillow Winter Appeal 2023 – There’s This Place Words Out Loud were asked to write a poem for the Stonepillow Winter Appeal and this year they wanted to highlight the positive impact that their hubs have on the homeless and rough sleepers. Mike Jenkins wrote a piece titled, ‘There’s This Place’ and met with staff from the Stonepillow team to record a section of it with them. Mike says that he ‘wanted to write a poem that conveyed the positive difference that the hubs make to people living on the streets. There IS somewhere you go and there ARE people who will help. Most of us have experienced how a simple cup of tea given with kindness and respect can be the turning point in times of crisis. And you know what? There’s this place, right here that can offer that refuge and support.” This is what Stonepillow say about their say about their day hubs and how they are helping those in dire need in Chichester and the surrounding areas. Please donate whatever amount you can to help support the vital work that Stonepillow do in our local area. A Place of Safety Are you going home tonight? Every night this winter, 250+ vulnerable adults in our community won’t be going back home. They might be in emergency accommodation, on someone’s sofa; or in a car, in a tent, on the street. Stonepillow’s Day Hub is a place of safety and refuge for those in our community who have nowhere else to go. It is a place that protects, that connects to services and the help that will get them on the pathway back to independence; back home. It saves lives, and it restores lives. 50% more people have needed our Hubs this year; and the generosity of our community provides the £175,000 needed every year to keep them open. You can make a difference, today; will you help? Stonepillow staff, volunteers and clients appeal to our community to support our winter campaign this year. GIVE SOME WARMTH Text HOMESAFE to 70450 to donate £10 or search Stonepillow donate Learn More About Stonepillow"
