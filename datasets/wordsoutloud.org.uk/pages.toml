["https://wordsoutloud.org.uk/event/seven-up-live-performance-cabaret-event-11"]
title = "Seven Up Live Performance Cabaret Event | Words Out Loud"
description = """
A Live Performance Cabaret-Style Event at Franco Manca in Chichester, presented by Words Out Loud.


Mes dames et messieurs, Ladies and gentlemen. Guten abend! Bon soir! Good evening!
Seven performers, giving Seven performances, each of Seven minutes’ duration.
Set your clock, save the date, book a ticket, get your coat, grab a drink, take a seat.
This is Seven Up.


Words Out Loud is excited to present a new, regular, Performance Event in Chichester called Seven Up.
Hosted by Ken Jones
This new show is downstairs at Franco Manca restaurant in Chichester from 7:00pm. to 10:00pm.
The cabaret style show features Seven performers,
giving Seven performances
each of Seven minutes’ duration.
Performances will span the whole range of Performance Art including Music, Dance, Drama, Comedy, Improv, Spoken Word and more.
There will be breaks in between each performance and time to mingle, socialise and connect.
Franco Manca will have their menu of Pasta, Pizza and Grilled food available for ordering and their bar will be open.
Tickets cost £10 and are available here on Eventbrite and can also be purchased on the door."""
