["https://wordsoutloud.org.uk/donate"]
title = "Donate | Words Out Loud"
full_description = "Support Us Words Out Loud is a Charitable Trust and as such we have no direct source of income; all the income we have is from Charitable donations. It is part of our mission to make our core activities (Open Mic and Featured Readings) free of charge and since we are determined to keep our offerings inclusive and diverse we will always keep them free. Other activities, such as Workshops, competitions and Curated Readings designated as fundraisers will be charged for.If you feel that you would like to support our mission and enable us to extend the level of our free offer we would welcome your donation, however small, made via the donate button on this page. We guarantee that 100% of donations will go towards extending the Words Out Loud presence in the local community and to meeting costs incurred as part of delivering our core activities. DONATE Gift Aid You can now Gift Aid any donations to Words Out Loud. Please download one of the forms here, complete and send it to us by email or post. Your form needs to be signed, so if you are emailing us a copy of your form, please ensure you make a clear copy of it either by taking a clear photo of the form on a blank surface (e.g. a clear table) or send us a scanned copy. Otherwise, please send your form to us by post to: Words Out Loud17 King George GardensChichesterPO19 6LB Email: enquiries@wordsoutloud.org.ukwith the subject: Gift Aid. Thank you for your kind support. About Gift Aid Every gift you make to Words Out Loud – whatever its value – could be worth more at no extra cost to you just by choosing to Gift Aid it. Her Majesty’s Revenue and Customs (HMRC) will add an extra 25p to every £1 you give to Words Out Loud. Each year, £560million is left unclaimed by UK charities so it’s really important to Gift Aid personal eligible donations so Words Out Loud can support more people to experience the benefits of the spoken word. How does Gift Aid work? It’s simple. Gift Aid is a government initiative that allows donations given to charity to be tax-effective. As soon as you give your permission by completing a Gift Aid declaration form, we can claim the tax back on your donation. This means that a £10 donation will be worth £12.50 and for every £50 gift, we will actually receive £62.50. Am I eligible for Gift Aid? You are eligible for Gift Aid if you are a UK tax payer and the Income Tax and/or Capital Gains Tax you pay in that year is at least equal to the amount of Gift Aid claimed on all of your donations in that tax year. If you pay less tax than the amount of Gift Aid claimed on all your donations in that tax year it is your responsibility to pay any difference. Even if you are not employed, you are still eligible if you are paying tax on any of the following: personal or occupational pensionstocks and sharesbank and building society savings accountsrental incomeoverseas and UK investment dividends. How Do I Sign a Gift Aid Declaration? Download a Gift Aid form and post it back to us. Choose a form from the two options below. Single Donation: use this form to allow us to claim Gift Aid on a single, one off donation. Multiple Donations: use this form to allow us to claim Gift Aid on your past (in the last 4 years) and any future donations. 1. DOWNLOAD SINGLE DONATION GIFT AID FORM 2 DOWNLOAD MULTIPLE DONATION GIFT AID FORM"
