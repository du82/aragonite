["https://wordsoutloud.org.uk/2022/08/09/ken-jones-reads-in-ventura-california"]
title = "Ken Jones Reads in Ventura California | Words Out Loud"
full_description = "Ken Jones Reads in Ventura California Featured, Ken Jones, Word is Out Ken and Deni Jones recently returned to Ventura, California where they had been living for 8 years before coming back to Chichester in 2020. High on their list of friends and relatives to visit was the Open Mic at the E P Foster library hosted by Phil Taggart (with Marsha De la O) for the Ventura County Poetry Project. This reading was where Ken first got into Spoken Word events and led to him teaming up with Phil and Marsha (among others) to co-found the Ventura County Poetry Project. It was here also that Ken started two readings in Thousand Oaks and Newbury Park in Ventura County and these experiences led him, on returning to England, to seek out like minded people (Mike, Nigel and Deni) to help found Words Out Loud in Chichester. It turned out that the June 23rd reading in Ventura was without a featured reader and Phil Taggart asked Ken to read on that evening at the E P Foster Library. The reading was recorded and has been published by the Ventura County Poetry Project on YouTube. If you would like to hear Ken’s reading, then follow the link below. WATCH ON YOUTUBE"
