["https://wordsoutloud.org.uk/2021/10/08/poets-tina-cockett"]
title = "Poets – Tina Cockett | Words Out Loud"
full_description = "Poets – Tina Cockett Tina Cockett, Word is Out Tina Cockett is a regular at our events and shared this evocative, provocative and atmospheric poem at Words Out Loud in the Park at Priory Park, Chichester. In this poem, Tina asks: What are poets? And like all good questions, the answers she discovers reveal deeper mysteries! POETS What are we poetsBut pedlars of wordsConjurors of rhyme,Blank verse scribblersAnd tellers of inner worlds.Where my truth might just glimpse yoursFitting together fragmentsOf thoughts, ideas and feelingsInto the jigsaw of poesyBlessed by the Muse Calliopee Sometimes we poets ride on the breath of BardsIn waves of inspiration and creativityTouching hearts in ways we cannot tellFor words spoken out loud are like spellsReleased into the air with hope,Bringing in their wake perhapsSome laughter, solace and joyFrom our shared humanity. Inside our pretty words dissent maybe disguisedTo ruffle feathers, make uncomfortable or challengeUs to look again and questionHow we use the gift of language,And through this heresy of self expressionLay bare our souls. We name what lies beneath the surfaceUnspoken and unseenTo bring to light their existenceFrom our backpack of words,For what are we but pedlarsAnd conjurers of verse. Tina Cockett 20 July 2021 © Copyright 2021 Tina Cockett – All Rights Reserved"
year_published = 2023
