full_description = "CareersSenior DesignerApply NowJob DescriptionWork & Co, part of Accenture Song, is a global design and technology company with offices in the United States, Europe, and Latin America. We're known for uniting the industry’s best hands-on strategy, product and technical talent to generate tangible impact at scale. Client partners include IKEA, Apple, PGA TOUR, Gatorade, Google, Mercedes, Givenchy, the MTA and more. As Fast Company noted, our engineering and design teams are routinely entrusted with creating digital products for companies which rarely approach outside firms. Forrester Research calls our approach “a model to follow.” Visit work.co to learn more. Senior Designers who thrive at Work & Co see no boundary between form and function. They are highly strategic, detail-oriented, and multi-skilled, bringing a deep understanding across visual design, user experience, user interface design, branding and even coding. Creating digital products requires intense collaboration — internally, and with our clients. We believe in prototyping early and often. Our focus is on the end-user, conducting multiple rounds of testing to validate our concepts. One big difference? Our partners are hands-on and you’ll work directly with them. There’s no middle management here. You’ll also work closely with Product Managers, Strategists, and Developers to create original digital products and services that reignite industries and reshape companies. What You Will Do Stay 100% focused on making great digital products–that’s all we care about Work iteratively and collaborate with the team on initial concepts, user flows, visual design, and prototypes Attention to detail and care for design execution, from concept through delivery Participate in all project phases, from strategy to launch to optimization QualificationBasic Qualifications Portfolio or samples of work demonstrating digital product design Preferred Qualifications: Ability and desire to solve complex product design problems and the strategy skills to deliver best-in-class solutions Impeccable execution and care for all aspects of design, from conceptual thinking to motion and visual design Demonstrated ability to synthesize and present findings, and articulate design rationale Experience working in a highly iterative, collaborative environment where people share work daily Excellent written, verbal, and interpersonal communication skills Familiarity with prototyping tools Compensation & BenefitsCompensation at Accenture varies depending on a wide array of factors, which may include but are not limited to the specific office location, role, skill set, and level of experience. As required by local law, Accenture provides a reasonable range of compensation for roles that may be hired in California, Colorado, District of Columbia, Illinois, Maryland, Minnesota, New York or Washington as set forth below.We accept applications on an on-going basis and there is no fixed deadline to apply.Information on benefits is here.Role Location Annual Salary RangeCalifornia $63,800 to $196,000Colorado $63,800 to $169,300District of Columbia $68,000 to $180,300Illinois $59,100 to $169,300Minnesota $63,800 to $169,300Maryland $59,100 to $156,800New York $59,100 to $196,000Washington $68,000 to $180,300Additional InformationWhat We BelieveWe have an unwavering commitment to diversity with the aim that every one of our people has a full sense of belonging within our organization. As a business imperative, every person at Accenture has the responsibility to create and sustain an inclusive environment.Inclusion and diversity are fundamental to our culture and core values. Our rich diversity makes us more innovative and more creative, which helps us better serve our clients and our communities. Read more hereEqual Employment Opportunity StatementAccenture is an Equal Opportunity Employer. We believe that no one should be discriminated against because of their differences, such as age, disability, ethnicity, gender, gender identity and expression, religion or sexual orientation.All employment decisions shall be made without regard to age, race, creed, color, religion, sex, national origin, ancestry, disability status, veteran status, sexual orientation, gender identity or expression, genetic information, marital status, citizenship status or any other basis as protected by federal, state, or local law.Accenture is committed to providing veteran employment opportunities to our service men and women.For details, view a copy of the Accenture Equal Employment Opportunity and Affirmative Action Policy Statement.Requesting An AccommodationAccenture is committed to providing equal employment opportunities for persons with disabilities or religious observances, including reasonable accommodation when needed. If you are hired by Accenture and require accommodation to perform the essential functions of your role, you will be asked to participate in our reasonable accommodation process. Accommodations made to facilitate the recruiting process are not a guarantee of future or continued accommodations once hired.If you would like to be considered for employment opportunities with Accenture and have accommodation needs for a disability or religious observance, please call us toll free at 1 (877) 889-9009, send us an email or speak with your recruiter.Other Employment StatementsApplicants for employment in the US must have work authorization that does not now or in the future require sponsorship of a visa for employment authorization in the United States.Candidates who are currently employed by a client of Accenture or an affiliated Accenture business may not be eligible for consideration.Job candidates will not be obligated to disclose sealed or expunged records of conviction or arrest as part of the hiring process.The Company will not discharge or in any other manner discriminate against employees or applicants because they have inquired about, discussed, or disclosed their own pay or the pay of another employee or applicant. Additionally, employees who have access to the compensation information of other employees or applicants as a part of their essential job functions cannot disclose the pay of other employees or applicants to individuals who do not otherwise have access to compensation information, unless the disclosure is (a) in response to a formal complaint or charge, (b) in furtherance of an investigation, proceeding, hearing, or action, including an investigation conducted by the employer, or (c) consistent with the Company’s legal duty to furnish information."
