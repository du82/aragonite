full_description = "CareersManager, Analytic SolutionsApply NowJob DescriptionWork & Co, part of Accenture Song, is a global design and technology company with offices in the United States, Europe, and Latin America. We're known for uniting the industry’s best hands-on strategy, product and technical talent to generate tangible impact at scale. Client partners include IKEA, Apple, PGA TOUR, Gatorade, Google, Mercedes, Givenchy, the MTA and more. As Fast Company noted, our engineering and design teams are routinely entrusted with creating digital products for companies which rarely approach outside firms. Forrester Research calls our approach “a model to follow.” Visit work.co to learn more. AKDM, the business intelligence practice of Work & Co, is a leader in delivering digital growth strategies guided by data, analytics, and business intelligence. We work with a range of clients — spanning niche players to industry leaders across e-commerce, financial services, travel, entertainment, and consumer packaged goods.About the RoleAs a Manager in the Analytics Solutions role, you will oversee the process related to implementing analytics for clients, and the training of staff related to these processes. You will also be involved in client-facing consulting responsibilities with the goal to deliver high quality, (web, marketing, or app) analytics implementations and other analytics infrastructure, while preparing the team to grow by developing a training program for team members across each discipline.Responsibilities:Collaborate with team members to refine processes for analytics implementations and technical services, aiming to improve the quality of key deliverables across projects.Develop and deliver training programs for technical staff to enhance their expertise in analytics implementations.Manage and mentor a team of technical consultants, guiding them in their consulting responsibilities and ensuring successful project deliverables.Evaluate business goals and create comprehensive tracking and tagging strategies to measure success effectively.Consult with clients on web analytics platform selection, implementation, remediation, and dashboard development, while configuring tools like Google Analytics, Adobe Analytics, Amplitude, Firebase, or Google Campaign Manager Floodlights.Perform quality assurance tests on tracking implementations and provide best practice consulting for web analytics strategies.Partner with internal departments and external organizations to promote metrics best practices and conduct web analytics training for clients and project teams.Report directly to the Group Director of Analytics.QualificationBasic Qualifications:7+ years of on-the-job analytics implementation experience for tools such as Google Analytics or Adobe Analytics4+ years’ experience with web development, including:Experience with HTML, advanced JavaScript, and web protocols.Comfortable presenting findings and providing training on analytics tool usage.Bachelor's degree or equivalent (minimum 12 years) work experience Preferred Qualifications:Google Analytics Individual Qualification or equivalent.Knowledge of Tag Management Solutions such as Google Tag Manager, Adobe Launch, or Tealium iQ, or Ensighten.Comfortable presenting findings and providing training on analytics tool usage.Experience communicating updates and resolutions to customers and other partners.Ready to be part of a tight-knit, growing team; ambitious, can work independently as well as collaboratively and possess interpersonal skills.Compensation & BenefitsCompensation at Accenture varies depending on a wide array of factors, which may include but are not limited to the specific office location, role, skill set, and level of experience. As required by local law, Accenture provides a reasonable range of compensation for roles that may be hired in California, Colorado, District of Columbia, Illinois, Maryland, Minnesota, New York or Washington as set forth below.We accept applications on an on-going basis and there is no fixed deadline to apply.Information on benefits is here.Role Location Annual Salary RangeCalifornia $63,800 to $196,000Colorado $63,800 to $169,300District of Columbia $68,000 to $180,300Illinois $59,100 to $169,300Minnesota $63,800 to $169,300Maryland $59,100 to $156,800New York $59,100 to $196,000Washington $68,000 to $180,300Additional InformationWhat We BelieveWe have an unwavering commitment to diversity with the aim that every one of our people has a full sense of belonging within our organization. As a business imperative, every person at Accenture has the responsibility to create and sustain an inclusive environment.Inclusion and diversity are fundamental to our culture and core values. Our rich diversity makes us more innovative and more creative, which helps us better serve our clients and our communities. Read more hereEqual Employment Opportunity StatementAccenture is an Equal Opportunity Employer. We believe that no one should be discriminated against because of their differences, such as age, disability, ethnicity, gender, gender identity and expression, religion or sexual orientation.All employment decisions shall be made without regard to age, race, creed, color, religion, sex, national origin, ancestry, disability status, veteran status, sexual orientation, gender identity or expression, genetic information, marital status, citizenship status or any other basis as protected by federal, state, or local law.Accenture is committed to providing veteran employment opportunities to our service men and women.For details, view a copy of the Accenture Equal Employment Opportunity and Affirmative Action Policy Statement.Requesting An AccommodationAccenture is committed to providing equal employment opportunities for persons with disabilities or religious observances, including reasonable accommodation when needed. If you are hired by Accenture and require accommodation to perform the essential functions of your role, you will be asked to participate in our reasonable accommodation process. Accommodations made to facilitate the recruiting process are not a guarantee of future or continued accommodations once hired.If you would like to be considered for employment opportunities with Accenture and have accommodation needs for a disability or religious observance, please call us toll free at 1 (877) 889-9009, send us an email or speak with your recruiter.Other Employment StatementsApplicants for employment in the US must have work authorization that does not now or in the future require sponsorship of a visa for employment authorization in the United States.Candidates who are currently employed by a client of Accenture or an affiliated Accenture business may not be eligible for consideration.Job candidates will not be obligated to disclose sealed or expunged records of conviction or arrest as part of the hiring process.The Company will not discharge or in any other manner discriminate against employees or applicants because they have inquired about, discussed, or disclosed their own pay or the pay of another employee or applicant. Additionally, employees who have access to the compensation information of other employees or applicants as a part of their essential job functions cannot disclose the pay of other employees or applicants to individuals who do not otherwise have access to compensation information, unless the disclosure is (a) in response to a formal complaint or charge, (b) in furtherance of an investigation, proceeding, hearing, or action, including an investigation conducted by the employer, or (c) consistent with the Company’s legal duty to furnish information."
