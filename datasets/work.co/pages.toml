title = "Work & Co"
full_description = "CareersSenior Product ManagerApply NowJob DescriptionWork & Co, part of Accenture Song, is a global design and technology company with offices in the United States, Europe, and Latin America. We're known for uniting the industry’s best hands-on strategy, product and technical talent to generate tangible impact at scale. Client partners include IKEA, Apple, PGA TOUR, Gatorade, Google, Mercedes, Givenchy, the MTA and more. As Fast Company noted, our engineering and design teams are routinely entrusted with creating digital products for companies which rarely approach outside firms. Forrester Research calls our approach “a model to follow.” Visit work.co to learn more. Product Managers at Work & Co are cross-functional leaders who work with project teams to define, create, and launch digital products that define great brands. Part strategist, part project manager, and part client partner, the Product Manager owns the full product development lifecycle and works in a collaborative, agile fashion. The Product Manager drives projects from the initial concept through large-scale product release to post-launch optimization. Teams at Work & Co are small and very experienced. As a Product Manager, you will lead engagements alongside company partners as well as the top designers and technologists in the industry. You will share our love for making great products and services and shipping them on time. Along the way, you will develop new skills—from prototyping to analytics—as you partner with innovative clients like Virgin, Showtime, and Twitter. To do this well, applicants will need an entrepreneurial spirit, an intellectual curiosity, and a bias towards action. The successful Product Manager works collaboratively, communicates effectively, and drives consensus. He or she balances the ultimate user experience with business goals and breaks down complex problems in order to locate and manage their solutions. A Product Manager plans, prioritizes, and understands the bigger picture as well as the relevant details. This person tackles new problems, platforms, and industries. What You Will Do Partner with clients to understand business objectives, user behaviors, and product vision Develop product concepts, roadmaps, test plans, and functional specifications documentation Collaborate with designers and engineers to conceptualize, design, and deliver multi-platform applications QualificationBasic Qualifications:2+ years of experience demonstrating project management skills: planning and directing teams, scoping, contract-writing. 2+ years of experience delivering web, mobile, or gaming platform projects.Preferred qualifications: Track record of shipping on time Familiarity with current and emerging technologies Strong communication and collaboration skills– Product Manager works across Work & Co functional teams as well as partners closely with clients on all work Smart, proactive leadership An interest in strategy, design, or development Compensation & BenefitsCompensation at Accenture varies depending on a wide array of factors, which may include but are not limited to the specific office location, role, skill set, and level of experience. As required by local law, Accenture provides a reasonable range of compensation for roles that may be hired in California, Colorado, District of Columbia, Illinois, Maryland, Minnesota, New York or Washington as set forth below.We accept applications on an on-going basis and there is no fixed deadline to apply.Information on benefits is here.Role Location Annual Salary RangeCalifornia $63,800 to $196,000Colorado $63,800 to $169,300District of Columbia $68,000 to $180,300Illinois $59,100 to $169,300Minnesota $63,800 to $169,300Maryland $59,100 to $156,800New York $59,100 to $196,000Washington $68,000 to $180,300Additional InformationWhat We BelieveWe have an unwavering commitment to diversity with the aim that every one of our people has a full sense of belonging within our organization. As a business imperative, every person at Accenture has the responsibility to create and sustain an inclusive environment.Inclusion and diversity are fundamental to our culture and core values. Our rich diversity makes us more innovative and more creative, which helps us better serve our clients and our communities. Read more hereEqual Employment Opportunity StatementAccenture is an Equal Opportunity Employer. We believe that no one should be discriminated against because of their differences, such as age, disability, ethnicity, gender, gender identity and expression, religion or sexual orientation.All employment decisions shall be made without regard to age, race, creed, color, religion, sex, national origin, ancestry, disability status, veteran status, sexual orientation, gender identity or expression, genetic information, marital status, citizenship status or any other basis as protected by federal, state, or local law.Accenture is committed to providing veteran employment opportunities to our service men and women.For details, view a copy of the Accenture Equal Employment Opportunity and Affirmative Action Policy Statement.Requesting An AccommodationAccenture is committed to providing equal employment opportunities for persons with disabilities or religious observances, including reasonable accommodation when needed. If you are hired by Accenture and require accommodation to perform the essential functions of your role, you will be asked to participate in our reasonable accommodation process. Accommodations made to facilitate the recruiting process are not a guarantee of future or continued accommodations once hired.If you would like to be considered for employment opportunities with Accenture and have accommodation needs for a disability or religious observance, please call us toll free at 1 (877) 889-9009, send us an email or speak with your recruiter.Other Employment StatementsApplicants for employment in the US must have work authorization that does not now or in the future require sponsorship of a visa for employment authorization in the United States.Candidates who are currently employed by a client of Accenture or an affiliated Accenture business may not be eligible for consideration.Job candidates will not be obligated to disclose sealed or expunged records of conviction or arrest as part of the hiring process.The Company will not discharge or in any other manner discriminate against employees or applicants because they have inquired about, discussed, or disclosed their own pay or the pay of another employee or applicant. Additionally, employees who have access to the compensation information of other employees or applicants as a part of their essential job functions cannot disclose the pay of other employees or applicants to individuals who do not otherwise have access to compensation information, unless the disclosure is (a) in response to a formal complaint or charge, (b) in furtherance of an investigation, proceeding, hearing, or action, including an investigation conducted by the employer, or (c) consistent with the Company’s legal duty to furnish information."
