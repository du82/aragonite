es do produto, desde a estratégia até o lançamento e otimização (essa função vai além de criar wireframes ou atuar em apenas uma fase). Além disso, é desejável: Capacidade comprovada de propor conceitos criativos nas fases iniciais de projetos e de concretizar essas ideias – assim como as ideias de outros – por meio de designs detalhados, com pouca supervisão. Experiência comprovada em resolver problemas complexos de UX e em utilizar habilidades estratégicas para entregar soluções visuais de alto nível. Capacidade de identificar e utilizar verdades de negócio e comportamentos de usuários que ajudam a definir um produto excepcional. Habilidade demonstrada em sintetizar e apresentar seu trabalho de forma clara e impactante. Experiência em ambientes altamente iterativos e colaborativos, onde o compartilhamento diário de trabalho é parte da rotina. Excelentes habilidades de comunicação escrita, verbal e interpessoal. Familiaridade com ferramentas de prototipagem. Qualificações Básicas: Portfólio ou amostras de trabalhos que demonstrem design de produtos digitais. BenefíciosBenefícios:Assistência Médica – 100% subsidiada pela empresa (titular e dependentes);Assistência Odontológica;Vale Refeição ou Alimentação sem desconto;Seguro de vida;Previdência Privada;Wellhub;Opção de compra de ações da empresa com desconto;Desconto Farmácia*;Auxílio Creche*;Parceria com escola de idiomas*;Licença Maternidade e Paternidade Estendida;PPR*Informações Adicionais*Conforme política vigenteLocalidade da vaga:Nível BrasilBuscamos perfis que estejam alinhados aos valores da empresa, entusiastas em trabalhar em um ambiente colaborativo e dinâmico, com excelência na entrega e inovação presentes em seu dia a dia.Valorizamos competências independentemente de raça, idade, gênero, orientação sexual, credo, deficiência e convicção política. A diversidade das nossas pessoas é o que nos permite cumprir a promessa da tecnologia e da criatividade humana.Reconhecemos as características únicas dos indivíduos, respeitamos as diferenças e investimos em um ambiente cada vez mais inclusivo.'
