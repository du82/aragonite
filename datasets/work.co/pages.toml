["https://work.co/careers/product-management/sao-paulo/designer-ingles-avancado-fluente"]
title = "Work & Co"
full_description = 'CareersDesigner (Inglês Avançado/ Fluente)São Paulo, BRCandidatar-se AgoraDescrição da VagaWork & Co, parte do Accenture Song, é uma empresa global de design e tecnologia com escritórios nos Estados Unidos, Europa e América Latina. Somos conhecidos por unir as melhores mentes em estratégia, produto e talento técnico da indústria para gerar impacto tangível em grande escala. Entre os nossos parceiros de clientes estão IKEA, Apple, PGA TOUR, Gatorade, Google, Mercedes, Givenchy, a MTA e outros. Como destacou a Fast Company, nossas equipes de engenharia e design são frequentemente encarregadas de criar produtos digitais para empresas que raramente recorrem a outras firmas. A Forrester Research chama nossa abordagem de "um modelo a ser seguido".Nós procuramos Designers não vêem limites entre forma e função. Eles são altamente estratégicos, atentos aos detalhes e com várias habilidades, oferecendo um profundo entendimento do design visual, experiência do usuário, design da interface do usuário, marca e até codificação. Criar produtos digitais requer intensa colaboração – interna e com nossos clientes. Acreditamos na prototipagem precoce e frequente. Nosso foco está no usuário final, conduzindo várias rodadas de teste para validar nossos conceitos. Nosso diferencial? Nossos sócios são mão na massa e você trabalhará diretamente com eles. Não há gestão intermediária aqui. Você também trabalhará com gerentes de produto, estrategistas e desenvolvedores para criar produtos e serviços digitais originais que reacendem indústrias e reformulam empresas.QualificaçõesO que vocêvai fazer no seu dia a dia:Manter 100% do foco em criar ótimos produtos digitais – isso é o que realmente importa para nós.Trabalhar de forma iterativa e colaborar com a equipe em conceitos iniciais, fluxos de usuários, design visual e protótipos.Demonstrar atenção aos detalhes e cuidado com a execução do design, do conceito à entrega.Participar de todas as fases do projeto, desde a estratégia até o lançamento e otimização.​Além disso, é desejável:Habilidade e desejo de resolver problemas complexos de design de produto, com capacidade estratégica para oferecer soluções de alto nível.Execução impecável e atenção a todos os aspectos do design, desde o pensamento conceitual até o design visual e de movimento.Capacidade comprovada de sintetizar e apresentar descobertas, além de articular o raciocínio por trás das decisões de design.Experiência em trabalhar em ambientes altamente colaborativos e iterativos, onde o trabalho é compartilhado diariamente.Excelentes habilidades de comunicação escrita, verbal e interpessoal.Familiaridade com ferramentas de prototipagem.Qualificações Básicas: Portfólio ou amostras de trabalhos que demonstrem design de produtos digitais. BenefíciosBenefícios:Assistência Médica – 100% subsidiada pela empresa (titular e dependentes);Assistência Odontológica;Vale Refeição ou Alimentação sem desconto;Seguro de vida;Previdência Privada;Wellhub;Opção de compra de ações da empresa com desconto;Desconto Farmácia;Auxílio Creche;Parceria com escola de idiomas;Licença Maternidade e Paternidade Estendida;PPR*Informações Adicionais*Conforme política vigenteLocalidade da vaga:Nível BrasilBuscamos perfis que estejam alinhados aos valores da empresa, entusiastas em trabalhar em um ambiente colaborativo e dinâmico e que tenham a excelência na entrega e a inovação presentes em seu dia a dia.Valorizamos a competência independentemente da sua raça, idade, gênero, orientação sexual, credo, convicção política. A diversidade das nossas pessoas é o que faz Accenture excepcional. Nós reconhecemos que cada pessoa possui forças exclusivas e diversas.​'
