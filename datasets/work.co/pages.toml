["https://work.co/careers/strategy/us/analytics-solutions-senior-analyst"]
title = "Work & Co"
full_description = "CareersAnalytics Solutions Senior AnalystApply NowJob DescriptionOur StoryWork & Co, part of Accenture Song, is a global design and technology company with offices in the United States, Europe, and Latin America. We're known for uniting the industry’s best hands-on strategy, product and technical talent to generate tangible impact at scale. Client partners include IKEA, Apple, PGA TOUR, Gatorade, Google, Mercedes, Givenchy, the MTA and more. As Fast Company noted, our engineering and design teams are routinely entrusted with creating digital products for companies which rarely approach outside firms. Forrester Research calls our approach “a model to follow.” Visit work.co to learn more. AKDM, the business intelligence practice of Work & Co, is a leader in delivering digital growth strategies guided by data, analytics, and business intelligence. We work with a range of clients — spanning niche players to industry leaders across e-commerce, financial services, travel, entertainment, and consumer packaged goods.About the RoleAs a Senior in the Analytics Solutions role, designing and implementing measurement solutions doesn’t intimidate you. Key areas of experience (but not limited to) include interpreting business metrics into a tagging design, configuring, and debugging a tagging container, or helping non-technical clients understand their data capture environment. You thrive in this role when you can grow existing skills while learning new skills, collaborate with teams across disciplines, and help establish a data-driven culture of measurement. Your passion for connecting client needs with a technical solution that directly impacts ROI provides the basis for many crucial downstream processes; complex analysis, data products, and digital marketing performance measurement.ResponsibilitiesCollaborate with multiple business teams to assess their objectives and develop tracking and tagging strategies that enable individuals and teams to measure their success effectively.Consult with clients and their agencies on projects involving web analytics platform selection, implementation, and remediation.Install, configure, and troubleshoot tracking solutions across various channels, including web, mobile apps, and offline sources, using tools like Google Analytics, Google Tag Manager, Adobe Analytics, Dynamic Tag Manager, and others.Work closely with client engineering teams to audit tracking implementations, resolve tracking issues, and define quality assurance tests to ensure accurate data capture and alignment with business requirements.Lead a team in site tag implementation, custom rules development, and analysis using data layer elements on top-tier Tag Management Solutions such as Google Tag Manager, Adobe Launch, or Tealium.Oversee the development of implementation documentation for client developers, detailing page code requirements and data layer specifics to support business analysis needs.Provide oversight on quality assurance tests for tracking implementations, ensuring they meet expected standards.Offer expert consulting services to clients, addressing web analytics platform strategies and technical challenges.Collaborate with internal and external teams to ensure that key stakeholders are informed of best practices for metrics, exposing them to client management and decision makers.Conduct training sessions and knowledge-sharing workshops on web analytics for clients and the project team.Deploy and test analytics tools in iOS and Android mobile apps, especially through the Firebase SDK.Report directly to the Manager of Analytics Solutions.Collaborate closely with AKDM’s digital marketing teams to improve tracking capabilities, leveraging your expertise in tracking methodologies and best practices.Maintain a repository of high-quality technical deliverables, methodologies, and business development documents.Evaluate and recommend the technical feasibility of new tools for potential implementation.QualificationBasic Qualifications:4+ years of on-the-job analytics implementation experience for tools such as Google Analytics or Adobe Analytics with an understanding of the digital marketing or ad tech space.2+ years experience with web development, including:Experience with HTML, JavaScript, and web protocols.Experience with tag auditing tools such as Fiddler, Charles, dataLayer Inspector+, and Analytics Debugger4+ years experience with at least one tag management solution such as Google Tag Manager, Adobe Launch, Tealium iQ, or EnsightenBachelor's degree or equivalent (minimum 12 years) work experience Preferred Skills:Experience with Google Analytics, Adobe Analytics, Facebook Events, Google Floodlights, and other popular analytics and marketing tracking platforms, including how to setup a new implementation, how they are similar, and how they are radically different.Proven critical thinking, analytical problem-solving skills, and attention to detail.Excellent verbal and written communication skills to bridge the gap between technology and business management.Passionate about web technologies (data layers, HTTP protocol, DevTools, etc.) and big data.Ready to be part of a tight-knit, growing team; ambitious, can work independently as well as collaboratively and possess interpersonal skills.Experience with front-end development, including customizing templates, for popular content management platforms such as WordPress, Shopify, Magento, Drupal, and more.Experience with one or more data visualization tools, including Tableau, PowerBI, or Data Studio.You love to figure out ways to automate work processes and have some familiarity with SQL.Compensation & BenefitsCompensation at Accenture varies depending on a wide array of factors, which may include but are not limited to the specific office location, role, skill set, and level of experience. As required by local law, Accenture provides a reasonable range of compensation for roles that may be hired in California, Colorado, District of Columbia, Illinois, Maryland, Minnesota, New York or Washington as set forth below.We accept applications on an on-going basis and there is no fixed deadline to apply.Information on benefits is here.Role Location Annual Salary RangeCalifornia $54,900 to $162,000Colorado $54,900 to $140,000District of Columbia $58,400 to $149,000Illinois $50,800 to $140,000Minnesota $54,900 to $140,000Maryland $50,800 to $129,600New York $50,800 to $162,000Washington $58,400 to $149,000Additional InformationWhat We BelieveWe have an unwavering commitment to diversity with the aim that every one of our people has a full sense of belonging within our organization. As a business imperative, every person at Accenture has the responsibility to create and sustain an inclusive environment.Inclusion and diversity are fundamental to our culture and core values. Our rich diversity makes us more innovative and more creative, which helps us better serve our clients and our communities. Read more hereEqual Employment Opportunity StatementAccenture is an Equal Opportunity Employer. We believe that no one should be discriminated against because of their differences, such as age, disability, ethnicity, gender, gender identity and expression, religion or sexual orientation.All employment decisions shall be made without regard to age, race, creed, color, religion, sex, national origin, ancestry, disability status, veteran status, sexual orientation, gender identity or expression, genetic information, marital status, citizenship status or any other basis as protected by federal, state, or local law.Accenture is committed to providing veteran employment opportunities to our service men and women.For details, view a copy of the Accenture Equal Employment Opportunity and Affirmative Action Policy Statement.Requesting An AccommodationAccenture is committed to providing equal employment opportunities for persons with disabilities or religious observances, including reasonable accommodation when needed. If you are hired by Accenture and require accommodation to perform the essential functions of your role, you will be asked to participate in our reasonable accommodation process. Accommodations made to facilitate the recruiting process are not a guarantee of future or continued accommodations once hired.If you would like to be considered for employment opportunities with Accenture and have accommodation needs for a disability or religious observance, please call us toll free at 1 (877) 889-9009, send us an email or speak with your recruiter.Other Employment StatementsApplicants for employment in the US must have work authorization that does not now or in the future require sponsorship of a visa for employment authorization in the United States.Candidates who are currently employed by a client of Accenture or an affiliated Accenture business may not be eligible for consideration.Job candidates will not be obligated to disclose sealed or expunged records of conviction or arrest as part of the hiring process.The Company will not discharge or in any other manner discriminate against employees or applicants because they have inquired about, discussed, or disclosed their own pay or the pay of another employee or applicant. Additionally, employees who have access to the compensation information of other employees or applicants as a part of their essential job functions cannot disclose the pay of other employees or applicants to individuals who do not otherwise have access to compensation information, unless the disclosure is (a) in response to a formal complaint or charge, (b) in furtherance of an investigation, proceeding, hearing, or action, including an investigation conducted by the employer, or (c) consistent with the Company’s legal duty to furnish information."
