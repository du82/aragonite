description = "We design and ship digital products that transform companies. Our websites, apps, and digital experiences are used by millions of people every day."
full_description = '''NewsNews & InsightsGatorade Launches Generative AI Powered Bottle Design ExperienceOctober 14, 2024Gatorade has pioneered a new generative AI-powered design experience that allows athletes to express their unique styles and interests through nearly endless personalization possibilities on Gatorade Squeeze Bottles. The new experience is available exclusively on Gatorade.com.Gatorade collaborated with leading digital products company Work & Co, part of Accenture Song, to ensure the new AI experience is seamlessly integrated into Gatorade.com and is user-friendly.Adobe Firefly, designed for safe commercial use, generates images that unlock creative self-expression while maintaining the iconic look-and-feel of the Gatorade Squeeze Bottles.How it works:The capability is available on the Gatorade website through Gatorade iD, the brand’s free membership platform where users can earn points and unlock benefits.Search for ideas based on favorite sports, hobbies and designs, and then choose from a selection of vibes and colors.Points can be used to generate bottles designs, and preset options are also available for inspiration.After selecting your favorite design, anyone can purchase their one-of-a-kind Gatorade Squeeze Bottle for $34.99.Some of the most iconic athletes in the world have collaborated with Gatorade on signature bottles, and one year ago, Gatorade and Work & Co launched an award-winning 3D customization experience as part of its e-commerce platform. Now, by integrating AI, all athletes can personalize their own bottles in a new way.The experience was first announced at the Adobe MAX 2024 Creativity Conference in Miami. Said Xavi Cortadellas, Gatorade Sr. Director of Marketing, in a statement: “Gatorade continues to be at the forefront of athletic equipment personalization, and the launch of AI-generated bottle design puts next level creative self-expression directly in athletes’ hands. Now athletes everywhere can have fun with our AI tool in a way that’s approachable and uniquely on-brand.”To create your own bottle imagined with AI, visit Gatorade.com/ai.Read all news & insightsPartner with usWork & Co, part of Accenture Song, is trusted by the world’s leading companies to drive growth and bring innovative solutions to market. Together we can build and scale your core digital products.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelLet's talkStay informedGet occasional updates about our digital products, news, and events.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelSubscribe'''
