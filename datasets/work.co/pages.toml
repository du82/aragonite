["https://work.co/clients/aesop"]
title = "Aesop Case Study"
description = "Aesop asked Work & Co to design, build, and ship a new e-commerce site. Working together, we created an immersive digital storefront inspired by the in-store experience."
full_description = '''Select ClientsAesopBridging digital and physical experiencesVisitVisitaesop.comDigital product strategyEnd-to-end e-commerce redesignFront-end development and quality assurancePhotography direction and writing guidelinesGlobal rollout to 43 countries with localization supportTraining for Aesop designers and developers during handoffOutcomes2Weeks from kickoff to prototype15%Higher conversion within 60 days of launchingOverviewAesop spent two decades earning a devoted following, all without any advertising. The Melbourne-based company was worth $250 million, but they still hadn’t translated their ethos of “unselling” online. They asked Work & Co to design, build, and ship a new e-commerce site.Working together, we created an immersive digital storefront inspired by the in-store experience. Our approach makes the site feel like a natural extension of the brand.Awards & RecognitionInternational Website Winner, 2018. Read moreInnovation by Design Award. Read moreHonoree for Best Shopping Websites, 2019. Read more3 Big Takeaways01.Bringing the in-store experience online02.Development KPIs: speed and maintenance03.Unique design frameworks01.Bringing the in-store experience onlineDigital ExtensionEvery Aesop store is unique. The company partners with different architects to design each retail location around its specific physical space. To create Aesop’s e-commerce site, we distilled the essence of the company down to its core elements. Then we created a digital design system to match the overall brand look and feel. Layouts and typography are inspired by the iconic product packaging. Elegant motion design creates calm transitions that mirror a relaxing in-store experience.Helpful ContentShopping at an Aesop store involves a conversation with a skincare consultant. Each consultant is trained to discover individual needs and offer tailored product recommendations. Our team went through the same skincare consultant training and visited several stores to understand the experience and product range. We also tested the site with store employees.The result is a content strategy built around the company’s high-touch customer service. How-to videos explain products just like an Aesop skincare expert would, with detailed information about usage. Bundles let users shop by skin type.02.Development KPIs: speed and maintenanceBuilt with HybrisAesop’s previous technology relied on rigid systems with limited opportunity. Our front-end developers collaborated with Hybris consultants to build a new, flexible architecture that integrates with the existing infrastructure and CMS-enabled templates.Built to ScaleTo help the site succeed after handoff, we created a full suite of modular components. Having a consistent, flexible system helps Aesop’s internal team create custom page layouts to introduce new products and seasonal content.03.Unique design frameworksShoppable NavigationThe site uses elegant motion to expose products directly from the navigation. User testing confirmed that our custom solution helps loyalists restock quickly. New buyers also find useful information faster.Logged-In Experience & Simple CheckoutReturning users receive personalized recommendations based on previous purchases. Content is tailored by locations and seasonal climate. A one-page checkout makes ordering simple.Art Direction & Content GuidelinesExtensive product content guidelines ensure our system for photography, video, and writing can be maintained by the Aesop team moving forward. The site also supports The Fabulist, Aesop’s online literary magazine.After LaunchEarning LoyaltyOur flows encourage logging in for better recommendations, faster checkout, and easier reordering. To help customers understand their newly purchased products, confirmation emails contain the same how-to content as the PDP pages.Curated GiftingDuring the holidays, we extended the experience to a curated gift guide that helps shoppers discover the perfect Aesop product. The guide narrows down products by occasion and price. The checkout flow is optimized for gift cards, gift messages, and gift wrapping.More Case StudiesAesopALDOEpic GamesGatoradeHippoIKEALyftMTAPGA TOURPhilz CoffeePlanned ParenthoodTechCrunchVirgin AmericaVistaprintPartner with usWork & Co, part of Accenture Song, is trusted by the world’s leading companies to drive growth and bring innovative solutions to market. Together we can build and scale your core digital products.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelLet's talkStay informedGet occasional updates about our digital products, news, and events.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelSubscribe'''
