["https://work.co/clients/planned-parenthood"]
title = "Planned Parenthood Case Study"
description = "Planned Parenthood and Work & Co  shipped a gender-neutral, AI-powered chatbot named Roo. It gives teenagers everywhere access to private, accurate sexual health information."
full_description = '''Select ClientsPlanned ParenthoodUsing AI to reach teens and close the sex education gapChat with RooChat with Rooroo.plannedparenthood.orgResearch and product strategyCharacter design, naming, brandingConversational user interface design and developmentAI chat engine design and engineeringBack-end system integrationLaunch support and PROutcomes3.5MConversations since launch78%Of users are 13 to 19 years old64%Of users identify as people of color6Months of machine learning training before launchOverviewFor over 100 years, Planned Parenthood has been the top resource for at-risk communities seeking health care and advice. A heated political environment threatened its core mission of “Care no matter what.” Work & Co approached the nonprofit to determine how technology could help extend their reach and impact.After conducting months of research with teens—and testing a range of concepts—we ultimately designed and built a first for Planned Parenthood: a gender-neutral, AI powered chatbot named “Roo.”It gives teenagers everywhere access to private, accurate sexual health information. Within one year of launching, Roo tripled its original goal of 1 million conversations and Time Magazine named it one of the 100 best inventions of 2019.“Brands and nonprofits have only scratched the surface of what AI can do. Helping teens access trusted information—especially when so many aren’t getting the sexual health education they really need—makes this a rare sort of digital product,” says Work & Co Founding Partner Gene Liebel.“Extending the organization’s reach by providing information to young people who don’t have access to sex education.”AwardsBest Inventions of 2019Innovation by Design Award. Read moreBest Use of AI. Read moreBest Use of Machine LearningInteractive WinnerRecognition“The ideal form to provide personalized, destigmatized answers….It’s the latest in Planned Parenthood’s efforts to bring its expertise in reproductive health to more people through digital products.” Read more“Roo isn’t a regular chatbot. It’s a cool chatbot — designed to answer young people’s sexual health questions 24 hours a day, 7 days a week.” Read more“The artificial intelligence-powered bot gives fast answers in a judgment-free, anonymous setting that’s comfortable for the audience instead of kids going to unchecked online sources.” Read more“Teens like using Roo because it protects their anonymity. And the fact that it comes in the form of a cute little avatar doesn’t hurt.” Read more“The driving force behind Roo was the lack of state-mandated, medically-accurate sex education throughout the country.” Read more“The agency worked with teenagers in MESA (Math Engineering, and Science Academy) High School — a Brooklyn charter school — to gather data and design a chatbot that people of this age group would want to interact with.” Read more“Planned Parenthood is aiming to close the sex education gap in America with a new chatbot designed to answer teens’ questions 24/7.” Read more“The bot’s brand identity is friendly and warm, outfitted with its own emotional iconography.” Read more3 Big Takeaways01.End users can help shape products early02.Carve out time for testing03.Every product needs the right name and personality01.End users can help shape products earlyPartnering with High School StudentsFewer than half of US states mandate sex education; as a result, according to the Guttmacher Institute, 43% of teenage girls and 57% of teenage boys don’t have information about birth control before their first time having sex.We wanted to create a tool to address this education gap, while meeting teenagers where they spend their time—their mobile phones. To get a better understanding of their digital behavior, we partnered with MESA, a Brooklyn high school.Real teenager input guided our decisions. Teenagers didn’t want to download more apps, so we made Roo a mobile website. They had questions about sexual health, so we used those questions to inform our content. They wanted to ask questions privately, so we made Roo 100% anonymous.AI ChatOn their mobile devices, teenagers can choose from a list of popular questions and topics, including birth control, masturbation, sexual orientation, and gender.While AI to date has commonly been tapped to create customer service tools, we saw a chance for Roo to leverage technology in a novel way. The AI chatbot serves as a bridge to the informed advice offered by medical professionals in Planned Parenthood centers — distributed for free 24/7, and through machine learning, scaling into an ever-expanding resource library.02.Carve out time for testingOngoing ImprovementMany organizations underestimate the level of effort required to properly build a chatbot. To be effective, a chatbot needs to be seeded with a rich set of data and then trained continuously. Group Technology Director Chris Alden and Design Director Lauren Shapiro explain our process.Web App ArchitectureTo provide rich interactivity and high performance without requiring an app download, our architecture is based on a responsive, web-based, rich front-end client application. It embeds all of the interface’s structure and functionality into a static application consisting of HTML, CSS, and Javascript code bundles.03.Every product needs the right name and personalityJust Enough FriendlinessWe wanted our chatbot to be more like an older sibling than a school sex-ed teacher. So we gave our chatbot a friendly, approachable name: Roo. We tested the name with high school students from MESA, making sure they would feel comfortable asking it questions and confident they were getting accurate information.We continued working with the students to fine-tune Roo’s look and feel, including color, typography, motion, and tone of voice.When a teen asks a question, within seconds, Roo responds with animated GIFs and encouraging slogans that bring color to conversations. The animations keep Roo playful without feeling too immature or silly.No Judgments and No GenderWe also wanted to mirror the experience inside Planned Parenthood health centers. That meant building Roo to be completely private and anonymous.We decided to keep Roo genderless to make sure everybody would feel comfortable asking questions, regardless of gender or orientation. Teenagers felt more comfortable asking questions to a bot than a human.Creating ConversationsOur writing team worked with Planned Parenthood to define full content guidelines and create a unique tone of voice that resonates with teenagers. Roo is always medically accurate, but it speaks informally. Interactions feel genuine, not patronizing or overwhelming.Get in TouchInterested in learning more about our approach to AI and new platforms? Reach out to newbiz@work.co.More Case StudiesAesopALDOEpic GamesGatoradeHippoIKEALyftMTAPGA TOURPhilz CoffeePlanned ParenthoodTechCrunchVirgin AmericaVistaprintPartner with usWork & Co, part of Accenture Song, is trusted by the world’s leading companies to drive growth and bring innovative solutions to market. Together we can build and scale your core digital products.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelLet's talkStay informedGet occasional updates about our digital products, news, and events.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelSubscribe'''
