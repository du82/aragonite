title = "ALDO Case Study"
description = "ALDO has long been known as a global leader for on-trend shoes and accessories. The Montreal-based retailer asked Work & Co to elevate its brand with a new approach to digital."
full_description = '''Select ClientsALDOBuilding a digital-first customer experienceVisitVisitaldoshoes.comProduct strategy and roadmappingDesign and art directionContent strategySolution architectureJavaScript application developmentResponsive web development & QAOutcomes17%Lift in brand perception in the first quarter of launch800Stores involved in the digital ecosystem rollout12Major global markets reached with the new website20%Lift in mobile conversions six months after launchOverviewMontreal-based ALDO Group asked Work & Co to elevate its brand—and make the shopping experience faster, mobile-first, and more social—via a series of new digital products. We began our partnership with ALDO’s first e-commerce website overhaul in a decade, giving shoppers across the U.S., Canada and 10 other global markets a more premium, responsive way to shop. Our relationship grew into broad customer-experience strategy, including in-store and sales associate touchpoints, content integration, and a new loyalty program.“We chose Work & Co because we knew they would create an end-to-end, beautiful, ownable retail ecosystem that also really performs. Working on a daily basis with our UX team in a fast-paced, iterative manner—almost “live” design—while developing the site with our technology team changed our process for the better.”Gregoire BaretGeneral Manager, Omnichannel Experience at ALDO GroupPress“E-commerce sales are increasing year-over-year and currently account for between 15 and 20 percent of total revenue…a direct result of an improved user experience on mobile and desktop.” Read more“[The] bespoke approach was coupled with a collaborative design and technological philosophy, which brought disciplines—design, motion, technology—together.” Read moreALDO’s head of omnichannel and Work & Co Product Management Partner Rachel Bogan discuss customer experience best practices in this special report. Read more“At ALDO we are constantly pushing for every aspect of our e-commerce experience to feel dynamic, engaging and really human.” Read more3 Big Takeaways01.Balancing inspiration with conversion02.An open technology framework03.New modes of in-store shopping01.Balancing inspiration with conversionReaching More CustomersALDO was an early e-commerce success. But e-commerce had changed, and the company’s website needed updating. We worked together to create a new site optimized around today’s most important opportunities, like search traffic, social media, and mobile shopping. The site is built with a scalable design system that helps ALDO serve customers across all touchpoints and all devices. A custom typeface, social integration, and photography style guide help make the brand feel more modern.Optimized ApproachInstead of starting by designing the homepage, we looked at real user behavior and put together a strategic project plan. We wanted to spend the most time on the most important pages of the site.Most users go directly from search and social to a product landing page or category page, so we designed and tested those pages first. About half of online shoppers buy from their phones, so we focused on creating a simple mobile shopping experience and fast mobile checkout.Dynamic Content DeliveryFor more flexibility and freedom across the entire site, we developed the front-end in a componentized way, supported by a robust CMS. The experience architecture was crafted to extend to other brands under the ALDO umbrella, including sister brand Call it Spring or to launch new sub-brands, like ALDO Mx.02.An open technology frameworkFull IntegrationWe developed the ALDO digital ecosystem to work for online shoppers, in-store shoppers, and retail associates. We also performed extensive user testing during development to make sure our digital products ran smoothly, and we built our site to integrate with ALDO’s in-store associate apps. Those apps optimize inventory so associates can spend more time helping customers.Isomorphic DevelopmentWe built a new technical stack by focusing on two important metrics: flexibility and speed. That meant breaking apart the existing monolithic architecture and optimizing load times for images and videos across all breakpoints. For better end-to-end performance, we moved to a micro-services architecture connected to SAP Hybris with a responsive JavaScript (React) isomorphic application. At each layer of the application we incorporated unit testing, integrating unit tests directly into Continuous Integration & Delivery pipelines.03.New modes of in-store shoppingFuture EvolutionWe did weekly research to understand ALDO customers and set a vision for the future retail experience. Customers prefer their own phones to in-store tablets, so ALDO is prioritizing a mobile shopping tool. Customers like getting hands-on help from real people, so new employee tools will help automate workflows and free up retail associates’ time.Get in TouchInterested in learning more about ALDO or any other projects? Reach out to newbiz@work.co.More Case StudiesAesopALDOEpic GamesGatoradeHippoIKEALyftMTAPGA TOURPhilz CoffeePlanned ParenthoodTechCrunchVirgin AmericaVistaprintPartner with usWork & Co, part of Accenture Song, is trusted by the world’s leading companies to drive growth and bring innovative solutions to market. Together we can build and scale your core digital products.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelLet's talkStay informedGet occasional updates about our digital products, news, and events.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelSubscribe'''
