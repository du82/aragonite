["https://work.co/the-work-and-co-approach-to-superior-digital-products-report"]
title = "The Work & Co Approach to Superior Digital Products | Work & Co"
description = "We design and ship digital products that transform companies. Our websites, apps, and digital experiences are used by millions of people every day."
full_description = "DPG DetailsPrinciples Over ProcessThe Work & Co Approach to Superior Digital ProductsDownloadIntroductionProducts Have a Job to DoPrototypes > PresentationsConstraints Create BreakthroughsSmall, Senior TeamsMaintain Forward MomentumThink Long TermTreat Your Company Like a ProductDownload the PDFIntroductionIntroductionProducts Have a Job to DoPrototypes > PresentationsConstraints Create BreakthroughsSmall, Senior TeamsMaintain Forward MomentumThink Long TermTreat Your Company Like a ProductForewordWork & Co has designed, built, and launched category-defining digital products for the world’s top brands. When meeting people new to working with us, we’re often asked to describe our methodology. But, the truth of the matter is, breakthrough work doesn’t come from rigidly following the same steps for every challenge and product.Instead, we focus on the principles that guide our teams—not just the next step in a predefined methodology. These principles drive us towards the outcomes we aspire to and the ideal path to achieve them.For the first time, we’re sharing our top 7 principles with you. Our latest report captures Work & Co’s unique product management approach, inspiring product leaders and teams to transcend best practices and reach their brand’s full product potential. Products Have a Job to DoIntroductionProducts Have a Job to DoPrototypes > PresentationsConstraints Create BreakthroughsSmall, Senior TeamsMaintain Forward MomentumThink Long TermTreat Your Company Like a ProductProducts Have a Job to DoMake Your North Star an ObsessionUnderstanding that products serve a purpose is more than just a strategic insight—it’s a gateway to innovation. Assessing how your product fulfills a job for your customer is a foundational aspect of product innovation. When you truly grasp what job your product is accomplishing for the customer, enhancement and evolution become intuitive.Aligning Around a JobAligning every contributor around this primary job can be challenging, yet is pivotal for simplifying the entire product journey. This alignment sharpens focus, enhances decision-making, accelerates time to market, and ultimately enriches the customer experience.Utilizing the Jobs to Be Done (JTBD) FrameworkOne method to crystalize this alignment is the Jobs to Be Done (JTBD) framework. JTBD helps teams understand the underlying needs customers are looking to satisfy, offering a clear perspective on how products can serve those needs effectively. Despite awareness of JTBD across many modern teams, the real test lies in maintaining a relentless focus on it from the project’s inception through to launch, and beyond—or until insights from customers or market dynamics suggest a job evolution.Navigating Drift and Maintaining FocusHere’s why this focus is critical: A product’s job is often charted during the strategic phase, but as projects unfold, teams can lose the plot. Whether through handoffs or the introduction of new features by other parts of the company, a product can gradually deviate from its core purpose.This drift can occur gradually or through more dramatic shifts. Remaining fully aligned across organizational silos is difficult yet crucial work. It’s a challenge we often observe with internal teams—one that can dramatically influence both cost and launch capability.Strategies for SuccessTo mitigate this, Work & Co approaches every project by setting and obsessively focusing on a clear job from the start. This strategy lays the groundwork for successful outcomes and establishes the bedrock of an unparalleled customer experience. For example: for one of our very first clients, Virgin America, we created an ownable digital brand that aligned with Virgin’s reputation for making flying fun, but the single most important thing the website needed to do was sell an airplane ticket. If a user couldn’t book a flight, the product didn’t have a reason to exist. This meant our focus was on developing the best possible responsive booking flow and expanding from there. In practice, this isn’t easy—but it is necessary. We all want the product to do all of the things for all of the people using it (and for all of the people with a vested interest in the org). But if it doesn’t do the ONE thing users need and do it with absolute excellence, the entire product falls apart.By preparing for these challenges from the beginning, you set your product—and your team—up for success, crafting a coherent customer journey devoid of internal friction.Key TakeawaysSet the JTBD, align your team.Engage cross-discipline teams right from the start. Always take the customer’s POV. They expect seamless experiences, not internal conflicts. Do the hard work necessary to dismantle silos for their benefit.Prototypes > PresentationsIntroductionProducts Have a Job to DoPrototypes > PresentationsConstraints Create BreakthroughsSmall, Senior TeamsMaintain Forward MomentumThink Long TermTreat Your Company Like a ProductPrototypes > PresentationsStrategy is More Effective When it is TangibleMost companies rely on presentations as a means to communicate information, share ideas, and create consensus. Slide decks are an embedded part of work culture. In some ways, this makes sense. As the saying goes, “a picture is worth a thousand words.”The Challenge of Traditional ApproachesThese traditional approaches to product strategy, design, and development have their merits, but they also introduce significant challenges. Enthusiasm for ideation often leads to endless iteration, leaving many ideas unrealized without tangible product launches. User validation, typically delayed in traditional processes, misses the opportunity to gather early feedback across different directions. Moreover, neglecting technical feasibility from the start can result in captivating concepts that are impractical to implement. Talking about what you’re “going to do” is a form of inaction. The only way to “do it” is to roll up your sleeves and get to work.The Power of PrototypesWe have found that breaking this norm and moving toward strategy you can touch and feel is far more powerful. Moving away from presentations in favor of prototypes empowers product and experience teams to accelerate development, learn rapidly through immediate user feedback, explore innovative routes, and preemptively address design, technical, or customer issues—paving a smooth path to launch. Prototypes help turn ideas into something real. They provide teams with an early and effective means to navigate the intricacies of feasibility, desirability, and viability—which saves time lost in chasing ideas that won’t work or can’t be executed. In more exact terms, they bring intangible ideas to life.Strategy You Can Touch and FeelWhen a senior, hands-on, multidisciplinary team is in place, prototype creation can happen as fast as the first week. This method brings form and function together in a way you can touch and see—helping you to experience what users might experience. It helps the tech folks in your company immediately think about “how they’d build the thing,” and your marketing folks get inspired about how they can promote it. It is a tangible idea and a source of inspiration—a tangible symbol people can point to that helps feed continuous project momentum.Different Types of PrototypesLow Fidelity Flow Prototypes: Basic digital layouts to illustrate structure, hierarchy and flow that show how users move through an experience step by step. This can even be executed by stringing together static comps within the Keynote or PPT file, and slipping through old school “animator” style.High Fidelity Prototypes:Fully-designed and prototyped UI resembling the final product, vital for helping customers/stakeholders understand how the finished product might come to lifeCode Prototypes or Proofs of Concept:Functional prototypes using code to test technical feasibility and backend integration.Prototypes Informing the RoadmapPrototypes don’t just serve immediate design and functionality goals; they are instrumental in shaping the product roadmap. At different “altitudes” of planning, prototypes can inform broader ecosystem integration, mid-level product positioning, and the sequencing of specific features, ensuring a balanced alignment with organizational goals and market demands.Delivering prototypes consistently shifts focus from conceptual discussions to real-world development, propelling products toward market readiness rather than binding ideas to presentation slides.Key TakeawaysPrioritize Prototypes Over Strategy Presentations: Focus on producing numerous prototypes to foster alignment among leaders and extract meaningful customer feedback early in the process.Set a 6-Week Prototype Deadline: Aim to create and test prototypes swiftly, addressing impediments to achieve this feasible timeframe and accelerate workflow.Pilot the Prototype-First Approach: Apply this methodology to one of your multiple products or experiences. Evaluate against cost, quality, and velocity to discover potential improvements in team health and product excellence derived from an interactive strategy.By emphasizing prototypes over presentations, you’re not just designing products—you’re shaping immersive digital experiences that resonate meaningfully with users and stakeholders.Constraints Create BreakthroughsIntroductionProducts Have a Job to DoPrototypes > PresentationsConstraints Create BreakthroughsSmall, Senior TeamsMaintain Forward MomentumThink Long TermTreat Your Company Like a ProductConstraints Create BreakthroughsTimelines are Pivotal Drivers of InnovationDefining timelines, complete with a detailed schedule and firm launch date, are pivotal drivers of innovation. With a portfolio boasting over 500 digital products launched, our experience reveals that products without a target everyone is working toward are at the highest risk for never launching. Nine months is usually the magic number to bring something from concept to launch. One-off feature releases should happen even more quickly—within one quarter, or less.The Power of Time ConstraintsTime constraints enforce decisiveness within teams, heightening accountability and expediting prioritization. This results in significant speed-to-market advantages, enhancing competitive positioning.Adopting constraints is challenging, particularly for teams accustomed to Agile’s iterative ease. While Agile embraces continuous improvement, we find that full adherence can foster a comfortable pace that diminishes accountability, introduces scope creep, and breeds uncertainty in product scope and timeline delivery.Getting to LaunchWe very often see teams expending more energy into “how” the work will get done rather than getting to work. That’s why we prioritize project management methodologies that propel the work forward, vs. weighing it down by unnecessary meetings, ceremonies, paperwork, or the latest “process” trend. Breakthrough products require laser focus on our goals—for the user, for the brand, and by launching on time. Though learning and iterating are important, prioritizing outcomes that deliver customer value swiftly is crucial.Strategies for Effective Time ManagementEstablish a Fixed Timeline for Launch: Set deadlines to drive rapid development and discovery. With a defined launch date, paths often illuminate the way to innovative solutions that surpass your initial vision. Comparable to manifesting practices, actively visualizing and pursuing your product objectives makes them tangible.Be Strict Where it Matters: Clarity in product requirements determines the necessary rigidity of timelines. While initial phases may benefit from exploratory freedom, advancing development stages necessitate regimented processes through documentation and delivery structures.Sync Product and Business Timelines: Viewing product and experience timelines in alignment with business quarters ensures synchronization with operational rhythms. This coherence enhances the product’s impact and integrates seamlessly into existing processes, whether driving sales, fostering loyalty, or modernizing systems.Adopt Lightweight But Effective Project Management: While structure supports teamwork, especially amid communication or experience challenges, excessive rigidity can inhibit accomplished talent. Though Agile often displaces hard deadlines, setting these milestones and establishing efficient workflows can invigorate teams and expedite market entry before opportunities fade.Key TakeawaysSet firm deadlines and align them with business rhythms to drive rapid innovation and integration.Focus product development on swiftly delivering customer value while allowing leeway to refine methodologies to suit your unique environment.Encourage a structured yet flexible approach to balance team autonomy with accountability, enhancing both speed and efficiency.Small, Senior TeamsIntroductionProducts Have a Job to DoPrototypes > PresentationsConstraints Create BreakthroughsSmall, Senior TeamsMaintain Forward MomentumThink Long TermTreat Your Company Like a ProductSmall, Senior TeamsThe Who and How of Products MatterCreating transformational digital products requires assembling world’s top talent to tackle complex strategic, design, and technology challenges. We purposefully moved away from the industry’s traditional pyramid team structure in favor of smaller, dedicated teams of senior, highly experienced practitioners to maximize velocity and quality.Traditional teams are generally built with a few senior individuals providing overarching direction and communication at the top, supported by mid-level staff who balance day-to-day management. A larger contingent of junior contributors performs the bulk of the work, ostensibly reducing costs—but often at the expense of depth and experience.There is a pull toward management and mentorship for many practitioners that reinforces this model—they’d rather give direction than be hands-on in the work. Organizational structures support this and align career growth and achievement with managing others. Financially, it is also easier to pencil out. But it does not lead to the best work. Our focus is on recruiting versatile, experienced practitioners who bring decades of hands-on expertise. This approach, while seemingly costlier, yields invaluable benefits:Beyond Conventional Standards: Senior teams can bypass unnecessary industry methodologies, delivering not only more but doing so creatively and efficiently.Trust and Predictability: Experience fosters accurate estimations and anticipation of challenges, preventing scope creep and unforeseen expenses.Seamless Integration: Our teams operate as true extensions of internal product teams, fostering collaboration and eliminating silos.We also eschew the typical hand-off practices seen in large, specialized teams. While such transitions are often economically driven, they can fragment the production process. Our solution: maintaining multidisciplinary teams "
