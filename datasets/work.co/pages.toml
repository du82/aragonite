["https://work.co/careers/product-management/sao-paulo/senior-product-manager-ingles-avancado-fluente"]
title = "Work & Co"
full_description = 'CareersSenior Product Manager (Inglês Avançado/ Fluente)São Paulo, BRCandidatar-se AgoraDescrição da VagaWork & Co, parte do Accenture Song, é uma empresa global de design e tecnologia com escritórios nos Estados Unidos, Europa e América Latina. Somos conhecidos por unir as melhores mentes em estratégia, produto e talento técnico da indústria para gerar impacto tangível em grande escala. Entre os nossos parceiros de clientes estão IKEA, Apple, PGA TOUR, Gatorade, Google, Mercedes, Givenchy, a MTA e outros. Como destacou a Fast Company, nossas equipes de engenharia e design são frequentemente encarregadas de criar produtos digitais para empresas que raramente recorrem a outras firmas. A Forrester Research chama nossa abordagem de "um modelo a ser seguido". Os Senior Product Manager da Work & Co são líderes multifuncionais que trabalham com equipes de projeto para definir, criar e lançar produtos digitais que definem grandes marcas. Metade estrategista , metade gerente de projeto e parceiro de cliente, o Gerente de Produto possui o ciclo de vida completo do desenvolvimento do produto e trabalha de maneira colaborativa e ágil. O Gerente de produto conduz os projetos desde o conceito inicial, passando pelo lançamento em larga escala do produto até a otimização pós-lançamento. As equipes da Work & Co são pequenas e muito experientes. Como Gerente de Produtos, você vai liderar compromissos ao lado de sócios da empresa, bem como dos principais designers e tecnólogos do setor. Você compartilhará nosso amor por criar ótimos produtos e serviços e lançá los. Ao longo do caminho, você desenvolverá novas habilidades – de prototipagem a analítica – ao se trabalhar com clientes inovadores como Virgin, Showtime e Twitter. Para fazer isso bem, os candidatos precisarão de um espírito empreendedor, uma curiosidade intelectual e uma tendência à ação. O Diretor Gerenciamento de Produto de sucesso, trabalha em colaboração, se comunica de maneira eficaz e gera consenso. Ele ou ela equilibram a melhor experiência do usuário com as metas de negócios e divide problemas complexos para localizar e gerenciar suas soluções. Essa pessoa planeja, prioriza e entende tudo de forma macro, bem como os detalhes relevantes. O Diretor de Gerenciamento de Produtos lida com novos problemas, plataformas e indústrias. QualificaçõesO que vocêvai fazer no seu dia a dia:Trabalhar junto com os clientes para entender os objetivos de negócios, o comportamento do usuário e a visão do produto.Desenvolver conceitos de produto, roteiros, planos de teste e documentação de especificações funcionais.Colabore com designers e engenheiros para conceituar, projetar e fornecer aplicativos de várias plataformasAlém disso, é desejável:Habilidades comprovadas em gestão de projetos: planejamento e coordenação de equipes, definição de escopo e redação de contratos. Experiência na entrega de projetos para plataformas web, mobile e de jogos. Histórico consistente de entregas dentro do prazo. Familiaridade com tecnologias atuais e emergentes. Fortes habilidades de comunicação e colaboração — o Gerente de Produto trabalha em conjunto com as equipes funcionais da Work & Co e colabora de forma próxima com os clientes em todos os projetos. Liderança inteligente e proativa. Interesse em estratégia, design ou desenvolvimento. Qualificações básicas:Experiência mínima de 2 anos em gestão de projetos, incluindo planejamento, direção de equipes, escopo e elaboração de contratos. Experiência mínima de 2 anos na entrega de projetos em plataformas web, mobile ou de games. BenefíciosBenefícios:Assistência Médica – 100% subsidiada pela empresa (titular e dependentes);Assistência Odontológica;Vale Refeição ou Alimentação sem desconto;Seguro de vida;Previdência Privada;Wellhub;Opção de compra de ações da empresa com desconto*;Desconto Farmácia;Auxílio Creche*;Parceria com escola de idiomas*;Licença Maternidade e Paternidade Estendida;PPR*Informações Adicionais*Conforme política vigenteLocalidade da vaga:Nível BrasilBuscamos perfis que estejam alinhados aos valores da empresa, entusiastas em trabalhar em um ambiente colaborativo e dinâmico e que tenham a excelência na entrega e a inovação presentes em seu dia a dia.Valorizamos a competência independentemente da sua raça, idade, gênero, orientação sexual, credo, convicção política. A diversidade das nossas pessoas é o que faz Accenture excepcional. Nós reconhecemos que cada pessoa possui forças exclusivas e diversas.'
