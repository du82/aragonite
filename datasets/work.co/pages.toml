title = "Hippo Case Study"
description = "Hippo partnered with Work & Co to strategize and design a digital home insurance experience that would unseat the decades-old incumbents."
full_description = '''Select ClientsHippoReinventing home insurance for the 21st centuryVisitVisithippo.comDigital experience strategyWebsite design and prototypingMobile app conceptingDigital rebrandLaunch support & PR Outcomes2xSales conversion rate compared with industry average60Seconds for a user to get a quote75Net Promoter Score$1BUnicorn valuation reached in 3 years, including a $100 million investment from Mary Meeker’s fund, BondOverviewThe home insurance industry is worth $100 billion and growing 4–6% each year. But it’s also highly inefficient. About 60% of homeowners are underinsured. Others have too much insurance and are overpaying.Hippo co-founder and CEO Assaf Wand saw an opportunity. When he set out to revamp home insurance in 2015, Work & Co aligned with his model and mission: give people the best way to protect, maintain, and enhance their homes. We took an equity stake in Hippo and partnered with the company to strategize and design an easy-to-use digital experience that would unseat the decades-old incumbents.“Big companies usually rely on agencies to get a fresh perspective. In our case it was different. We wanted to tap into Work & Co’s experience and access their high-quality talent. For a startup so early in its life cycle, partnering with them was critical to our success and helped drive our speed to market.”Aviad PinkovezkyChief Product Officer, HippoAwards & Recognition“How insurance startup Hippo built a company worth $1 billion.” Read more“What Does It Take To Remake The UX Of A $90 Billion Industry?” Read moreA “fresh approach to home insurance” and “an experience that is transformed at every level.” Read moreA Better Insurance Purchase ProcessMost direct-to-consumer startups make branding their highest priority. Working with Hippo, we decided to focus on the customer enrollment experience first. We set two goals to guide our product: Create a high level of customer trust and reduce the time it takes to get a quote. To help prospects feel more confident purchasing insurance online, we shunned opaque benefits in favor of clear coverage descriptions, transparent pricing, and modern product offerings.The Fastest Quote PossibleOnboarding in the insurance sector has historically involved multiple phone calls and extensive paperwork. Getting a quote takes an average of 25 minutes. Our approach was a simple web form that automatically prefills publicly available data about every home, including year built, square footage, and roof type. It generates an accurate quote in 60 seconds.Relationships Past EnrollmentWhile prioritizing easy signup, Hippo wanted more than a one-time transactional relationship with customers. To move past the traditional buy-then-forget insurance model, Hippo provides in-home IoT sensors that further reduce monthly costs. We helped the company create a real-time claims flow and dashboard that simplifies a stressful task with a transparent timeline for reimbursement. We also created concepts for a companion mobile app that helps customers manage and maintain their homes.A Scalable BrandAs Hippo started to scale nationally, we partnered with them to evolve their visual identity. Inspired by the idea that every home is unique, we designed Hippo’s brand to reflect the personal nature of proper coverage. Our illustrations, animations, and playful iconography create moments of delight for customers. The new logo anchors the brand, with the negative space of the “h” forming a doorway. It has become the key element that represents Hippo’s role in protecting your home.Get in TouchInterested in learning more about Hippo or any other projects? Reach out to newbiz@work.co.More Case StudiesAesopALDOEpic GamesGatoradeHippoIKEALyftMTAPGA TOURPhilz CoffeePlanned ParenthoodTechCrunchVirgin AmericaVistaprintPartner with usWork & Co, part of Accenture Song, is trusted by the world’s leading companies to drive growth and bring innovative solutions to market. Together we can build and scale your core digital products.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelLet's talkStay informedGet occasional updates about our digital products, news, and events.NameNamePlease enter your nameCompanyCompanyPlease enter your companyTitle / RoleTitle / RolePlease enter your title/roleEmailEmailPlease enter your emailHow can we work together?How can we work together?Please enter your answerWhere are you located?Where are you located?Please enter your locationHow did you hear about us?OptionalHow did you hear about us?Optionalhttp:\\work.coOptionalInboundOptionalwork.coSubmitCancelSubscribe'''
