["https://www.workday.com/en-us/company/corporate-responsibility/workday-foundation.html"]
title = "The Workday Foundation | Workday"
description = "The Workday Foundation strives to positively impact our communities and support employees in their charitable contributions. Our goal is to create meaningful employment, break the cycle of poverty, and transform lives. Learn more."
full_description = "THE WORKDAY FOUNDATION Creating career pathways that unleash human potential. The Workday Foundation strives to positively impact our communities and support employees through charitable contributions that create meaningful employment, break the cycle of poverty, and transform lives. Watch Video (1:55) “Talent is everywhere, but opportunity is not. The zip code where you’re from shouldn’t determine where you end up. Together, we can help address the opportunity gap and create a robust economy that maximizes human potential.” Carrie Varoquiers Chief Philanthropy Officer, Workday HOW WE EFFECT POSITIVE CHANGE We’ve awarded over $40 million since 2013. Through our investments in workforce development organizations, we’re helping to accelerate career opportunities for thousands each year. And through our Upstream Grants Fund, we’re positively contributing to global issues that impact us all. Workforce development grants that propel careers. We invest in organizations that prepare people for tech-enabled careers and green jobs through coding classes for veterans, technical skills building courses, certification refreshers for refugees, solar panel and heat-pump installation training, and more. Investments that shape the future for us all. Our Upstream Grant Fund supports organizations working to address the root causes of global challenges such as disaster prevention and response, global health emergencies, and building inclusive communities. We’re on a mission to close the opportunity gap. Our workforce development movement, Opportunity Onramps®, provides paid training, internships, and job opportunities for candidates from diverse backgrounds. Learn More Interested in working with us? If your organization pioneers workforce development programs and you believe your mission aligns with ours, please email us with a description of your work. If there’s a fit, we’ll contact you to request further information. Impactful stories. Workforce Week™ connects job seekers to opportunities. See how Workforce Week helps job seekers from all backgrounds get training and resources to land life-changing roles. Watch Video (3:10) Recovering from a she-cession: equitable economic recovery. Learn how Opportunity Onramps supports an equitable economic recovery through the inspiring stories of women at Workday. Watch Video (3:25) Workday and Year Up team up to close the opportunity gap. Through our initiative with Year Up, students can get trained on Workday and then matched with internship opportunities. Watch Video (2:43) PARTNERSHIPS Pioneering positive change around the world. Our grants provide significant funds, employee volunteering and mentoring opportunities, technical assistance, and trust-based collaboration to support our grantee partners across the globe. Workforce Development Green Jobs Workforce Development Field Building Upstream Grants Workday Headquarters Regional Grants North America EMEA APAC North America EMEA APAC North America North America EMEA APAC San Francisco Bay Area Meet our leadership team. The Workday Foundation is led by Workday Chief Philanthropy Officer Carrie Varoquiers and governed by the following individuals who graciously give their time to serve on the board of directors. Aneel Bhusri Co-Founder and Executive Chair, Workday Carl Eschenbach CEO, Workday Mike Frandsen Former Executive Director of Products, Workday Carol Lindstrom Former Vice Chairman of Deloitte LLC Tony La Russa Former Major League Baseball Manager; Co-Founder, Animal Rescue Foundation Stephen E. Taylor Attorney and Founder of Taylor & Company Law Offices, LLP Steve Young National Football League Hall of Famer; Founder and Chairman, Forever Young Foundation Jay Banfield Chief Economic Mobility Officer, All Home"
