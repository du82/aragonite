description = "PUMA trusts Workday to elevate its HR and payroll, improving the employee experience. Read the customer story."
full_description = "Forward thinkers of sportswear and style. PUMA knows that speed and innovation give it a competitive edge—that’s why PUMA trusts Workday to drive its HR and payroll needs forever forward. Play Video (2:00) THE OPPORTUNITY Change in motion. When PUMA started outrunning complex HR systems, it set out to find a unified platform that could simplify processes, standardize tools, and sustain its culture of employee engagement and innovation—that’s what makes PUMA a forward thinker. “We’re always looking for ways to make the lives of our people and managers easier. That’s why we’re all in with Workday—one source for information and truth.” —Dietmar Knoess, VP People & Organization, PUMA THE RESULT Going faster, together. PUMA trusts Workday to deliver real-time insights anytime, anywhere for all of its HR management and payroll needs—keeping it a step ahead of the competition. “Competition is everywhere. To win, we don’t just need the right team. We need the best.” —Dietmar Knoess, VP People & Organization, PUMA THE SOLUTION Partnering for peak performance. Tools like next-gen AI help PUMA simplify HR processes and better predict the future—empowering the company to make smarter decisions as it moves forward faster. Nurturing leaders. 80% of PUMA’s leadership roles are now filled internally—showing a commitment to talent development. Shaping success. Workday helps PUMA foster a strong, competitive culture to build high-performing teams and drive success. Powering progress. A single source of information enables PUMA to move faster and help its teams collaborate more effectively. Go beyond transacting with payroll. Learn More"
