title = "Public Policy and Corporate Affairs | Workday US"
description = "At Workday, trust and transparency are core to everything we do. That’s why we advocate for policies that bolster trust in technology and enable growth and innovation. Learn more."
full_description = "WORKDAY PUBLIC POLICY Advancing our values through public policy. At Workday, trust and transparency are core to everything we do. That’s why we advocate for policies that bolster trust in technology, enable growth, and ignite innovation for the future of work. WHAT WE DO Leading the way to trusted technology policy. We collaborate with policymakers, customers, and industry partners to advance trust in technology. We advocate on technology policy issues. We share our cloud and machine learning expertise. We let our core values guide our public policy engagement. WHAT WE FOCUS ON Privacy and data protection. The privacy of our customers’ data has always been our priority. We believe privacy is a fundamental right and are proud to support strong privacy protections worldwide. Protecting data across borders. We’re committed to the free flow of data without compromising privacy. Read Blog Supporting U.S. legislation. We’ve long advocated for strong U.S. federal privacy legislation. Spearheading compliance. From APEC PRP and Privacy Shield to the EU Cloud Code of Conduct, we’re demonstrating worldwide compliance. Learn More AI and ML. Artificial intelligence (AI) and machine learning (ML) can revolutionize business when used responsibly. We’re working toward a trustworthy and ethical policy framework. Building trust with principles and practice. Based on our experience developing enterprise cloud applications, we advocate for AI regulation that balances trust and innovation. Learn More Engaging in Europe. We worked closely with European Union policymakers on the Landmark AI Act. Read Blog Laying foundations in Asia. We’re collaborating with governments across Asia on regulation to promote responsible AI. Read Blog Workforce development. As the business landscape continues to change, we believe technology, paired with strong policy, can help create better, more equitable workplaces for all. Taking a skills-based approach. With skills becoming more important than ever, we’re focused on how policy can shape the way people work, hire, and grow in their careers. Read Blog Matching talent to opportunity. We’ve seen firsthand how AI and ML can help workers grow their skills and mitigate the impact of rapid change on employment. Read Op-Ed Proposing a path forward. We’ve proposed policy recommendations spanning skills-based hiring, reskilling incentives, digital credentials, and open data. Learn More Climate change. At Workday, we believe that policy solutions are key to securing a sustainable future for our planet and people. Taking a stance. We support policies that reduce carbon emissions and ensure an equitable transition to a net-zero economy. Learn More Supporting strong climate policy. We support the goals of the Paris Agreement and science-based U.S. climate policy. Read Blog Making a global impact. Workday teams up with organizations and other businesses to nurture a healthier planet and a brighter work day for all. Read Report OUR MEMBERSHIP ORGANIZATIONS We partner with other groups that share our vision. In addition to direct advocacy, Workday works with the following membership associations to shape a brighter future. ACT-IAC AFCEA International Alliance for Digital Innovation AmCham EU AmCham Ireland AmCham Japan Australian Information Industry Association Bay Area Council Bitkom BSA | The Software Alliance Business Alliance to Scale Climate Solutions Business Council on Climate Change Business Roundtable Centre for International Policy Leadership Ceres Policy Network Clean Energy Buyers Association Consumer Technology Association Corporate Leaders Group Europe Cross-Border Data Forum Cyber Ireland Democratic Governors Association DIGITALEUROPE Dublin Chamber of Commerce Enterprise Cloud Coalition European Internet Forum Friends of Europe Future of Privacy Forum Nasscom NCSL RE100 REFORM Republican Governors Association Sustainable Aviation Buyers Alliance TechCA Tech Council Australia TECHNATION Technology Association of Georgia TechUK Texas Association of Business The Danish ICT Industry Association US-Ireland Partnership for Growth U.S. Chamber of Commerce US-ASEAN Business Council US-India Business Council World Economic Forum We work with our membership organizations across a variety of issues. Where there is divergence on policy perspectives, we actively engage to drive alignment in support of our business, values, and commitment to creating a better future for all. RESOURCES Resources just for you. Whitepaper Building Trust in AI and ML Through Principles, Practice, and Policy Read Whitepaper Whitepaper Our Response to the SEC-Proposed Rules on Climate-Related Disclosures Read Whitepaper Whitepaper Remarks for the Federal Trade Commission’s Public Forum Read Whitepaper Let’s connect on policy. Contact the Team"
