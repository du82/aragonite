["https://www.workday.com/en-us/company/corporate-responsibility/sustainability.html"]
title = "Sustainability | Workday US"
description = "At Workday, we measure our success not only in financial terms, but also by how we operate in the world. It’s why we build sustainability into everything we do. Learn more."
full_description = "SUSTAINABILITY We’re committed to creating a sustainable future, together. At Workday, we measure our success not only in financial terms but also by how we operate in the world. It’s why we build sustainability into everything we do. Watch Video (3:28) OUR PRIORITIES Protect the planet. Read Global Impact Report Read Global Impact Summary As a leading provider of enterprise cloud applications, our approach to sustainability focuses on the areas where we can make the most impact. We’re actively reducing our carbon footprint, making investments in renewable energy, promoting climate policy, reducing and responsibly disposing of our e-waste, and encouraging our employees to adopt sustainable practices. On a global level, we partner with other climate-focused leaders who believe it’s our collective responsibility to support a more sustainable future. MAKING A DIFFERENCE We’re taking action against climate change. Workday has set science-based emissions reduction targets that are consistent with keeping global warming to 1.5°C above preindustrial levels. We’re aligning our sustainability journey with the transition to a net-zero future. Read Blog Mitigating our emissions. We made a bold commitment to reach net-zero carbon emissions and operate on 100% renewable electricity by 2021. In fact, we’re one of the first companies to achieve a lifetime net-zero carbon footprint. Watch Video Investing in carbon removal. We’ve joined Frontier, a $1 billion advance market commitment, to buy permanent carbon removal. We also made a $1 million investment to aid mangrove reforestation in Mexico and Kenya—a natural climate solution. Read Blog Catalyzing climate impact. We work with other organizations to increase the scale and impact of our investments in climate solutions. This includes our long-term offtake agreement that provides a demand signal for high-integrity projects. Read Blog OUR EFFORTS How we do our part. We’re always looking for ways to create a more sustainable future. Here are some of the efforts and policies we’ve enacted to ensure we do our part. Renewable electricity powers our purpose. We match 100% of the electricity used at our global offices and data centers with clean, renewable sources, and we helped create the first-ever small aggregation clean energy deal. Read Blog Climate-focused goals on a global scale. Explore our vision, progress, and how we collaborate with other organizations to scale our environmental impact to help create global change. Read Global Impact Report We developed a climate policy statement. Since the creation of our climate policy statement, we’ve accelerated our participation in the climate policymaking process to drive meaningful action. Read Policy We responsibly dispose of what we can’t recycle. We adhere to strict e-Stewards standards for e-waste disposal. Read Policy Organizations we belong to. EMPLOYEE INVOLVEMENT Our Workmates pitch in, too. We’re not in it alone. Our employees know that what they do every day matters and are committed to small actions that have a big impact. 87% of our employees are passionate about the environment. Read Article 50+ employee Green Teams spearhead sustainability efforts around the world. Certified Sustainable Workday + Rareform sustainability bag. See how Workday partners with Rareform to breathe life into recycled materials, giving them a new purpose through design and creativity. RESOURCES Resources just for you. Blog Making an Impact Forever Forward: Insights From Our Global Impact Report Read Blog Blog Maximizing Our Climate Impact Through Multi-Year Offtake Agreements Read Blog Blog Workday to Support Accelerating the Development of Carbon Removal Read Blog Join a company that truly cares. Apply Now"
