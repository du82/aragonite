full_description = "Salesforce is taking the composable approach to ERP, consolidating its technical debt to automate processes as it grows through acquisitions and expands into new markets. Don Rigler, SVP Finance Automation, Cloud ERP, explains how Salesforce is bringing its data together with Workday to: Automate data integration, enable faster close processes, and empower its tax team Set up a new legal entity structure in minutes, which previously took several months and hundreds of thousands of dollars to complete Leverage AI and machine learning (ML) in its back-office operations, freeing up time for analysis and better decision-making Workday is where the market is going and we want to be on that journey. SVP, Finance Automation, Cloud ERP Related Content Blog: Thriving in a Changing World: Lessons from Tech and Media Leaders Video: Why Tech Chooses Workday Podcast: How Tech Companies Innovate in Disruptive Times"
