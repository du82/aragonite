["https://workday.com/en-us/company/about-workday/accessibility.html"]
title = "Accessibility | Workday US"
description = "At Workday, we believe that everyone—regardless of their abilities—deserves equal access to technology."
full_description = "ACCESSIBILITY Creating a Workday that’s accessible to all. At Workday, we believe that everyone—regardless of their abilities—deserves equal access to technology. It’s why we’re committed to delivering an accessible experience to all users. We’re building Workday to work for everyone, on every device and every platform. Our accessibility approach. We start by thinking about you and your needs. Our accessibility team guides updates, partners with our customers on enhancements, and collaborates on design and development. We also test and validate our functionalities with subject matter experts before making them available to you. What we deliver: A single inclusive experience for all users regardless of abilities Accessibility support in Android and iOS apps Technology updates with accessibility in mind A foundation for our designers to create accessible experiences We strive to support all users. Not every user of assistive technology will choose to disclose their specific needs. They deserve technology that works for them, all the same. To support every ability, we offer: Screen reader support for the visually impaired Focus indication and keyboard support for non-mouse users Appropriate use of color and sufficient contrast for people with lower perception of color We invest in automation. Workday continually adds automation to our development pipeline. By automatically evaluating accessibility criteria against an established rule set, we can validate code consistency as enhancements are delivered. And it gives evaluators the ability to focus on more complex usability needs. We promote digital accessibility through education. Our Accessibility Lab contains a series of workstations equipped with assistive technologies, which allows teams to better understand and empathize with the needs of assistive technology users. The lab also provides the product teams with an evaluation space when considering designs in conjunction with our customers. As part of our commitment to enhance user experience, we also provide accessibility training to our teams and use the Lab to experiment with the latest technologies and software development. We partner with our customers. Delivering what our customers need starts with understanding and collaboration. We promote engagements in many ways—from facilitating hands-on reviews of key components to strategic accessibility conversations. Our partnership helps ensure that we continue to meet the needs of our customers as we innovate. We continually evaluate accessibility. The Web Content Accessibility Guidelines (WCAG) forms the foundation for the inclusion of digital content across the globe. Workday assesses criteria from WCAG version 2.2 level A and AA using multiple methodologies, including a combination of automated and manual testing with those familiar with assistive technology. We have high standards. We evaluate our products against WCAG 2.2 A /AA standards, Section 508, and EN 301 549. We do not warrant compliance with WCAG 2.2 A /AA standards, Section 508, and EN 301 549 or any other jurisdictional standards. Our documentation includes the “Accessibility in Workday Applications” documents, which summarize the Service’s support for the standards promulgated under WCAG 2.2 A / AA, Section 508, and EN 301 549. And we update this documentation as needed to reflect changes in the Service."
year_published = 2025
clearnet = "https://workday.com/en-us/company/about-workday/accessibility.html"
