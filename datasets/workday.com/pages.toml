title = "Sponsorships | Workday US"
description = "Workday brand ambassadors reflect our core values of innovation, integrity, and fun. They bring the same passion and commitment to sports that we do to enterprise software."
full_description = "SPONSORSHIPS Changing the game in sports and business. Learn about the events, organizations, and athletes we’re proud to partner with. Events and organizations that we sponsor. We’re proud to sponsor sports events that align with our values and vision. We also support organizations that give back to our communities, such as Stephen and Ayesha Curry’s Eat. Learn. Play. Foundation. Workday powers greatness in sports. Our brand ambassadors and league partners are champions and leaders, not only in their respective sports, but also in their communities—and we work to support them in their pursuit of greatness. Golf Football Tennis Motorsports Matt Fitzpatrick Regarded as one of the most analytical golfers in the world, Matt Fitzpatrick's rise to the top has been impressive. After becoming the world #1 amateur, he's now a major champion and has ranked as high as #8 on the PGA TOUR. 2022 US Open champion Nine-time winner on the DP World Tour and the PGA TOUR Two-time European Ryder Cup team member Follow Matt on Instagram and Twitter. Matt Kuchar Matt Kuchar defied convention with a completely reinvented swing, taking the game to the next level. Since then, Matt has established himself as one of the world’s top golfers. Off the course, Matt is dedicated to organizations that support children with serious illnesses, disabilities, and other life challenges. Won on the PGA TOUR nine times Has been a part of nine U.S. Ryder Cup and Presidents Cup teams Earned the Vardon Trophy and the Byron Nelson Award in 2010 Follow Matt on Facebook. Davis Love III Davis Love III is one of the most highly respected golfers, on and off the course. Named one of Golf Digest’s Top 30 Good Guys, Davis supports at-risk children and families through the Davis Love Foundation. Inducted into the World Golf Hall of Fame in 2017 Captained the 2012 and 2016 U.S. Ryder Cup teams Won 21 times on the PGA TOUR, including the 1997 PGA Championship Follow Davis on Twitter and Facebook. Brandt Snedeker After focusing on golf most of the time, Brandt Snedeker made a change to balance work and life—and success followed. Off the course, Brandt and wife Mandy started a foundation to benefit children in middle Tennessee. Nine-time PGA TOUR winner Champion of the 2012 FedEx Cup One of just six players to qualify for the FedEx Cup in each of its first 15 seasons Follow Brandt on Twitter and Facebook. Michelle Wie West Michelle Wie West is a golfing icon who has been a force on the LPGA since turning professional as a teen-phenom over 15 years ago. Michelle became the youngest player to qualify for a USGA amateur championship at age 10 and competed in multiple PGA TOUR events. She is an advocate for diversity and inclusion, an entrepreneur, a philanthropist, broadcaster and a podcaster. 2014 U.S. Women’s Open Champion Five-time winner on the LPGA Tour Tournament Host of the Mizuho Americas Open Follow Michelle on Twitter and Instagram. Larry Fitzgerald With 17 seasons played and several records set, Larry Fitzgerald is regarded as one of the greatest football players of all time. As a philanthropist, Larry has helped fund under-resourced schools and breast cancer research and support. Selected for the NFL 100 All-Time Team Won the 2016 Walter Payton NFL Man of the Year Award Established the Larry Fitzgerald First Down Fund Follow Larry on Instagram, Facebook, and Twitter. Peyton Manning Peyton Manning is one of the most accomplished quarterbacks in NFL history, known as one of the leaders in nearly every statistical passing category. Peyton’s philanthropic foundation assists programs that provide leadership and growth opportunities for children at risk. Peyton is active in other causes, including finding a cure for Alzheimer’s and disaster relief. Pro Football Hall of Fame Class of 2021 inductee Five-time AP Most Valuable Player Award winner NFL’s Walter Payton NFL Man of the Year in 2005 Naomi Osaka Naomi Osaka is one of the most successful and influential tennis players of today’s generation. In addition to extraordinary tennis triumphs, Naomi shines a light on important social issues, including racial justice and mental health. Four-time Grand Slam singles champion First Asian player to rank #1 in singles in the Women’s Tennis Association Sports Illustrated 2020 Sportsperson of the Year Final torch bearer of the Tokyo Olympics Follow Naomi on Instagram and Twitter. McLaren Formula 1 Team With over 60 years in Formula 1, McLaren Racing has become one of the most successful teams in motorsport history. Since its debut, McLaren has championed innovation and engineering excellence—and continues to push the boundaries of what’s possible, both on and off the track. Eight-time Formula 1 World Constructors’ Champion Twelve-time Formula 1 World Drivers’ Champion Competed in every Formula 1 season since 1966 Follow McLaren on Instagram and Twitter, and read more about our expanded partnership. Questions about our Workday brand ambassador program? Contact Us"
