description = "Best Buy Canada’s employees expect easy-to-use, fast solutions. With Workday HCM and Workday Skills Cloud, the retailer has increased employee engagement and retention | Read Customer Story"
full_description = "As the largest consumer electronics retailer, Best Buy Canada moves fast to keep ahead of the ever-changing market landscape. Its employees and customers expect easy-to-use, fast solutions to remain agile in their daily lives. Critical to its success is growing in-house skills. With Workday Human Capital Management (HCM) and Workday Skills Cloud, the organization has increased employee engagement in order to: Drive staff retention as a result of skills-based internal role opportunities Ensure visibility into existing skills across the organization to better meet business needs Move with speed and agility to meet customer and employee needs Workday Skills Cloud helps us with our talent management. We’re using Workday AI capabilities to suggest skills based on jobs. We have a 14% increase year-over-year for internal fill. HRIS Lead Related Content Web Page: Retail Solutions that Adapt to Change"
