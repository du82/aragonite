["https://workday.com/en-us/customer-stories/i-p/pf-changs-full-platform-transformation-customer-success.html"]
title = "P.F. Chang’s Cooks Up Customer and Employee Satisfaction | Workday US"
description = "P.F. Chang’s knew the “secret sauce” to winning in a competitive marketplace was technology. With Workday, it now has global visibility from HQ to restaurants | Read Customer Story"
full_description = "Full Platform Talent Management Boosting Collaboration Align People, Finance, and Operations One-stop shop solution streamlines operations, simplifies tasks for restaurant managers, and accelerates business growth. Enable Employees to Achieve Career Success Talent management platform boosts visibility across the organization for career development and improved retention. Financial Insights Drive Collaborative Action Financial platform unites finance, procurement, and supply chain for better decision-making and course correction. A lot has changed since P.F. Chang's first opened its Scottsdale, Arizona doors in 1993. Access to world cuisines, the explosion of the online culinary world, and ever-evolving consumer and employee desires. The now-international business knew the “secret sauce” to continue soaring in a competitive marketplace was a technology transformation, replacing siloed systems and processes. With Workday across the enterprise, P.F. Chang’s now has clear visibility from HQ to restaurants around the world, enabling it to: Boost collaboration across HR, finance, IT, and operations to drive employee and business growth Increase retention with career development paths and intuitive learning and onboarding Use insights to make smarter, faster decisions Workday became a one-stop shop for all of our employees, which streamlined operations at our corporate headquarters and facilitated growth within our restaurants. General Counsel and Chief Human Resources Officer Related Content Demo: Workday For Hospitality Demo: Workday Talent Optimization"
