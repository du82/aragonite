description = "Take the AI for business course to become an enterprise artificial intelligence (AI) expert. Learn about AI strategy and how to gain a competitive advantage."
full_description = "WORKDAY AI MASTERCLASS Become an enterprise AI expert. AI can help you amplify human potential and gain a competitive advantage—if you know how to use it. Ready to move forever forward with AI? Class is now in session. In this video course, Workday leaders share everything you need to know about enterprise AI. Watch Intro (2:21) AI FOR BUSINESS MODULE Dive into all things AI. Learn to responsibly build, deploy, and govern AI for business. Workday AI Masterclass features expert insights for creating a brighter work day. Visit each module to access all lessons and resources. GETTING STARTED WITH AI MODULE Jump-start your journey. Interested in AI and machine learning (ML) but not sure where to begin? This one’s for you. Gain the knowledge and skills needed to understand key topics such as large language models and generative AI. Watch Lessons BUSINESS VALUE OF AI MODULE Make the most of AI solutions. With the right strategies, AI can maximize your time saved and time well spent. Explore how you can create value for finance, HR, and more. Watch Lessons RESPONSIBLE AI GOVERNANCE MODULE Innovate responsibly. The AI landscape is constantly evolving, with shifting regulations and risks. Learn the practices and frameworks you need to use AI securely and ethically. Watch Lessons RESOURCES AI resources. See All Resources Blog What Is AI? Why AI Matters Read Blog Blog How Will AI Shape the Roles Across the Enterprise? Read Blog Guide How to Improve Business with Artificial Intelligence Read Guide Whitepaper Responsible AI: Empowering Innovation with Integrity Read Whitepaper Workday AI moves you forever forward. Learn More"
