["https://www.workday.com/en-us/company/careers/life-at-workday.html"]
title = "Workday Careers | Workday Benefits | Workday Culture | Workday US"
description = "Life is brighter at Workday. With a culture that leads with empathy and benefits that take care of the whole you, Workmates come to work and know that they’re supported."
full_description = "Life at Workday Let your brilliance shine. Your job is to bring your talent, passion, and authentic self to work. We’ll take care of the rest. As a Workmate, feel empowered knowing that we’re invested in your unique skills and development. WORKDAY CULTURE Putting people first. Our culture defines us; it makes us unique. A healthy, employee-centric, collaborative, and inclusive culture is the key to our success. See how we put that into action. See Our Core Values We are driven by our values. Our team is made up of good people doing good—for our partners, customers, communities, and each other. This is just as important as the results we deliver. We value inclusion, belonging, and equity for all. The collective diversity of our people is what makes us shine. That’s why we cultivate a culture where everyone can bring their best selves to work. We support each other. It takes a team to do our best work. We work together, learn together, and win together, lifting each other up regardless of our differences. Fast Facts Our people by the numbers. 4,400+ Workmates have fun with 270 interest clubs. 97% of Workmates voice their opinions in weekly surveys. 36.7% of leadership roles are held by women as of January 31, 2023. 53,000+ hours of volunteer work logged by Workmates in FY23. Life at Workday Doing brilliant work with brilliant people. This is where everyone can bring their best selves to work. Every day, we are continuously growing together and empowering each other to unlock our full potential. See what makes us shine. Growth mindset. We’re all about learning and adapting. That means turning every misstep into a lesson and every challenge into an opportunity to innovate. Skills focused. When you join Workday, we invest in your growth—enabling you to enhance your unique skills and providing continuous opportunities for development as you build the career you've always wanted. The tools for success. Work with the latest technology at your fingertips. We fuel your impact and invest in your success by leaning into our own products, data, and insights, as we all aim to inspire brighter work days. BENEFITS We take care of the whole you. Our benefits and well-being program focuses on the happiness, health, movement, and nutrition of our Workmates. Here at Workday, taking care of one another is all in a day’s work. See everything that we offer on our benefits page. See Our Benefits BENEFITS Healthcare support Work-life harmony aid Mental and emotional well-being Financial assistance Workday Life Blog See our values in action. Our culture comes to life only when we live it. Learn what it means to be a Workmate. See All Stories The Fulfillment of Serving in an Employee Belonging Council Learn how our KAMPI council fosters a sense of belonging for the Filipino and Pacific Islander community at Workday. Read Blog Fostering a Culture of Support and Purpose—the Workday Way Read this Workmate’s perspective on how “the warmth of camaraderie permeates [our] entire organization.” Read Blog Navigating Pregnancy While Balancing an Engineering Career Hear from Petra, a senior Software Engineer, about flex work and the support from her technical team. Read Blog"
year_published = 2025
