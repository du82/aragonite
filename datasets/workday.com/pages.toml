title = "Global Study: Closing the AI Trust Gap | Workday US"
description = "Our extensive research has revealed that business leaders have greater enthusiasm and can understand the vision for AI whereas their workforce lack trust."
full_description = 'ARTIFICIAL INTELLIGENCE REPORT Closing the AI trust gap. Only 52% of employees welcome AI—why? There’s a lack of trust that AI will be deployed responsibly. Read Report REPORT FINDINGS Understanding sentiment with stats. View Infographic 62% of leaders welcome AI adoption in their organization. 22% of employees say their company has shared guidelines on responsible AI. 70% of leaders agree AI processes should allow for human intervention. 42% of employees believe there isn’t enough clarity around what should and should not be automated. "When I think about the future of AI, I think about the different disciplines coming together—from the humanities, the social sciences, engineering, legal, policy, HR, IT—to make sure that we take the time now to learn from past technological revolutions so that this one creates the best possible future, for everyone." —Kathy Pham, VP, Artificial Intelligence and Machine Learning, Workday Factors that are driving distrust. AI needs human intervention. Leaders and employees want human involvement in the AI processes but are unclear on the best way to do so. Putting employees’ interests second. Employees worry their organization will put company interests above their own when implementing AI. Awareness of AI governance. There is skepticism when it comes to collaborating on AI regulation and sharing responsible AI guidelines. WATCH VIDEO Leaders closing the AI trust gap. See how some leaders are taking on the challenge of creating trust with responsible AI practices, and hear about the opportunities that lie ahead. RESOURCES Resources just for you. See All Resources Report AI IQ Pulse Research Read Report Report C-Suite Global AI Indicator Report Read Report Report A Human-Centered Approach to AI in the Workplace Read Report Web Page Workday AI Masterclass Learn More Ready to talk? Get in touch. Talk to Sales'
