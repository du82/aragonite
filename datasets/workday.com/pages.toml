title = "Events | Workday US"
description = "Attend unique Workday experiences that provide opportunities to learn and network, and that inspire a global audience—we hope to connect with you at one of them. Learn more."
full_description = "Workday Events Connect, learn, and grow with us. Explore upcoming opportunities to connect with us in person or digitally at Workday events and other events we’re attending. We hope to see you there! Upcoming event Let’s build at Workday DevCon. Join us June 2–5, 2025, in Las Vegas as we move innovation forever forward. This year, we’re going all in on opportunities to grow your skills. See what you can expect, and save the date. Learn More SAVE THE DATE Workday Rising is coming to San Francisco. Mark your calendar! Workday Rising is coming to the Bay Area and will be available online from September 15–18, 2025. Stay tuned for more updates, and catch sessions from last year’s event on-demand now. Learn More ON-DEMAND Relive Workday Rising EMEA on-demand. One platform. Infinite possibilities. Ready to learn how our customers are revolutionizing work? Watch select sessions from the 2024 event to help take your business forever forward. Learn More Connect with us at even more events. Find in-person and digital events where you can learn and connect with us. Upcoming Events HIMSS Global Health Conference & Exhibition Las Vegas, NV March 3–6, 2025 Learn More Workday Federal Forum Washington, D.C. March 13, 2025 Learn More AFP FP&A Forum Austin, TX March 17–19, 2025 Learn More UNLEASH America Las Vegas, NV May 6–8, 2025 Learn More Payroll Congress Convention & Expo Orlando, FL May 13–16, 2025 Learn More Government Finance Officers Association (GFOA) Annual Conference Washington, D.C. June 29–July 2, 2025 Learn More Upcoming Events Workday Elevate. Join us at Workday Elevate, our regional roadshow that’s bringing our community together around the globe. We’ll share knowledge, explore new technologies, and help you take your business forever forward. EMEA Madrid, Spain March 25, 2025 Stockholm, Sweden May 13, 2025 Amsterdam, The Netherlands May 20, 2025 London, UK May 22, 2025 Heidelberg, Germany May 27–28, 2025 Zurich, Switzerland June 3, 2025 Paris, France June 12, 2025 APAC and Japan Sydney, Australia May 20, 2025 Singapore May 20, 2025 Seoul, South Korea May 22, 2025 Hong Kong May 29, 2025 Tokyo, Japan May 29, 2025 Auckland, New Zealand June 26, 2025 Kuala Lumpur, Malaysia August 7, 2025 Taipei, Taiwan August 27, 2025 ON-DEMAND Workday Digital Event Library. Discover insights and resources from our 2023 and 2024 events, including Workday Rising and Workday DevCon. If you’ve attended a Workday event in the past, use your registration information to log in. If not, simply sign up for access. Watch On-Demand Sponsorships Sponsoring game-changing events. Workday is proud to sponsor events that align with our values and give back to our communities. Learn More Webinars Looking for Workday webinars? Whether you need the latest workforce insights or want a closer look at Workday products, we’ve got you covered. Browse our selection of upcoming and on-demand webinars. Watch Webinars"
