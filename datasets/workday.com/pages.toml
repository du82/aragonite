description = "Hear from Aaron Haugh, director of corporate financial planning at H&R Block, about how Workday Adaptive Planning shortened forecasting and drove efficiencies | Read Customer Story"
full_description = "For global tax advisory firm H&R Block, forecasting used to take weeks and require different systems and processes. In this video, we hear from Aaron Haugh, director of corporate financial planning and analysis, on how Workday Adaptive Planning was the “something special” that shortened this process and helped the organization to: Deliver a single P&L view Drive more accurate headcount forecasting Identify process efficiencies and save costs It’s freed up our team to identify process efficiencies, look for cost savings, and have better conversations with our business partners. Director, Corporate Financial Planning and Analysis Related Content Webinar: A Fireside Chat With H&R Block and Workday Blog: What CFOs Need to Enable Organizational Change"
