description = "Apply to our North America Customer Awards for an opportunity to shine a light on how you are embracing Workday technology to solve your business challenges. Submit your entry today!"
full_description = "Congratulations to the North America Customer Awards winners. We’re thrilled to announce the winners of our first-ever North America Customer Awards. Learn more about the outstanding results they’ve achieved with Workday. Pictured from left to right are our winners from Plexus, Corp., Thomson Reuters, and Team Car Care. Not pictured: Vertex, Inc and Bon Secours Mercy Health Check out the winners by submission category. Global Workplace Transformation By leveraging Workday Illuminate, Plexus Corp. enhanced pay equity and created clear career pathways for their team members. Read Blog Powering Innovation As an early adopter of Workday Skills Cloud, Thomson Reuters boosted employee engagement and retained key talent. See Story Finance for the Future With Workday, Team Car Care can forecast customer visits and required inventory, empowering informed decision-making. See Story Rapid Time to Value With support from Workday, Vertex boldly reduced its SKU inventory and reduced operational costs. See Story Industry Hero Bon Secours Mercy Health used Workday to reimagine its talent strategy and address clinician burnout. Read Blog Judging panel and criteria. Here’s how award submissions were assessed by our judging panel of notable industry experts and Workday executives. Innovative Approach How compelling is the use case? Is it truly innovative and transformative? Project Delivery Has the project effectively solved a specific business challenge? What impact has it had? Evidence of Success Can the impact be quantified with return on investment and metrics? Mark B. Newsome Former Vice President of People Operations, McKee Foods Mickey North Rizza Group Vice President, Enterprise Software, IDC Alexandra Roza Senior Vice President, Global Customer Success, Workday Ali Fuller Senior Vice President, Product Marketing, Workday Get excited for the prizes. Your exceptional accomplishments deserve to be rewarded. Charitable Gift A donation of $5,000 to a charity of your choice. Award Recognition Main stage recognition at Workday Rising in Las Vegas. Brand Exposure Brand amplification on our website and social media. Conference Pass A free pass to Workday Rising in 2025. Get excited for the prizes. Your exceptional accomplishments deserve to be rewarded. Charitable Gift A donation of $5,000 to a charity of your choice. Award Recognition Main stage recognition at Workday Rising in Las Vegas. Brand Exposure Brand amplification on our website and social media. Conference Pass A free pass to Workday Rising in 2025. Terms and Conditions 2025 North America Customer Awards Ready for your moment to shine? Submit your organization for a chance to be considered for the 2025 North America Customer Awards. For questions on entry requirements, contact customer.awards@workday.com. Submit Entry"
