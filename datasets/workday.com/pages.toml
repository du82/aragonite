title = "Unum Solves Customer Needs with Finance Transformation | Workday US"
description = "Learn how Workday Financial Management helps Unum drive financial transformation while predicting what customers need, delivering more, and empowering employees. | Watch Customer Video"
full_description = "The office of the CFO is better known for its focus on reporting and looking back. But for benefits provider Unum, its direction of choice is forward—looking around corners and accurately predicting customer and organizational needs. In this video, we hear from chief financial officer Steve Zabel about how Unum partnered with Workday to drive people-powered technology transformation in order to: Drive organizational agility thanks to a holistic view of financial health Free up time from cumbersome tasks so employees can focus on high-value solutions Prioritize human connections, supported by technology We are able to predict and look around the corner where needs are going to be the greatest. Chief Financial Officer Related Content Customer Story: Unum improves its efficiency by consolidating 20+ HR applications. Customer Story: Combined HCM and financial view frees resources for customer programs. Customer Story: Benefits provider scores an HR trifecta with an achievement badge app."
