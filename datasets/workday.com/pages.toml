title = "Value Inclusion, Belonging, and Equity | Workday"
description = "At Workday, we value inclusion, belonging, and equity for all—VIBE™! We strive to be the best workplace where all employees are valued for their unique perspectives, and where we all thrive by bringing our best selves to collectively contribute to our success and innovation. Learn more."
full_description = "Value Inclusion, Belonging, and Equity Value inclusion, belonging, and equity for all. VIBE™ (Value Inclusion, Belonging, and Equity) is our vision for DEI and how we create a workplace where everyone is valued for their unique perspectives, respected as integral to our community, and given equal access to opportunity. Read Report Diversity is core to everything we do. Our commitment to equity shines through in our everyday practices and policies. We hire and develop a diverse workforce, put people first, and invest in underrepresented communities. Plus, we have signed the: White House Equal Pay Pledge Business Statement for Transgender Equality CEO Action for Diversity & Inclusion Pledge We embrace and empower all Workmates alike. Every employee is an integral member of the Workday community. Building a broader connection to the world. We believe that belonging happens when we connect with our communities. Our Employee Belonging Councils (EBCs) are employee alliances focused on engaging with underrepresented communities. Check out the EBCs that build knowledge, create safe spaces, foster innovation, enable business initiatives, and engage in community outreach. Black @ Workday Indigenous @ Workday People with Disabilities DOSTI Jewish @ Workday Pride East Asians KAMPI Unidos Families @ Workday Military & Veterans Women @ Workday Fostering diversity through our products. Creating a great workplace for our people is our priority—we’re investing in our solutions so you can do the same for yours. Learn how Workday helps you gain critical insight, build a diverse workforce, and promote belonging. Learn More RESOURCES Resources for you. Explore All Resources Report The Global Blueprint for Belonging and Diversity Read Report Web Page Creating a Workday That’s Accessible to All Learn More Datasheet Workday Supplier Diversity Program Read Datasheet Ready for a brighter work day? Explore Open Positions Keep in touch with Workday Careers. Join Our Talent Community"
