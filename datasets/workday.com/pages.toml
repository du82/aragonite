title = "AI-Driven Workday Skills Cloud Boosts Employee Retention | Workday US"
description = "With Workday Skills Cloud and Workday Learning, HPE can identify employee skills and talent so it can invest in employee growth and development and aid retention | Read Customer Story"
full_description = "AI and machine learning (ML) are not new concepts at Hewlett Packard Enterprise (HPE)—these capabilities are central to everything the technology company generates and creates. And so it made sense to apply these tenets to its talent strategy. With Workday Skills Cloud and Workday Learning, HPE can now identify skills and talent to enrich its employees’ work life in order to: Continually invest in career development to aid employee retention Uncover unknown skills needed by the business Carve out career paths and growth opportunities HPE has been able to unlock infinite potential with our employees by understanding who they are, what they want to build, and where they want to go—all in one system. VP of Technology and Innovation Related Content Webinar: Your Workday Skills Cloud Journey. From Enabling to Transforming eBook: Putting Your Skills Strategy into Action"
