-rows: repeat(2, 1fr); } .gallery-grid .slot-1 { grid-area: 1 / 1 / 3 / 2!important; } .gallery-grid .slot-2 { grid-area: 1 / 2 / 2 / 3!important; } .gallery-grid .slot-3 { grid-area: 2 / 2 / 3 / 3!important; } .gallery-grid .slot-4 { grid-area: 0 / 0 / 0 / 0!important; display:none!important; } .gallery-grid .slot-5 { grid-area: 0 / 0 / 0 / 0!important; display:none!important; } .gallery-grid .slot-6 { grid-area: 0 / 0 / 0 / 0!important; display:none!important; } .gallery-grid .slot-7 { grid-area: 1 / 3 / 3 / 4!important; } } Employees Our employees are at the core of everything we do—a global community of high performers bringing their best selves to work, speaking up respectfully, and striving to do better every day. Customer Service We relentlessly seek to deliver meaningful value to our customers and are deeply committed to their success. In all we do, we strive for the highest levels of customer and user satisfaction. Innovation To succeed within a fiercely competitive industry, we innovate with urgency and create an environment where it is safe to take risks, experiment, and challenge the status quo while making investments that scale and deliver long-term value. Integrity We work hard to build and sustain a culture of honesty that will serve our business for the long haul. To earn the trust of everyone we work with, we set clear expectations, establish accountability, measure results, and own our outcomes. Fun We believe work should be fun. And that we should have fun every day by inspiring, winning, and celebrating in ways that build meaningful relationships across the world. Profitability Profitability is important but it’s not why we exist. We exist to inspire a brighter work day for all. If we live our values, make smart choices, and spend wisely, profitability will follow. See how we put our values into action. Learn More"
