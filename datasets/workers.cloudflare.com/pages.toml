["https://workers.cloudflare.com/built-with/projects/Curios"]
title = "Curios ・ Built with Workers ・ Cloudflare Workers©"
description = "Self publishing and fan engagement for musicians, authors and creators."
full_description = "BackCuriosSelf publishing and fan engagement for musicians, authors and creators.Visit websiteAbout Curios.com aims to put the power back into the hands of the creators. Curios is an open platform for musicians, authors, and other digital content creators to self publish and sell their work directly to their audiences. This direct model allows the creator to keep 100% of their revenues and build a deeper relationship with their fanbase. The direct sales with no cut is made possible through Curios use of blockchain and smart contract infrastructure to keep highly accurate records of ownership without having to burden the consumers or creators of this content with any kind of tech hurdles. Curios specializes in publishing and distributing digital content like music, audiobooks, ebooks, tickets/events, videos, courses and more. How they use Cloudflare As content continues to shift towards digital, Curios aims to empower artists with technology to own their work and their audience data. Creators use the Curios dashboard to upload and manage content which then gets publicly featured on Curios’ marketplace for fans to claim or consume media. Additionally Curios offers a mobile app to support streaming with integrations to Sonos, chromecast, Alexa, Apple CarPlay and more. The Curios application uses Cloudflare Caching to store and retrieve highly-dynamic content including media rich content, high resolution videos and high bit-rate audio. Curios utilizes Cloudflare Images to both resize their images and manage the overall images stored from user-generated content. Moreover, Cloudflare Stream helps to serve high-resolution videos, allowing the team to enforce authentication for users to unlock exclusive content once purchased. Lastly, the team utilizes Cloudflare for SaaS to build a white-labeled domain management solution, which extends SSL and security features to end user custom hostnames. Why Cloudflare? “With Cloudflare, the self-service plans scale up well. To pay a fraction of what we’d pay at any other providers and receive the security, performance and media benefits that we do - it's priceless!”DeveloperCuriosLinksWebsiteTwitterLinkedInAnnouncementFeaturesStreamCloudflare for SaaSImagesAlso built with Workers...FynLinkThe privacy-first URL shortenerLandingsiteBuild a polished website in minutes using AIRightBloggerAI-powered writing toolsDuliaA platform for crafting and deploying bespoke AI assistantsUnfetchBuild and deploy AI agents to solve any taskGrackerAIGrackerAI tackles a major headache for cybersecurity marketing teams - keeping up with the constant flood of industry news and creating content that matters. It's like having a smart radar that never sleeps, scanning for vulnerabilities, data breaches, and trending cyber topics."
