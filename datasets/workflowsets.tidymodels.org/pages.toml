title = "Create a Collection of tidymodels Workflows • workflowsets"
description = """
A workflow is a combination of a model and preprocessors(e.g, a formula, recipe, etc.) (Kuhn and Silge (2021)<https://www.tmwr.org/>). In order to try different combinations ofthese, an object can be created that contains many workflows. Thereare functions to create workflows en masse as well as training themand visualizing the results."""
