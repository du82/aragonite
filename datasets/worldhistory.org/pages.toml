["https://worldhistory.org/John_Quincy_Adams"]
title = "John Quincy Adams - World History Encyclopedia"
description = "John Quincy Adams (1767-1848) was an American statesman and diplomat who served as the sixth president of the United States (1825-1829). The son of a former president, Adams had a long and distinguished..."
full_description = '''John Quincy AdamsMathew Brady (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20040/john-quincy-adams/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20040/john-quincy-adams/","caption":"Former US president John Quincy Adams, daguerreotype taken by Mathew Brady, c. 1840s.\r\n\r\nNational Archives and Records Administration, Washington, D.C.","contentUrl":"https://www.worldhistory.org/uploads/images/20040.jpg","copyrightNotice":"Mathew Brady - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Mathew Brady"},"creditText":"Mathew Brady / World History Encyclopedia","dateModified":"2025-02-21T07:59:22+0000","datePublished":"2025-02-21T07:59:21+0000","encodingFormat":"image/jpeg","headline":"John Quincy Adams","height":599,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://catalog.archives.gov/id/528668"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20040/john-quincy-adams/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":true,"url":"https://www.worldhistory.org/image/20040/john-quincy-adams/","width":459} John Quincy Adams (1767-1848) was an American statesman and diplomat who served as the sixth president of the United States (1825-1829). The son of a former president, Adams had a long and distinguished political career both before and after his single presidential term, in which he sought to strengthen the US and advocated for the antislavery movement. Early Life John Quincy Adams (pronounced 'Quinzy') was born on 11 July 1767, in his parents' home in Braintree, Massachusetts. His father, John Adams, was then an up-and-coming Boston lawyer who had recently married Abigail Smith Adams, John Quincy's mother. John Quincy grew up amidst the turmoil of the American Revolution, which began practically in his own backyard; indeed, when he was only seven, he witnessed the Battle of Bunker Hill from afar. His father was heavily involved in the Second Continental Congress, helping to spearhead the push for the independence of the United States, which was finally achieved in July 1776. In 1778, John Adams was selected to go to Paris as part of a diplomatic mission to secure political and financial support for the Patriot cause. He decided to take John Quincy with him, and, after a tumultuous transatlantic voyage, the Adamses arrived in France in April 1778. Remove Ads Advertisement As ambassador, Adams was able to keep tabs on the wars that were escalating in Europe. Upon arriving in Paris, John Quincy was sent to a French boarding school, where he quickly became proficient in French. In 1780, when John Adams went to Amsterdam to secure loans from the Dutch Republic, John Quincy accompanied him there as well, furthering his education at Leiden University. During this time, he formed a close relationship with his father, whose personality and political beliefs he came to emulate. Like his father, John Quincy grew into a solitary man with few intimate friends and more comfortable in the company of his books; indeed, around this time, John Quincy began to keep a diary that would become his main confidant over the next 60 years. In 1781, John Quincy parted from his father to go to Saint Petersburg as the personal secretary of Francis Dana, the newly appointed US minister to Russia. He was back at his father's side by 1783, where he acted as an informal secretary during the negotiations that led to the Treaty of Paris, which ended the American Revolutionary War and secured British recognition of US independence. YouTube Follow us on YouTube! Career Beginnings In 1785, John Quincy returned to Massachusetts in the hopes of starting a political career. He rounded out his education at Harvard College before going on to study law and finally opened his own legal practice in Boston in 1790. For the next few years, he remained aloof from politics as he worked to build his reputation as a lawyer. But law was a "profession he never loved," as his mother Abigail put it, so when President George Washington offered him the position of ambassador to the Netherlands in May 1794, he accepted. From this vantage, Adams was able to keep tabs on the French Revolutionary Wars that were escalating in Europe, sending information back to the Washington administration; these letters helped convince Washington that the young Adams was one of the most capable American diplomats, earning him the important post of ambassador to Portugal in 1796. Adams spent the winter of 1795-96 in London, where he courted the 20-year-old Louisa Catherine Johnson, daughter of an American merchant and an Englishwoman. John Quincy and Louisa were married in London on 26 July 1797. They would eventually have four children. Remove Ads Advertisement Louisa Catherine AdamsGilbert Stuart (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20031/louisa-catherine-adams/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20031/louisa-catherine-adams/","caption":"Louisa Catherine Johnson Adams (1775-1852), wife of President John Quincy Adams, First Lady of the United States from 1825 to 1829, oil on canvas portrait by Gilbert Stuart, c. 1820s. \r\n\r\nWhite House, Washington, D.C.","contentUrl":"https://www.worldhistory.org/uploads/images/20031.jpg","copyrightNotice":"Gilbert Stuart - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Gilbert Stuart"},"creditText":"Gilbert Stuart / Wikipedia","dateModified":"2025-02-21T07:55:07+0000","datePublished":"2025-02-21T07:55:05+0000","encodingFormat":"image/jpeg","headline":"Louisa Catherine Adams","height":600,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://commons.wikimedia.org/wiki/File:Louisa_Adams.jpg"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20031/louisa-catherine-adams/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/20031/louisa-catherine-adams/","width":503} By the time of his marriage, Adams' father had been sworn in as the second US president. Ignoring charges of nepotism, President Adams appointed John Quincy as ambassador to Prussia. While in Berlin, John Quincy frequently wrote to his father about developments in Europe, giving the Adams administration key information during the perilous months of the Quasi-War with France. In 1799, John Quincy Adams struck a significant trade deal with Prussia but was recalled to the US the following year, after his father lost re-election to Thomas Jefferson. Senator & Diplomat In 1803, the Massachusetts legislature elected Adams to the US Senate. Although he had never been much of a partisan man, Adams went to the new capital of Washington, D.C., as a member of the Federalist Party, like his father before him. However, he quickly broke with his party by supporting the Louisiana Purchase, which had been negotiated by the Democratic-Republican administration of President Jefferson. In December 1807, Adams again crossed party lines by supporting the Embargo Act of 1807, which placed an embargo on Great Britain as punishment for the Royal Navy's impressment of American sailors. Adams' Federalist colleagues opposed the embargo since the Federalist stronghold of New England heavily relied on trade with British merchants, once again earning him their ire. Due to his support for the Embargo Act, Adams lost his Senate seat in 1808, leading him to exit the Federalist Party and join the Democratic-Republicans. Remove Ads Advertisement In 1809, President James Madison appointed Adams as the US minister to Russia. He opted to take Louisa with him to Saint Petersburg but left their three children at home to continue their educations – this caused some friction in their marriage, which was worsened when Louisa found Saint Petersburg a cold and unpleasant place. She would eventually warm to the post, however, and became a popular figure at the tsar's court. In 1812, Adams witnessed Napoleon's invasion of Russia, which resulted in the dissolution of the Grande Armée and contributed to the downfall of the French emperor; Adams dutifully reported these developments to Washington. John Quincy Adams, 1796John Singleton Copley (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20030/john-quincy-adams-1796/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20030/john-quincy-adams-1796/","caption":"John Quincy Adams as he looked at the age of 29, oil on canvas portrait by John Singleton Copley, 1796.\r\n\r\nMuseum of Fine Arts, Boston.","contentUrl":"https://www.worldhistory.org/uploads/images/20030.jpg","copyrightNotice":"John Singleton Copley - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"John Singleton Copley"},"creditText":"John Singleton Copley / Wikipedia","dateModified":"2025-02-21T07:40:13+0000","datePublished":"2025-02-21T07:40:12+0000","encodingFormat":"image/jpeg","headline":"John Quincy Adams, 1796","height":599,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://commons.wikimedia.org/wiki/File:John_Quincy_Adams,_by_John_Singleton_Copley.jpg"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20030/john-quincy-adams-1796/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/20030/john-quincy-adams-1796/","width":508} The same year, the War of 1812 broke out between the United States and Britain in response to the Royal Navy's continued practice of impressment. The war did not begin well for the US, and Adams was soon appointed to a delegation charged with negotiating peace. After several grueling months, the delegation – which also included Albert Gallatin, Henry Clay, James A. Bayard, and Jonathan Russell – finally met with British officials in the Flemish city of Ghent. The diplomats agreed to restore all borders to their prewar state and finalized the peace on 24 December 1814 with the Treaty of Ghent. Then Adams traveled to Paris where he witnessed Napoleon's brief return to power in the Hundred Days of 1815. Secretary of State In 1817, Adams was selected to serve as secretary of state by President James Monroe. He would become instrumental in the foreign policy of the Monroe administration, during a period of political calmness known as the 'Era of Good Feelings'. Adams helped mend post-war relations with Britain by overseeing the Treaty of 1818, which fixed the US-Canada border at the 49th parallel, and additionally negotiated the purchase of Florida from Spain in the Adams-Onís Treaty of 1819. In the process of acquiring Florida, Adams supported the aggressive actions of General Andrew Jackson, who had exceeded his authority by capturing the Spanish outpost of Pensacola and executing two Englishmen; Adams convinced Monroe's cabinet that Jackson's actions had been necessary for national defense. Remove Ads Advertisement John Quincy Adams as Secretary of StateGilbert Stuart (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20032/john-quincy-adams-as-secretary-of-state/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20032/john-quincy-adams-as-secretary-of-state/","caption":"John Quincy Adams as secretary of state; oil on panel by Gilbert Stuart, 1818.\r\n\r\nWhite House, Washington, D.C.","contentUrl":"https://www.worldhistory.org/uploads/images/20032.jpg","copyrightNotice":"Gilbert Stuart - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Gilbert Stuart"},"creditText":"Gilbert Stuart / Wikipedia","dateModified":"2025-02-21T07:51:10+0000","datePublished":"2025-02-21T07:51:08+0000","encodingFormat":"image/jpeg","headline":"John Quincy Adams as Secretary of State","height":600,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://commons.wikimedia.org/wiki/File:Gilbert_Stuart_-_John_Quincy_Adams_-_Google_Art_Project.jpg"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20032/john-quincy-adams-as-secretary-of-state/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/20032/john-quincy-adams-as-secretary-of-state/","width":496} Monroe and Adams supported the Spanish colonies of Latin America in their struggles for independence. Worried that Spain – or another European power – might return to reassert authority over their former colonies, Adams urged Monroe to publicly denounce any European attempt to exert influence in the Americas. This policy was expounded on and eventually became known as the Monroe Doctrine, in which the United States claimed the western hemisphere as its sphere of influence and warned the European powers from meddling in the Americas. Adams contributed greatly to the Monroe Doctrine, which would become a cornerstone of US foreign policy in the late 19th and 20th centuries. 1824 Election As President Monroe's second term came to an end, several figures came forth as possible successors. Adams, as secretary of state, was a strong contender – it was rumored that he had the support of Monroe himself, though the president stayed silent on the matter. But Adams would face steep competition from Henry Clay of Kentucky, John C. Calhoun of South Carolina, and William H. Crawford of Georgia, all of whom commanded much support within the Democratic-Republican Party (the Federalists had lost all national influence after their opposition to the War of 1812, leaving the Democratic-Republicans as the only party strong enough to field presidential candidates in 1824). Andrew Jackson of Tennessee, still riding high from his victory in the Battle of New Orleans, also declared his candidacy, sparking a five-way race. Calhoun eventually dropped out of the race after both Adams and Jackson promised to take him on as their vice president, and Crawford suffered a se'''
author = "Harrison W. Mark"
