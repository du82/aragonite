title = "Why Kokopelli is Not Kokopelli: Paiyatamu & The Four Flutes - World History Encyclopedia"
description = "The iconic image of Kokopelli, the flute-playing kachina spirit of the Pueblo peoples, specifically the Hopi, is easily the most recognizable figure from Native American culture in the Southwest United..."
full_description = '''The iconic image of Kokopelli, the flute-playing kachina spirit of the Pueblo peoples, specifically the Hopi, is easily the most recognizable figure from Native American culture in the Southwest United States but, according to traditional Native understanding, the Flute Player and Kokopelli are two different entities. Kokopelli Petroglyph in New Mexico, USACarptrash (CC BY-SA) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20042/kokopelli-petroglyph-in-new-mexico-usa/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20042/kokopelli-petroglyph-in-new-mexico-usa/","caption":"Kokopelli petroglyph in New Mexico, USA, photograph by Carptrash, 2009. Most likely depicting another kachina spirit figure of the Pueblo peoples who has come to be identified with Kokopelli.","contentUrl":"https://www.worldhistory.org/uploads/images/20042.jpeg","copyrightNotice":"Carptrash - CC BY-SA - This license lets others remix, tweak, and build upon a work even for commercial reasons, as long as they credit the author and license their new creations under the identical terms. When republishing on the web a hyperlink back to the original content source URL must be included.","creator":{"@type":"Person","name":"Carptrash"},"creditText":"Carptrash / Wikipedia","dateModified":"2025-02-18T10:21:57+0000","datePublished":"2025-02-18T10:21:56+0000","encodingFormat":"image/jpeg","headline":"Kokopelli Petroglyph in New Mexico, USA","height":1000,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://commons.wikimedia.org/wiki/File:Kokopelli_1.jpg"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"https://creativecommons.org/licenses/by-sa/4.0","mainEntityOfPage":"https://www.worldhistory.org/image/20042/kokopelli-petroglyph-in-new-mexico-usa/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":true,"url":"https://www.worldhistory.org/image/20042/kokopelli-petroglyph-in-new-mexico-usa/","width":750} Kokopelli (also given as Kokopolo, Kokopele, Ololowishkya, Neopkwai'i) is a kachina (spirit figure) of the Pueblo peoples, associated closely with the Hohokam and Hopi (among others) and is regarded by the Hopi as a fertility spirit (or fertility god), represented as a hump-backed man with an erect phallus, beak, and bird feathers on his head. He is understood as a separate entity from the Flute Player figure, who is known either as maahu ("the cicada") or as lelenhoya ("flute player"). Among the Zuni, the most famous Flute Player is Paiyatuma (also given as Paiyatamu) – "The God of Dew and of the Dawn" – who first gave the Zuni the gift of the flute and "new music" as related in the legend of The Four Flutes. Remove Ads Advertisement Non-Natives conflated the image of Paiyatuma the Flute Player (or another kachina flute player) and/or the cicada flute player, with Kokopelli. At some point, non-Natives conflated the image of Paiyatuma the Flute Player (or another kachina flute player) and/or the cicada flute player, with Kokopelli, agent of fertility and, like Paiyatuma, a trickster figure who can appear as a clown, or a sage, a god, or a fool. Kokopelli and Paiyatuma even appear together in some depictions of Pueblo peoples' religious ceremonies, clearly suggesting they are two separate entities: one, the hump-backed agent of fertility, the other, the flute player. Confusion of the one with the other is encouraged by petroglyphs depicting a hump-backed flute player, but, according to the traditional understanding of the Pueblo peoples, the flute player is not Kokopelli. YouTube Follow us on YouTube! Pueblo Peoples The term "Pueblo peoples" does not refer to a single Native American nation but to those nations who historically lived in pueblos, including, though not limited to the Acoma, Hohokam, Hopi, Navajo, Tewa, Zia, and Zuni. Pueblo is Spanish for "village", and the people came to be known by the Spanish as Puebloans. They were initially a hunter-gatherer society until they took up agriculture, especially the cultivation of maize (corn) at some point c. 2000 BCE, when they also initiated irrigation techniques, later mastered by the Hohokam, who created the largest irrigation system in North America. The canals built by the ancient Hohokam can still be seen in modern-day Arizona and some are still in use. Remove Ads Advertisement At first, the people lived in caves or built structures protruding from cliffs but eventually shifted to buildings made of wood and adobe with multiple rooms within each structure, often accessed by ladders on the sides of the building with an entrance toward or at the top, as a means of defense. The Pueblo peoples had a highly developed civilization at the time the Spanish arrived in the 16th century, at which time many were killed, died of European diseases, or were enslaved, notably after the Acoma Massacre of 1599, and their religious practices were outlawed by c. 1665. The kachina dolls, kachina masks, and prayer sticks of the people were burned, and Kachina Dances forbidden in an effort to "stamp out sorcery" by the Christian missionaries. Zuni Kachina DollBrooklyn Museum (CC BY) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20045/zuni-kachina-doll/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20045/zuni-kachina-doll/","caption":"She-we-na (Zuni Pueblo). Kachina doll (Paiyatemu), made of wood, pigment, horsehair, feathers, wool, hide, cotton, tin, ribbon, 22 1/2 x 9 x 8 in. (57.2 x 22.9 x 20.3 cm), from Zuni, New Mexico, late 19th century.\r\n\r\nBrooklyn Museum, Museum Expedition 1903.","contentUrl":"https://www.worldhistory.org/uploads/images/20045.jpeg","copyrightNotice":"Brooklyn Museum - CC BY - This license lets others distribute, remix, tweak, and build upon your work, even commercially, as long as they credit you for the original creation. When republishing on the web a hyperlink back to the original content source URL must be included.","creator":{"@type":"Organization","name":"Brooklyn Museum"},"creditText":"Brooklyn Museum / Wikipedia","dateModified":"2025-02-19T10:26:40+0000","datePublished":"2025-02-19T10:26:39+0000","encodingFormat":"image/jpeg","headline":"Zuni Kachina Doll","height":1159,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://www.brooklynmuseum.org/opencollection/objects/131362"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"https://creativecommons.org/licenses/by/4.0","mainEntityOfPage":"https://www.worldhistory.org/image/20045/zuni-kachina-doll/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/20045/zuni-kachina-doll/","width":800} These abuses, as well as a drought that brought famine, and raids by Apache bands seeking food, finally led to the Pueblo Revolt of 1680 (also known as Pope's Rebellion/Po'pay's Rebellion) led by the Tewa medicine man Po'pay (l. c. 1630 to c. 1692), which killed 400 Spaniards and drove the others from the region for the next twelve years. The revolt also released the Spaniards' horses, which were later taken by citizens of the Plains Indians, contributing to the so-called horse culture of the Great Plains. Remove Ads Advertisement Kachina Spirits & Ceremonies Although the prohibition of their religious practices was not the only reason for the Pueblo Revolt, it was certainly a contributing factor as the Pueblo peoples historically understood the world as inhabited by kachina spirits who needed to be recognized and respected. Scholar Adele Nozedar defines the kachina: This word [Kachina] derives from ka (respect) and china (spirit). The kachina is a powerful example of how, for Native Americans, the world of human beings, the world of nature, and the world of spirit are all intertwined. Grasping this concept is essential to any true understanding of the Native American psyche. The concept of the kachina belongs in particular to the Pueblo people. Frank Waters, in his 1963 publication, The Book of the Hopi, tells us: The kachinas, then, are the inner forms, the spiritual components, of the outer physical forms of life, which may be invoked to manifest their benign powers so that one may be enabled to continue the never-ending journey. They are invisible forces of life – not gods, but rather intermediaries, messengers. Hence, their chief function is to bring rain, insuring the abundance of crops and the continuation of life. (235) The kachinas are also sometimes understood as the spirits of one's ancestors, who divide their time between the spirit world and their relatives' villages. They may bring messages from the higher realms, protect one from evil spirits that bring disease or bad luck, heal sickness, and encourage positivity, creativity, fertility, and spiritual expansion or enlightenment. If disrespected, however, a kachina can also bring sickness, bad luck, and other misfortune. One respects the kachinas through personal and public ceremonies, which made the prohibition of such rituals by the Spanish all the more intolerable. Remove Ads Advertisement Kokopelli & Paiyatuma, powerful kachina spirits, are both associated with transformation, fertility, & growth. Kachina ceremonies are still observed today by the Pueblo peoples following the same traditions as their ancestors. In putting on a kachina mask and participating in a Kachina Dance, one is understood as channeling that particular spirit; the masked dancer is not just representing the spirit or playing a role but is understood as being inhabited by that spirit throughout the course of the ceremony. In this way, the invisible kachina becomes visible, identifiable, and more closely associated with their specific power or aspect of the natural world. Scholar Larry J. Zimmerman comments: A kachina expressed a belief that everything has a life force, which humans must interact with. These powerful beings are important in the Hopi and Pueblo culture. There are about 400 figures in total, representing concepts as well as natural phenomena such as the sun, the stars, corn, and insects. In tribal myth, many kachinas taught people the essential skills such as medicine or agriculture. Traditionally, small kachina dolls were carved out of cottonwood and given as gifts to children by the masked dancers who appeared in the villages during the ceremonies which ran from the winter solstice through July. (185) The kachina dolls are given to children to teach them how to identify the kachinas. Each kachina doll was traditionally made by hand, usually by a child's maternal uncle, and looked precisely like the kachina it represented. The manufacture of kachina dolls has become commercialized in the past 200 years, ever since Euro-Americans began prizing them as collectibles, but citizens of the Nations of the Pueblo Peoples still make dolls by hand in accordance with tradition. Remove Ads Advertisement Clowns are also an important aspect of the kachina ceremonies as they not only amuse and entertain an audience but take on the role of the sacred clown, a contrarian – associated with the trickster figure – who behaves in unexpected and socially unacceptable ways to break people from rigid thought, belief, expectation, or custom. By enacting lewd or unacceptable behavior in public, these clowns draw an audience's attention to their own behavior, encouraging change and overall transformation, and, in this respect, they are spiritually linked to Kokopelli and Paiyatuma. Kokopelli & Paiyatuma Kokopelli and Paiyatuma, powerful kachina spirits who are sometimes depicted presiding over maize ceremonies, are both associated with transformation, fertility, and growth. Kokopelli is said to carry the spirits (or seeds) of unborn children in the pack on his back (or the hump of his back) and, as he passes through a village, to distribute these to young women who then become pregnant. He is also said to carry the seeds of all the plants of the world (or of the world that came before the present) and casts these about to encourage abundant growth of plants, crops, herbs, and flowers. Paiyatuma is also associated with plant growth and fertility overall, as seen in the legend of Paiyatuma and the Maidens of the Corn in which he brings the Corn Maidens, who make the plants grow, to the people. He is primarily known as the Flute Player, the god of dew and of the dawn. Both he and Kokopelli are understood as trickster figures, and both sometimes appear as a sacred clown. In Paiyatuma and the Maidens of the Corn, for example, Paiyatuma appears before the Council as a clown in dirty clothes, making jokes, before allaying their concerns about the seemingly missing Corn Maidens. Kokopelli and Kokopelli Mana as Depicted by the HopiUnknown Hopi Artist (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20041/kokopelli-and-kokopelli-mana-as-depicted-by-the-ho/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20041/kokopelli-and-kokopelli-mana-as-depicted-by-the-ho/","caption":"Kokopelli and Kokopelli Mana as depicted by the Hopi or Two Hopi Kachinas: Kookop\u00f6l\u00f6, left, and his female counterpart Kokop\u00f6lmana, right, from Hopi Katcinas Drawn by Native Artists, by Jesse Walter Fewkes, 1903.","contentUrl":"https://www.worldhistory.org/uploads/images/20041.jpeg","copyrightNotice":"Unknown Hopi Artist - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Unknown Hopi Artist"},"creditText":"Unknown Hopi Artist / Public Domain Book","dateModified":"2025-02-18T10:19:11+0000","datePublished":"2025-02-18T10:19:10+0000","encodingFormat":"image/jpeg","headline":"Kokopelli and Kokopelli Mana as Depicted by the Hopi","height":865,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://archive.org/details/hopikatcinasdraw00fewk/page/n175/mode/2up"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20041/kokopelli-and-kokopelli-mana-as-depicted-by-the-ho/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/20041/kokopelli-and-kokopelli-mana-as-depicted-by-the-ho/","width":1024} As tricksters, both Kokopelli and Paiyatuma encourage transformation and new ways of thinking or looking at oneself, one's behavior, and any given circumstances of life. Kokopelli and his female consort Kokopelmana (also given as Kokopelmimi) are often depicted acting inappropriately in public – like the clowns in the kachina ceremonies – encouraging an audience to question what it means to behave '''
