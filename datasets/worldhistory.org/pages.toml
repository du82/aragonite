full_description = '''Portrait of James MonroeSamuel F. B. Morse (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20017/portrait-of-james-monroe/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20017/portrait-of-james-monroe/","caption":"James Monroe, oil on canvas portrait by Samuel F. B. Morse, c. 1819.\r\n\r\nWhite House, Washington, D.C.","contentUrl":"https://www.worldhistory.org/uploads/images/20017.jpg","copyrightNotice":"Samuel F. B. Morse - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Samuel F. B. Morse"},"creditText":"Samuel F. B. Morse / World History Encyclopedia","dateModified":"2025-02-18T08:00:36+0000","datePublished":"2025-02-18T08:00:34+0000","encodingFormat":"image/jpeg","headline":"Portrait of James Monroe","height":599,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://www.whitehousehistory.org/photos/james-monroe"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20017/portrait-of-james-monroe/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":true,"url":"https://www.worldhistory.org/image/20017/portrait-of-james-monroe/","width":483} James Monroe (1758-1831) was an American statesman who served as the fifth president of the United States (1817-1825). The fourth president to belong to the so-called 'Virginia Dynasty', and the last of the generation of the Founding Fathers to hold the office, Monroe is primarily remembered for the Monroe Doctrine and the Era of Good Feelings. Early Life & Revolution James Monroe was born on 28 April 1758 in Westmoreland County, Virginia. He was the eldest son of Spence Monroe, a craftsman, and Elizabeth Jones Monroe, the daughter of a family of wealthy Welsh immigrants. James grew up on the 600-acre family farm on which he was born, and, at the age of eleven, he was enrolled in Campbelltown Academy, considered the best school in Virginia. Here, he excelled in Latin and mathematics and befriended fellow student John Marshall, future chief justice of the US Supreme Court. In the early 1770s, both of Monroe's parents died, forcing him to drop out of school to take care of his younger siblings and to look after the property he had inherited, which included several enslaved people. In 1774, Monroe was able to return to school and attended the College of William and Mary, where he became increasingly involved in Whig politics and the opposition to Parliamentary taxes. Remove Ads Advertisement For the past decade, British Parliament had imposed a series of direct taxes on the colonies that American Whigs, or 'Patriots', had condemned as unconstitutional, on the basis that they were not represented in Parliament. The conflict had gradually escalated until, in April 1775, the American Revolutionary War broke out between Britain and the rebellious colonies. In the days leading up to the war, Lord Dunmore, the royal governor of Virginia, dissolved the colony's elected legislative body, the House of Burgesses, and sent British soldiers to confiscate arms and ammunition belonging to the colony's militias. Outraged, Monroe and hundreds of other Virginians followed Patriot leader Patrick Henry to the Governor's Mansion in Williamsburg, to demand the weapons' return; the conflict, later known as the Gunpowder Incident, was de-escalated when Dunmore agreed to pay the Patriots £330. Monroe, feeling this was not good enough, later broke into the Governor's Mansion with 23 other students and stole hundreds of muskets and swords for the Patriot cause. YouTube Follow us on YouTube! In 1776, Monroe dropped out of college and enlisted in the 3rd Virginia Regiment of the Continental Army. That December, he crossed the icy Delaware River with General George Washington and participated in the ensuing Battle of Trenton (26 December 1776). During the battle, he was severely wounded in the shoulder while capturing a Hessian cannon and nearly died of his injuries. After recovering, he was promoted to captain for his valor and saw further action at the Battle of Brandywine (11 September 1777) and Battle of Germantown (4 October 1777). He spent the winter shivering with the rest of the Continental Army at Valley Forge, where he befriended Gilbert du Motier, Marquis de Lafayette, and shared a cabin with his old schoolmate John Marshall. The following year, he served at the Battle of Monmouth (28 June 1778) and was later promoted to lieutenant colonel, with recommendations from both Washington and Alexander Hamilton. Remove Ads Advertisement American War of Independence, 1775 - 1783Simeon Netchev (CC BY-NC-ND) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/17652/american-war-of-independence-1775---1783/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/17652/american-war-of-independence-1775---1783/","caption":"A map illustrating the course and major events during the American War of Independence (also known as the American Revolutionary War or American Revolution) between 1775 and 1783 \u2013 an armed rebellion through which thirteen of Great Britain's colonies in North America sought independence. The insurrection stemmed from various reasons, amongst which the colonists' grievances over taxation without representation and limitations on self-governance. Starting with the battles of Lexington and Concord in 1775, the conflict escalated into a full-scale war between the Continental Army and the forces of the British crown, and in 1778, it turned from a civil war within the British Empire into an international confrontation as France and Spain joined the colonies against Britain. The war reached its climax with the final British surrender at Yorktown in 1781, leading to the Treaty of Paris in 1783, formally recognizing the United States of America as an independent nation.","contentUrl":"https://www.worldhistory.org/uploads/images/17652.png","copyrightNotice":"Simeon Netchev - CC BY-NC-ND - This licence only allows others to download this content and share it with others as long as the author is credited, but they can't change the content in any way or use it commercially. When republishing on the web a hyperlink back to the original content source URL must be included.","creator":{"@type":"Person","@id":"https://www.worldhistory.org/user/simeonnetchev/#person","name":"Simeon Netchev","url":"https://www.worldhistory.org/user/simeonnetchev/","sameAs":["https://www.linkedin.com/in/simeon-netchev/"],"image":"https://www.worldhistory.org/uploads/profile_photos/150-simeonnetchev.jpg","description":"Simeon is a freelance visual designer and history teacher passionate about the human stories behind past events. He believes every image should tell a story and spark interaction, while each map leads on a journey, blending imagination with education.","jobTitle":"Graphic Designer","worksFor":"https://www.worldhistory.org#organization"},"creditText":"Simeon Netchev / World History Encyclopedia","dateModified":"2024-01-24T08:45:20+0000","datePublished":"2023-07-17T06:20:37+0000","encodingFormat":"image/png","headline":"American War of Independence, 1775 - 1783","height":2790,"isAccessibleForFree":true,"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"https://creativecommons.org/licenses/by-nc/4.0","mainEntityOfPage":"https://www.worldhistory.org/image/17652/american-war-of-independence-1775---1783/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/17652/american-war-of-independence-1775---1783/","width":3720} In 1780, Monroe resigned from the army and returned to Williamsburg to study law. Here, he was mentored by none other than Thomas Jefferson, who took Monroe under his wing and influenced his political development. In 1782, he was elected to the Virginia House of Delegates, which he used as a stepping stone to win election to the Confederation Congress the following year. During his three years in Congress, Monroe supported the westward expansion of the United States as well as the Northwest Ordinance, which laid out the procedure whereby such lands could be admitted into the Union as states. He strongly supported the right of the US to navigate the Mississippi River – which was a point of contention with Spain – and argued against the need for a stronger central government than the one laid out in the Articles of Confederation. On 16 February 1786, the 27-year-old Monroe married Elizabeth Kortright, the 17-year-old daughter of a prominent New York City family. Monroe retired from Congress that same year, and the couple settled in Fredericksburg, Virginia, where Monroe opened a law practice. The couple would have two daughters: Eliza (1786-1840) and Maria (1802-1850); a son, James, was born in 1799 but tragically died sixteen months later. Monroe re-entered politics in 1788 when he attended the Virginia Ratifying Convention, tasked with ratifying the newly drafted US Constitution for the Commonwealth of Virginia. Though by now Monroe agreed that the feeble Articles of Confederation should be amended, he was concerned that the Constitution left the federal government too powerful and ultimately voted against it. Nevertheless, Virginia voted to ratify the Constitution by a narrow margin, and it went into effect nationwide in March 1789, with Washington elected as the first president. Remove Ads Advertisement Senator & Diplomat Monroe threw his lot in with the Jeffersonians & quickly became one of the loudest critics of the pro-Federalist Washington administration. In 1789, Monroe ran for a seat in the House of Representatives against James Madison, another Jefferson pupil. The two vowed not to let the election sour their friendship and often traveled together during the campaign. Although Madison won the seat, Monroe would be elected to the US Senate the following year, after the sudden death of the incumbent made the seat available. During Monroe's time in the Senate, the first political parties began to form in the United States, pitting the Federalist Party of Alexander Hamilton – which favored strong central government and pro-British policies – against the Democratic-Republican Party of Jefferson, which favored more autonomy for the states and supported the French Revolution. Unsurprisingly, Monroe threw his lot in with the Jeffersonians and quickly became one of the loudest critics of the pro-Federalist Washington administration in the Senate. He constantly butted heads with Hamilton, helping to expose the latter's involvement in a sex scandal in 1792; the incident almost led to a duel between the two men. In 1794, Monroe was appointed ambassador to France. Arriving shortly after the conclusion of the Reign of Terror, he and Elizabeth were able to use their influence to secure the release of several pro-American figures who had been imprisoned by the French revolutionaries, including Thomas Paine and Adrienne de Lafayette, wife of the marquis. Yet during his ambassadorship, Monroe still proved much too sympathetic to Revolutionary France for President Washington's liking. He constantly overstepped his bounds, like when he told the French that the pro-British Jay Treaty – a trade agreement between the US and Britain that fostered warm relations between the two countries – would probably be repealed. He was recalled from his post in November 1796, with the timing being deliberate so that he would return home after the US presidential election of 1796. The following spring, Monroe retaliated by publishing a 500-page pamphlet entitled A View of the Conduct of the Executive, in the Foreign Affairs of the United States, which attacked the conduct of the Federalists and the Washington administration. James Monroe, 1794Louis Semé (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/19519/james-monroe-1794/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/19519/james-monroe-1794/","caption":"Portrait of James Monroe, future US president, painting by Louis Sem\u00e9, 1794. Illustration from As I Remember: Recollections of American Society during the Nineteenth Century by Marian Gouverneur,\r\n1911.","contentUrl":"https://www.worldhistory.org/uploads/images/19519.jpg","copyrightNotice":"Louis Sem\u00e9 - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Louis Sem\u00e9"},"creditText":"Louis Sem\u00e9 / Public Domain Book","dateModified":"2024-10-02T08:17:24+0000","datePublished":"2024-10-02T08:17:23+0000","encodingFormat":"image/jpeg","headline":"James Monroe, 1794","height":600,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://www.gutenberg.org/files/28384/28384-h/28384-h.htm#img8"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/19519/james-monroe-1794/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/19519/james-monroe-1794/","width":538} In 1799, Monroe was elected Governor of Virginia, an office he would hold until 1802. He supported the candidacy of his mentor Jefferson in the US Presidential election of 1800. After Jefferson's victory, Monroe was sent to Paris once again to help negotiate the Louisiana Purchase, which was a deal to acquire 530,000,000 acres of land from France. This was arguably the greatest achievement of the Jefferson administration, more than doubling the size of the United States. Afterwards, Monroe continued to serve the Jefferson administration as ambassador to Great Britain. In this capacity, he helped negotiate the Monroe-Pinckney Treaty in 1806 that would have extended the existing trade agreement between the US and Britain; President Jefferson, however, rejected the treaty, since it did nothing to combat the hated British practice of impressing American sailors. The administration's rejection of the treaty caused Monroe to fall out with James Madison, who was serving as secretary of state. In 1808, Monroe decided to challenge Madison for the nomination of the Democratic-Republican Party in that year's presidential election. Madison ultimately won both the party nomination and the election, with Monroe receiving little support outside Virginia. Remove Ads Advertisement Secretary of State In 1810, Monroe was elected once again as governor of Virginia. But his tenure was cut short when President Madison, having reconciled w'''
