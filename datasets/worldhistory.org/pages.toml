title = "Trail of Tears: Memorial and Protest of the Cherokee Nation by John Ross - World History Encyclopedia"
description = 'The Trail of Tears was the forced relocation of the "Five Civilized Tribes" – Cherokee, Chickasaw, Choctaw, Muscogee Creek, and Seminole – from their ancestral lands in the Southeastern region of the...'
full_description = '''The Trail of Tears was the forced relocation of the "Five Civilized Tribes" – Cherokee, Chickasaw, Choctaw, Muscogee Creek, and Seminole – from their ancestral lands in the Southeastern region of the United States to "Indian Territory" (modern-day Oklahoma) between 1831 and 1850, resulting in the deaths of over 16,000 Native Americans and the removal of over 60,000 from their homelands. Trail of Tears Memorial at New EchotaChristopher James Culberson (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20077/trail-of-tears-memorial-at-new-echota/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20077/trail-of-tears-memorial-at-new-echota/","caption":"Monument in memory of the Cherokee on the Trail of Tears, New Echota, Georgia, USA. \r\n\r\nPhotograph by Christopher James Culberson, 2006.","contentUrl":"https://www.worldhistory.org/uploads/images/20077.jpeg","copyrightNotice":"Christopher James Culberson - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Christopher James Culberson"},"creditText":"Christopher James Culberson / Wikipedia","dateModified":"2025-02-25T08:25:33+0000","datePublished":"2025-02-25T08:25:31+0000","encodingFormat":"image/jpeg","headline":"Trail of Tears Memorial at New Echota","height":774,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://commons.wikimedia.org/wiki/File:TrailofTearsMemorial-3.jpg"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20077/trail-of-tears-memorial-at-new-echota/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":true,"url":"https://www.worldhistory.org/image/20077/trail-of-tears-memorial-at-new-echota/","width":800} Scholar John Ehle writes, "the Trail of Tears – or, as the Indians more often said, the Trail Where They Wept – was a trail of sickness" (385). Most Native Americans died of disease, exposure, exhaustion, and starvation on the forced marches from their lands east of the Mississippi River (modern-day Alabama, Florida, Georgia, North Carolina, and Tennessee) to Indian Territory, a distance of between 1000 miles (1600 km) and over 5000 miles (8000 km), depending on where a given march began and the route taken. Remove Ads Advertisement The Trail of Tears was not a singular event but a series of forced relocations following the passage of the Indian Removal Act of 1830. The marches began the following year with the Choctaw nation and proceeding through 1847, ending in 1850: YouTube Follow us on YouTube! Choctaw: 1831-1836 Seminole: 1832-1842 Muscogee Creek: 1834-1837 Chickasaw: 1837-1847 Cherokee: 1836-1838 Precisely where the term "Trail of Tears" originated is debated, but it is usually attributed to a Choctaw chief who described the journey as "a trail of tears and death." Scholar Adele Nozedar comments: Remove Ads Advertisement The originator of this simple phrase is not known for sure, but it is believed to have been used by a Choctaw chief, Nitikechi, to describe the effects of the Indian Removal Act. The Cherokee had a similar term: "The Place Where They Cried." (500) Although the Trail of Tears is the best-known act of forced relocation of Native Americans, it is far from the only one. Cherokee Chief John Ross (l. 1790-1866) famously opposed the removal in his Memorial and Protest of the Cherokee Nation sent to Congress in June 1836, arguing that the US government had no legal grounds for relocating his people. Although his piece focuses on the Cherokee nation, the points he makes apply equally to the others who were forcibly removed from their lands. Although the Trail of Tears is the best-known act of forced relocation of Native Americans, it is far from the only one as citizens of many other nations of Native peoples of North America experienced the same throughout the 19th century and up to as recently as the mid-1960s to the 1970s. This event, and others like it, notably the Long Walk of the Navajo (1863-1866) are, generally, understood today as acts of genocide perpetrated by the US government. Remove Ads Advertisement Background to the Marches Although the Indian Removal Act of 1830 was the immediate cause for the death marches known as the Trail of Tears, the policies informing that act date back to the 1630s, notably the Pequot War (1636-1638), which reduced the Pequot population of the region of modern-day Massachusetts from 3000 to 200 (many then sold into slavery) to open up their lands for English colonization. Among the "facts submitted to a candid world" presented by Thomas Jefferson in the Declaration of Independence of 1776 was that King George III of Great Britain (r. 1760-1820) Has excited domestic insurrections amongst us and has endeavored to bring on the inhabitants of our frontiers the merciless Indian Savages, whose known rule of warfare is an undistinguished destruction of all ages, sexes, and conditions. As president, in 1803, Jefferson advocated the forced removal of Native Americans west of the Mississippi River and, by 1819, citizens of Native American nations were offered 640 acres of land in Indian Territory for giving up their lands east of the Mississippi. The US government in 1819 had no authority to grant these acres to anyone, however, as they were in so-called "Indian Territory" and, as John Ross points out below, the US government had no legal right to forcibly remove Native Americans from their homelands for relocation in the west. Westward Exploration and Settlement of the United States c.1850Simeon Netchev (CC BY-NC-ND) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/17202/westward-exploration-and-settlement-of-the-united/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/17202/westward-exploration-and-settlement-of-the-united/","caption":"A map illustrating the patterns and routes of westward exploration and settlement in the United States after the \u201cLouisiana Purchase\u201d from France in 1803. As Napoleonic dreams of a great North American Empire gave way to French hegemonic ambitions in Europe, the United States became a continental nation overnight. At the onset of the 19th century, as Meriwether Lewis, William Clark, and the Corps of Discovery made their way up the Missouri River and followed the Columbia River to the shores of the Pacific Ocean, the image of western North America evolved from an almost empty and simple interior with a theoretical single mountainous divide, to a complex landmass of mountains and rivers. Since 1803, when Westward expansion began in earnest, most inland exploration was dominated by the search for suitable emigration routes through the West to Oregon and California, through the Great Plains and the Southwest. By 1820, out of a total population of roughly 10 million, 2 million Americans lived west of the Appalachian Mountains, and by 1845, as more and more settlers crossed the continent, the term Manifest Destiny was coined.","contentUrl":"https://www.worldhistory.org/uploads/images/17202.png","copyrightNotice":"Simeon Netchev - CC BY-NC-ND - This licence only allows others to download this content and share it with others as long as the author is credited, but they can't change the content in any way or use it commercially. When republishing on the web a hyperlink back to the original content source URL must be included.","creator":{"@type":"Person","@id":"https://www.worldhistory.org/user/simeonnetchev/#person","name":"Simeon Netchev","url":"https://www.worldhistory.org/user/simeonnetchev/","sameAs":["https://www.linkedin.com/in/simeon-netchev/"],"image":"https://www.worldhistory.org/uploads/profile_photos/150-simeonnetchev.jpg","description":"Simeon is a freelance visual designer and history teacher passionate about the human stories behind past events. He believes every image should tell a story and spark interaction, while each map leads on a journey, blending imagination with education.","jobTitle":"Graphic Designer","worksFor":"https://www.worldhistory.org#organization"},"creditText":"Simeon Netchev / World History Encyclopedia","dateModified":"2023-03-20T06:23:01+0000","datePublished":"2023-03-20T06:23:00+0000","encodingFormat":"image/png","headline":"Westward Exploration and Settlement of the United States c.1850","height":2790,"isAccessibleForFree":true,"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"https://creativecommons.org/licenses/by-nc/4.0","mainEntityOfPage":"https://www.worldhistory.org/image/17202/westward-exploration-and-settlement-of-the-united/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/17202/westward-exploration-and-settlement-of-the-united/","width":4961} The solution to the "Indian Problem", included in the Indian Removal Act of 1830, was to buy the land from Native Americans, and then, having nowhere to live, they might be amenable to moving west on their own, which the US government promised to help them do. Although the cause of the Trail of Tears is often attributed to the Georgia Gold Rush of 1829, which brought miners into conflict with Native Americans living there, President Andrew Jackson already had Native American relocation as a priority when he took office that year. Remove Ads Advertisement Removal & Protest The Indian Removal Act was passed on 28 May 1830, allowing for the negotiation of large land sales between Native American nations and the US government. The first nation to sign away their lands was the Choctaw, through the Treaty of Dancing Rabbit Creek, in September 1830. The Choctaw understood, too late, that the "assistance" offered by the US government in relocation was a forced march with inadequate provisions in bad weather and, in at least one case, led by inexperienced guides. Nozedar comments: [The Choctaw left] on November 1, right at the beginning of what would be a very harsh winter. The question has to be asked whether this time of year was chosen deliberately by the US Government authorities. The travelers from Memphis, trudging along with their belongings because flooding made it impossible to travel by wagons, were lashed with freezing rain, sleet, snow, and high winds. It was arranged for steamboats to take the people to any river-based destinations. The group that traveled some 60 miles [96 km] up the Arkansas River found that the weather at the Arkansas Post stayed below freezing for a week, the rivers clogged with ice. There was no prospect of going anywhere; therefore, the available food had to be rationed. Each person had a daily allowance of one turnip, two cups of hot water, and a little corn. But their fate was better than the Vicksburg group: their guide had no idea of the route and lost the entire party in the swamplands of Lake Providence. (501) The Seminole rejected forced relocation, launching the Second Seminole War (1835-1842) with the Dade Massacre of 28 December 1835. Chief Osceola of the Seminole (l. 1804-1838) and John Horse of the Black Seminole (also known as Jean Caballao, l. c. 1812-1882) led their people in resistance to the theft of their lands but, eventually, Horse negotiated passage to Indian Territory and, once there, finding the US government was not going to honor the treaty, led his people on to Mexico. Representatives of the Five Civilized TribesRob Ferguson, Jr. (Public Domain) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20078/representatives-of-the-five-civilized-tribes/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20078/representatives-of-the-five-civilized-tribes/","caption":"Representatives of the Five Civilized Tribes: (clockwise from upper left) Sequoyah of the Cherokee, Pushmataha of the Choctaw, Selecta of the Muscogee Creek, Osceola of the Seminole, and a typical Chickasaw warrior.\r\n\r\nImage and description by Rob Ferguson, Jr., 2008.","contentUrl":"https://www.worldhistory.org/uploads/images/20078.png","copyrightNotice":"Rob Ferguson, Jr. - Public Domain - This item is in the public domain, and can be used, copied, and modified without any restrictions.","creator":{"@type":"Person","name":"Rob Ferguson, Jr."},"creditText":"Rob Ferguson, Jr. / Wikipedia","dateModified":"2025-02-25T08:28:13+0000","datePublished":"2025-02-25T08:28:12+0000","encodingFormat":"image/png","headline":"Representatives of the Five Civilized Tribes","height":558,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://commons.wikimedia.org/wiki/File:Five-Civilized-Tribes-Portraits.png"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"http://en.wikipedia.org/wiki/Public_domain","mainEntityOfPage":"https://www.worldhistory.org/image/20078/representatives-of-the-five-civilized-tribes/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":false,"url":"https://www.worldhistory.org/image/20078/representatives-of-the-five-civilized-tribes/","width":600} The Muscogee Creek signed the Treaty of Cusseta in 1832 and began relocation in 1834. The problem with this treaty – as with all treaties (as Ross points out below) is that they were signed by people who had no authority to speak for the entire nation, only for their band. Those who refused to recognize the Treaty of Cusseta resisted removal, leading to the Creek War of 1836. General Winfield Scott (l. 1786-1866) put down the uprising and oversaw the Muscogee Creek removal to Indian Territory. Remove Ads Advertisement The Chickasaw negotiated a payment of $3 million for their lands and then waited to receive it while those lands were taken. Some compensation was made, but the full amount was not paid until 30 years later, in 1866. The Treaty of New Echota was not recognized by the Cherokee Council & was not signed by Chief John Ross. In the case of the Cherokee, 20 tribal members signed the Treaty of New Echota in December 1835 ceding all Cherokee lands east of the Mississippi River to the US government. These 20, known as the Treaty Party, held a minority opinion, did not represent the interests of the whole Cherokee nation, and had no authority to give away the lands in the southeast for the promise of lands "just as good" out west or any financial compensation. Further, the Treaty of New Echota was not recognized by the Cherokee Council and was not signed by Chief John Ross. Ross tried to convince the US Senate that the treaty was invalid because neither he nor the Council had approved it, but the Senate ratified it in March of 1836 anyway. Ross then sent his Memorial and Protest of the Cherokee Nation to the US Congress, '''
