full_description = "Submissions All submissions are carefully reviewed by our editorial team prior to publication. You can submit directly on the website, using one of the buttons below. It is your choice what you write about, but you can find out what is missing to get some inspiration. Please make sure to review our editorial policy, our AI policy and our style guide before submitting. Definition A definition of the subject, several paragraphs long, like you would find in an encyclopedia. Definition Illustration A map, photo, or drawing that helps illustrate the subject. A picture is worth a thousand words! Illustration Article An academic article that explores the subject in depth or compares & connects multiple topics. Article Book Review Please share your thoughts on history books you have read. We love to recommend books. Book Review Timeline A very short timeline entry of a sentence or two that will be displayed next to definitions. Timeline Event Video A video can convey information like no other medium can. Why not embed a YouTube video? Video Web Link Do you know a great website on history that is relevant to our content? We're happy to link to it. Web Link 3D Image 3D images can show an object from all angles like no other medium. We accept images hosted on Sketchfab. 3D Image"
