["https://worldhistory.org/collection/295/a-gallery-of-40-portrait-paintings-through-history"]
title = "A Gallery of 40 Portrait Paintings Through History (Image Gallery) - World History Encyclopedia"
description = "Capturing in paint for all time the faces of particular people has been an endeavour of artists for millennia. In this gallery, we present in chronological sequence a series of 40 portraits, from antiquity..."
full_description = "Capturing in paint for all time the faces of particular people has been an endeavour of artists for millennia. In this gallery, we present in chronological sequence a series of 40 portraits, from antiquity to modern times, a sequence which illustrates how portraiture has evolved over time, moving from idealised to more realistic and then to more abstract representations. Throughout the sequence it can be noted that subjects are often keen to be portrayed with particular clothing, objects, and background scenes as they sought to give the viewer an impression of their status, achievements, or affiliations. From Pompeii to Picasso, portraits help us connect with figures from the past, not only allowing us to see their physical attributes but also giving us an opportunity to ponder why certain imagery has been used by the artist to present an often detailed but subtle commentary on the sitter. I should like to do portraits which will appear as revelations to people in a hundred years' time. In other words, I am not trying to achieve this by photographic likeness but by rendering our impassioned expressions by using our modern knowledge and appreciation of colour as a means of rendering and exalting character. Vincent van Gogh"
author = "Mark Cartwright"
year_published = 2025
clearnet = "https://worldhistory.org/collection/295/a-gallery-of-40-portrait-paintings-through-history"
