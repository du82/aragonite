["https://worldhistory.org/article/2652/a-soldier-recalls-the-trail-of-tears-john-g-burnet"]
title = "A Soldier Recalls the Trail of Tears: John G. Burnett Account - World History Encyclopedia"
description = "John G. Burnett (b. 11 December 1810) was a private in the US Army in 1838 when he was ordered to act as interpreter between US officials and the Cherokee during the forced removal of Native Americans..."
full_description = '''John G. Burnett (b. 11 December 1810) was a private in the US Army in 1838 when he was ordered to act as interpreter between US officials and the Cherokee during the forced removal of Native Americans now known as the Trail of Tears. On his 80th birthday, Burnett wrote a letter to his children describing his experiences. Walkway map at the Cherokee Removal Memorial ParkIt's Only Make Believe (CC BY-SA) {"@context":"https://schema.org","@id":"https://www.worldhistory.org/image/20079/walkway-map-at-the-cherokee-removal-memorial-park/#imageobject","@type":"ImageObject","acquireLicensePage":"https://www.worldhistory.org/image/20079/walkway-map-at-the-cherokee-removal-memorial-park/","caption":"Walkway map at the Cherokee Removal Park, Meigs County, Tennessee, USA, depicting the routes of the Cherokee on the Trail of Tears. ","contentUrl":"https://www.worldhistory.org/uploads/images/20079.jpeg","copyrightNotice":"It's Only Make Believe - CC BY-SA - This license lets others remix, tweak, and build upon a work even for commercial reasons, as long as they credit the author and license their new creations under the identical terms. When republishing on the web a hyperlink back to the original content source URL must be included.","creator":{"@type":"Person","name":"It's Only Make Believe"},"creditText":"It's Only Make Believe / Wikipedia","dateModified":"2025-02-25T08:31:39+0000","datePublished":"2025-02-25T08:31:37+0000","encodingFormat":"image/jpeg","headline":"Walkway map at the Cherokee Removal Memorial Park","height":1440,"isAccessibleForFree":true,"isBasedOn":{"@type":"CreativeWork","url":"https://commons.wikimedia.org/wiki/File:Cherokee_Removal_Map.jpg"},"isFamilyFriendly":true,"isPartOf":"https://www.worldhistory.org#website","license":"https://creativecommons.org/licenses/by-sa/4.0","mainEntityOfPage":"https://www.worldhistory.org/image/20079/walkway-map-at-the-cherokee-removal-memorial-park/","publisher":"https://www.worldhistory.org#organization","representativeOfPage":true,"url":"https://www.worldhistory.org/image/20079/walkway-map-at-the-cherokee-removal-memorial-park/","width":1920} The Trail of Tears was a series of forced relocations of the "Five Civilized Tribes" – the Choctaw, Seminole, Muscogee Creek, Chickasaw, and Cherokee – between 1831 and 1850. Burnett's account has become a primary source on the Cherokee eviction of 1838, even though some scholars and historians discount it as self-serving or inaccurate. Scholar John Ehle, for example, comments: Remove Ads Advertisement A romantic concept of Indians evolved in the years following their removal from the Southeast. The Cherokee were generally pictured as living peacefully in their mountain home – though fewer than one in five lived in mountain areas; their possession of black slaves was omitted from such portrayals, their shamans were exonerated; their propensity for warfare was replaced with peaceful coexistence with Creek, Choctaw, Chickasaw, and the rest…During this period, to be a white man and to have taken part in the Indian wars became reprehensible and apologies and excuses were made by the veterans of Indian wars added to the embellishments. For instance, a letter often quoted as accurately describing the events of Cherokee removal in 1838 and 1839 was written in 1890, fifty years later, by a veteran of the United States Cavalry, John G. Burnett, who on his eightieth birthday sought to assure his grandchildren of his own purity of past actions. (393) Ehle, however, offers no evidence that Burnett's account is inaccurate, and, in fact, the Burnett account seems to be supported by Native American reports of the event, including that of the Cherokee woman Wahnenauhi who, according to Digital History, sent her account to the US Bureau of Indian Affairs: YouTube Follow us on YouTube! Perish or remove! It might be – remove and perish! A long journey through the wilderness – could the little ones endure? And how about the sick? The old people and infirm, could they possibly endure the long tedious journey? Should they leave? This had been the home of their ancestors from time out of mind. Everything they held dear on earth was here, must they leave? The graves of their kindred forsaken would be desecrated by the hand of the White Man. The very air seemed filled with an undercurrent of inexpressible sadness and regret… Remove Ads Advertisement Some of the Cherokee remained in their homes and determined not to leave. For these, soldiers were sent by Georgia, and they were gathered up and driven, at the point of the bayonet, into camp with the others. They were not allowed to take any of their household stuff, but were compelled to leave as they were, with only the clothes which they had on. One old, very old, man asked the soldiers to allow him to pray one more time, with his family, in the dear old home, before he left it forever. The answer was, with a brutal oath, "No! No time for prayers. Go!" at the same time giving him a rude push toward the door. Indians were evicted, the whites entered, taking full possession of everything left. (Digital History, 1) The accounts of Wahnenauhi and Burnett are understood as accurate because they are supported by the reports of others who experienced the same event or similar actions of the US government in the removal of Native Americans, whether the Navajo Long Walk of 1863-1866, the removal of the Cheyenne, Sioux, the Modoc, or the many, many others whose lands were taken by Euro-Americans with little, or no, compensation. Remove Ads Advertisement Text The following is taken from the site Anchor: A North Carolina History Online Resource; Primary Source: A Soldier Recalls the Trail of Tears: Children: This is my birthday, December 11, 1890, I am eighty years old today. I was born at Kings Iron Works in Sullivan County, Tennessee, December the 11th, 1810. I grew into manhood fishing in Beaver Creek and roaming through the forest hunting the deer and the wild boar and the timber wolf. Often spending weeks at a time in the solitary wilderness with no companions but my rifle, hunting knife, and a small hatchet that I carried in my belt in all of my wilderness wanderings. On these long hunting trips, I met and became acquainted with many of the Cherokee Indians, hunting with them by day and sleeping around their campfires by night. I learned to speak their language, and they taught me the arts of trailing and building traps and snares. On one of my long hunts in the fall of 1829, I found a young Cherokee who had been shot by a roving band of hunters and who had eluded his pursuers and concealed himself under a shelving rock. Weak from loss of blood, the poor creature was unable to walk and almost famished for water. I carried him to a spring, bathed and bandaged the bullet wound, and built a shelter out of bark peeled from a dead chestnut tree. I nursed and protected him feeding him on chestnuts and toasted deer meat. When he was able to travel, I accompanied him to the home of his people and remained so long that I was given up for lost. By this time, I had become an expert rifleman and fairly good archer and a good trapper and spent most of my time in the forest in quest of game. Remove Ads Advertisement The removal of Cherokee Indians from their lifelong homes in the year of 1838 found me a young man in the prime of life and a Private soldier in the American Army. Being acquainted with many of the Indians and able to fluently speak their language, I was sent as interpreter into the Smoky Mountain Country in May 1838 and witnessed the execution of the most brutal order in the History of American Warfare. I saw the helpless Cherokees arrested and dragged from their homes and driven at the bayonet point into the stockades. And in the chill of a drizzling rain on an October morning I saw them loaded like cattle or sheep into six hundred and forty-five wagons and started toward the west. One can never forget the sadness and solemnity of that morning. Chief John Ross led in prayer and when the bugle sounded and the wagons started rolling many of the children rose to their feet and waved their little hands good-by to their mountain homes, knowing they were leaving them forever. Many of these helpless people did not have blankets and many of them had been driven from home barefooted. On the morning of November the 17th we encountered a terrific sleet and snow storm with freezing temperatures and from that day until we reached the end of the fateful journey on March the 26th, 1839, the sufferings of the Cherokees were awful. The trail of the exiles was a trail of death. They had to sleep in the wagons and on the ground without fire. And I have known as many as twenty-two of them to die in one night of pneumonia due to ill treatment, cold, and exposure. Among this number was the beautiful Christian wife of Chief John Ross. This noble hearted woman died a martyr to childhood, giving her only blanket for the protection of a sick child. She rode thinly clad through a blinding sleet and snowstorm, developed pneumonia and died in the still hours of a bleak winter night, with her head resting on Lieutenant Greggs saddle blanket. Remove Ads Advertisement I made the long journey to the west with the Cherokees and did all that a private soldier could do to alleviate their sufferings. When on guard duty at night I have many times walked my beat in my blouse in order that some sick child might have the warmth of my overcoat. I was on guard duty the night Mrs. Ross died. When relieved at midnight, I did not retire, but remained around the wagon out of sympathy for Chief Ross, and at daylight was detailed by Captain McClellan to assist in the burial like the other unfortunates who died on the way. Her unconfined body was buried in a shallow grave by the roadside far from her native home, and the sorrowing Cavalcade moved on. Being a young man, I mingled freely with the young women and girls. I have spent many pleasant hours with them when I was supposed to be under my blanket, and they have many times sung their mountain songs for me, this being all that they could do to repay my kindness. And with all my association with Indian girls from October 1829 to March 26th, 1839, I did not meet one who was a moral prostitute. They are kind and tender hearted and many of them are beautiful. The only trouble that I had with anybody on the entire journey to the west was a brutal teamster by the name of Ben McDonal, who was using his whip on an old feeble Cherokee to hasten him into the wagon. The sight of that old and nearly blind creature quivering under the lashes of a bull whip was too much for me. I attempted to stop McDonal, and it ended in a personal encounter. He lashed me across the face, the wire tip on his whip cutting a bad gash in my cheek. The little hatchet that I had carried in my hunting days was in my belt and McDonal was carried unconscious from the scene. I was placed under guard but Ensign Henry Bullock and Private Elkanah Millard had both witnessed the encounter. They gave Captain McClellan the facts and I was never brought to trial. Years later I met 2nd Lieutenant Riley and Ensign Bullock at Bristol at John Roberson's show, and Bullock jokingly reminded me that there was a case still pending against me before a court martial and wanted to know how much longer I was going to have the trial put off? McDonal finally recovered, and in the year 1851, was running a boat out of Memphis, Tennessee. The long painful journey to the west ended March 26th, 1839, with four-thousand silent graves reaching from the foothills of the Smoky Mountains to what is known as Indian territory in the West. And covetousness on the part of the white race was the cause of all that the Cherokees had to suffer. Ever since Ferdinand DeSoto made his journey through the Indian country in the year 1540, there had been a tradition of a rich gold mine somewhere in the Smoky Mountain Country, and I think the tradition was true. At a festival at Echota on Christmas night 1829, I danced and played with Indian girls who were wearing ornaments around their neck that looked like gold. In the year 1828, a little Indian boy living on Ward creek had sold a gold nugget to a white trader, and that nugget sealed the doom of the Cherokees. In a short time the country was overrun with armed brigands claiming to be government agents, who paid no attention to the rights of the Indians who were the legal possessors of the country. Crimes were committed that were a disgrace to civilization. Men were shot in cold blood, lands were confiscated. Homes were burned and the inhabitants driven out by the gold-hungry brigands. Love History? Sign up for our free weekly email newsletter! Chief Junaluska was personally acquainted with President Andrew Jackson. Junaluska had taken 500 of the flower of his Cherokee scouts and helped Jackson to win the battle of the Horse Shoe, leaving 33 of them dead on the field. And in that battle Junaluska had drove his tomahawk through the skull of a Creek warrior, when the Creek had Jackson at his mercy. Chief John Ross sent Junaluska as an envoy to plead with President Jackson for protection for his people, but Jackson's manner was cold and indifferent toward the rugged son of the forest who had saved his life. He met Junaluska, heard his plea but curtly said, "Sir, your audience is ended. There is nothing I can do for you." The doom of the Cherokee was sealed. Washington, D.C., had decreed that they must be driven West, and their lands given to the white man, and in May 1838, an army of 4000 regulars, and 3000 volunteer soldiers under command of General Winfield Scott, marched into the Indian country and wrote the blackest chapter on the pages of American history. Men working in the fields were arrested and driven to the stockades. Women were dragged from their homes by soldiers whose language they could not understand. Children were often separated from their parents and driven into the stockades with the sky for a blanket and the earth for a pillow. And often the old and infirm were prodded with bayonets to hasten them to the stockades. In one home death had come during the night. A little sad-faced child had died and was lying on a bear skin couch and some women were preparing the little body for burial. All were arrested and driven out leaving the child in the cabin. I don't know who buried the body. In another home was a frail mother, apparently a widow and three small children, one just a baby. When told that she must go, the mother gathered the children at her feet, prayed a humble prayer in her native tongue, patted the old family dog on the head, told the faithful creature good-by, with a baby strapped on her back and leading a child with each hand started on her exile. But the task was too great for that frail mother. A stroke of heart failure relieved her sufferings. She sunk and died with her baby on her back, and her other two chil'''
