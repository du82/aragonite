["https://worldhistory.org/collection/296/founding-fathers-of-the-united-states"]
title = "Founding Fathers of the United States (Collection) - World History Encyclopedia"
description = "The Founding Fathers of the United States were the leaders of the American Revolution (c. 1765-1789), who led the push for American independence from Great Britain, founded the United States, and oversaw..."
full_description = "The Founding Fathers of the United States were the leaders of the American Revolution (c. 1765-1789), who led the push for American independence from Great Britain, founded the United States, and oversaw the implementation of the US Constitution in the tumultuous years following the war. While the term 'Founding Father' can apply to many influential individuals from the American Revolutionary period, this collection looks at 15 of the most significant. It includes the men who spearheaded the initial struggle against Parliament in the 1760s, the writers of the Declaration of Independence, influential figures in the Second Continental Congress, which oversaw the course of the American Revolutionary War, as well as the first five presidents of the United States."
