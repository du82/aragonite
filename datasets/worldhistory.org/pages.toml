full_description = '''Bookshop Search through the catalogue of history books: Book Reviews We regularly review history books as well as historical fiction. We are always looking for review submissions and also maintain a list of books available for review. Sort by: Latest Reviews Top Reviews .ci_list .content_item .ci_image { max-width: 180px; height: 101px; float: left; } .ci_list .content_item { display: block; max-width: 100% !important; min-height: 90px; margin-bottom: 30px !important; border-bottom: 1px dotted #dadada; padding-bottom: 25px; margin-left: 0px !important; } .ci_list .content_item .ci_header { padding-left: 0px; } .ci_list .content_item .ci_type_name { padding-left: 30px; position: relative; } .ci_list .content_item .ci_author { position: absolute; right: 0; } .ci_list .content_item .ci_preview { padding-left: 0px; } .ci_list .content_item .ci_preview_content { padding-left: 200px; } .ci_list .content_item:last-child { border-bottom: none !important; } #ci_content_list { margin-top: 40px; border-top: 1px dotted #dadada; padding-top: 5px; } @media (max-width: 768px) { .ci_list .content_item .ci_image { max-width: 100%; height: auto; float: none; } .ci_list .ci_author { display: none; } .ci_list .content_item .ci_preview_content { padding-left: 0px; } #ci_content_list { border-top: 1px dotted #dadada; padding-top: 5px; max-width: 360px; margin: 40px auto 0px auto; } } Book Review ★ ★ ★ ★ ★ by Zhihui Zou Ninetails: Nine Tales The nine-tailed fox, one of the most iconic folklore creatures in traditional Chinese mythology, often carries a derogatory connotation, as it has been historically used as an icon referring to sexually active or seductive women who would... Book Review ★ ★ ★ ★ ★ by Javíer Gordon Jamaican Art: Then and Now. Petrine Archer Straw & Kim Robinson Jamaican Art: Then and Now is a captivating exploration of Jamaica's artistic journey, offering readers an expansive look at how the island's artistic journey has evolved over the years. Co-authored by the late Petrine Archer-Straw and Kim... Book Review ★ ★ ★ ★ ★ by Evan Rothera The United States Governed by Six Hundred Thousand Despots: A True Story of Slavery; A Rediscovered Narrative, with a Full Biography Discovering forgotten or overlooked sources is always exciting. Jonathan D. S. Schroeder recently rediscovered John Swanson Jacobs’s narrative The United States Governed by Six Hundred Thousand Despots: A True Story of Slavery. Jacobs’s narrative... Book Review ★ ★ ★ ★ ★ by Philip Mathew Domitian’s Rome and the Augustan Legacy The Flavian dynasty has often been portrayed in a positive light except for its final emperor, Domitian. The legacy of Emperor Augustus, according to Marks and Mogetta, was evident during the Flavian rule of Rome. “Vespasian’s other son... Book Review ★ ★ ★ ☆ ☆ by Kimberly Anne Gone Viking III: The Holy Grail Gone Viking III: The Holy Grail by Bill Arnott is a travel writing narrative with not just insight but also quirkiness gifted by the author. General enthusiasts and armchair adventurers are its target audience. While not a traditional scholarly... Book Review ★ ★ ★ ★ ★ by Kimberly Anne Fluid Geographies: Water, Science, and Settler Colonialism in New Mexico In her groundbreaking book, Fluid Geographies: Water, Science, and Settler Colonialism in New Mexico, K. Maria D. Lane delves deeply into the battle between American legal and historical processes against traditional Indigenous knowledge... Book Review ★ ★ ★ ★ ☆ by Kimberly Anne The Queens and Royal Women of Sweden, c. 970–1330 The Queens and Royal Women of Sweden, c. 970–1330: Their Lives, Power, and Legacy by Caroline Wilhelmsson is a compelling examination of the significant royal women in Sweden during the late Viking Age and early medieval period. This textbook... Book Review ★ ★ ★ ★ ☆ by Shankar Chaudhuri The Horse: A Galloping History of Humanity Spread over 16 chapters, the author delves into how the horse played a key role across cultures and geographies changing the course of agriculture, warfare, transportation, travel, the rise and fall of empires, and even colonialism. According... Book Review ★ ★ ★ ★ ★ by Arienne King The Fall of Egypt and the Rise of Rome: A History of the Ptolemies The book is divided into three parts, each comprising several chapters. Part One deals with the Ptolemaic dynasty's foundation and the beginnings of its decline under Ptolemy IV. Part Two includes four chapters on what life was like in Ptolemaic... Book Review ★ ★ ★ ★ ☆ by Amol Saghar Reading Herzl in Beirut: The PLO Effort to Know the Enemy Reading Herzl in Beirut by Jonathan Marc Gribetz is a well-researched book that sheds light on the fascinating history of the Palestine Liberation Organization (PLO)'s Research Center and the raids on it by Israel. The present work focuses... @media (min-width: 992px) { .ci_list .content_item .ci_preview_content { padding-left: 100px; } } var wrapper_selector_prefix = '#book_reviews '; var pag = 1; var cit = "0"; var cist = ""; jsQueue(function(){ handle_related_pagination_click(); $(wrapper_selector_prefix + ".ci_rel_type").click(function() { cit = $(this).attr('rel'); $(wrapper_selector_prefix + "#ci_related_type_current_selection").html(null); $(this).clone().appendTo("#ci_related_type_current_selection"); $(wrapper_selector_prefix + ".ci_rel_type").removeClass("selected"); $(this).addClass("selected"); $(wrapper_selector_prefix + ".ci_related_content_wrapper").fadeTo(400,0.1,function() { $(wrapper_selector_prefix + ".ci_related_content_wrapper").load("/ajax/?&cit=" + cit + "&lim=10&pag=" + pag + "&ci_subtype_ids=" + cist,function() { $(wrapper_selector_prefix + ".ci_related_content_wrapper").fadeTo(400,1); handle_related_pagination_click(); }); }); }); $(wrapper_selector_prefix + '.ci_subtype_selectors .outline_button.selector').click(function() { cist = $(this).attr('data-subtype-id'); $(wrapper_selector_prefix + ".ci_subtype_selectors .outline_button.selector").removeClass("selected"); $(th