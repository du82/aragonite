["https://worrydream.com/PeekQuotes"]
title = "Peek Quotes"
full_description = '''My interest in children's education came from a talk by Marvin Minsky, then a visit to Seymour Papert's early classroom experiments with LOGO. Adding in McLuhan led to an analogy to the history of printed books, and the idea of a Dynabook metamedium: a notebook-sized wireless-networked "personal computer for children of all ages". The real printing revolution was a qualitative change in thought and argument that lagged the hardware inventions by almost two centuries. The special quality of computers is their ability to rapidly simulate arbitrary descriptions, and the real computer revolution won't happen until children can learn to read, write, argue and think in this powerful new way. We should all try to make this happen much sooner than 200 or even 20 more years! This got me started designing computer languages and authoring environments for children, and I've been at it ever since. Looking back on these experiences, I’m struck that my lifelong processes of loving ideas and reacting to them didn’t bear really interesting fruit until I encountered “The ARPA Dream” in grad school at the University of Utah. A fish on land still waves its fins, but the results are qualitatively different when the fish is put in its most suitable watery environment. This is what I call "The power of the context" or "Point of view is worth 80 IQ points". Science and engineering themselves are famous examples, but there are even more striking processes within these large disciplines. One of the greatest works of art from that fruitful period of ARPA/PARC research in the 60s and 70s was the almost invisible context and community that catalysed so many researchers to be incredibly better dreamers and thinkers. That it was a great work of art is confirmed by the world-changing results that appeared so swiftly, and almost easily. That it was almost invisible, in spite of its tremendous success, is revealed by the disheartening fact today that, as far as I'm aware, no governments and no companies do edge-of-the-art research using these principles. Of course I would like be shown that I'm wrong on this last point.'''
year_published = 2025
clearnet = "https://worrydream.com/PeekQuotes"
