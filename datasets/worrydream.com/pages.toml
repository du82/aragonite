["https://worrydream.com/DynamicPicturesMotivation"]
title = "Dynamic Pictures"
full_description = '''I believe that dynamic pictures will someday be the primary medium for visual art and visual explanations. The medium is currently in its infancy -- working in the medium is more about technological fumbling than artistic expression. The revolution cannot happen until there is a means for artists to draw dynamic pictures. This essay describes what dynamic pictures are, what dynamic drawing is, why the subject is so important, and some initial project ideas. If any of this inspires you to play around with these concepts, I'd love to see what you come up with. Dynamic means that the picture changes when you change some input. A dynamic picture looks different in different situations. These are some instances of a single dynamic image. I didn't draw these images individually -- I made a "master" image, and then varied parameters. (Click to vary some randomly.) This is an interactive picture. Try dragging or flicking. A dynamic picture can be interactive, but it doesn't necessarily have to be. Most pictures that you see today, in books and on websites, are static pictures -- one-offs, unable to adapt to their surroundings, unable to reflect new ideas or information, unable to respond to the viewer's needs and interests. In general, today's dynamic pictures tend to be confined to niche applications, exhibit a relatively low level of artistic sophistication, and emphasize technology over artistic expression (more focus on the medium than the message). These are symptoms of an art form in its infancy. Drawing means that the artist creates the picture by directly manipulating the picture itself, instead of working with some indirect representation that doesn't resemble the art-in-progress. Next to each picture below, I've placed a screenshot of the canvas that the artist typically works in: Do you see the things that are not like the other things? In the first two examples, the artist works directly with the picture on the canvas. These pictures can be drawn, but they're not dynamic. In the last two examples, the canvas consists of pages of abstract text, and the artist has to maintain an intricate mental mapping between text and picture. These pictures are dynamic, but can't be drawn.'''
