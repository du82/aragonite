["https://worrydream.com/KillMath"]
title = "Kill Math"
full_description = '''The power to understand and predict the quantities of the world should not be restricted to those with a freakish knack for manipulating abstract symbols. When most people speak of Math, what they have in mind is more its mechanism than its essence. This "Math" consists of assigning meaning to a set of symbols, blindly shuffling around these symbols according to arcane rules, and then interpreting a meaning from the shuffled result. The process is not unlike casting lots. This mechanism of math evolved for a reason: it was the most efficient means of modeling quantitative systems given the constraints of pencil and paper. Unfortunately, most people are not comfortable with bundling up meaning into abstract symbols and making them dance. Thus, the power of math beyond arithmetic is generally reserved for a clergy of scientists and engineers (many of whom struggle with symbolic abstractions more than they'll actually admit). We are no longer constrained by pencil and paper. The symbolic shuffle should no longer be taken for granted as the fundamental mechanism for understanding quantity and change. Math needs a new interface. Kill Math is my umbrella project for techniques that enable people to model and solve meaningful problems of quantity using concrete representations and intuition-guided exploration. In the long term, I hope to develop a widely-usable, insight-generating alternative to symbolic math. My plan is to collect a number of meaningful problems across different application areas and areas of mathematics, and for each one, design a means of solving it that is line with the philosophy here, and compare the benefits of this solution to the benefits of a conventional solution. The techniques and design patterns that emerge during this process will, hopefully, inform a more general framework in the long term. As always, if you're playing with ideas along similar lines, I'd love to see what you've come up with. The ability to understand and predict the quantities of the world is a source of great power. Currently, that power is restricted to the tiny subset of people comfortable with manipulating abstract symbols.'''
year_published = 2025
