["https://worrydream.com/Alesis"]
title = "Alesis"
full_description = '''Mу first commercial project was to create the sound synthesis engine for this pro-quality "virtual analog" keyboard. "If I didn't know it was an analog modeling synth... I'd swear I was possible hearing a real analog synth." -- Sweetwater reviewer (highest possible praise) Most synths focus on sound. I focused on music -- making it easy and fun to create musical phrases and drum beats, mash them together, and play around. "It is is an amazing synth and I don't know what l'd do without it .." "One of my most loved synths, ever. The best synth I've ever bought, no question." "For the price, I don't think anything else comes close to it." "This is the best VA made to this day, no question," "It blows my mind what it is that I'm capable of doing with it." "Very cleverly designed... Incredible value. Sounds GREAT and affordable. FUN is back for me. I'd like to tell the designers how great of a job they did. I love this keyboard." "Oh yes, this machine is the VERY BEST In VA synth history... Thank you, Alesis, for makin' the greatest synth of the 21st century!" "I love this synth My new secret weapon!" "This thing blows me away!" "Really pretty Ingenious. I really liked everything about it..." "It has a great interface, much better than any mini synth l've used. Alesis really impresses me, both with the Ion and the Micron, in that they have ingenious designs." "For the price, this synth is untouchable." I created the sound engine for this multi-synth workstation. it features ultra-high polyphony sample playback, 100% alias-free analog modeling, and freely-routable FM. "Premium sound quality." "Deadly analog modeling section." "Stratospheric polyphony ceiling." -- Keyboard Magazine'''
