["https://worrydream.com/HowManyHouseholds"]
title = "How Many Households"
full_description = '''This page presents a brief critique and fully-working redesign of a recent New York Times interactive graphic. The redesign emphasizes showing and comparing the data, and exploring the data through simple, powerful interactions. The New York Times recently published an interactive graphic for exploring different types of American households. Go check it out. Play with the above graphic to understand how it makes answering these questions, and questions like them, tedious or impossible. The essence of data graphics is visual comparisons. In the graphic above, the data is not visual, and can't be compared. The data can't be compared because, of the millions of numbers in this dataset, only one is displayed at any given time. To switch out the number shown through this peephole, the reader must interact. In this case, through a particularly convoluted navigation scheme, with no clear information hierarchy, peek-a-boo menus that appear and disappear, and "actions at a distance" — clicking the menu causes a far-away image to change, and clicking the image causes the menu to change. But the confused navigation scheme is not the primary problem. The problem is that significant navigation is required at all. The reader must interact constantly. The reader must beg the graphic for every scrap of information. The essence of data graphics is visual comparisons. An excellent graphic offers its information generously and eagerly, encouraging the reader to answer wide-ranging comparative questions at a glance. An excellent interactive graphic offers opportunities to explore the data space more precisely, to slice and filter the data, to see the data from specific perspectives. Interactivity should not be used as a barrier to information. Both the information design and the interaction design are very simple and consistent. There are bar graphs. The bar graphs show distributions of data. Clicking a bar filters the data. That's all. The graphic provides information right off the bat. Even before we first interact, we can see the distribution of primary resident types. This data can inform our interaction — we may be surprised, for example, at the small proportion of unmarried couples, and choose to learn more about these households.'''
