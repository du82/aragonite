["https://worrydream.com/AlligatorEggs"]
title = "Alligator Eggs!"
full_description = "In 2007, I met Philip Wadler at a conference, who mentioned to me that he wanted to teach lambda calculus to his eight-year-old children. I was getting into game design theory at the time, and was familiar with the school of thought that games are systems of formal rules with a layer of aesthetics. If any game can be abstracted as a formal system, I wondered if any formal system could be turned into a game. I wrote up this alligator game the next morning, basically just to amuse Phil and his kids. His daughter reportedly enjoyed drawing the alligators. Step 1: Print out this PDF onto six or so different colored sheets of paper. (Even better, photocopy it onto cardstock.) Hungry alligators are hungry. They'll eat anything that's in front of them! But they are also responsible alligators, so they guard their families. A green alligator and red alligator are guarding a green egg and a red egg. Or, you could say that the green alligator is guarding the red alligator, and the red alligator is guarding the eggs. We've got yellow, green, red alligators guarding this family. They are guarding three things: a green egg, an old alligator, and a red egg. The old alligator is guarding a yellow egg and a green egg. Notice that eggs only use the colors of the alligators guarding them. You can't have a blue egg without there being a blue alligator around to guard it. That green alligator sure is hungry. And there's a yellow family, right in front of her mouth, and it looks tasty! And so she dies, and goes off to alligator heaven. But, the story doesn't end there. Because the green alligator died, the green egg starts to hatch... Now, we're down to one family. We have a red alligator guarding a yellow alligator and a red egg, and the yellow alligator is guarding her yellow egg. But that yellow alligator sure is hungry, and there's a tasty red egg in front of her. Here we go again... Then, that alligator dies. But if she was guarding any eggs of the same color, each of those eggs hatches into what she ate."
year_published = 2025
clearnet = "https://worrydream.com/AlligatorEggs"
