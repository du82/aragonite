["https://worrydream.com/HammingForeword"]
title = "Foreword to The Art of Doing Science and Engineering"
full_description = "In 2018, I was invited to contribute a foreword to the Stripe Press edition of one of my favorite books, The Art of Doing Science and Engineering by Richard Hamming. Like many electrical engineers, I grew up in a world shaped by Richard Hamming. My graduate thesis was based on coding theory; my early career on digital filters and numerical methods. I loved these subjects, took them for granted, and had no idea how they came to be. I got my first hint upon encountering “You and Your Research,” Hamming’s electrifying sermon on why some scientists do great work, why most don’t, why he did, and why you should too. Most thrilling was Hamming’s vivid image of greatness, and its unapologetic pursuit. Not only was it allowable to aim for greatness, it was cowardly not to. It was the most inspirational thing I’d ever read. The Art of Doing Science and Engineering is the full, beautiful expression of what “You and Your Research” sketched in outline. In this delightfully earnest parody of a textbook, chapters on “Digital Filters” and “Error-Correcting Codes” do not, in fact, teach those things at all, but rather exist to teach the style of thinking by which these great ideas were conceived. This is a book about thinking. One cannot talk about thinking in the abstract, at least not usefully. But one can talk about thinking about digital filters, and by studying how great scientists thought about digital filters, one learns, however gradually, to think like a great scientist. Among the most remarkable attributes of Hamming’s style of thinking is its sweeping range of scale. At the micro level, we see the close, deliberate examination of everyone and everything, from the choice of complex exponentials as basis functions to the number of jokes in an after-dinner speech. Nothing is taken for granted or left unquestioned, but is picked up and turned over curiously, intently, searching for fundamentals. And then, even in the same sentence, a zoom out to the wide shot, the subject contextualized against the broad scientific landscape, a link in the long chain of history. Just as nothing is taken for granted, nothing is taken in isolation."
year_published = 2025
clearnet = "https://worrydream.com/HammingForeword"
