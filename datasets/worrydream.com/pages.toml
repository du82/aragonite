["https://worrydream.com/Links2007"]
title = "Links"
full_description = "A few of these works have had an extraordinary effect on my life or way of thinking. They get a sixth star. The Visual Display of Quantitative Information, Envisioning Information, Visual Explanations, Beautiful Evidence by Edward Tufte: The bibles of information design. Nothing comparable exists. A History of Graphic Design by Philip Meggs: History is the best distinguisher of fashion from fundamentals. Logic & Design in Art, Science, & Mathematics by Krome Barratt: A bizarre and fascinating tour de force of analytic design. Understanding Comics, Reinventing Comics, Making Comics by Scott McCloud: The pedagogical potential of the comic form is vast and mostly untapped. Rules of Play by Salen and Zimmerman: The game design textbook. A comprehensive and insightful analysis of interactive design. Structure and Interpretation of Computer Programs by Abelson and Sussman: The essence of software engineering. The Little Schemer by Friedman and Felleisen: How to think recursively. One of the most unique and effective pedagogic books ever written. I've worked with fifteen or so programming languages over the years, and my tastes have changed a lot. I'm currently fond of these beautifully-designed languages: Reforming the Mathematical Language of Physics by David Hestenes: The geometric structure of abstract nonsense. Nonlinear Dynamics and Chaos by Steven Strogatz: Pictures, examples, geometric intuition. Greatest textbook ever. And Suddenly the Inventor Appeared by Genrich Altshuller: A delightfully insane introduction to systematic invention. The Structure of Scientific Revolutions by Thomas Kuhn: This is how the world changes: with a bang, not a whimper."
