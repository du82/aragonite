["https://worrydream.com/Engelbart"]
title = "A few words on Doug Engelbart"
full_description = '''Doug Engelbart died today. His work has always been very difficult for writers to interpret and explain. Technology writers, in particular, tend to miss the point miserably, because they see everything as a technology problem. Engelbart devoted his life to a human problem, with technology falling out as part of a solution. When I read tech writers' interviews with Engelbart, I imagine these writers interviewing George Orwell, asking in-depth probing questions about his typewriter. Here's the most facile interpretation of Engelbart, splendidly exhibited by this New York Times headline: This is as if you found the person who invented writing, and credited them for inventing the pencil. (This analogy may be more apt than any of us are comfortable with.) His system, called NLS, showed actual instances of, or precursors to, hypertext, shared screen collaboration, multiple windows, on-screen video teleconferencing, and the mouse as an input device. Engelbart had an intent, a goal, a mission. He stated it clearly and in depth. He intended to augment human intellect. He intended to boost collective intelligence and enable knowledge workers to think in powerful new ways, to collectively solve urgent global problems. The problem with saying that Engelbart "invented hypertext", or "invented video conferencing", is that you are attempting to make sense of the past using references to the present. "Hypertext" is a word that has a particular meaning for us today. By saying that Engelbart invented hypertext, you ascribe that meaning to Engelbart's work. Almost any time you interpret the past as "the present, but cruder", you end up missing the point. But in the case of Engelbart, you miss the point in spectacular fashion. Our hypertext is not the same as Engelbart's hypertext, because it does not serve the same purpose. Our video conferencing is not the same as Engelbart's video conferencing, because it does not serve the same purpose. They may look similar superficially, but they have different meanings. They are homophones, if you will.'''
year_published = 2025
clearnet = "https://worrydream.com/Engelbart"
tags = ["doug", "engelbart", "words"]
