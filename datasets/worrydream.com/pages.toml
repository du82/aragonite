["https://worrydream.com/ScrubbingCalculator"]
title = "Scrubbing Calculator"
full_description = '''This page presents an idea for exploring practical algebraic problems without using symbolic variables. I call this tool a "scrubbing calculator", because you solve problems by interactively scrubbing over numbers until you're happy with the results. Background: This work assumes a Soulver-like environment for interactive arithmetic, and picks up where Soulver leaves off. If you haven't seen Soulver, go see it. You'll be glad you did. I recently designed a series of data graphics for a book. When mocking up the bar charts in Photoshop, I had to calculate how tall to make the bars so they would fill the available space. I had chosen heights for the top margin, bottom margin, and gap between the bars, and I needed to know the height of the bars themselves. A conventional approach to this problem is to write out an equation: What happened here? I typed out the expression for the total height, making a guess at the bar height. (As I typed, the tool automatically calculated the total, ignoring the words.) I saw my guess was too large (the total was more than 768), so I adjusted the bar height until the total was about right. I couldn't get it exactly right because it wouldn't divide evenly, so I added a little extra to the top margin to make everything work out. Notice that no algebra-style variables were used. Nor were any algebraic manipulation techniques — in a problem that is entirely about addition and multiplication, I didn't need to introduce any artificial subtraction or division. This technique of guessing the answer and adjusting until close enough mirrors how I tend to solve problems like this in my head. To me, it feels more natural than inverting the equation. A friend and I recently embarked on a multi-week cross-continental adventure. We assumed we would split the expenses after the trip, so sometimes he paid for things, and sometimes I did. When we tallied it up, he had spent $2910 and I had spent $426. I had to figure out how much to reimburse him. This is a simple problem, but it's not obvious. It typically would require either writing out and solving an equation:'''
year_published = 2025
