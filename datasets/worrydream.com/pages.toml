["https://worrydream.com/MediaForThinkingTheUnthinkable"]
title = "Media for Thinking the Unthinkable"
full_description = '''Media for Thinkingthe Unthinkable Designing a new medium for science and engineering Bret Victor / April 2013 Presented at the MIT Media Lab on April 4, 2013. For more information on the context behind this talk, seeAn Ill-Advised Personal Note about "Media for Thinking the Unthinkable". About this page — I publish talks because this work is best conveyed through live demos —show-and-tell — and the "talk" is a medium that supports that. But a talk is a poor knowledge-container. It's opaque. The viewer can't skim, browse, or get a gist at a glance. Ideas can't be looked up as needed; they feel fleeting. The medium works well for entertainment — watch and enjoy — but not for a toolbox. This page is an attempt to "explode" a demo-driven talk into a skimmable, browsable, gistable form, where individual ideas can be quickly referenced later. Coming at the problem from the other direction — a well-designed paper can be skimmed and referenced, but typically can't show and tell. For an attempt to incorporate live demos into prose, see Learnable Programming.'''
