["https://worrydream.com/MediaForThinkingTheUnthinkable/note.html"]
title = 'An Ill-Advised Personal Note about "Media for Thinking the Unthinkable"'
full_description = '''The talk I released today is called "Media for Thinking the Unthinkable". It's the most personal talk I've given, in that it was driven by my own motivations as opposed to someone else's. Every talk is for an audience, and it's the speaker's responsibility to say what the audience needs to hear. "Inventing on Principle" was given to a roomful of software engineering students, and I spoke about things that I hoped would resonate with software engineering students. Likewise when speaking to people involved with computer art tools, or with data visualization tools. I certainly believe in the ideas presented, but the intent is always to influence a particular set of people with a particular set of interests. This can, understandably, mislead people about my own interests, or my "field". I can be goaded into writing about programming, but that doesn't mean that "programming" is what I consider myself to be working on. It might just mean that I'm easily goaded. (Well, what it really means is that a software system is an instance of a more general class of systems, so it's possible to write about "programming" using ideas that aren't actually specific to programming.) I've seen some people refer to "Inventing on Principle" as my "manifesto", which is understandable, but untrue. If you were to ask me for a personal manifesto, I'd probably have to point you to "Up and Down the Ladder of Abstraction". It uses a programming example, but it's not about programming. It's about a way of thinking. In particular -- a way of using representations to think powerfully about systems. Today's talk doesn't overlap much with "Ladder of Abstraction", but it's about the same thing -- using representations to think powerfully about systems. And especially (although I only dare to explicitly mention this in passing), using representations to develop a guiding intuition. Which is the sort of squishy-feely intangible mumbo-jumbo that you can't get away with unless you're George Polya, but fuck it, someone out there needs to hear it.'''
year_published = 2025
clearnet = "https://worrydream.com/MediaForThinkingTheUnthinkable/note.html"
tags = ['"media', "ill-advised", "note", "personal", "thinking", 'unthinkable"']
