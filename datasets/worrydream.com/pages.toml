["https://worrydream.com/Links2013"]
title = "Links 2013"
full_description = "Bret Victor It’s the end of 2013, and here’s what Bret fell in love with this year I’m trying to build a jigsaw puzzle. I wish I could show you what it will be, but the picture isn’t on the box. But I can show you some of the pieces that snapped into place this year, and try to share a context for why they mattered so much to me. If you are building a different puzzle, it's possible these pieces won't mean much to you. You might not have a spot for them to fit, or you might not yet. On the other hand, maybe some of these are just the pieces you’ve been looking for. These are mostly about powerful seeing, and powerful representations for scientific thinking. Reading Tip #1 It’s tempting to judge what you read: I agree with these statements, and I disagree with those. However, a great thinker who has spent decades on an unusual line of thought cannot induce their context into your head in a few pages. It’s almost certainly the case that you don’t fully understand their statements. Instead, you can say: I have now learned that there exists a worldview in which all of these statements are consistent. And if it feels worthwhile, you can make a genuine effort to understand that entire worldview. You don't have to adopt it. Just make it available to yourself, so you can make connections to it when it's needed. Bruno Latour Visualization and Cognition: Drawing Things Together (1986) If scientists were looking at nature, at economies, at stars, at organs, they would not see anything... Scientists start seeing something once they stop looking at nature and look exclusively and obsessively at prints and flat inscriptions... People before science and outside laboratories certainly use their eyes, but not in this way. They look at the spectacle of the world, but not at this new type of image designed to transport the objects of the world, to accumulate them in Holland, to label them with captions and legends, to combine them at will. Bret Victor This was the most astonishing thing I read this year. Like Mindstorms, I had to give up on extracting key quotes because I found myself transcribing the entire paper. Latour's theory of what makes for powerful scientific representations (and what it means to be scientifically powerful) was very unexpected, and feels tremendously valuable. Thanks to Clint Heyer for suggesting this. Andrea diSessa Knowledge in Pieces (1988) [Naive] physics is a fragmented collection of ideas, loosely connected and reinforcing, having none of the commitment or systematicity that one attributes to [scientific] theories... [Galileo] saw clearly the need to find a way to extend his analysis beyond the initial context that suggested it, in order to test and develop the notion into a genuine theory.... The [naive] thinker does not develop sophisticated arguments to extend the scope of a notion, neither does he even feel the need to talk about tossing and dropping in uniform terms... [He is] used to dealing with the world on a catch-as-catch-can basis, where it is quite fair to change tactics whenever the problem is minutely varied. Bret Victor What is the difference between scientific and non-scientific thinking? Thinking within a consistent theory versus thinking haphazardly? I'm crucially interested in the problem of representing theory such that intuitions are fruitful and theoretically sound, and representations suggest analogies that stay true to the theory. That's not diSessa's problem, but I feel that his viewpoint has some powerful clues. Thanks to Cassandra Xia and Mitch Resnick for suggesting this. Douglas Hofstadter Analogy as the Core of Cognition (2001) I believe that all communication is via analogy. Indeed, I would describe communication this way: taking an intricate dance that can be danced in one and only one medium, and then, despite the intimacy of the marriage of that dance to that medium, making a radically new dance that is intimately married to a radically different medium, and in just the same way as the first dance was to its medium... Imagine taking the most enthralling basketball game you ever watched... and giving a videotape of that game to a “soccer choreographer,” who will now stage all the details of an artificial soccer game that is in some sense analogous to your basketball game. Bret Victor Or watch the talk, or skim the book. Hofstadter says that all thinking runs on analogy-making. Sounds good to me! If he's even partially correct, then it seems to me that a medium for powerful thinking needs to be a medium for seeing powerful analogies. And a medium for powerful communication needs to be designed around inducing the dance he's talking about up there. I'm especially drawn to George Polya's cartography of analogizing. Sherry Turkle Simulation and its Discontents (2009) In the 1980s at MIT, many early users of simulation genuinely could not imagine such things as designing without drawing, or thinking without a “back of the envelope” calculation. Those who had grown up accustomed to physically taking apart their laboratory instruments were upset by programs whose inner workings they did not understand. In response to simulation's provocations, faculty and students identified areas that they hoped to keep as simulation-free zones. Architects wanted to protect drawing, which they saw as central to the artistry and ownership of design. Civil engineers wanted to keep software away from the analysis of structure; they worried it might blind engineers to crucial sources of error and uncertainty. Physicists were passionate about the distinction between experiment and demonstration... In the past twenty years, researchers have gone from using simulation for discrete tactical purposes to working almost full-time in simulation... An older generation feels compromised by simulations that are essentially “black boxes”; using them seems an abdication of professional responsiblity. A younger generation is more likely to accept that computational transparency, in the sense that their elders speak of it, is a thing of the past. Bret Victor A very exciting book for me, because I see the complaints of the discontents as design challenges that can be overcome. The book contrasts the intimacy, transparency, and directness of “thinking with a pencil” to the helplessness and loss of connection inherent in black-box computational tools. I believe we can design a computational medium whose transparency and directness exceeds that of paper. It sure won't look like anything that exists today. I suppose Turkle is also responsible for turning me on to scientific ethnography in general, along with Edwin Hutchins. Thanks to the MIT Press bookstore for leaving this in the bargain bin. Kieran Egan Why education is so difficult and contentious (2001) Thinking about education during this century has almost entirely involved just three ideas—socialization, Plato's academic idea, and Rousseau's developmental idea... The combination of these ideas governs what we do in schools, and what we do to children in the name of education. Our problems... are due to these three ideas each being fatally flawed and being also incompatible with one other. Bret Victor Also see his talk. If you're going to design a system for education, it might help to understand the purpose of education in the first place. Egan points out how modern education is implicitly driven by a cargo-culty mish-mash of three lofty but mutually-incompatible goals. Good luck with that! I'm really happy to have discovered Kieran Egan this year. Also check out his delightfully audacious Learning in Depth project (video, website). Found via a reference in a paper by Jonathan Borwein. Terry Cavanagh Naya's Quest (2013) Bret Victor A game about learning to see, when all you have are ambiguous representations. Extraordinary, beautiful, amazing. Stewart Brand Clock Of The Long Now: Time And Responsibility (2000) How do we make long-term thinking automatic and common instead of difficult and rare? How do we make the taking of long-term responsibility inevitable? ... Clock/Library is an extravagant project. The more over-the-top it is, the better it works. If it wants to compete for iconic power with the mushroom cloud and the photos of Earth from space, it has to match their vaulting ambition. (Let's split the atom! Let's leave Earth!) The great time-spanning precedent is the pyramids of Giza. Their massive monumentality defined when “history” began. They are a stabilizer, a frame of reference, for any culture that cares to care about them. The pyramids also demonstrate the power of folly. You can't argue with them because they're not rational. The ambition and folly of the Clock/Library is to reframe human endeavor, and to do so not with a thesis but with a thing. All this thing can do is give permission to think long term. If it succeeds in that, the rest may follow. Bret Victor Stewart Brand is an incredible human being, and it's a privilege to share a planet with him. The “Long Now” message of long-term responsibility has resonated with me for years, but it wasn't until I read this book that I finally “got” the clock project. Julian Jaynes The Origin of Consciousness in the Breakdown of the Bicameral Mind (1977) The characters of the Iliad do not sit down and think out what to do. They have no conscious minds such as we say we have, and certainly no introspections. It is impossible for us with our subjectivity to appreciate what it was like. When Agamemnon, king of men, robs Achilles of his mistress, it is a god that grasps Achilles by his yellow hair and warns him not to strike Agamemnon. It is a god who then rises out of the gray sea and consoles him in his tears of wrath on the beach by his black ships, a god who leads the armies into battle, who speaks to each soldier at the turning points, who debates and teaches Hector what he must do. Bret Victor The freakiest thing I've read in years. Jaynes's thesis is that, until relatively recently, human beings had no sense of self, could not introspect, and made decisions by schizophrenically hallucinating voices of the gods. Muses literally sang! (The link is to an excellent summary by Erik Weijers; the book is here.) See also Snow Crash?? Thanks to John Mawhorter for mentioning this. David Hestenes David Hestenes An Interview with David Hestenes (2012) My father gave me the greatest compliment of my life... “You have learned the difference between a mathematical idea and its representation by symbols. Many mathematicians never learn that!”... What you understand about science depends critically on your facility with conceptual tools, representational tools, and mathematical tools. For example, if you had to do all of your calculations with roman numerals, you wouldn’t do very well, okay? Indeed, the whole history of mathematics can be understood as invention and application of better and better conceptual and mathematical tools. Bret Victor I don’t have the words to express how much I admire and value David Hestenes. The theme of his physics work -- both the language he designed and the physical theories he's created with it -- is that you can picture what’s going on. I expect that future generations will place him with Leibnitz and Heaviside, as one whose language dramatically expanded science's thinkable territory. I link to his modeling work below, because that's what I got into this year, but if you are interested in his language, Imaginary Numbers Aren't Real is what originally got me hooked, and also see Reforming the Mathematical Language of Physics. Unfortunately, there isn't yet a good (visual) (interactive?) introduction. David Hestenes Notes for a Modeling Theory of Science, Cognition and Instruction (2006) To the grand philosophical question: “What is man?” Aristotle answered: “Man is a rational animal.” Modeling Theory offers a new answer: “Man is a modeling animal!” Homo modelus! Bret Victor I read this some years ago, but I wasn't ready for it, and it didn't take. Reading it this year, after having struggled to clarify many of the systemic and cognitive concepts that the paper defines, I felt like I had stumbled upon All The Answers To Everything. See also his earlier, more pedagogically-oriented paper Toward a modeling theory of physics instruction, as well as the Modeling Games paper below. David Hestenes Modeling Games in the Newtonian World (1991) The great game of science is modeling the real world, and each scientific theory lays down a system of rules for playing the game... It is widely believed that Newton's Laws are inherent in the Physical World, just waiting to be discovered, like Columbus discovered America. On the contrary, as Einstein repeatedly emphasized, the laws of physics are “free creations of the human mind”... Newton's Laws were invented to describe certain regularities in the motions of real objects. These regularities are, indeed, inherent in nature, but they could not be discovered without the invention of adequate concepts to describe them... [Thomas Kuhn's] Normal Science plays the great modeling games strictly according to the rules. Revolutionary Science produces new games by revising the rules. What happens to mavericks who don't want to play by the rules? Usually, they lose! They are ignored by their colleagues. History shows that winning by changing the rules is rare and achieved only by individuals who have mastered play by conventional rules. Evidently, only true masters can see where the rules fail. Bret Victor Hestenes is beautifully and valuably clear here about the distinction between the Conceptual World (invented models) and the Physical World. And representing the axioms of a theory as a game board, pieces, and legal moves is delightful. Linked below, both Carver Mead and Alan Kay also orbit around the model vs reality theme. And a particularly incisive perspective on this distinction is in E.T. Jaynes's wonderful paper Clearing Up Mysteries. Carver Mead Reading Tip #2 Carver Mead describes a physical theory in which atoms exchange energy by resonating with each other. Before the energy transaction can happen, the two atoms must be phase-matched, oscillating in almost perfect synchrony with each other. I sometimes think about resonant transactions as a metaphor for getting something out of a piece of writing. Before the material can resonate, before energy can be exchanged between the author and reader, the reader must already have available a mode of vibration at the author's frequency. (This doesn't mean that the reader is already thinking the author's thought; it means the reader is capable of thinking it.) People often describe written communication in terms of transmission (the author explained the concept well, or poorly) or absorption (the reader does or doesn't have the background or skill to understand the concept). But I think of it more like a transaction -- the author and the reader must be matched with each other. The author and reader m"
