["https://worrydream.com/2022-02-27"]
title = "2022-02-27"
full_description = '''It's a reference to Don Quixote ("tilting at windmills"), along the lines of pursuing impossible dreams. Something about being trapped within the assumptions of a field or framework, taking the field or framework as a given. When I was studying design, I got the impression that the inventors of a field (the people doing work which would retroactively be categorized as initiating a field, but at the time was uncategorizable) had a very broad set of skills, concerns, and influences, whereas practitioners who joined an already-established field (and subsequently taught it) seemed to have a much narrower viewpoint and set of concerns. If we take UI design as an example: the two names most strongly associated with inventing the graphical interface are Doug Engelbart and Alan Kay. If you look at Engelbart's 1962 manifesto, you'll see it's not directly about graphical interfaces or even technology, it's about his goals for humans and humanity, and the intrinsic capabilities of the human being. Kay's Early History of Smalltalk cites a whole host of humanists as key influences, including Montessori, Piaget, Bruner, Holt, Suzuki, Dewey, and Arnheim. Both Engelbart and Kay had real engineering backgrounds (they had built working systems themselves, with their hands) as well as other fields (e.g. Kay had a molecular biology background), and they worked in active collaboration with others with diverse backgrounds in difficult fields with high standards (e.g. mathematics, physics). Both Engelbart and Kay saw their jobs as building novel compete systems from the ground up, and they saw the role of interface as giving people access to the full power of the system, which included programming, not just choosing from menus. (That is, programming and graphical interface were inseparable.) I was attracted to the range of ideas and arguments and imaginative possibilities surrounding these early workers. I'm using Engelbart and Kay as exemplars here, but there's a similar imagination on display in the work of, say, Ivan Sutherland, Randall Smith, Jef Raskin, Richard A Bolt, etc.'''
year_published = 2025
