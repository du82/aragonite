["https://worrydream.com/Electronics"]
title = "Electronics"
full_description = '''Distance between hands determines "fret". Bend a finger to pluck one of four "strings". Curl a finger to slide between notes. Modify or rebuild the machine's guts, for complete control over button pushes, coin deposits, soda dispensing, and coin returns. Applications: buy cokes on account by punching in a "password", play games, check email, buy cokes over the web... The coke machine was first hacked by Walter Brisken with Blake Jones. Contributors to my revamp included Steve Ginzburg, Jeremy Boulton, Peter Maresh, and Andy Griffin. ... and designed a full-custom VLSI graphics processor to drive it. (Supports 4-bit color depth, 16 shades of red.) But the chip didn't get fabbed, so I hooked the display to my parallel port. (Software-driven 2-bit color depth.) Later, I gutted the circuitry again to use it as the Coke Machine display. (Firmware-driven 3-bit color depth.) Microphone listens for touch tones. IR LED turns on A/C from across the room, by mimicking the remote control. I used to live at the top of a hill. The mailbox was at the bottom. Getting the mail was quite a hike. My roommates and I often wanted to know whether the mail had come, and if so, whether someone else had already grabbed it.'''
