title = "Bret Victor, struggling"
description = "An offshore drilling platform in the sea of knowledge."
full_description = "Bret Victor led the team that founded Dynamicland and invented Realtalk, the world‘s only self-hosted spatial computing system. Previously at Apple, he designed the earliest user interface concepts for the iPad and several other new hardware platforms. His work established Apple’s internal future-interfaces prototyping group, whose inventions have shipped in billions of Apple products. His later public-domain work on next-generation programming interfaces has been viewed millions of times, and directly inspired numerous products, companies, and academic papers. His work has won the Apple Design Award twice. Computing pioneer Alan Kay has called him “one of the greatest user interface design minds in the world today”, and design legend Edward Tufte recognized him as a “design theory wizard, at the cutting edge of interface designs for programming, seeing, reasoning”. I’m dedicated to making progress on a medium and culture in which all people deeply understand the real world, and each other."
