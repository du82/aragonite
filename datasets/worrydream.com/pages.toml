["https://worrydream.com/DrawingDynamicVisualizationsTalkAddendum"]
title = 'Additional Notes on "Drawing Dynamic Visualizations"'
full_description = '''Last week, I released a talk called Drawing Dynamic Visualizations, which shows a tool for creating data-driven graphics through direct-manipulation drawing. I expect to write a full research report at some point (at which I'll make the research prototype available as well). In the meantime, here is a quick and informal note about some aspects of the tool which were not addressed in the talk. Much of the effort in designing this tool went into designing a set of drawing actions ("primitive operations") that allows the artist to precisely and unambiguously express intent. The editor is intentionally not magical, and does not "guess" what the artist is intending to do. By contrast, many drawing programs will guess how the artist is intending to align or position an object, and snap it accordingly. Here's OmniGraffle: This magic is very helpful when drawing a static picture, but would be troublesome for the tool here, where the drawing actions form a procedure which must work correctly in the general case. For example, when moving an object, the tool does not allow the artist to simply "drag the object". Instead, the artist must start dragging from a specific point on the object (shown as small blue dots). In the following example, the artist starts dragging from the top-right corner of the rect, so the rect snaps its top-right corner to the target point: This is just one example of how the set of drawing actions has been carefully designed to allow (and force) the artist to express their intent unambiguously. (See also the note at the end about "programming by example".) One place where some ambiguity was unavoidable was when multiple snap points overlap. For example, when dragging to the point below, the artist might intend to snap to the endpoint of the line, or the center of the circle, or the center of the canvas. These points happen to overlap at drawing time, but they might not always overlap in the general case (say, with different data), so it's crucial that the artist can express specifically which point is intended.'''
