["https://worrydream.com/ABriefRantOnTheFutureOfInteractionDesign/responses.html"]
title = "Responses: A Brief Rant on the Future of Interaction Design"
full_description = '''A couple days ago, I published A Brief Rant on the Future of Interaction Design. Here are a few common responses I've received, and some thoughts on them. Yes, that's why I called it a rant, not an essay — it describes a problem, not an idea. (And FWIW, that's not the sort of thing I typically publish, or want to.) The point of the rant was that the solution will be discovered through long research, and that research won't happen without an awareness of the problem. My intent was to hopefully coax a few potential researchers and funders into tangible interfaces, dynamic materials, haptics, and related fields that haven't been named yet. If that happens, then mission accomplished. In 1900, Eastman's new Kodak camera was good! The film was black-and-white, but everyone loved it anyway. It was genuinely revolutionary! But it was also obvious that something was missing, and research continued. Practical color film was released thirty years later, and gradually took over. On the other hand, despite the invention of holography 60 years ago, it was less obvious that two-dimensional single-perspective photographs are missing something important. Maybe nobody ranted enough. I would guess that 3D photography hasn't gotten much research love, given that even in 2011, we think that just re-focusing a photo is a pretty neat idea. Today, iPad good. It's flat and glassy and everyone loves it anyway. It's genuinely revolutionary. But if all we have in twenty years is an iPad with a few haptic gimmicks, that'll be bad. I asked us to aim for a "dynamic medium that we can see, feel, and manipulate". Those things aren't dynamic, so no. A computer screen is a dynamic visual medium — it can visually represent almost anything. A dynamic tactile medium should be able to tangibly represent almost anything. That might be through a descendent of deformable materials (like these), a descendent of haptic holography (like this), crazy nanobot assemblies, or probably some technology not yet conceived.'''
year_published = 2025
