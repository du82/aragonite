["https://worrydream.com/ScientificCommunicationAsSequentialArt"]
title = "Scientific Communication As Sequential Art"
full_description = '''This page presents a scientific paper that has been redesigned as a sequence of illustrations with captions. This comic-like format, with tightly-coupled pictures and prose, allows the author to depict and describe simultaneously — show and tell. It is based on Watts and Strogatz's seminal Nature paper on network theory, shown to the right. This paper was chosen because it's accessible to a broad audience, and it's very well-written — already near the limit of clarity for just prose. Try actually reading this design instead of skimming it (it's quicker than it looks!) and consider how the illustrations make abstract descriptions more concrete, and help you maintain the "picture in your head". Networks of coupled dynamical systems have been used to model biological oscillators, Josephson junction arrays, excitable media, neural networks, spatial games, genetic control networks and many other self-organizing systems. Ordinarily, the connection topology is assumed to be either completely regular or completely random. But many biological, technological and social networks lie somewhere between these two extremes. Here we explore simple models of networks that can be tuned through this middle ground: regular networks 'rewired' to introduce increasing amounts of disorder. We find that these systems can be highly clustered, like regular lattices, yet have small characteristic path lengths, like random graphs. We call them 'small-world' networks, by analogy with the small-world phenomenon (popularly known as six degrees of separation). The neural network of the worm Caenorhabditis elegans, the power grid of the western United States, and the collaboration graph of film actors are shown to be small-world networks. Models of dynamical systems with small-world coupling display enhanced signal-propagation speed, computational power, and synchronizability. In particular, infectious diseases spread more easily in small-world networks than in regular lattices. To interpolate between regular and random networks, we consider the following random rewiring procedure.'''
year_published = 2025
clearnet = "https://worrydream.com/ScientificCommunicationAsSequentialArt"
