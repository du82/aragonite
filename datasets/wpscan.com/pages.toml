-class.php","wp-content/alfacgiapi/perl.alfa","wp-content/ALFA_DATA/alfacgiapi/perl.alfa","wp-content/batm.php","wp-content/masshp.php","wp-content/alfa.php","wp-content/fw.php","wp-content/plugins/cekidot/alf.php","wp-includes/alfacgiapi/perl.alfa","wp-includes/ALFA_DATA/alfacgiapi/perl.alfa","wso1.php","wso2.8.5.php","wso.php","ww.php","www.php","mininew.php","xleet.php"] #pathlist Shell finder authors will often include a UI to make it as easy as possible to operate, and encourage new users to use it. In fact, shell finders can be found offered for free by their authors so that they can gain a large userbase and distribute the workload of crawling websites searching for backdoors that they can takeover and sell on illicit marketplaces. They operate in such marketplaces as access brokers, or selling unauthorized access to prospective buyers who quickly need a website for malicious activity like phishing. One of the more popular shell finders (Random Shell Finder) being advertised on Telegram A popular marketplace for buying and selling compromised web resources like backdoor shells Identifying Traffic from Shell Finders Because of their popularity, traffic from shell finders is fairly common as they crawl websites searching for backdoor shells to hijack. However log analysis and code analysis of shell finder tools reveal they use hard‑coded data for the requests that they send to websites when crawling, which makes it possible to accurately detect such crawling and develop signatures or rules that can be used to block such requests. The main two identifiers in the requests are below: User AgentsUser agents often contain suspicious misspellings or words that make it easy to identify the crawler. These user agents are unique enough that they are not used by legitimate traffic. Usually, more than 50% of the requests from shell finder tools will use a unique user agent similar to the list below: Mozilla/5.0 (Linux; Android 7.0; SM‑G892A Bulid/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/60.0.3112.107 Moblie Safari/537.36 Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/102.0.0.0 Safari/537.36/8mqULwuL‑67 wp_is_mobile Mozlila/5.0 (Linux; Android 7.0; SM‑G892A Bulid/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/60.0.3112.107 Moblie Safari/537.36 Referer URLsWhen the user agent is not unique enough to use as an identifier for shell finder traffic, we can use the Referer URL as it is another static identifier that is hardcoded into the shell finder tool’s code. The shell finder will use common search engine websites as the Referer URL to attempt to obfuscate their requests and possibly to bypass some access controls. google.com http://www.google.com bing.com http://www.bing.com binance.com http://www.binance.com Share this:TwitterFacebookLike Loading… Posted by Luke Get News and Tips From WPScan Type your email… Subscribe'
