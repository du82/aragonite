full_description = 'Updated on November 1, 2024November 1, 2024 Identifying Traffic from Shell Finder Bots A shell finder is a type of reconnaissance tool that is used by threat actors to identify websites that have already been compromised and contain backdoor shells. A backdoor shell is a form of malware that is added by a threat actor after gaining unauthorized access to a website. The purpose of a backdoor shell is to secretly maintain unauthorized access even after the initial vulnerability is fixed. It can be compared to a criminal breaking into a building and creating secret entry points (backdoors) that they can reuse to secretly enter the building again in the future. The attacker does not want others to know about the backdoor and so they use different techniques to make it more difficult to identify the locations of the backdoors. This is why a shell finder is used rather than just attempting to use a search engine to locate these backdoors on compromised websites. An example of a backdoor shell found on compromised websites to maintain unauthorized access A shell finder operates similarly to a website crawler, but with one major exception: it only searches for backdoor shells and compiles a list of the discovered backdoor shells. Many shell finders are written in Python and utilize a static list of known backdoor shell filenames and their most popular directories. These are added to the crafted request sent from the shell finder to websites when searching for the existence of such backdoor shells. lista = ["1337.php","xl.php","r4qxl.php","e8bgm.php","wp-god.Php","olx.php","class-wp-http-requests-hooks.php","wp-ahsera.php","user.php","ukccpnrkon.php","tebitwbejt.php","poplfqudwb.php","jtbknjjpvc.php","nilppomgwj.php","rrrzlhymub.php","ruzu6mit.php","boilxnplrr.php","wajarhdzbt.php",".dha.php","wp-admin.php","logs.php","wp-easy.php","wxo.php","wp-video.php","amigo.php","-.php",".yoi.php","wp-info.php","wp-contentt.php","i3wfj.php","5fesj.php","s46v1.php","