["https://wpscan.com/wpscan-glossary"]
title = "WPScan Glossary | WPScan"
description = "WPScan documentation includes many technical terms and phrases that many people might not be familiar with. If you get stuck, the following definitions can help. Cross-Site Request Forgery Basic: “Cross-Site Request Forgery is a type of cyber attack that tricks a website into thinking that you asked for something to happen. It can be used…"
full_description = "WPScan Glossary WPScan documentation includes many technical terms and phrases that many people might not be familiar with. If you get stuck, the following definitions can help. Cross-Site Request ForgeryBasic: “Cross‑Site Request Forgery is a type of cyber attack that tricks a website into thinking that you asked for something to happen. It can be used to steal information or do things without your permission.” Advanced: “Cross‑Site Request Forgery (CSRF) is an attack technique that exploits the trust between a web application and its users in order to execute unwanted actions on behalf of an authenticated user. CSRF attacks usually involve malicious actors using malicious code, such as HTML code or JavaScript, to construct a malicious request that is then sent through the victim’s browser. This request contains data that can be used by the attacker to perform some action on behalf of the user – such as making changes to their account settings or making purchases from their account. The fundamental concept behind a CSRF attack is that the victim unknowingly submits a malicious request to the vulnerable web application, who in turn interprets it as a legitimate one from an authenticated user. As the browser does not send credentials for authentication with each HTTP request, this type of attack takes advantage of this trust relationship between the web application and its users. This means that attackers have access to sensitive information without having to authenticate themselves, allowing them to bypass authentication protocols and steps. In order for attackers to successfully launch a CSRF attack they must first identify vulnerabilities within the target website – such as weak input validation – which they can exploit in order to modify requests made by unwitting victims. Attackers typically use social engineering methods like phishing emails and malicious links in order to deceive victims into submitting these forged requests. As CSRF attacks are based on tricking web applications into executing unauthorized actions without any knowledge of the user, they can result in serious damages when used against e‑commerce websites or other online services where users store sensitive information such as credit card numbers or personal data.”Accordion Content Authentication bypass attemptsBasic: “Authentication bypass attempts are when someone tries to get into a system without using the right password or other login information.” Advanced: “Authentication bypass attempts are malicious attacks against a system in which an attacker attempts to gain access to restricted information or resources by circumventing the authentication process. This type of attack is often directed at systems that rely on usernames and passwords for authentication, as attackers will attempt to guess or exploit known vulnerabilities in the system to gain access. Authentication bypass attempts may also be used to gain access to network systems, computer databases, or application programs. Authentication bypass attacks could involve a variety of techniques, such as exploiting weaknesses in weak passwords, guessing credentials, using brute force attacks to guess passwords, using social engineering tactics such as phishing or pretexting, using privilege escalation techniques such as exploiting known vulnerabilities in software and hardware devices or trying default account logins. These attacks can have serious consequences if successful: confidential data can be stolen from corporate systems and individuals’ personal information can also be exposed if authentication is not properly secured. As such, organizations must take steps to ensure their authentication processes are secure by implementing strong password policies and ensuring any known vulnerabilities are patched quickly. Additionally, organizations should monitor their networks for signs of unauthorized access attempts so they can take immediate action when necessary.”Accordion Content Cross-Site ScriptingBasic. Cross‑Site Scripting is when someone adds bad code to a website so that it does something it is not supposed to do. Advanced: Cross‑Site Scripting (XSS) is a form of computer security vulnerability that enables malicious attackers to inject code into web applications. It typically involves injecting malicious JavaScript, HTML or other types of client‑side code into webpages viewed by victims, allowing the attacker to execute malicious activities such as harvesting sensitive data from users or redirecting victims to malicious websites. XSS attacks can also be used to hijack user sessions and assume control of user accounts. XSS attacks are most commonly found in online forums and comments sections, but they can also be present in other areas such as contact forms, logins pages, search boxes and more. The goal of the attack is generally to gain access to confidential information stored on the website such as credit card numbers, passwords or other personal data. In order to protect against XSS attacks, developers should use input sanitization techniques when receiving user input and make sure to encode any special characters that may be included in user input prior to displaying it on a webpage. Additionally, it is important for developers to maintain an up‑to‑date version of their web application framework that includes the latest security patches and updates. Path Traversal Basic: Directory traversal (also known as file path traversal) is a web security vulnerability that allows an attacker to read arbitrary files on the server that is running an application. Advanced: Path Traversal, also known as directory traversal and sometimes referred to as ‘dot dot slash’, is a type of vulnerability that allows attackers to access restricted directories on a computer system or network. It exploits the vulnerability of an application’s inability to properly sanitize user‑supplied input and can be used to gain unauthorized access to sensitive data or files such as system configurations, source code, databases, passwords, and other sensitive information. Path Traversal attacks are typically done by inserting “../” into web addresses or other user‑supplied parameters in order to traverse back out of the current folder/directory structure. For example, if an application were vulnerable to Path Traversal it could allow an attacker to bypass restrictions by entering a URL such as http://www.example.com/restrictedfolder/../index.html which would result in the unrestricted index page being served instead of the restricted folder contents. To prevent this type of attack from occurring, developers must make sure their applications properly sanitize all user‑supplied inputs using strict validation routines that prevent users from passing unanticipated strings such as “../” in any inputs given by them.Accordion Content HardeningBasic: Hardening is a process of strengthening the security of a computer system or network to protect it from malicious activities. Advanced: Hardening is a process that strengthens the security of a computer system or network. This involves installing and configuring security measures to protect against potential attacks as well as testing the system to ensure its secure configuration. Hardening can include physical security, such as locked doors and fences around the building or server room, or it can focus on digital protection such as firewall rules, antivirus software, and patch management. Hardening also requires updating operating systems, disabling unnecessary services, applying protocol passwords for authentication, and using encryption methods for sensitive data. Hardening is an ongoing effort that must continuously be monitored and updated to keep up with ever‑changing threats from cyber criminals. A successful hardening strategy should take into account all angles of attack—from physical access control to application layer defense—and provide comprehensive protection from both external and internal threats. ModSecurity RulesBasic: ModSecurity rules are instructions that help keep websites safe from people who want to cause trouble. Advanced: ModSecurity rules are security rules designed to protect web applications and websites from malicious attacks. These rules provide an additional layer of protection in addition to the traditional firewall and antivirus software. ModSecurity rules use a combination of specialized filtering, attack detection, and blocking techniques to help protect websites from common web application attacks such as cross‑site scripting (XSS) and SQL injection. These rules can be used both on the server‑side of a website or at the network level. At the server‑side, ModSecurity rules analyze incoming requests and responses for malicious content, blocking requests that it identifies as dangerous. The rule sets also have features that allow administrators to customize them to suit their particular needs. For example, they may specify which HTTP methods are allowed on a particular page or what type of content is permitted. This can help prevent attackers from exploiting commonly used web application vulnerabilities such as remote file inclusion flaws or directory traversal issues. At the network level, ModSecurity rules can be used to detect suspicious traffic patterns and block requests associated with malicious activity. They also provide an additional layer of defense against distributed denial‑of‑service (DDoS) attacks by monitoring communication between a web server and its clients for suspicious behavior. By doing so, ModSecurity can detect attempted DDoS attacks before they succeed in causing significant disruption or damage to the system. Overall, ModSecurity’s ability to analyze both incoming requests and outgoing responses make it an effective tool for protecting web servers from malicious activity. The rulesets included with the product are highly flexible and customizable, allowing administrators to tailor them according to their specific security needs. Furthermore, using ModSecurity helps secure both websites against known attack vectors as well as helping defend against unknown threats by detecting suspicious behaviors impacting either server‑level or network‑level operations. Malware AttacksBasic: Malware attacks are when someone tries to damage a computer by sending it a virus. Advanced: Malware attacks are malicious cyber‑attacks that utilize malicious software, also known as malware, to compromise the security and privacy of a system or network. Malware is a broad category of malicious software including viruses, spyware, ransomware, trojans, worms, and other types of malicious programs designed to damage or gain unauthorized access to a system. Malware can be spread through email attachments, websites offering downloads, peer‑to‑peer file sharing networks, and more. Once downloaded on the user’s device or computer, malware can be used to steal the user’s sensitive data and login credentials; track their online activity; modify files; launch denial of service (DoS) attacks against servers; encrypt data and hold it for ransom; hijack web browsers or entire computer systems; mine cryptocurrencies without user consent; install additional malware payloads on the victim’s device; allow remote access to an infected machine; and perform many other malicious activities. To protect against these threats, users should always use strong passwords for all their accounts and regularly update them. They should also regularly scan their devices with up‑to‑date anti‑malware software as well as keep their operating system and apps updated with the latest security patches. Additionally they should avoid downloading files from untrustworthy sources such as email attachments from unknown senders or websites offering free music or movie downloads.Accordion Content BackdoorsBasic: A backdoor is a way for someone to get into your computer without using the normal security. It is like a secret window or door that only certain people know about. Advanced: Backdoors are a type of malicious software (malware) that allows an attacker to gain unauthorized access to a computer system or network. They are typically used by cybercriminals to secretly steal data, install malware, or even sabotage the system. Backdoors can be installed in a variety of ways, including through email phishing scams, malicious websites, vulnerable software, and unsecured Wi‑Fi networks. Once a backdoor is installed on a system, it can remain undetected for long periods of time and enable unauthorized access from any location. Backdoors generally consist of two components: one for the attacker and one for the target machine. The attacker’s component is typically disguised as legitimate software that provides remote access capabilities to the target machine. This type of backdoor often has built‑in security measures to prevent discovery by anti‑malware tools and other security measures. The target machine’s component is used to transmit data back and forth between the attacker’s machine and the target machine without triggering an alert from any security measures in place. In some cases, backdoors may also be hardcoded into computers or other digital devices during their production process or after they have been shipped out. These types of backdoors are difficult to detect because they are built into the device’s hardware or firmware rather than being installed as software by an attacker. By exploiting these types of backdoors, attackers can gain persistent access to systems without needing credentials or other authentication mechanisms as they would with more traditional methods such as phishing scams. SEO SpamBasic: SEO SEO (Search Engine Optimization) Spam is when someone puts words or phrases on a website that are not related to the topic of the website in order to get more people to visit their website. Advanced: SEO spam, also known as spamdexing, is an unethical practice used by unscrupulous webmasters to manipulate search engine rankings. It involves using various methods to artificially boost their website’s ranking in search results. This includes submitting multiple versions of the same page with different keywords, stuffing pages with irrelevant keywords, and adding large numbers of unrelated backlinks. These tactics are intended to fool search engines into ranking a page higher than it should be, thus gaining more visibility and traffic to the website. SEO spam can have a detrimental effect on users since it provides bogus information and can lead them away from quality content. It can also damage a website’s reputation in the long run. To prevent this type of manipulation, search engines employ sophisticated algorithms that are designed to detect such practices and filter out pages that engage in SEO spamming.Accordion Content Fuzzy RulesBasic: Fuzzy rules are instructions that computers use to keep things secure. They help a computer decide when it is safe to do certain t"
