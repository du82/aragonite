Description:
\t\t\t\t\t\t\t\t\tThe WPScan WordPress Vulnerability Database API is provided for users and developers to make use of our vulnerability database data. Our data includes WordPress vulnerabilities, plugin vulnerabilities and theme vulnerabilities. This API is used by our WordPress Security Scanner and our WordPress Security Plugin.
\t\t\t\t\t\t\t\t\tAuthentication:
\t\t\t\t\t\t\t\t\tTo use the API you need to register a user and use the API token from your profile page. You have to send this API token with every request in the Authorization HTTP Header, as seen below.
\t\t\t\t\t\t\t\t\tAuthorization: Token token=API_TOKEN"""
