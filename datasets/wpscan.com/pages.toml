l be obligated under this paragraph with respect to information which is or becomes readily publicly available without restriction through no fault of the respective party. Upon termination and as otherwise requested, both parties will promptly return all items and copies containing or embodying Confidential Information, except that each party may keep its personal copies of its compensation records and this Agreement. 15. Changes. No amendment, modification, extension, release, discharge or waiver of this Agreement, or any provision hereof, shall be valid or binding unless in writing and signed by a duly authorized representative of each Party. Notwithstanding the foregoing, Automattic may, in its sole discretion: (i) change or modify the basis for calculating fees and other charges with respect to the Services, to which Customer will be informed; or (ii) add new features or remove existing features offered through the Services. Customer’s continued use of the Services after any change outlined in (i) or (ii), or as required by Automattic from time to time, will be deemed as Customer’s acceptance. 16. Audit. If Automattic has a reasonable basis to believe that Customer is not in compliance with any of its obligations or usage restrictions (including, if applicable, Customer exceeds the agreed upon number of sites per year in the Order Form) under this Agreement, Automattic may audit or engage a third party to audit the Customer’s compliance with this Agreement, with ten (10) days’ prior notice. If a third party is engaged to perform an audit, should such audit confirm Customer’s non‑compliance with Customer’s obligations under this Agreement, Customer will bear the cost of such third‑party audit. 17. No Refunds. Customer is not entitled to any refund, rebate, compensation, or restitution for prepaid fees for any reason whatsoever. 18. Publicity. Customer must receive prior written approval to use Automattic’s name and logo for promotional purposes. If approval is granted, Customer agrees to abide by Automattic’s published trademark guidelines at all times, available athttps://automattic.com/press/brand‑materials/. 19. Survival. Upon termination, all rights and obligations created by this Agreement will terminate, except that the parties will continue to be bound by those terms that would by their nature survive such termination, including without limitation sections 2, 3, 5, 10, 11, 12, 13 and 14. 20. Miscellaneous. This Agreement constitutes the entire agreement between Automattic and Customer and supersedes and cancels all previous written and oral agreements and communications relating to the subject matter hereof. Any pre‑printed or standard terms of any purchase order, quote, confirmation, code of conduct or similar form, even if signed by the parties after the Effective Date hereof, shall have no force or effect. This Agreement is governed by the laws of the state of California, excluding its conflict of law provisions, and the proper venue for any disputes arising out of or relating to any of the same will be the state and federal courts located in San Francisco County, California. If any part of this Agreement is held invalid or unenforceable, that part will be construed to reflect the parties’ original intent, and the remaining portions will remain in full force and effect. A waiver by either party of any term or condition of this Agreement, any breach thereof, in any one instance, will not waive such term or condition or any subsequent breach thereof. This Agreement is not assignable or transferable by either party, provided that this Agreement may be assigned in its entirety by either party to a parent or affiliated company or to a successor‑in‑interest in connection with a sale of all or substantially all of a party’s assets or business. Last Updated – June 27, 2024"
