title = "WPScan 2023 Website Threat Report | WPScan"
description = "WPScan 2024 Website Threat Report Show table of contentsHide table of contents 01Report audience02Key takeaways03Summary04Methodology05Vulnerabilities06Vulnerability types07Severity distribution08Assessing risks09Extension Vulnerabilities10WordPress Core11Firewall activity12Malware attacks13Forecast14Conclusion15Glossary 01 The audience for this report We wrote this report so that everyone from interested security beginners to advanced security researchers will benefit from it. If you are a security beginner we have…"
full_description = "WPScan 2024 Website Threat Report Show table of contentsHide table of contents 01Report audience02Key takeaways03Summary04Methodology05Vulnerabilities06Vulnerability types07Severity distribution08Assessing risks09Extension Vulnerabilities10WordPress Core11Firewall activity12Malware attacks13Forecast14Conclusion15Glossary 01The audience for this report We wrote this report so that everyone from interested security beginners to advanced security researchers will benefit from it. If you are a security beginner we have a glossary at the end of this report and link to it from key terms. For advanced researchers, we believe this report will highlight the rankings of threats to WordPress sites that we are currently seeing. 02 Key takeaways The most reported vulnerability types in 2023 were Cross‑Site Scripting, Cross‑Site Request Forgery, Authorization Issues, and SQL Injection vulnerabilities. Although Cross‑Site Scripting was the most reported vulnerability, it wasn’t the most detected type of attack through the Jetpack firewall. SQL injection was the most popular. 67% of the reported vulnerabilities were of medium severity, while 18% were classified as high severity, and 2% as critical. 37% of the reported vulnerabilities required the attacker to have authenticated access, either directly or via CSRF through a victim, to the targeted site. Weak credentials or “nulled” plugins carrying backdoors were the most common vectors for infecting sites. The Jetpack firewall, although a recent addition to the Jetpack Security suite, is proving its worth by blocking potential attacks early in the cycle, preventing attackers from getting a foothold on protected sites. Summary 03 Summary The WPScan Website Threat Report consolidates all the information collected by the Security Research team throughout 2023. We navigated the logs of our user base to identify the most common threats, vulnerabilities, and active attacks that happened in 2023. This investigation showed that while Cross‑Site Scripting is popular among the Independent Researchers and Bug Bounty Hunters, it is not as common in attacks. It also showed that after a compromise, the most popular code added by bad actors is anything that would maintain access to the attacked website. 04 Methodology The report was made by using a representative sample of all the websites using Jetpack Scan or Protect, as well as internal Automattic services that also use Scan. When combined this comprised a total of 360,734 websites. We will also cover the vulnerabilities disclosed by WPScan during 2023, which consisted of reports reviewed and verified by our Security Researchers, as well as disclosures received from third parties. It’s worth mentioning that this report only covers a fraction of the internet ecosystem; only WordPress sites were reviewed, and it is limited to Jetpack users. Therefore it will not depict the current state of the whole internet, but a more concise view of it. 5,271Disclosed vulnerabilities in 2023 05 Vulnerabilities The WPScan team, along with Independent Researchers found and processed, a total of 5,271 vulnerabilities in 2023. Those researchers along with the software authors rely on our Responsible Vulnerability Disclosure process to make sure their findings are valid and relevant, and also rely on our coordination of the fix release and public disclosure. 06Disclosed Vulnerability Types Among all the vulnerabilities disclosed in 2023 (across WordPress core, plugins, and themes) the most popular vulnerability disclosed was Cross‑site Scripting (CWE‑79) with 53.02% of all cases. This was followed by Cross‑Site Request Forgery (CWE‑352), responsible for 19.89% of the disclosures, and finally, in third place, we found Authorization Issues (CWE‑862) with 8.11%. SQL injection (CWE‑89) vulnerabilities made 4th place. 07Disclosed Vulnerabilities Severity Distribution In terms of severity, a little over 20% of all reported vulnerabilities were high or critical, but medium severity dominated the reports with 67%. While severity doesn’t translate directly to the risk of exploitation, it’s an important guideline for website owners to make an educated decision about when to disable or update the extension. 08Assessing Vulnerability Risk The WPScan team, when reviewing a reported vulnerability, will verify if authenticated or unauthenticated users can exploit the affected code and what roles would be needed for a successful attack. Sharing this value is important for users to properly assess the risks of keeping outdated software in their systems.In the last year, around 22% of the disclosures required either a subscriber level of authentication to be exploited or no authentication at all, meaning that almost every user could perform an attack. On the other hand, 30.71% of the reports were related to attacks that needed administrator privileges; this reduces the risk depending on the user setup, but these vulnerabilities should not be ignored. Almost 25% of the vulnerabilities reported were Cross‑Site Request Forgery. These are only exploited when the victim is already authenticated on the vulnerable site and visits a web page crafted by the attacker to trigger the vulnerability. The indicator is important since it shows how the developers fail to properly use authenticity checks. When analyzing the reported vulnerabilities that didn’t require authentication or could be exploited by using a subscriber‑level user, we found that the vast majority of reports were related to a lack of proper authorization; these vulnerabilities allow users to perform plugin functions that are not available for their roles. Although Unauthenticated File Upload technically belongs to this category, we count it separately since it enables attackers to escalate their authorization level by uploading backdoors, for example, and this makes it more serious. The second most common vulnerability type exploitable with minimal authentication was SQL injection; this is both high severity and risk under this circumstance since it allows attackers with no or minimal level of authorization to perform changes in the database or leak its content 09Key Reported Extension Vulnerabilities Among all the reviewed vulnerabilities some of them deserve to be highlighted due to the impact on the website or its visitors. There were two important Stored Cross‑Site Scripting affecting plugins with more than 200,000 installs: WP Go Maps and Popup Builder. SQL injection vulnerabilities also got their share in the spotlight, affecting the 90,000 active installations of SlimStat Analytics and the 1,000,000 users of WP Fastest Cache. Other popular plugins had flaws that allowed attackers to either upload malicious code or execute arbitrary commands to the vulnerable sites. WP Meta SEO allowed bad actors to perform Remote Code Execution through a PHAR deserialization vulnerability. We also found and shared the details of vulnerabilities reported on the Essential Blocks plugin, that allowed arbitrary files to be included. We reported that Formidable Forms didn’t properly check for authorizations and made it possible to low privileged users to install arbitrary plugins to a vulnerable site.Another important report we made was regarding Royal Elementor Addons, which was failing to check the file extensions therefore allowing attackers to craft requests that would end up as an unauthenticated file upload. 10WordPress Core Vulnerabilities There were a total of 13 vulnerabilities reported in WordPress core in 2023, including two that were discovered internally by our Security Researchers: WordPress < 6.3.2 – Unauthenticated Post Author Email Disclosure, as well as an RCE Pop Chain Gadget (credit to Marc Montpas for these findings). Of the core vulnerabilities in 2023, only one was scored with a high severity: WordPress 5.6 – 6.3.1 – Reflected XSS via Application Password Requests. Also, it’s worth mentioning a core vulnerability that was widely discussed in 2022 and we still had questions about it during 2023. It was the Unauthenticated Blind SSRF via DNS Rebinding in versions lower or equal to 6.1.1. This vulnerability wasn’t verified by our Security Research team, and the original researchers stated that they couldn’t generically identify ways to leverage this behavior to take over vulnerable instances without relying on other vulnerable services. However, since it was already publicly available and the WPScan team is responsible for keeping track of these reports, we decided to disclose it. You can read our recommendations on our blog. 7 millionmalicious attacks blocked 11 Firewall Activity The Jetpack firewall has been available since September 2022, and the Security Research Team was able to analyze some data collected by it. The current state of the firewall aims to block known and popular attacks, and the constant monitoring of requests and the processing of WPScan submissions will continuously add new rules to the set. While investigating the logs, we found that our firewall blocked more than 7,000,000 requests (75.13%) to a high severity (CVSS 8.8) vulnerability on tagDiv Composer, which prevented XSS attacks on vulnerable sites. There are also rules to identify and block active exploit attempts with a more broad approach. In 2023 we found that attacks that will result in a higher gain were more popular. 8.63% of all blocked requests were SQL injection attacks, and the firewall successfully detected and rejected 499,211 Path Traversal attacks, which represented 5.26% of all detections. It’s worth mentioning that although Cross‑Site Scripting (XSS) is the most submitted vulnerability, it’s on the top 5 types of malicious requests Jetpack WAF is blocking, with 3.06%. This discrepancy may be related to several causes; the most likely reasons are the part of the internet we’re covering in this report and that 57% of all reported XSS vulnerabilities required a level of authentication to happen, limiting automated attacks. As a highlight, we monitored the Fake plugin Core‑stab campaign (seen as Webshell Attack in the logs). Jetpack Firewall blocked almost 30,000 requests targeting multiple sites, it was the most active attack campaign in 2022, and it still persisted in 2023. A report about this malware was shared on the WPScan blog, where you can find the detection rules we shared. 12 Malware Attacks In 2023, Jetpack Scan found at least one malicious file on almost 70,000 sites running the tool. Despite the high number of cases, we didn’t identify any mass infection (our threshold is 5% of all infections). However, we have identified two common root causes for most of the attacks: weak or leaked credentials, and installation of pirated (or nulled) software (you can read more about it on our blog), which was found on around 1.52% of all compromised sites. Jetpack Scan rules detected a vast majority of generic malware as the most common type of malicious software; in 2023 more than 600,000 files containing generic web threats were found, representing 75% of the whole detection volume. These generic rules cover popular indicators of compromise, which can leverage different types of attacks on the site; therefore it’s hard to determine the final payload without an individual analysis of each threat. A high number of backdoor detections is expected to be present on all reports we make, since once a bad actor takes control of a compromised website, they’ll want to maintain access to it even after the entry point is fixed. In 2023 Jetpack Scan found 113,880 backdoor files (or 13% of the total detection), however, this number can be higher since our generic rules may detect those as well. These backdoors can be as simple as a few hundred characters to execute arbitrary code or a fully capable system that will allow attackers to perform changes on the filesystem and the database. In one notable example, we found a case where popular themes were compromised and carried backdoors to their users’ websites. 85,465hardening alerts sent Jetpack Scan also alerts users with hardening opportunities for their sites. Compared to alerts about a vulnerable theme or extension, hardening alerts will suggest users remove the offending file, since they are not vital to the site and may be exploited by attackers. Jetpack sent 85,465 (or 9.76%) hardening alerts during 2023. An interesting indicator not covered by this chart is the number of threats identified by our fuzzy scanner, which will determine the likelihood of a file being malicious based on threats already known by the tool. In 2023 Jetpack issued 109,876 alerts generated by this scanner. The nature of Jetpack Scan’s malware rules is to present accumulative Indicators Of Compromise to the users so they can evaluate the affected file and make a decision to use the automatic cleanup or manually check the file. Jetpack offers several options to remove malware, based on backups, known good copies of files, and more. 13 Forecast From this 2023 analysis, the main entry vector for compromised websites was leaked credentials or brute‑force of weak passwords. We suspect that this will continue to be the main attack vector in 2024. While this seems to be an easy fix by using a password manager and multi‑factor authentication, it relies more on a change in culture than technology. We also predict that gaining access to the website will continue to be the most popular attack we block on the Jetpack Firewall; bad actors will continue to attempt authentication bypasses either by software vulnerabilities or brute‑force attacks; and SQL injection attacks will continue to be more present on the logs than Cross‑Site Scripting. Cross‑site scripting vulnerabilities will continue to be the most reported vulnerability on the WPScan platform, mostly because extension authors tend to be lax about input sanitization when it comes to the admin side of WordPress sites, but also because these issues are easy to find using tools or manual code inspection. We’ve previously shared why Admin XSS is a valid security issue in the context of Multisite WordPress configurations. 14 Conclusion Although the WordPress threat landscape has continued to evolve, one thing remains constant: bad actors aim to exploit vulnerable environments. And, with WordPress being the most popular CMS, it will continue to be the most targeted platform. For website owners, being aware of the current threat landscape and how to mitigate risks is important, not only for the website’s integrity but also for its visitors and customers. Running a website has never been easier, and its security should be easy too. WPScan is an ideal security choice to keep large websites safe, and Jetpack Security is perfect for sites that need something that just works. Employing multiple defensive controls can help you better identify and mitigate attacks against your website. Maintaining a strong security posture comes down to a few key principles: keeping your environment u"
