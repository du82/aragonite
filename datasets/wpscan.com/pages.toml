eason, Customer must, at request of Automattic, return or destroy all Service Data and cease using the Services, immediately. If the Agreement is terminated for any reason other than Automattic’s material breach, all amounts due or outstanding, will become immediately due and payable. 8. Trademarks. Automattic’s trademarks, service marks, graphics and logos used in connection with the Services are trademarks or registered trademarks of Automattic or Automattic’s licensors. Other trademarks, service marks, graphics and logos used in connection with Automattic’s products, services and sites may be the trademarks of other third parties. Customer’s use of the Services does not grant any rights or licenses to reproduce or otherwise use any Automattic or third‑party trademarks. 9. Disclaimer. Except as otherwise expressly stated, the Services is provided “as is”, and Automattic, its suppliers and its licensors make no representations or warranties, express or implied, including but not limited to warranties of merchantability, fitness for a particular purpose, title or non-infringement of proprietary rights. Automattic makes no representations and warranties regarding uptime for the Services and the accuracy of the Services. 10. Limitation of Liability. In no event will Automattic, its suppliers or its licensors be liable to Customer or any other party for any direct, indirect, special, consequential or exemplary damages, regardless of the basis or nature of the claim, resulting from or related to this Agreement or any use of the Services including without limitation any lost profits, business interruption, loss of data or otherwise, even if Automattic, its suppliers or its licensors were expressly advised of the possibility of such damages. In no event will the aggregate liability for any and all claims against Automattic, its suppliers and its licensors arising out of or related to use of the Services exceed the amounts actually paid by Customer to Automattic during the