["https://wpscan.com/blog/author/marcs0h"]
title = "Marc Montpas | WPScan"
description = "Marc’s interests led him to work in the trenches of cybersecurity for the better part of the last decade, notably at companies like Sucuri and GoDaddy. His journey led him to uncover several high-impact security issues while auditing open-source platforms, like WordPress. He’s an avid Hacker Capture The Flag player and loves to hypothesize new attack vectors."
full_description = "Author: Marc Montpas Object Injection vulnerability fixed in SEOPress 7.9 June 24, 2024 During a routine audit of various WordPress plugins, we identified a few issues in SEOPress (300k+ active installs). More specifically, we discovered an authentication bug which could allow attackers to access certain protected REST API routes without having any kind of account on the targeted site. Digging deeper into what an attacker could do with this… More Unauthenticated Stored XSS Fixed in WordPress Core Updated on April 15, 2024April 15, 2024 WordPress Core recently released v6.5.2, fixing a Stored Cross‑Site Scripting issue in the Avatar block present in the 6.x versions. While investigating the patch made, we identified that it could lead to an Unauthenticated Stored Cross‑Site Scripting issue in the worse case scenario, however this case requires a specific configuration. Versions 6.5.2, 6.4.4, 6.3.4, 6.2.5, 6.1.6… More File Inclusion Vulnerability Fixed In Essential Blocks 4.4.3 Updated on February 21, 2024December 21, 2023 During an analysis of the Essential Blocks plugin, we discovered a pretty serious Local File Inclusion vulnerability that can be exploited by any attackers, regardless of whether they have an account on the site. When successfully exploited, this vulnerability may let attackers include arbitrary files hosted on the server to be parsed and executed as PHP… More Stored XSS Fixed In WP Go Maps 9.0.28 Updated on December 12, 2023December 12, 2023 During an analysis of the WP Go Maps plugin (formerly WP Google Maps), we discovered a pretty serious Stored XSS vulnerability that can be exploited by any attackers, regardless of whether they have an account on the site. When successfully exploited, this vulnerability may let attackers perform any action the logged‑in administrator they targeted is allowed… More Stored XSS Fixed In Popup Builder 4.2.3 Updated on December 12, 2023December 11, 2023 During an analysis of the Popup Builder plugin, we discovered a pretty serious Stored XSS vulnerability that can be exploited by any attackers, regardless of whether they have an account on the site. When successfully exploited, this vulnerability may let attackers perform any action the logged‑in administrator they targeted is allowed to do on the targeted… More Finding A RCE Gadget Chain In WordPress Core October 13, 2023 During a recent team gathering in Belgium, we had an impromptu Capture The Flag game that included a challenge with an SQL Injection vulnerability occurring inside an INSERT statement, meaning attackers could inject random stuff into the targeted table’s columns, and query information from the database, the intended “flag” being the credentials of a user… More Email Leak Oracle Vulnerability Addressed in WordPress 6.3.2 Updated on October 13, 2023October 13, 2023 During a thorough analysis of WordPress’ internals, we discovered a subtle bug that allowed unauthenticated attackers to discern the email addresses of users who have published public posts on an affected website. If successfully exploited, attackers could gather email addresses, putting user privacy at risk. Upon identifying the vulnerability, we promptly alerted the WordPress team, who released… More Arbitrary Plugin Installation Vulnerability In Formidable Forms Updated on September 6, 2023June 5, 2023 During a recent internal review of the Formidable Forms plugin, a serious security issue was detected which could potentially enable users with low privileges such as subscribers to install arbitrary plugins on vulnerable sites. The exploitation of this vulnerability could grant malicious users the power to install any plugin available on downloads.wordpress.org, which can lead to… More SQL Injection Found And Fixed In Slimstat Analytics and Paid Memberships Pro Updated on September 6, 2023March 1, 2023 During an internal audit of the Slimstat Analytics and Paid Memberships Pro plugins, The WPScan research team uncovered two SQL Injection vulnerabilities that could allow low‑privileged users like subscribers to leak sensitive information from a site’s database. If exploited, the vulnerability might grant attackers access to privileged information from impacted sites’ databases, such as usernames and… More A Note On CSV Injection Reports Updated on November 29, 2023November 9, 2022 We process a large number of submissions every day, some of which have a high impact on the WordPress ecosystem, and others less so. In order to ensure that our work effectively helps make the web a safer place, we have to prioritize the submissions we receive. As part of that, we’d like to clarify… More"
