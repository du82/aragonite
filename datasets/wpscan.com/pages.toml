["https://wpscan.com/blog/wordpress-debug-log-files"]
title = "WordPress Debug Log Files | WPScan"
description = "What are debug log files? When WordPress developers are working on coding a theme or plugin, it is often useful for them to log important data to a file, such as error messages, so that they can view and fix any problems. In WordPress, the debug log file is created with a known file name, debug.log,…"
full_description = '''June 29, 2021 WordPress Debug Log Files What are debug log files? When WordPress developers are working on coding a theme or plugin, it is often useful for them to log important data to a file, such as error messages, so that they can view and fix any problems. In WordPress, the debug log file is created with a known file name, debug.log, and usually stored in the publicly accessible /wp-content/ directory. To enable debug logging in WordPress, the developer has to set the following constants in the wp-config.php file: define( 'WP_DEBUG', true ); define( 'WP_DEBUG_LOG', true ); These constants should not be enabled when the WordPress website is live in a production environment as they will expose sensitive data to attackers. What are the security risks with WordPress debug log files? As mentioned above, the debug log files are left in a publicly accessible directory on the webserver with a predictable file name and can easily be accessed by an attacker. All the attacker has to do is guess the correct debug log file name and its directory to download the file. And this is easy, as it is usually within the /wp-content/debug.log file. Debug log files can contain all sorts of juicy information that could aid an attacker. This could include server‑side directory paths, server errors, usernames, and in extreme cases, plaintext passwords. Debug log files are so often left exposed that many can be found on Google when using the correct keywords. One redacted snippet can be found below: How to check for debug log files WPScan WordPress Security Scanner Our WPScan command-line interface WordPress security scanner can detect debug log files from an attacker’s outside perspective. WPScan will check if the /wp-content/debug.log file exists by default, for example, with the following command: wpscan --url http://example.com/ You can learn more about how to use the WPScan CLI tool from our user documentation. WPScan WordPress Plugin Our WordPress security plugin will check your public directory for any debug.log files, and when it detects one it will show a warning. Conclusions WordPress debug.log files are often left on websites when in their production environments and can contain sensitive information that could be useful to an attacker. You can use our WordPress security scanner and our WordPress security plugin to check for exposed debug.log files. Share this:TwitterFacebookLike Loading… Posted by wpscanteam Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Get News and Tips From WPScan Type your email… Subscribe'''
