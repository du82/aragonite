["http://www.wqxr.org/story/naumburg-orchestral-concerts-far-cry2024"]
title = "Naumburg Orchestral Concerts: A Far Cry | Live Broadcasts | WQXR"
description = "Listen on-demand to the Boston-based ensemble A Far Cry, recorded live at the Naumburg Bandshell in Central Park."
full_description = '''.l-bgimg:after { background-image: url(https://media.wnyc.org/i/800/0/l/85/2022/07/AFarCry_Naumburg_July12.jpg); } .no-filter .l-bgimg:after { background-image: none; } Live Broadcasts Published by Live Broadcasts Naumburg Orchestral Concerts: A Far Cry Listen 1 h 52 min A Far Cry at the Naumburg Bandshell ( Photo by Elliott Forrest ) i Jul 9, 2024 From WQXR Summary Transcript Transcript Terrance McKnight: Live from the Naumburg Bandshell in Central Park, I'm Terrance McKnight from WQXR 105. 9 FM, New York City's number one classical music station, (applause) and it's wonderful to see and hear this live audience out here in Central Park. (applause and cheers) Tonight we're going to broadcast a concert by the Boston-based ensemble A Far Cry. A Far Cry is a self-conducted chamber orchestra with a mission to ignite a love of music and utilize its power to bring people together locally and across the globe. Now tonight they're going to bring us a program with themes of home and migration. A program featuring music that depicts a multiplicity of time and place. There's a Palestinian folk dance. There's a postlude about a 12th century Muslim mystic and philosopher. And a concerto about a clarinetist's immigration from Syria to the U. S. And that's all before intermission. We're going to learn more about this program. Here from one of the Criers, please meet violinist Jae Cosmos. Jae. Jae Cosmos Lee: Thank you, Terrance. Good to see you again. Terrance McKnight: Always. Jae Cosmos Lee: Yeah, it's a beautiful day. I'm glad the gods just decided to whiff that moisture away. Terrance McKnight: I think they wanted to be sure they heard this program that you put together. Jae Cosmos Lee: I think they really wanted to hear it. Terrance McKnight: Tell us about it. What was the inspiration for the theme of migration, home and migration? Jae Cosmos Lee: Yeah I am an immigrant myself. I am a naturalized citizen. Also, the two composers on this program. Thank you. We have Dinuk Wijeratne, who's a Sri Lankan Canadian, and Kinan Azmeh, who's a Syrian American, who also just got naturalized not too long ago. Um, yeah. One of the things about being an immigrant, it makes you, makes you think about the home country that you left behind. And one of the things I, I wanted to talk about, when we actually first concocted this program a few years back, was the idea of home. And, is home where the heart is, as we all say? And it is. Is it a place? Is it actually a geographical location? Or is it somewhere where you go to sleep? Is it somewhere that you actually find the most solace and comfort in? And for me, that was a big question, especially with a lot of migration that's happening now because of expunged borders and the kind of chaos that we have going on in the war, in the world right now. So it was something that we wanted to bring together to really reflect and think about and it was originally conceived as a, as a title called Homeland. Terrance McKnight: So how do you get a group of musicians, 15, 20, 25 musicians to buy into that, that concept? Because this is more than, it's music but it's about something else other than music. It's broader than music. How do you get everybody on one page to say that this is important, we're going to spend time practicing this, working on this, presenting this music around the, around the world? Jae Cosmos Lee: Right. And, well, what makes it easy for that, for that buy in to happen is the music is great. And this music is really excellent. And when we actually heard the piece for the first time and we played it through, especially Dinuk's clarinet concerto that was written for Kinan when we were, when we first started playing it, as we were learning the piece, we just realized this is something electric that not only is it about a story, about, about a man's journey, but also where, where the interplay between the orchestra, the piano, and the clarinet is so dynamic that we just could not stop humming or playing it. So that really makes the buy in so much more easier for it to happen. And I think all of us have really enjoyed, I mean, even, even just Kareem's play piece that, we'll, we, we will begin with is an Arabic dance of festivities. And we actually, like just two days ago when we were in, when we were in in Boston, Kareem came to the concert and taught the audience how to dance a dabke. I mean, what other concerts do you actually get to do that? And I, I don't see anywhere else in Boston, but maybe not in New York either. Can I just say, A Far Cry is now 18 years old. Terrance McKnight: Congratulations. Jae Cosmos Lee: Thank you. Terrance McKnight: And A Far Cry is, we were out here last summer, so nice to have you guys back. And to our radio audience, we're going to get this concert started with this first piece, Dabke. It comes from the Arabic for "stamping of feet" or "to make noise." Jae Cosmos, thanks man. Jae Cosmos Lee: Thank you, Terrance. Terrance McKnight: So it seems fitting to ask you to make a little noise for A Far Cry, welcoming them back to New York. (applause) And this music. By Kareem Roustom on WQXR. MUSIC - Kareem Roustom: Dabke (2014) Terrance McKnight: That piece, Dabke, composed by Kareem Roustom. Performed live by the ensemble A Far Cry. I'm Terrance McKnight and we're broadcasting live from the Naumburg Bandshell in Central Park. Now the next piece on the program is by Kinan Azmeh. The work is based on the life journey of 12th century philosopher. Jae Cosmos Lee: We've been having such a great time actually working again with Kinan and Dinuk. I just wanted to say that how much of a privilege and honor it's been to work together with him again after two years and. Just getting this tour together, it's been such an honor. I just want to bring to the stage Kinan Azmeh and Dinuk Wijeratne. Kinan Azmeh: Good evening, New York. Thank you so, so much for being here. It's wonderful to be playing in this wonderful space, the heart of the city, the city that I call home for 24 years. I think it's wonderful to be playing at a place where you can get in touch with the soil. Maybe both the soil and the soul. New Yorkers sometimes tend to forget that we also have soil in the city. And and, you know, I think when you get in touch with the soil of a place and its soul, that's where home is. And home is, like Jae said earlier, is the the theme of this concert. The question of home and, you know, all the above and after. The first, we're gonna play two pieces both one, the first one, is that I've composed. And the other one is by my dear friend Dinuk Wijeratne. This first piece that I've written, titled, Ibn Arabi's Postlude. Ibn Arabi is a Sufi Muslim philosopher, was born in Andalusian Spain, back in the 12th century. And he traveled east looking for both, I think, to be inspired, and to inspire. Which also, I think, is another definition, wonderful definition of home. He traveled east and he was buried in Damascus, my city of birth. And this piece we're going to play tries to really summarize his journey. Again, somebody who's looking for knowledge. And if you read his writings, and maybe some of you are familiar with his writings, and if not his writings, you might be familiar with the writings of one of his students, which is Rumi. Rumi is one of his students. And you see the word love all over the place. And also one of the things that actually I love the most about his writings is that sacred well, freedom of thought for him was as sacred as religious beliefs were. And I love that, something that resonates with me very much. Kinan Azmeh: The piece tries to depict his journey, both trying to inspire and be inspired. And I hope you enjoy this. I'm going to give the microphone to my dear friend Dinuk, who's going to tell you about his clarinet concerto. Dinuk Wijeratne: Thank you, Kinan. I hope you can hear me. Greetings everyone. What a pleasure to be here. Greetings from a Canadian. I lived in the city as a student for many years. Long enough to feel, long enough to feel like a New Yorker. So it feels like coming, thank you, thank you very much. It feels like coming home, in a sense. The theme of home is very much apropos for this concert. Beautifully curated by this wonderful orchestra, it touches on themes of home and migration, and even in the clarinet concerto, themes of exile. I believe you already have a program note about this piece. It's in six continuous movements. But if I could give you a bird's eye view, this is a piece told through the lens of this clarinet protagonist. Let's call him the traveler. And in six phases, he experiences all kinds of questions to do with where his place is. Indeed, one of the remarkable things about music, I think, is its ability to create in the listener's mind, a sense of place. So you and I could be listening to the same piece of music and somehow be transported to two different imaginary places. So like I said the bird's eye view of this concerto is actually the question, how do we human beings define the word home. Is it is home defined purely by geography and location? Is it defined by the whereabouts of the ones we love? Is it a state of mind? Is it a place to to which you feel compelled to contribute? But in many places in the concerto, it is also suggested that home is also bound, for better or worse, by time. It is an ephemeral window in time, and perhaps when the window of time closes, maybe that is why we feel this bittersweet melancholy that is home. Complex and ever shifting, we believe it is all of these things and more. And perhaps if you get a chance to speak to us after the show, we'd love to hear your definitions of home. So please enjoy next Ibn Arabi's Postlude and the Clarinet Concerto. Thank you. Terrance McKnight: We're live at Central Park with A Far Cry at the Naumburg Bandshell. MUSIC - Kinan Azmeh: Ibn Arabi Postlude Terrance McKnight: Ibn Arabi Postlude. Music by Kinan Azmeh. The Boston-based ensemble A Far Cry performing, performing that music right here in Central Park. Naumburg Orchestral Concerts on WQXR. Coming up next on this program is a clarinet concerto by composer Dinuk Wijeratne. And the soloist on that piece is gonna be the composer of the last piece. He was featured playing clarinet. You're listening to WQXR. I'm Terrance McKnight here with you in Central Park. This is the third WQXR broadcast from the Naumburg Orchestral Concerts this summer, but we're going to come back. We're back Tuesday, July 23rd at 7:30 p. m. with Handel and Haydn Society. They're going to play a Baroque program with pieces by Handel, Corelli, a guy named Johann Sebastian Bach, so you don't want to miss that. We're going to be right here in Central Park where the weather is gorgeous. It's cooperating. Everybody seems so happy. All the chairs are full. People sitting out front. We're about to hear some more music here on WQXR. Boston-based ensemble A Far Cry here at the Naumburg Bandshell. The concert will include music by Janáček a little bit later, but right now this composition by Dinuk Wijeratne. MUSIC - Dinuk Wijeratne: Clarinet Concerto Terrance McKnight: Clarinetist, composer, Kinan Azmeh, performing that music with A Far Cry. The work is Dinuk Wijeratne's Clarinet Concerto, written for his good friend, who you just heard playing it right here on WQXR. I'm Terrance McKnight and we're broadcasting live, you can hear it, with the Naumburg Bandshell here in Central Park. Beautiful night. My goodness, people are standing and it's just intermission out here in Central Park. Some of the movements from that work describing immigration from Syria to the U. S., Foretelling, that was part one; then we heard The Dance of Ancestral Ties; Flux; The salt and bread of rhythm; The cadenza was called Solitary Traveler; and then the final movement epilogue was Home in Motion. Well, this is Classical New York. WQXR 105. 9 FM and HD Newark, 90. 3 FM WQXW Ossining and WNYC FM HD2 New York. It's intermission here at the Bandshell in Central Park for this broadcast by A Far Cry. Now this is the third of our broadcasts from the Naumburg Orchestral Concerts this summer. While these concerts are free and open to the public in Central Park, you can also catch them on the radio. We're going to be back here Tuesday, July 23rd at 7 30 for another concert. It's going to be the Handel and Haydn Society with a program featuring music by Corelli, Handel, Johann Sebastian Bach, complete with an organ in the middle of the bandshell, so you don't want to miss that. Either come down here where there are hundreds of seats set up in front, and I'll tell you, every seat is filled. Every seat here at the bandshell, here in Central Park. I'm going to speak to the composer and the clarinetist to get their take on this work. They present so much work that's new to our listeners, new to our audience, new to me. So we're going to meet some of these performers here with A Far Cry. They were out here with us last summer at Central Park. It's nice to be back out here with them for this program. We began tonight listening to a piece that describes a sort of Palestinian folk dance, a piece called Dabke. And then we heard Kinan Azmeh's composition, and we just heard from Dinuk Wijeratne, a composer who's greeting folks as he's coming over, making his way over here to the table to have a conversation with us about the piece that he composed for his good friend, Kinan, who you just heard. Dinuk Wijeratne sitting here at our table here at the WQXR table. Welcome to the radio, we know we're doing some radio now. Dinuk Wijeratne: Absolutely, thank you. Terrance McKnight: Yeah, we just, we just heard your your composition, that clarinet concerto, and I'm just wondering, man, a piece like that you wrote a lengthy piece for Kinan, who, and you guys are good friends. Dinuk Wijeratne: Absolutely, we go back about 25 years now. Terrance McKnight: Yeah, when did, when did you all, whose idea was it for this composition? Dinuk Wijeratne: Well, I mean, we met at, students at the Juilliard School. We actually started by improvising on the music of our heroes, you know, Béla Bartók. And then we started writing original music. And then, I think maybe about 10 years later, I just thought, you know, gosh, I would love to write you a concerto, and he was very excited about it. But it took some time to find, you know, the subject matter. And what we realized was that every time we would meet in a new city and tour and everything, of course we would talk about, you know, our families and everything, and the music industry, but we always came back to this topic of home, migration, how is life as immigrants, and, you know, where, where do we feel at home? Terrance McKnight: How, how is your family? Dinuk Wijeratne: They are well, thank you. Terrance McKnight: Kinan, welcome. Kinan Azmeh: Thank you. Thank you for having us. Terrance McKnight: You're not out of breath? Kinan Azmeh: Slightly.'''
