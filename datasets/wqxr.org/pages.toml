full_description = "Sunday, March 23: Classical Kids Fair in Brooklyn WQXR is heading back to Brooklyn for a Classical Kids Fair at the Brooklyn Children’s Museum! Mar 23, 2025 The Price of Admission: A Musical Biography of Florence Beatrice Price Host Terrance McKnight presents a one-hour program that explores the symphonic music, songs, works for piano and legacy of Florence Beatrice Price. Feb 18, 2025 Listen 59 min I, Too, Sing America: Music in the Life of Langston Hughes Join WQXR host Terrance McKnight for a one-hour radio special that shines a light on Langston Hughes's lesser-known musical compositions. Feb 5, 2025 Listen 59 min Have You Heard? 5 New Classical Music Albums to Discover Have You Heard? 5 New Classical Music Albums to Discover Jan 27, 2025 3-Minute Opera: Verdi's Aida Jeff Spurgeon can breakdown the entire plot for you in just three minutes. Jan 25, 2025 Listen Itzhak Perlman’s Chanukah Radio Party Join Itzhak Perlman as he tells the story of the Jewish festival of lights and shares his favorite recordings for the holiday. Dec 25, 2024 Vote Now to Name Earth's Quasi-Moon with Radiolab! 🌓 🌟 The International Astronomical Union and WNYC’s award-winning science podcast, Radiolab, invite people worldwide to take the opportunity to name one of Earth's quasi-moons. Dec 20, 2024 Classical Around Town: NYC Classical Holiday Concert Guide NYC Classical Holiday Concert Guide Dec 10, 2024 Have You Heard? Discover New Classical Releases Have You Heard? Discover New Classical Releases Nov 25, 2024"
