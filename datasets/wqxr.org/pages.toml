title = "From the WQXR Archives | WQXR | New York's Classical Music Radio Station"
full_description = "Great Quintets in Opera Tonight at 11 pm: An episode of The Vocal Scene from 2000, in which George Jellinek explores the rich blend of quintets in operas from Mozart to Barber. Jan 5, 2014 The Vocal Scene with George Jellinek: Mozart Rarities In this episode of The Vocal Scene from 2002, George Jellinek explores some rarely-heard vocal gems by Mozart. Nov 27, 2013 The Vocal Scene with George Jellinek: Danceable Opera George Jellinek explores various dance forms in operatic song. Hear opera's great voices including Beverly Sills, Bidu Sayao and Placido Domingo in the minuet, polonaise, waltz, gallop, polka and others. Oct 27, 2013 Listen The Vocal Scene with George Jellinek: How to End an Opera George Jellinek explores Giacomo Puccini’s art of concluding an opera with excerpts from Manon Lescaut, La Boheme, Tosca and more. This program originally aired on WQXR in 1984. Oct 20, 2013 Listen The Vocal Scene with George Jellinek: The Great Verdi Singers, Part I George Jellinek offers an historical survey of the great Verdi singers from the first half of the 20th century, including Francesco Tomagno who was the first Otello. Oct 6, 2013 Listen The Vocal Scene with George Jellinek: A Fritz Wunderlich Tribute The great German tenor Fritz Wunderlich was born September 26, 1930. In celebration of what would have been his 83rd birthday WQXR re-broadcasts this archival program from 1994. Sep 29, 2013 Eight Ways To Sing a Faust Aria In this episode of The Vocal Scene from 1996, George Jellinek offers a study in comparison: Eight different tenors sing a famous aria from Gounod’s Faust. Sep 22, 2013 The Vocal Scene with George Jellinek: Songs at Twilight In this 1981 episode, George Jellinek explores songs that evoke the fading hours of day. Tonight at 11 pm, hear Jose van, Dietrich Fischer-Dieskau, Janet Baker and Hermann Prey. Aug 25, 2013 The Vocal Scene with George Jellinek: 20th Century English Orchestral Songs In this episode, which originally aired in 2001, George Jellinek explores a treasury of English orchestral songs composed in the 20th century. Aug 18, 2013 Listen 59 min"
