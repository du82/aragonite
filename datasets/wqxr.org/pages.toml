title = "Boston Symphony Orchestra | Carnegie Hall Live | WQXR"
description = "Boston Symphony Orchestra under the baton of&nbsp;Andris Nelsons with&nbsp;Seong-Jin Cho on the piano."
full_description = '''.l-bgimg:after { background-image: url(https://media.wnyc.org/i/800/0/l/85/2024/01/chl1292024.png); } .no-filter .l-bgimg:after { background-image: none; } Carnegie Hall Live Published by Carnegie Hall Live Boston Symphony Orchestra Listen 1 h 43 min Andris Nelsons, Music Director and Conductor & Seong-Jin Cho, Piano ( Carnegie Hall: Marco Borggreve & Harald Hoffmann, DG ) i Aug 16, 2024 From Carnegie Hall and WQXR Summary Transcript Transcript Where to? Carnegie Hall, please. Okay, here are your tickets. Enjoy the show. Your tickets, please. Follow me. Jeff Spurgeon: On this broadcast from Carnegie Hall Live, we're going to bring you a performance by one of America's most renowned symphony orchestras, the Boston Symphony. They have a wonderful home in Boston, but they've come down the East Coast to join us and a New York audience here at Carnegie Hall, bringing with them a program of music by Tania León, Maurice Ravel, and Igor Stravinsky. Backstage at Carnegie Hall, I'm Jeff Spurgeon, alongside John Schaefer. John Schaefer: And, uh, Jeff, this orchestra, it is one of the original Big Five here in the United States. Traditionally, the Chicago, Philadelphia, Cleveland Orchestras, the New York Phil. and the Boston Symphony. They've been around for almost a hundred fifty years and they have a distinguished musical history. Some of the best conductors and music directors of the 20th century like Pierre Monteux, Serge Koussevitzky, Eric Leinsdorf, and Seiji Ozawa. Jeff Spurgeon: And we are not quite ready for the arrival of their current music director, but he'll be here in just a moment, Andris Nelsons. Meanwhile, John and I are backstage. Unusually, the stage doors are open tonight, so you're hearing a little more of the sound of the orchestra, which is almost all on stage right now, uh, warming up, practicing a few things. And, uh, so, uh, we're awaiting the arrival in a moment or two of Latvian native Andris Nelsons in his 10th season with the Boston Symphony Orchestra. And, uh, just in the last few days, it was announced that he has, well, we could call it a rolling evergreen contract, rather than a contract end date, uh, with the Boston Symphony. So they're basically saying to him, stay as long as you like. Nelsons is also taking on a new educational role as head of conducting, at Tanglewood, the summer home of the Boston Symphony. John Schaefer: Up in the Berkshires, where, uh, for, for decades, the Boston Symphony Orchestra has spent summers playing and teaching and being a part of, uh, the community there in Western Massachusetts. A little bit more about Andris Nelsons, before he was a conductor, he actually started as a trumpet player at the Latvian National Opera Orchestra, which he would then go on to conduct. He also led the City of Birmingham Symphony Orchestra. He's also leader of the Leipzig Gewandhaus Orchestra in Germany, but during his time with the BSO, he's done tours of Europe with the orchestra, he's toured Japan, they have a regular recording contract with Deutsche Grammophon, and Jeff, as you mentioned, they've got three works prepared for this concert tonight. The Ravel Concerto for the Left Hand, Stravinsky's evergreen Rite of Spring, but we're going to start with a piece by the Cuban born, long time New York based composer Tania León, and it is, in fact, her Pulitzer Prize winning piece called Stride. Jeff Spurgeon: Tania León studied the piano from the age of four. And then got a bachelor's and master's degree in Cuba. In 1967, though, she left that land. She was a refugee on one of the Freedom flights to Miami. A little reminder of that history after Castro took over Cuba, Cubans who had relatives in the United States were allowed to leave Cuba. So the U. S. set up what were called Freedom flights. They left Cuba twice a day, five days a week. And those flights left Cuba twice a day, five days a week, for eight years. Amazing. John Schaefer: And Tania León was on one of them. Landed in New York. Didn't speak any English, but that didn't stop her. She went and studied at NYU. And for decades now, she has been a real cultural leader here in New York. She was a founding member and the music director of the Dance Theater of Harlem. She started the Brooklyn Philharmonic's Community Concert Series. She was music advisor to the American Composers Orchestra, often promoting music by composers with Latin American backgrounds, and for several years she was the new music advisor to the New York Philharmonic. And now she is the founder and artistic director of the organization known as Composers Now. And Jeff, Distinguished Professor Emeritus at CUNY. I'm out of breath just reading her resume. Jeff Spurgeon: She's also a conductor and part of Uh, her education came from attending workshops, indeed, at Tanglewood with Leonard Bernstein and Seiji Ozawa. And Tania León has a very specific connection to Carnegie Hall this season. She is the occupant of the Richard and Barbara Debs Composers Chair for the 2023 24 season. She's a Kennedy Center honoree, and, uh, in 2021, as we mentioned, she received the Pulitzer Prize for this work. Stride. John Schaefer: It was commissioned, actually, by the New York Philharmonic. It was part of their Project 19, which marked the 100th anniversary of the 19th Amendment, which gave women the right to vote. So the Philharmonic commissioned 19 women, including Tania León, for this project. And León started by researching the suffragette Susan B. Anthony, and this is what she said about that research into Susan B. Anthony's work. She said, " She kept pushing and pushing and moving forward, walking with firm steps, until she got the whole thing done. That is precisely what Stride means. Something that is moving forward." And I gotta tell you, Jeff, Um, this is a piece with a lot of forward momentum. Jeff Spurgeon: She said that, uh, that that's what she meant by . It has some of what, to her, are American musical influences, or at least American musical connotations. A section where you can hear horns with a wah wah plunger, reminiscent of Louis Armstrong. Doesn't have to be indicative of any particular skin tone, it just has to do with the American spirit. John Schaefer: It is American music in its widest angled sense. It's music that reflects the United States, but also Latin America in some of the rhythms. I will say that the horn playing in this piece, the horn writing, is breathtakingly assured. It's one of the strong points of the work, and having been on that panel that awarded this piece the Pulitzer Prize, I can tell you that that is something to listen for. Here it is, Stride, from Carnegie Hall Live. MUSIC: TANIA LEON’S STRIDE John Schaefer: From Carnegie Hall Live, you've heard Andris Nelsons conducting the Boston Symphony Orchestra in a piece by the Cuban American composer Tania León called Stride. That is the work for which she won the Pulitzer Prize for Music in 2021. A work full of forward momentum. Jeff, you could hear that some of the strides are halting. (Yes.) This is a piece about women getting the right to vote through the 19th Amendment. Jeff Spurgeon: It's not always steady progress, it comes in fits and starts. John Schaefer: And Tania León, the composer, is here in the house and is now making her way on stage to take a bow. Greeting the conductor, Andris Nelsons, at center stage here at Carnegie Hall. A very popular figure among musical circles here in New York for quite a while. And the work that features some wonderful kind of echoes and evocations of her own Afro Caribbean roots in the rhythm, but really just a piece that is a virtuoso showpiece for the entire orchestra. Jeff Spurgeon: Everyone is on his or her toes throughout this piece. By the way, we should say too that this is the first time this work has been performed in Carnegie Hall. Right. This was given its, uh, its premiere a couple of years ago up the block a bit at Lincoln Center, uh, by the New York Philharmonic. But this performance by the Boston Symphony is the first time the work has been performed at Carnegie. We are, uh, just through the first part of a three-part, uh, work for this concert by the Boston Symphony. Three works on this program. We've heard Tania León's Stride. And now there's a great deal of movement, uh, onstage and offstage where John and I are. And some of that movement will include a piano coming on stage for our next work, which is Maurice Ravel's Piano Concerto for the Left Hand. John Schaefer: And it will feature the young Korean pianist Seong-Jin Cho, and Jeff, you'll remember the last time we had Seong-Jin Cho on our Carnegie Hall Live broadcasts because it was, um, a newsworthy event. Jeff Spurgeon: For sure. John Schaefer: It was, uh, February of 2022, the Vienna Philharmonic was scheduled to play with conductor Valery Gergiev and pianist Denis Matsuev. But this was also at the time that Russia had just invaded Ukraine, so some artists, or some artistic changes were in order. Gergiev and Matsuev had both been public supporters of the Russian president, Vladimir Putin, and so the cavalry came over the hill. Jeff Spurgeon: Yeah, and indeed they did. It was Yannick Nézet- Séguin, the conductor who was, who made himself available to be on the podium, and the soloist, they found, also appeared as if from nowhere, but he came from, back from a long way away. Seong-Jin Cho was in Berlin. And he was reached about 36 hours before the concert occurred and asked if he'd like to play the Rach II with the Vienna Philharmonic. And... John Schaefer: Rachmaninoff Second Piano Concerto at Carnegie Hall. Just, just toss that off if you would. Jeff Spurgeon: Are you ready? And he said yes. He hadn't played the concerto for several years in nearly three years. But he spent the night at a hotel piano. Uh, in a, in a hotel lounge in Berlin, and caught the flight that he could get, and got to New York, and performed the concert, and it was really an amazing night. It was an incredible concert, perhaps you heard it in our broadcast here, so much excitement and incredible energy and goodwill for those last minute replacements a couple of years ago. John Schaefer: Well, hopefully a little less excitement for, uh, our soloists tonight. Uh, not that the Ravel Concerto for the Left Hand is a walk in the park. The piece was famously written for the Austrian pianist Paul Wittgenstein, who was the brother of the famed philosopher Ludwig Wittgenstein. Paul lost his arm while fighting in World War I, but he wanted to continue performing, so when he returned, he commissioned a number of composers to write music for just the left hand of the pianist, and Ravel was one of the many who took up this challenge, and his concerto, really it is the centerpiece of the repertoire for the left hand. And Seong-Jin Cho met up with our colleagues at WCRB in Boston for an interview about this piece, which he played with the Boston Symphony just a few days ago. This is what he said about the Ravel. Seong-Jin Cho: I've been always loving this concerto since many years, and I always wanted to include this concerto in my repertoire, and I'm really glad that I'm finally be able to play this piece. And this piece is very different from the G major concerto, and I feel like this piece is more jazzy and has lots of character in the middle section. It sounds like a, like military march a little bit, because Ravel composed this piece for Paul Wittgenstein, who lost his right arm during the war, and I feel like in this piece you can hear some tragedy, and also like a military march, but, you know, there's some kind of spirit in the piece, and I'm always imagining about war, and tragedy, and like, sometimes also very depressing. Jeff Spurgeon: Seong- Jin Cho, talking about the piano concerto for the left hand that we're about to hear in this performance from Carnegie Hall. So that's some of the imagery behind the work, but we also talked to Seong-Jin Cho about the actual difficulty of just playing the piece. Seong-Jin Cho: Even though technically it's so demanding, and I've never played a piece only for the left hand before. I think the music itself is so beautiful and wonderful, so when I play this piece I stop thinking about that I'm playing only my left hand. But of course it's so, it's so difficult, especially the cadenzas, they're so difficult and it's so tempting because I want to use my right hand also. John Schaefer: All right, well, they'll have to tie Seong-Jin Cho's right hand behind his back, I guess, to avoid the temptation of using both hands. Uh, I have to say, Jeff, that, uh, as with several of the pieces that Wittgenstein composed, uh, you would never know, unless you were a pianist yourself, that you were listening to a pianist playing with just one hand. Jeff Spurgeon: Oh, it's extraordinary what, uh, what such artists are able to do. They really are quite amazing. John Schaefer: And I wish I could say there's a happy ending to the story of Ravel and Wittgenstein, but Wittgenstein, when he premiered the piece, made some changes to the score that Ravel did not appreciate, and the two had a falling out and never reconciled. Jeff Spurgeon: So, an interesting story about a great contribution to the piano literature, but which destroyed a friendship in the process. By the way, we should also say thanks to our colleagues at WCRB in Boston and producer Brian McCreath for that interview with Seong-Jin Cho that we were able to share with you tonight. And now with the stage set and the musicians all on place on the stage, we have just a moment of hesitation until those stage doors open and our soloist and conductor enter Carnegie Hall. And there's the door and there goes Seong-Jin Cho and behind him, Andris Nelsons music director of the Boston Symphony. For a performance of this piece created by war, we could say. Born out of a wartime injury. And now one of the great parts of the piano repertoire. The Boston Symphony, Andris Nelsons and Seong-Jin Cho with Ravel's Piano Concerto for the Left Hand from Carnegie Hall Live. MUSIC – RAVEL’S PIANO CONCERTO FOR THE LEFT HAND Jeff Spurgeon: From Carnegie Hall Live, you've just heard a performance of the Piano Concerto for the Left Hand by Maurice Ravel. Composition played for you in this performance by Seong-Jin Cho, and the Boston Symphony conducted by Andris Nelsons. A work that first saw the light in the year 1932, commissioned by Paul Wittgenstein, Viennese pianist who was shot in the arm, he was a soldier in World War I. And captured as a prisoner, his arm was amputated to save his life. And he commissioned, as we've told you, as John mentioned earlier, a number of works for the left hand only, but this by far the most famous and most successful one and it really has entered the mainstream piano repertoire. John Schaefer: Absolutely, and some of the composers that Wittgenstein commissioned included Benjamin Britten and Eric Korngold and Richard Strauss, '''
