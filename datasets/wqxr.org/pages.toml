full_description = "Summertime Classical Pieces For Maximum Chill Listen through these pieces to hear music that reminds us of summer in expected, and unexpected, ways. Aug 9, 2024 Authors of the Classical World: 7 Musicians and the Books They Wrote From Renée Fleming to Lang Lang, many renowned figures in the classical world have turned their attention to the written word. Aug 9, 2024 4 Female Composers in Conversation Four female composers echo the importance of amplifying women’s voices, the necessity of representation, and, above all, the value of mentorship. Mar 8, 2022 The Surprising Influence of Classical in Metal Music Electric guitarist and podcast host Alex Skolnick reveals the covert connection between metal and classical music in his interview with Yulia Ziskel of the New York Philharmonic. Feb 24, 2022 Black Classical: Composers and Conductors Who Shaped Music History Here are just a few of the many composers and conductors that you should remember, for Black History Month and beyond. Feb 1, 2022 The 20 Essential Bach Recordings With thousands of Bach music performances committed to recordings, it's hard to know where to begin. Here's our list of Essential Bach Recordings. Mar 21, 2021 Music Resolutions for 2021 They're like your regular New Year's resolutions, but more music-oriented. Get inspired to listen! Jan 2, 2021 Even With Quiet Concert Halls, Beethoven Talk Still Dominated 2020 We didn’t listen to a ton of Beethoven like we thought we would this year. But we did talk about him. A lot. Dec 15, 2020 Latest / Greatest October 2020 From an intimate piano recital recorded in a Brooklyn brownstone to a series of works that question our place on the planet, here are our favorite releases from last month. Oct 19, 2020"
