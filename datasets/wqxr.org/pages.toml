["https://wqxr.org/shows/newyorknow/episodes"]
title = "New Sounds Live | WQXR | New York's Classical Music Radio Station"
full_description = '''Cult 'Valley of Search' Reissue Show with Alan Braufman and Cooper-Moore On Wednesday, August 1, New Sounds celebrated the reissue of Alan Braufman's cult 1975 jazz album "Valley of the Search" with the first live performance of the album in over 40 years. Mar 5, 2025 New Sounds Live: First Sounds (Sarah Neufeld, Richard Reed Parry, Rebecca Foon) at National Sawdust The next New Sounds Live is a "Dream Trio" from Montreal of violinist Sarah Neufeld, multi-instrumentalist Richard Reed Parry and cellist Rebecca Foon on Jan. 30 at National Sawdust. Jan 17, 2025 New Sounds Live: Hub New Music at Kaufman Music Center on Dec. 5 Detroit-based chamber band Hub New Music presents new works commissioned for Hub’s 10th birthday by Angélica Negrón, Tyshawn Sorey, and many others at Merkin Hall on Dec. 5. Dec 6, 2024 New Sounds Live: Dawn Richard and Spencer Zahn at National Sawdust R&B singer-songwriter and producer Dawn Richard and multi-instrumentalist and composer Spencer Zahn showcase their collaborative progressive avant-garde R&B on Oct. 29. Oct 24, 2024 New Sounds Live: Ganavya at National Sawdust Ganavya, the Tamil Nadu-raised and New York-born vocalist, multi-instrumentalist and composer, performs at National Sawdust on Oct. 3. Oct 4, 2024 New Sounds Live: ETHEL, featuring Allison Loggins-Hull: Persist at Kaufman Music Center ETHEL, the GRAMMY®-winning electrified string quartet joins forces with composer and flutist Allison Loggins-Hull for a quintet program of new commissions at Merkin Hall on Sept. 24. Sep 25, 2024 New York Guitar Festival @ 25 at Kaufman Music Center Merkin Hall The NY Guitar Festival celebrates 25 years on June 14 and 15 at Kaufman Music Center, with an eclectic mix of performers exploring the full range of the guitar's musical personality. Jun 15, 2024 New Sounds Live: Pamela Z and D-Composed at Merkin Hall, April 4, 2024 Composer and media artist Pamela Z and Chicago-based chamber group D-Composed play music by Pamela Z and