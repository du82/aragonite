full_description = 'NYPR Archives & Preservation / Confessions "I am grateful to WQXR because it enables me to enjoy my reactionary taste in music." Jan 2, 2020 NYPR Archives & Preservation / Music Speaks for Itself "The plan of WQXR has been to broadcast all kinds of good music...reproduced as faithfully as modern radio science makes possible, and without too much comment." Jan 3, 2020 NYPR Archives & Preservation / The Companionship of Music "The Friends of WQXR are part of a great society, for they are sharing, unknown to each other, the com­panionship of the heroic poets of sound." Jan 3, 2020 NYPR Archives & Preservation / Paderewski "His every move in life personally, socially and economically was for the benefit and improvement of his fellow men." Sep 30, 2013 NYPR Archives & Preservation / Bach is a Modern "Yes, Bach is a modern. A present-day band-arranger gives free rein to the performer--and so did Bach." Nov 11, 2013 NYPR Archives & Preservation / My Day With WQXR "WQXR has twined itself to the context of my life in an almost obsessive way." Nov 4, 2013 NYPR Archives & Preservation / "What About This American Music?" "American Music is here to be reckoned with, lustily growing, and confident." Oct 28, 2013 NYPR Archives & Preservation / Records Make Music Lovers "Recordings are not only representatives of music; they are also musical ambassadors." Oct 21, 2013 NYPR Archives & Preservation / An Orchestral Conductor Looks at Radio "WQXR allows me to not only hear performances by other men but to take quiet stock of my own." Oct 14, 2013 NYPR Archives & Preservation / Commandments for Commentators A biblical imperative for the newsy. Oct 7, 2013'
