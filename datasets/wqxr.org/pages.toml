["https://www.wqxr.org/shows/if-hall-could-talk"]
title = "If This Hall Could Talk | WQXR | New York's Classical Music Radio Station"
full_description = "Horowitz’s Nails Vladimir Horowitz only performed on a specific spot of the Carnegie Hall stage. Hear how stagehands remembered the placement in this episode. Aug 8, 2024 Listen Read Transcript Woman Suffrage Party Convention Booklet and Button Learn how a series of meetings at Carnegie Hall in the early 20th century contributed to the evolving national dialogue on women’s rights in the United States. Jul 25, 2024 Listen Read Transcript Benny Goodman’s Clarinet Learn about Benny Goodman’s 1938 Carnegie Hall debut and hear how his clarinet played a key role in the creation of the Hall’s Rose Museum. Jul 11, 2024 Listen Read Transcript Carnegie Hall’s Rock T-Shirt Hear how some of the most famous rock and pop music acts reshaped Carnegie Hall’s identity during the 1960s and ‘70s — including a bold change to ushers’ attire. Jun 27, 2024 Listen Read Transcript Ella Fitzgerald’s Glasses Celebrate the musical legacy and singular style of Ella Fitzgerald, a Carnegie Hall icon who performed at the Hall more than 40 times between 1947 and 1991. Jun 13, 2024 Listen Read Transcript Dr. Martin Luther King Jr. Tribute Concert Flyer Discover the roles that the Rat Pack and other artists played in supporting Dr. King and his Southern Christian Leadership Conference at a pivotal moment in the Civil Rights Movement. May 30, 2024 Listen Read Transcript Carnegie Hall’s 1891 Opening Night Ticket Travel back to Carnegie Hall’s 1891 Opening Night concert. This episode explores what made Andrew Carnegie’s Music Hall unlike any concert venue and how it remains one of a kind today. May 16, 2024 Listen Read Transcript Judy Garland’s Autographed Album Cover Delve into the life of Judy Garland, whose magnificent and complex character, fascinating public and private personas, and landmark 1961 concert made her a Carnegie Hall icon. May 2, 2024 Listen Read Transcript Introducing “If This Hall Could Talk” If This Hall Could Talk tells the story of culture in America as witnessed at one iconic venue: New York City’s Carnegie Hall. Apr 18, 2024 Listen Read Transcript"
