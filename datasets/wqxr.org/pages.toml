["http://www.wqxr.org/story/les-violons-du-roy"]
title = "Les Violons du Roy  | Carnegie Hall Live | WQXR"
description = "Les Violons du Roy performs with guitarist&nbsp;Milo&scaron; at Carnegie Hall."
full_description = ".l-bgimg:after { background-image: url(https://media.wnyc.org/i/800/0/l/85/2023/11/CHL.png); } .no-filter .l-bgimg:after { background-image: none; } Carnegie Hall Live Published by Carnegie Hall Live Les Violons du Roy Milos and Les Violons du Roy ( Courtesy of the Artist (Milos), Carnegie Hall | Camirand Photo (Les Violons du Roy) ) i Jul 15, 2024 From Carnegie Hall and WQXR Summary Transcript Transcript Where to? Carnegie Hall, please. Okay, here are your tickets. Enjoy the show. Your tickets, please. Follow me. Jeff Spurgeon: Welcome to a broadcast from Carnegie Hall Live. Tonight, a festival of Baroque music from the Canadian ensemble named for the great string ensemble in the court of the French kings of the Baroque era, Les Violons du Roy, or in English, The King's Violins. And, leading this broadcast tonight, I'm Jeff Spurgeon, alongside John Schaefer. John Schaefer: And we are in Carnegie's mid-size hall, Zankel Hall, tonight. It's um it's the Goldilocks Hall for Baroque music. You know, Weill Recital Hall, too small. Perhaps the big hall, the Isaac Stern Auditorium, a little big for the kind of intimacy of Baroque music. Especially given that we have a solo guitarist, Miloš, joining Les Violons du Roy. But the ensemble will fill Zankel Hall with Baroque music tonight. The group called Les Violons du Roy was formed in the beautiful city of Quebec in 1984, by the conductor Bernard Labadie, he led that ensemble for decades, and then just a few years ago, Labadie passed the reins of the ensemble over to Jonathan Cohen, who is going to lead tonight's concert. Jeff Spurgeon: And Cohen is a triple threat for sure, a conductor, cellist, he's going to be at the harpsichord tonight, so not really conducting as much as leading this ensemble, uh, and uh, in addition to working with Les Violons du Roy, Cohen is also the new Artistic Director of the Handel and Haydn Society, that esteemed organization in Boston. And he continues his role as the Artistic Director of the English Baroque ensemble he founded a few years ago called Arcangelo. Jonathan Cohen studied with the renowned conductor William Christie, who gave him a deeper connection to the music of the era that we are going to hear tonight. Jonathan Cohen: And I love the idea that there's a lot of improvisation that's involved in Baroque music. You know, especially when you play the harpsichord, or what we call the continuo. Essentially we have the bass line and then we make up the harmonies, you know, in accordance with the other parts. And then we extemporize, we make stuff up. And in Baroque music, you know, there's very little that's written down. Like in later music, you know, if you look at Mahler's symphonies or something, he writes a lot of detail about how loud you should play and how fast and how, and what, you know, whether notes should be short or long. And in the Baroque period, a little bit, it's all up for grabs, and I suppose that's what drew me to it. The dance element of it and the free nature of it, the creative nature of it. You have to make the music really in the moment, and that's why I love Baroque music particularly. John Schaefer: Jonathan Cohen will be leading an entire program of Baroque music with Les Violons du Roy on stage at Carnegie's Zankel Hall, and we'll hear such favorites as Bach and Vivaldi, Telemann, and several others. And, uh, as we mentioned, there is a special guest joining the, uh, the strings tonight, the guitarist known by just his first name, Miloš. Of course, he has a last name, uh, Karadaglicz, which literally means Man from Montenegro, and Miloš was born in Montenegro in 1983, so he is one year older than Les Violons du Roy. He studied in London at the Royal Academy of Music, and he is now one of the most celebrated guitarists in the world. And Jeff, you mentioned Jonathan Cohen's other band, Arcangelo. Miloš recorded an album called Baroque, featuring a lot of the music we'll be hearing, with Jonathan Cohen and that band. Jeff Spurgeon: Yeah, that's a part of the program tonight, in addition to some works supplied individually by, uh, the ensemble Les Violons du Roy as well. Miloš has appeared with orchestras all over the world, the Atlanta, Detroit Symphonies in this country. He's a big supporter of music education, recently launched his own foundation based in Porto Montenegro, supporting a variety of educational opportunities and partnerships and mentorships. And, uh, we have a minute or so as you hear the musicians warming up backstage. John, you had a chance to talk to Miloš just a day or two ago. John Schaefer: He came down to our studios and I was interested in this Baroque project because, of course, the modern classical guitar did not exist as we know it back in Baroque times. So this was an example of Miloš getting into a style of music that his instrument was not specifically built for and he told us about how he felt he connected to the Baroque era. Miloš: A Baroque period is such an extraordinary period because it's a treasure chest of, uh, jewels. And discovering them and the uniqueness of each and every one of them is so engaging, intoxicating. It's, uh, music that, uh, becomes part of you in this almost enchanting way. John Schaefer: That is Miloš, the guitarist, who is, uh, really one of the superstars in the classical guitar world these days. Has recorded an album of Beatles songs arranged for classical guitar, Romantic music written, of course, for the classical guitar, and in the case of these Baroque pieces, Jeff, a kind of a transcription or an arrangement of music that would have been written for other types of string instruments. Jeff Spurgeon: Yeah, some of the arrangements Miloš has made, some were made by his teacher at the Royal Academy of Music, so there are lots of really well informed individuals. Uh, to have created the music that we're about to hear on this concert, which is about to begin. And it will start without Miloš, but instead with Les Violons du Roy, and, uh, work by Antonio Vivaldi, a Sinfonia from his opera, L'Olimpiade. This is an opera whose libretto was written by Marestasio. This opera was set by literally dozens, like 60, 70 composers, grabbed this same libretto and set it. Vivaldi did as well. His version was first performed in 1734 at the Carnival in Venice. The plot is set at the ancient Olympics and it's about a couple of couples who've been torn apart by their parents. They don't like who they're marrying. There's a Lifetime movie on every night of the week about this plot, but, but tonight you get Vivaldi's version of it, uh, in this Sinfonia. After some twists and turns, the couples are all reunited, so it does get straightened out at the end. John Schaefer: And we should probably just mention, in this case, the word Sinfonia does not imply a symphony. It's simply, uh, an overture of sorts. Jeff Spurgeon: An overture, an entracte, a piece of set up music for the drama that's about to come. John Schaefer: And we have, uh, an unusual kind of, uh, set up to this concert. It's not your traditional orchestra with soloist. Uh, the, the concert will go back and forth between pieces by Les Violons du Roy, and pieces by Miloš, and pieces with the two of them together. Uh, we just happen to be starting with a piece that will feature only the string ensemble. And, um, we'll have a chance to hear Miloš joining Les Violons du Roy when we get to the second piece in the program. But the applause that you hear is for this Quebec based Early Music Ensemble as they file onto the stage here at Zankel Hall. Jeff Spurgeon: You've been hearing them tune backstage because they've been standing next to John and me as we are sitting backstage. So the, uh, 14 members of the ensemble are, uh, out on Zankel Hall now. And, uh, and we're getting ready for this Vivaldi Sinfonia from L'Olimpiade to begin this concert that comes to you from Carnegie Hall Live. VIVALDI: Sinfonia from L'Olimpiade John Schaefer: That's music by Vivaldi, the Sinfonia from his opera L'Olimpiade, performed by members of Les Violons du Roy from Quebec, conducted by Jonathan Cohen, on stage here at Carnegie's Zankel Hall with, uh, Cohen conducting from the harpsichord. Jeff, a two manual harpsichord, so one keyboard above the other, which, uh, one, one keyboard of which has that kind of lute sound that we heard in that piece. Jeff Spurgeon: Allows you to alter the instrument's, uh, timbre a little bit. John Schaefer: Interesting, if you've never seen a harpsichord up close, the white and black keys are reversed from what you're familiar with on a piano. So the black keys on a piano are white on the harpsichord and vice versa. Cosmetic difference, there are some other more important differences that maybe we can talk to Jonathan Cohen about later on in the program, but he is back out on stage, now accompanied by the guitarist Miloš to perform an arrangement of music by Marcello. And if people know that name, it's from from this piece. Jeff Spurgeon: Yes, it's a famous oboe concerto. It's been adapted for other instruments. This is an adaptation of the Larghetto movement from that work for the guitar and now Miloš on stage joins Les Violons du Roy and conductor Jonathan Cohen from Carnegie Hall Live. MARCELLO: Adagio from Oboe Concerto in D Minor BOCCHERINI: Fandango from Guitar Quintet in D Major, G. 448 John Schaefer: That is a Fandango from Luigi Boccherini, one of the rare Baroque composers who did write music for some form of guitar. That Fandango was originally from the Guitar Quintet in D, but we've heard a live performance by Les Violons du Roy, 14 strings rather than the original four. and Miloš playing the contemporary version of the guitar. Prior to that, we heard some music from Marcello's Oboe Concerto in D minor, the slow movement. Jeff Spurgeon: Yeah, not the, not a, not a larghetto, but instead an adagio. So, uh, those of you who are looking it up. And, uh, now this concert is going to continue, but the members of Les Violons du Roy have left the stage. Well, frankly, so has Miloš, so there's nobody there now. But we have something very special, uh, coming up from Miloš in this portion of the concert. Quite a famous work. John Schaefer: Well, in fact, one of the pinnacles of the Western violin repertoire, the great Chaconne by Johann Sebastian Bach, which Miloš has arranged for classical guitar, and he told us why he wanted to play this piece. Miloš: Because it's the greatest piece of instrumental music, full stop. The moment you sit there and you start playing that piece, something happens. And it is so powerful. Because it's so iconic on the violin. On the guitar, it becomes something else. And while on the guitar, maybe you don't have that sort of carnal intensity of the bow and and the pressure of the bow and the strings of the violin, you have more means of expression, maybe, more color, more opportunity to find a unique interpretation of that piece because there is no right or wrong, there is just true. Jeff Spurgeon: I love that quotation from Miloš. Isn't that something? There's no right or wrong, there's just true. John Schaefer: Right. Jeff Spurgeon: Ah, what a wonderful, uh, description of the power of the interpreter in this music, because Bach wrote the piece out for violin, very few markings on it, and so it really is up to the performer, and in this case, the transcriber and performer. Miloš made this transcription that he's about to play for us as well. John Schaefer: You know, one of the interesting things about this is, of course, the guitar is a chordal instrument, and Bach has a lot of implied harmonies. So, as a guitarist, you can begin to fill in those harmonies, and I asked Miloš about that, and he pointed to Segovia, who used things like seventh chords, which he didn't think Bach would have used. Jeff Spurgeon: Right. John Schaefer: So, there was some restraint involved in this interpretation, which we will now hear. The great Chaconne by Bach, arranged and performed by Miloš on classical guitar from Carnegie Hall Live. J.S. BACH: Chaconne from Violin Partita No. 2 in D Minor Jeff Spurgeon: From Carnegie's Zankel Hall, you've just heard guitarist Miloš and his own transcription of the Chaconne for violin by J. S. Bach. What was it Miloš said? Just one of the greatest pieces of instrumental music. Full stop. John Schaefer: Full stop. And what an arrangement. Daring, ambitious, technically improbable, Jeff Spurgeon: And also simple, not overdone. All of the purity of the violin lines allowed to shine through with enough of the, as you said, the implied harmony exposed because of the multiple strings on the guitar. That's a remarkable work and a remarkable performance. John Schaefer: Miloš doing his arrangement of the Bach Chaconne originally from the Violin Partita Number two in D minor, and in a minute, the ensemble, the Les Violons du Roy, will return to the stage here at Zankel with their music director, Jonathan Cohen, and, uh, Cohen said this about Bach and the adaptability of the music he just heard. Jonathan Cohen: Bach himself was a, was a great arranger of music, you know, music concertos for the keyboard put on oboe and violin and moving around. So I think it's something particularly authentic to, and you know, especially with Bach's music, it works very well. You could play it on the, on any instrument really because the, the integrity of the music is so, so strong. The guitar, particularly, as Miloš plays it anyway, has a, has a very intimate atmosphere, I think, and he really creates this environment which draws people into rather a very intimate experience. So I think that will very much suit this particular piece. John Schaefer: Jonathan Cohen, the director of Les Violon du Roy, talking about Miloš and his arrangement of Bach, and now Jonathan Cohen and the rest of the ensemble are back out on stage here at Zankel Hall. To wrap up the first half with music by Handel, it's the Concerto Grosso in A Minor, Op. 6, No. 4, from Carnegie Hall Live. HANDEL: Concerto Grosso in A Minor, Op. 6, No. 4 John Schaefer: That is the group Les Violons du Roy, the King's Violins, from Quebec, conducted by Jonathan Cohen and a Concerto Grosso by George Frederick Handel. The Concerto Grosso in A minor, to be, uh, to be totally scorekeeping about it, Opus 6, Number 4. And, uh, Jeff, um, Jonathan Cohen had told us earlier in the broadcast about how he loved the dance element of Baroque music. Jeff Spurgeon: Oh, it's all over, all over the dance forms. If you can't play Bach and dance, you don't have the right tempo. And you could say that for so much of Handel's music and for so much of the work of the other great composers from this Baroque era, roughly 1600 to the middle of the 18th century. The whole genre is filled with dancing and so that feel is essential to this kind of music. John Schaefer: And we certainly heard it in evidence in that Concerto Grosso by Handel, I mean really "
