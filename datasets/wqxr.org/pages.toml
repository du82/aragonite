title = "WQXR History | WQXR | New York's Classical Music Radio Station"
full_description = '''NYPR Archives & Preservation / "WQXR is a Different Kind of Radio Station" A short talk at Hunter College by WQXR co-founder Elliott Sanger. Oct 20, 2023 Listen Operavore / Operavore / From the Archives: George Shirley Interviews Marian Anderson Listen to a 1974 interview with Marian Anderson on WQXR. Jan 1, 2022 Listen 45 min WQXR Features / Timeline: WQXR at 85 On Dec. 3, WQXR turns 85 and we couldn't feel or sound any better! Here's a look back at the station's rich history of bringing great classical music to New York City and beyond. Dec 3, 2021 NYPR Archives & Preservation / Einstein Listened Einstein had subscriptions to both the WNYC and WQXR program guides! Jul 22, 2021 NYPR Archives & Preservation / Adventures in Listening "For me the Gates of Paradise are wired for sound — and attuned to 1550 kilocycles." Jan 11, 2020 NYPR Archives & Preservation / Music Speaks for Itself "The plan of WQXR has been to broadcast all kinds of good music...reproduced as faithfully as modern radio science makes possible, and without too much comment." Jan 3, 2020 NYPR Archives & Preservation / The Companionship of Music "The Friends of WQXR are part of a great society, for they are sharing, unknown to each other, the com­panionship of the heroic poets of sound." Jan 3, 2020 NYPR Archives & Preservation / Confessions "I am grateful to WQXR because it enables me to enjoy my reactionary taste in music." Jan 2, 2020 NYPR Archives & Preservation / If He Walked Into My Life An appreciation of the composer-lyricist Jerry Herman. Dec 30, 2019 Listen 4 min'''
