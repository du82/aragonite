["http://www.wqxr.org/story/live-broadcast-handels-messiah-trinity-wall-street"]
title = "Handel's Messiah from Trinity Wall Street | Live Broadcasts | WQXR"
description = "Tune in to a special broadcast of Handel's 'Messiah' from Trinity Wall Street."
full_description = ".l-bgimg:after { background-image: url(https://media.wnyc.org/i/800/0/l/85/2022/11/messiah-1200x628_FB.jpg); } .no-filter .l-bgimg:after { background-image: none; } Live Broadcasts Published by Live Broadcasts Handel's Messiah from Trinity Wall Street Listen 2 h 51 min Trinity Wall Street perform Handel's Messiah ( Photo courtesy of Trinity Wall Street ) i Dec 23, 2024 From WQXR Summary Transcript Transcript Jeff Spurgeon: From Historic Trinity Church in Lower Manhattan, this is a live broadcast of Handel's oratorio Messiah, performed by the choir of Trinity Wall Street and the Trinity Baroque Orchestra. I'm Jeff Spurgeon welcoming you to another broadcast of Messiah on WQXR this year. Once again from Trinity Church, where 50 people are assembled now in the nave of this historic sanctuary ready to bring to you Handel’s Messiah. Tonight's conductor, Andrew Megill told us about what makes Messiah at Trinity Church so special. Andrew Megill: They have, as long as I have known them, been sort of one of the great Messiah’s in New York City. The combination of the extraordinary choir and extraordinary orchestra and the fact that it's, it's one of the only Messiah’s where all the soloists come out of the choir. And so, you get to sort of have a personal relationship with each one of the members of the choirs that come out. And that's been true. Um, I first conducted the Trinity Choir, I guess probably 13 years ago or something. And so, it's an incredible joy to come back and, and do one again after the pandemic, getting it restarted again. And, and, um, and we were talking with some of the players and singers after the break that, you know, the piece is still the same great piece that we loved and we sort of somehow, we all wondered would it be the same coming back over the pandemic? And there's just a, you can tell there's just a love for the piece among all the players and singers that makes it such a joy to, to sink our teeth into. Jeff Spurgeon: Conductor Andrew Megill. Messiah is in three parts, and it is not so much a story as a set of illustrations, the story of Christ's life and a defense of his divinity. Part one of the Messiah is the Christmas story, in particularly the part about the shepherds visiting the newborn child. Andrew Megill told us about the music we'll hear in this first section. Andrew Megill: So, part one is usually called the Christmas portion. It is mostly about the birth of Christ, although it's not really told in a narrative and linear way, but it, it clearly outlines that. And so, it has the darkness that people are walking into a lot of images of light that happen with many of the arias and choruses. And there's this sort of gradual sort of lightening of the texture and bringing of joy in the texture. Uh, and a lot of the text about sort of, the birth of the Christ child, and so I, it's usually called the Christmas portion, and it's primarily about joy and new beginnings. Jeff Spurgeon: Andrew Megill speaking about the first part of Handel's Messiah. Messiah has never been static. It's been performed by modern and baroque orchestras, by enormous forces and very intimate groups. Trinity's version is always an intimate experience with a small choir of vocalists and an orchestra playing baroque instrument. Andrew Megill: Everyone should do Messiah or should hear Messiah on whatever instruments you have. On kazoos, it’s still beautiful, but there is something extraordinarily special about, especially this group of players who are so skilled, playing on the instruments that would have been part of Handel's own world. And it just means that the sounds that they create were closer to what he had in his imagination. And it was such a glorious imagination that the more we knew what he was thinking, the more we discover how rich that imagination is. When you're on period instruments, the range of color is wider and more varied from moment to moment. And there's a beautiful thing about modern instruments that it's stable and you know exactly what's gonna happen, but, but you lose that sense of, you know, it's not just green, it's an exact shade of green and it shades from one to another. And, and, and I suppose one of the other things is that, you know, it does mean that we perform at a slightly lower pitch than we would with modern instruments. And one of the things I think that does for the voices particularly is it, it takes some pressure off the voices, and they just are able to speak with such clarity and such ease. And again, they have, they have more choices they can make in order to bring the texts that Handel was so enraptured with to life. Jeff Spurgeon: Conductor Andrew Megill, who in just moments will be in command of this performance of Handel's Messiah. We're bringing you tonight a performance by the choir of Trinity Church and the Trinity Baroque Orchestra at this historic sanctuary in lower Manhattan, actually, the third of Trinity Church's buildings, the first one built in 1698. It came down in the great New York City fire of 1776. The second building was, uh, destroyed by ice and storms in the 19th century. And so, in 1846, the current building, uh, went up and that is the performance that is the, uh, performance venue for Messiah for many years now at Trinity Church. There's a little bit of argument among the historians about where Messiah was performed first. Was it in New York or in Boston? At least in New York in the year 1770, we know that parts of it were performed, perhaps, as a sort of a rent party for the organist. It was done somewhat informally and not in the church building, but at a, a tavern just about three blocks south of where I'm speaking to you from now in lower Manhattan. But from there, the tradition has continued now into the 21st century. WQXR has been very pleased to bring you Trinity's Messiah in a number of recent years, including an important performance that happened in December of 2001, just a few weeks after the church was cleaned of the ash and dust that had been thrown into it by the disaster of 9/11. Yet the church recovered, and great forces were brought to bear to bring Messiah to life that year. This year also is a bit of a revival for, this is the first time Messiah has been performed at Trinity, uh, since the pandemic. And we are about to start the performance with Andrew Megill and the choir of Trinity Church and the Trinity Baroque Orchestra after another word or two that, uh, the audience here at Trinity is receiving from Trinity's Rector. There will be an intermission of 15 or 20 minutes after, um, a certain section of the work has been performed, and then we'll bring you, obviously the rest of it. Trinity, uh, at Christmas time does not do the entirety of Messiah. It is a work that is often truncated at this time of the year Handel, in fact, wrote it, uh, with the intention of having it performed more at Easter time as it was in its first performance in 1742 in Dublin. It was a great benefit, that first performance of Messiah. It was designed as a benefit, uh, benefit performance and realized as such for prisoners’ debt relief and the Mercer’s Hospital and a charitable infirmary there. Um, there were 142 prisoners who were in debtor's prison at that time, who were released as a result of the benefit, uh, benefit performance of Messiah that was given that first time around. We've told you that, uh, Trinity's is a very special performance. There are 25 singers and a baroque orchestra of 25 and often while this work is a great showcase for solo singers, at Trinity is a, it is a showcase for choir members themselves. So, you will hear, I would guess a dozen, we'll count them up for you, but, uh, at least half of this choir will step forward to bring you the solo portions of Handel's Messiah. And now conductor Andrew Megill asks the Trinity Baroque Orchestra and the choir of Trinity Wall Street to rise. And here now is Handel's Messiah from Trinity Church on Wall Street coming to you live on WQXR. MUSIC – Handel: Messiah Part I Jeff Spurgeon: This is a live broadcast from Trinity Church on Broadway of Wall Street of Handel’s Messiah. There’s a brief pause as the program begins to allow for some late seating for arriving audience members. And then we will resume with Brian Ming Chu, the soloist for this bass recitative. MUSIC – Handel: Messiah Part I cont’d Jeff Spurgeon: From Trinity Church on Broadway of Wall Street in Lower Manhattan, you have just heard the first portion of Handel’s oratorio Messiah, performed by the choir of Trinity Church and the Trinity Baroque Orchestra conducted by Andrew Megill. It is certainly an annual tradition at Trinity Church as it is as well in a few other places at this time of year. We've reached intermission of this performance of Handel's Messiah. We will bring you the, uh, rest in just a bit, continuing our broadcast that celebrates this historic work as well as this historic venue and this very unusual way, the Trinity performance of Messiah bringing their soloists, not from the outside, but simply from the choir itself. The soloists you've heard so far: Tenor, Stephen Sands; Bass, Brian Ming Chu; Soprano, Meg Dudley; Alto, Pamela Terry; Bass, Steven Hrycelak; Soprano, Madeline Apple; and Alto, Kate Maroney. And there will be more in the next portion of our program. Classical New York is 105.9 FM at HD WQXR Newark, and 90.3 FM WQXW Ossining. I'm Jeff Spurgeon, pleased to be sharing this performance of Messiah with you tonight, and we are pleased as well to welcome one of the choristers to our microphone, sacrificing a little bit of his, uh, vocal cord, relaxing in a mission to spend some time with us. Hello, Stephen Sands. Stephen Sands: Hello. How are you? Jeff Spurgeon: I'm very well. You are very well too. You got to start the whole thing off tonight. Stephen Sands: Absolutely. Jeff Spurgeon: Is this the first time that you've done that solo? Stephen Sands: Um, I've done it a few times here at Trinity over the years, yes. Jeff Spurgeon: Comfort me, uh, Comfort Ye, my people. How many times have you sung this work? Stephen Sands: Oh, my goodness. Uh, I, my first year was in the year 2000, uh, and I've sung it many times since then, under probably five different conductors. Jeff Spurgeon: And is it, I mean, Messiah, isn't it… It's like eggplant parmesan, isn't it? It's delicious. And yet there's always, you know, you, you get the leftovers. You're coming out the next year. It comes out the next year - this again. So how do you feel when you see this warhorse of a piece come back to you every December? Stephen Sands: Well, the beautiful thing about this piece is that no matter how many times you do it, every time, it's different. Every time there's a new interpretation, every time there's a new thought behind it. Every time you can take what's happening in the world and apply it to how it is that you're performing this. And, uh, I think it takes on a special meaning every year, you know, that's why it's so timeless. Jeff Spurgeon: And how does Andrew Megill, what has he drawn from this choir? Stephen Sands: Well, Andrew, uh, I've worked with Andrew, I've known him since I've been a teenager actually at Westminster Choir College Jeff Spurgeon: Where he was a teacher for many years. Stephen Sands: Yes, he was. And uh, he has an incredible sense of humanity that he brings to everything. And he is an incredible conduit for the music through his humanity. And he just brings the best in everybody in the room together to make a beautiful energy. Jeff Spurgeon: And you do other work besides singing in the choir of Trinity Church. You are a conductor of a vocal ensemble here called Downtown Voices. Stephen Sands: Yes, sir. Jeff Spurgeon: What, what is that? Stephen Sands: So that is a, it's a volunteer group also with the Trinity Choir members who come together and do many concerts throughout the year. Um, next week we'll be singing with Andrea Bocelli at Madison Square Garden and, uh, all sorts of fun stuff that you get to do. Jeff Spurgeon: So you, so you just find work that you can pick up once in a while? Stephen Sands: Exactly! Jeff Spurgeon: Whoever's in town. So, it's, it's, um, is it prof, it's professional voices and then amateur voices from the congregation? Or is it something larger? Stephen Sands: Uh, it's from the, the New York Metropolitan area. We draw some of the best, most people in the group actually have music degrees and, uh, have day jobs and, and, and have this as their musical outlet. It's really a, a spectacular group of people. Jeff Spurgeon: How big is Downtown Voices? Stephen Sands: Between 60 and 80 per project. Jeff Spurgeon: And, and, how, how do you… because somebody's asking this at home… How do you get in? How do I get in? Stephen Sands: So there is an audition process. You go to downtownvoices.net and you fill out the audition form and, uh, we get back to you with a, a more extensive form to fill out with some recording examples. And then there's an in-person audition. But we definitely do have a, a very high level of, uh, volunteer singer here. Jeff Spurgeon: All right, very good. So you've told us how to do it and warned us that it might be difficult for, for everybody to join. Very, very well done. Will we hear from you again in the next part of Messiah as more than a, a member of the ensemble? Stephen Sands: Just as the chorus. Jeff Spurgeon: All right. Yes. Um, and how does that… what do you have to do to yourself to move from the ensemble to the, to the solo thing? Do you have to sort of mentally stick your chest out a little bit? Or maybe you don't, maybe you just step up front and sing. Maybe it's the same thing. Stephen Sands: Yeah, it really is. I mean, in a piece like this, you're emoting, no matter whether you're in the chorus or you're standing in front of the audience as a soloist, of course you're going to bring a little bit more energy to a solo line than you would in the chorus when you're blending with other people. But the affect, I think, is the same. Jeff Spurgeon: Well, the comfort that you offered in that text and in those moments was just beautiful and was a lovely beginning, um, for our hearing of the solo members of the Choir of Trinity Church tonight. Stephen Sands. Thank you. You need to go relax, sit down, have a drink of water, not say anything for a while, and we'll hear you again in the second part of the program. Stephen Sands: Sounds good. Thanks so much. Jeff Spurgeon: Thank you so much. Stephen Sands, one of the tenors in the Choir of Trinity Church on WQXR. Our live broadcast of Handel’s Messiah from the Choir of Trinity Church and the Trinity Baroque Orchestra. We're at intermission right now, but we have some other music from the choir of Trinity Church, a recording made a couple of dozen years ago, I'd guess by now, by the, uh, choir of Trinity Church and a former music director, Owen Burdick. Here they are for the Carol for the season. MUSI"
