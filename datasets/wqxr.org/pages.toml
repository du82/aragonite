full_description = "Brazilian Guitar Quartet Play Music From Spain and Brazil At 10 pm on Monday, tune in to hear the Brazilian Guitar Quartet. Sep 11, 2017 Brazilian Guitar Quartet Play Music From Spain and Brazil At 10 pm on Monday, tune in to hear the Brazilian Guitar Quartet. Sep 11, 2017 Javier Perianes in his New York Recital Debut In his New York recital debut, pianist Javier Perianes brings postcards from Vienna and Grenada in this Concert from the Frick Collection, Monday at 10 pm. Sep 4, 2017 Violist Antoine Tamestit Plays Bach and Telemann Antoine Tamestit, a leading champion of the viola, is known for playing with some of the world's finest orchestras. But at The Frick Collection, he's playing solo. Aug 28, 2017 Bass-Baritone Christopher Purves Makes His New York Recital Debut Bass-Baritone Christopher Purves usually performs on opera stages across Europe. For his New York recital debut, Purves chose the intimate stage of The Frick Collection. Aug 21, 2017 Tempesta di Mare Plays Music of Naples and Venice Tempesta di Mare, a Baroque ensemble from Philadelphia, take us on a trip to Venice and Naples in this Concert From The Frick Collection: A Tale of Two Italian Cities. Aug 14, 2017 Cuarteto Casals Play Mozart, Brahms and Bartok Cuarteto Casals, a Spanish string quartet, plays Mozart, Brahms and a bit of Bartok live from The Frick Collection. Aug 7, 2017 Phantasm Plays Several Generations of British Composers At 10 pm on Monday, tune in to hear Phantasm, an early music group founded in London more than 20 years ago by an American cellist with British and Finnish viol players. Jul 31, 2017 Pianist Joseph Moog Makes His New York Recital Debut At 10 pm on Monday, tune in to hear pianist Joseph Moog make his New York recital debut at The Frick Collection. Jul 24, 2017 The Atos Trio Play An All-French Program At 10 pm on Monday, tune in to hear the Berlin-based Atos Trio play an all-French program. Jul 17, 2017 The Carducci String Quartet Play Mendelssohn and Beethoven At 10 pm on Monday, tune in to hear the Carducci String Quartet play Mendelssohn and Beethoven. Jul 10, 2017"
