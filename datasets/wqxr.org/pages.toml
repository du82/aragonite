["https://www.wqxr.org/series/music-and-ballet"]
title = "Music and Ballet | WQXR | New York's Classical Music Radio Station"
full_description = '''NYPR Archives & Preservation / The Dances and Rhythms of Spain and La Argentinita Irving Deakin talks about dance in Spain. Mar 20, 1941 Listen The NYPR Archive Collections / The Happy Miracle by Fuerst The world premiere of the music for the ballet, The Happy Miracle by Eugene Fuerst. Oct 3, 1940 Listen NYPR Archives & Preservation / Alicia Markova and Anton Dolan on Giselle Alicia Markova discusses Giselle and her interpretation of the role of Giselle. She introduces Anton Dolin who also talks about the ballet. Apr 25, 1940 Listen The NYPR Archive Collections / Tribute to Tchaikovsky "For life like his soul was an open book. Emotional, nervous, highly stung, his heart was frequenty on his sleeve. But it was a big heart, and human heart... Irving Deakin on this centennial program for Tchaikovsky, a musical tribute. Apr 11, 1940 Listen NYPR Archives & Preservation / Littlefield's Better Dresses Irving Deakin talks about Catherine Littlefield and the composer Herbert Kingsley, who wrote the music for Ladies' Better Dresses. Jun 22, 1939 Listen The NYPR Archive Collections / Gay Parisienne This is Music and Ballet's 104th program which marks two full years of broadcasts over WQXR and highlights 'the naughty dance of the second empire.' Feb 2, 1939 Listen The NYPR Archive Collections / Ballet Looks Forward "For Ballet, as in life, it is the forward-looking movement that matters." Dec 29, 1938 Listen The NYPR Archive Collections / Alexandra Danilova Interview We hear from the great Russian prima-ballerina Alexandra Danilova who comments on her roles, care of her feet, and what she thinks about American men. Oct 27, 1938 Listen The NYPR Archive Collections / Leonide Massine's Three-Cornered Hat A candid Leonide Massine. Oct 13, 1938 Listen The NYPR Archive Collections / Blues Symposium Langston Hughes talks of "songs folks make up when their heart hurts" and he says that the blues and spirituals are "the two great Negro gifts to American music." Jun 9, 1938 Listen'''
