["http://www.wqxr.org/shows"]
title = "All Shows, Podcasts and Programs | WQXR | New York's Classical Music Radio Station"
description = "WQXR - New York Public Radio"
full_description = '''The Capitol Pressroom is broadcast from the Legislative Correspondents Association Pressroom at the State Capitol in Albany. The show features interviews with important newsmakers. Carnegie Hall and WQXR proudly unite to present Carnegie Hall Live, a series of live concert broadcasts hosted by WQXR’s Jeff Spurgeon and WNYC’s John Schaefer. Transcripts are posted to individual episode pages as they become available. The Chamber Music Society of Lincoln Center’s radio season features one-hour programs drawn from live performances. The Chicago Symphony presents the full range of orchestral works under the seasoned baton of music director Riccardo Muti. Produced by The Chicago Symphony and WFMT. Exploring Music with Bill McGlaughlin is an exciting weekday program that delves into a wide assortment of topics in classical music. Each weekly series builds off a single theme ranging from composer biographies to explorations of various cultures, musical styles and time periods. Hosted by Peter Dugan, each program presents high-caliber performances along with interviews, sketches and games, revealing the heart and soul behind extraordinary young musicians. WQXR opens up its archives this summer with a new weekly series devoted to some of its most popular programs. Since WQXR has been around for more than 83 years, that’s a lot of historical radio to delve into. Hear live broadcasts from stages in New York and beyond, from major halls to intimate venues. This includes broadcasts and Webcasts in WQXR's own Jerome L. Greene Performance Space. For more than seven decades, the Metropolitan Opera Radio Broadcasts have brought opera into millions of homes, playing a vital and unparalleled role in the development and appreciation of opera in this country. The broadcasts debuted on Dec. 25, 1931, with Humperdinck’s "Hansel and Gretel," and are now the longest-running classical music series in American broadcast history. The New York Philharmonic This Week, hosted by Emmy Award-winning actor Alec Baldwin, includes recent performances of the orchestra and interviews with musicians, guest artists and conductors.'''
year_published = 2025
clearnet = "http://www.wqxr.org/shows"
