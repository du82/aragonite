["https://write.as/matt"]
title = "Matt — Write.as"
description = "Founder, Musing Studio / Write.as."
full_description = "First days with the MNT Pocket Reform September 6, 2024 Last year, I joined the crowdfunding campaign for a neat little 7-inch, open hardware laptop called the MNT Pocket Reform. After much anticipation, I finally got it in the mail a couple days ago, and absolutely love it so far. Here are some first impressions. Read more... 2024, lately June 11, 2024 It’s funny to end up in June and realize how quickly the year has slipped by. But I’ve been keeping pretty busy, especially over the last few months. Read more... FOSDEM 2024 March 6, 2024 Last month I went to Brussels for FOSDEM, for the first time since 2020. While I didn’t go to many talks, I was able to connect with many people there, from WriteFreely users to old friends to many new people I met along the way. Read more... Holden August 25, 2023 It was late 2013 when I drove past a little dog head with big floppy ears attached poking out of the long grass in the backwoods of Florida. My girlfriend at the time said we had to go back and get him, so we did. He was timid at first but friendly, and came right up to us when we approached. We took him home and fed him. I was reading a lot of Salinger then, so I named him Holden. Read more... Product Outlook: Write.as and WriteFreely April 22, 2023 After taking a bit of a sabbatical in 2022, I’m back into Write.as and WriteFreely development. My views on the product naturally change over time, so I want to share where I’m at now. Read more... JAX to NYP February 18, 2023 Took an 18-hour train ride home from Jacksonville, FL to New York after some time in the snow out west and a friend's wedding down south. Read more... A new season, closing 2022 December 21, 2022 It's been a while since I've written. Seems like the end of this year quickly fell away from me and now it's almost 2023. So what's been going on? (A microblog that turned into a macropost.) Read more... Building for the Tidbyt October 25, 2022 After many, many long years of searching, it finally found me: a relevant social media advertisement. It was for the Tidbyt, a gorgeous retro display encased in wood that, among many other things, can show arrival times for the NYC subway. Read more..."
