["https://write.as/3ov7o400fdw6qono.md"]
title = "We're turning 7 years old today! 🎂 — Write.as"
description = "rom a no-signup publishing platform to a home for 350,000 writers, we've continued evolving since 2015.  Here's where we are today, and a little review of the past year 🧵  --..."
full_description = "We're turning 7 years old today! 🎂 From a no-signup publishing platform to a home for 350,000 writers, we've continued evolving since 2015. Here's where we are today, and a little review of the past year 🧵 In the last year, we made a ton of improvements to the platform ✨ We added a new editor that makes it easy to write without Markdown, added better support for newsletter writers, and launched experiments like http://tiny.write.as. In that time, the number of blogs and posts on our platform also doubled! Here's where we were on our 6th birthday: https://write.as/q04sqbcdqmeolq1n.md Today, we host: 360,000 blogs 🌐 3 million posts 📝 with 1 BILLION views 😵 across them all (passed this mark last night!) We see over 3,000 new posts and more than 4 million views every single day! As we anticipated on our 6th birthday, we became profitable this year! That means we're decidedly here for the long-run. Thanks to all of our customers, we can keep the lights on for decades to come, without resorting to outside funding. A special thanks also goes to our 5-year customers! It means the world to have your support and confidence in what we're building. As we did last year, we'd like to make this long-term plan accessible to more people. So we're again offering our 5-year plan at a 25% discount for the next week. https://write.as/5years Besides giving you a worry-free, permanent place for your words on the web, this is a great way to support all the work we're doing."
year_published = 2025
