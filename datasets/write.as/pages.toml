["https://write.as/privacy"]
title = "Write.as Privacy Policy"
description = "We never share your data, and we minimize what we know about you."
full_description = '''Privacy is in our name: write as yourself; write as anyone. Without anyone closely examining you, you can write freely. It's a core principle and the mission of both our products and entire business to protect your identity. The short story is that we never share your data, and we minimize what we know about you. The information we do collect may be needed for a moment, but we permanently delete it as soon as it's no longer needed. Write.as (and specifically, Musing Studio, LLC) operates several websites including write.as, snap.as, submit.as, and remark.as. This policy applies to these and all other products. When you publish anonymously on Write.as, we don't know who you are. Information about what you've published is kept on the browser or device you use to interact with Write.as. This helps ensure we can't link your posts together. If you decide to sign up for Write.as, we don't ask for your real name, date of birth, home address, or anything like that. It's none of our business, it doesn't provide any value for you, and it diminishes the protection we can give you. We don't use cookies to store your posts in the browser. The credentials to edit and delete posts are stored with a browser technology called "local storage" which, unlike cookies, collectively never touches our servers. We aim to protect free expression on our platform by collecting as little user data as possible, and encouraging our users to use the protective technologies available to them, like a VPN or Tor (see our onion service: writeasw4b635r4o3vec6mu45s47ohfyro5vayzx2zjwod4pjswyovyd.onion). We consider the necessity of every piece of data we keep, only retaining what we need to give you a smooth experience. This data will never be used for any other purpose. Write.as works well even when you're entirely anonymous to us. But we also provide some features that aren't technically feasible without a unifying "account." If you'd like these features, you can create one on Write.as. We ask you to provide a password and/or email address when you create an account with us, so that you can log into your account again in the future. We store this information for as long as your account is active. We only use your email address to send you a link to log in with whenever you request it.'''
