title = "About Write.as Letters"
description = "Easy, privacy-focused newsletters."
full_description = '''Enable email subscriptions under the Updates section in your individual blog settings. Navigate to your Blogs page, click Customize under the blog you want, then enable Email Subscriptions and save your changes. This is a major work in progress, and we'd love to hear your feedback on it! Here's what we still have planned: By enabling the Email Subscriptions feature on any of your blogs, you agree to these Terms of Use, which pertain specifically to this feature. This privacy policy deals with external users who subscribe via email to blogs hosted on the Write.as platform. Information we collect. When you enter your email address to subscribe to a Write.as blog, we store that information in our database. We also store a cookie on your machine that lets us know you've subscribed to a blog, so we can show an "Unsubscribe" button on the site. If you are a logged-in Write.as user, we also store your internal user ID, to support a future feature that lets you see all of your active email subscriptions. If you access the site to subscribe to a blog, information about your access is logged for a short period of time, as mentioned in the Platform Privacy Policy. How your data is handled. We want to extend the same privacy writers get to their readers. So we do not and will not ever sell or share your email address with third parties. Emails will never contain any tracking code. Again, see our Platform Privacy Policy for information on how we handle law enforcement requests for data.'''
