["https://write.as/blog/page/3"]
title = "Write.as Blog — Write.as"
description = "What we're writing."
full_description = "Introducing our new Community Manager, CJ! September 9, 2019 Today we're excited to officially welcome our new head of community on Write.as, CJ! If you're a Write.as user, you might recognize him from his insightful writing on his Write.as blog, to his creative projects built on the Write.as API, to his overall helpful presence on our forum. We're overjoyed to have crossed paths with him, and to now have him on the Write.as team. As you may know, we're a very small team of people behind the Write.as platform. But from our early days as a one-man show we've prided ourselves on having a human touch to go along with otherwise robotic software on a cold screen. Now with CJ on board, we'll be able to continue bringing a little humanity to your favorite writing device, as a welcome respite from the chatbots and automated systems you get on other platforms. As a customer or user, you'll start to hear more from CJ going forward. Even if you don't need any help right now, please feel free to stop by the forum and join us in welcoming him! Command-line Interface v2.0 June 26, 2019 Today we're happy to release v2.0 of our command-line interface! Now Pro subscribers can publish to their Write.as account and blogs, and everyone can sync any anonymous posts you've already published. Our command-line tool is great for power users that want to build Write.as into their normal writing workflow. For example, it can be used in shell scripts or combined with your favorite editor to connect all stages of your writing and publishing process. In fact, our Linux desktop app is built on top of our command-line tool! So while the app isn't yet updated to take advantage of the CLI's newest features, you can still install this new version, run writeas auth <username>, and then all of your posts published from the desktop app will be connected to your account. Neat, eh? As mentioned earlier, publishing to your account with the command-line tool is available with a Pro subscription. However, everyone can continue publishing anonymously, and now sync existing posts to their account, for free. We know that many people might've invested time in the CLI assuming that they'd be able to sync their posts one day, so we certainly don't want to prevent that. Download the Write.as CLI v2.0 here and read the full release notes here. What's next With this update out the door, we're quickly moving on to supporting all WriteFreely instances with the command-line tool. Anyone interested should keep an eye on the WriteFreely blog for that update. And as always, we'd love to hear what you think on the forum! #apps #updates #cli"
