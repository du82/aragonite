["https://write.as/blog/page/2"]
title = "Write.as Blog — Write.as"
description = "What we're writing."
full_description = "When There's No More to Write April 28, 2021 Periods of creative output can change over time. A day or week or year might be filled with words overflowing from your mind, while the next might only see a trickle. We might feel more social and public at one point, and more introspective and reclusive at another. As a home for your writing, we think broadly about how your creative output changes over time, and how we can evolve and flow with it. From this long view, we know that we don’t need to bug you with “retention” emails after you’ve signed up; you’ll write when you want to. We know you you may want to take your work elsewhere (even just to keep a personal copy), so we make exporting your data a cinch. And we know you might not want to keep your work on the web anymore — so starting today, you can finally delete your Write.as account on your own. Read more... Turning 6 Years Old February 12, 2021 February 2nd, 2021 marked six years since Write.as first launched! 🎉 To celebrate how far we've come over the years — from 0 to 175,000 blogs, from side project to sustainable business — we're offering a deal on our five-year Pro plan throughout the month of February. Read more about how far we've come, and how to get 25% off our five-year plan, in our latest Write.as Deals post. As you can see, with this promotion, we're also launching a newsletter for sales and deals in the Write.as suite! Going forward, we'll publish promotions there exclusively, and keep the official blog you're reading this on limited to product updates and announcements. So if you're interested in discounts, free features, and exclusive sales, you can subscribe now to Write.as Deals. Thanks for celebrating six years with us, and here's to many more! #anniversary Monetize Your Writing with Micropayments December 16, 2020 In our nearly six years, we've strived to create a platform that helps you get your words out to the world, no matter what drives you to create them. Today on Write.as, writers publish everything from anonymous flash fiction to professional newsletters like Monday Kickoff. Many write for the pure joy of it; others write to further ends. We've long thought about how we can help support our most avid writers. Like our bootstrapped company, they too need a sustainable way to create their work. They need flexible tools to help them create what they want. They need digital platforms that enable them to be free and independent. After several months of development, today we're happy to announce our first step toward such a platform, with the launch of our first monetization features on Write.as. Read more..."
