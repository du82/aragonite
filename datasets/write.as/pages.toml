["https://write.as/blog/re-opening-free-accounts"]
title = "Re-opening Free Accounts — Write.as Blog"
description = "We’re re-opening completely free accounts on Write.as, so more people can start a blog on our clean, distraction-free writing platform.  ..."
full_description = "Re-opening Free AccountsOctober 18, 2024We’re re-opening completely free accounts on Write.as, so more people can start a blog on our clean, distraction-free writing platform. In late 2021, we announced that we were closing free registrations for new users. This was mostly an experiment to help us focus on the paying customers that keep our small business running, and provide a better experience all around. Since then, we’ve been able to launch our social platform Remark.as, continue evolving WriteFreely, and add a ton of features around collaboration. In this time, we’ve also realized that free accounts are one of the best ways for people to get started on our platform. While some people know what they’re looking for, and happily upgrade to our full Pro tier within the 2-week trial period, others just need a place to casually write when they feel like it. This takes a longer time, and doesn’t fit our time-based trial model, so we want to support these writers too. Another goal of closing free accounts was to limit the number of spam accounts on Write.as. As a long-running platform with plenty of positive search engine authority on our domain, we’re a prime target for Search Engine Optimizers and spammers of every kind. Closing free accounts reduced the number of abusive actors we saw, but never stopped them completely. Now that free accounts are open again, we plan to develop new anti-spam measures that can eventually be used by all WriteFreely instances to reduce the amount of abuse they receive. New and existing users Now, anyone can grab a Free Write.as account, and get a permanent space to write online — you can get started here. Our Free tier includes all the basics, including Markdown support, our Fediverse integration, and even support for monetization through services like sub.club. See our Pricing page for the full comparison with our other tiers. Along with this, if you signed up for a trial between January 1, 2022 and today but never upgraded to Pro, your account is now completely free! This is our way of saying thanks for sticking around — and if you haven’t revisited Write.as in a while, now is a great time to check it out again. Thanks for writing with us, and we can’t wait to see what you create! #free #Writeas #accounts #fediverse"
