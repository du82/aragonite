["https://write.as/blog/tag:changes"]
title = "changes — Write.as Blog"
description = "changes posts on Write.as Blog"
full_description = "Requiring an Email Address August 30, 2024 We’re making a change today that will affect new writers looking to join Write.as. Due to a couple issues we’ve encountered recently, we’ll now require an email address to create a new Write.as account. While our high privacy standards remain unchanged, this new requirement will help us reduce abuse and provide a better experience for our writers and customers. Read on for more. Read more... Slightly New Casual Price July 24, 2018 Almost two years ago, shortly after launching blogs and accounts, we created our Casual subscription. At $10, this is the perfect plan for people who want a little more than what our free tier offers, but don't need much more. In fact, today it's just as popular as our Pro plan. Since then, we've added SSL support to the custom domains you can add to your Casual blogs, and Read Write.as has grown to an audience of thousands per month, including readers across Twitter and the fediverse and those who visit Write.as just for the stories. Because of this, and largely to get rid of the awkward “$0.83 per month” pricing, the price for new Casual subscriptions will go up to $12 per year starting August 1. Existing Casual users, including any who upgrade before August 1, will keep their $10/year rate for as long as their subscription is active. After this, you likely won't see any changes to the Casual rate, except perhaps with a new multi-year payment option. If you'd be interested in this, let us know on the forum! #pricing #casual #changes"
