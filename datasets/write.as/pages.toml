["https://write.as"]
title = "Write.as — A place for focused writing."
description = "Type words, put them on the internet. Reach friends and family no matter where they live online."
full_description = "The internet is for connecting with people. Write.as helps you reach them no matter where they live online. Friends and family can read your words without creating yet another account online. They can read in their browser, via email or RSS, on their e-reader, and on federated platforms like Mastodon. Write.as is a pared-down blogging platform — a distraction-free place for you to write, and a clean space for your audience to read. Instead of content management, we focus on writing. You'll see our editor screen first, every time you open the app. You can write in Markdown or switch to our friendly Rich Text editor. Your work is automatically saved to your browser as you write. Add your domain name to keep control of your web presence. Make it your own with a custom theme. Then, know you're never stuck here — you can always export your work, or self-host your site with WriteFreely, the open source software that powers Write.as. Built entirely around privacy, we don't track you or gather excessive data, so you can write exactly what you feel. Create a professional blog next to one written under a pen name. Publicize your work, or keep it quiet. Write anonymously, or create as many identities as you like. On Write.as, you have full control over who knows what about you. Write.as helps you create a blog, journal, or news­letter that readers will love to read. Create a home for your words, then fill it with writing — by yourself or with others. Write.as is part of Musing Studio, a suite of simple tools for creating and sharing on the open web. You can also gather writing submissions with Submit.as, share photos with Snap.as, and socialize with Remark.as."
