["https://write.as/updates/tag:fediverse"]
title = "fediverse — What's New on Write.as"
description = "fediverse posts on What's New on Write.as"
full_description = '''February 19, 2025 Now your Write.as posts can be associated with your profile elsewhere on the fediverse! Simply add your handle in the Verification section of your blog’s Customize page. This will both enable you to verify your profile as well as get a nice link back to it when sharing your blog posts on platforms like Mastodon — especially when you also add a full-size Social Image in your settings. #updates #fediverse #WriteAs August 20, 2024 We’ve just sent out a fix for following blogs from more fediverse platforms! Now you shouldn’t run into any issues following a blog from GoToSocial and more. You’ll also see this fix in our next WriteFreely release, v0.15.1. Thanks to @icarus@scg.owu.one for contributing! #WriteFreely #fediverse #GoToSocial April 28, 2023 Happy Friday! Now you can verify your fediverse / Mastodon / open web website without adding a link to your blog description 😌 Just head to your blog's Customize page, and enter the URL you want to verify. If you’re on Mastodon, simply add a link back to your Write.as blog and it’ll show up as verified! It works by adding a rel="me" link in the <head> section of your blog. (Thanks to @rmasoni@mastodon.social for inspiring this!) Discuss... #fediverse #verification #updates #writeas January 16, 2023 Your blog's browser icon will now show up in the fediverse! To make sure it looks nice, you’ll want to re-upload a high-resolution icon for your blog. Just note that the icon might not show up right away on other #fediverse platforms like Mastodon if you’re already following your blog. New followers should see it just fine, though. March 9, 2021 For a while, #fediverse users weren't able to follow blogs from Mastodon if their instance's “Authorized Fetch” feature was enabled. We just fixed that, so now you shouldn't have any trouble following blogs!'''
