["https://write.as/about"]
title = "About Write.as"
description = "Write.as is the easiest way to publish your writing on the web."
full_description = '''Create a journal, newsletter, space for your thoughts. Reach people with your ideas, and form new connections. Keep loved ones in the loop, free from social media. Write.as is a simple, modern, and ad-free web pub­lish­ing platform. We don't collect your personal data, so you can write freely. Publish anonymously or under any name you choose. Give your writing the digital home it deserves, on your own domain, on a service that will still be with you tomorrow. Get full creative control over the look and feel of your blog. Start with a community-made theme, or build your own from scratch. Our photo-hosting platform, Snap.as, is included with a subscription — the perfect complement to your words on Write.as. Write.as Pro includes everything we offer on the platform, plus perks like early access to new features and our friendly human support. Write.as is the perfect long-term home for your writing. Over five-plus years in business, we've given hundreds of thousands of writers a place to share their work on the open web — and we're just getting started. We're ultimately building a suite of web publishing tools, starting with Write.as. After launching in 2015, we're still 100% owned and operated by our founder, Matt Baer, who has no interest in making an "exit." We're in this for the long-haul, driven by principles like privacy by default, and the hope to build a software company that looks out for its users.'''
