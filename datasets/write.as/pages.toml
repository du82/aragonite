["https://write.as/letters"]
title = "Write.as Letters"
description = "Start a newsletter that respects readers' privacy."
full_description = '''Write.as newsletters are clean, simple, and accessible. For once, your subscribers will be delighted to find a new email in their inbox. Not everyone is an advertiser — so why act like one? Show your readers you respect them by leaving out the click-tracking and hidden pixels in your newsletter. Write.as Letters gives you a blank editor, the chance to enter some Markdown, and a "Publish" button — that's it. Focus on writing and we'll handle the rest, from verifying subscribers to ensuring your messages get delivered. Built to respect your readers' privacy, there's no open-rate tracking, hidden pixels, or click tracking in the emails. Your newsletter lives on a clean, permanent blog — optionally on your own domain, and follow­able via RSS. Save time on promotion and publish your newsletter to Read Write.as, our intimate community of readers. They'll be able to keep up with your posts via email, the Read Write.as feed, or any other method we offer.'''
