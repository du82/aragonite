["https://write.as/5years"]
title = "Write.as: 5 Years"
description = "A permanent space for your words, today and for the next five years."
full_description = "Subscribe to Write.as Pro for five years at a time, and give your writing a permanent home on the web for years to come. Write.as wasn't built to be a temporary place that's here today and gone tomorrow. Instead it's a dependable home for your thoughts over time, as you go through periods of writ­ing, think­ing, and just liv­ing. To be sure of that, it's built on free software and a sus­tain­able business model, funded by the same people that use it every day. With our 5-Year Plan, you get an unchanging place to write and share your thoughts over the years, as other parts of your life go on changing. Ultimately, we hope that this will help you settle in here, write when you need to, and simply live when you don't — without worrying about a sub­scrip­tion. Since our 5-Year Plan is already offered at a discount, we don't offer any additional discounts on it. However, if you're a student or teacher, part of a non-profit or open source project, or otherwise need help covering the cost of Write.as, please reach out to us about a discount on our normal yearly plan. Please try our free trial of Write.as Pro (no credit card required) before buying our 5-year plan! It's a large commitment, so we recommend the 5-year plan only for writers who are confident that Write.as meets their needs. However, if you still want a refund within 14 days of purchasing our 5-year plan, we will return it to you, minus our transaction fees, after you contact us. Yes! Just like with our yearly Pro plan, we'll remind you before you're charged again, using the email address on your account. No, the charge won't be prorated. However, the 5-year period will be added on to the end of your existing subscription. For example, if you switch to the 5-year plan in February, but your subscription doesn't normally renew until December, your subscription will now extend to December 2030."
year_published = 2025
