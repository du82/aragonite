["https://write.as/blog/tag:updates"]
title = "updates — Write.as Blog"
description = "updates posts on Write.as Blog"
full_description = "Ending our Twitter integration June 30, 2023 After finally losing Twitter API access last month as part of their latest policy changes, we’ve officially removed our cross-posting integration with Twitter. While we would love to continue supporting this feature for all the writers who use it, ultimately we’re glad to cut ties with a platform that has become unreliable in many ways under its new ownership. Read more... When There's No More to Write April 28, 2021 Periods of creative output can change over time. A day or week or year might be filled with words overflowing from your mind, while the next might only see a trickle. We might feel more social and public at one point, and more introspective and reclusive at another. As a home for your writing, we think broadly about how your creative output changes over time, and how we can evolve and flow with it. From this long view, we know that we don’t need to bug you with “retention” emails after you’ve signed up; you’ll write when you want to. We know you you may want to take your work elsewhere (even just to keep a personal copy), so we make exporting your data a cinch. And we know you might not want to keep your work on the web anymore — so starting today, you can finally delete your Write.as account on your own. Read more... April 2020 Updates May 4, 2020 We're starting this month off with an old habit we dropped for a while — monthly updates! April saw a ton of improvements to the platform, new releases, and new aspects to Write.as that we're excited to share with you here. Read more... Command-line Interface v2.0 June 26, 2019 Today we're happy to release v2.0 of our command-line interface! Now Pro subscribers can publish to their Write.as account and blogs, and everyone can sync any anonymous posts you've already published. Our command-line tool is great for power users that want to build Write.as into their normal writing workflow. For example, it can be used in shell scripts or combined with your favorite editor to connect all stages of your writing and publishing process. In fact, our Linux desktop app is built on top of our command-line tool! So while the app isn't yet updated to take advantage of the CLI's newest features, you can still install this new version, run writeas auth <username>, and then all of your posts published from the desktop app will be connected to your account. Neat, eh? As mentioned earlier, publishing to your account with the command-line tool is available with a Pro subscription. However, everyone can continue publishing anonymously, and now sync existing posts to their account, for free. We know that many people might've invested time in the CLI assuming that they'd be able to sync their posts one day, so we certainly don't want to prevent that. Download the Write.as CLI v2.0 here and read the full release notes here. What's next With this update out the door, we're quickly moving on to supporting all WriteFreely instances with the command-line tool. Anyone interested should keep an eye on the WriteFreely blog for that update. And as always, we'd love to hear what you think on the forum! #apps #updates #cli"
