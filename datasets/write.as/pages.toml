["https://write.as/blog/hello-fediverse"]
title = "Hello, Fediverse — Write.as Blog"
description = "Today we're joining the fediverse, a network of interconnected social platforms where instead of being able to only talk to people within..."
full_description = "Hello, FediverseAugust 28, 2018Today we're joining the fediverse, a network of interconnected social platforms where instead of being able to only talk to people within a single platform, like on Facebook or Twitter, you can interact with others across different platforms. Specifically, we now support ActivityPub, a protocol spoken by popular platforms like Mastodon (an alternative to Twitter). This means that you can now enable federation for your Write.as blogs, and they'll get their own handle that people can follow from the fediverse. To follow this blog, for example, you'd open Mastodon and search for @blog@write.as. Click follow and you'll start seeing our future posts in your timeline, where you can favorite or boost them to your followers. Here's a quick demo of how this works: To get started, you can create a new federated blog, or if you already have a blog, just go to your blog settings and check Enable federation. Let us know what you think on the forums, and keep an eye out for more improvements by following us on Mastodon! P.S. just a sneak peek: we've also started on the second half of our plans for the fediverse, a long-form reader called Read.as. More updates on that coming soon, too!"
