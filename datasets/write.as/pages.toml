["https://write.as/blog"]
title = "Write.as Blog — Write.as"
description = "What we're writing."
full_description = "Re-opening Free Accounts October 18, 2024 We’re re-opening completely free accounts on Write.as, so more people can start a blog on our clean, distraction-free writing platform. Read more... Write.as x sub.club October 10, 2024 Today we’re excited to announce a collaboration with sub.club, a brand new platform to help writers sustainably publish on the fediverse! With our new integration, you can offer your most loyal readers a paid subscription, and publish exclusive blog posts that they can subscribe to from their favorite platform. Read more... Welcome to the Social Web Foundation September 24, 2024 Today, we are proud to support the launch of the Social Web Foundation, a non-profit built to grow the Fediverse and make it accessible to more people. Read more... Requiring an Email Address August 30, 2024 We’re making a change today that will affect new writers looking to join Write.as. Due to a couple issues we’ve encountered recently, we’ll now require an email address to create a new Write.as account. While our high privacy standards remain unchanged, this new requirement will help us reduce abuse and provide a better experience for our writers and customers. Read on for more. Read more... Ending our Twitter integration June 30, 2023 After finally losing Twitter API access last month as part of their latest policy changes, we’ve officially removed our cross-posting integration with Twitter. While we would love to continue supporting this feature for all the writers who use it, ultimately we’re glad to cut ties with a platform that has become unreliable in many ways under its new ownership. Read more... 8 years of Write.as February 2, 2023 Today I’m excited, and pleased, to celebrate eight years on the web! As is now tradition, we’re marking the moment with a little recap of the year below, and a special sale on our 5-year subscription and iOS app — read all about that on our Deals newsletter. Read more... A Calm Summer, 2022 July 9, 2022 As we settle into the summer, we’re taking an easier pace here at Write.as. Here’s what’s been happening lately, and what you can expect to see over the next few months. Read more..."
