["https://write.as/blog/welcome-to-the-social-web-foundation"]
title = "Welcome to the Social Web Foundation — Write.as Blog"
description = "Today, we are proud to support the launch of the Social Web Foundation, a non-profit built to grow the Fediverse and make it accessible t..."
full_description = "Welcome to the Social Web FoundationSeptember 24, 2024Today, we are proud to support the launch of the Social Web Foundation, a non-profit built to grow the Fediverse and make it accessible to more people. We first joined the Fediverse in 2018, as one of only two long-form publishing platforms implementing the ActivityPub protocol (the other being Plume). Even then, we knew the promise this new protocol held for the open web. We had already joined Mastodon and even started our own instance, Writing Exchange. So by the time we implemented it ourselves, we already knew this was finally a modern protocol that could turn the internet itself, with its billions of independent sites, into a social network. Soon after, we took Write.as open source, and called it WriteFreely. It’s since been used around the world by hundreds of thousands of people and organizations outside of our single, centralized service on Write.as. And we’ve continued to support and evolve on the Fediverse ever since. Today, we’re proud to be one of many launch partners with the newly-formed Social Web Foundation. Started by Evan Prodromou (@evan@cosocial.ca), Mallory Knodel (@ohmallory@socialwebfoundation.org), and Tom Coates (@tomcoates@me.dm), its mission is to educate people on the fediverse, enhance the ActivityPub protocol, make it easier to use, and inform policy-makers about issues on the social web. As a long-time developer on the Fediverse, our goals perfectly align with the Foundation’s — and its work will be invaluable toward fully realizing the dream of a truly open and vibrant social web. Among some of its first projects, the Social Web Foundation will convene implementers like Write.as, Ghost, WordPress, and others to work out issues with long-form content and the Article type in the Fediverse. With this work, we hope to see more consistent presentation of long-form content, and solid cross-platform compatibility as platforms like Ghost join the fediverse. We hope our financial support and continuing collaboration with the Social Web Foundation will help the Fediverse grow into the social web we’ve always dreamed of — one where everyone can control who they interact with and how, and do it free from the whims of the centralized social media platforms of yesteryear. You can follow the Social Web Foundation in the Fediverse at @swf@socialwebfoundation.org or @socialwebfdn@threads.net. #fediverse #ActivityPub #SocialWebFoundation"
