full_description = '''February 19, 2025 Now your Write.as posts can be associated with your profile elsewhere on the fediverse! Simply add your handle in the Verification section of your blog’s Customize page. This will both enable you to verify your profile as well as get a nice link back to it when sharing your blog posts on platforms like Mastodon — especially when you also add a full-size Social Image in your settings. #updates #fediverse #WriteAs April 28, 2023 Happy Friday! Now you can verify your fediverse / Mastodon / open web website without adding a link to your blog description 😌 Just head to your blog's Customize page, and enter the URL you want to verify. If you’re on Mastodon, simply add a link back to your Write.as blog and it’ll show up as verified! It works by adding a rel="me" link in the <head> section of your blog. (Thanks to @rmasoni@mastodon.social for inspiring this!) Discuss... #fediverse #verification #updates #writeas'''
