["https://write.as/about/company"]
title = "Our company — Write.as"
description = "Write.as is building creative tools for the open Web."
full_description = "In decades of living on the Web, we've seen its funky, creative corners nearly forgotten as algorithmic consumption platforms took the spotlight. If we do anything as a company, we only want to show the power of the Web as a social and creative medium, as it remains today. To make that happen, we're building tools that help people publish their work online, with their digital freedom and privacy intact — as it always should be. Each of our tools does one thing well, and nothing more. Our aim is to stay out of your way, so you're free to create. Our products are the result of years dedicated to critically thinking about tech, from the incentives it creates to the ways in which it can shape our creative output. As designers, we observe, we share, and then we build digital tools from our ideas, right alongside the people using them. In the end, we want to use the Web to help spread empathy around the world; to help everyone tell their stories, so we all might find a better understanding of one another. We built Write.as because we wanted the perfect online writing tool — one that got out of our way and just let us publish on the web. We started with apps on a few platforms, and some core principles we haven't wavered from. In the years since, we've developed a powerful, flexible publishing platform, and helped hundreds of thousands of people publish their writing from all over the world. We're a proudly independent business, without outside investors. This means we can build the product we want, and we only answer to our customers — the same people who use our products every day. Beyond that, we're a profitable business that's here for the long-term, so you can rest easy publishing your work here."
