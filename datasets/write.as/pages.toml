["https://write.as/updates"]
title = "What's New on Write.as — Write.as"
full_description = "February 19, 2025 Now your Write.as posts can be associated with your profile elsewhere on the fediverse! Simply add your handle in the Verification section of your blog’s Customize page. This will both enable you to verify your profile as well as get a nice link back to it when sharing your blog posts on platforms like Mastodon — especially when you also add a full-size Social Image in your settings. #updates #fediverse #WriteAs February 19, 2025 Email list exports! Now you can easily download the full list of email subscribers on your Write.as blog any time you want — just head to the Subscribers section on your blog and click Export list at the top of the page. October 10, 2024 Just fixed an issue where the social share image for a post was inconsistent. Previously, it could be any random one in the post — now it’ll always be the first one, as intended! September 17, 2024 A minor fix for social media previews: now you’ll always see the first image in a post whenever you share the link! Previously, other images in the post might’ve shown up, instead. August 20, 2024 We’ve just sent out a fix for following blogs from more fediverse platforms! Now you shouldn’t run into any issues following a blog from GoToSocial and more. You’ll also see this fix in our next WriteFreely release, v0.15.1. Thanks to @icarus@scg.owu.one for contributing! #WriteFreely #fediverse #GoToSocial August 6, 2024 We’ve fixed a bug for authors who write in a right-to-left (RTL) language, like Arabic or Hebrew. Your emails will now show up correctly in readers’ inboxes! Previously, the email text was showing up aligned to the left. March 6, 2024 Want more control over how your links show up on social media? Now Pro users can upload a custom image that will show on sites like Mastodon, Twitter/X, and more when someone shares a link to your blog or any post. Just head to your blog’s Customize page to get started! February 20, 2024 Now you can turn off Federation for your Public blogs! People have asked about this for a while now, and especially as the fediverse has continued to grow, we think it’s even more important for everyone to have control over how and where their writing reaches people. To disable federation for your Public blog, just uncheck the option from your blog’s Customize page."
year_published = 2025
