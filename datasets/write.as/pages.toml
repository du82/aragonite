["https://write.as/matt/page/2"]
title = "Matt — Write.as"
description = "Founder, Musing Studio / Write.as."
full_description = "“Solving” Misinformation February 16, 2022 Today I’m thinking about online misinformation. Sure, at some point, you might try to address it systemically — through “fact checking” on platforms and maybe even regulation. But I think these are only superficial fixes that don't address root causes. Read more... Long-Term Consumer Subscriptions February 14, 2022 When I think “SaaS,” I think business. And I don’t think all “SaaS business” logic applies well to a consumer-oriented product like Write.as. Read more... Moving to New York soon January 5, 2022 I’ve loved this place in the South for what it was. I spent my twenties here accidentally, moving to the beach after college with my then-girlfriend, and later to the city for a job. Met good people. Slowly replaced who I’d always been with this southern Me. Bought a house even though I was always looking for a way away. I figured I’d live here a year or two. That was seven years ago. Read more... What would a real Web3 look like? December 7, 2021 Seemingly overnight, there’s been a whole new version of the Web invented, dubbed “web3.” I’ve seen a lot of people talk about it online lately, so I started looking into it to see if it’s worth paying attention to. What I’ve found is summed up in my (slightly cheeky) web3 analysis. Basically, it’s that “web3” is a set of blockchain-based technologies with some very specific use cases. Many proponents are happy to make wild claims as to how this is truly “the future,” and more thoughtful community members seem to be drowned out by hype men who look at the tech uncritically. From my conversations and research, it seems to me “web3” is at best poorly branded, having less to do with the Web itself than new ways to do commerce on the web. Overall, the hype seems disproportionate to the real-world usability or application, even when the idea is eventually fully realized. Seeing that, I started wondering: if not this, what would a true iteration of the Web look like? Read more..."
year_published = 2022
