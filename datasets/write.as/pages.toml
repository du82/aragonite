["https://write.as/updates/page/2"]
title = "What's New on Write.as — Write.as"
full_description = "April 24, 2023 There was an issue with loading past posts and editing their metadata, especially when the posts only had a title (no body). That's fixed now! April 7, 2023 We fixed an issue with image alt text, where certain characters would cause the entire alt text to not show up for readers. Now you shouldn't have any trouble writing great image descriptions to make your blogs more accessible. April 2, 2023 Made a bunch of improvements to our alternative blog interface, Tiny.Write.as! Fixed paging! Now those “Older” and “Newer” links will give you consistent results, 20 posts at a time Fixed blog descriptions — previously, you might see some plain HTML on blog posts and the Blogroll Fixed fediverse mentions — now clicking them on a Tiny blog will work correctly January 16, 2023 Your blog's browser icon will now show up in the fediverse! To make sure it looks nice, you’ll want to re-upload a high-resolution icon for your blog. Just note that the icon might not show up right away on other #fediverse platforms like Mastodon if you’re already following your blog. New followers should see it just fine, though. November 18, 2022 We now support Vimeo embeds! Just drop the link into your post to have it automatically embed the video. October 11, 2022 Just fixed an issue with eBook downloads — if you were unable to download yours before, you should be able to now! July 30, 2022 Full data exports are now available in all formats we offer, for every single user — paid or not. Previously, you needed a paid account to export in JSON format. This was a vestige of our earliest days, when we were still figuring out what to charge for. That's fixed, so now you can freely take your data with you as needed! May 31, 2022 If you’ve added a browser icon to your blog, now they’ll even show up next to your name on Read Write.as. Neato! May 10, 2022 Browser icons! Now you can upload one yourself, and make your blog even more your own. To get started, go to your blog’s Customize page, and click the image under “Favicon.” This is available to all Write.as Pro users, and we’d love to hear your feedback! Comment on the forum or Remark.as: Discuss..."
