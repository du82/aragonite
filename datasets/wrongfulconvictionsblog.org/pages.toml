full_description = '← Ohio Gov. Kasich signs landmark law on compensation for wrongful conviction Two Florida Men Freed After 42 Years in Prison for a Murder They Didn’t Commit → Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million Posted on March 6, 2019 by Phil Locke | 4 Comments “Six people were convicted of a murder they didn’t even remember. Now a county owes them $28 million.” Six people convicted of brutally raping and killing an elderly woman, but none of them had any memory of the crime . . . because they were innocent. And if that’s not bad enough, here’s the really scary part – the police actually convinced three of them that they were guilty! See the story from the Washington Post: https://www.washingtonpost.com/nation/2019/03/06/six-people-were-convicted-murder-they-didnt-even-remember-now-county-owes-them-million/?noredirect=on&utm_term=.51ac6b22a0a1 Share this:FacebookEmailTwitterLike Loading... Related This entry was posted in Compensation/Exoneree compensation, Exonerations, False confessions, Junk science, Police conduct (good and bad), Post-conviction relief, Prosecutorial conduct (good and bad), wrongful conviction. Bookmark the permalink. ← Ohio Gov. Kasich signs landmark law on compensation for wrongful conviction Two Florida Men Freed After 42 Years in Prison for a Murder They Didn’t Commit → 4 responses to “Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million” Pingback: Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million - Stan Rothenberg Carole Biggs | March 9, 2019 at 9:55 pm | Reply Congratulations, the conviction was crazy. My son’s conviction is crazy also, one day he will find justice. https://jaybiggsinnocentfightingforjustice.yolasite.com/ Pingback: Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million – CrimeMax Pingback: Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million – CrimeMax Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
