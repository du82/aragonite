full_description = "← Older posts Dean Gillispie Wins $45 Million for Wrongful Conviction Posted on December 21, 2022 by Phil Locke | 5 comments . Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years LAURA A. BISCHOFF November 22, 2022, 10:56 AM Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years COLUMBUS, Ohio – An Ohio man won $45 million in a civil lawsuit against a police department and detective whose actions led to his wrongful conviction and more than 20 years behind bars. Dean Gillispie sued Miami Township police and former detective Scott Moore for suppressing evidence and tainting eyewitness identifications in the 1991 rape and kidnapping case against Gillispie. Gillispie was convicted in 1991 in Montgomery County and released from prison in 2011. The Ohio Innocence Project at the University of Cincinnati law school, former Ohio Attorney General Jim Petro and Dean’s mother, Juana Gillispie, worked to free him and clear his name. Today, Gillispie is 57, and lives in Fairborn, a suburb of Dayton. “The horror inflicted on Dean and his family and community is hard to wrap your mind around,” Ohio Innocence Project Director Mark Godsey said. “The way the authorities pushed through a conviction and then fought back and refused to admit a mistake was so disappointing. Nothing can repay Dean for the horror.” He added: “The jury’s verdict sends a strong message that those in power need to change the way they do things.” “Justice prevailed in this case, although it took a long, long, long time for that to occur,” said Petro, who co-authored a book with his wife Nancy about wrongful convictions. David Owens, whose firm Loevy & Loevy represents wrongfully convicted clients and represented Gillispie, said they believe $45 million sets an Ohio record. It is unclear if Miami Township or Moore will seek to appeal the case or when Gillispie might receive payment. Share this:FacebookEmailTwitterLike Loading... 5 Comments Posted in Uncategorized The National Registry of Exonerations Releases Grim, Eye-Opening Report Posted on June 14, 2021 by Nancy Petro | 1 comment This month our nation exceeded 25,000 years lost to wrongful convictions. The human suffering associated with the wrongful conviction and imprisonment of 2,795 innocent people is incalculable. Without the research and reporting of the National Registry of Exonerations (NRE), we likely would not know of or comprehend the truth or implications of this horrific milestone. The report, “25,000 Years Lost to Wrongful Convictions” released today quantifies the reality of a justice system making its most egregious error: convicting an innocent person. The NRE defines an exoneree as a “person who was convicted of a crime and later officially declared innocent of that crime, or relieved of all legal consequences of the conviction because evidence of innocence that was not presented at trial required reconsideration of the case.” The NRE has focused on exonerations since 1989. Here are a few highlights from the report: • On average, each exoneree spent more than 8 years and 11 months in prison before release. Black exonerees spent 10.4 years in prison on average, whereas white exonerees spent an average of 7.5 years. Averages alone do not immediately reveal, for example, that 183 people spent 25 years or more in prison before they were exonerated of crimes they did not commit. • Innocent Black defendants served a majority of the prison time, 14,525 of the 25,004 years at the writing of the report. • Governments have paid more than $2.9 billion in compensation, and yet more than half of the exonerated have received nothing. As with the NRE’s research on racial identification among the wrongly convicted, the work of reporting and studying every known exoneration in the United States since 1989, has shined light on injustices that can accompany wrongful conviction. Racial and economic injustice shows up in exoneration research. Ronnie Long, convicted of a 1976 rape he didn’t commit in North Carolina, spent nearly 44 years in prison before his exoneration in 2020. The report notes, as the NRE does in every exoneration, what contributed to his wrongful conviction. In Mr. Long’s case, the contributors were “official misconduct, mistaken eyewitness testimony, perjury, and false forensic evidence.” The injustice of excessive sentencing is also revealed in exonerations. Lawrence Martin spent nearly 19 years in prison for the non-violent “crime” of possession of a knife with a locking blade. Sentenced under California’s “Three Strikes” law, he got a life sentence for possessing this knife. According to the report, the California Supreme Court “ruled that police and prosecutors were applying an overly broad definition of a locking blade. In effect, Martin had committed no crime at all.” He was exonerated of this non-crime in 2020. The injustice of not being compensated for the loss of freedom, opportunity, reputation, pursuit of happiness, etc. due to the state’s error or misconduct is also addressed in the report, which references the work of Professor Jeffrey Gutman of the George Washington University Law School. Professor Gutman has conducted a comprehensive study of the compensation received by those in the exoneration registry. The number of years lost to wrongful convictions is staggering but, in fact, an understatement. The report stresses that this calculation refers to only those exonerations we know about. ”The vast majority of false convictions go uncorrected and therefore are never counted.” The milestone does not include large group exonerations prompted by evidence of systemic official misconduct, nor the time spent in custody before trial. In addition to including five noteworthy cases, the report concludes by noting the continuing trend of the establishment of conviction integrity units (CIUs), often in prosecutors’ offices, that are tasked with reviewing and reinvestigating case with credible claims of innocence. There are now 85 CIUs, mostly in large cities but also now statewide in six states. The report notes that since the death of George Floyd on May 25, 2020, “our criminal justice system has been the focus of intense — and well-deserved — scrutiny,” concluding that reducing wrongful convictions, correcting the state’s past wrongs, and recognizing the state’s responsibilities to the wrongfully convicted both financially and in other support, are important components of reform efforts. Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Uncategorized Tagged wrongful conviction Prosecutorial and Police Misconduct – A Continuing Travesty Posted on February 16, 2021 by Phil Locke | 3 comments Prosecutorial and police misconduct – we’ve been preaching about those things on this site for a long time now, and there doesn’t appear to be an end in site – at least not yet. David Leonhardt of the New York Times just wrote a very illuminating article on this subject, and I append it for you here: February 16, 2021 By David Leonhardt Good morning. We look at two men who spent decades behind bars for crimes they didn’t commit. ‘No consequences’ Curtis Flowers’s day typically began around 4:30 a.m., when a prison guard slid a breakfast tray into his cell. The tray often included a biscuit, potatoes, oatmeal or grits — “a bunch of starch,” as Flowers said to me recently, with a quiet laugh. Sometime after 8 a.m., the guards led him from his cell to a small outdoor pen where he was permitted to exercise, look up at the sky and talk to other death-row inmates in nearby pens. The pen was large enough for him to take three steps in one direction and two steps in another. “Walking in circles, you get dizzy real quick,” Flowers said. After an hour in the pen — sometimes less — he returned to his cell for the rest of the day. There, he read books, wrote letters, watched television and talked with the guards or fellow prisoners through the bars. Flowers lived like this for more than 20 years, on death row in Mississippi — despite there being no good evidence that he committed the crime, a 1996 quadruple murder in a furniture store, for which he was convicted. He was a victim of prosecutor misconduct. A local district attorney, Doug Evans, convicted Flowers on weak evidence that later fell apart: To this day, no witness or physical evidence even puts Flowers at the scene of the crime. The U.S. Supreme Court threw out his conviction in 2019, citing Evans’s blocking of Black jurors. Last year, the state of Mississippi dropped all charges. When I spoke to Flowers by Zoom recently, I was awed by his grace. He has spent nearly half his life behind bars, and in 2018 was denied a request to attend his mother’s funeral, but he conveys a calm cheerfulness. “Just doing little things to make me happy,” he said, like bass fishing. Curtis FlowersDavid Doobinin Still, there was one subject that sparked passion in him: the consequences — or lack thereof — for Evans, as well as for some of his friends still locked up in Parchman Farm prison. Flowers told me that while he believed many people at Parchman were guilty, others are there because of Evans’s misconduct. “It’s terrible,” Flowers said. Yet Evans remains the top prosecutor for seven Mississippi counties. He “has faced no adverse consequences for his handling of the case,” as Parker Yesko — a member of the “In the Dark” podcast team that exposed the holes in the case — has written. What would change look like? In recent years, a movement known as criminal justice reform has sprung up, supported by both conservatives and progressives. Its biggest goal is reducing the number of Americans behind bars — which is currently above two million, giving the U.S. the world’s highest incarceration rate. Another goal is to introduce more accountability for prosecutors and detectives found to have committed misconduct, creating incentives to avoid unjust convictions. “Prosecutors can misbehave with impunity, facing virtually no consequences even when a judge says they have committed substantive misconduct,” Shaila Dewan, a Times reporter covering criminal justice, told me. My colleague Jan Ransom has published a gripping account of another case of potential misconduct. It takes place in the Bronx and involves Huwe Burton, whose mother was stabbed to death in 1989, when he was 16. Three detectives coaxed a false confession out of him, using a mix of threats and lies, and he spent almost 20 years in prison. A judge has since exonerated him. Huwe BurtonElias Williams for The New York Times Darcel Clark, the Bronx district attorney, is now conducting an inquiry into whether the three detectives’ tactics tainted 31 other homicide cases. The detectives have denied wrongdoing, and Clark has suggested they were following “standard procedure” at the time. Still, Jan writes, “the inquiry highlights how a new generation of prosecutors in New York and elsewhere is delving deeply into whether deceptive police interrogation tactics might have warped the criminal justice system.” In the Bronx and some other places, prosecutors have formed units to review old cases and tried to bar problematic police officers from testifying. Prosecutors and police officers have tough jobs and sometimes make honest mistakes, as Nina Morrison of the Innocence Project, which helped free Burton, has noted. But outright misconduct is more frequent than many people realize. It played a role in more than half of the 2,400 exonerations documented nationwide over the last three decades. “For Black men wrongly convicted of murder, the proportion was 78 percent,” Jan writes. Toward the end of my conversation with Flowers, I asked him what he thought should happen to prosecutors like Evans who have committed misconduct. Flowers replied that they should be subject to the same punishment they have inflicted on others. “It sucks to be behind bars,” he said, “and I don’t think he would want to sit back there.” For more on Flowers: You can watch a “60 Minutes” segment or listen to “In the Dark,” both of which include interviews with both Evans and Flowers. For more on Burton: I recommend taking a few minutes to read Jan Ransom’s story. Share this:FacebookEmailTwitterLike Loading... 3 Comments Posted in Uncategorized The National Registry of Exonerations Releases 2019 Annual Report with Implications Heightened by COVID-19 Concerns Posted on March 31, 2020 by Nancy Petro | Leave a comment The National Registry of Exonerations 2019 Annual Report, a must-read for advocates of criminal justice reform, offers important insights on wrongful conviction at a particularly distressful time for our nation and the incarcerated. “Right now, there are likely thousands of innocent people in U.S. jails and prisons as a result of wrongful convictions. It is hard to imagine the horror of being incarcerated today – innocent or guilty – as the COVID-19 virus is spreading through these closed spaces and threatening lives,” said Barbara O’Brien, the report’s author, who is law professor at Michigan State University and editor of the National Registry. Read the report here. Key takeaways: How many? The Registry recorded 143 exonerations achieved in 2019. The total of known exonerations from 1989 until year-end 2019 was 2,556. How many years stolen? Last year set a sobering new record in the number of years wrongfully convicted persons served for crimes they did not commit before they were exonerated and released: on average 13.3 years. In total, 1,908 years were stolen from the year’s exonerees, which brought the total years lost since 1989 to more than 22,000 years. The year recorded an unusual number of cases in which innocent people served sentences of more than 30 years. Ten of the Registry’s 52 cases involving serving more than 30 years in prison were added in 2019. What crimes were involved? Of the 143 exonerations, 117 were of violent crimes, including homicide (76 cases), child sex abuse (10), and sexual assault on adults (11). Three of those wrongfully convicted of homicide had been sentenced to death. In 50 exonerations, no crime was actually committed. Why were innocent people convicted of crimes they didn’t commit? The top three contributors to wrongful conviction in the 2019 exonerations were perjury or false accusation (contributed in 101 of the 143 cases); official misconduct (93); and mistaken witness identification (48). Defendants offered guilty pleas in 34 exonerations and gave false confessions in 24 cases. Who helped achieve the year’s exonerations? Conviction Integrity Units (CIU’s) or Innocence Projects prompted exonerations in 87 of the year’s exonerations. The important trend of the increasing establishment of Conviction Integrity Units within prosecutorial offices continued in 2019. The year also witnessed a promising new development — attorneys general in Michigan and New Jersey launched statewide CIUs. (Pennsylvania’s attorney general also laun"
