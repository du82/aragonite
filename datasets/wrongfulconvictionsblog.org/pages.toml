full_description = "Author Archives: Carey Hoffman New exoneree Charles Jackson preps for life-saving mission Posted on September 7, 2019 | Leave a comment Absolved finally of taking a life, Charles Jackson now has his sights set on saving one. Charles received the life-changing news at the end of last week that prosecutors in Cuyahoga County had finally decided to dismiss the charges against him for a 1991 double-shooting that left a man dead – a crime for which he had already wrongfully served 27 years in prison. Charles Jackson this summer with OIP staff attorney Mallorie Thomas. Last November, a judge in Cleveland overturned his conviction, giving him back his freedom but with the prospect looming that the state could decide to try him again. The decision to dismiss the charges means that a retrial scheduled to convene this month isn’t going to happen, and that Charles officially joins the ranks of 27 other exonerees freed through the work of the Ohio Innocence Project, based in the University of Cincinnati College of Law. (He was officially added to the National Registry of Exonerations on Wednesday. You can read his profile with full details of his case at http://www.law.umich.edu/special/exoneration/pages/casedetail.aspx?caseid=5605) It also means he can travel to Jacksonville, Fla., where his nephew, Houston Foster, is now residing. Houston Foster is suffering with advanced kidney disease, to the point he can no longer work nor travel. After testing this spring following his release, Charles turned out to be a match for donating the kidney that Houston needs. Now he’s making plans for an extended trip to Florida for the transplant of one of his kidneys to Houston. Continue reading → Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Uncategorized OIP Fellows this summer feature international flavor Posted on July 9, 2019 | Leave a comment If you’ve followed the Ohio Innocence Project for an extended period of time, you are probably aware that summer is one of the busiest periods around the OIP offices. The break between the end of spring semester in May and the beginning of fall semester in August is when students selected as OIP Fellows go through their most intensive period of working on cases that could be candidates for exoneration. The 22 UC law students who are in this year’s cohort of Fellows have been joined by a group of international law students eager to gain exposure to the innocence movement in the United States. Continue reading → Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Uncategorized ‘Blind Injustice’ set to premiere to sold-out run at Cincinnati Opera Posted on July 9, 2019 | 1 comment “Very rarely in life are we given a gift as precious as this one. It’s humbling to tell a story from people who have suffered so much, rallied so much and given us so much to believe in, in terms of what they are capable of in the best sense of survival.” Survival. Perseverance. Justice. Renewal. It sounds like the stuff of a screenplay. In this case, though, it’s opera, which introduces the creative possibilities of storytelling using music, story and song. The finished product, “Blind Injustice,” makes its world premiere this month. The much-anticipated production by the Cincinnati Opera in Music Hall’s Wilks Studio will have five performances between July 22-27, and all are sold out. (A special preview event on July 17 at Allen Temple A.M.E. Church in Roselawn will feature several excerpts from the opera, along with a discussion with exonerees whose stories are part of the production and the creative team behind “Blind Injustice.” The July 17 event is free, but tickets must be reserved in advance.) The opera is an adaptation from a book written by Ohio Innocence Project co-founder and director Mark Godsey. It explores the psychology behind wrongful convictions while also drawing on specific experiences from OIP exonerees. For the creative team charged with developing the opera, it has been a challenging and emotional process. Continue reading → Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Uncategorized Ohio Gov. Kasich signs landmark law on compensation for wrongful conviction Posted on December 21, 2018 | 1 comment A landmark moment for wrongfully convicted Ohioans arrived today, promising a measure of justice and smoother integration back into society, when Ohio Gov. John Kasich signed into law House Bill 411. The new law opens the door for a number of exonerees to receive financial compensation for the years they spent wrongfully imprisoned, and certain hurdles that in the past have thrown the question of compensation being received into question have now been removed from the process. The Ohio Statehouse “Protecting the rights and freedom of our citizens is my top priority, and when those rights are violated we have a responsibility to take action,” said Rep. Emilia Strong Sykes (D-Akron), one of the sponsors of the bipartisan bill, along with Rep. Bill Seitz (R-Cincinnati). “Thanks to this bipartisan effort, Ohioans who have been wrongfully imprisoned will soon have a better path forward to reclaim their lives and receive the justice they deserve,” Sykes added. The bill was sponsored in the Ohio Senate by Sen. John Eklund (R-18th District) and Sen. Vernon Sykes (D-28th District). The new law specifically addresses those cases where convictions were obtained despite what are known as Brady violations. Those are cases where it is ruled that the prosecution illegally withheld evidence that could point to the real perpetrators of the crime. “The collaborative effort behind House Bill 411 led to a narrow but important piece of legislation that drew bipartisan support in both chambers of the Ohio Legislature,” said Pierce Reed, program director of the Ohio Innocence Project (OIP) and one of the most active advocates in helping the legislation to advance. “After more than a year of debate, the overwhelming majority of legislators recognized the impact of Brady violations on the lives of Ohioans and the need to provide eligibility for compensation to innocent men and women whose convictions were tainted by violations of their fundamental rights to a fair trial.” Continue reading → Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Uncategorized International Association of Chiefs of Police (IACP) and Innocence Organizations to Educate Criminal Justice Stakeholders on Psychological Factors that Contribute to Wrongful Convictions Posted on November 19, 2018 | Leave a comment New Video Series Supplements Trainings for Law Enforcement and Others Working in Criminal Justice The International Association of Chiefs of Police is joining the Innocence Project, the Ohio Innocence Project and other members of the Innocence Network to release a series of videos to educate law enforcement and criminal justice professionals about the psychological phenomena that can impede criminal investigations and prosecutions, and lead to wrongful convictions. The seven videos feature leading experts discussing how to recognize psychological factors, such as memory malleability and implicit bias, that affect investigations and prosecutions as well as highlighting some of the safeguards that can be employed to prevent wrongful convictions. The videos are available at law.uc.edu/human-factors.html. IACP has been a leader in promoting reforms that reduce wrongful convictions, as far back as 2006 with the release of a key training on eyewitness identification, in 2010 and 2016 with the releases of model policies, in 2013 with the summit on wrongful convictions and in 2017 with the production of a roll call video series on eyewitness identification. “Law enforcement officials are human and are susceptible to the same psychological phenomena that can adversely affect decision-making,” said Paul M. Cell, president of the IACP. “We are excited to be partnering with innocence organizations to make these videos available because education and training are critical to ensuring that these phenomena don’t adversely affect investigations.” The videos focus on human flaws that have been proven to contribute to wrongful conviction, and ere designed to complement trainings for stakeholders from all corners of the criminal justice community, from law enforcement to crime lab personnel to prosecutors and defense lawyers. “While these videos were designed to be used in conjunction with more thorough trainings, we wanted to make them more broadly available online so they are accessible at all times to remind people working in criminal justice to be more aware of the psychological traps that can undermine even the most dedicated and diligent actors,” said Mark Godsey, director of the Rosenthal Institute for Justice/Ohio Innocence Project. Rebecca Brown, policy director of the Innocence Project which is affiliated with the Cardozo School of Law, added: “Presenting the psychological factors that contribute to human error in a neutral manner by experts with deep knowledge of the criminal justice system will hopefully encourage a dialogue among professionals, including police, prosecutors, forensic examiners, and defense lawyers, and encourage them to ask themselves and each other if any of these factors may be influencing their work.” For online access to the videos and more information, visit law.uc.edu/human-factors.html. Below is a short description of the seven videos: Confirmation Bias – Dr. Sherry Nakhaeizadeh explains how people tend to interpret evidence in a way that confirms their assumptions and preconceptions. Memory Malleability – Dr. Elizabeth Loftus discusses how memory is constructed and how it is susceptible to being manipulated by false information. Eyewitness Misidentification – Dr. Jennifer Dysart explains how memory affects identification and how to prevent eyewitness misidentifications. False Confessions – Dr. Saul Kassin explains how interrogation techniques can cause innocent people to falsely confess to crimes they didn’t commit. Lie Detection and Demeanor Evidence – Dr. Par-Anders Granhag exposes the myth that it is possible to tell whether or not someone is being truthful from their physical ticks and mannerisms. Tunnel Vision – Retired Detective Jim Trainum explains the harm of focusing on a single or limited police or prosecutorial theory and seeking only evidence that confirms that particular theory. Implicit Bias – Professor L. Song Richardson explains how personal experiences shape our views and can result in unintentional bias. For inquiries about further information on this project, contact: Julia Lucivero, 212-364-5371, jlucivero@innocenceproject.org Sarah Guy, 703-647-7226, guy@theiacp.org Carey Hoffman, 513-289-1379, Ohio Innocence Project Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Eyewitness identification, False confessions, Forensic controls, forensic science, Junk science, Reforming/Improving the system, wrongful conviction Lessons of Wrongful Convictions: A Parent/Child Perspective Posted on November 4, 2018 | 2 comments (Editor’s note: The author, Carey Hoffman, is Director of Communications for the Ohio Innocence Project.) Every parent aspires for the best for their child. That was true for Rickey Jackson’s parents. It was also true for Harold Franks, the Cleveland salesman killed in 1975 that Jackson and two friends were wrongfully convicted of murdering. Of course, it is just as true for myself and my wife with our two daughters. Rickey Jackson in 2014, moments after a court ordered his release after 39 years in prison. That’s why I was pleased our youngest, Emily, a junior at Miami University, was going to have the opportunity to hear Rickey Jackson speak when he visited her campus in October as part of a program put on by the Miami chapter of OIP-u, one of seven chapters at Ohio universities that serve as undergraduate advocacy organizations affiliated with the Ohio Innocence Project. The realities of four decades lost to injustice can become very hard to miss when their embodiment is sitting 15 feet away from you, telling you a story of a life’s journey that you’ll never forget. Continue reading → Share this:FacebookEmailTwitterLike Loading... 2 Comments Posted in Exonerations, Eyewitness identification, incentivized witnesses, Life after exoneration, wrongful conviction New 360-degree Video Experience Allows Viewers to Step Into the Shoes of the Wrongfully Convicted Posted on October 2, 2018 | Leave a comment Only the people who have been through it can truly understand the experience of having been wrongfully convicted and sent to prison. But a new, 360-degree immersive video will allow viewers to gain greater understanding than ever before of what it is to “walk a mile in my shoes” when you are an exoneree who spent almost 40 years in prison. That is the experience of Rickey Jackson of Cleveland, Ohio, who was exonerated in 2014. One of the longest-serving exonerees in U.S. history, the realities of his surreal, new post-prison life can be uniquely understood through the release of “Send Me Home,” a 360-degree video experience conceived and produced by Lonelyleap Film. “Send Me Home” invites participants to take a journey in 360 degrees, as Rickey grants us entry into his private world, guiding us through time gone, family known and the spaces he lovingly embraces today. The 360-degree video transports participants into Rickey’s mindspace, urging them to reflect on the expanse of their own lives in relation to the time Rickey has lost. Rickey was represented by the Ohio Innocence Project, which ultimately secured his release from a death sentence that began with a wrongful conviction in a 1975 murder case. Continue reading → Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Exonerations, Film/Cinema, Life after exoneration, wrongful conviction NBA Coaches Join Awareness Effort for Wrongful Conviction Day 2018 Posted on October 2, 2018 | Leave a comment Today, Oct. 2, is Wrongful Conviction Day — the annual international observance dedicated to ending wrongful convictions and highlighting the plight of those convicted of crimes they did not commit. This year, Wrongful Conviction Day is highlighting the role that racial bias plays in wrongful convictions and the efforts to fix the criminal justice system in its entirety. Created by the Innocence Network in 2014, Wrongful Conviction Day aims to raise awareness of the causes and remedies of wrongful conviction and to recognize the tremendous personal, social and emotional costs of wrongful conviction for innocent people and their families. “Wrongful Conviction Day is not only part of a movement, it is also always a personal day for everyone who works on behalf of the Ohio Innocence Project,” says Mark Godsey, the OIP’s co-founder and director. Continue reading → Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Eve"
