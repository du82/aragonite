description = "Nancy Petro is co-author with her husband Jim Petro, former Attorney General of Ohio, of False Justice - Eight Myths that Convict the Innocent—Kaplan Publishing, 2011; Peking University Press (Chin…"
full_description = "Author Archives: Nancy Petro ← Older posts The National Registry of Exonerations Releases Grim, Eye-Opening Report Posted on June 14, 2021 | 1 comment This month our nation exceeded 25,000 years lost to wrongful convictions. The human suffering associated with the wrongful conviction and imprisonment of 2,795 innocent people is incalculable. Without the research and reporting of the National Registry of Exonerations (NRE), we likely would not know of or comprehend the truth or implications of this horrific milestone. The report, “25,000 Years Lost to Wrongful Convictions” released today quantifies the reality of a justice system making its most egregious error: convicting an innocent person. The NRE defines an exoneree as a “person who was convicted of a crime and later officially declared innocent of that crime, or relieved of all legal consequences of the conviction because evidence of innocence that was not presented at trial required reconsideration of the case.” The NRE has focused on exonerations since 1989. Here are a few highlights from the report: • On average, each exoneree spent more than 8 years and 11 months in prison before release. Black exonerees spent 10.4 years in prison on average, whereas white exonerees spent an average of 7.5 years. Averages alone do not immediately reveal, for example, that 183 people spent 25 years or more in prison before they were exonerated of crimes they did not commit. • Innocent Black defendants served a majority of the prison time, 14,525 of the 25,004 years at the writing of the report. • Governments have paid more than $2.9 billion in compensation, and yet more than half of the exonerated have received nothing. As with the NRE’s research on racial identification among the wrongly convicted, the work of reporting and studying every known exoneration in the United States since 1989, has shined light on injustices that can accompany wrongful conviction. Racial and economic injustice shows up in exoneration research. Ronnie Long, convicted of a 1976 rape he didn’t commit in North Carolina, spent nearly 44 years in prison before his exoneration in 2020. The report notes, as the NRE does in every exoneration, what contributed to his wrongful conviction. In Mr. Long’s case, the contributors were “official misconduct, mistaken eyewitness testimony, perjury, and false forensic evidence.” The injustice of excessive sentencing is also revealed in exonerations. Lawrence Martin spent nearly 19 years in prison for the non-violent “crime” of possession of a knife with a locking blade. Sentenced under California’s “Three Strikes” law, he got a life sentence for possessing this knife. According to the report, the California Supreme Court “ruled that police and prosecutors were applying an overly broad definition of a locking blade. In effect, Martin had committed no crime at all.” He was exonerated of this non-crime in 2020. The injustice of not being compensated for the loss of freedom, opportunity, reputation, pursuit of happiness, etc. due to the state’s error or misconduct is also addressed in the report, which references the work of Professor Jeffrey Gutman of the George Washington University Law School. Professor Gutman has conducted a comprehensive study of the compensation received by those in the exoneration registry. The number of years lost to wrongful convictions is staggering but, in fact, an understatement. The report stresses that this calculation refers to only those exonerations we know about. ”The vast majority of false convictions go uncorrected and therefore are never counted.” The milestone does not include large group exonerations prompted by evidence of systemic official misconduct, nor the time spent in custody before trial. In addition to including five noteworthy cases, the report concludes by noting the continuing trend of the establishment of conviction integrity units (CIUs), often in prosecutors’ offices, that are tasked with reviewing and reinvestigating case with credible claims of innocence. There are now 85 CIUs, mostly in large cities but also now statewide in six states. The report notes that since the death of George Floyd on May 25, 2020, “our criminal justice system has been the focus of intense — and well-deserved — scrutiny,” concluding that reducing wrongful convictions, correcting the state’s past wrongs, and recognizing the state’s responsibilities to the wrongfully convicted both financially and in other support, are important components of reform efforts. Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Uncategorized Tagged wrongful conviction The National Registry of Exonerations Releases 2019 Annual Report with Implications Heightened by COVID-19 Concerns Posted on March 31, 2020 | Leave a comment The National Registry of Exonerations 2019 Annual Report, a must-read for advocates of criminal justice reform, offers important insights on wrongful conviction at a particularly distressful time for our nation and the incarcerated. “Right now, there are likely thousands of innocent people in U.S. jails and prisons as a result of wrongful convictions. It is hard to imagine the horror of being incarcerated today – innocent or guilty – as the COVID-19 virus is spreading through these closed spaces and threatening lives,” said Barbara O’Brien, the report’s author, who is law professor at Michigan State University and editor of the National Registry. Read the report here. Key takeaways: How many? The Registry recorded 143 exonerations achieved in 2019. The total of known exonerations from 1989 until year-end 2019 was 2,556. How many years stolen? Last year set a sobering new record in the number of years wrongfully convicted persons served for crimes they did not commit before they were exonerated and released: on average 13.3 years. In total, 1,908 years were stolen from the year’s exonerees, which brought the total years lost since 1989 to more than 22,000 years. The year recorded an unusual number of cases in which innocent people served sentences of more than 30 years. Ten of the Registry’s 52 cases involving serving more than 30 years in prison were added in 2019. What crimes were involved? Of the 143 exonerations, 117 were of violent crimes, including homicide (76 cases), child sex abuse (10), and sexual assault on adults (11). Three of those wrongfully convicted of homicide had been sentenced to death. In 50 exonerations, no crime was actually committed. Why were innocent people convicted of crimes they didn’t commit? The top three contributors to wrongful conviction in the 2019 exonerations were perjury or false accusation (contributed in 101 of the 143 cases); official misconduct (93); and mistaken witness identification (48). Defendants offered guilty pleas in 34 exonerations and gave false confessions in 24 cases. Who helped achieve the year’s exonerations? Conviction Integrity Units (CIU’s) or Innocence Projects prompted exonerations in 87 of the year’s exonerations. The important trend of the increasing establishment of Conviction Integrity Units within prosecutorial offices continued in 2019. The year also witnessed a promising new development — attorneys general in Michigan and New Jersey launched statewide CIUs. (Pennsylvania’s attorney general also launched one in early 2020.) The annual report provides more than important numbers and analysis that can inform reforms and advances. It also tells the extraordinary stories of exonerees and unthinkable injustice. These horrific cases should motivate Americans to continue all efforts that will reduce wrongful conviction and, armed with this important research, dispel the arguments of those who resist meaningful reforms. The National Registry of Exonerations — a joint project of the University of California Irvine Newkirk Center for Science & Society, the University of Michigan Law School, and the Michigan State University College of Law — once again has clarified wrongful conviction with the inescapable conclusion that we can and must advance toward a more accurate and just criminal justice system. Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Commissions/Innocence Commissions/Governmental Case Review Agencies, Conviction Integrity Units, Editorials/Opinion, Exonerations, Eyewitness identification, False confessions, Prosecutorial conduct (good and bad), Reforming/Improving the system, Scholarship, wrongful conviction Tagged National Registry of Exonerations Genetic DNA analysis prompts likely exoneration in Idaho murder case Posted on July 13, 2019 | 1 comment Christopher Tapp, who spent two decades behind bars for the 1996 rape and murder of Idaho Falls resident, Angie Dodge, is expected to be exonerated this week. As reported in the Post Register, unreliable evidence — a coerced confession and testimony from a witness who later recanted and claimed police pressured her — prompted the jury’s guilty verdict in 1997. But Tapp’s nightmare is expected to end in a hearing before Seventh District Judge Alan Stephens on Wednesday, July 17, thanks to a newer use of DNA, genetic DNA analysis. In prison Tapp maintained his innocence — the crime scene DNA did not match him — and unsuccessfully petitioned the courts five times for post-conviction relief. His recent sixth petition is supported by a filing from Bonneville County Prosecuting Attorney Daniel Clark, who has asked that Tapp’s conviction be vacated, opining, “There exists clear and convincing evidence that (Tapp) was convicted of a crime he did not commit.” What caused this reversal of official response to Tapp’s petitions for relief? Genetic DNA analysis led to the identification of Angie Dodge’s across-the-street neighbor, Brian Leigh Dripps, who admitted he committed the crime, acted alone, and had never met Christopher Tapp. A related news report by Local News 8 ABC reported that Idaho Falls Police Chief Bryce Johnson said genetic investigation led to someone in the Dripps family tree. Utilizing crime scene DNA, a genealogist identified three people in the Dripps family related to the suspect on a genealogy website. Police surveillance enabled retrieval and analysis of a discarded cigarette butt to confirm the DNA match with Brian Dripps. He has been charged with the crime. Expanded use of DNA in genetic analysis resulting in the identification of the perpetrator is noteworthy in this tragic wrongful conviction case. Additionally, Tapp had agreed in 2017 to a deal with prosecutors in which he would be released from prison on time served with the rape charge dropped, but with the onerous murder conviction remaining on his record. On Wednesday along with Tapp’s expected exoneration, this later travesty of justice will also be rectified. The Idaho Innocence Project is to be commended for pursuing justice in this case for a decade. Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Exonerations, False confessions, forensic science, New Evidence, Post-conviction relief, wrongful conviction Tagged Christopher Tapp, Genetic DNA analysis, Idaho Innocence Project Annual Exonerations Report: A record number of years lost by those exonerated in 2018 Posted on April 9, 2019 | 1 comment A record 1,639 years were lost in prison by those wrongly convicted and exonerated in 2018, according to “Exonerations in 2018,” the annual report of The National Registry of Exonerations (NRE). The 151 persons exonerated in 2018 spent an average of 10.9 years wrongly incarcerated before exoneration. The report highlights milestones, trends, and the year’s specific exoneration takeaways. For example, in September 2018 the total number of years lost by exonerees exceeded the milestone of 20,000. As of today, that number is 21,095 lost years for the 2,418 persons known to have been exonerated since 1989. One highlight of 2018 was an extraordinary 31 defendants exonerated as a result of the scandal in Chicago stemming from an era of police corruption led by Sergeant Ronald Watts in which defendants were framed by police on drug and weapons charges. Reinvestigation of these cases — 30 of which were drug crimes — prompted the exonerations. The Registry notes contributors to wrongful conviction in each case of exoneration. The 31 Chicago cases were included in at least 107 cases involving official misconduct, a Continue reading → Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Compensation/Exoneree compensation, Conviction Integrity Units, Exonerations, Eyewitness identification, False confessions, Police conduct (good and bad), Post-conviction relief, Prosecutorial conduct (good and bad), Reforming/Improving the system, Scholarship, wrongful conviction Tagged The National Registry of Exonerations NRE’s Newest Report: Years Lost, Human and Other Resources Squandered Posted on September 11, 2018 | 2 comments The National Registry of Exonerations’ latest report reveals a staggering 20,080 years lost behind bars since 1989 by victims of wrongful conviction and, in an accompanying report, $2.2 billion in compensation paid to exonerees by governments, even though more than half of exonerees have never been compensated. Radley Balko of The Washington Post provides this informative preview opinion of the soon-to-be-released report. Thanks to the National Registry of Exonerations for revealing indisputable data that continues to be a blaring, heartbreaking call for criminal justice reform. Share this:FacebookEmailTwitterLike Loading... 2 Comments Posted in Compensation/Exoneree compensation, Editorials/Opinion, Exonerations National Registry of Exonerations Releases Record-Filled Annual Report for 2017 Posted on March 14, 2018 | 2 comments The National Registry of Exoneration has reported 139 exonerations — cases in which convictions were officially vacated as a result of new evidence of innocence — in 2017. A significant finding in the Annual Report (here) is that in 84 of these cases, misconduct by police, prosecutors, or other government officials factored in the wrongful conviction, an all-time record for official misconduct as a contributor to wrongful convictions later vacated through exoneration. But there was also encouraging evidence of increasing activism in achieving exonerations by prosecutorial offices through the work of Conviction Integrity Units (CIUs). The annual report provides a detailed analysis of exonerations in 2017. Perjury or false accusation factored in a record 87 cases, 62 percent. Another record 29 or 20 percent of exonerations involved a false confession. And mistaken eyewitness identification impacted a record 37 cases, 26 percent. Fifty-one defendants were exonerated of homicide, twenty-nine of sex crimes, eighteen of other violent crimes, forty-one of non-violent crimes such as fraud, Continue reading → Share this:FacebookEmailTwitterLike Loading... 2 Comments Posted in Commissions/Innocence Commissions/Governmental Case Review Agencies, Conviction Integrity U"
