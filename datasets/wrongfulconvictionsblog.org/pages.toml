full_description = "Author Archives: Phil Locke ← Older posts Dean Gillispie Wins $45 Million for Wrongful Conviction Posted on December 21, 2022 | 5 comments . Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years LAURA A. BISCHOFF November 22, 2022, 10:56 AM Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years COLUMBUS, Ohio – An Ohio man won $45 million in a civil lawsuit against a police department and detective whose actions led to his wrongful conviction and more than 20 years behind bars. Dean Gillispie sued Miami Township police and former detective Scott Moore for suppressing evidence and tainting eyewitness identifications in the 1991 rape and kidnapping case against Gillispie. Gillispie was convicted in 1991 in Montgomery County and released from prison in 2011. The Ohio Innocence Project at the University of Cincinnati law school, former Ohio Attorney General Jim Petro and Dean’s mother, Juana Gillispie, worked to free him and clear his name. Today, Gillispie is 57, and lives in Fairborn, a suburb of Dayton. “The horror inflicted on Dean and his family and community is hard to wrap your mind around,” Ohio Innocence Project Director Mark Godsey said. “The way the authorities pushed through a conviction and then fought back and refused to admit a mistake was so disappointing. Nothing can repay Dean for the horror.” He added: “The jury’s verdict sends a strong message that those in power need to change the way they do things.” “Justice prevailed in this case, although it took a long, long, long time for that to occur,” said Petro, who co-authored a book with his wife Nancy about wrongful convictions. David Owens, whose firm Loevy & Loevy represents wrongfully convicted clients and represented Gillispie, said they believe $45 million sets an Ohio record. It is unclear if Miami Township or Moore will seek to appeal the case or when Gillispie might receive payment. Share this:FacebookEmailTwitterLike Loading... 5 Comments Posted in Uncategorized Prosecutorial and Police Misconduct – A Continuing Travesty Posted on February 16, 2021 | 3 comments Prosecutorial and police misconduct – we’ve been preaching about those things on this site for a long time now, and there doesn’t appear to be an end in site – at least not yet. David Leonhardt of the New York Times just wrote a very illuminating article on this subject, and I append it for you here: February 16, 2021 By David Leonhardt Good morning. We look at two men who spent decades behind bars for crimes they didn’t commit. ‘No consequences’ Curtis Flowers’s day typically began around 4:30 a.m., when a prison guard slid a breakfast tray into his cell. The tray often included a biscuit, potatoes, oatmeal or grits — “a bunch of starch,” as Flowers said to me recently, with a quiet laugh. Sometime after 8 a.m., the guards led him from his cell to a small outdoor pen where he was permitted to exercise, look up at the sky and talk to other death-row inmates in nearby pens. The pen was large enough for him to take three steps in one direction and two steps in another. “Walking in circles, you get dizzy real quick,” Flowers said. After an hour in the pen — sometimes less — he returned to his cell for the rest of the day. There, he read books, wrote letters, watched television and talked with the guards or fellow prisoners through the bars. Flowers lived like this for more than 20 years, on death row in Mississippi — despite there being no good evidence that he committed the crime, a 1996 quadruple murder in a furniture store, for which he was convicted. He was a victim of prosecutor misconduct. A local district attorney, Doug Evans, convicted Flowers on weak evidence that later fell apart: To this day, no witness or physical evidence even puts Flowers at the scene of the crime. The U.S. Supreme Court threw out his conviction in 2019, citing Evans’s blocking of Black jurors. Last year, the state of Mississippi dropped all charges. When I spoke to Flowers by Zoom recently, I was awed by his grace. He has spent nearly half his life behind bars, and in 2018 was denied a request to attend his mother’s funeral, but he conveys a calm cheerfulness. “Just doing little things to make me happy,” he said, like bass fishing. Curtis FlowersDavid Doobinin Still, there was one subject that sparked passion in him: the consequences — or lack thereof — for Evans, as well as for some of his friends still locked up in Parchman Farm prison. Flowers told me that while he believed many people at Parchman were guilty, others are there because of Evans’s misconduct. “It’s terrible,” Flowers said. Yet Evans remains the top prosecutor for seven Mississippi counties. He “has faced no adverse consequences for his handling of the case,” as Parker Yesko — a member of the “In the Dark” podcast team that exposed the holes in the case — has written. What would change look like? In recent years, a movement known as criminal justice reform has sprung up, supported by both conservatives and progressives. Its biggest goal is reducing the number of Americans behind bars — which is currently above two million, giving the U.S. the world’s highest incarceration rate. Another goal is to introduce more accountability for prosecutors and detectives found to have committed misconduct, creating incentives to avoid unjust convictions. “Prosecutors can misbehave with impunity, facing virtually no consequences even when a judge says they have committed substantive misconduct,” Shaila Dewan, a Times reporter covering criminal justice, told me. My colleague Jan Ransom has published a gripping account of another case of potential misconduct. It takes place in the Bronx and involves Huwe Burton, whose mother was stabbed to death in 1989, when he was 16. Three detectives coaxed a false confession out of him, using a mix of threats and lies, and he spent almost 20 years in prison. A judge has since exonerated him. Huwe BurtonElias Williams for The New York Times Darcel Clark, the Bronx district attorney, is now conducting an inquiry into whether the three detectives’ tactics tainted 31 other homicide cases. The detectives have denied wrongdoing, and Clark has suggested they were following “standard procedure” at the time. Still, Jan writes, “the inquiry highlights how a new generation of prosecutors in New York and elsewhere is delving deeply into whether deceptive police interrogation tactics might have warped the criminal justice system.” In the Bronx and some other places, prosecutors have formed units to review old cases and tried to bar problematic police officers from testifying. Prosecutors and police officers have tough jobs and sometimes make honest mistakes, as Nina Morrison of the Innocence Project, which helped free Burton, has noted. But outright misconduct is more frequent than many people realize. It played a role in more than half of the 2,400 exonerations documented nationwide over the last three decades. “For Black men wrongly convicted of murder, the proportion was 78 percent,” Jan writes. Toward the end of my conversation with Flowers, I asked him what he thought should happen to prosecutors like Evans who have committed misconduct. Flowers replied that they should be subject to the same punishment they have inflicted on others. “It sucks to be behind bars,” he said, “and I don’t think he would want to sit back there.” For more on Flowers: You can watch a “60 Minutes” segment or listen to “In the Dark,” both of which include interviews with both Evans and Flowers. For more on Burton: I recommend taking a few minutes to read Jan Ransom’s story. Share this:FacebookEmailTwitterLike Loading... 3 Comments Posted in Uncategorized Ohio Chief Justice Convenes Wrongful Conviction Task Force Posted on February 15, 2020 | 7 comments One small step. https://www.wcpo.com/news/crime/ohio-chief-justice-convenes-wrongful-conviction-task-force Share this:FacebookEmailTwitterLike Loading... 7 Comments Posted in Uncategorized Amanda Knox Returns to Italy. Posted on June 15, 2019 | 4 comments Since her initial acquittal in Italy and return to the US in 2011, Amanda Knox has never returned to Italy. She has remained busy getting along with her life, writing, and in supporting movements dedicated to the pursuit of true justice. Until now. We wrote about the facts of her case on this blog in 2012 here. She returned to Italy this past week to speak at the Festival on Criminal Justice sponsored by the Italy Innocence Project in Modena, Italy. See the CNN story about her return here. Share this:FacebookEmailTwitterLike Loading... 4 Comments Posted in Events, Junk science, Life after exoneration, Reforming/Improving the system, wrongful conviction, Wrongfully Convicted Women Two Florida Men Freed After 42 Years in Prison for a Murder They Didn’t Commit Posted on March 29, 2019 | 4 comments Clifford Williams and Hubert Myers were convicted of murdering a woman while they were at a party in Jacksonville, Florida. Two women were shot in a nearby apartment, one of them fatally. The men were quickly arrested, convicted and sentenced to life in prison after a 2-day trial. The state of Florida has recently dropped all charges and freed them. See the CNN story here: https://www.cnn.com/2019/03/29/us/florida-wrongful-imprisonment-42-years-murder/index.html Share this:FacebookEmailTwitterLike Loading... 4 Comments Posted in Conviction Integrity Units, Exonerations, wrongful conviction Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million Posted on March 6, 2019 | 4 comments “Six people were convicted of a murder they didn’t even remember. Now a county owes them $28 million.” Six people convicted of brutally raping and killing an elderly woman, but none of them had any memory of the crime . . . because they were innocent. And if that’s not bad enough, here’s the really scary part – the police actually convinced three of them that they were guilty! See the story from the Washington Post: https://www.washingtonpost.com/nation/2019/03/06/six-people-were-convicted-murder-they-didnt-even-remember-now-county-owes-them-million/?noredirect=on&utm_term=.51ac6b22a0a1 Share this:FacebookEmailTwitterLike Loading... 4 Comments Posted in Compensation/Exoneree compensation, Exonerations, False confessions, Junk science, Police conduct (good and bad), Post-conviction relief, Prosecutorial conduct (good and bad), wrongful conviction Not All Teens Who Confess Are Guilty Posted on June 13, 2018 | 12 comments We have previously addressed the subject false confession a number of times on this blog. Please see False Confessions – How Can That Happen? One of the very egregious cases of false confession we talked about was that of Marty Tankleff, who at 17, was manipulated by police interrogators into falsely confessing to the murder of his parents. After 18 years of wrongful imprisonment, Marty became a lawyer; and a law professor. Marty has recently authored an article on CNN about false confessions by teenagers, who are particularly vulnerable. Please see the CNN story by Marty Tankleff here. Share this:FacebookEmailTwitterLike Loading... 12 Comments Posted in False confessions, Police conduct (good and bad), Reforming/Improving the system, wrongful conviction Exonerated After 45 Years in Prison Posted on March 30, 2018 | 4 comments He was 27 when he went in. Now he’s 72. This sets a record for the longest wrongful imprisonment in the US. https://www.cnn.com/2018/03/30/us/detroit-man-wrongfully-excused-of-murder-released-trnd/index.html Share this:FacebookEmailTwitterLike Loading... 4 Comments Posted in Life after exoneration, wrongful conviction Prosecutor Issues Fake Subpoenas Posted on March 27, 2018 | 1 comment This absolutely turns my stomach. This insanity has to stop. See the story from HuffPost here. Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Editorials/Opinion, Prosecutorial conduct (good and bad), Reforming/Improving the system Wrongfully Convicted Man Gets His Old Job Back with the White Sox After 23 Years in Prison Posted on March 26, 2018 | 2 comments Would that ALL exonerated people were able to re-insert themselves back into society this easily. https://www.cnn.com/2018/03/26/us/white-sox-hire-wrongly-convicted-groundskeeper-trnd/index.html Share this:FacebookEmailTwitterLike Loading... 2 Comments Posted in Editorials/Opinion, Life after exoneration, Reforming/Improving the system, wrongful conviction Lives Shattered by a (False) Allegation? Posted on February 10, 2018 | 8 comments This from CNN today: “(CNN) President Donald Trump took to Twitter Saturday to lament “lives are being shattered” by a mere allegation in the wake of the resignations of former White House staff secretary Rob Porter and speechwriter David Sorensen following allegations of domestic abuse. ” ‘Peoples lives are being shattered and destroyed by a mere allegation,’ the President tweeted. ‘Some are true and some are false. Some are old and some are new. There is no recovery for someone falsely accused – life and career are gone. Is there no such thing any longer as Due Process?’ “ ________________________________________________ All I can say about this is: “Well, Mr. president, I suggest you take a very hard look at the sex offender registry, because this – lives shattered by a false accusation – is something that our (your) justice system is very good at.” Just ask Brian Banks, or Courtney Bisbee, or any of the countless others. I’ve written about many of them on this blog. ________________________________________________ And the false-accusation failures of the justice system are not limited to just sex offenses. Share this:FacebookEmailTwitterLike Loading... 8 Comments Posted in Editorials/Opinion, Reforming/Improving the system, wrongful conviction Jack McCullough, Exonerated, Sues Prosecutors for “Pervasive Misconduct” Posted on April 15, 2017 | 1 comment We’ve reported about Jack McCullough on this blog several times previously. See here, here, here, and here. Prior to having his conviction overturned and being exonerated, this case was touted as the “oldest cold case ever solved.” It will be interesting to see where this suit goes, since prosecutors are supposed to have absolute immunity to civil suit for actions taken while pursuing their duties as prosecutor. They can, however, be held responsible for criminal actions. See the CNN story here. Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Exonerations, incentivized witnesses, Police conduct (good and bad), Post-conviction relief, Prosecutorial conduct (good and bad), wrongful conviction Federal Judge Overturns Arizona’s Diaper Changing Child Molestation Law Posted on April 10, 2017 | Leave a comment Arizona’s justice system is truly something to behold. After all, it’s the home of Sheriff Joe Arpaio. And get this – Arizona’s Attorney General and Maricopa County’s Attorney have publicly stated that there are “no” wrongful convi"
