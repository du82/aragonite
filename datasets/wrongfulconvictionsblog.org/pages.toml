full_description = '← Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million Annual Exonerations Report: A record number of years lost by those exonerated in 2018 → Two Florida Men Freed After 42 Years in Prison for a Murder They Didn’t Commit Posted on March 29, 2019 by Phil Locke | 4 Comments Clifford Williams and Hubert Myers were convicted of murdering a woman while they were at a party in Jacksonville, Florida. Two women were shot in a nearby apartment, one of them fatally. The men were quickly arrested, convicted and sentenced to life in prison after a 2-day trial. The state of Florida has recently dropped all charges and freed them. See the CNN story here: https://www.cnn.com/2019/03/29/us/florida-wrongful-imprisonment-42-years-murder/index.html Share this:FacebookEmailTwitterLike Loading... Related This entry was posted in Conviction Integrity Units, Exonerations, wrongful conviction. Bookmark the permalink. ← Wrongfully Convicted; “Beatrice Six” Awarded $28.1 million Annual Exonerations Report: A record number of years lost by those exonerated in 2018 → 4 responses to “Two Florida Men Freed After 42 Years in Prison for a Murder They Didn’t Commit” Pingback: Two Florida Men Freed After 42 Years in Prison for a Murder They Didn’t Commit - Stan Rothenberg Greg Foster | March 30, 2019 at 3:13 pm | Reply Thanks for these stories. We all need to be reminded regularly how disastrous our justice system can be. 42 years wrongful imprisonment? These stories are so scary. Kudos to you and other attorneys that work to right these wrongs. globaltel | May 6, 2020 at 7:08 am | Reply Social workers and therapists should be working with these two men to help them adjust to life outside of prison. 42 years is causing mental pain or distress. Pingback: Two Florida Men Freed After 42 Years in Prison for a Murder They Didn’t Commit – CrimeMax Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
