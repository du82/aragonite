full_description = "Category Archives: Access to DNA testing ← Older posts Ten years after: An exoneree success story Posted on September 16, 2018 by Carey Hoffman | 2 comments “Hello truth.” That’s the phrase Robert McClendon will always be associated with. It was his reaction 10 years ago when DNA results were announced that conclusively cleared him of the rape charge that had cost him his freedom for the previous 18 years. But, in this 10th anniversary year of that moment, Robert says they are not necessarily the words that stick out most in his mind from that day. Robert McClendon and Ron O’Brien It was an exchange with Columbus Dispatch reporter Mike Wagner, whose reporting plays prominently in Robert’s story, that remains most vivid to Robert. Heading into the proceedings to announce the results of the DNA comparison, no one was telling Robert what the results showed. “No one would say anything about it. My family was bewildered, they were stunned,” Robert recalls. “I thought, ‘Oh my gosh, the results must have come back inconclusive.’ All kind of things were going through my mind, and I will always remember this conversation with Mike Wagner. “Mike knew I liked basketball, and he was a high school basketball player himself, so he had said, ‘If you ever get out, we’ll have to play a game of 1-on-1.’ So no one is telling me anything, and then Mike walks by and he says the words I’ll never forget, ‘You ready for that basketball game?’ “ That is how Robert McClendon learned his 18-year nightmare was drawing to a close. McClendon, Wagner and others involved in his case – along with fellow Ohio Innocence Project (OIP) exonerees Dean Gillispie, Laurese Glover and Nancy Smith – revisited his journey to justice this week during a panel discussion, “Hello Truth, Ten Years of Freedom” in Robert’s hometown of Columbus. Also participating were Columbus city council member Jaiza Page, who served as moderator, Franklin County Prosecutor Ron O’Brien, Judge Charles Schneider of the Franklin County Common Pleas Court, former Columbus Dispatch reporter Geoff Dutton and OIP Deputy Director Jennifer Paschen Bergeron. Robert’s case was a true landmark moment for the innocence movement in Ohio. Continue reading → Share this:FacebookEmailTwitterLike Loading... 2 Comments Posted in Access to DNA testing, Exonerations, Life after exoneration, Prosecutorial conduct (good and bad), wrongful conviction Monday’s Quick Clicks… Posted on May 22, 2017 by Mark Godsey | 1 comment Weird—Boise State gets federal grant for post-conviction DNA testing, but not on Idaho cases Possible false memories of “suppressed” sexual abuse examined in documentary University of British Columbia marks a decade of investigating wrongful conviction claims Murder cases often go cold after exoneration Ohio Innocence Project talks about grueling work of freeing the innocent False memory expert may be key to perjury case Forensic scientist in Arizona state lab hid backlog of cases, delayed DNA testing for years The Mississippi sting operation that uncovered Michael West’s bite mark bunk Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Access to DNA testing, False confessions, Forensic controls, forensic science, Junk science, Project Spotlights, Prosecutorial conduct (good and bad) Monday’s Quick Clicks… Posted on April 23, 2017 by Mark Godsey | Leave a comment Spotlight on Oregon Innocence Project Wyoming Attorney General an obstacle to new bill that would allow exonerations to occur in non-DNA cases Innocence Project New Orleans spars with Baton Rouge DA over missing evidence in rape case New book on the science of false memories Musician John Legend teams with U of Penn on criminal justice reform Massachusetts lab scandal results in 20,000 drug convictions tossed Poem by Darrell Grayson, who was executed by the State of Alabama despite his pleas for DNA testing Exoneree Keith Harward travels country to educate about bad forensics and wrongful convictions How we are wired to produce false memories Most forensic science isn’t real science Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Access to DNA testing, Book recommendations/discussion, Capital punishment, Forensic controls, forensic science, Junk science, New Evidence, Prosecutorial conduct (good and bad) Exoneration and Freedom for Evin King in Ohio Posted on April 17, 2017 by Mark Godsey | Leave a comment Today, prosecutors in Cuyahoga County (Cleveland) vacated the conviction of long-time Ohio Innocence Project client Evin King. King was convicted in 1995 of murdering his girlfriend despite no direct evidence of guilt (eyewitness or forensic). He always maintained his innocence, from arrest and trial and then throughout his 23 years of incarceration. When he is released, which will hopefully be later this week, King will be the 25th person the OIP has freed on grounds of innocence since its founding in 2003. Together the 25 innocent Ohioans spent more than 470 years in prison for crimes they didn’t commit. Evin King prison photo DNA testing confirmed that the semen found in the victim’s vaginal cavity after the attacked matched male skin cells found under her fingernails (a hand-to-hand struggle appeared to have taken place during the attack, as the victim was strangled). This male DNA in both locations did NOT match Evin King, but rather, an unknown male. [Watch this moving video of Assistant Clinical Professor Jennifer Bergeron informing Evin King, in prison, that he is about to regain his freedom after 23 years in prison for a murder he didn’t commit…] Prosecutors had for years failed to respond to King’s motions for relief, even after the exclusionary DNA test results were obtained. And the trial court sat on King’s post-conviction motions for nearly a year-and-a-half before denying relief. Fortunately, the 8th District Court of Appeals reversed the trial court’s decision last year and sent the case back to the trial court for a hearing, while specifically observing that the DNA evidence supports King’s innocence claim. On Friday, the OIP learned that after newly-elected prosecutor Michael O’Malley took office in January, he put new prosecutors on the case to look into it with a fresh eye. When O’Malley was later informed of the details of King’s case from these prosecutors, he ordered that King’s conviction be overturned and that he be released. OIP Assistant Clinical Professor Jennifer Bergeron has represented King for many years, as did OIP staff attorney and Ohio Public Defender attorney Carrie Wood (now at the Cincinnati Public Defender’s Office). OIP student fellows on the case include Taylor Freed, Katie Wilkin, Mallorie Thomas, Joe Wambaugh, Bryant Stayer, Steve Kelly, Morgan Keilholz, Jon Walker, Scott Leaman, Thomas Styslinger, John Markus, and Julie Payne. The Ohio Public Defenders Office, particularly Kris Haines, worked on King’s case as well for many years. King’s case is another example of the importance of determination and perseverance, as Bergeron, Wood, Haines, and the students never gave up even though at times King’s prospects appeared bleak given the initial stiff resistance of the trial court and the prosecutors. OIP co-founder and director Mark Godsey said, “While the initial delay in obtaining justice for Mr. King is disturbing, Michael O’Malley and the Cuyahoga County Prosecutor’s Office deserve credit for turning this case around and correcting an injustice. As we have seen in other counties with other cases, prosecutors far too often fight back hard against an exoneration even when the evidence of innocence is strong. But in several past cases in Cuyahoga County, and today with Evin King’s case, the prosecutors in Cleveland put justice above winning. O’Malley’s involvement in the case since his recent election, along with his decision to put new prosecutors on the case, may have been the pivotal factor that secured freedom for an innocent man, and we are thankful for his heroic intervention.” Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Access to DNA testing, Conviction Integrity Units, Exonerations, New Evidence, Prosecutorial conduct (good and bad), wrongful conviction Thursday’s Quick Clicks… Posted on March 30, 2017 by Liza Dietrich | Leave a comment Will Trump’s Prison Reform Policies Send More Innocent People to Jail?… Disciplinary Outcome of Former Wake County Prosecutor Highlights Severe Flaws in our Justice System… MASSACHUSETTS: ‘Stunning’ Drug Lab Scandal Could Overturn 23,000 Convictions… WISCONSIN: Appeals court upholds conviction cleared with DNA evidence… CALIFORNIA: Innocent man freed after spending 20 years behind bars for attempted murder in a Compton shooting… CONNECTICUT: Jailhouse informants expert testifies for defense at New Haven slaying, robbery trial… U.S. News & World Report: Law That Allows Payment to Wrongfully Convicted Could Change… MICHIGAN: Detroit rape kit problem persisted after 2009, leaving more than 500 untested… IRELAND: Government proposes ‘root-and-branch’ Garda review after wrongful conviction revelations… Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Access to DNA testing, Compensation/Exoneree compensation, Uncategorized, wrongful conviction Tagged compensation, dna evidence, europe, exoneration, Ireland, miscarriages of justice, rape kit testing, reform, trump prison reform, wrongful conviction Thursday’s Quick Clicks… Posted on March 9, 2017 by Liza Dietrich | Leave a comment The Marshall Project: The Seismic Change in Police Interrogations… NBC News: Number of Exonerations Hits Record for Third-Straight Year… The New York Times: Black People More Likely to Be Wrongfully Convicted of Murder, Study Shows… The Desert Sun: Exonerated from murder: Kimberly Long shares story with students… The Denver Post: Bill to allow exonerated defendants to get refunds in Colorado appears headed to Gov. John Hickenlooper… The Kansas City Star: Bryan Sheppard walks free after 22 years in prison for six KC firefighter deaths… Daily Lobo: Law School program that helps overturn wrongful convictions facing defunding… The New York Times: 2 Men Wrongfully Convicted in 1980 Fire Will Receive $31 Million… Deseret News: Bill to help wrongfully convicted people use post-conviction DNA testing passes Legislature… Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Access to DNA testing, Compensation/Exoneree compensation, forensic science, Legislation, Uncategorized Tagged Access to DNA testing, Arson, arson forensic science, compensation bill, exoneration, Exoneration Statistics 2016, Kimberly Long, National Registry of Exonerations, wrongful conviction Monday’s Quick Clicks… Posted on February 27, 2017 by Liza Dietrich | Leave a comment How courts correct mistakes in the criminal justice system depends on where you live… Former LA City Attorney Carmen Trutanich Charged With Misconduct In Death Penalty Case… Wrongfully convicted: The science and law behind exonerations: Podcast… Colorado: Legislative Round-up: Paying lump sum to exonerated passes second reading… Florida: Bill filed — again — to exonerate Groveland Four… Idaho Innocence Project Employs New Forensics Technique to Exonerate Two Men… East Baton Rouge District Attorney argues against overturning rape conviction for Innocence Project New Orleans client… Lawyers for convicted killer Kirstin Lobato want DA to take a fresh look at evidence… Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Access to DNA testing, Compensation/Exoneree compensation, forensic science, Junk science, New Evidence, Uncategorized Tagged compensation, compensation bill, Criminal Justice Reform, forensic science, Groveland Four, Idaho Innocence Project, Innocence Project New Orleans, kirstin Lobato, official misconduct, wrongful conviction Tuesday’s Quick Clicks… Posted on February 7, 2017 by Liza Dietrich | Leave a comment Brother’s case inspires Darla Lee to organize Wrongful Convictions Symposium (Video)… Superior Court overturns order granting Letitia Smallwood a new trial… Appeals Court to issue opinion on possible DNA testing in 35 year old Juneau homicide… CBS News (48 Hours- video): Guilty Until Proven Innocent… The Washington Times: Rhode Island Senate passes criminal justice reform bills… The Irish barristers who travel to the US to help prove people’s innocence… Could DNA unlock answers in questionable conviction case?… Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Access to DNA testing, forensic science, Reforming/Improving the system, Uncategorized, wrongful conviction Tagged CBS News, Criminal Justice Reform, Darla Lee, DNA testing, Ireland, Irish Innocence Project, Letitia Smallwood, the Irish Innocence Project, wrongful conviction Jeffrey MacDonald actual innocence appeal Posted on January 18, 2017 by Ron Huff | 1 comment Dr. Jeffrey MacDonald, the former Green Beret surgeon who was first cleared in the murders of his pregnant wife and two daughters and then convicted in 1970, will have what may be his final chance at overturning his conviction after spending the past 36 years in prison for a crime that many experts now believe he did not commit. Oral arguments before a federal appeals court will commence on January 26. The crime took place prior to the use of DNA analysis and new DNA evidence and a lot of other evidence, including evidence of prosecutorial misconduct, flawed forensic testimony, and botched crime scene analysis, provides powerful support for his story that intruders killed his family in what was in some ways similar to the “Manson family” murders in that same era. People Magazine investigative reports will culminate in its major cover story, available on newsstands on Friday, January 20. Here is a link to the People Magazine digital story today that precedes the cover story: http://people.com/crime/former-green-beret-surgeon-jeffrey-macdonald-says-theres-evidence-he-didnt-kill-his-family-i-am-innocent/ Share this:FacebookEmailTwitterLike Loading... 1 Comment Posted in Access to DNA testing, forensic science, Junk science, New Evidence, Post-conviction relief, Prosecutorial conduct (good and bad), Uncategorized, wrongful conviction How Janet Reno bolstered the innocence movement Posted on November 11, 2016 by Martin Yant | Leave a comment Former U.S. Attorney General Janet Reno was remembered for many things after her death this week. But one of her most important accomplishments was greatly overlooked — how she fostered the innocence movement. Defense attorney James M. Doyle explains how in a column here. Share this:FacebookEmailTwitterLike Loading... Leave a comment Posted in Access to DNA testing, Commissions/Innocence Commissions/Governmental Case Review Agencies, Conviction Integrity Units, Editorials/Opinion, Exonerations, Eyewitness identification, forensic science, Post-conviction relief, Reforming/Improving the system Tuesday’s Quick Cli"
