title = "About | Wrongful Convictions Blog"
description = "This blog covers any and all issues--wherever they arise in the world--related to the problem of wrongful conviction of the innocent.   The goals of the blog are to:   provide a single location on the web where one can go daily to find updated news and commentary relating to wrongful convictions spur debate, discussion…"
full_description = "About This blog covers any and all issues–wherever they arise in the world–related to the problem of wrongful conviction of the innocent. The goals of the blog are to: provide a single location on the web where one can go daily to find updated news and commentary relating to wrongful convictions spur debate, discussion and learning on the issue create a repository where, through time, nearly all media and information about wrongful convictions will be accessible and searchable in one location. Read our diversity of language policy here. Thank you for stopping by. Share this:FacebookEmailTwitterLike Loading... 31 responses to “About” Nancy Petro | February 21, 2012 at 6:36 am | Reply Congratulations, Mark Godsey, and thank you for this new forum for the discussion and sharing of information relating to wrongful conviction worldwide. This is a significant contribution to expanding awareness of miscarriages of justice and identifying best practices in criminal justice. Denise Clark | February 21, 2012 at 10:05 am | Reply I am currently working with Martin Yant right now on a wrongful conviction case. I was unaware until now, what an ongoing issue this is. Congratulations on your new blog. May it facilitate future awareness, justice and miracles where needed… Pingback: Wrongful Convictions | inter | metapher James and Elizabeth Rodriguez | February 26, 2012 at 2:01 am | Reply We have just revised the No justice for James website and blog about the wrongful conviction if James Rodriguez, sponsoree of NCRJ. We are ecstatic to see a wrongful conviction blog with an esteemed editor and contributing editor panel. We need more sites and blogs to share the personal stories of those who are wrongfully convicted but pled under duress or have no DNA to exonerate them, and must live with the label of the pariah for the rest of their lives. Docile Jim Brady | March 5, 2012 at 9:03 pm | Reply It is possible to be “guilty”, yet still be a victim of a “wrongful conviction”. And it can be extraordinarily difficult to overturn the conviction. Andrea O. | June 7, 2012 at 1:21 am | Reply Congratulations, great blog! Dorothy Stein | June 27, 2012 at 4:20 pm | Reply I have learned of your efforts for justice through the These Stone Walls blog about the wrongful conviction of Catholic priest, Fr. Gordon MacRae, a sponsoree of NCRJ. I echo others who welcome this new forum for justice and truth. Thank you, Mark Godsey, for stepping up. Linda Hoppe | April 26, 2013 at 5:12 pm | Reply Ryan Ferguson is an innocent Missouri man wrongly convicted of a crime he had nothing to do with. He has been incarcerated for over 9 years even though the only witnesses have since recanted and admitted to perjury under oath. Please read more at FreeRyanFerguson.com JusticeForRyanFerguson.com and if you would like to support Ryan, you may sign the Petition (Change.Org) and “Like” the Free Ryan Ferguson Facebook page. Kamile | November 20, 2013 at 5:51 pm | Reply There are so many injustices in the U.S. I’ve come to see that the laws of the land are very bias and have double standards. My 19yr old nephew and his 2 friends were attacked at a gas station by being pulled out of their vehicle that led to a fatal shooting. I don’t know how you are suppose to retaliate with total strangers pulling you out of your vehicle and threatening your life that are within the law but I’m sure human instinct and fear would kick in. The trial judge denied my nephew self defense before jury deliberations. The prosecution never denied or disproved self defense. The prosecution then came in at sentencing and falsely stated that my nephew was in a gang and this incident was gang related. They could not say this during the trial because it would have been illegal. They used my nephew’s tattoos and rap songs against him. They used a black police detective to speak against my nephew at sentencing, stating that he was the ring leader of a gang, raped woman and children and the elderly but he testified he didn’t know my nephew and has never seen him. My nephew has never been in a gang. What typical 19yr old doesn’t listen to rap or have a tattoo?? How can attackers become victims?? Where is the Self Defense and Stand Your Ground for my nephew?? Because of the false gang info, my nephew was sentenced to 20yrs. No prior convictions…were is the justice??? Laurie Juedes | February 21, 2014 at 11:56 pm | Reply Kamile, I am sorry to hear about the pain that you and your family have been subjected too. All I can offer is the fact that you are not alone. My family is also the victim of a criminal justice system derailed to attack the innocent rather than the criminal. We become victims because we are vulnerable, and law enforcement investigations in some areas focus on those that are vulnerable rather than those that are guilty. I have been fighting a wrongful conviction for over seven years and, so far, have won. My advice is to become less vulnerable. Know your rights, know the rights of family members targeted by this system and fight for your life and the lives of those you love. I have seen a growing awareness of the problems within the criminal justice system and I expect this trend to grow as more of us become affected and find ways to voice our experiences. Keep talking, keep writing, keep complaining and don’t stop until law enforcement is forced to follow the law. My prayers are with you and your family. Help Save Bryce 4brycesbattle | April 21, 2020 at 2:33 pm | Reply That is a very sad story. Yet… If anyone has been sucker punched by this injustice system… They know that what you wrote ✍…. rings true. (((hugs))) Karen Clarks family & friends | February 6, 2014 at 2:02 am | Reply Hello. I’ve attached a link to a website which will introduce you to our dear friend who has been wrongfully convicted and is currently awaiting sentencing. Any insight/help would be greatly appreciated. LeeAnn | February 10, 2014 at 9:45 am | Reply Guilty until proven innocent! How has the system become so backwards? My boyfriend left his wife 2 years ago and the day after he filed for divorce his now ex-wife, her daughter and granddaughter accused him of rape and indecent liberties with a child in 2 different counties saying things happened continually over the previous 12 years sounds a little far fetched doesn’t it? They first initiated the allegations on facebook letting the whole world know reaching out for sympathy and they even printed that they were going to smear and ruin him. He was then arrested a month later for 3 charges and then another month later for 2 more charges. There is NO PROOF it is simply a case of their word and they are known liars and manipulators and they continue to make up more and more lies as none of their stories are the same anytime they tell them. They have ruined his life he was let go from his well paid job, is not able to participate in organizations that he has been involved in through his lifetime and so many other life altering things have happened and all for what? Because his ex-wife wants all the possessions they had and money and revenge because he and I had an affair (she was no angel either). The DA’s know that they have very un-credible witnesses but they continue to proceed with the trial and charges I guess because they are way to concerned with another conviction on their record but yet they are wasting tax payer money. No one will hold them accountable for their lies and they are getting away with it. How can they be stopped. He is awaiting sentencing for sexual aggravated battery they found him not guilt of rape and we still have another trial to go through for the other county charges. The problem is so many things are not allowed to be brought up in court and they are made out to be the victims when he is actually the victim of marrying a crazy family. It is frustrating and maddening and the sad part is that I am finding out this happens to so many men and is so common. It does an injustice to those that are actually raped or abused as a child. If these things were happening over a 12 year period then why did they continue to associate with him and be around him? His step-daughter and granddaughter (those accusing him) would call him if they were in trouble before they would call his wife no if he was so dangerous then why be around him? Rape and molest victims don’t want to be anywhere near the accused but yet a month before they accused him there are pictures of all of them together on FB. I am at my end and this is such a huge injustice and I am now determined to do all that I can do to bring the word to all I can how often this occurs and get as many of these situations stopped that I can. Some may say I am obsessed but wrong is wrong and this has to be stopped. pwelcome | April 20, 2014 at 9:18 pm | Reply Hi, I’ve attached a link to a website which will introduce you to our dear friend who has been wrongfully convicted. I notice in several of the threads in this forum a very similar theme. freesimon.com.au Elizabeth | May 23, 2014 at 10:17 pm | Reply Could you please take a moment and sign this petition to help my aunt receive home incarceration upon her sentencing. Thank you. http://www.thepetitionsite.com/260/424/941/petition-for-home-incarceration/ Megan | July 21, 2014 at 11:10 pm | Reply Please take a moment to sign this petition on behalf of my family member who was was wrongfully convicted as a juvenile 17 years ago. Wayne’s trial is coming up in September to prove his innocence. Thank you in advance and please feel free to contact me with any petitions as well. http://www.change.org/petitions/honorable-joseph-g-kazmierski-jr-circuit-judge-of-cook-county-please-exonerate-my-brother-wayne-s-antusas?share_id=eKUOVvgNMQ&utm_campaign=share_button_action_box&utm_medium=facebook&utm_source=share_petition Walter | November 10, 2014 at 3:58 pm | Reply Here is a case somebody should research. Esar Met was just sentenced to life without parole for a horrendous crime he probably did not commit. I made a website with the basdic facts addressing each piece of evidence. The confession is laughable. It is not public but I can provide a copy to anyone who wants to watch it. Mr Met is a Burmese refugee who speaks little or no English. The crime occured just two years after a very similar crime in the same neighborhood. The police were roundly criticized for their handling of the first crime, the Destiny Norton murder. It appears they were under intense pressure to solve the case immediately. Sabine Kurjo McNeill | November 19, 2014 at 7:40 am | Reply I have been publishing http://www.victims-unite.net to highlight not only wrongful convictions but lots of other white collar crimes in the UK. One prisoner is Maurice J Kirk BVS who’s been held in HMP Cardiff and Swansea since 14 October for trumped up charges. South Wales Police and the whole of the UK Establishment seem to be determined to let him die in prison: he’s 69, doesn’t get the medial attention he needs and now his ‘McKenzie Friend’ (lay legal advisor) has been arrested in Gibraltar – to prevent him from being at his court case. Maurice may not be produced there anyway, as they play ‘wheelchair’ games. You can’t make it up. But here’s a petition with a video: http://www.change.org/p/rt-hon-theresa-may-mp-please-release-maurice-j-kirk-bvsc-from-hmp-swansea-asap And here’s the latest post on his official website: http://kirkflyingvet.com/blogs/news/archive/2014/11/03/how-to-sabotage-a-parole-hearing.aspx And the complementary blog I produced: http://www.mauricejohnkirk.wordpress.com DEBBIE SAINZ | November 26, 2014 at 10:02 am | Reply MY SON IS WRONGFUL CONVICTED AND INCARCIRATED FOR OVER 18 YEARS IN THE STATE OF ALABAMA FOR A CRIME HE DID NOT COMMIT THE STATE OF ALABAMA HAS HIM KIDNAPPED GOD BLESS Lori St John | November 28, 2014 at 8:52 am | Reply Congratulations on the inception of this blog and center. I have wanted for some time to inititate such a project. I have much to say about this area of the law. See my website http://www.loristjohn.com.. which was created solely as a mechanism to deluge the truth in an internationally renowned case some years back, in an effort to help educate the public and reform the system. My new book, The Corruption of Innocence, a Journey for Justice, is aimed at just that, as I continue to speak at law schools, public defender offices and other forums to effectuate the change we need. Great job! Help Save Bryce 4brycesbattle | April 21, 2020 at 2:43 pm | Reply Hello, none of your links work. I tried. RQ | February 16, 2015 at 3:13 pm | Reply Bear with me, I know this is going to be a lot to read. I am not one to take the words of someone else at face value when I first meet them, especially when it comes to matters such as sex offenders, so trust that I did my research thoroughly on this, and him before I realized it wasn’t made up. My Fiancee was wrongfully convicted in Indiana in 2007. His ex-wife had told him several times through the relationship (supposedly joking) that if they separated she would ruin him. She had cheated on him during their marriage and had at one point conceived a child with another man, and he had stuck it out with her through that. He had no intention of leaving. In 2006 he was accused of molesting a child at one of his ex-wife’s family gatherings. He had originally pled not guilty, but had been harassed by police during investigation, and was coerced into saying he was guilty. His public defender told him that he needed to plead guilty and take a plea bargain, because either way he would be found guilty, even without evidence, and if he kept his plea and went to trial, that he wouldn’t do much in the way of defending him. My Fiancee even tried filing two motions to dismiss the case on his own without his public defender, but they were not considered because his defender would not back it up or go with filing the motion in the first place. There was never evidence that proved anything, and he even gave DNA in prison to show that he was innocent. He was given no other choice but to change his plea to guilty. He spent two years in prison for something he never even did, and was even told after he was released from prison by his ex-wife’s father that the child was seen by doctors, proven to have never been touched by anyone, and that it was so that she could get her divorce and wouldn’t have to worry about dealing with custody or visitation after the divorce was finalized. He has a child with her, that he can never see, and that kills him. Every holiday, every birthday he misses it eats at him a little more. He is required to register for the rest of his life, and can’t find steady work because of it. The entire process has not only ruined his life, but it ruined his self worth. He still has issues talking to people he doesn’t know, and doesn’t like being away from home for too long because he feels unsafe. I have two children myself, both l"
