title = "Dean Gillispie Wins $45 Million for Wrongful Conviction | Wrongful Convictions Blog"
description = ". Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years LAURA A. BISCHOFF November 22, 2022, 10:56 AM Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years COLUMBUS, Ohio – An Ohio man won $45 million in a civil lawsuit against a police department and detective whose…"
full_description = '← The National Registry of Exonerations Releases Grim, Eye-Opening Report Dean Gillispie Wins $45 Million for Wrongful Conviction Posted on December 21, 2022 by Phil Locke | 5 Comments . Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years LAURA A. BISCHOFF November 22, 2022, 10:56 AM Ohio man wins $45 million in lawsuit after being wrongfully imprisoned for 20 years COLUMBUS, Ohio – An Ohio man won $45 million in a civil lawsuit against a police department and detective whose actions led to his wrongful conviction and more than 20 years behind bars. Dean Gillispie sued Miami Township police and former detective Scott Moore for suppressing evidence and tainting eyewitness identifications in the 1991 rape and kidnapping case against Gillispie. Gillispie was convicted in 1991 in Montgomery County and released from prison in 2011. The Ohio Innocence Project at the University of Cincinnati law school, former Ohio Attorney General Jim Petro and Dean’s mother, Juana Gillispie, worked to free him and clear his name. Today, Gillispie is 57, and lives in Fairborn, a suburb of Dayton. “The horror inflicted on Dean and his family and community is hard to wrap your mind around,” Ohio Innocence Project Director Mark Godsey said. “The way the authorities pushed through a conviction and then fought back and refused to admit a mistake was so disappointing. Nothing can repay Dean for the horror.” He added: “The jury’s verdict sends a strong message that those in power need to change the way they do things.” “Justice prevailed in this case, although it took a long, long, long time for that to occur,” said Petro, who co-authored a book with his wife Nancy about wrongful convictions. David Owens, whose firm Loevy & Loevy represents wrongfully convicted clients and represented Gillispie, said they believe $45 million sets an Ohio record. It is unclear if Miami Township or Moore will seek to appeal the case or when Gillispie might receive payment. Share this:FacebookEmailTwitterLike Loading... Related This entry was posted in Uncategorized. Bookmark the permalink. ← The National Registry of Exonerations Releases Grim, Eye-Opening Report 5 responses to “Dean Gillispie Wins $45 Million for Wrongful Conviction” Carolyn Shustar | December 21, 2022 at 9:03 pm | Reply My son has spent 3 years in Prison for a wrongful conviction and I am having a really hard time getting lawyers to help him, they keep dragging things out and raking my money! he has a wfe and 3 kids who need him. I think something shady is going on with the court and prosecutors in my son’s case. Any information you can give me to help my son would be great! mikaljhohnashly | February 3, 2023 at 5:05 am | Reply Dear, thank you for updating us about “Dean Gillispie Wins $45 Million for Wrongful Conviction”. Author : lesson plans Tim in WI | February 27, 2023 at 12:59 pm | Reply There are tens of thousands just like this guy. I am one, except they only stole 1245 days from me in the early 90s. Are the people getting a “fair trial” or not? To compound the problem State congress engaged is the use of retrospective language in law making upon certain crimes. A prosecutorial wet dream. Tim in WI | July 19, 2023 at 10:57 am | Reply Has Mr. Gillespie received any portion of the judgement? It has been 6 months. It’s great for the blog to post or report such judgments, but much diminished if such payments aren’t enforced and made public. Tim in WI | December 19, 2024 at 2:57 pm | Reply Its been a while since your group has posted to the blog. What happened? I’ve read of at least three more exonerations and not a word? Have the fascists gotten your tongues? Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
