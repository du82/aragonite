title = "Algemene voorwaarden van StudyGo"
description = "Krijg extra uitleg, oefen samen en stel al je vragen in een videogesprek van 1 uur"
full_description = "Algemene voorwaarden Welkom bij de algemene voorwaarden van StudyGo. Hier lees je welke afspraken je met ons maakt als je gebruik wilt maken van ons platform. Lees deze voorwaarden goed door, zodat je weet wat jij wel en niet mag doen en wat wij wel en niet mogen doen. Onder ieder kopje staat steeds een korte samenvatting in eenvoudige taal. Dus vind je het allemaal maar lang en lastig, lees dan alleen die stukjes tekst even door. Als we iets aan onze voorwaarden veranderen, laten we je dat via het platform of per e-mail weten.StudyGo is een handelsnaam van Futurewhiz B.V. (KvK-nummer 32144948). Wij zijn gevestigd aan het Prins Bernhardplein 200, 1097 JB, Amsterdam. Je kan contact met ons opnemen door een e-mail te sturen naar onze klantenservice via [email protected].1. Toegang tot het PlatformJe kunt pas een account aanmaken als je akkoord gaat met onze voorwaarden. Vul al je gegevens eerlijk in en houd je nickname en wachtwoord geheim. Je bent namelijk zelf verantwoordelijk voor alles wat er via jouw account gebeurt. Het kan gebeuren dat StudyGo soms niet (goed) werkt, bijvoorbeeld door een storing of omdat we bezig zijn de site nog beter te maken. StudyGo mag informatie (tijdelijk) offline halen, maar we zullen dit natuurlijk nooit zomaar doen.Deze algemene voorwaarden (“Algemene Voorwaarden”) gaan over elk gebruik dat je van ons platform maakt. Je kunt op ons platform snel en gemakkelijk woordjes leren via online woordenlijsten (hierna: “Platform”). StudyGo kan deze Algemene Voorwaarden op elk moment wijzigen. We informeren je vooraf over deze wijzigingen. Als je gebruik blijft maken van het Platform, geldt dit als instemming met de gewijzigde Algemene Voorwaarden. Als je de wijzigingen niet wilt accepteren, kun je het gebruik van het Platform staken en/of je abonnement opzeggen. Om gebruik te kunnen maken van ons Platform, moet je een overeenkomst aangaan met StudyGo (“Overeenkomst”), waarna je een account kunt aanmaken en je kunt inloggen met je inloggegevens. Je kan het account en je inloggegevens beheren zoals beschreven op het Platform. Je moet je inloggegevens geheim houden. Zodra je weet of denkt dat jouw inloggegevens gebruikt worden door iemand anders, moet je direct maatregelen nemen zoals het veranderen van je inloggegevens. Ook moet je ons daarover informeren. Je bent zelf verantwoordelijk voor al het gebruik van het Platform via jouw inloggegevens. Je vrijwaart ons voor alle aanspraken van derden die gebaseerd zijn op de stelling dat het gebruik van het Platform door jou op enige wijze onrechtmatig is. De informatie die je bij het aangaan van de Overeenkomst verstrekt, moet compleet en juist zijn. Als deze informatie niet langer juist is, moet je deze aanpassen. Het is niet toegestaan om:a. andere gebruikers om hun inloggegevens te vragen of je aan te melden via andermans account;b. toegang te krijgen of proberen te krijgen tot het Platform op een andere manier dan door het gebruik van je eigen inloggegevens;c. iemand anders toegang te geven tot jouw account. Wij mogen het Platform of de daarop beschikbare informatie (“Content”) altijd (tijdelijk) buiten gebruik stellen en/of het gebruik ervan beperken als dit voor het aanbieden van het Platform noodzakelijk is, bijvoorbeeld voor het onderhoud van het Platform. Wij garanderen niet dat het Platform altijd en zonder onderbrekingen of storingen toegankelijk is. Storingen kunnen bijvoorbeeld optreden als gevolg van storingen in de internet- of telefoonverbinding of door virussen of andere fouten/gebreken. Wij zijn niet aansprakelijk of schadeplichtig voor schade in verband met het (tijdelijk) onbeschikbaar zijn of (tussentijds) uitvallen van het Platform.2. Gebruik van het PlatformJe mag StudyGo alleen gebruiken als je je netjes gedraagt. Respecteer ons Platform en de andere gebruikers. Hiermee bedoelen we dat je eerlijk bent, geen dingen stuk maakt, niet, spamt, niet aan StudyGo probeert te verdienen (bijvoorbeeld door woordenlijsten door te verkopen), niet discrimineert, niet pest, geen rare grapjes maakt en niet scheldt of op een andere manier onbeschoft bent. Houd je je niet aan deze regels, dan kunnen wij ervoor zorgen dat je StudyGo niet meer kan gebruiken.De functionaliteiten van het Platform en de beschikbare woordenlijsten zijn afhankelijk van het type account dat je hebt. Je gebruik van het Platform mag niet:a. op onwaarheden gebaseerd zijn, onjuist en/of misleidend zijn;b. ongeschikt zijn voor StudyGo, zoals het delen of opvragen van persoonlijke informatiec. discriminerend zijn met betrekking tot ras, afkomst, nationaliteit, religie, geslacht, gender, seksuele geaardheid, beperking, ziekte, cultuur of erfgoed of op enige manier beledigend, kwetsend of ongepast zijn;d. haatdragend zijn, oproepen tot geweld, bedreigend en/of intimiderend zijn voor anderen;e. gericht zijn op het vernederen of beschamen of chanteren of intimideren van een persoon of gebruiker of op een andere manier respectloos zijn;f. virussen, Trojaanse paarden, wormen, bots of andere programmatuur bevatten die een geautomatiseerd werk kunnen beschadigen, onbruikbaar of ontoegankelijk kunnen maken, kunnen wissen of zich kunnen toe-eigenen of die bedoeld zijn om technische beschermingsmaatregelen van het Platform en/of de computersystemen van StudyGo te omzeilen;g. bestaan uit het gebruik van tools en/of oplossingen (van derden) om Content over te nemen, of om het Platform op enige andere manier te spideren, scrapen of doorzoeken;h. commercieel zijn, zoals het verkopen van woordenlijsten, producten of andere zaken, of het delen van advertenties;i. de infrastructuur van het Platform belemmeren;j. in strijd zijn met de goede zeden;k. de belangen en goede naam van StudyGo schaden;l. in strijd zijn met deze Algemene Voorwaarden, het Privacy Statement of wet- en/of regelgeving;m. inbreuk maken op de rechten van StudyGo, gebruikers en/of derden, zoals IE-rechten en privacy-rechten, zoals het zonder toestemming delen of gebruiken van privébeelden, teksten, foto’s of muziek van anderen,n. spam verspreiden, herhalende inhoud verspreiden al dan niet via verschillende (nep)accounts of;o. op een andere manier onrechtmatig zijn. StudyGo kan op de hoogte raken van het onrechtmatige gebruik 1) via een melding van een gebruiker of 2) kan de onrechtmatige content zelf ontdekken. Daarbij maakt StudyGo gebruik van machine learning. Zo gebruiken we machine learning om automatische controles te trainen om te zoeken naar bepaalde woorden, zinnen of overtredingen, om dit proces sneller en efficiënter maken. Deze resultaten worden altijd door onze eigen mensen gecontroleerd. Daarnaast maken we gebruik van menselijke moderatie, wij controleren de inhoud die de gebruikers publiceren, zorgen ervoor dat de bijdragen waardevol zijn en dat het gedrag van de gebruikers acceptabel is. Wanneer je in strijd handelt met deze Algemene Voorwaarden, de Overeenkomst of wanneer wij van mening zijn dat jouw handelingen kunnen leiden tot schade of aansprakelijkheid van StudyGo of anderen, mogen wij altijd jouw gebruik van het Platform beperken, opschorten of buiten gebruik stellen. Als dat gebeurt, zullen we dat aan je laten weten, en duidelijk uitleggen waarom we dat doen en of dat tijdelijk is of permanent. Wij zijn in geen geval aansprakelijk voor enige schade in verband met het onrechtmatig gebruik van het Platform door jou of enige andere gebruiker. Als je van mening bent dat bepaalde Content inbreuk maakt op jouw rechten en/of de rechten van andere gebruikers of een derde partij moet je StudyGo hiervan onmiddellijk op de hoogte te stellen via de procedure beschreven in artikel Melding van onrechtmatige Content. Maatregelen bij misbruik. Hier leggen we uit welke maatregelen we kunnen nemen bij een schending. Als je onze regels schendt, kunnen we verschillende maatregelen nemen. Afhankelijk van de exacte context en omstandigheden, kan StudyGo: 1) De inhoud verwijderen en/of de gebruiker waarschuwen, 2) De toegang tot (delen van) StudyGo beperken, of 3) Het account van de gebruiker verwijderen.1) We verwijderen inhoud die in strijd is met ons beleid op het moment dat we deze inhoud ontdekken. We informeren je zodra jouw Content is verwijderd. Voorbeelden waarom jouw Content kan worden verwijderd zijn:• De Content is onjuist of bevat fouten.• De Content bevat scheldwoorden of vies taalgebruik.• De Content bevat advertenties of links naar niet-educatieve websites.• De Content bevat persoonlijke informatie.• De Content is niet relevant voor dat onderdeel van StudyGo, zoals vragen die zijn bedoeld voor onze klantenservice.• De Content bevat spam, of je verspreidt herhalende inhoud al dan niet via verschillende (nep)accounts.2) Naast het verwijderen van jouw Content kunnen we jouw toegang tot onderdelen van StudyGo tijdelijk of permanent blokkeren. We blokkeren inhoud die in strijd is met ons beleid op het moment dat we deze inhoud ontdekken. We kunnen jouw toegang tijdelijk (gedurende 7 dagen) of permanent blokkeren. Als je bent geblokkeerd, kan je geen gebruik meer maken van de functionaliteiten waarin je Content kan delen. De overige functionaliteiten van StudyGo kan je nog wel blijven gebruiken. We informeren je zodra je bent geblokkeerd, over de duur van de blokkade en de specifieke overtreding. Voorbeelden wanneer we tijdelijk blokkeren zijn:• Je plaatst spam, zoals irrelevante inhoud, of je verspreidt herhalende inhoud.• Je plaatst meerdere berichten (>3) die niet over school gaan.• Je stelt meerdere ongepaste vragen (>3), bijvoorbeeld over persoonlijke informatie.Voorbeelden wanneer we permanent blokkeren:• Je hebt verschillende accounts aangemaakt met onrechtmatige Content. De nieuwe accounts hebben dan enkel het doel om onrechtmatige Content te plaatsen en worden direct permanent geblokkeerd.• Je plaatst illegale Content (zoals discriminatie, pesten, porno, of andere content om andere gebruikers te schaden.• Je verkoopt spullen of woordenlijsten.• Je bent al 2 keer tijdelijk geblokkeerd, en dit is je derde blokkering.3) We kunnen je account verwijderen als je, na herhaalde waarschuwingen en beperkingen, inhoud blijft plaatsen die in strijd is met onze regels. We zorgen er dan voor dat je geen toegang meer krijgt tot StudyGo. We maken af en toe fouten. Als je van mening bent dat we je inhoud of account ten onrechte hebben verwijderd, of we je ten onrechte hebben geblokkeerd, kun je ons dit laten weten door een gemotiveerde klacht in te dienen via ons interne klachtenafhandelingssysteem. Ook heb je de mogelijkheid om gebruik te maken van buitengerechtelijke geschilbeslechting of in beroep te gaan bij de rechter.3. Melding van onrechtmatige ContentHet kan gebeuren dat content op ons Platform wordt geplaatst waarmee onze regels wordt overtreden of onze leeromgeving wordt verstoord. Met content bedoelen we alle inhoud van gebruikers zoals vragen, posts, discussies, lijsten, berichten in groepen, chats, commentaren en andere berichten, ongeacht op welk deel van ons platform (hierna “Content” genoemd). Wij letten daar zelf op, maar krijgen ook graag meldingen van gebruikers omdat we niet alles zien. Hoe we daarmee omgaan, leggen we hier uit.StudyGo is verplicht om onrechtmatige Content te verwijderen of de toegang tot die Content te blokkeren als StudyGo een melding heeft ontvangen. De melding moet nauwkeurig en onderbouwd zijn. Het kan ook gebeuren dat StudyGo een bevel van een rechter of bevoegde autoriteit krijgt om Content te verwijderen of informatie af te geven. StudyGo heeft een procedure ingericht om onrechtmatige Content op het platform te melden. Wil je een melding doen, dan kan je hier terecht. Voeg als het kan een kopie van de betreffende Content toe en geef een korte uitleg waarom je de Content rapporteert. Druk tot slot op “Verzenden”. Als de Content duidelijk onrechtmatig is (en de melding voldoende nauwkeurig en onderbouwd is), zal StudyGo de Content verwijderen of blokkeren. StudyGo mag besluiten een melding niet op te volgen, bijvoorbeeld als StudyGo twijfelt aan de juistheid van de melding. In zo’n situatie kan StudyGo een bevel van een bevoegde rechter in Nederland vragen, waaruit volgt dat de inhoud echt onrechtmatig is. StudyGo is geen partij in een geschil tussen de melder en een derde als er een geschil voortvloeit uit een melding. De melder vrijwaart StudyGo van alle aanspraken van derden in verband met het blokkeren of verwijderen van de Content. De vrijwaring omvat alle schade en kosten die StudyGo lijdt, zou kunnen lijden of die StudyGo maakt in verband met een dergelijke claim, inclusief maar niet beperkt tot de vergoeding van juridische bijstand. StudyGo respecteert en beschermt de privacy van iedereen die een melding doet. Alle persoonsgegevens die StudyGo in het kader van een melding ontvangt, zullen altijd in overeenstemming met de privacywetgeving en het Privacybeleid worden verwerkt en alleen worden gebruikt om de melding te verwerken.4. BetalingStudyGo heeft gratis en betaalde lidmaatschappen voor scholieren t/m 18 jaar. Ben je ouder dan 18? Kies dan voor een betaald lidmaatschap. Soms geven we een kortingscode weg. Deze code mag je maar één keer gebruiken. Kies je voor een betaald account, dan moet jij (of je ouders) op tijd betalen. Als je niet op tijd betaalt (kan gebeuren), krijg je een waarschuwing. Betaal je dan nog steeds niet? Dan kun je niet meer inloggen op StudyGo totdat je betaald hebt.Afhankelijk van het type account, ben je een vergoeding verschuldigd voor het gebruik van het Platform. Wanneer een vergoeding is verschuldigd, geldt het volgende. Je moet de prijs voor het Platform betalen, ook als je geen gebruik maakt van het Platform. De prijs voor het Platform is afhankelijk van de duur van jouw lidmaatschap en het soort pakket dat je afneemt. De soorten lidmaatschappen en bijbehorende prijzen staan op onze website, tenzij anders overeengekomen. Je kunt betalen op de manieren zoals omschreven op onze website. Wij mogen betalingen via creditcard of bankrekening verifiëren. Je betaalt binnen de termijn zoals vermeld op onze website, tenzij we een andere periodieke betaling met jou zijn overeengekomen en/of niet per automatische incasso wordt of kan worden betaald. Als er op onze website geen betalingstermijn is vermeld en wij met jou niets anders hebben afgesproken, moet je binnen veertien (14) dagen na factuurdatum betalen. Als je niet op tijd betaalt, zullen we je dat melden en een termijn geven om alsnog te betalen. Als betaling nog steeds uitblijft, mogen wij jouw toegang tot het Platform opschorten of beperken tot het moment je aan al jouw (betalings)verplichtingen hebt voldaan, inclusief betaling van buitengerechtelijke (incasso)kosten en rente. Als je klachten hebt over facturen en/of het Platform, schort dat jouw betalingsverplichtingen niet op. Wij hebben het recht om twee keer per kalenderjaar, in januari en september, de op dat moment geldende prijzen en tarieven aan te passen. Dit doen wij op basis van het Consumentenprijsindexcijfer, zoals gepubliceer"
