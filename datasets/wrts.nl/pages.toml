["https://wrts.nl/nl/privacy-policy"]
title = "Privacy policy van StudyGo"
description = "Welkom bij het Privacy Statement van StudyGo. Wat goed dat je checkt hoe het zit met je privacy. Wij vinden privacy namelijk heel belangrijk en nemen jouw privacy heel serieus. Als je gebruik maakt van StudyGo, wil je dat jouw gegevens veilig zijn. Je wilt natuurlijk niet dat je gegevens terechtkomen bij andere bedrijven. In […]"
full_description = "Privacy Statement Welkom bij het Privacy Statement van StudyGo. Wat goed dat je checkt hoe het zit met je privacy. Wij vinden privacy namelijk heel belangrijk en nemen jouw privacy heel serieus. Als je gebruik maakt van StudyGo, wil je dat jouw gegevens veilig zijn. Je wilt natuurlijk niet dat je gegevens terechtkomen bij andere bedrijven. In het Privacy Statement hieronder leggen we precies uit welke informatie wij van jou verzamelen en hoe voorzichtig we daarmee omgaan. Ook leggen we uit welke rechten je hebt.We hebben ons best gedaan om het Privacy Statement in simpele en duidelijke taal op te schrijven. Wanneer je een uitgebreide versie wilt lezen, kan je klikken op “Uitleg”, waarin we in meer woorden uitleggen wat er wordt bedoeld.Je kan het hele verhaal lezen, maar de conclusie is dat wij je op basis van jouw persoonsgegevens helpen om makkelijk en veilig gebruik te maken van StudyGo. We houden ons daarbij aan de wet (zoals de Algemene Verordening Gegevensbescherming).En je persoonsgegevens? Die bewaken wij zo goed mogelijk!InhoudsopgaveVia onze website en de StudyGo app persoonsgegevens over jou (hierna: “Informatie”). We vinden het belangrijk dat je precies weet welke Informatie we verzamelen, voor welke doelen we deze Informatie gebruiken en hoe lang we deze Informatie bewaren. In dit Privacy Statement proberen we dat op een duidelijke manier te beschrijven en leggen dit uit in volgende onderwerpen:Wie is StudyGo? StudyGo lidmaatschap Oefenen met StudyGo Contact met StudyGo Rapporten, Aanbiedingen, nieuwsbrieven en serviceberichten Computer informatie Cookies Onderzoek en analyse Bewaren van Informatie Verstrekking aan derden Bescherming van Informatie Relevante advertenies Wat zijn je rechten? Wijzigingen in dit Privacy Statement Vragen?1. Wie is StudyGo?In het kort: StudyGo is het leukste en meest leerzame online oefenprogramma om je voor te breiden op je toets van de middelbare school! Wil je contact met ons? Mail dan naar: [email protected]StudyGo is een handelsnaam van Futurewhiz B.V. (KvK nummer 32144948). Je kan contact met ons opnemen door een e-mail te sturen naar: [email protected]. Wij zijn gevestigd aan het Prins Bernhardplein 200, 1097 JB Amsterdam.StudyGo helpt je met het leren voor je volgende toets. Dit kan bijvoorbeeld door woordjes en begrippen te leren, samenvattingen van de stof in tekst én beeld door te nemen of onbeperkt oefentoetsen te maken. Ook kun je bij ons exclusieve uitlegvideo’s van ervaren docenten bekijken. Kom je ergens niet uit of heb je specifieke vragen bij jouw huiswerk? Dan kun je zelfs chatten met de speciale StudyGo-tutors of gebruik maken van online bijles. Docenten kunnen StudyGo ook gebruiken in de klas, groepen maken, lijsten klaarzetten en inzien wat de resultaten van hun leerlingen zijn (als je je als leerling koppelt aan een groep gemaakt door je docent). Docenten verwijzen wij door naar Hoofdstuk 12: StudyGo in de klas.Gegevenscategorieën en wettelijke basis voor de verwerking ervan:2. StudyGo lidmaatschapIn het kort: Als je lid wordt van StudyGo maken we een account aan. Wij hebben daar onder andere de volgende gegevens voor nodig: jouw voor- en achternaam, e-mailadres, wachtwoord en geboortedatum. Deze gegevens gebruiken we ook om het gebruik van StudyGo voor jou zo nuttig en makkelijk mogelijk te maken.Account aanmakenOm gebruik te kunnen maken van onze diensten moet je lid worden bij StudyGo. Je moet daarbij een persoonlijk account (“Account”) aanmaken. De Informatie die je verstrekt, kun je altijd aanpassen.Voor het aanmaken van het Account moet je de volgende Informatie geven:E-mailadres*;Wachtwoord;Geboortedatum;Voornaam en achternaam;Educatie informatie;Bijnaam (optioneel);Avatar (optioneel).*Als je jonger bent dan 13 jaar, moeten je ouder(s)/verzorger(s) hun emailadres invullen om voor jou een Account aan te kunnen maken.Om in te kunnen loggen in jouw Account zijn jouw e-mailadres en wachtwoord nodig. Het gebruik van deze Informatie is dus noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou.Ook gebruiken we jouw bovenstaande Informatie om StudyGo meer op jou als gebruiker af te stemmen en te personaliseren. Zo vinden we het prettig om je volledige naam te weten, zodat we je op de goede manier kunnen aanspreken. Je geboortedatum gebruiken we om te weten of onze diensten relevant zijn voor jou. Je nickname en avatar kun je aanmaken om jouw profiel te personaliseren. We verwerken deze Informatie omdat het voor ons belangrijk is om onze dienstverlening voor jou zo gemakkelijk en nuttig mogelijk te maken (gerechtvaardigd belang).Onderwijs gegevensIn het kort: we willen vragen je om informatie over jouw school en niveau. Met die gegevens kunnen wij ervoor zorgen dat je kan oefenen met lijsten of oefentoetsen kan maken die passen bij het type onderwijs dat je volgt en het niveau en de klas waarin je zit.We vragen om de volgende gegevens over jouw onderwijs:of je in Nederland of België woont;het type onderwijs dat je volgt, zoals basisschool, middelbare school of beroepsonderwijs;het niveau van het onderwijs dat je volgt, bijvoorbeeld VMBO-T, HAVO of VWO;je leerjaar;je school.Deze Informatie hebben wij nodig om de functionaliteiten op jou als gebruiker af te kunnen stemmen. Zo weten wij dat je kan oefenen met lijsten of oefentoetsen maakt die passen bij het type onderwijs dat je volgt en het niveau en de klas waarin je zit. Het gebruik van deze Informatie is onderdeel van de dienst en is noodzakelijk om je de dienst te kunnen aanbieden (noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou). Ook gebruiken we deze Informatie om StudyGo beter op jou als gebruiker af te stemmen en te personaliseren. We vragen bijvoorbeeld om de naam van jouw school zodat we jou de juiste boeken kunnen aanraden en suggesties kunnen doen. We gebruiken deze Informatie omdat het voor ons van belang is om onze dienstverlening voor jou zo gemakkelijk en nuttig mogelijk te maken (gerechtvaardigd belang).We gebruiken bovenstaande Informatie ook om StudyGo te analyseren, optimaliseren en te verbeteren (zie ook Hoofdstuk 7: Onderzoek en Analyse). Zo kunnen wij bijvoorbeeld zien of de functionaliteiten die wij aanbieden passen bij de verschillende typen onderwijs van onze gebruikers. Financiële gegevensIn het kort: Sommige pakketten bij StudyGo zijn gratis en voor sommige pakketten moet je betalen. Om te kunnen betalen, hebben wij jouw betaalgegevens nodig. Welke gegevens dat zijn, hangt af jouw keuze om te betalen.Als je een betaald lid wordt, gebruiken we jouw financiële gegevens of de financiële gegevens van jouw ouders voor de betaling. Bij StudyGo kan je je lidmaatschap op verschillende manieren betalen. Dat gaat allemaal online en op een veilige manier.E-mailadresVoordat je over kunt gaan tot betaling vragen we eerst je e-mailadres of die van je ouders. Dit e-mailadres gebruiken wij om een factuur naar toe te sturen.Financiële gegevensBij het betalen van je lidmaatschap worden bepaalde financiële gegevens verwerkt. Welke gegevens dat zijn, hangt af van de betalingswijze die je kiest. Je kunt op de volgende manieren betalen:– iDEAL;– Creditcard:– Bancontact.Als de betaling is gelukt, kom je automatisch weer op de pagina van StudyGo terecht.We gebruiken deze Informatie alleen om betalingen te verwerken. Het gebruik van deze Informatie is dus noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou.AdresgegevensSoms ontvang je bij het afsluiten van het lidmaatschap een goodie of cadeautje. In dat geval vragen wij jou je adresgegevens te delen, zodat wij de goodie of het cadeautje naar jouw adres kunnen sturen. We hebben jouw persoonsgegevens dus nodig voor de uitvoering van de overeenkomst tussen StudyGo en jou.3. Oefenen met StudyGoIn het kort: Je kan op verschillende manieren oefenen met StudyGo, zoals met behulp van woorden- en begrippenlijsten en oefentoetsen of via bijles of chatten met tutoren. Voor deze verschillende manieren van oefenen verwerken we jouw gegevens. We gebruiken jouw gegevens om de dienst aan te kunnen bieden, maar ook om StudyGo zo goed mogelijk op de wensen van onze gebruikers aan te laten sluiten. Woordjes en begrippen lerenJe kunt bestaande woorden- of begrippenlijsten opslaan of zelf lijsten aanmaken. Ook kun je leerdoelen toevoegen en daar lijsten aan koppelen en je lijsten organiseren in mappen. Je kunt jouw lijsten delen met anderen. Ook kan je een groep aanmaken en je klasgenoten of vrienden koppelen aan deze groep. In je Account kan je je oefenresultaten terug zien. Het gebruik van deze Informatie is onderdeel van de dienst en is noodzakelijk om je de dienst te kunnen aanbieden (noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou). Wanneer je oefent met de lijsten van StudyGo houden we bij op welke manier je als gebruiker oefent met StudyGo. Deze Informatie wordt ook opgeslagen in onze systemen en gebruikt om StudyGo te analyseren, optimaliseren en te verbeteren (zie ook Hoofdstuk 7: Onderzoek en Analyse). OefentoetsenMet StudyGo kan je je voorbereiden op toetsen door oefentoetsen te maken. Je kunt daarbij aangeven welk cijfer je graag voor je toets zou willen behalen. Als je een oefentoets hebt gemaakt, geven wij een inschatting van het door jou behaalde cijfer. Twee weken na het maken van de oefentoets sturen we je nog een e-mail om te vragen hoe je je toets hebt gemaakt en welk cijfer je daarvoor hebt behaald. Deze Informatie combineren wij met de gegevens over het onderwijs die je hebt ingevuld en hebben wij nodig om de functionaliteiten op jou als gebruiker af te kunnen stemmen. Zo weten wij dat je kan oefenen met lijsten of oefentoetsen maakt die passen bij het type onderwijs dat je volgt en het niveau en de klas waarin je zit. Het gebruik van deze Informatie is onderdeel van de dienst en is noodzakelijk om je de dienst te kunnen aanbieden (noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou). We gebruiken bovenstaande Informatie ook om StudyGo te analyseren, optimaliseren en te verbeteren (zie ook Hoofdstuk 7: Onderzoek en Analyse). Zo kunnen wij bijvoorbeeld zien of onze oefentoetsen op niveau zijn en of wij deze moeten verbeteren.Chatten met tutors of AI chatbotAls je bij de voorbereiding van je toetsen met vragen zit, kun je gebruikmaken van de tutor chat. We verbinden je dan door met een tutor waaraan je je vraag stelt via de chat. In de chat kun je de tutor je vraag stellen, maar je kunt ook afbeeldingen sturen. De tutor helpt je dan verder met je vraag. Daarnaast kun je gebruikmaken van de AI chatbot. Je kunt vragen stellen aan de chatbot. Dit chatbot systeem is ontwikkeld met Generative AI (OpenAI van Microsoft Azure). Wij verwerken jouw naam of nickname en de inhoud van jouw gesprek. Wanneer je de AI chatbot gebruikt, houden we bij welke vakken je studeert, wat je leerstijl is en waar je misschien wat extra hulp kunt gebruiken. Zo kunnen we je studie-ervaring beter aanpassen aan wat jij nodig hebt. De informatie die we verzamelen, slaan we veilig op gedurende maximaal twee maanden. We gebruiken speciale beveiliging (versleuteling) om jouw gegevens te beschermen.Het gebruik van deze Informatie is onderdeel van de dienst en is in de eerste plaats noodzakelijk om je de dienst te kunnen aanbieden (noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou). Deze Informatie wordt ook opgeslagen in onze systemen en gebruikt om StudyGo te analyseren, optimaliseren en te verbeteren (zie ook Hoofdstuk 7: Onderzoek en Analyse). Zo kunnen wij bijvoorbeeld zien of onze oefentoetsen op niveau zijn en of wij deze moeten verbeteren. Ook slaan we de chatgeschiedenis op om ongewenst gedrag te voorkomen en om hiervan te leren; welke vragen stellen leerlingen en kunnen we onze chatfuncties verbeteren om aan te sluiten bij de specifieke behoeftes van een leerling? Wij doen dit op basis van ons gerechtvaardigd belang bij het verbeteren van de dienst en om misbruik van onze dienst tegen te gaan. Bij het afwegen van de belangen, nemen we het belang van de leerling altijd als belangrijkste overweging mee.Vragen & AntwoordenAls je een vraag hebt over de lesstof, kan je een vraag stellen op StudyGo en antwoord krijgen van andere gebruikers of van tutoren. Je kan zelf ook vragen beantwoorden van andere gebruikers. Met deze antwoorden kan je punten verdienen die jouw StudyGo level bepalen.Als je een vraag stelt of beantwoordt, verwerken we de inhoud van de vraag of het antwoord en het vak waar de vraag of het antwoord over gaat. Daar koppelen we automatisch een schoolniveau, leerjaar en/of boek aan (‘taggen’) om indexering op basis van leerjaar, niveau en boek mogelijk te maken. Zo kunnen gebruikers filteren op leerjaar, niveau en boek bij het zoeken van vragen en antwoorden.Bij jouw vraag of antwoord zijn de volgende gegevens openbaar: je voornaam, het niveau van onderwijs en je leerjaar. Deze informatie is ook zichtbaar voor gebruikers zonder account. Voor andere gebruikers is meer informatie van/over jou zichtbaar. Je kunt deze informatie altijd aanpassen.Het gebruik van deze Informatie is onderdeel van de dienst en is in de eerste plaats noodzakelijk om je de dienst te kunnen aanbieden (noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou). Deze Informatie wordt ook opgeslagen in onze systemen en gebruikt om StudyGo te analyseren, optimaliseren en te verbeteren (zie ook Hoofdstuk 7: Onderzoek en Analyse). Zo kunnen wij bijvoorbeeld zien wat de kwaliteit is van de antwoorden en welke vragen leerlingen stellen. Tot slot monitoren we de vragen en antwoorden om ongewenst gedrag te voorkomen (op basis van ons gerechtvaardigd belang bij het tegengaan van dergelijk gedrag en misbruik van de dienst).Online bijlesJe kunt jezelf of je kind opgeven voor online bijles. Via video en/of audio kan je met een tutor praten. Door middel van video, gedeeld scherm of gedeeld whiteboard kan de tutor je helpen via video, audio en/of door te tekenen of afbeeldingen te tonen. Om de bijles in te plannen hebben we je contactgegevens nodig en informatie waar de bijles over moet gaan. Het gebruik van jouw Informatie is onderdeel van de dienst en is noodzakelijk om je de dienst te kunnen aanbieden (noodzakelijk voor de uitvoering van de overeenkomst tussen StudyGo en jou). Jouw Informatie wordt ook opgeslagen in onze systemen en gebruikt om StudyGo te analyseren, optimaliseren en te verbeteren (zie ook Hoofdstuk 7: Onderzoek en Analyse). Zo kunnen wij bijvoorbeeld analyseren voor welke vakken/onderwerpen bijles wordt genomen en onze diensten daarop aanpassen en kunnen we analyseren of onze bijlessen op niveau zijn. Wij doen dit op basis van ons gerechtvaardigd belang bij het verbeteren van de dienst.EvaluatieJe kunt deelnemen aan tevredenheidsonderzoeken en wij kunnen je benaderen voor een evaluatie van onze dienstverlening. Wij verwerken jouw gegevens voor deze enquêtes op basis van ons gerechtvaardigd belang om onze diensten te optimaliseren en aan"
