title = "Cookies - StudyGo"
description = "Cookiebeleid StudyGo Wij maken gebruik van cookies wanneer je onze website bezoekt. Dit zijn veilige stukjes informatie die worden opgeslagen op de harde schijf of in het geheugen van jouw computer, tablet of telefoon. In dit document (hierna: “Cookie Statement”) leggen wij uit op welke manier wij via onze website, www.studygo.com (hierna: “Website), gebruik […]"
full_description = "Cookies Cookiebeleid StudyGoWij maken gebruik van cookies wanneer je onze website bezoekt. Dit zijn veilige stukjes informatie die worden opgeslagen op de harde schijf of in het geheugen van jouw computer, tablet of telefoon. In dit document (hierna: “Cookie Statement”) leggen wij uit op welke manier wij via onze website, www.studygo.com (hierna: “Website), gebruik maken van cookies en voor welk doel. Wil je hier alles over weten? Lees dan verder!Wat zijn cookies?Cookies zijn kleine stukjes (tekst)informatie die bij het bezoek van de website worden meegestuurd aan je internetbrowser en vervolgens worden opgeslagen op de harde schijf of in het geheugen van je computer, telefoon en/of tablet (hierna: “Apparatuur”). De internetbrowser (dus Chrome, Firefox, Internet Explorer, etc.) kan deze informatie bij een volgend bezoek aan de website terugsturen. Heb je daar last van? Helemaal niet! Dankzij de cookies kunnen wij StudyGo zo goed en makkelijk mogelijk aan jou aanbieden en kunnen wij StudyGo altijd verbeteren. Ook krijg je hierdoor – alleen als je dat wilt – aanbiedingen van ons te zien die voor jou relevant zijn.De cookies die via de Website worden geplaatst kunnen je Apparatuur of de bestanden die daarop opgeslagen staan niet beschadigen.Welke cookies gebruikt StudyGo en voor welk doel?Functionele cookiesWij maken gebruik van functionele cookies. Deze cookies zorgen ervoor dat de Website goed functioneert. Zo zorgen functionele cookies er voor dat je na het inloggen op de Website niet op elke pagina opnieuw hoeft in te loggen en onthouden deze cookies het lidmaatschap dat je hebt besteld. Ook kunnen we met behulp van de functionele cookies misbruik van jouw account opsporen (bijvoorbeeld door mislukte inlogpogingen bij te houden). Wij hebben voor het plaatsen van functionele cookies geen toestemming nodig en je kunt functionele cookies ook niet uitschakelen.Analytische cookiesMeten is weten. Daarom maken wij gebruik van analytische cookies. Deze cookies gebruiken wij om inzicht te krijgen in het gebruik van StudyGo en helpen ons om de Website te verbeteren. Met de analytische cookies meten wij bijvoorbeeld wanneer en hoe lang gebruikers met StudyGo spelen en welke pagina’s de gebruikers bezoeken op onze Website. Het gaat ons daarbij om cijfers over het gebruik van de Website en om niet het meten of volgen van de gebruikers zelf.Wanneer wij de analytische cookies zo instellen dat deze privacy vriendelijk zijn, dan is jouw toestemming niet nodig. Wanneer de analytische cookies gevolgen kunnen hebben voor jouw privacy, dan mogen wij deze cookies niet plaatsen zonder jouw toestemming. Wij plaatsen zelf analytische cookies (zogenaamde first party cookies), en maken hierbij ook gebruik van andere partijen (zogenaamde third party cookies). Marketing cookiesOp andere websites zie je wel eens reclames of aanbiedingen van StudyGo. Soms zijn deze reclames voor iedereen hetzelfde en soms zijn deze speciaal gemaakt voor jou of een bepaalde gebruiker. Als de reclames speciaal zijn voor een bepaalde gebruiker, dan gebruiken wij daarvoor tracking cookies. Met deze tracking cookies kunnen we jouw gedrag op de Website volgen (Cookies die mensen kunnen ‘volgen’, noemen we tracking cookies.). Door jouw gedrag te volgen, kunnen wij reclames van StudyGo laten zien die voor jou interessant zijn. Ook kunnen we zo voorkomen dat je een bepaalde reclame te vaak te zien krijgt en kunnen wij meten hoe vaak jij een reclame te zien krijgt. Tracking cookies hebben gevolgen voor jouw privacy. Zonder jouw toestemming, plaatsen wij dus nooit tracking cookies.Een overzicht van de cookies op StudyGo vind je hieronder :CookienaamUitgever (StudyGo of derde partij)DoelDuurConsent nodig (ja/nee)PHPSESSIDStudyGobehoudt de status van de gebruikerssessie over paginaverzoeken.sessieNeewc_cart_hash_#StudyGoniet geclassificeerdpersistentNeewc_fragments_#StudyGoniet geclassificeerdsessieNee_gaStudyGoregistreert een uniek ID dat wordt gebruikt om statistische gegevens te genereren over hoe de bezoeker de website gebruikt.2 jaarJa_ga_#StudyGogebruikt door Google Analytics om gegevens te verzamelen over het aantal keren dat een gebruiker de website heeft bezocht, evenals de data voor het eerste en meest recente bezoek.2 jaarJa_gatStudyGogebruikt door Google Analytics om de aanvraagsnelheid te vertragen1 dagJa_gidStudyGoregistreert een uniek ID dat wordt gebruikt om statistische gegevens te genereren over hoe de bezoeker de website gebruikt1 dagJa_gaexpStudyGodeze cookie wordt gebruikt door Google Analytics om te bepalen of de bezoeker betrokken is bij hun marketingexperimenten.80 dagenJaads/ga-audiencesderde partij (google.com)gebruikt door Google AdWords om bezoekers die waarschijnlijk zullen converteren naar klanten opnieuw aan te trekken op basis van het online gedrag van de bezoeker op verschillende websites.sessieJacollectderde partij(google-analytics.com)gebruikt om gegevens naar Google Analytics te sturen over het apparaat en gedrag van de bezoeker. Volgt de bezoeker op verschillende apparaten en marketingkanalen.sessieJabing.comMicrosoft (Bing)gebruikt om advertentie-inhoud op de website te implementeren – De cookie detecteert de efficiëntie van de advertenties en verzamelt bezoekersgegevens voor verdere bezoekerssegmentatie.365 dagenJact.pinterest.comPinterestgebruikt om advertentie-inhoud op de website te implementeren – De cookie detecteert de efficiëntie van de advertenties en verzamelt bezoekersgegevens voor verdere bezoekerssegmentatie.365 dagenJadev.visualwebsiteoptimizer.comVWOgebruikt voor experimenten op de website zodat een bepaalde variatie blijvend kan worden vertoond als u een pagina in de toekomst opnieuw bezoekt.100 dagenJadoubleclick.net, google.comGoogle Adsgebruikt om advertentie-inhoud op de website te implementeren – De cookie detecteert de efficiëntie van de advertenties en verzamelt bezoekersgegevens voor verdere bezoekerssegmentatie.sessieJalinkedin.comLinkedingebruikt om advertentie-inhoud op de website te implementeren – De cookie detecteert de efficiëntie van de advertenties en verzamelt bezoekersgegevens voor verdere bezoekerssegmentatie.365 dagenJasc-static.net, snapchatSnapchatgebruikt om advertentie-inhoud op de website te implementeren – De cookie detecteert de efficiëntie van de advertenties en verzamelt bezoekersgegevens voor verdere bezoekerssegmentatie.sessieJatiktok.comTikTokgebruikt om advertentie-inhoud op de website te implementeren – De cookie detecteert de efficiëntie van de advertenties en verzamelt bezoekersgegevens voor verdere bezoekerssegmentatie.sessieJaUitlezen informatie zonder cookiesWij kunnen ook informatie uit je browser en Apparatuur lezen zonder gebruik te maken van cookies. Wij verzamelen bijvoorbeeld (technische) eigenschappen van je Apparatuur en de software die je gebruikt. Daarbij kan je denken aan welk besturingssysteem je gebruikt en welke browser je gebruikt. Wij gebruiken deze informatie om de Website optimaal te laten werken.Verwijderen cookiesAls je toestemming hebt gegeven voor cookies op de Website, kun je die altijd intrekken. Je kan dit doen in de instellingen van je browser (dus in de instellingen van Chrome, Firefox, Internet Explorer, etc). In de help functie van je browser kan je zien hoe je de cookies kunt verwijderen. Ook kun je de meeste cookies die bij het gebruik van de Website worden geplaatst, los of allemaal samen weigeren via https://www.youronlinechoices.com/pl/twojewybory.Let op: Je moet er rekening mee houden dat het verwijderen van cookies kan betekenen dat bepaalde onderdelen van de Website niet of niet goed meer werken.Privacy statementBij het gebruik van cookies worden soms ook persoonsgegevens verwerkt. Je kan ons Privacy Statement lezen voor meer informatie daarover.WijzigingenWij kunnen dit Cookie Statement altijd aanpassen. Als dat zo is, laten we dat weten via de Website.VragenAls je vragen hebt over dit Cookie Statement dan kun je een e-mail sturen aan [email protected].Laatst gewijzigd op 30 augustus 2024."
