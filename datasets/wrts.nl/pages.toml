title = "Melding van onrechtmatige Content - StudyGo"
description = "We hechten veel waarde aan de kwaliteit van ons platform en de input van onze gebruikers. We zijn blij met verschillende vragen en bijdragen van onze gebruikers, maar we accepteren geen opmerkingen die beledigend zijn of duidelijk aanstootgevend voor andere gebruikers. Soms zijn er gebruikers die content plaatsen en onze regels overtreden of onze leeromgeving […]"
full_description = "Melding van onrechtmatige Content We hechten veel waarde aan de kwaliteit van ons platform en de input van onze gebruikers. We zijn blij met verschillende vragen en bijdragen van onze gebruikers, maar we accepteren geen opmerkingen die beledigend zijn of duidelijk aanstootgevend voor andere gebruikers. Soms zijn er gebruikers die content plaatsen en onze regels overtreden of onze leeromgeving verstoren. Met content bedoelen we alle inhoud van gebruikers zoals vragen, posts, discussies, lijsten, berichten in groepen, chats, commentaren en andere berichten, ongeacht op welk deel van ons platform (hierna “Content” genoemd).Als onze regels worden overtreden, kunnen jullie ons helpen door Content te rapporteren. We stellen het zeer op prijs als onze gebruikers problemen met Content melden. Ondanks dat we zelf actief monitoren, kunnen we niet overal tegelijk zijn. Wanneer je melding maakt van een probleem met Content, kunnen wij de Content onderzoeken en verdere actie ondernemen als dat nodig is.Om een probleem met Content te melden, kan je hier terecht. Klik onder de categorieën op “Melden onrechtmatige content” geef een korte uitleg over waarom je de Content rapporteert, voeg indien mogelijk een kopie van de betreffende Content toe en klik tot slot op “Verzenden”.Bij de functie “Vragen” kan je ook direct een melding maken van een probleem met Content. Ga naar “Meer opties” door te klikken op de drie bolletjes naast de vraag en druk op de “Rapporteren” knop. Je kunt daarbij aangeven waarom je de vraag rapporteert en klik tot slot op “Verzenden”.Een link naar onze algemene voorwaarden met daarin ook onze Content Regels vind je hier."
