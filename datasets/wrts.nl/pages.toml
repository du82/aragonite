["https://wrts.nl/nl/richtlijnen-voor-ai"]
title = "Richtlijnen voor AI"
description = "In dit statement leggen we uit op welke manier we kunstmatige intelligentie (“AI”) inzetten en hoe we dat op een verantwoorde manier doen."
full_description = "Richtlijnen voor AI In dit statement leggen we uit op welke manier we kunstmatige intelligentie (“AI”) inzetten en hoe we dat op een verantwoorde manier doen. Futurewhiz (bekend van de platformen Squla, Studira, scoyo en StudyGo) zet zich in om elk kind te laten groeien door gepersonaliseerd onderwijs. We stimuleren nieuwsgierigheid, zelfvertrouwen en een levenslange liefde voor leren bij kinderen door middel van plezierige games en ervaringen.Hoe gebruiken wij AI?Wij maken sinds 2009 educatieve content zoals uitleg, oefeningen en feedback voor onze platforms. Voorbeelden zijn quizzen en spellen voor Squla, oefeningen en leerpaden voor Studira en vragen en toetsen voor StudyGo. Met onze ruime ervaring weten onze content experts precies welke content past bij welke doelgroep en helpen we kinderen met leren.​​AI wordt steeds beter in het maken van content. Daarom kijken we hoe we AI kunnen gebruiken om onze missie te bereiken: elk kind in staat stellen te groeien door middel van gepersonaliseerd onderwijs.We zetten AI in op verschillende manieren, zoals bij het ontwikkelen van onze oefeningen, het maken van afbeeldingen, en het ontwikkelen van leerpaden. Bijvoorbeeld:Oefeningen: We delen onze oefeningen met AI en vragen om soortgelijke oefeningen van hetzelfde niveau. Die onze content experts vervolgens beoordelen.Uitleg verbeteren: We vragen AI om verbetersuggesties voor onze uitleg bij games, oefeningen en toetsen.Leerpaden: We gebruiken AI bij het helpen ontwikkelen van gepersonaliseerde leerpaden.Onze principesWe zijn enthousiast over de mogelijkheden van AI, maar willen AI op een verantwoordelijke manier inzetten. Omdat onze diensten op kinderen zijn gericht, zijn we extra voorzichtig. We hebben een aantal principes afgesproken om AI verantwoord te gebruiken. Deze principes lees je hieronder. Transparantie: We zijn open over ons gebruik van AI. Wanneer gebruikers direct met AI in contact komen, zullen we dit altijd duidelijk maken.Privacy: Bij Futurewhiz is privacy heel belangrijk. We behandelen de gegevens van onze gebruikers met grote zorg en beschermen deze. Privacy is altijd een aandachtspunt vanaf het begin van elk AI-gebruik binnen Futurewhiz (privacy by design). We werken alleen samen met bedrijven die aan onze privacyregels voldoen. Veiligheid en vertrouwen: We gebruiken AI alleen om handige functies te geven en leren leuker te maken. We gebruiken sterke beveiliging om problemen te voorkomen. We testen AI altijd grondig en doen risicobeoordelingen vooraf. Zo willen we risico’s op schade beperken. Menselijke kennis: We ontwikkelen Squla, Studira en StudyGo met onze unieke kennis en menselijke inzichten, ondersteund door AI. Wanneer we AI inzetten om content te maken, controleren we de output zorgvuldig of deze juist, geschikt en effectief is. We zorgen ook voor training van onze medewerkers zodat zij AI goed kunnen gebruiken en de risico’s begrijpen.Heb je vragen of opmerkingen over dit statement of over het gebruik van AI binnen Futurewhiz, neem dan contact met ons op via [email protected].Omdat ons gebruik van AI constant in ontwikkeling is, zullen we deze pagina van tijd tot tijd updaten. Laatst bijgewerkt: 6 augustus 2024.Futurewhiz"
year_published = 2025
year_updated = 2024
