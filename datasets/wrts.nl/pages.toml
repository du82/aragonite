["https://wrts.nl/nl/regels-voor-eerlijk-gebruik"]
title = "Regels voor eerlijk gebruik StudyGo"
description = "Deze regels gaan over eerlijk gebruik van StudyGo. In deze regels vertellen we hoe je StudyGo netjes en op een goede manier kunt gebruiken."
full_description = "Regels voor eerlijk gebruik Deze regels gaan over eerlijk gebruik van StudyGo. In deze regels vertellen we hoe je StudyGo netjes en op een goede manier kunt gebruiken. Houd je je niet aan deze regels, dan kunnen wij ervoor zorgen dat je StudyGo (tijdelijk) niet meer kan gebruiken.Deze regels gelden naast onze algemene voorwaarden. De algemene voorwaarden kun je hier lezen.Een online bijles boeken: Je kunt gebruikmaken van online bijles als dat in je pakket zit. Wij houden rekening met een maximaal aantal leerlingen voor elke bijles of leraar.Als je een bijles inplant, zorg je ervoor dat je aanwezig bent. Als je toch niet aanwezig kan zijn, annuleer de bijles dan ten minste 24 uur van tevoren. Zodat er dan iemand anders wel kan meedoen. Als we merken dat je vaker afwezig bent of vaker te laat afzegt, kunnen we je toegang tot de bijlessen beperken.Als de bijlessen heel vol zijn, kunnen we het aantal bijlessen per persoon beperken. Gebruik van jouw account:Jouw StudyGo account is van jou. Je mag iemand anders geen gebruik laten maken van jouw account. Je mag jouw account ook niet delen, bijvoorbeeld om bijles voor iemand anders in te plannen. Als we geloven dat iemand anders jouw account gebruikt, of je jouw account deelt, kunnen we jouw toegang blokkeren. Je kunt dan bijvoorbeeld ook geen online bijles meer voor jezelf boeken. Heb je het idee dat iemand anders jouw account gebruikt? Reset dan hier jouw wachtwoord of neem hier contact op met onze klantenservice. Verboden gebruik: Je mag StudyGo alleen gebruiken als je je netjes gedraagt. Respecteer ons en de andere gebruikers. Hiermee bedoelen we dat je niet scheldt, niet pest, niet discrimineert, en niet op een andere manier onbeschoft bent tegen andere leerlingen, docenten of begeleiders.Je moet StudyGo gebruiken waar het voor bedoeld is. Het is bijvoorbeeld niet de bedoeling dat je content deelt die niks met school te maken heeft, spamt, dingen kapot maakt of dingen verkoopt via StudyGo. Dit past niet binnen het gebruik van ons platform.Als we zien dat je StudyGo niet goed gebruikt of je je niet netjes gedraagt, kunnen we actie ondernemen. We kunnen je waarschuwen, je account blokkeren of je account verwijderen. Hoe we dit aanpakken, lees je in hoofdstuk 2, paragraaf 6 van de algemene voorwaarden.Versie 7 augustus 2024"
year_published = 2025
year_updated = 2024
