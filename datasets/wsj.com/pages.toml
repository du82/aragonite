title = "Lettie Teague — Wine Columnist at The Wall Street Journal"
description = "Lettie Teague has been The Wall Street Journal’s wine columnist for 15 years, covering the world of wine from Argentina to Washington state and all the wine countries, regions and winemakers in between."
full_description = "On WineRed Wine Blends Can Be Surprisingly Great—If You Know Where to LookThe red blends marketed as such give the whole category a bad rap. Opt instead for these traditional blends of native grapes from regions that have produced them for centuries. Lettie TeagueFebruary 27, 2025 On WineWhen You BYOB, Are You Committing a Wine Faux Pas?It depends on where you live—and how much you tip. Our wine columnist reached out to wine pros around the country to get a handle on what’s reasonable to expect of the diner, fair to the server and respectful to the sommelier. Lettie TeagueFebruary 20, 2025 On WineThis Wine Is a Good Aperitif. That’s Not an Insult.Light-bodied. Brisk. Bright. Something to spur the appetite. Who wouldn’t want to kick off a meal with a wine like that? An aperitif might not be the most complex or even wholly satisfying option, but that’s precisely the point. Lettie Teague / Illustrations by Andrea Manzati February 13, 2025 on wine | lettie teagueIs Low-Calorie Wine Worth Drinking? If It’s a Sauvignon Blanc, Maybe.A few of the lower-calorie/lower-alcohol wines our columnist tasted—the Sauvignon Blancs in particular—proved pleasant. But when a quality dry Champagne or Vinho Verde proves just as light, are we falling too hard for the hype? Lettie TeagueJanuary 30, 2025 On WinePre-Pinot Grigio, This Wine Was the Chic Italian White. Is It Time to Give Gavi Another Try?Picture an elegant evening out during the Studio 54 era. The wine on the table: very likely a Gavi. Why doesn’t this dry, dazzlingly acidic, very food-friendly white get more love today? Lettie TeagueJanuary 23, 2025 FashionThis Savvy Wine Collector Got His Greatest ROI From SharingIn a crowded stone cellar he left unlocked, Jeff Joseph kept a world-class collection rich in blue-chip Burgundies. Our columnist and others lucky enough to visit it found rewards far beyond great wine. Lettie TeagueJanuary 16, 2025 On WineI Will Buy Fewer Bottles of Chablis—and Other Wine Resolutions for 2025Let’s agree to broaden our wine horizons this year. Explore new regions, or places we’ve waited too long to revisit. Try new bottles instead of buying the same wine over and over again—unless you really, really love it. Lettie Teague / Illustrations by Lehel Kovács December 31, 2024"
