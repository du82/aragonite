["https://www.wsj.com/about-us"]
title = "About Us - The Wall Street Journal"
description = "Meet the Editors, Executives, and Leadership team at The Wall Street Journal."
full_description = "The Wall Street Journal was founded in July 1889. Ever since, the Journal has led the way in chronicling the rise of industries in America and around the world. In no other period of human history has the planet witnessed changes so dramatic or swift. The Journal has covered the births and deaths of tens of thousands of companies; the creation of new industries such as autos, aerospace, oil and entertainment; two world wars and numerous other conflicts; profound advances in science and technology; revolutionary social movements; the rise of consumer economies in the U.S. and abroad; and the fitful march of globalization. We are the definitive source of news and information through the lens of business, finance, economics and money, global forces that shape the world and are key to understanding it. Our audience is anyone who wants or has a job, a career or an ambition; who seeks money, makes money, spends money and saves money; who desires an edge as an investor, an employee, a manager or an entrepreneur; or who simply wants to better understand how the world works. We provide facts, data and information, not assertions or opinions. We believe in full separation between News and Opinion. We pursue exclusive stories, with the goal of breaking all important scoops in our core areas; deep insight and analysis; and actionable intelligence—being the first read and the last word. We have a unique, trusted responsibility as a watchdog and custodian. Across coverage, we seek a genuinely diverse set of voices and experiences with every story striving to speak to as wide an audience as possible. As journalists, we are humble, curious, empathetic, informed and open-minded. Our work is plain, direct, concise and accessible, but not simplistic. Trust in our news, information and authority is the currency we seek to earn with all we produce. We have an important social purpose. Society benefits from a common set of verifiable facts and a broad set of voices that reflect our world, even in times of stress and division—indeed, especially in such times. Providing those facts informs debate and contributes to the greater good."
year_published = 2025
clearnet = "https://www.wsj.com/about-us"
