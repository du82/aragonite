full_description = "‘Douglas Is Cancelled’ Review: Hugh Bonneville’s Cyber SatireThe actor stars in Steven Moffat’s four-part series on BritBox as a TV host who becomes the subject of scandal when a social-media post alleges he told a sexist joke at a wedding. John AndersonMarch 4, 2025 ‘Deli Boys’ Review: Philly’s Accidental Kingpins on HuluCreator Abdullah Saeed’s comedy follows two Pakistani-American brothers in Philadelphia who, upon their father’s death, inherit a cocaine empire they never knew existed. John AndersonMarch 4, 2025 ‘My Dead Friend Zoe’ Review: A Soldier’s Ghost StorySonequa Martin-Green plays a traumatized Afghanistan War vet who is still hearing from a deceased comrade in Kyle Hausmann-Stokes’s dark comedy. Kyle SmithFebruary 27, 2025 ‘Last Breath’ Review: Claustrophobic CinemaBased on a true story, Alex Parkinson’s film recounting a diving job gone awry and the attempts to save stranded workers before time runs out doesn’t give its cast—including Woody Harrelson and Simu Liu—enough room to breathe. Kyle SmithFebruary 27, 2025 ‘The Monkey’ Review: Osgood Perkins’s Death-Dealing DollThe ‘Longlegs’ director returns with a gruesome horror film, based on a Stephen King short story, about a wind-up toy that unleashes random acts of violence. Kyle SmithFebruary 20, 2025 ‘Ex-Husbands’ Review: Griffin Dunne’s Melancholy Party CrasherIn writer-director Noah Pritzker’s observant drama, a father unexpectedly shows up at his son’s bachelor party in Mexico. Kyle SmithFebruary 20, 2025 ‘Cleaner’ Review: Daisy Ridley Does a ‘Die Hard’ RetreadThe actress stars in director Martin Campbell’s action movie, which follows a window cleaner who is stuck outside a skyscraper when terrorists take over a corporate gala within it. Zachary BarnesFebruary 20, 2025 ‘Oscar Micheaux: The Complete Collection’ Review: From Pullman Porter to PioneerA new five-disc set from Kino Lorber gathers the surviving films of the black director from the early days of cinema, who displayed remarkable artistic ambition and an abiding interest in exploring the social issues that Hollywood preferred to sidestep. David MermelsteinFebruary 19, 2025"
