full_description = "Turning PointsWhy We Don’t Trust Doctors Like We Used ToPatients often feel ignored and complain about disjointed care and a lack of communication. Clare AnsberryFebruary 23, 2025 Turning PointsWhy We Are Getting Worse at GrievingAmericans are exhausted by a string of tragedies and want to move on. Do we have a duty to care? Clare AnsberryFebruary 16, 2025 Turning PointsThey Cared for Each Other Into Their 80s. Then He Shot Her and Killed Himself.The strain of caregiving likely plays a role in murder-suicides among older adults, say researchers. Clare AnsberryJanuary 20, 2025 Turning PointsWhen ‘Middle Age’ Arrives in Your 20sStress is making young people feel older, with mounting concerns about job security, debt, child-care costs and caregiving. Clare AnsberryDecember 14, 2024 Turning PointsBoomers and Gen Xers Enter Their Gray Divorce Era, and Thanksgiving Won’t Be the SameWhen older parents divorce, family holidays can get complicated. Clare AnsberryNovember 23, 2024 LIVE COVERAGE POSTIn Butler, Pa., Concerns About Cost of Living, Leadership Clare AnsberryNovember 5, 2024 Turning PointsA Pastor Wrestles With Politics From the PulpitReligious leaders are grappling with how to lead divided flocks during a tense election season. Clare Ansberry | Photographs by Michelle Gustafson for WSJ October 27, 2024 U.S.Wealthier Americans Are Paying Millions to Age in Luxury CampusesAfter seeing their friends and parents struggle to find care as they aged, older people are embracing life plan communities. The one-time entrance fees can exceed $1 million. Clare Ansberry | Photographs by Katie Thompson for WSJ October 27, 2024 Turning PointsThe Keys to Aging at Home? Frank Conversations and Financial PlanningWhat to do now to stay in your own home as you grow older. Clare AnsberrySeptember 25, 2024 Election 2024‘No Politics Allowed’: These Americans Are Avoiding the Conversation at All CostsPeople who are exhausted by heated discourse and relentless headlines are retreating to apolitical havens. Clare Ansberry and Kris MaherSeptember 9, 2024"
