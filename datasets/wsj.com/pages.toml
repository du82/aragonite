full_description = "‘Tango After Dark’ Review: Germán Cornejo’s Contemporary Take on a Classic StyleThe choreographer’s run at New York’s Joyce Theater features tango dancing infused with jazz, ballet and acrobatics. Robert GreskovicMarch 4, 2025 ‘Anima Animal’ Review: Herman Cornejo’s Dance at the JoyceThe dance devised by Herman Cornejo with choreography by Anabella Tuliano draws inspiration from Vaslav Nijinsky and his interest in Argentine avians. Robert Greskovic February 20, 2025 New York City Ballet Winter 2025 Review: Stepping Through CenturiesThe company’s current season features an array of engaging mixed bills, including two world premieres: Justin Peck’s cuttingly contemporary ‘Mystic Familiar’ and Alexei Ratmansky’s take on the 19th-century ballet ‘Paquita.’ Robert GreskovicFebruary 12, 2025 ‘George Balanchine’s The Nutcracker’ and ‘The Hard Nut’ Review: Two Takes on a Christmas TreatNew York City Ballet restages its annual production of the elegant work at Lincoln Center, while Mark Morris Dance Group offers a more sinister interpretation of Tchaikovsky’s classic at the Brooklyn Academy of Music. Robert GreskovicDecember 18, 2024 Paul Taylor Dance Company Review: Highlights From Its HistoryAccompanied by the Orchestra of St. Luke’s, the troupe’s current Lincoln Center run is at its best in the works choreographed by its founder, with newer dances and world premieres proving less compelling. Robert GreskovicNovember 20, 2024 American Ballet Theatre Fall 2024 Review: Shorter Works ShineThe troupe’s season at Lincoln Center found its greatest success in its duets and one-act dances, with its longer capstone production of ‘Crime and Punishment’ proving more arduous. Robert GreskovicNovember 5, 2024 New York City Ballet Fall 2024 Season Review: Highlights From the Past, Hope for the FutureWhile classic dances provided the best showcases for the troupe, the company premiere of ‘Signs,’ by Gianna Reisen to three piano pieces by Philip Glass, showed the potential of its new repertoire. Robert Greskovic October 14, 2024"
