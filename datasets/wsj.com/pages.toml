full_description = "‘Grangeville’ Review: Samuel D. Hunter’s Play of Quiet PowerPaul Sparks and Brian J. Smith star as estranged half-brothers in this moving, finely performed Signature Theatre production. Charles IsherwoodFebruary 27, 2025 ‘Liberation’ Review: Feminism and Frustration on BroadwayProduced by the Roundabout Theatre Company, Bess Wohl’s digressive drama toggles between the 1970s and today in tracking the women’s liberation movement. Charles IsherwoodFebruary 21, 2025 ‘Redwood’ Review: Idina Menzel Climbs Back to BroadwayThe Tony winner stars in a new musical about a woman who, trying to leave her past behind, seeks solace in the California forest. Charles IsherwoodFebruary 14, 2025 ‘The Antiquities’ Review: Exhibiting Humanity in an AI WorldJordan Harrison’s vividly imagined drama at Playwrights Horizons skips across centuries, past and future, as it depicts the evolving relationship between people and technology. Charles IsherwoodFebruary 6, 2025 ‘Beckett Briefs’ Review: Irish Rep’s Spellbinding Short PlaysF. Murray Abraham gives a riveting performance in ‘Krapp’s Last Tape,’ one of three one-acts by Samuel Beckett in a potently succinct production by the New York company. Charles IsherwoodJanuary 29, 2025 ‘Hugh Jackman: From New York, With Love’ Review: A Great ShowmanThe star sings selections from his career in theater and film, as well as a sprinkling of other songs, in a friendly and energetic show at Radio City Music Hall. Charles IsherwoodJanuary 27, 2025 ‘English’ Review: Language and Limits in a Broadway PlaySanaz Toossi’s buoyant, Pulitzer-winning drama follows a group of Iranians learning English, highlighting the desires and circumscribed circumstances that have brought them to the class. Charles IsherwoodJanuary 24, 2025 ‘Show/Boat: A River’ Review: Charting a New CourseTarget Margin Theater stages a radical reinterpretation of the classic Jerome Kern-Oscar Hammerstein musical at NYU Skirball. Charles IsherwoodJanuary 16, 2025"
