full_description = "Robert Altman at 100: Filmmaking’s Master IronistBorn a century ago, the American director created an eclectic body of work—from ‘M*A*S*H’ to ‘McCabe & Mrs. Miller’—that is held together by a playful, often parodic approach to genre and an interest in the hubbub of the everyday. Peter TonguetteFebruary 15, 2025 Abraham Lincoln, SupermodelFor all his modesty and wartime preoccupation, the 16th president was one of the most photographed men of his time, with a canny sense of the political power of images. Harold HolzerFebruary 12, 2025 Moving the Mona Lisa: Macron’s Plan to Improve the LouvreThe French president announced last week an extensive overhaul of the legendary museum, including a dedicated gallery for Leonardo’s masterpiece and a new entrance and exit that would take advantage of long-underused public spaces. James GardnerFebruary 4, 2025 Art and Fire in California and BeyondThe threats to the two Getty museums from the California wildfires highlight the often surprising steps such institutions take to protect their collections. Eric GibsonJanuary 16, 2025 It’s a Bird! It’s a Drone! It’s . . . ‘The Purple People Eater’!Sheb Wooley’s novelty song about an alien creature—which flew to the top of the charts in 1958—reminds us that the idea of mysterious forces in the sky above us has long had an irresistible lure. Bob GreeneDecember 20, 2024 ‘The Godfather Part II’ at 50: The Price of a Family’s PowerOften described as the greatest sequel ever made, Francis Ford Coppola’s classic drama derives enduring gravity from Al Pacino’s portrayal of Michael Corleone’s commitment to the criminal life. Kyle SmithDecember 18, 2024 Linda Ronstadt’s ‘Heart Like a Wheel’ Turns 50The singer’s fifth album proved to be her breakthrough, an eclectic country-rock collection that showcased her taste in material and seductive talents as a musical interpreter. Marc MyersNovember 27, 2024 Hoagy Carmichael at 125: A Stardust-Sprinkled SongsmithThe composer and lyricist left a law career to create one of the most recognizable bodies of work in popular American music, incorporating jazz phrasing into sophisticated yet warmly nostalgic melodies. John Edward HasseNovember 16, 2024"
