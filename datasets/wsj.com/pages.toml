title = "Laura Saunders — Reporter at The Wall Street Journal"
description = "Laura Saunders has long specialized in writing about taxes, first at Forbes and since 2009 for the Wall Street Journal. “Taxes sit squarely at the intersection of economics and politics, with consequences for everybody,” she says. When not writing about the code, she indulges her passion for literature and has published essays on Ralph Ellison, Flannery O’Connor, and Herman Melville. She earned a B.A. from Sewanee: the University of the South, and an M.A. from Columbia University. She lives with her family in New York City. Follow her at @Saunderswsj and Google+."
full_description = "Tax ReportProtect Yourself From Tax Identity Theft. Here’s How I Did. Scam artists are filing false tax returns to claim refunds under other people’s names. If it happens to you, it could take two years for the IRS to sort it out. Laura SaundersFebruary 28, 2025 U.S.Live Q&A: Our Reporters Answered Your Tax-Season QuestionsWSJ subscribers asked our reporters about inheritances, deductions, estates, capital gains, the IRS, Roth contributions and more.. Richard Rubin, Laura Saunders and Ashlea EbelingFebruary 26, 2025 Personal FinanceYour Guide to Taxes for Retirees and Retirement AccountsA cheat sheet on contributing to, withdrawing from and converting 401(k)s, traditional IRAs, Roth IRAs and other funds. Laura SaundersFebruary 19, 2025 Tax ReportRaiding Your Retirement Funds? Here’s How to Avoid Hidden Tax Traps“I’m still mad about it,” says one taxpayer who was hit with a 10% penalty. Laura SaundersFebruary 14, 2025 Personal FinanceYour Guide to Taxes for InvestorsA cheat sheet for issues related to capital gains, dividends and more. Laura SaundersFebruary 12, 2025 tax reportWhen Paying More Tax, Not Less, Is the Smart PlayTaxpayers should consider whether strategically “accelerating” their income—and paying tax on it—can reduce what they’ll owe Uncle Sam over time Laura SaundersJanuary 31, 2025 FinanceKey Tax Numbers That Have—and Haven’t—Changed for 2025A cheat sheet for new brackets, deductions and credits you need to know for filing 2024 taxes and for this year’s tax planning. Laura SaundersJanuary 29, 2025 Tax Report | LAURA SAUNDERSHow to Avoid Costly Tax Blunders in 2025Make a New Year’s resolution for your taxes. Here are five to consider. Laura SaundersDecember 27, 2024 Tax ReportHow Seniors Can Donate More to Charity and Pay Less in TaxesWhile all Americans can get tax breaks for giving, those 70½ or older have the best choices. Here’s the rundown on two key tax-favored ways to give. Laura SaundersDecember 13, 2024"
