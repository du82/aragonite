title = "Jason Gay — Sports Columnist at The Wall Street Journal"
description = '''Jason Gay is The Wall Street Journal’s sports columnist. In 2024, Jason's sports column was awarded first place by the National Society of Newspaper Columnists. He was named Sports Columnist of the Year by the Society of Professional Journalists in 2010, 2016 and 2019. He is author of the essay book "I Wouldn't Do That If I Were Me," published in 2022, and his 2015 bestseller “Little Victories” was a finalist for the Thurber Prize for American Humor. Write to Jason at jason.gay@wsj.com, and follow him on Twitter @jasongay. Sign up to receive email alerts from Jason Gay.'''
full_description = "Jason GayThe Rowdy Rebirth of Rick Pitino and St. John’s BasketballThe peripatetic 72-year-old coach keeps reviving his reputation in the Big Apple. The NCAA tournament beckons. Jason GayMarch 3, 2025 Jason GayThe Tough College Hockey Team That’s Been Coached by the Same Family for 75 SeasonsSomeone with the last name Riley has been the head coach of Army hockey for every season since 1950-51. Brian Riley will soon retire, marking the end of a remarkable run at West Point. Jason GayFebruary 27, 2025 Jason Gay‘I’ve Been Impaled’ to a Historic 100th Victory: Why Mikaela Shiffrin Remains a Great American ChampionThe 29-year-old alpine skier has made a convincing case as the best ever. But her superpower may be her relentless honesty. Jason GayFebruary 24, 2025 Jason GayHairy Tale in New York: Yankees Clip Fussy Grooming PolicyWas an old franchise edict (no beards!) holding the Bronx Bombers back competitively? Or are they now just like everyone else? Jason GayFebruary 22, 2025 Jason GayHockey’s Spectacular Night Ends With an Overtime Thriller—and Canada’s Cold RevengeWorld-class talent, national pride and border tension turn a brand-new NHL showcase into a tournament for the ages. Jason GayFebruary 21, 2025 Jason GayDrop Your Gloves! Are Team USA and Canada Delivering the Hockey Showdown of the Decade?The finale of the NHL’s ‘4 Nations Face-Off’ features a pair of rivals with rowdy recent history. Jason GayFebruary 19, 2025 Jason GayLos Angeles Has Another Must-See Basketball Sensation. It’s Not Luka—It’s JuJu.USC’s JuJu Watkins may be the most entertaining show in the college game. On Thursday, her No. 6 Trojans face a serious test: their crosstown rival, undefeated No. 1 UCLA. Jason GayFebruary 12, 2025 Jason GayCan a Super Bowl Blowout Be Beautiful? For the Philadelphia Eagles, YesA night that teased at NFL history becomes a different kind of statement: Winning is hard. Jason GayFebruary 10, 2025 The Saturday EssayThe Extremely Casual Football Fan’s Guide to Enjoying the Super BowlNot everyone is a football obsessive. This handbook is for them. Jason GayFebruary 7, 2025"
