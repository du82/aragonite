 this summer followed by the Christmas season’s many stagings of “The Nutcracker,” danced to Tchaikovsky’s 1892 score, combined to spark my memory and rewatch of the first full-length feature starring the popular doll—2001’s 78-minute animated movie “Barbie in the Nutcracker,” from Mattel Entertainment and Mainframe Entertainment..css-c4tfi7-Layout-baseCss{margin:0 0 22px 0;background:var(--primary-background-color);margin-bottom:22px;}@media (min-width: 640px){.css-c4tfi7-Layout-baseCss{clear:both;float:left;margin:16px 32px 16px 0;width:300px;}.css-c4tfi7-Layout-baseCss:nth-of-type(1){margin-top:0;}}.css-9w6hxa-MainWrapper-MainWrapper-MainWrapper-MainWrapper-MainWrapper{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;position:relative;max-height:600px;width:100%;}.css-9w6hxa-MainWrapper-MainWrapper-MainWrapper-MainWrapper-MainWrapper iframe[style]{width:100%!important;max-width:unset!important;min-width:unset!important;margin:0!important;}.css-9w6hxa-MainWrapper-MainWrapper-MainWrapper-MainWrapper-MainWrapper iframe[style]{opacity:0!important;}.css-1tdi9ug-FadeWrapper{width:100%;overflow:hidden;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-ms-flex-pack:center;-webkit-justify-content:center;justify-content:center;}.css-bpmh2r-Container{color:var(--secondary-text-color);background-color:var(--primary-background-color);width:100%;padding-bottom:20px;border-bottom:1px solid #dadada;}.css-1ssp6oj-Subhed{border-bottom:1px solid #dadada;color:var(--primary-text-color);font-family:var(--font-font-stack-retina);font-size:calc((14 / var(--article-base-font-size)) * var(--article-text-size-scale) * 1rem);font-weight:var(--font-weight-regular);font-style:normal;line-height:calc(16 / 13);margin:0 0 10px 0;padding:10px 0;text-transform:uppercase;letter-spacing:calc(0.8 * var(--article-text-size-scale) * 1px);}.css-12yf2la-Paragraph{font-size:calc((15 / var(--article-base-font-size)) * var(--article-text-size-scale) * 1rem);font-weight:var(--font-weight-regular);font-family:var(--font-font-stack-retina);line-height:calc(24 / 15);margin-bottom:1em;word-wrap:break-word;}.css-11kxzt3-Strong{font-weight:var(--font-weight-medium);}Barbie in the Nutcracker.css-i6hrxa-Italic{font-style:italic;}Video on demand and DVDGiven the name recognition of the perennially popular “Nutcracker”—particularly George Balanchine’s influential 1954 production for New York City Ballet (now playing at the David H. Koch Theater through Dec. 31)—the Barbie animation’s creative team saw no need to put “ballet” in its title. But in the candy-colored and essentially gentle-hearted presentation, ballet’s distinctive schooling and artful choreographic possibilities grace the movie with rewarding detail. Peter Martins, then NYCB ballet-master-in-chief and a former stellar principal dancer, has choreographic credit, while NYCB dancers from the film’s time served as computer-animated models for the dancing scenes. They feature Barbie (Maria Kowroski) as Clara, who turns into the Sugarplum Princess, and the Nutcracker (Charles Askegard), who, with shades of Ken, turns into her gallant partner, Prince Eric, who was Prince Coqueluche in the 1892 ballet.Barbie, a ballerina on pointe, opens and closes the film as Linda Engelsiepen and Hilary Hinkle’s sometimes complicated reworking of E.T.A. Hoffmann’s fantastical 1816 tale, “The Nutcracker and the Mouse King,” provides the animation with its narrative. Its characters range far beyond the source’s Germanic family at Christmastime with their children, their toys and some menacing mice, such as a skittish bat named Pimm and a loving aunt named Elizabeth. As Clara (Marie in the Hoffman story), Barbie, in her flats and high-waisted dress, faces and overcomes dramatic situations in which friendly and sinister characters play their parts; these include firefly-like snowflake and flower fairies, which owe a debt to Disney’s “Fantasia”; a snarling Mouse King; and a forbidding, heavy-footed Rock Giant. Throughout, intermittent excerpts from Tchaikovsky’s familiar score provide the action with a worthy soundtrack as actors, including a stentorian Tim Curry as Mouse King, voice the individual characters. The London Symphony Orchestra vibrantly performs the music credited to Arnie Roth, who reworked Tchaikovsky to fit the narrative’s needs, such as when the dramatic actions get background accompaniment as opposed to when the dancing asks for musical motivation.The film’s initial and final scenes are set in an airy ballet classroom where Barbie dances expertly alongside Kelly, her little sister, as a beginning ballet student. Barbie, all legs in her brief practice skirt and top, wearing shiny pointe shoes, offers example and encouragement to Kelly who, with her hair in a bun similar to Barbie’s, wears a pink leotard and works, appropriately for her age, on half-toe in soft slippers, displaying less of the sleek turn-out evident in Barbie’s mature limbs..css-16aepit{position:absolute;z-index:-1;top:0;left:-15000px;}Copyright ©2025 Dow Jones & Company, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8.css-189jf7p{margin-block-end:40px;}.css-1l45dal{border-color:rgba(34,34,34,1);border-style:solid;border-width:1px;border-width:0px;margin:0;border-top-width:1px;width:100%;margin-block-end:4px;}.css-13p0b4b{margin-block-end:24px;}.css-100x25h-StackWrapper{min-height:40px;}.css-1wuy3bd-StackWrapper{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;height:100%;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;margin-left:calc(-16px/