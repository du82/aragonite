opeans speaking somberly to each other, embodies a certain longstanding conception of quality cinema. It won the prize for best first feature at Cannes last year, and even boasts an elite pedigree: The director, Halfdan Ullmann Tøndel, is the grandson of Ingmar Bergman and Liv Ullmann. Yet the family’s artistic fortunes have evidently dwindled, for the new movie has all the oft-mocked pretension of classic art film and none of the poetry. It’s a work of almost ostentatious mediocrity.Renate Reinsve, best known for her performance in “The Worst Person in the World,” stars as Elizabeth, an actress who has, for mysterious reasons, receded from the spotlight. She is also the mother of Armand, a boy whose possible misbehavior prompts the central conflict of the film. This initially plays out in the form of a meeting attended by Elizabeth, teacher Sunna (Thea Lambrechts Vaulen), and Sarah and Anders (Ellen Dorrit Petersen and Endre Hellestveit), the parents of Armand’s classmate, Jon, whom they believe has been subject to Armand’s bullying..css-16aepit{position:absolute;z-index:-1;top:0;left:-15000px;}Copyright ©2025 Dow Jones & Company, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8.css-189jf7p{margin-block-end:40px;}.css-1l45dal{border-color:rgba(34,34,34,1);border-style:solid;border-width:1px;border-width:0px;margin:0;border-top-width:1px;width:100%;margin-block-end:4px;}.css-13p0b4b{margin-block-end:24px;}.css-100x25h-StackWrapper{min-height:40px;}.css-1wuy3bd-StackWrapper{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;height:100%;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;margin-left:calc(-16px/2);margin-right:calc(-16px/2);min-height:40px;}.css-1xnclyu{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display