 $10 a bottle and allow patrons to bring more than one; some may charge nearly 20 times that and only permit one. While corkage has become more popular in recent years as restaurant wine prices have escalated, it’s a fraught topic among wine professionals, as I found during my recent conversations with restaurateurs and sommeliers..css-16aepit{position:absolute;z-index:-1;top:0;left:-15000px;}Copyright ©2025 Dow Jones & Company, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8.css-189jf7p{margin-block-end:40px;}.css-1l45dal{border-color:rgba(34,34,34,1);border-style:solid;border-width:1px;border-width:0px;margin:0;border-top-width:1px;width:100%;margin-block-end:4px;}.css-13p0b4b{margin-block-end:24px;}.css-100x25h-StackWrapper{min-height:40px;}.css-1wuy3bd-StackWrapper{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;height:100%;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;margin-left:calc(-16px/2);margin-right:calc(-16px/2);min-height:40px;}.css-1xnclyu{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;height:100%;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:start;-ms-flex-pack:start;-webkit-justify-content:flex-start;justify-content:flex-start;margin-left:calc(-8px/2);margin-right:calc(-8px/2);}.css-1o99qvy{display:-webkit-inline-box;display:-webkit-inline-flex;display:-ms-inline-flexbox;display:inline-flex;margin-left:calc(8px/2);margin-right:calc(8px/2);}.css-i4syxp-SectionLabel{color:var(--color-inkBase, inkBase);}.css-1ogxxt7-SectionLabel{margin:0;font-family:Retina,Helvetica,Arial,sans-serif;font-size:18px;line-height:22px;font-weight:500;letter-spacing:0px;font-