 a mountain, but in this grim, sometimes grotesque saga of rage and retribution, the phrase also carries a bloodier meaning: In rural Ireland, someone is cutting the legs off sheep and leaving them to bleed to death flat on their bellies.A debut feature from British writer-director Christopher Andrews, the film is split into halves, each of which is told from the point of view of one of two feuding families. On one side is Michael (Christopher Abbott), a sheep farmer who has stepped into the family business while caring for his cranky, disabled father, Ray (Colm Meaney). A prologue establishes a foundation of agony for their strained relationship; the lady of the house died in a car accident that took place while Michael was at the wheel..css-16aepit{position:absolute;z-index:-1;top:0;left:-15000px;}Copyright ©2025 Dow Jones & Company, Inc. All Rights Reserved. 87990cbe856818d5eddac44c7b1cdeb8.css-189jf7p{margin-block-end:40px;}.css-1l45dal{border-color:rgba(34,34,34,1);border-style:solid;border-width:1px;border-width:0px;margin:0;border-top-width:1px;width:100%;margin-block-end:4px;}.css-13p0b4b{margin-block-end:24px;}.css-100x25h-StackWrapper{min-height:40px;}.css-1wuy3bd-StackWrapper{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;height:100%;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;margin-left:calc(-16px/2);margin-right:calc(-16px/2);min-height:40px;}.css-1xnclyu{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;height:100%;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-box-pack:start;-ms-flex-pack:start;-webkit-justify-content:flex-start;justify-content:flex-start;margin-left:calc(