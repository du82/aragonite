ds impassable or closed Clear form Results List Trip Reports Sort by: Sort by most recently hiked Sort by most recently submitted Trip Reports jQuery(document).ready(function($) { const BATCH_SIZE = 100, SHOW_BUTTON_TEXT = "Expand trip report text", HIDE_BUTTON_TEXT = "Collapse trip report text"; var requestedUrl = window.location.toString(), paramString = requestedUrl.indexOf('?') !== -1 && requestedUrl.split('?')[1] || '', portal_url = $('body').data('portal-url'), viewUrl = portal_url + '/@@search_tripreport_listing?b_size=' + BATCH_SIZE + '&' + paramString, $countTarget = $("#search_count_target"), $sortWidget = $("#trip-report-sortwidget"), $viewFormat = $("input[name='format']"), hash_index = viewUrl.indexOf('#') || view_url.length; // Strip hash viewUrl = viewUrl.replace(/#\w+/, ''); function sortUpdate(sort) { var urlWithSort = viewUrl + "&sort_on=" + sort; load_reports(urlWithSort); } function load_reports(url) { $('#kss-spinner').show(); $.ajax({ url: url, cache: true }).done(function (data) { $('#reports_target').html(data); prepareTripReportExcerpts($('.report-text')); // callback after load to set click event for listing bar tags $('#reports_target .pagination a').bind('click', function(event) { var jqthis = $(this); event.preventDefault(); if (jqthis.parents('.pagination').next().attr('id') != 'trip-reports') { // scroll to top of listings $('#trip-report-listing-header').get(0).scrollIntoView(); } load_reports(jqthis.attr('href')); }); $countData = $("#count-data"); $countTarget.html($countData.html()); $('#kss-spinner').hide(); }); } function prepareTripReportExcerpts( $reportText ) { $reportText.each( function() { const $jqThis = $(this); const $fullTripReport = $( '.trip-report-full-text', $jqThis ); const reportLength = $fullTripReport.text().length; const maxLength = 400; const buttonTextInitial = '<button class="expand-trip-report-excerpt">' + SHOW_BUTTON_TEXT + '</button>'; const $expandCollapseButton = $(buttonTextInitial); $expandCollapseButton.click(expandCollapseTripReportText); /* we only want to collapse excerpts that are significantly longer than the default excerpt length */ if( reportLength > maxLength ) { /* tabindex is required for focus management of button */ $excerpt = $('<p class="trip-report-excerpt" tabindex="0">' + $fullTripReport.text().substring(0,200).trim() + '&hellip;</p>'); $fullTripReport.attr('tabindex', 0); $excerpt.insertBefore($fullTripReport); $expandCollapseButton.insertAfter($fullTripReport); } else { $fullTripReport.show(); } }); } function expandCollapseTripReportText() { const $jqThis = $(this); const $fullTripReport = $jqThis.siblings( '.trip-report-full-text' ); const $excerpt = $jqThis.siblings( '.trip-report-excerpt' ); const isOpen = $jqThis.text() === HIDE_BUTTON_TEXT; if ( isOpen ) { $jqThis.text(SHOW_BUTTON_TEXT); $fullTripReport.slideUp(); $excerpt.slideDown(400,function() { $(this).focus(); }); } else { $jqThis.text(HIDE_BUTTON_TEXT); $excerpt.hide(); $fullTripReport.slideDown(400,function() { $(this).focus(); }); } /* required for CSS styling of the arrow */ $jqThis.toggleClass('is-open'); } // We have a sort selector which will need to re-fetch the Trip Report // list. $sortWidget.bind("change", function (event) { sort = $(this).val(); sortUpdate(sort); }) load_reports(viewUrl); $('#reports_target').delegate('a#trip-report-map-tab', 'click', function (e) { $viewFormat.val('map'); var mapsUrl = viewUrl.replace(/&format=[^&]+/, '') + '&format=map'; load_reports(mapsUrl); $('#trip-report-sort').hide(); e.preventDefault(); }); $('#reports_target').delegate('a#trip-report-list-tab','click', function (e) { $viewFormat.val('list'); var listUrl = viewUrl.replace(/&format=[^&]+/, '') + '&format=list'; load_reports(listUrl); $('#trip-report-sort').show(); e.preventDefault(); }); });'''
