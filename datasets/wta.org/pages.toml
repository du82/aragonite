title = "Andrews Creek — Washington Trails Association"
description = "Dive deep into the heart of the Pasayten Wilderness on the Andrews Creek trail. Walk along Andrews Creek through a burn zone. Connect to the Boundary trail after passing through a lush meadow of wildflowers."
full_description = '''Andrews Creek Dive deep into the heart of the Pasayten Wilderness on the Andrews Creek trail. Walk along Andrews Creek through a burn zone. Connect to the Boundary trail after passing through a lush meadow of wildflowers. https://www.wta.org/go-hiking/hikes/andrews-creek https://www.wta.org/site_images/hikes/andrew-pass.jpeg/@@download/image/andrewsCrk.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/andrews-creek", "name": "Andrews Creek", "description": "Dive deep into the heart of the Pasayten Wilderness on the Andrews Creek trail. Walk along Andrews Creek through a burn zone. Connect to the Boundary trail after passing through a lush meadow of wildflowers.", "url": "https://www.wta.org/go-hiking/hikes/andrews-creek", "image": "https://www.wta.org/go-hiking/hikes/andrews-creek/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 38, "ratingValue": 3.0, "ratingCount": 4, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 48.7842471498, "longitude": -120.108804703}} Andrews Creek North Cascades > Pasayten 48.7842, -120.1088 Map & Directions Length 31.0 miles, roundtrip Elevation Gain 4,000 feet Highest Point 6,700 feet Calculated Difficulty About Calculated Difficulty Hard Andrews Creek Valley in Fall color. Photo by Christian Gustafson. Full-size image Dogs allowed on leash Mountain views Ridges/passes Summits Wildflowers/Meadows Parking Pass/Entry FeeNorthwest Forest Pass Permits Required Wilderness permit. Self-issue at trailhead (no fee) Add Hike to My Backpack Saved to My Backpack Dive deep into the heart of the Pasayten Wilderness on the Andrews Creek trail. Walk along Andrews Creek through a burn zone. Connect to the Boundary trail after passing through a lush meadow of wildflowers. Continue reading Rating 3.00 out of 5 (4 votes) Log in to rate 38 trip reports for this trail Write a trip report Hiking Andrews Creek Take this trail into the heart of the Pasayten Wilderness. With everything from ridge views and peaks to creeks and wildflowers, this trail is a popular route for hikers looking to get a taste of the Pasayten and connect to the Boundary Trail. Follow Andrews Creek as you make your way deep into the stunning backcountry of the Okanogan. Begin the trek from the Andrews Creek Trailhead and climb gently between two ridges. Following the creek closely, enjoy the sound of the water and use it to cool off on a hot day. The trail travels through a burn site, so there is little cover from the sun to cool you off and it can get quite hot in the summer. After 5.5 miles, continue left at a junction and enjoy more views of Black Lake Ridge on the left. Make your way down the trail until you reach another junction with the Peepsight Trail. Continue right. Coleman Ridge and Remmel Mountain are on the right. Take in limitless views as you approach Andrews Pass. Andrews Peak is to the left. Once over the pass, the trail descends out of the burn area and into a meadow through which Spanish Creek runs. There are many pleasant places to camp along this section of trail. Cross the creek, and finish the trail by connecting with the Boundary Trail. Wildflowers are abundant and listen for the sounds of wildlife at night. This trail is part of WTA's Lost Trails Campaign. Learn more about how we're saving lost trails across the state here. WTA worked here in 2022, 2018 and 2015! Hike Description Written by McKenzie Carlson, WTA Correspondent Andrews Creek Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.2