title = "Little Mashel Falls - Pack Forest — Washington Trails Association"
description = "Three waterfalls, multiple viewing areas, and two different trailheads provide great choices for an excursion to Little Mashel Falls. The tallest waterfall plunges over 90 feet."
full_description = '''Little Mashel Falls - Pack Forest Three waterfalls, multiple viewing areas, and two different trailheads provide great choices for an excursion to Little Mashel Falls. The tallest waterfall plunges over 90 feet. https://www.wta.org/go-hiking/hikes/little-mashel-falls https://www.wta.org/site_images/hikes/little-mashel-falls-by-gfoley7.jpeg/@@download/image/Little Mashel Falls by Gfoley7.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/little-mashel-falls", "name": "Little Mashel Falls - Pack Forest", "description": "Three waterfalls, multiple viewing areas, and two different trailheads provide great choices for an excursion to Little Mashel Falls. The tallest waterfall plunges over 90 feet.", "url": "https://www.wta.org/go-hiking/hikes/little-mashel-falls", "image": "https://www.wta.org/go-hiking/hikes/little-mashel-falls/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 329, "ratingValue": 3.9, "ratingCount": 36, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 46.843623380653455, "longitude": -122.31222867965698}} Little Mashel Falls - Pack Forest Puget Sound and Islands > Seattle-Tacoma Area 46.8436, -122.3122 Map & Directions Length 5.0 miles, roundtrip Elevation Gain 500 feet Highest Point 1,100 feet Calculated Difficulty About Calculated Difficulty Moderate Little Mashel Falls. Photo by Gfoley7. Full-size image Good for kids Old growth Rivers Waterfalls Wildlife Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack Three waterfalls, multiple viewing areas, and two different trailheads provide great choices for an excursion to Little Mashel Falls. The tallest waterfall plunges over 90 feet. Continue reading Rating 3.94 out of 5 (36 votes) Log in to rate 329 trip reports for this trail Write a trip report Hiking Little Mashel Falls - Pack Forest Three waterfalls, multiple viewing areas, and two different trailheads provide great choices for an excursion to Little Mashel Falls. The tallest waterfall plunges over 90 feet. The falls are not “little”. The names derive from the Little Mashel River (pronounced like “Michelle”). The official names are Lower Little Mashel Falls, Little Mashel Falls, and Tom Tom Falls, but they are more commonly referred to as Lower, Middle, and Upper Falls, respectively. The two trails, Pack Forest and Bud Blancher, meet at a 3-way junction between the Lower and Middle falls. Both involve walking a crushed rock road/trail for much of the route. The Pack Forest trail has no facilities. It starts along a network of old roads which require more care to stay on the route, but also allow for much wandering if that is your plan. (Have a map.) The Pack Forest trail provides access to views unavailable from the Blancher Trail: Mount Rainier, and the lovely terraced cascade that heads south from the top of Tom Tom Falls. It has slightly more elevation gain and can be quite muddy where the trail leaves the road. Both trailheads are open year-round. If there are no maps on the Pack Forest trailhead kiosk, there may be some outside the second brown administration building to the right. From the kiosk, start uphill on “1000 Rd North”. Stay on the main road, at a quarter mile coming to a gate. The “Do Not Enter” sign applies to vehicles, allowing for “Hike In Only”. Continue through young growth forest, passing other roads on either side, as shown on the map. At 1.4 miles, note the intersection with Road 1050 on the right and 1060 on the left. The next junction will be unsigned, and the one you want. So at 1.9 miles, go left on Road 1070 at the ‘Y’ (unmarked). The forest becomes open meadows, with a possible glimpse of Mount Rainier. Continue straight until 2.1 miles, where a rock is painted with the word “FALLS” pointing left. (Straight ahead leads to a glimpse view of the terraced cascade around Tom Tom Falls.) Go left on dirt/mud trail, around a pond, and down a steep slope into the forest. At 2.3 miles is a 3-way junction that is shared by the two trails. From the shared junction, uphill to the northeast 450 feet is another junction. To the left (unmarked) is the Middle Falls, the tallest and arguably the best. For Middle Falls, go left 100 feet to an unsigned junction. Left again leads to the base of Middle Falls; right leads to the top. Proper footwear is essential here. Footing can be treacherously slick, and fatalities have occurred. Be careful. When back on the main trail, follow the sign to the right about 800 feet for a view of Upper Falls, about 150 feet distant. At the top of the falls, the Little Mashel River splits. Part of it tumbles down a terraced cascade to the south, which then makes a U-turn to the north. You would need to wade this to get close to the falls. Note: The land surrounding the falls has varied ownership, by the University of Washington, the city of Eatonville, and the City of Tacoma (the railroad above Tom Tom Falls - strictly off limits.) Please know where you are, and respect property rights. This is not a park, and there are no garbage cans. Pack it in; pack it out. WTA Pro Tip: The best times to visit the falls are not during peak runoff when heavy spray can interfere with photography and staying dry. Hike Description Written by Ken Giesbers, WTA Correspondent Little Mashel Falls - Pack Forest Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-122.31222867965698, 46.843623380653455], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "little-mashel-falls"}, containerId = "map", hike = {"trailhead": [-122.31222867965698, 46.843623380653455], "id": "little-mashel-falls", "title": "Little Mashel Falls - Pack Forest", "thumbnail": "https://www.wta.org/go-hiking/hikes/little-mashel-falls/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 46.8436, -122.3122 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There To access Little Mashel Falls from the Pack Forest, drive Hwy 161 to Eatonville. Make a right at the 4-way stop and proceed one block. Make a left onto Mashel Ave and follow Mashel Ave/Hwy 161 for three miles. Turn left onto Hwy 7. The entrance to Pack Forest is 0.3 miles down Hwy 7 on the left. There are a few parking spaces at the trailhead, with additional parking just through the gate to the left as well as parking up by the administration buildings. Print Email More Hike Details Trailhead Puget Sound and Islands > Seattle-Tacoma Area University of Washington School of Environmental and Forest Sciences Guidebooks & Maps http://www.packforest.org/education/11x17_low2.pdf Download a map to plan your hike Learn Day Hike Packing List Learn 16 Lighthouse Hikes You Can Enjoy All Year You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
