["https://www.wta.org/our-work/wtas-equity-work"]
title = "WTA’s Commitment to Stand Against Racism — Washington Trails Association"
description = "WTA and Back Country Horsemen of Washington team up for their first all-women volunteer trip. By Victoria Obermeyer."
full_description = "WTA’s Commitment to Stand Against Racism https://www.wta.org/our-work/wtas-equity-work https://www.wta.org/@@site-logo/wta-logo.png WTA’s Commitment to Stand Against Racism Washington Trails Association is committed to trails for everyone, forever. To make that a reality, we must all come together to make the nation a more just, equitable and safe place for everyone, everywhere, regardless of the color of their skin. As a predominantly White organization, we know it is our work to help dismantle institutional racism. We are constantly working to become an equitable organization and standing up against all racial injustice. We are dedicated to working with our community and partners to overcome the deep and enduring impacts of racism in our organization and in the outdoor recreation environment more broadly. We have much work to do. TRAILS FOR EVERYONE, FOREVER WTA's commitment toward diversity, equity and inclusion Our progress report and what's next Support our partners working toward a more just future Resources for racial and social justice Why this matters Racial justice is essential to our mission. People of color often face unique challenges to getting outdoors, including inequitable access to local trails due to unwarranted suspicion, confrontation and violence when recreating outdoors; a history of underinvestment in particular communities; and structural inequity that creates high barriers for some individuals and communities to participate in outdoor activities. Until our nation is a just, equitable and safe place for everyone and until the outdoors is welcoming and accessible to hikers of all backgrounds, regardless of race, we won’t truly have trails for everyone, forever. What we’re doing WTA has been actively working on our commitment to diversity, equity and inclusion (DEI) for several years — and we acknowledge that we still have a lot of work to do both in our organization and with the broader outdoor community. Events in the news continue to highlight the ongoing history of racial violence against people of color in America. It is critical for White-led organizations and beneficiaries of dominant culture in the outdoor community to examine the racial inequities inherent in our industry and to take steps to dismantle structural racism and systemic white privilege in all its forms. Here are some of the steps we’re taking: Diversity Equity and Inclusion (DEI) Plan: In 2020, WTA wrapped up our first DEI plan (read our report on our progress). The plan focused on reducing barriers to the outdoors faced by historically marginalized communities, including people of color. That work will continue, and we are working with our board, staff and community partners to refresh this plan for the next 2-3 years. We commit to sharing the specific actions we plan to take to continue to reduce those barriers, to work anti-racism into our curriculum and trainings, and lift up those working to undo the history of inequity and institutionalized racism. Organizational learning: As a predominantly White organization, it is incumbent upon us to understand what we can do to better support the people of color on our staff, partners and communities of color, and to explore ways to make our organization and culture a more attractive place to work. This also applies to better supporting our staff and partners from all communities of color. We commit to examining and improving our own recruiting, hiring and retention policies and practices to make them more equitable, and to undoing practices, policies and ways of doing business that are rooted in White dominant culture. Direct support to community groups: One way we have already been supporting community groups and partners is through our Outdoor Leadership Training (OLT) mini-grant program. This program provides up to $500 in funding assistance to community partners to help mitigate the cost of outdoor experiences for youth. We commit to building on this program to expand our level of support to of color. Learn more about how to apply. Amplifying voices: Finally, we have an opportunity to continue to use our platform to amplify the messages of people of color. We commit to examining how we include and amplify voices through our magazine, website and social media channels and to identifying ways to further lift up those voices. Collection of WTA’s past writing and work on DEI 12 Women and 4 Horses Fix a Trail WTA and Back Country Horsemen of Washington team up for their first all-women volunteer trip. By Victoria Obermeyer. Read More 5 WTA partner organizations to support this Giving Tuesday Dec 02, 2024 Washington Trails Association believes that trails are for everyone, forever. This year for Giving Tuesday, we are highlighting five WTA partner groups that are making sure everyone has access to experience nature in meaningful ways. Please consider sharing your generosity with these organizations. Read More WTA teams up with Everett to increase access to local trails Nov 22, 2024 An exciting project and major victory for WTA's Trails Next Door campaign is now underway in South Everett. Crews will be working to increase accessibility and walkability to green spaces and trails. Read More Intentional spaces WTA’s Emerging Leaders find professional connections in the outdoor community. By Angelic Friday Read More Representation and horse power: WTA and Back Country Horsemen of Washington team up for first joint all-women's trip Aug 29, 2024 Watch a short film about the first all-women's backcountry trail work trip by longtime partners, Back Country Horsemen of Washington and Washington Trails Association. Read More A bounty of seaweed: How foraging can connect us to ancestral food practices and trails A foraging trip offered a connection to the land and sea — and my own and other cultures. By Riley Collins Read More No Child Left Inside gets more kids outdoors than ever May 28, 2024 WTA and our partners — Youth Experiential Training Institute, The Wilderness Society and others — succeeded in securing No Child Left Inside's highest level of funding to date from the state legislature. This investment of $7 million for grants from 2023-2025 is now funding 92 programs around the state, supporting tens of thousands of Washington’s youth in getting outdoors. Read More What I learned from a year of (unintentional) Type 2 fun A year of heartbreak and injury was not what I would have chosen. But as I healed, I learned a lot about how the barriers in life can be an important part of our path. By Martell Hesketh Read More How WTA’s Outdoor Leadership Training helped one teacher finally get outside with her students Sara Ullmer led 24 outdoor trips with students from 2015-2019. Learn how WTA's Outdoor Leadership Training helped her get kids outside. By Krista Dooley Read More 1 2 3 4 5 6 7 ... 10 Next 9 items"
