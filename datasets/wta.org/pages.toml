description = "By inspiring hikers to become explorers, stewards and champions of public lands, we're creating trails in Washington that will stand the test of time."
full_description = "Our campaigns From local parks to deep wilderness ... and all trails in between. Trails for EveryoneEveryone deserves access to trails. We're supporting community partners and breaking down barriers, so that the trails of the future belong to everyone.Help us build an inclusive outdoorsLearn about Outdoor Leadership TrainingLearn about the Emerging Leaders ProgramLearn about our Youth Programs The Trail Next DoorYou shouldn't have to get in a car to have enjoy nature. That's why we're working on backyard trails and green spaces in towns across the state.Help put nature in reach Trails RebootedGiving popular areas and iconic trails an upgrade. We're creating new trails and helping hikers become champions and stewards for places under pressure. See our fresh approach for hiker favorites ﻿Expand your trail smarts Lost Trails FoundMany backcountry trails are in danger of disappearing. Through boots-on-the-ground trail maintenance, voices in Congress and innovative partnerships, we are working to keep trails on the map. Help keep these trails on the map Learn About WTA's IMpact Together we have accomplished so much, and together we can continue to build a better future for trails and for everyone who relies on and appreciates them. Download and read WTA's 2023 annual report as a PDF Browse the 2023 annual report More about us About usStaffHistoryOur impact & accomplishments ﻿Financial accountabilityJob opportunitiesPress roomWTA's commitment to stand against racism"
