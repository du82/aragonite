description = "Located just east of the Pasayten Wilderness and connecting to that trail system, Border Camp Trail is a short trail segment within the Loomis State Forest, which is managed by the Department of Natural Resources as a Natural Resources Conservation Area. Border Camp is among several trails on the looped trail system located on DNR land, so-named for a historic campsite that appears on the old USGS topo maps near Snowshoe Peak and the Canadian border."
