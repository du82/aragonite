["https://www.wta.org/elp"]
title = "Emerging Leaders Program — Washington Trails Association"
description = "The Emerging Leaders Program offers an opportunity to steward the outdoors and kickstart an environmental career. Participants grow their leadership and professional skills while working paid trail maintenance positions with WTA. And once they finish the program, participants enjoy advance consideration for open seasonal and permanent positions at WTA.As we strive to live our value of being a conduit for stewardship, we hope this program will create future leaders who contribute to an outdoor community where people of all identities feel included and valued.  The Emerging Leaders Program offers people an opportunity to steward the outdoors and kickstart an environmental career. Participants grow their leadership and professional skills while working paid trail maintenance positions with WTA."
full_description = '''Emerging Leaders Program WhAT IS the Emerging Leaders PrograM? The Emerging Leaders Program (ELP) is a 14-week program is designed to create systemic change in the outdoor industry by creating entry points for underrepresented communities that have historically had inequitable access to the outdoors, including BIPOC individuals and other shared identities. Throughout the curriculum, cohort members will build their resumes and network with career professionals in their areas of interest. Why did WTA create the Emerging Leaders Program?WTA is committed to creating systemic change by increasing entry points to the outdoor industry for communities that have had inequitable access to the outdoors, including BIPOC individuals. WTA hopes that by investing in paid development opportunities for future leaders in the outdoor industry, those leaders can build upon professional and personal aspirations while contributing to an outdoor community where people of all identities feel included and valued. Goals and impacts of the the Emerging Leaders ProgramThe program has seen tremendous support from BIPOC community partners and individuals who collectively share their personal journeys into the outdoor industry with the cohort. As we move forward into our fourth iteration of the program, we have seen alumni of this cohort move into various outdoor roles and continue being present within our community, inspiring the next cohort through their personal storytelling, knowledge and shared experience. Over the course of the 14-week program, cohort members will gain hands-on experience: Trail Maintenance Technical & Leadership Skills Complete trail work projects while practicing inclusive and team leadership skills at work sites across the Puget Sound region Projects consist of both single-day, frontcountry events, and multi-day trips where the cohort will embark on overnight camping trips together Practice and increase knowledge of the importance of safety in outdoor recreation. Learning and executing WTA's risk management protocols Develop group management skills on the job through rotating leadership assignments BIPOC led crosscut training and Sawyer A bucking certification Professional Development Wilderness First Aid and CPR certification Outdoor leadership skill development (snowshoeing, backpacking, and trip planning) Resume development and career exploration within the outdoor industry, nonprofit sector and Washington State Parks Independent project worked on individually throughout the 14-weeks that further expands on career interests Cross-collaboration with other WTA departments (advocacy, communications, development and community outreach) Continuous engagement with a variety of career paths in the outdoor industry Networking and engaging with community organizations and land manager agency partners How to join the Emerging Leaders Program Applications are now closed for 2025 cohort. Meet our 2024 Emerging Leaders Meet our 2023 Emerging Leaders Meet our 2022 Emerging Leaders Stories From the Field Introducing WTA’s 2025 Emerging Leaders Program cohort We’ve spent January welcoming our 2025 Emerging Leaders Program cohort to WTA, and we’re excited to introduce them! More Checking in with Emerging Leader Alums Past participants of WTA's Emerging Leaders Program chat about what they're up to now and how their time in the program has helped inform their careers so far. More Intentional spaces WTA’s Emerging Leaders find professional connections in the outdoor community. By Angelic Friday More WTA's Emerging Leaders Program ends on a high note "It has been fulfilling to see where ELP alumni interests propel them on their endeavors after completing this program." More Read more More Emerging Leaders stories >'''
year_published = 2025
