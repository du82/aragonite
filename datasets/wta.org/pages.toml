full_description = "Join WTA and Northwest Symphony Orchestra for a concert celebrating trails WTA will partner with the Northwest Symphony Orchestra for a concert event that will benefit trails in April 2025. https://www.wta.org/get-involved/join/join-wta-and-northwest-symphony-orchestra-for-a-concert-celebrating-trails https://www.wta.org/get-involved/join/join-wta-and-northwest-symphony-orchestra-for-a-concert-celebrating-trails/@@download/image/Skyline Trail - Leonard Beck Photography.png Join WTA and Northwest Symphony Orchestra for a concert celebrating trails WTA will partner with the Northwest Symphony Orchestra for a concert event that will benefit trails in April 2025. Friday, April 25, 2025 at 7:30 p.m., Benaroya Hall Photo by Leonard Beck Photography You're invited to Crescendo: A Symphonic Celebration of Washington Landscapes. At this special concert, photos from WTA’s Northwest Exposure Photo Contest will accompany live music performed by the Northwest Symphony Orchestra. You’ll be treated to a beautiful evening of nature and sound, all while supporting WTA’s work to ensure there are trails for everyone, forever. When: Friday, April 25, 2025 at 7:30 p.m.Where: Benaroya Hall (200 University St, Seattle, WA 98101) Purchase tickets The concert is open to all ages, so gather your friends and family for a truly unforgettable evening. Crescendo is proudly presented by: With support from:"
