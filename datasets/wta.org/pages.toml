title = "Where's the snow? WTA's newest map layer helps winter and spring hikers plan — Washington Trails Association"
description = "WTA's new snow-depth layer helps hikers plan their trips around snow."
full_description = "Where&#x27;s the snow? WTA&#x27;s newest map layer helps winter and spring hikers plan WTA's new snow-depth layer helps hikers plan their trips around snow. https://www.wta.org/news/signpost/wta-new-snow-depth-map-layer-helps-snowshoers-winter-hiking-2024 https://www.wta.org/news/signpost/wta-new-snow-depth-map-layer-helps-snowshoers-winter-hiking-2024/@@download/image/snow depth layer toggle on full state 2.26.24.jpg Where's the snow? WTA's newest map layer helps winter and spring hikers plan Posted by Loren Drummond at Feb 27, 2024 09:30 AM | Permalink Filed under: Hike Planning, Winter Recreation Share Print Email WTA's new snow-depth layer helps hikers plan their trips around snow. It's late to arrive, but we've finally got more snow falling in the high country! While skiiers and snowshoers are rejoicing, hikers who would rather avoid snow altogether may be wondering what their options are. WTA's newest map layer can help with planning around snow. To help you get a better sense of snow conditions around the state, we've released a new snow-depth layer on our Hike Finder Map and mobile app. The new feature joins our air-quality and wildfire layers and alerts in our Hiking Guide as tools to help you get a clearer picture of evolving conditions around the year. About WTA's new snow depth layer Dig deeper -- WTA's snow data source -- Check avalanche forecasts with NWAC -- Get avalanche safety tips WTA's snow layer is not an avalanche forecast. It is designed to give you an idea of where you might expect to run into snow on trail, and about how much. If you intend to head to an area with snow on trail, your next step is to check the avalanche forecast for the area — we recommend consulting our friends at Northwest Avalanche Center (NWAC). (They also have a free app worth checking out.) Like many of the improvements we've been able to make to our map, mobile app and website over the years, the snow layer is something that our community has asked us for. Figuring out where to find snow in the high country is tricky all winter long and well into spring. And as with many of our digital development work, it has been made possible in part with the help of some of our incredible volunteers and member support. You can use the filter on the map to toggle on or off the snow depth layer. Filter hikes by name or area to narrow down your choices, or zoom in on the specific area you're considering visiting for a closer look. To see the new snow layer, just toggle on the layer or select it from the mobile app list. In shades of blue, it shows areas with snow and approximately how deep that snow is: While the snow data layer comes from the National Weather Service, an incredibly reliable source, it is difficult to monitor exact locations for snow depths, so the map is really best used for planning purposes and in conjunction with trip reports, weather forecasts and avalanche forecasts. Perhaps the best use of the new layer is for people who love hiking, but want to avoid the snow. If you want to get out and avoid slogging through winter slush, the new map layer should help you pick a direction. All hikers can help each other out by filing trip reports about road and trail conditions around the state. Snow sticks around a lot longer in Washington than you might expect. In fact, it's not uncommon for snow to be at places like Paradise at Mount Rainier past Memorial Day. Get some snow smarts with our avalanche safety tips, including how to avoid snow entirely, and which popular trails in Washington have avalanche chutes (and should be avoided when snow is present). Finding (or avoiding) snow is something everyone who hikes in Washington outside of the summer months encounters. Photo by trip reporter and WTA member rk jenner snowshoeing around Mount Rainier on February 23, 2024. Report inappropriate content"
