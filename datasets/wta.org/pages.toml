full_description = "Stock Donations How to make a stock transfer to Washington Trails Association. https://www.wta.org/get-involved/join/other-ways-to-give/stock https://www.wta.org/@@site-logo/wta-logo.png Stock Donations How to make a stock transfer to Washington Trails Association. Gifts of stocks, bonds and mutual funds can be a tax-smart way to support Washington Trails Association. By donating securities to WTA that have appreciated in value, you can avoid capital gains taxes. More importantly, your donation will make a difference for hiking trails and wildlands. If you hold stocks or bonds with a broker, you may transfer the securities electronically by instructing your broker to send the securities to Washington Trails Association’s account at Vanguard through the Depository Trust Company (DTC). You will need to send a letter to your broker with written instructions. For WTA's stock donation information to start and facilitate this donation, please contact membership assistance, at (206) 625-1367, or at membership@wta.org. Washington Trails Association is a not-for-profit, 501(c)(3) organization. Contributions are tax deductible to the extent allowed by law. Click here for WTA financial information."
