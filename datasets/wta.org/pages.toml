title = "Advocacy in the Blog — Washington Trails Association"
description = "Current issues affecting trails and hikers."
full_description = '''Advocacy in the Blog Current issues affecting trails and hikers. https://www.wta.org/get-involved/action/advocacy-in-the-blog https://www.wta.org/@@site-logo/wta-logo.png Advocacy in the Blog Current issues affecting trails and hikers. The latest news and wins on issues impacting hikers and public lands. Stay in the loop by signing up for Trail Action Network today! Hiker Headlines: Wind damage, North Cascades permits, WTA's op-ed on Forest Service and Parks firings Feb 27, 2025 The early access lottery for North Cascades backcountry permits opens on March 3 — and other early access lotteries are closing soon. Big winds hit Washington earlier this week, so be careful of fallen trees and debris when hitting the trails this weekend! And read WTA’s op-ed in the Seattle Times on the recent federal staffing cuts. Read More WTA visits D.C. to urge rehiring of Forest and Park service staff Feb 25, 2025 This week, WTA’s policy and planning manager Michael DeCramer is in Washington, D.C. Along with partners, one of the key issues Michael will be discussing is the recent firing of thousands of U.S. Forest Service and National Park Service employees. Michael will be speaking to our state’s delegation and bringing the message of thousands of hikers who have asked for those firings to be reversed. Read More What firing Forest Service, National Parks staff means for public lands, trails, communities Feb 19, 2025 Last week, thousands of hard-working Forest Service and National Park staff, including hundreds in Washington and Oregon, were fired by the current administration. The impact to public lands, recreation and communities across the state are immediate and far-reaching. Learn what's at stake and join WTA in calling for Congress to reverse the decision. Read More Hiker Headlines: WTA backcountry trips, Enchantments permit lottery, sign up for Hiker Rally Day Feb 13, 2025 The Enchantments permit advanced lottery opens Feb. 15 at 7 a.m. Join WTA and the Northwest Symphony for live music and beautiful photos. We need your help to vote for a renewal of the King County Parks Levy. Join us for in Olympia on March 18 to advocate for trails and public lands! And registration for WTA’s backcountry trips is starting soon. Read More 10 easy ways to care for trails (and the outdoors) Feb 20, 2025 Trails give us so much — here are 10 easy ways to give back. Read More How the Forest Service staffing crisis will affect your hike – and what you can do Feb 10, 2025 Right now, a budget crisis and staffing cuts at the Forest Service are threatening our ability to reach hikes in our state's national forests. So, we need your help. Your donation will help us maintain trails that the Forest Service cannot reach this summer, keeping these places open for you and other hikers. Read More A tight state budget means it’s time to show up for trails — here’s how Jan 16, 2025 This week kicks off the 2025 Washington state legislative session. The state budget is tighter than we've seen in years, and we know legislators will be making cuts. Tell your representatives that the physical and mental health benefits of getting outside should not be on the chopping block this, or any, year. Join WTA and other hikers in Olympia on March 18, 2025, for our Hiker Rally Day. Read More Hiker Headlines: Hiker Rally Day; ski area openings, state park closures Dec 19, 2024 Happy winter solstice! Some exciting 2025 hiker events have been announced, including Hiker Rally Day on March 18. Several state parks are closed until further notice due to storm damage, but — good news — all of the ski resorts along the Washington Cascade crest have opened for the winter. Read More Take action: Forest Service cuts to seasonal staffing will hurt trails and recreational access Nov 12, 2024 A budget crisis at the U.S. Forest Service will reduce its ability to maintain trails, clean restrooms, collect trash and steward public lands. Learn what is happening and how you can help. Read More Shape the next 10 years for Oyster Dome, Mount Si, Gothic Basin, Yacolt Burn and more Nov 08, 2024 Washington Department of Natural Resources recently released its first-ever statewide plan to guide recreation and public access, including hiking, over the next 10 years and across 5.6 million acres. Give your feedback before November 21. Read More $1.9 billion for public lands is at risk: your voice is needed Oct 22, 2024 The Great American Outdoors Act (GAOA) created the Legacy Restoration Fund, which provides up to $1.9 billion annually to protect public lands and improve opportunities for the public to access them. With funding set to run out in 2025, we are gathering the support of people like you who love the outdoors to help us push to renew GAOA’s Legacy Restoration Fund. Read More Hiker Headlines: Sunrise Road closed for winter, Forest Service hiring freeze, once-in-a-lifetime comet show Oct 10, 2024 Be aware of some closures, including Sunrise Road, which is closed for the winter. The U.S. Forest Service announced significant cuts to its workforce — including not hiring seasonal staff next year — due to a budget crisis. And this Saturday, a comet will be visible in the night sky. Read More Join Us in Voting ''No" on I-2117 and Protect Climate Progress Oct 02, 2024 Climate change is threatening healthy forests, clean air and open trails, and therefore our ability to get outdoors. That’s why WTA is asking hikers to vote “No” on Initiative 2117 (I-2117) to defend our state’s climate progress. Read More Mount Rainier wants to know: How did timed entry impact your visit? Aug 27, 2024 Mount Rainier National Park is wrapping up a pilot summer season of their timed entry reservation system for the popular Paradise and Sunrise corridors of the park. Park leadership wants your feedback on how the reservation system impacted your visit or plans to visit. Read More Hiker Headlines: Mount Rainier fire ban, thunderous forecast, share your take on forest roads Aug 15, 2024 We’re halfway through Hike-a-Thon — there’s still time to join in on the fun! Wildfire season continues across the Pacific Northwest. Thunder is in the forecast this weekend. Lake Sammamish State Park is piloting a program that offers the public use of a multi-terrain accessibility chair. And WTA wants to hear how forest road conditions have affected your hikes. Read More Hiker Headlines: Perseid meteor shower peaks, Mount Adams and Pasayten area fire closures Aug 08, 2024 The Perseid meteor shower peaks this weekend! Wildfire growth across the state and construction projects are impacting trails. Hunting season is here. Washington State Parks is updating its campsite fees next year. And do your part to help secure $150 million in trail funding! Here’s some news you may have missed while out on trail this week. Read More Hiker Headlines: Hike-a-Thon begins, free day, new Trailhead Direct stop, Washington cities rank high in hikers Aug 01, 2024 Hike-a-Thon starts today! This Sunday is Great American Outdoors Day, which celebrates the Great American Outdoors Act, and parking fees will be waived on some federal lands. Be aware of a new campfire ban — as well as some incoming smoke — and a couple of upcoming road closures. Some fun news though: Trailhead Direct has added a new stop and a couple of Washington cities ranked high in adult hikers compared to metropolitan areas across the country. Read More Great American Outdoors Act improves popular trails (roads, bathrooms and more) Aug 01, 2024 For four years, the Great American Outdoors Act (GAOA) — a federal bill that became law on August 4, 2020 — has been funding major improvements to some of our state’s most popular trails. But it's about to expire. Read More New plan to rebuild Eightmile Dam and how it affects hikers Jul 10, 2024 Just a few weeks ago, the state released its Final Environmental Impact Statement with a preferred plan for reconstructing Eightmile Dam in the Enchantments permit area of the Alpine Lakes Wilderness. The chosen option will increase the footprint of the dam and also give water managers the ability to change the water level in the lake by more than before. Read More Three proud moments in WTA’s work for wilderness areas Jul 03, 2024 July 3, 2024 was the 40th anniversary of the Washington State Wilderness Act, which created 18 wilderness areas — and expanded 3 wilderness areas — in our state. WTA has been working in, and for, wilderness areas for decades. Read More Olympic National Park seeks hiker feedback on new overnight permit limits for Enchanted Valley Jun 07, 2024 This summer, for the first time, Olympic National Park will have a limit on overnight camping in the Enchanted Valley. This is a pilot project and park staff want to hear from hikers about this new quota system and how it impacts your outdoor experience. Read More No Child Left Inside gets more kids outdoors than ever May 28, 2024 WTA and our partners — Youth Experiential Training Institute, The Wilderness Society and others — succeeded in securing No Child Left Inside's highest level of funding to date from the state legislature. This investment of $7 million for grants from 2023-2025 is now funding 92 programs around the state, supporting tens of thousands of Washington’s youth in getting outdoors. Read More Hiker Headlines: Trailhead Direct is back, it's backcountry overnight permit season, Mount St. Helens trail closures May 16, 2024 Trailhead Direct is starting back up again for the hiking season — and bringing back some routes! The backcountry overnight permit seasons for North Cascades National Park and the Enchantments are starting. And there are some funding wins to celebrate this week. Read More 5 ways to connect with WTA this spring Apr 18, 2024 Check out these tips and tricks to connect with trails this spring. By Nicole Masih-Théberge Read More Washington’s best-kept secret for funding the outdoors just got better Mar 18, 2024 You may have never heard of Washington state’s Recreation Conservation Office (RCO), but for the past 60 years it has been protecting and improving our state’s outdoors. To help ecosystems and communities thrive, RCO invests in projects that protect lands and develop parks and trails. This spring, RCO is taking a new equity-focused approach to their grantmaking, so this best-kept secret just keeps getting better. Read More Hiker Headlines: Free day, Trails and Ales, legislative wins, warm weekend weather Mar 14, 2024 Next Tuesday, March 19, is Washington State Parks’ birthday and parking fees will be waived in some areas. Put Trails and Ales with WTA and the annual Washington Coastal Cleanup on your calendars. We’re excited for some wins from the 2024 state legislative session, and we’re also excited that spring is here! Read More Wins for trails: Legislature funds forest conservation and work with tribes Mar 12, 2024 Each year, WTA works with hikers like you, partner organizations and lawmakers during the state legislative session to get trails and public lands the funding they need. The 2024 state legislative session ended on March 7 with good news for trails and public lands. Nearly every priority that WTA was supporting ended up funded in the final state budget. Read More Hikers helped win funding that’s fixing Washington state’s longest trail Feb 28, 2024 Two years ago, hikers like you helped secure a huge win for public lands in Washington state: $15 million of annual funding to tackle the recreation maintenance backlog on our state lands. Ever since, that funding has been improving trails, roads, bathrooms, campgrounds and more. We like to celebrate those wins, including recent work on the Palouse to Cascades Trail. Read More WTA visits Washington, D.C., to ask for the funding trails and hikers need Feb 20, 2024 WTA is advocating for Congress to pass the Transit to Trails Act, which would create a federal grant program to fund more public transportation to trailheads. More than 1,640 people have signed a WTA petition to express their support for this bill. Michael Decramer, WTA’s policy and planning manager, traveled to Washington, D.C., last week to deliver those petition signatures and to participate in the 27th annual Hike the Hill. Read More 8 ways hikers are benefitting from critical federal funding Feb 07, 2024 WTA was thrilled in 2020 when we rallied our hiking community and joined with partners to help pass the Great American Outdoors Act (GAOA). Here’s some of the work that the GAOA has supported in Washington state, from 2021 through 2023, to help support millions of outdoor experiences. Read More 1 2 3 4 5 6 7 ... 16 Next 30 items'''
year_published = 2025
