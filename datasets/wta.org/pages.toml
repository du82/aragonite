["https://www.wta.org/our-work/thetrailnextdoor"]
title = "The Trail Next Door — Washington Trails Association"
description = "Trails link people and wild places. They provide us with a place to reconnect with nature—and each other. But every year, more are more trails are in danger of falling off the map.Photo"
full_description = "Trails link people and wild places. They provide us with a place to reconnect with nature—and each other. But every year, more are more trails are in danger of falling off the map.Photo ﻿﻿ Local trails offer daily, low-barrier opportunities to access the mental, physical and social benefits of time outdoors — regardless of access to transportation, gear or hiking experience. However, inequitable investment in urban trails across neighborhoods has resulted in a disproportionate lack of access to nature for communities of color and low-income people. Through the Trail Next Door campaign, Washington Trails Association is working to ensure that nature is in reach for everyone in Washington. We're collaborating with city parks and partner organizations to build and maintain local trails to increase access to green spaces across the state. The Trail Next Door is a key part of WTA’s work to create a trail system in Washington that helps people get outside — from the backcountry to your big backyard. Take Action We need your help to ensure more people have access to the benefits of time spent in nature. Your donations make this work possible. Hikers like you can also make a difference by writing trip reports about neighborhood trails and speaking up for local parks. Our Work ﻿﻿ Connecting you with nearby nature WTA is working hard to ensure everyone has the information they need to enjoy green spaces close to home. We consistently add more urban hikes to our Hiking Guide as well as detailed transit directions so you have the most up to date and accurate information. Working next door Access to nature is essential for happy, healthy, climate resilient communities. That's why we partner with local parks departments across the state to maintain existing trails and build new ones in your neighborhood. We've opened new local trails in Sammamish and Woodinville and made improvements to parks from Bellingham to Vancouver. In North Highline, we're working with King County Parks to build brand new trails in Glendale Forest — a new park in an area that currently lacks walkable access to green space. Stories from trails next door King County's plan for heat underscores importance of urban trails for climate-resilient cities It's no coincidence that King County's Extreme Heat Mitigation Strategy was unveiled on a WTA-built local trail. More New Vancouver trail lowers barriers to nature, volunteering Behrens Woods embodies the power of a local park to connect people with nature, with each other and even with hope for the future. More 5 reasons why local trails are essential to mental health When nature is in reach, so are its healing benefits. Here are 5 reasons why nearby nature is not just a nice-to-have, it's a must-have for mental health. More"
