["https://www.wta.org/our-work/next-generation"]
title = "Connecting the Next Generation — Washington Trails Association"
full_description = "Connecting the Next Generation WTA believes in sharing the outdoors with young people. In addition to being good for physical health, being on trail can develop leadership skills, connect people to one another, and create lasting memories. Plus, trails will need our support and care far into the future. So we're working hard to teach the next generation how they can care for the earth. Whether that means taking high-schoolers out on a volunteer vacation, training youth educators, or simply sharing tips on how to get outside with your own family, WTA has resources and programs tailored to help you spread our mission. Read what we've done, what we're working on, and how you can be a part of shaping the future. Educator Programs WTA's Outdoor Leadership Training program gets school-age youth outside by empowering teachers and youth groups with the skills and resources to lead safe and fun outdoor experiences. Family Programs Subscribe to our Families Go Hiking Newsletter, volunteer with your family, or explore our hike suggestions and tips for getting out with your little ones. Youth Programs Washington Trails Association's Youth Programs are opportunities for youth ages 10-18 to spend time outdoors building and maintaining hiking trails in a safe, teamwork-oriented environment. Success Stories Read how WTA's work has touched the lives of people across the state."
