full_description = '''Workplace Giving How to make a donation through your annual workplace giving campaign or EarthShare Washington. https://www.wta.org/get-involved/join/other-ways-to-give/workplace https://www.wta.org/@@site-logo/wta-logo.png Workplace Giving How to make a donation through your annual workplace giving campaign or EarthShare Washington. Did you know that you can protect trails at work? Each year, hundreds of hikers like you support Washington Trails Association through their employer's workplace giving program. While you're at work, WTA will use your workplace gift where it's needed most: on your favorite trail, in Olympia or DC, or to power resources like this website. Workplace donations enable Washington Trails Association to spend less time fundraising and more time building, maintaining and protecting hiking trails--and provide nearly 10% of WTA's annual operating support. Let us know if you would like your workplace gift applied to your next WTA membership renewal. To find out more ways your employer can support WTA, please contact us at donations@wta.org. WTA's Workplace Giving Codes King County: 2522 Combined Federal Campaign: 83126 State of Washington Combined Fund Drive: 0315053 How to Give at Your Workplace Government Workplaces If you work for federal, state, county or city government or work for a public university, Washington Trails Association will be listed in your campaign catalog. Look for Washington Trails Association as a member of EarthShare Washington or alphabetically in the index. Write WTA's code number on your payroll deduction pledge form. United Way Campaigns If Washington Trails Association is not listed by your employer in your workplace giving campaign, you can designate Washington Trails Association in the "Specific Organization" or "donor option" section of your United Way pledge form. Ask your campaign coordinator how to do this if it is not clear. You may also ask your campaign coordinator to consider adding EarthShare Washington organizations as a giving option. Here are two ways you can give to Washington Trails Association through your workplace giving campaign: Payroll Deduction: By far the most popular and easiest way to support Washington Trails Association year-round, you instruct your employer to deduct a certain amount from your paycheck each pay period. One-time Payroll Deduction: Instruct your employer to deduct a single amount from one paycheck, or simply write a personal check payable to Washington Trails Association and present it to your workplace giving campaign manager. Corporate WorkplacesIf your company facilitates their own workplace giving campaign, contact your HR department if you have any questions about including Washington Trails Association in your giving. You can see a list of known corporate matching opportunities below. If you work for one of many corporations that include EarthShare Washington in your workplace giving campaign, find EarthShare Washington on your payroll pledge form and write in Washington Trails Association as a specific designation. Once you have determined that your company matches donations or volunteer hours made to WTA, there are two ways to initiate the matching gift contribution: 1 Obtain the appropriate matching gift verification form from your employer and submit it to Washington Trails Association. Please mail, fax, or email the form and include a copy of the charitable tax receipt to the following: Washington Trails AssociationAttn: Development705 2nd Ave, Ste 300Seattle, WA 98104 fax: 206.625.9249 | email: donations@wta.org Washington Trails Association's Tax Identification Number (also known as Employee Identification Number or EIN) is 91-0900134. 2 If your company uses an online matching gift platform, please submit a matching gift verification request through your company’s online portal using the above address. Corporate Matching Gift Partners Don't see your employer on this list? Contact your HR department to find out if your company has a matching gift program. Absher Construction Accenture Adobe (will also match volunteer hours) ADP Aetna Foundation (will also match volunteer hours) Alaska Airlines (will also match volunteer hours) Allstate Altria Group Inc. Amgen Foundation Andeavor Anchor Qea Apple (will also match volunteer hours) Argo Group AT&T Avanade Bank of America (will also match volunteer hours) Bentall Kennedy Bill and Melinda Gates Foundation (will also match volunteer hours) BlackRock BNSF Railway Boeing (will also match volunteer hours) Boeing Employee Credit Union/BECU (will also match volunteer hours) Boston Scientific Bristol-Myers Squibb Bungie Foundation Cambia Capital Group CenturyLink (will also match volunteer hours) Chevron Chubb & Son Citrix Cornerstone Advisors Costco Dell Delta Dental Service Disney DocuSign Dropbox Ebay Foundation Evolucion Innovations Expedia (will also match volunteer hours) Expeditors International F5 Networks GE Foundation Getty Images GeoEngineers Inc. GlaxoSmithKline GMMB Goldman Sachs Google Seattle (will also match volunteer hours) Hatch Hewlett-Packard Enterprise (will also match volunteer hours) Home Box Office Inc The Home Depot Iderdrola Renewables, LLC Illinois Tool Works (will also match volunteer hours) Intel Intentional Futures Intuit Jackson Healthcare (will also match volunteer hours) JLL Johnson & Johnson JPMorgan Chase Kaiser Permanente KeyBank Laird Norton Trust Lexis Nexis Logic 20/20 McMaster-Carr Supply Company Medtronic Microsoft (will also match volunteer hours) Milliman Morgan Stanley Moss Adams LLP Moz MUFG Union Bank Nike Nordstrom NRG Energy Oracle Corporation Olympus Corporation of the Americas Pacific Life Foundation PepsiCo Pfizer (will also match volunteer hours) Phillips 66 Portland General Electric (will also match volunteer hours) Precor Incorporated Puget Sound Energy Foundation (will also match volunteer hours) Qualcomm Charitable Foundation Quote Wizard Riley & Nancy Pleas Family Foundation Russell Investments Salesforce (will also match volunteer hours) Satori Software Shell Oil Company Silicon Valley Community Foundation Starbucks Coffee Company (will also match volunteer hours) State Farm (will also match volunteer hours) Symetra Tableau (will also match volunteer hours) Terex Textron The Bullitt Foundation The Clorox Company The Community Foundation for Southwest Washington The Standard T-Mobile (will also match volunteer hours) Travelers Insurance TripAdvisor UBS Umpqua Bank United Airlines UnitedHealth Group US Bank Varian Medical Systems Verizon (will also match volunteer hours) Vigor Industrial VISA Wells Fargo WhitePages, Inc. Windward Environmental Zonar Systems Washington Trails Association is a nonprofit, 501c3 organization. Tax-ID: 91-0900134. Contributions are tax deductible to the extent of the law.'''
