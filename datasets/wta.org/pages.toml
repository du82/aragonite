["https://www.wta.org/connect/help/about-our-map"]
title = "About Maps — Washington Trails Association"
description = "WTA's Hike Finder Map is one way to explore the 4,000 trails in our hiking guide. Check out the latest features and use this form to share your feedback."
full_description = "About Maps WTA's Hike Finder Map is one way to explore the 4,000 trails in our hiking guide. Check out the latest features and use this form to share your feedback. https://www.wta.org/connect/help/about-our-map https://www.wta.org/@@site-logo/wta-logo.png About Maps WTA's Hike Finder Map is one way to explore the 4,000 trails in our hiking guide. Check out the latest features and use this form to share your feedback. Maximize your map knowledge -- Even if you're at a local trail system, having a map will make your hike go much smoother. Here's how to find and use print or digital maps. -- Use the Hike Finder Map to start building your to-hike list in your Backpack. There are thousands of trails to choose from in Washington, and WTA's Hike Finder Map is one way to explore what's out there. With it, you can see trailheads dotted all over the state, including those near you. And with toggleable layers, you can see how wildfires are affecting those trails, check the air quality and evaluate snow levels on the trail you're heading to. Here's more information on those layers. Snow Layer Filter Data -- WTA's snow data source -- Check avalanche forecasts with NWAC WTA's snow layer is not an avalanche forecast. It is designed to give you an idea of where you might expect to run into snow on trail, and about how much. If you intend to head to an area with snow on trail, your next step is to check the avalanche forecast for the area — we recommend consulting the Northwest Avalanche Center (NWAC). Snow sticks around a lot longer in Washington than you might expect. Get some snow smarts with our avalanche safety tips, including how to avoid snow entirely, and which popular trails in Washington have avalanche chutes (and should be avoided when snow is present). Snow Layer Legend Wildfire and Air Quality Index (AQI) Filters Data -- WTA's AQI forecast source -- For more precise readings, you, check out this useful smoke forecast map for Washington state. Planning around wildfires and smoke are a reality when hiking in Washington. When you are planning hikes, you toggle on a wildfire layer and/or a smoke forecast. These are intended to be basic planning tools to help you make decisions about if and where to hike. We encourage you to seek out additional information as you plan. and make backup plans. Conditions can change quickly in wildfire season. The colors on the air quality map correspond to the EPA color guidelines, and we only show colors that might indicate some level of hazard. That means if air quality is good, the AQI layer won't show on our Hike Finder Map. Report a bug or share your ideas We've recently made some updates to our maps. Explore the new features and let us know what you think. Have you spotted something amiss? Have an idea to help make our map better? Use the form below to share your feedback. And thank you! Loading..."
