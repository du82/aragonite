full_description = '''Hiking Guide https://www.wta.org/go-outside/hikes https://www.wta.org/@@site-logo/wta-logo.png Hiking Guide WTA's hiking guide is the most comprehensive database of hikes in Washington, and comprises content written by local hiking experts and user submitted information. All data is vetted by WTA staff. This resource is made possible by the donations of WTA members. We respectfully acknowledge the lands we are visiting are the homelands of Indigenous tribes of the Pacific Northwest, some of whom have reserved rights on these lands. Tribes continue to rely on and share in the management of these lands today. Please tread gently and treat these places with respect. Search Hikes Basic Search Hike Name Region Include all areas Central Cascades Central Washington Eastern Washington Issaquah Alps Mount Rainier Area North Cascades Olympic Peninsula Puget Sound and Islands Snoqualmie Region South Cascades Southwest Washington Sub-region var subregion_options = {"all": {"all": "Include entire region"}, "b4845d8a21ad6a202944425c86b6e85f": {"all": "Include entire region", "83c2ab06fbf236015c8848042f706d58": "Blewett Pass", "2b0ca41464d9baca77ced16fb4d40760": "Entiat Mountains/Lake Chelan", "684278bc46c11ebe3c5b7212b6f8e486": "Leavenworth Area", "f6845d37f1edba9dc2bc8a75346f5bd5": "Stevens Pass - East", "637634387ca38685f89162475c7fc1d2": "Stevens Pass - West"}, "41f702968848492db697e10b14c14060": {"all": "Include entire region", "39c3197019b541c4b4b2970281fd85ed": "Grand Coulee", "3a415482d61dc1f893288c1bcf5cd8ae": "Potholes Region", "6febb0079f87770b5e790a71aafa3770": "Tri-Cities", "b4be8a42f05d2054cbb2ca031b9a6a03": "Wenatchee", "7a4397f2ffde7d0b490ff1ca77cceb9e": "Yakima"}, "9d321b42e903a3224fd4fef44af9bee3": {"all": "Include entire region", "fe742c316d095b81d23d712efa977d3d": "Okanogan Highlands/Kettle River Range", "3eff611193d7d4b57590df1f40b48800": "Palouse and Blue Mountains", "d305615b5db417f18661c5233d2ce950": "Selkirk Range", "bec6f9858a88f32a0