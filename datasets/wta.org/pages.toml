["https://www.wta.org/go-hiking/hikes/wild-horses-monument"]
title = "Wild Horses Monument — Washington Trails Association"
description = "Witness up close one of the most frequently viewed public artworks in the state of Washington, while admiring a broad view of the Columbia River and the tiny hamlet of Vantage."
full_description = '''Wild Horses Monument Witness up close one of the most frequently viewed public artworks in the state of Washington, while admiring a broad view of the Columbia River and the tiny hamlet of Vantage. https://www.wta.org/go-hiking/hikes/wild-horses-monument https://www.wta.org/site_images/hikes/wild-horses-monument.jpg/@@download/image/wildHorses.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/wild-horses-monument", "name": "Wild Horses Monument", "description": "Witness up close one of the most frequently viewed public artworks in the state of Washington, while admiring a broad view of the Columbia River and the tiny hamlet of Vantage.", "url": "https://www.wta.org/go-hiking/hikes/wild-horses-monument", "image": "https://www.wta.org/go-hiking/hikes/wild-horses-monument/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 35, "ratingValue": 2.3, "ratingCount": 6, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 46.9645655, "longitude": -119.9642694}} Wild Horses Monument Central Washington > Yakima 46.9646, -119.9643 Map & Directions Length 0.4 miles, roundtrip Elevation Gain 150 feet Highest Point 1,300 feet Calculated Difficulty About Calculated Difficulty Easy The Wild Horses Monument overlooks the Columbia River Gorge. Photo by Impromptu Disco. Full-size image Rivers Wildflowers/Meadows Add Hike to My Backpack Saved to My Backpack Witness up close one of the most frequently viewed public artworks in the state of Washington, while admiring a broad view of the Columbia River and the tiny hamlet of Vantage. Continue reading Rating 2.33 out of 5 (6 votes) Log in to rate 35 trip reports for this trail Write a trip report Hiking Wild Horses Monument The road sign calls it Wild Horses Monument, but the real name of this artwork is Grandfather Cuts Loose the Ponies. And despite being begun in 1989, it’s still not complete!The trail itself is unremarkable, but after reading the history of the sculpture, you may agree that it’s worth the stop, and the short hike to see it up close.The sculpture was designed and created by Chewelah sculptor David Govedare. He envisioned a 36-foot tall woven basket made of steel, tipped up by Grandfather (a symbol of the Great Spirit), to allow the 18 horses within to run free.The sculpture was to be completed and then presented as a gift during Washington’s Centennial celebration in 1989. The state ceded the land to Grant County for that purpose, but fundraising from private donations fell short and there was never enough money to complete the project. The 15 life-size galloping horses that were installed are a beautiful sight, regardless of the original plan. The sculpture as a whole is best seen from a distance. If you choose to take the short hike to the hilltop to see the individual horses, you’ll be rewarded with a nice view of the Columbia River and surroundings.From the far end of the paved parking lot, set out up the obvious trail heading up to the left of the sculpture. There are other faint trails visible, but please stay left on the main trail to minimize further erosion. The way is moderately steep, with sand and loose rocks; a hiking staff or trekking poles are helpful. A mere two tenths of a mile later, you are on top of the plateau featuring fifteen wild horses frozen in mid-gallop.The individual horses are best viewed in profile. The rust that has formed does not detract, but graffiti sometimes does. There is plenty of room to wander among them for a whole new perspective, offering a variety of options for the photographer. View the horses in profile from the back side, with the Columbia River (actually Wanapum Lake) providing a sparkling backdrop. Or, if you can time it right, capture the horses in silhouette before a brilliant sunset. Hike Description Written by Ken Giesbers, WTA Correspondent Wild Horses Monument Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-119.9642694, 46.9645655], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "wild-horses-monument"}, containerId = "map", hike = {"trailhead": [-119.9642694, 46.9645655], "id": "wild-horses-monument", "title": "Wild Horses Monument", "thumbnail": "https://www.wta.org/go-hiking/hikes/wild-horses-monument/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 46.9646, -119.9643 Open in Google Maps Before You Go See weather forecast WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From Ellensburg, drive east on I-90 past Vantage. Shortly after crossing the Columbia River and before reaching the Gorge, take exit 139. Turn right and follow pavement 0.5 mile to the parking lot, which accommodates about 25 vehicles and a couple of buses. No parking pass is required. As of this writing, the parking lot features no amenities. Interpretive signs have been vandalized.Note: There is no corresponding exit for westbound traffic. The Vantage and Gorge exits (136 and 143 respectively) can be used to loop around. Print Email More Hike Details Trailhead Central Washington > Yakima Grant County Guidebooks & Maps Best Desert Hikes: Washington (Bauer & Nelson - Mountaineers Books) Washington State Department of Natural Resources (DNR) Priest Rapids Download a map to plan your hike Learn Right-of-Way On Trail Learn Practice Leave No Trace on Trail and in Camp You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
