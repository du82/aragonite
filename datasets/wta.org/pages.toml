title = "Hiking with Kids — Washington Trails Association"
description = "You don’t need to pack your hiking gear away when you have kids! Spending time outdoors with your little ones is a great opportunity to make memories, develop a real </span>connection to the natural world and get exercise and fresh air. If you are looking for some help planning in your next family adventure, Washington Trails Association has just what you need."
full_description = "Hiking with Kids Share Print Email You don’t need to pack your hiking gear away when you have kids! Spending time outdoors with your little ones is a great opportunity to make memories, develop a real connection to the natural world and get exercise and fresh air. If you are looking for some help planning your next family adventure, Washington Trails Association has just what you need. Tips and tricks The must-read list of tips to help you get on trail with happy hikers. News for families Read the latest in our blog about hiking with kids, and get advice from experts (read: other parents). Where to go Whether it's snowy or sunny, get outside with your family. Volunteer Try getting out with the family in a new way -- by volunteering on a WTA youth and family work parties. Trip reports Inspiration and advice from other parents who've been hiking the trails. Get our free newsletter Subscribe to our Families Go Hiking Newsletter and get the latest on programs and other ways to get your family outside, right to your inbox. Hiking With WildlifeHow to hike in bear countryHow to hike in cougar countryHow to hike in tick countryHow to hike in snake countryHow to hike in goat countryHow to battle the bugs"
