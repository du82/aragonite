["https://www.wta.org/signpost/hiker-events-coming-up-this-month"]
title = "Upcoming Hiker Events — Washington Trails Association"
description = "Hiking can often be a solitary experience, but when you're looking to engage with the outdoor community, there is no shortage of opportunities in Washington."
full_description = '''Upcoming Hiker Events Hiking can often be a solitary experience, but when you're looking to engage with the outdoor community, there is no shortage of opportunities in Washington. https://www.wta.org/news/signpost/hiker-events-coming-up-this-month https://www.wta.org/news/signpost/hiker-events-coming-up-this-month/@@download/image/-goat-rocks---goat-lake_20702169379_o.jpg Upcoming Hiker Events Posted by Loren Drummond at May 10, 2021 12:30 PM | Permalink Filed under: Events Share Print Email Hiking can often be a solitary experience, but when you're looking to engage with the outdoor community, there is no shortage of opportunities in Washington. Connect with WTA Our website, wta.org is a place for you to find information about local green spaces, updates on trails and moments of joy and inspiration. We hope you can connect with each other and to us on our social channels. Read past trip reports or share your own with the community. In Person and Virtual Events WTA's Hiker Rally Day 2025Tuesday, March 18 — 9 a.m.-4 p.m.Olympia Join Washington Trails Association at Hiker Rally Day in Olympia on March 18 to protect funding for trails and public lands! Washington faces a projected budget shortfall of more than $10 billion, and outdoor access could be on the chopping block. Representatives are more likely to protect funding for public lands if they hear from hikers like you. WTA has a proven track record of securing and maintaining funding for our state’s public lands and for equitable access to nature. But these wins are only possible with your help. Space is limited. Learn more and sign up as soon as possible so that WTA can save you a spot. Crescendo: A Symphonic Celebration of Washington LandscapesFriday, April 25 — 7:30-9:30 p.m.Benaroya Hall, Seattle Experience Washington’s natural wonders through an evening of sweeping views and thrilling music presented by Washington Trails Association and Northwest Symphony Orchestra. Delight in nature-inspired orchestral pieces paired with hundreds of hiker photos from WTA’s annual Northwest Exposure Photo Contest. Your ticket purchase to this joint fundraiser is an investment in WTA’s mission to mobilize everyone who loves the outdoors to explore and protect trails and public lands — and in NWSO’s work to perform and promote orchestral music, especially by northwest composers. Latino Outdoors, Trail Mixed Co & Outdoor Asian Climb NightFriday, Feb. 21 — 6 p.m.Seattle Bouldering Project Poplar, Seattle Join Outdoor Asian, Latino Outdoors, and Trail Mixed for a climb night at SBP Poplar in Seattle! This event is open to BIPOC and beginners are welcome. Day passes are $12 and include shoe rentals. Wenatchee River Institute DIY Bat Box WorkshopSunday, Feb. 23 — 12-3 p.m.Cashmere Bats are incredibly important members of our local ecosystem. From pest control to pollination, bats provide important ecosystem services. Unfortunately, natural habitat is in decline as human development increases in our region. Installing a bat box on your property is an excellent way to give back to the creatures that provide us with so much! During this 2-part class you will be guided through the process of constructing and painting a beautiful backyard bat box using mostly salvaged materials. Don't have space for a box in your backyard but still want to join us to learn the process? We can find a home that will benefit our local bat populations. This class is a partnership between Waste Loop, NCW Woodshop, and the Wenatchee River Institute. Wenatchee River Institute Red Barn Event - Cottonwoods: Unlocking our Rivers' HistoriesThursday, Feb. 27 — 7-8 p.m.Leavenworth & livestream Join the Wenatchee Valley chapter of the Native Plant Society and the Pacific Northwest chapter of the Society of Wetland Scientists for a presentation on Cottonwood trees. Discuss how cottonwoods evolved to be true river specialists, and what their presence, absence, and regeneration can tell us about a river’s history and diversity: its flow regime and the evolution of its channels across the watershed. Join us for a virtual fieldtrip through the rivers of North Central Washington as we unlock the natural history of rivers, as told by their floodplain cottonwood forests. Banff Centre Mountain Film Festival World TourOlympia: Feb. 28 – March 2 Ignite your passion for adventure, action, and travel! The Banff Centre Mountain Film Festival is one of the largest and most prestigious mountain festivals in the world.Hot on the heels of the Festival that is held every fall in beautiful Banff, Alberta, the Banff Centre Mountain Film Festival World Tour is hitting the road! With stops planned in about 550 communities in over 40 countries across the globe, the Festival celebrates amazing achievements in outdoor storytelling and filmmaking worldwide. Traveling to remote vistas, analyzing topical environmental issues, and bringing audiences up close and personal with adrenaline-packed action sports the World Tour is an exhilarating and provocative exploration of the mountain world.Join The Mountaineers when Banff Centre Mountain Film Festival World Tour brings the spirit of outdoor adventure to Seattle, at Benaroya Hall with TWO unique programs on January 15 and 16. Mountaineers Members can purchase tickets at a discounted price by using the unique promo code listed in recent email communications. The revenue from both nights directly support The Mountaineers mission to enrich the community by helping people explore, conserve, learn about, and enjoy the lands and waters of the Pacific Northwest and beyond. Be moved. Be inspired. Don’t miss out. Reserve your tickets today! Alki Beach Bird Walk with Gear HouseThursday, March 6 — 6:30-7:30 p.m.Alki Beach, Seattle Join fellow Gear House member and Naturalist Matthew Houghton for this two-part basics of birding and field walk along Alki Beach in West Seattle. Alki Headlands offers a mix of coastal and urban wildlife, with stunning views of Puget Sound and the Olympic Mountains. As you stroll along the shoreline, keep an eye out for surf scoters, pigeon guillemots, and buffleheads bobbing in the waves, while bald eagles and osprey soar overhead. Along the rocky shore, black oystercatchers may be foraging, and in the nearby trees, you might spot belted kingfishers or even a shy Anna’s hummingbird. Virtual Hike Habit with Wild GriefSaturday, March 8 — 11:00 a.m. - 1 p.m.Online Wild Grief Virtual Hike Habits are an opportunity to come together for grief peer support and nature connection from the comfort of your own home. The Virtual Hike Habit will start with an opening circle via video chat, similar to the opening circle on our in person hikes. We will introduce ourselves, share who we are carrying in our hearts, and offer some activities for your individual walk/hike. We will then ask everyone to find a place close by to be in nature for 30-45 minutes. This could be a walk around your neighborhood, a sit spot in your yard, or even just opening a window to feel the fresh air and see the sky. After our time in nature, we will reconvene for a closing circle. This event is free and open for anyone to participate. 90's Trivia with Gear House and Queer MountaineersTuesday, March 18 — 6:00-8:00 p.m.Basecamp Cafe, Seattle Join Gear House and the Queer Mountaineers at a night of 90's trivia. Prove your millennial status and flex your knowledge and make new friends at Basecamp from 6pm-8pm. The Queer Mountaineers is a volunteer-led community organization that hosts gym climbing nights, hikes, social meet ups, mountaineering skills workshops, ski events, trail running meetups, guided climbs, fundraising for causes, and so much more. Hike Habit Watershed Park with Wild GriefSunday, March 23 — 11:00 a.m. - 1:30 p.m.Olympia Wild Grief is returning to Watershed Park for a hiking event. It can be muddy in low spots and hilly as well so bring your hiking poles if you have them. It is still a good hike for kids and beginners. Every grief hike begins with an opening circle, an acknowledgement of who is here and who we are carrying in our hearts. Then we walk in silence for 10 minutes. Soon the group morphs and changes, forming small groupings or solitary walkers. We acknowledge that each of us is somewhere in our grief journey and all are welcome. We will stop occasionally on the trail to share or just notice in silence. We will end back at the shelter where we began and have a closing circle. Registration is required. Minors must be accompanied by an adult. Please leave pets at home; trained service animals are always welcome. Car-Free Adventure WorkshopWednesday, April 9 — 6–7:30 p.m.Online Explore car-free adventure with Transit Trekker and Washington Trails Association. Learn tools, tips and tricks for planning your own car-free outings. Get the scoop on some of the best transit treks near and far — as far as Alaska. Please register. City Nature ChallengeFriday, April 25–Monday, April 25Puget Sound region Woodland Park Zoo is thrilled to help mobilize people across the Seattle-Tacoma metropolitan area (all of Snohomish, King and Pierce counties) to join the City Nature Challenge 2025, a nature observation event using the iNaturalist app. Find and document what lives in our own homes, out our windows, on our windowsills and in our backyards, if not in our broader neighborhoods and cities. This can be done by yourself or with your family. You can also participate "online only" by looking through and helping to identify other people's observations! Ongoing Activities TrailBlissTrailBliss offers mindful hikes designed to connect individuals with nature, engage their senses, and explore the great outdoors while also providing a physical challenge. These hikes focus on fostering a deeper connection with the natural world while promoting mindfulness and well-being. These hikes are designed to encourage participants to slow down, observe their surroundings, and appreciate the beauty of the natural world. Whether you're a seasoned hiker or new to the trails, these mindful hikes provide an opportunity to escape the hustle and bustle of daily life and find peace and tranquility in the great outdoors. All hikes are offered free, and signup is required. Follow the link to check out upcoming hikes. Washington State Parks EventsWashington State Parks has a robust events calendar, and puts on programs across the state. These programs are varied in everything from topic to length, and some are hikes! Visit this calendar to find something that suits your needs and interests. Wilderness Awareness School The Wilderness Awareness School, located in Duvall, is a non profit with a mission to “to help children and adults cultivate healthy relationships with nature, community, and self.” They offer ongoing opportunities for nature related education, including but not limited to ongoing, free courses: Monthly Tracking Club and Monthly Bird Language Club. Find out more by following the link and visiting their website. Walk With a DocWalk With a Doc is a global community where doctors go on short walks with patients and members of the public. Each walk kicks off with a short presentation on a health topic followed by a short walk through a local park. Currently these walks are virtual due to social distancing measures, but will return to in-person meet-ups as soon as it's safe to do so. Walks are held in Everett, Olympia, Yakima, Spokane and St. Helens Oregon. Personalized Outfitting with an REI ExpertGet expert advice from the comfort of your home with our virtual outfitters. Video chat with our team to get the next great piece of gear, advice for an upcoming adventure, or explore the possibilities of a new outdoor activity. Book a live appointment today and connect with our team right from your home. Appointments are available 7 days a week from 5:00 a.m. to 7:00 p.m. PST. Free. Self-guided Forest BathingThe Washington Park Arboretum has several great resources for visitors to practice forest bathing, an approach to mindfully enjoying nature. Learn about the practice, find resources and share your experience with others. Volunteer as an Adventure ScientistHelp collect tree samples for a database that will be used to catch illegal timber harvests. Volunteer hikers collect leaves, seeds and wood samples and send them in to be tested, then the timber industry is able to check the wood that comes through their mills against this data to determine if it was harvested from an area where logging is permitted. Participate in Bird Counts in Your Backyard or BeyondCommunity science programs are central to the efforts of Audubon scientists. You, too, can be a volunteer scientist and help save populations of bird species around the world. Programs in which you can participate include Hummingbirds at Home, Christmas Bird Count, and the Great Backyard Bird Count. Be a Citizen Archivist for the National Archive Add tags to photos from America's Scenic Byways to make this resource more searchable for the public. First you must register, then you can pick the type of archiving you want to do and get started. There are more opportunities here as well, like transcribing historical documents about the first U.S. roads and trails to be built in Alaska. Environmental Film FestivalExplore the collection of current and past festival films now available for streaming. The Environmental Film Festival in the Nation’s Capital (DCEFF) is the world’s premier showcase of environmentally themed films. They/ThemPatagonia’s new film They/Them is a documentary that follows climber and guide Lor Sabourin into the sandstone canyons of northern Arizona, on a journey to piece together one of the hardest and most inspiring routes of their life. By embracing the strength in vulnerability, Lor has found the space to thrive and build a climbing community that others like themself can call home.Mapping Seattle's Historic Orchards Help identify historic fruit trees in your neighborhood that may be remnants of historic orchards. This project aims to identify and preserve these heirloom varieties still growing in Seattle. Living Snow ProjectThe Living Snow Project mobilizes volunteers to collect and submit samples of pink snow so researchers at Western Washington University can study the microbiome of creatures living in these environments. Anyone in the mountainous US can participate with a simple phone app and a sample kit that can be picked up or mailed to you. Story Time at the Miller LibraryThe Miller Library at UW's Botanic Garden presents monthly stories about gardens, plants and nature. Tune in anytime to watch a virtual reading of a new book each month. Monthly eBird surveys at Wenatchee River InstituteJoin WRI's knowledgeable naturalists on a birding survey around the WRI Campus! eBird is the largest biodiversity-related community science project in the world. Participants will be utilizing it to record observations of local wild birds. Each event includes four 15-m'''
