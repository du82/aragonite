description = "The Divide Camp Trail features dense forests, glacial creeks, and wildflower-strewn meadows. It also sees less traffic than the nearby Killen Creek Trail – the standard approach to High Camp."
full_description = '''Divide Camp The Divide Camp Trail features dense forests, glacial creeks, and wildflower-strewn meadows. It also sees less traffic than the nearby Killen Creek Trail – the standard approach to High Camp. https://www.wta.org/go-hiking/hikes/divide-camp https://www.wta.org/site_images/hikes/susan-saul.jpeg/@@download/image/divideCmp.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/divide-camp", "name": "Divide Camp", "description": "The Divide Camp Trail features dense forests, glacial creeks, and wildflower-strewn meadows. It also sees less traffic than the nearby Killen Creek Trail \u2013 the standard approach to High Camp.", "url": "https://www.wta.org/go-hiking/hikes/divide-camp", "image": "https://www.wta.org/go-hiking/hikes/divide-camp/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 37, "ratingValue": 2.2, "ratingCount": 6, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 46.2728173521, "longitude": -121.565008163}} Divide Camp South Cascades > Mount Adams Area 46.2728, -121.5650 Map & Directions Length 5.8 miles, roundtrip Elevation Gain 1,400 feet Highest Point 6,100 feet Calculated Difficulty About Calculated Difficulty Moderate Gorgeous meadow views of Mount Rainier. Photo by JulieRal. Full-size image Mountain views Old growth Rivers Wildflowers/Meadows Parking Pass/Entry FeeNorthwest Forest Pass Permits Required Wilderness permit. Self-issue at trailhead (no fee) Add Hike to My Backpack Saved to My Backpack The Divide Camp Trail features dense forests, glacial creeks, and wildflower-strewn meadows. It also sees less traffic than the nearby Killen Creek Trail – the standard approach to High Camp. Continue reading Rating 2.17 out of 5 (6 votes) Log in to rate 37 trip reports for this trail Write a trip report Hiking Divide Camp The Divide Camp Trail features dense forests, glacial creeks, and wildflower-strewn meadows. It also sees less traffic than the nearby Killen Creek Trail — the standard approach to High Camp. Beginning at the boundary of the Mount Adams Wilderness and proceeding southeast towards Mount Adams, this trail ascends moderately from 4700 feet of elevation to 6100 feet. The way takes you through a dense forest, follows Adams Creek and after 2 miles bursts out on an alpine meadow with a view of Mount Adams and the Adams glacier. From this view, it's just another 0.9 miles to a junction with the Pacific Crest Trail. From here, you might find a campsites about 0.3 miles off the Divide Camp trail, isolated at the foot of a lava field. Along the trek are wildflowers, glacial moraines, and evidence of wildlife. On the way back are views of Mount Rainier and Mount St. Helens. Although a clear day for this hike will give you a lot to see, even an overcast day will not be disappointing in crossing the meadows of wildflowers. Bring plenty of water. The only water source is Adams Creek and it is cloudy with glacial silt that will clog up a filter. Mosquitos are through July but gone by August. The trail is a major access point for climbers on the north and western slopes of the mountain. Ambitious hikers can use this as hiking access with the Muddy Meadows Trail 114 or Killen Creek Trail #113 to the north each joined by the Pacific Crest Trail. Midweek hikes will be less crowded than weekend ones. WTA worked here in 2013! Divide Camp Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps