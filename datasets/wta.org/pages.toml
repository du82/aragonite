["https://www.wta.org/news/signpost/get-wtas-app-now-then-go-hiking-5-15.23"]
title = "Get WTA's App Now for a Season of Great Hiking — Washington Trails Association"
description = "WTA's latest app updated gives you a better browsing experience and more offline information at-a-glance. Check it out."
full_description = "Get WTA&#x27;s App Now for a Season of Great Hiking WTA's latest app updated gives you a better browsing experience and more offline information at-a-glance. Check it out. https://www.wta.org/news/signpost/get-wtas-app-now-then-go-hiking-5-15.23 https://www.wta.org/news/signpost/get-wtas-app-now-then-go-hiking-5-15.23/@@download/image/trailblazer screenshots Entiat-River-Pomas-Creek Aug 2021-Ginevra-Moore.jpg Get WTA's App Now for a Season of Great Hiking Posted by Anna Roth at May 15, 2023 09:16 AM | Permalink Filed under: Hike Planning, Trail Smarts Share Print Email WTA's latest app updated gives you a better browsing experience and more offline information at-a-glance. Check it out. WTA's Trailblazer app has been around for years (11 years to be precise) thanks to collaboration between WTA staff and a team of dedicated, generous volunteers. And if you don't already have the app, you should. Download WTA's App today WTA Trailblazer for iPhone WTA Trailblazer for Android WTA's app puts our entire Hiking Guide right in your pocket, with the added bonus of offline access to the information for any hike you've saved in your My Backpack account, and a function to find a hike near your current location, giving you backup plans B, C and D with just a few clicks. We made some important updates last year, and now we're proud to unveil an app-wide design update just in time for hiking season to really get rolling. Here’s what’s new in this release. Search trip reports and the hiking guide, find hikes near you, and take saved hikes online. Photo by Ginevra Moore Explore More Trails Pick your next hike faster. The list view for hike search results now includes mileage, elevation gain, location, rating and difficulty to help you decide if the trail is right for you. The map view of search results also includes ratings, mileage and difficulty. Trailhead maps. New maps on the hike details page show you where the trailhead is. Click on the map for a fullscreen view, and — if you have cell service — you can use your phone’s location to see where you are on-trail in the map view of a hike. Save hikes now, hike smart later. The redesigned saved hikes list includes more information about trails so you can remember why you saved them in the first place. See where the hike is, the most relevant data point, and a list of features you can expect on trails, all at-a-glance. Get Inspired and Tell Your Friends Pretty pictures. Image quality has been improved app-wide, making trip reports and the Hiking Guide even more fun to browse. Sharing is caring. See a hike or a trip report you want to share? Each page has a new share link so you can send it directly to your hiking crew. Share your experience One trip report, multiple trails. A direct link to a trip report form on the homepage makes it much faster to file trip reports in-app. You can also select multiple trails for one trip report now. Pics or it didn't happen. Uploading photos is improved, and you can rotate images in the trip report form before you post it. We're really excited about this, and we hope you like it, too! Next time you head out on trail, try writing a trip report from the app. Let us know what you think by leaving a review in the app stores, or emailing iphone@wta.org or androidphone@wta.org. Want to see more functionality? You can volunteer for the app team (we're always looking for developers) or donate to WTA to make more work like this possible. Report inappropriate content"
year_published = 2025
