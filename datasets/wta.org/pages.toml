["https://www.wta.org/go-hiking/hikes/six-ridge"]
title = "Six Ridge — Washington Trails Association"
description = "The Six Ridge Trail is a rugged route that traverses the South Fork to the North Fork of the Skokomish River. It is known for its solitude, meadows and grand mountain vistas, but it comes at a price -- a steep, long trail to these destinations."
full_description = '''Six Ridge The Six Ridge Trail is a rugged route that traverses the South Fork to the North Fork of the Skokomish River. It is known for its solitude, meadows and grand mountain vistas, but it comes at a price -- a steep, long trail to these destinations. https://www.wta.org/go-hiking/hikes/six-ridge https://www.wta.org/site_images/hikes/six-ridge_d-baxter.jpeg/@@download/image/sixRidge.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/six-ridge", "name": "Six Ridge", "description": "The Six Ridge Trail is a rugged route that traverses the South Fork to the North Fork of the Skokomish River. It is known for its solitude, meadows and grand mountain vistas, but it comes at a price -- a steep, long trail to these destinations.", "url": "https://www.wta.org/go-hiking/hikes/six-ridge", "image": "https://www.wta.org/go-hiking/hikes/six-ridge/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 37, "ratingValue": 3.5, "ratingCount": 6, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 47.4794, "longitude": -123.4521}} Six Ridge Olympic Peninsula > Hood Canal 47.4794, -123.4521 Map & Directions Length 21.1 miles, roundtrip Elevation Gain 3,150 feet Highest Point 4,650 feet Calculated Difficulty About Calculated Difficulty Hard Spring snow at Six Ridge. Photo by Brittany Groh. Full-size image Dogs not allowed Established campsites Lakes Mountain views Ridges/passes Summits Wildflowers/Meadows Parking Pass/Entry FeeNational Park Pass Add Hike to My Backpack Saved to My Backpack The Six Ridge Trail is a rugged route that traverses the South Fork to the North Fork of the Skokomish River. It is known for its solitude, meadows and grand mountain vistas, but it comes at a price -- a steep, long trail to these destinations. Continue reading Rating 3.50 out of 5 (6 votes) Log in to rate 37 trip reports for this trail Write a trip report Hiking Six Ridge This challenging trail takes visitors through lowland forests up to subalpine meadow and forest on a primitive trail in Olympic National Park. The trail can be difficult to follow, particularly in early season before trail crews like WTA have come in to clear damage from winter storms, but in the late summer, it's a gorgeous backpacking route through breathtaking backcountry. The Six Ridge Trail is a rugged route that traverses the South Fork to the North Fork of the Skokomish River. It is known for its solitude, meadows and grand mountain vistas. Hikers begin with a trek up the South Fork Skokomish River Trail to Sundown Pass and Lake. The Six Ridge Trail runs east along the crest for 11 miles before dropping down and terminating at the North Fork Skokomish River. It is then about six miles downriver to the Staircase Ranger Station. WTA worked here in 2022, 2021, 2019, 2018, 2016, 2014, 2013 and 2011! Six Ridge Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-123.4521, 47.4794], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "six-ridge"}, containerId = "map", hike = {"trailhead": [-123.4521, 47.4794], "id": "six-ridge", "title": "Six Ridge", "thumbnail": "https://www.wta.org/go-hiking/hikes/six-ridge/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 47.4794, -123.4521 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeNational Park Pass WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From Highway 101 turn west onto Skokomish Valley Road, 6 miles north of Shelton or 7 miles south of Hoodsport(at the Fish Hatchery). Drive about 5.6 miles to the junction of Forest Service Road 23. Turn right and uphill onto FR 23. The road is paved except for a small section of gravel; stay on the main route until you arrive at a fork in the road after another 9.4 miles (15.0 from the US 101). Turn left, uphill, signed for Spider Lake and Skokomish Trail. (The right turn, onto FSR 2353, is also signed for Skokomish Trail as well as Brown Creek C.G. Do NOT turn right.) Proceed on the the now-gravel FSR 23 for another 4.4 miles (19.4 from US 101) to another Y. Turn right onto FSR 2361 (signed but only after a gate and not visible from the Y). Proceed another 5.0 miles (24.5 from US 101)to the end of 2361 - that is where the Upper Skokomish trailhead is located. Print Email More Hike Details Trailhead Olympic Peninsula > Hood Canal Olympic National Park Guidebooks & Maps Custom Correct Mount Skokomish-Lake Cushman Learn 16 Lighthouse Hikes You Can Enjoy All Year Learn Hiking Maps and Why You Need Them You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
