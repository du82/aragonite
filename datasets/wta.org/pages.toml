eft onto Toats-Coulee Road. Continue 14.6 miles to a small parking area approximately 0.5 miles west of Cold Spring Campground on the edge of the Loomis Natural Resources Conservation Area. Border Camp Trail is reached via other trails on this trail system, including Disappointment Trail and Snowshoe Trail. Discover Pass required. The Cold Spring Campground is also free with Discover Pass, first-come/first-served. A CXT toilet is available at the campground but not at the trailhead. Print Email More Hike Details Trailhead North Cascades > Pasayten Department of Natural Resources, Loomis State Forest Learn How to Hike in Bear Country Learn Hiking Maps and Why You Need Them You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
