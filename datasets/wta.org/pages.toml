.1718 Open in Google Maps Before You Go Meadowlark Natural Area is closed during the month of March to give the mule deer and other animals a chance to enjoy the early spring green up. See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From the four way stop sign in Winthrop’s downtown, travel east on Highway 20 about one quarter mile. Take a left onto East County Road just before crossing the Methow River on an old bridge. Turn left on Cassal and then after a few blocks turn right onto Rose Hill Road. A quick right onto Wister Way and you’re almost there. Parking is just past the cemetery. Print Email More Hike Details Trailhead North Cascades > Methow/Sawtooth Methow Conservancy Learn How to Hike in Bear Country Learn Hiking Maps and Why You Need Them You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
