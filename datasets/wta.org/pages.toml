["https://www.wta.org/go-hiking/hikes/obstruction-pass"]
title = "Obstruction Pass State Park — Washington Trails Association"
description = "Moran State Park might have mountains and lakes, but Obstruction Pass has quiet, open forest, secluded campgrounds, and the largest public beach on Orcas Island. Take a quiet walk here and soak in the peaceful shoreline."
full_description = '''Obstruction Pass State Park Moran State Park might have mountains and lakes, but Obstruction Pass has quiet, open forest, secluded campgrounds, and the largest public beach on Orcas Island. Take a quiet walk here and soak in the peaceful shoreline. https://www.wta.org/go-hiking/hikes/obstruction-pass https://www.wta.org/site_images/hikes/obstruction-pass-state-park-photo-by-knuteb.jpeg-1/@@download/image/obstructionPass.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/obstruction-pass", "name": "Obstruction Pass State Park", "description": "Moran State Park might have mountains and lakes, but Obstruction Pass has quiet, open forest, secluded campgrounds, and the largest public beach on Orcas Island. Take a quiet walk here and soak in the peaceful shoreline.", "url": "https://www.wta.org/go-hiking/hikes/obstruction-pass", "image": "https://www.wta.org/go-hiking/hikes/obstruction-pass/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 37, "ratingValue": 3.4, "ratingCount": 10, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 48.608483, "longitude": -122.8264}} Obstruction Pass State Park Puget Sound and Islands > San Juan Islands 48.6085, -122.8264 Map & Directions Length 1.9 miles, roundtrip Elevation Gain 305 feet Highest Point 225 feet Calculated Difficulty About Calculated Difficulty Easy This beautiful short loop trail meanders through the forest before coming to the beach and then returning back through the woods. Photo by Travel&Hike. Full-size image Coast Dogs allowed on leash Established campsites Good for kids Old growth Wildlife Parking Pass/Entry FeeDiscover Pass Add Hike to My Backpack Saved to My Backpack Moran State Park might have mountains and lakes, but Obstruction Pass has quiet, open forest, secluded campgrounds, and the largest public beach on Orcas Island. Take a quiet walk here and soak in the peaceful shoreline. Continue reading Rating 3.40 out of 5 (10 votes) Log in to rate 37 trip reports for this trail Write a trip report Hiking Obstruction Pass State Park Despite being just 80 acres, Obstruction Pass State Park boasts a variety of trails. It's a relatively straight shot to the camping area and beach if you take the 0.6-mile central trail (it's 1.2 miles roundtrip). Or, you can take the 0.4-mile, very faint Sound View trail, which loops along a bluff before reconnecting with the main trail to finally deposit you at the camp and shoreline from the west. But the best way to experience the whole trail is looping the central trail with the Highlands trail, making for a 1.5-mile loop down to the water and back up through upland forest along the northeast border of the park. Plus, this way, you get to take in all the informative interpretive signage provided by the park. Set off from the parking area by walking through a stile. The junction greets you on the other side of the stile. Of course, it's possible to do the loop either way, but counter-clockwise gets you to the water faster, and makes for a slightly less-steep return. Choose the path straight ahead of you to do the loop this way. The way begins descending almost immediately, and you'll be walking through an open forest populated by Douglas-first and western redcedar, and madronas. Pause and take in the interpretive panels as you hike; they give you context and information about the area, and might help you identify the plants and geologic features unique to the islands. Continue descending. You'll notice the salal (a common ground cover here) getting taller, and suddenly will pop out into a campsite! There are 10 walk-in campsites available here on a first-come, first-serve basis. A surprisingly picturesque privy rounds out the scene—it's an idyllic campsite; perfect for introducing kids to backpacking. The trail continues through the campground and to a fence on a bluff, affording you views of Obstruction Pass itself, as well as Blakely Island across the way. Turn left, and hike along the bluff. One trail offers access to the beach, which you can head down to explore before continuing on your loop. Scramble up a small, somewhat exposed section of rock (the only somewhat hard-to-follow section of trail here) and look for a large brown sign with an arrow pointing into the woods. This is where you turn left and follow the trail inland. Now on the Highlands Trail, begin a gentle climb. Look for deer in this section, as they like to browse in this sort of landscape and the Highlands Trail is less trafficked than the main route. If you see them, keep your distance. It's best to leave wildlife be in their habitat. The trail mostly climbs, though there are a few dips to keep it interesting as you round the northeast corner and the trail turns left to return to the parking area. Enjoy the flat traverse here, and the final descent to the first junction, and soon after, the trailhead. Hike Description Written by Anna Roth, WTA Staff Obstruction Pass State Park Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-122.8264, 48.608483], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "obstruction-pass"}, containerId = "map", hike = {"trailhead": [-122.8264, 48.608483], "id": "obstruction-pass", "title": "Obstruction Pass State Park", "thumbnail": "https://www.wta.org/go-hiking/hikes/obstruction-pass/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 48.6085, -122.8264 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeDiscover Pass WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There Take the Washington State ferry to Orcas Island from Anacortes (reservations required). Once at Orcas, follow Orcas Road for 8 miles to the village of Eastsound. Turn right to drive through Eastsound, or stay straight to take the truck route around town. The two roads meet at a "T" intersection marked by a Minit Mart on Olga Road. Continue on Olga Road (turning right onto Olga Road if you went through Eastsound) for 3.6 miles and pass through the gate marking the entrance to Moran State Park entrance gate. Continue another 3 miles to a junction and turn left onto Point Lawrence Road. After a half mile of driving, hang a right onto Obstruction Pass Road and follow it for almost a mile. Then turn right onto the hard-packed-gravel Trailhead Road and follow this road for 0.8 miles, dead ending at the parking area. There is a bathroom available here, as well as a bike rack, and room for about 20-25 cars. Print Email More Hike Details Trailhead Puget Sound and Islands > San Juan Islands Washington State Parks Guidebooks & Maps USGS Blakely Island state park map online Learn Day Hike Packing List Learn 16 Lighthouse Hikes You Can Enjoy All Year You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
