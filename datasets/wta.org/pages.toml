["https://www.wta.org/news/signpost/hiker-headlines-wtas-seattle-times-op-ed-on-public-lands-firings-north-cascades-permit-lottery-opening-wind-damage-2-27-25"]
title = "Hiker Headlines: Wind damage, North Cascades permits, WTA's op-ed on Forest Service and Parks firings — Washington Trails Association"
description = "The early access lottery for North Cascades backcountry permits opens on March 3 — and other early access lotteries are closing soon. Big winds hit Washington earlier this week, so be careful of fallen trees and debris when hitting the trails this weekend! And read WTA’s op-ed in the Seattle Times on the recent federal staffing cuts."
full_description = "Hiker Headlines: Wind damage, North Cascades permits, WTA&#x27;s op-ed on Forest Service and Parks firings The early access lottery for North Cascades backcountry permits opens on March 3 — and other early access lotteries are closing soon. Big winds hit Washington earlier this week, so be careful of fallen trees and debris when hitting the trails this weekend! And read WTA’s op-ed in the Seattle Times on the recent federal staffing cuts. https://www.wta.org/news/signpost/hiker-headlines-wtas-seattle-times-op-ed-on-public-lands-firings-north-cascades-permit-lottery-opening-wind-damage-2-27-25 https://www.wta.org/news/signpost/hiker-headlines-wtas-seattle-times-op-ed-on-public-lands-firings-north-cascades-permit-lottery-opening-wind-damage-2-27-25/@@download/image/downed tree by stever.jpg Hiker Headlines: Wind damage, North Cascades permits, WTA's op-ed on Forest Service and Parks firings Posted by tiffanyc at Feb 27, 2025 09:42 AM | Permalink Filed under: Hiker News, Advocacy Share Print Email The early access lottery for North Cascades backcountry permits opens on March 3 — and other early access lotteries are closing soon. Big winds hit Washington earlier this week, so be careful of fallen trees and debris when hitting the trails this weekend! And read WTA’s op-ed in the Seattle Times on the recent federal staffing cuts. It’s Feb. 27. The early access lottery for North Cascades backcountry permits opens on March 3 — and other early access lotteries are closing soon. Big winds hit Washington earlier this week, so be careful of fallen trees and debris when hitting the trails this weekend! And read WTA’s op-ed in the Seattle Times on the recent federal staffing cuts. Here’s some news you may have missed while out on trail this week. Some places were hit by big winds earlier this week, so expect some fallen trees if you go hiking this weekend. Photo by trip reporter stever at Little Si. North Cascades permits: The early access lottery for North Cascades backcountry permits opens on March 3 at 7 a.m. Submit applications through Recreation.gov until March 14. Successful applicants will be notified on March 21 and will be able to apply for permits before they open to everyone. Two other backcountry permit lottery application periods close soon. The lottery for the Enchantments closes March 1 at 11:59 p.m., and the lottery for Mount Rainier closes March 3 at 7 p.m. Lots of debris and fallen trees: The big winds that hit Washington earlier this week caused some big blowdowns, broken branches and falling debris, so be aware of possible obstacles this weekend if you hit the trail. When you get home, take a minute to post a trip report about your hike so folks know what to expect if they decide to head there, too. Speaking up for public lands agencies: Earlier this week, WTA CEO Jaime Loucky and The Mountaineers CEO Tom Vogl called upon lawmakers to ensure the safety of Washington’s public lands and the people who visit them by reversing the recent staffing cuts on federal lands in a Seattle Times op-ed. Contact your members of Congress to ask them to reverse this decision and ensure our public lands have the staffing and funding support they need. BE IN THE KNOW Keep up to date with Trail News, our monthly email newsletter. Search our Hiking Guide to find your next adventure. Check trip reports for latest conditions on trails. And if you go for a hike, file your own trip report. Sign up for Families Go Hiking, our email newsletter for families with plenty of tips on keeping kids busy. Sign up for Trail Action Network to stay up to date on issues impacting trails and ways to get involved. Report inappropriate content"
