title = "Snow Creek — Washington Trails Association"
description = "One of three ways to reach the summit of Mount Zion. It's steep, but short, and you'll be rewarded with view of the Olympics at the top."
full_description = '''Snow Creek One of three ways to reach the summit of Mount Zion. It's steep, but short, and you'll be rewarded with view of the Olympics at the top. https://www.wta.org/go-hiking/hikes/snow-creek https://www.wta.org/site_images/hikes/mount-zion.jpeg/@@download/image/snowPeak.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/snow-creek", "name": "Snow Creek", "description": "One of three ways to reach the summit of Mount Zion. It's steep, but short, and you'll be rewarded with view of the Olympics at the top.", "url": "https://www.wta.org/go-hiking/hikes/snow-creek", "image": "https://www.wta.org/go-hiking/hikes/snow-creek/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 36, "ratingValue": 3.1, "ratingCount": 8, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 47.9220167, "longitude": -122.98275}} Snow Creek Olympic Peninsula > Hood Canal 47.9220, -122.9827 Map & Directions Length 4.8 miles, roundtrip Elevation Gain 1,944 feet Highest Point 4,274 feet Calculated Difficulty About Calculated Difficulty Moderate/Hard Summit views from Snow Creek. Photo by DocOpie. Full-size image Dogs allowed on leash Good for kids Mountain views Rivers Parking Pass/Entry FeeNorthwest Forest Pass Add Hike to My Backpack Saved to My Backpack One of three ways to reach the summit of Mount Zion. It's steep, but short, and you'll be rewarded with view of the Olympics at the top. Continue reading Rating 3.12 out of 5 (8 votes) Log in to rate 36 trip reports for this trail Write a trip report Hiking Snow Creek Reach the summit of Mount Zion on a less-traveled trail. This is very steep, 2.4-mile hike through mature conifer forests and wildflowers, links up with the Deadfall Trail at about one mile, then evens out towards the summit of Mount Zion. You can turn around here or continue north on the Mount Zion Trail to traverse the north ridge and head back down the northwest side of the mountain for 1.8 miles to reach the Mount Zion/Sleepy Hollow Trailhead. WTA worked here in 2022! Hike Description Written by Multiple authors contributed to this report, WTA Community Snow Creek Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-122.98275, 47.9220167], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "snow-creek"}, containerId = "map", hike = {"trailhead": [-122.98275, 47.9220167], "id": "snow-creek", "title": "Snow Creek", "thumbnail": "https://www.wta.org/go-hiking/hikes/snow-creek/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 47.9220, -122.9827 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeNorthwest Forest Pass WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From Quilcene, head north on Highway 101 for about 6 miles, and turn west onto the well-signed Snow Creek Road, just north of Leland Lake. Head west, ignoring the Lords Lake Loop sign at 3.1 miles and stay on the well maintained FR 3529.At about 6.5 miles you will come to an unmarked intersection where you leave FR 3529 and turn left onto a one-lane dirt road (2851 but sometimes called 2814 on older maps). Stay on this road for 3.2 miles, looking for a yellow gated road on your left. When you spot that, you are about a quarter mile from where it joins 090. At the junction with 090, stay left on narrow 2851 for a few hundred feet to the signed trailhead (elevation 2230 feet). Print Email More Hike Details Trailhead Olympic Peninsula > Hood Canal Snow Creek (#890) Olympic National Forest, Hood Canal Ranger District Learn 16 Lighthouse Hikes You Can Enjoy All Year Learn Hiking Maps and Why You Need Them You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
