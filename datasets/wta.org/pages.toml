description = "Meet the permanent staff of Washington Trails Association."
full_description = '''Staff Meet the permanent staff of Washington Trails Association. https://www.wta.org/our-work/about/staff https://www.wta.org/@@site-logo/wta-logo.png Staff Meet the permanent staff of Washington Trails Association. You can also read about our wonderful community of trail crew leaders. Executive Leadership Team Jaime Loucky - Chief Executive Officer Growing up in Bellingham, with the North Cascades practically in his backyard, Jaime developed a lifelong passion for hiking, backpacking and spending time in the beautiful outdoors. That passion followed him as he traveled to the East Coast and ultimately to NYC, where he learned to appreciate the value of urban green spaces and trails as a way to escape the hustle and bustle of city life. Jaime eventually moved back to the Pacific Northwest, but not before buying a campervan and taking a year-long road trip with his wife Laine, visiting 47 National Parks and Forests in the process. He arrived at WTA in early 2020 and served as WTA's first Chief Impact Officer, overseeing our strategic planning and program operations. He is now thrilled to serve as the CEO and is committed to helping advance our vision of Trails for Everyone, Forever and connecting hikers and everyone who loves the outdoors with opportunities to get outside and give back to trails. In his free time Jaime enjoys gardening, riding the Burke Gilman and taking his 2 year old daughter Sasha out on trail any chance he gets. Email: jloucky@wta.org Amanda Baker (she/her) - Chief Operating Officer The ponderosa pines of Spokane just smell like home to Amanda. Now in Seattle, she's spent her career in high-impact nonprofits working to build a better world. Amanda's expertise is in nonprofit operations, with more than a decade of senior leadership in HR, finance and IT, and she holds a master's degree in nonprofit management. When not living the dream as part of WTA's team, she's happiest on family hikes to waterfalls or with her nose in a book. Email: abaker@wta.org Kindra Ramos (she/her) - Chief Programs Officer Kindra loves helping hikers get involved in WTA’s community— talking with folks about favorite trails, the importance of public lands, and WTA’s role is in protecting these special places. She enjoys wandering the woods with her wife. She believes in taking time to appreciate the little curiosities on trail like mushrooms, insects and pika. Eventually, she’d like to explore the remote Salmo-Priest Wilderness of Eastern Washington on a backpacking trip. Email: kindra@wta.org WTA Staff James Alexander - Trail Crew Leader - Southwest James is from the island of Luzon, Philippines, and was raised in a small country town in Texas. James started volunteering with WTA in the fall of 2020 shortly after retiring from the United States Army with 25 years of active duty service. With no past experience in trail maintenance, James credits the volunteers for teaching him the "way of the grubber." If you can't find James on a work party, then he's either out exploring, in the kitchen, enjoying a good beer or cocktail, or watching movies. Email: jalexander@wta.org will allen - Youth Trail Program Manager will's love for the outdoors was sparked during their childhood in rural Kentucky. They worked on trail crews in Oregon, California and Arizona before moving to Washington to teach at outdoor school. They are passionate about queer community, making medicine, sit spots, bicycling, and dismantling the white supremacist cis-hetero capitalist patriarchy! They're a plant nerd who thinks that nurse logs are just the absolute coolest, so their favorite hikes meander through forests on their way to ... anywhere, really! Email: rallen@wta.org Melani Baker (she/her) - Advocacy Coordinator Melani grew up in Pittsburgh, PA, connecting with the outdoors through local parks and yearly family vacations to the Outer Banks, NC. Though she’s been dreaming of thru-hiking the Appalachian Trail since she was a teenager, she didn’t actually begin hiking until moving to Seattle in 2008. Now she doesn’t know whether to hike the Appalachian Trail or the Pacific Crest Trail someday! From working as an environmental educator in NYC to scuba diving in Seattle to completing Antioch University’s Urban Environmental Education program, she loves nature when it’s as local as it gets. Email: mbaker@wta.org Mike Bellis - Northwest Regional Crew Leader Mike has a passion for wild places and the trails that take him there. His connection to nature began as a kid out hunting, fishing and turning over every rock in the local creek to inspect for critters. His love of the outdoors has only grown deeper with age and he always loves sharing what he has learned from many years of listening to the forest. Crew leading for WTA gives him a chance to get a deeper connection with the North Cascades and the wonderful community of people that he shares them with. When he isn’t working on trails you can find Mike kicking around the South Fork valley of Whatcom county on the lookout for a flush of edible mushrooms or sign of the wild creatures that share the valley. Email: mbellis@wta.org Arlen Bogaards - Northwest Regional Manager Arlen runs the WTA show in Northwest Washington, crew leading work parties, representing WTA at outreach fairs and promoting hiking in the area. Somehow, in between all of this he finds time to feed the chickens and goats on his small farm. After years in the construction field, Arlen finally united his work with his passion: trails. He enjoys a good day hike in a high meadow or a backpacking trip in the desolate North Cascades, and his favorite hike is Skyline Divide. If he ever gets the chance, he would like to section hike the Pacific Crest Trail. Email: arlen@wta.org Paul Boronow - Olympic Trails Coordinator Paul got his start in conservation as a trail crew member with the New York-New Jersey Trail Conference in his home state of New York. He was drawn to the unique community of oddballs he found in trails and the tangible impact of the work they were doing together. Paul furthered his experience with Rocky Mountain Youth Corps in Colorado, where he led crews and planned programs for their Conservation Corps. When he’s not on the trails, Paul enjoys biking at a moderate pace, taking things apart, skipping rocks at the beach, and giving his dog haircuts. Email: pboronow@wta.org Moleek Busby - Field Operations Senior Manager Moleek Busby is originally from the San Francisco Bay Area. His career in trail work started with the California Conservation Corps. After college and music projects in Chico, CA, Moleek returned to conservation, working nine years for the Student Conservation Association and moving up the ranks. As the Field Operations Senior Manager for the Washington Trails Association, he has oversight of the trail maintenance risk management information system. Moleek is also on the Wilderness Risk Management steering committee, the North West Outward Bounds safety committee and an ambassador for the Mountain Mind Project. When he is not making public lands safe for Washingtonians, Moleek enjoys creating music, hiking, backpacking, kayaking, archery, car "glamping" and getting some trail work in. He is a life-long advocate for marginalized people to have ownership in their space and to feel safe volunteering and recreating on public lands. Email: mbusby@wta.org Kara Chin - Senior Human Resources Manager Kara, a Pacific Northwesterner, has spent her life playing in the diverse bio-niches of the region. Her long history with WTA first began as a volunteer for trail work parties and TrailsFest, then as an administrative intern in 2000, followed by handling "all things membership and Hike-a-Thon" for nearly a decade. Trained as an artist, choreographer, and costume designer, she has always found inspiration in her extended backyard. These days you'll most likely find her seeking out moss, mushrooms and gastropods on the forest floor or in her garden. Email: kara@wta.org Tiffany Chou - Communications Coordinator Although Tiffany was born in New Jersey, she grew up in Washington and considers Seattle home. After studying biology and computer science, she worked as a software engineer for 3.5 years until she discovered her love of hiking. She completed a southbound thru-hike of the Pacific Crest Trail in 2019, then spent the next 2 years taking teenagers on backpacking trips as a wilderness instructor. Tiffany originally joined WTA as a part of its Emerging Leaders Program, then found her way to the amazing communications team. She's usually out hiking, backpacking, or at home planning her next adventure. Email: tchou@wta.org Denise Cline - Senior Accounting Manager Denise's love for the outdoors began during her time as a girl scout and camp counselor in Upstate New York. In 1993 she drove to Washington state to attend college and has lived here ever since. Although she appreciates all the outdoor opportunities the Pacific Northwest has to offer, she has a special love for the Nisqually Wildlife Refuge where she spent countless hours exploring nature with her daughter. Denise is excited to bring her 10 years of nonprofit finance experience to the amazing WTA Business Operations team. When she isn't working or spending time with her family, she enjoys performing in local British Brass Bands and running with her dog. Email: dcline@wta.org Lezlie Cox - Office Manager Lezlie is from Wisconsin, growing up water-skiing and shoveling snow. Decades ago, she led WTA volunteers on Olympics work parties and around the state on volunteer vacations. She has strolled 1700 miles of the Pacific Crest Trail and loved the absence of a schedule and tech! After years out of state, Lezlie returned to Washington for two seasons working for the King County Parks Volunteer Program before rejoining WTA as the office manager. She recommends Northrup Canyon in the spring and Thorp Mountain via Knox Creek in the summer. Email: lezlie@wta.org Kaci Darsow (they/them) - Youth Trail Crew Leader Kaci grew up poking around the rocky shores of Puget Sound and romping through cedar and sword fern forests. They come to WTA with extensive youth work experience in a variety of outdoor settings and an M.Ed. in Environmental Education. Kaci is returning home to the PNW from their most recent adventure—a year of teaching outdoor education in rural Alabama. They are stoked to ease into the world of office work by splitting their time facilitating youth work parties and serving as a support system for Youth Volunteer Vacations. When they're not inspiring youth, Kaci loves cross-country road trips, learning new things, singing off-key in their car, climbing trees and dismantling the patriarchy. Email: kdarsow@wta.org Michael DeCramer (he/him) - Policy and Planning Manager A lifelong Seattle Mariners fan, Michael loves the communities and landscapes of the Pacific Northwest. He believes that access to outdoor recreation can enrich people’s lives and provide less consumptive experiences that can connect people to the natural world, other people and themselves. Michael is passionate about public policy and obsessed with trails. Before joining WTA, Michael worked at the Pacific Crest Trail Association and the Mountain to Sound Greenway Trust where he built trails and partnerships. When not working on advocacy issues, Michael can often be found daydreaming about his next thru-hike. Email: mdecramer@wta.org Krista Dooley - Community Partnerships and Leadership Development Director Krista has a rich background in environmental education, having worked in several youth programs in various regions of the U.S. and Switzerland before joining WTA. She brings a passion for connecting people to the outdoors and has seen the positive impact collaboration with partners can have developing the next generation of outdoor leaders. Born and raised in Washington, she relishes spending time outdoors and loves hiking at a pace that allows her to enjoy her surroundings with her daughters. Email: krista@wta.org Loren Drummond (she/her) - Senior Digital Strategy Manager Loren has dedicated her career at WTA and other nonprofits to using digital communications for positive change. She's backpacked (and rebuilt) sections of the Colorado Trail, and she's put in miles on the Appalachian and Pacific Crest Trails, too. At WTA, she loves connecting with and supporting an incredible community of volunteers, hikers and would-be hikers with Washington's wild places. She has a particular fondness for desert camping, alpine basins and marmots. Email: loren@wta.org Dean Ericksen - Information Technology Senior Manager Dean hails from Seattle, and while his WTA tenure is brief, he has worked with us in a consulting capacity for a number of years. For many years Dean has partnered with regional nonprofit organizations to help them get the most out of technology and the internet. He currently works to make sure our systems are on their best behavior. When he's not situated in front of a computer, he could be found cooking in front of a hot stove, or wandering around the Methow with family and friends. Email: dean@wta.org Chloe Ferrone (she/her) - Central Washington Regional Coordinator Chloe originally hails from Nebraska, but traded prairies and sandhill cranes for the maple-covered mountains of Vermont, where she attended Middlebury College. She fell in love with hiking and trail running while in school, and hiked the Long Trail after graduating. From there, Chloe spent several years in Utah pursuing a wide range of outdoor-related jobs, working as a rock climbing instructor, dog sled guide, reporter, and backpacking guide. Although she loves the desert, she’s enthralled by the PNW and now calls Central Washington home. She was drawn to WTA by the prospect of doing good in the world and getting her community hyped about hiking and exploring the outdoors. When she’s not doing trail work or community outreach, you can find Chloe gardening, climbing, trail running with her dogs Tesser and Muppet, or attempting to befriend the local corvid population. Email: cferrone@wta.org Angelic Friday (she/her) - Emerging Leaders Program Project Coordinator Angelic grew up in the Puget Sound area and has always enjoyed spending time outdoors. While growing up she spent time crabbing, fishing, and exploring the outdoors with her girl scout troop. When she is off the clock, you can find her teaching youth and adult level color guard, on a trail, or cheffing it up in the kitchen. She started working for WTA as a crew member in the Lost Trails Found crew this past summer. Angelic is passionate about being a good steward to the land and advocates for diversity and equity in the outdoor industry. In her role she aims to foster an inclusive and supportive community. Email: afriday@wta.org Cassidy Giampetro (she/her) - Advocacy Manager Cassidy experienced a true calling to the mountains when she moved to Washington in 2017 from flat Miam'''
