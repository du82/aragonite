title = "Go Outside — Washington Trails Association"
full_description = "Go Outside Hitting the trail is more fun—and safer—if you have all the info you need first. Check out our information on trails and current conditions, as well as tips to get you started if you're new to hiking. Create a WTA account and download WTA Trailblazer, and you'll have everything you need to get outside safely right in your pocket. Browse trip reports or write your own, find hikes near you, even access hike information offline. Driving to the trailhead Thanks to Western Washington Honda Dealers for supporting our mission and for helping so many hikers over the years reach the trailhead safely. Learn more about their Drive Good philosophy. Trailhead parking like a pro How to drive forest roads Winter car camping . Hiking Guide Search the most comprehensive database of hikes in Washington. Passes and Permits Passes and permits are a reality of hiking in Washington. We help you decode what you need. Hike Finder Map Explore trails across the state, and search for a trail near you. Ranger Station Info Get contact information for land managers and wilderness information centers. Trip Reports Search trip reports and learn about current (and past) trail conditions. Hiking by Season Washington state offers unparalleled four-season hiking opportunities. Take a look at our seasonal recommendations. TIPS & ADVICE Trail Smarts From etiquette to safety to leaving the trails better than you found them. Hiking with Kids Hiking with kids is a great way to make memories, connect to the natural world and get some fresh air. New to Hiking? We'll help you get started hiking, backpacking or camping. On TRAIL with WTA Volunteer Join a work party for a fun and rewarding way to give back to the places you love to hike. Outdoor Leadership Training Workshops, gear and grants to empower teachers and youth groups with the skills and resources they need to lead safe and fun outdoor experiences."
