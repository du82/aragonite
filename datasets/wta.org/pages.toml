title = "Frequently Asked Questions about Trail Work Parties — Washington Trails Association"
description = "Common questions about WTA's volunteer trail work parties"
full_description = "Frequently Asked Questions about Trail Work Parties Common questions about WTA's volunteer trail work parties https://www.wta.org/get-involved/volunteer/questions https://www.wta.org/@@site-logo/wta-logo.png Frequently Asked Questions about Trail Work Parties Common questions about WTA's volunteer trail work parties other Ways to volunteer Volunteer vacations Backcountry response teams Youth vacations Packing facility work parties WTA crews welcome anyone interested in helping keep trails open, no matter your familiarity with trail work. But we know you might have a lot of questions when you're volunteering for your first time. See if we can answer them below. How much experience do I need? None. We work hard to teach our volunteers the joy of trail maintenance. We hope by investing our time in teaching you trail maintenance you'll come back and join us again. Our work party rules are followed in this order: 1) Be safe!2) Have fun! 3) Get some work done! Volunteering is a fun way to give back to trails, and you get a great sense of accomplishment. Photo from WTA archives. How do I sign up to volunteer? Use the tabs on the Find a Work Party page to search the list, map or calendar. The search filters on the left side of the screen (at the top on a mobile device) allow you to sort work parties by region, type or date. Click on any work party name to see details about what to expect. Use the Join Work Party button to complete the short registration form. You're all signed up! We add new work parties to the webpage 4-6 weeks in advance of their start date, so it's worth checking back regularly to find a work party that works for you! WHAT SHOULD I DO IF THE WORK PARTY I’M INTERESTED IN IS FULL? Join the waitlist. Folks often cancel their registrations and we are regularly able to invite those on the waitlist to join the work party. We monitor the work parties regularly and invite people to join from the waitlist up to a day prior to the event. If the waitlist is also full, please check out one of our other work parties. There are plenty to choose from and they are all great fun! May I arrive late? Leave early? We ask that you commit to the entire length of a work party when you sign up. They start promptly at 8:30 a.m. and end at 3:30 p.m. unless otherwise noted. We request this because after a short orientation at the trailhead in the morning, the crew hikes to the project, meaning you will be unable to meet the crew at the trailhead if you arrive late. Occasionally, we do have work parties that are shorter than the standard day, which may work better with your availability. What should I wear? What should I bring? All volunteers should wear sturdy, closed toe shoes, long pants and work gloves. For safety and comfort, we highly recommend sturdy work or hiking boots. If you don't have boots, you are required to wear a sturdy closed-toe shoe, as crew leaders will assign tasks based on the safety level of your footwear. Volunteers without sturdy closed-toe shoes or long pants will not be able to participate in the work party. We recommend that you wear a long-sleeve shirt and bring eye protection (such as glasses, sunglasses or safety glasses) too.If you're joining a work party that involved saw work, additional PPE is required to participate in using a saw: Long sleeves Long, loose-fitting pants (not athletic tights) Eye protection (glasses, sunglasses, or safety glasses with side shield) Sturdy boots that are mostly or fully leather Logout Boot Example Guide For all work parties, we also recommend bringing: Rain gear (including a pack cover or a large trash bag) Extra warm clothing Water Lunch and snacks in a pack WTA will provide you with a hard hat, tools, and other necessary PPE, but feel free to bring your own gloves and eye protection if you prefer. For winter work parties, check out these additional tips on how to dress and pack for colder weather. DO WE GET BREAKS? LUNCH? We have two official breaks, a morning candy break (candy provided by WTA!) and a mid-day lunch break. Please bring your own lunch, beverages and any additional snacks you need to keep you powered for a day of trail work. Additionally, we encourage all volunteers to take any additional breaks they need throughout the day and to work at a pace that suits them. WTA also provides candy to volunteers, which is crucial to keeping you moving throughout the day! Photo from Todd Dunfield. What is the bathroom Situation? The areas we work in often do not have flush toilets available nearby. If there is a toilet at the trailhead it may not necessarily have running water. At the project and at trailheads without toilet facilities, the crew relieves ourselves in the surrounding environment according to leave no trace guidelines. You'll want to have toilet paper and hand sanitizer with you. Do I need to pay for a parking permit? Nope! WTA will provide all volunteers with a day pass. In fact, you can even earn free passes by volunteering with us. Learn more about the benefits of volunteering. What is the latest date that I can sign up for a day work party? 48 hours. Each work party is automatically removed from the schedule 48 hours before the work party is scheduled to begin. This allows our crew leaders to have adequate time to pick up tools, purchase pop and cookies and prepare for the project based on the number of sign-ups at that time. If you would like to sign up for a work party within these 48 hours, please email us at volunteer@wta.org and we will determine if we can add another person to that particular work party. How do I sign the liability waiver? Your work party registration email includes a link to the annual waiver. You will also receive reminders with links prior to your work party date. The annual waiver needs to be completed yearly. Does WTA require proof of covid-19 vaccination? Guided by updated public health guidance, WTA will no longer require proof of COVID vaccination to attend our work parties or events as of April 15, 2023. We will continue to ask anyone who is sick or experiencing cold or flu symptoms to stay home out of respect for the health and wellness of our community. Who will I be volunteering with? We welcome volunteers from a broad range of backgrounds, and people often make friends with other crew members over the course of the day. Plus, our skilled crew leaders are first aid and CPR certified and have undergone leadership training to ensure you have a safe and fun day on trail with us. Are there any perks (incentives) for volunteering? Of course! On every work party, you'll enjoy the chance to meet new people and gain new skills. You can also earn free passes, community service hours and WTA milestone awards in appreciation for your dedication and hard work. Learn about the benefits of volunteering with WTA, and you can watch the video below to see what past volunteers have enjoyed most about their time on trail. Does WTA encourage or try to arrange carpooling? Yes! We have an automated online carpool system. When you join a work party you can opt into carpooling by indicating if you want to drive, ride, or are fine with either. Then you give a brief description of a convenient meeting point in the space provided (not in the comments section). This information will be sent to anyone who signs up for your trip, along with your email address so carpoolers can directly contact each other. Remember, if you are a rider, please be courteous and offer to chip in on the cost of gas! More tips for a great carpooling experience here. Can I bring my kids to a day work party? To participate in a WTA work party, youth must be age 10 or older. Each member of your party needs to be registered separately, including your child. Please print out an additional copy of the annual waiver; both youth and guardian should sign and bring to the trailhead on the day of the work party. If your kid likes it, there are WTA's youth programs you might look into. Do you still work in bad weather? Yes — we do work rain or shine! However, there are rare occasions when we will cancel a work party due to inclement weather. The most common weather cancellations are due to wind, snow/ice and lightning. Most determinations are made at the trailhead at the beginning of the day by the crew leader or on the trail as conditions change. You will be notified by email or phone in the rare event that we cancel a work party the night before due to a forecast of extreme weather. If weather conditions forecast for the work party are beyond your personal comfort level, you are free to cancel from the work party. WHat if I realize I can't make it to a work party? If you realize you won't be able to do a work party, please cancel so that another volunteer can have a chance to participate. Simply no-showing makes it harder for the crew to complete the project, since we customize our work based on how many volunteers we anticipate having. To cancel out of a work party, log into your My Backpack account, or use the cancellation link in the registration email you received. If neither option is available please email volunteer@wta.org to cancel your registration. WTA works year round -- we hope you'll join us out there! Photo from WTA archives. Can I bring my pets? Please do not bring any pets. We have found that pets can be a significant distraction and in some rare cases a safety hazard. Can I bring a big group? Yes. All participants must be individually registered. If your group is greater than six people we request that you submit a group work party request. DO You PROVIDE VOLUNTEER HOURS CONFIRMATION FOR YOUTH OR CORPORATE MATCH PROGRAMS? Yes, please email your requests to volunteer@wta.org. It can take approximately 1 week to process your request. Do you accept court-ordered community service? Usually. But you must confirm with your court that they accept WTA volunteer hours and tell us in advance of your work party so that we can help you appropriately track and confirm your hours for the court. When you sign up for your work party, indicate that you are fulfilling court-ordered hours and give the total amount of hours you wish to complete. The maximum amount of hours you can claim for a day work party is 8 hours. If you need a letter documenting your service, please complete your service hours and request the letter at least two weeks before your deadline. Please email your requests to volunteer@wta.org. We do not accept court-ordered hours for violent or aggressive offenses. Should I bring my own tools? No. WTA provides all the tools you need. The only tools you might consider bringing would be hand clippers or small folding saws. Please do NOT bring your own axes, machetes, etc. Our safety briefing at the beginning of each work party includes a comprehensive discussion of the safe usage of each tool. We cannot permit anyone to bring and use a tool not covered in our safety lecture. I'M NOT A CERTIFIED SAWYER, CAN I JOIN LOGOUTS? Yes, we’d love to have you saw with us on trail! We’ll have certified sawyers on trail with you. Please note, however you will not be able to saw on your own or run and individual saw crew regardless of your certification. To do these things at WTA, we require you to be one of our assistant crew leaders (ACLs). To participate in using a saw at a work party we require additional PPE. You’ll need long sleeves, long loose pants (not athletic tights), safety glasses or side shields, and a sturdy pair of mostly leather or all-leather boots. For more details on boot requirements check out our Logout Boot Example Guide. If you find you love saw work, continuing to join logouts and practicing with the saw team is the best way to continue your learning journey and earn your USFS Sawyer Certification with WTA. I'M A CERTIFIED SAWYER, BUT I WAS CERTIFIED OUTSIDE OF WTA, CAN I JOIN YOUR LOGOUTS? Yes, we’d love to have you saw with us on trail. Please note, however, that you will not be able to saw on your own or run an individual saw crew regardless of your certification. To do these things at WTA, we require you to be one of our assistant crew leaders (ACLs). Check here to find more information on our ACL Pathway. Can I bring my chainsaw? No. A special certification is required from land management agencies before anyone is allowed to use a chainsaw on their land. Any logging out or felling of trees with a chainsaw will be taken care of by WTA staff or the land manager's hired personnel. What is WTA's policy on firearms and weapons? Volunteers are not allowed to bring firearms or weapons on a work party (regardless of whether they are licensed to carry a concealed weapon). What else do I need to I know? For questions specific to backcountry trips, check out our pages about volunteer vacations, backcountry response teams or youth volunteer vacations. We also have packing facility work parties, which support the backcountry trips. If you have a question that we haven’t answered, please contact us at volunteer@wta.org or 206.625.1367. Annual Northwest Forest Pass incentive I have earned two (green) one-day passes. How do I exchange them for an annual pass? When you come out on a WTA work party that is on Forest Service land (indicated in the schedule under the column titled “Free Pass”), the Forest Service recognizes your efforts by giving you a free one-day recreation pass. A WTA crew leader will give you this pass at the beginning of the work party. When you collect two of these green day passes, you can mail them to WTA and we will mail you one Annual Northwest Forest Pass. Please send your two green day passes and a self-addressed stamped envelope to: Washington Trails Association, 705 2nd Ave Suite 300, Seattle, WA 98104. Each volunteer can receive a maximum of one annual pass per year. Annual Discover Pass incentive I have received vouchers for 24 hours worked on state lands. How do I exchange them for an annual pass? To learn how you can exchange your vouchers for an annual pass (as well as exclusions), visit the Discover Pass website. The intent of the program is for volunteers to receive a maximum of one pass per year."
