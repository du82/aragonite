title = "Kettle Crest South — Washington Trails Association"
description = "The Kettle Crest South begins at the White Mountain Trailhead and extends to Sherman Pass, passing by White Mountain, Barnaby Butte, Bald Mountain, Snow Peak, and Sherman Peak along the way."
full_description = '''Kettle Crest South The Kettle Crest South begins at the White Mountain Trailhead and extends to Sherman Pass, passing by White Mountain, Barnaby Butte, Bald Mountain, Snow Peak, and Sherman Peak along the way. https://www.wta.org/go-hiking/hikes/kettle-crest-south https://www.wta.org/site_images/hikes/kettle-crest-south-photo-by-jens.jpeg/@@download/image/kettleCrest.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/kettle-crest-south", "name": "Kettle Crest South", "description": "The Kettle Crest South begins at the White Mountain Trailhead and extends to Sherman Pass, passing by White Mountain, Barnaby Butte, Bald Mountain, Snow Peak, and Sherman Peak along the way.", "url": "https://www.wta.org/go-hiking/hikes/kettle-crest-south", "image": "https://www.wta.org/go-hiking/hikes/kettle-crest-south/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 35, "ratingValue": 3.6, "ratingCount": 10, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 48.5011659996, "longitude": -118.421158791}} Kettle Crest South Eastern Washington > Okanogan Highlands/Kettle River Range 48.5012, -118.4212 Map & Directions Length 5.0 miles, roundtrip Elevation Gain 900 feet Highest Point 6,500 feet Calculated Difficulty About Calculated Difficulty Moderate Sunset over Bald Mountain and Edds Mountain, looking south on the Kettle Crest. Photo by Holly Weiller. Full-size image Dogs allowed on leash Mountain views Wildflowers/Meadows Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack The Kettle Crest South begins at the White Mountain Trailhead and extends to Sherman Pass, passing by White Mountain, Barnaby Butte, Bald Mountain, Snow Peak, and Sherman Peak along the way. Continue reading Rating 3.60 out of 5 (10 votes) Log in to rate 35 trip reports for this trail Write a trip report Hiking Kettle Crest South The southern section of the 43-mile Kettle Crest National Recreation Trail begins on the White Mountain Trailhead and extends to Sherman Pass, passing by White Mountain, Barnaby Butte, Bald Mountain, Snow Peak, and Sherman Peak, and ambling through snags left from a 1988 forest fire. The trail is complemented with a segment that forms the delightful 5.3-mile loop trip around Sherman Peak. Wildlife is abundant, including deer, coyotes, grouse, black bears, and songbirds, with signs of the elusive lynx. Listen for the shrill whistle of the varied thrush in the timber and the squeaks of pikas in the talus slopes. The Washington Department of Fish and Wildlife manages this region as a trophy mule deer area, which means it has a high ratio of mature bucks with antlers - four points or better on each side. WTA worked here in 2010! Kettle Crest South Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-118.421158791, 48.5011659996], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "kettle-crest-south"}, containerId = "map", hike = {"trailhead": [-118.421158791, 48.5011659996], "id": "kettle-crest-south", "title": "Kettle Crest South", "thumbnail": "https://www.wta.org/go-hiking/hikes/kettle-crest-south/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 48.5012, -118.4212 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There Directions to the Southern Trailhead: From Colville, take Hwy 20 west for about 23 miles, then turn left onto South Fork Sherman Creek Road for 6.5 miles. Take a slight left onto Barnaby Creek Road/NF-2014 for 0.5 miles. Then take a slight right to stay on Barnaby Creek Road for another 3.6 miles, then a slight right onto White Mountain Road for 4.3 miles until you arrive at the trailhead on the right. Print Email More Hike Details Trailhead Eastern Washington > Okanogan Highlands/Kettle River Range Kettle Crest South (#13) Colville National Forest, Three Rivers Ranger District Guidebooks & Maps USGS: Sherman Peak Learn Right-of-Way On Trail Learn Practice Leave No Trace on Trail and in Camp You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js