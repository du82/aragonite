title = "Muddy Meadows/Foggy Flat — Washington Trails Association"
description = "This forested trail leads to a fine campsite primed for exploring the base of Mount Adams."
full_description = '''Muddy Meadows/Foggy Flat This forested trail leads to a fine campsite primed for exploring the base of Mount Adams. https://www.wta.org/go-hiking/hikes/muddy-meadows https://www.wta.org/site_images/hikes/muddy-meadows.jpeg/@@download/image/muddyMeadows.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/muddy-meadows", "name": "Muddy Meadows/Foggy Flat", "description": "This forested trail leads to a fine campsite primed for exploring the base of Mount Adams.", "url": "https://www.wta.org/go-hiking/hikes/muddy-meadows", "image": "https://www.wta.org/go-hiking/hikes/muddy-meadows/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 37, "ratingValue": 3.1, "ratingCount": 7, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 46.3083667044, "longitude": -121.540081503}} Muddy Meadows/Foggy Flat South Cascades > Mount Adams Area 46.3084, -121.5401 Map & Directions Length 11.6 miles, roundtrip Elevation Gain 1,710 feet Calculated Difficulty About Calculated Difficulty Hard Wide open mountain views on the Muddy Meadows trail. Photo by gmiles. Full-size image Dogs allowed on leash Good for kids Mountain views Wildflowers/Meadows Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack This forested trail leads to a fine campsite primed for exploring the base of Mount Adams. Continue reading Rating 3.14 out of 5 (7 votes) Log in to rate 37 trip reports for this trail Write a trip report Hiking Muddy Meadows/Foggy Flat Even before you start your hike, you’ll find fantastic vistas of Mount Adams, as well as elk and deer grazing on sweet grasses at the trailhead. But this is only a foreshadowing of what is to come.As soon as you set out on trail 13, you’ll duck into sparse conifers as you enter the Mount Adams Wilderness. A wooden bridge traverses some wetlands just 0.3 miles from the trailhead and gives you a few last views into Muddy Meadows before it delivers you back to the Douglas firs and lodgepole pines. Cross another two bridges followed by several gentle switchbacks determined to get you higher into the hills.At 2.9 miles, arrive at a large trail junction with the Pacific Crest Trail. Cross the PCT and continue on the Muddy Meadows Trail as it slides back into the forest. The signs in this direction point to trail 114 (Highline Trail), which is where you are eventually headed. About 1.3 miles beyond the PCT, the trail crosses over a small meadow and the trees become sparse. Just beyond, to the trail’s left (east), is Muddy Fork Creek and an old camp spot.A bit further, arrive at a large meadow and a very confusing trail junction. Turn onto the trail 114 that goes to the left (east) rather than the section that goes straight ahead. Follow the gently rolling grade as it alternates between timber and open lands. In 1 mile from the junction with the Highline Trail, arrive at Foggy Flat, a rather large flat meadow with a good view of the north flanks of Mount Adams. A pretty little trailside camp makes a great place to put up a tent and explore the base of Mount Adams. WTA worked here in 2022, 2021 and 2019! Hike Description Written by Tami Asars, WTA Correspondent Muddy Meadows/Foggy Flat Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-121.540081503, 46.3083667044], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "muddy-meadows"}, containerId = "map", hike = {"trailhead": [-121.540081503, 46.3083667044], "id": "muddy-meadows", "title": "Muddy Meadows/Foggy Flat", "thumbnail": "https://www.wta.org/go-hiking/hikes/muddy-meadows/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 46.3084, -121.5401 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From Randle, drive south on Highway 131 and bear left in 0.9 miles to merge onto FR 23. At 18.4 miles from Randle, go left on FR 21. Turn right on FR 5601 (near Adams Fork). Keep left at a small fork on FR 56 (marked Keenes Horse Camp). At 25.9 miles, go right towards an unmarked road (FR 5603 signed Horseshoe Lake). At 31.1 miles turn right on FR 2329 and at 33.2 miles turn left towards Muddy Meadows on FR 085. At 33.3 miles stay left at the road’s fork. Find the trailhead at the road’s end, 33.6 miles from Randle. No pass required. Print Email More Hike Details Trailhead South Cascades > Mount Adams Area Muddy Meadows (#13) Gifford Pinchot National Forest, Mount Adams Ranger District Guidebooks & Maps Green Trails Mount Adams 367S Learn Angry Mountain: One trail's role in a sustainable system Learn Patience and Pragmatism: How One Man's Approach to Work Shaped Lives, Trails and WTA You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
