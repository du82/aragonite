title = "Your Donation Powers Our Work — Washington Trails Association"
full_description = "Your Donation Powers Our Work Together, we are mobilizing hikers and everyone who loves the outdoors to explore, steward and champion Washington's trails and public lands. If you have questions, please contact our membership team at membership@wta.org. As a member of Washington Trails Association: Your voice will be heard on important issues impacting Washington's trails. Your dollars will be put to work ensuring we have trails for everyone, forever. You will be invited to WTA community events. You will receive a subscription to Washington Trails magazine and Trail News e-newsletter, discounts on WTA volunteer vacations, and a WTA member window decal. Members who give $20 or more will receive physical copies of the WTA magazine and calendar, while those who give less than $20 will receive a Tree Free (virtual) copy. Learn more about Membership. Make a Donation or Renew your Membership WTA is powered by generous donations from donating members. Start a new membership by making your first donation, or recommit your support by renewing your membership. Monthly Giving Learn more about ongoing, sustainable giving that supports trails year-round. Fireside and Leadership Circle Join a dedicated group of hikers who provide essential funding for WTA. Legacy Circle Plan your legacy for trails by including WTA in your estate plans. Other Ways to Give ﻿Gift MembershipsGive your friends and loved ones the gift of a WTA membership. Stock DonationsLearn more about gifts in the form of stocks, bonds and mutual funds. Greg Ball Trail Fund and EndowmentsLearn more about making a donation through a designated fund. ﻿Fundraise for WTA Set up a fundraiser for your birthday, wedding or any event to support trails. Honor a Fellow Hiker Give a memorial or honorary gift for the hiker in your life. ﻿Workplace GivingPayroll deductions make supporting trails easy. Vehicle Donations Turn your old vehicle into a way to help hiking trails by donating it to WTA. Corporate Opportunities Corporate Sponsorship Learn more about how your business can sponsor WTA. Corporate Partners Learn more about the partners that help make our work possible. Questions? Please contact (206) 625-1367 or membership@wta.org. TAX ID NUMBER Washington Trails Association's tax identification number is 91-0900134. Donate by check Make your check out to Washington Trails Association and mail to: 705 Second Ave, Suite 300, Seattle WA 98104 By the Numbers Check out our annual report or financial information."
