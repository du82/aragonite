rs have designated it accessible. This designation is made when trails are under optimal maintenance conditions, so seasonal changes or deferred maintenance may change how wheelchair-friendly a trail is. Indicating a trail is wheelchair-friendly does not mean it meets ADA standards. Hikes w/o Recent Trip Reports Filter for hikes that haven't seen a trip report in a while. Choose a time frame Last trip report 30-90 days ago Last trip report 90+ days ago Companions Dogs allowed on leash Dogs not allowed Kid friendly Rating No minimum At least 1 stars At least 2 stars At least 3 stars At least 4 stars At least 5 stars Parking Pass / Entry Fee Required Passes None Discover Pass National Park Pass Northwest Forest Pass Interagency Pass Oregon State Parks Day-Use Sno-Parks Permit Mileage & Elevation Include hikes with incomplete info Mileage Range Elevation Gain (ft) High Point (ft) Max elevation - numbers only var _open_fieldsets = []; jQuery(function () { require(['slider'], function (nouislider) { document.getElementById('mileage').noUiSlider.on('update', function(values, handle) { if (+values[0] !== 0) { $('input#show_no_mileage').prop('disabled', true); $('label[for="show_no_mileage"]').addClass('disabled'); } else { $('input#show_no_mileage').prop('disabled', false); $('label[for="show_no_mileage"]').removeClass('disabled'); } }); }); for (var i = 0; i < _open_fieldsets.length; i++) { var fset = _open_fieldsets[i]; $('#' + fset + '-toggle').prop('checked', true); } }); Keyword Search Keyword Search Full text search of the trail description Results Order Sort By Most recently updated Rating (best at top) Difficulty (easiest at top) Distance (shortest at top) Elevation gain (least at top) Maximum elevation (lowest at top) Hike name (A-Z) Clear form Results List 4131 Hikes 1 2 3 ... 138 Next 30 items Little Mashel Falls - Pack Forest Puget Sound and Islands > Seattle-Tacoma Area Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 5.0 miles, roundtrip Elevation Gain 500 feet Highest Point 1,100 feet Rating Average rating: 3.94 (36 votes) Good for kids Old growth Rivers Waterfalls Wildlife Three waterfalls, multiple viewing areas, and two different trailheads provide great choices for an excursion to Little Mashel Falls. The tallest waterfall plunges over 90 feet. Rattlesnake Ledge Snoqualmie Region > North Bend Area Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 4.0 miles, roundtrip Elevation Gain 1,160 feet Highest Point 2,078 feet Rating Average rating: 4.07 (418 votes) Dogs allowed on leash Good for kids Lakes Mountain views Ridges/passes Summits Wildflowers/Meadows The trail will be closed intermittently through the end of March. This is a fine hike on a well maintained, albeit busy trail through a cool forest with views of the Cedar River watershed, Mount Si, Mount Washington, Rattlesnake Lake and Chester Morse Lake. Elliott Bay Trail Puget Sound and Islands > Seattle-Tacoma Area Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 10.0 miles, roundtrip Elevation Gain 350 feet Highest Point 65 feet Rating Average rating: 4.00 (4 votes) Coast Dogs allowed on leash Good for kids The Elliott Bay Trail follows the shoreline of Elliott Bay for 5 miles from S Royal Brougham Way near CenturyLink and SafeCo Fields to Smith Cove Park in Magnolia. Big Tree Trail Olympic Peninsula > Kitsap Peninsula Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 1.5 miles, roundtrip Elevation Gain 200 feet Highest Point 400 feet Rating Average rating: 4.14 (7 votes) Dogs not allowed Good for kids Old growth This sweet little trail on the Kitsap Peninsula makes a wonderful winter hike when the high country is snowed in. Hobart - Middle Tiger Railroad Trail Issaquah Alps > Tiger Mountain Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 10.2 miles, roundtrip Elevation Gain 1,550 feet Highest Point 2,180 feet Rating Average rating: 3.50 (4 votes) Dogs allowed on leash Fall foliage Good for kids Mountain views Wildflowers/Meadows Wildlife Hike the routes of two former logging railroads (the Iverson and the Hobart - Middle Tiger) to reach a remote section of Fifteenmile Creek. Follow a short, steep trail to connect with the Tiger Mountain Trail (TMT.) Return via the TMT and, on the way, look in on the site of a 1925 logging train wreck. West Fork Buttermilk North Cascades > Methow/Sawtooth Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 15.0 miles, roundtrip Elevation Gain 3,615 feet Highest Point 7,480 feet Rating Average rating: 3.25 (4 votes) Dogs allowed on leash Established campsites Fall foliage Mountain views Rivers Hike this 7.4 mile forested trail in the Lake Chelan-Sawtooth Wilderness. You'll wander among gorgeous stands of ponderosa pines and larches, reaching 7,480 feet at Fish Creek Pass. Wild Horses Monument Central Washington > Yakima Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 0.4 miles, roundtrip Elevation Gain 150 feet Highest Point 1,300 feet Rating Average rating: 2.33 (6 votes) Rivers Wildflowers/Meadows Witness up close one of the most frequently viewed public artworks in the state of Washington, while admiring a broad view of the Columbia River and the tiny hamlet of Vantage. Kettle Crest South Eastern Washington > Okanogan Highlands/Kettle River Range Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 5.0 miles, roundtrip Elevation Gain 900 feet Highest Point 6,500 feet Rating Average rating: 3.60 (10 votes) Dogs allowed on leash Mountain views Wildflowers/Meadows The Kettle Crest South begins at the White Mountain Trailhead and extends to Sherman Pass, passing by White Mountain, Barnaby Butte, Bald Mountain, Snow Peak, and Sherman Peak along the way. Happy Creek Nature Trail North Cascades > North Cascades Highway - Hwy 20 Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 2.6 miles, roundtrip Elevation Gain 570 feet Highest Point 2,780 feet Rating Average rating: 3.86 (7 votes) Good for kids Old growth Rivers Waterfalls Hikers can choose from an easy loop partially along Happy Creek, or a longer hike to Happy Creek Falls, site of an old sawmill that supported the mining in the late 1800's. Obstruction Pass State Park Puget Sound and Islands > San Juan Islands Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 1.9 miles, roundtrip Elevation Gain 305 feet Highest Point 225 feet Rating Average rating: 3.40 (10 votes) Coast Dogs allowed on leash Established campsites Good for kids Old growth Wildlife Moran State Park might have mountains and lakes, but Obstruction Pass has quiet, open forest, secluded campgrounds, and the largest public beach on Orcas Island. Take a quiet walk here and soak in the peaceful shoreline. Falls Creek Falls North Cascades > Methow/Sawtooth Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 2.6 miles, roundtrip Elevation Gain 750 feet Highest Point 2,920 feet Rating Average rating: 3.50 (10 votes) Dogs allowed on leash Good for kids Waterfalls Wildlife Explore an easy, gently graded trail to Falls Creek Falls just outside of Winthrop. The first waterfall is just a quarter-mile from the trailhead and is accessible via a paved trail. Meadowlark Natural Area North Cascades > Methow/Sawtooth Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 2.5 miles, roundtrip Elevation Gain 300 feet Highest Point 2,150 feet Rating Average rating: 4.00 (1 vote) Good for kids Mountain views Wildflowers/Meadows Meadowlark Natural Area is closed during the month of March to give the mule deer and other animals a chance to enjoy the early spring green up. Take a stroll on the sunny, warm slopes of Studhorse Mountain just outside of Winthrop. This hike is usually among the first to melt out and bloom in the spring, providing much needed forage for the mule deer population. An easy 2.5 mile loop gives great views of the Sawtooth/Chelan Wilderness and Winthrop’s downtown is at your feet. Snow Lake Snoqualmie Region > Snoqualmie Pass Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 7.2 miles, roundtrip Elevation Gain 1,800 feet Highest Point 4,400 feet Rating Average rating: 4.22 (219 votes) Dogs allowed on leash Established campsites Good for kids Lakes Mountain views Old growth Ridges/passes Waterfalls A relatively short and easy hike within a stone’s throw of Seattle, Snow Lake delivers splendorous alpine scenery – crystal clear waters, towering peaks – at a mere pittance of sweat and toil. Just don’t expect to have the trail to yourself – Snow Lake is Washington's most heavily-used trail in a wilderness area! Snow Lake - Winter Snoqualmie Region > Snoqualmie Pass Add Hike to My Backpack Hike in My Backpack. Remove Hike Length 10.0 miles, roundtrip Elevation Gain 2,000 feet Highest Point 5,100 feet Rating Average rating: 4.25 (4 votes) Established campsites Lakes Mountain views Ridges/passes Multiple avalanche chutes cross this trail. Hikers should have experience navigatin'''
