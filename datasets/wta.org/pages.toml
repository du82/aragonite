title = "Take Action — Washington Trails Association"
description = "Trails and public lands face big challenges, from increasing demand to chronic underfunding. Washington Trails Association will connect you with opportunities to speak up and help trails.Trails and public lands face big challenges, from increasing demand to chronic underfunding. Whether it's your local park or our iconic national parks, Washington Trails Association will connect you with opportunities to make a difference and help trails.Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.Join us in building trails for everyone, forever.Washington Trails Association has a long history of bringing hikers together to protect the places we love. WTA weighs in on issues and policy that impact hikers — from trail funding to wilderness protection to trail system planning. We advocate for hikers and trails at every level — in Washington, D.C., in halls of the state Capitol in Olympia and in your hometown.  We believe that getting outdoors can inspire hikers to to advocate for Washington’s treasured public lands for years to come."
full_description = "Take Action Join us in building trails for everyone, forever. Washington Trails Association has a long history of bringing hikers together to protect the places we love. WTA weighs in on issues and policy that impact hikers — from trail funding to wilderness protection to trail system planning. We advocate for hikers and trails at every level — in Washington, D.C., in halls of the state Capitol in Olympia and in your hometown. We believe that getting outdoors can inspire hikers to advocate for Washington’s treasured public lands for years to come. Action Center Find the latest ways to get involved with our work. Get action alerts Stay in the loop by joining our advocate community of over 65,000 and sign up for Trail Action Network today! Advocacy in the NewsRead the latest updates from our blog. Our PRIORITIES ﻿ Increasing funding for public lands; protecting places from wildlands to parks. ﻿ Promoting public transit to trails; investing in roads to trailheads; removing barriers for youth and historically marginalized communities to get outside. ﻿ Working with communities and partners to build trail systems for sustainable recreation; empowering individuals to become champions for trails. We need staff at our national parks and forests On February 13, the Trump Administration began the termination of approximately 1,000 National Park Service and 3,400 United States Forest Service employees. This move is short-sighted, unsustainable and leaves our public lands unsafe and underresourced as outdoor recreation continues to grow in popularity. Email your members of Congress today to ask that they reverse this decision and ensure the United States Forest Service and National Park Service have the staffing and funding support they need to serve the people who are out experiencing our public lands. Your message will mean even more if you add a personal note about an outdoor place you love and why it's important to you. Learn more about what this means for public lands, trails and communities. Photo by Dawn Rorvik."
