full_description = '''Our Volunteer Leadership Team Information landing page for ACL community. Access to meet the community, ACL applications, and job description https://www.wta.org/get-involved/volunteer/ways-to-volunteer/leadership https://www.wta.org/@@site-logo/wta-logo.png Our Volunteer Leadership Team Information landing page for ACL community. Access to meet the community, ACL applications, and job description Washington Trails Association's volunteer leaders empower others to make a difference for trails, and help make every work party a safe, fun, inclusive and rewarding experience for everyone. By educating and inspiring new volunteers, WTA's on-trail leaders ensure the continued success of WTA’s mission. Our volunteer leaders consist of Crew Leaders and Assistant Crew Leaders (ACLs). To help our volunteer leaders succeed, WTA provides trainings in leadership, trail maintenance, risk management, and offers ongoing support. Southwest Regional Manager Ryan Ojerio leads a group of volunteers during a trip to Volcano View. Photo by Karen Wang. Learn More Meet WTA's crew leaders ACL Position Description ACL Pathway Volunteer Q&A Words of wisdom from a long time volunteer Volunteer Rock Wall of Fame You can create the same experience for future volunteers by becoming an ACL. If you are committed to WTA's mission, have a desire to inspire and support other volunteers, committed to creating an inclusive work party experience and last but not least have a foundational knowledge in technical trial maintenance skills we encourage you to apply! What makes being an ACL a rewarding experience? Inspire Others This is your chance to share your expertise and skills, and inspire others. Just as someone showed you the way as you were learning, this is your chance to be that person for other crew members. Build outdoor leadership and trail skills For those of you interested in building outdoor leadership experience or just want to take your volunteering to the next level, as an ACL we offer you wilderness medicine certification as well as leadership and technical trainings throughout the year. Additionally each spring WTA hosts Crew Leader College, an annual training weekend where volunteers travel from across the state to gather together and improve their skills. Outdoor industry experience If you are interested in pursuing a career in the outdoors, this is a great way to gain experience and receive support in your professional development. Community As an ACL you'll be part of the regional volunteer leadership team and will be included in roundtable discussions. You'll also be key to identifying and mentoring future volunteer leaders. Gear Deals You'll get access to top outdoor brands with pro deal discounts. How do I become an Assistant Crew Leader? Great question! Read through the ACL Position Description, Making of a WTA Volunteer ACL and ACL Pathway Q&A. Talk to your regional team, crew leaders, and assistant crew leaders about your interest in becoming an ACL. With the support of your crew leaders and other ACLs, try leading a tool talk and practice teaching basic trail maintenance skills to newer green hats during your work parties. Request feedback from the volunteer leaders you work with and continue to create positive, welcoming relationships with other volunteers. Once you've done the above, follow the steps below to apply. 1 apply Reach out to two potential references (WTA volunteer leaders or staff) to discuss your readiness to be an ACL. Confirm they will be a reference for you. Fill out our ACL Interest Form. Once you've completed the interest forms we will contact your references before making the decision to move onto the readiness check. 2 Readiness Check This is an opportunity for your regional team to check your readiness to be an ACL. At this stage we're hoping to understand your technical skills, ability to teach and leadership skills. 3 Self-led onboarding These are activities to set you up for success in your new role including self-led training, ACL Basics, and completing your wilderness medicine certification. Your ACL Basics training will take approximately 1.5 hours to complete and your wilderness medicine certification timing is course dependent. 4 Regional onboarding meeting Meet with your regional team to cover any questions about the role, training and learn about regional ways of working. At this meeting you'll be awarded your orange hat! 5 training In role Within the first 6 months after you have completed onboarding, you are required to complete the next level of leadership and emergency response training. These classes will be available quarterly. 2025 Timeline There will be multiple opportunities to apply per year, with a general cadence of one application cycle per quarter. We encourage you to apply when its right for you. We ask that you be available for an in-person or virtual connect for your readiness assessment and onboarding meeting during the timeframes provided below. Please select an application cycle that matches both your readiness and availability. In 2025, applications will be accepted during the following dates: Winter 2025 Interest Form Submissions: December 1 - December 22, 2024 Readiness Checks: January 8 - January 21, 2025 Onboarding Meetings: February 16 - February 28, 2025 Spring 2025 Interest Form Submissions: March 1 - March 22, 2025 Readiness Checks: April 1 - April 12, 2025 Onboarding Meetings: May 25 - June 7, 2025 Summer 2025 Interest Form Submissions: June 8 - June 30, 2025 Readiness Checks: July 6 - July 19, 2025 Onboarding Meetings: August 17 - August 30, 2025 Fall 2025 Interest Form Submissions: September 1 - September 21, 2025 Readiness Checks: September 28 - October 11, 2025 Onboarding Meetings: November 9 - November 22, 2025 have general questions? We have resources. For general ACL application questions and suggestions, please feel free to email us at volunteer@wta.org. who is my regional team and how do I contact them? Please contact the region you tend to work in the most. Our “regional team” generally means our regional manager and coordinator(s) for a given region. NorthwestRegional Manager |Arlen Bogaards| arlen@wta.orgRegional Coordinator |Justine Nishitani| jnishitani@wta.org SouthwestRegional Manager | Ryan Ojerio| ryan@wta.orgRegional Coordinator | Stasia Honnold | shonnold@wta.org Central and EasternTrail Programs Senior Manager | Janée Romesberg | jromesberg@wta.orgEastern Washington Regional Coordinator | Holly Weiler | hweiler@wta.org Olympics and South Puget SoundOlympics and South Puget Sound Field Manager | Jeremy "Jay" Tarife | jeremy@wta.orgSouth Puget Sound Trails Coordinator | Barbara Molina | bmolina@wta.orgOlympics Coordinator | Paul Boronow | pboronow@wta.org North and Central Puget SoundPuget Sound Field Manager | Joe Olbrych | jolbrych@wta.orgNorth Puget Sound Trails Coordinator | Brandon Tigner| brandon@wta.orgCentral Puget Sound Trails Coordinator | Emily Snyder | esnyder@wta.org'''
