["https://www.wta.org/our-work/trails-rebooted"]
title = "Trails Rebooted — Washington Trails Association"
description = "Our Trails Rebooted campaign is finding solutions to support our popular recreation areas by improving existing trails, championing the construction of new ones and helping hikers see the role they play in the future of trails."
full_description = "Our Trails Rebooted campaign is finding solutions to support our popular recreation areas by improving existing trails, championing the construction of new ones and helping hikers see the role they play in the future of trails. We believe the hiking community can be the change they want to see on trail, so we’re channeling your passion for hiking to reimagine what’s possible for iconic trails and investing in the trail system of tomorrow. Our Work ﻿ ﻿ Hikers Helping Hikers A big part of our work hinges on hikers seeing themselves as stewards of the lands they recreate on. Whether that's sharing responsible recreation tips at a trailhead table, helping your friends get outside safely or simply taking a trash bag with them on their next hike to clean up the trail, we love to see it. How Trail Smart are you? Building the Trail System of Tomorrow To meet the need of the many people learning to love Washington's trails, WTA is working with partners to build more, and more sustainable trails statewide, from Spokane to the Columbia River Gorge; from the North Cascades to the mountains a short drive from Puget Sound. Some parts of the state are getting special focus due to their potential for future visitation. See where we're working near you, and what we've accomplished there so far. Activating Volunteers﻿Volunteerism is core to WTA's work. More than 75% of our trail work goes towards Trails Rebooted routes.78% of our hiking guide content includes hikes written by volunteers correspondents. And our outreach and advocacy efforts are partially driven by volunteer ambassadors; people just like you who care about showing up for trails.See how WTA volunteers have improved your hiking experience, and how you can tap in, too!﻿ Stories From the Field Great American Outdoors Act improves popular trails (roads, bathrooms and more) For four years, the Great American Outdoors Act (GAOA) — a federal bill that became law on August 4, 2020 — has been funding major improvements to some of our state’s most popular trails. But it's about to expire. More Angry Mountain: One trail's role in a sustainable system Trails need routine maintenance and trail systems need innovative, intentional updates to accommodate the changing needs of Washington's hikers. The Gifford Pinchot National Forest is taking proactive steps to make that happen | By Joseph Gonzalez and Anna Roth More Partnerships and Cooperation Expand Impact of WTA's work WTA has completed several fantastic projects thanks to partnerships with land managers. Between weekend work parties, land manager trainings in exchange for rent and new trails, we're excited to share some updates with you. More Interactive Storymap: Trails Rebooted projects across Washington Scroll through to see the ways we've updated WTA's trail system since starting the Trails Rebooted campaign in 2019. Take Action Join Trails Rebooted and help us upgrade our trail system. ﻿ ﻿ ﻿"
