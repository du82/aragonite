full_description = "Financial Information As a not-for-profit, 501(c)(3) organization, Washington Trails Association makes the best use of every dollar donated. Explore our annual report and financial statements, and see how your investment in our work goes to protect and maintain Washington's trails. https://www.wta.org/our-work/about/financials https://www.wta.org/@@site-logo/wta-logo.png Financial Information As a not-for-profit, 501(c)(3) organization, Washington Trails Association makes the best use of every dollar donated. Explore our annual report and financial statements, and see how your investment in our work goes to protect and maintain Washington's trails. Washington Trails Association is a not-for-profit, 501(c)(3) organization, and your contributions are tax deductible to the extent of the law. We are focused on making the best use of every dollar donated to the WTA mission. Read about what we've been able to accomplish with your contributions. You can give with confidence knowing that Charity Navigator, one of the nation’s leading charity evaluators, has awarded WTA its highest four-star rating for financial health and for our commitment to accountability and transparency. Annual Report Read our 2023 Annual Report Financial Statements and Documents 2023 Audited Financial Statements 2023 IRS Form 990 Tax ID Number Washington Trails Association's tax identification number is 91-0900134. Additional Information WTA Process for Determining CEO Compensation Questions? Please give us a ring at (206) 625-1367 or reach out to our membership department at membership@wta.org."
