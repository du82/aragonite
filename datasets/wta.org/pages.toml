title = "Sultan River Canyon Trail — Washington Trails Association"
description = "If you don’t mind descending first, then ascending later, the Sultan River Canyon trail is a nice alternative for the shoulder season when snow is still too deep in the mountains. Drop to the sparkling Sultan River, then climb back up on nicely graded switchbacks in the shade."
full_description = '''Sultan River Canyon Trail If you don’t mind descending first, then ascending later, the Sultan River Canyon trail is a nice alternative for the shoulder season when snow is still too deep in the mountains. Drop to the sparkling Sultan River, then climb back up on nicely graded switchbacks in the shade. https://www.wta.org/go-hiking/hikes/sultan-river-canyon-trail https://www.wta.org/site_images/hikes/sultan-river.jpg/@@download/image/Sultan River.jpg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/sultan-river-canyon-trail", "name": "Sultan River Canyon Trail", "description": "If you don\u2019t mind descending first, then ascending later, the Sultan River Canyon trail is a nice alternative for the shoulder season when snow is still too deep in the mountains. Drop to the sparkling Sultan River, then climb back up on nicely graded switchbacks in the shade.", "url": "https://www.wta.org/go-hiking/hikes/sultan-river-canyon-trail", "image": "https://www.wta.org/go-hiking/hikes/sultan-river-canyon-trail/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 136, "ratingValue": 3.8, "ratingCount": 17, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 47.9724990893, "longitude": -121.680128574}} Sultan River Canyon Trail Central Cascades > Stevens Pass - West 47.9725, -121.6801 Map & Directions Length 4.0 miles, roundtrip Elevation Gain 900 feet Highest Point 1,700 feet Calculated Difficulty About Calculated Difficulty Moderate View of the Sultan River at the end of the Sultan River Trail. Photo by Ken Giesbers. Full-size image Dogs allowed on leash Good for kids Rivers Waterfalls Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack If you don’t mind descending first, then ascending later, the Sultan River Canyon trail is a nice alternative for the shoulder season when snow is still too deep in the mountains. Drop to the sparkling Sultan River, then climb back up on nicely graded switchbacks in the shade. Continue reading Rating 3.82 out of 5 (17 votes) Log in to rate 136 trip reports for this trail Write a trip report Hiking Sultan River Canyon Trail If you don’t mind descending first, then ascending later, the Sultan River Canyon trail is a nice alternative for the shoulder season when snow is still too deep in the mountains. Drop to the sparkling Sultan River, then climb back up on nicely graded switchbacks in the shade. From the Road 6122 trailhead, walk around the yellow gate on gravel road for one mile. You will gain 200 feet in elevation, but drop 100. At just over a mile, a garbage can and trailhead sign announce that your road walk is over. Go right at the sign and enter shady forest. The trail is well-built, wide and nicely graded. The alder and Douglas fir of the road walk are quickly replaced by moss-draped hemlock and Western redcedar. Follow nice tread down numerous switchbacks, often seeing two or three sections of trail steeply below you. At 1.5 miles total, you have dropped 350 feet. In times of water runoff, listen for a waterfall. Peek through the trees to your right to see water cascading down a near-vertical rocky face for a couple hundred feet. Continue down more switchbacks the final half mile, losing 200 feet more to arrive at the shore of the Sultan River. Enjoy the beauty of the river, which can take on a decidedly greenish cast. This part of the river is outside of the watershed, and therefore is open to swimming and wading. Just keep in mind the Caution sign at the trailhead: “Power Project water releases can cause sudden river surges without warning”. Save enough drinking water for the ascent back to the road. When you are ready, return the way you came, climbing a steep 570 feet in a scant mile, all in the shade. Then follow the road back the final mile to the trailhead. Hiking is open year-round, whenever the roads are driveable. Hike Description Written by Ken Giesbers, WTA Correspondent Sultan River Canyon Trail Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-121.680128574, 47.9724990893], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "sultan-river-canyon-trail"}, containerId = "map", hike = {"trailhead": [-121.680128574, 47.9724990893], "id": "sultan-river-canyon-trail", "title": "Sultan River Canyon Trail", "thumbnail": "https://www.wta.org/go-hiking/hikes/sultan-river-canyon-trail/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 47.9725, -121.6801 Open in Google Maps Before You Go Sign in at the registration kiosk at Olney Pass before arriving at the parking area. See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There East of Everett, follow Highway 2 to the town of Sultan. From the stout bridge over the Skykomish River, travel 1.1 miles to the first traffic signal east of town. At the signal, turn left on Sultan Basin Road. Travel 13.2 miles, first on pavement, then gravel. Stop at the Olney Pass kiosk to register and familiarize yourself with the rules and regulations. Registration is free but required, as you will be visiting Sultan Basin, which is Everett's public water supply.Recreation signs from here on can be confusing. Mileages are to destinations rather than trailheads. For example, just past the kiosk, a brown sign reads “Sultan River Canyon Trail (hike in) 2.4 miles”, with an arrow to the left. The 2.4 miles includes 1.5 miles of driving and 1 mile of hiking. Take the left road 1.5 miles to a yellow and white Caution sign above another brown sign. To the left is “6122 Road” (your trailhead), which has a sign indicating that you must park inside the gated area straight ahead: “Gateway Trailhead Parking”. Continue, passing inside one yellow gate but not two, to the parking area, which has room for 25-30 vehicles. Other than a couple of picnic tables, there are no amenities.NOTESThe checkboxes on the registration form are to gather data on people’s expected destinations, not where they will park. For the Sultan River Canyon Trail, check the box for “Sultan River below Culmback Dam”. If you also intend to visit the dam, check the box for “Culmback Dam”. You do not need to check the box for “Gateway”; that is for people whose destination is the picnic tables near the parking lot.A Discover Pass is required for parking at Olney Pass, but not at Gateway, which is Snohomish County PUD land. The PUD prefers that people restrict their visits to between dawn and dusk.The PUD web page may include a notice such as, “The outer gate at 116th street will be closed after hours due to vandalism”. This refers to the power plant off of 116th Street (a mere 2 miles from Highway 2), not the recreation areas. Print Email More Hike Details Trailhead Central Cascades > Stevens Pass - West Sultan River Canyon Trail (#1246) Snohomish County Public Utility District (PUD) Number 1 Guidebooks & Maps 75 Great Hikes Seattle (Melissa Ozbek; Moon Travel) Download a map to plan your hike Buy the Green Trails Index No. 142 map Learn How to Hike in Bear Country Learn How to Drive on Forest Roads You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
