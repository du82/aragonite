["https://www.wta.org/our-work/about/people/meet-wtas-crew-leaders"]
title = "WTA's Crew Leaders — Washington Trails Association"
description = "Meet your crew leaders."
full_description = '''WTA&#x27;s Crew Leaders Meet your crew leaders. https://www.wta.org/our-work/about/people https://www.wta.org/@@site-logo/wta-logo.png WTA's Crew Leaders Meet your crew leaders. WTA's experienced crew leaders represent our values of stewardship and volunteerism; cooperation and partnership, community and inclusion on trail. And they sure do like to have fun! The crew leader for your work party may be a WTA employee or volunteer, but there’s one thing every crew leader has in common: a love of trails and a passion for teaching others. Volunteers, staff and partners at WTA's Crew Leader College, hosted by the Snoqualmie Ranger District in North Bend. At this annual gathering, crew leaders attend and teach classes on trail building and maintenance. Photo by Anna Roth. WTA offers ongoing training to help crew leaders keep their trail skills up-to-date, maintain certification for Wilderness First Aid and CPR, and hone their leadership and risk management techniques. Be a leader Apply to become an ACL On your work party, you may hear other volunteers refer to the crew leader as the "blue hat," after the color of their hard hat. Crew members in orange hard hats are the assistant crew leaders. They're volunteers eager to pass on their love for building and maintaining trails to you. Bob Adler Bob joined his first work party in 1998. It was a rainy bust. But the importance of trails kept him coming back. Bob likes being a crew leader to pass on that experience and have fun doing it. He thinks volunteers are the 'salt of the earth' and have the best intentions to give their time to a most worthy cause. Bob is continuously learning from the people he works with about finding joy in one's life. As a Chicago boy, that was an enormous lesson to learn. Bob tries to pass on the joy with fun and smiles. James Alexander James was born on a big island in Asia and raised in Texas. He retired from the United States Army in 2020 from active duty service, and moved to Southwest Washington. His career has given him an opportunity to live in Europe, and all across the continental United States, taking full advantage of the military life while visiting 21 countries, and 28 states. James started volunteering with WTA in the fall of 2020 and was immediately hooked on maintaining trails, working with the friendly volunteers, and the culture of the organization. James encourages people from all walks of life to enjoy the outdoors, and wants to inspire those in the veteran community, and marginalized groups to use their individual strengths as volunteers. will ALLEN (They/Them) will's love for the outdoors was sparked during their childhood in rural Kentucky. They worked on trail crews in Oregon, California and Arizona before moving to Washington to teach at an outdoor school. They are passionate about queer community, making medicine, sit spots, bicycling, and dismantling the white supremacist cis-hetero capitalist patriarchy! They're a plant nerd who thinks that nurse logs are just the absolute coolest, so their favorite hikes meander through forests on their way to... anywhere, really! Email: rallen@wta.org JANE BAKER Jane adopted Spokane as home in 1984, migrating from the Midwest: "a great place to be from." During the week she is a physical therapist in an outpatient clinic. She got her first taste of trail work more than 20 years ago with the Sierra Club, with whom she did service trips in Idaho and Colorado. When word trickled down that there was an organization right here in Washington that specialized in volunteer trail work, she jumped right in, leading off with WTA Volunteer Vacations. These days you'll find Jane leading work parties on the Colville National Forest, where you have just as great a chance of running into a moose as a fellow hiker, and other locations in Eastern Washington. Karen Bean Karen moved here from Chicago in 2015 looking for adventure. Illinois was far too flat and had way too much corn. Being just over 5 feet in height, the mountains help her feel tall. Her first day volunteering with WTA had her on one side of a crosscut saw cutting a 3-foot diameter tree. She was hooked. Her work in museums for the last 15 years helped drive her quest for knowledge. When not hiking, biking, and backpacking she enjoys teaching and learning trail construction skills. Dirt and mud drew her to WTA and the amazing community of new friends kept her coming back. Michael Bellis Mike has a passion for wild places and the trails that take him there. His connection to nature began as a kid out hunting, fishing and turning over every rock in the local creek to inspect for critters. His love of the outdoors has only grown deeper with age and he always loves sharing what he has learned from many years of listening to the forest. Crew leading for WTA gives him a chance to get a deeper connection with the North Cascades and the wonderful community of people that he shares them with. When he isn’t working on trails you can find Mike kicking around the South Fork valley of Whatcom county on the lookout for a flush of edible mushrooms or sign of the wild creatures that share the valley. Rick Bennett Rick's early years were marked by adventurous hikes in the scenic White Mountains of New Hampshire. Following a move to Washington, he dedicated four decades to the management of construction equipment rental businesses while simultaneously exploring the picturesque mountains of the state. Upon retiring in 2019, Rick found a new passion in volunteering with WTA. His fulfillment comes from collaborating with and mentoring the dedicated individuals who contribute their time to WTA. Rick takes the lead in organizing day work parties and leading several BCRTs throughout each season. Carole Bianquis Carole moved to Seattle in 1995. That first summer she started solo hiking, starting with hikes in the Issaquah Alps, then venturing along I-90 and Mount Rainier. She acquired most of the ‘Best Hikes’ books to find more trails, kept hiking and discovered the WTA website. She started with the trail maintenance program in 2007 and has been hooked since then. It also helped her expand her hiking horizon to Mount Baker and the southern parts of Washington while supporting day crews or volunteer vacations. She enjoys the constant learning of new skills that trail maintenance brings and working with volunteers, teaching the whys and the hows of trail maintenance. Lisa Black Lisa grew up in Seattle with WTA's original newsletter Signpost fueling her youthful summer hiking. As an adult, she came back to WTA for the magazine and went on her first work party 14 years ago. Since then, she has worn green, orange and blue hats, and served eight years on WTA's board of directors. Teaching new folks about what it takes to maintain trails we love and getting them back to the trailhead safely is challenging, fun, and satisfying. Lisa also works toward strengthening WTA's presence in the south central part of the state around the Tri-Cities she now calls home. Arlen Bogaards Arlen runs the WTA show in Northwest Washington, crew leading work parties, representing WTA at outreach events and promoting hiking in the area. Somehow, in between all of this he finds time to feed the animals on his small farm. After years in the construction field, Arlen finally united his work with his passion: trails. He enjoys a good day hike in a high meadow or a backpacking trip in the desolate North Cascades, and his favorite hike is Skyline Divide. If he ever gets the chance, he would like to section hike the Pacific Crest Trail. Paul Boronow Paul got his start in conservation as a trail crew member with the New York-New Jersey Trail Conference in his home state of New York. He was drawn to the unique community of oddballs he found in trails and the tangible impact of the work they were doing together. Paul furthered his experience with Rocky Mountain Youth Corps in Colorado, where he led crews and planned programs for their Conservation Corps. When he’s not on the trails, Paul enjoys biking at a moderate pace, taking things apart, skipping rocks at the beach, and giving his dog haircuts. Meg Bushnell Meg has always loved active vacations instead of plopping on a beach. She hikes in places like Scotland, Ireland, Patagonia, New Zealand, Switzerland, and spends time admiring the tiny alpine flora of the Arctic Circle. Originally from LA, she knew that forests and mountains belonged in her heart, and was able to go crazy with that love on moving to Bellingham after living in Nashville for 27 years. She quickly found WTA a happy post-retirement career as a trail work volunteer. She loves fleece, the sound of a sleeping bag zipper in the night, and isn’t fazed by cloudy rainy weather. She is perpetually amazed by the beauty of Washington and the wealth of wonderful trails, and loves to pay back those gifts by helping other trail users learn, maintain and support the intense value of our trails. Cliff Cantor After spending years in rural Alaska — where he hand-built a beautiful log home — Cliff moved to Seattle in 1988. He spends just as much time out in the wilderness as he does in town, and has been hiking, climbing and canoeing his whole life. He's also a master native plant steward with the Native Plant Society! He added trail work to his list of outdoor activities when he signed up for a WTA volunteer vacation at Glacier Peak back in 2007. As a crew leader, Cliff emphasizes giving volunteers a rewarding experience by allowing them to gain new skills and take ownership. Liz Carl Growing up in rural Maine, Liz spent as much time as possible playing in the woods near her home. As life went on, she gradually moved West — first Indiana, then Wisconsin and eventually western Washington. The ability to easily get to mountains or ocean brings her joy. Liz started volunteering with WTA in 2007 after thru-hiking the Appalachian Trail, where she discovered that trails don't make themselves. Upon becoming an orange hat in 2009, she found a love of teaching trail work with a lot of humor. When not doing trail work, you may find her wandering around the Middle Fork Snoqualmie valley, specifically the Pratt Connector. She's the first to say there are trails that just suck us in. Alan carter Mortimer It took Alan 11 years of volunteering with WTA to decide he liked it enough to stay. If you’ve ever wondered how WTA decides what work to do on which trails, talk to Alan. He coordinates with land managers to plan trail projects in the Olympics and South Sound as well as Central and Eastern Washington. He works to ensure that volunteers have a safe, fun and rewarding experience on trail. Alan, also goes by Ace, Sheldon or Mort. One of his favorite hikes is the Shedroof Divide in the Salmo-Priest Wilderness of Eastern Washington. Phil Cook Phil decided at the ripe old age of 12 to work in the woods the rest of his life after his first week-long hike along the Cascade Crest Trail and an encounter with a Forest Service trail crew. Midway through his career in forestry he noticed he was spending more time driving a desk than working in the brush, so in 2000 he volunteered on a WTA work party and found what that 12-year old had been looking for. Since retiring, the pendulum has swung back to more trail time for Phil, balancing work and recreation. He looks forward to sharing many more WTA volunteer experiences. Kaci Darsow (they/them) Kaci grew up poking around the rocky shores of Puget Sound and romping through cedar and sword fern forests. They come to WTA with extensive youth work experience in a variety of outdoor settings and an M.Ed. in Environmental Education. Kaci is returning home to the Pacific Northwest from their most recent adventure — a year of teaching outdoor education in rural Alabama. They are stoked to ease into the world of office work by splitting their time facilitating youth work parties and serving as a support system for youth volunteer vacations. When they're not inspiring youth, Kaci loves cross-country road trips, learning new things, singing off-key in their car, climbing trees and dismantling the patriarchy. Melissa Davis A native Washingtonian, Melissa grew up enjoying our beautiful PNW lands, camping and hiking with family across the state. Looking for more outdoor adventures, she discovered WTA BCRTs, and has been volunteering every summer since. After 7 seasons of BCRT volunteering, she took the leap to crew lead in the backcountry in Iceland, and is excited to accept a position leading volunteers on BCRTs in Central WA this year! She loves to travel especially when it involves long distance hikes, exploring new cultures and meeting new people. Allie Deford Allie spent the first 23 years of her life in the flat lands of Indiana. She finally saw her first "real" mountain in college on a trip to Colorado, where she spent the whole week constantly pointing at the Rockies and saying "there are mountains RIGHT THERE". When it came time for grad school in 2014, she made her way out of Washington where she discovered WTA after stumbling across work parties through a random internet search for volunteer opportunities. She was hooked from her first work party in 2018 where she helped rebuild a switchback and she got to help carry a really large rock. While she spends the work week in tech, she loves her weekends hopping all over Western Washington to roll around in the dirt. While not doing trail work or working, you can find Allie tending her balcony garden, doing jigsaw puzzles, or researching tools for a new hobby she definitely doesn't need to get into. Todd Dunfield Growing up in Europe, Todd got started hiking at an early age doing volksmarches (organized 5km hikes) with his family around the German countryside. Today he resides in Spokane with his wife and three children where he works in land conservation at the Inland Northwest Land Conservancy. Todd picked up his first pulaski and volunteered with WTA on the Franklin Falls Trail while completing his masters degree in Seattle back in 2001. Since that time he has served on WTA's board of directors and was an assistant crew leader for a few years before becoming a crew leader in 2016. Todd really enjoys volunteering on work parties in the Spokane area and the Salmo Priest Wilderness. Gary Fralick Gary was born and raised in Whatcom County. He has always enjoyed being in the outdoors, weather it was fishing in the mountain streams or skiing on Mount Baker. Being in the woods came natural to Gary. It started when he got married and had a wood stove fireplace to heat their house. After cutting over and burning more than 500 cords of wood for his family, he's happily hanging up his chainsaw and picking up a crosscut saw. Gary was a runner and used the Chuckanut trails for training. But after a knee injury and retirement he found his passion in trail work with Washington Trail Association. He enjoys watching and teaching a first time volu'''
