["https://www.wta.org/go-hiking/hikes/upper-siouxon-horseshoe-falls"]
title = "Horseshoe and Chinook Creek Falls via Upper Siouxon Creek — Washington Trails Association"
description = "This excellent early-season romp heads up a lush river canyon boasting three gorgeous waterfalls with riverside campsites for an overnight, or a longer, more challenging loop."
full_description = '''Horseshoe and Chinook Creek Falls via Upper Siouxon Creek This excellent early-season romp heads up a lush river canyon boasting three gorgeous waterfalls with riverside campsites for an overnight, or a longer, more challenging loop. https://www.wta.org/go-hiking/hikes/upper-siouxon-horseshoe-falls https://www.wta.org/site_images/hikes/upper-siouxon-creek-photo-by-patriciac.jpeg/@@download/image/Upper Siouxon Creek. Photo by PatriciaC..jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/upper-siouxon-horseshoe-falls", "name": "Horseshoe and Chinook Creek Falls via Upper Siouxon Creek", "description": "This excellent early-season romp heads up a lush river canyon boasting three gorgeous waterfalls with riverside campsites for an overnight, or a longer, more challenging loop.", "url": "https://www.wta.org/go-hiking/hikes/upper-siouxon-horseshoe-falls", "image": "https://www.wta.org/go-hiking/hikes/upper-siouxon-horseshoe-falls/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 21, "ratingValue": 2.8, "ratingCount": 4, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 45.9466333333, "longitude": -122.1773}} Horseshoe and Chinook Creek Falls via Upper Siouxon Creek South Cascades > Dark Divide 45.9466, -122.1773 Map & Directions Length 8.4 miles, roundtrip Elevation Gain 700 feet Highest Point 1,570 feet Calculated Difficulty About Calculated Difficulty Moderate Full-size image Rivers Waterfalls Wildlife Parking Pass/Entry FeeNorthwest Forest Pass Add Hike to My Backpack Saved to My Backpack This excellent early-season romp heads up a lush river canyon boasting three gorgeous waterfalls with riverside campsites for an overnight, or a longer, more challenging loop. Continue reading Rating 2.75 out of 5 (4 votes) Log in to rate 21 trip reports for this trail Write a trip report Hiking Horseshoe and Chinook Creek Falls via Upper Siouxon Creek This excellent early-season romp heads up a lush river canyon boasting three gorgeous waterfalls with riverside campsites for an overnight, or a longer, more challenging loop.From the trailhead at the end of 5701, descend to a T-junction and turn right (east), heading upstream toward Siouxon Creek (turning left heads downstream and connects to longer Huffman and Siouxon Peak Trails.) Just under a mile along, look for the Horseshoe Ridge trail, breaking off to the right. This 6.9-mile spur climbs to the 3,200-foot viewless crest of Horseshoe Ridge before descending to meet up with the Siouxon Creek trail farther up. After another half mile, the trail turns slightly south of Siouxon Creek to cross Horseshoe Creek Falls on a sturdy wooden bridge; 60 yards past the falls, look for a spur that descends to a couple of secluded campsites below the falls. A quarter mile farther brings you alongside Siouxon Creek Falls, a 40-foot plunge down a narrow S-shaped cleft. Two campsites and a small, primitive shelter can be found opposite the falls; a short side trail above the falls allows for water access.Continue up the canyon for 2 more miles to a wide stream cascading across the trail. Use caution on the slick rocks during the early season high runoff. Just beyond the crossing, fork left over another wooden bridge, this time over a deep gorge cut through the rock. Now along Chinook Creek, pass a couple more campsites, and arrive at 50-foot Chinook Creek Falls. A ford is required to connect to the other side of the trail to continue on to Huffman and Siouxon Peaks, so this makes an ideal lunch and turnaround spot below the misty falls. Hike Description Written by Eli Boschetto, WTA Community Horseshoe and Chinook Creek Falls via Upper Siouxon Creek Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-122.1773, 45.9466333333], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "upper-siouxon-horseshoe-falls"}, containerId = "map", hike = {"trailhead": [-122.1773, 45.9466333333], "id": "upper-siouxon-horseshoe-falls", "title": "Horseshoe and Chinook Creek Falls via Upper Siouxon Creek", "thumbnail": "https://www.wta.org/go-hiking/hikes/upper-siouxon-horseshoe-falls/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 45.9466, -122.1773 Open in Google Maps Before You Go The road is closed beyond the Upper Siouxon Trailhead (Huffman Peak Trailhead) due to wildfire damage. The trail is still accessible via the Upper Siouxon Trailhead. See weather forecast Parking Pass/Entry FeeNorthwest Forest Pass WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There Drive I-205 north or south to exit 30. Turn east onto SR-500, turning into SR-503, for 26 miles. Turn right on NE Healy Road, continuing 9 miles to a fork. Veer left on FR-57 for 1.2 miles, then left again on FR-5701 for 4.0 miles to the trailhead. Print Email More Hike Details Trailhead South Cascades > Dark Divide Siouxon (#130) Gifford Pinchot National Forest, Mount Adams Ranger District Guidebooks & Maps Day Hiking: South Cascades (Nelson & Bauer–Mountaineers Books) Green Trails No. 396 Lookout Mountain https://www.fs.usda.gov/Internet/FSE_MEDIA/stelprdb5161065.pdf Learn Angry Mountain: One trail's role in a sustainable system Learn Patience and Pragmatism: How One Man's Approach to Work Shaped Lives, Trails and WTA You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
