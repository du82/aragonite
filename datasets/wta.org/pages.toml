["https://www.wta.org/our-work/next-generation/youth-programs-overview"]
title = "Youth Programs Overview — Washington Trails Association"
full_description = "Youth Programs Overview Share Print Email Washington Trails Association's Youth Programs are opportunities for youth ages 10-18 to spend time outdoors building and maintaining hiking trails in a safe, teamwork-oriented environment. We also offer teachers and youth leaders Outdoor Leadership Training to get young people outdoors. Why join our youth programs? Meet new friends Get outside and have fun Great exercise outdoors Learn leadership & outdoor skills Help our hiking trails Earn volunteer service hours And, did we already say it's fun? Program Descriptions Day Work Parties Youth ages 10 and up can participate in our regular work parties that run Tuesday through Sunday. Youth under age 14 must have a parent, guardians or teacher accompany them. Check out our work party search page for opportunities. Youth Day Work Parties We host youth-specific private work parties where youth groups and their leaders can work together on a trail crew. Contact volunteer@wta.org for more information. Summer Volunteer Vacations (paused for 2025) This year, our vacation program for 14-18 year olds is paused. Check out our youth day work parties instead, where youth can earn up to 8 service hours per day. Educator Programs WTA's Outdoor Leadership Training program gets school-age youth outside by empowering teachers and youth groups with the skills and resources to lead safe and fun outdoor experiences. Success Stories Read how WTA's work has touched the lives of people across the state."
