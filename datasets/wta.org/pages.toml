full_description = '''Everyone deserves to have opportunities to recreate outdoors and to have safe, welcoming and inclusive experiences on trail. If there’s one thing we know — it’s that trails and access to the outdoors are a must-have.Everyone deserves to have opportunities to recreate outdoors and to have safe, welcoming and inclusive experiences on trail. If there’s one thing we know — it’s that trails and access to the outdoors are a must-have.Trails link people and wild places. They provide us with a place to reconnect with nature—and each other. But every year, more are more trails are in danger of falling off the map.Photo ﻿ Everyone deserves to have opportunities to recreate outdoors and to have safe, welcoming and inclusive experiences on trail. If there’s one thing we know — it’s that trails and access to the outdoors are a must-have.Unfortunately, outdoor spaces are not safe or accessible for everyone, nor is our state’s hiking community always as welcoming or inclusive as it should be. With your help, we want to change that. Take Action We need your help to ensure more people have access to the benefits of time spent in nature. Your donations make this work possible. You can also help by educating yourself on the issues, supporting our partner organizations and speaking up for public lands. ﻿ ﻿ ﻿ Our Work Featured WTA's Emerging Leaders Program ends on a high note "It has been fulfilling to see where ELP alumni interests propel them on their endeavors after completing this program." More A public school science outdoors program to inspire Lincoln High School in Tacoma is proving the hypothesis that an outdoors science program can deliver on STEM, help students dream big and break down geographic, economic and social barriers to the outdoors. | by MJ Sampang More A bounty of seaweed: How foraging can connect us to ancestral food practices and trails A foraging trip offered a connection to the land and sea — and my own and other cultures. By Riley Collins More'''
