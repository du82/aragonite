full_description = "Corporate Sponsorships Sponsor Washington Trails Association to support trails and connect with our active, growing community of outdoor enthusiasts https://www.wta.org/get-involved/join/support-info/corporate-giving https://www.wta.org/@@site-logo/wta-logo.png Corporate Sponsorships Sponsor Washington Trails Association to support trails and connect with our active, growing community of outdoor enthusiasts Washington Trails Association is the nation's largest state-based hiking nonprofit organization. We are proud to partner with companies that share our commitment to protecting hiking trails and getting people outdoors. Our corporate partners help WTA protect trails and wildlands where we live, work and play. How Your Company Can Support Trails As a WTA sponsor, you'll connect directly with hikers and other outdoor enthusiasts. Opportunities for recognition include: Crescendo: A Symphonic Celebration of Washington Landscapes in April Hike-a-Thon, a month-long hiking event in August Northwest Exposure Photo Contest in fall Volunteer Appreciation events in fall Member appreciation events like happy hours and receptions Want to learn more? Email donations@wta.org or call (206) 625-1367. Other ways to give: Corporate Giving: Make a charitable gift, award a grant, or donate products and services. Matching Gifts: Match employee cash or volunteer contributions to WTA. Workplace Giving: Include WTA, EarthShare Washington, or both in your employee giving campaign. Corporate Volunteering: Take your team out for a day of trail work with WTA. Current corporate members are given priority for scheduling. To find out more about how your company can partner with WTA, please email donations@wta.org or call (206) 625-1367. Washington Trails Association is a nonprofit, 501c3 organization. Tax-ID: 91-0900134. Contributions are tax deductible to the extent of the law."
