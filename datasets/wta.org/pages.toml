title = "Hobart - Middle Tiger Railroad Trail — Washington Trails Association"
description = "Hike the routes of two former logging railroads (the Iverson and the Hobart - Middle Tiger) to reach a remote section of Fifteenmile Creek. Follow a short, steep trail to connect with the Tiger Mountain Trail (TMT.) Return via the TMT and, on the way, look in on the site of a 1925 logging train wreck."
full_description = '''Hobart - Middle Tiger Railroad Trail Hike the routes of two former logging railroads (the Iverson and the Hobart - Middle Tiger) to reach a remote section of Fifteenmile Creek. Follow a short, steep trail to connect with the Tiger Mountain Trail (TMT.) Return via the TMT and, on the way, look in on the site of a 1925 logging train wreck. https://www.wta.org/go-hiking/hikes/hobart-middle-tiger-railroad-grade https://www.wta.org/site_images/hikes/quantum-guru.jpg/@@download/image/hobart.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/hobart-middle-tiger-railroad-grade", "name": "Hobart - Middle Tiger Railroad Trail", "description": "Hike the routes of two former logging railroads (the Iverson and the Hobart - Middle Tiger) to reach a remote section of Fifteenmile Creek. Follow a short, steep trail to connect with the Tiger Mountain Trail (TMT.) Return via the TMT and, on the way, look in on the site of a 1925 logging train wreck.", "url": "https://www.wta.org/go-hiking/hikes/hobart-middle-tiger-railroad-grade", "image": "https://www.wta.org/go-hiking/hikes/hobart-middle-tiger-railroad-grade/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 34, "ratingValue": 3.5, "ratingCount": 4, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 47.4808171884, "longitude": -121.966317594}} Hobart - Middle Tiger Railroad Trail Issaquah Alps > Tiger Mountain 47.4808, -121.9663 Map & Directions Length 10.2 miles, roundtrip Elevation Gain 1,550 feet Highest Point 2,180 feet Calculated Difficulty About Calculated Difficulty Moderate/Hard Salmonberry make for a great spring/summer trail snack. Photo by Greymstreet. Full-size image Dogs allowed on leash Fall foliage Good for kids Mountain views Wildflowers/Meadows Wildlife Parking Pass/Entry FeeDiscover Pass Add Hike to My Backpack Saved to My Backpack Hike the routes of two former logging railroads (the Iverson and the Hobart - Middle Tiger) to reach a remote section of Fifteenmile Creek. Follow a short, steep trail to connect with the Tiger Mountain Trail (TMT.) Return via the TMT and, on the way, look in on the site of a 1925 logging train wreck. Continue reading Rating 3.50 out of 5 (4 votes) Log in to rate 34 trip reports for this trail Write a trip report Hiking Hobart - Middle Tiger Railroad Trail Hike the routes of two former logging railroads (the Iverson and the Hobart - Middle Tiger) to reach a remote section of Fifteenmile Creek. Follow a short, steep trail to connect with the Tiger Mountain Trail (TMT.) Return via the TMT and on the way, look in on the site of a 1925 logging train wreck. Begin your hike at the Tiger Summit Trailhead off Highway 18. The Iverson Railroad Trail begins next to the signboard and heads west, climbing 200 feet or so before leveling off. It's a nice forest walk, mostly along the old railroad grade, with a lot of ferns and second-growth trees. In late winter and early spring be alert for the first wildflowers, usually coltsfoot, yellow violets and trilliums.After 1.5 miles, the Iverson Trail drops a bit and joins the West Side Road (Road 1000,) a gated road used by technicians servicing electronic gear and occasionally, by logging trucks. Continue west along the road. In 0.3 miles note the sign for a trail crossing where the main Tiger Mountain Trail (TMT) arrives, road-like, from the south and continues on trail-like toward the north. The TMT will provide your return route. For now, continue on Road 1000 an additional 1.6 miles, first climbing a hundred feet, then dropping four hundred feet with some switchbacks before coming to a creek crossing. Formerly it was just a large culvert, but it's been replaced by a heavy-duty concrete-deck bridge.Just upstream of the bridge, look for a signpost where a small metal sign proclaims "Middle Tiger Trail." At the top of the signpost, above the metal sign, the original wooden sign is still readable, as of 2015. It's one of the most weathered signs in the Tigers, and it acknowledges that the trail also leads to the Hobart - Middle Tiger RR Grade.Head up the Middle Tiger Trail and, in 0.1 mile, come to a trail fork where a not-quite-so-weathered sign will direct you to the left fork for the Hobart - Middle Tiger RR Grade. The sign also notes that it's 1.4 miles to the site of a "curved trestle," and in the early days of logging an elaborate wooden trestle did cross the creek there. Unfortunately, nothing remains of the trestle today.The RR grade continues gently uphill. After a rain, tall grasses bordering the trail can make for a damp passage. And low salmonberry bushes may feel prickly to hikers wearing shorts. After a mile or so you will begin to hear the sounds of Fifteenmile Creek down below. About 1.7 miles from the West Side Road, note a connecting trail heading uphill to the east. A small sign with an arrow pointing straight up proclaims "TMT 1/4." But first, continue on the RR Grade another 0.1 mile, where the trail comes down to Fifteenmile Creek. It's a pleasant, seemingly-remote setting; a good stopping place for a snack, and you might have the creekside all to yourself. A faint ongoing trail continues on across the creek, heading up toward the 15 Mile RR Grade. That route hasn't made it onto the Green Trails Map yet, but if you have a GPS unit and use the NW Topo map it is shown there. You might keep that ongoing route in mind for a future exploration.When you are ready to continue with today's loop, backtrack that 0.1 mile and head up the connecting trail toward the TMT. It is steep, but the vertical-pointing arrow is a considerable exaggeration. You soon will find yourself on the TMT, just north of Hal's Cove.Head south on the TMT, passing other named sites (Denny's Bulge, Joe's Hollow, etc,) each commemorating one of the volunteers who built the TMT in the 1970s. At Millan's Crossing the TMT crosses over the Middle Tiger Trail, here 900 feet higher than where your route left it earlier today. Stay on the TMT.As you approach Karl's Gap you will skirt the edge of a clear-cut area. If clouds permit, you may have a brief view of Mount Rainier in the distance. The TMT leaves the clear-cut and traverses around the north, west, and south sides of Karl's Peak, then enters the clear-cut area again and descends to a sharp corner at Zeig's Zag.At the Zag, a bit of muddy side trail crosses a seep and seems to continue on straight ahead. It's worth a five-minute look. In a few feet, a sign proclaims "Artifacts Trail," and in 200 feet it leads to the site of a February 23, 1925, wreck of a logging train. An official-looking sign there identifies the site and lists the historic date.Most of the wreckage was salvaged at the time, and only a few pieces remain. A set of wheels peers out from beneath a downed tree, and other objects are strewn around. A few feet beyond the wheels, a jumble of metal pieces suggests an abstract metal sculpture. The Artifacts Trail hasn't made it onto the Green Trails Map yet but, once again, if you have a GPS unit and use the NW Topo map it is shown there. The ongoing Artifacts Trail offers no additional train wreckage and it has many blowdowns, so it's best to turn around here, return to the TMT and continue on south.Soon, you will reach the West Side Road, thus completing the loop part of your hike. From there, return to the Tiger Summit Trailhead the way you came, via the road and the Iverson Railroad Trail.A Possible Variation: As described above, your hike can begin at the Tiger Summit Trailhead. Alternatively, you could begin at the south end of the TMT along Tiger Mountain Rd SE, although that would add 3.5 miles to your round-trip distance and require an additional 900 feet of elevation gain. From that trailhead, you could follow the TMT all the way to the West Side Road, or could use the South Tiger Traverse for part of the way (or you could go via one route and return via the other.) If these options sound interesting, refer to the Hiking Guide description for the South Tiger Mountain Loop for details. Hike Description Written by Alan Gibbs, WTA Correspondent Hobart - Middle Tiger Railroad Trail Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-121.966317594, 47.4808171884], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "hobart-middle-tiger-railroad-grade"}, containerId = "map", hike = {"trailhead": [-121.966317594, 47.4808171884], "id": "hobart-middle-tiger-railroad-grade", "title": "Hobart - Middle Tiger Railroad Trail", "thumbnail": "https://www.wta.org/go-hiking/hikes/hobart-middle-tiger-railroad-grade/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 47.4808, -121.9663 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeDiscover Pass WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From I-90 a few miles east of Issaquah, take Exit 25 and head south on Highway 18. In about four miles, turn off to the right at Tiger Summit. Watch for potholes as you leave the pavement, then continue on Road 1000 a quarter mile to reach the trailhead parking area. A toilet is available, but no regular water source. While a Discover Pass is required at the trailhead, if you don't have a Discover Pass an option is to park in the wide area adjacent to Highway 18 and hike the extra quarter mile to the trailhead. Print Email More Hike Details Trailhead Issaquah Alps > Tiger Mountain Iverson Railroad Trail (#TIGER), Hobart - Middle Tiger Railroad Grade (#TIGER), Tiger Mountain Trail (#TIGER) Washington State Department of Natural Resources Guidebooks & Maps While not a hiking book the following book is quite interesting as a history of Tiger Mountain logging operations including railroad grades from 1910 to 1932. Schmelzer Ken. "Wood & Iverson: Loggers of Tiger Mountain " Oso Publications May 2001. (A small press run now out of print and available only at rare book prices. Seattle Public Library has two copies one circulating and one for In-library use only.) National Geographic Issaquah Alps Mount Si 824 Buy the Green TrailsTiger Mountain No. 204S map Learn Day Hike Packing List Learn Practice Leave No Trace on Trail and in Camp You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
