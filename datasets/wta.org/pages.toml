and connecting to that trail system, Border Camp Trail is a short trail segment within the Loomis State Forest, which is managed by the Department of Natural Resources as a Natural Resources Conservation Area. Border Camp is among several trails on the looped trail system located on DNR land, so-named for a historic campsite that appears on the old USGS topo maps near Snowshoe Peak and the Canadian border. Continue reading Dogs not allowed Fall foliage Mountain views Ridges/passes Wildflowers/Meadows Wildlife Parking Pass/Entry FeeDiscover Pass Rating 5.00 out of 5 (1 vote) Log in to rate 1 trip reports for this trail Write a trip report Hiking Border Camp Trail Located just east of the Pasayten Wilderness and connecting to that trail system, Border Camp Trail is a short trail segment within the Loomis State Forest, which is managed by the Department of Natural Resources as a Natural Resources Conservation Area. Border Camp is among several trails on the looped trail system located on DNR land, so-named for a historic campsite that appears on the old USGS topo maps near Snowshoe Peak and the Canadian border. No sign remains of the historic camp, but one of the US/Canadian boundary monuments (#106) is located at the northernmost point on the trail. When maintained, Boundary Camp Trail can form a loop with Snowshoe Trail to the east and Olallie Trail to the west. However, Olallie Trail seldom receives maintenance and may be difficult to follow. Toilet Information No toilet at trailhead More information about toilets Hike Description Written by Holly Weiler, WTA Correspondent Border Camp Trail Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "ba