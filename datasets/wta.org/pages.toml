description = "The Elliott Bay Trail follows the shoreline of Elliott Bay for 5 miles from S Royal Brougham Way near CenturyLink and SafeCo Fields to Smith Cove Park in Magnolia."
full_description = '''Elliott Bay Trail The Elliott Bay Trail follows the shoreline of Elliott Bay for 5 miles from S Royal Brougham Way near CenturyLink and SafeCo Fields to Smith Cove Park in Magnolia. https://www.wta.org/go-hiking/hikes/elliott-bay-trail https://www.wta.org/site_images/hikes/img_1404.jpg/@@download/image/elliottBay.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/elliott-bay-trail", "name": "Elliott Bay Trail", "description": "The Elliott Bay Trail follows the shoreline of Elliott Bay for 5 miles from S Royal Brougham Way near CenturyLink and SafeCo Fields to Smith Cove Park in Magnolia.", "url": "https://www.wta.org/go-hiking/hikes/elliott-bay-trail", "image": "https://www.wta.org/go-hiking/hikes/elliott-bay-trail/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 37, "ratingValue": 4.0, "ratingCount": 4, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 47.6161517296, "longitude": -122.353947759}} Elliott Bay Trail Puget Sound and Islands > Seattle-Tacoma Area 47.6162, -122.3539 Map & Directions Length 10.0 miles, roundtrip Elevation Gain 350 feet Highest Point 65 feet Calculated Difficulty About Calculated Difficulty Moderate Elliott Bay takes you past many Seattle landmarks. Photo by Austineats. Full-size image Coast Dogs allowed on leash Good for kids Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack The Elliott Bay Trail follows the shoreline of Elliott Bay for 5 miles from S Royal Brougham Way near CenturyLink and SafeCo Fields to Smith Cove Park in Magnolia. Continue reading Rating 4.00 out of 5 (4 votes) Log in to rate 37 trip reports for this trail Write a trip report Hiking Elliott Bay Trail A paved path along Elliott Bay shoreline this route is a lovely, flat route to enjoy views of Puget Sound and a little nature close to the heart of Seattle. This trail provides a pleasant way to go north-south in Seattle, with fewer intersections than walking on the main city streets. There are plenty of connections in to downtown such as the Pike Street Hillclimb and the Lenora Street Bridge. Trails Next Door WTA is working to ensure nature is always within reach. The trail goes through the Olympic Sculpture Park and Myrtle Edwards Park. There is good variety along its length, from highest urban density to more wide open and industrial. Your best access point is Myrtle Edwards via the Olympic Sculpture Park. There is a parking garage available at the Sculpture Park, or extend your outing by heading here without a car. You can bus it, or simply come in from wherever you can find parking in Belltown or on the waterfront. Toilet Information No toilet at trailhead More information about toilets Wheelchair Accessibility When traveling north towards Magnolia, there is a narrow railroad overpass with a very steep ramp. Also of note, portions of the trail split into two paths: cycling and pedestrian. The slope and side-slope is much more gentle on the pedestrian path. Elliott Bay Trail Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-122.353947759, 47.6161517296], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "elliott-bay-trail"}, containerId = "map", hike = {"trailhead": [-122.353947759, 47.6161517296], "id": "elliott-bay-trail", "title": "Elliott Bay Trail", "thumbnail": "https://www.wta.org/go-hiking/hikes/elliott-bay-trail/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 47.6162, -122.3539 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There The pin here is dropped at the parking garage near the Olympic Sculpture Park but there are many other access points to the Elliott Bay Trail. take transit This trailhead is accessible by bus! Plan your visit by bus using TOTAGO. Many bus routes serve downtown Seattle. Print Email More Hike Details Trailhead Puget Sound and Islands > Seattle-Tacoma Area City of Seattle and Port of Seattle Guidebooks & Maps Urban Trails - Seattle (Craig Romano - Mountaineers Books) http://www.seattle.gov/parks/find/hiking-and-trails Learn Day Hike Packing List Learn 16 Lighthouse Hikes You Can Enjoy All Year You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
