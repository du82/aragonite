["https://www.wta.org/go-outside/passes/backcountry-wilderness-permit-info"]
title = "Backcountry and Wilderness Permits Info — Washington Trails Association"
description = "Backcountry (or wilderness) permits, like those issued for backpacking in national parks or quota areas like the Enchantments, along the Wonderland Trail or Mount St. Helens Backcountry to help regulate foot traffic in fragile environments. Some of these permits are free, while others come with small fees. Use our guide to research what you need."
full_description = '''Backcountry and Wilderness Permits Info Backcountry (or wilderness) permits, like those issued for backpacking in national parks or quota areas like the Enchantments, along the Wonderland Trail or Mount St. Helens Backcountry to help regulate foot traffic in fragile environments. Some of these permits are free, while others come with small fees. Use our guide to research what you need. https://www.wta.org/go-outside/passes/backcountry-wilderness-permit-info https://www.wta.org/go-outside/passes/backcountry-wilderness-permit-info/@@download/image/WTA70.jpg Backcountry and Wilderness Permits Info Backcountry (or wilderness) permits, like those issued for backpacking in national parks or quota areas like the Enchantments, along the Wonderland Trail or Mount St. Helens Backcountry to help regulate foot traffic in fragile environments. Some of these permits are free, while others come with small fees. Use our guide to research what you need. 2025 Key dates Feb. 15 - March 1, Enchantments lottery open Feb. 10 - March 3, Mount Rainier early access lottery openMarch 3 - March 14, North Cascades early access lottery open April 15, Olympic National Park summer season reservations openLooking for info about car camping reservations? Why permits? To protect the land & to protect unique experiences for All Backcountry (or wilderness) permits, like those issued in national parks or quota areas like the Enchantments, serve a different purpose than parking passes or entry fees. Permits are a way of regulating the amount of foot traffic in fragile environments that can only handle so much use before they begin to erode. By limiting the number of visitors to an area, permits not only preserve the environment but also the experience of hikers themselves. This allows you to immerse yourself in the sights and sounds of nature in relative solitude. Some of these permits are free, while others come with small fees. Some are seasonal, and others are required year-round. The barriers posed by permits are, more often than not, that they can be confusing and difficult to secure. These lands belong to all of us, and while they may not be a perfect solution, the combination of permits, lotteries and a limited number of walk-up passes goes a long way toward providing a fair allocation process and ensuring equal access to the opportunity. But in the end, they serve a valuable purpose. Permitting by park:Mount Rainier National Park | North Cascades National Park | Olympic National Park | National forests | Enchantments | State lands National Parks Backcountry & wilderness permits. If you plan to backpack in a national park or monument, you need to secure a backcountry/wilderness permit. We've broken down the process for each national park but first here are some important dates to keep in mind. Mount Rainier National Park (and Wonderland Trail) wilderness permits (early-access lottery applications accepted between Feb. 10 and March 3, 2025) North Cascades National Park backcountry permits (early-access lottery applications accepted starting March 3 through March 14, 2025) Olympic National Park Wilderness camping permits (permits for the summer season can be reserved starting April 15, 2025) How to reserve a Mount Rainier National Park Wilderness camping permit Backcountry permit reservations for Mount Rainier National Park can be made online through Recreation.gov or in person. About two-thirds of all available permits are available online while one-third are held for in-person permitting. The early-access lottery, a part of the online process, will ensure the best chance of getting your desired reservation dates. For the best chance at a complete Wonderland loop reservation, apply for the early-access lottery and complete the online process. There are 2 phases to the online process: Early-Access Lottery: Apply to get an advantage in the reservation process. Being selected in the lottery does not reserve your desired trip; instead, you are assigned a priority date when you can try to book your reservation. Lottery applications are open Feb. 10 - March 3, 2025. Lottery winners will be notified March 14, and will be assigned a booking date between March 21 and April 19, 2025. General Reservations: All other visitors who were not picked in the lottery can still reserve permits online at least 2 days before the start of their trip, but they have to wait until April 25, 2025 when all the remaining permits become available to the public. Note: You must activate your permit reservation in person at a visitor center up to 24 hours before your trip starts. Walk-up permits: Visitors can walk into a Wilderness Information Center to get a backcountry permit the day of or the day before their trip starts. Check availability on Recreation.gov by looking for a "W" at desired camps (indicating there are available walk-up spots), and have an itinerary in mind before visiting the Wilderness Information Center. How to reserve a North Cascades National Park backcountry permit Backcountry permits for North Cascades National Park can be obtained online via Recreation.gov or in person. Sixty percent of all available permits will be reservable online while forty percent will be held for walk-up visitors. If you want to get in the running for one of the reserved permits, read up on the North Cascades Backcountry Reservation page and follow these basic steps. There are 2 phases to the online process: Early-Access Lottery: Apply to get an advantage in the reservation process. Being selected in the lottery does not reserve your desired trip — instead you are assigned a priority date when you can try to book your reservation. Lottery applications are open March 3 - March 14, 2025. Lottery winners will be notified March 21, and will be assigned a booking date between March 24 - April 21, 2025. General Reservations: All other visitors who were not picked in the lottery can still reserve permits online at least 2 days before the start of their trip, but they have to wait until April 29, 2025 when all the remaining permits become available to the public. Note: You must activate your permit, by going in person to the Wilderness Information Center near Marblemount the day before your trip or the morning of your trip (before 11 a.m.). Or, if your trip is in an area without an open visitor center, you must email the ranger district the day before your trip. Walk-up permits: Between May 16 - Oct. 11, visitors can walk into the Wilderness Information Center to get a backcountry permit the day of or the day before their trip starts. Check availability on Recreation.gov by looking for a "W" at desired camps (indicating there are available walk-up spots), and have an itinerary in mind before visiting the Wilderness Information Center. How to reserve an Olympic National Park Wilderness camping permit Permits are required for any backpacking trips in the wilderness. The summer camping reservation season at Olympic National Park is May 15 through Oct. 15. Reservations for the summer season will be available on Recreation.gov starting on April 15 at 7 a.m. PST. The winter camping reservation season is Oct. 16 through May 14. Reservations for the winter season will be available on the website in late summer. Camping is allowed at many coastal and lower-elevation areas in Olympic National Park all year long with a permit obtained within the reservation windows above. Reservations for high-elevation areas are limited to a shorter summer season. If you wish to camp in these higher-elevation spots outside of the reservation window, you need to contact the Wilderness Information Center. Note that some places in the park that require permits (with or without a summer season window) have quotas. The camping reservation season for Seven Lakes Basin/High Divide is July 15 - Oct. 15. The camping reservation season for Glacier Meadows/Elk Lake, Royal Basin, Lake Constance and Flapjack Lakes is June 15 - Oct. 15. The camping reservation season for Grand Valley and Upper Lena Lake is July 1 - Oct. 15. U.S. Forest Service Lands Trailhead parking: To park at a USFS trailhead in Washington with developed facilities (toilet, picnic table, etc.), you must display a Northwest Forest Pass or America the Beautiful pass separate from any applicable overnight permit. Wilderness camping permits: To backpack or overnight camp in some delicate or popular places, like the Enchantments in the Mt. Baker-Snoqualmie National Forest or the Mount Margaret backcountry camps at Mount St. Helens, you will need to secure a wilderness permit. Self-registered Wilderness permits: When you are hiking or backpacking into other wilderness areas on national forest land, you may see a kiosk to fill out a self-registered, free wilderness permit. Fill out the permit, and attach it to your pack. How to Apply for an Enchantments Permit Set on making the Enchantments your backpacking destination? Because of the area's popularity, all overnight visitors must obtain a permit to camp in the Basin between May 15 and Oct. 31. Most of those permits are issued through an annual lottery, which you can apply for starting on Feb. 15, 2025. If you win a permit in the lottery, you'll need to confirm and pay for it between March 17 and March 31, 2025. The walk-up permit lottery at the Leavenworth Ranger Station will resume for the 2025 season beginning May 15 at 8:30 a.m. Please arrive 15 minutes early, with a designated group leader (the group leader will need a Recreation.gov account). 1 Apply for a permit Feb. 15 - March 1, 2025 The Enchantments lottery will open on Feb. 15, 2025, and end on March 1, 2025. Applying early doesn't give you preference for a permit, so just make sure to get your application in during this window. Set up an account at Recreation.gov. This can be done at any time (even right now). You can use the same account to reserve other permits or any of the campsites that use the National Recreation Reservation Service system. Fill out an application at Recreation.gov on the Enchantments Permit page. You'll be able to select your preferred zone to camp in (see map) (Core Enchantment, Snow Lake, Colchuck, Stuart Lake or Eightmile/Caroline) and the dates of your trip. It's a good idea to research where and when you'd like to go before you start the application process since making changes to an application may not be easy or even possible once you've submitted it. You will be charged a $6.00 non-refundable application fee. At this point, you will NOT have purchased a permit, but rather will have entered the lottery. 2 Check the results, and confirm and pay for your permit between March 17 - 31, 2025. The lottery results will be posted on Recreation.gov. Applicants can log into their Recreation.gov account and find out the results of their application. If you apply, set a reminder to check back during this period; don't count on an email. Did you confirm? If you score a permit, the next step is confirming and paying for your permit by March 31, 2025. You'll also be asked to provide additional information about party size (maximum of 8 people), the length of your stay, and pay for the permit. This is when you will be charged the $5.00/person/day fee. Once all your changes are in place, print and sign your permit once all the details of your trip are finalized. Note: The application process saw some minor tweaks back in the 2017 season, so be sure to brush up on the complete process at Recreation.gov before sending in your application. An alternate team leader must be designated on the lottery application. Alternates can't apply for their own separate permit in the same season. The party leader must carry photo ID and permit. Only one lottery application per person will be allowed (including serving as an alternate) Each member of the group must carry a copy of the valid permit while on trail Each member of the group must begin on the reserved start date, and camp with the party leader. Daily permit lottery The daily walk-up permit lottery process takes place between May 15 and Oct. 31, and is a geofence mobile process. Applicants must use a smartphone device with location services enabled to apply through Recreation.gov. Applications must be submitted on the day before the desired hike date within a one-mile radius of the Leavenworth Ranger Station. Applicants are free to leave the radius once they have submitted their application. Successful applicants will be notified later that day and must show up at the ranger station in person the day before their hike starts. Only one permit per zone is issued each day, with a maximum of 8 people allotted for the Core zone. Applications are only accepted on Monday through Friday (for hikes starting Tuesday through Saturday). Permits for hikes starting on Sunday or Monday are only available during the advance lottery. More details and trip planning resources Choosing a zone. More information about the application process, rules and advice about how to choose a zone can be found on the Okanogan-Wenatchee National Forest website and Recreation.gov Enchantments page. Early or late permits. If you are looking at May or October, you need to be ready to navigate snow. May and June is still avalanche season in Washington, so plan a trip that matches your skills. Improve your chances. The Forest Service also has this to say about improving your chances for a permit. "Bear in mind that the most popular time to go is August, and the most popular days to start a trip are Fridays, Thursdays, and Saturdays. If you really want to do a Friday-Sunday trip in mid-August, by all means apply for that trip, but remember that you’re odds of getting a permit will be less than if you tried for a Monday-Wednesday trip in July." Group size. If you are coordinating with friends or family, remember that group size is limited to a maximum of 8 people, and that you will need to all camp in the same location. Dogs are not allowed. If you usually hike with a dog, you will need to arrange to leave them at home as part of your plans. Dogs are not allowed anywhere in the Enchantments Basin. More resources. This second half of this page has good information for planning your trip, including information about the zones, what to expect, fire restrictions and more. Mountain goats. Depending on where you go, you might encounter mountain goats on trail or in camp. Know what to do if you encounter mountain goats. Washington State Public Lands While there are fewer opportunities to backpack on state lands (and a Discover Pass for entry or parking is usually all that is required), there are a few spots where you might need a special backcountry permit. In Wallace Falls State Park, there are two lakes — Wallace Lake and Jay Lake — where backcountry camping is allowed, with overnight permits. Please call the park office to acquire a permit prior to arrival at 360-793-0420. (There is a maximum of 5 persons per campsite.)'''
