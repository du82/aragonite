["https://www.wta.org/go-outside/new-to-hiking"]
title = "New to Hiking — Washington Trails Association"
full_description = "New to Hiking Washington has incredible hiking and camping to enjoy year-round. If you're ready to discover the joys of hiking for yourself, we can help guide you through everything you need to know. From finding your first hikes, buying and bringing the right gear, to staying safe and enjoying the outdoors responsibly and more. See you on the trail! Safety Essentials ToolkitBefore you head out for a hike, make sure you check out our Safety Essentials Toolkit with 5 key things you need to know to have a great time, and return safely. Hiking 101 New to hiking or need to brush up on some skills? We provide information about how to choose the right hike, select the appropriate clothing and gear, and how to be safe on the trail. Camping 101 Go camping this summer! With our guide to camping and campgrounds you can transform your best intentions into a great trip with family or friends. Backpacking 101 We love backpacking — and we think you will too. Check out our advice on how to plan your trip, what to do while you're out there and where to go."
