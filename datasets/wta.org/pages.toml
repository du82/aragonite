["https://www.wta.org/get-involved/action/protecting-lands-trails"]
title = "Protecting Lands & Trails: Funding, Conservation and Policy — Washington Trails Association"
description = "With more and more people getting outdoors, funding for public lands has not kept up with the demand. This makes it more difficult to keep our backcountry trails open and accessible and make the most iconic hiking destinations sustainable long term. Join WTA in becoming an advocate for increasing funding for our public land agencies and protecting the wild places surrounding the trails we love, from the remote wilderness to local parks and greenspaces."
full_description = "Protecting Lands &amp; Trails: Funding, Conservation and Policy With more and more people getting outdoors, funding for public lands has not kept up with the demand. This makes it more difficult to keep our backcountry trails open and accessible and make the most iconic hiking destinations sustainable long term. Join WTA in becoming an advocate for increasing funding for our public land agencies and protecting the wild places surrounding the trails we love, from the remote wilderness to local parks and greenspaces. https://www.wta.org/get-involved/action/protecting-lands-trails https://www.wta.org/get-involved/action/protecting-lands-trails/@@download/image/Protecting Lands & Trails.jpg Protecting Lands & Trails: Funding, Conservation and Policy With more and more people getting outdoors, funding for public lands has not kept up with the demand. This makes it more difficult to keep our backcountry trails open and accessible and make the most iconic hiking destinations sustainable long term. Join WTA in becoming an advocate for increasing funding for our public land agencies and protecting the wild places surrounding the trails we love, from the remote wilderness to local parks and greenspaces. With more and more people getting outdoors, funding for public lands has not kept up with the demand. This makes it more difficult to keep our backcountry trails open and accessible and make the most iconic hiking destinations sustainable long term. WTA has long been an advocate for increasing funding for our public land agencies and protecting the wild places surrounding the trails we love, from the remote wilderness to local parks and greenspaces. Whether you take action by writing to your legislator, joining our Hiker Rally Day in Olympia or signing a petition on Washington Trails Day, hikers’ stories have the power to affect powerful change. Explore Our Campaigns Trails for EveryoneLost Trails Found Trails Rebooted The Trail Next Door We protect our trails and lands through: Funding for federal, state and local land management agencies.On the federal level, we strongly supported the historic Great American Outdoors Act, which was passed in 2020 and included full and permanent funding for the Land and Water Conservation Fund. We led advocates to some major wins in the state legislative session that improve our recreation experience on public lands, build a strong future for trails and expand equity in the outdoors. We supported ballot initiatives, such as King County's Conservation Futures Program and Parks Levy and Tacoma Prop. 1: Park & Recreation Maintenance & Operations Levy, to increase funding for green spaces and parks at the local level. Protecting wildlands and parks. We advocated for the state’s acquisition of the Teanaway Community Forest to expand opportunities for hikers while boosting the recreation economy. We participate in regional collaboratives in places such as the Olympic Peninsula, Alpine Lakes Wilderness area, and East Cascades — to balance the needs of recreators and protected wildlands. We are strong advocates for the Washington Wildlife and Recreation Program, which provides funding to conserve natural areas, parks, forestlands and farmlands. Legislation and policy.We work every year in both Washington D.C. and Olympia, discussing with lawmakers the importance of our public lands and trails for people’s hearts, minds and bodies. How to help Protect Washington's Trails Join our Trail Action Network to receive opportunities to speak up for public lands funding and other priorities."
year_published = 2025
clearnet = "https://www.wta.org/get-involved/action/protecting-lands-trails"
