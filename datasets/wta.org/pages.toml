description = "On this little used trail, hikers can see history, both natural and man-made. Large sections of the forest are recovering from the 2006 Tripod Complex Fire, and the two lookouts on the summit provide a glimpse of the 1920's and 1940's construction."
full_description = '''North Twentymile Peak On this little used trail, hikers can see history, both natural and man-made. Large sections of the forest are recovering from the 2006 Tripod Complex Fire, and the two lookouts on the summit provide a glimpse of the 1920's and 1940's construction. https://www.wta.org/go-hiking/hikes/north-twentymile-peak https://www.wta.org/site_images/hikes/lookouts.jpg/@@download/image/twentymile.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/north-twentymile-peak", "name": "North Twentymile Peak", "description": "On this little used trail, hikers can see history, both natural and man-made. Large sections of the forest are recovering from the 2006 Tripod Complex Fire, and the two lookouts on the summit provide a glimpse of the 1920's and 1940's construction.", "url": "https://www.wta.org/go-hiking/hikes/north-twentymile-peak", "image": "https://www.wta.org/go-hiking/hikes/north-twentymile-peak/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 39, "ratingValue": 3.5, "ratingCount": 4, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 48.7028666667, "longitude": -120.104983333}} North Twentymile Peak North Cascades > Pasayten 48.7029, -120.1050 Map & Directions Length 12.8 miles, roundtrip Elevation Gain 4,387 feet Highest Point 7,437 feet Calculated Difficulty About Calculated Difficulty Hard FR 5010 is impassible at the Twentymile Creek ford. See the driving directions for more details on a better route. The summit of North Twentymile Peak. Photo by MtRunner. Full-size image Dogs allowed on leash Fall foliage Mountain views Wildflowers/Meadows Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack On this little used trail, hikers can see history, both natural and man-made. Large sections of the forest are recovering from the 2006 Tripod Complex Fire, and the two lookouts on the summit provide a glimpse of the 1920's and 1940's construction. Continue reading Rating 3.50 out of 5 (4 votes) Log in to rate 39 trip reports for this trail Write a trip report Hiking North Twentymile Peak On this little used trail, hikers can see history, both natural and man-made. Large sections of the forest are recovering from the 2006 Tripod Complex Fire, and the two lookouts on the summit provide a glimpse of the 1920's and 1940's construction. Starting from the trailhead at 3050 feet of elevation, the trail is on an abandoned road in the forest, which provides nice shade from afternoon heat for the first mile. After one mile, at 3650 feet of elevation, the trail starts its climb through a recovering burn area of silver and black trees with low brush. This area also frequently has deadfall and some erosion, creating obstacles on the trail. On the plus side, deer are prevalent, feeding on the new growth. Bear are also evident. In May and early June, balsamroot, lupine, paintbrush, penstemon, and gilia are in bloom to 2 miles, 4450 feet of elevation. In the lower burn area from mile 1 to mile 3.4, there is very little shade and no water after late May. In places, the trail can be obscured by the low brush and bare legs will have quite a few scratches at the end of the trip. Between 3.1 miles and 3.4 miles, Honeymoon Creek is nearby, but requires a 50 foot scramble down to it. At 3.4 miles (5370 feet of elevation), the trail enters a forest that survived the fire and has a grassy understory. The forest shade is welcome as the trail steeply switchbacks up to 4.2 miles and 6030 feet of elevation before heading back onto the burned south slope of the 6813-foot elevation bump. The trail has many short switchbacks as it climbs through the stark silver and black trunks before reaching the north side of the ridge at 5.2 miles and 6780 feet of elevation. The route has views to the south and southwest. This climb may be snowcovered and difficult to follow as late as April, so check trip reports or call the ranger station for a conditions report. If snow is still present, and you are confident in your navigational skills, head up on snow to the top of the bump. Until late May, the north side of the ridge may still be snowcovered for about 0.5 mile. After passing the 6318-foot point, the trail descends slightly to a saddle at 6770 feet, before starting up the south ridge of North Twentymile Peak. At 5.7 miles, 6930 feet of elevation, the trail leaves the burn and continues to climb through the open, stunted forest nearly at the treeline. The views to the south are a prelude to the expansive views from the summit. After a few short switchbacks, the 1940's lookout tower is reached and the 1920's lookout is short distance to the north. The summit area is an island of short alpine trees in a sea of recovering silver/black forest. The nearby views encompass the 2006 Tripod Complex which surrounds the peak, 2001 Thirtymile to the northeast, and 2003 Fawn Peak Complex to the west. The distant views include many prominent points: Remmel Mountain to the northwest, Windy Peak north-northeast, Tiffany Mountain to the southeast, and the Sawtooth Range directly south. In 2016, the old lookout was under renovation, with lots of piles of new supplies and old construction debris (broken glass, old boards with nails). Be aware of where you step, and leave old artifacts for future visitors. Toilet Information No toilet at trailhead More information about toilets Hike Description Written by Rolan Shomber, WTA Correspondent North Twentymile Peak Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-120.104983333, 48.7028666667], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "north-twentymile-peak"}, containerId = "map", hike = {"trailhead": [-120.104983333, 48.7028666667], "id": "north-twentymile-peak", "title": "North Twentymile Peak", "thumbnail": "https://www.wta.org/go-hiking/hikes/north-twentymile-peak/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 48.7029, -120.1050 Open in Google Maps Before You Go FR 5010 is impassible at the Twentymile Creek ford. See the driving directions for more details on a better route. See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From State Route 20 through Winthrop, turn north on West Chewuch Road (at a baseball field). Follow it for 6.8 miles to a stop sign at the junction with East Chewuch Road. Go straight at the stop sign. The road changes to USFS Rd 51. Stay on USFS 51 for 11.1 miles. Just past the Camp Four campground, turn right and cross the bridge over the Chewuch River. Stay right for USFS Rd-700. In 0.5 mile, bear left and follow USFS Rd-700 for 1.6 miles to the start of the trail on the abandoned road.Note that USFS Rd 5010 may not be a good alternative route as it is gated for part of the year and has a concrete stream ford. Print Email More Hike Details Trailhead North Cascades > Pasayten North Twentymile Creek (#560) Okanogan-Wenatchee National Forest, Methow Valley Ranger District Guidebooks & Maps Lookouts: Firewatchers of the Cascades and Olympics (Spring & Fish 1996) 100 Hikes in Washington's North Cascades National Park Region (Spring & Manning 1994) Green Trails Coleman Peak WA No 20 Green Trails Doe Mtn WA No 52 USGS Coleman Pk (7.5' 2017) USGS Spur Pk (7.5' 2017) Learn How to Hike in Bear Country Learn Hiking Maps and Why You Need Them You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
