["https://www.wta.org/news"]
title = "Stories & News — Washington Trails Association"
description = "Get the latest news, how-to advice, and feature articles about the trail community, the current hiking season and issues impacting trails you love."
full_description = "Stories &amp; News Get the latest news, how-to advice, and feature articles about the trail community, the current hiking season and issues impacting trails you love. https://www.wta.org/news https://www.wta.org/@@site-logo/wta-logo.png Stories & News Get the latest news, how-to advice, and feature articles about the trail community, the current hiking season and issues impacting trails you love. Get local news, how-to advice, and feature articles about our trail community, the current hiking season in Washington and issues impacting trails you love. Learn more about: WTA member magazine | Signpost blog Sign up for news, advice and action alerts: Trail News | Families Go Hiking | Trail Action Network Armchair Adventures: A perfect day for a second try Feb 28, 2025 When Alden Ryno headed for a winter summit of Tomyhoi Peak in the North Cascades, it was his second attempt. He wrote a trip report detailing how it all went. Read More Hiker Headlines: Wind damage, North Cascades permits, WTA's op-ed on Forest Service and Parks firings Feb 27, 2025 The early access lottery for North Cascades backcountry permits opens on March 3 — and other early access lotteries are closing soon. Big winds hit Washington earlier this week, so be careful of fallen trees and debris when hitting the trails this weekend! And read WTA’s op-ed in the Seattle Times on the recent federal staffing cuts. Read More WTA visits D.C. to urge rehiring of Forest and Park service staff Feb 25, 2025 This week, WTA’s policy and planning manager Michael DeCramer is in Washington, D.C. Along with partners, one of the key issues Michael will be discussing is the recent firing of thousands of U.S. Forest Service and National Park Service employees. Michael will be speaking to our state’s delegation and bringing the message of thousands of hikers who have asked for those firings to be reversed. Read More 10 easy ways to care for trails (and the outdoors) Feb 20, 2025 Trails give us so much — here are 10 easy ways to give back. Read More Hiker Headlines: Email Congress for public lands; last call for #lovelocaltrails; register for backcountry volunteer trips Feb 20, 2025 A reduction in Forest Service and National Park Service staff is putting our public lands and hikers at risk — take a few minutes to email your members of Congress. Registration for WTA's backcountry trips opens Saturday Feb. 22, at 10 a.m.! Don’t forget to enter our #lovelocaltrails giveaway by the end of the month. Fort Worden Historical State Park will start requiring Discover Passes. And we’ve got some warm, wet weather on the way. Read More What firing Forest Service, National Parks staff means for public lands, trails, communities Feb 19, 2025 Last week, thousands of hard-working Forest Service and National Park staff, including hundreds in Washington and Oregon, were fired by the current administration. The impact to public lands, recreation and communities across the state are immediate and far-reaching. Learn what's at stake and join WTA in calling for Congress to reverse the decision. Read More Tiny tents and tool time: 20 years of marriage, 18 years of volunteering Feb 14, 2025 Spokane-area assistant crew leaders Mary Beth and Jim Fitzgerald celebrated their 20th wedding anniversary on-trail last fall by joining a day work party. Their shared love of the outdoors has shaped their relationship and shines through in their commitment to both each other and to trails. WTA gives them a way to spend time together and give back to trails at the same time. Read More Hiker Headlines: WTA backcountry trips, Enchantments permit lottery, sign up for Hiker Rally Day Feb 13, 2025 The Enchantments permit advanced lottery opens Feb. 15 at 7 a.m. Join WTA and the Northwest Symphony for live music and beautiful photos. We need your help to vote for a renewal of the King County Parks Levy. Join us for in Olympia on March 18 to advocate for trails and public lands! And registration for WTA’s backcountry trips is starting soon. Read More Introducing WTA’s 2025 Emerging Leaders Program cohort Feb 13, 2025 We’ve spent January welcoming our 2025 Emerging Leaders Program cohort to WTA, and we’re excited to introduce them! Read More Volunteers restore accessible trail in the Columbia River Gorge Feb 12, 2025 How many elephants worth of gravel does it take to refinish a trail? Read More Sharing the weight and sharing the love: 14 things to share with your partner on trail Romantic partner? Platonic hiking companion? We won’t define your relationship — that’s up to you. But whoever you’re hiking with, here are a few lovable nuggets to consider for your next outing. By Joseph Gonzalez Read More How the Forest Service staffing crisis will affect your hike – and what you can do Feb 10, 2025 Right now, a budget crisis and staffing cuts at the Forest Service are threatening our ability to reach hikes in our state's national forests. So, we need your help. Your donation will help us maintain trails that the Forest Service cannot reach this summer, keeping these places open for you and other hikers. Read More Are Permit Lotteries Fair? Permit lotteries manage visitor numbers in scenic areas, but their distribution can be inequitable. Why do they exist, how can the process be improved, and what other solutions can be used to reduce the need for them in strapped-for-cash public lands? Read More Hiker Headlines: #LoveLocalTrails giveaway, Mount Rainier early access lottery opening soon, now hiring Feb 06, 2025 Our annual #LoveLocalTrails giveaway is underway! WTA is hiring for a member engagement manager. The early access lottery for Mount Rainier wilderness camping permits is opening on Feb. 10. And the snow this week has caused some closures — and, of course, be ready for snow when you’re heading out on trail! Read More What's the Tee? The scoop on WTA's backcountry shirts Feb 05, 2025 WTA's backcountry t-shirts are a favorite with our volunteers. Get a peek behind the scenes with graphic designer Jenica Nordstrom and preview this year's design. Read More Trip Report Roundup: Backpacking beaches, snowshoeing St. Helens, urban epics and quiet forest strolls Feb 04, 2025 From stunning winter wonderlands to blowdown-spotting on forest roads, we love reading all about your adventures on trail, and it's been really exciting to see some new names and faces showing up in our trip reports. Enjoy the views, adventures, updates and tips in trip reports from brand-new trip reporters these last couple of weeks. Read More Hiker Headlines: PCT Canada entry program discontinued, lowland snow this weekend Jan 30, 2025 The Canada Border Services Agency has discontinued the Canada Pacific Crest Trail Entry Permit program. There’s lowland snow in the forecast across the state this weekend! Olympic National Forest firewood permits are now available by mail. And Okanogan-Wenatchee National Forest has a prescribed burn planned next week. Read More Hiker Headlines: Hair ice and freezing temps, Rainier wilderness permit fees, Nisqually State Park closure Jan 23, 2025 Mount Rainier National Park has changed the prices for wilderness permits. Nisqually State Park is closed for construction starting next week through the fall. There’s a new way to look at how funds are being used through the Climate Commitment Act. And the cold temperatures we’ve been seeing will stick around for awhile. Read More How Kaf Adventures is helping climbers reach new heights and give back to trails Jan 22, 2025 WTA and Kaf Adventures have been partnering since 2017 to help give back to trails and further skills in the outdoors. Read More Why I hike through cities Jan 21, 2025 Most urban centers in Washington provide ample green space and pedestrian infrastructure to support refreshing strolls, invigorating day hikes or epic feats of endurance. Incorporate urban walks into your ventures outside this year. Read More A tight state budget means it’s time to show up for trails — here’s how Jan 16, 2025 This week kicks off the 2025 Washington state legislative session. The state budget is tighter than we've seen in years, and we know legislators will be making cuts. Tell your representatives that the physical and mental health benefits of getting outside should not be on the chopping block this, or any, year. Join WTA and other hikers in Olympia on March 18, 2025, for our Hiker Rally Day. Read More Hiker Headlines: Fee-free day, road closure, a big win in Congress Jan 16, 2025 Monday is Martin Luther King Jr. Day and parking fees are waived in some areas. Share your thoughts to help Washington State Parks develop a park on Miller Peninsula. In a big win, Congress just passed the EXPLORE Act! A road near the Quinault River is closed. Olympic National Forest has expanded their office hours. And Washington has sent firefighting aid to California. Read More How to pick a pair of snowshoes Snowshoes open up a whole new world in winter — here’s what to consider if you're looking for a pair. By Sandra Saathoff. Read More Hiker Headlines: Tiger Mountain, Squak Mountain trail closures; WTA winter workshops Jan 09, 2025 Some trails in the Issaquah Alps are closed due to storm damage. Join WTA for some upcoming events, including a free winter hiking workshop and a snowshoe workshop! And, the Washington Department of Natural Resources has released its statewide recreation plan for the next 10 years. Read More Backcountry Trips with WTA: How to Choose a Trip and Sign Up Discover how to spend a few days this summer volunteering with Washington Trails Association. Read More Share a story: Finding yourself on a summit journey Jan 08, 2025 From time to time, we like to share memorable moments from our community. Here’s one of those stories from Rizka Budiati-Szkutnik (@rizkapb on Instagram). Read More 2024 Northwest Exposure Photo Contest winners Take in the beauty of Washington's trails through the lens of talented photographers across the state. Read More How to actually achieve your hiking goals Do you have trouble sticking to your hiking resolutions? Goal-setting can help. Here's a template to help you get started. By Joseph Gonzalez Read More Hiker Headlines: WTA is hiring, Hoh Rain Forest closure, Oregon state park fee increases Jan 02, 2025 Happy New Year from all of us at WTA! We are currently hiring for a full-time professional crew coordinator. The Upper Hoh Road is temporarily closed due to imminent road failure. Olympic National Forest has announced some big forest health projects coming up. Some Oregon state park fees have increased for the 2025 season. And there’s snow hitting the mountains this weekend! Read More 29 hiking resolution ideas to find joy in 2025! Dec 30, 2024 Although number of hikes, mileage and elevation gain may seem like some of the most obvious hiking goals you can make, there are plenty of other hiking projects you can embark on that are just as fun and get you outside all the same. We've got some ideas for you. Read More 1 2 3 4 5 6 7 ... 34 Next 30 items"
