title = "Northwest Exposure Photo Contest — Washington Trails Association"
description = "Enter WTA's 2024 Northwest Exposure Photo Contest, Washington Trails Association's annual celebration of outdoor photography and the community of hikers that explore Washington's trails."
full_description = "Northwest Exposure Photo Contest Enter WTA's 2024 Northwest Exposure Photo Contest, Washington Trails Association's annual celebration of outdoor photography and the community of hikers that explore Washington's trails. https://www.wta.org/get-involved/events/photo-contest https://www.wta.org/get-involved/events/photo-contest/photocontest/@@download/image/NWX+logo+photo+by+Collin+Tasaka.png Northwest Exposure Photo Contest Enter WTA's 2024 Northwest Exposure Photo Contest, Washington Trails Association's annual celebration of outdoor photography and the community of hikers that explore Washington's trails. Northwest Exposure is WTA's annual photo contest that celebrates outdoor photography and the community of hikers that explore Washington's trails. The 2024 contest is now closed, however you can check out the winners here! Contest Information Benefits of entering Winners earn prizes and will be featured in WTA's annual calendar. All photos entered have the opportunity to be featured on WTA's social media and website, in Washington Trails Magazine and onstage at Benaroya Hall at our 2025 concert in collaboration with the Northwest Symphony Orchestra. everything you need to enter - Contest rules - Frequently asked questions - Prizes - What our judges love to see - Photography resources - Leave No Trace principles - 2024 Winners Contest Categories Northwest Exposure features four main categories with first, second and third prizes awarded in each category. One winner will be selected from each of our two bonus categories. A grand prize will also be awarded for the best overall photo. We welcome and encourage photographers of all experience levels to enter our contest. Main categories Each photographer may submit one photo per category. Trailscapes: Show us the stunning landscapes from your winter, spring, summer or fall hikes and the trails that brought you there. Hikers in Action: In camp or on trail, capture the wide range of activities, adventures and emotions you and fellow hikers experience on trail. Trail Family: Show us the faces of the people you love to hike with, whether they're given or chosen family. Flora and Fauna: Wildflowers, woods and creatures of all sizes. This category is judged in part by public voting. Bonus categories Each photographer may submit unlimited photos to each bonus category. Instagram: Show us your favorite photos from the trail! To enter, follow @washingtontrails and use the hashtag #nwexposure2024. Trails Next Door: Show us your beloved trails in your backyard. We’d love to see the trails close to your heart and home. We welcome photos in this category taken on trails that are... In walking distance of your home or community and/or Most often enjoyed by people who live in the immediate vicinity Sponsors Thank you to our 2024 sponsors!"
