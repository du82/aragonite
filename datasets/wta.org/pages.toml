["https://www.wta.org/go-hiking/hikes/happy-creek-nature-trail"]
title = "Happy Creek Nature Trail — Washington Trails Association"
description = "Hikers can choose from an easy loop partially along Happy Creek, or a longer hike to Happy Creek Falls, site of an old sawmill that supported the mining in the late 1800's."
full_description = '''Happy Creek Nature Trail Hikers can choose from an easy loop partially along Happy Creek, or a longer hike to Happy Creek Falls, site of an old sawmill that supported the mining in the late 1800's. https://www.wta.org/go-hiking/hikes/happy-creek-nature-trail https://www.wta.org/site_images/hikes/happy-cr-falls.jpg/@@download/image/happyCrk.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/happy-creek-nature-trail", "name": "Happy Creek Nature Trail", "description": "Hikers can choose from an easy loop partially along Happy Creek, or a longer hike to Happy Creek Falls, site of an old sawmill that supported the mining in the late 1800's.", "url": "https://www.wta.org/go-hiking/hikes/happy-creek-nature-trail", "image": "https://www.wta.org/go-hiking/hikes/happy-creek-nature-trail/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 35, "ratingValue": 3.9, "ratingCount": 7, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 48.72743529, "longitude": -121.062812805}} Happy Creek Nature Trail North Cascades > North Cascades Highway - Hwy 20 48.7274, -121.0628 Map & Directions Length 2.6 miles, roundtrip Elevation Gain 570 feet Highest Point 2,780 feet Calculated Difficulty About Calculated Difficulty Easy/Moderate A boardwalk stroll takes you by peaceful rushing water. Photo by Austineats. Full-size image Good for kids Old growth Rivers Waterfalls Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack Hikers can choose from an easy loop partially along Happy Creek, or a longer hike to Happy Creek Falls, site of an old sawmill that supported the mining in the late 1800's. Continue reading Rating 3.86 out of 5 (7 votes) Log in to rate 35 trip reports for this trail Write a trip report Hiking Happy Creek Nature Trail Hikers can choose from an easy loop partially along Happy Creek, or a longer hike to Happy Creek Falls, site of an old sawmill that supported the mining in the late 1800's. At the trailhead a very informative sign describes the history of the area and has a map of the nature trail.The first part of the trail is an ADA compliant loop through the old growth forest of 0.3 miles mostly on boardwalk. The right branch (south) is all on boardwalk and overlooks Happy Creek. Halfway around the loop is the junction with the trail to Happy Creek Falls. The return part of the loop has more gravel trail as it wanders around the old trees. The entire loop is very shaded, even on a sunny day. This is a good walk for young children. Even with a shallow gradient, the boardwalk can be pretty slick when wet, snowy or icy. From the nature trail, the trail to the falls is of a completely different character. The initial section climbs away from Happy Creek on a duff tread into a more open forest and a peek-a-boo view of Ross Lake and Jack Mountain. The trail traverses about 100 feet above State Route 20, so the road noise is quite evident. At 0.4 miles, a boot trail comes in from a pullout on SR 20. At 0.9 miles, the trail starts climbing steeply through the moss covered rock outcrops. The trail becomes quite rocky, even small streambeds in places. After leveling off and re-entering the old forest, the trail nears Happy Creek again. A short climb along the creek passes some of the antique saw mill equipment, before reaching the base of the falls at 1.3 miles. The falls are a series of short steps down a steep gully. In spring and late fall, the falls are fairly full. In late summer, they are a more of a trickle between the rocks. Toilet Information Toilet at trailhead More information about toilets Wheelchair Accessibility This entry covers both the Happy Creek Forest Walk and the longer Happy Creek Nature Trail. The forest walk is a 1/3 mile-long loop through forest that is paved and packed gravel and is ADA compliant in optimal conditions. Visitors may also be able to hike the Nature Trail depending on the chair and comfort navigating narrower trails. Hike Description Written by Rolan Shomber, WTA Correspondent Happy Creek Nature Trail Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-121.062812805, 48.72743529], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "happy-creek-nature-trail"}, containerId = "map", hike = {"trailhead": [-121.062812805, 48.72743529], "id": "happy-creek-nature-trail", "title": "Happy Creek Nature Trail", "thumbnail": "https://www.wta.org/go-hiking/hikes/happy-creek-nature-trail/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 48.7274, -121.0628 Open in Google Maps Before You Go See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From Newhalem, go east on State Route 20 for 14.0 miles to the trailhead parking on the right (between milepost 134 and 135). The trailhead has parking for 4 cars plus two ADA parking spots. The trailhead is only 0.5 mile beyond the western winter closure gate for State Route 20, making this a viable trip even in winter. Print Email More Hike Details Trailhead North Cascades > North Cascades Highway - Hwy 20 Happy Creek Nature Trail (#0) North Cascades National Park Guidebooks & Maps The Disabled Hiker’s Guide to Western WA and OR (Syren Nagakyrie) USGS Topographic Ross Dam (7.5') Buy the Green Trails Diablo Dam No. 48 map Learn How to Hike in Bear Country Learn Hiking Maps and Why You Need Them You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 'script', 'advocacy-actionwidget-code'));'''
