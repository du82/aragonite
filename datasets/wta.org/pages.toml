full_description = '''Point No Point Park The trail at Point No Point gives you both a glimpse into the past, as well as a bit of a workout and great views. With 3 acres in the Point No Point County Park and one hiking trail, the Point No Point lighthouse makes a great destination for visitors young and old. https://www.wta.org/go-hiking/hikes/point-no-point https://www.wta.org/site_images/hikes/20160307_143116-1.jpg/@@download/image/20160307_143116[1].jpg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/point-no-point", "name": "Point No Point Park", "description": "The trail at Point No Point gives you both a glimpse into the past, as well as a bit of a workout and great views. With 3 acres in the Point No Point County Park and one hiking trail, the Point No Point lighthouse makes a great destination for visitors young and old.", "url": "https://www.wta.org/go-hiking/hikes/point-no-point", "image": "https://www.wta.org/go-hiking/hikes/point-no-point/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 48, "ratingValue": 3.8, "ratingCount": 8, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 47.9115437036, "longitude": -122.529135151}} Point No Point Park Olympic Peninsula > Kitsap Peninsula 47.9115, -122.5291 Map & Directions Length 2.0 miles, roundtrip Elevation Gain 100 feet Highest Point 0 feet Calculated Difficulty About Calculated Difficulty Easy Shorebirds playing in the breeze at Point No Point. Photo by Anna Roth. Full-size image Coast Dogs allowed on leash Fall foliage Good for kids Mountain views Wildlife Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack The trail at Point No Point gives you both a glimpse into the past, as well as a bit of a workout and great views. With 3 acres in the Point No Point County Park and one hiking trail, the Point No Point lighthouse makes a great destination for visitors young and old. Continue reading Rating 3.75 out of 5 (8 votes) Log in to rate 48 trip reports for this trail Write a trip report Hiking Point No Point Park The trail at Point No Point gives you both a glimpse into the past, as well as a bit of a workout and great views.Now on the National Historic Register, Point No Point was referred to as Hahd-skus (long-nose) by local Native Americans, because of its location on a spit of land on the Kitsap Peninsula that protrudes prominently into Puget Sound. In 1841, explorer Charles Wilkes was disappointed to discover that what he thought might be a deepwater anchorage just off shore was nothing but shallow mud. He dubbed the area, somewhat petulantly, Point No Point. Just a few years later, the point played a part in ending the American Indian wars. In 1855, leaders of the S'Klallam Native American tribes, as well as those from the Chimacum and Skokomish tribes, signed the Point No Point Treaty with Governor Isaac Stevens. The treaty ceded land to the United States from the crest of the Olympics to Puget Sound and designated reservations for the tribes. Shortly after the treaty's signing, construction began on a lighthouse at the end of the point. Since its completion in 1879, it has operated continuously, guiding vessels of all sorts around the land it occupies, and the shallow waters surrounding it. It is the oldest still operating lighthouse on Puget Sound. In 1974, the Point No Point Treaty Council was established to ensure treaty rights are observed and help support the tribes affected by the treaty, which is still in effect, and gives hunting, gathering and fishing rights on public lands A rock mounted with a plaque and placed just outside the lighthouse is testament to this treaty. With 3 acres in the Point No Point County Park and one hiking trail, the Point No Point lighthouse makes a great destination for visitors young and old. Take the mile-long trail along shoreline, up a steep set of stairs to a viewing platform, and finally through bright forest along a ridgeline to another trailhead nestled in a neighborhood. Keep an eye out for seals and shorebirds in the water, even whales occasionally!WTA Pro Tip: One half of the lighthouse keeper's quarters is available for vacation rental. Hike Description Written by Anna Roth, WTA Staff Point No Point Park Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqOXJkbGdlNjY5ajIzM21xNm5uZXk3eWUifQ.padg8NGbni9aK8jaLiuTuA", "center": [-122.529135151, 47.9115437036], "showCustomControl": true, "enabledLayers": [{"id": "fire", "title": "Wildfires", "mapbox_sublayers": ["fire-perims-stroke", "fire-perims-fill", "fire-points"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "aqi", "title": "Today's AQI Forecast", "mapbox_sublayers": ["aqi-today"], "uses_transparent_raster_images": false, "is_on_by_default": false}, {"id": "snow", "title": "Snow Depth", "mapbox_sublayers": ["snowdepth"], "uses_transparent_raster_images": true, "is_on_by_default": true}], "hikeId": "point-no-point"}, containerId = "map", hike = {"trailhead": [-122.529135151, 47.9115437036], "id": "point-no-point", "title": "Point No Point Park", "thumbnail": "https://www.wta.org/go-hiking/hikes/point-no-point/photo1_thumb"}, map = new wta_map.HikeDetailMap(maplib, containerId, mapOptions); map.addMarkerFor(hike); } ); Trailhead Co-ordinates: 47.9115, -122.5291 Open in Google Maps Before You Go The park's parking lot is closed but the park is open to pedestrian traffic. Find a map of the road walk to reach the park here: https://www.kitsapgov.com/parks/Pages/PointNoPointPark.aspx See weather forecast Parking Pass/Entry FeeNone WTA Pro Tip: Save a copy of our directions before you leave! App-based driving directions aren't always accurate and data connections may be unreliable as you drive to the trailhead. Getting There From Tacoma, drive Hwy 16 west for 2.6 miles and get on the ramp to Gig Harbor/Bremerton. Stay on 16 west for 26.5 miles and then continue as the road becomes Hwy 3 north for 17.7 miles. Take the exit for Hwy 305 toward Poulsbo/Bainbridge Island, and use the right two lanes to turn right onto Hwy 305 S. Almost immediately, use one of the left two lanes to turn left onto Hwy 307 N/Bond Rd NE and continue for 5.2 miles. Continue onto Hwy 104 east for 1.5 miles, then turn left onto Hansville Road NE. Stay here for 7.4 miles, then turn right onto Point No Point Road NE. Drive for a mile, then turn right into the parking area for the lighthouse. Print Email More Hike Details Trailhead Olympic Peninsula > Kitsap Peninsula Kitsap County Parks Guidebooks & Maps Maps available at Buck Lake near Hansville Greenway Learn 16 Lighthouse Hikes You Can Enjoy All Year Learn Hiking Maps and Why You Need Them You can improve or add to this guidebook entry! Update page (function(d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.src = '//p2a.co/js/embed/widget/advocacywidget.min.js'; fjs.parentNode.insertBefore(js, fjs); }(document, 