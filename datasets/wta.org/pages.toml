title = "Falls Creek Falls — Washington Trails Association"
description = "Explore an easy, gently graded trail to Falls Creek Falls just outside of Winthrop. The first waterfall is just a quarter-mile from the trailhead and is accessible via a paved trail."
full_description = '''Falls Creek Falls Explore an easy, gently graded trail to Falls Creek Falls just outside of Winthrop. The first waterfall is just a quarter-mile from the trailhead and is accessible via a paved trail. https://www.wta.org/go-hiking/hikes/falls-creek-1 https://www.wta.org/site_images/hikes/falls-creek-falls_raring2hike.jpg/@@download/image/fallCrFall.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/falls-creek-1", "name": "Falls Creek Falls", "description": "Explore an easy, gently graded trail to Falls Creek Falls just outside of Winthrop. The first waterfall is just a quarter-mile from the trailhead and is accessible via a paved trail.", "url": "https://www.wta.org/go-hiking/hikes/falls-creek-1", "image": "https://www.wta.org/go-hiking/hikes/falls-creek-1/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 36, "ratingValue": 3.5, "ratingCount": 10, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 48.6345898, "longitude": -120.1559203}} Falls Creek Falls North Cascades > Methow/Sawtooth 48.6346, -120.1559 Map & Directions Length 2.6 miles, roundtrip Elevation Gain 750 feet Highest Point 2,920 feet Calculated Difficulty About Calculated Difficulty Easy/Moderate There are many tiers of easily accessible waterfalls on this trail. Photo by Peace4Mel. Full-size image Dogs allowed on leash Good for kids Waterfalls Wildlife Parking Pass/Entry FeeNone Add Hike to My Backpack Saved to My Backpack Explore an easy, gently graded trail to Falls Creek Falls just outside of Winthrop. The first waterfall is just a quarter-mile from the trailhead and is accessible via a paved trail. Continue reading Rating 3.50 out of 5 (10 votes) Log in to rate 36 trip reports for this trail Write a trip report Hiking Falls Creek Falls Explore an easy, gently graded trail to Falls Creek Falls just outside of Winthrop. The first waterfall is just a quarter-mile from the trailhead and is accessible via a paved trail. If your thirst for falling water isn't quenched by just one, follow a gentle switchback from the lower viewpoint to the top of the first falls. Here you can enjoy views of an upper falls in addition to the water rushing over the rocks that creates the lower falls. The trail continues up, becoming steeper and narrower, climbing for about a mile before leveling off to a flatter grade. As you hike along, listen for the river babbling far below and enjoy views of two more waterfalls. Those hikers with little ones may want to refrain from this section; here the trail can be a little intimidating for kids. If you're confident about your footing, continue for another half mile before ending at a road where a bridge spans Upper Falls Creek. Turn around here and enjoy the four waterfalls on your way back down. Toilet Information Toilet at trailhead More information about toilets Hike Description Written by Anna Roth, WTA Staff Falls Creek Falls Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url = $('body').attr('data-portal-url'); require.config({ "baseUrl": portal_url + '/++resource++wta.content', "urlArgs": "v=5.20", "paths": { "wtamaps": "maps", "maplib": "maps/vendor-mapbox/v2.6.1" } }); require( [ 'wtamaps/mapbox_wta', 'maplib/mapbox-gl' ], function (wta_map, maplib) { console.log("Container: " + map); var mapOptions = {"initialZoom": 11, "minZoom": 6, "scrollZoom": false, "markerIconUrl": "https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg", "neBound": [-111.833808, 49.870505], "swBound": [-129.403348, 44.637529], "mapstyle": "mapbox://styles/wta/clowbp1s6009x01r75m8pajgm", "accessToken": "pk.eyJ1Ijoid3RhIiwiYSI6ImNqO