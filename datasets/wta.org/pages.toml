["https://www.wta.org/get-involved/join/other-ways-to-give/endowments/endowments"]
title = "Endowments and Funds — Washington Trails Association"
description = "Washington Trails Association has endowments to help making a lasting impact on our trails and wildlands."
full_description = '''Endowments and Funds Washington Trails Association has endowments to help making a lasting impact on our trails and wildlands. https://www.wta.org/get-involved/join/other-ways-to-give/endowments https://www.wta.org/@@site-logo/wta-logo.png Endowments and Funds Washington Trails Association has endowments to help making a lasting impact on our trails and wildlands. You can make a lasting impact on our trails and wildlands by making a gift to one of Washington Trails Association's endowments or designated funds. Thanks to the foresight of our members and supporters, WTA has four funds where your contribution can grow and be used in a sustainable manner over time. Though their full impact can only be measured over several generations, these funds are already making a difference for the hiking community and for the trails and wildlands you love. To make a gift to a WTA Endowment Fund, please contact Andrea Michelbach, Development Director, at amichelbach@wta.org or (206) 557-3402. Greg Ball Trail Fund Greg Ball, founder of WTA's trail maintenance program. The Greg Ball Trail Fund honors the legacy of Greg Ball, who founded Washington Trails Association's trail maintenance program in 1993. The Trail Fund was set up specifically at Greg's request to generate income for volunteer trail maintenance in Washington. The Fund provides a steady source of private revenue to match volunteer efforts and stretch limited public dollars so that hiking trails in Washington will remain well taken care of for generations to come. Thanks in part to support from the Greg Ball Trail Fund, WTA's trail maintenance program has become one the largest and most-respected programs of its kind in the nation. Volunteers have contributed more than $9 million in donated labor to our parks and forests through the program. In 2008, the Fund reached an important milestone with $500,000 in gifts received. With your gift to the Greg Ball Trail Fund, you'll join more than 400 individual, foundation and corporate contributors who are making a lasting impact on hundreds of miles of trails statewide. Impact Fund Craig McKibben and Sarah Merner WTA's Impact Fund was established in 2014 by Craig McKibben and Sarah Merner to support WTA's mission to preserve, maintain and enhance trails and hiking opportunities in Washington state. The purpose of the Impact Fund is to support urgent, high-priority projects whether they involve trail work, youth programs, communications or advocacy. Whether it's responding to flood damage or taking advantage of a new opportunity to expand our work with youth, the Impact Fund was established to help WTA move quickly. Your gift to the Impact Fund will allow WTA to respond when high-priority needs and opportunities arise. For example in 2015, the Impact Fund will help repair trails in the Glacier Peak Wilderness, newly accessible thanks to the recent reopening of the Suiattle River Road. "When people contribute to the Impact Fund," says Craig, "they'll know they are making possible new projects that are beyond the day-to-day. Projects supported through the Fund will make significant strides towards achieving WTA's mission." Youth Endowment The Youth Endowment supports WTA programs that take youth outside to connect with nature and give back to our wildlands. The idea for the fund came from then-board member Ken Mondal. “Leaving something of an environmental legacy is important to me and I am glad that I found just the right organization to help me accomplish that,” says Mondal. “My ultimate hope,” shares Ken, “is that the Youth Endowment will influence many future generations of youth and instill in them a deep love and reverence for our forests and trails.” He hopes his contribution will inspire others to contribute to WTA’s youth programs. Your gift to the Youth Endowment will help future generations discover the wonders of nature and become the environmental leaders of tomorrow. The Stusser Fund for Hiker News and Reports WTA is proud to be the state's premiere resource for hikers, a legacy that has a secure future with the help of the Stusser Fund. Washington Trails magazine provides hikers with the information and inspiration to plan their next adventure—and to take care of the trails they enjoy. WTA's website, which has become the go-to hiking resource for 400,000 annual visitors, features a comprehensive Hiking Guide and hiker-submitted Trip Reports. The Stusser Fund supports new features in our magazine and website that allow WTA to better serve hikers. The endowment’s founding donors, Herb and Isabel Stusser, are long-time WTA members with a particular appreciation for the information WTA provides to hikers. “I’ve always loved the magazine and have read it cover-to-cover from the beginning,” Herb says. “It has given our family countless ideas for hiking locations in Washington. As for the web-page, I think it’s fantastic: so much good information in a very easy-to-use format. These two resources are the reason Isabel and I wanted to establish a fund that will help to support and enhance them over the years.” It is Herb and Isabel Stusser’s hope that by establishing this endowment, they’ll encourage others to support WTA’s key communication tools for the long-term. Your gift to the Stusser Fund will help support a lifetime of outdoor adventure and exploration, for you and for generations to come. Washington Trails Association Endowment The Washington Trails Association Endowment was established to provide support for WTA's entire mission and ensure that we can continue to support the hiking community for generations to come. These funds are used where they're needed most, whether that's to take care of a trail, represent hikers in Olympia or DC or provide education and information to help more people get outside. Make a Lasting Impact We hope you'll consider making a tax-deductible contribution to one of our endowments or designated funds. Donate now via our secure online form or find out how to make a planned gift. For more information, please contact Andrea Michelbach, Development Director, at amichelbach@wta.org or (206) 557-3402. Washington Trails Association is a nonprofit, 501c3 organization. Tax-ID: 91-0900134. Contributions are tax deductible to the extent of the law.'''
year_published = 2025
