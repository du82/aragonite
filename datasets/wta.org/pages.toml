title = "Devil's Ridge — Washington Trails Association"
description = "Connect between the PCT and Ross Lake as you take in the incredible sights of the Pasayten Wilderness. Pass over ridges and stop to explore and admire the popular Devil's Dome."
full_description = '''Devil&#x27;s Ridge Connect between the PCT and Ross Lake as you take in the incredible sights of the Pasayten Wilderness. Pass over ridges and stop to explore and admire the popular Devil's Dome. https://www.wta.org/go-hiking/hikes/devils-ridge https://www.wta.org/site_images/hikes/devils-ridge.jpeg/@@download/image/devilsRidge.jpeg {"@context": "http://schema.org/", "@type": "LocalBusiness", "@id": "https://www.wta.org/go-hiking/hikes/devils-ridge", "name": "Devil's Ridge", "description": "Connect between the PCT and Ross Lake as you take in the incredible sights of the Pasayten Wilderness. Pass over ridges and stop to explore and admire the popular Devil's Dome.", "url": "https://www.wta.org/go-hiking/hikes/devils-ridge", "image": "https://www.wta.org/go-hiking/hikes/devils-ridge/@@image/thumb", "aggregateRating": {"@type": "AggregateRating", "reviewCount": 39, "ratingValue": 2.4, "ratingCount": 5, "worstRating": 0, "bestRating": 5}, "geo": {"@type": "GeoCoordinates", "latitude": 48.8395794894, "longitude": -120.737424271}} Devil's Ridge North Cascades 48.8396, -120.7374 Map & Directions Length 18.8 miles, one-way Elevation Gain 3,100 feet Highest Point 7,000 feet Calculated Difficulty About Calculated Difficulty Hard Devil's Ridge. Photo by jndupuy. Full-size image Fall foliage Mountain views Ridges/passes Summits Wildflowers/Meadows Wildlife Parking Pass/Entry FeeNorthwest Forest Pass Permits Required Wilderness permit. Self-issue at trailhead (no fee) Add Hike to My Backpack Saved to My Backpack Connect between the PCT and Ross Lake as you take in the incredible sights of the Pasayten Wilderness. Pass over ridges and stop to explore and admire the popular Devil's Dome. Continue reading Rating 2.40 out of 5 (5 votes) Log in to rate 39 trip reports for this trail Write a trip report Hiking Devil's Ridge This Pasayten Wilderness trail connects the PCT to the Ross Lake National Recreation Area. Make your way east to west beginning at Holman Pass. Walk along side hill, skimming the timberline as you traverse the ridge. There are a few trails that connect to this one, giving hikers a variety of options for overnight trips. Enjoy views of peaks from the ridge, wildflowers in the summer, and the popular Devil's Dome. Starting from Holman Pass, the trail quickly ascends the ridge through a few switchbacks. Make your way through the trees to Sky Pilot Pass, where the trail meets with the Canyon Creek trail. Continue right to stay on the trail towards Devil's Dome, and dip back down through Deception Pass. Keep an eye out for black bears exploring the sides of the ridge in search of berries. Past Deception Pass, the trail continues to roll along the ridge to Devil's Pass. This is the junction with the Jackita Ridge trail. Turn right, and make your way towards Devil's Dome. Jack Mountain is ahead and to the left. The views on all sides are spectacular. As you continue along the ridge, pass over the top of Devil's Dome and Dry Creek Pass. A side trail takes you towards Spratt Mountain, but not all the way there. The rest of the trail descends back through the meadows and into the trees. After 4.3 miles, hit the border of the Ross Lake Recreation Area, where the Forest Service trail ends and the Devil's Dome Trail begins. The trail continues for a mile to Devil's Junction Camps, where it ends. In the fall, the trees turn brilliant shades of yellow and red. This trail is part of WTA's Lost Trails Campaign. Learn more about how we're saving lost trails across the state here. WTA worked here in 2017, 2015, 2012 and 2010! Hike Description Written by McKenzie Carlson, WTA Correspondent Devil's Ridge Map & Directions #map { height: 500px; } .marker { background-image: url("https://www.wta.org/++theme++plonetheme.wta/images/svg/location-orange.svg"); background-size: contain; background-repeat: no-repeat; width: 29px; height: 37px; /* Restore this only if clicking does anything */ /* cursor: pointer; */ } var portal_url 