full_description = "Corporate Partners Washington Trails Association is proud to partner with companies that share our commitment to protecting hiking trails and getting people outdoors. https://www.wta.org/our-work/about/corporate-sponsors https://www.wta.org/@@site-logo/wta-logo.png Corporate Partners Washington Trails Association is proud to partner with companies that share our commitment to protecting hiking trails and getting people outdoors. The Commerce Bank of Washington Washington Trails Association is proud to partner with companies that share our commitment to protecting hiking trails and getting people outdoors. Our corporate partners help WTA protect trails and wildlands where we live, work and play—from the Cascade foothills to our national parks. Together, we support the Northwest's quality of life and the well-being of our economy: active recreation is a $22 billion industry in our state. Learn more about how your company can partner with WTA to support trails. Presenting Partner | $100,000+ Level $25,000+ Level $10,000+ Level $5,000+ Level $2,500+ Level $500+ Level SYML | Royal Robbins | Kleinschmidt Group | Yonder Cider | Bale Breaker | The Commerce Bank of Washington Matching GIFT SPONSORS ($5,000+) Apple | Bill and Melinda Gates Foundation | The Boeing Company | Google | Microsoft"
