full_description = "Sign Up Share Print Email Keep up-to-date on the news that affects the trails you love with WTA's newsletters. Trail NewsWhen you receive Trail News each month, you'll stay up to date on the best places to hike and the news and issues that mean the most to the hiking community. Families Go HikingSubscribe to our Families Go Hiking Newsletter and get the latest on programs and other ways to get your family outside, right to your inbox. Trail Action NetworkReceive periodic alerts and updates about important issues that affect hikers, as well as invitations to events and tips for advocating for Washington's trails. TIPS & ADVICE Hiking with KidsHiking with kids is a great opportunity to make memories, connect to the natural world and get exercise and fresh air. Trail SmartsFrom etiquette to safety to leaving the trails better than you found them. New to Hiking?We'll help you get started hiking, backpacking or camping. On TRAIL with WTA VolunteerJoin a work party for a fun and rewarding way to give back to the places you love to hike. Outdoor Leadership TrainingWorkshops, gear and grants to empower teachers and youth groups with the skills and resources they need to lead safe and fun outdoor experiences."
