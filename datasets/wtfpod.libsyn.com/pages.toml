["https://wtfpod.libsyn.com/episode-1337-phil-tippett"]
title = "WTF with Marc Maron Podcast: Episode 1337 - Phil Tippett"
description = "Oscar and Emmy-winning visual effects artist Phil Tippett is responsible for some of the most memorable effects in movies history, like the alien chess match in Star Wars, the giant robot walkers in The Empire Strikes Back, the ED-209 in RoboCop and more. And because his work is almost always rooted in stop-motion animation, Phil tends to be meticulous. It’s why, as he tells Marc, he started his first film 30 years ago and it’s only complete now. They talk about the creation of this movie, Mad God, and how it drove Phil to the brink."
