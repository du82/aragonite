["https://wtfpod.libsyn.com/episode-1290-guillermo-del-toro"]
title = "WTF with Marc Maron Podcast: Episode 1290 - Guillermo del Toro"
description = "Guillermo del Toro believes in one universal truth: We all get to a moment in our lives when we see ourselves for who we really are. That belief not only guides his own life, it guides the characters through his many films. Guillermo and Marc talk about how he takes on the dark forces of the world in his movies, including his latest, Nightmare Alley. They also discuss his friendship with fellow Oscar-winning directors Alejandro González Iñárritu and Alfonso Cuarón, his expansive collection of oddities, and his strong identification with outsider characters and monsters."
