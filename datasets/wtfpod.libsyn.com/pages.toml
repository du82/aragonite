full_description = "Marc pays tribute to his creative collaborator and romantic partner Lynn Shelton, who passed away at age 54 on May 16, 2020. This episode includes her August 2015 interview on WTF. During a victory lap for their movie Once Upon a Time in Hollywood, Brad Pitt and Leonardo DiCaprio put movie stardom on hold for an hour to have a chat with Marc. They talk about their early days as show business outsiders, the moment they knew their lives would never be the same, the times they've known a movie they're in is going to tank, why they don't want to direct and why they love to produce. This episode is sponsored by SimpliSafe and Everything's Gonna Be Okay on Freeform."
