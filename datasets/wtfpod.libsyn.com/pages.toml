["https://wtfpod.libsyn.com/2022/04"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "It’s normal for everyone to call Troy Andrews by his stage name, Trombone Shorty, because he’s been playing the trombone since he was a tiny, four-year-old boy. Troy and Marc talk about the musical culture of New Orleans, growing up in the Treme, touring with Lenny Kravitz right out of high school, becoming the frontman of his own band, making the trombone a featured instrument, creating a musical education academy, and recording his new album, Lifted, which is inspired by his mother. Vanessa Bayer knows her comedic talent comes from a decidedly unfunny place. Vanessa’s teenage cancer diagnosis focused her comedy skills, which in turn allowed her to help people process, understand and laugh at horrible things. Vanessa and Marc talk about how her natural optimism guided her through this health crisis and also put her in a great headspace for the Saturday Night Live audition process. Vanessa also explains why she incorporated her real life medical history into her new comedy series, I Love That For You. Robert Eggers was never into Vikings or hand-to-hand combat or macho stuff. And yet he just made the Viking movie to end all Viking movies, filled with brutal violence and macho posturing. But as he tells Marc, making The Northman was all in the service of his quest to transmit the sublime. Robert and Marc talk the meticulous attention to detail he brings to his films, how he’s fascinated by the search for belief amidst ritual and fantasy, and how he grew up loving comic books but would now rather make movies like The Witch and The Lighthouse than a superhero story. The guiding philosophy in the life of Harvey Fierstein is simple: Say yes. As he put together his new memoir, I Was Better Last Night, it was clear to Harvey his extraordinary life relied on saying yes to opportunities, yes to activism, and yes to his own self worth. Harvey and Marc talk about the challenges of dealing with the past in memoir writing, the importance of telling the stories of gay culture in the ’60s and ’70s, and the evolving understanding of gender and identity."
year_published = 2022
