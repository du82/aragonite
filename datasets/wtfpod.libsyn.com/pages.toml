title = "WTF with Marc Maron Podcast: Episode 1283 - Bill Pullman"
description = "Bill Pullman’s upbringing in rural Western New York prepared him for a multifaceted life, since he always had to keep his options open. So aside from being an actor, Bill’s also been a theater teacher, a rancher, a fruit grower, even a traveling Shakespeare performer in Montana. Bill and Marc talk about how he incorporated dream analysis into his performances in both David Lynch’s Lost Highway and his current show The Sinner, why Spaceballs was actually a great crash course in movie acting, and what’s the root cause of the timeless Pullman-Paxton confusion."
