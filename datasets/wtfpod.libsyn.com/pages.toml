["https://wtfpod.libsyn.com/2022/03"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Comedian Guy Torry spent 13 years creating and running the most famous all-black comedy night in America at The Comedy Store. And now Guy just spent another 13 years making a documentary about that influential weekly comedy show, Phat Tuesdays. Guy and Marc talk about the limited opportunities for Black comedians in mainstream clubs and how the racially divided climate of 1990s Los Angeles highlighted the need to fill a comedy void. Guy explains the importance of comedian Robin Harris in mentoring young comedians and how comics like Martin Lawrence, Bernie Mac and others thrived in the new environment. The Red Hot Chili Peppers have been around for almost 40 years and Flea has been there for every minute of it. He and Marc talk about Flea’s jazz-based upbringing that made him the bassist he is today, the various incarnations of the band, and the current reunion with multi-time bandmate John Frusciante for their new album, Unlimited Love. Flea also talks about the heartbreak of losing the Chili Pepper’s founding guitarist Hillel Slovak to drug addiction and the demons the rest of the band have fought to overcome. Sam Jay has a lot of irons in the fire. She’s on the comedy series Bust Down, she has her own HBO late night show Pause, and she never stops doing standup. Sam tells Marc that standup is the one thing that’s guided her through it all, whether it was getting through tough personal times when she was younger or when she was hired as a writer on SNL with no formal writing experience. It’s always been standup that served as her North Star, which she now uses as a way to communicate across generational and racial divides. Jeff Foxworthy still cringes when he knows other comics are watching his work. That persistent insecurity and the desire to always stay funny is why Jeff has a new Netflix special and a whole new act. Jeff talks with Marc about the drive that made him quit his job at IBM to try and get on Johnny Carson. They also talk about how he formed the Blue Collar Comedy Tour and how he feels about being known for his “You Might Be A Redneck” hook even though it hasn’t been part of his act for 20 years."
year_published = 2022
