["https://wtfpod.libsyn.com/2021/page/2/size/10"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "WTF takes over the historic Paris Theater in New York City for the first live audience episode of the show in more than six years. Marc is joined by film critic and historian Jason Bailey, author of the new book Fun City Cinema. They get into what the movies tell us about New York and what New York tells us about ourselves. Marc and Jason go over this history of movie making in NYC, including a deep dive into The Taking of Pelham 123 from Jason’s Fun City Cinema podcast. Ridley Scott has a secret weapon as a filmmaker and it probably has a lot to do with his career longevity and versatility. As a young boy, he would draw everything, and to this day he still storyboards every one of his films with his own drawings. That helps him deliver the finished product efficiently, often under schedule and under budget. Marc talks with Ridley about how he worked his craft on films like Blade Runner, Thelma and Louise, Black Hawk Down, Gladiator, American Gangster, and his two most recent films, The Last Duel and House of Gucci. Kenneth Branagh had a lot on his mind when making the movie Belfast, a film based on his own childhood. He thought mostly about loss. Loss of family, loss of where you come from, loss of innocence. As Kenneth tells Marc, he’s been thinking about loss a lot lately and figuring out how to strike a balance between heartbreaking and heartwarming. Marc and Kenneth also talk about the importance of visiting the graves of people you admire, what discovering Shakespeare did for Kenneth at a young age, why he might be ready to play King Lear, and why he worries about something actors call The Bleed. George Clooney is 60. Which means, much like Marc, he’s always reminding himself that he doesn’t know how much time he has left. George tells Marc how this mindset affects all his decisions, whether it’s the projects he takes on, the causes he fights for, or the time he frees up to spend with his children. They also discuss George’s directorial work, including his latest film The Tender Bar, his introduction to show business by his father and his Aunt Rosemary, and his thoughts on avoiding further tragic accidents involving guns on movie sets."
year_published = 2021
