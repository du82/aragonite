["https://wtfpod.libsyn.com/episode-1340-jen-statsky"]
title = "WTF with Marc Maron Podcast: Episode 1340 - Jen Statsky"
description = "When Jen Statsky and her collaborators were creating the show Hacks, they knew they needed to nail the portrayal of life in standup comedy because comics will quickly know if they got it wrong. Marc talks with Jen about how they did, indeed, nail it. They also talk about her work at The Onion and on shows like Parks and Rec, The Good Place, Broad City and Lady Dynamite. Plus, Jen and Marc talk about stuffing your feelings, getting better at acknowledging them, and understanding why growing up in Boston might lead you to ignoring them."
