["https://wtfpod.libsyn.com/episode-1343-atsuko-okatsuka"]
title = "WTF with Marc Maron Podcast: Episode 1343 - Atsuko Okatsuka"
description = "Comedian Atsuko Okatsuka has familiarity with garages. But unlike Marc, she didn’t start a podcast in one. She lived in one with her mother and grandmother for seven years, as three generations of immigrant women dealt with cramped quarters, eating disorders and schizophrenia. Atsuko tells Marc how she was unaware as a young girl that her trip from Japan to America was going to become permanent and how her discovery of standup comedy helped her find her voice."
