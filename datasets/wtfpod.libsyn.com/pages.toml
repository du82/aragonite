["https://wtfpod.libsyn.com/2021/09"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Rosebud Baker knows all about the fine line between sadness and funny. She’s learned how to get laughs out of the tragedy that befell her family, her alcohol addiction, her co-dependent and abusive relationships, and her grandfather, who happened to be one of the most powerful people in the world. Marc and Rosebud also talk about how she found stability in her life and how she’s going about rebuilding her standup act after turning out her first special. Even when he was a kid, B.J. Novak wanted to achieve greatness. His hard work and ambition brought him to Harvard, to the Lampoon, to doing standup, to getting on The Office, to writing a massively successful children’s book, to directing movies and creating the new anthology series The Premise. But one thing remained elusive: B.J. couldn’t really understand why Marc Maron seemed to dislike him so much. It’s a mystery Marc himself wasn’t sure he could solve. Until now, in the garage, face to face. From October 2011, Marc's revelatory conversation with Norm Macdonald about life, comedy, gambling, death and Rodney. Norm died on September 14, 2021 at age 61. Marc revisits his conversation from earlier this year with actor Michael K. Williams. Michael died at age 54 on September 6, 2021."
