title = "WTF with Marc Maron Podcast: Episode 1292 - Rory Cochrane"
description = "When Rory Cochrane started acting, he knew he didn’t want to be a movie star. He wanted to be a freight train that keeps on moving. Rory tells Marc about the practices and measures he put in place to attain his goal of career longevity and artistic satisfaction. They also talk about why it’s important for him to work on productions where the crew is treated well, why he asked to leave CSI: Miami when it was still the biggest show on TV, and what led to some of his pivotal career moments in movies like Dazed and Confused, Black Mass, and Argo."
