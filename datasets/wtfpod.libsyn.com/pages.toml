title = "WTF with Marc Maron Podcast: Episode 1285 - Jennifer Hudson"
description = "Jennifer Hudson didn’t start singing with her eyes open until she was 19 years old. That’s not a metaphor. Jennifer tells Marc how she was so afraid to sing in public, the only way she could do it was by closing her eyes. They talk about what it was like to finally feel brave enough to open them and the doors that also opened up when she did. Jennifer explains the centrality of church in her life, how faith helped guide her through unspeakable tragedy, and why she got Aretha Franklin’s blessing to portray her in the movie Respect."
