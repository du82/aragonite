["https://wtfpod.libsyn.com/episode-1288-cat-power"]
title = "WTF with Marc Maron Podcast: Episode 1288 - Cat Power"
description = "At one point, Chan Marshall was in a band called Cat Power. But it’s appropriate for someone like Chan, who had to be self-reliant almost from birth, that she’d adopt the name as her own once the band dissolved. Chan and Marc talk about her rebirth as Cat Power, the Atlanta music scene in the early ‘90s, carrying trauma throughout her life, and finding out that making music grounded her in something real for the first time. They also focus on her eclectic collections of cover songs as she prepares to release another album of them."
