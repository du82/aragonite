["https://wtfpod.libsyn.com/page/7/size/10"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Most people who know David Manheim don’t know him as David Manheim. To fans of the Dopey podcast, he’s just Dave (no last name given), a recovering drug addict who built a tight-knit digital community around addiction, recovery and being human. David talks with Marc about how his career in show business fizzled out as addiction took hold of his life and how starting a podcast with a friend he met in recovery was his salvation. They also talk about Dave’s other life at Katz’s Deli and they get into the important hierarchy of deli meats. Recently, Marc talked with television historian David Bianculli about The Smothers Brothers Comedy Hour and the important place it holds in American culture. Talking with Tom and Dick Smothers themselves, Marc finds that the brothers are as surprised as anyone that they left such an indelible mark. Starting with an act that grew out of the folk music scene, Tom and Dick talk about the evolution of their variety show, how they wound up locking horns with the network that ultimately fired them, and why they’re getting back on stage after 12 years of retirement. When Rory Cochrane started acting, he knew he didn’t want to be a movie star. He wanted to be a freight train that keeps on moving. Rory tells Marc about the practices and measures he put in place to attain his goal of career longevity and artistic satisfaction. They also talk about why it’s important for him to work on productions where the crew is treated well, why he asked to leave CSI: Miami when it was still the biggest show on TV, and what led to some of his pivotal career moments in movies like Dazed and Confused, Black Mass, and Argo. Aida Rodriguez wanted her first HBO special to be more than a comedy show. She wanted to depict the parts of her past that are foundational to her comedy. So that’s why she filmed a short documentary about her visits to Puerto Rico and the Dominican Republic, as she reunited with the father she hadn't seen in 40 years. Marc and Aida talk about how she got comedy material out of a life story that included being kidnapped twice, finding herself raising her children without a home, and breaking into the business later in life."
