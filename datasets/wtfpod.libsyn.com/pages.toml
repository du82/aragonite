["https://wtfpod.libsyn.com/2022/01"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Tony Kushner is one of the most important American playwrights of the past 50 years who is now a creative partner of one of the most important American filmmakers of the last 50 years. Tony talks with Marc about working with Steven Spielberg on Munich, Lincoln and the new adaptation of West Side Story. They also discuss the history of Jews in the Louisiana lumber industry, the pivotal moment of Angels in America that came to him in a dream, and the play he saw when he was six that made him want to be a part of the theater community. Film critic Dana Stevens took her love for Silent Movie Era star Buster Keaton and told the story of the 20th century film industry as it evolved alongside Buster’s own life. Marc talks with Dana about her new book, Camera Man, which is not just a biography of Keaton. It’s a look at the politics of film, the beginning of the studio system, the start of film criticism, the rise and fall of early movie stars, and how America dealt with the seismic change that was ushered in by this new art form. Peter Dinklage spent a good portion of his life trying to come to terms with ambition. It's something he's had an adversarial relationship with, going back to the days when he started a theater company that mounted no productions. But Peter tells Marc how he got more comfortable with having an acting career and how he learned to embrace mainstream success, whether it was from his star turn in The Station Agent or his work on Game of Thones or his latest film, the new adaptation of Cyrano. Hear Marc's two conversations with comedian and actor Louie Anderson from June 2016 and April 2018. Louie died on January 21, 2022 at age 68. John Mellencamp considers his whole career to be a total fluke. Maybe that’s because he never planned for anything in his life and just let the chips fall where they may. As he releases his twenty-fifth studio album, Strictly A One-Eyed Jack, John tells Marc what he learned opening for The Kinks, why he had to take the name Johnny Cougar, why he still hasn’t written something that makes him proud, and why David Letterman’s mom attributed Dave’s career to John."
year_published = 2022
