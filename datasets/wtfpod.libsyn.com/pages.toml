["https://wtfpod.libsyn.com/page/5/size/10"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "W. Kamau Bell has talked with Marc before about his life, his comedy and his thoughts about the world. But this time there’s a single topic that needs to be addressed: Bill Cosby. Kamau tells Marc why he decided to make the documentary series We Need To Talk About Cosby, the obstacles he encountered in getting it made, the comedians who wouldn’t talk to him, and the backlash he’s received for making the doc. Kamau also explains what happened when Cosby was released from prison while they were still shooting. From 2014, Marc talks with John Szeles, better known as The Amazing Johnathan, about his life doing comedy and magic, often at the same time. John died on February 22, 2022 at age 63 From 2017, Marc talks with Mark Lanegan, the former frontman of Screaming Trees, about the '90s grunge scene and his collaborations with various artists. Mark died on February 22, 2022 at age 57. Andy Garcia says it’s surreal to look back on his early life as a shy Cuban exile who was idolizing famous actors and filmmakers, only to be reminiscing now about the work he’s done with Sean Connery, Al Pacino, Robert DeNiro and so many others. Andy and Marc talk about his years in LA with no acting work, his improv group at The Comedy Store, and how he was supposed to play the henchman in The Untouchables. They also talk about Andy being part of The Godfather films, with the original being the movie that made Andy want to become an actor in the first place. Roy Wood Jr can’t be angry on stage. He wants to be angry. But he believes his face is too round to be angry. Now, whenever Roy wants to say something mean in his act, he knows he has to smile while he does it. Roy tells Marc how he learned to navigate the way audiences perceive him while doing the Southern standup circuit and honing his skills on The Daily Show. He also explains how doing the show Finding Your Roots upended what he thought was the truth of his life story and prompted him to undertake a personal journey. Ana Gasteyer learned a major life lesson from Will Ferrell and it has nothing to do with their time together on Saturday Night Live. It was about making choices, square dancing and knowing how to have fun. Ana and Marc talk about how much fun she’s had in her life and career, including her time in the Groundlings, her work on Broadway and her roles in ensemble comedies like her new series American Auto. She also talks about the circle of friends she still keeps from her time on SNL and the bond she has with cast members whenever she meets them."
