title = "WTF with Marc Maron Podcast: Episode 1344 - Laura Veirs"
description = "Singer-songwriter Laura Veirs has something to prove with her latest album, Found Light. After divorce ended her 20-years-long collaborative relationship with her producer husband, Laura not only needed to prove she could create a new album independently, but she needed to be sure of who she was in the world going forward. Laura and Marc talk about love and loss and the power of therapeutic mushrooms. They also talk about how Laura suffers from imposter syndrome when she’s around her other collaborators, k.d. lang and Neko Case."
