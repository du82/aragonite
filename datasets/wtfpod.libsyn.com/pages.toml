["https://wtfpod.libsyn.com/episode-1267-julie-delpy"]
title = "WTF with Marc Maron Podcast: Episode 1267 - Julie Delpy"
description = "American audiences fell in love with Julie Delpy as the romantic French traveler Celine in Before Sunrise and its two sequels. But Julie didn’t have an equal love affair with the making of Hollywood films. She tells Marc that she was always happier as a writer and director, and her ongoing fight against institutional biases and sexism left her more than a little frustrated. With her new comedy series on Netflix, On The Verge, Julie is creating an unfortunately rare depiction of women in their 40s and 50s."
