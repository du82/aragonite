full_description = "Jennifer Lee Pryor was there for Richard Pryor’s highest highs and his lowest lows. She experienced so much with Richard that she married him twice. Jennifer and Marc talk about the brilliant, complicated, visionary, frustrating man that was Richard Pryor and how Jennifer became the guardian of his legacy, culminating with a new career-spanning box set. They also talk about Jennifer’s time as a ‘70s wild child, making her way through show biz on both coasts. Hasan Minhaj took the pressures put on him to become a lawyer and channeled them into the ambition necessary to start a standup career, become a Daily Show correspondent, host his own show (Patriot Act), get cast on a prestige drama (The Morning Show), and have a future in comedy as bright as anyone in his peer group. Marc and Hasan break down the roots of that ambition, how it differs between different generations of comedians, and whether or not there’s a correlation between comedy and entrepreneurship. David Chang wouldn’t have opened his first restaurant if he wasn’t depressed. Now, with his Momofuku empire that brings joy to foodies everywhere, David still finds himself struggling to find joy. Marc talks with David about their shared demons and what steps they each take to overcome them, in particular creating boundaries, being less angry, and working to correct past mistakes. They also talk about David’s new show The Next Thing You Eat, his friendship with Anthony Bourdain, and his life as a new dad. Jane Goodall has hope. Yes, even in these times. That doesn’t mean the good doctor looks at the world with rose-colored glasses. It means she knows hope is a necessary part of our survival as a species. Marc talks with Dr. Goodall about The Book of Hope: A Survival Guide for Trying Times and finds out what inspires her these days. They also talk about her famous primate research that changed the way we humans understand ourselves, her work to spread environmental equity, and her thoughts on Bigfoot."
