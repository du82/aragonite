["https://wtfpod.libsyn.com/2021/12"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "When Rory Cochrane started acting, he knew he didn’t want to be a movie star. He wanted to be a freight train that keeps on moving. Rory tells Marc about the practices and measures he put in place to attain his goal of career longevity and artistic satisfaction. They also talk about why it’s important for him to work on productions where the crew is treated well, why he asked to leave CSI: Miami when it was still the biggest show on TV, and what led to some of his pivotal career moments in movies like Dazed and Confused, Black Mass, and Argo. Aida Rodriguez wanted her first HBO special to be more than a comedy show. She wanted to depict the parts of her past that are foundational to her comedy. So that’s why she filmed a short documentary about her visits to Puerto Rico and the Dominican Republic, as she reunited with the father she hadn't seen in 40 years. Marc and Aida talk about how she got comedy material out of a life story that included being kidnapped twice, finding herself raising her children without a home, and breaking into the business later in life. Guillermo del Toro believes in one universal truth: We all get to a moment in our lives when we see ourselves for who we really are. That belief not only guides his own life, it guides the characters through his many films. Guillermo and Marc talk about how he takes on the dark forces of the world in his movies, including his latest, Nightmare Alley. They also discuss his friendship with fellow Oscar-winning directors Alejandro González Iñárritu and Alfonso Cuarón, his expansive collection of oddities, and his strong identification with outsider characters and monsters. Despite multiple Oscars and billions of dollars in box office returns, Peter Jackson still has the same interests he had when he was 10 years old: First World War airplanes, monster movies, using his Super 8 camera, and The Beatles. Peter tells Marc what it was like to be entrusted with more than 60 hours of Beatles footage to make the new documentary Get Back, why he was filled with dread when he started the project, and why he was surprised by what he found when he went through the footage."
