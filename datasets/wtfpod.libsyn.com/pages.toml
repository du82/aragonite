["https://wtfpod.libsyn.com/category/podcasts"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Just a quick message from Marc to let you know that this app will be retired soon. More than 800 WTF Episodes are now available for free on all major podcast apps. Singer-songwriter Laura Veirs has something to prove with her latest album, Found Light. After divorce ended her 20-years-long collaborative relationship with her producer husband, Laura not only needed to prove she could create a new album independently, but she needed to be sure of who she was in the world going forward. Laura and Marc talk about love and loss and the power of therapeutic mushrooms. They also talk about how Laura suffers from imposter syndrome when she’s around her other collaborators, k.d. lang and Neko Case. Comedian Atsuko Okatsuka has familiarity with garages. But unlike Marc, she didn’t start a podcast in one. She lived in one with her mother and grandmother for seven years, as three generations of immigrant women dealt with cramped quarters, eating disorders and schizophrenia. Atsuko tells Marc how she was unaware as a young girl that her trip from Japan to America was going to become permanent and how her discovery of standup comedy helped her find her voice. Dana Gould is in his 40th year of doing standup. He and Marc talk about what they’ve learned in their decades of comedy, how they came to accept their limitations, and how they see themselves in today’s standup environment. Dana also explains why he went back on stage after years of giving it up to work on The Simpsons, why he feels that progress in comedy means knowing when you were wrong, and why he always goes back to George Carlin. Kate Berlant’s comedy defies easy categorization. That’s okay with Kate, who thinks people use a lot of empty terms to pin down comedy. Kate and Marc talk about how growing up in the art world helped Kate take a different approach when she got on the comedy stage as a teenager. They also talk about Kate’s sketch work with fellow comedian John Early, the inspiration she took from the late Brody Stevens, and why her Bo Burnham-directed comedy special remains in limbo."
year_published = 2022
