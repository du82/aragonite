["https://wtfpod.libsyn.com/episode-1239-quentin-tarantino"]
title = "WTF with Marc Maron Podcast: Episode 1239 - Quentin Tarantino"
description = "The pandemic forced a lot of changes on all of us, but for Quentin Tarantino, he was already undergoing a huge change right as the pandemic started: He became a first-time father. Now with the release of his first novel, the famed director talks with Marc about the shifting perspectives and priorities that come with getting older. They also talk about the death of Old Hollywood, the Manson family, and why he wouldn’t use the name Tarantino if he had to start all over again. Plus, Tom Scharpling finally gives Marc what he wants in Get to Know Tom."
