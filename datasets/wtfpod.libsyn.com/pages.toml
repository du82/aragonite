["https://wtfpod.libsyn.com/2022/02"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Sam Elliott plays a lot of tough guys - cowboys, bikers, soldiers - who can (and often do) beat people up. But in reality, Sam says the only guy he beats up is himself. Sam and Marc talk about how he came to terms with some of the things in his life that were really doing a number on him, like how his father never approved of his life as an actor. They also talk about some of his most popular roles, like The Stranger in The Big Lebowski, Bobby in A Star Is Born, and his new addition to the Yellowstone franchise, Shea on 1883. From 2013, Sally Kellerman talks with Marc about being his TV mom, embracing Hot Lips, and working with Robert Altman, Marlon Brando, Rodney Dangerfield and more. Sally died on February 24, 2022 at age 84. W. Kamau Bell has talked with Marc before about his life, his comedy and his thoughts about the world. But this time there’s a single topic that needs to be addressed: Bill Cosby. Kamau tells Marc why he decided to make the documentary series We Need To Talk About Cosby, the obstacles he encountered in getting it made, the comedians who wouldn’t talk to him, and the backlash he’s received for making the doc. Kamau also explains what happened when Cosby was released from prison while they were still shooting. From 2014, Marc talks with John Szeles, better known as The Amazing Johnathan, about his life doing comedy and magic, often at the same time. John died on February 22, 2022 at age 63 From 2017, Marc talks with Mark Lanegan, the former frontman of Screaming Trees, about the '90s grunge scene and his collaborations with various artists. Mark died on February 22, 2022 at age 57. Andy Garcia says it’s surreal to look back on his early life as a shy Cuban exile who was idolizing famous actors and filmmakers, only to be reminiscing now about the work he’s done with Sean Connery, Al Pacino, Robert DeNiro and so many others. Andy and Marc talk about his years in LA with no acting work, his improv group at The Comedy Store, and how he was supposed to play the henchman in The Untouchables. They also talk about Andy being part of The Godfather films, with the original being the movie that made Andy want to become an actor in the first place."
year_published = 2022
