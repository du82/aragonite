title = "WTF with Marc Maron Podcast: Episode 1268 - Kelefa Sanneh"
description = "Kelefa Sanneh has been writing about music for his entire career. Drawing on his experience as the music critic at The New York Times, a staff writer for The New Yorker, and a lifelong music obsessive, Kelefa took a detailed look at how music unites and divides us with his new opus, Major Labels: A History of Popular Music in Seven Genres. Marc and Kelefa talk about their own personal musical journeys, how genres are comparable to communities, and how identities can be established and shaped by the music we love."
