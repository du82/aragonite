["https://wtfpod.libsyn.com/2021/page/3/size/10"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "David Chang wouldn’t have opened his first restaurant if he wasn’t depressed. Now, with his Momofuku empire that brings joy to foodies everywhere, David still finds himself struggling to find joy. Marc talks with David about their shared demons and what steps they each take to overcome them, in particular creating boundaries, being less angry, and working to correct past mistakes. They also talk about David’s new show The Next Thing You Eat, his friendship with Anthony Bourdain, and his life as a new dad. Jane Goodall has hope. Yes, even in these times. That doesn’t mean the good doctor looks at the world with rose-colored glasses. It means she knows hope is a necessary part of our survival as a species. Marc talks with Dr. Goodall about The Book of Hope: A Survival Guide for Trying Times and finds out what inspires her these days. They also talk about her famous primate research that changed the way we humans understand ourselves, her work to spread environmental equity, and her thoughts on Bigfoot. As Connor Roy on Succession, Alan Ruck finally has the kind of role he’s been waiting to get for more than 30 years. And as Alan tells Marc, some of those years weren’t very fun. There was the time after playing Cameron in Ferris Bueller’s Day Off when he could only get work in a Sears warehouse. Or the time before making Speed when he left acting and started tending bar. And then the time when he got sick while shooting Spin City and almost died. At least there were some Star Trek conventions sprinkled in the mix. Taraji P. Henson says all her f***s are behind her now. But after three decades in show business, Taraji admits she only feels freedom from her f***s because of her openness around mental health. Taraji and Marc talk about the importance of coping with mental illness, as well as Taraji’s work to encourage mental health awareness in the Black community. They also talk about her landmark performances, from Baby Boy to Empire to Hidden Figures, and how she dealt with getting pushed out of roles after being told that “Black doesn’t sell.”"
