full_description = "Whether he was getting booked on The Tonight Show or becoming the first standup to have a hit sitcom based on his act or finding success as a professional poker player, Gabe Kaplan says it all happened in spite of his lack of ambition. Gabe tells Marc how he really wanted to become a professional baseball player, how his athleticism served him well in Battle of the Network Stars, and how his initial years in standup were spent opening for strippers and bellydancers. They also talk about the making of Welcome Back, Kotter and how playing Las Vegas got Gabe into poker."
