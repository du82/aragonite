["https://wtfpod.libsyn.com/2022/05"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Rosie Perez initially thought success would paper over her trauma. But the emotional ramifications from the abuse she went through as a child were never going to stay hidden for long. Rosie and Marc talk about how acting is still risky for her but now she has tools to help work through the high-wire act of tapping into dark places. They also talk about her friendship with Spike Lee, her reasons for working a lot, and her two current series, The Flight Attendant and Now & Then. From 2018, Ray Liotta talks with Marc about getting his start in soap operas, the debt he owes to Melanie Griffith, and the emotional filming of Goodfellas. Ray died on May 26, 2022 at age 67. Joey Camen left a dysfunctional home in Detroit as a teenager and, thanks to an ad he saw in a Playboy, knew exactly where he needed to go. He went straight to the brand new club on the Sunset Strip, The Comedy Store, and quickly became one of the club’s first regulars. Joey and Marc talk about those early days of the Store, living in fear of Mitzi, and becoming friends with the likes of Paul Mooney and Richard Pryor before falling under the tutelage of legendary voice actor Daws Butler. This is an episode about history. Collective history and personal history. Marc finds himself in Washington, DC on the latest leg of his standup tour, a place imbued with symbolism, both for what we want it to be, but also what we really are. And it’s where Marc’s college roommate lives. First, Marc reckons with a history of injustice at the Smithsonian National Museum of African American History and Culture with curator Dr. Dwandalyn Reece. Then Marc tries to piece together his own past with his old roommate, Lance Mion. Michael Che wanted out his life on the Lower East Side, but his initial path was not comedy. It was painting and fine art. Michael tells Marc how he became enamored with standup while living in his brother’s basement, how he came to love the grind of building an act, and how he puts everything he’s learned into his sketch show, That Damn Michael Che. They also talk about the growing pains of doing Weekend Update on SNL and why hosting award shows isn’t all it’s cracked up to be."
