["https://wtfpod.libsyn.com/episode-1271-jane-goodall"]
title = "WTF with Marc Maron Podcast: Episode 1271 - Jane Goodall"
description = "Jane Goodall has hope. Yes, even in these times. That doesn’t mean the good doctor looks at the world with rose-colored glasses. It means she knows hope is a necessary part of our survival as a species. Marc talks with Dr. Goodall about The Book of Hope: A Survival Guide for Trying Times and finds out what inspires her these days. They also talk about her famous primate research that changed the way we humans understand ourselves, her work to spread environmental equity, and her thoughts on Bigfoot."
