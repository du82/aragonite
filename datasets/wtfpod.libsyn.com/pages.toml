full_description = "In order for Eddie Murphy to become “Eddie Murphy” he had to become a comedian. Eddie tells Marc, comic-to-comic, what it was like being a Black teenager on Long Island building a standup act fueled by impressions and inspired by Richard Pryor. And now, with fatherhood at the center of his life, Eddie explains why he wants to bookend his career by going back on stage. Eddie also talks about the real reason he exploded on the movie scene, why he stopped doing standup before he turned 30, and why it was finally the right time to make Coming 2 America."
