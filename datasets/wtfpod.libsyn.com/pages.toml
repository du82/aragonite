["https://wtfpod.libsyn.com/2021/page/4/size/10"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "Matt Damon's continuing presence and popularity in American films can be summed up in four words: He loves to act. Matt tells Marc how he made the most out of working with icons like Clint Eastwood, Francis Ford Coppola, Steven Spielberg, Jack Nicholson, Denzel Washington and many more. He also talks about teaming back up with Ben Affleck for their first screenplay since Good Will Hunting and making his latest film, Stillwater, with Tom McCarthy. The pandemic forced a lot of changes on all of us, but for Quentin Tarantino, he was already undergoing a huge change right as the pandemic started: He became a first-time father. Now with the release of his first novel, the famed director talks with Marc about the shifting perspectives and priorities that come with getting older. They also talk about the death of Old Hollywood, the Manson family, and why he wouldn’t use the name Tarantino if he had to start all over again. Plus, Tom Scharpling finally gives Marc what he wants in Get to Know Tom. Whether he was getting booked on The Tonight Show or becoming the first standup to have a hit sitcom based on his act or finding success as a professional poker player, Gabe Kaplan says it all happened in spite of his lack of ambition. Gabe tells Marc how he really wanted to become a professional baseball player, how his athleticism served him well in Battle of the Network Stars, and how his initial years in standup were spent opening for strippers and bellydancers. They also talk about the making of Welcome Back, Kotter and how playing Las Vegas got Gabe into poker. In order for Eddie Murphy to become “Eddie Murphy” he had to become a comedian. Eddie tells Marc, comic-to-comic, what it was like being a Black teenager on Long Island building a standup act fueled by impressions and inspired by Richard Pryor. And now, with fatherhood at the center of his life, Eddie explains why he wants to bookend his career by going back on stage. Eddie also talks about the real reason he exploded on the movie scene, why he stopped doing standup before he turned 30, and why it was finally the right time to make Coming 2 America."
