["https://wtfpod.libsyn.com/episode-1339-greg-proops"]
title = "WTF with Marc Maron Podcast: Episode 1339 - Greg Proops"
description = "Marc has a very direct question for his old friend Greg Proops: “Did we lose?” In the fight for the heart and soul of comedy, there is real uncertainty about the current trajectory. What legacy did the alternative comedy movement leave, if any? Did the Obama years create a false sense of security for popular comedians that made them drop the ball? Will a there be a counterforce to the dominant strain of reactionary backlash comedy? Marc and Greg interrogate these questions and their own roles in the past three decades of comedy.&nbsp;"
