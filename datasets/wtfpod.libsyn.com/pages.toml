title = "WTF with Marc Maron Podcast: Episode 1270 - Alan Ruck"
description = "As Connor Roy on Succession, Alan Ruck finally has the kind of role he’s been waiting to get for more than 30 years. And as Alan tells Marc, some of those years weren’t very fun. There was the time after playing Cameron in Ferris Bueller’s Day Off when he could only get work in a Sears warehouse. Or the time before making Speed when he left acting and started tending bar. And then the time when he got sick while shooting Spin City and almost died. At least there were some Star Trek conventions sprinkled in the mix."
