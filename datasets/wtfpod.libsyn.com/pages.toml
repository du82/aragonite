["https://wtfpod.libsyn.com/page/4/size/10"]
title = "WTF with Marc Maron Podcast"
description = "Marc Maron welcomes comedians, actors, directors, writers, authors, musicians and folks from all walks of life to his home for amazingly revealing conversations. Marc's probing, comprehensive interview style allows guests to express themselves in ways listeners have never heard."
full_description = "The Red Hot Chili Peppers have been around for almost 40 years and Flea has been there for every minute of it. He and Marc talk about Flea’s jazz-based upbringing that made him the bassist he is today, the various incarnations of the band, and the current reunion with multi-time bandmate John Frusciante for their new album, Unlimited Love. Flea also talks about the heartbreak of losing the Chili Pepper’s founding guitarist Hillel Slovak to drug addiction and the demons the rest of the band have fought to overcome. Sam Jay has a lot of irons in the fire. She’s on the comedy series Bust Down, she has her own HBO late night show Pause, and she never stops doing standup. Sam tells Marc that standup is the one thing that’s guided her through it all, whether it was getting through tough personal times when she was younger or when she was hired as a writer on SNL with no formal writing experience. It’s always been standup that served as her North Star, which she now uses as a way to communicate across generational and racial divides. Jeff Foxworthy still cringes when he knows other comics are watching his work. That persistent insecurity and the desire to always stay funny is why Jeff has a new Netflix special and a whole new act. Jeff talks with Marc about the drive that made him quit his job at IBM to try and get on Johnny Carson. They also talk about how he formed the Blue Collar Comedy Tour and how he feels about being known for his “You Might Be A Redneck” hook even though it hasn’t been part of his act for 20 years. Ariana DeBose knows there was no way for her to prepare for what’s happening right now. There’s no instruction booklet for being a professional dancer at age 18 and suddenly becoming an Academy Award-nominated actress. Ariana and Marc talk about how getting voted off So You Think You Can Dance changed her life and how she checked herself by watching The Devil Wears Prada. Ariana also goes into the details of making West Side Story, including her collaborations with Steven Spielberg, Tony Kushner and Rita Moreno."
