["https://wtfpod.libsyn.com/episode-1336-jesus-trejo"]
title = "WTF with Marc Maron Podcast: Episode 1336 - Jesus Trejo"
description = "Jesus Trejo knows he put in the work to become a paid regular at The Comedy Store, spending years doing open mic spots and performing at 1am for a handful of people. Not to mention paying his dues unclogging toilets at the club and putting up Mitzi Shore’s Christmas tree. But even with all of that behind him, Jesus still breaks out in a sweat when he tells Marc about those times he completely bombed as he was trying to learn the ropes. Jesus also tells Marc about being a caregiver for both his parents and what gave him the courage to work that real life scenario into his act."
