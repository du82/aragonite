["https://wtfpod.libsyn.com/episode-1273-hasan-minhaj"]
title = "WTF with Marc Maron Podcast: Episode 1273 - Hasan Minhaj"
description = "Hasan Minhaj took the pressures put on him to become a lawyer and channeled them into the ambition necessary to start a standup career, become a Daily Show correspondent, host his own show (Patriot Act), get cast on a prestige drama (The Morning Show), and have a future in comedy as bright as anyone in his peer group. Marc and Hasan break down the roots of that ambition, how it differs between different generations of comedians, and whether or not there’s a correlation between comedy and entrepreneurship."
