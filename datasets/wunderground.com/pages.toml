full_description = "Skip to Main Content _ Sensor Network Maps & Radar Severe Weather News & Blogs Mobile Apps More Searchclosegps_fixedgps_fixedFind Nearest Station Manage Favorite CitiesLog InGo Ad Freeaccount_box Log in Go Ad Freesettings Settings Sensor NetworkMaps & RadarSevere WeatherNews & BlogsMobile AppsHistorical WeatherstarCurrent Weather for Popular Cities San Francisco, CA warning53 °FCloudy Manhattan, NY warning27 °FMostly Cloudy Schiller Park, IL (60176) 20 °FClear Boston, MA warning24 °FClear Houston, TX 66 °FPartly Cloudy St James's, England, United Kingdom 33 °FClearSearchclosegps_fixedgps_fixedFind Nearest Station Manage Favorite CitiessettingsAdChoices: Learn More About Our AdsThe Web sites you visit work with online advertising companies to provide you with advertising that is as relevant and useful as possible. Some of the ads you receive on Web pages are customized based on predictions about your interests generated from your visits over time and across different Web sites. This site is in compliance with the Self-Regulatory Program for Online Behavioral Advertising. The goal of Ad Choices is to provide you with information about how online advertising works and the choices you have.Where can I learn more about the information collected and how ads are selected?Please read about Weather Underground's practices in its privacy policy.What choices do I have about interest-based advertising on this site?Information about your visits to this and other sites may be used over time to help predict your interests and select the ads you see. This is also called online behavioral advertising.Visit the http://www.aboutads.info/choices page to learn more about online behavioral advertising and to see your opt-out choices from companies that are participants in the Self-Regulatory Program for Online Behavioral Advertising.Note: If you choose to opt out, you will still see ads, but these ads will not be customized based on your interests generated from your visits over time and across different Web sites.Note: The preferences you select on the About Ads page may not apply to wireless devices.What choices do I have about online behavioral advertising on mobile devices?The Digital Advertising Alliance (“DAA”) offers a separate choice tool for the collection of cross-app data on a mobile device for interest-based advertising and other applicable uses. To exercise choice for companies participating in this choice tool, you can install the DAA’s AppChoices app."
