["https://wunderground.com/about/our-company"]
title = "About Us | Weather Underground"
full_description = "Skip to Main Content _ Sensor Network Maps & Radar Severe Weather News & Blogs Mobile Apps More Searchclosegps_fixedgps_fixedFind Nearest Station Manage Favorite CitiesLog InGo Ad Freeaccount_box Log in Go Ad Freesettings Settings Sensor NetworkMaps & RadarSevere WeatherNews & BlogsMobile AppsHistorical WeatherstarCurrent Weather for Popular Cities San Francisco, CA warning53 °FCloudy Manhattan, NY warning27 °FMostly Cloudy Schiller Park, IL (60176) 20 °FClear Boston, MA warning24 °FClear Houston, TX 66 °FPartly Cloudy St James's, England, United Kingdom 33 °FClearSearchclosegps_fixedgps_fixedFind Nearest Station Manage Favorite CitiessettingsWeather Underground About Us About Our Data Contact Us About Us About UsAbout Our DataContact Us An Alternative Outlook Weather Underground has challenged the conventions around how weather information is shared with the public since 1993. We're immensely proud of the unique products that our community and meteorologists have created to improve people's access to meaningful weather data from around the globe. As the Internet's 1st weather service, we consider ourselves pioneers within our field and we're constantly seeking new data sets and the next technologies that will help us share more data with more people. Weather For All Our brand mission is to make quality weather information available to every person on this planet. No matter where you live in the world or how obscure an activity you require weather information for - we will provide you with as much relevant, local weather data as we can uncover. We promise to provide weather data for those that are underserved by other weather providers. Together We Know More The beating heart of our brand is the generous and passionate community of weather enthusiasts that share weather data and content across our products. With 250,000+ of our members sending real-time data from their own personal weather stations, they provide us with the extensive data that makes our forecasts and products so unique. Community Backed by Science The vast amount of weather data we collect only becomes meaningful when combined with the scientific expertise that our team of meteorologists provide. Our proprietary forecast model leverages our personal weather station community to provide the most reliable and localized forecasts available. Our meteorologists and climatologists also provide valuable insight into the science behind the data and the relationship between weather and climate change. Data as Design Especially in a world where so much data is consumed on the small screen of a mobile phone, we have invested a lot of time and energy into the design of our products across all digital platforms. We have created a user experience that enables you to find as much weather data as you need as quickly as possible."
