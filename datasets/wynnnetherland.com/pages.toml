["https://wynnnetherland.com/journal/putting-the-emote-in-remote-work"]
title = "Putting the emote in remote work"
description = "Emoji is a big part of the way we work at GitHub."
full_description = '''I had the opportunity to chat with an entire gSchool class via Skype a couple of weeks ago and share my thoughts on development and my experience of working at GitHub. One student asked me to share some keys to working remotely since she had heard a large percentage of GitHubbers are outside of San Francisco. I should develop a more thoughtful response to that question, drawing from experience of working remotely as both an employee and an employer for the last seven years. Since I was put on the spot, however, I shared the first three tips that came to mind: Unless everyone is in the same room, synchronous meetings are wrought with laggy connections, half-duplex speakerphone mics, and lonely soliloquies into unknowingly-muted handsets. For effective distributed and remote teams, communication becomes primarily written and async. In such environs, it's often difficult for the reader to have the same context as the writer. The author's tone might be hard to discern. Believe it or not, emoji can help. At GitHub, emoji autocomplete is built into almost every tool we use. Whether we're using GitHub to build GitHub or using internal tools like our custom workstreaming, hiring, or help desk apps, our written communication is steeped in emoji. But why? Emoji express emotion. This may seem obvious, especially if, like me, you once thought the term emoji shared a common etymology with emoticon, those text-based smileys that have adorned email since 1982. Emoji literally means "picture letter", but those pictures can help express emotion. Saying "good job :zap:" carries more feeling than with words alone. "Removing trailing whitespace" is much more fun with a little :fire:. Emoji encourage brevity. One of the problems with electronic communication is that we get so much of it. Shakespeare said "Brevity is the soul of Twitter," or (something like that). A :metal:, :+1:, or :shipit: can be just as effective as "awesome", "I'm onboard with that", or "Looks good, ship it." Emoji reinforce your words. Some emoji serve to back up your message. One of my favorites combos is :microscope::checkered_flag:. Translation: "science wins."'''
year_published = 2025
