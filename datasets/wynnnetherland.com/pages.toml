["https://wynnnetherland.com/journal/font-face-off-typekit-vs-font-squirrel"]
title = "@font-face-off: Typekit vs. Font Squirrel"
description = "Now that the curtain has come down and now Typekit is available to all, let's see how Typekit and the previously mentioned Font Squirrel stack up head-to-head."
full_description = '''Now that the curtain has come down and now Typekit is available to all, let's see how Typekit and the previously mentioned Font Squirrel stack up head-to-head. It's ironic to even compare font selection between these services when we've been stuck with such a limited set of web safe fonts for nearly two decades. Even so, it's interesting to compare both the depth and quality of the fonts provided. Comparing font quality is somewhat subjective, but heading into this comparison, I expected to find a much higher caliber set of fonts on Typekit since their business model includes negotiating with foundries to license fonts for web embedding that otherwise wouldn't be. However, I find no real difference between the quality of fonts provided, and some free (as in speech and beer) fonts appear on both. Let's face it. A big part of punching up your web typography is actually finding the right font. Let's see how each site helps you wade through all those typefaces. Both sites do a great job of previewing fonts including specimens and weights & styles, but each site offers some unique features. Once you've picked that perfect font, you've got to add it to your site. The process is a bit different for each service. One of the recurring questions that arises in discussing Typekit with my designer friends is, "What if they go down?" Honestly, chances are your site will be down more than theirs. You can't peddle unapplied truth. While you can no doubt create great designs with the web safe font stacks, if you're running a site that touts the breakthroughs of web typography, how about giving us something more to look at than Arial and Georgia. I find it surprising that I couldn't find an example of Typekit using the fonts they serve in their own site out side of their gallery. The bottom line is both of these services are great and are advancing web typography. The decision as to which to use comes down to what font you need, your budget, and how comfortable you are editing your own CSS and hosting your own fonts. So go kick the tires on both and make something beautiful!'''
year_published = 2025
clearnet = "https://wynnnetherland.com/journal/font-face-off-typekit-vs-font-squirrel"
