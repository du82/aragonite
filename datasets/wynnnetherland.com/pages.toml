["https://wynnnetherland.com/journal/extending-the-command-line"]
title = "Extending the command line"
description = "The next time you think about writing another shell alias, consider these more advanced approaches to extending CLI apps."
full_description = "I was relatively late to the terminal party. Spending the first half of my career in a Windows world, I viewed the command line as an artifact of its DOS legacy, not an environment to do anything productive. Two things happened in the mid 2000s to change that. Apple switched to Intel and bundled a Unix kernel with OS X. Around the same time, Ruby on Rails captured the imagination of a growing number of developers like me who were looking for a better way to build web applications. Rails has always embraced the command line. From the very first screencast it was apparent that you interacted with Rails through scripts and text files, not wizards and property panes. Not long after I began riding the Rails there was a moment when the terminal was no longer a command line interface but my command line interface. Like many command line newcomers, I began creating aliases to save some keystrokes and make oft-used commands easier to remember. For many developers, Git is the application that brings them to a terminal interface, and it, too, supports aliases. You can create Git aliases programmatically via git config: Some of the above implementations resemble mini-applications. Thankfully, for more complex tasks Git provides a more robust way to write command line extensions. Git will look for any executable prefixed with git- in your PATH and extend its command line interface. Here's a simple but practical example, an executable named git-conflicts in my bin folder. Now when I'm in the middle of a merge or rebase and I encounter conflicts I can run git conflicts to list only the files with conflicts. Building on top of that, I have another script named git-edit-conflicts that will open those files in $EDITOR, which for me is Vim: Another frequently used git-* script of mine is git-ci for checking the build status of my current branch via the GitHub API, regardless of the continuous integration provider: With that output, I can CMD+Click the URL in iTerm or run git ci -o to open the link to the build on the CI provider's web site automatically."
