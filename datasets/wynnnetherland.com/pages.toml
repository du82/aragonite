["https://wynnnetherland.com/journal/engineering-team-identity"]
title = "Engineering team identity"
description = "Both distributed and co-located teams can benefit from getting explicit about their role within the broader organization. Here are some practical things to  include in your team's intranet page or GitHub team repository README."
full_description = "I recently shared some tips for helping teams define how its members work together. You could think of that as defining your internal interfaces. As your organization grows, it's also important to define your external interface, outlining how other teams and individuals in the org work with your team. Both distributed and co-located teams can benefit from getting explicit about their role within the broader organization. Here are some practical things to include in your team's intranet page or GitHub team repository README. Include a team roster with names and photos or avatars. Every team has its own unique identity, but try to put a human face on the work you do, especially in remote environments. In an industry of overloaded terms, avoid confusion and clearly state why your team exists, its raison d'etre. Call it your mission statement if you like, just keep the language aspirational yet grounded, something the entire team can buy into. Why it's important: Getting explicit about your team's purpose helps frame what you work on, and what you don't. Every organization has seams, gaps, and overlap. Building on your team's purpose, outline your team's areas of responsibility, enumerating the services and swaths of the code base your team maintains. If you share responsibility with other teams, get explicit about that, too. Why it's important: Discoverability accelerates work, especially in distributed organizations. Use your team page to outline your areas of responsibility and link to documentation that might answer someone's question and save your inbox. When you're seeking help, an unresponsive team can cause frustration and quickly erode trust. It's better to preemptively let others know what things fall out of your area of responsibility than constantly field @mentions for things you don't handle. Why it's important: Failing to get explicit about what your team does (and does not do) can lead to unmet expectations and mistrust from those outside your team, impacting your ability to deliver."
year_published = 2025
clearnet = "https://wynnnetherland.com/journal/engineering-team-identity"
