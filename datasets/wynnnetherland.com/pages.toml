title = "Looking for my next great team"
description = "An outline for what I'm looking for in my next role."
full_description = "Twenty years in, I'm still thankful to make a living doing what I love to do: developing software and building engineering teams. I enjoy the creative process, solving problems, and defining & refining the way we work to ship code to provide value. Due to some harsh startup realities, I'm unexpectedly looking for my next opportunity to join and grow a great engineering team. I'm T-shaped, a generalizing specialist, a Jack-of-all-trades, master of some. I'm driven by curiosity. You don't make it long in this line of work if you're not a lifelong learner. I don't like to work alone. I like being stretched by people with more experience and specialized knowledge as much as I love mentoring and sharing what I've learned. I've gained some experience in: I've worked as an individual contributor. I've led small teams, large teams, and teams of teams. Each role has its own unique set of benefits and challenges. Ideally, my next role would afford me opportunities for: If you're looking for proven technical leadership to help build your engineering team, let's connect."
