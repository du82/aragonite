["https://wynnnetherland.com/journal/how-we-work"]
title = "How we work"
description = '''Has your team written down its process? There's incredible value in having a document that outlines "How we work."'''
full_description = "If I learned anything from multiple seasons of self-employment it's this: working on the business is just as important as working in the business. For the self-employed, consultants particularly, there's a tension between serving your current clients — the in the business part — and improving how you line up new work, pay the bills, hire, and the rest of the on the business part. Software engineers like working in the business. We like to solve problems, especially technical problems. We like this kind of work because the problems are often curated for us. By the time they land in the backlog, problems are fairly well-defined and require technical skill to solve. But like any human endeavor, the business itself faces its own challenges, some technical, some social. I believe any organization's ability to deliver great software comes down not to individual talent but how well its smallest teams work together. This doesn't happen accidentally. It takes intentional effort and leaving space in the schedule for each member to work on the team while they work in the team. Highly functioning teams have a shared understanding of how the team works, and each member knows their role. Here are some practical ways to develop that shared understanding. Write it down. For many teams, their process is oral tradition, a mental mosaic comprised of each member's perception of how the team works, colored by their role and tenure in the organization. If you want a shared understanding of your process across the team, you need to write it down. Keep it lightweight. The goal of any team process is to achieve the goals of the team. In software engineering, that often means shipping quality software at the most sustainable velocity. Seek the fewest number of guardrails to keep everyone on the happy path. Define process as expression of values. Nobody likes process for process sake. People, especially new team members, are much more prone to accept a step in the process once they understand the intent behind it. Consider writing your process as a series of value statements: because we value x, we do y. Doing so not only embeds the why alongside the how, it reminds everyone that decisions are often tradeoffs between competing values, not simply choosing to value something or not."
year_published = 2025
clearnet = "https://wynnnetherland.com/journal/how-we-work"
