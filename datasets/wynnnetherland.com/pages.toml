["https://wynnnetherland.com/journal/on-keeping-up"]
title = "On keeping up"
description = "At 40, I've been building the web for roughly twenty years. Over that time, I've seen a pattern of enthusiasm, skepticism, cynicism, and growth emerge, sort of like my own personal Gartner cycle."
full_description = '''In tech, every day brings a new language, a new framework, a new architecture that promises to deliver on the failed promises of the current stack. Our response to new technology shapes our work, our careers, and even ourselves. At 40, I've been building the web for roughly twenty years. Over that time, I've seen a pattern of enthusiasm, skepticism, cynicism, and growth emerge, sort of like my own personal Gartner cycle. Curiosity. Engineering requires a desire to learn how things work and discover new ways to solve problems. Curious developers will be drawn to new tools, wanting to test them out for themselves and pick up a new skill or technique. Excitement. There's a thrill in the "unboxing" of a new release and taking its features for a spin. You start to imagine the time saved on the next project and the code you won't have to write. If you're not careful this can lead to a form of software consumerism, thinking all solutions are available via a package manager or app store. Fear. The FOMO factor. If you're hired for your proficiency in a language or framework, you may think the way to stay in demand is discovering and learning the next trend. Maybe you're more motivated by belonging to a community (or wanting influence within a community.) You fear getting left out or left behind. Novelty is an illusion. Hang around long enough and you'll observe not just the pace of change, but its waves and its rhythms. Take a look around. While your blue jeans morphed from straight leg to tapered to bootcut or back, your code went from thin client to rich client to isomorphic. Your JavaScript was extracted from your markup, only to have your markup infused in your JavaScript. Wait a little longer and it will all come full circle. So at some point, you stop trying to follow the trends. You develop your own tastes, pick your favorite tools, and get to work. You receive new tech with an informed skepticism. There will always be something new, and if it's indeed good, there will be time to learn it down the road. That "new framework smell" fades fast. True satisfaction comes from taking what you know and applying it to the problems in front of you. Instead of jumping on the next bandwagon, you're happy to wave at this one as it rolls on by.'''
year_published = 2025
clearnet = "https://wynnnetherland.com/journal/on-keeping-up"
