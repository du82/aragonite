["https://wynnnetherland.com/journal/a-tech-book-readers-lament"]
title = "A tech book reader's lament"
description = "I miss the larger, more vibrant technical bookshelf from twenty years ago."
full_description = '''In college I worked the closing shift at a large chain office supply store. I'd spend my "lunch" breaks at the bookstore next door in a wingback chair poring over a stack of computer programming books and smelling the overpriced coffee — neither of which I could afford. I'm not sure if there ever was a Golden Age for the printed technical book, but the late 90s were pretty good for newbies like me. There were books for Dummies, books for Idiots, books to Teach Yourself Anything in 21 Days, even By Example if you like. There were rather thick books that purported to be the Bible for a given subject, and of course, an array of colorful books with rare animals on the covers. Wrox published my favorite series though. Usually containing Beginning or Professional in an easy to spot yellow title on a red background below a grid of black and white author head shots those books were thick, often more than a thousand pages. On the rare occasion I had fifty bucks to lay down for a book, it was usually a Wrox title because they tended to have something other titles didn't: shelf life. When I stepped into the corporate world some years later, it seemed the Computers & Technology section at the bookstore had spilled over into the corporate cube farm. Every coworker had a mini library of their own, and we often lent titles to one another. There was also the special collection of antiquities, known as the manager's office. While usually the largest collection, it also was full of books on languages and tools that people just didn't use anymore. Looking back, some of those titles may have been two or three years old, max. It's that small shelf life and cost of print production that sent most technical content into digital formats or online. Note taking. I write in books. I underline and make notes. Highlighting and annotation features are available for digital formats, and I use those when available. But there's something about reading a book with a Ticonderoga #2 in hand that engages my brain, helping me to interact with the text better.'''
year_published = 2025
