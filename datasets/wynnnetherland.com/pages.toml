["https://wynnnetherland.com/journal/quick-tip-use-ap-idock-to-hunt-down-missing-methods"]
title = "Quick tip: Use APIdock to hunt down missing methods"
description = "APIDock is a great resource to find when a method first appeared in your favorite API."
full_description = '''From time to time, we all to have step into older projects and add features. Suddenly that old standby method you'd come to love is giving you a method_missing. How do you go about finding out which version of Rails introduced it so you can upgrade or monkey patch? APIdock has your back. I bring this up because all too many gems depend on Active Support from Rails and introducing a new gem into an older Rails project can lead to some headaches when Active Support versions collide. So when asked to debug my gem in an older project the error message was puzzling: undefined method `present?' for "status":String String in this case is just a red herring. How do I know that? (Pretend for a minute you don't use present? all the time or that you're a noob). A quick search on APIdock tells us that Active Support added this method in version 2.2.1. I know this because the navigation is enabled for this method starting in 2.2.1. So, mystery solved. My friend can now monkey patch his way out of this one or upgrade to a later version of Active Support. Pick your poison.'''
year_published = 2025
