["https://wynnnetherland.com/journal/a-stylesheet-authors-guide-to-terminal-colors"]
title = "A stylesheet author's guide to terminal colors"
description = "tldr; Use grc to add stylesheets and personal color settings for your favorite terminal apps."
full_description = '''Like Merlin in The Once and Future King I feel as if I'm getting younger as I advance in my development career. When I started writing ASP Classic™ in the late 90s I was captive to the GUI. The DOS prompt held no real power and .ini files were something you fiddled with when a driver was misbehaving. Sophisticated developers of sophisticated applications, I was told, used property pages to configure their apps. These little tab-laden modal dialogs were never more than a right click away from anywhere it seemed. When I left .NET and Windows development for Ruby on Rails in 2006, I was thrust into a *nix world where the terminal is not only embraced but celebrated. In the past few years, I've come to love text mode. Last year, after a Changelog episode on Vim, I made the switch full time to the venerated terminal editor. In the last month, I made the switch to Solarized (dark) as my system-wide color scheme and am loving it. With a pleasing palette in place, I now try to make effective use of it across my entire toolchain. Before looking at how to colorize your terminal apps, let's remind ourselves why terminal colors can be useful. Good syntax highlighting employs both of these principles. Type names, string values, and delimiters are given different weight or color treatment from the rest of the code. As with any good thing, moderation is the key to colorizing. Call out what's important, aim for readability. Color has its uses beyond the text editor. Many popular development frameworks ship with some degree of color support. The Rails log, for instance, supports ANSI color codes out of the box thanks to the config.colorize_logging option. Foreman also provides great color support: Both of these apps provide color support via inline ANSI color codes. If you're familiar with CSS, you might think of these as inline styles of sorts. Let's look at how Rails does it using ActiveSupport::LogSubscriber: First, a palette of color constants maps to an ANSI sequence to render that color. It's important to note here that these named color constants aren't the same as named colors in CSS. For instance red in CSS is always #ff000, but in the terminal, RED or \e[31m, is determined by the user's terminal color scheme. Solarized provides a great mapping table between terminal color names and various color spaces.'''
year_published = 2025
