["https://wynnnetherland.com/journal/app-store-change-logs-the-good-the-bad-and-the-silly"]
title = "App Store change logs: the good, the bad, and the silly"
description = "The quality and detail of App Store application change logs varies a great deal."
full_description = "Maybe I have an unhealthy obsession with changelogs, but when I see pending updates to download from the App Store, I want to know what's new and what's fixed. I only tap 'Update all' after I've checked out the changelog for each updated app one-by-one. Some developers do a great job at communicating changes. Some do not. What does a nice, informative update look like? Runkeeper, my favorite iOS fitness app, does a fantastic job of providing the right level of detail. Seeing such a long list of bug fixes doesn't scare me as a user. Instead, this sort of transparency shows me the app is under active development and that any issues I find have a good shot at getting fixed. It seems the bigger the company behind an app, the less detailed the changelog. Take the latest update for the DirectTV app: While terse changelogs like these provide little info, verbosity isn't a cure-all, either. This post was sparked by an update today to my favorite iOS pastime, Words with Friends. The latest version actually includes some nice new features, but it's couched in cutesy language that leaves you looking for a TLDR;"
