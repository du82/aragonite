["https://wynnnetherland.com/journal/css-mixins-vs-multiple-classes"]
title = "CSS Mixins vs. multiple classes"
description = "A growing number of CSS meta-frameworks provide support for mixins. While CSS mixins provide a number of benefits, for me, they come with trade-offs."
full_description = '''Pretty basic so far. But what happens when the styles become a bit more complex? Take the following example: Using selector groups in this case leads to less maintainable code in that you have to keep updating the permutations of selector groups. A common solution is to factor common properties into classes: The idea is that we group common styles into reusable classes that can be added to elements as needed. Breaking the styles down into rounded and box classes, lets us use them independently. To my knowledge, Sass, heavily influenced by the Ruby language in which it's implemented, brought the idea of mixins to CSS. Consider this example: If you're a newcomer to Sass, this example might be a bit hard to follow. Basically, we declare a mixin named rounded with a set of styles. These styles are then mixed into the elements in the following selectors. When compiled, this Sass stylesheet yields the following CSS: With a single mixin we can reuse rules in a parameter-driven fashion to create two sets of styles, one with a 5px border radius one with 3px. Nifty, huh? I'm a big fan of Sass, especially as implemented in the Compass meta-framework, and use this mixin approach frequently. However, in moving away from multiple css classes to mixins, I've noticed I've lost a part of my development workflow that I've come to depend on - quick style spelunking with Firebug. When using multiple classes, the Firebug style inspector can take me to the exact line where the style was defined. With the mixin approach, these styles are now mixed into each rule. Firebug will of course show me the styles in each rule, but now I don't know where they come from unless I leave my browser and traverse my Sass code. Something else I do frequently in Firebug is playing eye doctor. You know "Better? Worse? Better Worse?" I add and remove additional css classes to elements to quickly apply and remove styles to play with different design aspects (like trying out rounded corners, etc.). When using Blueprint CSS's css classes, I can quickly prototype layouts and increase/decrease column widths just by modifying CSS classes like span-10 or span-12. When using Compass's mixin approach, I get all that grid layout goodness mixed into my semantic selectors. However since it's much harder to edit a dozen CSS style properties than to toggle a CSS class I lose the ability to quickly play around with the layout.'''
