full_description = "This year I racked up just over ten thousand pages across twenty-five books. Here are a few of my favorites. Biography and military history continued to top my reading list for another year. At the top of both these categories was Grant, Ron Chernow's thousand page biography of the Civil War general and 18th U.S. President. As I mentioned in my review, it may be my favorite Chernow book so far. Seldom does such great storytelling meet such an epic story as in this book. In clear, descriptive language with military detail approaching any Clancy novel, the authors tell the story of Indy, her crew, their successful secret mission to deliver the world's first nuclear weapon, their loss at sea, and the pursuit of justice for their captain. From sea to courtroom, it's an entertaining blend of action, adventure, courage, perseverance, love, heartbreak, loss, and redemption."
