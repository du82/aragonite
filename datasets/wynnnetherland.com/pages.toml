["https://wynnnetherland.com/journal/engineering-onboarding"]
title = "Engineering onboarding"
description = "Even with the best HR department, successful onboarding requires effort from the whole team. Here are some practical ways you and your team can onboard engineers with greater speed and success."
full_description = '''As an engineering team leader, your role in the hiring process doesn't end with an accepted offer. New hires need to be onboarded as productive members of the team. Even with the best HR department, successful onboarding requires effort from the whole team. Here are some practical ways you and your team can onboard engineers with greater speed and success. The time to start preparing for a new team member is long before they join, sometimes before you have an actual name to plug into the org chart. Put some thought into what a new person needs to know and the people they need to meet in that first couple weeks, and start making a list of TODOs. New folks benefit greatly from having a buddy throughout the process, and that is likely not their manager. There are exceptions — brand new or very small teams may have no choice — but in general, managers don't have the availability or the hands-on perspective new hires need. Where you can, assign a peer to be an onboarding buddy for new people. Treat an onboarding event like any other chore you'd track in your project issue tracker. Create a list of everything that needs to happen, who needs to complete the item, and share it with your new hire and their buddy. Task lists in GitHub issues are perfect for this. Provide context for each item on the list and link to any outside resources the new team member will need to complete each task. Be clear about which items are more time sensitive and try to give a rough time frame to have each item completed (Today, This week, Next week, etc.) Hopefully if you've put in the work to find and interview technical people, you've got a backlog waiting on them. That may sound obvious, but I've joined teams where my first assignment was to "sit tight" — once for weeks. Before a new team member reports for duty, compose a list of items that would help them contribute quickly. Most teams identify more work than they can possibly complete. As part of your ongoing triage process, make a note of lower priority issues that require little or no background context to complete. Tagging those items with a Good first issue label provides a backlog for new team members to get started quickly.'''
year_published = 2025
clearnet = "https://wynnnetherland.com/journal/engineering-onboarding"
