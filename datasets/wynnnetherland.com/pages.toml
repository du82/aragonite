["https://wynnnetherland.com/journal/engineering-consistency"]
title = "Engineering consistency"
description = "Inconsistency is a tax. We often struggle so hard to handle inconsistency in the problem domain, we never notice the cost of inconsistency in our code."
full_description = "Southwest Airlines only flies 737s, saving them on maintenance costs and giving them greater flexibility to move aircraft between routes. Inconsistency is a tax. Any mature software project is littered with conditional code to handle the edge cases, the business rule exceptions, the differences. We often struggle so hard to handle inconsistency in the problem domain, we never notice the cost of inconsistency in our code. When you sit down to write code to meet a business requirement, there's a series of questions in the back of your head: As developers, we've got enough UX considerations and Big O questions with any feature, we don't need our code base bringing its own. Every inconsistency in your project adds cognitive overhead, which David Demaree succinctly defines this way: how many logical connections or jumps your brain has to make in order to understand or contextualize the thing you’re looking at. Every inconsistency in your project loads up required context to work in the project, adding ongoing cost borne by the team as they build new features. Sometimes you pay the cost all at once because inconsistent code is harder to refactor. Inconsistent naming conventions, folder structures, and syntax all make it more difficult to automate changes to code. The cost of that inconsistency is often more code to handle the exceptions, time, and energy spent outside of the actual problem domain. As an industry that creates software to solve problems, we have a natural inclination to reach for software to solve the problems we face writing software. Sometimes that works. Frameworks. We tend to think about frameworks primarily as abstractions, tools for reducing complexity, but many frameworks employ convention over configuration, effectively codifying consistency in the framework itself. I've worked on a lot of Rails projects in the last dozen years and never had to wonder where to put a model, view, or controller. Style guides. Teams and communities often develop their own syntactical tastes and document those preferences. GitHub, Airbnb, and Google have all published their own opinionated guides."
year_published = 2025
