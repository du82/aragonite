["https://wynnnetherland.com/journal/hello-in-vision"]
title = "Hello InVision"
description = "I'm excited to be joining InVision as a Principal Engineer working on Studio."
full_description = "The response to my previous post was amazing. Within a week, I had met with people from a half dozen companies trying to find the best fit. By the end of the next week, I had a great offer in hand with a company where I felt I could make a real impact. Then I met Nick one Wednesday for lunch. Over tacos, we reflected on how the development landscape had changed in the twenty years since we'd started, especially on the frontend. Though still rapidly evolving, the rise of design systems and component frameworks makes it feel like we're closing in on the reality of a shared process between designers and developers. Nick works at InVision, a company who has been enabling designers and developers to collaborate better for years. Nick asked if I'd be interested in exploring a role there. I told him that I definitely would, but I already had an offer in hand, and I didn't want to string that company along indefinitely. I was hoping to give them an answer by the end of the week. He said he understood and would talk to his boss and see what they could do. The next 48 hours were a blur. Thursday, I met with Kirby, Nick's manager, and we had an engaging conversation about the product, the tech stack, and scaling engineering teams. That evening I got a call from Clay, an InVision recruiter, asking my availability for interviews the next day. I cleared my calendar, and he scheduled five back-to-back interviews via video calls on Friday. I've run the interview gauntlet many times, but never have I had a series of effortless conversations as these. By 3pm that day, I had received an offer to join InVision as a Principal Engineer working on Studio. I was thrilled to accept."
year_published = 2025
