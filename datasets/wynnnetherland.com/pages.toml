full_description = "When designing the new Orrka site, I wanted more punch in my typography. Let's face it, web typography is boring. It's 2009 and as and industry I think we web designers have gotten our money's worth out of Helvetica and its ilk. Sure, alternatives abound such as sIFR, Cufón, and good old image replacement, but what we really want is simple, standards-based, and legal typography choices. We want every machine on the Internet to have every font from MyFonts installed so we could just use font-family and call it a day. Well maybe that's extreme. We want every machine on the Internet to have the fonts we want to use installed. Font Squirrel is like many font sites you already use — except these fonts are 100% free for commercial use and many have licenses that allow embedding on the web. To use a font downloaded from Font Squirrel, copy the font files to location on your server. Next, add bulletproof @font-face syntax to your stylesheet:"
