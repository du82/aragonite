["https://wynnnetherland.com/journal/making-a-habit-of-saying-thanks"]
title = "Making a habit of saying thanks"
description = "A co-worker once sent me an email I'll never forget. It was a simple thank you note, only a few sentences, but it had a big impact."
full_description = '''A co-worker once sent me an email I'll never forget. It was a simple thank you note, only a few sentences, but it had a big impact. It was spontaneous. We typically treat thank you notes as social receipts. Someone gives us a gift or hosts us for dinner, and we express our appreciation with a small note. Thanks is often transactional. When was the last time someone sincerely thanked you for your work outside of a performance review cycle or not immediately following some major accomplishment? It was specific and personal. He highlighted my individual contributions to the team, even linking to specific pull requests and comments. There was no hint of solicitation or expectation. We're trained to look for the fine print, even in email. There's always an angle. A long lost colleague you haven't heard from in years suddenly reconnects — oh, by the way, they're looking for new career opportunities, can you help? (Not that there's anything wrong with that kind of email. You bet, happy to. What are you looking for?) But that's what made this email even more remarkable. There was no "by the way", no embedded solicitation. Reflecting on the impression his note made on me, I wanted to pay it forward. I wanted to get intentional about expressing gratitude to others in the organization. Schedule spontaneity. From the recipient's point of view, I wanted them to feel the joy of receiving a note of thanks out of the blue. To make that happen consistently, I had to put it on my schedule. I began to set aside half an hour each week to send out thank you notes (long before Fallon I might add). Before long I started making an on deck list, an editorial calendar of sorts. Develop a format, but be sincere. I wanted each note to be heartfelt, personal, and encouraging. After the first few, a format emerged: I just wanted to drop you a note and say I'm glad you're here. I love the way you [some ongoing impactful work] like you did here: [link to a recent instance]. We can always count on you to bring your [unique innate quality] to make the team better. Your work has an impact and it doesn't go unnoticed.'''
year_published = 2025
