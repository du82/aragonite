["https://wynnnetherland.com/journal/supercharge-your-static-site-with-netlify"]
title = "Supercharge your static site with Netlify"
description = "I am loving Netlify for static site publishing - HTTPS for custom domains, redirects, a nice CLI, and more."
full_description = "I've enjoyed using static site generators since discovering Webby nearly ten years ago. Not only do static sites perform better, they're often simpler to set up and deploy. GitHub pages is perhaps the easiest — push to your Git repository and GitHub will serve your site with some basic CDN fronting, thanks to Fastly. It's also free. For a bit more control, you can also roll your own static host using services like Amazon S3 and Cloudfront at minimal cost. Yet I've built enough blogs, brochures, and documentation sites to know the gaps and when to reach for an application server. Even with sophisticated JavaScript-powered frontends, applications often require authentication, server-side redirects, proxied API access, custom security headers and other needs beyond serving static content. I recently discovered Netlify, which adds some features that make static sites more viable in many cases. If you're using GitHub Pages because it's free, you'll enjoy some benefits from Netlify's free tier as well. SSL. I've long wanted to serve this site over HTTPS. Previously, I hosted via GitHub Pages and while GitHub supports HTTPS for sites that run on *.github.io, there's no official support for configuring SSL for sites with a custom domain name. Netlify made it simple to set up. Broader generator support. While GitHub will build your Pages site using Jekyll, Netlify supports practically any static stite generator. Just push your changes up to GitHub and Netlify will take it from there. Live build output. Ever wonder what went wrong with your Jekyll build on GitHub? Netlify streams live build output so you're never in the dark. Atomic deploys. Each build gets its own URL, letting you preview, publish, and rollback to any build with a single click. Multiple deploy contexts. You can configure build options based on the context, giving you the flexiblity to alter the output for a deploy preview. Redirects. Link rot is a real problem. Purely static sites don't have an elegant way to redirect users when content moves without resorting to JavaScript or <meta> tag tricks. Netlify supports flexible server-side redirects to point users to moved content, change your permalink format, or provide pretty URLs, even for push state."
