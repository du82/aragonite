["https://www.wyzant.com/resources/lessons/math"]
title = "Math Resources and Math Lessons - Wyzant Lessons"
description = "Get ready for algebra with our prealgebra section. Not sure what an integer is? Need help working with exponents? You can also develop your math skills with"
full_description = "HomeMath Resources and Math Lessons Wyzant Math Lessons & Help Welcome to the Wyzant Math Help Sections! We have loaded this section full of informative descriptions, interactive math lessons, and sample problems in some of the most challenging math topics. Ready to start honing your skills? Check out one of the sections below and let your favorite math tutor know if you have any questions. Elementary Math This is where it all starts. Addition, subtraction, multiplication, division–you know the drill, right? Explore this section for explanations on telling time, counting money, and converting units of measurement. If you need help finding the greatest common factor (GCF) or the least common multiple (LCM), we’ve got you covered there, too! Still need help? Use our service to find an elementary math tutor. Prealgebra Get ready for algebra with our prealgebra section. Not sure what an integer is? Need help working with exponents? You can also develop your math skills with our lessons on estimation and simple probability. Still need help? Use our service to find a prealgebra tutor. Algebra Ready to move on to algebra? This section covers basic equations, the order of operations, factoring, and the quadratic formula, among others. For more advanced learners, be sure to check out rational expressions and other more difficult topics that will segue into your study of precalculus. Still need help? Use our service to find an algebra tutor. Geometry Next on the list is geometry. Discover properties of lines, angles, and shapes. Once you have developed your geometry skill set, you can solve two-column proofs using your skills. Still need help? Use our service to find a geometry tutor. Trigonometry Trigonometry is all about triangles. This branch of math will teach you the properties of triangles, like acute and right triangles, as well as related concepts like complex numbers. Once you’ve got the basics down, you can move onto the Pythagorean identity, reciprocal identities, and more. Still need help? Use our service to find a trigonometry tutor. Precalculus Precalculus covers the most advanced topics in algebra, geometry, and trigonometry. Look here for more information on matrices and parametric equations, among others. Still need help? Use our service to find a precalculus tutor. Calculus Once you’re comfortable through precalculus, be sure to try your hand at calculus. Thorough discussions of limits, derivatives, and integrals help you better understand the math of change and how it relates to the world around us. Still need help? Use our service to find a calculus tutor. Statistics and Probability Statistics involves the collection, aggregation, and analysis of data. Probability presents a way to apply statistical data analysis to outcomes in different fields. Still need help? Use our service to find a Statistics tutor."
