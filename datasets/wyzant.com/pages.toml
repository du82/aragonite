["https://www.wyzant.com/news"]
title = "Wyzant in the news | Wyzant Tutoring"
full_description = "Online tutoring has enjoyed a “record-breaking interest” in 2020, Wyzant reported in August. And that’s only natural. With all that’s been said above about the convenience of Zoom sessions, they are still far from being as effective as in-person lessons, which results in students needing extra help from teachers. Due to the pandemic and the struggle to navigate remote learning, Wyzant has seen a massive increase in the number of people seeking tutors. After watching The Queen’s Gambit (multiple times), we couldn’t help but wonder if the popular Netflix series is the real deal. For example, does The Queen’s Gambit accurately reflect the game of chess? Coronavirus pandemic is boosting India’s education-technology industry; ‘We get that one-on-one attention they need and it’s affordable’ Here's what parents should know about talking to their children about the electoral college, choosing a candidate to support and more. While gap years aren’t uncommon, students typically use these sabbaticals to travel the world or volunteer for causes that are close to their heart. Some opt to pursue on-site internships that offer an up-close view into the field they hope to pursue. But this year, as COVID-19 continues to raise health concerns that complicate travel and require social distancing... A teacher who now tutors online left a traditional position because she didn’t want to be part of a broken system that wasn’t serving all students’ best interests. At the beginning of the coronavirus pandemic, companies quickly realized the old workplace benefits—on-site meals and dry-cleaning, anyone?—wouldn't translate to remote work. Six months into the coronavirus pandemic and with no return to the office in sight, Chicago-area employers are realizing that working remotely through a global health crisis requires more than helping employees pay for a comfy office chair."
