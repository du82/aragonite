title = "Microsoft Copilot+: Everything you'll be able to do with your new Snapdragon X Elite PC | XDA"
description = "The latest tips, tricks, and news on Microsoft Copilot+ all in one convenient location."
full_description = '''Windows Search may actually find what you're looking for now in a new Insider update By Simon Batt Jan 17, 2025 4 The objectively best AI tool on Copilot+ PCs is arriving on AMD and Intel chips By Simon Batt Dec 18, 2024 Windows 11: Everything you need to know Copilot+ is finally coming to Intel and AMD Windows 11 PCs as Snapdragon exclusivity ends By João Carrasqueira Dec 6, 2024 Windows 11: Everything you need to know After five months of delays, Copilot+ Recall is now available for Windows Insiders By João Carrasqueira Nov 22, 2024 5 things Copilot+ PCs should be able to do instead of Super Resolution By João Carrasqueira Nov 8, 2024 1 It's been a few months since Microsoft announced Copilot+, its AI PC initiative, and it's now going full steam. Qualcomm Snapdragon X series PCs have been out for over six months, and PCs with Intel Core Ultra Series 2 or AMD Ryzen AI 300 HX processors are also getting Copilot+ in the near future, with most features currently in testing with Insiders. It's a big deal, and it changes the computing landscape. So, what does it all mean? Here's a breakdown. Related Copilot, Copilot Pro, and Copilot+ — breaking down Microsoft's confusing AI products Confused by Microsoft's Copilot products? We're here to help. What is Copilot+, and what can I do with it? AI PCs are here I know what you're thinking. It's the same thing everyone thinks when there's a major change is Windows. "I'm fine with the way I use my computer. Why would I want to change that?" I know. A computer is a tool we've been using mostly the same way for decades. It's like telling someone they need to start swinging a hammer differently. Microsoft wants your computer to be friendlier, though. It wants it to be smart enough to work with you, not just do the things you tell it to. Speaking to XDA, Microsoft technical fellow Stevie Bathiche talked about going from being explicit to being implicit. In a briefing that also included Yusuf Mehdi and Windows chief Pavan Davuluri, they even made reference to things being "fuzzy", like how if you click on something and miss the pixel, your PC should be smart enough to know to interact with that object. To do this, the company says it reimagined how Windows works from the inside-out, and it reengineered it to be optimized for Arm processors, not that x86 is getting snubbed. AI technology is moving fast, and while it's fun to poke fun at the blunders of LLMs, that won't be a thing forever. At the end of 2023, Intel Meteor Lake launched with NPUs less than a quarter as powerful as the ones that showed up in the Snapdragon X processors six months later, and then AMD and Intel only took a couple of months to get their own hardware out with Copilot+ support. The hardware is advancing, and the software is keeping pace. They're two components that are driving each other forward, and Microsoft wants to be there. HP OmniBook X Copilot+ is about the whole stack, from hardware, to software, to AI capabilities, and finding new ways to leverage the increased capabilities of the NPUs to make Windows work for you. You'll see more and more of these features show up as the hardware improves. The first wave of features (already available, except for Recall) Recall window.arrayOfGalleries["article-gallery-1-1328870562"] = '&quot; \n \n &lt;div class=\&quot;w-gallery-carousel\&quot;&gt;\n &lt;section id=\&quot;main-carousel-1-1328870562\&quot; class=\&quot;splide splide-gallery\&quot; data-gallery-expanded-id=\&quot;main-expanable-carousel-1-1328870562\&quot;\n data-gallery-expanded-thumbnail-id=\&quot;expanded-gallery-thumbnails-1-1328870562\&quot;&gt;\n &lt;button class=\&quot;expand icon i-expand\&quot; type=\&quot;button\&quot;&gt;&lt;\/button&gt;\n &lt;div class=\&quot;splide__track\&quot;&gt;\n &lt;ul class=\&quot;splide__list\&quot;&gt;\n &lt;li class=\&quot;splide__slide gallery-main-img\&quot;&gt;\n \n \n\n\n\n\n &lt;picture&gt;\n \n \n \n \n \n \n \n \n \n \n \n &lt;source\n media=\&q