title = "The Radeon RX 9070 GPUs are official, and arriving in a few days"
description = "It took a couple of months, but AMD is finally ready to spill the beans on the RX 9070 XT and RX 9070."
full_description = '''{ "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": "1", "name": "Home", "item": "https://www.xda-developers.com/" }, { "@type": "ListItem", "position":"2", "name": "GPU", "item": "https://www.xda-developers.com/gpu/" }, { "@type": "ListItem", "position":"3", "name": "The Radeon RX 9070 GPUs are official, and arriving in a few days", "item": "https://www.xda-developers.com/amd-rx-9070-xt-launch-details/" } ] } The Radeon RX 9070 GPUs are official, and arriving in a few days AMD By Jacob Roach Published 2 days ago Follow Followed Like Thread Link copied to clipboard Sign in to your XDA account Summary AMD says the RX 9070 XT is 26% faster than the RTX 3090 and the RX 9070 26% better than the RTX 3080 at 4K. RX 9070 series GPUs target midrange gamers. Both the RX 9070 XT and RX 9070 feature a 16GB frame buffer, PCIe 5.0 support, and launch on March 6. AMD has finally pulled back the curtain on its hotly anticipated RX 9070 XT and RX 9070. The two GPUs, which debut AMD’s new RDNA 4 architecture, have been at the forefront of the conversation for PC hardware over the past several months, and they might be the two most important graphics cards AMD has released in the past decade. Related 3 reasons why PC gamers should be excited for AMD FSR 4 and RDNA 4 AMD has some cool tech on the way for its next-gen GPUs. Posts 3 RX 9070 XT gaming performance Let’s get the important bits out of the way first. AMD claims the RX 9070 XT is 26% faster than the RTX 3090 and 51% faster than the RX 6900 XT at 4K. Those aren’t great comparison points – both of those GPUs are two generations out of date – but those are the numbers AMD shared. For the base RX 9070, you’re looking at a 26% uplift over the RTX 3080 and 38% improvement over the RX 6800 XT, again at 4K. AMD is using these older GPUs as touchstones because the RX 9070 XT and RX 9070 aren’t gunning for the flagship crown like Nvidia’s RTX 5090. They’re targeting midrange gamers, and there’s a good chance that last-gen flagships will still offer better performance, albeit at a significantly higher price. window.arrayOfGalleries["article-gallery-1-28788169"] = '&quot; \n \n &lt;div class=\&quot;w-gallery-carousel\&quot;&gt;\n &lt;section id=\&quot;main-carousel-1-28788169\&quot; class=\&quot;splide splide-gallery\&quot; data-gallery-expanded-id=\&quot;main-expanable-carousel-1-28788169\&quot;\n data-gallery-expanded-thumbnail-id=\&quot;expanded-gallery-thumbnails-1-28788169\&quot;&gt;\n &lt;button class=\&quot;expand icon i-expand\&quot; type=\&quot;button\&quot;&gt;&lt;\/button&gt;\n &lt;div class=\&quot;splide__track\&quot;&gt;\n &lt;ul class=\&quot;splide__list\&quot;&gt;\n &lt;li class=\&quot;splide__slide gallery-main-img\&quot;&gt;\n \n \n\n\n\n\n &lt;picture&gt;\n \n \n \n \n \n \n \n \n \n \n &lt;source\n media=\&quot;(min-width: 1024px)\&quot;\n data-srcset=\&quot;https:\/\/static1.xdaimages.com\/wordpress\/wp-content\/uploads\/2025\/02\/amd-rx-9070-xt-1440p.jpg?q=49&amp;amp;fit=crop&amp;amp;w=750&amp;amp;h=422&amp;amp;dpr=2\&quot;\n srcset=\&quot;https:\/\/static1.xdaimages.com\/wordpress\/wp-content\/uploads\/2025\/02\/amd-rx-9070-xt-1440p.jpg?q=49&amp;amp;fit=crop&amp;amp;w=750&amp;amp;h=422&amp;amp;dpr=2\&quot;\n \/&gt;\n \n \n \n \n \n \n \n \n \n \n &lt;source\n media=\&quot;(min-width: 768px)\&quot;\n data-srcset=\&quot;https:\/\/static1.xdaimages.com\/wordpress\/wp-content\/uploads\/2025\/02\/amd-rx-9070-xt-1440p.jpg?q=49&amp;amp;fit=crop&amp;amp;w=735&amp;amp;h=413&amp;amp;dpr=2\&quot;\n srcset=\&quot;https:\/\/static1.xdaimages.com\/wordpress\/wp-content\/uploads\/2025\/02\/amd-rx-9070-xt-1440p.jpg?q=49&amp;amp;fit=crop&amp;amp;w=735&amp;amp;h=413&amp;amp;dpr=2\&quot;\n \/&gt;\n \n \n \n \n \n \n \n \n \n \n &lt;source\n media=\&quot;(min-width: 481px)\&quot;\n data-srcset=\&quot;https:\/\/static1.xdaimages.com\/wordpress\/wp-content\/uploads\/2025\/02\/amd-rx-9070-xt-1440p.jpg?q=49&amp;a