full_description = '''{ "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": "1", "name": "Home", "item": "https://www.xda-developers.com/" }, { "@type": "ListItem", "position":"2", "name": "Windows", "item": "https://www.xda-developers.com/windows/" }, { "@type": "ListItem", "position":"3", "name": "The Windows 11 2024 Update is now available — here&#039;s what&#039;s new and why it&#039;s not Windows 12", "item": "https://www.xda-developers.com/windows-11-24h2/" } ] } The Windows 11 2024 Update is now available — here's what's new and why it's not Windows 12 Windows 11: Everything you need to know By João Carrasqueira Updated Oct 31, 2024 Follow Followed Like 10 Thread 21 Link copied to clipboard Sign in to your XDA account Quick Links When will the Windows 11 2024 Update be released? Will the Windows 11 2024 Update be a free upgrade? Will I be forced to upgrade to Windows 11 version 24H2? What's new in the Windows 11 2024 Update? How to get Windows 11 version 24H2 What happened to Windows 12? Windows 11 is one of the best iterations of Microsoft's operating system, and it keeps getting better through feature updates like version 22H2 in 2022 and version 23H2 in 2023. The latest of these updates is Windows 11 version 24H2, an update that was largely believed to be called Windows 12 prior to this year. In the end, the official name in Windows 11 2024 Update, and it's rolling out now to PCs around the world. The focus of the Windows 11 2024 Update is AI, with the introduction of Copilot+ PCs with new features like Recall (though this is coming later), Cocreator in Paint, and new Windows Studio Effects. It's also a huge update for Arm devices, with a new wave of PCs powered by the Qualcomm Snapdragon X series chipsets launching with the update already installed. Related I got to play with Microsoft Copilot+, and this could change how you use your computer You're right not to care about AI PCs, but you wi