full_description = "Released: 2016-10-24 Installation Download XQuartz-2.7.11_rc1.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.6.3 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.7.11_rc1 All changes in 2.7.10 plus: lib: libpng 1.6.26 mesa 12.0.1 If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable."
