title = "XQuartz - XQuartz 2.3.3.1"
full_description = "Released: 2009-05-16 Installation Download XQuartz-2.3.3.1.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5.7 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.3.3.1 All changes in 2.3.3 plus: apps: xinput 1.4.2 libs: libXplugin Fixed a possible crash when closing windows proto: dri2proto 2.0 If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable."
