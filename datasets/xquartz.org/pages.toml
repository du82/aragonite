full_description = "Released: 2007-12-01 Installation Download XQuartz-2.1.0.1.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.1.0.1 All changes in 2.1.0 plus: installer: Fixed package post-install to not error on machines without Xcode. Changes in 2.1.0 Changes in 2.0 app: fontconfig include fonts from {,/System}/Library/Fonts Added LaunchAgent (org.x.fontconfig) to run fc-cache on startup xauth Updated xauth to work with launchd sockets xfs 1.0.5 include fonts from {,/System}/Library/Fonts Fixes CVE-2007-4568 Fixes CVE-2007-4990 xterm Unicode support lib: libX11 1.1.3 Fixes gtk and related crashes libXtrans Updated /usr/X11/include/X11/Xtranssock.c Fix for incorrect processing of recycled launchd socket proto: damageproto 1.1.0 randrproto 1.2.1 server: xorg-server-1.3.0-apple2 xserver codebase updated from 1.2.0 to 1.3 branch Fixes CVE-2007-1003 Fixed support for multiple displays (Xinerama) Fixed yellow cursor issue on Intel machines Fixed broken 3-button mouse emulation (i.e. option-click to paste) Fixed missing support for Japanese JIS-layout keyboards Improved compatibility with Spaces Fixed the “Xquartz chews up 100% CPU when I run xauth / ssh / xdpyinfo” bug Fixed support for customized Applications items Fixed performance problems (slow drawing in Gimp, etc) Fixed focus issues Fixed stuck modifier key issues Big fix to rootless code, which should eliminate some Xquartz crashes – big thanks to Ken Thomases of CodeWeavers Motion events are now given to background windows (like xeyes), like they were in Tiger Fixed condition where quickly-exiting programs could cause Xquartz to chew CPU “Fake RandR” support – Tiger’s X11.app didn’t actually support the RandR extension (which allows display configuration to be changed while the server is running), but it did copy some code that does part of that. I’d like to actually implement support for RandR, but in the mean time I’ve copied the “fake” code into Xquartz. I haven’t yet managed to scrounge up the hardware to test this, so I would appreciate hearing reports about whether this does or does not work. Fixed spurious “Are you sure you want to quit?” message. This message is supposed to be suppressed if you do not have any X client apps running, but it could show up if you had started the server manually and not started any client (uninitialized variable). BTW, this warning can be disabled entirely with the command “defaults write org.x.X11 no_quit_alert true” Adds support for horizontal scroll-wheels on mice Fixed crashes in Damage code due to Rootless conflict Fixed crashes in QueryFontReply Fixed support for JIS (Japanees keyboards now work) Redraw speed fix for apps such as the Gimp and rdesktop Fixed a SafeAlphaComposite bug that caused some GTK apps to crash with a BadMatch error in 24-bit mode Alt is now mapped to Mod_switch by default (back to Tiger’s X11 default) If you want it to be mapped to Alt_L and Alt_R, use ~/.Xmodmap Include Xephyr, Xfake, Xvfb, and Xnest Include missing man pages for Xquartz and other Xservers Updated /A/U/X11.app/C/M/X11 Fixes proper env setting and command line arguments in app_to_run"
year_published = 2025
