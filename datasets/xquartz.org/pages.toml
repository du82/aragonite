title = "XQuartz - XQuartz 2.5.1"
full_description = "Released: 2010-07-10 Installation Download X11-2.5.1.dmg (Leopard) or XQuartz-2.5.1.dmg(Snow Leopard), and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5.8, 10.6.3, or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.5.1 All changes in 2.5.0 plus: app: luit includes changes from Thomas Dickey’s luit-20100601 quartz-wm 1.1.1 Fixed an issue with focus loss (#370) Fixed an issue dragging windows to other spaces (#375) sessreg 1.0.6 xinit Fixed startx to be POSIX compliant for users of non-bash /bin/sh (#399) xinput 1.5.2 xlsatoms 1.1.0 xlsclients 1.1.0 xlsfonts 1.0.3 xscope Fixed a wedge by forcing TCP connections xterm 261 * lib: cairo 1.8.10 libpng 1.2.44 CVE-2010-1205 libpng 1.4.3 CVE-2010-1205 libX11 1.3.4 Now built –with-xcb libXcomposite 0.4.2 libXdamage 1.1.3 libXext 1.1.2 libXfixes 4.0.5 libXfont 1.4.2 libXrender 0.9.6 libxcb 1.6 Fixed $DISPLAY parsing (#390) mesa 7.8.1 pixman 0.18.2 misc: pkg-config 0.25 util-macros 1.10.0 xkeyboard-config 1.9 xorg-sgml-doctools 1.5 proto: xproto 7.0.17 server: xorg-server 1.8.2 plus other patches Move to the 1.8 branch Fixed shift-arrow keys sending math symbols in wine (#295) Added a preference to toggle between Alt_L, Alt_R and Mode_switch (#374) Fixed possible errors with GLX pixel formats Bugzilla #27654 Worked around another instance of the graphics context clipping bug that was causing border render errors (#290) Fix some misreported pointer coordinates with middle click and scrolling (#389)"
