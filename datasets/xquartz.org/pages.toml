["https://xquartz.org/releases/XQuartz-2.6.1.html"]
title = "XQuartz - XQuartz 2.6.1"
full_description = "Released: 2011-03-17 Installation Download X11-2.6.1.dmg (Leopard) or XQuartz-2.6.1.dmg(Snow Leopard), and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5.8, 10.6.3, or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.6.1 All changes in 2.6.0 plus: app: twm 1.0.6 x11perf 1.5.3 xkbcomp 1.2.1 xrdb 1.0.8 xterm 269 lib: cairo 1.10.2 enabled support for tee and XML surfaces libpng 1.5.1 SDKs from previous releases are not provided, but binaries remain for ABI compatibility libX11 1.4.2 Fixes some error handler issues with xcb (#469) libXaw 1.0.9 libXfixes 5.0 libXi 1.4.1 libXp 1.0.1 libXt 1.1.1 pixman 0.20.2 misc: util-macros 1.13.0 proto: dmxproto 2.3.1 eviext 1.1.1 fixesproto 5.0 printproto 1.0.5 xf86driproto 2.1.1 xf86vidmodeproto 2.3.1 xineramaproto 1.2.1 server: xorg-server 1.9.5 plus other patches fixed monitor hot-swapping regression (#460) Windows have the correct color profile when first created (#425) Localization updates"
year_published = 2025
clearnet = "https://xquartz.org/releases/XQuartz-2.6.1.html"
