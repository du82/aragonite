["https://www.xquartz.org/releases/XQuartz-2.8.2.html"]
title = "XQuartz - XQuartz 2.8.2"
full_description = "Released: 2022-06-30 Installation Download XQuartz-2.8.2.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.9 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.8.2 All changes in 2.8.1 plus: Ensure scroll events don’t get sent to X11 windows behind AppKit windows (like release notes) (#130) Update ssh config files when launching XQuartz rather than just during install (#174) Reverted a change that introduced a render performance regression in XQuartz 2.8.1 (#166) Also reverted the change from (#156) which failed to address the issue Fixed a crash that could occur in macOS 11 and later when changing keyboard layout (#205) Fixed an issue that prevented processes spawned by XQuartz from using the microphone or camera (#245) Updated sparkle to 1.27.1 (#199) Transitioned to EdDSA signature verification of future updates Transitioned to a new feed in order to make make use of newer Sparkle features in future updates This has the additional benefit of ensuring that 2.7.11 users are no longer offered beta updates, since 2.7.11 incorrectly defaulted to the beta feed. Updated multiple projects to newer upstream versions Base Project Sources XQuartz 2.8.2 is based on the upstream project versions listed below plus additional patches available from XQuartz Github. Sparkle 1.26.0-a1-46-g7918c1c8 (7918c1c8fc68baa37917eeaa67286b077ad5e393) cairo 1.17.4 (156cd3eaaebfd8635517c2baf61fcf3627ff7ec2) fontconfig 2.14.0-4-gd863f67 (d863f6778915f7dd224c98c814247ec292904e30) freeglut refs/remote-tags/svn/tags/FG_2_8_1_RC1-0-gabe48d82 (abe48d8221305a94bdfbb2b5aef1f6399fa04d2b) freetype2 VER-2-12-1 (e8ebfe988b5f57bfb9a3ecb13c70d9791bce9ecf) libpng/libpng12 libpng-1.2.56-signed-26-g5bb5bf345 (5bb5bf345aef1e62adcfe30791f4364730a2aede) libpng/libpng14 libpng-1.4.19-signed-25-gd53f4696f (d5