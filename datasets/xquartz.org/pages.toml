title = "XQuartz - XQuartz 2.8.1"
full_description = "Released: 2021-04-26 Installation Download XQuartz-2.8.1.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.9 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.8.1 All changes in 2.8.0 plus: Adjusted name of package to XQuartz.pkg rather than Xquartz.pkg for consistency (#137) Re-added older versions of libpng for binary compatibility with wine (#151) Updated xorg-server to address CVE-2021-3472 Updated mesa and other projects to newer upstream versions Fixed font directory setting (#152) Base Project Sources XQuartz 2.8.1 is based on the upstream project versions listed below plus additional patches available from XQuartz Github. Sparkle 1.26.0-a1-5-gc0933a51 (c0933a516b420806e9216e71bd13ba76c54f0de6) cairo 1.17.4 (156cd3eaaebfd8635517c2baf61fcf3627ff7ec2) fontconfig 2.13.93-35-gfd3eeba (fd3eebad741c0fdfce2a7e44f9b3ac8895b70a58) freeglut refs/remote-tags/svn/tags/FG_2_8_1_RC1 (abe48d8221305a94bdfbb2b5aef1f6399fa04d2b) freetype2 VER-2-10-4 (6a2b3e4007e794bfc6c91030d0ed987f925164a8) libpng/libpng12 libpng-1.2.56-signed-26-g5bb5bf345 (5bb5bf345aef1e62adcfe30791f4364730a2aede) libpng/libpng14 libpng-1.4.19-signed-25-gd53f4696f (d53f4696fff0b576a404b6c917392467ffc5df1a) libpng/libpng15 libpng-1.5.26-signed-67-g5944b9473 (5944b9473083c5d03c4600ac5d1675394598e41c) libpng/libpng16 libpng-1.6.31-master-signed-1109-ga37d48365 (a37d4836519517bdce6cb9d956092321eca3e73b) mesa/demos mesa-demos-8.4.0-55-g0f9e7d99 (0f9e7d995a14f15666600fc8598f941b619d82fe) mesa/glu glu-9.0.1-1-g5b9b105 (5b9b10591b50278dd450589226256ea29ba08e2a) mesa/mesa mesa-21.0.3 (091978e0ec92b22773c4831e77aea19a74ed5179) pixman pixman-0.40.0 (244383bf9f3493c014985de46876e40fd5db43f3) xkeyboard-config xkeyboard-config-2.32-9-g8d57dc1 (8d57dc13517e3b6a94bb17bbd4d85075c7ff10da) xorg/app/appres appres-1.0.5-