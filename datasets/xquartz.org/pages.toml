title = "XQuartz"
full_description = "The XQuartz project is an open-source effort to develop a version of the X.Org X Window System that runs on macOS. Together with supporting libraries and applications, it forms the X11.app that Apple shipped with OS X versions 10.5 through 10.7. Quick Download DownloadVersionReleasedInfo XQuartz-2.8.5.pkg 2.8.5 2023-01-26 For macOS 10.9 or later XQuartz-2.7.11.dmg 2.7.11 2016-10-29 For OS X 10.6.3 or later X11-2.6.3.dmg 2.6.3 2011-07-20 For OS X 10.5.x (final Leopard release) Important Info for 10.5 Users OS X Software Updates have included some of the work done by the XQuartz project, but for various reasons, Apple cannot ship the latest and greatest version offered by the XQuartz site. Since the XQuartz X11 package clobbers Apple's X11.app, their software update will clobber the XQuartz X11 package. Because of this, you may experience conflicts after doing a Software Update from Apple. Please re-install the latest XQuartz X11 release for Leopard after installing a system software update to OS X 10.5.x Leopard. /* If we can detect OS X 10.5-10.8 in the user agent string, * set #mav to collapse and #leopard or #snow to visible */ try { if (/Mac[ ]+OS[ ]+X[ ]+10[._]5[^0-9]/i.test(window.navigator.userAgent)) { var mav, leopard, leopard2; mav = document.getElementById('mav'); leopard = document.getElementById('leopard'); leopard2 = document.getElementById('leopard2'); if (mav) { if (leopard) { leopard.className = ''; if (leopard2) { leopard2.className = ''; } mav.className = 'collapsed'; } } } else if (/Mac[ ]+OS[ ]+X[ ]+10[._][6-8][^0-9]/i.test(window.navigator.userAgent)) { var mav, snow; mav = document.getElementById('mav'); snow = document.getElementById('snow'); if (mav) { if (snow) { snow.className = ''; mav.className = 'collapsed'; } } } } catch(e) { /* nothing to do */ } License Info An XQuartz installation consists of many individual pieces of software which have various licenses. The X.Org software components’ licenses are discussed on the X.Org Foundation Licenses page. The quartz-wm window manager included with the XQuartz distribution uses the Apple Public Source License Version 2."
