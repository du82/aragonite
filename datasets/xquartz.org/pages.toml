["https://xquartz.org/releases"]
title = "XQuartz - Releases"
full_description = "Installer Packages XQuartz 2.8.6_beta2 - 2023-06-05 - Pre-Release XQuartz 2.8.5 - 2023-01-26 XQuartz 2.8.4 - 2022-12-24 XQuartz 2.8.3 - 2022-12-09 XQuartz 2.8.2 - 2022-06-30 XQuartz 2.8.1 - 2021-04-26 (See More) Automatic Updates for Pre-release Versions If you would like to receive automatic updates for pre-release versions in addition to release versions, please update to our alpha, beta, or rc SU feed by running one of the following commands: $ defaults write org.xquartz.X11 SUFeedURL https://www.xquartz.org/releases/sparkle-r1/alpha.xml $ defaults write org.xquartz.X11 SUFeedURL https://www.xquartz.org/releases/sparkle-r1/beta.xml $ defaults write org.xquartz.X11 SUFeedURL https://www.xquartz.org/releases/sparkle-r1/rc.xml These feeds are usable with XQuartz 2.8.2_beta2 and newer. MacPorts Another way to get a current X11 installation on your system is through MacPorts. This is currently tested and supported on Tiger and newer versions of macOS. Visit MacPorts to install it on your system. Once installed, run this command from Terminal.app to install the latest X11 server on your system: $ sudo port -v install xorg-server If you want to try a development version of the server, use “xorg-server-devel” instead of “xorg-server” in the command above. If you want all of the X.org client applications as well, run: $ sudo port -v install xorg Homebrew Alternatively, it is possible to install XQuartz with Homebrew. Visit Homebrew to install it on your system. Once installed, run this command from Terminal.app to install the latest X11 server on your system: $ brew install --cask xquartz"
