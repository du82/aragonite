full_description = "Released: 2011-07-20 Installation Download X11-2.6.3.dmg (Leopard) or XQuartz-2.6.3.dmg(Snow Leopard), and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5.8, 10.6.3, or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.6.3 All changes in 2.6.2 plus: app: iceauth 1.0.5 Addresses an issue with home directories on AFP mount-points quartz-wm 1.2.1 Improved initial placement of windows (#481) Window sizes are bounded to the current display size rather than the initial display size (should improve fullscreen games at native resolution) xauth 1.0.6 Addresses an issue with home directories on AFP mount-points lib: libpng-1.2.46 libpng-1.4.8 libpng-1.5.4 CVE-2011-2690 CVE-2011-2691 CVE-2011-2692 server: xorg-server 1.10.3 plus other patches Fixed a crash in RandR when resizing while displays are asleep (#463) Fixed a crash in RandR when launching X11 while displays are asleep Fixed a crash in rootless when resizing to a larger display Fixed a possible race crash at shutdown"
