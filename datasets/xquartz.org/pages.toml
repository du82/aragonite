full_description = "Released: 2008-01-18 Installation Download XQuartz-2.1.3.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.1.3 All changes in 2.1.2 plus: lib: libXfont git 2008.01.14 CVE-2008-0006 server: xorg-server-1.3.0-apple9 fixed ‘login_shell’ defaults key usage when launching from the Applications menu. CVE-2007-5958 CVE-2007-6427 CVE-2007-6428 CVE-2007-6429 CVE-2008-0006"
