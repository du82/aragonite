full_description = "Released: 2009-04-23 Installation Download XQuartz-2.3.3.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5.7 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.3.3 All changes in 2.3.2.1 plus: apps: quartz-wm Properly re-enable the close widget when modal windows are destroyed Fixed a bug when the window was told to unmaximize when it was already not maximized. xinput 1.4.1 xrandr 1.3.0 xterm 243b Xephyr, Xnest, Xfake, Xvfb 1.6.0 proto: applewmproto 1.2.0 dri2proto 1.99.3 randrproto 1.3.0 xproto 7.0.15 xcb-proto 1.4 xextproto 7.0.5 xf86rushproto 1.1.2 lib: AppleSGLX 57 Support the same version of OpenGL as OpenGL.framework (2.1) GLSL and other features now supported Many extensions from OpenGL.framework are now available rewrite of libGL now has support for GLX-1.4 GLXPixmap GLXPbuffer Threading support should be more stable fontconfig Avoid rebuilding font caches when switching between archs freetype 2.3.9 libAppleWM 1.2.0 libICE 1.0.5 libpng 1.2.35 CVE-2009-0040 libxcb 1.2 libX11 1.2.1 libXau Avoid lock failures with AFP home directories libXext 1.0.5 libXfont 1.4.0 libXi 1.2.1 libXrandr 1.3.0 pixman 0.14.0 xcb-util 0.3.3 xpyb 1.1 xtrans 1.2.3 server: Xquartz fixes from xorg-server-1.4.2-apple42 DRI Updates for new libGL Fix CapsLock Fixed mouse tracking for games like Quake2, Halflife, etc in wine. Fixed the annoying spaces bug resulting from accessing menus in a window that you moved to another space When configured for fullscreen mode, initial apps don’t start rootless. Update window levels when changing rootless status Fixed window levels to work with applications that create a desktop (nautilus, etc) Properly send tablet proximity events Localization Updates"
