title = "XQuartz - XQuartz 2.8.5"
full_description = "Released: 2023-01-26 Installation Download XQuartz-2.8.5.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.9 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.8.5 All changes in 2.8.4 plus: Fixed a regression introduced in 2.8.3 that broke MIT-SHM clients going through an ssh tunnel (#314) Updates to the XQuartz server to address a few issues in resize handling and window content rendering (#233 and #307) Fixed issues when resizing motif applications (#308 and #309) Fixed a crash that could occur when opening menus in motif applications (#317) Changed XQuartz server to build COMPOSITE (although it is disabled at runtime) Adjusted thread priorities to be user interactive or user initiated where appropriate Updated libXpm to libXpm-3.5.15 to address CVE-2022-4883, CVE-2022-44617, and CVE-2022-46285 Updated freeglut to current release (3.4.0) Removed a bashism from a startup script, making it more compatible with using dash as /bin/sh (#316) Ignoring NISC18030.ttf because it is a corrupt font or is not parsed correctly (#304) Updated a number of other projects to newer upstream versions Base Project Sources XQuartz 2.8.5 is based on the upstream project versions listed below plus additional patches available from XQuartz Github. Sparkle 1.26.0-a1-46-g7918c1c8 (7918c1c8fc68baa37917eeaa67286b077ad5e393) cairo 1.17.6 (b43e7c6f3cf7855e16170a06d3a9c7234c60ca94) fontconfig 2.14.1 (c45e09df1ef235d653d56aef05012f6a3cc57979) freeglut v3.2.2-64-g63c0e78d (63c0e78d84ecbfcf8accd8bac04404427899053b) freetype2 VER-2-12-1 (e8ebfe988b5f57bfb9a3ecb13c70d9791bce9ecf) libpng/libpng12 libpng-1.2.56-signed-26-g5bb5bf345 (5bb5bf345aef1e62adcfe30791f4364730a2aede) libpng/libpng14 libpng-1.4.19-signed-25-gd53f4696f (d53f4696fff0b576a404b6c917392467ffc5df1a) libpng/libpng15 libpng-1.5.2