title = "XQuartz - XQuartz 2.8.3"
full_description = "Released: 2022-12-09 Installation Download XQuartz-2.8.3.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.9 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.8.3 All changes in 2.8.2 plus: Fixed a crash when editing the Applications menu (#267) Fixed a performance issue impacting gtk3 apps (quartz-wm!2) Updated server to 21.1.4 to address CVE-2022-2319 and CVE-2022-2320 Re-added support for system-wide app preferences (#274) Updated pixman to 0.42.2 to address CVE-2022-44638 Updated xterm to 376b to address CVE-2022-45063 Updated libXft to latest version to address an issue with text in Motif apps(#301) Updated installer package to support downgrading XQuartz.zpp (#300) Updated multiple projects to newer upstream versions Base Project Sources XQuartz 2.8.3 is based on the upstream project versions listed below plus additional patches available from XQuartz Github. Sparkle 1.26.0-a1-46-g7918c1c8 (7918c1c8fc68baa37917eeaa67286b077ad5e393) cairo 1.17.6 (b43e7c6f3cf7855e16170a06d3a9c7234c60ca94) fontconfig 2.14.0-7-gfd0753a (fd0753af88f746fd3d729bf6e1df08eefeeaa3ac) freeglut refs/remote-tags/svn/tags/FG_2_8_1_RC1-0-gabe48d82 (abe48d8221305a94bdfbb2b5aef1f6399fa04d2b) freetype2 VER-2-12-1 (e8ebfe988b5f57bfb9a3ecb13c70d9791bce9ecf) libpng/libpng12 libpng-1.2.56-signed-26-g5bb5bf345 (5bb5bf345aef1e62adcfe30791f4364730a2aede) libpng/libpng14 libpng-1.4.19-signed-25-gd53f4696f (d53f4696fff0b576a404b6c917392467ffc5df1a) libpng/libpng15 libpng-1.5.26-signed-67-g5944b9473 (5944b9473083c5d03c4600ac5d1675394598e41c) libpng/libpng16 libpng-1.6.31-master-signed-1109-ga37d48365 (a37d4836519517bdce6cb9d956092321eca3e73b) mesa/demos mesa-demos-8.5.0-20-g49c89ab7 (49c89ab7a96a2ef5e3200e56d3043372e736e4c9) mesa/glu glu-9.0.2-4-g73d7c8a (73d7c8a9e5bb31b48f11886fa3a82946fa4563f7) 