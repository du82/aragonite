title = "XQuartz - XQuartz 2.2.0.1"
full_description = "Released: 2008-04-14 Installation Download XQuartz-2.2.0.1.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.2.0.1 All changes in 2.2.0 plus: Updated /usr/X11/lib/X11/xinit/privileged_startx.d/10-tmpdirs to address a potential security risk (privilege escalation): A user could create a symbolic link from /tmp/.X11-unix to /usr/X11/lib/X11/xinit/privileged_startx.d and execute privileged_startx to give himself write permission to /usr/X11/lib/X11/xinit/privileged_startx.d Changes in 2.2.0 All changes in 2.1.4 plus: All packages updated to versions intended to ship as part of X11R7.4 (as of 2008.03.14): app: bitmap 1.0.3 bdftopcf 1.0.1 editres 1.0.3 iceauth 1.0.2 ico 1.0.2 luit 1.0.3 Also added Martin’s secure tty patch mkfontdir 1.0.4 mkfontscale 1.0.4 setxkbmap 1.0.4 ttmkfdir 3.0.9 sessreg 1.0.3 twm 1.0.4 x11perf 1.5 xauth 1.0.3 xbacklight 1.1 xcalc 1.0.2 xclock 1.0.3 xconsole 1.0.3 xcursorgen 1.0.2 xdm 1.1.7 xdpyinfo 1.0.2 xdriinfo 1.0.2 xev 1.0.3 xfontsel 1.0.2 xfs 1.0.6 xgamma 1.0.2 xhost 1.0.2 xinit 1.0.8-git-2008.04.13 Moved font caching logic to startx rather than xinitrc Added support for xinitrc.d directory, so fink, macports, et al won’t clobber our xinitrc Moved some stuff out of xinitrc into the xinitrc.d directory Fixed startup to work correctly even with broken .bashrc and .profile (‘set ' bug) Fixed “post-crash titlebar missing” bug Fixed /tmp/.X11-unix permission Now cache system font directories at X11.app startup rather than system startup Renamed startx LaunchAgent org.x.startx from org.x.X11 System xinitrc now works for users with spaces in $HOME xload 1.0.2 xlsfonts 1.0.2 xmag 1.0.2 xman 1.0.3 xmessage 1.0.2 xpr 1.0.2 xmodmap 1.0.3 xprop 1.0.4 xrandr 1.2.3 xrdb 1.0.5 xset 1.0.4 xsetpointer 1.0.1 xsetroot 1.0.2 xvinfo 1.0.2 xwininfo 1.0.3 font: font-xfree86-type1 1.0.1 lib: cairo 1.4.14 libICE 1.0.4 libSM 1.0.3 libX11 1.1.4 libXaw 1.0.4 libXcomposite 0.4.0 libXcursor 1.1.9 libXdamage 1.1 libXext 1.0.4 libXfont 1.3.2 libXi 1.1.3 libXinerama 1.0.3 libXmu 1.0.4 libXpm 3.5.7 libXrandr 1.2.2 libXrender 0.9.4 libXt 1.0.5 libXtst 1.0.3 libXxf86dga 1.0.2 libpng 1.2.26 Includes fix for [CVE:CVE-2008-1382] xcb 1.1 xtrans 1.1 proto: inputproto 1.4.3 printproto 1.0.4 xproto 7.0.12 xcb-proto 1.1 util: makedepend 1.0.1 util-macros 1.1.6 quartz-wm: Restores minimized windows when the server crashes Added preference to control moving X11.app into the foreground when a new X11 window is created Added preference to toggle shading of windows server: xorg-server-1.3.0-apple15 Added informational output when falling through to failsafe startup in X11.app Unsetenv(DISPLAY) when falling through to failsafe startup in X11.app Fixed “confirm on exit” Exposé now works as expected Disabled rlAccel (suspected of causing some crashes, might not be fixed since plans are to support COMPOSITE) X11 works better with spaces"
