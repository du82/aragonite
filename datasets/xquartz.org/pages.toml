["https://www.xquartz.org/releases/XQuartz-2.1.2.html"]
title = "XQuartz - XQuartz 2.1.2"
full_description = "Released: 2008-01-12 Installation Download XQuartz-2.1.2.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.1.2 All changes in 2.1.1 plus: app: xinit git 2008.01.10 Updated xinit to support launchd Now using xinit to start the server rather than running X11.app directly X11.app is relocatable now Fixed fast-user-switching X11 regression Properly honor xauth and tcp/ip preferences xauth git 2008.01.11 fixed duplicate entry crash during xauth remove lib: pixman 0.9.6 proto: compositeproto 0.4 glproto 1.4.9 inputproto-1.4.2.1 renderproto-0.9.3 server: xorg-server-1.3.0-apple7 XQuartz comes to the foreground later in the startup process to not cause ‘XQuartz -version’ to flash a dock icon Fixed -depth command line argument to work properly (still no 8-bit support) added ‘startx_script’ defaults option which defaults to /usr/X11/bin/startx. This is used when launchd support is disabled and the user uses X11.app to start the server (such as with Tiger). added localization from Leopard’s shipped X11. added ‘login_shell’ key to org.x.X11 plist which defaults to /bin/sh and is used for launching from the Applications menu. tcsh users will probably want to change this to /bin/tcsh. There was a bug in the implementation of this last feature, so if you are interested in this, please install the Xquartz-1.3.0-apple8 binary after this package or wait for our next release."
