["https://xquartz.org/releases/XQuartz-2.3.1.html"]
title = "XQuartz - XQuartz 2.3.1"
full_description = "Released: 2008-09-15 Installation Download XQuartz-2.3.1.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.5.5 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.3.1 All changes in 2.3.0 plus: app: xedit 1.1.1 quartz-wm Added –no-pasteboard command line option proto: inputproto 1.4.4 xcb-proto 1.2 lib: mesa-7.1-rc4 For libGLU, libglut, glxgears, glxinfo pixman 0.11.8 Xplugin Added API for detecting if a Carbon EventRef corresponds to a Mac OSX key-equivalent action xpyb 0.9 xtrans 1.2.1-git-2008.08.05 server: Xquartz fixes from xorg-server-1.4.2-apple17 building with mesa 7.0.4 X11.app now properly notices button clicks with tablets Partially fixed xinitrc / launchd-first-client race condition Re-added old fallback keyboard map detection fallback with extra debugging Capslock “press ignored” bug is fixed. Fixed stuck modifier key bug Fixed 3-button mouse emulation The list of modifiers allowed in the fake_button{2,3} defaults has been expanded: fn,{l,r,}{command,alt,shift,control} Expanded handling of key equivalents beyond just the menu when enabled (such as the input menu, etc) Also added appkit_modifiers defaults option which users can set to certain modifier keys to always be for Appkit in case this is insufficient Added window_item_modifiers defaults item (and option to localization) to change the modifier keys used for the windows menu. Set it to an empty string to disable key equivalents for changing windows. Fixed a possible crash in SwitchCoreKeyboard resulting from the use of tablets (or anything sending NSTabletPoint events) Fixed a possible crash in NewCurrentScreen Fixed a possible crash in RootlessNativeWindowMoved Updated the Xquartz man page Don’t warp the pointer on startup Made fd handoff from stub to server more robust Added 256 color mode option to the server (8bit visuals in TrueColor mode are still broken though)"
