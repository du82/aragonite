title = "XQuartz - XQuartz 2.8.6_beta1"
full_description = "Released: 2023-04-02 Installation Download XQuartz-2.8.6_beta1.pkg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.10 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.8.6_beta1 All changes in 2.8.5 plus: Update server to address CVE-2023-0494 and CVE-2023-1393 glxinfo and glxgears now contain arm64 slices (#326) Automatically migrate SUFeedURL to the latest URL for the selected reslease type (#337) Updated multiple projects to newer upstream versions Base Project Sources XQuartz 2.8.6_beta1 is based on the upstream project versions listed below plus additional patches available from XQuartz Github. Sparkle 1.26.0-a1-46-g7918c1c8 (7918c1c8fc68baa37917eeaa67286b077ad5e393) cairo 1.17.8 (c3b672634f0635af1ad0ffa8c15b34fc7c1035cf) epoll-shim v0.0.20220703-29-g702e845 (702e845d7850e30a7b9e29f759c9c8f7bb40784b) fontconfig 2.14.2 (7861a719616b4b132b9cac089c6c64f47832edb1) freeglut v3.2.2-64-g63c0e78d (63c0e78d84ecbfcf8accd8bac04404427899053b) freetype2 VER-2-13-0-2-g23e60caee (23e60caeef4027fdc9d1d40efbb47318a0a7d6f3) libpng/libpng12 libpng-1.2.56-signed-26-g5bb5bf345 (5bb5bf345aef1e62adcfe30791f4364730a2aede) libpng/libpng14 libpng-1.4.19-signed-25-gd53f4696f (d53f4696fff0b576a404b6c917392467ffc5df1a) libpng/libpng15 libpng-1.5.26-signed-67-g5944b9473 (5944b9473083c5d03c4600ac5d1675394598e41c) libpng/libpng16 libpng-1.6.31-master-signed-1178-g07b880311 (07b8803110da160b158ebfef872627da6c85cbdf) mesa/demos mesa-demos-8.5.0-84-g4ddd48f5 (4ddd48f5b398d680b162c12bf6d21adc16cd4dab) mesa/glu glu-9.0.2-5-gb6c3081 (b6c308172993dfd0f76ee9f4fe083cff8c51ced8) mesa/mesa mesa-22.2.5-1-gf21688aeda0 (f21688aeda07c74cdad2506691ad53fa8a4fed5c) pixman pixman-0.42.2 (37216a32839f59e8dcaa4c3951b3fcfc3f07852c) xkeyboard-config xkeyboard-config-2.37-6-g2433ef1a (2433ef1aaa77b7911917b69691