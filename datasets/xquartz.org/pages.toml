sm to start X11 in 10.5.2 is unique to Apple’s 10.5.2 and never appeared in a release from this site in that form (though it was essentially integrated into xinit for 2.1.2). 2008-002 Security Update The 2008-002 Security Update version of X11 is the same as 10.5.2 with some security fixes applied. 10.5.5 10.5.5 contains updates to the X11 server to match what shipped with 2.2.3 (xorg-server-1.3.0-apple22). Most of the userland, however, only saw security updates. The version reported by X11 in 10.5.5 is 2.1.5 to distinguish it from the 2.2.x series which contains a much newer userland. 10.5.7 10.5.7 updates the X11 server to match what shipped with 2.3.2 (xorg-server-1.4.2-apple33). Most of the userland, however, only saw security updates. The version reported by X11 in 10.5.7 is 2.1.6 to distinguish it from the 2.3.x series which contains a much newer userland. Users have reported some issues with the updated X11 in 10.5.7: X11 starts fullscreen for some users Hit cmd-opt-a to leave fullscreen and edit your preferences Clipboard doesn’t work after editing preferences Install the localization updates that contain the clipboard preferences Keyboard mapping is sometimes incorrect This only occurs if you installed xquartz 2.2.x and have not installed newer releases. Install the latest release from this site. 10.6 10.6 contains version 2.3.4 of X11. Not surprisingly, this version lies between 2.3.3.2 and 2.4.0. It contains all the fixes that went into Xplugin, quartz-wm, and most of the server fixes, but it is still on the 1.4 server branch (using xorg-server-1.4.2-apple45). Most of the userland libraries in this version are identical to what was shipped in 2.4.0 with a few exceptions. 10.6.3 10.6.3 contains version 2.3.5 of X11. This version includes xorg-server-1.4.2-apple53 which pulls in many (but not all) server fixes that landed in our 2.5.0 release. In addition, libXplugin and quartz-wm were updated to address some issues with Exposé and wine. fontconfig and a few other libraries were updated as well. 10.6.5 10.6.5 contains version 2.3.6 of X11. This version includes xorg-server-1.4.2-apple56 which pulls in many (but not all) server fixes that landed in our 2.5.1 release. In addition, libXplugin and quartz-wm were updated to address some issues with Exposé and wine. fontconfig and a few other libraries were updated as well. 10.7.0 10.7.0 contains a version of X11 very close to 2.6.3. This version includes xorg-server-1.10.2 with some additional patches. The final release of 2.6.3 included additional patches for the server (past xorg-server-1.10.3) and security fixes for libpng."
