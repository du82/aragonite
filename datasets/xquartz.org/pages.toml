title = "XQuartz - XQuartz 2.7.10_rc1"
full_description = "Released: 2016-09-08 Installation Download XQuartz-2.7.10_rc1.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.12.0 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.7.10_rc1 All changes in 2.7.9 plus: app: quartz-wm Properly handle updates to WM_PROTOCOLS property changes(#92652) xinit Fixed support for enabling TCP server connections (#95379) Added support for enabling IGLX (#96260) defaults write org.macosforge.xquartz.X11 enable_iglx -bool true proto: xcb-proto 1.12 xproto 7.0.29 lib: fontconfig 2.12.1 CVE-2016-5384 freetype 2.7 libpng 1.5.27 libpng 1.6.25 libxcb 1.12 libXfixes 5.0.2 libXfont 1.5.2 Fix a buffer overrun (#83224) libXfont2 Fix a buffer overrun (#83224) libXt Both libXt.6.dylib and libXt.7.dylib are two-level-namespaced now A flat_namespace version of libXt is available in /opt/X11/lib/flat_namespace to help ease the transition (#96292) Set DYLD_LIBRARY_PATH=/opt/X11/lib/flat_namespace when executing older non-compliant software (eg: Motif-based applications) Motif users are encouraged to file bugs against Motif to encourage them to fix that library mesa 11.2.2 xcb-util-cursor 0.1.3 server: xorg-server 1.18.4 plus other patches Fix the issue where the h key could be come “stuck” after hiding XQuartz with cmd-h (#92648)"
