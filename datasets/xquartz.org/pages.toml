["https://www.xquartz.org/releases/XQuartz-2.7.10_beta2.html"]
title = "XQuartz - XQuartz 2.7.10_beta2"
full_description = "Released: 2016-05-31 Installation Download XQuartz-2.7.10_beta2.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.8.5 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.7.10_beta2 All changes in 2.7.9 plus: app: quartz-wm Properly handle updates to WM_PROTOCOLS property changes(#92652) xinit Fixed support for enabling TCP server connections (#95379) Added support for enabling IGLX (#96260) defaults write org.macosforge.xquartz.X11 enable_iglx -bool true proto: xcb-proto 1.12 xproto 7.0.29 lib: libxcb 1.12 libXfixes 5.0.2 libXfont Fix a buffer overrun (#83224) libXfont2 Fix a buffer overrun (#83224) mesa 11.2.2 xcb-util-cursor 0.1.3 server: xorg-server 1.18.3 plus other patches Fix the issue where the h key could be come “stuck” after hiding XQuartz with cmd-h (#92648)"
