full_description = "Released: 2021-03-21 Installation Download XQuartz-2.8.0.dmg, and open it in macOS’s Installer. Important Notices OS Requirements macOS 10.9 or later is required to install this package. Default X11 Server If this is your first time installing XQuartz, you may wish to logout and log back in to update your DISPLAY environment variable. Changes in 2.8.0 Adds native support for Apple Silicon Macs. Removes support for versions of macOS older than 10.9 Uses system libXplugin Removes build-time support for deprecated X11 libraries: libXaw8 libXevie libXfontcache libxkbui libXp libXTrap libXxf86misc Removes deprecated commands: gccmakedep makedepend xdmshell xfindproxy Xfake Removes xpyb Removes older libpng Base Project Sources XQuartz 2.8.0 is based on the upstream project versions listed below plus additional patches available from XQuartz Github. Sparkle 1.24.0-spm-89-g26882d4e (26882d4ed44422cf738cf9b41a6911e2b6c28ab9) cairo 1.17.4 (156cd3eaaebfd8635517c2baf61fcf3627ff7ec2) fontconfig 2.13.93-27-gdba3287 (dba3287bf5dcb2ba0b716749a9a15e7ad43a91f4) freeglut refs/remote-tags/svn/tags/FG_2_8_1_RC1 (abe48d8221305a94bdfbb2b5aef1f6399fa04d2b) freetype2 VER-2-10-4 (6a2b3e4007e794bfc6c91030d0ed987f925164a8) libpng/libpng16 libpng-1.6.31-master-signed-1099-gdbe3e0c43 (dbe3e0c43e549a1602286144d94b0666549b18e6) mesa/demos mesa-demos-8.4.0-5-g1830dcb6 (1830dcb6e48c88f16d328dc4fc9fa32fe3b4956e) mesa/glu glu-9.0.1-1-g5b9b105 (5b9b10591b50278dd450589226256ea29ba08e2a) mesa/mesa mesa-20.3.4-1-g124d611014b (124d611014bcd933247de801a118380a21af2619) pixman pixman-0.40.0 (244383bf9f3493c014985de46876e40fd5db43f3) xkeyboard-config xkeyboard-config-2.32-5-g5ca9f8a (5ca9f8aea2876fe6926fc27f564d36eaf5ca5c8d) xorg/app/appres appres-1.0.5-3-g73e8358 (73e835828184af9230db2176579a4ff74da7785b) xorg/app/beforelight beforelight-1.0.5-7-g958e3cc (958e3ccae8c52ce707369b2492bf649e792c77da) xorg/app/bitmap bitmap-1.0.9-2-gf0b589b (f0b589b685cc3d9f684d9423250f798a8f93142f) xorg/app/