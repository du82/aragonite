["https://www.yahoo.com/entertainment/the-brutalist-puts-the-american-dream--and-the-paradox-of-the-immigrant-experience--on-display-it-troubles-me-that-it-still-exists-star-adrien-brody-says-162703251.html"]
title = "'The Brutalist' puts the American dream — and the 'paradox' of the immigrant experience — on display. 'It troubles me that it still exists,' star Adrien Brody says."
description = "Adrien Brody said he felt a deep connection to his role in the film because of his mother's own refugee experience."
full_description = '''{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/entertainment/the-brutalist-puts-the-american-dream--and-the-paradox-of-the-immigrant-experience--on-display-it-troubles-me-that-it-still-exists-star-adrien-brody-says-162703251.html","headline":"'The Brutalist' puts the American dream — and the 'paradox' of the immigrant experience — on display. 'It troubles me that it still exists,' star Adrien Brody says.","datePublished":"2024-12-18T16:27:03.000Z","dateModified":"2024-12-18T16:27:03.000Z","keywords":["Adrien Brody","Felicity Jones","Brutalist","László Toth"],"description":"Adrien Brody said he felt a deep connection to his role in the film because of his mother's own refugee experience.","publisher":{"@type":"Organization","name":"Yahoo Entertainment","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_entertainment_en-US_h_p_entertainment_2.png","width":368,"height":50},"url":"https://www.yahoo.com/entertainment/"},"author":{"@type":"Person","name":"Kelsey Weekman","url":"https://www.yahoo.com/author/kelsey-weekman-276/","jobTitle":"Reporter"},"creator":{"@type":"Person","name":"Kelsey Weekman","url":"https://www.yahoo.com/author/kelsey-weekman-276/","jobTitle":"Reporter"},"provider":{"@type":"Organization","name":"Yahoo Movies","url":"https://www.yahoo.com/movies","logo":{"@type":"ImageObject","width":712,"height":100,"url":"https://s.yimg.com/os/creatr-uploaded-images/2021-07/74b336b0-dfec-11eb-bdbf-629c9444fdf7"}},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/MuC5N_IMLbOnN2gO0MIHew--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD03NDk-/https://s.yimg.com/os/creatr-uploaded-images/2024-12/2db20d70-bd58-11ef-bdf7-043c294357ba","height":749,"width":1242},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/MuC5N_IMLbOnN2gO0MIHew--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD03NDk-/https://s.yimg.com/os/creatr-uploaded-images/2024-12/2db20d70-bd58-11ef-bdf7-043c294357ba"}'The Brutalist' puts the American dream — and the 'paradox' of the immigrant experience — on display. 'It troubles me that it still exists,' star Adrien Brody says.Like his character, Brody's own mother dedicated her life to “trying to leave behind something of great significance," he told Yahoo Entertainment.Kelsey WeekmanReporterWed, December 18, 2024 at 4:27 PM UTC3 min readAdrien Brody in The Brutalist. (A24/Courtesy of Everett Collection)Yahoo is using AI to generate takeaways from this article. This means the info may not always match what's in the article. Reporting mistakes helps us improve the experience.Generate Key TakeawaysFor Adrien Brody, his role in The Brutalist is more than an opportunity to win awards, though he has already done that. The film, which follows an architect who flees postwar Europe for the United States, hits close to home.“I definitely have an intimate understanding of the immigrant experience, as my mother is a Hungarian refugee,” Brody told Yahoo Entertainment. “My grandparents and my mother fled Budapest in 1956 and came to America with hopes and dreams.”Like his character, László Toth, Brody’s mom dedicated her life to “trying to leave behind something of great significance.”AdvertisementAdvertisement#Ra8kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ra8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Ri8kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Ri8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Newsletter: The YodelTrusted news and daily delights, right in your inboxSee for yourself — The Yodel is the go-to source for daily news, entertainment and feel-good stories.Sign upBy signing up, you agree to our Terms and Privacy Policy.“Her experiences in the past informed her work, and her experiences have influenced me and my understanding of life and my own connection to art and yearnings as an artist,” Brody said. “It’s generational. I feel really grateful to be able to … hopefully give a greater connection to the complexities of that struggle that so many people endure and that our ancestors have endured for our lives today.”The movie, he said, speaks to the “paradox” of the immigrant experience. Though it begins in the year 1947, it's still relevant today.“One leaves behind all this hardship and oppression and comes to a nation such as the United States with all these hopes and dreams and assimilates and leaves behind a lot of that and becomes a member of the community and devotes themselves to it and yet is not still fully accepted or is looked down upon because they sound different, look different, have different beliefs or because of their name,” he said. “It’s just wrong, and it troubles me that it still exists.”Adrien Brody and Felicity Jones in The Brutalist. (Lol Crawley/A24/Courtesy of Everett Collection)Felicity Jones plays László’s wife, Erzsébet, who he’s forced to leave behind in Hungary after the Holocaust. She doesn’t appear until after the movie’s 15-minute intermission, which is built into its whopping 3-hour 35-minute runtime, but her presence looms large.AdvertisementAdvertisement#Ramkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ramkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rimkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rimkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }“In many ways, Erzsébet haunts the first half of the film, and you, as the audience, are put in the headspace of László, waiting for this person to arrive. When she does come off the train, your expectations are extraordinarily high,” Jones told Yahoo Entertainment. “There’s no pressure [for me] in that sense — you just turn up! … You realize in some ways that Erzsébet is a disruptor. We did a Q&A recently and someone described her as a badass, which I thought was a great way of putting it.”Brody said the film is about more than just the immigrant experience.“It is also about the artist’s journey, which is also quite long, and a struggle to not lose the flame and maintain your integrity and stand up for what you believe is right,” he said. “And to do the work you feel is worthy of leaving behind. All of that is relatable to me.”Brody and Jones both raved about how the script’s quality made them want to be a part of the film. It was co-written by director Brady Corbet and Mona Fastvold.AdvertisementAdvertisement#Rb2kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rb2kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rj2kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rj2kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }“I know actors are always banging on about good scripts, so it becomes meaningless,” Jones said. “It was just all there on the page — the intelligence of it, the ambition. … It was so huge, but at the same time it was anchored with these very humorous human interactions that underpin the whole film.”The Brutalist is in select theaters Dec. 20, with a wide release planned for January.Advertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our AdsSolve the daily Crossword37,850 people played the daily Crossword recently. Can you solve it faster than others?37,850 people played the daily Crossword recently. Can you solve it faster than others?CrosswordPlay on Yahoo'''
