["https://www.yahoo.com/entertainment/wicked-stars-ariana-grande-and-cynthia-erivo-say-their-special-friendship-allowed-us-to-really-grow-as-performers-and-in-our-personal-lives-153722399.html"]
title = "'Wicked' stars Ariana Grande and Cynthia Erivo say their 'special' friendship 'allowed us to really grow as performers and in our personal lives'"
description = 'Grande and Erivo tell Yahoo Entertainment they made a "clear choice" to befriend each other off camera.'
full_description = '''{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/entertainment/wicked-stars-ariana-grande-and-cynthia-erivo-say-their-special-friendship-allowed-us-to-really-grow-as-performers-and-in-our-personal-lives-153722399.html","headline":"'Wicked' stars Ariana Grande and Cynthia Erivo say their 'special' friendship 'allowed us to really grow as performers and in our personal lives'","datePublished":"2024-11-22T15:37:22.000Z","dateModified":"2024-11-22T15:37:22.000Z","keywords":["Ariana Grande","Cynthia Erivo","Jeff Goldblum","Wicked cast","Jonathan Bailey"],"description":"Grande and Erivo tell Yahoo Entertainment they made a \"clear choice\" to befriend each other off camera.","publisher":{"@type":"Organization","name":"Yahoo Entertainment","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_entertainment_en-US_h_p_entertainment_2.png","width":368,"height":50},"url":"https://www.yahoo.com/entertainment/"},"author":{"@type":"Person","name":"Taryn Ryder","url":"https://www.yahoo.com/author/taryn-ryder/","jobTitle":"Reporter"},"creator":{"@type":"Person","name":"Taryn Ryder","url":"https://www.yahoo.com/author/taryn-ryder/","jobTitle":"Reporter"},"provider":{"@type":"Organization","name":"Yahoo Movies","url":"https://www.yahoo.com/movies","logo":{"@type":"ImageObject","width":712,"height":100,"url":"https://s.yimg.com/os/creatr-uploaded-images/2021-07/74b336b0-dfec-11eb-bdbf-629c9444fdf7"}},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/RIB.qFWyc99pB5AzJ3XgTA--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyMDA7aD04MDA-/https://s.yimg.com/os/creatr-uploaded-images/2024-10/604d1010-a1f4-11ef-bf66-ba68e8228a62","width":1200,"height":800},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/RIB.qFWyc99pB5AzJ3XgTA--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyMDA7aD04MDA-/https://s.yimg.com/os/creatr-uploaded-images/2024-10/604d1010-a1f4-11ef-bf66-ba68e8228a62"}{"@context":"https://schema.org","@type":"VideoObject","name":"Ariana Grande and Cynthia Erivo on their ‘no-BS’ friendship","description":"<em>Wicked </em>stars Ariana Grande and Cynthia Erivo join Yahoo News to discuss how their on-screen partnership became an off-screen friendship. “We've just taken such great care of each other since the moment that we met,” says Grande.","thumbnailUrl":"https://s.yimg.com/uu/api/res/1.2/nx1sfjByxQACmMcvqth82Q--~B/aD0xOTgzO3c9MzUyMjthcHBpZD15dGFjaHlvbg--/https://s.yimg.com/os/creatr-uploaded-images/2024-10/79d51200-a39b-11ef-b3fe-5dfea5ae012c","duration":"PT53S","contentUrl":"https://video.media.yql.yahoo.com/v1/video/sapi/hlsstreams/005371f5-6f3b-3258-8866-72521efd5a5b.m3u8?site=entertainment&region=US&lang=en-US&devtype=desktop&src=sapi","embedUrl":"https://www.yahoo.com/news/ariana-grande-cynthia-erivo-no-134520584.html?format=embed","identifier":"005371f5-6f3b-3258-8866-72521efd5a5b"}'Wicked' stars Ariana Grande and Cynthia Erivo say their 'special' friendship 'allowed us to really grow as performers and in our personal lives'The "Wicked" cast say Grande and Erivo's friendship helped set the tone on set. "It created a really amazing warm atmosphere" on set, Ethan Slater says.Taryn RyderReporterFri, November 22, 2024 at 3:37 PM UTC3 min readYahoo is using AI to generate takeaways from this article. This means the info may not always match what's in the article. Reporting mistakes helps us improve the experience.Generate Key TakeawaysAriana Grande and Cynthia Erivo say they made "a clear choice" to befriend each other when they were cast in Wicked — something not all stars do on film sets. Their offscreen chemistry is something co-star Jeff Goldblum says is "rare and uncommon."Grande tells Yahoo Entertainment she was captivated by Erivo two years before they met when she saw the Harriet star sing "Stand Up" at the 2020 Oscars."I remember ... turning to my mom and saying, 'That is the best female voice I've ever heard in my life. What is happening? Like, I need to meet her and tell her that and one day sing with her.' And now here we are and we've just taken such great care of each other," the 31-year-old Grammy winner says. "Since the moment that we met in a very real way, in a no BS way, honest and very communicative and kind and loving friendship."AdvertisementAdvertisement#Ra8kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ra8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Ri8kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Ri8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Newsletter: The YodelTrusted news and daily delights, right in your inboxSee for yourself — The Yodel is the go-to source for daily news, entertainment and feel-good stories.Sign upBy signing up, you agree to our Terms and Privacy Policy.Erivo, who plays Elphaba to Grande's Glinda, agrees."I think the thing I love about what we've done is there was a clear choice at the very beginning of this to do that and to take care of each other, to be honest," she says. "To always make the space for one another, which I think has just allowed us to really grow as performers and in our personal lives as well. I think it's been really special to do that."Erivo, 37, says it was "weird" because she and Grande kept "orbiting one another" before they were cast in the film, but never actually met. "We've sung the songs of these characters, but in opposition," she explains, "and it's sort of like been that for us until now."A fan of the musical stage play before she was cast in the film, Erivo says she "definitely" connects with Elphaba.AdvertisementAdvertisement#Rakkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rakkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rikkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rikkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }"I understand what it feels like to be very different, but you know, that lightness [of Glinda] that's something that is definitely a part of who I am also," she says. "I don't necessarily always get to show it, but it's there, you know? That is the nature of it. We're [containing] multitudes."That lightness is something the Wicked cast and crew saw in Erivo and Grande."They have a very special [bond]," says Jonathan Bailey, who plays Elphaba and Glinda's love interest Fiyero. "They're incredibly talented, but there's something that I would say about this film is that the performances that they give are so incredible that just their sheer talent alone doesn't get to the heights, the dizzying heights that they achieve in this film."Goldblum, who portrays the Wizard of Oz, calls Erivo and Grande "true greats of our time."AdvertisementAdvertisement#Rb0kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rb0kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rj0kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rj0kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }"Jeff I think also — I don't know if it is rare, maybe you will know more about this, but when you are with them doing the scene, you're thinking, 'This is just magic,'" Bailey says."I think it's rare and uncommon and unique," Goldblum agrees.Marissa Bode, who plays Elphaba’s sister Nessarose, says that "from the jump" Grande went out of her way to be "incredibly welcoming.""I hadn't met Ari and my first day she had in my green room a bouquet of flowers and a little card saying 'Welcome,' which was really sweet," the actress said.AdvertisementAdvertisement#Rbakb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rbakb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rjakb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rjakb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }"I think they both had such a generosity of spirit and from the second that we were all on set together, they were setting the tone and leading by example," Ethan Slater — who also happens to be Grande's boyfriend — tells Yahoo."They let their talent speak for itself and then they could just be really kind to everyone," continued Slater, who plays Boq, a Munchkinlander in love with Glinda. "And the entire set — the crew, the cast, everyone who was there with us in Oz — just loved both of them so deeply and I think it created a really amazing warm atmosphere."Wicked is only in theaters on Friday, Nov. 22.Advertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our AdsSolve the daily Crossword37,850 people played the daily Crossword recently. Can you solve it faster than others?37,850 people played the daily Crossword recently. Can you solve it faster than others?CrosswordPlay on Yahoo'''
