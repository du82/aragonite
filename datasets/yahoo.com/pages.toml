["https://www.yahoo.com/entertainment/conclave-director-welcomes-disagreements-about-the-movies-take-on-catholicism-if-there-were-controversy-i-never-think-its-bad-195428077.html"]
title = "'Conclave' director welcomes disagreements about the movie's take on Catholicism: 'If there were controversy, I never think it's bad'"
description = '"Conclave," a new film about Catholic Church officials gathering to select a new pope, has stirred controversy among religious commentators.'
full_description = '''{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/entertainment/conclave-director-welcomes-disagreements-about-the-movies-take-on-catholicism-if-there-were-controversy-i-never-think-its-bad-195428077.html","headline":"'Conclave' director welcomes disagreements about the movie's take on Catholicism: 'If there were controversy, I never think it's bad'","datePublished":"2024-10-31T19:54:28.000Z","dateModified":"2024-10-31T19:54:28.000Z","keywords":["Ralph Fiennes","Edward Berger","Catholic Church","Conclave","Cardinal Lawrence","Ben Shapiro","Everett Collection"],"description":"\"Conclave,\" a new film about Catholic Church officials gathering to select a new pope, has stirred controversy among religious commentators.","publisher":{"@type":"Organization","name":"Yahoo Entertainment","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_entertainment_en-US_h_p_entertainment_2.png","width":368,"height":50},"url":"https://www.yahoo.com/entertainment/"},"author":{"@type":"Person","name":"Kelsey Weekman","url":"https://www.yahoo.com/author/kelsey-weekman-276/","jobTitle":"Reporter"},"creator":{"@type":"Person","name":"Kelsey Weekman","url":"https://www.yahoo.com/author/kelsey-weekman-276/","jobTitle":"Reporter"},"provider":{"@type":"Organization","name":"Yahoo Entertainment","url":"http://www.yahoo.com/entertainment","logo":{"@type":"ImageObject","width":712,"height":100,"url":"https://s.yimg.com/cv/apiv2/hlogos/yahoo_ENTERTAINMENT_Light.png"}},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/s.mobbVHdabXOTAX1FcohA--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD01MTc-/https://s.yimg.com/os/creatr-uploaded-images/2024-10/3e963f80-97ba-11ef-bef4-edd4fc0d2f61","height":517,"width":1242},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/s.mobbVHdabXOTAX1FcohA--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD01MTc-/https://s.yimg.com/os/creatr-uploaded-images/2024-10/3e963f80-97ba-11ef-bef4-edd4fc0d2f61"}'Conclave' director welcomes disagreements about the movie's take on Catholicism: 'If there were controversy, I never think it's bad'Edward Berger told Yahoo Entertainment that he didn't want the film to be "a takedown of the Catholic Church."Kelsey WeekmanReporterThu, October 31, 2024 at 7:54 PM UTC3 min readRalph Fiennes in Conclave. (Focus Features/Courtesy Everett Collection)Yahoo is using AI to generate takeaways from this article. This means the info may not always match what's in the article. Reporting mistakes helps us improve the experience.Generate Key TakeawaysDirector Edward Berger didn’t intend for his new movie Conclave to be “a takedown of the Catholic Church,” though some may see it that way.The film, which is now in theaters, follows Cardinal Lawrence (Ralph Fiennes) as he assembles a group of religious leaders known as a conclave to select a new pope. They gossip and campaign while scandals from papal candidates are revealed, as well as tension between progressive and conservative factions.Berger told Yahoo Entertainment that he “tried to portray … the characters in the movie as humans.”AdvertisementAdvertisement#Ra8kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ra8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Ri8kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Ri8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Newsletter: The YodelTrusted news and daily delights, right in your inboxSee for yourself — The Yodel is the go-to source for daily news, entertainment and feel-good stories.Sign upBy signing up, you agree to our Terms and Privacy Policy.“Humans make mistakes and have problems and are weighed down by their conscience,” he said. “That's what I'm embracing, not all the evils of [the Catholic Church], but just trying to understand what humans are.”On Oct. 5, weeks before the film was released in theaters, conservative commentator Ben Shapiro shared a video about Conclave, titled “Catholics Should Be PISSED At This Movie.” He read the Robert Harris book on which the movie was based and determined that Berger’s film was “about how the traditional Catholic Church is evil and how the church needs to become a progressive bastion.”“This is not a movie that is going to take Catholicism seriously,” Shapiro said in the video. “It’s gonna use all the trappings of Catholicism to preach about the evils of the Catholic Church.”A review on the Catholic news site Angelus said the movie was “full of bias against the Catholic Church.” A post about the film in Catholic League condemned it as “anti-Catholic propaganda.” An Indiana priest said in a YouTube video that the film is “about mocking salvation.”Cardinals gather to cast their votes for the next pope in Conclave. (Focus Features/Courtesy Everett Collection)Berger told Yahoo Entertainment that he sees arguments and discussions about the movie as “a good thing.”AdvertisementAdvertisement#Raokb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Raokb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Riokb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Riokb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }“In the end, if there were controversy, I never think it’s bad. I invite that. I love that. We’ve lost the ability to argue with each other without fighting each other,” he said. “And if everyone has a different opinion and a different feeling, that's a good thing.“If I disagree with you, I might learn something from you … and suddenly go, ‘Ah, OK, never thought about it that way. Thank you for teaching me,’” he added.Berger said that they tried to portray the process of forming a conclave and selecting a new pope as accurately as possible but filled in the gaps in their knowledge with their own ideas.“After all, it is a movie,” he said.AdvertisementAdvertisement#Rb4kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rb4kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rj4kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rj4kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Ralph Fiennes told Yahoo Entertainment that he understands why people are drawn to stories about secretive worlds, from religious gatherings to spy stories.“If you keep something hidden, I want to know what you’ve got,” he said. “It’s a catalyst for people’s curiosity.”The fact that conclaves are “ancient” and involve “all these rituals” contributes to the intrigue as well, Fiennes added.“Is it outmoded, outdated? Possibly, yes, but it's there, it's going on,” he said. “So here's this ancient ritual still happening, which is still, it's still secret. I think all those things make it dramatically potent.”AdvertisementAdvertisement#Rbekb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rbekb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rjekb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rjekb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Berger said he hopes audience members relate to Fiennes’s character, Lawrence, who takes on a major leadership role despite his struggle with faith.“I personally love … Lawrence’s inner arc, and this wrestling with who he is and his purpose in the world,” Berger said. “If people go through this journey with him, I’m really happy.”Conclave is in theaters now.Advertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our AdsSolve the daily Crossword37,850 people played the daily Crossword recently. Can you solve it faster than others?37,850 people played the daily Crossword recently. Can you solve it faster than others?CrosswordPlay on Yahoo'''
