title = "Cancellations, resignations follow Trump's move to reshape the Kennedy Center"
description = "Trump’s takeover fuels cancellations and artistic controversy."
full_description = '''{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/entertainment/cancellations-resignations-follow-trumps-move-to-reshape-the-kennedy-center-013242134.html","headline":"Cancellations, resignations follow Trump's move to reshape the Kennedy Center","datePublished":"2025-02-14T15:19:39.000Z","dateModified":"2025-02-14T15:19:39.000Z","keywords":["President Trump","the Kennedy Center","Getty Images","Adam Weiner","David A. Smith","board members","Issa Rae","White House","New York Yankees","New England Patriots"],"description":"Trump’s takeover fuels cancellations and artistic controversy.","publisher":{"@type":"Organization","name":"Yahoo Entertainment","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_entertainment_en-US_h_p_entertainment_2.png","width":368,"height":50},"url":"https://www.yahoo.com/entertainment/"},"author":{"@type":"Person","name":"David Artavia","url":"https://www.yahoo.com/author/david-artavia/","jobTitle":"Reporter"},"creator":{"@type":"Person","name":"David Artavia","url":"https://www.yahoo.com/author/david-artavia/","jobTitle":"Reporter"},"provider":{"@type":"Organization","name":"Yahoo Entertainment","url":"http://www.yahoo.com/entertainment","logo":{"@type":"ImageObject","width":712,"height":100,"url":"https://s.yimg.com/cv/apiv2/hlogos/yahoo_ENTERTAINMENT_Light.png"}},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/lOUsCtoz9Zx8NB7BLM_Psw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD04Mjg-/https://s.yimg.com/os/creatr-uploaded-images/2025-02/2e9b88c0-ea6b-11ef-beee-3d32431ca4e2","height":828,"width":1242},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/lOUsCtoz9Zx8NB7BLM_Psw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD04Mjg-/https://s.yimg.com/os/creatr-uploaded-images/2025-02/2e9b88c0-ea6b-11ef-beee-3d32431ca4e2"}Cancellations, resignations follow Trump's move to reshape the Kennedy CenterWith President Trump in charge, the Kennedy Center is facing a crisis as artists like Issa Rae and Low Cut Connie, along with key board members, are walking away.David ArtaviaReporterUpdated Fri, February 14, 2025 at 3:19 PM UTC4 min readPresident Trump has taken over as chairman of the Kennedy Center for the Performing Arts. (Allison Robbert/AFP via Getty Images)Yahoo is using AI to generate takeaways from this article. This means the info may not always match what's in the article. Reporting mistakes helps us improve the experience.Generate Key TakeawaysFollowing through on a pledge made earlier this month, President Trump ousted 18 members of the Kennedy Center for the Performing Arts’ board, replacing them with a Trump-aligned majority that on Wednesday appointed him chairman “effective immediately.”The fallout from the changes has been swift as prominent artists canceled performances and key board members resigned in protest, and on Thursday evening, dozens of D.C. residents gathered outside the Kennedy Center to denounce Trump’s changes.Philadelphia-based rock and soul band Low Cut Connie announced Thursday it was canceling a scheduled March 19 performance.AdvertisementAdvertisement#Ra8kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ra8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Ri8kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Ri8kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Newsletter: The YodelTrusted news and daily delights, right in your inboxSee for yourself — The Yodel is the go-to source for daily news, entertainment and feel-good stories.Sign upBy signing up, you agree to our Terms and Privacy Policy.“I was very excited to perform as part of this wonderful institution’s Social Impact series, which emphasizes community, joy, justice and equity through the arts,” band founder Adam Weiner wrote on Instagram. “Upon learning that this institution that has run nonpartisan for 54 years is now chaired by President Trump himself and his regime, I decided I will not perform there.”Adam Weiner of Low Cut Connie. (David A. Smith/Getty Images)Similarly, Issa Rae canceled her sold-out show, An Evening With Issa Rae, at the venue after hearing about Trump’s new role.“Unfortunately, due to what I believe to be an infringement on the values of an institution that has faithfully celebrated artists of all backgrounds through all mediums, I’ve decided to cancel my appearance at this venue,” she wrote on Instagram.Musician Ben Folds, a longtime artistic adviser to the National Symphony Orchestra, resigned his post immediately following Trump’s installation as chairman. He was soon joined by Renée Fleming, the world-renowned soprano who had served as an artistic adviser at large at the center.AdvertisementAdvertisement#Ramkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ramkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rimkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rimkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }“I’ve treasured the bipartisan support for this institution as a beacon of America at our best,” Fleming said in a statement. “I hope the Kennedy Center continues to flourish and serve the passionate and diverse audience in our nation’s capital and across the country.”Shonda Rhimes, the producer behind the television hits Grey’s Anatomy and Bridgerton, had served as treasurer of the Kennedy Center’s board after being appointed by President Barack Obama. She resigned within hours of Trump’s takeover.How Trump took over the Kennedy CenterIn early February, Trump announced on Truth Social his plan to “immediately terminate” board members appointed by President Joe Biden, saying they “do not share” his vision. He then replaced them with a roster of White House officials, administration insiders and wealthy donors. On Wednesday the new board appointed him chairman.“It is a Great Honor to be Chairman of The Kennedy Center, especially with this amazing Board of Trustees,” Trump responded in a statement. “We will make The Kennedy Center a very special and exciting place!”AdvertisementAdvertisement#Rb4kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rb4kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rj4kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rj4kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }CNN's Jake Tapper obtained audio from a recent meeting between Trump and the new board, during which the president called the leadership changes "a very exciting development," saying, "I think we're going to make it hot."Trump’s new Kennedy Center board members include:Usha Vance, second lady of the United StatesSusie Wiles, White House chief of staffCheri Summerall, Wiles’s motherDan Scavino, White House deputy chief of staff for national securitySergio Gor, White House director of presidential personnelAllison Lutnick, wife of commerce secretary nominee Howard LutnickPamela Gross, former White House adviser to the first ladyPatricia Duggan, major Trump donorEmily May Fanjul, wife of sugar magnate and Trump donor Pepe FanjulDana Blumberg, wife of New England Patriots owner Robert KraftMindy Levine, wife of New York Yankees president Randy LevinePerhaps the most dramatic move was Trump’s appointment of Richard Grenell, his former ambassador to Germany and former acting director of national intelligence, as interim president of the Kennedy Center — ousting long-serving Kennedy Center president Deborah Rutter months before her planned departure.The Kennedy Center board has historically been evenly divided between Republican and Democratic appointees, according to the New York Times. Board members typically serve six-year terms, and it is unusual for an incoming president to dismiss appointees en masse.Looking ahead, Trump’s allies are likely to reshape the Kennedy Center’s programming to align with the president’s values, steering away from what he views as “woke culture,” sources told CBS News. Already the Kennedy Center has removed an LGBTQ Pride concert scheduled for May from its website.Advertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our Ads'''
