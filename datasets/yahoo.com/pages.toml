["https://www.yahoo.com/entertainment/is-emilia-perez-emerging-as-the-villain-of-awards-season-heres-what-that-means-181433279.html"]
title = "Is 'Emilia Pérez' emerging as the villain of awards season? Here's what that means."
description = "After dominating the Golden Globes, racking up SAG Award nominations and leading the Oscars field with 13 nods, the Spanish-language musical is facing backlash."
full_description = '''{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/entertainment/is-emilia-perez-emerging-as-the-villain-of-awards-season-heres-what-that-means-181433279.html","headline":"Is 'Emilia Pérez' emerging as the villain of awards season? Here's what that means.","datePublished":"2025-01-23T14:43:48.000Z","dateModified":"2025-01-23T14:43:48.000Z","keywords":["Emilia Pérez"],"description":"After dominating the Golden Globes, racking up SAG Award nominations and leading the Oscars field with 13 nods, the Spanish-language musical is facing...","publisher":{"@type":"Organization","name":"Yahoo Entertainment","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_entertainment_en-US_h_p_entertainment_2.png","width":368,"height":50},"url":"https://www.yahoo.com/entertainment/"},"author":{"@type":"Person","name":"Kelsey Weekman","url":"https://www.yahoo.com/author/kelsey-weekman-276/","jobTitle":"Reporter"},"creator":{"@type":"Person","name":"Kelsey Weekman","url":"https://www.yahoo.com/author/kelsey-weekman-276/","jobTitle":"Reporter"},"provider":{"@type":"Organization","name":"Yahoo Movies","url":"https://www.yahoo.com/movies","logo":{"@type":"ImageObject","width":712,"height":100,"url":"https://s.yimg.com/os/creatr-uploaded-images/2021-07/74b336b0-dfec-11eb-bdbf-629c9444fdf7"}},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/NeBdOEExYJwLDLMXPn8Ssw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD01MjE-/https://s.yimg.com/os/creatr-uploaded-images/2025-01/2cc1cd60-cde8-11ef-96cf-d908850baa9f","height":521,"width":1242},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/NeBdOEExYJwLDLMXPn8Ssw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD01MjE-/https://s.yimg.com/os/creatr-uploaded-images/2025-01/2cc1cd60-cde8-11ef-96cf-d908850baa9f"}Is 'Emilia Pérez' emerging as the villain of awards season? Here's what that means.Each year, a film emerges as the most hated of its awards-nominated peers. It also often wins Best Picture.Kelsey WeekmanReporterUpdated Thu, January 23, 2025 at 2:43 PM UTC4 min readSelena Gomez in Emilia Pérez. (Netflix/Courtesy of Everett Collection)Yahoo is using AI to generate takeaways from this article. This means the info may not always match what's in the article. Reporting mistakes helps us improve the experience.Generate Key TakeawaysAs the 2025 Oscars inch ever closer this season’s villains are also taking shape. One movie is rising to the top, racking up four Golden Globe wins and 13 Oscar nominations as well as ill will from some critics: Emilia Pérez.What does it mean to be a villain in a competition among films? As Bobby Finger wrote in 2018, it began as a personal tradition of “picking a least favorite movie and dumping on it so hard for five long months, to the point that I condition myself into perceiving the movie not only as a piece of utter shit, but as my sworn enemy, the cultural artifact I hate most, my cinematic kryptonite.”Over the years, several movies have emerged as villains, appearing to be widely hated online yet racking up awards and nominations, just like Emilia Pérez is now. Past villains include 2018’s Three Billboards Outside Ebbing, Missouri; 2019’s Green Book; 2022’s CODA and 2024’s Maestro.AdvertisementAdvertisement#Raakb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Raakb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Riakb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Riakb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Newsletter: The YodelTrusted news and daily delights, right in your inboxSee for yourself — The Yodel is the go-to source for daily news, entertainment and feel-good stories.Sign upBy signing up, you agree to our Terms and Privacy Policy.There are many reasons certain films might be considered villains, and online buzz can help point to why. Sometimes, like in the cases of Three Billboards and Green Book, the movies are perceived by some as trying to signal virtue, but they instead fall short, shoehorning reductive narratives into something advertised as open-minded. Both movies were nominated for Best Picture in their respective years, with Green Book winning the top prize.As Alissa Wilkinson wrote about Three Billboards, which follows a woman who’s fed up with the criminal justice system in her town and takes on a racist cop, “when the movie started screening outside the festival circuit weeks later, what had looked like consensus between both audiences and critics began to crumble.” In small, exclusive circles, films are initially screened and earn awards that generate buzz for the general public to get excited about. But the public doesn’t always receive those films well, igniting chatter and backlash online.Sometimes the hate is less nuanced. Maestro’s director, co-producer and star Bradley Cooper was perceived as a try-hard who wanted so to win an Academy Award, it was obvious. The film was nominated for seven Oscars but won none of them.Some films are hated for being too pretentious, but others are hated for not being pretentious enough. CODA, a movie about the only hearing member of a deaf family who has aspirations of becoming a singer, was panned as too feel-good and a “glorified Lifetime movie.” It won Best Picture.AdvertisementAdvertisement#Ramkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ramkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rimkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rimkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Emilia Pérez appears to be the villain of the 2025 awards season. It’s a Spanish-language musical crime comedy from French director Jacques Audiard that follows a Mexican lawyer who helps a notorious cartel boss transition into living as a woman — the titular Emilia Pérez. Over the course of the film, Pérez goes to extreme lengths to atone for her past actions and to reunite with the children she left behind. It stars Zoe Saldaña, Karla Sofía Gascón and Selena Gomez.Karla Sofía Gascón in Emilia Pérez. (Netflix/Courtesy of Everett Collection)Like other villains before it, Emilia Pérez was lauded by festival cinephiles but didn’t make a huge splash among the general public. It made waves at Cannes in May, but when it landed on Netflix in November, it never topped the streaming service’s movie charts. It has generally favorable reviews with a 76% score on Rotten Tomatoes and has won dozens of accolades, including Best Motion Picture — Musical or Comedy at the Golden Globes.As the film has racked up awards, the backlash has been mounting as well. Some points of critique include the exclusion of Mexican actresses in the movie’s main cast, the performance of an actress who isn’t fluent in Spanish in a Spanish-speaking role and concerns that Mexican culture was overlooked by the film’s French director.GLAAD criticized the film in a lengthy article for using the protagonist’s transgender identity as a redemption arc, calling it “profoundly retrograde.” Other critics in the Cut, PinkNews and Them shared similar concerns. A musical number from the film about the medical procedures involved in gender confirmation surgery has been going viral for months on X.The discussion of Emilia Pérez reached its peak after its Golden Globes wins, but that didn't turn the tide for Academy voters. It'll be the one to beat at the March 2 ceremony.Advertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our AdsSolve the daily Crossword37,850 people played the daily Crossword recently. Can you solve it faster than others?37,850 people played the daily Crossword recently. Can you solve it faster than others?CrosswordPlay on Yahoo'''
