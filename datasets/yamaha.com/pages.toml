full_description = '''Discover More about Brand Promise Discover More about Brand Promise Discover More about Brand Promise Stop Start News Releases February 26, 2025 Notice of Management Changes February 18, 2025 Yamaha Releases TORCH T01 Digital Piano with Keys Made from Unutilized Materials Exclusive Japan-Only Model Exemplifies Sustainable Manufacturing and Effective Wood Use February 18, 2025 Notice Concerning the Results of Acquisition of Treasury Stock through Off-Auction Own Share Repurchase Trading (ToSTNeT-3) February 17, 2025 Notice Concerning Acquisition of Treasury Stock through Off-Auction Own Share Repurchase Trading (ToSTNeT-3) February 14, 2025 Yamaha Group Selected in Prestigious "A List" for Climate Change by CDP for the Second Consecutive Year Topics WE LOVE MUSIC, IN EVERY KEY. Our worldwide campaign which has expanded to include all music lovers across the globe, embracing the phrase: “WE LOVE MUSIC, IN EVERY KEY.” February 27, 2025 You can download calendars and wallpapers for March / April 2025. We embark on a journey to examine the internal components of a digital piano. Discover More about Newsroom YAMAHA STORIES We share stories of new futures created by Yamaha's technologies, sensibilities, and belief in the power of sound and music, and the people who continue to take on this challenge. The KeyWhere Harmony Begins Encounters With Music That Awaken the Senses Full of immersive and interactive experiences, Yamaha Music Yokohama Minato Mirai invites everyone to discover the joy of music. Featured Topics TORCH Look a century ahead as you play. The brand story for "TORCH", a sustainable instrument project. The Joyful Piano Unprecedented symphonic performance played by three pianists with disabilities, an orchestra and a chorus, made possible by Yamaha’s technology and the passion of musicians. Diversity, Equity & Incusion The Yamaha Group considers the diversity of its human resources to be a source of value creation, and we would like to introduce our commitments and initiatives for DE&I. School Project We are developing activities around the world with the aim of popularizing activities using music and musical instruments in public education. Daredemo Piano Shaping an Inclusive Future in which Everyone Can Know the Joy of Playing the Piano Otonomori Activities Yamaha calls sustainable forests that produce wood suitable for musical instruments "Otonomori" (“Forest of sound” in Japanese) and engages in Otonomori activities throughout Japan and around the world to achieve such forests together with society. Discover More about Stories WHO WE ARE Philosophy & Vision Aiming for "Well-Being of People around the World" Discover More about Philosophy & Vision About Us Providing Yamaha’s unique value through our focus on sound and music Discover More about Us Technology & Design Combining proprietary technologies with rich sensibilities to create new value and joy. Discover More about Technology & Design PRODUCTS & SERVICES Musical Instruments Musical Instruments Musical Instruments Top Pianos Keyboard Instruments String Instruments Guitars, Basses & Amps Brass & Woodwinds Marching Instruments Drums Percussion Music Production Audio Audio Audio Top Home Audio Professional Audio Unified Communications Other Products Other Products Other Products Top Golf Products Apps Services Services Services Top VOCALOID For Business Users For Business Users For Business Users Top Network Devices Electric Devices Automotive Sound System Factory Automation Equipment Automobile Interior Components Acoustic Design Music Education Music Education Music Education Top Yamaha Music School MORE ABOUT YAMAHA Sustainability Investor Relations Recruitment Related Website Yamaha Music Foundation Yamaha Motor Co., Ltd.'''
