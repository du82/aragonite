title = "FAQ (Frequently asked questions) - Investor Relations - Yamaha Corporation"
full_description = "Home Investor Relations FAQ (Frequently asked questions) FAQ (Frequently asked questions) Yamaha's history Q1 : When was Yamaha founded? A1 : Yamaha began in 1887 as Nippon Gakki Co., Ltd.It was incorporated on October 12, 1897. In October 1987, on its 100th anniversary,its name was changed to the current Yamaha Corporation. Q2 : When was Yamaha first listed on the Tokyo Stock Exchange (TSE)? A2 : May 1949. Q3 : When did Yamaha first issue American Depository Receipts (ADR)? A3 : July 2003. Stock information Q1 : Who should I contact about transfers and other share procedures? A1 : Please contact Stock Transfer Agency Department of The Sumitomo Mitsui Trust Bank, Limited. For further details please click the following link. General Stock Information Q2 : What is Yamaha's minimum purchase lot? A2 : 100 shares. Q3 : What are Yamaha's TSE code and ADR ticker symbol? A3 : Yamaha's TSE code is 7951 and its ticker symbol is YAMCY. Q4 : When are shareholders entitled to receive dividend payout? A4 : Each March 31st and September 30th. Q5 : What is Yamaha's current share price? A5 : Please click the following link for the share price, current as of 20 minutes. Yamaha Share Q6 : I'd like to know the breakdown of the Yamaha's shareholders. A6 : Please click the following link for shareholder breakdown information. General Stock Information Accounts settlement and financial information Q1 : Where can I find recent earnings information? A1 : For earnings information, please click the following link. Flash Reports/Annual Financial Reports Please click the following link for the presentation materials of financial statements. Presentations Q2 : I would like to know in which business sectors Yamaha operates. A2 : Yamaha's business span musical instruments, audio equipment, electronic devices, and others. Please click the following link for more information on individual business. Our Business Q3 : How can I find out about Yamaha's past earnings? A3 : Please click the following link for past earnings information. Financial Data Q4 : I'd like to see Yamaha's annual report. A4 : Please click the following link for access to Yamaha's annual reports in English. IR Publications Q5 : When will Yamaha's next accounts settlement announcement be? A5 : Please click the following link for information on accounts settlement announcement schedules. Calendar of Events ESG action Q1 : I'd like to know what Yamaha is doing to help protect the global environment. A1 : Yamaha maintains a special division devoted to environmental issues, through which it is engaged in numerous action plans. Please click the following link for more information on Yamaha's environmental initiatives. Sustainability Report"
