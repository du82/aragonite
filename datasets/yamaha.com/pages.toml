full_description = '#d374382 .resize-wrapper { position: relative; width: 100%; } #d374382 .resize-wrapper:before { content: ""; display: block; } #d374382 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d374382 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d374382 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d374382 .resize-wrapper-images0:before{ padding-top: 40.0000%; } HomeProductsApps for iOS and Android™ Apps for iOS and Android™ General Apps #d868842 .resize-wrapper { position: relative; width: 100%; } #d868842 .resize-wrapper:before { content: ""; display: block; } #d868842 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d868842 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d868842 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d868842 .resize-wrapper-image:before{ padding-top: 100.0000%; } LC4 Controller The exclusive LC4 Controller App gives you full control over the Yamaha LC4 Music Lab wirelessly from anywhere in the room. #d614241 .resize-wrapper { position: relative; width: 100%; } #d614241 .resize-wrapper:before { content: ""; display: block; } #d614241 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d614241 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d614241 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d614241 .resize-wrapper-image:before{ padding-top: 100.0000%; } mieRemote The Yamaha mieRemote App for the iPod Touch/iPhone/iPad provides wireless remote control of the Yamaha Music In Education™ General Music Keyboard Lab. The app can control volume settings, song playback and tempo, keyboard muting functions and keyboard preset settings. #d614246 .resize-wrapper { position: relative; width: 100%; } #d614246 .resize-wrapper:before { content: ""; display: block; } #d614246 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d614246 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d614246 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d614246 .resize-wrapper-image:before{ padding-top: 100.0000%; } Nanologue Nanologue boasts a wide scope of inspiring sounds and professional sound effects, sporting a straightforward multi-touch interface and a great-sounding monophonic synthesizer. Used stand-alone and in connection with your iOS host application via Inter-App Audio, Nanologue brings the power of VST 3 technology to the iOS platform. #d614223 .resize-wrapper { position: relative; width: 100%; } #d614223 .resize-wrapper:before { content: ""; display: block; } #d614223 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d614223 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d614223 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d614223 .resize-wrapper-image:before{ padding-top: 100.0000%; } Cubase iC Pro The most advanced Cubase remote control app!Connecting deeper to Cubase than any other app, Cubase iC Pro is the most advanced Cubase control app with a clear focus on recording, making it your very personal recording assistant. The project overview page and the mixer allow you to see your project as you know it from Cubase, while the key command page gives you a powerful tool to set up your most-used keyboard shortcuts and macros. Up to four dedicated cue mixes can be set up with Cubase iC Pro, giving musicians the freedom to adjust their own mix with a iPhone or iPad. Cubase iC Pro is Cubase’s perfect companion! #d614214 .resize-wrapper { position: relative; width: 100%; } #d614214 .resize-wrapper:before { content: ""; display: block; } #d614214 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d614214 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d614214 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d614214 .resize-wrapper-image:before{ padding-top: 100.0000%; } Cubase iC Cubase iC from Steinberg Media Technologies turns your iPhone or iPod Touch into a powerful wireless remote control for Cubase 6 and Cubase 7! Whether you are using Cubase in the studio or on stage, Cubase iC gives you fast and precise control of essential functions from anywhere within your WiFi network range. Cubase iC allows you to control basic transport functions, monitor playback position and control the unique Arranger Track for instant remixing of your Cubase projects. #d614262 .resize-wrapper { position: relative; width: 100%; } #d614262 .resize-wrapper:before { content: ""; display: block; } #d614262 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d614262 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d614262 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d614262 .resize-wrapper-image:before{ padding-top: 100.0000%; } Studio Pass for VST Connect Pro Involve the client directly through the free Studio Pass app for iOS, the ideal complementary for VST Connect Pro. Let your client dial in with an iOS device via Internet and send the mix live to the mobile device in order to receive the feedback needed to get the job done, no matter where the client is that very moment. Studio Pass supports video for eye-to-eye communication and talkback capability so that the client can feed back to you, request changes or give the final go for the mix, and all that conveniently from a portable iOS device. Music Production #d804118 .resize-wrapper { position: relative; width: 100%; } #d804118 .resize-wrapper:before { content: ""; display: block; } #d804118 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d804118 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d804118 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d804118 .resize-wrapper-image:before{ padding-top: 100.0000%; } FM Essential FM Essential is an FM synthesizer app for the iPhone and iPad with real-time synth performance and editing.Connect FM Essential to an MX BK/BU synthesizer and unlock a full set of 271 Voices. #d455357 .resize-wrapper { position: relative; width: 100%; } #d455357 .resize-wrapper:before { content: ""; display: block; } #d455357 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d455357 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d455357 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d455357 .resize-wrapper-image:before{ padding-top: 100.0000%; } reface Soundmondo store and recall reface Voices on iOS #d614234 .resize-wrapper { position: relative; width: 100%; } #d614234 .resize-wrapper:before { content: ""; display: block; } #d614234 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d614234 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d614234 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d614234 .resize-wrapper-image:before{ padding-top: 100.0000%; } Cubasis - Music Production System Cubasis is Steinberg’s streamlined, multitouch sequencer for the iPad. Specially designed for quick and easy operation, Cubasis makes recording, editing and mixing a breeze. Record tracks in DVD audio quality, and edit your music with the Key and Sample Editors, while the included mixer and audio effects polish your song to perfection. Cubasis comes loaded with dozens of virtual instrument sounds which can be played in real time using the virtual keyboard and drum pads. Cubasis’ projects can be even opened in Cubase under Windows and OS X! Cubasis places touch-intuitive production tools in your hands, opening up a new world of possibilities for your creativity. #d614205 .resize-wrapper { position: relative; width: 100%; } #d614205 .resize-wrapper:before { content: ""; display: block; } #d614205 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d614205 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d614205 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d614205 .resize-wrapper-image:before{ padding-top: 100.0000%; } CL eCatalog The CL eCatalog is a digital catalog for the iPad that describes the many features and benefits offered by Yamaha’s CL series digital mixing consoles. It also includes special 25th anniversary content covering Yamaha’s history as a manufacturer of digital mixing equipment. Electronic publishing has made it possible to present this material in greater depth, and in ways that are more informative and enjoyable than traditional print media. #d282630 .resize-wrapper { position: relative; width: 100%; } #d282630 .resize-wrapper:before { content: ""; display: block; } #d282630 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d282630 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d282630 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d282630 .resize-wrapper-image:before{ padding-top: 100.0000%; } Mobile Music Sequencer Discontinued **V3.0 has been released!** With built-in phrase patterns, this sequencer allows the user to intuitively create compositions in a manner that is in tune with the creative process by building up sections with phrases and using these sections to build songs. Audiobus works only on iOS7. Forthcoming new version will be available to use Audiobus on iOS8 which is scheduled on end of October. #d279308 .resize-wrapper { position: relative; width: 100%; } #d279308 .resize-wrapper:before { content: ""; display: block; } #d279308 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d279308 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d279308 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d279308 .resize-wrapper-image:before{ padding-top: 100.0000%; } Voice Editor Essential Discontinued Voice Editor Essential is a simple Core MIDI iPad editor application to edit parameters in Yamaha synthesizers. #d279310 .resize-wrapper { position: relative; width: 100%; } #d279310 .resize-wrapper:before { content: ""; display: block; } #d279310 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d279310 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d279310 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d279310 .resize-wrapper-image:before{ padding-top: 100.0000%; } Performance Editor Essential Discontinued Performance Editor Essential is a Core MIDI application that enables you to edit the performances of a Yamaha synthesizer from your iPad. #d279309 .resize-wrapper { position: relative; width: 100%; } #d279309 .resize-wrapper:before { content: ""; display: block; } #d279309 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d279309 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d279309 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d279309 .resize-wrapper-image:before{ padding-top: 100.0000%; } Multi Editor Essential Discontinued Multi Editor Essential is a Core MIDI application which gives you all the tools you need to mix your songs and patterns of Yamaha synthesizer on your iPad. #d812788 .resize-wrapper { position: relative; width: 100%; } #d812788 .resize-wrapper:before { content: ""; display: block; } #d812788 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d812788 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d812788 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d812788 .resize-wrapper-image:before{ padding-top: 100.0000%; } Yamaha Synth Book Piano #d1090651 .resize-wrapper { position: relative; width: 100%; } #d1090651 .resize-wrapper:before { content: ""; display: block; } #d1090651 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d1090651 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d1090651 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d1090651 .resize-wrapper-image:before{ padding-top: 100.0000%; } Smart Pianist This robust app allows you to access many features of your Yamaha digital piano through your smart device. flowkey With flowkey, you learn to play beautiful piano music from the very beginning. Choose your favorite piano pieces from over 1500 songs and learn all about notes, chords, reading sheet music and the proper technique. #d798555 .resize-wrapper { position: relative; width: 100%; } #d798555 .resize-wrapper:before { content: ""; display: block; } #d798555 .resize-content { position: absolute; top: 0; left: 0; bottom: 0; right: 0; } #d798555 .resize-content > div { position: relative; width: 100%; height: 100%; text-align:center; } #d798555 .inner-image { position: absolute; top: 0; bottom: 0; right: 0; left: 0; margin: auto; } #d798555 .resize-wrapper-image:before{ padding-top: 100.0000%; } MD-BT01/UD-BT01 Utility This application is the dedicated tool for MD-BT01/