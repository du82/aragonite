full_description = "Inspired Tune in to your passion Inspiredとは スクロール ;(function setBgSet(){ var _bgSet =[ './images/main_031_01_sp.jpg [--xs] | ./images/main_031_01.jpg [--xsland] | ./images/main_031_01.jpg', './images/main_032_01_sp.jpg [--xs] | ./images/main_032_01.jpg [--xsland] | ./images/main_032_01.jpg', './images/main_033_01_sp.jpg [--xs] | ./images/main_033_01.jpg [--xsland] | ./images/main_033_01.jpg' ]; var n = Math.floor(Math.random() * 3); $('.str-main-01').attr('data-bgset',_bgSet[n]); })(); 民族楽器を未来へつなぐ。〈前編〉 Ram Prasad Kadel／ネパール民族楽器博物館設立者 民族楽器を未来へつなぐ。〈後編〉 Ram Prasad Kadel／ネパール民族楽器博物館設立者 絶景のステージから、笑顔のひとときを。〈前編〉 Kelvin Smith／ピアニスト 絶景のステージから、笑顔のひとときを。〈後編〉 Kelvin Smith／ピアニスト 音楽で、人も、地球も幸せに。〈前編〉 Heidi Lenffer／ミュージシャン 音楽で、人も、地球も幸せに。〈後編〉 Heidi Lenffer／ミュージシャン 音楽は生きていくための希望。〈前編〉 Ephraim Bugumba／シンガーソングライター 音楽は生きていくための希望。〈後編〉 Ephraim Bugumba／シンガーソングライター 音楽には、世の中を動かす力がある。〈前編〉 森 正志／フェス、ライブプランニング・プロデュース 音楽には、世の中を動かす力がある。〈後編〉 森 正志／フェス、ライブプランニング・プロデュース 誰もがライブで感動できる世界へ。〈前編〉 JoAnn Rose Benfield／ASL（アメリカ手話言語）音楽通訳者 誰もがライブで感動できる世界へ。〈後編〉 JoAnn Rose Benfield／ASL（アメリカ手話言語）音楽通訳者 「音楽とは何か」に音楽療法史から迫る。〈前編〉 光平 有希みつひら ゆうき／音楽療法史 研究者 希望のメッセージを、音楽に乗せて。〈後編〉 Esha Alwani／シンガーソングライター 希望のメッセージを、音楽に乗せて。〈前編〉 Esha Alwani／シンガーソングライター 希望のメッセージを、音楽に乗せて。〈後編〉 Esha Alwani／シンガーソングライター ごみから生まれた楽器で、環境への思いを。〈前編〉 Stijn Claeys／ミュージシャン、エンジニア ごみから生まれた楽器で、環境への思いを。〈後編〉 Stijn Claeys／ミュージシャン、エンジニア あらゆる音楽活動を、地球環境にやさしいものに。〈前編〉 Mauricio Lizarazo Prada／音楽プロデューサー、イベントオーガナイザー あらゆる音楽活動を、地球環境にやさしいものに。〈後編〉 Mauricio Lizarazo Prada／音楽プロデューサー、イベントオーガナイザー 音楽教育によって、スラムの子どもたちに生きる力を。〈前編〉 高坂 はる香／音楽ライター 音楽教育によって、スラムの子どもたちに生きる力を。〈後編〉 高坂 はる香／音楽ライター ロックの力で、より良き世界を。〈前編〉 かしわ 哲／シンガーソングライター ロックの力で、より良き世界を。〈後編〉 かしわ 哲／シンガーソングライター サルサガムテープで、世界をつなげたい。 栗山 有芽／打楽器奏者 音楽によってアフリカの女性に希望を。〈前編〉 Islam Elbeiti／ベーシスト、起業家サポーター 音楽によってアフリカの女性に希望を。〈後編〉 Islam Elbeiti／ベーシスト、起業家サポーター 環境問題への警鐘を、音楽の力で。〈前編〉 Stephan Crawford／アートプロジェクト・マネージャー 環境問題への警鐘を、音楽の力で。〈後編〉 Stephan Crawford／アートプロジェクト・マネージャー 障がいがあってもプロの演奏家を目指せる社会を。〈前編〉 Vahakn Matossian／デザイナー、発明家 障がいがあってもプロの演奏家を目指せる社会を。〈後編〉 Vahakn Matossian／デザイナー、発明家 物語に、音楽でスポットを当てる。〈前編〉 Jason Michael Paul／エンタテインメント・プロデューサー 物語に、音楽でスポットを当てる。〈後編〉 Jason Michael Paul／エンタテインメント・プロデューサー 音楽の持つ可能性を、もっと世の中に。〈前編〉 Kate Eberstadt／アーティスト・コミュニティ支援者 音楽の持つ可能性を、もっと世の中に。〈後編〉 Kate Eberstadt／アーティスト・コミュニティ支援者 音楽は、人を癒す力に。〈前編〉 Jenny Lam／ミュージックセラピスト 音楽は、人を癒す力に。〈後編〉 Jenny Lam／ミュージックセラピスト 音楽とテクノロジーを活用し、誰もが学べる社会に。〈前編〉 Dania Murad／研究者 音楽とテクノロジーを活用し、誰もが学べる社会に。〈後編〉 Dania Murad／研究者 エンタテインメントには世界をつなげる力がある。〈前編〉 近藤 祐希／社会起業家 エンタテインメントには世界をつなげる力がある。〈後編〉 近藤 祐希／社会起業家 人を笑顔にする。この歓びを音楽とともに。〈前編〉 田中 亘／音響エンジニア 人を笑顔にする。この歓びを音楽とともに。〈後編〉 田中 亘／音響エンジニア 音楽を楽しむ。これはすべての人間の資質です。〈前編〉 Kevin Zakresky／指揮者 音楽を楽しむ。これはすべての人間の資質です。〈後編〉 Kevin Zakresky／指揮者 更に読み込む 記事をリクエストしました 記事を読み込みました Inspiredとは Tune in to your passion 音・音楽の素晴らしさや大切さを、世界中のみなさんと分かち合いたい。 音・音楽とは多様なもので、感じ方はオーディエンス次第。影響力だって多様で、シンプルに語り尽くせるものではありません。だからこそ私たちは多くの人の体験談に耳を傾け、バラエティに富んだ物語と出会いたい。 音・音楽によって「Inspired」した人たちの物語は、次なる誰かの心を必ずやInspiredします。このポジティブな循環を生みだすことで、誰もが音・音楽とともにある豊かな人生を手にすることを、私たちは願っています。 ※Inspired＝駆り立てられた、ひらめきを得た、誘われた"
