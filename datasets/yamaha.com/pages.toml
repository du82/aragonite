title = "WE LOVE MUSIC, IN EVERY KEY. - Corporate Commercial - Yamaha Corporation"
full_description = '''Home About Us Learn and Expericne Corporate Commercial WE LOVE MUSIC, IN EVERY KEY. play pause WE LOVE MUSIC, IN EVERY KEY. Concept Movie Graphics Campaign Deliver the performance you imagined, and become one with the audience. Finally nail that lick after a slump, hear "Amazing!" from a strict judge or get tens of thousands of likes from your listeners. We love music. And we try to feel it everyday. To be honest, sometimes it takes more focus. If you play, you know better than anyone. Music can take us to the highest highs and lowest lows. But we love it, in every key of life. Branded Movie Music connects us all. It's something special, isn't it? WE LOVE MUSIC, IN EVERY KEY. | Full Version - Yamaha Music Graphics Music delivers all emotions - enjoy the journey. Campaign A Nocturne of Endearing Errors. "Knock Turn Op.9-2" will make you become even more fond of your own mistakes. Listen to it, and play it yourself. Learn More #LoveYourMistake Listen to "Knock Turn Op.9-2" performed by music lovers. Posts by fellow players Our branding campaign developed in Japan since 2023'''
