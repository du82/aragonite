full_description = "Home Contact Us Contact Us This is Yamaha Corporation site. For all inquiries related to Yamaha Motor (motorcycles, boats, unmanned helicopters, power products, etc.), please contact Yamaha Motor Co., Ltd. Technical Idea Submission Policy Yamaha engages in R&D within a broad range of technical fields and possesses a variety of ideas and technical information. Technical proposals submitted from external sources have potential to create disputes relating to trade secrets or Intellectual Property Rights. In order to avoid any possible disputes, Yamaha shall refrain from accepting any external technical proposal or idea, which may be confidential, contain trade secrets or do not hold applicable patent or other Intellectual Property Right(s). Therefore, should Yamaha receive any technical proposal or idea that does not possess the relevant Intellectual Property Right(s), Yamaha shall return any proposal without review or evaluation. General Inquiries To the Product Site, select your country or region from the list below. Americas Brasil Canada (English) Canada (Français) México Panamá United States Other Latin American / Caribbean Countries & Regions Europe België (Nederlands) France (Français) Schweiz (Deutsch) Luxemburg (Nederlands) Česká Republika Danmark Deutschland España Estonia Ireland Italia Latvia Liechtenstein Lithuania Magyarország Nederland Norge Österreich Polska Portugal România Россия Slovakia Slovenia Suomi Sverige Türkiye United Kingdom Other European Countries & Regions Asia, Oceania, Middle East & Africa Australia 中国大陆 India Indonesia Israel 日本 Malaysia New Zealand Philippines Singapore 대한민국 台灣 ประเทศไทย (English) ประเทศไทย (ภาษาไทย) Việt Nam African / CIS / Middle Eastern Countries & Regions Other Asian / Oceanian Countries & Regions Investor Relations Inquiry For investor relations inquiries, please access to the inquiry form page. Press Inquiry For press inquiries, please access to the inquiry form page."
