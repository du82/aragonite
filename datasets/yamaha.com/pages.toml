full_description = "ホーム 企業情報 知る・体験する 企業CM 音楽って、めんどくさい。だから、好き。WE LOVE MUSIC, IN EVERY KEY. 再生する 一時停止 音楽って、めんどくさい。だから、好き。 WE LOVE MUSIC, IN EVERY KEY. コンセプト ムービー グラフィック キャンペーン 思い描いた通りにできた演奏。 観客と一体となった情熱的なステージ。 スランプを乗り越えて弾けた小節。 厳しい審査員たちのブラボー。 リスナーからの数万の「いいね」。 音楽って、最高だ。 でも、そんな日ばかりじゃない。 むしろ、めんどくさいことの方が多いことを、 音楽をやっている私たちはよく知っている。 それを含めて、良い時も、上手くいかない時も、 どんな音楽でもまるごと愛してる。 ブランデッドムービー どんな時だって、音楽は、最高だよね。 音楽って、めんどくさい。だから、好き。-WE LOVE MUSIC, IN EVERY KEY. | Full Version - ヤマハ株式会社 グラフィック 良い時も上手くいかない時もある。 でも、そんな音楽をまるごと愛している。 キャンペーン 42人の演奏データの解析から着想し編曲した、ミスさえも愛おしくなるノクターン「Knock Turn Op.9-2」が誕生しました。 ぜひ、聴いてみてください。楽しみながら、弾いてみてください。 詳細はこちら #LoveYourMistake みなさんの「Knock Turn Op.9-2」の演奏をご紹介 みんなの投稿 2023年から展開している企業広告「音楽って、めんどくさい。だから、好き。」はこちら"
year_published = 2025
