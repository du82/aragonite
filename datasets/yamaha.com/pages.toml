["https://yamaha.com/ja/ir/faq"]
title = "よくあるご質問 - 投資家向け情報 - ヤマハ株式会社"
full_description = "ホーム 投資家向け情報 よくあるご質問 よくあるご質問 ヤマハのIRについて、みなさまからお寄せいただいた「よくあるご質問」を掲載いたします。ご不明な点についてお問い合わせいただく前に、こちらのページをぜひご確認ください。 企業情報 Q1 : ヤマハの事業内容を知りたいのですが？ A1 : ヤマハの事業は楽器・音響、音楽ソフト、AV機器・PA機器・ICT機器、半導体からリゾートまで広範にわたっています。個々の事業内容は下記ページでご覧下さい。 ヤマハの事業 Q2 : 会社の設立はいつですか？ A2 : 日本楽器製造株式会社として、1887年（明治20年）に創業しました。会社設立は1897年（明治30年）10月12日です。会社創業100年にあたる1987年（昭和62年）10月に社名を現在のヤマハ株式会社に変更しました。 Q3 : 東京証券取引所に上場したのはいつですか？ A3 : 上場は1949年（昭和24年）5月です。 Q4 : ADR（米国預託証券）の発行を開始したのはいつですか？ A4 : 2003年7月からです。 決算 Q1 : 最近の決算情報はどこでわかりますか？ A1 : 決算内容は、下記の「決算短信/有価証券報告書」ページでご覧いただけます。また下記の「説明会資料」ページでは、決算説明会の模様を音声付きスライド、オンデマンド配信でもご覧いただけます。 決算短信/有価証券報告書 説明会資料 Q2 : 過去の業績を知りたいのですが？ A2 : 下記のページでご覧いただけます。 財務データ集 ファイナンシャルデータ Q3 : 次回の決算発表はいつですか？ A3 : 下記のページでご確認いただけます。 IRカレンダー（今後の予定） Q4 : 統合報告書を見たいのですが？ A4 : 下記の「統合報告書」ページからご覧いただけます。 統合報告書 株式 Q1 : 証券コード及びADRのティッカーシンボルは何ですか？ A1 : 証券コードは7951です。ティッカーシンボルはYAMCYです。 Q2 : 株式事務の窓口はどこでしょうか？ A2 : 株式事務のお問い合せ先株式事務の内容により、証券会社または三井住友信託銀行株式会社にお問い合わせください。 株式事務の内容 諸手続（1）住所変更（2）配当金受取方法の変更（3）単元未満株式の買取請求 未払い配当金の支払い 口座を開設されている場合 口座を開設された証券会社 三井住友信託銀行株式会社 株式が特別口座にある場合 三井住友信託銀行株式会社 三井住友信託銀行株式会社 三井住友信託銀行株式会社のお問い合せ先0120-782-031（平日9:00-17:00） 詳しくは三井住友信託銀行株式会社「株式に関するお手続き」ページをご覧下さい。 三井住友信託銀行株式会社「株式に関するお手続き」 Q3 : 現在の株価はどうなっていますか？ A3 : 下記の「株価情報」からご覧いただけます。 株価情報 Q4 : 配当支払の確定日はいつですか？ A4 : 毎年3月31日と9月30日です。 Q5 : 売買単位株式数は何株ですか？ A5 : 100株です。 Q6 : 単元未満株式の買増はできるのですか？ A6 : 単元未満株式の買増は現在行っておりません。単元未満株式の買増制度につきましては、制度導入に必要な条件が十分整っていないため、 現在は導入しておりません。今後、株主様のご要望等を踏まえ、また、さまざまな条件を勘案のうえ、同制度の導入について検討してまいりたいと思います。 Q7 : 引越しをしたのですが、どのような手続きが必要ですか？ A7 : お取引先の証券会社へお問合せください。発行株数や総株主構成等の詳しい株式情報につきましては下記の「株式の状況」ページをご覧下さい。 株式の状況"
