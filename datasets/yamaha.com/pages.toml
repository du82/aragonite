full_description = "ホーム 投資家向け情報 個人投資家のみなさまへ 個人投資家のみなさまへ ヤマハの株主になるメリット 価値創造への取り組み ヤマハをデータで知る ヤマハを動画で知る もっとヤマハを知りたい方は ヤマハの株主になるメリット ヤマハでは、連結自己資本利益率の向上を念頭において、中長期的な連結利益水準をベースに、研究開発・販売投資・設備投資などの成長投資を行うとともに、株主への積極的な還元を行います。 株主還元 株式の状況 ヤマハの魅力を知る ヤマハってどんな会社？ ヤマハは音・音楽を通して「感動を・ともに・創る」ことを目指す企業です。アコースティックからデジタルまで多種多様な楽器をはじめ、業務用音響機器やホームオーディオなど様々なサービスや製品を提供しています。世界最大の総合楽器メーカーとして築いてきた強みをさらに磨き、ブランド力を一段と高め、高収益な企業を目指しています。 ヤマハってどんな会社？ ヤマハの事業 ヤマハの4つの強み 個人投資家向け説明会 価値創造への取り組み SPECIAL FEATURE 01 リモートによる新たなビジネスチャンスと社会課題解決への取り組み SPECIAL FEATURE 02 インドにおける成長戦略とヤマハの価値創造の取り組み SPECIAL FEATURE 03 「音」と「ネットワーク」技術で新しい形の『遠隔コミュニケーション』を提案 価値創造への取り組みを見る ヤマハをデータで知る 業績や財務データ、株式関連の情報をご紹介します。 ヤマハの業績 主要な経営指標を中心にご紹介します。 財務データ これまでの業績推移をご紹介します。 株式の状況 株式の状況をご紹介します。 株価情報 最新の株価情報をご紹介します。 ヤマハを動画で知る ヤマハへの理解を深めていただける動画コンテンツをご紹介します。 最新の個人投資家向け説明会動画 個人投資家の皆さまに向けた会社説明会の模様をご覧になれます。 ※映像は外部のホームページにリンクしています 過去の説明会動画を見る その他の動画 ヤマハの経営や事業活動を動画でご覧いただけます。 もっとヤマハを知りたい方は 株主総会 株主総会に関連する資料をご覧になれます。 施設見学・ブランド体験 ヤマハの世界観を体験できるブランド発信拠点やコンテンツをご紹介します。 よくある質問 皆さまから頂くよくあるご質問をまとめています。 IRカレンダー 今後のIRイベントスケジュールをご紹介しています。 株式事務のお問い合わせ先"
