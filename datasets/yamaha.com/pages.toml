full_description = "ホーム 投資家向け情報 投資家向け情報 2024年10月1日を発効日とする株式分割（1:3）を行いました。 もっと見る もっと見る もっと見る Stop Start IRメール配信サービス IR最新情報 IRカレンダー 2025年2月26日 リリース 役員人事に関するお知らせ 2025年2月19日 お知らせ 個人投資家向けオンライン説明会を実施しました 2025年2月18日 リリース 自己株式立会外買付取引（ToSTNeT-3）による自己株式の取得結果に関するお知らせ 2025年2月17日 リリース 自己株式立会外買付取引（ToSTNeT-3）による自己株式の買付けに関するお知らせ 2025年2月13日 決算 2025年3月期第3四半期 決算説明会質疑応答を掲載しました IR最新情報一覧 2025年2月5日 2025年3月期第3四半期 決算説明会 2025年2月5日 2025年3月期第3四半期 決算発表 2024年11月1日 2025年3月期第2四半期 決算説明会 2024年11月1日 2025年3月期第2四半期 決算発表 2024年7月31日 2025年3月期第1四半期 決算説明会 IRカレンダー一覧 経営方針 社長メッセージ 価値創造ストーリー 中期経営計画 ヤマハのDX戦略 コーポレートガバナンス 役員一覧 リスクマネジメント ディスクロージャーポリシー IR資料・財務情報 説明会資料 決算短信/有価証券報告書 統合報告書 財務データ ファクトシート 個人投資家のみなさまへ ヤマハってどんな会社？ ヤマハの事業 ヤマハの4つの強み 価値創造への取り組み ヤマハの業績 株主還元 個人投資家向け説明会 株主優待 動画ライブラリー 株式関連情報 株価情報 株式の状況 定款・株式取扱規則 株主総会 報告書/中間報告書 中期経営計画 経営目標 (2022年-2025年) 14% 事業利益率 50% 総還元性向 75% 持続可能性に配慮した木材使用率 19% 管理職女性比率 詳しく見る 会社紹介動画 将来の見通しに関する記述等についてのご注意 このホームページの中で、将来の見通しに関する数値につきましては、ヤマハ及びヤマハグループ各社の現時点での入手可能な情報に基づいており、この中にはリスクや不確定な要因も含まれております。従いまして、実際の業績は、事業を取り巻く経済環境、需要動向、米ドル、ユーロを中心とする為替動向等により、これらの業績見通しと大きく異なる可能性があります。 その他IR情報 IRカレンダー よくあるご質問 IR最新情報一覧 お問い合わせ IRメール配信サービス"
