["https://yamaha.com/ja/about"]
title = "企業情報 - ヤマハ株式会社"
description = "ヤマハ株式会社"
full_description = "ホーム 企業情報 企業情報 ヤマハについて 会社概要 本社所在地や従業員数など、会社の概要を紹介します。 役員一覧 取締役、執行役、執行役員、監査役員を紹介します。 事業所・グループ会社 ヤマハグループの事業所およびグループ会社を紹介します。 会社案内PDF：7.66MB グループの企業理念・事業活動・沿革などを紹介しています。 数字で見るヤマハ 売上収益 4,629億円 事業利益337億円 （2024年3月期） グローバル楽器市場シェア No.1 楽器全体：25%／ピアノ：35%／デジタルピアノ：44%／ポータブルキーボード：49%／管楽器：32%／ギター：11% （2024年3月期 金額ベース、ヤマハ調べ） 事業別売上収益構成 地域別売上収益構成 （2024年3月期） ヤマハ音楽教室の卒業生 550万人以上 新興国における公教育での音楽教育施策の展開数（スクールプロジェクト） 累計302万人 7ヵ国 約7,200校 （2024年3月期） 管理職女性比率（ヤマハグループ全体） 19.4％ （2024年3月期） タンザニアでのアフリカン・ブラックウッド植林楽器素材となる希少樹種の育成・保全 累計 約18,000本 9.5ヘクタール （2017年3月期から2024年3月期まで） 温室効果ガス排出量削減（スコープ1+2） グローバルに広がるヤマハのネットワーク およそ60年にわたる積極的なグローバル展開によって、ヤマハの製品やサービスは世界中の人々に親しまれています。そして現在では30以上の国と地域に拠点を持ち、お客様のニーズに応えた製品の販売をはじめ音楽の普及活動を行っています。 事業紹介 音・音楽に関連する事業を中核に、“楽器”、“音響機器”、“部品・装置など”、3つの領域で幅広く展開するヤマハ株式会社グループの事業をご紹介します。 楽器事業 鍵盤楽器や管弦打楽器の製造・販売を中心に、音楽教室等の運営や音楽・映像ソフトの制作・販売といった多彩な事業を展開しています。 音響機器事業 個人向けのオーディオ機器や音楽制作・配信機器、法人向けの業務用音響機器や会議用設備機器、ネットワーク機器まで幅広い製品を提供しています。 部品・装置事業 他 楽器製造・販売を通して獲得した技術やノウハウを生かし、電子部品や自動車用内装部品などの部品事業、産業用設備機器などの装置事業、ゴルフ用品事業やリゾート事業を展開しています。 事業紹介を見る ヤマハの歴史 135年の歴史を持つヤマハ ヤマハの歴史は1887年、創業者である山葉寅楠がリードオルガンの修理をきっかけとして、オルガン製作に成功したことに始まります。以来135年以上にわたり、つねに新たな挑戦を重ね、長い歴史の中で培った技術や感性を生かしながら、世界中の人々のこころ豊かなくらしに貢献することを目指し歩み続けてきました。そんなヤマハの誕生や歴史、エポックメイキングとなる製品などをご紹介します。 ヤマハの歴史を見る 知る・体験する 施設見学／ブランドショップ／ブランド展示／企業CM・カレンダー・壁紙​​​ ピアノをはじめとする様々な製品やそれらを支える技術やこだわり、ヤマハの歴史、音・音楽の魅力をもっと知ってもらい、より身近に感じていただける施設やコンテンツを紹介しています。 施設・コンテンツを見る 関連コンテンツ 企業ミュージアム 価値創造ストーリー 企業CM"
