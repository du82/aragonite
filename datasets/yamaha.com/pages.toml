["https://yamaha.com/en/about/history"]
title = "History - About Us - Yamaha Corporation"
full_description = '''Home About Us History History Yamaha's history began when its founder, Torakusu Yamaha, repaired a broken reed organ in 1887. Shortly thereafter, he successfully completed the first reed organ. Corporate Profile Video The Origin and History of the Yamaha Brand History of Logo The Origin and History of the Yamaha Brand 1887 Founding Period 1887 Birth of the Yamaha Brand Torakusu Yamaha repaired an organ at an elementary school in Hamamatsu, and he succeeded in producing an organ in the same year. The Yamaha brand trademark "Yamaha" is derived from the name of the company's founder, Torakusu Yamaha, who was a pioneer in the manufacture of Western-style musical instruments. Discover More about the Story of Yamaha's Founding 1897 Establishes Nippon Gakki Co., Ltd. (currently Yamaha Corporation) 1898 Birth of the Logo The year after the establishment of Nippon Gakki Co., Ltd., the "tuning fork" was established as the corporate mark and the "Chinese phoenix holding a tuning fork in its mouth" as the trademark. After undergoing a variety of changes paralleling the growth of the Company, the tuning fork mark and the Yamaha Logo was finally standardized. 1900 Begins production of upright pianos 1949 Lists on Tokyo Stock Exchange Around 1950 Spreading Music Culture and Taking on New Business Challenges, and Going Overseas as a Comprehensive Musical Instrument Manufacturer 1954 Opens a school that was the predecessor of Yamaha Music School Produces its first audio product (HiFi player) 1955 Launches motorcycle YA-1 Establishes Yamaha Motor Co., Ltd. (splits off motorcycle division) 1958 Establishes sales subsidiary Yamaha de Mexico, S.A. de C.V. in Mexico 1959 Begins production of sports equipment (FRP Archery) Begins production of electronic organs (Electone™) 1960 Establishes subsidiary in United States, Yamaha International Corporation (currently Yamaha Corporation of America) 1962 Begins recreation business 1964 Begins production of lifestyle-related products (FRP bathtub) Transfer of shares in living business subsidiary in 2010 1966 Begins production of wind instruments Establishes Yamaha Music Foundation (becomes general incorporated foundation in 2011) Expands into Europe with founding of Yamaha Europa GmbH in former West Germany 1968 Issues shares at market price (the first such issuance in Japan) Around 1970 Evolution of Technology and Creation of New Value 1969 Launches Vocal Amplifier System (PA equipment) 1972 Begins production of semiconductors *Transitions to fabless manufacturing in 2015 1980 Establishes Yamaha Piano Technical Academy, a piano tuner training school 1982 Launches golf clubs 1987 Changes corporate name from Nippon Gakki Co., Ltd. to Yamaha Corporation to mark 100th year in business Opens Yamaha English-language school 1989 Establishes subsidiary in China, Tianjin Yamaha Electronic Musical Instruments, Inc., for manufacture and sale of digital musical instruments 1995 Launches remote router Around 2000 Providing Value Unique to the Yamaha Group through Businesses Centered on Sound and Music 2002 Establishes Yamaha Music & Electronics (China) Co., Ltd. Establishes Yamaha Music Holding Europe GmbH in Germany (currently Yamaha Music Europe GmbH) 2005 Acquires German audio software house Steinberg Media Technologies GmbH 2007 Establishes music entertainment business holding company 2008 Acquires Austrian piano manufacturer L. Bösendorfer Klavierfabrik GmbH Acquires French loudspeaker manufacturer NEXO S.A. 2010 Completes integration of Japanese piano factories into Kakegawa plant 2014 Acquires U.S. musical instrument and audio equipment manufacturer Line 6, Inc. (currently Yamaha Guitar Group, Inc.*) *Acquires the Ampeg brand in 2018 and Córdoba Music Group, LLC in 2023 Acquires U.S. provider of wireless audio solutions Revolabs, Inc. (currently Yamaha Unified Communications, Inc.) 2018 Opens R&D facility “Innovation Center” 2021 Reopens the flagship “Yamaha Ginza Shop” as an experience-oriented brand shop With our unique expertise and sensibilities, gained from our devotion to sound and music, we are committed to creating excitement and cultural inspiration together with people around the world. History of Logo It was in 1898 that the tuning fork, a tool used for tuning and other purposes, was established as the corporate mark. Since then, various "tuning fork marks" have been used, and the Yamaha logo, which is a combination of the tuning fork mark and the Yamaha logotype, has been used as the symbol of Yamaha. The following is an introduction to the transition of the tuning fork mark and the Yamaha logo. Discover More about History of Logo Related Contents Corporate Museum Value Creation Story Corporate Commercial About Us Corporate Profile Directors and Officers Locations Businesses History Learn and Experience Corporate Profile(PDF)'''
