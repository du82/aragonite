["https://yamaha.com/en/about"]
title = "About Us - Yamaha Corporation"
description = "Yamaha Corporation"
full_description = "Home About Us About Us About Yamaha Corporate Profile Corporate profile, including location of headquarters and number of employees. Officers Our Directors, Executive Officers, Corporate Officers, and Audit Officers. Locations Locations and group companies. Corporate ProfilePDF：5.20MB This file introduces such topics as the Yamaha Group corporate philosophy, descriptions of our businesses, and our corporate history. Yamaha in Figures Revenue ¥462.9 Billion Core Operating Profit ¥33.7 Billion (FY2024/3 (fiscal year ended March 2024)) Global Market Share for Major Product Groups No.1 All Musical Instruments: 25% / Pianos: 35% / Digital Pianos: 44% / Portable Keyboards: 49% / Wind Instruments: 32% / Guitars: 11% (FY2024/3, monetary value basis, based on surveys by Yamaha) Revenue Composition by Business Segments Revenue Composition by Region (FY2024/3) Graduates of Yamaha Music School Over 5.5 Million Students Promoting Public Music Education in Emerging Countries(School Project) Total 3.02 Million Students 7Countries Approx. 7,200 Schools (As of March 31, 2024) Percentage of Female Managers(Overall Yamaha Group) 19.4 % (As of March 31, 2024) African Blackwood Planting in TanzaniaCultivate and Preserve Scarce Tree Species for the Local Environment and Future Musical Instrument Production Total Approx.18,000 Trees 9.5ha (From FY2017/3 to FY2024/3) Greenhouse Gas Emission Reduction(Scope 1 + 2) Yamaha's Global Network Yamaha products and services are known throughout the world from over 60 years of active global expansion activities. Currently, Yamaha has a global operation principle with direct operating locations in over 30 countries and regions, engaging in sales and music popularization activities aimed to meet the needs of our customers in each region. Our Businesses Here, we introduce the Yamaha Group’s businesses, which are centered on sound and music. We continue to evolve a wide range of initiatives in three key domains centred around musical instruments, audio equipment, industrial machinery/components and others. Musical Instruments Business Yamaha’s core business begins with the manufacturing and marketing of musical instruments, and extends to the management of music schools. Audio Equipment Business Our audio equipment business spans professional audio equipment, music production equipment and software as well as audiovisual equipment, network devices and unified communication devices. Others (Industrial Machinery and Components Business, etc.) Our industrial machinery and components businesses comprise electronic devices including automotive sound systems and in-vehicle communication modules, factory automation, and wood interior components for automobiles. We also manufacture golf products and operates a resort business. Discover More about Our Business Yamaha's History 135 Years of History Our history began in 1887 when Yamaha founder Torakusu Yamaha completed a repair project on a reed organ and successfully built his own. Since then, for more than 135 years, we have continually taken on new challenges, leveraging the technologies and sensibilities cultivated over our long history to contribute to the well-being of people around the world. Here, we introduce the founding, history, and epoch-making products of Yamaha. Discover More about Yamaha's History Learn and Experience Facility Tours, Brand Shops, Corporate Commercial, Calendar, Wallpaper Here, we introduce facilities and content to help you learn more and feel further acquainted with various products. Yamaha's history, and the appeal of sound and music is preseneted with focus on specific product categories and the technology and commitment supporting their continued development., Discover More about Learn and Experience Related Contents Corporate Museum Value Creation Story Corporate Commercial"
