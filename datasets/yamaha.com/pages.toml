["https://yamaha.com/en/ir/investor-digest/value"]
title = "Enactment of Yamaha’s Value Creation Story - Investor Relations - Yamaha Corporation"
full_description = "Home Investor Relations Learn about Yamaha Enactment of Yamaha’s Value Creation Story Enactment of Yamaha’s Value Creation Story Contributing to People's Lives by Creating New Value through Sound and Music Throughout its history spanning more than 130 years, the Yamaha Group has continued to accumulate technological capabilities and insight related to research and development, production, sales, and marketing. At the same time, we have proceeded to hone our sensibilities in business fields centered on sound and music. The Group works to improve its corporate value by fully leveraging these strengths while helping create greater levels of value for society by addressing contemporary social issues and needs. In this special feature, we will introduce examples of initiatives by Yamaha in which the Company utilizes the strengths of its distinctive technologies, sensibilities, and value chain to help resolve social issues and contribute to the enrichment of people’s lives by creating new value through sound and music. SPECIAL FEATURE 01New Business Opportunities andContributions to Resolution of SocialIssues through Remote Solutions SPECIAL FEATURE 02Growth Strategies and ValueCreation Initiatives in India SPECIAL FEATURE 03New Form of Remote Communication Proposed through Sound and Network Technologies SPECIAL FEATURE 04The Next Stage for Yamaha's Guitar Business SPECIAL FEATURE 05Resolve Social Issues through Products and Services SPECIAL FEATURE 06Exploration as a Sound Expert of the Automotive Sound System Market, a New Growth Field"
