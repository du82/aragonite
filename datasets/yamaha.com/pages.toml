["https://yamaha.com/ja/about/history"]
title = "ヤマハブランドの歴史 - 企業情報 - ヤマハ株式会社"
full_description = "ホーム 企業情報 ヤマハブランドの歴史 ヤマハブランドの歴史 ヤマハグループの歴史は、1887年、創業者・山葉寅楠が静岡県の浜松で1台の壊れたオルガンを修理したことをきっかけに、国産オルガンの製作に成功したことから始まります。 その後、寅楠は1897(明治30)年10月12日に「日本楽器製造株式会社」を設立して初代社長に就任し、ピアノの製造を皮切りに、楽器事業の礎を築きました。 創業からちょうど100年目の年である1987(昭和62)年、「日本楽器製造株式会社」から現在の社名である「ヤマハ株式会社」に名称を変更。創業者の情熱を受け継ぎ、ヤマハグループは、世界中の人々に新たな感動と豊かな文化を提案し続けています。 会社案内動画 ヤマハブランドの誕生と歴史 ロゴの歴史 ヤマハブランドの誕生と歴史 1887年 創業期 1887 ヤマハブランドの誕生 山葉寅楠が浜松の小学校でオルガンを修理、同年にオルガン製作に成功。 ヤマハブランドの商標「YAMAHA」は、洋楽器製造の先駆者である創業者・山葉寅楠の姓に由来します。 創業ストーリーを見る 1897 日本楽器製造株式会社を設立 1898 ロゴの誕生 日本楽器製造株式会社設立の翌年、社章として「音叉」が、商標として「音叉をくわえた鳳凰図」が定められました。以来、ヤマハの成長とともに、さまざまな「音叉マーク」を経て、音叉マークとヤマハロゴタイプを組み合わせた「ヤマハロゴ」をヤマハブランドを象徴するシンボルとして使用しています。 1900 ピアノの製造を開始 1949 東京証券取引所に株式を上場 1950年頃 音楽文化の普及と新事業への挑戦、総合楽器メーカーとして海外へ 1954 「ヤマハ音楽教室」の前身となる教室を開講 オーディオの製造を開始（HiFiプレーヤー） 1955 オートバイ YA-1発売 オートバイ部門をヤマハ発動機株式会社として分離 1958 メキシコに販売子会社ヤマハ・デ・メヒコを設立 1959 スポーツ用品の製造を開始（FRP製アーチェリー） 電子オルガン（エレクトーン®）の製造を開始 1960 米国に販売子会社 ヤマハ・インターナショナル・コーポレーション（現ヤマハ・コーポレーション・オブ・アメリカ）を設立 1962 リゾート事業を開始 1964 リビング用品の製造を開始（FRP製バスタブ） 2010年リビング事業子会社の株式を譲渡 1966 管楽器の製造を開始 財団法人ヤマハ音楽振興会を発足（2011年、一般財団法人に移行） 西ドイツ（当時）に販売子会社 ヤマハ・ヨーロッパを設立 1968 日本初の株式時価発行を実施 1970年頃 テクノロジーの進化と新たな価値創造 1969 ボーカルアンプシステム（PA機器）発売 1972 半導体の生産を開始 ※2015年ファブレス化 1980 ヤマハピアノテクニカルアカデミーを設立 1982 ゴルフクラブ発売 1987 創業100周年を機に、社名を日本楽器製造株式会社からヤマハ株式会社に変更 ヤマハ英語教室を開始 1989 中国に電子楽器製造・販売子会社 天津ヤマハ電子楽器を設立 1995 リモートルータ発売 2000年頃 音・音楽を中核とした事業で、ヤマハグループならではの価値を提供 2002 中国に投資管理会社 ヤマハ楽器音響（中国）を設立 ヤマハ・ミュージック・ホールディング・ヨーロッパ設立（欧州統括会社YMHE：Yamaha Music Holding Europe GmBh） 2005 ドイツの音楽制作用ソフトウェア開発・販売会社 Steinbergを買収 2007 音楽ソフト事業統括会社 株式会社ヤマハミュージックエンタテインメントホールディングスを設立 2008 オーストリアのピアノメーカー Bösendorferを買収 フランスの業務用スピーカー製造・販売会社 NEXOを買収 2010 ピアノ国内生産拠点を掛川工場へ統合 2014 米国の楽器・音響機器メーカー Line 6（現ヤマハ・ギター・グループ*）を買収 ＊2018年 Ampegブランド、2023年Córdobaを買収 米国の通信・音響機器メーカー Revolabs（現ヤマハ・ユニファイド・コミュニケーションズ）を買収 2018 研究開発拠点「イノベーションセンター」を開設 2021 ヤマハ銀座店を「ブランドショップ」としてリニューアルオープン 私たちは、音・音楽を原点に培った技術と感性で、新たな感動と豊かな文化を世界の人々とともに創りつづけます ロゴの歴史 調律などに使用する道具である「音叉」が社章として定められたのは、1898年のことでした。それ以来、さまざまな「音叉マーク」を経て、音叉マークとヤマハロゴタイプを組み合わせた「ヤマハロゴ」をヤマハのシンボルとして使用しています。音叉マークとヤマハロゴの変遷をご紹介します。 ロゴの歴史を見る 関連コンテンツ 企業ミュージアム 価値創造ストーリー 企業CM 企業情報 会社概要 役員一覧 事業所・グループ会社 事業紹介 ヤマハブランドの歴史 知る・体験する 会社案内"
year_published = 2025
