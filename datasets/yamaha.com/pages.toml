full_description = "ホーム ウェブアクセシビリティ方針 ウェブアクセシビリティ方針 ヤマハ株式会社のウェブサイトでは、「JIS X 8341-3:2016 高齢者・障害者等配慮設計指針 — 情報通信における機器、ソフトウェア及びサービス — 第3部 : ウェブコンテンツ」に対応することを目標とし、アクセシビリティの確保と向上に取り組んでいます。 対象範囲 ヤマハ株式会社コーポレートサイト全体 https://www.yamaha.com/ja/ 以下すべてのページ https://www.yamaha.com/en/ 以下すべてのページ https://www.yamaha.com/2/locationselector/ 目標とする適合レベルおよび対応度 JIS X 8341-3:2016 の適合レベルAAに一部準拠 注記：弊社のウェブアクセシビリティ方針における「準拠」という表記は、情報通信アクセス協議会ウェブアクセシビリティ基盤委員会「ウェブコンテンツのJIS X 8341-3:2016 対応度表記ガイドライン – 2021年4月版」で定められた表記による。 例外事項 「1.2.5 音声解説（収録済み）の達成基準」については、現時点で対応できないため、例外とします。 現時点で把握している問題点およびその対応に関する考えかた 動画コンテンツにおいて、キャプションを提供できていないものがあります。2024年以降改善を目指します。 一部のお問い合わせフォームを別ドメイン（inquiry.yamaha.com）で展開しており、アクセシビリティが十分でない箇所があります。本方針の対象範囲外ではありますが、一連のユーザーエクスペリエンスとして重要なため、2024年以降改善を目指します。 ホームページの閲覧・ソーシャルメディアについてのお問い合わせ 投資家向け情報に関するお問い合わせ サステナビリティに関するお問い合わせ 採用情報に関するお問い合わせ 個人情報保護方針についてのお問い合わせ 担当部署名 ヤマハ株式会社 ブランド戦略本部（お問い合わせ） 試験結果 JIS X 8341-3:2016 附属書JB に基づく試験結果表示"
