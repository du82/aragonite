["https://yamaha.com/ja/about/business"]
title = "事業紹介 - 企業情報 - ヤマハ株式会社"
description = "企業情報 - ヤマハ株式会社"
full_description = "ホーム 企業情報 事業紹介 事業紹介 ヤマハの事業 音・音楽を中心にした事業を通じて磨いてきた感性と多彩な技術を融合し、 “楽器”、“音響機器”、“その他（部品・装置など）”の3つの領域でグローバルに事業を展開しています。 ​ 楽器事業 音響機器事業 部品・装置事業ほか 楽器事業 グローバル楽器市場でNo.1のシェアを持つヤマハの中核事業​ 伝統的なピアノ、管弦打楽器などのアコースティック楽器からエレクトロニクス技術を活用した電子楽器に加え、双方の技術を融合したハイブリッド商品の開発にも注力しています。レッスン、リペア等のサービスや音楽ソフトの制作・販売といった多彩な事業も展開。豊富な商品ラインアップやグローバルな販売・サービス体制により、世界でNo.1の総合楽器メーカーの地位を獲得しています。 主要製品 ピアノ 電子楽器 管弦打楽器 ギター 音楽教室 製品・サービスを見る 音響機器事業 業務用からコンシューマー向けまで、多彩なソリューション、音楽の楽しみを提供​​ 「音・音楽」をコアとして培ったデジタルとアコースティックの技術を生かし、業務用からコンシューマー向けまでさまざまなソリューションを提供しています。ホームオーディオ機器、音楽制作・配信機器、業務用音響機器、 ネットワーク機器など幅広い製品で構成されています。 主要製品 ホームオーディオ コンテンツ制作・配信 業務用音響機器 ネットワーク機器 音声コミュニケーション機器 製品・サービスを見る 部品・装置事業ほか 楽器・音響製品の開発で獲得した技術を幅広い市場に応用​​​ 電子部品事業では、車載オーディオをコアとした“クルマの音”の総合ソリューションを推進しています。その他、木材加工や塗装技術などの融合から生まれた高級車向け内装部品事業、楽器製造で培った生産技術を応用展開したFA機器（産業用設備機器）などの装置事業を展開。ゴルフ用品事業やリゾート事業においても、長年蓄積してきた技術・ノウハウや感性を生かして製品・サービスを提供しています。 主要製品 自動車用内装部品 FA機器 車載オーディオ ゴルフ用品 製品・サービスを見る YAMAHA MUSIC CONNECT 人と音楽は、もっと近くなる。 BE ONE WITH MUSIC. Yamaha Music Connectを見る 関連コンテンツ 会社案内(PDF) 統合報告書 企業情報 会社概要 役員一覧 事業所・グループ会社 事業紹介 ヤマハブランドの歴史 知る・体験する 会社案内"
