title = "バーチャル見学 - INNOVATION ROAD - ヤマハ株式会社"
full_description = "ホーム 企業情報 知る・体験する イノベーションロード バーチャル見学 イノベーションロード お知らせ 展示・体験エリアメニューを開く 展⽰エリアMAP ピアニスト気分で体験 「グランドピアノ弾き比べコース」 ヤマハの歴史を学ぼう 「ヒストリーウォーク見学コース」 とっておきの写真が撮れる！ 「フォトジェニックコース」 バーチャル見学 ご予約／アクセス 展示コレクションメニューを開く ピアノ・電子ピアノ 鍵盤楽器・音楽制作 ギター・ベース ドラム 弦打楽器 管楽器・教育楽器 ホームシアター機器・オーディオ機器 業務用音響機器 ネットワーク機器・音声コミュニケーション機器 ゴルフ・電子デバイス・その他 よくあるご質問 バーチャル見学 360度3Dカメラで撮影した映像を通じ、実際にイノベーションロードを訪問しているような感覚をお楽しみいただけます。 バーチャルイノベーションロードとは バーチャル イノベーションロードは当社の企業ミュージアムであるイノベーションロードをパソコン・スマートフォンからオンラインで見学・体験できるようにしたコンテンツです。360度3Dカメラで撮影した映像を通じ、実際にイノベーションロードを訪問しているような感覚で見学いただけます。バーチャルイノベーションロード内のマーカー「◎」をクリックし展示品紹介等をご覧ください。 ◎展示エリア ◎音声ガイド ◎体験コンテンツ ◎その他 おすすめ見学ルート 短時間でご見学されたい方へおすすめの見学ルートをご紹介します 操作ガイド パソコンでの操作方法 短時間でご見学されたい方へおすすめの見学ルートをご紹介します スペースを見回すには、クリックしてドラッグします。 スクロールホイールを使用してズームイン、ズームアウトします。 スマホでの操作方法 移動するには、スペース全体の床にあるリングをタップします。青、緑のリングをクリックすると商品紹介等がご覧頂けます。 スペースを見回すには、画面をフリックします。 画像をズームイン、ズームアウトは、画面を「ピンチイン」「ピンチアウト」します。"
