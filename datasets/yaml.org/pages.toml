["https://yaml.org/spec/1.2.2"]
title = "YAML Ain’t Markup Language (YAML™) revision 1.2.2"
full_description = '''YAML Ain’t Markup Language (YAML™) version 1.2 Revision 1.2.2 (2021-10-01) Copyright presently by YAML Language Development Team1 Copyright 2001-2009 by Oren Ben-Kiki, Clark Evans, Ingy döt Net This document may be freely copied, provided it is not modified. Status of this Document This is the YAML specification v1.2.2. It defines the YAML 1.2 data language. There are no normative changes from the YAML specification v1.2. The primary objectives of this revision are to correct errors and add clarity. This revision also strives to make the YAML language development process more open, more transparent and easier for people to contribute to. The input format is now Markdown instead of DocBook, and the images are made from plain text LaTeX files rather than proprietary drawing software. All the source content for the specification is publicly hosted2. The previous YAML specification3 was published 12 years ago. In that time span, YAML’s popularity has grown significantly. Efforts are ongoing to improve the language and grow it to meet the needs and expectations of its users. While this revision of the specification makes no actual changes to YAML, it begins a process by which the language intends to evolve and stay modern. The YAML specification is often seen as overly complicated for something which appears to be so simple. Even though YAML often is used for software configuration, it has always been and will continue to be a complete data serialization language. Future YAML plans are focused on making the language and ecosystem more powerful and reliable while simultaneously simplifying the development process for implementers. While this revision of the specification is limiting itself to informational changes only, there is companion documentation intended to guide YAML framework implementers and YAML language users. This documentation can continue to evolve and expand continually between published revisions of this specification. See: YAML Resources Index YAML Vocabulary Glossary YAML Specification Changes YAML Specification Errata Abstract YAML™ (rhymes with “camel”) is a human-friendly, cross language, Unicode based data serialization language designed around the common native data types of dynamic programming languages. It is broadly useful for programming needs ranging from configuration files to internet messaging to object persistence to data auditing and visualization. Together with the Unicode standard for characters4, this specification provides all the information necessary to understand YAML version 1.2 and to create programs that process YAML information. Contents YAML Ain’t Markup Language (YAML™) version 1.2 Revision 1.2.2 (2021-10-01) Chapter 1. Introduction to YAML 1.1. Goals 1.2. YAML History 1.3. Terminology Chapter 2. Language Overview 2.1. Collections 2.2. Structures 2.3. Scalars 2.4. Tags 2.5. Full Length Example Chapter 3. Processes and Models 3.1. Processes 3.1.1. Dump 3.1.2. Load 3.2. Information Models 3.2.1. Representation Graph 3.2.1.1. Nodes 3.2.1.2. Tags 3.2.1.3. Node Comparison 3.2.2. Serialization Tree 3.2.2.1. Mapping Key Order 3.2.2.2. Anchors and Aliases 3.2.3. Presentation Stream 3.2.3.1. Node Styles 3.2.3.2. Scalar Formats 3.2.3.3. Comments 3.2.3.4. Directives 3.3. Loading Failure Points 3.3.1. Well-Formed Streams and Identified Aliases 3.3.2. Resolved Tags 3.3.3. Recognized and Valid Tags 3.3.4. Available Tags Chapter 4. Syntax Conventions 4.1. Production Syntax 4.2. Production Parameters 4.3. Production Naming Conventions Chapter 5. Character Productions 5.1. Character Set 5.2. Character Encodings 5.3. Indicator Characters 5.4. Line Break Characters 5.5. White Space Characters 5.6. Miscellaneous Characters 5.7. Escaped Characters Chapter 6. Structural Productions 6.1. Indentation Spaces 6.2. Separation Spaces 6.3. Line Prefixes 6.4. Empty Lines 6.5. Line Folding 6.6. Comments 6.7. Separation Lines 6.8. Directives 6.8.1. “YAML” Directives 6.8.2. “TAG” Directives 6.8.2.1. Tag Handles 6.8.2.2. Tag Prefixes 6.9. Node Properties 6.9.1. Node Tags 6.9.2. Node Anchors Chapter 7. Flow Style Productions 7.1. Alias Nodes 7.2. Empty Nodes 7.3. Flow Scalar Styles 7.3.1. Double-Quoted Style 7.3.2. Single-Quoted Style 7.3.3. Plain Style 7.4. Flow Collection Styles 7.4.1. Flow Sequences 7.4.2. Flow Mappings 7.5. Flow Nodes Chapter 8. Block Style Productions 8.1. Block Scalar Styles 8.1.1. Block Scalar Headers 8.1.1.1. Block Indentation Indicator 8.1.1.2. Block Chomping Indicator 8.1.2. Literal Style 8.1.3. Folded Style 8.2. Block Collection Styles 8.2.1. Block Sequences 8.2.2. Block Mappings 8.2.3. Block Nodes Chapter 9. Document Stream Productions 9.1. Documents 9.1.1. Document Prefix 9.1.2. Document Markers 9.1.3. Bare Documents 9.1.4. Explicit Documents 9.1.5. Directives Documents 9.2. Streams Chapter 10. Recommended Schemas 10.1. Failsafe Schema 10.1.1. Tags 10.1.1.1. Generic Mapping 10.1.1.2. Generic Sequence 10.1.1.3. Generic String 10.1.2. Tag Resolution 10.2. JSON Schema 10.2.1. Tags 10.2.1.1. Null 10.2.1.2. Boolean 10.2.1.3. Integer 10.2.1.4. Floating Point 10.2.2. Tag Resolution 10.3. Core Schema 10.3.1. Tags 10.3.2. Tag Resolution 10.4. Other Schemas Reference Links Chapter 1. Introduction to YAML YAML (a recursive acronym for “YAML Ain’t Markup Language”) is a data serialization language designed to be human-friendly and work well with modern programming languages for common everyday tasks. This specification is both an introduction to the YAML language and the concepts supporting it. It is also a complete specification of the information needed to develop applications for processing YAML. Open, interoperable and readily understandable tools have advanced computing immensely. YAML was designed from the start to be useful and friendly to people working with data. It uses Unicode printable characters, some of which provide structural information and the rest containing the data itself. YAML achieves a unique cleanness by minimizing the amount of structural characters and allowing the data to show itself in a natural and meaningful way. For example, indentation may be used for structure, colons separate key/value pairs and dashes are used to create “bulleted” lists. There are many kinds of data structures, but they can all be adequately represented with three basic primitives: mappings (hashes/dictionaries), sequences (arrays/lists) and scalars (strings/numbers). YAML leverages these primitives and adds a simple typing system and aliasing mechanism to form a complete language for serializing any native data structure. While most programming languages can use YAML for data serialization, YAML excels in working with those languages that are fundamentally built around the three basic primitives. These include common dynamic languages such as JavaScript, Perl, PHP, Python and Ruby. There are hundreds of different languages for programming, but only a handful of languages for storing and transferring data. Even though its potential is virtually boundless, YAML was specifically created to work well for common use cases such as: configuration files, log files, interprocess messaging, cross-language data sharing, object persistence and debugging of complex data structures. When data is easy to view and understand, programming becomes a simpler task. 1.1. Goals The design goals for YAML are, in decreasing priority: YAML should be easily readable by humans. YAML data should be portable between programming languages. YAML should match the native data structures of dynamic languages. YAML should have a consistent model to support generic tools. YAML should support one-pass processing. YAML should be expressive and extensible. YAML should be easy to implement and use. 1.2. YAML History The YAML 1.0 specification was published in early 2004 by by Clark Evans, Oren Ben-Kiki, and Ingy döt Net after 3 years of collaborative design work through the yaml-core mailing list5. The project was initially rooted in Clark and Oren’s work on the SML-DEV6 mailing list (for simplifying XML) and Ingy’s plain text serialization module7 for Perl. The language took a lot of inspiration from many other technologies and formats that preceded it. The first YAML framework was written in Perl in 2001 and Ruby was the first language to ship a YAML framework as part of its core language distribution in 2003. The YAML 1.18 specification was published in 2005. Around this time, the developers became aware of JSON9. By sheer coincidence, JSON was almost a complete subset of YAML (both syntactically and semantically). In 2006, Kyrylo Simonov produced PyYAML10 and LibYAML11. A lot of the YAML frameworks in various programming languages are built over LibYAML and many others have looked to PyYAML as a solid reference for their implementations. The YAML 1.23 specification was published in 2009. Its primary focus was making YAML a strict superset of JSON. It also removed many of the problematic implicit typing recommendations. Since the release of the 1.2 specification, YAML adoption has continued to grow, and many large-scale projects use it as their primary interface language. In 2020, the new YAML language design team began meeting regularly to discuss improvements to the YAML language and specification; to better meet the needs and expectations of its users and use cases. This YAML 1.2.2 specification, published in October 2021, is the first step in YAML’s rejuvenated development journey. YAML is now more popular than it has ever been, but there is a long list of things that need to be addressed for it to reach its full potential. The YAML design team is focused on making YAML as good as possible. 1.3. Terminology The key words “MUST”, “MUST NOT”, “REQUIRED”, “SHALL”, “SHALL NOT”, “SHOULD”, “SHOULD NOT”, “RECOMMENDED”, “MAY”, and “OPTIONAL” in this document are to be interpreted as described in RFC 211912. The rest of this document is arranged as follows. Chapter 2 provides a short preview of the main YAML features. Chapter 3 describes the YAML information model and the processes for converting from and to this model and the YAML text format. The bulk of the document, chapters 4, 5, 6, 7, 8 and 9, formally define this text format. Finally, chapter 10 recommends basic YAML schemas. Chapter 2. Language Overview This section provides a quick glimpse into the expressive power of YAML. It is not expected that the first-time reader grok all of the examples. Rather, these selections are used as motivation for the remainder of the specification. 2.1. Collections YAML’s block collections use indentation for scope and begin each entry on its own line. Block sequences indicate each entry with a dash and space (“- ”). Mappings use a colon and space (“: ”) to mark each key/value pair. Comments begin with an octothorpe (also called a “hash”, “sharp”, “pound” or “number sign” - “#”). Example 2.1 Sequence of Scalars (ball players) - Mark McGwire - Sammy Sosa - Ken Griffey Example 2.2 Mapping Scalars to Scalars (player statistics) hr: 65 # Home runs avg: 0.278 # Batting average rbi: 147 # Runs Batted In Example 2.3 Mapping Scalars to Sequences (ball clubs in each league) american: - Boston Red Sox - Detroit Tigers - New York Yankees national: - New York Mets - Chicago Cubs - Atlanta Braves Example 2.4 Sequence of Mappings (players’ statistics) - name: Mark McGwire hr: 65 avg: 0.278 - name: Sammy Sosa hr: 63 avg: 0.288 YAML also has flow styles, using explicit indicators rather than indentation to denote scope. The flow sequence is written as a comma separated list within square brackets. In a similar manner, the flow mapping uses curly braces. Example 2.5 Sequence of Sequences - [name , hr, avg ] - [Mark McGwire, 65, 0.278] - [Sammy Sosa , 63, 0.288] Example 2.6 Mapping of Mappings Mark McGwire: {hr: 65, avg: 0.278} Sammy Sosa: { hr: 63, avg: 0.288, } 2.2. Structures YAML uses three dashes (“---”) to separate directives from document content. This also serves to signal the start of a document if no directives are present. Three dots ( “...”) indicate the end of a document without starting a new one, for use in communication channels. Example 2.7 Two Documents in a Stream (each with a leading comment) # Ranking of 1998 home runs --- - Mark McGwire - Sammy Sosa - Ken Griffey # Team ranking --- - Chicago Cubs - St Louis Cardinals Example 2.8 Play by Play Feed from a Game --- time: 20:03:20 player: Sammy Sosa action: strike (miss) ... --- time: 20:03:47 player: Sammy Sosa action: grand slam ... Repeated nodes (objects) are first identified by an anchor (marked with the ampersand - “&”) and are then aliased (referenced with an asterisk - “*”) thereafter. Example 2.9 Single Document with Two Comments --- hr: # 1998 hr ranking - Mark McGwire - Sammy Sosa # 1998 rbi ranking rbi: - Sammy Sosa - Ken Griffey Example 2.10 Node for “Sammy Sosa” appears twice in this document --- hr: - Mark McGwire # Following node labeled SS - &SS Sammy Sosa rbi: - *SS # Subsequent occurrence - Ken Griffey A question mark and space (“? ”) indicate a complex mapping key. Within a block collection, key/value pairs can start immediately following the dash, colon or question mark. Example 2.11 Mapping between Sequences ? - Detroit Tigers - Chicago cubs : - 2001-07-23 ? [ New York Yankees, Atlanta Braves ] : [ 2001-07-02, 2001-08-12, 2001-08-14 ] Example 2.12 Compact Nested Mapping --- # Products purchased - item : Super Hoop quantity: 1 - item : Basketball quantity: 4 - item : Big Shoes quantity: 1 2.3. Scalars Scalar content can be written in block notation, using a literal style (indicated by “|”) where all line breaks are significant. Alternatively, they can be written with the folded style (denoted by “>”) where each line break is folded to a space unless it ends an empty or a more-indented line. Example 2.13 In literals, newlines are preserved # ASCII Art --- | \//||\/|| // || ||__ Example 2.14 In the folded scalars, newlines become spaces --- > Mark McGwire's year was crippled by a knee injury. Example 2.15 Folded newlines are preserved for “more indented” and blank lines --- > Sammy Sosa completed another fine season with great stats. 63 Home Runs 0.288 Batting Average What a year! Example 2.16 Indentation determines scope name: Mark McGwire accomplishment: > Mark set a major league home run record in 1998. stats: | 65 Home Runs 0.278 Batting Average YAML’s flow scalars include the plain style (most examples thus far) and two quoted styles. The double-quoted style provides escape sequences. The single-quoted style is useful when escaping is not needed. All flow scalars can span multiple lines; line breaks are always folded. Example 2.17 Quoted Scalars unicode: "Sosa did fine.\u263A" control: "\b1998\t1999\t2000\n" hex esc: "\x0d\x0a is \r\n" single: '"Howdy!" he cried.' quoted: ' # Not a ''comment''.' tie-fighter: '|\-*-/|' Example 2.18 Multi-line Flow Scalars plain: This unquoted scalar spans many lines. quoted: "So does this quoted scalar.\n" 2.4. Tags In YAML, unt'''
