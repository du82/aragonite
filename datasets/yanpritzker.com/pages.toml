title = "Elon Musk should sell Mars tickets in a Token Sale | by Yan Pritzker | Yan Pritzker"
description = "Elon Musk wants to go to Mars. There are many obstacles in the way, but one of them should not be money. The crypto ecosystem is rife with newly minted the Bitcoin nouveau riche looking for a place…"
full_description = "Yan Pritzker·FollowPublished inYan Pritzker·2 min read·Oct 23, 2018--ListenShareElon Musk should sell Mars tickets in a Token SaleElon Musk wants to go to Mars. There are many obstacles in the way, but one of them should not be money.The crypto ecosystem is rife with newly minted the Bitcoin nouveau riche looking for a place to put their cash for the next big thing. Right now, a lot of it is being poured into altcoins and ICOs.Token Sales can be completed in minutes, raise money from people all over the world, and provide an easy way to fund a global, multinational adventure.The Mars mission must be funded by a Token Sale. What better way is there to raise $1–10 billion? EOS raised hundreds of millions in days on nothing more than a whitepaper and specifically with the promise that they wouldn’t launch the very blockchain they were developing.Are you telling me Elon Musk with the following that he has and the reputation that he has for execution wouldn’t raise a billion in a day to go to Mars? $5B in a month? If 10% of the approximately currently parked in dubious alt-coins exits those markets to help fund the Mars ICO, we have enough to fund the grandest adventure mankind has undertaken in a long time.The Mars Token should be considered a ticket to the first ride on the shuttle to Mars. The structure can be set up so that owners of a certain number of Mars Tokens can get first dibs on flights. A secondary market will immediately develop leading up to the launch, allowing people to speculate on the future price of a ticket to Mars. It would also allow early ticket buyers to resell their tickets, or pass them on to future generations in case this isn’t accomplished quickly.I have no doubt that if Elon was to announce the Mars ICO tomorrow he would raise $1B within a month.Do it, Elon."
