["https://yarnpkg.com/getting-started/recipes"]
title = "Recipes | Yarn"
description = "Various cool things you can do with Yarn 2"
full_description = "Good to KnowRecipesOn this pageRecipesTypeScript + PnP quick start:​ Initialize the repo using Yarn 2: yarn init -2 Add typescript and enable VSCode integration: yarn add --dev typescriptyarn dlx @yarnpkg/sdks vscode Running a Yarn CLI command in the specified directory:​ Starting a new library inside a monorepo directly, without manually creating directories for it. yarn packages/my-new-lib init Running an arbitrary command inside a specific workspace: yarn packages/app tsc --noEmit Hybrid PnP + node_modules mono-repo:​ You may sometimes need to use node_modules on just part of your workspace (for example, if you use React-Native). Create a separate directory for the node_modules project. mkdir nm-packages/myprojtouch nm-packages/myproj/yarn.lock Enable the node-modules linker : yarn --cwd packages/myproj config set nodeLinker node-modules Add a PnP ignore pattern for this path in your main .yarnrc.yml at the root of your monorepo: pnpIgnorePatterns: - ./nm-packages/** Run yarn install to apply pnpIgnorePatterns in the repo root. Run cd nm-packages/myproj && yarn to install the now isolated project. Edit this page"
