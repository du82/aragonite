["https://yarnpkg.com/cli/info"]
title = "yarn info | Yarn"
description = "See information related to packages."
full_description = "@yarnpkg/cliyarn infoOn this pageyarn infoSee information related to packages. Usage​ $ yarn info ... Examples​ Show information about Lodash : yarn info lodash Details​ This command prints various information related to the specified packages, accepting glob patterns. By default, if the locator reference is missing, Yarn will default to print the information about all the matching direct dependencies of the package for the active workspace. To instead print all versions of the package that are direct dependencies of any of your workspaces, use the -A,--all flag. Adding the -R,--recursive flag will also report transitive dependencies. Some fields will be hidden by default in order to keep the output readable, but can be selectively displayed by using additional options (--dependents, --manifest, --virtuals, ...) described in the option descriptions. Note that this command will only print the information directly related to the selected packages - if you wish to know why the package is there in the first place, use yarn why which will do just that (it also provides a -R,--recursive flag that may be of some help). Options​ DefinitionDescription-A,--allPrint versions of a package from the whole project-R,--recursivePrint information for all packages, including transitive dependencies-X,--extra #0An array of requests of extra data provided by plugins--cachePrint information about the cache entry of a package (path, size, checksum)--dependentsPrint all dependents for each matching package--manifestPrint data obtained by looking at the package archive (license, homepage, ...)--name-onlyOnly print the name for the matching packages--virtualsPrint each instance of the virtual packages--jsonFormat the output as an NDJSON stream"
year_published = 2025
