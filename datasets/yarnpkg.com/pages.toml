["https://yarnpkg.com/blog/release/2.0"]
title = "Release: Yarn 2.0 🧶🌟 | Yarn"
description = "Hi everyone! After exactly 365 days of very intensive development, I'm extremely happy to unveil the first stable release of Yarn 2. In this post I will explain what this release will mean for our community. Buckle up!"
full_description = '''Release: Yarn 2.0 🧶🌟January 24, 2020 · 18 min readMaël NisonLead Yarn maintainerHi everyone! After exactly 365 days of very intensive development, I'm extremely happy to unveil the first stable release of Yarn 2. In this post I will explain what this release will mean for our community. Buckle up! If you're interested to know more about what will happen to Yarn 1, keep reading as we detail our plans later down this post: Future Plans. If you just want to start right now with Yarn 2, check out the Getting Started or Migration guides. Release Overview​ Describing this release is particularly difficult - it contains core, fundamental changes, shipped together with new features born from our own usage. Highlights​ The output got redesigned for improved readability designed for improved readability Our CLI commands (yarn add, ...) are now aware of workspaces Running yarn install can be made optional on per-repo basis A safer npx counterpart called yarn dlx to run one-shot tools Run commands on all workspaces with yarn workspaces foreach Packages can be modified in-place through the patch: protocol Local packages can be referenced through the new portal: protocol A new workflow has been designed to efficiently release workspaces Workspaces can now be declaratively linted and autofixed But also...​ Package builds are now only triggered when absolutely needed Package builds can now be enabled or disabled on a per-package basis Scripts now execute within a normalized shell Peer dependencies now work even through yarn link The lockfile is now proper YAML The codebase is now full TypeScript Yarn can now be extended through plugins Breaking changes...​ Configuration settings have been normalized Packages must respect their boundaries Bundle dependencies aren't supported anymore Packages are stored in read-only archives Those highlights are only a subset of all the changes and improvements; a more detailed changelog can be found here, and the upgrade instructions are available here. Frequently Asked Questions​ Who should we thank for this release?​ A significant amount of work has been done by larixer from SysGears, who crawled deep into the engine with the mission to make the transition to Yarn 2 as easy as possible. In particular he wrote the whole node_modules compatibility layer, which I can tell you is no easy feat! My thanks also go to everyone who spontaneously joined us for a week or a month during the development. In particular embraser01 for the initial Windows support, bgotink for typing our filesystem API, deini for his contributions to the CLI, and Daniel for his help on the infrastructure migration. This work couldn't have been possible without the support from many people from the open-source community - I think in particular to Nicolò from Babel and Jordan from Browserify, but they're far from being the only ones: the teams of Gatsby, Next, Vue, Webpack, Parcel, Husky, ... your support truly made all the difference in the world. And finally, the project lead and design architect for Yarn 2 has been yours truly, Maël Nison. My time was sponsored in large part by Datadog, which is a super dope place to develop JS (which is hiring 😜), and by my fiancé and our cats. Never forget that behind all open-source projects are maintainers and their families. How easy will it be to migrate to Yarn 2?​ Thanks to our beta testers and the general support of the ecosystem we've been able to soften a lot the pain associated with such a major upgrade. A Migration Guide is available that goes into more detail, but generally speaking as long as you use the latest versions of your tools (ESLint, Babel, TypeScript, Gatsby, etc), things should be fine. One particular caveat however: Flow and React-Native cannot be used at the moment under Plug’n’Play (PnP) environments. We're looking forward to working with their respective teams to figure out how to make our technologies compatible. In the meantime you can choose to remain on Yarn 1 for as long as you need, or to use the node_modules plugin, which aims to provide a graceful degradation path for smoother upgrade (note that it's still a work in progress - expect dragons). More details here. If you don't want to upgrade all of your projects, just run yarn policies set-version ^1 in the repositories that need to stay on Yarn 1, and commit the result. Yarn will always prefer the checked-in binaries over the global ones, making it the best way to ensure that everyone in your team shares the exact same release! What will happen to the legacy codebase?​ Yarn 1.22 will be released next week. Once done, the 1.x branch will officially enter maintenance mode - meaning that it won't receive further releases from me except when absolutely required to patch vulnerabilities. New features will be developed exclusively against Yarn 2. In practical terms: The classic repository (yarnpkg/yarn) will move over to yarnpkg/classic to reflect its maintenance status. It will be kept open for the time being, but we'll likely archive it in a year or two. The modern repository will not be renamed into yarnpkg/yarn, as that would break a significant amount of backlink history. It will remain yarnpkg/berry for the foreseeable future. The old website will move over to classic.yarnpkg.com, and the new website (currently next.yarnpkg.com) will be migrated to the main domain name. The yarn package on npm will not change; we will distribute further version using the new yarn set version command. We expect most of those changes to be completed by February 1, 2020. In Depth​ CLI Output​ Back when Yarn was released its CLI output was a good step forward compared to other solutions (plus it had emojis! 🧶), but some issues remained. In particular lots of messages were rather cryptic, and the colours were fighting against the content rather than working with it. Strong from this experience, we decided to try something different for Yarn 2: Almost all messages now have their own error codes that can be searched within our documentation. Here you'll find comprehensive explanations of the in-and-outs of each message - including suggested fixes. The colours are now used to support the important parts of each message, usually the package names and versions, rather than on a per-line basis. We expect some adjustments to be made during the following months (in particular with regard to colour blindness accessibility), but over time I think you'll come to love this new display! Workspace-aware CLI​ Working with workspaces can sometimes be overwhelming. You need to keep the state of your whole project in mind when adding a new dependency to one of your workspaces. "Which version should I use? What’s already used by my other workspaces?", etc. Yarn now facilitates the maintenance of such setups through various means: yarn up <name> will upgrade a package in all workspaces at once yarn add -i <name> will offer to reuse the same version as the ones used by your other workspaces (and some other choices) The version plugin will give you a way to check that all the relevant workspaces are bumped when one of them is released again. Those changes highlight the new experience that we want to bring to Yarn: the tool becomes an ally rather than a burden. Zero-Installs​ While not a feature in itself, the term "Zero Install" encompasses a lot of Yarn features tailored around one specific goal - to make your projects as stable and fast as possible by removing the main source of entropy from the equation: Yarn itself. To make it short, because Yarn now reads the vendor files directly from the cache, if the cache becomes part of your repository then you never need to run yarn install again. It has a repository size impact, of course, but on par with the offline mirror feature from Yarn 1 - very reasonable. For more details (such as "why is it different from checking in the node_modules directory"), refer to this documentation page. New Command: yarn dlx​ Yarn 2 introduces a new command called yarn dlx (dlx stands for download and execute) which basically does the same thing as npx in a slightly less dangerous way. Since npx is meant to be used for both local and remote scripts, there is a decent risk that a typo could open the door to an attacker: $ npx serv # Oops, should have been "serve" This isn't a problem with dlx, which exclusively downloads and executes remote scripts - never local ones. Local scripts are always runnable through yarn run or directly by their name: $ yarn dlx terser my-file.js$ yarn run serve$ yarn serve New Command: yarn workspaces foreach​ Running a command over multiple repositories is a relatively common use case, and until now you needed an external tool in order to do it. This isn't the case anymore as the workspace-tools plugin extends Yarn, allowing you to do just that: $ yarn workspaces foreach run build The command also supports options to control the execution which allow you to tell Yarn to follow dependencies, to execute the commands in parallel, to skip workspaces, and more. Check out the full list of options here. New Protocol: patch:​ Yarn 2 features a new protocol called patch:. This protocol can be used whenever you need to apply changes to a specific package in your dependency tree. Its format is similar to the following: { "dependencies": { "left-pad": "patch:left-pad@1.3.0#./my-patch.patch" }} Together with the resolutions field, you can even patch a package located deep within your dependency tree. And since the patch: protocol is just another data source, it benefits from the same mechanisms as all other protocols - including caching and checksums! New Protocol: portal:​ Yarn 2 features a new protocol called portal:. You can see portal: as a package counterpart of the existing link: protocol. Where the link: protocol is used to tell Yarn to create a symlink to any folder on your local disk, the portal: protocol is used to create a symlink to any package folder. { "dependencies": { "@my/app": "link:./src", "eslint-plugin-foo": "portal:./pkgs/eslint-plugin-foo" }} So what's the difference you say? Simple: portals follow transitive dependencies, whereas links don't. Even better, portals properly follow peer dependencies, regardless of the location of the symlinked package. Workspace Releases​ Working with workspaces brings its own bag of problems, and scalable releases may be one of the largest one. Most of large open-source projects around here use Lerna or a similar tool in order to automatically keep track of changes applied to the workspaces. When we started releasing the beta builds for Yarn 2, we quickly noticed we would be hitting the same walls. We looked around, but existing solutions seemed to have significant requirements - for example, using Lerna you would have to either release all your packages every time, or to keep track yourself of which packages need to be released. Some of that work can be automated, but it becomes even more complex when you consider that a workspace being released may require unrelated packages to be released again too (for example because they use it in their prepack steps)! To solve this problem, we've designed a whole new workflow available through a plugin called version. This workflow, documented here, allows you to delegate part of the release responsibility to your contributors. And to make things even better, it also ships with a visual interface that makes managing releases a walk in the park! This workflow is sill experimental, but it works well enough for us that we think it'll quickly prove an indispensable part of your toolkit when building large projects using workspaces. Workspace Constraints​ Workspaces quickly proved themselves being one of our most valuable features. Countless projects and applications switched to them during the years. Still, they are not flawless. In particular, it takes a lot of care to keep the workspace dependencies synchronized. Yarn 2 ships with a new concept called Constraints. Constraints offer a way to specify generic rules (using Prolog, a declarative programming language) that must be met in all of your workspaces for the validation to pass. For example, the following will prevent your workspaces from ever depending on underscore - and will be autofixable! gen_enforced_dependency(WorkspaceCwd, 'underscore', null, DependencyType) :- workspace_has_dependency(WorkspaceCwd, 'underscore', _, DependencyType). This other constraint will require that all your workspaces properly describe the repository field in their manifests: gen_enforced_field(WorkspaceCwd, 'repository.type', 'git') :- workspace(WorkspacedCwd).gen_enforced_field(WorkspaceCwd, 'repository.url', 'ssh://git@github.com/yarnpkg/berry.git') :- workspace(WorkspacedCwd). Constraints are definitely one of our most advanced and powerful features, so don't fret yourself if you need time to wrap your head around it. We'll follow up with blog posts to explore them into details - watch this space! Build Dependency Tracking​ A recurrent problem in Yarn 1, native packages used to be rebuilt much more than they should have. For example, running yarn remove used to completely rebuild all packages in your dependency tree. Starting from Yarn 2 we now keep track of the individual dependency trees for each package that lists postinstall scripts, and only run them when those dependency trees changed in some way: ➤ YN0000: ┌ Link step➤ YN0007: │ sharp@npm:0.23.0 must be rebuilt because its dependency tree changed➤ YN0000: └ Completed in 16.92s➤ YN0000: Done with warnings in 21.07s Per-Package Build Configuration​ Yarn 2 now allows you to specify whether a build script should run or not on a per-package basis. At the moment the default is to run everything, so by default you can choose to disable the build for a specific package: { "dependenciesMeta": { "core-js": { "built": false } }} If you instead prefer to disable everything by default, just toggle off enableScripts in your settings then explicitly enable the built flag in dependenciesMeta. Normalized Shell​ Back when Yarn 2 was still young, the very first external PR we received was about Windows support. As it turns out Windows users are fairly numerous, and compatibility is important to them. In particular they often face problems with the scripts field which is typically only tested on Bash. Yarn 2 ships with a rudimentary shell interpreter that knows just enough to give you 90% of the language structures typically used in the scripts field. Thanks to this interpreter, your scripts will run just the same regardless of whether they're executed on OSX or Windows: { "scripts": { "redirect": "node ./something.js > hello.md", "no-cross-env": "NODE_ENV=prod webpack" }} Even better, this shell allows us to build tighter integrations, such as exposing the command line arguments to the user scripts: { "scripts": { "lint-and-build": "yarn lint \"$@\" && yarn build \"$@\"" }} Improved Peer Dependency Links​ Because Node calls realpath '''
