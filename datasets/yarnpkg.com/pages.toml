["https://yarnpkg.com/advanced/pnpapi"]
title = "PnP API | Yarn"
description = "In-depth documentation of the PnP API."
full_description = '''Working with Yarn PnPPnP APIOn this pagePnP APIOverview​ Every script running within a Plug'n'Play runtime environment has access to a special builtin module (pnpapi) that allows you to introspect the dependency tree at runtime. Data Structures​ PackageLocator​ export type PackageLocator = { name: string, reference: string,}; A package locator is an object describing one unique instance of a package in the dependency tree. The name field is guaranteed to be the name of the package itself, but the reference field should be considered an opaque string whose value may be whatever the PnP implementation decides to put there. Note that one package locator is different from the others: the top-level locator (available through pnp.topLevel, cf below) sets both name and reference to null. This special locator will always mirror the top-level package (which is generally the root of the repository, even when working with workspaces). PackageInformation​ export type PackageInformation = { packageLocation: string, packageDependencies: Map<string, null | string | [string, string]>, packagePeers: Set<string>, linkType: 'HARD' | 'SOFT',}; The package information set describes the location where the package can be found on the disk, and the exact set of dependencies it is allowed to require. The packageDependencies values are meant to be interpreted as such: If a string, the value is meant to be used as a reference in a locator whose name is the dependency name. If a [string, string] tuple, the value is meant to be used as a locator whose name is the first element of the tuple and reference is the second one. This typically occurs with package aliases (such as "foo": "npm:bar@1.2.3"). If null, the specified dependency isn't available at all. This typically occurs when a package's peer dependency didn't get provided by its direct parent in the dependency tree. The packagePeers field, if present, indicates which dependencies have an enforced contract on using the exact same instance as the package that depends on them. This field is rarely useful in pure PnP context (because our instantiation guarantees are stricter and more predictable than this), but is required to properly generate a node_modules directory from a PnP map. The linkType field is only useful in specific cases - it describes whether the producer of the PnP API was asked to make the package available through a hard linkage (in which case all the packageLocation field is reputed being owned by the linker) or a soft linkage (in which case the packageLocation field represents a location outside of the sphere of influence of the linker). Runtime Constants​ process.versions.pnp​ When operating under PnP environments, this value will be set to a number indicating the version of the PnP standard in use (which is strictly identical to require('pnpapi').VERSIONS.std). This value is a convenient way to check whether you're operating under a Plug'n'Play environment (where you can require('pnpapi')) or not: if (process.versions.pnp) { // do something with the PnP API ...} else { // fallback} require('module')​ The module builtin module is extended when operating within the PnP API with one extra function: export function findPnpApi(lookupSource: URL | string): PnpApi | null; When called, this function will traverse the filesystem hierarchy starting from the given lookupSource in order to locate the closest .pnp.cjs file. It'll then load this file, register it inside the PnP loader internal store, and return the resulting API to you. Note that while you'll be able to resolve the dependencies by using the API returned to you, you'll need to make sure they are properly loaded on behalf of the project too, by using createRequire: const {createRequire, findPnpApi} = require(`module`);// We'll be able to inspect the dependencies of the module passed as first argumentconst targetModule = process.argv[2];const targetPnp = findPnpApi(targetModule);const targetRequire = createRequire(targetModule);const resolved = targetPnp.resolveRequest(`eslint`, targetModule);const instance = targetRequire(resolved); // <-- important! don't use `require`! Finally, it can be noted that findPnpApi isn't actually needed in most cases and we can do the same with just createRequire thanks to its resolve function: const {createRequire} = require(`module`);// We'll be able to inspect the dependencies of the module passed as first argumentconst targetModule = process.argv[2];const targetRequire = createRequire(targetModule);const resolved = targetRequire.resolve(`eslint`);const instance = targetRequire(resolved); // <-- still important require('pnpapi')​ When operating under a Plug'n'Play environment, a new builtin module will appear in your tree and will be made available to all your packages (regardless of whether they define it in their dependencies or not): pnpapi. It exposes the constants a function described in the rest of this document. Note that we've reserved the pnpapi package name on the npm registry, so there's no risk that anyone will be able to snatch the name for nefarious purposes. We might use it later to provide a polyfill for non-PnP environments (so that you'd be able to use the PnP API regardless of whether the project got installed via PnP or not), but as of now it's still an empty package. Note that the pnpapi builtin is contextual: while two packages from the same dependency tree are guaranteed to read the same one, two packages from different dependency trees will get different instances - each reflecting the dependency tree they belong to. This distinction doesn't often matter except sometimes for project generator (which typically run within their own dependency tree while also manipulating the project they're generating). API Interface​ VERSIONS​ export const VERSIONS: {std: number, [key: string]: number}; The VERSIONS object contains a set of numbers that detail which version of the API is currently exposed. The only version that is guaranteed to be there is std, which will refer to the version of this document. Other keys are meant to be used to describe extensions provided by third-party implementors. Versions will only be bumped when the signatures of the public API change. noteThe current version is 3. We bump it responsibly and strive to make each version backward-compatible with the previous ones, but as you can probably guess some features are only available with the latest versions. topLevel​ export const topLevel: {name: null, reference: null}; The topLevel object is a simple package locator pointing to the top-level package of the dependency tree. Note that even when using workspaces you'll still only have one single top-level for the entire project. This object is provided for convenience and doesn't necessarily needs to be used; you may create your own top-level locator by using your own locator literal with both fields set to null. noteThese special top-level locators are merely aliases to physical locators, which can be accessed by calling findPackageLocator. getLocator(...)​ export function getLocator(name: string, referencish: string | [string, string]): PackageLocator; This function is a small helper that makes it easier to work with "referencish" ranges. As you may have seen in the PackageInformation interface, the packageDependencies map values may be either a string or a tuple - and the way to compute the resolved locator changes depending on that. To avoid having to manually make a Array.isArray check, we provide the getLocator function that does it for you. Just like for topLevel, you're under no obligation to actually use it - you're free to roll your own version if for some reason our implementation wasn't what you're looking for. getDependencyTreeRoots(...)​ export function getDependencyTreeRoots(): PackageLocator[]; The getDependencyTreeRoots function will return the set of locators that constitute the roots of individual dependency trees. In Yarn, there is exactly one such locator for each workspace in the project. noteThis function will always return the physical locators, so it'll never return the special top-level locator described in the topLevel section. getAllLocators(...)​ export function getAllLocators(): PackageLocator[]; importantThis function is not part of the Plug'n'Play specification and only available as a Yarn extension. In order to use it, you first must check that the VERSIONS dictionary contains a valid getAllLocators property. The getAllLocators function will return all locators from the dependency tree, in no particular order (although it'll always be a consistent order between calls for the same API). It can be used when you wish to know more about the packages themselves, but not about the exact tree layout. getPackageInformation(...)​ export function getPackageInformation(locator: PackageLocator): PackageInformation; The getPackageInformation function returns all the information stored inside the PnP API for a given package. findPackageLocator(...)​ export function findPackageLocator(location: string): PackageLocator | null; Given a location on the disk, the findPackageLocator function will return the package locator for the package that "owns" the path. For example, running this function on something conceptually similar to /path/to/node_modules/foo/index.js would return a package locator pointing to the foo package (and its exact version). noteThis function will always return the physical locators, so it'll never return the special top-level locator described in the topLevel section. You can leverage this property to extract the physical locator for the top-level package: const virtualLocator = pnpApi.topLevel;const physicalLocator = pnpApi.findPackageLocator(pnpApi.getPackageInformation(virtualLocator).packageLocation); resolveToUnqualified(...)​ export function resolveToUnqualified(request: string, issuer: string | null, opts?: {considerBuiltins?: boolean}): string | null; The resolveToUnqualified function is maybe the most important function exposed by the PnP API. Given a request (which may be a bare specifier like lodash, or an relative/absolute path like ./foo.js) and the path of the file that issued the request, the PnP API will return an unqualified resolution. For example, the following: lodash/uniq Might very well be resolved into: /my/cache/lodash/1.0.0/node_modules/lodash/uniq As you can see, the .js extension didn't get added. This is due to the difference between qualified and unqualified resolutions. In case you must obtain a path ready to be used with the filesystem API, prefer using resolveRequest instead. Note that in some cases you may just have a folder to work with as issuer parameter. When this happens, just suffix the issuer with an extra slash (/) to indicate to the PnP API that the issuer is a folder. This function will return null if the request is a builtin module, unless considerBuiltins is set to false. resolveUnqualified(...)​ export function resolveUnqualified(unqualified: string, opts?: {extensions?: string[]}): string; The resolveUnqualified function is mostly provided as an helper; it reimplements the Node resolution for file extensions and folder indexes, but not the regular node_modules traversal. It makes it slightly easier to integrate PnP into some projects, although it isn't required in any way if you already have something that fits the bill. To give you an example resolveUnqualified isn't needed with enhanced-resolved, used by Webpack, because it already implements its own way the logic contained in resolveUnqualified (and more). Instead, we only have to leverage the lower-level resolveToUnqualified function and feed it to the regular resolver. For example, the following: /my/cache/lodash/1.0.0/node_modules/lodash/uniq Might very well be resolved into: /my/cache/lodash/1.0.0/node_modules/lodash/uniq/index.js resolveRequest(...)​ export function resolveRequest(request: string, issuer: string | null, opts?: {considerBuiltins?: boolean, extensions?: string[]]}): string | null; The resolveRequest function is a wrapper around both resolveToUnqualified and resolveUnqualified. In essence, it's a bit like calling resolveUnqualified(resolveToUnqualified(...)), but shorter. Just like resolveUnqualified, resolveRequest is entirely optional and you might want to skip it to directly use the lower-level resolveToUnqualified if you already have a resolution pipeline that just needs to add support for Plug'n'Play. For example, the following: lodash Might very well be resolved into: /my/cache/lodash/1.0.0/node_modules/lodash/uniq/index.js This function will return null if the request is a builtin module, unless considerBuiltins is set to false. resolveVirtual(...)​ export function resolveVirtual(path: string): string | null; importantThis function is not part of the Plug'n'Play specification and only available as a Yarn extension. In order to use it, you first must check that the VERSIONS dictionary contains a valid resolveVirtual property. The resolveVirtual function will accept any path as parameter and return the same path minus any virtual component. This makes it easier to store the location to the files in a portable way as long as you don't care about losing the dependency tree information in the process (requiring files through those paths will prevent them from accessing their peer dependencies). Qualified vs Unqualified Resolutions​ This document detailed two types of resolutions: qualified and unqualified. Although similar, they present different characteristics that make them suitable in different settings. The difference between qualified and unqualified resolutions lies in the quirks of the Node resolution itself. Unqualified resolutions can be statically computed without ever accessing the filesystem, but only can only resolve relative paths and bare specifiers (like lodash); they won't ever resolve the file extensions or folder indexes. By contrast, qualified resolutions are ready to be used to access the filesystem. Unqualified resolutions are the core of the Plug'n'Play API; they represent data that cannot be obtained any other way. If you're looking to integrate Plug'n'Play inside your resolver, they're likely what you're looking for. On the other hand, fully qualified resolutions are handy if you're working with the PnP API as a one-off and just want to obtain some information on a given file or package. Two great options for two different use cases 🙂 Accessing the files​ The paths returned in the PackageInformation structures are in the native format (so Posix on Linux/OSX and Win32 on Windows), but they may reference files outside of the typical filesystem. This is particularly true for Yarn, which references packages directly from within their zip archives. To access such files, you can use the @yarnpkg/fslib project which abstracts the filesystem under a multi-layer architecture. For example, the following code would make it possible to access any path, regardless of whether the'''
