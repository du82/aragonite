full_description = '''@yarnpkg/cliyarn config getOn this pageyarn config getRead a configuration settings. Usage​ $ yarn config get <name> Examples​ Print a simple configuration setting : yarn config get yarnPath Print a complex configuration setting : yarn config get packageExtensions Print a nested field from the configuration : yarn config get 'npmScopes["my-company"].npmRegistryServer' Print a token from the configuration : yarn config get npmAuthToken --no-redacted Print a configuration setting as JSON : yarn config get packageExtensions --json Details​ This command will print a configuration setting. Secrets (such as tokens) will be redacted from the output by default. If this behavior isn't desired, set the --no-redacted to get the untransformed value. Options​ DefinitionDescription--whyPrint the explanation for why a setting has its value--jsonFormat the output as an NDJSON stream--no-redactedDon't redact secrets (such as tokens) from the output'''
