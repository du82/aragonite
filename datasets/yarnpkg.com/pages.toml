["https://yarnpkg.com/getting-started/editor-sdks"]
title = "Editor SDKs | Yarn"
description = "An overview of the editor SDKs used to bring PnP compatibility to editors."
full_description = '''Good to KnowEditor SDKsOn this pageEditor SDKsSmart IDEs (such as VSCode or IntelliJ) require special configuration for TypeScript to work when using Plug'n'Play installs. This page is a collection of settings for each editor we've looked into. The editor SDKs and settings can be generated using yarn dlx @yarnpkg/sdks. Its detailed documentation can be found on the dedicated page. infoWhy are SDKs needed with Yarn PnP?Yarn PnP works by generating a Node.js loader, which has to be injected within the Node.js runtime. Many IDE extensions execute the packages they wrap (Prettier, TypeScript, ...) without consideration for loaders.The SDKs workaround that by generating indirection packages. When required, these indirection automatically setup the loader before forwarding the require calls to the real packages. Usage​ Generate both the base SDK and the editor settings: yarn dlx @yarnpkg/sdks vscode vim ... Generate the base SDK, but no editor settings: yarn dlx @yarnpkg/sdks base Update all installed SDKs & editor settings: yarn dlx @yarnpkg/sdks Tools currently supported​ warningThe yarn dlx @yarnpkg/sdks command will look at the content of your root package.json to figure out the SDKs you need - it won't look at the dependencies from any other workspaces. Supported extensionEnabled if ... is found in your package.json dependenciesBuiltin VSCode TypeScript Servertypescriptastro-vscodeastrovscode-eslinteslintprettier-vscodeprettierrelayrelay If you'd like to contribute more, take a look here! Editor setup​ CoC nvim​ Install vim-rzip Run the following command, which will generate a .vim/coc-settings.json file: yarn dlx @yarnpkg/sdks vim Emacs​ The SDK comes with a typescript-language-server wrapper which enables you to use the ts-ls LSP client. Run the following command, which will generate a new directory called .yarn/sdks: yarn dlx @yarnpkg/sdks base Create a .dir-locals.el with the following content to enable Flycheck and LSP support, and make sure LSP is loaded after local variables are applied to trigger the eval-after-load: ((typescript-mode . ((eval . (let ((project-directory (car (dir-locals-find-file default-directory)))) (setq lsp-clients-typescript-server-args `("--tsserver-path" ,(concat project-directory ".yarn/sdks/typescript/bin/tsserver") "--stdio"))))))) Neovim Native LSP​ Install vim-rzip Run the following command, which will generate a new directory called .yarn/sdks: yarn dlx @yarnpkg/sdks base TypeScript support should then work out of the box with nvim-lspconfig and theia-ide/typescript-language-server. VSCode​ Install the ZipFS extension, which is maintained by the Yarn team. Run the following command, which will generate a .vscode/settings.json file: yarn dlx @yarnpkg/sdks vscode For safety reason VSCode requires you to explicitly activate the custom TS settings: Press ctrl+shift+p in a TypeScript file Choose "Select TypeScript Version" Pick "Use Workspace Version" Your VSCode project is now configured to use the exact same version of TypeScript as the one you usually use, except that it will be able to properly resolve the type definitions.Edit this page'''
