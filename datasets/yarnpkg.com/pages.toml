["https://yarnpkg.com/getting-started/install"]
title = "Installation | Yarn"
description = "Yarn's in-depth installation guide."
full_description = "Starting with YarnInstallationOn this pageInstallationtipThe preferred way to manage Yarn is by-project and through Corepack, a tool shipped by default with Node.js. Modern releases of Yarn aren't meant to be installed globally, or from npm. Start by enabling Corepack, if it isn't already; this will add the yarn binary to your PATH: corepack enable Then initialize a new project: yarn init -2 Updating Yarn​ Any time you'll want to update Yarn to the latest version, just run: yarn set version stableyarn install Yarn will then configure your project to use the most recent stable binary. tipYarn also frequently ships Release Candidate builds. Use yarn set version canary should you need a feature not released on the stable channel yet. Those builds are very stable, the only difference with the regular channel being a more staggered migration between major as we implement new breaking changes. Installing the latest build fresh from master​ You may want to test a version of Yarn so recent it hasn't been released in a Release Candidate yet, or even not merged. The following command will clone, build, and install Yarn in your project, straight from our repository: yarn set version from sources It accepts a --branch flag which you can use to test specific PRs: yarn set version from sources --branch 1211 warningUnlike the stable and canary channels, the yarn set version from sources command can't leverage Corepack and will need to store the Yarn binary inside the .yarn/releases folder and reference it from your project's .yarnrc.yml file.Edit this page"
