title = "yarn rebuild | Yarn"
description = "Rebuild the project's native packages."
full_description = "@yarnpkg/cliyarn rebuildOn this pageyarn rebuildRebuild the project's native packages. Usage​ $ yarn rebuild ... Examples​ Rebuild all packages : yarn rebuild Rebuild fsevents only : yarn rebuild fsevents Details​ This command will automatically cause Yarn to forget about previous compilations of the given packages and to run them again. Note that while Yarn forgets the compilation, the previous artifacts aren't erased from the filesystem and may affect the next builds (in good or bad). To avoid this, you may remove the .yarn/unplugged folder, or any other relevant location where packages might have been stored (Yarn may offer a way to do that automatically in the future). By default all packages will be rebuilt, but you can filter the list by specifying the names of the packages you want to clear from memory."
