full_description = '''Working with Yarn PnPPnP SpecificationOn this pagePnP SpecificationAbout this document​ To make interoperability easier for third-party projects, this document describes the specification we follow when installing files on disk under the Plug'n'Play install strategy. It also means: any change we make to this document will follow semver rules we'll do our best to preserve backward compatibility new features will be intended to gracefully degrade High-level idea​ Plug'n'Play works by keeping in memory a table of all packages part of the dependency tree, in such a way that we can easily answer two different questions: Given a path, what package does it belong to? Given a package, where are the dependencies it can access? Resolving a package import thus becomes a matter of interlacing those two operations: First, locate which package is requesting the resolution Then retrieve its dependencies, check if the requested package is amongst them If it is, then retrieve the dependency information, and return its location Extra features can then be designed, but are optional. For example, Yarn leverages the information it knows about the project to throw semantic errors when a dependency cannot be resolved: since we know the state of the whole dependency tree, we also know why a package may be missing. Basic concepts​ All packages are uniquely referenced by locators. A locator is a combination of a package ident, which includes its scope if relevant, and a package reference, which can be seen as a unique ID used to distinguish different instances (or versions) of a same package. The package references should be treated as an opaque value: it doesn't matter from a resolution algorithm perspective that they start with workspace:, virtual:, npm:, or any other protocol. Portability​ For portability reasons, all paths inside of the manifests: must use the unix path format (/ as separators). must be relative to the manifest folder (so they are the same regardless of the location of the project on disk). warningAll algorithms in this specification assume that paths have been normalized according to these two rules. Fallback​ For improved compatibility with legacy codebases, Plug'n'Play supports a feature we call "fallback". The fallback triggers when a package makes a resolution request to a dependency it doesn't list in its dependencies. In normal circumstances the resolver would throw, but when the fallback is enabled the resolver should first try to find the dependency packages amongst the dependencies of a set of special packages. If it finds it, it then returns it transparently. In a sense, the fallback can be seen as a limited and safer form of hoisting. While hoisting allows unconstrainted access through multiple levels of dependencies, the fallback requires to explicitly define a fallback package - usually the top-level one. Package locations​ While the Plug'n'Play specification doesn't by itself require runtimes to support anything else than the regular filesystem when accessing package files, producers may rely on more complex data storage mechanisms. For instance, Yarn itself requires the two following extensions which we strongly recommend to support: Zip access​ Files named *.zip must be treated as folders for the purpose of file access. For instance, /foo/bar.zip/package.json requires to access the package.json file located within the /foo/bar.zip zip archive. If writing a JS tool, the @yarnpkg/fslib package may be of assistance, providing a zip-aware filesystem layer called ZipOpenFS. Virtual folders​ In order to properly represent packages listing peer dependencies, Yarn relies on a concept called Virtual Packages. Their most notable property is that they all have different paths (so that Node.js instantiates them as many times as needed), while still being baked by the same concrete folder on disk. This is done by adding path support for the following scheme: /path/to/some/folder/__virtual__/<hash>/<n>/subpath/to/file.dat When this pattern is found, the __virtual__/<hash>/<n> part must be removed, the hash ignored, and the dirname operation applied n times to the /path/to/some/folder part. Some examples: /path/to/some/folder/__virtual__/a0b1c2d3/0/subpath/to/file.dat/path/to/some/folder/subpath/to/file.dat/path/to/some/folder/__virtual__/e4f5a0b1/0/subpath/to/file.dat/path/to/some/folder/subpath/to/file.dat (different hash, same result)/path/to/some/folder/__virtual__/a0b1c2d3/1/subpath/to/file.dat/path/to/some/subpath/to/file.dat/path/to/some/folder/__virtual__/a0b1c2d3/3/subpath/to/file.dat/path/subpath/to/file.dat If writing a JS tool, the @yarnpkg/fslib package may be of assistance, providing a virtual-aware filesystem layer called VirtualFS. noteThe __virtual__ folder name appeared with Yarn 3.0. Earlier releases used $$virtual, but we changed it after discovering that this pattern triggered bugs in software where paths were used as either regexps or replacement. For example, $$ found in the second parameter from String.prototype.replace silently turned into $. Manifest reference​ When pnpEnableInlining is explicitly set to false, Yarn will generate an additional .pnp.data.json file containing the following fields. This document only covers the data file itself - you should define your own in-memory data structures, populated at runtime with the information from the manifest. For example, Yarn turns the packageRegistryData table into two separate memory tables: one that maps a path to a package, and another that maps a package to a path. infoYou may notice that various places use arrays of tuples in place of maps. This is mostly intended to make it easier to hydrate ES6 maps, but also sometimes to have non-string keys (for instance packageRegistryData will have a null key in one particular case). The Plug'n'Play data files contains the set of packages used within a project, and their dependencies.__infoAn array of arbitrary strings; only used as a header field to give some context to Yarn users.__info: ["This file is automatically generated. Do not touch it, or risk","your modifications being lost.",],dependencyTreeRootsA list of package locators that are roots of the dependency tree. There will typically be one entry for each workspace in the project (always at least one, as the top-level package is a workspace by itself).dependencyTreeRoots: [{name: "@app/monorepo",reference: "workspace:.",}, {name: "@app/website",reference: "workspace:website",}],ignorePatternDataA nullable regexp. If set, all project-relative importer paths should be matched against it. If the match succeeds, the resolution should follow the classic Node.js resolution algorithm rather than the Plug'n'Play one. Note that unlike other paths in the manifest, the one checked against this regexp won't begin by `./`.ignorePatternData: "^examples(/|$)",enableTopLevelFallbackIf true, should a dependency resolution fail for an importer that isn't explicitly listed in `fallbackExclusionList`, the runtime must first check whether the resolution would succeed for any of the packages in `fallbackPool`; if it would, transparently return this resolution. Note that all dependencies from the top-level package are implicitly part of the fallback pool, even if not listed here.enableTopLevelFallback: true,fallbackPoolA map of locators that all packages are allowed to access, regardless whether they list them in their dependencies or not.fallbackPool: [["@app/monorepo","workspace:.",]],fallbackExclusionListA map of packages that must never use the fallback logic, even when enabled. Keys are the package idents, values are sets of references. Combining the ident with each individual reference yields the set of affected locators.fallbackExclusionList: [["@app/server",["workspace:sources/server"],]],packageRegistryDataThis is the main part of the PnP data file. This table contains the list of all packages, first keyed by package ident then by package reference. One entry will have `null` in both fields and represents the absolute top-level package.packageRegistryData: [[null, [[null, {packageRegistryData.packageLocationThe location of the package on disk, relative to the Plug'n'Play manifest. This path must begin by either `./` or `../`, and must end with a trailing `/`.packageLocation: "./",packageRegistryData.packageDependenciesThe set of dependencies that the package is allowed to access. Each entry is a tuple where the first key is a package name, and the value a package reference. Note that this reference may be null! This only happens when a peer dependency is missing.packageDependencies: [["react", "npm:18.0.0"],],packageRegistryData.linkTypeCan be either SOFT, or HARD. Hard package links are the most common, and mean that the target location is fully owned by the package manager. Soft links, on the other hand, typically point to arbitrary user-defined locations on disk.The link type shouldn't matter much for most implementors - it's only needed because of some subtleties involved in turning a Plug'n'Play tree into a node_modules one.linkType: "SOFT" | "HARD",packageRegistryData.discardFromLookupIf true, this optional field indicates that the package must not be considered when the Plug'n'Play runtime tries to figure out the package that contains a given path. This is for instance what we use when using the `link:` protocol, as they often point to subfolders of a package, not to other packages.discardFromLookup: false,packageRegistryData.packagePeersA list of packages that are peer dependencies. Just like `linkType`, this field isn't used by the Plug'n'Play runtime itself, but only by tools that may want to leverage the data file to create a node_modules folder.packagePeers: [],}],]],["react", [["npm:18.0.0", {packageRegistryData.packageLocationThe location of the package on disk, relative to the Plug'n'Play manifest. This path must begin by either `./` or `../`, and must end with a trailing `/`.packageLocation: "./.yarn/cache/react-npm-18.0.0-a0b1c2d3.zip",packageRegistryData.packageDependenciesThe set of dependencies that the package is allowed to access. Each entry is a tuple where the first key is a package name, and the value a package reference. Note that this reference may be null! This only happens when a peer dependency is missing.packageDependencies: [["react-dom", null],],packageRegistryData.linkTypeCan be either SOFT, or HARD. Hard package links are the most common, and mean that the target location is fully owned by the package manager. Soft links, on the other hand, typically point to arbitrary user-defined locations on disk.The link type shouldn't matter much for most implementors - it's only needed because of some subtleties involved in turning a Plug'n'Play tree into a node_modules one.linkType: "SOFT" | "HARD",packageRegistryData.discardFromLookupIf true, this optional field indicates that the package must not be considered when the Plug'n'Play runtime tries to figure out the package that contains a given path. This is for instance what we use when using the `link:` protocol, as they often point to subfolders of a package, not to other packages.discardFromLookup: false,packageRegistryData.packagePeersA list of packages that are peer dependencies. Just like `linkType`, this field isn't used by the Plug'n'Play runtime itself, but only by tools that may want to leverage the data file to create a node_modules folder.packagePeers: ["react-dom",],}],]],], Resolution algorithm​ infoFor simplicity, this algorithm doesn't mention all the Node.js features that allow mapping a module to another, such as imports, exports, or other vendor-specific features. NM_RESOLVE​ NM_RESOLVE(specifier, parentURL) This function is specified in the Node.js documentation PNP_RESOLVE​ PNP_RESOLVE(specifier, parentURL) Let resolved be undefined If specifier is a Node.js builtin, then Set resolved to specifier itself and return it Otherwise, if specifier is either an absolute path or a path prefixed with "./" or "../", then Set resolved to NM_RESOLVE(specifier, parentURL) and return it Otherwise, Note: specifier is now a bare identifier Let unqualified be RESOLVE_TO_UNQUALIFIED(specifier, parentURL) Set resolved to NM_RESOLVE(unqualified, parentURL) RESOLVE_TO_UNQUALIFIED​ RESOLVE_TO_UNQUALIFIED(specifier, parentURL) Let resolved be undefined Let ident and modulePath be the result of PARSE_BARE_IDENTIFIER(specifier) Let manifest be FIND_PNP_MANIFEST(parentURL) If manifest is null, then Set resolved to NM_RESOLVE(specifier, parentURL) and return it Let parentLocator be FIND_LOCATOR(manifest, parentURL) If parentLocator is null, then Set resolved to NM_RESOLVE(specifier, parentURL) and return it Let parentPkg be GET_PACKAGE(manifest, parentLocator) Let referenceOrAlias be the entry from parentPkg.packageDependencies referenced by ident If referenceOrAlias is null or undefined, then If manifest.enableTopLevelFallback is true, then If parentLocator isn't in manifest.fallbackExclusionList, then Let fallback be RESOLVE_VIA_FALLBACK(manifest, ident) If fallback is neither null nor undefined Set referenceOrAlias to fallback If referenceOrAlias is still undefined, then Throw a resolution error If referenceOrAlias is still null, then Note: It means that parentPkg has an unfulfilled peer dependency on ident Throw a resolution error Otherwise, if referenceOrAlias is an array, then Let alias be referenceOrAlias Let dependencyPkg be GET_PACKAGE(manifest, alias) Return path.resolve(manifest.dirPath, dependencyPkg.packageLocation, modulePath) Otherwise, Let reference be referenceOrAlias Let dependencyPkg be GET_PACKAGE(manifest, {ident, reference}) Return path.resolve(manifest.dirPath, dependencyPkg.packageLocation, modulePath) GET_PACKAGE​ GET_PACKAGE(manifest, locator) Let referenceMap be the entry from parentPkg.packageRegistryData referenced by locator.ident Let pkg be the entry from referenceMap referenced by locator.reference Return pkg Note: pkg cannot be undefined here; all packages referenced in any of the Plug'n'Play data tables MUST have a corresponding entry inside packageRegistryData. FIND_LOCATOR​ FIND_LOCATOR(manifest, moduleUrl) noteThe algorithm described here is quite inefficient. You should make sure to prepare data structure more suited for this task when you read the manifest. Let bestLength be 0 Let bestLocator be null Let relativeUrl be the relative path between manifest and moduleUrl Note: The relative path must not start with ./; trim it if needed If relativeUrl matches manifest.ignorePatternData, then Return null Let relativeUrlWithDot be relativeUrl prefixed with ./ or ../ as necessary For each referenceMap value in manifest.packageRegistryData For each registryPkg value in referenceMap If registryPkg.discardFromLookup isn't true, then If registryPkg.packageLocation.length is greater than bestLength, then If relativeUrl starts with registryPkg.packageLocation, then Set bestLength to registryPkg.packageLocation.length Set bestLocator to the current registryP'''
