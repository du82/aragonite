title = "yarn config set | Yarn"
description = "Change a configuration settings."
full_description = '''@yarnpkg/cliyarn config setOn this pageyarn config setChange a configuration settings. Usage​ $ yarn config set <name> <value> Examples​ Set a simple configuration setting (a string, a number, or a boolean) : yarn config set initScope myScope Set a simple configuration setting (a string, a number, or a boolean) using the --json flag : yarn config set initScope --json '"myScope"' Set a complex configuration setting (an Array) using the --json flag : yarn config set unsafeHttpWhitelist --json '["*.example.com", "example.com"]' Set a complex configuration setting (an Object) using the --json flag : yarn config set packageExtensions --json '{ "@babel/parser@*": { "dependencies": { "@babel/types": "*" } } }' Set a nested configuration setting : yarn config set npmScopes.company.npmRegistryServer https://npm.example.com Set a nested configuration setting using indexed access for non-simple keys : yarn config set 'npmRegistries["//npm.example.com"].npmAuthToken' ffffffff-ffff-ffff-ffff-ffffffffffff Details​ This command will set a configuration setting. When used without the --json flag, it can only set a simple configuration setting (a string, a number, or a boolean). When used with the --json flag, it can set both simple and complex configuration settings, including Arrays and Objects. Options​ DefinitionDescription--jsonSet complex configuration settings to JSON values-H,--homeUpdate the home configuration instead of the project configuration'''
