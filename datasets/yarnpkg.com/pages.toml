full_description = '''Default Plugins@yarnpkg/plugin-patchOverviewOn this page@yarnpkg/plugin-patch This plugin adds support for the patch: protocol. Install​ This plugin is included by default in Yarn. Usage​ Run yarn patch <package name> and edit the resulting folder. Once you're ready, run yarn patch-commit -s <patch folder> to store the result inside a .patch file. Add the patch: protocol to your dependencies as such: { "dependencies": { "lodash": "patch:lodash@1.0.0#./my-patch-file.patch" }} Caveat​ You cannot add dependencies through the patch: protocol. Check this FAQ entry for more details.Index ClassesPatchCommandPatchCommitCommandPatchFetcherPatchResolverInterfacesHooksNamespacespatchUtilsVariablesdefaultVariables constdefaultdefault: Plugin = ...Powered by docusaurus-plugin-typedoc-api and TypeDoc'''
