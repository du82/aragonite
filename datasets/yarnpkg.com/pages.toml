full_description = '@yarnpkg/cliyarn npm publishOn this pageyarn npm publishPublish the active workspace to the npm registry. Usage​ $ yarn npm publish Examples​ Publish the active workspace : yarn npm publish Details​ This command will pack the active workspace into a fresh archive and upload it to the npm registry. The package will by default be attached to the latest tag on the registry, but this behavior can be overridden by using the --tag option. Note that for legacy reasons scoped packages are by default published with an access set to restricted (aka "private packages"). This requires you to register for a paid npm plan. In case you simply wish to publish a public scoped package to the registry (for free), just add the --access public flag. This behavior can be enabled by default through the npmPublishAccess settings. Options​ DefinitionDescription--access #0The access for the published package (public or restricted)--tag #0The tag on the registry that the package should be attached to--tolerate-republishWarn and exit when republishing an already existing version of a package--otp #0The OTP token to use with the command'
