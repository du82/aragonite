title = "yarn set version from sources | Yarn"
description = "Build Yarn from master."
full_description = "@yarnpkg/cliyarn set version from sourcesOn this pageyarn set version from sourcesBuild Yarn from master. Usage​ $ yarn set version from sources Examples​ Build Yarn from master : yarn set version from sources Details​ This command will clone the Yarn repository into a temporary folder, then build it. The resulting bundle will then be copied into the local project. By default, it also updates all contrib plugins to the same commit the bundle is built from. This behavior can be disabled by using the --skip-plugins flag. Options​ DefinitionDescription--path #0The path where the repository should be cloned to--repository #0The repository that should be cloned--branch #0The branch of the repository that should be cloned--plugin #0An array of additional plugins that should be included in the bundle-n,--dry-runIf set, the bundle will be built but not added to the project--no-minifyBuild a bundle for development (debugging) - non-minified and non-mangled-f,--forceAlways clone the repository instead of trying to fetch the latest commits--skip-pluginsSkip updating the contrib plugins"
