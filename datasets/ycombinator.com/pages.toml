["https://ycombinator.com/blog/jobs"]
title = "Y Combinator"
full_description = "We're excited to host an in-person tech hiring event on Wednesday, March 8th at 5:30 PM at Y Combinator's San Francisco office. This will ... If you’re actively looking for a job in tech, we want to help you. To help you narrow down your search, here is a list of 75 Y Combinator companies hiring now. YC's job board now lets job seekers filter by equity offered on the job description. Over 380 startups have posted roles with equity, with some early engineering roles offering 2%. The YC job board has always been the best way to find early roles at funded and vetted YC startups. Below are a few of the most recent YC startups (Winter '22 batch) hiring for founding engineers, with compensation in the $160-180K range and equity around 1.5-2.0%. Women have historically been underrepresented in tech, especially in technical roles like engineering and product. YC has run events to educate and support women in tech, and now we’re doubling down to offer tailored advice that’s specific to you and your career. Y Combinator is hosting our Summer Career Expo online on Wednesday, June 8th, 4 pm PT. This is our way to introduce engineers, PMs, and designers to the latest batch of YC startups (W22) that are looking to hire. We’re hosting YC Tech Talks: Healthcare on Wednesday, May 4 at 4pm PT (via Zoom). This event will give engineers, scientists, and other attendees an opportunity to hear directly from founders what problems keep them up at night and learn about emerging trends in the healthtech space. YC startups are actively looking for summer interns across engineering, marketing, and more. If you're an undergrad or graduate student, apply to join our summer 2022 cohort. This February, YC's Michael Seibel and Aston Motes, Director of /dev/color and 1st employee at Dropbox, are bringing together a cohort of black engineers who are interested in learning about startups and finding roles at fast-growing YC companies. Since launching Work at a Startup in 2018, we’ve collected a lot of data about the startup job landscape. We wanted to share some trends we’ve seen over the last year that show where we’ve been – and inform where we’re going as a product:"
