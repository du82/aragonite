["https://ycombinator.com/blog"]
title = "Y Combinator"
full_description = "This summer, YC will be giving grants to college students to work on their own technical projects. We’re calling these the Summer Fellows Grants. We hope this will encourage the smartest students to indulge their intellectual curiosity and work on hard technical things. We're gathering 2,000 of the top CS undergrads, masters, and PhD candidates in AI to hear from speakers including Elon Musk, Satya Nadella, Sam Altman, Andrej Karpathy, Andrew Ng, and many more — the world’s top AI experts and founders who will teach you how to build the future. Y Combinator is now running four batches per year: Winter, Spring, Summer, and Fall. We completed the first ever fall batch last year, F24, and are proud to announce the first ever spring batch. Applications are now open. To better serve founders given the rapid rate of technological change, YC recently switched from two to four batches per year. The winter 2025 batch will run from January to March, and applications are due on November 12. YC is at our best when backing founders with an ethos of building for others, including strong open source developers like the founders of Continue and many others. We’re bringing the Female Founders Conference back in-person, and we’ll be hosting it on August 2 at our office in the Dogpatch in San Francisco. In 2018, Tracy Young and her co-founders sold PlanGrid for $875 million. By 2021, she was ready to jump back in and do it all over again with a brand new startup. I chatted with Tracy about what drives her and some of what she's learned along the way."
