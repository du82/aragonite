["https://ydsquare.ca/ocadu-bhm-2025"]
title = "OCADU Black History Month Digital Exhibition — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = '''Black History Month Digital Exhibition Career LauncherOCADU Black History Month Digital ExhibitionFebruary 1 to 28, 2025Sankofa Square and the Centre for Emerging Artists & Designers proudly announce the return of the annual Black History Month Digital Exhibition Career Launcher. This exhibition offers OCAD U community artists the opportunity to showcase their work on the square's digital screens. Selected artworks will be displayed across five digital screens throughout Black History Month in February.The Black History Month Digital Exhibition Career Launcher has been a collaborative initiative between the RBC Centre for Emerging Artists & Designers and Sankofa Square since 2021. Through OCAD U's RBC Centre for Emerging Artists & Designers (RBC CEAD), the Career Launchers program connects emerging artists and professionals with real-world exhibition opportunities. Sankofa Square stands as a vibrant hub in downtown Toronto's community.Below are the recipients of the 2025 Black History Month Digital Exhibition Career LauncherTo learn more about the OCAD U Carreer Launches, please visit careerlaunchers.format.com/2025-sankofasquare-bhm Brandon Baghaee BRANDON BAGHAEEBrandon Baghaee holds a BFA from OCAD University and is an artist living and working in the GTA. He has participated in group exhibitions and had a solo show at The Drake Hotel. Additionally, he has completed projects for Scotiabank Arena, Sports and the Arts, the City of Toronto, STEPS Public Art, and the Richmond Hill Public Library. He has also given artist talks at Thornlea Secondary School and at the Young Voices 2022 Magazine launch.In his practice, Baghaee explores themes of cultural history and memory, spirituality, cultural politics, identity, sport, and nostalgia through fantastical, color-induced paintings that feature the self or multiple selves. He draws on everyday experiences, memories, and speculative ideas to reflect on the past while imagining something new. Recently, he completed illustrating a children's book that explores childhood and sports.Website: brandonbaghaee.com Instagram: @brandonbaghaee View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738341394775-BRGKIAUXY7VG0ZLCGH36/OCADUBHM_Brandon_Horizontal_DOMYDR14_Slot.jpg" alt="OCADUBHM_Brandon_Horizontal_DOMYDR14_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738341394704-LIGDJRNJ7ND4ZX8OFBNL/OCADUBHM_Brandon_Vertical_DOMYDR10_Slot.jpg" alt="OCADUBHM_Brandon_Vertical_DOMYDR10_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738341395421-ZM9IFLSO70PYWNRIJDRO/OCADUBHM_Brandon_Vertical_DOMYDR11_Slot.jpg" alt="OCADUBHM_Brandon_Vertical_DOMYDR11_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738341395494-7SDJ4D1H0UEFUR1YR6CY/OCADUBHM_Brandon_Vertical_DOMYDR12_Slot.jpg" alt="OCADUBHM_Brandon_Vertical_DOMYDR12_Slot.jpg" /> #block-yui_3_17_2_1_1738340584945_47118 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-yui_3_17_2_1_1738340584945_47118 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } Danielle Clark DANIELLE CLARK Danielle Clark is a Toronto-based designer, animator, and artist who draws inspiration from the energy and intrigue of everyday life. A recent graduate of OCAD University, Danielle is passionate about crafting captivating experiences that deeply connect with audiences. She combines design, motion, and artistic expression to tell compelling and meaningful stories.Website: designwithdanielle.com Instagram: @dan.elle_des.gn View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738342890204-Y9BYK27Z0SP9TH0LVCT5/OCADUBHM25_Danielle_Horizontal_DOMYDR14_Slot.png" alt="OCADUBHM25_Danielle_Horizontal_DOMYDR14_Slot.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738342889880-H4TDVC679OM3CSNIJWC2/OCADUBHM25_Danielle_Vertical_DOMYDR10_Slot.png.png.png" alt="OCADUBHM25_Danielle_Vertical_DOMYDR10_Slot.png.png.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738342891147-8084MZHA5T84B9RDXLF5/OCADUBHM25_Danielle_Vertical_DOMYDR11_Slot.png.png" alt="OCADUBHM25_Danielle_Vertical_DOMYDR11_Slot.png.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738342891437-7XAPB22SZQ3JKAHCTP03/OCADUBHM25_Danielle_Vertical_DOMYDR12_Slot.png" alt="OCADUBHM25_Danielle_Vertical_DOMYDR12_Slot.png" /> #block-yui_3_17_2_1_1738340584945_197449 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-yui_3_17_2_1_1738340584945_197449 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } Jenelle Smith JENELLE SMITH Jenelle Smith is a first generation Jamaican-Canadian visual artist based in Toronto, Ontario. Jenelle is an emerging artist delving into the concepts of the mind through her dreamlike work. Working in digital and analog image-based media, Jenelle aims to speak upon thought provoking topics such as, mental health, technology, race, and family.Jenelle is currently pursuing her undergraduate degree in Photography at OCAD University. Jenelle seeks to challenge conventional perceptions and ignite conversation through her work.Website: jenellesmith.com Instagram: @tearydreamss View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343275509-SZB47VVW1FM7MPTDYXYT/OCADUBHM25_Jenelle_Horizontal_DOMYDR14_Slot.jpg" alt="OCADUBHM25_Jenelle_Horizontal_DOMYDR14_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343275623-ICFVLX7J5O0C21EH6GGY/OCADUBHM25_Jenelle_Vertical_DOMYDR10_Slot.jpg" alt="OCADUBHM25_Jenelle_Vertical_DOMYDR10_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343276368-0L4KDFZ5QM00O1VTM2GX/OCADUBHM25_Jenelle_Vertical_DOMYDR11_Slot.jpg" alt="OCADUBHM25_Jenelle_Vertical_DOMYDR11_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343276553-PJXGXDVBHAINOI0O1031/OCADUBHM25_Jenelle_Vertical_DOMYDR12_Slot.jpg" alt="OCADUBHM25_Jenelle_Vertical_DOMYDR12_Slot.jpg" /> #block-yui_3_17_2_1_1738340584945_259018 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-yui_3_17_2_1_1738340584945_259018 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } Ghislan Sutherland-Timm GHISLAN SUTHERLAND-TIMM Ghislan Sutherland-Timm (they/she) is a queer multidisciplinary craftsman and media researcher based in Tkaronto/Toronto. Their creative practice is influenced by the journey of reconnecting with their Yurumein/Afro-Vincentian heritage and Carib roots. In this process of activation, Sutherland-Timm seeks to merge their constellated identity with their English and Scottish (Clan Sutherland) ancestry, exploring fragmentations of being hosted within living entities, memories, and land formations.Their work is further ignited by the ephemerality and tactility of sound and cinema. In creating what they describe as "incomplete complete" works, Sutherland-Timm frequently employs collage techniques across a diverse range of mediums to shape autobiographical-fictional narratives, often centered on ambiguous beings. Through this intersection, Sutherland-Timm navigates the unraveling of mythologies and the romanticization of home and homecoming.Website: ghislan.com Instagram: @orphicinema View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343461387-IJMYGMQAL1SU296SENIO/OCADUBHM25_Ghislan_Vertical_DOMYDR11_Slot.png" alt="OCADUBHM25_Ghislan_Vertical_DOMYDR11_Slot.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343461616-JNR881N5F5FVBAYIN5J4/OCADUBHM25_Ghislan_Vertical_DOMYDR12_Slot.png" alt="OCADUBHM25_Ghislan_Vertical_DOMYDR12_Slot.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343676866-W4HDEVG7TAYEK8EQSVIN/Screenshot+2025-01-31+121324.png" alt="Screenshot 2025-01-31 121324.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343676921-KQIJ8I3BM1BQ39ED8768/Screenshot+2025-01-31+121409.png" alt=" " /> #block-yui_3_17_2_1_1738340584945_286240 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-yui_3_17_2_1_1738340584945_286240 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } Teniola Tejumola TENIOLA TEJUMOLATeniola Tejumola, also known as Tanto, is a multidisciplinary artist skilled in traditional mediums such as ink, acrylic, and oil paints, as well as digital painting. Born in Lagos, Nigeria, he came to Canada in 2014. He holds an advanced diploma in Visual and Creative Arts from Sheridan College and is currently studying Drawing and Painting at OCAD University.Teniola has exhibited his work in several group shows over the years, including the Joshua Creek Gallery exhibitions in 2017 and 2018. In 2023, one of his artworks was showcased at the Magikwoods showroom. He has also sold pieces at various art markets across the GTA.His work is deeply rooted in his Nigerian Yoruba heritage, drawing inspiration from the rich traditions, stories, and symbolism that have shaped his identity. Growing up immersed in Yoruba culture, Teniola developed a profound connection to the folklore, myths, and ancestral practices that continue to resonate in his daily life. Through his art, he seeks to preserve and celebrate these ancient stories, translating them into visual forms that speak to both his personal and collective experiences.His practice blends both traditional techniques and digital methods. Each piece is a reflection of the spirituality embedded in his culture, offering a visual narrative that invites viewers to explore the depth and relevance of these timeless traditions. By infusing his work with elements of folklore and contemporary touches, Teniola bridges the older and newer generations, honoring his heritage in a way that connects the past with the present.Instagram: @Tanto_Tej View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343869406-C3M4DCJ31UVJBXAGAFB9/OCADUBHM25_Teniola_Horizontall_DOMYDR14_Slot.jpg" alt="OCADUBHM25_Teniola_Horizontall_DOMYDR14_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343869198-FKV0BS7FKHVCNTRAOSJL/OCADUBHM25_Teniola_Vertical_DOMYDR10_Slot.jpg" alt="OCADUBHM25_Teniola_Vertical_DOMYDR10_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343870324-QM9QVXE6CVM2UYT6L2QV/OCADUBHM25_Teniola_Vertical_DOMYDR11_Slot.jpg" alt="OCADUBHM25_Teniola_Vertical_DOMYDR11_Slot.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1738343870485-2KH45WX3MCUXX70I0OQX/OCADUBHM25_Teniola_Vertical_DOMYDR12_Slot.jpg" alt="OCADUBHM25_Teniola_Vertical_DOMYDR12_Slot.jpg" /> #block-yui_3_17_2_1_1738340584945_304390 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -10px; } #block-yui_3_17_2_1_1738340584945_304390 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 10px; margin-bottom: 10px; } SANKOFA: A FILM OF MOVING PAINTINGSFebruary 1 to 28, 2025Komi Olaf, a painter and digital illustrator known for utilizing metaphor, symbolism and cultural commentary to address ideas of decolonization through the lens of Afrofuturism. The short film draws inspiration from Komi Olaf’s paintings, reinterpreting themes of emancipation and self-determination through afro-surrealist images.Written by: Komi OlafDirected by: writer and multimedia artist Nana Ian Budu Keteku.Featuring: Mary Nabil | Johana Malary | Pricilla Awagah | Haija & Vida | Nana Konadu | Blessing NkrumahProduced by: Alkeblulan PicturesProduced with the Financial Participation of: The Canada Council for the Arts.'''
