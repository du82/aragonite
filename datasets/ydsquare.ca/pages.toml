["https://ydsquare.ca/about-us-1"]
title = "ABOUT US — Sankofa Square (formerly Yonge-Dundas Square)"
description = """
Yonge-Dundas Square is a unique focal point of the downtown Toronto 
community. The Square is designated for use as a public open space and as 
an event venue that can accommodate events of various sizes."""
full_description = "Scroll ABOUT USSankofa Square (formerly Yonge-Dundas Square) is a unique focal point of the downtown Toronto community. The Square is designated for use as a public open space and as an event venue that can accommodate events of various sizes. You'll discover a wide range of activities on the Square: community celebrations, theatrical events, concerts, receptions, promotions – events that appeal to residents and tourists alike and provide a showcase for local businesses. MISSIONThe mission of the Sankofa Square Board of Management is to responsibly manage Sankofa Square and enhance the vitality of downtown; to launch, promote, and operate the Square as an exciting commercial space born from the passion of its community and the energy of commercial participation, so as to develop a positive perception by way of its activities, security, and cleanliness. YDS STRATEGIC PLAN EVENT CAPABILITIESSankofa Square is a 1 acre outdoor public and event space at the intersection of Yonge Street and Dundas Street. The Square draws visitors from across the city and around the world, bringing a vibrant energy to the neighborhood. The space has been host to thousands of events ranging from community festivals to product launches, international celebrations and more! Our team of experienced event coordinators and service providers work closely with each client to ensure the successful execution of their event. Demographics HISTORYThe City of Toronto’s Official Plan sets out the vision for a vibrant, competitive, safe and livable downtown. In 1996, the Yonge Street Regeneration Project was initiated by a partnership between the Yonge Street Business and Residents Association and the City of Toronto. At the heart of the city, the area surrounding Yonge and Dundas was targeted for significant improvements. The objectives of the Yonge Street Regeneration Project were to create a renewed sense of place, attract additional retail and entertainment development to the area and to improve its appearance and safety. The center-piece of the Regeneration Project was the creation of a new public space at the southeast corner of Yonge and Dundas Streets. In 1998, the City of Toronto launched a competition to design Yonge-Dundas Square and the Toronto firm Brown + Storey Architects was selected to design the new public space.City Council decided to install a Board of Management to operate Yonge-Dundas Square as a business venture. The first Board of Management for the Square was appointed in 2001. Yonge-Dundas Square was opened to the public in November 2002 with a sneak preview of one of the Square’s key design elements in motion. Twenty fountains, a spectacle of water and light, set the stage for the Square. The preview was the first opportunity for the public to see the Square come alive before its official opening in 2003. In 2017, The Square embarked on a new partnership with Outedge Media to provide new permanent digital signage and technologies on the Square. This marked the first major capital investment in the space since it’s construction, and the first public-private partnership of its kind in Canada.On December 14, 2023, the City of Toronto announced that Toronto City Council adopted a motion to change the name of Yonge-Dundas Square to Sankofa Square. The name Sankofa is the result of two years of careful work by the City of Toronto convened Recognition Review Community Advisory Committee (CAC), whose conversations were informed by consultations with the public. The 20-member CAC was made up of Black and Indigenous leaders, along with other diverse residents and business owners living and working along Dundas Street. PUBLIC USE & FACILITIES The Square is a place where friends meet, enjoy the dancing fountains, take advantage of free Wi-Fi, or catch a free concert. We are also home to accessible washroom spaces located on the P1 level.SECURITY AND SAFETYSankofa Square is a safe space for all to enjoy the wide range of activities offered, and we ask for your cooperation in maintaining a welcoming environment. Our security staff is on site 24/7, and is ready to assist if you see something out of the ordinary or in the event of an emergency. AFFILIATED AGENCIES TORONTO TRANSIT COMMISSIONThe Square is situated above Dundas Station on the Yonge-University Line of the TTC. For more information, please visit the TTC website.TORONTO PARKING AUTHORITYThe Square is constructed on top of a 250-space parking facility operated by the Toronto Parking Authority. The entrance to the parking garage is located at the corner of Victoria Street and Dundas Streets, and is also accessible by elevator on the north side of the Square. ABOUT CITY AGENCIES DIGITAL SIGNAGE The digital signage capabilities of Sankofa Square are of great benefit to the downtown community, visitors to the Square, and event attendees. Having permanent digital screens dedicated to events allows for affordable use of this technology by all Sankofa Square clients, elevating the standards and possibilities of all events and activations. These screens are also essential to Sankofa Square when events are not being staged, allowing for the display of visitor information, public art, video projects, collaborations with other city organizations and acknowledgment of Sankofa Square sponsors. In keeping with the Square’s focus on the community, advertising is not sold for display on these screens. All digital content must adhere to the Sankofa Square Display Policy.For information on how to use the Sankofa Square digital screens for your event, please contact your event coordinator. For information on how to book space on the digital screens managed by Outedge Media, please contact them directly. ABOUT US HISTORY New Gallery PUBLIC USE New Gallery AFFILIATED AGENCIES New Gallery DIGITAL SIGNAGE New Gallery"
