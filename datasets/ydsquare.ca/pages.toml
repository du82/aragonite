["https://ydsquare.ca/ocadu-animation-2024"]
title = "OCADU Animation 2024 — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = '''OCADU Student Public Art Exhibition 2024July 1 to 31, 2024OCADU Student Public Art Exhibition 2024 is an animated art exhibition that celebrates the evolution of community, space, and history. Through a collaborative effort, 11 student artists have woven together a captivating visual narrative, each contributing a 15-second animation and connected with match-cuts. The exhibition unfolds in a seamless progression, symbolizing growth and transformation. The exhibition explores themes of community, space-making, and history. The students explored questions like: What is the essence of community and its interconnectedness, resilience, and shared experiences? How does the physical and emotional spaces we inhabit shape our identities and interactions? How can animations reflect the passage of time, and echo the stories embedded withing our surroundings? As a result, the students created an animated series that starts in black and white, and gradually infuse colour and vibrancy. Each student's unique style contributes to the collective tapestry. By using match­cuts, from photos of the physical space, the animations connect together, bridging the physical and the digital. This exhibition invites viewers to witness the dynamic journey of a community, where creativity intertwines with memory, and art becomes a mirror reflecting our shared growth. About the Artists: Gardiner Zhang ARTIST STATMENTIn my frame-by-frame animation, I explore the bustling essence of Toronto’s Yonge-Dundas Square (soon to be Sankofa Square), a place emblematic of constant movement yet capable of capturing timeless memories. My piece depicts a simple yet profound scene: a group of friends gathering to take a photo together in the square. This act of taking a photo serves as a pause, a momentary capture of camaraderie and shared memories in a space that sees thousands of such memories formed and forgotten.The public exhibition’s theme resonates deeply with my work, as it reflects on urban spaces and the personal connections we forge within them. Yonge-Dundas Square (soon to be Sankofa Square), with its ceaseless foot traffic and flashing billboards, might seem impersonal at a glance. However, through my animation, I aim to express how even the most fleeting interactions can leave a lasting impression on us, much like to how the square leaves its mark on those who pass through.Living just a stone’s throw away from this iconic location, I traverse the square daily. This personal connection fuels my creative expression, allowing me to depict not just any urban space, but one that holds a personal significance. I believe this personal touch makes my perspective unique in this exhibition. Through my animation, I invite viewers to reflect on their own memories of such spaces and appreciate the personal stamps we leave in our brief encounters within them.Email: zydgardiner@gmail.com Jessica Zeng Artist BioJessica Zeng is a 2D animation artist and freelance illustrator currently enrolled in the EXAN program at OCAD University. Her work favors a traditional Japanese style, exploring the relationship between humans and the environment/society through drawing. In her works, she pays special attention to history, technology, and culture-related content, incorporating these elements into her artwork.ARTIST STATMENTYonge-Dundas Square (soon to be Sankofa Square), one of downtown Toronto's busiest and most historic sites, has been infused with commercial areas, transient populations, and cultural activities, which closely relate to my work. My entry examines Yonge-Dundas Square (soon to be Sankofa Square) link to Toronto, its history, and its residents.My animated film, "Here With Us," showcases Toronto's iconic historic and contemporary structures, including the Distillery Historic District, Queen's Park, the Royal Ontario Museum, the Gooderham Building, AGO, and the CN Tower. Some of these structures have transitioned from black and white to color photography and are now flanked by high-rise buildings that maintain their heritage. Modern structures have seen the information age’s influences on humanity, whereas historical ones have seen industrialization. Yonge-Dundas Square (soon to be Sankofa Square), in the city center has evolved throughout the years, yet it still showcases each period. The video shows how these structures have grown and how architecture and humankind have shaped their development.This little snippet summarizes my five years in Toronto, which is why I thought this section needed to be done by me. Over time, I've felt more integrated into Toronto, from the first time I was intrigued by the modern architecture of the city, to getting to know the city and Yonge-Dundas Square (soon to be Sankofa Square), each time I pass by. Architecturally, they steadily reflect history and change according to current times. The human adventure continues as we continue to innovate. Constant progress changes everything, but there is always something to record the past, and new things come along. "Here With Us," an animated short film, was made with ProcreateDreams, all the budlings are drown in sticker style, including the little girl in a cute style. The overall style is more relaxed, as I didn’t want the viewer to feel that the main tone of the work is related to history, architecture, and time, and other grandiose things, thus creating a sense of oppression. These are all of my ideas for this animated short, and I think it’s one of the more interesting pieces that can be fun while allowing the viewers in Yonge-Dundas Square (soon to be Sankofa Square) to connect with more of what’s going on around them. I hope that these 15 seconds will make people feel relaxed and enjoy the space more.Email: jessicazeng@ocadu.caInstagram: @zerokaya_z0 Yiwen Su and Paris Lin Yiwen Su Artist BioYiwen Su is an animator and digital artist born in Shanghai, China, currently residing in Toronto, Canada. She is a third-year student majoring in Experimental Animation in the Bachelor of Fine Art program at OCAD University since 2021. Her practice in animation focuses on emotional expression and movement capturing using various media. She has this goal of picturing out the content and the emotion in pieces of sound and music by using diverse animation mediums. She also has some illustrations and handicraft products. Her work predominantly focuses on digital media.Paris lin Artist BioParis Lin is an animator and illustrator born in southern China and currently residing in Toronto. She received her Bachelor of Fine Arts in Experimental Animation from OCAD University in 2024. Paris specializes in animation and illustration, with a focus on emotional expression. She combines her observations and integrates them into her work. Paris primarily works with digital media, possessing an understanding of stop-motion animation and 3D modeling techniques. She aims to explore diverse animation languages through various production methods, emphasizing the communication of contextual information. In addition to her animation work, Paris has experience in handicrafts and woodworking. She has participated in animated exhibitions at Yonge-Dundas Square (soon to be Sankofa Square) and contributed to the cover and product design for the artwork collection of the 27th to 29th Comic Exhibition.ARTIST STATMENT"On the Way" is a series of narrative 2D animations about the community around Yonge-Dundas Square (soon to be Sankofa Square), created by Paris Lin and Yiwen Su. The series comprises two animations, each 15 seconds long. The main theme explores the history and diversity of the community in this area. The plot focuses on two characters, representing different eras, walking along the sidewalk of YDS. As they turn around, they switch to their own special work scenes. The title "On the Way" refers to the millions of people walking along the sidewalk of YDS every day, as well as the path of the history of YDS's from past to future. The goal of this project is to picture the community of the place we are living in.Yiwen Su Email: yiwens1135@gmail.comParis Lin Email: Parislin019@outlook.com Diana Wu Artist BioDiana Wu, a third-year Experimental Animation student at OCAD University, specializes in creating compelling narratives through 2D black-and-white animation. With a keen eye for the nuances of light and shadow, Diana crafts stories that not only entertain but also provoke thought and emotion. Her work, characterized by its unique aesthetic and depth, explores a range of themes from the whimsical to the profound. As she continues her academic journey, Diana is dedicated to refining her skills and pushing the boundaries of traditional animation, aiming to leave a distinctive mark in the world of experimental animation.ARTIST STATMENTMy work is a black-and-white 2D frame-by-frame animation depicting a vibrant party scene at Yonge-Dundas Square (soon to be Sankofa Square). In this animation, viewers can see people dancing and playing music, enjoying the vitality and fun of the community. The square is filled with laughter and cheer, and the energy of the people seems to leap off the page. Through each frame and continuous morphing, I convey the unparalleled enthusiasm and energy of the square.This animation closely relates to the theme of "Community." It not only showcases the physical aspects of the location but, more importantly, its spirit and culture. Yonge-Dundas Square (soon to be Sankofa Square), as a central gathering place, connects people closely through various activities and interactions. My animation captures these moments, illustrating how the community unites through shared joy.I have a special connection to this square. Living nearby, I often experience and feel the unique charm and vitality of this place firsthand. My personal experiences and understanding of this location allow me to depict the subtleties of the square that only frequent visitors would recognize.Through this animation, I aim to convey the unique atmosphere of Yonge-Dundas Square (soon to be Sankofa Square) and allow viewers to experience the joy and unity that belong exclusively to this community.Email: diana12250511@gmail.com Ted Lutman Artist BioTed Lutman is an animator originally from Richmond Hill, Ontario. His works are mostly lighthearted and comedic in nature and are most often illustrations or short-form animations, with a focus on visual storytelling. In early 2023, Ted’s works began to take on a more serious tone, marked significantly by his film "Photographic Memories," a tribute to his late father and the memories they had shared together. Since then, he has focused far more on the conceptual side of his work, creating narrative works that draw from his on personal experiences. He is currently working towards graduating with a Bachelor of Fine Arts at OCAD University.ARTIST STATMENTIn discussions of community, the homeless people of Toronto are often left out. It wouldn't be right to have a public art piece celebrating community without acknowledging those who are so frequently left out, despite needing community the most. Show compassion to those who need it. I chose to create this piece in response to the numerous anti-homeless measures employed countrywide — from benches with unnecessary armrests to police patrolling parking lots for people sleeping in their cars. The injustice is suffocating. My piece attempts to hold a mirror to how normalized the dehumanization of homeless folks is, and promote critical thought and reflection on how we can treat those around us better, even if it's nothing but a small gesture of kindness. William Bi Artist BioWilliam Bi is a versatile artist specializing in 3D modeling, animation, and game development. With a strong background in both the creative and technical aspects of digital art, William Bi brings a unique blend of skills to their projects.Having previously worked as an animator and modeler at a prominent game development company, William Bi has extensive experience in creating immersive gaming experiences. Their proficiency in 3D modeling allows them to craft detailed environments, characters, and assets that bring virtual worlds to life.Drawing from their experience in the gaming industry, William Bi infuses their animations with dynamic movement and cinematic flair. Their animations range from character animations to environmental effects, showcasing a keen eye for detail and mastery of animation principles.In addition to their work in games, William Bi excels in creating compelling visual narratives through their animations. Whether it's a short film, advertisement, or promotional video, William Bi utilizes their skills in 3D animation to engage audiences and convey stories with impact.With a passion for merging artistry with technology, William Bi is dedicated to creating memorable experiences that resonate across various mediums. Their work reflects a commitment to innovation, creativity, and excellence in the realm of digital art and animation.ARTIST STATMENT"My animation, 'Young Dundas: 3D Rendered 2D Modeling Animation,' aims to present a unique perspective on the diverse and vibrant urban landscape. By combining advanced 3D rendering techniques with traditional 2D modeling, I seek to capture the unique charm and vitality of Yonge-Dundas Square (soon to be Sankofa Square).This animation explores urban life and culture, as well as an exploration of the fusion of technology and art. Through meticulous modeling and dynamic rendering, I aim to create an immersive experience that transports viewers into the hustle and bustle of Yonge-Dundas Square (soon to be Sankofa Square.In this piece, I aim not only to depict the superficial appearance of Yonge-Dundas Square (soon to be Sankofa Square), but also to abstractly express its cultural and social significance it represents. I employ vibrant colors and fluid motion highlight the square's vibrancy and diversity of this location, while also expressing exploration and imagination within urban spaces.By merging technology with art, I hope viewers will feel the infinite possibilities inherent in Yonge-Dundas Square (soon to be Sankofa Square), as we as the beauty and vitality of urban life. This animation represents my unique interpretation of urban landscapes and a continual pursuit of innovation and creative expression."Website: williambi1997.wixsite.comEmail: williambi1997@gmail.com John Li Artist BioJohn Li is a digital artist from Toronto specializing in illustration and game design. He is currently pursuing a major in animation at OCAD University. John believes that art is about connecting people and a great place to reach a wider public audience. His portfolio includes the development of games such as "Chicken Ranch" and "Point Launcher," as well as design work for North Canine.ARTIST STATMENTAs a digital artist, my mission is to introduce Yonge-Dundas Square (soon to be Sankofa Square) to the world of illustrat'''
