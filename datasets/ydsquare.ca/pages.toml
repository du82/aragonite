s On At The Square This Week:⁠ ⁠ ◼️ Mobile Yankee Candle Village⁠ 🗓️ Thursday, Nov 14 | 9 AM - 7 PM⁠ ⁠ Visit the Mobile @yankeecandle Candle Village to find your favourite fragrance &amp;ndash; and you might just get to take home a candle of you" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1731010145093-26MY3Q76Q8LDOGNPVPU5/image-asset.jpeg" alt="Join us for Remembrance Day Commemoration Events with @downtownyonge 🏵️ Remembrance Day Ceremony at The Square 🗓️ Saturday, November 11 🕚 11:00 AM Join us at The Square for a Moment of Silence and the poignant playing of &amp;ldquo;The Lament&amp;rdquo;" /> #block-yui_3_17_2_1_1706176226311_4315 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1706176226311_4315 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Home Vision + Campaigns Mission Sec Home Annual Report Specific Images Home Impact Instagram'''
