["https://ydsquare.ca/makeroom-x-sankofa-square-2025"]
title = "MakeRoom x Sankofa Square 2025 — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = '''MakeRoom x Sankofa Square 2025: On The Uses Of Fire Learn more about the Call for Artists at makeroom.me/on-the-uses-of-fire/ On the Digital Screens from March 1 to 31, 2025 Sankofa Square and MakeRoom Inc. are excited to announce the featured artists for the On The Uses Of Fire collection: Iman Abbaro, Ila Lovelace, Joy Adeola, Richard Ashman, and Miki Frances Sankhara.ABOUT MAKEROOMMakeRoom Inc is a curatorial agency that provides BIPOC, and Emerging artists platforms to exhibit their work. We partner with institutions to develop funded art experiences that are fresh, meaningful and community enriching. We achieve this by using practices that eliminate gatekeeping from the curation process, and by actively involving members of the arts community. Website: MakeRoom.me | Instagram: @makeroomincCURATOR BIO & STATEMENT Artist: Roya DeSol Roya DelSol (b. 1990) is a Black lens-based curator, filmmaker & photographer of Caribbean heritage currently living & working in T’karonto. She creates photographic, video, installation and immersive (XR) work; aiming for her work in all spheres to center and uplift the experiences Black, queer, and marginalized peoples. She is drawn to the sharp, chaotic and disruptive nature of Black (femme) rage, revenge and retribution; along with expressions of Black queer eroticisms.She has curated exhibitions with Doris McCarthy Gallery at University of Toronto, Scarborough; Trinity Square Video, The Margin of Eras Gallery & It’s OK* Studios. Her experimental video, photography and installation work has been featured in group exhibitions with Patel Brown Gallery, Textile Museum of Canada, Nia Centre, Myseum Toronto & Venus Festival.“On The Uses Of Fire” speaks to the necessity and clarifying nature of anger for marginalized communities, in a world that requires it as fuel to engender change.What bubbles beneath the surface? When molten lava emerges, consumes, hardens and weathers; what sprouts from that fertile, sulphuric soil? How do we utilize our rage in service of rebirth?Here, we see a collection of images that speak to this process: deities that protect through the transmutation of fire; the chaos of the immersion in frustration & rage; the meditative moment of clarity where that fire crystallized into something sharper; the channeling of that energy to shape the body, mind and spirit; and redirection of those feelings to empower ourselves fight for a better world. By listening to ourselves and our emotions, we are able to reshape this world in our image -- one step at a time.Website: royadelsol.com | Instagram: @RoyaDelSolHeadshot | Credit: Jorian CharltonABOUT THE ARTISTS Iman Abbaro Artist: Iman Abbaro Artist bioSudan Revolts: December 2018 Protests on 35mm FilmIman Abbaro—also known as Sudaneeya—is a Sudanese multidisciplinary creative currently based in Toronto. Her focus has been on curating a wide range of creative events that bring together and celebrate different aspects of the Afro-Caribbean diaspora. Iman believes that creative expression is crucial to fostering communities, especially those in the margins. This image of a protestor and also my dear friend Ola was captured on film during the Sudan solidarity protests of 2018. This was the first of many solidarity protests to follow as my home country Sudan had just entered its third revolution. This photograph is a special one because it is a part of a collection that spotlights Sudanese women who have been at the forefront of peaceful movements. Whether it's overthrowing colonial regimes or resisting military dictatorships, Sudanese women have always ignited a fire in the country's revolutions for decades. Instagram: @sudaneeyaa Joy Adeola Artist: Joy Adeola Artist bio 'boxed in' and 'the shift’Joy Adeola is a Nigerian-Canadian visual artist. Through storytelling, she explores interpersonal bonds, following the changing rhythms of our relationships with ourselves and others. Her work combines vivid contrast and an intimate warmth to uncover the beauty and nuanced complexities often hidden in our everyday lives. Exploring the intricate tapestry of human connections and our interaction with the world around us, her work celebrates the beauty and complexities often hidden in our everyday lives. By magnifying the overlooked facets of life, she unveils a hidden richness, inviting viewers to pause and appreciate the myriad of stories unfolding around them.Both pieces depict Black women struggling against the constraints that confine them. Boxed In portrays a woman consumed by rage, reshaping the world around her through her fury. At the same time, The Shift captures a Black woman painfully resisting societal, emotional and psychological pressure by becoming her own light. The colour red is a constant in both pieces, symbolizing the pain and labour required to navigate the struggles of marginalized communities. It also reflects the deep anger of being forced into these positions—a frustration that fuels the fight for liberation.Website: joyadeola.format.com | Instagram: @_joyadeolaMiki Frances Sankhara Artist: Miki Frances Sankhara Artist BioSelected WorksI’m a Toronto-based photographer and filmmaker exploring how storytelling, interpretation, and the Anthropocene shape identity and connection. My work engages in examining affect, agency, and movement. Raised across cultures—Canadian-born, Italian-raised, of Trinidadian and Indian heritage—I’ve always been drawn to cultural hybridity. Studying Cultural History and Hermeneutics at York University deepened my interest in historical narrative and agency. Whether exploring a personal narrative, a cultural phenomenon, or a myth, my work operates within a realm of magical realism—seeking to reveal the entangled relationships between people, objects, and their environments they inhabit.The work embodies a state of deep, pensive reflection—an introspective response to the ways stratification and exclusion unfold. Anger is essential; it affirms self-worth and signals the intolerability of inequity. Yet, the role of those who witness and experience these structures is not only to recognize them but also to refine their own vision—to ensure that anger does not harden into distortion, narrowing perception or fraying the connection between creative energy and personal agency. The work does not reject anger but considers its transformation—the process by which its message is refined into something generative. A meditational space is where the emotional force of the work resides. Website: mikifrances.com | Instagram: @mikifrances Ila Lovelace Artist: Ila Lovelace Artist Bioe‘Devil Series’ acrylic on canvas, 24x36 inches Ila Lovelace is a multidisciplinary, Trinidadian artist currently studying Fine arts at OCAD University. As a white passing, mixed race, young woman, much of Lovelace’s work focuses on personal and Caribbean identity through studies of post-colonialism, colorism, Carnival and self. One of Lovelace’s goals is to explore spaces for people who look and feel like she does. Lovelace’s work has been shown at PAMA in the Caribbean art exhibit “When Night Stirred At Sea”, and at the AFTT art exhibition. She has also had publications of her work in the Toronto Caribbean Newspaper.These works look at Trinidadian Carnival as it relates to identity. ‘Devil Series’ is an exploration into the rebellion and resistance of Caribbean people as seen through the traditional devil character. It also embodies what it means to be Trinidadian/Caribbean; its courage, wit, energy, resilience. I played on the colors of the Trinidadian flag, substituting the red, white and black with the three primary colors and their tints. Each pose connects to the other; the black devil’s finger leads to the tip of the blue devil’s pitchfork, whose tail leads to the end of the red devil’s pitchfork; a further unifying trait.Instagram: @ilaa_annaRichard Ashman Artist: Richard Ashman Artist BioSmileRichard Ashman lives and works on the traditional territory of many First Nations, Tkaronto. His work reimagines subtleties of common experience though lens-based mediums. "Smile" is an unearthing and re-routing of harboured destructive energy within the Black body, particularly in marginalized spaces. This project uses portraiture to visualize a moment of overcoming, as well as the fight to get there, and a moment of being down and out. The social infrastructure--schools, parks, community centres--for BIPOC and lowincome communities are not traditionally designed with wellness and growth in mind. This project is inspired by the shared experience of the Black diaspora on the lack of positive spaces for growth during their formative years and beyond. Instagram: @r_h_c_a | Headshot Credit: Bethlehem Behailu'''
