title = "Event Calendar — Sankofa Square (formerly Yonge-Dundas Square)"
description = "February 14 to March 16 |  Noon to 11 PM DailyWander through a glowing constellation of stars and discover the stories behind the seven sisters of the Pleiades myth. Let synchronized soundscapes guide your journey through this celestial theatre. This experience is perfect for families, couples, and anyone looking to immerse themselves in the magic of the cosmos. Don’t miss your chance to explore this unique fusion of art and mythology—it's an event like no other.Learn More"
full_description = "Feb 14 to Mar 16 Celestia by Kleis Fri, Feb 14, 2025 12:00 PM 12:00 Sun, Mar 16, 2025 11:00 PM 23:00 Google Calendar ICS February 14 to March 16 | Noon to 11 PM DailyWander through a glowing constellation of stars and discover the stories behind the seven sisters of the Pleiades myth. Let synchronized soundscapes guide your journey through this celestial theatre. This experience is perfect for families, couples, and anyone looking to immerse themselves in the magic of the cosmos. Don’t miss your chance to explore this unique fusion of art and mythology—it's an event like no other.Learn More View Event → Feb 14 6:00 PM18:00 Celestia by kleis- OPENING NIGHT! Friday, February 14, 2025 6:00 PM 10:00 PM 18:00 22:00 Google Calendar ICS February 14 | 6 PM to 10 PMLight up your Valentine's Day with something magical! Come experience the grand opening of Celestia by kleis—an enchanting evening of free art and music at Sankofa Square! Experience an incredible lineup of live performances featuring Toronto and London-Ontario-based musical artists Junko Daydream, Tara Kannangara, Lady Pista, NESS, Rosina B. Solomon, and Tyrone Traher.Plus, free hot chocolate and churros while supplies last.SCHEDULE*6:00 PM Celestia opens6:10 PM Lady Pista6:50 PM Tara Kannangara7:30 PM NESS8:10 PM Rosina B. Solomon8:50 PM Tyrone Traher (formerly known as Paris Monroe)9:30 PM Junko Daydream*subject to change View Event → Feb 14 4:00 PM16:00 ILLUMINITE CONNECTIONS: An Evening of Art, Light, and Cultural Storytelling Friday, February 14, 2025 4:00 PM 5:30 PM 16:00 17:30 Google Calendar ICS February 14 | 4:00 PM to 5:30 PMVisit ILLUMINITE CONNECTIONS for a special evening at the DMZ Sandbox at Toronto Metropolitan University. Explore the intersection of light, technology, and cultural storytelling. This artist talk showcases innovative creators who transform public spaces into immersive experiences of light and connection. The event starts with an artist talk showcasing innovative creators who transform public spaces into immersive experiences of light and connection. Featured artists Jordan Shaw, Nyle Miigizi Johnston, Sandrine Thériault, and Matthew Jones will share insights into their installations currently lighting up ILLUMINITE in downtown Toronto. Following the artist talk, attendees will have the opportunity to join a guided tour of the ILLUMINITE featured installations. Experience firsthand how these illuminated spaces transform as day turns to night, creating magical environments that invite exploration and wonder.Admission is free. Register at addevent.com View Event →"
