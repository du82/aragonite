["https://ydsquare.ca/plan-your-visit"]
title = "PLAN YOUR VISIT — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "AccessibilitySankofa Square is a fully accessible public venue and we proudly welcome individuals and groups of all abilities. We have accessible washrooms located on the P1 Level as well as ramps on the north-east entrance of the Square. General Venue Guidelines ■ BE KIND - Sankofa Square is a City-owned public square, event venue and shared space Please respect the rights, diversity, property, and safety of others while on the SquarePlease pick up after your pets on the Square■ BE RESPECTFUL - Help keep the Square clean, comfortable, and enjoyable for all patronsDo not smoke while on the SquareDo not damage, steal, or misuse Square property and/or equipment Do not dump any garbage on the Square or surrounding areas■ BE SAFE - Please keep your belongings safe and close at all timesSkateboards, e-scooters, and bicycles are prohibited on the SquarePlease do not camp on the Square overnight■ BE ACTIVE - Get the right permits to activate space on the SquareYou may not solicit business or engage in event activities without a permit issued by Sankofa Square How To Get Here■ BY PUBLIC TRANSIT (TTC): Take Line 1 Yonge-University subway northbound or southbound (depending on where you are) and exit at Dundas Station. For hours of operation and fare info, and maps call the TTC at (416) 393-4636 or visit www.ttc.ca ■ BY CAR: Yonge Street and Dundas Street E. are the major Toronto streets that intersect in Yonge-Dundas Square. Our address is: 1 Dundas St E, Toronto, ON.■ PARKING: Sankofa Square is constructed on top of a 250-space parking facility operated by the Toronto Parking Authority. The entrance to the parking garage is located at the corner of Victoria Street and Dundas Streets, and is also accessible by elevator on the north side of the Square. Venue Features Free public Wi-FiConcert stageOn-site security Seasonal fountain Indoor accessible washrooms: April - September 7am-9pm, October - March 7am-7pmLocated a short distance to the CF Toronto Eaton Centre, Toronto Metropolitan University, CAA Ed Mirvish Theatre, Little Canada and Massey Hall For information on the Square’s booking policies regarding filming, drones, protests, and other questions, please visit our FAQ."
