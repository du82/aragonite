["https://www.ydsquare.ca/drone-policy"]
title = "Drone Policy — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "DRONES / REMOTE OPERATED AIRCRAFT POLICYYonge Dundas Square is within controlled airspace in the downtown of Toronto. It is in close proximity to medical helicopter landing pads and Billy Bishop Airport. Flight authorization is a must have.Requests to operate a Remotely Piloted Aircraft System (eg; Drones, UAV, UAS, etc) must be submitted to your Yonge-Dundas Square Representative at least 30 days prior to your event move-in or location filming. An activation permit is required. All requests will be reviewed by the YDS Management Team. Approval of requests are at the discretion of the Yonge-Dundas Square Board of Management.All requests must be received in writing and be accompanied by the following:Federal Pilot License – The operator must provide a valid copy of their Pilot License with Advanced Operations rating, issued by Transport Canada.Flight Authorization – The operator must submit an approved NAV Drone Operation Authorization Request Report, issued by NAV Canada. Applications can be made at (https://portal.navdrone.ca/)Liability Insurance – The operator must provide a valid certificate of insurance specific to Unmanned Aerial Vehicle / Drone liability in a minimum amount of $2,000,000, separate from the licensee’s general liability insurance requirement. The certificate shall list the Yonge-Dundas Square Board of Management and the City of Toronto as additional insured.Note: The Licensee is the party holding a license, event permit or lease agreement with Yonge-Dundas Square, whereas The Operator is the person, company, third party, or media firm piloting and responsible for the aircraft system at Yonge-Dundas Square. When the licensee and operator are the same entity, the separate insurance certificate is still required.You will receive written confirmation once the request is approved.All of the above-mentioned documents must be carried by the Operator while they are on location at Yonge-Dundas Square and adjacent areas to be permitted on-site.PDF Version of Drone Policy"
year_published = 2024
year_updated = 2024
