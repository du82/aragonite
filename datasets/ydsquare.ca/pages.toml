["https://ydsquare.ca/dazzling-days"]
title = "Dazzling Days by Yasaman Merhsa — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = '''DAZZLING DAYS Sankofa Square (at the time, Yonge-Dundas Square) launched a Call to Artists in March 2023 to wrap 10 public waste bins in partnership with Mural Routes.ABOUT THE ARTISTYASAMAN MEHRSAYasaman Mehrsa is a Toronto-based visual artist with a focus on public art. Born and raised in Tehran/Iran, she got exposed to art from a young age. She completed her studies with a Bachelor of Visual Communication in Iran and later achieved Bachelor with honours in Visual Arts from Brock University in St. Catharines/Canada. Yasaman uses both digital and traditional mediums. She works on a wide variety of projects including painting, illustration, murals, and community art. Yasaman's work is illustrative, storytelling and whimsical. Her work is representative of awareness of the human-nature relationship. Inspired by nature, she creates vibrant artworks and expresses different emotions to inspire her audiences to discover their imagination, feeling, and interaction with the natural environment. She has worked on various public art projects for organizations and communities inside and outside Canada since 2018. Yasaman Mehrsa Dazzling Days (Proof) by Yasaman Mehrsa DAZZLING DAYSInspired by the Sankofa Square environment, this piece is the representation of community, togetherness, and vibrancy through depicting nature. The dreamy combination and the vibrancy of trees, plants, birds, buildings, and the sky have created a fun and eye-catching design to encourage the public to use the garbage and recycle bins and keep the environment clean. This welcoming design will engage and invites the viewers to interact with the art and absorb positive energy and will evoke an experience of being present at the moment while passing by. <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1687270137221-JRJM65XCK0QYBXRALZ87/Bin+Pic2.jpg" alt="Dazzling Days" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1687270138817-8PIA94WAGLTDJIB5YY2A/Bin+Pic5.jpg" alt="Dazzling Days" /> #block-yui_3_17_2_1_1687270098338_6594 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1687270098338_6594 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } MURAL ROUTESMural Routes activates communities by facilitating the creation of responsive, collaborative murals, and provides opportunities to build and advance careers in mural art.'''
