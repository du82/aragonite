["https://www.ydsquare.ca/digital-signage"]
title = "DIGITAL SIGNAGE — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "DIGITAL SIGNAGE The digital signage capabilities of Sankofa Square are of great benefit to the downtown community, visitors to the Square, and event attendees. Having permanent digital screens dedicated to events allows for affordable use of this technology by all Sankofa Square clients, elevating the standards and possibilities of all events and activations. These screens are also essential to Sankofa Square when events are not being staged, allowing for the display of visitor information, public art, video projects, collaborations with other city organizations and acknowledgment of Sankofa Square sponsors. In keeping with the Square’s focus on the community, advertising is not sold for display on these screens. All digital content must adhere to the Sankofa Square Display Policy.For information on how to use the Sankofa Square digital screens for your event, please contact your event coordinator. For information on how to book space on the digital screens managed by Outedge Media, please contact them directly."
