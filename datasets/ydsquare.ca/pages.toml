["https://ydsquare.ca/bhm2023"]
title = "Black History Month 2023 — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "OCAD U Yonge-Dundas Square Black History Month Digital Exhibition February 1 to 28, 2023, on the digital screens Yonge-Dundas Square and the Centre for Emerging Artists & Designers were happy to announce Sofia Reyes, Pixel Heller, and Steve Williams Jnr. as the recipients of the Black History Month Digital Exhibition Curator Career Launcher. This exhibition opportunity invited 3 artists from the OCAD U community to exhibit their work on our five (5) digital screens for the duration of Black History Month in February 2023, reflecting on what role artists can play in the city’s public spaces. About the Artists: Artist: Steve William Jnr. Sofia ReyesSofia Reyes is an Afro-Latinx Panamanian illustrator, comic artist, and designer, currently residing in Toronto, ON. Their work focuses on the intersectionality of identity as described through fantastical story-telling and colour. Artist: Pixel Heller Photo by Tizzi Tan Dreams In VantablackFebruary 1 to 28, 2023 Dreams in Vantablack was an animated poetry series featuring the work of Black youth, revealing their truths through evocative poetry with rotoscope and 2D animation styles. Watch the whole series on CBC Gem. CREDITS Written & Directed: Ian Keteku Producers: Sherien Barsoum (Taza Media), Ian Keteku (Alkebulan Pictures) Animation Producer: Trever Stewart Art Director: Gavin Ball Rotoscope Artist: Greg Doble Produced with the Financial Participation of: Shaw Rocket Fund Canada Media Fund Dreams in Vantablack acknowledges the support of the Canada Council for the Arts. Steve Williams Jnr.21-year-old Steve Williams Jnr, is a Ghanaian creative who has managed to tap into the fullness of his artistry. The intentionality behind his creative expression has made him a storyteller, telling beautiful stories from his own experiences and the stories of others. Artist: Sofia Reyes Pixel HellerThis is my symbol. I’m not an artist. I’m an explorer. Art just happens to be my medium for discovery and empowerment. When I created these masks in search of my identity, I found my home, interwoven within Caribbean roots. These masks represent protection for my culture and my people. Photo by Tizzy Tan Photo by Tizzy Tan ABOUT THE ANIMATIONS: I SPY Writer: Jenn Kasiama Animator: Dorielle Retemyer --------------------------------------------------------------------- ADVICE Writer: Eva Anthony Animator: Bogdan Anifrani --------------------------------------------------------------------- SUPAFLY Writer: Christian Markland Animator: Gavin Ball"
