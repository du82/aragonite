["https://ydsquare.ca/becoming-sankofa-square"]
title = "Becoming Sankofa Square — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "Becoming Sankofa SquareOn December 14, 2023, the City of Toronto announced that Toronto City Council adopted a motion to change the name of Yonge-Dundas Square to Sankofa Square. The name Sankofa is the result of two years of careful work by the City of Toronto convened Recognition Review Community Advisory Committee (CAC), whose conversations were informed by consultations with the public. The 20-member CAC was made up of Black and Indigenous leaders, along with other diverse residents and business owners living and working along Dundas Street.Latest News: Findings from the Sankofa Square Community Research Study On January 29, 2025, Sankofa Square released the findings of the first phase of its rebranding strategy. The first-ever extensive community research study was commissioned by D.PE Agency, Sankofa Square’s branding agency of record, and conducted through Pitch Better. The community insights provide a roadmap for the redevelopment of the Sankofa Square brand.DOWNLOADSankofa Square Community Research Study: Public Consultations and Insights on the Rebranding of Yonge-Dundas Square to Sankofa Square What’s NextSankofa Square will unveil its new brand logo and signage in early 2025. Sankofa Square aspires to be a beacon of inclusion and cultural vibrancy. Insights from the Community Research Study are being incorporated into the upcoming development of a new strategic plan for the Square, focusing on enhancing accessibility and representation, promoting community engagement, and developing a sustainable financial model. To stay informed of what’s next for the Square, please subscribe to our newsletter or email us at info@ydsquare.ca. About SankofaSankofa (SAHN-koh-fah) is a Twi word from the Akan Tribe of Ghana that loosely translates to, “go back and get it.” Its literal translation comes from the Akan proverb, “Se wo were fi na wosan kofa a yenkyiri,” meaning, “It is not taboo to go back for what you forgot (or left behind).” Sankofa is a phrase that encourages learning from the past to inform the future. While Sankofa originates from the Ghanaian Akan language, it broadly resonates across African and Black communities globally as an expression of cultural and political affirmation. There are two different symbols that both represent Sankofa: The Mythical Sankofa BirdThe more popular image is the bird with its backward gaze signifying reflection, while its forward-facing feet represent progress. The egg in its beak symbolizes growth and future generations—an inheritance shaped by lessons from our past.The Stylized HeartThe Sankofa heart is more like the conventional symbol for the heart with inward spirals at the top and outward spiral at the bottom.Each of these symbols represent a society’s journey of progressing toward a positive future by being guided by its past. Sankofa is a timeless concept that transcends borders, cultures, and generations.Sankofa icon examples: Sankofa bird from Symbolikon and Sankofa heart from CleanPNG."
