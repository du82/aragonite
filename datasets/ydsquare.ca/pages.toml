title = "Sankofa Square (formerly Yonge-Dundas Square)"
description = """
Yonge-Dundas Square is a 1 acre outdoor public and event space at the 
intersection of Yonge Street and Dundas Street in Toronto Canada."""
full_description = '''Scroll <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1730842047662-YFKXSOTNWMX9PQ77OCJ8/What%27s+On+at+the+Square+%28Banner%29+.png" alt="Banner image for Yonge-Dundas Square homepage with diverse individuals looking up at large digital screens, featuring text 'what’s on at the square' and 'subscribe to our newsletter'" /> Latest News: Findings from the Sankofa Square Community Research Study We’re undergoing a transformationWe’re officially Sankofa Square and are actively working on developing our new brand identity. We’re also laying the groundwork for the Square’s future role in the community. During this time, you may notice elements of our old and transitional branding co-existing. Please bear with us as we work to bring our vision to life. Visit the Becoming Sankofa Square section of our website for the latest news. WELCOME Sankofa Square (formerly Yonge-Dundas Square) is a bustling gathering place for millions of visitors each year. Established in 2004, the Square hosts hundreds of diverse events including community-based festivals, concerts, public art, and commercial experiences. The Square is an open space that welcomes everyone. It is managed by the Sankofa Square Board of Management, a City of Toronto agency. Plan Your Visit about us Book The Square Event Calendar Follow us on Instagram @sankofasquare <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1733243881668-D6YNMPUQ8ERYGXO0F6WM/image-asset.jpeg" alt="2 Days to Go: Are You Ready for Winter Glow? The countdown is on! ❄️✨ Get ready for 18 days of holiday cheer with dazzling lights, thrilling carnival rides, live entertainment, tasty treats, and so much more! Event Details: 🗓: December 5-22, 2024 " /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1733101232167-2N8G11LG526MG84ZJ2C3/image-asset.jpeg" alt="Winter is coming ❄️ 📷: @ideasandlight #SankofaSquare #SnowFall #Repost" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1732587436989-DYE4SQ7H0BPBUFQO5GGC/image-asset.jpeg" alt="Throwback to all the incredible vibes from ParTAY at the Square 🎤✨ 📷: @silentjae #SankofaSquare #parTAYAtTheSquare #Throwback" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1732048362739-4NLVCT5KMUKGRH8YU07G/image-asset.jpeg" alt="Last Friday, November 15, we kicked off the first session of parTAY @ The Square, and what a turnout it was! It was incredible to see Swifties singing their hearts out to Tay-Tay's biggest hits on stage. The energy was electric, and the fun didn't st" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1731957601101-IQ9W503ZA7T9X5PG621K/image-asset.jpeg" alt="Turn your game mode on and enjoy limitless fun at PlayStation&amp;rsquo;s #PlayHasNoLimits 💪 This cool and interactive game by PlayStation is free to play at the Square on alternate days from November 16 to December 1 🎮 Try it out and get a chance to " /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1731626801067-V1QNVAEWPC0NLD0DSW2C/image-asset.jpeg" alt="#HappeningNow at the Square: Embrace the festive scent of the holidays at the Yankee Candle Village! Indeed, #JoySparksHere at the Square, thanks to the cozy fragrances of Yankee Candle&amp;rsquo;s holiday collection ❤️ The pop-up is open today until 7" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1731351505368-1ZU7F9NHIBO49C34KORM/image-asset.jpeg" alt="🇨🇦 Remembrance Day Ceremony at The Square Today at 11:00 AM, we came together at The Square for a solemn Moment of Silence, honouring the courage and sacrifices of Canada&amp;rsquo;s heroes. The moving sound of &amp;ldquo;The Lament&amp;rdquo; on bagpipes fil" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1731297459093-A5B1KQDFW218CV4GFCW7/image-asset.jpeg" alt="📢 What's On At The Square This Week:⁠ ⁠ ◼️ Mobile Yankee Candle Village⁠ 🗓️ Thursday, Nov 14 | 9 AM - 7 PM⁠ ⁠ Visit the Mobile @yankeecandle Candle Village to find your favourite fragrance &amp;ndash; and you might just get to take home a candle of you" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1731010145093-26MY3Q76Q8LDOGNPVPU5/image-asset.jpeg" alt="Join us for Remembrance Day Commemoration Events with @downtownyonge 🏵️ Remembrance Day Ceremony at The Square 🗓️ Saturday, November 11 🕚 11:00 AM Join us at The Square for a Moment of Silence and the poignant playing of &amp;ldquo;The Lament&amp;rdquo;" /> #block-yui_3_17_2_1_1706176226311_4315 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1706176226311_4315 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Home Vision + Campaigns Mission Sec Home Annual Report Specific Images Home Impact Instagram'''
