title = "Winter Glow — Sankofa Square (formerly Yonge-Dundas Square)"
description = """
Ride the 45ft tall Ferris Wheel and the Great Canadian Carousel. Play a 
midway game and indulge in a variety of carnival treats, including cotton 
candy, popcorn, candy apples, churros, hot chocolate, and more. See The 
Rotary Club of Toronto’s 40ft tall Tree of Remembrance."""
full_description = '''Winter Glow continues until December 22. Don’t miss it!HoursMonday to Friday: 4pm to 10pmSaturday & Sunday: noon to 10pm Experience the magic of the holiday season at Sankofa Square with Winter Glow. This festive event brings dazzling lights, carnival rides, games, and entertainment to the heart of Toronto.For more details on daily programming, visit our event calendar. Candlelight: A Winter Solstice ConcertGrab a cup of hot chocolate and join us Saturday, December 21 from 9pm to 10pm at Winter Glow for a FREE Candlelight concert, a performance by Listeso String Quartet that will illuminate Sankofa Square with Christmas classics and melodies. Carnival Rides & TreatsRide the 45ft tall Ferris Wheel, the Great Canadian Carousel and Teacups. Each ride is one ticket. Ride Tickets$6 for a single ticket$20 for 4 tickets ($5 per ticket)$37 for 8 tickets ($4.63 per ticket)Play midway games and indulge in a variety of carnival treats, including mini donuts, hot chocolate, and more. BUY Tickets in Advance Tree of RemembranceDonate to get a yellow ribbon to write a message to a loved one and attach it to the tree. The Rotary Club of Toronto’s 30ft Tree of Remembrance is a fundraising initiative that supports local charities through The Rotary Club of Toronto and its Foundation. Chevrolet Silverado and GM EV ExperienceGM Canada is showcasing its electric lineup at Toronto’s Winter Glow holiday event, with the Chevrolet Silverado EV illuminating The Rotary Club of Toronto’s 30-foot Tree of Remembrance. Opening day features include the GMC HUMMER EV, Cadillac LYRIQ, and Chevrolet Equinox EV, along with festive décor, branded EV-themed giveaways, and the chance to meet OnStar Santa. Attendees can explore vehicle capabilities, register for test drives, and engage with OnStar promotions, all while experiencing GM’s electric innovation. Music & EntertainmentTraditional and contemporary holiday hits will be streamed on to the Square thanks to music provided by Chevrolet Silverado EV partner SiriusXM. Keep an eye out for updates on our entertainment schedule, including buskers, holiday carolers, and other entertainment surprises throughout Winter Glow. Special DatesOpening NightThursday, December 5Let’s light it up! Join us for a dazzling opening night kick-off as we light up Winter Glow! Watch as the Chevrolet Silverado EV starts up and electrifies the holiday season, illuminating The Rotary Club of Toronto’s Tree of Remembrance. Enjoy a special performance by St. Michael’s Choir School and exciting giveaways. Don’t miss this unforgettable night of holiday cheer!Student NightTuesday, December 10 Calling all students! Join Winter Glow’s Student Night on Tuesday, December 10 for a night of fun and excitement. Students will enjoy discounted rides, games, food, and beverages with their Student ID. Dance the night away to a special guest DJ, capture unforgettable moments with friends, and experience the magic of the season.Family WeekendFriday, December 13 to Sunday, December 15Bring the whole family to Winter Glow’s Family Weekend for a magical holiday experience! Enjoy special family-friendly activities, live performances, and other surprises. Families will enjoy discounted rides, games, food, and beverages. Create lasting memories together among the dazzling lights, carnival rides, and delicious treats. Family Weekend is sponsored by BMO (Eaton Centre Branch) and The Thornton-Smith Corporation.Candlelight Winter Solstice ConcertSaturday, December 21 from 9pm to 10pmGrab a cup of hot chocolate and join us at Winter Glow for a FREE Candlelight concert, a performance by Listeso String Quartet that will illuminate Sankofa Square with Christmas classics and Winter Solstice melodies. Let the warmth of the music and the soft glow of candlelight guide you through the Winter Solstice, a time of renewal and hope.Brand Experiences, Pop-ups & GiveawaysThroughout Winter Glow, a rotating showcase of brand experiences and product sampling pop-ups will add to the festive fun. This year, SHEIN is bringing holiday cheer to Winter Glow with a festive pop-up experience you won't want to miss! Stop by Thursday to Sunday during the opening weekend to check out SHEIN’s larger-than-life Box Santa and get in the holiday spirit. Snap a photo with Santa, tag #SHEINboxsanta, and claim a free gift while supplies last. Follow us for moreThere will be other surprises throughout Winter Glow, so make sure to subscribe to our newsletter and follow the hashtag #WinterGlowTO across all social media platforms. Share the GlowDon’t miss the free Winter Glow 360° Photo booth on Opening Night. Make sure to tag us on your socials with #WinterGlowTO and #SankofaSquare <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702674665589-SM862ACDYADNELZLIIVD/DSC04732.jpg" alt="Winter glow (Copy)" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702674686522-27UOJU9DIJGSKLXE1GPF/DSC04451.jpg" alt="DSC04451.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702675216597-KUB0F9001SPCTH4UQGJG/DSC04708.jpg" alt="DSC04708.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702674808864-0O4ZG8JHWKAMF3XV8UF0/DSC04225.jpg" alt="DSC04225.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702675313946-ZLHLR4HLNW10ZSQUXOJY/DSC04628.jpg" alt="DSC04628.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702675115389-ZKE445SKWSVPNCNRRQ88/DSC04314.jpg" alt="DSC04314.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702675023705-PRGLOCGIFGPLA84613FX/DSC04673.jpg" alt="DSC04673.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1702675175378-4HSG4QE7EJE249RCR6VX/DSC04513.jpg" alt="DSC04513.jpg" /> #block-33ac47d5b971d2c55521 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-33ac47d5b971d2c55521 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Winter Glow is produced by Sankofa Square in partnership with The Thornton-Smith Corporation, Astro Amusements, and The Rotary Club of Toronto. Winter Glow Sponsored by: Chevrolet Silverado EV Family Weekend Sponsored by: BMO Eaton Centre Branch and Thornton-Smith CorporationCommunity Supporters: Downtown Yonge BIA and Barberian's Steak House #block-64cc95c5c2b109d355bd .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }'''
