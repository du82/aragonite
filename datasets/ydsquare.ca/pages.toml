title = "Manager of Security & Safety - Full Time — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "Job Posting–February 10, 2025Manager of Security & SafetyPosition Type: Full-Time Location: 2 Carlton St., Toronto, ON Start Date: April, 2025Salary Range: $75,000-$85,000 depending on experience (plus health & pension benefits after qualifying period)Vacation: 15 days per year, plus three personal daysApplication Deadline: Friday, March 7, 2025, at 12:00pm *Interviews to be held week of March 17thOverviewSankofa Square is a 1-acre public square and event venue in Downtown Toronto. The Manager of Security & Safety will be a key member of the senior Management team and works in collaboration with colleagues across the organization, as well as with public, private, and nonprofit partners in community efforts around public safety and security.The purpose of this role is to ensure that the staff, contractors and event clients for Sankofa Square are working within an environment consistent with accepted minimum safety and security standards. This encompasses the development of security plans and of mainstreaming the individual and collective sense of security and safety awareness and responsibility. It also consists of advising the General Manager on security challenges, developing risk assessments and proposing risk reduction measures in addition to developing, maintaining, updating and implementing, when necessary, security protocols and operating procedures according to the changing situation.This position reports to the General Manager, working alongside three other department managers. The Manager of Security & Safety will be required to report to the Board of Management in the form of board reports and attendance at Board Meetings. This position does not have any direct reports, however, oversight and supervision of third-party contracted staff will be required.Responsibilities and TasksPreventionFoster a culture of safety and security within the mandate of the Square.Integrate security planning into daily operations, events, and future initiatives.Conduct risk assessments, onsite event evaluations, and regular safety reviews.Ensure compliance with all relevant safety and security policies and standards.Regularly update security plans, including threat assessments, protocols, SOPs, and asset protection.Incorporate safety and security considerations, including budget, into all operations.Ensure staff can identify health risks, prevent illness and injury, and access medical support.Secure office premises and assets through appropriate measures (e.g., guards, locks, alarms).Build partnerships with local stakeholders to enhance security and support the Square’s role as a public plaza.Represent the Square and collaborate with Toronto Police, Corporate Security, community groups, and other stakeholders on all safety and security matters.Share safety updates with staff and provide a platform for concerns.Ensure timely reporting and follow-up on incidents.Provide staff training and ensure access to necessary security equipment.Be the management representative on the Joint Health & Safety Committee.Include safety and security considerations in all operational plans and budgets.Ensure that all incoming Event Clients receive a security briefing and information.Enforce safety and security standards, including disciplinary action when necessary.ReactionEstablish crisis management structures and contingency plans for emergencies (accidents, severe injuries, vandalism, etc.).Train staff on emergency response procedures and conduct regular drills.Review and maintain the Emergency Management Action Plan, including relocation and evacuation procedures.Recovery & Resumption of OperationsImplement post-incident counseling and recovery plans.Ensure continuity of critical operations, including alternate work sites and remote procedures.Qualifications & CompetenciesCore CompetenciesLeadership & Collaboration: Ability to work independently and as part of a team, supporting staff and contractors. Must also be able to work within the local community in a sensitive and participatory manner.Communication: Excellent written and oral communication skills. Able to communicate clearly and sensitively with internal and external stakeholders as a representative of Sankofa Square. This may include effective negotiation and representation skills.Integrity & Resilience: Works with trustworthiness and integrity and has a clear commitment to both Sankofa Square and the City of Toronto core values and human centred principles. Ability to operate effectively under extreme circumstances including stress, security risks and weather conditions.Awareness & Sensitivity: Demonstrates awareness and sensitivity to gender and diversity. Have experience and the ability to live and work in diverse cultural contexts in a culturally appropriate manner. Has a capacity to make accurate self-assessment particularly in high stress and high security contexts.QualificationsDegree/diploma/certificate in Law Enforcement, Health & Safety, or Emergency Management (or equivalent experience).5+ years of experience in security, law enforcement, would be desirable but is not mandatory.Qualifications and demonstrated experience in professional security/safety fields and which may include:Understanding of complex social issues and systemic intricacies that affect community safety with a focus on removing barriers and addressing root causesExperience with Event Security, including outdoor festivals and concerts is an asset.Experience and familiarity with conflict resolution and de-escalation.Familiarity with security-related authorities, including the Trespass to Property Act, and relevant sections of the Criminal Code of Canada.Current certification in standard First Aid/CPR, and Narcan administrationDemonstrate excellent knowledge of public safety procedures, security protocols, emergency managementPractical knowledge of security and fire/life safety systems, including portable radios, CCTV, and access control systems.The Workplace:This role will work standard business hours, typically 35 hours per week, with some evenings and weekends to support Sankofa Square events/programming. Please note that this is a HYBRID position, meaning staff may be required to work remotely/from home, and in-office/onsite at Sankofa Square. As such, candidates must be located in or around Toronto, Ontario and have easy access to our location in Downtown Toronto. A laptop computer will be provided.Application:Completed applications should be emailed to: employment@sankofasquare.caThe email should have the subject line: Application for Manager of Security & Safety & YOUR NAMEPlease include in a single PDF document an attachment to your email, with your resume and a cover letter explaining why you wish to join the Sankofa Square team.Please note: Sankofa Square is an equal-opportunity employer which values diversity in the workplace. We are therefore happy to accommodate individual needs in keeping with the Ontario Human Rights Code and the Accessibility for Ontarians with Disabilities Act. If you require accommodation in order to work at Sankofa Square, please let us know.Sankofa Square is committed to a positive and supportive environment that promotes equity and diversity. Priority will be given to persons from indigenous or visible minorities, persons with disabilities, newcomers to Canada (within the past 5 years) or those for whom this opportunity would further their understanding of the public realm.Last update: February 10-2025"
