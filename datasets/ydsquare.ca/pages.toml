["https://ydsquare.ca/frequently-asked-questions"]
title = "FAQs — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "Frequently Asked Questions Booking the Square & FeesHow much does it cost to do an event at the Square?﻿It depends what you want to do! Aside from the fixed permit fee amount, everything else depends on how long your event is, what you’re planning (as that helps dictates staffing levels), how much has to be set up, what equipment is being used etc. YDS staff cannot do estimates over the phone, nor can we give estimates for events that haven’t applied for a date at the Square. Once we’ve found a date for you, your Event Coordinator will help prepare an estimate for you. Can I book the Square for a half day rental?﻿At this time the Square does not offer discounted permit fee rates for half day use of the Square, but if your event is only 10am to 2pm, you can still book the Square (you just have to pay the full permit fee rate). What information do I need to put in my application form? What if I don’t know the details of my event yet?Please be as detailed as possible in your application so it is clear what the general idea is. Bookings are not first come first served, so include as much info as possible so we know what you’re looking to do. We will need the concept and basic details of the proposed event before we will allocate a date.Provide as much flexibility as possible in the dates as possible, you can use the Notes field to add more dates or info about dates if you need to. Having some flexibility makes it easier for us to find a date in the calendar for your event. It is not necessary for the start and end times to be exact, a guesstimate is fine.Why does your calendar make it look like a date is available, but then I’m told that it’s not?﻿Our online calendar is kept as up to date as possible. However there are many reasons why we may have to wait to post an event online, it may be that the event host has requested it be confidential until they’re ready to launch or send out press releases, or we may be waiting for a little more information from the event. We apologize for any inconvenience. Engagements & CelebrationsCan I propose to my partner on the Square? Can I have engagement photos taken?﻿If you are planning a simple down on one knee sort of proposal then of course! If you are looking for something dramatic, involving props or a cast of many people, then you would need to book the Square as if you were doing an event (which you are!), as it may impede our event executions. If it's just you, your partner and a ring then that's no problem. Personal photographs are allowed to be taken in the Square, but you have to work around the events and the general public, you can't section off an area or impede the activities of the Square. If you need props or lighting equipment (etc) then you will need to book the Square for a photo shoot (there are costs associated). For more information on photography and film shoots, please click here. Photography & FilmingCan I come on site to photograph/film something?﻿As the Square is a public space, personal photographs and videos are fair game! For Commercial photography and film or video shoots, an activation permit must be obtained. This includes anything that has a “set-up” or could impede day-to-day activities on the Square or possibly an activation/event. View this link for more information.News teams, weather reporting, and all other forms of ENG (Electronic News Gathering) do not require a permit. If you are interested in coming on site for a reason like this please contact info@ydsquare.ca to discuss availability and ease of access.Are the use of drones or remote operated aircrafts permissible in the Square?Yonge-Dundas Square is within controlled airspace in the downtown of Toronto. It is in close proximity to medical helicopter landing pads and Billy Bishop Airport. Flight authorization is a must have. Requests to operate a Remotely Piloted Aircraft System (eg; Drones, UAV, UAS, etc.) must be submitted to your Yonge-Dundas Square Representative at least 30 days prior to your event move-in or location filming. All requests will be reviewed by the YDS Management Team. Approval of requests are at the discretion of the Yonge-Dundas Square Board of Management. For more more information and links to the required documents, refer to the Yonge-Dundas Square Drones/Remote Operated Aircraft Policy. Promotions & AdvertisingCan I hand out samples or do promotions on the sidewalk surrounding the Square?﻿No. The City of Toronto Bylaws prohibit commercial activity from being conducted on any of the sidewalks surrounding the Square. Do I need a permit to hand out promo samples/ do a flashmob/ sell charity ribbons?﻿Yes. The Bylaws of the Square prohibit any commercial activity, performances, sporting displays, displaying exhibits (etc) without a permit. Even if the activity is only short (such as a 5 minute flashmob), the activity requires a permit.Do you have demographics and traffic information?Yes! Click here.How do I get access to the Digital Screens around the Square?﻿In 2017, we introduced 10 new screens in the Square. For more information regarding screen usage, click here. YDS does not control the billboards surrounding the Square. For the contact information of surrounding billboard and digital advertising operators, you can find more information here - neighbouring sign operators. Protests, Demonstrations & RalliesAre there policies regarding protests, demonstrations or rallies on the Square? Yes. Yonge-Dundas Square is an outdoor public space, and members of the public have the right to gather. Protests/demonstrations are ONLY welcomed when YDS is not previously permitted by another organization and must follow related rules and regulations. All requests to utilize the Square for a protest, demonstration or rally should be directed to info@ydsquare.ca for approval, and a Notice of Demonstration should be sent to Toronto Police Service. You may obtain a Police form through this link."
