title = "PRIVACY POLICY — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "PRIVACY POLICY Your privacy is important to Yonge-Dundas Square. This privacy statement provides information about the personal information that Yonge-Dundas Square collects, and the ways in which Yonge-Dundas Square uses that personal information.Personal information collectionYonge-Dundas Square may collect and use the following kinds of personal information: information that you provide using for the purpose of registering with the website; information that you provide for the purpose of subscribing to the website services including our newsletter; and any other information that you send to Yonge-Dundas Square.Using personal informationYonge-Dundas Square may use your personal information to: administer this website personalize the website for you; enable your access to and use of the website services; send you marketing communications.Where Yonge-Dundas Square discloses your personal information to its agents or sub-contractors for these purposes, the agent or sub-contractor in question will be obligated to use that personal information in accordance with the terms of this privacy statement.In addition to the disclosures reasonably necessary for the purposes identified elsewhere above, Yonge-Dundas Square may disclose your personal information to the extent that it is required to do so by law, in connection with any legal proceedings or prospective legal proceedings, and in order to establish, exercise or defend its legal rights.Securing your dataYonge-Dundas Square will take reasonable technical and organisational precautions to prevent the loss, misuse or alteration of your personal information.Yonge-Dundas Square will store all the personal information you provide on its secure servers.Cross-border data transfersInformation that Yonge-Dundas Square collects may be stored and processed in and transferred between any of the countries in which Yonge-Dundas Square operates to enable the use of the information in accordance with this privacy policy.You agree to such cross-border transfers of personal information.Updating this statementYonge-Dundas Square may update this privacy policy by posting a new version on this website.You should check this page occasionally to ensure you are familiar with any changes.Other websitesThis website contains links to other websites.Yonge-Dundas Square is not responsible for the privacy policies or practices of any third party.Contact Yonge-Dundas SquareIf you have any questions about this privacy policy or Yonge-Dundas Square'streatment of your personal information, please write to: by email to info@ydsquare.ca"
