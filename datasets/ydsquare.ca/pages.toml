title = "BUSKERS & STREET ARTISTS — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = '''BUSKERS & STREET ARTISTSSankofa Square Busker ProgramApplications open on April 1, 2025. The program runs from May 2025 to April 2026. Tribu Music @ Busker Bash - June 11, 2023 As part of our commitment to promoting diverse forms of street performance and creating an engaging and vibrant atmosphere for visitors, we invite artistic street performers to use our space as a platform for their talents on days with no scheduled events. However, all busker performances must adhere to our performance policy to ensure the safety and enjoyment of our audiences and performers. Who can ApplyApplicants for the Sankofa Square Busking Permit must be at least 18 years old. However, those 16 and 17 years old may still apply with parental/caregiver consent. To apply, they must submit a Parental/Caregiver Permission Form along with their application.Application Requirements & How to ApplyPlease ensure you have completed all aspects of the application and signed the declaration. No money is required upon submission, as not all applications will be accepted. Please make sure that you’ll be able to provide the insurance requirements (including the type of insurance and additional insureds) should your application be successful. Please review the Busker Policy & Declaration Fill out and submit the Application Form. Once submitted, a representative from Sankofa Square will follow up.Busker Permit FeeThe Busker Permit fee is $20 + HST.How Performance Times are SelectedApproved permit holders are emailed biweekly with available dates and times. The daily schedule will be decided by a lottery with the buskers and performers who are onsite at the lottery time. Names are drawn and first name selected gets first pick of available times, the second gets the second pick, and so on. First come, first served, available on weekends and holidays between 9:00 AM to noon. For additional information, please review the busker policy (see above). SANKOFA Square only issues permits for buskers and street performers who entertain within the confines of the Square's boundary. Buskers who wish to perform on sidewalks or spaces adjacent to or across from the Square must apply for a permit through the City of Toronto.sANKOFA Square does not accept unsolicited proposals from vendors. If you are interested in being a food vendor at a third-party event, please contact the event directly. Due to confidentiality agreements, we are unable to provide contact information for our event organizers. Past Events <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1717604084852-4TJ1P6P2OQVD21E9HLXM/Busker+Bash+Instagram+Post.png" alt="Busker Bash Instagram Post.png" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1689697013540-NI585HGNBZMP6W9N7NV2/_BuskersGame+Calendar+Icon.png" alt="_BuskersGame Calendar Icon.png" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/88db51f1-67a9-4744-b918-d456622a2418/2024+Buskers+%26+Games+IG+%26+Calendar+%281%29.png" alt="2024 Buskers &amp; Games IG &amp; Calendar (1).png" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/568c649b-7a7f-408e-8ce1-b38fc5825760/2024+Buskers+%26+Games+IG+%26+Calendar.png" alt="2024 Buskers &amp; Games IG &amp; Calendar.png" /> #block-yui_3_17_2_1_1717603866319_11284 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1717603866319_11284 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } #block-yui_3_17_2_1_1685487268541_16234 .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; }'''
