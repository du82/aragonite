["https://www.ydsquare.ca/bhm2024"]
title = "Black History Month 2024 — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "OCAD U + Yonge-Dundas Square Black History Month Digital Exhibition February 1 to 29, 2024, on the digital screens Yonge-Dundas Square and the Centre for Emerging Artists & Designers are excited to announce Abby Adjekum, Dose Omoruna, Pixel Heller and Uzoma Ekpunobi as the recipients of the Black History Month Digital Exhibition Career Launcher! This exhibition opportunity invited 4 artists from the OCAD U community to exhibit their work on our five (5) digital screens for the duration of Black History Month in February 2024, responding to the theme of Celebration and their representation of Black culture. About the Artists: Artist: Abby Adjekum Dose OmorunaArtist BioDose Omoruna, a Toronto-based multimedia artist attending OCAD University, explores self-expression, storytelling, and Black culture through vibrant digital illustrations, paintings, and cinematography. Dose has showcased work in festivals and venues internationally. Currently pursuing a degree in Integrated Media, his artistic approach engages viewers through vibrancy, dynamic characters, and comedic elements.Celebration statementCelebration, for me, is a journey of growth and self-discovery, expressed through art. Through faith, culture, and self-expression, I aim to reveal my inner self and inspire viewers to do the same. My work creates a visual symphony of diverse influences, celebrating my beliefs and spiritual rhythm. The HIM series, born from a quest for artistic style, now stands as a collection of significant, archival pieces representing stages in my life, helping me appreciate my journey.Website: www.doseomoruna-portfolio.format.comInstagram: @drawn.by.dose Artist: Pixel HellerPhotographed by Tsemaye Tite Uzoma Ekpunobi Artist BioAs a documentary/portrait photographer and graphic designer, Uzoma develops her creativity towards social change in equity-deserving communities. On their journey towards reconciliation through decolonization, Uzoma creates still moments of people's relationships with their environments, themselves and an understanding of people's adaptations while trying to maintain their historical/cultural connections. CELEBRATION STATEMENTEven though my photos tend to be calm with little to no movement, the still moments of laughter, joy, connection (to people and their environment) perhaps through rituals as well as the freedom of self expression. With these blends of characteristics I find the concept of celebration at its core.Instagram: @oozomss Abby AdjekumArtist bioAbby Adjekum, an emerging Hamilton artist and curator, crafts introspective art exploring Black femininity, intimacy, and safety. Her narrative works illuminate ideas, memories, and moments, delving into emotional vulnerability and tolerance shaped by cultural identity. She attended OCAD for Drawing and Painting and has returned for Criticism and Curatorial Practice.celebration statementThis collection celebrates resilient individuals I've documented, overcoming personal obstacles and navigating life's challenges with grace. Through painting, I express gratitude and capture not just their physical likeness but the depth of character and strength of spirit. These artworks originated from a desire to overcome burnout, serving as a reminder to persist.Instagram: @abbyboy Artist: Dose Omoruna Pixel HellerArtist bio With an artistic journey intertwined with themes of Black identity, carnival masquerade, and the preservation of culture, Pixel has chosen to depict her work in many mediums encompassing paintings, drawings, performances,and textiles. Her work encourages us to embrace the rich complexities of our own identities and heritage. CELEBRATION StatementPixel's fusion of traditional masquerade and personal style explores Black celebration. Modernizing Trinidadian masquerade, she infuses it with unique aesthetics and distinctive masks, delving into the profound layers of cultural identity as a Moko Jumbie. Rooted in West African heritage, Moko Jumbie represents protection. Pixel's work invites viewers into the vibrant spirit of Black celebration. Website: www.pixel-heller.format.comInstagram: @100mega_pixel Artist: Uzoma Ekpunobi Abby Adjekum – Toronto, 2024 © Peiying Xie Pixel Heller – Toronto, 2024 © Peiying Xie Dose Omoruna – Toronto, 2024 © Peiying Xie Uzoma Ekpunobi – Toronto, 2024 © Peiying Xie"
