title = "Ilot de Chaleur — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "ÎLOT DE CHALEUR“ISLAND OF WARMTH” ABOUT THE INSTALLATIONFebruary 18 - March 20, 2022 Island of Warmth was an interactive light installation encouraged the public to work together to keep the flames alive in the lull of colder months. Visitors kindled the “embers” as the “flames” rose, flickered and swirled in response of their movements. CREDITSA coproduction of Quartier des Spectacles Partnership and Illuminart, during MONTRÉAL EN LUMIÈRE.Original idea, light conception and stage set: Félix Dagenais and Louis-Xavier Gagnon-Lebrun (ATOMIC3)Sound conception: Jean-Sébastien CôtéInteractive modules conception: Benjamin De LeenerTechnical direction: Simon Cloutier (ATOMIC3)Light and interactivity Project manager: Jean-François Piché The eye-catching illuminated 6-metre structure, made up of 220 incandescent light bulbs, displayed a warm “fiery” glow that responded to visitors’ movements. ATOMIC3’s passion for animating public spaces sparked the imaginative curation of this “urban campfire”."
