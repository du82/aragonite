["https://ydsquare.ca/national-access-arts-centre-reel-perspectives-2024"]
title = "National Access Arts Centre: Reel Perspectives — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = '''National accessArts Centre: Reel Perspectives ExhibitionOctober 1 to 31, 2024Yonge-Dundas (soon to be Sankofa) Square and the National accessArts Centre are happy to announce the featured artists for the Reel Perspectives Installation: Paul Brain, Sherrine Fox, Jody Roll, Carla Salter, and Alison Cherer. This exhibition features five video portraits that illuminate the space between external appearance and internal experience of artists living with disabilities. Each artist sought to represent how their artistic practice is an avenue to overcome obstacles, connect to community, and realize their dreams. The artists collaborated with filmmaker Katie Wackett to develop their concepts, videographer Sebastian Buzzalino to shoot their videos, and digital media artist Tom Kuo to create the experience in the square. This work was created in Mohkinstsis (also known as Calgary) at the National accessArts Centre in Calgary and made possible through the support of Canada Council for the Arts. About the National accessArts Centre:As Canada’s first multidisciplinary disability arts company, the NaAC provides artistic training, creation, and exhibition/presentation opportunities for artists with developmental, physical, and acquired disabilities. The NaAC supports more than 300 artists living with developmental and/or physical disabilities through on-site studio supports and workshops, and an even broader community of Canadian artists with disabilities through immersive programs delivered online. The NaAC currently operates a multidisciplinary studio space in Calgary, and the Won Lee Community Arts Hub in Toronto. About the Artists: <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727971993931-PRSAYCPZSTVBK9N231NU/paul+1.jpg" alt="paul 1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727971996429-MPLI7JW86VPYNAAYA0NU/paul+2.jpg" alt="paul 2.jpg" /> Paul BrainPaul Brain, an award-winning contemporary artist, reshapes the landscape of disability art. Hailing from Hong Kong, now Calgary-based, his work reflects a profound journey from Asia to Canada, infused with personal transformation. Following a life-altering brain-reconstruction surgery in 2021, Paul’s art delves into themes of resilience and enlightenment. His vibrant, emotive creations invite viewers into a world of compassion and boundless imagination. Paul Brain is not just an artist; he’s a storyteller whose canvas speaks of triumph over adversity. Artist Statement"In this film, I explore the intricate dance between light and shadow, much like the contrasts within our own experiences. Through a fusion of mixed media and innovative film techniques, I aim to take the audience on a journey through the subconscious, where reality and dreams blend. This piece is a reflection of my own journey through enlightenment, art, and healing, inviting viewers to contemplate their own narratives of transformation. Here, amidst the lights of Yonge and Dundas Square, my art finds its voice, challenging perceptions and celebrating the intricate beauty of the mind." <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727972546006-JT74HL81DKCNIFBZL879/alison+2.jpg" alt="alison 2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727972545959-F12Q5NA2N194XP7QJ4OQ/alison+1.jpg" alt="alison 1.jpg" /> Alison ChererAlison Cherer is a versatile artist who likes using a variety of media and doesn't miss an opportunity to try something new. In the studio, she experiments with mosaics, printmaking, batik, collage, and glass. Her current mediums of choice include clay, Venetian plaster and fluid acrylic paint. She gets inspiration from her hobbies, including participating in Special Olympics and watching sports, especially hockey and football. She loves to attend Calgary Flames hockey games and Stampeder football games on weekends and enjoys sharing stories of her adventures with her fellow artists. While her work often reflects sports-related imagery or references to popular culture, she also likes to paint animals and landscapes.Artist StatementMy video was inspired by fireworks and the magic of Harry Potter. I wanted to include a map and moving footprints, because it gives the idea of magic and travelling. In the video you can see a character named Starlight, who I invented. Starlight is made of clay and sits in a wheelchair just like me. In my video you might notice my collage background, where I used pictures of the Calgary Saddledome, horses, and bowling pins. There are a few shots of myself in silhouette, which gives the impression of me without having to be onscreen. My favourite part of the video is the glowsticks and the bubbles and sparklers. <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727973129465-GS0DD449ACHFAGJJW0J0/Sherrine+1.jpg" alt="Sherrine 1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727973129482-JRHNLP5K13B65X6P1BZV/Sherrine+2.jpg" alt="Sherrine 2.jpg" /> Sherrine FoxSherrine Fox is an emerging visual artist currently based in Calgary, Alberta. Sherrine is adventurous, she loves to explore new mediums and techniques. Recently, she’s been diving into her passion for portraits, landscapes, and shadows through charcoal drawings. Sherrine is highly involved in the Calgary arts community, participating in gallery tours, studio visits, and research-based learning. Connecting with other artists and art communities in Calgary is a huge part of Sherrine’s passion for art. She recently completed a 2D Visual Art practicum with the National accessArts Centre, as well as a music residency at Contemporary Calgary. Artist StatementI wanted to make this video to try something new and see where my art skills take me. I knew I wanted to be onscreen so I can share my skills and hopefully it will inspire other people. There is a shot of my hand gliding through some long grass, to give the feeling of nature. I included a shot of me and my mentor and fellow artist Toni Cormier, who helped me with getting started in visual arts and helped me to get better. My favourite part of the process was thinking about ideas and discussing with other artists. As I start to learn, I start to visualize the kind of art I want to do, I can’t wait to get started. I wanted to show myself as an educator and a leader. It was really great doing the video, I really enjoyed it and would love to do it again. <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727973369824-XP8NOQZK08OTWPDO30YZ/jody+1.jpg" alt="jody 1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727973369731-CF89X1VMZWT0AY2CXOSE/jody+2.jpg" alt="jody 2.jpg" /> Jody RollJody Roll is an abstract artist, designer, and filmmaker from Calgary, Alberta. Her work is vibrant, bright, dreamy, and romantic. A common theme Jody likes to showcase is the beauty of people with disabilities. Jody is a passionate advocate for the Down Syndrome community and mental health awareness. Her work has been featured in galleries across the country and screened at the Artifact Film Festival and Sled Island. Artist statementI wanted to be in front of the camera because I love to be the center of attention. I’ve had to fight to get a lot of things in my life, and in the past people with Downs did not get those chances so I’ll never give up fighting. My favorite part of making this video was collaborating and interacting with the other artists. I chose to include some still photographs of my portraits because I love them, it makes me feel like I’m a beautiful person. <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727974554086-OX6LJIEIIHC03D78XKRV/carla+1.jpg" alt="carla 1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1727974554121-ZGV529BWDJMK6OEDAE4N/carla+2.jpg" alt="carla 2.jpg" /> Carla SalterCarla Salter is an artist born and raised in Calgary, Alberta, who has created art for as long as she can remember. Carla has worked at the National accessArts Centre for years, where she has explored painting, ceramics, and now digital video. She loves creating abstract work because it allows her more freedom to communicate feelings and expressions. For Carla, creating artwork feels like a necessary practice in her life. Through her artwork, Carla feels like she has a greater capacity to express herself and speak her mind. "I want to keep making and see where my practice evolves. I want to keep pushing myself because I never feel like I have to hide who I am when I'm creating my artwork." ARTIST STATEMENTI created this video to represent myself through my ceramics practice. Throwing the puzzle piece is an example of mental health and strength for the mind. I’m crumbled without art, I have no voice until I make my art, that’s what art has done for me. National accessArts Centre opened my voice outside the studio and for the world I’m in. Creating a video was a new experience that I learned, and I want to do more in the future. It’s amazing how art can improve your self-worth.'''
