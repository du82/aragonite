["https://ydsquare.ca/optik"]
title = "Optik — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "Optik Read about Optik: Behind-The-ScenesFeatured March 3 to April 2, 2023Optik was an interactive installation that incorporated sound, light, and touch to create a multi-sensory experience in the heart of Toronto, Yonge-Dundas Square. The installation featured 10 gyroscope-like displays that produced various rhythmic sounds and cascades of colour when manipulated in a spinning motion.Optik offered a unique opportunity for our visitors to re-imagine their surroundings at Yonge-Dundas Square, by using the forms to refract and reflect the vibrant, ever-changing displays and screens. Through Optik, the public was able to step into Yonge-Dundas Square as a creative, playful space and connect with one another. “A PLAYFUL VISION OF A BRIGHTER SIDE” THE OPTIK EXPERIENCE LOOK: Spin and rotate the disks to reveal the spectacle of colour. No matter the time of day, the dichroic film built into the centre of each display reflects rays of lights LISTEN: Hear the beautiful notes of 10 different instruments that sing out as you manipulate the forms to create your own sounds and rhythms. The sounds match the speed you spin – fast, slow or in harmony with another. MEET THE TEAM BEHIND OPTIK CREATE: The more the merrier! Optik was designed to help us connect. Think outside of the box and work with others to create musical pieces, unique to that moment in time. Optik was created by The Urban Conga in collaboration with Serge Maheu. Creation and artistic direction: The Urban CongaSound and light design: Serge MaheuOwner: InitTour production: Creos Complete this survey for your chance to win one of several prizes including $100 in Cadillac Fairview Gift Cards and two concert tickets to Classic Albums Live: Prince and The Revolution, Purple Rain on June 9, 2023 at Massey Hall! Design of interactive control systems: Serge Maheu Optik Community Survey Structure and engineering: Maintenance Industries Meca-Fab inc."
