["https://ydsquare.ca/tommy-truong"]
title = "Tommy Truong — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "TEMPORARILY HEDGED ABOUT THE ARTISTTOMMY TRUONGTommy Truong is a digital artist, emerging curator, and independent animator, whose work explores the ideas of human behavior, screen-based media, and storytelling; specifically, how they coincide and complement one another. Recognizing the artistic merit of his practice, Truong was shortlisted for Equitable Bank’s Emerging Digital Artist Award, and received OCAD U’s Integrated Media Project 31 Scholarship. Truong has also exhibited in venues across Toronto like, Xpace Cultural Centre, OCAD University, Artscape, The Royal Cinema, Daniel Spectrum, The Royal Cinema, The Brandscape, Tranzac, and Art Gallery of Ontario. Temporarily Hedged by Tommy TruongPhotograph by Kelvin Leung The perspective of this illustration is positioned within the hollow space of the bush, the small void of this wrapped around the facades of the building structure. Tommy invites everyone to enjoy the stillness of this work, the vibrant and saturated palette of the greenery, and to reflect on the smaller details to help free our minds from the temporary physical restrictions. Temporarily Hedged by Tommy TruongPhotograph by Kelvin Leung Temporarily Hedged by Tommy Truong, featured on the T.O. Tix BoothPhotograph by Kelvin Leung TEMPORARILY HEDGEDInspired by the structure of plants and the idea of co-existence, Temporarily Hedged is a digital illustration that seeks to examine themes of community and precarious moments of joy in our current time of confusion, and uncertainty. Fostering this small seed of joy, Temporarily Hedged focuses on the fluidity of mark-making, and the organic quality of the plants. Temporarily Hedged by Tommy TruongPhotograph by Kelvin Leung"
year_published = 2024
year_updated = 2024
