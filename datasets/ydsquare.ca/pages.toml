["https://www.ydsquare.ca/-delalicofie-designto-2025"]
title = '"At the Conjuring of Roots, I Wished to Meet Me..." by Delali Cofie, curated by DesignTO. — Sankofa Square (formerly Yonge-Dundas Square)'
full_description = '''Digital Screen Exhibition Curated by DesignTOAT THE CONJURING OF ROOTS, I WISHED TO MEET ME…January 1 to 31, 2025 ABOUT THE ART"At the Conjuring of Roots, I Wished to Meet Me…" is an exhibition of photographs by Toronto-based Ghanaian-Nigerian photographer and visual artist Delali Cofie, presented on five digital screens at Sankofa Square (formerly Yonge-Dundas Square).“Inspired by traditional West African costuming practices, I explored the physical manifestation of self through masquerade garments. Like the Otoghe-Toghe masquerade from Arombga, Nigeria, its body segmented in rows that spoke to me of a piling up of history over time. Old family clothes of mine and my father's served as the base material, which I combined with raffia, used bed sheets, and fabric scraps sourced from various tailor shops in Accra, Ghana. These became artifacts of time, forming a constructed archive of personal history.Working with local artisan communities, through processes of dyeing and sewing, I realized that the process of becoming is as communal as it is individual. There is no ‘self’ without the many hands and interactions of others. Similarly, various subjects embody these garments, considering them as extensions of themselves, existing between spaces of confrontation, concealment, and revelation. They join me on my journey of self-formation, serving as mirrors through which I understand the cyclical nature of being.”– Delali Cofie "At the Conjuring of Roots, I Wished to Meet Me..." by Delali Cofie, curated by DesignTO. To see more works by Delali Cofie, visit the DesignTO-curated group exhibition REVIVE at Harbourfront Centre, which includes more photos from the series At the Conjuring of Roots, I Wished to Meet Me…, as well as select costumes shown in the photos. "At the Conjuring of Roots, I Wished to Meet Me..." by Delali Cofie, curated by DesignTO. "At the Conjuring of Roots, I Wished to Meet Me..." by Delali Cofie, curated by DesignTO. ABOUT THE ARTISTDelali Cofie (b. 1999) is a Ghanaian-Nigerian photographer and visual artist currently living in Toronto, Canada. Through storytelling, he engages in multiple genres of photography, including fine art, documentary, and fashion. His personal work presents subtle beauty while exploring themes of family, self-formation, and becoming. Frequently creating work between his native city, Accra, and his current home in Toronto, his work tells a tale of two cities, linked by a diasporic thread. His work has been exhibited in galleries across Ontario, including Gallery 44 and Gallery 101. In 2022, his work was featured in the retrospective catalogue of legendary Ghanaian photographer James Barnor at the Arles Photography Festival. Delali held his first solo exhibition, A Place of Ours, as part of the CONTACT Photography Festival in Toronto (2022), while also creating commissioned work for the Royal Bank of Canada. He is a recent graduate and medal winner in photography from OCAD University.www.delalicofie.com "At the Conjuring of Roots, I Wished to Meet Me..." by Delali Cofie, curated by DesignTO. ABOUT DESIGNTOThis edition of At the Conjuring of Roots, I Wished to Meet Me... is curated by DesignTO and supported by the Government of Ontario, with venue partner Sankofa Square.DesignTO is a non-profit arts organization that brings people together to design a better future—one that is more sustainable, just, and joyful. We curate exhibitions, presentations, and educational programming to increase the public’s knowledge and appreciation of design. DesignTO organizes the annual DesignTO Festival, featuring 100+ free events and exhibitions, and celebrates its 15th anniversary from January 24 to February 2, 2025.'''
year_published = 2024
year_updated = 2025
