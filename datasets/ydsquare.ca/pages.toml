["https://ydsquare.ca/contact-photography-festival-joyce-joumaa"]
title = "CONTACT Photography Festival - Untitled by Joyce Joumaa — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "CONTACT Photography Festival - Untitled by Joyce Joumaa Joyce Joumaa, Untitled, (video still), 2024. Courtesy of the artist On the Digital Screens from May 1 to 31, 2024 Joyce Joumaa’s installation will be showcased on all five digital screens at Yonge-Dundas Square. Joumaa’s installation probes multiple modes of representation, transnational community building, and Palestinian solidarity by bringing together Chile’s football team, Club Palestino, with Mustafa Abu Ali’s 1974 documentary film They Do Not Exist.Curated by Heather Canlas RiggPresented by CONTACT in partnership with Yonge-Dundas SquareHeather Canlas Rigg is a curator and writer based in Toronto. She is the Artistic Director of the CONTACT Photography Festival, and is half of the curatorial collective ma ma.Learn more at contactphoto.com/joyce-joumaa-untitled Joyce Joumaa photographed by Clara Lacasse Joyce JoumaaArtist bioJoyce Joumaa is a video artist and writer based between Beirut and Montreal. After growing up in Lebanon, she pursued a BFA in Film Studies at Concordia University in Canada. Her work focuses on microhistories within Lebanon as a way to understand how past structures inform the present moment. Central to her practice is an interest towards the political charge inscribed in spaces and the social psychology that unfolds out of this tension. Her current research revolves around the post colonial education system in Lebanon and the maritime border conflict with Israel. Her work has shown at the Montreal Museum of Fine Arts, FOFA Gallery and Dazibao. She was a finalist for the 2023 Prix Pierre Ayot and the recipient of the 2023 Bousre Plein-Sud. In 2022 she was the recipient of the Emerging Curator Residency at the CCA Canadian Centre for Architecture. Her 16mm film To Remain in the no Longer (2023) has been screened at MUDAC (Lausanne, Switzerland), The 35th edition of Ljubljana Biennale of Graphic Arts (Ljubljana, Slovenia), Open City Documentary Festival (London, UK), 18th Edition of Ecrans du Reel (Beirut, Lebanon) and is currently included in the 2nd Sharjah Architecture Triennale (Sharjah, United Arab Emirates)."
