["https://ydsquare.ca/seasonal-event-assistant"]
title = "Seasonal Event Assistant — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = "Job Posting–February 27, 2025Seasonal Event AssistantPosition Type: Seasonal Full Time Location: 2 Carlton St., Toronto, ON Start Date: May 5, 2025End Date: September 5, 2025 Salary: $22/hourReports To: Manager of Events and OutreachApplication Deadline: Wednesday, March 26 at 5:00pm Note: This position is contingent on funding from the Canada Summer Jobs program. Candidates must be between 15-30 years of age, and either a Canadian citizen, permanent resident, or person to whom refugee protection has been conferred (foreign students are ineligible) and be legally entitled to work in Canada.OverviewSankofa Square is seeking an energetic and enthusiastic individual to fill the Seasonal Event Assistant position, a role that is integral to the smooth operations of events at the Square. Reporting to the Manager of Events and Outreach, the Seasonal Event Assistant will acquire hands-on experience working on-site during events. This role will facilitate the execution of outdoor, public events by representing the Event team both in office prior to events, and on the Square during event activations. The successful candidate will act as the primary contact on site for clients, staff, and suppliers.Candidates will work in a dynamic and supportive environment that is both challenging and rewarding. The role requires flexibility, including evening and weekend shifts, and may involve physically demanding outdoor conditions based on event needs. The successful candidate will typically spend 1-2 days per week in the office and 3-4 days on-site, with two days off, usually during the week. Weekend shifts will be required every other weekend for the duration of the contract.Responsibilities and TasksEvent Coordination & Client ServicesAct as a contact onsite for clients and suppliers.Act as a venue representative to the general public.Assist the Event Coordinators in the delivery of all services to clients.Assist the Event Coordinators in the delivery of all operational requests to event clients.On assigned events, oversee the occupancy of the facility from load-in to load-out to ensure compliance with agreements and other terms and conditions governing the facility occupation.Assistance overseeing the Busker Program.Other event related projects as assigned. Administrative & Event DocumentationUtilize the event booking management software to assist in tracking client requirements, supplier invoices, and final reconciliation.Assist in the organization of data in the event booking management software.Assist the Event Coordinators with administrative paperwork for the successful execution of events.Assist in the preparation of staffing requests for upcoming events.Oversee staffing requests, finalize staffing schedules, and report on post-event staffing hours.Prepare pre/post-event facility inspection reports, assess damage to the facility, note equipment rental details, and document incidents impacting the event, communicating these to Event Coordinators.Record and distribute meeting minutes.Other administrative tasks as assigned.Site OperationsUphold a regular presence on the Square, assisting with facility/operations audits and site inspections, actioning feedback as directed.Assist with the supervision of contracted services to ensure smooth execution of the event plan and report service issues to Square management promptly, as necessary.Assist with inventory management, including storage organization, damage reports, and coordinating regular maintenance and repairs.Upload and manage content for the digital screen program.Other operations site operations related projects as assigned.QualificationsPost-secondary education in a discipline pertinent to the job function preferred or an equivalent combination of education and experience in an event environment.Experience in an outdoor event environment including working with suppliers, clients, the public and a demonstrated familiarity with load in and out procedures, production schedules and crowd management.Experience utilizing a variety of software packages, including Word, Excel, Outlook and Canva.Excellent skills in written and verbal communication, leadership, interpersonal relationships, as well as conflict resolution and problem solving.Excellent organizational skills including the ability to prioritize and meet deadlines.Ability to work independently and in a team, and to balance initiatives and follow direction appropriately.Proven customer service/relations skills with the ability to liaise with major clients.Ability to communicate effectively with contracted services staff in coordinating events.Flexibility to workdays, afternoons, early mornings, night shifts and weekends, as required by events.Ability to perform moderate lifting (up to 40lbs).Application:Completed applications should be emailed to: employment@sankofasquare.caThe email should have the subject line: Application for Seasonal Event Assistant & YOUR NAMEPlease include in a single PDF document an attachment to your email, with your resume and a cover letter explaining why you wish to join the Sankofa Square team.Please note: Sankofa Square is an equal-opportunity employer which values diversity in the workplace. We are therefore happy to accommodate individual needs in keeping with the Ontario Human Rights Code and the Accessibility for Ontarians with Disabilities Act. If you require accommodation in order to work at Sankofa Square, please let us know.Sankofa Square is committed to a positive and supportive environment that promotes equity and diversity. Priority will be given to persons from indigenous or visible minorities, persons with disabilities, newcomers to Canada (within the past 5 years) or those for whom this opportunity would further their understanding of the public realm.Last update: February 27-2025"
