["https://www.ydsquare.ca/book-the-square"]
title = "Book The Square — Sankofa Square (formerly Yonge-Dundas Square)"
description = "Community events highlight communities, charitable causes, cultures, foods or performances.To apply, please fill out the online application form; once the form has been submitted, someone from our team will reach out with the next steps.If you have any questions regarding the application process, please contact info@sankofasquare.Important information to review:Community Fees and ChargesCommunity Digital Screen PackageResources and Grants"
full_description = "BOOK THE SQUARESankofa Square hosts hundreds of events every year, providing a full complement of event management services. Our dedicated, experienced event coordinators work closely with clients to ensure the event is a great success.The Square is a vibrant, multi-use public space that can accommodate gatherings of various sizes and types. The facility may be booked for commercial, charitable or community events. To learn more about what you can accomplish at Sankofa Square, review the Square’s Venue Package.Event ApplicationBefore you start the application process, please review our Client Handbook, Guidelines, Drone Policy, City Bylaws and Noise Bylaw for more information about the requirements, regulations, and criteria all events must meet. COMMUNITY EVENTS Community events highlight communities, charitable causes, cultures, foods or performances.To apply, please fill out the online application form; once the form has been submitted, someone from our team will reach out with the next steps.If you have any questions regarding the application process, please contact info@sankofasquare.Important information to review:Community Fees and ChargesCommunity Digital Screen PackageResources and Grants COMMERCIAL EVENTS Commercial activations can vary from small to large-scale events that take over the entire Square, concerts, giveaways, marketing campaigns, small footprint pop-ups, and product sampling.To apply, please fill out the online application form; once the form has been submitted, someone from our team will reach out with the next steps.If you have any questions regarding the application process, please contact info@sankofasquare.Important information to review:Commercial Fees and ChargesCommercial Digital Screen PackageBrand Activation Opportunities FILM & PHOTOGRAPHY PRODUCTIONS Commercial UseCommercial photography, television productions and film shoots must apply for a permit to be on site. This includes anything that has a “set-up” or could impede or interfere with another possible activation or event.To apply, please fill out the application form; once the form has been submitted, someone from our team will reach out with the next steps.At this time, the Square does not offer special rates for film shoots.Important Information to Review:Commercial Fees and ChargesDrone UseThe Square is within controlled airspace in the downtown of Toronto. It is in close proximity to medical helicopter landing pads and Billy Bishop Airport. Flight authorization is a must have and a permit is required. For additional information, refer the the Square Drone Policy.News Reporting & GatheringNews teams, weather reporting, and all other forms of electronic news gathering do not require a permit. If you are interested in coming on site for a reason like this, please contact the Square team via our Media Centre to discuss availability and ease of access *Sankofa Square does not accept unsolicited proposals from vendors, artists or performers. If you are interested in being a food vendor at a third-party event, please contact the event directly. Due to confidentiality agreements, we are unable to provide contact information for our event organizers.For information about protests and demonstrations, neighbouring digital screens and other inquiries, please visit our FAQs. SITE MAP Full Square Permit Area Other Permit Maps: 20x20 Permit Map 10x20 Permit Map"
year_published = 2024
year_updated = 2024
clearnet = "https://www.ydsquare.ca/book-the-square"
