full_description = '''Scroll <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1730842047662-YFKXSOTNWMX9PQ77OCJ8/What%27s+On+at+the+Square+%28Banner%29+.png" alt="Banner image for Yonge-Dundas Square homepage with diverse individuals looking up at large digital screens, featuring text 'what’s on at the square' and 'subscribe to our newsletter'" /> Latest News: Findings from the Sankofa Square Community Research Study We’re undergoing a transformationWe’re officially Sankofa Square and are actively working on developing our new brand identity. We’re also laying the groundwork for the Square’s future role in the community. During this time, you may notice elements of our old and transitional branding co-existing. Please bear with us as we work to bring our vision to life. Visit the Becoming Sankofa Square section of our website for the latest news. WELCOME Sankofa Square (formerly Yonge-Dundas Square) is a bustling gathering place for millions of visitors each year. Established in 2004, the Square hosts hundreds of diverse events including community-based festivals, concerts, public art, and commercial experiences. The Square is an open space that welcomes everyone. It is managed by the Sankofa Square Board of Management, a City of Toronto agency. Plan Your Visit about us Book The Square Event Calendar Follow us on Instagram @sankofasquare <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1733243881668-D6YNMPUQ8ERYGXO0F6WM/image-asset.jpeg" alt="2 Days to Go: Are You Ready for Winter Glow? The countdown is on! ❄️✨ Get ready for 18 days of holiday cheer with dazzling lights, thrilling carnival rides, live entertainment, tasty treats, and so much more! Event Details: 🗓: December 5-22, 2024 " /> <img src="https://images.squarespace-cdn.com/content/v1/5b915520697a986a35b98805/1733101232167-2N8G11LG526MG84ZJ2C3/image-asset.jpeg" alt="Winter is coming ❄️ 📷: @ideasandlight #SankofaSquare #SnowFall #Repost" /> <im