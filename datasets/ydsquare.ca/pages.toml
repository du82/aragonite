["https://ydsquare.ca/ocad-indigenous-student-centre"]
title = "OCAD U - Indigenous Student Centre — Sankofa Square (formerly Yonge-Dundas Square)"
full_description = '''OCAD U Indigenous Student Centre Digital ExhibitionNovember 1 to 30, 2023 Yonge-Dundas Square and the RBC Centre for Emerging Artists & Designers are thrilled to present Alexis Nanibush-Pamajewong, Kikki Guerard and Quinn Hopkins as the recipients of the Indigenous Student Centre Digital Exhibition Career Launcher.This exciting exhibition takes place on the Square's five digital screens and provides a unique opportunity for these talented artists to display their work to the thousands of residents, workers and visitors who frequent the area. About the Artists: Artist: Alexis Nanibush-Pamajewong Kikki GuerardA Two-Spirit Cree from Treaty 9 territory, Kikki is an art director, photographer, and storyteller. They are a member of Taykwa Tagamou First Nation and currently reside in Tkaron:to. Kikki’s work explores themes of identity, revealing the magic and vulnerability of their Two-Spirit + Indigiqueer Kin. Through the power of visual storytelling, they hope to create spaces for healing and transformation.Website: www.fashioncamera.caInstagram: @fashioncamera Artist: Quinn Hopkins Kikki Guerard Photographed by Peiying Xie Quinn Hopkins Photographed by Peiying Xie Alexis Nanibush-PamajewongAlexis Nanibush-Pamajewong, a 2s Anishinaabe interdisciplinary artist from Shawanaga First Nation. Alexis is studying for their BFA in the INVC program at OCADU. Their practice includes exploring mediums such as: performance, installation, beadwork, photography, and video. Website: www.alexisnanibush-pamajewong.format.comInstagram: @alexisnanibush_pamaj Artist: Kikki Guerard Quinn HopkinsQuinn "Nigaan Noodin" Hopkins is a Toronto-based AR artist and 3D animator. An OCAD U alum, Quinn blends Indigenous Futurism and digital mediums to create immersive experiences. Specializing in Blender and 8th Wall, he's passionate about storytelling that bridges ancestral wisdom and future possibilities.Website: www.quinnhopkinsart.caInstagram: @noodinstudio Alexis Nanibush-Pamajewong Photographed by Peiying Xie'''
