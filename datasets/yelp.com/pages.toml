full_description = "You're in good company Yelp is powered by a global community of collaborative people. We’re tenacious individuals who commit to our values and unite in our mission to connect people to great local businesses. Yelp is a remote workplace where your work makes a difference, you are seen as a whole person, and you can grow. Search open positions A remote workplace designed for life Our remote work model allows our folks to live where it makes sense for their lifestyle and build a rewarding career that will grow along with them. We believe autonomy promotes productivity and success, and flexibility means we can build a rewarding career while enjoying an enriching life outside of work. At Yelp, your ongoing learning is designed to grow with you for life. We invest in your development as a whole person, and your achievements are part of our collective success. Learn more Who you are is our greatest strength Our people are at the heart of our global employee community. We are creating an inclusive space where our people feel they belong and are empowered to inspire change. We are intentional in our approach to building a workforce that reflects our communities while amplifying underrepresented voices. Yelp is where you can have a voice, celebrate your culture and share parts of your life with your peers. Learn more about our culture Your well-being is a priority We see you as a whole person. We recognize that your unique aspirations and needs reach far beyond your desk from nine to five. Our flexible benefits are designed to support you and your family’s physical and mental health and overall well-being. See benefits Be tenacious. Battle smart and fight 'til the end. Live for the underdog moments. Turn mistakes into opportunities to learn. Play well with others. Treat others with respect. Value diversity in viewpoints. Bring a positive attitude to the table. Protect the source. Community and consumers come first. If we don't maintain consumer trust, we won't have anything to offer local businesses."
