["https://yelp.com/article/top-100-us-restaurants-2025"]
title = "Top 100 US Restaurants 2025 - Yelp"
description = "Discover Yelp’s top 100 US restaurants: 1. Holbox, Los Angeles, California; 2. Twisted Gyros, Hillsboro, Oregon; 3. De Babel, Scottsdale, Arizona…and much, much more."
full_description = "Looking for 2025’s best food? This year, you’ll find it in some of the most unexpected places. Across the US, chefs are crafting extraordinary dishes from fast-casual counters, food trucks, and crowded food halls — like the one where our #1 pick, Michelin-rated seafood gem Holbox, is located in Los Angeles. As restaurant owners across America concoct award-winning dishes in unconventional settings, Yelp reviewers are eagerly voting them up, both at home and on their travels. “Exceptional cuisine can come from anywhere,” says Gilberto Cetina, the chef-owner of Holbox. This year’s Top 100 US Restaurants list celebrates that trend — with an accent on delicious food at fair prices in comfortable settings. Of course, you’ll still find plenty of fine-dining places for special occasions and big splurges. Here are some of the trends you’ll see this year:Simply casual. You don’t need fancy white tablecloths to earn 5-star ratings. In addition to Holbox, Yelpers have showered praise on a food hut near Costco (Chellas Arepa Kitchen in Pennsylvania, #5), a fast-casual eatery (Twisted Gyros in Oregon, #2), and a takeout salad spot (The Good Salad in California, #8). A taste of the Middle East. On a top 100 list that spans the globe, Middle Eastern cuisine is the food of the moment. De Babel in Arizona (#3) and Wally’s Cafe in California (#6) feature authentic dishes from chefs hailing from Jordan and Lebanon, respectively. At Silicon Valley’s The Good Salad, the brainchild of Iraq-born Sanad Al Souz, guests clamor for fusion specialties like Halal Cajun Chicken Breast. A world to devour. Our top 10 alone is a multicultural mashup, featuring Mexican, Mediterranean, Peruvian, Cambodian, Thai, Filipino, and French cuisines. Whether slurping pho at Phonomenal (#4) in California, savoring BBQ-stuffed arepas at Chellas Arepa Kitchen, or exploring the trio of chicken preparations at Aroy Mak Thai Food in Washington (#7), Yelpers are always hungry for exciting international delicacies."
