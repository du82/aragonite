["https://yelp.com/tos/privacy_policy"]
title = "Yelp Privacy Policy – Yelp Terms of Service"
full_description = "Yelp Privacy Policy Last Updated December 30, 2024 (Effective January 1, 2025). To review the previous policy, please click here. This Privacy Policy describes our policies on the collection, use, and disclosure of information about you in connection with your use of our services, including those offered through our websites, communications (e.g., emails, phone calls, and texts), and mobile applications (collectively, the “Service”). The terms “we”, “us”, and “Yelp” refer to: (i) Yelp Inc., a Delaware corporation with its headquarters in San Francisco, California, unless you are a European Resident; or (ii) Yelp Ireland Ltd., a limited liability company established and resident under the laws of the Republic of Ireland, if you are a European Resident. “European Resident” means a resident of a country in the European Economic Area (“EEA”), United Kingdom or Switzerland. When you use the Service, you consent to our collection, use, and disclosure of information about you as described in this Privacy Policy. We may translate this Privacy Policy into other languages for your convenience. Nevertheless, any inconsistencies among the different versions will be resolved in favor of the English version available here. TABLE OF CONTENTS Information We Collect and How We Use It Cookies Third Parties Controlling Your Personal Data Data Retention and Account Termination Children Security Contact Information Modifications to This Privacy Policy US: Your Privacy Rights European Residents: Your Privacy Rights and International Data Transfer INFORMATION WE COLLECT AND HOW WE USE IT We may collect, transmit, and store information about you in connection with your use of the Service, including any information you send to or through the Service. We use that information to provide the Service’s functionality, fulfill your requests, improve the Service’s quality, engage in research and analysis relating to the Service, personalize your experience, track usage of the Service, provide feedback to third party businesses that are listed on the Service, display relevant advertising, market the Service, provide customer support, message you, back up our systems, allow for disaster recovery, enhance the security of the Service, and comply with legal obligations. Even when we do not retain such information, it still must be transmitted to our servers initially and stored long enough to process. Account Information: When you create a Yelp account, we store and use the information you provide during that process, such as the first and last name you enter, email address, zip code, physical address, and any other information you may provide during the account creation process, such as a gender, phone number, or birth date. We may publicly display the first name and last initial that you provide, as well as any photo or other content you submit through the account creation process, as part of your account profile. We also store and use any preferences you provide to personalize your user experience, including dining and activity preferences. You can later modify some of the account information you provide through your account settings. If you believe that someone has created an unauthorized account using your personal information, you can request its removal by flagging it. Public Content: Your contributions to the Service are intended for public consumption and are therefore viewable by the public, including your photos, ratings, reviews, tips, lists, bookmarks and collections, compliments, Ask the Community posts, Yelp Talk posts, and edits to business page information. Your account profile (e.g., first name, last initial, city, neighborhood, the month and year you created your Yelp account, profile photos and list of friends on Yelp) is also intended for public consumption, as is some of your other activity through the Service, like how you vote on other people’s contributions (e.g., useful, funny, cool, helpful, or not helpful), which contributions you like, where you check-in (including when friends on Yelp tag you in their own check-ins), which contributions or users you follow, and which businesses you follow. You can limit the public visibility of some of these activities through your account settings. Contacts: You can invite others to join or become your friend on Yelp by providing us with their contact information, or by allowing us to access contacts from your computer, mobile device, or third party sites to select which individuals you want to invite. If you allow us to access your contacts, we will transmit information about your contacts to our servers long enough to process your invitations or friend requests. Communications: When you sign up for an account or use certain features, you are opting to receive messages from other users, businesses, and Yelp. You can manage some of your messaging preferences through your account settings, but note that you cannot opt out of receiving certain administrative, transactional, or legal messages from Yelp. For example, if you make a reservation, order food, place yourself on a waitlist, or request a quote or otherwise contact a business through the Service, we, or the business you are interacting with through Yelp, may send you messages about your transaction using any contact information you provide, including through SMS to your phone number. We may also track your actions in response to the messages you receive from us or through the Service, such as whether you deleted, opened, or forwarded such messages, and share that information with other parties to your messages (for example, to let them know if you have viewed their message). When a user requests a quote or similar information from one or more businesses through the Service, in addition to the request, we may disclose to those businesses information about the status of the user’s requests, such as whether any business has responded to the request, the type of response provided (for example, whether the user received a quote or a request for more information), and whether the user has responded to any business’s reply. If a business elects to share its availability or schedule with users through the Service, that information may be used for the purpose of determining availability and/or scheduling appointments. If you exchange messages with others through the Service, we may store them in order to process and deliver them, allow you to manage them, and we may review and disclose them in connection with investigations related to use of the Service, as well as our efforts to improve the Service. We may not deliver messages that we believe are objectionable, such as spam messages, fraudulent solicitations, or requests to post, exchange, or remove reviews for compensation. If you send or receive messages through the Service via SMS, we may log phone numbers, phone carriers, and the date and time that any messages were processed. Carrier message and data rates may apply. We may also store information that you provide through communications with us, including from phone calls, letters, emails and other electronic messages, or in person. Any of our communications with you, including any phone calls, may be monitored and recorded for quality purposes. If you are a representative of a business listed on Yelp, or use a phone number associated now or previously with such a business, we may contact you, including by phone or email, using the contact information you provide us, make publicly available, or that we have on record for your business. Transactions: If you initiate a transaction through the Service, such as making a reservation, joining a waitlist, making an appointment, or making a purchase, we will collect and store information you provide associated with your transaction, such as your name, phone number, address, email, and payment information, as well as any other information you provide relating to the transaction or request, in order to process your transaction, send you communications related to the transaction, and to facilitate future transactions. We may also use aggregated or anonymized information regarding those transactions for analytics purposes and to improve Yelp’s services. This information may be shared with third parties, and third parties may share such information with us, for the same purposes. When you submit credit card numbers and other sensitive payment information, that information is encrypted using industry standard technology. If you write reviews about businesses with which you transact through the Service, we may publicly display the fact that you transacted with those businesses in connection with such reviews. For example, if you make a dining reservation through the Service and later write a review about your dining experience, we may publicly display the fact that you made your reservation through the Service in connection with that review. Activity: We store information about your use of the Service, such as your search activity, the pages you view, the date and time of your visits, businesses you call using our mobile applications, and reservations, purchases, or transactions you make through the Service. We also store information that your computer or mobile device may provide to us in connection with your use of the Service, such as your browser type, type of computer or mobile device, browser language, IP address, WiFi information such as SSID, mobile carrier, phone number, unique device identifier, advertising identifier, location (including geolocation, beacon based location, and GPS location), and requested and referring URLs and mobile applications. We may also receive and store your location whenever our mobile applications are running, including when running in the background, if you enable our mobile apps to access such information in the course of using the Service. You may be able to limit or disallow our use of certain data through your device or browser settings, for example you may be able to limit or disallow our collection, use or sharing of location data or mobile advertising identifiers by adjusting the settings for our applications in iOS or Android privacy settings. Different Devices: You may access the Service through different devices (e.g., your mobile phone, personal computer, or other internet connected device) and different platforms (e.g., through the Yelp website or Yelp mobile apps). The information that we collect and store through those different uses may be cross-referenced and combined, and your contributions through one Yelp platform will typically be similarly visible and accessible through all other Yelp platforms. Professional Information: If you represent a business on Yelp, we may collect and display information about you related to your business activities, such as a business name that may incorporate your individual name, or a publicly available business address that is also used as a home address. We will also collect and display information about your professional background that you choose to share with us through the Service, such as information about your professional licenses or certifications, or your professional history or specialties. Sensitive Personal Information: In the course of using the Service, you may choose to allow Yelp to collect and store sensitive personal information about you, such as your precise geolocation. You may choose to share other sensitive personal information through the content you share on Yelp, for example, when leaving a review, sending a direct message, or otherwise sharing information on Yelp. You may be able to limit or disallow our collection, use or sharing of location data by adjusting the settings for our applications in iOS or Android privacy settings. You can remove content that may include sensitive personal information through your account settings. More information on managing your sensitive personal information is available here. COOKIES We, and our third-party service providers, may use cookies, web beacons, tags, scripts, local shared objects such as HTML5 and Flash (sometimes called “flash cookies”), advertising identifiers (including mobile identifiers such as Apple’s Identifier for Advertisers (“IDFA”) or Google’s Advertising ID (“GAID”)) and similar technology (“Cookies”) in connection with your use of the Service, third party websites, and mobile applications. Cookies may contain unique identifiers, and reside, among other places, on your computer or mobile device, in emails we send to you, and on our web pages. Cookies may transmit information about you and your use of the Service, such as your browser type, search preferences, IP address, data relating to advertisements that have been displayed to you or that you have interacted with, and the date and time of your use. Cookies may be persistent or stored only during an individual session. The purposes for which we use Cookies in the Service include: Purpose Explanation Processes Intended to make the Service work in the way you expect. For example, we use a Cookie that tells us whether you have already signed up for an account. Authentication, Security, and Compliance Intended to prevent fraud, protect your data from unauthorized parties, and comply with legal requirements. For example, we use Cookies to determine if you are logged in. Preferences Intended to remember information about how you prefer the Service to behave and look. For example, we use a Cookie that tells us whether you have declined to allow us to send push notifications to your phone. Notifications Intended to allow or prevent notices of information or options that we think could improve your use of the Service. For example, we use a Cookie that stops us from showing you the signup notification if you have already seen it. Advertising Intended to make advertising more relevant to users and more valuable to advertisers. For example, we may use Cookies to serve you interest-based ads, such as ads that are displayed to you based on your visits to other websites, or to tell us if you have recently interacted with an ad. Analytics Intended to help us understand how visitors use the Service. For example, we use a Cookie that tells us how our search suggestions correlate to your interactions with the search page. You can also set some Cookie preferences through your device or browser settings, but doing so may affect the functionality of the Service. The method for disabling Cookies may vary by device and browser, but can usually be found in your device or browser preferences or security settings. For example, iOS and Android devices each have settings which are designed to limit forms of ad tracking. For flash cookies, you may also be able manage your privacy settings by clicking here. Please note that changing any of these settings does not prevent the display of certain advertisements to you. THIRD PARTIES Third parties may share, receive or process information about you as follo"
