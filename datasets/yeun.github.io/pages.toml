title = "heeyeun | Photoshop Extension: GuideGuide"
description = "Photoshop에서 Guide를 쉽게 그리도록 도와주는 Extension을 GuideGuide를 소개한다."
full_description = "이 글은 스포카 테크 블로그에 기재한 글을 옮겨와 다듬은 포스트다. 2014년 5월 19일 당시 최신 버전인 Photoshop CC 2014.2를 기준으로 작성되었다. GuideGuide는 내가 새 컴퓨터에서 업무 환경을 셋팅할 때 포토샵 설치 후 바로 설치하는 플러그인이다. 그만큼 디자인 작업에 필수적이고 편리한 기능을 제공하고 있다. 말 그대로 가이드를 쉽게 그릴 수 있게 해주는 플러그이다. 인터페이스는 아래와 같다. 상하좌우 여백, 행과 열의 갯수, 행과 열의 넓이, 행과 열의 간격을 지정할 수 있다. 단위는 px, %, cm, mm 등 거의 모든 단위를 사용할 수 있다. 예를들어, 상하 여백을 30px씩 준 상태에서 화면을 12등분하고, 그 간격은 10px로 하고 싶다면 아래와 같이 설정하고 하단 중앙의 GG버튼을 누른다. 만약 화면 전체가 아니라 특정 부분을 분할하는 가이드를 그리고 싶다면 Marquee Tool로 원하는 영역을 지정해서 사용할 수도 있다. 이 외에도 자주 사용하는 Guide Set을 저장해서 사용할 수도 있다. 상단의 Set를 누르면 다음과 같이 Guide Set 목록이 나타난다. 위의 세개 Outline, Two Column Grid, Three Colum Grid는 GuideGuide가 기본적으로 제공하는 Set이고, 나는 iOS와 Android의 기본 그리드 등을 추가해서 사용하고 있다. 또한 창 하단의 아이콘을 누르면 간단하게 문서의 중앙에 가이드를 그릴 수 있다. GuideGuide는 무료에 CC 업데이트도 아주 안정적으로 제공하고 있으니 아직 사용하고 있지 않다면 꼭 한번 사용해보길 권한다.1 현재는 업데이트가 되어 $10달러로 변경되었다. ↩"
