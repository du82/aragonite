full_description = "Open Color defines specified usage of each color. This post describes supposed usage of colors. Open Color will help you easily decide what color to use for your product. You might want to call it a manual. If you aren't quite sure about the colors you choose, this manual can help you figure out. Open Color is not a rule set. It only suggests you affordable options. Issue reports and Pull requests are always welcome. When gray is used for a UI element, the brightness itself can imply specific significance. When an element turns dark as you hover your mouse, this indicates that the element is clickable. A distinctively bright gray one indicates that the element has been disabled or expired. Other colors in Open Color have a constant difference in brightness separated into ten different levels. However, gray colors of Open Color don't vary in the same degree because specific brightness holds implications as mentioned. Gray 7 or Gray 8 is recommended for body text. The soft color of Gray 7 naturally matches with a background. Therefore it is appropriate for a UI element with concrete function such as menu labels or buttons. If a content itself is emphasized as in blog posts, SNS or headline, Gray 8 can make a clearly readable text. Proin ut ligula vel nunc egestas porttitor. Morbi lectus risus, iaculis vel, suscipit quis, luctus non, massa. Fusce ac turpis quis ligula lacinia aliquet. Proin ut ligula vel nunc egestas porttitor. Morbi lectus risus, iaculis vel, suscipit quis, luctus non, massa. Fusce ac turpis quis ligula lacinia aliquet. Text is often written in gray as well as black. Text in gray can be categorized into two usages. Gray is useful for text which isn’t as important as others. For example, additional explanations below headlines or metadata. Gray 6 is handy because it is a brighter color compared to the body text yet read as disabled. On the other hand, gray is also appropriate to indicate disabled forms, buttons and links. In this case, Gray 5 is recommended."
