title = "heeyeun | 초심자를 위한 100명 규모의 <br>행사 매뉴얼"
description = "행사를 개최해본 경험이 전혀 없는 사람이 맨땅에서 기획부터 실행까지 하기란 쉽지 않은 일이다. 그래서 Behance portfolio reviews를 진행했던 과정을 정리해 행사를 열고자 하는 이들에게 도움이 되고자 한다."
full_description = "지난 5월 13일 개최한 Behance portfolio reviews는 나에게도, 다른 스텝들에게도 모두 처음 여는 행사였기에 꽤 오랫동안 기획과 준비를 철저히 했다. 그 덕에 행사는 아주 성공적으로 치러졌다. 많은 분이 참석해주셨고 재미있는 이야기들이 오갔다. 그러고 나니 이런 크고 작은 이벤트들이 더 많이 열렸으면 좋겠다는 바람이 들었다. 하지만 행사를 개최해본 경험이 전혀 없는 사람이 맨땅에서 기획부터 실행까지 하기란 쉽지 않은 일이다. 그래서 이번 행사를 진행했던 방식을 정리해 행사를 열고자 하는 이들에게 도움이 되고자 한다. 행사를 열자! 행사를 개최하기로 마음먹을 땐 이를 통해 성취하려는 목적이 있다. 특별한 주제로 사람들과 소통하기, 정보나 지식을 알리기, 회사를 홍보하기 등등, 모든 준비에 앞서 기획 의도를 분명히 한다. 목적이 정해졌다면 같이 기획할 팀을 꾸린다. 일반적으로 손발이 잘 맞고 기획 의도에 공감하는 지인을 모으는 방향이 수월하다. 참석자가 100명 규모라면 3-6명 정도의 인원이 적당하다. 이번 Behance portfolio reviews는 총 5명의 팀원이 같이 준비했으며 모두 회사에 다니고 있었다. 만약 준비팀 전원이 풀타임을 할애할 수 있다면 3명도 나쁘지 않다. 그러나 7명 이상으로 인원이 늘어난다면 오히려 소통에 비용이 더 들 수 있으므로 의욕이 왕성한 팀원을 소수로 모아 진행하는 쪽을 추천한다. 기획에 착수하기에 앞서 업무툴을 정한다. Slack, 잔디와 같은 채팅 툴과 Trello, Asana, Github 등의 테스트 관리툴을 적절히 활용한다. 원격 회의를 할 땐 appear.in도 유용하다. 툴은 준비팀이 사용하기 편하고, 접근이 쉽다면 무엇이든 상관없다. 1. 기획 초기에 고려할 것들 준비팀을 꾸렸다면 본격적으로 기획을 시작한다. 크게 다음과 같은 사항들을 초기에 고려한다. 행사 규모 정하기 일자와 시간 정하기 예산 마련하기 연사 섭외하기 장소 대관하기 위에 열거한 내용은 대부분 서로에게 의존성을 지니고 있다. 일자를 잡아야 장소를 섭외할 수 있고, 장소를 섭외하기 위해선 예산을 확정해야 하며, 예산은 규모에 따라 크게 좌우되는 식이다. 그래서 어떤 것을 끝내고 다음 일을 하기보다는 닥치는 대로 일을 해치워나가야 한다. 각각의 내용을 자세히 알아보자. 행사 규모 정하기 40명이 오는 행사와 500명이 오는 행사는 당연히 준비할 내용이 다르다. 참석자 규모에 따라 예산, 대관, 프로그램이 크게 달라지므로 먼저 정하도록 한다. 더욱이 참석자 규모는 다른 항목들과 달리 준비팀 재량만으로 결정할 수 있는 거의 유일한 내용이기도 하다. 이 글에서는 제목에서도 언급했다시피 100명 규모를 전제로 이야기한다. 일자와 시간 정하기 첫술에 날짜를 정할 수 있다면 좋겠지만, 대관이나 연사 섭외와 맞물려있기 때문에 처음부터 날짜를 고정하긴 어렵다. 대신 몇월에 할 것인지, 주말에 할지 평일에 할지는 미리 정해 대관 범위를 좁힌다. 행사 준비에는 짧게는 1달에서 길게는 3달 정도가 걸린다. 이를 염두에 두고 일자를 정하도록 한다. 2-3시간 정도 행사라면 평일 저녁도 불가능하진 않다. 다만 참석자의 주 근무 지역을 고려해, 퇴근 후 이동이 가능한지 따져본다. 주말을 고려한다면 종교 활동을 하는 일요일보다는 토요일을 권한다. 예산 마련하기 예산은 행사의 인상을 크게 좌지우지한다. 예산이 넉넉하면 음료나 간식을 제공할 수도 있고, 좋은 공간을 대관하거나 기억에 남을 굿즈를 제작해 배포할 수도 있다. 반면 예산이 부족하다면 식사 시간을 피해 스케줄을 잡는 게 쉽고, 일찍부터 무료 대관 공간을 알아본다. 예산을 마련하는 방법엔 크게 입장료를 받는 것과 후원을 받는 방법이 있다. 입장료를 받는 건 기획 초기부터 예산의 규모를 쉽게 예측할 수 있다는 장점이 있는 반면에 참가자 한명 한명의 입금 상태를 챙기는 번거로움이 있다. 후원을 받는다면 지원해줄 만한 기업에 연락해 기획 의도를 밝히고, 지원 시 기업이 얻을 수 있는 이득(웹사이트나 현수막에 스폰서 리스트 게시)을 어필한다. 후원은 현금뿐만 아니라 무료 장소 제공이나 다과를 받을 수도 있다. 장소 대관하기 예산 중 가장 큰 부분을 차지하는 항목이 바로 대관이다. 무료로 대관할 경우 가장 크게 예산을 아낄 수 있는 부분이기도 하다. 아래 리스트는 서울 강남권을 기준으로 100명 규모의 장소를 무료로 제공하는 곳들이다. Google Campus 네이버 D2 D.CAMP MARU 180 위 장소들은 무료인 대신 요구하는 조건들이 있으므로 신청 가능한지 미리 확인한다. 위 장소를 섭외하지 못했다면 SpaceCloud, 스페이스쉐어와 같은 서비스를 통해 장소를 알아본다. 대관 확정은 예산 범위나 일정에 큰 영향을 미치므로 빠를수록 좋다. 단, 너무 저렴하고 대관 경험이 많지 않은 곳은 직전에 계약을 파기해버리는 일도 간혹 있으므로 불미스러운 일이 없도록 계약과 확인을 철저히 한다. 연사 섭외하기 행사 당일은 연사가 주인공이다. 그러므로 연사 섭외는 준비에 가장 중요한 부분이다. 연사 컨텍 리스트는 섭외할 연사의 2-3배를 준비한다. 이때 연사의 특성, 성별, 이야기할 주제를 고려해서 논의가 한쪽으로 치우치지 않도록 한다. 특히 Behance portfolio reviews에선 남녀 동수로 섭외하기 위해 노력했다. 섭외하고 싶은 연사들을 모았다면 이제 연사에게 직접 연락한다. 자세한 내용을 전달하기 전에 SNS를 통한 메시지나 지인을 통해 직접 소통한다. 초면에 장문의 메일을 보내는 무례함을 피하고, 간혹가다 메일을 늦게 확인해서 일정에 차질이 빚는 상황을 방지하기 위함이다. 연사가 행사에 관심을 보인다면 메일 주소를 물어 구체적으로 섭외 메일을 보낸다. 이 메일에는 다음 내용을 기재한다. 행사 이름 기획 의도 일시 및 시간 참여하는 대상과 인원 규모 연사가 섭외된 이유 혹은 연사에게 바라는 점 연사의 발표 시간 및 Q&A 여부 연사비의 여부와 금액 입장료 여부와 금액 대관 장소 혹은 염두에 두고 있는 장소 답신을 보낼 기한 궁금한 점이 있을 때 질문할 창구 연사 섭외 메일은 준비팀의 첫인상을 결정하므로 최대한 자세하고 친절히 작성해서 나쁠 것이 없다. 연사와 아주 막역한 사이가 아니라면 연사 입장에선 준비팀에 자주 질문하기 어려울 수 있다. 연사가 혼자 고민하는 시간이 길어질수록 준비팀의 부담도 커지므로 궁금할 만한 모든 내용을 미리 밝힌다. 특히 연사비는 없더라도 없다는 내용을 미리 말해두어야 서로 간에 껄끄러움을 방지할 수 있다. 만약 연사에게 메일을 보내는 시점에 위 내용이 모두 결정되지 않았다면 대략의 내용이라도 언급해 연사가 행사를 상상하기 쉽게 한다. 연사에게 답신이 오면 승낙이든, 거절이든 답장을 보낸다. 미리 승낙 시, 거절 시 보낼 내용을 작성해두면 편하다. 승낙한 연사에게는 추가로 결정된 사항을 답신으로 알린다. 만약 연사비가 있다면 입금받을 연사의 계좌 번호와 돌발 상황을 대비해 연사의 전화번호를 묻는다. 2. 본격적인 행사 준비 예산 마련과 대관, 연사 섭외가 끝났다면 준비의 절반이 끝났다고 해도 과언이 아니다. 이제 나머지 절반 동안 할 일을 알아보자. 연사와 소통하기 연사와 소통하는 채널을 만든다. 연사 컨텍 전에 미리 만들어두고 승낙 시 답신에 소통 채널을 알리면 깔끔하다. 소통 채널은 다음의 이유에서 페이스북 비공개 그룹을 추천한다. 페이스북 계정만 있다면 준비팀 전원과 연사가 모두 접근할 수 있다. 몇 명이 게시글을 읽었는지 알 수 있다. 게시글에 답글을 달거나 리액션을 할 수 있다. 페이스북 메시지로 넘어가서 개인적인 질문을 주고받기 쉽다. 모바일과 데스크톱 모두에서 접근하기 수월하다. 연사들끼리 소통하기 편하다. 메일을 통한 개별 소통은 그다지 권하지 않는다. 전체 공지 메일을 다시 열람하기 불편하고, 연사들이 같은 질문을 하면 같은 답변을 여러 번 해야 하기 때문이다. 더욱이 메일을 확인했는지도 알기 어려워서 빠른 답변이 필요한 메일은 개별로 확인 요청을 해야 해 번거롭다. 소통 채널에서는 준비를 독려하고 준비팀의 진행 상황을 알린다. 연사는 행사 당일의 주인공인 동시에 준비 기간에는 외부자이기도 하다. 연사 섭외는 무척 초기에 이루어지기 때문에 섭외 메일을 아무리 자세히 적었더라도 미처 알리지 못한 내용이나 새로 결정되는 내용이 있기 마련이다. 그러므로 연사가 불안감을 느끼지 않도록 진행 상황을 주기적으로 알린다. 연사 섭외가 완료되면 연사들을 서로 소개하는 것도 불안감을 줄이는 좋은 방법이다. 프로그램 기획하기 섭외된 연사와 발표 시간을 바탕으로 구체적인 프로그램을 기획한다. 연사의 발표, Q&A, 라이트닝 토크, 다과 및 네트워킹을 적절히 가감해 구성한다. 쉬는 시간을 간과하기 쉬운데, 프로그램을 backtiming해 프로그램 결정을 돕는 게 바로 쉬는 시간이다. 쉬는 시간은 화장실이나 근처의 편의점과 관련이 깊다. 전체 행사 시간이 2시간 내외라면 쉬는 시간이 없어도 괜찮지만 4시간을 넘어서면 집중력을 유지하기 위해서라도 쉬는 시간이 필요하다. 화장실이 협소하면 쉬는 시간을 짧게 자주 가지고 편의 시설이 멀다면 쉬는 시간을 여유 있게 잡는다. 만약 불가피하게 쉬는 시간을 길게 잡았다면 라이트닝 토크를 끼워 넣는 것도 좋은 방법이다. 발표와 쉬는 시간을 결정했다면, 그 외 시간을 어떤 내용으로 채울지 결정한다. Q&A는 한 발표가 끝날 때마다 가지기보단 모든 발표가 끝나고 몰아서 하는 게 좋다. 발표 직후 질문을 하기엔 청중들에게 생각할 시간이 더 필요하기도 하고, 발표마다 질문의 양이 다를 때 조율하기 편하기 때문이다. Q&A 시간은 1시간 전후면 무난하다. Q&A 시간이 짧다면 질문하는 시간을 아끼고, 더 많은 사람이 궁금할 질문을 우선하도록 채팅이나 설문을 통해 질문을 받는다. 질문받는 플랫폼은 카카오톡 오픈 채팅이 여러모로 편하다. 많은 사람이 앱을 설치해 있고, 익명으로 채팅할 수 있기 때문이다. 다과 및 네트워킹은 준비에 가장 어려운 부분이다. 먼저 다과를 마련할 예산이 있어야 하고 당일에 적절히 음식을 배분할 일손이 필요하다. 물론 음식이 없이 네트워킹 자리를 마련할 수도 있지만, 같이 음식을 먹음으로써 네트워킹의 어려운 부분인 아이스브레이킹이 자연스럽게 시작되므로 시간이 절약되는 측면이 있다. 행사 사진을 SNS에 공유하는 작은 이벤트를 열어도 좋다. 참석자의 지루함을 해소하고 참여하지 않은 사람들에게 현장 분위기를 전하는 기능을 한다. 준비팀은 당일에는 정신이 없어 전체 분위기를 읽기 힘든데, 나중에 SNS로 공유된 내용을 보고 참석자의 반응을 볼 수 있기도 하다. 디자인하기 행사에는 다양한 디자인 작업이 필요하다. 디자인 작업은 크게 BI(Brand Identity) 디자인, 웹용 이미지 다자인, 오프라인용 디자인으로 나뉜다. 주로 웹용 디자인은 홍보 기간에, 오프라인용 디자인은 당일에 사용된다. 디자인이 필요한 작업물을 열거하면 대략 다음과 같다. 준비 기간에 필요한 것들 SNS 계정의 프로필 사진과 헤더 이미지 웹용 홍보 티저 웹용 홍보 포스터 당일에 필요한 것들 출력용 홍보 포스터 스티커 및 굿즈 명찰 엑스 배너 현수막 식순지 프로그램 진행 시 띄울 슬라이드 참석자 체크용 팔찌나 도장 웹용 이미지는 플랫폼마다 최적 사이즈가 다르므로 이미지 사이즈 가이드 글을 참고해 제작한다. 각 플랫폼별로 최적의 이미지 비율도 다르므로 비율과 관계없는 스타일로 메인 그래픽을 구성하면 디자인을 못 하는 팀원도 베리에이션을 만들기 수월하다. 오프라인용 디자인 제작물은 대관에 영향을 받는다. 대관 장소를 미리 답사해 어떤 크기의 현수막이 필요하며, 동선상 어디에 몇 개의 포스터를 붙여야 행사장으로 진입하기 쉬울지 파악한다. 화장실이나 정수기 같은 편의 시설이 찾기 어렵게 되어있다면 팻말을 만든다. 행사가 4시간 이상이라면 각 프로그램 순서와 시간을 참석자가 외우기는 어렵다. 특히 쉬는 시간에 맞춰 착석하지 않으면 분위기가 어수선해지므로, 식순지를 제작해 입장 시 배포하면 차질을 줄일 수 있다. 자주 묻는 와이파이 정보와 화장실 위치도 적을 수 있다면 식순지에 같이 기재한다. 행사 시작 전, 오리엔테이션, 쉬는 시간에 띄울 슬라이드도 제작한다. 시작 전에 띄울 슬라이드에는 꼭 와이파이 정보를 기재한다. 쉬는 시간에 띄울 슬라이드에는 쉬는 시간이 끝나는 시간을 크게 기재한다. 오리엔테이션에는 기획 의도, 전체 프로그램 소개, 연사 소개, 스텝 소개를 포함한다. 모든 슬라이드는 테마를 통일해 일관되게 제작한다. 유료 행사라면 참석 신청을 한 사람인지 검사할 방법을 마련한다. 주로 팔찌나 도장을 사용한다. 사소해 보이지만 참석자들이 곧잘 사진 찍는 부분이므로 신경 써서 디자인한다. SNS 계정 운영하기 참석자에게 행사를 홍보하고 공지할 SNS 계정이 필요하다. 참석자의 성향이나 행사 주제에 따라 페이스북 페이지, 트위터, 인스타그램을 활용한다. 페이스북은 게시글을 너무 자주 올리면 오히려 사람들이 흥미를 잃어버리지만, 트위터는 자주 트윗을 올려야지 잊히지 않는 차이가 있다. SNS 계정은 행사 시작 2-3주 전에 오픈하면 무난하다. 이 계정에는 간략한 행사 소개, 연사 소개, 신청 방법을 공지한다. SNS 계정은 어조나 공지 시점을 통일하기 위해서 한사람이 관리하면 좋다. 나아가 디자인을 담당하는 팀원이 SNS 계정을 담당하면 홍보용 이미지 제작과 게시글 업로드 스케줄을 알아서 관리할 수 있으므로 일이 한결 매끄럽다. SNS에는 시간 순서대로 다음의 내용을 올린다. 티저 포스터 행사의 취지와 일시, 장소, 간략한 신청 방법과 신청 일시 연사와 프로그램의 상세한 소개 구체적인 신청 방법 신청 시작 공지 신청 마감 공지 행사 시작 전 공지 계정을 처음 만들고 티저 포스터로 홍보할 때는 행사 이름 외의 구체적인 정보를 아예 언급하지 않는다. 티저 게시글에 몇 가지 자세한 정보를 언급하면 이야기하지 않은 다른 세부사항에 대해 문의가 많이 들어온다. 티저로 어느 정도 팔로워를 모은 후 행사의 구체적인 내용을 밝힌다. 이때는 모든 내용을 한 포스팅에 담도록 한다. 사람들의 타임라인에는 홍보용 게시글뿐만 아니라 친구들의 소식이나 뉴스 기사 등 많은 이야기가 올라온다. 이 타임라인에 행사 정보가 각각 따로 올라오면 혼란을 가중하고 집중력을 떨어트린다. 여기에는 다음의 내용을 넣는다. 행사 이름 의도와 목적 연사 리스트와 대략적인 발표 주제 대략적인 프로그램 구성 참가 대상자 참가 가능 인원 행사의 날짜와 시간 행사 장소(주차 가능 여부) 신청을 받는 날짜와 시간 문의할 창구 유료 행사라면 아래 내용을 추가한다. 입장료 환불 기한 환불 수수료 만약 티저 포스터로 팔로워를 많이 모으지 못했다면 비슷한 관심사의 사람들이 모인 페이스북 페이지에도 위 내용을 공유한다. 공유할 페이스북 페이지 목록을 미리 작성해두면 동시에 홍보 글을 올릴 수 있어 깔끔하다. 정식으로 홍보한 후엔 참가 신청일과 시차를 고려해 구체적인 정보를 올려 사람들에게 잊히지 않도록 한다. 연사의 이력, 구체적인 프로그램의 순서, 굿즈 사진이나 이벤트 소개도 좋다. 행사 시작이 1-2주 앞으로 다가오면 참석 신청을 받는다. 티저 홍보나 구체적인 프로그램 소개는 상황에 따라 생략할 수 있지만, 정식 홍보와 참석 신청은 꼭 간격을 두고 별개로 올린다. 홍보와 동시에 신청을 받으면 게시글을 올린 시간에 SNS를 보고 있던 사람들부터 선착순으로 마감되기 때문이다. 정식 홍보 글에 신청 오픈 시간을 공지해 참석을 희망하는 사람들이 시간에 맞춰 신청할 수 있도록 한다. 신청이 마감된 후엔 빠르게 마감 공지글을 올려 추가 신청이 없도록 한다. 특히 유료 행사는 추가 입금된 금액을 환불 해줘야 하므로 신속히 공지글을 올린다. 추가 신청된 사람들에겐 개별로 연락해 상황을 알려 혼선이 없도록 한다. 시작일이 다가오면 환불과 양도 문의가 종종 들어오므로 신청 마감 후 3일 이내에 해당 내용도 공지한다. 행사 전날이나 당일 아침에 다시 한번 일시와 장소를 알리는 게시글을 올린다. 이때는 대중교통을 이용하는 사람과 운전해오는 사람을 위해 오는 길과 주소를 구체적으로 적는다. 참석 신청받기 신청은 온오프믹스, nvite, Google 폼을 사용해 받는다. 온오프믹스는 다양한 결제 수단을 지원해서 좋지만, 카드 수수료와 서비스 수수료가 차감되고 입금이 행사 종료 후에 이루어지는 단점이 있다. 반면 스텝의 통장으로 입장료를 받으면 금액은 바로 들어오지만 일일이 입금 확인을 해줘야 하고, 영수증 처리가 어렵다. 온오프믹스는 참석자의 이름, 소속, 핸드폰 번호와 이메일을 제공한다. 따라서 주최자가 참석자에게 개인정보를 요구하지 않아도 된다. 그러나 중간 플랫폼을 거치지 않고 통장으로 바로 입금을 받으면, 입금자의 이름과 동명이인을 확인하고 비상시 연락을 위해 핸드폰 번호나 이메일 주소를 물어야 한다. 그 외 참가자의 소속이나 관심사 등을 물을 수도 있다. 그러나 깊은 생각을 요구하는 주관식 질문은 참석 신청 폼에 넣지 않는다. 선착순 마감되므로 양질의 답변을 받기 어렵기 때문이다. 참석 신청을 완료하면 체크인에 사용할 수 있도록 참석자의 이름과 핸드폰 번호, 그 외 양도나 환불, 비고 사항을 구글 스프레드시트로 정리한다. 또한, 신청이 마감되더라도 중간에 환불이 발생하므로 대기자 리스트도 정리한다. 환불이 발생하는 즉시 대기자에게 연락해 참석자 일정에 무리가 없도록 한다. 지출 항목 관리 예산을 초과하지 않도록 지출 항목 관리도 중요하다. 전체 예산과 각각의 지출 내용을 구글 스프레드시트로 만들어 준비팀 누구라도 접근할 수 있게 한다. 이 시트는 다음의 내용을 기재해 정산을 쉽게 한다. 전체 예산 지출한 내용 종류와 수량 지출한 금액 지출한 일시 지출한 사람 정산 여부 비고 사항 지출이 발생하면 즉시 시트에 내용을 업데이트해 누락이 없도록 한다. 3. 행사 일주일 전 행사가 일주일 앞으로 다가오면, 전반적인 사항들을 점검한다. 일주일 전엔 거의 모든 준비를 마치고 당일 상황을 처음부터 끝까지 머릿속으로 상상할 수 있어야 한다. 디자인 작업물의 배송 상황 체크 디자인 작업물은 여유롭게 행사 2주 전에 발주를 넣는다. 따라서 일주일 전에 하나둘 배송을 받는다. 만약 일주일 전까지 배송을 시작하지 못했다면 업체에 전화해 제작과 배송 상황을 알아보고, 직접 수령하거나 퀵 서비스를 이용할지 결정한다. 부피가 큰 물건은 대관 장소에 양해를 구해 가능하다면 바로 행사장으로 배송을 시키는 것도 방법이다. 체크인 데스크 기획 대관한 장소에 가서 참석자들이 어디로 들어오고, 어떻게 신청 여부를 확인하며 어디서부터 착석하게 될지를 미리 파악한다. 극장처럼 입구와 자리가 명확히 구분되어 있으면 체크인이 수월하지만, 공간이 넓고 동선이 명확하지 않으면 참석자가 도착해 헤맬 수 있다. 체크인이 늦어지면 프로그램 시작도 같이 늦어지므로 참석자나 준비팀 모두 허둥지둥하지 않도록 정확한 동선 기획이 필요하다. 팻말과 엑스 배너를 사용해 행사장의 입구를 분명히 알리고, 입구 초입에서 도착하는 사람들에게 인사를 건네고 체크인 데스크로 안내할 인원을 배치한다. 체크인을 맡는 사람은 신청자 목록이 정리된 스프레드시트를 켜두고 신속하게 참석자 체크를 한다. 체크인 데스크가 붐비기 시작하면 행사의 첫인상을 망치므로 여력이 된다면 체크인은 두 명이 하도록 한다. 준비물 리스트 작성 행사장에 필요한 준비물을 챙기고, 누가 어떤 물품을 맡아 가져올지 담당자를 정한다. 대게 굿즈나 현수막 같은 큰 제작물은 잊지 않고 챙기지만, 펜이나 테이프같이 사소한 물품은 빠뜨리기 쉬우므로 주의한다. 특히 프로젝터 연결선이나 마이크 선은 대체로 대관 업체가 보유하고 있지만, 맥용 젠더나 USB-C타입 젠더는 없을 수도 있다. 행사 시작을 앞두고 노트북 연결이 안 되면 큰일이므로 미리 체크한다. 다음은 일반적으로 필요한 물품 목록이다. 체크인 데스크에 둘 노트북 1-2대 프로그램 진행 시 프로젝터에 연결할 노트북 1대 노트북과 프로젝터를 연결할 젠더 핸드폰과 노트북 밧데리 돌발 상황시 파일을 옮길 USB 펜 종이 혹은 노트 테이프 연사와 스텝이 마실 물 현수막 엑스 배너 엑스 배너 거치대 팻말 스티커 및 굿즈 식순지 이름표와 명찰 신청 확인용 팔찌나 도장 현금 행사 종료 후 정리할 쓰레기봉투 연사들의 준비 독려 연사도 사람이기 때문에 일주일 전 즈음부터 발표 자료를 만들기 시작할 가능성이 높다. 대체로 일주일이면 발표 준비를 하기에 문제는 없지만, 더 미루면 서로의 마음이 급박해지므로 독려를 위해 행사가 일주일 남았음을 한번 공지하도록 한다. 그러나 준비팀이 연사의 발표를 미리 검수하거나 직접 독촉하는 것은 좋지 않다. 준비팀이 연사를 오롯이 믿어야 연사도 책임감을 느끼고 발표를 준비할 수 있으므로 발표의 내용과 구성은 전적으로 연사에게 맡긴다. 이즈음에는 연사 지인을 초대할 수 있다면 미리 지인 리스트를 받고 지인을 초대할 수 없다면 이 사실을 분명히 공지한다. 더불어 연사는 다른 참석자보다 30분 정도 일찍 도착해주시기를 부탁한다. 노트북과 프로젝터 연결을 사전에 확인하기 위함이다. 전체 프로그램 진행 준비 프로그램을 진행할 스크립트를 준비한다. 슬라이드와 스크립트는 진행을 담당할 호스트가 준비한다. 첫인사는 행사장까지 찾아온 청중들에게 감사 표시와 자기소개로 시작한다. Q&A 세션이 있다면 프로그램이 정식으로 시작하기 전에 질문을 올릴 플랫폼을 소개하고 바로 접속하게 유도한다. 발표 중간에는 질문이 떠올라도 접속하는 방법을 까먹기 쉽고 다시 설명을 듣기도 어렵기 때문이다. 발표 자료 공유 여부, 영상 촬영 불가와 같은 유의 사항, 화장실 위치도 오리엔테이션에서 공지한다. 쉬는 시간이 시작할 때는 앞 프로그램의 내용을 간략히 요약하고 쉬는 시간이 끝나는 시간을 알린다. 마찬가지로 쉬는 시간이 끝나면 자연스럽게 착석을 유도하고 다음 프로그램을 소개한다. Q&A 세션에서는 취합된 질문을 어떻게 슬라이드에 띄우고 누가 질문을 읽으며 답변은 어느 순서로 돌아갈지도 미리 계획한다. 질문이 충분히 나오지 않을 경우를 대비해 준비팀이 미리 질문을 예비해둔다. BGM 선곡 시작 전과 쉬는 시간에 음악을 틀어놓으면 행사장의 소란을 줄이고, 참석자에게 좋은 인상을 줄 수 있다. 참석 대상을 고려해 무난한 음악으로 10곡 정도를 선곡한다. 선곡한 노래는 꼭 컴퓨터에 저장해둔다. 100명이 동시에 한 와이파이에 접속하므로 스트리밍이 끊길 수 있기 때문이다. 현장 스텝 섭외 준비와 달리 당일에는 일손이 많을수록 좋다. 대관 장소에 따라 의자를 새로 배치하거나 현수막을 다시 걸어야 한다. 일손이 부족하면 시작이 늦어지거나 참석자들의 문의에 빠른 응대가 어려우므로 준비팀을 포함해 총 7-10명 정도가 필요하다. 현장 스텝 중 한 명은 현장 스케치에 몰두한다. 공식 계정을 트위터에 만들었다면 현장의 사진을 실시간을 찍어 올리는 스텝을 두어도 좋다. 4. 행사 당일 드디어 고대하던 행사 날이 되었다. 행사 당일 업무는 크게 시작 전, 진행 중, 종료 후로 나뉜다. 각각 어떤 일들이 있는지 알아보자. 행사 시작 전 준비팀과 현장 스텝은 시작하기 1-2시간 전에 모여 준비물을 점검하고 행사장을 세팅한다. 행사장 안팎으로 포스터와 팻말, 엑스 배너를 설치하고 현수막을 걸고 의자를 재배치한다. 프로그램 진행 중에 연사와 스텝이 앉을 곳도 마련해둔다. Q&A를 받을 채팅방도 개설한다. 노트북과 프로젝터 연결이 잘 되는지 음향과 마이크에 문제는 없는지 확인한다. 한편에서는 체크인 데스크의 동선이 매끄러운지 시뮬레이션해본다. 연사들이 도착하면 서로 소개하고, 명찰을 나눠준다. 전체 스케줄을 다시 한번 알리고 연사들의 발표 자료가 문제없이 띄워지는지 점검한다. 노트북 확인이 끝나면 준비한 슬라이드와 BGM을 틀어둔다. 행사 시작 30분 전부터는 참석자들이 속속 입장하므로 장내 세팅이 덜 끝났더라도 체크인 데스크는 어수선하지 않게 미리 준비해두도록 한다. 체크인을 시작할 즈음부터 현장 스케치도 같이 시작한다. 행사 진행 예정된 행사 시작 시각에 체크인 상황을 파악해 절반 이상이 도착했다면 바로 시작하고 그 이하라면 미리 온 참석자에게 양해를 구하고 5분에서 10분 정도 지연한다. 행사 시작을 알리는 오리엔테이션이 끝나고 연사 발표가 시작되면 준비팀은 역할에 따라 늦게 도착한 참석자 체크인, 채팅방에 올라오는 질문 취합, 현장 스케치, 현장 사진 SNS에 게시, 발표 내용 요약을 한다. 각자의 역할만 잘 배정되어있다면 진행은 오히려 쉽게 흘러간다. 행사가 시작된 후에도 체크인 데스크는 한두 명이 지키고 있어야 한다. 대게 40%의 참석자는 프로그램 시작 후에 입장하며, 프로그램 중간에 발생하는 돌발 상황을 최대한 신속하게 처리하기 위함이다. 늦게 도착한 참석자들은 규정에 따라 조용히 입장하도록 돕거나 다음 프로그램 시작 전까지 데스크에서 대기할 수 있도록 한다. 오리엔테이션이 끝나고 연사 발표가 시작되면 호스트는 시간을 잘 보고 발표가 예정된 시간을 넘어서거나 일찍 끝나지 않는지 주의를 기울인다. 발표가 길어지거나 짧을 경우엔 유동적으로 쉬는 시간을 조절해 전체 스케줄에 영향을 미치지 않게 한다. 쉬는 시간이 시작되면 역시 준비한 슬라이드와 BGM을 틀어두고 앞선 프로그램의 요약과 다음 프로그램 시작 시각을 알린다. 채팅방에 올라오는 질문은 한 명이 실시간으로 취합해 미리 제작된 슬라이드 테마에 바로 작성한다. Q&A 세션 시작 전까지 질문이 정리된 슬라이드를 전달할 수 있도록 신속히 정리한다. 현장 스케치는 앞에 서 있는 사람뿐만 아니라 참석자들의 사진도 많이 남긴다. 행사가 끝난 후에 사진에 찍힌 자신의 모습을 발견하는 건 누구에게라도 기쁜 일이기 때문이다. 그러나 반대로 SNS에 올리는 사진에 참석자의 얼굴을 올리는 건 사람에 따라 민감할 수 있으므로 발표하는 모습, 행사장 전반의 느낌을 위주로 촬영한다. 행사 종료 모든 프로그램이 끝나면 종료를 안내하고 참석자들이 귀가할 수 있도록 한다. 참석자들이 행사장을 빠져나가면 정리를 시작한다. 정리에는 보통 30-40분 정도가 걸린다. 청소하면서 물건을 분실할 수 있다. 버릴 것은 신속히 버리고 챙길 것은 누가 챙길지 분명히 정해서 잃어버리거나 놓고 가는 물건이 없도록 한다. 정리까지 마치면 스텝과 연사들은 모두 녹초가 되므로 식사할 식당을 예약해두면 편하다. 4. 행사가 끝난 그 후 행사를 마치고 나면 다 끝났다는 기분이 들지만, 아직 몇 가지 처리할 일들이 남아있다. 연사비 입금 연사비가 있다면 행사 종료 후 바로 입금한다. 입금자 메시지에는 행사 이름을 넣어 이체 기록을 확인하기 쉽게 한다. 만약 입금 시점이 늦어진다면 입금될 날짜와 늦어지는 이유를 분명히 연사에게 이야기하고 양해를 구한다. 행사 종료 글 공지 공식 SNS에 행사를 종료했다는 후기 글을 올린다. 후기 글에는 참석자, 발표를 맡아준 연사, 도와주신 분들에게 감사 인사와 현장 스케치 사진을 포함한다. 이 후기 글은 여운이 모두 가시기 전에 올리는 게 좋지만, 행사 다음 날엔 게시글을 올리는 작은 일도 무척 고단하게 느껴지므로 미리 템플릿을 작성해두면 편하다. 사진 정리 현장 스케치한 사진들을 보정하고 공용 드라이브에 올린다. 주로 Google 포토나 Pinterest, flickr를 활용한다. 사진을 모두 정리하면 모든 사진을 공개할지 A 컷을 공개할지 정한다. 정책이 정해지면 그에 따라 SNS에 사진을 공유한다. 정산 마지막으로 모든 지출액을 정산한다. 정산된 금액은 시트에 즉시 표시해서 실수가 없도록 한다."
