full_description = "스케치에서 Apple SD Gothic Neo 폰트가 적용된 텍스트 레이어를 찾아 SF Pro Display 로 바꿔주는 스케치 플러그인을 만들었다. 행사를 개최해본 경험이 전혀 없는 사람이 맨땅에서 기획부터 실행까지 하기란 쉽지 않은 일이다. 그래서 Behance portfolio reviews를 진행했던 과정을 정리해 행사를 열고자 하는 이들에게 도움이 되고자 한다. HTML tag 스타일 중 list는 유독 작성하기가 귀찮다. 특히 불릿을 본문 텍스트와 다른 폰트로 하고 싶을때 일이 복잡해진다. 이를 쉽게 몇가지 변수만 조정하면 쓸 수 있도록 SCSS 코드를 써보았다. 며칠 전 Open color를 공개했기에 홍보 겸 간단한 설명서 겸 컬러 스킴 제작과 용처에 관한 글을 써야겠다고 계획하고 있었다. 오늘은 그중 가장 쉽게 읽히면서도 실용성이 높은 주제인 회색 사용법을 풀어보려고 한다. JavaScript, HTML, CSS 기반의 터미널 프로그램인 HyperTerm을 설치하고, 간단한 테마를 설정한다. 최근에 동료 디자이너에게 HSB의 Brightness 값이 상대적이라는 개념을 설명할 일이 있었다. 마침 비슷한 주제로 세미나를 했던 적이 있어서 그때 썼던 키노트를 활용하려고 했는데 다시 보니 설명이 충분치 않았다. 그래서 정돈된 글로 갈무리할 필요를 느꼈다. Weight가 충분치 못한 폰트로 작업을 하다 선의 굵기와 색상이 서로에게 영향을 미치는 범위가 문득 궁금해졌다. 두 조형 요소의 상관 관계를 폰트에 비추어 생각해본다. 지난 글에 이어서 아이콘용 문서를 생성하는 방법에 관해 이야기한다. 지난번에는 Slice를 이용해서 문서를 구성하는 비교적 전통적인 방식을 알아봤다면 이번 글에서는 최근에 추가된 기능인 Artboard와 Export As를 사용하는 법을 알아본다. 아이콘을 그릴 때 생성하는 문서에 관해 이야기한다. 문서야 그냥 생성하면 되지 않느냐고 할 수 있지만 조금만 신경 써서 문서를 생성하면 아이콘을 관리하거나 추출할 때 무척 편리하다."
