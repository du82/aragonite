title = "heeyeun | 아이콘 그리기<br> Photoshop or Illustrator?"
description = "사람에 따라 아이콘을 그릴 때 사용하는 툴이 다르다. 나는 Illustrator가 아닌 Photoshop으로 작업하곤 하는데 그 이유를 이야기해본다."
full_description = "음표 아이콘 그리기 포스팅을 쓴 후에 두가지 코멘트를 받았다. 하나는 일러스트레이터(이하 “일러”)로도 아이콘을 그리는 법을 포스팅 해달라는 요청과, 자신은 일러로 아이콘을 그리는게 더 쉽다는 디자이너의 의견이었다. 내가 아이콘을 그릴때 포토샵을 더 선호하는데는 다음과 같은 이유가 있다. 일러로는 정확히 Pixel Perfect한 아이콘을 그리기가 어렵다. Vector 방식과 Bitmap 방식의 차이인지 일러에서는 정수로 나눠 떨어지는 크기의 오브젝트를 그려도 한참 작업하다가 다시 보면 내가 그려놓은 크기에서 0.001px정도 움직여있는 걸 자주 발견하곤 한다. 혹은 Stroke를 정수로 지정해놓고 Outline을 따면 지정한 정수보다 약간 굵어진 다거나. Vector Shape의 조합/수정이 어렵다. 포토샵에선 한 레이어 속에 여러 Vector Shape을 Merge하지 않고 담을 수 있다. 하지만 일러에선 복수의 Vector Shape을 Pathfinder로 조합함과 동시에 Merge가 되버려서 수정이 어렵다. 한 문서를 두개의 창으로 띄워서 100% 화면과 확대된 화면을 동시에 보기 어렵다. 일러에도 한 문서를 두 창으로 띄우는 기능은 있지만, 현재 작업하고 있지 않은 (100%뷰를 보기 위한) 창에도 모든 Extras를 동시에 보여준다. 그래서 사실상 100% 창과 작업하는(확대 된) 창을 동시에 대조해 보기 힘들다. 일러스트의 랜더방식은 Bitmap 요소를 보여주는데 부적합하다. Vector 기반인 일러스트는 이미지를 랜더링할때 (당연하게도) Pixel 기반으로 보여주지 않는다. 때문에 아이콘을 아무리 확대해도 픽셀이 아닌 말끔한 외곽선으로 랜더링하고, 축소했을 때의 결과물도 실제 Pixel 기반의 아이콘을 축소했을 때와는 다른 결과물을 보여준다. 물론 Pixel Preview Mode가 없는 것은 아니나, 왜인지 그 모드에선 Snap이 동작하지 않는다. 아이콘을 사용하는 상위의 디자인 작업을 모두 포토샵으로 한다. 아이콘은 대부분 그 자체로 완결되는 것이 아니라 웹이나 앱 시안 등에 요소로써 첨가되기 마련인데, 그 상위의 디자인을 포토샵으로 한다. 때문에 아이콘도 같은 작업 환경에서 작업해두는 게 자연스럽다. Bitmap 베이스의 작업을 위해서 바꿔줘야 하는 설정이 너무 많다. 일러는 보통 출력물이나 PDF문서를 만드는데 용이하게 설정이 되어있어서 이를 Bitmap에 적합하도록 단위, View Mode, Color Mode, 각종 체크해야하는 사항들의 셋팅을 매번 바꾸고 다시 돌려놓기가 귀찮다. 그렇다고 일러스트의 기능이 포토샵보다 떨어진다고 말하려는 것은 아니다. 두 툴의 장단점이 분명히 있고 일러로만 그릴 수 있는 아이콘의 형태도 있어서 어떤 툴을 베이스로 사용하던지 보조적으로 다른 툴도 같이 사용해야 한다. 그렇지만 나는 위와같은 이유로 일러 베이스로 아이콘을 그리는 작업 과정의 효용성을 잘 이해하지 못하고 있긴 하다."
