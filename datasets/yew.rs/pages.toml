ch other reach the full potential of this exciting new technology. Draco - A Rust library for building client side web applications with WebAssembly. Percy - A modular toolkit for building isomorphic web apps with Rust + WebAssembly. Sauron - Sauron is an HTML web framework for building web-apps. Seed - A Rust framework for creating web apps. Smithy - A framework for building WebAssembly apps in Rust. Dioxus - Elegant React-like library for building user interfaces for desktop, web, mobile, SSR, liveview, and more. Sycamore - A reactive library for creating web apps in Rust and WebAssembly. Related lists​ Awesome Rust and WebAssembly - A list of awesome Rust and WebAssembly projects, libraries, tools, and resources. Awesome WebAssembly - Collection of awesome things regarding WebAssembly ecosystem. Awesome Rust - A curated list of Rust code and resources. Edit this page"
