full_description = "About me I am Yide Liu (刘一得), currently working as a Postdoctoral Researcher at Tsinghua University. E-mail: yide_liu[at]mail.tsinghua.edu.cn; yide_liu[at]zju.edu.cn My primary focus is on the BioARS project, which stands for Bionic Assembly Robotics System. The goal of this project is to develop a swarm of intelligent robotic insects capable of reconfiguring into various forms, including a quadruped robot, to enhance adaptability in different environments. My research interests include: High-performance robotic insects Origami transmission mechanisms Small parallel robots Central pattern generator (CPG) The roadmap of my research is illustrated here: Honors, awards, and recognitions [2023] RSS Pioneers 2023 - Robotics: Science and Systems Conference [Link] [PDF] [2021] Zengqi Lu Outstanding Ph.D. students award - State Key Laboratory of Fluid Power and Mechatronic Systems, Zhejiang University [2018] Excellent thesis - Harbin institute of Technology Education Ph.D., Zhejiang University in Mechanics (September 2018 - July 2023) Thesis title: Structure design and bionic control of micro robots and assembly system Advisor: Prof. Shaoxing Qu B.Eng., Harbin Institute of Technology in Mechatronics (September 2014 - July 2018) Thesis title: Bistable rotating mechanism based on dielectric elastomer actuator Advisor: Prof. Jihong Yan Publications * for corresponding author ,# for equal contribution Robotics[4] Yide Liu, Bo Feng, Tianlun Cheng, Yanhong Chen, Xiyan Liu, Jiahang Zhang, Shaoxing Qu, and Wei Yang. (2024). Singularity Analysis and Solutions for the Origami Transmission Mechanism of Fast-Moving Untethered Insect-scale Robot. IEEE Transactions on Robotics, 40. 777-796. [Link] [PDF] [3] Yide Liu, Yanhong Chen, Bo Feng, Dongqi Wang, Taishan Liu, Haofei Zhou, Hua Li, Shaoxing Qu, and Wei Yang. (2022) S2worm: A Fast-moving Untethered Insect-scale Robot with 2-DoF Transmission Mechanism. IEEE Robotics and Automation Letters, 7(3), 6758-6765. [Link] [P