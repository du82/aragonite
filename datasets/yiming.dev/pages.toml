["https://yiming.dev/blog/2017/02/05/why-i-give-up-wubi"]
title = "Why I give up Wubi - Yiming Chen"
description = "我为什么在使用五笔两年后回到了拼音输入法"
full_description = "Why I give up Wubi 为什么学习五笔 记得那是 15 年的寒假，我在用着双拼，但还是想尽可能提高自己打字的速度，先看上了 Dvorak Keyboard Layout。但是考虑到 Dvorak 的确太小众，又没有合适的双拼输入法，因此放弃了学习。之后就把目标瞄上了五笔。 学习五笔大概为了以下三点： 重码率低五笔的重码率和双拼、全拼比起来真是低到不知道哪里去了。我现在使用五笔打字可以做到 几乎 不用看候选框 组词容易五笔可以通过一个词中所有字的前几个码位来打出这个词。这样子的输入方式类似全拼的只打声母来组词的方法很像，同时乍一看上去准确率也不低。 打字节奏 我很喜欢双拼的一点是：双拼的打字节奏是固定的，每两个码位可以对应一个字。这样子在打字时会很有规律。 五笔的节奏在刚学习时也是很明显的：四码一个字。 为什么放弃五笔 而在我使用了一年多五笔之后，我发现上面三点其实都不成立，而且五笔还在其他方面不如全拼，所以我自然而然地回到了全拼。 打字节奏 一开始学习五笔时误以为每个字都可以通过四码打出来，之后发现有很多字型简单的字只需要拆成两个码或者三个码就可以了。而有些常用字更是只用一码就可以打出来了。 这就造成了五笔在打字节奏上并不如双拼。 当然，通过加最后一画的识别码和空格能再加一码，但节奏依然是一、三、四变换。 开启四码上屏功能后，四码字能不按空格上屏，一、三码字则需要，依然很不统一。 组词容易 这在一开始是五笔的优点，但是使用的多了之后，我发现这反而是五笔的缺点。因为这个功能会 增加 打词组时的重码率。每增加一个词组，都给这个码新增了一个词，可能是五笔组词法的缺陷，很多词码是一样的，到了后期，几乎每次打词都要看候选词，这反而降低了打字的效率。以至于我到后来都强迫自己去打单字。 而打词组，恰恰是拼音的强项，拼音在单字时的重码率很高，但是在词组的情况下重码率迅速降低，在使用 Rime 这样为打句子而设计的输入法时，需要选词的情况也没有那么多了。 另外，五笔的造词规则也决定了它和拼音不同，词组的码和词组每个字分别打的码的和是不一样的，这样每次打词时还是要去想怎么组词，无形中又增加了打字时的负担。 重码率低如上所说，五笔的词组规则反而让五笔的重码率提高了，也就是说使用五笔依然要在某些时候看候选框，这在习惯了不看候选框打字之后是不太好接受的。还不如回到拼音大部分时候都要看着候选框这样统一的行为中来。 另外五笔这样小众的输入法相比拼音还有很多劣势： 错别字难以理解 对使用拼音的人来说（甚至对使用五笔的人来说也是），五笔的错字是无法理解的。因为这些错字最多也是在字型上和原字相似。 而拼音的错字则很好理解，因为往往字音是相似的。 没有合适的手机输入法 iOS 上几乎没有好用的五笔输入法，最近听说落格输入法1不错，可惜手头没有合适的设备测试。 Android 上之前我用的是触宝输入法。其实我一直是触宝的粉丝，从 Android 2.1 时代就开始使用它了，还记得当时的它是多么单纯又不做作。而现在每天都弹出广告，还做了很多与输入无关的功能（App Lock, Smart Lock 等等），太让我失望了。 而 Google 输入法又不支持五笔。相反，Google 拼音输入法对拼音的支持很到位，滑动输入更是优秀，而且性能也比触宝好上一大截。可以说，Google 拼音输入法是我从五笔转回拼音的一大诱因。 学习曲线太陡峭 我在电脑和手机端使用了快两年的五笔，仍然不能对所有的字都能流畅地拆字。时不时地依然要通过拼音反查五笔字码。这是让我最无法接受的。 当然，这可以说是我打字不够多造成的。但如果我打字不够多，那我何必花费时间精力去优化这个小问题呢？特别是在有一个不错的解决方案的情况下。 与英文输入配合不好 我经常需要进行中英文混输，但是在五笔输入的情况下，切换到英文的消耗实际上远远大于拼音，因为要从字型输入转到字音输入。 而五笔的输入码少这个优势此时也成为了一项弱势，因为英文输入是几乎不能简化的（当然可以通过 Plover 输入法提高，但不适合非母语用户）。因此，打字速度非常重要。使用五笔让我的打字速度在一定程度上降低了，这其实对英文输入越来越多的我来说是比较不利的。 不符合日常输入直觉 五笔是基于字型的输入法，这让它在文字录入上比拼音有很大的优势。因为对着字型进行输入时，只要进行拆字就可以了。 但是我们日常的聊天、写作都不是文字录入工作，进行五笔输入时往往要经过字音到字型再拆字，这三个步骤。在没熟练到能像写字一样进行五笔输入时，效率是比不上拼音的。因为拼音只用字音一个步骤。 我对五笔的定位 说了这么多，再谈谈我对五笔的理解和定位。 我觉得： 输入法就是码表和目标字族（包括汉字、片假名等等）的对应函数 五笔就是使用人脑计算替代大部分计算机计算的输入法 为了达到低重码率、选词准确，五笔把大部分计算的任务（拆字、组词）交给人来完成，这在计算机计算能力有限的情况下是很了不起的创举。 但在计算能力不断提升的今天，词频调整能由输入法很好地完成的时候，五笔对我们日常使用的意义也就没那么大了。而我日常的中文输入量又满足不了熟练掌握五笔的要求，回到全拼（锻炼打字速度）也就是我自然而然的选择。 当然，五笔还是有它的价值的，对需要进行大量文字录入的记录员来说，五笔还是比全拼好上很多的输入法。而五笔之上又有并击，不过那离我们又更加遥远了。 References 选择输入法的哲学：兼论双拼的优缺点 - 少数派 五笔未死，只是凋零 - 爱范儿 Footnotes: 1 iOS 上简洁强大的双拼输入法：落格输入法测评 - 少数派"
