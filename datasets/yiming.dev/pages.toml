["https://yiming.dev/blog/2017/05/12/my-review-of-POODR"]
title = "My Review of Practical Object-Oriented Design in Ruby - Yiming Chen"
description = "My summary of POODR and why I think it's the best book about OOD."
full_description = "My Review of Practical Object-Oriented Design in Ruby Practical Object-Oriented Design in Ruby is the best book about Object-Oriented Design I've ever read. I finished reading this book in January, but I spent several hours in April again to read it again. It's the first book (except textbooks) I have read for more than once. I highly recommand that everyone who wants to learn Object-Oriented Programming or Object-Oriented Design to read this book. Here is my summary for it and some random thoughts. Summary This is a really well-structured book, started from how to write a good class to how to make different classes working together nicely. It's like a great code repo: every chapter serves one and only one single purpose, and all of them are combined together into a working whole piece. No wonder why people say that writing good software is like writing a book. You can know if one is a good developer by reading his/her book. Basically, Sendi Metz taught us how to write well-structured software by taking a bottom-up approach: Object-Oriented DesignAn introduction to OOD. Why do we need to do OOD? What is OOD? When to do OOD? How to do OOD? Designing Classes with a Single ResponsibilityThis chapter is about how to code a well-designed, easy-to-change class. Managing DependenciesHow to manage dependencies for a class. Creating Flexible InterfacesHow to design interfaces for a class. Reducing Costs with Duck TypingHow to recognize and exploit duck types to make the application more flexible and easier to change. Acquiring Behavior Through InheritanceHow to properly use inheritance or how to build a technically sound inheritance hirarchy. Sharing Role Behavior with ModulesHow to use an alternative inheritance way (modules) to share a role. Combining Objects with CompositionHow to use composition to model a has-a relationship. Designing Cost-Effective TestsHow to write cost-effective tests. Some random thoughts OOD is truly an old topic in the computer science world. I'm surprised how people in 1980s had explained it well1. But it's really hard to design our code well using OO techniques. Because our world is changing so fast, so do the requirements to our software. Making a good design requires us to know all the theories and use our existing experiences as much as possible. When we finish the implementation, our experiences grow, which means we might get a better design in our mind after the whole design process. But due to the cost of switching implementations, we might not be able to switch to the new design. To prevent this kind of things happening, we need to keep things simple2, only simple things are easy to read, understand and change. Design, implement, refactor. This loop reminds me of the TDD loop: red, green, refactor. RedMaking a test fail is the design stage. We cannot write a test if we don't have a design in our mind. GreenMaking a red test pass is the implementation stage. Refactor This is the most important stage through the whole TDD loop in my opinion. Like our customers, who can't define the software until they see it, we as software developers can hardly see the whole picture before we finish the whole thing. I usually find that I have a new, better design after the implementation finished. Here is where refactor comes in and saves the world. But refactor is also a really big topic. I also wrote a review of Refactor by Martin Fowler. Some final words POODR is really a great book. I don't know how to use my word to praise it properly. So, just go and read it. BTW, Sandi Metz is also a great speaker, here are some talks I watched: Baruco 2013: Rules, by Sandi Metz - YouTube RubyConf 2014 - Madam Sandi Tells Your Future by Sandi Metz - YouTube Rails Conf 2013 The Magic Tricks of Testing by Sandi Metz - YouTube RailsConf 2016 - Get a Whiff of This by Sandi Metz - YouTube GORUCO 2009 - SOLID Object-Oriented Design by Sandi Metz - YouTube RailsConf 2014 - All the Little Things by Sandi Metz - YouTube Footnotes: 1 Designing Reusable Classes 2 Simple Made Easy"
