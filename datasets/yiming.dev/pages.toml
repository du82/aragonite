["https://yiming.dev/blog/2016/04/25/develop-in-docker-i-virtualbox-file-syncing-bug"]
title = "Develop in Docker I: Virtualbox file syncing bug - Yiming Chen"
full_description = '''Develop in Docker I: Virtualbox file syncing bug Docker is a great tool for deployment. And I want to develop my Flask app in Docker so that I can get the same environments as the production environments. Bug description But I went into this bug: When I first mount a directory into a container, everything works fine. After I change some code, the container aborted with a syntax error. Then I attach into the container and see what happened. When I use vim to open the "syntax error" file, everything seems to be fine. When I use cat to get the file content. Then change I made to this file appeared at the end of this file instead of the place I wanted it to be. After some search, it seems to be a virtualbox bug: File mount does not update with changes from host · Issue #15793 · docker/docker #14920 (VboxSF volumes mounted in Docker containers do not update file contents) – Oracle VM VirtualBox #9069 (shared folder doesn't seem to update) – Oracle VM VirtualBox But this bug may not appear on everyone's machine. At least in this post1, the speaker can get the file syncing correctly, I don't know if this is due to she didn't do any deletion. (If you are also interested in developing in Docker, you should read this post too) Solution The solution is simple: Just don't use virtualbox as the docker running virtual machine. Use xhyve instead, which is also the VM used by the new Docker for Mac2. You can also check out this post3 about Docker for Mac. And here is my post4 about using xhyve as the Docker client host VM. Footnotes: 1 Using Docker for Rails Development - via @codeship | via @codeship 2 Docker for Mac and Windows Beta: the simplest way to use Docker on your laptop | Docker Blog 3 First Touch Down with Docker for Mac · Docker Pirates ARMed with explosive stuff 4 use-xhyve-as-Docker-client-host'''
