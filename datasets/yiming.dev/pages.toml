title = "How do I use org-capture on Mac - Yiming Chen"
full_description = '''How do I use org-capture on Mac org-capture is one of the most powerful feature of Org-Mode. It lets me capture my todo items and notes really quickly. Someone even use org-capture to capture Chinese words and build flash cards. Here is how I use org-capture. The most basic one is Task, which captures a todo item and save it to my refile.org file. You may wonder what are %a and %t do in my templates. %a will add a link to current file into the capture content %t will add a timestamp %^{} will prompt for content You can even eval some elisp code using %() I have two different ways to grab a link from Chrome. org-mac-chrome-insert-frontmost-url, this is a function from org-mac-link package. This package use some apple scripts to grab links from some applications, such as Safari, Chrome, Skim. But these scripts don't work well when you have multiple windows of the same app opened. And it can also cause Emacs hanging. Use org-protocol, which is a great way to capture links. But the emacs installed from homebrew can not handle org-protocol links, you need to install the emacs-mac from emacs-mac-port. Then I use a script to open a org-protocol link in Chrome. orgCapture(key) -> {{ location.href = 'org-protocol://capture://' + key + '/' + encodeURIComponent(location.href) + '/' + encodeURIComponent(document.title) + '/' + encodeURIComponent(window.getSelection()) }} Emacs will deal with this link and choose which template I want to use. Here are my templates (setq org-capture-templates '(("t" "Task" entry (file "~/Org/refile.org") "* TODO %?\n") ("T" "Clock-in Task" entry (file "~/Org/refile.org") "* TODO %?\n" :clock-in t :clock-resume t) ("d" "Distraction in a pomodoro" entry (file "~/Org/refile.org") "* TODO %^{Task}\n SCHEDULED: %t\n" :immediate-finish t) ("n" "Note" entry (file "~/Org/refile.org") "* %?\n") ("l" "Note with link to current file" entry (file "~/Org/refile.org") "* %a") ("j" "Journal" entry (file+datetree "~/Org/diary.org") "* %^{Content}\n" :clock-in t :clock-resume t) ("J" "Journal from Phone" entry (file+datetree "~/Org/diary.org") "* %^{Content}\n :LOGBOOK:\n CLOCK: %^{Begin}U--%^{End}U\n :END:") ("c" "Link from Chrome" entry (file "~/Org/refile.org") "* %(org-mac-chrome-get-frontmost-url)") ("C" "Clock-in Link from Chrome" entry (file "~/Org/refile.org") "* %(org-mac-chrome-get-frontmost-url)" :clock-in t :clock-resume t) ("p" "People (Contacts)" entry (file "~/Org/contacts.org") "* %(org-contacts-template-name)\n :PROPERTIES:\n :EMAIL: %(org-contacts-template-email)\n :END:") ("k" "Push to Kindle" entry (file+headline "~/Org/refile.org" "Push to Kindle") "* %a" :immediate-finish t) ))'''
