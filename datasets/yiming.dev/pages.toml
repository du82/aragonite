full_description = '''我看程序语言的历史、现在与将来 本文是我的本科毕业论文，限于时间等因素，深度、广度有限，但也算是我大学五年学习的一个总结： 程序语言的发展是一个不断抽象的过程，提高效率是我们写程序的一个重要目标。 前言 程序设计语言作为计算机科学领域的一个重要工具，伴随着计算机科学的发展不断进步，已有几十年的历史。在这几十年的历史中，各式各样的程序设计语言不断涌现，发展出了各种编程范式和理论。尤其在近几年，随着开源社区的发展，新兴移动平台的出现，我们又迎来了一个程序设计语言爆发的时期，我们能看到 Go (2009), Rust (2010), Elixir (2011), Swift (2014) 这些新的程序语言不断出现。 这些不同的语言都各自有其特色及擅长的领域，如 Go 以 C 的继任者为目标，以高效和高并发著称，Rust 则以「安全、并发、实用」为准则，期望成为新的系统编程默认语言， Elixir 则继承了 Erlang 的函数式思想，Ruby 优雅的语法，支持分布式、高容错、实时应用程序的开发。 在这成千上万种程序设计语言面前，我相信我们都曾迷失过方向：为什么会有这么多语言出现？该如何选择一门程序设计语言作为自己解决问题的工具？以后会不会有更多的程序语言出现？ 这篇文章的意图就是通过比较几种我们比较熟悉的高级程序设计语言，从中找到程序语言发展的规律，以及影响程序语言流行的因素，以此对程序语言的发展作出一个基本判断，对未来有所展望。 程序语言及其分类 为了比较不同的高级程序设计语言，我们首先得定义以下几点： 什么是程序设计语言？ 什么是高级程序设计语言？ 高级程序设计语言的分类 （即高级语言之间的不同） 如果不明确以上 3 点，我们的比较将无从谈起。因此这一节将依次介绍以上几点。 什么是程序设计语言？ 程序设计语言（Programming Language） 引用维基百科对 Programming Language 的定义1： A programming language is a notation for writing programs, which are specifications of a computation or algorithm. 一个程序设计语言是我们描述程序的记述方式，是对一种计算模型或者算法的说明。 程序语言的几个重要特征 以机器为目标 程序语言的一个目标就是要在机器（特别是计算机）上运行，因此，程序语言的规格与它要运行的目标机器的规格息息相关。冯·诺伊曼架构的计算机模型就对现代程序语言产生了巨大的影响（比如 C 中的指针概念）。量子计算机、生物计算机等新时代计算机架构的出现也会引起程序语言的巨大变革，但本文不做深入探讨。 抽象 可以说每个程序语言都是为抽象而生的。机器语言是对硬件操作的抽象，汇编语言是对机器语言的抽象，C 语言是对汇编语言的抽象。 而抽象也有好坏之分，好的抽象能让人非常容易地理解，而坏的抽象则是雪上加霜，给本就复杂的对象平添了一层复杂度。程序语言也是如此，好的程序语言可以让程序员轻松地将自己想要表达的功能与计算机底层的逻辑联系起来，而坏的程序语言则要让程序员付出更多的时间与精力去完成同样的任务。 抽象也因此可以称作语言在程序员书写和阅读时展现出来的表现能力。 表现力 此处的表现力与「抽象」不同，指的是语言在算法层面的表现能力。 计算理论2通过对语言的表现能力进行分类。现代常用的高级语言都是图灵完备（Turing-Complete）的。 注意：除了图灵的理论外，还有很多其他的计算模型3。 构成程序语言的基本元素 语法 语法是一个程序语言的最表面的表现形式。大部分的程序语言都是通过文字来表现的（一小部分语言是通过图形表示的，两者的区别在后续内容中讨论）。 这些文字的语法通常通过正则表达式和巴克斯范式一起组合定义。其中，正则表达式负责词法分析的部分，巴克斯范式负责语法的部分。 有的语言语法简洁明了，有的语言则像英语语法一样复杂。拥有一个简单、易懂、符合程序员直觉的语法是一个程序语言成功的必要因素。 类型系统 类型系统定义了一个程序语言如何对值和表达式进行分类，操作变换，以及不同类型之间的交互。 类型是程序语言中一个重要的抽象概念，如果没有类型，那我们熟悉的字符串、整型、浮点型等基本概念都无从谈起，更不用说面向对象编程这种重度依赖数据类型的编程范式了。 也正因此，一个程序语言对类型定义、变换、交互的支持会很大程度影响程序员在编程时的方方面面。 标准库 标准库也是程序语言在定义时的一个重要组成部分。标准库决定了程序员在只有这个程序语言支持的情况下完成自己任务的难易程度，因此标准库也对一个程序语言的好坏有着很大的影响。 有的程序语言有着丰富的标准库（如 Go ），程序员甚至不用借助任何第三方库就能完成自己大部分的工作。 有的程序语言则标准库不完善（如 JavaScript ），程序员需要大量借助第三方库的实现才能让自己的工作轻松一点，这样的语言是很难能被称得上是优秀的。 语义 语义是语法的反面，是一个程序的想要表达的算法的意义。 一个程序的语义与使用者的能力息息相关，资深的程序员可以使用抽象能力差的语言写出同样表现力的程序，蹩脚的程序员也可以用抽象能力强的语言写出晦涩难懂的程序，而两个程序在语义上是完全一致的。 这个假设和本文中的其他讨论都是建立在两个语言都是图灵完备的前提下的。程序员对程序语言语义表达的影响超出了本文讨论的范畴，后文将要讨论的是程序语言的设计会如何影响最终程序的可读性。 我们会发现，程序语言的语法、类型系统、编程范式、标准库，最终都会影响到程序的语义是否清晰可读，甚至影响到程序语言使用者的思维。 什么是高级程序设计语言？ 关于这个问题，我们要考察程序语言的发展历史才能得到答案，也只有从这段发展历史中，我们也才能知道程序语言的发展方向。 第一代程序语言 （1GL） 最早的计算机程序语言的抽象层级很低，程序员需要用纯粹的机器语言写程序。这些程序以十进制或二进制的形式「写」在卡片或纸带上，几乎是无法让人阅读的，也因此很容易出错。 这些纯粹的机器语言被称为第一代程序语言。 第二代程序语言 （2GL） 第二代程序语言就是我们所熟知的汇编语言，汇编语言的抽象层级比机器语言要高一级，能够用一些关键字、数字写出的程序来控制计算机的行为，可读性比机器语言提高了不少。 但汇编语言依然是平台相关的，一个计算机架构上的汇编语言无法在另一个计算机架构上运行。 第三代程序语言 （3GL） 编译技术的发展让程序语言的抽象能力得到了进一步的提升，程序语言不再和硬件有关，也因此从硬件的底层（Low-Level）限制中摆脱出来，正式迈入了高级语言时代。 自 Fortran 以降，Lisp, Simula, C, Prolog 各种程序语言不断涌现，可谓是百花齐放。到如今，第三代程序语言的发展已经经历了 60 多个年头了。这 60 年间，各种编程范式，类型系统也随着程序语言的更迭而出现，而大大小小的程序语言也有成百上千个。 经历过许许多多的编程语言后，现在的我们是不是能说我们已经见过了程序语言的所有可能性？我们能不能确定程序语言的发展方向？这是本文想要讨论的问题。 第四代程序语言 （4GL） 第四代程序语言以 SQL 为代表，在第三代程序语言的基础上进一步抽象，使得使用者可以完全无视计算机的结构，只用全心全意专注在自己要解决的问题领域（数据库管理、报表生成、Web 开发，等等） 但是这一层抽象也带来了其功能的局限，即这类语言只能在自己的问题领域发挥作用，在其他领域则失去了其效率甚至完全不能发挥作用。也因此，有人将第四代程序语言归类为邻域特定语言的子集4, 5。 第五代程序语言 （5GL） 第五代程序语言是通过定义问题的约束，而不是通过定义解决这个问题的算法来解决问题。 然而，给定一个特定问题让人类本身去提出算法已经是一件很困难的事情了，更不用说让计算机语言来完成这件事情。受制于当时（1980-1990 年代）的人工智能水平，这样的程序语言是不切实际的，因此也被时代放弃了。 也许随着人工智能等相关学科的发展，最终我们会让计算机拥有和人类一样理解问题，解决问题，提出算法的能力，但这样的功能已经超出了我们对程序语言的定义：「a notation for writing programs, which are specifications of a computation or algorithm.」 换句话说，第五代程序语言没有在定义算法的抽象层次上发展，而是想让计算机为我们解决问题，从计算机语言偏向了人工智能方向，可能这也是它作为程序语言失败的原因。 通过这一个小结，我们大致了解了程序语言的发展过程，可以说程序语言的发展过程就是「对算法的抽象水平」的不断发展提高的过程。 高级程序设计语言，也就是对算法的抽象到了「硬件无关」水平的语言，即第三代及其以上的程序语言。由于第四代及第五代程序语言的特殊性，本文的主要讨论对象是第三代程序语言。 高级程序设计语言的分类 本文对高级程序语言按以下几种标准进行分类： 应用领域 根据程序语言最终可以应用的领域来分，可以将程序语言分为以下两种 通用编程语言 通用编程语言即被设计为各种应用领域服务的编程语言，不含有为特定领域设计的结构。 常见的 C, Java, Python, Fortran 等都是通用编程语言。 领域特定语言 领域特定语言即专注于某个特定应用领域的程序语言。 常见的领域特定语言有 SQL, HTML, Gradle。 类型系统 我们知道，计算机用比特来存储数据，任何数据都是以一组比特组成的。但对人类来说，单纯的比特流是不符合我们的日常认知的，主要原因有两点： 人类的数学教育是从十进制开始的，而比特流是二进制的。大部分人思考比特流时要先转换成十进制，这一点造成了我们在思考比特流上有先天的不足。 现实世界不单单是由数字组成的。我们还有图片、文字、音频、视频等等等等复杂的表现形式。从二进制的比特流转换成十进制的数字已经有一定的难度了，更不必说从二进制比特流转换成字母、图片等等其他更复杂的格式。 因此，高级程序设计语言中出现了类型这一抽象形式。类型，是程序和程序设计者用来区分不同的比特流的手段。定型（类型指派）赋予一组比特某个意义，这组比特的类型可以告诉程序和程序设计者如何对待这些比特。 对程序语言来说，类型系统是一组关于变量和表达式的规则，这些规则限定了不同数值和表达式有哪些不同的类型、如何操作这些类型、这些类型之间如何相互作用。 类型系统的主要作用有： 抽象化如上所述，类型允许程序设计者以更高的层次（相比比特流或单纯的数字）思考，而不是烦人的低层次实现。这是第三代程序语言和第二代程序语言的一大进步。 可读性在抽象化的基础上，类型系统为程序提供了更好的可读性。比如：一个整数可以不单单是整数，而是代表一个时间戳（Timestamp）。而程序设计者在看到 Timestamp 这一类型时也可以清楚的知道变量或表达式的类型。 安全性使用类型系统可以允许编译器探测无意义的，或者可能无效的代码，比如 "Hello, World!" + 3 ，在编译时，编译器可以侦测到这是字符串与整数相加，不符合类型系统的规则，属于一个无效操作，为程序员减少后期除错的时间。 最优化静态类型检查可以提供更多有用的信息给编译器。编译器可以针对不同的类型做不同的优化。 按程序语言的类型系统来分，程序语言可分为两类： 无类型语言 无类型语言允许在任意的数据上进行任意的操作。 常见的有大部分的汇编语言，Tcl，Forth 等。 有类型语言 有类型语言则限制了在不同类型数据上能够进行的操作。 现在大部分的高级语言都是有类型语言。 类型语言可根据 表达式类型的决定时间 分为： 静态类型 所有表达式的类型在程序执行前（通常是在编译时）决定。 这种决定有两种方式： 显式声明 程序员在编写程序源代码时就把每个表达式的类型同时在源代码中声明。 常见的有 C++, C#, Java 隐式推导 由程序语言的编译器根据表达式的上下文来推导出表达式的类型，而不需要程序员在源代码中显式声明。 常见的有 Haskell, ML 动态类型 表达式的类型在程序运行时才最终决定，换句话说，类型是与表达式在程序运行时的值有关，而不是和源代码的字面表述有关。 同隐式类型推导语言一样，表达式的类型也不需要在源代码中声明。 常见的有 Lisp, Smalltalk, Python, Ruby 类型语言可根据 是否有类型的隐式转换 分为： 弱类型 弱类型语言允许一种类型的值被当作另一种类型使用，比如将字符串当做整型。弱类型通常是通过类型之间的隐式转换来实现的，即把字符串隐式转换成整型后再进行后续操作。 C 语言可以被认为是弱类型语言，因为 void* 指针可以支持不同类型之间的隐式转换。 强类型 强类型语言则不允许用一种类型的值当作另一种类型使用，任何这样的尝试都会使程序报错。在这种意义上，强类型语言也可以理解为「类型安全」语言。 编程范式 范，即模范，范式即模式、方法。编程范式即为一类典型的编程风格。正如软件工程中不同的群体会提倡不同的「方法学」一样，不同的编程语言也会提倡不同的「编程范式」。一些语言是专门为某个特定的范式设计的（如 Ruby 是为面向对象编程设计的，Haskell 和 Scheme 则是为函数式编程设计的），而有些语言则支持多种泛型（如 Python 支持过程化编程、面向对象编程、函数式编程、C++ 支持过程化编程、面向对象编程和泛型编程）。 因为程序语言有成百上千种，可以说每种语言都有其自己独特的编程范式，经过总结后得出的不同的编程范式也有几十种，本文主要讨论其中最有影响力的几种，列表如下： 编程范式 简介 主要特征 典型代表 结构化编程 命令式编程的一种，有更多的逻辑子结构 禁止或限制 goto 语句的使用 C, Python, PHP 面向对象编程 将数据（data）和数据相关的行为（behavior）绑定为对象（object），所有行为都基于对象的 behavior 产生 对象，消息传递，封装，多态，继承 C++, Java, Ruby, Javascript 函数式编程 将计算看作数学里的函数计算，避免使用可变的状态和数据 匿名函数，组合，递归，没有副作用 Lisp, Clojure, Erlang, Haskell 程序语言的历史 程序语言的发展是一个不断抽象的过程 抽象及抽象的好处 引用维基百科对 抽象化（Abstraction）6 的定义： 抽象化（英语：Abstraction）是指以缩减一个概念或是一个现象的资讯含量来将其广义化（Generalization）的过程，主要是为了只保存和一特定目的有关的资讯。 在计算机科学中，抽象是我们控制复杂度的一个重要手段。计算机硬件和软件，可以说无一不超出了一个人可以理解的复杂度范畴。只有通过抽象，将一个复杂的系统变成一层层的接口集合，让人每次只需要考虑当前集合内的逻辑，而不用管当前层次以上和以下的复杂度，才可以让人从这些庞杂的系统中解放出来，一步一步地理解或者构造一个复杂系统。 计算机系统本身就是通过一层层抽象构造出来的，从一个个微小的晶体管，抽象成一个个门电路，再到 ALU 等组件，到 CPU 等元器件，最终一个个硬件单元的抽象组成了计算机。抽象使计算机变成了一个由几层抽象构成的系统，每个层次之间通过清晰定义的接口进行通信。这让我们理解和设计计算机时，可以每次只考虑一个层次的逻辑，设计完一个层次之后再进行下一个层次。无论是自顶向下还是自底向上，复杂度都要比把它当做一个整体要来得简单许多。 程序设计也是如此，通过不断的缩减概念，去伪存真，用高级程序设计语言、编译器等等辅助工具，对计算机硬件又做了若干层抽象，让我们能够用程序语言描述我们想要实现的算法，而辅助工具会帮助我们将这一描述结果转换成计算机硬件能够理解的语言，并运行起来。 由此，我们可以看到抽象给程序设计带来的两个好处： 让计算机帮助程序设计者完成抽象背后的事情，比如编译、链接等等，这些事情往往是与我们要描述的算法不是直接相关的。这个好处把程序设计者从抽象背后繁琐的事务中解放出来，让程序设计者能专心描述算法。 让程序回归「描述算法」这一程序语言的本质，使程序所代表的算法更加明了，易于理解。这个好处让程序阅读者只用关心当前抽象层次的问题，而不用理解底层的实现，使得程序更加易读。 本章就通过比高级程序语言发展过程中的一些语言，来看看语言的发展是如何帮助我们在抽象的阶梯上一步一步往上走的。 Fortran - 高级语言的出现 - 对硬件的抽象 在第三代程序语言出现之前的机器语言和汇编语言时代，程序语言和目标机器之间是有很强的绑定关系的，相同的算法如果要在不同架构的机器上实现需要程序设计人员将算法用不同的语言重复实现若干遍，这显然是与我们的抽象原则相违背的。因此，第三代程序语言应运而生。 如前所述，第三代程序语言通过编译技术，将程序语言与目标机器通过中间代码进行了解耦，程序设计者只需要关注算法层面的实现，而不需要关心目标机器的具体细节，大大减少了程序实现者的工作量。 Fortran 是第一个被完整实现的高级程序语言，其第一个完整的编译器完成于 1957 年。7 此处以简单的 Hello World 为例，对 Fortran 与汇编语言进行一个简要的对比。8 Fortran C Hello World in Fortran PROGRAM HELLO WRITE (*,100) STOP 100 FORMAT (' Hello World! ' /) END 汇编语言 Intel 架构 ; Hello World for Intel Assembler (MSDOS) mov ax,cs mov ds,ax mov ah,9 mov dx, offset Hello int 21h xor ax,ax int 21h Hello: db "Hello World!",13,10,"$" MIPS 架构 ## Hello Word in Assemlber for the MIPS Architecture .globl main main: jal hwbody # call Hello Word Procedure trap 10 # exit hwbody: addi $30, $30,-4 # we need to preserve sw $4, 0($30) # existing values in register 4 addi $4,$0,72 # H trap 101 addi $4,$0,101 # e trap 101 addi $4,$0,108 # l trap 101 trap 101 # l addi $4,$0,111 # o trap 101 addi $4,$0,32 # <space> trap 101 addi $4,$0,87 # W trap 101 addi $4,$0,111 # o trap 101 addi $4,$0,114 # r trap 101 addi $4,$0,108 # l trap 101 addi $4,$0,100 # d trap 101 addi $4,$0,33 # ! trap 101 addi $4,$0,10 # \n trap 101 done: lw $4, 0($30) # restore values addi $30, $30, 4 # in register 4 jr $31 # return to the main 从这个简单的例子中我们可以看出， 汇编语言的代码根据语言的不同有很大的区别 由于架构限制导致 MIPS 的字符操作比 Intel 架构复杂许多，也因此其汇编代码更长。而 Fortran 则没有架构的限制，只要有 Intel 和 MIPS 平台上的编译器，这段 Fortran 代码就能在编译之后顺利运行。 Fortran 代码相比汇编代码更加简单、易读 由于 Fortran 是基于硬件架构的进一步抽象，其语法更符合人类的已有语言体系，如 PROGRAM, WRITE, STOP 等词语的使用，只要有一定基础编程知识的人都能理解上述 Fortran 代码。 而汇编语言则完全不同，跟硬件架构的深度耦合使得其语法与人类的语言体系相去甚远，没有相关经验的程序设计者必须要查询其各自对应的架构手册才能理解这两段汇编代码，程序中更是需要大量注释来说明在 Fortran 中用简要的代码就可以表达的字符数值。而且不同架构汇编语言的语法之间的区别不亚于如今各个高级语言之间的语法、范式差别。这让汇编语言的使用成本进一步提高。 也因此，高级程序语言及编译技术的普及使得程序更加易读易写，让编程的成本大幅度降低。 C - 结构化程序语言 - 对控制流的抽象 类似 Fortran 这样的高级语言已经很抽象了，已经脱离了汇编语言对阅读者不友好的阶段，具有了一定的可读性，但这样的可读性依然无法满足程序语言设计者们，程序语言继续往更高的抽象层次发展。 从之前的例子我们可以看出，Frotran 依然带着一定汇编语言的影子，比如 100 FORMAT (' Hello World! ' /) 这一个标签，和 Intel 架构的汇编版本 Hello: db "Hello World!",13,10,"$" 类似，它们都用标签来标识一个字符串并在另外的地方使用该字符串。从程序的可读性上来讲，Fortran 的标签 100 还不如 Intel 汇编的 Hello ，至少 Hello 比 100 更能代表 Hello World! 这个字符串。（当然，随着 Fortran 的发展，后续的版本比如 Fortran 77, Fortran 90 都和古老的 Fortran 有着显著的进步，此处不做引申） 类似这样的汇编语言的影子在高级语言中依然有不少，另外一个饱受争议的就是 goto 语句。 goto 语句在 C 语言中也存在，但经过社区的激烈讨论之后9, 10，=goto= 语句在 C 语言中也不再提倡11。而禁止或限制使用 goto 语句也正是结构化程序语言的一个特征。该小节就探讨结构化语言是如何通过对 goto 语句的限制达到对控制流（control flow）更好的抽象。 goto 和面条式代码（Spaghetti Code) 在上述的 MIPS 汇编语句中， jal hwbody 就是 goto 在汇编语言中的一种展现形式：通过标签标注代码块，在程序的其他地方通过 jump 系列语句跳转到该代码块执行。 main: jal hwbody # call Hello Word Procedure trap 10 # exit hwbody: ... 单看这个简单的 goto 语句并无法让我们看到 goto 的危害。但当 goto 在汇编语言中被广泛使用时，我们才会发现我们的汇编代码变成了一堆面条式代码（Spaghetti Code）。所谓面条式代码，即是一个控制结构复杂、混乱、难以理解的代码，就像一盘扭曲纠结的意大利面一般让人摸不着头脑。 即使在写汇编代码时尽量用清晰的标签标注每段要跳转的子结构，依然不能避免由各种形式的 jump (goto) 所带来的「面条」感：每个 jump 都如一根面条穿进另外两根面条中间，多个代码块之间的穿梭就如面条交织纠结在一起，最终让整个程序难以阅读、修改。 而 goto 这一语言特性也被 C, Basic 等高级语言继承，如下面这段 Basic 代码12： 10 i = 0 20 i = i + 1 30 PRINT i; " squared = "; i * i 40 IF i >= 10 THEN GOTO 60 50 GOTO 20 60 PRINT "Program Completed." 70 END 这段程序，是典型的面条式代码的例子。程序要在屏幕上打印出数字 1 到 10 的平方。 GOTO 指令给这段程序带来了几个负面的影响： 程序要配合行号才能知道程序的流向 如前所述，程序设计者不是计算机，大部分人类在阅读代码时对数字的敏感程度是比不上文字的，而在计算机面前，代码和文字并没有什么区别。用行号来进行跳跃，实际上是强迫程序设计者用计算机的方式去思考。这和汇编代码相比，进步不够明显。 由于 GOTO 指令的关系，要运行的程序会不可预测的从一个区域跳到另一个区域，不易追踪。 如上例中从行 40 跳到行 60 ，假设中间不仅仅只有一行代码，则程序设计者和阅读者要跨越一大段代码才能跟随程序运行的脚步。 由于人类受自然时间的影响，阅读时总是线性的，再加上对行号的不敏感，这样的跳跃是非常反直觉的。只有顺序的、跟随函数名的跳转，对人类来说才是比较友好的。 结构化语言与汇编语言的对比 对比一段与上述面条式代码相同功能的 C 语言代码： #include <stdio.h> int main() { for (int i=0; i <= 10; i++) { printf("%d squared = %d\n", i, i * i); } printf("Program Completed.\n"); } 不再使用 goto 后的代码变得更加清晰明了，只用一个 for 循环语句就完成了之前需要两个 goto 语句才能完成的任务。而这也正是结构化语言所提倡的：用循环体等更加清晰明了的结构去解决 goto 想解决但又没解决好的控制流抽象问题。 结构化程序理论 结构化程序理论，又称为伯姆 - 贾可皮尼理论或 Böhm-Jacopini 理论，主要论证了只要三种控制流程就可以组成一个图灵完备的程序语言，即每个可计算函数都可以只用三种控制流程来表示13： 顺序：即依次运行表达式 选择：依照布尔表达式的结果，决定运行两端子程序中的一段 循环：重复执行一段子程序，直到某特定布尔表达式为真 结构化语言的兴起与 goto 语句的衰落 有了结构化程序理论基础作为支撑，结构化语言凭借其更加强大的抽象能力，逐渐占据了主流，在 20 世纪末，几乎所有程序设计者都认为结构化程序设计，或者说用三种控制流程来避免使用 goto 是一种值得学习的程序设计思想。结构化的思想也因此在大部分的高级语言中得到实现，如 Fortran, COBOL 和 Basic 等等。 由此，我们可以看到，即使如 Fortran 这样与机器无关的高级语言，在诞生之初依然带着汇编语言的影子，有着进一步抽象的空间，通过结构化思想抽象之后的控制流模型也能有利于我们写出更简明易懂的程序。 Ruby - 面向对象程序语言 - 对数据及其行为的抽象 相比汇编语言，或者早期的高级语言，结构化的程序语言在控制流的抽象程度上又提高了一个等级，然而仅仅使用三种控制结构和子程序（过程、函数等概念）依然会在大项目时遇到难以维护的问题。面对这一问题，面向对象语言出现了，并且提供了一个比较可靠的解决方案，即对数据和与该数据相对应的行为进行抽象。也因此，面向对象语言成为了工业界的主流。出现了大量基于已有高级语言的面向对象语言（如基于 C 的 C++, Objective C），也出现了大量重新设计的面向对象语言（如 Java, Ruby, Python）。本小节以 Ruby 为例，讨论面向对象思想在抽象层次上的进步。 对象 = 数据 + 行为 用我们所熟知的面向对象思想来看，在面向对象语言写就的程序中，一个对象（object），所代表的就是其封装的数据（data）和行为（behavior）14。对象通过互相发送消息（message）调用其他对象的行为。 而在结构化或者说过程式语言中，数据本身和行为是没有进行绑定的，每个子过程或者子函数必须通过某种方式知道参数的类型，才能决定下一步的行为。这在大型的项目中是无法满足开发维护的需求的，因为有很多对语言自带类型和自定义类型的使用，如果每次使用都要进行对类型的判断来决定程序的行为，程序本身将变得非常复杂，难以维护。 反观面向对象语言，由于数据与行为的绑定这一抽象，对数据类型的判断可以由程序语言在一定程度上用类型系统辅助解决，帮助简化了程序。 面向对象是对控制流方向的反转 如上小节所述，数据与行为的绑定，是面向对象在抽象层次上更为高明的地方。在这个抽象背后，是对过程式语言控制流方向的反转，下面是一个简单的例子： 过程式编程 World = Struct.new(:category) Duck = Struct.new(:name) def hello(object) case object when World puts "Hello World: #{object.category}!" when Duck puts "Hello Duck: #{object.name}!" else raise NoMethodError end end world = World.new('CS') hello(world) # => Hello World: CS! duck = Duck.new('Donald') hello(duck) # => Hello Duck: Donald! int = 0 hello(int) # => NoMethodError 在过程式编程中，控制流的方向是以子过程为重心的，就如这个例子中 object 被传入 hello ， hello 需要通过 case 表达式选择对待不同类型结构时自身的行为，这样的编程范式有几个缺点： 不易扩展每次增加一个新的 hello 可以处理的类型时，都要修改 hello 自身，即违背了开闭原则15。而在大型程序中， 像 hello 一样要用到新类型的子过程可能非常多，而其中很大一部分的定义和新类型的定义很可能相隔遥远，要修改起来需要在整个项目中寻找每一个子过程的定义，非常繁琐。 不利于抽象当要接受的类型变多，行为变复杂时， hello 中要处理的逻辑将混杂着多个不同类型的逻辑，这很容易导致抽象层级的混杂，不利于抽象，最终让这个函数难以理解。 难以处理错误对类型的手动判断意味着对错误类型也要通过手动判断进行处理，这些额外的逻辑一方面增加了程序的复杂度，另一方面也增加了程序设计者的工作量，给程序员增加了更多负担。 进一步抽象后的过程式编程 为了解决抽象层级复杂的问题，过程式编程发展到一定程度时会将 hello 中对不同类的逻辑单独抽到各自单独的子函数中，以方便管理和扩展。上例改进后的版本如下： World = Struct.new(:category) Duck = Struct.new(:name) def hello(object) case object when World world_hello(object) when Duck duck_hello(object) else raise NoMethodError end end def world_hello(world) puts "Hello World: #{world.category}!" end def duck_hello(duck) puts "Hello Duck: #{duck.name}!" end world = World.new('CS') hello(world) # => Hello World: CS! duck = Duck.new('Donald') hello(duck) # => Hello Duck: Donald! int = 0 hello(int) # => NoMethodError 虽然这个版本改进了抽象层级难以统一的问题，但仍然没有解决「难以扩展」和「难以处理错误」这两个问题。而面向对象语言的出现则解决了以上两个问题。 面向对象编程 class World def initialize(category) @category = category end def hello puts "Hello World: #{@category}!" end end class Duck def initialize(name) @name = name end def hello puts "Hello Duck: #{@name}!" end end def hello(object) object.hello end world = World.new('CS') hello(world) # => Hello World: CS! duck = Duck.new('Donald') hello(duck) # => Hello Duck: Donald! int = 0 hello(int) # => NoMethodError 在这个例子中我们可以看到 hello 函数中不再有判断参数类型的 case 语句，判断类型和分配消息的任务则交给了程序语言本身来完成。这在程序代码上的表现虽然只是由 world_hello(object) 和 duck_hello(object) 变成 object.hello （ object 可以是 world 也可以是 duck ）的简单改变，但这个简单的转变代表的是将控制流的方向从「对象作为函数的参数传入」反转成了「函数作为消息，传入对象」，这是在抽象层级上的一大进步。 程序语言负责了更多任务在面向对象语言中，判断类型和消息分配的任务可由程序语言本身完成（用多态来代替条件判断），这将程序设计者从繁琐的类型判断和错误处理中解放了出来，让人可以专心于设计程序内各种类型的逻辑。 更优雅的代码组织方式由于类型相关的函数都被绑定到了类型本身的定义上，也就意味着在代码组织时，这些逻辑很自然地被归类到了一起，让设计者在设计时对这个类型的职责思考更加深入，让阅读者对类型的理解更加透彻。这也是对象作为数据和行为的结合这一抽象的高明之处。 Elixir - 函数式程序语言 - 对运算的抽象 Elixir 是一门基于 Erlang 虚拟机的函数式通用程序语言，在设计之时，从 Ruby, Clojure, Erlang 等处借鉴了大量优秀的经验，成为了近年来非常火热的一门语言之一。甚至有人说，「Elixir 改变了我对编程的认知」（Elixir has changed how i think about programming）16。本节通过讨论 Elixir 其中的一些特性，看看 21 世纪中新世代的编程语言在抽象上的进步。 不可变对象（Immutable Object） 在程序语言中，不可变对象就是在创建后无法被更改内部状态的对象。不可变对象的使用，迫使程序设计者在修改一个对象时，都不能在原有的对象上做任何修改，而是返回一个重新创建的新对象。 内部状态的变化，是程序副作用（Side-Effect）的一部分，其他的副作用有对数据库的操作、输入输出等等。函数式程序语言倡导的一点就是写出「没有副作用」的函数体。若我们将函数看作一个个黑盒子，当副作用存在于一个函数中时，函数有三个职责：接收输入、产生副作用（如改变状态）和返回输出；当一个函数没有副作用时，函数只用接收输入和返回输出即可。当然，现代程序不可能完全没有副作用（比如数据库操作、磁盘读写等等），而函数式语言的使用者则会有意将具有副作用的函数和不具有副作用的函数明显分隔开，来尽量靠近理想的函数式程序模型。 这个约束给程序设计带来几个好处17： 数据稳定性 在面向对象程序语言中，由于内部状态可变性的存在，一个状态复杂的对象很容易在进行某些操作失败时陷入一个不确定的异常状态中，这些破碎的状态，让程序的除错和修复变得非常困难。 而使用不可变对象，让我们用新对象的创建来替代原有对旧对象状态修改的操作，这将一个复杂的操作变为了一个具有原子性的操作。新对象创建成功即保证了状态更新成功，否则状态更新失败，而不会有任何难以处理的中间状态出现，这对程序的健壮性是一大保障。 代码质量提高 不可变对象的使用也鼓励程序设计者写出更小的子程序体。因为大部分没有副作用的函数都能表示为'''
