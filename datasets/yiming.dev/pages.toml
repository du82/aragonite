["https://yiming.dev/blog/2017/03/04/la-la-land-review"]
title = "La La Land Review - Yiming Chen"
description = "My personal review for La La Land"
full_description = "La La Land Review 我没有去过 LA，不知道在 Griffith 天文台观星是什么体验。 我不懂 Jazz，不知道 Sebastian 念念不忘的大师都有什么成就。 我不懂歌舞片，不知道 La La Land 里那 99 个致敬场景都出自什么老电影。 但 La La Land 还是打动了我，它对爱情、梦想、人生的描绘，就足以让它成为我心目中 2016 最好的电影。 Another Day Of Sun And when they let you down You'll get off the ground As morning rolls off around And it's another day of sun 这高速公路上都是追逐梦想的人，他们或许想当个演员，或许想当个歌手，从一个小镇跳上大巴来到这个灯光耀眼的城市，也许能一举出名，也许只能一直默默无闻，Who knows? 其实上海也是一样，我已经忘了多少次在火车站、航站楼看到人们行色匆匆地走过，有的怀着刚来到大城市的雄心壮志，有的受了挫折走上了回家的路。但是这里永远不缺追逐梦想的人。我想这就是 LA 和上海的魅力吧。 Someone In The Crowd A little chance encounter could be the one you've waited for Just squeeze a bit more 刚听到这首歌时我还一厢情愿地以为是室友劝 Mia 去 Party 认识男友的桥段。结果仔细一听才发现还是和梦想有关。Someone in the crowd 指的是星探吧，如果有人能发现 Mia 的才华并提携一把，Mia 的梦想也许就能实现了。 （可是到后面一次派队 Mia 遇到了那个著名编剧，还是跟着 Sebastian 跑了。） Mia & Sebastian’s Theme Sebastian 在饭店驻弹，看到 J.K Simmons 有点跳戏到「爆裂鼓手」，生怕他坑 Sebastian 一把。 A Lovely Night 感觉就是两个傲娇的对话，一边欣赏着 LA 的美景，一边说「这一点也不好看」、「我看过比这更好看的」；一边为了帮姑娘找车丢下自己就停在门口的车绕了一大圈，一边说「我对你根本没感觉」 路灯下的踢踏舞非常好看，月光、路灯、衣服的颜色都恰到好处。 City Of Stars City of stars, are you shining just for me? City of stars, there's so much I can't see Who knows? Is this the start of something wonderful and new, or one more dream that I cannot make true? 看过无数次夜上海的灯光，却很少看到这里的星光，也许是灯光太耀眼，遮住了星星的闪烁。 Summer Montage / Madeline 热恋就像夏天，去那么多地方都不会累。然而就像夏天终究会过去，热恋也持续不了那么久，下一季很快就来了。 City Of Stars City of stars Just one thing everybody wants There in the bars And through the smokescreen of the crowded restaurants It's love Yes, all we're looking for is love from someone else （Mia 的两次笑场太萌了。 是的，也许大家最后追求的都只是那一个人的拥抱。 A rat-tat-tat on my heart Think I want it to stay 可是有多少人能留住它呢。 Start A Fire Sebastian 在听 Mia 讲电话时，我突然有一种离场的冲动，因为我知道他们肯定要分开了。就让一切留在 City of Stars 的合唱里也不失为一种好的结局。 然而 Sebastian 为了 Mia 放弃了自己的梦想，开始为现实努力挣钱时，或许就注定了他们要有那场争吵。 那场争吵给我的感觉很真实。有人说有个为了男友放弃梦想而和他吵架的女友真好，我说，有个肯为了给女友幸福而放弃自己梦想的男友也好。要弹着自己曾经鄙夷的音乐，和讨厌的摄像师合作，作出不属于自己的表情，为的只是女友妈妈的一通电话。 （另外，Mia 真的是因为 Seb 放弃了梦想而生气么，也许是的，也许她爱上的就是他为了爵士乐不惜一切的那股劲呢。但我突然想到，是不是因为他在到处巡回，没时间陪她了的原因呢。也许这才是最根本的吧。Who knows?） Audition (The Fools Who Dream) She told me a bit of madness is key to give us new colors to see Who knows where it will lead us? 一次次的失败，都不应该阻挡追逐梦想的脚步，也许下一次就成功了呢。听上去鸡汤得不能再鸡汤，可是也许人生有时候就是需要一些鸡汤。不然又哪来那些疯狂的变革呢。 And here's to the fools who dream Epilogue 也许在另一个平行时空里我们是在一起的。 怕就怕那些「也许」，也许在饭店里不擦身而过就好了，也许不参加乐队就好了，也许不回来准备惊喜晚餐就好了，也许不参加写真拍摄就好了，也许赶上独角戏首演就好了。 可是无论想象里多么美好，真的在现实里发生会如梦想所愿么？Who knows? 但是这就是电影的魅力吧，把想象的美好变成真实。但是现实也不错了，至少两个人都实现了各自的梦想。 Further Reading 如何评价电影《爱乐之城》（La La Land）？ - 银荡贼的回答 - 知乎 知道《爱乐之城》这 89 个梗，你就能了解大半个歌舞片史（爱乐之城）影评 《La La Land》，从原声音乐聊起（La La Land (Original Motion Picture Soundtrack)）乐评"
