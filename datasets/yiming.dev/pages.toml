full_description = "我是怎么练英语的 学英语也像学编程语言 英语和编程语言的共性可能就在于两者都是实用性非常强的工具，都是用来交流用的，学习这样的工具时，最有效的方法可能就是「尽量多地去使用」了。 对编程语言来说，相比英语来说少了听、说两个方面，只要多读、多写就可以了，而对于英语来说，则要从「听说读写」四个方面同时出发，多听、多说、多读、多写。 这篇博客就是我的实践方式的一个简单分享，希望能帮助到有需要的人。 听 「听」这一部分，分为「精听」和「泛听」，「精听」就是专门为了练习听力而做的听力练习，需要付出专门的时间去实践，并尽量弄懂材料，而「泛听」则是在生活中增加的「静听」之外的听力练习，由于「静听」比较耗费时间、精力，为了得到足够的听力输入，「泛听」也是必不可少的。 精听 「精听」的材料我最推荐 EnglishPod，总共 365 篇课文，每一篇都包含正文（DG）、讲解（PB）、复习（RV）三个部分。 正文都是很日常的小故事，有不同口音的讲者录音，表达也非常地道。 讲解是两个主播负责的对正文对话的介绍，深入浅出地将对话中比较有难度的部分解释清楚。 复习是对讲解中涉及的知识点的温习，又能加深对知识的理解。 可以配合跟读练习加强听说的能力，具体的步骤在「说」一节中进一步介绍。 泛听 「泛听」的材料就很多了，像美剧、电影和播客（Podcast）就是我最常用的几个材料。 选择「泛听」材料的原则就是「从兴趣出发」，毕竟已经花时间在「精听」上了，「泛听」的内容还比较无聊的话那就太无趣了。因此，就挑自己感兴趣的内容听，既能用兴趣来保持英语学习的动力，同时也能达到娱乐或者学习的目的。 影视材料 美剧和好莱坞电影是我娱乐生活的重要组成部分，如果能把这两个部分利用起来，泛听的时间能增加许多。 那么，如何实现看美剧、电影的同时实践泛听呢？ 我的经验是「不看中文字幕」。 刚开始时可以只看英文字幕，刚开始会比较吃力，不懂的词就尽量根据剧情和语境去理解一下，实在不行再暂停查。这时候对「读」的能力提高也是很快的，因为一般情况下我们受到过的阅读训练比听力训练要多的多，所以我们「读」的比「听」的要快。用「读」来弥补「听」速度上的不足，保证对剧情的理解。 后期慢慢地就可以无压力地跟随英文字幕看美剧了，渐渐地我就发现，日常的对话也可以摆脱字幕来理解了。这时，就能有意识地不看字幕或者关闭字幕来看了。 播客 播客也是「泛听」的重要渠道之一，我选择的播客基本都是和编程、科技产品相关的，比如： All Ruby Podcasts (原 Ruby Rogues) The Changelog The Bike Shed ATP (Accidental Tech Podcast) Giant Robots Smashing into other Giant Robots Ruby on Rails Podcast The Art of Product Elixir Fountain Emacs.el 播客的好处就是可以充分利用碎片时间，在地铁上的通勤时间、做家务时的琐碎时间，都可以拿出一集来听听，既能学到一些知识，又能锻炼听力。 YouTube YouTube 也是锻炼听力的好地方。 一般我看的 YouTube 视频有三类： 各种技术大会的录像，比如 RubyConf, RailsConf, ElixirDaze 等等 开发者 Coding 的 Screencast，比如 Emacs 插件的介绍，TDD 的讨论等等 科技产品评测视频，比如 MKBHD，The Verge 等 说 EnglishPod 「说」这方面的练习则是与「听」一同进行，一个重要的组成部分就是「精听」之后的跟读练习。 我尝试过的对应 EnglishPod 的方法如下1： 第一天听 5 课那个一分钟的录音，前三遍盲听，后两遍看脚本（好了，别多干，积蓄动力） 第二天听新的五课那个一分钟录音，听一遍昨天那五课第二部分的讲解（10 分钟的那个） 第三天跟读第一天那五课的录音，采用哼唱的形式，次数不限。听昨天那五课第二部分的讲解。听新五课那一分钟的录音。 一周后，其他工作量不变，再加从第一课开始跟读，先看着文本跟读 3-4 遍，再不看文本跟读多遍。 这个方法看起来很繁琐，但执行起来一点不麻烦。最主要的是在工作量不变的情况下把同一课放在不同时间里复习加强。其实一天哪怕不干啥专心致志学也就 3 个小时，但你也可以在地铁和路上听讲解和跟读。该改进方法符合记忆曲线。把 EnglishPod 的 365 期都这么学完，提升肯定会非常的显著。 多说英语 另外，我还尝试过多说英语2这款口语练习 App，感觉效果也还可以，不过难度太低，只适合入门不适合提高。 Presentations 还有一个办法就是在公司内部做英文的分享，在看了很多 YouTube 上的 Conference talk 之后，也能大概知道什么样的分享是好的分享，进而准备一个自己喜欢的话题和同事分享，既锻炼了口语，也提高了演讲的能力。 读 Books 强迫自己去阅读英文原版书，我尝试过的有小说（比如 /Ender's Game/）和技术书籍，推荐阅读的时候使用伍君仪的透析英语方法，使用了这个方法让我认识到，词汇量不是背单词书背出来的，而是大量阅读积累出来的。 News / Blog Posts 还有就是看大量的英文技术博客、新闻（比如 Hacker News），我比较多阅读的是科技产品的评测和编程的讨论，从刚开始的磕磕绊绊，到现在可以几乎不用查词典，并且速度也和阅读中文的文章相差无几。 因此，我现在几乎所有的输入都来自于英文的资料，毕竟技术圈的英文资料质量更高，时效性更强。 写 Blog Posts 这篇博客就是我实践英文写作的地方，虽然阅读量不大，但每篇都用心去写的话，还是能够帮助提高自己的写作水平的。 Open Source Projects 另外，深入地参与到开源项目中也是很好的方法。 无论是刚开始的提 Issue，报 Bug，还是到后期的提 Pull Request，都需要与其他协作者充分地沟通，不可避免地要用到英语表达，因此也是很有效地提高方式。 Footnotes: 1 怎样才能从英语很糟糕的人变成英语很厉害的人？ - 知乎 2 多说英语 - 英语就是要多说 - 人机互动 + 真人外教免费口语辅导 - 随时随地练口语"
