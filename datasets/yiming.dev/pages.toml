["https://yiming.dev/blog/2016/01/15/my-2015-review"]
title = "My 2015 Review - Yiming Chen"
full_description = 'My 2015 Review 2015 已经过去半个月了，在此我也对过去的一年作个小结，也算对 2016 作个规划，不知年末回头看看能有多少完成的。 Spacemacs 2015 年最明智的就是跳了 Spacemacs 的坑，让我转入了 Emacs 邪教，并最终成为了我转投 Arch Linux 的导火索。以至于找实习时都说出了 "I just want to find a job I can do all the coding staffs under command line" 这样的话。 一年过后，我在 Spacemacs 下的 Work Flow 也逐渐稳定，然而代码并没有写多少。一天做得最多的就是用 Org 做笔记， mu4e 查邮件， elfeed 刷 RSS 。希望新的一年能好好写代码，更好地把 Org-mode 融入到生活里去。 实习 老是因为偷懒没有找实习，结果好不容易找到一个待遇很好， Leader Title 又很牛逼的实习又因为投资人撤资而作罢了。 在 EIA 的经历又让我觉得创业太不靠谱（或者是自己太水，无法凭技术让团队出彩），还是加入一家大公司好好学习比较好吧。 希望新的一年能过掉 Google 面试，加入 Google 实习。 代码 回头看看，一年里也就学了 Django, Ruby, Rails, Elisp ，然而都只是皮毛， Ruby 算是略有深入，然而代码量依然捉急。 Elisp 也只是能简单调试的地步。在写简历的时候甚至发现自己几乎没有拿得出手的项目。 新的一年要好好研究 Python 和 Ruby 了。至少也得有一个能写在简历上大书特书一番的项目。 学业 每次想要翘课都会因为怕老师点名而去（也和自己没啥项目写有关），最终在课上却各种水，结果效果比翘课还差。虽然有时能用 Org 作笔记强迫自己专心，但是作的笔记后面也没什么大的用处（除了锻炼了五笔）。身为一只「大四狗」还做不到翘课随心，深感有愧。 导致每次考试前都在紧张怕挂科，然而依然不好好复习，甚至装 Arch 作死。幸好最后结果都还不错。 下学期要好好翘水课写代码。 Arch 在 2015 年的最后两天跳入了 Arch Linux 的坑，感觉找到了真正适合自己的操作系统，希望毕业以后能换一台对 Linux 支持得更好的 Laptop 吧，毕竟 Mac 上的 Linux 还是有某几个细节不完美的。当然如果 Emacs 25 出来后（在 Mac 上的性能更好），并且 OS X 能有不错的 Tiling Window Manager 的话（虽然并不可能），还是可以考虑回归 OS X 的。'
