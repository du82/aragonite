full_description = "Cristy Lou Cortes Hello! I’m Cristy, a Support Engineer and a proud Yoaster. Being part of Yoast's global support team is something I take great pride in. Before joining Yoast, I spent 7 years as a Technical Support Engineer, where I was responsible for monitoring and maintaining systems and networks. Later, I joined Newfold, where I worked as one of Bluehost’s frontline support agents for 18 months, sharpening my expertise in WordPress and website management. Outside of work, I’m passionate about cooking and love experimenting with new recipes, which I enjoy sharing with family and friends. I’m also an avid solo traveler— I believe life is too short not to explore, especially living in such a beautiful country!"
