["https://yoast.com/yoast-diversity-fund"]
title = "Yoast Diversity fund • Yoast"
description = "At Yoast, we care about diversity. That’s why we started the Yoast Diversity fund. Learn all about this fund and check out the projects our awardees are working on!"
full_description = "Yoast Diversity fund At Yoast, we care about diversity. That’s why we started the Yoast Diversity fund. This fund aims to increase the diversity of the WordPress community by taking away financial barriers for people from typically underrepresented groups in tech. Why do we have a diversity fund? To make a conference inclusive and have it feature a diverse set of speakers is hard. Women, but certainly also other underrepresented groups, tend to speak less often, and they do so for all sorts of reasons. At Yoast, we care about diversity. That’s why we started the Yoast Diversity fund. We believe that encouraging diversity among conference speakers and attendees is incredibly important. These types of events are places we go to learn, get inspired, meet life-long friends, and make significant career or life decisions. The people on the stage influence those outcomes, and the people around us shape that experience. The importance of representation For a long time, especially in tech, conferences have not done a good job of representing underrepresented and/or disadvantaged groups. We want to change that. If we want to broaden our horizons, we need to remove the barriers that prevent everybody to be able to share their experiences. That’s why we’re working to give everybody a chance, and to make these conferences fair, safe, and a level playing field. At Yoast, we’ve been thinking about what we can do to improve the inclusivity of conferences. One of the things we can do is remove hurdles, and specifically, the hurdle of costs. Costs for speakers from diverse backgrounds to come and speak. Apply for our Diversity fund There are WordPress Meetups and WordCamps throughout the world; these are conferences about, by and for the WordPress Community. While we already sponsor a lot of them, they tend not to have the budget to pay for speakers’ travel and accommodation costs. The same applies to other conferences about open source, certainly those that are not commercially run. We want to take away that particular reason for not having a diverse conference. To that end, we’ve introduced the Yoast Diversity fund to reimburse travel and accommodation costs for speakers, up to €1,000 per event. So if you want to join an event and feel like we can help you out, make sure to apply for our Diversity fund! Find out how to apply!"
year_published = 2025
year_updated = 2022
