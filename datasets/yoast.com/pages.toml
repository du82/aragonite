title = "Dexter Libron • Support engineer • Yoast"
description = "Dexter Libron is Support engineer at Yoast. Read about them and find out their posts, which events they're going to and where they've been!"
full_description = "Dexter Libron Hello there! My name is Dexter Libron, hailing from Labangon, Cebu City, Philippines. I’m passionate about succeeding in the digital realm and exploring the ever-evolving world of technology. Before stepping into my current role as a Support Engineer, I spent nearly six years as a call center agent at one of the largest BPO companies in the Philippines. This experience helped me develop strong communication and problem-solving skills, which I now apply to support customers and enhance their experience. Outside of work, I prioritize staying active by walking or running at least 5 km. On weekends, I enjoy spending quality time with my family, dining out, and attending church."
