["https://yoast.com/seo-glossary"]
title = "SEO Glossary - the definitive list of all SEO terms and phrases • Yoast"
description = "Discover all definitions for essential SEO terms in our SEO glossary. Quickly grasp key concepts and terminology and simplify your SEO learning journey! 📚"
full_description = "SEO terms glossary The definitive list of all SEO terms# – 123A – EF – MN – RS – Z The definitive list of all SEO terms Discover the ultimate definitions for essential (Yoast) SEO terms in our curated SEO glossary. Quickly grasp key concepts and streamline your understanding of SEO practices and simplify your SEO learning journey with our comprehensive glossary. # – 123 301 Redirect A 301 redirect is a permanent way to send users and search engines to a URL different from the one they originally requested. It’s like a change of address notice for the web. When a page is moved to a new location, a 301 redirect ensures visitors find the new page, and search engines transfer the original page’s ranking power to the new location. Use a 301 redirect to maintain SEO value when a URL is changed or when merging websites. 302 Found A 302 Found status code indicates a temporary redirection of a webpage. Unlike a 301 redirect, which is permanent, a 302 tells browsers and search engines that the original page still exists and that the move to the new URL is only for a short period. You might use a 302 redirect when you’re doing maintenance or running a promotion and want to temporarily direct traffic to another page without affecting the SEO value of the original URL. 307 Temporary redirect A 307 Temporary Redirect signals that a webpage’s location has temporarily moved to a new URL. Unlike the 302 Found, which can be used more loosely for temporary redirections, the 307 redirect strictly maintains the original request method when it redirects to the new location. Use a 307 when you need to briefly relocate a page while ensuring that the request details remain unchanged, reassuring both users and search engines that the original URL will be back in use shortly. 404 Not found When a server can’t find the requested webpage, it displays a 404 Page Not Found HTTP status code. This error message indicates that the link is broken, the URL is mistyped, or the page no longer exists without a redirect. To improve the user experience, website owners customize their 404 pages with helpful navigation options, search features, or friendly messages to help visitors find their way back to the website’s active content. 410 Content deleted A 410 Content Deleted HTTP status code actively informs users and search engines that a webpage was intentionally removed and is permanently unavailable. This status code serves as a deliberate confirmation of deletion rather than the ambiguous message a 404 Page Not Found might convey. Employ a 410 status code to communicate a page’s permanent removal, prompting search engines to swiftly and permanently purge the URL from their indices. 451 Unavailable for legal reasons A 451 Unavailable for Legal Reasons HTTP status code explicitly states that legal restrictions prevent access to a webpage. Web servers use this code to notify users that a government order, copyright infringement, or other legal demands enforce the content’s unavailability. This code clearly states that the restriction is for legal compliance, not because of technical issues or content relocation. Deploy a 451 status code when legal obligations require you to block access to content on your site. A – E A/B testing A/B testing, or split testing, compares two versions of a webpage or app against each other to determine which performs better. It involves showing version A to one group of users and version B to another while measuring the effectiveness of each version based on specific metrics such as conversion rates, clicks, or engagement levels. The goal is to identify which variation yields the most favorable outcome and use that version for the wider audience. Above the fold “Above the fold” describes the area of a webpage that users can see without scrolling when they first load the page in a browser. This concept comes from newspaper layout practices, where editors place the most important stories above the paper’s fold for immediate visibility. On a website, designers prioritize this space for engaging content to grab users’ attention and motivate them to stay and explore further — offering a good user experience. Admin bar menu (Yoast SEO feature) You see the Yoast SEO admin bar menu at the top of the screen. It lets you see and access the notifications the plugin has for you. It also gives you quick access to the Yoast SEO general settings. On top of that, the menu will help you quickly check your focus keyphrase and your SEO and readability scores while previewing a page. And it contains helpful links to external SEO tools that help you analyze the page. Affiliate link An affiliate link is a specific URL that contains the affiliate’s ID or username. In affiliate marketing, advertisers use these links to record the traffic sent to the advertiser’s website. This tracking helps to determine whether the affiliate’s marketing efforts result in a sale, for which they may earn a commission. It’s important to disclose the use of affiliate links to maintain transparency with users. Affiliate marketing Affiliate marketing is a digital performance-based advertising strategy. Businesses pay external websites or individuals, known as affiliates, a commission for directing traffic or sales to their products or services through their marketing efforts. Affiliates earn a reward, typically a percentage of a sale, for each customer they bring in. This model incentivizes affiliates to promote the business and helps it expand its reach. AI-generated content AI-generated content, such as text, images, or videos, is created by artificial intelligence using machine learning models. It offers efficiency and scalability in content creation but raises questions about accuracy and ethics. As AI evolves, it increasingly complements human creativity. Algorithm An algorithm is a set of step-by-step instructions or rules designed to perform a specific task or solve a problem. In computing, algorithms are the foundation of software programs, guiding computers through the processes needed to execute functions and make decisions. Algorithms can be simple, like a formula for adding two numbers, or complex, like those used in search engines to rank web pages. Alt tag/alt text An alt tag, or “alt text,” provides a textual description of an image on a webpage. Web developers use it within HTML to describe the appearance and function of an image, which is crucial for users who cannot see the image directly, such as visually impaired individuals using screen readers. Search engines also use alt text to understand the context of an image, which can aid in image search rankings. Anchor text Anchor text is the clickable, often blue and underlined text in a hyperlink that users see on a webpage. It provides both users and search engines with relevant contextual information about the content of the link’s destination. Effective anchor text is typically concise and descriptive, indicating what users can expect to find if they click the link. It’s an important factor in SEO as it helps search engines associate linked pages with specific topics or keywords, influencing how those pages rank for those terms in search results. Apache server An Apache server, officially known as the Apache HTTP Server, is a widely-used web server software that plays a crucial role in the internet infrastructure. It is designed to serve web content, such as HTML pages, images, and multimedia, to users’ browsers upon request. Developed and maintained by an open-source community under the Apache Software Foundation, it is known for its flexibility, power, and widespread compatibility with various operating systems. Application Program Interface (API) An Application Program Interface (API) is a set of rules and protocols for building and interacting with software applications. APIs enable different software programs to communicate with each other, allowing them to exchange data and functionality easily and securely. They act as an intermediary that processes requests and ensures seamless functioning of enterprise systems. Author archives (WordPress) Unique pages in WordPress for each author, which include all posts published by the author. If your blog is a single-person blog, you don’t need author archives because the archive page will be the same as the archive for the entire site. So, it’s best to disable author archives if there’s only one author. However, you can enable the author’s archives if multiple authors are writing for your site. If you do that, you’ll have the same settings for author archives as for taxonomies and content types in Yoast SEO. That means you can set the title template, meta description template, etc. Authoritativeness (E-E-A-T) Authoritativeness measures a website or content creator’s credibility and standing within their field or industry. Google uses it as a key factor in their E-E-A-T (Expertise, Experience, Authoritativeness, Trustworthiness) criteria to determine rankings in search results. A source gains authoritativeness through recognition from other reputable entities in the same domain, including citations, references, or endorsements. Authoritative sources offer reliable, accurate, and respected information, often backed by a history of trusted contributions. B2B SEO B2B SEO, or business-to-business search engine optimization, targets the specific needs and search behaviors of businesses looking for products or services from other companies. Instead of appealing to the general consumer, B2B SEO focuses on strategies that attract the attention of decision-makers within companies. B2B SEO requires understanding the longer sales cycles and a more informed and analytical audience, which is typical of B2B transactions. Back-end The back-end of a website refers to the server-side components that handle the site’s functioning and are not visible to users. It includes the server hosting the website, running a content management system like WordPress, and the database storing and managing the website’s data. Backlink A backlink, often called an “inbound link” or “external link,” is a hyperlink on one website that points to another website. It’s a critical element in SEO because search engines, like Google, consider backlinks as endorsements of content quality. The more reputable sources link to a webpage, the more authoritative it appears to search engines, which can improve that page’s search rankings. Backlink analysis Backlink analysis reviews the inbound links pointing to a website to assess their quantity, quality, and relevance. It involves using tools to collect data on backlinks and evaluating factors like the linking site’s authority, the link’s context, anchor text, and whether the link is dofollow or nofollow. Banner (online ad) A banner is a form of online advertising that embeds a graphic image or animation within a web page to promote a brand, product, or service. Typically rectangular, banners appear at websites’ top, bottom, or sides and can be static or animated. Users redirect to the advertiser’s landing page or website when they click on a banner ad. Black hat SEO Black hat SEO refers to aggressive and unethical tactics that violate search engine guidelines to boost a website’s rankings in search results. These practices aim for quick gains in search visibility, often at the expense of user experience and long-term site credibility. This is not something we at Yoast practice — we like holistic SEO. Blog A blog — like the Yoast SEO blog — is an online platform or section of a website where individuals or organizations regularly publish content, typically in an informal or conversational style. Blogs are a medium for sharing thoughts, insights, news, and updates on various topics. Each entry, known as a blog post, is usually displayed in reverse chronological order, with the newest content appearing first. Bounce rate Bounce rate traditionally is a metric in web analytics that indicates the percentage of visitors who enter a website and then leave (“bounce”) without continuing to other pages within the same site. However, the introduction of Google Analytics 4 (GA4) shifted the focus from bounce rate to more nuanced engagement metrics. GA4 measures “Engaged Sessions,” where a session is considered engaged if it lasts longer than 10 seconds, includes a conversion event, or the user views two or more pages. Brand A brand distinguishes a product or service with a distinctive design, emblem, name, or a mix of these elements, setting it apart from rival offerings. It represents the identity of a company or product, encompassing the values, attributes, and overall experience it promises to its customers. A brand extends beyond physical characteristics to include perceptions and emotional connections with the audience. It is built through consistent marketing, customer service, product quality, and overall user experience. Strong branding can lead to recognition, loyalty, and preference in the marketplace. Branded keywords Branded keywords are search terms that include a brand’s name or specific trademarks. They may also contain product names, name variations, or a combination of the brand and a product or service type. These keywords are used by individuals familiar with the brand and looking for something directly related. Branded keywords are crucial for a company’s SEO strategy, as they often lead to higher conversion rates due to the existing awareness and interest from the searcher. Breadcrumbs (in WordPress) A clickable path that you find on top of a page that helps users find their way around a site. You can use breadcrumbs in various ways with Yoast SEO. To implement them on your entire site, you must configure them with Yoast SEO. Alternatively, with the Yoast SEO breadcrumbs block, you can implement breadcrumbs on individual posts and pages. You will find settings that let you optimize your breadcrumbs in the Yoast SEO sidebar and meta box and the Yoast SEO Search appearance settings. Broken link A broken link is a hyperlink that fails to connect to its intended webpage or resource because the destination no longer exists or has moved. Reasons for broken links include deleted or relocated content, changes in URL structure, or an expired domain. These links create dead ends for users and can damage a website’s SEO by suggesting to search engines that the site is not well-maintained. Browser A browser, short for web browser, is a software application used to access, retrieve, and view information on the internet. As a user’s gateway to the World Wide Web, browsers translate web pages and resources – such as HTML files, images, and multimedia content – into visual and audible formats that people can easily read and interact with. Popular browsers include Google Chrome, Mozilla Firefox, Safari, and Microsoft Edge, each offering unique features and user experiences. Caching Caching stores copies of content, such as files or data, in a temporary location,"
