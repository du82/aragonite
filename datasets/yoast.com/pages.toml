title = "Enrico Battocchi • Senior developer - Team lead • Yoast"
description = "Enrico Battocchi is Senior developer - Team lead at Yoast. Read about them and find out their posts, which events they're going to and where they've been!"
full_description = "Enrico Battocchi In 2007 I started developing Duplicate Post, which over time has become one of the most popular plugins for WordPress. Since June 2020 I has followed my creation in joining Yoast, where I work as a web developer. My first encounter with computers were the punched cards and magnetic tapes from my father’s job in a bank, before I even turned 3. After a short time, I got my first home computer, a ZX Spectrum which is still alive and kicking.I’m on the Internet since late 1996, and I’ve been using GNU/Linux since 1998. I started working as a web developer while studying Computer Science Engineering, and I became a freelancer in 2010.Since 2007 I’ve been using WordPress for almost every personal and work project. I’m proud to be part of the vibrant Italian WordPress community, and I’ve been speaking at WordCamps in Italy and in Europe. I live in Livorno, on the coast of Tuscany, Italy; in my spare time, among a lot of other things, I’m a movie buff and I frequently organise film festivals in my town."
