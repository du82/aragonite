["https://yoast.com/about-us/team/andrea-fercia"]
title = "Andrea Fercia • Accessibility & web developer • Yoast"
description = "Andrea Fercia is Accessibility & web developer at Yoast. Read about them and find out their posts, which events they're going to and where they've been!"
full_description = "Andrea Fercia I graduated with a degree in Political Sciences from the University of Rome, Italy, a few years ago, when the Internet, as we know it today, didn't exist yet. A few years later, I started what initially was a hobby, dabbling with HTML when websites were built using layout tables. My hobby ended up being a real job when I moved to Milan, Italy, in 2001. At that time I was working as a project manager in a small web agency, building web applications for enterprise customers. You can find Andrea on: TwitterGithubWordPress Very soon I started focusing on web content accessibility. Studying legal requirements, W3C specifications, and so on, was part of my job. It soon became a passion when I started to understand that accessibility can make a difference and really give universal access to content and services for everyone. That’s what I do at Yoast too. I’ve joined Yoast in March 2016 and since then I’m working remotely from Italy, enjoying working with my Dutch colleagues, and helping to improve the accessibility of Yoast’s technology. In my spare time, I’m a bit busy. I’m also a WordPress permanent core committer, where I do my best, together with the WordPress a11y team, to improve the accessibility of the most used publishing platform in the world. You can find me on twitter @afercia"
