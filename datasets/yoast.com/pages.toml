title = "Werken bij Yoast • Vacatures"
description = "Wereldwijd gebruiken meer dan 10 miljoen websites onze Yoast software. Daarmee zijn we een van de meest invloedrijke SEO bedrijven ter wereld. Het kan altijd anders, we zoeken altijd naar verbeteringen. En daar hebben we jou bij nodig!"
full_description = "“Ik heb bij Yoast in korte tijd ontzettend veel geleerd. Ik ben binnengekomen als stagiair en ben een paar jaar later senior developer. Er wordt bij Yoast goed geluisterd naar wat jouw ambities zijn en je kan er altijd op rekenen dat je de tools en ruimte krijgt om jezelf te blijven ontwikkelen.” Diede - Senior developer “Wat ik superfijn vind aan het werken bij Yoast is dat er veel aandacht is voor de werk-privé balans. Dankzij het gedeeltelijk doorbetaalde ouderschapsverlof krijg je de kans om meer tijd met je kind te besteden. En met een peuter die zijn weerstand nog aan het ontwikkelen is, is het heel prettig dat zo nu en dan zorgverlof geen probleem is!” Willemien - Manager content"
