title = "About us • Yoast"
description = "The mission of Yoast is SEO for Everyone. We want to give everyone the opportunity to rank in the search engines."
full_description = "About us We are Yoast and our mission is SEO for everyone! So, how do we achieve that? For starters, we have our Yoast SEO software, which is active on more than 13 million websites. Pretty awesome to help out that many people, right? Our goal is simple: we help website owners get more traffic from the search engines. For example, we help our users keep their content nice and easy to read for their audience. But most importantly, we make sure search engines can find and understand their pages! Because that’ll help with ranking high in Google! Yoast SEO also takes care of a lot of technical SEO stuff in the background. So, you don’t have to write any code to use our software! SEO for everyone also means we share our knowledge with everyone. The Yoast SEO Academy has an impressive catalog of courses that cover a wide range of topics. Among other things, we teach people how to do keyword research and to use structured data to get rich results. So far, the academy has helped over 300,000 people (and counting) master SEO and improve their websites. And, there is also our blog: it’s the place where we share SEO tips, news, and best practices. Nearly a million users visit our website every month! At Yoast, we are strongly committed to making the web better. We work together with other companies (Google/ Microsoft) to improve the web, for instance by contributing to the schema.org project. And, as open source fanboys and girls, we are dedicated to WordPress as well! Together with the WordPress community, we can help it maintain its position as the fastest-growing CMS! As a company, Yoast strives for openness, diversity, and equal opportunities. Our team consists of about 110 people. We have around 70 people working in Wijchen, The Netherlands, and the rest of the Yoasters are based all over the globe. Even when we have colleagues from outside of the Netherlands we keep the company culture alive and make work fun and meaningful. So, besides offline events, we also organize online events, meet-ups, drinks and even sports can be done together online! Mission » At Yoast, we believe that SEO should be for everyone. We believe in creating equal chances for everyone in the search results. We keep our mission in mind in everything that we do. The leadership team » ​Meet the Yoast leadership team, a group dedicated to providing the best tools possible, so everyone has an equal chance in search results. Their passion has made Yoast one of the most trusted names in the SEO space. Core values » At Yoast, we’re working together to make the web a better place. We believe in collaboration, sharing knowledge and making work fun and meaningful. We highly value equality and inclusiveness. Yoast reviews » We could tell you about our plugins and what they can do for you. But frankly, nobody can do that better than our users! And if you like what we do, don’t hesitate to leave a review! Work at Yoast » At Yoast, we feel work should be fun and meaningful. We’re making Yoast together and value everyone’s input. Want to join us? Check out our vacancies (EN) or onze vacatures (NL) Benefits » We’re convinced that if you take good care of your employees, your employees will also take good care of you. That’s why we offer our employees special benefits (EN) or voordelen (NL)! Meet the team » Yoast grew so quickly we now consist of 100+ people, we all have different tasks and backgrounds. Check out who we are! Conferences & meetups » We are very active at WordPress meetups, WordCamps and other conferences. Want to meet us? Check out where we’ll be! Product philosophy » We believe that the role of our software is to help people maximise their chance of success online. That means providing them with a strong technical foundation, giving them tools and resources, educate them, and helping them make the right decisions. Innovations » In trying to keep ourselves and your website on top of their games, we are in a continuous process of innovation. Visit this page to read about some of these innovations and our thought process! Community involvement » Yoast sponsors dozens of WordCamps around the world, organizes events such as WordPress contributor days in our HQ and supports valued WordPress community members. It also goes beyond that to also support those in the LEB Find out more about our community involvement and our impact! History of Yoast » Yoast was founded in 2010 by Joost de Valk. Since then, lots of things have happened and many more people have had their impact on Yoast. Read all about it! Brand resource center » Want to know more about our brand and design choices? Or the thought process behind our awesome illustrations? You can find all of this in our brand resource center! Yoast & LEGO » Our team is crazy about LEGO. Our offices are full of them and lots of us have our fair share of LEGO at home. We even have an annual LEGO day. Find out more about our love for these tiny bricks! Contact us If you want to get in touch with us, fill out the form on our contact page! For logo’s, interviews and other media, please visit our media page. If you want to send us stuff, use this address: Yoast BV Don Emanuelstraat 3 6602 GX Wijchen The Netherlands Articles relating to our mission and vision WordPress core contributions » Get free SEO tips! Get weekly tips on how to optimize your website's SEO, usability and conversion Be the first to know about new features and other cool (free) plugins. Get our free courses right away to learn how to make your site rank higher. Email Yes, give me your free tips » Privacy notice"
