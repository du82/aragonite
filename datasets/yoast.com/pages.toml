full_description = 'WordPress 6.6: The 6 highlights in this release! 17 July 2024 Camille Cunningham WordPress 6.6 is here and it comes with a suite of new features and improvements. Features that will give you more control over the look of your website, peace of mind when auto-updating plugins, and introduce you to some improved workflows. Here’s a sneak peek into the key highlights of this release. Page previews in […] Read: "WordPress 6.6: The 6 highlights in this release!" | Tags Gutenberg, WordPress Is OSO, organic search optimization, the new SEO? 27 June 2024 | 2 Comments Camille Cunningham There’s a new kid in town, and it’s one you want to be friends with: OSO. It stands for organic search optimization, and with the Search Generative Experience rolling out, this acronym is one you should pay attention to. It’s not here to replace our good old SEO. But it does want to change your […] Read: "Is OSO, organic search optimization, the new SEO?" | Tag Holistic SEO How does Google understand text? 16 May 2024 Camille Cunningham At Yoast, we talk a lot about writing and readability. We consider it an essential part of SEO. Your text needs to be easy to follow and it needs to satisfy your users’ needs. This focus on your user will help your rankings. However, we rarely talk about how search engines like Google read and […] Read: "How does Google understand text?" | Tags Content SEO, Google algorithm Word count and SEO: how long should a post or page be? 9 April 2024 Camille Cunningham We often get the question of how long an online text should be. As this often depends on different factors, giving just one answer is difficult. But looking from an SEO and user-oriented perspective, there is a rule of thumb you can follow. We advise writing more than 300 words for posts or pages, while […] Read: "Word count and SEO: how long should a post or page be?" | Tags Blogging, Content SEO, Readability, SEO copywriting WordPress 6.5: The features you want to know about 2 April 2024 | 4 Comments Camille Cunningham WordPress 6.5 is live! Once again, the WordPress team, consisting of people from all over the world, has many new improvements for us. We looked at the exciting, new features and listed them for you. So, let’s see how you can use these changes to improve your WordPress website now that the release is live. […] Read: "WordPress 6.5: The features you want to know about" | Tags Gutenberg, WordPress'
