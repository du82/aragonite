["https://yoast.com/terms-of-service"]
title = "Yoast Software Services Terms & Conditions • Yoast"
description = "Date of last modification: August 29th 2024 You can find our Yoast SEO for Shopify Terms of Service here. Download the terms of service PDF. Your use of the software, applications and other products and services provided by Yoast (the “Services”) is subject to the terms and conditions set forth in these Yoast Terms of […]"
full_description = "Terms of service Date of last modification: August 29th 2024 You can find our Yoast SEO for Shopify Terms of Service here. Download the terms of service PDF. Your use of the software, applications and other products and services provided by Yoast (the “Services”) is subject to the terms and conditions set forth in these Yoast Terms of Service (“the Agreement”). Term. By purchasing the Services, you agree to allow us to place you on a recurring term of 1-year periods. The Agreement is active from the day we receive your initial fee payment and will last for one year (“Initial Term”). The Agreement will automatically renew for successive periods of the same period (each a “Renewal Term”) until terminated by either party. The Initial Term and any Renewal Terms shall be collectively referred to as the “Term.”. Installation. When you purchase our software, you can choose for either the manual installation or automatic installation flow. You are entirely free to choose which installation flow you would like to follow; however, we do recommend you to closely follow the installation steps as described on the designated page of our website. Although we do our best to prevent any bugs, we cannot take responsibility for any complications that occur when you install our software, such as security complications and downtime of your website. Before installation make sure that your website is compatible with the Yoast software. Payment & billing. You will pay to Yoast all fees for the Initial Term of the Services you buy set forth on the checkout page at the time you order our Services. After we receive your payment, the Services will immediately be available to you. You will pay to Yoast all fees for each Renewal Term of the Service at the time of renewal, which is the date your previous term expires. This date is listed as ‘next billing’ in your MyYoast account. Fees must be paid in the manner(s) made available by Yoast. Your subscription will automatically be re-billed for each Renewal Term on the date your Initial Term or previous Renewal Term expires, and we will take payment from the payment method you used for your previous purchase. We may make multiple attempts to collect payment from the payment method on file if the initial attempt is not successful. We shall give you notice of the upcoming charge two (2) weeks before the payment date for each Renewal Term. This notification will be sent to the contact email address in MyYoast. If we fail to collect payment after mutual attempts, we may cancel your subscription. All fees are non-refundable when paid except as provided in our Refund Policy. For most Services, we offer a 30-day money-back guarantee after your initial purchase. Pricing. The advertised fees do not include any applicable sales, use, revenue, excise or other taxes imposed by any taxing authority with respect to the Services provided hereunder. VAT taxes are added and made visible during the checkout process before you make a purchase so you know what price you will pay before purchasing. We may change the prices of our Services from time to time. We may once every payment period adjust the fees for the next payment period. We will announce any price change in advance. If we increase the price within three months after you purchased any of our Services, you may terminate the Agreement. Support services. We provide support for your active subscriptions in the best way we can. We do this via email and live chat and might use different channels in the future. You can reach us via the plugin, via MyYoast and at support@yoast.com. Availability and manner of contacting will be published on the Yoast website and other channels. Support services are only available for any Services for which you have paid the applicable fees. Update services. Yoast will from time-to-time release updates to the software. Those updates aim to improve functionality or address bugs or limitations. The released updates are available to you if you have an active subscription to the updated software. We always want to improve the user experience. We therefore encourage you to address any issues you come across. Your feedback is important to us for future updates. Yoast owns all updates and will make them available under the GPL license as with all Yoast software. Updates can be installed in two ways; manual and automated. If you choose to manually update, we will send you a notification whenever a new update is available, which you can then install. When you choose automated updates, you will need to consent to automated updates once, after which new updates will be automatically installed. Beware that you are responsible for the compatibility of your website with new updates, regardless of the manner of installation. Updates to the software are only available for any Services for which you have paid the applicable fees. Unilateral amendment. Yoast reserves the right to unilaterally modify these terms of service or to modify, change or discontinue any aspect of the Services at any time. Such changes or modifications shall be effective immediately upon publication thereof. Termination. You may terminate the Agreement having effect the following Renewal Term, which must be done at least before the start of the day that is listed as ‘next billing’ in your MyYoast account. You can terminate the Agreement by giving notice in your MyYoast account. If you qualify as a consumer under applicable law, you have the right to terminate the Agreement during each Renewal Term at any time with one month’s notice. In such case you will receive a refund for the remainder of the aforementioned contract period. Termination by Yoast. Yoast may terminate the Agreement or limit its services to you without notice in the event: You fail to pay any fees due under the Agreement to Yoast; You violate the terms and conditions of the Agreement; the website(s) in question contain(s) explicit or offensive content; you are abusive towards Yoast’s staff in any manner; you repeatedly make demands that are unreasonable or clearly outside the scope of the Agreement; For any other lawful reason, including to comply with applicable law. In such event, Yoast will not refund to you any fees paid in advance of such termination or limitation and you shall be obligated to pay all fees accrued prior to the effectiveness of such termination. Termination or limitation of Services is determined by Yoast at in its sole discretion. Discounts. The applicability of any discounts may be determined and announced at Yoast’s sole discretion. No rights can be derived from any previous discount regarding applicability of any discount for any Renewal Term or purchase of any Service. No personal data. You shall not share any personal data with Yoast other than described in our Privacy Notice. If you do, you shall fully indemnify Yoast for all costs and damages associated with its processing and removal, including administrative fines and costs of secure deletion. Limitation of liability. Except in case of intentional misconduct or gross negligence, Yoast accepts no liability for any damages caused in connection with the services under this Agreement. This includes but is not limited to damages in the form of data loss, failure to operate, lost revenue or missed profits. Governing Law. Dutch law is applicable to this Agreement. Any disputes in connection with this Agreement are governed by Dutch law and must be brought before the courts of Arnhem, the Netherlands. Additional terms for Video SEO and Local SEO for WordPress plugin. In the Yoast Video SEO for WordPress plugin, we use the YouTube API. If you are using this plugin to embed YouTube videos, by agreeing to the Yoast Terms of Service, you also agree to the YouTube terms of services and Google Privacy Policy In the Yoast Local SEO for WordPress plugin, we use the Google (Maps)API. If you are using this to embed Google Maps, by agreeing to the Yoast Terms of 