["https://yoast.com/help/guide-for-yoast-seo-for-shopify"]
title = "Quick start guide for Yoast SEO for Shopify • Yoast"
description = "Do you want to know how to use Yoast SEO in Shopify? This guide explains all the things Yoast SEO can do for you!"
full_description = "Quick start guide for Yoast SEO for Shopify You landed on this page, which means you probably use Yoast SEO for Shopify (or at least plan to do so). Exciting! We’re happy you decided to take this step. So, we created this guide for Yoast SEO for Shopify that explains everything Yoast SEO can do for you. But we have more learning materials available to you. Want to make the most of Yoast SEO in Shopify? Login to MyYoast to check out the free Yoast SEO for Shopify course. It will teach you to use all the great features of Yoast SEO to their full potential! Yoast SEO for Shopify tutorial Table of contentsYoast SEO for Shopify tutorialHow to access Yoast SEO for ShopifyFirst things to do after installing Yoast SEO for ShopifyHow to optimize your product pages with Yoast SEOThe Yoast SEO analysis for other content typesHow your pages will look on the SERPs and social mediaThe settings tab in Yoast SEOWhat should you do yourself?What do you get with Yoast SEO for Shopify?Switching to and uninstalling Yoast SEO24/7 support How to access Yoast SEO for Shopify There are several ways to access Yoast SEO in Shopify after you’ve installed it. Accessing Yoast SEO via Apps When logged in to your Shopify admin, select the Apps menu. You will be able to see the installed apps and select Yoast SEO. That will immediately take you to the screen where you can optimize your content and configure the Yoast SEO settings. Find Yoast SEO for Shopify in the Apps section Accessing Yoast SEO via More actions If you are already working on a page and want to improve its SEO, go to the More actions button in the top right corner of the screen. Click on it, and then select Optimize in Yoast SEO. That will take you straight to the Optimization settings for that page. Find Yoast SEO in the More actions drop-down menu Accessing Yoast SEO via the Shopify sidebar Accessing Yoast SEO through the Shopify sidebar is possible, but you must first “pin it.” You can do this by logging in to your Shopify admin, selecting the Apps menu, and then opening Yoast SEO. The Yoast SEO app will appear in the Shopify sidebar. Click the pin icon to pin the app to the sidebar. Pin Yoast SEO to your navigation bar First things to do after installing Yoast SEO for Shopify Pin Yoast SEO to your Shopify sidebarYou can pin Yoast SEO to your sidebar to get easy and quick access to Yoast SEO. Follow the steps in the previous paragraph to do that! Fill in the Site representation settingsThe most important thing is to fill in the Site representation settings. You can find them through Yoast SEO > Settings > Schema > Site representation. When you fill the data in, Yoast SEO will combine all the information about your site and tell search engines what your website is about. As a result, your site may get featured in a Google knowledge panel and increase your visibility in the search results. So fill in your website info, organization info, logo, and social profiles, and you’re all set. Fill in the Site representation section in Yoast SEO for Shopify You can also add the social media profiles that belong to your organization. 3. Set your site defaults Go to Yoast SEO > Settings > Site settings > Site defaults. In these settings, you can choose and fill in: The Site title & Separator: this will be the default template for the SEO title (the title that explains to search engines what a page is about and that appears in the search results) of your whole site. With this, you always have a backup if you forget to fill in the SEO title. The site image: this image also functions as a backup. If you make many pages, you’re bound to forget to add an image on an individual page (we’re all humans, right?). So, in case that happens, you can always be sure you’ll have an on-brand image! Turn on the inclusive language analysis if you want to be notified when you use language that excludes people. The analysis will also give you suggestions for inclusive alternatives. These settings won’t overwrite anything, nor can they break your site. They are only a backup when you have an empty SEO title or image on your site. 4. Optimize your first product pageNow you’ve filled in the most important settings, it’s time to start optimizing. In the remainder of this page, you’ll find an in-depth explanation of optimizing your product pages. But here, we’ll give you a quick overview of the most important things you should do. First, once you’ve accessed the Yoast SEO app, pick out your most important product page. For every product page, there are five things you should always do: Fill in your Focus keyphrase; this is the keyphrase that you’d like to rank for. Make your product page SEO-friendly with the SEO analysis. Make the content of your product page readable with the Readability analysis. If you activated this, please ensure your content passes the inclusive language analysis. Optimize your SEO title and meta description in the Search appearance and Social media appearance section. Great, now you know how to get started with Yoast SEO! But, to learn about everything the app can do for you, we advise you to keep reading. How to optimize your product pages with Yoast SEO Yoast SEO helps you write product pages your customers will love. In addition, it assists you in preparing your content for search engines. It guides you in writing easy-to-read content and ensures you correctly use the keyphrases you want to rank for. Yoast SEO offers Readability, SEO, and Inclusive language analysis for all your content types. For example, you can use the analysis for your blogs, collection pages, pages, etc. In this article, we focus on the product page analysis. Most of the checks we perform here are also available for the other content types (and for some content types, there are additional checks). The main difference in the checks for different product types is how we calculate the scores. If you would like more information, check the tabs below this section. Make it easy for customers to understand your message with the readability analysis The readability analysis contains various checks designed to help you make your product descriptions easier to read and understand. When customers find it easy to get what your product is and why you are selling it, they are more likely to buy it. Optimize the readability of your product pages Yoast SEO contains the following checks to make your descriptions easier to read. Lists Lists make your product pages easier to scan, so people can quickly find what they need. This check will give you a red traffic light if there are no lists on your product page and a green one if the page has at least one list. Transition words Transition words help you create a flow between your sentences and paragraphs. The transition words check works only if your product description is at least 200 words. Passive voice Using too much passive voice can make your content difficult to read. So, this check assesses whether the number of sentences containing passive voice exceeds the recommended maximum amount. The amount will vary depending on the length of your content. Sentence length Using too many long sentences can get in the way of delivering your message. Yoast SEO will warn you if many sentences (depending on the overall length of your content) contain more than 20 words. Paragraph length Writing short and focused paragraphs can help customers scan through your product page and easily digest the information you present. Yoast SEO gives you an orange or a red traffic light for product pages if the paragraphs exceed the recommended maximum length of 100 words. Subheading distribution Adding subheadings is another way to make your product pages easier to scan. However, that applies in cases where your descriptions are long enough. So, if your product description contains more than 300 words, the app will suggest adding subheadings. Word complexity Yoast SEO for Shopify also analyzes the complexity of the words you use to write about your products. Too many difficult words make it harder for people to understand what you mean or what your product does. The SEO analysis helps search engines understand your content With the SEO analysis in Yoast SEO, you ensure that your product descriptions are focused on the keyword or keyphrase you want to rank for. So it does the following checks. Yoast SEO helps you make your products SEO-friendly Keyphrase in introduction Using your keyphrase in the introduction of your product description will immediately make it clear to customers what that product is about. This check ensures that your keyphrase can be found in the first paragraph of the text. Keyphrase distribution It’s not only that you need to use the keyphrase in your content, but it’s about how you use it. Repeating it often at the start of the content and then forgetting about it is not great for SEO. Yoast SEO makes sure your keyphrase is evenly distributed throughout your content. Keyphrase density You write your product pages to convince customers to buy your products. But search engines need to understand what the product is as well. So, the keyphrase density assessment checks whether the (content) words from the keyphrase are used in the text and whether they are used often enough (but not too often). For the app to recognize the keyphrase, you should use all the keyphrase content words in one sentence. The keyphrase length To increase your chances of ranking, we recommend optimizing your content for a long keyphrase. This assessment checks whether the keyphrase’s (content) words are within the recommended limit (between 4-6 words). Keyphrase in meta description The meta description is the short text that appears in the search results. You can use your focus keyphrase in the meta description to make your product page stand out in the results. Search engines often highlight it, making it even more visible to customers. This assessment checks whether you’ve used all (content) words from the keyphrase in the meta description. Keyphrase in subheadings Like the people who land on your product page, search engines use subheadings to scan the content and determine what the page is about. Keywords help them understand the page. So, this assessment checks whether H2 and H3 subheadings reflect the topic of the copy (based on keyphrases or synonyms). For languages with function word support, a subheading is considered to reflect the topic if at least half of the words from the keyphrase are used in it. For languages without function word support, a subheading is considered to reflect the topic if all content words from the keyphrase are used. Keyphrase in title The title of a page is among the first things people see. That’s why it is crucial to use your keyphrase in the title. Yoast SEO checks if the keyphrase is used in the page title (when function words precede the keyphrase in the title, they are filtered out when determining the position of the keyphrase in the title). Image alt tags Images need to be understood by search engines and people who use screen readers. You can facilitate that by adding alt tags to your images. If you’ve forgotten to add some, Yoast SEO will remind you. Image keyphrase assessment Ideally, when adding alt-tags to images, use your keyphrase and make it abundantly clear what your image is about. It checks if there are keyphrase or synonyms in the alt attributes of images. Competing links Search engines use links to understand pages. So, optimizing a page for a particular keyphrase and then using the same keyphrase in an anchor text to link to another page may confuse search engines. They may have trouble understanding which page to rank better. Yoast SEO ensures you avoid this by checking whether links in the text use the keyphrase as their anchor text. The text length This check makes sure your content contains at least 200 words. By doing that, it encourages you to give all the necessary information customers may need about a product. Slug keyword assessment Adding the keyphrase in the URL slug gives an additional hit to search engines about the page’s content. You’ll also find a check that ensures you’ve included your keyphrase in the slug in the Yoast SEO analysis. Images and videos Images (and/or videos) are crucial on product pages since they allow you to show the product to your customers and convince them that it is as good as you claim it to be! This check ensures you have at least one image or video on your product page. The meta description length A meta description is like a pitch for your product. But, if your meta descriptions are shorter, you risk having them cut off in the search results, which may lead to losing some valuable information. Yoast SEO checks if your meta description has a length between 120 and 156 characters. The SEO title width The SEO title is the title that appears in the search results. So, besides the page’s title, it can also contain a separator and/or the site’s name, for example. If the SEO title is too long, it may get cut off. That’s why Yoast SEO checks if your SEO title is of good length. Just so you know, this assessment checks the SEO title as it appears in the snippet preview. Therefore, it also takes into account the content from replacement variables. Barcode Product identifiers are essential for ecommerce SEO. Yoast SEO for Shopify ensures you remember to add these. It comes with a check for product barcodes. SKU Similarly, Yoast SEO for Shopify checks if you’ve added an SKU for your product. Adding synonyms and related keyphrases Yoast SEO runs a lot of checks for your focus keyphrase. However, add keyphrase synonyms that the app considers when running the analysis to make your writing more engaging and varied. In addition, you can add related keyphrases, which will have a separate analysis. You can also find and add related keyphrases with the Semrush integration* Add related keyphrases that you want to have your products checked for The Schema tab Yoast SEO automatically describes your pages using Schema.org. This helps Google understand your website and your content. As a result, Google may feature your products in the Google Shopping section or display them as rich results. For Products, you cannot change the default Schema we output. However, if you are writing a blog post or a page, you can choose the type of Schema Yoast SEO outputs. You can pick a more specific schema type for your articles or pages Guiding the search engines The Advanced settings allow you to decide what to show to search engines and, by extension, what shows up in the search results. For instance, you can hide the entire page or parts of it, such as the links or images. Moreover, you can instruct search engines not to show a snippet of the page or its cached version. Determine what search engines should do with this particular page Cornerstone content Cornerstone content is the most important content on your site. For example, a product you always h"
