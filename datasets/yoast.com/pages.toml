["https://yoast.com/about-us/team/erwin-brouwer"]
title = "Erwin Brouwer • Illustrator • Yoast"
description = "Erwin Brouwer is Illustrator at Yoast. Read about them and find out their posts, which events they're going to and where they've been!"
full_description = "Erwin Brouwer I am an illustrator working at Yoast since 2012. Here I’ve been making a large part of the images that make up the company’s visual branding. Whether it’s logos, blog illustrations, avatars or company mascots, I’ve done it all. This versatility in assignments is what I love most about my job. One day I can make a colleague happy with a drawn portrait; the next day I’m grinding my brain to come up with an image that can accompany a blog post about some abstract SEO term. I’ve seen from up close how Yoast became the company it is today. It’s been quite a ride and I’m very curious what the future will bring. Since 1997 I’ve been together with Mijke and we live happily with our son and daughter in Rosmalen. When I’m not working, I like to read books about Life, the Universe and Everything. Or watch a cool animated movie. Or trying to keep our growing plant collection alive. Or building a large LEGO set. Choosing what to do first is the hardest part."
