title = "Carl Bailey • Support engineer • Yoast"
description = "Carl Bailey is Support engineer at Yoast. Read about them and find out their posts, which events they're going to and where they've been!"
full_description = "Carl Bailey I graduated from The Ohio State University with a BFA in Art & Technology, which encompasses many type of emerging electronic mediums such as web based and interactive technologies. In addition I've also taught several courses at OSU on topics including net based art, 3D modeling and animation. After graduation I first worked as an interactive multimedia designer creating touchscreen interfaces and motion graphics animations for in-store marketing applications, as well as doing freelance web design. In recent years I’ve worked for several major hosting providers in the roles of support, design, and administrator. As WordPress is a very widely used and popular CMS for building websites from here I gained a large amount of experience in providing support for WordPress and it’s wide range of plugins. This in turn lead me to working for Yoast. I currently live in Columbus, Ohio in the United States and when I’m not working I spend my free time primarily making art, playing music, or reading. I also enjoy repairing electronics, fixing computers, and restoring vintage synthesizers."
