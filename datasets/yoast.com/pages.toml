["https://yoast.com/about-us/pride-at-yoast"]
title = "Pride at Yoast • Yoast"
description = "Embracing diversity and championing inclusion! Our mission is to empower all, irrespective of background or circumstance. We believe in fostering an environment where every voice matters."
full_description = "More than just a month Pride at Yoast Embracing diversity and championing inclusion! Our mission is to empower all, irrespective of background or circumstance. We believe in fostering an environment where every voice matters. At Yoast, we hope to empower you to be 100% your authentic self regardless of who you are. This is why we’re on a mission to spread #PrideForEveryone! Starting at home Equality and inclusion Is something that is near and dear to our hearts at Yoast. Educating colleagues The team runs year-long internal campaigns to help educate each other on topics concerning inclusion and diversity. Visibility at events Spreading joy and inclusion at every event we attend. With our Pride pins, stickers and lanyards, we ensure that people know they’re safe with us. Yoast pride flag If we are sponsoring an event that uses flags, we get out our Yoast pride flag to show that everyone is represented and has a voice. Inclusive language feature Not only is this part of our culture but it’s part of our plugin as well. By writing more inclusively, you open up your content to more people. Supporting LGBTQIA+ companies Helping them get in front of more people and spread their message to a wider audience so that we can build a more inclusive space. Company culture Cultivating a culture of empathy, respect, and understanding where everyone feels safe to express themselves. #PRIDEFOREVERYONE Pride at events Celebrating you and us – no matter who you love or how you identify. Pride wherever we go We’re on a mission to bring Pride Parties to WordPress events across the globe. Fun gatherings where everyone can be their awesome self, no matter who they love or how they identify. That’s why we often (co-)organize Pride parties at WordCamps. But the fun doesn’t stop there! We’re also a proud sponsor of the annual Amsterdam Canal Pride parade and show our support during the Pink Wednesday of the Four Day Marches. Not only to bring people together and have a good time but also to raise awareness about the importance of pride. Walking the walk Yoast and COC Netherlands Teaming up to raise the bar on diversity and inclusion. Introducing Emmie and Taco #PrideForEveryone Pride is all about celebrating diversity, promoting acceptance, and advocating for equal rights. At Yoast, we aim to get better at walking that walk every single day. That’s why COC and Yoast have entered into a strategic partnership. This partnership includes, among others, that COC helps us become an even more diverse and inclusive company. In return, we help COC optimize their website so that they’ll reach more people with their message. Creating a safe and supportive space PRISM Europe Coming together to celebrate the community Educating and celebrating PRISM Europe is an internal affinity group that highlights the spectrum of LGBTQIA+ experiences at our company through representation, connection, and advocacy. To do so, we organize events where our team comes together to learn about the importance of pride, celebrate the community and openly talk to each other about topics concerning the community. This affinity group consists of members of the LGBTQIA+ community and allies! Supporting the wider community Raising everyone up Because we all benefit from more diversity and inclusion. We all create stories about ourselves based on what we experience in our lives. If we see speakers who look like us or face similar struggles, we’re more likely to think we have a chance of becoming a speaker, too. If we only see male caucasian speakers, we might think that speaking is only for them. This is not true, of course, because everyone benefits from diverse role models. SEO and WordPress conferences struggle with creating diverse speaker line-ups that include people who identify as female or non-binary, people of color, and disabled people. People belonging to these groups are much more hesitant to apply as speakers. That’s why our Diversity Fund takes away one of the major hurdles for underrepresented speakers: travel expenses."
year_published = 2025
year_updated = 2025
