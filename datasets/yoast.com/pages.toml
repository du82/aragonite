title = "WordPress core blog • Yoast"
full_description = "Recent posts In this blog WordPress Core team members share their latest findings, awesome projects and everything worth knowing about WordPress and its lovely community. A month with the WordPress core team – June 2024 »In June, Andrea and Carolina attended WordCamp Europe 2024 in Torino, Italy. We also put some finishing touches on WordPress 6.6. Read on to learn what we’ve been up to for the past month! Our monthly updates Andrea On June I enjoyed attending WordCamp Europe 2024. For me, the conference journey started the day before […]A month with the WordPress core team – May 2024 »In May the team prepared for WordPress 6.6. We have tested the data views feature and continue to help polish the user interface to improve the usability and accessibility of the editor. In mid June, Andrea and Carolina plan to attend WordCamp Europe 2024 in Torino, Italy. We hope to see you there! Our monthly […]A month with the WordPress Core team – April 2024 »In April, WordPress released version 6.5 and 6.5.2. The team also attended Yoast Contributor Day online. In our monthly update, Andrea talks about the Roma WordPress Meetup, and Sergey describes how we are working together to improve unit tests. Our monthly updates Sergey WordPress 6.5 On April 2, after five months of development, WordPress 6.5 […] Browse through our WordPress core blog » WordPress SEO posts Of course we’ve been writing about WordPress & SEO on our SEO blog for a long time, find those posts here: Favicons and your online brand: Make sure you stand out! »Favicons are valuable for UX and branding. And these, in turn, matter for SEO. Read about favicons, SEO and your online brand in this post!BrightonSEO talk: Elevate your SEO knowledge through experimentation and moonlighting »Learn how experimentation can take your SEO knowledge to the next level with this BrightonSEO talk from our SEO Alex Moss.Black Friday & holiday season SEO 2024: 10 tips to start preparing! »The holiday season is coming! And you can never start preparing your holiday sale too early! Find out more » Browse through the WordPress posts on our SEO blog » Who is writing these WordPress core posts? This is the team that is (writing about) contributing to WordPress core at Yoast. Get free SEO tips! Get weekly tips on how to optimize your website's SEO, usability and conversion Be the first to know about new features and other cool (free) plugins. Get our free courses right away to learn how to make your site rank higher. Email Yes, give me your free tips » Privacy notice"
