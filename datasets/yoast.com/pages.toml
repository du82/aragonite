title = "Free Yoast SEO for WordPress plugin training • Yoast"
description = "Want to master the Yoast SEO plugin? Follow our Yoast SEO for WordPress plugin training • By the makers of the plugin! • For both free and Premium users"
full_description = "SEO training Free Yoast SEO for WordPress plugin training Free Yoast SEO for WordPress plugin training Get the most out of the SEO plugin for your website or your client’s site Get insights from SEO experts and the creators of the plugin such as Joost de Valk 2 hours of video, sliced into 41 bite-sized clips Covers the new WordPress block editor Yoast SEO plugin training Free Learn how to use the Yoast SEO plugin Don't miss out on handy SEO features Get the best settings for your site Easy access through MyYoast and Yoast SEO Academy Get your free plugin training now ▸ Recommended Yoast SEO Premium + Academy $99 / year Unlock all Yoast SEO Academy courses Access all features in the Yoast SEO Premium plugin Master all aspects of SEO Improve your site rankings right away Get Yoast SEO Premium »Only $99 / year (ex VAT) What's in this course? Learn how to get your pages ranking with Yoast SEO! You will learn a whole lot about SEO and you’ll find out how to set up and use the Yoast SEO for WordPress plugin. A plugin that makes doing SEO yourself even easier. After this free training, you’ll know: The SEO fundamentals and how to get started; How Yoast SEO can help you rank higher in the search results; And how to set up the Yoast SEO plugin for your website; How to write content that attracts more traffic to your site; What to do to stand out on social media like Facebook and Twitter; How to gain control over what your pages look like in the search results; How to save yourself time by using bulk edits and linking suggestions; How to detect and fix serious SEO issues (no technical skills needed). Start your free Yoast SEO for WordPress training now What topics are covered in this free Yoast SEO for WordPress course? Introduction to Yoast SEO. A quick look at how search engines work, holistic SEO, and what Yoast SEO does for your WordPress site Getting started with Yoast SEO. We’ll take you on the backend tour of Yoast SEO, and how you can use the sidebar and metabox. In addition, we’ll show you first-time configuration which helps you set up your site. Your content and Yoast SEO. Time to dive deep into what Yoast SEO can do for your site. From keyphrases to snippets, as well as our SEO, Readability and Inclusive Language analysis, on top of our SEO feedback: we’ll show you the ropes! You’ll also learn about the linking tools, structured data blocks and insights that Yoast SEO can offer. The Yoast SEO settings. Want to truly maximize your Yoast SEO knowledge? We’ll walk you through all the settings, and explain how you can use them for your site’s benefit. Integrations. Let’s supercharge your WordPress experience and switch on the Yoast-approved integrations! Learn how you can increase your keyphrase effectivity, upgrade your site’s search experience, sell products better, and much more. Tools. Need to import or export your SEO settings, optimize your SEO data, edit your files or even edit them in bulk? With our Tools, you will be able to do so quickly. SEO workouts. Don’t know how to find out if your content is in a good shape? We’ll explain how our SEO workouts get your links and content in tip-top condition. Redirects. Switching your pages around no longer has to lead to 404s and readers getting lost – learn all about how Yoast SEO helps you redirect pages. Guiding the search engines. Let’s help the search engines! In this section, you’ll get to grips with structured data, robots meta tags, XML sitemaps, canonical links and other SEO that helps the search engine find your content. Start your free Yoast SEO for WordPress training now What is included in this free Yoast SEO for WordPress plugin training? 44 bite-sized videos: a total of 3 hours 14 quizzes to test your new skills 21 PDF files for your reference and to dig deeper into the topics you’d like to know more about Covers the new WordPress block editor Who teaches this training? All content for this course is created by the SEO and WordPress experts at Yoast: they’re the creators of the #1 SEO plugin for WordPress worldwide; combined, they have over a 100 years of WordPress experience; companies such as Facebook, eBay, and The Guardian rely on Yoast for their SEO strategies. Show off your Yoast SEO for WordPress skills with a certificate and badge Once you’ve finished the training, you’ll get a Yoast certificate and a badge you can display on your website. The badge only appears when you’ve actually completed the course, so not just anyone can use it. Add the certificate to your resume, your LinkedIn profile or use it to get that raise you deserve. Why should I do this course? This course is for you if … You own or maintain a WordPress website You want that website to rank higher in Google You’re new to SEO or want to learn how to get the most out of Yoast SEO You have the Yoast SEO plugin (free or Premium) or want to start using it You want to learn more about SEO in general Start your free Yoast SEO for WordPress training now Check out our other free courses too! Currently, we offer the following free Yoast SEO Academy courses. SEO for beginners training Learn the basics of SEO and get quick wins to make your site rank higher. Yoast SEO for WordPress plugin training Learn about how to set up and use the Yoast SEO for WordPress plugin so it makes SEO even easier. WordPress for beginners training Learn the ins and outs of creating and maintaining a WordPress website. Block editor training Learn how to create block-tastic content with the WordPress block editor. Structured data for beginners training Learn how to get attention-grabbing rich results that stand out in the search results! Start for free! Want to become an SEO expert? This free SEO course is just the tip of the iceberg. When you purchase Yoast SEO Premium, not only do you unlock all its premium SEO optimization features, you also gain access to all courses in the Yoast SEO Academy! Get Yoast SEO Premium »Get the #1 SEO plugin! Time investment How much time do I need for this free Yoast SEO for WordPress training? Want to refresh your knowledge? You can watch all videos in under 3 hours. Are you new to Yoast SEO for WordPress and willing to dig in deep? If you watch all videos, read all reading materials and ace all quizzes, you’ll be an expert in 16 to 20 hours. Worried about taking too long? No problem: you set your own pace and you have unlimited access to this course. Take your time! You can instantly apply everything you learn to your own website or your client’s website. And good to know: all material is in English Get your free Yoast SEO for WordPress plugin training now"
