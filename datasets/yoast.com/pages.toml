["https://yoast.com/open-source-story"]
title = "Open source: Better solutions and a more inclusive society • Yoast"
description = "Open source is a collaborative model that leads to better solutions and a more inclusive society! Learn more about it in our digital story on open source."
full_description = "Open source: Better solutions and a more inclusive society Perhaps you’ve heard of it: open source. If you’re familiar with it, it’s likely you’re somehow into software development, where it’s used as a collaborative model. But it’s so much more than that! It can be used elsewhere too and you don’t even need to be a developer to contribute to open source. Are you ready to explore the global phenomenon called open source? Let’s go! Table of contents What is open source? Open source or not?But, what is open source, really?What's so awesome about open source?The open source glossary Yoast, WordPress and open source Yoast, WordPress and open sourceMaking profits in open sourceWordPress open source: a reversed tragedy of the commons?Yoast and WordPress: Victory of the commons I'd like to contribute: Tell me how! You can contribute too! Open source or not? Let’s start with a quick quiz: Which of these products are (partly) created with the help of open source technology? Washing machines Open source Not open source Oops… Miele decided to open source all specifications of their washing machine hardware and software and interaction with the public is encouraged. Back Well done! Miele decided to open source all specifications of their washing machine hardware and software and interaction with the public is encouraged. Back Tesla cars Open source Not open source Oops… Yes, they are! In 2014, Tesla decided to share and open up their patents for the advancement of electric vehicle technology. Back Well done! Yes, they are! In 2014, Tesla decided to share and open up their patents for the advancement of electric vehicle technology. Back Mars rover Open source Not open source Oops… Yes, it is! NASA’s Mars rover that landed on Mars in February 2021 is partially powered by open source software. Back Well done! Yes, it is! NASA’s Mars rover that landed on Mars in February 2021 is partially powered by open source software. Back Seat belt technology Open source Not open source Oops… Yes, it is! Volvo designed the first three point belt design in the sixties. It is patented, but open for everyone to use. Also, Volvo allows open source access to its crash-research data. Back Well done! Yes, it is! Volvo designed the first three point belt design in the sixties. It is patented, but open for everyone to use. Also, Volvo allows open source access to its crash-research data. Back Houses Open source Not open source Oops… There is a movement to design, manufacture and assemble beautiful, low-cost, low-carbon, future-proof buildings, available for everyone, called WikiHouse. Back Well done! There is a movement to design, manufacture and assemble beautiful, low-cost, low-carbon, future-proof buildings, available for everyone, called WikiHouse. Back Wikipedia Open source Not open source Oops… Of course it is! Wikipedia’s code is open source and wiki content management system is open source. And, as you probably know, anyone can help improve the content on Wikipedia. Back Well done! Of course it is! Wikipedia’s code is open source and wiki content management system is open source. And, as you probably know, anyone can help improve the content on Wikipedia. Back Netflix Open source Not open source Oops… No, Netflix itself isn’t completely open source. But, they provide and use lots of open source components and actively support and contribute to open source technology. Back Well done! No, Netflix itself isn’t completely open source. But, they provide and use lots of open source components and actively support and contribute to open source technology. Back Open source is everywhere! Without you even being aware of it, you’re probably making use of open source software multiple times a day. Read the video transcript TranscriptWithout being aware of it, you’re using open-source software every day. For example, let’s say, you’re on your computer. *Ping!* a new newsletter in your mailbox (Is it the Yoast newsletter? Yay!). Look, there’s a link in the newsletter. When you click it, the web page opens in your browser. That browser happens to be Firefox, it’s open source and the second most popular browser in the world! (after Chrome, which heavily relies on Chromium, an open-source project too). The web page you visit is most likely created on the open-source platform WordPress. Did you know more than 35% of websites worldwide are built with this CMS? It has PHP running, which is an open-source scripting language. Hey, there’s a pop-up, built with JavaScript, that’s open-source coding for more complex and dynamic elements on a website. Oh, and by the way, did you know there’s a big change that the person who built this website, used Linux, an open-source operating system, very popular amongst developers? Amazing isn’t it! But, what is open source, really? Open source is a term stemming from software development. It’s a collaborative model: Open source software is software that’s developed within a community. The source code of the software is open; everybody can access, use, alter and distribute the code. People are encouraged to participate and to improve the software. As you’ve read above, the open source model is used in other areas than software development too; its principle is used in, for instance, car manufacturing, architecture, design or hardware. Open source Read the video transcript TranscriptHi! In the previous lesson, we’ve discussed what WordPress is and what you can do with it. And, one of the things we talked about was that WordPress is open-source. But what does that mean? In this lesson, we’ll explore the definition of open source, and we’ll share why we at Yoast think open source is so very awesome. Okay, so, what is open source? Open-source software is software that is developed within a community. Everybody can use, alter, and distribute the code of the software. People are encouraged to participate in and improve upon the software project. There are a lot of examples of open-source software. The Mozilla Firefox internet browser, that’s open source. And maybe you’ve heard about Linux? As we’ve already discussed, WordPress is an open-source CMS. And of course, all of the Yoast plugins are open source too. Being open-source is actually one of the core values of our company. But why do we love open source so much? Well, we basically love open source for three reasons: First of all, we believe that open source is the best way to get new innovations and new solutions to the problems we face. This comes down to: two heads are just better than one. The knowledge of two or more people combined will always exceed that of one person alone. We believe that if you work together on a solution, this will lead to better solutions. The second reason why we love open source is because it helps avoid wasting talent and skills. Lots of people around the world are working on solving the same, or similar problems. That’s a waste of talent and skills. We shouldn’t have to reinvent the wheel over and over again. And with open-source, we share our knowledge about the invention of the wheel. We make other people benefit from our wheel. And we let other people improve upon that wheel. The third reason why we love open source is because it’s inclusive. Open-source projects like WordPress invite everyone to participate. Really everyone. If you want to contribute to WordPress, you can. It doesn’t matter what you want to do, where you live, how much money you have, or what you look like. Everyone has their own talents, and your talents will be recognized in the open-source community. Whether you have programming skills, you love translating, you have superb organizational skills, or a great sense of community – everyone can contribute! So, at Yoast, we really believe in open source. Just like WordPress, our source code is open, and other people actively contribute to making it better. And we contribute to other open-source projects, like WordPress Core. The developers at Yoast learn from each other, but they also learn from all the other developers who are active in the WordPress project. Sparked your interest? In Module 8 of this course, which is optional, we’ll discuss more about the story behind WordPress. How did WordPress start? What’s the WordPress community like? And how can you contribute? We’ll tell you all about it! But first, we’ll dive into how you can use WordPress to create your own site! Collaboration is key In general, people like to reproduce and improve something that already exists, for example: You ask your aunt how she maintains her kitchen garden, you learn from that, search for extra information online and base your own kitchen garden upon all this knowledge and even manage to squeeze in some improvements.A student in university that writes his thesis based on literature written by other smart people (that probably based their literature off of research or maybe even other literature).But it can even be as simple as you improving the commonly known recipe for Stroopwafels, a delicious Dutch cookie. The above are all examples of collaboration one way or another. What’s so awesome about open source? #1 Open Source is the way to new knowledge and solutions Two heads are better than one: the knowledge of two or more people combined will always exceed that of one person alone. If people – especially people from different backgrounds – cooperate on a project, the project will benefit. Working together on a solution, simultaneously or not, will lead to better solutions. In short: we should stand on each other’s shoulders; we should take advantage of each other’s merits and talents. That’ll lead to true innovation. #2 Open Source is not wasteful Lots of developers around the world are working on solving the same, or similar, problems. That’s a waste of talent and skills. Why should every school have a different website? Sure, the design and content of those websites can be unique, but the backend and the functionality of these websites could be pretty much identical. We shouldn’t reinvent the wheel over and over again. If we’d do things the open source way, we’d share our knowledge about the invention of the wheel. Make other people benefit from our wheel. And, let other people improve upon that wheel. #3 Open Source is an equalizer Open source projects invite everybody to participate. Everybody. If you want to contribute to WordPress, you can do that. What company you work for doesn’t matter. It doesn’t matter where you live. It doesn’t matter how much money you have, or what you look like. Everybody has their expertise, and your talents will be recognized in the open source community. It’s a very inclusive concept. It offers chances to everybody, whether they have (some) programming skills, love translating, have superb organizational skills, or a great sense of community to get others involved. Everyone can contribute! My wish: A call for open source architecture Not convinced yet that open source can make a meaningful contribution to society? Then this video is a must-watch. Transcript Yoast, WordPress and open source Why this shoutout for open source? At Yoast, it’s at the heart of what we do. We even dare to say that the existence and success of our company are partly due to the open-source model. We truly believe that with openness and joint efforts we can create better code, products, websites and perhaps even a better world. At Yoast, we develop plugins for WordPress. WordPress is an open source content management system (CMS), a relatively easy platform to build websites with, even for beginners. It powers more than ⅓ of the internet. All our plugins are open source, as is our flagship plugin, Yoast SEO. We don’t just open up the source code, but we encourage other people to help us improve it as well. In return, team Yoast also contributes to the betterment of WordPress itself. Making profits in open source Now you might think, contributing to better solutions sounds great and all, but I need to make a living too. Wouldn’t it be better if I just focus on my business? Sell my ideas? If I invest all my time in open source projects, how does this help me? Although counterintuitive for some, developing open-source software and making profits can go hand in hand. We would even dare to state that making profits in a company active in an open-source system enhances the development of that community. To grasp this idea, we’ll take a look at the Tragedy of the commons and the Nash equilibrium. Thrive for the future Transcript Tragedy of the commons In 1833, William Forster Lloyd metaphorically described the depletion or even destruction of the common (pool) if certain people kept making individually rational economic decisions. Lloyd’s pamphlet was the base for the concept of the “Tragedy of the Commons“ which was first introduced by Garrett Hardin (1968). Hardin’s article has been influential in economics, but also among ecologists and environmental policy researchers. In 2009, Elinor Ostrom was awarded the Nobel Prize in Economics for demonstrating the concept in her book called Governing the Commons. More importantly for us, it is applicable to common-pool resources. And the open source community can be seen as such a common-pool resource. Let’s explain the Tragedy of the Commons: Imagine a pasture. A green pasture. A pasture that is open to all herders in the neighborhood. Every herdsman or -woman can put sheep on the pasture. The sheep will grow and give wool, lambs and meat. All these benefits are for the herder himself. So each herder is motivated to add more animals. This will lead to overgrazing. The pasture will become less productive. Even when the number of animals exceeds the capacity of the pasture, each herder is still motivated to add more and more animals. Surely, the herder receives all of the proceeds for the animals and only a partial share of the cost of overgrazing. Eventually, this leads to the tragedy, the ruination of the pasture. WordPress open source: a reversed tragedy of the commons? The WordPress open source community is a common-pool resource. Let’s look at this community as a pasture. It is a platform in which people can participate and contribute and from which users can download software for free. Contributing by developing software and donating your knowledge to the open source community can be seen as taking care of our pasture. But what about the sheep in this example? It seems as though in the WordPress community, developers take great care of their pasture, but hesitate to reap their benefits. It is like a reversed tragedy of the commons: there are many benefactors who bring fantastic ideas and products to the community, but who make virtually no money. So, we are pulling weeds, fixing fences and watering our pasture, while there aren’t any sheep grazing. The Nash equilibrium Scottish Economist and Philosopher, Adam Smith, stated in the 18th century that if every individual does what is best for him, t"
