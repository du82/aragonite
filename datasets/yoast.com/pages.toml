 Google’s resultsOptimize your content with Yoast SEO PremiumNow includes full access to the Yoast SEO AcademySave money with this bundle $145 / year (ex. VAT) Buy Yoast Video Premium bundle » Plugin subscription 5 powerful Yoast SEO plugins for WordPress*All online SEO courses, ranging from Ecommerce SEO to Technical SEOIncludes a full year of 24/7 supportSave money with this bundle $229 / year (ex. VAT) Buy Yoast plugin subscription » Let’s have a closer look at Yoast Video SEO Find out how Yoast Video SEO helps you compete and learn about all of the additional SEO features we add to your videos! Help Google show your videos in the search results Getting rich results for your videos doesn’t have to be difficult. Simply add the video, title, description and you are good to go. We’ll add the Schema.org structured data videoObject markup that will help Google show your videos in the search results! While Google tries its best to understand details about your video, you can explicitly provide information by adding the VideoObject structured data. It’s a must if you want your videos to appear in rich results. Speed up pages with video content Yoast Video SEO ensures pages with video content load fast by utilizing asynchronous JavaScript for video delivery. Fast pages improve user experience and your ranking on Google. So don’t leave your users (and Google) waiting! Responsive sizing without any hassle Make sure your videos fit perfectly on all desktops, phones and tablets – all without lifting a finger. No need to spend hours tinkering with code or browser testing. Delight your users with seamless videos whether they’re at home, at work, or on the move. Ensure your video preview is optimized Yoast Video SEO ensures that your video previews appear properly any time someone shares your page on Facebook or Slack by adding OpenGraph tags. Incorporating a video preview is an effective way to capture viewers’ attention, so you need to make sure it functions properly. The OpenGraph tags ensure this by instructing the user’s device on how to display the video preview on, for instance, their Facebook’s feed. Set custom, optimized thumbnails for your videos You can set custom thumbnails for your video results in search, and a preview of how it will look before publishing. The thumbnail is the first thing people see and is a major factor in determining whether or not they choose to click. A good thumbnail can make you stand out from your competition! Automate your XML sitemaps The plugin automatically creates Video sitemaps and add them to the XML sitemaps generated by Yoast SEO. The Video sitemaps help Google find and understand video content on your site. If you host videos on your site, they should be available to the outside world within an XML sitemap. Support for major video platforms Yoast Video SEO includes support for many major video hosting platforms, including Youtube, Vimeo, Wistia and VideoPress. So you can be certain that pages with videos from these platforms are optimized for SEO. Full access to the Yoast SEO Academy Covers all SEO topics, from beginner to advanced Developed by world-class SEO experts Find real-life best practices to add to your toolkit Comprehensive, engaging and easy to follow Get ready-to-use templates for your SEO strategy 24/7 Premium support Get a whole year of premium, personalized support! Easily contact us at any time to get help, advice, or troubleshooting from our expert support team. From help with getting started to expert debugging, we’re available 24/7 to assist you! You’ll need the Yoast SEO plugin (Free or Premium) In order to use Yoast Video SEO, you’ll need the Yoast SEO plugin as well. The Yoast Video SEO plugin works fine with both the free and Premium version of Yoast SEO. But do get the Premium version of Yoast SEO if you really want to kick your competition out of the race! Yoast Video SEO + Yoast SEO Premium bundle: best value for money! $145 / year (ex. VAT) Get the Yoast Video Premium bundle now! »"
