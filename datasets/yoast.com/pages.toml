description = "Meet Team Yoast and see what we can do for you and your website: SEO plugins, SEO courses, plugin configuration. Check our website for more information!"
full_description = "Team Yoast Over the past few years, team Yoast has shown tremendous growth; we’re currently a team of more than 100 people. While growing we highly value equality, inclusiveness and diversity. We’re making Yoast together. Curious who we are? Get to know us here! Who are all those people? Kimberley Chaya Erwin Karin Rumejan Angelia Judith Danny Sergey Bob Diede Mazedul Andrea Edwin Manuel Jerlyn Rafael Suwash Bianca Michael Carl Gertron Agnieszka Kai Igor Lisanne Laura Mabel Niels Joost Samah Jannes Aida Hanna Sanne Iolanda Camille Bob Rolf Enrico Sem Neringa Pie Nynke Martijn Carolina Laura Abiola Rohan Wouter Sid Jose Floortje Dennis Thijs Teun Yvonne Florie Michael Adetola Konrad Mario Sabrina Martijn Anne Baukje Thijs Raymond Marina Ritchel Leonidas Oksana Mushrit Maarten Paolo Tyler Rámon Natalia Anna Victoria Toyin Honglei Vraja Tom Hardik Max Marc Alex Carolyn Mykola Anne Jordi Maurice Niko Beth Alain Will Oscar Vincent Vince John Dhivya Dexter Miki Alje Rilu Klara Angel Angelo Noel Kyle Rianne Goody Ed Cristy Maria Zara Janwin Réka Chris Charlotte Maria About Yoast Yoast consists of a rapidly growing team of internet enthusiasts. We’re a start-up with a very good international reputation when it comes to SEO and website optimization. Multiple times per week we publish free SEO and/or web development related articles on our blogs. We organize MeetUps and speak at conferences. At Yoast, we are very community-minded and highly value open Source. We provide both free and paid plugins for WordPress, Drupal, and Magento 2, and are always looking to expand our field of work. Besides software, we sell online (SEO) courses in our Yoast Academy. Our company is continuously in development. We create a lot of new products. Next to ongoing improvements of our Yoast SEO plugins, we publish courses on a frequent basis. The development of new products is mostly done internally and is a real team effort. Our team consists of authors, illustrators, marketeers, developers, and researchers. Together, we build new innovative SEO products!"
