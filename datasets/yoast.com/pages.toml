full_description = "Charlotte Gurney Charlotte has joined Yoast as the Senior Marketing Brand Manager. She manages PR/Influencers, social media, events/community, creative services and the Yoast brand identity. She is a results driven marketing professional with 20+ years in marketing, design and brand management experience, working across many industries for stakeholders from small businesses to large FTSE and NYSE, Fortune 100. During her career, she has led global strategic marketing communications, rebranded businesses, social media, digital and direct marketing campaigns, events, demand generation, PR, thought leadership, awards, analyst programs and ABM. Charlotte is very passionate about branding and believes a strong brand and marketing strategy is fundamental for business growth.Charlotte is from New Zealand but has resided in the UK since 2004. In her spare time she loves walking, travelling and interior design. She is married to a former UK Member of Parliament."
