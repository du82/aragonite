ma.org format. The plugin also automatically generates and adds information such as your geo sitemap and KML file to your XML sitemap. So no worries if this technical local SEO stuff sounds a bit confusing, Yoast Local SEO does it for you. It optimizes your local SEO for one or more locations Do you have more than 1 physical location? The Yoast Local SEO plugin optimizes your Google listing for multiple locations. Potential customers will see the nearest location for them in their search results. You can also add a store finder on your website. You just need to upload a CSV file with all the details, or type them out in WordPress. Of course, everything is responsive, so it looks just as professional on mobile – the main device people use when searching for local businesses. It puts your company’s location on the map Yoast Local SEO makes it easy to define your organization type. Google needs this information to understand what your organization is about, and to correctly show your website in local search results. And no worries if you’re a niche organization running a church, park, or even bus stop. The Local SEO plugin supports all the organization types that you can think of, from A(irports) all the way to Z(oos). It helps you create a contact page Your contact page will look perfect in just a few clicks! You even get an awesome embedded Google Map, ensuring that your online visitors can easily find their ways to your place! No technical knowledge is needed here. You just need to set up your Google account correctly. The Yoast Local SEO plugin also helps to automatically show your up-to-date opening hours. Full access to the Yoast SEO Academy Covers all SEO topics, from beginner to advanced Developed by world-class SEO experts Find real-life best practices to add to your toolkit Comprehensive, engaging and easy to follow Get ready-to-use templates for your SEO strategy 24/7 Premium support Get a whole year of premium support. Easily contact us at any time to get help, advice, or troubleshooting from our expert support team. From helping you get started with using the plugin, to expert debugging, we’re available 24/7! You’ll need the Yoast SEO plugin (Free or Premium) In order to use Yoast Local SEO, you’ll need the Yoast SEO plugin as well. The Yoast Local SEO plugin works fine with both the free and Premium version of Yoast SEO. But get Yoast SEO Premium if you really want to kick that competition out of the race! Yoast Local SEO + Yoast SEO Premium bundle: best value for money! $145 / year (ex. VAT) Get the Yoast Local Premium bundle »"
