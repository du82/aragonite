ories that shouldn’t be included in the Google News XML sitemap. You can select and disable them after you enable certain post types. Full access to the Yoast SEO Academy Covers all SEO topics, from beginner to advanced Developed by world-class SEO experts Find real-life best practices to add to your toolkit Comprehensive, engaging and easy to follow Get ready-to-use templates for your SEO strategy 24/7 Premium support Get a whole year of premium support. Easily contact us at any time to get help, advices, or troubleshooting from our expert support team. From helping you get started, to expert debugging, we’re available 24/7. You’ll need the Yoast SEO plugin (Free or Premium) In order to use Yoast News SEO, you’ll need the Yoast SEO plugin as well. The Yoast News SEO plugin works fine with both the free and Premium version of Yoast SEO. But get Yoast SEO Premium if you really want to kick that competition out of the race! Yoast News Premium bundle: best value for money! $145 / year (ex. VAT) Get the Yoast News Premium bundle »"
