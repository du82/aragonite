title = "Free SEO training: SEO for beginners • Yoast"
description = "Our free SEO for beginners training helps you make your site rank higher. Want to learn from world renowned experts for free? Start here!"
full_description = "SEO training Free SEO training: SEO for beginners Free SEO training: SEO for beginners Understand how SEO and search engines work Learn the basics of content and technical SEO Filled with quick wins to make your site rank higher in Google Plus: tips to let the Yoast SEO plugin do the essential technical work for you SEO for beginners training Free Find out what SEO is and what Google does Get practical tips for quick wins to improve your site Learn about the content and technical sides of SEO Get your free SEO training now ▸ Recommended Yoast SEO Premium + Academy $99 / year Unlock all Yoast SEO Academy courses Access all features in the Yoast SEO Premium plugin Master all aspects of SEO Improve your site rankings right away Get Yoast SEO Premium »Only $99 / year (ex VAT) What's in this course? What topics are covered in this free SEO for Beginners training? 1. Introduction to SEO This chapter lays the foundation for everything you’ll ever do in SEO. You’ll find out how search engines work, how they see your website and how the Yoast SEO plugin can help you rank higher. 2. Content SEO What people type into Google to find your website, also known as Keywords. You’ll find out what keywords are, why you should use them, and how the Yoast SEO plugin helps you optimize your texts for your keywords. What kind of texts rank high in Google, or SEO copywriting. To be liked by Google, your texts need to be original, readable and findable. We’ll explain these concepts and give you actionable tips. How Google finds its way on your website, or Site structure. We’ll show you examples of great site structure and how the plugin helps you build an intuitive structure for your own site. 3. Technical SEO How you might be blocking Google from your website or the concept of Crawlability. Without even knowing it, you might be blocking Google from entering or indexing your site. We’ll show you how to check that, and then roll out the red carpet for search engines. One way to stand out in the search results, also known as Rich results. Sometimes, Google shows more than just a regular search result. When you get to see ratings, images, location, videos … they’re called rich results. We’ll give a brief introduction into what they are and how to get them for your site. Get your free SEO training now What is included in this free SEO training? You get unlimited access to all of this course content, for free: 2 hours of instructional videos, sliced into 20 bite-sized clips Quizzes to train what you’ve learned PDF files so you can easily check the tips again while working on your website Your cheat sheet with SEO vocabulary Who teaches this training? All content for this course is created by the SEO and WordPress experts at Yoast: they’re the creators of the #1 SEO plugin for WordPress worldwide; combined, they have over a 100 years of WordPress experience; companies such as Facebook, eBay, and The Guardian rely on Yoast for their SEO strategies. Show off your SEO skills with a certificate and badge Once you’ve finished the training, you’ll get a Yoast certificate and a badge you can display on your website. The badge only appears when you’ve actually completed the course, so not just anyone can use it. Add the certificate to your resume, your LinkedIn profile or use it to get that raise you deserve. Get your free SEO training now Why should I do this course? This free SEO training is for you if … You want to rank higher in Google, Bing or Yahoo You want to join the conversation on SEO with your colleagues or boss(es) You want to take an SEO crash course on the first principles of search engine optimization You own or maintain a website – doesn’t have to be on WordPress! You want to make the best use of the Yoast SEO plugin (we recommend you upgrade to Premium!) Get your free SEO training now Can’t get enough? Check out our other free courses! We currently offer the following free Yoast SEO academy courses. SEO for beginners training Learn the basics of SEO and get quick wins to make your site rank higher. Yoast SEO for WordPress plugin training Learn about how to set up and use the Yoast SEO for WordPress plugin so it makes SEO even easier. WordPress for beginners training Learn the ins and outs of creating and maintaining a WordPress website. Block editor training Learn how to create block-tastic content with the WordPress block editor. Structured data for beginners training Learn how to get attention-grabbing rich results that stand out in the search results! Start for free! Want to become an SEO expert? This free SEO course is just the tip of the iceberg. When you purchase Yoast SEO Premium, not only do you unlock all its premium SEO optimization features, you also gain access to all courses in the Yoast SEO academy! Get Yoast SEO Premium »Get the #1 SEO plugin! Time investment How much time do I need for this free SEO training? Want to refresh your knowledge? You can watch all videos in under 2 hours. Are you new to SEO and willing to dig in deep? If you watch all videos, read all reading materials and ace all quizzes, you’ll be an expert in 12 to 16 hours. Worried about taking too long? No problem: you set your own pace and you have unlimited access to this course. Take your time! Get your free SEO training now Reviews Why believe what we have to say? Our students have plenty of nice things to say about the free SEO for beginners course as well! Jack Bleiler As a complete noob developer, I regarded most SEO as blackhat tactics employed by evil, rat-like creatures who were destroying the internet. The Yoast SEO For Beginners course pulls back the curtain, and clearly explains the necessity, relevance and utility of properly-applied SEO. At the same time, it continually stresses the importance of strong content as the core of your SEO strategy, above all else. With this balance, the course manages to be both educational and encouraging. I highly recommend the course for all my noob brethren. And sistren. Jack Bleiler – Pigsgorge Lynn Tall I definitely come away from this course believing that I much better understand the inner-workings of SEO – how it functions, what Google is looking for and why, and how to achieve maximum readability and usability on each of the websites I am writing for. Breaking it down as you did made the information easy to retain, and now I have a comprehensive SEO Manual to keep at my desk for those times in the future when I may need a little reminder. Lynn Tall – Rugadvocate"
