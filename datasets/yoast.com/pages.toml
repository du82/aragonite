title = "Yoast & WordPress • Yoast"
description = "Yoast and WordPress are deeply connected. Yoast grew in and with the WordPress community, ever since starting as a blog as far back as 2008."
full_description = "Yoast & WordPress Yoast and WordPress are deeply connected. Yoast grew in and with the WordPress community. Find out how here! Yoast grew in and with the WordPress community, ever since starting as a blog as far back as 2008, as you can read in our history of Yoast. WordPress is an open-source CMS, and the open-source concept perfectly aligns with our core values. Yoast WordPress plugins » Yoast has built quite a few WordPress plugins over the years. Yoast SEO is, of course, by far the most well-known among them. But there’s more; find all our plugins here. Meet us at WordCamps » We attend, speak at, sponsor and organize many WordPress-related events like WordCamps and WordPress meetups. Meet us there and make sure to grab some awesome goodies! Learn all about WordPress » We’ve written many blog posts about WordPress. Ranging from topics like WordPress SEO to Gutenberg, you should check them out on our blog. And, we even offer a free WordPress for beginners training course! WordPress hosting, vetted by Yoast » We maintain a list of all the hosting companies. All the hosting companies on this list are vetted by us. Each will allow you to set up hosting with the latest technology, so you get a fast and SEO-friendly website. Yoast’s WordPress Core team » Our amazing core team consists of several WordPress fanatics from diverse backgrounds, but working on one common goal: making WordPress better! They work on WordPress full-time with lots of passion and dedication. Yoast in the WordPress community » Yoast’s community involves and supports the WordPress community with love and enthusiasm. Check out our initiatives, The Yoast Care fund, The Yoast Diversity fund, and Five for the future. We are very proud to make an impact in this amazing community."
