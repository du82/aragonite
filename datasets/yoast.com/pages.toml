["https://yoast.com/redenen-om-bij-yoast-te-solliciteren"]
title = "Redenen om bij Yoast te solliciteren • Yoast"
description = "Ruimte krijgen om je te blijven ontwikkelen, aandacht voor jouw gezondheid en nog veel meer: Ontdek de voordelen van werken bij Yoast!"
full_description = "Nog meer redenen om bij Yoast te solliciteren Als je goed bent voor je medewerkers, zijn zij goed voor jou. Daar geloven wij in. Daarom zijn onder andere de volgende speerpunten binnen Yoast heel belangrijk. Blijven leren Wij vinden jouw ontwikkeling enorm belangrijk. Door individuen te laten groeien, groeien we als groep en bedrijf. Daar krijg je meer dan voldoende ruimte voor. Bij Yoast krijg je een ruim opleidingsbudget en daarnaast delen we onze kennis intern via conferenties, coaching en hackatons. “Ik heb bij Yoast in korte tijd ontzettend veel geleerd. Ik ben binnengekomen als stagiair en ben een paar jaar later senior en teamlead van een development team. Er wordt bij Yoast goed geluisterd naar wat jouw ambities zijn en je kan er altijd op rekenen dat je de tools en ruimte krijgt om jezelf te blijven ontwikkelen.” Diede, Team lead platform Samen is alles leuker! Werken bij Yoast betekent heel veel super leuke gezamenlijke activiteiten zoals de jaarlijkse LEGO-bouwdag, het kerstfeest, de personeelsdag, Ken-Je-Collega-quizzen, borrels en nog veel meer! Nu dat allemaal fysiek even niet kan, organiseren we gezellige online activiteiten. Waarvoor je zelfs van allerlei lekkers thuis krijgt bezorgd! Op die manier leren we elkaar beter kennen en blijven drempels laag om bij elkaar binnen te lopen, of, zoals nu, even te zoomen! Er is leven naast je werk Natuurlijk heb jij, net als wij, nog meer te doen dan alleen maar werken. Dan is het vet handig om flexibele werktijden te hebben en gebruik te kunnen maken van bijvoorbeeld ons (betaalde) ouderschaps-, zorg- en extra lang partnerverlof. En je krijgt zelfs uren van ons om aan vrijwilligerswerk te besteden! Een gezonde geest in een gezond lichaam Laten we eerlijk zijn: in ons soort bedrijf zitten we te veel. Om niet alleen mentaal maar ook fysiek topfit te blijven hebben wij bij Yoast daarom een eigen fitnessruimte waarin je kan sporten onder begeleiding van personal trainers! Dat doe je gewoon overdag, en dat uurtje haal je gewoon ergens anders in. De rest regelen wij. “Wat ik superfijn vind aan het werken bij Yoast is dat er veel aandacht is voor de werk-privé balans. Dankzij het gedeeltelijk doorbetaalde ouderschapsverlof krijg je de kans om meer tijd met je kind te besteden. En met een peuter die zijn weerstand nog aan het ontwikkelen is, is het heel prettig dat zo nu en dan zorgverlof geen probleem is!” Willemien, Manager Content Aandacht voor de inwendige mens Voor wie is eten en drinken nou niet belangrijk? Om die reden hebben wij normaliter iedere dag weer een heerlijke lunch, goede koffie en ieder dag verse groenten en fruit. Daarnaast heb we een donderdagmiddagborrel (domibo), waar uiteraard ook gezorgd wordt voor heerlijke hapjes. “Yoast geeft je een kans om te ondervinden welke plek binnen het bedrijf bij je past. Zelf ben ik doorgegroeid van Consultant naar Management Assistent naar Lead van het Community team. Ik word door Yoast gezien en krijg alle mogelijkheden om me te blijven ontwikkelen.” Judith, Community lead Iets teruggeven Bij Yoast krijg je jaarlijks 5 dagen wat we dan “maatschappelijk verlof” noemen om vrij te besteden aan vrijwilligerswerk! Dat kan zijn vrijwilligerswerk bij bijvoorbeeld een goed doel of de plaatselijke sportclub, maar als jij op de school van je dochter mee wil helpen in de kerstwerkgroep, dan moet je daar ook vooral dat verlof voor gebruiken. Locatie? Goed bereikbaar Uren in de file? Daar houden wij ook niet van. Nu is dat allemaal ook niet zo’n issue. Maar de Yoast Campus bevindt zich in het centrum van Wijchen en op loopafstand van een NS treinstation. Wel zo fijn als je ook nog eens gemakkelijk van A naar Yoast kan gaan! Woon je niet in de omgeving van Wijchen? Met hybride werken maakt het niet uit waar je woont! Financieel? Geregeld. Naast alle super leuke extra’s begrijpen wij dat er ook brood op de plank moet komen. En beleg. Daarom krijg je natuurlijk ook gewoon een goed salaris en hebben we daarnaast een steengoede pensioenregeling, volledig door Yoast betaald. Leuk voor later! Hoe gaan we om met COVID-19? Sinds Corona gaat het allemaal iets anders dan anders natuurlijk. Daarom begrijpen we het als je het spannend vindt om in deze tijd bij ons te solliciteren. Speciaal daarom hebben we een video daarover opgenomen! Meer over lezen? Op deze pagina vind je nog veel meer over werken bij ons in Corona-tijd (in het Engels). Solliciteren bij Yoast? We kunnen ons voorstellen dat je vragen hebt. In deze FAQ kom je meer te weten over onze sollicitatieprocedure. Woon je niet in de buurt van Wijchen? Met hybride werken maakt het niet uit waar je woont! Er is nog veel meer. Maar dit geeft je in ieder geval een goed beeld. De rest hebben we het wel over als je bij ons op bezoek komt! Overtuigd? Enthousiast geworden? Bekijk al onze vacatures! English? Find all jobs at Yoast here."
