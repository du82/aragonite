full_description = "This Privacy Notice applies to Newfold Digital, Inc. and all subsidiaries, including the brands you can find here (collectively “we,” “us,” “our,” or “Newfold”). To learn more about the Newfold corporate family visit: https://newfold.com. This Privacy Notice describes how we protect personal information of our customers, job applicants and visitors (collectively, our “users”) who use our websites, emails, job application services, platforms, brands, products, services and mobile applications (collectively, the “Services”). This Privacy Notice describes how your personal information is collected, disclosed and used by us, as well as an explanation of the related data rights you may have. This Privacy Notice does not apply to the personal data collected or disclosed by users who manage the data of others while using our Services. Some jurisdictions provide data subject rights to their residents. To find out what rights apply to you, click on the links below. Or, to exercise your rights, go to the DSAR portal here. We store the data we collect in a variety of places within our infrastructure, including system log files, back-end databases and analytics systems. We may collect and store demographic information (such as your zip code, date of birth, and/or age), and use this data to tailor your experience on our websites, ensure you are at least 18 years of age to make purchases, provide content that we think you might be interested in, perform general improvements to the websites, and display the content according to your preferences. Such demographic information may be provided to partners, market researchers and other third parties on an aggregate and non-personally identifiable basis. No personally identifiable information will be linked to such aggregated demographic information that is provided to third parties. We also collect information that you may provide during your telephone conversations with us, which we may monitor or record. We may combine any information we collect about you with other information we have about you to help us update, expand and analyze our records, identify new customers, and provide products and services that may be of interest to you. If you provide us personal information about others, or if others give us your information, we will only use that information for the specific reason for which it was provided to us."
