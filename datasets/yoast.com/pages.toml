["https://yoast.com/help/support"]
title = "How can I get support? • Yoast"
description = "Need help with one of the Yoast SEO products? There are multiple ways of getting support, we'll walk you through the options!"
full_description = "How can I get support? Do you need help with one of the Yoast SEO products? There are multiple ways of getting support, depending on if you use the free Yoast SEO plugins for WordPress; Yoast SEO Premium or another paid WordPress add-on; or Yoast SEO for Shopify. In this article, we’ll walk you through the options. Table of contentsSupport for free WordPress pluginsSupport page in the Yoast SEO pluginHelp centerSupport forums for free WordPress productsHow to use a free support forumSupport for premium WordPress pluginsLive chatHelp centerSupport page in Yoast SEOEmailThe help beaconI have problems with Premium supportSupport for Yoast SEO for ShopifyLive chatHelp centerApps and sales channelsThe help beaconI have problems with Yoast SEO for Shopify support Support for free WordPress plugins There are several ways to get help for the free Yoast SEO for WordPress plugin and related free plugins. Support page in the Yoast SEO plugin Within the plugin, you can find the Support page under the Yoast SEO plugin menu in your WordPress backend. On the Support page, you’ll have access to frequently asked questions and additional resources: a great place to start finding solutions to your problems! Help center If you need help, we recommend our Yoast help center. In our help center, we provide explanations and how-to-guides for SEO, features of our products, installation manuals and much more. The help center is maintained on a daily basis to help you solve the most common questions. Support forums for free WordPress products All our free plugins have their own support forums at WordPress.org. These forums are looked after by very enthusiastic and knowledgeable users of that plugin. We have a Yoast SEO forum as well as a forum for free Yoast plugins. How to use a free support forum Open the WordPress plugin repository and log into your account Search for your specific Yoast plugin Click on the plugin to open the details page. Click on Support This will take you to the Yoast SEO Support forums. Use Search this forum to search topics By entering several keywords, you can search the forum to see if anyone else has encountered and resolved the same issue. If your issue does not exist yet, create a topic If you cannot solve your issue with answers in existing topics, create a new topic by clicking Create topic. Fill in the form to create a new topic Fill out the topic form with as much detail as possible: this will help us in resolving your issues quicker. This includes a link to the site in question, a description of the issue, the expected outcome, any error messages you received, steps to recreate the issue and screenshots. Go Premium and get support from our support team! Upgrade to Yoast SEO Premium, and get 24/7 access to our support team. Get Yoast SEO Premium »Only $99 / year (ex VAT) Support for premium WordPress plugins All of the plugins you purchase are called premium plugins (even if premium isn’t in the name of the plugin). Are you a user of one of our premium WordPress plugins, like Yoast SEO Premium or Local SEO for WordPress? Then follow the steps below to get the support you need. Live chat Our Support team is now available 24/7 via live chat! You can start a live chat in the help beacon. You can find a beacon in your MyYoast account; in the Help Center, the Yoast SEO Academy and in the Yoast SEO menu under Support. Simply go to the beacon, click on Ask and share your issue to get started! Help center If you need help, we recommend that you go to our Yoast help center. In our help center, we provide explanations and how-to-guides for SEO, features of our products, installation manuals and much more. The help center is maintained on a daily basis to help you solve the most common questions. Support page in Yoast SEO Within the plugin, you can find the Support page under the Yoast SEO plugin menu in your WordPress backend. On the Support page, you’ll have access to frequently asked questions and additional resources: a great place to start finding solutions to your problems! You can also contact the Support team directly by clicking Contact our support team at the bottom of the page, or clicking Need help? to start a live chat. Email You can also reach the Yoast Support team at support@yoast.com. The help beacon You can find the help beacon in your MyYoast account; in the Help Center, the Yoast SEO Academy and in your WordPress site Yoast SEO menu under Support. Click the Need help? button to open the help beacon. Under Answers, you’ll find the most popular help articles; you can also search for any specific problem you have. Under Ask, you can contact the support team via e-mail or enter the live chat to talk to our support team directly. I have problems with Premium support Please note that premium personal support does not mean we’ll set up your plugin for you. Of course, we’ll help you with all your questions about the setup and basic use of the plugin you purchased. If you have an add-on to the Yoast SEO plugin, for instance, Yoast Video SEO for WordPress, we will not provide support for the free Yoast SEO plugin. To get support on the Yoast SEO plugin itself, you need to upgrade to Yoast SEO Premium. Sometimes, the Need Help beacon may not show. In that case, check that all plugins and themes are up-to-date and that you do not have Javascript errors. Support for Yoast SEO for Shopify If you’re using the Yoast SEO for Shopify app, you also get access to our customer support. Follow the steps below to find out how you can reach the support team. Live chat Our Support team is now available 24/7 via live chat! You can start a live chat in the help beacon. You can find a beacon in your MyYoast account; in the Help Center, the Yoast SEO Academy and in your Yoast SEO for Shopify app. Simply go the Need help? beacon, click on Ask and explain your problem to get started! Help center If you need help, we recommend you to look at our Yoast help center. In our help center, we provide explanations and how-to-guides for SEO, features of our products, installation manuals and much more. The help center is maintained on a daily basis, to help you solve the most common questions. The first article we recommend is our Get help with Yoast SEO for Shopify article. Apps and sales channels In your Apps and sales channels settings, you see an overview of your apps, including the Yoast SEO app. When you click on the three-dot menu, you can click on Get support. You can now contact the Yoast team directly: include as much detail as possible so that the support team can help you quickly and efficiently. The help beacon If you have Yoast SEO for Shopify we also offer a help beacon with answers and the possibility to reach out to Support via email and live chat. You can find the help beacon in the Help Center, the Yoast SEO Academy and in your Yoast SEO for Shopify app. Click the Need help? button to open the help beacon. Under Answers, you’ll find the most popular help articles; you can also search for any specific problem you have. Under Ask, you can contact the support team via e-mail or enter the live chat to talk to our support team directly. I have problems with Yoast SEO for Shopify support If you have questions about your subscription, pricing, and your Shopify store, we kindly refer you to the Yoast SEO subscription FAQ and the Shopify support team. Did this article answer your question? .thumb-up-cls-1{fill:#c9c9c9;}.thumb-up-cls-2{fill:#e1e1e1;}.thumb-up-cls-3{fill:#676767;} .thumb-down-cls-1{fill:#c9c9c9;}.thumb-down-cls-2{fill:#e1e1e1;}.thumb-down-cls-3{fill:#676767;} Submit Cancel Thanks for your feedback! Related articles Configuration guide for Yoast SEO Quick start guide for Yoast SEO for Shopify How to install Yoast SEO for WordPress Get Yoast SEO Premium Drive more traffic to your site. Use AI to save time doing SEO tasks. Make SEO easier. And get 24/7 support. $99 / year (ex. VAT) Get Yoast SEO Premium » Read reviews from real users 4.6 / 5"
