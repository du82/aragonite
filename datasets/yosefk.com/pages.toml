["https://yosefk.com/blog/advantages-of-incompetent-management.html"]
title = "Advantages of incompetent management"
full_description = "What constitutes managerial competence? As a vague starting point for an answer, we could say that competent management sets achievable objectives and then achieves them, by organizing and incentivizing the necessary work. It turns out that even this near-tautological banality is enough to see why competent management puts many desirable things out of reach. This becomes apparent when looking at examples where incompetent management does better than most well-run places can hope for. Improving efficiency tends to be against the interest of most people in an org, because it’s equivalent to shrinking your budget. Here’s what I’m told is a true story about how things work with actual budgets. A relatively inexperienced VP attends a meeting where senior management is asked to shrink their budgets due to the adverse economic climate brought about by the coronavirus pandemic. He eagerly cuts his equipment budget from $10 million to $6 million - over the loud and desperate objections of his team (whom the VP nearly accuses of lacking patriotism, loyalty to the company and commitment to the common good.) Next year, the coronavirus mutates some more, and profits go back up. Our VP submits a $10 million equipment budget to the finance department, where they cheerfully inform him that the extra $4 million will not go well with the CEO. Why, a 66% increase over last year’s $6 million! Wait a minute, thinks the VP, a sensation running through his whole body of rapidly gaining that invaluable experience which he so sorely lacked. I voluntarily cut 40% of my budget - a share way larger than anyone else - due to an unforeseen, extraordinary emergency. And now I’m rewarded with this cut becoming permanent?.. I see. Well, I’m always eager to learn. This year being already lost, he quietly resubmits a $6 million budget (approved more swiftly by the CEO than any other, thanks to zero YoY growth.) Next year, he uses some real or perceived crisis to increase this budget to $20 million. And now he learned how to operate in a well-run company."
year_published = 2024
