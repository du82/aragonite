full_description = "Token ToolSome companies use token identifiers for interest-based advertising. You can opt out of this practice using our Token ID-Based Choices Tool.Please note that any identifier submitted within this tool, such as an email address, will not opt you out of email subscriptions, other email services, or other uses of the identifier you provide in which you may have enrolled or from which you receive communications. Launch the Token Tool Token Tool FAQ Some companies use token identifiers for interest-based advertising. You can opt out of this practice using our Token ID-Based Choices Tool. Please note that any identifier submitted within this tool, such as an email address, will not opt you out of email subscriptions, other email services, or other uses of the identifier you provide in which you may have enrolled or from which you receive communications. Association of Canadian AdvertisersAssociation of Creative Communications AgenciesCanadian Marketing AssociationCanadian Media Directors' CouncilInstitute of Canadian AgenciesInteractive Advertising Bureau of CanadaAdChoices is a self-regulatory program for online interest-based advertising, which helps to provide notice, transparency, and accountability from the advertising sector to consumers. The Digital Advertising Alliance of Canada (DAAC) is a federal not-for-profit association responsible for administering the AdChoices self-regulatory program in Canada. Association canadienne des annonceursAssociation des agences de communication créativeAssociation canadienne du marketing Bureau de la publicité interactive du CanadaCanadian Media Directors' CouncilInstitut des agences canadiennesChoix de pub est un programme d’autoréglementation de la publicité ciblée par centres d’intérêt en ligne visant à fournir aux consommateurs des avis, une transparence et une responsabilité de la part du secteur de la publicité en ligne. L’Alliance de la publicité numérique du Canada (DAAC) est un regroupement sans but lucratif d’associations professionnelles, chargé d’administrer le programme d’autoréglementation canadien Choix de pub."
