["https://youradchoices.ca/fr/tiers"]
title = "Entreprises tierces — AdChoices in Canada"
description = """
Si vous vous identifiez comme un tiers, vous faites de la publicité ciblée 
par centres d’intérêt sur le site Web d’un propriétaire de site."""
full_description = "TiersSi vous vous êtes identifié comme un tiers, cela signifie que vous faites de la publicité ciblée par centres d’intérêt sur le site Web d’un propriétaire de site. Les directives aux tiers s’adressent principalement aux réseaux publicitaires et aux entreprises de données qui recueillent des données sur les pages Web affichées sur de nombreux sites et qui les utilisent à des fins de publicité ciblée par centres d’intérêt en ligne.Un annonceur (soit une entreprise dont le produit ou le service est annoncé dans une publicité) peut également être considéré comme un tiers s’il recueille et utilise des données à des fins de PCL. Toutefois, si l’annonceur utilise un réseau publicitaire, un bureau d’échange, une plateforme DSP ou toute autre entité pour recueillir des données à des fins de PCL et que cette entité NE lui fournit PAS ces données pour son usage indépendant, l’annonceur n’est pas considéré comme un tiers et n’est pas, par conséquent, soumis aux principes du programme.Les tiers doivent fournir un avis sur leur site Web dans lequel sont décrites leurs pratiques de collecte, d’utilisation et de divulgation des données à des fins de publicité ciblée par centres d’intérêt en ligne. Un tel avis doit comprendre une description claire de ce qui suit :Les types de données recueillies en ligne à des fins de publicité ciblée par centres d’intérêt en ligne, y compris tout renseignement personnel;L’utilisation de ces données, y compris si elles seront ou non transférées ou divulguées à une autre entité à des fins de publicité ciblée par centres d’intérêt en ligne;Un mécanisme facile à utiliser qui permet d’exercer un choix quant à la collecte et à l’utilisation de données à des fins de publicité ciblée par centres d’intérêt en ligne ou à la divulgation de telles données à une autre entité à de telles fins, etLe fait que l’entreprise adhère aux principes du programme.Apparaît ci-après une description plus détaillée de chacune des exigences auxquelles les tiers doivent se conformer.1. Assurer la transparenceLes principes du programme confèrent aux tiers la responsabilité d’assurer le respect des pratiques de transparence et de contrôle par les consommateurs. Ainsi, l’entité/entreprise qui recueille des données à des fins de PCL est tenue de se conformer à ces pratiques.En plus d’afficher un avis sur leur site Web, tel que décrit dans les principes, les tiers doivent :Fournir un avis de collecte de données à des fins de PCL dans la publicité ou à proximité de celle-ci à l’aide de l’icône qui renvoie à l’avis décrit dans les principes;Fournir un avis sur la page dans laquelle des données sont recueillies à des fins de PCL, à l’aide de l’icône qui renvoie à l’avis décrit dans les principes, s’il est entendu avec le propriétaire du site de fournir un tel avis; etApparaître individuellement sur la Page de retrait des consommateurs ou, si le propriétaire du site a accepté, dans l’avis figurant sur la page Web où des données sont recueillies à des fins de PCL.Dans tous les cas, l’avis renforcé doit être clair, explicite et bien visible. Par exemple, un avis caché dans un long texte de conditions NE satisfait PAS à cetteexigence.2. Offrir le choixVous devez offrir aux consommateurs la possibilité d’exercer leur choix quant à la collecte et à l’utilisation de données à des fins de PCL et à la divulgation de ces données à d’autres entités. Un exemple de mécanisme qui satisfait à cette exigence est celui qui permet à un utilisateur de mettre fin à la collecte et à l’utilisation de données à des fins de PCL.Dans tous les cas, ce mécanisme doit être facile à utiliser.Vous devez offrir aux consommateurs un mécanisme qui leur permet d’exercer leur choix à au moins trois endroits :Dans l’avis concernant vos pratiques de PCL qui figure sur votre site Web et qui est relié par un hyperlien placé « dans » la publicité ou « près » de cette dernière ou ailleurs sur la page, avec le consentement du propriétaire du site;Dans la liste figurant sur youradchoices.ca/fr/retrait; ouLorsque votre nom figure dans la liste de l’avis du propriétaire d’un site Web où des données sont recueillies, votre mécanisme permettant d’exercer un choix de retrait doit être disponible dans l’avis figurant sur votre site Web et qui est relié à la liste du propriétaire du site.3. Assurer la sécurité des donnéesVous devez maintenir des mesures de protection physiques, électroniques et administratives appropriées afin de protéger les données recueillies et utilisées à des fins de publicité ciblée par centres d’intérêt en ligne.Vous devez conserver les données qui sont recueillies et utilisées à des fins de publicité ciblée par centres d’intérêt en ligne uniquement le temps de répondre à un besoin commercial légitime ou tel que requis par la loi.4. S’abstenir de recueillir de l’information sensibleLes entreprises ne doivent pas recueillir de données sensibles à des fins de publicité ciblée par centres d’intérêt en ligne auprès d’enfants qu’elles savent, dans les faits, avoir moins de 13 ans ou sur des sites qui s’adressent à des enfants de moins de 13 ans ou encore, faire autrement de la publicité ciblée par centres d’intérêt en ligne auprès d’enfants qu’elles savent avoir moins de 13 ans, si la collecte a lieu, il faut qu’elle, ainsi que le traitement de renseignements personnels, soient conformes aux lois canadiennes régissant la protection de la vie privée.Les entreprises ne doivent pas recueillir, utiliser ou divulguer des renseignements personnels sensibles à des fins de publicité ciblée par centres d’intérêt en ligne sans consentement, tel que requis par les lois canadiennes régissant la protection de la vie privée et conformément à ces dernières. Remarque sur les propriétaires de sitesSi votre entreprise exploite également un site Web et/ou exerce un contrôle sur un site Web, vous pouvez aussi être considéré comme propriétaire du site et vous devrez par conséquent vous conformer également aux sections des principes et du Guide de mise en œuvre à l’intention des propriétaires de sites qui s’adonnent à ces activités."
