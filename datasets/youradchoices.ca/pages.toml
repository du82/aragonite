["https://youradchoices.ca/en/about-adchoices"]
title = "About the AdChoices Program — AdChoices in Canada"
full_description = "Scroll The AdChoices Program FrameworkThe Canadian AdChoices self-regulatory program educates consumers about interest-based advertising and provides them with tools to manage their preferences when such advertising occurs.The program attracts participation from enterprise-level entities, including advertisers, brands, publishers, agency trade desks, and ad technology providers.Participants in the AdChoices program are granted a license to display the AdChoices icon and can link to our publicly available opt-out tools. Participants also commit to proactive monitoring by Ad Standards, ensuring compliance with the DAAC Principles.For companies, enrollment in the AdChoices program addresses business-critical needs by:Facilitating alignment with privacy regulation,Building consumer trust by providing transparency and control, and,Protecting your brand reputation as a responsible corporate citizen. Register for the Program Work Collectively, Stay Ahead and InformedBroad industry participation is critical to demonstrate to privacy regulators that the advertising industry can uniformly address their expectations.When a company is outside of privacy expectations, regulators have the authority to investigate and audit business practices related to consumer privacy protection. In addition to many privacy regulators being active and technically savvy, updated and proposed Canadian privacy laws include significant new penalties for non-compliance.The DAAC's AdChoices self-regulatory program goes above and beyond legislation. Being a participant shows that your company supports self-regulatory industry initiatives and can stay ahead of what may come to pass regarding new privacy requirements. Get InvolvedTo officially participate in the program and use the AdChoices icon in Canada, a company must sign the DAAC’s licensing agreement. The DAAC will then set up a time to evaluate whether you engage in IBA and educate you about the program and its associated costs.Please reach out to us to find time to meet virtually. Printable Summary DAAC Principles Accountability Choice Mechanisms AdChoices Program Framework Work Collectively Get Involved"
