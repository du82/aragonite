title = "Nomination de la DAAC aux Prix PICCASO Canada dans la catégorie « Leadership à but non lucratif »  — AdChoices in Canada"
description = "L’Alliance de la publicité numérique du Canada (DAAC) est fière d’annoncer qu’elle a été nommée aux   Prix PICCASO Canada   (première édition) dans la catégorie «&nbsp;Leadership à but non lucratif&nbsp;».   Prix PICCASO Canada   reconnaît ceux qui montrent la voie en matière de protection d"
full_description = "Nomination de la DAAC aux Prix PICCASO Canada dans la catégorie « Leadership à but non lucratif » L’Alliance de la publicité numérique du Canada (DAAC) est fière d’annoncer qu’elle a été nommée aux Prix PICCASO Canada (première édition) dans la catégorie « Leadership à but non lucratif ». Prix PICCASO Canada reconnaît ceux qui montrent la voie en matière de protection de la vie privée, de sécurité de l’information et de protection des données. Le fait d’être nommée parmi de nombreuses autres organisations et personnes de renom nous rend bien humble et vient mettre en lumière le travail que nous effectuons pour promouvoir la transparence et la responsabilité dans le secteur de la publicité numérique. À la DAAC, nous croyons en la promotion d’une culture de confiance entre les annonceurs et les consommateurs. Aussi, nos programmes – tels que Choix de pub – ont pour but de fournir aux consommateurs de l’information claire et accessible sur les pratiques de publicité en ligne, leur permettant ainsi de faire des choix éclairés quant à leurs données. Cette reconnaissance de PICCASO Canada vient souligner l’importance de notre vision et de notre mission et nous encourage à poursuivre notre travail dans ce domaine. Nous tenons à remercier très chaleureusement le Conseil consultatif de PICCASO Canada qui a su reconnaître nos efforts de même que les membres dévoués de notre conseil d’administration et de nos associations ainsi que les participants au programme qui ont rendu possible cette nomination. Nous n’aurions pu nous rendre aussi loin sans vous.Nous attendons avec impatience la cérémonie de remise des prix et cette occasion unique de célébrer avec d’autres chefs de file du domaine de la protection de la vie privée et de la sécurité. DAACApril 30, 2024prix, PICCASO Canada Facebook0 LinkedIn0 0 Likes"
