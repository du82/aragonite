["https://youradchoices.ca/fr/actualites/2022/5/20/la-daac-lance-le-nouvel-outil-choix-fonds-sur-le-jeton-didentit"]
title = "La DAAC lance le nouvel outil Choix fondés sur le jeton d’identité — AdChoices in Canada"
description = "L’Alliance de la publicité numérique du Canada (la DAAC) offre désormais aux sociétés qui participent à son programme un mécanisme de choix nouvellement mis à jour, qui constitue une nouvelle façon pour les consommateurs de refuser certaines activités de publicité numérique ou de révoquer un consent"
full_description = "La DAAC lance le nouvel outil Choix fondés sur le jeton d’identité L’Alliance de la publicité numérique du Canada (la DAAC) offre désormais aux sociétés qui participent à son programme un mécanisme de choix nouvellement mis à jour, qui constitue une nouvelle façon pour les consommateurs de refuser certaines activités de publicité numérique ou de révoquer un consentement antérieur à ces activités. Cet outil est maintenant disponible sur le site Web de la DAAC (votrechoixdepub.ca).Français – https://youradchoices.ca/fr/outilsAnglais – https://youradchoices.ca/en/toolsPour les entreprises qui utilisent les « jetons d’identité » (tels que les adresses électroniques « hachées ») comme identifiants pour leurs services de publicité numérique, l’outil nouvellement mis à jour de retrait/révocation de consentement constitue une nouvelle façon pour le consommateur de demander un retrait de la publicité ciblée par centres d’intérêt ou de révoquer son consentement à ce type de publicité. Cet outil de retrait/révocation s’applique aux entreprises participantes qui s’adonnent à ce type de publicité à l’aide de jetons dans les courriers électroniques, qui sont conformes aux principes d’autoréglementation et aux orientations de la DAAC.Tous comme les témoins, les jetons constituent un mécanisme technique utilisé dans l’écosystème de la publicité numérique, qui permet de présenter des publicités pertinentes aux bons auditoires. Comme elle l’a fait avec l’établissement des principes d’autoréglementation et plus tard, avec WebChoices et AppChoices, la DAAC continue d’offrir les outils requis pour fournir aux consommateurs une totale transparence et un contrôle quant à la collecte, à l’utilisation et au transfert de données sur leurs activités sur le Web à des fins de publicité ciblée par centres d’intérêt. En participant à ce nouvel outil, les entreprises peuvent ainsi contribuer à renforcer, auprès des consommateurs et de leurs partenaires, l’idée qu’elles sont attachées au respect de la vie privée des utilisateurs et à la transparence.En soumettant leur adresse électronique au moyen de ce nouvel outil, les consommateurs pourront refuser l’utilisation de celle-ci comme jeton d’identité utilisé à des fins de publicité ciblée par centres d’intérêt ou encore, révoquer leur consentement à cette utilisation par les entreprises participantes à des fins de publicité couverte par la DAAC. Il est à noter qu’un retrait au moyen de cet outil s’applique à la collecte, à l’utilisation et au transfert de données en lien avec l’adresse électronique soumise par le consommateur, à des fins de publicité ciblée par centres d’intérêt. Toutefois, cela signifie aussi que le retrait/la révocation ne s’applique pas aux jetons utilisés dans les courriers électroniques à des fins autres que la publicité ciblée par centres d’intérêt et ne s’applique pas non plus à d’autres identifiants comme les témoins. Les consommateurs peuvent refuser séparément ces autres identifiants à l’aide des plateformes traditionnelles WebChoices et AppChoices.Les participants au programme peuvent commencer dès maintenant à faire référence à cet outil fondé sur le jeton d’identité et à diriger les consommateurs vers ce dernier. L’industrie se tournant de plus en plus vers les identifiants de jeton, les outils collectifs de la DAA seront maintenus et accrus. Les entreprises qui ne participent pas déjà au programme Choix de pub/AdChoices au Canada devraient adhérer au programme dans le but de soutenir, en tant que firme se comportant en bon citoyen, le maintien de ces outils à l’usage du public. Adhérez au programme Choix de pub de la DAAC en remplissant le formulaire d’inscription. Vous trouverez la liste actuelle des participants au programme ici. L’inscription au nouveau mécanisme de choix fondés sur le jeton d’identité est possible dès maintenant. Si votre entreprise souhaite adhérer à cet outil, veuillez communiquer avec Jamie Monaco (jamie@aboutads.info). DAACMay 20, 2022jeton, identité, outil Facebook0 LinkedIn0 0 Likes"
