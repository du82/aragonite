title = "Foire aux questions — AdChoices in Canada"
description = """
Qu’est-ce que la publicité ciblée par centres d’intérêt en ligne (ou 
publicité comportementale en ligne)? Comment fonctionne-t-elle?"""
full_description = "Au sujet de la DAAC et de Choix de pub Que sont Choix de pub et le programme d’autoréglementation de la DAAC? L’Alliance de la publicité numérique du Canada (DAAC) est un organisme indépendant sans but lucratif qui établit et qui renforce des pratiques responsables en matière de protection de la vie privée, à des fins de publicité numérique pertinente, tout en fournissant aux consommateurs de l’information et un contrôle concernant les types de publicité numérique qu’ils reçoivent. La DAAC administre le programme Choix de pub qui comporte une série de principes que les entreprises participantes acceptent de respecter et qui offre au public des outils pour contrôler la publicité ciblée par centres d’intérêt en ligne. Les Normes de la publicité – organisme d’autoréglementation qui assume le volet Responsabilité du programme Choix de pub – font respecter, de manière indépendante, les principes de la DAAC. Le programme Choix de pub de la DAAC s’applique à la collecte et à l’utilisation de données à des fins de publicité ciblée par centres d’intérêt au Canada. Pour plus d’information sur les programmes d’autres pays et régions, veuillez consulter les sites Web d’organisations sœurs : Union européenne/Espace économique européen (EDAA) Inde et Moyen-Orient (DAAA) États-Unis (DAA) La DAAC administre également le programme d’autoréglementation Publicité politique qui a pour but d’accroître la transparence des publicité politiques et des publicités engagées en ligne. Vous pouvez en apprendre davantage sur cet autre programme d’autoréglementation à pubpolitique.ca. Que sont les principes d’autoréglementation canadiens pour la publicité ciblée par centres d’intérêt en ligne? Les principes d’autoréglementation canadiens pour la publicité ciblée par centres d’intérêt en ligne résultent du travail concerté d’associations professionnelles de marketing et de publicité de premier plan au pays visant à fournir aux consommateurs plus d’information et de contrôle sur la publicité en ligne. Le programme d’autoréglementation exige des entreprises qu’elles informent les consommateurs au sujet de leurs pratiques de collecte et d’utilisation des données et qu’elles leur permettent d’exercer un plus grand contrôle sur les types de publicité qu’ils voient. Le présent site Web est un élément central du programme en ce qu’il permet aux consommateurs de refuser la publicité ciblée par centres d’intérêt provenant d’un large éventail d’entreprises participantes, et ce, à même une seule page. Les principes du programme couvrent-ils l’ensemble de la publicité en ligne? Non. Les principes de la DAAC couvrent uniquement les activités décrites dans les principes comme étant de la publicité ciblée par centres d’intérêt. Celle-ci n’inclut pas : Les activités de tiers, qui se limitent à leurs propres sites Web ou applications, La publicité contextuelle qui est axée sur le contenu d’une page Web qui est consultée, sur la consultation en cours d’une page Web ou d’une application par un consommateur, ou sur une demande de recherche, Les rapports publicitaires, la collecte ou l’utilisation d’information à des fins de rapports statistiques, l’analytique/l’analyse Web et les mesures publicitaires, ou La diffusion d’annonces, la distribution ou la diffusion de publicités en ligne ou de services en lien avec la publicité, à l’aide de données tirées de rapports publicitaires et non des préférences des utilisateurs déduites de l’information recueillie au fil du temps sur les divers sites Web ou les applications. Qui est la DAAC? La DAAC est un regroupement sans but lucratif, encadré par les principales associations professionnelles de marketing et de publicité du pays. Les associations qui ont développé le programme sont au nombre de huit et figurent parmi les plus importantes associations de marketing et de médias du Canada : l’Association des agences de communication créative (A2C) l’Association canadienne des annonceurs (ACA) l’Association canadienne du marketing (ACM) le Canadian Media Directors’ Council (CMDC) l’Institut des agences canadiennes (ICA) le Bureau de la publicité interactive du Canada (IAB Canada) les Normes de la publicité qui assument le volet Responsabilité du programme d’autoréglementation de la DAAC. Toutes ces associations et toutes les entreprises inscrites au programme d’autoréglementation Choix de pub canadien ont accepté d’aider à promouvoir l’adoption généralisée du programme par l’industrie. FAQ sur la publicité ciblée par centres d’intérêt en ligne Qu’entend-on par publicité ciblée par centres d’intérêt en ligne (ou publicité comportementale en ligne)? La publicité ciblée par centres d’intérêt en ligne – appelée aussi « publicité comportementale en ligne » – repose sur de l’information recueillie par votre navigateur ou votre appareil mobile sur les différents sites Web et dans les applications que vous consultez au fil du temps, et ce, afin de prédire vos préférences et de vous présenter des publicités qui sont davantage susceptibles de vous intéresser. Par exemple, un fabricant d’articles de sport peut travailler avec un réseau publicitaire qui recueille et qui utilise de l’information à des fins de publicité ciblée par centres d’intérêt en ligne pour présenter des publicités aux navigateurs des utilisateurs qui ont consulté récemment des sites Web portant sur le sport ou encore, une compagnie aérienne peut présenter de la publicité aux utilisateurs qui ont consulté récemment des applications mobiles sur les voyages. Comment fonctionne la publicité ciblée par centres d’intérêt en ligne? Lorsque vous consultez un site Web ou que vous utilisez une application qui fonctionne avec un réseau publicitaire ou avec d’autres entreprises de marketing en ligne, ceux-ci recueillent de l’information sur votre navigateur ou sur votre appareil afin de savoir à quels moments ceux-ci visitent d’autres sites Web ou applications au sein du même réseau, et ce, même s’il s’agit d’entreprises différentes qui font ces offres de contenus ou qui ont des adresses Web ou des marques différentes. Au fil du temps, l’information recueillie sur votre navigateur ou sur votre appareil peut permettre de prédire les intérêts probables d’un utilisateur dans des catégories de publicité précises. Par exemple, les utilisateurs qui fréquentent souvent des sites Web sur le baseball peuvent recevoir davantage de publicités dans la catégorie « amateurs de baseball/sports » ou encore, les utilisateurs qui consultent des sites d’évaluation de véhicules automobiles recevront vraisemblablement plus de publicités sur les modèles de voiture spécifiques qui les intéressent. Cette catégorie d’intérêt déduite permet de présenter à un navigateur ou à appareil donné de la publicité pertinente à la catégorie. Le processus qui consiste à présenter des publicités à des utilisateurs spécifiques, selon leurs intérêts présumés, repose sur la reconnaissance des témoins stockés dans leurs navigateurs ou sur les identifiants publicitaires associés à leurs appareils mobiles. Quels sont les avantages que m’offre la publicité ciblée par centres d’intérêt en ligne? L'avantage le plus important de la publicité ciblée par centres d'intérêt en ligne est la possibilité d'accéder gratuitement à un large éventail de contenus, de services et d'applications sur le Web et dans les applications. La publicité nous permet d'utiliser Internet gratuitement. Par exemple, bon nombre de sites Web et de services en ligne qui ne requièrent pas d’abonnement reposent sur ce type de publicité pour toucher des revenus; ainsi, ils n’ont pas à facturer aux utilisateurs l’accès aux contenus qu’ils offrent ou à subventionner autrement les coûts de l’offre de contenus et de services. Chaque fois que vous lisez les nouvelles ou que vous consultez la météo en ligne, que vous parcourez votre site ou votre blogue de divertissement préféré, que vous jouez à un jeu gratuit en ligne ou que vous accédez à une application gratuite, ou que vous regardez une émission de télé populaire ou un vidéoclip sur votre ordinateur, vous voyez les avantages qu’offre aux consommateurs la publicité en ligne. Autrement dit, la publicité est le moteur financier de la plupart des sites Web et des applications, et la publicité ciblée par centres d’intérêt en ligne constitue un élément important de ce modèle économique. Sans elle, certains sites Web et certains services devraient faire payer les utilisateurs, et d’autres sites ne pourraient continuer d’offrir des services en ligne novateurs comme ils le font actuellement. Un autre avantage qu’offre la publicité ciblée par centres d’intérêt en ligne aux utilisateurs : des publicités plus pertinentes. Lorsque les annonceurs ont recours à la publicité ciblée par centres d’intérêt en ligne, vous voyez de la publicité plus intéressante, plus pertinente et plus utile pour vous. Par exemple, si vous êtes un étudiant de niveau postsecondaire, vous serez vraisemblablement plus intéressé à regarder des publicités portant sur des destinations intéressantes pendant la semaine de relâche que sur des maisons de retraite. Si vous aimez la musique, vous serez plus intéressé d’apprendre que votre groupe préféré se produit dans la ville que vous habitez. Ces publicités pertinentes améliorent l’expérience en ligne et aident les utilisateurs à trouver plus facilement des choses qui les intéressent davantage. Quels types de renseignements les entreprises utilisent-elles pour me présenter des publicités en ligne? Outre l’information sur vos centres d’intérêt, les entreprises de publicité en ligne peuvent utiliser des données sur l’emplacement général d’un appareil, telles que la ville ou le code postal, pour annoncer des produits propres à une région donnée ou pour aider les annonceurs locaux à joindre leur clientèle. Elles peuvent également utiliser séparément les données qu’elles ont recueillies en ligne pour faire d’autres prédictions au sujet des centres d’intérêt ou des antécédents des utilisateurs ou elles peuvent combiner leurs données à de l’information pertinente provenant d’autres sources. Une série type de données en lien avec le navigateur Web d’un utilisateur peut comprendre l’information suivante : Sexe : masculin Plage d’âge : 25-34 Emplacement géographique : Région de Vancouver Intérêt pour le basketball Intérêt pour les séjours à New York Magazine les voitures Certaines agences de publicité donnent aux utilisateurs l’accès aux catégories d’information liées à leurs navigateurs de sorte qu’ils peuvent modifier cette information afin de la rendre plus utile et plus exacte. Que sont les témoins et comment sont-ils utilisés dans la publicité en ligne? Les témoins (« cookies ») sont de petits fichiers textes qui sont placés sur votre disque dur par les sites Web que vous consultez et par les entreprises de marketing et les partenaires liés à ces sites. Seul le site Web ou seule l’agence de publicité qui place un témoin peut le lire par la suite. Vous pouvez utiliser les préférences dans votre navigateur pour voir et pour contrôler les témoins qui y sont actuellement placés. Le plus souvent, les témoins permettent aux sites Web de se rappeler des visiteurs lorsque ceux-ci reviennent sur le site. Un témoin peut aider un site Web à se rappeler de vos données d’accès ou de l’emplacement de votre ordinateur de sorte qu’il peut vous présenter des nouvelles ou la météo locales lorsque vous y revenez ou il peut vous rappeler ce que vous avez mis dans votre panier d’achat virtuel. Bref, ils sont utilisés pour personnaliser les sites Web que vous consultez, selon vos préférences et les prédictions établies à propos du type de contenu susceptible de vous intéresser. Dans le monde de la publicité, les témoins sont utilisés de bien des façons. Les entreprises de marketing en ligne utilisent les témoins pour les aider à présenter des publicités et à suivre leur rendement. Les témoins leur fournissent de l’information sur le nombre de fois qu’une publicité a été vue, sur les navigateurs qui les ont reçues et sur les sites qui étaient consultés lorsqu’elles ont été diffusées. Ils peuvent également prédire quel type de publicités peut intéresser les utilisateurs à l’avenir et aider les entreprises de marketing à reconnaître les navigateurs de ces utilisateurs de façon à ce que ces publicités leur soient présentées. Les témoins ne sont qu’un moyen utilisé pour vous présenter de la publicité ciblée par centres d’intérêt en ligne. Quelle est la différence entre les témoins internes et les témoins tiers? Les témoins internes (ou du propriétaire du site Web) sont les témoins établis par le site Web que vous consultez. Ils sont souvent utilisés pour se rappeler de vos préférences sur ce site Web en particulier. Les témoins tiers sont ceux qui sont installés par des entreprises autres que le site Web que vous consultez. Ces témoins fournissent à la page Web que vous consultez des gadgets logiciels, des publicités, des modules d’extension pour réseaux sociaux ou autres contenus. Sur la page de retrait des consommateurs, toutes les entreprises participant aux outils sont considérées comme des tiers; par conséquent, les témoins tiers doivent être activés pour permettre à ces entreprises de signaler votre statut et de respecter vos préférences en matière de retrait. Il est à noter que le navigateur Web d’Apple, Safari, désactive par défaut les témoins tiers. Que sont les identifiants publicitaires sur les appareils mobiles et en quoi diffèrent-ils des témoins? Les témoins ne sont pas la seule technologie utilisée par les annonceurs. Pour les applications, une technologie qui ne fait pas appel aux témoins – appelée « identifiants publicitaires sur appareils mobiles » – est utilisée pour présenter des publicités ciblées par centres d’intérêt. L’application AppChoices de la DAAC aide les consommateurs en leur offrant transparence et contrôle sur ces identifiants auprès des entreprises qui y sont inscrites. Que puis-je faire si je ne veux pas recevoir de publicité ciblée par centres d’intérêt en ligne? Vous pouvez choisir de refuser la publicité ciblée par centres d’intérêt en ligne d’entreprises qui participent à l’outil de retrait WebChoices du programme Choix de pub de la DAAC – disponible en version « ordinateur de bureau » et en version « navigateur mobile ». La DAAC offre également un autre outil de retrait – AppChoices – pour la collecte de données entre applications sur un appareil mobile, à des fins de publicité ciblée par centres d’intérêt et autres utilisations applicables. Pour exercer vos choix auprès des entreprises qui participent à cet outil de retrait, vous pouvez installer l’application AppChoices de la DAAC. Certaines entreprises participantes peuvent également offrir des outils de gestion de profil. Veuillez suivre le lien de ces entreprises depuis la liste figurant dans les outils WebChoices ou AppChoices pour découvrir ces contrôles additionnels. Après avoir refusé la publicité ciblée par centres d’intérêt à l’aide de W"
