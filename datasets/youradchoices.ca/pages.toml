title = "Contact Form — AdChoices in Canada"
full_description = 'Contact Us Please note that AdChoices is not an advertising company. We do not serve ads online. If you see the AdChoices icon, interact with it to learn who is delivering the ads you see.Use this form only if your company wants to join our self-regulatory program, is having website issues, or has a related inquiry. We will only respond to relevant inquiries. {"secureUrl":"https://grapefruit-fox-gpjd.squarespace.com","formSubmitButtonText":"Submit","formSubmissionMessage":{"html":"<p class=\"\" style=\"white-space:pre-wrap;\">Your inquiry has been submitted.</p><p class=\"\" data-rte-preserve-empty=\"true\" style=\"white-space:pre-wrap;\"></p>"},"submissionVerticalAlignment":"","buttonAlignment":"left","submissionMessageTextStyle":"","formName":"New Form","collectionId":"5dfa9a589a89ef5096b7b521","submissionAnimation":"","captchaTheme":1,"formId":"5dfa9a58f486e62e77a8c321","useLightbox":false,"firstFieldHighlightType":"","useFormsJs":true,"submissionTextAlignment":"","formFieldFormats":{"initialNameOrder":"GIVEN_FIRST","initialAddressFormat":{"id":0,"type":"ADDRESS","country":"CA","labelLocale":"en","fields":[{"type":"FIELD","label":"Address Line 1","identifier":"Line1","length":0,"required":true,"metadata":{"autocomplete":"address-line1"}},{"type":"SEPARATOR","label":"\n","identifier":"Newline","length":0,"required":false,"metadata":{}},{"type":"FIELD","label":"Address Line 2","identifier":"Line2","length":0,"required":false,"metadata":{"autocomplete":"address-line2"}},{"type":"SEPARATOR","label":"\n","identifier":"Newline","length":0,"required":false,"metadata":{}},{"type":"FIELD","label":"City","identifier":"City","length":0,"required":true,"metadata":{"autocomplete":"address-level2"}},{"type":"SEPARATOR","label":" ","identifier":"Space","length":0,"required":false,"metadata":{}},{"type":"FIELD","label":"Province","identifier":"State","length":0,"required":true,"metadata":{"autocomplete":"address-level1"}},{"type":"SEPARATOR","label":" ","iden