["https://youradchoices.ca/en/faq"]
title = "Frequently Asked Questions about ad targeting — AdChoices in Canada"
description = """
What is online interest-based (or online behavioural) advertising? How does 
online interest-based advertising work?"""
full_description = "About the DAAC & AdChoices What is AdChoices and the DAAC’s Self-Regulatory Program? The Digital Advertising Alliance of Canada (DAAC) is an independent not-for-profit organization that establishes and enforces responsible privacy practices for relevant digital advertising while giving consumers information and control over the types of digital advertising they receive. The DAAC operates the AdChoices program, which includes a set of principles that participating companies agree to adhere to and offers the public tools to control interest-based advertising online. The Ad Standards independently enforce compliance with the DAAC principles, a self-regulatory body that operates an accountability program for AdChoices. The DAAC’s AdChoices program applies to data collection and use for interest-based advertising in Canada. For information regarding programs in other nations and regions, please visit sister organizations, respectively: European Union/European Economic Area (EDAA) India & Middle East (DAAA) United States (DAA) The DAAC also runs the Political Ads self-regulatory program, designed to increase transparency for online political and issue-based advertisements. You can learn more about that other self-regulatory program at PoliticalAds.ca. What are the Canadian self-regulatory principles for online interest-based advertising? The Canadian self-regulatory principles for online interest-based advertising is an effort by many of the nation’s largest marketing and advertising trade associations to give consumers more information and control over online advertising. The self-regulatory program requires companies to inform consumers about their data collection and use practices and to enable consumers to exercise greater control over the types of ads they see. This website is a central element of that program by allowing consumers to opt out of interest-based advertising from a wide range of participating companies through a single page. Do the program’s principles cover all online advertising? No. The DAAC principles cover only activities defined in the principles as interest-based advertising (IBA). IBA does not include: Activities of first parties that are limited to their own websites or apps; Contextual advertising, which is advertising based on the content of the webpage being visited, a consumer’s current visit to a webpage or app, or a search query; Ad reporting, the collection or use of information for statistical reporting, web analytics/analysis, and advertising metrics; or Ad delivery, the distribution or delivery of online advertisements or advertising-related services using ad reporting data and not based on user preferences inferred from information collected over time and across websites or apps. Who is the DAAC? The DAAC is a not-for-profit association overseen by Canada’s leading marketing & advertising trade associations. The associations that have developed this program are eight of the largest marketing and media associations in Canada: Association des agences de communication créative (A2C) Association of Canadian Advertisers (ACA) Canadian Marketing Association (CMA) Canadian Media Directors’ Council (CMDC) Institute of Canadian Agencies (ICA) Interactive Advertising Bureau of Canada (IAB Canada) Ad Standards implements the accountability program for the DAAC’s self-regulatory program. All of these associations and the registrants of the AdChoices self-regulatory program in Canada, have agreed to help promote widespread industry adoption of the program. Online Interest-Based Advertising FAQ What is online interest-based (or online behavioural) advertising? Online interest-based advertising – also called “online behavioural advertising” – uses information gathered through your browser or mobile device about your visits over time and across different websites and apps in order to help predict your preferences and show you ads that are more likely to be of interest to you. For example, a sporting goods manufacturer might work with an advertising network that collects and uses online interest-based advertising information to deliver ads to the browsers of users who have recently visited sports-related websites, or an airline might direct ads to users who recently visited mobile travel apps. How does online interest-based advertising work? When you visit a website or use an app that works with an advertising network or other online advertising companies, these companies gather information about your browser or device to tell when that same browser or device visits other websites or apps within the same network—even if different companies run these content offerings or have different web addresses or brands. Over time, the information gathered about the browser or device may help predict the user’s likely interest in particular categories of ads. For example, users who frequently visit baseball-related websites might receive more ads for the “baseball/sports enthusiast” category, or users who engage with automobile review apps might receive more ads for the particular models of cars that interest them. This inferred interest category provides advertising relevant to the category to a specific browser or device. The process of serving ads to particular users, based on their predicted interests, relies on recognizing the cookies stored in users’ browsers or on advertising IDs associated with mobile devices. What are the benefits of online interest-based advertising for me? The most significant benefit of online interest-based advertising is the ability to access a wide range of content, services and applications on the web and in apps for free. Advertising facilitates us to use the Internet for free. For example, many non-subscription websites and online services rely on this type of advertising for revenue, so they do not have to charge users for the content they provide or otherwise subsidize the cost of delivering content and services. When you check the news or the weather online, scan your favourite entertainment site or blog, play a free online game or app, or watch a popular TV show or music video on your computer, you see the consumer benefits of online advertising at work. Put another way, advertising is the financial engine that powers most websites and apps, and online interest-based advertising is a significant part of that economic model. Without it, some websites and services might have to start charging users, and others would not be able to continue delivering the innovative online services that they currently do. Another benefit of online interest-based advertising for users is more relevant ads. When advertisers use online interest-based advertising, you get more interesting, relevant, and useful ads. For example, if you’re a college student, you might be more interested in seeing ads for spring break destinations than retirement homes. Music lovers may want to see their favourite band coming to town. These relevant ads improve the online experience and help users find the things that interest them more easily. What types of information do companies use to advertise to me online? In addition to interest-related information, online advertising companies may use information about a device’s general location, such as the city or postal code, to market products most interested in a particular region or help local advertisers reach their customers. Advertising companies may also use demographic information, such as age, gender or occupation provided during registration for access and use of a site, or they can attempt to infer such information based on the general demographics of visitors to a particular site. They may separately use the data they have collected online to make additional predictions about users’ interests or backgrounds, or they may combine their data with related information from other sources. A typical set of information associated with a user's web browser might include: Gender: Male Age range: 25-34 Geography: Vancouver area Interested in basketball Interested in travel to New York Car shopper Some advertising companies give users access to the categories of information associated with their browsers so that users can edit that information to make it more useful and accurate. What are cookies and how are they used in online advertising? Cookies are small pieces of text placed on your hard drive by the websites you visit and the advertising companies and partners for those sites. Only the website or ad company that sets a cookie can read it. You can use the preferences in your browser to view and control the cookies you currently have set. Most commonly, cookies help websites remember visitors when they return to their site. A cookie can help remember your login, and it can also remember your computer’s location so that the website can show your local news or weather when you return, or it can remind you what you placed in your online shopping cart. In short, cookies are used to customize websites for you based on the preferences you’ve chosen, and through predictions about the type of content that might interest you. In the advertising world, cookies are used in many different ways. Online advertising companies use cookies to help deliver ads and track their performance, they can provide information about how many times an advertisement has been seen, which browsers have received an ad, and what sites were being visited when an ad appeared. Cookies can also help predict which type of advertisements might be of interest to users in the future, and help advertising companies recognize the browsers of users so that these ads can be delivered to them. Cookies are just one way that interest-based advertising occurs online. What is the difference between first-party cookies and third-party cookies? First-party cookies are those set by a website you are visiting. They are often used to remember your preferences with that particular website. Third-party cookies are those set by companies other than the website you are visiting. These cookies furnish widgets, advertisements, social plug-ins or other content to the webpage you are visiting. On the consumer choice page, all of the participating companies in the tools are treated as third parties, and therefore third-party cookies must be enabled in order for the companies to be able to report your status and to set your requested opt-outs. Note that Apple’s Safari web browser disables third-party cookies by default. What are device identifiers, and how do they differ from cookies? Cookies are not the only bits of technology that advertisers rely on. In apps, non-cookie technologies – called device ID’s – are used to help serve interest-based ads. The DAAC’s AppChoices app helps consumers have transparency and control over these identifiers with the companies listed in the app. What can I do if I don’t want to receive online interest-based advertising? You can opt out of receiving interest-based advertising from the companies participating in the DAAC AdChoices program’s WebChoices consumer choice tool, which is available in versions for desktop and mobile browsers. The DAAC also offers a separate choice tool – AppChoices – for the collection of cross-app data on a mobile device for interest-based advertising and other applicable uses. To exercise choice for companies participating in this choice tool, you can install the DAAC’s AppChoices app. Some companies participating in the DAAC may also provide profile management tools. Please follow the company link from the listing within the WebChoices or AppChoices tools to explore these additional controls. After you opt-out using WebChoices or AppChoices, the participating companies will no longer collect, use, or transfer information about activity on your browser or device, respectively, for the purpose of interest-based advertising or any other applicable data practice covered by the DAAC principles. They may, however, continue to serve online advertising on the pages or apps you visit that is not dependent on information about your online interests and may continue to use data for purposes other than interest-based advertising such as operational purposes, fraud prevention, and analytics. Browsers and mobile operating systems also provide other privacy mechanisms. We encourage you to review the privacy control settings available in your browser or device platforms settings. Note that some of these controls (such as settings that block first or third-party cookies) may impede the storage of your WebChoices opt-out preferences and may need to be reset to accept such cookies, as you use the WebChoices tool to opt-out, to honour your opt-out requests successfully. What are the Canadian self-regulatory principles for online interest-based advertising? The Canadian self-regulatory principles for online interest-based advertising is an effort by many of the nation’s largest marketing and advertising trade associations to give consumers more information and control over the advertising they receive online. The self-regulatory program requires companies to clearly inform consumers about their data collection and use practices and to enable consumers to exercise greater control over the types of ads they see. This website serves as a central element of that program by offering consumers the ability to opt out of interest-based advertising from a wide range of participating companies through a single page. The associations that have developed this program are eight of the largest marketing and media associations in Canada: Association des agences de communication créative (A2C); Association of Canadian Advertisers (ACA); Canadian Marketing Association (CMA); Canadian Media Directors’ Council (CMDC); Institute of Canadian Agencies (ICA); and, Interactive Advertising Bureau of Canada (IAB Canada). Ad Standards implements the accountability program for the DAAC’s self-regulatory program. All of these associations and the registrants of the AdChoices self-regulatory program in Canada, have agreed to help promote widespread industry adoption of the program. What is the AdChoices icon, and what does it tell me about online interest-based advertising? A central element to the DAAC’s program is a clickable blue triangular icon placed on or near advertisements that links to information about online interest-based advertising. When the icon is clicked, you should be able to identify the companies serving the ad and see a description of each company’s data collection and use practices. The icon should also link to a choice mechanism that can be used to opt out of future online interest-based advertising. If you click or tap the icon, you will learn more about the ad and your online interest-based advertising choices. How does the program limit the sharing of information between online advertising companies? The online advertising ecosystem involves hundreds of companies that play different roles"
