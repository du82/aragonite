["https://youradchoices.ca/fr/actualites/2020/10/13/sondage-2020-sur-la-sensibilisation-des-consommateurs-au-programme-choix-de-pub"]
title = "Sondage 2020 sur la sensibilisation des consommateurs  au programme Choix de pub — AdChoices in Canada"
description = "L’Alliance de la publicité numérique du Canada (DAAC) a le plaisir de vous présenter les résultats de son plus récent sondage sur la sensibilisation des consommateurs à son programme Choix de pub.  Ce sondage fournit une nouvelle perspective sur le niveau de sensibilisation qui existe au Canada conc"
full_description = "Sondage 2020 sur la sensibilisation des consommateurs au programme Choix de pub L’Alliance de la publicité numérique du Canada (DAAC) a le plaisir de vous présenter les résultats de son plus récent sondage sur la sensibilisation des consommateurs à son programme Choix de pub.Ce sondage fournit une nouvelle perspective sur le niveau de sensibilisation qui existe au Canada concernant la publicité ciblée par centres d’intérêt. Figure ci-après un résumé des résultats de cette quatrième édition du sondage réalisée par la firme de recherche Synqrinus de Toronto.Principales conclusions :73 % des répondants savent que des données sont recueillies en ligne. 73 % des répondants affirment connaître la façon dont des données les concernant sont recueillies en vue d’établir leurs centres d’intérêt.72 % des répondants savent que des publicités spécifiques leur sont présentées selon leur historique de navigation. 81 % des répondants sont d’avis que Choix de pub est clair et facile à utiliser. Les marques et les sites Web qui affichent l’icône Choix de pub sont plus dignes de confiance que les marques et les sites Web qui ne le font pas. 82 % des répondants sont d’avis que le contenu Internet gratuit (comme les nouvelles, la météo, la messagerie électronique, les médias sociaux et les blogues) est important pour eux.85 % des répondants préfèrent un contenu Internet gratuit, payé par la publicité, plutôt que de payer pour les services qu’ils utilisent en ligne. Ce sondage, réalisé en mai 2020 auprès d’un échantillon national pondéré de 1034 adultes âgés de 18 à 64 ans, a pour but d’aider la DAAC et ses participants à comprendre à quels éléments de la publicité ciblée par centres d’intérêt sont sensibilisés les consommateurs canadiens.Cliquez ici pour visionner le résumé graphique du sondage DAACOctober 13, 2020sondage, choix de pub Facebook0 LinkedIn0 0 Likes"
