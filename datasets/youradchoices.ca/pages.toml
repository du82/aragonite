["https://youradchoices.ca/en/news/2023/7/21/daacs-10-year-celebration-event-friday-september-22"]
title = "DAAC's 10-Year Celebration Event - Friday, September 22 — AdChoices in Canada"
description = "It's a momentous occasion! The Digital Advertising Alliance of Canada (DAAC) is gearing up to commemorate a significant milestone - ten years of AdChoices operations. We invite you to participate in the celebration as we reminisce about our journey and look forward to a bright future together. Mark"
full_description = "DAAC's 10-Year Celebration Event - Friday, September 22 It's a momentous occasion! The Digital Advertising Alliance of Canada (DAAC) is gearing up to commemorate a significant milestone - ten years of AdChoices operations. We invite you to participate in the celebration as we reminisce about our journey and look forward to a bright future together. Mark your calendars for an exclusive in-person event in the heart of downtown Toronto, where like-minded industry professionals will come together for a day of learning, networking, and camaraderie.While the primary focus of this celebration is to gather organizations participating in the DAAC's AdChoices program, we wholeheartedly welcome others who share our passion for the advertising industry to attend. If you are not yet a part of the AdChoices family, this event provides an excellent opportunity to learn more about our initiatives and consider joining us on this journey.9:00 - 9:30 - Registration, light breakfast, networking9:30 - 12:40 - Programming consisting of updates from the DAAC, DAA US, and Ad Standards12:40 - 1:15 - Lunch1:15 - 2:00 - Programming consisting of discussions about Bill C-27, Quebec's Law 25, and more2:00 - 3:00 - NetworkingIf you or your organization is interested in playing a pivotal role in this event's success, we encourage you to inquire about our exclusive sponsorship packages. Your contribution will not only be recognized during the celebrations but will also enable us to continue making an impact on the digital advertising landscape.So, please join us at the Ontario Heritage Centre on Friday, September 22nd, 2023, where we commemorate our achievements, inspire one another, and forge lasting connections.Let's toast ten years of success and the promise of an even brighter future together! RSVP To inquire about sponsorship opportunities, kindly contact us at info@daac.ca. DAACJuly 21, 2023event Facebook0 LinkedIn0 0 Likes"
