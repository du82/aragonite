["https://youradchoices.ca/fr/actualites/2023/12/20/choix-de-pub-et-les-plateformes-de-gestion-du-consentement-cmp"]
title = "Choix de pub et les plateformes de gestion du consentement (CMP) — AdChoices in Canada"
description = "La présente note a pour but d’aider les entreprises à gérer leurs partenariats avec les plateformes de gestion du consentement (CMP), à leur permettre de poser les bonnes questions et à offrir aux consommateurs une interface qui est conforme aux principes de la DAAC en matière de transparence et de"
full_description = "Choix de pub et les plateformes de gestion du consentement (CMP) La présente note a pour but d’aider les entreprises à gérer leurs partenariats avec les plateformes de gestion du consentement (CMP), à leur permettre de poser les bonnes questions et à offrir aux consommateurs une interface qui est conforme aux principes de la DAAC en matière de transparence et de contrôle exercé par le consommateur.En quoi consistent les plateformes de gestion du consentement?Les plateformes de gestion du consentement (CMP) offrent des solutions quant à la gestion des choix au niveau du consentement/domaine sur le site Web/dans l’application d’une entreprise. Les entreprises de CMP offrent parfois un large éventail de services, y compris des outils de données et des services de consultation.Les interfaces que présentent les CMP aux consommateurs peuvent varier en apparence et permettent aux visiteurs d’autoriser ou de révoquer la collecte et l’utilisation de données à différentes fins publicitaires, analytiques et autres dans le domaine dans lequel elles sont déployées.Les entreprises recourent habituellement à ces avis comme moyen de se conformer aux lois et réglementations de leur juridiction en matière de protection de la vie privée, qui régissent les avis et le consentement. Comme bon nombre d’entreprises exercent leurs activités dans plusieurs juridictions, il n’est pas rare de voir des avis dans des juridictions qui ne disposent pas d’un régime législatif sur la protection de la vie privée aussi strict que d’autres.Les CMP partagent aussi le statut de consentement d’un visiteur avec les fournisseurs de technologie publicitaire, sur le site ou dans l’application avec lesquels la CMP travaille. Ces fournisseurs de technologie publicitaire partagent ensuite le signal de consentement avec le flux d’enchères (bidstream).Les CMP ne remplacent en aucun cas Choix de pub. Le recours à une CMP est volontaire en vertu du programme de la DAAC, mais son utilisation peut aider une entreprise participante à se conformer aux principes de la DAAC.Bannières et modules de conse Les CMP et Choix de pubLes CMP offrent généralement aux consommateurs un processus d’interaction en deux étapes : (1) une bannière de consentement lors de la première visite, puis de manière périodique par la suite, et (2) un module de consentement. Habituellement, le module de consentement (2) est relié à la bannière de consentement par un hyperlien (1), fréquemment appelé « Autres paramètres », « En savoir plus » ou portant toute autre appellation semblable.Une bannière de consentement est le premier avis que le consommateur voit, souvent lorsqu’il consulte un site Web/une application pour la première fois. La bannière peut prendre la forme d’une fenêtre contextuelle (pop-up) ou d’une barre qui s’ouvre au bas de la page Web. La bannière invite à l’action, soit normalement à en apprendre plus ou à continuer sur le site Web/dans l’application et à utiliser les services fournis en échange de la collecte de données.Un module de consentement est une interface qui apparaît si le consommateur souhaite en savoir plus ou exercer ses choix quant au traitement de ses renseignements personnels sur ce site Web/dans cette application. Un consommateur peut atteindre le module au moyen de la bannière de consentement ou autrement.D’autres accès au module varient grandement selon le fournisseur.Les CMP et Choix de pubIl n’est pas nécessaire d’utiliser une CMP en vertu du programme de la DAAC, mais le fait d’y recourir peut aider une entreprise participante à se conformer aux principes de la DAAC. Rappel : une CMP ne remplace aucunement la certification Choix de pub et l’utilisation de Choix de pub.Supposons qu’une entreprise recourt à une CMP qui offre une expérience de consentement aux visiteurs. L’entreprise peut alors utiliser le marqueur d’annonce Choix de pub dans le pied de page de son site Web ou dans le menu latéral de son application pour fournir aux consommateurs un avis renforcé permanent supplémentaire. Le marqueur d’annonce Choix de pub peut servir à resolliciter la CMP et à offrir des choix sur tout le site et/ou dans toute l’application, ce que ne font pas les CMP.Pourquoi recourir à la fois à une CMP et au programme de la DAAC?Les possibilités qu’offre une CMP et celles qu’offre le programme Choix de pub diffèrent, mais elles sont complémentaires. On recourt à une CMP pour les rapports entre les données dans un domaine ou dans une application, alors que le programme Choix de pub met en lumière les rapports entre les données dans l’écosystème publicitaire plus vaste et offre un meilleur contrôle au consommateur.Figurent ci-après les principales différences : Les outils de contrôle offerts par les DAA* influent au fil du temps sur la publicité ciblée par centres d’intérêt présentée sur les sites Web et dans les applications. Les CMP offrent quant à elles un contrôle uniquement aux entreprises. Le fait de recourir aux deux permet au consommateur de mieux comprendre qu’il dispose de réglages pour ce site Web/cette application (à l’aide de la CMP) et d’un contrôle plus grand à l’échelle du Web au moyen des outils de la DAA, affichant les fournisseurs externes tiers avec lesquels vous pouvez travailler. Nous sommes d’avis que ce contrôle à l’échelle du Web respecte l’esprit de bon nombre des attentes qu’ont exprimées antérieurement les organismes de réglementation en matière de protection de la vie privée.Le programme de la DAAC prévoit une surveillance indépendante de la responsabilité, assurée par les Normes de la publicité, ce que le fait de travailler uniquement avec une CMP n’offre pas. Le programme de la DAAC offre une expertise visant à aider vos équipes à comprendre les attentes du Commissariat à la protection de la vie privée (CPVP) du Canada en matière de publicité pertinente.La participation au programme de la DAAC diffère de la conformité juridique. En effet, le programme va au-delà de celle-ci en offrant de l’information et un contrôle renforcés, spécifiques à la publicité pertinente sur les sites et dans les applications. Grâce au programme, une marque détient la relation avec le consommateur en matière de protection de la vie privée et ne compte pas sur d’autres parties pour s’en assurer.L’icône Choix de pub est bien établie et lorsqu’elle s’affiche sur les sites Web/dans les applications, on note une hausse de l’opinion favorable et de la confiance chez les consommateurs. L’icône peut être adaptée par votre CMP afin de renforcer vos avis, d’indiquer que votre marque participe au programme et d’informer les consommateurs sur la signification de l’icône. Ainsi, lorsque l’icône s’affiche dans vos publicités diffusées sur le Web, vous abordez directement cette relation de données avec le visiteur lorsqu’il visite votre site Web/application. L’icône répond aux questions courantes de l’utilisateur comme par exemple, pour quelles raisons reçoit-il cette publicité ou comment peut-il exercer un contrôle sur les publicités qu’il reçoit.La participation au programme de la DAAC indique aux organismes de réglementation que vous collaborez de manière proactive aux programmes d’autoréglementation de l’industrie et que vous souhaitez satisfaire aux attentes décrites dans les lignes directrices sur la publicité comportementale en ligne (PCL) du CPVP. Le programme Choix de pub ne concerne pas la conformité avec la loi; il concerne plutôt la confiance des consommateurs en fournissant des précisions sur les pratiques publicitaires de l’entreprise et un contrôle au niveau de l’industrie.Partenariat entre le réseau de la DAA et les CMP Le réseau de la DAA a créé une trousse de documents techniques et de mise en œuvre à l’intention des CMP qui s’associent au programme Choix de pub (voir la section CMP CoMPlement pour plus de détails).Si une CMP décide de travailler avec le réseau de la DAA, elle obtient une licence pour utiliser l’icône Choix de pub et pour l’afficher au nom de ses clients, et elle peut commencer à la relier à l’aide d’hyperliens aux outils de la DAA.L’avantage que tirent les CMP tient à leur capacité d’héberger un module Choix de pub pour les clients sur la plateforme même ou sur les sites Web/dans les applications de ces derniers et de leur offrir la possibilité d’utiliser les signaux reçus des outils de la DAA sur leurs propriétés. Par exemple, si une marque souhaite limiter le suivi des visiteurs qui ont consulté antérieurement les outils de la DAA permettant de refuser la PCL, la CMP verra désormais ce signal et le respectera au nom de son client.Le module Choix de pub qu’une CMP peut afficher décrit comment des publicités pertinentes sont présentées sur le site Web/dans l’application (un avis en langage simple) à l’aide d’un bouton ou d’un hyperlien pointant vers les outils de la DAA et d’un bouton ou d’un hyperlien pour afficher le module de consentement plus exhaustif qu’offre la CMP. Cette interface en langage simple permet au participant de satisfaire aux exigences des principes de la DAAC et, en outre, de fournir aux consommateurs l’occasion de révoquer leurs choix exercés avec la CMP lors de leur première visite.Si le module Choix de pub est disponible en permanence dans le pied de page/menu latéral d’un site Web/d’une application, l’interface de la CMP sera alors disponible en tout temps pour le visiteur. Exemple de la façon dont un module Choix de pub peut être affiché sur un site Web qui est directement relié à la CMP ou servi par celle-ci. Il est à noter que dans l’exemple ci-dessus, un consommateur peut ouvrir les réglages plus complets de la CMP en cliquant, dans le module, sur « Tous les paramètres ». Information complémentaire sur les CMPLes bannières de consentement à l’intention des consommateurs peuvent être combinées aux exigences des principes de la DAAC relatives aux avis renforcés des propriétaires. Votre bannière de consentement peut vous aider à vous conformer au programme de la DAAC.Savoir ce qu’il faut divulguer Connaître les flux de données de votre organisation et ce qui doit être communiqué au consommateur constitue la première mesure cruciale à prendre.Faites savoir aux consommateurs les raisons pour lesquelles vous vous adonnez à certaines pratiques et l’existence de partenaires tiers s’il y a lieu, notamment en matière de publicité pertinente. Offrez-leur la possibilité d’en apprendre davantage sur eux afin de leur permettre de décider d’apporter certains changements le cas échéant.Le langage utilisé dans la bannière et dans le module de consentement doit être facile à comprendre et informatif. Évitez le double langage ou tout jargon de l’industrie et tenez compte du fait que le français peut ne pas être la langue maternelle du lecteur. Optez également pour un niveau d’alphabétisation de niveau primaire lorsque vous rédigez les avis.Les bannières et les modules qu’offrent les CMP doivent pouvoir être modifiés afin de permettre à votre conseiller juridique et à vos experts en expérience utilisateur de savoir quel type de message vos visiteurs doivent voir et ce qu’il peut être nécessaire de mettre en lumière.Il est également recommandé de configurer les avis en fonction des juridictions dans lesquelles la bannière sera présentée. Cet ajustement de l’expérience utilisateur selon la juridiction est offert par la plupart des CMP bien établies.Rendre les choix gérables Étant donné qu’une partie de la collecte, de l’utilisation et de la communication des données qui s’effectuent sur votre site Web/dans votre application peut être en lien avec la publicité numérique, veuillez vous assurer de suivre les orientations de la DAAC en matière de publicité ciblée par centres d’intérêt et des choix que vous devez offrir aux consommateurs.La DAAC exige que les entreprises soient reliées par des hyperliens à ses mécanismes de contrôle centralisés, accessibles sur votrechoixdepub.ca (spécifiquement à https://youradchoices.ca/fr/outils pour le français et à https://youradchoices.ca/en/tools pour l’anglais).Questions à poser à votre CMPLes CMP peuvent collaborer avec vous pour offrir la meilleure expérience qui soit aux consommateurs. Si vous commencez à travailler avec une plateforme de gestion du consentement ou si vous souhaitez améliorer le processus, vous devez lui poser certaines questions clés : Quelles sont les options qu’offre votre module de consentement? Demandez-lui de vous en expliquer les détails et de vous montrer quelques exemples. Le texte de la bannière/du module de consentement peut-il être modifié ou personnalisé?Est-il possible de modifier les couleurs, le positionnement et la taille de la bannière de consentement? Les bannières de consentement sont-elles adaptées à la juridiction dans laquelle elles seront affichées? Peut-on traduire les bannières de consentement (par ex., français-anglais)? La bannière de consentement peut-elle être personnalisée à l’aide d’un logo et/ou de l’aspect d’une propriété numérique?Comment le module de consentement peut-il être réaffiché pour permettre aux consommateurs de modifier leurs choix?Demandez à la CMP si les consommateurs peuvent modifier leurs choix par l’entremise de Choix de pub qui est universellement reconnu lorsqu’il s’agit de choix en lien avec la publicité.La CMP s’est-elle entretenue du projet CMP CoMPlement avec la DAA/DAAC?Il est recommandé d’utiliser le marqueur d’annonce Choix de pub (l’icône et le texte approuvé) pour réafficher un module CMP. Il s’agit là d’un élément clé du projet CMP CoMPlement de la DAA. D’autres documents peuvent également être envoyés à votre CMP sur demande.Au sujet de CMP CoMPlementLe projet CMP CoMPlement permet aux consommateurs d’utiliser l’icône universelle Choix de pub pour accéder à une console de CMP ainsi qu’à l’information et aux choix concernant les publicités pertinentes, faisant ainsi progresser la mission des DAA dans l’affichage d’avis en temps réel et de contrôle ailleurs que dans la politique de confidentialité. Cette mission vous aide également à promouvoir votre marque en tant que marque respectueuse de la vie privée.À l’aide de nouveaux modules utilisateurs et de nouvelles spécifications techniques qui viennent simplifier et améliorer l’expérience utilisateur, les marques et les éditeurs peuvent intégrer le programme Choix de pub mondialement reconnu dans le flux d’utilisateurs d’une CMP participante, donnant ainsi accès aux consommateurs à la fois aux contrôles propres à la CMP et aux choix offerts à l’échelle de l’industrie par le biais des portails des DAA.Cliquez ici pour en savoir plus sur ce projet. Veuillez inciter vos CMP à travailler avec les DAA.Pourquoi s’inscrire au programme Choix de pub? Les participants ont accès à l’icône Choix de pub (dont la couleur peut être modifiée pour s’assortir à l’image de marque de l’entreprise lorsqu’elle est utilisée sur les sites Web/dans les applications de cette dernière); elle peut également être ajoutée aux bannières de consentement.Reliez-vous aux mécanismes de choix de notre indus"
