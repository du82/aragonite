["https://youradchoices.ca/en/about-daac"]
title = "About DAAC — AdChoices in Canada"
full_description = '''Scroll About the DAACThe Digital Advertising Alliance of Canada (DAAC) is an independent not-for-profit organization led by the leading national advertising and marketing associations in Canada whose members are committed to delivering a robust and credible self-regulatory program for responsible online interest-based advertising (IBA). DAAC News The Canadian AdChoices program, developed by the DAAC, was designed to educate consumers about interest-based advertising (IBA) and to provide notices for consumers to know when IBA is occurring.The principles and guidelines for our program lay out expectations for companies collecting, using and disclosing personal information for IBA purposes. Program participants use our recognizable icon as a beacon with which consumers can interact to learn more about IBA. The DAAC also features interest-based advertising control tools that consumers can use.The DAAC is responsible for the program's operations in Canada, often coordinating with other global DAA organizations running similar self-regulatory programs in the US and Europe. Contact Us DAAC VisionEveryone in the digital advertising ecosystem uses an effective industry-wide principles-based system.DAAC MissionTo provide consumers with enhanced transparency and control.To establish and enforce responsible privacy practices across the industry for relevant digital advertising.To build trust of consumers and other stakeholders in the marketing and advertising industry. td { padding-top: 2px; padding-bottom: 1px; padding-left: 5px; padding-right: 5px; } DAAC Board of Directors Caroline MoulChair Julie CourtemancheTreasurer Sara Clodman Judy Davey Scott Knox Thierry Lessard Alexander Miceli DAAC Founding Members Association of Canadian Advertisers (ACA) Association of Creative Communications Agencies (A2C) Canadian Marketing Association (CMA) Canadian Media Directors' Council (CMDC) Julie Courtemanche Institute of Canadian Agencies (ICA) Interactive Advertising Bureau of Canada (IAB Canada) Adam Kardash DAAC Staff Julie FordExecutive Director Randy SagemanEngagement Manager Trent BemisAccount Manager DAAC AssociationsThe Digital Advertising Alliance of Canada (DAAC) is a consortium of the leading national advertising and marketing trade associations in Canada, consisting of: <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549294551936-G7UULXR9LGGTBFW7TA54/A2C_v5_V_coul_AN.PNG" alt="Association des Agences de Communication Créative (A2C)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549294569269-FNKR6LVZB9AAMW74JT0X/ACA-logo-colour.jpg" alt="Association of Canadian Advertisers (ACA)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1657037050634-2DWDT32M3PB1R8SY4XRA/CMA-smaller.png" alt="Canadian Marketing Association" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549294349528-L7JLRKLLWU7316P27S13/CMDC.png" alt="Canadian Media Directors' Council (CMDC)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549295415140-6W3OIVH2XX8R53XJN7FV/iab+canada.png" alt="Interactive Advertising Bureau of Canada (IAB Canada)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1657035963542-UGDZN0PRDSWY62AR6CAZ/ICA.png" alt="Institute of Canadian Agencies" /> #block-yui_3_17_2_1_1549292270993_29758 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1549292270993_29758 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } About the AdChoices ProgramThe Canadian self-regulatory program for online interest-based advertising, called AdChoices, is an effort to give consumers more information and choices about the advertising they receive online.The self-regulatory program requires companies to clearly inform consumers about their data collection and use practices and allow consumers to exercise greater control over the types of ads they see.The DAAC is responsible for the operations of the AdChoices self-regulatory program in Canada, coordinating where possible with other global DAA-organizations running similar self-regulatory programs. Accountability Partner Ad Standards, an independent national advertising self-regulatory body, is responsible for the accountability component of the AdChoices program in Canada. As part of this responsibility, Ad Standards accepts and investigates complaints about online interest-based advertising practices that may violate the DAAC's self-regulatory principles for online behavioural advertising.When a violation is confirmed, Ad Standards works with companies involved to achieve compliance. Ad Standards also publishes compliance reports.Learn More DAA’s WorldwideThe Digital Advertising Alliance of Canada (DAAC) works closely with other self-regulatory programs worldwide to make the AdChoices program a global endeavour. <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1687183849622-FRE1ONY9PWT52GSG9FVE/DAA-2023.jpg" alt="DAA United States" /> DAA United States <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549297253507-E9WZLNVWQF1TL5Q5SNL2/EDAA-Logo-whitespace.png" alt="EDAA" /> EDAA <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549393298387-09NKEQU1SF0NU10ZB2D0/Apda-transp.png" alt="APDA" /> APDA <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1687183452022-VUM3P5DNIK5FXMC6VL40/DAAA.jpg" alt="DAA Asia &amp;amp; Middle East" /> DAA Asia & Middle East #block-yui_3_17_2_1_1549292270993_96666 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1549292270993_96666 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } About the DAAC DAAC Team Associations in the DAAC About the AdChoices Program Accountability Partner DAA Global'''
