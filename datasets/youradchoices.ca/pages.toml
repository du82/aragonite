["https://youradchoices.ca/fr/responsabilite"]
title = "Comment formuler une plainte — AdChoices in Canada"
description = """
Pour signaler une violation des principes du programme ChoixDePub, 
consultez le formulaire de soumission des Normes de la publicité."""
full_description = 'Scroll Comment formuler une plainteLes entreprises qui font de la publicité ciblée par centres d’intérêt sont tenues de rendre des comptes lorsqu’elles adhèrent à notre programme d’autoréglementation.Les plaintes sont acceptées et traitées par les Normes de la publicité – organisme d’autoréglementation indépendant qui a pour tâche de surveiller notre programme d’autoréglementation. Pour signaler une violation potentielle des principes du programme Choix de pub, veuillez consulter le formulaire de soumission d’une plainte des Normes de la publicité. Figurent ci-après quelques conseils détaillés sur la soumission d’une plainte. Soumettre une plainte IMPORTANT - Choix de pub n’est pas un bloqueur de publicités. Il n’est pas non plus une agence de publicité. Nous ne contrôlons pas le contenu de publicités spécifiques, ni l’endroit où elles sont placées ou la fréquence à laquelle vous les voyez. Choix de pub vous permet plutôt de contrôler la façon dont les entreprises utilisent vos données pour personnaliser leurs publicités en fonction de vos centres d’intérêt. Soumettre une plainteSi vous vous apprêtez à soumettre une plainte au sujet du ciblage publicitaire, tentez d’avoir le plus d’information possible à transmettre aux Normes de la publicité.Il importe entre autres de noter l’endroit où vous avez vu la publicité (l’URL du site ou l’application), ce sur quoi portait la publicité (idéalement la marque du produit), l’affichage ou non de l’icône dans la publicité et ce qui s’est passé lorsque vous avez cliqué sur l’avis associé à l’icône.Essayez d’effectuer des captures d’écran de l’incident que vous signalez, ce qui aidera beaucoup les Normes de la publicité dans leur enquête. Lisez les consignes à droite sur la façon d’effectuer une capture d’écran. Comment effectuer une capture d’écran:+ Windows Desktop+ Mac Desktop+ Apple iOS+ Android Procédure de conformité Guide de conformité Choix de pub Ce document infographique pratique a été créé pour aider les participants actifs au programme à mieux comprendre les éléments de la conformité avec le programme.Cliquez sur l’image pour l’agrandir. <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1658951451192-99A1QBV73MMHWZL6835O/QuickGuidetoCompliance-2022-FRENCH.png" alt="Guide de conformité rapide au programme Choix de pub" /> Cliquez sur l’image pour télécharger le PDF. Au sujet des Normes de la publicité Les Normes de la publicité – organisme national indépendant d’autoréglementation de la publicité – assument le volet Responsabilité du programme Choix de pub au Canada.À ce titre, elles acceptent et évaluent les plaintes formulées à l’encontre de pratiques de publicité ciblée par centres d’intérêt en ligne, qui sont susceptibles d’enfreindre les principes d’autoréglementation de la DAAC pour la publicité comportementale en ligne.Lorsqu’une infraction est confirmée, les Normes de la publicité travaillent avec les entreprises concernées afin de les aider à se conformer et publient des rapports de conformité. En savoir plus Rapports de conformitéLes rapports de conformité du Programme de responsabilité Choix de pub soulignent la façon dont les entreprises qui participent au programme Choix de pub de l’Alliance de la publicité numérique du Canada (DAAC), pour la publicité ciblée par centres d’intérêt en ligne, ont mis en œuvre les principes du programme.En tant qu’organisme national d’autoréglementation de l’industrie canadienne de la publicité, le travail de conformité des Normes de la publicité est indépendant de celui de la DAAC. Voir tous les rapports de conformité Comment formuler une plainte Soumettre une plainte Comment se conformer au programme Choix de pub Au sujet des Normes de la publicité Rapports de conformité'
