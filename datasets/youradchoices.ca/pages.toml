title = "Political Advertising in Canada Event Recap — AdChoices in Canada"
description = "On Friday, January 24, the Digital Advertising Alliance of Canada and IAB Canada co-hosted an event called  Political Advertising in Canada  at the Index Exchange office in Toronto.  The keynote speaker was Donald J. Bourgeois, Counsel at Fogler Rubinoff, LLP, who was warmly introduced by Bill Hearn"
full_description = "Political Advertising in Canada Event Recap On Friday, January 24, the Digital Advertising Alliance of Canada and IAB Canada co-hosted an event called Political Advertising in Canada at the Index Exchange office in Toronto.The keynote speaker was Donald J. Bourgeois, Counsel at Fogler Rubinoff, LLP, who was warmly introduced by Bill Hearn, Principal at Hearn Law. Don detailed the background of the Canada Elections Act and updates that took effect in 2018 under the Elections Modernization Act. This insightful talk was record, as noted below, but for those looking to dive even further on the subject, we have linked to Don’s book “Election Law in Canada”.Presentation recording: Political Advertising Rules Under the Canada Election ActPresentation deck: Presentation slide deckDon's book: Election Law in Canada, 2nd Edition | LexisNexis Canada IAB Canada described their issue tracker solution, which will be available for subscription ahead of the next federal election. You can learn more about their offering by reaching out to Alexander Miceli, Policy Manager, Interactive Advertising Bureau of Canada (policy@iabcanada.com).Presentation recording: IAB Canada’s Issue TrackerPresentation deck: Presentation slide deck The Digital Advertising Alliance of Canada (DAAC) explained their self-regulatory program for transparency in political and issue-based ads. The platform the DAAC offers features a purple icon experience that voters can interact with to find out who delivered the election-based ad to them, and their platform also offers a registry builder that is free for publishers and SSPs to use (fees for DSPs). To get a one-on-one presentation from the DAAC about their easy-to-use program, please contact the DAAC at info@daac.ca.Presentation recording: DAAC’s Political Ads ProgramPresentation deck: Presentation slide deck Our organizations will continue to track any changes to the Canada Elections Act and host other events that may be of interest to this audience.Thank you to those who attended both in-person and online.For further exploration, see Elections Canada’s registry FAQ and the full text of the Canada Elections Act. DAACFebruary 14, 2025 Facebook0 LinkedIn0 0 Likes"
