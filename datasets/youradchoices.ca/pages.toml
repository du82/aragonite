full_description = '''Annual FeesLicensed ParticipationThe Licensed Participation level is for organizations that actively engage in interest-based advertising by directly collecting, using or disclosing personal information for targeted advertising purposes or allowing partners to do so on their owned and controlled properties. This includes the use of cookies, advertising IDs, tokens, probabilistic targeting, and remarketing practices.Supporting LevelThe Supporting Level is a versatile option for ad agencies, law firms, and other organizations that do not directly engage in interest-based advertising but may help other companies do so. This level is ideal for those who want to demonstrate support for our self-regulatory program or who want to link to our tools without participating in our program. Participation Comparison Table table { width: 100%; border-collapse: collapse; } th, td { padding: 15px; text-align: left; border: 1px solid #ddd; } th { background-color: #ffffff; } Feature Licensed Participation Supporting Level Annual Fee based on self-attested gross Canadian revenue. Firms not directly engaged with interest-based advertising would be considered "small business" Large - $9,500 Medium - $4,200 Small - $2,500 Large - $5,500 Medium - $2,500 Small - $1,500 Ideal Businesses Organizations engaging in interest-based advertising (brands, publishers, ad tech) Businesses, advertisers, agencies or any other organization that links to the DAAC's website or tools within their privacy policy but is not a licensed participant Licensed use of the AdChoices icon required for all icon usage in Canada on ads, websites, apps and other devices Included Not included Independent accountability monitoring by Ad Standards Included Not included Link to consumer control tools available in English & French Included Included Privacy policy appraisal focused on interest-based advertising Included Fee-Based Training for staff on the AdChoices program Included Fee-Based Option to join the DAAC's Stakeholder Advisory Group Included Not included Access to Participant's Hub Included Not included Access to AdVantage Insider Newsletter Included Included Priority access to webinars and events Included Included Logo on YourAdChoices.ca participants' page Included Included Discounts for DAA U.S. participants Available as an addendum to the DAA U.S. contract with a discounted rate ($2,917 USD) Not available Click Here to Register'''
