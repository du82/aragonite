["https://youradchoices.ca/fr/actualites/2024/2/7/srie-de-webinaires-entourant-le-10e-anniversaire-de-la-daac"]
title = "Série de webinaires entourant le 10e anniversaire de la DAAC — AdChoices in Canada"
description = "Joignez-vous à l’Alliance de la publicité numérique du Canada (DAAC) alors que nous continuons de célébrer nos dix années d’activité avec notre prochaine série de webinaires.   En réponse aux demandes des participants, la DAAC a le plaisir d’annoncer la tenue d’une série de webinaires qui reprendron"
full_description = "Série de webinaires entourant le 10e anniversaire de la DAAC Joignez-vous à l’Alliance de la publicité numérique du Canada (DAAC) alors que nous continuons de célébrer nos dix années d’activité avec notre prochaine série de webinaires. En réponse aux demandes des participants, la DAAC a le plaisir d’annoncer la tenue d’une série de webinaires qui reprendront les présentations faites lors de l’événement que nous avons tenu en septembre dernier pour célébrer notre 10e anniversaire.Cette série est l’occasion pour vous d’entendre – si vous les avez ratées – d’importantes mises à jour faites par Google, Osler, les Normes de la publicité et plus encore. Ces webinaires sont gratuits. Ne ratez pas la chance d’entendre des chefs de file de l’industrie et d’acquérir de l’information précieuse. Inscrivez-vous aux webinaires de votre choix. Cependant, veuillez noter que ces séances ne sont pas enregistrées; alors, assurez-vous d’y assister en direct. Notez bien ces dates, échangez avec des experts et demeurez au fait de l’évolution du paysage dynamique de la publicité ciblée! Il est à noter que toutes les séances se tiendront en anglais. —Séance no 1 – Le jeudi 29 février, 10 h - 11 h HNE – S’INSCRIRE – Mise à jour sur les technologies de protection de la vie privée dans les produits publicitaires de Google, avec la conférencière Barbara PiermontSéance no 2 – Le jeudi 21 mars, 10 h - 11 h HNE – S’INSCRIRE – Adam Kardash du cabinet Osler, Hoskin & Harcourt donnera un aperçu des attentes réglementaires en 2024 en matière de publicité ciblée par centres d’intérêt Séance no 3 – Le jeudi 25 avril, 10 h - 11 h HNE – S’INSCRIRE – Les Normes de la publicité présenteront une mise à jour de leurs pratiques concernant le volet Responsabilité du programme Choix de pub, et Peter Kosmala vous fera part de ses réflexions sur l’avenir du concept de la vie privée Séance no 4 – Le jeudi 23 mai, 10 h - 11 h HNE – S’INSCRIRE – Venez entendre directement de la DAA et de la DAAC les nouvelles concernant 2024 et au-delà Séance no 5 – Le jeudi 20 juin, 10 h - 11 h HNE – S’INSCRIRE – Comme les États-Unis se préparent à tenir leurs élections législatives et présidentielle en novembre prochain et que le Canada en fait tout autant en vue des prochaines élections fédérales prévues en octobre 2025, le moment est venu de bien comprendre ce dont les éditeurs et les annonceurs doivent tenir compte pour assurer la transparence de la publicité politique. Cette présentation s’avérera des plus pertinentes pour les agences qui aident les annonceurs dans leurs campagnes de publicité politique et de publicité engagée DAACFebruary 8, 2024choix de pub, webinaires, publicité ciblée par centres d’intérêt, privée Facebook0 LinkedIn0 0 Likes"
author = ""
year_published = 2024
year_updated = 2024
