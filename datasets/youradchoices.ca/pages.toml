["https://youradchoices.ca/en/news/2024/4/26/daac-shortlisted-for-piccaso-canada-awards-in-not-for-profit-leadership"]
title = "DAAC Shortlisted for a PICCASO Canada Award in Not for Profit Leadership — AdChoices in Canada"
description = '''The Digital Advertising Alliance of Canada (DAAC) is honoured to announce that we've been shortlisted for the inaugural   PICCASO Canada Awards   in the category of "Not for Profit Leadership."   The PICCASO Canada Awards recognize those who lead the way in privacy, information security, a'''
full_description = '''DAAC Shortlisted for a PICCASO Canada Award in Not for Profit Leadership The Digital Advertising Alliance of Canada (DAAC) is honoured to announce that we've been shortlisted for the inaugural PICCASO Canada Awards in the category of "Not for Profit Leadership." The PICCASO Canada Awards recognize those who lead the way in privacy, information security, and data protection. Being nominated amongst so many other reputable organizations and individuals is a humbling achievement, highlighting the work we've done to promote transparency and accountability in digital advertising.At the DAAC, we believe in fostering a culture of trust between advertisers and consumers. Our programs, such as the AdChoices Program, aim to provide clear and accessible information about online advertising practices, empowering consumers to make informed decisions about their data. This recognition from the PICCASO Canada Awards underscores the importance of our vision and mission and encourages us to continue advocating in this area.We extend our heartfelt thanks to the PICCASO Canada Awards Advisory Board for recognizing our efforts and to our dedicated board of directors, association members, and program participants who have made this nomination a reality. We couldn't have come this far without you.We look forward to the awards ceremony and the opportunity to celebrate with other leaders in the field of privacy and security.https://piccasoawards.ca/short-list DAACApril 26, 2024 Facebook0 LinkedIn0 0 Likes'''
