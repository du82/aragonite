title = "Juridique — AdChoices in Canada"
full_description = "JuridiqueL’Alliance de la publicité numérique du Canada (« DAAC », « nous », « notre ») vous souhaite la bienvenue sur son site Web, à http://youradchoices.ca/fr/ (le « site Web »). Avant d’utiliser ce site, veuillez lire les Conditions d’utilisation suivantes (les « Conditions d’utilisation »). En accédant à ce site Web et en l’utilisant, vous acceptez de vous conformer à toutes les Conditions d’utilisation énoncées aux présentes. Si vous êtes en désaccord avec ces conditions d’utilisation, votre seul recours est de quitter immédiatement ce site. Il est possible de télécharger, de sauvegarder et d’imprimer une copie des Conditions d’utilisation pour votre usage. PROPRIÉTÉ/RESTRICTIONS D’UTILISATIONLe site Web est détenu et exploité par la DAAC. La totalité des contenus, données, tableaux, illustrations, photos, images, bandes audio, vidéos, logiciels, systèmes, processus, marques de commerce, marques de service, noms commerciaux et autre information, y compris mais sans s’y limiter, « l’apparence » du site Web (collectivement, le « contenu ») figurant sur le présent site Web sont la propriété de la DAAC, de ses entreprises affiliées et/ou de concédants tiers. Le contenu est protégé par les lois canadiennes, américaines et internationales sur les droits d’auteur et sur les marques de commerce.Sauf dans la mesure prévue aux présentes, vous ne pouvez modifier, copier, reproduire, publier, transmettre, distribuer, afficher, présenter, créer des œuvres dérivées, transférer ou vendre tout contenu sans avoir obtenu au préalable le consentement écrit et exprès de la DAAC. Vous pouvez télécharger, imprimer et reproduire le contenu à des fins personnelles, informatives et non commerciales, à condition que vous acceptiez de conserver tous les avis de droits d’auteur ou autres avis de propriété y figurant et d’indiquer l’adresse URL de la source d’un tel contenu. Il est strictement interdit de reproduire en plusieurs copies une partie ou la totalité des éléments du contenu à des fins de revente ou de distribution, sans avoir préalablement obtenu l’autorisation écrite de la DAAC. Pour obtenir le consentement écrit pour une telle reproduction, veuillez communiquer avec nous à info@daac.ca. Veuillez noter que les outils de retrait fournis sur le présent site Web sont détenus et exploités par la Digital Advertising Alliance (« DAA ») et sont rendus accessibles sur ce site avec l’autorisation de cette dernière. Par conséquent, la Politique de confidentialité (Privacy Policy) et les Conditions d’utilisation (Terms of Use) s’appliquent à ces outils de retrait. PLAINTES CONCERNANT LES DROITS D’AUTEURNous respectons la propriété intellectuelle d’autrui et nous demandons à nos utilisateurs de faire de même. Si vous avez des raisons de croire que du contenu a été copié et/ou rendu accessible sur le site Web d’une manière qui constitue une violation des droits d’auteur, vous pouvez nous en aviser par courrier électronique à info@daac.ca ou par la poste, au 2238 Dundas St. West, PO Box 59045, Toronto, Ontario, M6R 3B5, et y inclure les renseignements suivants : (i) l’identification du contenu protégé dont le droit d’auteur est présumé avoir été enfreint; (ii) suffisamment d’information raisonnable pour nous permettre de communiquer avec la partie plaignante, telle qu’une adresse, un numéro de téléphone et si possible, une adresse électronique; (iii) une déclaration de la partie plaignante à l’effet qu’elle croit de bonne foi que l’œuvre protégée par un droit d’auteur a été utilisée d’une manière qui n’est pas autorisée par le titulaire du droit d’auteur, son agent ou la loi, et (iv) une déclaration à l’effet que la partie plaignante est autorisée à agir au nom du titulaire d’un droit exclusif qui est prétendument enfreint. HYPERLIENS VERS D’AUTRES SITESNotre but est de vous offrir à vous, nos visiteurs, une valeur ajoutée. Par conséquent, il se peut que le site Web vous offre des hyperliens vers d’autres sites qui sont détenus et exploités par des tiers et qui n’ont aucun lien d’affiliation avec nous. Veuillez comprendre que de tels sites liés sont indépendants de la DAAC et que celle-ci n’exerce aucun contrôle sur leur contenu. Par conséquent, la DAAC ne peut être tenue responsable et ne donne aucune garantie ou ne fait aucune représentation quant à l’exactitude, l’actualité et/ou l’intégrité de l’information qu’ils contiennent.Les liens que nous pourrions intégrer à notre site Web ne sous-entendent pas que nous les commanditons, les approuvons ou que nous y sommes affiliés ou associés ou qu’ils sont autorisés légalement à utiliser les marques de commerce, dénominations commerciales, marques de service, designs, logotypes, symboles ou autre matériel protégé par des droits d’auteur, qui sont affichés ou rendus accessibles sur de tels sites. COMPORTEMENT DE L’UTILISATEURPour pouvoir continuer à accéder à ce site Web et à l'utiliser, vous vous engagez à vous conformer à toutes les lois et à tous les règlements fédéraux, provinciaux, étatiques, territoriaux et autres ainsi qu’au « Code de conduite » décrit ci-après. Plus précisément, sans limiter la portée de ce qui précède, vous consentez à ne pas : a. télécharger, publier, transmettre électroniquement ou autrement tout matériel qui : i. constitue une forme non sollicitée ou non autorisée de publicité, de matériel promotionnel, de « courrier poubelle », de « pourriel », de « chaîne de lettres », de « pyramide » ou toute autre forme de sollicitation;ii. violerait un brevet, une marque de commerce, un secret commercial, des droits d'auteur ou autres droits de propriété et de confidentialité de toute autre partie;iii. serait illégal, nuisible, menaçant, abusif, vexatoire, tortueux, diffamatoire, vulgaire, obscène, calomnieux, constituant une violation de la vie privée d’un tiers, haineux, répréhensible sur le plan racial, ethnique ou autre, ou une comparaison injuste du produit; ouiv. contient toute forme de logiciel destructeur comme un virus, un ver informatique, un cheval de Troie, une bombe à retardement, un robot d’annulation de message ou tout autre élément nuisible ou toute forme de fichier, de programme ou de code informatiques conçus pour interrompre, détruire ou limiter le fonctionnement de logiciels et de matériel informatiques ou d’équipement de télécommunication. b. récupérer, recueillir autrement ou stocker de quelque façon que ce soit de l'information (y compris des renseignements personnels identifiables) sur d’autres utilisateurs du site Web, dont des adresses électroniques, sans le consentement explicite de ces derniers;c. créer de fausses données sur l’identité de l’auteur du message ou son origine dans le but de tromper autrui, falsifier des en-têtes ou manipuler autrement des données menant à l’identification d’autrui afin de cacher l’origine de tout matériel transmis par l’intermédiaire du site Web;d. tenter d’accéder sans autorisation au site Web, à des systèmes informatiques ou à des réseaux connectés au site Web grâce à la recherche de mot de passe ou par tout autre moyen ;e. interférer avec des réseaux ou des serveurs connectés au site Web ou les perturber ou violer la réglementation, les politiques ou les procédures applicables à ces réseaux, etf. utiliser, télécharger, copier autrement ou fournir à une autre personne ou entité un répertoire des utilisateurs du site Web, de l’information (partielle ou entière) sur un autre utilisateur ou sur son utilisation autrement que dans le cadre de votre utilisation du site Web. AVIS D’EXONÉRATION ET DE LIMITE DE RESPONSABILITÉLES LOIS EN VIGUEUR DANS CERTAINES JURISDICTIONS, Y COMPRIS LE QUÉBEC, NE PERMETTENT AUCUNE RESTRICTION OU LIMITATION SUR LES GARANTIES LÉGALES, LES OBLIGATIONS OU CERTAINS DOMMAGES NI AUCUNE LIMITATION SUR LES REPRÉSENTATIONS FAITES DE PRODUITS OU DE SERVICES. SI CES LOIS S’APPLIQUENT À VOUS, IL SE PEUT QU’UNE PARTIE OU LA TOTALITÉ DES EXCLUSIONS OU DES LIMITATIONS CI-DESSOUS NE S’Y APPLIQUENT PAS. BIEN QUE NOUS NOUS EFFORCIONS D'ACTUALISER LE CONTENU DE NOTRE SITE WEB ET D'EN ASSURER AUTANT QUE POSSIBLE L'EXACTITUDE, IL EST POSSIBLE QU'ON Y CONSTATE DES ERREURS ET/OU DES OMISSIONS. PAR CONSÉQUENT, LE PRÉSENT SITE WEB, Y COMPRIS LE CONTENU ET LES SERVICES QUI Y FIGURENT, VOUS EST FOURNI « TEL QUEL » ET « TEL QUE DISPONIBLE », SANS AUCUNE GARANTIE NI CONDITION EXPRESSES OU IMPLICITES. LA DAAC DÉCLINE TOUTES LES GARANTIES ET CONDITIONS, EXPRESSES ET IMPLICITES, Y COMPRIS MAIS SANS S'Y LIMITER, LES GARANTIES ET CONDITIONS IMPLICITES RELATIVES À LA QUALITÉ MARCHANDE, À L’ADAPTATION À UN USAGE PARTICULIER OU À TOUTE AUTRE VIOLATION DES DROITS. LA DAAC NE GARANTIT PAS QUE LES FONCTIONS DE CE SITE WEB SERONT ININTERROMPUES, EXEMPTES D'ERREURS OU EXEMPTES DE VIRUS OU D’AUTRES COMPOSANTS POTENTIELLEMENT NUISIBLES. EN AUCUN CAS LA DAAC NE PEUT ÊTRE TENUE RESPONSABLE DES DOMMAGES DIRECTS, INDIRECTS, ACCESSOIRES, PARTICULIERS OU SECONDAIRES QUI DÉCOULENT DE L’UTILISATION DU SITE WEB OU DE L’IMPOSSIBILITÉ DE L’UTILISER ET DU CONTENU OU DES SERVICES QU’IL OFFRE, ET CE, MÊME SI LA DAAC A ÉTÉ AVISÉE DE LA POSSIBILITÉ DE TELS DOMMAGES. VOUS EXONÉREZ ET LIBÉREZ EXPRESSÉMENT LA DAAC DE TOUTE RESPONSABILITÉ EN CAS DE RÉCLAMATIONS, DE PERTES, D’OBLIGATIONS, DE DOMMAGES, DE PRÉJUDICES ET DE DÉPENSES (Y COMPRIS MAIS SANS S’Y LIMITER LES RÉCLAMATIONS POUR BLESSURES CORPORELLES) DÉCOULANT DE L’UTILISATION DU SITE WEB OU EN LIEN AVEC CELLE-CI.INDEMNISATIONVous acceptez d’indemniser et d’exonérer la DAAC et ses sociétés affiliées ainsi que leurs membres, dirigeants, employés, mandataires et concédants de licence respectifs en cas de pertes, de dépenses, de dommages, de réclamations, d’amendes, de pénalités, de coûts et d’obligations (incluant des frais juridiques et comptables raisonnables) qui découlent de votre utilisation du présent site Web, ou à l’égard de toute violation alléguée de votre part des présentes conditions d’utilisation, y compris mais sans s’y limiter le Code de conduite.Plus spécifiquement, vous acceptez d’indemniser et d’exonérer la DAAC et ses sociétés affiliées ainsi que leurs membres, dirigeants, employés, mandataires, commanditaires et concédants de licence respectifs en cas de préjudice, y compris mais sans s’y limiter les lésions corporelles ou la mort pour vous ou pour tout tiers, pouvant découler de l’utilisation du contenu ou de la confiance accordée à celui-ci.CONFIDENTIALITÉLa DAAC respecte votre droit à la vie privée. Veuillez vous reporter à notre Politique de confidentialité pour plus de détails sur la façon dont nous recueillons, utilisons, divulguons et gérons autrement vos renseignements personnels. Notre Politique de confidentialité est disponible à http://youradchoices.ca/fr/politique-de-confidentialite/. SWEEPSTAKES, CONCOURS ET PROMOTIONS Nous pourrons de temps à autre offrir et/ou co-commanditer des sweepstakes, des concours ou des promotions sur le site Web. Chacune de ces activités sera régie par des règles spécifiques accessibles sur les pages du site Web offrant la promotion ou lorsque vous vous y inscrirez. MODIFICATIONS ET RÉSILIATIONLa DAAC se réserve le droit à tout moment et occasionnellement de modifier ou de mettre fin, temporairement ou de façon permanente, au site Web (ou à une de ses parties), et ce, avec ou sans préavis. De plus, la DAAC se réserve le droit de modifier les présentes Conditions d’utilisation en tout temps et de vous en aviser en affichant sur le site Web une version mise à jour de ces dernières. Il vous incombe de consulter régulièrement les Conditions d’utilisation, y compris mais sans s’y limiter la date de la « Dernière mise à jour » qui figure au bas du présent document. L’utilisation continue du site Web après de telles modifications constitue un consentement de votre part à être lié par ces modifications; en contrepartie de cet engagement, la DAAC continue à vous fournir l’accès au site Web. Votre seul droit, si vous êtes mécontent (1) de ces Conditions d’utilisation, (2) d’une de nos politiques ou pratiques d’exploitation du site Web ou (3) d’un contenu offert sur le site Web, est de cesser de consulter et d’utiliser le site Web.MARQUES DE COMMERCELa « DAAC » et « http://youradchoices.ca/fr/ » sont des marques de commerce de la DAAC. Les autres marques, graphiques, types de caractère, marques de commerce et logotypes qui figurent sur le site Web sont des marques de commerce ou des habillages commerciaux de la DAAC. Toutes les autres marques de commerce figurant sur le site Web appartiennent à leurs propriétaires respectifs. Il est interdit d’utiliser nos marques de commerce ou nos habillages commerciaux de quelque manière que ce soit et à quelque fin que ce soit sans notre autorisation écrite expresse. LOIS APPLICABLESLes présentes Conditions d’utilisation sont régies et interprétées conformément aux lois de la province de l’Ontario et du Canada, et tout litige doit être soumis aux tribunaux compétents du district judiciaire de Toronto, dans la province de l’Ontario, sauf si les lois applicables de votre territoire de compétence, comme le Québec, exigent que les lois du territoire en question régissent les conditions. Si une disposition de ces Conditions d’utilisation est illégale, nulle ou, pour quelque raison que ce soit, non exécutoire, elle doit être dissociée de cette entente sans porter atteinte à la validité et au caractère exécutoire des autres dispositions. Une version imprimée des présentes Conditions d’utilisation et de tout avis connexe donné électroniquement sera admissible dans le cadre de procédures judiciaires ou administratives, dans la même mesure et aux mêmes conditions que d’autres documents et dossiers de nature commerciale, produits et conservés initialement sous forme imprimée. Vous consentez à n’entamer une poursuite qu’en tant que particulier et à ne pas entamer de recours collectif ni à y participer.Les présentes Conditions d’utilisation et tous les autres avis ou déclarations de nature juridique affichés sur notre site Web représentent l’intégralité de l’entente qui vous lie à la DAAC relativement à l’utilisation du site Web, y compris son contenu. POUR NOUS JOINDREPour toute question ou pour tout commentaire concernant les présentes Conditions d’utilisation, veuillez communiquer avec nous à info@daac.caDernière mise à jour : le 6 janvier 2023"
