["https://youradchoices.ca/fr/actualites/2022/4/26/rapport-de-conformit-2021"]
title = "Rapport de conformité 2021 — AdChoices in Canada"
description = "Les Normes de la publicité publiaient plus tôt aujourd’hui le  Rapport de conformité 2021 – Programme de responsabilité Choix de pub .   Les Normes de la publicité travaillent sans lien de dépendance avec la&nbsp;DAAC dans le but d’assurer la conformité des participants avec les principes de la"
full_description = "Rapport de conformité 2021 Les Normes de la publicité publiaient plus tôt aujourd’hui le Rapport de conformité 2021 – Programme de responsabilité Choix de pub. Les Normes de la publicité travaillent sans lien de dépendance avec la DAAC dans le but d’assurer la conformité des participants avec les principes de la DAAC. Ce 7e Rapport de conformité décrit la façon dont les entreprises participantes ont respecté et ont mis en œuvre les principes du programme Choix de pub au cours de 2021. Globalement, la conformité avec les principes demeure élevée et le mécanisme de traitement des plaintes du Programme de responsabilité démontre que le programme est devenu une référence pour les consommateurs qui peuvent soumettre leurs questions et obtenir de l’aide en matière de publicité ciblée. Des 647 plaintes reçues au cours de 2021, seulement 28 ont été jugées comme enfreignant éventuellement les principes en matière de publicité ciblée par centres d’intérêt. Bon nombre des problèmes mentionnés ont porté sur les mécanismes de retrait. Les Normes de la publicité ont récemment mis à jour leur site Web pour y inclure les ressources qu’elles avaient l’habitude de joindre à leur rapport en tant qu’annexes. Ces ressources sont désormais facilement accessibles ici : https://adstandards.ca/fr/profil/programme-de-responsabilite-choix-de-pub/Les participants sont invités à lire le rapport pour mieux comprendre ce que l’on attend d’eux en matière de conformité avec le programme. Pratiques exemplaires à l’intention des participants : Utilisez une approche « par couches » ainsi que des termes faciles à comprendre dans les avis.Lorsque vous recourrez à un prestataire de services pour vos avis sur la publicité ciblée par centres d’intérêt, personnalisez l’expérience de façon à la rendre plus claire et plus simple pour le consommateur afin qu’il comprenne bien les choix qui s’offrent à lui. Travaillez-vous avec un nouveau partenaire publicitaire? Les propriétaires de sites/d’applications doivent s’assurer que toutes les nouvelles parties figurent dans la liste de retrait et doivent vérifier cette liste fréquemment en regard des outils offerts. Désignez un responsable au sein de votre organisation, qui traitera des questions de conformité avec Choix de Pub. Nous recommandons aux grandes entreprises de constituer un comité composé de représentants de divers services (juridique, marketing) pour gérer le programme. L’autoréglementation signifie que les participants doivent prendre l’initiative lorsqu’il s’agit de leurs responsabilités. Ils doivent s’assurer que l’information qu’ils fournissent aux Normes de la publicité est complète et exacte. Prenez le temps de revoir les principes et les documents d’orientation de la DAAC afin de mieux comprendre vos obligations et n’hésitez pas à communiquer avec les Normes de la publicité pour discuter de changements éventuels à apporter à vos sites Web ou à vos applications mobiles pour savoir s’ils ont un impact sur la conformité avec le programme. La DAAC s’engage à veiller à ce que le programme d’autoréglementation demeure une solution efficace pour les consommateurs, qui leur permet de communiquer directement avec l’industrie de la publicité en ligne pour toute question ou pour toute inquiétude concernant la publicité ciblée. Lire de Rapport de conformité DAACApril 26, 2022 Facebook0 LinkedIn0 0 Likes"
