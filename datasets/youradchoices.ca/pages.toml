h permission of the DAA. As a result, the DAA’s Privacy Policy and Terms of Use apply to the opt-out tools.COPYRIGHT COMPLAINTSWe respect the intellectual property of others, and we ask our users to do the same. If you have reason to believe that any Content has been copied and/or is accessible on the Website in a way that constitutes copyright infringement, you may notify us by email at info@daac.ca or by mail to 2238 Dundas St. West, PO Box 59045, Toronto, Ontario, M6R 3B5, and include the following information: (i) identification of the copyrighted Content claimed to be infringing; (ii) information reasonably sufficient to enable us to contact the complaining party, such as an address, telephone number, and if available, an email address at which the complaining party may be contacted; (iii) a statement that the complaining party has a good faith belief that use of the copyrighted work in the manner complained of is not authorized by the copyright owner, its agent, or the law; and (iv) a statement that the complaining party is authorized to act on behalf of the owner of an exclusive right that is allegedly infringed.LINKINGIt is our goal to provide increased value to you, our visitors. Therefore, the Website might offer you links to other sites on the Internet that are owned and operated by third parties and therefore not affiliated with us. Please understand that such linked websites are independent from DAAC and that DAAC has no control over the content of such websites. Consequently, DAAC cannot be held liable and makes no warranty or representation whatsoever as to the accuracy, timeliness and/or completeness of the information contained on such websites.The links that we might place on our Website do not imply that we sponsor, endorse or are affiliated or associated with, or have been legally authorized to use any trademark, trade name, service mark, design, logo, symbol or other copyrighted materials displayed on or accessible through such sites.USER CONDUC