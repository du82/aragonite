["https://youradchoices.ca/fr/sinscrire"]
title = "Comment participer au programme? — AdChoices in Canada"
description = """
La participation au programme comporte un processus en 4 étapes. Lisez 
ci-après les étapes requises avant de remplir l’inscription"""
full_description = '''Scroll Participation à Choix de pubLa participation au programme AdChoices répond aux besoins essentiels de l'entreprise :Facilite l'harmonisation avec la réglementation sur la confidentialité.Renforce la confiance des consommateurs en leur offrant une transparence et un contrôle centralisés.Protège la réputation de votre marque en tant qu'entreprise citoyenne responsable.Démontre votre engagement envers une autoréglementation efficace en matière de confidentialité, à l’appui des principes et des meilleures pratiques en matière de publicité responsable et basée sur les intérêts.Améliore l’intégrité globale de l’organisation.Grâce à AdChoices, les entreprises ont accès à des ressources précieuses, économisant du temps et des erreurs humaines et gérant facilement les relations avec les fournisseurs. Formulaire d’inscription La DAAC est la fière récipiendaire d’un prix PICCASO Canada 2024 dans la catégorie « Leadership à but non lucratif » Droits et inscriptionParticipation Sous LicenceLe niveau de Participation Sous Licence s'adresse aux organisations qui s'engagent activement dans la publicité basée sur les intérêts en collectant, utilisant ou divulguant directement des informations personnelles à des fins de publicité ciblée ou en permettant à des partenaires de le faire sur leurs propriétés détenues et contrôlées. Cela inclut l'utilisation de cookies, d'ID publicitaires, de jetons, de ciblage probabiliste et de pratiques de remarketing.Niveau de SoutienLe Niveau de Soutien est une option polyvalente pour les agences de publicité, les cabinets d'avocats et d'autres organisations qui ne s'engagent pas directement dans la publicité basée sur les intérêts mais peuvent aider d'autres entreprises à le faire. Ce niveau est idéal pour ceux qui veulent démontrer leur soutien à notre programme d'autorégulation ou qui souhaitent lier leurs outils à nos outils sans participer à notre programme. Tableau Comparatif table { width: 100%; border-collapse: collapse; } th, td { padding: 15px; text-align: left; border: 1px solid #ddd; } th { background-color: #ffffff; } Caractéristique Participation Sous Licence Niveau de Soutien Frais Annuels basé sur le revenu brut canadien auto-déclaré. Les entreprises qui ne s'engagent pas directement dans la publicité basée sur les intérêts seraient considérées comme des "petites entreprises" Grande - 9 500 $ Moyenne - 4 200 $ Petite - 2 500 $ Grande - 5 500 $ Moyenne - 2 500 $ Petite - 1 500 $ Entreprises idéales Organisations s'engageant dans la publicité basée sur les intérêts (marques, éditeurs, ad tech) Entreprises, annonceurs, agences ou toute autre organisation qui renvoient au site web ou aux outils de l'DAAC dans leur politique de confidentialité mais qui ne sont pas des participants agréés Utilisation Sous Licence de l'icône AdChoices requise pour toute utilisation de l'icône au Canada sur les publicités, sites web, applications et autres dispositifs Incluse Non incluse Suivi indépendant de la responsabilité par Ad Standards Inclus Non inclus Lien vers les outils de contrôle des consommateurs disponibles en anglais et en français Inclus Inclus Évaluation de la politique de confidentialité axée sur la publicité basée sur les intérêts Incluse Basé sur des frais Formation du personnel sur le programme AdChoices Incluse Basé sur des frais Option de rejoindre le Groupe Consultatif des Parties Prenantes du DAAC Incluse Non incluse Accès au Hub des Participants Inclus Non inclus Accès à la Newsletter AdVantage Insider Incluse Incluse Accès prioritaire aux webinaires et événements Inclus Inclus Logo sur la page des participants de YourAdChoices.ca Inclus Inclus Réductions pour les participants du DAA U.S. Disponible en tant qu'avenant au contrat du DAA U.S. avec un tarif réduit (2 917 USD) Non disponible CommencerÉtape 1 : Apprendre comment mettre en œuvre les principesLes entreprises intéressées à participer au programme d’autoréglementation Choix de pub doivent apprendre comment mettre en œuvre les principes de la DAAC. Pour vous aider à déterminer ce dont vous aurez besoin au sein de votre organisation pour vous conformer, veuillez examiner les différentes possibilités ci-dessous, en fonction des pratiques commerciales de votre entreprise en matière de publicité ciblée par centres d’intérêt. Rappelez-vous que votre entreprise peut représenter l’un ou tous les types d’entités décrits, selon la façon dont vous recueillez ou utilisez les données à des fins de publicité ciblée par centres d’intérêt. FAQ à l’intention des entreprises Prestataires de siteUn propriétaire de site est un éditeur ou un exploitant de site Web qui permet la collecte ou l’utilisation de données à des fins de publicité ciblée par centres d’intérêt en ligne sur son site. Les propriétaires de site doivent inclure sur la page Web ou dans l’application un avis à ce sujet à l’intention des consommateurs; cet avis doit être situé au-dessus de la ligne de flottaison de la page Web ou être affiché autrement pour être bien en évidence, notamment à l’aide d’une fenêtre flash (pop-up). Responsabilités des propriétaires de site TiersSont considérés comme tiers un réseau publicitaire, une plateforme DSP, un bureau d’échange ou une entreprise de données (y compris les échanges d’espaces publicitaires et les agrégateurs de données) et dans certains cas, les annonceurs. Responsabilités des tiers Prestataires de servicesUn prestataire de services est un fournisseur d’accès Internet (FAI), un moteur de recherche, une barre d’outils Web, un navigateur ou tout autre service qui lui permet d’avoir accès à toutes ou presque toutes les adresses URL auxquelles ont accédé ses utilisateurs. Les prestataires de services recueillent et utilisent, dans le cadre de leurs activités, des données sur les utilisateurs à des fins de publicité ciblée par centres d’intérêt en ligne et doivent par conséquent assumer des obligations distinctes en vertu des principes de la DAAC. Responsabilités des prestataires de services Étape 2 : S’inscrire pour utiliser l’icôneL’icône Choix de pub (illustrée ci-contre en bleu) est un élément essentiel du programme de la DAAC portant sur la publicité ciblée par centres d’intérêt en ligne.Les entreprises qui participent au programme peuvent utiliser l’icône ainsi que la mention « Choix de pub »/« AdChoices » pour informer les internautes de la collecte et de l’utilisation de données à des fins de publicité ciblée par centres d’intérêt en ligne et pour leur indiquer qu’elles adhèrent aux principes de la DAAC régissant ce type de publicité.Si votre entreprise souhaite se procurer l’icône afin de l’utiliser conformément aux principes, veuillez consulter notre page d’inscription des entreprises. Inscrivez-vous dès aujourd’hui Étape 3 : Tiers: Adhérer aux outilsNos outils offrent aux consommateurs des choix centralisés à l’échelle de l’industrie. Les tiers qui font de la publicité ciblée par centres d’intérêt en ligne sont invités à figurer dans les outils de retrait que nous offrons sur notre Page de retrait des consommateurs, et grâce auxquels ces derniers peuvent facilement refuser les publicités ciblées par centres d’intérêt en ligne provenant d’une partie ou de la totalité des entreprises participantes.Veuillez noter que des droits distincts, facturés par la DAA, s’appliquent pour participer aux outils de retrait. Les propriétaires de site qui ne recueillent pas directement de renseignements personnels à des fins de publicité ciblée par centres d’intérêt, mais qui travaillent avec des tiers qui en recueillent, doivent fournir dans leurs avis aux consommateurs des hyperliens qui pointent vers les outils de la DAAC. Nous encourageons fortement les propriétaires de site à soutenir ces outils en participant au programme d’autoréglementation.Étape 4 : Déterminer s’il faut avoir recours à un prestataire approuvé La DAAC a approuvé deux prestataires de services pour aider les entreprises à présenter l’icône Choix de pub et à se conformer à ses principes. Ces prestataires approuvés ont été validés et approuvés en raison de la technologie qu’ils utilisent et de leur façon standardisée d’adhérer aux principes de la DAAC. Le recours à un prestataire approuvé est laissé à votre discrétion et dépend uniquement des besoins de votre entreprise. Crownpeak TrustArc Comment participer au programme? Droits et inscription Étape'''
year_published = 2024
year_updated = 2024
