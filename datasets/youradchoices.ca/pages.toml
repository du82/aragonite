["https://youradchoices.ca/fr/politique-de-confidentialite"]
title = "Politique de confidentialité — AdChoices in Canada"
full_description = "Politique de confidentialité Date d’effet : le 6 janvier 2023La présente Politique de confidentialité explique la façon dont l’Alliance de la publicité numérique du Canada (DAAC) recueille et utilise les renseignements personnels que vous nous fournissez en vue de vous aider à prendre des décisions éclairées lorsque vous utilisez notre site Web (« site ») et l’application mobile AppChoices (« l’application »), appelés collectivement « nos propriétés numériques ». Veuillez lire l’intégralité de la Politique de confidentialité avant d’utiliser nos propriétés numériques. Si vous n’acceptez pas les modalités de cette politique, vous ne devez pas utiliser nos propriétés numériques. La présente Politique de confidentialité est expressément incluse dans les Conditions de service de l’application et dans les Conditions d’utilisation du site qui régissent votre utilisation de nos propriétés numériques.L’information que nous recueillonsL’expression « renseignements personnels » signifie des renseignements sur une personne identifiable. Lorsque vous consultez ou que vous utilisez nos propriétés numériques, nous pourrions recueillir trois types de renseignements personnels :Les renseignements personnels que vous choisissez sciemment de nous fournir, comme votre nom, votre adresse postale et votre adresse électronique. Vous pourriez soumettre ces renseignements notamment lorsque vous présentez une demande d’information ou d’aide, lorsque vous complétez un sondage ou lorsque vous acceptez de recevoir un bulletin électronique ou toute autre communicationNous recueillons également de l’information, y compris mais sans s’y limiter, le type de navigateur, l’adresse IP, le type d’appareil mobile et l’identifiant, la résolution d’écran, le système d’exploitation, la date et l’heure de la visite ou de l’utilisation, les pages consultées sur le site et les sections auxquelles vous accédez dans l’application, le temps passé à consulter nos propriétés numériques, et les visites de retour sur ces dernières.Des renseignements regroupés lorsque vous et d’autres personnes naviguez et utilisez nos propriétés numériques.Utilisation des renseignementsNous pourrions utiliser les renseignements que nous recueillons auprès de vous notamment pour :répondre à vos questions et à vos demandes;exploiter nos propriétés numériques et améliorer votre expérience;identifier des menaces potentielles à la sécurité du site et des applications ou y remédier;mener des recherches au sujet de votre utilisation de nos propriétés numériques et de nos services;respecter vos choix de retrait, ettoute autre raison indiquée au moment de la collecte des renseignements.Partage de renseignements avec des tiersGrâce à nos propriétés numériques, vous pouvez exercer un choix concernant certaines pratiques en matière de données d’entreprises qui participent aux outils de retrait que nous fournissons. Lorsque vous exercez vos choix, nous pourrions communiquer certains renseignements recueillis auprès de vous, de votre ordinateur ou de votre appareil mobile à ces entreprises afin qu’elles puissent honorer vos demandes concernant leurs pratiques de collecte de données. De plus, nous pourrions communiquer vos renseignements aux prestataires de services qui peuvent nous aider à répondre à vos demandes ou qui remplissent autrement certaines fonctions commerciales ou opérationnelles en notre nom. Nous pourrions également fournir vos renseignements personnels en réponse à une mise en demeure ou à toute autre requête légale valide, y compris mais sans s’y limiter, une demande de perquisition, une citation à comparaître ou un ordre de la cour; à une autre organisation à des fins d’enquête par suite de la violation d’un accord ou d’une infraction aux lois canadiennes, ou à des fins de détection, de suppression ou de prévention des fraudes; à une autre organisation en lien avec une transaction commerciale future ou actuelle, ainsi qu’aux fins indiquées au moment de la collecte des renseignements.Outil de retrait de la DAALes outils de retrait (appelés aussi « mécanismes de retrait ») figurant sur le site ont été créés et sont exploités par la Digital Advertising Alliance (« DAA ») aux États-Unis et sont rendus accessibles sur le site Web avec l’autorisation de cette dernière. Ces outils de la DAA sont régis par la Politique de confidentialité (Privacy Policy) et par les Conditions d’utilisation (Terms of Use) de la DAA. Toute information que vous fournissez à la DAA au moyen de ces outils de retrait n’est pas transmise à la DAAC.SécuritéNous mettons en œuvre des mesures administratives, techniques et physiques raisonnables afin de protéger les renseignements personnels qui sont en notre possession et sous notre contrôle contre le vol, la perte et l’accès, l’utilisation, la modification et la divulgation non autorisés.Hyperliens vers des sites tiersNos propriétés numériques peuvent contenir des liens vers d’autres sites Web exploités par des tiers sur lesquels nous n’avons aucun contrôle. La présente Politique de confidentialité s’applique uniquement aux renseignements recueillis par l’entremise de nos propriétés numériques. Nous vous encourageons à lire les énoncés de confidentialité de ces autres sites Web.Accès aux renseignements personnels et correctionsVous avez le droit d’accéder à vos renseignements personnels qui sont en notre possession ou sous notre contrôle et de les mettre à jour et de corriger les erreurs qu’ils contiennent, sous réserve de certaines exceptions prévues par la loi. Vous pouvez demander l’accès aux renseignements personnels qui sont en notre possession et sous notre contrôle, leur mise à jour et la correction d’erreurs qu’ils contiennent en communiquant avec nous par courrier électronique aux coordonnées figurant ci-dessous. Nous pourrons vous demander certaines données personnelles afin de vérifier l’identité de la personne qui cherche à accéder à ses dossiers personnels.Changements apportés à notre Politique de confidentialitéSi besoin est, nous pourrons modifier la présente Politique de confidentialité. Nous vous aviserons de tout changement important apporté à notre Politique de confidentialité en affichant toute politique mise à jour sur la présente page. Nous vous encourageons à consulter fréquemment cette section pour demeurer informé.Nous joindreSi vous avez des questions au sujet de la présente Politique de confidentialité, veuillez nous contacter à info@daac.ca."
year_published = 2023
year_updated = 2024
