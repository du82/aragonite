["https://youradchoices.ca/en/news/2022/6/10/daac-board-of-directors-announcement"]
title = "DAAC Board of Directors Announcement — AdChoices in Canada"
description = "The Digital Advertising Alliance of Canada’s mission is to establish and enforce responsible privacy practices across the industry for relevant digital advertising, provide consumers with enhanced transparency and control, and engender trust in the marketing and advertising industry by consumers and"
full_description = "DAAC Board of Directors Announcement The Digital Advertising Alliance of Canada’s mission is to establish and enforce responsible privacy practices across the industry for relevant digital advertising, provide consumers with enhanced transparency and control, and engender trust in the marketing and advertising industry by consumers and other stakeholders.This multipronged and vital mission means we need the best minds at the table driving the output of the programs operated by the DAAC. To that end, we are excited to announce that we have confirmed the slate of board directors for 2022-2023. The directors are:Jill BriggsSara ClodmanJulie CourtemancheAdam KardashScott KnoxRon LundCaroline MoulIsabel PoirierCaroline Moul was nominated to the role of Chair, taking the reins from Ron Lund, who held the office since 2018 but will remain on the board as a director. Julie Courtemanche resumes her role as Treasurer.Appointing a solid board of directors is critical now with Canadian privacy laws changing.The Canadian AdChoices program, developed by the DAAC, was designed to educate consumers about interest-based advertising (IBA) and provide notices for consumers to know when IBA is occurring. Through the program, consumers can control whether or not to permit the collection and use of their browsing & app data for IBA purposes.The DAAC is responsible for the program's operations in Canada, often coordinating with other global DAA organizations running similar self-regulatory programs in the US and across Europe.To learn more about the program and for companies to join it, visit YourAdChoices.ca. DAACJune 10, 2022board of directors, board, DAAC, AdChoices, 2022 Facebook0 LinkedIn0 0 Likes"
