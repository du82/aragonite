title = "DAAC 10-Year Celebration Webinar Series — AdChoices in Canada"
description = "Join the Digital Advertising Alliance of Canada (DAAC) as we continue to celebrate ten years of operations with our upcoming webinar series.   In response to requests from participants, the DAAC is pleased to announce a webinar series to revisit presentations delivered at our 10-year celebratory eve"
full_description = "DAAC 10-Year Celebration Webinar Series Join the Digital Advertising Alliance of Canada (DAAC) as we continue to celebrate ten years of operations with our upcoming webinar series.In response to requests from participants, the DAAC is pleased to announce a webinar series to revisit presentations delivered at our 10-year celebratory event held last September.This series is an opportunity to catch up on crucial updates from Google, Osler, Ad Standards, and more.These webinars are free to attend. Don’t miss out on the chance to hear from industry leaders and gain valuable insights. Register for the webinars of your choice, but please note that these sessions will not be recorded, so be sure to attend the sessions live.Save the dates, engage with experts, and stay ahead in the dynamic landscape of targeted advertising!—Session #1 – Thursday, February 29, 10-11 am EST – REGISTER – An update on privacy-preserving technologies in Google's ads products with speaker Barbara PiermontSession #2 – Thursday, March 21, 10-11 am EST – REGISTER – Adam Kardash of Osler, Hoskin & Harcourt will provide an update on regulatory expectations relevant to interest-based advertising in 2024Session #3 – Thursday, April 25, 10-11 am EDT – REGISTER – Ad Standards will provide an update on their AdChoices accountability practices, and Peter Kosmala will provide his thoughts on the future of privacy constructsSession #4 – Thursday, May 23, 10-11 am EDT – REGISTER – Hear directly from the DAA and DAAC as to news for 2024 and beyondSession #5 – Thursday, June 20, 10-11 am EDT – REGISTER – As the US gears up for its presidential and general election in November and Canada prepares for a federal election next Fall (scheduled for Oct 2025), now is the time to get a better understanding of what publishers and advertisers need to consider to help ensure political ad transparency. DAACFebruary 8, 2024webinars, AdChoices, PoliticalAds, interest-based advertising, privacy, educational 