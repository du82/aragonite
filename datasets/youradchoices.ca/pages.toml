["https://youradchoices.ca/fr/outils"]
title = "Des outils conçus pour vous — AdChoices in Canada"
description = """
Nos outils vous permettent de refuser la publicité ciblée par centres 
d’intérêt provenant d’entreprises inscrites au programme ChoixDePub."""
full_description = "Scroll Des outils conçus pour vousChoix de pub vous ouvre une fenêtre sur le monde de la publicité en vous permettant de savoir qui s’adonne à la publicité ciblée par centres d’intérêt sur vos navigateurs et sur vos appareils mobiles.De plus, nos outils vous permettent de refuser la publicité ciblée par centres d’intérêt d’entreprises inscrites à notre organisme sans but lucratif.Choix de pub n’est pas un bloqueur de publicité. Le processus de retrait ne vous permet pas de refuser l’ensemble des publicités qui vous sont présentées, mais uniquement les publicités ciblées par centres d’intérêt. Vous continuerez de recevoir des publicités après votre retrait; elles ne seront juste plus pertinentes à vos centres d’intérêt. Choix de pub n’est pas une agence de publicité. Nous ne contrôlons pas le contenu de publicités spécifiques, ni l’endroit où elles sont placées ou la fréquence à laquelle vous les voyez. Choix de pub permet plutôt aux utilisateurs de contrôler la façon dont les entreprises utilisent leurs données pour personnaliser les publicités en fonction des centres d’intérêt perçus.Voir ci-dessous les nombreux outils que nous vous offrons. WebChoicesWebChoices est un outil pour les navigateurs qui vous permet de refuser la publicité ciblée par centres d’intérêt. Lancez l’outil WebChoices pour gérer vos préférences communes sur vos navigateurs Web. Chaque navigateur que vous utilisez peut donner des résultats différents selon les témoins qui sont utilisés. Lancer l’outil WebChoices ATTENTION utilisateurs de Safari – La prévention intelligente du traçage (Intelligent Tracking Prevention) d’Apple limite notre capacité à respecter les demandes de retrait comme nous le faisions auparavant. Bien que les retraits continuent de fonctionner, ils ont une durée de vie limitée. Aussi, à moins de vérifier périodiquement à l’aide de notre outil WebChoices, les témoins de retrait seront supprimés par Apple. Entre-temps, vous pouvez modifier vos réglages de façon à ce que les témoins tiers soient acceptés, puis ensuite les refuser à l’aide de l’outil WebChoices. AppChoicesAppChoices est un outil pour les appareils mobiles qui vous permet de refuser la publicité ciblée par centres d’intérêt dans toutes vos applications. Sélectionnez le système d’exploitation pour gérer vos préférences communes sur votre appareil mobile. AppChoices n’empêche pas la présentation de publicités sur votre appareil. Elle met fin au ciblage de la publicité en fonction de vos centres d’intérêt, qui se produit en arrière-plan par les entreprises inscrites. Apple Android Amazon Outil Jeton d’identitéCertaines entreprises utilisent des identifiants de jeton pour la publicité ciblée par centres d'intérêt. Vous pouvez désactiver cette pratique à l'aide de notre outil Choix fondés sur le jeton d’identité.Veuillez noter que tout identifiant soumis à l’aide de cet outil, comme une adresse électronique, ne pourra permettre le refus d’abonnements par courrier électronique, d’autres services par courrier électronique ou d’autres utilisations de l’identifiant que vous avez fourni et grâce auquel vous vous êtes inscrit ou vous recevez des communications. Lancer l’outil Jeton d’identité Outil Jeton d’identité - FAQ Protéger mes choixCet outil préserve les préférences de retrait que vous avez établies sur votre navigateur. La DAAC offre des modules d’extension de navigateur destinés à protéger vos préférences de retrait, même lorsque vous supprimez vos témoins. Chrome Firefox Témoins et contrôles du navigateurLa plupart des navigateurs actuels comportent des contrôles étendus qui vous permettent d’exercer vos choix en matière de protection de la vie privée; ils vous permettent de bloquer ou de limiter les témoins. Chrome Edge Firefox Internet Explorer Opera Safari Des outils conçus pour vous WebChoices AppChoices Outil jeton Protéger mes choix Témoins et contrôles du navigateur"
