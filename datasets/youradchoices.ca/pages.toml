["https://youradchoices.ca/fr/au-sujet-du-programme"]
title = "Principes de la DAAC au sujet de — AdChoices in Canada"
description = """
Les principes canadiens d’autoréglementation du programme Choix de pub ont 
été établis par l’Alliance de la publicité numérique du Canada."""
full_description = "Scroll Principes de la DAAC concernant la publicité ciblée par centres d’intérêt en ligne Les principes canadiens d’autoréglementation de la publicité comportementale en ligne (aussi connus sous le nom de principes du programme Choix de pub) ont été établis par l’Alliance de la publicité numérique du Canada (DAAC), conjointement avec d’autres programmes mondiaux, dans le but d’appliquer à la publicité ciblée par centres d’intérêt en ligne diffusée sur l’ensemble du Web des normes qui sont favorables aux consommateurs.Ces principes ont été élaborés dans le but de préserver l’écosystème robuste et novateur de la publicité, qui soutient la vaste gamme de contenus en ligne disponibles au Canada de même que la capacité à présenter des publicités pertinentes aux consommateurs, et ce, d’une manière qui soit conforme aux lois canadiennes régissant la protection de la vie privée. Principes de la DAAC Les principesÉducationParticiper à des efforts visant à éduquer les consommateurs sur la publicité ciblée par centres d’intérêt en ligne.Avis et transparenceFournir aux consommateurs un avis clair, explicite et bien visible sur les pratiques de collecte et d’utilisation des données liées à la publicité ciblée par centres d’intérêt en ligne.Contrôle par le consommateurOffrir aux consommateurs la possibilité de choisir s’ils souhaitent ou non que des données soient recueillies et utilisées à des fins de publicité ciblée par centres d’intérêt en ligne.Sécurité des renseignementsAdopter des mesures de sécurité adéquates pour les données recueillies et utilisées à des fins de publicité ciblée par centres d’intérêt en ligne et pour la conservation de ces dernières pendant une durée limitée.Renseignements sensiblesNe pas recueillir, à des fins de publicité ciblée par centres d’intérêt en ligne, de renseignements personnels auprès d’enfants de moins de 13 ans ou sur des sites qui s’adressent aux enfants de moins de 13 ans, à moins qu’une telle collecte et tout autre traitement de ces renseignements personnels ne se fassent conformément aux lois canadiennes régissant la protection de la vie privée.Il est également interdit aux entités de recueillir ou d’utiliser des renseignements personnels sensibles à des fins de publicité ciblée par centres d’intérêt en ligne sans consentement.ResponsabilitéEn vertu du principe de responsabilité, les Normes de la publicité – organisme indépendant d’autoréglementation de la publicité – vérifient la conformité des entreprises qui participent au programme d’autoréglementation Choix de pub avec les principes établis et travaillent en étroite collaboration avec elles pour les aider à s’y conformer. Les Normes de la publicité acceptent également les plaintes – et y répondent – concernant les pratiques qui semblent ne pas être conformes aux principes. Icône Choix de pub/AdChoices – Choix de pub Vos responsabilitésLes principes comportent des dispositions distinctes pour les propriétaires de site, pour les tiers et pour les prestataires de services qui font de la publicité ciblée par centres d’intérêt. Par conséquent, différents principes et différents types d’avis et de choix peuvent s’appliquer à chaque type d’entreprise et d’activité. En outre, une entreprise peut représenter une ou plusieurs de ces entités selon ses pratiques commerciales.La DAAC recommande d’examiner les responsabilités de chaque type d’entité afin de déterminer la meilleure façon de mettre en œuvre le programme au sein de votre organisation. Résumé imprimable Information pour les propriétaires de site Information pour les tiers Information pour les prestataires de services Lexique des termes du programme Principes de la DAAC concernant la publicité ciblée par centres d’intérêt en ligne Copy of The Principles Copy of Your Responsibilities"
year_published = 2024
year_updated = 2024
