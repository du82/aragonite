["https://youradchoices.ca/fr/actualites/2024/4/23/faits-saillants-en-2023-rapport-de-conformit-en-vertu-du-programme-de-responsabilit-choix-de-pub"]
title = "Faits saillants en 2023 – Rapport de conformité en vertu du Programme de responsabilité Choix de pub — AdChoices in Canada"
description = "L’Alliance de la publicité numérique du Canada (DAAC) a le plaisir de vous présenter les faits saillants du   Rapport de conformité 2023 des Normes de la publicité en vertu du Programme de responsabilité Choix de pub  . Nos efforts collectifs visant à accroître la protection de la vie privée des con"
full_description = "Faits saillants en 2023 – Rapport de conformité en vertu du Programme de responsabilité Choix de pub L’Alliance de la publicité numérique du Canada (DAAC) a le plaisir de vous présenter les faits saillants du Rapport de conformité 2023 des Normes de la publicité en vertu du Programme de responsabilité Choix de pub. Nos efforts collectifs visant à accroître la protection de la vie privée des consommateurs en matière de publicité numérique ont progressé de manière significative, grâce entre autres aux efforts assidus de tous les participants.Principales conclusions :De tous les participants, 80 % ont rempli et ont retourné le tout nouveau Formulaire d’autocertification en matière de responsabilité (en vigueur depuis 2023) qui constitue une étape cruciale pour vérifier l’adhésion aux principes de la DAAC nouvellement mis à jour en matière de publicité ciblée par centres d’intérêt. Cet engagement envers la transparence constitue la pierre angulaire du programme Choix de pub. En 2023, les Normes de la publicité ont reçu 525 plaintes de consommateurs, soit une baisse marquée par rapport à l’année précédente (626 en 2022). De ces plaintes, 25 ont porté sur la publicité ciblée par centres d’intérêt, et les consommateurs ont reçu les directives nécessaires pour régler les problèmes rencontrés. La formation continue qu’offrent les Normes de la publicité sur les pratiques en matière de publicité ciblée par centres d’intérêt de même que l’importance accordée à la transparence jouent un rôle central, assurant ainsi que les consommateurs sont bien informés quant à la façon dont leurs données sont utilisées à des fins publicitaires. Le Rapport de conformité 2023 met l’accent sur l’importance du Formulaire d’autocertification pour assurer l’intégrité du programme Choix de pub. Bien que la conformité globale ait fléchi légèrement en raison de la nouvelle exigence concernant ce formulaire, l’engagement proactif des participants laisse entrevoir un cheminement positif vers la pleine conformité.Nous vous invitons à lire la version intégrale du rapport afin d’en comprendre les conclusions détaillées. De plus, la DAAC apprécie les efforts collectifs que consentent ses participants pour améliorer la transparence et le contrôle lorsqu’il s’agit de publicité numérique. Ensemble, nous instaurons des normes plus élevées pour mieux protéger la vie privée des consommateurs en matière de publicité numérique. Continuons ensemble à bâtir un écosystème de publicité numérique fiable! Votre organisation n’a pas encore adhéré au programme Choix de pub? Nous invitons toutes les entreprises qui font de la publicité ciblée à explorer les avantages de notre programme et à adhérer à ce dernier. DAACApril 23, 2024responsabilité, Rapport de conformité, conformité, Normes de la publicité Facebook0 LinkedIn0 0 Likes"
author = ""
year_published = 2024
year_updated = 2024
