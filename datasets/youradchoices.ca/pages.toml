["https://youradchoices.ca/fr/actualites/2024/10/16/sommet-de-la-daac-2024-retour-sur-une-journe-riche-en-apprentissages-et-en-rseautage"]
title = "Sommet de la DAAC 2024 : Retour sur une journée riche en apprentissages et en réseautage — AdChoices in Canada"
description = "Le 8 octobre dernier, l’Alliance de la publicité numérique du Canada (DAAC) tenait son Sommet annuel aux bureaux d’Osler, Hoskin &amp; Harcourt LLP, situés au centre-ville de Toronto. Pour l’occasion, l’Alliance a accueilli divers groupes de professionnels de l’industrie, d’experts en protection"
full_description = '''Sommet de la DAAC 2024 : Retour sur une journée riche en apprentissages et en réseautage Le 8 octobre dernier, l’Alliance de la publicité numérique du Canada (DAAC) tenait son Sommet annuel aux bureaux d’Osler, Hoskin & Harcourt LLP, situés au centre-ville de Toronto. Pour l’occasion, l’Alliance a accueilli divers groupes de professionnels de l’industrie, d’experts en protection de la vie privée et de chargés de réglementation. Ce Sommet a fourni une plateforme utile aux participants qui ont pu échanger des connaissances, discuter d’enjeux et découvrir les derniers développements en matière de publicité numérique et de protection de la vie privée. Julie Ford, directrice exécutive de la DAAC, a lancé la journée à l’aide d’un chaleureux mot de bienvenue et d’un examen rapide de l’ordre du jour, préparant ainsi le terrain tout en encourageant les non-participants aux programmes d’autoréglementation de la DAAC à y adhérer. Elle a souligné le fait que nous sommes tous plus forts lorsque nous travaillons tous ensemble. La première présentation, donnée par Lou Mastria, président et chef de la direction de la Digital Advertising Alliance (DAA), a porté sur la façon dont les outils de retrait destinés aux consommateurs de la DAA ont évolué afin de tenir compte des nouvelles technologies et des nouvelles tendances en matière de publicité. Monsieur Mastria a souligné les récents essais de l’outil WebChoices 2.0 qu’a effectués la DAA – soit une version améliorée de notre outil WebChoices qui accepte les témoins et autres identifiants sur presque la totalité des navigateurs les plus connus – et de l’extension de navigateur Protect My Choices 2.0. Les fournisseurs de technologies publicitaires tiers qui sont intéressés à tester ces outils devraient communiquer sans tarder avec la DAA ou avec la DAAC (info@daac.ca). Il a également partagé les résultats de récentes études qui montrent que 79 % des consommateurs reconnaissent l’icône AdChoices, 85 % la trouvent facile à comprendre et 78 % la trouvent utile. Plus important encore, 72 % des consommateurs ont indiqué que l’utilisation de l’icône dans une publicité augmentait le niveau de confiance qu’ils avaient en l’annonceur. Monsieur Mastria a également mentionné le tout nouveau guide de mise en œuvre pour les téléviseurs connectés que publiait récemment la DAA dans le but d’aider les entreprises à comprendre comment présenter l’icône dans ce nouveau média. En conclusion, il a rappelé à l’auditoire que les principes de la DAA (et de la DAAC) ont toujours été indépendants de la technologie et sont appliqués de façon autonome, les participants acceptant de manière proactive de respecter les règles élaborées par et pour notre industrie. Cette présentation a été suivie d’une allocution de Shelley Samel, cheffe des Affaires juridiques des Normes de la publicité, qui a souligné l’importance de la responsabilité dans le maintien de la conformité avec le programme Choix de pub/AdChoices. Elle a insisté sur le besoin, pour les participants au programme Choix de pub, de retourner rapidement leur formulaire d’autocertification aux Normes de la publicité.Un moment marquant du Sommet fut la table ronde de Google, intitulée The Power of Targeted Ads for SME et animée par Darryl Julott de Digital Main Street. Y ont été présentés les points de vue de propriétaires de petites entreprises, Juliana et Luis Velasquez (de Familia Fine Foods) et du consultant en publicité numérique, David Nagy (d’eCommerce Canada). La séance a montré comment les petites et moyennes entreprises peuvent tirer profit de la publicité ciblée pour joindre les publics de niche, pour optimiser leurs dépenses de marketing et pour favoriser leur croissance. L’un des plus grands avantages de la publicité ciblée tient à la capacité des petites entreprises d’étendre de manière rentable leur portée au-delà de leur emplacement physique. Sans les avantages qu’offrent les technologies publicitaires, les petites entreprises disposeraient d’un bassin de clients potentiels beaucoup plus restreint. Par la suite, a suivi la présentation de Jean-Baptiste Garcin et de Jean-Christophe Mauss de Didomi, qui a plongé les participants dans les diverses stratégies à adopter pour une gestion efficace du consentement. Les présentateurs ont indiqué que le taux de référence global en matière de consentement au Canada s’élevait à 80 %. Leur conseil général en ce qui a trait à l’adoption d’une plateforme de gestion du consentement (CMP) est de vous assurer que vous pouvez personnaliser votre interface sur la confidentialité afin qu’elle corresponde au guide de style de votre marque, cette interface étant la première chose que les utilisateurs verront. La plateforme doit respecter la réglementation actuelle en matière de protection de la vie privée que vous devez couvrir et disposer de la bande passante nécessaire pour en accueillir de nouvelles. L’accès à une équipe de soutien pour un support technique, une veille juridique et la consultation peut également s’avérer utile, et ce, à mesure que votre maturité et que vos besoins à l’interne en matière de protection de la vie privée augmentent. En outre, il faut vous assurer que votre CMP puisse s’intégrer aux programmes de l’industrie, comme le Transparency and Consent Framework (TCF) d’IAB et Choix de pub/AdChoices.L’une des présentations les plus inspirantes et les plus éclairantes fut celle d’Abigail Dubiniecki – avocate spécialisée en protection de la vie privée d’Ottawa –, qui a porté sur les données sensibles dans les applications santé, sur le suivi des règles et sur la technologie féminine (FemTech). Madame Dubiniecki a abordé les risques uniques associés au traitement des données sensibles sur la santé, notamment les produits répondant aux besoins des femmes en matière de santé. Elle a insisté dans sa présentation sur un traitement plus éthique et plus responsable de telles données et a demandé aux prestataires de technologies publicitaires de reconsidérer leur participation dans ces types d’applications en raison des nombreux risques associés aux renseignements personnels intimes.L’après-midi s’est conclu par une séance approfondie sur la réforme législative canadienne sur la protection de la vie privée ainsi que sur la publicité ciblée par centres d’intérêt, animée par Adam Kardash d’Osler, Hoskin & Harcourt LLP. Monsieur Kardash a résumé les exigences requises actuellement par le Commissariat à la protection de la vie privée du Canada (CPVP) en matière de publicité ciblée par centres d’intérêt et a fait remarquer que le programme Choix de pub/AdChoices existait justement grâce à ces lignes directrices. Il a également mentionné que le projet de loi C-27 – un projet de loi omnibus qui prévoit l’inclusion de la Loi sur la protection de la vie privée des consommateurs (LPVPC) en remplacement de la LPRPDE – se trouve dans une situation précaire en raison du blocage des procédures par les politiciens. Si elle est adoptée, la LPVPC permettra des codes de pratiques approuvés par le CPVP que le programme Choix de pub sera en mesure de demander. La majeure partie de la séance a été consacrée aux impacts de la Loi 25 du Québec et à la façon dont la Commission d'accès à l'information (CAI) – l’autorité de protection de la vie privée au Québec – peut interpréter les actions qui sont appropriées dans le cas de la publicité ciblée par centres d’intérêt. S’en est suivie une période animée de questions et réponses qui a ainsi clos l’événement. Globalement, le Sommet de la DAAC 2024 a rassemblé avec succès des chefs de file et des professionnels dans le but d’explorer les liens entre la publicité numérique et la protection de la vie privée, tout en leur offrant des contenus de qualité, des discussions stimulantes et des possibilités de réseautage. Nous remercions très chaleureusement les conférenciers, les experts ainsi que nos commanditaires, Google et Didomi, qui ont contribué au succès de cet événement. Il nous tarde de poursuivre ces conversations importantes avec vous tous. View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506578143-25BNFD54D9GG6EMDG09H/20241008_091331.png" alt="20241008_091331.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506594543-J69XCZ5R0FLCARW0DP7B/20241008_093008.png" alt="20241008_093008.png" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506586939-7U6WEGXGCVI778S9QMX9/20241008_095545.jpg" alt="20241008_095545.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506596178-7XL69OT2MQB8NGVNT2T9/20241008_100211.jpg" alt="20241008_100211.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506606393-GJUEX57FOQMT0RO611FG/20241008_100623.jpg" alt="20241008_100623.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506607319-X3PGWLTYIU61F9QWYTLG/20241008_105243.jpg" alt="20241008_105243.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506631678-Z0SMCGNYFIWZFU92SN6A/20241008_112420.jpg" alt="20241008_112420.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506854436-U7AYF4OIH70KM208GL8J/20241008_112431-x.jpg" alt="20241008_112431-x.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506623063-46F7RVDJ2KS53DRGMYTY/20241008_113550.jpg" alt="20241008_113550.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506635003-0TV0GA7EOQSP30ZZ11QD/20241008_130158.jpg" alt="20241008_130158.jpg" /> View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1728506639930-DBJEPGJ0ES3X5ZPPMDJZ/20241008_13