["https://youradchoices.ca/fr/actualites/2021/3/8/une-nouvelle-re-pour-la-publicit-cible-sur-mobiles"]
title = "Une nouvelle ère pour la publicité ciblée sur mobiles — AdChoices in Canada"
description = "Le lancement de la version iOS 14 d’Apple est prévu pour ce printemps. Cette nouveauté se traduira par une dépréciation de l’IDFA et par l’introduction de la fonctionnalité de protection de la vie privée ATT (App Tracking Transparency) et de SKAdNetwork. Google a récemment annoncé des changements si"
full_description = "Une nouvelle ère pour la publicité ciblée sur mobiles Le lancement de la version iOS 14 d’Apple est prévu pour ce printemps. Cette nouveauté se traduira par une dépréciation de l’IDFA et par l’introduction de la fonctionnalité de protection de la vie privée ATT (App Tracking Transparency) et de SKAdNetwork. Google a récemment annoncé des changements similaires.Que veulent dire ces changements pour l’industrie publicitaire? Quelles seront les répercussions sur le ciblage, la mesure d’audience, l’attribution publicitaire et la détection des fraudes publicitaires? Y a-t-il de nouvelles occasions à saisir? Les experts prédisent que les taux d’adhésion au consentement explicite, si on reste optimistes, n’excéderont pas 20 %. Que vous le vouliez ou non, nous entrons dans une nouvelle ère pour la publicité ciblée sur mobiles.Cette séance traitera des changements proposés, principalement par Apple, et des retombées de ceux-ci sur les annonceurs, les médias et les technologies publicitaires. Un panel d’experts issus de tous les secteurs de l’écosystème publicitaire se concentrera sur la recherche de solutions et de stratégies d’atténuation. Les annonceurs, les agences média et les dirigeants de firmes spécialisées en technologies publicitaires devraient participer à cet événement afin de comprendre les options de ciblage qui survivront aux changements et de découvrir comment leurs outils de mesure, l’attribution publicitaire et leurs programmes de gestion de la protection des renseignements personnels seront affectés.Veuillez noter que l’événement se déroulera en anglais.Date : Jeudi 11 mars 2021Heure : 13h00 à 14h30 HELieu : Virtuel (Zoom)Coût : GratuitS’inscrire Ian Meyers, directeur, Produits adressables, LiveRampIan Meyers est directeur des produits adressables chez LiveRamp, ce qui comprend les outils pour éditeurs et l’infrastructure d’enchères en temps réel (bidstream). Il travaille chez LiveRamp depuis sept ans et a auparavant développé des produits de recherche en placement chez Morningstar inc.Ian détient un baccalauréat en histoire de la Washington University à St. Louis, Missouri. Animatrice Belinda Smith, PDG, m/SIXÀ titre de PDG de m/SIX Americas, Belinda supervise toutes les activités pour ce territoire. Avant de travailler chez m/SIX, elle était directrice des renseignements sur les marchés internationaux pour Electronic Arts (EA). Pionnière des modèles intégrés en raison de son incursion chez EA, Belinda aide ses clients à mieux comprendre ce que sont les données propriétaires et comment s’en servir, tout en mettant en place et en supervisant des équipes hybrides (agences et clients) en fonction des besoins spécifiques de chaque client.Belinda est actuellement ambassadrice du projet sur la diversité mondiale de la WFA (World Federation of Advertisers) et a été la conseillère principale de l’initiative mondiale d’évaluation multimédia pour le même organisme. Panélistes Ian Hewetson, v.-p., Loblaw MediaVétéran de l’univers des technologies publicitaires, Ian a travaillé avec des centaines d’annonceurs, d’agences et d’éditeurs sur des milliers de campagnes. Puisqu’il fait partie intégrante d’une technologie propriétaire axée sur le renforcement de l’esprit d’équipe, Ian s’est trouvé au premier plan des changements constants qui définissent l’industrie des technologies publicitaires.Au fil des ans, Ian a été conférencier invité pour des événements tenus par l’IAB, l’AAM, Mediapost, Marketing Magazine, Future Flash et plus autres encore. De plus, Adexchanger, Mediapost et Media In Canada ont publié certains de ses écrits. Caroline Moul, présidente, PHDÀ titre de présidente de PHD Canada, Caroline Moul est responsable du maintien de la croissance et de l’évolution de l’agence, ce qui passe par l’élaboration et la mise en place des meilleures pratiques et par la maximisation des capacités d’Omnicom Media Group à travers tous les marchés. Depuis les 17 dernières années, Caroline a été le moteur de la progression des capacités numériques de PHD.Caroline siège actuellement au conseil de la DAAC (Alliance de la publicité numérique du Canada) et du CMDC (Conseil des directeurs médias du Canada). Mike Sherman, directeur, Optimisation des médias et des données, L’Oréal CanadaŒuvrant depuis plus de 10 ans dans le secteur des médias, Mike a su se bâtir une carrière dans l’univers des médias et des données numériques. Tout en nourrissant sa passion pour les médias, il a travaillé dans une multitude de secteurs, dont ceux des services financiers, des voyages, des télécommunications, de l’automobile, du commerce de détail et du commerce électronique. Il dirige actuellement la division Omnimedia de L’Oréal Canada pour ses quelque 35 marques. DAACMarch 8, 2021 Facebook0 LinkedIn0 0 Likes"
author = ""
year_published = 2021
year_updated = 2021
