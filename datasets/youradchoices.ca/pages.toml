["https://youradchoices.ca/en/token-faq"]
title = "Token ID-Based Choices FAQ — AdChoices in Canada"
description = """
The WebChoices Consumer Choice Tool allows you to choose whether or not you 
receive interest-based advertising from participating companies."""
full_description = "Token ID-Based Choices - FAQThe DAAC’s Token ID-Based Choices Tool allows you to choose whether or not you receive interest-based advertising from companies participating in the tool.Using Token ID-Based Choices, you can opt out of having data collected or used for interest-based advertising linked to the identifier you provide.These opt outs apply to interest-based advertising and other applicable uses of app, web, cross-device and/or other device usage by companies participating in the Token ID-Based Choices Tool. You may still receive other types of advertising from companies participating in the Token ID-Based Tool, and those companies may still collect information for other purposes consistent with the DAAC Principles.Please note that any identifier submitted within the tool, such as an email address, will not opt you out of email subscriptions, other email services, or other uses of the identifier you provide in which you may have enrolled or from which you receive communications.This FAQ addresses the following:Understand the Token ID-Based Choices ToolWhat is a Token ID?Is opting out with Token ID-Based Choice the same as email unsubscribing?If I adjust my device settings, do I need to reset my Token ID-Based Choices?Can I use the Token ID-Based Choices Tool for revocation of consent?What does Token ID-Based Choice not cover?I’ve set my preferences using the tool – why am I still seeing ads?Can I reuse the tool to enter more than one identifier? 1. Understand the Token ID-Based Choices Tool The opt out(s)/revocation(s) requested through this DAAC Tool (Token ID-Based Choices Tool) are applicable to the identifier you provide in the tool. The choices apply to the use of that identifier for data collection, use, or transfer for the purposes of Interest-Based Advertising and other applicable uses under the DAAC Principles. Please note that any identifier submitted within this app will not opt you out of email subscriptions, other email services, or other uses of the identifier you provide in which you may have enrolled or from which you receive communications. Should you exercise an opt-out choice for Interest-Based Advertising, the companies listed may still deliver ads based on other information and those ads may be less relevant to you. Processing times for honoring an opt-out/revocation request may vary by company. Once exercised, Token ID-Based Choice(s) cannot currently be reset. 2. What is a Token ID? A Token ID refers to a process by which a consumer may opt out (or revoke permission) from the practice of using a modified version of an identifier (sometimes called a hash or a token) for providing relevant advertising to the right audience. This form of advertising is known as Online Behavioral Advertising or Interest-Based Advertising (IBA). The identifier is modified by the tool before it is sent and that is sometimes called a token. For example, “myemail@email.com” or “555-555-5555” could be modified to look like this “555e4ca52b721e4325d5b941724a150d.” 3. Is opting out with Token ID-Based Choice the same as email unsubscribing? No. The DAAC Token ID-Based Choice Tool sends a modified version of the identifier you provide in the tool to the selected companies. Your request to opt out through this tool is for IBA uses associated with that identifier. Please note that any identifier submitted through the tool, such as an email address, will not opt you out of email subscriptions, other email services, or other uses of the identifier you provide in which you may have enrolled or from which you receive communications. 4. If I adjust my device settings, do I need to reset my Token ID-Based Choices? No, resetting your device identifier will not affect or interfere with the Token ID-Based Choice(s) expressed through the tool. 5. Can I use the Token ID-Based Choices Tool for revocation of consent? If you previously provided your consent/permission for IBA using the identifier you provided (such as your email address), then submitting the identifier to the Token ID-Based Choices Tool will transmit a request to revoke that permission to the companies you select in the tool. 6. What does Token ID-Based Choice not cover? An opt-out/revocation request through the Token ID-Based Choices Tool does not apply to the tokenized identifiers used for non-IBA purposes, nor does it apply to other identifiers like cookies or device IDs used by a participating company. Consumers can separately opt-out of those identifiers through the WebChoices and AppChoices platforms. 7. I’ve set my preferences using the tool – why am I still seeing ads? An opt-out/revocation request does not block or interfere with advertising. It applies to the collection, use, and transfer of data related to the identifier for IBA purposes. So, more generic advertising, not tailored to your interests, may still be displayed. 9. Can I reuse the tool to enter more than one identifier? Yes. Simply use the tool again for other identifiers (such as another email address) for which you are authorized to submit opt-out requests."
year_published = 2024
year_updated = 2024
