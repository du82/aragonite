["https://youradchoices.ca/en/business-registration"]
title = "Business Registration — AdChoices in Canada"
description = """
Participating in the program is a four step process. Read below for the 
steps to take before filling out the registration form."""
full_description = '''Scroll Register to Use AdChoicesParticipation in the AdChoices program responds to business critical needs:Facilitates alignment with privacy regulation.Builds consumer trust by providing consumers with centralized transparency and control.Protects your brand reputation as a responsible corporate citizen.Demonstrates your commitment to effective privacy self-regulation in support of responsible interest-based advertising principles and best practices.Enhances overall organization integrity.Through AdChoices, companies gain access to valuable resources, saving time and human error as well as easily managing vendor relationships. Registration Form The DAAC is the proud recipient of the 2024 PICCASO Award for Not for Profit Leadership in Canada Annual FeesLicensed ParticipationThe Licensed Participation level is for organizations that actively engage in interest-based advertising by directly collecting, using or disclosing personal information for targeted advertising purposes or allowing partners to do so on their owned and controlled properties. This includes the use of cookies, advertising IDs, tokens, probabilistic targeting, and remarketing practices.Supporting LevelThe Supporting Level is a versatile option for ad agencies, law firms, and other organizations that do not directly engage in interest-based advertising but may help other companies do so. This level is ideal for those who want to demonstrate support for our self-regulatory program or who want to link to our tools without participating in our program. Participation Comparison Table table { width: 100%; border-collapse: collapse; } th, td { padding: 15px; text-align: left; border: 1px solid #ddd; } th { background-color: #ffffff; } Feature Licensed Participation Supporting Level Annual Fee based on self-attested gross Canadian revenue. Firms not directly engaged with interest-based advertising would be considered "small business" Large - $9,500 Medium - $4,200 Small - $2,500 Large - $5,500 Medium - $2,500 Small - $1,500 Ideal Businesses Organizations engaging in interest-based advertising (brands, publishers, ad tech) Businesses, advertisers, agencies or any other organization that links to the DAAC's website or tools within their privacy policy but is not a licensed participant Licensed use of the AdChoices icon required for all icon usage in Canada on ads, websites, apps and other devices Included Not included Independent accountability monitoring by Ad Standards Included Not included Link to consumer control tools available in English & French Included Included Privacy policy appraisal focused on interest-based advertising Included Fee-Based Training for staff on the AdChoices program Included Fee-Based Option to join the DAAC's Stakeholder Advisory Group Included Not included Access to Participant's Hub Included Not included Access to AdVantage Insider Newsletter Included Included Priority access to webinars and events Included Included Logo on YourAdChoices.ca participants' page Included Included Discounts for DAA U.S. participants Available as an addendum to the DAA U.S. contract with a discounted rate ($2,917 USD) Not available Click Here to Register Getting StartedStep 1: Learn How to Implement the PrinciplesAll companies interested in participate in the AdChoices self-regulatory program should learn how to implement the DAAC Principles. To help you determine what you will need to do within your organization to comply, please review the different responsibilities below, based on what your company’s business practices are for interest-based advertising. Keep in mind that your company may be one, or all, of these types of entities depending on how you collect or use interest-based advertising. Program FAQ First PartyA first party is a website publisher or website operator that allows the collection or use of online interest-based advertising (IBA) data on their property. For first parties, in-page or in-application notification to consumers about IBA needs to be above the fold or otherwise displayed in a similarly conspicuous manner, such as through a pop-up notice. First Party Responsibilities Third PartyA Third Party is as an advertising network, DSP, trade desk or data company (including ad exchanges and data aggregators) and in some cases advertisers. Third Party Responsibilities Service ProviderA Service Provider is any internet access provider (ISP), search engine, web toolbar, browser, or other service that enables the provider to have access to all or substantially all URLs accessed by its users. Service Providers collect and use user data for online interest-based advertising in the course of their activities, and therefore have separate obligations under the DAAC’s Principles. Service Provider Responsibilities Step 2: Register to Use the Icon The AdChoices Icon (illustrated here in blue) is a prominent feature of the DAAC’s program for online interest-based advertising.Companies participating in the program may use the icon and the word “AdChoices” as a means for providing notice of online interest-based advertising data collection and use, and to represent adherence to the DAAC principles for online interest-based advertising.If your organization is interested in acquiring the icon for use in connection with the principles, please visit our company registration page. Register Today Step 3: Third Parties: Be Listed on the ToolsOur tools offer industry-wide centralized choices for consumers.Third Parties engaged in online interest-based advertising are encouraged to be listed in the opt-out tools we offer on our consumer opt-out page. This is where consumers are able to easily opt out of some or all participating companies’ online interest-based ads.Please note that participation in the opt-out tools requires a separate fee that is billed by the DAA.First Parties that do not directly collect personal information for interest-based advertising, but work with Third Party partners that do, should provide links to the DAAC’s tools in their notices to consumers. We strongly encourage First Parties to support these tools by participating in the self-regulatory program.Step 4: Determine Whether to Use an Approved Provider The DAAC has approved two service providers to assist companies in serving the AdChoices icon and complying with the DAAC principles. These Approved Providers have been endorsed and approved as a technology and standard method for adhering to the DAAC principles. Working with an approved provider is voluntary and solely based on your company’s needs. Crownpeak TrustArc Register to Use AdChoices Fees Getting Started'''
