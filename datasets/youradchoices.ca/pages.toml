title = "À propos de la DAAC — AdChoices in Canada"
description = """
L’Alliance de la publicité numérique du Canada (DAAC) est un regroupement 
d’associations nationales de publicité et de marketing."""
full_description = '''Scroll Au sujet de la DAACL’Alliance de la publicité numérique du Canada (DAAC) est un regroupement d’associations nationales de publicité et de marketing de premier plan, dont les membres partagent la volonté d’offrir un programme robuste et crédible permettant d’assurer une publicité ciblée par centres d’intérêt en ligne responsable. Actualités Le programme canadien Choix de pub – développé par la DAAC – a pour but d’éduquer les consommateurs au sujet de la publicité ciblée par centres d’intérêt et d’offrir aux consommateurs des avis les informant que de la publicité ciblée par centres d’intérêt leur est présentée.Grâce à nos efforts conjugués, les consommateurs doivent avoir la possibilité d’exercer un contrôle en autorisant ou non la collecte et l’utilisation de leurs données de navigation et d’applications à des fins de publicité ciblée par centres d’intérêt. Les lignes directrices de notre programme figurent sur la page Les principes.La DAAC est responsable des activités du programme au Canada, coordonnant celles-ci autant que possible avec celles d’autres organisations de publicité numérique (DAA) dans le monde qui offrent des programmes d’autoréglementation semblables, notamment aux États-Unis et en Europe. Contactez-nous Vision DAACTous, dans l’écosystème de la publicité numérique, recourent à un système efficace fondé sur des principes et adopté par l’ensemble de l’industrie.Mission DAACOffrir aux consommateurs une transparence et un contrôle accrus.Établir et mettre en application, à l’échelle de l’industrie, des pratiques responsables en matière de protection de la vie privée en vue d’une publicité numérique pertinente.Instaurer la confiance des consommateurs et d’autres parties prenantes dans le marketing et dans l’industrie de la publicité. td { padding-top: 2px; padding-bottom: 1px; padding-left: 5px; padding-right: 5px; } Conseil d'administration de la DAAC Caroline MoulPrésident Julie CourtemancheTrésorier Sara Clodman Judy Davey Scott Knox Thierry Lessard Alexander Miceli Membres fondateurs de la DAAC Association canadienne des annonceurs (ACA) Association canadienne du marketing (CMA) Association des agences de communication créative (A2C) Bureau de la publicité interactive du Canada (IAB Canada) Canadian Media Directors' Council (CMDC) Julie Courtemanche Institut des agences canadiennes (ICA) Adam Kardash Personnel du DAAC Julie FordDirectrice exécutive Randy SagemanResponsable de l'engagement Trent BemisGestionnaire de compte Associations membres de la DAACL’Alliance de la publicité numérique du Canada (DAAC) est un regroupement d’associations canadiennes de publicité et marketing de premier plan, qui comprend : <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1561573945998-SK40MCWENW7FME43L16Q/A2C.png" alt="Association des Agences de Communication Créative (A2C)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1561573776028-KH8E02UE2SD3DKUBHL61/ACA-FR-logo-colour.jpg" alt="Association of Canadian Advertisers (ACA)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1657037165599-3NNGW3W7AAIWL8IRCX0G/CMA-smaller.png" alt="Canadian Marketing Association" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549294349528-L7JLRKLLWU7316P27S13/CMDC.png" alt="Canadian Media Directors' Council (CMDC)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549295415140-6W3OIVH2XX8R53XJN7FV/iab+canada.png" alt="Interactive Advertising Bureau of Canada (IAB Canada)" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1657035841677-XJ6I7H7IY9GPA86OORH4/ICA.png" alt="Institute of Canadian Agencies" /> #block-e7806db7345f1614a2e4 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-e7806db7345f1614a2e4 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Au sujet du programme Choix de pubLe programme canadien d’autoréglementation de la publicité ciblée par centres d’intérêt en ligne, appelé Choix de pub, s’inscrit dans un effort d’offrir aux consommateurs plus d’information et de choix quant à la publicité qu’ils reçoivent en ligne.Ce programme d’autoréglementation exige des entreprises participantes qu’elles informent clairement les consommateurs sur leurs pratiques de collecte et d’utilisation de données et qu’elles leur permettent d’exercer un plus grand contrôle sur les types de publicités qu’ils voient.La DAAC est responsable des activités du programme d’autoréglementation Choix de pub au Canada, les coordonnant autant que possible avec celles d’autres organisations de publicité numérique (DAA) dans le monde, qui offrent des programmes d’autoréglementation semblables. Partenaire responsabilité Les normes canadiennes de la publicité (NCP) – organisme national indépendant d’autoréglementation de la publicité – sont responsables du volet « Responsabilité » du programme Choix de pub au Canada.Parmi ses responsabilités, Les normes canadiennes de la publicité accepte et évalue les plaintes formulées à l’encontre de pratiques de publicité ciblée par centres d’intérêt en ligne susceptibles d’enfreindre les principes d’autoréglementation de la DAAC en ce domaine. Lorsqu’une infraction est confirmée, Les normes canadiennes de la publicité travaille avec les entreprises concernées afin de les aider à se conformer aux principes du programme. Les normes canadiennes de la publicité publie également des rapports de conformité.En saviour plus La DAA dans le mondeL’Alliance de la publicité numérique du Canada (DAAC) travaille en étroite collaboration avec d’autres programmes d’autoréglementation internationaux afin d’inscrire le programme Choix de pub dans un effort global. <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1687184087037-U6UDH1T9MW4VQFFGM0LG/DAA-2023.jpg" alt="DAA États-Unis" /> DAA États-Unis <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549297253507-E9WZLNVWQF1TL5Q5SNL2/EDAA-Logo-whitespace.png" alt="EDAA" /> EDAA <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1549393298387-09NKEQU1SF0NU10ZB2D0/Apda-transp.png" alt="APDA" /> APDA <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1687184116569-TFI4ND1O7SZ2171UQAMI/DAAA.jpg" alt="Asie et Moyen-Orient" /> Asie et Moyen-Orient #block-a76f68a51bf502080f14 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-a76f68a51bf502080f14 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Au sujet de la DAAC Équipe daac Associations membres de la DAAC Au sujet du programme Choix de pub Partenaire responsabilité La DAA dans le monde'''
