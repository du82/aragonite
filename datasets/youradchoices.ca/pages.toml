["https://youradchoices.ca/fr/actualites/2024/6/13/la-daac-se-voit-dcerner-le-prestigieux-prix-piccaso-dans-la-catgorie-leadership-but-non-lucratif-"]
title = "La DAAC se voit décerner le prestigieux prix PICCASO dans la catégorie « Leadership à but non lucratif »! — AdChoices in Canada"
description = "L’Alliance de la publicité numérique du Canada (DAAC) a le plaisir d’annoncer qu’elle vient de remporter le prix  «&nbsp;Leadership à but non&nbsp;lucratif&nbsp;»  lors de la première édition des   Prix PICCASO Canada  ! Cette reconnaissance accroît la notoriété de nos programmes d’autor"
full_description = '''La DAAC se voit décerner le prestigieux prix PICCASO dans la catégorie « Leadership à but non lucratif »! L’Alliance de la publicité numérique du Canada (DAAC) a le plaisir d’annoncer qu’elle vient de remporter le prix « Leadership à but non lucratif » lors de la première édition des Prix PICCASO Canada! Cette reconnaissance accroît la notoriété de nos programmes d’autoréglementation et le soutien qui leur est apporté. Ce prix nous a été remis le 11 juin dernier lors d’une cérémonie qui a eu lieu à la magnifique Chambre de commerce de la région de Toronto. Le jury composé d’experts – dont notamment l'ancienne Commissaire à la protection de la vie privée du Canada (désormais de Dentons) Chantal Bernier, l’ancienne Commissaire à l’information britannique Elizabeth Denham, et l’éminent professeur et leader d’opinion Khaled El Emam de l’Université d’Ottawa ainsi que d’illustres représentants du domaine de la protection de la vie privée – valorise grandement l’intégrité de ce prix. La DAAC remercie très chaleureusement ces jurés de même que le Conseil consultatif de PICCASO Canada pour leur soutien. Ce prix vient couronner les dix années d’activités de la DAAC et souligne l’importance croissante pour les marques, pour les éditeurs et pour les fournisseurs de technologies publicitaires d’opter pour une publicité en ligne éthique face à l’évolution rapide des technologies permettant la publicité ciblée par centres d’intérêt et aux nouvelles lois canadiennes sur la vie privée. Nous espérons que ce prix suscitera un intérêt accru pour le programme d’autoréglementation Choix de pub et encouragera les organisations qui ne l’ont déjà fait à y adhérer. Dites-nous que c’est PICCASO qui vous envoie! <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803951592-64UU0VFNIM1O598IT9BM/VINC3589.jpg" alt="VINC3589.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803968402-2Y2U5MOTSW5IKCNT7PPW/VINC3627.JPG" alt="VINC3627.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803782284-ESRHQY9GZFKO4MHSZXN4/VINC3781.jpg" alt="VINC3781.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803715904-0JLN36PFMQTHOTM9Z8PM/VINC4059.jpg" alt="VINC4059.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803799937-VZWOLKGU1NJBKE65271I/VINC4066.jpg" alt="VINC4066.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803873880-O39TRCXTWAJZM0XZ2PT6/VINC4188.jpg" alt="VINC4188.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803933164-JA9LXZT7B8CBZ20DUF10/VINC3556.jpg" alt="VINC3556.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803834116-O8NNBDLTP5M68VOHPC60/20240611_212533.jpg" alt="20240611_212533.jpg" /> #block-yui_3_17_2_1_1718803641792_5991 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1718803641792_5991 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } DAACJune 13, 2024#PrixPICCASOCanada24 Facebook0 LinkedIn0 0 Likes'''
