["https://youradchoices.ca/fr/actualites/2021/7/20/consultation-ontarienne-publicits-politiques-et-fiche-dinformation-sur-laepn"]
title = "Consultation ontarienne, publicités politiques, et fiche d'information sur l'AEPN — AdChoices in Canada"
description = "Le deuxième trimestre de 2021 a été très actif pour nous, ayant eu de nombreuses occasions de collaborer étroitement avec nos associations membres ainsi qu’avec nos partenaires de la DAA et de l’Association européenne pour la publicité numérique (AEPN). Nous nous sommes concentrés sur de futures ver"
full_description = "Consultation ontarienne, publicités politiques, et fiche d'information sur l'AEPN Le deuxième trimestre de 2021 a été très actif pour nous, ayant eu de nombreuses occasions de collaborer étroitement avec nos associations membres ainsi qu’avec nos partenaires de la DAA et de l’Association européenne pour la publicité numérique (AEPN). Nous nous sommes concentrés sur de futures versions du programme Choix de pub/AdChoices – dont une version, qui est déjà prête, en vue d’un monde sans témoin (cookie). Ce travail s’effectue activement au moment d’écrire ces lignes, y compris une révision des principes fondamentaux du programme Choix de pub, dont vous entendrez parler bientôt.Entre-temps, voici quelques nouvelles susceptibles de vous intéresser :Consultation publique – Modernisation de la protection de la vie privée en OntarioLe 17 juin dernier, l’honorable Lisa Thompson, ministre des Services gouvernementaux et des Services aux consommateurs de l’Ontario publiait une mise à jour sur les consultations publiques qui se sont tenues l’an dernier sur la Loi sur la protection des renseignements personnels dans le secteur privé.Dans ce document, la ministre critique le manque de cohésion du projet de loi C-11 du gouvernement fédéral, Loi de 2020 sur la mise en œuvre de la Charte du numérique, avec ce qui a pu être observé lors de la consultation provinciale. Elle a annoncé la possibilité d’adopter une loi provinciale qui régirait les données des citoyens et qui établirait une « référence nationale absolue » en matière de protection de la vie privée.Voici quelques-unes des propositions présentées dans ce document :Approche de la vie privée fondée sur les droitsUtilisation sûre de la prise de décision automatiséeAmélioration du consentement et des autres utilisations licites des renseignements personnelsTransparence accrue des donnéesProtection des groupes vulnérables comme les enfants et les jeunesRégime réglementaire équitable, proportionné et favorableSoutien aux innovateursLa ministre a également déclaré qu’un régime national harmonisé de protection de la vie privée constituerait un résultat optimal pour les Ontariens et a lancé une invitation à ses homologues fédéraux pour discuter de la façon dont ils pourraient s’assurer, ensemble, que les lois sur la protection de la vie privée soient interopérables avec celles d’autres territoires de compétence.Nous encourageons les entreprises à examiner le livre blanc sur lequel porte l’annonce de la ministre et à donner leur avis sur celui-ci à Ontario.ca/ProtectionviePrivee. La DAAC présentera une soumission d’ici le 3 août prochain et accueille tous les commentaires des participants à cet effet.Le programme Publicité politique est ouvert aux inscriptions!Élections Canada a confirmé de nouveau que le programme d’autoréglementation de la publicité politique de la DAAC satisfaisait aux exigences requises en vertu de la Loi électorale du Canada concernant les éléments d’identification requis dans les publicités de nature politique ou à proximité de celles-ci, y compris les publicités engagées.De nouveaux textes ont été approuvés par Élections Canada, qui peuvent être utilisés à proximité de l’icône pourpre :Info sur la publicitéAutorisée parPayée parPublicité politiqueDivulgation publicité politiqueQui finance cette publicité?Qui produit cette publicité?La possibilité d’élections fédérales se dessinant à l’automne, le moment est propice pour mieux comprendre notre programme et son icône ainsi que la plateforme normalisée qui y est associée. Le programme est simple à utiliser et est disponible à un coût très bas.Les prochains webinaires à venir sont un bon début : Le 12 août, à midi HNE – S’inscrire iciOu communiquez directement avec nous pour plus d’information.Notre programme Publicité politique est ouvert aux inscriptions. Parmi les organismes qui s’y sont inscrits récemment figurent MediaMath et The NOW Group. Si votre entreprise souhaite signer un contrat de licence pour l’icône et pour l’utilisation de notre outil assurant la transparence des publicités, veuillez l’inscrire ci-dessous : Inscrire votre entreprise dès aujourd’hui!Fiche d’information sur l’AEPN – Loi sur les services numériquesLa Loi sur les services numériques vient modifier la Directive sur le commerce électronique (2000/31/EC) et régira tout type de publicité diffusée sur les plateformes en ligne – qu’il s’agisse de marketing numérique ou de publicités politiques ou engagées diffusées en Europe. Suivant l’exemple du Règlement général sur la protection des données (RGPD), cette loi s’appliquera aux plateformes établies à l’extérieur de l’UE lorsque celles-ci ciblent les consommateurs européens.L’AEPN, notre pendant européen, est très bien placée et est prête à contribuer au débat avec ses outils, son expertise et son savoir-faire. Sa fiche d’information, que vous pouvez télécharger ici, porte sur la Loi sur les services numériques et donne un aperçu clair des impacts qu’aura éventuellement cette législation sur l’industrie, sur les entreprises et sur les utilisateurs aussi. Assurez-vous de la télécharger et d’en prendre connaissance. DAACJuly 20, 2021Publicité politique, AdChoices, AEPN, DSA, Consultation publique, Ontario Facebook0 LinkedIn0 0 Likes"
