full_description = "Contactez-nousLa DAAC représente le programme Choix de pub/AdChoices au Canada, mais n'est pas une agence de publicité. Nous n'acceptons pas non plus les plaintes via ce site Web.Cependant, un organisme d’autoréglementation indépendant – les Normes de la publicité – est chargé d’enquêter sur toute plainte ou préoccupation concernant les pratiques de publicité ciblée par centres d’intérêt qui sont susceptibles d’enfreindre les principes de la DAAC.Vous pouvez soumettre vos plaintes à : https://plaintes.normespub.ca/Pub/SubmitDAACComplaintLes demandes médiatiques et les questions concernant l’adhésion au programme Choix de pub peuvent être soumises ici."
