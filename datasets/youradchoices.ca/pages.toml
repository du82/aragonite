["https://youradchoices.ca/fr/actualites/2022/6/14/annonce-du-conseil-dadministration-de-la-daac"]
title = "Annonce du conseil d’administration de la DAAC — AdChoices in Canada"
description = "L’Alliance de la publicité numérique du Canada a pour mission d’établir et de faire respecter, au sein de l’industrie, des pratiques responsables en matière de protection de la vie privée en vue d’assurer une publicité numérique pertinente, d’offrir aux consommateurs une transparence et un contrôle"
full_description = "Annonce du conseil d’administration de la DAAC L’Alliance de la publicité numérique du Canada a pour mission d’établir et de faire respecter, au sein de l’industrie, des pratiques responsables en matière de protection de la vie privée en vue d’assurer une publicité numérique pertinente, d’offrir aux consommateurs une transparence et un contrôle accrus et de susciter la confiance des consommateurs et autres parties prenantes dans l’industrie du marketing et de la publicité. Cette mission multidimensionnelle et essentielle signifie que nous avons besoin des personnes les plus compétentes autour de la table, qui permettront à la DAAC d’obtenir les meilleurs résultats possibles quant aux programmes qu’elle exploite. À cette fin, nous avons le plaisir d’annoncer que nous avons confirmé la liste des administrateurs de la DAAC pour 2022-2023. Il s’agit de : Jill BriggsSara ClodmanJulie CourtemancheAdam KardashScott KnoxRon LundCaroline MoulIsabel PoirierCaroline Moul a été élue présidente du Conseil, assurant ainsi la succession de Ron Lund qui occupait ce poste depuis 2018; M. Lund continuera de siéger au Conseil à titre d’administrateur. Julie Courtemanche reprend quant à elle son rôle de trésorière. La nomination d’un solide conseil d’administration est cruciale actuellement, vu les modifications que subissent les lois canadiennes en matière de protection de la vie privée. Le programme canadien Choix de pub/AdChoices, développé par la DAAC, a pour but de renseigner les consommateurs sur la publicité ciblée par centres d’intérêt et de leur fournir des avis lorsque de telles publicités leur sont présentées. Grâce à ce programme, les consommateurs peuvent accepter ou refuser la collecte et l’utilisation de leurs données de navigation et d’applications à des fins de publicités ciblées par centres d’intérêt. La DAAC est responsable du fonctionnement du programme au Canada, coordonnant souvent ses actions avec d’autres organisations mondiales de DAA qui administrent des programmes d’autoréglementation semblables aux États-Unis et en Europe. Pour en savoir davantage sur le programme et pour les entreprises qui veulent y adhérer, veuillez consulter votrechoixdepub.ca. DAACJune 14, 2022 Facebook0 LinkedIn0 0 Likes"
author = ""
year_published = 2022
year_updated = 2022
