["https://youradchoices.ca/fr/proprietaires-de-sites"]
title = "Propriétaires de sites — AdChoices in Canada"
description = """
Si vous vous identifiez comme propriétaire de site, vous exploitez un site 
Web avec lequel le consommateur interagit et laisse des données."""
full_description = "Propriétaires de sitesSi vous vous êtes identifié comme propriétaire du site, cela signifie que vous exploitez ou que vous contrôlez un site Web avec lequel le consommateur interagit. Par exemple, vous publiez un magazine en ligne ou vous exploitez un site de vente en ligne.Les principes du programme Choix de pub ne s’appliquent pas à la collecte des données et aux pratiques d’utilisation lorsqu’elles sont faites par une entreprise à partir de son propre site pour ses propres fins.Apparaît ci-après un résumé de l’avis et de vos obligations en matière de contrôle par le consommateur en vertu des principes du programme, si des tiers (tels que des réseaux publicitaires, des échanges publicitaires (Ad Exchanges) et des plateformes DSP) recueillent ou utilisent sur votre site Web des données à des fins de publicité ciblée par centres d’intérêt en ligne.Pour se conformer aux principes du programme, les exploitants/propriétaires de sites Web doivent :Fournir une description valable de leurs pratiques liées à la publicité ciblée par centres d’intérêt en ligne dans un énoncé de confidentialité affiché publiquement ou dans tout autre avis, et y indiquer leur conformité avec les principes.Inclure un lien clair, explicite et bien visible sur les pages Web où des données sont recueillies ou utilisées par des tiers à des fins de publicité ciblée par centres d’intérêt en ligne. Ce lien doit être situé au-dessus de la ligne de flottaison de la page Web (partie supérieure) et renvoyer soit i) au site Web de l’industrie, soit ii) à une liste des tiers avec lesquels collabore l’entreprise participante.Les exploitants de sites Web doivent prendre des mesures raisonnables et appropriées pour s’assurer qu’une option de retrait est offerte par les tiers qui recueillent ou utilisent des données sur leur site Web à des fins de publicité ciblée par centres d’intérêt en ligne. Les mesures raisonnables et appropriées qu’ils peuvent prendre comprennent :La tenue d’un inventaire et la prise d’autres mesures nécessaires pour comprendre quels sont les tiers qui affichent de la publicité ciblée par centres d’intérêt sur leur site Web, etLa conclusion de contrats avec ces tiers, au besoin, afin de s’assurer que les avis ou les options de retrait nécessaires sont disponibles.Au sujet des tiersSi votre entreprise fait de la PCL sur un autre site Web, vous pouvez alors aussi être considéré comme un tiers. Vous devrez par conséquent vous conformer aux sections des principes et du Guide de mise en œuvre à l’intention des tiers qui font ce type de publicité."
