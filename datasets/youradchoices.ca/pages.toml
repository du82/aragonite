["https://youradchoices.ca/en/news/2024/6/13/daac-honoured-with-prestigious-piccaso-award-for-not-for-profit-leadership-in-canada"]
title = "DAAC Honoured with Prestigious PICCASO Award for Not for Profit Leadership in Canada — AdChoices in Canada"
description = "The Digital Advertising Alliance of Canada (DAAC) is pleased to announce that we have received the Not for Profit Leadership Award at the inaugural   PICCASO Awards Canada  ! This recognition brings greater awareness and support for our self-regulatory programs.  The award was announced on June 11 a"
full_description = 'DAAC Honoured with Prestigious PICCASO Award for Not for Profit Leadership in Canada The Digital Advertising Alliance of Canada (DAAC) is pleased to announce that we have received the Not for Profit Leadership Award at the inaugural PICCASO Awards Canada! This recognition brings greater awareness and support for our self-regulatory programs.The award was announced on June 11 at the awards ceremony held at the beautiful Toronto Region Board of Trade.The panel of expert judges, including former federal Privacy Commissioner, now at Dentons, Chantal Bernier, former UK Information Commissioner Elizabeth Denham, and prominent professor and thought-leader Khaled El Emam of the University of Ottawa, along with other renowned privacy representatives, significantly enhance the integrity of this award.The DAAC greatly thanks these judges and the wonderful PICCASO Canada Advisory Board for their support.This award marks a decade of our operations. It underscores the growing imperative for brands, publishers, and ad tech providers to embrace ethical online advertising in the face of evolving technologies for interest-based advertising and new privacy laws in Canada.We hope this award brings more interest to the AdChoices self-regulatory program and encourages organizations not yet participating to join. Tell us PICCASO sent you! <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718802459338-53R1GO5NU0I77Y0979Q3/VINC3589.jpg" alt="VINC3589.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718802439681-01AJDIMIK3V0HAYYI1TE/VINC3627.JPG" alt="VINC3627.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718802545627-28XWCV12E387NR3LNH3F/VINC3781.jpg" alt="VINC3781.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718802476343-KIQEZ3JX53ZIIW73T89M/VINC4059.jpg" alt="VINC4059.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718802536452-PCEUH9UQ04LITTQIKD4N/VINC4066.jpg" alt="VINC4066.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718802597766-2ZQWIIQZ5P7W9V9Y2ZU8/VINC4188.jpg" alt="VINC4188.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718802621859-5FXKKLJOY1WHE1DHEPWW/VINC3556.jpg" alt="VINC3556.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5c055f98620b858a898bfcae/1718803433448-PRD6G1T8U81FQMH9Y0R4/20240611_212533.jpg" alt="20240611_212533.jpg" /> #block-yui_3_17_2_1_1718802313330_43949 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1718802313330_43949 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } DAACJune 13, 2024#PICCASOAwardsCanada24, PICCASO, PICCASO Awards, #AdChoices, PICCASO Canada Facebook0 LinkedIn0 0 Likes'
