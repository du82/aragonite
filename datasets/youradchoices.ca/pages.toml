["https://youradchoices.ca/en/tools"]
title = "Opt-Out Tools — AdChoices in Canada"
description = """
The AdChoices self-regulatory program in Canada provides free tools you can 
use to opt-out of interest-based advertising on your devices."""
full_description = "Scroll Tools Made For YouAdChoices offers you a window into the advertising world, showing you who is engaging in interest-based advertising on your browsers and mobile devices.Our tools allow you to opt out of interest-based advertising from companies registered with our not-for-profit organization.AdChoices is not an ad blocker. The opt-out process does not opt you out of receiving all ads, only interest-based ads. You will continue to get ads after you opt out; they will just not have any special relevance to your interests.AdChoices is not an advertising company. We do not control the content of specific ads, where they are placed, or how frequently you see them. Instead, AdChoices enables users to control how companies use their data to personalize ads based on their perceived interests.See below for the multiple tools we offer. WebChoicesWebChoices is a browser-based tool for opting out of interest-based advertising. Launch the WebChoices tool to manage your sharing preferences on your web browsers.Each browser you use may have different results, depending on which cookies or advertising IDs are being used. Learn more WebChoices Tutorial Launch WebChoices Tool ATTENTION Safari Users - Apple’s Intelligent Tracking Prevention limits our ability to respect opt-out requests as we have in the past. While opt-out still works today, it has a limited life. Unless you regularly return to use our WebChoices tool, the opt-out cookies will be cleared by Apple. In the interim, you can adjust your settings to accept third-party cookies and then opt-out using the WebChoices tool. AppChoicesA mobile-based tool for opting out of interest-based advertising across apps. Select your operating system to manage your sharing preferences on your mobile device.AppChoices does not stop ads from being shown on your device. It stops the interest-based ad targeting that happens in the background from the companies listed. Learn more Apple Android Amazon Token ToolSome companies use token identifiers for interest-based advertising. You can opt out of this practice using our Token ID-Based Choices Tool.Please note that any identifier submitted within this tool, such as an email address, will not opt you out of email subscriptions, other email services, or other uses of the identifier you provide in which you may have enrolled or from which you receive communications. Launch the Token Tool Token Tool FAQ ProtectMy ChoicesPreserve the opt-out preferences you set on your browser. The DAAC offers browser plug-ins to retain opt-out cookie preferences, even if you delete your cookies. Chrome Firefox Cookies & Browser ControlsMost modern web browsers contain extensive controls that give you the ability to make choices about your privacy. These controls enable you to block or limit cookies. Chrome Edge Firefox Internet Explorer Opera Safari Your Choices WebChoices AppChoices Token Tool Protect My Choices Cookies & Browser Controls"
year_published = 2024
year_updated = 2024
clearnet = "https://youradchoices.ca/en/tools"
