["https://youradchoices.ca/en/news/2024/4/23/2023-highlights-from-the-adchoices-accountability-program-compliance-report"]
title = "2023 Highlights from the AdChoices Accountability Program Compliance Report — AdChoices in Canada"
description = "The Digital Advertising Alliance of Canada (DAAC) is proud to share highlights from the   Ad Standards 2023 AdChoices Accountability Program Compliance Report  . Our collective focus on enhancing consumer privacy in digital advertising continued to make significant progress, thanks to the diligent e"
full_description = "2023 Highlights from the AdChoices Accountability Program Compliance Report The Digital Advertising Alliance of Canada (DAAC) is proud to share highlights from the Ad Standards 2023 AdChoices Accountability Program Compliance Report. Our collective focus on enhancing consumer privacy in digital advertising continued to make significant progress, thanks to the diligent efforts of all participants.Key Findings:80% of participants completed and returned the new Self-Attestation Form (new for 2023), a crucial step in verifying adherence to the updated DAAC Principles on Interest-Based Advertising (IBA). This commitment to transparency is a cornerstone of the AdChoices program.Ad Standards received 525 consumer complaints in 2023, a significant decrease from the previous year (626 in 2022). Of these, 25 were related to IBA, and consumers were given directions on how to rectify their issues.Ad Standards' continued education on IBA practices and the importance of transparency has been central, ensuring consumers are well-informed about how their data is used in advertising.The 2023 report emphasizes the importance of the Self-Attestation Form in maintaining the integrity of the AdChoices program. Although overall compliance dipped slightly due to the new form requirement, the proactive engagement from participants suggests a positive trajectory toward full compliance.We encourage everyone to read the full report to understand the detailed findings, and the DAAC appreciates our participants’ collective efforts to enhance transparency and control in digital advertising.Together, we are setting higher standards for consumer privacy in digital advertising. Let's continue to build a trustworthy digital advertising ecosystem. Is your organization not yet an AdChoices program participant? We welcome all companies involved in targeted advertising to explore the benefits of our program and join us. DAACApril 23, 2024compliance report, compliance, Ad Standards, accountability Facebook0 LinkedIn0 0 Likes"
