["https://youradchoices.ca/fr/lexique"]
title = "Lexique des termes du programme — AdChoices in Canada"
description = "Découvrez sur ce site un lexique complet de tous les termes employés par le programme  programme canadien Choix de pub."
full_description = "Lexique des termes du programme Au-dessus de la ligne de flottaison Placement de l’avis renforcé dans un endroit du site Web ou de l’application qui est bien visible, sans que l’utilisateur n’ait à faire défiler l’écran ou à naviguer. Icône et texte Choix de pub Icône sous licence de la DAAC, associée au texte « Choix de pub » ou « AdChoices » qui l’accompagne, qui peut être utilisée comme avis renforcé ou comme avis placé dans une publicité afin d’informer les consommateurs des activités de PCL sur un site Web ou dans une application mobile donnés Données entre applications Données recueillies à partir d’un appareil en particulier sur l’utilisation d’une application au fil du temps et dans d’autres applications dans le but de présenter de la publicité ciblée par centres d’intérêt dans une application. Les données entre applications n’incluent pas les données de localisation précises ni les données de répertoires personnels. Avis renforcé Avis clair, explicite et bien visible d’activités de PCL, le plus souvent mis en oeuvre en affichant l’icône et le texte Choix de pub « au-dessus de la ligne de flottaison » d’un site Web ou d’une application mobile; cet avis est parfois présenté dans une bannière ou dans une fenêtre contextuelle qui informe l’utilisateur des activités de PCL. Propriétaire de site Participant au programme Choix de pub qui exploite ou qui contrôle un site Web avec lequel le consommateur interagit et qui permet à des tiers de recueillir et d’utiliser les données du consommateur à l’aide de son site. Avis placé dans une publicité Avis de PCL situé dans le coin d’une publicité et qui prend la forme de l’icône et du texte Choix de pub (c’est-à-dire qu’il informe l’utilisateur que la publicité présentée peut être ciblée par centres d’intérêt). Publicité ciblée par centres d’intérêt (PCL) Collecte de données en ligne à partir d’un ordinateur ou d’un appareil en particulier, portant sur les activités de navigation sur le Web ou sur les activités dans les applications mobiles, dans le but d’utiliser ces données pour prédire les préférences ou les intérêts des utilisateurs et pour présenter de la publicité axée sur les préférences ou les intérêts déduits de ces activités de navigation et/ou des activités dans les applications. Mécanisme de retrait Outil ou tout autre moyen grâce auquel un consommateur peut refuser la collecte et l’utilisation de ses données à des fins de PCL. Données de répertoires personnels (DRP) Données provenant du calendrier, du carnet d’adresses, de l’historique des appels/messages textes ou des photos/vidéos créés par un consommateur, qui sont stockées dans un appareil spécifique ou auxquelles on peut avoir accès à l’aide de cet appareil et qui sont obtenues dans le but de présenter de la publicité ciblée par centres d’intérêt dans une application. Données de localisation précises (DLP) Données obtenues à partir d’un appareil sur l’emplacement géographique de l’appareil, qui sont suffisamment précises pour situer une personne ou un appareil en particulier dans le but de présenter de la publicité ciblée par centres d’intérêt dans une application. Tiers Participant au programme Choix de pub, qui fait de la publicité ciblée par centres d’intérêt (PCL) sur le site Web ou dans une application mobile d’un propriétaire – il s’agit des réseaux publicitaires et des entreprises de données qui recueillent des données sur les pages ou les applications consultées sur de multiples sites Web et/ou dans de multiples applications et qui utilisent ces données pour présenter de la publicité ciblée par centres d’intérêt en ligne."
year_published = 2024
year_updated = 2024
