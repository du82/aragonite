title = "WebChoices — AdChoices in Canada"
full_description = "WebChoicesWebChoices is a browser-based tool for opting out of interest-based advertising. Launch the WebChoices tool to manage your sharing preferences on your web browsers.Each browser you use may have different results, depending on which cookies or advertising IDs are being used. Learn more WebChoices Tutorial Launch WebChoices Tool ATTENTION Safari Users - Apple’s Intelligent Tracking Prevention limits our ability to respect opt-out requests as we have in the past. While opt-out still works today, it has a limited life. Unless you regularly return to use our WebChoices tool, the opt-out cookies will be cleared by Apple. In the interim, you can adjust your settings to accept third-party cookies and then opt-out using the WebChoices tool."
