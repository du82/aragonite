["https://youradchoices.ca/fr/actualites/2023/2/22/une-approche-uniformise-quant-aux-contrles-propres-aux-cmp-et-aux-choix-en-matire-de-vie-prive-lchelle-du-rseau"]
title = "Une approche uniformisée quant aux contrôles propres aux CMP et aux choix en matière de vie privée à l’échelle du réseau et Choix de pub — AdChoices in Canada"
description = "Les Alliances de la publicité numérique (DAA) régionales publient des spécifications techniques pour aider les marques et les éditeurs à simplifier et à améliorer l’expérience utilisateur en matière de choix &nbsp;   New York-Toronto-Buenos Aires – le 14 février 2023  – Une coalition d’organisme"
full_description = "Une approche uniformisée quant aux contrôles propres aux CMP et aux choix en matière de vie privée à l’échelle du réseau et Choix de pub Les Alliances de la publicité numérique (DAA) régionales publient des spécifications techniques pour aider les marques et les éditeurs à simplifier et à améliorer l’expérience utilisateur en matière de choix New York-Toronto-Buenos Aires – le 14 février 2023 – Une coalition d’organismes d’autoréglementation de premier plan en matière de protection de la vie privée lançait plus tôt aujourd’hui une approche uniformisée à l’intention des marques et des éditeurs, qui leur permet d’offrir des paramètres de contrôle de la vie privée sur leurs sites et dans leurs applications à l’aide de plateformes de gestion du consentement (CMP) et du programme Choix de pub.Grâce à ces nouvelles lignes directrices concernant les interfaces utilisateurs et de nouvelles spécifications techniques qui simplifient et améliorent l’expérience utilisateur, les marques et les éditeurs peuvent intégrer l’icône Choix de pub reconnue mondialement dans le flux d’utilisateurs d’une CMP participante, donnant ainsi accès aux consommateurs à la fois aux paramètres de contrôle propres aux CMP et aux choix offerts à l’échelle de l’industrie sur les portails des DAA. Il n’y a pas eu, historiquement, d’intégration technique ou d’IU entre l’icône Choix de pub et les outils des CMP en matière de choix. La nouvelle orientation et les nouvelles spécifications – collectivement appelées « CMP Complement » (Complément des CMP) – permettront aux marques et aux utilisateurs d’offrir l’accès à la fois aux choix traditionnellement offerts par les CMP et aux outils de choix plus larges offerts actuellement par les DAA en matière de publicité ciblée par centres d’intérêt. Publié par une coalition internationale d’Alliances de la publicité numérique (DAA), le Complément des CMP permet aux plateformes de gestion du consentement participantes de refléter les choix des consommateurs fondés sur le jeton d’identité[1], sur leurs sites Web et dans leurs applications affiliés; ainsi, les consommateurs peuvent voir les choix faits à l’aide des outils des DAA sur la trace numérique de la CMP si les clients de cette dernière activent cette nouvelle fonctionnalité. Figurent parmi les éléments du nouveau Complément des CMP : Une utilisation uniformisée de l’icône bien connue Choix de pub par les marques et par les éditeurs à l’aide des CMP participantes, en tant que passerelle vers les outils de retrait propres à une propriété numérique et vers les programmes AdChoices/Choix de pub actuels et distincts au niveau de l’industrie, qui sont gérés par les DAA de chaque région.Une transparence accrue grâce à l’utilisation de l’icône Choix de pub et à un module/flux d’utilisateurs dédié dans le but d’offrir de l’information et des choix aux consommateurs en tirant parti de ce nouveau « bien immobilier » fourni par les CMP participantes.Une spécification commune pour les CMP qui permet à certaines fonctionnalités de refléter les préférences fondées sur le jeton d’identité et exprimées au moyen de l’intégration de la CMP à l’interface d’utilisation de la CMP de la DAA. Le Complément des CMP permet aux consommateurs d’utiliser l’icône universelle Choix de pub pour accéder à une console de CMP ainsi qu’à l’information et aux choix des DAA concernant les publicités pertinentes, faisant ainsi progresser la mission des DAA dans l’affichage d’avis en temps réel et de contrôle ailleurs que dans la politique de confidentialité. Les marques et les éditeurs peuvent travailler avec les CMP participantes pour diriger les consommateurs vers un module ou un flux d’utilisateurs dédié au sein de la CMP qui porte sur la publicité pertinente, afin de renforcer leurs mentions Choix de pub existantes conjointement avec une CMP participante. Ce module ou flux d’utilisateurs dédié Choix de pub peut être proposé directement à l’aide de l’icône Choix de pub sur un site Web (par ex., un pied de page) ou dans une application (par ex., un menu latéral) pour contribuer à créer une expérience cohérente pour le consommateur.Figurent parmi les CMP partenaires reconnues par les DAA, qui participent à la phase d’essais pilotes du lancement, TrustArc, Evidon from Crownpeak et Didomi. Figure 1: Exemple de la façon dont l’accès aux outils de retrait des DAA est présenté sur une CMP reconnue par les DAA. « Le Complément des CMP permet aux consommateurs d’utiliser l’icône bien connue Choix de pub pour accéder aux choix offerts (et pour les exercer) à l’échelle du réseau par les outils des DAA, même par l’entremise d’une CMP, au moyen d’une interface de renom et de confiance à la fois sur les sites Web et dans les applications. De plus, les CMP participantes peuvent aider les consommateurs en leur permettant de voir leurs choix et leurs préférences fondés sur un jeton d’identité reflétés dans le réseau de sites et d’applications d’un client d’une CMP. Ce type d’accès à des mécanismes de retrait entre les sites assurera une expérience consommateur fiable et bien comprise tout en permettant aux CMP d’offrir un service plus utile et plus robuste aux consommateurs et aux propriétés numériques qu’elles servent. » - Lou Mastria, directeur général, Digital Advertising Alliance« L’uniformisation des choix des consommateurs est ce que les DAA savent faire le mieux depuis toujours. Nous offrons une ressource centralisée sur laquelle peuvent s’appuyer les agences de publicité. Ce travail – qui consiste à relier les choix des consommateurs aux multiples CMP (et même aux plateformes de données sur les consommateurs) actives dans nos marchés – témoigne des travaux d’envergure dont sont capables les DAA, ce qui procurera, nous l’espérons, réconfort et soutien aux participants de notre programme qui choisissent d’utiliser à la fois les CMP et Choix de pub. » – Julie Ford, directrice exécutive, Alliance de la publicité numérique du Canada « Nous sommes encouragés par les progrès des associations partenaires internationales et nous réjouissons notamment du fait que nous pouvons offrir des choix explicites et un contrôle qui sont conformes à la constante évolution du marché et des attentes des consommateurs dans les territoires respectifs. Nous continuerons de collaborer de près avec le réseau mondial des DAA dans le but d’harmoniser davantage les outils destinés aux consommateurs et d’offrir une valeur accrue à tous les participants du programme, tout en continuant de s’adapter aux spécificités du marché européen. » – Dr Ionel Naftanaila, directeur, Développement du programme, European Interactive Digital Advertising Alliance« L’un des plus grands avantages de notre programme d’autoréglementation actuel en matière de publicité numérique tient à notre capacité d’être rapides, souples et réactifs face aux besoins des consommateurs. L’innovation est guidée par les changements rapides qui s’opèrent sur le plan technologique et des modèles d’affaires, et nous adaptons notre programme d’autoréglementation à ces changements afin de continuer à offrir de l’information et un contrôle aux consommateurs à l’aide d’une nouvelle orientation et de nouveaux outils comme celui qui est annoncé aujourd’hui. » – Mary Teahan, coordonnatrice, Alianza de Publicidad Digital de Argentina« TrustArc s’est toujours efforcée d’offrir une large gamme d’outils conformes, cohérents et faciles à utiliser qui permettent d’exercer un choix en matière de vie privée, et le nouveau Complément des CMP des DAA vient renforcer cet objectif. En tant que partenaire de longue date, TrustArc est ravie de travailler avec les DAA pour intégrer le Complément des CMP à notre plateforme de sorte que les entreprises puissent mieux comprendre et respecter les préférences des consommateurs sur leurs diverses propriétés numériques. » – Chris Babel, chef de la direction, TrustArc« Les outils et les conseils proposés dans le Complément des CMP des DAA ajouteront de la valeur à notre plateforme de gestion du consentement unifiée (UCP) à la fois pour les entreprises et pour les consommateurs en offrant plus de choix aux consommateurs sur un plus large éventail de propriétés, tout en intégrant sans difficulté dans l’UCP les choix exercés à l’aide des outils Choix de pub des DAA. Nous sommes ravis de nous joindre aux DAA dans le cadre du déploiement de cette importante initiative et sommes heureux de poursuivre notre collaboration avec elles dans le futur. » – William Broadhead, vice-président, Ingénierie, Amérique du Nord, Crownpeak« Les outils servant à demander le consentement ne doivent pas constituer un obstacle pour les consommateurs, mais bien une occasion pour eux d’améliorer leur expérience. Voilà pourquoi nous sommes ravis de travailler avec les DAA dans le but d’élargir la portée des choix offerts aux consommateurs et de recueillir de l’information exploitable sur des sujets que ceux-ci souhaitent voir aborder. » – Jeffrey Wheeler, chef de produit, Amérique du Nord, DidomiLe Complément des CMP a pour but d’offrir de la souplesse aux entreprises, dans les marchés locaux et régionaux, afin qu’elles puissent concevoir des interfaces utilisateurs novatrices qui sont conformes aux exigences réglementaires et d’autoréglementation en vigueur, tout en rendant l’accès aux options de retrait existantes et attendues plus facile pour les consommateurs. Les outils de retrait destinés aux consommateurs, qui sont affiliés aux DAA, sont désormais disponibles dans 36 pays et dans 28 langues. D’abord lancée en 2010, la coalition des DAA comprend la Digital Advertising Alliance (US), l’Alliance de la publicité numérique du Canada (DAAC) et l’Alianza de Publicidad Digital de Argentina (APDA). Le Complément des CMP est également reconnu par l’European Interactive Digital Advertising Alliance (EDAA), dont le siège social est à Bruxelles. Les programmes AdChoices/Choix de pub des États-Unis, du Canada, de l’ensemble des pays de l’EEE, de Suisse, de Turquie, du Royaume-Uni et d’Argentine aident les entreprises à présenter aux consommateurs, ailleurs que dans leur politique de confidentialité, des avis renforcés sur la collecte et sur l’utilisation de données à des fins de présentation de publicités pertinentes. Les fournisseurs de CMP et autres entreprises intéressés peuvent obtenir plus d’information sur le Complément des CMP des DAA, y compris les spécifications techniques et des renseignements sur son intégration, en communiquant avec la DAA (info@aboutads.info). La DAA compte compléter les essais pilotes de l’outil et déployer ce dernier d’ici le deuxième trimestre de 2023. Elle compte également y intégrer peu après des contrôles par catégorie de centres d’intérêt. Au sujet de la Digital Advertising AllianceLa Digital Advertising Alliance (DAA) est un organisme indépendant et sans but lucratif qui établit et fait respecter des pratiques responsables en matière de protection de la vie privée à des fins de publicité numérique pertinente, tout en offrant aux consommateurs information et contrôle sur les types de publicités numériques qu’ils reçoivent. La DAA administre les programmes YourAdChoices, AppChoices sur les appareils mobiles, PoliticalAds et PrivacyRights.info. Le travail de la DAA repose sur ses principes d’autoréglementation, y compris des mises à jour pour traiter des changements qui s’opèrent sur le plan technologique et des modèles d’affaires quant aux données multiples, mobiles et entre appareils. La conformité avec les principes de la DAA est mise en application de manière indépendante pour toutes les entreprises qui s’adonnent à la publicité numérique, par les BBB National Programs (BBBNP) et par l’Association of National Advertisers (ANA). La DAA est gérée par un regroupement d’associations professionnelles nationales de premier plan en publicité et en marketing, dont notamment 4A's, l’American Advertising Federation. l’ANA, l’Interactive Advertising Bureau et la Network Advertising Initiative, conformément aux conseils de BBBNP.Au sujet de la l’Alliance de la publicité numérique du CanadaL’Alliance de la publicité numérique du Canada (DAAC) est un regroupement d’associations nationales de publicité et de marketing de premier plan, dont les membres partagent la volonté d’offrir un programme robuste et crédible permettant d’assurer une publicité ciblée par centres d’intérêt en ligne responsable. La DAAC a développé en 2013 le programme canadien AdChoices/Choix de pub qui a pour but de renseigner les consommateurs sur la publicité ciblée par centres d’intérêt et de leur offrir des mécanismes qui leur permettent de savoir si ce type de publicité leur est présentée et d’exercer un contrôle en acceptant ou en refusant la collecte et l’utilisation de leurs données de navigation à des fins de publicité ciblée par centres d’intérêt. L’organisme d’autoréglementation indépendant Normes de la publicité assume le volet Responsabilité du programme. Les entreprises peuvent se référer aux principes Choix de pub de la DAAC et en apprendre davantage à votrechoixdepub.ca Au sujet de l’European Interactive Digital Advertising AllianceL’EDAA a été créée en 2012 par un regroupement de l’industrie européenne représentant des annonceurs, le secteur des agences de publicité, le secteur du marketing interactif et du marketing direct, le secteur des technologies publicitaires et le secteur des médias. L’EDAA est régie par des organisations de l’UE qui constituent la chaîne de valeur de la publicité fondée sur les données en Europe et qui assurent l’uniformité de l’approche européenne face à l’autoréglementation. Les principes directeurs de l’EDAA sont décrits dans European Industry Self-Regulatory Framework for Data-Driven Advertising et dans Best Practice Recommendation for Online Behavioural Advertising de l’Alliance européenne pour l’éthique en publicité (AEEP/EASA).Au sujet de l’Alianza para la Publicidad Digital de ArgentinaL’Alliance for Digital Advertising of Argentina (APDA) établit et contrôle les pratiques en matière de publicité numérique en Argentine, offrant aux consommateurs une transparence et un contrôle accrus au moyen de ses divers principes qui s’appliquent aux données multisites et aux données croisées recueillies dans des environnements informatiques ou mobiles. L’APDA est un organisme indépendant sans but lucratif dirigé par les chambres de commerce des secteurs de la publicité et du marketing.###[1] Les « jetons » constituent la nouvelle génération d’identifiants des consommateurs sur le Web et dans les applications, qui sont utilisés pour présenter à ces derniers du contenu publicitaire pertinent. L’outil votrechoixdepub des DAA permet aux consommateurs d’autoriser la collecte de données et repose sur un « jeton » d’identité, tel qu’une adresse électronique ou un numéro de téléphone hachés, pour que ce choix soit activé. DAACFebruary 22, 2023 Facebook0 LinkedIn0 0 Likes"
