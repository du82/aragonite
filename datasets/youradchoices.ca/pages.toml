["https://youradchoices.ca/fr/actualites/2022/10/18/la-daac-publie-une-version-actualise-de-ses-principes-rgissant-la-publicit-cible-par-centres-dintrt"]
title = "La DAAC publie une version actualisée de ses principes régissant la publicité ciblée par centres d’intérêt  — AdChoices in Canada"
description = "Plus tôt aujourd’hui, l’Alliance de la publicité numérique du Canada (DAAC) publiait un ensemble de principes actualisés visant à assurer la conformité de la publicité ciblée par centres d’intérêt avec son programme d’autoréglementation Choix de pub.  Les membres de l’association ainsi que les parti"
full_description = "La DAAC publie une version actualisée de ses principes régissant la publicité ciblée par centres d’intérêt Plus tôt aujourd’hui, l’Alliance de la publicité numérique du Canada (DAAC) publiait un ensemble de principes actualisés visant à assurer la conformité de la publicité ciblée par centres d’intérêt avec son programme d’autoréglementation Choix de pub.Les membres de l’association ainsi que les parties prenantes du programme ont travaillé assidument sur ces principes pendant plus d’un an et demi. De nombreuses lois en matière de protection de la vie privée – y compris le récent projet de loi C-27 du gouvernement fédéral, Loi de 2022 sur la mise en œuvre de la Charte du numérique –, ont été examinées durant le processus.Ce nouvel ensemble de principes : Adopte officiellement l’expression « publicité ciblée par centres d’intérêt » plutôt que « publicité comportementale en ligne »Fusionne en un seul document les principes de la DAAC qui s’appliquent à l’environnement mobileAjoute des commentaires permettant d’établir les attentes en matière de conformité; des orientations complémentaires seront publiées séparément, qui aideront les participants à mieux interpréter la conformité avec le programmeIntègre le concept d’un « avis en langage clair » à l’information par couches fournie sur la publicité ciblée par centres d’intérêtIndique que lorsqu’une entité recourt à une plateforme de gestion du consentement (CMP), un avis sur la publicité ciblée par centres d’intérêt doit toujours être disponible (par ex., dans le bas de page d’un site Web)Les participants au programme Choix de pub devraient examiner ces nouveaux principes le plus tôt possible. Télécharger les principes de la DAAC 2022 À compter du 1er janvier 2023, les Normes de la publicité utiliseront ces nouveaux principes comme document de base pour évaluer la conformité des participants avec le programme.« Maintenant que la révision des principes est terminée et après que les parties prenantes les aient examinés et analysés en profondeur, le conseil d’administration de la DAAC et les membres de cette dernière ont davantage confiance en la structure du programme », de déclarer la présidente du Conseil de la DAAC, Mme Caroline Moul. « Nous sommes impatients de développer davantage le programme de nouvelles façons en vue de soutenir les participants à notre programme ».Avant de s’attaquer aux principes, la DAAC lançait en mai dernier un nouvel outil Choix fondés sur le jeton d’identité qui permet aux consommateurs canadiens de refuser la publicité ciblée par centres d’intérêt provenant d’entreprises qui utilisent, comme identifiants, des adresses électroniques « hachées ». Prochainement, des catégories de centres d’intérêt seront affichées dans l’outil afin d’offrir aux consommateurs des choix encore plus précis.Les participants actuels au programme Choix de pub ainsi que les entreprises intéressées à y participer peuvent nous faire parvenir leurs questions au sujet de ces nouveaux principes ou de l’outil Choix fondés sur le jeton d’identité à info@daac.ca. DAACOctober 18, 2022publicité ciblée, principes, choix de pub, AdChoices Facebook0 LinkedIn0 0 Likes"
