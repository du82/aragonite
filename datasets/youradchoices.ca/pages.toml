ite users directory or other user or usage information or any portion thereof other than in the context of your use of the Website.DISCLAIMER / LIMITATION OF LIABILITYTHE LAWS OF CERTAIN JURISDICTIONS, INCLUDING QUEBEC, DO NOT ALLOW THE EXCLUSION OR LIMITATION OF LEGAL WARRANTIES, LIABILITY OR CERTAIN DAMAGES OR LIMITATIONS OF REPRESENTATIONS MADE CONCERNING GOODS OR SERVICES. IF THESE LAWS APPLY TO YOU, SOME OR ALL OF THE BELOW EXCLUSIONS OR LIMITATIONS MAY NOT APPLY TO YOU.ALTHOUGH WE STRIVE TO UPDATE AND KEEP ACCURATE AS MUCH AS POSSIBLE THE CONTENT CONTAINED ON THE WEBSITE, ERRORS AND/OR OMISSIONS MAY OCCUR. ACCORDINGLY, THIS WEBSITE, INCLUDING THE CONTENT AND SERVICES PROVIDED HEREIN, IS BEING PROVIDED ON AN “AS IS” AND “AS AVAILABLE” BASIS AND WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, EITHER EXPRESS OR IMPLIED. DAAC DISCLAIMS ALL WARRANTIES AND CONDITIONS, EXPRESS OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, IMPLIED WARRANTIES AND CONDITIONS OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND NON-INFRINGEMENT. DAAC DOES NOT WARRANT THAT THE FUNCTIONS ON THE WEBSITE WILL BE UNINTERRUPTED, ERROR-FREE OR FREE OF VIRUSES OR OTHER HARMFUL COMPONENTS.IN NO EVENT SHALL DAAC BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, OR CONSEQUENTIAL DAMAGES THAT RESULT FROM OR IN CONNECTION WITH THE USE OF, OR THE INABILITY TO USE, THE WEBSITE OR ANY CONTENT OR SERVICES OBTAINED THROUGH THE WEBSITE, EVEN IF DAAC HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES.YOU EXPRESSLY RELEASE AND HOLD DAAC HARMLESS FROM ANY AND ALL CLAIMS, LOSSES, LIABILITY, DAMAGES, INJURIES AND EXPENSES (INCLUDING, WITHOUT LIMITATION, PERSONAL INJURY CLAIMS) ARISING OUT OF OR RELATING TO YOUR USE OF THE WEBSITE.INDEMNITYYou agree to indemnify and hold harmless DAAC, its affiliates, and its and their respective members, officers, employees, agents, and licensors from and against any and all losses, expenses, damages, claims, fines, penalties, costs and liabilities (including reasonable