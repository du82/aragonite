["https://youradchoices.ca/fr/actualites/2023/9/11/-la-mmoire-de-janet-callaghan"]
title = "À la mémoire de Janet Callaghan — AdChoices in Canada"
description = "C’est avec un profond regret que nous informons la communauté de la publicité ciblée par centres d’intérêt et du marketing du décès de Janet Callaghan.  Janet était une fervente partisane de l’Alliance de la publicité numérique du Canada (DAAC) et a été un membre fondateur de son conseil d’administr"
full_description = "À la mémoire de Janet Callaghan C’est avec un profond regret que nous informons la communauté de la publicité ciblée par centres d’intérêt et du marketing du décès de Janet Callaghan.Janet était une fervente partisane de l’Alliance de la publicité numérique du Canada (DAAC) et a été un membre fondateur de son conseil d’administration. En tant qu’ancienne directrice exécutive du Canadian Media Directors’ Council (CMDC), Janet a siégé à la table de la DAAC dans le but de favoriser l’unité de l’industrie. Son esprit vif, son intégrité, sa chaleur humaine et son sens inégalé de la mode manqueront grandement aux membres et au personnel de la DAAC. Nous te remercions Janet pour tes précieux conseils et pour ta bienveillance tout au long de ces années. Un don a été fait en l’honneur de Janet à Parkinson Canada.https://obituaries.thestar.com/obituary/janet-callaghan-1088800527/ DAACSeptember 11, 2023Janet Callaghan Facebook0 LinkedIn0 0 Likes"
