full_description = "Authentication standards Built in partnership with open standards organizations Home » Authentication standards Making the internet safer for everyone Strong security Stolen credentials from employees, vendors and customers are at the root of the majority of account takeovers. The YubiKey provides advanced phishing protection to stop account takeovers. Ease of use The YubiKey is crush-resistant and water-resistant. It requires no battery or cellular network connectivity and its simple touch authentication is four times faster than typing a One Time Password. Standardization Yubico is a key contributor to the development of open authentication protocols in order to deliver security in a standardized way across browsers and platforms. Expanding authentication options Passwordless authentication Eliminate weak password-based authentication and replace with strong single factor authentication using a hardware authenticator. About passwordlessAbout passwordless Two-factor authentication (2FA) Experience strong two-factor authentication using a hardware authenticator as an extra layer of protection beyond a password. About 2FAAbout 2FA Multi-factor authentication (MFA) Achieve the highest levels of security with strong multi-factor authentication using a hardware authenticator and a PIN or biometric. About MFAAbout MFA Our standards organization memberships Learn more about authentication standards WebAuthn a global authentication standard for web browsers, delivers users greater choice of authenticators to secure accounts, including security keys and built-in platform authenticators available in modern devices. Learn about WebAuthn > FIDO2 is an evolution of FIDO U2F and offers the same high level of security, with expanded authentication options such as Passwordless, 2FA and MFA. Learn about FIDO2 > Smart Card/PIV functionality based on the Personal Identity Verification (PIV) interface specified in NIST SP 800-73, supporting sign/decrypt operations using a private key stored on the smart card. Learn about Smart Card/PIV > FIDO U2F is an open authentication standard, based on public key cryptography, enabling a single security key to access hundreds of online services without drivers or client software. Learn about FIDO U2F >"
