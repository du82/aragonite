["https://www.yubico.com/events"]
title = "Events | Yubico"
description = "Stay up-to-date with the latest Yubico events. Explore our events page to find out about our upcoming webinars, trade shows, and more. Join us today!"
full_description = "Events See Yubico at upcoming in-person and virtual events Home » Events Upcoming Events Yubico is proudly represented at in-person events all over the world. We invite you to join us at our booths, speaking sessions and meeting spaces wherever you may be heading this year. If you would like to schedule a meeting with us onsite at any of the below events, please email yubicoevents@yubico.com and we’ll connect you with an on-site authentication expert! FIDO Alliance Melbourne Seminar February 7 | Melbourne, Australia Join Yubico at the FIDO Alliance Melbourne Seminar for a pivotal one-day seminar exploring the transformative power of passkey authentication in Australia and beyond. This dynamic event will attract 150-200 influential leaders and decision-makers from government, consumer, and enterprise sectors to explore the future of secure online identity in Australia, New Zealand, and overseas. The agenda will cover use cases, case studies, and the latest data and collaboration happening to implement passkeys for consumers, workers, and governments regionally and around the world. We hope to meet you at our booth or speaking session. mysecurityevent February 18-20 | Cologne, Germany This is where the cyber security community meets for a secure world. Meet Yubico at our booth #9 and catch our presentation on Wednesday at 5:20 PM. ManuSec Europe February 25-26 | Munich, Germany The 7th Edition of ManuSec Europe will bring together top IT & OT security professionals from across Europe’s biggest manufacturers – tasked with protecting us from the biggest cyber threats facing our manufacturers. Join us and key security leaders from across Europe’s biggest companies to network, learn, be inspired, and collaborate towards new strategies for cyber resilience. This edition of ManuSec Europe focuses on “Fortifying Factories: Cyber Defence for the Digital Age.” Meet Yubico at our booth and attend our roundtable on Tuesday at 4:10 PM: “Adopting durable and doable authentication for shared workstations on the factory floor”. Gartner Security & Risk Management Summit March 3-4 | Sydney, Australia The Gartner Security & Risk Management Summit helps security and risk management leaders and practitioners to continuously improve the flexibility and responsiveness of security risk management techniques and technology to achieve mission objectives. Join Yubico at the premier cybersecurity conference for security and risk leaders in APAC and learn why not all MFA is created equal. Join Yubico at the FIDO Alliance Melbourne Seminar for a pivotal one-day seminar exploring the transformative power of passkey authentication in Australia and beyond. This dynamic event will attract 150-200 influential leaders and decision-makers from government, consumer, and enterprise sectors to explore the future of secure online identity in Australia, New Zealand, and overseas. The agenda will cover use cases, case studies, and the latest data and collaboration happening to implement passkeys for consumers, workers, and governments regionally and around the world. We hope to meet you at our booth or speaking session. AFA Warfare Symposium March 3-5 | Aurora, Colorado The AFA Warfare Symposium is a premier professional development event for the U.S. Air Force, U.S. Space Force, and the aerospace and defense industry that supports them, with a focus on the critical concerns and challenges of joint warfare in every corner of the globe. Drawing speakers from USAF, USSF, combatant commands, industry, and the joint force, the symposium provides opportunities to network and explore dynamic exhibits. Come join Yubico at this event to learn how organizations can create phishing-resistant users. Gartner Security & Risk Management Summit March 3-4 | Sydney, Australia The Gartner Security & Risk Management Summit helps security and risk management leaders and practitioners to continuously improve the flexibility and responsiveness of security risk management techniques and technology to achieve mission objectives. Join Yubico at the premier cybersecurity conference for security and risk leaders in APAC and learn why not all MFA is created equal. FS-ISAC Spring US Summit March 9-12 | New Orleans, Louisiana Join Yubico and FS-ISAC members from across the Americas for three full days of learning, collaboration, and networking. Schedule a meeting with the Yubico team or meet us at Booth #14 to learn how to create a phishing-resistant enterprise. The FS-ISAC Spring Summit is packed with insightful presentations, workshops, and panels on topics relevant to the security of the global financial services industry. We hope to see you there. Security Summit Milan March 11-13 | Milan, Italy Starting from the situation outlined in the Clusit Report, presented exclusively during the opening plenary session, three days await us during which managers, professionals and entrepreneurs with the help of institutions and Clusit researchers will analyze the cyber security market, the evolution of threats and response strategies, focusing on the Italian reality in relation to international trends. Join Yubico at our booth and attend our tech deep-dive session. Gartner Identity and Access Management Summit March 24-25| London, United Kingdom Gartner Identity & Access Management Summit is an opportunity to connect with your community and our experts. Build and diversify your network by meeting forward-thinking IT executives across IAM, security, and IT infrastructure and operations. Join Yubico for this event, meet us at our booth and attend our theatre session. InCyber Forum April 1-3 | Lille, France FIC is a platform for stimulating discussions around a pan-European vision of a cybersecurity market, security, and digital trust. It will include a forum, a trade fair, a virtual event, and side talks. Join Yubico at this event to learn how to optimize your organization’s authentication security. RH-ISAC Summit April 7- 9 | St. Louis, Missouri The RH-ISAC Cyber Intelligence Summit features sessions delivered by prominent thought leaders and experts, along with collaborative workshops, cybersecurity exercises, and exceptional networking opportunities. This is the “can’t-miss” event for cybersecurity professionals from the retail and hospitality industries. RSA Conference April 28 – May 1 | San Francisco, California Yubico is returning as a sponsor of RSAC and we hope you’ll join us at Booth #3301 or throughout the week during our speaking sessions and networking event. Find out how Yubico embodies this year’s conference theme: Many Voices. One Community. Looking for a fun night? We welcome you and your team to join us and our partner sponsors at our Passwordless Party on Wednesday, April 30 at SPIN (next door to Moscone Center). EIC May 6 – 9 | Berlin, Germany Join more than 1,500 tech enthusiasts for Europe’s prime conference for digital identity and tech in Berlin. From unparalleled and expanded networking opportunities with attendees from around the world to deep dive sessions with the very tech shaping our tomorrow, EIC offers an exclusive ticket into the latest developments in digital identity, artificial intelligence, and their intersection. FS-ISAC EMEA May 20-22 | Brussels, Belgium The EMEA Summit will bring together hundreds of experts and leaders from the financial sector across Europe, Middle East, and Africa for three days of learning, collaboration, information sharing, and networking. Come to the Summit for exciting and informative presentations, workshops, and panels on topics relevant to securing the global financial services industry, including cyber threat intelligence, insider threat, information security risk, vulnerability management, and fraud. Join Yubico at this summit and learn how phishing-resistant users create phishing-resistant enterprises. mysecurityevent Switzerland June 2-4 | Zurich, Switzerland This is where the cyber security community meets for a secure world. Meet Yubico at our booth and catch our presentation. Identiverse June 3 – 6 | Las Vegas, Nevada Identiverse is where the identity security community comes together. Identiverse is a must-attend annual event that brings together over 2,500 security professionals for 4 days of world-class learning, engagement, and entertainment. Offering more than 250 speakers with over 70 hours of thought-provoking content, attendees can build communities with engagement opportunities like yoga, bootcamp, and karaoke, and experience showcases of the latest innovations. Infosecurity Europe June 3 – 5 | London, United Kingdom With over 380 exhibitors, Infosecurity Europe is the place to showcase new products, technologies, and innovations in the cybersecurity world, learning from the past, navigating the present, and protecting the future. Join our booth to learn more about Yubico’s offerings and how we can support your team’s journey to modern authentication. FinCyber Today Canada June 3 | Toronto, Canada The 2025 FS-ISAC FinCyber Today Canada, taking place on 3 June in Toronto, is a full-day program for Canadian member firms to learn from experts, share and network with colleagues and meet with solution providers exploring and innovating security products for a wide range of asset protection needs. Open only to member firms headquartered in Canada, the agenda provides something for everyone – sessions focused on top-of-mind issues led by subject experts; thought-leadership talks highlighting insights that members will take back to the office and networking social events. Gartner SRM Summit Americas June 9 – 11 | National Harbor, Maryland The Gartner Security & Risk Management Summit, the largest North American meeting for cybersecurity executives yet, helps security and risk management leaders and practitioners to continuously improve the flexibility and responsiveness of security risk management techniques and technology to achieve mission objectives. Join Yubico at the show and learn why not all MFA is created equal."
