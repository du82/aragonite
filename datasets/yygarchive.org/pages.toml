["https://yygarchive.org"]
title = "Home - YoYoGames Sandbox Archive"
full_description = 'yygarchive.org is not affiliated with YoYo Games, nor is it affiliated with the Internet Archive. Have any issues? You can use GitHub Issues, or contact me via Twitter or email. Made with ♥ by honno A searchable collection of GameMaker games that were available on the old games portal for YoYo Games, which launched in 2007 on yoyogames.com. In 2011 the portal was moved to sandbox.yoyogames.com, and was shutdown in 2016. Due to the portal being moved to the sandbox sub-domain, the old YoYo Games website is often referred to as the "Sandbox". Nearly all the games available on the site in 2014 when it was saved by the archivist group ArchiveTeam, so a bit over 100,000 games. ArchiveTeam scraped the Sandbox into the WARC format, which essentially captures websites quite thoroughly in how individual pages connect to one another. They are great for preserving websites as historical records, but do not preserve site features such as search. Indeed, this archive as well as other automated scrapes of the Sandbox are what underly navigating through sandbox.yoyogames.com on the Wayback Machine. One cannot use the search box that was originally on the site however—this website aims to provide something like that. A small proportion of games were headerless files i.e. raw binary streams. These files will most likely be GMK files—the project files of GameMaker—which had their filenames lost by the original Sandbox uploader. Unfortunately the ArchiveTeam scrape only captured the low-quality thumbnails present on the Sandbox, and not the originally uploaded screenshots. The Wayback Machine did independently have screenshots saved, but only for a relatively few number of games. I partially reconstructed the database of the Sandbox using scraped data from the ArchiveTeam WARCs, and subsequently pre-processed it. I use the Python web framework Flask to power this site, which interfaces with this database. The source code is available on GitHub (the sandbox.db file is my final Sqlite database).'
year_published = 2025
clearnet = "https://yygarchive.org"
