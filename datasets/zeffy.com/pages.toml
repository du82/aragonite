as intrigued by the breadth of features Zeffy offers, including, but not limited to, reporting, email, and e-ticketing. These features were perfect for a nonprofit like Allegiance Color Guard, which comes with complex financial and fundraising needs. Not to mention, Zeffy is 100% free."
