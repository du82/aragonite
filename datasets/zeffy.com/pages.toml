["https://www.zeffy.com/home/careers"]
title = "Careers | Zeffy"
description = "Join the Zeffy team and help revolutionize the way nonprofits fundraise! Explore exciting career opportunities in product, customer support, marketing, and more. Be part of a dynamic and innovative company dedicated to making a positive impact."
full_description = "François and Thibaut, the co-founders of Zeffy, didn't start out as entrepreneurs driven by AI or blockchain. 7 years ago, while volunteering, they noticed that nonprofits often couldn't afford the best technologies to fuel their fundraising operations. And that makes sense - nonprofits put their funds into their missions - not tech or admin fees. They launched Zeffy to change this by offering state-of-the-art technology through a business model that makes sense to nonprofits. Zeffy’s mission remains unchanged: creating technologies that empower nonprofits to solve the worlds’ biggest problems. Nonprofits no longer have to choose between paying high fees or settling for subpar technology. Our first product—a fundraising platform powered entirely by voluntary contributions from donors—has already been adopted by over 50,000 nonprofits, helping them raise nearly $1 billion. The best part? Nonprofits haven’t spent a single cent to use it, saving them $40 million in fees. And this is just the beginning—there’s so much more to come as we continue developing solutions to amplify the global impact of nonprofits. We're a dedicated team with ambitious goals. We're here to make a difference, building technology that empowers nonprofits to tackle the world's toughest challenges—climate change, inequality, poverty, human rights, and health. Every line of code, every feature we develop, pushes us closer to a better world.We like challenging each other, knowing that out of disagreement comes innovation. There's no room for ego here—just trust, collaboration, and a shared commitment to the causes that matter. For our team, this is more than just work; it’s the most meaningful project we’ve had the chance to work on. François and Thibaut, the co-founders of Zeffy, didn't start out as entrepreneurs driven by AI or blockchain. 7 years ago, while volunteering, they noticed that nonprofits often couldn't afford the best technologies to fuel their fundraising operations. And that makes sense - nonprofits put their funds into their missions - not tech or admin fees. They launched Zeffy to change this by offering state-of-the-art technology through a business model that makes sense to nonprofits. Zeffy’s mission remains unchanged: creating technologies that empower nonprofits to solve the worlds’ biggest problems."
