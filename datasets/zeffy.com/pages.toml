title = "Church in the Wild Saved over $2,000 in fees with a little help from Zeffy | Zeffy"
description = "Church in the Wild offers an inclusive place of worship in a beautiful natural landscape. Zeffy helps support their mission of community and service."
full_description = "We use cookies to improve your experience on our platform. By clicking “Accept all cookies”, you agree to the storing of cookies on your device to enhance site navigation, analyze site usage and assist in our marketing efforts. Church in the Wild is not just your regular church. Instead, they’re an eco-spiritual community working passionately for social and environmental justice. For three years, Church in the Wild has provided a safe and inclusive place of worship for all. Everyone is welcome, regardless of race, gender identity–or even religious denomination. The congregation is united by a shared belief that worship should be centered on service and community, as well as a deep love for the natural world. Church in the Wild are proud to call the picturesque Sky Lake in Windsor, New York, their home. From here, the church serves the larger community of Broome County. The church was founded on the premise that spirituality, creation, and religion are deeply intertwined. During services, the congregation focuses on care for themselves, their fellow churchgoers, and the beauty of the natural world. Services are held outside, beginning with a community stroll around the lake. Activities are planned especially for children, and pets are always welcomed. Each service ends with reflections and hopes for the new week, and each member of the congregation sets positive intentions. Before making the switch to Zeffy, Church in the Wild was surprised and dispirited to discover the high price of many fundraising platforms. Initially, they stuck with PayPal - it was well-known and seemed simple. But it wasn’t long before Church in the Wild began to feel PayPal’s limitations. Plus, they didn’t have access to essential fundraising features that could have helped fuel their mission. When it came to event ticketing, or selling materials, Church in the Wild was on its own. Church in the Wild Pastor, Corey Turnpenny, was skeptical when she stumbled upon an advert for Zeffy: a completely fee-free fundraising platform. Surely, their claims of ‘no hidden fees’ were just too good to be true."
