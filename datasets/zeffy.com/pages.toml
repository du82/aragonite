ons. And that makes sense - nonprofits put their funds into their missions - not tech or admin fees. They launched Zeffy to change this by offering state-of-the-art technology through a business model that makes sense to nonprofits. Zeffy’s mission remains unchanged: creating technologies that empower nonprofits to solve the worlds’ biggest problems."
