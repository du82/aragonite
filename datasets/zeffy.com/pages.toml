full_description = "We use cookies to improve your experience on our platform. By clicking “Accept all cookies”, you agree to the storing of cookies on your device to enhance site navigation, analyze site usage and assist in our marketing efforts. “When I immigrated to Québec, I felt very fortunate and wanted to give back to the community. I decided to volunteer, but quickly realized that it was a challenge to find opportunities to do so. This seemed like a huge gap, so I reached out to my geek friend Thibaut, and together we created a platform that made it simple and accessible to volunteer. With that, the first of many free Zeffy products was born. We immediately fell in love with working with these nonprofits. We were on a mission to help all nonprofits change the world, for free.” Zeffy has tripled each year and brought transparency into the fundraising world as the only 100% free fundraising and donor management platform for nonprofits. Many fundraising tools have been added to offer an all-in-one, simple experience for nonprofits.We have grown into a team of 30 passionate fundraising fanatics, now serving nonprofits in every state and province of the US and Canada.If you ask our founders, they’ll tell you their biggest source of pride remains that they have never charged a single dime to the tens of thousands of nonprofits using Zeffy. Across the world, we see social, economic, and environmental challenges. We are driven by our ambition to address them on a global scale. This means prioritizing the areas where we have the greatest impact. To help millions of nonprofits we need to focus on creating the most simple and intuitive platform. This means removing the fluff and providing top-quality tech that is simple to use for all. At Zeffy we believe that together, we can have a significant impact. This means finding time to support each other and our community in the goal of changing the world for the better. Certified B Corporations are leaders in the global movement for an inclusive, equitable, and regenerative economy. Zeffy is proud to hold this certification.As a B Corporation, we are obliged to consider the impact of our decisions on our team, customers, suppliers, community, and the environment each and every day. The B Corp community is made up of leaders, driving a global movement of people using business as a force for good.We work to maintain this certification by giving back to the community regularly, educating our team on how they can contribute to the well-being of our planet, and more!"
