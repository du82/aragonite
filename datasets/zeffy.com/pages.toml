["https://www.zeffy.com/case-studies/loose-ends"]
title = "GoFundMe’s fees stopped people from donating to Loose Ends. | Zeffy"
description = "With Zeffy’s fee-free fundraising, the Loose Ends founders have received more large gifts—totaling over $34,000 (with no fees!) in less than a year and a half."
full_description = "We use cookies to improve your experience on our platform. By clicking “Accept all cookies”, you agree to the storing of cookies on your device to enhance site navigation, analyze site usage and assist in our marketing efforts. When a textile artist finishes a section of a project, there is always a bit of string left over. So the very last step of any knitting or crochet project is weaving in these last few inches of “loose ends.” That’s what turns a project into a gift, and that’s what gave this nonprofit its name. They connect volunteer textile artists to people who have lost a loved one who was working on a fiber arts project. These volunteers (called “finishers”) complete the projects in the way their original creators intended. Knitting, crocheting, quilting, and other textile projects require knowledge and experience, as well as good eyes and nimble hands. These projects are labor of love that can take many hours, so it’s not uncommon for a dedicated knitter or sewist to leave projects partially completed when they pass away or become too disabled to complete a textile project. When that happens, those they leave behind can be at a loss as to what to do with a half-crocheted scarf or incomplete embroidery. Jen Simonic and Masey Kaplan, close friends and lifelong fiber artists, realized people kept asking them variations of the same question: “Can you finish this blanket/sweater/etc. that a loved one started for me?” Jen and Masey happily helped out. They were delighted to take on such meaningful projects and pass on one last gift from a loved one, bringing at least a little bit of closure to a grieving friend. But the two only have so much time on their hands. After finishing projects for several friends, they began to dream bigger and started Loose Ends. The organization connects volunteer textile crafters with recently bereaved folks looking for help with an unfinished project. The concept took off quickly. At first, Jen and Masey ran Loose Ends as a side project, and they used GoFundMe to raise money for a website and outreach. But when they decided to go all in and turn Loose Ends into a 501(c)3, Masey says they knew they needed to find a better solution."
