full_description = "We use cookies to improve your experience on our platform. By clicking “Accept all cookies”, you agree to the storing of cookies on your device to enhance site navigation, analyze site usage and assist in our marketing efforts. Mission Link connects churches in America with churches serving their neighbors all over the world. At the moment, they’re largely working with Christian leaders in Africa. American churches send teams of volunteers and educators, as well as resources, to their partners in Kenya and Uganda, who lead the charge on serving and building up their communities. Dr. Rick Sadler founded Mission Link International two years after his first trip to Africa in 1996. The organization was always intended to support native churches and missionaries by empowering them to do their work, instead of depending upon foreign nonprofit organizations. Under Dr. Sadler’s leadership, American and Ugandan pastors shared resources and educational materials. Eventually, Sadler set up programs to sponsor widows, deaf students, and abandoned children, in addition to medical mission trips and construction projects. Today, Mission Link International carries on the work of forging connections and empowering indigenous pastors in the communities they support. With year round connection and intermittent mission trips, American congregations partner with churches all over the world to carry out the Great Commission, equipping and training pastors and care for widows. Mission Link International has been fundraising for nearly 30 years, so they’ve been around the block a few times. They’ve also seen a lot change in the years since the internet took over the nonprofit fundraising space. So they were disappointed by how PayPal’s features didn’t keep up with the times. Mission Link International’s Executive Director Todd Childers believed PayPal had the lowest fees in the nonprofit fundraising game, but he began looking for alternatives because of the clunky back 