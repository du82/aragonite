["https://zeffy.com/case-studies/project-gallantly-forward"]
title = "Project Gallantly Forward Raises over $45,000 using Zeffy | Zeffy"
description = "Project Gallantly Forward offers a space where veterans can heal. Funds saved with Zeffy go towards the retreat and rehabilitation programs."
full_description = "We use cookies to improve your experience on our platform. By clicking “Accept all cookies”, you agree to the storing of cookies on your device to enhance site navigation, analyze site usage and assist in our marketing efforts. Project Gallantly Forward offers a healing retreat space for veterans and their families located on a peaceful cattle farm north of downtown Chattanooga. Program participants enjoy access to outdoor activities such as fishing, hiking, and paddleboarding, all within a safe and welcoming environment. Most importantly, with its community focus and rehabilitation programming, Project Gallantly Forward offers veterans a judgment-free space to heal from their experiences of combat. Lucas Lewis is the founder of Project Gallantly Forward, and a veteran himself. He was twice deployed to Iraq, and “Gallantly Forward” is the motto of his regimen, the 71st Cavalry. Like many veterans, when Lucas returned from the military, he dealt with serious PTSD symptoms. He knew of many others like him: military members struggling to reintegrate into society and move forward with their lives. Tragically, the 71st Cavalry lost more men to suicide than it had done in Iraq. In Lucas’s experience, veteran-to-veteran and family-to-family interactions were the most effective way to manage his PTSD symptoms and help get his life back on track. But once he was back to civilian life, he struggled to recreate the community and support system he’d found in the military. Determined to help, he founded Project Gallantly Forward: a nonprofit on a mission to support veterans as they rebuild their lives. The site is currently open for campers, and the end goal is to create a safe retreat space where therapeutic bonds can flourish. Lucas’s vision is a space where veterans can walk the same healing path together, and ultimately not feel so alone. Project Gallantly Forward had a clear vision, but as a new nonprofit, their budget was limited. The team was in the early days of fundraising, working towards building the retreat. Most fundraising platforms come with high price tags, and spending large amounts of money on expensive software just wasn’t an option."
