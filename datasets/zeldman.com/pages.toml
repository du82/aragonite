description = "L. Jeffrey Zeldman “King of Web Standards”—Bloomberg Businessweek. Online since May of 1995, Zeldman on Web Design is the personal site of designer, writer, and publisher Jeffrey Zeldman. “Jeffrey Zeldman Presents the Daily Report” is one of the oldest continuously published personal sites on the web, and a registered periodical: ISSN No. 1534-0309. JEFFREY ZELDMAN […]"
full_description = "About L. Jeffrey Zeldman “King of Web Standards”—Bloomberg Businessweek. Online since May of 1995, Zeldman on Web Design is the personal site of designer, writer, and publisher Jeffrey Zeldman. “Jeffrey Zeldman Presents the Daily Report” is one of the oldest continuously published personal sites on the web, and a registered periodical: ISSN No. 1534-0309. Twitter LinkedIn Threads Mastodon Medium Link Last.fm Spotify Instagram Pinterest Flickr Tumblr Bluesky JEFFREY ZELDMAN publishes A List Apart “for people who make websites,” a leading journal of web and interaction design thought, and co-founded the multi-city user experience design conference An Event Apart with Eric Meyer. The conference launched in December 2005, and closed in late 2023, after nearly twenty years of service. Jeffrey has written two books, notably the foundational web standards text, Designing With Web Standards, currently in a 3rd Edition coauthored with Ethan Marcotte. It has been translated into 15 languages, including (for the last edition) Italian, Chinese, Hungarian, Polish and Portuguese. The book, together with The Web Standards Project, which Jeffrey co-founded with Glenn Davis and George Olsen in 1998, and led from 1999–2003, is credited with converting the web design industry from tag soup and Flash to semantics and accessibility via the correct use of HTML, CSS, and JavaScript. His first book, Taking Your Talent to The Web, is now available as a free download and website. In February 2019, Jeffrey joined Automattic, Inc.—the people behind WordPress.com, Tumblr, and other fine open-source web software. He is currently an Executive Creative Director there. Jeffrey co-founded and published A Book Apart (“brief books for people who make websites”), a small press with a big impact in the field of web and digital design and UX. Among titles published by A Book Apart during its first years of operation are Responsive Web Design by Ethan Marcotte and Mobile First by Luke Wroblewski. The complete titles, comprising approximately 50 books as of this writing, form a comprehensive canon of the industry’s most important innovations and best practices. Katel LeDu ran the operation as both CEO and editor-in-chief. Katel launched liminal bloom after Jeffrey and cofounder Jason Santa Maria closed A Book Apart in October, 2024. Jeffrey was a founding faculty member in the MFA, Interaction Design program at School of Visual Arts, New York, where he taught for ten years, and is the founder and host of the internet radio program The Big Web Show (“Everything Web That Matters”), twice named Podcast of the Year by .net Magazine. Jeffrey serves on the Advisory Boards of Automattic, the SXSW Interactive Festival (Emeritus), and Readability (RIP), and is the Founder Emeritus of Happy Cog, an award-winning digital design studio in New York. In 2012, Jeffrey Zeldman was the first designer inducted in the SXSW Interactive Hall of Fame. He posts prolifically on BlueSky and Threads, is the subject of a lynda.com documentary, and has blogged and shared web design concepts and advocated user- and content-focused design techniques at Jeffrey Zeldman Presents since 1995. Jeffrey wrote this text in the third person. Additional biographical information not written by JZ himself may be found at Wikipedia. Books Written (For books published, see A Book Apart) Designing With Web Standards on Wikipedia Designing With Web Standards 3rd Edition, by Jeffrey Zeldman with Ethan Marcotte, New Riders (October 25, 2009) Designing With Web Standards 2nd Edition, by Jeffrey Zeldman, New Riders (July 16, 2006) Designing With Web Standards 1st Edition, by Jeffrey Zeldman, New Riders (May 24, 2003) — the book that changed an industry Taking Your Talent to the Web: a Guide for the Transitioning Designer, by Jeffrey Zeldman, New Riders (May 18, 2001) Selected External Links Jeffrey Zeldman: 20 years of Web Design and Community – documentary by lynda.com In the Studio With Jeffrey