title = "I stayed. - Jeffrey Zeldman Presents"
description = "My insight into corporate legal disputes is as meaningful as my opinion on Quantum Mechanics. What I do know is that, when given the chance this week to leave my job with half a year’s salary paid in advance, I chose to stay at Automattic."
full_description = '''Categories automattic business Career Community glamorous jobs Open Source Own your content I stayed. Post author By L. Jeffrey Zeldman Post date 4 October 2024 23 Comments on I stayed. My insight into corporate legal disputes is as meaningful as my opinion on Quantum Mechanics. What I do know is that, when given the chance this week to leave my job with half a year’s salary paid in advance, I chose to stay at Automattic.Listen, I’m struggling with medical debts and financial obligations incurred by the closing of my conference and publishing businesses. Six months’ salary in advance would have wiped the slate clean. From a fiduciary point of view, if nothing else, I had to at least consider my CEO’s offer to walk out the door with a big bag of dollars.But even as I made myself think about what six months’ salary in a lump sum could do to help my family and calm my creditors, I knew in my soul there was no way I’d leave this company. Not by my own choice, anyway.I respect the courage and conviction of my departed colleagues. I already miss them, and most only quit yesterday. I feel their departure as a personal loss, and my grief is real. The sadness is like a cold fog on a dark, wet night. The next weeks will be challenging. My remaining coworkers and I will work twice as hard to cover temporary employee shortfalls and recruit new teammates, while also navigating the complex personal feelings these two weeks of sudden, surprising change have brought on. Who needs the aggravation, right? But I stayed.I stayed because I believe in the work we do. I believe in the open web and owning your own content. I’ve devoted nearly three decades of work to this cause, and when I chose to move in-house, I knew there was only one house that would suit me. In nearly six years at Automattic, I’ve been able to do work that mattered to me and helped others, and I know that the best is yet to come. I also know that the Maker-Taker problem is an issue in open source, just as I know that a friend you buy lunch for every day, and who earns as much money as you do, is supposed to return the favor now and then. If a friend takes advantage, you’re supposed to say or do something about it. Addressing these imbalances is rarely pretty. Doing it in public takes its own kind of courage. Now it’s for the lawyers to sort out. On May 1, 1992, a man who’d been horribly beaten by the L.A. police called for calm in five heartfelt, memorable words: “Can’t we all get along?” We couldn’t then, and we aren’t, now, but my job at Automattic is about helping people, and that remains my focus at the conclusion of this strange and stressful week. I’m grateful that making the tough business decisions isn’t my responsibility. In that light, my decision to stay at Automattic was easy. P.S. We’re hiring. Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... Tags opensource By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← 9/13/01 → I Remember, Part 1 23 replies on “I stayed.” Matt West says: 4 October 2024 at 9:50 am Thank you for staying. While our paths don’t cross often at Automattic, I’m very grateful to share this house with you. Loading... Reply Henrique Iamarino says: 4 October 2024 at 9:54 am Beautifully put, Jeffrey. I stayed, too. Sad but hopeful and grateful, just like you. Loading... Reply Menaka S says: 4 October 2024 at 10:03 am I’m glad that you stayed Jeffrey! In spite of everything that could’ve lead you leave! Courage to you and us! Loading... Reply Luke Dorny says: 4 October 2024 at 10:04 am I’m a huge fan, J. I’m proud of all of your continued work helping the web become greater than those dark and gangly times from before. Loading... Reply Leroy Rosales says: 4 October 2024 at 12:05 pm Did you really just compare yourself to Rodney King? Loading... Reply L. Jeffrey Zeldman says: 5 October 2024 at 8:43 am No, sir. I would not do that. I’m sorry my meaning was unclear to you. Loading... Reply Dave's linkblog says: 4 October 2024 at 5:36 pm […] I stayed. […] Loading... Reply Samuel "Otto" Wood says: 4 October 2024 at 5:49 pm That is a tough call, but you do what it’s best for you, and nobody can judge that. Loading... Reply Luke says: 5 October 2024 at 4:13 am Sorry, I don’t understand how you can support your boss who is forcing people to choose sides, wielding complete power over a community, and is credibly accused of extortion and attempting to blackmail a successful female exec into joining your company. And you want to pass that off as courage? As being strong? As making tough decisions? You know who else they say about that, right? T for me but not for thee. And you could have just taken the money! Loading... Reply Anonymous says: 5 October 2024 at 12:02 pm […] 网站: zeldman.com HN评论: […] Loading... Reply I stayed. - Zeldman on Web and Interaction Design says: 5 October 2024 at 12:02 pm […] My insight into corporate legitimate disputes is as nastyingful as my opinion on Quantum Mechanics. What I do understand is that, when given the chance this week to depart my job with half a year’s salary phelp in proceed, I chose to stay at Automattic. […] Loading... Reply I Stayed speckx on October 5, 2024 at 10:40 Hacker News: Front Page says: 5 October 2024 at 12:07 pm […] Article URL: https://zeldman.com/2024/10/04/i-stayed/ […] Loading... Reply Erin Lynch says: 5 October 2024 at 7:32 pm Wonderful! Your dedication to web standards over the years has been an inspiration to me as you know. 🙂 Loading... Reply A says: 6 October 2024 at 2:41 am Likening this situation to the brutal beating of Rodney King is not really the look you want to go with. Loading... Reply L. Jeffrey Zeldman says: 6 October 2024 at 12:55 pm Thank you for your feedback. I fear that I communicated imperfectly. My intention was not to compare the abuse of Rodney King by the LAPD to the conflict roiling the WordPress community. Though Rodney King was saintly in his forgiveness, the LA riots were an inevitable response to the LAPD’s history of anti-Black violence. The riots — an unplanned, spontaneous expression by the community that had been harmed — made White America sit up and take notice of systemic police violence against Black people. Kindness and forgiveness would not have had that impact. In a similar way, some of the actions Automattic is taking have made me wish there was a kinder, gentler way to resolve this. But our CEO tried gentle persuasion for months before adopting our company’s current stance. I regret the pain the conflict has created, but understand the how and why behind our actions. Given that a percentage of readers took my mention of the Rodney King saga to mean something other than what I intended, I appreciate that there was probably a much clearer and better way to express this thought. I apologize, and I thank you for the critique. Loading... Reply B says: 7 October 2024 at 1:10 pm > My intention was not to compare the abuse of Rodney King by the LAPD to the conflict roiling the WordPress community … and then you go on to compare them even further!!?? I don’t think you fully appreciate why this is so problematic. I highly encourage you to step away from identity-based metaphors in all your writings. If you don’t understand why conflating racial identity with corporate positions is such a bad idea, it’s a good time for some deep reflection on your own biases. Loading... A Modern Employee Wants Love, Support, and Compassion : Stephen E. Arnold @ Beyond Search says: 6 October 2024 at 7:04 am […] read “I Stayed,” a blog post. The write up expresses a number of sentiments about WordPress, its employees, and […] Loading... Reply Hanan Cohen says: 7 October 2024 at 6:12 am I hope that this bruhaha will encourage a process that will eventually separate the absolute control of Matt over the WordPress nonprofit. The current situation is not healthy. I hope a8c employees will be able to say something about this issue. Loading... Reply Michael Tsai - Blog - Automattic vs. WP Engine says: 7 October 2024 at 10:10 am […] also: Jeffrey Zeldman, Hacker […] Loading... Reply Weekly Links 09.30–10.06 – ntdln says: 7 October 2024 at 6:00 pm […] I stayed. (Jeffrey Zeldman) […] Loading... Reply realtalkaj says: 8 October 2024 at 9:51 am I’m happy at the fact you were happy enough to stay at the place you work. I can’t say that I’m in the same situation as far as W-2s would go but I consider myself far enough in my career to where there’s somewhat of a similar parallel. Regardless of how you feel in the moment – staying for the long term contributes to the overall success of yourself and the team you’re apart of. Loading... Reply Timeline of the WordPress Drama - DevLog says: 8 October 2024 at 11:03 am […] writes “I stayed.”. Zeldman is part of Automattic’s advisory board. (Source: Zeldman / […] Loading... Reply Shaw says: 12 October 2024 at 6:23 pm Do you still feel this way now that Matt has initiated a hostile takeover of Advanced Custom Fields? Loading... Reply Got something to say?Cancel reply To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)'