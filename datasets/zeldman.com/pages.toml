["https://zeldman.com/2025/02/14/far-from-the-bullying-crowd"]
title = "Far from the bullying crowd - Jeffrey Zeldman Presents"
description = "The bullies who beat and mocked me in eighth grade were cruel and stupid. They despised intelligence and worshipped violence, although they would settle for athletic ability. The school blessed their thuggery by scheduling dodgeball. It was good preparation for Viet Nam, the country where I expected to be blown apart if I managed to survive to eighteen. (Read more...)"
full_description = "Categories family glamorous My Back Pages Politics Far from the bullying crowd Post author By L. Jeffrey Zeldman Post date 14 February 2025 2 Comments on Far from the bullying crowd The bullies who beat and mocked me in eighth grade were cruel and stupid. They despised intelligence and worshipped violence, although they would settle for athletic ability. The school blessed their thuggery by scheduling dodgeball. It was good preparation for Viet Nam, the country where I expected to be blown apart if I managed to survive to eighteen. If you were smart in eighth grade, you were also a fag. I don’t even think they meant you were actually queer. I think it was just one of the worst things a bully could call you before pounding on you. Indeed, it lent an aura of righteousness and inevitability to the beatings that got doled out to you. Surely all red-blooded American boys would want to beat up fags! And who could blame them? Not the schools. Not the churches. And certainly not the cops. Why, it was practically a young man’s duty to rid the world of insufficiently macho peers. A kind of post-birth eugenics, if you will. The other word the bullies used for me was pussy, because they could imagine nothing lower than a woman, I suppose. They even called me Zeldwoman. I’d been picked on in the seventh grade, in Connecticut, too, but that was mostly by my pals, who were possibly just busting balls, something they’d have learned to do (and I had not) over the previous year’s summer break. My friends’ taunts once made me cry in school, which was unforgivable in a boy, so I would have been destroyed had we stayed in Connecticut, anyway. But we moved.And the Pittsburgh of those years was worse for me. In the end, I survived eighth grade in Pittsburgh because I could crack jokes and write and draw what were called underground or head comics at the time, and one of the toughest kids in the school thought I was funny and let me hang out with his gang. They were called the Garage Gang, and they probably had roots in preadolescent group onanism, but by the time I joined as a sort of amusing mascot, they were mostly about smoking, shoplifting, stealing beer, making out with girls, and buying and selling pot and psychedelics. Eventually I would become a dealer myself, and hang with the freaks instead—smart kids who made art and got high a lot. This enabled me to survive until I was old enough to go college and reinvent myself. I don’t know why I’m thinking about these things again lately. It’s not like America’s most vulnerable citizens are being targeted by a hostile, mentally retrograde government. Not like bullies, racists, and homophobes everywhere have been set free to revert to their ugliest selves by a mentally deficient ringleader who knows how to whip up a crowd and feed their hunger for violence as a screen behind which he robs us all. Of our money, of course. But more importantly of our rights, our dignity, our ability to accept one another and celebrate our differences instead of masking them. Most of all, the bullying crowd is robbing us of the more perfect union many of us hoped America was beginning to achieve. But, hey. How ’bout that Gulf of America. Winning. Photo by Mikhail Nilov. See also “How my grandfather came to America.” Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← My weekend project 2 replies on “Far from the bullying crowd” Frederick Good says: 14 February 2025 at 10:53 am This was my life, all the way through high school. But I never got to go to college, or re-invent myself. I know exactly how it feels to be trapped in a world that doesn’t belong to you or even want you. But eventually I found members of my tribe scattered about. That saved me. Loading... Reply L. Jeffrey Zeldman says: 14 February 2025 at 12:35 pm Remember when the web was a magical place where we could meet our tribe? And not a seething hotbed of conspiracy theories and bigotry? It was nice while it lasted. Loading... Reply Got something to say?Cancel reply To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)"
