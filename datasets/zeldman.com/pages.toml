full_description = '''Categories "Digital Curation" Acclaim art direction creativity CSS Design Designers Ideas IXD Layout links mobile State of the Web Typography User Experience UX Web Design Web Design History Websites Web Design Inspiration If you’re finding today a bit stressful for some reason, grab a respite by sinking into any of these web design inspiration websites. Post author By L. Jeffrey Zeldman Post date 5 November 2024 3 Comments on Web Design Inspiration Red, black, and white. Always a good look. Screenshot of The Line website. If you’re finding today a bit stressful for some reason, grab a respite by sinking into any of these web design inspiration websites. Gathered from conversations on Reddit and elsewhere, each site offers a collection of other sites’ designs, chosen for impact, originality, and innovation. Each collection should offer at least a few designs that will inspire your own ideas and creativity—and most contain more than a few. Lots more. We make no claims as to usability, accessibility, or appropriateness of design. Which doesn’t mean that the chosen websites are unusable, inaccessible, or inappropriate to the brand, subject matter, or needs of the audience. Indeed, from the care devoted to the graphical interface, we assume that many of these sites are as good under the hood as they are on the surface. But it’s just an assumption; we haven’t tested, and the point of this post is purely to share visual and creative inspiration. Enjoy! https://godly.website/ (collection) https://www.awwwards.com/ (collection) https://www.cssdesignawards.com/ (collection) https://land-book.com/ (collection) https://httpster.net/ (collection) https://goodui.org/ (UI patterns A/B tested, experiments) https://saaslandingpage.com/ (SaaS landing page examples) https://mobbin.com/browse/ios/apps (collection) And for dessert… Enjoy https://betteroff.studio/, an individual studio’s rhythmically organized, sensory-appealing design. Click to share on LinkedIn (