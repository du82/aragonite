["https://zeldman.com/2024/12/28/valediction-2"]
title = "Valediction. - Jeffrey Zeldman Presents"
description = "What a ride that was."
full_description = '''Categories "Digital Curation" Applications Archiving Blogs and Blogging conferences content Design dreams Election engagement glamorous industry iphone Microblogging Micropublishing Mobile Networks Platforms social media social networking Standards State of the Web SXSW The Essentials The Old Man of the Mountain tweets Web Design Web Design History Websites writing Valediction. What a ride that was. Post author By L. Jeffrey Zeldman Post date 28 December 2024 1 Comment on Valediction. I started using Twitter before the dawn of the iPhone. Back then, in 2006, it was a fun, funky, fully functional (if barebones) beta messaging service used mainly by The People of the Web™—the kind of folks who attended the SXSW Interactive conference and probably spoke on the panels. You know. You were there. You were one of us: Designers. Developers. Pioneers. Writers of blog posts, trade books, and all the little guide texts that websites depended on to attract and serve their users. People who, in casual conversation, might use words like “digerati” unironically and without intending to be pretentious. We believed in the power of the web to highlight unheard voices and evolve a more just society. If we were naive, and we surely were, at least we were on the side of the angels. Turns out, not everybody was. A new skill Years before Slack, the early 140-character Twitter served as a kind of private pre-Slack for the digitally awake and aware. Back in those days, if you’d asked me or my conference-going fellow bloggers and designers who that first, rudimentary Twitter was for, we’d have said it was for us. For people like us, who’d spent years mastering all manner of skills and technologies simply to communicate online. Who saw value in the act of putting words together, so long as there were people to read and react to those words.(After expressing our feelings of pride and ownership in the Twitter community, of course, the more Ted-talk-y among us early users would have waxed rhapsodic about microblogging and its potential to improve the world. More about that in a moment.)With the birth of Twitter, when we wanted to pin down something that was twitching about in our heads and transmit it to other heads, the skill we needed wasn’t CSS or HTML or art direction or back-end wrangling. It was the ability to edit our thoughts down to a glittering trophy built with 140 characters or less. A new skill to master! How much do people like us love showing the world what we’ve learned! This much: Even after Twitter no longer relied on wireless carriers’ text messaging services, so that the permitted character count was consequently doubled, many of us would-be Oscar Wildes continued to whittle away at our tweets, limiting them to 140 characters or fewer on principle. After all, if we could deliver fully functioning website in 10K or less, we could surely craft deathless sentences from a tightly constrained character count. Right? Of course right! Only connect Years later, with a huge international user base, the idea persisted that a globally connected free and open messaging network like Twitter could help humanity do less evil and more good.If you wanted proof, you could look to the first Arab Spring, to Me Too, to Occupy Wall Street and Black Lives Matter—movements that were greatly abetted by the busy, worldwide network. Of course, while many cheered and participated in these activist-driven movements, others saw them as threatening. Some felt the world was changing too fast, and that their views on social issues, like their once-good jobs, had no champion among the ruling classes. We all know how that turned out. And now a brief digression about power and megaphones: How I got over Nearly two decades before Bluesky and its sweet starter packs, Twitter hired creatives to recommend selected users to newcomers. Some of the coolest people I know did that work. Web design was at its peak, so quite naturally the in-house team put together a list of influential designers, developers, and writers for new users to follow. And for a variety of reasons, I was among those early recommended follows. (I may still be listed there, if the current X still welcomes newcomers with follow recommendations.) Which is how, at my Twitter peak, I ended up with a blue checkmark and 355,000 followers. Even now, on wretched “X,” where I no longer post, I still retain 305,000 followers. At least, that’s what the stats told me when I popped in just now to find out. But are there really that many folks following me there? How many of my current Twitter/X “followers” used to participate but have since quit quietly, without bothering to close their accounts? Lots, I reckon.Some may avoid the site but keep their accounts open for strategic reasons, such as preventing someone else from hijacking their name (not that the owner can’t take over your account whenever he feels like it—but I digress). Mainly, I’m guessing a lot of folks lost interest in the site but forgot to close their accounts. In other words, the data says 305K, but it’s probably less than half that many active users at most, few of whom would even see my tweets if I still posted there, as the algorithm throttles texts from folks like me. Who cares, besides me? Nobody. Nor should they. And, besides, except as a temptation to stay, my follower count is beside the point. Come play with us, Danny The point is that the former Twitter has become a hateful cesspool, not simply mirroring but amplifying its owner’s profound insecurities, god-awful beliefs, and self-serving lies, and forcing that insanity into the public consciousness, whether we avoid X or not. Thus, millions of Americans who don’t use Twitter/X nevertheless believe conspiracies that the owner and his favorite acolytes use the site to broadcast. And there’s no doubt that, in consequence of the above, X helped determine the results of the last US presidential election. (I use the phrase “last election” here to mean “most recent election,” although I fear it may come to mean more than that.) So, in the interest of not supporting fascism, do I abandon these readers? Thanks for asking! Pretty much, yeah. If you like my longer-form writing, you can find it here on zeldman.com, at A List Apart, and in my books.If you like my chatty posts, news bytes, and occasional brief confessions, join me on Bluesky. Good luck to us all in the coming year. Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... Tags twitter, Valediction By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← Domain harvesting and the Twitter long game in retrospect → My weekend project One reply on “Valediction.” suBi says: 28 December 2024 at 8:41 pm Great read. I agree but also disagree to some of your points. Twitter, in my opinion is a reflection of what the world viewpoint is like today ! Confused, angry, full of hate – but then there are also people – skilled, talented, helpful and etc. al. It is literally a freeway. It doesnt and shouldn’t matter who owns it. As long as you are allowed to say what you really want to say, the platform is on point. Not what anyone of us think is right or wrong – because it is subjective. And yeah there are more crappy ppl than nice ones – but that is the world we live in today ! Loading... Reply Got something to say?C