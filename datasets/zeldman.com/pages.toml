description = "Saturday, 30 November 2024, marks the 17th annual Blue Beanie Day celebration. It’s hard to believe, but web standards fan Douglas Vos conceived of this holiday way back in ’07: The origin of the name of the holiday is the image of Jeffrey Zeldman on the cover of his book wearing a blue knit cap.[7][8][9] Over the […]"
full_description = "Categories Accessibility Blue Beanie Day Code Design HTML Standards Web Design Web Design History Web Standards How to Join Blue Beanie Day: Wear and Share! Post author By L. Jeffrey Zeldman Post date 30 November 2024 3 Comments on How to Join Blue Beanie Day: Wear and Share! Blue Beanie Day is everywhere! Here astronaut Bowman from 2001: A Space Oddysey flaunts his basic blue toque, couresty of Kevin Cornell (illustration) and Douglas Vos (inventor of the holiday). Saturday, 30 November 2024, marks the 17th annual Blue Beanie Day celebration. It’s hard to believe, but web standards fan Douglas Vos conceived of this holiday way back in ’07: The origin of the name of the holiday is the image of Jeffrey Zeldman on the cover of his book wearing a blue knit cap.[7][8][9] Over the years, the Blue Beanie Day also became an action day for web accessibility, for which the correct use of web standards is a basic requirement.[8] — Wikipedia How can you join this year’s fun? That’s easy! Snap a self-portrait wearing a blue beanie and post your Blue Beanie Day photo to Bluesky, Threads, Instagram, Tumblr, LinkedIn, Facebook, your blog (you’ve still got one, right?), and whatevs. Hashtag: #BlueBeanieDay. No blue toque to call your own? Kevin Cornell’s venerable illustration to the rescue! Download the zipped Photoshop file here. If you like, you can ping this web page with a link to your post’s URL. See below for details. Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... Tags bluebeanieday, webdesign, webstandards By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← Lessons from Cats: Jasper’s Clever Cleanup Routine → Of Books and Conferences Past 3 replies on “How to Join Blue Beanie Day: Wear and Share!” Ole Eichhorn says: 30 November 2024 at 1:50 am > Bluesky, Threads, Instagram, Tumblr, LinkedIn, Facebook, your blog (you’ve still got one, right?), and whatevs. Hmmm, this list seems incomplete Loading... Reply The beautiful whole of you - commUnity says: 3 December 2024 at 1:01 pm […] design thinking, intersectionality, systematic oppression, web standards, XKCD, Brain Pickings (now The Marginalian), knitting, guilds, knitting […] Loading... Reply Got something to say?Cancel reply To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)"
