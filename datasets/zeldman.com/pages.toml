["https://zeldman.com/2024/12/07/domain-harvesting-and-the-twitter-long-game-in-retrospect"]
title = "Domain harvesting and the Twitter long game in retrospect - Jeffrey Zeldman Presents"
description = "Tricking people into seeing unexpected content and converting some of them into customers is a tale as old as the web. It was the perfect model for the takeover."
full_description = "Categories business Election Indieweb Politics State of the Web twitter Websites Domain harvesting and the Twitter long game in retrospect Tricking people into seeing unexpected content and converting some of them into customers is a tale as old as the web. It was the perfect model for the takeover. Post author By L. Jeffrey Zeldman Post date 7 December 2024 4 Comments on Domain harvesting and the Twitter long game in retrospect If you have a website that gets steady but diminishing traffic, and whose domain registration dates back at least a decade, you may encounter offers to buy your domain. These used to come mainly from pornographers, on the premise that your readers, upon encountering nudity instead of the morning farm report in their web browsers, would be momentarily confused—but at least a few of them would stick around to become customers.Over the years, tricking people into seeing unexpected content and converting a small percentage of them into customers has proven to be an effective business tactic. Mindless, sure. Depressing, you bet. But effective. If all you want to do is make money, this is a way to do it. See also the penny rounding error crime from Office Space (by way of Superman III). It’s a numbers game. Make an infinitesimal profit a gazillion times, and it becomes a healthy profit. Buy skrillions of popular domains at a low enough cost, and rake in double your money in subscription fees and paid downloads.These days, of course, the lowball domain harvesters are not limited to pornographers or even human beings, but the point of the transaction has ever been the same: to ambush your community and convert at least some of them into customers. What I’m working up to is that, for some reason, this morning I woke up recognizing that Elon Musk’s purchase of Twitter was a far more expensive—and destructive—version of that same old grift. It was conversion en masse. To seize a public commons shared by 600 million readers, writers, and keyboard adrenalin addicts, and to profoundly change the conversations they were having. A digital takeover with historic and deeply tragic real-world consequences. For sale: personal, imperial power Musk’s “folly,” it turns out, wasn’t the ego-fueled, soon regretted impulse purchase it looked like. At least, if it was that, it was not only that. It was also, as we can see now, a plan to buy not merely a U.S. presidential election outcome, but, with it, personal, imperial power. Whether that was always the plan, or only became the plan after Musk found himself stuck with the $44B Twitter deal and decided to make the best of it, the consequences for our world are the same. And, from Musk’s point of view—at least until he and the man he helped put in the White House have their inevitable supervillain falling out—the plan worked. A psychological detail here is that, in contrast to the lowballing sleaze merchants whose tactics he otherwise emulated, Musk appeared to have wildly overpaid for his prize. How could he be so stupid, we grinned at each other—and put him out of our minds. Which gave him that much more freedom to make his moves. Which, although evil, were not stupid. As an unelected U.S. co-president in an administration in which two-fisted self-dealing will be expected, and will go unreported by a weak and cowering press, Musk will become his own Treasury Department in his role as a cutter of “government waste.” (End Medicare. Get a job, Grandma! Launch Medicare dollars into SpaceX. While we’re at it, let’s stop pampering our military veterans with health care. And so on, ad nauseum.) And if that’s not enough—and somehow it never is enough for these people—he’ll also rule over economic realms in which his companies compete for astronomical government contracts. Gee, I wonder how that will go? Either Musk deliberately spent enough to make his enemies think he was an idiot, and stop paying attention to him. Which is evil-genius-level chess-mastery if it was, in fact, planned that way. Or else he overspent as a bluff, got tripped up in his own hubris, ended up stuck with Twitter, decided to wreck it while high on Ketamine, and somehow blundered his way into a revenge plan for the history books—if we’ll still be allowed to have those. Either way, the rest of us are in the same bad trouble. All things considered, the Titanic sank quickly. Our democracy has just a tad more time. What can good people do today to give non-billionaires a fighting chance? Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... Tags Democracy, LongTail By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← Of Books and Conferences Past → Valediction. 4 replies on “Domain harvesting and the Twitter long game in retrospect” Peter Kaizer says: 7 December 2024 at 6:15 pm Bravo my friend for having the courage to tell it like it is! Loading... Reply Jeffrey wldman says: 7 December 2024 at 6:51 pm Thank you kindly, Peter. Loading... Reply Angela says: 9 December 2024 at 12:31 pm Thank you for sharing this. My thoughts aren’t as eloquent, but my feelings are along the same lines. I’ll also follow your writing more closely again, because that last question (What can good people do to give non-billionaires a fighting chance?) is pretty much what I ask myself week-after-week these days. Loading... Reply Valediction. - Zeldman on Web and Interaction Design says: 28 December 2024 at 3:49 pm […] acolytes use the site to broadcast. And there’s no doubt that, in consequence of the above, X helped determine the results of the last US presidential election. (I use the phrase “last election” here to mean “most recent election,” although I fear it […] Loading... Reply Got something to say?Cancel reply To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)"
