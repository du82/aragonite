description = "Her voice, when she spoke to us from the doorway, was strange. I was in 3rd Grade. Our teacher went away for a few minutes, then came back, crying. She was a tough public school teacher of the old school, the kind my father’s friends would have called “an old bat.” She was not like […]"
full_description = "Categories glamorous I Remember, Part 1 Post author By L. Jeffrey Zeldman Post date 22 October 2024 1 Comment on I Remember, Part 1 Her voice, when she spoke to us from the doorway, was strange. I was in 3rd Grade. Our teacher went away for a few minutes, then came back, crying. She was a tough public school teacher of the old school, the kind my father’s friends would have called “an old bat.” She was not like the young pretty teacher on The Little Rascals films that played at 7:00 am on local TV on Saturday mornings. She was like all the other teachers in those Little Rascals films. The mean ones, with arms like rolling pins. I wish I could remember her name. Miss Ball, let us say. We feared her. In the classroom, on any normal day, she reigned with an iron will. She could halt our mayhem in three seconds or less, with a blast on the coach’s whistle that hung from her neck. But there was never just one blast. “People!” she would shout when pushed beyond endurance by one of us not knowing the answer to a homework question. “People!”—her face red. That’s what she did on normal days. That was her as we had known her. We had never seen her show any feeling besides anger, impatience with our shortcomings, or a withering disdain for the entire Cosmos, whose failures I am sure she catalogued daily. Yet here she stood, shoulders drooping, fists clenched pointlessly, raccoon rings forming where her mascara, her single concession to the strict appearance standards of the time, had begun to run. Her voice, when she spoke to us from the doorway, was strange: “Oh, you poor children,” she said. “President Kennedy has been shot.” Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... Tags My Glamorous Life By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← I stayed. → Web Design Inspiration One reply on “I Remember, Part 1” Joel Goldstick says: 23 October 2024 at 6:57 pm I was in second grade playing dodge ball in gym class.. The principal, Mr Kellogg announced over the p.a. those wooden speaker boxes in every room at school back then. that the president was killed and we all needed to go home… Loading... Reply Got something to say?Cancel reply To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)"
