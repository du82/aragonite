title = "A Jewish Joke - Jeffrey Zeldman Presents"
description = "I wrote a joke for you."
full_description = "Categories jokes Stories A Jewish Joke I wrote a joke for you. Post author By L. Jeffrey Zeldman Post date 1 March 2025 2 Comments on A Jewish Joke Two Jews are standing in an open cattle car en route to Auschwitz. The train pauses on a bridge overlooking a river. Directly below them is a transport ship. “Look!” the first Jew excitedly tells his friend. “Now’s our chance! That ship down there is delivering war supplies to the port city of Kaiserberg. If we jump down to the deck now and hide in one of those tanks, maybe we can avoid Auschwitz and ride things out in Kaiserberg!” The second Jew thinks a moment.“What if Kaiserberg’s worse?” he asks. Disclaimer (only read if offended): I don’t like to explain jokes, but if this one offends you, consider that I’m Jewish myself. The joke came to me fully formed while I was chatting with a friend about something unrelated. It felt like a perfect distillation of Jewish pessimism. Not that Judaism as a religion is pessimistic, but after two thousand years of, you know, we can be a bit touchy. I’m sorry if this disclaimer ruined the joke for you. I did say not to read it unless you were offended. Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← Far from the bullying crowd 2 replies on “A Jewish Joke” Pet