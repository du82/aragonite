full_description = '''Categories "Digital Curation" A List Apart Acclaim Designers development Publications social media social networking Web Design Web Design History Web Standards Websites writing A List Apart contributors list on Bluesky I’ve started a Bluesky list featuring some of the brilliant writers, designers, coders, editors, and others who’ve contributed to A List Apart “for people who make websites.” Post author By L. Jeffrey Zeldman Post date 24 November 2024 1 Comment on A List Apart contributors list on Bluesky I’ve started a Bluesky list featuring some of the brilliant writers, designers, coders, editors, and others who’ve contributed to A List Apart “for people who make websites” from the magazine’s first dawning back in the 19(mumbles). Bluesky fans, grab the list here: https://bsky.app/profile/did:plc:pgjpl4opnmqxxpb74n4vuabv/lists/3lbozpqe2kq2t Why only *some* of the contributors? Simple. Several are, sadly, deceased. Many others are likely alive and well but not yet on Bluesky. We can’t unmake death, but we can offer the living networked comradeship and a wee increase in visibility. So if you’re an A List Apart contributor who’s been thinking of joining Bluesky, consider this an incentive. Note: I’m not a partner in Bluesky, and have nothing to gain from inviting you, beyond the pleasure of your company—be it salty or sweet. Once you join and have started a profile, ping me and I’ll add you to the list. (I’m zeldman.bsky.social on Bluesky.) And, hey, if you haven’t yet contributed to A List Apart, your ideas are always welcome. Online since 1998, A List Apart (ISSN: 1534-0295) explores the design, development, and meaning of web content, with a special focus on web standards and best practices. About the magazine. | Complete list of Authors. | Style Guide. Cheers! Related Open-source moderation “Our online experience doesn’t have to depend on billionaires unilaterally making decisions over what we see.” Category: A List Apart From pixels to prose, coding to content. In search of a digital town square A personal assessment from February, 2024 of the fractured social network landscape. Click to share on LinkedIn (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on Pocket (Opens in new window)Click to share on Pinterest (Opens in new window)Click to print (Opens in new window)Like Loading... Tags alistapart, Bluesky By L. Jeffrey Zeldman “King of Web Standards”—Businessweek. Ava’s dad. Automattician. OG blogger/web designer. Publisher, A List Apart & A Book Apart. Author, Designing with Web Standards & Taking Your Talent to the Web. Emeritus: An Event Apart, SVA MFA IXD, Happy Cog. View Archive → ← Understanding MARTI: A New Metadata Framework for AI → Lessons from Cats: Jasper’s Clever Cleanup Routine One reply on “A List Apart contributors list on Bluesky” Weekly Links 11.25–12.01 – ntdln says: 2 December 2024 at 12:59 pm […] A List Apart contributors list on Bluesky (Jeffrey Zeldman) […] Loading... Reply Got something to say?Cancel reply To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)'''
