full_description = '''Free chapters for Magical Dev School Published on: Oct 24, 2023I managed to release 2-3 chapters of my courses in Magical Dev School for free. Making a nice neon button Published on: Oct 17, 2023When I was building the Magical Dev School website, I accidentally stumbled on a way to make Neon buttons look good. Splendid Astro Spacing — A Tailwind Utility for Astro Published on: Oct 10, 2023When using Tailwind with Astro, you’ll notice that Tailwind’s space utilities stop working when you use it with Astro Components or Slots . Updates for Understanding Async JS and Rest APIs Published on: Oct 3, 2023I spent two weeks reworking the contents of Understanding Asynchronous JavaScript and Rest APIs and I'm happy to announce the changes I have made. This course is now much easier to understand (and also much more succinct) compared to before. From my experience, it should now be able to resolve most of the confusion you may face around the topic of Asynchronous JavaScript and Rest APIs. Easy caching on the local file system with Node Published on: Sep 26, 2023Today I want to introduce you a utility that will make caching in the local file system extremely easy. This utility is called fileCache and it’s built into Splendid UI. zlFetch now supports FormData! Published on: Sep 19, 2023"Now" is grossly inaccurate because zlFetch has supported Form Data since v5.0 (since April) and we’re already at v6.0 🙃. Limitations of Scoped CSS Published on: Sep 12, 2023I was really excited about Scoped CSS a couple of years back when frameworks like React and Vue introduced them. As I began trying Scoped CSS out for myself, I was disappointed and I felt it didn't live up to its hype. But after more tries, I'm happy to announce that Scoped CSS is indeed useful. You only have to realize what its limitations are and what to do when you face these limitations. Quality of life improvements for zlFetch Published on: Sep 5, 2023I silently updated zlFetch a couple of months ago with some improvements that make coding much easier — especially if you're using zlFetch in Node.'''
