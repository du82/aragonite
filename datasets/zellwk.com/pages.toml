title = "Easy way to remove inline styles | Zell Liew"
description = "So you never have to fight a CSS specificity war with the libraries you use — just style everything without any battles!"
full_description = "Easy way to remove inline stylesPublished:Apr 17, 2024Here’s a simple way to remove inline styles from 3rd-party libraries. // Replace .container with the HTML element you're targeting const container = document.querySelector('.container') const elements = container.querySelectorAll('*') for (const element of elements) { element.removeAttribute('style') } The basic idea is we strip out the style tag from all elements within the container, so you don’t have to fight a never-winning CSS specificity war by using !important.Understanding and using npm exportsCollecting Payments with Stripe while using Astro"
