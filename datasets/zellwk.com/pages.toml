description = "One thing I really loved about Svelte is their reactive statements — you can simply just change a value and the UI gets updated accordingly."
full_description = '''Automatic reactivity with Vanilla JavaScript with two methods — Getters and Setters and JavaScript ProxiesPublished:Nov 14, 2023One thing I really loved about Svelte is their reactive statements — you can simply just change a value and the UI gets updated accordingly. <script> let show = false function toggle() { show = !show } </script> <button on:click={toggle}>Toggle content</button> {#if show} <div>Hello World!</div> {/if} astro-island,astro-slot,astro-static-slot{display:contents}(()=>{var e=async t=>{await(await t())()};(self.Astro||(self.Astro={})).load=e;window.dispatchEvent(new Event("astro:load"));})();;(()=>{var b=Object.defineProperty;var f=(c,o,i)=>o in c?b(c,o,{enumerable:!0,configurable:!0,writable:!0,value:i}):c[o]=i;var l=(c,o,i)=>(f(c,typeof o!="symbol"?o+"":o,i),i);var p;{let c={0:t=>m(t),1:t=>i(t),2:t=>new RegExp(t),3:t=>new Date(t),4:t=>new Map(i(t)),5:t=>new Set(i(t)),6:t=>BigInt(t),7:t=>new URL(t),8:t=>new Uint8Array(t),9:t=>new Uint16Array(t),10:t=>new Uint32Array(t)},o=t=>{let[e,r]=t;return e in c?c[e](r):void 0},i=t=>t.map(o),m=t=>typeof t!="object"||t===null?t:Object.fromEntries(Object.entries(t).map(([e,r])=>[e,o(r)]));customElements.get("astro-island")||customElements.define("astro-island",(p=class extends HTMLElement{constructor(){super(...arguments);l(this,"Component");l(this,"hydrator");l(this,"hydrate",async()=>{var d;if(!this.hydrator||!this.isConnected)return;let e=(d=this.parentElement)==null?void 0:d.closest("astro-island[ssr]");if(e){e.addEventListener("astro:hydrate",this.hydrate,{once:!0});return}let r=this.querySelectorAll("astro-slot"),a={},h=this.querySelectorAll("template[data-astro-template]");for(let n of h){let s=n.closest(this.tagName);s!=null&&s.isSameNode(this)&&(a[n.getAttribute("data-astro-template")||"default"]=n.innerHTML,n.remove())}for(let n of r){let s=n.closest(this.tagName);s!=null&&s.isSameNode(this)&&(a[n.getAttribute("name")||"default"]=n.innerHTML)}let u;try{u=this.hasAttribute("props")?m(JSON.parse(this.getAttribute("props"))):{}}catch(n){let s=this.getAttribute("component-url")||"<unknown>",y=this.getAttribute("component-export");throw y&&(s+=` (export ${y})`),console.error(`[hydrate] Error parsing props for component ${s}`,this.getAttribute("props"),n),n}await this.hydrator(this)(this.Component,u,a,{client:this.getAttribute("client")}),this.removeAttribute("ssr"),this.dispatchEvent(new CustomEvent("astro:hydrate"))});l(this,"unmount",()=>{this.isConnected||this.dispatchEvent(new CustomEvent("astro:unmount"))})}disconnectedCallback(){document.removeEventListener("astro:after-swap",this.unmount),document.addEventListener("astro:after-swap",this.unmount,{once:!0})}connectedCallback(){if(!this.hasAttribute("await-children")||document.readyState==="interactive"||document.readyState==="complete")this.childrenConnectedCallback();else{let e=()=>{document.removeEventListener("DOMContentLoaded",e),r.disconnect(),this.childrenConnectedCallback()},r=new MutationObserver(()=>{var a;((a=this.lastChild)==null?void 0:a.nodeType)===Node.COMMENT_NODE&&this.lastChild.nodeValue==="astro:end"&&(this.lastChild.remove(),e())});r.observe(this,{childList:!0}),document.addEventListener("DOMContentLoaded",e)}}async childrenConnectedCallback(){let e=this.getAttribute("before-hydration-url");e&&await import(e),this.start()}start(){let e=JSON.parse(this.getAttribute("opts")),r=this.getAttribute("client");if(Astro[r]===void 0){window.addEventListener(`astro:${r}`,()=>this.start(),{once:!0});return}Astro[r](async()=>{let a=this.getAttribute("renderer-url"),[h,{default:u}]=await Promise.all([import(this.getAttribute("component-url")),a?import(a):()=>()=>{}]),d=this.getAttribute("component-export")||"default";if(!d.includes("."))this.Component=h[d];else{this.Component=h;for(let n of d.split("."))this.Component=this.Component[n]}return this.hydrator=u,this.hydrate},e,this)}attributeChangedCallback(){this.hydrate()}},l(p,"observedAttributes",["props"]),p))}})();Toggle hidden content Going deeper, Svelte also has a $ syntax that hooks up its reactivity with Vanilla JavaScript so you can update a value whenever another value changes. <script> let count = 0 $: double = count * 2 function increase() { count += 1 } </script> <button on:click={increase}>Add count</button> <div>Doubled Count: {double}</div> Add count Doubled Count: 0 When I discovered how to use these feature properly, I got hooked. Then I wondered if it’s possible to do something similar with Vanilla JavaScript. Turns out, it’s possible! You can do it with two methods: Getters and Setters Proxies Proxies are the superior method here because there’s less code to scaffold. But it may take a little bit more head-wrangling to get used to. Without further ado, let’s see how to use both methods. Reactivity with Getters and Setters Getters and Setters let you do something before a property is accessed (when getting) or changed (when setting). I assume you have some knowledge about Getters and Setters in this article. If this concept is new to you, you might want to check out this article where I go into more detail. If we put Getters and Setters into a context of showing or hiding an element based on a show state, we can write code similar to the following: function createState() { let _show = false return { get show() { return _show }, set show(value) { _show = value if (_show === true) open() if (_show === false) close() }, } } // Using this function const state = createState() state.show = true // This runs the `open` function state.show = false // This runs the `close` function In this case… When state.show is set to true, we’ll run an open function that does whatever the component needs to “open”. When state.show is set to false, we’ll run a close function that does whatever the component needs to “close”. This looks pretty cool — but there are two downsides: You need a createState function to create the state object — this is unnecessary boilerplate code in my opinion. Each tracked state requires a private variable, which can get complex and unwieldy as the size of the application increases. We can mitigate both downsides with JavaScript Proxies. Reactivity with JavaScript Proxies JavaScript Proxies function in a similar way compared to Getters and Setters — the only difference is you don’t have to create a wrapper function around it. Here’s the same code from above but with Proxies. let state = { show = false } state = new Proxy(state, { get(target, prop) { return Reflect.get(...arguments) }, set(target, prop) { Reflect.set(...arguments) if (prop === 'show') { const value = target[prop] if (value === true) open() if (value === false) close() } return true }, }) // Using this state.show = true // This runs the `open` function state.show = false // This runs the `close` function There’s a lot going on so let me break down what’s happening. Understanding the Proxy code First, proxies take in two values — a proxied object and a handler object. const proxied = new Proxy(targetObject, handler) In this case, I reassigned the state variable because I didn’t need to keep the original state values. This makes the code a little bit cleaner since there are fewer variables. let state = { show: false } state = new Proxy(state, handler) The handler object here allows you to define what happens when each property is accessed via get, set, and other methods. In this case, I used Reflect for both get and set which basically tells the proxy to perform the original actions on the accessed values — just like if you get or set a property normally. This is an important step — if you missed this then you’ll get an error with your proxies. state = new Proxy(state, { get(target, prop) { return Reflect.get(...arguments) }, set(target, prop) { Reflect.set(...arguments) return true }, }) // Getting the `show` value console.log(state.show) // false // Setting the `show` value state.show = true console.log(state.show) // true Fun Fact: The get, set, and other methods in a Proxy are called traps. I have no idea why they’re called traps but I think traps sounded a little too sinister 🙃. Finally, I tracked the show property and I used this to run open or close functions whenever its value changes. state = new Proxy(state, { set(target, prop) { Reflect.set(...arguments) if (prop === 'show') { const value = target[prop] if (value === true) open() if (value === false) close() } return true }, }) Downsides of JavaScript Proxies While researching to write this article, I found an article by Chris Ferdinandi that mentioned that Getters and Setters have better performance than proxies. I haven’t had the chance to personally test this out yet so I can’t guarantee whether one outperforms another. Personally, I think the performance difference is negligible in a real application. That’s it! Wrapping up If you want to create reactivity in your applications with Vanilla JavaScript, you can use one of these two methods: Getters and Setters JavaScript proxies Of the two, I believe proxies are superior because you can write terser code that contains less boilerplate (which ends up being easier to maintain). What do you think? I’d love to hear what your thoughts are. And if you learned something new from this article, I’d love it if you shared that with me too! :) If you enjoyed this article, you may also enjoy our programming courses — get 2-3 chapters of each of our courses for free here. (No email registration required). Further Reading More about Getters and Setters JavaScript proxies on MDN Magical Dev School Iterating over objects in JavaScriptThe easiest way to use SVGs in an Astro or Svelte app'''
