title = "Invisible adversaries | Zell Liew"
description = "They're just pretty well hidden."
full_description = "Invisible adversariesPublished:Mar 29, 2024In Bravery, I mentioned I had a few fears. These fears are real to me. They don’t feel like the bogeyman that Seth Godin mentions in the Practice. If they are, perhaps I haven’t summoned enough courage to look them in the eye, enough to a point that they disappear, yet. What I know is these fears arose from a previous psyche injury. They’re present in that injured part, but not in the others. What I have to do is: Acknowledge and accept that they exist. Resolve these traumas. (Programs like TCC can help). Put them aside and continue to move towards the future that I want to create. Invisible adversaries aren’t invisible at all. They’re just pretty well hidden. They will show up and let me resolve them as I continue to do my work. Chop wood, carry water.No more waitingDoItAnyway"
