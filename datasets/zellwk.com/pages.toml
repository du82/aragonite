full_description = "Killing and Restarting pm2 Published on: Dec 29, 2024I encountered a strange error with pm2 that has the following properties: pm2 list displays nothing even though processes should be running After restarting a couple of projects, pm2 list still displays nothing Running pm2 list hogs the server and creates a spike (see picture below). Understanding Recursion in JavaScript Published on: Oct 15, 2024Recursion happens when a function calls itself over and over. A function that calls itself over and over is called a recursive function. Here's an example of a recursive function: function helloWorld() { console.log(&#39;Hello world&#39;) helloWorld() } (Don't try this code because your browser would hang). I'll explain how you write a proper recursive function and why you may want to use one. Best Practice for Astro Endpoints Published on: Oct 8, 2024Astro strips away query parameters from endpoints if you're in a static rendering mode. So, unless you're using SSR for all your pages, you'll need to ensure that your endpoints are not pre-rendered. Speed of Svelte reactive bindings vs keyboard events Published on: Sep 24, 2024Svelte's reactive bindings execute slower than keydown, keypress, and input events, but faster than keyup events. Conditional Slot Forwarding is not a thing in Svelte 4 Published on: Sep 24, 2024If you ever wanted to forward conditional slots up two component levels, you're out of luck. Breaking out of Svelte's reactive statements Published on: Sep 18, 2024If you use Svelte, you may notice that Svelte lets you create reactive statements with $. It kinda looks like this: What developers should be learning Published on: Sep 8, 2024Many developers are learning frameworks and algorithms to keep up with trends — so they can continue to be employable. That's one way of looking at things. But I propose another approach. A Great Failed Experiment Published on: Aug 29, 2024Couple of years ago (I forgot exactly when), I removed the dates that were preceeding the file names of my blog articles."
