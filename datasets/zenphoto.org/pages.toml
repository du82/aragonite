title = "Online functions documentation for ZenphotoCMS 1.6 available | ZenphotoCMS - The simpler media website CMS"
description = "We used apiGen for the last few years but PHP 8.1 required that we change back to phpDocumentor. Sadly this required that we had to extensively update the @pack"
full_description = "News Online functions documentation for ZenphotoCMS 1.6 available June 30, 2023 Categories: News We used apiGen for the last few years but PHP 8.1 required that we change back to phpDocumentor. Sadly this required that we had to extensively update the @package tag in the docblocks. Since we wanted to get 1.6 released because of PHP 8 we didn't manage this in time for the release. With package support there is now again grouping of files per extension. phpDocumentor v3 does not provide any actual theming so we have to use the default theme as it is. Sadly that is not GDPR compliant using Google Fonts and various other external stuff. So we also manually had to fix all that for the hundreds of static HTML files generated. Take a look here: https://docs.zenphoto.org/1.6.x/ For questions and comments please use the forum or discuss on the social networks."
