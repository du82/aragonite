full_description = '''Advertising information Advertising Terms Of Service General We will accept advertisements by businesses that are compatible with Zenphoto's values and goals. Consumers cannot advertise. You or your advertisement may not imply that your service or product is approved or recommended by the Zenphoto team. If you advertise a Zenphoto related service like hosting write our name correctly and use the official logos. You need to provide real name or company's name and your postal address. Advertisements The ads on the "Sponsors" page appear in the order gold, silver and bronze categories. Several ads within each category are strictly sorted alphabetically by company name only. It is not possible to register a specific advertisement slot within a category. Only one ad per category per business allowed. The "sponsored by" naming on release posts that is included in yearly subscription rates of the Platinum and Palladium categories will be shown during the subscription time only. It will be displayed as a unordered HTML list within our release posts with your company's name linked. If there are more than one naming the order will be alphabetical. Ad sizes and order may vary on browser window size on responsive web design. Ads are plain HTML and CSS based and hosted on our site. External files, scripts, widgets or any other possibly tracking facilities are not allowed. The link to your site may include one or several specific campaign queries to identify the source like ?utm_source=zenphoto.org Subscription Time refers to the MEZ time zone You can only start your subscription with a full month. You can end your subscription or switch to another subscription rate any time to the last month of your chosen subscription rate. If we don’t hear from you your subscription renews automatically to the same rate. The prices listed on the advertisement page are applicable. Any price increase will only apply once your subscription is due to renewal. Any price deduction will apply instantly even for yearly subscriptions if monthly payment rates are chosen. Otherwise on subscription renewal. Payment We accept the following payment ways: PayPal, SEPA bank transfer. The payment must be made in Euro. Payment for yearly subscription rates may be made in advance in total or monthy You will receive an PDF invoice via mail. For German sponsors: Prices plus VAT. Legal The place of performance of the contract is the domicile of the site owner. The contract shall be governed by the laws of the Federal Republic of Germany. Advertisement categories Platinum 275x130px One ad per line Maximum of four ads in this category Location: Home page Subscription rates Monthly: 260 EUR / month Year: 220 EUR / month* *also includes a "sponsored by" naming on our release posts Palladium 275x130px One ad per line Maximum of four ads in this category Location: Sidebar of each page incl. forum sidebar Subscription rates Monthly: 160 EUR / month Year: 120 EUR / month* *also includes a "sponsored by" naming on our release posts Gold 560x130px One ad per line Unlimited ads in this category Location: Sponsors page Subscription rates Monthly: 100 EUR / month Year: 70 EUR / month Silver 270x130px Two ads per line Unlimited ads in this category Location: Sponsors page Subscription rates Monthly: 70 EUR / month Year: 45 EUR / month Bronze 125x130px Four ads per line Unlimited ads in this category Location: Sponsors page Subscription rates Monthly: 40 EUR / month Year: 25 EUR / month Bundles If you like to advertise in more than one category we can offer individual bundle prices. Please contact us. Please review our Advertising Terms Of Service before contacting us.'''
author = "The Zenphoto team and contributors"
