rd party Zenphoto 1.6 has been released in December and here we collected some updates we would like to inform you about: 3rd party theme updates zpBootstrap – The (…) Zenphoto 1.6 December 12, 2022 Categories: Changelog, News, Release, Security This is a minor security and a minor-major release including some structural changes as well as bugfixes. Developer note The plan is that the 1.6.x release is the last 1.x release before our long planned "major release". We (…) Debugging December 12, 2022 Categories: Development, FAQ, User Guide Enabling debug modes Since Zenphoto 1.6 it is possible to set the debug modes you need directly in your zp-data/zenphoto.cfg.php file. Any of the following debug modes may be used. The default is (…) zpBase 1.2 released September 17, 2022 Categories: News The "half official" theme zpBase has been updated to version 1.2 thanks to various contributions of our user citronalco. More info here: https://github.com/zenphoto/zpbase/releases/tag/v1.2 (…) « prev 1 2 3 4 5 6 7 ... 66 next »'
