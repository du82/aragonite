["https://zenphoto.org/news/translations-gettext-not-working-on-some-servers"]
title = "Translations (gettext) not working on some servers with mod_perl enabled | User guide | ZenphotoCMS - The simpler media website CMS"
description = "In case you notice that translations are not working on your site: This is out of our hands. The reason is a bug in Apache's mod_perl module on some server conf"
full_description = "User guide Translations (gettext) not working on some servers with mod_perl enabled February 20, 2021 / Updated: October 20, 2022 Categories: News, Troubleshooting, User Guide In case you notice that translations are not working on your site: This is out of our hands. The reason is a bug in Apache's mod_perl module on some server configurations which conflicts with the native PHP gettext functionality we use for translations. For example our local development environment MAMP 6.3 is affected by this as well. We have no idea when this will be fixed or how similar software (XAMPP, WampServer, etc) or your host's server may be affected. Translations work if the mod_perl module is disabled and Zenphoto does not require Perl anyway. Should you notice this and have control over your server disable it or contact your host about it. More info about this issue: https://www.claudiokuenzler.com/blog/1023/php-gettext-translations-not-working-apache-mod_php-cli-works This text by www.zenphoto.org is licensed under a Creative Commons Attribution-ShareAlike 3.0 Unported License. Code examples are released under the GPL v2 or later license For questions and comments please use the forum or discuss on the social networks."
