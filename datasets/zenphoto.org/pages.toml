["https://zenphoto.org/news/zenphoto-1.6.5"]
title = "Zenphoto 1.6.5 | ZenphotoCMS - The simpler media website CMS"
description = """
This is a bugfix release.
General

Metadata:

Fix broken EXIF image metadata import and formatting due to the old Exifer library being removed too soon in"""
full_description = '''News Zenphoto 1.6.5 October 23, 2024 Categories: Changelog, News, Release ContentGeneralSupport ZenphotoNew pluginsDeprecated pluginsPlugin updatesThemesTranslations Contributors: kuzzzma Guillermo Raúl Lapolla (guirala) Malte Müller (acrylian) NHTEC Antonio Ranesi (bic) Fred Sondaar (fretzl) Roland Tisserand (rolandti) tobifra This is a bugfix release. General Metadata: Fix broken EXIF image metadata import and formatting due to the old Exifer library being removed too soon in 1.6.3 [acrylian, fretzl – Thanks to kuzzzma and bic] Fix duplicate tags on metadata import and elsewhere [bic] New option to choose the metadata refresh behaviour in Options > Image [acrylian] Fix password match in registration form [bic] Fix and improvements for search album breadcrumbs [bic| Fix broken image sorting [acrylian] Fix albums to be selectable on the uploads page although a user has no rights to them. This fixes class methods isMyItem() and isVisible() to work as expected for albums regarding album subrighs if checking with UPLOAD_RIGHTS or ALBUM_RIGHTS. [acrylian] Fix status inheritance of subalbums of albums in scheduled publishing and that prescheduled published albums sometimes were not properly published [acrylian – Thanks to kuzzzma] Fix type of various incremented variables regarding stricter PHP 8+ behaviour [acrylian] jQuery 3.7.1, jQuery Migrate 3.5.0, jQuery Ui 1.14 [acrylian] Support ZenphotoYour donation helps pay for this server and development of Zenphoto. Thank you!Donate now New plugins tinymce: Long overdue update to TinyMCE 7+ [acrylian, bic, fretzl] This is the successor of the tinymce4 plugin which will be removed with the next version. NOTE: If you have used custom configs for tinymce4 you may have to re-create them as a number of former TinyMCE plugins are gone and some options have changed that may cause trouble in the future. The number of default config files has been reduced to slilm, basic and full. Deprecated plugins tinymce4: Use the new tinymce plugin as the successor Plugin updates comment_form: Fix address fields having double autocomplete attribute if that is enabled [acrylian] Adds text and math quiz fields as privacy friendly alternative/addition to captcha for fighting SPAM [acrylian, bic] Support for tinymce4 and tinymce plugins. Note: A tinymce plugin must be active to use with the comment_form [acrylian] contact_form: Adds text and math quiz fields as privacy friendly alternative/addition to captcha for fighting SPAM [acrylian, bic] Autofill available address fields, fixed deprecated log entry due to type mismatch in PHP 8.x [bic] downloadlist: Fix download link error due to wrong access rights check [tobifra] elFinder: elFinder 2.1.64 [acrylian] favoritesHandler: Avoid duplicate instances of the same image/album [bic] Fix Users watching list in admin page [bic] Convert character case of new instances to possibly existing ones, since instance options are case-insensitive [bic] Prevent tag_suggest bind code from output when not needed (i.e. most of the times) [bic] Fix page count and a wrong use of $this in the static function pageCount() [bic] Add instance name set to head title and use the text from the relevant option [bic] Rename favorites class method ad_RemoveButton() to proper printAddRemoveButton() [acrylian] html_meta_tags: Fix image usage on non photo images [acrylian, bic] OpenStreetMap: Various optimisations for marker popups; option to disable default styles [kuzzzma, acrylian] Leaflet 1.9.4 and leaflet-providers 1.13.0 updates [acrylian] PHPMailer: PHPMailer 6.9.2 [fretzl] print_album_menu: Prevent printing of empty ul element for subalbums of protected albums [bic] redirector: Fix option storing absolute server path to selected file breaking it in case migrated or otherwise changed [acrylian] register_user: Fix form not being submitted [acrylian – Thanks to NHTEC] Options moved to separate registerUserOptions class, main plugin class renamed from register_user to registerUser [acrylian] Several internal global variables have been turned into static class properties. If you used a custom form you need to update it as there is no fallback or deprecation warning! $_common_notify_hander => registerUserOptions::$common_notify_handler $admin_e => registerUser::$admin_email $admin_n => registerUser::$admin_name $user => registerUser::$user $_notify => registerUser::$notify $_link => registerUser::$link $_message => registerUser::$message Template functions printRegisterURL() and printRegistrationForm() now deprecated in favor of using registerUser class methods registerUser::printLink() and registerUser::printForm() [acrylian] Adds text and math quiz fields as privacy friendly alternative/addition to captcha for spam fighting [acrylian] Registered users now have USER_RIGHTS by default so they are able to edit their personal credentials [acrylian] tinymce & tinymce4: tinyZenpage: Fix broken inserting of items whose titles have double or single quotes ("/') [bic] Enable browser spellcheck (with warning on privacy concerns with browsers spellchecks in general) (kuzzzma) Option to disable TinyMCE right-click menu in favour of browser right-click menu (with note on how to use it in conjunction with TinyMCE one) (kuzzzma) Option to specify editing field height (kuzzzma) zenpage: Fix protected but published toplevel categories not being listed in category menu [acrylian] Themes basic, garland, zenpage, zpmobile: Deprecated register_user plugin template function calls updated [bic, acrylian| zenpage: Fix printUserLogin_out() link in sidebar causing an invalid HTML list [acrylian] Translations Argentinian Spanish [guirala] Dutch [fretzl| French [RolandTI] German [acrylian] Italian [bic] Russian [kuzzzma] Spanish [guirala] For questions and comments please use the forum or discuss on the social networks. Related items Secure submitting of forms (User guide) tinymce (Extensions) Zenphoto 1.6.4 (News) Zenphoto 1.6.3 (News) adminBranding (Extensions)'''
