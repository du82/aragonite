["https://zenphoto.org/news/zenpage-a-cms-plugin-for-zenphoto"]
title = "Zenpage - A CMS plugin for Zenphoto | Extensions | ZenphotoCMS - The simpler media website CMS"
description = "Zenphoto is already the easiest gallery management system available but it does not have any normal page management capability. Therefore many people use Zenpho"
full_description = '''Extensions Zenpage - A CMS plugin for Zenphoto March 01, 2009 / Updated: July 25, 2023 Categories: Core plugins, Extensions, Officially supported, Theme plugins ContentFeaturesUsageDemoWhat users saytinyZenpageZenpage changelog until version 1.1Zenpage 1.1Zenpage 1.0.1Zenpage 1.0 Developers: Stephen Billard (sbillard) Malte Müller (acrylian) Zenphoto is already the easiest gallery management system available but it does not have any normal page management capability. Therefore many people use Zenphoto in combination with another CMS.With Zenpage you can now extend the easy to use interface to manage an entire site with pages and news (blog) Considering Zenphoto's image, video and audio management capabilites this is the ideal solution for personal portfolio sites of artists, graphic/web designers, illustrators, musicians, multimedia/video artists, photographers and many more.You could even run an audio or podcast blog with Zenphoto and Zenpage. Features Fully integrated with Zenphoto Custom page management News section with nested categories (blog) Tags for pages and news articles Page and news category password protection Scheduled publishing RSS feed for news articles Comments on news articles and pages incl. subscription via RSS CombiNews feature to show the lastest gallery items like image, videos or audio within the news section as if they were news articles Localization and multi-lingual WSIWYG text editor TinyMCE with elFinder file manager included TinyMCE plugin tinyZenpage to include Zenphoto and Zenpage items into your articles or pages Usage Zenpage theming (part 4 of the Zenphoto theming tutorial) Zenpage functions guide is now included in the plugins section of the Zenphoto functions guide Zenpage troubleshooting (FAQ) Demo On the official Zenphoto demo you can select the themes Zenpage, Efferescence+ and Garland that also have support for the Zenpage CMS plugin. Here are also some screenshots of the backend. Also our own site is completely run using Zenphoto with Zenpage although heavily customised (the forum is separate). Also there is the pre-announcement teaser fun movie: What users say "I really like ZenPage. I like how it integrates with ZenPhoto, I like how easy it is to customize, and I like it much better than WordPress. Setting up my ZenPage/ZenPhoto site has been very addictive; I'm having too much fun and I can't stay away from it!"Annie March"Wow with this zenphoto is complete!" BertSimons"Zenphoto and Zenpage is awesome!!!" darrellm"acrylian, first of all, congratulations on the release of zenpage - well worth the wait - thank you." stevenew"I've just completed a new site based on Zenphoto and Zenpage. These are awesome apps and much thanks goes to the developers!" climberusa"First of all, Zenpage is brilliant! It really completes Zenphoto." fretzl"By the way, I think you have done an excellent job with zenpage (and zenphoto in general of course) so far. It works perfectly with gallery-focused websites. Big up!" VisualHarmony "Thank you for Zenpage. I really like it and just deployed it on a website. (...) Thanks for a great CMS integration." jayray999 tinyZenpage This is a TinyMCE plugin that is included by default and provides access to your Zenphoto albums and images as well as Zenpage pages, news articles and news categories to easily include them into your pages and articles. Obviously inspired by ZenphotoPress by Alessandro "Simbul" Morandi.You will see a button for it on the TinyMCE tool bar: There are detailed instructions included in the main window itself and here is a separate small tutorial named Using tinyZenpage that gives you a more visual impression on how it works. Zenpage changelog until version 1.1 Up to version 1.1 Zenpage was released independently. Zenpage 1.1 Restructuring and optimization of the internal class/object orientation setup [acrylian] Restructuring and optimization of the admin backend pages [acrylian] Code improvements and bugfixes [acrylian, sbillard] tinyMCE toggle [shortschoolbus] Breadcrumb for pages [acrylian] Latest albums for the CombiNews feature [acrylian] tinyZenpage fix for IE and Safari [acrylian, sbillard] Several bugfixes, translations updates Zenpage 1.0.1 tinyZenpage now included by default plus some bugfixes [acrylian, sbillard] Zenpage-default theme fixes for Internet Explorer [acrylian, sbillard] Zenpage setup improvements [sbillard] Unpublished items are now accessible via direct link to match the behaviour of Zenphoto's unpublished items [acrylian] Translations for Zenpage, Zenpage-default theme and tinyZenpage Dutch translation [fretzl] French translation [flu, Samy Rabih] German translation [acrylian] Several bugfixes, typo corrections plus fixes required by Zenphoto 1.2.2 [acrylian, sbillard] Zenpage 1.0 Fully integrated with Zenphoto Custom page management News section with categories RSS feed for news articles Comments on news articles and pages CombiNews feature to show the lastest gallery items within the news section as if they were news articles Localization and multi-lingual (German translation included) WSIWYG text editor TinyMCE with Ajax File manager included Zenpage-default theme included This extension is included in the ZenphotoCMS release. For questions and comments please use the forum or discuss on the social networks. Tags: author_acrylian, author_sbillard, blog, cms, news, pages, password, theme, tiny_mce, zenpage, zenpage-news, zenpage-pages More by author: Acrylian (161) Sbillard (175) Related items Zenphoto 1.6.5 (News) Secure submitting of forms (User guide) tinymce (Extensions) Third party theme: Paradigm 2.0 released (News) Zenphoto 1.6.4 (News)'''
