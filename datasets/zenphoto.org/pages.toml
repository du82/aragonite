full_description = "About us | Former team members Stephen Billard (sbillard) Former Zenphoto team member , Chief developer , Forum moderator Retired. BS from Yale in 1966, MBA from the University of California (Irvine) 1982. 35 years in software development in all sorts of roles, including Director of Operating Systems development at the Unisys (nee Burroughs) facility in Mission Viejo, CA. and former primary implementer of the Burroughs Master Control Program for the Burroughs mainframe computers. Author and publisher of a number of Shareware, Freeware, and commercial software packages including: Printographer for the Apple II and the GUI front end for QuadToneRIP, a B&W printing RIP Website: sbillard.orgRelease contributions (28) Zenphoto 1.4.6 – May 26, 2014 Zenphoto 1.4.5 – July 02, 2013 Zenphoto 1.4.4 – January 01, 2013 Zenphoto 1.4.3 – July 01, 2012 Zenphoto 1.4.2 – January 15, 2012 Zenphoto 1.4.1 – June 21, 2011 Zenphoto 1.4 – January 02, 2011 Zenphoto 1.3.1 – August 09, 2010 Zenphoto 1.3 – May 27, 2010 Zenphoto 1.2.9 – March 01, 2010 Zenphoto 1.2.8 – January 01, 2010 Zenphoto 1.2.8 changelog – December 19, 2009 Zenphoto 1.2.7 Changelog – November 30, 2009 Zenphoto 1.2.6 RC1 – July 26, 2009 Zenphoto 1.2.5 – May 18, 2009 Zenphoto 1.2.4 – March 30, 2009 Zenphoto 1.2.3 – February 01, 2009 Zenphoto 1.2.2 – December 02, 2008 Zenphoto 1.2.1 – October 01, 2008 Zenphoto 1.2 – August 16, 2008 Zenphoto 1.1.7 – July 01, 2008 Zenphoto 1.1.6 – May 16, 2008 Zenphoto 1.1.5 – February 29, 2008 Zenphoto 1.1.4 – February 01, 2008 Zenphoto 1.1.3 – December 16, 2007 Zenphoto 1.1.2 – November 08, 2007 Zenphoto 1.1.1 – November 05, 2007 Zenphoto 1.1 – November 02, 2007 Theme contributions (2) garland – September 20, 2007 effervescence+ – December 12, 2007 Extensions contributions (117) tinymce – October 22, 2024 bxslider_thumb_nav – May 26, 2014 userAddressFields – May 26, 2014 galleryArticles – May 26, 2014 defaultCodeblocks – May 26, 2014 externalFeed – May 26, 2014 galleryToke