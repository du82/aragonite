["https://zenphoto.org/news/zenphoto-1.6.2"]
title = "Zenphoto 1.6.2 | ZenphotoCMS - The simpler media website CMS"
description = """
This is a bugfix release.
General 

Internal setup version catalogue properly updated so setup does not report skipped releases erroneously [acrylian]
Ensur"""
full_description = '''News Zenphoto 1.6.2 March 11, 2024 Categories: Changelog, News, Release ContentGeneral Support ZenphotoPlugin updatesDeprecated pluginsTranslation Contributors: ctdlg kuzzzma Malte Müller (acrylian) Fred Sondaar (fretzl) Roland Tisserand (rolandti) This is a bugfix release. General Internal setup version catalogue properly updated so setup does not report skipped releases erroneously [acrylian] Ensure all image processing px values are rounded to integers before passing them to the image processing [acrylian] Disable localized dates option on saving and also within zpFormattedDate() if the PHP intl extension is not available to avoid fatal errors. Also adds warning to admin options if not [acrylian] Display image metadata dates without considering timezone. Applying to dates like "2009-05-14T13:30:29+10:00" [acrylian – Thanks to kuzzzma] Support ZenphotoYour donation helps pay for this server and development of Zenphoto. Thank you!Donate now Plugin updates backup_restore: Rework/move former procedural inline functions to separate backupRestore class and fix issue of latest tag getting lost on restoring backups. The functions were inline and exclusive to this utilitiy and therefore have been removed without deprecation [acrylian] comment_form: Default internal "remember" behavior disabled and replaced by an optional checkbox field so commenters may choose. Logged in users are alwys rememberer as long as they are logged in as before [acrylian] html_meta_tags: Set robots to noindex, nofollow for paginated pages by default to follow SEO best practices and add options to allow otherwise [acrylian] Add suppprt and options for <link rel="prev/next"> for gallery and news pagination and for single image pages [acrylian] Additional options for site verifications for Bing, Baidu, Pinterest and Yandex [acrylian] New option so canonical URL's of images of dynamic albums point to the real albums instead to avoid duplicate content. Enabled by default [acrylian] lazyload: Option to disable loading the lazysizes script to use native lazyloading modern browsers suppprt now. Also adds decoding="async" attribute [acrylian] related_items: Fixed not returning any results [fretzl] sitemap_extended: Fix category page listing as page 1 [acrylian] Paginated pages are excluded by default from sitemap to follow general SEO best practice but options have been added just in case it makes sense for individual usages and fix variable type issue [acrylian] lastmod values reworked to use the latest date from the nomal item date, the last change date and for albums only also the updated date. News categories now use the date of the latest article assigned, their own last change date or the current [acrylian – Thanks to kuzzzma] Fix dynamic albums being included in album sitemap. But there is a new option to allow this it if neeed [acryllan – Thanks to ctdlg| slideshow2: Fix public albums being blocked as protected [acrylian] Deprecated plugins mobileTheme: mobileTheme: Now deprecated but the outdated MobileDetect library has been updated one last time nevertheless. PHP 8+ required now [fretzl, acrylian] Translation Dutch [fretzl] French [rolandti] German [acrylian] For questions and comments please use the forum or discuss on the social networks. Related items Zenphoto 1.6.5 (News) Secure submitting of forms (User guide) tinymce (Extensions) Zenphoto 1.6.4 (News) Zenphoto 1.6.3 (News)'''
author = "The Zenphoto team and contributors"
year_published = 2024
year_updated = 2024
