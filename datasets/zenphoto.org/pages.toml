full_description = "Extensions Tidy Assets January 30, 2021 / Updated: June 13, 2022 Categories: Extensions, Performance, Theme plugins, Third party, Unsupported, Unsupported – 3rd party external Developer: Antonio Ranesi (bic) A plugin to rearrange Zenphoto resources. Tidy Assets shifts all Zenphoto JavaScript items to the bottom of the body element, including inline scripts and optionally CSS resources as well. This can improve the user experience on their first visit to your site by delaying render-blocking resources. This plugin has been developed starting with headConsolidator v1.4.3 by Stephen Billard (sbillard). Info & download (GitHub) For questions and comments please use the forum or discuss on the social networks. Tags: assets, author_bic, css, javascript, JS, seo, tidy More by author: Bic (21) Related items Zenphoto 1.6.5 (News) tinymce (Extensions) Zenphoto 1.6.4 (News) Zenphoto 1.6.3 (News) Zenphoto 1.6.1 (News)"
