["https://zenphoto.org/news/features"]
title = "Features | User guide | ZenphotoCMS - The simpler media website CMS"
description = """
Easy Media website management!
Zenphoto is a CMS for selfhosted, gallery focused websites. Our focus lies on being easy to use and having all the features ther"""
full_description = '''User guide Features March 22, 2014 / Updated: June 12, 2022 Categories: FAQ, User Guide ContentEasy Media website management!Manage image, video and audio files!Manage blog and pages!Multi-user managementInternational sites with multiple languages!Create your own website design!Extend Zenphoto with features you need! Authors: Stephen Billard (sbillard) Malte Müller (acrylian) Fred Sondaar (fretzl) Easy Media website management! Zenphoto is a CMS for selfhosted, gallery focused websites. Our focus lies on being easy to use and having all the features there when you need them (but out of the way if you don't). Zenphoto features support for images, video and audio formats, and the Zenpage CMS plugin provides a fully integrated news section (blog) and custom pages to run entire websites. This makes Zenphoto the ideal CMS for personal websites of illustrators, artists, designers, photographers, film makers and musicians. Manage image, video and audio files! File system based: Upload files and folders via the administration or directly via FTP Search engine with boolean expressions Dynamic albums based on "saved searches" Multifile upload Scheduled publishing RSS Watermarks Automatically generated sized images EXIF/IPTC metadata support Drag & Drop sorting of albums and images Moving, copying, renaming of albums and images Supported formats: Images: .jpg, .gif, .png, webp (generally all formats your server's graphics libary supports) Videos: .mp4*, .m4v*, .ogv**, .webm** Audio: .mp3*, .m4a*, .oga**, .webma** Other formats (basic support only): .txt*,.html*, .pdf*, .pps* Slideshow* Comments* Tags Statistics Rating ...and much more! * via official plugins; handled by any modern HTML5 capable browser natively - extendable via custom plugins **via e.g. the jPlayer multimedia player only as fallback counterpart formats. See the jPlayer website for more info. Manage blog and pages! Custom pages management including nested subpages Custom menu's Drag & drop sorting of pages and categories News section (blog) with nested categories Post of new gallery items in the news section (blog) File manager for none gallery files* Scheduled publishing Comments* RSS* Tags Statistics Rating ... and much more! Read more about the Zenpage CMS plugin Multi-user management User managment User groups Per user rights assignment Password protection for albums and pages Read more about user rights International sites with multiple languages! Admin backend translatable (gettext server support required) Many backend translations included (gettext server support required): Chinese, Dutch, French, Galician, German, Hebrew, Japanese, Polish, Spanish, Swedish (See also Current language repository) Multilingual sites with subdomain support for separate language sites (e.g. fr.domain.com, en.domain.com) Read more about language features Create your own website design! Highly customizable theme engine (HTML5, CSS, PHP) Four standard themes included, more themes available Object model framework for advanced theming and flexibility Multiple layouts within a theme Separate theme translations Visit the themes section or the theming tutorial Extend Zenphoto with features you need! Sophisticated plugin system Frontend and backend filters Object model framework for advanced coding Many plugins included plus more 3rd party ones available Visit the extensions section This text by www.zenphoto.org is licensed under a Creative Commons Attribution-ShareAlike 3.0 Unported License. Code examples are released under the GPL v2 or later license For questions and comments please use the forum or discuss on the social networks. Tags: author_acrylian, author_fretzl, author_sbillard Related items Zenphoto 1.6.5 (News) Secure submitting of forms (User guide) tinymce (Extensions) Zenphoto 1.6.4 (News) Zenphoto 1.6.3 (News)'''
