full_description = "ZenphotoCMS is a CMS for selfhosted, gallery focused websites. Our focus lies on being easy to use and having all the features there when you need them (but out of the way if you do not). ZenphotoCMS features support for various media formats and integrated blog and custom pages. ZenphotoCMS is the ideal CMS for personal websites of illustrators, artists, designers, photographers, film makers and musicians. Please report any bugs you find with a detailed description via tickets at the Zenphoto bugtracker on GitHub.com. You can post help requests and discuss everything Zenphoto related in the Zenphoto support forums (Registration required for posting). Please do not e-mail us asking for help. Thanks! You would like to contribute? You don't need to be a programmer! Read here what you can do for Zenphoto!"
