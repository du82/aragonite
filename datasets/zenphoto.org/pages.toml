full_description = "Themes « Multiverse (previous) pink clouds (next)» Paradigm Developers: Olivier Ffrench (offrench) kuzzzma Paradigm has been designed to allow maximum flexibility. It works well with websites that have lots of text data: news, pages, tags, as well as image albums. It provides a few useful characteristics: main navigation with dropdown menu (built automatically), local navigation with accordion menu, sidebar tag cloud, support for extra content and codeblocks. This theme is based on the Bootstrap framework, is optimised for SEO and social read. The original theme from http://www.france-in-photos.com/pages/zenphoto-theme is not completely compatible with Zenphoto 1.6+ anymore. It is now maintained and developed further by kuzzma Layout specific plugins supported: comment_form contact_form GoogleMap image_album_statistics print_album_menu zenpage-a-cms-plugin-for-zenphoto Date added: 2016-03-12 00:00:00 Info & download (external) Paradigm 1.3: album Paradigm 1.3: image(...) Paradigm 1.3:(...) Rating 3.3 (12 votes) var recast_albums_130635 = 1; $(document).ready(function() { $('#star_rating_albums_130635 :radio.star').rating('select', '7'); }); function cast_albums_130635() { var dataString = $('#star_rating_albums_130635').serialize(); if (dataString || recast_albums_130635) { if (!dataString) { dataString = 'star_rating-value_albums_130635=0'; } $.ajax({ type: 'POST', cache: false, url: '/zp-core/zp-extensions/rating/update.php', data: dataString + '&id=130635&table=albums' }); recast_albums_130635 = 1; $('#vote_albums_130635').html('Vote Submitted'); } else { $('#vote_albums_130635').html('nothing to submit'); } } View Slideshow More by author: Kuzzzma (8) Nothing else available by Offrench"
