["https://zenphoto.org/pages/forum-terms-of-service"]
title = "Forum terms of service | ZenphotoCMS - The simpler media website CMS"
description = """
1 General
This forum provides a place to discuss the web media content management system Zenphoto, also called ZenphotoCMS.
Registration. You must register to"""
full_description = '''Forum terms of service 1 General This forum provides a place to discuss the web media content management system Zenphoto, also called ZenphotoCMS. Registration. You must register to use the forum. We may refuse registration without notice. On registering and posting you agree to these terms of service. If you don’t agree you may not register and not post on this forum. Data storage and handling. If you register you agree with the storage and handling of your data by this website. You can read more about on our general privacy statement. Free usage. Registration and usage of the forum is free. Changes to terms of service. We may change these terms of service at any time. Changes will be announced on the forum. 2 Password and user account Responsibility. You take full responsibilty for the confidentiality and security of your account and its password. You also are responsible for any content your post on the forum. Privacy. The data you entered on your forum account is only used for the forum and will not be shared with any third party, unless required by law. You can read more about on our general privacy statement . Deleting your account. Because of the forum software it is currently not possible to delete your account yourself. If you wish to be deleted please drop us a note on the forum or via the mail form on our site. 3 Posting Responsible content. You agree, through your use of this service, that you will not use this community to post any material which is knowingly false and/or defamatory, inaccurate, abusive, vulgar, hateful, harassing, obscene, profane, sexually oriented, threatening, invasive of a person's privacy, or otherwise violative of any law. You agree not to post any copyrighted material unless the copyright is owned by you. Content removal. We reserve the right to remove any content for any reason or no reason at all. We reserve the right to terminate any membership for any reason or no reason at all. Forum language. The forum language is English only. Zenphoto has users in many countries, so this way all visitors have the chance to understand. Double posting. Before you post anything or open a new thread please first search the forum and our website’s user guide to see if your question is known and a solution exists. “Bumping” topics. Please remember that your question is no more important than the next person's. So meaningless posts just to move it to the top are not acceptable. Should you do this your thread will be frozen making getting an answer extremely difficult. Non Zenphoto specific questions. Our resources are somewhat limited, so we will primary focus on issues that are really Zenphoto specific. For general webdesign or web development issues there are plenty of places out there. We will try to help where we can though and probably some of our users will jump in to help too. Zenphoto unrelated postings. Postings that are absolutly not related to Zenphoto, especially SPAM, may be deleted without warning, as is the responsible user account. If you wish your post to stay, say something real. Advertisements and commerical promotions. Any commerical activity, advertisement, promotion of services or products on the forum is forbidden unless permitted by us beforehand. Postings maybe be deleted without warning, as is the responsible user account. Promotion and support of your third party contributions. If you created a custom plugin or theme for Zenphoto that is free and open source you may promote your work on our forum and also use forum to provide free support for your work. Support questions for third party solutions. If you have problems or questions about 3rd party solutions (themes, plugins etc), we strongly recommend to put the name of that solution in the thread title so its author has a chance to notice it and possibly give support. Many of them visit the forum quite regulary. The Zenphoto team will try to help if possible but can't support 3rd party solutions explicity. Bug reports. If you think you have found a real bug and can't find anything about it on the forum and our user guide, please read our general bug report guidelines first. Following these helps us to help you. "One click" installation tools. There are a number of install scripts available provided by commercial companies that can install Zenphoto. These tools may not reliably accomplish their goal – sometimes some webhosts also seem to provide older Zenphoto versions – and leave a flawed installation. We are not involved in these scripts, do not test them and therefore cannot provide support if their use causes Zenphoto problems. Posting ideas for new features. If you have an idea for a feature, please open a ticket/issue on GitHub (you will need a free account). Note: Opening a ticket/issue will be considered as a suggestion and the developers can't guarantee if and when it will be done. Of course if you or anyone else wants to code it yourself, this is welcome too. Please read our Get involved page first before starting. You can discuss everything on the forum of course. Entering the Zenphoto showcase gallery. If you would like to submit your site to the showcase gallery in the showcase forum thread please note that we can't guarantee that we include every submitted site. Sites using basically unmodified versions of any standard or other theme from our site's themes page won't be posted. The showcase is not about your pictures and how great they may be but about individual usage of Zenphoto. Of course sites not using Zenphoto, at least partly, are invalid and links to them will be removed. 4 Legal The forum shall be governed by the laws of the Federal Republic of Germany.'''
author = "The Zenphoto team and contributors"
year_published = 2025
clearnet = "https://zenphoto.org/pages/forum-terms-of-service"
