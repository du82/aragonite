full_description = '''Themes « ensellitisZEN (previous) facedout (next)» example Developer: Tristan Harward (trisweb) This theme was originally developed to show off as many Zenphoto functions as possible and really to be used as a theme. It turned out to be an extremely simple theme that many people get excited about. There are two versions included, and one of them precaches the next image to make a great browsing experience. Layout specific plugins supported: archive_calendar comment_form contact_form dynamic-locale rating register_user slideshow user_login-out Date added: 2007-12-12 07:40:08This theme has been abandoned by the ZenphotoCMS team and we provide it for archival purposes "as is". We may sometimes roughly update it but cannot promise full compatibility with current ZenphotoCMS releases. Contributions are welcome. Info & download (GitHub) Index page Image page Album page Rating 4.0 (21 votes) var recast_albums_56 = 0; $(document).ready(function() { $('#star_rating_albums_56 :radio.star').rating('select', '8'); }); function cast_albums_56() { var dataString = $('#star_rating_albums_56').serialize(); if (dataString || recast_albums_56) { if (!dataString) { dataString = 'star_rating-value_albums_56=0'; } $.ajax({ type: 'POST', cache: false, url: '/zp-core/zp-extensions/rating/update.php', data: dataString + '&id=56&table=albums' }); recast_albums_56 = 1; $('#vote_albums_56').html('Vote Submitted'); } else { $('#vote_albums_56').html('nothing to submit'); } } View Slideshow More by author: Trisweb (42)'''
