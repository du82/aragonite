["https://zenphoto.org/news/zenphoto-1.6"]
title = "Zenphoto 1.6 | ZenphotoCMS - The simpler media website CMS"
description = """
This is a minor security and a minor-major release including some structural changes as well as bugfixes.
Developer note
The plan is that the 1.6.x release is"""
full_description = '''News Zenphoto 1.6 December 12, 2022 Categories: Changelog, News, Release, Security ContentDeveloper noteRequirements changedSetup behaviour changesDatabase utf8mb4 supportSpecial note for theme authors regarding PHP 8.1:SecurityGeneral changes and fixesNew utilitiesThemesPluginsPlugins removedDeprecated pluginsPlugin updates and changesTranslationsCore changes I: General changesDeprecation handling changedNew folder organizationClass name changes and separation into individual filesRenamed core filesRenamed core foldersCore changes II: New core classesClasses for database handlers and new global variableClasses for graphics handlers and new global variableMimeTypes library now a classCore changes IV: Various internal changesSingle former procedural functions moved to classesNew method for main item classesGlobal variable name changesCoreAdmin onlyOther renamed admin globals:PluginsThemesGlobal variables removed Contributors: abdulrahman brucepimenta JPCERT Coordination Center (jpcert) eclrgp Mark Headrick (markrh) henrysting jessehc jhhua kjonescubist kochs-online Guillermo Raúl Lapolla (guirala) Malte Müller (acrylian) Antonio Ranesi (bic) Fred Sondaar (fretzl) subjunk This is a minor security and a minor-major release including some structural changes as well as bugfixes. Developer note The plan is that the 1.6.x release is the last 1.x release before our long planned "major release". We therefore consider 1.x to be feature freezed and will only do bug fixes. All standard themes and some plugins have also been deprecated. We need to basically close 1.x as we otherwise will never get the "next major release" ready. That release also will have a lot of internal changes that don't match 1.x, so maintaining changes in two release streams causes a lot of overhead for which we don't have the resources anymore. The 1.6 release features a few core changes which are an indication of much more internal changes to come in the "next major release". You should not notice these changes if you are using officially included themes and plugins. If you created themes or plugins yourself or use older third party themes and plugins we cannot guarantee that. Please review the debug log if you notice any issues. Requirements changed Minimum requirement PHP 7, PHP 8 recommended – PHP 8 and 8.1 supported (probably 8.2 as well although we are not able to test that yet).. This may be the last release with PHP 7 support. Zenphoto expects native PHP core extensions to be available and may not specifically check or warn about these. Certain missing PHP bundled or externral extensions recommended or required will be noted on setup as usual. General info: https://www.php.net/manual/en/extensions.membership.php jQuery 3.6.1 + jQuery UI 1.13.2 update. We also included the jQuery Migrate 3.4.0 plugin so legacy jQuery code and tools should still work. Very old browser may have problems in various JS related areas and this will not be fixed. More info about this on https://jquery.com/browser-support/ Setup behaviour changes Setup on the first page will now report issues only. The setup log will contain the full info if needed. The 2nd page is as always. Note on fresh install: You can only once enter database credentials via the setup form. Once the config file is created and you have wrong credentials you have to enter them in the file itself via FTP. We only consider it a "fresh" install as long as there is no config file present. The reason for this is that without db credentials we cannot check for authorized setup access and the form would be open to any visitor coming by to enter any db credential. This is a potential security risk. Also the site is now in maintenance mode (see the info below) as soon as setup is started to block any outside access disturbing it. Database utf8mb4 support Long overdue Zenphoto now supports full UTF-8 aka utf8mb4 collations. For a long time Zenphoto used the collation utf8_unicode_ci for new tables already. If your database server supports it, new tables (and its text columns) will now be created using utf8mb4_unicode_ci or utf8mb4_unicode_520_ci. If you are doing an upgrade and already have utf8_* collation tables with all columns using any utf8_* collation, setup will attempt to change the collation to one of the above utf8mb4 collations. There should not be any issues since UTF-8 should be compatible. However we can never guarantee this. Before updates you should therefore always make a database backup anyway. Tables that are not fully using any utf8_* collation – like those from an old install that use latin1 or similar – will not be changed as there might be more complicated conversions of the data necessary to not break anything. Especially if you are using non Western European encodings. [acrylian, fretzl - Special thanks to kochs-online, bic, MarkRH, eclrgp] Special note for theme authors regarding PHP 8.1: The old common way of using the native @call_user_func('somePluginFunction") to suppress errors of non available functions from plugins which are not enabled is not compatible with PHP 8+. This will cause a TypeError similar to a Fatal Error and break your theme. We introduced a new function callUserFunction() as a compatible replacement. Security elFinder has been updated to fix some security related issue [fretzl, acrylian] backup_restore utility: File names now get a random key appended so they are not that easy to guess The backup folder can now be renamed and optionally be placed outside the webroot, just like the albums folder, via the config file. Use $conf['backupfolder_folder'] and $conf['backup_folder_class']. Otherwise it follows the documentation of the albums folder. Note that the folder of course must exist in the location defined, as it will not be created automatically [acrylian - Thanks to abdulrahman| Serveral PHP object injection issues with unserialize() usages fixes. Also adds additional parameter to getSerializedArray(). This affected the plugins GoogleMaps, register_user, and user_expiry [acrylian - Thanks to abdulrahman] XSS issue with searchform [acrylian – Thanks to JPCERT] General changes and fixes All functions and class methods deprecated for 1.6 have now been removed. See also the section about changed deprecation handling below [acrylian] The native PHP function strftime() has been deprecated in PHP 8.1 (https://www.php.net/manual/en/function.strftime.php) so we already removed its usage [acrylian, fretzl - Thanks to bic and kochs-online] Since the strftime() date formats are not compatible with standard date() date formats we added a function to cover a general internal conversion. But you should update your custom code as otherwise there will be frequent deprecation notices in the debug log. Also if you used date formats with day and/or month names the automatic translation requires the PHP (bundled) extension intl to be available. Fix missing comment bulk actions on albums and images [acrylian] Improve dispaly of theme and plugin deprecation notes [acrylian] Changes colors of noteboxes (now blue, formerly orange) and warningboxes (now orange, formerly yelllow) [acrylian, fretzl] Fix image processor issue with webp images that didn't allow the suffix [acrylian, fretz – Thanks to sam-19 and sbillard] New thumb transition page handling: You now have much more control over how many image thumbs will be shown [acrylian, fretzl] Fix an issue with maxspace thumbs of default and custom sidecar images [acrylian, fretzl - Thanks to kjonescubist] Debug modes can now be enabled via the config file instead of hacking a core file [acrylian] Fix the blocking of the Matomo widget and the tinyMCE Preview modal by adding directives to the Content-Security-Policy header [fretzl] Speed improvement regarding site with lots of users and content [SubJunk] Fix for avoiding duplicate options table entries on setup [SubJunk] Fixes single image prev/next pagination within dynamic albums [acrylian] Fix site and image custom copyright url not being saved and used properly [acrylian] printCopyrightNotice() now a wrapper for gallery and image copyright nottices, [acrylian, bic-ed - Thanks to JesseC] shortcuts printGalleryCopyrightNotice() and printImageCopyrightNotice() added, parameter $linked added, fixes gallery and image class getCopyrightURL() methods neither using custom urls or Zenpage page urls at all. Option to enable site gallery copyright notice moved from theme options to gallery options to group related options in one place. Adds display image copyright notice option. Admin sortorder options: Custom sort orders for all item types have been removed on the backend. [acrylian] Basically MySQL code was entered here that possibly caused serious issues if used by inexperienced user both with MySQL and ZenphotoCMS and its table column names .Instead, if custom sort orders are required they should be added via the new "admin_sortbyoptions" filter or via the object model. Additionally we have added some more default options. Image flipping: Images can now be flipped horizontally or vertically on the image edit pages. Note that this will modify the original images. It is strongely recommended to only use this when Imagick is available as a graphics handler becuase the GDlibrary will delete embeded meta data [acrylian, fretzl] Proper redirections to current page on logouts. Also a propler header request is sent to advise browsers to invalidate their caches [acrylian, fretzl, bic] htmLawed 1.2.8 update [acrylian] The json fallback library lib-json.php has been removed because json is already part of the PHP core for a while and now expected to be available [acrylian] Fix case insenstive test failing on open_basedir restriction [brucepimenta] Users – for example self-registered ones – now have the right to at least change their own user credentials. The right has also been added to the default groups where applicable. Existing users or groups will not be changed. [acrylian] Fix unwanted empty album date on meta data refresh [acrylian, fretzl] Fix sidecar images not being moved with their main item if using the admin move tool [acrylian – Thanks to ctdlg] New utilities maintenance_mode: This incorporates the former site_upgrade plugin into the core. You'll find a new button "Maintenance mode" on the admin overview page. It contains options to switch the modes instead of the confusing way it was before. Usage instructions are included. New is that whenever you run setup the site will be closed automatically. It will not re-open automatically so you can test your site first. If the site is closed or in test mode there is a clear note shown on all admin page so you don't forget to disable it. Previously created custom closed.htm and rss-closed.xml placeholder within /plugins/site_upgrade/ should work as before. The former closed.php file has been abandoned and is only used if it already exists. The maintenance mode will use basic placeholders if these files are missing. Themes All included themes have been marked as deprecated. A note is added on the backend. basic garland zenpage zpMobile They all are quite old and outdated and it does not make sense to update or rework them. They will be removed in future Zenphoto versions and they will only get bugfixes and no feature updates anymore. There will be at least one new official all-purpose theme included in the future. Plugins Plugins removed site_upgrade: Functionality has been moved to core. See "New utilties" section above Deprecated plugins Some plugins also have been marked as deprecated. A note is added on the backend. bxslider_thumb_nav: There might be a general slider replacement. class-WEBdocs: There will be no actual replacement. colorbox_js: There will be a replacement plugin. deprecated_functions: There will be no actual replacement. Please see the section "Deprecation handling changed" below. GoogleMaps: Already use the openStreetMap plugin instead. jplayer: There is a core and native HTML5 player within the class-video plugin. For playlists there will be a replacement. slideshow2: There might be a general slider replacement. userAddressFields: There might be core functionalitly replacing this that may not be directly compatible. We noted these for you as preliminary information. There are several reasons: Some plugins use third party libraries that have not been updated for years and likely would soon cause trouble. Some of these may get some kind of replacement. Since we have limited time to maintain all the included stuff we have to remove some plugins we basically never use ourselves. These will likely not get any replacement. We welcome users to take over maintaining plugins they need themselves. Some other plugins' functionality may be integrated into core as we think this makes sense but we have not listed those here yet. Plugin updates and changes comment_form: Disable CAPTCHA option and error display if no handler is enabled [acrylian, fretzl] contact_form: Disable CAPTCHA option and error display if no handler is enabled [acrylian, fretzl] deprecated_functions: See section above for some info. downloadList: Fix broken printDownloadURL for full image [bic-ed] Fix check for album existence [bic-ed] Added a new 404 message for broken downloads [bic-ed] Set a very fast expiring cookie after list generation for album.zip [bic-ed] elFinder: Security update to 2.1.59 [acrylian - Thanks to jhhua] GoogleMaps: PHP object injection issue with unserialize() fixed [acrylian - Thanks to abdulrahman] html_meta_tags: Fix some pagination URL's missing trailing slash causing invalid canonical URLs. [acrylian] Fix the opengraph thumb for multimedia items [acrylian - Thanks to JesseHC| http_security_headers [acrylian, fretzl]: Fix issue that legacy header X-Frame-Options could not be disabled correctly. Fix wrong option name for X-Frame-Options. Fix frame-ancestors if only allowed hosts are defined. Remove deprecated block-all-mixed-content directive. mobileTheme: Update Mobile_Detect.php library [fretzl] multiple_layouts: Fix image selection on album edit page not saving if no album layout exists, also fixes image layouts not used properly in search results context [acrylian, fretzl] PHPMailer: Update to version 6.7.1 [fretzl] register_user: PHP object injection issue with unserialize() fixed [acrylian - Thanks to abdulrahman] relatied_items: Fixes usage with multi-word tags [bic] sitemap-extended: Fix non modrewrite URLs to alway include "index.php" (except home page) as used on front end [acrylian] slideshow2: Update cycle2 script to be compatible with jQuery versions 3 and up. The update is from https://github.com/thecarnie/cycle2 , a fork of the original cycle2 repository which is not maintained anymore [fretzl] uploader_jQuery: jQuery-File-Upload-10.31.0 update [acrylian] user_expiry: PHP object injection issue with unserialize() fixed [acrylian - Thanks to abdulrahman] zenpage: Object model changes: The Zenpage class methods getTotalArticl'''
