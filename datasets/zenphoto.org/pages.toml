["https://zenphoto.org/pages/get-involved"]
title = "Get involved! | ZenphotoCMS - The simpler media website CMS"
description = """
Contributing
Zenphoto is a community project and you don't need to be a developer/coder to contribute. Although you should have at least some knowledge of gene"""
full_description = "Get involved! Contributing Zenphoto is a community project and you don't need to be a developer/coder to contribute. Although you should have at least some knowledge of general web techniques like (X)HTML, CSS, JS and basics of PHP and be familiar with Zenphoto itself, there are several other places you could help like: Help on the forum Report bugs and test support/development builds Provide fixes/patches or suggestions on the bugtracker Provide translations Contribtute to documentations or write tutorials Provide or maintain plugins or themes Please read here before starting: General contributor guidelines Developer coding guidelines Spread the word! You like using Zenphoto? Tell others via your blog, forums, social networks or else! Donating If you can't contribute yourself we also appreciate donations made via our donations page. This helps us running our server and continue development. Advertise Maybe you run a hosting service or a web related business and like to advertise on zenphoto.org? More info on the advertise info page. Submit your custom site to the showcase You know of or made a site that should be featured in the showcase gallery? Then submit your site on the showcase forum category. Submission minimum requirements: The site must at least be done partly, e.g. for the gallery section, or even better completely using Zenphoto. The site must use a custom designed theme or a significantly modified official or third party theme. Any plain use of any of the standard or third party themes from the themes section or just minor modifications of one of those is considered invalid. Please note that we can't guarantee that we include every submitted site even if it matches the above requirements (Sometimes we do add sites we find and like without any submission as well). Note also this showcase is not about your content no matter how great, it's about using Zenphoto! Conditions If your submitted site is considered valid you agree to the following: We will take a screenshot and add it to the showcase gallery. We may share that screenshot with our social networks (e.g. Google+, Twitter, Facebook) only to promote Zenphoto. If you don't like this please state this on the forum when submitting. We of course will not use the screenshot for any other purpose and we will of course link to your site. You can request an entry removal at any time. If your screenshot requires an update because e.g. design changes of your site, let us know on the forum. Then we get it updated."
