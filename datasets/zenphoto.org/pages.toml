full_description = '''Advertising information Thank you for considering to advertise on www.zenphoto.org. This will help us to continue development of Zenphoto. Here you will find information about how to advertise. We don't do advertorials/sponsored guest posts. Advertisement categories Platinum 275x130px One ad per line Maximum of four ads in this category Location: Home page Subscription rates Monthly: 260 EUR / month Year: 220 EUR / month* *also includes a "sponsored by" naming on our release posts Palladium 275x130px One ad per line Maximum of four ads in this category Location: Sidebar of each page incl. forum sidebar Subscription rates Monthly: 160 EUR / month Year: 120 EUR / month* *also includes a "sponsored by" naming on our release posts Gold 560x130px One ad per line Unlimited ads in this category Location: Sponsors page Subscription rates Monthly: 100 EUR / month Year: 70 EUR / month Silver 270x130px Two ads per line Unlimited ads in this category Location: Sponsors page Subscription rates Monthly: 70 EUR / month Year: 45 EUR / month Bronze 125x130px Four ads per line Unlimited ads in this category Location: Sponsors page Subscription rates Monthly: 40 EUR / month Year: 25 EUR / month Bundles If you like to advertise in more than one category we can offer individual bundle prices. Please contact us. Please review our Advertising Terms Of Service before contacting us. Please don't transfer any payment before receiving approval by us. Please always contact us first. Contact us Ad size examples Example code for advertisemets Here are some code examples as we only allow HTML and CSS based advertisements (see the Terms of Service): a) HTML with image <a href="https//www.yourdomain.com" title="<your desire title, your company name if nothing else submitted>"><img src="<...>" alt="<your desire title, your company name if nothing else submitted>" width="<width of the category chose>" height="<height of the category chosen>" /></a> b) A plain html ad example: <a title="<Your desired title>" href="https//www.yourdomain.com">Your desired ad content </a> We gladly help to setup your advertisement for you. Media data The Zenphoto website has around 9,400 sessions with 7,500 unique visitors and 33,400 pageviews every month (around 300 unique users per day with 350 sessions). The majority of visitors comes from the US (40%), Germany (6.2%), Great Britain (6%), France (6%), followed by China, Espana, Poland, Brasil, Russia and Japan (each around 2,5%). So your ads will be noted!'''
