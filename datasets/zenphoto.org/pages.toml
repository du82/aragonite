["https://zenphoto.org/news/theming-tutorial"]
title = "Theming Tutorial | User guide | ZenphotoCMS - The simpler media website CMS"
description = """
Part 1: Theme Basics
What should I know before making a custom theme?
During the process of this article, we will be looking at the basic files and functions"""
full_description = '''User guide Theming Tutorial August 14, 2010 / Updated: December 03, 2022 Categories: Customizing, Development, Theming & Templating, Tutorials, User Guide ContentPart 1: Theme BasicsWhat should I know before making a custom theme?What is a theme?Where are the theme files located?Where do I find themes and how can I install a theme designed by someone else?How does a theme work?Part 2: Making a ThemeGeneral required filter callsStandard theme pagesAdding the comments sectionPart 3: Advanced Theme FunctionalityStatic custom pages (optional)Separation of the gallery and the index pagefunctions.phpthemeoptions.phpOverriding options for special theme effectsSpecial imagesSeparate theme translations (post 1.2)Sophisticated theme functionalityDifferent theme page layoutsExtra database storageUsing functionionalty from plugins/extensionsPart 4: Theming ZenpageZenpage theme basicsRequired theme pagesUpdates to standard theme pages requiredNews on index.phpShowing Zenpage content on other theme pagesThe CombiNews featureDuplicating (cloning) a theme for customizations Authors: Stephen Billard (sbillard) Malte Müller (acrylian) Part 1: Theme Basics What should I know before making a custom theme? During the process of this article, we will be looking at the basic files and functions that are necessary to create a working Zenphoto theme, We'll use the basic theme as an example. We will not go into every single detail of the code because we assume that you have a good understanding of HTML and CSS. You should also have a basic understanding what PHP is and how PHP code is put into a webpage and communicates with the server and returns information back to the client. If you don't have this understanding we recommend to learn that first. Good resources are for example: https://developer.mozilla.org/en-US/docs/Learn/HTML (HTML) https://developer.mozilla.org/en-US/docs/Learn/CSS (CSS) https://www.php.net/docs.php (PHP) https://developer.mozilla.org/en-US/docs/Learn/JavaScript (JavaScript) https://api.jquery.com/ (jQuery JavaScript framework) For more detailed information on the Zenphoto template functions please visit our functions documentation and it's accompaning How To Read The Zenphoto Functions Guide article. What is a theme? In technical terms, it's a set of files that use markup language HTML (preferredly HTML5) and CSS and embedded PHP code to dynamically create the layout and style of your gallery. In other words, a theme is just a way to give your gallery a different look. Where are the theme files located? By default, when you first install Zenphoto, you have the "root" or main folder of Zenphoto, then in it you have four other folders named albums, cache, themes, and zp-core. The themes folder is where the default themes exist, where you should install new themes that you've downloaded, and where you will put all your new themes. Zenphoto comes with six themes: basic, garland, effervescence_plus, zenpage and zpmobile. Where do I find themes and how can I install a theme designed by someone else? You can find all known custom themes at our themes page, or from the theme creator's site.Usually, the distribution of a theme comes with instructions on how to install the theme. In case instructions are not supplied, here is a basic set of installation instructions for installing themes: Download the theme of your choice. Expand the zip archive to a local folder. Upload the extracted folder (keeping the underlying folder structure intact) to your /themes directory. Go into your admin > themes tab and activate your theme. View your gallery with the new theme in place! Note: Some themes have custom mods or things that need to be changed in addition to the normal theme installation. So take care to note in the theme distribution what these may be before you install. How does a theme work? Themes are done in a pretty straightforward way. They're just PHP files that use a set of theme functions (from zp-core/template-functions.php) to display the albums or images in any way. The current theme is selected in the admin themes panel. (Admin uses the file theme_description.php within the theme's folder as the source of its information about the theme.) The root index.php file then looks at the URL arguments (album, image, etc. or lack thereof) and decides whether to load the theme's index file, album page, or image page. Pretty simple.The already mentioned template functions generate predefined HTML output for your convenience. These are the functions that generally beginn with "print". You can style that via CSS to your needs. These function generate code that follows the XHTML 1.1 transitional standard for history reasons which is compatible with the current HTML5 standard.Of course for advanced users it is also possible to get the pure data to setup your own HTML output using custom functions for more flexibility. You can read an introduction on this later in this tutorial. Part 2: Making a Theme We will now look at the necessary theme pages and the basic structure of these files that Zenphoto needs to process a theme. Again, we won't discuss any functions (or any HTML or CSS styling) in detail and only provide basic examples of standard function whose names are pretty self explanatory. Optional plugin functions are not included. As already said it is up to you what HTML structure (besides the core one naturally) you use in your theme. So we just included the bare bones HTML page construct in the following examples. Look at the included standard themes for suggestions. None of the official themes does it (yet), but of course you can for example also use header.php or footer.php files to generalize those parts if your theme. You can then take this knowledge and use it to create your own theme. More info on specific functions can be found in our functions guide. Zenphoto themes don't require any special standard HTML or CSS setup. The standard template function currently do generate standard (X)HTML syntax. Generally we recommend to create your theme as HTML5. More advanced coders might also create their own functions. Here is a diagram of the general structure including optional pages and support for the Zenpage CMS plugin: You can freely design and structure your theme as needed. It is recommended to look also at the included standard themes, most notably the basic (gallery only) and zenpage theme (with news and pages) as they are the two most plain structured ones. However, there are some required basic files every theme must have (advanced, experienced theme coders may also leave this standard structure of course). We also provided example files of a bare bones theme on GitHub. These files are without any specific HTML structure to make it easier to learn the structure. We will discuss these files in the following sections. General required filter calls Each theme page (except themeoptions.php and theme_description.php) must include three standard filter calls as the Zenphoto template functions and many plugins may use them to insert special scripts or HTML: zp_apply_filter('theme_head') – Best is to place this right before the theme's </head>. This way theme CSS does not accidentally override plugins that come with their own CSS like video players etc. Note: This filter also loads the jQuery base file. So if you put jQuery dependent scripts into your theme's head you need to do that after this call. Also a lot of standard functionality and plugins are jQuery based. zp_apply_filter('theme_body_open'); – Place right after the <body> tag zp_apply_filter('theme_body_close'); – Place right before the </body> tag Standard theme pages theme_description.php (required): This is the description file which gives Zenphoto information about your theme. This information is displayed in the themes page of the Zenphoto admin backend. Older themes before Zenphoto 1.2 may use a theme.txt file for the same purpose. theme.png/theme.gif/theme.jpg (required): It should be 150x150px at least and represent a screenshot of your theme. It is displayed on the themes tab on the Zenphoto backend. index.php (required): The gallery index (home page) of a theme. It's read and displayed when someone visits your main gallery page. It usually prints the top level albums. album.php (required): This page is displayed when someone clicks on an album link from your gallery page (index.php). This page displays sub level albums of an album selected and/or the thumbnail overview of images within that album. image.php (required): This page is displayed when someone clicks on a specific thumbnail picture on your album page (album.php). It then displays the single (sized) image. search.php (recommended): It's actually nearly the same as the album.php since it does display albums and images as a result of a search. You find examples on the demo theme repository: https://github.com/zenphoto/demo-theme Adding the comments section You can add comments to album.php and image.php. Additionally also to Zenpage's pages.php and news.php (single news articles).Since Zenphoto 1.2.6 the comment handling code has been transfered to the comment_form plugin. All you need to do is to enable that plugin and put this code where you want the comment form and the comment display. <?php if (function_exists('printCommentForm')) { ?> printCommentForm(); } ?> You can of course modify the look of the comment section via CSS. You could even make your own custom comment form by changing the file /zp-core/plugins/comment_form/comment_form.php and place it within /plugins/comment_form/comment_form.php. Part 3: Advanced Theme Functionality This part of our tutorial is about the more advanced functionalitly you can add to your theme. Static custom pages (optional) "Custom pages" are additional static pages (e.g. their content not directly managed via the backend) that do not display actual gallery stuff like albums or images. You can have multiple custom pages that are called with the url zenphoto/index.php?p=<pagetitle> (non mod_rewrite) zenphoto/page/<pagetitle> (mod_rewrite) In general a custom page is just like index.php but with the album loop removed. These pages can be used as an "about" or "references" page for example, but the content needs to be hardcoded and can not be adminstrated by Zenphoto. These page also know no hierachy. (Of course, you can create theme options to allow customization of these pages from the admin theme options tab.)You can use some of the more general theme functions as archive.php does. Official themes generally include the following custom pages but all are optional: archive.php: This theme pages displays a monthly archive of your gallery items. 404.php: If your theme contains this script it will be invoked whenever a page not found condition is raised by Zenphoto. Creating a script of this name allows you to control the presentaton of the page not found error. password.php: Default password protection handling will check passwords in the image and album loops. If an album is password protected, no subalbums or images will be returned from the loops. Instead, a password form will be presented. You can create a password.php script in your theme folder. If such a script exists, it will be loaded in place of the target Zenphoto page. This allows you to completely control the presentation of the password protected content. Each of the distributed themes contains such a script. slideshow.php: A page that displays a slideshow. The design is generic so that it works with all themes without design adjusting, just a black background with the image on it, but it's possible to make it look like your other theme pages. Related files that are required to run the slideshow are the slideshow.css and the slideshow-controls.png and the slideshow plugin must be installed and activated. contact.php:This is an optional (static) custom theme page example to provide a simple contact form using the contact_form plugin. You find examples on the demo theme repository: https://github.com/zenphoto/demo-theme Separation of the gallery and the index page You may wish to have an introductory page to your website but still keep the look and feel of the gallery for visitors viewing your images. This can easily be done by using the theme option custom index page. If you have an existing Zenphoto gallery the easiest way to accomplish this task is to rename your current theme index.php script to something else, say gallery.php. Create your new index.php script to introduce your site. Include on it a link to http://yoursite.com/zenphoto/page/gallery (assuming you named your old index file gallery.php and you installed Zenphoto in the folder zenphoto). Set the custom index page option to gallery and your are all set. functions.php Custom functions can be used to add additional functionality to your theme. Any custom function may be placed in a PHP file called functions.php which must be located in your theme folder. This file will then be loaded automatically on every theme page to make the custom functions available. Please also review the Developer coding guidelines on themes. themeoptions.php Themes may create options that change the behavior or appearance of the theme. (All the distributed themes have options for these reasons.) Options are defined by PHP code in a file called themeoptions.php which is located in your theme folder. The file is optional, if you have no options you need not have themeoptions.php. You define the options in this code and make use of them in your theme by calling the function getOption() passing the option name. (It is a good idea to be sure any unique options you create have unique names so that they don't conflict with options some other theme builder might have made.)Some of the 'standard' theme options (as defined by the distributed themes) are: 'Allow_comments', 'Allow_search', and 'Theme_colors'. These are used in the distributed themes to enable comment forms, enable serach forms, and select a CSS for the theme. See the basic theme for examples.Themeoptions are a class of Zenphoto Plugin so reading about the plugin architecture might also be of some value. You find examples on the demo theme repository: https://github.com/zenphoto/demo-theme Overriding options for special theme effects If your theme has special needs for some options it is possible to temporarily override the options as set in the Administrative back end. Cases where this might be useful are, for instance, to insure that the theme looks well balanced when there are multiple album thumbs or image thumbs in a row. The theme may then wish to change the albums per page option (images per page option) so that it is a multiple of the number that will fit in a row. (The standard themes all do this.)It would not be nice, however, for a theme to permanantly change the option as it would impact other themes that might get used. The setOption() function of Zenphoto has provided a means to temporarily cha'''
