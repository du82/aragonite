full_description = "Download Zenphoto Official release Download (.zip) Download (.tar.gz) Zenphoto 1.6.5 (October 23, 2024) | License: GPL v2 or later Recommended information: Installation & Upgrade Requirements Versioning Changelog Support Zenphoto Your donation helps pay for this server and development of Zenphoto. Thank you! Donate now Development We may ask you to try these so we are sure we don't ship bugs with the next release. These are development versions that are not intended or recommended for live sites and should only be used on staging sites for testing. Despite having a version number this is not a fixed state but work in progress. Support build Zenphoto 1.6.6a This is the master or main branch in GitHub terms and represents the next official bug fix/maintenance release. This can be a minor 1.6.x or patch 1.x release and usually has version numbers like 1.6.1a, 1.6.1b, 1.6.1RC The support build should be compatible with the official release but it cannot always be guaranteed especially on a version jump like 1.5.x to 1.6. and if security fixes require specific changes Development build There is currently no development build This is the development built for the next major release. So if 1.6 is the current release, this will become 2.x and will get all the new features we made up. This release may introduce incompatibilites due to serious changes. Older versions We don't recommend to use older versions. But if you really need to, especially for step-by-step updating very old installs, you will find them in the older versions archive. Please also read the Installation & Upgrade information."
