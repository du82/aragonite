["https://ziglang.org/download/0.11.0/release-notes.html"]
title = "0.11.0 Release Notes ⚡ The Zig Programming Language"
full_description = 'Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software. Backed by the Zig Software Foundation, the project is financially sustainable. These core team members are paid for their time: This release features 8 months of work: changes from 269 different contributors, spread among 4457 commits. It is the début of Package Management. A green check mark (✅) indicates the target meets all the requirements for the support tier. The other icons indicate what is preventing the target from reaching the support tier. In other words, the icons are to-do items. If you find any wrong data here please submit a pull request! The baseline value used for "i386" was a pentium4 CPU model, which is actually i686. It is also possible to target a more bare bones CPU than pentium4. Therefore it is more correct to use "x86" rather than "i386" for this CPU architecture. This architecture has been renamed in the CLI and Standard Library APIs (#4663). Starting from this release, Zig no longer unconditionally passes --allow-undefined to the Linker. By removing this flag, the user will now be faced with an error during the linking stage rather than a panic during runtime for undefined functions. If your project requires such behavior, the flag import-symbols can be used, which will allow undefined symbols during linking. For this change we also had to update the strategy of exporting all symbols to the host. We no longer unconditionally export all symbols to the host. Previously this would result in unwanted symbols existing in the final binary. By default we now only export the symbol to the linker, meaning they will only be visible to other object files so they can be resolved correctly. If you wish to export a symbol to the host environment, the flag --export=[name] can be used. Alternatively, the flag -rdynamic can be used to export all visible symbols to the host environment. By setting the visibility field to .hidden on std.builtin.ExportOptions a symbol will remain only visible to the linker and not be exported to the host. With this breaking change, the linker will behave the same whether a user is using zig cc or Clang directly.'
