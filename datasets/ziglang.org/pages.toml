title = "Zig Software Foundation  ⚡  Zig Programming Language"
full_description = '''← Back to ホーム Zig Software Foundation Zigソフトウェア財団のスポンサーになるぜひ定期的な寄付をご検討ください。高品質なソフトウェアを維持、サポートするには、継続的な労力が必要です！ Donate function zsfCreateWidget() { everyDotOrgDonateButton.createButton({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", fontSize: "32px", label: "Sponsor" }); everyDotOrgDonateButton.createWidget({ selector: "#zsf-every-donate-btn", nonprofitSlug: "zig-software-foundation-inc", defaultDonationAmount: 10, defaultFrequency: 'monthly' }); // Workaround for https://github.com/everydotorg/donate-button/issues/384 let style = document.createElement('style'); style.innerHTML = '#donation-input { color: black; } #privateNote { color: black }'; document.getElementById("shadow-wrapper").shadowRoot.appendChild(style); } if (window.everyDotOrgDonateButton) { zsfCreateWidget(); } else { document.getElementById("every-donate-btn-js").addEventListener('load', zsfCreateWidget); } ミッションステートメントZigソフトウェア財団の使命は、プログラミング言語Zigの普及、保護、発展、多様で国際的なZigプログラマー・コミュニティの支援と促進、学生への教育と指導を行い、次世代のプログラマーが有能で倫理的であり、互いに高い基準を持つように指導することです。ZSFは501(c)(3)の非営利法人です。 財務、議事録などは公開されています。取締役会メンバーAndrew Kelley (社長)Josh Wolfe (秘書)Mason Remaley (財務担当)スポンサーシップZSFへの寄付は、Zigプログラミング言語とそのエコシステムの開発に資金を提供することになり、ひいてはより大きなオープンソースコミュニティ全般に利益をもたらすことになるのです。Zigコミュニティのメンバーは、LLVM、Wine、QEMU、musl libc、GDBなどのバグフィックスを実現しています。ZSFは小さな組織で、金銭的な資源を効率的に使っています。しかし、私たちは、無給のボランティアを有給のメンテナに変え、プルリクエストをマージし、1.0に向けてより迅速に進展させたいと考えています。ZSFが非営利であることの要点は、人々に利益をもたらすことです。私たちは、オープンソースのメンテナに時間に対する報酬を与えようとしているのです。寄付のご案内GitHub Sponsors 以外の手段で寄付をする際に役立つ情報をご紹介します。 寄付金を税金から控除できるかどうか、お住まいの地域の法律を必ずご確認ください。EIN84-5105214AddressZig Software Foundation1632 1st Ave #21385New York, NY 10028その他の寄付方法にも対応EveryGitHub SponsorsBenevity (勤務先が寄付と同額を負担してくれるならおすすめ！)銀行振込（米国外からの振込も含む、詳細についてはお問い合わせください）物理的な小切手（上記の郵送先住所参照）Wiseご質問や特定のニーズがある場合は、遠慮なく donations@ziglang.org までご連絡ください。スポンサー企業寄付金以下の企業は、月々1000ドル以上の寄付をすることで、Zigソフトウェア財団に直接資金援助を行っています。 @media (prefers-color-scheme:light) { #zml { filter: invert(); } }'''
