["https://ziglang.org/de-DE"]
title = "Home  ⚡  Zig Programmiersprache"
full_description = 'Zig ist eine General-Purpose-Programmiersprache und Toolchain für robuste, optimale und wiederverwendbare Software. JETZT STARTEN Letztes Release: 0.13.0 Dokumentation Änderungen ⚡ Eine einfache SpracheKonzentriere dich auf das Debuggen deiner Anwendung und nicht auf das Debuggen deiner Programmiersprachkenntnisse.Kein versteckter Kontrollfluss.Keine versteckten Speicherallokationen.Kein Präprozessor, keine Makros.⚡ ComptimeEin moderner Ansatz zur Metaprogrammierung, basierend auf Compile-Zeit-Ausführung und Lazy-Evaluation.Rufe jede Funktion zur Compile-Zeit auf.Ändere Typen als Werte, ohne Laufzeitverlust.Comptime emuliert die Zielarchitektur.⚡ Behalte alles in ZigVerbessere schrittweise deine C/C++/Zig-Codebasis.Verwende Zig als Drop-in-C/C++-Compiler ohne Abhängigkeiten, der sofort einsatzbereite Cross-Kompilierung unterstützt.Nutze zig build, um eine konsistente Entwicklungsumgebung für alle Plattformen zu erstellen.Füge C/C++-Projekten einen Zig-Kompilierungsabschnitt hinzu, um deinem C/C++-Code die umfangreiche Standardbibliothek zugänglich zu machen. Detaillierte Übersicht Weitere Codebeispiele index.zigconst std = @import("std"); const parseInt = std.fmt.parseInt; test "parse integers" { const input = "123 67 89,99"; const ally = std.testing.allocator; var list = std.ArrayList(u32).init(ally); // Ensure the list is freed at scope exit. // Try commenting out this line! defer list.deinit(); var it = std.mem.tokenizeAny(u8, input, " ,"); while (it.next()) |num| { const n = try parseInt(u32, num, 10); try list.append(n); } const expected = [_]u32{ 123, 67, 89, 99 }; for (expected, list.items) |exp, actual| { try std.testing.expectEqual(exp, actual); } }Shell$ zig test index.zig 1/1 index.test.parse integers...OK All 1 tests passed. Community Die Zig-Community ist dezentralJeder darf einen eigenen Raum für die Community erschaffen und betreiben. Es gibt kein "offiziell" oder "inoffiziell", jedoch hat jeder Versammlungsort seine eigenen Regeln und Moderatoren. Entdecke die Communities ProjektentwicklungDas Zig-Repository findest du unter https://github.com/ziglang/zig, wo wir auch Fehlermeldungen bearbeiten und Vorschläge diskutieren.Mitwirkende müssen sich dabei an den Verhaltenskodex von Zig halten. Zig Software FoundationDie ZSF ist eine 501(c)(3) Non-Profit-Organisation.Die Zig Software-Foundation ist eine Non-Profit-Organisation (gemeinnützig) und wurde 2020 von Andrew Kelley - dem Schöpfer von Zig - gegründet, um die Entwicklung der Sprache zu unterstützen. Derzeit bietet die ZSF einigen Kernmitwirkenden konkurrenzfähig bezahlte Arbeit. Wir hoffen, dies künftig weiteren Mitwirkenden anbieten zu können.Die Zig Software-Foundation wird von Spenden finanziert. Weitere Details Sponsoren UnternehmenssponsorenDie folgenden Unternehmen unterstützen die Zig Software-Foundation direkt finanziell. @media (prefers-color-scheme:light) { #zml { filter: invert(); } } GitHub-SponsorenDank der Sponsoren von Zig ist das Projekt gegenüber der Open-Source-Gemeinschaft rechenschaftspflichtig und nicht den Aktionären eines Unternehmens. Insbesondere diese tollen Leute unterstützen Zig mit monatlich $200 oder mehr: José M Rico drfuchs Kirk Scheibelhut Bun Huly® Platform™ Stevie Hryciw Karrick McDermott Joran Dirk Greef bfredl Simon A. Nielsen Knights Emi Derek Collison Paul Harrington Clark Gaebel Marcus Eagan Ken Chilton Will Manning Spiral Alex Mackenzie at Tapestry VC Alok Parlikar Keygen Dieser Abschnitt wird täglich aktualisiert.'
