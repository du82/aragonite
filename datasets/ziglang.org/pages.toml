["https://ziglang.org/it-IT/learn/build-system"]
title = "Zig Build System  ⚡  Zig Programming Language"
full_description = '''← Torna a Impara Zig Build System Quando introdurre il Zig Build System?Per iniziare Eseguibile sempliceInstallare artefatti di buildAggiungere uno step per eseguire l'applicazioneLe basi Opzioni fornite dall'utenteOpzioni di configurazione standardOpzioni per la compilazione condizionaleLibreria staticaLibreria dinamicaTestingLinking di librerie di sistemaGenerare file Eseguire tool di sistemaEseguire i tool del progettoProdurre asset per @embedFileGenerare codice ZigGestire uno o più file autogeneratiModificare e sovrascrivere i file sorgenteAltri esempi Build per più piattaforme per creare un rilascio Quando introdurre il Zig Build System?In molti casi sono sufficienti i comandi base zig build-exe, zig build-lib, zig build-obj e zig test. A volte però un progetto necessita di un ulteriore livello di astrazione per gestire la complessità del compilare da sorgente.Per esempio, potrebbe verificarsi una di queste situazioni:La riga di comando diventa troppo lunga e complessa, e vuoi trascriverla altrove.Vuoi compilare molte cose, o il processo di compilazione ha molti passaggi.Vuoi sfruttare processi paralleli e caching per ridurre il tempo di compilazione.Vuoi esporre delle opzioni di configurazione per il progetto.Il processo di compilazione è differente a seconda del sistema di destinazione e altre opzioni.Il tuo progetto ha dipendenze da altri progetti.Vuoi evitare dipendenze superflue da cmake, make, shell, msvc, python e altro, rendendo il progetto accessibile a più contributori.Vuoi fornire un pacchetto usufruibile da terzi.Vuoi mettere a disposizione a strumenti come gli IDE un modo standardizzato per comprendere semanticamente come compilare il progetto.Se qualunque di queste è applicabile, il progetto trarrà beneficio dal Zig Build System.Per iniziareEseguibile sempliceQuesto build script crea un eseguibile a partire da un file Zig contenente una funzione main pubblica.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello Debug native cached 66ms MaxRSS:36M Installare artefatti di buildIl build system di Zig, come la maggior parte dei build system, è basato sul modellare il progetto come un grafo aciclico diretto (DAG) di "step", che vengono eseguiti in parallelo.Di default, lo step principale nel grafo è lo step Install, il cui scopo è copiare gli artefatti di build nella loro destinazione finale. Lo step di installazione parte senza dipendenze, quindi eseguendo zig build non accade nulla. Il build script di un progetto deve aggiungere elementi all'insieme delle cose da installare, ed è ciò che fa la chiamata alla funzione installArtifact qui sopra.Output├── build.zig ├── hello.zig ├── .zig-cache └── zig-out └── bin └── hello In questo output sono presenti due cartelle generate: .zig-cache and zig-out. La prima contiene file che renderanno le compilazioni successive più rapide, ma questi file non sono pensati per essere tracciati in un sistema di controllo versione; questa cartella può essere completamente eliminata in qualunque momento senza conseguenze.La seconda cartella generata, zig-out, è un "prefisso di installazione". Questo è correlato al concetto standard di gerarchia del file system. Questa cartella non è scelta dal progetto, ma dall'utente del comando zig build con la flag --prefix (-p per abbreviare).Tu, come responsabile del progetto, scegli cosa conterrà questa cartella, ma l'utente sceglie dove installarla nel proprio sistema. Il build script non può definire percorsi di output assoluti perchè questo ostacolerebbe il caching, concorrenza e composibilità, oltre a infastidire l'utente finale.Aggiungere uno step per eseguire l'applicazioneÈ pratica comune aggiungere uno step Run, per permettere di eseguire l'applicazione principale direttamente dalla riga di comando.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = b.host, }); b.installArtifact(exe); const run_exe = b.addRunArtifact(exe); const run_step = b.step("run", "Run the application"); run_step.dependOn(&run_exe.step); }Shell$ zig buildrun --summary all Hello World! Build Summary: 3/3 steps succeeded run success └─ run hello success 14ms MaxRSS:1M └─ zig build-exe hello Debug native cached 44ms MaxRSS:36M Le basiOpzioni fornite dall'utenteUsa b.option per rendere il build script configurabile dagli utenti finali e anche da altri progetti che dipendono dal tuo progetto come pacchetto.build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const windows = b.option(bool, "windows", "Target Microsoft Windows") orelse false; const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("example.zig"), .target = b.resolveTargetQuery(.{ .os_tag = if (windows) .windows else null, }), }); b.installArtifact(exe); }Shell$ zig build--help Usage: /home/ci/deps/zig-linux-x86_64-0.13.0/zig build [steps] [options] Steps: install (default) Copy build artifacts to prefix path uninstall Remove build artifacts from prefix path General Options: -p, --prefix [path] Where to install files (default: zig-out) --prefix-lib-dir [path] Where to install libraries --prefix-exe-dir [path] Where to install executables --prefix-include-dir [path] Where to install C header files --release[=mode] Request release mode, optionally specifying a preferred optimization mode: fast, safe, small -fdarling, -fno-darling Integration with system-installed Darling to execute macOS programs on Linux hosts (default: no) -fqemu, -fno-qemu Integration with system-installed QEMU to execute foreign-architecture programs on Linux hosts (default: no) --glibc-runtimes [path] Enhances QEMU integration by providing glibc built for multiple foreign architectures, allowing execution of non-native programs that link with glibc. -frosetta, -fno-rosetta Rely on Rosetta to execute x86_64 programs on ARM64 macOS hosts. (default: no) -fwasmtime, -fno-wasmtime Integration with system-installed wasmtime to execute WASI binaries. (default: no) -fwine, -fno-wine Integration with system-installed Wine to execute Windows programs on Linux hosts. (default: no) -h, --help Print this help and exit -l, --list-steps Print available steps --verbose Print commands before executing them --color [auto|off|on] Enable or disable colored error messages --prominent-compile-errors Buffer compile errors and display at end --summary [mode] Control the printing of the build summary all Print the build summary in its entirety new Omit cached steps failures (Default) Only print failed steps none Do not print the build summary -j<N> Limit concurrent jobs (default is to use all CPU cores) --maxrss <bytes> Limit memory usage (default is to use available memory) --skip-oom-steps Instead of failing, skip steps that would exceed --maxrss --fetch Exit after fetching dependency tree Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows System Integration Options: --search-prefix [path] Add a path to look for binaries, libraries, headers --sysroot [path] Set the system root directory (usually /) --libc [file] Provide a file which specifies libc paths --system [pkgdir] Disable package fetching; enable all integrations -fsys=[name] Enable a system integration -fno-sys=[name] Disable a system integration Available System Integrations: Enabled: (none) - Advanced Options: -freference-trace[=num] How many lines of reference trace should be shown per compile error -fno-reference-trace Disable reference trace --build-file [file] Override path to build.zig --cache-dir [path] Override path to local Zig cache directory --global-cache-dir [path] Override path to global Zig cache directory --zig-lib-dir [arg] Override path to Zig lib directory --build-runner [file] Override path to build runner --seed [integer] For shuffling dependency traversal order (default: random) --debug-log [scope] Enable debugging the compiler --debug-pkg-config Fail if unknown pkg-config flags encountered --verbose-link Enable compiler debug output for linking --verbose-air Enable compiler debug output for Zig AIR --verbose-llvm-ir[=file] Enable compiler debug output for LLVM IR --verbose-llvm-bc=[file] Enable compiler debug output for LLVM BC --verbose-cimport Enable compiler debug output for C imports --verbose-cc Enable compiler debug output for C compilation --verbose-llvm-cpu-features Enable compiler debug output for LLVM CPU features example.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); }Nota la presenza di queste righe:Project-Specific Options: -Dwindows=[bool] Target Microsoft Windows Questa parte del menù di aiuto è generata automaticamente in base alla logica in build.zig. Gli utenti possono scoprire le opzioni di configurazione del build script in questo modo.Opzioni di configurazione standardNella sezione precedente abbiamo usato una flag booleana per indicare una compilazione per Windows. Possiamo fare ancora di meglio.La maggior parte dei progetti vuole rendere possibile modificare la piattaforma di destinazione e le opzioni di ottimizzazione. Per incoraggiare una convenzione standard nella nomenclatura di queste opzioni, Zig fornisce le funzioni standardTargetOptions e standardOptimizeOption.Le opzioni di destinazione standard permettono a chi esegue zig build di scegliere la piattaforma per cui compilare. Di default è permessa qualunque piattaforma, escluderle tutte significa compilare per il sistema host (quello usato per la compilazione). Sono disponibili ulteriori opzioni per restringere l'insieme di piattaforme supportate.Le opzioni di ottimizzazione standard permettono a chi esegue zig build di scegliere tra Debug, ReleaseSafe, ReleaseFast e ReleaseSmall. Di default il build script non considera nessuna delle opzioni di rilascio come preferibile, quindi l'utente deve prendere una decisione per poter creare una build di rilascio.hello.zigconst std = @import("std"); pub fn main() !void { std.debug.print("Hello World!\n", .{}); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const exe = b.addExecutable(.{ .name = "hello", .root_source_file = b.path("hello.zig"), .target = target, .optimize = optimize, }); b.installArtifact(exe); }Shell$ zig build-Dtarget=x86_64-windows -Doptimize=ReleaseSmall --summary all Build Summary: 3/3 steps succeeded install cached └─ install hello cached └─ zig build-exe hello ReleaseSmall x86_64-windows cached 44ms MaxRSS:36M Ora il nostro menù --help contiene più elementi:Project-Specific Options: -Dtarget=[string] The CPU architecture, OS, and ABI to build for -Dcpu=[string] Target CPU features to add or subtract -Doptimize=[enum] Prioritize performance, safety, or binary size (-O flag) Supported Values: Debug ReleaseSafe ReleaseFast ReleaseSmall È del tutto possibile creare queste opzioni usando direttamente b.option, ma questa API fornisce una convenzione comune per i nomi di queste opzioni, che sono utilizzate di frequente.Nell'output del nostro terminale, osserva che abbiamo passato -Dtarget=x86_64-windows -Doptimize=ReleaseSmall. In confronto al primo esempio, ora vediamo file diversi nel prefisso di installazione:zig-out/ └── bin └── hello.exe Opzioni per la compilazione condizionalePer passare delle opzioni dal build script al codice Zig del progetto, usa lo step Options.app.zigconst std = @import("std"); const config = @import("config"); const semver = std.SemanticVersion.parse(config.version) catch unreachable; extern fn foo_bar() void; pub fn main() !void { if (semver.major < 1) { @compileError("too old"); } std.debug.print("version: {s}\n", .{config.version}); if (config.have_libfoo) { foo_bar(); } } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const exe = b.addExecutable(.{ .name = "app", .root_source_file = b.path("app.zig"), .target = b.host, }); const version = b.option([]const u8, "version", "application version string") orelse "0.0.0"; const enable_foo = detectWhetherToEnableLibFoo(); const options = b.addOptions(); options.addOption([]const u8, "version", version); options.addOption(bool, "have_libfoo", enable_foo); exe.root_module.addOptions("config", options); b.installArtifact(exe); } fn detectWhetherToEnableLibFoo() bool { return false; }Shell$ zig build-Dversion=1.2.3 --summary all Build Summary: 4/4 steps succeeded install cached └─ install app cached └─ zig build-exe app Debug native cached 33ms MaxRSS:36M └─ options cached In questo esempio, i dati forniti da @import("config") sono noti in fase di compilazione, impedendo l'innesco di @compileError. Se avessimo passato -Dversion=0.2.3 oppure omesso l'opzione, avremmo visto la compilazione di app.zig fallire con l'errore "too old".Libreria staticaQuesto build script crea una libreria statica di codice Zig, e inoltre crea un eseguibile di altro codice Zig che usa la libreria.fizzbuzz.zigexport fn fizzbuzz(n: usize) ?[*:0]const u8 { if (n % 5 == 0) { if (n % 3 == 0) { return "fizzbuzz"; } else { return "fizz"; } } else if (n % 3 == 0) { return "buzz"; } return null; } demo.zigconst std = @import("std"); extern fn fizzbuzz(n: usize) ?[*:0]const u8; pub fn main() !void { const stdout = std.io.getStdOut(); var bw = std.io.bufferedWriter(stdout.writer()); const w = bw.writer(); for (0..100) |n| { if (fizzbuzz(n)) |s| { try w.print("{s}\n", .{s}); } else { try w.print("{d}\n", .{n}); } } try bw.flush(); } build.zigconst std = @import("std"); pub fn build(b: *std.Build) void { const target = b.standardTargetOptions(.{}); const optimize = b.standardOptimizeOption(.{}); const libfizzbuzz = b.addStaticLibrary(.{ .name = "fizzbuzz", .root_source_file = b.path("fizzbuzz.zig"), .target = target, .optimize = optimize, }); const exe = b.addExecutable(.{ .name = "demo", .root_source_file = b.path("demo.zig"), .target = target, .optimize = optimize, }); exe.linkLibrary(libfizzbuzz); b.installArtifact(libfizzbuzz); if (b.option(bool, "enable-demo", "install the demo too") orelse false) { b.installArtifact(exe); } }Shell$ zig build--summary all Build Summary: 3/3 steps succeeded install cached └─ install fizzbuzz cached └─ zig build-lib fizzbuzz Debug native cached 56ms MaxRSS:36M In questo caso, viene installata solo la libreria statica:zig-out/ └── lib └── libfizzbuzz.a Però, se guardi attentamente, il build script contiene un'opzione per installare anche la demo. Se passiamo anche l'opzione -Denable-demo, allora dovremmo vedere questo nel pr'''
