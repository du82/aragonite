["https://ziglang.org/de-DE/learn/getting-started"]
title = "Erste Schritte  ⚡  Zig Programmiersprache"
full_description = '← Zurück zu Lernen Erste Schritte Freigaben oder Nightly-Build?Zig installieren Direkter download Einrichten von PATH unter WindowsEinrichten von PATH unter Linux, macOS, BSDPaketverwaltungen WindowsmacOSLinuxZig kompilierenEmpfohlene Werkzeuge Syntaxhervorhebung und LSPFühre "Hello World" ausNächste Schritte Freigaben oder Nightly-Build?Zig hat v1.0 noch nicht erreicht und der aktuelle Release-Zyklus ist an neue LLVM-Releases gebunden, die einen ~6-monatigen Rhythmus haben. In der Praxis neigen Zig-Veröffentlichungen dazu, weit auseinander zu liegen und angesichts der aktuellen Entwicklungsgeschwindigkeit veraltet zu sein.Es ist in Ordnung, Zig mit einer freigegebenen Version zu testen, aber wenn du Zig magst und tiefer eintauchen willst, empfehlen wir dir ein Upgrade auf ein Nightly-Build, hauptsächlich weil es auf diese Weise einfacher ist Hilfe zu bekommen: die meisten der Community und Seiten wie zig.guide verfolgen den Master-Zweig aus den oben genannten Gründen.Die gute Nachricht ist, es st sehr einfach von einer Zig-Version zu einer anderen zu wechseln, oder sogar mehrere Versionen gleichzeitig auf dem System zu haben: Zig-Versionen sind in sich geschlossene Archive, die überall im System abgelegt werden können.Zig installierenDirekter downloadDas ist der einfachste Weg Zig zu erhalten: Hole dir ein Zig-Bundle für deine Plattform von der Downloads-Seite, entpacke es in ein Verzeichnis und füge es deinem PATH hinzu, um zig von jedem Ort aus aufrufen zu können.Einrichten von PATH unter WindowsUm einen PATH unter Windows einzurichten, führe einen der folgenden Codeschnipsel in einer Powershell-Instanz aus. Wähle, ob du diese Änderung systemweit anwenden möchtest (erfordert die Ausführung von Powershell mit Administratorrechten) oder nur für einen Benutzer, und stelle sicher, dass du das Snippet so änderst, dass es auf den Ort verweist, an dem deine Kopie von Zig liegt. Das ; vor C: ist kein Tippfehler.Systemweit (admin Powershell):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "Machine") + ";C:\your-path\zig-windows-x86_64-your-version", "Machine" ) Benutzerebene (Powershell):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "User") + ";C:\your-path\zig-windows-x86_64-your-version", "User" ) Wenn du fertig bist, starte die Powershell-Instanz neu.Einrichten von PATH unter Linux, macOS, BSDFüge das Verzeichnis des Zig-Binaries deiner PATH-Umgebungsvariablen hinzu.Das geschieht im Allgemeinen durch Hinzufügen einer Exportzeile zu deinem Shell-Startskript (.profile, .zshrc, ...)export PATH=$PATH:~/path/to/zig Wenn du fertig bist, source entweder dein Startskript oder starte die Shell-Instanz neu.PaketverwaltungenWindowsWinGetZig ist verfügbar unter: WinGet.winget install -e --id zig.zig ChocolateyZig ist verfügbar unter: Chocolatey.choco install zig ScoopZig ist verfügbar unter: Scoop.scoop install zig Letzte Entwicklerversion: dev build:scoop bucket add versions scoop install versions/zig-dev macOSHomebrewLetzte freigegebene Version:brew install zig MacPortsport install zig LinuxZig ist auch in vielen neuen Paketverwaltungen für Linux verfügbar. Hier findest du eine aktualisierte Liste, jedoch enhalten einige Pakete möglicherweise eine veraltete Zig-Version.Zig kompilierenHier findest du weitere Informationen, wie du Zig aus dem Quellcode erzeugen kannst, für Linux, macOS und Windows.Empfohlene WerkzeugeSyntaxhervorhebung und LSPAlle wichtigen Texteditoren unterstützen die Syntaxhervorhebung für Zig. Bei einigen ist es Standard, bei anderen muss ein Plugin installiert werden.Wenn du an einer tieferen Integration zwischen Zig und deinem Editor interessiert bist, schaue dir zigtools/zls an.Wenn du wissen willst was es sonst noch so für Zig gibt, schaue dir den Abschnitt Werkzeuge an.Führe "Hello World" ausWenn du den Installationsprozess korrekt abgeschlossen hast, solltest du nun in der Lage sein, den Zig-Compiler aus der Shell heraus aufzurufen. Erstelle jetzt dein erstes Zig-Programm!Navigiere in dein Projektverzeichnis und führe folgendes aus:mkdir hello-world cd hello-world zig init Das sollte die Ausgabe sein:info: created build.zig info: created build.zig.zon info: created src/main.zig info: created src/root.zig info: see `zig build --help` for a menu of options Das Ausführen von zig build run sollte dann die ausführbare Datei kompilieren und ausführen, was letztendlich zu diesem Ergebnis führt:All your codebase are belong to us. Run `zig build test` to run the tests. Herzlichen Glückwunsch, du hast eine funktionierende Zig-Installation!Nächste SchritteSchaue dir andere Ressourcen im Abschnitt Lernen an, stelle sicher, dass du die Dokumentation für deine Version von Zig aufgerufen hast (Hinweis: nächtliche Builds sollten die master-Dokumentation verwenden) und schaue dir zig.guide an.Zig ist ein junges Projekt, und leider haben wir noch nicht die Kapazität, umfangreiche Dokumentation und Lernmaterialien für alles zu erstellen. Daher solltest du in Erwägung ziehen, einer der bestehenden Zig-Communities beizutreten um Hilfe zu bekommen, wenn du nicht weiterkommen, und auch Veranstaltunge wie Zig SHOWTIME zu besuchen.Wenn dir Zig gefällt und du helfen willst, die Entwicklung zu beschleunigen, erwäge bitte eine Spende an die Zig Software Foundation .'
year_published = 2025
