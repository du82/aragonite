full_description = "← 返回 主页 学习 Zig本节列出了从对 Zig 一无所知到理解其哲学的有用资源。 文档 不稳定版本 (master) 语言参考 标准库文档 最新稳定版本 (0.13.0) 语言参考 标准库文档 指南这一部分最终将连同 Zig 的标准库文档一起打包，但在此期间，你可以从这里浏览。Zig 构建系统Zig 构建系统的介绍。介绍这些都是针对不同背景的程序员对 Zig 的介绍。深入了解从系统编程的角度对 Zig 进行深入的功能了解。有了 C++、D 和 Rust，为什么还需要 Zig？针对 C++、D 和 Rust 程序员的 Zig 介绍。代码范例一些可以让你感受 Zig 的代码片段。工具一些可以帮助你编写 Zig 代码的有用工具列表。快速入门如果你已经准备好开始用 Zig 编程，本指南将帮助你设置你的环境。快速入门在线学习资源Introduction to Zig: a project-based book Zig 的一本開放式科技入門書。zig.guideZig 的结构化介绍，由 Sobeston 编写。Ziglings通过修补与调试一系列带有故障的小程序来学习 Zig。Zig on Exercism解决编程练习并通过指导培养对 Zig 的熟练度。Learning Zig适合来自垃圾收集语言开发者的 Zig 简短介绍。相关视频和博客文章Zig 1.0 之路（英文） [video]Andrew Kelley 介绍 Zig 及其理念的视频。Zig 与 LLVM 的新关系（英文）一篇关于构建 Zig 自托管编译器的博客文章，也被 lwn.net 的一篇文章（英文）所介绍。"
