["https://ziglang.org/documentation/0.13.0"]
title = "Documentation - The Zig Programming Language"
full_description = '''Introduction § Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software. RobustBehavior is correct even for edge cases such as out of memory. OptimalWrite programs the best way they can behave and perform. ReusableThe same code works in many environments which have different constraints. MaintainablePrecisely communicate intent to the compiler and other programmers. The language imposes a low overhead to reading code and is resilient to changing requirements and environments. Often the most efficient way to learn something new is to see examples, so this documentation shows how to use each of Zig's features. It is all on one page so you can search with your browser's search tool. The code samples in this document are compiled and tested as part of the main test suite of Zig. This HTML document depends on no external files, so you can use it offline. Zig Standard Library § The Zig Standard Library has its own documentation. Zig's Standard Library contains commonly used algorithms, data structures, and definitions to help you build programs or libraries. You will see many examples of Zig's Standard Library used in this documentation. To learn more about the Zig Standard Library, visit the link above. Hello World § hello.zigconst std = @import("std"); pub fn main() !void { const stdout = std.io.getStdOut().writer(); try stdout.print("Hello, {s}!\n", .{"world"}); }Shell$ zig build-exe hello.zig $ ./hello Hello, world! Most of the time, it is more appropriate to write to stderr rather than stdout, and whether or not the message is successfully written to the stream is irrelevant. For this common case, there is a simpler API: hello_again.zigconst std = @import("std"); pub fn main() void { std.debug.print("Hello, world!\n", .{}); }Shell$ zig build-exe hello_again.zig $ ./hello_again Hello, world! In this case, the ! may be omitted from the return type because no errors are returned from the function. See also: Values @import Errors Root Source File Source Encoding Comments § Zig supports 3 types of comments. Normal comments are ignored, but doc comments and top-level doc comments are used by the compiler to generate the package documentation. The generated documentation is still experimental, and can be produced with: Shellzig test -femit-docs main.zig comments.zigconst print = @import("std").debug.print; pub fn main() void { // Comments in Zig start with "//" and end at the next LF byte (end of line). // The line below is a comment and won't be executed. //print("Hello?", .{}); print("Hello, world!\n", .{}); // another comment }Shell$ zig build-exe comments.zig $ ./comments Hello, world! There are no multiline comments in Zig (e.g. like /* */ comments in C). This allows Zig to have the property that each line of code can be tokenized out of context. Doc Comments § A doc comment is one that begins with exactly three slashes (i.e. /// but not ////); multiple doc comments in a row are merged together to form a multiline doc comment. The doc comment documents whatever immediately follows it. doc_comments.zig/// A structure for storing a timestamp, with nanosecond precision (this is a /// multiline doc comment). const Timestamp = struct { /// The number of seconds since the epoch (this is also a doc comment). seconds: i64, // signed so we can represent pre-1970 (not a doc comment) /// The number of nanoseconds past the second (doc comment again). nanos: u32, /// Returns a `Timestamp` struct representing the Unix epoch; that is, the /// moment of 1970 Jan 1 00:00:00 UTC (this is a doc comment too). pub fn unixEpoch() Timestamp { return Timestamp{ .seconds = 0, .nanos = 0, }; } }; Doc comments are only allowed in certain places; it is a compile error to have a doc comment in an unexpected place, such as in the middle of an expression, or just before a non-doc comment. invalid_doc-comment.zig/// doc-comment //! top-level doc-comment const std = @import("std");Shell$ zig build-obj invalid_doc-comment.zig doc/langref/invalid_doc-comment.zig:1:16: error: expected type expression, found 'a document comment' /// doc-comment ^ unattached_doc-comment.zigpub fn main() void {} /// End of fileShell$ zig build-obj unattached_doc-comment.zig doc/langref/unattached_doc-comment.zig:3:1: error: unattached documentation comment /// End of file ^~~~~~~~~~~~~~~ Doc comments can be interleaved with normal comments. Currently, when producing the package documentation, normal comments are merged with doc comments. Top-Level Doc Comments § A top-level doc comment is one that begins with two slashes and an exclamation point: //!; it documents the current module. It is a compile error if a top-level doc comment is not placed at the start of a container, before any expressions. tldoc_comments.zig//! This module provides functions for retrieving the current date and //! time with varying degrees of precision and accuracy. It does not //! depend on libc, but will use functions from it if available. const S = struct { //! Top level comments are allowed inside a container other than a module, //! but it is not very useful. Currently, when producing the package //! documentation, these comments are ignored. }; Values § values.zig// Top-level declarations are order-independent: const print = std.debug.print; const std = @import("std"); const os = std.os; const assert = std.debug.assert; pub fn main() void { // integers const one_plus_one: i32 = 1 + 1; print("1 + 1 = {}\n", .{one_plus_one}); // floats const seven_div_three: f32 = 7.0 / 3.0; print("7.0 / 3.0 = {}\n", .{seven_div_three}); // boolean print("{}\n{}\n{}\n", .{ true and false, true or false, !true, }); // optional var optional_value: ?[]const u8 = null; assert(optional_value == null); print("\noptional 1\ntype: {}\nvalue: {?s}\n", .{ @TypeOf(optional_value), optional_value, }); optional_value = "hi"; assert(optional_value != null); print("\noptional 2\ntype: {}\nvalue: {?s}\n", .{ @TypeOf(optional_value), optional_value, }); // error union var number_or_error: anyerror!i32 = error.ArgNotFound; print("\nerror union 1\ntype: {}\nvalue: {!}\n", .{ @TypeOf(number_or_error), number_or_error, }); number_or_error = 1234; print("\nerror union 2\ntype: {}\nvalue: {!}\n", .{ @TypeOf(number_or_error), number_or_error, }); }Shell$ zig build-exe values.zig $ ./values 1 + 1 = 2 7.0 / 3.0 = 2.3333333e0 false true false optional 1 type: ?[]const u8 value: null optional 2 type: ?[]const u8 value: hi error union 1 type: anyerror!i32 value: error.ArgNotFound error union 2 type: anyerror!i32 value: 1234 Primitive Types § Primitive Types Type C Equivalent Description i8 int8_t signed 8-bit integer u8 uint8_t unsigned 8-bit integer i16 int16_t signed 16-bit integer u16 uint16_t unsigned 16-bit integer i32 int32_t signed 32-bit integer u32 uint32_t unsigned 32-bit integer i64 int64_t signed 64-bit integer u64 uint64_t unsigned 64-bit integer i128 __int128 signed 128-bit integer u128 unsigned __int128 unsigned 128-bit integer isize intptr_t signed pointer sized integer usize uintptr_t, size_t unsigned pointer sized integer. Also see #5185 c_char char for ABI compatibility with C c_short short for ABI compatibility with C c_ushort unsigned short for ABI compatibility with C c_int int for ABI compatibility with C c_uint unsigned int for ABI compatibility with C c_long long for ABI compatibility with C c_ulong unsigned long for ABI compatibility with C c_longlong long long for ABI compatibility with C c_ulonglong unsigned long long for ABI compatibility with C c_longdouble long double for ABI compatibility with C f16 _Float16 16-bit floating point (10-bit mantissa) IEEE-754-2008 binary16 f32 float 32-bit floating point (23-bit mantissa) IEEE-754-2008 binary32 f64 double 64-bit floating point (52-bit mantissa) IEEE-754-2008 binary64 f80 double 80-bit floating point (64-bit mantissa) IEEE-754-2008 80-bit extended precision f128 _Float128 128-bit floating point (112-bit mantissa) IEEE-754-2008 binary128 bool bool true or false anyopaque void Used for type-erased pointers. void (none) Always the value void{} noreturn (none) the type of break, continue, return, unreachable, and while (true) {} type (none) the type of types anyerror (none) an error code comptime_int (none) Only allowed for comptime-known values. The type of integer literals. comptime_float (none) Only allowed for comptime-known values. The type of float literals. In addition to the integer types above, arbitrary bit-width integers can be referenced by using an identifier of i or u followed by digits. For example, the identifier i7 refers to a signed 7-bit integer. The maximum allowed bit-width of an integer type is 65535. See also: Integers Floats void Errors @Type Primitive Values § Primitive Values Name Description true and false bool values null used to set an optional type to null undefined used to leave a value unspecified See also: Optionals undefined String Literals and Unicode Code Point Literals § String literals are constant single-item Pointers to null-terminated byte arrays. The type of string literals encodes both the length, and the fact that they are null-terminated, and thus they can be coerced to both Slices and Null-Terminated Pointers. Dereferencing string literals converts them to Arrays. Because Zig source code is UTF-8 encoded, any non-ASCII bytes appearing within a string literal in source code carry their UTF-8 meaning into the content of the string in the Zig program; the bytes are not modified by the compiler. It is possible to embed non-UTF-8 bytes into a string literal using \xNN notation. Indexing into a string containing non-ASCII bytes returns individual bytes, whether valid UTF-8 or not. Unicode code point literals have type comptime_int, the same as Integer Literals. All Escape Sequences are valid in both string literals and Unicode code point literals. string_literals.zigconst print = @import("std").debug.print; const mem = @import("std").mem; // will be used to compare bytes pub fn main() void { const bytes = "hello"; print("{}\n", .{@TypeOf(bytes)}); // *const [5:0]u8 print("{d}\n", .{bytes.len}); // 5 print("{c}\n", .{bytes[1]}); // 'e' print("{d}\n", .{bytes[5]}); // 0 print("{}\n", .{'e' == '\x65'}); // true print("{d}\n", .{'\u{1f4a9}'}); // 128169 print("{d}\n", .{'💯'}); // 128175 print("{u}\n", .{'⚡'}); print("{}\n", .{mem.eql(u8, "hello", "h\x65llo")}); // true print("{}\n", .{mem.eql(u8, "💯", "\xf0\x9f\x92\xaf")}); // also true const invalid_utf8 = "\xff\xfe"; // non-UTF-8 strings are possible with \xNN notation. print("0x{x}\n", .{invalid_utf8[1]}); // indexing them returns individual bytes... print("0x{x}\n", .{"💯"[1]}); // ...as does indexing part-way through non-ASCII characters }Shell$ zig build-exe string_literals.zig $ ./string_literals *const [5:0]u8 5 e 0 true 128169 128175 ⚡ true true 0xfe 0x9f See also: Arrays Source Encoding Escape Sequences § Escape Sequences Escape Sequence Name \n Newline \r Carriage Return \t Tab \\ Backslash \' Single Quote \" Double Quote \xNN hexadecimal 8-bit byte value (2 digits) \u{NNNNNN} hexadecimal Unicode code point UTF-8 encoded (1 or more digits) Note that the maximum valid Unicode point is 0x10ffff. Multiline String Literals § Multiline string literals have no escapes and can span across multiple lines. To start a multiline string literal, use the \\ token. Just like a comment, the string literal goes until the end of the line. The end of the line is not included in the string literal. However, if the next line begins with \\ then a newline is appended and the string literal continues. multiline_string_literals.zigconst hello_world_in_c = \\#include <stdio.h> \\ \\int main(int argc, char **argv) { \\ printf("hello world\n"); \\ return 0; \\} ; See also: @embedFile Assignment § Use the const keyword to assign a value to an identifier: constant_identifier_cannot_change.zigconst x = 1234; fn foo() void { // It works at file scope as well as inside functions. const y = 5678; // Once assigned, an identifier cannot be changed. y += 1; } pub fn main() void { foo(); }Shell$ zig build-exe constant_identifier_cannot_change.zig /home/andy/src/zig/doc/langref/constant_identifier_cannot_change.zig:8:7: error: cannot assign to constant y += 1; ~~^~~~ referenced by: main: /home/andy/src/zig/doc/langref/constant_identifier_cannot_change.zig:12:5 callMain: /home/andy/src/zig/lib/std/start.zig:514:17 remaining reference traces hidden; use '-freference-trace' to see all reference traces const applies to all of the bytes that the identifier immediately addresses. Pointers have their own const-ness. If you need a variable that you can modify, use the var keyword: mutable_var.zigconst print = @import("std").debug.print; pub fn main() void { var y: i32 = 5678; y += 1; print("{d}", .{y}); }Shell$ zig build-exe mutable_var.zig $ ./mutable_var 5679 Variables must be initialized: var_must_be_initialized.zigpub fn main() void { var x: i32; x = 1; }Shell$ zig build-exe var_must_be_initialized.zig /home/andy/src/zig/doc/langref/var_must_be_initialized.zig:2:15: error: expected '=', found ';' var x: i32; ^ undefined § Use undefined to leave variables uninitialized: assign_undefined.zigconst print = @import("std").debug.print; pub fn main() void { var x: i32 = undefined; x = 1; print("{d}", .{x}); }Shell$ zig build-exe assign_undefined.zig $ ./assign_undefined 1 undefined can be coerced to any type. Once this happens, it is no longer possible to detect that the value is undefined. undefined means the value could be anything, even something that is nonsense according to the type. Translated into English, undefined means "Not a meaningful value. Using this value would be a bug. The value will be unused, or overwritten before being used." In Debug mode, Zig writes 0xaa bytes to undefined memory. This is to catch bugs early, and to help detect use of undefined memory in a debugger. However, this behavior is only an implementation feature, not a language semantic, so it is not guaranteed to be observable to code. Zig Test § Code written within one or more test declarations can be used to ensure behavior meets expectations: testing_introduction.zigconst std = @import("std"); test "expect addOne adds one to 41" { // The Standard Library contains useful functions to help create tests. // `expect` is a function that verifies its argument is true. // It will return an error if its argument is false to indicate a failure. // `try` is used to return an error to the test runner to notify it that the test failed. try std.testing.expect(addOne(41) == 42); } test addOne { // A test name can also be written using an identifier. // This is a doctest, and serves as documentation for `addOne`. try std.testing.expect(addOne(41) == 42); } /// The function `addOne` adds one to the number given as its argument. fn addOne(number: i32) i32 { return number + 1; }Shell$ zig test testing_introduction.zig 1/2 testing_introduction.test.expect addOne adds one to 41...OK 2/2 test'''
