["https://ziglang.org/es-AR/learn/getting-started"]
title = "Primeros pasos  ⚡  El Lenguaje de Programación Zig"
full_description = '''← Ir a Aprender Primeros pasos Lanzamientos etiquetados o compilación nightly?Instalación de Zig Descarga directa Configurar el PATH en WindowsConfiguración de la variable de entorno PATH Linux, macOS, BSDManejadores de paquetes WindowsmacOSLinuxCompilar desde las fuentesHerramientas recomendadas Marcado de sintaxis y LSP (Language Server Protocol)Ejecuta Hello WorldSiguientes pasos Lanzamientos etiquetados o compilación nightly?Zig no ha alcanzado la versión 1.0 aún y el ciclo de lanzamiento actual depende de la liberación de LLVM, lo cual ocurre cada ~6 meses. En términos prácticos, los lanzamientos de Zig tienden a ser muy separados entre si y ocasionalmente llegan a perder vigencia debido a la velocidad en el desarrollo del lenguaje..No hay problema con evaluar Zig utilizando alguna de las versiones etiquetadas, pero si decides que quieres continuar programando con Zig mas a fondo, te recomendamos actualizar a las compilaciones nightly(nightly builds), ya que de esa manera será más fácil obtener ayuda: la mayoría de los miembros de la comunidad y sitios como zig.guide siguen la rama "master" por las razones expuestas.La buena noticia es que es muy fácil de moverse de una versión de Zig a otra, o incluso tener múltiples versiones presentes en el sistema al mismo tiempo: las versiones de Zig son un simple directorio con todo lo necesario, el cual puede ser colocado en cualquier ubicación de tu sistema.Instalación de ZigDescarga directaEsta es la manera más simple de obtener Zig: descarga un paquete de Zig correspondiente a tu plataforma desde la página de descargas, extrae el contenido en el directorio de tu elección y añade la ruta al PATH para poder ejecutar zig desde cualquier ubicación.Configurar el PATH en WindowsPara configurar la ruta de Zig en el PATH de Windows ejecuta uno de los siguientes fragmentos de código en una terminal Powershell. Elige si quieres aplicar el cambio para todos los usuarios del sistema (lo cual requiere ejecutar Powershell con derechos de administrador) o solo para el usuario actual, y asegúrate de ajustar el fragmento de código para que apunte a la ubicación de tu copia de Zig. El ; antes de C: no es un error.Para todos los usuarios (Powershell ejecutado como administrador):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "Machine") + ";C:\your-path\zig-windows-x86_64-your-version", "Machine" ) User level (Powershell):[Environment]::SetEnvironmentVariable( "Path", [Environment]::GetEnvironmentVariable("Path", "User") + ";C:\your-path\zig-windows-x86_64-your-version", "User" ) Después de esto, reinicia la terminal de Powershell.Configuración de la variable de entorno PATH Linux, macOS, BSDAñade la ubicación del ejecutable zig a la variable de ambiente PATH.Generalmente, esto se hace agregando una linea de 'export' a tu script de inicio del shell (.profile, .zshrc, ...)export PATH=$PATH:~/path/to/zig Después de esto, reinicia tu shell o actualiza con el comando source.Manejadores de paquetesWindowsWinGetZig está disponible en WinGet.winget install -e --id zig.zig ChocolateyZig está disponible en Chocolatey.choco install zig ScoopZig está disponible en Scoop.scoop install zig Más reciente dev build:scoop bucket add versions scoop install versions/zig-dev macOSHomebrewÚltimo lanzamiento etiquetado:brew install zig MacPortsport install zig LinuxZig también se encuentra en muchos manejadores de paquetes para Linux. Aquí puedes encontrar una lista actualizada, pero ten en cuenta que algunos paquetes pueden incluir versiones no actualizadas de Zig.Compilar desde las fuentesAquí puedes encontrar mas información sobre como compilar Zig desde el código fuente para Linux, macOS y Windows.Herramientas recomendadasMarcado de sintaxis y LSP (Language Server Protocol)Los principales editores de texto incluyen marcado de sintaxis para Zig. En algunos casos se incluye en forma integrada y en otros casos se requiere la instalación de plugins.Si te interesa una integración mas profunda entre Zig y tu editor, dale un vistazo a zigtools/zls.Para mas opciones disponibles, revisa la sección de Herramientas.Ejecuta Hello WorldSi completaste la instalación correctamente, deberás poder invocar el compilador de Zig desde tu terminal de comandos. Probemos creando tu primer programa en Zig!Navega a tu directorio de proyectos y ejecuta:mkdir hello-world cd hello-world zig init Esto deberá arrojar:info: created build.zig info: created build.zig.zon info: created src/main.zig info: created src/root.zig info: see `zig build --help` for a menu of options Al ejecutar zig build run se compilará y ejecutará el programa, resultando en:All your codebase are belong to us. Run `zig build test` to run the tests. Felicidades, ahora tienes una instalación de Zig funcional!Siguientes pasosRevisa otros recursos presentes en la sección Aprender, asegúrate de encontrar la documentación para tu versión de Zig (nota: los compilados nightly corresponden a la documentación master) y considera leer zig.guide.Zig es un proyecto joven y desafortunadamente aún no tenemos la capacidad para producir documentación y materiales extensivos para todas sus características, así que considera unirte a alguna de las comunidades existentes de Zig para obtener ayuda. También da un vistazo a iniciativas como Zig SHOWTIME.Finalmente, si disfrutas Zig y quieres ayudar a acelerar su desarrollo, considera donar a la Zig Software Foundation .'''
year_published = 2025
clearnet = "https://ziglang.org/es-AR/learn/getting-started"
