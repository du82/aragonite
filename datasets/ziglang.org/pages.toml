["https://ziglang.org/it-IT/learn/overview"]
title = "Panoramica  ⚡  Zig Programming Language"
full_description = '''← Torna a Impara Panoramica Caratteristiche di rilievoUn linguaggio piccolo, sempliceConcentrati sul debuggare la tua applicazione, invece di debuggare la tua conoscenza del linguaggio di programmazione.L'intera sintassi di Zig è specificata con un file di grammatica PEG di 580 righe.Non c'è nessun controllo nascosto del flusso di esecuzione, nessuna allocazione dinamica nascosta, nessun preprocessore e nessuna macro. Se vedi del codice Zig e non sembra che stia chiamando una funzione, allora non lo sta facendo. Questo significa che il seguente codice chiamerà sicuramente solo foo() e poi bar(), e questo è garantito anche senza conoscere i tipi di dato utilizzati:var a = b + c.d; foo(); bar(); Esempi di controllo nascosto del flusso di esecuzione:D ha le funzioni @property, ovvero metodi che possono essere chiamati in un modo che sembra l'accesso a un attributo. Quindi, nell'esempio sopra, c.d potrebbe chiamare una funzione.C++, D e Rust supportano l'overload degli operatori, quindi l'operatore + potrebbe chiamare una funzione.C++, D e Go hanno eccezioni throw/catch, quindi foo() potrebbe lanciare un'eccezione, e impedire l'esecuzione di bar().Zig promuove la manutenibilità e leggibilità del codice permettendo di gestire il flusso di esecuzione esclusivamente con le parole chiave del linguaggio e le chiamate di funzioni.Prestazioni e sicurezza: scegline dueZig ha quattro modalità di build, che possono essere mescolate tra di loro e specificare la modalità di qualunque blocco o ambito di visibilità. Parametro Debug ReleaseSafe ReleaseFast ReleaseSmall Ottimizzazioni - migliora prestazioni, peggiora debug e tempo di compilazione -O3 -O3 -Os Controlli di sicurezza a runtime - peggiora prestazioni e dimensioni, crash invece di comportamenti non definiti (UB) On On Ecco come l'overflow di interi appare in fase di compilazione, a prescindere dalla modalità di build:1-integer-overflow.zigtest "integer overflow at compile time" { const x: u8 = 255; _ = x + 1; }Shell$ zig test 1-integer-overflow.zig assets/zig-code/features/1-integer-overflow.zig:3:11: error: overflow of integer type 'u8' with value '256' Ecco come appare durante l'esecuzione, nelle build con controlli di sicurezza attivi:2-integer-overflow-runtime.zigtest "integer overflow at runtime" { var x: u8 = 255; x += 1; }Shell$ zig test 2-integer-overflow-runtime.zig 1/1 2-integer-overflow-runtime.test.integer overflow at runtime...thread 3030394 panic: integer overflow /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/2-integer-overflow-runtime.zig:3:7: 0x103cc2e in test.integer overflow at runtime (test) x += 1; ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:157:25: 0x1047f99 in mainTerminal (test) if (test_fn.func()) |_| { ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/compiler/test_runner.zig:37:28: 0x103e01b in main (test) return mainTerminal(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:22: 0x103d159 in posixCallMainAndExit (test) root.main(); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:266:5: 0x103ccc1 in _start (test) asm volatile (switch (native_arch) { ^ ???:?:?: 0x0 in ??? (???) error: the following test command crashed: /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/.zig-cache/o/9e3bfcb661c1ce3251fa44aa9886f390/test Questi stack trace funzionano su tutte le piattaforme, incluse quelle freestanding.Con Zig puoi fare affidamento sulla modalità di build sicura, e disattivare selettivamente alcuni dei controlli di sicurezza se e dove sono necessarie maggiori prestazioni. Per esempio, il codice mostrato nell'esempio precedente può essere modificato in questo modo:3-undefined-behavior.zigtest "actually undefined behavior" { @setRuntimeSafety(false); var x: u8 = 255; x += 1; // XXX undefined behavior! }Zig usa i comportamenti non definiti come strumento estremamente preciso per prevenire bug e migliorare le prestazioni.A proposito di prestazioni, Zig è più veloce rispetto a C.L'implementazione di riferimento usa LLVM come backend per applicare lo stato dell'arte delle ottimizzazioni.Ciò che altri progetti chiamano "Link Time Optimization", Zig lo fa in automatico.Per la piattaforma native vengono abilitate le funzioni avanzate della CPU (-march=native), grazie al fatto che la cross-compilazione è un caso d'uso primario.Comportamenti non definiti (UB) accuratamente selezionati. Per esempio, in Zig sia gli interi con segno che quelli unsigned hanno comportamenti non definiti in caso di overflow, in contrasto a C dove ciò è vero solo per gli interi con segno. Questo facilita delle ottimizzazioni non disponibili in C.Zig espone direttamente un tipo di vettore SIMD, che rende semplice scrivere codice vettorizzato portabile.Zig non è un linguaggio completamente sicuro. Per chi fosse interessato ad approfondire il tema della sicurezza in Zig, tieni d'occhio le seguenti discussioni:enumerate all kinds of undefined behavior, even that which cannot be safety-checkedmake Debug and ReleaseSafe modes fully safeZig compete con C invece di dipendere da CLa libreria standard di Zig comunica con libc, ma può farne a meno. Ecco un "hello world":4-hello.zigconst std = @import("std"); pub fn main() void { std.debug.print("Hello, world!\n", .{}); }Shell$ zig build-exe 4-hello.zig $ ./4-hello Hello, world! Quando compilato con -O ReleaseSmall, senza simboli di debug, in modalità single-thread, il seguente codice produce un eseguibile statico di 9.8 KiB per la piattaforma x86_64-linux:$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded $ wc -c hello 9944 hello $ ldd hello not a dynamic executable Una build per Windows è persino più piccola, occupando solo 4096 byte:$ zig build-exe hello.zig -O ReleaseSmall -fstrip -fsingle-threaded -target x86_64-windows $ wc -c hello.exe 4096 hello.exe $ file hello.exe hello.exe: PE32+ executable (console) x86-64, for MS Windows Dichiarazioni di alto livello indipendenti dall'ordineLe dichiarazioni di alto livello come le variabili globali sono visibili indipendentemente dall'ordine con cui appaiono nel codice, e sono analizzate in modo lazy. I valori usati per inizializzare le variabili globali sono valutati in fase di compilazione.5-global-variables.zigvar y: i32 = add(10, x); const x: i32 = add(12, 34); test "global variables" { assert(x == 46); assert(y == 56); } fn add(a: i32, b: i32) i32 { return a + b; } const std = @import("std"); const assert = std.debug.assert;Shell$ zig test 5-global-variables.zig 1/1 5-global-variables.test.global variables...OK All 1 tests passed. Tipi opzionali invece di puntatori nulliIn altri linguaggi di programmazione, i riferimenti nulli sono la causa di molte eccezioni a runtime, e sono persino accusati di essere il più grave errore delle scienze informatiche.In Zig, di base i puntatori non possono essere nulli:6-null-to-ptr.zigtest "null @intToPtr" { const foo: *i32 = @ptrFromInt(0x0); _ = foo; }Shell$ zig test 6-null-to-ptr.zig assets/zig-code/features/6-null-to-ptr.zig:2:35: error: pointer type '*i32' does not allow address zero Ciononostante, ogni tipo di dato può essere reso un tipo opzionale anteponendo un ?:7-optional-syntax.zigconst std = @import("std"); const assert = std.debug.assert; test "null @intToPtr" { const ptr: ?*i32 = @ptrFromInt(0x0); assert(ptr == null); }Shell$ zig test 7-optional-syntax.zig 1/1 7-optional-syntax.test.null @intToPtr...OK All 1 tests passed. Per estrarre il valore da un tipo opzionale (unwrapping), si può usare orelse per fornire un valore di default:8-optional-orelse.zig// malloc prototype included for reference extern fn malloc(size: size_t) ?*u8; fn doAThing() ?*Foo { const ptr = malloc(1234) orelse return null; // ... }In alternativa si può usare un if:9-optional-if.zigfn doAThing(optional_foo: ?*Foo) void { // do some stuff if (optional_foo) |foo| { doSomethingWithFoo(foo); } // do some stuff }La stessa sintassi funziona con while:10-optional-while.zigconst std = @import("std"); pub fn main() void { const msg = "hello this is dog"; var it = std.mem.tokenize(u8, msg, " "); while (it.next()) |item| { std.debug.print("{s}\n", .{item}); } }Shell$ zig build-exe 10-optional-while.zig $ ./10-optional-while hello this is dog Gestione manuale della memoriaUna libreria scritta in Zig è adatta a qualunque contesto:Applicazioni desktopServer a bassa latenzaKernel di sistemi operativiSistemi embeddedSoftware real-time, come performance live, aeroplani, pacemakerIn browser web o plugin con WebAssemblyUtilizzo da altri linguaggi di programmazione, mediante l'ABI di CPer permettere questo risultato, i programmatori Zig devono gestire manualmente la memoria, e devono gestire gli errori di allocazione.Questo vale anche per la libreria standard di Zig. Ogni funzione che necessita di allocazioni dinamiche accetta come parametro un allocatore. Per questo motivo, la libreria standard di Zig può essere utilizzata anche su piattaforme hardware.In aggiunta a un nuovo approccio alla gestione degli errori, Zig fornisce defer e errdefer per rendere tutta la gestione di risorse - non solo la memoria - semplice e facilmente verificabile.Per un esempio di defer, vedi la sezione Integrazione con librerie C senza FFI/binding. Ecco un esempio di utilizzo di errdefer: 11-errdefer.zigconst Device = struct { name: []u8, fn create(allocator: *Allocator, id: u32) !Device { const device = try allocator.create(Device); errdefer allocator.destroy(device); device.name = try std.fmt.allocPrint(allocator, "Device(id={d})", id); errdefer allocator.free(device.name); if (id == 0) return error.ReservedDeviceId; return device; } };Un nuovo approccio alla gestione degli erroriGli errori sono valori, e non possono essere ignorati:12-errors-as-values.zigconst std = @import("std"); pub fn main() void { _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); }Shell$ zig build-exe 12-errors-as-values.zig /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: error: error union is discarded _ = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ~~~~~~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/12-errors-as-values.zig:4:30: note: consider using 'try', 'catch', or 'if' referenced by: callMain: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:514:17 callMainWithArgs: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:12 remaining reference traces hidden; use '-freference-trace' to see all reference traces Gli errori possono essere gestiti con catch:13-errors-catch.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch |err| label: { std.debug.print("unable to open file: {}\n", .{err}); const stderr = std.io.getStdErr(); break :label stderr; }; file.writeAll("all your codebase are belong to us\n") catch return; }Shell$ zig build-exe 13-errors-catch.zig $ ./13-errors-catch unable to open file: error.FileNotFound all your codebase are belong to us La parola chiave try è un'abbreviazione di catch |err| return err:14-errors-try.zigconst std = @import("std"); pub fn main() !void { const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); defer file.close(); try file.writeAll("all your codebase are belong to us\n"); }Shell$ zig build-exe 14-errors-try.zig $ ./14-errors-try error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x1066a70 in openatZ (14-errors-try) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1038294 in openFileZ (14-errors-try) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x1034d9e in openFile (14-errors-try) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/14-errors-try.zig:4:18: 0x1034be8 in main (14-errors-try) const file = try std.fs.cwd().openFile("does_not_exist/foo.txt", .{}); ^ Nota che questa è un Error Return Trace, non uno stack trace. Il codice non ha dovuto pagare il prezzo dell'unwinding dello stack per ottenere queste informazioni.La parola chiave switch usata su un errore garantisce che tutti i possibili errori siano gestiti:15-errors-switch.zigconst std = @import("std"); test "switch on error" { _ = parseInt("hi", 10) catch |err| switch (err) {}; } fn parseInt(buf: []const u8, radix: u8) !u64 { var x: u64 = 0; for (buf) |c| { const digit = try charToDigit(c); if (digit >= radix) { return error.DigitExceedsRadix; } x = try std.math.mul(u64, x, radix); x = try std.math.add(u64, x, digit); } return x; } fn charToDigit(c: u8) !u8 { const value = switch (c) { '0'...'9' => c - '0', 'A'...'Z' => c - 'A' + 10, 'a'...'z' => c - 'a' + 10, else => return error.InvalidCharacter, }; return value; }Shell$ zig build-exe 15-errors-switch.zig /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:509:45: error: root struct of file '15-errors-switch' has no member named 'main' switch (@typeInfo(@typeInfo(@TypeOf(root.main)).Fn.return_type.?)) { ~~~~^~~~~ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/15-errors-switch.zig:1:1: note: struct declared here const std = @import("std"); ^~~~~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:482:20: note: called from here return callMain(); ~~~~~~~~^~ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:438:36: note: called from here std.posix.exit(callMainWithArgs(argc, argv, envp)); ~~~~~~~~~~~~~~~~^~~~~~~~~~~~~~~~~~ referenced by: _start: /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/start.zig:351:40 remaining reference traces hidden; use '-freference-trace' to see all reference traces La parola chiave unreachable viene usata per dichiarare che non si verificherà alcun errore:16-unreachable.zigconst std = @import("std"); pub fn main() void { const file = std.fs.cwd().openFile("does_not_exist/foo.txt", .{}) catch unreachable; file.writeAll("all your codebase are belong to us\n") catch unreachable; }Shell$ zig build-exe 16-unreachable.zig $ ./16-unreachable thread 3030318 panic: attempt to unwrap error: FileNotFound /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/posix.zig:1768:23: 0x10699b0 in openatZ (16-unreachable) .NOENT => return error.FileNotFound, ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:880:16: 0x1039a94 in openFileZ (16-unreachable) const fd = try posix.openatZ(self.fd, sub_path, os_flags, 0); ^ /home/ci/deps/zig-linux-x86_64-0.13.0/lib/std/fs/Dir.zig:827:5: 0x103723e in openFile (16-unreachable) return self.openFileZ(&path_c, flags); ^ /home/ci/actions-runner-website/_work/www.ziglang.org/www.ziglang.org/assets/zig-code/features/16-unreachable.zig:4:77: 0x1034fcf in main (16-unreachable) const file = std.fs.cwd().openFile("does_not_e'''
